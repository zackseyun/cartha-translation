  text: וַ/תִּמְשֹׁ֤ךְ עֲלֵי/הֶם֙ שָׁנִ֣ים רַבּ֔וֹת וַ/תָּ֨עַד בָּ֧/ם בְּ/רוּחֲ/ךָ֛ בְּ/יַד נְבִיאֶ֖י/ךָ וְ/לֹ֣א הֶאֱזִ֑ינוּ וַֽ/תִּתְּנֵ֔/ם בְּ/יַ֖ד עַמֵּ֥י הָ/אֲרָצֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/030.yaml
  text: For many years you were patient with them and testified against them by your Spirit through your prophets[a], but they would not listen. So you gave them into the hand of the peoples of the lands.
translation:
  language: sw
  text: Kwa miaka mingi uliwavumilia na ukawaonya kwa Roho wako kupitia manabii wako, lakini hawakusikiliza. Kwa hiyo ukawatia mikononi mwa mataifa ya nchi mbalimbali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּמְשֹׁךְ עֲלֵיהֶם
  choice: uliwavumilia
  rationale: Katika muundo huu, משׁך pamoja na עַל huonyesha kurefusha muda wa ustahimilivu kabla ya hukumu. ‘Uliwavumilia’ ni Kiswahili cha asili kinachobeba maana ya subira ya muda mrefu.
- source_word: שָׁנִים רַבּוֹת
  choice: kwa miaka mingi
  rationale: Huhifadhi kwa uwazi msisitizo wa muda mrefu.
- source_word: וַתָּעַד בָּם
  choice: ukawaonya
  rationale: Hifili ya עוד inaweza kumaanisha kuonya, kushuhudia dhidi ya, au kusihi kwa ushuhuda. Katika muktadha wa manabii wanaowaita watu watubu, ‘ukawaonya’ hutoa maana kuu kwa Kiswahili cha kawaida bila kuondoa uzito wa agano.
- source_word: בְּרוּחֲךָ
  choice: kwa Roho wako
  rationale: Muktadha wa usemi wa kinabii unaonyesha Roho wa Mungu akiwa njia au wakala wa onyo; herufi kubwa inatambulisha rejeo hilo bila kuongeza maelezo ya baadaye ya kimafundisho.
- source_word: בְּיַד נְבִיאֶיךָ
  choice: kupitia manabii wako
  rationale: Nahau ya Kiebrania ‘kwa mkono wa’ hapa huonyesha uwakala; ‘kupitia’ ni usemi wa kawaida na sahihi wa Kiswahili.
- source_word: וְלֹא הֶאֱזִינוּ
  choice: lakini hawakusikiliza
  rationale: האזין ni kusikiliza kwa makini au kutega sikio. Kauli hii ni ya asili na katika muktadha huonyesha kutokuitikia maonyo yaliyotolewa mara nyingi.
- source_word: וַתִּתְּנֵם
  choice: Kwa hiyo ukawatia
  rationale: Waw mfululizo huendeleza simulizi na hapa tendo linafuata kutokusikiliza kwao kama matokeo; ‘Kwa hiyo’ huonyesha uhusiano huo kwa uwazi.
- source_word: בְּיַד
  choice: mikononi mwa
  rationale: Huhifadhi picha ya nahau ya Kiebrania ya kuwekwa chini ya mamlaka au nguvu za wengine, kwa namna inayoeleweka katika Kiswahili.
- source_word: עַמֵּי הָאֲרָצוֹת
  choice: mataifa ya nchi mbalimbali
  rationale: עַמִּים hapa ni vikundi vya kitaifa au watu wa mataifa, na wingi wa אֲרָצוֹת unaelekea kwa nchi au maeneo mbalimbali, si dunia yote.
theological_decisions:
- issue: Rejeo la ‘Roho wako’
  choice: Roho wa Mungu kama wakala wa ujumbe wa kinabii
  alternative: roho kwa maana ya mwelekeo au pumzi ya Mungu
  rationale: Muunganiko wa ‘kwa Roho wako kupitia manabii wako’ unaonyesha kwa kawaida kwamba Mungu aliwaonya kupitia kazi ya Roho wake katika manabii. Tafsiri haiongezi ufafanuzi wa kimadhehebu.
- issue: Nguvu ya וַתָּעַד בָּם
  choice: ukawaonya
  alternative: ukashuhudia dhidi yao
  rationale: Neno linaweza kuwa na maana ya kisheria au ya agano ya kushuhudia dhidi ya mtu, lakini katika Kiswahili ‘ukashuhudia dhidi yao’ linaweza kusikika kana kwamba Mungu alikuwa shahidi katika kesi isiyoelezwa. ‘Ukawaonya’ huwasilisha kazi ya ujumbe wa kinabii katika muktadha huku ikihifadhi lengo la kuwaita wasikilize.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeepuka tafsiri ngumu ya neno kwa neno, lakini imehifadhi taswira ya ‘mikononi mwa’ na mfuatano wa ustahimilivu, onyo, kutokusikiliza, na kutiwa chini ya mataifa mengine.
