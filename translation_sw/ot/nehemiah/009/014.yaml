base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/014.yaml
  text: You made your holy Sabbath known to them[b][a], and you commanded them commandments and statutes and a law by the hand of Moses your servant.
translation:
  language: sw
  text: Uliwajulisha Sabato yako takatifu, na kupitia Musa mtumishi wako[b] ukawapa amri, kanuni na sheria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mafundisho” badala ya “sheria”; neno la Kiebrania תוֹרָה linaweza kusisitiza kufundisha pamoja na wajibu wa kisheria.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kwa mkono wa Musa mtumishi wako,” nahau yenye maana ya “kupitia Musa mtumishi wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת קָדְשְׁךָ
  choice: Sabato yako takatifu
  rationale: “Sabato” huhifadhi maana maalumu ya siku ya pumziko ya agano; “takatifu” hutoa kazi ya kisifa ya קָדְשְׁךָ kwa Kiswahili cha kawaida.
- source_word: הוֹדַעַתָ
  choice: Uliwajulisha
  rationale: Kauli ya kusababisha ya ידע ina maana ya kuwafanya wajue; “uliwajulisha” ni ya asili na huhifadhi nguvu hiyo.
- source_word: מִצְוֹת
  choice: amri
  rationale: Neno hili humaanisha mambo yaliyoamriwa; “amri” linafaa katika muktadha wa kisheria na wa agano.
- source_word: חֻקִּים
  choice: masharti
  rationale: “Masharti” huonyesha kanuni au matakwa yaliyowekwa, huku likitofautishwa kwa kawaida na “amri” na “sheria.”
- source_word: תוֹרָה
  choice: sheria
  rationale: Katika mfululizo huu wa maneno ya kisheria, “sheria” ndiyo maana inayotawala; maana pana ya “mafundisho” imehifadhiwa katika tanbihi.
- source_word: צִוִּיתָ לָהֶם
  choice: ukawapa
  rationale: Ingawa kitenzi chenyewe ni “kuamuru,” muundo wa Kiswahili “kuwaamuru amri” si wa kawaida. “Ukawapa amri” huwasilisha tendo la Mungu la kuwawekea maagizo bila kufanya sentensi kuwa nzito.
- source_word: בְּיַד מֹשֶׁה עַבְדֶּךָ
  choice: kupitia Musa mtumishi wako
  rationale: Nahau ya Kiebrania, kihalisi “kwa mkono wa Musa,” huonyesha uwakala au upatanishi; “kupitia Musa” ndiyo kauli wazi na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Utoaji wa mfululizo מִצְוֹת וְחֻקִּים וְתוֹרָה
  choice: amri, masharti na sheria
  alternative: maagizo, kanuni na mafundisho
  rationale: Maneno matatu yamehifadhiwa kama makundi yanayotofautiana badala ya kuunganishwa, ili kudumisha uzito wa ufunuo wa Mungu wa agano na wa kisheria kupitia Musa.
- issue: Maana ya תוֹרָה
  choice: sheria katika maandishi, huku “mafundisho” yakiwa katika tanbihi
  alternative: mafundisho katika maandishi
  rationale: Muktadha wa amri na masharti unaunga mkono “sheria,” lakini תוֹרָה pia lina maana pana ya mafundisho; tanbihi huhifadhi upana huo bila kuamua zaidi ya ushahidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “kupitia Musa” umetumiwa badala ya nahau isiyo ya kawaida “kwa mkono wa Musa,” na “ukawapa amri” huepuka urudiaji mgumu wa “ukawaamuru amri.”
