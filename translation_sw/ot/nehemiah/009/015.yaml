base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/015.yaml
  text: You gave them bread from heaven for their hunger[a], and you brought out water from the rock for their thirst, and you told them to go in to possess the land that you had sworn to give them.
translation:
  language: sw
  text: Uliwapa mkate kutoka mbinguni walipokuwa na njaa, na ukayatokeza maji kutoka mwambani walipokuwa na kiu. Ukawaambia waingie kuimiliki nchi ambayo ulikuwa umeapa kuwapa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maneno halisi, Kiebrania husema, “uliinua mkono wako ili kuwapa [nchi hiyo].” Kuinua mkono ni nahau ya kuapa.
    reason: Kuhifadhi taswira halisi ya nahau ya Kiebrania huku matini kuu ikitoa maana yake kwa Kiswahili cha asili.
lexical_decisions:
- source_word: לֶחֶם מִשָּׁמַיִם
  choice: mkate kutoka mbinguni
  rationale: Inahifadhi taswira halisi ya Kiebrania ya ‘mkate’ badala ya kuitaja mana moja kwa moja, huku ‘kutoka mbinguni’ ikieleza chanzo chake kwa Kiswahili cha kawaida.
- source_word: לִרְעָבָם
  choice: walipokuwa na njaa
  rationale: Muundo huu wa asili unaonyesha hali yao kwa uwazi; tafsiri ya neno kwa neno ‘kwa njaa yao’ ingesikika isiyo ya kawaida katika Kiswahili.
- source_word: מַיִם מִסֶּלַע
  choice: maji kutoka mwambani
  rationale: ‘Mwambani’ ni usemi wa kawaida wa Kiswahili unaohifadhi wazo la maji kutoka katika mwamba bila kulazimisha utofautishaji wa ‘mwamba fulani’ ambao Kiebrania hakielezi wazi.
- source_word: הוֹצֵאתָ
  choice: ukawatolea
  rationale: Inahifadhi maana sababishi ya kitenzi—Mungu aliyafanya maji yatoke kwa ajili yao—kwa namna fupi na ya asili.
- source_word: לִצְמָאָם
  choice: walipokuwa na kiu
  rationale: Inalingana kimuundo na ‘walipokuwa na njaa’ na kueleza hali yao kwa Kiswahili kinachoeleweka.
- source_word: וַתֹּאמֶר לָהֶם
  choice: Ukawaambia
  rationale: Ni tafsiri ya kawaida ya ‘ukasema kwao’ inapofuatiwa na jambo walilotakiwa kufanya, bila kuongeza nguvu ya ‘kuwaamuru.’
- source_word: לָבוֹא
  choice: waingie
  rationale: Inaonyesha mwendo wa kuingia katika nchi kwa uwazi na kwa lugha ya kawaida.
- source_word: לָרֶשֶׁת
  choice: kuimiliki
  rationale: Katika muktadha wa nchi, ירשׁ humaanisha kuchukua au kuwa na milki; ‘kuimiliki’ huhifadhi maana hiyo bila kuifanya ionekane urithi wa kupokelewa bila tendo.
- source_word: נָשָׂאתָ אֶת יָדְךָ
  choice: umekuwa umeapa
  rationale: Nahau ya kuinua mkono ina maana ya kuapa. Kiswahili cha matini kuu kinatoa maana ya nahau kwa kawaida, huku taswira halisi ikihifadhiwa katika tanbihi.
- source_word: לָתֵת לָהֶם
  choice: kuwapa
  rationale: Ni tafsiri ya moja kwa moja, fupi na ya kawaida ya kishazi cha Kiebrania.
theological_decisions:
- issue: Nahau ya kiapo kuhusu Mungu kuahidi kuwapa nchi
  choice: Kutafsiri maana ya nahau kuwa ‘umeapa’ katika matini kuu
  alternative: ‘ulikuwa umeinua mkono wako kuwapa’
  rationale: Kiebrania kinatumia taswira ya kuinua mkono kama tendo la kuapa. Kiswahili cha moja kwa moja kingekuwa kigumu na kingeweza kuficha maana; ‘umeapa’ huhifadhi uzito wa agano bila kuingiza fundisho la ziada, na tanbihi inaonyesha taswira ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Miundo sambamba ‘walipokuwa na njaa’ na ‘walipokuwa na kiu’ inaleta usomaji wa asili; sentensi mbili zinazuia mstari mrefu kupita kiasi. Msamiati wa ‘mkate,’ ‘mwamba,’ ‘kuimiliki,’ na ‘kuapa’ unafaa kwa wasomaji wa kawaida na unabaki karibu na ushahidi wa Kiebrania.
