base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/020.yaml
  text: You gave your good Spirit to instruct them[a], and you did not withhold your manna from their mouth, and you gave them water for their thirst.
translation:
  language: sw
  text: Uliwapa Roho wako mwema ili kuwapa ufahamu[a]. Hukuizuia mana yako isiingie vinywani mwao, nawe ukawapa maji kwa ajili ya kiu yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho yako njema.” Neno la Kiebrania רוּחַ linaweza kutafsiriwa “Roho” au “roho”; hapa huenda linamrejelea Roho wa Mungu aliyewapa Israeli mwongozo na ufahamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחֲךָ הַטּוֹבָה
  choice: Roho wako mwema
  rationale: Katika muktadha huu רוּחַ inaelekea kumaanisha Roho wa Mungu anayewaongoza na kuwafundisha watu wake. Herufi kubwa na upatanisho wa kisarufi wa nafsi vinaonyesha uelewa huo, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: לְהַשְׂכִּילָם
  choice: ili kuwapa ufahamu
  rationale: Hifili ya שׂכל ina maana ya kusababisha waelewe au kuwapa utambuzi. Kauli hii ya Kiswahili inahifadhi maana ya kisababishi na inasomeka kwa urahisi.
- source_word: מַנְךָ
  choice: mana yako
  rationale: Neno hili linataja chakula maalumu ambacho Mungu aliwapa Waisraeli jangwani; istilahi iliyozoeleka ya “mana” ni sahihi na wazi.
- source_word: מָנַעְתָּ מִפִּיהֶם
  choice: hukuzuia ... isifike vinywani mwao
  rationale: Tafsiri hii inahifadhi maana ya מנע, “kuzuia/kunyima,” pamoja na taswira halisi ya Kiebrania ya mana kufika vinywani mwao, bila kutumia muundo usio wa kawaida wa Kiswahili.
- source_word: מַיִם
  choice: maji
  rationale: Hili ndilo neno la kawaida na la moja kwa moja la Kiswahili.
- source_word: לִצְמָאָם
  choice: kwa ajili ya kiu yao
  rationale: Kauli hii inaonyesha kwamba maji yalitolewa kukidhi kiu yao na inahifadhi uhusiano unaoonyeshwa na kiambishi לְ.
theological_decisions:
- issue: Iwapo רוּחֲךָ הַטּוֹבָה inamrejelea Roho wa Mungu kama nafsi au roho kwa maana pana
  choice: Roho wako mwema
  alternative: roho yako njema
  rationale: Muktadha wa uongozi na utoaji wa ufahamu unaunga mkono rejeo kwa Roho wa Mungu. Hata hivyo, רוּחַ linaweza pia kutafsiriwa bila kulifanya jina maalumu, kwa hiyo uwezekano huo umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki chenye mtindo wa heshima na unaoeleweka kwa urahisi. Muundo “isifike vinywani mwao” umetumiwa kuhifadhi taswira halisi ya Kiebrania kwa Kiswahili cha kawaida; alama ya tanbihi [a] imewekwa mara baada ya kishazi kinachohusika.
