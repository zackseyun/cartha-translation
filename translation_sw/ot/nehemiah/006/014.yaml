  text: זָכְרָ֧/ה אֱלֹהַ֛/י לְ/טוֹבִיָּ֥ה וּ/לְ/סַנְבַלַּ֖ט כְּ/מַעֲשָׂ֣י/ו אֵ֑לֶּה וְ/גַ֨ם לְ/נוֹעַדְיָ֤ה הַ/נְּבִיאָה֙ וּ/לְ/יֶ֣תֶר הַ/נְּבִיאִ֔ים אֲשֶׁ֥ר הָי֖וּ מְיָֽרְאִ֥ים אוֹתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/014.yaml
  text: Remember Tobiah and Sanballat[a], my God, according to these deeds of theirs, and also Noadiah the prophetess and the rest of the prophets who were trying to make me afraid.
translation:
  language: sw
  text: Mungu wangu, uwakumbuke Tobia na Sanbalati kulingana na matendo haya yao, na pia Noadia, nabii wa kike, na manabii wengine, ambao walikuwa wakinitia hofu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliokuwa wakijaribu kunifanya niogope.”
    reason: Mbadala huu hufuata tafsiri ya kiingereza ya audit trail na hueleza matokeo yaliyokusudiwa; matini kuu hutafsiri moja kwa moja zaidi maana ya usababishi ya kitenzi cha Kiebrania.
lexical_decisions:
- source_word: זָכְרָה
  choice: wakumbuke
  rationale: Ni ombi la moja kwa moja kwa Mungu. Kiambishi cha yambwa “wa-” kinarejelea Tobia na Sanbalati, huku “kumbuka” kikihifadhi lugha ya Kiebrania bila kuongeza hukumu iliyo wazi.
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Huwasilisha kwa uwazi kiambishi cha nafsi ya kwanza umoja na sauti ya sala binafsi.
- source_word: לְטוֹבִיָּה וּלְסַנְבַלַּט
  choice: Tobia na Sanbalati
  rationale: Majina yameandikwa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia; kiambishi לְ kinaeleweka kupitia kitenzi chenye yambwa “wakumbuke.”
- source_word: כְּמַעֲשָׂיו אֵלֶּה
  choice: kulingana na matendo yao haya
  rationale: “Kulingana na” huhifadhi wazo la ulinganifu au kipimo katika כְּ bila kutamka wazi hukumu. “Yao” huwasilisha maana ya pamoja inayowarejelea wapinzani wawili waliotajwa.
- source_word: וְגַם
  choice: na pia
  rationale: Huhifadhi nguvu ya nyongeza ya maneno ya Kiebrania.
- source_word: לְנוֹעַדְיָה הַנְּבִיאָה
  choice: Noadia nabii wa kike
  rationale: Jina limetoholewa, na “nabii wa kike” huhifadhi wazi jinsia iliyoainishwa na umbo la Kiebrania הַנְּבִיאָה.
- source_word: וּלְיֶתֶר הַנְּבִיאִים
  choice: pamoja na manabii wengine
  rationale: Huwasilisha kwa Kiswahili cha kawaida kundi lililobaki zaidi ya Noadia.
- source_word: אֲשֶׁר הָיוּ מְיָרְאִים אוֹתִי
  choice: waliokuwa wakijaribu kunifanya niogope
  rationale: Muundo “waliokuwa wakijaribu” unaonyesha tendo lililoendelea na kusudi lao, na “kunifanya niogope” huhifadhi maana ya kusababisha hofu.
theological_decisions:
- issue: Sauti ya ombi la Mungu kuwakumbuka wapinzani
  choice: Ombi limetafsiriwa kama Mungu kuwakumbuka kulingana na matendo yao, bila kuongeza maneno ya hukumu.
  alternative: “Uwahukumu” au “uwawajibishe kwa matendo yao.”
  rationale: Kiebrania kina uzito wa ombi dhidi ya wapinzani, lakini hakitamki moja kwa moja hukumu; tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha umbo la sala ya moja kwa moja na huepuka istilahi nzito zisizo za lazima.
