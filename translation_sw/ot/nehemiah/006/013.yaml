  yaml_path: translation/ot/nehemiah/006/013.yaml
  text: 'He was hired for this purpose: that I should become afraid and act that way and sin[a], so that they would have grounds for an evil report[b], in order that they might reproach me.'
translation:
  language: sw
  text: 'Alikuwa ameajiriwa kwa ajili ya hili: ili niogope, nifanye hivyo, na nitende dhambi; ili wapate sababu ya kuharibu sifa yangu na kunitukana.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “na hilo lingekuwa kwao kuwa jina baya.” Inaelekea maana yake ni kwamba dhambi ya Nehemia ingewapa adui zake sababu ya kumharibia sifa na kumtukana. Pia, “ameajiriwa” yaweza kutafsiriwa “amelipwa” au “amehongwa”; neno la Kiebrania שָׂכוּר kwa kawaida humaanisha “aliyeajiriwa” au “aliyelipwa,” ingawa “aliyehongwa” huweka wazi zaidi nia ya ufisadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: kwa kusudi hili / ili
  rationale: Neno hili limetumiwa mara tatu kuonyesha kusudi au matokeo yaliyokusudiwa. Tofauti ndogo ya uwasilishaji inaleta Kiswahili cha kawaida bila kupoteza uhusiano wa kimakusudi.
- source_word: שָׂכוּר
  choice: ameajiriwa
  rationale: Hii ndiyo maana ya moja kwa moja ya umbo la Kiebrania, yaani mtu aliyelipwa kufanya jambo; muktadha wenyewe unaonyesha nia ovu bila kulazimisha maana ya ‘amehongwa’ katika matini kuu.
- source_word: הוּא
  choice: alikuwa
  rationale: Kiima cha nafsi ya tatu kimejumuishwa kiasili katika kitenzi cha Kiswahili; muktadha unamtambulisha Shemaya kuwa ndiye aliyeajiriwa.
- source_word: אִירָא
  choice: niogope
  rationale: Baada ya לְמַעַן, kitenzi kinaonyesha athari iliyokusudiwa kwa Nehemia.
- source_word: וְאֶעֱשֶׂה כֵן
  choice: nitende hivyo
  rationale: Huhifadhi maana ya moja kwa moja ya ‘nifanye hivyo’ na kurejelea kitendo kilichopendekezwa katika muktadha.
- source_word: וְחָטָאתִי
  choice: na kutenda dhambi
  rationale: Huonyesha matokeo yaliyokusudiwa ya kitendo hicho kwa Kiswahili cha wazi na cha kawaida.
- source_word: וְהָיָה לָהֶם לְשֵׁם רָע
  choice: nao wapate sababu ya kunipa jina baya
  rationale: Nahau hiyo kihalisi inasema jambo hilo lingekuwa kwao ‘kwa jina baya.’ Tafsiri hii inaonyesha kuwa dhambi ya Nehemia ingewapa wapinzani wake msingi wa kumharibia sifa, huku ‘jina baya’ likihifadhi taswira ya Kiebrania.
- source_word: שֵׁם רָע
  choice: jina baya
  rationale: Huhifadhi maana halisi ya ‘jina’ pamoja na wazo la sifa mbaya au taarifa ya kudhalilisha.
- source_word: יְחָרְפוּנִי
  choice: wanitukane
  rationale: Kitenzi חרף kina maana ya kutukana, kushutumu kwa dharau, au kuaibisha; ‘wanitukane’ ni cha kawaida na chenye nguvu inayofaa katika Kiswahili.
