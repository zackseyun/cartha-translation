translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa kusudi unaorudiwa katika Kiebrania umehifadhiwa kwa ‘kwa kusudi hili’ na ‘ili.’
