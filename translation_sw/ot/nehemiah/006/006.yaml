  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na madai ya Kiebrania: yaliyomo katika barua, uvumi unaosikika miongoni mwa mataifa, uthibitisho unaodaiwa kutoka kwa Gashmu, mpango wa kuasi, kujengwa upya kwa ukuta, na madai ya kuwa mfalme. Kauli hizi zinaendelea kuwekwa ndani ya nukuu, hivyo hazithibitishwi na msimulizi.'
