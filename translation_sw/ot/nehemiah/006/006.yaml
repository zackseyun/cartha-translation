  terminology: “Mataifa,” “Wayahudi,” “kuasi,” “ukuta,” na “mfalme” ni istilahi sahihi na thabiti. Kutumia “Gashmu” kunafuata umbo la konsonanti za Kiebrania; tanbihi inaeleza kwa usahihi umbo linalojulikana zaidi, Geshemu. “Habari hizi” hutoa maana ya kimuktadha ya דברים bila kudai kwamba uvumi ni wa kweli.
