base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/006.yaml
  text: It was written in it[a], “It is being reported among the nations—and Geshem also says it—that you and the Jews are planning to rebel. Therefore you are rebuilding the wall, and according to these reports you are to become their king.”
translation:
  language: sw
  text: 'Humo ilikuwa imeandikwa: “Habari zinaenea miongoni mwa mataifa, naye Gashmu[a] pia anasema hivyo, kwamba wewe na Wayahudi mnapanga kuasi. Ndiyo sababu unaujenga upya ukuta; na kulingana na habari hizi, wewe utakuwa mfalme wao.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: Gashmu; jina hili pia huandikwa Geshemu.'
    reason: Tofauti ya namna ya kuandika jina hilo kwa herufi za Kiswahili.
lexical_decisions:
- source_word: כָּתוּב בָּהּ
  choice: Humo ilikuwa imeandikwa
  rationale: Muundo wa kutendwa unaonyesha yaliyokuwamo katika barua; wakati uliopita unafaa muktadha wa simulizi.
- source_word: בַּגּוֹיִם נִשְׁמָע
  choice: Habari zinaenea miongoni mwa mataifa
  rationale: Nifali ya שׁמע ina maana ya jambo kusikika au kuripotiwa. Kiswahili hiki kinaeleza uvumi unaosambaa bila kuufanya kuwa taarifa iliyothibitishwa.
- source_word: וְגַשְׁמוּ אֹמֵר
  choice: naye Gashmu pia anasema hivyo
  rationale: Neno “pia” linaonyesha kwamba Gashmu anaongezwa kama mwenye kuthibitisha habari hiyo; “hivyo” linaunganisha kauli yake na uvumi uliotangulia.
- source_word: חֹשְׁבִים לִמְרוֹד
  choice: mnapanga kuasi
  rationale: חשב pamoja na kitenzi-jina hapa huonyesha kusudia au kupanga kufanya jambo.
- source_word: עַל כֵּן
  choice: Ndiyo sababu
  rationale: Huonyesha hitimisho la madai kwamba ujenzi wa ukuta unatokana na mpango wa kuasi.
- source_word: בּוֹנֶה הַחוֹמָה
  choice: unaujenga upya ukuta
  rationale: Ingawa בנה kimsingi ni kujenga, muktadha wa Nehemia unaonyesha kurejeshwa kwa ukuta uliobomolewa.
- source_word: וְאַתָּה הֹוֶה לָהֶם לְמֶלֶךְ
  choice: wewe utakuwa mfalme wao
  rationale: הוה pamoja na ל inaweza kueleza kuwa au kuwa kitu fulani; wakati ujao unawasilisha matokeo yanayodaiwa katika barua bila kuthibitisha madai hayo.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: kulingana na habari hizi
  rationale: דברים hapa inarejelea madai au habari zilizokuwa zikienea, si maneno peke yake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa urahisi. Usemi “habari zinaenea” ni wa kawaida na unaonyesha uvumi unaosambaa; sentensi inadumisha kwamba haya ni madai ya barua, si kauli ya msimulizi kwamba mashtaka hayo ni ya kweli.
