base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/009.yaml
  text: For all of them were trying to frighten us[a], saying, “Their hands will grow weak from the work, and it will not be done.” But now[b], strengthen my hands.
translation:
  language: sw
  text: Kwa maana wote walikuwa wakijaribu kututisha, wakisema, “Mikono yao italegea katika kazi, nayo haitafanyika.” Lakini sasa, itie nguvu mikono yangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kifungu cha mwisho ni sala fupi kwa Mungu: “Lakini sasa, itie nguvu mikono yangu.” Uwekaji wa irabu wa Kiebrania unaunga mkono ombi hili la moja kwa moja, ingawa wengine wameelewa maneno hayo kwa njia tofauti.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְיָרְאִים אֹתָנוּ
  choice: walikuwa wakijaribu kututisha
  rationale: Hifili ya ירא ina maana ya kusababisha hofu; umbo la wakati unaoendelea pamoja na muktadha linaonyesha jitihada endelevu za kuwatisha Nehemia na wenzake. Kiwakilishi cha wingi katika אוֹתָנוּ kimehifadhiwa kwa “kutu-”.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Ni utangulizi wa kawaida wa maneno au wazo linalofuata.
- source_word: יִרְפּוּ יְדֵיהֶם
  choice: Mikono yao italegea
  rationale: Huhifadhi taswira ya Kiebrania ya mikono kulegea, yaani kupoteza nguvu au moyo wa kuendelea, na ni nahau inayoeleweka kwa Kiswahili.
- source_word: מִן־הַמְּלָאכָה
  choice: katika kazi
  rationale: Katika Kiswahili, “mikono kulegea katika kazi” hutoa kwa kawaida wazo la kulegea na kuiacha kazi, bila kulazimisha kihusishi cha Kiebrania neno kwa neno.
- source_word: וְלֹא תֵעָשֶׂה
  choice: nayo haitafanyika
  rationale: Nifali ya עשה imetafsiriwa kwa kauli tendwa, huku “nayo” ikirejelea kazi ya ujenzi.
- source_word: וְעַתָּה
  choice: Lakini sasa
  rationale: Huonyesha ugeuko wa wazi kutoka kusimulia nia ya wapinzani hadi ombi fupi la Nehemia.
- source_word: חַזֵּק אֶת־יָדָי
  choice: itie nguvu mikono yangu
  rationale: Huhifadhi taswira ya mikono na mwangwi wa “mikono yao italegea.” Kiswahili cha kawaida hutumia “itia nguvu” kwa maana ya kuimarisha.
theological_decisions:
- issue: Ugeuko kutoka simulizi hadi sala ya moja kwa moja
  choice: 'Kifungu cha mwisho kimetafsiriwa kama ombi la moja kwa moja kwa Mungu: “Lakini sasa, itie nguvu mikono yangu.”'
  alternative: Kukitafsiri kama kujihimiza au taarifa ya wakati uliopita, kama “Lakini sasa niliitia nguvu mikono yangu.”
  rationale: Uwekaji wa irabu wa Maandiko ya Kimasora unaonyesha amri ya nafsi ya pili umoja wa kiume, ambayo kwa kawaida ni sala fupi kwa Mungu; pia inapatana na sala fupi nyingine za Nehemia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Taswira ya mikono kulegea na kutiwa nguvu imehifadhiwa kwa sababu inaunganisha nia ya wapinzani na sala ya Nehemia.
