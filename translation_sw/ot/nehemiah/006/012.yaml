base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/012.yaml
  text: Then I recognized, and behold, God had not sent him; rather, he had spoken the prophecy against me because Tobiah and Sanballat had hired him.
translation:
  language: sw
  text: Ndipo nikatambua kwamba Mungu hakuwa amemtuma; bali alikuwa ametoa unabii huo dhidi yangu kwa sababu Tobia na Sanbalati walikuwa wamemwajiri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַכִּירָה
  choice: nikatambua
  rationale: Kitenzi נכר katika muktadha huu kinaonyesha Nehemia aligundua au kutambua ukweli kuhusu Shemaya; “nikatambua” ni ya asili na hudumisha maana hiyo.
- source_word: וְהִנֵּה
  choice: kwamba
  rationale: Hapa הִנֵּה inaleta jambo lililogunduliwa. Kiswahili cha kawaida hulieleza kwa kishazi cha “kwamba” badala ya tafsiri ngumu ya moja kwa moja kama “tazama.”
- source_word: הַנְּבוּאָה
  choice: unabii huo
  rationale: Nomino yenye kibainishi inarejelea ujumbe wa kinabii uliotajwa katika muktadha; “huo” huonyesha rejeo hilo bila kuongeza maelezo.
- source_word: שְׂכָרוֹ
  choice: walikuwa wamemwajiri
  rationale: Kitenzi שׂכר chenye kiambishi cha yambwa kinamaanisha kwamba Tobia na Sanbalati walimlipa au kumwajiri Shemaya; wakati timilifu uliopita unaonyesha kitendo kilichotangulia utambuzi wa Nehemia.
theological_decisions:
- issue: Chanzo cha unabii wa Shemaya
  choice: Mungu hakuwa amemtuma; bali alikuwa amesema unabii huo dhidi yangu
  alternative: Mungu hakuwa amemtuma, ingawa alikuwa ametabiri dhidi yangu
  rationale: Muundo wa Kiebrania unakanusha utume wa kimungu na kuhusianisha ujumbe huo na kuajiriwa kwake. “Bali” hudumisha utofautishaji bila kuuita unabii huo ujumbe wa kweli kutoka kwa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa wazi kwa wasomaji wa kawaida huku ikidumisha utofautishaji na mpangilio wa hoja ya Kiebrania.
