  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/גַם נְבִיאִ֡ים הֶעֱמַ֣דְתָּ לִ/קְרֹא֩ עָלֶ֨י/ךָ בִֽ/ירוּשָׁלִַ֜ם לֵ/אמֹ֗ר מֶ֚לֶךְ בִּֽ/יהוּדָ֔ה וְ/עַתָּה֙ יִשָּׁמַ֣ע לַ/מֶּ֔לֶךְ כַּ/דְּבָרִ֣ים הָ/אֵ֑לֶּה וְ/עַתָּ֣ה לְכָ֔/ה וְ/נִֽוָּעֲצָ֖ה יַחְדָּֽו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/007.yaml
  text: And you have even appointed prophets to proclaim concerning you in Jerusalem[a], saying, ‘There is a king in Judah!’ And now these reports will be heard by the king. So now, come[b], and let us consult together.
translation:
  language: sw
  text: Tena umewateua manabii watangaze habari zinazokuhusu huko Yerusalemu, wakisema, “Kuna mfalme katika Yuda!”[a] Sasa mfalme atasikia habari hizi.[b] Basi njoo, tushauriane pamoja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa Kiebrania ni kifupi kabisa: “mfalme katika Yuda.” Muktadha unadokeza madai kwamba Nehemia anajifanya mfalme, lakini jina lake halipo katika maneno haya yaliyonukuliwa.'
    reason: alternative_reading
  - marker: b
    text: Au, “maneno haya,” “mambo haya,” au “taarifa kama hizi.” Neno la Kiebrania linaweza kumaanisha maneno, mambo, au habari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Tena
  rationale: Inaonyesha nyongeza yenye mkazo katika mfululizo wa mashtaka, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: נְבִיאִים
  choice: manabii
  rationale: Hili ndilo neno la kawaida la נְבִיאִים; muktadha hautoi sababu ya kulifanya kuwa ‘wajumbe’ au ‘wasemaji’ kwa ujumla.
- source_word: הֶעֱמַדְתָּ
  choice: umewateua
  rationale: Hifili ya עמד hapa ina maana ya kuwaweka watu katika jukumu fulani; ‘umewateua’ huwasilisha kazi waliyopewa kwa Kiswahili cha asili.
- source_word: לִקְרֹא עָלֶיךָ
  choice: watangaze habari zinazokuhusu
  rationale: קרא pamoja na על humaanisha kutangaza kuhusu mtu. Kauli hii inahifadhi uhusiano huo bila kudokeza kwamba manabii walimtangaza Nehemia kuwa mfalme moja kwa moja.
- source_word: בִירוּשָׁלַם
  choice: huko Yerusalemu
  rationale: Tafsiri ya mahali iliyo wazi; ‘huko’ inasikika kwa kawaida katika simulizi la Kiswahili.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Ni utangulizi wa kawaida wa maneno yaliyonukuliwa.
- source_word: מֶלֶךְ בִּיהוּדָה
  choice: Kuna mfalme katika Yuda!
  rationale: Kiebrania ni kifupi na hakina kitenzi. Tafsiri hii inahifadhi madai ya kuwepo kwa mfalme bila kuingiza jina la Nehemia katika maneno yaliyonukuliwa.
- source_word: וְעַתָּה יִשָּׁמַע לַמֶּלֶךְ כַּדְּבָרִים הָאֵלֶּה
  choice: Sasa mfalme atasikia habari hizi
  rationale: Muundo tendaji ni wa asili zaidi katika Kiswahili, huku ukihifadhi maana kwamba taarifa hizo zitamfikia mfalme. ‘Habari’ inafaa kwa muktadha wa taarifa za kisiasa, ingawa דְּבָרִים ina maana pana zaidi.
- source_word: וְעַתָּה לְכָה
  choice: Basi njoo
  rationale: ‘Basi’ linaonyesha hatua ya kimantiki kutoka tishio la taarifa hiyo hadi mwaliko wa kukutana; ‘njoo’ ni amri ya moja kwa moja.
- source_word: וְנִוָּעֲצָה יַחְדָּו
  choice: tushauriane pamoja
  rationale: Umbo la hiari la Niphal linaonyesha kushauriana kwa pande zote; ‘pamoja’ linawakilisha יַחְדָּו waziwazi.
theological_decisions:
- issue: Asili ya shtaka la kudai ufalme
  choice: Maneno yaliyonukuliwa yametafsiriwa ‘Kuna mfalme katika Yuda!’ bila kuongeza jina la Nehemia.
  alternative: ‘Wewe ni mfalme katika Yuda!’ au ‘Nehemia ni mfalme katika Yuda!’
  rationale: Muktadha unaonyesha kwamba Nehemia ndiye anayelengwa, lakini maneno ya Kiebrania yenyewe ni mafupi—‘mfalme katika Yuda’—wala hayamtaji ndani ya nukuu. Tafsiri inahifadhi nguvu na utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Sentensi zimetungwa kwa mtiririko wa asili bila kupunguza sauti ya shtaka na tishio la kisiasa.
