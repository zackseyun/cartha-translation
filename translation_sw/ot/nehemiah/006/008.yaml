  text: וָ/אֶשְׁלְחָ֤/ה אֵלָי/ו֙ לֵ/אמֹ֔ר לֹ֤א נִֽהְיָה֙ כַּ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֖ר אַתָּ֣ה אוֹמֵ֑ר כִּ֥י מִֽ/לִּבְּ/ךָ֖ אַתָּ֥ה בוֹדָֽא/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/008.yaml
  text: So I sent to him[a], saying, “These things that you are saying have not happened, for you are inventing them out of your own heart.”
translation:
  language: sw
  text: Basi nikampelekea ujumbe nikisema, “Mambo haya unayosema hayajatokea, kwa maana wewe unayazua moyoni mwako[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “unayabuni kutokana na mawazo yako mwenyewe.”
    reason: Njia nyingine ya kutafsiri בדא na maana pana ya לֵב kama mawazo au nia ya ndani.
lexical_decisions:
- source_word: וָאֶשְׁלְחָה אֵלָיו
  choice: Basi nikampelekea ujumbe
  rationale: Muundo wa wayyiqtol unaendeleza simulizi. Kiswahili huhitaji kutaja kitu kilichopelekwa ili sentensi iwe ya kawaida; “ujumbe” linaeleza maana iliyodokezwa bila kuongeza mada mpya.
- source_word: לֵאמֹר
  choice: nikisema
  rationale: Huu ni muundo wa kawaida wa kuingiza maneno yaliyonukuliwa moja kwa moja.
- source_word: לֹא נִהְיָה כַּדְּבָרִים הָאֵלֶּה
  choice: Mambo haya ... hayajatokea
  rationale: היה hapa inakanusha kwamba mambo yanayodaiwa yalitokea kweli; “hayajatokea” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: אֲשֶׁר אַתָּה אוֹמֵר
  choice: unayosema
  rationale: Kitenzi shiriki cha Kiebrania kinaonyesha madai yanayoendelea kutolewa.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinaingiza sababu ya kuyakataa madai hayo.
- source_word: מִלִּבְּךָ
  choice: moyoni mwako
  rationale: Huhifadhi taswira ya Kiebrania ya moyo kama kitovu cha mawazo na makusudi, huku kikisikika kwa kawaida katika Kiswahili.
- source_word: אַתָּה בּוֹדָאם
  choice: wewe unayazua
  rationale: Kiwakilishi cha msisitizo אַתָּה kinawakilishwa na “wewe,” na בדא lina maana ya kutunga au kuzusha jambo lisilo la kweli.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na hadhi ya kifasihi bila kutumia lugha ya kizamani. Msisitizo wa kiwakilishi cha Kiebrania umehifadhiwa katika “wewe unayazua.”
