source:
  edition: WLC
  text: וַ/יְהִ֣י כַ/אֲשֶׁ֣ר נִשְׁמַ֣ע לְ/סַנְבַלַּ֣ט וְ֠/טוֹבִיָּה וּ/לְ/גֶ֨שֶׁם הָֽ/עַרְבִ֜י וּ/לְ/יֶ֣תֶר אֹֽיְבֵ֗י/נוּ כִּ֤י בָנִ֨יתִי֙ אֶת הַ֣/חוֹמָ֔ה וְ/לֹא נ֥וֹתַר בָּ֖/הּ פָּ֑רֶץ גַּ֚ם עַד הָ/עֵ֣ת הַ/הִ֔יא דְּלָת֖וֹת לֹא הֶעֱמַ֥דְתִּי בַ/שְּׁעָרִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/001.yaml
  text: When Sanballat[a], Tobiah, Geshem the Arab[b], and the rest of our enemies heard that I had rebuilt the wall and that no breach was left in it—though up to that time I had not set up the doors in the gates—
translation:
  language: sw
  text: Sanbalati, Tobia, Geshemu Mwarabu[b], na adui zetu waliobaki waliposikia kwamba nilikuwa nimeujenga upya ukuta[a], na kwamba halikubaki pengo lolote ndani yake—ingawa hadi wakati huo sikuwa nimeweka milango katika malango—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nilikuwa nimeujenga ukuta.” Kitenzi cha Kiebrania ni “kujenga”; “kujenga upya” limetumiwa kwa sababu muktadha unaeleza kurejeshwa kwa ukuta uliokuwapo.
    reason: lexical_alternative
  - marker: b
    text: Yaani, Geshemu, mtu wa Arabia.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: waliposikia
  rationale: Muundo wa wakati unaingizwa kwa kishazi cha ‘waliposikia’; hii ni Kiswahili cha kawaida na haihitaji kuongeza kiashiria kisicho wazi kama ‘basi’.
- source_word: נִשְׁמַע לְ
  choice: waliposikia
  rationale: Ingawa Kiebrania kinaweza kufasiriwa kihalisi ‘ilipowasikiwa,’ Kiswahili cha kawaida huwafanya waliotajwa kuwa kiima cha kitenzi ‘kusikia’.
- source_word: סַנְבַלַּט ... טוֹבִיָּה ... גֶשֶׁם הָעַרְבִי
  choice: Sanbalati, Tobia, Geshemu Mwarabu
  rationale: Majina yamenukuliwa kwa maumbo yanayofaa mfumo wa sauti wa Kiswahili; הָעַרְבִי ni utambulisho wa kikabila au kijiografia.
- source_word: יֶתֶר אֹיְבֵינוּ
  choice: adui zetu wengine
  rationale: Huwasilisha kwa kawaida maana ya ‘waliobaki miongoni mwa adui zetu’.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa kiunganishi kinaanzisha habari waliyosikia, si sababu.
- source_word: בָנִיתִי אֶת־הַחוֹמָה
  choice: nilikuwa nimeujenga upya ukuta
  rationale: Kitenzi chenyewe ni ‘kujenga,’ lakini muktadha ni kurejeshwa kwa ukuta uliokuwapo; ‘kujenga upya’ huwasilisha jambo hilo bila kuficha maana ya msingi, ambayo imewekwa katika tanbihi.
- source_word: לֹא נוֹתַר בָּהּ פָּרֶץ
  choice: halikubaki pengo lolote ndani yake
  rationale: פֶּרֶץ ni ufa mkubwa, sehemu iliyovunjika, au pengo katika ukuta; ‘pengo’ ni wazi na la kawaida katika muktadha huu.
- source_word: גַּם עַד הָעֵת הַהִיא
  choice: ingawa mpaka wakati huo
  rationale: ‘Ingawa’ huonyesha kwa ufasaha hali ya kukubali jambo linalowekea taarifa iliyotangulia mpaka fulani.
- source_word: דְּלָתוֹת לֹא הֶעֱמַדְתִּי בַּשְּׁעָרִים
  choice: sikuwa nimeweka milango kwenye malango
  rationale: Hutofautisha milango inayowekwa na malango yenyewe kama miundo au nafasi za kuingilia, bila kubainisha isivyohitajika namna ya kuifunga.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na heshima. Sentensi imeachwa wazi mwishoni kwa kistari kirefu kwa sababu aya inayofuata inakamilisha muundo wa sentensi. ‘Milango’ na ‘malango’ zimetumiwa kutunza tofauti kati ya vibao vya kufungia na miundo ya kuingilia.
