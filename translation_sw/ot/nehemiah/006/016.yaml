source:
  edition: WLC
  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֤ר שָֽׁמְעוּ֙ כָּל א֣וֹיְבֵ֔י/נוּ וַ/יִּֽרְא֗וּ כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִֽיבֹתֵ֔י/נוּ וַ/יִּפְּל֥וּ מְאֹ֖ד בְּ/עֵינֵי/הֶ֑ם וַ/יֵּ֣דְע֔וּ כִּ֚י מֵ/אֵ֣ת אֱלֹהֵ֔י/נוּ נֶעֶשְׂתָ֖ה הַ/מְּלָאכָ֥ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/016.yaml
  text: And it happened that when all our enemies heard[a], and all the nations around us saw, they fell greatly in their own eyes, and they knew that this work had been done by our God.
translation:
  language: sw
  text: Ikawa, adui zetu wote waliposikia, na mataifa yote yaliyotuzunguka yalipoona, wakashuka sana machoni pao wenyewe, wakatambua kwamba kazi hii ilikuwa imefanywa na Mungu wetu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Inahifadhi fomula ya mpito katika simulizi kwa Kiswahili cha kibiblia kinachoeleweka bila kutumia lugha nzito ya kizamani.
- source_word: כַּאֲשֶׁר
  choice: walipo-
  rationale: Muundo huu wa wakati unaonyesha kwa kawaida kwamba mwitikio ulitokea waliposikia na walipoona, bila kusisitiza kwamba ulikuwa wa papo hapo.
- source_word: שָׁמְעוּ
  choice: waliposikia
  rationale: Inatafsiri kitenzi moja kwa moja na kuacha kitu walichosikia kieleweke kutokana na muktadha, kama ilivyo katika Kiebrania.
- source_word: כָּל אֹיְבֵינוּ
  choice: adui zetu wote
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kirai chenye kiambishi cha umilikaji.
- source_word: וַיִּרְאוּ
  choice: yalipoona
  rationale: Inahifadhi maana ya msingi ya kitenzi 'kuona'; kitu kilichoonekana kinaeleweka katika muktadha kuwa kukamilika kwa kazi.
- source_word: כָּל הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵינוּ
  choice: mataifa yote yaliyotuzunguka
  rationale: ‘Mataifa’ linafaa kwa makundi ya watu yaliyowazunguka, bila kuingiza maana ya baadaye ya kidini ya ‘Mataifa’ kwa maana ya wasio Wayahudi.
- source_word: וַיִּפְּלוּ מְאֹד בְּעֵינֵיהֶם
  choice: walijiona kuwa duni sana
  rationale: Hutoa maana ya nahau kwamba walishuka sana katika kujitathmini au walivunjika moyo, huku tanbihi ikihifadhi picha halisi ya ‘kuanguka machoni pao wenyewe.’
- source_word: וַיֵּדְעוּ
  choice: wakatambua
  rationale: Katika muktadha huu kitenzi kinaonyesha kufikia utambuzi au kukiri chanzo cha mafanikio; ‘wakatambua’ ni cha asili na hudumisha nguvu hiyo.
- source_word: כִּי
  choice: kwamba
  rationale: Kinatumika kwa kawaida kutambulisha yaliyokuwa maudhui ya utambuzi wao.
- source_word: מֵאֵת אֱלֹהֵינוּ
  choice: na Mungu wetu
  rationale: Muundo wa Kiswahili unaonyesha Mungu kuwa mtendaji au wakala wa kukamilishwa kwa kazi; ‘na’ hapa ina maana ya agency, si ushirika.
- source_word: נֶעֶשְׂתָה
  choice: ilikuwa imefanywa
  rationale: Inawakilisha hali ya kutendwa na tendo lililokuwa limekamilika kabla ya kutambuliwa na mataifa.
- source_word: הַמְּלָאכָה הַזֹּאת
  choice: kazi hii
  rationale: Ni usemi mpana na wa kawaida unaorejelea mradi wa kujenga ukuta bila kuubana zaidi ya matini.
theological_decisions:
- issue: Uwakala wa Mungu katika kukamilika kwa kazi
  choice: kazi hii ilikuwa imefanywa na Mungu wetu
  alternative: kazi hii ilikuwa imetokana na Mungu wetu / ilikuwa imefanywa kwa msaada wa Mungu wetu
  rationale: Kihusishi מֵאֵת kinaweza kuonyesha chanzo au wakala. Muundo uliochaguliwa unasisitiza kwamba mataifa yalitambua kazi hiyo kuwa imetimizwa kwa utendaji wa Mungu, bila kufafanua utaratibu wa kimiujiza ambao matini haiuelezi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ikawa’ hudumisha mpito wa simulizi; ‘walijiona kuwa duni sana’ ni ya asili kwa wasomaji wa kawaida, na tanbihi huhifadhi sitiari ya Kiebrania na utata wake wa kihisia.
