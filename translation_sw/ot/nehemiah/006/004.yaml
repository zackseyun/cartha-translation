translation:
  language: sw
  text: Walituma ujumbe kwangu mara nne kwa namna hiyo[a], nami nikawajibu kwa namna hiyohiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu, “kulingana na neno/jambo hili” katika vifungu vyote viwili; kirai kinaweza kurejelea ujumbe uleule uliotumwa na jibu lilelile lililorudishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: Walituma ujumbe
  rationale: Kitenzi kinamaanisha ‘kutuma’; ingawa yambwa halisi halijatajwa katika Kiebrania, muktadha wa mawasiliano unafanya ‘ujumbe’ kuwa nyongeza ya asili katika Kiswahili.
- source_word: אֵלַי
  choice: kwangu
  rationale: Kihusishi chenye kiambishi cha nafsi ya kwanza kina maana ya kuelekea au kutumwa kwa msemaji.
- source_word: כַּדָּבָר הַזֶּה
  choice: kwa namna hiyo
  rationale: Kirai hiki ni halisi ‘kulingana na neno/jambo hili’; hapa kinaelekeza kwenye mawasiliano yale yale bila kulazimisha ikiwa kinachosisitizwa ni maneno, ujumbe, au namna.
- source_word: אַרְבַּע פְּעָמִים
  choice: mara nne
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya idadi ya matukio.
- source_word: וָאָשִׁיב
  choice: nami nikawajibu
  rationale: Hifili ya שוב katika mawasiliano inaweza kumaanisha kurudisha jibu; ‘kuwajibu’ ni Kiswahili cha kawaida na sahihi.
- source_word: אוֹתָם
  choice: -wa- katika ‘nikawajibu’
  rationale: Kiwakilishi cha yambwa kinawarejelea waliotuma au wajumbe wao, na kimewakilishwa kwa kiambishi cha yambwa cha Kiswahili.
- source_word: כַּדָּבָר הַזֶּה
  choice: kwa namna iyo hiyo
  rationale: Kurudiwa kwa kirai kilekile kunaonyesha kwamba jibu la Nehemia lilibaki kama la awali; ‘iyo hiyo’ huhifadhi msisitizo wa ufanano.
