id: NEH.6.2
reference: Nehemiah 6:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח סַנְבַלַּ֤ט וְ/גֶ֨שֶׁם֙ אֵלַ֣/י לֵ/אמֹ֔ר לְכָ֞/ה וְ/נִֽוָּעֲדָ֥ה יַחְדָּ֛ו בַּ/כְּפִירִ֖ים בְּ/בִקְעַ֣ת אוֹנ֑וֹ וְ/הֵ֨מָּה֙ חֹֽשְׁבִ֔ים לַ/עֲשׂ֥וֹת לִ֖/י רָעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/002.yaml
  text: So Sanballat and Geshem sent to me[a], saying, “Come[b], and let us meet together in the villages in the plain of Ono.” But they were planning to do me harm.
translation:
  language: sw
  text: Basi Sanbalati na Geshemu wakanitumia ujumbe wakisema, “Njoo, tukutane pamoja katika vijiji[a] vya uwanda[b] wa Ono.” Lakini walikuwa wakipanga kunidhuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda “katika Kefirimu,” ikiwa neno la Kiebrania linachukuliwa kuwa jina la mahali badala ya “katika vijiji.”
    reason: alternative_reading
  - marker: b
    text: “Uwanda” pia unaweza kutafsiriwa “bonde.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: wakanitumia ujumbe
  rationale: Kitenzi cha umoja chenye wahusika wawili ni mtindo wa kawaida wa Kiebrania; Kiswahili hutumia wingi. Neno “ujumbe” limewekwa wazi kwa kuwa linadokezwa na “wakisema,” na hufanya sentensi iwe ya kawaida katika Kiswahili.
- source_word: סַנְבַלַּט וְגֶשֶׁם
  choice: Sanbalati na Geshemu
  rationale: Majina ya watu yamenukuliwa kwa maumbo yanayopatana na matamshi na desturi za Kiswahili.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Huu ni usemi wa kawaida unaoanzisha maneno yaliyonukuliwa moja kwa moja.
- source_word: לְכָה
  choice: Njoo
  rationale: Ingawa mzizi unaweza kumaanisha kwenda au kutembea, katika mwaliko huu amri hiyo kwa kawaida humaanisha “Njoo.”
- source_word: וְנִוָּעֲדָה יַחְדָּו
  choice: tukutane pamoja
  rationale: Muundo huu unaonyesha kukutana kwa makubaliano; “pamoja” huhifadhi wazo la יַחְדָּו.
- source_word: בַּכְּפִירִים
  choice: katika vijiji
  rationale: Neno hili limeeleweka kuwa nomino ya kawaida inayomaanisha vijiji au vitongoji. Uwezekano wa kulichukua kuwa jina la mahali umehifadhiwa katika tanbihi.
- source_word: בְּבִקְעַת אוֹנוֹ
  choice: vya uwanda wa Ono
  rationale: בִּקְעָה humaanisha eneo pana la chini, yaani uwanda au bonde. “Uwanda” ni wazi na wa kawaida katika muktadha huu; “bonde” limetajwa katika tanbihi.
- source_word: וְהֵמָּה חֹשְׁבִים
  choice: Lakini walikuwa wakipanga
  rationale: “Lakini” huonyesha tofauti kati ya mwaliko wao na nia yao halisi. Kitenzi hapa kinamaanisha kupanga au kukusudia, si kufikiri tu.
- source_word: לַעֲשׂוֹת לִי רָעָה
  choice: kunidhuru
  rationale: Katika muktadha huu רָעָה ni madhara yaliyokusudiwa dhidi ya Nehemia. “Kunidhuru” ni Kiswahili cha asili bila kubainisha aina ya madhara ambayo matini haitaji.
