translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Majina yameandikwa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili. Kiwakilishi “mwanawe” kimehifadhiwa badala ya kutaja mwenye mwana kwa jina, ili kutodai uhakika usioonyeshwa moja kwa moja na kirai cha Kiebrania.
