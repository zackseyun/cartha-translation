base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/018.yaml
  text: For many in Judah were bound by oath to him[a], because he was the son-in-law of Shecaniah son of Arah[b], and Jehohanan his son had taken the daughter of Meshullam son of Berechiah as his wife.
translation:
  language: sw
  text: Kwa maana watu wengi katika Yuda walikuwa wamefungwa kwake kwa kiapo[a], kwa sababu alikuwa mwana-mkwe wa Shekania mwana wa Ara, na Yehohanani mwanawe alikuwa amemwoa[b] binti ya Meshulamu mwana wa Berekia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “watu wengi katika Yuda walikuwa wenye kiapo kwake,” yaani, walikuwa na wajibu kwake kwa sababu ya kiapo.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “alikuwa amemchukua binti ya Meshulamu mwana wa Berekia”; hii ni nahau ya kawaida yenye maana ya kumwoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים בִּיהוּדָה
  choice: watu wengi katika Yuda
  rationale: Kirai hiki kinaonyesha watu wengi waliokuwa ndani ya Yuda au jumuiya yake; “katika Yuda” hudumisha maana ya mahali kwa Kiswahili cha kawaida.
- source_word: בַּעֲלֵי שְׁבוּעָה לוֹ
  choice: walikuwa wamefungwa kwake kwa kiapo
  rationale: Hii ni nahau yenye maana ya kuwa na wajibu kwa mtu kutokana na kiapo; tafsiri hii ni ya asili kwa Kiswahili na inahifadhi uzito wa wajibu huo.
- source_word: כִּי ... כִּי
  choice: Kwa maana ... kwa sababu
  rationale: כִּי ya kwanza inaanzisha maelezo yanayohusiana na mstari uliotangulia, na ya pili inatoa sababu ya hali iliyoelezwa.
- source_word: חָתָן הוּא לִשְׁכַנְיָה
  choice: alikuwa mkwe wa Shekania
  rationale: חָתָן hapa inaonyesha uhusiano wa ndoa. “Mkwe” ni sahihi lakini huacha wazi kwa kiasi fulani upande mahususi wa uhusiano huo, kama neno la Kiebrania linavyoweza kufanya katika muktadha wa ukoo.
- source_word: וִיהוֹחָנָן בְּנוֹ
  choice: na Yehohanani mwanawe
  rationale: Kiwakilishi cha Kiebrania kimehifadhiwa kwa “mwanawe” bila kuongeza jina la mwenye mwana, hivyo kutosuluhisha kimya kimya rejeleo ambalo muundo wake unaweza kuhitaji muktadha.
- source_word: לָקַח אֶת בַּת
  choice: alikuwa amemwoa ... binti
  rationale: Katika muktadha wa ndoa, “kumchukua binti” ni nahau inayomaanisha kumwoa; “amemwoa” huwasilisha maana hiyo wazi na kwa Kiswahili cha kawaida.
- source_word: בַּת מְשֻׁלָּם בֶּן בֶּרֶכְיָה
  choice: binti ya Meshulamu mwana wa Berekia
  rationale: 'Muundo huu unahifadhi mlolongo wa ukoo: mwanamke huyo ni binti ya Meshulamu, ambaye ni mwana wa Berekia.'
