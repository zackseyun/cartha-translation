base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/017.yaml
  text: Also[a], in those days the nobles of Judah were sending many letters to Tobiah, and those from Tobiah were coming to them.
translation:
  language: sw
  text: Pia, katika siku hizo wakuu wa Yuda walikuwa wakituma barua zao nyingi kwa Tobia, na barua kutoka kwa Tobia zilikuwa zikiwafikia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם
  choice: Pia
  rationale: Linaonyesha jambo la nyongeza linalohusiana na masimulizi yanayozunguka mstari huu.
- source_word: בַּיָּמִים הָהֵם
  choice: katika siku hizo
  rationale: Ni usemi wa kawaida wa wakati unaohifadhi mtindo wa simulizi la Kiebrania na unasikika kwa kawaida katika Kiswahili.
- source_word: מַרְבִּים
  choice: walikuwa wakituma ... nyingi
  rationale: Katika muundo huu pamoja na ‘barua zao,’ neno linaonyesha tendo lililoendelea au lililorudiwa la kupeleka barua nyingi.
- source_word: חֹרֵי יְהוּדָה
  choice: wakuu wa Yuda
  rationale: Neno linawarejelea watu mashuhuri wenye cheo na ushawishi wa kijamii au kisiasa; ‘wakuu’ ni la kawaida na lenye hadhi katika Kiswahili.
- source_word: אִגְּרֹתֵיהֶם
  choice: barua
  rationale: Hili ni neno la kawaida la Kiswahili kwa mawasiliano yaliyoandikwa; umilikaji unaeleweka kutokana na mhusika anayetuma.
- source_word: הוֹלְכוֹת עַל טוֹבִיָּה
  choice: wakituma ... kwa Tobia
  rationale: Kiebrania kihalisi kinasema barua ‘zilikuwa zikienda kwa Tobia’; tafsiri hii inaeleza kwa kawaida kitendo cha kupeleka mawasiliano bila kubadili mwelekeo wake.
- source_word: וַאֲשֶׁר לְטוֹבִיָּה
  choice: barua kutoka kwa Tobia
  rationale: Muundo huu ni wa kidokezo na kihalisi ni ‘vilivyo vya Tobia’; nomino ‘barua’ inaeleweka kutokana na kishazi cha kwanza na imetajwa wazi kwa ufasaha wa Kiswahili.
- source_word: בָּאוֹת אֲלֵיהֶם
  choice: zilikuwa zikiwafikia
  rationale: Kauli endelevu inaonyesha kuwasili kulikoendelea au kurudiwa, nayo ‘kuwafikia’ ni njia ya kawaida ya kusema barua ziliwasili kwao.
