base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/015.yaml
  text: So the wall was finished on the twenty-fifth day of Elul[b][a], in fifty-two days.
translation:
  language: sw
  text: Basi ukuta ukakamilika siku ya ishirini na tano ya mwezi wa Eluli[a], katika siku hamsini na mbili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eluli ni mwezi wa sita katika kalenda ya Kiebrania.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: ukakamilika
  rationale: Kitenzi cha Kiebrania מן שלם katika qal kinaonyesha ukuta kufikia hali ya kuwa kamili. “Ukakamilika” ni Kiswahili cha kawaida na cha heshima, huku kikidumisha ukuta kama kiima.
- source_word: הַחוֹמָה
  choice: ukuta
  rationale: Nomino yenye uainisho inarejelea ukuta wa Yerusalemu unaojadiliwa katika muktadha wa karibu.
- source_word: בְּעֶשְׂרִים וַחֲמִשָּׁה לֶאֱלוּל
  choice: siku ya ishirini na tano ya mwezi wa Eluli
  rationale: Muundo huu ni tarehe. Neno “mwezi” linaongezwa kwa uwazi wa kawaida katika Kiswahili, na jina Eluli linatoholewa badala ya kutafsiriwa.
- source_word: לַחֲמִשִּׁים וּשְׁנַיִם יוֹם
  choice: kwa muda wa siku hamsini na mbili
  rationale: Lamed pamoja na hesabu linaonyesha muda wote uliotumika. “Kwa muda wa” huepuka maana ya mfuatano tu ambayo “baada ya” ingeweza kudokeza.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Basi” linaendeleza mtiririko wa simulizi wa וַ bila kufanya uhusiano wake kuwa wa kisababu kupita kiasi. Mbadala wa kileksia wa “ukamalizika” haukupewa tanbihi kwa kuwa “ukakamilika” tayari huwakilisha maana ya kitenzi kwa usahihi na kwa kawaida.
