  text: Also they kept speaking of his good deeds in my presence[a], and they kept reporting my words to him[b]. Tobiah sent letters to frighten me.
translation:
  language: sw
  text: Pia walikuwa wakiendelea kueleza mema yake mbele yangu[a], na walikuwa wakimpelekea maneno yangu[b]. Tobia alituma barua ili kunitia hofu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walikuwa wakisema mambo mema juu yake” au “walikuwa wakisifu sifa zake njema.” Usemi wa Kiebrania ni mpana kuliko matendo pekee; hapa unaonyesha jinsi walivyompendekeza Tobia mbele ya Nehemia.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “walikuwa wakiyatoa maneno yangu kwake”; hii ni nahau ya kuyafikisha au kuyapeleka maneno ya Nehemia kwa Tobia.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Tena
  rationale: Inaendeleza simulizi kwa maana ya nyongeza kwa Kiswahili cha kawaida.
- source_word: טוֹבֹתָיו
  choice: mema yake
  rationale: Nomino hii ya wingi ina maana pana ya mambo mema, matendo mema, au sifa njema za Tobia; “mema yake” huhifadhi upana huo.
- source_word: הָיוּ אֹמְרִים
  choice: waliendelea kuyasifia
  rationale: Muundo wa היה pamoja na participle unaonyesha tendo endelevu au la kurudiwa; katika muktadha walikuwa wakinena kwa kumpongeza Tobia.
- source_word: לְפָנַי
  choice: mbele yangu
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya usemi wa Kiebrania, ikimaanisha wakiwa mbele ya Nehemia.
- source_word: וּדְבָרַי
  choice: maneno yangu
  rationale: Huhifadhi maana ya msingi ya דבר na kuonyesha kwamba walimfikishia Tobia yale Nehemia aliyosema.
- source_word: הָיוּ מוֹצִיאִים לוֹ
  choice: waliendelea kumpelekea
  rationale: Kitenzi kwa maana halisi ni ‘kutoa/kupeleka nje,’ lakini hapa ni nahau ya kuwasilisha habari kwa mtu; “kumpelekea” huhifadhi taswira ya kupeleka bila kuwa ngumu.
- source_word: אִגְּרוֹת
  choice: barua
  rationale: Ni neno la kawaida na sahihi kwa mawasiliano yaliyoandikwa.
- source_word: שָׁלַח
  choice: alituma
  rationale: Hutoa kwa uwazi tendo rahisi la simulizi.
- source_word: לְיָרְאֵנִי
  choice: ili kunitia hofu
  rationale: Huonyesha kusudi la barua hizo, yaani kumsababishia Nehemia hofu, kwa lugha ya asili na yenye heshima.
