lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Ndipo ... akamtuma
  rationale: Kitenzi chenye waw ya usimulizi kinaendeleza mfuatano wa matukio; “Ndipo” ni Kiswahili cha kawaida kinachoonyesha hatua inayofuata.
- source_word: אֵלַי
  choice: kwangu
  rationale: Kihusishi אֶל pamoja na kiambishi cha nafsi ya kwanza kinaonyesha mwelekeo na mpokeaji wa mjumbe.
- source_word: סַנְבַלַּט
  choice: Sanbalati
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: כַּדָּבָר הַזֶּה
  choice: kwa namna iyo hiyo
  rationale: Nahau hii inarejelea utaratibu uleule uliotajwa katika muktadha uliotangulia; tafsiri hii ni ya asili na huhifadhi rejeo hilo.
- source_word: פַּעַם חֲמִישִׁית
  choice: mara ya tano
  rationale: Usemi huu unaonyesha idadi ya kurudiwa kwa tendo.
- source_word: אֶת נַעֲרוֹ
  choice: mtumishi wake
  rationale: נַעַר inaweza kumaanisha kijana, lakini hapa dhima yake ni ya mtumishi au mjumbe wa Sanbalati.
- source_word: וְאִגֶּרֶת פְּתוּחָה
  choice: akiwa na barua iliyo wazi
  rationale: Muundo unaonyesha kwamba mtumishi aliibeba barua; “iliyo wazi” huhifadhi maana ya msingi ya פְּתוּחָה bila kuondoa uwezekano wa maana mahususi ya “isiyotiwa muhuri.”
- source_word: בְּיָדוֹ
  choice: mkononi mwake
  rationale: Tafsiri halisi huhifadhi taswira thabiti kwamba mtumishi aliibeba barua mkononi.
