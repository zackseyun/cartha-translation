base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/003.yaml
  text: So I sent messengers to them[a], saying, “I am doing a great work, and I cannot come down. Why should the work stop while I leave it and come down to you?”
translation:
  language: sw
  text: Basi nikawatuma wajumbe, nikisema, “Ninafanya kazi kubwa, nami siwezi kushuka. Kwa nini kazi isimame ninapoiacha na kushuka kuja kwenu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶשְׁלְחָה
  choice: Basi nikawatuma
  rationale: Kauli hii inaendeleza mfululizo wa simulizi; “Basi” na umbo la kitenzi “nikawatuma” vinaonyesha hatua iliyofuata kwa Kiswahili cha asili.
- source_word: עֲלֵיהֶם
  choice: kwao
  rationale: Pamoja na kitenzi cha kutuma na nomino “wajumbe,” kihusishi hiki kinaonyesha walikoelekezwa wajumbe, si uadui dhidi yao.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu wa mawasiliano kati ya wanadamu, neno hili linamaanisha watu waliotumwa kupeleka ujumbe, si malaika.
- source_word: לֵאמֹר
  choice: nikisema
  rationale: Hiki ni kishazi cha kawaida kinachoanzisha maneno ya ujumbe; “nikisema” kinaunganisha tendo la kutuma na yaliyosemwa kwa ufasaha.
- source_word: מְלָאכָה גְדוֹלָה
  choice: kazi kubwa
  rationale: “Kazi” huwakilisha shughuli au jukumu, na “kubwa” huhifadhi mkazo wa ukubwa au umuhimu bila kuufafanua kupita kiasi.
- source_word: אֲנִי עֹשֶׂה
  choice: Ninafanya
  rationale: Kiwakilishi pamoja na umbo la kushiriki katika Kiebrania huonyesha shughuli inayoendelea wakati huo; wakati wa sasa unaoendelea umehifadhiwa.
- source_word: וְלֹא אוּכַל לָרֶדֶת
  choice: nami siwezi kushuka
  rationale: Tafsiri hii huhifadhi kutoweza pamoja na mwendo halisi wa kushuka kutoka Yerusalemu.
- source_word: לָמָּה תִשְׁבַּת הַמְּלָאכָה
  choice: Kwa nini kazi isimame
  rationale: Kitenzi שׁבת hapa humaanisha kukoma au kusimama. Muundo wa “isimame” unaonyesha swali la balagha kwa Kiswahili cha kawaida.
- source_word: כַּאֲשֶׁר אַרְפֶּהָ
  choice: ikiwa nitaiacha
  rationale: רפה katika muundo huu ni kuiacha au kuilegeza kazi. “Ikiwa” huonyesha hali ambayo kuondoka kwake kungesababisha kazi kusimama, huku kiambishi “-i-” kikirejelea kazi.
- source_word: וְיָרַדְתִּי אֲלֵיכֶם
  choice: na kushuka kuja kwenu
  rationale: Maneno haya huhifadhi kurudiwa kwa wazo la kushuka na yanaonyesha wazi kwamba mwendo huo ungeelekezwa kwa wale walioandikiwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha swali la balagha na taswira ya kushuka kutoka Yerusalemu bila kuongeza ufafanuzi wa kimadhehebu. Hakuna alama ya tanbihi iliyowekwa kwa sababu tofauti iliyotolewa katika tabaka la Kiingereza inarudia kwa kiasi kikubwa maneno ya sehemu ya mwisho badala ya kuwasilisha mbadala halisi wa kifungu kilichotiwa alama.
