review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the narrative action, the human messengers, Nehemiah’s ongoing work, the downward movement, and the rhetorical question. However, “ikiwa nitaiacha” introduces a prospective conditional sense (“if I leave it”) where the Hebrew presents the circumstance temporally (“when/as I leave it”).
  naturalness: The draft is broadly clear and uses standard East African Swahili. “Nikawatuma wajumbe kwao nikisema” is somewhat heavy because both the object concord and “kwao” express the recipients. A more idiomatic formulation is “nikawatuma wajumbe, nikisema,” where the object concord marks “to them.”
  terminology: “Wajumbe,” “kazi kubwa,” and “kushuka” are accurate, natural choices. No theological terminology is at issue. No Swahili footnote is needed, since the English audit footnote does not represent a distinct source-text alternative requiring preservation here.
  issues:
  - severity: medium
    issue: Conditional wording for כַּאֲשֶׁר אַרְפֶּהָ
    rationale: “Ikiwa nitaiacha” means “if I leave it” and makes the departure merely conditional and future. “Ninapoiacha” retains the temporal/circumstantial force of the Hebrew without over-specifying the precise nuance of כַּאֲשֶׁר.
  - severity: low
    issue: Redundant recipient expression
    rationale: In “nikawatuma wajumbe kwao,” the object concord -wa- already identifies the persons to whom messengers were sent. Omitting “kwao” yields smoother Swahili while retaining the source meaning.
  revised_text: Basi nikawatuma wajumbe, nikisema, “Ninafanya kazi kubwa, nami siwezi kushuka. Kwa nini kazi isimame ninapoiacha na kushuka kuja kwenu?”
