- from: Basi nikawatuma wajumbe kwao nikisema, “Ninafanya kazi kubwa, nami siwezi kushuka. Kwa nini kazi isimame ikiwa nitaiacha na kushuka kuja kwenu?”
  to: Basi nikawatuma wajumbe, nikisema, “Ninafanya kazi kubwa, nami siwezi kushuka. Kwa nini kazi isimame ninapoiacha na kushuka kuja kwenu?”
  rationale: The revision removes a minor redundant directional expression and replaces the conditional “ikiwa nitaiacha” with the temporal “ninapoiacha,” more closely reflecting the Hebrew rhetorical question. It preserves the direct-speech register, repeated idea of descending, and all substantive content.
  reviewer_model: gpt-5.6-terra
