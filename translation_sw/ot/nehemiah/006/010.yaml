  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/אֲנִי בָ֗אתִי בֵּ֣ית שְֽׁמַֽעְיָ֧ה בֶן דְּלָיָ֛ה בֶּן מְהֵֽיטַבְאֵ֖ל וְ/ה֣וּא עָצ֑וּר וַ/יֹּ֡אמֶר נִוָּעֵד֩ אֶל בֵּ֨ית הָ/אֱלֹהִ֜ים אֶל תּ֣וֹךְ הַֽ/הֵיכָ֗ל וְ/נִסְגְּרָה֙ דַּלְת֣וֹת הַ/הֵיכָ֔ל כִּ֚י בָּאִ֣ים לְ/הָרְגֶ֔/ךָ וְ/לַ֖יְלָה בָּאִ֥ים לְ/הָרְגֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/010.yaml
  text: Then I went to the house of Shemaiah son of Delaiah[a], son of Mehetabel, who was confined, and he said, “Let us meet at the house of God, inside the temple, and let us shut the doors of the temple, for they are coming to kill you—yes, at night they are coming to kill you.”
translation:
  language: sw
  text: Kisha nikaenda nyumbani kwa Shemaya mwana wa Delaya, mwana wa Mehetabeli, ambaye alikuwa amefungiwa ndani. Akasema, “Tukutane katika nyumba ya Mungu, ndani ya hekalu[a], na tufunge milango ya hekalu, kwa maana wanakuja kukuua—na usiku wanakuja kukuua.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “patakatifu.” Neno la Kiebrania heikhal linaweza kumaanisha hasa jengo la hekalu au sehemu takatifu, wala si eneo lote la viwanja vya hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי בָאתִי
  choice: Kisha nikaenda
  rationale: Muunganiko wa simulizi pamoja na kiwakilishi unasisitiza kwa kiasi mhusika na mwendelezo wa tukio. ‘Kisha nikaenda’ ni Kiswahili cha kawaida cha simulizi na בוא hapa inaeleweka kwa mtazamo wa kwenda nyumbani kwa Shemaya.
- source_word: בֵּית שְׁמַעְיָה
  choice: nyumbani kwa Shemaya
  rationale: Katika muktadha wa makao ya mtu, Kiswahili cha asili hutumia ‘nyumbani kwa’ badala ya tafsiri ngumu ya ‘nyumba ya.’
- source_word: שְׁמַעְיָה ... דְּלָיָה ... מְהֵיטַבְאֵל
  choice: Shemaya mwana wa Delaya, mwana wa Mehetabeli
  rationale: Majina yamenukuliwa kwa maumbo yanayosomeka kwa Kiswahili, huku uhusiano wa nasaba ukihifadhiwa moja kwa moja.
- source_word: וְהוּא עָצוּר
  choice: naye alikuwa amejifungia
  rationale: עָצוּר inaweza kumaanisha kufungiwa, kuzuiliwa, au kujitenga. ‘Alikuwa amejifungia’ ni ya asili katika muktadha huu bila kubainisha sababu ya kutotoka; hata hivyo inaelekea kidogo kwenye hali ya kujitenga mwenyewe.
- source_word: נִוָּעֵד
  choice: Tukutane
  rationale: Umbo hili linatoa pendekezo la kukutana; ‘Tukutane’ huhifadhi mwaliko huo kwa ufupi na kwa kawaida.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Huhifadhi usemi wa Kiebrania unaolitaja eneo la hekalu kwa ujumla na kuandaa utofautishaji na הֵיכָל inayofuata.
- source_word: אֶל תּוֹךְ הַהֵיכָל
  choice: ndani ya hekalu[a]
  rationale: הֵיכָל hapa yaweza kutaja jengo takatifu la hekalu, si viwanja vyote. ‘Ndani ya hekalu’ ni wazi na ya kawaida, huku tanbihi ikihifadhi maana mahususi zaidi ya ‘patakatifu.’
- source_word: וְנִסְגְּרָה דַּלְתוֹת הַהֵיכָל
  choice: kisha tufunge milango ya hekalu
  rationale: Huhifadhi pendekezo linaloendelea pamoja na picha halisi ya kufunga milango.
- source_word: כִּי בָּאִים לְהָרְגֶךָ
  choice: kwa maana wanakuja kukuua
  rationale: Kitenzi cha wingi kina mhusika asiyeainishwa; ‘wana-’ huwasilisha hali hiyo kwa kawaida bila kuongeza ‘watu’ au kuwatambulisha.
- source_word: וְלַיְלָה בָּאִים לְהָרְגֶךָ
  choice: naam, wanakuja usiku kukuua
  rationale: ‘Naam’ huonyesha msisitizo, ‘usiku’ huepuka kudai kwa lazima ‘usiku huu,’ na marudio yamehifadhiwa ili kuonyesha uharaka wa onyo.
theological_decisions:
- issue: Maana ya הֵיכָל katika muktadha wa eneo takatifu lenye mipaka ya kuingia
  choice: hekalu
  alternative: patakatifu; jengo la patakatifu
  rationale: Muktadha wa mstari unaofuata unaonyesha kwamba kuingia huko kulikuwa jambo zito na huenda eneo hilo lilikuwa na mipaka ya kidini. Hata hivyo, neno lenyewe linaweza kutafsiriwa ‘hekalu’ au kwa umahususi zaidi ‘patakatifu.’ Matini kuu inatumia ‘hekalu’ kwa uwazi, na tanbihi inalinda uwezekano wa maana mahususi bila kuondoa mvutano wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha simulizi yenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya onyo yamehifadhiwa kwa ajili ya msisitizo. ‘Nyumbani kwa’ imetumiwa kwa makao ya Shemaya, lakini ‘nyumba ya Mungu’ imehifadhiwa kama jina la eneo la hekalu.
