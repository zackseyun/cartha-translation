  text: וָ/אֹמְרָ֗/ה הַ/אִ֤ישׁ כָּמ֨וֹ/נִי֙ יִבְרָ֔ח וּ/מִ֥י כָמ֛וֹ/נִי אֲשֶׁר יָב֥וֹא אֶל הַ/הֵיכָ֖ל וָ/חָ֑י לֹ֖א אָבֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/011.yaml
  text: But I said[a], “Should a man like me flee? And who is like me, who could go into the temple and live? I will not go in.”
translation:
  language: sw
  text: Lakini nikasema, “Je, mtu kama mimi akimbie? Na ni nani kama mimi ambaye angeweza kuingia hekaluni[a] na kuishi? Mimi sitaingia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “patakatifu.” Huenda jambo lililohusika halikuwa kujificha tu ndani ya jengo, bali kuingia sehemu ya hekalu ambayo kuingia kwake kungekuwa kusikofaa, au kusikoruhusiwa, kwa Nehemia; hilo linaweza kueleza uzito wa maneno “na kuishi.”
    reason: Neno הֵיכָל linaweza kumaanisha hekalu kwa ujumla au sehemu yake takatifu. Tanbihi inahifadhi maana hii mbadala na dokezo la muktadha kwa tahadhari, bila kudai kwa uhakika zaidi ya matini yenyewe.
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: Lakini nikasema
  rationale: Waw inaendeleza simulizi, lakini katika muktadha jibu la Nehemia linapingana na pendekezo lililotangulia; hivyo “Lakini” linaonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: הָאִישׁ כָּמוֹנִי
  choice: mtu kama mimi
  rationale: Kirai kinatumika kijumla katika swali la balagha na kinaendeleza wazo la hadhi, wajibu na wito wa Nehemia bila kuongeza ufafanuzi usio katika matini.
- source_word: יִבְרָח
  choice: akimbie
  rationale: Kitenzi kina maana ya kukimbia au kutoroka kwa hofu. “Akimbie” ni cha asili katika swali hili la balagha na kinahifadhi uzito wa kukataa kwake.
- source_word: וּמִי כָמוֹנִי
  choice: Na ni nani aliye kama mimi
  rationale: Tafsiri hii inadumisha ulinganifu na swali la kwanza pamoja na msisitizo wa Nehemia kuhusu mtu mwenye nafasi na wajibu kama wake.
- source_word: אֲשֶׁר יָבוֹא
  choice: ambaye angeingia
  rationale: Kishazi cha Kiebrania kina ufupi na hali ya balagha. Hali ya masharti “angeingia” inaonyesha mshangao au kutokubalika kwa tendo hilo kuliko taarifa rahisi ya wakati ujao.
- source_word: הַהֵיכָל
  choice: hekaluni
  rationale: Neno hili hapa linarejelea jengo la hekalu au eneo lake takatifu. “Hekaluni” linaeleweka kwa urahisi, huku tanbihi ikihifadhi uwezekano wa maana mahususi zaidi wa patakatifu.
- source_word: וָחָי
  choice: na kuishi
  rationale: 'Tafsiri hii inabaki karibu na muundo wa Kiebrania na kuhifadhi mvutano wa maana: huenda ikarejelea kuokoa uhai kwa kujificha au kuingia mahali palipokatazwa na bado kubaki hai.'
- source_word: לֹא אָבוֹא
  choice: Mimi sitaingia
  rationale: “Sitaingia” linarudia wazi wazo la kuingia lililotangulia. Kiwakilishi “Mimi” kinaongeza msisitizo wa kukataa bila kubadili maana.
theological_decisions:
- issue: Maana inayodokezwa ya kuingia hekaluni
  choice: Matini kuu inasema tu kwamba Nehemia anakataa kuingia hekaluni, huku tanbihi ikionyesha kwamba huenda lilikuwa eneo lenye mipaka ya kidini ambalo hakuruhusiwa kuingia.
  alternative: Kuelewa kauli hiyo kuwa Nehemia alikataa tu kujificha ndani ya jengo bila maana yoyote kuhusu masharti ya ibada.
  rationale: Muktadha wa Nehemia 6:10–13 unaonyesha kwamba shauri hilo lilikusudiwa kumfanya atende dhambi na kuaibika. Hata hivyo, mstari wenyewe haufafanui kabisa aina ya kosa; kwa hiyo tafsiri haiamui zaidi ya ushahidi wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Maswali ya balagha na marudio ya “mimi” yamehifadhiwa ili kuonyesha uthabiti wa jibu la Nehemia.
