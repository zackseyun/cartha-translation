base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/002.yaml
  text: And all of them conspired together to come and fight against Jerusalem and to cause confusion in it[a].
translation:
  language: sw
  text: Nao wote kwa pamoja wakafanya njama ya kuja kupigana na Yerusalemu na kusababisha machafuko humo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuleta mvurugo au taabu humo.” Neno la Kiebrania linaweza kumaanisha machafuko, mvurugo, au hali ya kutokuwa na utaratibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: wakafanya njama
  rationale: Kitenzi קשר katika qal hapa kinaonyesha kupanga njama au kuungana kwa kusudi la uhasama. ‘Wakafanya njama’ ni Kiswahili cha kawaida na hudumisha nia ya siri na iliyoratibiwa.
- source_word: כֻלָּם יַחְדָּו
  choice: wote kwa pamoja
  rationale: Muundo huu unasisitiza kwamba kundi lote lilitenda kwa umoja. ‘Wote kwa pamoja’ huhifadhi msisitizo wa jumla na uratibu bila kuwa mzito.
- source_word: לָבוֹא
  choice: kuja
  rationale: Kitenzi cha mwendo kimehifadhiwa kama kilivyo katika Kiebrania badala ya kufupishwa kuwa ‘kushambulia’.
- source_word: לְהִלָּחֵם בִּירוּשָׁלָם
  choice: kupigana na Yerusalemu
  rationale: Nifali ya לחם humaanisha kushiriki katika mapigano; katika muktadha huu בְּ humtaja Yerusalemu kama shabaha ya uhasama. ‘Kupigana na’ ni usemi wa asili wa Kiswahili.
- source_word: וְלַעֲשׂוֹת לוֹ
  choice: na kusababisha ... humo
  rationale: Pamoja na nomino inayofuata, עשה inaeleza kuleta hali fulani. ‘Humo’ humrejesha msomaji kwa Yerusalemu na kutoa maana ya mahali kwa Kiswahili cha kawaida.
- source_word: תּוֹעָה
  choice: machafuko
  rationale: Nomino hii inaweza kueleza hali ya kuvurugika, kuchanganyikiwa, au kutokuwa na utaratibu. ‘Machafuko’ linafaa katika muktadha wa jaribio la kuvuruga ujenzi, huku tanbihi ikihifadhi upana wa maana.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya moja kwa moja na inaeleweka kwa msomaji wa kawaida; ‘kufanya njama’ na ‘kwa pamoja’ huhifadhi uratibu wa uhasama, huku tanbihi ikionyesha upana wa maana ya תּוֹעָה.
