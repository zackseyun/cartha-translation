source:
  edition: WLC
  text: וַ/יְהִ֣י כַ/אֲשֶׁ֣ר שָׁמַ֣ע סַנְבַלַּ֡ט וְ֠/טוֹבִיָּה וְ/הָ/עַרְבִ֨ים וְ/הָ/עַמֹּנִ֜ים וְ/הָ/אַשְׁדּוֹדִ֗ים כִּֽי עָלְתָ֤ה אֲרוּכָה֙ לְ/חֹמ֣וֹת יְרוּשָׁלִַ֔ם כִּי הֵחֵ֥לּוּ הַ/פְּרֻצִ֖ים לְ/הִסָּתֵ֑ם וַ/יִּ֥חַר לָ/הֶ֖ם מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/001.yaml
  text: When Sanballat and Tobiah and the Arabs and the Ammonites and the Ashdodites heard that the repair of Jerusalem’s walls had gone up[a], that the breaches had begun to be closed[b], they became very angry.
translation:
  language: sw
  text: Sanbalati, Tobia, Waarabu, Waamoni na Waashdodi waliposikia kwamba ukarabati wa kuta za Yerusalemu ulikuwa umesonga mbele[a] na kwamba sehemu zilizobomoka zilikuwa zimeanza kuzibwa[b], walikasirika sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “urejeshaji wa kuta za Yerusalemu ulikuwa umeendelea.” Neno la Kiebrania hutumiwa mara nyingi kuhusu kupona au kurejeshwa, na hapa linatumika kwa njia ya mfano kuhusu ukarabati wa kuta.
    reason: lexical_alternative
  - marker: b
    text: Au, “mianya ilikuwa imeanza kufungwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: waliposikia
  rationale: Muundo wa simulizi na kishazi cha wakati umeonyeshwa kwa kishazi asilia cha Kiswahili bila kuongeza neno la wakati lisilokuwapo wazi katika Kiebrania.
- source_word: שָׁמַע
  choice: walisikia
  rationale: Maana ya moja kwa moja ni kusikia au kupokea habari; 'walisikia' ni ya kawaida na inafaa katika muktadha.
- source_word: סַנְבַלַּט וְטוֹבִיָּה
  choice: Sanbalati, Tobia
  rationale: Majina yametoholewa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: הָעַרְבִים
  choice: Waarabu
  rationale: Jina la kisasa na la kawaida la watu hao katika Kiswahili.
- source_word: הָעַמֹּנִים
  choice: Waamoni
  rationale: Jina la kawaida la watu wa Amoni katika Kiswahili cha Biblia.
- source_word: הָאַשְׁדּוֹדִים
  choice: Waashdodi
  rationale: Huhifadhi umbo la jina la watu wanaotokana na Ashdodi kwa kifupi na kwa uwazi.
- source_word: עָלְתָה אֲרוּכָה
  choice: ukarabati ... ulikuwa umesonga mbele
  rationale: אֲרוּכָה linaweza kuhusishwa na kupona au kurejeshwa, lakini katika muktadha wa kuta linamaanisha ukarabati; 'umesonga mbele' huhifadhi wazo la עָלְתָה kwamba kazi ilikuwa imeendelea.
- source_word: לְחֹמוֹת יְרוּשָׁלִַם
  choice: wa kuta za Yerusalemu
  rationale: Huonyesha kwa Kiswahili asilia uhusiano wa ukarabati na kuta za Yerusalemu.
- source_word: כִּי
  choice: kwamba ... na kwamba
  rationale: Hapa inaingiza mambo yaliyosikiwa. Kurudia 'kwamba' kunafanya vifungu viwili vya taarifa viwe wazi.
- source_word: הֵחֵלּוּ
  choice: zilikuwa zimeanza
  rationale: Huonyesha kwamba kuzibwa kulikuwa tayari kumeanza wakati habari iliposikiwa.
- source_word: הַפְּרֻצִים
  choice: sehemu zilizobomoka
  rationale: Hueleza kwa lugha inayoeleweka mianya au sehemu zilizovunjika katika ukuta bila kutumia istilahi ngumu.
- source_word: לְהִסָּתֵם
  choice: kuzibwa
  rationale: Kauli tendwa ya Kiebrania ina maana ya kufungwa au kuzibwa; 'kuzibwa' inafaa kwa mapengo ya ukuta.
- source_word: וַיִּחַר לָהֶם מְאֹד
  choice: walikasirika sana
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya nahau ya Kiebrania inayoonyesha hasira kali.
