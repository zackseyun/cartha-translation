base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/006.yaml
  text: And when the Jews who lived near them came and told us ten times[a], “From all the places where you turn[b], they will come up against us,”
translation:
  language: sw
  text: Wayahudi waliokuwa wakiishi karibu nao walipokuja, walituambia mara kumi[a], “Popote mtakapogeukia, watakuja kutushambulia.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “mara kumi.” Huenda usemi huu ukasisitiza kwamba onyo hilo lilirudiwa-rudiwa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania cha kishazi hiki ni kigumu. Kihalisi huanza, “Kutoka kila mahali mtakaporudi/mtakapogeuka ... dhidi yetu.” Katika muktadha, wengi huelewa kuwa maadui wangekuja dhidi yao kutoka kila upande; kitenzi “watakuja” kimeelezwa ili kukamilisha sentensi kwa Kiswahili.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר בָּאוּ
  choice: walipokuja
  rationale: Muundo wa simulizi pamoja na kishazi cha wakati unawasilisha tukio jipya; ‘walipokuja’ ni Kiswahili cha kawaida na huhifadhi uhusiano wa wakati bila uzito usio wa lazima.
- source_word: הַיְּהוּדִים
  choice: Wayahudi
  rationale: Katika muktadha huu neno linataja watu wa jamii ya Kiyahudi, si wakazi wa Yuda pekee.
- source_word: הַיֹּשְׁבִים אֶצְלָם
  choice: waliokuwa wakiishi karibu nao
  rationale: אֵצֶל inaonyesha ukaribu wa mahali na majirani wenye uhasama; ‘karibu nao’ ni wazi na ya kawaida.
- source_word: וַיֹּאמְרוּ לָנוּ
  choice: walituambia
  rationale: Hutoa kwa kawaida taarifa ya onyo walilowaletea Nehemia na wenzake.
- source_word: עֶשֶׂר פְּעָמִים
  choice: mara kumi
  rationale: Huhifadhi idadi iliyotajwa wazi katika Kiebrania, ingawa inaweza pia kumaanisha kurudia-rudia.
- source_word: מִכָּל הַמְּקֹמוֹת אֲשֶׁר תָּשׁוּבוּ
  choice: Popote mtakapogeukia
  rationale: Kishazi cha Kiebrania ni kigumu. Tafsiri hii inaeleza kwa Kiswahili cha kawaida wazo linalowezekana la kugeukia upande wowote, huku maana halisi zaidi ya ‘kurudi’ ikihifadhiwa katika tanbihi.
- source_word: עָלֵינוּ
  choice: kutushambulia
  rationale: Katika muktadha wa maadui wanaotishia ujenzi, עַל ina nguvu ya uhasama, yaani kuja dhidi ya watu hawa. Kitenzi cha kuja kimeelezwa kutokana na muktadha ili sentensi ikamilike kwa Kiswahili.
