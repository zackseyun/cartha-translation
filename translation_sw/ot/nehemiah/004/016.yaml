base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/016.yaml
  text: Also at that time I said to the people[a], “Let each man and his servant spend the night within Jerusalem[b], and let them be a guard for us by night and workers by day.”
translation:
  language: sw
  text: Pia wakati huo niliwaambia watu, “Kila mtu na mtumishi wake[a] walale ndani ya Yerusalemu; wawe walinzi wetu usiku na wafanye kazi mchana.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania נַעַר linaweza kumaanisha kijana, mtumishi, mhudumu au mfanyakazi aliye chini ya mwingine, kutegemea muktadha.
    reason: lexical_alternative
  - marker: b
    text: 'Kwa kufuata muundo wa Kiebrania kwa karibu: “na wawe kwetu ulinzi usiku na kazi mchana.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בָּעֵת הַהִיא
  choice: Pia wakati huo
  rationale: Huhifadhi nguvu ya nyongeza ya גַּם na usemi wa kawaida wa wakati בָּעֵת הַהִיא kwa Kiswahili sanifu.
- source_word: אָמַרְתִּי לָעָם
  choice: niliwaambia watu
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha tendo la kusema lililoelekezwa kwa watu.
- source_word: אִישׁ וְנַעֲרוֹ
  choice: Kila mtu na mtumishi wake
  rationale: אִישׁ ina nguvu ya kugawa, yaani kila mmoja; נַעַר hapa yaweza kumaanisha mtumishi au mhudumu bila kulazimisha wazo la umri mdogo.
- source_word: יָלִינוּ
  choice: walale
  rationale: Kitenzi לון/לין humaanisha kukaa au kulala mahali usiku; katika agizo hili, 'walale' ni kifupi na cha kawaida.
- source_word: בְּתוֹךְ יְרוּשָׁלִָם
  choice: ndani ya Yerusalemu
  rationale: Huwasilisha wazi eneo lililo ndani ya mipaka ya mji.
- source_word: הַלַּיְלָה מִשְׁמָר
  choice: wawe walinzi wetu usiku
  rationale: מִשְׁמָר ni ulinzi au zamu ya kulinda; uundaji wa kibinafsi unafaa kwa wahusika wanaotajwa na ni wa asili kwa Kiswahili.
- source_word: וְהַיּוֹם מְלָאכָה
  choice: na wafanye kazi mchana
  rationale: מְלָאכָה ni kazi; kitenzi 'wafanye kazi' kinaeleza kwa kawaida jukumu lao la mchana huku kikidumisha ulinganifu wa usiku na mchana.
