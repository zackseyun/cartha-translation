base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/017.yaml
  text: And neither I[a], nor my brothers, nor my young men, nor the men of the guard who were behind me, took off our clothes; each kept his weapon in his right hand, even for water.
translation:
  language: sw
  text: Mimi, ndugu zangu, vijana wangu, na walinzi waliokuwa nyuma yangu—hakuna hata mmoja wetu aliyekuwa akivua nguo zake; kila mmoja alikuwa na silaha yake, hata alipokwenda kuteka maji.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kifungu cha mwisho katika Kiebrania ni kigumu; kwa neno kwa neno ni, “kila mmoja, silaha yake, maji.” Huenda maana yake ni kwamba kila mmoja alikuwa na silaha yake hata alipokwenda kuteka maji, au kwamba kila mmoja alienda kuteka maji akiwa na silaha yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... אֵין
  choice: hakuna hata mmoja wetu aliyevua
  rationale: Chembe ya kukanusha pamoja na umbo la kitenzi huonyesha kwamba tendo hilo halikufanyika katika kipindi hicho; Kiswahili hiki ni cha kawaida na kinajumuisha wahusika wote waliotajwa.
- source_word: אַחַי
  choice: ndugu zangu
  rationale: Huhifadhi neno la kifamilia bila kulifafanua kupita kiasi kuwa jamaa au washirika.
- source_word: נְעָרַי
  choice: vijana wangu
  rationale: Neno linaweza kumaanisha vijana, watumishi, au wasaidizi; 'vijana wangu' huhifadhi upana wake wa kileksia.
- source_word: אַנְשֵׁי הַמִּשְׁמָר
  choice: walinzi
  rationale: Ni usemi wa asili na wazi wa Kiswahili kwa watu waliokuwa na jukumu la ulinzi.
- source_word: אֲשֶׁר אַחֲרַי
  choice: waliokuwa nyuma yangu
  rationale: Huhifadhi maana ya mahali iliyo wazi zaidi katika Kiebrania na inayofaa muktadha wa kikosi cha ulinzi.
- source_word: פֹשְׁטִים בְּגָדֵינוּ
  choice: aliyevua nguo zake
  rationale: Kitenzi pamoja na 'nguo' humaanisha kuvua mavazi; muundo wa umoja unaendana na 'hakuna hata mmoja wetu' katika Kiswahili.
- source_word: אִישׁ
  choice: kila mmoja
  rationale: אִישׁ limetumiwa kwa maana ya kugawa tendo kwa kila mtu mmoja mmoja.
- source_word: שִׁלְחוֹ
  choice: silaha yake
  rationale: שֶׁלַח linaweza kumaanisha silaha, hasa silaha ya kurushwa au ya mfano wa mkuki; 'silaha' huepuka kutaja aina isiyo hakika.
- source_word: הַמָּיִם
  choice: alipokwenda kuteka maji
  rationale: Kifungu cha mwisho ni kifupi na kigumu. Tafsiri hii huwasilisha uwezekano kwamba kila mtu alienda kuchota maji akiwa na silaha, bila kuingiza wazo la 'mkono wa kulia' ambalo halipo wazi katika maandishi ya Kiebrania ya Kimasora.
