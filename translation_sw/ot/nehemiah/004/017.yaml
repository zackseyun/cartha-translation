  to: Mimi, ndugu zangu, vijana wangu, na walinzi waliokuwa nyuma yangu—hakuna hata mmoja wetu aliyekuwa akivua nguo zake; kila mmoja alikuwa na silaha yake, hata alipokwenda kuteka maji.[a]
  rationale: Kitenzi cha kuendelea “aliyekuwa akivua” kinaakisi vizuri kirai cha Kiebrania chenye kivumishi-tendo cha wakati unaoendelea chini ya ukanushi. Marekebisho ya kishazi cha mwisho yanahifadhi sintaksia yake yenye utata na maana ya kuwa na silaha tayari, bila kudai kwa uhakika zaidi ya matini kwamba kwenda kuteka maji ndilo ndilo tendo linalosemwa. Tanbihi imeandikwa upya ili kutofautisha wazi uwezekano hizo mbili.
