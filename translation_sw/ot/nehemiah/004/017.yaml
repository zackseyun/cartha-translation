translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imepangwa upya kidogo ili orodha ndefu ya wahusika isikike kwa kawaida. Alama ya tanbihi imewekwa baada ya kifungu kigumu kinachohusika.
