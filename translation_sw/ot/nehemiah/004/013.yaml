base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/013.yaml
  text: And I said to the nobles[a], to the officials, and to the rest of the people, “The work is great and spread out, and we are separated along the wall, far from one another.”
translation:
  language: sw
  text: Nikawaambia wakuu, maofisa, na watu wengine wote, “Kazi ni kubwa na imeenea, nasi tumetengana kando ya ukuta, kila mmoja akiwa mbali na mwenzake[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “mtu kutoka kwa ndugu yake”; hii ni nahau ya Kiebrania yenye maana ya “mmoja na mwenzake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹרִים
  choice: wakuu
  rationale: Katika Nehemia neno hili linataja watu wenye hadhi na mamlaka katika jamii. “Wakuu” ni neno la kawaida na lenye heshima katika Kiswahili bila kulifanya kuwa cheo mahususi.
- source_word: הַסְּגָנִים
  choice: maofisa
  rationale: Neno hili linamaanisha viongozi au wasimamizi walio chini ya mamlaka kuu. “Maofisa” linaeleza kazi yao ya kiutawala bila kubainisha cheo kisichotajwa katika chanzo.
- source_word: יֶתֶר הָעָם
  choice: watu wengine wote
  rationale: Hii ni tafsiri ya kawaida ya kishazi kinachowataja watu waliobaki baada ya makundi ya viongozi kutajwa.
- source_word: הַמְּלָאכָה
  choice: kazi
  rationale: Katika muktadha huu ni kazi ya kujenga upya ukuta; “kazi” ni pana, wazi, na ya kawaida.
- source_word: הַרְבֵּה וּרְחָבָה
  choice: kubwa na pana
  rationale: 'Tafsiri hii inadumisha sifa mbili za Kiebrania: ukubwa wa kazi na upana wa eneo ilikoenea, bila kuunganisha maana hizo kuwa wazo moja.'
- source_word: נִפְרָדִים
  choice: tumetengana
  rationale: Kitenzi kinaonyesha kwamba wafanyakazi wako mbali mbali kwa nafasi, si kwamba wana uhasama au mgawanyiko wa kijamii.
- source_word: עַל הַחוֹמָה
  choice: juu ya ukuta
  rationale: Hii inafuata kwa karibu maana ya kawaida ya עַל na inaweka wafanyakazi katika eneo la ukuta bila kuongeza maelezo yasiyo katika chanzo.
- source_word: רְחוֹקִים אִישׁ מֵאָחִיו
  choice: kila mmoja akiwa mbali na mwenzake
  rationale: Hiki ni Kiswahili cha kawaida kinachowasilisha maana ya kurudiana ya nahau ya Kiebrania, yaani watu kuwa mbali wao kwa wao.
