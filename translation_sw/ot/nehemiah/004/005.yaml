base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/005.yaml
  text: And our adversaries said[a], “They will not know, and they will not see, until we come into their midst and kill them and stop the work.”
translation:
  language: sw
  text: Adui zetu walisema, “Hawatajua wala hawataona mpaka tutakapoingia katikati yao; tutawaua na kuikomesha kazi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָרֵינוּ
  choice: adui zetu
  rationale: Neno צַר humaanisha adui au mpinzani mwenye uhasama; “adui zetu” ni la kawaida, wazi, na linafaa katika muktadha huu wa tishio la mashambulizi.
- source_word: יֵדְעוּ
  choice: hawatajua
  rationale: Kitenzi יָדַע hapa kinahusu kujua au kuwa na habari. “Hawatajua” kinahifadhi usemi wa moja kwa moja wa Kiebrania bila kufafanua kupita kiasi.
- source_word: יִרְאוּ
  choice: hawataona
  rationale: רָאָה kimsingi ni “kuona.” Tafsiri hii inahifadhi usambamba wa “kujua” na “kuona,” huku muktadha ukidokeza maana ya kutambua jambo linalotokea.
- source_word: עַד אֲשֶׁר
  choice: mpaka
  rationale: 'Kirai hiki kinaweka kikomo cha wakati: hawatakuwa na habari mpaka washambuliaji watakapofika. “Mpaka” ni tafsiri fupi na ya kawaida katika Kiswahili.'
- source_word: נָבוֹא אֶל תּוֹכָם
  choice: tutakapoingia katikati yao
  rationale: בּוֹא pamoja na אֶל־תּוֹךְ huonyesha kuja au kuingia ndani ya kundi lao. “Kuingia katikati yao” linaonyesha wazi kuvamia kwa kushtukiza.
- source_word: וַהֲרַגְנוּם
  choice: tuwaue
  rationale: הָרַג ni kuua. Umbo la kusudi “tuwaue” ni la asili katika Kiswahili baada ya kirai cha kuingia katikati yao na linawasilisha mpango wao wa moja kwa moja.
- source_word: וְהִשְׁבַּתְנוּ
  choice: na kuikomesha
  rationale: Hifili ya שׁבת ina maana ya kusababisha kitu kikome. “Kuikomesha” linaonyesha kwa uwazi kusimamisha kabisa shughuli hiyo.
- source_word: הַמְּלָאכָה
  choice: kazi
  rationale: מְלָאכָה hapa ni kazi ya kujenga upya ukuta; “kazi” ni neno pana, la kawaida, na linaloeleweka kutokana na muktadha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; usemi ni wa sasa, wenye hadhi, na unaoeleweka kwa urahisi. Usambamba wa Kiebrania katika “hawatajua wala hawataona” umehifadhiwa, na tishio limewasilishwa kwa lugha ya moja kwa moja.
