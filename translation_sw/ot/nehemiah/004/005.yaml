  verdict: revise
  source_fidelity: Draft faithfully represents the adversaries, their intended surprise, killing, and cessation of the work. However, the shift from "tutakapoingia" to subjunctive "tuwaue" makes the final actions sound like a purpose clause rather than the coordinated actions stated in the Hebrew.
  naturalness: '"Nao adui zetu wakasema" is somewhat marked in modern Standard East African Swahili, and "tutakapoingia ... tuwaue" is not the clearest natural expression of the threat. A finite future sequence is more idiomatic and precise.'
  terminology: '"Adui zetu," "hawatajua wala hawataona," "katikati yao," and "kazi" are appropriate. "Kukomesha kazi" accurately expresses causing the work to cease.'
  issues:
  - severity: medium
    issue: The verbs after "tutakapoingia" are not coordinated clearly with the attackers' stated future actions.
    rationale: The Hebrew presents coming into their midst, killing them, and stopping the work as successive intended actions. "tuwaue" after the temporal clause can be read as a purposive/subjunctive construction. Recasting with finite future verbs preserves the sequence and yields natural Swahili.
  - severity: low
    issue: The opening wording is unnecessarily marked for a modern-standard translation.
    rationale: '"Adui zetu walisema" directly and naturally renders the Hebrew narrative introduction without changing its meaning.'
  revised_text: Adui zetu walisema, “Hawatajua wala hawataona mpaka tutakapoingia katikati yao; tutawaua na kuikomesha kazi.”
