base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/003.yaml
  text: So we prayed to our God and stationed a guard against them day and night because of them[a][b].
translation:
  language: sw
  text: Basi tulisali kwa Mungu wetu, nasi tukaweka walinzi dhidi yao mchana na usiku kwa sababu yao.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tukaweka ulinzi dhidi yao.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kutoka mbele yao”; hapa maana yake ni “kwa sababu yao” au “kwa sababu ya tishio lao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּתְפַּלֵּל
  choice: tukamwomba
  rationale: Kitenzi hiki kwa kawaida humaanisha kusali au kuomba. “Tukamwomba” ni Kiswahili cha kawaida na huhifadhi tendo la kumwelekea Mungu bila kuongeza mkazo usiotajwa.
- source_word: אֶל אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Kiambishi cha nafsi ya kwanza wingi kimehifadhiwa kwa neno “wetu,” na muundo wa Kiswahili “kumwomba Mungu wetu” huwasilisha kwa kawaida maana ya kuelekeza sala kwa Mungu.
- source_word: וַנַּעֲמִיד
  choice: tukaweka
  rationale: Hifili ya עמד hapa ina maana ya kusimamisha au kuweka katika nafasi. “Tukaweka” inafaa kwa tendo la kupanga walinzi katika hali ya ulinzi.
- source_word: מִשְׁמָר
  choice: walinzi
  rationale: Neno linaweza kumaanisha ulinzi, zamu ya ulinzi, au kikosi cha walinzi. “Walinzi” ni la kawaida na linaonyesha watu waliowekwa kufanya ulinzi katika muktadha huu.
- source_word: עֲלֵיהֶם
  choice: dhidi yao
  rationale: 'Ingawa kihusishi kinaweza kumaanisha “juu yao,” katika muktadha wa maadui maana ya upinzani ndiyo inayofaa: walinzi waliwekwa dhidi yao.'
- source_word: יוֹמָם וָלַיְלָה
  choice: mchana na usiku
  rationale: Huu ni usemi wa kawaida unaoonyesha ulinzi wenye kuendelea wakati wote.
- source_word: מִפְּנֵיהֶם
  choice: kwa sababu yao
  rationale: Kihalisi ni “kutoka mbele yao/uweponi mwao,” lakini hapa kinaeleza sababu ya kuweka walinzi. “Kwa sababu yao” huhifadhi maana hiyo bila kuongeza wazi wazo la hofu.
theological_decisions:
- issue: Namna ya kuwasilisha mwitikio dhidi ya upinzani
  choice: Sala kwa Mungu na hatua ya kuweka walinzi zimetajwa kama matendo mawili yaliyounganishwa, bila kulipa moja uzito kuliko jingine.
  alternative: Kusisitiza sala pekee, au kusisitiza maandalizi ya kiulinzi pekee.
  rationale: 'Kiebrania kinaunganisha matendo yote mawili: walimwomba Mungu na wakaweka walinzi. Tafsiri huhifadhi mvutano huu wa imani na hatua ya kivitendo badala ya kuufuta.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Basi” linaonyesha mwendelezo wa hoja; “nasi” linaweka wazi uratibu wa sala na ulinzi. Alama zote za tanbihi zimewekwa katika matini.
