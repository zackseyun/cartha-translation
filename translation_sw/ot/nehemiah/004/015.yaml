- from: Basi tuliendelea kufanya kazi, huku nusu yao wakishika mikuki tangu alfajiri ilipopambazuka hadi nyota zilipotokea.[a]
  to: Nasi tulikuwa tukifanya kazi, na nusu yao walikuwa wakishika mikuki tangu mapambazuko hadi nyota zilipotokea.[a]
  rationale: The revision removes the added inferential force, renders both Hebrew participles as ongoing actions, and replaces a redundant dawn phrase with idiomatic Swahili while preserving the concrete image of stars appearing.
