base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/015.yaml
  text: So we kept doing the work[a], while half of them held the spears from the rising of the dawn until the coming out of the stars.
translation:
  language: sw
  text: Nasi tulikuwa tukifanya kazi, na nusu yao walikuwa wakishika mikuki tangu mapambazuko hadi nyota zilipotokea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa lugha fupi zaidi, “tangu alfajiri hadi nyota zilipoonekana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשִׂים בַּמְּלָאכָה
  choice: tuliendelea kufanya kazi
  rationale: Kitenzi kishirikishi katika muktadha huu kinaonyesha tendo lililoendelea; usemi huu ni wa kawaida katika Kiswahili na hauongezi maelezo yasiyomo katika Kiebrania.
- source_word: וְחֶצְיָם
  choice: huku nusu yao
  rationale: Kiunganishi kinaunganisha matendo yanayotendeka kwa wakati mmoja; “huku” huonyesha hali hiyo kwa Kiswahili cha kawaida.
- source_word: מַחֲזִיקִים בָּרְמָחִים
  choice: wakishika mikuki
  rationale: Kitenzi kina maana ya kushika au kubeba, na umbo la “wakishika” huhifadhi hali ya tendo linaloendelea.
- source_word: מֵעֲלוֹת הַשַּׁחַר
  choice: tangu alfajiri ilipopambazuka
  rationale: Huhifadhi taswira ya alfajiri inayochomoza huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: עַד צֵאת הַכּוֹכָבִים
  choice: hadi nyota zilipotokea
  rationale: Huhifadhi taswira halisi ya nyota kujitokeza badala ya kuibadili kwa ufafanuzi mpana kama “hadi usiku.”
