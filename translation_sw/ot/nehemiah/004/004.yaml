  source_fidelity: 'Tafsiri inafuata Kiebrania kwa uaminifu: “Yuda” limehifadhiwa kama jina la umoja lenye tanbihi ya matumizi ya kijumuiya; nguvu za wabeba mizigo zinaelezwa kuwa zimeisha; na “kifusi ni kingi” hutoa kwa usahihi maana ya עָפָר katika muktadha wa ujenzi upya. “Hatuwezi kujenga ukuta” huwasilisha kutokuwa na uwezo na ni Kiswahili cha kawaida, bila kuongeza tafsiri ya kiitikadi.'
