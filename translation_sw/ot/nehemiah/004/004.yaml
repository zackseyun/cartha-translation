  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. Muundo wa usemi wa moja kwa moja umehifadhiwa; ‘nasi’ inadumisha msisitizo wa kiunganishi cha Kiebrania.
