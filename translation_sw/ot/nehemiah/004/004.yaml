  text: וַ/יֹּ֣אמֶר יְהוּדָ֗ה כָּשַׁל֙ כֹּ֣חַ הַ/סַּבָּ֔ל וְ/הֶ/עָפָ֖ר הַרְבֵּ֑ה וַ/אֲנַ֨חְנוּ֙ לֹ֣א נוּכַ֔ל לִ/בְנ֖וֹת בַּ/חוֹמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/004.yaml
  text: And Judah said[a], “The strength of the burden-bearers has failed, and there is much rubble[b], and we are not able to build the wall.”
translation:
  language: sw
  text: Ndipo Yuda akasema[a], “Nguvu za wabeba mizigo zimeisha, na kifusi ni kingi[b]; nasi hatuwezi kujenga ukuta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa Yuda wakasema.” Jina la umoja “Yuda” huenda linawakilisha jumuiya yote.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “vumbi” au “udongo”; katika muktadha huu, maana yake yaelekea kuwa mabaki ya majengo yaliyobomoka.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Jina la mahali/jumuiya limetoholewa kama lilivyo katika Kiebrania; hapa huenda linawakilisha watu wa Yuda kwa ujumla, jambo linaloelezwa katika tanbihi.
- source_word: כָּשַׁל כֹּחַ
  choice: nguvu ... zimeisha
  rationale: Nahau hii inaonyesha nguvu kudhoofika au kushindwa. ‘Zimeisha’ ni Kiswahili cha kawaida kinachoeleza uchovu na kutoweza kuendelea bila kuongeza wazo la kutokuwa tayari.
- source_word: הַסַּבָּל
  choice: wabeba mizigo
  rationale: Ingawa umbo la Kiebrania ni umoja, limetumika kwa maana ya kundi; wingi wa Kiswahili ni wa asili zaidi na huhifadhi maana mahususi ya watu waliobeba mizigo.
- source_word: הֶעָפָר
  choice: kifusi
  rationale: Neno kwa kawaida humaanisha vumbi au udongo, lakini katika muktadha wa ukuta uliobomoka linarejelea mabaki ya uharibifu.
- source_word: לֹא נוּכַל
  choice: hatuwezi
  rationale: Hueleza kutokuwa na uwezo, si kutokuwa tayari.
- source_word: לִבְנוֹת בַּחוֹמָה
  choice: kujenga ukuta
  rationale: Ingawa kihusishi ב kipo katika Kiebrania, Kiswahili cha kawaida husema ‘kujenga ukuta’; tafsiri kama ‘kujenga kwenye ukuta’ ingeweza kudokeza kazi juu ya ukuta badala ya kuujenga.
theological_decisions: []
