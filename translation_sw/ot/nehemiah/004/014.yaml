  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בִּ/מְק֗וֹם אֲשֶׁ֤ר תִּשְׁמְעוּ֙ אֶת ק֣וֹל הַ/שּׁוֹפָ֔ר שָׁ֖מָּ/ה תִּקָּבְצ֣וּ אֵלֵ֑י/נוּ אֱלֹהֵ֖י/נוּ יִלָּ֥חֶם לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/014.yaml
  text: At the place where you hear the sound of the trumpet[a], gather there to us. Our God will fight for us.
translation:
  language: sw
  text: Mahali mtakaposikia sauti ya baragumu[a], kusanyikeni huko kwetu. Mungu wetu atatupigania.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sauti ya pembe ya kondoo dume.” Neno la Kiebrania shofari humaanisha hasa tarumbeta iliyotengenezwa kwa pembe.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: Mahali ...-po-
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida na kwa uwazi mahali ambako sauti itasikika, huku ukihifadhi maana ya mahali ya Kiebrania.
- source_word: תִּשְׁמְעוּ
  choice: mtakaposikia
  rationale: Kitenzi hiki kinahifadhi maana ya ‘kusikia’; wakati wa -takapo- unafaa kwa agizo linalotegemea tukio la baadaye.
- source_word: קוֹל הַשּׁוֹפָר
  choice: sauti ya baragumu
  rationale: ‘Sauti’ inawakilisha קוֹל waziwazi, na ‘baragumu’ ni neno la kawaida la kibiblia kwa tarumbeta; maelezo ya chini yanahifadhi umahususi wa shofari kama pembe inayopulizwa.
- source_word: שָׁמָּה
  choice: huko
  rationale: ‘Huko’ hurejelea mahali palipotajwa na kueleza mwelekeo wa kukusanyika kwa namna ya asili katika Kiswahili.
- source_word: תִּקָּבְצוּ
  choice: kusanyikeni
  rationale: Amri hii inaeleza watu kuja pamoja; ‘kusanyikeni’ ni ya kawaida, wazi, na inadumisha nguvu ya amri.
- source_word: אֵלֵינוּ
  choice: kwetu
  rationale: Kiambishi cha nafsi ya kwanza wingi kimehifadhiwa; ‘kwetu’ hapa humaanisha kuja mahali walipo msemaji na walio pamoja naye.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Kiambishi cha umilikaji cha Kiebrania kimehifadhiwa kwa sababu ni muhimu katika msisitizo wa sentensi.
- source_word: יִלָּחֶם לָנוּ
  choice: atatupigania
  rationale: Hii ni njia ya asili na yenye nguvu ya kusema kwamba Mungu mwenyewe atapigana kwa niaba yetu, bila kuigeuza kuwa msaada tu katika mapigano.
theological_decisions:
- issue: Lugha ya Mungu kupigana
  choice: Mungu wetu atatupigania
  alternative: Mungu wetu atatusaidia kupigana
  rationale: Kiebrania kinamtaja Mungu mwenyewe kuwa mtendaji wa kupigana kwa ajili ya watu wake; tafsiri haipunguzi hilo kuwa msaada tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Baragumu’ limetumiwa katika maandishi, huku umahususi wa chombo cha pembe ukielezwa katika tanbihi.
