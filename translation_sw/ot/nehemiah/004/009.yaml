base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/009.yaml
  text: And it happened that when our enemies heard that it had become known to us[a], and that God had frustrated their plan, we all returned to the wall[c][b], each man to his work.
translation:
  language: sw
  text: Ikawa, adui zetu waliposikia kwamba jambo hilo lilikuwa limejulikana kwetu[a], Mungu akabatilisha mpango wao[b], nasi sote tukarudi kwenye ukuta, kila mtu kwenye kazi yake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwamba tulikuwa tumeligundua jambo hilo.” Kiebrania husema kihalisi, “kwamba lilikuwa limejulikana kwetu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akavunja shauri lao,” yaani akalizuia lisifanikiwe.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania husema, “kila mtu kwenye kazi yake,” usemi unaowataja wafanyakazi mmoja mmoja.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni kiashiria cha simulizi kinacholeta hatua mpya; “Ikawa” ni kifupi, cha heshima, na kinaepuka lugha nzito isiyo ya lazima.
- source_word: כַּאֲשֶׁר
  choice: waliposikia
  rationale: Kiunganishi hiki kinaonyesha wakati; maana yake imeunganishwa kwa kawaida na kitenzi “kusikia” katika Kiswahili.
- source_word: אוֹיְבֵינוּ
  choice: adui zetu
  rationale: Ni tafsiri ya moja kwa moja ya nomino pamoja na kiambishi cha nafsi ya kwanza wingi.
- source_word: כִּי נוֹדַע לָנוּ
  choice: kwamba jambo hilo lilikuwa limejulikana kwetu
  rationale: Kauli ya kutendwa ya ידע imehifadhiwa. “Jambo hilo” huweka wazi rejeo linalodokezwa—mpango wa adui—bila kulifafanua kupita kiasi.
- source_word: וַיָּפֶר
  choice: akabatilisha
  rationale: הפר hapa ni kuufanya mpango usifaulu au kutekelezeka. “Akabatilisha” ni ya asili na hudumisha tendo la Mungu dhidi ya mpango huo.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha, neno hilo linamtaja Mungu wa Israeli moja kwa moja.
- source_word: עֲצָתָם
  choice: mpango wao
  rationale: עצה inaweza kuwa shauri au mpango; hapa “mpango” inafaa zaidi kwa njama ya kuwashambulia wajenzi.
- source_word: וְנָשׁוּב כֻּלָּנוּ
  choice: nasi sote tukarudi
  rationale: שוב ina maana ya kurudi, na כֻּלָּנוּ inasisitiza kwamba wote walifanya hivyo. Muundo wa “tuka-” unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida.
- source_word: הַחוֹמָה
  choice: kwenye ukuta
  rationale: Ni ukuta wa Yerusalemu uliokuwa ukijengwa upya; “kwenye ukuta” huonyesha kwa kawaida kurudi mahali pa kazi.
- source_word: אִישׁ אֶל מְלַאכְתּוֹ
  choice: kila mtu kwenye kazi yake
  rationale: אִישׁ imetumiwa kwa maana ya mgawanyo, yaani kila mfanyakazi mmoja mmoja. “Kila mtu” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kudai kwamba nomino hiyo inalenga jinsia kama hoja kuu.
theological_decisions:
- issue: Mungu kuubatilisha mpango wa adui
  choice: Mungu akabatilisha mpango wao
  alternative: mpango wao ukashindwa kwa sababu ya hali iliyotokea
  rationale: Kiebrania kinamhusisha Mungu moja kwa moja na kubatilishwa kwa mpango huo; tafsiri haifanyi tendo hilo lionekane kuwa bahati au hali isiyo na mtendaji.
- issue: Uhusiano wa vitenzi katika simulizi
  choice: Mungu akabatilisha ... nasi sote tukarudi
  alternative: kwamba Mungu alikuwa ameubatilisha ... sote tulirudi
  rationale: Kiebrania kinaendeleza vitenzi kwa viunganishi vya simulizi na hakina כִּי ya pili kabla ya tendo la Mungu. Muundo uliochaguliwa huhifadhi mfululizo huo bila kuondoa uwezekano kwamba kubatilishwa kwa mpango kulikuwa tayari dhahiri waliporudi kazini.
- issue: Usemi wa mgawanyo אִישׁ
  choice: kila mtu
  alternative: kila mwanamume
  rationale: Katika usemi אִישׁ אֶל מְלַאכְתּוֹ, אִישׁ hufanya kazi ya kugawa kundi kwa watu mmoja mmoja. “Kila mtu” huhifadhi kazi hiyo ya kisarufi kwa Kiswahili cha sasa bila kutatua zaidi ya maandishi utambulisho wa kila mfanyakazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Sentensi imetumia mfululizo wa “aka-/tuka-” ili kuakisi mwendo wa simulizi la Kiebrania. “Ukuta” limeachwa bila ufafanuzi wa ziada kwa kuwa muktadha tayari ni ujenzi wa ukuta wa Yerusalemu.
