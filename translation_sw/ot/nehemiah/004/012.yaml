  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הַ֨/בּוֹנִ֔ים אִ֥ישׁ חַרְבּ֛/וֹ אֲסוּרִ֥ים עַל מָתְנָ֖י/ו וּ/בוֹנִ֑ים וְ/הַ/תּוֹקֵ֥עַ בַּ/שּׁוֹפָ֖ר אֶצְלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/012.yaml
  text: And the builders each had his sword strapped at his side while they built[a], and the one blowing the trumpet was beside me.
translation:
  language: sw
  text: Nao wajenzi walikuwa wakijenga, kila mmoja akiwa amefunga upanga wake kiunoni; naye aliyekuwa akipiga baragumu[a] alikuwa kando yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: shofari, yaani pembe iliyotumiwa kama baragumu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנִים / וּבוֹנִים
  choice: wajenzi / walikuwa wakijenga
  rationale: Nomino ya kwanza inawataja watu wanaojenga, na ya pili inaonyesha tendo lao linaloendelea. Kurudia mzizi wa neno kwa ‘wajenzi ... wakijenga’ kunaakisi urudiaji wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: אִישׁ
  choice: kila mmoja
  rationale: 'Hapa neno hili lina maana ya mgawanyo: kila mtu miongoni mwa wajenzi.'
- source_word: חַרְבּוֹ
  choice: upanga wake
  rationale: Hii ni tafsiri ya moja kwa moja ya nomino pamoja na kiambishi chake cha umilikaji.
- source_word: אֲסוּרִים
  choice: akiwa amefunga
  rationale: Kitenzi kinaonyesha kitu kilichofungwa au kukazwa. Katika muktadha huu, kauli hii inaeleza jinsi kila mjenzi alivyovaa upanga wake tayari kwa matumizi.
- source_word: עַל מָתְנָיו
  choice: kiunoni
  rationale: Maana halisi inahusu eneo la kiuno au nyonga; ‘kiunoni’ ni usemi wa kawaida na sahihi kwa upanga uliovaliwa hapo.
- source_word: וְהַתּוֹקֵעַ בַּשּׁוֹפָר
  choice: naye aliyekuwa akipiga baragumu[a]
  rationale: Kirai cha Kiebrania kinamtaja mtu anayepuliza shofari. ‘Kupiga baragumu’ ni usemi wa kawaida wa Kiswahili, huku tanbihi ikibainisha aina hususa ya chombo.
- source_word: אֶצְלִי
  choice: alikuwa kando yangu
  rationale: Neno hili linaonyesha ukaribu wa mahali; ‘kando yangu’ ni la kawaida na linafaa katika muktadha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘wajenzi walikuwa wakijenga’ umehifadhi urudiaji wa mzizi wa Kiebrania bila kufanya sentensi kuwa ngumu. Alama ya tanbihi imewekwa baada ya ‘baragumu,’ ambako ufafanuzi wa shofari unahusika moja kwa moja.
