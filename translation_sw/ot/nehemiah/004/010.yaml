base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/010.yaml
  text: And from that day on[a], half of my young men were doing the work, and half of them were holding the spears, the shields, the bows, and the armor[c][b]; and the officers were behind all the house of Judah.
translation:
  language: sw
  text: Tangu siku hiyo na kuendelea, nusu ya vijana wangu[a] walikuwa wakifanya kazi, na nusu nyingine walikuwa wameshika mikuki, ngao, pinde na mavazi ya kujikinga vitani[b]. Nao maafisa walikuwa nyuma ya nyumba yote ya Yuda.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumishi wangu” au “wahudumu wangu”; neno la Kiebrania linaweza kumaanisha vijana, watumishi au wahudumu, kutegemea muktadha.
    reason: lexical_alternative
  - marker: b
    text: Yaani mavazi ya kulinda mwili vitani; huenda yalikuwa deraya au ngao za kifuani.
    reason: lexical_alternative
  - marker: c
    text: Kuwa kwa maafisa “nyuma ya nyumba yote ya Yuda” huenda kunaonyesha kwamba walikuwa wamewekwa nyuma ya wafanyakazi Wayuda ili kuwasaidia au kuwasimamia.
    reason: cultural_note
lexical_decisions:
- source_word: נְעָרַי
  choice: vijana wangu
  rationale: Neno נַעַר linaweza kumaanisha kijana, mtumishi au mhudumu. “Vijana wangu” huhifadhi maana yake ya msingi bila kulazimisha hapa uhusiano wa utumishi.
- source_word: עֹשִׂים בַּמְּלָאכָה
  choice: walikuwa wakifanya kazi
  rationale: Muundo wa kitenzi kishirikishi unaonyesha shughuli iliyokuwa ikiendelea; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: מַחֲזִיקִים
  choice: walikuwa wameshika
  rationale: Hifili ya חזק hapa ina maana ya kushika au kuwa tayari na silaha. “Wameshika” huhifadhi picha halisi ya maandishi.
- source_word: הָרְמָחִים
  choice: mikuki
  rationale: רֹמַח ni mkuki au mkuki mrefu; “mikuki” ni neno la kawaida na linaloeleweka.
- source_word: הַמָּגִנִּים
  choice: ngao
  rationale: מָגֵן humaanisha ngao.
- source_word: הַקְּשָׁתוֹת
  choice: pinde
  rationale: קֶשֶׁת humaanisha upinde; hapa wingi wake ni “pinde.”
- source_word: הַשִּׁרְיֹנִים
  choice: mavazi ya kivita
  rationale: שִׁרְיוֹן hurejelea vazi la kulinda mwili vitani. “Mavazi ya kivita” ni wazi na halidai kwa uhakika aina maalumu ya deraya.
- source_word: הַשָּׂרִים
  choice: maafisa
  rationale: שַׂר linaweza kumaanisha mkuu, kiongozi au afisa. Katika mpangilio huu wa ulinzi na kazi, “maafisa” linaonyesha wajibu wao bila kuingiza wazo la kifalme.
- source_word: אַחֲרֵי כָּל בֵּית יְהוּדָה
  choice: nyuma ya nyumba yote ya Yuda
  rationale: Tafsiri hii huhifadhi maana ya mahali ya אַחֲרֵי na usemi wa kijumuiya “nyumba ya Yuda,” bila kuamua kimya-kimya ikiwa walikuwa wakisimamia au kusaidia.
