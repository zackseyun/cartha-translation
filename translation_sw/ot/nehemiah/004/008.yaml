  source_fidelity: Tafsiri kwa ujumla inafuata kwa uaminifu mfuatano wa simulizi, makundi matatu ya wasikilizaji, katazo la kuogopa, na wito wa kupigana kwa ajili ya familia na nyumba. Hata hivyo, “watu wengine wote” huongeza msisitizo wa “wote” usio wazi katika יֶתֶר הָעָם; “watu waliobaki” hufuata maana ya “wengine/rest” kwa karibu zaidi. Pia, “ndugu zenu” katika Kiswahili inaweza kujumuisha jinsia zote, ilhali אֲחֵיכֶם ni “ndugu wa kiume” na orodha inayofuata hutaja wana wa kiume na wa kike kwa tofauti.
  naturalness: Kiswahili ni cha kawaida na chenye heshima. “Wana wenu wa kiume na wa kike” inaeleweka, lakini “wana wenu wa kiume, binti zenu” ni ya asili zaidi na huhifadhi mpangilio wa orodha ya Kiebrania. “Watu waliobaki” pia ni ya kawaida katika muktadha huu.
  terminology: “Bwana” hutafsiri kwa usahihi אֲדֹנָי kama cheo cha Mungu. “Wa kuogofya” huhifadhi maana ya kicho na hofu ya נוֹרָא, ingawa “Bwana aliye mkuu” inaweza kusikika kidogo isiyo ya kawaida; “Bwana, aliye mkuu na wa kuogofya,” inabaki wazi na sahihi.
