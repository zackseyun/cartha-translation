base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/008.yaml
  text: Then I looked[a], rose up, and said to the nobles, to the officials, and to the rest of the people, “Do not be afraid of them. Remember the Lord, who is great and fearsome, and fight for your brothers, your sons, your daughters, your wives[b], and your houses.”
translation:
  language: sw
  text: Kisha nikatazama, nikasimama, nikawaambia wakuu, maofisa, na watu waliobaki, “Msiwaogope. Mkumbukeni Bwana, aliye mkuu na wa kuogofya[a], nanyi mpigane kwa ajili ya ndugu zenu wa kiume[b], wana wenu wa kiume, binti zenu, wake zenu, na nyumba zenu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wa kutisha” au “mwenye kutia kicho.” Neno la Kiebrania humaanisha anayesababisha kicho au hofu.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “ndugu zenu wa kiume” lina umbo la kiume la wingi; kisha mstari unataja kando wana wa kiume, binti, na wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Kisha nikatazama
  rationale: Kitenzi ראה katika mfuatano wa simulizi kinaonyesha kwamba Nehemia aliangalia hali iliyokuwapo kabla ya kuchukua hatua. “Nikatazama” huhifadhi tendo hilo la kuangalia, huku “kisha” ikiweka wazi mwendelezo wa simulizi.
- source_word: וָאָקוּם
  choice: nikasimama
  rationale: קום hapa inaonyesha kusimama ili kuchukua hatua ya uamuzi. “Nikasimama” ni Kiswahili cha kawaida na chenye nguvu inayofaa katika simulizi.
- source_word: הַחֹרִים
  choice: wakuu
  rationale: חֹרִים ni watu wenye cheo na hadhi katika jamii. “Wakuu” ni neno la kawaida la Kiswahili linalofaa kwa viongozi hao wa tabaka la juu.
- source_word: הַסְּגָנִים
  choice: maofisa
  rationale: סְגָנִים ni watawala au wasimamizi walio chini ya mamlaka nyingine. “Maofisa” linaeleweka kwa urahisi na kutofautisha kundi hili na wakuu.
- source_word: יֶתֶר הָעָם
  choice: watu wengine wote
  rationale: Kirai hiki kinataja jamii iliyobaki baada ya viongozi waliotajwa. “Watu wengine wote” ni cha asili na kinaonyesha ukamilifu wa kundi hilo.
- source_word: אַל תִּירְאוּ מִפְּנֵיהֶם
  choice: Msiwaogope
  rationale: Muundo wa ירא pamoja na מִפְּנֵי katika muktadha huu unakataza kuwaogopa maadui. “Msiwaogope” ni amri ya moja kwa moja na ya kawaida.
- source_word: אֶת אֲדֹנָי
  choice: Bwana
  rationale: אֲדֹנָי ni cheo cha Mungu, si jina יהוה. “Bwana” ndilo neno la kawaida na lenye heshima kwa cheo hiki katika Kiswahili.
- source_word: הַגָּדוֹל וְהַנּוֹרָא
  choice: aliye mkuu na wa kuogofya
  rationale: נוֹרָא humweleza anayechochea hofu yenye kicho. “Wa kuogofya” huhifadhi uzito huo kuliko neno ambalo lingeonyesha kuvutia au kustaajabisha tu.
- source_word: זְכֹרוּ
  choice: Mkumbukeni
  rationale: Amri hii inawataka wamweke Bwana akilini na kutenda kwa kuzingatia yeye. “Mkumbukeni” ni tafsiri ya moja kwa moja yenye uzito unaofaa.
- source_word: וְהִלָּחֲמוּ עַל
  choice: nanyi mpigane kwa ajili ya
  rationale: Kitenzi pamoja na עַל hapa kinamaanisha kupigana ili kuwalinda au kuwatetea waliotajwa. “Mpigane kwa ajili ya” kinaeleza maana hiyo kwa kawaida.
- source_word: אֲחֵיכֶם
  choice: ndugu zenu
  rationale: Ingawa neno la Kiebrania lina umbo la kiume la wingi na linaweza kumaanisha ndugu wa kiume, “ndugu” katika Kiswahili linaweza kuwa la jinsia yoyote. Tanbihi inaweka wazi umbo la chanzo bila kulazimisha maana pana.
- source_word: בְּנֵיכֶם וּבְנֹתֵיכֶם נְשֵׁיכֶם וּבָתֵּיכֶם
  choice: wana wenu wa kiume na wa kike, wake zenu na nyumba zenu
  rationale: 'Tafsiri inadumisha orodha mahsusi na yenye kuongezeka: wana wa kiume, wana wa kike, wake na nyumba. “Nyumba” pia huacha wazi uwezekano wa makao au jamaa ya nyumbani.'
theological_decisions:
- issue: Tafsiri ya cheo cha Mungu אֲדֹנָי
  choice: Bwana
  alternative: Mtawala
  rationale: Chanzo kimetumia אֲדֹנָי, si יהוה. “Bwana” hudumisha cheo cha Mungu kwa njia iliyozoeleka bila kukichanganya na jina la agano.
- issue: Maana ya הַנּוֹרָא
  choice: wa kuogofya
  alternative: wa kutisha; wa kustaajabisha
  rationale: 'Neno hili linaunganisha kicho na hofu. “Wa kuogofya” hudumisha mvutano wa kifungu: watu hawapaswi kuwaogopa maadui, bali wamkumbuke Mungu ambaye ukuu wake huleta hofu yenye kicho.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha mfuatano wa haraka wa vitendo na amri za moja kwa moja. Alama za tanbihi zimewekwa kwenye maneno yanayohusika, si katika nafasi zisizolingana na maelezo yake.
