  yaml_path: translation/ot/nehemiah/004/007.yaml
  text: Then I stationed men in the lowest parts of the place[a], behind the wall, in the exposed areas; and I stationed the people by families, with their swords, their spears, and their bows.
translation:
  language: sw
  text: Ndipo nikaweka watu katika sehemu za chini kabisa za eneo hilo, nyuma ya ukuta, mahali palipokuwa wazi[a]; kisha nikawaweka watu kwa jamaa zao, wakiwa na panga zao, mikuki yao na pinde zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika sehemu zilizo wazi.” Neno la Kiebrania ni adimu na huenda likarejelea sehemu wazi au zisizofunikwa ambazo zilikuwa rahisi kushambuliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעֲמִיד
  choice: nikaweka / nikawapanga
  rationale: Hifili ya עמד ina maana ya kuwaweka watu katika nafasi za ulinzi. Katika sehemu ya pili, “nikawapanga” inaeleza kwa Kiswahili cha kawaida upangaji wao kwa jamaa bila kupoteza maana ya kijeshi.
- source_word: מִתַּחְתִּיּוֹת לַמָּקוֹם
  choice: katika sehemu za chini kabisa za eneo hilo
  rationale: Tafsiri hii inadumisha maana ya kijiografia ya maeneo ya chini au ya chini kabisa, huku מקום ikitafsiriwa kwa kawaida kama “eneo.”
- source_word: מֵאַחֲרֵי לַחוֹמָה
  choice: nyuma ya ukuta
  rationale: Ni usemi wa moja kwa moja na wa kawaida unaoonyesha mahali walipowekwa kwa ajili ya ulinzi.
- source_word: בצחחיים
  choice: mahali palipokuwa wazi
  rationale: Neno hili la Kiebrania ni adimu na huenda likamaanisha sehemu zilizo wazi, tupu au zisizofunikwa. Chaguo hili linafaa muktadha wa maeneo yaliyoweza kushambuliwa huku tanbihi ikihifadhi kutokuwa na uhakika.
- source_word: לְמִשְׁפָּחוֹת
  choice: kwa jamaa zao
  rationale: משפחה inaweza kumaanisha familia pana au ukoo. “Jamaa zao” ni lugha ya kawaida inayofaa kwa vikundi vya kifamilia bila kulazimisha maana finyu ya familia ya nyumbani.
- source_word: חַרְבֹתֵיהֶם רָמְחֵיהֶם וְקַשְּׁתֹתֵיהֶם
  choice: panga zao, mikuki yao na pinde zao
  rationale: Majina ya silaha yametafsiriwa moja kwa moja na orodha ya vipengele vitatu imehifadhiwa.
