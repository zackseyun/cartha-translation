  text: The builders on the wall[a], and those who carried burdens, loaded themselves so that with one hand each did the work[b], and with the other held his weapon.
translation:
  language: sw
  text: Wale waliokuwa wakijenga ukuta, pamoja na wabeba mizigo waliokuwa wakipakia, kila mmoja alifanya kazi kwa mkono mmoja, na kwa mkono mwingine alishika silaha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Neno la Kiebrania הַשָּׁלַח huenda likamaanisha hasa mkuki, mshale wa kutupwa, au silaha nyingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנִים בַּחוֹמָה
  choice: wale waliokuwa wakijenga ukuta
  rationale: Kirai hiki kinawasilisha kitenzi endelevu cha Kiebrania kwa Kiswahili cha kawaida na kueleza wazi kazi ya ujenzi bila kufanya ‘kwenye ukuta’ isikike kana kwamba walikuwa juu yake.
- source_word: וְהַנֹּשְׂאִים בַּסֶּבֶל
  choice: pamoja na wale waliobeba mizigo
  rationale: נשא pamoja na סבל humaanisha kubeba mizigo au vifaa; ‘mizigo’ ni neno la kawaida na linalofaa katika muktadha wa ujenzi.
- source_word: עֹמְשִׂים
  choice: walikuwa wamelemewa na mizigo
  rationale: Umbo hili adimu linaonyesha kwamba wabebaji walikuwa wamepakizwa au kulemewa na vifaa. Tafsiri hii inadumisha wazo hilo huku tanbihi ikihifadhi kutokuwa na uhakika wa maana kamili.
- source_word: בְּאַחַת יָדוֹ עֹשֶׂה בַמְּלָאכָה
  choice: Kila mmoja alifanya kazi kwa mkono mmoja
  rationale: Kiwakilishi cha umoja kina maana ya kugawa kwa kila mfanyakazi; ‘kila mmoja’ huiweka wazi kwa Kiswahili cha kawaida.
- source_word: וְאַחַת מַחֲזֶקֶת הַשָּׁלַח
  choice: na kwa mkono mwingine alishika silaha
  rationale: Mkono umetajwa kwa kudokezwa katika Kiebrania na lazima uelezwe katika Kiswahili. ‘Silaha’ huhifadhi maana pana bila kuamua kwamba kifaa hicho kilikuwa hasa mkuki au mshale.
