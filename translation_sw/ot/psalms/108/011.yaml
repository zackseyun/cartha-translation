  text: Have you not rejected us[a], O God? And do you not go out with our armies?
translation:
  language: sw
  text: Je, si wewe, Ee Mungu, umetukataa[a], wala huendi pamoja na majeshi yetu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umetutupa mbali.” Kitenzi cha Kiebrania kinaweza kuonyesha kukataa kwa nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, si wewe ...?
  rationale: Huendeleza swali la balagha linalotarajia jibu la kukubali, kwa Kiswahili cha kawaida na cha asili.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Nomino hii ya umbo la wingi inamtaja Mungu mmoja hapa, kama vitenzi vya umoja vinavyoonyesha; 'Ee' linaweka wazi mwito wa moja kwa moja.
- source_word: זְנַחְתָּנוּ
  choice: uliyetukataa
  rationale: Kitenzi זנח kina maana ya kukataa au kutupilia mbali. 'Uliyetukataa' ni wazi, chenye nguvu, na hakipunguzi malalamiko ya agano.
- source_word: וְלֹא
  choice: Wala ...
  rationale: '''Wala'' huunganisha kauli hasi ya pili na swali la kwanza kwa mtiririko wa asili bila kuingiza utofautishaji usiokuwapo.'
- source_word: תֵצֵא
  choice: huendi
  rationale: Imperfecti inaweza kueleza hali ya sasa au kitendo cha kawaida katika muktadha huu wa maombolezo. 'Huendi' huhifadhi kitenzi cha msingi bila kuongeza dhana ya 'kuandamana vitani' ndani ya kitenzi chenyewe.
- source_word: בְּצִבְאֹתֵינוּ
  choice: pamoja na majeshi yetu
  rationale: צָבָא humaanisha jeshi; wingi wake umetafsiriwa 'majeshi.' Kihusishi ב hapa huonyesha kuandamana au kuwa pamoja katika msaada wa kijeshi.
theological_decisions:
- issue: Lugha ya Mungu kuwakataa watu wake katika maombolezo
  choice: Mstari unasalia kuwa malalamiko ya moja kwa moja kwamba Mungu amewakataa watu wake na haendi pamoja na majeshi yao.
  alternative: Kulainisha kwa kusema 'umetuacha' au 'hauko nasi.'
  rationale: Kiebrania זנח kina nguvu ya kukataa au kutupilia mbali. Tafsiri inahifadhi mvutano wa kiteolojia wa maombolezo badala ya kuupunguza.
- issue: Upeo wa swali la balagha
  choice: Kishazi cha kwanza kinatolewa kama swali; kishazi cha pili kinaendelea kama kauli hasi iliyoratibiwa ndani ya wazo hilo.
  alternative: Kuweka alama ya swali tena mwishoni kana kwamba kishazi cha pili ni swali tofauti.
  rationale: הֲלֹא inaanzisha swali, lakini Kiebrania hakirudii chembe ya kuuliza katika kishazi cha pili; uundaji huu huhifadhi uratibu na hali ya malalamiko bila kulazimisha mgawanyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mwito 'Ee Mungu' unafaa kwa ushairi na sala, huku 'majeshi yetu' ikiwa wazi kwa msomaji wa kawaida.
