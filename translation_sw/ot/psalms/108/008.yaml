base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/008.yaml
  text: Gilead is mine[a]; Manasseh is mine; Ephraim is the stronghold of my head[b]; Judah is my ruler's staff.
translation:
  language: sw
  text: Gileadi ni yangu; Manase ni yangu; Efraimu ni ngome ya kichwa changu[a]; Yuda ni fimbo yangu ya utawala.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “Efraimu ni ngome ya kichwa changu”; hii ni taswira ya kishairi ya nguvu inayolinda.
    reason: lexical_alternative
  - marker: b
    text: Au, “Yuda ndiye mtoa sheria wangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי
  choice: ni yangu
  rationale: Kiambishi cha nafsi ya kwanza katika לִי kinaonyesha umilikaji; “ni yangu” ni usemi wa kawaida wa Kiswahili unaohifadhi tamko hilo la umiliki.
- source_word: גִלְעָד
  choice: Gileadi
  rationale: Jina la mahali limeandikwa kwa namna iliyozoeleka katika Kiswahili.
- source_word: מְנַשֶּׁה
  choice: Manase
  rationale: Jina la kabila na eneo limeandikwa kwa namna iliyozoeleka katika Kiswahili.
- source_word: אֶפְרַיִם
  choice: Efraimu
  rationale: Jina la kabila limeandikwa kwa namna iliyozoeleka katika Kiswahili.
- source_word: מָעוֹז
  choice: ngome
  rationale: Neno hili humaanisha mahali au chanzo cha nguvu na ulinzi; “ngome” inadumisha taswira ya kijeshi na kisiasa.
- source_word: רֹאשִׁי
  choice: kichwa changu
  rationale: Hii ndiyo maana ya moja kwa moja ya Kiebrania. Taswira ya kishairi imehifadhiwa bila kuibadili kimya kimya kuwa “kofia ya chuma” au maelezo mengine.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Jina la kabila limeandikwa kwa namna iliyozoeleka katika Kiswahili.
- source_word: מְחֹקְקִי
  choice: fimbo yangu ya utawala
  rationale: Nomino inaweza kumaanisha mtawala au mtoa sheria, au fimbo inayoashiria mamlaka yake. “Fimbo yangu ya utawala” inadumisha taswira halisi ya kifalme bila kuifanya kuwa “fimbo ya enzi,” neno ambalo si sawa kabisa na neno la Kiebrania hapa.
theological_decisions:
- issue: Taswira ya mamlaka ya Yuda katika מְחֹקְקִי
  choice: Yuda ni fimbo yangu ya utawala
  alternative: Yuda ndiye mtoa sheria wangu
  rationale: Muktadha unaonyesha makabila na maeneo kama mali au vyombo vya utawala wa Mungu. Tafsiri iliyochaguliwa inahifadhi taswira ya fimbo inayowakilisha mamlaka; maana mbadala ya mtu anayetunga au kutoa sheria imewekwa katika tanbihi ili kutofuta utata halisi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na marudio ya “ni yangu” yamehifadhiwa; taswira isiyo ya kawaida ya “ngome ya kichwa changu” imeachwa katika maandishi kwa sababu iko wazi katika Kiebrania, huku tanbihi ikiifafanua.
