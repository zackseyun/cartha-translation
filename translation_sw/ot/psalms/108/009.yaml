base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/009.yaml
  text: Moab is my washbasin[a]; on Edom I throw my sandal[c][b]; over Philistia I shout in triumph.
translation:
  language: sw
  text: Moabu ni beseni langu la kunawia[a]; juu ya Edomu nitatupa kiatu changu[b]; juu ya Ufilisti nitapaza sauti ya ushindi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sufuria yangu ya kunawia.” Picha ya Kiebrania ni ya chombo cha kuoshea, ikionyesha kudhalilishwa au kutiishwa kwa Moabu.
    reason: lexical_alternative
  - marker: b
    text: Au, “nitarusha kiatu changu.” Huenda tendo hili linaashiria mamlaka juu ya Edomu au kuidai kuwa mali.
    reason: lexical_alternative
  - marker: c
    text: Au, “nitapaza sauti juu ya Ufilisti,” au “nitapiga kelele juu ya Ufilisti.” Kitenzi cha Kiebrania kinaweza kumaanisha sauti ya shangwe au kilio cha vita.
    reason: alternative_reading
lexical_decisions:
- source_word: סִיר רַחְצִי
  choice: birika langu la kunawia
  rationale: סִיר ni chombo kama birika au beseni, na רַחְצִי hukibainisha kuwa cha kunawia. Kauli hii inadumisha picha halisi ya kishairi huku ikidokeza kudhalilishwa au kutiishwa kwa Moabu.
- source_word: אַשְׁלִיךְ נַעֲלִי
  choice: nitatupa kiatu changu
  rationale: Kitenzi אַשְׁלִיךְ humaanisha kutupa au kurusha, na נַעַל ni kiatu, mara nyingi kiatu cha ngozi katika mazingira ya kale. Taswira halisi imehifadhiwa badala ya kufafanuliwa moja kwa moja kuwa kutawala au kudai umiliki.
- source_word: עַל / עֲלֵי
  choice: juu ya
  rationale: Kihusishi עַל kinaweza kumaanisha juu ya, dhidi ya, au kuelekea kulingana na muktadha. 'Juu ya' huhifadhi uhusiano wa kishairi katika tendo la kutupa kiatu na katika sauti inayopazwa juu ya Ufilisti.
- source_word: אֶתְרוֹעָע
  choice: nitapaza sauti ya ushindi
  rationale: Umbo hili la רוע/רועע linaonyesha kupaza sauti, ambayo yaweza kuwa ya shangwe au ya vita. 'Nitapaza sauti ya ushindi' huonyesha tendo la sauti na muktadha wa ushindi bila kulifanya kwa lazima kuwa kilio maalumu cha kijeshi.
- source_word: פְלֶשֶׁת
  choice: Ufilisti
  rationale: Jina la Kiebrania linataja nchi au eneo la Wafilisti, si watu moja kwa moja; kwa hiyo 'Ufilisti' linafuata umbo la chanzo.
- source_word: מוֹאָב / אֱדוֹם
  choice: Moabu / Edomu
  rationale: Haya ni maumbo ya kawaida ya Kiswahili ya majina ya kale Moabu na Edomu.
theological_decisions:
- issue: Lugha ya sitiari kuhusu kuyatawala mataifa adui
  choice: Kuhifadhi picha halisi za birika la kunawia, kutupa kiatu, na kupaza sauti ya ushindi
  alternative: Kufafanua moja kwa moja kwamba Moabu ni mtumishi, Edomu inadaiwa kuwa mali, na Ufilisti umeshindwa
  rationale: Mstari unatumia taswira kali za kishairi za kudhalilishwa, mamlaka, na ushindi. Tafsiri huhifadhi taswira hizo badala ya kuzipunguza ziwe maelezo ya kisiasa pekee; maana zake zinazowezekana zinaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Wakati ujao umetumiwa kwa אַשְׁלִיךְ na אֶתְרוֹעָע, kwa kufuata maumbo ya Kiebrania. Alama zote za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
