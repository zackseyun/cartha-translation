  yaml_path: translation/ot/psalms/108/002.yaml
  text: Awake[a], harp and lyre; I will awaken the dawn.
translation:
  language: sw
  text: 'Amkeni, kinanda na kinubi;

    nitaamsha alfajiri.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוּרָה
  choice: Amka
  rationale: Amri ya kishairi inayoelekezwa kwa ala za muziki. Ingawa umbo la Kiebrania ni la umoja mbele ya nomino mbili zilizounganishwa, mwito mfupi wa “Amka” huhifadhi uhai wa picha bila kulazimisha upatanisho wa kawaida wa Kiswahili.
- source_word: הַנֵּבֶל
  choice: kinanda
  rationale: Neno hili hutaja ala ya nyuzi. “Kinanda” ni neno linaloeleweka kwa urahisi katika Kiswahili na hapa linatumiwa kwa maana pana ya ala ya nyuzi, likitofautishwa na kinubi.
- source_word: וְכִנּוֹר
  choice: na kinubi
  rationale: כִּנּוֹר ni ala ya nyuzi inayofanana na lyre; “kinubi” ni kisawe cha kawaida cha kibiblia na huhifadhi tofauti kati ya ala hizi mbili.
- source_word: אָעִירָה
  choice: nitauamsha
  rationale: Umbo la nafsi ya kwanza linaonyesha azimio la msemaji. “Nitauamsha” pia hurudia mzizi wa wazo la “Amka” na kuhifadhi taswira hai ya kishairi.
- source_word: שָּׁחַר
  choice: alfajiri
  rationale: שַׁחַר ni mapambazuko au wakati wa kupambazuka. “Alfajiri” ni neno la kawaida na la kishairi linalofaa kwa taswira ya mwimbaji kuanza sifa kabla ya kucha.
