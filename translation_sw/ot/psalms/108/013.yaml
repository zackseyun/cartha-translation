  text: With God we will do valiantly[a], and he will trample our foes.
translation:
  language: sw
  text: Katika Mungu tutatenda kwa ushujaa[a], naye atawakanyaga adui zetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tutafanya matendo makuu”; nahau ya Kiebrania inaweza kusisitiza nguvu, ushujaa, au tendo linaloleta ushindi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Kwa msaada wa Mungu
  rationale: Kiambishi ב hapa kinaonyesha utegemezi na njia ambayo ushindi hupatikana. Kauli hii ni ya asili katika Kiswahili na haifanyi tendo kuwa la wanadamu peke yao.
- source_word: נַעֲשֶׂה
  choice: tutatenda
  rationale: Kitenzi hiki ni Qal imperfect nafsi ya kwanza wingi; katika muktadha huu kinaeleza tendo la wakati ujao bila kulipanua kupita maana ya msingi.
- source_word: חָיִל
  choice: kwa ushujaa
  rationale: חַיִל inaweza kumaanisha nguvu, ushujaa, uwezo wa kijeshi, au matendo ya ushindi. Kauli hii inadumisha nahau ya muktadha wa vita kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: וְהוּא
  choice: naye
  rationale: Muundo huu unahifadhi uunganishaji na pia msisitizo wa kiwakilishi, ukihamisha mtazamo kutoka tendo la watu kwenda tendo la Mungu.
- source_word: יָבוּס
  choice: atawakanyaga
  rationale: Kitenzi בוס humaanisha kukanyaga au kuponda kwa kukanyaga. Tafsiri hii inadumisha taswira hai ya kuwashinda maadui.
- source_word: צָרֵינוּ
  choice: adui zetu
  rationale: Neno hili humaanisha wapinzani au watu wenye uhasama. 'Adui zetu' ni wazi, la kawaida, na linafaa sajili ya zaburi.
theological_decisions:
- issue: Utendaji katika ushindi
  choice: Mstari unaonyesha watu wakitenda kwa ushujaa kwa kumtegemea Mungu, kisha Mungu mwenyewe akiwashinda adui zao kabisa.
  alternative: Kutafsiri kwa namna inayofuta ushiriki wa watu, au kwa namna inayoufanya msaada wa Mungu kuwa wa pembeni tu.
  rationale: Kiebrania kinahifadhi kwa pamoja tendo la jumuiya linalotegemea Mungu na tendo la Mungu la kukanyaga adui; tafsiri haiondoi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. 'Kwa msaada wa Mungu' ni wazi kwa wasomaji wa kawaida, huku 'atawakanyaga' ikihifadhi taswira ya kijeshi ya maandishi ya Kiebrania.
