  text: אֱלֹהִ֤ים דִּבֶּ֥ר בְּ/קָדְשׁ֗/וֹ אֶעְלֹ֥זָה אֲחַלְּקָ֥ה שְׁכֶ֑ם וְ/עֵ֖מֶק סֻכּ֣וֹת אֲמַדֵּֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/007.yaml
  text: 'God has spoken in his holiness: “I will exult[b][a]; I will divide up Shechem and measure out the Valley of Succoth.”'
translation:
  language: sw
  text: 'Mungu amesema katika utakatifu wake[a]: “Nitashangilia[b]; nitaigawa Shekemu, nami nitalipima Bonde la Sukothi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika mahali pake patakatifu,” au “kwa utakatifu wake.” Usemi wa Kiebrania unaweza kumaanisha utakatifu wa Mungu au mahali patakatifu panapohusishwa naye.
    reason: lexical_alternative
  - marker: b
    text: Au “nitafurahi kwa shangwe.” Kitenzi cha Kiebrania kinaonyesha furaha kubwa yenye hali ya ushindi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Kitenzi cha umoja דִּבֶּר kinaonyesha kuwa hapa אֱלֹהִים humaanisha Mungu wa Israeli.
- source_word: דִּבֶּר
  choice: amesema
  rationale: Kauli timilifu inaripoti tamko la Mungu lililokamilika lakini lenye umuhimu wa sasa; “amesema” ni ya kawaida na hudumisha nguvu hiyo.
- source_word: בְּקָדְשׁוֹ
  choice: katika utakatifu wake
  rationale: Huhifadhi maana inayowezekana zaidi ya usemi unaohusiana na sifa ya utakatifu wa Mungu bila kuficha uwezekano wa kumaanisha mahali patakatifu au kiapo kwa utakatifu wake.
- source_word: אֶעְלֹזָה
  choice: Nitashangilia
  rationale: Kitenzi kinaeleza furaha kubwa yenye hali ya ushindi; “nitashangilia” ni Kiswahili cha sasa, wazi na chenye hadhi.
- source_word: אֲחַלְּקָה
  choice: nitaigawa
  rationale: Katika muktadha wa eneo, kitenzi kinaonyesha kugawa ardhi au kuiweka katika sehemu; kiambishi cha yambwa hurejelea Shekemu kama eneo.
- source_word: שְׁכֶם
  choice: Shekemu
  rationale: Jina la mahali limetoholewa kwa namna inayoeleweka katika Kiswahili.
- source_word: וְעֵמֶק סֻכּוֹת
  choice: nami nitalipima Bonde la Sukothi
  rationale: Muundo wa סמיכות unawakilishwa kwa kawaida kama “Bonde la Sukothi”; “nami” huonyesha ulinganifu wa kishairi.
- source_word: אֲמַדֵּד
  choice: nitalipima
  rationale: Kitenzi cha piel kina picha ya kupima eneo kwa kusudi la kuligawa au kuonyesha mamlaka juu yake; “nitalipima” hudumisha picha halisi bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Msemaji na upeo wa nukuu
  choice: Vitenzi vya nafsi ya kwanza vinawekwa ndani ya maneno ya Mungu kuhusu mamlaka yake juu ya nchi.
  alternative: Mtunga zaburi ndiye anayesema baada ya taarifa kwamba Mungu amesema.
  rationale: Sintaksia inaelekea zaidi kwenye usemi wa moja kwa moja unaoanzishwa na “Mungu amesema,” kisha kufuatwa na matamko ya nafsi ya kwanza; hili pia linaafikiana na lugha ya maeneo na ulinganifu wa Zaburi 60.
- issue: Maana ya בְּקָדְשׁוֹ
  choice: katika utakatifu wake
  alternative: katika mahali pake patakatifu; kwa utakatifu wake
  rationale: Neno קֹדֶשׁ linaweza kuashiria utakatifu kama sifa au mahali patakatifu. Maandishi makuu yanatumia maana ya sifa, huku tanbihi ikihifadhi utata halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishairi na picha ya Mungu kugawa na kupima maeneo vimehifadhiwa; majina ya mahali yametoholewa kama Shekemu na Sukothi.
