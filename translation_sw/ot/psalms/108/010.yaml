  text: מִ֣י יֹ֭בִלֵ/נִי עִ֣יר מִבְצָ֑ר מִ֖י נָחַ֣/נִי עַד אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/010.yaml
  text: Who will bring me to the fortified city? Who will lead me as far as Edom?[a][b][c]
translation:
  language: sw
  text: Ni nani atakayenifikisha katika mji wenye boma?[a] Ni nani atakayeniongoza hadi Edomu?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mji wenye boma” huenda unamaanisha mji fulani wa Edomu ulio na ngome, ambao kwa mapokeo mara nyingi hutambuliwa kuwa Sela/Petra, ingawa maandishi ya Kiebrania hayataji jina la mji huo.
    reason: cultural_note
  - marker: b
    text: Au, “Ni nani aliyeniongoza hadi Edomu?” Kitenzi cha pili kina umbo la wakati uliopita katika Kiebrania, lakini katika usambamba huu wa kishairi kinaweza kueleweka kuwa cha wakati ujao, kama kitenzi cha mstari wa kwanza. “Hadi Edomu” pia inaweza kutafsiriwa “mpaka Edomu” au kwa urahisi “Edomu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Ni nani
  rationale: Kiwakilishi cha kuuliza kinachoanzisha swali la balagha; muundo huu ni wa kawaida na wa heshima katika Kiswahili.
- source_word: יֹבִלֵנִי
  choice: atakayenifikisha
  rationale: Hifili ya יבל ina maana ya kumfanya mtu aende, yaani kumleta au kumfikisha; kwa kuwa mahali panapolengwa pametajwa, ‘kunifikisha’ ni ya asili na sahihi.
- source_word: עִיר מִבְצָר
  choice: mji wenye ngome
  rationale: Muundo huu una maana ya mji ulioimarishwa kwa ngome. Kiswahili ‘mji wenye ngome’ ni wazi na hakiongezi jina la mji ambalo halipo katika Kiebrania.
- source_word: נָחַנִי
  choice: atakayeniongoza
  rationale: Ingawa kitenzi kina umbo la qatal, usambamba wa kishairi na יֹבִלֵנִי pamoja na muktadha wa swali unaunga mkono maana ya wakati ujao au ya kimodal.
- source_word: עַד אֱדוֹם
  choice: mpaka Edomu
  rationale: עַד huonyesha kikomo au umbali unaofikiwa; ‘mpaka Edomu’ huhifadhi maana hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Wakati wa נָחַנִי katika mstari wa pili
  choice: atakayeniongoza
  alternative: aliyeniongoza
  rationale: Umbo la Kiebrania ni qatal, lakini katika usambamba huu wa kishairi linaweza kubeba nguvu ya wakati ujao inayotawaliwa na mstari wa kwanza. Tafsiri kuu inafuata usambamba na muktadha, huku tanbihi ikihifadhi uwezekano wa umbo rasmi la wakati uliopita.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Maswali mawili sambamba yamehifadhiwa; ‘Edomu’ ni umbo la kawaida la jina hilo katika Kiswahili cha Biblia.
