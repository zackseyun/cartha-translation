  naturalness: The draft is clear Standard East African Swahili. However, ‘mji wenye ngome’ can suggest a city that merely contains a fort/castle, whereas the Hebrew describes a city made secure by fortification. ‘Mji wenye boma’ is both natural in biblical Swahili and more precise.
