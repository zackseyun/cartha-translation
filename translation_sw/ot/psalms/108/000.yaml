lexical_decisions:
- source_word: שִׁיר
  choice: Wimbo
  rationale: Nomino hii humaanisha wimbo kwa upana; tafsiri rahisi inadumisha tofauti yake na neno linalofuata מִזְמוֹר bila kuifanya mahsusi kuwa wimbo wa sifa.
- source_word: מִזְמוֹר
  choice: zaburi
  rationale: Katika vichwa vya Zaburi, hili ndilo neno la kawaida na sahihi kwa utungo wa kishairi unaohusishwa na muziki.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kihusishi לְ katika vichwa vya Zaburi kinaweza kuonyesha utunzi, wakfu, umilikaji, au uhusiano. 'Ya Daudi' huhifadhi upana huo kwa Kiswahili kuliko 'iliyoandikwa na Daudi'.
theological_decisions:
- issue: Maana ya jina la Daudi katika kichwa
  choice: Kutumia usemi wenye upana, 'ya Daudi'.
  alternative: '''iliyoandikwa na Daudi'' au ''kwa ajili ya Daudi'''
  rationale: Kiebrania hakilazimishi uamuzi kwamba Daudi ndiye mtunzi au kwamba zaburi iliandaliwa kwa ajili yake; tafsiri inadumisha utata huo halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha fupi, ya heshima, na ya kawaida kwa kichwa cha zaburi. Alama ya tanbihi imewekwa baada ya 'ya Daudi', kifungu kinachoelezwa.
