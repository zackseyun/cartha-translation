base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/003.yaml
  text: I will give thanks to you among the peoples[a], O Yahweh[b], and I will sing praise to you among the nations.
translation:
  language: sw
  text: 'Nitakushukuru miongoni mwa mataifa, ee Yahweh,

    nami nitakuimbia sifa miongoni mwa mataifa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Nitakushukuru
  rationale: Hifili ya ידה katika muktadha wa zaburi huonyesha kutoa shukrani kwa kumsifu Mungu; “nitakushukuru” ni ya kawaida na huhifadhi usemi unaoelekezwa moja kwa moja kwa Mungu.
- source_word: בָעַמִּים
  choice: kati ya mataifa
  rationale: עַמִּים ni wingi unaorejelea jamii au mataifa mbalimbali; “kati ya mataifa” huwasilisha hadhira ya kimataifa kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: ee Yahweh
  rationale: Jina la Mungu יהוה limeandikwa moja kwa moja katika Kiebrania; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- source_word: וַאֲזַמֶּרְךָ
  choice: nami nitakuimbia sifa
  rationale: Pieli ya זמר huonyesha kuimba au kupiga muziki wa sifa; “nitakuimbia sifa” huunganisha tendo la kuimba na kusudi lake la kumsifu Mungu.
- source_word: בַּל אֻמִּים
  choice: kati ya makabila ya watu
  rationale: Katika mshororo huu בַּל hufanya kazi kama kihusishi kinacholingana na בָּ katika mshororo wa kwanza, na אֻמִּים humaanisha jamii au makundi ya watu. Tafsiri hii huhifadhi ulinganifu huku ikitofautisha kwa kiasi maneno mawili ya Kiebrania.
theological_decisions:
- issue: Namna ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia Tetragramatoni kama jina binafsi. “Yahweh” hulihifadhi kwa unukuzi bila kulibadili kuwa cheo.
- issue: Maana ya אוֹדְךָ
  choice: Nitakushukuru
  alternative: Nitakusifu
  rationale: Kitenzi kinaweza kujumuisha shukrani na sifa. Katika muktadha huu “nitakushukuru” ni maana halali ya msingi, huku mshororo wa pili ukitaja wazi kuimba sifa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mistari miwili inadumisha ulinganifu wa shairi la Kiebrania; tofauti kati ya עַמִּים na אֻמִּים imeonyeshwa kwa “mataifa” na “makabila ya watu” bila kupunguza upeo wa kimataifa.
