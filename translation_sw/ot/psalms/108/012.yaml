  text: Give us help against the adversary[b][a], for the salvation of man is vain.
translation:
  language: sw
  text: Utusaidie dhidi ya adui,[b] kwa maana wokovu wa mwanadamu ni bure.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wokovu wa binadamu ni bure.” “Mwanadamu” hapa ina maana ya binadamu kwa ujumla; katika muktadha huu usemi huo unarejelea msaada wa kibinadamu.
    reason: alternative_reading
  - marker: b
    text: Au, “Utusaidie kutoka katika taabu,” ikiwa צַר inaeleweka kuwa “taabu” badala ya “adui.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Utusaidie
  rationale: Ombi hili la kumpa au kumletea mwombaji msaada limetafsiriwa kwa Kiswahili cha kawaida kama ombi la moja kwa moja, ‘Utusaidie,’ badala ya kauli nzito ‘Utupe msaada.’
- source_word: לָּנוּ עֶזְרַת
  choice: Utusaidie
  rationale: Kiima na yambwa pamoja na nomino ‘msaada’ vimewasilishwa kwa kitenzi cha Kiswahili ‘saidia,’ ambacho ni cha asili na huhifadhi maana ya kuomba msaada.
- source_word: מִצָּר
  choice: dhidi ya adui
  rationale: צַר inaweza kumaanisha adui au taabu. Muktadha wa kijeshi wa zaburi unaunga mkono maana ya kibinafsi ‘adui’; מִן imetafsiriwa kwa namna ya kawaida kama ‘dhidi ya.’
- source_word: וְשָׁוְא
  choice: kwa maana ... ni bure
  rationale: שָׁוְא hudokeza ubatili, kutofaa, au kutokuwa na manufaa. ‘Kwa maana’ huonyesha uhusiano wa kisababu unaoeleweka katika muktadha, bila kubadili dai la kishairi.
- source_word: תְּשׁוּעַת
  choice: wokovu
  rationale: Neno hili linaweza kumaanisha wokovu, ukombozi, au ushindi. ‘Wokovu’ huhifadhi uhusiano wake wa kileksika, huku muktadha ukionyesha msaada wa kuokoa.
- source_word: אָדָם
  choice: mwanadamu
  rationale: Hapa אָדָם ina maana ya kijumla kuhusu binadamu, si mwanamume mmoja. ‘Mwanadamu’ ni ya asili, sahihi kijinsia, na yenye uzito wa kishairi katika Kiswahili.
theological_decisions:
- issue: Maana ya kijumla ya אָדָם katika kauli kuhusu kutotosha kwa msaada wa kibinadamu
  choice: mwanadamu
  alternative: wanadamu / binadamu
  rationale: Neno la Kiebrania lina maana ya kijumla. ‘Mwanadamu’ huhifadhi umoja wa kishairi bila kulifanya dai lihusu wanaume pekee; tanbihi inaeleza kuwa maana yake ni msaada wa kibinadamu kwa ujumla.
- issue: Upeo wa תְּשׁוּעַת katika muktadha
  choice: wokovu
  alternative: ukombozi / ushindi
  rationale: ‘Wokovu’ huhifadhi maana pana ya neno la Kiebrania. Haijawekewa kimyakimya maana maalumu ya wokovu wa milele, kwa kuwa hapa muktadha unaweza kuwa wa kuokolewa au kupata ushindi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo ni mfupi ili kuakisi ushairi wa Kiebrania. Alama zote za tanbihi zimewekwa katika matini kuu karibu na maneno yanayohusika.
