  text: For your steadfast love is great above the heavens[a], and your faithfulness reaches to the clouds.
translation:
  language: sw
  text: 'Kwa maana upendo wako thabiti ni mkuu kuliko mbingu,

    na uaminifu wako[a] hufika hadi mawinguni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukweli wako hufika hadi mawinguni.”
