lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huonyesha sababu ya sifa katika muktadha na ni kiunganishi cha kawaida, chenye hadhi katika Kiswahili.
- source_word: גָדוֹל
  choice: ni mkuu
  rationale: Huhifadhi wazo pana la ukubwa wa ajabu bila kulifupisha kuwa urefu wa mahali pekee.
- source_word: מֵעַל שָׁמַיִם
  choice: kuliko mbingu
  rationale: Katika muktadha huu מֵעַל huonyesha kwamba upendo wa Mungu unapita kimo cha mbingu. Kiswahili hiki ni cha kawaida huku kikihifadhi picha ya ulinganisho wa juu.
- source_word: חַסְדֶּךָ
  choice: upendo wako thabiti
  rationale: Huwasilisha upendo wenye kudumu, uaminifu na huruma unaodokezwa na חֶסֶד, bila kutumia istilahi ya kimadhehebu.
- source_word: וְעַד
  choice: na ... unafika
  rationale: Kitenzi kinachodokezwa na usambamba wa kishairi kimewekwa wazi ili sentensi iwe ya asili katika Kiswahili.
- source_word: שְׁחָקִים
  choice: mawinguni
  rationale: Huhifadhi taswira halisi ya mawingu katika ushairi wa Kiebrania.
- source_word: אֲמִתֶּךָ
  choice: uaminifu wako
  rationale: Katika usambamba na חֶסֶד, neno hili hasa huonyesha kutegemeka na uaminifu wa Mungu; maana ya “ukweli” imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Kutafsiri sifa za Mungu zinazooanishwa katika ushairi
  choice: “upendo wako thabiti” na “uaminifu wako”
  alternative: “fadhili zako” na “ukweli wako”
  rationale: Chaguo kuu linaonyesha uhusiano wa karibu kati ya חֶסֶד na אֱמֶת kama upendo wa kudumu na kutegemeka kwa Mungu, bila kulazimisha istilahi ya kiitikadi. Uwezekano halisi wa kutafsiri אֱמֶת kuwa “ukweli” umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa mistari huhifadhi usambamba wa Kiebrania.
