  yaml_path: translation/ot/psalms/108/006.yaml
  text: So that your beloved ones may be rescued[a], save with your right hand and answer me.
translation:
  language: sw
  text: Ili wapendwa wako waokolewe[a], okoa kwa mkono wako wa kulia, na unijibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakombolewe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: Ili
  rationale: Huanzisha kusudi au matokeo kwa Kiswahili cha kawaida, huku ikihifadhi uhusiano wa kishazi.
- source_word: יֵחָלְצוּן
  choice: waokolewe
  rationale: Nifali ya חלץ hapa ina maana ya kutolewa au kuokolewa kutoka hatarini; “waokolewe” ni ya asili na inafaa katika ombi hili.
- source_word: יְדִידֶיךָ
  choice: wapendwa wako
  rationale: Huhifadhi wingi na maana ya watu walio wapendwa kwa Mungu kwa lugha ya heshima na inayoeleweka.
- source_word: הוֹשִׁיעָה
  choice: okoa
  rationale: Amri ya ישׁע imetafsiriwa kwa kitenzi kifupi na cha kawaida katika lugha ya sala.
- source_word: יְמִינְךָ
  choice: kwa mkono wako wa kulia
  rationale: “Kwa” huonyesha mkono wa kulia kuwa chombo cha wokovu na huhifadhi taswira ya nguvu za Mungu.
- source_word: וַעֲנֵנִי
  choice: nawe unijibu
  rationale: Huhifadhi amri yenye kiambishi cha nafsi ya kwanza umoja; “nawe” huunganisha ombi la pili kwa Kiswahili cha asili bila kubadili “mimi” kuwa “sisi.”
theological_decisions:
- issue: Mabadiliko kutoka kwa wanufaika wa wingi hadi kwa mwombaji mmoja
  choice: Kuhifadhi “wapendwa wako” kisha “unijibu”
  alternative: Kusawazisha kwa wingi, kama “utujibu”
  rationale: Kiebrania hubadilika kwa makusudi kutoka kwa wapendwa wa Mungu walio wengi hadi kwa msemaji mmoja. Tafsiri haiufuti mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya lugha ya sala. Muundo ni wa ulinganifu mwafaka na unahifadhi taswira, wingi wa “wapendwa,” na umoja wa “unijibu.”
