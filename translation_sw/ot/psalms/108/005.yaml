lexical_decisions:
- source_word: רוּמָה
  choice: Umetukuke
  rationale: Kitenzi hiki ni agizo au ombi linaloelekezwa kwa Mungu. “Umetukuke” linaonyesha ombi kwamba ukuu na heshima yake itambuliwe, huku likihifadhi uwezekano wa picha ya kuinuka.
- source_word: עַל שָׁמַיִם
  choice: juu ya mbingu
  rationale: “Juu ya” linaonyesha kuinuliwa kupita mbingu, na “mbingu” linafaa kwa wingi wa Kiebrania na mtindo wa kishairi.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Nomino hii ni mwito wa moja kwa moja katika sala; “Ee” huonyesha mwito huo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: וְעַל כָּל הָאָרֶץ
  choice: na ... juu ya dunia yote
  rationale: Katika ulinganifu wa ulimwengu mzima kati ya mbingu na nchi, הָאָרֶץ humaanisha dunia, si eneo fulani la nchi.
- source_word: כְּבוֹדֶךָ
  choice: utukufu wako
  rationale: Katika muktadha wa sifa kwa Mungu, כָּבוֹד humaanisha utukufu, fahari, na adhama yake; “utukufu” ndilo neno la asili na linaloeleweka zaidi hapa.
theological_decisions:
- issue: Kitenzi kinachodokezwa katika mstari wa pili
  choice: na utukufu wako juu ya dunia yote
  alternative: na utukufu wako uwe juu ya dunia yote
  rationale: Kiebrania hakina kitenzi wazi katika mstari wa pili. Tafsiri kuu inaacha kishazi bila kitenzi ili kuhifadhi muundo huo na kutosuluhisha kimya kimya iwapo ni ombi linaloendeleza mstari wa kwanza au kauli kuhusu utukufu wa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi, wa kishairi na wenye hadhi. Alama ya nusu koloni inatenganisha mistari miwili ya ushairi huku ikionyesha uhusiano wao wa karibu.
