  text: Uinuliwe juu ya mbingu[a], Ee Mungu; na utukufu wako juu ya dunia yote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Inuka juu ya mbingu, Ee Mungu.”
