  text: My heart is steadfast[a], O God; I will sing and make music, even with my glory.
translation:
  language: sw
  text: Moyo wangu ni thabiti, Ee Mungu; nitaimba na kupiga muziki, hata utukufu wangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hata nafsi yangu yote”; Kiebrania kinasema kihalisi “utukufu wangu,” usemi wa kishairi unaoweza kurejelea nafsi ya ndani ya msemaji au hata ulimi kama chombo cha sifa.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכוֹן
  choice: ni thabiti
  rationale: Neno hili humaanisha kuwa imara, kuimarishwa au kuwa tayari. Katika muktadha huu linaonyesha azimio la ndani lililo imara la kumsifu Mungu.
- source_word: לִבִּי
  choice: moyo wangu
  rationale: Katika ushairi wa Kiebrania, ‘moyo’ unaweza kumaanisha nafsi ya ndani, nia na hisia; tafsiri hii ni ya asili na inadumisha taswira ya chanzo.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Hapa jina hili ni mwito wa moja kwa moja; ‘Ee Mungu’ ni namna ya kawaida na yenye heshima ya kuonyesha mwito huo kwa Kiswahili.
- source_word: אָשִׁירָה
  choice: nitaimba
  rationale: Umbo la Kiebrania linaonyesha nia au azimio la msemaji; ‘nitaimba’ linawasilisha azimio hilo kwa Kiswahili cha sasa.
- source_word: וַאֲזַמְּרָה
  choice: na kupiga muziki
  rationale: Kitenzi hiki kinaweza kumaanisha kuimba sifa au kufanya muziki, wakati mwingine kwa kutumia ala. ‘Kupiga muziki’ kinadumisha ulinganifu wa kishairi bila kurudia tu ‘kuimba.’
- source_word: אַף
  choice: naam
  rationale: Hapa neno hili linatilia mkazo au kuongeza wazo la mwisho. ‘Naam’ linaonyesha msisitizo huo kwa mtindo wa kishairi wenye heshima.
- source_word: כְּבוֹדִי
  choice: utukufu wangu
  rationale: Hii ndiyo maana ya moja kwa moja ya neno la Kiebrania. Matumizi yake hapa ni ya kishairi na yanaweza kurejelea nafsi ya ndani au ulimi; tafsiri kuu inadumisha fumbo hilo badala ya kuliamulia maana moja.
theological_decisions:
- issue: Maana ya כְּבוֹדִי katika lugha ya kishairi ya sifa
  choice: utukufu wangu
  alternative: nafsi yangu yote; nafsi yangu; ulimi wangu
  rationale: Kiebrania kinatumia sitiari yenye maana isiyoamuliwa kikamilifu. Kudumisha ‘utukufu wangu’ katika maandishi makuu kunahifadhi mvutano wa kishairi, huku tanbihi ikionyesha tafsiri zinazowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kishairi umehifadhiwa, na utata wa neno la mwisho umeelezwa katika tanbihi badala ya kuondolewa katika maandishi makuu.
