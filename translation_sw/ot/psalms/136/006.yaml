  text: to him who spread out the earth upon the waters[a], for his steadfast love endures forever.
translation:
  language: sw
  text: Kwa yeye aliyeitandaza dunia juu ya maji[a], kwa maana upendo wake thabiti hudumu milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyeinyoosha dunia juu ya maji”; kitenzi cha Kiebrania kinaweza pia kuwa na maana halisi ya “kufua kwa nyundo,” kama metali inavyofuliwa na kutandazwa kuwa bamba pana.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/רֹקַע
  choice: yeye aliyeitandaza
  rationale: Kiambishi לְ katika orodha hii humtambulisha anayestahili kushukuriwa, na kitenzi רקע humaanisha kutandaza au kupanua uso, pia kwa picha halisi ya kufua kitu kiwe kipana. ‘Aliyeitandaza’ ni Kiswahili cha kawaida kinachohifadhi picha hiyo.
- source_word: הָ/אָרֶץ
  choice: dunia
  rationale: Katika muktadha huu wa uumbaji wa ulimwengu, אֶרֶץ humaanisha dunia, si nchi fulani.
- source_word: עַל הַ/מָּיִם
  choice: juu ya maji
  rationale: עַל inaweza kumaanisha juu ya, kwenye, au juu kuliko. ‘Juu ya maji’ huhifadhi taswira ya kishairi bila kuifafanua kwa makundi ya kisayansi ya kisasa.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי huanzisha sababu ya sifa na shukrani katika kiitikio cha zaburi.
- source_word: לְ/עוֹלָם
  choice: hudumu milele
  rationale: עוֹלָם huonyesha wakati usio na mwisho. Kitenzi ‘hudumu’ kinaweka wazi kwa Kiswahili maana inayodokezwa katika kishazi cha Kiebrania kisicho na kitenzi.
- source_word: חַסְדּֽ/וֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד huunganisha upendo mwaminifu, rehema, na uaminifu wa kudumu. ‘Upendo thabiti’ huhifadhi upana huo bila kuufupisha kuwa rehema pekee.
theological_decisions:
- issue: Taswira ya kikosmolojia ya uumbaji
  choice: Kuhifadhi maelezo ya kishairi ‘aliyeitandaza dunia juu ya maji’ bila kuyapatanisha na makundi ya kisayansi ya kisasa.
  alternative: Kutafsiri kwa ujumla kuwa Mungu aliifanya au aliithibitisha dunia.
  rationale: Kiebrania kinatoa taswira halisi ya kishairi. Kuihifadhi kunaheshimu umbo na mvutano wa matini bila kuingiza maelezo yasiyosemwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo unaendeleza orodha ya Zaburi 136, huku kiitikio ‘kwa maana upendo wake thabiti hudumu milele’ kikihifadhiwa kwa lugha wazi.
