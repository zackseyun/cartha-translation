  text: and Og king of Bashan[a], for his steadfast love endures forever.
translation:
  language: sw
  text: 'na Ogu, mfalme wa Bashani[a],

    kwa maana upendo wake thabiti hudumu milele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “na kwa Ogu, mfalme wa Bashani.” Kihusishi לְ katika Kiebrania huendeleza muundo wa kishairi wa orodha inayotegemea tendo la awali la kuwashinda wafalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְעוֹג
  choice: na Ogu
  rationale: Kiunganishi וּ kinaendeleza orodha kwa ‘na’. Kiambishi לְ hapa kinaonyesha Ogu kuwa mtendewa wa tendo lililotajwa katika mistari iliyotangulia; Kiswahili cha kawaida hakihitaji kukitafsiri kwa ‘kwa’ katika kipande hiki.
- source_word: מֶלֶךְ
  choice: mfalme
  rationale: Hili ndilo neno la kawaida na lenye hadhi kwa mtawala; uhusiano wake na jina la mahali unaelezwa kwa ‘mfalme wa Bashani’.
- source_word: הַבָּשָׁן
  choice: Bashani
  rationale: Jina la mahali limetoholewa kwa namna iliyozoeleka katika Kiswahili. Kihusishi ‘wa’ kinaonyesha uhusiano katika kirai ‘mfalme wa Bashani’.
- source_word: כִּי
  choice: kwa maana
  rationale: Katika kibwagizo cha Zaburi 136, neno hili linatoa msingi wa sifa na linaendeleza mtiririko wa kiliturujia; ‘kwa maana’ ni la asili na lenye hadhi katika Kiswahili.
- source_word: לְעוֹלָם
  choice: hudumu milele
  rationale: Kirai hicho kwa msingi ni ‘hata milele’; pamoja na kitenzi kinachodokezwa katika kibwagizo, Kiswahili cha kawaida hulieleza kwa ‘hudumu milele’.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד huhusisha upendo, wema, na uaminifu unaodumu. ‘Upendo wake thabiti’ huhifadhi wazo la uthabiti bila kulibana liwe rehema pekee; kiambishi cha nafsi ya tatu kimetafsiriwa kwa ‘wake’.
theological_decisions:
- issue: Tafsiri ya חֶסֶד katika kibwagizo cha Zaburi 136
  choice: upendo wake thabiti
  alternative: fadhili zake; rehema zake; upendo wake wa agano
  rationale: Chaguo hili linaonyesha upendo mwaminifu na wa kudumu wa Mungu bila kuufanya kuwa rehema pekee wala kuingiza wazi zaidi dhana ya agano kuliko neno lenyewe linavyolazimisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na wa heshima. Mpangilio wa mistari umehifadhi muundo wa orodha na kibwagizo; ‘hudumu’ limetumiwa badala ya umbo la kizamani zaidi.
