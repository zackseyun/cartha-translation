  text: To him who struck Egypt in their firstborn[a], for his steadfast love endures forever.
translation:
  language: sw
  text: Yeye aliyeipiga Misri katika wazaliwa wao wa kwanza[a], kwa maana upendo wake thabiti hudumu milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miongoni mwa wazaliwa wao wa kwanza,” au kwa uwazi zaidi, “kwa kuwapiga wazaliwa wao wa kwanza.” Kiebrania kinasema kwa kifupi, “katika/kwa wazaliwa wao wa kwanza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַכֵּה
  choice: Yeye aliyeipiga
  rationale: Kiambishi לְ kinaendeleza muundo wa litania unaomwelekezea Mungu sifa; umbo la kushiriki la נכה limetafsiriwa kwa kauli ya kawaida na ya moja kwa moja.
- source_word: מִצְרַיִם
  choice: Misri
  rationale: Hili ndilo jina la kawaida la taifa hilo katika Kiswahili.
- source_word: בִּבְכוֹרֵיהֶם
  choice: katika wazaliwa wao wa kwanza
  rationale: Neno 'katika' linahifadhi kwa ukaribu uhusiano mpana wa kihusishi בְּ bila kulazimisha maana ya chombo; rejeo ni hukumu iliyowapata Wamisri kwa kuwapiga wazaliwa wao wa kwanza.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutanguliza kibwagizo kinachorudiwa katika zaburi hii na kueleza msingi wa sifa.
- source_word: לְעוֹלָם
  choice: wadumu milele
  rationale: Kitenzi kilichoongezwa kwa ulaini wa Kiswahili kinaonyesha hali endelevu inayodokezwa na kishazi cha Kiebrania.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד huunganisha upendo, uaminifu, na udumifu; 'upendo thabiti' ni wazi na hailazimishi maana kuwa rehema pekee.
theological_decisions:
- issue: Kuitafsiri hukumu ya Mungu juu ya wazaliwa wa kwanza wa Misri bila kuipunguza
  choice: Kauli ya moja kwa moja kwamba Mungu aliipiga Misri katika wazaliwa wao wa kwanza imedumishwa ndani ya kibwagizo cha sifa.
  alternative: Kusema wazi zaidi, 'kwa kuwapiga wazaliwa wao wa kwanza,' au kutumia maneno yanayopunguza ukali wa hukumu.
  rationale: Kiebrania huweka hukumu hiyo na upendo thabiti wa Mungu pamoja. Tafsiri inahifadhi mvutano huo bila kuupunguza wala kuongeza ufafanuzi katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo 'Yeye aliye...' unafaa katika litania, na kibwagizo kimetafsiriwa kwa lugha ya sasa.
