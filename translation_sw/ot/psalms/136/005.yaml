base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/005.yaml
  text: To him who made the heavens with understanding[b][a], for his steadfast love endures forever.
translation:
  language: sw
  text: 'Yeye aliyezifanya mbingu kwa ufahamu[a],

    kwa maana upendo wake thabiti hudumu milele.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yeye anayezifanya mbingu kwa ufahamu.” Umbo la ushiriki la Kiebrania linaweza kutafsiriwa kwa wakati wa sasa; pia “kwa ufahamu” linaweza kueleza njia au namna ya kutenda.
    reason: lexical_alternative
  - marker: b
    text: “Upendo thabiti” ni tafsiri ya neno la Kiebrania חֶסֶד (hesed), ambalo kulingana na muktadha linaweza pia kumaanisha fadhili, rehema, au uaminifu wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹשֵׂה
  choice: Yeye aliyezifanya
  rationale: 'Kiambishi לְ pamoja na umbo la kushiriki kinaendeleza mfululizo wa sifa unaomwelekea Mungu: ‘yeye aliye...’. Wakati uliopita unasomeka kwa kawaida katika muktadha wa matendo ya uumbaji, ingawa Kiebrania kinaweza pia kueleweka kama ‘anayezifanya’.'
- source_word: הַשָּׁמַיִם
  choice: mbingu
  rationale: Katika muktadha wa uumbaji, ‘mbingu’ huhifadhi maana pana ya kikosmolojia na mtindo wa kishairi kuliko ‘anga’.
- source_word: בִּתְבוּנָה
  choice: kwa ufahamu
  rationale: תְּבוּנָה humaanisha ufahamu, utambuzi, au busara. ‘Kwa ufahamu’ huonyesha namna au njia ya kuzifanya mbingu bila kulinganisha neno hili moja kwa moja na חָכְמָה, ambalo kwa kawaida ni ‘hekima’.
- source_word: כִּי
  choice: kwa maana
  rationale: Katika kiitikio cha Zaburi 136, כִּי huanzisha sababu ya kumsifu Mungu; ‘kwa maana’ ni kiunganishi cha kawaida na chenye hadhi katika Kiswahili.
- source_word: לְעוֹלָם
  choice: hudumu milele
  rationale: Kiebrania ni kwa ukaribu ‘milele’; kitenzi ‘hudumu’ kinaongezwa kwa ufasaha ili kueleza mwendelezo unaodokezwa na kiitikio.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד huhusisha upendo mwaminifu, fadhili, na uaminifu wa kudumu. ‘Upendo wake thabiti’ huhifadhi kwa pamoja wazo la upendo na uthabiti bila kutumia istilahi nzito ya kitaalamu.
theological_decisions:
- issue: Tafsiri ya חֶסֶד katika kiitikio cha Zaburi 136
  choice: upendo wake thabiti hudumu milele
  alternative: fadhili zake zadumu milele; uaminifu wake wa agano ni wa milele; rehema zake zadumu milele
  rationale: ‘Upendo wake thabiti’ huhifadhi upana wa חֶסֶד—upendo, fadhili, na uaminifu—bila kuufupisha kuwa rehema pekee wala kulazimisha neno ‘agano’ ambalo halipo wazi katika mstari huu.
- issue: Wakati wa לְעֹשֵׂה
  choice: aliyezifanya
  alternative: anayezifanya
  rationale: Umbo la Kiebrania ni participle na linaweza kuwa na maana ya sasa au ya kimazoea, lakini muktadha wa matendo ya uumbaji unaunga mkono wakati uliopita. Mbadala umehifadhiwa katika tanbihi ili kutofuta utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa kiliturujia lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa kiitikio umehifadhiwa; ‘Yeye’ huendeleza mfululizo wa sifa za zaburi.
