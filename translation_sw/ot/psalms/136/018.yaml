id: PSA.136.18
reference: Psalms 136:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַֽ֭/יַּהֲרֹג מְלָכִ֣ים אַדִּירִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/018.yaml
  text: and killed mighty kings[b][a], for his steadfast love endures forever.
translation:
  language: sw
  text: Akawaua wafalme wenye nguvu[a], kwa maana upendo wake thabiti[b] hudumu milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wafalme hodari.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hesed; pia huweza kutafsiriwa “rehema,” “upendo wa kudumu,” au “uaminifu katika agano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: Akawaua
  rationale: Kitenzi hiki katika umbo la simulizi kinaendeleza orodha ya matendo ya Mungu yaliyopita. “Akawaua” ni Kiswahili cha sasa, cha moja kwa moja, na kinahifadhi nguvu ya הרג.
- source_word: מְלָכִים
  choice: wafalme
  rationale: Nomino ya wingi ina maana ya kawaida ya “wafalme,” bila haja ya kuipanua.
- source_word: אַדִּירִים
  choice: wenye nguvu
  rationale: Katika muktadha huu kivumishi kinawaonyesha wafalme hao kuwa hodari au wenye uwezo mkubwa. “Wenye nguvu” ni wazi na hakielekezi hasa kwenye fahari ya kifalme.
- source_word: כִּי
  choice: kwa maana
  rationale: Chembe hii inaanzisha kiitikio kinachotoa sababu ya sifa. “Kwa maana” huhifadhi uhusiano wa kisababu na mtiririko wa kiliturujia.
- source_word: לְעוֹלָם
  choice: hudumu milele
  rationale: Neno lenyewe humaanisha “milele”; kitenzi “hudumu” kinakamilisha kwa njia ya kawaida maana inayodokezwa katika kiitikio.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חסד hujumuisha upendo, rehema, na uaminifu wa kudumu katika uhusiano. “Upendo wake thabiti” ni wazi kwa wasomaji wa sasa na huhifadhi wazo la upendo usiobadilika bila kulibana kuwa rehema pekee.
theological_decisions:
- issue: Tafsiri ya חֶסֶד katika kiitikio
  choice: upendo wake thabiti hudumu milele
  alternative: rehema zake zadumu milele; uaminifu wake wa agano ni wa milele
  rationale: Kauli iliyochaguliwa huhifadhi kwa pamoja wazo la upendo na uthabiti wa Mungu. Haifanyi maana kuwa rehema pekee wala hailazimishi neno “agano,” ambalo halijatajwa wazi katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo mfupi na wenye urari unafaa kiitikio kinachorudiwa katika Zaburi 136.
