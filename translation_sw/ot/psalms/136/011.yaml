  text: and brought Israel out from among them[b][a], for his steadfast love endures forever.
translation:
  language: sw
  text: Akawatoa Israeli miongoni mwao, kwa maana upendo wake thabiti hudumu milele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fadhili yake ya uaminifu hudumu milele”; kwa desturi, “rehema zake ni za milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: akawatoa
  rationale: Hifili ya יצא ina maana ya kusababisha watoke, yaani ‘kuwatoa’; umbo hili la Kiswahili linahifadhi maana ya kisababishi na linaunganisha tendo na muktadha unaotangulia.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la watu au taifa limetolewa kwa umbo la kawaida la Kiswahili; kitenzi cha wingi ‘akawatoa’ kinaonyesha kuwa hapa Israeli ni watu.
- source_word: מִתּוֹכָם
  choice: kutoka katikati yao
  rationale: Tafsiri hii inahifadhi wazo la kutoka ndani au miongoni mwa kundi lililotajwa katika muktadha, bila kulitaja kwa jina ambalo halipo katika mstari huu.
- source_word: כִּי
  choice: kwa maana
  rationale: Katika kibwagizo cha Zaburi 136, כִּי huonyesha sababu ya sifa; ‘kwa maana’ ni ya asili na yenye hadhi katika Kiswahili.
- source_word: לְעוֹלָם
  choice: hudumu milele
  rationale: Kifungu cha Kiebrania hakina kitenzi kilichoandikwa; ‘hudumu’ kinaongezwa kwa ulazima wa Kiswahili ili kueleza mwendelezo wa kudumu.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חסד hujumuisha upendo, fadhili, na uaminifu wa kudumu. ‘Upendo wake thabiti’ huhifadhi upana huo kuliko ‘rehema’ pekee.
theological_decisions:
- issue: Tafsiri ya חַסְדּוֹ katika kibwagizo cha Zaburi 136
  choice: upendo wake thabiti hudumu milele
  alternative: rehema zake ni za milele
  rationale: Chaguo hili linaonyesha upendo wa Mungu wenye uthabiti na uaminifu bila kuufupisha kuwa huruma pekee. Kitenzi ‘hudumu’ kimejazwa ili kifungu kisicho na kitenzi katika Kiebrania kiwe cha kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na hadhi ya ibada. ‘Akawatoa Israeli’ ni ya kawaida na inaonyesha wazi kuwa jina la umoja linawakilisha watu wengi. Alama ya tanbihi imewekwa baada ya kibwagizo kinachohusiana na חסד.
