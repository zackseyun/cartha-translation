lexical_decisions:
- source_word: בְּיָד חֲזָקָה
  choice: kwa mkono wenye nguvu
  rationale: Kiambishi בְּ kinaonyesha chombo au njia iliyotumiwa; “kwa mkono wenye nguvu” ni Kiswahili cha kawaida na huhifadhi taswira ya Kiebrania.
- source_word: וּבִזְרוֹעַ נְטוּיָה
  choice: na kwa mkono ulionyoshwa
  rationale: זְרוֹעַ inaweza kumaanisha mkono hasa kuanzia bega hadi kiwiko, lakini “mkono” ni ya asili zaidi katika Kiswahili na huhifadhi taswira ya nguvu ya Mungu; נְטוּיָה inaeleza mkono ulionyoshwa ili kutenda.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha msingi wa sifa katika kibwagizo; “kwa maana” huhifadhi uhusiano huo wa sababu na mtindo wa kiliturujia.
- source_word: לְעוֹלָם
  choice: wadumu milele
  rationale: Maana ya msingi ni “hata milele”; kitenzi “wadumu” kinakamilisha kibwagizo kwa Kiswahili cha kawaida.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד huunganisha upendo, uaminifu, na kujitoa kwa kudumu. “Upendo wake thabiti” huhifadhi upana huo bila kuufupisha kuwa huruma pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri חֶסֶד katika kibwagizo cha Zaburi 136
  choice: upendo wake thabiti wadumu milele
  alternative: fadhili zake zadumu milele; uaminifu wake wa agano wadumu milele; rehema zake zadumu milele
  rationale: “Upendo thabiti” huhifadhi pamoja wema, uaminifu, na kudumu kwa חֶסֶד. “Rehema” ni finyu zaidi, ilhali “uaminifu wa agano” hufafanua sana kile ambacho neno lenyewe linaacha kikiwa na upana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kibwagizo umehifadhiwa. Alama za tanbihi zimewekwa baada ya vifungu vinavyohusika.
