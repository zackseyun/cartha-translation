  text: 'Akatoa nchi yao kuwa urithi[a],

    kwa maana upendo wake mwaminifu[b] hudumu milele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “iwe mali ya urithi” au “iwe milki.” Neno la Kiebrania נַחֲלָה humaanisha urithi au sehemu iliyogawiwa kuwa milki.
    reason: lexical_alternative
  - marker: b
    text: “Upendo mwaminifu” limetafsiri neno la Kiebrania חֶסֶד, ambalo mara nyingi humaanisha upendo wenye uaminifu na ushikamanifu wa agano; linaweza pia kutafsiriwa “fadhili,” “rehema,” au “uaminifu wa agano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: Akatoa
  rationale: Kitenzi cha Qal timilifu, nafsi ya tatu umoja wa kiume, chenye kiunganishi; wakati uliopita unaendeleza mfululizo wa matendo ya Mungu katika zaburi hii.
- source_word: אַרְצָם
  choice: nchi yao
  rationale: Neno אֶרֶץ lenye kiambishi cha nafsi ya tatu wingi linarejelea nchi ya wafalme au mataifa walioshindwa; “nchi” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: לְנַחֲלָה
  choice: kuwa urithi
  rationale: נַחֲלָה humaanisha mali au sehemu iliyogawiwa kuwa urithi; “kuwa urithi” ni Kiswahili cha kawaida kinachohifadhi wazo la mgao wa kudumu.
- source_word: כִּי
  choice: kwa maana
  rationale: Katika kibwagizo cha Zaburi 136, כִּי hutanguliza msingi wa sifa; “kwa maana” huhifadhi nguvu hiyo ya kisababishi na mtiririko wa kiliturujia.
- source_word: לְעוֹלָם
  choice: wadumu milele
  rationale: לְעוֹלָם humaanisha “milele”; kitenzi “wadumu” kinawekwa wazi katika Kiswahili ili kueleza kuendelea bila mwisho kwa upendo huo.
- source_word: חַסְדּוֹ
  choice: upendo wake mwaminifu
  rationale: חֶסֶד huunganisha upendo, uaminifu, na ushikamanifu wa agano. “Upendo wake mwaminifu” ni wa kawaida, wenye hadhi, na mpana kuliko “rehema” pekee.
theological_decisions:
- issue: Tafsiri ya חֶסֶד katika kibwagizo cha Zaburi 136
  choice: upendo wake mwaminifu wadumu milele
  alternative: fadhili zake ni za milele; rehema zake zadumu milele; uaminifu wake wa agano wadumu milele
  rationale: Chaguo hili linahifadhi pamoja maana za upendo na ushikamanifu wa kudumu bila kulifanya neno kuwa istilahi ya kitaalamu ya kidhehebu. Tanbihi inadokeza upana wa neno la Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na wa kiliturujia. “Akatoa” ni fupi na ya asili katika mfululizo wa matendo; “upendo wake mwaminifu” huhifadhi uzito wa חֶסֶד huku ikieleweka kwa msomaji wa kawaida.
