  text: וְ/הֶעֱבִ֣יר יִשְׂרָאֵ֣ל בְּ/תוֹכ֑/וֹ כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/014.yaml
  text: and brought Israel through the midst of it[b][a], for his steadfast love endures forever.
translation:
  language: sw
  text: akawavusha Israeli katikati yake,[a] kwa maana upendo wake thabiti hudumu milele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawapitisha Israeli katikati yake.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania חֶסֶד linaweza pia kutafsiriwa “fadhili,” “rehema,” au “uaminifu wa agano,” kutegemeana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הֶעֱבִיר
  choice: akawavusha
  rationale: Hifili ya עבר ina maana ya kusababisha mtu apite. Katika muktadha huu, “akawavusha” ni Kiswahili cha kawaida kinachohifadhi maana ya kisababishi na mwendo kupitia bahari.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la taifa limetolewa kwa umbo la kawaida la Kiswahili; kitenzi cha wingi “akawavusha” kinalichukulia taifa kwa kuwarejelea watu wake.
- source_word: בְּ/תוֹכ֑/וֹ
  choice: katikati yake
  rationale: Usemi huu unadumisha taswira ya Israeli kupita katikati ya bahari iliyotajwa katika mstari uliotangulia, badala ya kusema tu “ndani yake.”
- source_word: כִּי
  choice: kwa maana
  rationale: Katika kibwagizo cha Zaburi 136, neno hili linatanguliza sababu ya sifa; “kwa maana” ni la asili na lenye hadhi katika Kiswahili.
- source_word: לְ/עוֹלָם
  choice: wadumu milele
  rationale: Kiebrania hakina kitenzi wazi katika kibwagizo hiki; “wadumu” huifanya sentensi kuwa ya kawaida katika Kiswahili na kuonyesha mwendelezo usio na mwisho.
- source_word: חַסְדּֽ/וֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד huunganisha upendo, uaminifu, na rehema ya kudumu. “Upendo wake thabiti” huhifadhi upana huo bila kuifungia maana katika istilahi moja ya kimadhehebu.
theological_decisions:
- issue: Tafsiri ya חֶסֶד katika kibwagizo cha Zaburi 136
  choice: upendo wake thabiti wadumu milele
  alternative: fadhili zake zadumu milele; rehema zake zadumu milele; uaminifu wake wa agano wadumu milele
  rationale: “Upendo wake thabiti” hudumisha kwa pamoja wazo la upendo na uthabiti wa uaminifu wa Mungu. Tanbihi inahifadhi uwezekano wa “fadhili,” “rehema,” au “uaminifu wa agano” bila kuamua kimyakimya kati ya vivuli hivyo vya maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na kibwagizo cha Zaburi 136 vimedumishwa; “akawavusha” ni wa kawaida zaidi kuliko “akawapitisha,” huku tanbihi ikihifadhi namna ya karibu zaidi na umbo la kisababishi la Kiebrania.
