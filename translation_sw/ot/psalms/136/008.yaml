translation:
  language: sw
  text: Jua litawale mchana[a], kwa maana upendo wake thabiti ni wa milele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jua kwa utawala wa mchana.” Kiebrania hutumia nomino yenye maana ya “utawala” au “mamlaka ya kutawala,” ambapo Kiswahili cha kawaida hutumia kitenzi “litawale.”
    reason: lexical_alternative
  - marker: b
    text: “Upendo thabiti” ni tafsiri ya neno la Kiebrania חֶסֶד (hesed), linaloweza pia kumaanisha fadhili, rehema, au uaminifu wa kudumu kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת
  choice: '[alama ya yambwa, haitafsiriwi peke yake]'
  rationale: Ni alama ya yambwa mahsusi katika Kiebrania; maana yake inawakilishwa kwa mpangilio wa kawaida wa Kiswahili bila neno tofauti.
- source_word: הַשֶּׁמֶשׁ
  choice: jua
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya nomino yenye kibainishi הַשֶּׁמֶשׁ.
- source_word: לְמֶמְשֶׁלֶת
  choice: litawale
  rationale: Nomino מֶמְשֶׁלֶת humaanisha utawala au mamlaka ya kutawala. Kwa kuzingatia kishazi sambamba na muktadha wa uumbaji, kitenzi cha kusudi katika Kiswahili ni cha asili zaidi kuliko usemi wa kinomino ‘kwa utawala.’
- source_word: בַּיּוֹם
  choice: wakati wa mchana
  rationale: ב + יוֹם huonyesha kipindi ambacho jua linatawala; ‘wakati wa mchana’ ni Kiswahili cha kawaida na kinaweka wazi ulinganifu wa mchana na usiku.
- source_word: כִּי
  choice: kwa maana
  rationale: Katika kibwagizo cha Zaburi 136, כִּי hutambulisha sababu ya sifa. ‘Kwa maana’ huhifadhi maana hiyo ya kisababishi na mtiririko wa kiliturujia.
- source_word: לְעוֹלָם
  choice: ni wa milele
  rationale: Kiebrania kina kishazi kisicho na kitenzi kinachoeleza kudumu bila mwisho. ‘Ni wa milele’ hulihifadhi kwa urahisi bila kulazimisha kitenzi kisichotajwa wazi.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד huunganisha upendo, uaminifu, huruma, na ushikamanifu wa kudumu. ‘Upendo wake thabiti’ ni kifupi, cha sasa, na hakibani maana kwenye huruma au hisia pekee.
theological_decisions:
- issue: Tafsiri ya חֶסֶד katika kibwagizo cha Zaburi 136
  choice: upendo wake thabiti ni wa milele
  alternative: fadhili zake zadumu milele; upendo wake wa agano wadumu milele; rehema zake ni za milele
  rationale: Chaguo hili huhifadhi upana wa חֶסֶד kama upendo wa kudumu wenye uaminifu, bila kuingiza neno ‘agano’ moja kwa moja mahali ambapo halipo katika mstari huu. Muundo ‘ni wa milele’ pia huhifadhi hali ya kishazi kisicho na kitenzi katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo unaendeleza kishazi cha mstari uliotangulia, ndiyo maana hakuna kitenzi kikuu cha ‘alifanya’ ndani ya mstari huu. Alama za tanbihi zote zimewekwa kwenye matini kuu.
