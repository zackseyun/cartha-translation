  variant: Standard East African Swahili
source:
  edition: WLC
  text: לְ֭/סִיחוֹן מֶ֣לֶךְ הָ/אֱמֹרִ֑י כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/019.yaml
  text: Sihon[a], king of the Amorites[c][b], for his steadfast love endures forever.
translation:
  language: sw
  text: Sihoni, mfalme wa Waamori, kwa maana upendo wake mwaminifu hudumu milele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “uaminifu wake wa agano hudumu milele.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְסִיחוֹן
  choice: Sihoni
  rationale: Kiambishi לְ hapa kinaendeleza muundo wa mstari uliotangulia, ambapo Sihoni ni yule aliyepigwa. Kiswahili cha kawaida hakihitaji kihusishi mbele ya yambwa katika muundo huu.
- source_word: מֶלֶךְ
  choice: mfalme
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa cheo cha kifalme.
- source_word: הָאֱמֹרִי
  choice: wa Waamori
  rationale: Ingawa Kiebrania kina umbo la umoja la jina la kabila, katika cheo hiki linamtambulisha mfalme kwa watu aliowatawala; 'mfalme wa Waamori' ni Kiswahili cha kawaida na wazi.
- source_word: כִּי
  choice: kwa maana
  rationale: Katika kibwagizo cha Zaburi 136, neno hili linatanguliza msingi wa sifa na linaunganishwa kwa kawaida na mstari unaotangulia.
- source_word: לְעוֹלָם
  choice: hudumu milele
  rationale: Kishazi cha Kiebrania hakina kitenzi kilichoandikwa; 'hudumu' hukamilisha maana kwa Kiswahili cha kawaida na kuonyesha mwendelezo usio na mwisho.
- source_word: חַסְדּוֹ
  choice: upendo wake mwaminifu
  rationale: חֶסֶד huonyesha upendo wenye uaminifu, fadhili na ushikamanifu. Tafsiri hii ni ya kawaida na pana kuliko 'rehema' pekee, bila kulazimisha neno 'agano' ambalo halijaandikwa wazi katika mstari.
theological_decisions:
- issue: Tafsiri ya חֶסֶד katika kibwagizo cha Zaburi 136
  choice: upendo wake mwaminifu hudumu milele
  alternative: uaminifu wake wa agano hudumu milele
  rationale: '''Upendo wake mwaminifu'' huhifadhi kwa pamoja wazo la upendo na ushikamanifu wa kudumu. Tafsiri mbadala inaonyesha vizuri upande wa agano, lakini ni ya kifafanuzi zaidi kwa sababu neno ''agano'' halipo wazi katika maandishi haya.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa ibada lakini kinachoeleweka kwa wasomaji wa kawaida. Mstari umeachwa kama mwendelezo wa kisarufi wa mstari uliotangulia, kama ilivyo katika Kiebrania.
