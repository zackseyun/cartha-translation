  text: to him who led his people in the wilderness[b][a], for his steadfast love endures forever.
translation:
  language: sw
  text: Kwa yule aliyewaongoza watu wake jangwani[a], kwa maana upendo wake thabiti unadumu milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupitia jangwani.” Kihusishi cha Kiebrania ni “katika,” lakini pamoja na kitenzi “kuongoza” kinaweza kueleweka kuwa kinarejelea safari kupitia jangwani.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמוֹלִיךְ
  choice: kwa yeye aliyewaongoza
  rationale: 'Umbo la Hifili la הלך lina maana ya kusababisha waende, yaani kuwaongoza. Katika orodha hii ya sifa, לְ linaonyesha anayeelekezewa shukrani: “kwa yeye aliye…”. Kiswahili cha sasa na cha kawaida hutumia “aliyewaongoza” kwa ufasaha.'
- source_word: עַמּוֹ
  choice: watu wake
  rationale: עַם hapa humaanisha watu wake Mungu katika maana ya kitaifa na ya uhusiano; “watu wake” huhifadhi maana hiyo bila kuongeza ufafanuzi usiotajwa wazi.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: מִדְבָּר ni eneo la nyika au jangwa, na בְּ kimsingi ni “katika.” “Jangwani” ni usemi wa kawaida wa Kiswahili unaohifadhi mahali pa kuongozwa bila kulazimisha maana ya kuvuka.
- source_word: כִּי
  choice: kwa maana
  rationale: Katika kiitikio cha Zaburi 136, כִּי hutambulisha sababu ya sifa. “Kwa maana” hudumisha mtiririko wa kishairi na wa kiliturujia.
- source_word: לְעוֹלָם
  choice: unadumu milele
  rationale: Kirai hiki huonyesha muda usio na mwisho. Kitenzi “unadumu” kinakamilisha kiitikio kwa Kiswahili cha asili huku kikihifadhi nguvu ya mwendelezo.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד huunganisha upendo, wema, na uaminifu wa kudumu katika uhusiano. “Upendo wake thabiti” huhifadhi upana huo vizuri kuliko “rehema” peke yake.
theological_decisions:
- issue: Tafsiri ya חֶסֶד katika kiitikio
  choice: upendo wake thabiti unadumu milele
  alternative: rehema zake ni za milele; uaminifu wake wa agano unadumu milele
  rationale: “Upendo wake thabiti” huhifadhi kwa pamoja wema wa Mungu na uaminifu wake wa kudumu, bila kuifinya maana kuwa huruma pekee au kutumia istilahi ya kitaalamu ambayo haipo wazi katika neno lenyewe.
- issue: Maana ya בְּ katika בַּמִּדְבָּר
  choice: jangwani
  alternative: kupitia jangwani
  rationale: Kihusishi cha Kiebrania kimsingi humaanisha “katika,” ingawa muktadha wa kuwaongoza watu unaweza kudokeza safari kupitia eneo hilo. Matini kuu huhifadhi maana ya moja kwa moja; tanbihi inaonyesha uwezekano wa maana ya mwendo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Kiitikio kimetafsiriwa kwa namna rahisi kukaririwa na kurudiwa.
