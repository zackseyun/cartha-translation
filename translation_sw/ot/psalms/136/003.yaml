  text: Mshukuruni Bwana wa mabwana, kwa maana upendo wake thabiti[a] hudumu milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uaminifu wake wa agano.” Neno la Kiebrania חֶסֶד linaweza kumaanisha upendo mwaminifu wa agano, na pia wema au rehema.
