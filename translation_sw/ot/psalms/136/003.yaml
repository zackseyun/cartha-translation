lexical_decisions:
- source_word: הוֹדוּ
  choice: Mshukuruni
  rationale: Amri ya wingi ya ידה katika Hifili inaita kusanyiko limtolee Mungu shukrani; “Mshukuruni” ni ya asili katika Kiswahili na inafaa kibwagizo cha Zaburi 136.
- source_word: לַאֲדֹנֵי הָאֲדֹנִים
  choice: Bwana wa mabwana
  rationale: Muundo huu wa kimilikishi unaonyesha ukuu wa Mungu juu ya mabwana au watawala wote. “Bwana wa mabwana” huhifadhi nahau na uzito wa cheo hicho.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha sababu ya wito wa kutoa shukrani na ni kiunganishi cha kawaida katika ushairi wa ibada wa Kiswahili.
- source_word: לְעוֹלָם
  choice: wadumu milele
  rationale: Kirai hiki kwa maana ya “hata milele” kinaunganishwa kwa kawaida na kitenzi kinachodokezwa katika sentensi ya Kiebrania isiyo na kitenzi.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד hujumuisha upendo wa kudumu, wema, na uaminifu wa mshikamano au agano. “Upendo wake thabiti” huhifadhi kwa lugha ya kawaida vipengele vya upendo na uthabiti bila kuufanya wazi zaidi kuliko chanzo.
theological_decisions:
- issue: Tafsiri ya cheo אֲדֹנֵי הָאֲדֹנִים
  choice: Bwana wa mabwana
  alternative: mkuu wa wakuu
  rationale: Cheo hiki kinatangaza enzi kuu ya Mungu. “Bwana wa mabwana” huhifadhi muundo wa Kiebrania na uzito wake wa kiteolojia bila kuupunguza kuwa daraja la kawaida la kijamii.
- issue: Upeo wa maana ya חֶסֶד
  choice: upendo wake thabiti
  alternative: uaminifu wake wa agano
  rationale: Neno linaweza kuonyesha upendo wa kudumu na pia uaminifu katika uhusiano wa agano. Matini kuu inatumia msemo mpana na wa kawaida, huku tanbihi ikihifadhi uwezekano wa maana ya kiagano.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa ibada unaoeleweka kwa wasomaji wa sasa. Muundo wa kibwagizo umehifadhiwa kwa sentensi fupi na yenye urari.
