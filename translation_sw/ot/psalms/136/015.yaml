  text: and shook off Pharaoh and his army into the Red Sea[a], for his steadfast love endures forever.
translation:
  language: sw
  text: akawakung’uta Farao na jeshi lake katika Bahari ya Shamu[a], kwa maana upendo wake thabiti hudumu milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Bahari ya Matete” au “Bahari ya Mwanzi.” Katika mapokeo ya tafsiri huitwa “Bahari ya Shamu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/נִעֵר
  choice: akamkung’uta
  rationale: Kitenzi נָעַר kina picha halisi ya kukung’uta au kutikisa kitu kitoke. ‘Akamkung’uta’ inadumisha picha hiyo yenye nguvu badala ya kuifanya tu ‘akamwangamiza.’
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la cheo hiki cha kifalme katika Kiswahili cha Biblia.
- source_word: וְ/חֵיל/וֹ
  choice: na jeshi lake
  rationale: Katika muktadha wa kijeshi חַיִל humaanisha jeshi au nguvu ya kijeshi; ‘jeshi’ ni wazi na la sasa.
- source_word: בְ/יַם סוּף
  choice: ndani ya Bahari ya Shamu
  rationale: יַם סוּף kihalisi ni ‘Bahari ya Matete,’ lakini ‘Bahari ya Shamu’ ni jina linalotambulika katika mapokeo ya Kiswahili. ‘Ndani ya’ linafaa kwa mwendo unaodokezwa na kitendo cha kukung’uta.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha sababu ya sifa katika kiitikio cha zaburi hii na ni usemi wa heshima unaoeleweka kwa urahisi.
- source_word: לְ/עוֹלָם
  choice: hudumu milele
  rationale: Ingawa Kiebrania kinasema kwa ufupi ‘hata milele,’ Kiswahili huhitaji kitenzi hapa; ‘hudumu milele’ huonyesha mwendelezo usio na mwisho.
- source_word: חַסְדּ/וֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד huunganisha upendo, uaminifu na rehema; ‘upendo thabiti’ huhifadhi upana huo bila kuufungia katika maana moja ya kimadhehebu.
theological_decisions:
- issue: Tafsiri ya יַם סוּף
  choice: Bahari ya Shamu katika matini kuu
  alternative: Bahari ya Matete
  rationale: ‘Bahari ya Shamu’ hutambulika mara moja katika simulizi la Kutoka, lakini maana iliyo wazi zaidi ya jina la Kiebrania ni ‘Bahari ya Matete’; kwa hiyo mbadala huo umehifadhiwa katika tanbihi.
- issue: Picha ya hukumu katika נָעַר
  choice: akamkung’uta
  alternative: akamwangamiza
  rationale: Chaguo hili huhifadhi picha hai ya Kiebrania ya Mungu kumtikisa au kumkung’uta Farao pamoja na jeshi lake ndani ya bahari, bila kuibadili kuwa maelezo ya jumla ya matokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Kiitikio kimetafsiriwa kwa mtindo wa liturujia ulio wazi; picha ya kitenzi cha Kiebrania imehifadhiwa.
