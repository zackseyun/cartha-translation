  yaml_path: translation/ot/psalms/136/024.yaml
  text: and rescued us from our foes[a], for his steadfast love endures forever.
translation:
  language: sw
  text: na akatuokoa kutoka kwa adui zetu[a], kwa maana upendo wake mwaminifu ni wa milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kwa watesi wetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרְקֵנוּ
  choice: na akatuokoa
  rationale: Kitenzi פרק hapa kina maana ya kuwaondoa au kuwaokoa watu kutoka hatarini au chini ya nguvu ya watesi. “Akatuokoa” ni Kiswahili cha sasa, cha kawaida na chenye upana unaofaa; kiunganishi “na” kinawakilisha וַ na kuendeleza mfululizo wa sifa katika zaburi.
- source_word: מִצָּרֵינוּ
  choice: kutoka kwa adui zetu
  rationale: Nomino hii ya wingi yenye kiambishi cha nafsi inaonyesha watu wenye uhasama au wanaowatesa wasemaji. “Adui zetu” ni ya kawaida na wazi; “watesi wetu” pia inawezekana lakini huweka mkazo mahsusi zaidi katika tendo la kutesa.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inaanzisha kiitikio kinachotoa msingi wa sifa. “Kwa maana” huhifadhi nguvu hiyo ya kutoa sababu na pia inafaa kwa mtiririko wa kiliturujia.
- source_word: לְעוֹלָם
  choice: ni wa milele
  rationale: Kirai hiki humaanisha “hata milele” au “kwa umilele.” Kwa kuwa Kiebrania hakina kitenzi kilichoandikwa katika kiitikio hiki, “ni wa milele” ni tafsiri ya asili inayohifadhi muundo huo bila kuingiza kitenzi cha ziada kama “unadumu.”
- source_word: חַסְדּוֹ
  choice: upendo wake mwaminifu
  rationale: חֶסֶד huunganisha upendo, fadhili, uaminifu na ushikamanifu wa kudumu. “Upendo wake mwaminifu” huhifadhi upana huo vizuri kuliko “rehema zake,” ambayo ingeweza kupunguza maana kuwa huruma pekee.
theological_decisions:
- issue: Tafsiri ya חֶסֶד katika kiitikio cha Zaburi 136
  choice: upendo wake mwaminifu ni wa milele
  alternative: fadhili zake ni za milele
  rationale: Chaguo hili linaonyesha upendo wenye uaminifu na ushikamanifu bila kuufanya useme wazi zaidi kuhusu agano kuliko neno lenyewe linavyolazimisha. Pia linahifadhi dai la kudumu milele katika kiitikio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na wa ibada lakini kinachoeleweka kwa wasomaji wa kawaida. Kiitikio kimetafsiriwa kwa lugha yenye heshima na ya sasa.
