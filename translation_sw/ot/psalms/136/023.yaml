  yaml_path: translation/ot/psalms/136/023.yaml
  text: who remembered us in our low estate[b][a], for his steadfast love is forever.
translation:
  language: sw
  text: 'aliyetukumbuka katika hali yetu ya unyonge[a],

    kwa maana upendo wake thabiti ni wa milele[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tulipokuwa tumeshushwa” au “katika kudhalilishwa kwetu.”
    reason: lexical_alternative
  - marker: b
    text: Au kwa lugha ya kinahau zaidi, “hudumu milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁבְּשִׁפְלֵנוּ
  choice: aliyetukumbuka katika hali yetu ya unyonge
  rationale: Kiambishi cha uhusiano pamoja na kirai hiki humtaja Mungu kuwa ndiye aliyetukumbuka tulipokuwa katika hali ya chini. “Hali yetu ya unyonge” ni Kiswahili cha kawaida kinachohifadhi wazo la kushushwa, udhaifu au kudharauliwa bila kuamua chanzo mahususi cha hali hiyo.
- source_word: זָכַר
  choice: aliyetukumbuka
  rationale: Kitenzi kwa msingi wake humaanisha “kukumbuka.” Ingawa katika muktadha huu kinaweza kudokeza kuchukua hatua kwa ajili yetu, tafsiri haiongezi wazi jambo ambalo kitenzi chenyewe halisemi.
- source_word: לָנוּ
  choice: -tu- (katika “aliyetukumbuka”)
  rationale: Kihusishi cha Kiebrania huonyesha yule anayekumbukwa. Katika Kiswahili, kiambishi cha yambwa “-tu-” hutoa maana hiyo kwa njia ya kawaida na sahihi.
- source_word: כִּי
  choice: kwa maana
  rationale: 'Katika kibwagizo cha Zaburi 136, neno hili linaunganisha tendo lililotajwa na sababu yake: upendo thabiti wa Mungu wa milele.'
- source_word: לְעוֹלָם
  choice: ni wa milele
  rationale: Kirai hiki humaanisha kudumu daima. Kwa kuwa Kiebrania hakina kitenzi wazi hapa, Kiswahili huongeza “ni” ili kuunda sentensi ya kawaida huku kikibaki karibu na muundo wa chanzo.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חסד hujumuisha upendo, uaminifu na kujitoa kwa kudumu. “Upendo wake thabiti” huhifadhi vipengele hivyo bila kutumia lugha ya kizamani au kuingiza istilahi ya kimadhehebu.
theological_decisions:
- issue: Tafsiri ya kibwagizo כִּי לְעוֹלָם חַסְדּוֹ
  choice: kwa maana upendo wake thabiti ni wa milele
  alternative: kwa maana upendo wake thabiti hudumu milele
  rationale: Chaguo kuu linafuata kwa karibu kishazi cha Kiebrania kisicho na kitenzi, huku mbadala ukiwasilisha kwa Kiswahili cha kinahau wazo lilelile la kudumu. Zote zinahifadhi mkazo juu ya kudumu kwa חסד ya Mungu.
- issue: Upana wa maana ya שִׁפְלֵנוּ
  choice: hali yetu ya unyonge
  alternative: tuliposhushwa; kudhalilishwa kwetu
  rationale: “Unyonge” huacha wazi ikiwa hali hiyo ilikuwa udhaifu, mateso, nafasi ya chini au kudhalilishwa, badala ya kuifunga kwa aina moja tu ya taabu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa mistari unadumisha muundo wa tendo na kibwagizo wa Zaburi 136. “Unyonge” huepuka kubainisha kupita kiasi aina ya hali ya chini, na “upendo thabiti” huwasilisha kwa uwazi maana pana ya חסד.
