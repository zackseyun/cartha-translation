  yaml_path: translation/ot/psalms/136/001.yaml
  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: sw
  text: Mshukuruni Yahweh[a], kwa maana yeye ni mwema; kwa maana upendo wake thabiti[b] hudumu milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina katika Kiebrania ni יהוה (YHWH), limetoholewa hapa kuwa “Yahweh”; tafsiri nyingine hutumia “BWANA.”
    reason: alternative_reading
  - marker: b
    text: Au “uaminifu wake wa agano,” “rehema yake,” au “fadhili yake.” Neno la Kiebrania חֶסֶד lina maana pana ya upendo wenye ushikamanifu na unaodumu katika uhusiano wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Mshukuruni
  rationale: Ni amri ya wingi ya kitenzi ידה katika Hifili. “Mshukuruni” linaeleza mwito wa pamoja wa kutoa shukrani katika ibada bila kuufanya kuwa sifa kwa ujumla tu.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Herufi לְ humtaja anayeelekezewa shukrani, na jina la agano יְהוָה limetoholewa kuwa “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: כִּי
  choice: kwa maana
  rationale: Katika sehemu zote mbili, כִּי inatoa sababu ya kumshukuru Yahweh. “Kwa maana” ni ya asili, yenye heshima, na huhifadhi uhusiano huo wa kisababishi.
- source_word: טוֹב
  choice: mwema
  rationale: Kivumishi hiki kinamtaja Yahweh mwenyewe kuwa mwema; umbo la ngeli ya mtu “mwema” ni Kiswahili cha kawaida na sahihi.
- source_word: לְעוֹלָם
  choice: hudumu milele
  rationale: Kirai hiki kinaonyesha muda usio na mwisho. Kuongeza kitenzi “hudumu” kunafanya kishazi cha Kiswahili kiwe cha asili huku kikihifadhi maana ya kuendelea milele.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד huunganisha upendo, uaminifu, na ushikamanifu wa kudumu katika uhusiano. “Upendo wake thabiti” huhifadhi upana huo kuliko “rehema” peke yake.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandiko ya Kiebrania yanatumia jina maalumu la Mungu, si cheo. “Yahweh” hulihifadhi jina hilo wazi katika tafsiri.
- issue: Maana ya חֶסֶד katika kiitikio cha agano
  choice: upendo wake thabiti
  alternative: uaminifu wake wa agano; rehema zake; fadhili zake
  rationale: “Upendo wake thabiti” huacha pamoja vipengele vya upendo na ushikamanifu vinavyobebwa na חֶסֶד, bila kulifupisha neno hilo kuwa rehema au wajibu wa agano pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kiibada. Wingi katika “Mshukuruni” umehifadhi mwito kwa kusanyiko; urudiaji wa “kwa maana” umehifadhi muundo wa kishairi wa Kiebrania, na nuktamkato hutenganisha sababu mbili kwa uwazi.
