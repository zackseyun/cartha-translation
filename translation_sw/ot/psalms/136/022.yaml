lexical_decisions:
- source_word: נַחֲלָה
  choice: urithi
  rationale: Neno hili humaanisha mali iliyorithiwa au sehemu iliyogawiwa. “Urithi” linafaa kwa nchi aliyopewa Israeli katika muktadha wa mistari iliyotangulia.
- source_word: לְיִשְׂרָאֵל
  choice: kwa Israeli
  rationale: Kihusishi ל hapa kinamtaja mpokeaji au mnufaika wa urithi; “kwa Israeli” kinadumisha maana hiyo bila kuufanya urithi kuwa kitendo cha kurithi kutoka kwa Israeli.
- source_word: עַבְדּוֹ
  choice: mtumishi wake
  rationale: Hapa עבד ni jina la uhusiano wa Israeli na Mungu katika agano; “mtumishi” linafaa kuliko “mtumwa,” kwa kuwa kifungo cha kulazimishwa hakisisitizwi katika muktadha huu.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinaanzisha kiitikio kinachotoa sababu ya sifa, na “kwa maana” kinahifadhi mtiririko wa kishairi na kiliturujia.
- source_word: לְעוֹלָם
  choice: ni wa milele
  rationale: Usemi huu unaonyesha kudumu bila mwisho. Muundo “ni wa milele” ni wa asili katika Kiswahili na hauongezi kitenzi kisichokuwapo wazi katika Kiebrania.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חסד huunganisha upendo, uaminifu, na kujitoa kwa kudumu katika uhusiano wa agano. “Upendo thabiti” huhifadhi upana huo vizuri kuliko “rehema” peke yake.
theological_decisions:
- issue: Uhusiano wa Israeli na Mungu katika עַבְדּוֹ
  choice: mtumishi wake
  alternative: mtumwa wake
  rationale: Aya inamtambulisha Israeli kuwa wa Mungu na mwenye kumtumikia, lakini haisisitizi hali ya utumwa wa kulazimishwa; “mtumishi” linaonyesha vizuri zaidi cheo hiki cha kiagano.
- issue: Maana ya חַסְדּוֹ katika kiitikio
  choice: upendo wake thabiti
  alternative: rehema zake; fadhili zake; upendo wake wa agano
  rationale: Neno hilo linahusisha upendo pamoja na uaminifu na kujitoa kwa kudumu. Tafsiri iliyochaguliwa hailifanyi kuwa hisia tu wala hailifungi kwenye maana moja nyembamba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na mtiririko wa kishairi. Mwanzo “kuwa urithi” unaendeleza kisarufi tendo la mstari uliotangulia, kama ilivyo katika Kiebrania.
