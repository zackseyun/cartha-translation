  text: לְ֭/עֹשֵׂה אוֹרִ֣ים גְּדֹלִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/007.yaml
  text: To him who made the great lights[b][a], for his steadfast love endures forever.
translation:
  language: sw
  text: Kwa yeye aliyefanya mianga mikubwa[a], kwa maana upendo wake thabiti hudumu milele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vimulika vikubwa.” Kiebrania kinarejelea mianga mikubwa ya mbinguni inayotoa nuru.
    reason: lexical_alternative
  - marker: b
    text: Au “uaminifu wake wa agano hudumu milele.” Neno la Kiebrania חֶסֶד linajumuisha upendo wa kudumu na uaminifu wenye ushikamanifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹשֵׂה
  choice: Kwa yeye aliyezifanya
  rationale: Kiambishi לְ kinaendeleza muundo wa litani unaomwelekezea Mungu sifa; ingawa עֹשֵׂה ni umbo la kitenzi-shirikishi, tendo la uumbaji linaelezwa kwa kawaida kama tendo lililotimizwa.
- source_word: אוֹרִים גְּדֹלִים
  choice: nuru kuu
  rationale: אוֹרִים hapa ni vitu vya angani vinavyotoa nuru, kwa mwangwi wa lugha ya Mwanzo 1. “Nuru kuu” ni ya kawaida na yenye hadhi; “mianga mikuu” pia inawezekana.
- source_word: כִּי
  choice: kwa maana
  rationale: Katika kibwagizo hiki כִּי kinatoa sababu ya sifa; “kwa maana” huhifadhi nguvu hiyo ya ufafanuzi na mtindo wa kiliturujia.
- source_word: לְעוֹלָם
  choice: hudumu milele
  rationale: Kirai hiki humaanisha kudumu bila mwisho; kitenzi “hudumu” kinawekwa wazi kwa Kiswahili cha kawaida.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד huunganisha upendo, uaminifu, na ushikamanifu wa kudumu. “Upendo wake thabiti” huhifadhi upana huo bila kuufanya kuwa hisia pekee au istilahi ya kiagano pekee.
theological_decisions:
- issue: Ufasiri wa חֶסֶד katika kibwagizo kinachorudiwa
  choice: upendo wake thabiti hudumu milele
  alternative: uaminifu wake wa agano hudumu milele; rehema zake zadumu milele
  rationale: “Upendo wake thabiti” huhifadhi pamoja wazo la upendo na ushikamanifu wa kudumu. Mbadala wa “uaminifu wa agano” ni halali lakini unaweza kuifanya maana iwe finyu kuliko neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kibwagizo umehifadhiwa kwa matumizi thabiti katika Zaburi 136.
