lexical_decisions:
- source_word: הַיָּרֵחַ וְכוֹכָבִים
  choice: mwezi na nyota
  rationale: Hutaja mianga ya angani kwa lugha ya kawaida ya Kiswahili; kiunganishi וְ kimetafsiriwa “na.”
- source_word: לְמֶמְשְׁלוֹת בַּלָּיְלָה
  choice: zitawale usiku
  rationale: Kirai hiki kinaeleza kazi au kusudi la mwezi na nyota. “Zitawale usiku” ni cha asili katika Kiswahili na kinadumisha maana ya mamlaka au utawala.
- source_word: כִּי
  choice: kwa maana
  rationale: Kinaanzisha kiitikio kinachotoa sababu ya sifa, huku kikidumisha mtiririko wa kiliturujia wa zaburi.
- source_word: לְעוֹלָם חַסְדּוֹ
  choice: upendo wake mwaminifu ni wa milele
  rationale: חֶסֶד hubeba maana ya upendo wenye uaminifu, fadhili, na rehema. Muundo wa Kiebrania hauna kitenzi kilicho wazi; “ni wa milele” huhifadhi hali hiyo kwa Kiswahili cha asili.
theological_decisions:
- issue: Maana pana ya חֶסֶד katika kiitikio cha Zaburi 136
  choice: upendo wake mwaminifu
  alternative: fadhili zake; rehema zake; upendo wake wa agano
  rationale: “Upendo wake mwaminifu” hudumisha wazo la upendo wa kudumu na uaminifu bila kuufupisha kuwa rehema pekee wala kuingiza neno “agano,” ambalo halipo wazi katika mstari huu.
- issue: Muundo wa לְעוֹלָם חַסְדּוֹ
  choice: ni wa milele
  alternative: hudumu milele
  rationale: Kiebrania kina kishazi kisicho na kitenzi kilichoandikwa. “Ni wa milele” ni cha kawaida katika Kiswahili na hakiongezi kimyakimya kitenzi “hudumu,” ingawa hilo ni wazo linalowezekana.
