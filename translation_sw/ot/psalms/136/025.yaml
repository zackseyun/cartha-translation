  text: who gives food to all flesh[a], for his steadfast love endures forever.
translation:
  language: sw
  text: anayewapa viumbe vyote chakula[a], kwa maana upendo wake thabiti unadumu milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno, “mkate kwa wote wenye mwili.” Katika Kiebrania, “wote wenye mwili” ni nahau inayomaanisha viumbe vyote vilivyo hai, na “mkate” unaweza kumaanisha chakula kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹתֵן
  choice: anayewapa
  rationale: Kivumishi-tendo cha Kiebrania kinaonyesha tendo la Mungu linaloendelea; umbo hili pia linaendana na mtiririko wa orodha ya sifa na matendo katika zaburi hii.
- source_word: לֶחֶם
  choice: chakula
  rationale: Ingawa maana ya msingi ni “mkate,” hapa neno hilo linawakilisha chakula kwa ujumla, kwa hiyo “chakula” linaeleza kwa kawaida utoaji wa Mungu kwa viumbe vyote.
- source_word: לְכָל בָּשָׂר
  choice: viumbe vyote
  rationale: Kirai cha Kiebrania, kwa neno moja moja “mwili wote,” ni nahau inayoweza kumaanisha viumbe vyote vilivyo hai. Tafsiri hii ya Kiswahili inaepuka kukifanya kifungu kihusu wanadamu pekee.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha kiitikio kinachotoa msingi wa sifa na kuhifadhi mpigo wa kiliturujia wa zaburi.
- source_word: לְעוֹלָם
  choice: unadumu milele
  rationale: Kifungu cha Kiebrania hakina kitenzi kilichoandikwa; “unadumu milele” hukamilisha maana yake kwa Kiswahili cha kawaida na kuonyesha mwendelezo usio na mwisho.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד hujumuisha upendo wenye uaminifu, neema, na uthabiti. “Upendo wake thabiti” ni wazi, wenye uzito wa kiteolojia, na hauufupishi kuwa rehema pekee.
theological_decisions:
- issue: Upeo wa לְכָל בָּשָׂר (“mwili wote”)
  choice: Utoaji wa Mungu kwa viumbe vyote vilivyo hai
  alternative: Utoaji kwa wanadamu wote pekee
  rationale: Katika matumizi ya Kiebrania, kirai hiki mara nyingi huwahusu viumbe hai kwa upana. Muktadha wa utunzaji wa Mungu hauhalalishi kuupunguza upeo wake uwe wa wanadamu tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Viumbe vyote” ni cha kawaida na wazi zaidi kuliko kuhamisha nahau “wote wenye mwili” moja kwa moja; maana halisi na nahau zimehifadhiwa katika tanbihi. Kiitikio kimetafsiriwa kwa mtindo unaoweza kurudiwa kwa urahisi katika Zaburi 136.
