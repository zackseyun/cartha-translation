lexical_decisions:
- source_word: לְ/גֹזֵר
  choice: yeye aliyeigawanya
  rationale: Kiambishi ל katika orodha hii humtambulisha anayesifiwa, na גזר humaanisha kukata au kugawanya. Muundo huu ni wa kawaida katika Kiswahili na unadumisha maana ya tendo hilo.
- source_word: יַם סוּף
  choice: Bahari ya Matete
  rationale: Hili ndilo linalowakilisha moja kwa moja maana ya jina la Kiebrania; jina la jadi ‘Bahari ya Shamu’ limehifadhiwa katika tanbihi.
- source_word: לִ/גְזָרִים
  choice: sehemu mbalimbali
  rationale: גְזָרִים ni sehemu zilizotenganishwa. Usemi huu unaeleweka kwa urahisi na unaonyesha kwamba bahari iligawanywa katika sehemu.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inaanzisha sababu ya sifa katika kiitikio kinachorudiwa katika zaburi hii.
- source_word: לְ/עוֹלָם
  choice: hudumu milele
  rationale: Kiebrania hakina kitenzi kilichoandikwa katika kiitikio; ‘hudumu’ kinakamilisha sentensi kwa Kiswahili cha kawaida bila kubadili maana ya kudumu daima.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד huonyesha upendo mwaminifu, unaodumu, na wenye uaminifu wa uhusiano; ‘upendo thabiti’ ni wazi na huepuka kuupunguza kuwa huruma pekee.
