base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/017.yaml
  text: To him who struck down great kings[b][a], for his steadfast love endures forever.
translation:
  language: sw
  text: 'Kwa yeye aliyewapiga wafalme wakuu,

    kwa maana upendo wake thabiti ni wa milele.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa yeye aliyewaangamiza wafalme wakuu.” Kitenzi cha Kiebrania kina maana ya msingi ya “kupiga”; katika muktadha kinaweza kudokeza kushinda au kuua.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַכֵּה
  choice: Yeye aliyewaangamiza
  rationale: Kiambishi לְ kinaendeleza mtindo wa sifa wa zaburi, ‘kwa yeye ambaye...’; katika Kiswahili sentensi ya kawaida na yenye hadhi ni ‘Yeye aliye...’. Kitenzi נכה katika muktadha huu kinaonyesha kuwashinda na kuwaangamiza wafalme, si kuwapiga tu.
- source_word: מְלָכִים גְּדֹלִים
  choice: wafalme wakuu
  rationale: ‘Wafalme’ ni wingi wa מֶלֶךְ, na ‘wakuu’ huhifadhi maana ya גְּדֹלִים ya ukubwa, umaarufu, au uwezo wa watawala hao bila kuibana kuwa nguvu pekee.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutanguliza kibwagizo kinachotoa sababu ya sifa. ‘Kwa maana’ linaendeleza mtiririko wa kiliturujia kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: לְעוֹלָם
  choice: ni wa milele
  rationale: Kirai hiki humaanisha muda usio na mwisho. Kiswahili ‘ni wa milele’ huwasilisha kwa ufasaha hali ya kudumu inayosemwa na kibwagizo cha Kiebrania kisicho na kitenzi wazi.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חסד huunganisha upendo, uaminifu, fadhili, na rehema, hasa katika uhusiano wa agano. ‘Upendo wake thabiti’ huhifadhi upana huo vizuri kuliko ‘rehema’ pekee.
theological_decisions:
- issue: Tafsiri ya חסד katika kibwagizo kinachorudiwa
  choice: upendo wake thabiti ni wa milele
  alternative: rehema zake ni za milele; uaminifu wake wa agano ni wa milele
  rationale: ‘Upendo wake thabiti’ hudumisha pamoja wazo la upendo na uaminifu wa kudumu bila kuufanya mstari useme rehema pekee au kutumia istilahi ya kitaalamu ya ‘agano’ ambayo haiko wazi katika neno lenyewe hapa.
- issue: Nguvu ya נכה kuhusu wafalme
  choice: aliwaangamiza
  alternative: aliwapiga; aliwashinda
  rationale: Muktadha unaofuata unataja vifo vya Sihoni na Ogu, hivyo ‘aliwaangamiza’ huonyesha pigo la mwisho. Hata hivyo, neno la Kiebrania lenyewe linaweza pia kutafsiriwa kwa upana zaidi kuwa ‘aliwapiga’.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na wa ibada. ‘Wafalme wakuu’ huhifadhi ulinganifu wa Kiebrania; ‘upendo wake thabiti’ hutumiwa kama kirai kinachoeleweka na wasomaji wa kawaida huku kikihifadhi uzito wa חסד.
