  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo wa mstari wa Kiebrania: mtenda wa maajabu makuu anatambulishwa kuwa ni yeye peke yake, na kibwagizo cha sababu kinaendelea kwa usahihi. “Mshukuruni” ni ujazo unaokubalika kutokana na muundo unaorudiwa wa Zaburi 136, ambamo לְ־ hutegemea amri ya kutoa shukrani; hauongezi dai jipya la maana.'
