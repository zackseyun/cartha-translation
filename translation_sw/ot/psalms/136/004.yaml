  text: לְ/עֹ֘שֵׂ֤ה נִפְלָא֣וֹת גְּדֹל֣וֹת לְ/בַדּ֑/וֹ כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/004.yaml
  text: to him who alone does great wonders[b][a], for his steadfast love endures forever.
translation:
  language: sw
  text: 'Mshukuruni yeye ambaye peke yake hutenda maajabu makuu[a],

    kwa maana upendo wake thabiti[b] unadumu milele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘matendo makuu ya ajabu.’
    reason: lexical_alternative
  - marker: b
    text: ‘Upendo thabiti’ hutafsiri neno la Kiebrania hesed, ambalo mara nyingi huhusisha upendo mwaminifu na wa kudumu, hasa katika uhusiano wa agano; pia linaweza kutafsiriwa ‘rehema’ au ‘uaminifu wa agano.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/עֹשֵׂה
  choice: Mshukuruni yeye ambaye hutenda
  rationale: Kiambishi לְ־ kinaendelea na muundo wa kiliturujia wa zaburi wa ‘mshukuruni ...’; kitenzi ‘Mshukuruni’ kimewekwa wazi kwa Kiswahili cha kawaida, huku participio עֹשֵׂה ikitafsiriwa ‘ambaye hutenda’ kuonyesha sifa yake ya kudumu.
- source_word: נִפְלָאוֹת
  choice: maajabu
  rationale: Neno hili humaanisha matendo yasiyo ya kawaida yanayoamsha mshangao, hasa matendo ya Mungu; ‘maajabu’ ni tafsiri fupi, ya kawaida na yenye hadhi.
- source_word: גְּדֹלוֹת
  choice: makuu
  rationale: Kivumishi hiki kinaeleza ukubwa au ukuu wa maajabu na kinakubaliana kisarufi na ‘maajabu’.
- source_word: לְ/בַדּ/וֹ
  choice: peke yake
  rationale: 'Usemi huu unasisitiza upekee: ni yeye tu atendaye maajabu hayo makuu.'
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha sababu ya shukrani katika kibwagizo cha Zaburi 136 na kudumisha uhusiano wa kisababu.
- source_word: לְ/עוֹלָם
  choice: unadumu milele
  rationale: Kifungu cha Kiebrania hakina kitenzi kilichoandikwa; Kiswahili huhitaji kitenzi hapa. ‘Unadumu milele’ huonyesha kuendelea bila mwisho.
- source_word: חַסְדּ/וֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד huhusisha upendo, uaminifu na ushikamanifu wa kudumu. ‘Upendo wake thabiti’ ni wazi na wa kawaida bila kuufanya wazi kupita kiasi kuwa istilahi ya agano.
theological_decisions:
- issue: Tafsiri ya kibwagizo חַסְדּוֹ לְעוֹלָם
  choice: kwa maana upendo wake thabiti unadumu milele
  alternative: kwa maana rehema zake zadumu milele; kwa maana uaminifu wake wa agano ni wa milele
  rationale: ‘Upendo wake thabiti’ huhifadhi pamoja wema wa Mungu na ushikamanifu wake wa kudumu. ‘Rehema’ inaweza kuwa finyu zaidi, na ‘uaminifu wa agano’ huweka wazi maana ya kitheolojia ambayo neno lenyewe linaweza kuibeba bila kuitaja moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mstari miwili unahifadhi mtiririko wa kiliturujia. ‘Mshukuruni’ imetolewa kutokana na kiambishi cha dativu לְ־ na muundo unaorudiwa wa zaburi, ili mstari uwe wa kawaida na kamili katika Kiswahili.
