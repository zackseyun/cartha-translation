  text: ה֭וֹדוּ לְ/אֵ֣ל הַ/שָּׁמָ֑יִם כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/026.yaml
  text: Give thanks to the God of heaven[a], for his steadfast love endures forever.
translation:
  language: sw
  text: Mshukuruni Mungu wa mbinguni, kwa maana upendo wake mwaminifu ni wa milele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uaminifu wake wa agano ni wa milele.” Neno la Kiebrania חֶסֶד lina maana ya upendo mwaminifu na wa kudumu katika uhusiano wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Mshukuruni
  rationale: Ni amri ya wingi inayolielekeza jumuiya kutoa shukrani; “Mshukuruni” ni ya asili na inafaa katika kibwagizo cha Zaburi 136.
- source_word: לְאֵל הַשָּׁמָיִם
  choice: Mungu wa mbinguni
  rationale: Kifungu hiki kinamtaja Mungu kuwa Mungu wa makao ya mbinguni. Umoja “mbinguni” ni usemi wa kawaida wa Kiswahili na hauondoi maana ya neno la Kiebrania lenye umbo la wingi.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha sababu ya kutoa shukrani na hudumisha mtindo wa kishairi wa kibwagizo.
- source_word: לְעוֹלָם
  choice: ni wa milele
  rationale: Kiebrania kinasema kwa ufupi “hata milele”; Kiswahili hiki kinaeleza kwa kawaida mwendelezo usio na mwisho bila kuongeza wazo geni.
- source_word: חַסְדּוֹ
  choice: upendo wake mwaminifu
  rationale: חֶסֶד huunganisha upendo, wema, na uaminifu wa kudumu katika uhusiano wa agano. “Upendo wake mwaminifu” huhifadhi pande za upendo na uaminifu bila kuufupisha kuwa rehema pekee.
theological_decisions:
- issue: Tafsiri ya חֶסֶד katika kibwagizo cha Zaburi 136
  choice: upendo wake mwaminifu ni wa milele
  alternative: fadhili zake ni za milele; uaminifu wake wa agano ni wa milele
  rationale: Chaguo hili huhifadhi kwa pamoja hisia ya upendo na uaminifu wa kudumu. “Fadhili” inaweza kusisitiza wema pekee, na “uaminifu wa agano” inaweza kufanya dhana ya agano iliyo ndani ya neno iwe wazi zaidi kuliko ilivyo katika mstari wenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa ibada lakini kinachoeleweka kwa wasomaji wa kawaida. Kibwagizo kimetafsiriwa kwa ufupi na kwa hadhi.
