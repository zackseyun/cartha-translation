  text: ה֭וֹדוּ לֵֽ/אלֹהֵ֣י הָ/אֱלֹהִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/002.yaml
  text: Give thanks to the God of gods[b][a], for his steadfast love endures forever.
translation:
  language: sw
  text: Mshukuruni Mungu wa miungu[a], kwa maana upendo wake thabiti[b] ni wa milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mungu aliye juu ya miungu yote.” Kiebrania kinasema kihalisi “Mungu wa miungu,” msemo unaoonyesha ukuu wake kuliko wote.
    reason: lexical_alternative
  - marker: b
    text: “Upendo thabiti” hutafsiri neno la Kiebrania hesed, ambalo mara nyingi humaanisha upendo mwaminifu na wa kudumu, hasa katika agano; linaweza pia kutafsiriwa “rehema” au “uaminifu wa agano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Mshukuruni
  rationale: Kauli ya amri kwa wingi ya ידה katika Hifili hapa inatoa wito wa kumshukuru Mungu; “Mshukuruni” ni ya kawaida, yenye heshima, na huhifadhi nguvu ya amri.
- source_word: לֵאלֹהֵי הָאֱלֹהִים
  choice: Mungu wa miungu
  rationale: Muundo huu wa uhusiano unamaanisha kihalisi “Mungu wa miungu” na ni msemo wa kuonyesha ukuu wake kuliko wote; tafsiri rasmi huhifadhi lugha iliyotukuka ya zaburi.
- source_word: כִּי
  choice: kwa maana
  rationale: Neno hili linatanguliza sababu ya wito wa kushukuru na linaunganisha kwa kawaida mstari wa kwanza na kiitikio.
- source_word: לְעוֹלָם
  choice: ni wa milele
  rationale: Kirai hiki kinamaanisha kudumu bila mwisho. Kwa kuwa kishazi cha Kiebrania hakina kitenzi kilichoandikwa, Kiswahili cha kawaida kinahitaji kiunganishi “ni”.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חסד hujumuisha upendo wa kudumu, uaminifu, na rehema, mara nyingi katika uhusiano wa agano. “Upendo wake thabiti” huhifadhi wazo la upendo pamoja na uthabiti wake, huku kiambishi cha nafsi kikionyeshwa kwa “wake”.
theological_decisions:
- issue: Maana ya אֱלֹהִים katika msemo “Mungu wa miungu”
  choice: Kuhifadhi cheo cha moja kwa moja “Mungu wa miungu” kama tangazo la ukuu wa Mungu.
  alternative: “Mungu aliye juu ya miungu yote.”
  rationale: Msemo wa Kiebrania unatangaza ukuu na kutolinganishwa kwa Mungu bila kulazimisha hitimisho kuhusu hali halisi ya miungu mingine. Tafsiri ya moja kwa moja huhifadhi mvutano na balagha ya maandishi.
- issue: Upeo wa maana ya חַסְדּוֹ
  choice: “upendo wake thabiti”
  alternative: “rehema zake” au “uaminifu wake wa agano”
  rationale: Neno חסד lina upana unaojumuisha upendo, uaminifu, na rehema. Chaguo hili halifungi maana katika kipengele kimoja cha kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. “Mshukuruni” huhifadhi amri ya wingi; “Mungu wa miungu” huhifadhi msemo wa Kiebrania; maelezo ya chini yanaonyesha maana mbadala bila kutatua kimadhehebu suala ambalo maandishi yenyewe hayatatui.
