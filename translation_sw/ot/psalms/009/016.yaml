id: PSA.9.16
reference: Psalms 9:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: נ֤וֹדַ֨ע יְהוָה֮ מִשְׁפָּ֪ט עָ֫שָׂ֥ה בְּ/פֹ֣עַל כַּ֭פָּי/ו נוֹקֵ֣שׁ רָשָׁ֑ע הִגָּי֥וֹן סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/016.yaml
  text: Yahweh has made himself known[a]; he has executed judgment. The wicked is snared by the work of his own hands. Higgaion[b]. Selah
translation:
  language: sw
  text: Yahwe amejidhihirisha[a]; ametekeleza hukumu. Mwovu amenaswa kwa kazi ya mikono yake mwenyewe. Higayoni[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe anajulikana; ametekeleza hukumu.” Neno la Kiebrania נודע linaweza kueleweka kuwa hali ya kutendwa (“anajulikana”) au kuwa tendo lenye matokeo (“amejidhihirisha”).
    reason: alternative_reading
  - marker: b
    text: “Higayoni” huenda ni istilahi ya muziki au liturujia; pia inaweza kumaanisha “tafakari” au kuwa maelekezo ya muziki kama “muziki wenye mwangwi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹדַע
  choice: amejidhihirisha
  rationale: Kauli ya Nifali ya ידע inaweza kueleza hali ya kujulikana au matokeo ya kujifunua. “Amejidhihirisha” ni Kiswahili cha kawaida kinachoonyesha kwamba Yahwe ametambulika kupitia tendo lake, huku usomaji mbadala ukihifadhiwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: מִשְׁפָּט עָשָׂה
  choice: ametekeleza hukumu
  rationale: Kirai hiki kinaeleza kutenda tendo la kimahakama. “Ametekeleza hukumu” huhifadhi maana hiyo kwa lugha ya sasa na yenye hadhi.
- source_word: בְּפֹעַל כַּפָּיו
  choice: kwa kazi ya mikono yake mwenyewe
  rationale: Kihusishi kinaonyesha njia au mazingira ya kunaswa; matendo ya mwovu mwenyewe ndiyo yanayokuwa sababu ya kuanguka kwake. “Mwenyewe” huweka wazi nguvu ya umilikishi katika muktadha.
- source_word: נוֹקֵשׁ
  choice: amenaswa
  rationale: Kitenzi huhifadhi sitiari ya kunaswa katika mtego na kinafaa katika muktadha wa hukumu na matokeo ya matendo.
- source_word: רָשָׁע
  choice: mwovu
  rationale: Kivumishi cha umoja kilichotumiwa kama nomino kimetafsiriwa kwa umoja wa kiwakilishi, bila kuongeza jinsia isiyolazimishwa na maana.
- source_word: הִגָּיוֹן
  choice: Higayoni
  rationale: Kwa kuwa huenda ni istilahi ya muziki au liturujia na maana yake si hakika, imetoholewa katika matini kuu na uwezekano mwingine umeelezwa katika tanbihi.
- source_word: סֶלָה
  choice: Sela
  rationale: Istilahi hii ya liturujia au muziki imetoholewa kwa sababu maana yake kamili haijulikani kwa hakika.
theological_decisions:
- issue: Yahwe kujidhihirisha kupitia hukumu
  choice: Matini inasema kwamba Yahwe amejidhihirisha na kwamba ametekeleza hukumu, bila kupanua kauli hiyo kuwa fundisho pana lisilosemwa hapa.
  alternative: “Yahwe anajulikana; ametekeleza hukumu,” yaani kuelewa נודע kama hali ya kutendwa badala ya maana ya matokeo au kujidhihirisha.
  rationale: Mpangilio wa Kiebrania unaunganisha kujulikana kwa Yahwe na tendo lake la hukumu, lakini hauainishi kwa ukamilifu uhusiano wa kisarufi. Nuktakoloni na tanbihi huhifadhi uhusiano huo pamoja na utata wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo mfupi, wa kishairi na wenye hadhi. Istilahi za muziki zisizo na maana hakika zimetoholewa, na utata halisi wa נודע umehifadhiwa kwa tanbihi.
