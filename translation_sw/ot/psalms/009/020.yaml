  yaml_path: translation/ot/psalms/009/020.yaml
  text: Put fear in them, O LORD; let the nations know that they are only man. Selah
translation:
  language: sw
  text: Ee Yehova, tia hofu ndani yao; mataifa na yajue kwamba wao ni wanadamu tu. Sela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיתָה
  choice: tia
  rationale: Kauli ya amri yenye maana ya kuweka au kutia; “tia” ni ya asili na yenye nguvu katika Kiswahili.
- source_word: יְהוָה
  choice: Yehova
  rationale: Linawakilisha jina la Mungu YHWH kama jina maalumu, badala ya kulibadilisha kuwa cheo.
- source_word: מוֹרָה
  choice: hofu
  rationale: Katika muktadha huu nomino inaeleweka kuwa hofu au kitisho kinachowafanya mataifa watambue udhaifu wao.
- source_word: לָהֶם
  choice: ndani yao
  rationale: Huhifadhi kwa ukaribu usemi wa Kiebrania, unaoweza kumaanisha hofu iwe ndani yao, bila kuubadili kuwa ‘watishie’.
- source_word: גּוֹיִם
  choice: mataifa
  rationale: Tafsiri ya kawaida na inayofaa kwa makundi ya watu yasiyo Israeli katika zaburi.
- source_word: אֱנוֹשׁ
  choice: wanadamu tu
  rationale: אֱנוֹשׁ hukazia ubinadamu dhaifu na wenye kufa; “tu” huwasilisha tofauti iliyokusudiwa kati yao na Mungu bila kuongeza fundisho maalumu.
- source_word: סֶּלָה
  choice: Sela
  rationale: Neno la kiliturujia au kimuziki lenye maana isiyo hakika linaandikwa kwa matamshi badala ya kutafsiriwa kwa kubahatisha.
theological_decisions:
- issue: Jina la Mungu יהוה
  choice: Yehova
  alternative: BWANA
  rationale: Matini ya chanzo ina jina maalumu la agano; kutumia “Yehova” hulitofautisha na cheo אֲדֹנָי huku kikiwa namna inayotambulika kwa wasomaji wa Kiswahili.
- issue: Maana ya אֱנוֹשׁ
  choice: wanadamu tu
  alternative: mwanadamu
  rationale: Kauli hiyo inasisitiza kwamba mataifa si ya kimungu bali ni wanadamu dhaifu; wingi wa Kiswahili unapatana na kiwakilishi “wao” ingawa Kiebrania hutumia nomino ya umoja kwa maana ya kijumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo wa ombi na tofauti kati ya Yehova na mataifa umehifadhiwa; ‘Sela’ limeachwa bila kufafanuliwa kwa sababu maana yake si hakika.
