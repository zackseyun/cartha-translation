  text: קוּמָ֣/ה יְ֭הוָה אַל יָעֹ֣ז אֱנ֑וֹשׁ יִשָּׁפְט֥וּ ג֝וֹיִ֗ם עַל פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/019.yaml
  text: Rise up[a], O Yahweh; do not let man prevail; let the nations be judged before you.
translation:
  language: sw
  text: Inuka, Ee Yahwe; mwanadamu asishinde[a]; mataifa yahukumiwe mbele zako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “binadamu dhaifu” au “mwanadamu anayeweza kufa”; neno la Kiebrania אֱנוֹשׁ mara nyingi hukazia udhaifu wa binadamu au hali yake ya kufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: Inuka
  rationale: Amri inayomwelekea Mungu na kuomba aingilie kati; “Inuka” ni ya kawaida, yenye hadhi, na hudumisha nguvu ya ombi la kishairi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: אַל יָעֹז
  choice: asishinde
  rationale: Kikanushi אַל pamoja na umbo la ombi la יָעֹז kinaomba mwanadamu asiruhusiwe kuwa na nguvu ya kushinda; “asishinde” ni Kiswahili cha asili kinachofaa muktadha.
- source_word: אֱנוֹשׁ
  choice: mwanadamu
  rationale: Huhifadhi umoja wenye maana ya kiwakilishi kwa binadamu, huku dokezo la udhaifu na hali ya kufa likiwekwa katika tanbihi.
- source_word: יִשָּׁפְטוּ
  choice: yahukumiwe
  rationale: 'Nifali isiyo timilifu yenye nguvu ya ombi inaeleweka hapa kwa maana ya kutendwa: mataifa yawekwe chini ya hukumu ya Mungu.'
- source_word: גּוֹיִם
  choice: mataifa
  rationale: Neno la kawaida kwa makundi ya watu au mataifa, hasa yasiyo Israeli, katika Zaburi.
- source_word: עַל־פָּנֶיךָ
  choice: mbele zako
  rationale: Usemi wa asili wa Kiswahili unaowasilisha kuwa katika uwepo wa Mungu kwa ajili ya hukumu bila kufuata kihalisi sana “mbele ya uso wako.”
theological_decisions:
- issue: Dokezo la kibinadamu katika אֱנוֹשׁ
  choice: mwanadamu
  alternative: mwanadamu anayeweza kufa; binadamu dhaifu
  rationale: “Mwanadamu” hudumisha umoja wa kiwakilishi na tofauti kati ya uwezo wa Mungu na udhaifu wa binadamu. Tanbihi huhifadhi dokezo halisi la kufa au kuwa dhaifu bila kulazimisha maana hiyo ndani ya matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na ombi lenye nguvu vimedumishwa; “Ee” huonyesha mwito wa moja kwa moja kwa Mungu.
