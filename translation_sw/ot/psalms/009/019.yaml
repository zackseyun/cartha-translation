  source_fidelity: “Inuka, Ee Yahwe” faithfully renders the imperative appeal קוּמָה יְהוָה. “Mwanadamu asishinde” preserves the singular representative אֱנוֹשׁ and the prayer that humans not prevail. “Mataifa yahukumiwe mbele zako” accurately conveys the jussive/passive judicial sense of יִשָּׁפְטוּ גוֹיִם and the idiomatic force of עַל־פָּנֶיךָ.
