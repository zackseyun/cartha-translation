  text: הָֽ/אוֹיֵ֨ב תַּ֥מּוּ חֳרָב֗וֹת לָ֫/נֶ֥צַח וְ/עָרִ֥ים נָתַ֑שְׁתָּ אָבַ֖ד זִכְרָ֣/ם הֵֽמָּה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/006.yaml
  text: The enemy has come to an end in everlasting ruins[a]; you have uprooted cities; the very memory of them has perished.
translation:
  language: sw
  text: Adui amefikia mwisho[a]; magofu yake ni ya milele. Umeing’oa miji; hata kumbukumbu yao imepotea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ee adui, maangamizi yamekwisha milele.” Mwanzo wa Kiebrania unaweza kueleweka kuwa mwito wa moja kwa moja kwa adui badala ya kumfanya “adui” kuwa kiima.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאוֹיֵב
  choice: Adui
  rationale: Nomino yenye kibainishi imetafsiriwa kama kiima cha kauli, yaani ‘Adui’; uwezekano wa kuisoma kama mwito umewekwa katika tanbihi.
- source_word: תַּמּוּ
  choice: amefikia mwisho
  rationale: Kitenzi מן תמם kinaonyesha kukamilika au kufikia mwisho; usemi huu ni wa kawaida katika Kiswahili na unadumisha maana ya mwisho kamili.
- source_word: חֳרָבוֹת
  choice: magofu
  rationale: Neno hilo humaanisha magofu au ukiwa unaotokana na uharibifu; ‘magofu’ linahifadhi taswira halisi ya maeneo yaliyoharibiwa.
- source_word: לָנֶצַח
  choice: ya milele
  rationale: Kirai hiki kinaonyesha kudumu kwa hali ya uharibifu bila mwisho.
- source_word: וְעָרִים
  choice: miji
  rationale: Hii ndiyo maana ya kawaida ya עִיר, na muktadha hauhitaji neno dhaifu kama ‘makazi’.
- source_word: נָתַשְׁתָּ
  choice: umeing’oa
  rationale: נתשׁ hubeba taswira ya kung’oa kabisa; ‘umeing’oa’ linahifadhi sitiari ya kuondolewa kabisa badala ya kuisawazisha kuwa ‘umeiharibu’.
- source_word: אָבַד
  choice: imepotea
  rationale: Kitenzi kinaweza kueleza kuangamia au kutoweka; kuhusu kumbukumbu, ‘imepotea’ ni Kiswahili cha asili na chenye uzito unaofaa.
- source_word: זִכְרָם הֵמָּה
  choice: hata kumbukumbu yao
  rationale: Kiwakilishi cha msisitizo הֵמָּה kimewakilishwa kwa ‘hata,’ kikisisitiza kwamba kumbukumbu yenyewe imetoweka.
theological_decisions:
- issue: Muundo wa kisintaksia wa mwanzo wa mstari
  choice: Mwanzo unasomwa kama tangazo kwamba adui amefikia mwisho.
  alternative: ‘Ee adui, maangamizi yamekwisha milele.’
  rationale: Kiebrania kinaweza kueleweka kama mwito kwa adui, lakini mtiririko wa kauli unaunga mkono kusoma ‘adui’ kama kiima. Kwa kuwa utata huo ni halisi, usomaji mwingine umehifadhiwa katika tanbihi bila kuufanya uamuzi wa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo ni wazi kwa msomaji wa kawaida, huku sitiari ya ‘kuing’oa miji’ na utata halisi wa mwanzo wa Kiebrania vikihifadhiwa.
