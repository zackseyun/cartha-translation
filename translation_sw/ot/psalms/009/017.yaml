lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: watarudi
  rationale: Kitenzi cha Kiebrania שוב katika Qal imperfect, nafsi ya tatu wingi, kinaweza kumaanisha ‘kurudi’ au ‘kugeuka na kurudi.’ ‘Watarudi’ ni Kiswahili cha kawaida na kinahifadhi wazo la mwendo kuelekea Sheoli bila kulifasiri kupita kiasi.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Hili ni jina la kundi la watu wenye uovu wa kimaadili. ‘Waovu’ ni fupi, la kawaida, na lenye hadhi katika Kiswahili cha kibiblia cha sasa.
- source_word: לִשְׁאוֹלָה
  choice: Sheoli
  rationale: Kiambishi cha mwelekeo katika Kiebrania kinaonyesha kwenda Sheoli. Utohozi ‘Sheoli’ unahifadhi dhana ya Kiebrania badala ya kuibana kuwa ‘kaburi’ au kuifasiri kuwa ‘jehanamu.’
- source_word: כָּל גּוֹיִם
  choice: mataifa yote
  rationale: גּוֹיִם humaanisha mataifa au jamii za watu. ‘Mataifa yote’ huonyesha kwa kawaida nguvu ya jumla ya כָּל bila kuingiza tofauti ya ‘Wayahudi na Mataifa’ ambayo haijasemwa wazi hapa.
- source_word: שְׁכֵחֵי אֱלֹהִים
  choice: yanayomsahau Mungu
  rationale: Kirai cha participle katika hali ya construct kinaeleza tabia inayowatambulisha watu hao. ‘Yanayomsahau Mungu’ ni cha asili katika Kiswahili na kinadumisha maana ya tabia inayoendelea.
theological_decisions:
- issue: Maana ya שְׁאוֹל katika muktadha wa hukumu
  choice: Kutumia ‘Sheoli’ badala ya kuitafsiri moja kwa moja kuwa ‘jehanamu.’
  alternative: kaburi; makao ya wafu; jehanamu
  rationale: Ingawa mstari unazungumzia hatima ya waovu, neno la Kiebrania שְׁאוֹל lenyewe halilazimishi maana mahsusi ya baadaye ya jehanamu. Utohozi unahifadhi upeo na mvutano wa maana ya asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi kama ushairi wa zaburi; ‘waovu’ na ‘mataifa yote’ ni maneno yanayoeleweka kwa urahisi. Alama zote za tanbihi zimewekwa katika matini kuu.
