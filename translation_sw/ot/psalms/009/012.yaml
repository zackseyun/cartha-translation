base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/012.yaml
  text: For the one who avenges bloodshed remembers them[a]; he does not forget the cry of the afflicted.
translation:
  language: sw
  text: Kwa maana yeye anayadai hesabu kwa ajili ya umwagaji damu huwakumbuka; hasahau kilio cha wanaoteswa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maskini.” Neno la Kiebrania linaweza kumaanisha maskini, wenye dhiki, wanyenyekevu, au wanaoonewa; hapa maana pana ya watu wanaoteseka inafaa muktadha wa umwagaji damu na ombi la haki.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huonyesha sababu ya kauli iliyotangulia na kudumisha mtiririko wa maelezo katika zaburi.
- source_word: דֹרֵשׁ דָּמִים
  choice: yeye anayelipiza kisasi kwa ajili ya damu iliyomwagika
  rationale: Kirai hiki kinamwonyesha Mungu akitaka uwajibikaji na kutoa haki kwa sababu ya mauaji; hakimaanishi kwamba anatafuta damu kihalisi.
- source_word: אוֹתָם
  choice: huwakumbuka
  rationale: Kiambishi cha wingi -wa- kinahifadhi yambwa ya wingi katika mapokeo ya maandishi na kinawarejelea wanaoteswa kama kundi.
- source_word: זָכָר
  choice: huwakumbuka
  rationale: Ingawa kitenzi ni timilifu kwa umbo, hapa ushairi unaeleza tendo la Mungu la kawaida na linaloendelea; wakati wa mazoea unasikika kwa kawaida katika Kiswahili.
- source_word: לֹא שָׁכַח
  choice: hasahau
  rationale: Kauli ya sasa inaendana na mstari sambamba na kueleza ukweli unaoendelea kuhusu Mungu.
- source_word: צַעֲקַת
  choice: kilio
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya sauti ya dhiki inayomwomba Mungu msaada na haki.
- source_word: עניים
  choice: wanaoteswa
  rationale: Neno la Kiebrania linaweza kuwataja maskini, wenye dhiki, wanyenyekevu au wanaoonewa. Katika muktadha wa umwagaji damu na kutafuta haki, ‘wanaoteswa’ linaonyesha kwa upana hali yao ya kuteseka.
theological_decisions:
- issue: Haki ya Mungu inayodokezwa na דֹרֵשׁ דָּמִים
  choice: Mungu anaonyeshwa akilipiza kisasi kwa ajili ya damu iliyomwagika, yaani akiwawajibisha wenye hatia ya mauaji.
  alternative: Mungu anatambua tu umwagaji damu, au anatafuta damu kihalisi.
  rationale: Nahau hii inahusu kudai hesabu na kutoa adhabu ya haki kwa hatia ya damu, si tamaa ya damu wala kutambua uovu bila kuchukua hatua. Tafsiri haimfanyi Mungu awe na cheo maalumu cha kisheria ambacho hakikutajwa wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Kirai ‘damu iliyomwagika’ kinaeleza mauaji bila kuingiza cheo maalumu cha kisheria; ‘wanaoteswa’ kinahifadhi upana wa maana ya neno la Kiebrania.
