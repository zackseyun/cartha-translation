  yaml_path: translation/ot/psalms/009/011.yaml
  text: Sing praises to Yahweh[a], who dwells in Zion; declare his deeds among the peoples.
translation:
  language: sw
  text: Mwimbieni Yahweh[a] sifa, yeye akaaye Sayuni; yatangazeni matendo yake miongoni mwa mataifa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yeye aketiye kwenye kiti cha enzi huko Sayuni.”
    reason: Kirai יֹשֵׁב צִיּוֹן kinaweza kueleza kukaa Sayuni au, katika muktadha wa kifalme wa Zaburi, kutawala akiwa ameketi kwenye kiti cha enzi.
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Mwimbieni ... sifa
  rationale: Kauli ya kuamuru kwa wingi ya זמר katika muktadha wa ibada; usemi huu unawasilisha tendo la kuimba pamoja na kusifu kwa Kiswahili cha kawaida.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יְהוָה limetoholewa kama Yahweh badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina lililo katika maandishi ya Kiebrania.
- source_word: יֹשֵׁב צִיּוֹן
  choice: yeye akaaye Sayuni
  rationale: Kitenzi kishirikishi יֹשֵׁב kinaweza kumaanisha kukaa mahali au kuketi; 'akaaye' huhifadhi wazo la uwepo wa Yahweh Sayuni bila kulazimisha taswira ya kifalme.
- source_word: הַגִּידוּ
  choice: yatangazeni
  rationale: Hifili ya נגד hapa ni amri ya wingi ya kutoa habari hadharani; 'yatangazeni' ina nguvu ya mwito wa wazi na inafaa ushairi wenye hadhi.
- source_word: בָעַמִּים
  choice: miongoni mwa mataifa
  rationale: Kihusishi ב pamoja na wingi עַמִּים kinaeleza kutangaza katikati ya makundi ya watu; 'mataifa' ni usemi wa asili unaotambulika kwa wasomaji wa Kiswahili.
- source_word: עֲלִילוֹתָיו
  choice: matendo yake
  rationale: Neno עֲלִילוֹתָיו linamaanisha vitendo au kazi zake; 'matendo yake' ni fupi na haliongezi kivumishi kama 'makuu' ambacho hakipo wazi katika nomino.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יְהוָה; 'Yahweh' hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya יֹשֵׁב צִיּוֹן
  choice: yeye akaaye Sayuni
  alternative: yeye aketiye kwenye kiti cha enzi Sayuni
  rationale: Kirai kinaweza kuashiria uwepo wa Mungu au utawala wake wa kifalme. Tafsiri kuu haitaji moja kwa moja kiti cha enzi, lakini maana hiyo inayowezekana imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo wa amri kwa wingi umehifadhiwa, pamoja na uwiano wa mistari miwili ya Kiebrania.
