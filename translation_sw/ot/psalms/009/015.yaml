  text: טָבְע֣וּ ג֭וֹיִם בְּ/שַׁ֣חַת עָשׂ֑וּ בְּ/רֶֽשֶׁת ז֥וּ טָ֝מָ֗נוּ נִלְכְּדָ֥ה רַגְלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/015.yaml
  text: The nations have sunk into the pit they made; in the net they hid[a], their own foot has been caught.
translation:
  language: sw
  text: Mataifa yamezama katika shimo walilochimba; katika wavu waliouficha, mguu wao wenyewe[a] umenaswa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina neno la umoja, “mguu wao,” ambalo huenda limetumiwa kwa maana ya ujumla kuhusu mataifa hayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: טָבְעוּ
  choice: yamezama
  rationale: Kitenzi cha Kiebrania kinaonyesha kuzama au kumezwa; ‘yamezama’ kinahifadhi picha hiyo kwa Kiswahili cha kawaida.
- source_word: גּוֹיִם
  choice: Mataifa
  rationale: Neno hili kwa kawaida humaanisha mataifa au makundi ya watu; ‘Mataifa’ linafaa katika muktadha huu wa kishairi.
- source_word: בְּשַׁחַת עָשׂוּ
  choice: katika shimo walilochimba
  rationale: Ingawa עָשׂוּ kihalisi ni ‘walilofanya,’ kwa Kiswahili shimo huchimbwa. Tafsiri hii ni ya kawaida na inadumisha kejeli kwamba wameanguka katika shimo walilolitengeneza wenyewe.
- source_word: בְּרֶשֶׁת
  choice: katika wavu
  rationale: ‘Katika wavu’ kinahifadhi picha halisi ya chombo cha kunasia na ulinganifu wake na shimo.
- source_word: זוּ טָמָנוּ
  choice: waliouficha
  rationale: זוּ ni kiunganishi cha uhusiano, na טָמָנוּ humaanisha kuficha au kuweka kwa siri. ‘Waliouficha’ ni kifupi na cha kawaida.
- source_word: נִלְכְּדָה
  choice: umenaswa
  rationale: Kauli ya kutendwa inahifadhiwa, nayo hali timilifu inaonyesha matokeo yaliyotokea na yanayoonekana sasa.
- source_word: רַגְלָם
  choice: mguu wao wenyewe
  rationale: Kiebrania kina umoja ‘mguu wao.’ ‘Wenyewe’ linaonyesha kejeli ya wao kunaswa na mtego wao bila kubadili umoja wa picha.
