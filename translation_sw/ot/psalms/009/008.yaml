  text: And he will judge the world in righteousness[b][a]; he will govern the peoples with fairness.
translation:
  language: sw
  text: Naye atauhukumu ulimwengu[a] kwa haki; atayahukumu mataifa kwa usawa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulimwengu unaokaliwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa uadilifu” au “kwa unyoofu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Naye
  rationale: Kiunganishi pamoja na kiwakilishi kinaendeleza wazo na kumkazia mhusika kwa kiasi; “Naye” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: יִשְׁפֹּט
  choice: atauhukumu
  rationale: Kitenzi שׁפט kina maana ya kutoa hukumu au kutawala kwa mamlaka ya kimahakama; wakati ujao unafaa tamko hili la kishairi.
- source_word: תֵּבֵל
  choice: ulimwengu
  rationale: Neno hili mara nyingi humaanisha ulimwengu unaokaliwa, si ardhi kama kitu cha kimaumbile tu. “Ulimwengu” ni la kawaida na linaonyesha upeo wa wote.
- source_word: בְּצֶדֶק
  choice: kwa haki
  rationale: צדק inaonyesha kiwango na namna ya hukumu. “Kwa haki” huhifadhi uzito wa kimaadili wa nomino hiyo kwa Kiswahili cha kawaida.
- source_word: יָדִין
  choice: atawahukumu
  rationale: דין hapa ni kutoa hukumu au kuamua kwa mamlaka. Kurudia “hukumu” kunahifadhi ulinganifu wa kishairi na maana ya kimahakama, ingawa Kiebrania kinatumia kitenzi tofauti na kile cha mstari wa kwanza.
- source_word: לְאֻמִּים
  choice: watu wa mataifa
  rationale: לאמים hurejelea makundi ya watu au mataifa kwa pamoja. “Watu wa mataifa” huepuka kuifanya dhana hii iwe tu nchi za kisasa na hufanya kiambishi cha yambwa katika “atawahukumu” kiwe cha asili.
- source_word: בְּמֵישָׁרִים
  choice: kwa uadilifu
  rationale: מישרים humaanisha unyoofu, usawa, au kutopendelea katika kutoa hukumu. “Kwa uadilifu” ni wazi, cha sasa, na kinafaa muktadha wa hukumu.
theological_decisions:
- issue: Utawala wa Mungu wa kuhukumu wanadamu wote
  choice: Mstari unasema kuwa Mungu atauhukumu ulimwengu na watu wa mataifa yote kwa haki na uadilifu, bila kuweka ratiba maalumu ya matukio ya mwisho.
  alternative: Vitenzi vinaweza kueleweka kuwa vinaeleza utawala wake unaoendelea sasa au hukumu maalumu ya mwisho.
  rationale: Vitenzi vya Kiebrania katika umbo la yiqtol, hasa katika ushairi, vinaweza kueleza tendo la wakati ujao au tendo la kawaida linalomtambulisha mhusika. Tafsiri ya wakati ujao inafaa muktadha, lakini haifungi maana katika mpangilio fulani wa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vipande viwili na ulinganifu wa kishairi umehifadhiwa; maneno “haki” na “uadilifu” yanatofautisha צדק na מישרים bila kudai kwamba maana zake hazipishani.
