  text: אוֹדֶ֣ה יְ֭הוָה בְּ/כָל לִבִּ֑/י אֲ֝סַפְּרָ֗ה כָּל נִפְלְאוֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/001.yaml
  text: I will give thanks to Yahweh with all my heart[a]; I will recount all your wondrous deeds.
translation:
  language: sw
  text: Nitamshukuru Yahweh kwa moyo wangu wote; nitasimulia matendo yako yote ya ajabu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “maajabu yako yote” au “kazi zako zote za ajabu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדֶה
  choice: Nitamshukuru
  rationale: Katika kauli hii, kitenzi ידה katika Hifili kinaonyesha kumshukuru au kumsifu Mungu katika ibada. “Nitamshukuru” kinaendeleza wazi wazo la shukrani huku kikibaki cha asili katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetafsiriwa kwa kulitamka kama jina binafsi, badala ya kulibadilisha kuwa cheo kama “BWANA.” Tahajia “Yahwe” ni ya kawaida na rahisi kusomeka katika Kiswahili.
- source_word: בְּכָל לִבִּי
  choice: kwa moyo wangu wote
  rationale: Hii ni nahau ya Kiebrania inayoonyesha shukrani ya dhati na isiyogawanyika. Usemi huu ni wa kawaida katika Kiswahili na unahifadhi nguvu ya כָּל, “wote.”
- source_word: אֲסַפְּרָה
  choice: nitasimulia
  rationale: Kitenzi ספר hapa kina maana ya kueleza au kusimulia matendo yaliyotendeka. “Nitasimulia” kinafaa kwa ushuhuda wa mtunga zaburi kuhusu matendo ya Mungu.
- source_word: כָּל
  choice: wote / yote
  rationale: 'Neno limehifadhiwa wazi katika sehemu zote mbili za mstari: “moyo wangu wote” na “matendo yako yote,” ili kuonyesha ukamilifu unaosisitizwa na Kiebrania.'
- source_word: נִפְלְאוֹתֶיךָ
  choice: matendo yako yote ya ajabu
  rationale: Nomino inayotokana na פלא inaweza kumaanisha maajabu yenyewe au matendo ya ajabu ya Mungu. Tafsiri hii ni ya asili katika Kiswahili na inaonyesha kuwa kinachosimuliwa ni mambo ya kushangaza aliyoyatenda Mungu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” linahifadhi jina hilo badala ya kulibadilisha kuwa cheo; “Yehova” ni namna nyingine ya kimapokeo ya kulitamka.
- issue: Maana ya נִפְלְאוֹתֶיךָ
  choice: matendo yako yote ya ajabu
  alternative: maajabu yako yote
  rationale: Kiebrania kinaweza kueleweka kwa upana kama “maajabu yako” au kwa kuonyesha wazi matendo yanayoleta mshangao. Maandishi makuu yanatumia usemi wa kimatendo, huku tanbihi ikihifadhi uwezekano mwingine bila kuufuta.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mpangilio sambamba wa vipashio viwili vya Kiebrania umehifadhiwa kwa kutumia nusu-koloni.
