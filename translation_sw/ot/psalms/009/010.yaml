  text: וְ/יִבְטְח֣וּ בְ֭/ךָ יוֹדְעֵ֣י שְׁמֶ֑/ךָ כִּ֤י לֹֽא עָזַ֖בְתָּ דֹרְשֶׁ֣י/ךָ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/010.yaml
  text: And those who know your name will trust in you[a], for you, O Yahweh[c][b], have not forsaken those who seek you.
translation:
  language: sw
  text: Nao wanaolijua jina lako[a] watakutumaini, kwa maana wewe, Ee Yahweh,[b] hujawaacha[c] wale wanaokutafuta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kulijua jina lako” hapa kunamaanisha zaidi ya kulifahamu tu jina; kunahusisha kuijua tabia na sifa za Mungu alizozifunua.
    reason: cultural_note
  - marker: b
    text: Kiebrania YHWH, jina la Mungu ambalo kwa desturi limetafsiriwa “BWANA.”
    reason: alternative_reading
  - marker: c
    text: 'Au: “hujawatelekeza.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִבְטְחוּ בְךָ
  choice: Nao ... watakutumaini
  rationale: Kitenzi בטח pamoja na ב huonyesha kumtegemea mtu kwa uhakika. Wakati usiotimilika hapa unaeleweka kwa maana ya wakati ujao, na וְ linaendeleza wazo la mstari uliotangulia.
- source_word: יֹדְעֵי שְׁמֶךָ
  choice: wanaolijua jina lako
  rationale: Muundo wa kitenzi-jina unaeleza kundi linalotambulishwa na kulijua jina la Mungu. Tafsiri ya moja kwa moja inahifadhi maana pana ya jina kama tabia na sifa zilizofunuliwa.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya wao kumtumaini Mungu.
- source_word: לֹא עָזַבְתָּ
  choice: hujawaacha
  rationale: עזב inaweza kumaanisha kuacha au kutelekeza. Kiswahili hiki ni cha kawaida na kinahifadhi hali timilifu yenye matokeo yanayoendelea hadi sasa.
- source_word: דֹּרְשֶׁיךָ
  choice: wale wanaokutafuta
  rationale: דרש ikimhusu Mungu kwa kawaida humaanisha kumtafuta kwa ibada, sala, au kujitoa kwake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa kwa tahajia ya Kiswahili kama “Yahwe,” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Maana ya “kulijua jina” la Mungu
  choice: Maneno halisi “wanaolijua jina lako” yamehifadhiwa, huku maelezo yakitolewa katika tanbihi.
  alternative: wanaoijua tabia yako
  rationale: Neno שֵׁם ni “jina,” lakini hapa linabeba pia maana ya tabia na sifa za Mungu zilizofunuliwa. Kulifafanua ndani ya mstari kungepunguza mwangwi wake wa kibiblia.
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi YHWH. Kulitaja kama “Yahwe” kunahifadhi tofauti kati ya jina hilo na cheo “Bwana.”
- issue: Nguvu ya לֹא עָזַבְתָּ
  choice: hujawaacha
  alternative: hujawatelekeza
  rationale: “Hujawaacha” huhifadhi upana wa עזב bila kulazimisha kiwango kikali zaidi cha “kutelekeza”; mbadala huo umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. “Nao” linaunganisha mstari na muktadha uliotangulia; “Ee Yahwe” linahifadhi wito wa moja kwa moja wa Kiebrania.
