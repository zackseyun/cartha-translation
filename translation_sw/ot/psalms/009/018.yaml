base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/018.yaml
  text: For the needy will not be forgotten forever[b][a]; the hope of the afflicted will not perish forever.
translation:
  language: sw
  text: Kwa maana mhitaji hatasahauliwa milele; tumaini la wanaoteseka[a] halitaangamia kamwe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanyenyekevu” au “wapole” kwa neno la Kiebrania ענוים.
    reason: lexical_alternative
  - marker: b
    text: Ushairi wa Kiebrania hapa unatumia misemo miwili inayokaribiana, “milele” na “kamwe,” kusisitiza kwamba wahitaji hawataachwa kabisa.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza msingi wa uhakikisho uliotangulia kwa kiunganishi cha kawaida na cha asili katika Kiswahili.
- source_word: לָנֶצַח
  choice: milele
  rationale: Ni usemi wa muda unaoonyesha kutodumu kwa kusahauliwa huko bila mwisho.
- source_word: יִשָּׁכַח
  choice: hatasahauliwa
  rationale: Inahifadhi kauli tendwa ya Kiebrania bila kumtaja Mungu waziwazi kuwa mtendaji.
- source_word: אֶבְיוֹן
  choice: mhitaji
  rationale: Inaonyesha mtu aliye katika uhitaji au umaskini, bila kuufanya maana hiyo ihusu hali ya kiuchumi peke yake.
- source_word: תִּקְוַת
  choice: tumaini la
  rationale: Inawakilisha kwa kawaida muundo wa neno tegemezi unaoliunganisha tumaini na kundi linalofuata.
- source_word: ענוים
  choice: wanaoteseka
  rationale: Katika usambamba na 'mhitaji,' chaguo hili linatanguliza hali ya kuonewa au kuteseka, huku tanbihi ikihifadhi maana mbadala za unyenyekevu na upole.
- source_word: תֹּאבַד
  choice: halitapotea
  rationale: Kitenzi אבד kina maana ya kupotea au kuangamia; Kiswahili kinaweka wazi ukanushi unaoeleweka kwa ellipsisi kutoka kishazi cha kwanza.
- source_word: לָעַד
  choice: daima
  rationale: Ni usemi unaokaribiana na לָנֶצַח; kutumia neno tofauti la Kiswahili kunahifadhi usambamba wa misemo miwili ya Kiebrania bila kubadili mkazo wake.
theological_decisions:
- issue: Mtendaji asiyeelezwa katika 'hatasahauliwa'
  choice: Kauli tendwa imehifadhiwa, hivyo Mungu anaeleweka katika muktadha bila kutajwa kama kiima cha kisarufi.
  alternative: Mungu hatamsahau mhitaji milele.
  rationale: Kiebrania hakimtaji mtendaji moja kwa moja. Kauli tendwa huhifadhi umbo la kishairi na huepuka kuongeza kiima kisichotamkwa.
- issue: Maana ya ענוים
  choice: wanaoteseka
  alternative: wanyenyekevu; wapole
  rationale: Neno linaweza kueleza hali ya mateso au tabia ya unyenyekevu. Usambamba wake na 'mhitaji' unaifanya hali ya shida ionekane zaidi, bila kufuta maana nyingine zinazowekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inahifadhi kauli tendwa na usambamba wa kishairi; 'mhitaji' ni ya kawaida na pana, na 'wanaoteseka' inaeleweka kwa wasomaji wa kawaida.
