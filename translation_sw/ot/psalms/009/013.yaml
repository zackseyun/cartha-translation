  text: חָֽנְנֵ֬/נִי יְהוָ֗ה רְאֵ֣ה עָ֭נְיִ/י מִ/שֹּׂנְאָ֑/י מְ֝רוֹמְמִ֗/י מִ/שַּׁ֥עֲרֵי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/013.yaml
  text: Be gracious to me[a], O Yahweh; see my affliction from those who hate me[b], you who lift me up from the gates of death.
translation:
  language: sw
  text: Unirehemu[a], Ee Yahweh; uone dhiki yangu itokayo kwa wanaonichukia, wewe unayeniinua kutoka malango ya kifo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Unifanyie fadhili.”
    reason: lexical_alternative
  - marker: b
    text: “Malango ya kifo” ni picha ya Kiebrania ya kuwa kwenye ukingo wa kufa au chini ya mamlaka ya kifo.
    reason: cultural_note
lexical_decisions:
- source_word: חָנְנֵנִי
  choice: Nionee neema
  rationale: Kauli ya kuomba kutoka חנן inaomba fadhili au neema. “Nionee neema” ni ombi la kawaida na lenye heshima, huku “nirehemu” likibaki kuwa tafsiri mbadala inayowezekana.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: רְאֵה
  choice: uione
  rationale: Ni amri ya moja kwa moja inayomwomba Mungu atazame na kuzingatia hali ya mwombaji. Kiambishi cha yambwa kinaifanya sentensi iwe ya kawaida kwa Kiswahili.
- source_word: עָנְיִי
  choice: dhiki yangu
  rationale: עֳנִי hueleza hali ya kuonewa, kuteseka, au kuwa katika taabu. “Dhiki yangu” ni fupi, ya heshima, na haibainishi kupita kiasi aina ya mateso.
- source_word: מִשֹּׂנְאַי
  choice: ninayosababishiwa na wanaonichukia
  rationale: Kihusishi מִן kinaeleweka hapa kama chanzo au watendaji wa dhiki. Muundo huu unaonyesha kwa Kiswahili cha kawaida kuwa dhiki hiyo inatoka kwa wale wanaomchukia mtunga zaburi.
- source_word: מְרוֹמְמִי
  choice: wewe unayeniinua
  rationale: Kivumishi-tendo cha רום chenye kiambishi cha nafsi ya kwanza kinamtaja Yahweh kwa mwito kama yule anayemwinua mwombaji.
- source_word: מִשַּׁעֲרֵי מָוֶת
  choice: kutoka katika malango ya kifo
  rationale: Hii inadumisha moja kwa moja picha ya Kiebrania ya kuwa kwenye ukingo au chini ya mamlaka ya kifo bila kuingiza Sheoli, neno ambalo halipo katika mstari huu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni; kulitaja “Yahweh” kunadumisha jina la pekee badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa kisarufi wa מִשֹּׂנְאַי
  choice: Imeunganishwa na “dhiki yangu” kama chanzo au watendaji wa dhiki
  alternative: 'Kuisoma kwa uhusiano usio wa moja kwa moja: “uione dhiki yangu; [uwaone] wanaonichukia”'
  rationale: Mfuatano wa Kiebrania unaeleweka kwa urahisi zaidi kuwa Yahweh anaombwa aione dhiki inayotokana na wanaomchukia mwombaji; hakuna haja ya kuongeza amri ya pili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sala na picha halisi ya “malango ya kifo” vimedumishwa, huku uhusiano wa dhiki na wanaomchukia mwombaji ukielezwa kwa Kiswahili kinachoeleweka kwa urahisi.
