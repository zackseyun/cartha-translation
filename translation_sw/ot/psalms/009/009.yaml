  text: And Yahweh will be a stronghold for the oppressed[b][a], a stronghold in times of trouble.
translation:
  language: sw
  text: Yahweh atakuwa ngome[a] kwa aliyekandamizwa[b], ngome katika nyakati za taabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali pa kukimbilia” au “kimbilio lililo juu”; neno la Kiebrania linaonyesha mahali pa ulinzi salama, palipo juu.
    reason: lexical_alternative
  - marker: b
    text: Au “aliyepondwa” au “aliyedhulumiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי
  choice: Naye ... atakuwa
  rationale: Muundo huu unaeleweka hapa kwa maana ya kutangaza hali ya wakati ujao, huku kiunganishi kikihifadhi mwendelezo wa kishairi. Ingawa maana ya ombi, ‘na awe,’ inawezekana kisarufi, muktadha wa zaburi unaunga mkono zaidi tamko.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kwa cheo.
- source_word: מִשְׂגָּב
  choice: ngome
  rationale: Neno hili humaanisha mahali salama, palipoinuka na pasipofikika kwa urahisi. ‘Ngome’ huwasilisha ulinzi na usalama, na limerudiwa ili kuhifadhi msisitizo wa kishairi.
- source_word: לַדָּךְ
  choice: kwa aliyekandamizwa
  rationale: דך humweleza mtu aliyepondwa, aliyeshushwa, au aliyekandamizwa. Umoja wa kisarufi umehifadhiwa, huku usemi huo ukibaki wa kawaida na kueleweka.
- source_word: לְעִתּוֹת
  choice: nyakati za
  rationale: Wingi wa neno unaonyesha vipindi au nyakati zinazoweza kujirudia; Kiswahili cha asili husema ‘nyakati za.’
- source_word: בַּצָּרָה
  choice: taabu
  rationale: Neno linaonyesha dhiki, shida, au hali ya kusongwa. ‘Taabu’ ni neno la kawaida, lenye hadhi, na linafaa katika msemo ‘nyakati za taabu.’
theological_decisions:
- issue: Namna ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; kwa hiyo ‘Yahwe’ huhifadhi tofauti hiyo.
- issue: Nguvu ya kitenzi וִיהִי
  choice: atakuwa
  alternative: na awe
  rationale: Kitenzi kinaweza kueleweka kama tamko au ombi. Hapa kimetafsiriwa kama tamko la wakati ujao kulingana na mtiririko wa zaburi, bila kukana uwezekano wa maana ya ombi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya ‘ngome’ yamehifadhiwa kwa sababu ni sehemu ya msisitizo na usambamba wa kishairi wa mstari.
