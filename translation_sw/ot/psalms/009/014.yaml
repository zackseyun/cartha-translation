lexical_decisions:
- source_word: לְמַעַן
  choice: ili
  rationale: Huonyesha kusudi au matokeo kwa Kiswahili cha kawaida na kuhifadhi nguvu ya kishazi cha kusudi.
- source_word: אֲסַפְּרָה
  choice: niyasimulie
  rationale: Kitenzi ספר katika piel humaanisha kusimulia au kutangaza kwa mpangilio; umbo la utegemezi linaendana na “ili.”
- source_word: כָּל תְּהִלָּתֶיךָ
  choice: sifa zako zote
  rationale: Huhifadhi wingi na wazo la sifa zote zinazomhusu au anazostahili Mungu kwa lugha ya kawaida.
- source_word: בְּשַׁעֲרֵי
  choice: malangoni mwa
  rationale: Huhifadhi picha ya malango kama mahali pa hadhara, mkusanyiko, na shughuli za jamii.
- source_word: בַת צִיּוֹן
  choice: Binti Sayuni
  rationale: Huhifadhi jina la kishairi linalouhuisha Sayuni au Yerusalemu kama mtu wa kike.
- source_word: אָגִילָה
  choice: nitashangilia
  rationale: Huonyesha furaha kuu ya wazi; wakati ujao unasomeka kwa kawaida huku ukihifadhi azimio la msemaji.
- source_word: בִּישׁוּעָתֶךָ
  choice: katika wokovu wako
  rationale: “Wokovu” huhifadhi upana wa ישועה, ambao unaweza kumaanisha kuokolewa katika hatari iliyopo na pia wokovu kwa maana pana.
theological_decisions:
- issue: Maana ya ישועה
  choice: wokovu
  alternative: uokozi
  rationale: “Wokovu” huhifadhi upana wa kitheolojia wa neno bila kufuta maana ya karibu ya kuokolewa kutoka hatarini; “uokozi” umetajwa katika tanbihi kama uwezekano wa maana halisi zaidi katika muktadha huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa mistari unahifadhi usambamba wa zaburi; “Binti Sayuni” huhifadhi taswira ya Kiebrania bila kuifafanua kupita kiasi.
