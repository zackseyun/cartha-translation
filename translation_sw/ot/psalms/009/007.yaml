  yaml_path: translation/ot/psalms/009/007.yaml
  text: But Yahweh sits enthroned forever[b][a]; he has established his throne for judgment.
translation:
  language: sw
  text: Lakini Yahweh anaketi milele; amekiimarisha kiti chake cha enzi kwa ajili ya hukumu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Au: “amekitayarisha kiti chake cha enzi kwa ajili ya haki.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיהוָה
  choice: Lakini Yahweh
  rationale: Kiunganishi וַ kimetafsiriwa kwa maana ya upinzani kulingana na muktadha unaotofautisha kuanguka kwa waovu na utawala wa Yahweh unaodumu; jina la agano יְהוָה limeandikwa Yahweh.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Huwasilisha kwa lugha ya kawaida dhana ya muda usio na mwisho.
- source_word: יֵשֵׁב
  choice: anaketi katika kiti cha enzi
  rationale: Kitenzi chenyewe ni 'anaketi,' lakini kutajwa kwa kiti cha enzi katika kishazi kinachofuata kunaonyesha muktadha wa kifalme na kimahakama; tafsiri hii inafanya maana hiyo iwe wazi bila kuondoa taswira ya kuketi.
- source_word: כּוֹנֵן
  choice: amekiimarisha
  rationale: Umbo la polel lina maana ya kufanya kitu kiwe imara au kukithibitisha; 'amekiimarisha' huhifadhi wazo la uthabiti wa kiti cha enzi.
- source_word: לַמִּשְׁפָּט
  choice: kwa ajili ya hukumu
  rationale: מִשְׁפָּט hapa ina maana ya shughuli ya kutoa hukumu kutoka katika kiti cha enzi, ingawa pia inaweza kueleweka kuwa haki.
- source_word: כִּסְאוֹ
  choice: kiti chake cha enzi
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye kiambishi cha umilikaji.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; kulinakili kama 'Yahweh' hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo.
- issue: Maana ya kifalme katika יֵשֵׁב
  choice: anaketi katika kiti cha enzi
  alternative: anaketi
  rationale: Muktadha wa kiti cha enzi na hukumu unaonyesha kuketi kwa mfalme na hakimu, lakini tanbihi inadumisha uwazi kwamba Kiebrania kinasema tu 'anaketi'.
- issue: Upeo wa maana ya מִשְׁפָּט
  choice: hukumu
  alternative: haki
  rationale: Taswira ya kiti cha enzi inaunga mkono tendo la kuhukumu, lakini neno linaweza pia kuonyesha haki; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa sentensi ni wa kawaida kwa msomaji wa leo, huku taswira ya kifalme, maana ya kimahakama, na uwezekano wa tafsiri nyingine vikihifadhiwa kwa tanbihi.
