lexical_decisions:
- source_word: אֶשְׂמְחָה
  choice: Nitafurahi
  rationale: Kitenzi שׂמח huonyesha furaha; “nitafurahi” ni Kiswahili cha kawaida na kinahifadhi mwelekeo wa nafsi ya kwanza wa kufanya hivyo.
- source_word: וְאֶעֶלְצָה
  choice: na kushangilia
  rationale: Kitenzi עלץ huonyesha furaha kubwa ya wazi. “Kushangilia” kinatofautisha nguvu yake na “kufurahi” bila kutumia lugha ngumu.
- source_word: בָךְ
  choice: ndani yako
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya Mungu kuwa kiini au mazingira ya furaha, huku tanbihi ikionyesha maana mbadala ya kisababishi.
- source_word: אֲזַמְּרָה
  choice: nitaliimbia ... sifa
  rationale: Katika muundo huu זמר humaanisha kuimba kwa kusifu; mpangilio huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: שִׁמְךָ
  choice: jina lako
  rationale: Neno halisi “jina” limehifadhiwa, likirejelea Mungu mwenyewe kama anavyojidhihirisha na kujulikana.
- source_word: עֶלְיוֹן
  choice: Ee Uliye Juu Sana
  rationale: Ni lakabu ya Mungu na hapa ni mwito wa moja kwa moja. “Uliye Juu Sana” ni tafsiri ya asili na yenye hadhi katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya lakabu ya Mungu עֶלְיוֹן
  choice: Ee Uliye Juu Sana
  alternative: Aliye Juu Sana
  rationale: Muktadha unaonyesha kuwa mtunga zaburi anamwambia Mungu moja kwa moja; “Ee” huweka wazi mwito huo bila kuongeza fundisho la kimadhehebu.
- issue: Maana ya בָךְ kuhusiana na furaha
  choice: ndani yako
  alternative: kwa sababu yako
  rationale: “Ndani yako” huhifadhi kwa karibu taswira ya Kiebrania ya furaha inayomlenga Mungu; tanbihi inadumisha uwezekano wa kuelewa Mungu kuwa sababu ya furaha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kishairi lakini unaeleweka kwa msomaji wa kawaida; marudio ya vitenzi viwili vya furaha yamehifadhiwa.
