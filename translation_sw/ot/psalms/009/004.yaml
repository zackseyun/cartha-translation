  yaml_path: translation/ot/psalms/009/004.yaml
  text: For you have upheld my justice and my cause[a]; you sat on the throne[b], judging righteously.
translation:
  language: sw
  text: Kwa maana umeitetea haki yangu na shauri langu[a]; umeketi kwenye kiti cha enzi, ukihukumu kwa haki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umethibitisha haki yangu na dai langu,” au “umetenda hukumu kwa ajili ya haki yangu na shauri langu.” Kiebrania kinatumia maneno mawili yanayohusiana na sheria kueleza kuthibitishwa kwa haki ya mtu katika kesi.
    reason: lexical_alternative
  - marker: b
    text: Au “ukihukumu kwa uadilifu.” Neno la Kiebrania ni nomino “haki,” lakini hapa linaeleza namna Mungu anavyohukumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya sifa iliyotangulia; “kwa maana” kinaonyesha wazi uhusiano huo wa kisababu.
- source_word: עָשִׂיתָ מִשְׁפָּטִי וְדִינִי
  choice: umenitendea haki katika shauri langu
  rationale: Kitenzi עָשָׂה pamoja na maneno haya mawili ya kisheria kinaeleza kutekeleza hukumu au kuthibitisha haki ya mtu. Kiswahili hiki ni cha kawaida na kinahifadhi picha ya Mungu anayempa mtunga zaburi haki katika shauri lake.
- source_word: יָשַׁבְתָּ לְכִסֵּא
  choice: umeketi kwenye kiti cha enzi
  rationale: Kirai hiki kinaonyesha Mungu akiwa ameketi katika nafasi ya mfalme na mwamuzi. “Kiti cha enzi” kinahifadhi picha ya kifalme, huku “kwenye” kikitoa Kiswahili cha kawaida.
- source_word: שׁוֹפֵט
  choice: ukihukumu
  rationale: Kirai cha hali kinaendeleza nguvu ya kauli ya participle ya Kiebrania na kumwonyesha Mungu akitenda kama mwamuzi akiwa ameketi.
- source_word: צֶדֶק
  choice: kwa haki
  rationale: Ingawa ni nomino “haki,” hapa inatumiwa kueleza namna ya kuhukumu. “Kwa haki” ni Kiswahili cha asili na kinadumisha uhusiano wake na uadilifu.
theological_decisions:
- issue: Taswira ya Mungu kama mwamuzi
  choice: Mungu anaonyeshwa akiwa kwenye kiti cha enzi, akimpatia mtunga zaburi haki katika shauri lake.
  alternative: Kauli ya jumla tu kwamba Mungu amemtendea mtunga zaburi mema.
  rationale: Msamiati wa kisheria מִשְׁפָּט na דִּין, pamoja na kiti cha enzi na kuhukumu, unahitaji taswira ya wazi ya hukumu bila kuingiza mfumo wa baadaye wa kimadhehebu.
- issue: Uhusiano wa מִשְׁפָּטִי na דִינִי
  choice: Kutafsiri jozi hiyo kwa Kiswahili cha kawaida kama “haki katika shauri langu.”
  alternative: “hukumu yangu na dai langu” au “haki yangu na shauri langu.”
  rationale: Maneno hayo mawili yana nyanja zinazokaribiana za haki, hukumu, dai, na shauri. Tafsiri kuu inaonyesha kuthibitishwa kwa haki katika kesi, huku tanbihi ikihifadhi uwezekano wa kuyatenganisha zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Shauri” na “kuhukumu” huhifadhi mazingira ya kisheria bila kuwa ya kitaalamu kupita kiasi; “kiti cha enzi” huhifadhi taswira ya kifalme iliyo katika Kiebrania.
