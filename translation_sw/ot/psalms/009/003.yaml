translation:
  language: sw
  text: 'Adui zangu wanaporudi nyuma,

    wanajikwaa na kuangamia mbele zako.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika uwepo wako”; kihalisi, “kutoka mbele ya uso/uwepo wako.”
