lexical_decisions:
- source_word: בְּשׁוּב
  choice: wanaporudi
  rationale: Herufi ב pamoja na kitenzi-jina cha שוב huanzisha kishazi cha wakati; “wanaporudi” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: אוֹיְבַי
  choice: adui zangu
  rationale: Nomino אויב yenye kiambishi cha nafsi ya kwanza umoja humaanisha moja kwa moja “adui zangu.”
- source_word: אָחוֹר
  choice: nyuma
  rationale: Neno hili linatumika kama kielezi pamoja na שוב na kuonyesha kurudi au kukimbilia upande wa nyuma.
- source_word: יִכָּשְׁלוּ
  choice: wanajikwaa
  rationale: Umbo la Nifali la כשל lina picha ya kujikwaa au kuyumba; “wanajikwaa” haiharakishi kuifanya maana kuwa kuanguka kabisa.
- source_word: וְיֹאבְדוּ
  choice: na kuangamia
  rationale: Kitenzi אבד katika Qal kinaweza kumaanisha kuangamia au kuharibiwa; “kuangamia” kinafaa katika usambamba wa kishairi bila kubainisha kupita kiasi namna ya mwisho wao.
- source_word: מִפָּנֶיךָ
  choice: mbele zako
  rationale: Kirai hiki kihalisi ni “kutoka mbele ya uso/uwepo wako.” “Mbele zako” ni cha asili katika Kiswahili na kinahifadhi maana ya mahali na uhusiano bila kufafanua utendaji wa Mungu kupita maandishi.
theological_decisions:
- issue: Utendaji wa Mungu katika kuanguka kwa adui
  choice: Mstari unasema adui wanajikwaa na kuangamia mbele za Mungu bila kueleza zaidi jinsi hukumu hiyo inavyotendeka.
  alternative: Mungu anawaangamiza moja kwa moja, au wanaanguka kwa sababu tu ya kukutana na uwepo wake.
  rationale: Kiebrania kinasema wanaangamia “kutoka/mbele ya uso au uwepo” wa Mungu. Tafsiri inadumisha uzito huo wa kitheolojia lakini haiamui utaratibu ambao maandishi hayajaueleza wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa mistari unahifadhi mwendo wa usambamba wa Kiebrania.
