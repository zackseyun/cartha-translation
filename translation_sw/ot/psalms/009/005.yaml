  yaml_path: translation/ot/psalms/009/005.yaml
  text: You rebuked nations[a]; you destroyed the wicked[b]; you blotted out their name forever and ever.
translation:
  language: sw
  text: Umeyakemea mataifa; umewaangamiza waovu[a]; umelifuta jina lao[b] milele na milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni umoja, “mwovu,” lakini kinaweza kumaanisha waovu kama kundi.
    reason: alternative_reading
  - marker: b
    text: Kihalisi, “jina lao”; katika muktadha, hii inaweza kumaanisha kuondolewa kwa kumbukumbu au sifa yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּעַרְתָּ
  choice: umeyakemea
  rationale: Kitenzi גער huonyesha kukemea kwa nguvu na kwa mamlaka. “Umeyakemea” ni lugha ya kawaida na huhifadhi tendo la moja kwa moja bila kuongeza matokeo yasiyotajwa.
- source_word: גּוֹיִם
  choice: mataifa
  rationale: Katika muktadha huu wa hukumu, גוים hurejelea mataifa kama makundi ya watu. “Mataifa” ni tafsiri ya kawaida na haileti utofautishaji wa baadaye unaoweza kudokezwa na “Mataifa” kwa maana ya kidini.
- source_word: אִבַּדְתָּ
  choice: umewaangamiza
  rationale: Hali ya piel ya אבד ina maana ya kusababisha kuangamia au kuharibu kabisa. “Umewaangamiza” ina nguvu inayofaa muktadha wa hukumu.
- source_word: רָשָׁע
  choice: waovu
  rationale: Ingawa neno la Kiebrania liko katika umoja, linaweza kutumiwa kwa maana ya kundi au tabaka. “Waovu” linapatana na “mataifa” na kiwakilishi cha wingi katika “jina lao,” huku uwezekano wa maana ya mtu mmoja ukihifadhiwa katika tanbihi.
- source_word: שְׁמָם
  choice: jina lao
  rationale: Hii ndiyo maana ya moja kwa moja ya Kiebrania. Katika muktadha, jina linaweza kumaanisha kumbukumbu au sifa yao, lakini picha ya asili imehifadhiwa katika matini.
- source_word: מָחִיתָ
  choice: umelifuta
  rationale: Kitenzi מחה humaanisha kufuta au kuondoa kabisa, hasa jina au kumbukumbu. “Umelifuta” ni cha asili katika Kiswahili na huhifadhi picha ya kuondoa jina.
- source_word: לְעוֹלָם וָעֶד
  choice: milele na milele
  rationale: Usemi huu wa jozi unasisitiza muda usio na mwisho; “milele na milele” huhifadhi msisitizo huo kwa Kiswahili cha kawaida cha kibiblia.
theological_decisions:
- issue: Maana ya pamoja au ya mtu mmoja katika רָשָׁע
  choice: 'Maana ya pamoja: “waovu”'
  alternative: 'Maana ya mtu mmoja: “mwovu”'
  rationale: Nomino/kivumishi hiki cha umoja kinaweza kuwakilisha kundi zima. Kutajwa kwa mataifa na kisha “jina lao” kunaunga mkono maana ya pamoja, lakini umoja wa kisarufi unaruhusu tafsiri nyingine, ambayo imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Miundo “umeyakemea,” “umewaangamiza,” na “umelifuta” inadumisha mfuatano wa matendo yaliyokamilika, huku “milele na milele” ikihifadhi uzito wa kishairi wa Zaburi.
