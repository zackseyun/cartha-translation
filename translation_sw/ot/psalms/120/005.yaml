base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/005.yaml
  text: Woe to me[a], for I have sojourned in Meshech[b]; I have dwelt among the tents of Kedar.
translation:
  language: sw
  text: Ole wangu[a], kwa maana nimeishi kama mgeni huko Mesheki; nimekaa kati ya mahema ya Kedari[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Majina Mesheki na Kedari huenda yametumiwa kishairi kumaanisha watu wa mbali na wenye uhasama, badala ya kuonyesha kwamba mtunga zaburi aliishi kihalisi katika sehemu zote mbili kwa wakati mmoja.
    reason: cultural_note
  - marker: b
    text: Au, “pamoja na mahema ya Kedari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹיָה לִי
  choice: Ole wangu
  rationale: Ni tamko la huzuni na dhiki linalomhusu msemaji binafsi; ‘Ole wangu’ ni Kiswahili cha kawaida, kizito, na chenye ufupi wa kishairi.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha sababu ya kilio kilichotangulia na kuhifadhi uhusiano wa kisababishi.
- source_word: גַרְתִּי
  choice: nimeishi kama mgeni
  rationale: Kitenzi גור kinaashiria kukaa kama mgeni au mtu asiye mwenyeji, si kuishi tu; tafsiri hii huonyesha hali hiyo wazi kwa msomaji wa sasa.
- source_word: מֶשֶׁךְ
  choice: Mesheki
  rationale: Jina la pekee limeandikwa kwa umbo linalofaa matamshi ya Kiswahili, bila kulibadili kuwa tafsiri ya kijiografia au ya kiishara.
- source_word: שָׁכַנְתִּי
  choice: nimekaa
  rationale: שכן humaanisha kukaa au kuishi mahali; ‘nimekaa’ ni ya asili katika Kiswahili na inatofautishwa na wazo mahususi la kuishi kama mgeni katika mstari wa kwanza.
- source_word: עִם אָהֳלֵי
  choice: kati ya mahema ya
  rationale: עִם kimsingi ni ‘pamoja na,’ lakini katika muktadha wa makao, ‘kati ya mahema’ huwasilisha kwa Kiswahili kuishi miongoni mwa watu huku ikihifadhi taswira halisi ya mahema.
- source_word: קֵדָר
  choice: Kedari
  rationale: Jina la pekee limehifadhiwa kwa umbo la Kiswahili, likidumisha taswira ya kihistoria na kishairi ya watu waliokaa mahemani.
theological_decisions:
- issue: Ikiwa Mesheki na Kedari yatafsiriwe kama majina halisi au yawekwe wazi kuwa ishara za watu wa mbali na wenye uhasama.
  choice: Kuhifadhi majina Mesheki na Kedari katika matini kuu.
  alternative: Kutafsiri kwa ujumla kama watu wa mbali na wenye uhasama.
  rationale: Kiebrania hutaja majina haya moja kwa moja. Kuyahifadhi kunadumisha taswira ya kihistoria na kishairi na pia kutatua kimyakimya hali ya uwezekano wa matumizi ya kitamathali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. ‘Ole wangu’ huhifadhi uzito wa kilio; ‘nimeishi kama mgeni’ huweka wazi maana ya גור bila kutumia msamiati wa kizamani. Alama zote za tanbihi zimewekwa katika matini kuu.
