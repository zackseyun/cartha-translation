  text: I am for peace[a]; but when I speak[b], they are for war.
translation:
  language: sw
  text: Mimi ni wa amani[a]; lakini ninaposema[b], wao ni wa vita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “Mimi—amani”; hapa maana yake ni “Mimi ni wa amani.”
    reason: lexical_alternative
  - marker: b
    text: Au “na ninaposema”; kiunganishi cha Kiebrania kinaweza kutafsiriwa kwa njia hiyo rahisi, lakini muktadha unapendelea maana ya utofautishaji.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: Mimi
  rationale: Kiwakilishi cha nafsi ya kwanza kimetajwa wazi ili kuhifadhi msisitizo wa Kiebrania.
- source_word: שָׁלוֹם
  choice: wa amani
  rationale: Kishazi kisicho na kitenzi kinasema kihalisi, ‘Mimi—amani.’ Usemi ‘Mimi ni wa amani’ unaonyesha kwamba msemaji anaelekea na kusimama upande wa amani, bila kumfanya ajitambulishe kana kwamba yeye mwenyewe ndiye amani.
- source_word: וְכִי
  choice: lakini ninapo-
  rationale: Muunganiko huu unaweza kueleweka kwa maana rahisi ya ‘na ninapo-’, lakini muktadha unaonyesha utofautishaji kati ya msimamo wa msemaji na wa wapinzani wake; kwa hiyo ‘lakini ninapo-’ ni wa asili na mwaminifu kwa muktadha.
- source_word: אֲדַבֵּר
  choice: ninaposema
  rationale: Kitenzi kimetafsiriwa bila kuongeza kitu anachokisema; ‘ninaposema kuhusu amani’ kingeongeza maana isiyotajwa wazi katika Kiebrania.
- source_word: הֵמָּה
  choice: wao
  rationale: Kiwakilishi cha wingi kinawahusu wapinzani na kinahifadhi utofautishaji wenye msisitizo kati ya ‘Mimi’ na ‘wao.’
- source_word: לַמִּלְחָמָה
  choice: wa vita
  rationale: Muundo huu unaonyesha mwelekeo au msimamo wao kuelekea vita na pia unadumisha ulinganifu wa kishairi na ‘wa amani.’
