  text: A Song of Ascents. To Yahweh in my distress I called[a], and he answered me.
translation:
  language: sw
  text: 'Wimbo wa Kupanda.[a]


    Katika shida yangu nilimwita Yahwe,

    naye akanijibu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kichwa cha Kiebrania “Wimbo wa Kupanda” ni kichwa cha jadi cha Zaburi 120–134; pia kinaweza kutafsiriwa “Wimbo wa kwenda juu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa Kupanda
  rationale: Kirai hiki ni kichwa cha jadi cha Zaburi 120–134. “Kupanda” huhifadhi wazo la kwenda juu bila kuamua kwa uhakika kama ni safari ya kwenda Yerusalemu, kupanda ngazi, au maana nyingine.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetafsiriwa kwa umbo la Kiswahili linalowakilisha tetragramu, badala ya kulibadilisha kuwa cheo kama “BWANA”.
- source_word: בַצָּרָתָה לִּי
  choice: Katika shida yangu
  rationale: Usemi wa kawaida na wenye hadhi unaowasilisha hali ya dhiki au taabu iliyomkabili msemaji.
- source_word: קָרָאתִי וַיַּעֲנֵנִי
  choice: nilimwita … naye akanijibu
  rationale: Huhifadhi mfuatano wa tendo la kumwita Yahwe na jibu lake, kwa Kiswahili cha kawaida na wazi.
theological_decisions:
- issue: Maana hususa ya “kupanda” katika kichwa
  choice: Haijafafanuliwa ndani ya matini kuu
  alternative: “Wimbo wa mahujaji wanaopanda kwenda Yerusalemu”
  rationale: Kiebrania hakitaji wazi mahujaji wala Yerusalemu; tafsiri inaacha uwezekano huo bila kuufanya kuwa maana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, rahisi na yenye hadhi. Mpangilio wa kishairi umetumiwa kutenganisha kichwa na mstari wa zaburi.
