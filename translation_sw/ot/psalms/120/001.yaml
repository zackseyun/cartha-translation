  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת אֶל יְ֭הוָה בַּ/צָּרָ֣תָ/ה לִּ֑/י קָ֝רָ֗אתִי וַֽ/יַּעֲנֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/001.yaml
  text: A Song of Ascents. In my distress I called to Yahweh[a], and he answered me.
translation:
  language: sw
  text: 'Wimbo wa kupanda.[a]


    Katika dhiki yangu nilimlilia Yahweh,

    naye akanijibu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kichwa hiki cha Kiebrania hutumiwa katika Zaburi 120–134; kinaweza pia kutafsiriwa “Wimbo wa kwenda juu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Wimbo
  rationale: Nomino hii humaanisha wimbo moja kwa moja; “zaburi” ingeongeza ufafanuzi usiolazimishwa na neno la Kiebrania.
- source_word: הַמַּעֲלוֹת
  choice: wa Kupanda
  rationale: Huhifadhi wazo la mwendo wa kuelekea juu katika kichwa hiki cha Zaburi 120–134 bila kuamua ikiwa kinarejelea safari, ngazi, au matumizi mengine.
- source_word: אֶל יְהוָה ... קָרָאתִי
  choice: nilimlilia Yahweh
  rationale: Katika Kiswahili cha kawaida, “kumlilia” huwasilisha kwa ufasaha mwito unaoelekezwa kwa Mungu wakati wa dhiki, bila kuhitaji kirai kisicho asilia kama “niliita kwa Yahweh.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu katika Tetragramatoni limehifadhiwa kama jina binafsi badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: בַּצָּרָתָה לִּי
  choice: Katika dhiki yangu
  rationale: Hii ni tafsiri ya asili ya nahau yenye maana ya kuwa katika hali ya shida au dhiki inayompata msemaji; “dhiki” huhifadhi uzito wa usemi wa kizaburi.
- source_word: וַיַּעֲנֵנִי
  choice: naye akanijibu
  rationale: Huwasilisha mfuatano wa simulizi na kiima kinachoeleweka kuwa Yahweh kwa Kiswahili fasaha.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana mahususi ya kichwa שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa Kupanda
  alternative: Wimbo wa safari za kwenda juu au Wimbo wa ngazi
  rationale: Kichwa kinadokeza kupanda, lakini marejeo yake mahususi hayajaelezwa katika mstari; tafsiri haipaswi kuchagua kimyakimya nadharia moja ya kihistoria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, yenye heshima, na ya sasa. Mpangilio wa kishairi umetumiwa kutenganisha kichwa na mstari wenyewe.
