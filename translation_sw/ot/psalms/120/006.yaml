translation:
  language: sw
  text: Nafsi yangu imeishi kwa muda mrefu pamoja na mtu anayechukia amani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nafsi yangu imeishi muda mrefu kupita kiasi pamoja na mtu anayechukia amani.” Mwanzo wa mstari wa Kiebrania unasisitiza muda mrefu, na unaweza pia kudokeza kwamba muda huo umezidi kiasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבַּת
  choice: kwa muda mrefu
  rationale: Katika muundo huu neno hilo linaonyesha urefu wa muda. Kiswahili hiki ni cha asili na hakilazimishi maana ya ‘muda mrefu kupita kiasi,’ ingawa maana hiyo inaweza kudokezwa.
- source_word: שָׁכְנָה
  choice: imekaa
  rationale: Kitenzi שכן humaanisha kukaa au kuishi mahali. ‘Imekaa’ kinaendana na ‘nafsi yangu’ na, pamoja na ‘kwa muda mrefu,’ kinaonyesha hali iliyoendelea.
- source_word: לָּהּ
  choice: hakikutafsiriwa kama kiwakilishi tofauti
  rationale: Kiambishi cha nafsi ya tatu ya kike kina ugumu wa kisintaksia na huenda kinarejelea tena נַפְשִׁי. Maana yake imewakilishwa kwa kufanya ‘nafsi yangu’ kuwa kiima wazi bila kuongeza kiwakilishi kisicho cha asili katika Kiswahili.
- source_word: נַפְשִׁי
  choice: Nafsi yangu
  rationale: Huhifadhi taswira ya kishairi ya Kiebrania na maana ya utu wa ndani, badala ya kuirahisisha kuwa ‘mimi.’
- source_word: עִם
  choice: pamoja na
  rationale: Hutoa kwa uwazi maana ya kuhusiana au kuishi katika mazingira yale yale.
- source_word: שׂוֹנֵא
  choice: mtu anayechukia
  rationale: Kirai hiki huhifadhi nguvu ya kitenzi katika participio na kuonyesha tabia ya mtu huyo, badala ya kutumia nomino tu kama ‘adui.’
- source_word: שָׁלוֹם
  choice: amani
  rationale: Katika muktadha wa uhasama na mahusiano ya amani, ‘amani’ ndiyo tafsiri iliyo wazi na ya kawaida zaidi.
