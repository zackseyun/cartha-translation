  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה יִתֵּן לְךָ
  choice: Atakupa nini
  rationale: Muundo huu unahifadhi swali la moja kwa moja, kitenzi ‘kupa,’ nafsi ya tatu ya umoja iliyo katika Kiebrania, na maana ya ‘kwako.’
- source_word: וּמַה יֹסִיף לָךְ
  choice: na atakuongezea nini
  rationale: ‘Kuongezea’ huhifadhi nguvu ya kitenzi יסף na usambamba wake na ‘kupa’; kiambishi ‘-ku-’ kinaonyesha kuwa kitendo kinaelekezwa kwa anayesemeshwa.
- source_word: לָשׁוֹן רְמִיָּה
  choice: ee ulimi mdanganyifu
  rationale: ‘Ulimi’ umehifadhiwa kama sitiari hai ya usemi, na ‘mdanganyifu’ huonyesha udanganyifu au hila bila kuifanya maana kuwa finyu mno.
theological_decisions:
- issue: Mtendaji asiye tajwa wazi katika vitenzi vya nafsi ya tatu
  choice: Ameachwa kuwa ‘yeye’ anayedokezwa na vitenzi ‘atakupa’ na ‘atakuongezea.’
  alternative: Kumtaja Mungu wazi kuwa ndiye atakayehukumu, au kutafsiri kwa maana ya jumla ‘utafanywa nini.’
  rationale: Kiebrania hakimtaji mtendaji. Muktadha unaweza kuelekeza kwenye hukumu ya Mungu, lakini kumtaja Mungu ndani ya mstari kungeondoa utata halisi wa matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. ‘Ee’ imetumiwa kuonyesha usemi wa moja kwa moja kwa ulimi, bila kuufafanua kuwa ‘maneno’ na hivyo kupoteza taswira ya Kiebrania.
