  - marker: b
    text: Au, “kutoka mdomo wa uongo, kutoka ulimi wa udanganyifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la Mungu limetoholewa kama “Yahwe,” huku “Ee” ikiweka wazi mwito wa moja kwa moja katika ombi.
- source_word: הַצִּילָה
  choice: uiokoe
  rationale: Ni kauli ya amri katika ombi la kuokolewa; “uiokoe” inaafikiana kisarufi na kiambishi chake “nafsi yangu” na ni ya kawaida katika sala.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: Inahifadhi taswira ya Kiebrania na mtindo wa kishairi, ingawa katika muktadha huu inaweza kumaanisha mtu mwenyewe au maisha yake.
- source_word: מִשְּׂפַת שֶׁקֶר
  choice: na midomo ya uongo
  rationale: “Midomo” huhifadhi tamathali ya kiungo cha usemi, na “ya uongo” huwakilisha muundo wa nomino wa Kiebrania bila kuufanya usemi kuwa maelezo marefu.
- source_word: מִלָּשׁוֹן רְמִיָּה
  choice: na ulimi wa hila
  rationale: “Ulimi” huhifadhi ulinganifu wa kishairi na “midomo”; “hila” huonyesha udanganyifu au ulaghai wa usemi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Kutoholewa kwa jina binafsi kunalihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Maana ya נַפְשִׁי
  choice: nafsi yangu
  alternative: mimi au maisha yangu
  rationale: “Nafsi yangu” huhifadhi usemi wa Kiebrania na mvutano wake wa kimaana; tanbihi inaonyesha kwamba hapa neno hilo linaweza kumaanisha mtu mzima au maisha yake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki chenye hadhi ya kishairi na sala, lakini kinachoeleweka kwa msomaji wa kawaida. Ulinganifu wa “midomo” na “ulimi” umehifadhiwa, pamoja na marudio ya kihusishi “na” kwa mistari miwili ya Kiebrania.
