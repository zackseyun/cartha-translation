  text: O Yahweh[a], deliver my soul from lying lips[b], from a deceitful tongue.
translation:
  language: sw
  text: Ee Yahwe, iokoe nafsi yangu[a] kutoka midomo ya uongo[b], na kutoka ulimi wa udanganyifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “nafsi yangu” linaweza pia kumaanisha “mimi” au “maisha yangu.”
