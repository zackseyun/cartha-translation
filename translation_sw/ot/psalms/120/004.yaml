lexical_decisions:
- source_word: חִצֵּי
  choice: mishale ... ya
  rationale: Nomino hii iko katika hali ya kuunganishwa na גִבּוֹר; Kiswahili huonyesha uhusiano huo kwa ‘ya’.
- source_word: גִבּוֹר
  choice: shujaa
  rationale: Katika taswira hii ya kivita, neno hili humaanisha mtu mwenye nguvu wa vita; ‘shujaa’ ni la asili na lenye hadhi katika Kiswahili.
- source_word: שְׁנוּנִים
  choice: mikali
  rationale: Kivumishi hiki hueleza mishale iliyonoa. ‘Mikali’ ni usemi wa kawaida kwa mishale yenye ncha kali bila kuongeza tendo lisilotajwa wazi.
- source_word: עִם
  choice: pamoja na
  rationale: Hudumisha kiungo kati ya taswira ya mishale na ile ya makaa.
- source_word: גַּחֲלֵי
  choice: makaa ya
  rationale: Ni wingi katika hali ya kuunganishwa. ‘Makaa’ huhifadhi maana ya chanzo bila kuongeza wazi kwamba yanawaka.
- source_word: רְתָמִים
  choice: mti wa retama
  rationale: Hili ni jina la mmea wa jangwani. Utohozi ‘retama’ pamoja na ‘mti’ huepuka kuuchanganya na ufagio wa kawaida na kuruhusu maelezo ya kitamaduni katika tanbihi.
