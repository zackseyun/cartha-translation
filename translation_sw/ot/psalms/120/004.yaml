  text: Sharp arrows of a warrior[b][a], with coals of the broom tree.
translation:
  language: sw
  text: Mishale mikali ya shujaa, pamoja na makaa ya vichaka vya retama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Retama ni kichaka au mti mdogo wa jangwani ambao makaa yake hudumu kwa muda mrefu.
