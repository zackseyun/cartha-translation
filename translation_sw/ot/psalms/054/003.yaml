  yaml_path: translation/ot/psalms/054/003.yaml
  text: God[a], hear my prayer; give ear to the words of my mouth.
translation:
  language: sw
  text: Mungu, sikia sala yangu; sikiliza maneno ya kinywa changu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Nomino hii imetumiwa kama mwito wa moja kwa moja katika sala. Kiswahili kinaweza kusema “Mungu” bila kuongeza “Ee,” ingawa “Ee Mungu” pia lingewezekana.
- source_word: שְׁמַע
  choice: sikia
  rationale: Amri hii inaomba kusikilizwa kwa makini. “Sikia” ni ya kawaida katika lugha ya sala na inadumisha usambamba na amri inayofuata.
- source_word: תְּפִלָּתִי
  choice: sala yangu
  rationale: תְּפִלָּה kwa kawaida humaanisha sala; hapa “sala yangu” ni tafsiri ya moja kwa moja na ya asili.
- source_word: הַאֲזִינָה
  choice: tega sikio usikie
  rationale: Kitenzi hiki kina wazo la kuelekeza sikio na kusikiliza kwa makini. Usemi huu unahifadhi taswira ya Kiebrania huku ukisomeka kwa kawaida katika Kiswahili.
- source_word: לְאִמְרֵי
  choice: maneno
  rationale: Wingi wa אֵמֶר hapa unamaanisha maneno au semi; “maneno” linafaa katika muktadha na katika muundo wa kishairi.
- source_word: פִי
  choice: ya kinywa changu
  rationale: Tafsiri hii inahifadhi usemi halisi na taswira ya kishairi ya Kiebrania, badala ya kuufafanua kuwa “ninayosema.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sala ulio wa heshima lakini unaoeleweka kwa urahisi. Usambamba wa kishairi kati ya “sikia” na “tega sikio usikie” umehifadhiwa.
