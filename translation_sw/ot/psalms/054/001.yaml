  text: Wazifi walipokuja na kumwambia Sauli, “Je, Daudi hajifichi miongoni mwetu?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja nasi.” Kiebrania kinasema kihalisi, “pamoja nasi”; katika muktadha huu, “miongoni mwetu” huonyesha kwamba Daudi alikuwa amejificha kati ya Wazifi au katika eneo lao.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא
  choice: walipokuja
  rationale: ב pamoja na kitenzi-jina cha בוא huanzisha kishazi cha wakati; ‘walipokuja’ ni Kiswahili cha kawaida na huhifadhi maana hiyo.
- source_word: הַזִּיפִים
  choice: Wazifi
  rationale: Ni jina la watu kwa wingi, likimaanisha wakazi wa Zifi; ‘Wazifi’ linafuata utaratibu wa kawaida wa Kiswahili wa majina ya makundi ya watu.
- source_word: וַיֹּאמְרוּ
  choice: na kumwambia
  rationale: Muundo huu unaendeleza mfuatano wa simulizi; kwa kuwa wasemaji ni wengi lakini Sauli ndiye anayesemeshwa, ‘kumwambia’ ni ya asili katika Kiswahili.
- source_word: לְשָׁאוּל
  choice: Sauli
  rationale: ל huonyesha anayeelekezewa maneno, na umbo la Kiswahili ‘kumwambia Sauli’ tayari huwasilisha uhusiano huo.
- source_word: הֲלֹא
  choice: Je, ... ha-?
  rationale: Chembe hii huanzisha swali la balagha linalotarajia jibu la kukubali; muundo hasi wa swali huhifadhi nguvu hiyo.
- source_word: דָוִד
  choice: Daudi
  rationale: Hili ndilo umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: מִסְתַּתֵּר
  choice: hajifichi
  rationale: Kitenzi hiki cha Hitpael katika hali ya kushiriki huonyesha tendo linaloendelea la mtu kujisitiri mwenyewe; ‘hajifichi’ ni wazi na la kawaida.
- source_word: עִמָּנוּ
  choice: kwetu
  rationale: Neno hili kimsingi ni ‘pamoja nasi,’ lakini katika muktadha wa kujificha linaweza kueleza eneo la Wazifi. ‘Kwetu’ ni la asili na huhifadhi uwezekano huo bila kulazimisha maana ya ushirika.
