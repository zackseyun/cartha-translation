  language: en
  yaml_path: translation/ot/psalms/054/006.yaml
  text: May evil return upon my adversaries[a]; in your faithfulness[b], destroy them.
translation:
  language: sw
  text: Uovu na uwageukie adui zangu[a]; kwa uaminifu wako[b], waangamize.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uovu utawageukia adui zangu; kwa uaminifu wako utawaangamiza.” Kitenzi cha kwanza kinaweza kueleweka kama tamko badala ya ombi.
    reason: alternative_reading
  - marker: b
    text: Au, “kwa kweli yako.” Neno la Kiebrania linaweza kumaanisha kweli, kutegemeka, au uaminifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ישוב
  choice: na uwarudie
  rationale: Kitenzi cha Kiebrania ni imperfecti ambacho hapa kinaweza kueleweka kama ombi au tamko. Kwa kuwa mstari ni sala na kitenzi cha mwisho ni amri, muundo wa kutakia ‘na ...’ unafaa, huku usomaji wa tamko ukiwekwa katika tanbihi.
- source_word: הָרַע
  choice: uovu
  rationale: Neno רַע linaweza kumaanisha uovu, madhara, au maafa. ‘Uovu’ huhifadhi ufupi na upana wa maana ya Kiebrania katika muktadha wa matendo ya wapinzani kuwarudia.
- source_word: לְשֹׁרְרָי
  choice: watesi wangu
  rationale: Neno hili linarejelea wapinzani wenye uhasama. ‘Watesi wangu’ ni la kawaida na lenye nguvu katika Kiswahili bila kulifanya rejeo kuwa la kijeshi tu.
- source_word: בַּאֲמִתְּךָ
  choice: kwa uaminifu wako
  rationale: אֱמֶת linaweza kumaanisha kweli, kutegemeka, au uaminifu. Hapa ‘uaminifu’ huonyesha kutegemeka kwa Mungu, na ‘kwa’ huwasilisha matumizi ya kiutekelezaji ya kihusishi ב.
- source_word: הַצְמִיתֵם
  choice: waangamize
  rationale: Hii ni amri ya Hiphil yenye maana ya kuwaangamiza au kuwakomesha kabisa. ‘Waangamize’ ni ya moja kwa moja, yenye nguvu, na ya asili katika Kiswahili.
theological_decisions:
- issue: Nguvu ya ombi la hukumu dhidi ya maadui
  choice: Mstari umetafsiriwa kama ombi kwa Mungu kwamba uovu uwarudie wapinzani na kwamba awaangamize.
  alternative: Uovu utawarudia watesi wangu; kwa uaminifu wako utawaangamiza.
  rationale: Muktadha wa sala na amri ya mwisho unaunga mkono maana ya ombi, lakini imperfecti ya kwanza inaweza pia kusomwa kama tamko; utata huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi kama Kiebrania; lugha kali ya sala ya hukumu haijalainishwa. Alama zote za tanbihi zimewekwa katika matini.
