lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza wa waimbaji
  rationale: Katika vichwa vya Zaburi, neno hili humrejelea msimamizi wa uimbaji au utendaji wa muziki. Tafsiri hii ni ya kawaida na yenye kueleweka katika Kiswahili cha sasa.
- source_word: בִּנְגִינוֹת
  choice: kwa ala za nyuzi
  rationale: Neno hili linaonyesha matumizi ya ala za muziki zenye nyuzi; ‘kwa’ linaweza kueleza uandamani au namna ya kuutenda wimbo bila kuongeza aina maalumu ya ala.
- source_word: מַשְׂכִּיל
  choice: Maskili
  rationale: Hili ni neno la kiufundi katika vichwa vya Zaburi ambalo maana yake kamili haijulikani kwa hakika. Kulitohoa badala ya kulitafsiri kwa maana moja kunahifadhi utata wa chanzo.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kihusishi cha Kiebrania kinaweza kuonyesha utunzi, umilikaji, wakfu, au uhusiano. ‘Ya Daudi’ huhifadhi upana huo kuliko ‘iliyoandikwa na Daudi’.
theological_decisions:
- issue: Maana ya kichwa kinachomhusisha Daudi
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi; kwa ajili ya Daudi
  rationale: Kichwa cha Kiebrania hakilazimishi maana moja kati ya utunzi, wakfu, au uhusiano; tafsiri haipaswi kutatua utata huo kimyakimya.
