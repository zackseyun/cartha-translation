  text: For he has delivered me from every trouble[a], and my eye has looked on my enemies.
translation:
  language: sw
  text: Kwa maana ameniokoa kutoka katika kila taabu, na jicho langu limewaona adui zangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jicho langu limewatazama adui zangu,” huenda ikidokeza kuanguka kwao au kutetewa kwake dhidi yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Katika muktadha huu neno hili linatoa sababu ya sifa au nadhiri iliyotangulia; “Kwa maana” linaendeleza uhusiano huo wa ufafanuzi kwa Kiswahili cha kawaida.
- source_word: מִכָּל צָרָה
  choice: kutoka katika kila taabu
  rationale: מִן pamoja na כָּל linaonyesha kuokolewa kutoka katika jumla ya taabu, kwa maana ya kila taabu; “taabu” ni pana na halibainishi isivyofaa aina ya dhiki.
- source_word: הִצִּילָנִי
  choice: ameniokoa
  rationale: Hifili ya נצל humaanisha kuokoa au kukomboa kutoka hatarini. Timilifu ya Kiswahili “ameniokoa” inaonyesha tendo lililotimia lenye umuhimu wa sasa.
- source_word: וּבְאֹיְבַי
  choice: na ... adui zangu
  rationale: Kwa kuandamana na ראה, ב linaweza kutambulisha wale walioonekana. Kiswahili hakihitaji kihusishi hapa, hivyo kitu cha kitenzi kinatajwa moja kwa moja bila kuongeza wazo la kushindwa kwao.
- source_word: רָאֲתָה עֵינִי
  choice: jicho langu limewaona
  rationale: Hifadhi taswira halisi ya Kiebrania ambamo “jicho langu” ndilo kiima. “Limewaona” ni Kiswahili cha asili na hudumisha maana ya kuona bila kuongeza ushindi, kisasi, au kuanguka kwa adui.
theological_decisions:
- issue: Maana inayodokezwa na mtunga zaburi kuwaona adui zake
  choice: Kutaja tu kwamba jicho lake limewaona adui zake
  alternative: Jicho langu limeona kuanguka kwa adui zangu; jicho langu limewatazama adui zangu kwa ushindi
  rationale: Kiebrania hakitaji wazi kushindwa, kuanguka, au kuangamizwa kwa adui. Muktadha unaweza kudokeza kuthibitishwa kwa mtunga zaburi, lakini tafsiri haipaswi kufanya dokezo hilo kuwa kauli ya wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi “jicho langu” umehifadhiwa kwa sababu unaeleweka, huku mpangilio na kitenzi vikiwa vya asili katika Kiswahili.
