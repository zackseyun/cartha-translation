  text: I will sacrifice a freewill offering to you[a]; I will give thanks to your name, O Yahweh[c][b], for it is good.
translation:
  language: sw
  text: Nitakutolea dhabihu ya hiari[a]; nitalishukuru jina lako, Ee Yahweh[b], kwa maana ni jema[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaweza pia kueleweka, “Nitakutolea dhabihu kwa hiari.”
    reason: lexical_alternative
  - marker: b
    text: Jina la Kiebrania YHWH, ambalo kwa kawaida hutafsiriwa “BWANA”; pia hutoholewa “Yahweh.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “kwa maana ni njema.” Huenda maana ni kwamba jina la Yahweh ni jema; wengine huelewa, “kwa maana yeye ni mwema,” wakimrejelea Yahweh moja kwa moja.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּנְדָבָה
  choice: dhabihu ya hiari
  rationale: Nomino נְדָבָה katika muktadha wa אֶזְבְּחָה inaashiria sadaka au dhabihu inayotolewa kwa hiari, si namna ya kutenda kwa hiari tu.
- source_word: אֶזְבְּחָה
  choice: nitakutolea dhabihu
  rationale: Kitenzi זבח humaanisha kutoa dhabihu. Muundo huu ni wa kawaida katika Kiswahili na unaonyesha wazi kuwa dhabihu inaelekezwa kwa Mungu.
- source_word: לָּךְ
  choice: -ku- katika “nitakutolea”
  rationale: Kihusishi ל kinaonyesha anayepokea dhabihu; kiambishi cha yambwa katika kitenzi cha Kiswahili kinawasilisha maana ya ‘kwako’ kwa ufasaha.
- source_word: אוֹדֶה
  choice: nitalishukuru
  rationale: Hifili ya ידה hapa inaweza kumaanisha kushukuru au kusifu. ‘Kulishukuru jina lako’ inadumisha wazo la shukrani na yambwa halisi ya Kiebrania.
- source_word: שִׁמְךָ
  choice: jina lako
  rationale: Tafsiri ya moja kwa moja inadumisha usemi wa agano unaohusu tabia na sifa ya Mungu iliyofunuliwa.
- source_word: יְהוָה
  choice: Ee Yahweh
  rationale: Jina la Mungu YHWH limetoholewa kama ‘Yahweh’; ‘Ee’ linaonyesha kwamba mtunga zaburi anamwita Mungu moja kwa moja.
- source_word: כִּי טוֹב
  choice: kwa maana ni jema
  rationale: כִּי inatoa sababu ya shukrani, na kivumishi cha kike ‘jema’ kinaunganisha sentensi kwa kawaida na ‘jina lako,’ huku Kiebrania chenyewe kikiacha kiima bila kutajwa wazi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Ee Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko lina jina binafsi YHWH, hivyo ‘Yahweh’ linadumisha jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Kinachorejelewa na טוֹב katika כִּי טוֹב
  choice: ni jema, ikielekea kurejelea ‘jina lako’
  alternative: yeye ni mwema, ikimrejelea Yahweh moja kwa moja
  rationale: Kiebrania hakitaji kiima wazi. ‘Jina lako’ ndilo rejeleo la karibu, lakini uwezekano kwamba sifa hiyo inamhusu Yahweh moja kwa moja umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sala ulio wa heshima lakini unaoeleweka kwa urahisi. Muundo ‘nitakutolea dhabihu’ ni wa asili kuliko kufuata mpangilio wa Kiebrania neno kwa neno. Alama zote za tanbihi zimewekwa katika matini kuu.
