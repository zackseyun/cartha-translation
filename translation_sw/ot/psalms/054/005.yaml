  yaml_path: translation/ot/psalms/054/005.yaml
  text: Behold[a], God is my helper[b]; the Lord is among those who sustain my life.
translation:
  language: sw
  text: Tazama, Mungu ndiye msaidizi wangu; Bwana[a] yu pamoja na wale wanaouhifadhi uhai wangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bwana ndiye mhifadhi wa uhai wangu.” Muundo wa Kiebrania unaotafsiriwa “yu pamoja na wale wanaouhifadhi uhai wangu” ni mgumu kisintaksia; tafsiri nyingine humchukulia Bwana mwenyewe kuwa mhifadhi wa moja kwa moja.
    reason: alternative_reading
  - marker: b
    text: Neno la Kiebrania נֶפֶשׁ (nefesh) linaweza kumaanisha “uhai,” “nafsi,” au mtu mwenyewe, kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Chembe hii huvuta fikira na kutanguliza tamko lenye mkazo; “Tazama” inadumisha uzito wa kishairi kwa Kiswahili cha sasa.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hapa ni jina la kawaida la Mungu na ndilo kiima cha kishazi.
- source_word: עֹזֵר לִי
  choice: ndiye msaidizi wangu
  rationale: Kivumishi-tendo cha Kiebrania kinatumika kama nomino au kiarifu. Muundo huu ni wa kawaida kwa Kiswahili na unadumisha maana ya mtendaji anayesaidia pamoja na mkazo wa sentensi.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Ni cheo cha Mungu hapa, si jina la bwana wa kibinadamu.
- source_word: בְּסֹמְכֵי
  choice: yu pamoja na wale wanaoutegemeza
  rationale: Muundo wa kihusishi ב pamoja na wingi wa kivumishi-tendo ni mgumu kisintaksia. “Pamoja na” inadumisha uwezekano wa maana ya ushirika bila kumfanya Bwana moja kwa moja kuwa kiima cha kitenzi hicho.
- source_word: נַפְשִׁי
  choice: uhai wangu
  rationale: Katika muktadha huu נֶפֶשׁ humaanisha uhai au nafsi ya mtu anayelindwa dhidi ya hatari; “uhai wangu” huepuka kuibana katika maana ya roho isiyo ya mwili.
theological_decisions:
- issue: Jinsi ya kutafsiri אֲדֹנָי kama cheo cha Mungu
  choice: Bwana
  alternative: Bwana ndiye
  rationale: “Bwana” inadumisha uzito wa cheo cha Mungu bila kukichanganya na jina la agano YHWH.
- issue: Muundo mgumu wa אֲדֹנָי בְּסֹמְכֵי נַפְשִׁי
  choice: Bwana yu pamoja na wale wanaoutegemeza uhai wangu
  alternative: Bwana ndiye anayeutegemeza uhai wangu
  rationale: Chaguo kuu linahifadhi wingi wa “wanaoutegemeza” na maana inayowezekana ya ushirika. Chaguo mbadala linaonyesha ufasiri unaomchukulia Bwana mwenyewe kuwa mtegemezaji wa moja kwa moja.
- issue: Maana ya נַפְשִׁי
  choice: uhai wangu
  alternative: nafsi yangu
  rationale: Muktadha unahusu kuhifadhiwa katika hatari. “Uhai” inadumisha maana pana ya maisha ya mtu bila kuingiza kwa lazima mgawanyo wa mwili na roho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Yu pamoja” ni muundo mfupi wenye uzito wa kishairi; “wanaoutegemeza uhai wangu” huhifadhi wingi na utata wa sintaksia ya Kiebrania.
