  yaml_path: translation/ot/psalms/054/002.yaml
  text: God[a], save me by your name, and vindicate me by your might.
translation:
  language: sw
  text: Mungu, uniokoe kwa jina lako, na kwa uweza wako unitetee.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “unihukumu” au “unipatie haki.” Kitenzi cha Kiebrania kinaweza kumaanisha kuhukumu mahakamani, lakini hapa huenda kinamaanisha kusimamia shauri langu na kunipatia haki.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Muktadha wa sala unaonyesha kuwa hili ni neno la kumwita Mungu moja kwa moja; Kiswahili hakihitaji kuongeza kihisishi ili kuonyesha mwito huo.
- source_word: בְּשִׁמְךָ
  choice: kwa jina lako
  rationale: Kihusishi ב kinaeleweka kwa maana ya chombo au msingi wa tendo. Usemi huu mfupi unadumisha wazo la jina la Mungu kama tabia yake iliyofunuliwa, sifa yake na utambulisho wake.
- source_word: הוֹשִׁיעֵנִי
  choice: uniokoe
  rationale: Kitenzi cha mzizi ישׁע katika Hifili ni ombi la kawaida la kuokolewa au kunusuriwa. “Uniokoe” ni tafsiri ya moja kwa moja na yenye upana unaofaa katika sala ya zaburi.
- source_word: וּבִגְבוּרָתְךָ
  choice: na kwa uweza wako
  rationale: גְּבוּרָה humaanisha nguvu au uwezo wa kutenda kwa nguvu. “Uweza” ni neno la sasa, la heshima, na linahifadhi matumizi ya kihusishi kama chombo sambamba na “kwa jina lako.”
- source_word: תְדִינֵנִי
  choice: unitetee
  rationale: Mzizi דִּין unaweza kumaanisha kuhukumu au kusimamia shauri. Katika ombi hili dhidi ya maadui, “unitetee” huwasilisha kwa kawaida tendo la Mungu la kumpatia mwombaji haki, huku tanbihi ikihifadhi maana pana ya kimahakama.
theological_decisions:
- issue: Maana ya ombi תְדִינֵנִי kuhusiana na haki ya Mungu
  choice: unitetee
  alternative: unihukumu; unipatie haki
  rationale: Muktadha unaelekeza kwenye ombi la Mungu kuingilia shauri la mwombaji na kumpatia haki, si hukumu ya upande wowote tu. “Unitetee” ni ya asili katika Kiswahili, na tanbihi inadumisha uwezekano halisi wa maana ya “unihukumu” au “unipatie haki.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sala ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio sambamba wa “kwa jina lako” na “kwa uweza wako” umehifadhiwa.
