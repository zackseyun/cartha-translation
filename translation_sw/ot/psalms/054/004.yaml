  yaml_path: translation/ot/psalms/054/004.yaml
  text: For strangers have risen against me[a], and ruthless men seek my life; they do not set God before them[c][b]. Selah
translation:
  language: sw
  text: Kwa maana wageni wameninukia[a], na watu wakatili wanatafuta uhai wangu[b]; hawamweki Mungu mbele yao. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa kigeni.” Kiebrania זָרִים linaweza kumaanisha wageni, watu wa kigeni, au watu waliojitenga.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “wanaitafuta nafsi yangu”; hapa “nafsi” humaanisha uhai wa mtunga zaburi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huanzisha sababu ya ombi katika muktadha na kuhifadhi nguvu ya kisababishi kwa Kiswahili cha kawaida.
- source_word: זָרִים
  choice: wageni
  rationale: Neno linaweza kumaanisha watu wasio wa kwao, waliojitenga, au wageni. “Wageni” huhifadhi upana huo bila kudai kwamba ni watu wa taifa jingine.
- source_word: קָמוּ עָלַי
  choice: wamenishambulia
  rationale: Nahau hii huonyesha kuinuka dhidi ya mtu kwa uhasama. “Wamenishambulia” ni ya asili katika Kiswahili na huwasilisha wazi tendo la uadui.
- source_word: עָרִיצִים
  choice: watu wakatili
  rationale: Hurejelea watu wenye ukatili, jeuri, na uonevu. Chaguo hili ni la kawaida na lenye uzito wa kimaadili.
- source_word: בִּקְשׁוּ נַפְשִׁי
  choice: wanatafuta uhai wangu
  rationale: Katika muktadha wa tishio, נֶפֶשׁ humaanisha uhai wa msemaji; usemi huu pia huhifadhi kiasi fulani picha ya Kiebrania kuliko kufafanua moja kwa moja kuwa wanataka kumuua.
- source_word: לֹא שָׂמוּ אֱלֹהִים לְנֶגְדָּם
  choice: hawamweki Mungu mbele yao
  rationale: Huhifadhi sitiari ya Kiebrania ya kutomweka Mungu mbele yao, yaani kutomjali katika fikra na matendo yao, bila kuifafanua kupita kiasi.
- source_word: סֶלָה
  choice: Sela
  rationale: Imehifadhiwa kama alama ya kiliturujia au kimuziki kwa kuwa maana yake kamili haijulikani kwa hakika.
theological_decisions:
- issue: Maana ya kianthropolojia ya נֶפֶשׁ katika muktadha wa tishio
  choice: uhai wangu
  alternative: nafsi yangu
  rationale: Muktadha unahusu watu wanaotishia uhai wa mtunga zaburi. “Uhai” huonyesha maana halisi hapa bila kuingiza mgawanyo maalumu wa mwili na nafsi ambao mstari hausisitizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Sitiari ya kumweka Mungu mbele yao imehifadhiwa; “Sela” haijatafsiriwa kwa sababu maana yake si hakika.
