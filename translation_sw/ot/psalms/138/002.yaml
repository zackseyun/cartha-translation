  text: אֶשְׁתַּחֲוֶ֨ה אֶל הֵיכַ֪ל קָדְשְׁ/ךָ֡ וְ/א֘וֹדֶ֤ה אֶת שְׁמֶ֗/ךָ עַל חַסְדְּ/ךָ֥ וְ/עַל אֲמִתֶּ֑/ךָ כִּֽי הִגְדַּ֥לְתָּ עַל כָּל שִׁ֝מְ/ךָ֗ אִמְרָתֶֽ/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/002.yaml
  text: I bow down toward your holy temple and give thanks to your name for your steadfast love and your faithfulness[a], for you have exalted your word above all your name.
translation:
  language: sw
  text: Nitasujudu nikielekea hekalu lako takatifu, na nitalishukuru jina lako kwa ajili ya upendo wako thabiti na uaminifu wako, kwa maana umeliinua neno lako juu ya jina lako lote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana umeiinua ahadi yako juu ya vitu vyote.” Kiebrania cha kishazi cha mwisho ni kigumu; wengine hukielewa kuwa, “umeliinua jina lako na neno lako juu ya vitu vyote.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֶשְׁתַּחֲוֶה
  choice: Nitasujudu
  rationale: Kitenzi kinaonyesha tendo halisi la kuinama au kujilaza katika ibada. “Nitasujudu” ni cha kawaida, chenye heshima, na huhifadhi tendo hilo la mwili.
- source_word: אֶל
  choice: nikielekea
  rationale: Kihusishi kinaonyesha mwelekeo wa kusujudu; tafsiri hii haidokezi kwamba msemaji yumo ndani ya hekalu.
- source_word: הֵיכַל קָדְשְׁךָ
  choice: hekalu lako takatifu
  rationale: Ingawa הֵיכָל pia yaweza kumaanisha jumba la kifalme, katika muktadha huu wa ibada “hekalu” ndiyo maana inayofaa zaidi.
- source_word: וְאוֹדֶה אֶת שִׁמְךָ
  choice: na kulishukuru jina lako
  rationale: ידה katika muundo huu huonyesha kutoa shukrani au sifa. Vishazi vinavyofuata vinataja sababu za shukrani, hivyo “kulishukuru” linafaa huku likihifadhi usemi wa Kiebrania kuhusu jina la Mungu.
- source_word: עַל חַסְדְּךָ
  choice: kwa ajili ya upendo wako thabiti
  rationale: חסד hubeba wazo la upendo wenye ushikamanifu na uaminifu. “Upendo thabiti” ni wazi kwa msomaji wa sasa bila kufungamanisha neno hilo na istilahi ya dhehebu.
- source_word: וְעַל אֲמִתֶּךָ
  choice: na uaminifu wako
  rationale: אמת inaweza kumaanisha kweli, uthabiti, au uaminifu; sambamba na חסד hapa, “uaminifu” huonyesha kutegemeka kwa Mungu.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inaleta sababu ya kutoa shukrani.
- source_word: הִגְדַּלְתָּ
  choice: umeliinua
  rationale: Hiphil ya גדל humaanisha kufanya kuwa kuu au kutukuza. “Umeliinua” huwasilisha kuinuliwa katika heshima na kuendana kwa asili na “neno lako.”
- source_word: עַל כָּל שִׁמְךָ
  choice: juu ya jina lako lote
  rationale: Muundo wa Kiebrania ni mgumu. Tafsiri hii inafuata kwa karibu mpangilio wa MT na kuhifadhi mvutano wake badala ya kuugeuza kimya kuwa usemi ulio laini zaidi.
- source_word: אִמְרָתֶךָ
  choice: neno lako
  rationale: אִמְרָה laweza kuwa neno, tamko, au ahadi. “Neno” ni pana vya kutosha kuhifadhi utata huo, huku muktadha ukiruhusu maana ya ahadi.
theological_decisions:
- issue: Maana ya kishazi kigumu כִּי הִגְדַּלְתָּ עַל כָּל שִׁמְךָ אִמְרָתֶךָ
  choice: kwa maana umeliinua neno lako juu ya jina lako lote
  alternative: kwa maana umeiinua ahadi yako juu ya vitu vyote; au, umeliinua jina lako na neno lako juu ya vitu vyote
  rationale: Maandishi ya Kimasoreti yana sintaksia ngumu na yametafsiriwa kwa njia mbalimbali. Maandishi makuu yanafuata kwa karibu mfuatano wa Kiebrania ili kuhifadhi mvutano wa maandishi, bila kudokeza kwamba jina la Mungu linapunguzwa thamani. Njia laini zaidi za kuelewa kishazi zimewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nitasujudu nikielekea” huhifadhi tendo na mwelekeo; msamiati wa kishairi umewekwa wazi bila kuondoa ugumu halisi wa kishazi cha mwisho.
