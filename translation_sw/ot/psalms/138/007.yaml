  text: אִם אֵלֵ֤ךְ בְּ/קֶ֥רֶב צָרָ֗ה תְּחַ֫יֵּ֥/נִי עַ֤ל אַ֣ף אֹ֭יְבַ/י תִּשְׁלַ֣ח יָדֶ֑/ךָ וְ/ת֖וֹשִׁיעֵ֣/נִי יְמִינֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/007.yaml
  text: If I walk in the midst of trouble[a], you preserve my life; you stretch out your hand against the anger of my enemies[c][b], and your right hand saves me.
translation:
  language: sw
  text: Nikienda katikati ya taabu[a], unahifadhi uhai wangu[b]; unanyoosha mkono wako dhidi ya hasira ya adui zangu[c], na mkono wako wa kuume unaniokoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Ijapokuwa ninaenda katikati ya taabu.” Neno la Kiebrania אִם linaweza kutanguliza kauli ya sharti au, kulingana na muktadha, kauli yenye maana ya kukubali hali.
    reason: lexical_alternative
  - marker: b
    text: Au “unanihuisha” au “unaniweka hai.” Kitenzi cha Kiebrania kinaweza kumaanisha kuhuisha au kuhifadhi hai.
    reason: lexical_alternative
  - marker: c
    text: Kwa maana halisi, “juu ya/dhidi ya pua-hasira ya adui zangu.” Katika Kiebrania, “pua” ni nahau inayoweza kumaanisha hasira au ghadhabu.
    reason: cultural_note
lexical_decisions:
- source_word: אִם אֵלֵךְ
  choice: Nikipita
  rationale: אִם inaweza kuwa na maana ya sharti au ya kukubali hali, na הלך ni kwenda au kutembea. “Nikipita” ni Kiswahili cha kawaida kinachodumisha maana ya sharti na mwendo katika hali ya taabu.
- source_word: בְּקֶרֶב צָרָה
  choice: katikati ya taabu
  rationale: קֶרֶב huonyesha kuwa ndani au katikati ya kitu, na צָרָה ni taabu, dhiki, au shida. Tafsiri hii inadumisha picha ya kuwa umezungukwa na taabu.
- source_word: תְּחַיֵּנִי
  choice: unahifadhi uhai wangu
  rationale: Kitenzi חיה katika Piel kinaweza kumaanisha kuhuisha, kufanya aishi, au kumhifadhi hai. Katika muktadha wa hatari kutoka kwa maadui, “unahifadhi uhai wangu” ni ya asili na haifungi maana kwenye uamsho wa kiroho.
- source_word: עַל אַף אֹיְבַי
  choice: dhidi ya hasira ya adui zangu
  rationale: אַף maana yake halisi ni “pua,” lakini ni nahau ya Kiebrania inayomaanisha hasira. עַל hapa huonyesha tendo linaloelekezwa dhidi ya hasira hiyo.
- source_word: תִּשְׁלַח יָדֶךָ
  choice: unanyoosha mkono wako
  rationale: Maana halisi ya kitenzi ni kutuma au kunyoosha. Usemi huu unaonyesha Mungu akiingilia kati kwa nguvu huku ukidumisha picha ya mkono.
- source_word: וְתוֹשִׁיעֵנִי יְמִינֶךָ
  choice: nao mkono wako wa kuume unaniokoa
  rationale: ישע humaanisha kuokoa au kukomboa, na “mkono wa kuume” hudumisha picha ya Kiebrania ya nguvu inayookoa.
theological_decisions:
- issue: Maana ya tendo la Mungu katika תְּחַיֵּנִי
  choice: Mungu anahifadhi uhai wa mtunga zaburi akiwa hatarini
  alternative: Mungu anamhuisha au kumrudishia nguvu
  rationale: Muktadha wa taabu na maadui unapendelea uhifadhi wa uhai, lakini tanbihi inadumisha uwezekano wa maana ya kuhuisha.
- issue: Lengo la tendo la Mungu katika עַל אַף אֹיְבַי
  choice: Mungu anatenda dhidi ya hasira ya maadui
  alternative: Mungu anatenda dhidi ya maadui wenyewe
  rationale: Tafsiri inahifadhi אַף kama nahau ya hasira badala ya kuifuta na kutaja maadui pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. “Taabu,” “hasira,” na “kuokoa” ni maneno ya kawaida; picha za “katikati” na “mkono wa kuume” zimehifadhiwa kwa sababu ni muhimu katika ushairi wa Kiebrania.
