  text: יְהוָה֮ יִגְמֹ֪ר בַּ֫עֲדִ֥/י יְ֭הוָה חַסְדְּ/ךָ֣ לְ/עוֹלָ֑ם מַעֲשֵׂ֖י יָדֶ֣י/ךָ אַל תֶּֽרֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/008.yaml
  text: Yahweh will fulfill his purpose for me[a]; O Yahweh, your steadfast love endures forever[b]. Do not forsake the work of your hands.
translation:
  language: sw
  text: 'Yahwe atatimiza kusudi lake kwa ajili yangu.[a]

    Ee Yahwe, upendo wako thabiti ni wa milele.

    Usiziache kazi za mikono yako.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe atakamilisha yanayonihusu.”
    reason: alternative_reading
  - marker: b
    text: Au, “Usiziachilie kazi za mikono yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna ya Kiswahili inayowakilisha Tetragramatoni, badala ya kulibadilisha kuwa cheo kama “BWANA”.
- source_word: יִגְמֹר
  choice: atatimiza
  rationale: Kitenzi גמר kina maana ya kukamilisha au kufikisha jambo mwisho wake; “atatimiza” ni cha kawaida katika Kiswahili na kinaonyesha tendo linalofikishwa kwenye ukamilifu.
- source_word: בַּעֲדִי
  choice: kwa ajili yangu
  rationale: Kirai hiki kinaweza kumaanisha kwa ajili yangu, kwa niaba yangu, au kunihusu. Uchaguzi huu ni wa kawaida huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: חַסְדְּךָ
  choice: upendo wako thabiti
  rationale: חסד hueleza upendo mwaminifu na wa kudumu; “upendo thabiti” huhifadhi wazo la mapenzi pamoja na uaminifu bila kulifungamanisha na istilahi ya dhehebu fulani.
- source_word: לְעוֹלָם
  choice: ni wa milele
  rationale: Kirai hiki kinaeleza kudumu bila mwisho; muundo wa sentensi nomino “ni wa milele” unaifuata Kiebrania kwa karibu na ni wa asili katika Kiswahili.
- source_word: מַעֲשֵׂי יָדֶיךָ
  choice: kazi za mikono yako
  rationale: Nomino ya Kiebrania iko katika wingi. Wingi umehifadhiwa ili kutolazimisha kuwa inarejelea kazi moja tu, iwe ni mtunga zaburi au jambo maalumu katika maisha yake.
- source_word: אַל תֶּרֶף
  choice: usiziache
  rationale: רפה inaweza kumaanisha kuachilia, kuacha, au kutokamilisha. “Usiziache” ni ombi la kawaida kwamba Mungu asiache alichokifanya, huku tanbihi ikionyesha picha halisi zaidi ya kuachilia.
theological_decisions:
- issue: Kitu kinachotimizwa katika יִגְמֹר בַּעֲדִי
  choice: Yahwe atatimiza kusudi lake kwa ajili ya mtunga zaburi
  alternative: Yahwe atakamilisha yanayomhusu mtunga zaburi
  rationale: Kiebrania hakitaji moja kwa moja neno “kusudi.” Limeongezwa katika matini kuu ili sentensi iwe wazi na ya kawaida kwa Kiswahili, lakini tanbihi inahifadhi uwazi wa usemi wa asili.
- issue: Kirejelewa cha מַעֲשֵׂי יָדֶיךָ
  choice: Kazi za Mungu zimeachwa katika wingi na bila kubainishwa zaidi
  alternative: Kazi moja ya Mungu katika maisha ya mtunga zaburi
  rationale: Kiebrania kinaweza kurejelea mtunga zaburi kama kazi ya Mungu, yale Mungu aliyomfanyia, au kazi zake kwa upana zaidi. Tafsiri haifungi maana katika mojawapo ya uwezekano huo.
- issue: Nguvu ya אַל תֶּרֶף
  choice: Ombi kwamba Mungu asiziache kazi zake
  alternative: Ombi kwamba Mungu asiziachilie kazi zake
  rationale: Maana ya kimahusiano ya kutokuacha inafaa katika matini kuu, huku tanbihi ikihifadhi taswira ya msingi ya kutolegeza au kuachilia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa mistari mitatu unafuata vipashio vya kishairi vya Kiebrania. Jina “Yahwe” limehifadhiwa, na lugha ya dhehebu maalumu imeepukwa.
