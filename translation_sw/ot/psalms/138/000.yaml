  text: לְ/דָוִ֨ד אוֹדְ/ךָ֥ בְ/כָל לִבִּ֑/י נֶ֖גֶד אֱלֹהִ֣ים אֲזַמְּרֶֽ/ךָּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/000.yaml
  text: Of David[a]. I will give thanks to you with all my heart; before the gods I will sing praises to you.
translation:
  language: sw
  text: Ya Daudi. Nitakushukuru kwa moyo wangu wote; mbele ya miungu[a] nitakuimbia sifa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbele ya viumbe wa mbinguni,” au “mbele ya malaika.” Neno la Kiebrania linaweza kumaanisha miungu, Mungu, au viumbe wa mbinguni kulingana na muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Kichwa hiki kinaweza kuonyesha utunzi, uhusiano, au wakfu kwa Daudi; ‘Ya Daudi’ huhifadhi ufupi na kiasi cha uwazi wa Kiebrania.
- source_word: אוֹדְךָ
  choice: Nitakushukuru
  rationale: Kitenzi ידה katika muktadha wa sifa kwa Mungu huonyesha kutoa shukrani au kumhimidi; ‘nitakushukuru’ ni ya kawaida na inafaa hapa.
- source_word: בְכָל־לִבִּי
  choice: kwa moyo wangu wote
  rationale: Hutoa maana ya kujitoa kwa nafsi yote kwa usemi wa asili na wa kawaida wa Kiswahili.
- source_word: נֶגֶד אֱלֹהִים
  choice: mbele ya miungu
  rationale: אֱלֹהִים hapa inaweza kumaanisha miungu au viumbe wa mbinguni. Tafsiri kuu inahifadhi maana ya moja kwa moja, huku tanbihi ikionyesha uwezekano mwingine wa kileksia.
- source_word: אֲזַמְּרֶךָּ
  choice: nitakuimbia sifa
  rationale: Kitenzi זמר humaanisha kuimba au kupiga muziki wa sifa; ‘nitakuimbia sifa’ ni Kiswahili asilia kinachoonyesha mlengwa wa sifa.
theological_decisions:
- issue: Utambulisho wa אֱלֹהִים katika kishazi ‘mbele ya אֱלֹהִים’
  choice: miungu
  alternative: viumbe wa mbinguni; malaika
  rationale: Muktadha haumlazimishi mfasiri kuchagua kwa uhakika kati ya miungu na baraza la viumbe wa mbinguni. Maandishi makuu yanafuata maana ya moja kwa moja, na tanbihi huhifadhi utata huo bila kuuingiza katika fundisho maalumu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa kishairi ni mfupi na wa moja kwa moja; utata halisi wa אֱלֹהִים umehifadhiwa kwa tanbihi.
