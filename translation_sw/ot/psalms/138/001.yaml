  text: לְ/דָוִ֨ד אוֹדְ/ךָ֥ בְ/כָל לִבִּ֑/י נֶ֖גֶד אֱלֹהִ֣ים אֲזַמְּרֶֽ/ךָּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/001.yaml
  text: Of David[a]. I will give thanks to you with my whole heart; before the gods I will sing praises to you.
translation:
  language: sw
  text: Ya Daudi. Nitakushukuru kwa moyo wangu wote; mbele ya miungu[a] nitakuimbia sifa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “viumbe wa mbinguni” au “malaika.” Neno la Kiebrania linaweza kumaanisha miungu, Mungu, au viumbe wa mbinguni kutegemea muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Kihusishi ל katika kichwa cha zaburi kinaweza kuonyesha uandishi, uhusiano, au kuwekwa wakfu. “Ya Daudi” ni lugha ya kawaida ya vichwa vya zaburi na hailazimishi maana ya “iliyoandikwa na” au “kwa ajili ya.”
- source_word: אוֹדְךָ
  choice: Nitakushukuru
  rationale: Kitenzi ידה katika Hifili kinaweza kumaanisha kushukuru, kusifu, au kukiri. Katika muktadha huu wa ibada, “nitakushukuru” huhifadhi maana ya shukrani na kiambishi cha yambwa kinachomwelekea Mungu.
- source_word: בְכָל לִבִּי
  choice: kwa moyo wangu wote
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili, ikionyesha ibada ya ndani isiyogawanyika.
- source_word: נֶגֶד
  choice: mbele ya
  rationale: Neno hili humaanisha kuwa mbele ya au katika uwepo wa; “mbele ya” ni fupi, wazi, na linafaa katika ushairi.
- source_word: אֱלֹהִים
  choice: miungu
  rationale: Umbo hili linaweza kumaanisha Mungu, miungu, au viumbe wa mbinguni kulingana na muktadha. Hapa umbo la wingi linahifadhiwa kwa “miungu,” huku maana nyingine zikitajwa katika tanbihi.
- source_word: אֲזַמְּרֶךָ
  choice: nitakuimbia sifa
  rationale: זמר katika Pieli hueleza kuimba au kufanya muziki wa sifa. “Nitakuimbia sifa” hudokeza tendo la muziki na ibada, na pia humweka Mungu wazi kuwa ndiye anayeimbiwa.
theological_decisions:
- issue: Anayerejelewa na אֱלֹהִים katika kirai נֶגֶד אֱלֹהִים
  choice: miungu
  alternative: viumbe wa mbinguni; malaika; Mungu
  rationale: Umbo la Kiebrania ni la wingi na katika muktadha huu wa kishairi huenda likarejelea miungu au viumbe wa mbinguni. Kutafsiri “Mungu” kwa umoja kungeficha umbo la wingi na kuondoa utata mapema. Matini kuu inatumia “miungu,” nayo tanbihi inadumisha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini rahisi kueleweka. Muundo ni wa moja kwa moja na wa sasa; “Ya Daudi” huhifadhi utata wa kichwa cha Kiebrania, na “miungu” huhifadhi mvutano wa kimatini bila kuingiza ufafanuzi wa kimadhehebu.
