  text: יוֹד֣וּ/ךָ יְ֭הוָה כָּל מַלְכֵי אָ֑רֶץ כִּ֥י שָׁ֝מְע֗וּ אִמְרֵי פִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/004.yaml
  text: All the kings of the earth will give thanks to you[a], O Yahweh, for they have heard the words of your mouth.
translation:
  language: sw
  text: Ee Yahwe, wafalme wote wa dunia watakushukuru, kwa maana wameyasikia maneno ya kinywa chako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: watakushukuru
  rationale: Hifili ya ידה pamoja na kiambishi cha nafsi ya pili inaeleza kumshukuru au kumsifu mtu; “watakushukuru” ni ya kawaida katika Kiswahili na inafaa muktadha wa shukrani wa zaburi.
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja, huku “Ee” ikionyesha wazi kwamba mtunga-zaburi anamwita Mungu.
- source_word: כָּל מַלְכֵי אָרֶץ
  choice: wafalme wote wa dunia
  rationale: Inahifadhi maana ya jumla ya כָּל na rejeo mahsusi kwa wafalme, bila kulipanua kuwa watawala kwa ujumla.
- source_word: כִּי
  choice: kwa maana
  rationale: Katika muktadha huu neno hilo linatanguliza sababu ya wafalme kumshukuru Yahwe.
- source_word: שָׁמְעוּ
  choice: wameyasikia
  rationale: Kauli timilifu ya Kiebrania inaonyesha tendo lililokamilika linalotangulia na kuwa msingi wa shukrani yao ya wakati ujao.
- source_word: אִמְרֵי פִיךָ
  choice: maneno ya kinywa chako
  rationale: Tafsiri hii inahifadhi taswira halisi ya Kiebrania na bado ni yenye kueleweka katika Kiswahili cha heshima.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni kama jina binafsi; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo “Ee Yahwe” ni wa kawaida kwa wito wa moja kwa moja, na “kwa maana” hudumisha mtiririko wa sababu bila kuwa wa kizamani.
