  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu muundo na maana ya Kiebrania: wafalme wote wa dunia ndio kiima; watamshukuru Yahwe; na sababu inayotolewa ni kwamba wameyasikia maneno/kauli za kinywa chake. Wakati ujao katika “watakushukuru” pamoja na tendo lililokamilika katika “wameyasikia” huhifadhi mfuatano wa msingi uliopo katika matini.'
