base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/003.yaml
  text: On the day I called[a], you answered me; you made me bold in my soul with strength.
translation:
  language: sw
  text: Siku ile nilipokuita, ulinijibu; ulinitia ujasiri katika nafsi yangu kwa nguvu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulipanua nafsi yangu kwa nguvu,” au, “uliniimarisha katika nafsi yangu.” Kitenzi cha Kiebrania ni kigumu, na kinaweza kudokeza kutia ujasiri, kupanua, au kuimarisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם
  choice: Siku
  rationale: 'Kirai hiki cha wakati kinahifadhi picha halisi ya ‘siku’ huku kikisomeka kwa kawaida katika Kiswahili: ‘Siku nilipokuita.’'
- source_word: קָרָאתִי
  choice: nilipokuita
  rationale: Kitenzi קרא katika muktadha wa sala kina maana ya kumwita Mungu. ‘Kukuita’ ni cha moja kwa moja na hakiongezi ukali wa kihisia uliomo katika ‘kulia kwa sauti.’
- source_word: וַתַּעֲנֵנִי
  choice: ulinijibu
  rationale: Huwakilisha wazi kitenzi ‘kujibu’ pamoja na kiambishi cha nafsi ya kwanza umoja, yaani ‘mimi.’
- source_word: תַּרְהִבֵנִי
  choice: ulinitia ujasiri
  rationale: Hifili ya רהב ni ngumu hapa, lakini katika muktadha huu yaelekea kuonyesha kusababishwa kuwa jasiri au kuimarishwa ndani. ‘Ulinitia ujasiri’ huhifadhi maana ya kisababishi kwa Kiswahili cha kawaida.
- source_word: בְנַפְשִׁי
  choice: moyoni mwangu
  rationale: נפש hapa huelekea kumaanisha nafsi ya ndani. ‘Moyoni mwangu’ ni usemi wa asili na wenye heshima katika Kiswahili kwa hali ya ndani ya mtu, ingawa ‘ndani yangu’ pia inawezekana.
- source_word: עֹז
  choice: kwa nguvu
  rationale: עֹז humaanisha nguvu au uweza. ‘Kwa nguvu’ huiunganisha kama namna au chombo cha kutiwa ujasiri bila kuifuta kama kipashio tofauti.
theological_decisions:
- issue: Maana ya kirai kigumu תַּרְהִבֵנִי בְנַפְשִׁי עֹז
  choice: ulinitia ujasiri moyoni mwangu kwa nguvu
  alternative: uliniimarisha ndani yangu; au ulipanua nafsi yangu kwa nguvu
  rationale: Tafsiri kuu huonyesha tendo la Mungu la kumpa mwombaji ujasiri wa ndani, huku ikihifadhi ‘moyoni mwangu’ na ‘kwa nguvu’ kama vipashio tofauti. Tanbihi inaweka wazi uwezekano wa kuimarisha au kupanua kwa sababu kitenzi cha Kiebrania kina utata wa kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na wa kishairi bila kuwa mgumu; ‘moyoni mwangu’ limetumiwa kueleza nafsi ya ndani kwa lugha inayoeleweka kwa urahisi.
