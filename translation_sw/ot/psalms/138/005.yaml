  text: וְ֭/יָשִׁירוּ בְּ/דַרְכֵ֣י יְהוָ֑ה כִּ֥י גָ֝ד֗וֹל כְּב֣וֹד יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/005.yaml
  text: and they will sing of the ways of Yahweh[a], for great is the glory of Yahweh.
translation:
  language: sw
  text: Nao wataimba kuhusu njia za Yahwe,[a] kwa maana utukufu wa Yahwe ni mkuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “katika njia za Yahwe”; huenda msemo huu unamaanisha kuimba kuhusu njia za Yahwe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשִׁירוּ
  choice: Nao wataimba
  rationale: Qal imperfect ya nafsi ya tatu wingi inaeleweka vizuri hapa kama wakati ujao, ikiendeleza tendo la wafalme katika mstari uliotangulia; “nao” huunganisha mtiririko huo kwa Kiswahili cha kawaida.
- source_word: בְּדַרְכֵי
  choice: kuhusu njia za
  rationale: Ingawa בְּ kimsingi inaweza kutafsiriwa “katika,” baada ya kitenzi “kuimba” hapa inaelekea kutaja mada ya wimbo. “Kuhusu njia za” ni ya asili kwa Kiswahili bila kuficha uwezekano wa tafsiri halisi, ambao umewekwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kwa namna ya kawaida ya Kiswahili, “Yahwe,” badala ya kulibadilisha kuwa cheo.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya kuimba; “kwa maana” kinafaa katika lugha ya kishairi na yenye hadhi.
- source_word: גָדוֹל
  choice: ni mkuu
  rationale: Kivumishi kinamaanisha kuwa mkubwa au mkuu. Muundo “utukufu ... ni mkuu” ni wa asili na huhifadhi msisitizo wa Kiebrania.
- source_word: כְּבוֹד
  choice: utukufu
  rationale: “Utukufu” ndilo neno la kawaida na linalofaa kwa כבוד linapotumiwa kumhusu Mungu.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina binafsi la Mungu, Tetragramatoni. “Yahwe” hulihifadhi kama jina na ni umbo linalotumika kwa kawaida katika Kiswahili.
- issue: Maana ya בְּ katika בְּדַרְכֵי
  choice: kuhusu njia za
  alternative: katika njia za
  rationale: Muktadha unaelekea kusema kwamba njia za Yahwe ndizo mada ya nyimbo, lakini tafsiri halisi “katika njia za” inawezekana; tofauti hiyo imehifadhiwa kwa tanbihi badala ya kuamuliwa kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo wa kishairi umehifadhiwa bila kutumia lugha ya kizamani.
