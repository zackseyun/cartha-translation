base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/006.yaml
  text: For Yahweh is high[a], yet he sees the lowly[c][b]; but the haughty he knows from afar.
translation:
  language: sw
  text: Kwa maana Yahwe ametukuka, hata hivyo humwona aliye duni[a]; bali mwenye majivuno humjua kwa mbali.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mnyenyekevu” au “mtu wa hali ya chini.”
    reason: lexical_alternative
  - marker: b
    text: Au “humtambua kwa mbali.” Maneno ya Kiebrania yanasema “humjua kwa mbali” na huenda yakadokeza umbali wa kiuhusiano bila kuueleza wazi zaidi.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya sifa iliyotangulia na kudumisha mtiririko wa kishairi.
- source_word: רָם
  choice: ametukuka
  rationale: Neno hili linaeleza cheo cha juu cha Yahwe. “Ametukuka” ni Kiswahili cha kawaida na chenye hadhi, bila kulifanya kuwa maelezo ya mahali pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: שָׁפָל
  choice: aliye chini
  rationale: Huhifadhi upana wa maana ya mtu aliye chini kwa hali au aliye mnyenyekevu, bila kuibana maana iwe unyenyekevu wa tabia pekee.
- source_word: יִרְאֶה
  choice: humwona
  rationale: Hutoa maana ya msingi ya kitenzi, “kuona,” huku muktadha ukiruhusu maana ya kumjali au kumwangalia.
- source_word: גָבֹהַּ
  choice: mwenye majivuno
  rationale: Ingawa maana ya moja kwa moja ni “aliye juu,” ulinganisho na aliye chini unaonyesha kiburi au majivuno.
- source_word: מִמֶּרְחָק
  choice: kwa mbali
  rationale: Huhifadhi taswira ya umbali iliyomo katika Kiebrania.
- source_word: יְיֵדָע
  choice: humjua
  rationale: Huhifadhi maana kuu ya “kujua” bila kuipanua kuwa kukataa, kuhukumu, au kumweka mbali.
theological_decisions:
- issue: Maana ya uhusiano katika Yahwe kumjua mwenye majivuno “kwa mbali”
  choice: humjua kwa mbali
  alternative: humtambua kwa mbali / humweka mbali
  rationale: Kiebrania kinasema kwamba Yahwe anamjua mwenye majivuno kwa mbali. Kauli hiyo inaweza kudokeza umbali wa kiuhusiano, lakini haisemi wazi kwamba anamkataa au anamzuia asikaribie.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na utofautishaji kati ya aliye chini na mwenye majivuno umehifadhiwa; “bali” linaweka wazi pingamizi la kishairi katika kishazi cha mwisho.
