  text: אֲ֭נִי אֶל אֱלֹהִ֣ים אֶקְרָ֑א וַ֝/יהוָ֗ה יוֹשִׁיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/016.yaml
  text: As for me[a], I call to God, and Yahweh will save me.
translation:
  language: sw
  text: Mimi, nitamwita Mungu, naye Yahweh ataniokoa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲנִי
  choice: Lakini mimi
  rationale: Kiwakilishi huru kilichowekwa mbele kina mkazo wa kutofautisha mtunga zaburi na waliotajwa katika muktadha. “Lakini mimi” huonyesha utofauti huo kwa Kiswahili cha kawaida.
- source_word: אֶל אֱלֹהִים
  choice: nitamwita Mungu
  rationale: אֶל huonyesha anayeelekezewa mwito, na אֱלֹהִים hapa humaanisha Mungu mmoja. Muundo wenye kiambishi cha yambwa “-mw-” ni wa asili katika Kiswahili.
- source_word: אֶקְרָא
  choice: nitamwita
  rationale: Qal imperfect ya nafsi ya kwanza inaweza kuwa ya sasa, ya mazoea, au ya wakati ujao. Katika muktadha huu inaelekea kueleza azimio la mtunga zaburi likifuatiwa na tumaini la kwamba ataokolewa, huku kutokuwa na uhakika kamili kwa wakati wa kitenzi kukibaki katika maelezo ya uamuzi.
- source_word: וַיהוָה
  choice: na Yahweh
  rationale: וַ ni kiunganishi, na jina la agano יְהוָה limetoholewa kuwa “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: יוֹשִׁיעֵנִי
  choice: ataniokoa
  rationale: Hiphil imperfect ya ישׁע ina maana ya kuokoa au kukomboa. “Ataniokoa” huwasilisha vizuri tumaini lenye uhakika linaloelekea wakati ujao.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu moja kwa moja. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza tafsiri ya kimadhehebu.
- issue: Uhusiano kati ya mwito wa mtunga zaburi na wokovu wa Mungu
  choice: “nitamwita … ataniokoa”
  alternative: “namwita … ananiokoa”
  rationale: Vitenzi viwili vya imperfect vinaweza kuwa na maana ya sasa, mazoea, au wakati ujao. Muktadha unaunga mkono azimio linalofuatwa na tumaini la wokovu, lakini tafsiri mbadala ya sasa bado inawezekana kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na ya kishairi; “Lakini mimi” huhifadhi mkazo wa kiwakilishi cha Kiebrania, na “Yahweh” huhifadhi jina la Mungu.
