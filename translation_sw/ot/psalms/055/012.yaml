lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza maelezo ya sababu katika mtiririko wa maombolezo, kwa lugha ya kawaida na yenye hadhi.
- source_word: אוֹיֵב
  choice: adui
  rationale: Neno la kawaida na la moja kwa moja kwa mpinzani.
- source_word: יְחָרְפֵנִי
  choice: anayenidhihaki
  rationale: Kitenzi חרף kinaonyesha shutuma au matusi ya dharau; ‘kudhihaki’ kinabeba dharau hiyo ya maneno.
- source_word: וְאֶשָּׂא
  choice: ningeweza kuvumilia
  rationale: נשׂא hapa humaanisha kustahimili; hali ya masharti isiyotimia inaelezwa kwa ‘ningeweza.’
- source_word: מְשַׂנְאִי
  choice: anayenichukia
  rationale: Huwasilisha kirai-shirikishi cha Kiebrania kwa Kiswahili cha kawaida bila kukifanya tu jina la jumla.
- source_word: עָלַי הִגְדִּיל
  choice: amejikweza dhidi yangu
  rationale: Huhifadhi wazo la kujifanya mkuu kwa kiburi na mwelekeo wa uhasama wa עָלַי.
- source_word: וְאֶסָּתֵר
  choice: ningeweza kujificha
  rationale: Nifali ina maana ya kujificha; ‘ningeweza’ huonyesha muundo wa hali isiyotimia unaolingana na kishazi cha awali.
- source_word: מִמֶּנּוּ
  choice: mbali naye
  rationale: Huonyesha kujitenga na mtu huyo kwa Kiswahili cha asili; maana ya moja kwa moja pia inaweza kuwa ‘kutoka kwake.’
