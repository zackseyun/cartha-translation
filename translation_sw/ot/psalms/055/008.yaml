  text: I would hasten to a refuge for myself from the rushing wind[a], from the storm.
translation:
  language: sw
  text: 'Ningeharakisha kwenda mahali pa kujisitiri,

    mbali na upepo uvumao kwa nguvu[a], mbali na dhoruba.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ningeharakisha kutafuta mahali pa kujisitiri.” Umbo la Kiebrania linaweza kuonyesha azimio au hamu ya haraka ya msemaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִישָׁה
  choice: Ningefanya haraka
  rationale: Kitenzi cha Kohortativi kutoka חוּשׁ kinaonyesha hamu au azimio la msemaji lenye dharura; muundo huu wa Kiswahili unahifadhi maana ya ‘ningeharakisha’ kwa lugha ya kawaida.
- source_word: מִפְלָט
  choice: mahali pa kujisitiri
  rationale: Nomino hii inaweza kumaanisha mahali au njia ya kuokoka. ‘Mahali pa kujisitiri’ inafaa katika muktadha wa kukimbia upepo na dhoruba bila kuongeza wazo la ‘kupata’ ambalo halimo wazi katika Kiebrania.
- source_word: לִי
  choice: (imewakilishwa katika kujisitiri)
  rationale: Kiambishi cha nafsi ya kwanza kinaonyesha manufaa ya msemaji mwenyewe. Kiswahili cha ‘kujisitiri’ tayari kinaonyesha tendo linalomrejelea msemaji, hivyo ‘kwa ajili yangu mwenyewe’ kingekuwa kizito na kisicho cha kawaida hapa.
- source_word: מֵרוּחַ סֹעָה
  choice: mbali na upepo mkali
  rationale: רוּחַ hapa ni upepo kwa sababu ya taswira ya dhoruba, na סֹעָה huonyesha mwendo wenye nguvu au vurugu. ‘Upepo mkali’ ni usemi wa asili na wazi katika Kiswahili.
- source_word: מִסָּעַר
  choice: mbali na dhoruba
  rationale: סַעַר ni dhoruba au tufani. Kurudia ‘mbali na’ kunahifadhi urudiaji sambamba wa kihusishi מִן katika Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa mistari na urudiaji wa ‘mbali na’ huhifadhi usambamba wa kishairi wa Kiebrania; alama [a] imewekwa baada ya kirai kinachohusika.
