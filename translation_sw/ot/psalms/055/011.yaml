translation:
  language: sw
  text: Maangamizi yamo ndani yake;[a] ukandamizaji na udanganyifu haviondoki kutoka uwanja wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Maovu yenye kuharibu yamo ndani yake.” Neno la Kiebrania liko katika wingi, lakini hapa “maangamizi” limetumiwa kwa maana ya jumla.
    reason: lexical_alternative
  - marker: b
    text: Au, “kutoka mitaani mwake.” Neno la Kiebrania linaweza kumaanisha hasa uwanja au eneo la wazi la umma ndani ya jiji.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַוּוֹת
  choice: Maangamizi
  rationale: Nomino hii ya wingi inaweza kumaanisha maafa, matendo yenye kuharibu, au maovu yanayoleta uharibifu. “Maangamizi” linatumika kwa maana ya jumla na linaonyesha uovu wenye kuharibu ulioenea ndani ya jiji.
- source_word: בְּקִרְבָּהּ
  choice: yamo ndani yake
  rationale: Kirai hiki kihalisi ni “katikati yake.” “Ndani yake” kinadumisha maana ya mahali na pia ubinafsishaji wa jiji kama la kike, kwa Kiswahili cha kawaida.
- source_word: יָמִישׁ
  choice: haviondoki
  rationale: Kitenzi cha Kiebrania kiko katika umoja, lakini jozi inayofuata, “ukandamizaji na udanganyifu,” inaeleweka kwa pamoja; upatanisho wa ngeli ya wingi ni wa asili katika Kiswahili na unahifadhi maana ya kuendelea kuwapo.
- source_word: מֵרְחֹבָהּ
  choice: katika uwanja wake
  rationale: רְחוֹב mara nyingi humaanisha eneo la wazi la umma au uwanja wa mjini, si lazima mfumo mzima wa barabara. “Uwanja” linaonyesha vizuri mazingira hayo ya hadharani.
- source_word: תֹּךְ
  choice: ukandamizaji
  rationale: Neno hili linaweza kumaanisha ukandamizaji, unyang’anyi, au ulaghai. Katika muktadha wa maovu ya kijamii yanayoonekana hadharani, “ukandamizaji” ni pana, wazi, na la kawaida.
- source_word: וּמִרְמָה
  choice: na udanganyifu
  rationale: מִרְמָה humaanisha udanganyifu, hila, usaliti, au ulaghai. “Udanganyifu” ni neno la jumla, wazi, na linaendana vizuri na “ukandamizaji.”
