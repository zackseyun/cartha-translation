  text: Mchana na usiku huzunguka kwenye kuta zake[a]; uovu na taabu vimo ndani yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanalizunguka kwenye kuta zake” au “wanalizingira.” Kitenzi cha Kiebrania kinaweza kusisitiza kuzunguka kwa mwendo au kuzingira.
    reason: lexical_alternative
  - marker: b
    text: “Uovu na taabu” pia vinaweza kutafsiriwa “ubaya na mateso” au “uovu na ukandamizaji,” kwa kuwa maneno ya Kiebrania yanaweza kutaja uovu wa kimaadili na pia mateso yanayotokana nao.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹמָם וָלַיְלָה
  choice: Mchana na usiku
  rationale: Jozi hii ya maneno huonyesha tendo linaloendelea bila kukoma; kauli hii ni ya kawaida na ya asili katika Kiswahili.
- source_word: יְסוֹבְבֻהָ
  choice: huzunguka
  rationale: Kitenzi סבב kinaweza kumaanisha kuzunguka au kuzingira. “Huzunguka” huhifadhi taswira ya mwendo unaoendelea bila kubainisha zaidi wahusika ambao wanaeleweka kutokana na muktadha.
- source_word: עַל חוֹמֹתֶיהָ
  choice: kwenye kuta zake
  rationale: עַל kwa kawaida humaanisha juu ya au kwenye. “Kwenye kuta zake” ni usemi wa asili unaohifadhi mahali pa tendo bila kudokeza kwamba tendo linatokea tu kandokando ya kuta.
- source_word: אָוֶן
  choice: uovu
  rationale: Neno hili linaweza kumaanisha uovu, ubaya wenye madhara, au taabu inayotokana nao. “Uovu” huhifadhi wazi upande wa maadili huku tanbihi ikionyesha upana wake wa maana.
- source_word: עָמָל
  choice: taabu
  rationale: Neno hili linaweza kutaja taabu, mateso, au ukandamizaji. “Taabu” ni pana na ya kawaida, na hutofautishwa na “uovu” bila kuondoa uhusiano kati ya tendo baya na madhara yake.
- source_word: בְּקִרְבָּהּ
  choice: vimo ndani yake
  rationale: Maana ya moja kwa moja ni “katikati yake.” “Ndani yake” ni Kiswahili cha asili na hudumisha taswira ya jiji kama mahali ambamo hali hizi zimetawala.
