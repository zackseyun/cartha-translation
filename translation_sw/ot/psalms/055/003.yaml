id: PSA.55.3
reference: Psalms 55:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: מִ/קּ֤וֹל אוֹיֵ֗ב מִ/פְּנֵ֣י עָקַ֣ת רָשָׁ֑ע כִּי יָמִ֥יטוּ עָלַ֥/י אָ֝֗וֶן וּ/בְ/אַ֥ף יִשְׂטְמֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/003.yaml
  text: Because of the voice of the enemy[a], because of the oppression of the wicked; for they cast trouble upon me[b], and in anger they hate me.
translation:
  language: sw
  text: 'Kwa sababu ya sauti ya adui,

    kwa sababu ya uonevu wa mwovu;

    maana wananitupia taabu[a][b],

    na kwa hasira wananichukia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uovu” au “madhara.” Neno la Kiebrania linaweza kumaanisha taabu, madhara, uovu, au maovu kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au, “wananiangushia taabu.”
    reason: previous_rendering
lexical_decisions:
- source_word: מִקּוֹל
  choice: Kwa sababu ya sauti ya
  rationale: מִן pamoja na קוֹל hapa inaeleweka vizuri kama sababu ya dhiki ya mtunga zaburi. Neno “sauti” linahifadhi taswira halisi ya Kiebrania.
- source_word: אוֹיֵב
  choice: adui
  rationale: Umoja wa neno la Kiebrania umehifadhiwa; katika muktadha linaweza kumwakilisha adui mmoja au kundi kwa ujumla.
- source_word: מִפְּנֵי
  choice: kwa sababu ya
  rationale: Ingawa maana yake ya msingi inahusiana na kuwa mbele ya uso wa mtu, hapa ni nahau inayoonyesha sababu au chanzo cha dhiki.
- source_word: עָקַת
  choice: uonevu
  rationale: Neno linaweza kumaanisha shinikizo, dhiki, au ukandamizaji. “Uonevu” linaonyesha mateso ya uhasama yanayosababishwa na mwovu.
- source_word: רָשָׁע
  choice: mwovu
  rationale: Umoja wa Kiebrania umehifadhiwa na sifa ya kimaadili ya mhusika imeelezwa kwa Kiswahili cha kawaida.
- source_word: כִּי
  choice: maana
  rationale: Kiunganishi hiki kinatoa sababu ya dhiki iliyotajwa katika mistari iliyotangulia.
- source_word: יָמִיטוּ עָלַי
  choice: wananitupia
  rationale: Kauli hii inaonyesha kusababisha kitu kimwangukie au kiletewe mtu kwa uhasama. “Wananitupia” ni ya asili katika Kiswahili na inadumisha taswira hiyo bila kuifanya kuwa maelezo marefu.
- source_word: אָוֶן
  choice: taabu
  rationale: אָוֶן inaweza kumaanisha taabu, madhara, uovu, au maovu. Hapa inaelekea kutaja kile maadui wanachomletea mtunga zaburi, lakini uwezekano wa “uovu” umehifadhiwa katika tanbihi.
- source_word: וּבְאַף
  choice: na kwa hasira
  rationale: אַף, ambalo kimsingi humaanisha “pua,” hapa ni nahau ya hasira; muundo wenye בְּ unaonyesha namna wanavyomchukia.
- source_word: יִשְׂטְמוּנִי
  choice: wananichukia
  rationale: Kitenzi kinaonyesha chuki au uhasama mkali. “Wananichukia” ni wazi, cha kawaida, na kinatimiza maana ya msingi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Mistari na urudiaji wa “kwa sababu ya” vinahifadhi usambamba wa shairi la Kiebrania. Mabadiliko kutoka “adui/mwovu” katika umoja kwenda kitenzi cha wingi “wananitupia/wananichukia” yamehifadhiwa kama yalivyo katika chanzo badala ya kusawazishwa kimyakimya.
