  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi ya kishairi. Mstari wa pili unahifadhi sitiari ya Kiebrania ya Mungu ‘kujificha,’ huku “usisikie” ikiweka wazi uhusiano wake na kutosikiliza sala.
