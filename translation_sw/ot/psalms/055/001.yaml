base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/001.yaml
  text: Give ear[a], O God, to my prayer, and do not hide yourself from my supplication.
translation:
  language: sw
  text: 'Ee Mungu, sikiliza sala yangu,

    wala usijifiche na dua yangu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala usipuuze dua yangu.” Kitenzi cha Kiebrania kwa maana halisi ni “kujificha”; hapa kinaonyesha kukataa kuitilia maanani dua.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: sikiliza
  rationale: Kitenzi hiki cha amri humwomba Mungu atege sikio na kusikiliza kwa makini. “Sikiliza” ni Kiswahili cha kawaida na chenye heshima, bila kulazimisha nahau isiyo ya asili.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Ni mwito wa moja kwa moja kwa Mungu; “Ee” huonyesha hali ya kumwita kwa namna ya asili katika sala ya Kiswahili.
- source_word: תְּפִלָּתִי
  choice: sala yangu
  rationale: תְּפִלָּה ni neno la jumla la sala; “sala yangu” ni tafsiri wazi na ya kawaida.
- source_word: וְאַל
  choice: wala usi-
  rationale: Muunganiko na katazo unaendeleza ombi la kwanza. “Wala” huunganisha kwa asili katazo linalofuata katika Kiswahili.
- source_word: תִּתְעַלַּם
  choice: usijifiche usisikie
  rationale: Umbo la kujirejelea lina picha ya kujificha au kujifanya kutopatikana. Kauli hii huhifadhi picha hiyo huku ikifafanua maana yake katika muktadha wa sala.
- source_word: מִתְּחִנָּתִי
  choice: dua yangu
  rationale: תְּחִנָּה ni ombi la dhati la kuomba fadhili au rehema. “Dua” ni neno la Kiswahili sanifu na linaloeleweka kwa ombi la unyenyekevu kwa Mungu.
