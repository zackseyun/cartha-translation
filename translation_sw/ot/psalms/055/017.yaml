  yaml_path: translation/ot/psalms/055/017.yaml
  text: Evening[a], morning, and noon I complain and groan[c][b], and he hears my voice.
translation:
  language: sw
  text: Jioni, asubuhi na adhuhuri, hulalamika[a] na kuugua; naye huisikia sauti yangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hutafakari” au “husema.” Kitenzi cha Kiebrania kinaweza kuwa na maana hizo; katika muktadha huu wa maombolezo, maana ya kutoa malalamiko ndiyo inayowezekana zaidi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania husema tu, “naye huisikia sauti yangu.” Muktadha unaonyesha kwamba anayesikia ni Mungu.
    reason: implicit_subject
lexical_decisions:
- source_word: עֶרֶב וָבֹקֶר וְצָהֳרַיִם
  choice: Jioni, asubuhi na adhuhuri
  rationale: Majina haya matatu ya nyakati za siku yamewekwa sambamba ili kuhifadhi mfuatano na mahadhi ya kishairi ya Kiebrania. Katika Kiswahili, majina haya yanaweza kutumiwa kielezi bila kuongeza “wakati wa” kwa kila moja.
- source_word: אָשִׂיחָה
  choice: ninalalamika
  rationale: Kitenzi שׂיח kinaweza kumaanisha kutafakari, kusema, au kutoa malalamiko. Katika muktadha huu wa maombolezo, na kwa kuwa kimeunganishwa na kuugua, “ninalalamika” kinaonyesha vizuri usemi wa huzuni bila kufuta uwezekano mwingine, ambao umeelezwa katika tanbihi.
- source_word: וְאֶהֱמֶה
  choice: na kuugua
  rationale: Kitenzi המה hapa kinaonyesha sauti inayotokana na mfadhaiko au msukosuko. “Kuugua” ni lugha ya kawaida na yenye heshima kwa kilio hicho cha ndani kinachosikika.
- source_word: וַיִּשְׁמַע
  choice: naye huisikia
  rationale: Umbo la Kiebrania linaweza kueleweka katika ushairi kuwa tendo la kawaida au uhakika wa sasa. “Huisikia” linaonyesha kwamba Mungu humsikia mara kwa mara, huku “naye” kikidokeza mhusika wa kiume bila kuongeza jina lisilokuwamo katika mstari.
- source_word: קוֹלִי
  choice: sauti yangu
  rationale: קוֹל humaanisha “sauti,” hasa katika muktadha wa sala. Tafsiri hii inadumisha hali ya ombi linalotamkwa na ukaribu wa msemaji.
theological_decisions:
- issue: Mhusika asiyetajwa wazi wa וַיִּשְׁמַע
  choice: “naye” akirejelea Mungu kutokana na muktadha
  alternative: “BWANA huisikia sauti yangu”
  rationale: Kitenzi cha Kiebrania kina mhusika wa nafsi ya tatu, umoja, kiume, lakini mstari wenyewe hautaji jina la Mungu. Muktadha unamtambulisha kuwa Mungu; kwa hiyo tafsiri haiongezi jina la Mungu katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa kishairi, wa sasa na wenye heshima. Mfuatano mfupi wa nyakati tatu umehifadhiwa, na nukta mkato inatenganisha kilio cha mwombaji na uhakika kwamba Mungu anasikia.
