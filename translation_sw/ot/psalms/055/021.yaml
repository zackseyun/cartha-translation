  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Moyo wake ni vita’ imeachwa kama sitiari yenye mkazo; ‘mororo’ huepuka kurudia ‘laini’ huku ikidumisha ulinganifu wa kishairi.
