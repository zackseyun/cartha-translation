base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/021.yaml
  text: The words of his mouth are smooth[a], but his heart is war; his words are softer than oil[b], yet they are drawn swords.
translation:
  language: sw
  text: Maneno ya kinywa chake ni laini[a], lakini moyo wake ni vita; maneno yake ni mororo kuliko mafuta, lakini ni panga zilizochomolewa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maneno ya kujipendekeza hutoka kinywani mwake.” Usemi wa Kiebrania ni adimu na huenda unasisitiza zaidi maneno laini kama siagi au ya kujipendekeza.
    reason: lexical_alternative
  - marker: b
    text: Au, “panga zilizofunuliwa” au “panga zilizochomolewa kutoka katika ala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלְקוּ מַחְמָאֹת פִּיו
  choice: Maneno ya kinywa chake ni laini
  rationale: Kirai hiki adimu kinaonyesha usemi laini au wa kujipendekeza. Tafsiri hii inaeleweka kwa urahisi na inadumisha ulinganifu na maneno yaliyo mororo kuliko mafuta.
- source_word: וּקֲרָב לִבּוֹ
  choice: lakini moyo wake ni vita
  rationale: Neno קְרָב ni nomino, ‘vita’ au ‘mapambano.’ Muundo huu unahifadhi sitiari fupi na kali ya Kiebrania badala ya kuifafanua kuwa uhasama wa ndani.
- source_word: רַכּוּ דְבָרָיו מִשֶּׁמֶן
  choice: maneno yake ni mororo kuliko mafuta
  rationale: רַכּוּ huonyesha ulaini au uororo, na מִן hapa ni ya ulinganisho. ‘Mororo kuliko mafuta’ ni ya asili na huhifadhi taswira ya hisi.
- source_word: וְהֵמָּה פְתִחוֹת
  choice: lakini ni panga zilizofutwa
  rationale: פְתִחוֹת inaeleweka kimuktadha kuwa silaha zilizotolewa alani, yaani panga zilizofutwa kutoka alani. ‘Lakini’ huonyesha wazi utofauti na usemi mororo.
