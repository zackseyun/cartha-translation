    na hofu za mauti zimenishukia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Moyo wangu unahangaika sana ndani yangu.” Kitenzi cha Kiebrania kinaweza kumaanisha kutetemeka, kuhangaika kwa maumivu, au kusokota kwa dhiki.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי
  choice: moyo wangu
  rationale: Katika muktadha huu wa maombolezo, לֵב ni moyo kama kitovu cha hisia na hali ya ndani; “moyo wangu” ni usemi wa kawaida na wenye nguvu katika Kiswahili.
- source_word: יָחִיל
  choice: unagaagaa
  rationale: Kitenzi חול/חיל kinaweza kueleza kujikunja kwa maumivu, kutetemeka, au kuwa katika dhiki. “Unagaagaa” kinabeba picha ya msukosuko mkali wa ndani, huku uwezekano wa “kutetemeka” ukihifadhiwa katika tanbihi.
- source_word: בְּקִרְבִּי
  choice: ndani yangu
  rationale: קֶרֶב pamoja na kiambishi cha nafsi ya kwanza humaanisha sehemu ya ndani ya mtu; “ndani yangu” ni tafsiri ya kawaida na wazi.
- source_word: אֵימוֹת
  choice: vitisho
  rationale: Wingi wa אֵימָה unaonyesha mambo yenye kutisha au hofu kuu. “Vitisho” huhifadhi wingi na uzito wa hofu inayomlemea mwombolezaji.
- source_word: מָוֶת
  choice: vya kifo
  rationale: Muungano huu unaonyesha uhusiano kati ya vitisho na kifo bila kuamua kama kifo kinawakilishwa kama nafsi au ndicho chanzo au lengo la hofu.
- source_word: נָפְלוּ
  choice: vimeniangukia
  rationale: Qatal inaonyesha tendo lililotokea lenye matokeo yanayoendelea; “vimeniangukia” huonyesha kuwa vitisho vimemfikia na kumlemea.
- source_word: עָלָי
  choice: -niangukia
  rationale: Maana ya עַל pamoja na kiambishi cha nafsi ya kwanza imejumuishwa kwa kawaida katika kitenzi cha Kiswahili “vimeniangukia,” yaani vimeanguka juu yangu au vimenijia kwa nguvu.
