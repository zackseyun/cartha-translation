  text: יִשְׁמַ֤ע אֵ֨ל וְֽ/יַעֲנֵ/ם֮ וְ/יֹ֤שֵׁ֥ב קֶ֗דֶם סֶ֥לָה אֲשֶׁ֤ר אֵ֣ין חֲלִיפ֣וֹת לָ֑/מוֹ וְ/לֹ֖א יָרְא֣וּ אֱלֹהִֽים׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/019.yaml
  text: God will hear and answer them—he who sits enthroned from of old (Selah)—because they have no changes[c][b][a], and they do not fear God.
translation:
  language: sw
  text: Mungu atasikia na kuwajibu[a]—yeye aketiye juu ya kiti cha enzi tangu zamani (Sela)—kwa sababu hawana mageuko[b], wala hawamwogopi Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kuwanyenyekeza.” Katika muktadha huu, jibu la Mungu linaweza kueleweka kuwa kuwanyenyekeza au kuwaadhibu kwa hukumu.
    reason: alternative_reading
  - marker: b
    text: Au, “hawana mageuko ya hali,” au “hawabadiliki.” Kifungu cha Kiebrania ni kigumu na huenda kinamaanisha kwamba maisha yao yasiyo na misukosuko huwafanya waridhike bila kumcha Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע
  choice: atasikia
  rationale: Kauli ya wakati usiotimilika inaweza kueleza yajayo au tendo la kawaida; katika ombi hili, wakati ujao unaonyesha uhakika wa mtunga zaburi kwamba Mungu atasikia.
- source_word: אֵל
  choice: Mungu
  rationale: Hili ni jina la kishairi la Mungu; “Mungu” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: וְיַעֲנֵם
  choice: na kuwajibu
  rationale: Muundo wenye irabu wa Kiebrania unaunga mkono maana ya “kuwajibu.” Kwa kuwa muktadha ni wa hukumu, jibu hilo la Mungu linaweza kuwa la kuwaadhibu; uwezekano huo umehifadhiwa katika tanbihi.
- source_word: וְיֹשֵׁב קֶדֶם
  choice: yeye aketiye katika kiti cha enzi tangu zamani
  rationale: Kitenzi ישׁב kinapotumiwa kumhusu Mungu hapa kinaweza kudokeza kuketi na kutawala; “katika kiti cha enzi” huwasilisha maana hiyo ya kifalme kwa Kiswahili cha kawaida.
- source_word: סֶלָה
  choice: Sela
  rationale: Neno limetoholewa badala ya kutafsiriwa kwa sababu maana na kazi yake kamili hazijulikani kwa hakika.
- source_word: אֲשֶׁר אֵין חֲלִיפוֹת לָמוֹ
  choice: kwa sababu hawapatwi na mabadiliko
  rationale: חֲלִיפוֹת inaweza kumaanisha mabadiliko, mageuko, au kubadilika kwa hali. Usemi huu mgumu unaeleweka hapa kuwa watu hao hawakumbwi na mabadiliko ya hali, jambo linalochangia kuridhika kwao bila kumcha Mungu.
- source_word: וְלֹא יָרְאוּ אֱלֹהִים
  choice: wala hawamwogopi Mungu
  rationale: Kauli ya Kiebrania inaeleza hali yao iliyodumu; wakati uliopo katika Kiswahili huwasilisha tabia hiyo kwa ufasaha.
theological_decisions:
- issue: Maana ya ענה katika kitenzi cha pili
  choice: Mungu atawajibu
  alternative: Mungu atawaadhibu au kuwatesa
  rationale: Irabu za maandishi ya WLC zinaelekea kuunga mkono “kuwajibu,” lakini muktadha wa hukumu dhidi ya waovu unaruhusu jibu la Mungu kueleweka kuwa adhabu. Tanbihi huhifadhi uwezekano huo bila kuufanya kuwa maana pekee.
- issue: Maana ya kutopata חֲלִיפוֹת
  choice: hawapatwi na mabadiliko
  alternative: hawapati mageuko ya hali au hawabadiliki
  rationale: Kifungu cha Kiebrania ni kigumu. Tafsiri pana “mabadiliko” huhifadhi utata wa iwapo kinazungumzia hali zao zisizobadilika au wao wenyewe kutobadilika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa “yeye aketiye” umetumiwa kwa mtindo wa zaburi, huku maneno mengine yakibaki wazi kwa msomaji wa kawaida. “Sela” limehifadhiwa kama neno la liturujia lisilo na maana iliyothibitishwa.
