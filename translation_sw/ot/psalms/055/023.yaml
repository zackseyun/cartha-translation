  text: וְ/אַתָּ֤ה אֱלֹהִ֨ים תּוֹרִדֵ֬/ם לִ/בְאֵ֬ר שַׁ֗חַת אַנְשֵׁ֤י דָמִ֣ים וּ֭/מִרְמָה לֹא יֶחֱצ֣וּ יְמֵי/הֶ֑ם וַ֝/אֲנִ֗י אֶבְטַח בָּֽ/ךְ׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/023.yaml
  text: But you[a], God, will bring them down to the pit of destruction; men of bloodshed and deceit will not live out half their days[b], but I will trust in you.
translation:
  language: sw
  text: Lakini wewe, Mungu, utawashusha katika shimo la maangamizi[a]; watu wa umwagaji damu na udanganyifu hawataishi hata nusu ya siku zao[b], lakini mimi nitakutumaini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “shimo la uharibifu,” “shimo la kaburi,” au “shimo.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “hawatagawanya siku zao kwa nusu”; hii ni nahau inayomaanisha kwamba maisha yao yatakatizwa mapema.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרִידֵם
  choice: utawashusha
  rationale: Muundo wa Hifili wa ירד una maana ya kusababisha washuke. “Utawashusha” huhifadhi nguvu ya kisababishi bila kuongeza namna ambayo hukumu hiyo itatekelezwa.
- source_word: לִבְאֵר שַׁחַת
  choice: katika shimo la maangamizi
  rationale: בְּאֵר ni shimo au kisima, na שַׁחַת inaweza kumaanisha shimo, uharibifu, maangamizi, au kuoza. “Shimo la maangamizi” ni Kiswahili cha asili kinachohifadhi picha ya shimo lenye kuleta kifo au hukumu bila kulifanya kuwa istilahi maalumu ya kiakhera.
- source_word: אַנְשֵׁי דָמִים
  choice: watu wa umwagaji damu
  rationale: Nahau ya Kiebrania, kihalisi “watu wa damu,” humaanisha watu wenye jeuri au hatia ya kumwaga damu. Tafsiri hii huhifadhi picha halisi ya umwagaji damu.
- source_word: וּמִרְמָה
  choice: na udanganyifu
  rationale: מִרְמָה humaanisha udanganyifu, hila, au usaliti. “Udanganyifu” ni neno pana na la kawaida linalofaa katika muktadha huu.
- source_word: לֹא יֶחֱצוּ יְמֵיהֶם
  choice: hawataishi hata nusu ya siku zao
  rationale: חצה humaanisha kugawanya katikati. Hapa ni nahau inayoonyesha kwamba maisha yao yatakatizwa mapema; “hata” huonyesha wazi kuwa hawatafikia nusu ya muda wao wa kuishi.
- source_word: וַאֲנִי אֶבְטַח בָּךְ
  choice: lakini mimi nitakutumaini
  rationale: Kiwakilishi וַאֲנִי kina msisitizo na kinaweka tofauti kati ya mwisho wa waovu na msimamo wa mwimbaji. “Lakini mimi” huhifadhi tofauti hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya picha ya “shimo la maangamizi”
  choice: Imeachwa kuwa picha ya hukumu ya Mungu inayoelekea kwenye kifo au maangamizi.
  alternative: Kaburi, Kuzimu, uharibifu, au kuoza.
  rationale: Maneno ya Kiebrania yana nguvu lakini hayalazimishi hapa dhana maalumu ya kiakhera kama jehanamu. Tafsiri huhifadhi ukali wa hukumu na uwezekano wa kifo bila kuingiza fundisho lisilotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi huhifadhi tofauti kati ya hukumu ya watu waovu na tumaini la mwimbaji.
