  yaml_path: translation/ot/psalms/055/018.yaml
  text: He has redeemed my soul in peace from the battle against me[a], for many were with me.
translation:
  language: sw
  text: Ameikomboa nafsi yangu kwa amani kutoka katika vita dhidi yangu, kwa maana wengi walikuwa pamoja nami[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana wengi walikuwa dhidi yangu.” Kiebrania husema kihalisi, “kwa maana wengi walikuwa pamoja nami”; katika muktadha wa vita, wengine hukielewa kuwa kinarejelea wapinzani wengi.
    reason: alternative_reading
lexical_decisions:
- source_word: פָּדָה
  choice: ameikomboa
  rationale: Kitenzi hiki huonyesha kukomboa au kuokoa kwa gharama; “ameikomboa” kinahifadhi nguvu ya picha ya ukombozi na hali ya tendo lililotimizwa.
- source_word: בְשָׁלוֹם
  choice: kwa amani
  rationale: Huhifadhi maana ya moja kwa moja ya amani, uzima na hali njema bila kuibana kuwa usalama pekee.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: Kinahifadhi nahau ya Kiebrania na mtindo wa kishairi, ingawa katika muktadha kinaweza pia kumaanisha uhai wangu au mimi mwenyewe.
- source_word: מִקֲּרָב לִי
  choice: kutoka katika vita dhidi yangu
  rationale: קְרָב ni vita au mapambano; לִי inaeleweka kimuktadha kuwa vita vilivyoelekezwa dhidi ya msemaji.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu au maelezo ya kauli iliyotangulia na kutiririka vizuri katika ushairi wa Kiswahili.
- source_word: בְרַבִּים
  choice: wengi
  rationale: Huonyesha wingi wa watu bila kuongeza maelezo yasiyokuwamo wazi katika mstari.
- source_word: עִמָּדִי
  choice: pamoja nami
  rationale: Maana yake ya kawaida ni “pamoja nami”; tafsiri hii inahifadhi maneno na mvutano wa Kiebrania badala ya kuamua kimya kimya kuwa yanamaanisha “dhidi yangu.”
theological_decisions:
- issue: Maana ya kishazi cha mwisho בְרַבִּים הָיוּ עִמָּדִי
  choice: kwa maana wengi walikuwa pamoja nami
  alternative: kwa maana wengi walikuwa dhidi yangu
  rationale: עִמָּדִי kwa kawaida humaanisha “pamoja nami,” lakini muktadha wa mapambano unaruhusu baadhi ya wasomaji kukichukua kishazi hiki kwa maana ya wapinzani wengi. Matini kuu inahifadhi maana ya moja kwa moja na utata halisi; tanbihi inatoa usomaji wa kimuktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Nafsi yangu” na “kwa amani” zinahifadhi taswira ya Kiebrania. Alama zote za tanbihi lazima zionekane katika matini kuu.
