  yaml_path: translation/ot/psalms/055/000.yaml
  text: 'For the choirmaster: with stringed instruments. A Maskil[a] of David[b].'
translation:
  language: sw
  text: 'Kwa mwongoza waimbaji: kwa ala za nyuzi. Maskili[a] ya Daudi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “zaburi ya kufundisha” au “wimbo wa kutafakari”; maana kamili ya neno Maskili katika vichwa vya Zaburi haijulikani kwa hakika.
    reason: lexical_alternative
  - marker: b
    text: Maneno “ya Daudi” yanaweza pia kumaanisha “iliyotungwa na Daudi” au “kwa ajili ya Daudi.”
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza waimbaji
  rationale: Katika vichwa vya Zaburi, neno hili humaanisha kiongozi au msimamizi wa muziki. “Mwongoza waimbaji” ni Kiswahili cha sasa na kinachoeleweka, huku kiambishi ל kikionyeshwa kwa “kwa.”
- source_word: בִּנְגִינֹת
  choice: kwa ala za nyuzi
  rationale: Neno hili katika vichwa vya Zaburi hurejelea uimbaji unaoandamana na ala za nyuzi. Tafsiri hii ni wazi kwa msomaji wa kawaida bila kuainisha ala ambazo Kiebrania hakizitaji.
- source_word: מַשְׂכִּיל
  choice: Maskili
  rationale: Hili ni jina la kiufundi la aina ya zaburi ambalo maana yake kamili haijulikani kwa hakika. Kulitohoa badala ya kulifafanua katika matini kuu huepuka kuamua kimyakimya kati ya maana kama wimbo wa kufundisha na wimbo wa kutafakari.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kiambishi ל kinaweza kuonyesha utunzi, uhusiano, wakfu, au kumlenga mtu. “Ya Daudi” hudumisha upana huo vizuri zaidi kuliko kusema moja kwa moja “iliyotungwa na Daudi.”
theological_decisions:
- issue: Uhusiano wa Daudi na zaburi unaoonyeshwa na לְדָוִד
  choice: ya Daudi
  alternative: iliyotungwa na Daudi; kwa ajili ya Daudi
  rationale: Kiebrania hakilazimishi maana moja tu ya uhusiano huo. Tafsiri “ya Daudi” haidai kwa nguvu zaidi ya matini kwamba lazima Daudi ndiye mtunzi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo mfupi na wenye hadhi unaofaa kichwa cha zaburi. Neno la kiufundi “Maskili” limehifadhiwa kwa sababu maana yake si hakika, huku maelezo yakitolewa katika tanbihi.
