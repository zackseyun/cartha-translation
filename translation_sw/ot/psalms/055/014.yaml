  text: Together we sweetened counsel[c][b][a]; in the house of God we walked in the throng.
translation:
  language: sw
  text: Ambaye pamoja naye tulishiriki mazungumzo matamu ya faragha[a]; katika nyumba ya Mungu tulitembea katikati ya umati[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shauri tamu la siri,” au “mazungumzo matamu ya siri.” Neno la Kiebrania linaweza kumaanisha mazungumzo ya karibu na ya siri, si ushauri tu.
    reason: lexical_alternative
  - marker: b
    text: Au, “katikati ya kundi lenye makelele,” au “katika msongamano.” Neno la Kiebrania linaweza kutaja umati uliokusanyika, huenda likiwa na wazo la mwendo wenye kelele.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: ambaye ... naye
  rationale: Kihusishi hiki cha uhusiano kinamrejelea rafiki aliyetajwa katika mstari uliotangulia. Muundo wa Kiswahili ‘ambaye ... naye’ unaonyesha kwa kawaida maana ya ‘pamoja na ambaye’ bila kulazimisha sentensi isiyo ya kawaida.
- source_word: יַחְדָּו
  choice: tulishiriki naye
  rationale: Wazo la kuwa pamoja limejumuishwa kwa kawaida katika kitenzi ‘tulishiriki’ pamoja na ‘naye’; hivyo ukaribu wa tendo la pamoja unahifadhiwa bila urudiaji mzito.
- source_word: נַמְתִּיק
  choice: mazungumzo matamu
  rationale: Hifili ya מתק ina picha ya kufanya kitu kiwe kitamu. Kiswahili ‘mazungumzo matamu’ kinahifadhi sitiari ya utamu huku ‘tulishiriki’ kikieleza kwa kawaida ushirika wa kirafiki unaokusudiwa katika muktadha.
- source_word: סוֹד
  choice: mazungumzo ... ya faragha
  rationale: Neno hili linaweza kumaanisha siri, shauri la siri, au mazungumzo ya ndani kati ya watu walio karibu. ‘Mazungumzo ya faragha’ yanaonyesha ukaribu na usiri bila kuyapunguza kuwa taarifa iliyofichwa tu.
- source_word: בְּבֵית אֱלֹהִים
  choice: katika nyumba ya Mungu
  rationale: Huu ni usemi wa mahali unaohifadhi namna rasmi na ya kibiblia ya kulitaja eneo la ibada.
- source_word: נְהַלֵּךְ
  choice: tulitembea
  rationale: Katika kumbukumbu hii ya mambo yaliyopita, umbo la kitenzi linaeleweka vyema kama tendo la wakati uliopita. ‘Tulitembea’ linahifadhi picha halisi ya kwenda pamoja.
- source_word: בְּרָגֶשׁ
  choice: katikati ya umati
  rationale: Neno hili linaweza kutaja kundi kubwa la watu, hasa lenye mwendo au kelele. ‘Katikati ya umati’ linafaa kwa mazingira ya watu wanaoenda katika nyumba ya Mungu bila kulazimisha maana ya fujo.
