lexical_decisions:
- source_word: יִרְאָה
  choice: hofu
  rationale: Nomino hii humaanisha hofu au woga mkubwa; “hofu” ni ya moja kwa moja, ya kawaida, na inaungana kwa asili na “kutetemeka” katika Kiswahili.
- source_word: וָרַעַד
  choice: na kutetemeka
  rationale: Neno hili hueleza mtikisiko wa mwili unaosababishwa na woga; “kutetemeka” huhifadhi maana ya kimwili na ya kihisia.
- source_word: יָבֹא בִי
  choice: hunijia
  rationale: Kirai hiki ni kama “huja ndani yangu”; “hunijia” ni Kiswahili cha asili kinachoonyesha hali inayompata na kumwingia msemaji bila kuifanya kuwa tafsiri nzito.
- source_word: וַתְכַסֵּנִי
  choice: na ... hunifunika
  rationale: Kitenzi כסה humaanisha “kufunika”; uchaguzi huu unahifadhi sitiari ya Kiebrania badala ya kuifafanua kuwa “hunizidi nguvu.”
- source_word: פַּלָּצוּת
  choice: hofu kuu
  rationale: Nomino hii huonyesha hali kali ya kitisho, hofu, au kutetemeka. “Hofu kuu” ni wazi na ya asili kwa wasomaji wa kawaida, huku tanbihi ikihifadhi uwezekano wa maana ya mshtuko wa kutetemeka.
