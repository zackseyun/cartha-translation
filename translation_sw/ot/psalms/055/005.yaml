  yaml_path: translation/ot/psalms/055/005.yaml
  text: Fear and trembling come upon me[a], and horror covers me.
translation:
  language: sw
  text: Hofu na tetemeko vimenijia, na hofu kuu imenifunika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kitisho kimenifunika” au “kutetemeka kwa hofu kumenifunika.”
