  text: He stretched out his hands against those at peace with him[b][a]; he profaned his covenant.
translation:
  language: sw
  text: Aliinyoosha mikono yake dhidi ya wale waliokuwa na amani naye[a]; alilivunja agano lake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhidi ya marafiki zake” au “dhidi ya washirika wake.” Usemi wa Kiebrania unawahusu watu waliokuwa na uhusiano wa amani naye.
    reason: lexical_alternative
  - marker: b
    text: Au, “alililikiuka agano lake.” Kitenzi cha Kiebrania kwa maana ya moja kwa moja zaidi ni “alinajisi” au “alitendea kama kitu kilichotiwa unajisi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: aliinyoosha
  rationale: Pamoja na ‘mikono’ kama yambwa, kitenzi hiki kinaonyesha kunyoosha mikono kwa uhasama. Tafsiri hii inadumisha taswira halisi ya Kiebrania bila kuibadili moja kwa moja kuwa ‘alishambulia.’
- source_word: יָדָיו
  choice: mikono yake
  rationale: Umbo la Kiebrania katika maandishi haya ni la wingi lenye kiambishi cha nafsi ya tatu ya kiume; kwa hiyo wingi ‘mikono yake’ umehifadhiwa.
- source_word: בִּשְׁלֹמָיו
  choice: dhidi ya wale waliokuwa na amani naye
  rationale: Neno שָׁלוֹם hapa linaeleza uhusiano wa amani. Usemi huu unahifadhi maana pana kuliko ‘marafiki’ au ‘washirika,’ huku ‘dhidi ya’ ikionyesha uhasama unaodokezwa na muktadha.
- source_word: חִלֵּל
  choice: alilinajisi
  rationale: Piel ya חלל humaanisha kunajisi, kukufuru kilicho kitakatifu, au kukitendea kama kitu cha kawaida. ‘Alilinajisi’ inadumisha uzito wa kimaadili na kidini kuliko ‘alivunja,’ ingawa ‘alilikiuka’ ni tafsiri mbadala inayofaa.
- source_word: בְּרִיתוֹ
  choice: agano lake
  rationale: בְּרִית kwa kawaida ni ‘agano.’ Kiambishi kimetafsiriwa kuwa ‘lake’ bila kufafanua zaidi ikiwa ni agano alilofanya au linalomhusu kwa namna nyingine.
theological_decisions:
- issue: Asili ya lugha ya agano
  choice: ‘Agano’ na ‘alilinajisi’ zimetumiwa ili kuhifadhi uzito wa kimaadili na wa uhusiano wa agano.
  alternative: ‘Makubaliano’ badala ya ‘agano,’ au ‘alilikiuka/alilivunja’ badala ya ‘alilinajisi.’
  rationale: Muktadha unahusu usaliti wa mtu aliyekuwa katika uhusiano wa amani, wala hautaji wazi agano la Mungu. Tafsiri hii inadumisha lugha ya agano bila kuingiza maana maalumu ya kidhehebu au kudai kuwa ni agano la Mungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Muundo umehifadhi taswira ya mikono iliyonyooshwa kwa uhasama na lugha nzito ya agano bila kufafanua kupita maandishi ya Kiebrania.
