  yaml_path: translation/ot/psalms/055/013.yaml
  text: But you—a man as my equal[a], my companion, and my familiar friend.
translation:
  language: sw
  text: Lakini ni wewe—mtu aliye sawa nami, mwenzangu,[a] na rafiki yangu wa karibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kiongozi wangu”; neno la Kiebrania linaweza kumaanisha mshirika wa karibu au mtu anayeongoza.
