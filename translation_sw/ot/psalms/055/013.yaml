lexical_decisions:
- source_word: וְאַתָּה
  choice: Lakini ni wewe
  rationale: Kiunganishi pamoja na kiwakilishi cha nafsi kinaleta utofautishaji mkali na muktadha uliotangulia; Kiswahili cha kawaida hutumia “Lakini ni wewe” kusisitiza mshangao wa msaliti kuwa mtu huyo mwenyewe.
- source_word: אֱנוֹשׁ
  choice: mtu
  rationale: Neno hili humaanisha mwanadamu, wakati mwingine likidokeza udhaifu au hali ya kufa. Hapa mkazo ni usaliti wa mtu wa karibu, hivyo “mtu” ni tafsiri ya asili na isiyoongeza wazo lisilo la lazima.
- source_word: כְּעֶרְכִּי
  choice: aliye sawa nami
  rationale: Kirai kinatokana na עֵרֶךְ na hapa kinaonyesha usawa au hadhi inayolingana; “aliye sawa nami” ni wazi na cha kawaida katika Kiswahili.
- source_word: אַלּוּפִי
  choice: mwenzangu
  rationale: Neno linaweza kumaanisha mshirika wa karibu, mwenzi, au kiongozi. Katika muktadha huu wa uhusiano wa karibu, “mwenzangu” linafaa bila kufunga maana kwa dhana ya uongozi; uwezekano huo umehifadhiwa katika tanbihi.
- source_word: וּמְיֻדָּעִי
  choice: na rafiki yangu wa karibu
  rationale: Umbo linalotokana na ידע linamaanisha mtu anayejulikana kwa ukaribu. “Rafiki yangu wa karibu” linaonyesha uhusiano wa ndani unaohitajika katika kilio hiki, tofauti na “mtu ninayemjua,” ambacho ni dhaifu mno.
