translation:
  language: sw
  text: Nami nikasema[a], “Ni nani atakayenipa mabawa kama ya njiwa? Ningeruka na ningekaa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kimatamanio zaidi, “Laiti ningekuwa na mabawa kama ya njiwa! Ningeruka na ningetulia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Nami nikasema
  rationale: Muundo wa wayyiqtol wa אמר unaendeleza simulizi na kuanzisha maneno ya mtunga zaburi; “Nami nikasema” huhifadhi mwendelezo huo kwa Kiswahili cha asili.
- source_word: מִי יִתֶּן לִּי
  choice: Ni nani atakayenipa
  rationale: Huhifadhi umbo la swali la Kiebrania huku likidokeza shauku ya msemaji; maana ya kimatamanio zaidi imewekwa katika tanbihi.
- source_word: אֵבֶר
  choice: mabawa
  rationale: Ingawa nomino ya Kiebrania iko katika umoja, hapa hutumiwa kwa maana ya pamoja kuhusu viungo vya kurukia vya ndege; Kiswahili hutumia kwa kawaida wingi “mabawa.”
- source_word: כַּיּוֹנָה
  choice: kama ya njiwa
  rationale: Kiambishi כַּ huonyesha ulinganisho; “kama ya njiwa” huhifadhi tashbihi na kuhusisha mabawa na njiwa kwa uwazi.
- source_word: אָעוּפָה
  choice: Ningeruka
  rationale: Cohortative huonyesha tamanio au azimio. Hali ya masharti katika “Ningeruka” huwasilisha tamanio hilo kwa kawaida bila kuligeuza kuwa wakati ujao wa uhakika.
- source_word: וְאֶשְׁכֹּנָה
  choice: na kukaa
  rationale: Kitenzi שכן humaanisha kukaa, kuishi, au kufanya makao. “Kukaa” ni cha moja kwa moja, cha kawaida, na hakiingizi waziwazi wazo la kupumzika ambalo linatokana zaidi na muktadha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri huhifadhi swali la Kiebrania katika maandishi makuu na kuweka maana yake ya kimatamanio katika tanbihi. “Kukaa” limetumiwa kwa שכן ili kuhifadhi maana ya kimsamiati, huku “kupumzika” likibaki kuwa ufafanuzi wa kimuktadha.
