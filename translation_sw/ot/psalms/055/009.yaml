  text: בַּלַּ֣ע אֲ֭דֹנָ/י פַּלַּ֣ג לְשׁוֹנָ֑/ם כִּֽי רָאִ֨יתִי חָמָ֖ס וְ/רִ֣יב בָּ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/009.yaml
  text: Confuse them[a], Lord; divide their speech[b], for I have seen violence and strife in the city.
translation:
  language: sw
  text: Wachanganye[a], Bwana; ugawanye usemi wao[b], kwa maana nimeona jeuri na ugomvi mjini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uwameze, Bwana,” au “Uwaangamize, Bwana.” Kitenzi cha Kiebrania kinaweza kuwa na maana halisi zaidi ya uharibifu, ingawa hapa huenda kikamaanisha kuvuruga mipango yao kwa kuwafanya wachanganyikiwe.
    reason: alternative_reading
  - marker: b
    text: Kwa neno halisi, “ugawanye ulimi wao”; yaani, uvuruge uwezo wao wa kusema kwa umoja au kuelewana.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּע
  choice: Wachanganye
  rationale: Kitenzi hiki kwa kawaida kina maana halisi ya ‘kumeza’ au maana ya uharibifu, lakini hapa usambamba wake na ombi la kugawanya usemi wao unaunga mkono maana ya kuvuruga mipango na mawasiliano yao. Maana nyingine zinazowezekana zimehifadhiwa katika tanbihi.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Hili ni jina la cheo la Mungu אֲדֹנָי, kwa hiyo limetafsiriwa ‘Bwana,’ si namna inayotumiwa kuwakilisha YHWH.
- source_word: פַּלַּג
  choice: ugawanye
  rationale: Amri hii inamaanisha kugawanya au kutenganisha. ‘Ugawanye’ inahifadhi picha ya Kiebrania na uhusiano wake na usemi.
- source_word: לְשׁוֹנָם
  choice: usemi wao
  rationale: Maana halisi ni ‘ulimi wao,’ lakini hapa ulimi unawakilisha usemi au lugha. ‘Usemi wao’ ni wazi katika Kiswahili cha sasa bila kupoteza mkazo wa mawasiliano.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya ombi lililotangulia na kinafaa katika mtindo wa kishairi.
- source_word: רָאִיתִי
  choice: nimeona
  rationale: Kauli timilifu ya Kiebrania inaelezwa vizuri kwa ‘nimeona,’ ikionyesha jambo ambalo mtunga zaburi amelishuhudia na ambalo ndilo msingi wa ombi lake.
- source_word: חָמָס
  choice: jeuri
  rationale: Neno hili humaanisha ukatili, jeuri, au uovu wenye madhara. ‘Jeuri’ ni neno la kawaida na lenye nguvu linalofaa hapa.
- source_word: וְרִיב
  choice: na ugomvi
  rationale: רִיב inaweza kumaanisha mabishano, mzozo, au ugomvi. ‘Ugomvi’ ni lugha ya kawaida na inalingana vizuri na ‘jeuri.’
- source_word: בָּעִיר
  choice: mjini
  rationale: Hii ni tafsiri ya kawaida na ya asili ya kishazi cha mahali ‘katika mji.’
theological_decisions:
- issue: Maana ya amri ya mwanzo בַּלַּע kuhusiana na ‘ugawanye usemi wao’
  choice: Kuitafsiri kama ombi la kuwavuruga au kuwafanya wachanganyikiwe
  alternative: “Uwameze, Bwana” au “Uwaangamize, Bwana”
  rationale: Usambamba wa karibu na ombi la kugawanya usemi wao unaelekea kwenye kuvurugwa kwa mawasiliano na mipango yao, huenda ukiakisi tukio la Babeli. Hata hivyo, maana halisi au ya uharibifu ya kitenzi bado inawezekana, kwa hiyo imehifadhiwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. ‘Mjini’ limetumiwa kwa uasili, na ‘usemi wao’ huepuka tafsiri isiyoeleweka ya ‘ulimi wao’ huku tanbihi ikihifadhi taswira halisi.
