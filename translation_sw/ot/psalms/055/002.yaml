  text: Pay attention to me and answer me[a]; I am restless in my complaint[b], and I moan.
translation:
  language: sw
  text: Unisikilize kwa makini na unijibu; ninahangaika katika malalamiko yangu[a], nami ninaugua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Malalamiko” yanaweza pia kutafsiriwa “tafakari” au “mawazo yangu”; katika muktadha huu wa maombolezo, “malalamiko” linafaa zaidi. Kitenzi “ninahangaika” pia kinaweza kueleweka kuwa “ninatanga-tanga bila kutulia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: Unisikilize kwa makini
  rationale: Kauli ya kuamuru ya קשׁב inaomba usikivu makini. Usemi huu ni wa asili katika Kiswahili cha sasa na unaonyesha uzito wa ombi.
- source_word: לִּי
  choice: -ni- katika “Unisikilize”
  rationale: Kiwakilishi cha nafsi ya kwanza umoja kimewakilishwa kiasili kwa kiambishi cha yambwa -ni-.
- source_word: וַעֲנֵנִי
  choice: na unijibu
  rationale: ענה hapa humaanisha kujibu au kuitikia; “unijibu” ni usemi wa moja kwa moja na wa kawaida katika sala.
- source_word: אָרִיד
  choice: ninahangaika
  rationale: Kitenzi kinaweza kueleza hali ya kutotulia, kufadhaika, au kutangatanga kwa sababu ya dhiki. “Ninahangaika” huwasilisha msukosuko wa ndani bila kulazimisha wazo la kutembea huku na huku.
- source_word: בְּשִׂיחִי
  choice: katika malalamiko yangu
  rationale: שׂיח inaweza kumaanisha tafakari, mawazo yanayotamkwa, au malalamiko. Muktadha wa maombolezo unaunga mkono “malalamiko.”
- source_word: וְאָהִימָה
  choice: nami ninaugua
  rationale: המה huonyesha kutoa sauti ya dhiki kama kuugua, kuguna, au kulia kwa sauti; “ninaugua” ni ya asili na huhifadhi uchungu unaosikika.
