    reason: lexical_alternative
lexical_decisions:
- source_word: ישימות
  choice: Mauti na uwajie
  rationale: Neno la Kiebrania lina utata wa kimatini na kimaana. Muktadha wa laana na ulinganifu na kushuka Kuzimu vinaunga mkono ombi kwamba mauti iwafikie, bila kuongeza dhana isiyo hakika ya udanganyifu au ghafla katika matini kuu.
- source_word: עָלֵימוֹ
  choice: uwajie
  rationale: Huwasilisha kwa Kiswahili cha kawaida wazo la kuja juu yao au kuwafikia, huku likiunganishwa kiasili na ‘mauti’.
- source_word: יֵרְדוּ
  choice: washuke
  rationale: Huhifadhi nguvu ya ombi au laana na taswira ya mwendo kuelekea chini.
- source_word: שְׁאוֹל
  choice: Kuzimu
  rationale: ‘Kuzimu’ ni istilahi ya Kiswahili inayoweza kuonyesha makao ya wafu bila kuitafsiri moja kwa moja kuwa jehanamu; tanbihi inafafanua upeo wake hapa.
- source_word: חַיִּים
  choice: wakiwa hai
  rationale: Hutoa kwa kawaida maana ya kushuka huku bado wako hai.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu ya laana kwa lugha ya kishairi iliyo wazi.
- source_word: רָעוֹת
  choice: uovu
  rationale: Katika muktadha huu neno linaelekea kueleza ubaya wa kimaadili kwa maana ya jumla, si misiba tu.
- source_word: בִּמְגוּרָם
  choice: katika makao yao
  rationale: Hutoa maana inayowezekana zaidi ya mahali wanapoishi, huku mbadala wa ‘mahali wanapokaa kwa muda’ ukihifadhiwa katika tanbihi.
- source_word: בְּקִרְבָּם
  choice: katikati yao
  rationale: Huhifadhi maana ya kijamii ya uovu kuwapo miongoni mwao bila kuondoa kabisa uwezekano wa maana ya ‘ndani yao’.
theological_decisions:
- issue: Maana ya שְׁאוֹל katika tafsiri
  choice: Kutumia ‘Kuzimu’ katika matini kuu na kuifafanua kuwa makao ya wafu
  alternative: kaburi
  rationale: Hii huhifadhi taswira pana ya Kiebrania ya eneo la wafu na kuepuka kuingiza moja kwa moja dhana iliyokuzwa zaidi ya adhabu ya milele.
- issue: Utata wa neno la kwanza ישימות
  choice: Mauti na uwajie
  alternative: Maangamizi na yawajie; mauti na yawajie ghafula
  rationale: Matini ya Kiebrania ni ngumu. Tafsiri kuu inafuata ulinganifu wake na kushuka Kuzimu, huku tanbihi ikihifadhi uwezekano mwingine badala ya kuufanya uhakika wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi na chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa laana na ulinganifu wa mistari umehifadhiwa; utata halisi wa Kiebrania umewekwa katika tanbihi.
