base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/015.yaml
  text: Let death come upon them[a]; let them go down alive to Sheol, for evil is in their dwelling[d][c][b], in their midst.
translation:
  language: sw
  text: Mauti iwajie[a]; washuke Sheoli[b] wakiwa hai, kwa maana uovu umo katika makao yao[c], katikati yao[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Maangamizi na yawajie,” au “Mauti iwajie ghafula.” Neno la kwanza la Kiebrania ni gumu, na maana yake kamili haina uhakika.
    reason: textual_variant
  - marker: b
    text: Sheoli ni neno la Kiebrania linalomaanisha makao ya wafu; pia yaweza kutafsiriwa “kaburi.”
    reason: lexical_alternative
  - marker: c
    text: Au, “mahali wanapoishi,” au “mahali wanapokaa kwa muda.”
    reason: lexical_alternative
  - marker: d
