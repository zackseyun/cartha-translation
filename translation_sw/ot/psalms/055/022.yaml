base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/022.yaml
  text: Cast your burden on Yahweh[a], and he will sustain you[b]; he will never allow the righteous to be shaken.
translation:
  language: sw
  text: Mtupie Yahweh mzigo wako[a], naye atakutegemeza; hatamwacha mwenye haki atikisike kamwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “fungu lako,” “hangaiko lako,” au labda “kile alichokupa.” Nomino ya Kiebrania ni adimu na inaweza kumaanisha kwa upana zaidi kile kilichowekwa juu ya mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁלֵךְ
  choice: Mtupie
  rationale: Kauli ya amri ya שלך ina picha hai ya kutupa kitu juu ya mwingine; “mtupie” ni ya kawaida na huhifadhi mwelekeo kwa Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano YHWH limetolewa moja kwa moja kama Yahweh badala ya kubadilishwa kuwa cheo.
- source_word: יְהָבְךָ
  choice: mzigo wako
  rationale: Nomino hii adimu inaelekea kumaanisha kile kilichowekwa juu ya mtu; “mzigo wako” inafaa na ahadi inayofuata ya kutegemezwa, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: יְכַלְכְּלֶךָ
  choice: atakutegemeza
  rationale: כלכל hapa humaanisha kudumisha, kusaidia, au kutunza. “Atakutegemeza” huhifadhi picha ya msaada bila kuzuia wazo la utunzaji.
- source_word: לֹא יִתֵּן לְעוֹלָם
  choice: hatamwacha kamwe
  rationale: Muundo huu unaonyesha kutoruhusu kwa kudumu; “hatamwacha kamwe” ni Kiswahili cha asili na huunganika moja kwa moja na kishamirishi kinachofuata.
- source_word: מוֹט
  choice: atikisike
  rationale: Neno linaashiria kuyumba, kuteleza, au kupoteza uthabiti. “Atikisike” huhifadhi sitiari ya kutokuwa thabiti.
- source_word: לַצַּדִּיק
  choice: mwenye haki
  rationale: Kivumishi chenye kibainishi kimetumika kama nomino katika umoja. “Mwenye haki” ni usemi wa asili wa Kiswahili na unaweza kuwa wa kiwakilishi bila kuongeza jinsia isiyobidi.
theological_decisions:
- issue: Utoaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja; kulitaja “Yahweh” huhifadhi jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya umoja katika לַצַּדִּיק
  choice: mwenye haki
  alternative: wenye haki
  rationale: Umoja wa Kiebrania umehifadhiwa, lakini usemi wa Kiswahili “mwenye haki” hauhitaji kuingiza jinsia na unaweza kueleweka kwa maana ya kiwakilishi.
- issue: Upeo wa ahadi ya kutotikiswa
  choice: hatamwacha kamwe mwenye haki atikisike
  alternative: hatamruhusu mwenye haki aanguke milele
  rationale: Tafsiri huhifadhi sitiari ya kuyumba bila kuipanua kuwa ahadi kwamba mwenye haki hatapata shida yoyote au bila kuibana kuwa maangamizi ya mwisho pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kishairi; “Mtupie” huhifadhi taswira ya Kiebrania, na “atakutegemeza” huwasilisha msaada na utunzaji. Alama pekee ya tanbihi katika matini ni [a], na ina tanbihi inayolingana.
