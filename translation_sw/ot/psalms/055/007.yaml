  text: הִ֭נֵּה אַרְחִ֣יק נְדֹ֑ד אָלִ֖ין בַּ/מִּדְבָּ֣ר סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/007.yaml
  text: Look[a], I would wander far away; I would lodge in the wilderness[c][b]. Selah
translation:
  language: sw
  text: Tazama, ningekwenda mbali nikitangatanga[a]; ningekaa usiku nyikani[b]. Sela[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ningekimbilia mbali” au “ningekwenda mbali nikikimbia.” Kiebrania kinaunganisha kitenzi cha kujiweka mbali na neno linaloweza kumaanisha kutangatanga au kukimbia.
    reason: lexical_alternative
  - marker: b
    text: Au “ningelala nyikani.”
    reason: lexical_alternative
  - marker: c
    text: “Sela” limeachwa bila kutafsiriwa kama ilivyo desturi. Maana yake kamili haijulikani; huenda ni alama ya kimuziki au ya kiliturujia.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni neno la kuvuta fikira na kuingiza kauli kwa msisitizo wa moja kwa moja; “Tazama” ni la heshima na linaeleweka katika Kiswahili cha sasa.
- source_word: אַרְחִיק נְדֹד
  choice: ningekwenda mbali nikitangatanga
  rationale: Muungano huu una wazo la kujiweka mbali pamoja na kutangatanga au kukimbia. Tafsiri hii inadumisha mwendo wa kwenda mbali bila kuondoa utata wa mzizi נוד kati ya kutangatanga na kukimbia.
- source_word: אָלִין
  choice: ningekaa usiku
  rationale: Kitenzi לון/לין kwa kawaida humaanisha kukaa mahali usiku au kulala huko. “Ningekaa usiku” ni cha asili na huhifadhi maana hiyo mahsusi.
- source_word: בַּמִּדְבָּר
  choice: nyikani
  rationale: מִדְבָּר inaweza kumaanisha eneo la pori, nyika, au nchi kame, si lazima jangwa la mchanga pekee. “Nyikani” kinahifadhi upana huo.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya neno hili haijulikani; kwa hiyo limeandikwa kwa matamshi badala ya kutafsiriwa kwa kubahatisha.
