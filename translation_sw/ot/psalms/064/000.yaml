lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza muziki
  rationale: Katika vichwa vya Zaburi, neno hili humaanisha msimamizi au kiongozi wa uimbaji na upigaji wa muziki. “Mwongoza muziki” ni Kiswahili cha sasa na halifungii jukumu hilo kwa kwaya pekee.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ni jina la kawaida la utanzu wa wimbo wa ibada wenye uhusiano na muziki; “Zaburi” ndilo neno lililo wazi na lililozoeleka katika Kiswahili.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kiambishi לְ katika vichwa vya Zaburi kinaweza kuonyesha utunzi, uhusiano, umilikaji wa mkusanyo, au wakfu. “Ya Daudi” hudumisha upana huo kuliko kusema moja kwa moja “iliyotungwa na Daudi.”
theological_decisions:
- issue: Maana ya kuhusishwa kwa zaburi na Daudi katika kichwa
  choice: ya Daudi
  alternative: iliyotungwa na Daudi; kwa ajili ya Daudi
  rationale: Muundo wa Kiebrania hauthibitishi kwa lazima utunzi pekee. Tafsiri hii inaacha wazi uwezekano wa utunzi, uhusiano, au wakfu bila kulazimisha hitimisho la kitheolojia au kihistoria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Mwongoza muziki” limechaguliwa badala ya “mkuu wa waimbaji,” ambalo ni la kimapokeo zaidi na linaweza kudokeza kwaya pekee.
