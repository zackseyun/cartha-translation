  text: וַ/יִּֽירְא֗וּ כָּל אָ֫דָ֥ם וַ֭/יַּגִּידוּ פֹּ֥עַל אֱלֹהִ֗ים וּֽ/מַעֲשֵׂ֥/הוּ הִשְׂכִּֽילוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/009.yaml
  text: Then all mankind will fear[a], and they will declare the work of God; they will understand what he has done.
translation:
  language: sw
  text: Ndipo wanadamu wote[a] wataogopa, nao watatangaza tendo la Mungu; watafahamu alichokifanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila mtu” au “binadamu wote.” Kiebrania kina כָּל־אָדָם (kol ʾadam), usemi wa kijumla unaomaanisha wanadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: wataogopa
  rationale: Kitenzi ירא kinaweza kueleza hofu pamoja na kicho. Katika muktadha wa hukumu ya Mungu, “wataogopa” huhifadhi uzito huo bila kukifafanua kupita kiasi; mfuatano wa kishairi umeelezwa kwa wakati ujao.
- source_word: כָּל אָדָם
  choice: wanadamu wote
  rationale: אָדָם limetumiwa hapa kwa maana ya kijumla, yaani jamii yote ya binadamu, si mwanamume mmoja mmoja pekee. “Wanadamu wote” ni Kiswahili cha kawaida, sahihi na chenye hadhi.
- source_word: וַיַּגִּידוּ
  choice: watatangaza
  rationale: Katika Hifili, נגד humaanisha kujulisha au kutangaza. “Watatangaza” linafaa kwa ushuhuda wa wazi kuhusu tendo la Mungu.
- source_word: פֹּעַל אֱלֹהִים
  choice: tendo la Mungu
  rationale: פֹּעַל hurejelea tendo, kazi au utendaji. “Tendo la Mungu” linaonyesha kitendo chake maalumu katika muktadha bila kuongeza ufafanuzi usiokuwamo.
- source_word: וּמַעֲשֵׂהוּ
  choice: alilolitenda
  rationale: Kwa maana halisi ni “tendo lake/kazi yake.” Muundo “alilolitenda” huepuka urudiaji mzito huku ukihifadhi wazo la jambo ambalo Mungu amefanya.
- source_word: הִשְׂכִּילוּ
  choice: wataelewa
  rationale: Hifili ya שׂכל inaweza kumaanisha kuelewa, kupata ufahamu au kutenda kwa hekima. Kwa kuwa hapa inaelekezwa kwa tendo la Mungu, “wataelewa” ndilo linalofikisha maana ya kupata ufahamu kuhusu alichofanya.
theological_decisions:
- issue: Maana ya kijumla ya אָדָם
  choice: wanadamu wote
  alternative: kila mtu; binadamu wote
  rationale: Nomino hiyo ni ya umoja kisarufi lakini hapa inawakilisha watu kwa ujumla. Tafsiri haifungi maana kwa wanaume pekee.
- issue: Aina ya hofu katika ירא
  choice: wataogopa
  alternative: watakuwa na kicho
  rationale: Neno la Kiebrania linaweza kuhusisha hofu ya hukumu na kicho mbele za Mungu. “Wataogopa” huhifadhi mvutano huo badala ya kuufanya uwe kicho pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi fupi inahifadhi usambamba wa kishairi; “tendo” na “alilolitenda” huepuka urudiaji usio wa lazima bila kupoteza uhusiano wa vipashio vya Kiebrania.
