base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/007.yaml
  text: But God shoots an arrow at them[a]; suddenly they are wounded.
translation:
  language: sw
  text: Lakini Mungu anawapiga kwa mshale[a]; ghafula wanajeruhiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na muundo wa Kiebrania, “Lakini Mungu aliwafyatulia mshale; ghafula wakawa na majeraha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרֵם
  choice: anawafyatulia
  rationale: Kitenzi cha Kiebrania kutoka ירה kinamwonyesha Mungu akiwalenga na kuwapiga kwa kurusha mshale. Wakati uliopo wa kisimulizi unahifadhi uhai wa ushairi wa Zaburi, huku kiambishi -wa- kikibeba maana ya ‘wao.’
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hapa neno hili linamtaja Mungu mmoja, ambaye ndiye mtendaji wa hukumu katika sentensi.
- source_word: חֵץ
  choice: mshale
  rationale: Hii ndiyo maana ya moja kwa moja ya nomino ya Kiebrania na inadumisha taswira ya kishairi ya hukumu ya Mungu.
- source_word: פִּתְאֹם
  choice: ghafula
  rationale: Neno hili linaonyesha kwamba hukumu inawajia kwa ghafla na bila kutarajiwa.
- source_word: הָיוּ מַכּוֹתָם
  choice: wanajeruhiwa
  rationale: Muundo wa Kiebrania ni mfupi na kwa karibu zaidi unasema kwamba majeraha yao yakawa au yakatokea. Kiswahili ‘wanajeruhiwa’ kinaeleza kwa kawaida matokeo ya mshale bila kuondoa ukali wa tukio.
theological_decisions:
- issue: Taswira ya Mungu akitekeleza hukumu
  choice: Mungu anaonyeshwa wazi kuwa ndiye anayewafyatulia waovu mshale.
  alternative: Kufanya tukio lionekane tu kama hali iliyowageukia bila Mungu kutenda moja kwa moja.
  rationale: Kiebrania kinamtaja Mungu kuwa kiima cha tendo. Tafsiri inahifadhi uwakala huo na taswira ya mshale bila kuongeza maelezo ya kimadhehebu.
- issue: Wakati wa tendo katika ushairi
  choice: 'Kutumia wakati uliopo wa kisimulizi: ‘anawafyatulia … wanajeruhiwa.’'
  alternative: 'Kutumia wakati uliopita: ‘aliwapiga … majeraha yao yakatokea.’'
  rationale: Wayyiqtol ya Kiebrania husimulia tendo, lakini katika muktadha huu wa kishairi wakati uliopo wa kisimulizi unasikika wa asili kwa Kiswahili na kuhifadhi uhai wa tukio. Uundaji wa wakati uliopita umetolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. ‘Kuwafyatulia mshale’ ni usemi wa kawaida unaohifadhi tendo la kulenga na kurusha; ‘ghafula’ hudumisha mkazo wa hukumu isiyotazamiwa.
