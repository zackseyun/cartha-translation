translation:
  language: sw
  text: Wanachunguza maovu; husema, “Tumekamilisha mpango uliochunguzwa kwa makini.”[a] Ndani ya kila mtu, na moyo wake, ni vya kina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirai cha Kiebrania hakiko wazi. Kwa karibu zaidi kinaweza kutafsiriwa, “Tumekamilisha uchunguzi uliochunguzwa kwa kina.”
    reason: Kuhifadhi ugumu wa kisarufi na urudishaji wa mzizi unaomaanisha kutafuta au kuchunguza kwa bidii, bila kudai kwamba “mpango” ndiyo maana ya pekee.
lexical_decisions:
- source_word: יַחְפְּשׂוּ עוֹלֹת
  choice: Wanabuni maovu
  rationale: Kitenzi kinamaanisha kutafuta au kuchunguza kwa bidii; katika muktadha huu kinaeleza kubuni kwa makini matendo au mipango miovu. Tafsiri hii ni ya kawaida kwa Kiswahili bila kupoteza wazo la kupanga maovu.
- source_word: תַּמְנוּ חֵפֶשׂ מְחֻפָּשׂ
  choice: Tumekamilisha njama iliyopangwa kwa uangalifu
  rationale: Kirai hiki kigumu kinajumuisha wazo la kukamilisha na jambo lililotafutwa au kuchunguzwa kwa kina. “Njama iliyopangwa kwa uangalifu” inafaa muktadha, huku tanbihi ikihifadhi uwezekano wa tafsiri ya karibu zaidi na muundo wa Kiebrania.
- source_word: וְקֶרֶב אִישׁ וְלֵב עָמֹק
  choice: Undani wa kila mtu na moyo wake ni wenye kina
  rationale: “Undani” huwakilisha sehemu ya ndani ya mtu, na “moyo” katika Kiebrania unaweza kuwa kitovu cha fikira na nia. Muundo wa sentensi umehifadhi taswira ya kina cha ndani cha mwanadamu.
theological_decisions:
- issue: Kina cha nafsi na moyo wa mwanadamu
  choice: Undani wa kila mtu na moyo wake ni wenye kina
  alternative: Mawazo ya ndani na moyo wa mwanadamu haviwezi kuchunguzika
  rationale: Matini ya Kiebrania husema kwa ufupi kwamba sehemu ya ndani na moyo ni “kirefu/kina”; haisemi wazi kwamba haviwezi kuchunguzika. Tafsiri iliyochaguliwa inadumisha taswira na utata huo bila kuongeza hitimisho la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Wanabuni maovu” na “njama” ni maneno ya sasa na ya kawaida; sentensi ya mwisho imeachwa katika mtindo wa kishairi ili kuhifadhi taswira na mkazo wa Kiebrania.
