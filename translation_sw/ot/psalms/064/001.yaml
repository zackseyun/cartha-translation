  naturalness: “Ee Mungu, sikia sauti yangu ninapolalamika” is idiomatic, prayerful Standard East African Swahili. “Ulinde uhai wangu dhidi ya hofu ya adui” is also natural, though it retains the Hebrew’s compact and somewhat poetic expression.
  terminology: “Ee Mungu,” “sauti yangu,” “ulinde,” and “uhai wangu” are appropriate. The footnote accurately identifies inward reflection and spoken complaint as possible senses of the Hebrew term.
