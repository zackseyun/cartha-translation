  text: שְׁמַע אֱלֹהִ֣ים קוֹלִ֣/י בְ/שִׂיחִ֑/י מִ/פַּ֥חַד א֝וֹיֵ֗ב תִּצֹּ֥ר חַיָּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/001.yaml
  text: Hear[a], O God, my voice in my complaint; preserve my life from the fear of the enemy.
translation:
  language: sw
  text: Ee Mungu, sikia sauti yangu ninapolalamika[a]; ulinde uhai wangu dhidi ya hofu ya adui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ninapotafakari” au “ninapowaza.” Neno la Kiebrania linaweza kurejelea tafakari ya ndani na pia malalamiko yanayotamkwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: isikilize
  rationale: Ni amri ya moja kwa moja kwa Mungu. ‘Isikilize’ ni ya kawaida katika Kiswahili na, pamoja na ‘sauti yangu,’ huonyesha ombi la kusikiliza kwa makini.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Ni usemi wa kumwita Mungu moja kwa moja; ‘Ee Mungu’ hudumisha mtindo wa sala ulio wa asili na wenye heshima.
- source_word: קוֹלִי
  choice: sauti yangu
  rationale: Hudumisha picha halisi ya Kiebrania badala ya kuibadili tu kuwa ‘mimi’ au ‘sala yangu.’
- source_word: בְשִׂיחִי
  choice: ninapolalamika
  rationale: Neno linaweza kumaanisha kutafakari, kuwaza, au kulalamika. Katika ombi hili la kulindwa dhidi ya adui, maana ya kutoa malalamiko au maombolezo inafaa zaidi; tanbihi inahifadhi uwezekano mwingine.
- source_word: מִפַּחַד
  choice: dhidi ya hofu ya
  rationale: פַּחַד huonyesha hofu, kitisho, au woga. ‘Dhidi ya hofu ya’ ni ya asili katika ombi la ulinzi na haiiongezi maana kuwa hofu kali kupita kiasi.
- source_word: אוֹיֵב
  choice: adui
  rationale: Hudumisha umoja wa Kiebrania, ambao pia unaweza kutumiwa kwa maana ya jumla au ya kiwakilishi katika ushairi.
- source_word: תִּצֹּר
  choice: ulinde
  rationale: Kitenzi נצר humaanisha kulinda, kuhifadhi, au kutunza. ‘Ulinde’ kinaeleweka kwa urahisi na kinafaa kwa kitu kinacholindwa, yaani uhai.
- source_word: חַיָּי
  choice: uhai wangu
  rationale: Ni tafsiri ya kawaida ya maana ya ‘maisha yangu’; ‘uhai wangu’ hapa husisitiza kuokolewa na tishio bila kuingiza dhana ya ‘roho.’
theological_decisions:
- issue: Maana ya בְשִׂיחִי katika muktadha wa maombolezo
  choice: ninapolalamika
  alternative: ninapotafakari / ninapowaza
  rationale: Muktadha wa kuomba ulinzi dhidi ya adui unaunga mkono maana ya malalamiko au maombolezo, lakini neno lenyewe linaweza pia kurejelea tafakari ya ndani; utata huo umehifadhiwa katika tanbihi.
- issue: Uhusiano wa מִפַּחַד na ombi la kulindwa
  choice: dhidi ya hofu ya adui
  alternative: dhidi ya kitisho cha adui
  rationale: Kiebrania kinaweza kueleza ama hofu inayosababishwa na adui ama kitisho kinachotoka kwake. Tafsiri kuu inafuata kwa karibu neno ‘hofu’ bila kufunga kabisa upeo wa maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sala ulio wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo ‘sauti yangu’ umehifadhiwa kwa ukaribu na Kiebrania, huku ‘ninapolalamika’ ukifanya sentensi iwe ya asili.
