lexical_decisions:
- source_word: לִירוֹת
  choice: wampige kwa mishale
  rationale: Katika muktadha huu wa shambulio la kuvizia, kitenzi ירה humaanisha kupiga kwa kitu kinachorushwa, hasa mshale. Kutaja mishale huepuka maana ya kisasa ya kupiga kwa bunduki katika Kiswahili.
- source_word: בַּמִּסְתָּרִים
  choice: kutoka mafichoni
  rationale: Nomino hii hurejelea mahali palipofichika. Ingawa kihusishi cha Kiebrania kwa kawaida ni ‘katika,’ hapa ‘kutoka mafichoni’ hutoa kwa kawaida picha ya washambuliaji wanaofyatua wakiwa wamejificha.
- source_word: תָּם
  choice: mtu asiye na hatia
  rationale: Neno תם linaweza kueleza uadilifu au kutokuwa na hatia. Katika shambulio hili lisilo la haki, ‘mtu asiye na hatia’ ni la asili na linaacha mbadala wa ‘mtu asiye na lawama’ katika tanbihi.
- source_word: פִּתְאֹם
  choice: ghafla
  rationale: Huwasilisha moja kwa moja hali ya shambulio kutokea bila onyo.
- source_word: יֹרֻהוּ
  choice: wanampiga kwa mishale
  rationale: Kiambishi cha nafsi ya tatu umoja kinamrejelea mtu תם. Usemi huu hudumisha tendo la kumshambulia kwa mishale bila kuingiza bunduki.
- source_word: וְלֹא יִירָאוּ
  choice: wala hawaogopi
  rationale: Huhifadhi ufupi na utata wa Kiebrania, ambacho hakitaji wanachokiogopa au yule wanayemwogopa.
