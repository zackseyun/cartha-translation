  yaml_path: translation/ot/psalms/064/005.yaml
  text: They strengthen for themselves an evil matter[a]; they talk of hiding snares; they say[b], “Who will see them?”
translation:
  language: sw
  text: Wanalitia nguvu jambo ovu kwa ajili yao wenyewe[a]; wanazungumzia kuficha mitego; wanasema, “Ni nani atakayewaona?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Jambo ovu” linaweza pia kutafsiriwa “mpango mwovu” au “njama mbaya,” kwa kuwa neno la Kiebrania linaweza kumaanisha “neno,” “jambo,” au “shughuli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Ni nani atakayeiona?” au “Ni nani atakayetuona?” Kiebrania kina kiwakilishi cha nafsi ya tatu wingi (“wao”), lakini kile kinachorejelewa hakijawekwa wazi katika ushairi huu.
    reason: alternative_reading
lexical_decisions:
- source_word: יְחַזְּקוּ לָמוֹ
  choice: Wanajitia nguvu
  rationale: Pieli ya חזק ina maana ya kufanya imara au kutia nguvu; kiwakilishi hapa kinaweza kueleweka kwa maana ya kujirejelea. Tafsiri hii huhifadhi nguvu ya kitenzi bila kufafanua njama kupita kiasi.
- source_word: דָּבָר רָע
  choice: jambo ovu
  rationale: דבר inaweza kumaanisha neno, jambo, au shughuli. “Jambo ovu” huhifadhi upana huo, huku muktadha ukidokeza mpango mbaya.
- source_word: יְסַפְּרוּ
  choice: wanazungumzia
  rationale: Pieli ya ספר hapa inaeleza kusema au kujadiliana kuhusu kitendo kinachofuata; “wanazungumzia” ni Kiswahili cha kawaida kinachofaa muktadha wa kupanga njama.
- source_word: לִטְמוֹן מוֹקְשִׁים
  choice: kuficha mitego
  rationale: טמן humaanisha kuficha, na מוקשים ni mitego. Tafsiri hii inafuata maana ya msingi ya maneno na kuhifadhi picha ya mitego iliyofichwa.
- source_word: אָמְרוּ
  choice: wanasema
  rationale: Ingawa umbo ni qatal, katika mtiririko wa kishairi linaweza kuripoti kauli kwa hali ya sasa sambamba na vitenzi vilivyotangulia.
- source_word: מִי יִרְאֶה לָמוֹ
  choice: Ni nani atakayeiona?
  rationale: Kiwakilishi cha Kiebrania ni nafsi ya tatu wingi, lakini kile kinachoonekana hakijaelezwa wazi. Kiswahili “kuiona” hurejelea kwa kawaida mitego au njama hiyo bila kuibadili kuwa nafsi ya kwanza.
