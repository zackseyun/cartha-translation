translation:
  language: sw
  text: 'Unifiche kutoka katika shauri la siri la watenda maovu,[a]


    kutoka katika msukosuko wa wafanyao maovu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “njama ya siri ya watenda maovu.” Neno la Kiebrania סוֹד linaweza kumaanisha shauri la faragha, kundi la ndani, au mpango wa siri.
    reason: lexical_alternative
  - marker: b
    text: Au, “ghasia” au “makelele ya wafanyao maovu.” Neno la Kiebrania רִגְשָׁה hudokeza msukosuko wa uhasama, mkusanyiko wenye fujo, au makelele.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּירֵנִי
  choice: Unifiche
  rationale: Hifili ya סתר yenye kiambishi cha nafsi ya kwanza umoja ina maana ya ‘nifiche/nisitiri.’ Katika muktadha huu ni ombi la moja kwa moja kwa Mungu; ‘Unifiche’ ni Kiswahili cha kawaida na wazi.
- source_word: מִסּוֹד
  choice: kutoka katika shauri la siri
  rationale: סוֹד inaweza kumaanisha shauri la faragha, kundi la ndani, au mpango wa siri. ‘Shauri la siri’ huhifadhi wazo la kujadiliana kwa siri bila kulibana neno kuwa njama pekee.
- source_word: מְרֵעִים
  choice: watenda maovu
  rationale: Mshiriki kutoka רעע huonyesha watu wanaotenda mabaya. ‘Watenda maovu’ huhifadhi maana tendaji na inaeleweka kwa urahisi.
- source_word: מֵרִגְשַׁת
  choice: kutoka katika ghasia
  rationale: רִגְשָׁה huashiria msukosuko, makelele, au mkusanyiko wenye fujo na uhasama. ‘Ghasia’ ni neno la sasa linaloonyesha vurugu hiyo bila kudai kwa lazima kuwa ni umati mkubwa.
- source_word: פֹּעֲלֵי אָוֶן
  choice: watendao uovu
  rationale: Kirai hiki humaanisha wanaofanya אָוֶן. ‘Watendao uovu’ ni cha asili na huhifadhi nguvu ya kitendo kinachoendelea au cha kawaida.
