  language: sw
  text: 'ambao wamenoa ulimi wao kama upanga;

    wameelekeza mshale wao—neno chungu—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁנְנוּ
  choice: wamenoa
  rationale: Kitenzi hiki humaanisha kunoa; picha ya ulimi kuwa kama upanga imehifadhiwa moja kwa moja.
- source_word: לְשׁוֹנָם
  choice: ulimi wao
  rationale: Umoja wa kijumla katika Kiebrania umehifadhiwa, ukitaja ulimi kama chombo cha usemi wenye kudhuru.
- source_word: דָּרְכוּ
  choice: wamepinda upinde wao ili kurusha
  rationale: Kitenzi kinarejelea kukanyaga au kupinda upinde ili kuutayarisha; neno 'upinde' limewekwa wazi kwa Kiswahili cha kawaida kwa kuwa limeachwa kudokezwa katika Kiebrania.
- source_word: חִצָּם
  choice: mshale wao
  rationale: Tafsiri ya moja kwa moja ya nomino yenye kiambishi cha umilikaji.
- source_word: דָּבָר מָר
  choice: neno chungu
  rationale: Hudumisha sitiari ya Kiebrania inayolinganisha usemi mchungu na mshale, bila kuibadili kuwa maelezo ya jumla.
theological_decisions:
- issue: Uhusiano kati ya 'mshale wao' na 'neno chungu'
  choice: Mstari mrefu unaonyesha kwamba 'neno chungu' linafafanua mshale.
  alternative: Kutafsiri kana kwamba neno chungu ni kitu tofauti na mshale.
  rationale: Muundo wa Kiebrania unaweka דָּבָר מָר baada ya חִצָּם kama ufafanuzi wa kisitiari; uakifishaji hudumisha picha hiyo bila kuondoa mvutano wa kishairi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Tamathali sambamba za upanga na mshale zimehifadhiwa; maneno machache yaliyodokezwa katika Kiebrania yamewekwa wazi kwa ufasaha wa Kiswahili.
