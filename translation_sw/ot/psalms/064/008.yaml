  yaml_path: translation/ot/psalms/064/008.yaml
  text: They are made to stumble[a]; their own tongue is against them[b]; all who see them shake their heads.
translation:
  language: sw
  text: Wamefanywa wajikwae[a]; ulimi wao wenyewe uko dhidi yao; wote wanaowaona wanatikisa vichwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Ulimi wake/huo ulimfanya yeye/huo ajikwae juu yao.” Muundo wa kishazi hiki katika Kiebrania ni mgumu, na tafsiri hutofautiana kuhusu uhusiano wa viwakilishi. Maandishi makuu yanafuata maana kwamba waovu wanaangushwa na usemi wao wenyewe.
    reason: alternative_reading
  - marker: b
    text: Kitenzi hiki pia kinaweza kutafsiriwa “wanatikisa vichwa kwa dharau,” “wanatetemeka,” au, katika miktadha mingine, “wanakimbia mbali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְשִׁילוּהוּ
  choice: Wamefanywa wajikwae
  rationale: Kitenzi cha Hifili kutoka כשׁל kina maana ya kusababisha kujikwaa au kuanguka. Ingawa kiambishi cha Kiebrania ni nafsi ya tatu umoja wa kiume (‘yeye/huo’), muundo wa kishairi hapa ni mgumu na muktadha una warejelea waovu kwa pamoja; Kiswahili cha wingi kinawasilisha maana hiyo kwa uwazi bila kuficha ugumu wa asili, ambao umeelezwa katika tanbihi.
- source_word: עָלֵימוֹ
  choice: dhidi yao
  rationale: Kihusishi על pamoja na kiambishi kinaweza kumaanisha ‘juu yao’ au ‘dhidi yao.’ Hapa maana ya uadui au matokeo yanayowarudia inaendana na ulimi wao kuwa sababu ya kuanguka kwao.
- source_word: לְשׁוֹנָם
  choice: ulimi wao wenyewe
  rationale: Umoja wa kishirikishi ‘ulimi wao’ umehifadhiwa ili kudumisha taswira halisi ya usemi kama chombo cha kuanguka kwao; ‘wenyewe’ huonyesha kuwa maneno yao yanawarudia bila kuongeza fundisho la nje.
- source_word: יִתְנֹדֲדוּ
  choice: wanatikisa vichwa
  rationale: נוד inaweza kueleza kutikisika, kutangatanga, kushtuka, au kufanya ishara. Katika kishazi ‘wote wanaowaona,’ kutikisa vichwa ni mwitikio unaoonekana na ni usemi wa kawaida wa Kiswahili, huku maana nyingine zikihifadhiwa katika tanbihi.
- source_word: כָּל רֹאֵה בָם
  choice: wote wanaowaona
  rationale: Tafsiri ya moja kwa moja na ya asili ya kishazi cha kitenzi-jina, ikihifadhi wigo wa ‘wote’ na kiwakilishi cha yambwa ‘wao.’
theological_decisions:
- issue: Uhusiano wa viwakilishi katika kishazi cha kwanza
  choice: Waovu wanaelezwa kwa wingi kuwa wamefanywa wajikwae, na ulimi wao wenyewe uko dhidi yao.
  alternative: ‘Ulimi wake/huo ulimfanya yeye/huo ajikwae juu yao.’
  rationale: Kiebrania kina kiambishi cha umoja katika וַיַּכְשִׁילוּהוּ lakini viwakilishi vya wingi katika עָלֵימוֹ na לְשׁוֹנָם. Tafsiri kuu inafuata mfuatano wa maana katika muktadha—waovu wanaangushwa na usemi wao—lakini haidai kwamba sintaksia yenye utata ina jibu moja tu; usomaji rasmi zaidi umetolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Kujikwaa’ huhifadhi taswira ya Kiebrania, na ‘wanatikisa vichwa’ ni usemi wa sasa na wa kawaida. Alama zote za tanbihi zimewekwa katika maandishi makuu karibu na sehemu zinazohusika.
