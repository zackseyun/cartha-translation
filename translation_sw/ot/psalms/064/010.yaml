  text: יִשְׂמַ֬ח צַדִּ֣יק בַּ֭/יהוָה וְ/חָ֣סָה ב֑/וֹ וְ֝/יִתְהַֽלְל֗וּ כָּל יִשְׁרֵי לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/010.yaml
  text: The righteous will rejoice in Yahweh and take refuge in him[a], and all the upright in heart will glory.
translation:
  language: sw
  text: Mwenye haki atafurahi katika Yahweh, naye atakimbilia kwake; wote wenye moyo mnyofu watajivunia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watashangilia kwa fahari.” Kitenzi cha Kiebrania kinaweza kumaanisha kujisifu au kushangilia; hapa maana ni chanya, katika muktadha wa Mungu na tendo lake la kuokoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂמַח
  choice: atamfurahia
  rationale: Kauli ya wakati usiotimilika katika muktadha huu wa kishairi inaeleza matokeo yanayotarajiwa. ‘Atamfurahia’ ni Kiswahili cha kawaida kinachoonyesha furaha inayomwelekea Yahweh.
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Kivumishi cha umoja kimetumiwa kama nomino. ‘Mwenye haki’ huhifadhi umoja bila kuongeza neno ‘mwanamume,’ na katika muktadha humwakilisha mtu mwadilifu.
- source_word: בַּיהוָה
  choice: Yahweh
  rationale: Jina la agano יְהוָה limetafsiriwa moja kwa moja kuwa ‘Yahweh.’ Uhusiano wa kihusishi umeelezwa kwa muundo wa kawaida wa Kiswahili, ‘atamfurahia Yahweh.’
- source_word: וְחָסָה בּוֹ
  choice: na kupata kimbilio kwake
  rationale: Kitenzi חסה kinamaanisha kutafuta au kupata hifadhi na ulinzi. Tafsiri hii inadumisha taswira ya kimbilio badala ya kuipanua kuwa ‘kumtumaini’ tu.
- source_word: וְיִתְהַלְלוּ
  choice: wataona fahari
  rationale: Hitpaeli ya הלל hapa huonyesha kujisifu, kuona fahari, au kushangilia kwa sababu ya tendo la Mungu. ‘Wataona fahari’ huepuka dhana ya majivuno ya dhambi huku ikidumisha maana chanya ya kushangilia kwa fahari.
- source_word: כָּל
  choice: wote
  rationale: Hii ni tafsiri ya kawaida ya kiashirio hiki cha ujumla, ikipatana na kundi la watu linalofuata.
- source_word: יִשְׁרֵי לֵב
  choice: walio wanyofu moyoni
  rationale: Usemi huu wa Kiebrania unaeleza watu wenye unyofu wa ndani. Tafsiri inadumisha picha ya moyo kama kitovu cha tabia na nia.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja; ‘Yahweh’ huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Kitu cha kujisifia au kuona fahari katika mstari wa mwisho
  choice: Hakijaongezwa wazi katika matini
  alternative: watajivunia Yahweh / watajivunia tendo lake la kuokoa
  rationale: Kitenzi cha Kiebrania hakitaji kitu chake moja kwa moja. Muktadha unaelekeza kwa Mungu na tendo lake, lakini tafsiri haiongezi maneno hayo na hivyo inadumisha uwazi wa kimuundo wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni ya kishairi lakini rahisi kueleweka; taswira za ‘kimbilio,’ ‘moyo,’ na ‘fahari’ zimehifadhiwa.
