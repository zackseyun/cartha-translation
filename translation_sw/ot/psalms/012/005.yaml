base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/005.yaml
  text: Because of the devastation of the poor[a], because of the groaning of the needy, now I will arise, says Yahweh; I will set him in the safety for which he longs.
translation:
  language: sw
  text: '“Kwa sababu ya maangamizi yanayowapata maskini,

    kwa sababu ya mlio wa kuugua kwa wahitaji,

    sasa nitasimama,” asema Yahweh;

    “nitamweka katika usalama anaoutamani.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania cha kishazi cha mwisho ni kigumu. Kwa karibu zaidi: “Nitaweka katika usalama; anahema kwa hamu.” Wengine huelewa maana yake kuwa: “Nitamweka salama dhidi ya yule anayemkoromea,” au maneno yanayofanana na hayo.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִשֹּׁד עֲנִיִּים
  choice: kwa sababu ya maangamizi yanayowapata maskini
  rationale: מִן imetafsiriwa kwa maana ya sababu, nayo שֹׁד inaonyesha uharibifu mkali, uporaji, au jeuri yenye kuangamiza. Muundo huu wa Kiswahili ni wa kawaida na unaonyesha kwamba maskini ndio wanaopatwa na maangamizi.
- source_word: מֵאַנְקַת אֶבְיוֹנִים
  choice: kwa sababu ya kuugua kwa wahitaji
  rationale: 'Kirai hiki kinaenda sambamba na cha kwanza: מִן inaonyesha sababu, אַנְקָה ni kuugua kwa uchungu, na אֶבְיוֹנִים inasisitiza hali ya uhitaji.'
- source_word: עַתָּה אָקוּם
  choice: sasa nitasimama
  rationale: Huhifadhi uharaka wa עַתָּה na taswira ya Mungu kuinuka au kusimama ili achukue hatua.
- source_word: יֹאמַר יְהוָה
  choice: asema Yahwe
  rationale: Wakati usiotimilika wa יֹאמַר katika kauli hii umetolewa kwa wakati wa sasa wa Kiswahili, na jina la agano יְהוָה limetoholewa kama Yahwe.
- source_word: אָשִׁית בְּיֵשַׁע
  choice: nitamweka salama
  rationale: שׂים ni kuweka, na יֵשַׁע hapa inaelekea kueleza hali ya usalama au wokovu. Kiswahili hiki kinatoa matokeo halisi ya kuokolewa bila kuwa kizito.
- source_word: יָפִיחַ לוֹ
  choice: kama anavyotamani
  rationale: Kiebrania cha maneno haya ni kigumu. Tafsiri kuu inafuata uwezekano wa kuona יפיח kama kupumua kwa hamu au kutamani, huku mhusika akiwa yule mhitaji aliyewekwa salama.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandiko yana jina lenyewe, si cheo. “Yahwe” ni umbo la kawaida na linalosomeka kwa Kiswahili la jina YHWH, na huepuka kulibadilisha kuwa cheo.
- issue: Mhusika na maana ya kishazi cha mwisho
  choice: Mungu atamweka mhitaji salama kama anavyotamani
  alternative: Mungu atamweka salama dhidi ya mtu anayemkoromea au kumpulizia kwa dharau
  rationale: Muundo wa Kiebrania una utata halisi. Tafsiri kuu inachagua maana inayolingana vizuri na kuugua kwa wahitaji, lakini maana mbadala haijaondolewa kimya kimya na imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. Mistari imepangwa kishairi, na tanbihi imewekwa kwenye kishazi ambacho utata wake unahusika moja kwa moja.
