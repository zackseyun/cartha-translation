lexical_decisions:
- source_word: שָׁוְא
  choice: maneno ya ubatili
  rationale: Neno hili linahusu yaliyo matupu, yasiyo na thamani, au ya uongo. “Maneno ya ubatili” linahifadhi upana huo bila kuyapunguza kuwa uongo wa moja kwa moja tu.
- source_word: יְדַבְּרוּ / יְדַבֵּרוּ
  choice: wanasema ... wanasema
  rationale: Kurudia kitenzi kunafuata muundo na msisitizo wa ushairi wa Kiebrania.
- source_word: אִישׁ אֶת־רֵעֵהוּ
  choice: kila mtu kwa mwenzake
  rationale: אִישׁ limetumiwa kwa maana ya kila mmoja, na רֵעֵהוּ humaanisha jirani, mwenzi, au mshirika. “Mwenzake” ni pana na ya kawaida katika Kiswahili.
- source_word: שְׂפַת חֲלָקוֹת
  choice: midomo ya kujipendekeza
  rationale: Kisahili ni “midomo ya ulaini”; hapa ulaini huo unaonyesha maneno matamu ya kujipendekeza yanayotumiwa kwa udanganyifu.
- source_word: בְּלֵב וָלֵב
  choice: kwa moyo wa kuwili
  rationale: Nahau hiyo ni “kwa moyo na moyo.” “Moyo wa kuwili” huhifadhi taswira ya moyo wenye pande mbili na maana ya kutokuwa mkweli bila kuifafanua kupita kiasi.
