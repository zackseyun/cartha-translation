base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/006.yaml
  text: The words of Yahweh are pure words[a], like silver refined in a furnace on the earth[b], purified seven times.
translation:
  language: sw
  text: 'Maneno ya Yahweh ni maneno safi,


    kama fedha iliyosafishwa katika tanuru[a] juu ya ardhi,[b]


    i iliyotakaswa mara saba.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika kalibu” au “katika chungu cha kuyeyushia metali.” Neno la Kiebrania ni adimu, na kitu hasa kinachorejelewa hakijulikani kwa uhakika, ingawa kwa wazi muktadha ni wa kusafisha metali.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “juu ya ardhi.” Huenda kirai hiki kinaeleza mahali au mazingira ya kusafishia fedha; maana yake mahususi haijulikani kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמֲרוֹת / אֲמָרוֹת
  choice: maneno
  rationale: Nomino inayorudiwa inamaanisha kwa upana maneno au matamshi. “Maneno” ni ya kawaida, yenye hadhi, na haiibani maana iwe ahadi pekee.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limeandikwa kwa unukuzi “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: טְהֹרוֹת
  choice: safi
  rationale: Kivumishi hiki huonyesha usafi. “Safi” kinafaa kwa maneno ya Yahweh na pia kinaendana na mfano wa kusafisha fedha.
- source_word: כֶּסֶף
  choice: fedha
  rationale: Nomino hii inamaanisha metali ya fedha inayotumiwa katika tashbihi.
- source_word: צָרוּף
  choice: iliyosafishwa
  rationale: Umbo hili humweleza metali iliyopitia hatua ya kuondolewa uchafu; “iliyosafishwa” linaendeleza taswira ya uyeyushaji kwa Kiswahili cha kawaida.
- source_word: בַּעֲלִיל
  choice: katika tanuru
  rationale: Neno hili adimu halina rejeleo lililo hakika, lakini muktadha wa fedha na utakaso unaonyesha chombo au mahali pa kusafishia metali. “Tanuru” linatoa taswira hiyo kwa uwazi bila kudai uhakika usiopo.
- source_word: לָאָרֶץ
  choice: juu ya ardhi
  rationale: Kirai hiki kina utata wa kisintaksia. Tafsiri ya karibu “juu ya ardhi” inahifadhi maneno ya Kiebrania bila kuamua kama yanaonyesha mahali, mazingira, au uhusiano mwingine wa mchakato wa kusafisha.
- source_word: מְזֻקָּק
  choice: iliyotakaswa
  rationale: Kitenzi hiki kinaendeleza na kusisitiza taswira ya kuondoa uchafu. “Iliyotakaswa” huepuka kurudia “iliyosafishwa” huku kikihifadhi maana inayokaribiana.
- source_word: שִׁבְעָתָיִם
  choice: mara saba
  rationale: Kirai hiki huonyesha kurudiwa mara saba, ambako katika ushairi wa Kiebrania hudokeza utakaso kamili au wa kina kabisa.
theological_decisions:
- issue: Asili ya usafi wa maneno ya Yahweh
  choice: Mstari unasema kwamba maneno ya Yahweh ni safi kabisa na ya kutegemewa, kwa kutumia taswira ya fedha iliyosafishwa kikamilifu.
  alternative: Kuufanya usafi huu kuwa wa kimaadili pekee, au kuongeza fundisho la baadaye kuhusu namna maandishi ya Biblia yalivyohifadhiwa.
  rationale: Kiebrania chenyewe hulinganisha maneno ya Yahweh na fedha iliyotakaswa sana. Tafsiri inadumisha dai hilo la kishairi bila kuongeza mafundisho ambayo mstari hautamki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishairi na urudiaji wa “maneno” umehifadhiwa. Lugha ya taswira ya kusafisha metali ni rahisi kueleweka, huku tanbihi zikihifadhi utata halisi wa בַּעֲלִיל na לָאָרֶץ.
