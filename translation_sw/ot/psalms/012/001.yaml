base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/001.yaml
  text: Save[a], O Yahweh, for the godly are gone[b]; for the faithful have vanished from among the sons of man.
translation:
  language: sw
  text: Ee Yahweh, okoa, kwa maana mtu mcha Mungu ametoweka[a]; kwa maana waaminifu wamepotea miongoni mwa wanadamu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wacha Mungu wametoweka,” ikiwa umoja wa Kiebrania unaeleweka kuwa wa uwakilishi; pia inaweza kutafsiriwa, “mtu mwaminifu hayupo tena.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “miongoni mwa wana wa Adamu,” yaani, miongoni mwa jamii ya wanadamu.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹשִׁיעָה
  choice: okoa
  rationale: Amri hii inaelekezwa kwa Mungu katika ombi la dharura; “okoa” ni ya moja kwa moja na ya kawaida katika lugha ya sala ya Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika maandishi ya Kiebrania limehifadhiwa kwa unukuzi “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya ombi; “kwa maana” kinafaa katika ushairi wenye hadhi na kinaeleweka kwa urahisi.
- source_word: גָמַר
  choice: ametoweka
  rationale: Kitenzi kina maana ya kufikia mwisho au kutokuwapo tena; pamoja na mhusika wa kibinadamu wa umoja, “ametoweka” hudumisha picha ya mtu asiyeonekana tena katika jamii.
- source_word: חָסִיד
  choice: mtu mcha Mungu
  rationale: Neno humaanisha mtu mwenye uchaji na uaminifu wa agano. “Mtu mcha Mungu” ni la asili na linaloeleweka, huku umoja wa Kiebrania ukihifadhiwa.
- source_word: פַסּוּ
  choice: wamekwisha
  rationale: Kitenzi cha wingi hueleza kukoma au kutokuwapo tena; “wamekwisha” ni cha kishairi na cha kawaida katika Kiswahili.
- source_word: אֱמוּנִים
  choice: waaminifu
  rationale: Nomino hii ya wingi inawaeleza watu wenye uaminifu, utegemewaji, au uthabiti; “waaminifu” huhifadhi upana huo.
- source_word: מִבְּנֵי אָדָם
  choice: miongoni mwa wanadamu
  rationale: Ni nahau ya Kiebrania, kihalisi “miongoni mwa wana wa Adamu/mwanadamu,” inayorejelea jamii ya binadamu. Kiswahili cha kawaida husema “miongoni mwa wanadamu.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia Tetragramatoni kama jina binafsi. “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Umoja wa חָסִיד na maana yake inayoweza kuwa ya uwakilishi
  choice: mtu mcha Mungu ametoweka
  alternative: wacha Mungu wametoweka
  rationale: Kiebrania kina nomino na kitenzi vya umoja, ingawa katika muktadha vinaweza kumwakilisha kundi zima. Tafsiri kuu huhifadhi umoja, na tanbihi huonyesha uwezekano wa maana ya kijumla.
- issue: Nahau ya kibinadamu בְּנֵי אָדָם
  choice: wanadamu
  alternative: wana wa Adamu
  rationale: Nahau hii humaanisha jamii ya binadamu kwa ujumla. Tafsiri ya maana huepuka Kiswahili kisicho cha kawaida bila kupunguza upeo wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Ee” linaonyesha wito wa moja kwa moja katika sala. Mstari umehifadhi urudiaji wa כִּי kwa kutumia “kwa maana” mara mbili, pamoja na ulinganifu wa kishairi wa Kiebrania.
