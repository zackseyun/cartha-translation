  text: אַתָּֽה יְהוָ֥ה תִּשְׁמְרֵ֑/ם תִּצְּרֶ֓/נּוּ מִן הַ/דּ֖וֹר ז֣וּ לְ/עוֹלָֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/007.yaml
  text: You[a], O Yahweh, will keep them; you will guard us from this generation forever.
translation:
  language: sw
  text: 'Wewe, Ee Yahwe, utawahifadhi;

    utatulinda[a] dhidi ya kizazi hiki milele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinachosomwa (qere) kina “utatutulinda” (wingi wa nafsi ya kwanza). Konsonanti zilizoandikwa (ketiv) zinaweza kusomwa “utamlinda yeye” (umoja); tafsiri nyingine hufuata usomaji huo.
    reason: alternative_reading
lexical_decisions:
- source_word: אַתָּה
  choice: Wewe
  rationale: Kiwakilishi huru cha nafsi ya pili umoja kimewekwa mbele katika Kiebrania kwa ajili ya msisitizo; “Wewe” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: תִּשְׁמְרֵם
  choice: utawahifadhi
  rationale: Kitenzi שׁמר kina maana ya kutunza, kulinda, au kuhifadhi; kiambishi cha wingi wa nafsi ya tatu kimehifadhiwa katika “-wa-.”
- source_word: תִּצְּרֶנּוּ
  choice: utamlinda yeye
  rationale: Kitenzi נצר humaanisha kulinda au kuhifadhi. Umbo la Kimasora lina kiambishi cha nafsi ya tatu umoja, hivyo “-m-” na “yeye” vinahifadhi mabadiliko kutoka wingi hadi umoja na kuyafanya yaonekane wazi.
- source_word: מִן הַדּוֹר זוּ
  choice: dhidi ya kizazi hiki
  rationale: מִן huonyesha kujikinga na kundi lenye uhasama; “dhidi ya” ni ya asili katika Kiswahili, huku דּוֹר זוּ ikitafsiriwa moja kwa moja kuwa “kizazi hiki.”
- source_word: לְעוֹלָם
  choice: milele
  rationale: Hii ndiyo namna ya kawaida na ya kishairi ya kueleza muda usio na mwisho katika muktadha huu.
theological_decisions:
- issue: Mabadiliko ya idadi ya kiwakilishi kati ya “wao” na “yeye”
  choice: 'Kuhifadhi mabadiliko ya Kimasora: “utawahifadhi ... utamlinda yeye”'
  alternative: 'Kusawazisha yote kuwa wingi: “utawahifadhi ... utawalinda”'
  rationale: Kiebrania kinabadilika kutoka kiambishi cha wingi katika kitenzi cha kwanza hadi cha umoja katika cha pili. Tafsiri haifichi mvutano huo wala kuamua kimya kimya kama umoja unamwakilisha kila mmoja wa kundi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Ee” hudumisha mwito wa moja kwa moja, na mistari miwili huhifadhi usambamba wa zaburi.
