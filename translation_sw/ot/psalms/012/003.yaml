  text: יַכְרֵ֣ת יְ֭הוָה כָּל שִׂפְתֵ֣י חֲלָק֑וֹת לָ֝שׁ֗וֹן מְדַבֶּ֥רֶת גְּדֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/003.yaml
  text: May Yahweh cut off all flattering lips[b][a], the tongue that speaks great things.
translation:
  language: sw
  text: 'Yahwe na akate midomo yote yenye kujipendekeza[a],

    ulimi unaonena makuu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “midomo laini”; taswira ya Kiebrania ni ya usemi laini wa kujipendekeza.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “makuu”; yaani maneno ya majivuno au madai ya kiburi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְרֵת
  choice: na aikate
  rationale: 'Hifili isiyokamilika hapa inaeleweka kwa kawaida kama ombi au laana ya kishairi: “na aikate.” Neno hili pia huhifadhi taswira kali ya kukata au kuondoa kabisa.'
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: כָּל
  choice: yote
  rationale: Hutoa maana jumuishi ya Kiebrania na kupatana kisarufi na “midomo.”
- source_word: שִׂפְתֵי חֲלָקוֹת
  choice: midomo yote ya kujipendekeza
  rationale: Kirai hiki kihalisi ni “midomo ya ulaini.” Katika muktadha, ulaini huo ni usemi laini wa hila unaotafuta kujipendekeza; tanbihi imehifadhi taswira halisi.
- source_word: לָשׁוֹן
  choice: ulimi
  rationale: Umoja wa Kiebrania umehifadhiwa ili kudumisha taswira hai ya kiungo cha usemi.
- source_word: מְדַבֶּרֶת
  choice: unaonena
  rationale: Hali ya kushiriki inayoueleza “ulimi” imetafsiriwa kwa kishazi tegemezi cha asili na chenye hadhi ya kishairi.
- source_word: גְּדֹלוֹת
  choice: makuu
  rationale: Tafsiri ya karibu ya neno la Kiebrania ni “makuu.” Muktadha unaonyesha majivuno, lakini tafsiri kuu haijaongeza maana hiyo moja kwa moja; imefafanuliwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya kitenzi יַכְרֵת
  choice: 'ombi: “na aikate”'
  alternative: 'taarifa: “ataikata”'
  rationale: Katika muktadha wa zaburi, umbo lisilokamilika linaweza kuwa ombi au laana, ingawa kisarufi linaweza pia kusomwa kama taarifa ya wakati ujao. Tafsiri ya ombi inafaa mtiririko bila kuondoa ukali wa kitendo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wa sasa na wenye hadhi. “Unaonena” hudumisha sajili ya zaburi bila kuwa ya kizamani kupita kiasi. Alama zote za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
