base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/008.yaml
  text: The wicked walk all around[b][a], when vileness is exalted among the sons of man.
translation:
  language: sw
  text: Waovu hutembea huku na huku,[b] wakati udhalili unapotukuzwa miongoni mwa wanadamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “miongoni mwa wana wa binadamu”; yaani, miongoni mwa wanadamu.
    reason: lexical_alternative
  - marker: b
    text: Au, “Waovu huzunguka kila upande, kadiri udhalili unavyotukuzwa miongoni mwa wanadamu.”
    reason: alternative_reading
lexical_decisions:
- source_word: סָבִיב
  choice: huku na huku
  rationale: Kielezi hiki kinaonyesha kutembea kotekote au pande zote; “huku na huku” ni Kiswahili cha kawaida kinachohifadhi wazo la mwendo unaoenea.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Ni nomino ya wingi inayowataja watu waovu bila kuongeza jinsia isiyodaiwa na Kiebrania.
- source_word: יִתְהַלָּכוּן
  choice: hutembea
  rationale: Hithpael ya הלך ina maana ya kutembea au kwenda huku na huku. “Hutembea” huhifadhi taswira ya msingi bila kuongeza wazo lenye nguvu zaidi la kuvizia.
- source_word: כְּרֻם
  choice: wakati ... yanapoinuliwa
  rationale: Muundo huu mgumu unaeleweka hapa kwa maana ya hali au wakati unaoruhusu waovu kutembea kwa uhuru; tafsiri hii inaacha uwezekano wa “kadiri” katika tanbihi.
- source_word: זֻלּוּת
  choice: mambo ya aibu
  rationale: Nomino hii huonyesha hali au mambo yaliyo duni, yasiyo na thamani, au yenye kuchukiza kimaadili. “Mambo ya aibu” ni ya asili na yanaeleweka kwa wasomaji wa sasa, huku yakihifadhi uzito wa kimaadili.
- source_word: לִבְנֵי אָדָם
  choice: miongoni mwa wanadamu
  rationale: Kihalisi ni “miongoni mwa wana wa Adamu/mwanadamu,” lakini hapa usemi huo una rejeo la jumla kwa jamii ya binadamu. “Wanadamu” huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kuufanya uwe wa wanaume pekee.
- source_word: אָדָם
  choice: wanadamu
  rationale: Katika usemi huu wa muundo, neno lina maana ya pamoja ya jamii ya binadamu, si mtu mmoja wala wanaume pekee.
theological_decisions:
- issue: Usemi wa kiantropolojia לִבְנֵי אָדָם
  choice: miongoni mwa wanadamu
  alternative: miongoni mwa wana wa Adamu
  rationale: Kiebrania kinatumia usemi wenye umbo la kiume lakini rejeo lake ni la binadamu kwa ujumla. Kiswahili “wanadamu” huhifadhi maana ya jumla; umbo halisi zaidi limewekwa katika tanbihi ili kuonyesha taswira ya chanzo.
- issue: Uhusiano wa כְּרֻם na kishazi kikuu
  choice: wakati ... yanapoinuliwa
  alternative: kadiri ... yanavyoinuliwa
  rationale: Kihusishi כ katika muundo huu kinaweza kueleza wakati/hali au uwiano. Maandishi makuu yanatumia maana ya wakati na hali, huku tanbihi ikihifadhi usomaji mbadala wa uwiano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka lakini inadumisha ushairi wa Zaburi. Alama za tanbihi zote zimewekwa katika maandishi makuu.
