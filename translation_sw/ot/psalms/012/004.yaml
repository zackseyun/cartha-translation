  text: who say[a], “With our tongue we will prevail[d][c][b]; our lips are with us—who is lord over us?”
translation:
  language: sw
  text: ambao husema, “Kwa ulimi wetu tutashinda; midomo yetu iko upande wetu[a]—ni nani aliye bwana wetu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “midomo yetu ni mali yetu,” au kwa kufuata maneno ya Kiebrania kwa karibu zaidi, “midomo yetu iko pamoja nasi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר אָמְרוּ
  choice: ambao husema
  rationale: Kiunganishi cha uhusiano kinaendeleza maelezo ya waovu katika mstari uliotangulia; hali ya mazoea inaonyesha msimamo wao unaoendelea.
- source_word: לִלְשֹׁנֵנוּ
  choice: Kwa ulimi wetu
  rationale: 'ל inaeleweka hapa kwa maana ya chombo: ulimi, yaani usemi, ndio njia wanayodai kutumia ili kushinda.'
- source_word: נַגְבִּיר
  choice: tutashinda
  rationale: Hifili ya גבר hapa ina maana ya kujionyesha wenye nguvu au kupata ushindi; katika muktadha wa majivuno kwa maneno, “tutashinda” ni ya kawaida na wazi.
- source_word: שְׂפָתֵינוּ
  choice: midomo yetu
  rationale: Inahifadhi taswira halisi ya Kiebrania badala ya kuibadili kuwa dhana ya jumla ya usemi.
- source_word: אִתָּנוּ
  choice: iko upande wetu
  rationale: Ingawa maana ya moja kwa moja ni “iko pamoja nasi,” katika dai hili fupi inaelekea kuonyesha kuwa midomo yao iko chini ya uwezo wao au inawaunga mkono. “Iko upande wetu” ni ya asili kwa Kiswahili na bado huhifadhi wazo la kuwa pamoja nao.
- source_word: מִי אָדוֹן לָנוּ
  choice: ni nani aliye bwana juu yetu?
  rationale: אָדוֹן ni bwana au mtawala kwa maana ya jumla. Herufi ndogo katika “bwana” huepuka kuifanya kuwa jina mahususi la Mungu, huku “juu yetu” ikionyesha mamlaka wanayoikana.
theological_decisions:
- issue: Maana ya אָדוֹן katika dai la kukataa mamlaka
  choice: bwana
  alternative: mtawala
  rationale: Neno hapa halimtaji YHWH moja kwa moja bali linakanusha kuwa kuna mwenye mamlaka juu yao. “bwana” huhifadhi maana pana ya neno la Kiebrania bila kulifanya jina la Mungu.
- issue: Maana ya אִתָּנוּ katika majivuno ya wasemaji
  choice: iko upande wetu
  alternative: ni mali yetu
  rationale: Kiebrania kinabaki kifupi na kinaweza kueleza ushirika, faida, au umiliki. Tafsiri kuu inaonyesha kuwa midomo yao inawaunga mkono, huku tanbihi ikihifadhi uwezekano wa dai la umiliki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Umoja wa “ulimi” na wingi wa “midomo” umehifadhiwa kama katika Kiebrania; “midomo yetu iko” hutumia upatanisho wa ngeli ya mi-.
