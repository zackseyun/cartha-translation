base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/000.yaml
  text: 'For the choirmaster: according to The Eighth[a]. A psalm of David[b].'
translation:
  language: sw
  text: 'Kwa kiongozi wa waimbaji: kwa kufuata “Ya Nane”[a]. Zaburi ya Daudi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “Ya Nane”; huenda ni jina la kimuziki au kiliturujia linalohusu wimbo, ala, au mpangilio wa oktava. Kwa kawaida neno hili hunukuliwa kwa matamshi ya Kiebrania kuwa Sheminithi.
    reason: cultural_note
  - marker: b
    text: Au “iliyotungwa na Daudi” au “kwa ajili ya Daudi”; maneno ya Kiebrania yaliyo hapa hayaelezi kwa uhakika uhusiano hasa wa Daudi na zaburi hii.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa kiongozi wa waimbaji
  rationale: Katika vichwa vya Zaburi neno hili humtaja mwenye kusimamia uimbaji au utendaji wa muziki. Tafsiri hii ni wazi na ya kawaida bila kulifanya neno hilo kuwa cheo maalumu kuliko Kiebrania kinavyodai.
- source_word: עַל
  choice: kwa kufuata
  rationale: Katika kichwa hiki neno hilo linaweza kutambulisha wimbo, mtindo, ala, au mpangilio wa muziki. “Kwa kufuata” huonyesha uhusiano huo bila kuamua hasa ni upi.
- source_word: הַשְּׁמִינִית
  choice: “Ya Nane”
  rationale: Maana yake ya moja kwa moja ni “ya nane.” Alama za kunukuu zinaonyesha kwamba huenda hili ni jina la uteuzi wa kimuziki au kiliturujia, huku maana yake kamili ikiwa haijulikani.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ndilo neno la Kiswahili lililozoeleka na linalofaa kwa aina hii ya wimbo wa ibada.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kihusishi cha Kiebrania kinaweza kuonyesha utunzi, uhusiano, umiliki, au kuwekwa wakfu. “Ya Daudi” hudumisha upana huo kuliko “iliyotungwa na Daudi.”
theological_decisions:
- issue: Uhusiano wa Daudi na zaburi unaoonyeshwa na לְדָוִד
  choice: ya Daudi
  alternative: iliyotungwa na Daudi; kwa ajili ya Daudi
  rationale: Kiebrania hakilazimishi uhusiano mmoja mahususi. Tafsiri iliyochaguliwa haikati kimbele mjadala wa utunzi au wakfu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko. “Kwa kiongozi wa waimbaji” kinaeleweka kwa wasomaji wa kawaida; “Ya Nane” kimetafsiriwa badala ya kunukuliwa tu kwa matamshi, na kutokuwa na uhakika kwake kumeelezwa katika tanbihi.
