  text: הֶ/אָפֵ֣ס לָ/נֶ֣צַח חַסְדּ֑/וֹ גָּ֥מַר אֹ֝֗מֶר לְ/דֹ֣ר וָ/דֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/008.yaml
  text: Has his steadfast love ceased forever? Has his promise come to an end for generation after generation?[a]
translation:
  language: sw
  text: Je, upendo wake wa kudumu umekoma milele? Je, ahadi yake imekoma kwa vizazi vyote?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, neno lake limekoma kwa vizazi vyote?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאָפֵס
  choice: zimekoma
  rationale: Kitenzi hiki chenye kiambishi cha swali huuliza ikiwa kitu kimeisha au kimetoweka; “zimekoma” ni Kiswahili cha kawaida na hudumisha nguvu ya ombolezo.
- source_word: לָנֶצַח
  choice: milele
  rationale: Ni msemo wa wakati unaomaanisha kudumu bila mwisho; “milele” ni wa asili na unaweka wazi ukali wa swali.
- source_word: חַסְדּוֹ
  choice: fadhili zake
  rationale: חֶסֶד huonyesha wema wa upendo ulio mwaminifu na thabiti. “Fadhili zake” ni lugha ya heshima na inayoeleweka, bila kuongeza neno la kiufafanuzi kama “agano” lisilosemwa moja kwa moja hapa.
- source_word: גָּמַר
  choice: imefikia mwisho
  rationale: Kitenzi kina maana ya kukamilika au kuisha; “imefikia mwisho” kinaeleza kwa kawaida hofu kwamba neno la Mungu limekoma.
- source_word: אֹמֶר
  choice: ahadi yake
  rationale: Ingawa maana ya msingi ni “neno” au “tamko,” muktadha wa kuhoji uaminifu wa Mungu unaelekea kwenye neno lake la ahadi. Maana rasmi zaidi “neno lake” imehifadhiwa katika tanbihi.
- source_word: לְדֹר וָדֹר
  choice: kizazi baada ya kizazi
  rationale: Msemo huu unaonyesha mwendelezo katika vizazi vinavyofuatana; tafsiri hii ni ya sasa na huhifadhi urudiaji wa Kiebrania.
theological_decisions:
- issue: Iwapo אֹמֶר itafsiriwe rasmi kama “neno” au kimuktadha kama “ahadi”
  choice: ahadi yake
  alternative: neno lake
  rationale: Katika ulinganifu na fadhili za Mungu, neno hili yaelekea kumaanisha neno alilotoa ambalo linategemewa. Hata hivyo, kwa kuwa “ahadi” ni ufafanuzi wa kimuktadha kuliko maana ya moja kwa moja, “neno lake” limewekwa katika tanbihi ili kuhifadhi uwazi na utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa maswali mawili na mvutano wa ombolezo umehifadhiwa; “kizazi baada ya kizazi” inadumisha nguvu ya msemo wa Kiebrania.
