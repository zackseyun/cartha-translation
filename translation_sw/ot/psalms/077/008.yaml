review_pass:
  verdict: revise
  source_fidelity: The two rhetorical questions, the cessation language, and the temporal force of לָנֶצַח are retained. However, “fadhili zake” usually denotes favors/kind acts and does not adequately convey the loyal-love sense of חַסְדּוֹ. The phrase “kizazi baada ya kizazi” also needs a governing preposition in this construction.
  naturalness: The draft is generally clear, but “imefikia mwisho kizazi baada ya kizazi” is syntactically incomplete/unnatural in Standard East African Swahili. “Kwa vizazi vyote” is idiomatic and conveys the continuing generational scope of לְדֹר וָדֹר.
  terminology: “Upendo wake wa kudumu” expresses חֶסֶד more fully and naturally than “fadhili zake,” without importing an explicit covenant term. “Ahadi yake” is a defensible contextual rendering of אֹמֶר when its lexical alternative, “neno lake,” remains footnoted.
  issues:
  - severity: medium
    issue: “Fadhili zake” is too weak and semantically shifted for חַסְדּוֹ.
    rationale: Fadhili commonly refers to favors, generosity, or benefactions; it does not clearly communicate the love and constancy inherent in חֶסֶד in this parallel lament.
  - severity: medium
    issue: The generational phrase lacks a preposition and is awkward after “imefikia mwisho.”
    rationale: “Imefikia mwisho kizazi baada ya kizazi” does not naturally express duration in Swahili. “Kwa vizazi vyote” gives the intended scope idiomatically.
  revised_text: Je, upendo wake wa kudumu umekoma milele? Je, ahadi yake imekoma kwa vizazi vyote?[a]
