- from: Je, fadhili zake zimekoma milele? Je, ahadi yake imefikia mwisho kizazi baada ya kizazi?[a]
  to: Je, upendo wake wa kudumu umekoma milele? Je, ahadi yake imekoma kwa vizazi vyote?[a]
  rationale: The revision renders חֶסֶד as “upendo wake wa kudumu,” preserving its love-and-constancy dimension, and recasts the final temporal expression idiomatically as “kwa vizazi vyote.” The contextual “ahadi yake” and its more lexical alternative “neno lake” are retained, preserving the source’s interpretive openness.
