  text: Your way was through the sea[a], and your paths through many waters[b], yet your footprints were not known.
translation:
  language: sw
  text: Njia yako ilikuwa baharini[a], na vijia vyako katika maji mengi; nyayo zako hazikujulikana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Njia yako ilipitia baharini.” Kihusishi cha Kiebrania kinaweza kutafsiriwa “katika”; katika muktadha huu kinaweza pia kudokeza mwendo kupitia maji.
    reason: lexical_alternative
  - marker: b
    text: Au, “hatua zako” au “alama zako hazikujulikana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּם
  choice: ilipitia baharini
  rationale: Kihusishi ב kinaweza kumaanisha ‘katika,’ lakini pamoja na ‘njia’ hapa kinaonyesha eneo au mkondo wa kupita. ‘Ilipitia baharini’ huwasilisha mwendo ndani ya bahari kwa Kiswahili cha kawaida.
- source_word: דַּרְכֶּךָ
  choice: njia yako
  rationale: דֶּרֶךְ humaanisha njia, barabara, au mwenendo. ‘Njia yako’ huhifadhi maana halisi na uwezekano wa maana pana ya kishairi.
- source_word: שביליך
  choice: vijia vyako
  rationale: שְׁבִיל humaanisha kijia au njia. ‘Vijia’ hudumisha ulinganifu wa kishairi na ‘njia’ huku kikitofautisha maneno hayo mawili ya Kiebrania.
- source_word: בְּמַיִם רַבִּים
  choice: katika maji mengi
  rationale: Tafsiri hii huhifadhi kwa karibu muundo wa Kiebrania na nahau ya kishairi ‘maji mengi.’ Muktadha wa ‘vijia’ tayari unaashiria kupita ndani ya maji.
- source_word: עִקְּבוֹתֶיךָ
  choice: nyayo zako
  rationale: Neno hili linaweza kumaanisha nyayo, hatua, au alama za miguu. ‘Nyayo’ huonyesha kwa uwazi athari zinazoweza kuachwa nyuma bila kuamua kupita kiasi maana ya picha hiyo.
- source_word: לֹא נֹדָעוּ
  choice: hazikujulikana
  rationale: Hii huhifadhi hali ya kutendwa ya Kiebrania na kuacha wazi ikiwa nyayo hazikuonekana, hazikutambuliwa, au hazikuweza kufuatiliwa.
theological_decisions:
- issue: Kiwango cha kuweka wazi picha ya kutoka Misri
  choice: Kuhifadhi picha ya kishairi ya njia ya Mungu baharini bila kuitaja wazi safari ya kuvuka Bahari ya Shamu.
  alternative: Kuitafsiri moja kwa moja kuwa kumbukumbu ya kuvuka Bahari ya Shamu.
  rationale: Mstari unaibua wazi tendo la Mungu la ukombozi kupitia maji, lakini Kiebrania chenyewe hakilitaji tukio hilo kwa jina. Picha hiyo huhifadhi mvutano wa kiteolojia kwamba Mungu hutenda katika historia, ingawa nyayo zake hubaki zisizojulikana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Ilipitia baharini’ ni ya asili zaidi kuliko ‘ilikuwa kupitia bahari’; ‘vijia’ huhifadhi ulinganifu bila kuwa lugha ngumu. Alama zote za tanbihi zimewekwa katika maandishi kuu.
