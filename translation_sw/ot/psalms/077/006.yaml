  text: אֶֽזְכְּרָ֥ה נְגִינָתִ֗/י בַּ֫/לָּ֥יְלָה עִם לְבָבִ֥/י אָשִׂ֑יחָה וַ/יְחַפֵּ֥שׂ רוּחִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/006.yaml
  text: I remember my song in the night[a]; with my heart I meditate[d][c][b], and my spirit searches.
translation:
  language: sw
  text: Naukumbuka wimbo wangu usiku[a]; natafakari moyoni mwangu[b], na roho yangu huchunguza[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “muziki wangu” au “melodi yangu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “najisemeza moyoni”; kitenzi cha Kiebrania kinaweza kumaanisha kutafakari au kusema kwa ndani.
    reason: lexical_alternative
  - marker: c
    text: Au, “akili yangu” au “nafsi yangu ya ndani”; hapa “roho” inamaanisha utu wa ndani wa mtunga zaburi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְכְּרָה
  choice: Naukumbuka
  rationale: Umbo hili la kishairi linaweza kueleweka kama tendo la sasa, la wakati ujao, au azimio. Wakati wa sasa unaendana vizuri na mfululizo wa kujitafakari katika muktadha huu.
- source_word: נְגִינָתִי
  choice: wimbo wangu
  rationale: Neno נְגִינָה linaweza kumaanisha wimbo, muziki, au melodi. ‘Wimbo wangu’ ni la kawaida na linafaa katika ushairi huu.
- source_word: בַּלָּיְלָה
  choice: usiku
  rationale: ‘Usiku’ ni tafsiri ya kawaida na ya kishairi ya kishazi hiki cha wakati.
- source_word: עִם לְבָבִי אָשִׂיחָה
  choice: natafakari moyoni mwangu
  rationale: Ingawa עִם kwa kawaida ni ‘pamoja na/na,’ kishazi hiki kinaeleza kutafakari kwa ndani. Kiswahili ‘moyoni mwangu’ ni cha asili bila kupoteza wazo la moyo kama nafsi ya ndani.
- source_word: וַיְחַפֵּשׂ
  choice: huchunguza
  rationale: Kitenzi kina wazo la kutafuta au kuchunguza kwa makini. ‘Huchunguza’ kinaonyesha kazi endelevu ya ndani na kinaendana na mfuatano wa kishairi.
- source_word: רוּחִי
  choice: roho yangu
  rationale: Hapa רוּחַ humaanisha utu wa ndani wa mtunga zaburi, si upepo wala pumzi. ‘Roho yangu’ huhifadhi upana wa maana ya Kiebrania.
theological_decisions:
- issue: Maana ya רוּחִי katika muktadha wa kujichunguza
  choice: roho yangu
  alternative: akili yangu / nafsi yangu ya ndani
  rationale: ‘Roho yangu’ hudumisha lugha pana ya Kiebrania bila kuifanya imaanishe akili peke yake au kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Wakati wa sasa umetumiwa kuwasilisha mfululizo wa tafakari; tanbihi zinahifadhi uwezekano wa maana nyingine za maneno ya Kiebrania.
