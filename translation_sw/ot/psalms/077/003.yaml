  yaml_path: translation/ot/psalms/077/003.yaml
  text: I remember God[a], and I groan; I meditate, and my spirit grows faint[b]. Selah
translation:
  language: sw
  text: Ninamkumbuka Mungu, nami ninaugua; natafakari[a], na roho yangu inazimia[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nalalamika.” Kitenzi cha Kiebrania kinaweza kumaanisha kutafakari au kutoa malalamiko kwa maneno.
