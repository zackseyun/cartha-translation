  - marker: b
    text: Au, “roho yangu inalemewa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְכְּרָה
  choice: Ninamkumbuka
  rationale: Kauli ya nafsi ya kwanza inaweza kuwa ya sasa, ya baadaye, au yenye mwelekeo wa nia; katika ombolezo hili, wakati wa sasa unaonyesha tendo linaloendelea bila kufuta kabisa unyumbufu wa kishairi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu neno linamtaja Mungu wa Israeli kwa umoja.
- source_word: וְאֶהֱמָיָה
  choice: nami ninaugua
  rationale: Kitenzi המה huonyesha msukosuko unaosikika au sauti ya maombolezo; 'ninaugua' ni Kiswahili cha kawaida kinacholingana na huzuni ya mstari.
- source_word: אָשִׂיחָה
  choice: natafakari
  rationale: שיח katika mashairi ya ombolezo inaweza kumaanisha kutafakari, kunena moyoni, au kutoa malalamiko; 'natafakari' linafaa kwa ulinganifu na kukumbuka, huku tanbihi ikihifadhi uwezekano wa kulalamika.
- source_word: וְתִתְעַטֵּף
  choice: inazimia
  rationale: Hitpael ya עטף inaweza kueleza kudhoofika au kulemewa; 'inazimia' huwasilisha kuporomoka kwa nguvu za ndani kwa lugha fupi na ya kishairi.
- source_word: רוּחִי
  choice: roho yangu
  rationale: רוּחַ hapa inaelekea kumaanisha uhai au hali ya ndani ya mtunga zaburi, si pumzi ya mwili pekee.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya neno hili la kiibada au kimuziki haijulikani; limetoholewa badala ya kutafsiriwa kwa kubahatisha.
theological_decisions:
- issue: Kiwango cha kudhoofika kwa roho
  choice: roho yangu inazimia
  alternative: roho yangu inalewa
  rationale: Maandishi yanaweza kueleza kudhoofika au kulemewa. Tafsiri kuu inatumia taswira ya kudhoofika, na tanbihi inadumisha maana mbadala bila kuamua mvutano huo kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa vipashio sambamba na wakati wa sasa umehifadhiwa; 'Sela' limetoholewa kwa kuwa maana yake kamili haijulikani.
