lexical_decisions:
- source_word: נָחִיתָ
  choice: Uliwaongoza
  rationale: Kitenzi hiki kinamwelekea Mungu moja kwa moja na humaanisha kuongoza au kuelekeza. “Uliwaongoza” ni Kiswahili cha kawaida na kinapatana na picha ya mchungaji na kundi.
- source_word: כַצֹּאן
  choice: kama kundi la kondoo
  rationale: Kiambishi כַ־ huonyesha ulinganisho, na צֹאן ni jina la mkusanyiko wa mifugo midogo, hasa kondoo na mbuzi. “Kama kundi la kondoo” ni usemi wa asili katika Kiswahili na huhifadhi picha ya kichungaji.
- source_word: עַמֶּךָ
  choice: watu wako
  rationale: עַם hapa humaanisha watu wa Mungu kama jumuiya. “Watu wako” ni tafsiri ya moja kwa moja, ya kawaida, na inayofaa muktadha.
- source_word: בְּיַד
  choice: kwa mkono wa
  rationale: Usemi wa Kiebrania unaonyesha wakala au chombo kilichotumiwa. “Kwa mkono wa” huhifadhi taswira ya maandishi ya chanzo, huku tanbihi ikifafanua maana yake.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Musa na Aroni
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili sanifu.
theological_decisions:
- issue: Nafasi ya Musa na Aroni katika Mungu kuwaongoza watu wake
  choice: Mungu ndiye mtendaji mkuu aliyewaongoza watu wake, akiwatumia Musa na Aroni kama mawakala wake.
  alternative: Musa na Aroni watajwe tu kama wahusika walioandamana na watu bila kuonyesha uwakala wao.
  rationale: Kitenzi cha nafsi ya pili kinamwelekea Mungu, na kirai בְּיַד מֹשֶׁה וְאַהֲרֹן kinaonyesha kwamba Musa na Aroni ndio waliotumiwa naye. Tafsiri inadumisha kwa pamoja utendaji wa Mungu na uwakala wa wanadamu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni rahisi kueleweka kwa msomaji wa kawaida. Usemi “kwa mkono wa” umehifadhiwa kwa sababu ya uzito wake wa kimafumbo, na maana yake imefafanuliwa katika tanbihi.
