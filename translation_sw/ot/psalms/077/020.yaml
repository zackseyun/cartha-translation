  text: You led your people like a flock by the hand of Moses and Aaron[a][b].
translation:
  language: sw
  text: Uliwaongoza watu wako kama kundi la kondoo[a] kwa mkono wa Musa na Haruni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama kondoo.” Neno la Kiebrania צֹאן ni nomino ya mkusanyiko inayomaanisha kundi la mifugo midogo, hasa kondoo au mbuzi.
    reason: lexical_alternative
