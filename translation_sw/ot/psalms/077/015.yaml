base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/015.yaml
  text: You redeemed your people with your arm[a], the sons of Jacob and Joseph[d][c][b]. Selah
translation:
  language: sw
  text: Uliwakomboa watu wako kwa mkono wako,[a] wana wa Yakobo na Yosefu. Sela.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania ni “mkono”; ni taswira ya nguvu za Mungu zinazotenda.
    reason: lexical_alternative
  - marker: c
    text: “Sela” huenda ni alama ya ibada au muziki; maana yake kamili haijulikani.
    reason: cultural_note
lexical_decisions:
- source_word: גָּאַלְתָּ
  choice: Uliwakomboa
  rationale: Kitenzi גאל kina maana ya kukomboa au kuokoa kwa tendo la ukombozi. “Uliwakomboa” huhifadhi uzito wa ukombozi huku kikiwa Kiswahili cha kawaida na cha heshima.
- source_word: בִּזְרוֹעַ
  choice: kwa mkono wako wenye nguvu
  rationale: זְרוֹעַ ni “mkono” kwa maana ya sehemu ya mwili, hasa mkono unaowakilisha nguvu na tendo kuu. Kiswahili “mkono wako wenye nguvu” huhifadhi picha hiyo na kuifanya ieleweke kwa kawaida.
- source_word: עַמֶּךָ
  choice: watu wako
  rationale: עַם pamoja na kiambishi cha nafsi ya pili ni “watu wako,” yaani jamii inayomilikiwa na Mungu.
- source_word: בְּנֵי
  choice: wana wa
  rationale: בְּנֵי kwa muundo ni “wana wa.” Hapa ni usemi wa ukoo na taifa; tafsiri rasmi huhifadhi umbo hilo bila kulipanua kuwa “wazao.”
- source_word: יַעֲקֹב וְיוֹסֵף
  choice: Yakobo na Yosefu
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia, bila kufafanua kimatini ni makundi gani hasa yanayowakilishwa na Yosefu.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya neno hili haijulikani; huenda ni alama ya muziki au ibada. Limenukuliwa kwa sauti badala ya kutafsiriwa kwa uhakika usiokuwapo.
theological_decisions:
- issue: Maana ya “wana wa Yakobo na Yosefu” kama jina la taifa
  choice: Majina yote mawili yamehifadhiwa bila kuyafafanua zaidi.
  alternative: Kutafsiri Yosefu kuwa Efraimu na Manase, ufalme wa kaskazini, au kulitaja fungu lote kuwa Israeli.
  rationale: Kiebrania chenyewe hakielezi kwa usahihi kazi ya uwakilishi ya “Yosefu.” Kuhifadhi usemi huo kunadumisha utata wa kishairi na kihistoria bila kuingiza nadharia finyu ya kikabila.
- issue: Taswira ya mkono wa Mungu
  choice: Taswira imehifadhiwa kama “mkono wako wenye nguvu.”
  alternative: Kutafsiri moja kwa moja kuwa “kwa nguvu zako.”
  rationale: Mkono ni taswira ya uwezo wa Mungu unaotenda. Kuuhifadhi huepuka kufifisha lugha ya kishairi, huku “wenye nguvu” ikisaidia usemi kuwa wazi kwa msomaji wa sasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Uliwakomboa” ni cha kawaida kuliko miundo mizito, na “mkono wako wenye nguvu” huhifadhi taswira ya Kiebrania kwa uwazi. Alama za tanbihi zimewekwa mara moja kila moja na zinafuata mpangilio wa matini.
