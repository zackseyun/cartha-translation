  text: God[a], your way is in holiness; who is a great god like God?
translation:
  language: sw
  text: Ee Mungu, njia yako ni katika utakatifu[a]; ni mungu gani aliye mkuu kama Mungu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali patakatifu.” Neno la Kiebrania linaweza kumaanisha utakatifu kama sifa au hali inayomhusu Mungu, au mahali patakatifu.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Kiambishi cha nafsi ya pili katika ‘njia yako’ kinaonyesha kuwa Mungu anasemeshwa moja kwa moja; ‘Ee’ huonyesha mwito huo kwa Kiswahili cha kawaida na chenye heshima.
- source_word: בַּקֹּדֶשׁ
  choice: katika utakatifu
  rationale: קֹדֶשׁ inaweza kumaanisha utakatifu au mahali patakatifu. ‘Katika utakatifu’ hudumisha maana pana inayohusu tabia na utendaji wa Mungu, huku maana ya mahali patakatifu ikihifadhiwa katika tanbihi.
- source_word: דַּרְכֶּךָ
  choice: njia yako
  rationale: ‘Njia’ huweza kueleza mwenendo wa Mungu na namna yake ya kutenda bila kupunguza upana wa neno la Kiebrania.
- source_word: מִי
  choice: gani
  rationale: Katika swali la Kiswahili ‘ni mungu gani,’ neno hili linawasilisha kwa kawaida kiulizi cha Kiebrania na nguvu ya swali la balagha.
- source_word: אֵל
  choice: mungu
  rationale: 'Herufi ndogo inaonyesha nomino ya kawaida katika ulinganisho na Mungu wa kweli: hakuna mungu mwingine aliye mkuu kama yeye.'
- source_word: גָּדוֹל
  choice: aliye mkuu
  rationale: ‘Mkuu’ ni tafsiri ya moja kwa moja na ya asili katika muktadha huu wa kutukuza ukuu wa Mungu.
- source_word: כֵּאלֹהִים
  choice: kama Mungu
  rationale: Kiambishi כְּ kinaonyesha ulinganisho, na אֱלֹהִים hapa humrejelea Mungu mmoja wa kweli.
theological_decisions:
- issue: Maana ya בַּקֹּדֶשׁ
  choice: Njia ya Mungu iko katika utakatifu
  alternative: Njia ya Mungu iko mahali patakatifu
  rationale: Kiebrania kinaruhusu maana ya sifa ya utakatifu au maana ya mahali patakatifu. Maandishi makuu yanadumisha maana pana ya utakatifu, na tanbihi inahifadhi uwezekano wa maana ya mahali patakatifu bila kuondoa mvutano huo wa kimatini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali la balagha umehifadhiwa, pamoja na tofauti kati ya ‘mungu’ kama nomino ya kawaida na ‘Mungu’ kama rejeo kwa Mungu wa kweli.
