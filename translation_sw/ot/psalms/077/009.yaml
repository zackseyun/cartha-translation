id: PSA.77.9
reference: Psalms 77:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: הֲ/שָׁכַ֣ח חַנּ֣וֹת אֵ֑ל אִם קָפַ֥ץ בְּ֝/אַ֗ף רַחֲמָ֥י/ו סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/009.yaml
  text: Has God forgotten to be gracious? Has he in anger shut up his compassion? Selah[a][b]
translation:
  language: sw
  text: Je, Mungu amesahau kuwa mwenye neema? Au kwa hasira amezuia huruma zake? Sela.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, Mungu amesahau kuonyesha fadhili? Au kwa hasira amezuilia rehema zake?”
    reason: lexical_alternative
  - marker: b
    text: “Sela” yaelekea kuwa alama ya kiliturujia au ya kimuziki; maana yake kamili haijulikani.
    reason: cultural_note
lexical_decisions:
- source_word: הֲ/שָׁכַח
  choice: Je, ... amesahau
  rationale: Kiulizi הֲ pamoja na kitenzi שׁכח kinaanzisha swali la balagha. Kiswahili hiki kinadumisha uchungu wa swali bila kuligeuza kuwa dai.
- source_word: חַנּוֹת
  choice: kuwa mwenye neema
  rationale: Kitenzi-jina cha חנן humaanisha kuwa na neema au kuonyesha fadhili. Usemi huu ni wa kawaida na wenye hadhi, huku ukihifadhi wazo la neema ya Mungu.
- source_word: אֵל
  choice: Mungu
  rationale: אֵל hapa ni jina la kawaida la Mungu; “Mungu” ndilo linaloeleweka wazi na kwa kawaida katika muktadha huu.
- source_word: אִם
  choice: Au
  rationale: Baada ya swali la kwanza, אִם linaanzisha swali la pili linalolingana nalo na lenye wazo la uwezekano mwingine. “Au” huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: קָפַץ
  choice: amezuia
  rationale: Kitenzi kina wazo halisi la kufunga au kukaza. Kwa kuhusishwa na huruma, “amezuia” ni Kiswahili cha asili kinachowasilisha kutotolewa kwa huruma bila kulazimisha taswira isiyoeleweka.
- source_word: בְּ/אַף
  choice: kwa hasira
  rationale: אַף kwa maana ya kimajazi ni hasira. “Kwa hasira” huonyesha hali au sababu inayotajwa katika swali huku ikibaki fupi na ya kishairi.
- source_word: רַחֲמָיו
  choice: huruma zake
  rationale: Nomino ya Kiebrania iko katika wingi na inaweza kumaanisha huruma nyingi au rehema. Wingi “huruma zake” unadumisha umbo hilo na unasikika kwa kawaida katika Kiswahili.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya neno hili la kiliturujia au kimuziki haijulikani; limetoholewa badala ya kutafsiriwa kwa kubahatisha.
theological_decisions:
- issue: Ikiwa mstari utolewe kama maswali ya balagha au kama kauli
  choice: Maswali mawili ya balagha yanayoonyesha dhiki ya mtunga zaburi
  alternative: Kauli kama “Mungu amesahau...”
  rationale: Kiulizi cha Kiebrania na muktadha wa maombolezo vinaunga mkono maswali ya balagha. Kuyafanya madai kungeondoa mvutano wa kiimani uliomo katika kilio hiki.
- issue: Uhusiano kati ya maswali mawili
  choice: Swali la pili limeanzishwa kwa “Au”
  alternative: Kulianza kama swali jipya lisilo na kiunganishi
  rationale: אִם huhifadhi wazo la chaguo au mlingano kati ya maswali haya mawili; “Au” linaonyesha wazi muundo huo bila kutatua mvutano wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa maswali ya balagha na mlingano wa kishairi umehifadhiwa. “Mwenye neema” linaendeleza msamiati wa neema, huku tanbihi ikitoa mbadala wa “kuonyesha fadhili”; “huruma zake” hudumisha wingi wa Kiebrania.
