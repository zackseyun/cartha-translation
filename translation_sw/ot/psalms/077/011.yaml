  text: אזכיר מַֽעַלְלֵי יָ֑הּ כִּֽי אֶזְכְּרָ֖ה מִ/קֶּ֣דֶם פִּלְאֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/011.yaml
  text: I will remember the deeds of Yah[b][a], for I will remember your wonders from of old.
translation:
  language: sw
  text: Nitayakumbuka[a] matendo ya Yah; kwa maana nitakumbuka maajabu yako ya tangu zamani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nitayasimulia matendo ya Yah.” Kitenzi kinaweza kumaanisha kukumbuka, kutaja, au kusimulia.
    reason: lexical_alternative
  - marker: b
    text: Au, “maajabu yako ya nyakati za kale” au “maajabu yako ya zamani za kale.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַזְכִּיר
  choice: Nitayakumbuka
  rationale: Hifili ya זכר inaweza kumaanisha kukumbuka, kutaja, au kusimulia. Katika ushairi huu, “nitayakumbuka” huhifadhi azimio la kukumbuka na pia mwangwi wa kitenzi kilekile katika mstari unaofuata bila kulazimisha wazo la kutangaza hadharani.
- source_word: מַעַלְלֵי
  choice: matendo
  rationale: Neno hili humaanisha matendo au kazi zilizofanywa. “Matendo” ni Kiswahili cha kawaida, chenye hadhi, na kinafaa katika usambamba wa kishairi.
- source_word: יָהּ
  choice: Yah
  rationale: Hili ni umbo fupi la kishairi la jina la Mungu, tofauti na umbo kamili יהוה. Kulihifadhi kama “Yah” kunaonyesha tofauti hiyo ya matini ya Kiebrania.
- source_word: כִּי
  choice: naam
  rationale: Hapa kiunganishi kinaweza kuwa cha kusisitiza au kueleza. “Naam” linaonyesha uthibitisho na azimio linalorudiwa katika mstari wa pili bila kuufanya uhusiano kuwa wa sababu pekee.
- source_word: אֶזְכְּרָה
  choice: nitakumbuka
  rationale: Umbo hili lina nguvu ya hiari au azimio la nafsi ya kwanza. Wakati ujao wa Kiswahili unaeleza azimio hilo kwa njia ya kawaida na wazi.
- source_word: מִקֶּדֶם
  choice: ya tangu zamani
  rationale: Kirai hiki huelekeza kwenye nyakati za kale au zilizopita sana. “Tangu zamani” hudumisha kina cha wakati bila kudokeza lazima mwanzo kamili wa vitu vyote.
- source_word: פִּלְאֶךָ
  choice: maajabu yako
  rationale: Neno hili humaanisha jambo la ajabu au tendo la kustaajabisha. Kiswahili hutumia “maajabu yako” kwa kawaida kama jina la jumla linaloweza kurejelea matendo mengi ya Mungu katika usambamba huu.
theological_decisions:
- issue: Uwasilishaji wa umbo fupi la jina la Mungu, יָהּ
  choice: Yah
  alternative: BWANA
  rationale: Matini ya chanzo ina יָהּ, si umbo kamili יהוה. “Yah” huhifadhi kwa uwazi umbo hilo fupi la kishairi na huepuka kufuta tofauti ya kileksika iliyomo katika Kiebrania.
- issue: Nguvu ya כִּי kati ya mistari miwili
  choice: naam
  alternative: kwa maana
  rationale: כִּי inaweza kueleza au kusisitiza. Katika muktadha huu wa azimio linalorudiwa, “naam” huhifadhi nguvu ya kusisitiza bila kuamua kwamba mstari wa pili ni sababu tu ya mstari wa kwanza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mistari miwili na urudiaji wa “nitakumbuka” umehifadhiwa kwa ajili ya usambamba wa kishairi. “Yah” limeachwa kama umbo fupi la jina la Mungu, na maelezo ya chini yamehifadhi uwezekano wa kitenzi cha kwanza kumaanisha kutaja au kusimulia.
