lexical_decisions:
- source_word: אָחַזְתָּ
  choice: Umezishikilia
  rationale: Kitenzi cha Qal timilifu, nafsi ya pili umoja wa kiume, kinamwelekea Mungu. ‘Umezishikilia’ kinahifadhi utendaji wa Mungu na kinaingia kwa kawaida katika nahau inayofuata.
- source_word: שְׁמֻרוֹת עֵינָי
  choice: kope za macho yangu wazi
  rationale: Kwa neno neno ni ‘malindo/kesho za macho yangu,’ lakini nahau hiyo inaelekea kumaanisha kwamba Mungu ameyazuia macho ya mtunga zaburi yasifumbe kwa usingizi. ‘Kope za macho yangu wazi’ hutoa maana hiyo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi taswira halisi ya Kiebrania.
- source_word: נִפְעַמְתִּי
  choice: nimefadhaika
  rationale: Niphal ya nafsi ya kwanza umoja inaonyesha msukosuko au kutatizika kwa ndani. ‘Nimefadhaika’ ni ya kawaida na haibainishi kupita kiasi kama hali hiyo ni hofu, mshangao, au kukosa utulivu.
- source_word: וְלֹא אֲדַבֵּר
  choice: hata siwezi kusema
  rationale: Ingawa muundo wa moja kwa moja ni ‘wala sisemi,’ muktadha unaashiria kushindwa kusema kwa sababu ya mfadhaiko. ‘Hata siwezi kusema’ hufikisha maana hiyo kwa lugha ya kawaida.
