  text: Umezuia kope zangu zisifumbe[a]; nimefadhaika, wala siwezi kusema.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “Umeshika vilinzi vya macho yangu.” Nahau hii ya Kiebrania huenda ikimaanisha kwamba Mungu hakumruhusu mtunga zaburi kufumba macho na kulala.
