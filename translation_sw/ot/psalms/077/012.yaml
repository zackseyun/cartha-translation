translation:
  language: sw
  text: 'Nitaitafakari kazi yako yote,

    nami nitayatafakari matendo yako.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nami nitazungumza kuhusu matendo yako.” Kitenzi cha Kiebrania kinaweza kumaanisha kutafakari au kusema kuhusu jambo; ulinganifu wa kishairi hapa unapendelea maana ya kutafakari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָגִיתִי
  choice: Nitaitafakari
  rationale: Kitenzi הגה hapa kinaonyesha kutafakari au kuwaza kwa makini. Wakati ujao wa Kiswahili unafaa mwelekeo wa hiari unaoendelea katika muktadha wa kishairi.
- source_word: בְכָל
  choice: kazi yako yote
  rationale: ב huonyesha jambo linalotafakariwa, na כָל inaelezwa kwa ‘yote’; mpangilio huu ni wa kawaida na wazi katika Kiswahili.
- source_word: פָעֳלֶךָ
  choice: kazi yako
  rationale: פֹּעַל ni kazi, tendo, au shughuli. ‘Kazi yako’ inadumisha umoja wenye maana ya jumla na pia utofauti wa kishairi dhidi ya ‘matendo’ katika mstari wa pili.
- source_word: וּבַעֲלִילוֹתֶיךָ
  choice: matendo yako
  rationale: עֲלִילוֹת ni matendo au vitendo. ‘Matendo yako’ ni tafsiri ya kawaida isiyoongeza wazo la ‘makuu’ ambalo halimo wazi katika nomino yenyewe.
- source_word: אָשִׂיחָה
  choice: nitayawaza kwa kina
  rationale: שיח inaweza kumaanisha kutafakari, kuwaza, au kusema kuhusu jambo. ‘Kuyawaza kwa kina’ inafaa ulinganifu wa kishairi bila kurudia tu ‘kutafakari,’ huku tanbihi ikihifadhi uwezekano wa maana ya kusema.
