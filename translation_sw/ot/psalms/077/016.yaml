  text: רָ֘א֤וּ/ךָ מַּ֨יִם אֱֽלֹהִ֗ים רָא֣וּ/ךָ מַּ֣יִם יָחִ֑ילוּ אַ֝֗ף יִרְגְּז֥וּ תְהֹמֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/016.yaml
  text: The waters saw you[a], O God; the waters saw you and writhed[b]; even the depths trembled.
translation:
  language: sw
  text: 'Maji yalikuona, Ee Mungu;

    maji yalikuona, yakajikunja kwa uchungu[a];

    hata vilindi[b] vikatetemeka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yakapata uchungu,” “yakapindapinda,” au “yakatetemeka.” Kitenzi cha Kiebrania kinaweza kumaanisha kutikisika kwa nguvu au kujikunja kama kwa uchungu wa kuzaa.
    reason: lexical_alternative
  - marker: b
    text: Au, “maji ya vilindi.” Neno la Kiebrania linarejelea maji ya kina au vilindi vya bahari.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּךָ
  choice: yalikuona
  rationale: Ni kitenzi cha Qal chenye kiambishi cha nafsi ya pili umoja, kwa hiyo maana yake ya moja kwa moja ni ‘yalikuona.’ Urudiaji wake umehifadhiwa kwa ajili ya mkazo na usambamba wa kishairi.
- source_word: מַיִם
  choice: maji
  rationale: ‘Maji’ ni tafsiri ya kawaida na ya asili; upatanisho wa kisarufi wa ngeli ya 6 unayahusisha maji na vitendo vya kibinadamu, hivyo kuhifadhi uhuishaji wa kishairi.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Jina hili lina nguvu ya mwito katika muktadha huu. ‘Ee’ huonyesha wazi na kwa lugha ya kishairi kwamba Mungu anaelekezewa maneno.
- source_word: יָחִילוּ
  choice: yakajikunja kwa uchungu
  rationale: Kitenzi מן חול/חיל kinaweza kuonyesha kujikunja, kutetemeka, au maumivu yanayofanana na ya kuzaa. Usemi huu unahifadhi picha hai ya maji yakisukasuka kwa uchungu na kuitofautisha na רגז inayofuata.
- source_word: אַף
  choice: hata
  rationale: 'Hapa neno hili linaongeza mkazo: si maji tu, bali hata vilindi vilitetemeka.'
- source_word: יִרְגְּזוּ
  choice: vik tetemeka
  rationale: רגז huonyesha kutetemeka au kutikiswa. ‘Vik tetemeka’ ni usemi wazi unaofuata mtiririko wa matendo ya kishairi bila kurudia kabisa picha ya kujikunja kwa uchungu.
- source_word: תְהֹמוֹת
  choice: vilindi
  rationale: Wingi wa תהום unarejelea maji ya kina au vilindi vya bahari. ‘Vilindi’ ni neno la kawaida la Kiswahili linalohifadhi taswira ya maji makuu ya kina.
theological_decisions:
- issue: Maji ya ulimwengu kuhuishwa mbele za Mungu
  choice: Kuhifadhi taswira ya kishairi ya maji na vilindi vikimwitikia Mungu kama viumbe vilivyo hai, bila kuongeza ufafanuzi wa kimytholojia.
  alternative: Kuifanya aya irejelee moja kwa moja tu kuvuka kwa Bahari ya Shamu, au kuitafsiri kama pambano na nguvu za bahari za kimytholojia.
  rationale: Aya yenyewe inaonyesha uumbaji ukijikunja na kutetemeka mbele za Mungu. Tafsiri inadumisha taswira hiyo huku ikiacha mahusiano yake mapana ya kimaandiko na kimytholojia yafasiriwe badala ya kuyaingiza katika maneno ya aya.
translation_notes:
  register: Lugha ni ya sasa, yenye heshima na ladha ya kishairi. Urudiaji wa ‘maji yalikuona’ umehifadhiwa, na ‘Ee Mungu’ umetumiwa kuonyesha mwito wa moja kwa moja. Alama zote za tanbihi zimewekwa kwenye maneno yanayohusika.
