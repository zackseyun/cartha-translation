  text: אַתָּ֣ה הָ֭/אֵל עֹ֣שֵׂה פֶ֑לֶא הוֹדַ֖עְתָּ בָ/עַמִּ֣ים עֻזֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/014.yaml
  text: You are the God who works wonders[b][a]; you have made your strength known among the peoples.
translation:
  language: sw
  text: Wewe ndiwe Mungu atendaye maajabu; umeifanya nguvu yako[b] ijulikane miongoni mwa mataifa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwa watu wa mataifa mbalimbali.” Neno la Kiebrania linaweza kumaanisha watu au mataifa.
    reason: lexical_alternative
  - marker: b
    text: Au, “uweza wako” au “uwezo wako mkuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: ndiwe Mungu
  rationale: Kibainishi cha Kiebrania kinamtambulisha Mungu kwa msisitizo. Muundo wa Kiswahili “Wewe ndiwe Mungu” ni wa asili na unahifadhi msisitizo huo.
- source_word: עֹשֵׂה
  choice: atendaye
  rationale: Kitenzi kishirikishi kinaonyesha tendo la tabia au la kudumu; “atendaye” kinafaa katika ushairi wenye hadhi na kinaeleweka kwa urahisi.
- source_word: פֶלֶא
  choice: maajabu
  rationale: Ingawa nomino ya Kiebrania iko katika umoja, inaweza kutumiwa kwa maana ya jumla. “Maajabu” huwasilisha matendo ya Mungu yaliyo ya ajabu bila kuyafafanua kwa maana nyembamba zaidi ya “miujiza.”
- source_word: הוֹדַעְתָּ
  choice: umeifanya ... ijulikane
  rationale: Muundo huu unahifadhi maana sababishi ya Hifili ya ידע, yaani kusababisha kitu kijulikane.
- source_word: בָעַמִּים
  choice: miongoni mwa mataifa
  rationale: Kihusishi ב kinaonyeshwa kwa “miongoni mwa,” na עַמִּים inaweza kumaanisha mataifa au makundi ya watu. “Mataifa” ni fasiri ya kawaida na ya asili katika muktadha huu.
- source_word: עֻזֶּךָ
  choice: nguvu yako
  rationale: עֹז humaanisha nguvu, uweza, au uwezo mkuu. “Nguvu yako” ni ya moja kwa moja, ya kawaida, na inafaa kwa matendo makuu yanayosifiwa hapa.
theological_decisions:
- issue: Upeo wa kujidhihirisha kwa Mungu katika בָעַמִּים
  choice: miongoni mwa mataifa
  alternative: miongoni mwa watu wa mataifa mbalimbali
  rationale: Fasiri hii inadumisha wazo la kwamba nguvu za Mungu zilionekana hadharani kwa makundi mengi ya watu, bila kuingiza mpango maalumu wa kitheolojia usiotajwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wenye hadhi lakini unaoeleweka kwa wasomaji wa kawaida. Muundo “Wewe ndiwe” unahifadhi msisitizo wa Kiebrania; “atendaye” hudumisha sauti ya zaburi bila kuwa ya kizamani kupita kiasi.
