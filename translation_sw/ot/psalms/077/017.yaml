  text: The clouds poured out water; the skies gave forth a sound; indeed[a], your arrows moved about.
translation:
  language: sw
  text: 'Mawingu yalimwaga maji;

    mbingu zikatoa sauti;

    naam[a], mishale yako ilizunguka huku na huku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miale yako ya umeme ilizunguka huku na huku.” Kiebrania kinasema “mishale yako,” na huenda kinatumia taswira ya kivita kwa umeme katika muktadha huu wa Mungu kujidhihirisha katika dhoruba.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹרְמוּ
  choice: yalimwaga
  rationale: Kitenzi kinaonyesha maji yakitiririka kwa wingi; “yalimwaga maji” ni Kiswahili cha kawaida chenye nguvu inayofaa taswira ya dhoruba.
- source_word: מַיִם
  choice: maji
  rationale: “Maji” ndilo neno la kawaida la Kiswahili na linaonyesha kitu kilekile bila kulazimisha tofauti ya umoja na wingi ya Kiebrania.
- source_word: עָבוֹת
  choice: mawingu
  rationale: Nomino hiyo humaanisha mawingu mazito; “mawingu” ni wazi na ya kawaida, huku muktadha wa dhoruba ukidokeza uzito wake.
- source_word: קוֹל נָתְנוּ
  choice: zikatoa sauti
  rationale: Huhifadhi kwa njia ya kawaida nahau ya Kiebrania, “zilitoa sauti,” bila kuitafsiri moja kwa moja kuwa radi.
- source_word: שְׁחָקִים
  choice: anga
  rationale: Neno linaweza kumaanisha anga au mawingu. “Anga” hudumisha ulinganifu wa kishairi bila kurudia “mawingu” katika mistari yote miwili.
- source_word: אַף
  choice: naam
  rationale: “Naam” huongeza mkazo wa kishairi na wa kilele unaoweza kuonyeshwa na chembe hii ya Kiebrania.
- source_word: חֲצָצֶיךָ
  choice: mishale yako
  rationale: Maana ya moja kwa moja ni “mishale yako.” Taswira hiyo ya kivita inadumishwa katika matini, huku uwezekano wa kumaanisha umeme ukielezwa katika tanbihi.
- source_word: יִתְהַלָּכוּ
  choice: ilizunguka huku na huku
  rationale: Umbo la kitenzi linaonyesha mwendo wa huku na huku; tafsiri hii haibani taswira iwe ya mishale halisi au miale ya umeme.
theological_decisions:
- issue: 'Taswira ya ufunuo wa Mungu katika dhoruba: mishale halisi au umeme kwa njia ya sitiari'
  choice: Kudumisha “mishale yako” katika matini kuu, huku muktadha wa dhoruba ukiruhusu ieleweke kisitiari kuwa umeme.
  alternative: Kutafsiri moja kwa moja “miale yako ya umeme.”
  rationale: Neno la Kiebrania kwa maana yake ya kawaida ni “mishale.” Kwa kuwa muktadha unaashiria kwa nguvu ufunuo wa Mungu katika dhoruba, maana ya kimeteorolojia inawekwa katika tanbihi badala ya kuondoa sitiari ya matini chanzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa mistari unadumisha ulinganifu wa zaburi; “naam” hutia mkazo bila kutumia lugha ya kimadhehebu.
