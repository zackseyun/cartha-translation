  text: הַֽ֭/לְ/עוֹלָמִים יִזְנַ֥ח אֲדֹנָ֑/י וְ/לֹֽא יֹסִ֖יף לִ/רְצ֣וֹת עֽוֹד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/007.yaml
  text: Will the Lord reject forever[a], and never again show favor?
translation:
  language: sw
  text: Je, Bwana atakataa milele[a], wala hataonyesha tena kibali?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, Bwana atatupilia mbali milele, wala hatakuwa tena mwenye kibali?”
    reason: Tofauti halali za kileksika kwa יִזְנַח na לִרְצוֹת.
lexical_decisions:
- source_word: הַלְעוֹלָמִים
  choice: Je, ... milele
  rationale: Kiambishi cha kuuliza הַ pamoja na לְעוֹלָמִים huanzisha swali la balagha; “milele” ni Kiswahili cha kawaida kinachodumisha wazo la muda usio na mwisho.
- source_word: יִזְנַח
  choice: atatukataa
  rationale: Kitenzi kina maana ya kukataa au kutupilia mbali. Muktadha unahusu uhusiano wa Bwana na watu wake, hivyo kiwakilishi cha yambwa “-tu-” kinaweka wazi yambwa iliyodokezwa katika Kiswahili bila kubadili kiini cha swali.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Hili ni jina la cheo Adonai, si jina la Mungu YHWH; “Bwana” ni tafsiri ya kawaida na yenye heshima ya cheo hicho.
- source_word: וְלֹא
  choice: wala hata-
  rationale: “Wala” huunganisha kwa ufasaha swali la pili lenye ukanushi na la kwanza, huku “hata-” ikibeba ukanushi wa wakati ujao.
- source_word: יֹסִיף ... עוֹד
  choice: tena
  rationale: Muundo wa יסיף pamoja na kitenzi-jina na עוֹד unaonyesha kutofanya jambo tena au kutoendelea kulifanya; “tena” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: לִרְצוֹת
  choice: hatatuonyesha ... kibali chake
  rationale: רצה hapa inaonyesha kuwa na nia njema au kuwa mwenye kibali kwa mtu. “Kuonyesha kibali chake” huhifadhi maana ya kimahusiano na ya neema kwa lugha inayoeleweka.
theological_decisions:
- issue: Tafsiri ya cheo cha Mungu אֲדֹנָי
  choice: Bwana
  alternative: Adonai
  rationale: Chanzo kina cheo Adonai, si tetragramatoni YHWH. Kutafsiri cheo kuwa “Bwana” ni kwa kawaida katika Kiswahili na hakikichanganyi na uwasilishaji maalumu wa jina la Mungu.
- issue: Yambwa iliyodokezwa ya יִזְנַח na לִרְצוֹת
  choice: kutumia “-tu-” katika “atatukataa” na “hatatuonyesha”
  alternative: 'kuacha yambwa wazi: “atakataa ... hataonyesha kibali”'
  rationale: Kiebrania kinaweza kuacha yambwa idokezwe na muktadha, lakini Kiswahili huhitaji usemi kamili zaidi. Zaburi hii ni kilio cha msemaji kwa niaba yake na ya jumuiya; “-tu-” hufanya uhusiano huo uwe wa kawaida bila kuondoa mvutano wa swali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi inayofaa Zaburi. Muundo wa swali la balagha na mvutano wa kilio umehifadhiwa; lugha ya dhehebu maalumu imeepukwa.
