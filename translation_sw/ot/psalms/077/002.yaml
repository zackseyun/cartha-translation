base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/002.yaml
  text: In the day of my distress I sought the Lord[a]; my hand was stretched out in the night and did not grow numb; my soul refused to be comforted.
translation:
  language: sw
  text: Katika siku ya dhiki yangu nilimtafuta Bwana; mkono wangu ulinyooshwa usiku, wala haukulegea[a]; nafsi yangu ilikataa kufarijiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkono wangu ulitiririka usiku, wala haukulegea.” Taswira ya Kiebrania ni ngumu; maandishi makuu yanaielewa kuwa mkono ulionyoshwa bila kulegea katika sala ya kudumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם צָרָתִי
  choice: Siku ya dhiki yangu
  rationale: Kirai hiki kinaonyesha wakati wa taabu kali. “Siku ya dhiki yangu” kinadumisha muundo wa kishairi wa Kiebrania na kinaeleweka kwa Kiswahili cha sasa.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Hili ni jina la cheo אֲדֹנָי, si jina la Mungu YHWH; kwa hiyo limetafsiriwa kwa jina la cheo la kawaida la Kiswahili, “Bwana.”
- source_word: דָּרָשְׁתִּי
  choice: nilimtafuta
  rationale: Katika muktadha wa kumwelekea Mungu kwa sala, kitenzi דרשׁ humaanisha kumtafuta au kumwendea kwa bidii.
- source_word: יָדִי
  choice: mkono wangu
  rationale: Kiebrania kimetumia umoja, hivyo umoja umehifadhiwa badala ya kubadili kuwa “mikono yangu.”
- source_word: לַיְלָה נִגְּרָה וְלֹא תָפוּג
  choice: ulinyooshwa usiku, wala haukulegea
  rationale: נגר kwa kawaida huhusisha kutiririka au kumiminika, lakini pamoja na “mkono wangu” huenda taswira ni ya mkono ulionyoshwa daima katika sala. תָפוּג linaweza kumaanisha kulegea, kufifia, au kukoma. Tafsiri kuu inatoa maana inayowezekana huku tanbihi ikihifadhi taswira halisi iliyo ngumu.
- source_word: מֵאֲנָה הִנָּחֵם
  choice: ilikataa kufarijiwa
  rationale: מאן huonyesha kukataa, na muundo wa נפעל wa נחם hapa una maana ya kupokea faraja.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: נפשׁ linaweza kumaanisha nafsi, mtu mwenyewe, au uhai wa ndani. “Nafsi yangu” inadumisha lugha ya kishairi na kina cha maombolezo bila kuibana maana.
theological_decisions:
- issue: Tafsiri ya אֲדֹנָי
  choice: Bwana
  alternative: Mola
  rationale: Neno la chanzo ni jina la cheo אֲדֹנָי, wala si tetragramatoni YHWH. “Bwana” ni tafsiri ya kawaida, yenye heshima na inayoeleweka katika Biblia ya Kiswahili, bila kulichukulia kama jina YHWH.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Virai “dhiki yangu,” “nafsi yangu,” na “wala haukulegea” vinahifadhi uzito wa maombolezo bila kutumia lugha ya kizamani kupita kiasi.
