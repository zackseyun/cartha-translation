  yaml_path: translation/ot/psalms/077/010.yaml
  text: 'Then I said[b][a], “This is my grief: the years of the right hand of the Most High.”'
translation:
  language: sw
  text: 'Ndipo nikasema, “Hii ndiyo huzuni yangu[a]: miaka ya mkono wa kuume wa Aliye Juu Zaidi.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “udhaifu wangu,” au “ugonjwa wangu.” Neno la Kiebrania ni gumu na linaweza kumaanisha mateso, udhaifu, au ugonjwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “kubadilika kwa mkono wa kuume wa Aliye Juu Zaidi.” Wengine hulielewa umbo la Kiebrania hapa kuwa “mabadiliko,” wakimaanisha kwamba mkono wa kuume wa Aliye Juu Zaidi umebadilika, badala ya kurejelea “miaka ya” mkono wake wa kuume.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: Ndipo nikasema
  rationale: Kitenzi hiki kinaendeleza mfuatano wa mawazo na kuanzisha kauli ya mtunga zaburi; “Ndipo nikasema” ni ya asili katika Kiswahili na inaonyesha hatua hiyo mpya.
- source_word: חַלּוֹתִי
  choice: huzuni yangu
  rationale: Neno hili la Kiebrania ni gumu na linaweza kumaanisha mateso, udhaifu, au ugonjwa. “Huzuni yangu” linafaa katika muktadha wa maombolezo bila kuficha uwezekano mwingine, ambao umewekwa katika tanbihi.
- source_word: הִיא
  choice: Hii ndiyo
  rationale: Kiwakilishi hiki kinaelekeza kwenye hali au utambuzi unaozungumziwa. “Hii ndiyo” ni usemi wa kawaida wa Kiswahili unaoifanya rejea hiyo iwe wazi.
- source_word: שְׁנוֹת
  choice: miaka ya
  rationale: Kwa kawaida umbo hili hutokana na neno “mwaka,” hivyo “miaka ya” ndilo chaguo la moja kwa moja. Uwezekano wa kulihusisha na maana ya kubadilika umehifadhiwa katika tanbihi.
- source_word: יְמִין
  choice: mkono wa kuume wa
  rationale: Tafsiri hii inahifadhi taswira ya kishairi ya Kiebrania, ambayo mara nyingi huashiria nguvu au tendo la kuokoa.
- source_word: עֶלְיוֹן
  choice: Aliye Juu Zaidi
  rationale: Hili ni jina la cheo cha Mungu linaloonyesha ukuu wake na linaeleweka kwa urahisi katika Kiswahili cha kibiblia.
theological_decisions:
- issue: Maana ya mstari huu mgumu, hasa uhusiano kati ya huzuni ya mtunga zaburi na miaka ya mkono wa kuume wa Mungu
  choice: Kauli kuu inamtambulisha mtunga zaburi akieleza huzuni yake kwa kuihusianisha na miaka ya matendo yenye nguvu ya Aliye Juu Zaidi.
  alternative: 'Ndipo nikasema, “Hii ndiyo huzuni yangu: mkono wa kuume wa Aliye Juu Zaidi umebadilika.”'
  rationale: Kiebrania kinaruhusu miundo zaidi ya mmoja, hasa katika חַלּוֹתִי na שְׁנוֹת. Tafsiri kuu inafuata maana ya kawaida ya “miaka” huku tanbihi zikihifadhi utata halisi badala ya kuumaliza kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Taswira ya kishairi “mkono wa kuume” na jina la cheo “Aliye Juu Zaidi” zimehifadhiwa.
