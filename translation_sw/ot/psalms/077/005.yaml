source:
  edition: WLC
  text: חִשַּׁ֣בְתִּי יָמִ֣ים מִ/קֶּ֑דֶם שְׁ֝נ֗וֹת עוֹלָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/005.yaml
  text: I considered the days of old[a], the years of ages past.
translation:
  language: sw
  text: 'Nilifikiria siku za kale,

    miaka ya zamani za mbali.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miaka ya nyakati za kale.” Neno la Kiebrania עוֹלָמִים hapa linarejelea zamani za mbali sana, si lazima umilele kwa maana kamili.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִשַּׁבְתִּי
  choice: Nilifikiria
  rationale: Kitenzi חשׁב hapa kinaonyesha kutafakari au kufikiria kwa makusudi; “Nilifikiria” ni Kiswahili cha kawaida na hakipunguzi maana kuwa kukumbuka tu.
- source_word: יָמִים מִקֶּדֶם
  choice: siku za kale
  rationale: Kirai hiki hurejelea siku za zamani sana. “Siku za kale” ni cha kishairi, chenye hadhi, na kinaeleweka kwa urahisi.
- source_word: שְׁנוֹת עוֹלָמִים
  choice: miaka ya zamani za mbali
  rationale: עוֹלָמִים katika muktadha huu huonyesha zamani za mbali sana, si lazima umilele usio na mwisho. Tafsiri hii inadumisha usambamba wa kishairi na uzito wa muda mrefu uliopita.
theological_decisions:
- issue: Ikiwa עוֹלָמִים humaanisha umilele kamili au zamani za mbali
  choice: zamani za mbali
  alternative: milele
  rationale: Kwa kuwa neno hilo linaambatana na “miaka” na linasawazishwa na “siku za kale,” muktadha unaelekea kwenye nyakati za kale sana bila kulazimisha maana ya umilele kamili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa kishairi wenye hadhi lakini unaoeleweka kwa wasomaji wa kawaida. Mistari miwili inadumisha usambamba wa Kiebrania.
