  yaml_path: translation/ot/psalms/077/001.yaml
  text: My voice is to God[a], and I cry out; my voice is to God[b], and he gives ear to me.
translation:
  language: sw
  text: 'Namlilia Mungu kwa sauti yangu;[a]

    nami napaza kilio;

    namlilia Mungu kwa sauti yangu,

    naye anisikilize.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kihalisi: “Sauti yangu kwa Mungu.” Kirai hiki kimerudiwa katika nusu ya pili ya mstari.'
    reason: literal_rendering
  - marker: b
    text: 'Kitenzi cha Kiebrania, katika maandishi haya yenye vokali, ni amri: “na asikilize kwa makini kwangu.” Baadhi ya mapokeo ya tafsiri hukisoma kama kauli ya taarifa: “naye ananisikiliza” au “naye alinisikiliza.”'
    reason: textual_grammatical_ambiguity
lexical_decisions:
- source_word: קוֹלִי אֶל אֱלֹהִים
  choice: Ninamlilia Mungu kwa sauti yangu
  rationale: Kiebrania kinasema kihalisi, “sauti yangu kwa Mungu.” Kiswahili hiki kinaonyesha kuwa sauti ya mwombaji inaelekezwa kwa Mungu, huku kikibaki cha kawaida na chenye nguvu katika ushairi.
- source_word: וְאֶצְעָקָה
  choice: ninamlilia
  rationale: Mzizi צעק huonyesha kilio kikali cha kuomba msaada. “Ninamlilia” huwasilisha kilio kinachoelekezwa kwa Mungu, si mwito wa kawaida tu.
- source_word: וְהַאֲזִין אֵלָי
  choice: naye anisikilize
  rationale: Umbo הַאֲזִין, kwa vokali zake katika WLC, kwa kawaida ni agizo la Hifili, “sikiliza kwa makini.” Katika muktadha wa sala, “anisikilize” ni ombi la heshima na linaendeleza maana ya kusikiliza kwa makini.
theological_decisions:
- issue: Je, sehemu ya mwisho ni ombi kwa Mungu au taarifa kwamba Mungu anasikiliza?
  choice: 'Ombi: “naye anisikilize.”'
  alternative: 'Taarifa: “naye ananisikiliza” au “naye alinisikiliza.”'
  rationale: Vokali za maandishi ya WLC zinaunga mkono zaidi umbo la agizo “sikiliza.” Kiswahili cha nafsi ya tatu cha kutakia, “anisikilize,” kinahifadhi hali ya ombi bila kuongeza maneno ya maelezo. Tanbihi inataja tafsiri ya kitaarifa inayofuatwa na mapokeo mengi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Marudio yamehifadhiwa ili kuonyesha msisitizo wa mstari wa Kiebrania; “ninamlilia” huepuka kauli ngumu isiyo ya kawaida “sauti yangu ni kwa Mungu.”
