base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/018.yaml
  text: The sound of your thunder was in the whirlwind[a]; lightning lit up the world; the earth trembled and quaked.
translation:
  language: sw
  text: Sauti ya radi yako ilisikika katika kisulisuli[a]; miale ya umeme iliangaza ulimwengu; dunia ilitetemeka na kutikisika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika gurudumu”; huenda neno la Kiebrania linatoa picha ya dhoruba inayozunguka, ndiyo maana limetafsiriwa “katika kisulisuli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֤וֹל
  choice: Sauti ya
  rationale: קול humaanisha ‘sauti’ au ‘sauti ya kusema.’ Ikiwa imeunganishwa na radi, ‘sauti ya radi yako’ ni Kiswahili cha kawaida na kinachohifadhi taswira ya kusikia.
- source_word: רַעַמְךָ
  choice: radi yako
  rationale: Nomino hii humaanisha radi; kiambishi cha nafsi ya pili umoja kimehifadhiwa kwa ‘yako,’ kwa kuwa mtunga zaburi anamwelekea Mungu moja kwa moja.
- source_word: בַּגַּלְגַּל
  choice: katika kisulisuli
  rationale: גלגל kimsingi huweza kumaanisha gurudumu au kitu kinachozunguka, lakini katika muktadha huu wa radi na umeme inaelekea kutaja dhoruba inayozunguka. ‘Kisulisuli’ huhifadhi taswira hiyo ya mzunguko.
- source_word: הֵאִירוּ
  choice: uliuangazia
  rationale: Hifili ya אור humaanisha kutoa nuru au kuangaza. Kwa sababu ‘umeme’ kwa kawaida hutumiwa kama nomino ya umoja katika Kiswahili, kitenzi cha umoja kimetumiwa kwa namna ya asili.
- source_word: בְרָקִים
  choice: umeme
  rationale: Ingawa neno la Kiebrania ni la wingi, Kiswahili kwa kawaida hutumia ‘umeme’ kama nomino isiyohesabika kwa mwanga wa radi.
- source_word: תֵּבֵל
  choice: ulimwengu
  rationale: תבל hutaja ulimwengu, hasa dunia inayokaliwa. ‘Ulimwengu’ ni tafsiri fupi na ya kawaida katika muktadha huu wa kiulimwengu.
- source_word: רָגְזָה
  choice: ilitetemeka
  rationale: Kitenzi hiki huonyesha kutetemeka au kufadhaika. ‘Ilitetemeka’ linafaa kwa dunia na linatofautishwa na kitenzi kinachofuata.
- source_word: וַתִּרְעַשׁ
  choice: na kutikisika
  rationale: Kitenzi hiki humaanisha kutikisika au kutetemeka kwa nguvu. Kutumia neno tofauti kunahifadhi mkazo wa kishairi wa vitenzi viwili vya Kiebrania.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: Katika muktadha huu wa ufunuo wa Mungu unaogusa ulimwengu mzima, ‘dunia’ inafaa kuliko ‘nchi.’
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa mistari sambamba na ongezeko la nguvu katika ‘ilitetemeka na kutikisika’ umehifadhiwa; alama ya tanbihi [a] imewekwa mara tu baada ya neno linalohusika.
