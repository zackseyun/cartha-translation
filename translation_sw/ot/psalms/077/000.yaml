lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongozaji wa muziki
  rationale: Katika vichwa vya Zaburi, neno hili humtaja anayesimamia uimbaji au utendaji wa muziki. Kauli hii ni ya kawaida na inaeleweka katika Kiswahili cha sasa.
- source_word: עַל
  choice: kwa kufuata
  rationale: Katika kichwa cha muziki, kihusishi hiki kinaweza kutambulisha mtindo, tuni, kikundi, au utaratibu wa utendaji; ‘kwa kufuata’ huepuka maana ya mahali ya ‘juu ya.’
- source_word: יְדוּתוּן
  choice: Yeduthuni
  rationale: Ni jina la mtu au la kikundi kilichohusishwa naye, hivyo limetoholewa badala ya kutafsiriwa.
- source_word: לְאָסָף
  choice: ya Asafu
  rationale: Kihusishi cha Kiebrania kinaweza kuonyesha utunzi, uhusiano, au wakfu. ‘Ya Asafu’ ni kifupi na cha asili, huku tanbihi ikihifadhi upana wa maana.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa aina hii ya wimbo wa ibada wenye uandamani wa muziki.
theological_decisions:
- issue: Uhusiano wa Asafu na zaburi
  choice: Zaburi ya Asafu
  alternative: Zaburi kwa ajili ya Asafu
  rationale: Kiebrania hakiamui wazi kama Asafu ndiye mtunzi, mhusika wa kikundi, au anayekabidhiwa zaburi; tafsiri kuu inabaki fupi, na tanbihi inaeleza uwezekano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni fupi na yenye hadhi inayofaa kichwa cha zaburi. Jina Jeduthun limetoholewa kuwa Yeduthuni, na Asaph kuwa Asafu kwa kufuata matumizi yaliyozoeleka katika Biblia za Kiswahili.
