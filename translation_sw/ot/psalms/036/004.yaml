  text: He devises wickedness on his bed[a]; he sets himself on a way that is not good; he does not reject evil.
translation:
  language: sw
  text: Hupanga uovu kitandani mwake[a]; hujiweka katika njia isiyo njema; hakatai uovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hutunga maovu kitandani mwake … hachukii uovu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָוֶן
  choice: uovu
  rationale: Katika muktadha huu neno lina maana ya kimaadili ya uovu unaopangwa kwa makusudi. “Uovu” ni la kawaida na lenye hadhi katika Kiswahili cha sasa.
- source_word: יַחְשֹׁב
  choice: hupanga
  rationale: Kitenzi hapa kinaonyesha kutafakari na kupanga kwa makusudi, si kuwaza tu; “hupanga” huwasilisha nia hiyo kwa lugha ya kawaida.
- source_word: עַל מִשְׁכָּבוֹ
  choice: kitandani mwake
  rationale: Hii ni tafsiri ya asili ya mahali inayohifadhi picha ya mtu akipanga uovu akiwa kitandani.
- source_word: יִתְיַצֵּב
  choice: hujiweka
  rationale: Umbo la kujirejelea linaonyesha kwamba mtu huyo anajiweka kwa makusudi katika mwenendo fulani.
- source_word: עַל דֶּרֶךְ לֹא טוֹב
  choice: katika njia isiyo njema
  rationale: “Njia” huhifadhi sitiari ya Kiebrania ya mwenendo wa maisha, na “isiyo njema” hudumisha usemi wa asili bila kuufupisha kuwa “njia mbaya.”
- source_word: רָע
  choice: uovu
  rationale: Hapa neno linarejelea uovu wa kimaadili kama kitu ambacho mtu huyo hakikatai.
- source_word: לֹא יִמְאָס
  choice: haukatai
  rationale: Kitenzi kinaweza kumaanisha kukataa, kudharau, au kuchukia. “Haukatai” huonyesha kutokukana au kutouepuka uovu bila kuongeza nguvu ya maana isiyo lazima.
