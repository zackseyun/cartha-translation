  text: The words of his mouth are wickedness and deceit; he has ceased to act wisely[a], to do good.
translation:
  language: sw
  text: Maneno ya kinywa chake ni uovu na udanganyifu; ameacha kutenda kwa hekima[a] na kufanya mema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ameacha kuwa na hekima katika kufanya mema.” Infinitivu hizi mbili za Kiebrania zinaweza pia kueleweka kama vikamilisho viwili vinavyolingana vya “ameacha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי פִיו
  choice: Maneno ya kinywa chake
  rationale: Inahifadhi wingi wa דִּבְרֵי na taswira halisi ya Kiebrania ya maneno yatokayo kinywani, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: אָוֶן
  choice: uovu
  rationale: Katika muktadha huu, neno linaeleza ubaya wa kimaadili wa maneno yake; “uovu” ni la kawaida na lina uzito unaofaa.
- source_word: וּמִרְמָה
  choice: na udanganyifu
  rationale: מִרְמָה humaanisha hila au udanganyifu; “udanganyifu” linafaa hasa kwa maelezo ya usemi.
- source_word: חָדַל
  choice: ameacha
  rationale: Kitenzi cha Qal perfect kinaonyesha kusitisha au kuacha mwenendo fulani; “ameacha” huwasilisha maana hiyo kwa kawaida.
- source_word: לְהַשְׂכִּיל
  choice: kutenda kwa hekima
  rationale: Hiphil ya שכל hapa inaelekea kwenye hekima ya vitendo au kutenda kwa busara, si kuwa na maarifa tu.
- source_word: לְהֵיטִיב
  choice: kufanya mema
  rationale: Hiphil ya יטב inaweza kumaanisha kutenda mema au kutenda vizuri; “kufanya mema” huhifadhi nguvu ya kimaadili katika muktadha.
theological_decisions:
- issue: Uhusiano wa לְהַשְׂכִּיל na לְהֵיטִיב baada ya חָדַל
  choice: 'Vimetafsiriwa kama vitimilizo viwili vinavyolingana: “kutenda kwa hekima … na kufanya mema.”'
  alternative: “ameacha kuwa na hekima katika kufanya mema”
  rationale: Sintaksia ya Kiebrania inaruhusu infinitivi hizo kueleweka ama kwa usambamba ama kwa uhusiano wa karibu. Maandishi makuu yanatumia usambamba wa kawaida katika Kiswahili, huku tanbihi ikihifadhi uwezekano mwingine bila kuamua mvutano wa kifasiri kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, wazi na yenye hadhi. Muundo wa “kinywa chake” umehifadhiwa kama taswira ya Kiebrania, na tanbihi imewekwa baada ya “hekima” ili kuonyesha mahali penye utata wa kisintaksia.
