base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/005.yaml
  text: O Yahweh[a], your steadfast love is in the heavens; your faithfulness reaches to the clouds.
translation:
  language: sw
  text: Ee Yahweh, upendo wako thabiti uko mbinguni[a]; uaminifu wako unafika mawinguni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upendo wako thabiti unafika mbinguni”; Kiebrania kinaweza kueleweka kuwa kinaonyesha umbali unaofikiwa badala ya mahali tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la agano limetafsiriwa moja kwa moja kama “Yahwe”; “Ee” linaonyesha kuwa mtunga zaburi anamwambia Mungu moja kwa moja.
- source_word: בְּהַשָּׁמַיִם
  choice: uko mbinguni
  rationale: Kihusishi בְּ kimsingi kina maana ya mahali, “mbinguni.” Kitenzi “uko” kimeongezwa ili sentensi iwe ya kawaida katika Kiswahili.
- source_word: חַסְדֶּךָ
  choice: upendo wako thabiti
  rationale: חֶסֶד hapa ni upendo wa kudumu, mwaminifu na wenye kujitoa. “Upendo thabiti” ni wa kisasa na unaeleweka bila kuufanya istilahi ya dhehebu fulani.
- source_word: אֱמוּנָתְךָ
  choice: uaminifu wako
  rationale: אֱמוּנָה katika ulinganifu huu humaanisha kutegemeka au kuwa mwaminifu, hasa sambamba na חֶסֶד.
- source_word: עַד
  choice: wafika
  rationale: Ingawa עַד kihalisi ni “hadi,” “wafika” huonyesha kwa ufasaha kiwango kikubwa cha uaminifu katika mstari wa kishairi.
- source_word: שְׁחָקִים
  choice: mawinguni
  rationale: Neno hili la kishairi hurejelea mawingu au anga za juu; “mawinguni” linahifadhi picha halisi na ulinganifu wake na “mbinguni.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja. “Yahwe” hulihifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya חֶסֶד
  choice: upendo thabiti
  alternative: rehema
  rationale: “Upendo thabiti” huhifadhi wazo la upendo wa kudumu na mwaminifu, ilhali “rehema” peke yake inaweza kupunguza upana wa maana ya neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa mistari sambamba na taswira za “mbinguni” na “mawinguni” umehifadhiwa; umbo la kishairi “wafika” limetumiwa kwa ufasaha na hadhi.
