lexical_decisions:
- source_word: נְאֻם
  choice: humwambia
  rationale: Nomino hii huanzisha tamko lenye uzito. Muundo wa kitenzi “humwambia” ni wa kawaida katika Kiswahili na unaonyesha kwamba uasi unatoa ujumbe kwa mwovu.
- source_word: פֶּשַׁע
  choice: Uasi
  rationale: Neno hili linamaanisha kuvunja kwa makusudi uaminifu au amri. “Uasi” huhifadhi uzito wa kimaadili na wa uhusiano bila kuufanya muktadha kuwa wa kisheria tu.
- source_word: לָרָשָׁע
  choice: mwovu
  rationale: Huyu ndiye anayeelekezewa tamko la uasi. Umoja umehifadhiwa kama katika Kiebrania.
- source_word: בקרב לבי
  choice: ndani ya moyo wangu
  rationale: Maandishi ya Kimasora yana kiambishi cha nafsi ya kwanza, “moyo wangu.” Tafsiri inakihifadhi badala ya kukibadili kuwa “moyo wake,” hata ingawa muundo huo ni mgumu.
- source_word: אֵין פַּחַד אֱלֹהִים
  choice: hana hofu ya Mungu
  rationale: “Hofu ya Mungu” inaweza kumaanisha kumcha Mungu kwa kicho, si woga wa kutishwa pekee. Muundo wa Kiswahili “hana hofu ya Mungu” ni wazi na wa kawaida.
- source_word: לנגד עיניו
  choice: mbele ya macho yake
  rationale: Taswira ya Kiebrania imehifadhiwa; inaonyesha kwamba kumcha Mungu hakupo katika mtazamo au fikira za mwovu.
theological_decisions:
- issue: Nafsi na mtazamo katika usomaji mgumu לִבִּי (“moyo wangu”)
  choice: Kuhifadhi “ndani ya moyo wangu” huku “macho yake” yakimrejelea mwovu.
  alternative: “Ndani ya moyo wake,” au “Moyoni mwangu nina ujumbe kuhusu mwovu.”
  rationale: Maandishi ya Kimasora yanaunga mkono nafsi ya kwanza, “moyo wangu.” Tafsiri haiondoi mvutano huo kwa marekebisho, bali inadumisha tofauti kati ya utambuzi wa ndani wa mtunga zaburi na hali ya mwovu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Uasi” na “hofu ya Mungu” huhifadhi uzito wa kimaadili na taswira ya chanzo; mpangilio mgumu wa “ndani ya moyo wangu” umeachwa katika mstari na kufafanuliwa kwa tanbihi.
