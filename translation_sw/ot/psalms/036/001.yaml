  text: 'Ndani ya moyo wangu, uasi humwambia mwovu[a][b]: hana hofu ya Mungu mbele ya macho yake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ndani ya moyo wangu.” Baadhi ya tafsiri za kale na tafsiri za kisasa hulainisha usomaji huu kuwa “ndani ya moyo wake,” au hufafanua, “Nina ujumbe moyoni mwangu kuhusu mwovu.”'
    reason: alternative_reading
  - marker: b
