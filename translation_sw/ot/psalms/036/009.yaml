  text: For with you is the fountain of life[b][a]; in your light we see light.
translation:
  language: sw
  text: Kwa maana kwako kuna chemchemi ya uzima[a]; katika nuru yako tunaona nuru.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chemchemi ya uhai” au “chanzo cha uzima.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa nuru yako tunaona nuru.”
