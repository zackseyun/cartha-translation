lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kishazi hiki kinaeleza msingi wa sifa na ombi lililotangulia; “Kwa maana” huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: עִמְּךָ
  choice: kwako
  rationale: Katika muktadha huu, “kwako” huonyesha kwamba chemchemi hiyo iko kwa Mungu, bila kuigeuza moja kwa moja kuwa kauli ya kifafanuzi kwamba yeye ndiye chanzo.
- source_word: מְקוֹר
  choice: chemchemi
  rationale: Neno hili humaanisha chemchemi au chimbuko la maji; “chemchemi” huhifadhi taswira hai ya kishairi.
- source_word: חַיִּים
  choice: uzima
  rationale: Ingawa umbo la Kiebrania ni la wingi, hapa ni nomino dhahania yenye maana ya uhai au uzima; “uzima” ni ya asili na yenye hadhi katika Kiswahili.
- source_word: בְּאוֹרְךָ
  choice: katika nuru yako
  rationale: Huhifadhi kwa upana maana ya kiambishi בְ pamoja na taswira ya kuwa katika nuru ya Mungu, bila kuifinya kuwa chombo pekee.
- source_word: נִרְאֶה
  choice: tunaiona
  rationale: Kitenzi hiki kinaeleza ukweli wa jumla wa sasa; “tunaiona” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אוֹר
  choice: nuru
  rationale: “Nuru” huhifadhi maana na marudio ya kishairi ya neno lilelile katika Kiebrania.
theological_decisions:
- issue: Nguvu ya sitiari za uzima na nuru ya Mungu
  choice: Kuhifadhi “chemchemi ya uzima” na “katika nuru yako tunaiona nuru” bila maelezo ya ziada.
  alternative: Kufafanua kuwa “wewe ndiwe chanzo cha uzima wote” au “kwa ukweli wako tunaelewa.”
  rationale: Kiebrania kinatumia taswira pana za kishairi kuhusu Mungu, uzima, na nuru. Tafsiri haipaswi kuzipunguza kuwa ufafanuzi mmoja wa kimafundisho.
- issue: Maana ya kiambishi בְ katika בְּאוֹרְךָ
  choice: katika nuru yako
  alternative: kwa nuru yako
  rationale: “Katika” huhifadhi taswira ya Kiebrania na uwezekano mpana wa maana; “kwa” pia inawezekana ikiwa nuru inaeleweka kama njia au chombo cha kuona.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Chemchemi” na “nuru” huhifadhi taswira na marudio ya Kiebrania; mpangilio umewekwa kwa urahisi wa kusoma bila kuondoa utata halisi.
