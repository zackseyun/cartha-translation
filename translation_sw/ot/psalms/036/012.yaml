lexical_decisions:
- source_word: שָׁם
  choice: Hapo
  rationale: Kielezi hiki cha mahali kinaelekeza kwenye eneo au hali ya kuanguka kwa waovu; “hapo” ni ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: נָפְלוּ
  choice: wameanguka
  rationale: Kauli timilifu inaonyesha tendo lililotimia lenye matokeo yanayoonekana; wakati timilifu wa Kiswahili unafaa hapa.
- source_word: פֹּעֲלֵי אָוֶן
  choice: watenda uovu
  rationale: Huhifadhi wazo la watu wanaoutenda uovu, huku ikiwa ya asili na kueleweka kuliko tafsiri ndefu zaidi kama “wafanyaji wa uovu.”
- source_word: אָוֶן
  choice: uovu
  rationale: Katika muktadha huu neno lina maana ya kimaadili ya uovu au ubaya, si hasa taabu.
- source_word: דֹּחוּ
  choice: wameangushwa chini
  rationale: Kauli hii huonyesha kupinduliwa kwa nguvu na hali ya kubaki chini; Kiswahili hiki ni cha asili na kinadumisha picha ya kishairi.
- source_word: וְלֹא יָכְלוּ קוּם
  choice: nao hawawezi kuinuka
  rationale: Hueleza kushindwa kuinuka baada ya kuangushwa na kudumisha picha ya kuanguka kusikoweza kurekebishwa.
