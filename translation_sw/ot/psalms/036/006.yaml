base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/006.yaml
  text: Your righteousness is like the mountains of God[a]; your judgments are a great deep. O Yahweh[b], you save man and beast.
translation:
  language: sw
  text: Haki yako ni kama milima ya Mungu[a]; hukumu zako ni kilindi kikuu. Ee Yahweh, unaokoa mwanadamu na mnyama[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “milima ya Mungu”; huenda maana yake ikawa “milima mikubwa sana” au “milima iliyo mirefu zaidi.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “unaokoa wanadamu na wanyama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקָתְךָ
  choice: Haki yako
  rationale: “Haki” inahifadhi maana pana ya kile kilicho sawa na cha uadilifu, bila kuipunguza kuwa utekelezaji wa hukumu pekee.
- source_word: כְּהַרְרֵי אֵל
  choice: kama milima ya Mungu
  rationale: Tafsiri hii inafuata muundo wa Kiebrania na kuhifadhi uwezekano wa kuelewa usemi huo kihalisi au kama namna ya kusisitiza ukuu.
- source_word: מִשְׁפָּטֶךָ
  choice: hukumu zako
  rationale: “Hukumu” inaonyesha maamuzi au matendo ya Mungu ya kuhukumu na kudumisha tofauti ya kileksia na צִדְקָה.
- source_word: תְּהוֹם רַבָּה
  choice: kilindi kikuu
  rationale: Usemi huu unahifadhi taswira ya kina kisichopimika na uzito wa kishairi wa maandishi ya chanzo.
- source_word: אָדָם
  choice: mwanadamu
  rationale: Nomino ya umoja imetumiwa kwa maana ya jumla, ikiwakilisha jamii ya wanadamu katika ulinganisho wake na mnyama.
- source_word: וּבְהֵמָה
  choice: na mnyama
  rationale: “Mnyama” huhifadhi umoja wa jumla katika jozi ya kishairi “mwanadamu na mnyama,” bila kuifinya maana iwe mifugo tu.
- source_word: תוֹשִׁיעַ
  choice: unawaokoa
  rationale: “Kuokoa” ni pana vya kutosha kujumuisha kuponya, kukomboa, au kuhifadhi hai, huku ikidumisha uzito wa kitheolojia wa kitenzi.
- source_word: יְהוָה
  choice: Ee Yahweh
  rationale: Jina la Mungu limeandikwa kwa unukuzi kama jina binafsi; “Ee” linaonyesha mwito wa moja kwa moja unaofaa katika sentensi hii.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Ee Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; “Yahweh” hulihifadhi badala ya kulibadilisha kwa cheo.
- issue: Maana ya jumla ya אָדָם
  choice: mwanadamu
  alternative: wanadamu
  rationale: Umoja wa jumla wa chanzo umehifadhiwa katika jozi ya kishairi “mwanadamu na mnyama”; wingi unaoweka maana hiyo wazi zaidi umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki chenye mtindo wa kishairi, wa heshima, na unaoeleweka. Miundo ya “milima ya Mungu” na “kilindi kikuu” inadumisha picha na utata halisi wa Kiebrania; alama zote za tanbihi zimewekwa katika matini kuu.
