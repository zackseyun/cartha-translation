  text: For the choirmaster[a]. Of David[d][c][b], the servant of Yahweh.
translation:
  language: sw
  text: Kwa mwongoza muziki.[a] Ya Daudi,[b] mtumishi wa Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa kiongozi wa muziki.” Neno la Kiebrania humaanisha kiongozi au msimamizi wa muziki katika ibada.
    reason: lexical_alternative
  - marker: b
    text: Au, “Ya mtumishi wa Yahweh, Daudi.” Kihusishi kinachotumiwa pamoja na jina la Daudi kinaonyesha uhusiano kwa maana pana, bila kuamua chenyewe ikiwa Daudi ndiye mtunzi, ndiye aliyepewa zaburi hii, au anahusishwa nayo kwa njia nyingine.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza muziki
  rationale: Kirai hiki cha kawaida katika vichwa vya Zaburi humwelekezea kiongozi au msimamizi wa muziki wa ibada. Tafsiri hii ni ya kawaida katika Kiswahili na haibani jukumu hilo kuwa uongozi wa kwaya pekee.
- source_word: לְעֶבֶד
  choice: mtumishi wa
  rationale: עֶבֶד hapa ni cheo cha heshima kinachoeleza uhusiano wa Daudi na Yahweh, si muktadha unaosisitiza hali ya utumwa; kwa hiyo “mtumishi” linafaa zaidi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Tetragramatoni limeandikwa moja kwa moja badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: לְדָוִד
  choice: Zaburi ya Daudi
  rationale: Katika kichwa cha zaburi, לְ inaweza kuonyesha uhusiano, umilikisho, au utunzi. “Zaburi ya Daudi” ni kichwa cha asili katika Kiswahili huku kikiacha upeo huo wazi kuliko “iliyoandikwa na Daudi.”
theological_decisions:
- issue: Uwakilishi wa jina יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu, si cheo. “Yahweh” huhifadhi jina hilo bila kulibadilisha na “BWANA.”
- issue: Maana ya עֶבֶד katika kichwa hiki
  choice: mtumishi
  alternative: mtumwa
  rationale: Hapa neno hilo ni cheo cha heshima cha Daudi katika uhusiano wake na Mungu; “mtumwa” lingeleta mkazo wa hali ya kufungwa ambao muktadha hauutangulizi.
- issue: Upeo wa לְדָוִד
  choice: Zaburi ya Daudi
  alternative: Zaburi iliyoandikwa na Daudi; kwa ajili ya Daudi
  rationale: Kihusishi לְ katika vichwa vya Zaburi hakithibitishi peke yake utunzi. Tafsiri iliyochaguliwa huhifadhi uhusiano mpana bila kuamua zaidi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, katika mtindo mfupi na wenye heshima unaofaa kichwa cha zaburi. “Mwongoza muziki” ni pana na ya kawaida kuliko “mkuu wa kwaya,” na “Zaburi ya Daudi” ni ya asili bila kulazimisha hoja ya utunzi.
