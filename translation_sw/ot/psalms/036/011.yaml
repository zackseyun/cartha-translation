  text: Let not the foot of pride come against me[b][a], and let not the hand of the wicked drive me away.
translation:
  language: sw
  text: Mguu wa kiburi usije dhidi yangu,[a] wala mkono wa waovu usinifukuze.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “usije juu yangu.” Kihalisi, Kiebrania husema, “mguu wa kiburi usije kwangu.”
    reason: lexical_alternative
  - marker: b
    text: Au “usinifanye nitange” au “usinifanye nikimbie.” Kitenzi kinaweza kumaanisha kuondoshwa mahali pa mtu kwa nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבוֹאֵנִי
  choice: usije dhidi yangu
  rationale: Kitenzi בוא pamoja na kiima cha kishairi “mguu wa kiburi” kinaonyesha kumkaribia mtu kwa uhasama. “Usije dhidi yangu” kinahifadhi mwendo wa picha ya Kiebrania na kuweka wazi muktadha wa uadui.
- source_word: רֶגֶל גַּאֲוָה
  choice: mguu wa kiburi
  rationale: Tafsiri hii inahifadhi muundo halisi na taswira ya kishairi ya Kiebrania, bila kugeuza nomino dhahania “kiburi” kuwa watu wenye kiburi.
- source_word: יַד רְשָׁעִים
  choice: mkono wa waovu
  rationale: “Mkono” huhifadhi taswira ya uwezo au utendaji, na “waovu” ni tafsiri ya kawaida ya nomino ya wingi bila kuongeza jinsia isiyolazimishwa na muktadha.
- source_word: תְּנִדֵנִי
  choice: usinifukuze
  rationale: Katika kausativi, kitenzi kinaweza kumaanisha kumwondoa mtu mahali pake, kumfanya atange, au akimbie. “Usinifukuze” ni Kiswahili cha kawaida kinachoonyesha kuondolewa kwa nguvu huku maelezo ya chini yakihifadhi maana mbadala.
- source_word: אַל
  choice: usije … wala … usinifukuze
  rationale: Chembe ya kukanusha pamoja na maumbo ya ombi imewasilishwa kama dua ya kukataza katika Kiswahili cha heshima na cha kishairi.
