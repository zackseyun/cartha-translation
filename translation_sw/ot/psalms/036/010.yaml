    reason: lexical_alternative
lexical_decisions:
- source_word: מְשֹׁךְ
  choice: Endeleza
  rationale: Kitenzi hiki kwa msingi kina maana ya kuvuta au kunyoosha. Katika ombi hili, “endeleza” huwasilisha kwa Kiswahili cha kawaida wazo la Mungu kuufanya upendo wake udumu na kuufikisha mbele.
- source_word: חַסְדְּךָ
  choice: upendo wako wa kudumu
  rationale: חֶסֶד hapa inaonyesha upendo wenye uaminifu na uthabiti katika uhusiano, si hisia tu. “Upendo wa kudumu” ni wa asili na unaeleweka kwa wasomaji wa Kiswahili.
- source_word: לְיֹדְעֶיךָ
  choice: kwa wale wanaokujua
  rationale: Muundo huu humaanisha “wale wanaokujua,” ukiwa na maana ya kumtambua Mungu katika uhusiano, wala si kuwa na taarifa kumhusu tu.
- source_word: וְצִדְקָתְךָ
  choice: na uadilifu wako
  rationale: צְדָקָה inaweza kuonyesha uadilifu, haki, au kutenda lililo sawa. “Uadilifu” hapa huhifadhi sifa ya Mungu na matendo yake ya uaminifu bila kuifupisha maana kuwa hukumu ya kisheria pekee.
- source_word: לְיִשְׁרֵי לֵב
  choice: kwa walio wanyoofu moyoni
  rationale: Nahau hii ya Kiebrania inaeleza watu wenye unyofu wa ndani. “Wanyoofu moyoni” ni Kiswahili cha kawaida, chenye hadhi, na kinahifadhi picha ya moyo.
theological_decisions:
- issue: Uwasilishaji wa חֶסֶד na צְדָקָה kama sifa za Mungu zilizo sambamba
  choice: “upendo wako wa kudumu” na “uadilifu wako”
  alternative: “rehema zako” na “haki yako”
  rationale: Chaguo hili linahifadhi usambamba wa kishairi na upana wa maana za Kiebrania bila kuingiza kwa lazima maana maalumu ya kimahakama au mfumo fulani wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sala ya kishairi ulio wazi na wenye hadhi. “Endeleza” limetumiwa kwa maana ya kuufanya upendo uendelee, na “wanyoofu moyoni” huhifadhi nahau ya Kiebrania kwa lugha ya kawaida.
