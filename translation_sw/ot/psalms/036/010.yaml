  text: Continue your steadfast love to those who know you[b][a], and your righteousness to the upright in heart.
translation:
  language: sw
  text: Endeleza[a] upendo wako wa kudumu kwa wale wanaokujua, na uadilifu wako[b] kwa walio wanyoofu moyoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nyosha upendo wako wa kudumu.” Kitenzi cha Kiebrania kwa maana halisi ni “vuta” au “nyosha.”
