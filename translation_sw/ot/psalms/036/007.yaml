  yaml_path: translation/ot/psalms/036/007.yaml
  text: How precious is your steadfast love[b][a], O God! The children of man take refuge in the shadow of your wings.
translation:
  language: sw
  text: Ee Mungu, jinsi upendo wako wa kudumu ulivyo wa thamani![a] Wanadamu hujisitiri katika uvuli wa mabawa yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Upendo wa kudumu” hutafsiri neno la Kiebrania hesed, ambalo pia linaweza kujumuisha rehema, upendo mwaminifu, na ushikamanifu wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָּקָר
  choice: jinsi ... ulivyo wa thamani
  rationale: Muundo huu unaonyesha mshangao na kustaajabia thamani kuu, wala si kuuliza swali.
- source_word: חַסְדְּךָ
  choice: upendo wako wa kudumu
  rationale: Neno חֶסֶד linajumuisha upendo, uaminifu, rehema, na ushikamanifu katika uhusiano; tafsiri hii inaweka mbele upendo wenye uthabiti bila kulibana kwa maana moja tu.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Hii ni kauli ya kumwita Mungu moja kwa moja; “Ee” huwasilisha nguvu ya vocative kwa Kiswahili cha kishairi na cha kawaida.
- source_word: וּבְנֵי אָדָם
  choice: Wanadamu
  rationale: Nahau ya Kiebrania ina maana ya watu kwa ujumla. “Wanadamu” ni ya asili katika Kiswahili na inahifadhi rejeo la pamoja kwa jamii yote ya binadamu.
- source_word: בְּצֵל כְּנָפֶיךָ
  choice: katika uvuli wa mabawa yako
  rationale: “Uvuli” unahifadhi taswira ya kishairi ya ukaribu na ulinzi chini ya mabawa, badala ya kuibadili moja kwa moja kuwa “mahali pa usalama.”
- source_word: יֶחֱסָיוּן
  choice: hujisitiri
  rationale: Kitenzi חָסָה humaanisha kukimbilia au kujitia mahali pa hifadhi. “Hujisitiri” ni usemi wa asili unaoonyesha kutafuta ulinzi huku ukihifadhi taswira ya uvuli wa mabawa.
theological_decisions:
- issue: Upeo wa maana ya חֶסֶד
  choice: upendo wako wa kudumu
  alternative: rehema yako; uaminifu wako wa agano
  rationale: Uteuzi huu unadumisha upana wa upendo wenye uaminifu na uthabiti bila kuamua kimya kimya kuwa neno hilo linamaanisha rehema pekee au istilahi ya kiufundi ya agano pekee.
- issue: Rejeo la pamoja katika בְנֵי אָדָם
  choice: Wanadamu
  alternative: wana wa Adamu; watoto wa binadamu
  rationale: Katika muktadha huu nahau inawahusu wanadamu kwa ujumla. Kiswahili “Wanadamu” kinawasilisha maana hiyo kwa uwazi bila kuifanya sentensi kuwa ya wanaume pekee.
- issue: Taswira ya mabawa ya Mungu
  choice: uvuli wa mabawa yako
  alternative: ulinzi wako
  rationale: Taswira ya asili imehifadhiwa kama lugha ya kishairi ya ulinzi; haikusudiwi kutoa maelezo ya kimwili kuhusu Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa kumwita Mungu umewekwa mwanzoni kwa ufasaha wa Kiswahili; taswira ya uvuli na mabawa imehifadhiwa.
