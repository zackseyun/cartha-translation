base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/008.yaml
  text: They are filled from the richness of your house[b][a], and you give them drink from the river of your delights.
translation:
  language: sw
  text: Wanatosheka kwa wingi wa mema ya nyumba yako[a], nawe unawanywesha kutoka katika mto wa raha zako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wanakunywa na kushiba kwa wingi wa nyumba yako.”
    reason: lexical_alternative
  - marker: b
    text: “Raha zako” pia inaweza kutafsiriwa “furaha zako”; huenda neno la Kiebrania likawa na mwangwi wa Edeni.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְוְיֻן
  choice: Wanashiba
  rationale: Kitenzi רוה katika Qal kinaonyesha kutosheka kabisa au kushibishwa kwa wingi. “Wanashiba” ni Kiswahili cha kawaida kinachohifadhi hali ya kutosheka, huku taswira ya kunywa ikibaki kama uwezekano katika tanbihi.
- source_word: מִדֶּשֶׁן
  choice: kwa wingi wa mema
  rationale: דֶּשֶׁן kihalisi huhusiana na unono, lakini hapa ni sitiari ya wingi, ustawi na vitu bora. “Wingi wa mema” huwasilisha maana hiyo kwa Kiswahili cha sasa bila kuleta dhana isiyokusudiwa ya unene wa mwili.
- source_word: בֵּיתֶךָ
  choice: ya nyumba yako
  rationale: “Nyumba yako” huhifadhi picha pana ya makao ya Mungu bila kuibana kuwa hekalu, watu wa nyumbani, au makao ya mbinguni.
- source_word: וְנַחַל
  choice: kutoka katika mto
  rationale: נַחַל inaweza kumaanisha kijito, bonde lenye maji, au mto. Katika ushairi huu wa wingi wenye kutoa uhai, “mto” huwasilisha vizuri mtiririko mwingi.
- source_word: עֲדָנֶיךָ
  choice: furaha zako
  rationale: Neno hili hueleza raha, furaha au anasa. “Furaha zako” ni ya kawaida na yenye hadhi, na inadumisha wingi uliomo katika umbo la Kiebrania. Mwangwi unaowezekana wa Edeni umewekwa katika tanbihi badala ya kuingizwa moja kwa moja katika mstari.
- source_word: תַשְׁקֵם
  choice: unawanywesha
  rationale: Hiphil ya שקה ina maana ya kusababisha mtu anywe au kumpa kinywaji. “Unawanywesha” huhifadhi tendo na wakala wa Mungu kwa ufupi na kwa Kiswahili asilia.
theological_decisions:
- issue: Taswira ya “nyumba” ya Mungu
  choice: Kudumisha “nyumba yako” bila kuifafanua zaidi
  alternative: hekalu lako; makao yako; watu wa nyumba yako
  rationale: Kiebrania hakilazimishi maana moja ya kitaasisi, ya mbinguni, au ya nyumbani. Kutaja “nyumba” huacha wazi upeo wa kishairi na kitheolojia wa ukaribu na Mungu pamoja na riziki itokayo kwake.
- issue: Mwangwi unaowezekana wa Edeni katika עֲדָנֶיךָ
  choice: Kutafsiri “furaha zako” na kueleza mwangwi huo katika tanbihi
  alternative: raha zako; furaha zako za Edeni
  rationale: Uhusiano wa kileksia na Edeni unawezekana, lakini hauko wazi kiasi cha kuhalalisha kuingiza jina “Edeni” katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mstari unadumisha usambamba wa kishairi kati ya kushiba na kunyweshwa, huku ukiepuka “unono” ambayo katika matumizi ya kawaida inaweza kueleweka kama hali ya mwili badala ya wingi wa neema.
