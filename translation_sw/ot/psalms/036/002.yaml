  text: כִּֽי הֶחֱלִ֣יק אֵלָ֣י/ו בְּ/עֵינָ֑י/ו לִ/מְצֹ֖א עֲוֺנ֣/וֹ לִ/שְׂנֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/002.yaml
  text: For he flatters himself in his own eyes too much to find his iniquity and hate it[a].
translation:
  language: sw
  text: Kwa maana hujipumbaza sana machoni pake mwenyewe, ili asitambue uovu wake na kuuchukia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata maneno ya Kiebrania kwa karibu zaidi, “Kwa maana hujilainishia machoni pake, ili kuupata uovu wake na kuuchukia.” Kiebrania hapa ni kigumu; huenda maana yake ni kwamba kujipumbaza mwenyewe humzuia mtu kutambua na kuuchukia uovu wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza sababu au maelezo ya kauli iliyotangulia na kudumisha mtiririko wa hoja katika zaburi.
- source_word: הֶחֱלִיק אֵלָיו
  choice: anajisifu
  rationale: Kitenzi חלק katika Hiphil kimsingi ni ‘kulainisha,’ na kwa matumizi ya kimajazi ni kusema maneno laini au kujipendekeza. Hapa tendo linaelekezwa kwa mhusika mwenyewe; ‘anajisifu’ linaeleza kwa Kiswahili cha kawaida hali ya kujipumbaza kwa kujiona vizuri kupita kiasi.
- source_word: בְּעֵינָיו
  choice: machoni pake mwenyewe
  rationale: Inahifadhi nahau ya Kiebrania inayohusu jinsi mtu anavyojiona au kujitathmini.
- source_word: לִמְצֹא
  choice: kugundua
  rationale: Katika muktadha wa kosa la kimaadili, ‘kugundua’ linaonyesha kulitambua jambo lililofichwa kwa mhusika kwa sababu ya kujidanganya kwake.
- source_word: עֲוֺנוֹ
  choice: uovu wake
  rationale: עָוֹן linaweza kumaanisha uovu, kosa au hatia. ‘Uovu wake’ lina uzito wa kimaadili na ni la kawaida kwa wasomaji wa Kiswahili.
- source_word: לִשְׂנֹא
  choice: na kuuchukia
  rationale: Kiambishi ‘-u-’ kinaonyesha wazi kwamba kitu kinachochukiwa ni uovu uliotajwa, bila kuongeza wazo jipya.
- source_word: לִמְצֹא עֲוֺנוֹ לִשְׂנֹא
  choice: hata hawezi kugundua uovu wake na kuuchukia
  rationale: 'Muundo wa Kiebrania ni mgumu. Tafsiri hii inawasilisha kwa Kiswahili sanifu maana inayowezekana zaidi: kujisifu mwenyewe kunamzuia mtu kutambua na kuukataa uovu wake.'
theological_decisions:
- issue: Maana ya kimaadili na kisaikolojia ya mstari
  choice: Mtu mwovu hujisifu au hujidanganya kiasi cha kutoweza kutambua na kuchukia uovu wake.
  alternative: Anajilainishia mambo machoni pake ili kupata uovu wake, kuuchukia.
  rationale: Sintaksia ya Kiebrania imebanwa na inaweza kueleweka kwa njia zaidi ya moja. Maandishi makuu yanatoa maana inayopatana vizuri na muktadha, huku tanbihi ikihifadhi muundo wa karibu zaidi na Kiebrania na ugumu wake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Anajisifu mno machoni pake mwenyewe’ ni nahau inayoeleweka kwa urahisi, huku tanbihi ikihifadhi taswira halisi ya ‘kulainisha’ na kutokuwa na uhakika kwa sintaksia ya Kiebrania.
