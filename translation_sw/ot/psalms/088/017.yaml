  text: Wamenizunguka kama maji siku nzima; kwa pamoja wamenizingira.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סַבּוּנִי
  choice: wamenizunguka
  rationale: Kitenzi סבב katika Qal timilifu, nafsi ya tatu wingi pamoja na kiambishi cha nafsi ya kwanza umoja, kinaonyesha kuzungukwa kwa mtunga zaburi; ‘wamenizunguka’ ni Kiswahili cha kawaida na huhifadhi taswira hiyo.
- source_word: כַמַּיִם
  choice: kama maji
  rationale: Kiambishi כ kinaonyesha ulinganisho. ‘Kama maji’ ni usemi wa asili unaohifadhi taswira ya maji yanayomfunika au kumzingira mtu.
- source_word: כָּל הַיּוֹם
  choice: mchana kutwa
  rationale: Usemi huu una maana ya muda wote wa siku. ‘Mchana kutwa’ ni Kiswahili sanifu, cha kawaida, na huhifadhi mkazo wa jambo linaloendelea.
- source_word: הִקִּיפוּ
  choice: wamenizingira
  rationale: Kitenzi hiki kinafanana kimaana na סַבּוּנִי na kuendeleza picha ya kufungiwa pande zote. ‘Wamenizingira’ huhifadhi urudiaji wa kisanaa bila kuwa mgumu katika Kiswahili.
- source_word: עָלַי
  choice: -ni- katika ‘wamenizingira’
  rationale: Katika muktadha huu עָלַי huonyesha tendo linalomlenga au kumbana msemaji. Kiswahili huwasilisha maana hiyo kwa kawaida kupitia kiambishi cha yambwa ‘-ni-’ badala ya kihusishi tofauti.
- source_word: יָחַד
  choice: kwa pamoja
  rationale: Kielezi hiki kinaonyesha hatua ya pamoja. ‘Kwa pamoja’ huweka wazi kwamba nguvu hizo zote zinatenda kwa umoja.
