base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/006.yaml
  text: You have put me in the lowest pit[a], in dark places, in the depths.
translation:
  language: sw
  text: Umeniweka katika shimo la chini kabisa[a], katika sehemu zenye giza, katika vilindi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika shimo, katika sehemu za chini kabisa.”
    reason: Neno תַּחְתִּיּוֹת linaweza kueleweka kama kivumishi kinachoeleza shimo la chini kabisa, au kama nomino inayorejelea sehemu za chini kabisa.
lexical_decisions:
- source_word: שַׁתַּנִי
  choice: Umeniweka
  rationale: Kitenzi kina nafsi ya pili umoja kama mtenda na nafsi ya kwanza umoja kama mtendwa. “Umeniweka” ni Kiswahili cha kawaida na kinadumisha kauli ya moja kwa moja kwamba Mungu ndiye aliyemweka mwombolezaji katika hali hiyo.
- source_word: בְּבוֹר
  choice: katika shimo
  rationale: בּוֹר inaweza kumaanisha shimo, kisima, au mahali kama gereza. “Shimo” linahifadhi taswira ya kishairi ya kuwa karibu na kifo bila kuifasiri moja kwa moja kuwa kaburi.
- source_word: תַּחְתִּיּוֹת
  choice: la chini kabisa
  rationale: Neno hili linaashiria sehemu za chini sana au za chini kabisa. Kulihusisha na “shimo” kunatoa Kiswahili cha asili huku kukihifadhi kipimo cha kina kilichopitiliza.
- source_word: בְּמַחֲשַׁכִּים
  choice: katika sehemu zenye giza
  rationale: Umbo la Kiebrania ni la wingi na huonyesha maeneo yenye giza. “Sehemu zenye giza” linadumisha wingi huo na ulinganifu wa kishairi.
- source_word: בִּמְצֹלוֹת
  choice: katika vilindi
  rationale: Neno hili hurejelea vilindi, mara nyingi vilindi vya maji au sehemu zenye kina kirefu. “Vilindi” ni neno la asili na la kishairi linalohifadhi taswira ya kina cha kutisha.
theological_decisions:
- issue: Utendaji wa Mungu katika ombolezo
  choice: Kauli ya moja kwa moja “Umeniweka” imedumishwa.
  alternative: Kutumia kauli isiyoonyesha wazi mtendaji ili kupunguza wazo kwamba Mungu ndiye aliyesababisha hali hiyo.
  rationale: Kiebrania kinamwelekea Mungu moja kwa moja kama aliyemweka mtunga zaburi katika hali hii. Tafsiri inadumisha mvutano huo wa kitheolojia wa ombolezo badala ya kuupunguza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na urahisi wa kueleweka. Marudio ya “katika” yamehifadhiwa kwa ajili ya mpangilio na uzito wa kishairi wa mistari sambamba.
