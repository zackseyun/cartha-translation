source:
  edition: WLC
  text: וַ/אֲנִ֤י אֵלֶ֣י/ךָ יְהוָ֣ה שִׁוַּ֑עְתִּי וּ֝/בַ/בֹּ֗קֶר תְּֽפִלָּתִ֥/י תְקַדְּמֶֽ/ךָּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/013.yaml
  text: But as for me[a], O Yahweh, I cry out to you; in the morning my prayer comes before you.
translation:
  language: sw
  text: Lakini mimi, Ee Yahwe, nakulilia; asubuhi sala yangu hufika mbele zako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sala yangu hukujia” au “sala yangu hukutangulia.” Kitenzi cha Kiebrania kinaweza kumaanisha kufika mbele, kukutana na, au kutangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Lakini mimi
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha utofautishaji na msisitizo wa msemaji; “Lakini mimi” ni Kiswahili cha kawaida kinachohifadhi nguvu hiyo.
- source_word: אֵלֶיךָ
  choice: nakulilia
  rationale: Maana ya kuelekeza kilio kwa Yahwe imeunganishwa kiasili katika kitenzi cha Kiswahili “nakulilia,” yaani kumlilia mtu ili kupata msaada.
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi “Yahwe”; “Ee” linaonyesha mwito wa moja kwa moja katika sala.
- source_word: שִׁוַּעְתִּי
  choice: nakulilia
  rationale: Kitenzi kinaashiria kilio cha kuomba msaada. Wakati wa sasa unawasilisha ombi linaloendelea katika muktadha wa sala ya kishairi bila kuongeza maelezo yasiyokuwamo.
- source_word: וּבַבֹּקֶר
  choice: asubuhi
  rationale: Hili ni tamko la kawaida na wazi la wakati; muunganisho wa kishairi unahifadhiwa kwa nuktamkato bila kulazimisha “na.”
- source_word: תְּפִלָּתִי
  choice: sala yangu
  rationale: Nomino ya umoja na kiambishi cha nafsi ya kwanza zimehifadhiwa moja kwa moja kwa Kiswahili sanifu.
- source_word: תְקַדְּמֶךָּ
  choice: hufika mbele zako
  rationale: Kauli hii inahifadhi taswira ya sala kufika mbele ya Yahwe, huku ikibaki ya kawaida na yenye hadhi katika Kiswahili. Uwezekano wa maana za kukutana au kutangulia umewekwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandiko ya Kiebrania yanatumia jina binafsi la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Taswira ya sala katika תְקַדְּמֶךָּ
  choice: sala yangu hufika mbele zako
  alternative: sala yangu hukujia; sala yangu hukutangulia
  rationale: Kitenzi kinaweza kuonyesha kufika mbele, kukutana, au kutangulia. Tafsiri kuu inadumisha taswira ya sala kuingia mbele za Mungu bila kuamua kwa lazima kwamba sala inamtangulia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kishairi; “Ee Yahwe” ni mwito wa moja kwa moja, na “nakulilia” ni usemi unaoeleweka wa kuomba msaada kwa kilio.
