base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/012.yaml
  text: Is your wonder made known in the darkness[b][a], or your righteousness in the land of forgetfulness?
translation:
  language: sw
  text: Je, ajabu yako itajulikana gizani, au haki yako itajulikana katika nchi ya usahaulifu?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uadilifu wako.”
    reason: lexical_alternative
  - marker: b
    text: “Nchi ya usahaulifu” ni usemi wa kishairi unaomaanisha makao ya wafu.
    reason: cultural_note
lexical_decisions:
- source_word: הֲ/יִוָּדַע
  choice: Je, ... itajulikana
  rationale: Nifali ya wakati usiotimilika katika swali la balagha; ‘itajulikana’ huhifadhi maana ya kutendwa na mwelekeo wa swali bila kulazimisha wakati kupita kiasi.
- source_word: בַּ/חֹשֶׁךְ
  choice: gizani
  rationale: Ni Kiswahili cha asili kwa ‘katika giza’; katika muktadha huu giza linadokeza makao ya wafu.
- source_word: פִּלְאֶךָ
  choice: ajabu yako
  rationale: Nomino iko katika umoja na inaweza kumaanisha kwa ujumla tendo au uwezo wa Mungu wa kutenda mambo ya ajabu.
- source_word: וְצִדְקָתְךָ
  choice: au haki yako
  rationale: ‘Au’ huonyesha vizuri ulinganifu wa maswali mawili ya balagha; ‘haki’ huhifadhi upana wa maana ya צדקה, ingawa ‘uadilifu’ pia inawezekana.
- source_word: בְּאֶרֶץ
  choice: katika nchi
  rationale: Huhifadhi taswira ya kishairi ya ‘nchi ya ...’, ambayo hapa inawakilisha makao ya wafu.
- source_word: נְשִׁיָּה
  choice: kusahaulika
  rationale: Huwasilisha hali ya kuwa katika usahaulifu kwa lugha ya kawaida na inayoeleweka, bila kutumia neno zito zaidi kama ‘uangamivu’.
theological_decisions:
- issue: Maana ya צדקה katika muktadha wa kishairi kuhusu tabia na matendo ya Mungu
  choice: haki
  alternative: uadilifu
  rationale: צדקה inaweza kueleza kuwa sawa, mwenye haki, au kutenda kwa uadilifu. ‘Haki’ ni pana na ya kawaida katika Kiswahili cha Biblia; ‘uadilifu’ imehifadhiwa kama maana mbadala.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa swali la balagha na ulinganifu wa mistari umehifadhiwa; taswira za ‘giza’ na ‘nchi ya kusahaulika’ hazijafafanuliwa ndani ya mstari wenyewe.
