source:
  edition: WLC
  text: כִּֽי שָֽׂבְעָ֣ה בְ/רָע֣וֹת נַפְשִׁ֑/י וְ/חַיַּ֗/י לִ/שְׁא֥וֹל הִגִּֽיעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/003.yaml
  text: For my soul is full of troubles[a], and my life draws near to Sheol.
translation:
  language: sw
  text: 'Kwa maana nafsi yangu imejaa taabu,

    na maisha yangu yamekaribia Sheoli.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kaburi” au “makao ya wafu.” Neno la Kiebrania ni “Sheoli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatanguliza sababu ya hali ya mtunga zaburi na kuhifadhi nguvu ya kisababishi kwa Kiswahili cha kawaida.
- source_word: שָׂבְעָה
  choice: imejaa
  rationale: Kitenzi kina maana ya kushiba au kujaa; pamoja na taabu, “imejaa” ni usemi wa asili unaohifadhi taswira ya kulemewa.
- source_word: בְרָעוֹת
  choice: taabu
  rationale: Katika muktadha huu רָעוֹת ni mabaya yanayompata mtunga zaburi—taabu au misiba—wala si uovu wa kimaadili alioutenda.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: “Nafsi” huhifadhi tofauti ya kishairi kati ya נֶפֶשׁ na חַיִּים katika mshororo unaofuata, bila kuifanya yote miwili kuwa “maisha yangu.”
- source_word: וְחַיַּי
  choice: na maisha yangu
  rationale: Ingawa חַיִּים ina umbo la wingi, kwa kawaida humaanisha maisha; Kiswahili hutumia “maisha” kwa maana hiyo.
- source_word: לִשְׁאוֹל
  choice: Sheoli
  rationale: Jina la Kiebrania linahifadhi dhana ya ulimwengu wa wafu bila kuibana kuwa kaburi moja au kuingiza maana ya baadaye ya kimafundisho.
- source_word: הִגִּיעוּ
  choice: yamekaribia
  rationale: Kitenzi kwa msingi humaanisha kufikia; katika maombolezo haya, “yamekaribia Sheoli” huonyesha kwamba kifo kiko karibu huku kikisomeka kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya שְׁאוֹל
  choice: Sheoli
  alternative: kaburi; makao ya wafu
  rationale: Kutumia “Sheoli” kunadumisha neno na taswira ya maandishi ya Kiebrania, bila kulilinganisha moja kwa moja na kaburi la mtu mmoja au dhana finyu ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa mistari miwili unahifadhi usambamba wa kishairi; “nafsi yangu” na “maisha yangu” zinadumisha tofauti ya msamiati wa Kiebrania.
