  yaml_path: translation/ot/psalms/088/000.yaml
  text: 'A song. A psalm of the sons of Korah. For the choirmaster: according to Mahalath Leannoth[a]. A Maskil[b] of Heman the Ezrahite.'
translation:
  language: sw
  text: 'Wimbo. Zaburi ya wana wa Kora. Kwa mwongoza wa waimbaji: kwa kufuata Mahalath Leannoth[a]. Maskili[b] ya Hemani, Mwezrahi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maana ya usemi “Mahalath Leannoth” haina hakika. Huenda ukarejelea melodi au mtindo wa muziki; mapendekezo mengine ni “kwa kufuata Mahalath, kwa uimbaji wa kuitikizana” au “kwa kufuata Mahalath, kuhusu mateso.”
    reason: lexical_alternative
  - marker: b
    text: “Maskili” ni istilahi ya kiufundi katika vichwa vya zaburi, ambayo mara nyingi hueleweka kuwa utungo wa kufundisha au wa kutafakari.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Wimbo
  rationale: Ni jina la aina ya utungo katika kichwa cha zaburi; “Wimbo” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Ni neno la kawaida kwa utungo wa kuimbwa kwa kuandamana na muziki; “Zaburi” limezoeleka na linafaa katika kichwa.
- source_word: לִבְנֵי קֹרַח
  choice: ya wana wa Kora
  rationale: Kiambishi ל־ kinaweza kuonyesha uandishi, uhusiano, au kuwekwa wakfu. “Ya” ni fupi na haibani maana kuwa uandishi pekee.
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza wa waimbaji
  rationale: Huelekeza kwa mwenye kusimamia utekelezaji wa muziki. Kauli hii ni ya kawaida na inaeleweka kwa wasomaji wa leo.
- source_word: עַל
  choice: kwa kufuata
  rationale: Katika vichwa vya zaburi neno hili huenda likatanguliza mtindo, melodi, au maelekezo ya uimbaji; “kwa kufuata” huhifadhi kazi hiyo bila kuamua jambo lisilo na hakika.
- source_word: מָחֲלַת לְעַנּוֹת
  choice: Mahalath Leanoth
  rationale: Maana kamili ya usemi huu wa kitaalamu haina hakika. Unukuu wa sauti unakwepa kulazimisha tafsiri mojawapo; maelezo na uwezekano mwingine vimetolewa katika tanbihi.
- source_word: מַשְׂכִּיל
  choice: Maskili
  rationale: Ni istilahi ya kiufundi katika vichwa vya zaburi yenye maana isiyo hakika kabisa; imeandikwa kwa sauti na kufafanuliwa katika tanbihi.
- source_word: לְהֵימָן
  choice: ya Hemani
  rationale: Kiambishi ל־ kinaweza kuonyesha uandishi au uhusiano. “Ya Hemani” hudumisha upana huo kwa Kiswahili cha kawaida.
- source_word: הָאֶזְרָחִי
  choice: Mwezrahi
  rationale: Ni jina la utambulisho la Hemani. “Mwezrahi” hufuata kwa karibu umbo la Kiebrania bila kulazimisha uhusiano unaowezekana na Zera.
