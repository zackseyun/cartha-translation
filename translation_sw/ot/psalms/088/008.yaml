base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/008.yaml
  text: You have driven my companions far from me[a]; you have made me abhorrent to them[c][b]. I am confined and cannot go out.
translation:
  language: sw
  text: Umewaweka mbali nami watu ninaowajua[a]; umenifanya kuwa chukizo kwao[b]. Nimefungiwa[c], wala siwezi kutoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu ninaojuana nao,” au “wenzangu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “umenifanya kuwa kitu cha kuchukiza kwao.”
    reason: lexical_alternative
  - marker: c
    text: Au, “Nimezuiliwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְחַקְתָּ
  choice: Umewaweka mbali
  rationale: Hifili ya רחק inaonyesha kusababisha watu wawe mbali; ‘kuwaweka mbali’ ni Kiswahili cha kawaida kinachohifadhi usababishaji huo bila kuongeza wazo lisilo wazi la kuwafukuza.
- source_word: מְיֻדָּעַי
  choice: watu ninaojuana nao
  rationale: Nomino hii inayotokana na ידע inawahusu watu wanaojulikana na msemaji. Kauli hii ni ya asili kwa Kiswahili na haiongezi kiwango cha ukaribu kinachoweza kudokezwa na ‘rafiki zangu.’
- source_word: מִמֶּנִּי
  choice: nami
  rationale: Huwasilisha kwa ufupi maana ya kutengwa ‘na mimi’ baada ya ‘mbali.’
- source_word: שַׁתַּנִי
  choice: umenifanya kuwa
  rationale: Katika muundo huu, kitenzi שׂים kina maana ya kumweka au kumfanya mtu awe katika hali fulani.
- source_word: תוֹעֵבוֹת
  choice: chukizo
  rationale: Ingawa umbo la Kiebrania ni la wingi, hapa linatumika kiarifu kueleza kwamba mtunga zaburi amekuwa kitu cha kuchukiza sana machoni pa wenzake. ‘Chukizo’ huhifadhi uzito wa lugha hiyo.
- source_word: לָמוֹ
  choice: kwao
  rationale: Kiwakilishi hiki kinawarejelea watu waliotajwa awali; ‘kwao’ kinafaa katika muundo ‘kuwa chukizo kwao.’
- source_word: כָּלֻא
  choice: Nimefungiwa
  rationale: Hali tendwa ya כלא inaonyesha kuzuiliwa au kufungiwa. ‘Nimefungiwa’ huhifadhi taswira hiyo bila kudai kwamba lazima ni kifungo rasmi gerezani.
- source_word: וְלֹא אֵצֵא
  choice: wala siwezi kutoka
  rationale: Kisababu ni ‘wala sitoki,’ lakini baada ya ‘nimefungiwa’ muktadha unaonyesha kutoweza kutoka, si uamuzi wa kutotoka.
