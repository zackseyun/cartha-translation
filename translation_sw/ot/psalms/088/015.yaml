  text: עָ֘נִ֤י אֲנִ֣י וְ/גֹוֵ֣עַ מִ/נֹּ֑עַר נָשָׂ֖אתִי אֵמֶ֣י/ךָ אָפֽוּנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/015.yaml
  text: I am afflicted and near death from my youth[a]; I bear your terrors; I am overwhelmed.
translation:
  language: sw
  text: Nimekuwa nikiteseka na kukaribia kufa tangu ujana wangu; ninazibeba hofu zako; nimelemewa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nimezibeba hofu zako; nimefadhaika/nimechanganyikiwa.” Kitenzi cha mwisho ni kigumu kueleweka na huenda kikaonyesha kulemewa, kufadhaika, kuchanganyikiwa, au kuangamia.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנִי
  choice: nikiteseka
  rationale: Katika muktadha wa maombolezo, neno hili linaeleza hali ya kuteswa na kuwa taabani, si hasa umaskini wa mali.
- source_word: וְגֹוֵעַ
  choice: na kukaribia kufa
  rationale: Kitenzi hiki kinaonyesha hali inayoendelea ya kufa au kuwa karibu na kifo; usemi huu ni wa kawaida katika Kiswahili na hauzidishi dhana ya kifo cha papo hapo.
- source_word: מִנֹּעַר
  choice: tangu ujana wangu
  rationale: Kihusishi kinaonyesha muda ulioanzia ujana na kuendelea hadi sasa; kiwakilishi cha nafsi kimeongezwa kwa ufasaha wa Kiswahili.
- source_word: נָשָׂאתִי
  choice: ninazibeba
  rationale: Maana ya msingi ni kuinua au kubeba, na hapa inaeleza kuvumilia hofu zinazomhusu Mungu. Wakati wa sasa unaendana na taabu inayoendelea, ingawa 'nimezibeba' pia inawezekana.
- source_word: אֵמֶיךָ
  choice: hofu zako
  rationale: Wingi huu unamaanisha mambo ya kutisha au matisho yanayohusishwa moja kwa moja na Mungu. 'Hofu zako' huhifadhi uzito na mkazo wa nafsi ya pili.
- source_word: אָפוּנָה
  choice: nimelemewa
  rationale: Umbo hili gumu huenda likaonyesha kulemewa, kufadhaika, kuchanganyikiwa, au kuangamia. 'Nimelemewa' huwasilisha nguvu ya kihisia bila kuifungia maana katika fasiri moja finyu.
theological_decisions:
- issue: Rejeo la 'hofu zako'
  choice: Maneno yanaelekezwa kwa Mungu na yanahusisha hofu hizo na matendo yake kwa mwombolezaji, bila kupunguza uwakala wa Mungu.
  alternative: Hofu hizo ni hisia tu zinazotokea mbele za Mungu, wala si zinazotoka kwake.
  rationale: Kiambishi cha nafsi ya pili kinaonyesha kwa kawaida hofu zilizo zake Mungu au zinazotoka kwake. Tafsiri inadumisha mvutano wa kitheolojia wa ombolezo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. 'Nimekuwa nikiteseka' huonyesha hali iliyoanzia ujana na kuendelea; sentensi huhifadhi mfululizo mkali wa ombolezo na kutaja kwa Mungu moja kwa moja.
