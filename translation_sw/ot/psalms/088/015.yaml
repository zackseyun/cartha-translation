  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: hali ya taabu na kukaribia kufa tangu ujana, kubeba hofu za Mungu, na hitimisho lenye maana isiyo hakika ya kulemewa/kufadhaika. Wakati wa sasa katika “ninazibeba” unakubalika kishairi kwa נָשָׂאתִי katika muktadha huu, bila kufuta uwezekano wa perfecti unaotajwa katika tanbihi.'
  naturalness: Kiswahili ni sanifu, cha sasa, na chenye mtiririko wa maombolezo unaofaa zaburi. “Nimekuwa nikiteseka ... tangu ujana wangu” hueleweka vizuri kama hali iliyoanza ujana na kuendelea; “nimelemewa” ni chaguo la kawaida na lenye nguvu kwa hitimisho.
