id: PSA.88.5
reference: Psalms 88:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בַּ/מֵּתִ֗ים חָ֫פְשִׁ֥י כְּמ֤וֹ חֲלָלִ֨ים שֹׁ֥כְבֵי קֶ֗בֶר אֲשֶׁ֤ר לֹ֣א זְכַרְתָּ֣/ם ע֑וֹד וְ֝/הֵ֗מָּה מִ/יָּדְ/ךָ֥ נִגְזָֽרוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/005.yaml
  text: I am set free among the dead[a], like the slain who lie in the grave, whom you remember no more[c][b], and they are cut off from your hand.
translation:
  language: sw
  text: Nimeachiliwa miongoni mwa wafu[a], kama waliouawa wanaolala kaburini, ambao huwakumbuki tena[b]; nao wamekatiliwa mbali na mkono wako[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “niko huru miongoni mwa wafu.” Kiebrania hutumia lugha ya kuwa huru au kuachiliwa, yaelekea kwa kejeli: mtunga zaburi ni kama aliyekwisha kufa na kuondolewa katika jamii ya walio hai.'
    reason: lexical_alternative
  - marker: b
    text: Hapa “kukumbuka” huenda kunamaanisha zaidi ya kuwa na mtu akilini; kunaweza kujumuisha kumwangalia na kumtendea jambo.
    reason: lexical_alternative
  - marker: c
    text: “Mkono” ni taswira ya Kiebrania inayoweza kumaanisha nguvu, mamlaka, udhibiti au utunzaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמֵּתִים
  choice: miongoni mwa wafu
  rationale: 'Kiambishi ב pamoja na wingi ‘wafu’ kinaonyesha mahali au kundi: mtunga zaburi anajihesabu kuwa katika jamii ya wafu.'
- source_word: חָפְשִׁי
  choice: nimeachiliwa
  rationale: 'Neno lina maana ya kuwa huru au kuachiliwa. Hapa limetumiwa kwa kejeli yenye uchungu: si ukombozi wa furaha, bali kuondolewa katika ulimwengu wa walio hai kana kwamba tayari amekufa.'
- source_word: חֲלָלִים
  choice: waliouawa
  rationale: Katika ushairi wa Kiebrania neno hili kwa kawaida humaanisha watu waliouawa, mara nyingi kwa nguvu; ‘waliouawa’ ni wazi na ya kawaida katika Kiswahili.
- source_word: שֹׁכְבֵי קֶבֶר
  choice: wanaolala kaburini
  rationale: Kirai cha hali endelevu kinaonyesha waliouawa wakiwa wamelala kaburini; tafsiri hii pia huhifadhi taswira ya kishairi.
- source_word: אֲשֶׁר לֹא זְכַרְתָּם עוֹד
  choice: ambao huwakumbuki tena
  rationale: Inahifadhi kitenzi ‘kukumbuka’ na עוֹד ‘tena’; katika ombolezo kukumbuka kunadokeza pia kumwangalia mtu na kumtendea jambo.
- source_word: וְהֵמָּה
  choice: nao
  rationale: Huhifadhi kiunganishi cha Kiebrania bila kulazimisha maana ya kisababishi isiyosemwa wazi.
- source_word: מִיָּדְךָ נִגְזָרוּ
  choice: wamekatiliwa mbali na mkono wako
  rationale: ‘Kukatiliwa mbali’ huhifadhi ukali wa taswira ya גזר, na ‘mkono wako’ huhifadhi sitiari ya Kiebrania inayoweza kumaanisha mamlaka, nguvu au utunzaji.
theological_decisions:
- issue: Maana ya Mungu ‘kukumbuka’ wafu
  choice: Kitenzi ‘kuwakumbuka’ kimehifadhiwa katika matini kuu.
  alternative: kuwajali; kuwaangalia na kuwatendea
  rationale: Kauli hii ni ya uzoefu wa mwenye kuomboleza, wala haipaswi kufafanuliwa kana kwamba inakanusha maarifa ya Mungu. ‘Kukumbuka’ huhifadhi maana ya uhusiano na utendaji pamoja na mvutano wa kitheolojia.
- issue: Nguvu ya kuwa ‘huru’ au ‘kuachiliwa’ miongoni mwa wafu
  choice: Nimetumia ‘nimeachiliwa’ na kueleza kejeli yake katika tanbihi.
  alternative: niko huru; nimeachwa; nimetengwa
  rationale: Kiebrania kinatumia taswira ya uhuru au kuachiliwa kwa namna ya kejeli. Kuibadilisha kuwa ‘nimeachwa’ kungeondoa fumbo la kishairi na kuingiza ufafanuzi ambao matini haisemi moja kwa moja.
- issue: Kukatiliwa mbali na mkono wa Mungu
  choice: Sitiari ‘mkono wako’ imehifadhiwa.
  alternative: wameondolewa katika nguvu zako; wako nje ya utunzaji wako
  rationale: ‘Mkono’ unaweza kuonyesha nguvu, mamlaka, udhibiti au utunzaji. Kuchagua maana moja pekee katika matini kuu kungepunguza upana na mvutano wa sitiari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Miongoni mwa,’ ‘kaburini,’ na ‘mkono wako’ huhifadhi taswira za Kiebrania; tanbihi zinafafanua sehemu ambazo tafsiri ya moja kwa moja inaweza kueleweka vibaya.
