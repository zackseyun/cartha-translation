    reason: previous_rendering
lexical_decisions:
- source_word: הִרְחַקְתָּ
  choice: Umewaweka mbali
  rationale: Kitenzi cha Hiphil, nafsi ya pili umoja, kinaonyesha kwamba Mungu anayezungumziwa ndiye aliyesababisha watengane na mtunga zaburi. ‘Umewaweka mbali’ huhifadhi nguvu hiyo ya kisababishi.
- source_word: מִמֶּנִּי
  choice: nami
  rationale: Kihusishi מן pamoja na kiambishi cha nafsi ya kwanza huonyesha kutengwa na msemaji. ‘Mbali nami’ ni Kiswahili cha kawaida na chenye maana hiyo.
- source_word: אֹהֵב
  choice: anayenipenda
  rationale: Neno hili ni umbo la kitenzi linalotumiwa kama nomino na humaanisha mtu anayempenda msemaji. ‘Anayenipenda’ huepuka maana ya kimapenzi ambayo ‘mpenzi’ inaweza kudokeza katika Kiswahili cha sasa.
- source_word: וָרֵעַ
  choice: na rafiki yangu
  rationale: רֵעַ hapa humaanisha rafiki au mwenzi. Ingawa kiambishi cha umilikaji hakijaandikwa moja kwa moja katika Kiebrania, ‘yangu’ hutokana wazi na uhusiano unaoelezwa na hufanya Kiswahili kiwe cha kawaida.
- source_word: מְיֻדָּעַי
  choice: watu ninaowajua
  rationale: Neno hili linaashiria wale wanaojulikana na msemaji, yaani watu anaowajua. Kauli hii ni ya sasa na ya asili zaidi kuliko nomino ya kiofisi ‘watu ninaofahamiana nao,’ bila kuwafanya lazima wawe marafiki wa karibu.
- source_word: מַחְשָׁךְ
  choice: ni giza
  rationale: Nomino ‘giza’ inasimama mwishoni mwa kishazi kifupi kisicho na kitenzi. ‘Ni giza’ huhifadhi picha kali ya Kiebrania na mpangilio unaowafanya watu anaowajua kuwa kiarifu chake, bila kuficha uwezekano wa miundo mingine.
theological_decisions:
- issue: Uhusiano wa kisintaksia katika maneno ya mwisho מְיֻדָּעַי מַחְשָׁךְ
  choice: watu ninaowajua ni giza
  alternative: watu ninaowajua wako gizani; au giza ndilo rafiki langu pekee
  rationale: Kiebrania kina kishazi kifupi sana kisicho na kitenzi, na mpangilio wake wa kawaida unaweza kusomwa kama kiima kisha kiarifu. Tafsiri kuu hudumisha mpangilio na fumbo hilo; tanbihi zinaonyesha usomaji mwingine badala ya kuamua kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Anayenipenda’ limetumiwa badala ya ‘mpenzi’ ili kutodokeza bila lazima uhusiano wa kimapenzi. Muundo wa mwisho umeachwa mkali na wa kishairi kama Kiebrania, huku utata wake ukielezwa katika tanbihi.
