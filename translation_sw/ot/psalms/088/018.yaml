  text: You have put far from me lover and friend[b][a]; my acquaintances are darkness.
translation:
  language: sw
  text: Umewaweka mbali nami anayenipenda na rafiki yangu; watu ninaowajua ni giza.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu ninaowajua wako gizani,” au, “giza ndilo rafiki yangu pekee.” Mwisho wa Kiebrania ni mfupi sana na unaweza kueleweka kwa njia zaidi ya moja.
