base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/001.yaml
  text: O Yahweh[a], God of my salvation, by day I cry out; at night I am before you.
translation:
  language: sw
  text: 'Ee Yahwe, Mungu wa wokovu wangu,


    mchana na usiku ninakulilia mbele zako.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la Mungu limetafsiriwa moja kwa moja kuwa “Yahwe”; “Ee” linaonyesha kwamba mtunga zaburi anamwita Mungu moja kwa moja katika sala.
- source_word: אֱלֹהֵי יְשׁוּעָתִי
  choice: Mungu wa wokovu wangu
  rationale: Muundo wa Kiebrania unaunganisha “Mungu wa” na “wokovu wangu.” “Wokovu” huhifadhi upana wa maana unaoweza kujumuisha kuokolewa, kukombolewa, au kunusuriwa.
- source_word: יוֹם
  choice: mchana
  rationale: Katika ulinganifu wake na “usiku,” neno hili linafanya kazi kama kielezi cha wakati.
- source_word: צָעַקְתִּי
  choice: ninapaza kilio
  rationale: Kitenzi kinaonyesha kilio cha dharura au mwito mkubwa. Wakati uliopo unaendana na maombolezo yanayoendelea katika muktadha, bila kudhoofisha uzito wa kilio.
- source_word: בַלַּיְלָה
  choice: usiku
  rationale: Tafsiri ya kawaida na ya moja kwa moja inayodumisha ulinganifu wa mchana na usiku.
- source_word: נֶגְדֶּךָ
  choice: niko mbele zako
  rationale: Kirai hiki kwa msingi ni “mbele zako.” Kiswahili kinahitaji kiarifu ili sentensi isimame kwa kawaida, hivyo “niko” kimeongezwa kwa uwazi huku maana ya kuwapo mbele za Mungu ikihifadhiwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Maana ya אֱלֹהֵי יְשׁוּעָתִי
  choice: Mungu wa wokovu wangu
  alternative: Mungu anayeniokoa; Mungu wa ukombozi wangu
  rationale: 'Muundo wa “Mungu wa wokovu wangu” huhifadhi tamko la Kiebrania na mvutano wake wa kitheolojia: hata akiwa katika mateso makali, mwombaji anamwita Yahwe chanzo cha wokovu wake.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya sala na maombolezo lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa mistari unahifadhi ulinganifu wa “mchana” na “usiku,” na semikoloni inaonyesha uhusiano wa karibu bila kulazimisha kwamba kitenzi cha mstari wa kwanza kitawale mstari wa pili.
