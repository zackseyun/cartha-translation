  text: Your burning anger swept over me[c][b][a]; your terrors destroyed me.
translation:
  language: sw
  text: Hasira zako zenye kuwaka zilinipita juu yangu[a]; vitisho vyako viliniangamiza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zilinifagilia.” Kitenzi cha Kiebrania kwa maana ya moja kwa moja ni “zilipita,” lakini muktadha unaweza kudokeza nguvu inayomlemea mtu.
    reason: lexical_alternative
  - marker: b
    text: Au, “vilinikatilia mbali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלַי עָבְרוּ
  choice: imepita juu yangu
  rationale: Muundo huu unahifadhi kielelezo cha msingi cha Kiebrania cha kupita juu ya mtu, huku ukidokeza nguvu inayomlemea katika muktadha wa maombolezo.
- source_word: חֲרוֹנֶיךָ
  choice: hasira yako kali
  rationale: Nomino hii hueleza hasira inayowaka au kali. Kiswahili cha kawaida hutumia kwa ufasaha ‘hasira kali,’ ambacho kinahifadhi uzito wa usemi bila kuwa cha kizamani.
- source_word: בִּעוּתֶיךָ
  choice: vitisho vyako
  rationale: Neno hilo linamaanisha mambo yanayosababisha hofu kuu. ‘Vitisho’ ni la asili na linaloeleweka, huku likiruhusu maana ya matendo au hali za kutisha.
- source_word: צִמְּתוּתֻנִי
  choice: vimeniangamiza
  rationale: Kitenzi צמת kinaweza kumaanisha kuharibu, kuangamiza, au kukatilia mbali. ‘Vimeniangamiza’ kinaonyesha ukali wa lugha ya maombolezo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Umoja wa ‘hasira’ umetumika kwa wingi wa Kiebrania unaofanya kazi kama dhana nzito au ya mkazo.
