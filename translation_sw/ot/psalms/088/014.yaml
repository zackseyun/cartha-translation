lexical_decisions:
- source_word: לָמָה
  choice: Kwa nini
  rationale: Hili ni swali la moja kwa moja kuhusu sababu, na “Kwa nini” hudumisha nguvu ya kilio cha mwombolezaji kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa kulinakili kama “Yahwe,” badala ya kulibadilisha kuwa cheo.
- source_word: תִּזְנַח
  choice: unaikataa
  rationale: Kitenzi hiki kina maana ya kukataa au kutupilia mbali. “Unaikataa” ni wazi, cha sasa, na kinafaa kwa malalamiko ya moja kwa moja.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: Tafsiri hii inadumisha taswira halisi ya Kiebrania na uzito wa ndani wa kilio, huku tanbihi ikionyesha kuwa neno hilo pia linaweza kumaanisha mtu mwenyewe au uhai wake.
- source_word: תַּסְתִּיר
  choice: unanificha
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida kwamba uso wa Mungu umefichwa kutoka kwa msemaji.
- source_word: פָּנֶיךָ
  choice: uso wako
  rationale: Tafsiri halisi inadumisha nahau ya Kiebrania; maana yake ya kujiondoa kwa uwepo, kibali, au uangalifu inaelezwa katika tanbihi.
- source_word: מִמֶּנִּי
  choice: -ni- katika “unanificha”
  rationale: Kiambishi cha yambwa “-ni-” kinawasilisha kwa Kiswahili maana ya “kutoka kwangu” kwa njia ya kawaida ndani ya sentensi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Maana ya “kuuficha uso”
  choice: Kudumisha nahau katika matini kuu
  alternative: Kuondoa uwepo au kibali chako kwangu
  rationale: Nahau halisi ina nguvu ya kishairi na inaweza kueleweka kwa muktadha; tanbihi hufafanua maana yake bila kuifanya tafsiri iamue kama kinachoondolewa ni uwepo, kibali, au uangalifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na ya kishairi bila kuwa ya kizamani. Kirai cha mwito “ee Yahwe” kinadumisha sauti ya sala ya moja kwa moja.
