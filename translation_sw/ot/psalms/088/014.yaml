  text: Kwa nini, ee Yahwe, unaikataa nafsi yangu[a]? Kwa nini unaificha uso wako mbali nami[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unanikataa mimi?” Neno la Kiebrania linalotafsiriwa “nafsi yangu” linaweza pia kumaanisha “mimi” au “uhai wangu.”
