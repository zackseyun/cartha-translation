  text: נֶ֭חְשַׁבְתִּי עִם י֣וֹרְדֵי ב֑וֹר הָ֝יִ֗יתִי כְּ/גֶ֣בֶר אֵֽין אֱיָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/004.yaml
  text: I am counted among those going down to the pit[b][a]; I have become like a man without strength.
translation:
  language: sw
  text: Nimehesabiwa miongoni mwa wanaoshuka shimoni[a]; nimekuwa kama mtu asiye na nguvu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kaburini.” Neno la Kiebrania “shimo” ni taswira ya kawaida ya kishairi kuhusu kifo.
    reason: lexical_alternative
  - marker: b
    text: Au, “kama mwanamume hodari asiye na nguvu.” Neno linalotafsiriwa “mtu” linaweza kudokeza nguvu au uhodari.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶחְשַׁבְתִּי
  choice: Nimehesabiwa
  rationale: Kauli tendwa ya wakati timilifu inaonyesha kwamba mtunga zaburi amehesabiwa au ameonwa kuwa wa kundi hilo; Kiswahili cha wakati timilifu kinadumisha hali hiyo iliyofikiwa.
- source_word: עִם
  choice: miongoni mwa
  rationale: Ingawa maana ya msingi ni ‘pamoja na,’ baada ya ‘nimehesabiwa’ usemi ‘miongoni mwa’ unaeleza kwa kawaida kujumuishwa katika kundi.
- source_word: יוֹרְדֵי בוֹר
  choice: wanaoshuka shimoni
  rationale: Huhifadhi taswira ya kishairi ya watu wanaoteremka kuelekea kifo au makao ya wafu bila kuibadili moja kwa moja kuwa ‘kaburi.’
- source_word: בּוֹר
  choice: shimoni
  rationale: ‘Shimo’ ni taswira halisi ya Kiebrania na hapa hutumiwa kishairi kuhusu kifo; umbo ‘shimoni’ linaendana kwa kawaida na kitenzi ‘kushuka.’
- source_word: הָיִיתִי
  choice: nimekuwa
  rationale: Huwasilisha hali iliyofikiwa na inayoendelea, huku ikibaki karibu na wakati timilifu wa Kiebrania.
- source_word: כְּגֶבֶר
  choice: kama mtu
  rationale: גבר inaweza kumaanisha mtu wa kiume na pia kudokeza nguvu. ‘Mtu’ ni ya kawaida na huacha kinaya cha kukosa nguvu kijitokeze katika kirai kinachofuata.
- source_word: אֵין אֱיָל
  choice: asiye na nguvu
  rationale: Tafsiri wazi na ya moja kwa moja ya kukosa uwezo, nguvu, au uhai.
