  text: Is your steadfast love declared in the grave[a], your faithfulness in Abaddon?
translation:
  language: sw
  text: Je, upendo wako thabiti hutangazwa kaburini, na uaminifu wako katika Abadoni[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika maangamizi” au “mahali pa maangamizi.” Neno la Kiebrania “Abadoni” ni istilahi ya kishairi kwa eneo la uharibifu na mauti.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיְסֻפַּר
  choice: Je, ... hutangazwa
  rationale: Kitenzi ספר katika hali ya Pual pamoja na kiambishi cha swali ה huunda swali la balagha lenye maana ya ‘je, husimuliwa/hutangazwa?’ ‘Hutangazwa’ huhifadhi hali ya kutendwa na ni Kiswahili cha kawaida na chenye hadhi.
- source_word: בַּקֶּבֶר
  choice: kaburini
  rationale: קבר humaanisha kaburi au mahali pa kuzikia; ‘kaburini’ ni tafsiri ya moja kwa moja na ya kawaida katika muktadha huu.
- source_word: חַסְדֶּךָ
  choice: upendo wako thabiti
  rationale: חסד huonyesha upendo wa kudumu wenye uaminifu. ‘Upendo wako thabiti’ huhifadhi uzito huo bila kuufanya kuwa istilahi ya dhehebu fulani.
- source_word: אֱמוּנָתְךָ
  choice: uaminifu wako
  rationale: אֱמוּנָה hapa ni hali ya Mungu kuwa mwaminifu na wa kutegemewa, sambamba na חסד.
- source_word: בָּאֲבַדּוֹן
  choice: katika Abadoni
  rationale: אבדון inaweza kumaanisha maangamizi au eneo la maangamizi na hapa imetumiwa kishairi sambamba na kaburi. Kuhifadhi jina ‘Abadoni’ hudumisha taswira ya Kiebrania, huku maana zake nyingine zikitolewa katika tanbihi.
theological_decisions:
- issue: Iwapo אבדון itafsiriwe kama nomino ya kawaida ‘maangamizi’ au ihifadhiwe kama istilahi ya kishairi ‘Abadoni’
  choice: Abadoni katika andiko kuu
  alternative: maangamizi; mahali pa maangamizi
  rationale: Katika usambamba wake na ‘kaburini,’ neno hili linaelekea kurejelea eneo la wafu au la uharibifu, si dhana ya maangamizi tu. ‘Abadoni’ huhifadhi mvuto wa kishairi na kutofafanua kupita kiasi; maana mbadala zinaonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kiunganishi ‘na’ kimetumiwa kukamilisha mshororo wa pili wenye kitenzi kilichoachwa katika Kiebrania, bila kuondoa usambamba wa kishairi. Alama ya tanbihi imewekwa baada ya ‘Abadoni’ kwa kuwa tanbihi inalifafanua neno hilo.
