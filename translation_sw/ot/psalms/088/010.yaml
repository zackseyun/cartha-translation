base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/010.yaml
  text: Do you work wonders for the dead? Do the departed spirits rise up to praise you? Selah[a]
translation:
  language: sw
  text: Je, unawafanyia wafu maajabu? Je, roho za waliokufa[a] huinuka na kukusifu? Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vivuli vya wafu”; Kiebrania Refa'im, neno la kishairi linalowataja wafu walio katika ulimwengu wa wafu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלַמֵּתִים
  choice: unawafanyia wafu
  rationale: 'Kiambishi cha swali הֲ pamoja na לַ kinaonyesha kitendwa au walengwa wa tendo: “kwa ajili ya wafu.” Muundo huu ni wa kawaida katika Kiswahili na unadumisha nguvu ya swali la balagha.'
- source_word: תַּעֲשֶׂה פֶּלֶא
  choice: unawafanyia ... maajabu
  rationale: Ingawa פֶּלֶא ni umoja katika Kiebrania, kishazi cha Kiswahili “kufanya maajabu” ni cha asili na kinawakilisha matendo ya Mungu yaliyo ya ajabu bila kuyafinya kuwa miujiza kwa maana finyu.
- source_word: אִם
  choice: Je
  rationale: Hapa אִם inaanzisha swali la pili la balagha linalolingana na la kwanza, si sentensi ya sharti. “Je” huonyesha wazi nguvu hiyo ya kuuliza.
- source_word: רְפָאִים
  choice: roho za waliokufa
  rationale: Katika muktadha huu wa kishairi, רְפָאִים ni waliokufa wanaohusishwa na ulimwengu wa wafu. Tafsiri hii inaeleweka kwa wasomaji wa sasa bila kuifanya kuwa jina la kundi la watu au kuingiza mafundisho ya baadaye kuhusu hali ya wafu.
- source_word: יָקוּמוּ
  choice: huinuka
  rationale: Kitenzi קום kinamaanisha kuinuka au kusimama. “Huinuka” kinahifadhi taswira hai na, katika swali la balagha, kinaeleza jambo kwa namna ya kijumla bila kuamua maana yake ya kiteolojia kupita kiasi.
- source_word: יוֹדוּךָ
  choice: kukusifu
  rationale: ידה katika muundo huu huonyesha kutoa shukrani au sifa. “Kukusifu” kinafaa na lugha ya ibada katika zaburi hii.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana sahihi ya neno hili la kimuziki au kiliturujia haijulikani; kwa hiyo limetoholewa badala ya kutafsiriwa kwa kubahatisha.
theological_decisions:
- issue: Maana ya רְפָאִים katika taswira ya kishairi ya ulimwengu wa wafu
  choice: roho za waliokufa
  alternative: vivuli vya wafu; waliokufa; Refaimu
  rationale: Chaguo hili linadumisha rejeo la kishairi kwa waliokufa katika ulimwengu wa wafu, lakini halidai kwa undani hali au uwezo wao. Mbadala wa karibu zaidi, “vivuli vya wafu,” umewekwa katika tanbihi ili kuhifadhi upana wa neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Maswali mawili sambamba yamehifadhiwa, na “Sela” limetoholewa kwa kuwa maana yake kamili haijulikani.
