  text: עָ֭לַ/י סָמְכָ֣ה חֲמָתֶ֑/ךָ וְ/כָל מִ֝שְׁבָּרֶ֗י/ךָ עִנִּ֥יתָ סֶּֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/007.yaml
  text: Your wrath has rested on me[a], and with all your breakers you have afflicted me. Selah
translation:
  language: sw
  text: 'Ghadhabu yako imetulia juu yangu,

    na kwa mawimbi yako yote yavunjayo umenitesa. Sela.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sela: maana ya neno hili haijulikani kwa hakika; huenda ni alama ya kimuziki au ya kiliturujia.'
    reason: lexical_uncertainty
lexical_decisions:
- source_word: סָמְכָה
  choice: imenikalia kwa uzito
  rationale: Kitenzi סמך kina wazo la kuegemea au kutulia juu ya kitu. Katika muktadha huu, ghadhabu ndiyo kiima na iko ‘juu yangu’; usemi huu wa Kiswahili huhifadhi picha ya ghadhabu inayomkalia mwombolezaji kwa uzito bila kuifanya tu kuwa hisia ya dhiki.
- source_word: חֲמָתֶךָ
  choice: ghadhabu yako
  rationale: חֵמָה humaanisha ghadhabu, hasira kali, au ukali. ‘Ghadhabu’ ni neno la kawaida, lenye hadhi, na linalohifadhi uzito wa hasira ya Mungu katika ombolezo.
- source_word: מִשְׁבָּרֶיךָ
  choice: mawimbi yako yote yanayovunjika
  rationale: מִשְׁבָּר hurejelea mawimbi ya bahari yanayopasuka au kuvunjika. Kiswahili hakina nomino ya kawaida inayolingana kikamilifu na ‘breakers’; kifungu hiki huhifadhi picha hiyo kwa lugha inayoeleweka.
- source_word: עִנִּיתָ
  choice: umenitesa
  rationale: Katika Piel, ענה inaweza kumaanisha kutesa, kunyenyekeza, au kuonea. ‘Umenitesa’ huwasilisha mateso anayofanyiwa msemaji na huweka wazi yambwa ‘mimi’ linalodokezwa na muktadha.
- source_word: וְכָל
  choice: na kwa ... yako yote
  rationale: Muundo huu unaunganisha kishazi cha pili na kuonyesha kuwa mawimbi yote ndiyo njia ya mateso. ‘Kwa’ huwasilisha dhana ya chombo bila kuondoa msisitizo wa ‘yote’.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya neno hili la kiliturujia haijulikani kwa hakika; limenukuliwa kwa sauti badala ya kutafsiriwa.
theological_decisions:
- issue: Hasira ya Mungu na utendaji wake katika mateso
  choice: Msemaji anamwambia Mungu moja kwa moja kwamba ghadhabu yake imemkalia na kwamba Mungu amemtesa kwa mawimbi yake yote.
  alternative: Kupunguza utendaji wa Mungu kwa kufanya mateso yaonekane kuwa nguvu isiyo na mhusika, au kutafsiri ghadhabu kuwa dhiki ya kawaida tu.
  rationale: Kiebrania kinahusisha moja kwa moja ghadhabu na kitendo cha kutesa na Mungu. Tafsiri inahifadhi mvutano huo wa kiteolojia wa ombolezo badala ya kuupunguza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Imenikalia kwa uzito’ ni ya asili zaidi kuliko tafsiri ya neno kwa neno ya ‘imetulia juu yangu,’ huku ikihifadhi taswira ya kitu kinachoegemea juu ya msemaji. Alama ya tanbihi [a] imewekwa baada ya ‘Sela’ kwa kuwa tanbihi inaeleza neno hilo.
