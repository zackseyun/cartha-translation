lexical_decisions:
- source_word: תָּבוֹא
  choice: na ifike
  rationale: 'Kitenzi cha hali isiyotimilika chenye kiima cha kike kinachorejelea ‘sala yangu’ kinaeleweka hapa kama ombi: ‘na ifike,’ si taarifa ya wakati ujao.'
- source_word: לְפָנֶיךָ
  choice: mbele zako
  rationale: Hii ni nahau inayomaanisha kufika katika uwepo wa mtu. ‘Mbele zako’ ni Kiswahili cha kawaida na chenye heshima, huku dokezo la chini likihifadhi maana halisi ya ‘mbele ya uso wako.’
- source_word: תְּפִלָּתִי
  choice: sala yangu
  rationale: ‘Sala’ ndiyo maana ya kawaida ya nomino hii na inafaa kwa maombi yanayoelekezwa kwa Mungu.
- source_word: הַטֵּה
  choice: tega
  rationale: Amri hii ina maana ya kuelekeza au kuinamisha. Nahau ‘tega sikio’ huhifadhi picha ya Kiebrania ya kusikiliza kwa makini na inaeleweka katika Kiswahili cha sasa.
- source_word: אָזְנְךָ
  choice: sikio lako
  rationale: Umoja umehifadhiwa kulingana na nahau ya Kiebrania ya kusikiliza kwa makini.
- source_word: לְרִנָּתִי
  choice: usikie kilio changu
  rationale: Katika muktadha wa maombolezo wa Zaburi 88, רִנָּה ni kilio cha dhiki, si lazima shangwe. ‘Usikie’ hukamilisha kwa njia ya asili nahau ya Kiswahili ‘tega sikio’ bila kubadili lengo la amri.
