review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the petitionary force of תָּבוֹא, the presence idiom in לְפָנֶיךָ, and the lament-context sense of רִנָּתִי. However, the Hebrew second colon is directly ‘incline your ear to my cry’; adding ‘usikie’ makes the Swahili more explicit than the source and weakens the compact parallelism.
  naturalness: ‘Sala yangu na ifike mbele zako’ is natural, reverent Standard East African Swahili. ‘Utege sikio lako kwa kilio changu’ is a well-established, natural prayer idiom. The draft’s ‘tega sikio lako usikie kilio changu’ is redundant and less idiomatic in this elevated register.
  terminology: ‘Sala’ appropriately renders תְּפִלָּה, and ‘kilio’ suitably represents רִנָּה in this psalm’s lament setting. ‘Mbele zako’ faithfully communicates the Hebrew presence idiom. The literal footnote should use idiomatic Swahili wording, ‘Kwa maana halisi,’ rather than ‘Kwa neno.’
  issues:
  - severity: medium
    issue: The phrase ‘tega sikio lako usikie kilio changu’ adds an explicit command to hear.
    rationale: The Hebrew has one imperative, ‘incline,’ followed by ‘to my cry.’ In Swahili, ‘uteg[e] sikio lako kwa kilio changu’ expresses this directly without adding a second verbal idea.
  - severity: low
    issue: The imperative form ‘tega’ is less fitting than ‘utege’ in this direct, reverent petition.
    rationale: ‘Utege sikio lako’ is the conventional and natural elevated Swahili formulation for addressing God in prayer.
  - severity: low
    issue: Footnote b uses the awkward phrase ‘Kwa neno.’
    rationale: ‘Kwa maana halisi’ clearly and idiomatically introduces a literal rendering.
