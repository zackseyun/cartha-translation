  text: עֵינִ֥/י דָאֲבָ֗ה מִנִּ֫י עֹ֥נִי קְרָאתִ֣י/ךָ יְהוָ֣ה בְּ/כָל י֑וֹם שִׁטַּ֖חְתִּי אֵלֶ֣י/ךָ כַפָּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/009.yaml
  text: My eye grows weak because of affliction; I call on you every day[a], O Yahweh; I spread out my hands to you.
translation:
  language: sw
  text: Jicho langu linadhoofika kwa sababu ya mateso[a]; ninakuita kila siku, ee Yahweh; ninakunyooshea mikono yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jicho langu linakonda kwa mateso,” au, “Jicho langu linaumia kwa sababu ya taabu.”
    reason: Kitenzi דָאֲבָה kina wigo wa maana unaojumuisha kudhoofika, kukonda au kuumia; Kiebrania hakilazimishi maana moja tu.
lexical_decisions:
- source_word: עֵינִי
  choice: Jicho langu
  rationale: Nomino ya Kiebrania iko katika umoja. Umoja umehifadhiwa ili kudumisha taswira halisi ya kishairi, ingawa inaweza kuwakilisha kuona au nguvu za mtu kwa ujumla.
- source_word: דָאֲבָה
  choice: linadhoofika
  rationale: Kitenzi kinaweza kumaanisha kunyong'onyea, kudhoofika, kuumia, au kukonda kwa sababu ya mateso. ‘Linadhoofika’ ni Kiswahili cha kawaida kisichobainisha kupita kiasi kama ni maumivu ya mwili au kufifia kwa uwezo wa kuona.
- source_word: מִנִּי עֹנִי
  choice: kwa sababu ya mateso
  rationale: Kirai kinaonyesha chanzo au sababu ya hali hiyo. ‘Mateso’ linafaa katika muktadha wa zaburi hii na ‘kwa sababu ya’ huweka wazi uhusiano wa kisababishi.
- source_word: קְרָאתִיךָ
  choice: ninakuita
  rationale: Ingawa umbo la Kiebrania ni qatal, kirai ‘kila siku’ kinaonyesha tendo la kawaida linalorudiwa. ‘Ninakuita’ linaeleza kumwomba Mungu bila kuongeza nguvu isiyotajwa wazi katika kitenzi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa na cheo. Tahajia ‘Yahwe’ ni umbo la kawaida na linalosomeka kwa urahisi katika Kiswahili.
- source_word: בְּכָל־יוֹם
  choice: kila siku
  rationale: Kirai hiki hapa kinaeleweka zaidi kama kurudiwa siku baada ya siku, si lazima tendo linaloendelea mchana kutwa.
- source_word: שִׁטַּחְתִּי אֵלֶיךָ כַפָּי
  choice: ninakunyooshea mikono yangu
  rationale: Usemi unaonyesha ishara ya kusali au kuomba kwa kunyoosha au kutandaza viganja kuelekea kwa Mungu. ‘Mikono’ ni ya kawaida zaidi katika Kiswahili kuliko ‘viganja’ katika usemi huu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la Mungu lenye herufi nne, si cheo. ‘Yahwe’ huhifadhi jina hilo moja kwa moja bila kulibadilisha kuwa ‘BWANA’; ‘Yehova’ ni matamshi mbadala ya kihistoria.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Umoja wa ‘jicho’ na ishara ya kunyoosha mikono imehifadhiwa; vitenzi vya sasa vinaonyesha tendo linalorudiwa kila siku.
