  language: sw
  text: Nafsi zao zilichukia kila aina ya chakula[a], nao wakakaribia malango ya mauti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana ya kimuktadha, “walipoteza hamu ya kula,” au kwa urahisi, “walichukia kila aina ya chakula.” Neno la Kiebrania linalotafsiriwa “nafsi zao” (נַפְשָׁם) linaweza kumaanisha nafsi, mtu mwenyewe, uhai, au hamu ya kula, kutegemeana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֹכֶל
  choice: kila chakula
  rationale: Muundo huu una maana ya chakula chote kwa ujumla. “Kila chakula” ni Kiswahili cha kawaida kinachohifadhi wazo la ujumla kamili.
- source_word: תְּתַעֵב
  choice: ilichukia
  rationale: Kitenzi cha Kiebrania katika Piel kinaonyesha kinyaa au chuki kali. “Ilichukia” ni neno la sasa, linaloeleweka kwa urahisi, na katika muktadha wa chakula hudokeza kukikataa kwa kinyaa.
- source_word: נַפְשָׁם
  choice: nafsi yao
  rationale: נֶפֶשׁ inaweza kumaanisha nafsi, mtu mwenyewe, uhai, au hamu ya kula. “Nafsi yao” huhifadhi taswira ya Kiebrania na upana wake, huku tanbihi ikifafanua maana zinazowezekana katika muktadha huu.
- source_word: וַיַּגִּיעוּ עַד
  choice: wakakaribia
  rationale: Katika muktadha huu muundo huo unaonyesha kufikia karibu kabisa na mpaka fulani. “Wakakaribia” huwasilisha hatari ya kifo iliyokuwa karibu bila kudai kwamba tayari walikuwa wamevuka kizingiti hicho.
- source_word: שַׁעֲרֵי מָוֶת
  choice: malango ya mauti
  rationale: 'Hii ndiyo taswira ya moja kwa moja ya Kiebrania: kizingiti cha kifo. “Mauti” inafaa katika lugha ya kishairi yenye heshima, bila kuingiza wazo la Kuzimu ambalo halitajwi katika chanzo.'
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika muktadha wa ugonjwa mkali
  choice: nafsi yao
  alternative: hamu yao ya kula; wao wenyewe; uhai wao
  rationale: Ingawa kukataa chakula kunaweza kuelekeza kwa hamu ya kula, maandishi yametumia נֶפֶשׁ badala ya kiwakilishi rahisi. Tafsiri kuu huhifadhi upana wa mtazamo wa Kiebrania kuhusu mtu mzima, na tanbihi hudumisha uwezekano wa maana ya hamu ya kula bila kuufanya kuwa tafsiri pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. “Nafsi yao” na “malango ya mauti” zinahifadhi taswira za Kiebrania; tanbihi inaeleza utata wa kimsamiati bila kuamua maana moja kimyakimya.
