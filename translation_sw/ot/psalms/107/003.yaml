lexical_decisions:
- source_word: וּמֵאֲרָצוֹת
  choice: kutoka nchi mbalimbali
  rationale: Nomino אֲרָצוֹת ni wingi wa אֶרֶץ na hapa inaonyesha maeneo mengi walimokusanywa waliokombolewa. Kiswahili cha kawaida hutumia “nchi mbalimbali” kueleza wingi huo kwa uwazi bila kulazimisha maana ya mataifa ya kisiasa.
- source_word: קִבְּצָם
  choice: akawakusanya
  rationale: Kitenzi קבץ humaanisha kukusanya. Kiambishi cha nafsi “a-” kinadokeza mhusika aliyetajwa katika muktadha, yaani Bwana, na “-wa-” kinawakilisha wale waliokombolewa.
- source_word: מִמִּזְרָח וּמִמַּעֲרָב
  choice: kutoka mashariki na magharibi
  rationale: Haya ni majina ya pande za dunia. Muundo huu ni wa kawaida na wenye ulinganifu mzuri katika Kiswahili.
- source_word: מִצָּפוֹן
  choice: kutoka kaskazini
  rationale: צָפוֹן hapa ni upande wa kaskazini; tafsiri ya moja kwa moja inafaa katika orodha hii ya maeneo.
- source_word: וּמִיָּם
  choice: na baharini
  rationale: יָם kwa maana yake ya kawaida ni “bahari.” Ingawa wakati mwingine hutumika kwa upande wa magharibi, mstari huu tayari umetaja magharibi, kwa hiyo “baharini” inalinda ushahidi wa maandishi na pia inaweza kumaanisha maeneo ya ng’ambo au ya pwani.
