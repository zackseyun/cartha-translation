  text: יַעֲל֣וּ שָׁ֭מַיִם יֵרְד֣וּ תְהוֹמ֑וֹת נַ֝פְשָׁ֗/ם בְּ/רָעָ֥ה תִתְמוֹגָֽג׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/026.yaml
  text: They rose up to the heavens; they went down to the depths[a]. Their soul melted away in distress.
translation:
  language: sw
  text: 'Walipanda hadi mbinguni;

    wakashuka hadi vilindini.

    Nafsi yao[a] ikayeyuka kwa dhiki.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uhai wao ukayeyuka kwa dhiki.” Neno la Kiebrania נֶפֶשׁ linaweza kumaanisha “nafsi,” “uhai,” au “mtu mwenyewe”; nalo רָעָה hapa linaweza kumaanisha “dhiki,” “taabu,” au “janga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלוּ
  choice: Walipanda
  rationale: Kitenzi hiki kinaonyesha mwendo wa kwenda juu. Wakati uliopita wa masimulizi unafaa katika Kiswahili na unadumisha picha hai ya dhoruba.
- source_word: שָׁמַיִם
  choice: mbinguni
  rationale: Neno hili linahifadhi lugha ya kishairi ya kufika juu mno bila kuifafanua picha kupita kiasi.
- source_word: יֵרְדוּ
  choice: wakashuka
  rationale: Hili ni kinyume cha moja kwa moja cha “Walipanda” na linaonyesha mfuatano wa harakati kwa mtindo wa kawaida wa Kiswahili.
- source_word: תְהוֹמוֹת
  choice: vilindini
  rationale: Katika muktadha wa bahari yenye dhoruba, neno hili linamaanisha sehemu za chini kabisa za mawimbi au bahari. “Vilindini” ni la asili, la kishairi, na haliongezi wazo la kuzama.
- source_word: נַפְשָׁם
  choice: Nafsi yao
  rationale: נֶפֶשׁ inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. “Nafsi yao” inadumisha sitiari ya Kiebrania ya utu wao wa ndani kulegea, huku tanbihi ikionyesha uwezekano wa “uhai wao.”
- source_word: בְּרָעָה
  choice: kwa dhiki
  rationale: Katika muktadha huu רָעָה haimaanishi uovu wa kimaadili bali taabu au hali ya kutisha. “Kwa dhiki” ni ya kawaida na inaonyesha sababu au mazingira ya kuvunjika moyo.
- source_word: תִתְמוֹגָג
  choice: ikayeyuka
  rationale: Kitenzi kina picha ya kuyeyuka, kulegea, au kuporomoka kwa ndani. “Ikayeyuka” huhifadhi sitiari hiyo badala ya kuibadili kuwa ufafanuzi kama “wakakata tamaa.”
