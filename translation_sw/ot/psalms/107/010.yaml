  text: Some sat in darkness and deep shadow[a], prisoners in affliction and irons,
translation:
  language: sw
  text: Wengine walikaa gizani na katika uvuli mzito[a], wafungwa katika mateso na pingu za chuma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uvuli wa mauti.” Hii ni tafsiri ya jadi ya צַלְמָוֶת; huenda neno la Kiebrania linamaanisha kwa upana zaidi giza kuu au giza nene.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי
  choice: Wengine walikaa
  rationale: Kitenzi-jina hiki kinaeleza watu waliokaa au waliokuwa katika hali fulani. Usemi wa kikomo “Wengine walikaa” ni wa asili katika Kiswahili na unaendana na mtiririko wa zaburi unaotaja makundi mbalimbali yaliyookolewa.
- source_word: חֹשֶׁךְ
  choice: gizani
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa hali ya kutokuwa na nuru, halisi au ya kitamathali.
- source_word: צַלְמָוֶת
  choice: uvuli mzito
  rationale: Neno hili linaweza kumaanisha giza au uvuli wa kutisha sana. “Uvuli mzito” inadumisha taswira ya kishairi bila kuingiza waziwazi wazo la kifo, huku tafsiri ya jadi ikihifadhiwa katika tanbihi.
- source_word: אֲסִירֵי
  choice: wafungwa
  rationale: Wingi huu unamaanisha watu waliofungwa au kuwekwa kifungoni; “wafungwa” ni wazi, wa kawaida, na unafaa pamoja na taswira ya pingu.
- source_word: עֳנִי
  choice: mateso
  rationale: Neno linaweza kumaanisha dhiki, taabu, unyonge, au umaskini. Katika muktadha wa kifungo, “mateso” linaonyesha hali pana ya kutaabika bila kuibana kuwa umaskini pekee.
- source_word: בַרְזֶל
  choice: pingu za chuma
  rationale: Ingawa Kiebrania kina “chuma” kwa umoja, hapa kimetumiwa kumaanisha vifaa vya chuma vya kuwafunga watu. “Pingu za chuma” huwasilisha maana hiyo wazi na kwa Kiswahili cha kawaida.
