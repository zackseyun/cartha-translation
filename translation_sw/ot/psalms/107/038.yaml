  text: וַ/יְבָרֲכֵ֣/ם וַ/יִּרְבּ֣וּ מְאֹ֑ד וּ֝/בְהֶמְתָּ֗/ם לֹ֣א יַמְעִֽיט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/038.yaml
  text: He blessed them[a], and they multiplied greatly; and he did not let their livestock decrease.
translation:
  language: sw
  text: Akawabariki, nao wakaongezeka sana; naye hakupunguza mifugo yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na mifugo yao haikupungua.” Kitenzi cha Kiebrania ni cha umoja; kinaweza kueleweka kuwa Mungu anaendelea kuwa mtenda (“hakupunguza”), au kishazi kinaweza kueleza matokeo (“haikupungua”).
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  choice: Akawabariki
  rationale: Kitenzi cha Kiebrania katika piel pamoja na kiambishi cha nafsi ya tatu wingi humaanisha kuwapa baraka au mafanikio. Kiambishi cha usimulizi “aka-” kinaendeleza mtiririko wa zaburi, na mtenda asiye tajwa wazi ni Mungu katika muktadha.
- source_word: וַיִּרְבּוּ מְאֹד
  choice: nao wakaongezeka sana
  rationale: רבה hapa ni kitenzi kisichoelekezwa kwa yambwa, kikieleza kuongezeka kwa idadi; מְאֹד hukazia kiwango. “Wakaongezeka sana” ni Kiswahili cha kawaida na huhifadhi maana hiyo bila kubainisha zaidi aina ya ongezeko.
- source_word: וּבְהֶמְתָּם
  choice: mifugo yao
  rationale: בְּהֵמָה limetumiwa kwa maana ya pamoja ya wanyama wanaofugwa. “Mifugo” ni pana na ya kawaida kuliko “ng’ombe,” ambalo lingepunguza maana.
- source_word: לֹא יַמְעִיט
  choice: wala hakupunguza
  rationale: מעט katika hiphil ina maana ya kusababisha kuwa kidogo au kupunguza. Kitenzi ni umoja, na kwa kawaida kinaweza kuendeleza Mungu kama mtenda; “hakupunguza” huhifadhi muundo wa kisababishi kuliko kuugeuza moja kwa moja kuwa hali isiyo na mtenda.
theological_decisions:
- issue: Mtenda katika kishazi cha mwisho
  choice: 'Mungu anaendelea kuwa mtenda: “wala hakupunguza mifugo yao.”'
  alternative: “wala mifugo yao haikupungua.”
  rationale: Kitenzi cha Kiebrania ni umoja na kinaweza kuendeleza mtenda wa umoja wa “akawabariki,” yaani Mungu. Hata hivyo, kwa kuwa kishazi kinaweza pia kueleweka kama matokeo—mifugo yao kutopungua—uwezekano huo umehifadhiwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na heshima lakini kinachoeleweka kwa msomaji wa kawaida. “Mifugo” limetumiwa kwa maana pana ya wanyama wanaofugwa.
