  yaml_path: translation/ot/psalms/107/011.yaml
  text: For they rebelled against the words of God and despised the counsel of the Most High[a].
translation:
  language: sw
  text: Kwa maana waliasi maneno ya Mungu, na wakalidharau shauri la Aliye Juu Sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa sababu walikaidi maneno ya Mungu na kulidharau shauri la Aliye Juu Sana.”
    reason: 'Mbadala huu unaonyesha maana halali za כִּי, מרה, na נאץ: sababu inaweza kusemwa wazi zaidi, na “walikaidi” huwasilisha nguvu ya uasi.'
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu ya hali au hukumu iliyotangulia; “kwa maana” kinadumisha mtiririko wa ufafanuzi wa kishairi, huku “kwa sababu” kikiwa mbadala unaowezekana.
- source_word: הִמְרוּ
  choice: waliasi
  rationale: Kitenzi מרה huonyesha uasi au ukaidi dhidi ya mamlaka. “Waliasi” ni cha kawaida na chenye nguvu ya kutosha kuonyesha kuvunja utii kwa maneno ya Mungu.
- source_word: אִמְרֵי
  choice: maneno ya
  rationale: Wingi huu katika hali ya kuambatana unaashiria maneno au matamko. “Maneno ya” ni Kiswahili cha kawaida na hakibani maana kuwa misemo maalumu tu.
- source_word: אֵל
  choice: Mungu
  rationale: אֵל hapa ni jina la kawaida la kumtaja Mungu; “Mungu” ni tafsiri wazi inayofaa muktadha bila kuongeza ufafanuzi usio katika mstari.
- source_word: וַעֲצַת
  choice: na ... shauri la
  rationale: עֵצָה linaweza kumaanisha shauri, mpango, au kusudi. “Shauri” linahifadhi wazo la hekima na mwongozo wa Mungu bila kuamua kimya kimya kwamba hapa ni amri au mpango uliokwisha kuamuliwa.
- source_word: עֶלְיוֹן
  choice: Aliye Juu Zaidi
  rationale: Hili linahifadhi cheo cha Mungu kinachoonyesha ukuu wake kuliko wote, kwa lugha ya heshima na inayoeleweka katika Kiswahili cha sasa.
- source_word: נָאָצוּ
  choice: wakalidharau
  rationale: Kitenzi נאץ humaanisha kudharau au kukataa kwa dharau. “Wakalidharau” kinaonyesha wazi mtazamo wa dharau kuelekea shauri la Mungu na kinaendeleza kishairi tendo la kwanza.
theological_decisions:
- issue: Uwasilishaji wa majina ya Mungu אֵל na עֶלְיוֹן katika ulinganifu wa kishairi
  choice: Mungu ... Aliye Juu Zaidi
  alternative: Mungu Mwenye Nguvu ... Aliyetukuka
  rationale: Chaguo hili linatofautisha majina hayo mawili na kudumisha cheo cha עֶלְיוֹן bila kuongeza wazo maalumu la kimafundisho au kuyafanya majina hayo yafanane kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Ulinganifu wa vipashio viwili vya Kiebrania umehifadhiwa, pamoja na nguvu ya “waliasi” na “wakalidharau.”
