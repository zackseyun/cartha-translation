  text: He turns rivers into a wilderness[a], and springs of water into thirsty ground.
translation:
  language: sw
  text: 'Huigeuza mito kuwa nyika,

    na chemchemi za maji kuwa nchi yenye kiu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwa nchi iliyokauka.” Nomino ya Kiebrania kwa kawaida humaanisha “kiu” au “hali ya kuwa na kiu,” na hapa imetumiwa kueleza hali kavu isiyo na maji.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: huigeuza ... kuwa
  rationale: Kitenzi שׂים kimsingi humaanisha ‘kuweka’ au ‘kufanya’; katika muktadha huu wa mabadiliko, ‘huigeuza ... kuwa’ huwasilisha maana ya kishairi kwa uwazi.
- source_word: נְהָרוֹת
  choice: mito
  rationale: Hii ndiyo maana ya kawaida na ya moja kwa moja ya nomino hii ya wingi.
- source_word: לְמִדְבָּר
  choice: kuwa nyika
  rationale: מִדְבָּר inaweza kumaanisha nyika au jangwa. ‘Nyika’ huhifadhi maana pana ya eneo kame na lisilokaliwa, huku לְ ikionyesha hali ya matokeo.
- source_word: וּמֹצָאֵי מַיִם
  choice: chemchemi za maji
  rationale: Kirai hiki hurejelea mahali maji yanapotokea au vyanzo vya maji; ‘chemchemi za maji’ ni tafsiri ya kawaida na yenye picha dhahiri.
- source_word: לְצִמָּאוֹן
  choice: kuwa nchi yenye kiu
  rationale: Nomino צִמָּאוֹן humaanisha ‘kiu’ au hali ya ukame. ‘Nchi yenye kiu’ huhifadhi taswira halisi ya Kiebrania bila kuifanya kuwa dhana isiyo na mahali.
