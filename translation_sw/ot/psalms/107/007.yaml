lexical_decisions:
- source_word: וַיַּדְרִיכֵם
  choice: Aliwaongoza
  rationale: Kitenzi cha Kihifili kutokana na דרך kina maana ya kuwaongoza au kuwaelekeza watu njiani; “aliwaongoza” ni cha kawaida na kinahifadhi maana ya kisababishi.
- source_word: בְּדֶרֶךְ יְשָׁרָה
  choice: katika njia iliyonyooka
  rationale: דֶּרֶךְ ni njia au barabara, na יְשָׁרָה hapa inaonyesha njia iliyonyooka au ya moja kwa moja katika muktadha wa safari.
- source_word: לָלֶכֶת אֶל
  choice: ili wafike kwenye
  rationale: Ingawa kwa umbo ni “kwenda hadi/kuelekea,” Kiswahili cha “ili wafike kwenye” kinaeleza kwa kawaida kusudi la kuongozwa na lengo la safari bila kubadili maana.
- source_word: עִיר מוֹשָׁב
  choice: mji wa kuishi
  rationale: Kirai cha muundo wa utegemezi kina maana halisi ya “mji wa makao”; “mji wa kuishi” ni cha kueleweka kwa urahisi na kinadumisha wazo la mahali pa kukaa.
