base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/015.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: sw
  text: Wamshukuru Yahweh kwa upendo wake thabiti, na kwa matendo yake ya ajabu kwa wanadamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “kwa wana wa mwanadamu”; pia, “kwa wanadamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Na wamshukuru
  rationale: Kauli ya wingi yenye maana ya himizo hapa inafaa kutafsiriwa kwa “Na wamshukuru,” ambayo ni ya asili katika Kiswahili na huhifadhi nguvu ya mwito wa kutoa shukrani.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Kihusishi ל־ humtambulisha anayeelekezewa shukrani; Kiswahili hutumia kitenzi chenye kiambishi cha yambwa, “wamshukuru.” Jina la Mungu יהוה limetoholewa kuwa “Yahweh.”
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חסד hapa ni upendo mwaminifu na wa kudumu. “Upendo wake thabiti” huhifadhi wazo la upendo pamoja na uthabiti bila kulifinya kuwa rehema pekee.
- source_word: וְנִפְלְאוֹתָיו
  choice: na kwa matendo yake ya ajabu
  rationale: Nomino inayotokana na פלא hurejelea matendo yasiyo ya kawaida ya Mungu. “Matendo yake ya ajabu” ni wazi na ya kawaida katika Kiswahili, na huonyesha kuwa ni matendo, si tu vitu vya kustaajabisha.
- source_word: לִבְנֵי אָדָם
  choice: kwa wanadamu
  rationale: Kirai hiki kihalisi ni “kwa wana wa Adamu/mwanadamu,” lakini katika muktadha wake kinawarejelea wanadamu kwa ujumla kama walengwa wa matendo hayo. “Kwa wanadamu” ni Kiswahili cha kawaida na huhifadhi uhusiano unaoonyeshwa na ל־.
theological_decisions:
- issue: Utafsiri wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יהוה moja kwa moja. “Yahweh” huhifadhi jina hilo badala ya kulibadili kuwa cheo.
- issue: Maana ya בני אדם
  choice: wanadamu
  alternative: wana wa Adamu; wana wa mwanadamu
  rationale: Kirai ni cha kiume kisarufi lakini kinawakilisha jamii yote ya binadamu. “Wanadamu” huwasilisha maana hiyo kwa kawaida bila kudokeza kwamba wanaume pekee ndio wanaokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo wa “Na wamshukuru” huhifadhi himizo la kibiblia; “upendo wake thabiti” huwasilisha חסד kwa ufupi na bila kuingiza istilahi ya kimadhehebu.
