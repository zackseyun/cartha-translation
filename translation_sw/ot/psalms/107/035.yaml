  text: יָשֵׂ֣ם מִ֭דְבָּר לַֽ/אֲגַם מַ֑יִם וְ/אֶ֥רֶץ צִ֝יָּ֗ה לְ/מֹצָ֥אֵי מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/035.yaml
  text: He turns a wilderness into a pool of water[c][b][a], and dry land into springs of water.
translation:
  language: sw
  text: Hugeuza nyika kuwa dimbwi la maji,[a] na nchi kavu kuwa chemchemi za maji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bwawa la maji” au “eneo lenye maji na matete.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: Hugeuza
  rationale: Kitenzi שׂים kimsingi humaanisha kuweka au kufanya; katika muktadha huu wa kishairi kinaonyesha mabadiliko kutoka hali moja kwenda nyingine, hivyo “Hugeuza” ni tafsiri ya asili na wazi.
- source_word: מִדְבָּר
  choice: nyika
  rationale: מִדְבָּר ni eneo kame lisilolimwa au jangwa. “Nyika” ni neno la kawaida katika Kiswahili cha Afrika Mashariki na halidokezi lazima jangwa la mchanga.
- source_word: לַאֲגַם מַיִם
  choice: kuwa dimbwi la maji
  rationale: אֲגַם inaweza kumaanisha dimbwi, bwawa, au eneo lenye maji na matete. “Dimbwi la maji” linahifadhi taswira ya maji yaliyotuama yanayotofautishwa na nyika.
- source_word: וְאֶרֶץ צִיָּה
  choice: na nchi kavu
  rationale: צִיָּה hueleza ukavu au hali ya kukauka. “Nchi kavu” ni fupi, ya kawaida, na inadumisha ulinganifu wa kishairi.
- source_word: לְמֹצָאֵי מָיִם
  choice: kuwa chemchemi za maji
  rationale: מוֹצָא hurejelea mahali ambapo kitu hutokea au hutoka; katika muktadha wa maji, “chemchemi” huwasilisha vyanzo vya maji yanayobubujika kwa lugha ya kawaida.
