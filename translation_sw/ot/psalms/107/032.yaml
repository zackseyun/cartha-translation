lexical_decisions:
- source_word: וִירֹמְמוּהוּ
  choice: Na wamtukuze
  rationale: Kitenzi רומם hapa kinamaanisha kumwinua kwa heshima au kumtukuza hadharani. “Wamtukuze” ni Kiswahili cha kawaida na chenye hadhi kinachowasilisha maana hiyo.
- source_word: בִּקְהַל עָם
  choice: katika kusanyiko la watu
  rationale: קהל ni mkutano au kusanyiko lililokusanyika, na עָם ni watu kwa ujumla. “Kusanyiko la watu” ni wazi na halifungi muktadha kwa taasisi fulani ya kidini.
- source_word: וּבְמוֹשַׁב זְקֵנִים
  choice: na katika baraza la wazee
  rationale: מוֹשָׁב kimsingi huhusiana na kuketi au kikao; ikiambatana na זְקֵנִים inaonyesha kikao cha viongozi wa jamii. “Baraza la wazee” ni usemi wa asili wa Kiswahili unaobeba maana hiyo, huku tanbihi ikihifadhi picha halisi ya kikao.
- source_word: יְהַלְלוּהוּ
  choice: na wamsifu
  rationale: הלל katika piel humaanisha kusifu. “Wamsifu” ni tafsiri ya moja kwa moja na ya kawaida katika muktadha wa ibada.
