base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/032.yaml
  text: Let them exalt him in the assembly of the people[b][a], and praise him in the council of the elders.
translation:
  language: sw
  text: Na wamtukuze katika kusanyiko la watu, na wamsifu katika baraza la wazee.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kihalisi: “katika kikao cha wazee.”'
