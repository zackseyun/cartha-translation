  text: Then they were glad that they grew quiet[b][a], and he led them to their desired haven.
translation:
  language: sw
  text: Ndipo wakafurahi kwa kuwa kukawa shwari[a], naye akawaongoza mpaka bandari waliyoitamani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu walitulia.” Kitenzi cha Kiebrania hakitaji kiima wazi; katika muktadha kinaweza kueleweka kuwa mawimbi au maji yalitulia.
    reason: lexical_alternative
  - marker: b
    text: Au, “mahali walipotamani kufika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: Ndipo wakafurahi
  rationale: Kitenzi שׂמח huonyesha furaha, na “ndipo” huendeleza mfuatano wa simulizi unaoonyeshwa na waw pamoja na wayyiqtol kwa Kiswahili cha kawaida.
- source_word: כִּי
  choice: kwa kuwa
  rationale: כִּי hapa inaweza kuonyesha sababu au hali iliyowafanya wafurahi; “kwa kuwa” huwasilisha uhusiano huo kwa uwazi.
- source_word: יִשְׁתֹּקוּ
  choice: kukawa shwari
  rationale: Kitenzi שׁתק humaanisha kuwa kimya au kutulia. Kauli isiyotaja mtendaji inalinda kutotajwa wazi kwa kiima katika Kiebrania huku ikitoa maana ya utulivu wa bahari katika muktadha.
- source_word: וַיַּנְחֵם
  choice: naye akawaongoza
  rationale: נחה humaanisha kuongoza au kuelekeza. Kiima cha umoja wa kiume hakitajwi kwa jina, lakini katika muktadha kinamrejelea Mungu; “naye” huhifadhi rejeleo hilo bila kuongeza jina lisilomo katika mstari.
- source_word: מְחוֹז
  choice: bandari
  rationale: Neno hili hutaja mahali pa kufikiwa, hasa bandari katika muktadha wa safari ya baharini. “Bandari” ni neno la kawaida na wazi kwa wasomaji wa Kiswahili.
- source_word: חֶפְצָם
  choice: waliyoitamani
  rationale: Mzizi חפץ hubeba wazo la kutamani au kupendezwa. Kishazi hiki huonyesha kwa kawaida kwamba hiyo ndiyo bandari waliyotaka kufikia.
theological_decisions:
- issue: Kiima kisichotajwa cha וַיַּנְחֵם
  choice: “naye” linamrejelea Mungu aliyewaongoza
  alternative: Kauli isiyo na mtendaji, kama “wakaongozwa”
  rationale: Kitenzi cha Kiebrania ni nafsi ya tatu, umoja wa kiume, na muktadha wa zaburi unaonyesha kwamba Bwana ndiye anayejibu kilio chao. Kauli tendaji inadumisha utendaji wake binafsi bila kuingiza dai jingine la kimafundisho.
- issue: Kiima cha יִשְׁתֹּקוּ
  choice: 'Kauli isiyotaja kiima wazi: “kukawa shwari”'
  alternative: “walitulia,” au “mawimbi yakatulia”
  rationale: Umbo la Kiebrania ni wingi wa kiume bila kiima kilichotajwa wazi. Muktadha unaweza kuelekeza kwenye mawimbi au maji, lakini tafsiri haitakiwi kuondoa kabisa utata huo kwa kuongeza nomino moja kama kiima.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini kinachoeleweka kwa urahisi. “Kukawa shwari” ni usemi wa kawaida katika muktadha wa bahari na huepuka kuongeza kiima kisichotajwa wazi; “bandari waliyoitamani” hudumisha taswira ya safari ya baharini.
