  yaml_path: translation/ot/psalms/107/037.yaml
  text: They sowed fields and planted vineyards[a], and produced the fruit of the harvest.
translation:
  language: sw
  text: Wakapanda mbegu mashambani, wakapanda mashamba ya mizabibu, wakapata mazao mengi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kihalisi: “wakafanya tunda la mazao.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְרְעוּ שָׂדוֹת
  choice: Walipanda mbegu mashambani
  rationale: Kitenzi זרע humaanisha kupanda mbegu. Kiswahili cha kawaida huhitaji kutaja mbegu au kutumia kirai cha mahali; ‘kupanda mbegu mashambani’ kinaeleza tendo hilo kwa uwazi bila kudai kwamba mashamba yenyewe ndiyo mbegu.
- source_word: וַיִּטְּעוּ כְרָמִים
  choice: na kupanda mashamba ya mizabibu
  rationale: נטע ni kupanda mimea, na כְּרָמִים ni mashamba ya mizabibu, si mizabibu mmoja mmoja. Usemi huu ni wa kawaida na unahifadhi maana ya kilimo.
- source_word: וַיַּעֲשׂוּ פְּרִי תְבוּאָה
  choice: nayo yakazaa mazao
  rationale: Kwa muktadha wa kilimo, עשה pamoja na פְּרִי huonyesha kutoa au kuzaa. ‘Yakazaa mazao’ ni Kiswahili cha asili kinachoeleza matokeo ya mashamba na mizabibu, huku tanbihi ikihifadhi muundo usio wa kawaida wa Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Marudio ya ‘kupanda’ yamehifadhiwa kwa sababu Kiebrania hutumia vitenzi viwili vya kilimo, huku tofauti yake ikifafanuliwa kwa ‘mbegu mashambani’ na ‘mashamba ya mizabibu’.
