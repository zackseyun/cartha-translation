  variant: Standard East African Swahili
source:
  edition: WLC
  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/031.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: sw
  text: Na wamshukuru Yahweh kwa ajili ya upendo wake thabiti, na kwa ajili ya matendo yake ya ajabu kwa wanadamu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “kwa wana wa mwanadamu,” yaani, kwa wanadamu.
    reason: lexical_alternative
  - marker: b
    text: “Yahweh” ni jina la Mungu YHWH; kwa kawaida pia hutafsiriwa “BWANA.”
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹדוּ
  choice: Na wamshukuru
  rationale: Kauli ya Hiphil isiyotimilifu katika kiitikio hiki ina nguvu ya himizo; “Na wamshukuru” ni Kiswahili cha kawaida na hudumisha muundo wa kiitikio.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Kiambishi ל huonyesha anayeelekezewa shukrani, nacho jina la Mungu יהוה limetoholewa kuwa “Yahweh” ili kuhifadhi jina la agano.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד huhusisha upendo mwaminifu, wenye kudumu na wa agano; “upendo thabiti” huwasilisha uthabiti huo bila kutumia lugha ya kizamani.
- source_word: וְנִפְלְאוֹתָיו
  choice: na kwa ajili ya matendo yake ya ajabu
  rationale: נִפְלָאוֹת ni matendo yasiyo ya kawaida yanayoamsha mshangao; kurudia “kwa ajili ya” kunafanya uhusiano wa kisarufi uwe wazi katika Kiswahili.
- source_word: לִבְנֵי אָדָם
  choice: kwa wanadamu
  rationale: Nahau ya Kiebrania, kihalisi “kwa wana wa Adamu/mwanadamu,” ina maana ya jumla ya jamii ya binadamu; “kwa wanadamu” ni ya asili na huhifadhi walengwa wa matendo hayo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina maalumu la Mungu, si cheo; “Yahweh” hulihifadhi wazi, huku mbadala wa kawaida wa mapokeo ukitajwa katika tanbihi.
- issue: Uwasilishaji wa בני אדם
  choice: wanadamu
  alternative: wana wa mwanadamu
  rationale: Katika nahau hii wingi wa kiume una nguvu ya uwakilishi kwa binadamu wote. “Wanadamu” huepuka kuashiria wanaume pekee bila kupoteza maana ya asili; umbo halisi limetolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo wa himizo na urudiaji wa “kwa ajili ya” huhifadhi kiitikio na uwiano wa mstari.
