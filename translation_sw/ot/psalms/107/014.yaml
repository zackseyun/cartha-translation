  text: יֽ֭וֹצִיאֵ/ם מֵ/חֹ֣שֶׁךְ וְ/צַלְמָ֑וֶת וּ/מוֹסְר֖וֹתֵי/הֶ֣ם יְנַתֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/014.yaml
  text: He brought them out from darkness and the shadow of death[b][a], and he tore apart their bonds.
translation:
  language: sw
  text: Aliwatoa katika giza na uvuli wa mauti[a], akavivunja vifungo vyao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “giza nene.” Neno la Kiebrania linaweza kumaanisha uvuli wa mauti au giza kubwa sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹצִיאֵם
  choice: Aliwatoa
  rationale: Hifili ya יצא humaanisha kusababisha watoke au kuwatoa. Wakati uliopita unafaa katika simulizi hili la matendo ya Mungu.
- source_word: מֵחֹשֶׁךְ
  choice: gizani
  rationale: חֹשֶׁךְ ni giza; muundo wa Kiswahili 'kuwatoa gizani' unaonyesha kwa kawaida maana ya kihusishi מִן.
- source_word: וְצַלְמָוֶת
  choice: na katika uvuli wa mauti
  rationale: צַלְמָוֶת inaweza kueleweka kuwa 'uvuli wa mauti' au 'giza nene.' Tafsiri ya kwanza inahifadhi taswira ya hatari ya kifo, huku maana nyingine ikitolewa katika tanbihi.
- source_word: וּמוֹסְרוֹתֵיהֶם
  choice: vifungo vyao
  rationale: מוֹסְרוֹת humaanisha vifungo au pingu. 'Vifungo' huenda vizuri na kitenzi cha kuviondoa kwa nguvu bila kudhania kwamba lazima vilikuwa minyororo ya chuma.
- source_word: יְנַתֵּק
  choice: akavikata
  rationale: Pieli ya נתק huonyesha kutenganisha, kukata, au kuvunja kwa nguvu. 'Akavikata' ni usemi wa kawaida na wenye nguvu katika Kiswahili kwa kuviondoa vifungo.
theological_decisions:
- issue: Maana ya צַלְמָוֶת
  choice: uvuli wa mauti
  alternative: giza nene
  rationale: Neno hilo linaweza kuashiria hatari ya kifo au giza kubwa sana. Matini kuu inahifadhi taswira ya jadi inayowezekana, na tanbihi inalinda maana mbadala bila kuamua zaidi ya ushahidi wa Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kishairi; 'akavikata vifungo vyao' ni wa kawaida na unaonyesha ukombozi wa nguvu.
