  text: הֵ֣מָּה רָ֭אוּ מַעֲשֵׂ֣י יְהוָ֑ה וְ֝/נִפְלְאוֹתָ֗י/ו בִּ/מְצוּלָֽה׃׆
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/024.yaml
  text: They saw the works of Yahweh[a], and his wonders in the deep.
translation:
  language: sw
  text: Wao waliona matendo ya Yahweh na maajabu yake katika vilindi vya bahari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵמָּה
  choice: Wao
  rationale: Kiwakilishi huru cha nafsi ya tatu wingi kina msisitizo; “Wao” kinauhifadhi kwa Kiswahili cha kawaida.
- source_word: רָאוּ
  choice: waliona
  rationale: Qal timilifu, nafsi ya tatu wingi, inasimulia jambo walilolishuhudia mabaharia.
- source_word: מַעֲשֵׂי
  choice: matendo
  rationale: Nomino ya wingi katika hali ya muundo; “matendo” ni ya kawaida na inafaa kwa vitendo vikuu vya Mungu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa Tetragramatoni limewasilishwa kama jina binafsi, si kubadilishwa kuwa cheo.
- source_word: וְנִפְלְאוֹתָיו
  choice: na maajabu yake
  rationale: Huhifadhi nomino ya wingi yenye maana ya matendo ya kushangaza pamoja na kiambishi cha nafsi ya tatu umoja.
- source_word: בִּמְצוּלָה
  choice: katika vilindi vya bahari
  rationale: מְצוּלָה humaanisha kilindi au vilindi, hasa vya bahari; muktadha wa wasafiri wa baharini unaruhusu ufafanuzi huu wa asili bila kupoteza taswira.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; “Yahweh” hulihifadhi moja kwa moja badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kishairi; “vilindi vya bahari” huweka wazi mazingira ya mabaharia yanayoendelea katika muktadha.
