  text: Then they cried out to Yahweh in their trouble[a]; he saved them from their distresses.
translation:
  language: sw
  text: Ndipo wakamlilia Yahwe katika shida yao; akawaokoa kutoka katika dhiki zao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: Ndipo wakamlilia
  rationale: Kiunganishi cha mfululizo kinaendeleza simulizi na kibwagizo cha zaburi; “ndipo” huonyesha hatua inayofuata, na “wakamlilia” huwasilisha kilio cha haraka cha kuomba msaada.
- source_word: אֶל־יְהוָה
  choice: Yahwe
  rationale: Kitenzi “kumlilia” kwa kawaida huingiza anayeelekezewa kilio bila kuhitaji kihusishi tofauti. Jina la Mungu יהוה limetoholewa kuwa “Yahwe,” badala ya kubadilishwa na cheo.
- source_word: בַּצַּר לָהֶם
  choice: katika shida yao
  rationale: Muundo huu unaonyesha hali ya taabu iliyowapata; umoja wa Kiebrania umehifadhiwa kwa “shida,” huku לָהֶם ikitolewa kiasili kwa kimilikishi “yao.”
- source_word: מִמְּצֻקוֹתֵיהֶם
  choice: kutoka katika dhiki zao
  rationale: “Dhiki” huonyesha taabu kali na huhifadhi tofauti ya kileksika na צַר, iliyotafsiriwa “shida”; wingi wa chanzo umehifadhiwa.
- source_word: יוֹשִׁיעֵם
  choice: akawaokoa
  rationale: Hifili ya ישׁע hapa humaanisha kuwaokoa au kuwaponya kutoka hatarini; “akawaokoa” ni ya kawaida, fupi, na inadumisha maana ya ukombozi wa Mungu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha na cheo, bila kuingiza dai jingine la kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. “Ndipo” linafaa kwa kibwagizo cha usimulizi; “shida” na “dhiki” zinahifadhi tofauti ya maneno mawili ya Kiebrania.
