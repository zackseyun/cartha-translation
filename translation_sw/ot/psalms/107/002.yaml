base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/002.yaml
  text: Let the redeemed of Yahweh say so[a], whom he has redeemed from the hand of the foe,
translation:
  language: sw
  text: Waliokombolewa na Yahwe na waseme hivyo, ambao aliwakomboa kutoka mkononi mwa adui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtesi” au “mpinzani.” Neno la Kiebrania linaweza kumaanisha adui, mpinzani, au mwenye kukandamiza.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמְרוּ
  choice: na waseme hivyo
  rationale: Muundo huu una nguvu ya kuhimiza katika muktadha huu. “Na waseme hivyo” ni Kiswahili cha kawaida kinachowaagiza waliokombolewa watangaze jambo lililotangulia.
- source_word: גְּאוּלֵי
  choice: waliokombolewa
  rationale: Umbo hili linawataja watu ambao wamekombolewa. “Waliokombolewa” ni la kawaida na linahifadhi maana ya kuokolewa kutoka mamlaka au hali ya utumwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa namna ya kulitamka kama jina binafsi, badala ya kulibadilisha kuwa cheo.
- source_word: אֲשֶׁר גְּאָלָם
  choice: wale aliowakomboa
  rationale: Kifungu hiki kinawatambulisha zaidi waliokombolewa na kuhifadhi urudiaji wa mzizi גאל, ambao umetafsiriwa tena kwa “komboa.”
- source_word: מִיַּד
  choice: kutoka mkononi mwa
  rationale: Tafsiri hii inahifadhi sitiari ya Kiebrania ya “mkono” kama mamlaka au udhibiti, huku ikiwa inaeleweka kwa Kiswahili.
- source_word: צָר
  choice: adui
  rationale: Katika muktadha huu nomino hii inamrejelea mpinzani au mtesi, si dhiki isiyo na nafsi. “Adui” ni wazi, ya kawaida, na inafaa katika ushairi.
theological_decisions:
- issue: Kutafsiri jina la Mungu YHWH
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina יהוה. “Yahwe” huhifadhi jina hilo la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya lugha ya ukombozi
  choice: waliokombolewa / aliowakomboa
  alternative: waliokombolewa kwa fidia / aliwaokoa
  rationale: Kutumia “komboa” mara zote mbili kunahifadhi urudiaji wa mzizi גאל na wazo pana la Mungu kuwaokoa watu wake bila kulifanya kuwa shughuli ya malipo pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mstari mrefu umetenganishwa kwa vistari ili kifungu elezi kisomeke kwa urahisi; sitiari ya “mkono” na urudiaji wa “komboa” zimehifadhiwa.
