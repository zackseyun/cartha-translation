  yaml_path: translation/ot/psalms/107/013.yaml
  text: Then they cried out to Yahweh in their trouble[a]; he saved them from their distresses.
translation:
  language: sw
  text: Ndipo wakamlilia Yahwe katika taabu yao; akawaokoa kutoka katika dhiki zao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “shida zao” au “hali zao za kusongwa.”'
    reason: Neno la Kiebrania מְצוּקוֹת linaweza kuonyesha dhiki, shida kali, au hali za kubanwa/kusongwa.
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: Ndipo wakamlilia
  rationale: Kitenzi זעק kinaonyesha kilio cha dhati cha kuomba msaada. “Wakamlilia” ni Kiswahili cha kawaida chenye uzito huo, na “ndipo” linaendeleza simulizi na mwitikio unaorudiwa katika zaburi hii.
- source_word: אֶל
  choice: -mlilia
  rationale: Maana ya kuelekeza kilio kwa mtu imejumuishwa kiasili katika muundo wa Kiswahili “kumlilia,” badala ya kutafsiri kihusishi אֶל kwa neno tofauti.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kuwa “Yahwe,” badala ya kubadilishwa na cheo.
- source_word: בַּצַּר לָהֶם
  choice: katika taabu yao
  rationale: צַר hapa ni hali ya taabu au dhiki. Umoja wa “taabu” unadumisha umoja wa maana ya pamoja katika Kiebrania, huku “yao” ikionyesha kuwa hali hiyo iliwapata wote.
- source_word: מִמְּצֻקוֹתֵיהֶם
  choice: kutoka katika dhiki zao
  rationale: Neno מְצוּקוֹת linamaanisha dhiki, hali za kusongwa, au shida kali. “Dhiki zao” ni la kawaida na lenye hadhi, nalo linadumisha wingi wa Kiebrania.
- source_word: יוֹשִׁיעֵם
  choice: akawaokoa
  rationale: Hifili ya ישׁע humaanisha kuokoa au kukomboa kutoka hatarini. “Akawaokoa” ni tafsiri ya moja kwa moja na ya kawaida katika muktadha huu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu, יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha na cheo, bila kuongeza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kishairi; “ndipo” hudumisha mwendo wa simulizi, huku tofauti kati ya “taabu yao” (umoja wa pamoja) na “dhiki zao” (wingi) ikihifadhiwa.
