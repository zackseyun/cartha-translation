  text: וַ/יִּצְעֲק֣וּ אֶל יְ֭הוָה בַּ/צַּ֣ר לָ/הֶ֑ם וּֽ֝/מִ/מְּצֽוּקֹתֵי/הֶ֗ם יוֹצִיאֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/028.yaml
  text: Then they cried out to Yahweh in their trouble[a], and he brought them out of their distresses.
translation:
  language: sw
  text: Ndipo wakamlilia Yahweh katika taabu yao, naye akawatoa katika dhiki zao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika shida zao.”
    reason: Neno la Kiebrania מְצוּקוֹת linaweza kueleza dhiki, mashinikizo, au shida nyingi.
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: Ndipo wakamlilia
  rationale: Kitenzi צעק kinaonyesha kilio cha haraka cha kuomba msaada; “ndipo” linaendeleza mfuatano wa simulizi unaorudiwa katika Zaburi 107.
- source_word: אֶל יְהוָה
  choice: Yahweh
  rationale: Muundo “wakamlilia Yahweh” unaeleza kwa Kiswahili cha kawaida mwelekeo wa kilio chao kwa Yahweh, huku jina la Mungu יהוה likihifadhiwa kama jina binafsi.
- source_word: בַּצַּר לָהֶם
  choice: katika taabu yao
  rationale: צַר hapa ni hali ya kubanwa au kuwa taabuni; umoja wa Kiebrania umehifadhiwa kwa “taabu yao.”
- source_word: וּמִמְּצוּקוֹתֵיהֶם
  choice: katika dhiki zao
  rationale: מְצוּקוֹת ni wingi unaomaanisha hali za kubanwa, mashinikizo, au dhiki. “Dhiki zao” huhifadhi wingi na uzito wa neno, na “katika” hukamilisha kwa kawaida kitenzi “akawatoa.”
- source_word: יוֹצִיאֵם
  choice: akawatoa
  rationale: Hifili ya יצא humaanisha kusababisha watoke au kuwatoa; tafsiri hii huhifadhi taswira halisi badala ya kuibadili moja kwa moja kuwa “akawaokoa.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni יהוה. “Yahweh” huhifadhi jina hilo la agano badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha na inayoeleweka kwa urahisi. Tofauti ya umoja katika “taabu yao” na wingi katika “dhiki zao” imehifadhiwa.
