  text: There he settled the hungry[a], and they established a city to live in.
translation:
  language: sw
  text: Huko akawakalisha wenye njaa, nao wakaanzisha mji wa makazi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹשֶׁב
  choice: akawakalisha
  rationale: Hifili ya ישׁב ina maana ya kusababisha watu wakae au kuwapa mahali pa kuishi. “Akawakalisha” huhifadhi maana hiyo ya kisababishi kwa Kiswahili cha kawaida.
- source_word: שָׁם
  choice: humo
  rationale: Kielezi hiki kinaonyesha mahali palipotajwa katika muktadha. “Humo” kinaunganisha tendo hilo kwa ufasaha na mahali hapo.
- source_word: רְעֵבִים
  choice: wenye njaa
  rationale: Kivumishi hiki kimetumiwa kama nomino kuwarejelea watu wenye njaa. “Wenye njaa” ni usemi wa kawaida, wazi, na wa heshima.
- source_word: וַיְכוֹנְנוּ
  choice: wakaanzisha
  rationale: Katika muktadha wa mji, כון hapa hueleza kuuweka au kuufanya uwe imara kama makazi. “Wakaanzisha” linafaa kwa mji bila kudai moja kwa moja kwamba walijenga kila kitu.
- source_word: עִיר
  choice: mji
  rationale: Hii ndiyo maana ya kawaida ya עִיר na ndiyo istilahi ya kawaida katika Kiswahili cha Biblia.
- source_word: מוֹשָׁב
  choice: wa kuishi
  rationale: מוֹשָׁב humaanisha makao, makazi, au mahali pa kukaa. “Mji wa kuishi” ni usemi wa asili unaowasilisha kusudi la mji huo; tafsiri rasmi zaidi imewekwa katika tanbihi.
theological_decisions:
- issue: Kiima kisichotajwa wazi cha וַיּוֹשֶׁב
  choice: Kiima kimeonyeshwa kwa umbo la umoja “aka-,” kikimrejelea Mungu kutokana na muktadha.
  alternative: Kutumia kiima kisichobainishwa, kama “mtu akawakalisha.”
  rationale: Muktadha wa zaburi unaendelea kusimulia matendo ya BWANA. Hata hivyo, kwa kuwa jina la Mungu halipo wazi katika mstari huu, tafsiri haijaliongeza bali imehifadhi mtindo wa kitenzi chenye kiima kinachoeleweka kutokana na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa urahisi. Muundo wa masimulizi wenye “aka-/waka-” umehifadhi mwendelezo wa matendo katika Kiebrania.
