  text: וַ/יֹּ֗אמֶר וַֽ֭/יַּעֲמֵד ר֣וּחַ סְעָרָ֑ה וַ/תְּרוֹמֵ֥ם גַּלָּֽי/ו׃׆
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/025.yaml
  text: For he spoke and raised up a storm wind[a], and it lifted up its waves.
translation:
  language: sw
  text: Kwa maana alisema, akainua upepo wa dhoruba[a], nao ukayainua mawimbi ya bahari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaifanya upepo wa dhoruba utokee.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: alisema
  rationale: Kitenzi אמר kwa kawaida humaanisha ‘kusema.’ ‘Alisema’ huhifadhi maana ya kawaida na kuonyesha kwamba dhoruba ilitokea kwa neno la Mungu, bila kuongeza wazo la amri ambalo halijaelezwa moja kwa moja.
- source_word: וַיַּעֲמֵד
  choice: akaifanya ... ivume
  rationale: Hifili ya עמד ina maana ya kisababishi, yaani kuifanya pepo ya dhoruba ianze au isimame. Katika Kiswahili cha kawaida, ‘akaifanya ... ivume’ hutoa picha ya pepo kuanza kufanya kazi kwa nguvu, ingawa ‘akaifanya ... itokee’ ni mbadala wa karibu zaidi kimuundo.
- source_word: רוּחַ סְעָרָה
  choice: pepo ya dhoruba
  rationale: Kirai hiki hutaja upepo wenye tabia ya tufani. ‘Pepo ya dhoruba’ ni ya asili, wazi, na yenye nguvu katika Kiswahili, huku ikihifadhi neno linalomaanisha upepo.
- source_word: וַתְּרוֹמֵם
  choice: nayo ikayainua
  rationale: Kitenzi cha umoja wa kike hurejelea רוּחַ, hivyo pepo ndiyo inayoinua mawimbi. ‘Ikayainua’ huhifadhi uhusiano huo wa kisarufi na picha ya mawimbi kupandishwa juu.
- source_word: גַּלָּיו
  choice: mawimbi ya bahari
  rationale: Kiambishi cha nafsi ya tatu umoja wa kiume kwa kawaida hurejelea bahari inayodokezwa na muktadha. ‘Mawimbi ya bahari’ ni wazi na ya kawaida zaidi katika Kiswahili kuliko ‘mawimbi yake,’ ambako rejeleo lingeweza kuwa tata.
theological_decisions:
- issue: Mtendaji wa kimungu aliyedokezwa
  choice: Kitenzi kimetafsiriwa kwa nafsi ya tatu, ‘alisema,’ kikimrejelea Mungu katika muktadha wa karibu.
  alternative: Muundo usio na mtendaji maalumu, kama ‘ikasemwa,’ ungeweza kuficha mtendaji, lakini hauungwi mkono na muundo wa kitenzi cha Kiebrania.
  rationale: Mstari unaendeleza simulizi la tendo la BWANA juu ya bahari. Kumwacha mtendaji kama ‘yeye’ aliyedokezwa katika kitenzi cha Kiswahili huhifadhi mtiririko huo bila kuongeza dai la kitheolojia lisilokuwamo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kwa maana’ huunganisha mstari huu na sababu iliyo katika muktadha; ‘nayo’ huweka wazi kwamba pepo ndiyo iliyoinua mawimbi.
