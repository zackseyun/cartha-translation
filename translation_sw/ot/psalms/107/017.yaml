  text: אֱ֭וִלִים מִ/דֶּ֣רֶךְ פִּשְׁעָ֑/ם וּֽ֝/מֵ/עֲוֺֽנֹתֵי/הֶ֗ם יִתְעַנּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/017.yaml
  text: Fools[a], because of the way of their transgression and because of their iniquities[c][b], were afflicted.
translation:
  language: sw
  text: Wapumbavu[a], kwa sababu ya njia yao ya uasi na kwa sababu ya maovu yao[b], waliteseka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Wapumbavu” hapa ni watu wapumbavu kimaadili, si watu wenye uwezo mdogo wa kufikiri tu.
    reason: lexical_clarification
  - marker: b
    text: Au “hatia zao” au “dhambi zao.” Neno la Kiebrania linaweza kutaja maovu, hatia, au matokeo ya hatia.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִלִים
  choice: Wapumbavu
  rationale: Neno hili linawataja watu wapumbavu kimaadili, si watu wenye upungufu wa akili tu. “Wapumbavu” linahifadhi kundi hilo la kimaadili linalotumiwa katika fasihi ya hekima.
- source_word: מִדֶּרֶךְ
  choice: kwa sababu ya njia yao ya
  rationale: Kihusishi מִן kinaeleweka hapa kuwa cha sababu. “Njia” limehifadhiwa kwa kuwa דֶּרֶךְ linaweza kumaanisha mwenendo au namna ya maisha, huku taswira ya njia ikiendelea kuwapo.
- source_word: פִּשְׁעָם
  choice: uasi
  rationale: פֶּשַׁע mara nyingi humaanisha uasi au kuvunja mamlaka halali. “Uasi” ni la kawaida na lenye uzito wa kimaadili katika Kiswahili, bila kupunguza maana kuwa kosa la kawaida tu.
- source_word: וּמֵעֲוֺנֹתֵיהֶם
  choice: na kwa sababu ya maovu yao
  rationale: Kihusishi cha pili pia kimetafsiriwa kwa maana ya sababu. עָוֹן linaweza kumaanisha uovu, hatia, au matokeo ya hatia; “maovu yao” linaeleza matendo yao yenye hatia na kulitofautisha kwa kiasi na “uasi.”
- source_word: יִתְעַנּוּ
  choice: waliteseka
  rationale: Kitenzi katika Hitpael kinaonyesha kupatwa na mateso au kunyenyekezwa kwa dhiki. “Waliteseka” ni Kiswahili cha kawaida na hakiongezi wazi mtendaji wa nje ambaye Kiebrania hakumtaji.
theological_decisions:
- issue: Uhusiano wa kisababu kati ya dhambi na mateso
  choice: Mstari unasema kwamba watu hawa waliteseka kwa sababu ya mwenendo wao wa uasi na maovu yao.
  alternative: Vihusishi vinaweza kutafsiriwa kwa namna rasmi zaidi kuwa “kutokana na,” bila kusisitiza sababu moja kwa moja.
  rationale: Katika muktadha huu wa kishairi, matumizi yote mawili ya מִן yanaelekea kuonyesha sababu. Tafsiri inadumisha mantiki hiyo ya mstari, lakini haiipanui kuwa fundisho kwamba mateso yote husababishwa na dhambi binafsi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhi “njia” kama taswira ya mwenendo wa maisha; kurudiwa kwa “kwa sababu ya” kunaakisi vifungu viwili tofauti vya Kiebrania na kuweka uhusiano wa sababu wazi.
