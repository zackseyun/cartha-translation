  yaml_path: translation/ot/psalms/107/022.yaml
  text: Let them offer sacrifices of thanksgiving[b][a], and recount his works with joyful singing.
translation:
  language: sw
  text: Watoe dhabihu za shukrani[a], na wasimulie matendo yake kwa shangwe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhabihu za kushukuru.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa nyimbo za furaha,” au “kwa kelele za furaha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִזְבְּחוּ
  choice: Watoe
  rationale: 'Kauli hii katika muktadha ni himizo: “watoe.” Kitenzi hiki ni cha asili katika Kiswahili kwa kutoa dhabihu na kinahifadhi maana ya ibada ya neno la Kiebrania.'
- source_word: זִבְחֵי תוֹדָה
  choice: dhabihu za shukrani
  rationale: Muundo huu unaeleza dhabihu zinazotolewa kwa shukrani. Tafsiri hii ni wazi, ya kawaida, na haipanui תוֹדָה kuwa sifa kwa ujumla.
- source_word: וִיסַפְּרוּ
  choice: na wasimulie
  rationale: Katika piel, ספר humaanisha kueleza au kusimulia matendo. “Wasimulie” hudokeza kuyatangaza kwa kuyahadithia, si kuyataja tu.
- source_word: מַעֲשָׂיו
  choice: matendo yake
  rationale: Neno hili linarejelea matendo au kazi zake. “Matendo yake” ni Kiswahili cha kawaida na linafaa kwa matendo makuu ya Mungu katika Zaburi.
- source_word: בְּרִנָּה
  choice: kwa shangwe
  rationale: רִנָּה huonyesha sauti kuu ya furaha, ambayo inaweza kuwa kilio au wimbo. “Kwa shangwe” huhifadhi wazo kuu la furaha bila kulazimisha kwamba ilikuwa kuimba pekee.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa himizo “Watoe ... na wasimulie” unafuata usambamba wa kishairi wa Kiebrania. Tanbihi ya mwisho inadumisha upana wa maana ya רִנָּה kati ya shangwe, uimbaji, na kilio cha furaha.
