  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: sw
  text: Mshukuruni Yahweh[a], kwa kuwa yeye ni mwema, kwa maana upendo wake wa kudumu[b] hudumu milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina la Kiebrania יהוה (YHWH); katika tafsiri nyingi huandikwa “BWANA.”
    reason: alternative_reading
  - marker: b
    text: Au, “uaminifu wake wa agano.” Neno la Kiebrania חֶסֶד linajumuisha wazo la upendo wenye ushikamanifu na uaminifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹדוּ
  choice: Mshukuruni
  rationale: Kitenzi hiki cha amri kwa wingi, katika muktadha wa zaburi, ni mwito wa kumtolea Mungu shukrani; “Mshukuruni” ni cha kawaida na huhifadhi wingi wa amri.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Kihusishi ל־ kinaonyesha anayeelekezewa shukrani, naye jina la Mungu יהוה limetoholewa kuwa “Yahwe” ili kuhifadhi jina la agano katika matini.
- source_word: כִּי טוֹב
  choice: kwa kuwa yeye ni mwema
  rationale: כִּי inaeleza sababu ya mwito, na טוֹב ina maana pana ya wema wa Mungu; “mwema” haiibani kuwa ukarimu au fadhili pekee.
- source_word: לְעוֹלָם
  choice: hudumu milele
  rationale: Kirai hiki kinaonyesha kudumu bila mwisho. Kitenzi “hudumu” kimewekwa wazi kwa Kiswahili cha kawaida ingawa kimeachwa kidokezwe katika Kiebrania.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד huunganisha upendo, uaminifu, rehema na ushikamanifu wa agano. “Upendo wake thabiti” huhifadhi kwa upana wazo la upendo usiolegea bila kulibana kuwa hisia au wajibu wa kisheria pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania inatumia jina la Mungu moja kwa moja. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, huku tanbihi ikisaidia wasomaji wanaofahamu desturi ya “BWANA.”
- issue: Jinsi ya kutafsiri חֶסֶד
  choice: upendo wake thabiti
  alternative: uaminifu wake wa agano; rehema zake; fadhili zake
  rationale: 'Neno hili lina maana mbalimbali zinazogusana: upendo, uaminifu, rehema na ushikamanifu. Chaguo hili huhifadhi mvutano huo wa kitheolojia bila kuamua kwamba neno lina maana moja tu.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sababu mbili unaofuata כִּי mara mbili umehifadhiwa kwa “kwa kuwa ... kwa maana ...”; sentensi bado ni nyepesi na inafaa kwa usomaji wa ibada.
