source:
  edition: WLC
  text: יִרְא֣וּ יְשָׁרִ֣ים וְ/יִשְׂמָ֑חוּ וְ/כָל עַ֝וְלָ֗ה קָ֣פְצָה פִּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/042.yaml
  text: The upright see and rejoice[a], and all injustice shuts its mouth.
translation:
  language: sw
  text: Watu wanyoofu huona na hufurahi, na udhalimu wote hufunga kinywa chake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “udhalimu” ni nomino ya umoja wa kike, na “chake” pia ina kiambishi cha kike. Hivyo udhalimu unaonyeshwa kishairi kama mwenye kinywa anayenyamazishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאוּ
  choice: wataona
  rationale: Ni kitenzi cha Qal kisichotimilika, nafsi ya tatu wingi, kutoka ראה. Wakati ujao wa Kiswahili unaonyesha matokeo yanayotarajiwa katika muhtasari huu wa kishairi bila kuondoa maana ya jumla.
- source_word: יְשָׁרִים
  choice: wanyofu
  rationale: Kivumishi cha wingi kilichotumiwa kama nomino, kikimaanisha watu walio wima kimaadili. “Wanyofu” ni la kawaida na halichanganyi neno hili na neno tofauti la Kiebrania linalotafsiriwa mara nyingi “wenye haki.”
- source_word: וְיִשְׂמָחוּ
  choice: na kufurahi
  rationale: Ni Qal isiyotimilika, nafsi ya tatu wingi, kutoka שמח. Muundo “wataona na kufurahi” ni wa asili katika Kiswahili na unaendeleza nguvu ya shangwe ya kitenzi.
- source_word: וְכָל
  choice: na ... wote
  rationale: Kiunganishi ni cha kawaida, si cha waziwazi kuonyesha upinzani; “na” kinahifadhi muundo huo, huku “wote” kikieleza ujumla wa udhalimu.
- source_word: עַוְלָה
  choice: udhalimu
  rationale: Nomino hii humaanisha uovu, ukosefu wa haki, au udhalimu. “Udhalimu” huhifadhi dhana ya tendo au hali mbaya bila kuibadili kuwa watu dhalimu.
- source_word: קָפְצָה
  choice: utafumba
  rationale: Ni Qal timilifu, nafsi ya tatu umoja wa kike, kutoka קפץ, likiwa na maana ya kufunga katika nahau inayohusu kinywa. Katika muktadha wa kishairi, “utafumba” linaonyesha kunyamazishwa kwa udhalimu kwa namna ya asili.
- source_word: פִּיהָ
  choice: kinywa chake
  rationale: Kiambishi cha Kiebrania ni cha umoja wa kike na kinarejelea עַוְלָה. Kiswahili hutumia upatanisho wa ngeli wa “udhalimu”; “chake” kinadumisha taswira ya udhalimu uliotendewa kama mtu mwenye kinywa.
theological_decisions:
- issue: Udhalimu kupewa sifa za mtu
  choice: Kuitafsiri nomino dhahania kama “udhalimu” unaofumba kinywa chake.
  alternative: Kutafsiri kama “waovu” au “watu dhalimu” ili mhusika awe mtu waziwazi.
  rationale: Kiebrania kina nomino dhahania עַוְלָה, si nomino inayowataja watu. Taswira ya kishairi inaonyesha uovu wenyewe ukinyamazishwa; tafsiri hii haiingizi mhusika tofauti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. “Kufumba kinywa” ni nahau ya asili inayohifadhi taswira ya Kiebrania. Alama ya tanbihi imewekwa baada ya kishazi inachokifafanua.
