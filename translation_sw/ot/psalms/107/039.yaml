  text: Then they were diminished and brought low through oppression[a], calamity, and sorrow.
translation:
  language: sw
  text: Wakapungua na wakainama kwa sababu ya ukandamizaji, taabu, na huzuni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wakawa wachache na wakainama kwa sababu ya kuzuiwa, mabaya, na majonzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲטוּ
  choice: wakapungua
  rationale: Kitenzi מעט katika Qal kinaonyesha kupungua au kuwa wachache; “wakapungua” ni cha kawaida na kinahifadhi wazo la kupunguzwa kwa idadi au hali bila kulifafanua kupita kiasi.
- source_word: וַיָּשֹׁחוּ
  choice: kuinamishwa
  rationale: Kitenzi שחח/שׁחח humaanisha kuinama au kushushwa chini. “Kuinamishwa” kinadumisha taswira hiyo pamoja na maana ya kudhalilishwa au kulemewa.
- source_word: מֵעֹצֶר
  choice: kwa sababu ya ukandamizaji
  rationale: עֹצֶר inaweza kumaanisha kuzuiliwa, dhiki, au ukandamizaji; מִן hapa inaeleweka kwa maana ya kisababishi. Tafsiri hii inaeleza shinikizo linalowalemea bila kubana maana kwa “kifungo” pekee.
- source_word: רָעָה
  choice: taabu
  rationale: Katika muktadha huu רָעָה inaelekea kumaanisha mabaya yanayompata mtu, si uovu wa kimaadili. “Taabu” ni neno la kawaida linalofaa katika orodha ya mateso.
- source_word: וְיָגוֹן
  choice: na huzuni
  rationale: יָגוֹן humaanisha huzuni au majonzi; “huzuni” ni ya asili, wazi, na huhifadhi upande wa kihisia.
