base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/041.yaml
  text: But he sets the needy on high[a], away from affliction, and makes their families like a flock.
translation:
  language: sw
  text: Lakini humweka mhitaji mahali pa juu[a], mbali na taabu, na huzifanya familia zake ziwe kama kundi la kondoo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “humwinua maskini kutoka taabuni”; au, “huzifanya familia kuwa kama kundi la kondoo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׂגֵּב
  choice: humweka ... mahali pa juu
  rationale: Kitenzi שׂגב kinaonyesha kuinuliwa hadi mahali pa juu penye usalama; usemi huu unahifadhi maana za kuinuliwa na kulindwa.
- source_word: אֶבְיוֹן
  choice: mhitaji
  rationale: אֶבְיוֹן humaanisha mtu mwenye uhitaji au aliye maskini; “mhitaji” ni neno la kawaida na halifungi maana katika umaskini wa mali pekee.
- source_word: מֵעֹנִי
  choice: mbali na mateso
  rationale: עֹנִי yaweza kumaanisha mateso, taabu, au umaskini; “mbali na” huonyesha nguvu ya utengano ya kihusishi מִן.
- source_word: וַיָּשֶׂם
  choice: huyafanya ... kuwa
  rationale: שׂים ni kuweka au kufanya; pamoja na kifungu cha ulinganisho, “huyafanya ... kuwa” huwasilisha kwa kawaida matokeo yanayosababishwa.
- source_word: כַּצֹּאן
  choice: kama kundi la mifugo
  rationale: צֹאן ni nomino ya mkusanyiko inayorejelea hasa kondoo na mbuzi; “kundi la mifugo” huhifadhi picha ya kundi bila kuifunga kwa kondoo peke yao.
- source_word: מִשְׁפָּחוֹת
  choice: makundi ya jamaa zake
  rationale: Neno linaweza kumaanisha familia, jamaa pana, au koo. “Makundi ya jamaa zake” linaendana na picha ya kuongezeka kama kundi la mifugo, huku “zake” ikifafanua uhusiano unaodokezwa na muktadha.
theological_decisions:
- issue: Kuweka kimilikishi kinachodokezwa pamoja na “makundi ya jamaa”
  choice: makundi ya jamaa zake
  alternative: makundi ya jamaa / familia
  rationale: Kiebrania hakina kiambishi cha umilikishi hapa, lakini muktadha unaunganisha makundi hayo na mhitaji. “Zake” hufanya uhusiano huo uwe wazi katika Kiswahili bila kuongeza dai jipya la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umehifadhi picha ya kuinuliwa kwenda mahali pa usalama na ya jamaa kuongezeka kama kundi la mifugo; tanbihi inadumisha uwezekano wa uchanganuzi mwingine wa sintaksia.
