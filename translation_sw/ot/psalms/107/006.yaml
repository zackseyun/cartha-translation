  text: Then they cried out to Yahweh in their trouble[a]; he delivered them from their distresses.
translation:
  language: sw
  text: Ndipo wakamlilia Yahweh katika shida yao; akawaokoa na dhiki zao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “taabu zao” au “mashaka yao.” Wingi wa Kiebrania unasisitiza namna mbalimbali za dhiki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: Ndipo wakamlilia
  rationale: Kitenzi צעק kinaonyesha kilio cha dharura cha kuomba msaada; “wakamlilia” ni Kiswahili cha kawaida na chenye uzito. “Ndipo” linaonyesha mwendelezo wa simulizi unaoletwa na waw-consecutive.
- source_word: אֶל יְהוָה
  choice: Yahweh
  rationale: Kiambishi cha yambwa katika “wakamlilia” kinawasilisha mwelekeo wa אֶל kwa njia ya asili katika Kiswahili, huku jina la Mungu יהוה likihifadhiwa kama “Yahweh.”
- source_word: בַּצַּר לָהֶם
  choice: katika shida yao
  rationale: צַר hapa ni hali ya taabu au shida. Umoja wa Kiebrania umehifadhiwa katika “shida yao,” kwa lugha inayoeleweka kwa urahisi.
- source_word: מִמְּצוּקוֹתֵיהֶם
  choice: kutoka katika dhiki zao
  rationale: מְצוּקוֹת ni wingi unaomaanisha dhiki, mashinikizo, au hali nyingi za taabu. “Dhiki zao” huhifadhi wingi na nguvu zaidi kuliko “shida” iliyotangulia.
- source_word: יַצִּילֵם
  choice: akawaokoa
  rationale: Hifili ya נצל humaanisha kuokoa au kukomboa kutoka hatarini. “Akawaokoa” ni ya asili katika Kiswahili na inaendeleza mfuatano wa tukio lililosimuliwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה. “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tofauti kati ya “shida” ya umoja na “dhiki” za wingi imehifadhiwa ili kuakisi muundo na msisitizo wa Kiebrania.
