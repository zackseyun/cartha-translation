  text: They reel and stagger like a drunkard[a], and all their wisdom is swallowed up.
translation:
  language: sw
  text: Wanayumba na kutetemeka kama mlevi, na ustadi wao wote unamezwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hekima yao yote inamezwa.” Katika muktadha huu, neno hilo linaweza kumaanisha ujuzi wao wa vitendo au ustadi wa ubaharia unaposhindwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָח֣וֹגּוּ
  choice: Wanayumba
  rationale: Katika muktadha wa dhoruba, kitenzi kinaonyesha mwendo usio thabiti; “wanayumba” ni Kiswahili cha kawaida na chenye picha hai.
- source_word: וְיָנוּעוּ
  choice: na kupepesuka
  rationale: Kitenzi kina maana ya kuyumbayumba au kutikisika; “kupepesuka” kinahifadhi ulinganifu wa kishairi na kitenzi cha kwanza bila kukirudia kabisa.
- source_word: כַּשִּׁכּוֹר
  choice: kama mlevi
  rationale: Huhifadhi tashbihi ya mtu aliyelewa kwa lugha fupi na ya kawaida.
- source_word: וְכָל
  choice: na ... wote
  rationale: “Wote” linaonyesha ukamilifu wa ustadi wao kwa namna ya asili katika Kiswahili.
- source_word: חָכְמָתָם
  choice: ustadi wao
  rationale: Ingawa חָכְמָה mara nyingi ni “hekima,” hapa muktadha wa mabaharia katika dhoruba unaelekeza kwenye ujuzi wa vitendo; “ustadi” unadokeza utaalamu huo bila kuufanya kuwa “ujuzi wa ubaharia” pekee.
- source_word: תִּתְבַּלָּע
  choice: unamezwa
  rationale: Huhifadhi sitiari halisi ya kumezwa na kuonyesha kwamba uwezo wao wote unashindwa kabisa.
