base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/008.yaml
  text: Let them give thanks to Yahweh for his steadfast love[a], and for his wondrous deeds to the children of man.
translation:
  language: sw
  text: Wamshukuru Yahweh kwa ajili ya upendo wake thabiti, na kwa ajili ya matendo yake ya ajabu kwa wanadamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “kwa wana wa mwanadamu”; huu ni msemo wa Kiebrania unaomaanisha wanadamu kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Na wamshukuru
  rationale: Hifili ya ידה katika kiitikio hiki ina maana ya kutoa shukrani; umbo hili la Kiswahili linaendeleza mwito wa kishairi wa muktadha.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Kihusishi ל kinaonyesha anayeelekezewa shukrani, naye jina la agano יהוה limetoholewa kuwa “Yahweh.”
- source_word: חַסְדּוֹ
  choice: kwa ajili ya upendo wake thabiti
  rationale: חסד hubeba maana ya upendo mwaminifu na wa kudumu; “upendo wake thabiti” huhifadhi uzito huo kwa Kiswahili cha sasa.
- source_word: וְנִפְלְאוֹתָיו
  choice: na kwa ajili ya matendo yake ya ajabu
  rationale: נפלאות ni matendo yasiyo ya kawaida yenye kuamsha mshangao; kurudia “kwa ajili ya” kunafanya uhusiano na tendo la kushukuru uwe wazi na wa kawaida katika Kiswahili.
- source_word: לִבְנֵי אָדָם
  choice: kwa wanadamu
  rationale: Ingawa kwa umbo halisi ni “kwa wana wa Adamu/mwanadamu,” huu ni msemo wa kawaida wa Kiebrania unaorejelea jamii yote ya binadamu; “wanadamu” ni tafsiri ya asili na sahihi kwa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yanatumia jina maalumu la Mungu; “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Uwasilishaji wa בני אדם
  choice: wanadamu
  alternative: wana wa mwanadamu
  rationale: Kirai hicho ni nahau ya Kiebrania kwa binadamu kwa ujumla. Tafsiri kuu inatoa maana ya nahau, huku tanbihi ikihifadhi taswira ya maneno ya asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo “Na wamshukuru” unafaa kama kiitikio kinachotegemea muktadha wa zaburi.
