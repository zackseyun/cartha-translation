base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/009.yaml
  text: For he satisfies the thirsty soul[b][a], and he fills the hungry soul with good things.
translation:
  language: sw
  text: Kwa maana humtosheleza mtu mwenye kiu, na humjaza mema mtu mwenye njaa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huanzisha sababu ya mwito wa kumshukuru Mungu katika muktadha, na huhifadhi nguvu ya ufafanuzi ya kiunganishi hicho.
- source_word: הִשְׂבִּיעַ
  choice: humshibisha
  rationale: Hifili ya שבע humaanisha kusababisha ashibe au atosheke; wakati wa sasa unafaa kwa kauli ya kishairi inayoeleza tendo la Mungu kwa ujumla.
- source_word: נֶפֶשׁ
  choice: mtu
  rationale: Hapa נֶפֶשׁ humaanisha kiumbe au mtu mzima mwenye hitaji, si lazima sehemu isiyo ya kimwili; Kiswahili cha kawaida hutumia ‘mtu’ kwa maana hii kwa uwazi na uasilia.
- source_word: שֹׁקֵקָה
  choice: mwenye kiu
  rationale: Katika ulinganifu na ‘mwenye njaa,’ maana ya kiu au hamu kali inawasilishwa kwa picha halisi na ya kawaida.
- source_word: רְעֵבָה
  choice: mwenye njaa
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida, na hudumisha ulinganifu wa kishairi na ‘mwenye kiu.’
- source_word: מִלֵּא
  choice: humjaza
  rationale: Pieli ya מלא humaanisha kujaza; muundo huu unahifadhi picha ya mtu kujazwa na yale mema.
- source_word: טוֹב
  choice: mema
  rationale: Nomino/adjektiva hii iliyotumiwa kisubstantivu inaweza kumaanisha yaliyo mema au vitu vyema; ‘mema’ huhifadhi upeo huo bila kuufanya kuwa wa vitu vya kimwili pekee.
theological_decisions:
- issue: Maana ya kiantropolojia ya נֶפֶשׁ
  choice: Imetafsiriwa ‘mtu’ katika mishororo yote miwili.
  alternative: ‘nafsi,’ ‘maisha,’ au ‘kiumbe’
  rationale: Katika muktadha huu neno linamtaja mtu mzima akiwa na kiu au njaa. ‘Mtu’ huepuka kuingiza bila sababu wazo la mgawanyo wa mwili na sehemu isiyo ya kimwili, huku urudiaji wake ukihifadhi ulinganifu wa Kiebrania.
- issue: Maana ya טוֹב
  choice: ‘mema’
  alternative: ‘vitu vyema’ au ‘kilicho chema’
  rationale: ‘Mema’ linaweza kujumuisha riziki na wema wa Mungu kwa upana, hivyo huhifadhi kutobainishwa kwa nomino ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo una ulinganifu wa kishairi kati ya ‘mtu mwenye kiu’ na ‘mtu mwenye njaa,’ na unatumia msamiati rahisi kueleweka kwa wasomaji wa kawaida.
