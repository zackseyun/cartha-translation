base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/043.yaml
  text: Who is wise? Let him keep these things[c][b][a], and let them consider the steadfast love of Yahweh.
translation:
  language: sw
  text: Ni nani mwenye hekima? Ayazingatie mambo haya; nao[b] wayatafakari matendo ya upendo thabiti wa Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina neno la wingi linaloweza kueleweka kuwa “matendo ya upendo thabiti,” yaani maonyesho mengi ya upendo mwaminifu na rehema za Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hubadilika kutoka umoja (“nani mwenye hekima? ayazingatie”) kwenda wingi (“nao wayatafakari”). Badiliko hilo limehifadhiwa hapa.
    reason: source_ambiguity
lexical_decisions:
- source_word: מִי חָכָם
  choice: Ni nani mwenye hekima?
  rationale: Muundo wa swali la balagha katika fasihi ya hekima umehifadhiwa badala ya kulainishwa kuwa ‘yeyote mwenye hekima.’
- source_word: וְיִשְׁמָר אֵלֶּה
  choice: Ayazingatie mambo haya
  rationale: Kitenzi שמר hapa kinahimiza kuyatunza akilini na kuyatii kwa makini mambo yaliyosimuliwa katika zaburi; ‘ayazingatie’ ni Kiswahili cha kawaida kinachobeba wazo hilo bila kudokeza kuhifadhi vitu kimwili.
- source_word: וְיִתְבּוֹנְנוּ
  choice: nao wayatafakari
  rationale: Kitenzi hiki kinaonyesha kufikiri kwa makini ili kupata ufahamu. Umbo la wingi limehifadhiwa kwa ‘wa-’ na ‘nao,’ ingawa kifungu kilichotangulia ni cha umoja.
- source_word: חַסְדֵי
  choice: matendo ya upendo thabiti
  rationale: Nomino חסד iko katika wingi na hapa inaelekea kurejelea maonyesho mengi ya upendo mwaminifu na rehema za Mungu. ‘Matendo ya upendo thabiti’ huonyesha wingi huo kwa Kiswahili cha asili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama ‘BWANA.’
theological_decisions:
- issue: Maana ya wingi katika חַסְדֵי
  choice: matendo ya upendo thabiti
  alternative: upendo thabiti
  rationale: Wingi wa Kiebrania unaelekeza kwenye matendo au maonyesho mengi ya upendo mwaminifu wa Yahwe; tafsiri haubadili hayo kuwa sifa moja ya jumla tu.
- issue: Mabadiliko kutoka umoja kwenda wingi
  choice: Ni nani mwenye hekima? Ayazingatie…; nao wayatafakari…
  alternative: Wenye hekima wayazingatie… na kuyatafakari…
  rationale: Maandishi ya Kiebrania huanza na mtu mmoja wa kiume kwa kisarufi kisha hubadilika kwenda wingi. Tafsiri imehifadhi badiliko hilo badala ya kulisawazisha, huku tanbihi ikilieleza.
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina la agano יְהוָה, si cheo cha kawaida; kwa hiyo jina lenyewe limehifadhiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Ayazingatie’ na ‘wayatafakari’ hutofautisha uangalifu wa kwanza na tafakari yenye ufahamu katika kifungu cha pili. Alama za tanbihi zimewekwa baada ya kishazi kinachohusika.
