  text: כִּֽי שִׁ֭בַּר דַּלְת֣וֹת נְחֹ֑שֶׁת וּ/בְרִיחֵ֖י בַרְזֶ֣ל גִּדֵּֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/016.yaml
  text: For he shattered the doors of bronze and cut through the bars of iron[a].
translation:
  language: sw
  text: Kwa maana alivunja vipande-vipande milango ya shaba, akakata mapingo ya chuma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “malango ya shaba.” Neno la Kiebrania humaanisha hasa milango au mabawa ya mlango, ingawa katika muktadha huu huenda malango ya ngome yanakusudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya mwito uliotangulia wa kumshukuru Bwana, kwa Kiswahili cha kawaida na chenye mtiririko wa asili.
- source_word: שִׁבַּר
  choice: alivunja vipandevipande
  rationale: Kauli hii huonyesha kuvunjwa kwa nguvu na kabisa, si kuvunja kwa kiwango kidogo tu.
- source_word: דַּלְתוֹת
  choice: milango
  rationale: Nomino hiyo humaanisha milango au mabawa ya mlango. Katika muktadha huu milango ya ngome inaweza kuwa inakusudiwa, na 'milango' ni neno la kawaida linalobeba maana hiyo.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: Katika Kiswahili, 'shaba' ni tafsiri ya kawaida ya metali hii, ambayo katika muktadha wa Biblia mara nyingi ni shaba-ngumu (bronze) au aloi yenye msingi wa shaba.
- source_word: בְרִיחֵי
  choice: mapingo
  rationale: Hurejelea fito nzito za kufungia na kuimarisha milango; 'mapingo' linafaa kwa taswira hiyo kuliko 'makomeo,' ambayo yanaweza kudokeza vifaa vidogo.
- source_word: בַרְזֶל
  choice: chuma
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya jina la metali hiyo.
- source_word: גִּדֵּעַ
  choice: kukata
  rationale: Kitenzi humaanisha kukata kabisa au kukatilia mbali. 'Kukata' huhifadhi tendo lenye nguvu bila kuongeza njia ambayo tendo hilo lilifanywa.
theological_decisions:
- issue: Mtendaji wa vitendo vya kimungu
  choice: ali- (yeye)
  alternative: Bwana alivunja
  rationale: Vitenzi vya Kiebrania vina nafsi ya tatu umoja wa kiume bila kutaja mtendaji wazi katika mstari huu; muktadha unamrejelea Bwana. Kiambishi 'ali-' kinahifadhi mtiririko huo bila kuongeza jina lisilotajwa moja kwa moja hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. 'Mapingo' limetumiwa kwa fito za kufungia milango, na 'vipandevipande' kuonyesha nguvu ya kitenzi cha Kiebrania.
