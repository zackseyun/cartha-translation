source:
  edition: WLC
  text: רְעֵבִ֥ים גַּם צְמֵאִ֑ים נַ֝פְשָׁ֗/ם בָּ/הֶ֥ם תִּתְעַטָּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/005.yaml
  text: Hungry and thirsty[b][a], their soul fainted within them.
translation:
  language: sw
  text: 'Wakiwa na njaa na kiu,

    nafsi zao zilizimia ndani yao.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uhai wao ulizimia ndani yao,” au “wao wenyewe walidhoofika.” Neno la Kiebrania linaweza kumaanisha nafsi, uhai, au mtu mwenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְעֵבִים
  choice: wakiwa na njaa
  rationale: Ni usemi wa kawaida na wa moja kwa moja kwa kivumishi kinachomaanisha kuwa na njaa, bila kuongeza uzito wa maana kama ‘kufa njaa.’
- source_word: גַּם
  choice: na
  rationale: Hapa neno hili linaunganisha hali ya kuwa na njaa na ile ya kuwa na kiu. ‘Na’ ni ya asili katika Kiswahili; maana ya nyongeza inaeleweka katika muundo huu.
- source_word: צְמֵאִים
  choice: kiu
  rationale: Katika muundo ‘wakiwa na njaa na kiu,’ hili ndilo badiliko la kawaida la Kiswahili la hali ya kuwa na kiu.
- source_word: נַפְשָׁם
  choice: nafsi zao
  rationale: ‘Nafsi’ huhifadhi taswira ya Kiebrania na upana wa maana wa נֶפֶשׁ, ambao unaweza kumaanisha nafsi, uhai, au mtu mwenyewe.
- source_word: בָּהֶם
  choice: ndani yao
  rationale: Hutoa kwa kawaida wazo la hali inayotokea katika utu wao wa ndani.
- source_word: תִּתְעַטָּף
  choice: zilizimia
  rationale: Kitenzi kinaeleza kudhoofika au kuzimia kwa nguvu za ndani; ‘zilizimia’ kinafaa kwa njaa na kiu kali bila kufafanua kupita kiasi.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika muktadha huu
  choice: nafsi zao
  alternative: uhai wao; wao wenyewe
  rationale: Tafsiri kuu huhifadhi taswira na utata halisi wa Kiebrania, huku tanbihi ikionyesha maana nyingine zinazowezekana bila kuamua suala la kiantropolojia kidhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na lugha inayoeleweka. ‘Wakiwa na njaa na kiu’ ni ya asili kuliko kutafsiri גַּם kwa ‘pia’ hapa; tanbihi imewekwa baada ya sentensi na alama yake imo katika matini kuu.
