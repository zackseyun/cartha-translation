  text: וַ/יַּכְנַ֣ע בֶּ/עָמָ֣ל לִבָּ֑/ם כָּ֝שְׁל֗וּ וְ/אֵ֣ין עֹזֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/012.yaml
  text: So he humbled their heart with hard labor[a]; they stumbled[c][b], and there was no one to help.
translation:
  language: sw
  text: Basi akaunyenyekeza moyo wao[b] kwa kazi ngumu[a]; wakajikwaa[c], wala hapakuwa na mtu wa kuwasaidia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa taabu” au “kwa mateso”; neno la Kiebrania עָמָל linaweza kumaanisha kazi nzito, taabu, au mateso.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “moyo wao”; neno “moyo” liko katika umoja lakini limetumiwa kwa maana ya pamoja.
    reason: lexical_alternative
  - marker: c
    text: Au “wakaanguka”; kitenzi hiki kinaweza kumaanisha kujikwaa, kuyumba, au kuanguka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְנַע
  choice: akaunyenyekeza
  rationale: Hifili ya כנע ina maana ya kusababisha mtu ashushwe au anyenyekezwe. Kiambishi cha yambwa -u- kinaelekezwa kwa “moyo,” huku mtendaji asiyeatajwa wazi akieleweka kuwa Mungu kutokana na muktadha.
- source_word: בֶּעָמָל
  choice: kwa kazi ngumu
  rationale: עָמָל inaweza kumaanisha kazi nzito, taabu, au mateso. “Kwa kazi ngumu” linaonyesha njia iliyotumiwa kuwanyenyekeza katika muktadha wa kifungo, bila kuficha maana nyingine zinazowezekana.
- source_word: לִבָּם
  choice: moyo wao
  rationale: Neno la Kiebrania liko katika umoja likiwa na kiambishi cha wingi na limetumiwa kwa maana ya pamoja. “Moyo wao” linahifadhi umoja huo na maana ya utu wao wa ndani au ujasiri wao.
- source_word: כָּשְׁלוּ
  choice: wakajikwaa
  rationale: כשל huonyesha kujikwaa, kuyumba, au kuanguka. “Wakajikwaa” linadumisha taswira ya kitenzi bila kulazimisha kwamba walianguka kabisa.
- source_word: וְאֵין עֹזֵר
  choice: wala hapakuwa na mtu wa kuwasaidia
  rationale: Kauli hii inaonyesha kutokuwapo kabisa kwa msaidizi. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha nguvu ya muundo wa Kiebrania אֵין pamoja na kitenzi-jina.
theological_decisions:
- issue: Mtendaji asiyetajwa wazi wa וַיַּכְנַע
  choice: 'Mungu ndiye mtendaji anayeeleweka: “akaunyenyekeza”'
  alternative: Kauli isiyoonyesha mtendaji, kama “moyo wao ukanyenyekezwa”
  rationale: Muktadha wa zaburi unahusisha mateso, nidhamu, na ukombozi na matendo ya BWANA. Kitenzi cha nafsi ya tatu katika umoja kinadumishwa bila kuongeza jina la Mungu ambalo halipo wazi katika mstari huu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “moyo wao” umehifadhiwa kwa makusudi ili kuakisi umoja wa pamoja wa Kiebrania; tanbihi inaeleza matumizi hayo. Kiunganishi “Basi” kinaendeleza matokeo ya uasi uliotajwa katika muktadha.
