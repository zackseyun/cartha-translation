base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/040.yaml
  text: He pours contempt on nobles and makes them wander in a trackless waste[a][b].
translation:
  language: sw
  text: Humwaga dharau juu ya wakuu[a], na kuwafanya watange katika ukiwa usio na njia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa vyeo” au “wakuu wa kifalme.” Neno la Kiebrania נְדִיבִים linaweza kumaanisha wakuu, watu wa vyeo, au viongozi mashuhuri.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “katika ukiwa, hakuna njia”—yaani, mahali pa ukiwa pasipo na njia ya kupita.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפֵךְ
  choice: Humwaga
  rationale: Kitenzi cha Kiebrania kina maana ya ‘kumwaga.’ Wakati wa sasa unafaa kwa maelezo ya jumla kuhusu matendo ya Mungu na unahifadhi tamathali hai ya kumwaga dharau.
- source_word: בּוּז
  choice: dharau
  rationale: Neno hili humaanisha dharau au fedheha. ‘Dharau’ ni la kawaida na lenye hadhi katika Kiswahili, na linaendana kwa asili na kitenzi ‘humwaga.’
- source_word: נְדִיבִים
  choice: wakuu
  rationale: Katika muktadha huu neno linarejelea watu wenye cheo na mamlaka. ‘Wakuu’ ni pana na la kawaida kuliko ‘wana wa kifalme,’ bila kulifungia neno kwenye cheo kimoja maalumu.
- source_word: וַיַּתְעֵם
  choice: kuwafanya watange
  rationale: Hifili ya תעה ina maana ya kusababisha mtu kutanga au kupotea. Tafsiri hii inadumisha picha ya kutangatanga kimwili katika eneo lisilo na njia.
- source_word: בְּתֹהוּ
  choice: katika ukiwa
  rationale: תֹהוּ inaweza kumaanisha ukiwa, utupu, au hali isiyo na umbo. Hapa inaonyesha eneo tupu na lisilokalika, hivyo ‘ukiwa’ linafaa kimuktadha na kishairi.
- source_word: לֹא דָרֶךְ
  choice: usio na njia
  rationale: Hii inafuata kwa karibu usemi halisi ‘hakuna njia,’ huku ikitoa Kiswahili cha kawaida na kuhifadhi picha ya mahali pasipo na njia ya kupita.
theological_decisions:
- issue: Kiima kisichotajwa wazi
  choice: Kiima kimeonyeshwa kwa umbo la kitenzi ‘Humwaga,’ kikirejelea Mungu.
  alternative: Kiima kisicho cha mtu maalumu au cha jumla
  rationale: Muktadha wa Zaburi 107 unahusisha mabadiliko haya na matendo ya BWANA. Kiswahili kinaweza kuacha kiwakilishi huru kwa sababu kiima cha nafsi ya tatu kimo ndani ya kitenzi, bila kuondoa rejeo la Mungu katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unabaki wa kishairi lakini unaeleweka kwa msomaji wa kawaida; ‘Humwaga dharau’ huhifadhi tamathali ya Kiebrania, na ‘ukiwa usio na njia’ huhifadhi hali ya mahali pamoja na ukosefu wa njia.
