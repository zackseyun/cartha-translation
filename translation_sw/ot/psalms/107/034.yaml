  text: a fruitful land into a salt waste[a], because of the evil of those who dwell in it.
translation:
  language: sw
  text: nchi yenye kuzaa matunda akaifanya kuwa nchi ya chumvi[a], kwa sababu ya uovu wa wakaaji wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hali ya chumvi” au “nchi yenye chumvi”; taswira ya Kiebrania huenda inadokeza eneo tasa lisilozaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ פְּרִי
  choice: nchi yenye kuzaa matunda
  rationale: Muundo huu unaeleza nchi inayotoa mazao kwa wingi. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha taswira ya kilimo.
- source_word: לִמְלֵחָה
  choice: kuwa jangwa la chumvi
  rationale: Kiambishi ל־ kinaonyesha matokeo ya mabadiliko, na מְלֵחָה hueleza hali ya chumvi inayodokeza eneo tasa lisilozaa. 'Jangwa la chumvi' linahifadhi taswira halisi pamoja na wazo la ukiwa.
- source_word: מֵרָעַת
  choice: kwa sababu ya uovu wa
  rationale: מִן hapa linaonyesha sababu, huku רָעָה likimaanisha uovu au ubaya wa kimaadili.
- source_word: יֹשְׁבֵי בָהּ
  choice: wakaaji wake
  rationale: Kauli hii inawataja wale wanaokaa katika nchi hiyo. 'Wakaaji wake' ni fupi, ya asili, na hudumisha uhusiano wao na nchi.
theological_decisions:
- issue: Sababu ya nchi kuwa ukiwa
  choice: Mabadiliko ya nchi yenye kuzaa kuwa jangwa la chumvi yanahusishwa wazi na uovu wa wakaaji wake.
  alternative: Kuyachukulia mabadiliko hayo kuwa tukio la kimazingira au kihistoria lisilohusiana na maadili.
  rationale: Kiebrania מֵרָעַת יֹשְׁבֵי בָהּ kinaonyesha wazi uhusiano wa kisababishi kati ya uovu wa wakaaji na kuharibika kwa nchi; tafsiri haipaswi kuupunguza.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. 'Jangwa la chumvi' linatumika kuhifadhi taswira ya chumvi na maana ya utasa; alama [a] imewekwa katika matini.
