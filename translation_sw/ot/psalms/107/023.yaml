  yaml_path: translation/ot/psalms/107/023.yaml
  text: Those who go down to the sea in ships[a], doing business on great waters—
translation:
  language: sw
  text: 'Wale washukao baharini kwa meli,

    wakifanya kazi juu ya maji mengi—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹרְדֵי
  choice: wale washukao
  rationale: Kirai cha Kiebrania ni kitenzi-jina cha wingi kinachoeleza kundi la watu; “wale washukao” kinahifadhi picha ya kushuka kuelekea baharini kwa lugha ya kishairi.
- source_word: הַיָּם
  choice: baharini
  rationale: Nomino yenye kiambishi bainishi humaanisha bahari kwa ujumla hapa; umbo la mahali “baharini” linaungana kwa kawaida na kitenzi “kushuka.”
- source_word: בָּאֳנִיּוֹת
  choice: kwa meli
  rationale: Kihusishi ב pamoja na “meli” huonyesha njia au chombo cha safari. “Kwa meli” ni Kiswahili cha kawaida kwa kusafiri baharini bila kuongeza maana isiyokuwapo.
- source_word: עֹשֵׂי מְלָאכָה
  choice: wakifanya kazi
  rationale: Kirai hiki kina maana pana ya kufanya kazi au shughuli. Tafsiri hii haikibani kuwa biashara pekee, ingawa biashara ya baharini inaweza kuwa sehemu ya maana katika muktadha.
- source_word: בְּמַיִם רַבִּים
  choice: katika maji makuu
  rationale: Tafsiri hii inadumisha taswira ya kishairi ya Kiebrania ya “maji makubwa/mengi,” yaani bahari kuu au wazi, bila kuibadili kuwa ufafanuzi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi inayofaa Zaburi lakini kinachoeleweka kwa msomaji wa kawaida. “Washukao” limechaguliwa badala ya “wanaoshuka” ili kudumisha urari na ufupi wa ushairi; “wakifanya kazi” huhifadhi upana wa מְלָאכָה na kuepuka kuamua bila lazima kwamba shughuli hiyo ilikuwa biashara tu.
