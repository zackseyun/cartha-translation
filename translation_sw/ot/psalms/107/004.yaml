lexical_decisions:
- source_word: תָּעוּ
  choice: Walitangatanga
  rationale: Kitenzi תעה kinaweza kumaanisha kutangatanga au kupotea. Hapa “walitangatanga” huonyesha mwendo usio na mwelekeo bila kuingiza wazo la kosa la kimaadili.
- source_word: בַמִּדְבָּר
  choice: jangwani
  rationale: מִדְבָּר ni eneo lisilokaliwa, mara nyingi jangwa au nyika. “Jangwani” ni neno la kawaida na linaloeleweka katika muktadha huu.
- source_word: בִּישִׁימוֹן דָּרֶךְ
  choice: katika njia ya nyika
  rationale: יְשִׁימוֹן hueleza mahali pakavu na ukiwa, na דֶּרֶךְ ni njia. Kauli “njia ya nyika” ni ya asili katika Kiswahili na inadumisha mshikamano wa kishairi wa maneno hayo bila kufafanua kupita kiasi uhusiano wao wa kisintaksia.
- source_word: עִיר מוֹשָׁב
  choice: mji wa kukaa
  rationale: Muungano huu hueleza mji unaofaa kukaliwa au mahali pa makazi. “Mji wa kukaa” hudumisha muundo na maana ya Kiebrania kwa lugha rahisi.
- source_word: לֹא מָצָאוּ
  choice: hawakupata
  rationale: Kauli hii inaeleza moja kwa moja kwamba hawakufanikiwa kupata walichokitafuta; “hawakupata” ni Kiswahili cha kawaida na kifupi.
