base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/021.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: sw
  text: 'Na wamshukuru Yahweh kwa ajili ya upendo wake thabiti,

    na kwa ajili ya matendo yake ya ajabu kwa wanadamu.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kwa wana wa watu”; ni usemi wa jumla unaomaanisha wanadamu wote.
    reason: lexical_alternative
  - marker: b
    text: Au, “na kwa ajili ya maajabu yake” au “na matendo yake ya kustaajabisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Na wamshukuru
  rationale: Hifili ya ידה katika kibwagizo hiki inaonyesha mwitikio wa shukrani kwa ukombozi; muundo wa Kiswahili wa kutakia au kuhimiza, “na wamshukuru,” unawakilisha יקטל yenye maana ya kihimizo.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Kiambishi ל humtambulisha anayeelekezewa shukrani; jina la agano יהוה limetoholewa kuwa “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חסד hapa ni upendo mwaminifu na wa kudumu unaoonekana katika matendo; “upendo thabiti” huhifadhi wazo la upendo pamoja na uimara wake.
- source_word: וְנִפְלְאוֹתָיו
  choice: na kwa ajili ya matendo yake ya ajabu
  rationale: נפלאות ni matendo yasiyo ya kawaida yanayoamsha mshangao; “matendo yake ya ajabu” ni Kiswahili cha kawaida na huonyesha kuwa yanayokusudiwa ni matendo halisi.
- source_word: לִבְנֵי אָדָם
  choice: kwa wanadamu
  rationale: Nahau ya Kiebrania, kihalisi “kwa wana wa Adamu/mwanadamu,” ina maana ya jumla ya watu wote. “Wanadamu” ni ya asili katika Kiswahili na huhifadhi maana hiyo bila kuifanya ihusu wanaume pekee.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina maalumu la Mungu, si cheo; “Yahweh” hulihifadhi kama jina la agano.
- issue: Maana ya חסד
  choice: upendo wake thabiti
  alternative: fadhili zake / rehema zake / upendo wake wa agano
  rationale: Chaguo hili huhifadhi upendo na uaminifu wa kudumu bila kuingiza kwa lazima neno “agano,” ambalo halipo wazi katika mstari.
- issue: Nahau בני אדם
  choice: wanadamu
  alternative: wana wa mwanadamu / watoto wa Adamu
  rationale: Kirai hiki ni usemi wa jumla kuhusu jamii ya binadamu. Kiswahili “wanadamu” kinawasilisha maana yake ya kijumla kwa uwazi huku tanbihi ikihifadhi umbo halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa “kwa ajili ya” huonyesha kwa uwazi sababu mbili za shukrani. Alama zote za tanbihi zimewekwa baada ya kirai kinachohusika.
