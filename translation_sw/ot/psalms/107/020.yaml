lexical_decisions:
- source_word: יִשְׁלַח
  choice: Alituma
  rationale: Kitenzi cha wakati usiotimilika katika ushairi huu kinasimulia tendo la Mungu lililopita; “alituma” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: דְּבָרוֹ
  choice: neno lake
  rationale: Huhifadhi usemi mfupi wa Kiebrania na wazo la neno la Mungu lenye kutenda, bila kulifafanua zaidi kuwa amri, ujumbe, au nafsi fulani.
- source_word: וְיִרְפָּאֵם
  choice: akawaponya
  rationale: רפא humaanisha kuponya; kiambishi cha yambwa kinawarejelea watu waliokuwa wakiteseka.
- source_word: וִימַלֵּט
  choice: akawaokoa
  rationale: Umbo la Piel la מלט lina maana ya kumwezesha mtu aponyoke au kumwokoa; “akawaokoa” ni la kawaida na linafaa katika muktadha wa hatari ya kifo.
- source_word: מִשְּׁחִיתוֹתָם
  choice: kutoka katika mashimo yao
  rationale: Nomino ya wingi inaweza kumaanisha mashimo, makaburi, au hali za uharibifu. “Mashimo yao” huhifadhi wingi na taswira ya kuokolewa kutoka hatari ya kifo, huku tanbihi ikihifadhi upana wa maana.
theological_decisions:
- issue: Uwezekano wa kulifasiri “neno lake” kwa maana ya kiteolojia isiyotajwa wazi
  choice: Kuhifadhi “neno lake” kama usemi wa Mungu wenye kutenda bila kutaja kwamba ni nafsi au rejeo la Kimasihi
  alternative: “amri yake” au kumtambulisha Neno kuwa nafsi
  rationale: Mstari unasema Mungu alituma neno lake ili kuponya na kuokoa. Tafsiri haipaswi kuingiza utambulisho wa Kikristo ambao haujaelezwa wazi katika mstari huu.
- issue: Upana wa maana ya מִשְּׁחִיתוֹתָם
  choice: “mashimo yao” katika maandishi, pamoja na tanbihi inayoonyesha maana nyingine
  alternative: “maangamizi yao” au “makaburi yao”
  rationale: Taswira ya mashimo inafaa katika muktadha wa kukaribia kifo, lakini neno la Kiebrania linaweza pia kuelekea kwenye makaburi au uharibifu; tanbihi inahifadhi utata huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mfuatano wa “alituma … akawaponya … akawaokoa” unaonyesha matendo yanayofuatana kwa mtiririko wa kawaida wa kisimulizi.
