  text: He sent his word and healed them[a], and delivered them from their pits.
translation:
  language: sw
  text: Alituma neno lake, akawaponya, akawaokoa kutoka katika mashimo yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maangamizi yao” au “makaburi yao.” Neno la Kiebrania linaweza kumaanisha mashimo, makaburi, au hali za uharibifu.
