  yaml_path: translation/ot/psalms/107/029.yaml
  text: He made the storm be still[c][b][a], and their waves were hushed.
translation:
  language: sw
  text: Aliifanya dhoruba itulie[a], na mawimbi yao[b] yakanyamaza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Aliigeuza dhoruba kuwa shwari.” Kiebrania hueleza kihalisi kusababisha dhoruba iingie katika hali ya utulivu au ukimya.
    reason: lexical_alternative
  - marker: b
    text: Au, “mawimbi yake,” ikiwa kiambishi kinaeleweka kurejelea bahari au maji badala ya watu waliokuwa chomboni.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקֵם
  choice: Aliifanya
  rationale: Hifili ya קום hapa ina maana ya kusababisha hali fulani itokee. “Aliifanya” huhifadhi maana hiyo ya kisababishi kwa Kiswahili cha kawaida.
- source_word: סְעָרָה
  choice: dhoruba
  rationale: Neno hili humaanisha tufani au dhoruba; “dhoruba” ni neno la kawaida na linalofaa katika muktadha wa baharini.
- source_word: לִדְמָמָה
  choice: itulie
  rationale: 'Muundo wa ל pamoja na דְּמָמָה unaonyesha matokeo: dhoruba inaingizwa katika hali ya utulivu au ukimya. “Itulie” ni Kiswahili cha asili na huhifadhi wazo hilo.'
- source_word: וַיֶּחֱשׁוּ
  choice: yakanyamaza
  rationale: Kitenzi kinaeleza kuwa kimya au kutulia. “Yakanyamaza” huonyesha mabadiliko ya mawimbi kutoka katika kishindo hadi ukimya, huku ikihifadhi tashhisi ya Kiebrania.
- source_word: גַּלֵּיהֶם
  choice: mawimbi yao
  rationale: Kiambishi cha Kiebrania ni cha nafsi ya tatu wingi, yaani “yao.” Tafsiri hii inahifadhi umbo la chanzo bila kuamua kimya kimya kama mawimbi ni ya bahari/maji au yanahusishwa na watu waliomo chomboni.
