base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/001.yaml
  text: A Song of Ascents[a]. Greatly they have afflicted me from my youth—let Israel now say—
translation:
  language: sw
  text: 'Wimbo wa Kupanda.


    Wamenitesa sana[a] tangu ujana wangu—


    Israeli na aseme sasa—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mara nyingi wamenitesa tangu ujana wangu.” Kiebrania רַבַּת kinaweza kuonyesha kurudiwa mara nyingi, na pia ukubwa wa mateso.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa Kupanda
  rationale: Huhifadhi nomino ya Kiebrania inayomaanisha kupanda na muundo wa kichwa unaotumiwa katika Zaburi 120–134, bila kuingiza moja kwa moja tafsiri ya hija.
- source_word: רַבַּת
  choice: sana
  rationale: Katika matumizi yake ya kielezi hapa, neno hili linaweza kuonyesha ukubwa au wingi wa kurudiwa. “Sana” ni Kiswahili cha kawaida kinachohifadhi msisitizo wa kiwango bila kulazimisha maana ya idadi ya matukio.
- source_word: צְרָרוּנִי
  choice: wamenitesa
  rationale: Kitenzi kinaonyesha kutendewa kwa uadui au kuonewa. “Wamenitesa” huhifadhi upana wa maana na inafaa kwa sauti ya maombolezo.
- source_word: מִנְּעוּרַי
  choice: tangu ujana wangu
  rationale: Huwasilisha kwa kawaida mwanzo wa kipindi kinachoendelea kutoka ujana wa msemaji.
- source_word: יֹאמַר נָא
  choice: na aseme sasa
  rationale: Muundo huu ni himizo kwa Israeli. “Na aseme sasa” huonyesha mwito wa kiliturujia bila kuifanya נא kuwa ombi la adabu.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la kawaida la Kiswahili limehifadhiwa; hapa linaitaja jumuiya nzima inayoitwa kukiri maneno hayo.
theological_decisions:
- issue: Msemaji wa kijumuiya na mpangilio wa kiliturujia
  choice: Nafsi ya kwanza “-ni-” inahifadhiwa, kisha Israeli inaitwa kuyasema maneno hayo kama jumuiya.
  alternative: Msemaji binafsi ambaye baadaye maneno yake yanatumiwa kwa Israeli.
  rationale: Kishazi “Israeli na aseme sasa” kinaonyesha kwamba malalamiko ya nafsi ya kwanza yanakusudiwa kuchukuliwa na Israeli kwa pamoja. Tafsiri haiondoi mvutano kati ya sauti ya mtu mmoja na utambulisho wa jumuiya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mistari na vistari virefu huhifadhi mwito unaoendelea hadi mstari unaofuata. Hakuna tanbihi iliyowekwa, kwa kuwa “sana” huhifadhi kwa kiasi kikubwa utata wa רַבַּת kati ya kiwango kikubwa na kurudiwa mara nyingi.
