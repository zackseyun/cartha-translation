  text: with which the reaper has not filled his hand[a], nor the one who gathers sheaves, his arms.
translation:
  language: sw
  text: 'ambazo mvunaji hajazi kiganja chake nazo,

    wala mkusanya miganda hajazi mkunjo wa vazi lake.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kifuani pake” au “mapajani pake”—mahali ambapo mabua yaliyokusanywa hubebwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁלֹּא
  choice: ambayo ... hawezi
  rationale: Kiambishi cha uhusiano pamoja na ukanushi kinarejelea majani ya juu ya paa katika mstari uliotangulia. Kiswahili hiki kinaonyesha wazi kwamba majani hayo hayatoshi kujaza mkono wa mvunaji, bila kuyafanya kuwa sentensi mpya isiyohusiana.
- source_word: מִלֵּא
  choice: hawezi kuijaza
  rationale: Kauli hii inaeleza matokeo ya kawaida ya majani hayo yasiyofaa kuvunwa. 'Hawezi kuijaza' ni ya asili katika Kiswahili na huwasilisha kwamba mavuno yake hayatoshi kujaza kiganja.
- source_word: כַפּוֹ
  choice: kiganja chake
  rationale: כַּף humaanisha hasa kiganja cha mkono. 'Kiganja chake' hudumisha taswira halisi ya kiasi kidogo ambacho mvunaji angeweza kushika.
- source_word: קוֹצֵר
  choice: mvunaji
  rationale: Nomino ya Kiswahili 'mvunaji' humtaja kwa ufupi na kwa kawaida mtu anayekata au kuvuna mazao.
- source_word: וְחִצְנוֹ
  choice: kifua chake
  rationale: חֵצֶן inaweza kutaja kifua, sehemu ya mbele ya vazi, au eneo la mwili ambako mabua hubebwa. 'Kifua chake' huhifadhi taswira ya kukusanya miganda dhidi ya mwili huku tanbihi ikionyesha maana mbadala.
- source_word: מְעַמֵּר
  choice: mkusanya miganda
  rationale: Neno hili humaanisha anayekusanya mazao yaliyokatwa kuwa miganda au mafungu. 'Mkusanya miganda' ni wazi na hudumisha ulinganifu wa kilimo na 'mvunaji'.
