translation_notes:
  register: Lugha ni ya sasa, yenye hadhi na inayoeleweka katika Kiswahili Sanifu cha Afrika Mashariki. Ulinganifu wa kishairi kati ya mvunaji na mkusanya miganda umehifadhiwa; tanbihi inadumisha upana wa maana ya חֵצֶן.
