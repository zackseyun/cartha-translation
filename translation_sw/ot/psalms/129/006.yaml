  text: יִ֭הְיוּ כַּ/חֲצִ֣יר גַּגּ֑וֹת שֶׁ/קַּדְמַ֖ת שָׁלַ֣ף יָבֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/006.yaml
  text: May they be like grass on the rooftops[a], which withers before it grows up.
translation:
  language: sw
  text: 'Na wawe kama majani juu ya paa,

    yanayokauka kabla hayajang’olewa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yanayokauka kabla hayajachomolewa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Na wawe
  rationale: Muktadha wa laana/ombi dhidi ya wanaoichukia Sayuni unaunga mkono maana ya kutakia, si wakati ujao wa kawaida.
- source_word: כַּחֲצִיר
  choice: kama majani
  rationale: חָצִיר humaanisha majani au uoto; “majani” ni ya kawaida na yanafaa kwa picha ya uoto unaomea juu ya paa.
- source_word: גַּגּוֹת
  choice: juu ya paa
  rationale: Wingi wa Kiebrania unaonyesha paa za nyumba kwa jumla; Kiswahili kwa kawaida hutumia “juu ya paa” katika taswira hii bila kulazimisha wingi.
- source_word: שֶׁקַּדְמַת
  choice: kabla
  rationale: Muundo huu unaonyesha kuwa kukauka hutangulia kitendo kinachofuata.
- source_word: שָׁלַף
  choice: hayajang’olewa
  rationale: Kitenzi שׁלף kwa kawaida ni kutoa, kuchomoa, au kung’oa; tafsiri hii huhifadhi maana hiyo badala ya kuibadili kuwa kukua.
- source_word: יָבֵשׁ
  choice: yanayokauka
  rationale: Kitenzi humaanisha kukauka; katika uoto, “kukauka” ni Kiswahili cha kawaida na cha kishairi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wa heshima. Tafsiri inahifadhi ombi la kutakia (“Na wawe”) na taswira halisi ya majani ya paa. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
