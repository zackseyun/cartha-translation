  source_fidelity: 'Tafsiri inafuata Kiebrania kwa uaminifu: “Na wawe” huhifadhi hali ya kutakia/kuomba; “kama majani juu ya paa” huwasilisha taswira ya חֲצִיר גַּגּוֹת; na “yanayokauka kabla hayajang’olewa” hutoa kwa usahihi mpangilio wa יָבֵשׁ kabla ya שָׁלַף. Ingawa tafsiri ya Kiingereza iliyotolewa ina “grows up,” ushahidi wa kitenzi שָׁלַף unaunga mkono ‘kung’olewa/kuchomolewa,’ na rasimu ya Kiswahili imehifadhi maana hiyo.'
