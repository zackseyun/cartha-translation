  text: 'Walimaji wamelima juu ya mgongo wangu;

    wameirefusha mifuo yao.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wameifanya mifuo yao kuwa mirefu.” Kiebrania hudumisha sitiari ya kulima kwa mateso makali au majeraha.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל גַּבִּי
  choice: mgongoni mwangu
  rationale: Hueleza mahali pa tendo kwa Kiswahili cha kawaida na kuhifadhi picha mahususi ya mgongo unaolimwa.
- source_word: חָרְשׁוּ
  choice: wamelima
  rationale: Kitenzi kinamaanisha kulima; wakati timilifu huhifadhi tendo lililofanyika lenye athari katika hali inayosimuliwa.
- source_word: חֹרְשִׁים
  choice: wakulima
  rationale: Kivumishi-tendo kimetumiwa kama nomino ya watendaji; “wakulima” ni la kawaida na hudumisha sitiari ya kilimo.
- source_word: הֶאֱרִיכוּ
  choice: wamezifanya ... kuwa marefu
  rationale: Hifili ya mzizi wenye maana ya kuwa mrefu humaanisha kufanya kitu kiwe kirefu; muundo huu ni wazi na wa kawaida.
- source_word: לְמַעֲנוֹתָם
  choice: matuta yao
  rationale: Neno hilo katika muktadha wa kulima hurejelea mistari au matuta yanayotokana na jembe; “matuta” huhifadhi picha halisi ya shamba, ingawa “mifuo” pia inawezekana.
theological_decisions:
- issue: Sitiari ya mateso ya Israeli
  choice: Kuhifadhi taswira halisi ya wakulima wanaolima mgongoni na kufanya matuta marefu.
  alternative: Walijeruhi mgongo wangu kwa mapigo marefu.
  rationale: Kiebrania hakifafanui sitiari hiyo kuwa mapigo au ukandamizaji moja kwa moja. Tafsiri huiweka wazi bila kuondoa mvutano na nguvu ya picha ya kishairi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa mistari hudumisha usambamba wa mashairi ya Kiebrania; sitiari haijafafanuliwa ndani ya mstari mkuu.
