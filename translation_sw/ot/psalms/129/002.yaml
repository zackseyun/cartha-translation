  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na lugha ya kawaida lakini yenye heshima. Wakati timilifu “wamenitesa” unaonyesha uzoefu wa zamani wenye athari hadi sasa; “hawakuniweza” huhitimisha kwa kauli fupi yenye mkazo.
