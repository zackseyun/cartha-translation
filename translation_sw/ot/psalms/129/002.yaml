    reason: lexical_alternative
lexical_decisions:
- source_word: רַבַּת
  choice: sana
  rationale: Katika matumizi ya kielezi, neno hili linaweza kusisitiza kiwango au wingi wa matukio. “Sana” linatanguliza maana ya kiwango huku tanbihi ikihifadhi uwezekano wa “mara nyingi.”
- source_word: צְרָרוּנִי
  choice: wamenitesa
  rationale: Kitenzi צרר hapa kinaonyesha kutendewa kwa uadui, kusumbuliwa, au kuonewa. “Wamenitesa” ni cha kawaida na hakifungi maana kwenye shambulio la kijeshi pekee.
- source_word: מִנְּעוּרָי
  choice: tangu ujana wangu
  rationale: Kirai hiki kinaonyesha mwanzo wa muda unaoendelea kutoka kipindi cha ujana; “tangu ujana wangu” ni Kiswahili cha kawaida na sahihi.
- source_word: גַּם
  choice: lakini
  rationale: 'Ingawa גַּם mara nyingi humaanisha “pia,” hapa pamoja na ukanushi lina nguvu ya kupambanua: licha ya mateso hayo, adui hawakufanikiwa.'
- source_word: לֹא יָכְלוּ לִי
  choice: hawakuniweza
  rationale: יכל pamoja na ל ina maana ya kutoweza kumshinda au kumzidi mtu. “Hawakuniweza” ni usemi wa Kiswahili unaohifadhi maana hiyo kwa ufupi na nguvu ya kishairi.
