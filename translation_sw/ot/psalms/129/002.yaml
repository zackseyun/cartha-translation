  text: Greatly they have afflicted me from my youth[b][a], yet they have not prevailed against me.
translation:
  language: sw
  text: Wamenitesa sana tangu ujana wangu[a], lakini hawakunishinda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wamenitesa mara nyingi tangu ujana wangu.” Mwanzo wa Kiebrania unaweza kusisitiza ama ukali wa mateso (“sana”) au kurudiwa kwake (“mara nyingi”).
    reason: lexical_alternative
