base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/004.yaml
  text: Yahweh is righteous[a]; he has cut the cords of the wicked.
translation:
  language: sw
  text: Yahwe ni mwenye haki; amezikata kamba[a] za waovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kamba nene.”
    reason: Neno la Kiebrania linaweza kusisitiza kamba nzito au imara za kufungia.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika herufi nne za Kiebrania limetoholewa kama “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Kirai hiki cha kawaida na chenye hadhi katika Kiswahili kinaeleza tabia ya Yahwe kuwa mwadilifu na kutenda yaliyo sawa.
- source_word: קִצֵּץ
  choice: amezikata
  rationale: Kitenzi kinaonyesha tendo la kukata au kukatilia mbali; wakati timilifu wa Kiswahili unaonyesha ukombozi uliotimizwa, na kiambishi “-zi-” hurejelea kamba.
- source_word: עֲבוֹת
  choice: kamba
  rationale: Neno hilo humaanisha kamba, hasa kamba nzito za kufungia. “Kamba” ni neno la kawaida linalodumisha taswira ya kifungo.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Kivumishi cha wingi kimetumiwa kama nomino kwa watu waovu kwa ujumla, bila kuongeza jinsia isiyotajwa wazi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi unadumisha ushairi wa mstari wa Kiebrania na taswira ya kukatwa kwa vifungo.
