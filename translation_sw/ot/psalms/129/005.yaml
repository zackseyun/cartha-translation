base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/005.yaml
  text: May all who hate Zion be put to shame and turned backward[a].
translation:
  language: sw
  text: Waaibike na warudi nyuma wote wanaoichukia Sayuni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wote wanaoichukia Sayuni wataaibika na kurudi nyuma.” Maumbo ya vitenzi vya Kiebrania yanaweza pia kueleweka kuwa taarifa ya wakati ujao badala ya ombi la kutakia.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: waaibike
  rationale: Kitenzi hiki huonyesha kupata aibu au kufedheheka; umbo la kutakia linaendana na nguvu ya ombi la mstari huu bila kutaja mtendaji ambaye Kiebrania hakumtaji.
- source_word: וְיִסֹּגוּ אָחוֹר
  choice: na warudi nyuma
  rationale: Kauli hii humaanisha kurudi au kuondoka kuelekea nyuma. “Warudi nyuma” ni Kiswahili cha kawaida kinachohifadhi maana ya kushindwa kusonga mbele bila kuongeza wazo la kulazimishwa.
- source_word: כֹּל
  choice: wote
  rationale: Huhifadhi wingi unaowahusisha watu wote wanaotajwa.
- source_word: שֹׂנְאֵי
  choice: wanaoichukia
  rationale: Kirai cha uhusiano ni cha asili katika Kiswahili na kinahifadhi maana ya participio, yaani watu wenye chuki dhidi ya Sayuni.
- source_word: צִיּוֹן
  choice: Sayuni
  rationale: Hili ndilo umbo la kawaida la jina hili la mahali katika Kiswahili cha Biblia.
theological_decisions:
- issue: Nguvu ya ombi au utabiri katika vitenzi vya mwanzo
  choice: 'Kutafsiri kama ombi la kutakia: “Waaibike na warudi nyuma.”'
  alternative: 'Kauli ya wakati ujao: “Wote wanaoichukia Sayuni wataaibika na kurudi nyuma.”'
  rationale: Maumbo ya yiqtol katika ushairi huu yanaweza kueleweka kama ombi la kutakia au kama taarifa ya wakati ujao. Matini kuu inahifadhi nguvu ya sala, huku tanbihi ikihifadhi uwezekano wa usomaji wa kiutabiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. Mpangilio wa maneno unadumisha msisitizo wa kishairi kwa kuanza na ombi, huku “warudi nyuma” ikibaki ya kawaida na sahihi.
