  text: 'Wimbo wa Kupanda.


    “Wamenitesa sana tangu ujana wangu”—


    Israeli na iseme sasa—[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mara nyingi wamenitesa tangu ujana wangu.” Neno la Kiebrania רַבַּת linaweza kuonyesha kurudiwa mara nyingi au ukubwa mkubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa Kupanda
  rationale: Kichwa hiki kinaweza kurejelea nyimbo zilizoimbwa wakati wa kupanda kwenda Yerusalemu; tafsiri hii huhifadhi taswira ya kupanda bila kuifafanua kupita kiasi.
- source_word: רַבַּת
  choice: sana
  rationale: Hapa kielezi hiki kinaweza kuonyesha ukubwa wa mateso au kurudiwa kwake. “Sana” ni ya kawaida na hufuata maana ya ukubwa, huku maana mbadala ikiwekwa katika tanbihi.
- source_word: צְרָרוּנִי
  choice: wamenitesa
  rationale: Kitenzi kinaeleza kutendewa kwa uadui, kusumbuliwa, au kuonewa; “wamenitesa” ni usemi wa asili unaoonyesha dhiki bila kubainisha aina yake.
- source_word: מִנְּעוּרַי
  choice: tangu ujana wangu
  rationale: Huhifadhi mtazamo wa msemaji katika nafsi ya kwanza na wazo la mateso yaliyoanza mapema maishani.
- source_word: יֹאמַר נָא יִשְׂרָאֵל
  choice: Israeli na aseme sasa
  rationale: Huhifadhi mwito wa wazi kwa Israeli kurudia kauli hiyo. “Na aseme” ni muundo wa heshima na wa sasa unaofaa kwa ushairi wa Biblia.
theological_decisions:
- issue: Utambulisho wa msemaji wa nafsi ya kwanza
  choice: Kudumisha “mimi” katika kauli ambayo Israeli inaagizwa kuitamka
  alternative: Kubadili moja kwa moja kuwa “wametutesa” ili kuonyesha taifa kwa wingi
  rationale: Kiebrania kina umoja wa nafsi ya kwanza, kisha kinamtaja Israeli. Muundo huu humwasilisha Israeli kwa pamoja kama msemaji mmoja; tafsiri haiubadili kuwa wingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mistari na vistari vinahifadhi mwito wa Israeli na mwendelezo wake kuelekea mstari unaofuata; alama [a] ipo katika matini kuu.
