  text: וְ/לֹ֤א אָֽמְר֨וּ הָ/עֹבְרִ֗ים בִּרְכַּֽת יְהוָ֥ה אֲלֵי/כֶ֑ם בֵּרַ֥כְנוּ אֶ֝תְ/כֶ֗ם בְּ/שֵׁ֣ם יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/008.yaml
  text: and those who pass by do not say[a], “The blessing of Yahweh be upon you; we bless you in the name of Yahweh.”
translation:
  language: sw
  text: 'Wala wapitao hawasemi,


    “Baraka ya Yahwe[a] iwe juu yenu;


    tunawabariki kwa jina la Yahwe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH” (jina la Mungu), ambalo kwa desturi hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא אָמְרוּ
  choice: Wala ... hawasemi
  rationale: Muundo huu unaendeleza maelezo ya mstari uliotangulia na kutoa ukanushi wa kawaida kwa Kiswahili; wakati wa sasa unaonyesha jambo ambalo wapitao kwa kawaida hawafanyi.
- source_word: הָעֹבְרִים
  choice: wapitao
  rationale: Nomino-tendaji yenye kibainishi inaonyesha kundi la watu wanaopita; “wapitao” ni fupi, ya kishairi, na inaeleweka katika Kiswahili sanifu.
- source_word: בִּרְכַּת יְהוָה
  choice: Baraka ya Yahwe
  rationale: Inahifadhi muundo wa nomino wa Kiebrania na kuitaja baraka inayotoka kwa Yahwe.
- source_word: אֲלֵיכֶם
  choice: iwe juu yenu
  rationale: Kiebrania hakina kitenzi kilichotajwa wazi; “iwe” huwasilisha maana ya ombi au tamko la baraka, huku “juu yenu” ikihifadhi taswira ya kihusishi.
- source_word: בֵּרַכְנוּ אֶתְכֶם
  choice: tunawabariki
  rationale: Kauli hii ni baraka inayotekelezwa kwa kutamkwa; wakati wa sasa wa Kiswahili unaonyesha vyema tendo hilo.
- source_word: בְּשֵׁם יְהוָה
  choice: kwa jina la Yahwe
  rationale: “Kwa jina la” ni usemi wa kawaida wa Kiswahili unaoonyesha mamlaka au jina linaloitwa wakati wa kutoa baraka.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, YHWH. “Yahwe” hulitafsiri kwa unukuzi badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Wapitao” limechaguliwa kwa ufupi na mdundo wa zaburi; sentensi imepangwa katika mistari ili kuonyesha kauli ya baraka iliyonukuliwa.
