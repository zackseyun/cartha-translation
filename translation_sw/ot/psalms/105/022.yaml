lexical_decisions:
- source_word: לֶאְסֹר
  choice: awafunge
  rationale: Kitenzi hiki kinaonyesha kusudi au matokeo yanayoendelea kutoka mstari uliotangulia. “Kufunga” huhifadhi maana ya moja kwa moja ya אסר, yaani kuwazuia au kuwaweka chini ya mamlaka.
- source_word: שָׂרָיו
  choice: wakuu wake
  rationale: Katika muktadha wa kifalme, שַׂר humaanisha mkuu, mtawala, au afisa mwenye cheo. “Wakuu” ni Kiswahili cha kawaida na chenye hadhi kinachofaa kwa maafisa wa Farao.
- source_word: בְּנַפְשׁוֹ
  choice: apendavyo
  rationale: Ingawa kwa neno moja moja ni “kwa/na nafsi yake,” hapa נֶפֶשׁ hudokeza mapenzi au matakwa. “Apendavyo” huwasilisha nahau hiyo kwa Kiswahili cha asili bila kuondoa utata wake katika tanbihi.
- source_word: וּזְקֵנָיו
  choice: wazee wake
  rationale: זָקֵן inaweza kumaanisha wazee kwa umri na pia viongozi waandamizi. “Wazee” huhifadhi nyanja zote mbili badala ya kuibana kuwa “maafisa waandamizi.”
- source_word: יְחַכֵּם
  choice: kuwafundisha ... hekima
  rationale: Umbo la Piel la חכם linaweza kumaanisha kufanya wawe wenye hekima au kuwafundisha hekima. Usemi huu ni wazi na wa kawaida, huku mbadala ukihifadhiwa katika tanbihi.
