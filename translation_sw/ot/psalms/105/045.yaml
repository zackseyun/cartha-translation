  text: בַּ/עֲב֤וּר יִשְׁמְר֣וּ חֻ֭קָּי/ו וְ/תוֹרֹתָ֥י/ו יִנְצֹ֗רוּ הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/045.yaml
  text: so that they might keep his statutes and observe his laws[b][a]. Praise Yah!
translation:
  language: sw
  text: ili wazishike amri zake na kuyatii mafundisho yake. Msifuni Yah![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Msifuni Yah!” Yah ni umbo fupi la jina la Mungu; usemi wote pia hujulikana kama “Haleluya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲבוּר
  choice: ili
  rationale: Kiunganishi hiki kinaonyesha kusudi au matokeo; “ili” ni cha kawaida na huhifadhi nguvu ya kusudi katika Kiswahili.
- source_word: יִשְׁמְרוּ
  choice: wazishike
  rationale: Katika muktadha wa agano, שמר ina maana ya kushika na kutekeleza kwa uaminifu; “wazishike” huambatana kiasili na “amri.”
- source_word: חֻקָּיו
  choice: amri zake
  rationale: חֻקִּים ni masharti au maagizo yaliyowekwa. “Amri” ni neno la kawaida linaloeleweka na bado lina uzito wa kisheria wa agano.
- source_word: וְתוֹרֹתָיו
  choice: mafundisho yake
  rationale: Wingi wa תּוֹרָה unaweza kumaanisha maagizo, mafundisho, au sheria. “Mafundisho” huhifadhi upana wake na kulitofautisha na חֻקָּיו.
- source_word: יִנְצֹרוּ
  choice: kuyatii
  rationale: נצר ina wazo la kulinda au kushika kwa uangalifu. “Kuyatii” ni Kiswahili cha kawaida katika muktadha wa mafundisho na huonyesha utekelezaji mwaminifu bila kurudia kitenzi “shika.”
- source_word: הַלְלוּ יָהּ
  choice: Msifuni Yah!
  rationale: הַלְלוּ ni agizo kwa wingi, kwa hiyo “Msifuni” huonyesha moja kwa moja wito huo. “Yah” huhifadhi umbo fupi la jina la Mungu lililotumiwa katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu katika maneno ya mwisho ya sifa
  choice: Msifuni Yah!
  alternative: Haleluya!; Msifuni BWANA!
  rationale: Maandishi yana יָהּ, umbo fupi la jina la Mungu, wala si tetragramatoni kamili יְהוָה. Kutafsiri agizo kama “Msifuni” na kuhifadhi “Yah” kunaonyesha muundo na maana ya Kiebrania bila kulinganisha kimya kimya maumbo hayo mawili.
- issue: Uhusiano wa kusudi na matokeo katika בַּעֲבוּר
  choice: ili
  alternative: kwa kusudi la kwamba; hata wakashike
  rationale: בַּעֲבוּר pamoja na vitenzi vya hali isiyotimilika inaweza kueleza kusudi, huku kivuli cha matokeo kikibaki. “Ili” huhifadhi kusudi hilo bila kuamua zaidi ya maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Mpangilio ni mfupi kama mstari wa hitimisho wa zaburi; “wazishike amri” na “kuyatii mafundisho” huunda ulinganifu wa asili bila kufuta tofauti za maneno ya Kiebrania.
