  text: It ate all the vegetation in their land[b][a], and it ate the fruit of their ground.
translation:
  language: sw
  text: Ikala mimea yote[a] katika nchi yao, ikala mazao ya ardhi yao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyasi zote.” Neno la Kiebrania linaweza kumaanisha nyasi hasa au uoto kwa maana pana.
    reason: lexical_alternative
  - marker: b
    text: Au, “zao la ardhi yao.” Neno la Kiebrania linaweza kumaanisha tunda au mazao yanayotokana na udongo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכַל
  choice: ikala
  rationale: Kitenzi cha Kiebrania kiko katika nafsi ya tatu, umoja, na kinarejelea kwa namna ya mkusanyiko nzige waliotajwa katika muktadha uliotangulia. “Ikala” huhifadhi umoja huo wa kisarufi na taswira halisi ya kula.
- source_word: כָּל
  choice: yote
  rationale: Neno hili linaonyesha ujumla; “yote” linapatana kiasili na nomino ya ngeli ya mimea.
- source_word: עֵשֶׂב
  choice: mimea
  rationale: עֵשֶׂב inaweza kumaanisha majani hasa au uoto kwa maana pana. “Mimea” ni ya kawaida, inaeleweka kwa urahisi, na inafaa kwa uharibifu mpana wa uoto katika pigo hili.
- source_word: בְּאַרְצָם
  choice: katika nchi yao
  rationale: Huhifadhi maana ya mahali iliyo katika kihusishi ב na maana ya eneo la אֶרֶץ pamoja na kiambishi cha wingi “yao.”
- source_word: פְּרִי אַדְמָתָם
  choice: mazao ya ardhi yao
  rationale: Ingawa פְּרִי kimsingi ni “tunda,” katika muktadha wa kilimo inaweza kumaanisha mazao. “Mazao ya ardhi yao” ni Kiswahili cha asili na huhifadhi wazo la kile kilichozalishwa na udongo, huku “ardhi” ikitofautishwa na “nchi” katika mstari wa kwanza.
