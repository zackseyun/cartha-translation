  text: He turned their heart to hate his people[b][a], to deal deceitfully with his servants.
translation:
  language: sw
  text: Aliigeuza mioyo yao ili wawachukie watu wake, na ili wawafanyie watumishi wake hila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili watende kwa hila dhidi ya watumishi wake.”
