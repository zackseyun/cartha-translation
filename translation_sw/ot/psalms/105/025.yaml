lexical_decisions:
- source_word: הָפַךְ
  choice: Aliigeuza
  rationale: Kitenzi kina maana ya kugeuza au kubadili; hapa kinadumisha wazi tendo la Mungu juu ya mwelekeo wa ndani wa Wamisri.
- source_word: לִבָּם
  choice: mioyo yao
  rationale: Kiebrania kina umoja wa kijumla, kihalisi ‘moyo wao’; wingi ‘mioyo yao’ ni Kiswahili cha kawaida kinachoeleweka bila kupoteza maana ya mwelekeo wao wa ndani.
- source_word: לִשְׂנֹא
  choice: iwachukie
  rationale: Muundo huu unaonyesha kusudi au matokeo ya kugeuzwa kwa mioyo yao na kutafsiri moja kwa moja wazo la kuwachukia watu wa Mungu.
- source_word: עַמּוֹ
  choice: watu wake
  rationale: Neno עַם hapa linarejelea watu wa Mungu, Israeli; ‘watu wake’ ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: לְהִתְנַכֵּל
  choice: kuwatendea ... kwa hila
  rationale: Kitenzi kinaeleza kutenda kwa ujanja wa uadui au udanganyifu; msemo huu ni wa kawaida katika Kiswahili na huhifadhi wazo la hila.
- source_word: בַּעֲבָדָיו
  choice: watumishi wake
  rationale: Katika muktadha huu עבד huonyesha Israeli katika uhusiano wao wa kumtumikia Mungu, hivyo ‘watumishi’ inafaa kuliko ‘watumwa’.
theological_decisions:
- issue: Utendaji wa Mungu katika kugeuza mwelekeo wa Wamisri
  choice: Kudumisha kauli ya moja kwa moja ‘Aliigeuza mioyo yao’
  alternative: ‘Aliruhusu mioyo yao igeuke’ au ‘mioyo yao iligeuka’
  rationale: Kiebrania kinamtaja Mungu kwa njia ya moja kwa moja kama mtendaji. Tafsiri hailegezi kauli hiyo, bali inadumisha mvutano wa kiteolojia kati ya enzi ya Mungu na uadui wa wanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mioyo yao’ limetumiwa kwa ufasaha wa Kiswahili; maana ya umoja wa kijumla wa Kiebrania imeelezwa katika uamuzi wa kileksika. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
