  text: saying[a], “To you I will give the land of Canaan[b], the portion of your inheritance.”
translation:
  language: sw
  text: akisema, “Nitakupa nchi ya Kanaani, fungu[a] la urithi wenu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kamba ya kupimia ya urithi wenu”; “kamba” kwa maana iliyopanuliwa hurejelea fungu la ardhi lililogawiwa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hubadilika kutoka “-ku-” ya umoja katika “nitakupa” hadi “wenu” ya wingi, huenda kikimsemesha Abrahamu kama mwakilishi wa wazao wake.
    reason: alternative_reading
lexical_decisions:
- source_word: לֵאמֹר
  choice: akisema
  rationale: Ni kiunganishi cha kawaida cha Kiswahili kinachoanzisha ahadi ya Mungu iliyonukuliwa kutoka mstari uliotangulia.
- source_word: לְךָ
  choice: -ku- katika “nitakupa”
  rationale: Kiambishi hiki ni cha nafsi ya pili umoja, hivyo kinahifadhi usemi unaomwelekea Abrahamu mmoja bila kuongeza neno lisilohitajika la “wewe.”
- source_word: אֶתֵּן
  choice: nitakupa
  rationale: Wakati ujao unaonyesha wazi nguvu ya ahadi; neno hili pia linajumuisha yule anayepewa katika umoja.
- source_word: אֶרֶץ כְּנָעַן
  choice: nchi ya Kanaani
  rationale: Ni usemi wa kawaida na ulio wazi kwa eneo linaloitwa Kanaani.
- source_word: חֶבֶל
  choice: fungu
  rationale: Ingawa maana ya msingi ni kamba ya kupimia, katika muktadha wa kugawa ardhi neno hili humaanisha sehemu iliyogawiwa. “Fungu” ni la asili na linahifadhi taswira ya mgao.
- source_word: נַחֲלַתְכֶם
  choice: urithi wenu
  rationale: “Urithi” huhifadhi maana ya milki iliyorithiwa au iliyogawiwa, na “wenu” linadumisha kiambishi cha wingi cha Kiebrania.
theological_decisions:
- issue: Kubadilika kutoka kwa anayesemeshwa katika umoja hadi kimilikishi cha wingi
  choice: Kuhifadhi umoja katika “nitakupa” na wingi katika “urithi wenu”
  alternative: “Nitakupa ... urithi wako” au “nitawapa ... urithi wenu”
  rationale: Kiebrania hubadilika kwa makusudi kutoka umoja hadi wingi, huenda kikimsemesha Abrahamu kama mwakilishi wa wazao wake. Tafsiri haipaswi kuondoa mvutano huo kwa kusawazisha idadi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ni mfupi na wa moja kwa moja; “fungu la urithi wenu” linadumisha uhusiano wa kiambatano katika Kiebrania na tofauti ya umoja na wingi.
