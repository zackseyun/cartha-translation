lexical_decisions:
- source_word: הָפַךְ
  choice: aliyageuza ... yakawa
  rationale: Kitenzi hiki humaanisha kugeuza au kubadili. Muundo huu wa Kiswahili ni wa kawaida na unaonyesha mabadiliko ya maji kuwa damu bila kuzidisha maana.
- source_word: מֵימֵיהֶם
  choice: maji yao
  rationale: Nomino ya Kiebrania iko katika wingi na inarejelea kwa pamoja vyanzo vya maji vya Wamisri; ‘maji yao’ ni Kiswahili cha kawaida na sahihi.
- source_word: לְדָם
  choice: yakawa damu
  rationale: Kihusishi לְ kinaonyesha hali iliyotokea baada ya mabadiliko. ‘Yakawa damu’ huwasilisha matokeo hayo kwa Kiswahili cha asili.
- source_word: וַיָּמֶת
  choice: kuwasababisha ... wafe
  rationale: Umbo la Hifili lina maana sababishi, kwa hiyo tafsiri hii inahifadhi wazo kwamba tendo lake lilisababisha samaki kufa.
- source_word: דְּגָתָם
  choice: samaki wao
  rationale: Nomino hiyo inarejelea samaki kwa ujumla; ‘samaki wao’ ni tafsiri wazi na ya kawaida.
