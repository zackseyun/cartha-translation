lexical_decisions:
- source_word: בִּהְיוֹתָם
  choice: Walipokuwa
  rationale: Muundo wa ב pamoja na kitenzi-jina cha היה na kiambishi cha nafsi ya tatu wingi huanzisha kishazi cha wakati; “Walipokuwa” ni Kiswahili cha kawaida na sahihi.
- source_word: מְתֵי מִסְפָּר
  choice: wachache kwa idadi
  rationale: Nahau hii ya Kiebrania humaanisha watu wachache wanaoweza kuhesabika kwa urahisi; “wachache kwa idadi” huhifadhi msisitizo wa idadi ndogo.
- source_word: כִּמְעַט
  choice: wachache sana
  rationale: Katika muktadha huu neno hilo linatilia nguvu wazo lililotangulia la uchache, badala ya kumaanisha tu “karibu.”
- source_word: וְגָרִים
  choice: na wageni wakaaji
  rationale: Neno linalotokana na גור hueleza watu wanaokaa katika nchi isiyo yao kama wageni au wakazi wa muda; “wageni wakaaji” huonyesha hali ya ugenini pamoja na ukaaji.
- source_word: בָּהּ
  choice: humo
  rationale: Kiambishi cha kike umoja kinarejelea nchi iliyotajwa katika muktadha; “humo” ni ya asili na haiongezi nomino isiyopo katika mstari.
