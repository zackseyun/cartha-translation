  yaml_path: translation/ot/psalms/105/003.yaml
  text: Boast in his holy name[a]; let the hearts of those who seek Yahweh rejoice.
translation:
  language: sw
  text: Jivunieni jina lake takatifu[a]; mioyo ya wale wanaomtafuta Yahweh na ifurahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Furahini kwa fahari katika jina lake takatifu.” Kitenzi cha Kiebrania kinaweza kumaanisha kufurahia kwa fahari au kujivunia.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְהַלְלוּ
  choice: Jisifuni
  rationale: Kauli ya kuamuru ya Hitpael kutoka הלל hapa ina maana ya kujivunia au kufurahia kwa fahari; “jisifuni” huhifadhi kwa ufupi hali ya kujielekeza ya kitenzi.
- source_word: בְּשֵׁם קָדְשׁוֹ
  choice: katika jina lake takatifu
  rationale: Huhifadhi kihusishi ב, nomino “jina,” na sifa ya utakatifu bila kufafanua kimyakimya maana pana ya jina kama tabia au sifa iliyofunuliwa.
- source_word: יִשְׂמַח
  choice: na ifurahi
  rationale: Ingawa ni imperfect ya nafsi ya tatu umoja, katika muktadha huu wa kishairi ina nguvu ya tamani au himizo, sambamba na amri iliyotangulia.
- source_word: לֵב
  choice: mioyo
  rationale: Kiebrania kina umoja wa kijumla “moyo”; wingi “mioyo” ni Kiswahili cha kawaida kinachopatana na wingi wa watu wanaomtafuta Yahweh na huhifadhi maana ya utu wa ndani.
- source_word: מְבַקְשֵׁי יְהוָה
  choice: wale wanaomtafuta Yahweh
  rationale: Kirai cha kushiriki kinaonyesha watu ambao sifa yao ni kuendelea kumtafuta Yahweh; muundo huu ni wa kawaida katika Kiswahili cha sasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetafsiriwa kwa uhawilishaji “Yahweh,” badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ina jina binafsi יְהוָה; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya יִשְׂמַח
  choice: na ifurahi (tamani/himizo)
  alternative: inafurahi (taarifa)
  rationale: Ulinganifu wa kishairi na amri “Jisifuni” unaunga mkono tamani au himizo, huku umbo lenyewe likiruhusu mvutano wa kishairi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Jisifuni” limetumiwa kwa maana ya kujivunia jina la Mungu, si kujisifu kwa sifa binafsi; tanbihi inaweka wazi wigo wa maana.
