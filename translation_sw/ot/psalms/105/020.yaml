  text: The king sent and released him[b][a]; the ruler of peoples set him free.
translation:
  language: sw
  text: Mfalme alituma, akamfungua[a]; mtawala wa mataifa akamweka huru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamwachilia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: alituma watu
  rationale: Kitenzi kwa msingi wake ni ‘alituma.’ Kwa kuwa Kiswahili kwa kawaida huhitaji kitu kilichotumwa katika muktadha huu, ‘watu’ imewekwa wazi kutokana na tendo linalofuata, bila kubadili mtendaji mkuu.
- source_word: מֶלֶךְ
  choice: Mfalme
  rationale: Ingawa nomino haina kiambishi cha uainisho katika ushairi wa Kiebrania, muktadha humtambulisha kuwa Farao; hivyo umbo bainifu la Kiswahili linafaa.
- source_word: וַיַּתִּירֵהוּ
  choice: wakamfungua
  rationale: Kitenzi kina maana ya kumlegeza au kumwachilia mtu kutoka vifungoni. ‘Wakamfungua’ huhifadhi picha halisi ya kuondolewa vifungo, huku chini yake ikieleweka kuachiliwa kutoka gerezani.
- source_word: מֹשֵׁל עַמִּים
  choice: mtawala wa mataifa
  rationale: מֹשֵׁל ni cheo cha ‘mtawala,’ na עַמִּים ni wingi unaoweza kumaanisha makundi ya watu au mataifa. ‘Mataifa’ ni usemi wa asili katika Kiswahili na huhifadhi wingi na ulinganifu wa kishairi.
- source_word: וַיְפַתְּחֵהוּ
  choice: akamweka huru
  rationale: Ingawa mzizi פתח kwa kawaida humaanisha ‘kufungua,’ hapa unaeleza kufunguliwa kutoka kifungoni. ‘Akamweka huru’ hutoa maana ya nahau kwa Kiswahili cha kawaida.
