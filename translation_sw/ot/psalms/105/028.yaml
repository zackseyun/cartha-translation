base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/028.yaml
  text: He sent darkness and made it dark[a], and they did not rebel against his words.
translation:
  language: sw
  text: Alituma giza, naye akafanya kuwe giza; nao hawakuasi maneno yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakuasi neno lake/amri yake.” Kiebrania kinaweza pia kueleweka kwa maana ya umoja. Mhusika wa “wao” hajatajwa wazi; wengine huona kuwa ni Wamisri, na wengine Musa na Aroni.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלַח
  choice: alituma
  rationale: Kitenzi cha kawaida cha kutuma; kinadumisha kauli ya moja kwa moja na ya kishairi.
- source_word: חֹשֶׁךְ
  choice: giza
  rationale: Ni maana ya kawaida na wazi ya nomino hii, inayofaa katika muktadha wa pigo la giza.
- source_word: וַיַּחְשִׁךְ
  choice: akafanya kuwe giza
  rationale: Huwasilisha nguvu ya kisababishi ya kitenzi cha Kiebrania kwa Kiswahili cha kawaida, bila kudai kitu kilichotiwa giza ambacho hakijatajwa wazi.
- source_word: וְלֹא
  choice: nao hawaku-
  rationale: Muunganiko wa 'na' pamoja na ukanushi unahifadhi uratibu wa Kiebrania bila kuingiza utofautishaji mkali wa 'lakini'.
- source_word: מָרוּ
  choice: hawakuasi
  rationale: '''Kuasi'' hudumisha maana ya kutotii au kuasi mamlaka, badala ya kuipunguza kuwa kutokubali tu.'
- source_word: אֶת־דבריו
  choice: maneno yake
  rationale: Umbo la Kimasoreti ni wingi, 'maneno yake'; uhusiano na kitenzi 'kuasi' unaeleweka kwa kawaida katika Kiswahili bila kuongeza kihusishi kisicho cha lazima.
theological_decisions:
- issue: Mhusika wa wingi katika 'hawakuasi'
  choice: 'Kuacha mhusika akiwa katika kiwakilishi cha wingi kisichotajwa wazi: ''nao hawakuasi''.'
  alternative: Kutaja wazi Wamisri, au Musa na Aroni.
  rationale: Kiebrania hakimtaji wazi mhusika wa kitenzi cha wingi. Wafafanuzi hutofautiana kuhusu kama ni Wamisri au Musa na Aroni; tafsiri haipaswi kuondoa utata huo halisi.
- issue: Wingi wa דבריו
  choice: maneno yake
  alternative: neno lake / amri yake
  rationale: Maandishi ya Kimasoreti yana umbo la wingi. Chaguo hili hulihifadhi, huku tanbihi ikitaja uwezekano wa maana ya umoja au amri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo 'akafanya kuwe giza' ni wa asili na huhifadhi maana ya kisababishi; 'nao' huhifadhi mhusika wa wingi bila kumtambulisha.
