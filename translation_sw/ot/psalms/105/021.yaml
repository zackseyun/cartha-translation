  yaml_path: translation/ot/psalms/105/021.yaml
  text: He made him lord of his house[a], and ruler over all his possessions.
translation:
  language: sw
  text: Alimweka kuwa bwana wa nyumba yake[a], na mtawala juu ya mali zake zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Alimteua kuwa mkuu wa nyumba yake, na mtawala juu ya kila kitu alichomiliki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂמוֹ
  choice: Alimweka kuwa
  rationale: Kitenzi cha Kiebrania kina maana ya kumweka au kumteua mtu katika nafasi fulani; muundo huu wa Kiswahili unaonyesha uteuzi huo kwa kawaida.
- source_word: אָדוֹן
  choice: bwana
  rationale: Neno hili humaanisha mwenye mamlaka katika nyumba; “bwana” linafaa kwa mtindo wa kishairi na linasawaziana na “mtawala.”
- source_word: לְבֵיתוֹ
  choice: wa nyumba yake
  rationale: Kiambishi לְ hapa kinaonyesha eneo la mamlaka alilopewa; “wa nyumba yake” ni muundo wa kawaida baada ya “bwana.”
- source_word: וּמֹשֵׁל
  choice: na mtawala
  rationale: Nomino/umbo la kushiriki kutoka משל humaanisha mtu anayetawala; “mtawala” huhifadhi ulinganifu wa vyeo katika mstari.
- source_word: בְּכָל
  choice: juu ya ... zote
  rationale: Pamoja na משל, בְּ huonyesha eneo au vitu vinavyotawaliwa; Kiswahili cha kawaida hutumia “juu ya” kueleza mamlaka hayo.
- source_word: קִנְיָנוֹ
  choice: mali zake
  rationale: קִנְיָן hurejelea mali au vitu vilivyomilikiwa; “mali zake” ni wazi, pana, na ya kawaida katika Kiswahili.
