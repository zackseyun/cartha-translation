lexical_decisions:
- source_word: שָׁאַל
  choice: Waliomba
  rationale: Kitenzi cha Kiebrania kiko katika umoja wa nafsi ya tatu, lakini muktadha unaelekea kwa watu wa Israeli kama kundi. Wingi unatoa maana hiyo kwa Kiswahili cha kawaida, huku umoja wa maandishi ukihifadhiwa katika tanbihi.
- source_word: וַיָּבֵא
  choice: naye akaleta
  rationale: Hifili ya בוא ina maana ya kusababisha kitu kije, yaani ‘kuleta.’ Kiunganishi ‘naye’ kinaonyesha kwamba Mungu ndiye mtendaji anayeeleweka kutokana na muktadha.
- source_word: שְׂלָו
  choice: kware
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa ndege anayetajwa kuwa chakula kilichotolewa jangwani.
- source_word: לֶחֶם שָׁמַיִם
  choice: mkate wa mbinguni
  rationale: Tafsiri hii inadumisha muundo wa kishairi wa Kiebrania, ‘mkate wa mbingu,’ kwa usemi wa Kiswahili unaosikika kwa kawaida.
- source_word: יַשְׂבִּיעֵם
  choice: akawashibisha
  rationale: Hifili ya שׂבע humaanisha kuwafanya washibe au kuwaridhisha kwa chakula. ‘Akawashibisha’ ni wazi, sahihi, na ya asili katika muktadha huu.
theological_decisions:
- issue: Kiima cha kitenzi cha kwanza שָׁאַל
  choice: 'Kimeeleweka kwa maana ya watu wa Israeli kwa pamoja: ‘Waliomba.’'
  alternative: 'Kudumisha umoja wa kisarufi: ‘Aliomba,’ labda Israeli akionwa kama umoja wa pamoja au mtu mmoja akiwa mwakilishi.'
  rationale: Muktadha unasimulia matendo ya Mungu kwa Israeli jangwani, na kiambishi cha wingi katika ‘akawashibisha’ kinaunga mkono rejeo la kundi. Tanbihi inadumisha tofauti kati ya umbo la umoja na maana inayowezekana ya pamoja.
- issue: Uhusiano katika לֶחֶם שָׁמַיִם
  choice: ‘mkate wa mbinguni,’ ikidumisha muundo wa kishairi wa ‘mkate wa mbingu.’
  alternative: ‘mkate kutoka mbinguni,’ ikieleza wazi chanzo chake.
  rationale: Muundo wa Kiebrania unaweza kueleweka kama sifa au asili/chanzo. Maandishi makuu yanahifadhi usemi wa kishairi, na tanbihi inaonyesha tafsiri halali ya chanzo bila kuondoa utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Kware’ ni neno linaloeleweka kwa ndege huyo; ‘akawashibisha’ linawasilisha wazi utoaji wa chakula mpaka wakatosheka. Alama zote za tanbihi zimewekwa katika maandishi.
