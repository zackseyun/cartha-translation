translation:
  language: sw
  text: Waliomba[a], naye akaleta kware; akawashibisha kwa mkate wa mbinguni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina kitenzi cha umoja, yaani, “aliomba”; huenda maana yake ni ya pamoja, ikiwahusu watu wa Israeli walioomba.
    reason: alternative_reading
