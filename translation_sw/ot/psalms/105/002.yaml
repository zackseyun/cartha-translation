base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/002.yaml
  text: Sing to him[a]; sing praises to him; speak of all his wondrous works.
translation:
  language: sw
  text: Mwimbieni; mwimbieni sifa; simulieni[a] matendo yake yote ya ajabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zungumzeni kuhusu maajabu yake yote,” au, “yatafakarini matendo yake yote ya ajabu.” Kitenzi cha Kiebrania kinaweza kumaanisha kutafakari moyoni au kusimulia kwa maneno; katika muktadha huu wa sifa, maana ya kusimulia hadharani imepewa uzito.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Mwimbieni
  rationale: Amri ya wingi kutoka שׁיר ina maana ya kuimba; kiambishi -ni kinaonyesha kwamba yeye ndiye anayeelekezewa wimbo.
- source_word: ל֭וֹ
  choice: -eni (Mwimbieni)
  rationale: Kihusishi ל pamoja na kiwakilishi kinaonyesha anayeelekezewa sifa; Kiswahili cha kawaida huwasilisha maana hiyo kwa kiambishi cha yambwa ndani ya kitenzi.
- source_word: זַמְּרוּ
  choice: mwimbieni sifa
  rationale: Katika muktadha wa kumsifu Mungu, זמר humaanisha kuimba au kufanya muziki wa sifa. Tafsiri hii inadumisha wazo la ibada bila kudai kwamba ala za muziki zilitumiwa.
- source_word: שִׂיחוּ
  choice: simulieni
  rationale: שׂיח inaweza kumaanisha kunena au kusimulia, na pia kutafakari. Katika mfululizo huu wa maagizo ya sifa ya hadharani, “simulieni” huwasilisha vizuri maana ya kutangaza matendo hayo, huku tanbihi ikihifadhi maana nyingine.
- source_word: בְּכָל
  choice: matendo yake yote
  rationale: Baada ya kitenzi cha kusimulia, בְּ hutolewa kiasili bila kihusishi tofauti katika Kiswahili, huku כָל ikiwakilishwa na “yote.”
- source_word: נִפְלְאוֹתָיו
  choice: matendo yake ... ya ajabu
  rationale: Neno hili hurejelea mambo au matendo ya kushangaza, hasa matendo ya Mungu. “Matendo yake ya ajabu” huhifadhi wazo la maajabu yanayotokana na yale aliyotenda.
