  text: He allowed no man to oppress them[a]; he rebuked kings on their account,
translation:
  language: sw
  text: 'Hakumruhusu mtu yeyote kuwaonea;

    aliwakemea wafalme kwa sababu yao.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili yao.”
