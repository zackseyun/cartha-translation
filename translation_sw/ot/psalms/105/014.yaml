translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mtu yeyote’ huwasilisha matumizi ya jumla ya אָדָם kwa uwazi, huku ‘kuwaonea’ na ‘aliwakemea’ vikihifadhi nguvu ya matendo ya Kiebrania. Mpangilio wa mistari unafuata usambamba wa kishairi wa aya.
