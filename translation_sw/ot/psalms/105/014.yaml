lexical_decisions:
- source_word: הִנִּיחַ
  choice: hakumruhusu
  rationale: Katika muundo huu wa kisababishi, kitenzi kina maana ya kutokuruhusu jambo litendeke; ‘hakumruhusu’ ni Kiswahili cha kawaida na sahihi pamoja na kitenzi-jina kinachofuata.
- source_word: אָדָם
  choice: mtu yeyote
  rationale: Umoja huu umetumiwa kwa maana ya jumla, yaani mtu awaye yote, si mwanamume fulani wala wanadamu kwa ujumla.
- source_word: לְעָשְׁקָם
  choice: kuwaonea
  rationale: Kitenzi עשׁק huonyesha kuwaonea, kuwadhulumu au kuwanyanyasa wengine kwa njia isiyo ya haki; ‘kuwaonea’ ni pana, asilia, na inafaa katika muktadha huu.
- source_word: וַיּוֹכַח
  choice: aliwakemea
  rationale: Hapa יכח inaonyesha kukaripia au kutoa lawama kali; ‘aliwakemea’ huhifadhi uzito wa tendo hilo kwa Kiswahili cha sasa.
- source_word: עֲלֵיהֶם
  choice: kwa sababu yao
  rationale: Kirai hiki kinaonyesha kwamba wafalme walikemewa kuhusiana na hao waliolindwa au kwa sababu yao, bila kufafanua zaidi namna ya uhusiano huo.
- source_word: מְלָכִים
  choice: wafalme
  rationale: Neno la Kiebrania linamaanisha wafalme moja kwa moja; hakuna sababu ya kulipanua kuwa watawala kwa ujumla.
