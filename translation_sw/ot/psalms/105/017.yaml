  text: שָׁלַ֣ח לִ/פְנֵי/הֶ֣ם אִ֑ישׁ לְ֝/עֶ֗בֶד נִמְכַּ֥ר יוֹסֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/017.yaml
  text: He sent a man before them[a]; Joseph was sold as a servant.
translation:
  language: sw
  text: Alimtuma mtu mbele yao; Yosefu aliuzwa kuwa mtumwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלַח
  choice: Alimtuma
  rationale: Kitenzi cha Kiebrania ni Qal timilifu, nafsi ya tatu umoja; mtendaji anayerejelewa ni Mungu kutokana na muktadha. “Alimtuma” ni tafsiri ya kawaida na ya asili.
- source_word: לִפְנֵיהֶם
  choice: awatangulie
  rationale: Kirai hiki humaanisha kihalisi “mbele yao.” Katika muktadha wa kutumwa mapema ili kuwatayarishia njia, “awatangulie” huwasilisha maana hiyo kwa Kiswahili cha kawaida huku tafsiri ya karibu zaidi ikiwekwa katika tanbihi.
- source_word: אִישׁ
  choice: mtu
  rationale: אִישׁ hapa humtaja mtu mmoja wa kiume, ambaye mara moja anatambulishwa kuwa Yosefu. Katika Kiswahili, “mtu” ni nomino ya kawaida na ya asili katika muundo huu bila kufuta utambulisho wake.
- source_word: לְעֶבֶד
  choice: kuwa mtumwa
  rationale: Kiambishi לְ kinaonyesha hali au matokeo, na kuuzwa kwa Yosefu kunafanya hali ya utumwa iwe wazi. “Mtumwa” ni sahihi zaidi kuliko “mtumishi” katika muktadha huu.
- source_word: נִמְכַּר
  choice: aliuzwa
  rationale: Hii ni Niphal timilifu yenye maana ya kutendwa. “Aliuzwa” huhifadhi kauli tendwa kwa uwazi na kwa Kiswahili cha asili.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili sanifu.
theological_decisions:
- issue: Tafsiri ya עֶבֶד katika habari ya kuuzwa kwa Yosefu
  choice: mtumwa
  alternative: mtumishi
  rationale: Kwa kuwa Yosefu “aliuzwa,” kifungu kinazungumzia wazi hali ya kufungwa katika utumwa, si huduma ya hiari au wadhifa wa mtumishi. “Mtumwa” huhifadhi uzito wa hali hiyo bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa zaburi. Kiima cha “Alimtuma” hakikutajwa wazi kwa sababu hakipo wazi katika mstari wa Kiebrania, ingawa muktadha unaonyesha kuwa ni Mungu.
