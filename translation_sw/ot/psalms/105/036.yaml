  text: He struck down every firstborn in their land[a], the firstfruits of all their strength.
translation:
  language: sw
  text: Akawapiga wazaliwa wa kwanza wote katika nchi yao, malimbuko ya nguvu zao zote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “matokeo ya kwanza ya nguvu zao zote”; usemi wa Kiebrania huwarejelea wazaliwa wa kwanza kuwa udhihirisho wa kwanza wa nguvu za uzazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: Aliwaua
  rationale: Kitenzi נכה katika kausativi humaanisha kupiga au kuangusha; katika muktadha wa pigo la wazaliwa wa kwanza, tendo hilo lilisababisha kifo. “Aliwaua” linaeleza matokeo yaliyokusudiwa kwa Kiswahili cha kawaida bila kutumia usemi usio wa asili.
- source_word: כָּל בְּכוֹר
  choice: wazaliwa wote wa kwanza
  rationale: בְּכוֹר ni mzaliwa wa kwanza, na כָּל linaonyesha ujumla. Muundo huu ni wa kawaida na unaeleweka katika Kiswahili cha Biblia.
- source_word: בְּאַרְצָם
  choice: katika nchi yao
  rationale: Neno אֶרֶץ hapa lina maana ya nchi au ardhi yao; “nchi yao” huhifadhi maana ya kijiografia katika simulizi la mapigo.
- source_word: רֵאשִׁית
  choice: malimbuko
  rationale: רֵאשִׁית hurejelea kilicho cha kwanza au mwanzo. “Malimbuko” huhifadhi picha ya wazaliwa wa kwanza kuwa tokeo la kwanza la nguvu za uzazi.
- source_word: לְכָל אוֹנָם
  choice: ya nguvu zao zote
  rationale: אוֹן inaweza kumaanisha nguvu, uwezo, au nguvu za uzazi. “Nguvu zao” ni ya asili na yenye heshima, huku tanbihi ikihifadhi maana mahsusi ya uwezo wa kuzaa.
theological_decisions:
- issue: Kiima kisichotajwa wazi cha kitenzi
  choice: “Ali-” humrejelea Mungu
  alternative: Kutaja “Mungu” wazi katika mstari
  rationale: Kiebrania kina kiima cha nafsi ya tatu umoja kinachoeleweka kutokana na muktadha uliotangulia. Kiswahili kinaweza kukihifadhi kwa kiambishi “Ali-” bila kuongeza jina lisilotajwa katika mstari huu.
- issue: Maana ya “malimbuko ya nguvu zao”
  choice: Kudumisha sitiari ya nguvu
  alternative: “zao la kwanza la uwezo wao wa kuzaa”
  rationale: Usemi wa Kiebrania unaunganisha wazaliwa wa kwanza na udhihirisho wa kwanza wa nguvu au uwezo wa uzazi. Tafsiri kuu inadumisha mvutano huo wa kishairi, na tanbihi inafafanua bila kuufanya mstari kuwa maelezo marefu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wenye heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Malimbuko” ni neno la kibiblia linalofahamika na linalohifadhi picha ya Kiebrania.
