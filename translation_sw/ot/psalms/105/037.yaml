base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/037.yaml
  text: He brought them out with silver and gold[a], and among his tribes there was no one who stumbled.
translation:
  language: sw
  text: Akawatoa wakiwa na fedha na dhahabu, na miongoni mwa makabila yake hapakuwa na yeyote aliyejikwaa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakukuwa na aliyekuwa dhaifu.” Neno la Kiebrania linaweza kumaanisha kujikwaa, kulegea, au kuwa dhaifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵם
  choice: Akawatoa
  rationale: Hifili ya יצא humaanisha kusababisha watoke; “akawatoa” ni ya kawaida katika Kiswahili na inadumisha utendaji wa Mungu katika tukio la kutoka Misri.
- source_word: בְּכֶסֶף וְזָהָב
  choice: wakiwa na fedha na dhahabu
  rationale: ב hapa huonyesha walichokuwa nacho walipotoka. “Wakiwa na” ni Kiswahili cha kawaida kinachoonyesha kuwa walimiliki fedha na dhahabu bila kuongeza wazo la kiasi au namna ya kubeba.
- source_word: וְאֵין
  choice: wala hakuna yeyote
  rationale: אין ni usemi wa kutokuwapo. “Wala hakuna yeyote” huunganisha kishazi kwa ufasaha na kuonyesha kwamba hakuna hata mmoja aliyekuwa katika hali iliyotajwa.
- source_word: בִּשְׁבָטָיו
  choice: miongoni mwa makabila yake
  rationale: שׁבט hapa ni “kabila,” na kiambishi chake ni nafsi ya tatu umoja wa kiume. “Makabila yake” kinadumisha umoja huo, kikimtazama Israeli/Yakobo kama jumuiya moja.
- source_word: כּוֹשֵׁל
  choice: aliyejikwaa
  rationale: Kitenzi כשל kinaweza kumaanisha kujikwaa, kulegea, au kuwa dhaifu. “Aliyejikwaa” kinahifadhi taswira halisi ya Kiebrania huku tanbihi ikionyesha maana nyingine inayowezekana.
theological_decisions:
- issue: Mrejewa wa kiambishi cha umoja katika בִּשְׁבָטָיו
  choice: Kudumisha umoja kwa “makabila yake,” likimrejelea Israeli/Yakobo kama jumuiya moja.
  alternative: “makabila yao,” likiwataja watu hao kwa wingi; au “makabila yake” kwa maana ya taifa lenyewe.
  rationale: Kiebrania kina kiambishi cha nafsi ya tatu umoja wa kiume. Zaburi inaweza kumtazama Israeli kama mtu mmoja wa kijumuiya; tafsiri inadumisha umbo hilo bila kulipatia maana ya kimadhehebu.
- issue: Maana ya כּוֹשֵׁל
  choice: Kutumia “aliyejikwaa” katika matini na kuweka udhaifu/kulegea katika tanbihi.
  alternative: “aliyekuwa dhaifu” au “aliyelegea.”
  rationale: Neno hilo lina wigo wa kujikwaa, kulegea, na udhaifu. Matini inadumisha taswira ya msingi, huku tanbihi ikihifadhi utata wa kileksika na maana inayofaa kwa safari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wakiwa na” huepuka tafsiri nzito kama “wakiwa wamelemewa na,” nayo “wala hakuna yeyote” ni ya wazi kwa wasomaji wa kawaida. Kiashirio [a] kimewekwa baada ya kishazi kinachofafanuliwa.
