    reason: cultural_note
lexical_decisions:
- source_word: שָׂמוּ
  choice: Wakatenda
  rationale: Ingawa kitenzi hiki kimsingi humaanisha ‘kuweka,’ katika muktadha wa ishara na maajabu kinaeleza kuzitekeleza au kuzifanya.
- source_word: בָם
  choice: miongoni mwao
  rationale: Kiambishi cha wingi kinawarejelea Wamisri; ‘miongoni mwao’ huonyesha kwamba matendo hayo yalifanyika katikati yao.
- source_word: דִּבְרֵי אֹתוֹתָיו
  choice: ishara alizokuwa amesema
  rationale: דִּבְרֵי inaweza kumaanisha maneno, mambo, au matukio. Tafsiri hii huhifadhi uhusiano wa ishara na neno lililotamkwa bila kutumia Kiswahili kisicho cha kawaida kama ‘maneno ya ishara zake.’
- source_word: וּמֹפְתִים
  choice: na maajabu
  rationale: ‘Maajabu’ ni neno la kawaida na lenye hadhi kwa מֹפְתִים, hasa katika jozi ya ‘ishara na maajabu.’
- source_word: בְּאֶרֶץ חָם
  choice: katika nchi ya Hamu
  rationale: Jina la kishairi la Misri limehifadhiwa badala ya kubadilishwa moja kwa moja kuwa ‘Misri.’
theological_decisions:
- issue: Maana ya msemo usio wa kawaida דִּבְרֵי אֹתוֹתָיו
  choice: ishara alizokuwa amesema
  alternative: maneno ya ishara zake; mambo ya ishara zake
  rationale: Msemo wa Kiebrania unaweza kuhusisha maneno au mambo yanayohusu ishara. Tafsiri kuu inaeleweka kwa Kiswahili na kudumisha uhusiano kati ya neno la Mungu na ishara zilizotekelezwa; tanbihi inaonyesha umbo la karibu zaidi la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka. ‘Hamu’ limetumiwa kama umbo la kawaida la jina Ham katika mapokeo ya Biblia ya Kiswahili.
