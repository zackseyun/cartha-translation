  text: They performed among them the words of his signs[c][b][a], and wonders in the land of Ham.
translation:
  language: sw
  text: Walitenda miongoni mwao mambo ya ishara zake,[a] na maajabu katika nchi ya Hamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “maneno ya ishara zake”; pia yaweza kueleweka, “mambo ya ishara zake.”
