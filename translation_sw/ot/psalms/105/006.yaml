  text: זֶ֭רַע אַבְרָהָ֣ם עַבְדּ֑/וֹ בְּנֵ֖י יַעֲקֹ֣ב בְּחִירָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/006.yaml
  text: offspring of Abraham[a], his servant, sons of Jacob, his chosen ones[c][b],
translation:
  language: sw
  text: 'Enyi wazao wa Abrahamu[a], mtumishi wake,

    enyi wana wa Yakobo[b], wateule wake[c]!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uzao wa Abrahamu.” Neno la Kiebrania liko katika umoja lakini linatumika kwa maana ya pamoja kwa wazao wa Abrahamu.
    reason: lexical_alternative
  - marker: b
    text: Au “watoto wa Yakobo.” Kiebrania kinasema kihalisi “wana wa Yakobo.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, wale aliowachagua.
    reason: lexical_clarification
lexical_decisions:
- source_word: זֶרַע
  choice: wazao
  rationale: Hapa nomino ya umoja inatumika kwa maana ya pamoja, ikimaanisha kizazi cha Abrahamu. “Wazao” ni ya kawaida na wazi katika Kiswahili, bila kudokeza mbegu halisi.
- source_word: עַבְדּוֹ
  choice: mtumishi wake
  rationale: 'Kiambishi cha umilikaji kinamrejelea Mungu: Abrahamu ni mtumishi wake. “Mtumishi” linafaa kwa hadhi hii ya heshima kuliko “mtumwa,” kwa kuwa wazo la utumwa halisisitizwi hapa.'
- source_word: בְּנֵי
  choice: wana wa
  rationale: Neno la Kiebrania ni wingi wa kiume, lakini “wana wa” katika Kiswahili cha kibiblia na fasaha linaweza kuonyesha ukoo wa Yakobo kwa pamoja huku likidumisha umbo la chanzo.
- source_word: בְּחִירָיו
  choice: wateule wake
  rationale: Kivumishi cha wingi kinamaanisha wale ambao Mungu amewachagua. “Wateule wake” ni kifupi, cha asili, na kinadumisha maana bila kufafanua mfumo fulani wa kiteolojia.
- source_word: זֶרַע אַבְרָהָם // בְּנֵי יַעֲקֹב
  choice: wazao wa Abrahamu ... wana wa Yakobo
  rationale: Ulinganifu wa kishairi unaotaja jumuiya ileile kwa ukoo wa mababu wawili umehifadhiwa, badala ya vifungu hivyo kuunganishwa.
theological_decisions:
- issue: Marejeo ya viambishi vya umilikaji katika “mtumishi wake” na “wateule wake”
  choice: 'Viambishi vyote vinamrejelea Mungu: Abrahamu ni mtumishi wa Mungu, na wana wa Yakobo ni wateule wa Mungu.'
  alternative: Kisarufi, msomaji angeweza kuvihusisha kwa karibu zaidi na majina ya mababu yaliyotangulia, ingawa muktadha haufadhili usomaji huo.
  rationale: Muktadha wa agano katika zaburi unamtambulisha Abrahamu kuwa mtumishi wa Mungu na ukoo wa Yakobo kuwa wale waliochaguliwa na Mungu. Kiswahili kinahifadhi viambishi bila kuongeza jina “Mungu” ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Enyi” limetumiwa kuonyesha mwito wa moja kwa moja unaodokezwa na muundo wa mstari katika muktadha, na mistari miwili inadumisha ulinganifu wa kishairi.
