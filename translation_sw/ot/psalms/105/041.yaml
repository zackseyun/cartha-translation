base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/041.yaml
  text: He opened the rock[a], and water gushed out; they flowed through the dry places like a river.
translation:
  language: sw
  text: Aliufungua mwamba, maji yakabubujika; yakatiririka katika maeneo makavu kama mto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yakatiririka katika maeneo makavu, mto.” Kiebrania hakina neno la wazi la ‘kama’; neno ‘mto’ linaweza kueleweka kuwa linaeleza jinsi maji yalivyotiririka.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּתַח
  choice: aliufungua
  rationale: Kitenzi cha Kiebrania kwa msingi kinamaanisha ‘kufungua.’ Tafsiri hii inadumisha picha ya chanzo bila kuongeza wazo la ‘kupasua,’ ambalo halisemwi moja kwa moja.
- source_word: צוּר
  choice: mwamba
  rationale: ‘Mwamba’ ni neno la kawaida na lenye hadhi kwa צוּר. Muktadha wa simulizi linalojulikana unaifanya irejelee mwamba maalumu hata bila kibainishi katika Kiebrania.
- source_word: וַיָּז֣וּבוּ מָיִם
  choice: maji yakabubujika
  rationale: ‘Yakabubujika’ linaonyesha maji kutoka kwa wingi na kwa nguvu, huku likidumisha maana ya kutiririka au kutoka iliyomo katika kitenzi.
- source_word: הָלְכוּ
  choice: yakatiririka
  rationale: Maana halisi ni ‘yakaenda,’ lakini kuhusu maji Kiebrania hapa huonyesha mwendo wa mtiririko. ‘Yakatiririka’ ni Kiswahili cha asili na kinakubaliana na nomino ya ngeli ya wingi ‘maji.’
- source_word: בַּצִּיּוֹת
  choice: katika maeneo makavu
  rationale: Neno linataja sehemu au maeneo yaliyokauka. ‘Maeneo makavu’ ni pana kuliko ‘jangwa’ na hivyo haliongezi ubainishaji usiokuwamo katika chanzo.
- source_word: נָהָר
  choice: kama mto
  rationale: Nomino ya mwisho haina neno la wazi la kulinganisha, lakini inaeleza namna au ukubwa wa mtiririko. ‘Kama mto’ ni wazi na ya kishairi katika Kiswahili; tanbihi inadumisha muundo wa karibu zaidi na Kiebrania.
theological_decisions:
- issue: Rejeo la Mungu kuwapa Israeli maji jangwani
  choice: Mstari umetafsiriwa kama maelezo ya kihistoria na kishairi kuhusu Mungu kutoa maji mwambani.
  alternative: Kuuchukulia hasa kama sitiari ya jumla ya riziki ya Mungu.
  rationale: Zaburi hii inasimulia historia ya Israeli. Tafsiri inadumisha tukio la jangwani bila kuzuia maana pana ya kitheolojia inayoweza kutokana nalo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye hadhi na unaoeleweka kwa urahisi. Vitenzi ‘yakabubujika’ na ‘yakatiririka’ vinadumisha nguvu na ushairi wa mstari bila kuzidisha maana ya chanzo.
