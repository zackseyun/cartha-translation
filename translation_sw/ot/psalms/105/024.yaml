  text: And he made his people very fruitful[b][a], and made them mightier than their adversaries.
translation:
  language: sw
  text: Akawazidisha watu wake sana[a], akawafanya wawe na nguvu kuliko adui zao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawafanya watu wake wazae sana.” Kitenzi cha Kiebrania kinaweza kukazia kuzaa sana au kuongezeka kwa idadi.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kihalisi kina viwakilishi vya umoja: “akamfanya awe na nguvu kuliko adui zake,” kwa kuwa “watu wake” hutendewa katika Kiebrania kama nomino ya umoja wa kijumla.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּפֶר
  choice: akawazidisha
  rationale: Kitenzi פרה katika Hifili hapa humaanisha kusababisha kuzaa sana au kuongezeka. “Akawazidisha” ni Kiswahili cha kawaida kinachoeleza ongezeko kubwa la watu, huku picha ya kuzaa ikitajwa katika tanbihi.
- source_word: עַמּוֹ
  choice: watu wake
  rationale: עַם ni kundi la watu kwa maana ya taifa au jumuiya; “watu wake” ni tafsiri ya asili na inayofaa muktadha wa Israeli kama watu wa Mungu.
- source_word: מְאֹד
  choice: sana
  rationale: Ni kielezi cha kusisitiza kiwango; “sana” hutoa maana hiyo kwa Kiswahili fasaha na cha kawaida.
- source_word: וַיַּעֲצִמֵהוּ
  choice: akawafanya wawe na nguvu
  rationale: Kitenzi עצם katika Hifili humaanisha kufanya kuwa hodari au mwenye nguvu. Muundo huu ni wa kawaida katika Kiswahili na unaonyesha kwamba Mungu ndiye aliyewapa nguvu.
- source_word: מִצָּרָיו
  choice: kuliko adui zao
  rationale: מן hapa ina nguvu ya ulinganisho, na צַר humaanisha adui au mpinzani. “Adui zao” ni pana vya kutosha kutaja Wamisri waliowatesa bila kuongeza maelezo yasiyokuwamo katika Kiebrania.
theological_decisions:
- issue: Viwakilishi vya umoja vinavyorejelea nomino ya jumla
  choice: Kutumia wingi katika “akawazidisha,” “akawafanya,” na “zao” kwa kurejelea “watu wake.”
  alternative: Kuhifadhi umoja wa kisarufi wa Kiebrania kwa muundo kama “akamzidisha mtu wake ... kuliko adui zake.”
  rationale: Kiebrania humchukulia “watu wake” kama umoja wa kijumla, lakini Kiswahili cha kawaida hurejelea kundi la watu kwa upatanisho wa wingi. Hili ni badiliko la kisarufi lisilobadili maana ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Upatanisho wa wingi umetumiwa kwa ufasaha wa Kiswahili, huku umoja wa kijumla wa Kiebrania ukihifadhiwa katika tanbihi.
