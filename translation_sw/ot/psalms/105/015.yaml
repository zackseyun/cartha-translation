  text: “Msiwaguse watu wangu waliotiwa mafuta[a], wala msiwadhuru manabii wangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “watiwa-mafuta wangu.” Neno la msingi linahusiana na “Masihi,” lakini hapa ni la wingi na linawarejelea watu waliowekwa wakfu na Mungu, wala si Masihi mmoja hasa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְּעוּ
  choice: msiwaguse
  rationale: Kitenzi נגע kwa kawaida humaanisha ‘gusa,’ ingawa katika muktadha fulani kinaweza kumaanisha kufikia au kupiga. ‘Msiwaguse’ huhifadhi tamathali ya Kiebrania bila kuifinya iwe madhara ya kimwili pekee.
- source_word: בִמְשִׁיחָי
  choice: watiwa-mafuta wangu
  rationale: מָשִׁיחַ ni ‘mtu aliyetiwa mafuta’; hapa umbo ni la wingi pamoja na kiambishi cha nafsi ya kwanza umoja. ‘Watiwa-mafuta wangu’ huonyesha wingi na maana ya watu waliowekwa wakfu na Mungu bila kudokeza kwamba ni Masihi mmoja.
- source_word: לִנְבִיאַי
  choice: manabii wangu
  rationale: נָבִיא humaanisha ‘nabii’; hapa ni wingi wenye kiambishi cha nafsi ya kwanza umoja, kwa hiyo ‘manabii wangu’ ni tafsiri ya moja kwa moja na ya asili.
- source_word: תָּרֵעוּ
  choice: msiwadhuru
  rationale: Katika muundo huu, רעע humaanisha kutenda mabaya dhidi ya mtu au kumsababishia madhara. ‘Msiwadhuru’ ni Kiswahili cha sasa, kifupi, na kinacholingana na mstari sambamba.
- source_word: אַל
  choice: msi-
  rationale: אַל pamoja na kitenzi kisichotimilika huonyesha katazo. Kiambishi cha kukanusha cha amri ‘msi-’ ndicho muundo wa kawaida na wa asili katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya מְשִׁיחַ katika muktadha wa wingi usiomlenga Masihi mmoja
  choice: watiwa-mafuta wangu
  alternative: masihi wangu
  rationale: Umbo la Kiebrania ni la wingi na linawarejelea watu waliowekwa wakfu na Mungu katika historia ya Israeli. ‘Watiwa-mafuta’ huhifadhi maana ya msingi na huepuka kuingiza kimakosa maana ya cheo cha Masihi mmoja.
translation_notes:
