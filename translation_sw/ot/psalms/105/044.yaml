translation:
  language: sw
  text: Aliwapa nchi za mataifa, nao wakarithi taabu za watu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “matokeo ya taabu za watu.” Neno la Kiebrania linaweza kumaanisha taabu au kazi ngumu yenyewe, au kile kilichopatikana kwa kazi hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן לָהֶם
  choice: Aliwapa
  rationale: Kitenzi cha wakati uliopita chenye kiambishi cha yambwa kinawasilisha kwa kawaida kwamba Mungu ndiye aliyewapa wao; kiunganishi cha Kiebrania hakihitaji kutafsiriwa kando katika mtindo wa Kiswahili.
- source_word: אַרְצוֹת גּוֹיִם
  choice: nchi za mataifa
  rationale: “Nchi” linaweza kuwa na umbo lilelile katika umoja na wingi, na hapa muktadha pamoja na “za mataifa” huhifadhi wingi wa Kiebrania. “Mataifa” linafaa kwa muktadha wa maeneo na jamii.
- source_word: וַעֲמַל לְאֻמִּים
  choice: matunda ya taabu za watu
  rationale: עָמָל inaweza kumaanisha taabu/kazi ngumu au kile kilichopatikana kwa taabu hiyo. “Matunda ya taabu” hufanya sentensi iwe ya kawaida kwa Kiswahili huku ikihifadhi maana pana ya matokeo ya kazi.
- source_word: יִירָשׁוּ
  choice: wakarithi
  rationale: ירש inaweza kumaanisha kurithi au kutwaa na kumiliki. “Wakarithi” huhifadhi wazo la kupokea mali kwa utoaji wa Mungu, na muundo wa “waka-” huendeleza mfuatano wa simulizi.
theological_decisions:
- issue: Dhana ya agano katika ירש
  choice: wakarithi
  alternative: wakatwaa na kumiliki
  rationale: “Wakarithi” huhifadhi kwamba nchi na mali zake zilipokewa kama zawadi ya Mungu, bila kukana kwamba kitenzi cha Kiebrania pia kinaweza kueleza kutwaa umiliki.
- issue: Maana ya עָמָל kama kazi au mazao yake
  choice: matunda ya taabu za watu
  alternative: taabu za watu
  rationale: Katika muktadha wa kitu kinachorithiwa, maana ya kile kilichopatikana kwa kazi ni ya kawaida; tanbihi huhifadhi uwezekano wa kurejelea kazi au taabu yenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. “Matunda ya taabu” ni usemi wa kawaida unaoeleweka kwa urahisi; tanbihi inaweka wazi utata halisi wa עָמָל na wigo wa ירש.
