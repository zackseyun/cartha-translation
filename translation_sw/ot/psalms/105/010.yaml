  text: He confirmed it to Jacob as a statute[b][a], to Israel as an everlasting covenant.
translation:
  language: sw
  text: Aliithibitisha kwa Yakobo kuwa kanuni, kwa Israeli kuwa agano la milele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “agano la daima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמִידֶהָ
  choice: Aliithibitisha
  rationale: Hifili ya עמד ina maana ya kukifanya kitu kisimame imara, yaani kukiweka thabiti au kukithibitisha. Kiambishi cha kike kinarejelea jambo la agano au kiapo lililotajwa katika muktadha uliotangulia bila kulibainisha zaidi.
- source_word: לְיַעֲקֹב
  choice: kwa Yakobo
  rationale: Kihusishi לְ humtaja mpokeaji au mnufaika; “kwa Yakobo” ni Kiswahili cha kawaida na huhifadhi ulinganifu wa kishairi.
- source_word: לְחֹק
  choice: kuwa amri ya kudumu
  rationale: חֹק ni jambo lililowekwa au kuamriwa kwa uthabiti. “Amri ya kudumu” huwasilisha uzito wa kisheria na pia wazo la uthabiti, bila kutumia istilahi nzito isiyo ya kawaida.
- source_word: לְיִשְׂרָאֵל
  choice: kwa Israeli
  rationale: Hufuatana sambamba na “kwa Yakobo” na kudumisha muundo wa kishairi wa Kiebrania.
- source_word: בְּרִית עוֹלָם
  choice: kuwa agano la milele
  rationale: בְּרִית ni “agano,” na עוֹלָם hapa huonyesha kudumu kwa muda usio na mwisho au wa daima. “Agano la milele” ni msemo wa kawaida, wenye hadhi, na unaoeleweka vizuri katika Kiswahili.
theological_decisions:
- issue: Kirejelewa cha kiambishi cha kike katika וַיַּעֲמִידֶהָ
  choice: Kimeachwa kudokezwa katika kitenzi “Aliithibitisha,” kikirejelea agano, neno lililoamriwa, au kiapo cha mistari iliyotangulia.
  alternative: Kutaja wazi “agano hilo,” “ahadi hiyo,” au “kiapo hicho.”
  rationale: Muktadha wa karibu unatumia maneno kadhaa yanayohusiana—agano, neno, na kiapo. Kutokibainisha kwa nomino moja huhifadhi upeo wa rejeleo la Kiebrania.
- issue: Maana ya עוֹלָם
  choice: milele
  alternative: daima; kudumu
  rationale: “Milele” huhifadhi nguvu ya muda mrefu usio na mwisho inayobebwa na neno katika tamko hili la agano, huku tanbihi ikionyesha uwezekano wa tafsiri ya “daima.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Ulinganifu wa “kwa Yakobo ... kwa Israeli” umehifadhiwa. Maneno ya kisheria na ya agano yametolewa kwa lugha inayoeleweka kwa wasomaji wa kawaida.
