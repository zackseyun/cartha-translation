  yaml_path: translation/ot/psalms/105/001.yaml
  text: Give thanks to Yahweh[a]; call on his name; make his deeds known among the peoples.
translation:
  language: sw
  text: Mshukuruni Yahweh[a]; liitieni jina lake; yatangazeni matendo yake miongoni mwa mataifa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: יהוה (YHWH), jina binafsi la Mungu; hapa limetolewa kama “Yahweh.”'
    reason: Ufafanuzi wa jina la Mungu na uwezekano wa mazoea mengine ya kulitafsiri.
lexical_decisions:
- source_word: הוֹדוּ
  choice: Mshukuruni
  rationale: Hifili ya amri, wingi, ya ידה katika muktadha wa zaburi humaanisha kumshukuru au kumsifu Mungu. “Mshukuruni” ni ya asili katika Kiswahili na inadumisha maana ya shukrani.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Herufi ל inaonyesha anayeelekezewa shukrani; jina la agano יְהוָה limetafsiriwa kwa unukuzi “Yahweh” kulingana na ushahidi wa maandishi na uamuzi wa mradi.
- source_word: קִרְאוּ בִּשְׁמוֹ
  choice: liitieni jina lake
  rationale: Muundo קרא בְּשֵׁם unaweza kumaanisha kuliitia au kulingana na muktadha kulitangaza jina. “Liitieni jina lake” hudumisha maana ya ibada na maombi bila kufuta uwezekano wa tangazo.
- source_word: הוֹדִיעוּ
  choice: yajulisheni
  rationale: Hifili ya amri, wingi, ya ידע ina maana ya kusababisha yajulikane. “Yajulisheni” ni fupi, ya kawaida, na huhifadhi nguvu ya kisababishi.
- source_word: בָעַמִּים
  choice: kati ya mataifa
  rationale: עַמִּים hurejelea vikundi vya watu au mataifa, na ב hapa ina wazo la ‘miongoni mwa/kati ya.’ “Kati ya mataifa” ni Kiswahili cha kawaida na huonyesha upeo wa kimataifa.
- source_word: עֲלִילוֹתָיו
  choice: matendo yake
  rationale: Neno hili humaanisha vitendo au kazi, mara nyingi vitendo vinavyostahili kutangazwa. “Matendo yake” ni pana na haliongezi kivumishi kama ‘makuu’ ambacho hakipo wazi katika neno lenyewe.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la Mungu la herufi nne. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya קִרְאוּ בִשְׁמוֹ
  choice: liitieni jina lake
  alternative: litangazeni jina lake
  rationale: Msemo unaweza kugusa kumwomba Mungu kwa jina lake au kulitangaza jina lake. Tafsiri kuu inahifadhi maana ya kumwitia katika ibada, huku muktadha wa kutangaza kati ya mataifa ukibaki katika kishazi kinachofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Amri za wingi zimedumishwa katika vitenzi vyote vitatu.
