  text: Walitesa miguu yake kwa pingu; nafsi yake ikaingia katika chuma.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kauli ya Kiebrania ni ngumu. Inaweza pia kueleweka, “shingo yake ikaingia katika chuma,” yaani, alitiwa mkufu au mnyororo wa chuma. Neno lililotafsiriwa “nafsi” linaweza pia kumaanisha mtu mzima au, katika muktadha fulani, koo au shingo.
    reason: lexical_alternative
  - marker: b
    text: Tafsiri nyingine husema, “chuma kikaijia nafsi yake.” Hata hivyo, kisarufi kitenzi cha Kiebrania kinapatana na “nafsi yake” kuwa kiima.
