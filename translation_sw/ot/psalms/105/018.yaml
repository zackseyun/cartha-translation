lexical_decisions:
- source_word: עִנּוּ
  choice: Waliitesa
  rationale: Kitenzi ענה katika Piel humaanisha kutesa, kunyanyasa, au kudhalilisha. “Waliitesa” kinaonyesha ukali wa mateso bila kuwataja wahusika ambao Kiebrania hakijawataja.
- source_word: בַכֶּבֶל
  choice: kwa pingu
  rationale: כבל ni kifungo au pingu; kihusishi ב hapa kinaeleweka kwa maana ya chombo kilichotumiwa.
- source_word: רַגְלָיו
  choice: miguu yake
  rationale: Hii ndiyo maana ya moja kwa moja na inayofaa katika muktadha wa kufungwa kwa Yosefu.
- source_word: בַּרְזֶל
  choice: katika chuma
  rationale: Neno linamaanisha “chuma.” Tafsiri kuu hailiongezei “mkufu” wala “minyororo,” kwa kuwa maneno hayo hayakutajwa wazi katika Kiebrania.
- source_word: בָּאָה
  choice: ikaingia
  rationale: בוא ni “kuja/kuingia.” Umbo la kike la kitenzi linapatana kisarufi na נַפְשׁוֹ, hivyo nafsi ndiyo kiima cha kishazi.
- source_word: נַפְשׁוֹ
  choice: nafsi yake
  rationale: נפש linaweza kumaanisha nafsi, uhai, mtu mwenyewe, na wakati mwingine koo au shingo. “Nafsi yake” huhifadhi taswira na utata wa mstari wa Kiebrania.
