  yaml_path: translation/ot/psalms/105/030.yaml
  text: Their land swarmed with frogs[a], even in the chambers of their kings.
translation:
  language: sw
  text: Nchi yao ikajaa vyura, hata ndani ya vyumba vya wafalme wao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wafalme wao.” Katika simulizi la mapigo katika Kutoka hutajwa Farao kwa umoja, lakini hapa zaburi inatumia wingi, huenda kama usemi wa kishairi au wa kijumla.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרַץ
  choice: ikajaa
  rationale: Kitenzi hiki huonyesha kujaa au kuzagaa kwa wingi. “Ikajaa” ni Kiswahili cha kawaida na chenye picha wazi ya uvamizi wa vyura.
- source_word: אַרְצָם
  choice: Nchi yao
  rationale: Nomino yenye kiambishi cha nafsi ya tatu wingi wa kiume imetafsiriwa moja kwa moja; katika muktadha inahusu Misri.
- source_word: צְפַרְדְּעִים
  choice: vyura
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa wanyama wanaotajwa.
- source_word: בְּחַדְרֵי
  choice: ndani ya vyumba vya
  rationale: Muundo huu unaonyesha mahali walipokuwamo vyura. “Vyumba” ni neno la sasa, la kawaida, na linafaa pia kwa vyumba vya kifalme.
- source_word: מַלְכֵיהֶם
  choice: wafalme wao
  rationale: Kiebrania kina umbo la wingi lenye kiambishi “wao”; wingi umehifadhiwa badala ya kusawazishwa na simulizi la Kutoka lenye umoja.
