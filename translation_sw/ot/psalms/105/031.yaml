base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/031.yaml
  text: He spoke[a], and swarms of flies came[c][b], and gnats throughout all their territory.
translation:
  language: sw
  text: Alisema, na makundi ya mainzi[a] yakaja, na chawa[b] katika eneo lao lote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “makundi ya wadudu.” Katika masimulizi ya mapigo, neno la Kiebrania עָרֹב kwa kawaida limeeleweka kuwa kundi la mainzi, ingawa aina kamili ya wadudu hao haijulikani kwa hakika.
    reason: lexical_alternative
  - marker: b
    text: Au “mbu wadogo”; utambulisho kamili wa wadudu wanaoitwa כִּנִּים kwa Kiebrania hauna uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
  choice: Alisema
  rationale: Kitenzi hiki kwa kawaida humaanisha ‘alisema’; tafsiri hii inadumisha usemi mfupi unaoonyesha kwamba Mungu alisema, bila kuongeza wazo la ‘kuamuru’ ambalo halijaelezwa moja kwa moja.
- source_word: וַיָּבֹא
  choice: yakaja
  rationale: Kitenzi בוא hapa kinaeleza kuwasili kwa pigo. Upatanisho wa kisarufi wa ‘yakaja’ unafuata nomino ya Kiswahili ‘makundi’.
- source_word: עָרֹב
  choice: makundi ya mainzi
  rationale: Katika masimulizi ya mapigo, neno hili kwa kawaida hueleweka kuwa makundi ya wadudu, hasa mainzi. Utambulisho kamili wa wadudu hao si hakika, kwa hiyo jambo hilo limeonyeshwa katika tanbihi.
- source_word: כִּנִּים
  choice: chawa
  rationale: Hili ni jina la wadudu wadogo katika mapigo ya Misri. ‘Chawa’ ni neno la kawaida na linaloeleweka katika Kiswahili, lakini kwa kuwa aina kamili ya wadudu haijulikani, tanbihi inataja uwezekano mwingine.
- source_word: בְּכָל גְּבוּלָם
  choice: katika eneo lao lote
  rationale: גְּבוּל hapa inaashiria eneo lote lililo chini yao, si mstari wa mpaka pekee; ‘lote’ linaakisi wazi כָּל.
theological_decisions:
- issue: Nguvu ya usemi wa Mungu
  choice: Alisema
  alternative: Aliamuru
  rationale: Maandishi yanatumia kitenzi cha kawaida ‘kusema’, ingawa muktadha unaonyesha matokeo ya usemi huo. Tafsiri haiongezi kitenzi maalumu cha kuamuru.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi wenye mapigo mawili tofauti umehifadhiwa kwa kutumia ‘na’; ‘wakaenea’ huweka wazi uwepo wa chawa katika eneo lote bila kudai kitenzi tofauti katika Kiebrania.
