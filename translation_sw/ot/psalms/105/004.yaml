  text: דִּרְשׁ֣וּ יְהוָ֣ה וְ/עֻזּ֑/וֹ בַּקְּשׁ֖וּ פָנָ֣י/ו תָּמִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/004.yaml
  text: Seek Yahweh and his strength[a]; seek his face continually.
translation:
  language: sw
  text: Mtafuteni Yahweh na nguvu zake; utafuteni uso wake daima.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utafuteni uwepo wake daima.” Kiebrania kinasema kihalisi, “utafuteni uso wake daima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Mtafuteni
  rationale: Amri ya wingi ya דרשׁ hapa inahimiza watu wamwelekee Yahweh kwa nia na ibada; “mtafuteni” ni ya kawaida na huhifadhi msukumo huo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: וְעֻזּוֹ
  choice: na nguvu zake
  rationale: עֹז humaanisha nguvu au uweza. “Nguvu zake” ni tafsiri ya moja kwa moja na ya kawaida, huku kiambishi cha umilikaji kikihifadhiwa.
- source_word: בַּקְּשׁוּ
  choice: utafuteni
  rationale: Amri ya wingi ya בקשׁ ina maana ya kutafuta kwa bidii. Kutumia “utafuteni” kunadumisha usambamba wa kishairi, huku umbo tofauti kidogo na “mtafuteni” likiifanya sentensi isikike kwa kawaida.
- source_word: פָנָיו
  choice: uso wake
  rationale: Tafsiri halisi ni “uso wake.” Ingawa katika muktadha huu inaweza kumaanisha uwepo wake, kuhifadhi taswira ya uso kunadumisha lugha ya uhusiano na mvutano wa kishairi wa Kiebrania.
- source_word: תָּמִיד
  choice: daima
  rationale: תָּמִיד huonyesha mwendelezo au kurudiwa kwa kudumu. “Daima” ni fupi, ya asili, na inafaa katika himizo la kishairi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia jina binafsi la Mungu; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Ikiwa פָנָיו itafsiriwe kwa taswira ya “uso wake” au kwa maana ya “uwepo wake”
  choice: uso wake
  alternative: uwepo wake
  rationale: Kiebrania kinasema kihalisi “uso wake,” lakini nahau hiyo inaweza kurejelea uwepo wa Mungu. Maandishi makuu yanahifadhi taswira, na tanbihi inaonyesha maana mbadala bila kuondoa utata halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Amri za wingi zinaeleweka kwa wasomaji wa kawaida; taswira halisi ya “uso wake” imehifadhiwa na maana yake ya kinahau imewekwa katika tanbihi.
