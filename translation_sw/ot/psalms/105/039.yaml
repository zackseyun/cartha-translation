  text: Alitandaza wingu kuwa kifuniko[a], na moto wa kuangaza usiku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “liwe kifuniko,” “kuwa pazia,” au “kuwa kama dari.” Neno la Kiebrania linaweza kumaanisha kifuniko, pazia, au kinga.
