lexical_decisions:
- source_word: פָּרַשׂ
  choice: alitandaza
  rationale: Kitenzi hiki humaanisha kutandaza au kunyoosha kitu; “alitandaza” ni Kiswahili cha kawaida kinachodumisha taswira ya Mungu kulieneza wingu.
- source_word: עָנָן
  choice: wingu
  rationale: Hii ndiyo maana ya moja kwa moja, na katika muktadha inarejelea wingu lililoandamana na Israeli jangwani.
- source_word: לְמָסָךְ
  choice: kuwa kifuniko
  rationale: Neno מָסָךְ linaweza kumaanisha kifuniko, pazia, au kizuizi. “Kuwa kifuniko” huonyesha kazi ya wingu bila kuibana taswira kuwa kitu fulani cha usanifu.
- source_word: וְאֵשׁ
  choice: na moto
  rationale: Tafsiri ya moja kwa moja inadumisha usambamba wa wingu na moto pamoja na mwangwi wa simulizi la jangwani.
- source_word: לְהָאִיר
  choice: ili kutoa nuru
  rationale: Muundo wa kitenzi-jina unaonyesha kusudi; “ili kutoa nuru” ni wa kawaida na unaeleza wazi kazi ya moto.
- source_word: לָיְלָה
  choice: usiku
  rationale: “Usiku” ni usemi wa asili wa Kiswahili unaotoa maana ya wakati bila kuongeza maelezo yasiyomo katika Kiebrania.
theological_decisions:
- issue: Mtendaji asiyeelezwa kwa jina katika kitenzi
  choice: Alitandaza = Mungu ndiye mtendaji anayeeleweka kutokana na muktadha
  alternative: Kutaja wazi “BWANA alitandaza”
  rationale: Kiebrania kina kiima fiche cha nafsi ya tatu umoja wa kiume kinachoendelezwa kutoka muktadha na kumrejelea Mungu. Kiswahili pia kinaweza kudumisha mtiririko huo kwa kiambishi “A-” bila kuongeza jina la Mungu katika mstari.
- issue: Taswira ya ufunuo wa Mungu jangwani
  choice: Kudumisha taswira halisi ya wingu na moto bila ufafanuzi wa ziada
  alternative: Kuyatambulisha wazi kama nguzo ya wingu na nguzo ya moto
  rationale: Mstari unadokeza simulizi la Kutoka, lakini Kiebrania chenyewe kinataja tu wingu na moto pamoja na kazi zake. Tafsiri haiongezi utambulisho usiotamkwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi kwa kiasi lakini wazi na cha sasa. “Alitandaza” na “kifuniko” hudumisha taswira ya Kiebrania; sentensi fupi inalinda usambamba wa wingu na moto.
