  text: עַד עֵ֥ת בֹּֽא דְבָר֑/וֹ אִמְרַ֖ת יְהוָ֣ה צְרָפָֽתְ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/019.yaml
  text: Until the time his word came to pass[b][a], the word of Yahweh tested him.
translation:
  language: sw
  text: Mpaka wakati neno lake lilipotimia[a], neno la Yahwe lilimjaribu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Neno lake” huenda likawa neno au utabiri wa Yosefu uliotimia; wengine hulielewa kuwa neno la Mungu kumhusu Yosefu. Kihalisi, “lilikuja.”
    reason: alternative_reading
  - marker: b
    text: Au, “lilimsafisha kama chuma.” Kitenzi cha Kiebrania kina taswira ya kusafisha chuma kwa moto, na hivyo kinaweza kumaanisha kumjaribu au kumthibitisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד עֵת
  choice: Mpaka wakati
  rationale: Kirai hiki huonyesha muda unaoendelea hadi hatua fulani; tafsiri hii ni ya kawaida na ya asili katika Kiswahili.
- source_word: בֹּא
  choice: lilipotimia
  rationale: Kitenzi humaanisha kihalisi ‘kuja,’ lakini kinapotumiwa kuhusu neno hapa kinaweza kueleza neno kutokea au kutimizwa.
- source_word: דְבָרוֹ
  choice: neno lake
  rationale: Huhifadhi maana na utata wa kiambishi cha umilikaji; katika muktadha kinaweza kumrejelea Yosefu, ingawa wengine hukielewa kuwa neno la Mungu kumhusu.
- source_word: אִמְרַת
  choice: neno
  rationale: Ni neno linalokaribiana na דָּבָר na humaanisha tamko au usemi; ‘neno’ ni la asili na hudumisha ulinganifu wa mistari.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa tahajia inayosomeka kwa urahisi katika Kiswahili, badala ya kubadilishwa na cheo.
- source_word: צְרָפָתְהוּ
  choice: lilimjaribu
  rationale: Mzizi huu hueleza kusafisha chuma kwa moto na, kwa maana ya sitiari, kumjaribu au kumthibitisha mtu. ‘Lilimjaribu’ huwasilisha maana kuu kwa uwazi, huku taswira ya kusafisha ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Kirejelewa cha ‘neno lake’
  choice: Maandishi makuu yanahifadhi ‘neno lake’ bila kutaja wazi mwenye neno; kwa muktadha linaelekea kuwa neno au utabiri wa Yosefu.
  alternative: Neno la Mungu kumhusu Yosefu.
  rationale: Kiambishi cha Kiebrania kinaweza kueleweka kwa njia zote mbili. Muktadha wa mateso na kuthibitishwa kwa Yosefu unaunga mkono neno lake kutimia, lakini utata wa asili haupaswi kuondolewa.
- issue: Maana ya sitiari katika צְרָפָתְהוּ
  choice: lilimjaribu
  alternative: lilimsafisha kama chuma
  rationale: ‘Kumjaribu’ ni maana ya sitiari iliyo wazi katika Kiswahili, lakini tanbihi huhifadhi taswira ya chuma kinachosafishwa kwa moto na uwezekano wa maana ya kumthibitisha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi ulio wazi na wenye heshima. ‘Mpaka wakati’ hudumisha muundo wa muda wa Kiebrania; ‘lilipotimia’ ni usemi wa kawaida kwa neno au utabiri kutokea kama ulivyosemwa.
