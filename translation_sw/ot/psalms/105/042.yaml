lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu au msingi wa tendo lililotangulia; “kwa maana” kinafuata mtiririko wa ufafanuzi wa zaburi.
- source_word: זָכַר
  choice: alilikumbuka
  rationale: Kinahifadhi nahau ya kibiblia ya kukumbuka, ambayo katika muktadha wa agano huhusisha kutenda kulingana na neno lililotolewa, bila kuipanua moja kwa moja kuwa “alitimiza.”
- source_word: דְּבַר קָדְשׁוֹ
  choice: neno lake takatifu
  rationale: “Neno” linafuata nomino ya Kiebrania kwa karibu, huku “takatifu” likihifadhi uzito wa קֹדֶשׁ; katika muktadha neno hilo ni ahadi.
- source_word: אֶת אַבְרָהָם
  choice: alilomwambia Abrahamu
  rationale: אֵת ya pili inaunganisha Abrahamu na neno lililokumbukwa. Kitenzi cha uhusiano “alilomwambia” kinaonyesha kwa Kiswahili cha kawaida kwamba neno lilielekezwa kwake, bila kulifanya jina Abrahamu kuwa yambwa la kitenzi “kukumbuka.”
- source_word: עַבְדּוֹ
  choice: mtumishi wake
  rationale: Kwa Abrahamu katika uhusiano wake na Mungu, “mtumishi” ni la kawaida na la heshima kuliko “mtumwa,” bila kupoteza wazo la kuwa chini ya mamlaka ya Mungu.
theological_decisions:
- issue: Nguvu ya kiagano ya “alikumbuka”
  choice: Kuhifadhi “alilikumbuka” katika matini kuu.
  alternative: “alitimiza ahadi yake” au “alikumbuka ahadi yake ya agano”
  rationale: זָכַר inaweza kuashiria kutenda kwa uaminifu kwa agano, lakini matini yenyewe inasema kwamba Mungu alikumbuka; tafsiri haipaswi kuondoa nahau hiyo kwa kuingiza matokeo yake moja kwa moja.
- issue: Uhusiano kati ya “neno lake takatifu” na Abrahamu
  choice: “neno lake takatifu, alilomwambia Abrahamu”
  alternative: “ahadi yake takatifu kwa Abrahamu”
  rationale: Kiebrania hakina kihusishi cha wazi kabla ya Abrahamu. Kauli iliyochaguliwa hufanya uhusiano ueleweke kiasili kwa Kiswahili na huhifadhi “neno” badala ya kulibadili kabisa kuwa “ahadi.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo umegawanywa kwa koma ili sentensi isikike kiasili, na alama ya tanbihi [a] ipo katika matini kuu.
