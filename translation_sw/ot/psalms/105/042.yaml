  yaml_path: translation/ot/psalms/105/042.yaml
  text: For he remembered his holy word to Abraham his servant[a][b].
translation:
  language: sw
  text: Kwa maana alilikumbuka neno lake takatifu kwa Abrahamu, mtumishi wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Neno” hapa, katika muktadha, linaweza kumaanisha ahadi ya Mungu kwa Abrahamu.
