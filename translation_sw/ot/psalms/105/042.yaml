    rationale: The Hebrew names God’s holy word and Abraham but does not use a verb meaning “said” or “spoke.” A prepositional rendering retains the compact source expression and follows the audit trail more closely.
  - severity: low
    issue: The footnote states the contextual promise sense too categorically and expands it as something God “gave” Abraham.
    rationale: Although “word” refers contextually to God’s promise, the main lexical sense remains “word.” The note should identify “ahadi” as a contextual possible sense without adding unnecessary formulation.
