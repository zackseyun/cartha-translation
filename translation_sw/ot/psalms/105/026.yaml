  text: He sent Moses his servant[a], Aaron whom he had chosen.
translation:
  language: sw
  text: 'Alimtuma Musa, mtumishi wake,

    na Aroni, ambaye alimchagua.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye alikuwa amemchagua.” Kitenzi cha Kiebrania kinaweza kutafsiriwa kwa wakati uliopita sahili; wakati uliotangulia unaweza kueleza kwamba Aroni alichaguliwa kabla ya kutumwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: Alimtuma
  rationale: Qal timilifu, nafsi ya tatu umoja wa kiume. Kiima chake ni Mungu kutokana na muktadha; Kiswahili huunganisha kiima na yambwa katika kitenzi kwa njia ya kawaida.
- source_word: מֹשֶׁה עַבְדּוֹ
  choice: Musa, mtumishi wake
  rationale: עֶבֶד inaweza kumaanisha mtumwa au mtumishi, lakini hapa ni jina la heshima kwa Musa akiwa chini ya mamlaka ya Mungu; “mtumishi wake” ni ya asili na huhifadhi maana hiyo.
- source_word: אַהֲרֹן
  choice: Aroni
  rationale: Jina limetolewa kwa umbo la kawaida la Kiswahili la kibiblia.
- source_word: אֲשֶׁר
  choice: ambaye
  rationale: Kiwakilishi cha uhusiano kinamrejelea Aroni, mtu.
- source_word: בָּחַר בּוֹ
  choice: alikuwa amemchagua
  rationale: בחר pamoja na ב humaanisha kumchagua mtu. Umbo hili linaweka wazi kuwa kuchaguliwa kwa Aroni kulitangulia kutumwa kwake, huku tanbihi ikihifadhi uwezekano wa wakati uliopita sahili.
theological_decisions:
- issue: Kiima kisichotajwa wazi cha שָׁלַח
  choice: Kiima cha Mungu kimeonyeshwa kwa kiambishi “a-” katika “Alimtuma,” bila kuongeza jina lake.
  alternative: “BWANA alimtuma” au “Mungu alimtuma”
  rationale: Kiebrania hakitaji nomino katika mstari huu; kiima cha nafsi ya tatu kinatambulika kutoka muktadha. Kutoongeza jina kunahifadhi mtiririko wa matini.
- issue: Uhusiano wa wakati katika בָּחַר
  choice: “alikuwa amemchagua”
  alternative: “alimchagua”
  rationale: Wakati timilifu uliotangulia unaonyesha kwa asili kuwa uchaguzi ulitangulia kutumwa, lakini Kiebrania pia kinaweza kutafsiriwa kwa wakati uliopita sahili; ndiyo sababu mbadala umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa mistari unaakisi usambamba wa kishairi, na lugha imebaki wazi kwa msomaji wa kawaida.
