  text: He struck their vines and their fig trees[a], and shattered the trees of their territory.
translation:
  language: sw
  text: Alipiga mizabibu yao na mitini yao, akavunja miti ya eneo lao[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miti ndani ya mipaka yao.”
    reason: Mbadala wa kileksika kwa גְּבוּלָם, ambayo inaweza kumaanisha mipaka au eneo la mamlaka.
lexical_decisions:
- source_word: וַיַּךְ
  choice: Aliipiga
  rationale: Kitenzi נכה kinaonyesha tendo la kupiga. Muundo huu ni wa kawaida katika Kiswahili cha sasa na unaendeleza mtendaji wa kiume katika muktadha, yaani Mungu.
- source_word: גַּפְנָם
  choice: mizabibu yao
  rationale: גֶּפֶן humaanisha mzabibu; wingi unafaa kwa maana ya ujumla ya mimea yao ya kilimo.
- source_word: וּתְאֵנָתָם
  choice: na mitini yao
  rationale: תְּאֵנָה ni mtini. Ingawa umbo la Kiebrania ni umoja wenye maana ya kijumla, wingi wa Kiswahili unaonyesha kwa kawaida miti yao ya tini.
- source_word: וַיְשַׁבֵּר
  choice: akavunja
  rationale: Piel ya שׁבר inaonyesha kuvunja kwa nguvu. 'Akavunja' ni ya asili na yenye hadhi; katika muktadha wa miti, inaeleza uharibifu bila kulazimisha wazo la kuvunjika vipande vidogo.
- source_word: עֵץ
  choice: miti
  rationale: עֵץ inaweza kuwa 'mti' au 'mbao'; hapa muktadha wa uharibifu wa mimea unaelekeza kwenye miti iliyosimama, na wingi unaonyesha maana ya kijumla.
- source_word: גְּבוּלָם
  choice: katika eneo lao
  rationale: גְּבוּל inaweza kumaanisha mpaka au eneo lililo ndani ya mipaka. 'Katika eneo lao' ni Kiswahili cha asili kinachohifadhi maana ya mahali bila kuifanya iwe 'ardhi' kwa upana zaidi.
theological_decisions:
- issue: Mtendaji asiyeandikwa wazi wa vitenzi
  choice: Kiambishi cha nafsi 'a-' kinamrejelea Mungu kwa mujibu wa muktadha
  alternative: Kutaja wazi 'Mungu' au 'BWANA'
  rationale: Kiebrania kina vitenzi vya nafsi ya tatu ya kiume bila nomino ya mtendaji; muktadha wa zaburi unamtambulisha Mungu. Kiswahili kinaweza kuhifadhi mtiririko huo kwa kiambishi cha nafsi bila kuongeza jina lisilopo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inadumisha usambamba wa kishairi na vifungu viwili vya Kiebrania. Hakuna tanbihi iliyowekwa kwa sababu tofauti kati ya 'eneo lao' na 'ndani ya mipaka yao' haibadili maana kiasi cha kuhitaji tanbihi ya uchapishaji.
