translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri imetaja ‘Wamisri’ mwishoni ili kutofautisha wazi kati ya Waisraeli walioondoka na Wamisri walioingiwa na hofu.
