  text: Misri ilifurahi Waisraeli walipoondoka, kwa maana hofu ya Waisraeli ilikuwa imewaangukia Wamisri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂמַח
  choice: ilifurahi
  rationale: Kitenzi cha Qal timilifu kinaeleza hali iliyotimia ya furaha; umoja unapatana na jina la taifa ‘Misri’ likitumika kwa maana ya pamoja.
- source_word: מִצְרַיִם
  choice: Misri
  rationale: Jina linarejelea nchi na watu wake kwa pamoja; Kiswahili hutumia kwa kawaida ‘Misri’ kama kiima cha umoja.
- source_word: בְּצֵאתָם
  choice: walipoondoka
  rationale: 'ב pamoja na kitenzi-jina cha יצא na kiambishi cha wingi huonyesha wakati: walipotoka au walipoondoka; warejelewa ni Waisraeli.'
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi kinaanzisha sababu ya Misri kufurahi.
- source_word: נָפַל
  choice: ilikuwa imewaangukia
  rationale: Timilifu linaeleza hali iliyokuwapo tayari na kudumisha taswira ya Kiebrania ya hofu kuwaangukia watu.
- source_word: פַּחְדָּם
  choice: hofu yao
  rationale: פַּחַד ni hofu nzito; kiambishi ‘yao’ hapa kinaeleweka kama hofu iliyosababishwa na Waisraeli, yaani hofu dhidi yao.
- source_word: עֲלֵיהֶם
  choice: imewaangukia Wamisri
  rationale: Kiambishi kinarejelea Wamisri. Kutaja ‘Wamisri’ wazi huepusha mkanganyiko wa viwakilishi bila kubadili maana.
