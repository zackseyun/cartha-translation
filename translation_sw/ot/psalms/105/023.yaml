lexical_decisions:
- source_word: וַיָּבֹא
  choice: Ndipo ... akaingia
  rationale: Kitenzi בוא katika mfuatano wa simulizi kinaendeleza tukio; “ndipo” huonyesha mfuatano kwa Kiswahili cha kawaida, na “akaingia” linafaa kwa kuwasili katika nchi.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la kawaida la Kiswahili limehifadhiwa; hapa linatumika sambamba na “Yakobo” bila kuondoa urudiaji wa kishairi.
- source_word: מִצְרָיִם
  choice: Misri
  rationale: Hili ndilo jina la kawaida la nchi hiyo katika Kiswahili.
- source_word: וְיַעֲקֹב
  choice: naye Yakobo
  rationale: Jina limehifadhiwa ili kudumisha usambamba wa kishairi wa “Israeli // Yakobo”; “naye” huunganisha vipande viwili kwa kawaida.
- source_word: גָּר
  choice: akaishi kama mgeni
  rationale: Kitenzi גור kinaonyesha kuishi mahali kama mtu asiye mwenyeji; tafsiri hii huwasilisha kuishi huko pamoja na hali ya ugeni kwa lugha ya sasa.
- source_word: בְּאֶרֶץ
  choice: katika nchi ya
  rationale: אֶרֶץ hapa ni nchi au eneo; “katika nchi ya” ni muundo wa kawaida unaolitangulia jina linalofuata.
- source_word: חָם
  choice: Hamu
  rationale: Jina limetoholewa kwa namna ya kawaida ya Kiswahili, na usemi wa kishairi “nchi ya Hamu” umehifadhiwa badala ya kubadilishwa kuwa “Misri” katika matini.
theological_decisions:
- issue: Iwapo usambamba wa kishairi “Israeli // Yakobo” urahisishwe kuwa jina moja
  choice: Majina yote mawili yamehifadhiwa katika matini kuu
  alternative: Kutumia “Yakobo” pekee au “Israeli” pekee katika sehemu zote mbili
  rationale: Kiebrania kinatumia majina yote mawili kwa makusudi katika usambamba wa kishairi. Kuyahifadhi kunatunza mtindo na uhusiano wa mwakilishi kati ya babu huyo na watu wake bila kuongeza dai la kiteolojia lisilosemwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akaishi kama mgeni” ni wazi kwa wasomaji wa kawaida na huhifadhi maana ya kutokuwa mwenyeji. Kiashiria cha tanbihi [a] kimewekwa mara moja baada ya “nchi ya Hamu.”
