  text: וַ/יָּבֹ֣א יִשְׂרָאֵ֣ל מִצְרָ֑יִם וְ֝/יַעֲקֹ֗ב גָּ֣ר בְּ/אֶֽרֶץ חָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/023.yaml
  text: Then Israel came to Egypt[b][a], and Jacob lived as a foreigner in the land of Ham.
translation:
  language: sw
  text: Ndipo Israeli akaingia Misri, naye Yakobo akaishi kama mgeni katika nchi ya Hamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nchi ya Hamu” ni jina la kishairi linalomaanisha Misri.
