base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/034.yaml
  text: He spoke[a], and locusts came—young locusts without number.
translation:
  language: sw
  text: Alisema, nzige wakaja, na nzige waharibifu wasioweza kuhesabika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Alisema, nzige wakaja, na nzige waharibifu wasio na idadi.” Neno la Kiebrania יֶלֶק humaanisha mdudu anayeharibu mazao, yaelekea nzige wa hatua au aina fulani; tafsiri za zamani wakati mwingine hulitafsiri “viwavi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
  choice: Alisema
  rationale: Kitenzi hiki humaanisha kusema au kunena. “Alisema” ni cha kawaida na hakiongezi maana yenye nguvu zaidi ya “aliamuru,” ambayo haijaelezwa wazi katika Kiebrania.
- source_word: וַיָּבֹא
  choice: wakaja
  rationale: Umbo hili linasimulia kuwasili kwa pigo. Wingi unapatana kiasili na nomino ya mkusanyiko “nzige” katika Kiswahili.
- source_word: אַרְבֶּה
  choice: nzige
  rationale: Ingawa umbo la Kiebrania ni la umoja, neno hili hutumika kama nomino ya mkusanyiko; “nzige” huwasilisha kwa kawaida kundi la wadudu katika pigo.
- source_word: יֶלֶק
  choice: nzige walaji
  rationale: Neno hili humaanisha mdudu anayeharibu mazao na huhusishwa na istilahi za mapigo ya nzige. “Nzige walaji” huhifadhi wazo la aina au hatua ya nzige bila kutumia “viwavi,” ambalo linaweza kueleweka kimakosa kuwa mabuu ya vipepeo.
- source_word: וְאֵין מִסְפָּר
  choice: wasio na idadi
  rationale: Nahau hii humaanisha kwamba hawakuweza kuhesabika. “Wasio na idadi” ni ya kishairi, wazi, na karibu na muundo wa Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. “Naam” inaonyesha uhusiano wa kishairi kati ya aina mbili za nzige bila kulazimisha kwamba יֶלֶק ni nzige wachanga.
