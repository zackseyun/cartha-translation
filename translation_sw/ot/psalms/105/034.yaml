- from: Alisema, nzige wakaja, naam, nzige walaji wasio na idadi.[a]
  to: Alisema, nzige wakaja, na nzige waharibifu wasioweza kuhesabika.[a]
  rationale: The revision replaces the inaccurate “naam” with the source-equivalent conjunction “na.” It also uses an idiomatic rendering for the uncountable multitude. “Nzige waharibifu” preserves the likely locust-plague sense of יֶלֶק while avoiding a definitive claim about its precise biological stage, which remains uncertain and is explained in the footnote.
