review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents the sequence: God spoke, locusts came, followed by יֶלֶק in an uncountable quantity. However, “naam” means “yes/indeed” in Swahili and does not translate the Hebrew conjunction וְ (“and”).'
  naturalness: “Nzige wakaja” is acceptable elevated biblical-poetic Swahili. Replacing “naam” with “na” makes the coordination natural and accurate. “Wasioweza kuhesabika” is idiomatic and clear.
  terminology: “Nzige waharibifu” communicates the crop-devouring character associated with יֶלֶק without asserting too strongly that it is necessarily a juvenile locust stage. The footnote retains the lexical uncertainty and the traditional alternative “viwavi.”
  issues:
  - severity: high
    issue: “Naam” is used where the Hebrew has the simple conjunction וְ.
    rationale: In standard Swahili, “naam” means “yes” (or, in restricted rhetorical use, “indeed”), not “and.” It introduces an unwarranted emphatic affirmation and fails to render the source syntax.
  - severity: low
    issue: “Wasio na idadi” is understandable but less idiomatic here than “wasioweza kuhesabika.”
    rationale: The latter clearly expresses the Hebrew idiom אֵין מִסְפָּר, ‘without number/beyond counting,’ in modern standard Swahili.
  revised_text: Alisema, nzige wakaja, na nzige waharibifu wasioweza kuhesabika.[a]
