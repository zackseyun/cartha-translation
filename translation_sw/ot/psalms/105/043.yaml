  yaml_path: translation/ot/psalms/105/043.yaml
  text: So he brought out his people with joy[b][a], his chosen ones with singing.
translation:
  language: sw
  text: Akawatoa watu wake kwa furaha, wateule wake kwa shangwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa nyimbo za furaha” au “kwa kelele za shangwe.” Neno la Kiebrania linaweza kurejelea uimbaji au kilio cha shangwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: akawatoa
  rationale: Kitenzi cha Kiebrania katika Hifili kina maana ya kusababisha watoke; “akawatoa” ni Kiswahili cha kawaida na kinahifadhi wazo la kutoka Misri.
- source_word: עַמּוֹ
  choice: watu wake
  rationale: עַם hapa inawataja watu wa Mungu kama jamii yake; “watu wake” ni wazi na inafaa muktadha wa agano.
- source_word: בְשָׂשׂוֹן
  choice: kwa furaha
  rationale: Nomino hii humaanisha furaha au kufurahi; “kwa furaha” ni fupi, ya kawaida, na inaonyesha namna walivyotolewa.
- source_word: בְּרִנָּה
  choice: kwa shangwe
  rationale: רִנָּה inaweza kumaanisha kilio cha furaha, kushangilia, au uimbaji wa shangwe. “Kwa shangwe” huhifadhi upana huo kuliko kuifanya iwe uimbaji pekee.
- source_word: אֶת
  choice: '[kiashiria cha yambwa hakitafsiriwi]'
  rationale: Ni kiashiria cha yambwa mahsusi katika Kiebrania na hakina neno linalolingana moja kwa moja katika Kiswahili.
- source_word: בְּחִירָיו
  choice: wateule wake
  rationale: Neno linamaanisha wale aliowachagua Mungu. “Wateule wake” ni usemi wa kawaida wa kibiblia na hapa linaeleweka kwa upatanisho wake na “watu wake.”
theological_decisions:
- issue: Tafsiri ya בְּחִירָיו
  choice: wateule wake
  alternative: wale aliowachagua
  rationale: Maandishi yanawataja watu waliochaguliwa na Mungu, sambamba na “watu wake” katika muktadha wa kutoka Misri. “Wateule wake” ni fupi na inahifadhi maana ya uchaguzi bila kufafanua zaidi msingi au namna ya uchaguzi huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo sambamba wa kishairi umehifadhiwa, na “shangwe” limechaguliwa ili kutobana רִנָּה kuwa uimbaji pekee.
