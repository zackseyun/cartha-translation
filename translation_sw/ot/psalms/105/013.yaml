lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: Walizunguka
  rationale: Kauli ya hitpaeli ya הלך hapa inaonyesha mwendo wa mara kwa mara kutoka mahali hadi mahali. “Walizunguka” ni Kiswahili cha kawaida kinachobeba maana hiyo bila kudokeza kwamba walipotea njia.
- source_word: מִגּוֹי אֶל גּוֹי
  choice: kutoka taifa moja hadi taifa jingine
  rationale: “Taifa” linafaa kwa גּוֹי, na muundo huu wa Kiswahili unaonyesha wazi mwendo kati ya taifa moja na jingine huku ukihifadhi urudiaji wa Kiebrania.
- source_word: מִמַּמְלָכָה
  choice: kutoka ufalme mmoja
  rationale: “Ufalme” huhifadhi maana ya kisiasa ya מַמְלָכָה; “mmoja” hukamilisha kwa ufasaha muundo unaolinganishwa na “watu wengine.”
- source_word: אֶל עַם אַחֵר
  choice: hadi kwa watu wengine
  rationale: “Watu” huhifadhi tofauti ya kileksika kati ya עַם na מַמְלָכָה, nayo “wengine” huwakilisha אַחֵר kwa upatanisho wa kisarufi na nomino ya Kiswahili “watu.”
