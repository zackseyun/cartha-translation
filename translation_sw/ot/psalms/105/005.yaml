base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/005.yaml
  text: Remember the wonders that he has done[a], his signs and the judgments of his mouth[c][b],
translation:
  language: sw
  text: Kumbukeni maajabu aliyoyatenda[a], ishara zake[b], na hukumu za kinywa chake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “matendo yake ya ajabu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “miujiza yake” au “dalili zake za ajabu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “hukumu alizotamka” au “maagizo yaliyotoka kinywani mwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: Kumbukeni
  rationale: Ni amri ya wingi kutoka זכר, inayowataka wasikilizaji wayakumbuke kwa makusudi matendo ya Mungu. “Kumbukeni” ni ya kawaida, ya moja kwa moja, na yenye hadhi katika Kiswahili.
- source_word: נִפְלְאוֹתָיו
  choice: maajabu
  rationale: Neno hili linamaanisha matendo ya ajabu yanayoamsha mshangao. “Maajabu” ni fupi na ya asili, huku “matendo yake ya ajabu” ikihifadhiwa kama uwezekano katika tanbihi.
- source_word: אֲשֶׁר עָשָׂה
  choice: aliyoyatenda
  rationale: Kishazi hiki kinarejelea maajabu. “Aliyoyatenda” ni cha asili katika Kiswahili na kitenzi “kutenda” kinafaa kwa matendo makuu bila kuongeza maana isiyokuwamo.
- source_word: מֹפְתָיו
  choice: ishara zake
  rationale: מופת inaweza kumaanisha ishara, dalili ya ajabu, au muujiza unaothibitisha utendaji wa Mungu. “Ishara zake” huhifadhi upana huo bila kuifanya istilahi hiyo imaanishe miujiza pekee.
- source_word: וּמִשְׁפְּטֵי פִיו
  choice: na hukumu za kinywa chake
  rationale: מִשְׁפָּט inaweza kumaanisha hukumu, maagizo, au maamuzi ya kimahakama. Tafsiri hii huhifadhi taswira ya Kiebrania ya matamko yanayotoka kinywani mwa Mungu na kuacha wigo wa maana wazi.
- source_word: פִיו
  choice: kinywa chake
  rationale: Tafsiri ya moja kwa moja huhifadhi taswira ya kishairi na usemi wa kibinadamu unaotumiwa kumwelezea Mungu katika Kiebrania.
theological_decisions:
- issue: Uhusiano wa נִפְלְאוֹת na מֹפְתִים kama istilahi za matendo ya Mungu
  choice: Istilahi zinazotofautiana lakini zinazopishana, zilizotafsiriwa “maajabu” na “ishara”
  alternative: “matendo ya ajabu” na “miujiza,” au “maajabu” na “dalili za ajabu”
  rationale: Mstari huu unakusanya maneno kadhaa kuhusu matendo makuu ya Mungu bila kulazimisha tofauti ngumu ya kiteolojia kati yake. Maneno mawili tofauti yanahifadhi usambamba wa kishairi.
- issue: Maana ya מִשְׁפְּטֵי פִיו
  choice: Hukumu zilizotamkwa, kwa usemi halisi “hukumu za kinywa chake”
  alternative: “hukumu alizotamka” au “maagizo yaliyotoka kinywani mwake”
  rationale: Katika muktadha, huenda kifungu hiki kinarejelea maamuzi, hukumu, au maagizo ya Mungu. Tafsiri ya karibu huhifadhi taswira na kutosuluhisha kimya kimya wigo wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kishairi lakini unaeleweka kwa urahisi; taswira ya “kinywa chake” imehifadhiwa kwa makusudi.
