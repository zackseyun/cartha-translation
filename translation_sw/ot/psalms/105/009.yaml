lexical_decisions:
- source_word: אֲשֶׁר
  choice: alilolifanya
  rationale: Kiwakilishi rejeshi kinaunganisha mstari huu na ‘agano’ katika mstari uliotangulia; muundo wa ‘-lilo-’ huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: כָּרַת
  choice: alilolifanya
  rationale: Katika muktadha wa agano, kitenzi hiki ni sehemu ya nahau ya Kiebrania yenye maana ya kufanya agano. ‘Kufanya’ huwasilisha maana hiyo kwa Kiswahili cha asili bila kutafsiri nahau hiyo neno kwa neno.
- source_word: אֶת אַבְרָהָם
  choice: na Abrahamu
  rationale: Ingawa אֶת kwa kawaida hutambulisha yambwa, hapa Abrahamu ndiye mhusika mwingine katika kufanywa kwa agano; Kiswahili hutumia kwa kawaida ‘kufanya agano na mtu.’
- source_word: אַבְרָהָם
  choice: Abrahamu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: וּשְׁבוּעָתוֹ
  choice: na kiapo chake
  rationale: Tafsiri hii huhifadhi nomino ‘kiapo’ na kiambishi cha nafsi ya tatu umoja ‘chake’ kwa ufupi na uaminifu.
- source_word: לְיִשְׂחָק
  choice: kwa Isaka
  rationale: Kihusishi לְ kinaonyesha mtu ambaye kiapo kilielekezwa kwake au kilimhusu; ‘kwa Isaka’ ni usemi wa kawaida wa Kiswahili katika muktadha huu.
theological_decisions:
- issue: Neno ‘agano’ limeachwa kudokezwa kutoka mstari uliotangulia
  choice: Kutumia ‘alilolifanya na Abrahamu,’ huku ‘agano’ likieleweka kutoka Zaburi 105:8.
  alternative: ‘alilolikata na Abrahamu’ au ‘agano alilofanya na Abrahamu’
  rationale: Kiebrania hakirudii nomino ‘agano’ katika mstari huu, bali huitegemea kutoka mstari uliotangulia. Tafsiri iliyochaguliwa huhifadhi mshikamano huo na maana ya nahau bila kuongeza nomino katika mstari huu; tanbihi inaeleza maana halisi ya kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Koma baada ya tanbihi hudumisha muundo wa kishairi unaoendelea hadi kishazi cha pili.
