  text: alilolifanya na Abrahamu,[a] na kiapo chake kwa Isaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kihalisi, “alilolikata na Abrahamu,” nahau yenye maana ya kufanya agano.
