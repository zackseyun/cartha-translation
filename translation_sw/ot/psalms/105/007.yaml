lexical_decisions:
- source_word: הוּא
  choice: Yeye ndiye
  rationale: Kiwakilishi huru kinasisitiza utambulisho; Kiswahili cha asili hutumia “Yeye ndiye” kuwasilisha msisitizo huo na kishirikishi kinachodokezwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa moja kwa moja kuwa “Yahwe,” badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Umbo lenye kiambishi cha nafsi ya kwanza wingi humaanisha moja kwa moja “Mungu wetu.”
- source_word: בְּכָל הָאָרֶץ
  choice: katika dunia yote
  rationale: Hapa אֶרֶץ ina upeo wa ulimwengu mzima katika muktadha wa zaburi, hivyo “dunia” inafaa kuliko “nchi.”
- source_word: מִשְׁפָּטָיו
  choice: hukumu zake
  rationale: Neno linaweza kumaanisha hukumu, maagizo ya kisheria, au haki inayotekelezwa; “hukumu zake” huhifadhi maana pana bila kuibana kupita kiasi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi YHWH; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha na cheo.
- issue: Upeo wa מִשְׁפָּטָיו
  choice: hukumu zake
  alternative: maagizo yake; haki yake
  rationale: Tafsiri hii inadumisha mvutano wa kimaana kati ya maamuzi ya Mungu, sheria zake, na utekelezaji wa haki bila kuchagua maana finyu kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Yeye ndiye” huhifadhi msisitizo wa Kiebrania; “ziko” ni muundo wa sasa wa kawaida kwa “hukumu.”
