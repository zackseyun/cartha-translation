translation:
  language: sw
  text: Aliifanya mvua yao kuwa mvua ya mawe, na moto wenye miali[a] katika nchi yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umeme” au “miale ya umeme”; kirai hiki kwa tafsiri ya moja kwa moja ni “moto wa miali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: Aliwapa
  rationale: Kitenzi hiki kwa kawaida humaanisha ‘kutoa’ au ‘kupa.’ ‘Aliwapa’ kinadumisha tamathali ya Kiebrania na kuonyesha kwamba Mungu ndiye aliyesababisha pigo hilo.
- source_word: גִּשְׁמֵיהֶם בָּרָד
  choice: mvua ya mawe badala ya mvua
  rationale: Kirai hicho kinaonyesha kwamba mvua yao ya kawaida ilibadilishwa na kuwa mvua ya mawe. Uundaji huu ni wa asili katika Kiswahili na unahifadhi uhusiano uliopo kati ya ‘mvua’ na ‘mvua ya mawe.’
- source_word: בָּרָד
  choice: mvua ya mawe
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa barafu inayonyesha kutoka mawinguni, nalo linaendana moja kwa moja na simulizi la pigo.
- source_word: אֵשׁ לֶהָבוֹת
  choice: moto wenye miali
  rationale: Kiebrania kinaunganisha ‘moto’ na ‘miali.’ Tafsiri hii inadumisha msisitizo na taswira yake bila kuamua kimyakimya kwamba jambo hilo lilikuwa radi.
- source_word: בְּאַרְצָם
  choice: katika nchi yao
  rationale: Kihusishi kina maana ya kawaida ya ‘katika,’ na katika muktadha huu nchi inayorejelewa ni Misri.
theological_decisions:
- issue: Asili ya אֵשׁ לֶהָבוֹת katika muktadha wa pigo
  choice: moto wenye miali
  alternative: radi; mishale ya moto
  rationale: Simulizi la pigo katika Kutoka linaweza kudokeza radi, lakini maneno ya Kiebrania yenyewe yanasema ‘moto’ na ‘miali.’ Matini kuu inadumisha taswira pana, huku tanbihi ikihifadhi uwezekano wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Tanbihi imewekwa baada ya kirai ‘moto wenye miali,’ ambacho ndicho inachofafanua.
