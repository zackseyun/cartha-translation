  language: en
  yaml_path: translation/ot/psalms/105/008.yaml
  text: He remembers his covenant forever[a], the word he commanded for a thousand generations.
translation:
  language: sw
  text: 'Hukumbuka agano lake milele,[a]

    neno aliloamuru kwa vizazi elfu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ahadi aliyoiweka kwa vizazi elfu.”
    reason: 'Mbadala wa kimuktadha: דָּבָר inaweza kurejelea ahadi ya agano. “Aliyoiweka” huwasilisha kwa Kiswahili cha kawaida dhana ya tamko la agano lililoamuriwa/kuwekwa, bila kubadili matini kuu inayohifadhi “neno.”'
lexical_decisions:
- source_word: זָכַר
  choice: Hukumbuka
  rationale: Kauli timilifu ya Kiebrania hapa inaeleza uaminifu wa Mungu unaodumu. Kiswahili cha mazoea ‘hukumbuka’ kinaonyesha tendo la kudumu bila kulifunga katika wakati mmoja uliopita.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Hili ndilo neno la kawaida na lenye hadhi katika Kiswahili kwa muda usio na mwisho au unaodumu daima.
- source_word: בְּרִיתוֹ
  choice: agano lake
  rationale: ‘Agano’ ni kisawe cha kawaida cha kibiblia cha בְּרִית na kinafaa katika muktadha wa uhusiano wa Mungu na watu wake.
- source_word: דָּבָר
  choice: neno
  rationale: ‘Neno’ linahifadhi upana wa דָּבָר na ulinganifu wake wa kishairi na ‘agano’; maana ya ‘ahadi’ imehifadhiwa katika tanbihi.
- source_word: צִוָּה
  choice: aliloamuru
  rationale: Kitenzi צוה kwa msingi wake humaanisha kuamuru. Tafsiri hii pia inadumisha nguvu ya tamko la Mungu bila kulipanua kimafundisho kuwa ‘aliloweka’ au ‘alilithibitisha.’
- source_word: לְאֶלֶף דּוֹר
  choice: kwa vizazi elfu
  rationale: ‘Kwa’ huonyesha upeo wa muda, na ‘vizazi’ ni wingi wa kawaida wa Kiswahili baada ya idadi elfu, ingawa דּוֹר ni umbo la umoja katika Kiebrania.
theological_decisions:
- issue: Wakati na hali ya Mungu kukumbuka
  choice: Hukumbuka—tendo la kudumu na la kawaida
  alternative: Alikumbuka; amekumbuka
  rationale: Muktadha unasifu uaminifu wa Mungu unaoendelea. ‘Hukumbuka’ huepuka kuifanya kumbukumbu hiyo kuwa tukio moja tu la zamani.
- issue: Maana ya דָּבָר katika ulinganifu na agano
  choice: Neno katika matini kuu
  alternative: Ahadi
  rationale: דָּבָר ni neno pana linaloweza kumaanisha tamko au ahadi ya agano. ‘Neno’ linadumisha uwazi wa kileksika na mvutano wa asili, huku ‘ahadi’ ikitolewa kama uwezekano katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni mfupi, wa kishairi na wenye hadhi. ‘Hukumbuka’ ni ya kawaida na inaeleweka kwa wasomaji wa sasa, na mpangilio wa vifungu unafuata kwa karibu ulinganifu wa Kiebrania.
