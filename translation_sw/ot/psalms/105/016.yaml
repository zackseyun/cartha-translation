translation:
  language: sw
  text: Aliita njaa ije katika nchi; akavunja tegemeo lote la chakula.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiba yote ya chakula”; kwa maana halisi, “kila fimbo ya chakula,” nahau ya Kiebrania inayomaanisha akiba au tegemeo la chakula.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Aliita ... ije
  rationale: Muundo huu unaonyesha kwamba Mungu aliita au aliagiza njaa ije, huku ukibaki wa kawaida na wazi katika Kiswahili.
- source_word: רָעָב
  choice: njaa
  rationale: Katika muktadha huu neno linamaanisha upungufu mkubwa wa chakula unaoathiri nchi, si hisia ya mtu binafsi ya kuwa na njaa.
- source_word: עַל הָאָרֶץ
  choice: juu ya nchi
  rationale: Hii inawakilisha kwa uwazi eneo lililoathiriwa bila kulifanya kuwa dunia nzima.
- source_word: כָּל
  choice: kila
  rationale: Neno hili linaonyesha ujumla kamili wa tegemeo la chakula.
- source_word: מַטֵּה לֶחֶם
  choice: tegemeo la chakula
  rationale: Kirai cha Kiebrania ni sitiari ya fimbo inayotegemeza; katika muktadha humaanisha chakula ambacho maisha hutegemea. Kiswahili hiki kinahifadhi wazo la utegemezo kwa namna inayoeleweka.
- source_word: שָׁבָר
  choice: akavunja
  rationale: Kitenzi hiki huhifadhi taswira ya Kiebrania ya kuvunja kile kinachotegemeza maisha.
theological_decisions:
- issue: Utendaji wa Mungu katika kuleta njaa
  choice: Vitenzi “Aliita” na “akavunja” vina Mungu kama mtendaji.
  alternative: Kutaja njaa na kukosekana kwa chakula kama matukio yasiyo na mtendaji aliyetajwa.
  rationale: Katika muktadha wa zaburi, mtendaji wa vitenzi vya umoja wa kiume ni Mungu. Tafsiri inahifadhi utendaji huo bila kuongeza maelezo ya sababu au kusudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Tegemeo la chakula” linaeleweka kwa urahisi huku likihifadhi sitiari ya kitu kinachotegemeza maisha; maana halisi zaidi imewekwa katika tanbihi.
