lexical_decisions:
- source_word: גַּם
  choice: Hata
  rationale: Inaonyesha msisitizo kwamba Ashuru pia, jambo la kuongezea uzito, alijiunga na muungano huo.
- source_word: אַשּׁוּר
  choice: Ashuru
  rationale: Hili ndilo jina la kawaida la dola hiyo katika Kiswahili cha Biblia na linatambulika kwa urahisi.
- source_word: נִלְוָה עִמָּם
  choice: alijiunga nao
  rationale: Nifali ya לוה ina maana ya kuambatana au kujiunga; kauli hii ni ya kawaida na haiingizi kwa lazima wazo pana zaidi la kufanya agano.
- source_word: הָיוּ זְרוֹעַ
  choice: wakawa mkono wa kuwasaidia
  rationale: Inahifadhi taswira halisi ya 'mkono' huku ikifafanua kwa lugha ya kawaida kazi yake kama msaada au nguvu ya kijeshi.
- source_word: לִבְנֵי לוֹט
  choice: wazao wa Loti
  rationale: Katika muktadha huu בני ni watu waliotokana na Loti, hasa mataifa ya Moabu na Amoni; 'wazao' huwasilisha maana hiyo kwa Kiswahili cha sasa bila utata wa kijinsia.
- source_word: סֶלָה
  choice: Sela
  rationale: Neno limenakiliwa kwa kuwa maana au kazi yake kamili katika zaburi haijulikani kwa uhakika.
