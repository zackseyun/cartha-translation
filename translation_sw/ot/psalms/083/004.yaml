  yaml_path: translation/ot/psalms/083/004.yaml
  text: They say[a], “Come, let us wipe them out as a nation, so that the name of Israel will be remembered no more.”
translation:
  language: sw
  text: Wanasema, “Njooni, tuwaangamize ili wasiwe taifa, ili jina la Israeli lisikumbukwe tena.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמְרוּ
  choice: Wanasema
  rationale: Ingawa umbo la Kiebrania ni timilifu, wakati wa sasa wa kisimulizi unaleta uhai wa kishairi na kuonyesha wazi nia yao inayowakabili watu wa Mungu.
- source_word: לְכוּ
  choice: Njooni
  rationale: Amri ya הלך hapa ni mwito wa kuhamasishana katika njama, si maelekezo ya mahali; “Njooni” ni ya kawaida na yenye nguvu katika Kiswahili.
- source_word: וְנַכְחִידֵם
  choice: tuwaangamize
  rationale: Hifili ya כחד ina maana ya kuwasababisha watoweke au kuwakomesha kabisa; “tuwaangamize” huhifadhi uzito wa nia hiyo.
- source_word: מִגּוֹי
  choice: wasiwe taifa
  rationale: Kirai hiki kinaonyesha kuondolewa katika hali ya kuwa taifa au jamii ya watu. Uundaji huu ni wa asili katika Kiswahili na unaweka wazi lengo lao.
- source_word: וְלֹא יִזָּכֵר
  choice: ili ... lisikumbukwe
  rationale: Nifali ya זכר ni ya kutendwa, “kukumbukwa”; “ili” huonyesha kusudi la njama bila kubadili maana ya msingi.
- source_word: שֵׁם יִשְׂרָאֵל
  choice: jina la Israeli
  rationale: Huhifadhi muundo na taswira ya Kiebrania, ambapo “jina” linawakilisha pia utambulisho wa watu.
- source_word: עוֹד
  choice: tena
  rationale: Katika sentensi hasi, “tena” kwa kawaida humaanisha kutokuwapo au kutotendeka jambo kuanzia hapo na kuendelea.
