  text: שִׁיתֵ֣/מוֹ נְ֭דִיבֵ/מוֹ כְּ/עֹרֵ֣ב וְ/כִ/זְאֵ֑ב וּֽ/כְ/זֶ֥בַח וּ֝/כְ/צַלְמֻנָּ֗ע כָּל נְסִיכֵֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/011.yaml
  text: Make their nobles like Oreb and Zeeb[a], and all their princes like Zebah and Zalmunna.
translation:
  language: sw
  text: Wafanye wakuu wao wawe kama Orebu na Zeebu,[a] na watawala wao wote kama Zeba na Zalmuna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Orebu na Zeebu walikuwa viongozi wa Midiani walioshindwa katika Waamuzi 7:25; Zeba na Zalmuna walikuwa wafalme wa Midiani walioshindwa katika Waamuzi 8:5–21.
    reason: cross_reference
lexical_decisions:
- source_word: שִׁיתֵמוֹ
  choice: Wafanye ... wawe kama
  rationale: Kauli ya amri inayoelekezwa kwa Mungu; muundo huu wa Kiswahili unaonyesha ombi la kuwafanya viongozi wao wapate mwisho kama wa watu wanaotajwa.
- source_word: נְדִיבֵמוֹ
  choice: wakuu wao
  rationale: Neno נָדִיב hapa humaanisha watu mashuhuri au viongozi wenye cheo; “wakuu” ni la kawaida na hutofautishwa na “watawala” katika mstari unaofuatana.
- source_word: כְּעֹרֵב וְכִזְאֵב
  choice: kama Orebu na Zeebu
  rationale: Majina ya watu yamenukuliwa kwa maumbo yanayosomeka kiasili katika Kiswahili; neno “kama” linatawala majina yote mawili.
- source_word: וּכְזֶבַח וּכְצַלְמֻנָּע
  choice: kama Zeba na Zalmuna
  rationale: Majina haya ya kihistoria yamehifadhiwa badala ya kutafsiri maana zake; ulinganisho mmoja wa “kama” unatosha katika Kiswahili.
- source_word: כָּל
  choice: wote
  rationale: Limehifadhiwa wazi kuonyesha kwamba ombi linawahusu watawala wao kwa ujumla.
- source_word: נְסִיכֵמוֹ
  choice: watawala wao
  rationale: נָסִיךְ humaanisha mkuu au mtawala; “watawala” ni wazi kwa wasomaji wa leo na hudumisha utofauti wa kimtindo na “wakuu”.
theological_decisions:
- issue: Dokezo la kihistoria katika ombi la hukumu
  choice: Majina yamehifadhiwa kama viongozi maalumu wa Midiani ambao kushindwa kwao kunatumiwa kuwa kielelezo cha hukumu inayoombwa.
  alternative: Kuyachukulia majina hayo kama mifano ya jumla tu ya maadui walioshindwa.
  rationale: Waamuzi 7–8 huwatambulisha Orebu, Zeebu, Zeba na Zalmuna kama viongozi maalumu wa Midiani. Kuwataja bila ufafanuzi wa ziada katika mstari kunahifadhi dokezo hilo la kihistoria na uzito wa ombi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi ni mfupi, wenye ulinganifu kati ya “wakuu” na “watawala.”
