  text: As fire burns a forest[a], and as a flame sets the mountains ablaze,
translation:
  language: sw
  text: 'Kama moto unavyoteketeza msitu,

    na kama mwali unavyowasha milima,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kama moto unavyounguza msitu, na kama mwali unavyounguza milima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/אֵשׁ
  choice: Kama moto
  rationale: Kiambishi כְּ kinaonyesha ulinganisho; “kama moto” ni tashbihi ya kawaida na ya kishairi katika Kiswahili.
- source_word: תִּבְעַר
  choice: unavyoteketeza
  rationale: Kitenzi בער katika Qal kinaeleza moto unaounguza msitu; “kuteketeza” hudokeza nguvu ya moto bila kuongeza wazo lisilokuwamo katika muktadha.
- source_word: יָעַר
  choice: msitu
  rationale: Nomino hii humaanisha msitu au eneo lenye miti; “msitu” ni neno la kawaida na sahihi katika Kiswahili sanifu.
- source_word: וּכְ/לֶהָבָה
  choice: na kama mwali
  rationale: Muundo huu unaendeleza tashbihi sambamba; “mwali” huhifadhi tofauti ya kishairi kati ya אֵשׁ, moto, na לֶהָבָה, mwali.
- source_word: תְּלַהֵט
  choice: unavyowasha
  rationale: Piel ya להט inaonyesha kitendo chenye nguvu cha kuwafanya milima iwake; “kuwasha” huhifadhi maana hiyo ya kusababisha kuwaka.
- source_word: הָרִים
  choice: milima
  rationale: Nomino hii ni wingi wa “mlima.” Kiswahili hakihitaji kuonyesha kibainishi cha Kiebrania kwa neno tofauti katika muktadha huu wa kishairi.
