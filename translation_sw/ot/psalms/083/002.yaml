lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Kwa maana, tazama
  rationale: 'כִּי inaonyesha sababu inayounganisha mstari huu na ombi lililotangulia, na הִנֵּה ni mwito wa kuelekeza fikira: “tazama.”'
- source_word: יֶהֱמָיוּן
  choice: wanafanya ghasia
  rationale: Kitenzi הָמָה huonyesha kelele, msukosuko, au vurugu ya umati; “wanafanya ghasia” ni ya kawaida na huhifadhi wazo la makelele yenye uhasama.
- source_word: נָשְׂאוּ רֹאשׁ
  choice: wameinua vichwa vyao
  rationale: Nahau hii inaashiria kujitokeza kwa kiburi au ujasiri wa uasi. Tafsiri ya karibu huhifadhi taswira ya Kiebrania bila kuifungia katika maana moja tu.
theological_decisions:
- issue: Maana ya nahau נָשְׂאוּ רֹאשׁ
  choice: wameinua vichwa vyao
  alternative: wamejivuna / wameinuka kwa ujasiri
  rationale: Taswira ya asili imehifadhiwa ili kutorazimisha iwapo mkazo ni kiburi, kujiamini, au kuanza upinzani wazi.
