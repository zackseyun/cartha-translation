  text: Ee Mungu[a], usinyamaze; usikae kimya[b], wala usitulie, Ee Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinatumia majina mawili tofauti ya Mungu katika mstari huu: אֱלֹהִים (Elohim, “Mungu”) na אֵל (El, “Mungu,” labda “Mwenye Nguvu”).'
    reason: lexical_alternative
  - marker: b
    text: Au “usiwe kiziwi.” Kitenzi cha Kiebrania kinaweza pia kueleweka kuwa na maana ya kuwa kimya au kuwa kiziwi.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Ni usemi wa kumwita Mungu moja kwa moja katika sala; “Ee Mungu” ni wa kawaida, wenye heshima, na unaofaa katika ushairi wa Kiswahili.
- source_word: אַל
  choice: usi- / wala usi-
  rationale: Kikanushi hiki cha ombi au kusihi kimetafsiriwa kwa hali ya kukataza ya Kiswahili, hivyo kudumisha uzito wa ombi.
- source_word: דֳּמִי לָךְ
  choice: usinyamaze
  rationale: Kirai hiki kinamwomba Mungu asiendelee kuwa kimya au kutochukua hatua. “Usinyamaze” ni cha asili na hudumisha uharaka wa sala.
- source_word: תֶּחֱרַשׁ
  choice: usikae kimya
  rationale: Kitenzi kinaweza kuhusishwa na kuwa kimya, na katika baadhi ya uchanganuzi kutosikia. Tafsiri hii hudumisha urudiaji wa kishairi bila kuamua kwamba Mungu anaombwa ‘asiwe kiziwi.’
- source_word: וְאַל תִּשְׁקֹט
  choice: wala usitulie
  rationale: שׁקט huonyesha utulivu, ukimya, au kutofanya jambo. “Wala usitulie” hudumisha kilele cha mistari sambamba na wazo la kutokaa bila kuchukua hatua.
- source_word: אֵל
  choice: Ee Mungu
  rationale: Hili ni jina la pili la Mungu linalofunga mstari. “Ee Mungu” ni la kawaida katika Kiswahili; tofauti ya majina mawili ya Kiebrania imeelezwa katika tanbihi.
theological_decisions:
- issue: Kutafsiri majina ya Mungu אֱלֹהִים na אֵל katika mwito wa moja kwa moja
  choice: Yote yametafsiriwa “Mungu,” huku tofauti yake ikielezwa katika tanbihi.
  alternative: Kutafsiri אֵל kuwa “Ee Mwenye Nguvu” ili kuonyesha tofauti ya msamiati.
  rationale: Majina haya yanahusiana lakini ni tofauti katika Kiebrania. Kurudia “Ee Mungu” kunasikika kwa kawaida na kwa heshima katika sala ya Kiswahili bila kulazimisha maana ya ziada; tanbihi huhifadhi tofauti ya chanzo.
- issue: Maana ya תֶּחֱרַשׁ
  choice: “usikae kimya”
  alternative: “usijifanye husikii” au “usiwe kiziwi”
  rationale: Katika muktadha huu maana ya kuwa kimya ndiyo inayofaa zaidi, lakini kitenzi kinaweza kugusa pia wazo la kutosikia. Tanbihi huhifadhi uwezekano huo bila kuufanya kuwa tafsiri kuu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kishairi wa maombi umehifadhiwa kwa vitenzi vitatu vinavyoongeza uzito: “usinyamaze; usikae kimya, wala usitulie.” Alama zote za tanbihi zimewekwa katika matini kuu.'
