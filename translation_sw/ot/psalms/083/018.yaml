lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: Wajue
  rationale: Kauli ya ombi inayofuata muktadha wa sala katika zaburi; ni ya asili na fupi katika Kiswahili.
- source_word: כִּי
  choice: kwamba
  rationale: Inatanguliza maudhui wanayopaswa kujua.
- source_word: שִׁמְךָ יְהוָה
  choice: ambaye jina lako ni Yahwe
  rationale: Inahifadhi muundo wa utambulisho wa Kiebrania kwa lugha ya Kiswahili iliyo wazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni unukuzi wa jina la Mungu la herufi nne, badala ya kulibadilisha kuwa cheo.
- source_word: לְבַדֶּךָ
  choice: wewe peke yako
  rationale: Inasisitiza upekee wa anayezungumziwa.
- source_word: עֶלְיוֹן
  choice: Uliye Juu Zaidi
  rationale: Ni cheo cha kimungu kinachoonyesha ukuu usio na kifani.
- source_word: עַל כָּל הָאָרֶץ
  choice: juu ya dunia yote
  rationale: עַל huonyesha mamlaka kuu, na הָאָרֶץ hapa ina upeo wa dunia nzima.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Upekee unaoonyeshwa na לְבַדֶּךָ
  choice: wewe peke yako ... ndiwe Uliye Juu Zaidi
  alternative: jina lako peke yake ni Yahwe
  rationale: Muundo na muktadha unaunganisha upekee hasa na kuwa kwake Aliye Juu Zaidi, huku nafasi ya neno la Kiebrania ikiruhusu mvutano fulani wa kisintaksia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “ambaye jina lako ni Yahwe” huhifadhi utambulisho wa Kiebrania, na “ndiwe” huonyesha mkazo wa לְבַדֶּךָ kwa njia ya asili.
