  text: Let them be put to shame and be terrified forever[a]; let them be disgraced and perish.
translation:
  language: sw
  text: Waaibike[a] na waingiwe na hofu milele; wafedheheke na waangamie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waaibishwe.” Kiebrania kinatumia maneno mawili yanayohusiana kwa karibu kuhusu aibu (בוש, חפר); neno la pili linaweza kusisitiza fedheha au udhalilishaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: Waaibishwe
  rationale: 'Kitenzi בוש katika mfululizo huu wa maombi ya hukumu kina nguvu ya ombi: wapate aibu au watiwe aibu. “Waaibishwe” ni Kiswahili cha kawaida kinachoonyesha matokeo hayo bila kukifanya kuwa taarifa ya wakati ujao.'
- source_word: וְיִבָּהֲלוּ
  choice: na waingiwe na hofu
  rationale: Nifali ya בהל huonyesha kuvurugika, kufadhaika, au kuogopa sana. “Waingiwe na hofu” ni usemi wa asili unaodumisha uzito wa muktadha bila kuongeza namna mahususi ya hofu.
- source_word: עֲדֵי עַד
  choice: milele
  rationale: Nahau hii ya Kiebrania husisitiza muda usio na mwisho; “milele” ni tafsiri fupi na ya kawaida katika Kiswahili.
- source_word: וְיַחְפְּרוּ
  choice: wafedheheke
  rationale: חפר inahusiana kwa karibu na aibu lakini inaweza kusisitiza fedheha. “Wafedheheke” huitofautisha kwa kiasi na בוש huku ikidumisha urudiaji wa kimakusudi wa wazo la aibu.
- source_word: וְיֹאבֵדוּ
  choice: na waangamie
  rationale: אבד hapa humaanisha kupotea au kuangamia. “Waangamie” hudumisha nguvu ya ombi bila kubainisha njia ya maangamizi.
theological_decisions:
- issue: Nguvu ya vitenzi vya ombi la hukumu
  choice: 'Kutumia hali ya kutakia/kuomba: “waaibishwe ... waingiwe ... wafedheheke ... waangamie”'
  alternative: “Wataaibishwa na kuingiwa na hofu milele; watafedheheka na kuangamia”
  rationale: Katika muktadha, vitenzi vya wakati usiotimilika vinafanya kazi kama matakwa au maombi dhidi ya maadui, si utabiri wa kawaida wa wakati ujao. Hali ya kutakia katika Kiswahili huhifadhi nguvu hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Ulinganifu wa vipashio na marudio ya wazo la aibu umehifadhiwa.
