  text: כִּ֤י נוֹעֲצ֣וּ לֵ֣ב יַחְדָּ֑ו עָ֝לֶ֗י/ךָ בְּרִ֣ית יִכְרֹֽתוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/005.yaml
  text: For they have conspired together with one heart[b][a]; against you they make a covenant.
translation:
  language: sw
  text: Kwa maana wamepanga njama kwa moyo mmoja[a]; dhidi yako wanafanya agano[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wameshauriana pamoja kwa moyo mmoja.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “wanakata agano dhidi yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya ombi la mtunga zaburi katika muktadha unaotangulia.
- source_word: נוֹעֲצוּ
  choice: wamepanga njama
  rationale: Nifali ya יעץ inaonyesha kushauriana au kupanga kwa pamoja; muktadha wa uadui unaunga mkono ‘kupanga njama’ bila kufuta uwezekano wa maana ya msingi ya kushauriana.
- source_word: לֵב יַחְדָּו
  choice: kwa moyo mmoja
  rationale: Inahifadhi taswira ya Kiebrania ya moyo kama kitovu cha nia, pamoja na wazo la umoja wa kusudi.
- source_word: עָלֶיךָ
  choice: dhidi yako
  rationale: Katika muktadha wa mipango ya uadui na agano, עַל ina nguvu ya kupinga.
- source_word: בְּרִית
  choice: agano
  rationale: Neno hili linahifadhi uzito wa makubaliano rasmi na yenye kuwafunga wahusika.
- source_word: יִכְרֹתוּ
  choice: wanafanya
  rationale: כרת pamoja na ברית ni nahau ya Kiebrania, kihalisi ‘kukata agano’; Kiswahili cha kawaida husema ‘kufanya agano’.
theological_decisions:
- issue: Lugha ya mapatano ya uadui yanayoelekezwa dhidi ya Mungu
  choice: dhidi yako wanafanya agano
  alternative: wanafanya muungano dhidi yako
  rationale: ‘Agano’ linadumisha uzito wa ברית, huku ‘dhidi yako’ likiweka wazi elekeo la uasi bila kulifanya kuwa uratibu wa kisiasa tu.
- issue: Kiwango cha uadui kinachodokezwa na נוֹעֲצוּ
  choice: wamepanga njama
  alternative: wameshauriana
  rationale: Muktadha unaonyesha shauri lenye nia ya uadui, lakini tanbihi inadumisha maana pana zaidi ya kitenzi ili kutotatua kimya kimya utata wake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kwa moyo mmoja’ inadumisha taswira ya asili huku ‘wamepanga njama’ ikitoa kwa uwazi nia ya uadui inayoonekana katika muktadha.
