lexical_decisions:
- source_word: אֲשֶׁר אָמְרוּ
  choice: waliosema
  rationale: Kiwakilishi cha uhusiano pamoja na kitenzi cha wakati uliopita kinaunganisha mstari huu na maadui waliotajwa katika muktadha uliotangulia.
- source_word: נִירֲשָׁה
  choice: Na tuyatwae
  rationale: Kitenzi ירשׁ hapa kinaonyesha kutwaa na kumiliki katika muktadha wa uadui. ‘Tuyatwae’ ni cha kawaida na chenye nguvu bila kulazimisha maana kuwa ‘kurithi’.
- source_word: לָּנוּ
  choice: kwa ajili yetu wenyewe
  rationale: Kirai hiki kinaonyesha faida na umiliki unaokusudiwa na wasemaji, na kuhifadhi msisitizo wa kujinufaisha.
- source_word: נְאוֹת
  choice: malisho
  rationale: Neno hili linaweza kumaanisha malisho, makao, au mahali pa kukaa. ‘Malisho’ linahifadhi picha halisi ya Kiebrania huku uwezekano mwingine ukitolewa katika tanbihi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika zaburi hii neno hilo linamtaja Mungu wa Israeli, hivyo umoja unafaa.
theological_decisions:
- issue: Maana ya נְאוֹת אֱלֹהִים
  choice: malisho ya Mungu
  alternative: makao ya Mungu; mahali pa Mungu pa kukaa
  rationale: Kirai kinaweza kutaja ardhi yenye malisho iliyo mali ya Mungu au makao yanayohusishwa naye. Tafsiri kuu inahifadhi picha ya Kiebrania bila kuifungamanisha na hekalu pekee, na maana nyingine zinahifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo wa kishairi ulio wazi na wenye heshima. ‘Na tuyatwae’ hudumisha sauti ya azimio la pamoja, na ‘kwa ajili yetu wenyewe’ huonyesha wazi nia ya kujipatia umiliki.
