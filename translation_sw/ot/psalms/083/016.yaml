  text: Wajaze nyuso zao kwa aibu[a], ili watafute jina lako, Ee Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “na watafute jina lako”; kitenzi cha Kiebrania kinaweza kueleweka kama mwendelezo rahisi wa ombi, ingawa hapa huenda kinaonyesha kusudi au matokeo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלֵּא
  choice: Wajaze
  rationale: Kitenzi cha kuamuru katika Piel, nafsi ya pili umoja wa kiume, kinachoelekezwa kwa Mungu. “Wajaze” huhifadhi maana ya msingi ya kufanya kitu kijae na kinaendana kiasili na “nyuso zao.”
- source_word: פְנֵיהֶם
  choice: nyuso zao
  rationale: Wingi wenye kiambishi cha nafsi ya tatu wingi. “Nyuso zao” huhifadhi taswira ya Kiebrania ya fedheha inayoonekana wazi.
- source_word: קָלוֹן
  choice: aibu
  rationale: Neno hili lina maana ya aibu, fedheha, au kuvunjiwa heshima. “Aibu” ni la kawaida, fupi, na linaweza kuhusisha hali ya ndani pamoja na kudhalilishwa mbele ya watu.
- source_word: וִיבַקְשׁוּ
  choice: ili walitafute
  rationale: Kitenzi kisichotimilika cha nafsi ya tatu wingi chenye kiunganishi, baada ya amri, kinaweza kuonyesha kusudi au matokeo. “Ili walitafute” huwasilisha uwezekano huo bila kudai kwamba kutafuta huko kutatokea kwa hakika.
- source_word: שִׁמְךָ
  choice: jina lako
  rationale: Tafsiri ya moja kwa moja inayohifadhi wazo la kibiblia la utambulisho, sifa, na nafsi ya Mungu bila kulifafanua kupita kiasi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limewasilishwa kwa unukuzi “Yahweh,” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Kusudi au matokeo ya hukumu ya Mungu
  choice: Aibu inayoombwa imewasilishwa kuwa na kusudi la kuwafanya maadui walitafute jina la Yahweh.
  alternative: 'Kishazi kinaweza kutafsiriwa kama mwendelezo rahisi: “na walitafute jina lako.”'
  rationale: Kitenzi kisichotimilika chenye waw baada ya amri mara nyingi huonyesha kusudi au matokeo. Hata hivyo, Kiebrania kinaweza pia kueleweka kama mwendelezo wa ombi; tanbihi inalinda utata huo na mvutano kati ya hukumu na kumtambua Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. Muundo “Wajaze nyuso zao aibu” umehifadhi taswira na mpangilio wa msingi wa Kiebrania huku ukiendelea kueleweka kwa msomaji wa kawaida.
