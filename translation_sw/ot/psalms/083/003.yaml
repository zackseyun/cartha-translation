base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/003.yaml
  text: They make crafty plans against your people[a], and they consult together against your treasured ones.
translation:
  language: sw
  text: 'Hufanya mipango ya hila dhidi ya watu wako,

    nao hushauriana dhidi ya wale unaowahifadhi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale ulioficha,” au “wale unaowathamini.” Neno la Kiebrania linaweza kumaanisha watu waliofichwa au kuhifadhiwa salama, na pia wale wanaothaminiwa na Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲרִימוּ סוֹד
  choice: Hufanya mipango ya hila
  rationale: Muunganiko huu unaonyesha kupanga kwa ujanja kwa nia ya uadui. Tafsiri hii ni ya asili katika Kiswahili na inabeba wazo la hila pamoja na shauri au mpango wa siri.
- source_word: וְיִתְיָעֲצוּ
  choice: nao hushauriana
  rationale: Kauli ya Kiebrania inaonyesha kushauriana wao kwa wao. ‘Hushauriana’ huhifadhi maana hiyo bila kuongeza moja kwa moja dhana yenye nguvu zaidi ya kula njama.
- source_word: עַל עַמְּךָ
  choice: dhidi ya watu wako
  rationale: Katika muktadha wa uadui, עַל inaonyesha upinzani, hivyo ‘dhidi ya’ inafaa kuliko ‘kuhusu.’
- source_word: צְפוּנֶיךָ
  choice: wale unaowahifadhi
  rationale: Neno linatokana na צפן, lenye maana ya kuficha, kuweka akiba, au kuhifadhi. ‘Wale unaowahifadhi’ linaonyesha watu waliowekwa salama na Mungu huku tanbihi ikihifadhi maana nyingine zinazowezekana.
theological_decisions:
- issue: Maana ya צְפוּנֶיךָ kuhusu watu wa Mungu
  choice: wale unaowahifadhi
  alternative: wale ulioficha; wale unaowathamini
  rationale: Kiebrania kinaweza kuelekeza kwa watu waliofichwa au kuhifadhiwa salama, na pia kwa wale wanaothaminiwa kama kitu kilichowekwa kwa uangalifu. Tafsiri kuu inatanguliza wazo la kuhifadhi bila kuondoa maana nyingine halali, ambazo zimeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. ‘Mipango ya hila’ na ‘hushauriana’ ni maneno ya sasa yanayoeleweka kwa urahisi bila kupunguza uzito wa mstari.
