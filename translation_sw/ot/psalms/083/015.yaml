    issue: “uwafuatilie” is semantically weaker and potentially ambiguous for רדף.
    rationale: In contemporary Swahili, kufuatilia often means to follow, monitor, investigate, or pursue a matter. In this imprecatory martial image, kuwafukuza more clearly expresses chasing down/pursuing adversaries.
