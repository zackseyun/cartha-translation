  yaml_path: translation/ot/psalms/083/015.yaml
  text: So pursue them with your storm[a], and terrify them with your tempest.
translation:
  language: sw
  text: Basi uwafukuze kwa dhoruba yako, na uwatie hofu kwa tufani yako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֵּן
  choice: Basi
  rationale: Inaunganisha ombi hili na taswira iliyotangulia kwa maana ya ‘hivyo/basi,’ kwa Kiswahili cha kawaida na cha kishairi.
- source_word: תִּרְדְּפֵם
  choice: uwafuatilie
  rationale: Kitenzi רדף humaanisha kufuatilia au kuwafukuza. ‘Uwafuatilie’ huhifadhi wazo la kuandama bila kuleta maana finyu ya mateso ya kidini.
- source_word: בְּסַעֲרֶךָ
  choice: kwa dhoruba yako
  rationale: ‘Kwa’ linaonyesha dhoruba kama chombo cha tendo, huku ‘dhoruba’ likiwakilisha סער kama hali kali ya hewa.
- source_word: וּבְסוּפָתְךָ
  choice: kwa tufani yako
  rationale: ‘Tufani’ huonyesha dhoruba kali ya סוּפָה na kudumisha utofauti wa kishairi na ‘dhoruba’ katika kipashio cha kwanza.
- source_word: תְבַהֲלֵם
  choice: uwatie hofu
  rationale: Katika piel, בהל husababisha taharuki, hofu, au kufadhaika. ‘Uwatie hofu’ ni kauli ya Kiswahili iliyo wazi na yenye nguvu inayofaa ombi hili.
theological_decisions:
- issue: Tendo la Mungu katika mashairi ya maombi ya hukumu
  choice: Kuhifadhi ombi la moja kwa moja kwamba Mungu awafuatilie na kuwatia hofu maadui.
  alternative: 'Kutafsiri kama taarifa ya wakati ujao: ‘utawafuatilia ... utawatia hofu.’'
  rationale: Vitenzi vya Kiebrania vya imperfecti katika muktadha huu wa sala vina nguvu ya ombi. Muundo wa ‘uwa-’ katika Kiswahili unaonyesha ombi hilo bila kuligeuza kuwa utabiri wala kulainisha mvutano wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Ulinganifu wa ‘dhoruba ... tufani’ unadumisha maneno mawili yanayokaribiana lakini yasiyofanana kabisa katika Kiebrania.
