review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the connective כֵּן, the prayer-like force of the imperfects, the instrumental sense of both prepositional phrases, and the intensification from storm to tempest. However, “uwafuatilie” can commonly suggest following up, tracking, or investigating, and is less forceful than רדף in this hostile poetic context.
  naturalness: The phrasing is otherwise natural Standard East African Swahili and suitably elevated. “Uwafukuze” is a more idiomatic and vigorous equivalent for pursuing enemies in this context.
  terminology: “Dhoruba” for סער and “tufani” for סופה are acceptable distinct poetic terms. “Uwatie hofu” accurately conveys the causative sense of בהל without over-specifying the manner of terror.
  issues:
