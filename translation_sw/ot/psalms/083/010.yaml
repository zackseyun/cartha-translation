lexical_decisions:
- source_word: נִשְׁמְדוּ
  choice: waliangamizwa
  rationale: Kauli hii inahifadhi umbo la kutendwa na maana ya kuharibiwa kabisa, bila kuongeza wazo lisilokuwamo katika Kiebrania.
- source_word: בְּעֵין דֹּאר
  choice: huko Endori
  rationale: Kiambishi בְּ kina maana ya mahali hapa. “Huko Endori” ni Kiswahili cha kawaida kinachohifadhi kutobainishwa ikiwa ni ndani, katika eneo, au karibu na mahali hapo.
- source_word: הָיוּ
  choice: wakawa
  rationale: Katika muundo wenye nomino ya kiarifu, kitenzi hiki kinaweza kuonyesha kuingia katika hali fulani; “wakawa” huwasilisha mabadiliko hayo.
- source_word: דֹּמֶן
  choice: samadi
  rationale: Neno hili humaanisha kinyesi au samadi. “Samadi” linafaa katika uhusiano wake na ardhi na linahifadhi taswira kali ya miili kuwa kitu cha kurutubisha udongo.
- source_word: לָאֲדָמָה
  choice: kwa ajili ya ardhi
  rationale: Tafsiri hii inafuata kwa karibu kiambishi לָ na nomino “ardhi/udongo,” huku ikihifadhi taswira ya kuwa samadi kwa ardhi badala ya kuisawazisha moja kwa moja kuwa “juu ya ardhi.”
