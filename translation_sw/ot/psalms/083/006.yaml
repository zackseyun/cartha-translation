lexical_decisions:
- source_word: אָהֳלֵי
  choice: mahema ya
  rationale: Ni wingi wa hali ya kutegemea wa אֹהֶל, yaani ‘mahema ya.’ Taswira halisi ya kishairi imehifadhiwa badala ya kuibadili moja kwa moja kuwa jina la watu.
- source_word: אֱדוֹם
  choice: Edomu
  rationale: Ni jina la taifa au eneo; limetoholewa kwa tahajia ya kawaida ya Kiswahili na linafuata kwa kawaida kirai ‘mahema ya.’
- source_word: יִשְׁמְעֵאלִים
  choice: Waishmaeli
  rationale: Ni jina la wingi la kundi la watu wanaotokana na Ishmaeli. ‘Waishmaeli’ ni umbo la kawaida na linaloeleweka katika Kiswahili.
- source_word: מוֹאָב
  choice: Moabu
  rationale: Ni jina la taifa au eneo, si umbo la Kiebrania linalomaanisha moja kwa moja ‘Wamoabu’; kutaja ‘Moabu’ kunahifadhi umbo na ufupi wa orodha.
- source_word: הַגְרִים
  choice: Wahagri
  rationale: Ni jina la kundi la watu. ‘Wahagri’ linafuata kwa karibu umbo la konsonanti la Kiebrania; jina linalohusishwa na Hagari limehifadhiwa kama uwezekano katika tanbihi.
