  text: Mungu wangu, uwafanye kama vumbi lizungukalo[a], kama makapi[b] mbele ya upepo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama gurudumu.” Neno la Kiebrania גַּלְגַּל linaweza kumaanisha kitu kinachoviringika au kuzunguka. Tafsiri ya msingi inafuata picha inayolingana vizuri na makapi yanayopeperushwa na upepo.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania קַשׁ kwa maana halisi zaidi hurejelea majani makavu au mabua yaliyobaki; hapa “makapi” yametumiwa kwa sababu ya picha ya mabaki mepesi yanayopeperushwa na upepo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Ni kauli ya kumwita Mungu moja kwa moja, yenye kiambishi cha nafsi ya kwanza umoja; Kiswahili cha kawaida hakihitaji kuongeza ‘Ee’.
- source_word: שִׁיתֵמוֹ
  choice: uwafanye
  rationale: Katika ombi hili kitenzi kina maana ya kuwasababisha wawe kama vitu vinavyotajwa katika mifano inayofuata.
- source_word: כַגַּלְגַּל
  choice: kama vumbi lizungukalo
  rationale: Neno גַּלְגַּל linaweza kumaanisha gurudumu au kitu kinachoviringika au kuzunguka. Katika ushairi huu, sambamba na makapi yanayopeperushwa na upepo, ‘vumbi lizungukalo’ linafikisha picha ya kitu chepesi kinachozungushwa na kutawanywa.
- source_word: כְּקַשׁ
  choice: kama makapi
  rationale: קַשׁ kwa maana ya msingi ni majani makavu au mabua yaliyobaki; hapa ‘makapi’ yanaeleza kwa kawaida picha ya mabaki mepesi yanayopeperushwa na upepo.
- source_word: לִפְנֵי רוּחַ
  choice: mbele ya upepo
  rationale: Hii inadumisha nahau na picha ya vitu vinavyosukumwa na upepo.
