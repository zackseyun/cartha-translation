  text: Uwatendee kama ulivyowatendea Wamidiani[a], kama ulivyomtendea Sisera, kama ulivyomtendea Yabini, kwenye kijito cha Kishoni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri iliyo karibu zaidi na muundo wa Kiebrania: “Uwatendee kama Midiani, kama Sisera, kama Yabini, kwenye kijito cha Kishoni.” Vitenzi “ulivyowatendea” na “ulivyomtendea” vimedokezwa na ulinganisho huo.'
