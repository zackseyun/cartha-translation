lexical_decisions:
- source_word: עֲשֵׂה לָהֶם
  choice: Uwatendee
  rationale: Kitenzi cha amri pamoja na kiwakilishi cha yambwa kinatafsiriwa kwa Kiswahili cha kawaida kama ombi la moja kwa moja kwa Mungu achukue hatua dhidi yao; maana kamili inaelezwa na ulinganisho unaofuata.
- source_word: כְּמִדְיָן
  choice: kama ulivyowatendea Wamidiani
  rationale: Kiambishi cha ulinganisho כְּ kinarejelea tendo la Mungu la zamani. Kiswahili kinahitaji kwa kawaida kurejesha kitenzi kilichodokezwa; Wamidiani hutambulisha watu wa Midiani, si mtu mmoja.
- source_word: כְּסִיסְרָא כְיָבִין
  choice: kama ulivyowatendea Sisera na Yabini
  rationale: Vifungu sambamba vinawalinganisha maadui hawa na Sisera na Yabini katika kushindwa kwao. Kuunganisha majina kwa “na” ni Kiswahili cha asili bila kupoteza usambamba wa Kiebrania.
- source_word: בְּנַחַל קִישׁוֹן
  choice: kwenye kijito cha Kishoni
  rationale: נחל inaweza kuwa kijito, mkondo wa maji, au bonde lenye mkondo wa msimu. “Kijito” ni neno la kawaida na linalofaa kwa mkondo huu wenye jina; בְּ hapa ni ya mahali.
