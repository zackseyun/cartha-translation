  text: וְ/עֹ֥ז מֶלֶךְ֮ מִשְׁפָּ֪ט אָ֫הֵ֥ב אַ֭תָּה כּוֹנַ֣נְתָּ מֵישָׁרִ֑ים מִשְׁפָּ֥ט וּ֝/צְדָקָ֗ה בְּ/יַעֲקֹ֤ב אַתָּ֬ה עָשִֽׂיתָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/004.yaml
  text: The strength of the King loves justice[a]; you have established uprightness[b]; you have done justice and righteousness in Jacob.
translation:
  language: sw
  text: Mfalme mwenye nguvu hupenda haki[a]; wewe umeweka imara usawa[b]; umetenda haki na uadilifu katika Yakobo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania cha mwanzo kimebanwa na kinaweza kueleweka kwa zaidi ya njia moja. Kwa karibu zaidi na mpangilio wa maneno yake, kinaweza kutolewa, “Nguvu za Mfalme hupenda haki,” ingawa usemi huo si wa kawaida katika Kiswahili.
    reason: alternative_reading
  - marker: b
    text: “Usawa” unaweza pia kutafsiriwa “unyofu” au “yaliyo sawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֹז
  choice: Nguvu
  rationale: עֹז humaanisha nguvu au uweza. Nomino imehifadhiwa ili kuonyesha muundo uliobanwa wa Kiebrania badala ya kuibadili moja kwa moja kuwa kivumishi.
- source_word: מֶלֶךְ
  choice: Mfalme
  rationale: Ni jina la kifalme linalomrejelea Mungu katika muktadha huu wa zaburi.
- source_word: מִשְׁפָּט
  choice: haki
  rationale: Katika muktadha huu neno linahusu utawala na hukumu iliyo sawa, si uamuzi wa mahakama pekee; limetafsiriwa vivyo hivyo katika marudio yake.
- source_word: אָהֵב
  choice: hupenda
  rationale: Kauli hii inaeleza sifa ya kudumu; 'hupenda' huwasilisha maana hiyo ya kawaida katika Kiswahili.
- source_word: אַתָּה
  choice: wewe
  rationale: Kiwakilishi kimewekwa wazi ili kuhifadhi msisitizo wa Kiebrania katika kumsemesha Mungu moja kwa moja.
- source_word: כּוֹנַנְתָּ
  choice: umethibitisha
  rationale: Kitenzi kina maana ya kuweka imara au kuanzisha kwa uthabiti; 'umethibitisha' huhifadhi wazo la kukifanya kitu kisimame imara.
- source_word: מֵישָׁרִים
  choice: unyofu
  rationale: Nomino inaashiria yaliyo manyoofu na sawa kimaadili au katika utoaji wa haki.
- source_word: וּצְדָקָה
  choice: na uadilifu
  rationale: צְדָקָה huonyesha uadilifu au haki ya kimaadili. 'Uadilifu' hulitofautisha na מִשְׁפָּט huku likihifadhi uhusiano wa karibu wa dhana hizo.
- source_word: בְּיַעֲקֹב
  choice: katika Yakobo
  rationale: Jina la agano 'Yakobo' limehifadhiwa bila kulifasiri kuwa 'Israeli'; kihusishi kimetafsiriwa kwa njia ya moja kwa moja.
- source_word: עָשִׂיתָ
  choice: umetenda
  rationale: Kitenzi hiki cha jumla kinafaa pamoja na virai 'haki na uadilifu' na kinaonyesha tendo lililotimizwa.
theological_decisions:
- issue: Jinsi ya kuelewa kishazi kigumu וְעֹז מֶלֶךְ
  choice: Nguvu za Mfalme hupenda haki
  alternative: Mfalme mwenye nguvu hupenda haki; au, Mfalme katika nguvu zake hupenda haki
  rationale: Kiebrania kimebanwa kisintaksia na kinaweza kueleweka kwa zaidi ya njia moja. Tafsiri kuu huhifadhi nomino 'nguvu' na hivyo kuacha ugumu wa asili uonekane; tanbihi inatoa Kiswahili cha kawaida zaidi bila kukifunga kifungu kwenye ufafanuzi mmoja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa vifungu sambamba na usemi wa moja kwa moja kwa Mungu umehifadhiwa. Alama zote za tanbihi zimewekwa katika matini kuu.
