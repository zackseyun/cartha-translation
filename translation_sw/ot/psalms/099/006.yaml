base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/006.yaml
  text: Moses and Aaron were among his priests[a], and Samuel among those who called on his name; they called to Yahweh, and he answered them.
translation:
  language: sw
  text: Musa na Aroni walikuwa miongoni mwa makuhani wake[a], na Samweli alikuwa miongoni mwa wale walioliitia jina lake; walimwita Yahwe, naye akawajibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwa wale waliokuwa wakiliitia jina lake.” Kirai cha Kiebrania kinarejelea wale wanaoliitia jina lake.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹהֲנָיו
  choice: miongoni mwa makuhani wake
  rationale: Kiamb前? ב pamoja na nomino ya wingi na kiambishi cha nafsi ya tatu umoja wa kiume kinaeleweka vizuri hapa kwa maana ya sehemu ya kundi. Tafsiri hii inawahesabu Musa na Aroni miongoni mwa makuhani wa Mungu bila kudai kwamba walikuwa na jukumu lilelile la kikuhani.
- source_word: בְּקֹרְאֵי שְׁמוֹ
  choice: miongoni mwa wale walioliitia jina lake
  rationale: Kirai cha kishirikishi kinaenda sambamba na 'miongoni mwa makuhani wake' na kumweka Samweli katika kundi la watu waliomwomba Mungu kwa kulitaja na kulitegemea jina lake.
- source_word: קֹרִאים אֶל
  choice: walimwita
  rationale: Kitenzi hiki kinaendeleza tendo la watu waliotajwa. 'Walimwita' ni Kiswahili cha kawaida kinachoweza kubeba maana ya kumwomba au kumlilia Mungu bila kulazimisha kwamba walikuwa katika dhiki.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo kama 'BWANA'.
- source_word: יַעֲנֵם
  choice: akawajibu
  rationale: Katika muktadha huu, hali isiyotimilika ya Kiebrania inafaa kueleweka kama tendo la zamani lililorudiwa au muhtasari wa jambo lililotokea; 'akawajibu' ni ya asili na fupi.
- source_word: שְׁמוֹ
  choice: jina lake
  rationale: Kiebrania kinataja wazi 'jina lake'; kuhifadhi usemi huo kunadumisha maana yake ya ibada na sala.
theological_decisions:
- issue: Jinsi ya kuwataja Musa na Aroni kama makuhani bila kufuta tofauti za huduma zao
  choice: Musa na Aroni walikuwa miongoni mwa makuhani wake
  alternative: Musa na Aroni walikuwa makuhani wake
  rationale: Neno 'miongoni' linahifadhi maana ya kugawa kwa sehemu katika Kiebrania na halisawazishi kimya kimya cheo na huduma ya Musa na ile ya Aroni.
- issue: Uhusiano wa Samweli na wale walioliitia jina la Mungu
  choice: Samweli alikuwa miongoni mwa wale walioliitia jina lake
  alternative: Samweli aliliitia jina lake
  rationale: 'Muundo wa kundi unahifadhi usambamba wa Kiebrania: Musa na Aroni wako miongoni mwa makuhani wake, na Samweli yuko miongoni mwa wale wanaoliitia jina lake.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa usambamba wa Kiebrania umehifadhiwa, huku kitenzi 'alikuwa' kikiongezwa katika sehemu ya Samweli kwa mtiririko wa kawaida wa Kiswahili.
