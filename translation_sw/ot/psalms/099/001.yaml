  text: יְהוָ֣ה מָ֭לָךְ יִרְגְּז֣וּ עַמִּ֑ים יֹשֵׁ֥ב כְּ֝רוּבִ֗ים תָּנ֥וּט הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/001.yaml
  text: Yahweh reigns[a]; let the peoples tremble. He sits enthroned upon the cherubim[b]; let the earth quake.
translation:
  language: sw
  text: Yahwe anatawala[a]; mataifa na yatetemeke. Yeye ameketi juu ya makerubi[b]; dunia na itikisike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mataifa yanatetemeka ... dunia inatikisika.” Vitenzi vya Kiebrania vinaweza pia kueleweka kama kauli za taarifa badala ya kauli za utashi.
    reason: alternative_reading
  - marker: b
    text: Inaweza pia kutafsiriwa, “ameketi kati ya makerubi.” Usemi huu wa Kiebrania ni cheo cha kifalme cha Yahwe kinachohusiana na hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limeandikwa kwa unukuzi wa Kiswahili badala ya kubadilishwa na cheo ‘BWANA’.
- source_word: מָלָךְ
  choice: anatawala
  rationale: Katika tangazo hili la kishairi, kauli hiyo inatangaza ufalme wa Yahwe unaoendelea bila kulazimisha maana ya ‘amekuwa mfalme’.
- source_word: יִרְגְּזוּ עַמִּים
  choice: mataifa na yatetemeke
  rationale: Muundo wa kuitikia kwa amri/utashi unafaa baada ya tangazo la ufalme; ‘mataifa’ ni Kiswahili cha kawaida kwa makundi mengi ya watu.
- source_word: יֹשֵׁב כְּרוּבִים
  choice: Ameketi juu ya makerubi akiwa mfalme
  rationale: Huhifadhi kitenzi ‘ameketi’ na kueleza maana ya kifalme ya usemi wa hekalu bila kuamua kwamba ni ‘kati ya’ makerubi.
- source_word: כְּרוּבִים
  choice: makerubi
  rationale: Hili ndilo umbo la Kiswahili la wingi wa viumbe hawa wa mbinguni.
- source_word: תָּנוּט הָאָרֶץ
  choice: dunia na itikisike
  rationale: ‘Dunia’ huonyesha upeo wa ulimwengu mzima, na ‘itikisike’ huwasilisha mwendo wa kutikisika au kuyumba.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi yana jina binafsi la Mungu; ‘Yahwe’ hulihifadhi badala ya kuliweka kama cheo.
- issue: Nguvu ya vitenzi יִרְגְּזוּ na תָּנוּט
  choice: 'Kauli za utashi: ‘na yatetemeke ... na itikisike’'
  alternative: 'Kauli za taarifa: ‘mataifa yanatetemeka ... dunia inatikisika’'
  rationale: Muktadha wa wimbo wa kutawazwa unaunga mkono mwitikio wa kiutashi, lakini sarufi ya Kiebrania pia inaruhusu taarifa; uwezekano huo umehifadhiwa katika tanbihi.
- issue: Mahali panapoonyeshwa na יֹשֵׁב כְּרוּבִים
  choice: juu ya makerubi
  alternative: kati ya makerubi; juu ya makerubi bila ufafanuzi wa kifalme
  rationale: Usemi ni cheo cha kifalme na cha hekalu; ‘juu ya’ huepuka kuifunga picha hiyo kwa nafasi ya ‘kati ya’ pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘na yatetemeke ... na itikisike’ ni wa kishairi lakini unaeleweka; ‘akiwa mfalme’ hufafanua nguvu ya kifalme ya ‘ameketi’ bila kuongeza picha ya kiti cha enzi isiyosemwa moja kwa moja.
