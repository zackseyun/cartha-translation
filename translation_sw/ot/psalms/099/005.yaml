base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/005.yaml
  text: Exalt Yahweh our God[a], and bow down at his footstool[b]; he is holy.
translation:
  language: sw
  text: Mtukuzeni Yahwe, Mungu wetu, na msujudu mbele ya kiti cha miguu yake[a][b]; yeye ni mtakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenye kiti cha miguu yake” au “kuelekea kiti cha miguu yake.” Kihusishi cha Kiebrania kinaweza kutafsiriwa kwa zaidi ya njia moja katika muktadha huu wa ibada.
    reason: lexical_alternative
  - marker: b
    text: “Kiti cha miguu yake” huenda kikarejelea mahali pa kutawalia kwake Mungu duniani, kama vile sanduku la agano au patakatifu; lakini mstari huu hauielezi wazi taswira hiyo.
    reason: cultural_note
lexical_decisions:
- source_word: רֽוֹמְמ֡וּ
  choice: Mtukuzeni
  rationale: Ni amri ya wingi kutoka רום yenye maana ya kumwinua au kumtukuza. “Mtukuzeni” ni Kiswahili cha kawaida na chenye hadhi katika muktadha wa ibada, bila kudokeza kuinuliwa kimwili.
- source_word: יְהוָ֤ה
  choice: Yahwe
  rationale: Linatunza jina binafsi la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadili kuwa cheo.
- source_word: אֱלֹהֵ֗ינוּ
  choice: Mungu wetu
  rationale: Umbo lenye kiambishi cha nafsi ya kwanza wingi linamaanisha moja kwa moja “Mungu wetu” na linatunza sauti ya jumuiya.
- source_word: וְהִשְׁתַּחֲווּ
  choice: na msujudu
  rationale: Kitenzi שׁחה kinaonyesha kuinama chini au kujilaza kwa heshima, na kwa upana kuabudu. “Msujudu” kinatunza tendo la mwili na maana yake ya kiibada kwa Kiswahili cha sasa.
- source_word: לַהֲדֹם רַגְלָיו
  choice: mbele ya kiti cha kuwekea miguu yake
  rationale: הֲדֹם ni kiti cha kuwekea miguu, na רַגְלָיו ni “miguu yake.” Katika muktadha huu ל inaweza kuonyesha mahali au mwelekeo wa kusujudu; “mbele ya” ni ya asili katika Kiswahili na haidokezi kwamba kiti chenyewe ndicho kinachoabudiwa.
- source_word: קָדוֹשׁ הוּא
  choice: yeye ni mtakatifu
  rationale: Kivumishi cha kiarifu pamoja na kiwakilishi kimewasilishwa kwa mpangilio wa kawaida wa Kiswahili, huku msisitizo wa kiwakilishi ukihifadhiwa.
theological_decisions:
- issue: Kitu kinachorejelewa na “kiti cha kuwekea miguu yake”
  choice: Taswira imetafsiriwa moja kwa moja bila kuitambulisha katika matini kuu.
  alternative: Inaweza kueleweka kuwa sanduku la agano, patakatifu, Sayuni, au mahali pa kutawala kwa Mungu duniani.
  rationale: Mstari wenyewe hautaji wazi kitu gani kinachokusudiwa. Kuacha taswira ikiwa wazi kunazuia kuingiza hitimisho finyu la kitafsiri.
- issue: Mwelekeo wa kusujudu
  choice: “mbele ya kiti cha kuwekea miguu yake”
  alternative: “kwenye kiti cha kuwekea miguu yake” au “kuelekea kiti cha kuwekea miguu yake”
  rationale: Kihusishi ל kinaweza kufasiriwa kwa zaidi ya njia moja katika muktadha huu wa ibada. Chaguo la matini kuu linaeleza mahali pa kusujudu bila kufanya kiti kuwa mlengwa wa ibada, huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Amri za wingi “Mtukuzeni” na “msujudu” zinaihifadhi sauti ya mwito wa jumuiya; taswira halisi ya kiti cha kuwekea miguu imeachwa bila kufafanuliwa kupita kiasi.
