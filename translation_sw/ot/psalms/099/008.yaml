  text: יְהוָ֣ה אֱלֹהֵי/נוּ֮ אַתָּ֪ה עֲנִ֫יתָ֥/ם אֵ֣ל נֹ֭שֵׂא הָיִ֣יתָ לָ/הֶ֑ם וְ֝/נֹקֵ֗ם עַל עֲלִילוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/008.yaml
  text: O Yahweh our God[a], you answered them; you were a forgiving God to them[b], yet an avenger of their deeds.
translation:
  language: sw
  text: Ee Yahwe Mungu wetu, wewe uliwajibu; ulikuwa kwao Mungu mwenye kusamehe[a], lakini mwenye kulipiza kisasi kwa matendo yao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu aliyebeba [hatia yao]”; neno la Kiebrania linaweza kumaanisha kusamehe kwa kubeba au kuondoa hatia.
    reason: lexical_alternative
  - marker: b
    text: Au, “huku ukilipiza kisasi kwa matendo yao.” Muundo wa Kiebrania unaweza kueleweka kama sifa ya Mungu (“mwenye kulipiza kisasi”) au kwa maana ya tendo (“ukilipiza kisasi”).
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama “BWANA”.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Muundo wenye kiambishi cha nafsi ya kwanza wingi unamaanisha moja kwa moja “Mungu wetu,” na hapa ni sehemu ya mwito.
- source_word: עֲנִיתָם
  choice: uliwajibu
  rationale: Kitenzi ענה katika muktadha wa maombi na maombezi humaanisha kujibu; kiambishi cha mwisho kinarejelea “wao.”
- source_word: נֹשֵׂא
  choice: mwenye kusamehe
  rationale: Ingawa maana ya msingi ni kuinua au kubeba, katika muktadha wa kosa au dhambi hushirikisha wazo la kuondoa hatia, yaani kusamehe.
- source_word: הָיִיתָ לָהֶם
  choice: ulikuwa kwao
  rationale: Muundo היה + ל unaeleza jinsi Mungu alivyokuwa katika uhusiano nao; “ulikuwa kwao” huhifadhi muundo huo kwa Kiswahili kinachoeleweka.
- source_word: וְנֹקֵם
  choice: lakini pia mwenye kulipiza kisasi
  rationale: Kishirikishi cha נקם kinaweza kumaanisha mtu anayelipiza kisasi au tendo endelevu la kulipiza. “Mwenye kulipiza kisasi” ni la kawaida na huhifadhi mvutano na msamaha; “lakini pia” huonyesha kwamba mambo yote mawili ni kweli.
- source_word: עַל עֲלִילוֹתָם
  choice: kwa matendo yao
  rationale: עַל hapa huonyesha msingi au sababu ya kulipiza, naye עֲלִילוֹתָם ni “matendo yao.” Tafsiri haiongezi neno “maovu,” ambalo halijaonyeshwa wazi katika nomino yenyewe.
theological_decisions:
- issue: Msamaha wa Mungu pamoja na kulipiza kisasi
  choice: Mistari inasema Mungu aliwajibu na alikuwa mwenye kuwasamehe, lakini pia alilipiza kisasi kwa matendo yao.
  alternative: Kufafanua kwamba Mungu aliwasamehe kabisa watu hao na kuwaadhibu wengine tu, au kwamba kisasi chake kiliwalenga watu badala ya matendo yao.
  rationale: Kiebrania kinaweka msamaha na hukumu pamoja bila kueleza kikamilifu uhusiano wao. Tafsiri inahifadhi mvutano huo badala ya kuutatua kwa kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Ee” huhifadhi mwito, “Yahwe” huhifadhi jina la Mungu, na sentensi sambamba huhifadhi uzito wa kishairi pamoja na mvutano kati ya msamaha na haki.
