  text: Yahweh is great in Zion[a], and he is exalted above all the peoples.
translation:
  language: sw
  text: 'Yahwe ni mkuu katika Sayuni;

    naye ametukuka juu ya mataifa yote.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili, badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: בְּצִיּוֹן
  choice: katika Sayuni
  rationale: Kihusishi ב kinaonyesha mahali; “katika Sayuni” ni tafsiri ya kawaida na ya asili katika muktadha huu.
- source_word: גָּדוֹל
  choice: ni mkuu
  rationale: “Mkuu” huhifadhi maana ya ukuu na hadhi katika lugha ya sifa bila kuibana iwe nguvu pekee.
- source_word: וְרָם הוּא
  choice: yeye ametukuka
  rationale: “Ametukuka” huonyesha kuwa juu kwa hadhi, na “yeye” huhifadhi msisitizo wa kiwakilishi huru הוּא.
- source_word: עַל כָּל הָעַמִּים
  choice: juu ya jamii zote za watu
  rationale: “Juu ya” huendana na wazo la kutukuka, huku “jamii zote za watu” ikihifadhi wingi na upeo wa עַמִּים bila kuifanya iwe mataifa ya kisiasa pekee.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Andiko la Kiebrania linatumia jina maalumu la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kuwa juu ya jamii zote
  choice: ametukuka juu ya jamii zote za watu
  alternative: anatawala jamii zote za watu
  rationale: Muundo רָם ... עַל unaeleza hasa kuinuliwa au kutukuka juu ya wengine; tafsiri haiongezi kwa wazi wazo la kutawala, ingawa linaweza kudokezwa na muktadha.
translation_notes:
  register: Lugha ni ya kishairi, yenye heshima na inayoeleweka kwa wasomaji wa Kiswahili cha Afrika Mashariki. Mistari miwili inadumisha ulinganifu wa kishairi wa Kiebrania.
