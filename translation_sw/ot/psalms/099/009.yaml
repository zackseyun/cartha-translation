base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/009.yaml
  text: Exalt Yahweh our God[a], and bow down at his holy mountain, for Yahweh our God is holy.
translation:
  language: sw
  text: Mtukuzeni Yahwe Mungu wetu, na sujuduni kuelekea mlima wake mtakatifu[a], kwa maana Yahwe Mungu wetu ni mtakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwabuduni kwenye mlima wake mtakatifu.” Kitenzi cha Kiebrania kinaweza kumaanisha kusujudu na pia kuabudu, na kihusishi kinaweza kueleweka kuwa “kwenye” au “kuelekea” mlima.
    reason: Tofauti halisi ya kileksika na kisarufi katika kitenzi שׁחה na kihusishi לְ.
lexical_decisions:
- source_word: רֽוֹמְמ֡וּ
  choice: Mtukuzeni
  rationale: Amri ya wingi kutoka רום inatoa mwito wa kumwinua au kumtangaza Mungu kuwa mkuu; “Mtukuzeni” ni Kiswahili cha kawaida, chenye hadhi, na kinafaa katika ushairi wa ibada.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa namna ya kulitamka kama “Yahwe,” badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Nomino yenye kiambishi cha nafsi ya kwanza wingi humaanisha moja kwa moja “Mungu wetu.”
- source_word: וְהִשְׁתַּחֲווּ
  choice: na sujuduni
  rationale: Kitenzi שׁחה huonyesha kuinama au kujilaza chini, mara nyingi kama tendo la ibada. “Sujuduni” huhifadhi picha halisi ya mkao huo huku ikidokeza ibada.
- source_word: לְהַר קָדְשׁוֹ
  choice: kuuelekea mlima wake mtakatifu
  rationale: Kihusishi לְ kinaweza kuonyesha mwelekeo au mahali/uhusiano. “Kuuelekea” huhifadhi maana ya mwelekeo bila kudokeza kwamba mlima wenyewe ndio unaoabudiwa.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inatanguliza sababu ya amri zilizotangulia; “kwa maana” ni kiunganishi cha kawaida chenye hadhi.
- source_word: קָדוֹשׁ
  choice: ni mtakatifu
  rationale: “Mtakatifu” ni tafsiri ya kawaida ya קָדוֹשׁ na huhifadhi kiini cha kibwagizo cha zaburi kuhusu utakatifu wa Mungu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la Mungu יהוה. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Iwapo הִשְׁתַּחֲווּ itafsiriwe wazi kuwa kuabudu
  choice: sujuduni
  alternative: mwabuduni
  rationale: Kitenzi kinaweza kumaanisha tendo halisi la kusujudu na pia ibada inayofanywa kwa tendo hilo. “Sujuduni” huhifadhi taswira ya mwili bila kuondoa maana ya kiibada.
- issue: Maana ya kihusishi לְ katika לְהַר קָדְשׁוֹ
  choice: kuuelekea mlima wake mtakatifu
  alternative: kwenye mlima wake mtakatifu
  rationale: Kihusishi kinaweza kueleweka kama mwelekeo au mahali. Tafsiri kuu inachagua mwelekeo, huku tanbihi ikihifadhi uwezekano wa mahali na maana ya wazi ya kuabudu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa ibada lakini kinachoeleweka kwa wasomaji wa kawaida. “Sujuduni” ni amri ya wingi; “Mtukuzeni” ni ya asili zaidi kuliko tafsiri sisisi ya kuinua. Jina “Yahwe” limehifadhiwa kwa uthabiti.
