  text: Let them praise your great and fearsome name[c][b][a]; he is holy.
translation:
  language: sw
  text: Na wakusifu jina lako kuu na la kuogofya[a][b]; yeye ni mtakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na wakushukuru jina lako kuu na la kuogofya”; kitenzi cha Kiebrania kinaweza kumaanisha “kushukuru” au “kusifu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “la kutisha”; neno la Kiebrania hueleza jina linaloamsha hofu na kicho cha staha.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Na wasifu
  rationale: Kitenzi hiki kinaweza kumaanisha ‘kushukuru’ au ‘kusifu’. Katika muktadha huu, ambapo jina la Mungu ndilo linaloelekezewa tendo hilo, ‘kusifu’ linafaa zaidi. Hali ya utegemezi ‘wasifu’ inawasilisha maana ya ombi au mwito wa Kiebrania.
- source_word: שִׁמְךָ
  choice: jina lako
  rationale: ‘Jina’ linadumisha nahau ya Kiebrania na linaweza pia kudokeza sifa na tabia ya Mungu iliyofunuliwa.
- source_word: גָּדוֹל
  choice: kuu
  rationale: ‘Kuu’ ni tafsiri ya moja kwa moja na ya kawaida kwa kivumishi hiki katika maelezo ya jina la Mungu.
- source_word: וְנוֹרָא
  choice: na la kuogofya
  rationale: Neno hili hueleza kinachotia hofu na kicho. ‘La kuogofya’ linahifadhi uzito wa hofu yenye staha bila kuifanya maana kuwa hofu mbaya tu.
- source_word: קָדוֹשׁ
  choice: mtakatifu
  rationale: Hili ndilo neno la kawaida lenye uzito wa kiteolojia na kiliturujia unaofaa kwa kiitikio cha zaburi hii.
- source_word: הוּא
  choice: yeye
  rationale: Kiwakilishi huru cha Kiebrania kina mkazo; ‘yeye’ kinadumisha mkazo huo na kinamrejelea Bwana katika muktadha.
theological_decisions:
- issue: Mrejelewa wa ‘yeye’ katika kishazi cha mwisho
  choice: ‘Yeye’ anamrejelea Bwana na kutangaza utakatifu wake.
  alternative: Kishazi kinaweza kusikika kama tamko la kiliturujia linalounganishwa kwa karibu na ‘jina’ la Mungu.
  rationale: Katika Zaburi 99, tamko hili linafanya kazi kama kiitikio kuhusu Bwana. Tafsiri haiongezi kiunganishi kama ‘kwa maana’, ambacho hakipo wazi katika Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi, wa heshima na unaofaa usomaji wa ibada. Alama ya nukta mkato inadumisha uhusiano wa karibu wa vishazi bila kuongeza sababu ambayo haikutajwa wazi katika matini ya Kiebrania.
