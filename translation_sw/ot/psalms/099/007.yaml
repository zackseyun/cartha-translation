base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/007.yaml
  text: In a pillar of cloud he spoke to them[a]; they kept his testimonies and the statute he gave them.
translation:
  language: sw
  text: Katika nguzo ya wingu aliwanenea[a]; walizishika shuhuda zake na amri aliyowapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa njia ya nguzo ya wingu aliwanenea.” Kihusishi cha Kiebrania kinaweza kueleweka kwa maana ya mahali au njia.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעַמּוּד עָנָן
  choice: Katika nguzo ya wingu
  rationale: ‘Katika’ huhifadhi maana ya mahali iliyo katika kihusishi בְּ, huku ‘nguzo ya wingu’ ikihifadhi taswira ya muundo wa Kiebrania. Maana ya ‘kutoka katika’ imewekwa katika tanbihi kwa sababu kihusishi hicho kinaweza kueleweka pia kwa namna hiyo.
- source_word: יְדַבֵּר אֲלֵיהֶם
  choice: aliwanenea
  rationale: Wakati uliopita unafaa kwa simulizi la kishairi linalokumbuka matendo ya Mungu. ‘Aliwanenea’ ni kauli fupi, yenye heshima, inayoonyesha kuwa alisema kwao bila kudokeza lazima mazungumzo ya pande mbili.
- source_word: שָׁמְרוּ
  choice: walizishika
  rationale: Kitenzi שׁמר katika muktadha wa agano humaanisha kushika au kutii. ‘Walizishika’ huhifadhi picha ya Kiebrania na ni usemi unaoeleweka katika muktadha wa amri za Mungu.
- source_word: עֵדֹתָיו
  choice: shuhuda zake
  rationale: ‘Shuhuda’ huhifadhi upekee wa neno עֵדוֹת na kulitofautisha na חֹק linalofuata, badala ya kuyafanya maneno yote mawili kuwa ‘amri’ au ‘maagizo.’
- source_word: וְחֹק
  choice: na amri
  rationale: חֹק hapa ni umoja na hutaja agizo lililowekwa. ‘Amri’ ni ya kawaida na wazi kwa wasomaji wa Kiswahili, huku umoja wake ukihifadhiwa.
- source_word: נָתַן לָמוֹ
  choice: aliyowapa
  rationale: Kishazi hiki kinaeleza ‘amri’ na kudumisha maana ya kwamba Mungu ndiye aliyewapa amri hiyo.
theological_decisions:
- issue: Rejeo la ‘ali-’ na ‘-wa-’
  choice: Mtendaji anaachwa kuwa Bwana, na wanaonenewa wanaachwa kuwa Musa, Haruni na Samweli waliotajwa katika mstari uliotangulia.
  alternative: ‘Wao’ inaweza kueleweka kwa upana kuwa Israeli waliowakilishwa na watu hao.
  rationale: Muktadha wa karibu unawaelekeza wasomaji kwa watu watatu wa mstari wa 6. Tafsiri haiongezi majina wala ‘Bwana’ katika mstari wenyewe, hivyo inadumisha mtiririko na ufupi wa kishairi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wa heshima na unaoeleweka. ‘Aliwanenea’ na ‘shuhuda’ ni maneno yenye ladha ya kibiblia lakini bado yanaeleweka; tofauti ya kimsamiati kati ya עֵדוֹת na חֹק imehifadhiwa.
