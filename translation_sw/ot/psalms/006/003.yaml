review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the psalmist’s profound inner distress, the direct address to Yahweh, and the abrupt lament-question, “hata lini?” However, “pia” normally means “also/too” and can imply an additional element rather than simply carrying forward the Hebrew conjunction.
  naturalness: “Nafsi yangu pia imefadhaika sana” is understandable, but “Nafsi yangu nayo imefadhaika sana” is more idiomatic and suitably poetic in Standard East African Swahili. The remaining wording is clear and appropriately elevated.
  terminology: “Nafsi yangu” appropriately preserves the poetic sense of נַפְשִׁי. “Imefadhaika sana” is a natural rendering of the intense disturbance expressed by נִבְהֲלָה מְאֹד without narrowing it to terror alone. “Yahwe” is an established Swahili-form rendering of the divine name and is retained consistently.
  issues:
  - severity: low
    issue: “pia” for the prefixed conjunction in וְנַפְשִׁי
    rationale: In this setting, “pia” can suggest “my soul too,” an additive emphasis not explicit in the Hebrew. “Nayo” naturally links this clause with the preceding lament while avoiding that added implication.
  revised_text: Nafsi yangu nayo imefadhaika sana. Lakini wewe, ee Yahwe, hata lini?
