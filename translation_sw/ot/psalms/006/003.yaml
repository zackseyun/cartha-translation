  yaml_path: translation/ot/psalms/006/003.yaml
  text: And my soul is greatly troubled—but you[a], O Yahweh[d][c][b], how long?
translation:
  language: sw
  text: Nafsi yangu nayo imefadhaika sana. Lakini wewe, ee Yahwe, hata lini?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנַפְשִׁי
  choice: Nafsi yangu pia
  rationale: נֶפֶשׁ inaweza kumaanisha nafsi, maisha, au mtu mwenyewe. Hapa “nafsi yangu” huhifadhi lugha ya kishairi na kuonyesha undani wa dhiki; kiunganishi וְ kimewakilishwa kwa “pia,” kikihusianisha hali hii na mstari uliotangulia.
- source_word: נִבְהֲלָה מְאֹד
  choice: imefadhaika sana
  rationale: Kitenzi בהל huonyesha kushtuka, kufadhaika, au kuingiwa na hofu; “imefadhaika sana” ni Kiswahili cha kawaida kinachohifadhi uzito wa מְאֹד bila kulazimisha maana ya hofu kuu pekee.
- source_word: וְאַתָּה
  choice: Lakini wewe
  rationale: Ingawa וְ kimsingi ni “na,” hapa kinaanzisha geuko kali kutoka kwa dhiki ya mwombaji kwenda kwa Mungu; “lakini” huwasilisha nguvu hiyo ya kimuktadha.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Kiebrania יהוה limeandikwa kwa namna ya kawaida ya Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: עַד מָתָי
  choice: hata lini?
  rationale: Hii ni tamko la maombolezo linalouliza hali hii itaendelea mpaka wakati gani; “hata lini?” ni la asili na lenye uzito wa kihisia katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ina jina la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi, huku “BWANA” ikiwa desturi ya kulibadilisha kwa cheo.
- issue: Nguvu ya וְ kabla ya אַתָּה
  choice: Lakini wewe
  alternative: Na wewe
  rationale: “Lakini” huonyesha geuko la maombolezo kwa uwazi, ingawa “na” ndiyo maana ya kimsingi ya kiunganishi; uchaguzi huu haukamilishi sentensi iliyoachwa kwa mkazo katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Sentensi ya mwisho imeachwa fupi na yenye swali ili kuhifadhi mvutano na ukosefu wa ukamilifu wa tamko la Kiebrania.
