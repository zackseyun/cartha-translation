base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/000.yaml
  text: 'For the choirmaster: with stringed instruments, according to the Sheminith[a]. A psalm of David[b].'
translation:
  language: sw
  text: Kwa kiongozi wa waimbaji; kwa vinanda, kwa Sheminithi[a]. Zaburi ya Daudi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, Sheminithi; huenda ikamaanisha “ya nane,” mpangilio wa oktava, au chombo chenye nyuzi nane.
    reason: lexical_alternative
  - marker: b
    text: Au “iliyoandikwa na Daudi” au “kwa ajili ya Daudi”; Kiebrania kinaweza kuonyesha utunzi au uhusiano.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa kiongozi wa waimbaji
  rationale: Katika vichwa vya zaburi neno hili humaanisha msimamizi wa uimbaji au utendaji wa muziki. Kauli hii ni ya kawaida na inaeleweka katika Kiswahili cha sasa.
- source_word: בִּנְגִינוֹת
  choice: kwa vinanda
  rationale: Neno hili huelekea kurejelea muziki au vyombo vya nyuzi. “Vinanda” ni neno la kibiblia linaloeleweka kwa vyombo vya muziki vyenye nyuzi bila kubainisha aina fulani.
- source_word: עַל
  choice: kwa
  rationale: Katika kichwa cha muziki linaweza kutambulisha mtindo, mpangilio, wimbo, au chombo cha kutumiwa. “Kwa” huhifadhi upeo huo bila kuamua maana moja.
- source_word: הַשְּׁמִינִית
  choice: Sheminithi
  rationale: Maana kamili ya istilahi hii ya muziki haijulikani; uhawilishaji huepuka usahihi wa bandia huku tanbihi ikieleza uwezekano wake.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa wimbo huu wa ibada unaohusishwa na muziki.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Muundo wa Kiebrania unaweza kuonyesha utunzi, uhusiano, wakfu, au mkusanyo. “Ya Daudi” hudumisha utata huo vizuri kuliko “iliyoandikwa na Daudi.”
theological_decisions:
- issue: Utunzi au uhusiano unaodokezwa na לְדָוִד
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi; kwa ajili ya Daudi
  rationale: Kichwa cha Kiebrania hakilazimishi dai mahususi la utunzi wa moja kwa moja; tafsiri hii inadumisha uwezekano wa utunzi au uhusiano bila kuamua zaidi ya matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kiliturujia lakini kinachoeleweka kwa wasomaji wa kawaida. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayoelezwa.
