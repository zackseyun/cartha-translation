  yaml_path: translation/ot/psalms/006/002.yaml
  text: Be gracious to me[a], O Yahweh, for I am weak; heal me, O Yahweh[b], for my bones are trembling.
translation:
  language: sw
  text: Unirehemu[a], Ee Yahweh, kwa maana nimedhoofika; uniponye, Ee Yahweh, kwa maana mifupa yangu inatetemeka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Unionee neema”; kitenzi cha Kiebrania kinaomba fadhili au neema.
    reason: lexical_alternative
  - marker: b
    text: Au “mifupa yangu imefadhaika” au “imetaharuki”; “mifupa” inaweza kumaanisha mwili mzima au dhiki ya ndani kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Unirehemu
  rationale: Ombi hili kutoka חנן linamwomba Mungu amwonee mwombaji neema. Katika Kiswahili cha kawaida, “unirehemu” ni ombi la asili na lenye heshima, ingawa “unionee neema” pia linawezekana.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limehifadhiwa kama jina binafsi, badala ya kubadilishwa kuwa cheo.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inatoa sababu ya kila ombi; “kwa maana” huhifadhi uhusiano huo wa kisababishi na inafaa katika ushairi wenye hadhi.
- source_word: אֻמְלַל
  choice: nimedhoofika
  rationale: Neno hili linaonyesha hali ya kudhoofika, kunyauka, au kuishiwa nguvu. “Nimedhoofika” ni la kawaida na hudokeza hali inayoendelea bila kuifupisha kuwa udhaifu wa kawaida tu.
- source_word: רְפָאֵנִי
  choice: uniponye
  rationale: Kitenzi רפא humaanisha kuponya. “Uniponye” ni ombi la moja kwa moja na linaweza kuhusisha mateso ya mwili na ya mtu mzima.
- source_word: נִבְהֲלוּ
  choice: in tetemeka
  rationale: Kitenzi hiki kinaweza kueleza kushtuka, kufadhaika, au kuingiwa na hofu. Pamoja na “mifupa,” “inatetemeka” huwasilisha kwa kawaida athari kali ya kimwili bila kuondoa uwezekano wa dhiki ya ndani.
- source_word: עֲצָמַי
  choice: mifupa yangu
  rationale: Tafsiri halisi ya “mifupa yangu” imehifadhiwa; katika ushairi wa Kiebrania inaweza kuonyesha mwili mzima au dhiki ya ndani kabisa.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia jina la Mungu moja kwa moja. “Yahweh” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Maana ya dhiki ya “mifupa”
  choice: Kudumisha taswira halisi ya mifupa inayotetemeka
  alternative: Mwili wangu wote umefadhaika
  rationale: Taswira ya Kiebrania inaweza kuhusisha mateso ya kimwili na dhiki ya ndani. Tafsiri kuu haipaswi kuamua kwamba ni upande mmoja tu; tanbihi inaeleza upana wake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na marudio ya “Ee Yahweh” yamehifadhiwa. “Nimedhoofika” na “mifupa yangu inatetemeka” ni wazi kwa msomaji wa kawaida huku tanbihi zikihifadhi upana wa Kiebrania.
