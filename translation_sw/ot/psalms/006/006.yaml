  source_fidelity: Tafsiri inanasa vizuri uchovu unaotokana na kuugua, marudio ya “kila usiku,” na taswira ya machozi mengi. Hata hivyo, “nakigharikisha kitanda changu” si usemi wa kawaida wa Kiswahili kwa taswira hii, na “malazi yangu” huelekea kumaanisha makao/lodging kuliko kitanda au mahali pa kujilaza. Pia, dai kwamba בְּכָל־לַיְלָה linaweza kumaanisha “usiku kucha” halina msingi wa kutosha katika muktadha huu; maana yake ni “kila usiku.”
  naturalness: “Ninalowesha kitanda changu” ni Kiswahili sanifu, cha kisasa, na cha kishairi kinachowasilisha kwa wazi hyperbole ya Kiebrania. Kurudia “kitanda changu” katika ulinganifu wa mistari miwili ni asilia na ni afadhali kuliko kutumia “malazi yangu” kwa maana isiyo sahihi kidogo.
  terminology: “Kuugua” na “machozi” zinafaa kwa lamenti hii. “Kitanda” ni sawa kwa מִטָּה na עֶרֶשׂ katika Kiswahili; tofauti ya kileksia ya Kiebrania haihitaji kulazimishwa kwa neno lisilo la kawaida au lisilo sahihi kimuktadha.
  issues:
  - severity: medium
    issue: “Nakigharikisha kitanda changu” si uwasilishaji wa kawaida au sahihi vya kutosha wa taswira ya kitanda kilichofurika/loweshwa kwa machozi.
    rationale: Kughairikisha kwa kawaida huhusishwa na kuzamisha au kuangamiza kwa maji, si kulowesha kitanda kwa machozi. “Ninalowesha” huwasilisha maana ya kimuktadha ya אַשְׂחֶה kwa uwazi.
  - severity: medium
    issue: “Malazi yangu” si sawa kwa urahisi na עַרְשִׂי katika mstari huu.
    rationale: “Malazi” mara nyingi ni makao au mahali pa kufikia, ilhali עֶרֶשׂ hapa ni kitanda/mahali pa kujilaza. “Kitanda changu” ni sahihi na ya kawaida.
  - severity: medium
    issue: Maelezo ya chini yanatoa “usiku kucha” kama tafsiri mbadala ya “kila usiku.”
    rationale: בְּכָל־לַיְלָה inaonyesha tukio linalorudiwa kila usiku, wala si muda wa usiku mzima.
