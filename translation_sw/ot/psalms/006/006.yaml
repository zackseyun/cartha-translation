  text: I am weary with my groaning[a]; every night I drench my bed[b]; with my tears I soak my couch.
translation:
  language: sw
  text: 'Nimechoka kwa kuugua kwangu;


    kila usiku ninalowesha kitanda changu[a];


    kwa machozi yangu ninalowesha kabisa kitanda changu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “nakifanya kitanda changu kiogelee.” Huu ni utiaji chumvi wa kishairi unaomaanisha kukilowesha sana kwa machozi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגַעְתִּי
  choice: Nimechoka
  rationale: Kitenzi יגע kinaonyesha kuchoka au kuishiwa nguvu kutokana na taabu ya muda mrefu. Wakati timilifu wa Kiswahili unaonyesha hali ya sasa iliyotokana na kuugua kwa muda.
- source_word: בְּאַנְחָתִי
  choice: kwa kuugua kwangu
  rationale: אַנְחָה humaanisha kuugua, kuhema kwa huzuni, au kulalamika. Kauli hii ni ya kawaida na yenye hadhi katika Kiswahili, huku ikihifadhi hali halisi ya maombolezo.
- source_word: אַשְׂחֶה
  choice: nakigharikisha
  rationale: Hifili ya שׂחה ina picha ya kukifanya kitanda 'kiogelee.' 'Nakigharikisha' inadumisha utiaji chumvi wa kishairi na wazo la kukifunika kwa wingi wa machozi bila kuwa tafsiri ngumu isiyo ya kawaida.
- source_word: בְכָל לַיְלָה
  choice: kila usiku
  rationale: Kauli hii inaeleweka kwa kawaida kama jambo linalotokea usiku baada ya usiku, ingawa inaweza pia kueleweka kuwa 'usiku kucha.'
- source_word: מִטָּתִי
  choice: kitanda changu
  rationale: מִטָּה ni neno la kawaida kwa kitanda au mahali pa kulala; 'kitanda' ndilo neno wazi zaidi la Kiswahili.
- source_word: בְּדִמְעָתִי
  choice: kwa machozi yangu
  rationale: 'Kihusishi ב hapa kinaonyesha njia au chombo: machozi ndiyo yanayoyalowesha malazi.'
- source_word: עַרְשִׂי
  choice: malazi yangu
  rationale: עֶרֶשׂ ni mahali pa kujilaza au kitanda cha kupumzikia. 'Malazi' huhifadhi utofauti wa neno hili na מִטָּה bila kuingiza picha maalumu mno ya kochi la kisasa.
- source_word: אַמְסֶה
  choice: nayalowesha kabisa
  rationale: Hifili ya מסס kwa msingi ina wazo la kuyeyusha au kufanya kitu kivurugike; katika muktadha huu ni picha ya kukilowesha sana kwa machozi. 'Kabisa' inaendeleza nguvu ya utiaji chumvi wa kishairi.
