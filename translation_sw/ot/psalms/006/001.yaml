  text: יְֽהוָ֗ה אַל בְּ/אַפְּ/ךָ֥ תוֹכִיחֵ֑/נִי וְֽ/אַל בַּ/חֲמָתְ/ךָ֥ תְיַסְּרֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/001.yaml
  text: O Yahweh[a], do not rebuke me in your anger[c][b], and do not discipline me in your wrath.
translation:
  language: sw
  text: Ee Yahwe, usinikemee katika hasira yako, wala usiniadibu katika ghadhabu yako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la Mungu limetafsiriwa moja kwa moja kama “Yahwe”; “Ee” linaonyesha kwamba sala hii inamwelekea Mungu moja kwa moja.
- source_word: אַל ... תוֹכִיחֵנִי
  choice: usinikemee
  rationale: Kikanushi אַל pamoja na kitenzi hiki huleta ombi la kukataza; “usinikemee” ni Kiswahili cha kawaida chenye uzito unaofaa kwa sala.
- source_word: בְּאַפְּךָ
  choice: katika hasira yako
  rationale: אַף kihalisi inaweza kumaanisha pua, lakini hapa ni nahau ya hasira; “katika hasira yako” huhifadhi maana na muundo wa Kiebrania.
- source_word: וְאַל
  choice: wala usini-
  rationale: “Wala” huunganisha ombi la pili na la kwanza kwa ulinganifu wa kishairi na kuendeleza ukanushi.
- source_word: בַּחֲמָתְךָ
  choice: katika ghadhabu yako
  rationale: חֵמָה huonyesha hasira kali au inayowaka; “ghadhabu” hudumisha sajili ya kishairi na kuitofautisha na אַף.
- source_word: תְיַסְּרֵנִי
  choice: usiniadhibu
  rationale: יסר katika Piel humaanisha kurudi, kuonya, au kutia nidhamu kwa njia ya adhabu. “Usiniadhibu” ni ya asili katika Kiswahili na inafaa katika ulinganifu na “usinikemee,” bila kudai kwamba mwombaji anakataa marekebisho yote kwa ujumla.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni; “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Tofauti kati ya maneno mawili yanayoonyesha kutopendezwa kwa Mungu
  choice: hasira / ghadhabu
  alternative: hasira / hasira kali
  rationale: Kutumia maneno mawili tofauti huhifadhi ulinganifu wenye utofauti wa אַף na חֵמָה, bila kuyafanya yawe na maana zinazotengana kupita kiasi.
- issue: Maana ya ombi kuhusu kukemewa na kuadhibiwa
  choice: Ombi lisifanywe katika hasira na ghadhabu
  alternative: Ombi la kutokemewa wala kuadhibiwa kabisa
  rationale: Virai “katika hasira yako” na “katika ghadhabu yako” vinaambatana moja kwa moja na vitenzi husika. Tafsiri inadumisha mvutano wa maandishi bila kueleza zaidi ikiwa mwombaji anakubali marekebisho yasiyo ya hasira.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sala ya kishairi ulio wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Ulinganifu wa mistari miwili umehifadhiwa kwa “usinikemee ... wala usiniadhibu.”
