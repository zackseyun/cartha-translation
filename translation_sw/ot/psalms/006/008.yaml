lexical_decisions:
- source_word: סוּרוּ מִמֶּנִּי
  choice: Ondokeni kwangu
  rationale: Amri ya wingi inadai watu hao waondoke na kujitenga na msemaji; kauli hii ni ya moja kwa moja, yenye nguvu, na ya kawaida katika Kiswahili.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: ninyi nyote mtendao maovu
  rationale: Inahifadhi wazo la watu wanaotenda uovu, huku ikitumia Kiswahili cha asili na kinachoeleweka; ‘nyote’ linaonyesha wazi maana jumuishi ya כָּל.
- source_word: כִּי
  choice: kwa maana
  rationale: Inaonyesha sababu ya amri iliyotangulia na inafaa kwa mtindo wa kishairi wenye hadhi.
- source_word: שָׁמַע
  choice: amesikia
  rationale: Wakati timilifu unaonyesha tendo lililotimia ambalo matokeo yake ni muhimu sasa, jambo linaloonyesha uhakika wa mtunga zaburi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja kwa tahajia iliyozoeleka katika Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: קוֹל בִּכְיִי
  choice: sauti ya kilio changu
  rationale: Inahifadhi taswira ya huzuni inayosikika; ‘kilio’ ni ya asili zaidi katika muundo huu kuliko ‘kulia kwangu,’ bila kubadili maana kuwa machozi yanayoonekana.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia Tetragramatoni kama jina binafsi. ‘Yahwe’ huhifadhi jina hilo kwa namna ya kawaida katika Kiswahili bila kulibadilisha kuwa cheo kama ‘BWANA.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Alama za tanbihi zimewekwa karibu na maneno yanayohusika.
