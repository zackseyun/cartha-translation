  text: Ondokeni kwangu, ninyi nyote mtendao maovu[a], kwa maana Yahwe amesikia sauti ya kilio changu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watendao uovu”; kwa ufupi zaidi, “watenda maovu.”
