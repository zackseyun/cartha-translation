  text: Let all my enemies be ashamed and greatly terrified[a]; let them turn back and be ashamed in an instant.
translation:
  language: sw
  text: Adui zangu wote waaibike na waingiwe na hofu kuu; warudi nyuma na waaibike ghafula.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wafedheheke ... warudi na wafedheheke mara moja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: waaibike
  rationale: Kitenzi cha Kiebrania katika muktadha huu wa kishairi kinaeleza ombi au tamanio. “Waaibike” huhifadhi maana ya kuona aibu au kufedheheka bila kubainisha kilichosababisha hali hiyo.
- source_word: וְיִבָּהֲלוּ
  choice: na waingiwe na hofu
  rationale: Mzizi בהל unaonyesha hofu au mfadhaiko wa ghafla. Kauli “waingiwe na hofu” ni ya kawaida na yenye nguvu katika Kiswahili cha sasa.
- source_word: מְאֹד
  choice: kuu
  rationale: Hiki ni kielezi cha kusisitiza kiwango. Katika Kiswahili, “hofu kuu” huwasilisha kwa ufasaha maana ya kuogopa sana.
- source_word: כָּל אֹיְבָי
  choice: adui zangu wote
  rationale: Hii ni tafsiri ya kawaida na sahihi ya muundo wa Kiebrania unaomaanisha jumla ya adui wa msemaji.
- source_word: יָשֻׁבוּ
  choice: warudi nyuma
  rationale: שׁוב humaanisha kurudi au kugeuka. Katika muktadha wa adui, “warudi nyuma” huonyesha kugeuka na kuondoka bila kuongeza wazi taswira ya kijeshi.
- source_word: יֵבֹשׁוּ
  choice: waaibike
  rationale: Kurudiwa kwa neno lilelile la Kiebrania kumehifadhiwa ili kudumisha msisitizo wa kishairi.
- source_word: רָגַע
  choice: ghafula
  rationale: Neno hili limetumika kielezi kuonyesha tukio la mara moja au la kushtukiza. “Ghafula” ni la asili na huhifadhi dhana ya mabadiliko ya haraka.
