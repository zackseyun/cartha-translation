lexical_decisions:
- source_word: שׁוּבָה
  choice: rudi
  rationale: Kitenzi hiki ni ombi la moja kwa moja kwa BWANA arudi au ageuke kumwelekea mwombaji; “rudi” huhifadhi usemi mfupi na wa dharura wa Kiebrania.
- source_word: חַלְּצָה נַפְשִׁי
  choice: uokoe maisha yangu
  rationale: נֶפֶשׁ hapa humaanisha uhai au nafsi ya mtu mzima iliyo hatarini, si sehemu isiyo ya kimwili pekee; “maisha yangu” ni Kiswahili cha asili katika muktadha wa kuokolewa kutoka hatarini.
- source_word: הוֹשִׁיעֵנִי
  choice: uniokoe
  rationale: Huhifadhi ombi la wokovu au ukombozi wa mwombaji bila kulibana kuwa wokovu wa kiroho pekee.
- source_word: לְמַעַן חַסְדֶּךָ
  choice: kwa sababu ya upendo wako thabiti
  rationale: חֶסֶד huonyesha upendo mwaminifu, wa kudumu, unaotenda kwa fadhili; “upendo wako thabiti” huhifadhi uzito huo, na לְמַעַן huonyesha msingi wa ombi.
theological_decisions:
- issue: Msingi wa ombi la kuokolewa
  choice: kwa sababu ya upendo wako thabiti
  alternative: kwa ajili ya fadhili zako
  rationale: Tafsiri iliyochaguliwa inaweka tegemeo kwa tabia ya Mungu mwenyewe na huhifadhi wazo la חֶסֶד kuwa upendo wa kudumu na mwaminifu bila kuingiza mfumo maalumu wa kimadhehebu.
- issue: Maana ya נַפְשִׁי
  choice: maisha yangu
  alternative: nafsi yangu
  rationale: Katika kilio hiki cha kuokolewa, neno hilo linaweza kurejelea uhai wa mwombaji au yeye mwenyewe; “maisha yangu” huzuia maana kufikiriwa kuwa roho isiyo ya kimwili pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ee BWANA” linafaa kwa ombi la kishairi; herufi kubwa katika BWANA zinawakilisha jina la agano יהוה. Mistari mitatu mifupi inadumisha kasi na dharura ya sala ya Kiebrania.
