  yaml_path: translation/ot/psalms/006/005.yaml
  text: For in death there is no remembrance of you[a]; in Sheol who will give thanks to you?
translation:
  language: sw
  text: 'Kwa maana katika mauti hakuna kumbukumbu yako;

    katika Sheoli[a] ni nani atakayekushukuru?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kaburini” au “katika makao ya wafu.” Sheoli ni neno la Kiebrania linalotaja makao ya wafu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya ombi lililotangulia na kudumisha uhusiano wa kimantiki kwa Kiswahili cha kawaida.
- source_word: אֵין
  choice: hakuna
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili ya kueleza ukanushaji wa kuwepo.
- source_word: בַּמָּוֶת
  choice: katika mauti
  rationale: Inahifadhi maana ya mahali au hali na ulinganifu wa kishairi na “huko Sheoli.” “Mauti” inafaa rejesta ya kishairi na yenye heshima.
- source_word: זִכְרֶךָ
  choice: anayekukumbuka
  rationale: Nomino ya Kiebrania inaweza kumaanisha kukumbuka au kumtaja mtu. Muundo huu ni wa asili katika Kiswahili na, pamoja na mstari wa pili, unaonyesha kutokuwepo kwa ukumbusho wa Mungu miongoni mwa wafu.
- source_word: בִּשְׁאוֹל
  choice: huko Sheoli[a]
  rationale: Jina la Kiebrania limetoholewa ili kuhifadhi dhana yake ya makao ya wafu bila kuifinyanga iwe kaburi moja au kuipa moja kwa moja maana ya jehanamu. “Huko” huonyesha mahali kwa Kiswahili cha asili.
- source_word: מִי
  choice: ni nani
  rationale: Inawasilisha swali la balagha moja kwa moja na kwa ufasaha.
- source_word: יוֹדֶה לָּךְ
  choice: atakayekushukuru
  rationale: Kitenzi ידה katika muktadha huu kina maana ya kushukuru au kusifu. “Atakayekushukuru” ni tafsiri ya moja kwa moja na inayoeleweka kwa urahisi.
theological_decisions:
- issue: Tafsiri ya שְׁאוֹל
  choice: Sheoli
  alternative: kaburi; makao ya wafu; kuzimu
  rationale: Kutumia jina Sheoli kunahifadhi upekee na upana wa dhana ya Kiebrania kuhusu makao ya wafu, bila kuamua kwamba maana yake ni kaburi tu au mahali pa adhabu. Maelezo ya chini yanatoa visawe vinavyosaidia msomaji.
- issue: Kauli kuhusu kutokumbukwa kwa Mungu katika mauti
  choice: hakuna anayekukumbuka
  alternative: hakuna ukumbusho wako; hakuna anayekutaja
  rationale: Tafsiri hii inadumisha nguvu ya kishairi ya maombolezo na ulinganifu wake na swali kuhusu kushukuru, bila kuigeuza kuwa tamko la kimfumo kuhusu hali ya wafu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Mistari miwili inadumisha ulinganifu wa shairi la Kiebrania.
