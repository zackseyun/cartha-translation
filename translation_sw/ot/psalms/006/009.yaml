lexical_decisions:
- source_word: שָׁמַע
  choice: amesikia
  rationale: 'Kauli timilifu ya Kiebrania inaonyesha tendo lililokamilika lenye umuhimu wa sasa: mtunga zaburi anatangaza kwamba Yahwe tayari amemsikia.'
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: תְּחִנָּתִי
  choice: ombi langu la rehema
  rationale: Nomino hii ni ombi la dhati la kuomba kibali au rehema; usemi huu unaonyesha uzito wake na kulitofautisha na תְּפִלָּתִי.
- source_word: תְּפִלָּתִי
  choice: sala yangu
  rationale: Hili ni neno la kawaida la Kiebrania kwa sala; tafsiri hii inadumisha ulinganifu bila kulifanya sawa kabisa na ombi la rehema katika mstari wa kwanza.
- source_word: יִקָּח
  choice: ataipokea
  rationale: Kitenzi hiki kwa msingi humaanisha ‘chukua,’ lakini kinapotumiwa kuhusu sala huonyesha kuipokea. Wakati ujao unahifadhi uhakika unaoelezwa na umbo la Kiebrania.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina la Mungu moja kwa moja; kulitoholea kama ‘Yahwe’ huhifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Maana ya יִקָּח kuhusiana na sala
  choice: ataipokea
  alternative: ataikubali; ataichukua
  rationale: ‘Ataipokea’ ni Kiswahili cha kawaida kinachohifadhi picha ya msingi ya kuchukua bila kuamua kwa nguvu zaidi kwamba sala imekubaliwa; uwezekano wa ‘ataikubali’ umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ombi langu la rehema’ linaonyesha hisia za תְּחִנָּה, huku ‘sala yangu’ ikihifadhi tofauti ya msamiati na ulinganifu wa kishairi. Kiwakilishi cha ngeli katika ‘ataipokea’ kinarejelea ‘sala’.
