  text: Yahwe amesikia ombi langu la rehema; Yahwe ataipokea[a] sala yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ataikubali sala yangu”; kitenzi cha Kiebrania kwa maana halisi ni “kuchukua.”
