lexical_decisions:
- source_word: עָשְׁשָׁה
  choice: limedhoofika
  rationale: Kitenzi kinaonyesha kudhoofika, kuharibika, au kuishiwa nguvu. Kwa kuwa kiima ni jicho, “limedhoofika” huhifadhi picha ya mwili bila kuifanya ihusu kufifia kwa uwezo wa kuona pekee.
- source_word: מִכַּעַס
  choice: kwa huzuni
  rationale: כַּעַס inaweza kumaanisha huzuni, masikitiko, au mfadhaiko unaotokana na kukasirishwa. Katika ombolezo hili, “kwa huzuni” ni Kiswahili cha kawaida na huonyesha chanzo cha kudhoofika, huku tanbihi ikihifadhi uwezekano wa “masikitiko.”
- source_word: עֵינִי
  choice: Jicho langu
  rationale: Kiebrania kimetumia umoja wenye kiambishi cha nafsi ya kwanza. Umoja umehifadhiwa kwa kuwa ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: עָתְקָה
  choice: limechakaa
  rationale: Kitenzi kinaweza kuonyesha kuzeeka au kuchakaa. Kuhusu jicho, “limechakaa” huwasilisha kudhoofika kunakoendelea kwa lugha ya sasa na ya asili kuliko tafsiri ya moja kwa moja “limezeeka.”
- source_word: בְּכָל
  choice: kwa sababu ya ... wote
  rationale: Katika muktadha huu kihusishi kinaonyesha sababu au kisababishi kinachohusiana na jumla ya maadui.
- source_word: צוֹרְרָי
  choice: adui zangu
  rationale: Umbo hili humaanisha wale wanaompinga au kumsonga mtu. “Adui zangu” ni usemi wa kawaida, wenye nguvu inayofaa kwa ombolezo.
