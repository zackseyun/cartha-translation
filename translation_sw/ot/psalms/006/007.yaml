  text: Jicho langu limedhoofika kwa huzuni[a]; limezeeka kwa sababu ya adui zangu wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jicho langu limefifia kwa masikitiko; limechoka kwa sababu ya wote wanaonipinga.”
