  yaml_path: translation/ot/psalms/056/010.yaml
  text: In God I will praise the word[a]; in Yahweh I will praise the word.
translation:
  language: sw
  text: Katika Mungu nitalisifu neno[a]; katika Yahwe nitalisifu neno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ahadi” badala ya “neno” katika mistari yote miwili; neno la Kiebrania דָּבָר linaweza kumaanisha “neno,” “jambo,” au “ahadi,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Katika Mungu
  rationale: Kihusishi ב pamoja na אֱלֹהִים kinaeleweka hapa kama ‘katika/kuhusiana na Mungu’; ‘Katika Mungu’ huhifadhi nahau ya kishairi na usambamba na בַּיהוָה.
- source_word: אֲהַלֵּל
  choice: nitalisifu
  rationale: Piel imperfect nafsi ya kwanza umoja inaonyesha azimio au wakati ujao katika muktadha huu; kiambishi cha yambwa ‘-li-’ hulirejelea ‘neno’ kwa Kiswahili cha kawaida.
- source_word: דָּבָר
  choice: neno
  rationale: דָּבָר inaweza kumaanisha ‘neno,’ ‘jambo,’ au kwa muktadha ‘ahadi.’ ‘Neno’ huhifadhi upana wa maana na urudiaji wa Kiebrania bila kuamua kimya kimya kuwa ni ‘ahadi.’
- source_word: בַּיהוָה
  choice: katika Yahwe
  rationale: Kihusishi ב kimetafsiriwa ‘katika’ ili kuhifadhi usambamba wa mistari; jina la agano יְהוָה limetolewa kama ‘Yahwe.’
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia Tetragramatoni moja kwa moja; ‘Yahwe’ huhifadhi jina la agano badala ya kulibadilisha kuwa cheo, bila kuingiza mapokeo ya dhehebu.
- issue: Je, דָּבָר ni ‘neno’ au ‘ahadi’?
  choice: neno katika matini kuu
  alternative: ahadi
  rationale: Muktadha unaweza kuelekeza kwenye ahadi ya Mungu, lakini neno la Kiebrania lina maana pana. Matini kuu huhifadhi utata huo, na tanbihi hutaja uwezekano wa ‘ahadi.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na urudiaji wa mistari miwili umehifadhiwa; ‘katika Mungu/katika Yahwe’ huhifadhi nahau na usambamba wa chanzo.
