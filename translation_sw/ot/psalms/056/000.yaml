base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/000.yaml
  text: 'For the choir director: according to “The Silent Dove of Distant Places.” Of David[a]. A miktam[b], when the Philistines seized him in Gath.'
translation:
  language: sw
  text: 'Kwa kiongozi wa waimbaji: kwa kufuata “Njiwa wa Kimya wa Mahali ya Mbali.” Ya Daudi.[a] Miktamu,[b] wakati Wafilisti walipomkamata huko Gathi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “ya Daudi”; maneno hayo yanaweza kumaanisha ilitungwa na Daudi, ni ya Daudi, au inahusiana naye.
    reason: alternative_reading
  - marker: b
    text: Miktamu ni istilahi ya kitaalamu katika vichwa vya zaburi; maana yake kamili haijulikani.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa kiongozi wa waimbaji
  rationale: Ni fomula ya vichwa vya zaburi inayomwelekeza msimamizi wa utendaji wa muziki; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: עַל
  choice: kwa kufuata
  rationale: Katika kichwa cha zaburi, neno hili linaweza kutambulisha wimbo au mtindo wa muziki unaofuatwa.
- source_word: יוֹנַת אֵלֶם רְחֹקִים
  choice: “Njiwa Bubu wa Mahali pa Mbali”
  rationale: Kirai hiki kisichoeleweka vizuri huenda ni jina la wimbo. אֵלֶם huhusishwa na ububu au ukimya, na רְחֹקִים na yaliyo mbali; kuweka kama jina lililonukuliwa huepuka kudai uhakika usiokuwapo.
- source_word: לְדָוִד
  choice: Zaburi ya Daudi
  rationale: ‘Ya Daudi’ huhifadhi uwezekano wa uandishi, umilikaji, au uhusiano na Daudi bila kuamua kwa lazima maana moja.
- source_word: מִכְתָּם
  choice: Miktamu
  rationale: Ni istilahi ya kitaalamu katika vichwa vya zaburi ambayo maana yake kamili haijulikani; imenukuliwa kwa sauti badala ya kutafsiriwa kwa kubahatisha.
- source_word: בֶּאֱחֹז אֹתוֹ
  choice: wakati ... walipomkamata
  rationale: Muundo huu unaonyesha wakati au tukio lililokuwa mazingira ya zaburi; ‘kumkamata’ huwasilisha tendo la kumtia mtu mikononi bila kuongeza maelezo yasiyomo.
- source_word: פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la taifa hilo katika Kiswahili.
- source_word: בְּגַת
  choice: huko Gathi
  rationale: Kihusishi ni cha mahali, na ‘huko’ huleta Kiswahili cha kawaida huku jina la mahali likihifadhiwa.
theological_decisions:
- issue: Hadhi na hali ya kichwa cha zaburi
  choice: Kichwa kimetafsiriwa kama sehemu ya maandishi, huku taarifa zake za muziki na historia zikihifadhiwa na istilahi isiyo na maana hakika kutonafsiriwa kwa kubahatisha.
  alternative: Kukichukulia kama maelezo ya mhariri yasiyotafsiriwa, au kutafsiri מִכְתָּם kwa maana ya kudhaniwa kama ‘zaburi ya dhahabu.’
  rationale: Maandishi ya Kiebrania yanakitoa kama kichwa cha zaburi. Kukitafsiri huku tukihifadhi kutokuwa na uhakika huepuka madai ya kihistoria au kiteolojia yanayopita ushahidi.
- issue: Maana ya לְדָוִד
  choice: ‘ya Daudi’
  alternative: ‘iliyoandikwa na Daudi’ au ‘kwa ajili ya Daudi’
  rationale: Kihusishi cha Kiebrania kinaweza kuonyesha uandishi, uhusiano, umilikaji, au wakfu; ‘ya Daudi’ huhifadhi upana huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Jina la wimbo limewekwa katika alama za kunukuu ili kuonyesha kuwa huenda ni maelekezo ya muziki. Kila alama ya tanbihi katika maandishi ina tanbihi inayolingana.
