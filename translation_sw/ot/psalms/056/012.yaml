  yaml_path: translation/ot/psalms/056/012.yaml
  text: Your vows are upon me[a], O God[b]; I will render thank offerings to you.
translation:
  language: sw
  text: Ee Mungu, nadhiri zako ziko juu yangu[a]; nitakutolea sadaka za shukrani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya kawaida zaidi, “nadhiri zangu kwako.” Kiebrania kinasema kihalisi “nadhiri zako,” yaani nadhiri ambazo mwombaji anawajibika kuzitimiza kwa Mungu.
    reason: alternative_reading
  - marker: b
    text: Au, “shukrani.” Neno la Kiebrania linaweza kumaanisha maneno au matendo ya shukrani, au sadaka za shukrani.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלַי
  choice: ziko juu yangu
  rationale: Inahifadhi taswira ya Kiebrania ya jambo lililo juu ya mtu huku ikidokeza wajibu unaomkabili.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Nomino hii imetumiwa kama mwito wa moja kwa moja; “Ee” huonyesha mwito huo kwa Kiswahili cha kawaida na chenye heshima.
- source_word: נְדָרֶיךָ
  choice: nadhiri zako
  rationale: Hufuata kiambishi cha nafsi ya pili katika Kiebrania bila kukibadili kimyakimya kuwa “nadhiri zangu kwako”; maana ya nadhiri anazodaiwa Mungu inaelezwa katika tanbihi.
- source_word: אֲשַׁלֵּם
  choice: nitakutolea
  rationale: Katika muktadha wa nadhiri na sadaka, kitenzi kina maana ya kutoa au kulipa kilicho wajibu. Muundo huu ni wa asili katika Kiswahili unapohusishwa na sadaka.
- source_word: תּוֹדֹת
  choice: sadaka za shukrani
  rationale: Neno linaweza kumaanisha shukrani au matoleo ya shukrani; muktadha wa kulipa nadhiri unaunga mkono maana ya sadaka, bila kuficha maana nyingine iliyo katika tanbihi.
- source_word: לָךְ
  choice: -ku- katika “nitakutolea”
  rationale: Kiambishi cha yambwa “-ku-” pamoja na “-tolea” huonyesha kwa kawaida kwamba Mungu ndiye mpokeaji.
theological_decisions:
- issue: Maana ya “nadhiri zako” kuhusiana na Mungu
  choice: Nadhiri zako ziko juu yangu
  alternative: Nadhiri zangu nilizoweka kwako zinanifunga
  rationale: Matini ya Kiebrania ina kiambishi cha nafsi ya pili, yaani “zako.” Tafsiri kuu inalinda usemi huo na mvutano wake badala ya kuongeza “zangu” na “kwako”; tanbihi inaonyesha maana ya kimuktadha.
- issue: Ikiwa תּוֹדֹת ni maneno ya shukrani au sadaka
  choice: sadaka za shukrani
  alternative: shukrani
  rationale: Uhusiano na nadhiri na kitenzi cha kulipa au kutimiza wajibu unapendekeza matoleo ya ibada, lakini maana pana ya shukrani bado inawezekana na imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi “ziko juu yangu” umeachwa kwa makusudi ili kuhifadhi taswira na utata halisi wa Kiebrania; tanbihi hutoa maana ya kawaida zaidi.
