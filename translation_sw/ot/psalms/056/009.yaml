  verdict: revise
  source_fidelity: The main issue is the added explicit object in “nitakapokuita” (“when I call you”). The Hebrew אֶקְרָא means “I call / cry out” and does not state the addressee. The broader Swahili “nitakapolia” preserves that omission while remaining idiomatic in this prayer context. The remaining clauses accurately convey the Hebrew sequence, retreat imagery, and divine support.
  naturalness: “Ndipo adui zangu watarudi nyuma siku nitakapolia” is natural, dignified Standard East African Swahili. A colon after “Hili najua” cleanly introduces the content known and avoids the somewhat cumbersome “najua, kwamba.”
  terminology: “Adui zangu,” “Mungu,” and “yuko upande wangu” are appropriate and clear. “Yuko upande wangu” communicates the contextual sense of לִי, divine favor/support, without asserting possession.
  issues:
  - severity: medium
    issue: “nitakapokuita” supplies an explicit second-person object.
    rationale: The Hebrew verb is unqualified and can mean “I call” or “I cry out”; it does not explicitly say “I call you.” Although God is readily inferred from context, the translation should not make that implicit object explicit in the main text.
  - severity: low
    issue: The footnote rationale over-explains the instrumental alternative.
    rationale: The explanation that the enemies’ retreat is the evidence is plausible, but the Hebrew demonstrative is syntactically disputed. The footnote should preserve the alternative without fixing its precise referent more narrowly than the text does.
