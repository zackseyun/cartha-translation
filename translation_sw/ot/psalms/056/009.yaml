  text: אָ֥֨ז יָ֘שׁ֤וּבוּ אוֹיְבַ֣/י אָ֭חוֹר בְּ/י֣וֹם אֶקְרָ֑א זֶה יָ֝דַ֗עְתִּי כִּֽי אֱלֹהִ֥ים לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/009.yaml
  text: Then my enemies will turn back in the day I call. This I know[a], that God is for me.
translation:
  language: sw
  text: 'Ndipo adui zangu watarudi nyuma siku nitakapolia. Hili najua[a]: Mungu yuko upande wangu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa hili najua kwamba Mungu yuko upande wangu.”
    reason: Kiebrania kinaweza kueleweka ama “Hili najua” ama “Kwa hili najua.”
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Inaonyesha matokeo au mfuatano wa matukio kwa njia ya kawaida na yenye hadhi katika Kiswahili.
- source_word: יָשׁוּבוּ ... אָחוֹר
  choice: watarudi nyuma
  rationale: Muungano huu unaonyesha kugeuka au kurudi nyuma, hasa katika kushindwa; tafsiri hii inadumisha taswira ya mwendo bila kuongeza ufafanuzi.
- source_word: אוֹיְבַי
  choice: adui zangu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya nomino yenye kiambishi cha umilikaji.
- source_word: בְּיוֹם אֶקְרָא
  choice: siku nitakapokuita
  rationale: Inahifadhi neno halisi la wakati, ‘siku,’ huku muundo wa ‘nitakapokuita’ ukisomeka kwa ufasaha. Kirejeshi cha nafsi ya pili kinaeleza mlengwa anayeeleweka katika muktadha wa sala.
- source_word: זֶה יָדַעְתִּי
  choice: Hili najua
  rationale: Inadumisha usomaji wa kiashiria, ‘hili,’ na wakati timilifu wa Kiebrania unaelezwa kwa hali ya sasa ya uhakika katika Kiswahili.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa kinaanzisha yaliyomo katika jambo analolijua mtunga zaburi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ni jina la kawaida la Mungu; ingawa umbo la Kiebrania ni la wingi, maana yake hapa ni umoja.
- source_word: לִי
  choice: yuko upande wangu
  rationale: Katika muktadha wa adui kurudi nyuma baada ya sala, kihusishi hiki kinaonyesha msaada au upendeleo wa Mungu, si umilikaji.
theological_decisions:
- issue: Maana ya אֱלֹהִים לִי
  choice: Mungu yuko upande wangu
  alternative: Mungu ni wangu / Mungu yuko kwa ajili yangu
  rationale: Kishazi cha Kiebrania ni kifupi na kinaweza kueleweka kwa namna zaidi ya moja. Muktadha wa wokovu dhidi ya adui unaunga mkono maana ya msaada na upendeleo wa Mungu; ‘yuko upande wangu’ ni ya kawaida na haidai umilikaji.
- issue: Uhusiano wa זֶה na kifungu kinachofuata
  choice: '‘Hili najua’: kauli inayofuata ndiyo jambo linalojulikana'
  alternative: '‘Kwa hili najua’: kurudi nyuma kwa adui ndiyo ushahidi kwamba Mungu yuko upande wake'
  rationale: Sintaksia inaruhusu usomaji wa kiashiria au wa njia/ushahidi. Maandishi makuu yanatumia usomaji wa kiashiria, huku tanbihi ikihifadhi uwezekano mwingine halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ndipo’ na ‘watarudi nyuma’ huhifadhi mpangilio na taswira ya Kiebrania. Sentensi ya sala imetumia ‘nitakapokuita’ kwa ufasaha wa Kiswahili, ingawa kitenzi cha Kiebrania hakitaji wazi mtendewa; muktadha humtambulisha kuwa Mungu.
