base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/007.yaml
  text: Because of iniquity[a], do not let them escape; in anger bring down the peoples[b], O God.
translation:
  language: sw
  text: Kwa sababu ya uovu[a], usiwaache waponyoke; kwa hasira uwashushe mataifa[b], Ee Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa sababu ya uovu, usiwaokoe.” Kishazi cha Kiebrania ni kigumu; wengine hukielewa kitenzi hiki moja kwa moja kuwa “okoa” badala ya “ruhusu waponyoke.”
    reason: alternative_reading
  - marker: b
    text: Au, “watu wa mataifa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: Kwa sababu ya
  rationale: Kihusishi hiki kinaonyesha sababu au msingi wa ombi; tafsiri hii ni ya kawaida na ya wazi katika Kiswahili.
- source_word: אָוֶן
  choice: uovu
  rationale: Neno hili humaanisha uovu au tendo baya lenye madhara. “Uovu” linahifadhi uzito wa kimaadili bila kutumia lugha ya kizamani.
- source_word: פַּלֶּט
  choice: usiwaache waponyoke
  rationale: Kitenzi kinaweza kumaanisha kuponyoka au kuokoa. Katika muktadha huu wa ombi la hukumu, kimetafsiriwa kama ombi hasi kwamba waovu wasiruhusiwe kuponyoka; ugumu wa Kiebrania umeelezwa katika tanbihi.
- source_word: לָמוֹ
  choice: wa-
  rationale: Kiwakilishi hiki kinawarejelea wapinzani waovu na kimejumuishwa kiasili katika kitenzi cha Kiswahili “usiwaache.”
- source_word: בְּאַף
  choice: kwa hasira
  rationale: Nahau hii humaanisha kwa hasira au ghadhabu. “Kwa hasira” ni ya kawaida, yenye nguvu, na haiongezi kimilikishi kisichotajwa wazi katika Kiebrania.
- source_word: עַמִּים
  choice: watu wa mataifa
  rationale: Wingi huu unaonyesha vikundi vya watu au mataifa. “Watu wa mataifa” huhifadhi wazo la makundi ya watu, huku “mataifa” likitolewa kama tafsiri mbadala.
- source_word: הוֹרֵד
  choice: washushe
  rationale: 'Hii ni amri ya kisababishi kutoka katika kitenzi “kushuka”: Mungu anaombwa awafanye washuke, yaani awaangushe au awadhalilishe. “Washushe” linahifadhi sitiari ya kushuka.'
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Jina hili limetumika kama mwito wa moja kwa moja mwishoni mwa ombi; “Ee Mungu” huonyesha wazi matumizi hayo katika Kiswahili.
theological_decisions:
- issue: Ombi la hukumu na ukanushi unaodokezwa katika kishazi kigumu cha Kiebrania
  choice: Kishazi kimetafsiriwa kama ombi kwamba waovu wasiruhusiwe kuponyoka kwa sababu ya uovu, likifuatiwa na ombi Mungu awashushe watu wa mataifa kwa hasira.
  alternative: 'Kwa sababu ya uovu, usiwaokoe; au: Kwa sababu ya taabu, wao huponyoka.'
  rationale: Kiebrania kimebanwa kisintaksia, hasa katika עַל אָוֶן פַּלֶּט לָמוֹ, na kinaweza kueleweka kwa njia zaidi ya moja. Muktadha wa zaburi na ombi linalofuata la hukumu vinaunga mkono tafsiri ya ombi hasi, lakini uwezekano mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wa kishairi, na unaoeleweka kwa wasomaji wa kawaida. “Waponyoke” ni ya sasa na ya kawaida; “Ee Mungu” huhifadhi uzito wa mwito wa kizaburi. Alama zote za tanbihi zimewekwa katika matini kuu.
