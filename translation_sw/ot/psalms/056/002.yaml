  text: Adui zangu hunifuata kwa pupa mchana kutwa; maana wengi wanapigana nami kwa majivuno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ee Uliye Juu.” Neno la mwisho la Kiebrania linaweza kusomwa kama mwito wa moja kwa moja kwa Mungu; wengine hulielewa kama “kutoka juu.”
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁאֲפוּ
  choice: hunifuatilia kwa uchu
  rationale: Kitenzi huleta picha ya kuhema au kunusa kwa hamu na, katika muktadha wa uhasama, humaanisha kufuatilia kwa pupa ili kushambulia. Kauli hii ni ya kawaida kwa Kiswahili na huhifadhi nguvu ya picha bila kulazimisha maana ya ‘kukanyaga.’
- source_word: שׁוֹרְרַי
  choice: Adui zangu
  rationale: Neno hili linarejelea wapinzani wenye uhasama; ‘adui zangu’ ni wazi, fupi, na la kawaida katika Kiswahili cha sasa.
- source_word: כָּל הַיּוֹם
  choice: mchana kutwa
  rationale: Ni usemi wa asili wa Kiswahili unaomaanisha muda wote wa siku.
- source_word: כִּי
  choice: maana
  rationale: Hapa kiunganishi kinatoa sababu ya malalamiko yaliyotangulia.
- source_word: רַבִּים
  choice: wengi
  rationale: Huhifadhi maana ya idadi kubwa kwa ufupi na kwa kawaida.
- source_word: לֹחֲמִים לִי
  choice: wanapigana nami
  rationale: Huhifadhi tendo linaloendelea la uhasama linaloelekezwa dhidi ya mtunga zaburi.
- source_word: מָרוֹם
  choice: kwa majivuno
  rationale: Katika sentensi hii neno linaweza kueleza namna wapinzani wanavyopigana, yaani kwa kujikweza. Kwa kuwa linaweza pia kusomwa kama mwito kwa Mungu au kwa maana ya mahali pa juu, uwezekano huo umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya מָרוֹם
  choice: kwa majivuno
  alternative: “Ee Uliye Juu” au “kutoka juu”
  rationale: Muundo wa Kiebrania umebanwa na unaruhusu maana kadhaa. Maana ya kielezi ‘kwa majivuno’ inaingia kwa kawaida katika Kiswahili na katika muktadha, huku tanbihi ikihifadhi uwezekano wa mwito kwa Mungu na ule wa mahali bila kuondoa mvutano wa kifasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kwa uchu’ huhifadhi wazo la ufuatiliaji wa pupa; ‘mchana kutwa’ ni nahau ya sasa na ya kawaida.
