base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/004.yaml
  text: In God I will praise his word[a]; in God I have trusted; I will not fear[c][b]. What can flesh do to me?
translation:
  language: sw
  text: Katika Mungu nitalisifu neno lake; katika Mungu nimeweka tumaini langu; sitaogopa. Mwanadamu[b] atanifanyia nini?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwanadamu anaweza kunifanyia nini?” Kiebrania kina umbo la wakati ujao, lakini swali hili la balagha pia linaweza kueleza kutokuwa na uwezo.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania ni “mwili”; hapa linamaanisha binadamu dhaifu kwa kulinganishwa na Mungu.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Kwa Mungu
  rationale: Kirai hiki kinadumisha Mungu kuwa msingi na mahali pa tumaini na sifa. “Kwa Mungu” ni kifupi na cha kishairi, na hakiongezi wazo lisilosemwa wazi kama “kwa msaada wa Mungu.”
- source_word: אֲהַלֵּל
  choice: nitalisifu
  rationale: Kauli ya wakati ujao inaonyesha azimio la mtunga zaburi la kulisifu neno la Mungu.
- source_word: דְּבָרוֹ
  choice: neno lake
  rationale: Hifadhi upana wa דָּבָר bila kuibana iwe “ahadi” pekee; inaweza kumaanisha asemalo Mungu, kutia ndani ahadi yake.
- source_word: בָּטַחְתִּי
  choice: nimeweka tumaini langu
  rationale: Huwasilisha tendo lililofanyika lenye matokeo ya sasa na ni Kiswahili cha kawaida kwa kumtegemea Mungu.
- source_word: לֹא אִירָא
  choice: sitaogopa
  rationale: Huwasilisha kwa kawaida azimio na uhakika unaoelekezwa mbele.
- source_word: מַה יַּעֲשֶׂה
  choice: atanifanyia nini?
  rationale: Huhifadhi umbo la Kiebrania la wakati ujao na nguvu ya swali la balagha bila kulazimisha maana ya uwezo pekee.
- source_word: בָשָׂר
  choice: mwenye mwili
  rationale: Huhifadhi taswira halisi ya “mwili” huku ikionyesha kuwa anayelengwa ni binadamu dhaifu.
- source_word: לִי
  choice: -nifanyia
  rationale: Kiambishi cha kitendewa katika “atanifanyia” kinawasilisha kwa kawaida maana ya “kwangu/mimi” katika muktadha huu.
theological_decisions:
- issue: Maana ya בָשָׂר inapolinganishwa na Mungu
  choice: mwenye mwili
  alternative: mwanadamu dhaifu
  rationale: “Mwenye mwili” huhifadhi taswira na mvutano wa Kiebrania kati ya Mungu na udhaifu wa kibinadamu; tanbihi inaeleza rejeleo hilo bila kulifuta katika matini.
- issue: Nguvu ya swali מַה יַּעֲשֶׂה
  choice: atanifanyia nini?
  alternative: anaweza kunifanyia nini?
  rationale: Umbo la wakati ujao limehifadhiwa, lakini swali linaweza pia kueleweka kama tangazo la kutokuwa na uwezo; tanbihi inalinda uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi, wa heshima na unaoeleweka. Marudio ya “Kwa Mungu” yanahifadhi ulinganifu wa Kiebrania; alama za nusu koloni zinaunganisha sifa, tumaini na matokeo yake ya kutoogopa.
