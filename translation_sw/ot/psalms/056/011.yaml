  text: In God I have trusted; I will not fear[a]. What can man do to me?
translation:
  language: sw
  text: Nimemtumaini Mungu; sitaogopa. Mwanadamu atanitenda nini?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Mungu
  rationale: Katika Kiswahili, kitenzi “kumtumaini” huchukua yambwa moja kwa moja; hivyo maana ya ב kama kitu ambacho tumaini limewekwa ndani yake inaelezwa kwa kawaida bila kutafsiri kihusishi kivyake.
- source_word: בָּטַחְתִּי
  choice: nimemtumaini
  rationale: Kauli timilifu ya nafsi ya kwanza umoja inaeleza tumaini lililowekwa na linalosimama; wakati timilifu wa Kiswahili unalihifadhi vizuri.
- source_word: לֹא אִירָא
  choice: sitaogopa
  rationale: Kauli isiyotimilifu baada ya לֹא ina nguvu ya wakati ujao au azimio la kujiamini katika muktadha huu.
- source_word: מַה יַּעֲשֶׂה
  choice: anaweza kunitenda nini?
  rationale: Swali la balagha linadokeza kutokuwa na uwezo wa kumdhuru msemaji; “anaweza” huwasilisha nguvu hiyo kwa Kiswahili cha kawaida, huku “kunitenda” ikihifadhi maana ya msingi ya עשה pamoja na לִי.
- source_word: אָדָם
  choice: mwanadamu
  rationale: Nomino hii ni umoja lakini inatumika kiwakilishi kwa mtu yeyote; “mwanadamu” huhifadhi umoja na tofauti kati ya Mungu na binadamu bila kuifanya kuwa wingi wa jumla.
- source_word: לִי
  choice: ni- katika “kunitenda”
  rationale: Kiwakilishi cha yambwa katika kitenzi cha Kiswahili kinaeleza kwa kawaida uhusiano wa “kunifanyia/kunitenda.”
theological_decisions:
- issue: Tafsiri ya אָדָם katika matumizi ya umoja yanayowakilisha wanadamu
  choice: mwanadamu
  alternative: mtu; binadamu
  rationale: “Mwanadamu” ni umoja, inafaa katika lugha yenye hadhi, na inadumisha tofauti ya kishairi kati ya Mungu na mpinzani yeyote wa kibinadamu bila kudokeza mwanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio ni mfupi na wa kishairi; nusu ya pili imehifadhiwa kama swali la balagha. Hakuna tanbihi inayohitajika kwa kuwa “mwanadamu” tayari huonyesha wazi matumizi ya אָדָם kwa binadamu yeyote.
