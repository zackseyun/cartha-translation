  text: נֹדִ/י֮ סָפַ֪רְתָּ֫ה אָ֥תָּה שִׂ֣ימָ/ה דִמְעָתִ֣/י בְ/נֹאדֶ֑/ךָ הֲ֝/לֹ֗א בְּ/סִפְרָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/008.yaml
  text: You have counted my wanderings[a]; put my tears in your bottle—are they not in your book?
translation:
  language: sw
  text: 'Wewe umehesabu kutangatanga kwangu;

    yatie machozi yangu katika kiriba chako[a]—

    je, hayamo katika kitabu chako?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiriba kilikuwa chombo cha ngozi cha kuhifadhia vimiminika, si chupa ya kisasa ya kioo au plastiki.
    reason: Ufafanuzi wa kitu cha kale kinachotajwa na נֹאד.
lexical_decisions:
- source_word: נֹדִי
  choice: kutangatanga kwangu
  rationale: Nomino hii inatokana na נוד na inaonyesha kuzunguka au kuhama huku mtu akisukumwa kutoka mahali pamoja hadi pengine. “Kutangatanga kwangu” inadumisha picha halisi ya maisha ya mkimbizi bila kuibadili kuwa wazo la jumla la taabu.
- source_word: סָפַרְתָּה
  choice: umehesabu
  rationale: ספר kimsingi ni kuhesabu au kuweka idadi, na inaweza pia kudokeza kuweka kumbukumbu. “Umehesabu” inadumisha maana halisi na kuonyesha kwamba Mungu ameangalia kila tukio kwa makini.
- source_word: שִׂימָה
  choice: yatie
  rationale: Ni ombi la kuamuru kutoka שׂים, ‘weka/tia.’ “Yatie” ni Kiswahili cha kawaida kinachopatana na ‘machozi’ na picha ya kuyakusanya ndani ya chombo.
- source_word: דִמְעָתִי
  choice: machozi yangu
  rationale: Tafsiri ya kawaida na ya kiasili katika Kiswahili; wingi unafaa kwa maana ya machozi yanayomwagika.
- source_word: בְּנֹאדֶךָ
  choice: katika kiriba chako
  rationale: נֹאד ni chombo kilichotengenezwa kwa ngozi, kama kiriba. Neno hili linahifadhi picha ya ulimwengu wa kale kwa usahihi zaidi kuliko ‘chupa,’ ambayo leo kwa kawaida hudhaniwa kuwa ya kioo au plastiki.
- source_word: הֲלֹא
  choice: je, hayamo
  rationale: הֲלֹא huanzisha swali la balagha linalotarajia jibu la kukubali. Muundo huu unahifadhi swali badala ya kuligeuza kuwa kauli ya moja kwa moja.
- source_word: בְּסִפְרָתֶךָ
  choice: katika kitabu chako
  rationale: Neno hili hapa linamaanisha kitabu au kumbukumbu iliyoandikwa. “Kitabu chako” ni wazi, cha kawaida, na hakibainishi bila lazima kama kilikuwa gombo.
theological_decisions:
- issue: Picha za Mungu akihifadhi machozi na kuwa na kitabu
  choice: Kudumisha picha halisi za kishairi za kiriba na kitabu
  alternative: Kufafanua kwa ujumla kuwa Mungu anakumbuka huzuni zote za mwombaji
  rationale: Kiebrania kinatumia picha thabiti kuonyesha uangalifu wa Mungu kwa mateso ya mwombaji. Kuzibadili kuwa maelezo ya jumla kungepunguza nguvu ya kishairi na ya kiteolojia ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka kwa msomaji wa kawaida. Mkazo wa kiwakilishi katika אָתָּה umehifadhiwa kwa “Wewe,” na swali la balagha la mwisho limeachwa wazi kama lilivyo katika Kiebrania.
