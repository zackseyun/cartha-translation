source:
  edition: WLC
  text: חָנֵּ֣/נִי אֱ֭לֹהִים כִּֽי שְׁאָפַ֣/נִי אֱנ֑וֹשׁ כָּל הַ֝/יּ֗וֹם לֹחֵ֥ם יִלְחָצֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/001.yaml
  text: Be gracious to me[a], O God, for man pants after me; all day long, fighting, he oppresses me.
translation:
  language: sw
  text: Unirehemu, ee Mungu, kwa maana mwanadamu ananifuatilia kwa uchu[a]; mchana kutwa ananipiga vita na kunikandamiza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ananikanyaga,” “ananirukia,” au “anataka kunimeza”; kitenzi cha Kiebrania kinaonyesha kuhema kwa uhasama au kufuatilia kwa uchu.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Unirehemu
  rationale: Ombi hili la moja kwa moja linaomba fadhili za Mungu. Katika Kiswahili cha maombi, “unirehemu” ni la asili na lenye heshima, bila kulazimisha kwamba hapa ni ungamo la dhambi.
- source_word: אֱלֹהִים
  choice: ee Mungu
  rationale: Kirai hiki ni mwito wa moja kwa moja; “ee Mungu” huonyesha hali hiyo kwa Kiswahili cha kishairi na cha sala.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu ya ombi la mtunga zaburi.
- source_word: שְׁאָפַנִי
  choice: ananifuatilia kwa uchu
  rationale: Kitenzi שׁאף kina picha ya kuhema au kutweta kwa hamu, na kwa upanuzi humaanisha kumwandama mtu kwa uchu wa uhasama. Tafsiri hii huhifadhi picha na wazo la ufuatiliaji mkali kwa Kiswahili kinachoeleweka.
- source_word: אֱנוֹשׁ
  choice: mwanadamu
  rationale: Nomino hii humtaja binadamu dhaifu au mwenye kufa. “Mwanadamu” huhifadhi utofauti kati ya Mungu na mpinzani aliye binadamu bila kuongeza wazo lisilokuwamo.
- source_word: כָּל הַיּוֹם
  choice: mchana kutwa
  rationale: Hiki ni kirai cha kawaida cha Kiswahili kinachoonyesha tendo linaloendelea siku nzima.
- source_word: לֹחֵם
  choice: ananipiga vita
  rationale: Kishiriki cha kitenzi לחם kinaonyesha uhasama unaoendelea. Kikiunganishwa na kitenzi kinachofuata, “ananipiga vita na…” hutoa Kiswahili cha asili huku kikidumisha tendo la kupigana.
- source_word: יִלְחָצֵנִי
  choice: kunikandamiza
  rationale: Kitenzi לחץ humaanisha kubana, kuonea, au kukandamiza. “Kunikandamiza” huwasilisha shinikizo la uhasama kwa lugha ya sasa.
theological_decisions:
- issue: Jinsi ya kutafsiri אֱנוֹשׁ
  choice: mwanadamu
  alternative: mtu mwenye kufa
  rationale: Muktadha unamtaja mpinzani wa kibinadamu katika umoja. “Mwanadamu” ni neno la kawaida na huhifadhi tofauti kati ya Mungu na upinzani wa binadamu; “mtu mwenye kufa” lingeonyesha zaidi udhaifu wake lakini ni zito katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na mwangwi wa kishairi. Muundo umewekwa wazi kwa msomaji wa kawaida, huku taswira tata ya שׁאף ikihifadhiwa katika matini na tanbihi.
