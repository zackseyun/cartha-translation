  text: כָּל הַ֭/יּוֹם דְּבָרַ֣/י יְעַצֵּ֑בוּ עָלַ֖/י כָּל מַחְשְׁבֹתָ֣/ם לָ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/005.yaml
  text: All day long they twist my words[c][b][a]; all their thoughts are against me for evil.
translation:
  language: sw
  text: Siku nzima huyapotosha maneno yangu[a]; mawazo yao yote ni dhidi yangu kwa nia mbaya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huyadhuru maneno yangu.” Kitenzi cha Kiebrania ni kigumu na kinaweza kumaanisha kuumiza, kusababisha huzuni, au kupinda/kupotosha; katika muktadha huu, kupotosha maneno kwa uadui kunafaa zaidi.
    reason: lexical_alternative
  - marker: b
    text: Au, “mipango yao yote dhidi yangu inalenga kunidhuru.” Neno la Kiebrania linaweza kumaanisha mawazo, mipango, au hila.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Siku nzima
  rationale: Nahau hii inaonyesha tendo linaloendelea katika muda wote wa siku; “siku nzima” ni Kiswahili cha kawaida na cha asili.
- source_word: דְּבָרַי
  choice: maneno yangu
  rationale: Ingawa דָּבָר inaweza kumaanisha neno, jambo, au shughuli, hapa “maneno yangu” inafaa zaidi kama kitu kinachopotoshwa na maadui.
- source_word: יְעַצֵּבוּ
  choice: huyapotosha
  rationale: Kitenzi hiki ni kigumu na kinaweza kuhusisha kuumiza, kusababisha huzuni, au kupinda/kupotosha. Kikiwa na “maneno yangu” kama shamirisho, “huyapotosha” kinaeleza vyema uwasilishaji mbaya wa maneno kwa makusudi.
- source_word: עָלַי
  choice: dhidi yangu
  rationale: Katika muktadha wa uadui, kirai hiki kina nguvu ya upinzani; “dhidi yangu” ni wazi na cha asili.
- source_word: כָּל מַחְשְׁבֹתָם
  choice: mawazo yao yote
  rationale: מַחְשָׁבוֹת inaweza kumaanisha mawazo, mipango, au hila. “Mawazo” ndilo chaguo la moja kwa moja, huku nia ya uadui ikibainishwa na kirai kinachofuata.
- source_word: לָרָע
  choice: kwa nia mbaya
  rationale: Kirai hiki kinaonyesha lengo baya au kusudi la kudhuru. “Kwa nia mbaya” ni Kiswahili cha asili kinachohifadhi uzito wa kimaadili wa רַע.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; “huyapotosha” hudokeza tendo linalorudiwa au kuendelea, na “kwa nia mbaya” huepuka tungo isiyo ya asili kama “kwa uovu” bila kufuta wazo la ubaya wa kimaadili.
