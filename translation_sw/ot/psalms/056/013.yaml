base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/013.yaml
  text: For you have delivered my soul from death[a]; have you not also kept my feet from stumbling[d][c][b], that I may walk before God in the light of life?
translation:
  language: sw
  text: Kwa maana umeiokoa nafsi yangu kutoka katika mauti[a]; je, hukuilinda pia miguu yangu isianguke[b], ili nitembee mbele za Mungu katika nuru ya uzima[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uhai wangu.” Neno la Kiebrania linaweza kumaanisha nafsi, uhai, au mtu mwenyewe.
    reason: lexical_alternative
  - marker: b
    text: Au, “isijikwae.”
    reason: lexical_alternative
  - marker: c
    text: Au, “katika nuru ya walio hai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya tumaini au sifa iliyotangulia na kuhifadhi uhusiano wa kimantiki kwa Kiswahili cha kawaida.
- source_word: הִצַּלְתָּ
  choice: umeiokoa
  rationale: Kauli ya Hiphil inaonyesha kuokoa au kunusuru kutoka hatarini; hali timilifu inaeleza tendo lililotimizwa lenye matokeo ya sasa.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: Neno נֶפֶשׁ linaweza kumaanisha nafsi, uhai, au mtu mwenyewe. 'Nafsi yangu' huhifadhi taswira ya Kiebrania bila kulazimisha maana finyu ya kiantropolojia.
- source_word: מִמָּוֶת
  choice: na mauti
  rationale: Katika Kiswahili, 'kuokoa na mauti' hutoa kwa ufasaha wazo la kutolewa katika tishio au nguvu ya kifo.
- source_word: הֲלֹא
  choice: je, huku... pia
  rationale: Huhifadhi swali la balagha linalotarajia jibu la ndiyo na kuunganisha tendo la pili na la kwanza.
- source_word: רַגְלַי
  choice: miguu yangu
  rationale: Tafsiri halisi inadumisha taswira halisi inayoendelezwa na kitenzi 'nitembee'.
- source_word: מִדֶּחִי
  choice: isianguke
  rationale: דֶּחִי inaweza kuonyesha kuanguka au kujikwaa. Muundo huu ni wa kawaida kwa Kiswahili pamoja na 'miguu' na huhifadhi picha ya kutembea.
- source_word: לְהִתְהַלֵּךְ
  choice: ili nitembee
  rationale: ל pamoja na kitenzi-jina huonyesha kusudi au matokeo; 'ili nitembee' huweka kusudi wazi.
- source_word: לִפְנֵי אֱלֹהִים
  choice: mbele za Mungu
  rationale: Ni usemi wa kawaida na wenye hadhi unaohifadhi maana ya kuwa mbele au katika uwepo wa Mungu.
- source_word: בְּאוֹר הַחַיִּים
  choice: katika nuru ya uzima
  rationale: Huhifadhi taswira ya kishairi ya Kiebrania na maana ya uhai, fadhili, na ustawi bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Wigo wa kiantropolojia wa נַפְשִׁי
  choice: nafsi yangu
  alternative: uhai wangu; mimi
  rationale: Mstari haulazimishi fundisho maalumu kuhusu sehemu za mwanadamu. 'Nafsi yangu' huhifadhi usemi wa kishairi huku tanbihi ikionyesha kuwa uhai au mtu mzima anaweza kuwa katika mtazamo.
- issue: Maana ya בְּאוֹר הַחַיִּים
  choice: katika nuru ya uzima
  alternative: katika nuru ya walio hai
  rationale: Muundo wa maandishi yaliyopo unaelekea moja kwa moja kwa 'uzima,' lakini usemi unabaki wa kishairi na unaweza pia kueleweka kwa kuhusishwa na ulimwengu wa walio hai.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wenye hadhi lakini unaoeleweka kwa msomaji wa kawaida. Swali la balagha limehifadhiwa, na alama zote za tanbihi zimewekwa katika matini kuu.
