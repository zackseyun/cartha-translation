base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/006.yaml
  text: They gather together[a]; they hide themselves; they watch my steps[d][c][b], as they wait for my life.
translation:
  language: sw
  text: Wanajikusanya[a]; wanajificha; wanafuatilia nyayo zangu[b], kama wanavyongojea uhai wangu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kiebrania kinaweza pia kumaanisha kukaa kama mgeni; hapa muktadha unaonyesha kukusanyika au kuungana kwa uhasama.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana ya moja kwa moja, “visigino vyangu”; hapa maana yake ni nyayo, hatua, au mienendo yangu.
    reason: lexical_alternative
  - marker: c
    text: Au, “kama wanavyovizia uhai wangu.” Kitenzi kwa kawaida humaanisha kusubiri au kutumaini, lakini hapa kimetumiwa katika muktadha wa uhasama.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגוּרוּ
  choice: wanajikusanya pamoja
  rationale: Katika muktadha huu wa uhasama, kitenzi kinaeleza kuungana au kukusanyika dhidi ya mtu, si kukaa kama mgeni.
- source_word: יצפינו
  choice: wanajificha
  rationale: Kitenzi kina wazo la kujisitiri au kujificha, huenda kwa kusudi la kuvizia; tafsiri hii ni ya kawaida na haiongezi maelezo yasiyosemwa wazi.
- source_word: הֵמָּה
  choice: wana-
  rationale: Kiwakilishi huru cha Kiebrania kinakazia wahusika. Kiswahili kinakibeba kwa kawaida katika viambishi vya vitenzi na mfululizo wa sentensi hizi.
- source_word: עֲקֵבַי
  choice: nyayo zangu
  rationale: Maana ya moja kwa moja ni ‘visigino vyangu,’ lakini hapa ni nahau inayorejelea nyayo, hatua, au mienendo ya mtu inayofuatiliwa.
- source_word: יִשְׁמֹרוּ
  choice: wanafuatilia
  rationale: Hapa שמר haimaanishi kulinda kwa wema, bali kutazama kwa makini na kufuatilia mienendo ya mtu katika muktadha wa uhasama.
- source_word: כַּאֲשֶׁר
  choice: huku
  rationale: ‘Huku’ linaonyesha kwamba kufuatilia nyayo na kuvizia uhai vinaendelea kwa pamoja, na linatoa Kiswahili cha asili bila kulazimisha uhusiano wa kisababishi.
- source_word: קִוּוּ
  choice: wakivizia
  rationale: Maana ya msingi ni kusubiri au kutarajia, lakini katika muktadha huu wa adui wanaojificha na kufuatilia nyayo, kusubiri huko ni kwa uhasama. ‘Kuvizia’ huwasilisha hali hiyo kwa Kiswahili cha kawaida.
- source_word: נַפְשִׁי
  choice: uhai wangu
  rationale: נפש hapa inarejelea maisha au nafsi ya mtu inayotafutwa na maadui; ‘uhai wangu’ ni wazi zaidi kuliko ‘roho yangu’ katika muktadha huu.
