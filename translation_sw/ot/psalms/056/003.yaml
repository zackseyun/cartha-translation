lexical_decisions:
- source_word: י֥וֹם
  choice: ninapo-
  rationale: Ingawa neno hili kihalisi ni ‘siku’, hapa linaanzisha kishazi cha wakati. Kiambishi cha wakati ‘-po-’ katika ‘ninapoogopa’ kinatoa Kiswahili cha kawaida na kuhifadhi maana ya ‘wakati ninapo…’.
- source_word: אִירָ֑א
  choice: ogopa
  rationale: Kitenzi ירא hapa kinaeleza hofu ya mtunga zaburi, si hofu ya kumcha Mungu. ‘Ninapoogopa’ ni usemi wa asili katika Kiswahili cha sasa.
- source_word: אֲנִ֗י
  choice: wewe
  rationale: Kiwakilishi huru אֲנִי kinakazia nafsi ya kwanza. Kwa kuwa kitenzi cha Kiswahili tayari kinaonyesha nafsi hiyo, mkazo wa sentensi umeonyeshwa kwa mpangilio wa asili ‘nitakutumaini wewe’, bila kuongeza usemi mzito usio wa lazima kama ‘mimi mwenyewe’.
- source_word: אֵלֶ֥י/ךָ
  choice: -ku- … wewe
  rationale: אֶל pamoja na בטח huelekeza tumaini kwa mhusika. Kiswahili cha kawaida hutumia ‘kumtumaini mtu’; kiambishi ‘-ku-’ pamoja na ‘wewe’ kinahifadhi mlengwa na mkazo.
- source_word: אֶבְטָֽח
  choice: nitakutumaini
  rationale: Kauli isiyotimilika ya בטח hapa inaeleza azimio la mtunga zaburi anapokabiliwa na hofu. Wakati ujao ‘nita-’ unaonyesha vizuri azimio hilo.
theological_decisions:
- issue: Uhusiano kati ya hofu na tumaini
  choice: Mstari unasema kwamba mtunga zaburi anapohisi hofu, anaamua kumtumaini Mungu; hausemi kwamba hofu haipo.
  alternative: Kuutafsiri kana kwamba tumaini linaondoa kabisa uwepo wa hofu.
  rationale: Kiebrania kinaweka hofu na azimio la kutumaini pamoja. Tafsiri inadumisha mvutano huo badala ya kuugeuza kuwa dai la kutokuwa na hofu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ninapoogopa’ ni ya kawaida kuliko ‘siku ninayoogopa’, huku ‘wewe’ ya mwisho ikisaidia kuakisi mkazo wa Kiebrania bila kufanya sentensi kuwa ngumu.
