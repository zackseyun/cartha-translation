  text: Let them turn back because of their shame[a], those who say, “Aha, aha!”
translation:
  language: sw
  text: 'Warudi nyuma kwa sababu ya aibu yao,

    wale wasemao, “Aha, aha!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: Warudi nyuma
  rationale: Kitenzi cha Qal imperfect nafsi ya tatu wingi kimetumiwa kwa nguvu ya ombi au laana. “Warudi nyuma” huhifadhi maana ya hiari inayotakiwa na wazo la kurudi au kukimbizwa nyuma bila kukifanya kitenzi kuwa cha kutendwa.
- source_word: עַל עֵקֶב
  choice: kwa sababu ya
  rationale: Kirai hiki hutumika kama nahau ya sababu au matokeo. “Kwa sababu ya” ni Kiswahili cha kawaida na wazi kuliko tafsiri sisisi inayohusisha kisigino.
- source_word: בָּשְׁתָּם
  choice: aibu yao
  rationale: Neno hili limo katika uwanja wa maana wa aibu, fedheha, na kufedheheka. “Aibu yao” ni fupi, ya kawaida, na haiingizi ufafanuzi wa ziada.
- source_word: הָאֹמְרִים
  choice: hao wanaosema
  rationale: Partisipio lenye kibainishi linawatambulisha watu kwa usemi wao. “Hao wanaosema” ni la asili katika Kiswahili na huhifadhi nguvu ya maelezo ya kundi hilo.
- source_word: הֶאָח הֶאָח
  choice: Aha! Aha!
  rationale: Ni mshangao wa dhihaka au kufurahia taabu ya mwingine. “Aha! Aha!” huhifadhi sauti ya kejeli bila kuifafanua kupita kiasi.
