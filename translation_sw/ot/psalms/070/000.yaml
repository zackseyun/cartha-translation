lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongozaji wa muziki
  rationale: Neno hili katika vichwa vya Zaburi kwa kawaida humtaja kiongozi au msimamizi wa muziki. Tafsiri hii inaeleweka kwa Kiswahili cha sasa na kiambishi ל־ kimewakilishwa kwa “kwa”.
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Muundo huu mfupi unahifadhi kiasi fulani uwezekano wa uandishi, uhusiano, wakfu, au umiliki wa mkusanyo, badala ya kuamua moja kwa moja kuwa maana ni “iliyoandikwa na Daudi”.
- source_word: לְהַזְכִּיר
  choice: Kwa ajili ya ukumbusho
  rationale: Kitenzi cha Hiphil cha זכר kina wazo la kusababisha kukumbuka au kuleta katika kumbukumbu. Katika kichwa hiki, usemi wa kusudi usioainisha anayekumbuka ni wa asili na unahifadhi utata wa Kiebrania.
theological_decisions:
- issue: Kazi ya neno לְהַזְכִּיר katika kichwa cha Zaburi
  choice: 'Limetafsiriwa kwa kauli ya kusudi isiyoegemea upande fulani: “Kwa ajili ya ukumbusho”'
  alternative: Kwa ajili ya sadaka ya ukumbusho; ili kumkumbusha Mungu; ili mwabudu akumbuke
  rationale: Kiebrania hakisemi ni nani anayekumbuka wala kama hili ni agizo maalumu la ibada. Tafsiri iliyochaguliwa haifungi maana kwa ufafanuzi mmoja wa kiteolojia au wa kiibada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo mfupi na wenye hadhi unaofaa kichwa cha Zaburi. Alama ya tanbihi imewekwa baada ya kirai kinachofafanuliwa.
