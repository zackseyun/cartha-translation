source:
  edition: WLC
  text: יֵבֹ֣שׁוּ וְ/יַחְפְּרוּ֮ מְבַקְשֵׁ֪י נַ֫פְשִׁ֥/י יִסֹּ֣גוּ אָ֭חוֹר וְ/יִכָּלְמ֑וּ חֲ֝פֵצֵ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/002.yaml
  text: Let those who seek my life be put to shame and confounded[a]; let those who delight in my harm turn back and be disgraced.
translation:
  language: sw
  text: Wale wanaoutafuta uhai wangu[a] waaibike na wafedheheke; wale wanaofurahia madhara yangu warudi nyuma na waaibike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanaoitafuta nafsi yangu.” Hapa “nafsi” (נפש) ni usemi unaomaanisha uhai wa mtu au mtu mwenyewe, hasa katika muktadha wa tishio la kifo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: waaibike
  rationale: Kitenzi בוש huonyesha kupata aibu; hali ya ombi au laana katika muktadha huu imewasilishwa kwa kiambishi cha utegemezi '-ke'.
- source_word: וְיַחְפְּרוּ
  choice: na kufedheheka
  rationale: חפר hapa huonyesha kufedheheka au kutahayarika. Neno hili linadumisha msisitizo wa kitenzi cha pili bila kukiunganisha kabisa na 'waaibike'.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: wale wanaoutafuta uhai wangu
  rationale: נפש katika muktadha wa uadui ni nafsi kwa maana ya uhai au mtu mwenyewe; 'kutafuta uhai wangu' ni nahau ya Kibiblia inayoeleweka kuwa kutaka kuniua.
- source_word: יִסֹּגוּ אָחוֹר
  choice: warudi nyuma
  rationale: סוג pamoja na אָחוֹר humaanisha kurudi nyuma au ku退; 'warudi nyuma' ni usemi wa kawaida na wenye nguvu ya ombi.
- source_word: וְיִכָּלְמוּ
  choice: na kuaibishwa
  rationale: כלם huonyesha kuaibika au kutiwa aibu. 'Kuaibishwa' inadumisha kipengele cha fedheha huku ikitofautishwa kiasi na vitenzi vya mwanzo.
- source_word: חֲפֵצֵי רָעָתִי
  choice: wale wanaofurahia madhara yangu
  rationale: חפץ huonyesha kupendezwa au kufurahia, na רעה hapa ni madhara au maafa yanayompata mwombaji, si uovu wake wa kimaadili.
theological_decisions:
- issue: Nguvu ya maombi au laana katika mfululizo wa vitenzi
  choice: 'Kutumia maumbo ya utegemezi: ''waaibike ... warudi ...'''
  alternative: 'Kutafsiri kama taarifa ya wakati ujao: ''wataaibika ... watarudi'''
  rationale: Katika muktadha wa sala ya zaburi, maumbo ya Kiebrania yanaeleza ombi au tamanio kali, si unabii wa moja kwa moja. Maumbo ya utegemezi ya Kiswahili yanadumisha nguvu hiyo.
- issue: Maana ya נַפְשִׁי katika tishio la kifo
  choice: uhai wangu
  alternative: nafsi yangu
  rationale: Muktadha unaonyesha watu wanaotafuta kumwangamiza mwombaji. 'Uhai wangu' huwasilisha nahau hiyo wazi bila kuamua kwamba נפש humaanisha sehemu isiyo ya kimwili ya mtu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo sambamba wa mistari miwili na nguvu ya ombi la zaburi vimedumishwa; maneno ya aibu na fedheha yametofautishwa bila kupoteza mwingiliano wake wa maana.
