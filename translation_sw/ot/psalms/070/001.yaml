base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/001.yaml
  text: O God[a], deliver me; O Yahweh, hurry to help me.
translation:
  language: sw
  text: Ee Mungu, uniokoe; Ee Yahwe, fanya haraka kunisaidia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Ni mwito wa moja kwa moja katika sala; “Ee” huonyesha mwito huo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: לְהַצִּילֵנִי
  choice: uniokoe
  rationale: Kitenzi נצל katika Hifili humaanisha kumwokoa au kumnusuru mtu kutoka hatarini; “uniokoe” ni cha asili katika ombi la sala bila kukifunga kwa wokovu wa milele.
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetafsiriwa kama jina binafsi “Yahwe,” si kwa cheo mbadala; “Ee” huonyesha mwito wa moja kwa moja.
- source_word: לְעֶזְרָתִי
  choice: kunisaidia
  rationale: Nomino עֶזְרָה pamoja na ל inaelekeza kwenye tendo la kuja kutoa msaada; “kunisaidia” ni Kiswahili cha sasa na cha kawaida.
- source_word: חוּשָׁה
  choice: fanya haraka
  rationale: Ni ombi la amri linalosisitiza hatua ya dharura; “fanya haraka” ni wazi, la sasa, na linafaa katika sala.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יְהוָה. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuingiza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye hadhi ya kishairi. Muundo mfupi wa ombi na hisia ya uharaka vimehifadhiwa.
