  text: וַ/אֲנִ֤י עָנִ֣י וְ/אֶבְיוֹן֮ אֱלֹהִ֪ים חֽוּשָׁ֫/ה לִּ֥/י עֶזְרִ֣/י וּ/מְפַלְטִ֣/י אַ֑תָּה יְ֝הוָ֗ה אַל תְּאַחַֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/005.yaml
  text: But as for me[a], I am poor and needy; O God, hurry to me. You are my help and my deliverer; O Yahweh[b], do not delay.
translation:
  language: sw
  text: Lakini mimi ni maskini na mhitaji; Ee Mungu, unijie haraka.[a] Wewe ndiwe msaada wangu na mwokozi wangu; Ee Yahwe,[b] usikawie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “uharakishe kwangu”; pia yaweza kueleweka, “uharakishe kwa ajili yangu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: YHWH, jina la Mungu; kwa desturi pia huwasilishwa kama “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: Lakini mimi
  rationale: Kiunganishi pamoja na kiwakilishi kinaonyesha geuko la kulinganisha kutoka kwa yaliyotangulia kwenda kwenye hali ya mwombaji mwenyewe.
- source_word: עָנִי וְאֶבְיוֹן
  choice: maskini na mhitaji
  rationale: Huhifadhi jozi ya maneno yanayoeleza hali ya unyonge, uhitaji na taabu bila kuyafanya yote kuwa na maana ileile.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Nomino hii ni ya kumwita Mungu moja kwa moja katika ombi la dharura.
- source_word: חוּשָׁה לִי
  choice: unijie haraka
  rationale: Hutoa maana ya agizo la kuharakisha kuelekea kwa mwombaji kwa Kiswahili cha kawaida; kiambishi -ji- kinaonyesha mwelekeo wa kuja, huku -ni- kikimtaja mwombaji.
- source_word: עֶזְרִי
  choice: msaada wangu
  rationale: עֵזֶר ni msaada wenyewe, si lazima jina la mtendaji; tafsiri hii pia inalingana na muundo wa kihusishi wa sentensi.
- source_word: וּמְפַלְטִי
  choice: na mwokozi wangu
  rationale: Umbo la kishiriki kutoka פלט humaanisha anayemtoa mtu hatarini au kumfikisha salama; “mwokozi” ni fupi, ya heshima na ya kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linalihifadhi jina binafsi la Mungu lililoandikwa kwa herufi nne YHWH badala ya kulibadilisha kuwa cheo.
- source_word: אַל תְּאַחַר
  choice: usikawie
  rationale: Hili ni ombi hasi linalomsihi Mungu asicheleweshe hatua yake; “usikawie” ni la sasa, la kawaida na lenye dharura.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi YHWH. “Yahwe” hulihifadhi jina hilo kwa tahajia iliyozoeleka katika Kiswahili, huku tanbihi ikitaja desturi ya kulitafsiri kwa cheo “BWANA”.
- issue: Maana ya מְפַלְטִי
  choice: mwokozi wangu
  alternative: mkombozi wangu / mwokoaji wangu
  rationale: Neno hilo humwonyesha Mungu kama anayemtoa mwombaji hatarini. “Mwokozi” huhifadhi maana hiyo bila kufafanua aina maalumu ya wokovu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala. “Ee” inaonyesha mwito wa moja kwa moja, na sentensi fupi zinahifadhi dharura ya ombi.
