base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/004.yaml
  text: Let all who seek you rejoice and be glad in you[a]; let those who love your salvation say continually[b], “May God be magnified!”
translation:
  language: sw
  text: 'Wote wanaokutafuta

    wafurahi na kushangilia ndani yako;

    na wote wanaoupenda wokovu wako[a]

    waseme daima,

    “Mungu na atukuzwe!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukombozi wako.” Neno la Kiebrania linaweza kumaanisha kuokolewa kutoka katika dhiki au wokovu kwa maana pana zaidi.
    reason: lexical_alternative
  - marker: b
    text: Au “Mungu na awe mkuu!” Kauli ya Kiebrania ni tamko la kutakia au la shangwe kuhusu ukuu wa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂישׂוּ
  choice: na wafurahi
  rationale: Kitenzi hiki kinaeleza furaha kubwa. “Wafurahi” ni Kiswahili cha kawaida na chenye heshima, huku kikiendelea kutofautishwa na kitenzi kinachofuata.
- source_word: וְיִשְׂמְחוּ
  choice: na kushangilia
  rationale: Mzizi שׂמח unaonyesha kuwa na furaha. “Kushangilia” huhifadhi urudiaji wa kishairi bila kutumia neno lilelile kwa vitenzi vyote viwili.
- source_word: בְּךָ
  choice: ndani yako
  rationale: Kihusishi ב hapa kinaweza kuonyesha mahali au msingi wa furaha. “Ndani yako” huhifadhi mwelekeo wa ibada kwa Mungu bila kuibadili kuwa sababu pekee.
- source_word: כָּל מְבַקְשֶׁיךָ
  choice: wote wanaokutafuta
  rationale: Muundo wa kitenzi-jina pamoja na כָּל unaeleza kundi la watu wenye sifa ya kumtafuta Mungu; usemi huu ni wa asili na wazi katika Kiswahili.
- source_word: וְיֹאמְרוּ תָמִיד
  choice: na waseme daima
  rationale: Kitenzi cha hali isiyotimilika pamoja na תָמִיד kinaonyesha usemi unaorudiwa au unaoendelea. “Waseme daima” ni kifupi na hudumisha sauti ya kishairi.
- source_word: יִגְדַּל אֱלֹהִים
  choice: Mungu na atukuzwe
  rationale: Hali ya kitenzi hapa ni ya kutakia au kutamka kwa shangwe, si taarifa ya kawaida tu. “Mungu na atukuzwe” ni mwito wa asili wa Kiswahili unaohifadhi nguvu hiyo, ingawa neno la Kiebrania kihalisi linahusu kuwa mkuu.
- source_word: אֹהֲבֵי יְשׁוּעָתֶךָ
  choice: wote wanaoupenda wokovu wako
  rationale: יְשׁוּעָה linaweza kumaanisha kuokolewa kutoka katika dhiki au wokovu kwa maana pana. “Wokovu” huhifadhi upana huo, na “wanaoupenda” huwasilisha kwa kawaida muundo wa Kiebrania.
theological_decisions:
- issue: Maana ya יְשׁוּעָה
  choice: wokovu
  alternative: ukombozi / kuokolewa
  rationale: Neno la Kiebrania linaweza kuonyesha uokozi halisi kutoka katika taabu na pia wokovu kwa maana pana. “Wokovu” huhifadhi uwezekano huo bila kuufunga mstari kwenye aina moja ya hatari.
- issue: Nguvu ya kutakia katika יִגְדַּל אֱלֹהִים
  choice: Mungu na atukuzwe
  alternative: Mungu na awe mkuu / Mungu ni mkuu
  rationale: Kauli hii inaeleweka vizuri kama tamko la shangwe au ombi linalorudiwa. Tafsiri iliyochaguliwa huhifadhi hali hiyo; “Mungu ni mkuu” ingeifanya kuwa taarifa tu, na “Mungu na awe mkuu” ni ya karibu zaidi na umbo la Kiebrania lakini si ya asili sana katika Kiswahili cha sasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa mistari umehifadhi ulinganifu wa kishairi. Viambishi vya “na” katika “na wafurahi” na “na atukuzwe” vinatumika kwa hali ya kutakia, si kama kiunganishi pekee.
