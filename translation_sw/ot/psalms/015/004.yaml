source:
  edition: WLC
  text: נִבְזֶ֤ה בְּֽ/עֵ֘ינָ֤י/ו נִמְאָ֗ס וְ/אֶת יִרְאֵ֣י יְהוָ֣ה יְכַבֵּ֑ד נִשְׁבַּ֥ע לְ֝/הָרַ֗ע וְ/לֹ֣א יָמִֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/004.yaml
  text: In his eyes a despised person is rejected[a], but he honors those who fear Yahweh[b]; he swears to his own harm and does not change.
translation:
  language: sw
  text: Machoni pake, mtu anayedharauliwa hukataliwa[a], lakini huwaheshimu wale wanaomcha Yahweh; huapa hata kwa hasara yake mwenyewe[b], wala habadili alichoapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa tafsiri ya jadi zaidi: “Machoni pake, mtu mwovu hudharauliwa.” Kishazi cha Kiebrania kimebanwa na kinaweza kutafsiriwa kwa njia kadhaa zinazokaribiana.'
    reason: alternative_reading
  - marker: b
    text: Kwa tafsiri ya moja kwa moja, “huapa kwa madhara, wala habadili.” Kwa kawaida maneno haya hueleweka kumaanisha kwamba hushika kiapo chake hata kinapomletea hasara.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְזֶה
  choice: mtu anayedharauliwa
  rationale: Umbo hili la kivumishi-tendwa humaanisha mtu anayeonwa kwa dharau. Tafsiri hii inalinda umbo la Kiebrania bila kuamua kimya kimya kwamba neno hilo lazima limaanishe ‘mtu mwovu.’
- source_word: בְּעֵינָיו
  choice: machoni pake
  rationale: Hii ni nahau ya kawaida ya Kiebrania inayoonyesha tathmini ya mtu; ‘machoni pake’ ni ya asili katika Kiswahili na inadumisha sitiari.
- source_word: נִמְאָס
  choice: hukataliwa
  rationale: Kitenzi hiki huonyesha kukataliwa au kuonwa kuwa hakufai. ‘Hukataliwa’ huepuka kurudia neno ‘kudharauliwa’ huku kikihifadhi maana sambamba.
- source_word: יִרְאֵי יְהוָה
  choice: wale wanaomcha Yahweh
  rationale: ‘Kumcha’ hudumisha usemi wa agano unaojumuisha hofu yenye heshima na maisha ya utii, bila kuupunguza kuwa heshima pekee.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama ‘Yahweh’ badala ya kubadilishwa na cheo.
- source_word: יְכַבֵּד
  choice: huwaheshimu
  rationale: Katika muundo huu כבד humaanisha kuwapa watu heshima au kuwaona kuwa wenye uzito; ‘huwaheshimu’ ni wazi na ya kawaida.
- source_word: נִשְׁבַּע
  choice: huapa
  rationale: Wakati wa mazoea unafaa kwa maelezo ya tabia katika zaburi hii na unahifadhi maana ya kujiunga kwa kiapo.
- source_word: לְהָרַע
  choice: hata kwa hasara yake mwenyewe
  rationale: Kirai hiki ni kifupi na kinaweza kumaanisha ‘kwa madhara.’ Tafsiri iliyochaguliwa inaonyesha uelewa wa kawaida kwamba mtu hutimiza kiapo hata kinapomgharimu, huku maana ya moja kwa moja ikiwekwa katika tanbihi.
- source_word: יָמִר
  choice: habadili alichoapa
  rationale: Kitenzi humaanisha kubadili au kubadilisha. Kwa kuwa shamirisho halijaelezwa katika Kiebrania, ‘alichoapa’ kimewekwa wazi ili sentensi iwe kamili na ya asili katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano moja kwa moja; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kuliwakilisha kwa cheo.
- issue: Maana ya kishazi kifupi נִבְזֶה בְּעֵינָיו נִמְאָס
  choice: Machoni pake, mtu anayedharauliwa hukataliwa
  alternative: Machoni pake, mtu mwovu hudharauliwa
  rationale: Kiebrania kina miundo miwili yenye maana ya kutendwa na sintaksia iliyobanwa. Tafsiri kuu inadumisha hali hiyo bila kuingiza moja kwa moja hukumu ya kimaadili ya ‘mwovu’; usomaji wa jadi umetajwa katika tanbihi.
- issue: Mhusika anayepata madhara katika לְהָרַע
  choice: hasara yake mwenyewe
  alternative: kwa madhara / kufanya mabaya
  rationale: Muktadha wa sifa ya uaminifu unaunga mkono maana ya kutobadili kiapo hata kinapomgharimu mwapaji. Kwa kuwa Kiebrania hakitaji wazi ‘yake mwenyewe,’ maana ya moja kwa moja imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. Kauli za mazoea ‘hukataliwa,’ ‘huwaheshimu,’ na ‘huapa’ zinaendana na maelezo ya tabia katika zaburi. Jina ‘Yahweh’ limehifadhiwa bila kutafsiriwa kuwa cheo.
