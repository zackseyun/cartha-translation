base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/002.yaml
  text: He who walks blamelessly[a], and does what is right[b], and speaks truth in his heart.
translation:
  language: sw
  text: Ni yule anayeishi kwa unyofu[a], anayefanya yaliyo sawa[b], na anayesema kweli moyoni mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa uadilifu” au “bila kulaumika.” Neno la Kiebrania linaweza kueleza utimilifu au unyofu wa mwenendo, wala si lazima kutokuwa na kasoro au dhambi kabisa.
    reason: lexical_alternative
  - marker: b
    text: Au, “haki” au “uadilifu.” Neno la Kiebrania linaweza kumaanisha haki, uadilifu, au yaliyo sawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: anayeishi
  rationale: Kitenzi hiki, ingawa maana yake ya msingi ni ‘kwenda/kutembea,’ hapa kimetumiwa kiistiari kueleza mwenendo wa maisha. ‘Anayeishi’ ni Kiswahili cha kawaida kinachowasilisha maana hiyo kwa uwazi.
- source_word: תָּמִים
  choice: kwa uadilifu
  rationale: Neno hili hapa linaonyesha ukamilifu wa tabia, unyofu, na mwenendo usiolaumika, si kutokuwa na dhambi kabisa. ‘Kwa uadilifu’ ni ya asili katika Kiswahili na huepuka wazo la ukamilifu usio na kasoro yoyote.
- source_word: וּפֹעֵל
  choice: anayefanya
  rationale: Kitenzi kishirikishi kinaeleza kutenda au kufanya kwa mazoea. ‘Anayefanya’ hudumisha mfululizo wa sifa za mtu huyo.
- source_word: צֶדֶק
  choice: yaliyo sawa
  rationale: Neno linaweza kumaanisha haki, uadilifu, au lililo sawa. Katika orodha hii ya mwenendo, ‘anayefanya yaliyo sawa’ ni usemi wa kawaida na mpana unaobeba maana ya vitendo vya haki.
- source_word: וְדֹבֵר
  choice: anayesema
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya kusema au kunena, nayo inadumisha ulinganifu wa vitenzi katika mstari.
- source_word: אֱמֶת
  choice: kweli
  rationale: Pamoja na kwamba neno linaweza pia kuhusisha uaminifu, linapotumiwa pamoja na ‘kusema’ maana kuu hapa ni ukweli katika usemi.
- source_word: בִּלְבָבוֹ
  choice: moyoni mwake
  rationale: Tafsiri hii huhifadhi taswira ya Kiebrania ya moyo kama utu wa ndani na inaweza kuonyesha ukweli wa ndani, si maneno ya nje tu.
theological_decisions:
- issue: Uadilifu wa mwenendo dhidi ya ukamilifu usio na dhambi
  choice: kwa uadilifu
  alternative: kwa ukamilifu
  rationale: Mstari unaeleza unyofu na ukamilifu wa mwenendo wa mtu, bila kulazimisha dai la kwamba mtu huyo hana dhambi kabisa.
- issue: Umoja wa uwakilishi na jinsia
  choice: Ni mtu anayeishi ... moyoni mwake
  alternative: Yeye aendaye ... moyoni mwake
  rationale: Kiebrania kina maumbo ya kiume katika umoja yanayotumika kwa uwakilishi. Kiswahili hakilazimishi jinsia katika muundo huu; ‘mtu’ na ‘-ake’ huhifadhi umoja bila kuongeza jinsia ambayo sarufi ya Kiswahili haihitaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kishirikishi umerudiwa ili kuhifadhi ulinganifu wa kishairi. ‘Anayeishi’ limetumiwa badala ya tafsiri halisi ‘anayetembea’ kwa sababu Kiebrania hapa hueleza mwenendo wa maisha, na tafsiri halisi isingekuwa ya kawaida katika Kiswahili.
