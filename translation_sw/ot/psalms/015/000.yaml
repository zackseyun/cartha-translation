lexical_decisions:
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Neno la kawaida na lenye hadhi katika Kiswahili kwa wimbo wa ibada unaoambatana na muziki.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina binafsi la Mungu katika Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: יָגוּר
  choice: anayeweza kukaa
  rationale: Katika swali hili kitenzi kinaonyesha kuruhusiwa kukaa au kuwa mgeni mbele za Mungu, si uwezo wa kimwili tu.
- source_word: בְּאָהֳלֶךָ
  choice: katika hema lako
  rationale: Tafsiri ya moja kwa moja inayodumisha taswira ya mahali patakatifu kama makao ya Mungu.
- source_word: יִשְׁכֹּן
  choice: anayeweza kuishi
  rationale: Hutofautisha kwa kiasi kitenzi hiki cha kukaa kwa uthabiti na יָגוּר, huku sambamba ya kishairi ikibaki ya asili.
- source_word: בְּהַר קָדְשֶׁךָ
  choice: katika mlima wako mtakatifu
  rationale: Huhifadhi taswira ya Kiebrania ya mlima mtakatifu wa Mungu.
theological_decisions:
- issue: Uhusiano unaoonyeshwa na לְדָוִד katika kichwa
  choice: ya Daudi
  alternative: na Daudi; kwa ajili ya Daudi
  rationale: Muundo wa Kiebrania unaweza kuonyesha uandishi, uhusiano, au wakfu; tafsiri kuu ya kawaida imewekwa bila kudai kwamba ndiyo maana pekee.
- issue: Maana ya kukaa mbele za Mungu
  choice: anayeweza kukaa / anayeweza kuishi
  alternative: atakayekaa / atakayeishi
  rationale: Maswali yanauliza ni nani anayekubalika kukaa katika uwepo mtakatifu wa Mungu; matumizi ya 'anaweza' yanaonyesha ruhusa huku masharti yakifafanuliwa katika mistari inayofuata.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mistari sambamba na maswali mawili ya kishairi yamedumishwa; 'hema' limewekwa katika matini kwa sababu ndilo neno la moja kwa moja na linaeleweka kwa urahisi.
