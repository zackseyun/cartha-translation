  text: He does not slander with his tongue[a], does not do evil to his neighbor[c][b], and does not bear reproach against his close one.
translation:
  language: sw
  text: 'Hasengenyi kwa ulimi wake,[a]

    wala hamtendei jirani yake mabaya,[b]

    wala hatoi shutuma dhidi ya mtu wake wa karibu.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Haendi huku na huko akieneza maneno ya kashfa kwa ulimi wake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wala hamfanyii rafiki au mwenzake uovu.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “aliye karibu naye”; huenda ikamaanisha ndugu, mshirika wa karibu, au mtu mwingine aliye karibu naye katika jamii.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָגַל עַל לְשׁוֹנוֹ
  choice: kusengenya kwa ulimi wake
  rationale: Katika nahau hii, kitenzi kinahusu kueneza maneno yanayomchafua mwingine. “Kusengenya” ni Kiswahili cha sasa kinachoeleweka, huku “kwa ulimi wake” kikihifadhi taswira na chombo cha usemi.
- source_word: עָשָׂה ... רָעָה
  choice: kumtendea ... mabaya
  rationale: Usemi huu unahifadhi maana pana ya kufanya uovu au jambo baya dhidi ya mwingine bila kuibana kuwa madhara ya kimwili tu.
- source_word: לְרֵעֵהוּ
  choice: jirani yake
  rationale: רֵעַ inaweza kumaanisha rafiki, mwenzake, au jirani. “Jirani” inafaa katika muktadha huu mpana wa wajibu kwa mtu mwingine katika jamii.
- source_word: חֶרְפָּה
  choice: kuvunjiwa heshima
  rationale: Neno hili linaweza kuonyesha shutuma, fedheha, au aibu ya kijamii. “Kumvunjia heshima” huwasilisha kwa Kiswahili cha kawaida tendo la kumletea mwingine fedheha kwa maneno.
- source_word: נָשָׂא ... עַל
  choice: kumvunjia heshima
  rationale: Nahau ya Kiebrania, kihalisi kuinua au kubeba shutuma dhidi ya mtu, inaelekea kumaanisha kuichukua na kuitumia kumwaibisha. Tafsiri hii ni ya kinahau na ya asili katika Kiswahili.
- source_word: קְרֹבוֹ
  choice: mtu wake wa karibu
  rationale: Neno linamaanisha aliye karibu na mtu, na linaweza kuwa ndugu, mshirika wa karibu, au mtu aliye karibu naye. Chaguo hili halifungii maana kwenye undugu wa damu.
