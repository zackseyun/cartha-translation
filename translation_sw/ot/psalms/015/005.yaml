  text: כַּסְפּ֤/וֹ לֹא נָתַ֣ן בְּ/נֶשֶׁךְ֮ וְ/שֹׁ֥חַד עַל נָקִ֗י לֹ֥א לָ֫קָ֥ח עֹֽשֵׂה אֵ֑לֶּה לֹ֖א יִמּ֣וֹט לְ/עוֹלָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/005.yaml
  text: He does not lend his money at interest[a], and does not take a bribe against the innocent[b]. The one who does these things will never be shaken.
translation:
  language: sw
  text: Hakopeshi fedha yake kwa riba, wala hapokei rushwa ya kumdhuru asiye na hatia. Anayefanya mambo haya hatatikisika kamwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּסְפּוֹ
  choice: fedha yake
  rationale: כֶּסֶף inaweza kumaanisha fedha ya metali au pesa; katika muktadha wa kukopesha kwa riba, “fedha” ni ya kawaida na wazi katika Kiswahili.
- source_word: נָתַן בְּנֶשֶׁךְ
  choice: hatoi ... kwa riba
  rationale: Kirai cha Kiebrania kwa maana halisi ni kutoa fedha kwa riba. “Hatoi fedha yake kwa riba” huhifadhi muundo huo na kueleweka kwa kawaida kuwa hakopeshi kwa riba.
- source_word: שֹׁחַד
  choice: rushwa
  rationale: “Rushwa” ni neno la kawaida la kisheria na kimaadili kwa malipo yanayotolewa ili kupotosha haki.
- source_word: עַל נָקִי
  choice: ili kumdhuru asiye na hatia
  rationale: עַל baada ya kupokea rushwa inaonyesha tendo linaloelekezwa dhidi ya mtu asiye na hatia; usemi huu huweka wazi maana bila kuondoa mazingira ya hukumu.
- source_word: עֹשֵׂה אֵלֶּה
  choice: Anayefanya mambo haya
  rationale: Kauli ya kushiriki ya Kiebrania inamtaja mtu mwenye sifa hii; tafsiri hii ni ya asili, ya umoja, na jumuishi katika Kiswahili.
- source_word: לֹא יִמּוֹט לְעוֹלָם
  choice: hatatikisika kamwe
  rationale: מוֹט huonyesha kuyumba au kutikiswa, na לְעוֹלָם pamoja na ukanushi hutoa maana ya “kamwe”; tafsiri inadumisha sitiari ya uthabiti.
theological_decisions:
- issue: Upeo wa kimaadili wa kutoza riba
  choice: Kutafsiri נֶשֶׁךְ kuwa “riba” bila kuibana iwe riba ya kupindukia tu.
  alternative: Faida haramu au riba ya unyonyaji.
  rationale: Neno la Kiebrania linaweza kutaja riba inayotozwa kwa mkopo. “Riba” huhifadhi upeo mpana wa neno bila kuingiza nadharia maalumu ya baadaye kuhusu uchumi.
- issue: Ahadi ya kutotikiswa
  choice: 'Kudumisha sitiari ya uthabiti: “hatatikisika kamwe.”'
  alternative: Hataondolewa milele.
  rationale: Kauli ya Kiebrania inaweza kueleweka kama kutoyumba, kutosogezwa, au kutikiswa. Tafsiri iliyochaguliwa ni ya asili na haibainishi zaidi ya sitiari yenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mistari mifupi na msamiati wa kawaida umetumiwa; sitiari ya mwisho imehifadhiwa. Alama ya tanbihi [a] ipo katika matini kuu.
