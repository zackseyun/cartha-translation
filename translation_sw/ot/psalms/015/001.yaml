  yaml_path: translation/ot/psalms/015/001.yaml
  text: A psalm of David[a]. O Yahweh[b], who may sojourn in your tent? Who may dwell on your holy mountain?
translation:
  language: sw
  text: 'Zaburi ya Daudi[a].


    Ee Yahweh, ni nani awezaye kukaa kama mgeni katika hema lako[b]?


    Ni nani awezaye kukaa juu ya mlima wako mtakatifu?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “iliyoandikwa na Daudi” au “kwa ajili ya Daudi”; kichwa cha Kiebrania “ya Daudi” kinaweza kuonyesha uandishi, uhusiano, au wakfu.
    reason: alternative_reading
  - marker: b
    text: Au “maskani yako”; neno la Kiebrania kihalisi ni “hema,” na huenda linadokeza mahali patakatifu kama makao ya Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Ni istilahi ya kawaida na iliyoeleweka katika Kiswahili kwa utungo wa aina hii wa ibada.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Muundo huu wa Kiswahili unahifadhi kwa kiasi kikubwa uwezekano wa uandishi, uhusiano, au wakfu bila kuamua moja tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo; tahajia “Yahwe” ni ya kawaida katika Kiswahili.
- source_word: יָגוּר
  choice: anayeweza kukaa kama mgeni
  rationale: Kitenzi kina wazo la kukaa kwa muda kama mgeni; tafsiri hii inalihifadhi kwa lugha ya asili na inayoeleweka.
- source_word: בְּאָהֳלֶךָ
  choice: katika hema lako
  rationale: “Hema” ndiyo maana halisi ya אֹהֶל na inadumisha picha ya mahali pa Mungu bila kuilazimisha kuwa istilahi maalumu ya kidini.
- source_word: יִשְׁכֹּן
  choice: anayeweza kukaa
  rationale: Kitenzi kinamaanisha kukaa au kufanya makao; “kukaa” ni cha kawaida na kinafaa katika ulinganifu wa kishairi.
- source_word: בְּהַר קָדְשֶׁךָ
  choice: kwenye mlima wako mtakatifu
  rationale: Ni Kiswahili cha kawaida kinachowasilisha mahali palipo juu ya mlima uliowekwa wakfu kwa Mungu.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Ee Yahwe
  alternative: Ee Yehova
  rationale: Maandishi yana jina binafsi la Mungu; “Yahwe” hulihifadhi badala ya kulibadilisha na cheo.
- issue: Uhusiano unaoonyeshwa na לְ katika לְדָוִד
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi; kwa ajili ya Daudi
  rationale: Kihusishi cha Kiebrania kinaweza kuonyesha uandishi, uhusiano, au wakfu; “ya Daudi” hakifungi maana kwa uwezekano mmoja.
- issue: Picha ya kukaa mbele za Mungu
  choice: kukaa kama mgeni katika hema lako
  alternative: kukaa katika maskani yako
  rationale: Tafsiri hii inadumisha picha halisi ya hema na hali ya mgeni, bila kuamua zaidi ya inavyosema Kiebrania kuhusu ufikiaji wa patakatifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Kukaa kama mgeni” huhifadhi tofauti ya kimaana na kitenzi cha pili, ingawa vyote vimetafsiriwa kwa msingi wa “kukaa.”
