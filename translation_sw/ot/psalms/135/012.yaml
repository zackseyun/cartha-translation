lexical_decisions:
- source_word: וְנָתַן
  choice: Naye akaitoa
  rationale: Kitenzi cha Kiebrania kinaendeleza mfuatano wa sifa kwa maana ya wakati uliopita. Kiambishi cha yambwa katika “akaitoa” kinarejelea “nchi,” huku “Naye” kikidumisha kiunganishi na mtendaji anayeeleweka kutokana na muktadha.
- source_word: אַרְצָם
  choice: nchi yao
  rationale: אֶרֶץ hapa ni nchi ya mataifa na wafalme waliotajwa katika muktadha uliotangulia; “nchi yao” ni tafsiri ya kawaida na fupi.
- source_word: נַחֲלָה
  choice: iwe urithi
  rationale: 'Nomino ya kwanza inafanya kazi kama kinachotokana na tendo la kutoa: aliitoa nchi yao iwe urithi. “Urithi” huhifadhi dhana ya mali iliyogawiwa na kupokelewa.'
- source_word: נַחֲלָה
  choice: urithi
  rationale: Nomino imerudiwa kwa kusisitiza katika Kiebrania; kurudia “urithi” kunahifadhi uzito wa kishairi wa mstari.
- source_word: לְיִשְׂרָאֵל
  choice: kwa Israeli
  rationale: Kihusishi לְ kinamtaja mpokeaji au mnufaika. “Kwa Israeli” ni Kiswahili cha kawaida katika muundo huu.
- source_word: עַמּוֹ
  choice: watu wake
  rationale: עַם humaanisha jamii au watu, na hapa inaeleza uhusiano wa Israeli na Mungu; “watu wake” ni ya asili na sahihi.
theological_decisions:
- issue: Kurudiwa kwa נַחֲלָה katika ushairi
  choice: 'Kurudia “urithi” katika andiko kuu: “iwe urithi, urithi”'
  alternative: Kutaja “urithi” mara moja ili sentensi iwe laini zaidi
  rationale: Kiebrania kinarudia nomino hiyo kwa kusisitiza. Kurudia kunahifadhi msisitizo wa chanzo bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Naye akaitoa” unaendeleza simulizi la sifa kwa ufasaha, na urudiaji wa “urithi” umehifadhiwa kwa sababu ni kipengele cha makusudi cha ushairi wa Kiebrania.
