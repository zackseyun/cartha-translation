  text: They have mouths[a], but do not speak; they have eyes, but do not see.
translation:
  language: sw
  text: Wana vinywa,[a] lakini hawasemi; wana macho, lakini hawaoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kihalisi: “Kinywa kipo kwao ... macho yapo kwao,” muundo wa kuonyesha umilikaji wenye maana ya “Wana kinywa/vinywa ... macho.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּה
  choice: vinywa
  rationale: Ingawa nomino ya Kiebrania iko katika umoja, inatumika kwa maana ya kugawanya kwa sanamu nyingi; Kiswahili cha kawaida hutumia wingi “vinywa” katika muundo huu.
- source_word: לָהֶם
  choice: wana
  rationale: Muundo wa Kiebrania una maana halisi ya “kwao/kwao wao,” lakini hapa unaonyesha umilikaji; “wana” ni Kiswahili cha asili na sahihi.
- source_word: יְדַבֵּרוּ
  choice: hawasemi
  rationale: Kitenzi kinamaanisha “kusema/kunena,” na Kiebrania kina ukanushi wa moja kwa moja, si tamko la wazi la kutoweza.
- source_word: עֵינַיִם
  choice: macho
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya nomino hiyo ya wingi.
- source_word: יִרְאוּ
  choice: hawaoni
  rationale: Kitenzi cha Kiebrania kwa kawaida humaanisha “kuona”; ukanushi rahisi umehifadhiwa bila kuongezwa maana ya “hawawezi kuona.”
theological_decisions:
- issue: Maelezo ya sanamu kwa viungo vya kibinadamu
  choice: Kuhifadhi taswira halisi ya vinywa na macho visivyofanya kazi, bila kuongeza maelezo ya kitheolojia.
  alternative: Wana vinywa, lakini hawawezi kusema; wana macho, lakini hawawezi kuona.
  rationale: Mstari unazidhihaki sanamu kwa kutaja viungo ambavyo havifanyi kazi. Tafsiri inadumisha ukanushi rahisi wa Kiebrania na haiongezi wazi dhana ya kutoweza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hawasemi” na “hawaoni” huhifadhi ukanushi wa moja kwa moja wa Kiebrania; alama ya tanbihi [a] imewekwa baada ya “vinywa.”
