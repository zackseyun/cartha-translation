  yaml_path: translation/ot/psalms/135/009.yaml
  text: He sent signs and wonders into your midst[a], O Egypt[b], against Pharaoh and against all his servants.
translation:
  language: sw
  text: Alituma ishara na maajabu katikati yako, ee Misri,[a] dhidi ya Farao na dhidi ya watumishi wake wote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndani yako, Misri.” Kiebrania huiambia Misri moja kwa moja kwa kiambishi cha umoja wa kike, na hivyo kulifanya taifa kana kwamba ni mtu.
    reason: lexical_alternative
  - marker: b
    text: Au “juu ya Farao na juu ya watumishi wake wote.” Kihusishi cha Kiebrania kinaweza kutafsiriwa kihalisi zaidi kuwa “juu ya,” lakini hapa yaelekea kinaonyesha kwamba ishara na maajabu hayo yaliwalenga kwa madhara.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: Alituma
  rationale: Kitenzi cha Qal timilifu, nafsi ya tatu umoja wa kiume; kutokana na muktadha, Mungu ndiye mtendaji anayeeleweka.
- source_word: אֹתוֹת
  choice: ishara
  rationale: Neno hili humaanisha alama au matendo yenye maana ya kiishara; “ishara” ni la kawaida na linafaa katika muktadha wa mapigo ya Misri.
- source_word: מֹפְתִים
  choice: maajabu
  rationale: Hutokea mara nyingi pamoja na אֹתוֹת; “maajabu” huhifadhi jozi ya “ishara na maajabu” bila kuifanya iwe na maana finyu ya miujiza pekee.
- source_word: בְּתוֹכֵכִי
  choice: katikati yako
  rationale: Muundo una ב pamoja na תוך na kiambishi cha nafsi ya pili, umoja wa kike. Unaihusisha Misri moja kwa moja kama taifa lililofanywa kana kwamba ni mtu.
- source_word: מִצְרָיִם
  choice: ee Misri
  rationale: Misri inaambiwa moja kwa moja baada ya kiambishi cha nafsi ya pili, umoja wa kike; “ee” huonyesha wazi mwito huo katika Kiswahili.
- source_word: בְּפַרְעֹה
  choice: dhidi ya Farao
  rationale: Katika muktadha huu, kihusishi ב kinaonyesha mlengwa wa athari zenye uhasama; “dhidi ya” ni Kiswahili cha kawaida.
- source_word: וּבְכָל עֲבָדָיו
  choice: na watumishi wake wote
  rationale: עבדים linaweza kumaanisha watumishi, watumwa, au maofisa. “Watumishi” ni pana na linafaa kwa watu wa nyumba au utawala wa kifalme bila kulifanya kundi hilo kuwa finyu kupita kiasi.
