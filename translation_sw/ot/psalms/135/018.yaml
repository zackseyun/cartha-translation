  yaml_path: translation/ot/psalms/135/018.yaml
  text: Those who make them will become like them[a], everyone who trusts in them.
translation:
  language: sw
  text: Wanaozitengeneza watakuwa kama hizo[a], vivyo hivyo kila anayezitumainia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watakuja kuwa kama hizo.” Kitenzi cha Kiebrania kinaweza kutafsiriwa “watakuwa” au “watakuja kuwa”; usemi wa pili unakazia matokeo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹ/הֶם
  choice: kama hizo
  rationale: Kihusishi cha kulinganisha pamoja na kiambishi cha nafsi ya tatu wingi hurejelea sanamu zilizotajwa; “kama hizo” ni Kiswahili cha kawaida na huhifadhi ulinganisho bila kuufafanua kupita maandishi.
- source_word: יִהְי֣וּ
  choice: watakuwa
  rationale: Kitenzi היה kinaweza kumaanisha “kuwa” au “kuja kuwa.” “Watakuwa” huhifadhi uwezekano huo wa maana kwa Kiswahili cha kawaida; tanbihi inaonyesha maana mbadala yenye mkazo wa matokeo.
- source_word: עֹשֵׂי/הֶם
  choice: wanaozitengeneza
  rationale: Kivumishi-tendaji cha עשה pamoja na kiambishi hueleza watu wanaozifanya sanamu; “wanaozitengeneza” ni wazi, cha sasa, na huhifadhi maana ya utendaji.
- source_word: כֹּל אֲשֶׁר
  choice: kila mtu anaye-
  rationale: Muundo huu una maana ya “wote ambao” au “kila mtu ambaye”; umoja wa kijumla ni wa kawaida katika Kiswahili na huhifadhi upeo wa wote.
- source_word: בֹּטֵחַ
  choice: anayezitumainia
  rationale: בטח humaanisha kutumaini au kutegemea. “Kutumainia” linaonyesha wazi kuweka tumaini kwa sanamu katika muktadha huu.
- source_word: בָּ/הֶם
  choice: -zi-
  rationale: Kiambishi cha yambwa “-zi-” hurejelea sanamu na kuwasilisha kwa Kiswahili sanifu kitu kinachowekewa tumaini.
theological_decisions:
- issue: Maana ya watu kuwa kama sanamu
  choice: Aya inasema kuwa wanaozitengeneza na wanaozitumainia watakuwa kama sanamu, bila kubainisha hasa namna ya kufanana huko.
  alternative: Watafanywa kuwa wasio na ufahamu wa kiroho au wasio na nguvu kama sanamu.
  rationale: Kiebrania kinathibitisha kufanana lakini hakielezi kwa undani hali au utaratibu wake; tafsiri haiongezi ufafanuzi wa kiteolojia usiotajwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Hizo” na viambishi vya ngeli ya I-ZI vinarejelea sanamu zilizotajwa katika muktadha. Mpangilio wa kishazi cha pili umehifadhiwa kama upanuzi unaojumuisha kila anayezitumainia.
