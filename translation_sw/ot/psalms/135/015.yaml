lexical_decisions:
- source_word: עֲצַבֵּי
  choice: Sanamu
  rationale: Katika muktadha huu wa kupinga ibada ya uongo, neno hili humaanisha sanamu zinazoabudiwa, si picha zisizo na maana ya kidini.
- source_word: הַגּוֹיִם
  choice: za mataifa
  rationale: Hapa גּוֹיִם inarejelea mataifa au makundi ya watu; “mataifa” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: כֶּסֶף וְזָהָב
  choice: fedha na dhahabu
  rationale: Haya ni majina ya moja kwa moja ya vitu vilivyotumiwa kutengeneza sanamu.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: zilizotengenezwa kwa mikono ya binadamu
  rationale: Kauli hii ya asili katika Kiswahili inaonyesha wazi kwamba sanamu hizo ni zao la kazi ya binadamu, huku tanbihi ikihifadhi muundo halisi zaidi wa Kiebrania.
theological_decisions:
- issue: Maana ya jumla ya אָדָם
  choice: binadamu
  alternative: mwanadamu
  rationale: אָדָם hapa haimaanishi mwanaume mmoja bali wanadamu kwa ujumla. “Binadamu” huhifadhi maana hiyo na kusisitiza tofauti kati ya sanamu zilizofanywa na watu na Mungu aliye hai.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa kishairi umehifadhiwa kwa sentensi fupi yenye vipashio viwili.
