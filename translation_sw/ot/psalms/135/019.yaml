  yaml_path: translation/ot/psalms/135/019.yaml
  text: House of Israel[a], bless Yahweh; house of Aaron, bless Yahweh.
translation:
  language: sw
  text: Enyi nyumba ya Israeli, mbarikini Yahwe[a]; enyi nyumba ya Haruni, mbarikini Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH.” Jina hili kwa desturi hutafsiriwa “BWANA”; hapa limenakiliwa kama “Yahwe.”'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּית יִשְׂרָאֵל
  choice: nyumba ya Israeli
  rationale: Muundo wa Kiebrania umetafsiriwa kwa ukaribu ili kuhifadhi jina la kijumuiya la watu wa agano na ulinganifu wa kishairi na “nyumba ya Haruni.” Neno “Enyi” limeongezwa ili wito uwe wa kawaida na wazi katika Kiswahili.
- source_word: בָּרֲכוּ
  choice: mbarikini
  rationale: Ni amri ya wingi kutoka ברך. “Mbarikini” huhifadhi maana ya msingi ya kumbariki Mungu katika muktadha wa ibada; “msifuni” ingeifanya maana kuwa finyu zaidi.
- source_word: אֶת יְהוָה
  choice: Yahwe
  rationale: אֶת ni alama ya yambwa, nayo יְהוָה ni jina la Mungu YHWH. Jina limetoholewa “Yahwe” badala ya kubadilishwa kuwa cheo “BWANA.”
- source_word: בֵּית אַהֲרֹן
  choice: nyumba ya Haruni
  rationale: Tafsiri hii inahifadhi muundo unaolingana na “nyumba ya Israeli” na kurejelea ukoo wa kikuhani wa Haruni bila kuongeza ufafanuzi usiotajwa wazi katika Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia Tetragramatoni יְהוָה. “Yahwe” hulihifadhi kama jina la Mungu badala ya kulibadilisha kuwa cheo, huku tanbihi ikitaja desturi nyingine ya tafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kishairi lakini kinachoeleweka kwa urahisi. Marudio na ulinganifu wa mistari ya Kiebrania yamehifadhiwa.
