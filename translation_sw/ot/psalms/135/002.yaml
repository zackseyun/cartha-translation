  text: שֶׁ֣֭/עֹֽמְדִים בְּ/בֵ֣ית יְהוָ֑ה בְּ֝/חַצְר֗וֹת בֵּ֣ית אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/002.yaml
  text: who stand in the house of Yahweh[b][a], in the courts of the house of our God.
translation:
  language: sw
  text: ninyi mnaosimama katika nyumba ya Yahweh[a], katika nyua[b] za nyumba ya Mungu wetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nyumba ya Yahweh” hapa ni hekalu pamoja na maeneo yake.
    reason: cultural_note
  - marker: b
    text: Au “viwanja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁעֹמְדִים
  choice: ninyi mnaosimama
  rationale: Kiambishi cha uhusiano pamoja na participio kinaendeleza mwito wa mstari uliotangulia. “Mnaosimama” ni Kiswahili cha kawaida kinachohifadhi hali ya kuendelea au jukumu la kudumu.
- source_word: בְּבֵית ... בֵּית
  choice: katika nyumba ya ... nyumba ya
  rationale: בַּיִת maana yake ya msingi ni “nyumba,” na hapa inaonyesha hekalu pamoja na maeneo yake. Kurudia “nyumba” kunahifadhi usambamba wa Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetolewa kama jina binafsi “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: בְּחַצְרוֹת
  choice: katika nyua
  rationale: Wingi wa חָצֵר hapa unamaanisha nyua za eneo la hekalu; “nyua” ni neno la kawaida na sahihi katika muktadha huu.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Tafsiri hii inahifadhi wazi kiambishi cha nafsi ya kwanza wingi na utambulisho wa pamoja unaopatikana katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יְהוָה. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo unaendeleza moja kwa moja mwito wa mstari uliotangulia.
