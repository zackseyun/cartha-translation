  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁ/הִכָּה
  choice: aliyepiga
  rationale: Kiambishi cha uhusiano שֶׁ kinaendeleza maelezo ya YHWH kutoka mstari uliotangulia; ‘aliyepiga’ huhifadhi utegemezi huo na maana ya msingi ya נכה bila kuongeza wazi wazo la kuangamiza.
- source_word: גּוֹיִם רַבִּים
  choice: mataifa mengi
  rationale: ‘Mataifa’ ni tafsiri ya kawaida ya גּוֹיִם katika muktadha huu wa kihistoria na kijeshi, na רַבִּים hueleza wingi wake moja kwa moja.
- source_word: וְהָרַג
  choice: na kuwaua
  rationale: הרַג humaanisha kuua; kiambishi ‘-wa-’ kinawarejelea wafalme na kufanya Kiswahili kiwe cha kawaida na wazi.
- source_word: מְלָכִים עֲצוּמִים
  choice: wafalme wenye nguvu
  rationale: ‘Wafalme’ hutafsiri מְלָכִים moja kwa moja, na ‘wenye nguvu’ huwasilisha maana ya uwezo au ukuu wa nguvu katika עֲצוּמִים kwa Kiswahili cha sasa.
theological_decisions:
- issue: Mwendelezo wa kishazi tegemezi kutoka mstari uliotangulia
  choice: Kuanza kwa ‘aliyepiga,’ kama kishazi cha uhusiano kinachoendelea kumweleza YHWH.
  alternative: ‘Aliyapiga mataifa mengi’ kama sentensi mpya yenye kiima kinachodhaniwa, au ‘Aliyashinda mataifa mengi.’
  rationale: שֶׁ iliyoambishwa kwa הִכָּה inaonyesha uhusiano wa kisintaksia na mtangulizi katika mstari wa 9. Tafsiri haipaswi kukata muundo huo wala kubadili ‘kupiga’ kuwa ‘kushinda,’ ingawa ushindi unadokezwa na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa mistari umehifadhi usambamba wa vitendo viwili vya Kiebrania. Koma ya mwisho inaonyesha kwamba wazo linaendelea katika mstari unaofuata.
