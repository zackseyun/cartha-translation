  text: יְ֭הוָה שִׁמְ/ךָ֣ לְ/עוֹלָ֑ם יְ֝הוָ֗ה זִכְרְ/ךָ֥ לְ/דֹר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/013.yaml
  text: Yahweh, your name endures forever; Yahweh, your renown[a] endures from generation to generation.
translation:
  language: sw
  text: 'Yahwe, jina lako linadumu milele;

    Yahwe, kumbukumbu yako[a] inadumu kizazi baada ya kizazi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sifa yako” au “ukumbusho wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa konsonanti nne limetafsiriwa kama jina binafsi “Yahwe,” badala ya cheo kama “BWANA.”
- source_word: שִׁמְךָ
  choice: jina lako
  rationale: Tafsiri hii inadumisha maana pana ya neno la Kiebrania, inayoweza kuhusisha jina lenyewe na sifa inayohusishwa nalo.
- source_word: לְעוֹלָם
  choice: linadumu milele
  rationale: Ingawa kishazi cha Kiebrania hakina kitenzi kilichoandikwa, wazo la kuendelea kwa wakati linaelezwa kwa Kiswahili cha kawaida kwa “linadumu milele.”
- source_word: זִכְרְךָ
  choice: kumbukumbu yako
  rationale: Neno hili linaweza kumaanisha kukumbukwa, kumbukumbu, ukumbusho, au sifa inayodumu. “Kumbukumbu yako” huhifadhi uhusiano wake na kukumbukwa bila kufunga maana katika umaarufu pekee.
- source_word: לְדֹר וָדֹר
  choice: kizazi baada ya kizazi
  rationale: Hii ni nahau ya asili ya Kiswahili inayoonyesha mwendelezo katika vizazi vyote na kuhifadhi urudiaji wa kishairi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya זִכְרְךָ
  choice: kumbukumbu yako
  alternative: sifa yako; ukumbusho wako
  rationale: Muktadha unaunganisha neno hili na “jina lako” na kudumu katika vizazi. “Kumbukumbu yako” huhifadhi uwezekano wa kumaanisha kukumbukwa kwa Yahwe, ukumbusho wake, au sifa yake inayojulikana, bila kutatua kimya kimya upana huo wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mistari miwili sambamba na urudiaji wa “Yahwe” imehifadhiwa; vitenzi “linadumu/inadumu” vimeongezwa kwa ufasaha kwa sababu vishazi vya Kiebrania havina vitenzi vilivyoandikwa.
