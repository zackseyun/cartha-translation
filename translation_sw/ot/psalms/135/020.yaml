base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/020.yaml
  text: House of Levi[a], bless Yahweh; you who fear Yahweh[b], bless Yahweh.
translation:
  language: sw
  text: 'Enyi nyumba ya Lawi[a], mbarikini Yahwe;

    enyi mnaomcha Yahwe[b], mbarikini Yahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “nyumba ya Lawi,” yaani jina la pamoja la ukoo au jumuiya ya Walawi.'
    reason: cultural_note
  - marker: b
    text: 'Au: “wale wanaomcha Yahwe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית הַלֵּוִי
  choice: nyumba ya Lawi
  rationale: Muundo huu wa Kiebrania unamaanisha kihalisi ‘nyumba ya Lawi’ na hapa unalitaja kwa pamoja ukoo au jumuiya ya Walawi. Usemi huu pia unahifadhi ulinganifu wa kiliturujia na ‘nyumba ya Israeli’ na ‘nyumba ya Haruni’ katika mistari inayozunguka.
- source_word: בָּרֲכוּ
  choice: mbarikini
  rationale: Kitenzi ברך katika kauli ya kuamuru kina maana ya ‘barikini.’ Ingawa katika ibada kinaweza kukaribia maana ya ‘sifuni,’ ‘mbarikini’ ndilo chaguo la moja kwa moja na linahifadhi mwito unaorudiwa katika zaburi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa namna ya kawaida ya Kiswahili ‘Yahwe,’ badala ya kubadilishwa na cheo ‘Bwana,’ ili kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: יִרְאֵי יְהוָה
  choice: enyi mnaomcha Yahwe
  rationale: Kirai cha kishiriki kinataja kundi la watu wenye sifa ya kumcha Yahwe. Muundo wa moja kwa moja ‘enyi mnaomcha’ unaendana kwa kawaida na amri ya wingi inayofuata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Bwana; Yehova
  rationale: Matini inatumia moja kwa moja jina יהוה. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo, huku ikitumia umbo linaloeleweka katika Kiswahili.
- issue: Maana ya ‘kumcha Yahwe’
  choice: enyi mnaomcha Yahwe
  alternative: wale wanaomcha Yahwe
  rationale: ‘Kumcha’ kumeachwa bila kufafanuliwa kuwa hofu tu au uchaji tu, hivyo kudumisha upana na mvutano wa maana ya ירא katika uhusiano na Mungu. Muundo wa ‘enyi’ unaonyesha kwamba kundi hilo linaambiwa moja kwa moja.
translation_notes:
  register: Lugha ni ya sasa, yenye heshima na mdundo wa mwito wa ibada. ‘Enyi’ imetumiwa kuonyesha usemi wa moja kwa moja kwa makundi mawili, na marudio ya ‘mbarikini Yahwe’ yamehifadhiwa.
