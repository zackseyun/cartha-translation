base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/021.yaml
  text: Blessed be Yahweh from Zion[a], who dwells in Jerusalem. Hallelujah!
translation:
  language: sw
  text: Yahwe kutoka Sayuni na abarikiwe, akaaye Yerusalemu. Haleluya![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa Kiebrania: “Msifuni Yah!” “Yah” ni umbo fupi la jina Yahwe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: na abarikiwe
  rationale: Kivumishi-tendo cha Kiebrania kimetumiwa katika kauli ya liturujia ya kumbariki Mungu. “Na abarikiwe” huhifadhi maana na nguvu ya kauli hiyo kwa Kiswahili cha kawaida na chenye heshima.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetoholewa moja kwa moja kwa tahajia inayofaa Kiswahili badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: מִצִּיּוֹן
  choice: kutoka Sayuni
  rationale: Kihusishi מִן kwa kawaida huonyesha chanzo au mahali ambapo tendo linaanzia. “Kutoka Sayuni” huhifadhi maana hiyo bila kuibadili kuwa “katika Sayuni.”
- source_word: שֹׁכֵן
  choice: yeye akaaye
  rationale: Kitenzi-partisipio cha שכן humtaja anayekaa au kuishi mahali. “Yeye akaaye” ni usemi wa kishairi na wenye heshima, bila kuingiza wazo la kutawazwa ambalo halitajwi wazi.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mji huo katika Kiswahili.
- source_word: הַלְלוּ יָהּ
  choice: Haleluya!
  rationale: Kauli hii ya liturujia imezoeleka katika Kiswahili. Tanbihi inaeleza maana yake halisi, “Msifuni Yah!”
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, si cheo. “Yahwe” huhifadhi jina hilo kwa umbo linalosomeka kiasili katika Kiswahili.
- issue: Uhusiano wa “kutoka Sayuni” na kauli ya baraka
  choice: Sayuni ni mahali ambapo baraka au sifa inatoka
  alternative: Yahwe aliye katika Sayuni
  rationale: Kihusishi מִן kimehifadhiwa kama “kutoka.” Mstari unaendelea kumtaja Yahwe kuwa ndiye akaaye Yerusalemu, hivyo tafsiri haibadili kimya kimya Sayuni kuwa mahali pake tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa ibada. “Yeye akaaye” hudumisha uhusiano wa kishazi cha Kiebrania na Yahwe, huku “na abarikiwe” ikihifadhi kauli ya baraka badala ya kuibadili kuwa sifa kwa ujumla.
