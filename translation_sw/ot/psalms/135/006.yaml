base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/006.yaml
  text: Yahweh does whatever he pleases[a], in heaven and on earth[c][b], in the seas and all the depths.
translation:
  language: sw
  text: Yahwe hufanya lolote analotaka[a], mbinguni[b] na duniani, baharini na katika vilindi vyote[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yote anayoyataka Yahwe ameyafanya.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “katika mbingu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “vilindi vyote vya maji”; neno hili linaweza kurejelea vilindi vya maji au kina kirefu cha maji.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: lolote
  rationale: Katika muundo huu maneno hayo yanaonyesha upeo usio na kikomo wa kinachofuata. “Lolote” ni Kiswahili cha kawaida kinachowasilisha maana ya “yote ambayo” bila kufanya mstari uwe mzito.
- source_word: חָפֵץ
  choice: analolipenda
  rationale: Kitenzi hiki kinaweza kumaanisha kupendezwa na, kutamani, au kutaka. Hapa “analolipenda” ni usemi wa asili unaohifadhi wazo la mapenzi ya Yahwe bila kulibana kuwa hisia tu au amri rasmi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: עָשָׂה
  choice: hufanya
  rationale: Ingawa umbo la Kiebrania ni qatal, muktadha unasema ukweli wa jumla kuhusu utendaji wa Yahwe. “Hufanya” huwasilisha hali hiyo ya kawaida na endelevu kwa Kiswahili.
- source_word: בַּשָּׁמַיִם
  choice: mbinguni
  rationale: Nomino ya Kiebrania ina umbo la wingi, lakini “mbinguni” ni usemi wa kawaida wa Kiswahili katika jozi ya ulimwengu mzima, “mbinguni na duniani.”
- source_word: וּבָאָרֶץ
  choice: na duniani
  rationale: “Duniani” ni sawa ya kawaida ya Kiswahili katika jozi ya mbingu na dunia na huhifadhi upeo wa ulimwengu mzima.
- source_word: בַּיַּמִּים
  choice: baharini
  rationale: Kiebrania kina wingi, lakini katika Kiswahili “baharini” inaweza kutaja eneo la bahari kwa ujumla bila kupoteza maana ya maji mengi ya ulimwengu.
- source_word: וְכָל תְּהוֹמוֹת
  choice: na katika vilindi vyote
  rationale: תְּהוֹמוֹת hurejelea vilindi, hasa vilindi vya maji. “Vilindi vyote” huhifadhi upana wa picha bila kuifanya irejelee bahari pekee kwa lazima.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina la Mungu moja kwa moja. Kulihifadhi kama “Yahwe” kunatofautisha jina hilo na cheo, bila kuongeza tafsiri ya kimadhehebu.
- issue: Wakati na hali ya עָשָׂה katika kauli ya jumla
  choice: hufanya
  alternative: amefanya
  rationale: Mstari unaeleza ukweli wa jumla kuhusu uhuru wa utendaji wa Yahwe. “Hufanya” huonyesha maana hiyo, huku tanbihi ikihifadhi uwezekano wa kufuata zaidi umbo la wakati uliotimilika la Kiebrania.
- issue: Maana ya תְּהוֹמוֹת
  choice: vilindi vyote
  alternative: maji yote ya vilindi au vilindi vyote vya bahari
  rationale: Neno linaweza kuashiria maji ya kina au vilindi vya awali vya ulimwengu. Tafsiri pana “vilindi vyote” inahifadhi picha na utata wake badala ya kuifungamanisha na maelezo mahususi ya kimaumbile.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. “Hufanya lolote analolipenda” ni usemi wa sasa na wa kawaida unaoeleweka kwa wasomaji wa leo; jozi “mbinguni na duniani” inadumisha mfuatano wa kishairi. Tanbihi zimehifadhi tofauti za wakati wa kitenzi, wingi wa “mbingu,” na upeo wa maana ya “vilindi.”
