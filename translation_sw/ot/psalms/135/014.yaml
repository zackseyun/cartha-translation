base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/014.yaml
  text: For Yahweh will vindicate his people[b][a], and he will have compassion on his servants.
translation:
  language: sw
  text: Kwa maana Yahweh atawatetea watu wake[a], naye atawahurumia watumishi wake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atawahukumu watu wake.” Kitenzi cha Kiebrania kinaweza kumaanisha “kuhukumu,” lakini hapa huenda kinamaanisha kutoa hukumu kwa niaba yao, yaani kuwatetea.
    reason: lexical_alternative
  - marker: b
    text: Au, “ataghairi kuhusu watumishi wake.” Kitenzi cha Kiebrania pia kinaweza kueleza kughairi hatua au kusukumwa na huruma.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huanzisha sababu au ufafanuzi wa kauli iliyotangulia na ni kiunganishi cha kawaida katika mtiririko wa hoja wa zaburi.
- source_word: יָדִין
  choice: atawatetea
  rationale: Ingawa דין inaweza kumaanisha ‘kuhukumu,’ hapa, sambamba na rehema kwa watumishi wa Mungu na kama katika Kumbukumbu la Torati 32:36, inaelekea kumaanisha kutoa hukumu kwa niaba ya watu wake, yaani kuwatetea na kuwapatia haki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limewasilishwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: עַמּוֹ
  choice: watu wake
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili kwa kundi la watu walio katika uhusiano wa agano naye.
- source_word: וְעַל
  choice: na ... -hurumia
  rationale: Kihusishi עַל pamoja na נחם kinaingizwa kiasili katika kitenzi cha Kiswahili ‘kuwahurumia,’ badala ya kutafsiriwa neno kwa neno.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Katika muktadha wa watu wanaomtumikia Yahweh, ‘watumishi’ ni la asili na linafaa zaidi kuliko ‘watumwa,’ kwa kuwa hali ya utumwa haisisitizwi hapa.
- source_word: יִתְנֶחָם
  choice: atawahurumia
  rationale: Nifali ya נחם inaweza kueleza kughairi hatua au kusukumwa na huruma. Katika muktadha huu, ‘atawahurumia’ huwasilisha rehema yake kwa watumishi wake kwa Kiswahili cha sasa.
theological_decisions:
- issue: Lugha inayomhusisha Mungu na mwitikio wa kihisia katika יִתְנֶחָם
  choice: atawahurumia
  alternative: ataghairi kuhusu watumishi wake
  rationale: Tafsiri kuu inaonyesha mwitikio wa rehema unaokusudiwa katika muktadha bila kudokeza kwamba Mungu anatubu kosa. Tanbihi inadumisha uwezekano halisi wa kitenzi kumaanisha kughairi hatua.
- issue: Maana ya דין Mungu anapowahukumu watu wake
  choice: atawatetea
  alternative: atawahukumu
  rationale: Muktadha na usambamba wa Kumbukumbu la Torati 32:36 unaelekeza kwenye hukumu inayowatetea watu wake; hata hivyo, maana pana ya ‘kuhukumu’ imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Atawatetea’ ni wazi kwa wasomaji wa kawaida na huhifadhi dhana ya hukumu inayowapa haki; ‘atawahurumia’ ni ya asili huku tanbihi zikihifadhi upana wa maneno ya Kiebrania.
