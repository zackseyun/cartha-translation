base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/004.yaml
  text: For Yah has chosen Jacob for himself[a], Israel as his treasured possession.
translation:
  language: sw
  text: 'Kwa maana Yah[a] amemchagua Yakobo kwa ajili yake mwenyewe,

    Israeli kuwa mali yake ya thamani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Yah,” umbo fupi la jina la Mungu.'
    reason: Ufafanuzi wa umbo fupi la jina la Mungu lililotumiwa katika matini ya Kiebrania.
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Katika muktadha huu neno linaanzisha sababu ya sifa na himizo lililotangulia; “Kwa maana” ni kiunganishi cha kawaida na chenye hadhi katika Kiswahili.
- source_word: בָּחַר
  choice: amemchagua
  rationale: Kitenzi kina maana ya kuchagua. Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika ambalo matokeo yake yanaendelea.
- source_word: לּוֹ
  choice: kwa ajili yake mwenyewe
  rationale: Kirai hiki kinaonyesha kwamba Yakobo alichaguliwa awe wa Yah mwenyewe, huku kikihifadhi msisitizo wa Kiebrania wa manufaa au umiliki.
- source_word: יָהּ
  choice: Yah
  rationale: Hili ndilo umbo fupi la jina la Mungu lililo katika matini ya Kiebrania; kulitaja moja kwa moja kunahifadhi upekee na uzito wake wa kishairi.
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili; hapa linawakilisha taifa kwa ulinganifu na Israeli.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la kawaida katika Kiswahili, likitumika hapa sambamba na Yakobo kumaanisha watu wa agano.
- source_word: סְגֻלָּה
  choice: mali yake ya thamani
  rationale: Nomino hii humaanisha mali ya pekee inayothaminiwa sana. Tafsiri hii ni ya asili katika Kiswahili na inadumisha wazo la umiliki wenye thamani bila kuongeza tafsiri ya kimadhehebu.
- source_word: לִסְגֻלָּתוֹ
  choice: kuwa mali yake ya thamani
  rationale: 'Muundo huu unaonyesha uhusiano au matokeo ya kuchaguliwa: Israeli amewekwa kuwa mali ya Yah inayothaminiwa.'
theological_decisions:
- issue: Uwasilishaji wa umbo fupi la jina la Mungu יָהּ
  choice: Yah
  alternative: BWANA
  rationale: Matini ina יָהּ, umbo fupi la jina la Mungu, wala si tetragramatoni kamili. “Yah” hulihifadhi kwa usahihi na kuepuka kuficha tofauti hiyo ya kimaandishi; tanbihi hulifafanua kwa msomaji.
- issue: Maana ya סְגֻלָּה kuhusu Israeli
  choice: mali yake ya thamani
  alternative: hazina yake ya pekee
  rationale: “Mali yake ya thamani” huhifadhi kwa pamoja maana ya kuwa mali na ya kuthaminiwa, bila kulazimisha maana pana zaidi ya kitheolojia kuliko ilivyo katika neno la Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa mistari unadumisha usambamba wa kishairi kati ya “Yakobo” na “Israeli.”
