  text: to Sihon king of the Amorites, and to Og king of Bashan, and to all the kingdoms of Canaan.
translation:
  language: sw
  text: Sihoni, mfalme wa Waamori, na Ogu, mfalme wa Bashani, na falme zote za Kanaani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/סִיחוֹן
  choice: Sihoni
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili. Kihusishi לְ kinaendeleza muundo wa sentensi kutoka mstari uliotangulia; hakijarudiwa hapa kwa sababu kingesikika kisicho cha kawaida bila muktadha huo.
- source_word: מֶלֶךְ הָ/אֱמֹרִי
  choice: mfalme wa Waamori
  rationale: Muundo wa kutegemeana unaonyesha mtawala wa jamii ya Waamori; wingi wa jina la taifa ni wa kawaida na wazi katika Kiswahili.
- source_word: וּ/לְ/עוֹג
  choice: na Ogu
  rationale: Kiunganishi וּ kimetafsiriwa ‘na’; jina limetoholewa ‘Ogu’. Kihusishi לְ kinategemea kitenzi katika mstari uliotangulia na kinaeleweka katika orodha hii.
- source_word: מֶלֶךְ הַ/בָּשָׁן
  choice: mfalme wa Bashani
  rationale: Kirai cha Kiebrania kimetafsiriwa kwa muundo wa kawaida wa Kiswahili unaoonyesha eneo alilotawala.
- source_word: וּ/לְ/כֹל
  choice: na ... zote
  rationale: וּ imetafsiriwa ‘na’, na כֹל imewakilishwa kwa ‘zote’, ikipatana na nomino ya wingi ‘falme’; לְ inaendelea kutegemea sintaksia ya mstari uliotangulia.
- source_word: מַמְלְכ֥וֹת
  choice: falme
  rationale: Neno hili humaanisha falme au maeneo ya kifalme; ‘falme’ ni tafsiri fupi na ya kawaida katika muktadha huu.
- source_word: כְּנָעַן
  choice: Kanaani
  rationale: Jina la mahali limetoholewa kwa umbo la kawaida la Kiswahili.
