  yaml_path: translation/ot/psalms/135/003.yaml
  text: Praise Yah[a], for Yahweh is good; sing praises to his name[b], for it is pleasant.
translation:
  language: sw
  text: Msifuni Yah[a], kwa maana Yahweh ni mwema; liimbieni jina lake nyimbo za sifa, kwa maana ni la kupendeza.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania “Yah,” umbo fupi la jina la Mungu; ni tofauti na “Yahweh” linalofuata.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa maana yeye ni mwenye kupendeza,” ikiwa kivumishi cha mwisho kinaeleweka kumrejelea Yahweh badala ya jina lake au tendo la kuimba sifa.
    reason: alternative_reading
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: Msifuni
  rationale: Amri ya wingi ya הלל ni mwito wa moja kwa moja wa ibada; “msifuni” ni Kiswahili cha kawaida na chenye heshima.
- source_word: יָהּ
  choice: Yah
  rationale: Ni umbo fupi la jina la Mungu, tofauti na יְהוָה inayofuata; kulihifadhi kama “Yah” kunaonyesha tofauti hiyo.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa neno hili linatoa sababu ya mwito wa kusifu; “kwa maana” linafaa katika ushairi wa heshima.
- source_word: טוֹב
  choice: mwema
  rationale: Kivumishi hiki kinamwelezea Yahweh; kwa hiyo umbo la ngeli ya mtu “mwema” linaeleza wema wake kwa upana bila kuubana kuwa ukarimu pekee.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Unukuzi wa jina la Mungu huhifadhi jina binafsi lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: זַמְּרוּ
  choice: liimbieni ... sifa
  rationale: Amri ya wingi ya זמר ina maana ya kusifu kwa wimbo; muundo huu ni wa asili katika Kiswahili na huhifadhi upande wa muziki na wa ibada.
- source_word: לִשְׁמוֹ
  choice: jina lake
  rationale: Pamoja na kitenzi “liimbieni,” usemi huu huonyesha kwamba sifa zinaelekezwa kwa jina lake, yaani jina na sifa zake zilizofunuliwa.
- source_word: נָעִים
  choice: la kupendeza
  rationale: Neno linaweza kumaanisha lenye kupendeza, tamu, au zuri. Muundo huu unaliunganisha kiasili na “jina lake,” huku uwezekano mwingine ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa majina יָהּ na יְהוָה katika mstari mmoja
  choice: Kutofautisha kama “Yah” na “Yahweh”
  alternative: Kuyatafsiri yote kwa cheo kama “BWANA”
  rationale: Maandishi yanatumia maumbo mawili tofauti ya jina la Mungu; kuyatofautisha huhifadhi ushahidi huo wa Kiebrania bila kuingiza msimamo wa kimadhehebu.
- issue: Kirejewa cha נָעִים
  choice: Kukihusisha katika maandishi makuu na “jina lake”
  alternative: Kukielewa kuwa kinamrejelea Yahweh mwenyewe, au tendo la kuimba sifa
  rationale: Ukaribu wa kisarufi na “jina lake” unaunga mkono usomaji wa maandishi makuu, lakini Kiebrania kinaruhusu zaidi ya uhusiano mmoja; hivyo utata halisi umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Amri ya wingi “Msifuni” inadumisha mwito wa kijumuiya; majina “Yah” na “Yahweh” yamehifadhiwa kwa uwazi wa kimatini.
