id: PSA.135.7
reference: Psalms 135:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: מַֽעֲלֶ֣ה נְשִׂאִים֮ מִ/קְצֵ֪ה הָ֫/אָ֥רֶץ בְּרָקִ֣ים לַ/מָּטָ֣ר עָשָׂ֑ה מֽוֹצֵא ר֝וּחַ מֵ/אֽוֹצְרוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/007.yaml
  text: He makes clouds rise from the ends of the earth[a]; he makes lightning for the rain[c][b]; he brings out the wind from his storehouses.
translation:
  language: sw
  text: Huyapandisha mawingu[a] kutoka miisho ya dunia[b]; hufanya umeme kwa ajili ya mvua; huutoa upepo kutoka katika maghala yake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mivuke” au “ukungu unaopanda.” Neno la Kiebrania linaweza kuwa na maana hizo, lakini katika muktadha huu wa dhoruba “mawingu” linafaa zaidi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “kutoka mwisho wa dunia.” Umoja huo unaweza kumaanisha kwa ujumla sehemu za mbali kabisa za dunia.
    reason: lexical_alternative
  - marker: c
    text: Au, “hazina zake.” Taswira ni ya Mungu akiweka upepo mahali pa kuhifadhi na kuutoa apendavyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֶה
  choice: Huyapandisha
  rationale: Kauli ya kusababisha katika kitenzi hiki inaonyesha kwamba Mungu ndiye anayefanya mawingu yapande; “huyapandisha” ni ya kawaida na inadumisha maana hiyo.
- source_word: נְשִׂאִים
  choice: mawingu
  rationale: Ingawa neno linaweza kumaanisha mvuke au ukungu unaopanda, muktadha wa umeme, mvua na upepo unaunga mkono “mawingu.”
- source_word: מִקְצֵה הָאָרֶץ
  choice: kutoka miisho ya dunia
  rationale: Umoja wa Kiebrania unaweza kuwa na maana ya kijumla ya sehemu za mbali kabisa; wingi wa Kiswahili unawasilisha nahau hiyo kwa kawaida.
- source_word: בְּרָקִים
  choice: umeme
  rationale: Katika muktadha wa hali ya hewa, “umeme” hueleza mianga ya radi bila kugeuza neno kuwa ngurumo.
- source_word: לַמָּטָר
  choice: kwa ajili ya mvua
  rationale: Muundo huu unafuata kwa karibu kihusishi cha Kiebrania ל na kuhifadhi uhusiano wa kishairi kati ya umeme na mvua bila kuufafanua kupita kiasi.
- source_word: עָשָׂה
  choice: hufanya
  rationale: Ingawa umbo ni qatal, hapa linaeleza tendo la Mungu la kawaida katika uumbaji; wakati wa mazoea unaafikiana na vitenzi sambamba.
- source_word: מוֹצֵא
  choice: huutoa
  rationale: Kauli ya kusababisha inaonyesha Mungu akiuachilia au kuutoa upepo; “huutoa” ni fupi na ya kawaida.
- source_word: רוּחַ
  choice: upepo
  rationale: Mfuatano wa mawingu, umeme na mvua unahitaji maana ya hali ya hewa, si “roho” wala “pumzi.”
- source_word: מֵאֹצְרוֹתָיו
  choice: kutoka katika maghala yake
  rationale: “Maghala” yanahifadhi taswira halisi ya mahali ambapo upepo umewekwa na kisha kutolewa; pia ni wazi kuliko “hazina” katika Kiswahili cha sasa.
theological_decisions:
- issue: Matendo ya Mungu yaelezwe kwa wakati uliopo au uliopita
  choice: 'Kutumia vitenzi vya mazoea: “huyapandisha,” “hufanya,” na “huutoa.”'
  alternative: Kutumia wakati uliopita, kama “aliyapandisha,” “alifanya,” na “aliutoa.”
  rationale: Katika wimbo huu matendo hayo yanaeleza utawala wa Mungu wa kudumu juu ya uumbaji. Wakati wa mazoea unadumisha maana ya kijumla huku ukipatana na viambishi vya vitenzi vya Kiebrania vinavyozunguka kitenzi cha kati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Mpangilio wa vipashio umefuata usambamba wa Kiebrania. Alama za tanbihi zimewekwa karibu na maneno yanayohusika kulingana na ushahidi wa Kiebrania.
