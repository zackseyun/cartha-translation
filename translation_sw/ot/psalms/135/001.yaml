lexical_decisions:
- source_word: הַ֥לְלוּ
  choice: Sifuni
  rationale: Ni amri ya wingi ya kitenzi הלל katika piel, inayotoa mwito wa moja kwa moja wa kusifu. “Sifuni” ni Kiswahili cha kawaida na pia kinahifadhi urudiaji wa amri hiyo mara tatu.
- source_word: יָ֨הּ
  choice: Yah
  rationale: Hili ni umbo fupi la kishairi la jina la Mungu. Kulihifadhi kama “Yah” kunaonyesha tofauti yake na יְהוָה inayofuata na uhusiano wake na mwito wa kiliturujia “Haleluya.”
- source_word: אֶת שֵׁם יְהוָה
  choice: jina la Yahwe
  rationale: Kirai hiki kinataja wazi jina la Mungu kuwa kitu kinachosifiwa. “Jina la Yahwe” ni cha asili katika Kiswahili na kinafuata muundo na msisitizo wa Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni jina binafsi la Mungu katika maandishi ya Kiebrania. “Yahwe” hulihamisha kwa Kiswahili badala ya kulibadili kuwa cheo kama “BWANA.”
- source_word: עַבְדֵי
  choice: watumishi
  rationale: Katika mwito huu wa ibada, neno hilo linawataja watu wanaomtumikia Yahwe kwa heshima; “watumishi” linafaa zaidi katika muktadha kuliko “watumwa.”
theological_decisions:
- issue: Uwakilishaji wa maumbo mawili ya jina la Mungu, יָהּ na יְהוָה, katika mstari mmoja
  choice: Kutafsiri יָהּ kuwa “Yah” na יְהוָה kuwa “Yahwe”
  alternative: Kutumia “BWANA” kwa yote mawili, au kuyafanya yote yawe “Yahwe”
  rationale: Kiebrania kimetumia kimakusudi umbo fupi “Yah” mwanzoni na jina kamili “Yahwe” baadaye. Kuyatofautisha kunahifadhi ushahidi wa matini bila kufuta tofauti hiyo ya kishairi na kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayofaa kwa usomaji wa ibada. Urudiaji wa “Sifuni” umehifadhiwa, na “enyi” imetumiwa kuonyesha mwito wa moja kwa moja kwa watumishi.
