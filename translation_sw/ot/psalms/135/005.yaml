base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/005.yaml
  text: For I know that Yahweh is great[b][a], and our Lord is above all gods.
translation:
  language: sw
  text: Kwa maana najua kwamba Yahwe[a] ni mkuu, na Bwana wetu ni mkuu kuliko miungu yote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yahwe” ni jina la Mungu YHWH; “Bwana wetu” hutafsiri neno tofauti la Kiebrania, yaani “bwana/mtawala wetu.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania husema kihalisi, “kutoka kwa miungu yote,” nahau ya ulinganisho yenye maana ya “kuliko miungu yote” au “juu ya miungu yote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi cha kwanza kinatoa sababu ya mwito wa sifa katika muktadha; “Kwa maana” ni Kiswahili cha kawaida kinachoonyesha uhusiano huo.
- source_word: יָדַעְתִּי
  choice: najua
  rationale: Kauli timilifu ya Kiebrania hapa inaonyesha maarifa yaliyothibitika na yanayoendelea; wakati wa sasa “najua” huwasilisha maana hiyo kwa kawaida.
- source_word: כִּי
  choice: kwamba
  rationale: Kiunganishi cha pili kinatanguliza jambo ambalo mtunga zaburi analijua.
- source_word: גָדוֹל
  choice: ni mkuu
  rationale: Kivumishi hiki kinatangaza ukuu wa Yahwe moja kwa moja; “mkuu” ni sawia ya kawaida na yenye hadhi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa badala ya kubadilishwa kwa cheo, ili kutofautisha jina hilo na אֲדֹנֵינוּ katika kishazi kinachofuata.
- source_word: אֲדֹנֵינוּ
  choice: Bwana wetu
  rationale: Nomino hiyo ina maana ya bwana au mtawala pamoja na kiambishi cha nafsi ya kwanza wingi; “Bwana wetu” huhifadhi hadhi na umilikaji wake.
- source_word: מִכָּל
  choice: mkuu kuliko ... yote
  rationale: Kihusishi מִן kinaonyesha ulinganisho hapa. Kiswahili “mkuu kuliko” huweka wazi ukuu unaolinganishwa bila kubadili dai la mstari.
- source_word: אֱלֹהִים
  choice: miungu
  rationale: Umbo la wingi katika muktadha huu hurejelea miungu mingine; tafsiri ya moja kwa moja “miungu” huhifadhi mvutano wa kiteolojia wa maandishi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina la Mungu YHWH, nalo limetoholewa ili lihifadhiwe kama jina na pia lisichanganywe na cheo “Bwana wetu” katika kishazi kinachofuata.
- issue: Maana ya אֱלֹהִים katika kishazi cha mwisho
  choice: miungu yote
  alternative: viumbe vyote vya kiungu
  rationale: “Miungu” ndiyo tafsiri ya moja kwa moja ya wingi huu na huhifadhi dai la maandishi kuhusu ukuu wa Yahwe bila kuamua kimya kimya hali ya ontolojia ya hao wanaoitwa miungu.
- issue: Uhusiano wa גָדוֹל na מִכָּל אֱלֹהִים
  choice: Yahwe ni mkuu; Bwana wetu ni mkuu kuliko miungu yote
  alternative: Yahwe ni mkuu, na Bwana wetu yuko juu ya miungu yote
  rationale: Kiebrania hutaja ukuu katika kishazi cha kwanza na kisha hutumia kishazi linganishi katika cha pili. Kurudia “mkuu” kwa Kiswahili huonyesha maana ya ulinganisho kwa uwazi, huku tanbihi ikihifadhi muundo halisi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni rahisi kueleweka katika usomaji wa hadhara. “Yahwe” huhifadhi jina binafsi la Mungu, huku “Bwana wetu” likihifadhi tofauti ya kileksia katika Kiebrania. Alama zote za tanbihi zimewekwa katika matini kuu.
