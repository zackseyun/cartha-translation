  yaml_path: translation/ot/psalms/135/017.yaml
  text: They have ears[a], but they do not hear; indeed, there is no breath in their mouths.
translation:
  language: sw
  text: Wana masikio, lakini hawasikii; naam, hamna pumzi kinywani mwao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “roho” badala ya “pumzi” (Kiebrania: רוּחַ); hapa muktadha wa masanamu yasiyo na uhai na maneno “kinywani mwao” unapendelea “pumzi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָזְנַיִם לָהֶם
  choice: Wana masikio
  rationale: Muundo wa Kiebrania usio na kitenzi unaonyesha umilikaji; Kiswahili cha kawaida hutumia ‘wana,’ huku ‘masikio’ ikihifadhi taswira halisi.
- source_word: וְלֹא יַאֲזִינוּ
  choice: lakini hawasikii
  rationale: Ingawa וְ ni ‘na,’ hapa inaonyesha utofautishaji. Hiphil ya אזן inaweza kumaanisha kusikiliza kwa makini, lakini ‘hawasikii’ ni ya kawaida na inafaa kwa hoja kuhusu masanamu yasiyoweza kutumia viungo vyao.
- source_word: אַף
  choice: naam
  rationale: Neno hili linatia mkazo na kuendeleza hoja; ‘naam’ linafaa kwa sajili yenye hadhi ya Zaburi bila kuifanya sentensi kuwa nzito.
- source_word: אֵין יֶשׁ רוּחַ
  choice: hamna pumzi
  rationale: Muundo huu unakanusha kuwapo kabisa. ‘Hamna’ ni Kiswahili sanifu na cha moja kwa moja; katika muktadha huu רוּחַ inaelekea kumaanisha pumzi ya uhai.
- source_word: בְּפִיהֶם
  choice: kinywani mwao
  rationale: Kiswahili hutumia umoja wa kijumla ‘kinywani mwao’ kwa hali inayomhusu kila mmoja wao; hii inahifadhi taswira ya kitu kilicho kinywani bila tungo isiyo ya kawaida.
theological_decisions:
- issue: Maana ya רוּחַ katika dhihaka dhidi ya masanamu
  choice: pumzi
  alternative: roho
  rationale: Muktadha unaorodhesha viungo vya mwili visivyofanya kazi na kufikia kilele kwa kutokuwapo kwa pumzi kinywani. ‘Pumzi’ inaonyesha kwamba masanamu hayana uhai bila kuingiza dai pana la kimetafizikia kuhusu roho; maana mbadala imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Naam’ hudumisha mkazo wa kishairi; ‘hamna pumzi kinywani mwao’ ni ya asili huku ikihifadhi taswira halisi na utata wa רוּחַ katika tanbihi.
