base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/002.yaml
  text: I have sunk in deep mire[a], and there is no foothold; I have come into deep waters, and the flood has swept over me.
translation:
  language: sw
  text: 'Nimezama katika tope lenye kina,

    wala sina mahali pa kusimama;

    nimeingia katika maji yenye kina,

    na mkondo wa maji umenifunika.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na mkondo wa maji umenisomba”; au, “na mafuriko yamenifunika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טָבַעְתִּי
  choice: Nimezama
  rationale: Kauli timilifu ya nafsi ya kwanza inaonyesha hali ambayo tayari imempata msemaji na ambayo matokeo yake yanaendelea; “nimezama” ni ya asili na yenye nguvu katika Kiswahili.
- source_word: בִּיוֵן מְצוּלָה
  choice: katika tope lenye kina
  rationale: יוֵן ni tope, na מְצוּלָה ni kina au mahali penye kina. Usemi huu unahifadhi picha zote mbili bila kuleta muundo mgumu usio wa kawaida.
- source_word: וְאֵין מָעֳמָד
  choice: wala sina pa kukanyaga
  rationale: מָעֳמָד ni mahali pa kusimama au tegemeo la mguu. “Sina pa kukanyaga” ni usemi wa kawaida unaoendeleza picha ya mtu asiyeweza kupata mahali imara ndani ya tope.
- source_word: בָּאתִי
  choice: nimeingia
  rationale: Ingawa kitenzi kimsingi ni “kuja,” katika muktadha wa kufika ndani ya maji yenye kina, “nimeingia” huwasilisha mwendo na hali hatari kwa Kiswahili cha asili.
- source_word: בְמַעֲמַקֵּי מַיִם
  choice: katika maji yenye kina
  rationale: Kirai kinamaanisha vilindi vya maji au maji ya kina kirefu. “Maji yenye kina” ni wazi, cha sasa, na huhifadhi taswira ya Kiebrania.
- source_word: שִׁבֹּלֶת
  choice: mkondo wa maji
  rationale: Neno linaweza kumaanisha mkondo, kijito chenye nguvu, au gharika. “Mkondo wa maji” hudumisha maana ya mtiririko bila kuamua kimya-kimya kuwa ni mafuriko.
- source_word: שְׁטָפָתְנִי
  choice: umenifunika
  rationale: Kitenzi שטף huonyesha kufurika juu ya mtu, kumgharikisha, au kumsomba. “Umenifunika” hudumisha picha ya maji yanayopita juu yake; uwezekano wa “kunisomba” umewekwa katika tanbihi.
