  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mistari sambamba imehifadhiwa, na lugha ya maji na kukosa mahali pa kukanyaga haijafanywa kuwa ya kimajazi moja kwa moja.
