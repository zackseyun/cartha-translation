  text: חֶרְפָּ֤ה שָֽׁבְרָ֥ה לִבִּ֗/י וָֽ/אָ֫נ֥וּשָׁ/ה וָ/אֲקַוֶּ֣ה לָ/נ֣וּד וָ/אַ֑יִן וְ֝/לַ/מְנַחֲמִ֗ים וְ/לֹ֣א מָצָֽאתִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/020.yaml
  text: Reproach has broken my heart[a], and I am sick; I looked for sympathy, but there was none, and for comforters, but I found none.
translation:
  language: sw
  text: Fedheha imeuvunja moyo wangu, nami nimeugua sana; nilitazamia huruma, lakini haikuwapo; nilitazamia wafariji, lakini sikupata yeyote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶרְפָּה
  choice: Fedheha
  rationale: Neno hili linaonyesha dharau au aibu ya hadharani inayosababishwa na wengine. “Fedheha” huhifadhi wazo la kuaibishwa na kutendewa kwa dharau bila kulifanya kuwa shutuma ya kosa pekee.
- source_word: שָׁבְרָה לִבִּי
  choice: imeuvunja moyo wangu
  rationale: Tafsiri hii huhifadhi taswira ya Kiebrania ya moyo kama nafsi ya ndani, hisia na uthabiti wa mtu, na ni ya kawaida katika Kiswahili.
- source_word: וָאֲנוּשָׁה
  choice: nami nimeugua sana
  rationale: Kitenzi kinaeleza hali nzito ya kudhoofika au kuugua. “Nimeugua sana” huonyesha uzito wake bila kudai kwamba ugonjwa huo hauponiki wala kwamba ni wa mwili tu.
- source_word: וָאֲקַוֶּה
  choice: nilitazamia
  rationale: Kitenzi kinaweza kumaanisha kusubiri, kutumaini au kutarajia. Katika muktadha huu kinataja matarajio ya kupata mwitikio wa huruma.
- source_word: לָנוּד
  choice: mtu wa kunionea huruma
  rationale: Umbo hili linamaanisha mwitikio wa kumwonea anayeteseka huruma au kushiriki masikitiko yake. Uundaji wa kibinafsi unafaa na kauli inayofuata kwamba hakuwapo mtu huyo.
- source_word: וָאַיִן
  choice: lakini hakuwapo
  rationale: Kauli hii inaonyesha kutokuwapo kabisa kwa aliyekuwa akitazamiwa, huku “lakini” ikileta wazi tofauti yenye uchungu katika muktadha.
- source_word: וְלַמְנַחֲמִים
  choice: na wafariji
  rationale: Neno la Kiebrania ni umbo la wingi linalotaja watu ambao wangetoa faraja. “Wafariji” ni fupi, ya kawaida na huhifadhi wingi huo.
- source_word: וְלֹא מָצָאתִי
  choice: lakini sikumpata hata mmoja
  rationale: Kauli hii inaeleza kushindwa kupata yeyote kati ya wafariji waliotazamiwa na inaweka wazi maana ya kibinafsi ya wingi wa Kiebrania.
theological_decisions:
- issue: Matumizi ya Kimasihi katika ufasiri wa Kikristo
  choice: Mstari umetafsiriwa kwanza katika muktadha wake wa maombolezo ya mtu binafsi katika Zaburi, bila kuongeza lugha ya Kimasihi moja kwa moja.
  alternative: Kuufanya mstari useme wazi kwamba unatabiri mateso ya Masihi.
  rationale: Agano Jipya linahusianisha Zaburi 69 na Yesu, lakini maana ya Kiebrania ya mstari huu ni kilio cha mtu anayeteseka. Tafsiri hii hudumisha maana hiyo na bado haizuii matumizi yake ya baadaye kwa Masihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Mfuatano wa sentensi umehifadhi usambamba wa maombolezo, huku “nimeugua sana” ikiepuka kutaja ugonjwa wa mwili pekee.
