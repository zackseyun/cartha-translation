lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwimbishaji mkuu
  rationale: Katika vichwa vya zaburi, neno hili hutoa maelekezo kwa kiongozi wa uimbaji au utendaji wa muziki; tafsiri hii ni fupi, ya kawaida, na inahifadhi kazi yake ya kiliturujia.
- source_word: עַל
  choice: kwa namna ya
  rationale: Katika maelekezo ya muziki, עַל huweza kutambulisha wimbo, mtindo, au mpangilio wa kuimbia. Kauli hii huhifadhi upana huo bila kudai kwa hakika kuwa ni jina la melodia.
- source_word: שׁוֹשַׁנִּים
  choice: “Maua ya Yungiyungi”
  rationale: Neno hilo humaanisha maua ya yungiyungi, lakini katika kichwa hiki huenda ni jina la wimbo au mtindo wa muziki. Alama za kunukuu zinaonyesha matumizi yanayowezekana kama jina.
- source_word: לְדָוִד
  choice: Zaburi ya Daudi
  rationale: לְ katika vichwa vya zaburi inaweza kuonyesha uandishi, wakfu, umilikaji, au uhusiano. Kauli iliyozoeleka ya Kiswahili 'Zaburi ya Daudi' haisisitizi uandishi moja kwa moja kama 'iliyoandikwa na Daudi'.
theological_decisions:
- issue: Maana ya לְדָוִד katika kichwa cha zaburi
  choice: Zaburi ya Daudi
  alternative: Iliyoandikwa na Daudi; Kwa ajili ya Daudi
  rationale: Maandishi ya Kiebrania hayalazimishi maana moja tu; tafsiri kuu na tanbihi huhifadhi uwezekano wa uandishi, wakfu, au uhusiano.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kichwa cha zaburi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Mwimbishaji mkuu’ ni neno la wazi kuliko istilahi adimu, na ‘Maua ya Yungiyungi’ hutafsiri taswira ya Kiebrania huku alama za kunukuu zikidokeza kuwa huenda ni jina la muziki.
