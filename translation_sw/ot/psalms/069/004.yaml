base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/004.yaml
  text: Those who hate me without cause are more than the hairs of my head[a]; those who would destroy me, my false enemies, are mighty. What I did not steal[b], then I must restore.
translation:
  language: sw
  text: Wanaonichukia bila sababu ni wengi kuliko nywele za kichwa changu; wanaotaka kuniangamiza—adui zangu wa uongo[a]—wana nguvu. Kitu ambacho sikuiba, ndipo nalazimika kukirudisha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “adui zangu wanaonipinga kwa uongo.” Neno la Kiebrania linaweza kuwaeleza adui hao kuwa wadanganyifu, au kuonyesha kwamba wanampinga mtunga zaburi bila msingi.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “ndipo nakirudisha.” Maana yaweza kuwa kwamba mtunga zaburi analazimishwa kurudisha kitu ambacho hakuiba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוּ מִשַּׂעֲרוֹת רֹאשִׁי
  choice: ni wengi kuliko nywele za kichwa changu
  rationale: Kitenzi kina maana ya kuwa wengi, na מִן inaonyesha ulinganisho; Kiswahili hiki kinahifadhi taswira ya kishairi ya wingi usiohesabika.
- source_word: שֹׂנְאַי חִנָּם
  choice: wanaonichukia bila sababu
  rationale: חִנָּם hapa humaanisha chuki isiyo na msingi au haki, si tu kitu kisicho na malipo.
- source_word: עָצְמוּ
  choice: wana nguvu
  rationale: Mzizi עצם hapa unaonyesha kuwa na nguvu au uwezo mkubwa; usemi huu ni wa kawaida na unaonyesha tishio lao.
- source_word: מַצְמִיתַי
  choice: wanaotaka kuniangamiza
  rationale: Umbo la kisifa linawataja walio na nia ya kumharibu kabisa msemaji; 'kuniangamiza' linaonyesha uzito wa tishio hilo.
- source_word: אֹיְבַי שֶׁקֶר
  choice: adui zangu wa uongo
  rationale: שֶׁקֶר inaweza kueleza adui kuwa wadanganyifu au kuonyesha kwamba uadui wao hauna msingi; tafsiri hii fupi inahifadhi utata huo kwa tanbihi.
- source_word: אֲשֶׁר לֹא גָזַלְתִּי
  choice: Kitu ambacho sikuiba
  rationale: גזל hasa ni kunyang'anya au kuchukua kwa nguvu, lakini 'kuiba' ni neno la kawaida linaloeleweka na linafaa katika muktadha wa madai ya kurejesha.
- source_word: אָז אָשִׁיב
  choice: ndipo nalazimika kukirudisha
  rationale: Kiebrania chenyewe husema 'ndipo narudisha/nitarudisha'; muktadha wa shtaka lisilo la haki unaashiria urejeshaji wa kulazimishwa, huku tanbihi ikihifadhi usemi halisi.
theological_decisions:
- issue: Kauli ya mwisho kama urejeshaji unaolazimishwa licha ya kutokuwa na hatia
  choice: Kitu ambacho sikuiba, ndipo nalazimika kukirudisha.
  alternative: Kitu ambacho sikuiba, ndipo nakirudisha.
  rationale: Muktadha unaonyesha mateso na mashtaka yasiyo ya haki. 'Nalazimika' huwasilisha maana inayodokezwa bila kudai kwamba imo wazi katika kitenzi, na tanbihi huhifadhi muundo halisi wa Kiebrania.
- issue: Uhusiano wa שֶׁקֶר na 'adui zangu'
  choice: adui zangu wa uongo
  alternative: adui zangu wanaonipinga kwa uongo
  rationale: Sarufi inaweza kueleza tabia ya adui hao au kutokuwa na msingi kwa uadui wao; tafsiri kuu pamoja na tanbihi hailazimishi maana moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo ni wazi kwa msomaji wa kawaida; taswira, ulinganifu, na utata halisi wa Kiebrania vimehifadhiwa kwa tanbihi.
