base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/014.yaml
  text: Rescue me from the mire; do not let me sink[a]. Let me be delivered from those who hate me and from the depths of the waters.
translation:
  language: sw
  text: Uniokoe kutoka matopeni; usiniache nizame. Niokolewe kutoka kwa wale wanaonichukia, na kutoka vilindi vya maji.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Uniokoe
  rationale: Kitenzi נצל katika Hifili ya amri pamoja na kiambishi cha nafsi ya kwanza ni ombi la kuokolewa kwa tendo la Mungu; “Uniokoe” ni la kawaida, wazi, na lenye uzito unaofaa katika Kiswahili.
- source_word: מִטִּיט
  choice: kutoka matopeni
  rationale: טיט humaanisha matope, tope zito, au udongo wa mfinyanzi. “Matopeni” huonyesha kwa kawaida hali ya kunasa na kuzama inayodokezwa na mstari huu.
- source_word: וְאַל אֶטְבָּעָה
  choice: usiniache nizame
  rationale: Kikanushi אַל pamoja na kitenzi cha nafsi ya kwanza huleta ombi la kuzuia jambo lisitendeke. “Usiniache nizame” ni Kiswahili cha kawaida kinachohifadhi nguvu ya ombi bila kulifanya dai.
- source_word: אִנָּצְלָה
  choice: Niokolewe
  rationale: Umbo la Nifali lenye maana ya hiari/ombi hurudia sala ya kuokolewa kwa ulinganifu wa kishairi. “Niokolewe” huhifadhi sauti ya ombi na hali ya kutendewa.
- source_word: מִשֹּׂנְאַי
  choice: kutoka kwa wale wanaonichukia
  rationale: Maana ya moja kwa moja ni “wale wanaonichukia,” si lazima neno pana zaidi “adui zangu.” Tafsiri hii huhifadhi uwazi wa Kiebrania.
- source_word: וּמִמַּעֲמַקֵּי מָיִם
  choice: na kutoka vilindi vya maji
  rationale: מַעֲמַקֵּי ni “vilindi/mahali pa kina” katika uhusiano na “maji.” “Vilindi vya maji” huhifadhi muundo na taswira ya kishairi ya Kiebrania.
