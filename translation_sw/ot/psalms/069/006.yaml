id: PSA.69.6
reference: Psalms 69:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַל יֵ֘בֹ֤שׁוּ בִ֨/י קֹוֶי/ךָ֮ אֲדֹנָ֥/י יְהוִ֗ה צְבָ֫א֥וֹת אַל יִכָּ֣לְמוּ בִ֣/י מְבַקְשֶׁ֑י/ךָ אֱ֝לֹהֵ֗י יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/006.yaml
  text: Let not those who hope in you be put to shame because of me[a], Lord Yahweh of hosts; let not those who seek you be humiliated because of me[b], God of Israel.
translation:
  language: sw
  text: Wale wanaokutumaini[a] wasiaibishwe kwa sababu yangu, Ee Bwana Yahwe wa majeshi[b]; wale wanaokutafuta wasifedheheshwe kwa sababu yangu, Ee Mungu wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanaokungoja.” Neno la Kiebrania linaweza kumaanisha kungoja kwa tumaini lenye matarajio.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “Bwana Yahwe wa majeshi.” Tafsiri nyingine huandika “Bwana MUNGU wa majeshi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: wasiaibishwe
  rationale: Kitenzi בוש hapa kinaeleza kupatwa na aibu au fedheha. Muundo wa Kiswahili wenye maana ya kutendwa unafaa ombi kwamba wengine wasipate aibu kwa sababu ya mwombaji.
- source_word: בִי
  choice: kwa sababu yangu
  rationale: 'Katika muktadha huu בִי ina maana ya kisababishi: mwombaji anaomba asiwe chanzo cha aibu ya wengine. Hii ni ya asili zaidi kuliko tafsiri ya neno kwa neno kama ‘ndani yangu.’'
- source_word: קֹוֶיךָ
  choice: wanaokutumaini
  rationale: Kishirikishi cha קוה kinaweza kumaanisha kungoja kwa matarajio au kutumaini. ‘Wanaokutumaini’ huonyesha tumaini lenye matarajio, huku maana mbadala ya kungoja ikihifadhiwa katika tanbihi.
- source_word: אֲדֹנָי יְהוָה צְבָאוֹת
  choice: Bwana Yahwe wa majeshi
  rationale: ‘Bwana’ huwakilisha אֲדֹנָי, ‘Yahwe’ huhifadhi jina la Mungu יהוה, na ‘wa majeshi’ huhifadhi taswira halisi ya צְבָאוֹת badala ya kuibadili kuwa ‘Mwenyezi.’
- source_word: יִכָּלְמוּ
  choice: wasifedheheshwe
  rationale: כלם inakaribiana na בוש lakini inaweza kusisitiza fedheha. ‘Wasifedheheshwe’ huhifadhi utofauti wa maneno ndani ya usambamba wa kishairi.
- source_word: מְבַקְשֶׁיךָ
  choice: wanaokutafuta
  rationale: Kishirikishi cha בקש kinaonyesha tendo linaloendelea la kumtafuta Mungu; ‘wanaokutafuta’ ni Kiswahili cha kawaida na sahihi.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Hili ni fungu la kumwita Mungu anayehusishwa na Israeli; ‘Ee’ huonyesha wazi matumizi yake kama mwito katika Kiswahili.
theological_decisions:
- issue: Uwakilishaji wa jina יהוה katika mwito אֲדֹנָי יְהוָה
  choice: Bwana Yahwe
  alternative: Bwana MUNGU
  rationale: ‘Yahwe’ huwakilisha moja kwa moja jina la agano יהוה na pia huepuka kuficha tofauti kati ya אֲדֹנָי na יהוה. Tanbihi inataja desturi nyingine ya tafsiri bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Marudio ya ‘kwa sababu yangu’ yamehifadhiwa ili kudumisha usambamba wa kishairi; ‘aibishwe’ na ‘fedheheshwe’ zinatofautisha vitenzi viwili vya Kiebrania.
