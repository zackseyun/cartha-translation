lexical_decisions:
- source_word: תְּהִי
  choice: na iwe
  rationale: Huwasilisha hali ya ombi au tamko la kutakia iliyo katika kitenzi cha Kiebrania, badala ya kulifanya kuwa utabiri wa kawaida.
- source_word: טִירָתָם
  choice: kambi yao
  rationale: Neno hili linaweza kumaanisha kambi au makao yaliyozingirwa; “kambi” huhifadhi picha halisi na ulinganifu wake na “mahema.”
- source_word: נְשַׁמָּה
  choice: ukiwa
  rationale: Hueleza hali ya kuachwa bila watu au kuharibiwa; muundo “iwe ukiwa” ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: בְּאָהֳלֵיהֶם
  choice: katika mahema yao
  rationale: Huhifadhi maana ya moja kwa moja ya אֹהֶל, ingawa katika muktadha wa kishairi inaweza pia kuelekea kwenye maana ya makao.
- source_word: אַל יְהִי
  choice: asiwepo
  rationale: Huwasilisha katazo au ombi hasi la Kiebrania kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: יֹשֵׁב
  choice: mtu wa kukaa
  rationale: Kirai hiki huhifadhi wazo la kitenzi cha kuishi au kukaa mahali, bila kulazimisha nomino ya kudumu kama “mkazi.”
theological_decisions:
- issue: Vitenzi vya kutakia mabaya katika zaburi ya maombolezo
  choice: 'Vimetafsiriwa kama ombi au tamko la kutakia: “na iwe ...; asiwepo ...”'
  alternative: “Kambi yao itakuwa ukiwa; hakuna mtu atakayekaa katika mahema yao.”
  rationale: Miundo ya Kiebrania ina nguvu ya hiari/ombi, si wakati ujao wa kutabiri tu. Tafsiri hii huhifadhi mvutano wa usemi wa kumwomba Mungu bila kuugeuza kuwa taarifa ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. Picha halisi za “kambi” na “mahema” zimehifadhiwa; “na iwe ukiwa” inadumisha nguvu ya kutakia iliyo katika mstari.
