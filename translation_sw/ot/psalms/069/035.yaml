  text: For God will save Zion and build the cities of Judah[b][a], and they will dwell there and possess it.
translation:
  language: sw
  text: Kwa maana Mungu ataiokoa Sayuni na kuijenga miji ya Yuda; nao watakaa humo na kuimiliki[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuirithi” au “kuitwaa iwe milki yao.” Kitenzi cha Kiebrania kinaweza kumaanisha kurithi au kutwaa milki, hasa nchi. Kiambishi chake ni cha kike cha umoja, na huenda kinarejelea Sayuni au nchi inayowakilishwa kama mhusika.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Katika muktadha huu neno hili linatoa msingi au uhakikisho wa tumaini lililotangulia; “Kwa maana” linaonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Kitenzi cha umoja kinaonyesha kwamba hapa neno hili linamtaja Mungu mmoja.
- source_word: יוֹשִׁיעַ
  choice: ataiokoa
  rationale: Hifili ya ישׁע humaanisha kuokoa au kukomboa; wakati ujao unafaa katika muktadha huu wa ahadi.
- source_word: צִיּוֹן
  choice: Sayuni
  rationale: Jina la mahali limehifadhiwa kwa umbo lake lililozoeleka katika Kiswahili.
- source_word: וְיִבְנֶה
  choice: na kuijenga
  rationale: Kitenzi בנה kimsingi ni “kujenga”; “kujenga upya” kungeongeza wazo ambalo halijaelezwa wazi katika Kiebrania.
- source_word: עָרֵי יְהוּדָה
  choice: miji ya Yuda
  rationale: Muundo wa kumilikisha umetafsiriwa moja kwa moja na kwa Kiswahili cha kawaida.
- source_word: וְיָשְׁבוּ שָׁם
  choice: nao watakaa humo
  rationale: ישׁב ina maana ya kukaa au kuishi mahali; “humo” hurejelea kwa kawaida eneo lililotajwa.
- source_word: וִירֵשׁוּהָ
  choice: na kuimiliki
  rationale: ירשׁ inaweza kumaanisha kumiliki, kurithi, au kutwaa milki. “Kuimiliki” ni wazi na huhifadhi lugha ya umiliki wa nchi; kiambishi cha ngeli ya mahali katika Kiebrania kinarejelea kwa uwezekano mkubwa Sayuni au eneo hilo.
theological_decisions:
- issue: Kirejeleo cha kiambishi cha kike cha umoja katika וִירֵשׁוּהָ
  choice: “kuimiliki,” huku kirejeleo kikiachwa kuwa Sayuni au nchi/eneo linalowakilishwa nayo
  alternative: “kuirithi” au “kuitwaa iwe milki yao”
  rationale: Kiebrania kina kiambishi cha kike cha umoja, lakini Kiswahili hakionyeshi jinsia ya kisarufi kwa namna hiyo. Tafsiri haibainishi bila ulazima ikiwa kirejeleo ni Sayuni yenyewe au nchi/eneo linalowakilishwa nayo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Sayuni” na “Yuda” ni maumbo yaliyozoeleka ya majina ya Biblia. Alama ya tanbihi [a] imewekwa mara moja baada ya neno linalohusika.
