  text: תְּֽנָ/ה עָ֭וֺן עַל עֲוֺנָ֑/ם וְ/אַל יָ֝בֹ֗אוּ בְּ/צִדְקָתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/027.yaml
  text: Add iniquity to their iniquity[b][a], and do not let them come into your righteousness.
translation:
  language: sw
  text: 'Uwaongezee uovu juu ya uovu wao[a],

    wala usiwaache waingie katika haki yako[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uwaongezee hatia juu ya hatia yao.” Neno la Kiebrania linaweza kumaanisha uovu, hatia, au matokeo ya hatia.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika tendo lako la haki.” Hapa “haki” ya Mungu inaweza kumaanisha pia hukumu yake ya haki au tendo lake la kuwatetea watu.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּנָה
  choice: Waongezee
  rationale: Kitenzi נתן kimetumiwa kama amri kwa Mungu. Katika muundo huu, “waongezee” huwasilisha maana ya kuweka au kuongeza jambo juu ya jingine, huku kiwakilishi cha wahusika kikieleweka kwa kawaida katika Kiswahili.
- source_word: עָוֺן עַל עֲוֺנָם
  choice: uovu juu ya uovu wao
  rationale: “Uovu” hudumisha urudiaji wa nomino ileile na nguvu ya ombi la hukumu. “Juu ya” huhifadhi taswira ya Kiebrania ya kuweka jambo moja juu ya jingine, bila kuamua ikiwa עָוֺן hapa ni uovu, hatia, au matokeo yake.
- source_word: וְאַל יָבֹאוּ
  choice: wala usiwaache waingie
  rationale: אַל pamoja na kitenzi kisichotimilika huonyesha ombi au katazo hasi. “Usiwaache waingie” ni Kiswahili cha kawaida kinachoonyesha kwamba ombi linaelekezwa kwa Mungu.
- source_word: בְּצִדְקָתֶךָ
  choice: katika haki yako
  rationale: “Haki” katika Kiswahili inaweza kuhusisha unyoofu, uadilifu, na tendo la Mungu la kutenda kwa haki. Hivyo inadumisha upana wa צדקה kuliko kuifafanua moja kwa moja kuwa kukubaliwa, kuokolewa, au kuhesabiwa haki.
theological_decisions:
- issue: Maana ya “haki yako” katika ombi la hukumu
  choice: katika haki yako
  alternative: katika tendo lako la haki
  rationale: Kiebrania kinaweza kurejelea uadilifu wa Mungu, hukumu yake ya haki, au tendo lake la kuwatetea na kuwaokoa watu. Tafsiri kuu inadumisha mvutano huo badala ya kuufunga katika maana moja.
- issue: Maana ya עָוֺן katika ombi la kuongeza
  choice: uovu
  alternative: hatia; adhabu ya uovu
  rationale: Nomino hiyo inaweza kumaanisha uovu wenyewe, hatia inayotokana nao, au matokeo ya hatia. “Uovu” inafuata maana yake ya msingi, huku tanbihi ikihifadhi uwezekano mwingine bila kudai kwamba Mungu anawalazimisha watende dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Urudiaji wa “uovu” umehifadhiwa kwa sababu ni sehemu ya mkazo wa Kiebrania; “haki” imeachwa kuwa pana kitheolojia.
