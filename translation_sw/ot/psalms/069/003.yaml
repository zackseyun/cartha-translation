- source_word: יָגַעְתִּי
  choice: Nimechoka
  rationale: Kitenzi kinaonyesha hali ya uchovu iliyotokana na tendo lililoendelea; kauli hii ni ya kawaida na yenye uzito unaofaa katika kilio cha maombolezo.
- source_word: בְקָרְאִי
  choice: kwa kulia kwangu
  rationale: Katika muktadha huu קרא ni kulia au kuita kwa sauti ili kupata msaada, na ב inaonyesha sababu ya kuchoka.
- source_word: נִחַר
  choice: limekauka
  rationale: Neno hilo linaweza kueleza kukauka, kuwaka, au kuungua kwa joto; likihusishwa na koo, 'limekauka' huhifadhi taswira ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: גְּרוֹנִי
