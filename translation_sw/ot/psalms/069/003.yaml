  alternative: nikimtumainia Mungu wangu
  rationale: Kiebrania kinaweza kuonyesha kungoja kwa matarajio na pia kutumaini. Matini kuu inatumia 'kungoja,' lakini tanbihi inalinda maana nyingine bila kuondoa mvutano wa kimaana.
