- source_word: כָּלוּ עֵינַי
  choice: macho yangu yamedhoofika
  rationale: כלה inaweza kumaanisha kuisha, kudhoofika, au kushindwa; usemi huu unaeleza macho yaliyochoshwa na kungoja bila kuweka maana finyu ya kufifia pekee.
- source_word: מְיַחֵל
  choice: nikimngojea
  rationale: יחל hujumuisha kungoja pamoja na tumaini; 'nikimngojea' hutanguliza hali ya kungoja huku tanbihi ikihifadhi maana ya kutumaini.
- source_word: לֵאלֹהָי
  choice: Mungu wangu
  rationale: Kiambishi cha nafsi kinahifadhi uhusiano wa karibu wa 'Mungu wangu'; kiambishi ל kinaeleweka kiasili kupitia kitenzi 'kumngojea'.
