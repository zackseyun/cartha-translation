  text: וָ/אֶתְּנָ֣/ה לְבוּשִׁ֣/י שָׂ֑ק וָ/אֱהִ֖י לָ/הֶ֣ם לְ/מָשָֽׁל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/011.yaml
  text: I made sackcloth my clothing[b][a], and I became a byword to them.
translation:
  language: sw
  text: 'Nilifanya nguo ya gunia kuwa vazi langu,

    nikawa msemo wa dhihaka kwao.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nikawa methali kwao”—yaani, msemo au mfano uliotumiwa kunidhihaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: Nilifanya ... kuwa
  rationale: Katika muundo huu, kitenzi נתן kina maana ya kuweka au kufanya kitu kiwe katika hali fulani; si kutoa kitu kwa mtu.
- source_word: לְבוּשִׁי
  choice: vazi langu
  rationale: Neno hili linamaanisha kile ambacho mtunga zaburi alivaa; “vazi langu” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: שָׂק
  choice: nguo ya gunia
  rationale: Hili ni vazi au kitambaa kigumu kilichovaliwa wakati wa maombolezo na kujinyenyekeza. “Nguo ya gunia” hudumisha maana hiyo ya kitamaduni.
- source_word: וָאֱהִי
  choice: nikawa
  rationale: 'Kitenzi kinaonyesha matokeo au badiliko la hali: mtunga zaburi akawa kitu kinachotumiwa na watu hao kumdhihaki.'
- source_word: לָהֶם
  choice: kwao
  rationale: Kihusishi kinaonyesha uhusiano na watu waliomfanya mtunga zaburi kuwa msemo wa dhihaka.
- source_word: לְמָשָׁל
  choice: msemo wa dhihaka
  rationale: Katika muktadha wa shutuma na kejeli, מָשָׁל si methali ya hekima isiyo na upande, bali msemo unaotumiwa kumfanya mtu mfano wa kudhihakiwa. Tafsiri hii huweka maana hiyo wazi huku tanbihi ikihifadhi tafsiri ya moja kwa moja zaidi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishairi umehifadhiwa kwa mistari miwili. “Nguo ya gunia” inaeleweka zaidi kwa wasomaji wa kawaida kuliko kutumia “gunia” peke yake kama jina la vazi, na “msemo wa dhihaka” huepuka maana chanya au ya hekima ambayo neno “methali” linaweza kudokeza.
