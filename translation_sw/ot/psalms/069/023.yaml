  text: Let their eyes be darkened from seeing[b][a], and make their loins shake continually.
translation:
  language: sw
  text: Macho yao yatiwe giza, yasiweze kuona,[a] na viuno vyao uvifanye vitetemeke daima.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yasione.”
    reason: lexical_alternative
  - marker: b
    text: Au, “na viuno vyao uviyumbishe daima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּחְשַׁכְנָה
  choice: na yatiwe giza
  rationale: 'Katika muktadha huu umbo la kitenzi lina nguvu ya ombi au laana: macho yao yaingie katika hali ya giza. Kauli hii ya Kiswahili ni ya asili na haibadili ombi kuwa taarifa ya wakati ujao.'
- source_word: עֵינֵיהֶם
  choice: macho yao
  rationale: Huhifadhi moja kwa moja taswira ya viungo vya mwili iliyomo katika Kiebrania.
- source_word: מֵרְאוֹת
  choice: yasiweze kuona
  rationale: Ingawa muundo wa Kiebrania ni kihalisi ‘kutokana na kuona,’ hapa unaonyesha kuzuiwa au kutoweza kuona. Kiswahili hiki kinafikisha maana hiyo kwa kawaida.
- source_word: וּמָתְנֵיהֶם
  choice: na ... viuno vyao
  rationale: מָתְנַיִם hurejelea eneo la kiuno au nyonga. ‘Viuno’ ni neno la kawaida na lenye hadhi linalohifadhi taswira ya udhaifu wa mwili.
- source_word: תָּמִיד
  choice: daima
  rationale: Huonyesha hali inayoendelea bila kukoma na inafaa katika ushairi wa zaburi.
- source_word: הַמְעַד
  choice: uvifanye ... vitetemeke
  rationale: Hifili ya מעד ina maana ya kusababisha kuyumba, kutikisika, au kukosa uthabiti. ‘Uvifanye ... vitetemeke’ huhifadhi nguvu ya usababishaji na ni Kiswahili cha kawaida.
theological_decisions:
- issue: Nguvu ya laana au ombi la hukumu
  choice: 'Kutafsiri kama ombi linaloelekezwa kwa Mungu: ‘na yatiwe ... uvifanye’'
  alternative: 'Kutafsiri kama utabiri: ‘Macho yao yatatiwa giza ... viuno vyao vitatetemeka’'
  rationale: Katika muktadha, maumbo ya vitenzi yanafanya kazi kama ombi la hukumu, si utabiri wa kawaida. Tafsiri inadumisha mkazo huo bila kuupunguza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. ‘Yatiwe giza’ na ‘uvifanye ... vitetemeke’ hudumisha ombi la hukumu, huku tanbihi zikionyesha ukaribu wa muundo wa Kiebrania na maana nyingine ya מעד.
