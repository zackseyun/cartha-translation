  text: You know my reproach[a], my shame, and my humiliation; all my adversaries are before you.
translation:
  language: sw
  text: Wewe unajua suto langu, aibu yangu, na fedheha yangu; adui zangu wote wako mbele zako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: unajua
  rationale: Kitenzi hiki kinamwelekea Mungu moja kwa moja; wakati uliopo unaonyesha kwa Kiswahili cha kawaida kwamba Mungu anafahamu kikamilifu.
- source_word: חֶרְפָּתִי
  choice: aibu yangu
  rationale: Neno hili huonyesha aibu au fedheha inayomletea mtu lawama na dharau ya kijamii; “aibu yangu” ni ya asili na inaeleweka kwa urahisi.
- source_word: בָשְׁתִּי
  choice: fedheha yangu
  rationale: Hurejelea hali ya kuaibishwa au kuvunjiwa heshima. “Fedheha” hutofautisha neno hili na חֶרְפָּה huku ikidumisha mfululizo wa visawe.
- source_word: כְלִמָּתִי
  choice: kudhalilishwa kwangu
  rationale: Neno hili linakazia kuaibishwa na kushushwa hadhi hadharani; umbo hili linahifadhi nguvu ya dhana ya humiliation.
- source_word: נֶגְדְּךָ
  choice: mbele zako
  rationale: Tafsiri hii inaonyesha kuwa wapinzani hao wako wazi machoni pa Mungu na inafaa katika lugha ya sala ya kishairi.
- source_word: כָּל
  choice: wote
  rationale: Kiwakilishi hiki kinaonyesha ujumla wa kundi lote na kinakubaliana kiasili na nomino ya watu iliyo katika wingi.
- source_word: צוֹרְרָי
  choice: watesi wangu
  rationale: Mzizi צרר unaashiria watu wenye uhasama wanaombana au kumtesa mtu. “Watesi” ni neno la sasa na la kishairi linaloonyesha uhasama hai.
