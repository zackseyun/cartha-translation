  text: אֱֽלֹהִ֗ים אַתָּ֣ה יָ֭דַעְתָּ לְ/אִוַּלְתִּ֑/י וְ֝/אַשְׁמוֹתַ֗/י מִמְּ/ךָ֥ לֹא נִכְחָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/005.yaml
  text: God[a], you know my foolishness[b], and my guilt is not hidden from you.
translation:
  language: sw
  text: Ee Mungu, wewe unajua upumbavu wangu, na makosa yangu hayajafichika kwako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na hatia zangu hazikufichika kwako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Ni mwito wa moja kwa moja kwa Mungu katika sala; “Ee Mungu” ni mtindo wa kawaida, wenye heshima na wa kishairi katika Kiswahili.
- source_word: אַתָּה
  choice: wewe
  rationale: Kiwakilishi cha nafsi ya pili kimetajwa wazi katika Kiebrania kwa kusisitiza; “wewe” kinahifadhi msisitizo huo.
- source_word: יָדַעְתָּ
  choice: unajua
  rationale: 'Kitenzi kamilifu cha Kiebrania kina maana ya hali ya sasa hapa: Mungu ana ufahamu kamili wa jambo hilo.'
- source_word: לְאִוַּלְתִּי
  choice: upumbavu wangu
  rationale: Neno hilo humaanisha upumbavu au ujinga wenye lawama ya kimaadili, si upungufu wa akili tu.
- source_word: וְאַשְׁמוֹתַי
  choice: makosa yangu
  rationale: Nomino ya Kiebrania iko katika wingi na hapa inarejelea makosa au mambo yanayomfanya msemaji kuwa na hatia. “Makosa yangu” huhifadhi wingi huo kwa Kiswahili cha kawaida.
- source_word: מִמְּךָ
  choice: kwako
  rationale: Katika nahau ya kufichwa, “kwako” huwasilisha kwa kawaida maana ya kutofichwa kutoka katika ufahamu wa Mungu.
- source_word: לֹא נִכְחָדוּ
  choice: hayajafichika
  rationale: Nifali kamilifu ya כחד humaanisha kuwa yamefichwa au kusitirika; umbo la wingi linapatana na “makosa yangu,” na hali timilifu inaonyesha kwamba hayajawahi kubaki yakiwa yamefichika.
theological_decisions:
- issue: Ungamo la msemaji kuhusu dhambi katika zaburi ambayo baadaye inahusishwa na Masihi katika Agano Jipya
  choice: Aya imetafsiriwa kama ungamo halisi la msemaji kuhusu upumbavu na makosa yake.
  alternative: Kulifanya ungamo kuwa la jumuiya au la kiwakilishi pekee, na si la binafsi.
  rationale: Kiebrania kina kauli dhahiri ya nafsi ya kwanza. Tafsiri inapaswa kuhifadhi sauti na mvutano wa kifungu bila kuingiza suluhisho la kitheolojia katika maneno yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Ee Mungu” linafaa kwa mwito wa sala; “upumbavu” na “makosa” yanaeleweka kwa wasomaji wa kawaida huku yakihifadhi uzito wa kimaadili wa Kiebrania.
