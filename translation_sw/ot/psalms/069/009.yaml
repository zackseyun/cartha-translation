  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּֽי קִנְאַ֣ת בֵּיתְ/ךָ֣ אֲכָלָ֑תְ/נִי וְ/חֶרְפּ֥וֹת ח֝וֹרְפֶ֗י/ךָ נָפְל֥וּ עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/009.yaml
  text: For zeal for your house has consumed me[b][a], and the reproaches of those who reproach you have fallen on me.
translation:
  language: sw
  text: Kwa maana bidii kwa ajili ya nyumba yako imeniteketeza[a], na shutuma za wale wanaokushutumu zimeniangukia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “imenila kabisa.”
    reason: lexical_alternative
  - marker: b
    text: Sehemu ya aya hii inanukuliwa katika Yohana 2:17 ikimhusu Yesu.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huonyesha sababu ya hali ya mtunga zaburi katika muktadha na ni kiunganishi cha kawaida cha maelezo katika Kiswahili.
- source_word: קִנְאַת
  choice: bidii
  rationale: Hapa neno hilo linaonyesha juhudi na moyo wa kujitoa kwa nguvu, si wivu; ‘bidii’ ni ya kawaida na yenye heshima katika Kiswahili.
- source_word: בֵּיתְךָ
  choice: nyumba yako
  rationale: Huhifadhi maana ya moja kwa moja ya Kiebrania bila kuibainisha kupita kiasi kuwa hekalu, ingawa nyumba hiyo inaweza kumaanisha mahali patakatifu.
- source_word: אֲכָלָתְנִי
  choice: imeniteketeza
  rationale: Kitenzi kihalisi ni ‘imenila’; ‘imeniteketeza’ huwasilisha kwa Kiswahili cha asili taswira ya jambo linalomtawala na kummaliza mtu, huku tanbihi ikihifadhi usemi wa moja kwa moja.
- source_word: וְחֶרְפּוֹת
  choice: na shutuma
  rationale: ‘Shutuma’ hutoa maana ya maneno ya lawama na fedheha kwa lugha ya sasa yenye heshima.
- source_word: חֹרְפֶיךָ
  choice: wale wanaokushutumu
  rationale: Huhifadhi uhusiano wa mzizi mmoja na ‘shutuma’ kwa kurudia kitenzi ‘kushutumu,’ kama ilivyo katika Kiebrania.
- source_word: נָפְלוּ עָלַי
  choice: zimeniangukia
  rationale: Ni tafsiri ya karibu na ya kawaida ya taswira ya Kiebrania kwamba shutuma zinazoelekezwa kwa Mungu zimempata mtunga zaburi.
theological_decisions:
- issue: Mwangwi wa Kimasihi na matumizi ya kikanoni
  choice: Aya imetafsiriwa katika sauti yake ya moja kwa moja ya mtunga zaburi, bila kuongeza utambulisho wa Kimasihi katika matini kuu.
  alternative: Kutaja wazi katika matini kuu kwamba aya hiyo inamhusu Yesu.
  rationale: Kiebrania chenyewe kinanena kwa sauti ya mtunga zaburi; matumizi ya Yohana 2:17 yanaonyeshwa katika tanbihi bila kuingizwa katika maneno ya Zaburi.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa tanbihi umewekwa mahali pa mada husika: mbadala wa kileksika baada ya ‘imeniteketeza,’ na rejeo la kikanoni mwishoni mwa aya.'
