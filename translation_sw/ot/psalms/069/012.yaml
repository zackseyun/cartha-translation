  text: Those who sit in the gate talk about me[b][a], and I am the song of those who drink strong drink.
translation:
  language: sw
  text: Wale wanaoketi langoni hunizungumzia[a], nami ni wimbo wa wale wanaokunywa kileo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lango la mji wa kale lilikuwa mahali pa shughuli za umma na utoaji wa hukumu; kwa hiyo maneno haya huenda yanamaanisha kwamba watu wenye ushawishi walimzungumzia hadharani kwa dhihaka.
    reason: cultural_note
lexical_decisions:
- source_word: יָשִׂיחוּ בִי
  choice: hunisema
  rationale: Kitenzi שׂיח pamoja na בִי hapa kinaonyesha kunena kumhusu mtunga zaburi. Katika muktadha huu wa uhasama, “hunisema” ni Kiswahili cha kawaida kinachodokeza kwamba yeye ndiye mada ya mazungumzo bila kuongeza moja kwa moja maana ya “dhidi yangu.”
- source_word: יֹשְׁבֵי שָׁעַר
  choice: wale wanaoketi langoni
  rationale: Tafsiri hii inadumisha picha halisi ya watu wanaoketi kwenye lango la mji bila kuwabainisha isivyohitajika kuwa walinzi au wazee pekee; lango lilikuwa eneo la shughuli za umma na hukumu.
- source_word: וּנְגִינוֹת
  choice: nami ni wimbo
  rationale: 'Nomino ina maana ya nyimbo au muziki. Kishazi cha Kiswahili kinaweka wazi kiima na uhusiano unaodokezwa katika Kiebrania: mtunga zaburi amekuwa mada ya uimbaji wao.'
- source_word: שׁוֹתֵי שֵׁכָר
  choice: wale wanaokunywa kileo
  rationale: שֵׁכָר ni kinywaji chenye kulevya, kwa kawaida tofauti na divai. “Kileo” ni neno la asili na linaloeleweka katika Kiswahili cha sasa, bila kuwalebeli wanywaji moja kwa moja kuwa walevi.
