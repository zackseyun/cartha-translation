  text: כִּֽי אַתָּ֣ה אֲשֶׁר הִכִּ֣יתָ רָדָ֑פוּ וְ/אֶל מַכְא֖וֹב חֲלָלֶ֣י/ךָ יְסַפֵּֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/026.yaml
  text: For they persecute the one you struck[a], and they recount the pain of those you wounded.
translation:
  language: sw
  text: 'Kwa maana wanamwandama yule ambaye wewe umempiga,

    nao husimulia maumivu ya wale uliowajeruhi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maumivu ya wale uliowaua.” Neno la Kiebrania חֲלָלֶיךָ linaweza pia kumaanisha “waliouawa wako” au “wale uliowachoma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza sababu ya ombi la hukumu katika mistari iliyotangulia na kuhifadhi nguvu ya kisababishi.
- source_word: אַתָּה אֲשֶׁר הִכִּיתָ
  choice: yule ambaye wewe umempiga
  rationale: Inatoa yambwa ya umoja inayodokezwa na Kiebrania, huku kiwakilishi ‘wewe’ kikihifadhi msisitizo wa אַתָּה.
- source_word: רָדָפוּ
  choice: wanamwandama
  rationale: ‘Kumwandama’ huonyesha kufuatilia kwa uadui au kwa nia ya kumtesa, na hivyo inafaa katika muktadha wa zaburi hii.
- source_word: וְאֶל
  choice: nao
  rationale: Kihusishi אֶל kinaingiza jambo wanalolisimulia; Kiswahili cha kawaida hakihitaji kukitafsiri kwa neno tofauti mbele ya ‘maumivu.’
- source_word: מַכְאוֹב
  choice: maumivu
  rationale: Ni kisawe cha moja kwa moja kinachofaa sambamba na kupigwa na kujeruhiwa.
- source_word: חֲלָלֶיךָ
  choice: wale uliowajeruhi
  rationale: Neno linaweza kutaja waliojeruhiwa, waliochomwa, au waliouawa. ‘Wale uliowajeruhi’ linaendana vizuri na kutajwa kwa maumivu, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: יְסַפֵּרוּ
  choice: husimulia
  rationale: Kitenzi ספר katika Piel humaanisha kusimulia au kueleza; ‘husimulia’ huhifadhi tendo la kusema kwa kirefu bila kuongeza tafsiri isiyo wazi katika chanzo.
theological_decisions:
- issue: Ikiwa חֲלָלֶיךָ itafsiriwe kuwa waliojeruhiwa au waliouawa
  choice: wale uliowajeruhi
  alternative: wale uliowaua / waliouawa wako; wale uliowachoma
  rationale: Kutajwa kwa ‘maumivu’ kunafaa zaidi kwa waliojeruhiwa ambao bado wanateseka, lakini neno la Kiebrania linaweza pia kumaanisha waliouawa au waliochomwa. Tanbihi inahifadhi uwezekano huo bila kuondoa mvutano wa kifungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. ‘Kumwandama’ ni neno la sasa linaloonyesha ufuatiliaji wa kiuadui bila kulazimisha maana finyu ya kidhehebu.
