base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/015.yaml
  text: Do not let the flood of waters sweep me away[a], and do not let the deep swallow me up[b], and do not let the pit close its mouth over me.
translation:
  language: sw
  text: Mafuriko ya maji yasinifagilie mbali[a], wala kilindi kisinimeze, wala shimo lisifunge kinywa chake juu yangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mkondo wa maji usinichukue.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kisima kisifunge kinywa chake juu yangu.” Neno la Kiebrania linaweza kumaanisha “kisima”; katika muktadha huu wa kishairi, “shimo” linaeleweka zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁטְפֵנִי
  choice: yasinigharikishe
  rationale: Kitenzi שטף kinaonyesha kufunikwa au kuchukuliwa na maji yanayofurika; “kunigharikisha” ni usemi wa kawaida wa Kiswahili unaowasilisha hatari ya kuzamishwa kabisa.
- source_word: שִׁבֹּלֶת מַיִם
  choice: mafuriko ya maji
  rationale: Kirai hiki kinaweza kumaanisha mkondo wenye nguvu au mafuriko; “mafuriko ya maji” kinahifadhi uzito wa picha ya kishairi bila kuifanya kuwa mkondo wa kawaida.
- source_word: תִּבְלָעֵנִי
  choice: kisinimeze
  rationale: בלע humaanisha “kumeza”; tafsiri hii inadumisha picha hai ya kilindi kama kitu kinachommeza mwombaji.
- source_word: מְצוּלָה
  choice: kilindi
  rationale: Neno hili hurejelea sehemu yenye kina kirefu, hasa ya maji; “kilindi” ni la kishairi lakini linaeleweka katika Kiswahili cha kawaida.
- source_word: תֶּאְטַר
  choice: lisifunge
  rationale: Kitenzi kina maana ya kufunga au kuziba; “kufunga” huambatana kwa kawaida na “kinywa” na kuhifadhi sitiari ya shimo.
- source_word: בְּאֵר
  choice: shimo
  rationale: Ingawa בְּאֵר mara nyingi ni “kisima,” hapa muktadha wa mauti na ulinganifu wa kishairi unaunga mkono “shimo”; uwezekano wa “kisima” umehifadhiwa katika tanbihi.
- source_word: פִּיהָ
  choice: kinywa chake
  rationale: “Kinywa” kinahifadhi uhuishaji wa shimo kama kitu kinachoweza kumfukia au kummeza mtu.
- source_word: עָלַי
  choice: juu yangu
  rationale: Tafsiri hii inaonyesha wazi shimo likifunga uwazi wake juu ya mwombaji.
