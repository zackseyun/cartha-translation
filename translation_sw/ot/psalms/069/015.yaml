  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa marudio “wala ... wala ...” unahifadhi maombi matatu hasi ya Kiebrania. Alama za tanbihi zimewekwa mara tu baada ya sehemu zinazohusika.
