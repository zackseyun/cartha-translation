  text: וְ/זֶ֣רַע עֲ֭בָדָי/ו יִנְחָל֑וּ/הָ וְ/אֹהֲבֵ֥י שְׁ֝מ֗/וֹ יִשְׁכְּנוּ בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/036.yaml
  text: The offspring of his servants will inherit it[b][a], and those who love his name will dwell in it.
translation:
  language: sw
  text: Wazao wa watumishi wake watalirithi[a], na wale wanaolipenda jina lake watakaa humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiambishi katika “watalirithi” kinarejelea Sayuni, yaani jiji lililorejeshwa katika muktadha uliotangulia; wengine hukielewa kwa upana zaidi kuwa nchi au Yerusalemu.
    reason: cross_reference
lexical_decisions:
- source_word: זֶרַע
  choice: Wazao
  rationale: Nomino hii ina maana halisi ya ‘mbegu’ lakini hapa inatumika kwa maana ya pamoja ya watoto na vizazi vinavyofuata. ‘Wazao’ ni ya kawaida na inaendeleza maana hiyo ya pamoja.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Katika muktadha huu wa zaburi na uhusiano na Mungu, ‘watumishi’ huwasilisha maana ya עֶבֶד kwa kawaida bila kusisitiza taasisi ya utumwa.
- source_word: יִנְחָלוּהָ
  choice: watalirithi
  rationale: Kitenzi נחל hapa huonyesha kupokea au kumiliki kama urithi. Kiambishi ‘-li-’ huhifadhi rejeo la kike la Kiebrania, linaloelekea Sayuni katika muktadha uliotangulia.
- source_word: אֹהֲבֵי שְׁמוֹ
  choice: wale wanaolipenda jina lake
  rationale: Tafsiri hii huhifadhi nahau ya kibiblia ya kulipenda jina la Mungu badala ya kuirahisisha kuwa kumpenda Mungu tu.
- source_word: יִשְׁכְּנוּ בָהּ
  choice: watakaa humo
  rationale: שׁכן humaanisha kukaa, kuishi, au kufanya makao. ‘Watakaa humo’ ni ya asili katika Kiswahili na huonyesha kuwa watakaa ndani ya mahali palipotajwa.
theological_decisions:
- issue: Rejeo la viambishi vya kike katika ‘watalirithi’ na ‘watakaa humo’
  choice: Vinarejelea Sayuni, yaani jiji lililorejeshwa katika muktadha wa karibu.
  alternative: Vinaweza kueleweka kwa upana zaidi kuwa nchi au Yerusalemu.
  rationale: Muktadha uliotangulia unasema Mungu ataiokoa Sayuni na kuijenga miji ya Yuda. Hivyo umoja wa kike unaelekea kwa kawaida kwa Sayuni/jiji, lakini tafsiri haitaji jina hilo moja kwa moja na hivyo haiufungi kabisa uwezekano mpana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi inayofaa zaburi. ‘Wazao’ na ‘watumishi’ ni maneno yanayoeleweka kwa urahisi; ‘kulipenda jina lake’ huhifadhi nahau ya chanzo.
