lexical_decisions:
- source_word: שְׁפָךְ
  choice: Mwaga
  rationale: Kitenzi cha amri kinaendeleza taswira halisi ya kumimina ghadhabu, huku kikisikika kwa kawaida katika Kiswahili cha sasa.
- source_word: עֲלֵיהֶם
  choice: juu yao
  rationale: Kinaonyesha ghadhabu ikielekezwa dhidi yao; ‘juu yao’ ni usemi wa kawaida na unaohifadhi taswira ya kumimina.
- source_word: זַעְמֶךָ
  choice: ghadhabu yako
  rationale: ‘Ghadhabu’ inaonyesha hasira nzito ya hukumu na kuitofautisha na fungu linalofuata linalotumia nahau nyingine ya hasira.
- source_word: וַחֲרוֹן אַפְּךָ
  choice: na hasira yako inayowaka
  rationale: Nahau ya Kiebrania ina wazo la joto au kuwaka kwa hasira. Tafsiri hii inadumisha taswira hiyo kwa Kiswahili kinachoeleweka.
- source_word: יַשִּׂיגֵם
  choice: iwapate
  rationale: Kitenzi hiki kinaweza kumaanisha kufikia, kukamata, au kumkuta anayefuatwa. ‘Iwapate’ ni cha asili katika Kiswahili na kinaonyesha hasira hiyo ikiwafikia walengwa.
theological_decisions:
- issue: Ombi la hukumu ya Mungu dhidi ya maadui
  choice: Kudumisha ombi la moja kwa moja kwamba ghadhabu ya Mungu imwagwe juu yao na iwapate.
  alternative: Kulainisha kuwa ombi la Mungu aonyeshe tu kutopendezwa nao.
  rationale: Kiebrania kina ombi wazi na kali la hukumu ya Mungu. Tafsiri inadumisha mvutano huo wa kiteolojia bila kuupunguza wala kuufafanua kwa mtazamo wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ghadhabu’ na ‘hasira inayowaka’ zinatunza tofauti ya maneno mawili ya Kiebrania na nguvu ya lugha ya maombi ya hukumu.
