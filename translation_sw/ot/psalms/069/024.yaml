  text: Pour out your indignation on them[b][a], and let your burning anger overtake them.
translation:
  language: sw
  text: Mwaga ghadhabu yako[a] juu yao, na hasira yako inayowaka[b] iwapate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hasira yako.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mwako wa pua yako,” nahau ya Kiebrania inayomaanisha hasira kali.
