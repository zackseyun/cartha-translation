  text: וַ/אֲנִ֤י תְפִלָּתִֽ/י לְ/ךָ֨ יְהוָ֡ה עֵ֤ת רָצ֗וֹן אֱלֹהִ֥ים בְּ/רָב חַסְדֶּ֑/ךָ עֲ֝נֵ֗/נִי בֶּ/אֱמֶ֥ת יִשְׁעֶֽ/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/013.yaml
  text: But as for me[a], my prayer is to you, O Yahweh, at a time of favor; O God, in the abundance of your steadfast love[b], answer me in the truth of your salvation.
translation:
  language: sw
  text: Lakini mimi, sala yangu ni kwako, ee Yahweh, wakati wa kibali[a]. Ee Mungu, kwa wingi wa upendo wako wa kudumu, nijibu kwa ukweli wa wokovu wako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakati unaokubalika.” Kirai cha Kiebrania humaanisha wakati unaofaa kwa Mungu kusikia na kutenda.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa uaminifu wa wokovu wako.” Neno la Kiebrania אֱמֶת linaweza kumaanisha “ukweli” au “uaminifu/utegemewaji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Lakini mimi
  rationale: Kiunganishi pamoja na kiwakilishi huru huonyesha utofautishaji na msisitizo; “Lakini mimi” huhifadhi nguvu hizo kwa Kiswahili cha kawaida.
- source_word: תְפִלָּתִי לְךָ
  choice: sala yangu ni kwako
  rationale: Nomino תְפִלָּה ni “sala,” na לְךָ humtaja anayeelekezewa sala. Kitenzi “ni” huongezwa ili sentensi iwe ya asili katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania linatoholewa kama “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: עֵת רָצוֹן
  choice: wakati wa kibali
  rationale: Kirai hiki humaanisha wakati unaokubalika au unaofaa kwa Mungu kusikia na kutenda; “wakati wa kibali” huhifadhi maana ya wakati na neema inayotolewa.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Hapa ni mwito wa moja kwa moja unaorudia kumwita Mungu; “Ee” huonyesha wazi hali hiyo kwa Kiswahili.
- source_word: בְּרָב חַסְדֶּךָ
  choice: kwa wingi wa upendo wako thabiti
  rationale: בְּרָב huonyesha msingi au wingi, naye חֶסֶד hubeba wazo la upendo wa kudumu, uaminifu na rehema. Tafsiri hii ni wazi bila kuifanya istilahi kuwa ya kimadhehebu.
- source_word: עֲנֵנִי
  choice: unijibu
  rationale: Hii ni amri/ombi la moja kwa moja la kujibiwa katika muktadha wa sala.
- source_word: בֶּאֱמֶת יִשְׁעֶךָ
  choice: kwa ukweli wa wokovu wako
  rationale: אֱמֶת inaweza kuwa “ukweli” au “uaminifu/uhakika.” Tafsiri kuu huhifadhi “ukweli,” huku tanbihi ikihifadhi uwezekano wa “uaminifu.” יֶשַׁע inaweza kuwa wokovu au ukombozi; “wokovu” hapa haiondoi maana ya kuokolewa katika dhiki.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; “Yahweh” hulihifadhi kwa utohozi unaokubalika.
- issue: Maana ya אֱמֶת inapohusishwa na wokovu
  choice: ukweli
  alternative: uaminifu
  rationale: Neno la Kiebrania linaweza kueleza ukweli au uaminifu/utegemewaji. Maandishi makuu yanahifadhi maana ya moja kwa moja, na tanbihi inaonyesha maana nyingine inayowezekana bila kuondoa mvutano wa kifasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa mwito “ee Yahweh / Ee Mungu” na urudiaji wa “wako” huhifadhi mwendo wa sala ya Kiebrania. Alama za tanbihi zimewekwa karibu na maneno yanayohusika.
