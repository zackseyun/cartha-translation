  text: וְ/אַל תַּסְתֵּ֣ר פָּ֭נֶי/ךָ מֵֽ/עַבְדֶּ֑/ךָ כִּֽי צַר לִ֝֗/י מַהֵ֥ר עֲנֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/017.yaml
  text: And do not hide your face from your servant[a], for I am in distress[b]; answer me quickly.
translation:
  language: sw
  text: Wala usiufiche uso wako mbele ya mtumishi wako[a], kwa maana niko katika dhiki; unijibu upesi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ‘mtumwa wako.’ Neno la Kiebrania linaweza kumaanisha mtumishi au mtumwa kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַל
  choice: Wala usi-
  rationale: Kiunganishi וְ kinaendeleza ombi lililotangulia, na אַל pamoja na kitenzi kisichotimilika huleta katazo. Kiswahili ‘wala usi-’ kinaunganisha ombi hilo kwa kawaida bila kuingiza tofauti isiyokuwapo.
- source_word: תַּסְתֵּר
  choice: usinifiche
  rationale: Kitenzi סתר humaanisha kuficha au kusitiri. Pamoja na ‘uso,’ ‘usinifiche uso wako’ huhifadhi picha ya Kiebrania ya Mungu kunyima upendeleo au uangalifu wake.
- source_word: פָּנֶיךָ
  choice: uso wako
  rationale: Tafsiri halisi ‘uso wako’ imehifadhiwa ili kudumisha taswira ya kishairi na ya uhusiano; katika muktadha huu inaweza kumaanisha kuwapo kwa Mungu, uangalifu wake, au fadhili zake.
- source_word: מֵעַבְדֶּךָ
  choice: mimi mtumishi wako
  rationale: עבד inaweza kuwa mtumishi au mtumwa. Katika sala hii, ‘mtumishi wako’ huonyesha unyenyekevu na kumilikiwa kwa ajili ya huduma bila kusisitiza zaidi hali ya kisheria ya utumwa.
- source_word: כִּי
  choice: kwa maana
  rationale: כִּי inatoa sababu ya ombi. ‘Kwa maana’ hudumisha uhusiano wa kisababishi na sauti yenye hadhi ya kishairi.
- source_word: צַר לִי
  choice: niko katika dhiki
  rationale: Kirai kifupi cha Kiebrania huonyesha hali ya msalmisti ya kubanwa au kutaabika. ‘Niko katika dhiki’ ni Kiswahili cha kawaida, cha heshima, na hudumisha uzito wa ombi.
- source_word: מַהֵר
  choice: upesi
  rationale: Neno hili lina maana ya kuharakisha au kutenda bila kuchelewa. ‘Upesi’ likitumiwa pamoja na ‘unijibu’ huwasilisha uharaka kwa ufupi.
- source_word: עֲנֵנִי
  choice: unijibu
  rationale: Katika muktadha wa sala, ענה humaanisha kujibu. ‘Unijibu’ ni ombi la moja kwa moja na la kawaida kwa Mungu.
theological_decisions:
- issue: Lugha ya kibinadamu kuhusu uhusiano wa Mungu
  choice: Kuhifadhi ‘uso wako’ katika matini kuu
  alternative: Kuwapo kwako
  rationale: ‘Uso’ wa Mungu katika nahau ya Kiebrania unaweza kuonyesha fadhili, uangalifu, na ukaribu wake. Kuhifadhi taswira hii hudumisha kina cha kishairi na kitheolojia bila kuifafanua kwa maana moja tu.
- issue: Maana ya עבד katika uhusiano na Mungu
  choice: mtumishi
  alternative: mtumwa
  rationale: Ingawa עבד inaweza kutaja mtumwa, katika ombi hili la zaburi msisitizo uko katika unyenyekevu, kumilikiwa na Mungu, na huduma. ‘Mtumishi’ ndiyo tafsiri ya kimuktadha iliyo ya kawaida zaidi, huku maana nyingine ikitajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye sauti ya sala iliyo ya sasa na yenye hadhi. Taswira ya Kiebrania ya ‘uso’ imehifadhiwa; ‘niko katika dhiki’ na ‘unijibu upesi’ zinaweka wazi hali na uharaka bila kupanua matini.
