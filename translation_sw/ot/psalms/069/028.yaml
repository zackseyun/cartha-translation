base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/028.yaml
  text: Let them be blotted out of the book of life[b][a], and let them not be written with the righteous.
translation:
  language: sw
  text: Na wafutwe kutoka katika kitabu cha uzima[a], wala wasiandikwe pamoja na wenye haki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitabu cha walio hai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּחוּ
  choice: wafutwe
  rationale: Nifali ya מחה hapa ina nguvu ya ombi au tamani la hukumu; “wafutwe” huhifadhi hali ya kutendwa na taswira ya maandishi.
- source_word: מִסֵּפֶר
  choice: katika kitabu
  rationale: סֵפֶר ni kitabu, hati, au gombo; katika usemi huu “kitabu” ni ya asili na inaendana na kitendo cha kufuta jina katika orodha.
- source_word: חַיִּים
  choice: cha uzima
  rationale: חַיִּים yaweza kumaanisha uzima au walio hai. “Kitabu cha uzima” huhifadhi usemi wa Kiebrania na mwangwi wake mpana bila kuamua ikiwa ni orodha ya walio hai au wokovu wa mwisho.
- source_word: וְעִם
  choice: pamoja na
  rationale: עִם humaanisha “pamoja na/na”; “pamoja na” huonyesha kushirikishwa katika orodha moja na wenye haki.
- source_word: צַדִּיקִים
  choice: wenye haki
  rationale: Hili ni neno la kawaida na lenye heshima kwa watu waadilifu au walio katika haki, bila kuongeza mfumo maalumu wa kiteolojia.
- source_word: אַל יִכָּתֵבוּ
  choice: wala wasiandikwe
  rationale: אַל pamoja na imperfekti huleta ombi hasi; “wasiandikwe” huhifadhi hali ya kutendwa na ulinganifu wa taswira ya kitabu.
theological_decisions:
- issue: Maana ya “kitabu cha uzima” katika zaburi ya laana
  choice: Kudumisha sitiari “kitabu cha uzima” bila kuifafanua kwa mfumo mmoja wa kiteolojia.
  alternative: “kitabu cha walio hai,” yaani orodha ya watu wanaoishi
  rationale: Kiebrania kinakubali maana ya uzima au walio hai, na sitiari inaweza kuwa na mwangwi mpana zaidi. Tafsiri kuu inadumisha mvutano huo, huku tanbihi ikionyesha maana mbadala ya kileksika.
- issue: Nguvu ya kauli ya laana
  choice: 'Kutafsiri vitenzi kama ombi/tamani: “wafutwe… wasiandikwe.”'
  alternative: 'Kauli ya utabiri: “watafutwa… hawataandikwa.”'
  rationale: Katika mfululizo wa maombi ya hukumu, maumbo haya yana nguvu ya jussive, si taarifa tu ya jambo litakalotokea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wafutwe” na “wasiandikwe” huhifadhi ulinganifu wa picha ya kitabu; “wala” huleta ombi hasi la pili kwa mtiririko wa kawaida.
