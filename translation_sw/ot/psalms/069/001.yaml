  text: הוֹשִׁיעֵ֥/נִי אֱלֹהִ֑ים כִּ֤י בָ֖אוּ מַ֣יִם עַד נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/001.yaml
  text: Save me[a], O God, for the waters have come up to my neck.
translation:
  language: sw
  text: 'Ee Mungu, niokoe,

    kwa maana maji yamenifikia shingoni.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “mpaka nafsi.” Neno la Kiebrania nefeshi linaweza kumaanisha “nafsi,” “uhai,” au “mtu mwenyewe”; katika muktadha kama huu linaweza pia kurejelea koo au shingo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעֵנִי
  choice: niokoe
  rationale: Kauli ya kuamuru ya Hifili yenye kiambishi cha nafsi ya kwanza umoja ni ombi la moja kwa moja la kuokolewa; “niokoe” ni ya kawaida, wazi, na inafaa picha ya hatari iliyopo.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Jina hili limetumiwa kama mwito wa moja kwa moja. “Ee Mungu” huhifadhi sauti ya sala yenye dharura kwa Kiswahili cha kawaida na chenye heshima.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya ombi. “Kwa maana” kinafaa mtindo wa kishairi na kinaonyesha uhusiano huo wazi.
- source_word: בָאוּ מַיִם
  choice: maji yamenifikia
  rationale: Kiebrania kinasema kihalisi kwamba maji “yamekuja” mpaka sehemu inayotajwa. Kwa Kiswahili, “yamenifikia” huwasilisha kwa kawaida kupanda kwa maji bila kuongeza wazo la mafuriko ambalo halijasemwa moja kwa moja.
- source_word: עַד נָפֶשׁ
  choice: shingoni
  rationale: Ingawa נֶפֶשׁ inaweza kumaanisha nafsi, uhai, au mtu mwenyewe, katika picha hii ya kuzama inaweza kurejelea koo au shingo. “Shingoni” huonyesha hatari ya kuzama kwa uwazi, huku maana ya kihalisi zaidi ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika picha ya dhiki na kuzama
  choice: 'Maana halisi ya kiungo cha mwili katika muktadha huu: “shingoni”'
  alternative: “mpaka nafsini mwangu” au “mpaka kwenye uhai wangu”
  rationale: Mstari hautoi fundisho mahsusi kuhusu nafsi, bali unatumia picha ya mwili iliyo katika hatari kubwa. Tafsiri “shingoni” huwasilisha picha hiyo kwa Kiswahili cha asili bila kufuta upana wa neno la Kiebrania, ambao unaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sala ulio wa sasa, wenye heshima na unaoeleweka kwa urahisi. Mpangilio wa mistari unahifadhi mshindo wa ombi na sababu yake.
