  text: They gave me poison for my food[c][b][a], and for my thirst they gave me vinegar to drink.
translation:
  language: sw
  text: 'Kwa chakula changu walinipa sumu[a],

    na kwa kiu yangu wakaninywesha siki[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Walitia sumu katika chakula changu.” Neno la Kiebrania lililotafsiriwa “sumu” linaweza kumaanisha dutu yenye sumu au uchungu; kwa mapokeo limetafsiriwa pia “nyongo.”
    reason: lexical_and_syntactic_alternative
  - marker: b
    text: Au, “divai chachu.” Neno la Kiebrania linaweza kumaanisha siki au divai chachu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Walinipa
  rationale: Kitenzi נתן hapa kina maana ya kutoa; nafsi ya kwanza ya mtendewa imeonyeshwa kwa kiambishi -ni-, hivyo “walinipa” ni Kiswahili cha kawaida na sahihi.
- source_word: בְּבָרוּתִי
  choice: kuwa chakula changu
  rationale: בָּרוּת humaanisha chakula au lishe. Kirai hiki kinaweza kueleweka kama kitu kilichotolewa badala ya chakula; “kuwa chakula changu” ni cha asili katika Kiswahili, huku uwezekano wa “katika chakula changu” ukihifadhiwa katika tanbihi.
- source_word: רֹאשׁ
  choice: sumu
  rationale: Katika muktadha huu wa kishairi רֹאשׁ humaanisha dutu yenye sumu au uchungu, si maana yake ya kawaida ya “kichwa.” “Sumu” huwasilisha wazi athari yake bila kuifananisha moja kwa moja na nyongo.
- source_word: וְלִצְמָאִי
  choice: na nilipokuwa na kiu
  rationale: Ingawa muundo wa karibu zaidi ni “kwa kiu yangu,” Kiswahili cha kawaida husema “nilipokuwa na kiu.” Hii inahifadhi hali inayotajwa na kirai cha Kiebrania.
- source_word: יַשְׁקוּנִי
  choice: wakaninywesha
  rationale: Hifili ya שׁקה humaanisha kumpa mtu kitu anywe au kumnywesha; “wakaninywesha” ni fupi, ya kawaida, na inaendeleza simulizi.
- source_word: חֹמֶץ
  choice: siki
  rationale: חֹמֶץ inaweza kuwa siki au divai iliyogeuka kuwa chachu. “Siki” ni neno pana na la kawaida; maana ya “divai chachu” imewekwa katika tanbihi.
theological_decisions:
- issue: Mwangwi wa kifungu hiki katika masimulizi ya mateso ya Yesu katika Injili
  choice: 'Kutafsiri kwanza maana ya maneno ya Kiebrania katika Zaburi yenyewe: “sumu” na “siki.”'
  alternative: Kutumia “nyongo” na “divai chachu” katika matini kuu ili kufuata zaidi istilahi za mapokeo ya Kikristo.
  rationale: Matini kuu haipaswi kulazimishwa kufanana na namna kifungu kinavyohusishwa na masimulizi ya Injili. Hata hivyo, maana mbadala zenye umuhimu wa kimapokeo zimehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Mistari miwili inadumisha ulinganifu wa chakula na kiu bila kutumia msamiati wa kidhehebu.
