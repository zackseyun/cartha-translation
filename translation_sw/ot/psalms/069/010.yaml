translation:
  language: sw
  text: Nililia huku nafsi yangu ikifunga[a], na jambo hilo likawa la kuniletea shutuma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania, kwa karibu: “katika kufunga, nafsi yangu.” Muundo huu unaweza pia kueleweka, “Nililia huku nikifunga,” au kumaanisha kujinyima/kutesa nafsi kwa kufunga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶבְכֶּה
  choice: Nilipolia
  rationale: Kitenzi בכה humaanisha ‘kulia.’ Umbo lenye waw linaunganisha tendo hili na matokeo yanayofuata; ‘nilipolia’ linaonyesha uhusiano huo wa wakati kwa Kiswahili cha kawaida.
- source_word: בַצּוֹם
  choice: huku nikifunga
  rationale: צוֹם ni kufunga, hasa kujinyima chakula. ‘Huku nikifunga’ linaonyesha kwamba kulia kuliambatana na kufunga bila kuongeza wazo lisilokuwamo katika mstari.
- source_word: נַפְשִׁי
  choice: katika nafsi yangu
  rationale: נֶפֶשׁ inaweza kumaanisha nafsi, mtu mwenyewe, uhai, au hamu ya kula kulingana na muktadha. Hapa imedumishwa wazi kama ‘nafsi yangu,’ huku tanbihi ikihifadhi uwezekano mwingine wa kisarufi na kimaana.
- source_word: וַתְּהִי
  choice: jambo hilo likawa
  rationale: היה hapa inaonyesha hali iliyotokana na tendo lililotangulia. ‘Jambo hilo’ linaweka wazi kwamba kinachokuwa fedheha ni kulia na kufunga kulikotajwa.
- source_word: לַחֲרָפוֹת
  choice: fedheha
  rationale: חֲרָפוֹת ni wingi kwa umbo na linaweza kumaanisha shutuma, matukano, au hali ya kudharauliwa. ‘Fedheha’ ni nomino ya jumla ya asili inayowasilisha aibu na dharau katika Kiswahili.
- source_word: לִי
  choice: kwangu
  rationale: לִי humtaja mtu aliyeathiriwa; ‘kwangu’ ni ulinganifu wa moja kwa moja na wa kawaida katika sentensi hii.
theological_decisions:
- issue: Uhusiano wa נַפְשִׁי na kulia au kufunga
  choice: 'Imehusishwa katika maandishi makuu na kulia: ‘nilipolia katika nafsi yangu huku nikifunga.’'
  alternative: ‘Nilipolia huku nikifunga’ au kuelewa kuwa nafsi yangu ndiyo iliyofunga/iliyenyenyekezwa kwa kufunga.
  rationale: Kiebrania ni kifupi na kinaweza kueleweka kwa zaidi ya njia moja. Tafsiri kuu inadumisha neno ‘nafsi’ bila kuingiza kitenzi kama ‘niliinyenyekeza,’ ambacho hakijaandikwa wazi hapa; tanbihi inahifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa lakini yenye hadhi ya kishairi. ‘Nafsi yangu’ imedumishwa kwa sababu ipo wazi katika Kiebrania, na utata wa muundo umeelezwa katika tanbihi.
