  text: But as for me[a], I am afflicted and in pain; O God[c][b], let your salvation set me on high.
translation:
  language: sw
  text: Lakini mimi ni mnyonge na nina maumivu; Ee Mungu, wokovu wako uniweke juu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wokovu wako, Ee Mungu, utaniweka juu.” Kitenzi cha Kiebrania kinaweza kueleweka kuwa ombi au kauli ya wakati ujao.
    reason: alternative_reading
  - marker: b
    text: Kitenzi kilichotafsiriwa “uniweke juu” kinamaanisha kumweka mtu mahali pa juu pasipofikika; hivyo kinaweza pia kumaanisha “unilinde” au “unifanye kuwa salama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Lakini mimi
  rationale: Kiunganishi pamoja na kiwakilishi chenyewe kinaonyesha tofauti yenye mkazo na yaliyotangulia; “Lakini mimi” ni ya kawaida na inaonyesha mkazo huo.
- source_word: עָנִי
  choice: mnyonge
  rationale: Katika Zaburi neno hili mara nyingi humaanisha mtu aliyeshushwa, anayeonewa au aliye katika dhiki, si lazima maskini wa mali. “Mnyonge” linafaa sambamba na hali ya kuwa na maumivu.
- source_word: וְכוֹאֵב
  choice: na nina maumivu
  rationale: Umbo la kitenzi linaeleza hali inayoendelea ya kuumia au kuteseka; usemi huu ni wa kawaida katika Kiswahili na unahifadhi hali ya sasa.
- source_word: יְשׁוּעָתְךָ
  choice: wokovu wako
  rationale: “Wokovu” linahifadhi upana wa maana ya kuokoa au kukomboa, badala ya kuibana kuwa msaada wa muda tu.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Katika muktadha huu ni mwito wa moja kwa moja kwa Mungu ndani ya sala.
- source_word: תְּשַׂגְּבֵנִי
  choice: na uniweke juu, mahali salama
  rationale: Kitenzi kinatoa picha ya kumweka mtu juu pasipofikika na hivyo kumlinda. Tafsiri hii inahifadhi picha ya mahali pa juu huku ikifafanua usalama unaodokezwa.
theological_decisions:
- issue: Nguvu ya kitenzi cha hali isiyotimilika תְּשַׂגְּבֵנִי katika muktadha
  choice: Ombi lenye maana ya “na uniweke juu, mahali salama”
  alternative: 'Kauli ya wakati ujao: “utaniweka juu, mahali salama”'
  rationale: Muktadha wa maombolezo na dua unaunga mkono kusoma kitenzi kama ombi, lakini umbo la Kiebrania pia linaweza kueleweka kama kauli ya wakati ujao. Tanbihi inahifadhi uwezekano huo bila kuondoa mvutano wa kisarufi na kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Ee Mungu” linafaa kwa sala; “mnyonge” huepuka kuifanya עָנִי kuwa umaskini wa mali pekee. Muundo wa ombi ni wa asili katika Kiswahili, huku tanbihi ikihifadhi usomaji wa wakati ujao.
