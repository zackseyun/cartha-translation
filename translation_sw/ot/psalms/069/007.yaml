  text: כִּֽי עָ֭לֶי/ךָ נָשָׂ֣אתִי חֶרְפָּ֑ה כִּסְּתָ֖ה כְלִמָּ֣ה פָנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/007.yaml
  text: For because of you I have borne reproach[b][a]; disgrace has covered my face.
translation:
  language: sw
  text: Maana kwa sababu yako[a] nimevumilia dhihaka; fedheha[b] imeufunika uso wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa ajili yako.”
    reason: lexical_alternative
  - marker: b
    text: Au “aibu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Maana
  rationale: Kiunganishi hiki kinatanguliza maelezo ya sababu ya kutengwa na kuaibishwa kwa mwombaji; “Maana” kinaunganisha aya hii na muktadha wake kwa Kiswahili cha kawaida.
- source_word: עָלֶיךָ
  choice: kwa sababu yako
  rationale: Hapa עַל inaonyesha sababu au jambo linalomhusu Mungu, si mahali. “Kwa sababu yako” ni wazi na hakiongezi wazo kwamba tendo hilo lilifanywa kwa manufaa ya Mungu.
- source_word: נָשָׂאתִי
  choice: nimevumilia
  rationale: Ingawa kitenzi hiki kimsingi ni ‘kubeba,’ pamoja na dhihaka kinaeleza kustahimili mzigo wa fedheha. “Nimevumilia” ni Kiswahili cha asili kinachohifadhi maana hiyo katika muktadha.
- source_word: חֶרְפָּה
  choice: dhihaka
  rationale: Neno hili linaweza kumaanisha shutuma, kejeli, au fedheha ya hadharani. “Dhihaka” linaonyesha hasa kudharauliwa na kutukanwa na wengine bila kulichanganya na כְלִמָּה katika kishazi kinachofuata.
- source_word: כִּסְּתָה
  choice: imeufunika
  rationale: Kitenzi כסה humaanisha ‘kufunika.’ Tafsiri hii inadumisha taswira halisi ya fedheha inayoufunika uso.
- source_word: כְלִמָּה
  choice: fedheha
  rationale: Neno hili hueleza aibu, kuvunjiwa heshima, au kufedheheshwa. “Fedheha” linahifadhi upande wa hadharani wa kuvunjiwa heshima na kulitofautisha na dhihaka.
- source_word: פָנַי
  choice: uso wangu
  rationale: Katika taswira hii פָּנִים ni uso unaofunikwa na fedheha; “uso wangu” ndiyo tafsiri ya moja kwa moja na ya kawaida.
