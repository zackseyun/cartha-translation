  text: רָא֣וּ עֲנָוִ֣ים יִשְׂמָ֑חוּ דֹּרְשֵׁ֥י אֱ֝לֹהִ֗ים וִ/יחִ֥י לְבַבְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/032.yaml
  text: The humble have seen and rejoice[a]; you who seek God[c][b], let your hearts live.
translation:
  language: sw
  text: Wanyenyekevu wameona, nao wanafurahi[a]; ninyi mnaomtafuta Mungu, mioyo yenu na iishi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Walioonewa wameona, nao wanafurahi,” au “Wapole wameona, nao wanafurahi.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “moyo wenu na uishi.” Hii ni tamathali inayomaanisha kupata tena ujasiri, nguvu za ndani, au tumaini.
    reason: cultural_note
lexical_decisions:
- source_word: רָאוּ
  choice: wameona
  rationale: Kitenzi cha Qal timilifu, nafsi ya tatu wingi. Wakati timilifu wa Kiswahili unaonyesha tendo lililotimia ambalo matokeo yake yanaonekana katika kufurahi kwao sasa.
- source_word: עֲנָוִים
  choice: wanyenyekevu
  rationale: Neno hili linaweza kumaanisha wanyenyekevu au wapole, na katika Zaburi mara nyingi pia huwahusu walioonewa au kuteswa. “Wanyenyekevu” huhifadhi maana ya hali ya moyo bila kuondoa uwezekano wa hali yao ya mateso.
- source_word: יִשְׂמָחוּ
  choice: wanafurahi
  rationale: Umbo la Kiebrania linaweza kuonyesha furaha ya sasa au itakayofuata. “Wanafurahi” linaunganisha kwa kawaida kile walichoona na mwitikio wao bila kulazimisha maana ya wakati ujao.
- source_word: דֹּרְשֵׁי אֱלֹהִים
  choice: ninyi mnaomtafuta Mungu
  rationale: Kirai hiki kinatumika kama mwito wa moja kwa moja kwa sababu kinachofuata kina kiambishi cha nafsi ya pili wingi. “Mnaomtafuta” pia huonyesha jitihada endelevu za kumwelekea Mungu.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu neno linamtaja Mungu wa Israeli kwa umoja.
- source_word: וִיחִי לְבַבְכֶם
  choice: mioyo yenu na iishi
  rationale: Huhifadhi taswira ya Kiebrania ya moyo kuishi, huku wingi wa “mioyo” ukiwa wa kawaida kwa Kiswahili wakati kundi linaambiwa. Kauli ya kutakia au kuhimiza inaonyeshwa kwa “na iishi.”
