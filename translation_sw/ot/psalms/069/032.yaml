translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na lugha yenye heshima. Tafsiri imehifadhi mabadiliko kutoka kauli kuhusu wanyenyekevu hadi mwito wa moja kwa moja kwa wanaomtafuta Mungu, pamoja na taswira ya Kiebrania ya moyo kuishi.
