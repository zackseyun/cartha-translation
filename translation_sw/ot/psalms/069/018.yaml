base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/018.yaml
  text: Come near to my soul[a]; redeem it. Because of my enemies[b], ransom me.
translation:
  language: sw
  text: Ukaribie nafsi yangu[a]; uikomboe. Kwa sababu ya adui zangu[b], uniokoe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uhai wangu” au “mimi mwenyewe.” Neno la Kiebrania linaweza kuwa na maana yoyote kati ya hizi kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa ajili ya adui zangu.” Kiebrania kinaweza kueleweka hivyo kwa ukaribu zaidi wa maneno, lakini katika muktadha huu yaelekea maana ni “kwa sababu ya” au “kwa ajili ya hali iliyosababishwa na” adui zangu.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָה
  choice: Njoo karibu
  rationale: Ni amri ya moja kwa moja inayomwomba Mungu asogee karibu; usemi huu ni wa kawaida katika Kiswahili cha sasa na unahifadhi nguvu ya ombi.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: Neno נֶפֶשׁ linaweza kumaanisha nafsi, uhai, au mtu mwenyewe. “Nafsi yangu” inahifadhi taswira ya Kiebrania na uzito wa kihisia, huku tanbihi ikionyesha upana wa maana.
- source_word: גְאָלָהּ
  choice: uikomboe
  rationale: Kitenzi גאל kina wazo la kukomboa au kudai tena kama mkombozi. Kiambishi “-i-” kinarejelea “nafsi,” na hivyo kinahifadhi uhusiano wa kisarufi wa sentensi.
- source_word: לְמַעַן
  choice: Kwa sababu ya
  rationale: Katika muktadha huu adui ndio hali au sababu inayochochea ombi la kuokolewa. Hata hivyo, maana ya kusudi, “kwa ajili ya,” inawezekana kisarufi na imehifadhiwa katika tanbihi.
- source_word: אֹיְבַי
  choice: adui zangu
  rationale: Ni tafsiri ya moja kwa moja, wazi, na ya kawaida ya wingi wenye kiambishi cha nafsi ya kwanza.
- source_word: פְּדֵנִי
  choice: unikomboe kwa fidia
  rationale: Kitenzi פדה huhusu kuachilia au kukomboa kwa fidia. Usemi huu unakitofautisha na גאל katika kishazi kilichotangulia bila kudai aina maalumu ya malipo katika muktadha huu.
theological_decisions:
- issue: Kutofautisha vitenzi viwili vya ukombozi, גאל na פדה
  choice: גאל imetafsiriwa “komboa,” na פדה “komboa kwa fidia.”
  alternative: Kutafsiri vyote kwa “komboa,” au kutafsiri cha pili kwa “okoa.”
  rationale: Kiebrania kinatumia maneno mawili yanayohusiana lakini yasiyofanana. Kuyatofautisha kunahifadhi msisitizo na muundo wa kishairi, bila kuingiza nadharia maalumu ya kitheolojia kuhusu fidia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayofaa kwa ushairi wa maombi. “Nafsi yangu” imehifadhiwa kwa uzito wa kishairi, na “unikomboe kwa fidia” inalinda tofauti ya vitenzi vya Kiebrania.
