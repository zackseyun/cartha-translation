  yaml_path: translation/ot/psalms/069/008.yaml
  text: I have become a stranger to my brothers[b][a], and a foreigner to my mother's sons.
translation:
  language: sw
  text: 'Nimekuwa[a] mgeni kwa ndugu zangu wa kiume,

    na mtu wa nje kwa wana wa mama yangu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nilikuwa” au “nikawa.” Kitenzi cha Kiebrania kinaweza kueleweka kuwa wakati uliopita sahili au kuanza kwa hali hii.
    reason: lexical_alternative
  - marker: b
    text: “Wana wa mama yangu” ni usemi wa kishairi unaorejelea ndugu wa kiume.
    reason: cultural_note
lexical_decisions:
- source_word: מוּזָר
  choice: mgeni
  rationale: Neno hili linaonyesha hali ya kuwa asiye wa kwao au aliyetengwa. “Mgeni” ni neno la kawaida na lenye uzito wa kimahusiano katika muktadha huu.
- source_word: הָיִיתִי
  choice: nimekuwa
  rationale: Kauli ya Kiebrania inaeleza hali iliyotokea na ambayo matokeo yake yanaendelea. “Nimekuwa” huwasilisha vizuri maana hiyo, huku tanbihi ikihifadhi uwezekano wa wakati uliopita sahili.
- source_word: לְאֶחָי
  choice: kwa ndugu zangu wa kiume
  rationale: Kiebrania kinatumia wazi nomino ya wingi ya kiume. Kwa kuwa “ndugu” katika Kiswahili inaweza kumaanisha mwanaume au mwanamke, “wa kiume” huhifadhi taarifa ya kijinsia bila kutumia “kaka,” ambalo mara nyingi humaanisha ndugu wakubwa.
- source_word: וְנָכְרִי
  choice: na mtu wa nje
  rationale: Neno נָכְרִי humaanisha mtu wa kigeni au asiye wa jamii hiyo. “Mtu wa nje” ni Kiswahili cha kawaida kinachoendeleza ulinganifu wa kishairi na “mgeni” bila kurudia neno lilelile.
- source_word: לִבְנֵי אִמִּי
  choice: kwa wana wa mama yangu
  rationale: Hili ndilo tamko la karibu na Kiebrania, nalo huhifadhi picha ya kishairi ya watu wa familia ya karibu sana.
theological_decisions:
- issue: Lugha ya undugu yenye jinsia
  choice: Kuhifadhi “ndugu zangu wa kiume” na “wana wa mama yangu” katika matini kuu
  alternative: “ndugu zangu” au “jamaa zangu”
  rationale: Maneno ya Kiebrania ni ya kiume waziwazi na yanaunda ulinganifu wa kishairi. Tafsiri haiyafanyi ya kijumla bila ushahidi wa muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha na ya kishairi. “Ndugu zangu wa kiume” imetumiwa ili kuepuka utata wa kijinsia wa neno “ndugu,” huku “mtu wa nje” ikihifadhi tofauti ya maneno mawili ya Kiebrania yanayohusiana na ugeni.
