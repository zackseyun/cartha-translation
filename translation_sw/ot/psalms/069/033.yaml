  text: כִּֽי שֹׁמֵ֣עַ אֶל אֶבְיוֹנִ֣ים יְהוָ֑ה וְ/אֶת אֲ֝סִירָ֗י/ו לֹ֣א בָזָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/033.yaml
  text: For Yahweh hears the needy[a], and he does not despise his prisoners.
translation:
  language: sw
  text: Kwa maana Yahwe huwasikiliza wahitaji, wala hawadharau wafungwa wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mateka wake.” Neno la Kiebrania linaweza kumaanisha kwa upana watu waliofungwa, waliowekwa kizuizini, au waliotekwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya mwito uliotangulia wa kumsifu Mungu na kuhifadhi nguvu ya kisababishi kwa Kiswahili cha kawaida.
- source_word: שֹׁמֵעַ אֶל
  choice: huwasikiliza
  rationale: Kauli hii inaeleza tendo la kawaida la Yahwe; “huwasikiliza” inadokeza si kusikia sauti tu, bali pia kuwajali wanaomwomba.
- source_word: אֶבְיוֹנִים
  choice: wahitaji
  rationale: Neno hilo huwahusu walio maskini au wenye uhitaji; “wahitaji” huhifadhi maana pana ya hali ya uhitaji bila kuiwekea mipaka ya kiuchumi pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetolewa moja kwa moja kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: אֲסִירָיו
  choice: wafungwa wake
  rationale: “Wafungwa” huonyesha watu waliofungwa au kuzuiliwa, na “wake” huhifadhi kiambishi cha nafsi ya tatu umoja katika Kiebrania bila kufafanua kupita kiasi aina ya uhusiano wao na Yahwe.
- source_word: לֹא בָזָה
  choice: wala hawadharau
  rationale: Wakati wa mazoea unaendana na kauli ya kwanza na kuwasilisha ukweli wa kudumu kwamba Yahwe hawatendei kwa dharau.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania ina jina maalumu la Mungu; kulitaja kama “Yahwe” huhifadhi marejeo yake ya moja kwa moja bila kulibadili kuwa cheo.
- issue: Maana ya umilikaji katika אֲסִירָיו
  choice: wafungwa wake
  alternative: wafungwa
  rationale: Kiambishi cha Kiebrania kimehifadhiwa kwa “wake,” huku tafsiri ikiepuka kuamua kama ni wafungwa wanaomilikiwa naye, walio wake kwa uhusiano wa agano, au wanaohesabiwa kuwa chini ya uangalizi wake.
- issue: Upeo wa אֲסִיר
  choice: wafungwa
  alternative: mateka
  rationale: “Wafungwa” ni maana pana inayofaa kwa walio kizuizini, lakini “mateka” pia inawezekana ikiwa muktadha unaelekezwa kwa waliotekwa; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini wazi kwa msomaji wa kawaida. Muundo sambamba wa “huwasikiliza ... wala hawadharau” huhifadhi kauli ya tabia ya kudumu katika mstari wa Kiebrania.
