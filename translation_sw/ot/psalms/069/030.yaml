  text: אֲהַֽלְלָ֣ה שֵׁם אֱלֹהִ֣ים בְּ/שִׁ֑יר וַ/אֲגַדְּלֶ֥/נּוּ בְ/תוֹדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/030.yaml
  text: I will praise the name of God with song[a], and I will magnify him with thanksgiving.
translation:
  language: sw
  text: Nitalisifu jina la Mungu kwa wimbo, nami nitamtukuza kwa shukrani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sadaka ya shukrani”; neno la Kiebrania linaweza kumaanisha shukrani au sadaka ya shukrani, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהַלְלָה
  choice: Nitalisifu
  rationale: Kohortativi ya nafsi ya kwanza umoja inaonyesha azimio la hiari; wakati ujao wa Kiswahili unaeleza kwa kawaida azimio hilo katika ushairi.
- source_word: שֵׁם אֱלֹהִים
  choice: jina la Mungu
  rationale: Muundo huu wa wazi huhifadhi kirai cha Kiebrania na uzito wake wa heshima.
- source_word: בְּשִׁיר
  choice: kwa wimbo
  rationale: Kihusishi ב hapa kinaonyesha njia au namna; ‘kwa wimbo’ ni Kiswahili cha kawaida na kinachofaa muktadha wa ibada.
- source_word: וַאֲגַדְּלֶנּוּ
  choice: nami nitamtukuza
  rationale: Kitenzi גדל katika muundo huu humaanisha kumtangaza au kumwonyesha kuwa mkuu. ‘Nitamtukuza’ ni cha kawaida na kinaendana na usambamba wa ‘nitalisifu’; kiambishi cha nafsi ya tatu kinamrejelea Mungu.
- source_word: בְתוֹדָה
  choice: kwa shukrani
  rationale: תּוֹדָה inaweza kumaanisha shukrani au sadaka ya shukrani. Katika usambamba na kusifu na kuimba, maana ya kutoa shukrani kwa maneno ina uwezekano mkubwa zaidi.
theological_decisions:
- issue: Ikiwa תּוֹדָה inamaanisha shukrani ya maneno au sadaka ya shukrani
  choice: shukrani ya maneno
  alternative: sadaka ya shukrani
  rationale: Muktadha wa karibu unahusu matendo ya maneno na muziki—kusifu, kuimba, na kutukuza—hivyo ‘shukrani’ inafaa zaidi, ingawa maana ya sadaka bado inawezekana kiisimu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Nami’ huhifadhi mtiririko na usambamba wa mistari bila kuwa kizito; ‘kutukuza’ ni cha kawaida zaidi kuliko tafsiri halisi ‘kumfanya mkuu.’
