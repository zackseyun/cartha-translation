  text: וְ/תִיטַ֣ב לַֽ֭/יהוָה מִ/שּׁ֥וֹר פָּ֗ר מַקְרִ֥ן מַפְרִֽיס׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/031.yaml
  text: And it will please Yahweh more than an ox[a], a bull with horns and split hooves.
translation:
  language: sw
  text: Hilo litampendeza Yahweh kuliko ng’ombe, fahali mwenye pembe na kwato zilizogawanyika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hilo litakuwa bora kwa Yahweh kuliko ng’ombe, fahali.” Kiebrania kinalinganisha sifa na shukrani za mstari uliotangulia na fahali mwenye pembe na kwato zilizogawanyika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתִיטַב
  choice: Hilo litampendeza
  rationale: Kitenzi יטב hapa kina maana ya kuwa jambo la kupendeza au kukubalika kwa Yahweh. “Hilo” linarejelea sifa na shukrani za mstari uliotangulia bila kuongeza nomino isiyokuwapo katika mstari huu.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetolewa moja kwa moja kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: מִשּׁוֹר
  choice: kuliko ng’ombe
  rationale: 'Baada ya יטב, kihusishi מִן kinaonyesha ulinganisho: sifa na shukrani vinampendeza Yahweh kuliko mnyama wa dhabihu.'
- source_word: פָּר
  choice: fahali
  rationale: פָּר humfafanua ng’ombe huyo kuwa fahali. Alama ya dashihurefu inadumisha uhusiano wa ufafanuzi kati ya שׁוֹר na פָּר bila kuzifanya kuwa wanyama wawili.
- source_word: מַקְרִן
  choice: mwenye pembe
  rationale: Umbo hili linaeleza fahali aliyekomaa na mwenye pembe; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: מַפְרִיס
  choice: na kwato zilizogawanyika
  rationale: Neno linaeleza mnyama mwenye kwato zilizopasuka au kugawanyika, sifa ya mnyama safi anayefaa kutolewa dhabihu.
theological_decisions:
- issue: Ulinganisho wa sifa na dhabihu
  choice: litampendeza Yahweh kuliko ng’ombe
  alternative: litakuwa bora mbele za Yahweh kuliko ng’ombe
  rationale: Muundo wa Kiebrania unaweza kusemwa kwa maana ya “kuwa bora” au “kupendeza zaidi.” Tafsiri iliyochaguliwa inaonyesha wazi kwamba Yahweh ndiye anayepokea sifa hiyo, huku tanbihi ikihifadhi uwezekano wa usemi mwingine.
- issue: Jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Kutumia “Yahweh” kunahifadhi jina binafsi la Mungu lililo katika maandishi ya Kiebrania na kulitofautisha na cheo cha kawaida.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa urahisi. “Ng’ombe—fahali” huhifadhi uradidi wa ufafanuzi wa Kiebrania, na “kwato zilizogawanyika” ni wazi zaidi kwa msomaji wa sasa kuliko istilahi ya kitaalamu.
