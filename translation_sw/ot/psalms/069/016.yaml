  text: עֲנֵ֣/נִי יְ֭הוָה כִּי ט֣וֹב חַסְדֶּ֑/ךָ כְּ/רֹ֥ב רַ֝חֲמֶ֗י/ךָ פְּנֵ֣ה אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/016.yaml
  text: Answer me[a], O Yahweh, for your steadfast love is good; according to your abundant mercies, turn to me.
translation:
  language: sw
  text: Ee Yahwe, unijibu, kwa maana upendo wako wa kudumu ni mwema; kwa kadiri ya wingi wa huruma zako, unielekee.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kwa kadiri ya wingi wa huruma zako, ugeuke unielekee.”'
    reason: Mbadala huu huonyesha uwezekano wa kusoma כְּרֹב רַחֲמֶיךָ pamoja na ombi linalofuata, sambamba na tanbihi ya audit trail ya Kiingereza, bila kubadili wingi wa “huruma zako.”
lexical_decisions:
- source_word: עֲנֵנִי
  choice: unijibu
  rationale: Kitenzi cha amri ענה katika sala ni ombi kwamba Mungu ajibu. “Unijibu” ni usemi wa kawaida na wa heshima katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina la kibinafsi lililo katika Kiebrania.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inatoa sababu ya ombi. “Kwa maana” huhifadhi uhusiano huo wa kisababishi na mtindo wa kishairi wa sala.
- source_word: טוֹב
  choice: ni mwema
  rationale: טוֹב ni kivumishi kinachoeleza sifa ya חֶסֶד ya Mungu. “Ni mwema” huhifadhi maana ya moja kwa moja ya wema bila kuibadili kuwa sifa nyingine.
- source_word: חַסְדֶּךָ
  choice: upendo wako mwaminifu
  rationale: חֶסֶד huunganisha upendo na uaminifu wa kudumu katika uhusiano. “Upendo wako mwaminifu” ni wa sasa na unaeleweka, huku ukihifadhi vipengele hivyo viwili.
- source_word: כְּרֹב
  choice: kwa wingi wa
  rationale: 'Muundo כְּ pamoja na רֹב unaonyesha kipimo au msingi wa ombi: “kwa kadiri ya wingi wa.” “Kwa wingi wa” ni Kiswahili fasaha na kifupi chenye maana hiyo.'
- source_word: רַחֲמֶיךָ
  choice: huruma zako
  rationale: רַחֲמִים ni umbo la wingi linaloweza kumaanisha huruma nyingi au wingi wa rehema. “Huruma zako” huhifadhi umbo la wingi na wazo la moyo wa rehema.
- source_word: פְּנֵה אֵלַי
  choice: unielekee
  rationale: Amri פנה pamoja na אֶל humwomba Mungu ageuke kumwelekea mwombaji. “Unielekee” ni usemi wa asili unaohifadhi mwelekeo wa kiuhusiano wa maneno hayo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Ee Yahwe
  alternative: Ee BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina יהוה. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana pana ya חֶסֶד
  choice: upendo wako mwaminifu
  alternative: fadhili zako
  rationale: “Upendo wako mwaminifu” huhifadhi upendo pamoja na uaminifu wa kudumu unaodokezwa na חֶסֶד. “Fadhili” linawezekana, lakini linaweza kutoweka wazi kipengele cha upendo wa uaminifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sala ulio wa heshima, wa sasa, na unaoeleweka kwa wasomaji wa kawaida. Sentensi imehifadhi usambamba wa kishairi na mpangilio wa hoja wa Kiebrania.
