  yaml_path: translation/ot/psalms/069/034.yaml
  text: Let heaven and earth praise him[c][b][a], the seas and everything that moves in them.
translation:
  language: sw
  text: Mbingu na dunia zimsifu[a], bahari[b] na kila kiumbe kinachosogea ndani yazo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “Mbingu na dunia na zimsifu.” Kitenzi cha Kiebrania kinaweza kusomwa kama mwito au ombi; wengine hukisoma kwa maana ya utabiri: “Mbingu na dunia zitamsifu.”'
    reason: alternative_reading
  - marker: b
    text: Kiebrania ni “bahari” kwa wingi; katika Kiswahili, “bahari” huwa na umbo lilelile katika umoja na wingi.
    reason: lexical_alternative
  - marker: c
    text: Au “kila kiumbe kinachotambaa ndani yazo.” Neno la Kiebrania linaweza kumaanisha viumbe wanaosogea, wanaotambaa, au wanaosongamana kwa wingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהַלְלוּהוּ
  choice: zimsifu
  rationale: Kitenzi cha wingi chenye kiambishi cha yambwa cha nafsi ya tatu umoja kinahifadhi maana ya ‘kumsifu yeye.’ Hali ya utegemezi katika Kiswahili inafaa kwa mwito wa kishairi wa kusifu.
- source_word: שָׁמַיִם
  choice: mbingu
  rationale: ‘Mbingu’ ni neno la kawaida la Kiswahili linaloweza kuonyesha wingi wa Kiebrania na linaunda jozi ya kishairi iliyozoeleka pamoja na ‘dunia.’
- source_word: וָאָרֶץ
  choice: na dunia
  rationale: ‘Dunia’ hapa inaonyesha ulimwengu mzima katika jozi ‘mbingu na dunia,’ si eneo fulani la nchi.
- source_word: יַמִּים
  choice: bahari
  rationale: Katika Kiswahili, ‘bahari’ huwa na umbo lilelile katika umoja na wingi; muktadha wa orodha ya viumbe unaruhusu maana ya wingi ya Kiebrania.
- source_word: וְכָל רֹמֵשׂ
  choice: na kila kiumbe kinachosogea
  rationale: Kirai hiki kinaonyesha kwa kawaida viumbe vinavyosonga, kutambaa, au kujaa kwa makundi. ‘Kiumbe kinachosogea’ ni cha asili katika muktadha wa bahari na hakifungi maana kwa wanyama watambaao tu.
- source_word: בָּם
  choice: ndani yazo
  rationale: Kiambishi ‘-zo’ kinarejelea bahari kwa wingi na hivyo kuhifadhi wazi kiwakilishi cha wingi cha Kiebrania.
theological_decisions:
- issue: Nguvu ya kitenzi cha mwito wa kusifu
  choice: Mwito wa kishairi kwa mbingu, dunia, bahari, na viumbe vya baharini kumsifu Mungu
  alternative: Kauli ya kutabiri kwamba mbingu na dunia zitamsifu
  rationale: Umbo la kitenzi cha Kiebrania linaweza kusikika kama jussive, na muktadha unapendelea mwito wa kusifu. Tanbihi huhifadhi uwezekano wa kusoma kauli hiyo kama ombi au utabiri.
- issue: Upeo wa uumbaji unaoitwa kusifu
  choice: Mbingu, dunia, bahari, na viumbe vyote vinavyosogea baharini vinajumuishwa
  alternative: Kurejelea wanyama watambaao pekee
  rationale: רֹמֵשׂ ina upeo mpana wa viumbe vinavyosonga, kutambaa, au kujaa; muktadha wa bahari haupaswi kufinywa kuwa viumbe watambaao wa nchi kavu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Zimsifu’ ni mwito mfupi na wa asili; ‘ndani yazo’ huhifadhi urejeo wa wingi wa Kiebrania. Alama zote za tanbihi zimewekwa katika matini kuu.
