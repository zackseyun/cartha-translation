base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/022.yaml
  text: May their table before them become a trap[a], and for their well-being a snare.
translation:
  language: sw
  text: 'Meza yao iliyo mbele yao iwe tanzi,

    na ustawi wao uwe mtego.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na wanapokuwa salama, iwe mtego.” Kiebrania kinaweza pia kudokeza “sadaka zao za amani.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי
  choice: na iwe
  rationale: Kauli ya matamanio inaonyesha ombi la hukumu; “na iwe” ni ya kawaida na yenye uzito katika Kiswahili.
- source_word: שֻׁלְחָנָם
  choice: meza ... yao
  rationale: Neno hilo humaanisha meza halisi, ingawa hapa linaweza kuwakilisha chakula, karamu, au riziki; taswira halisi imehifadhiwa.
- source_word: לִפְנֵיהֶם
  choice: iliyo mbele yao
  rationale: Huhifadhi maana ya mahali na kejeli kwamba kitu kilicho wazi mbele yao kinakuwa hatari.
- source_word: לְפָח
  choice: tanzi
  rationale: פח ni kifaa cha kunasia. “Tanzi” hutofautisha neno hili na מוֹקֵשׁ huku ikihifadhi usambamba wa kishairi.
- source_word: וְלִשְׁלוֹמִים
  choice: na ustawi wao
  rationale: שְׁלוֹמִים inaweza kueleza hali njema, usalama, au ustawi. Hii inafaa na kejeli ya jambo jema kugeuka chombo cha hukumu, huku uwezekano wa maana ya sadaka ukihifadhiwa katika tanbihi.
- source_word: לְמוֹקֵשׁ
  choice: uwe mtego
  rationale: מוֹקֵשׁ kwa kawaida ni mtego au tanzi. “Mtego” huhifadhi tofauti ndogo kati ya maneno mawili ya kunasia.
theological_decisions:
- issue: Maana ya שְׁלוֹמִים katika ombi la hukumu
  choice: ustawi wao
  alternative: sadaka zao za amani; au, wanapokuwa salama
  rationale: Muundo wa Kiebrania ni mgumu na unaweza kueleweka kwa maana ya hali njema au kwa mwangwi wa sadaka za amani. Matini kuu inatumia maana pana ya ustawi bila kuondoa maana nyingine inayowezekana, ambayo imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. Mistari miwili inahifadhi usambamba wa kishairi na tofauti kati ya “tanzi” na “mtego.”
