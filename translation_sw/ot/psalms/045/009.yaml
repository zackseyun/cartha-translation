  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo unahifadhi taswira ya jumba la kifalme na utata wa kirai בְּיִקְּרוֹתֶיךָ umeelezwa katika tanbihi.
