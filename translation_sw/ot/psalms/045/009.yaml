base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/009.yaml
  text: Daughters of kings are among your honored women[b][a]; at your right hand stands the queen in gold of Ophir.
translation:
  language: sw
  text: Mabinti wa wafalme wamo miongoni mwa wanawake wako wa heshima[a]; malkia amesimama upande wako wa kulia, akiwa amepambwa kwa dhahabu ya Ofiri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwa watu wako wa thamani” au “miongoni mwa wanawake wako mashuhuri.” Kirai cha Kiebrania ni kigumu.
    reason: lexical_alternative
  - marker: b
    text: “Dhahabu ya Ofiri” ni dhahabu bora iliyohusishwa na Ofiri, mahali palipojulikana katika Agano la Kale kwa utajiri na dhahabu yake.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנוֹת מְלָכִים
  choice: Mabinti wa wafalme
  rationale: Tafsiri ya moja kwa moja inayohifadhi taswira ya Kiebrania; neno ‘mabinti’ hapa linaweza kurejelea wanawake wa kifalme.
- source_word: בְּיִקְּרוֹתֶיךָ
  choice: miongoni mwa wanawake wako waheshimiwa
  rationale: Kirai hiki ni kigumu, lakini mzizi יקר una wazo la kuwa wa thamani au kuheshimiwa. Muktadha wa wanawake wa kifalme unaunga mkono rejeo kwa wanawake mashuhuri badala ya fahari zisizo watu.
- source_word: נִצְּבָה
  choice: amesimama
  rationale: Kauli hii inaonyesha kwamba malkia amechukua nafasi yake na yupo hapo katika mandhari ya kifalme.
- source_word: שֵׁגַל
  choice: malkia
  rationale: Neno hilo humaanisha mwenzi wa kifalme wa mfalme; ‘malkia’ ni neno la kawaida na la asili katika Kiswahili.
- source_word: לִימִינְךָ
  choice: mkono wako wa kulia
  rationale: Hii ni tafsiri ya kawaida ya nafasi ya heshima iliyo upande wa kulia wa anayezungumziwa.
- source_word: בְּכֶתֶם אוֹפִיר
  choice: akiwa amepambwa kwa dhahabu ya Ofiri
  rationale: כֶּתֶם ni dhahabu safi au bora, na Ofiri ni mahali ilikohusishwa nayo. ‘Amepambwa kwa’ huwasilisha kwa Kiswahili cha asili maana ya kuwa katika mapambo ya dhahabu bila kubadili taswira.
