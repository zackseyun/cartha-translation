  text: אַזְכִּ֣ירָה שִׁ֭מְ/ךָ בְּ/כָל דֹּ֣ר וָ/דֹ֑ר עַל כֵּ֥ן עַמִּ֥ים יְ֝הוֹדֻ֗/ךָ לְ/עֹלָ֥ם וָ/עֶֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/017.yaml
  text: I will cause your name to be remembered in every generation[b][a]; therefore the peoples will praise you forever and ever.
translation:
  language: sw
  text: Nitalifanya jina lako likumbukwe[a] katika kila kizazi; kwa hiyo mataifa yatakusifu[b] milele na milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nitalitaja jina lako” au “Nitalikumbuka jina lako.” Kitenzi cha Kiebrania kina muundo wa kusababisha, kikidokeza tendo la kulidumisha jina katika kumbukumbu.
    reason: lexical_alternative
  - marker: b
    text: Au, “watakushukuru.” Kitenzi cha Kiebrania kinaweza kumaanisha kusifu au kushukuru, hasa katika ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַזְכִּירָה
  choice: Nitalifanya ... likumbukwe
  rationale: 'Kauli ya Hifili ya זכר ina nguvu ya kusababisha: msemaji atasababisha jina likumbukwe, si kulikumbuka moyoni tu. Hii ni Kiswahili cha asili kinachohifadhi maana hiyo.'
- source_word: שִׁמְךָ
  choice: jina lako
  rationale: Tafsiri ya moja kwa moja na ya kawaida; katika muktadha inaweza pia kuwakilisha sifa, umaarufu na kumbukumbu ya mhusika bila kufafanua zaidi ya maandishi.
- source_word: בְּכָל דֹּר וָדֹר
  choice: katika kila kizazi
  rationale: Nahau ya Kiebrania ina maana ya mfululizo wa vizazi; kauli hii huhifadhi maana ya ugawaji kwa kila kizazi na ni ya kawaida kwa Kiswahili.
- source_word: עַל כֵּן
  choice: kwa hiyo
  rationale: Inaonyesha matokeo au hitimisho linalotokana na tendo la kulidumisha jina katika kumbukumbu.
- source_word: עַמִּים
  choice: mataifa
  rationale: Nomino ya Kiebrania ni wingi na inaelekea kurejelea makundi mengi ya watu. 'Mataifa' ni tafsiri ya asili na inayoeleweka katika ushairi wa kibiblia.
- source_word: יְהוֹדֻךָ
  choice: watakusifu
  rationale: Hifili ya ידה katika Zaburi mara nyingi hujumuisha kusifu au kushukuru. 'Watakusifu' inafaa zaidi katika muktadha huu, huku 'watakushukuru' ikibaki kuwa maana mbadala halali.
- source_word: לְעוֹלָם וָעֶד
  choice: milele na milele
  rationale: Usemi huu wenye jozi unasisitiza kudumu bila mwisho; tafsiri hii ni ya kawaida na huhifadhi msisitizo huo.
theological_decisions:
- issue: Mhusika anayerejelewa na viwakilishi vya nafsi ya pili katika zaburi hii ya harusi ya kifalme
  choice: Kuhifadhi usemi wa moja kwa moja wa nafsi ya pili bila kumtambulisha mhusika zaidi ya maandishi
  alternative: Kumfafanua kuwa mfalme wa ukoo wa Daudi au kuwa Masihi anayetimiza zaburi hii kwa namna ya kiishara
  rationale: Mstari unamwambia mhusika 'jina lako' na 'watakusifu.' Ingawa muktadha wa kifalme na matumizi ya kikanoni yanaweza kuleta usomaji wa Kimasihi, tafsiri haipaswi kulazimisha mojawapo; usemi wa moja kwa moja huhifadhi uwazi na mvutano wa kitheolojia wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo wa kusababisha umehifadhiwa kwa 'Nitalifanya ... likumbukwe'; 'mataifa' hudumisha wingi wa עַמִּים. Alama zote za tanbihi zimewekwa katika matini kuu karibu na maneno yanayohusika.
