  text: and the king will desire your beauty[a], for he is your lord[b]; bow down to him.
translation:
  language: sw
  text: Na mfalme atautamani uzuri wako[a], kwa maana yeye ndiye bwana wako; msujudie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na mfalme autamani uzuri wako”; umbo la Kiebrania linaweza kueleweka kuwa taarifa ya wakati ujao au kuwa tamko la kutakia au kuhimiza.
    reason: lexical_alternative
  - marker: b
    text: Au, “mtolee heshima.” Kitenzi hiki kinaweza kumaanisha kuinama kwa heshima mbele ya mkuu, iwe katika mazingira ya kifalme au ya kidini. Wengine hutafsiri, “mwabudu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִתְאָו
  choice: Naye ... atautamani
  rationale: Kitenzi cha Kiebrania kinaweza kueleweka kama taarifa ya wakati ujao, na katika muktadha huu tafsiri hiyo inafuata usomaji wa moja kwa moja huku tanbihi ikihifadhi uwezekano wa maana ya kutakia au kuhimiza.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino yenye uainisho; katika Kiswahili 'mfalme' hutoa maana hiyo kwa kawaida katika muktadha.
- source_word: יָפְיֵךְ
  choice: uzuri wako
  rationale: Hutaja uzuri au mvuto wa mwanamke anayesemeshwa; hii ndiyo tafsiri ya moja kwa moja na ya kawaida.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu ya kauli inayotangulia na inafaa kwa mtindo wa kishairi.
- source_word: הוּא
  choice: yeye ndiye
  rationale: Huhifadhi msisitizo wa kiwakilishi huru cha Kiebrania.
- source_word: אֲדֹנַיִךְ
  choice: bwana wako
  rationale: Ni jina la uhusiano lenye kiambishi cha nafsi ya pili umoja wa kike; hapa si jina la Mungu, hivyo 'bwana' linaandikwa kwa herufi ndogo.
- source_word: וְהִשְׁתַּחֲוִי
  choice: msujudie
  rationale: Kitenzi kinaonyesha kuinama au kujitupa chini kwa heshima mbele ya aliye mkuu. 'Msujudie' ni Kiswahili cha kawaida kinachohifadhi tendo la heshima bila kulazimisha kwamba ni ibada ya kidini.
- source_word: לוֹ
  choice: -ie (yeye)
  rationale: Kiambishi cha mtendewa katika 'msujudie' kinawakilisha kwa kawaida maana ya 'kwake/yeye' bila kurudia kiwakilishi.
theological_decisions:
- issue: Iwapo וְהִשְׁתַּחֲוִי לוֹ itafsiriwe kwa lugha iliyo wazi kuwa ya ibada ya kidini
  choice: msujudie
  alternative: mpe heshima kwa kumsujudia; mwabudu
  rationale: Zaburi 45 ni wimbo wa harusi ya kifalme, na kitenzi cha Kiebrania kinaweza kumaanisha kusujudu mbele za Mungu au mbele ya mkuu wa kibinadamu. 'Msujudie' huhifadhi kitendo na utata huo bila kuamua kwamba heshima hiyo lazima iwe ya kidini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. 'Naye' huunganisha mstari na muktadha uliotangulia; 'kwa maana' hudumisha uhusiano wa sababu. Herufi ndogo katika 'bwana' huepuka kuifanya kuwa jina la Mungu bila msingi wa lazima katika Kiebrania.
