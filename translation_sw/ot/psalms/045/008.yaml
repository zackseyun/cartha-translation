  text: מֹר וַ/אֲהָל֣וֹת קְ֭צִיעוֹת כָּל בִּגְדֹתֶ֑י/ךָ מִֽן הֵ֥יכְלֵי שֵׁ֝֗ן מִנִּ֥י שִׂמְּחֽוּ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/008.yaml
  text: All your garments are fragrant with myrrh[a], aloes, and cassia; from ivory palaces[e][d][c][b], stringed instruments have made you glad.
translation:
  language: sw
  text: Mavazi yako yote yananukia manemane, udi na mdalasini; kutoka katika majumba ya pembe za ndovu, vyombo vya muziki vimekufurahisha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hakitaji kiima cha kitenzi cha wingi “vimekufurahisha.” Huenda kikamaanisha muziki, wanamuziki, au vyombo vya muziki; “vyombo vya muziki” ni tafsiri ya kimuktadha. Pia, “kutoka katika majumba ya pembe za ndovu” yaweza kueleweka “ndani ya,” “kutoka nje ya,” au kwa maana nyingine inayohusiana na majumba hayo.
    reason: alternative_reading
lexical_decisions:
- source_word: מֹר
  choice: manemane
  rationale: Hili ni jina la kawaida la Kiswahili la utomvu wenye harufu nzuri unaotumiwa kama manukato.
- source_word: וַאֲהָלוֹת
  choice: udi
  rationale: Katika muktadha huu neno linamaanisha mti wenye harufu nzuri (agarwood), si mmea wa mshubiri; “udi” ni neno la kawaida na sahihi katika Kiswahili cha Afrika Mashariki.
- source_word: קְצִיעוֹת
  choice: mdalasini
  rationale: Neno linataja gome lenye harufu la jamii ya cassia; “mdalasini” huwasilisha kiungo hicho kwa lugha inayoeleweka kwa wasomaji wa kawaida.
- source_word: כָּל בִּגְדֹתֶיךָ
  choice: Mavazi yako yote yananukia
  rationale: Kiebrania hakina kitenzi katika kishazi hiki na kinaweka manukato karibu na mavazi. Tafsiri hii huonyesha kwa Kiswahili cha kawaida kwamba mavazi yana harufu ya manukato hayo, bila kudokeza kuwa yametengenezwa kwa viungo hivyo.
- source_word: מִן הֵיכְלֵי שֵׁן
  choice: kutoka katika majumba ya pembe za ndovu
  rationale: Katika zaburi hii ya kifalme, הֵיכָל inafaa kueleweka kama majumba au kumbi za kifalme, na שֵׁן humaanisha pembe za ndovu.
- source_word: מִנִּי
  choice: kutoka katika
  rationale: Kihusishi hiki ni kigumu hapa. Kukitafsiri kwa maana ya chanzo au mahali kunatoa sentensi yenye kueleweka, huku tanbihi ikihifadhi kutokuwa na uhakika kwa muundo wote wa kishazi.
- source_word: שִׂמְּחוּךָ
  choice: umekufurahisha
  rationale: Kitenzi hiki kinamaanisha ‘wamekufurahisha’ au ‘wamekufanya ufurahi’; kwa kuwa Kiswahili hutumia “muziki” kama nomino ya umoja, upatanisho wa umoja umetumiwa.
- source_word: implicit subject of שִׂמְּחוּךָ
  choice: muziki
  rationale: Kiebrania hakitaji wazi mtendaji wa kitenzi cha wingi. “Muziki” ni hitimisho la kimuktadha linaloeleweka vizuri kwa Kiswahili, lakini si sehemu iliyoandikwa wazi katika maandishi ya Kiebrania; hivyo kutokuwa na uhakika kumeelezwa katika tanbihi.
theological_decisions:
- issue: Muktadha wa kifalme au wa Kimasihi wa Zaburi 45
  choice: Kutafsiri mstari katika mazingira yake ya moja kwa moja ya sherehe ya kifalme bila kuongeza maneno ya wazi ya Kimasihi.
  alternative: Kutumia phrasing iliyoathiriwa moja kwa moja na usomaji wa baadaye wa Kimasihi.
  rationale: Mstari wenyewe unaeleza mavazi yenye manukato, majumba ya kifalme na furaha ya sherehe. Tafsiri haipaswi kuingiza moja kwa moja maana ya kitipolojia au ya Kimasihi ambayo haijaelezwa katika maneno ya mstari huu.
- issue: Mtendaji asiyeelezwa wa שִׂמְּחוּךָ
  choice: Kutumia “muziki” katika matini na kueleza kutokuwa na uhakika katika tanbihi.
  alternative: “Vyombo vya muziki,” “wanamuziki,” au kudumisha kiima kisichotajwa kwa muundo usio wa kawaida wa Kiswahili.
  rationale: Kitenzi cha Kiebrania ni cha wingi lakini hakina kiima kilichoandikwa. Muktadha unaruhusu muziki, wanamuziki au vyombo; uchaguzi wa “muziki” ni wa kimuktadha, si dai kwamba Kiebrania linataja muziki waziwazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Udi” huepuka kuchanganya manukato ya mti wenye harufu na mmea wa mshubiri. Tanbihi moja imekusanya utata unaohusiana wa kishazi cha mwisho; alama yake [a] imo katika matini kuu.
