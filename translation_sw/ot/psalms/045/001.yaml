  yaml_path: translation/ot/psalms/045/001.yaml
  text: My heart overflows with a good word[a]; I say[c][b], “My work is for the king.” My tongue is the pen of a skillful scribe.
translation:
  language: sw
  text: Moyo wangu unafurika kwa neno jema[a]; nasema, “Kazi yangu ni kwa ajili ya mfalme[b].” Ulimi wangu ni kalamu ya mwandishi stadi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mada ya kupendeza” au “jambo adhimu.” Kifungu cha Kiebrania kinaweza kurejelea maneno yenyewe au jambo linaloelezwa.
    reason: lexical_alternative
  - marker: b
    text: Au “inahusu mfalme” au “inaelekezwa kwa mfalme.” Kihusishi cha Kiebrania kinaweza kuonyesha kwamba kazi imewekwa wakfu kwake, inamhusu, au inaelekezwa kwake.
    reason: lexical_alternative
  - marker: c
    text: Au “mwandishi aliye tayari” au “mwandishi mwepesi.” Kivumishi cha Kiebrania kinaweza kusisitiza wepesi au utayari, na pia ustadi uliopatikana kwa mazoezi.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָחַשׁ
  choice: unafurika
  rationale: Kitenzi hiki huonyesha kitu kinachochemka au kububujika kutoka ndani. “Unafurika” kinadumisha taswira ya maneno yanayojitokeza kwa wingi moyoni na ni cha kishairi lakini kinaeleweka.
- source_word: לִבִּי
  choice: moyo wangu
  rationale: Hii ni tafsiri ya kawaida ya moyo kama kitovu cha mawazo na hisia, bila kuifafanua kupita kiasi.
- source_word: דָּבָר טוֹב
  choice: neno jema
  rationale: דבר linaweza kumaanisha neno, jambo, au mada. “Neno jema” linahifadhi umbo pana la Kiebrania, huku maana nyingine zinazowezekana zikitolewa katika tanbihi.
- source_word: אֹמֵר אֲנִי
  choice: nasema
  rationale: Ni usemi rahisi na wa asili unaodumisha maana ya Kiebrania bila kuamua kwamba ni kukariri au kutangaza rasmi.
- source_word: מַעֲשַׂי
  choice: kazi yangu
  rationale: Katika muktadha huu wa utunzi wa kishairi, neno huenda likarejelea kazi aliyotunga mtunga-zaburi. “Kazi yangu” ni pana vya kutosha bila kulazimisha “shairi” au “matendo.”
- source_word: לְמֶלֶךְ
  choice: kwa ajili ya mfalme
  rationale: Kihusishi לְ kinaweza kuonyesha kuwekwa wakfu, mada, au anayeelekezewa maneno. “Kwa ajili ya mfalme” kinasikika kwa kawaida katika wimbo wa kifalme, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: לְשׁוֹנִי
  choice: ulimi wangu
  rationale: Taswira halisi ya kiungo cha mwili inadumishwa kwa sababu ni muhimu kwa ushairi wa mstari huu.
- source_word: עֵט
  choice: kalamu
  rationale: “Kalamu” ndilo neno la sasa na linaloeleweka zaidi kwa chombo cha kuandikia, bila kuifanya picha ya kale kuwa ngumu.
- source_word: סוֹפֵר
  choice: mwandishi
  rationale: Katika Kiswahili cha kawaida, “mwandishi” huwasilisha kwa uwazi mtu mwenye ustadi wa kuandika; “mwandishi wa hati” lingekuwa maalumu zaidi lakini zito katika mstari huu wa kishairi.
- source_word: מָהִיר
  choice: stadi
  rationale: Kivumishi hiki kinaweza kusisitiza wepesi, utayari, au ujuzi uliozoeleka. “Stadi” kinaonyesha uandishi wenye ufasaha, huku maana ya utayari au wepesi ikitajwa katika tanbihi.
