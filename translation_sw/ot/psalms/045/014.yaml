  yaml_path: translation/ot/psalms/045/014.yaml
  text: In embroidered garments she is led to the king[a]; virgins behind her, her companions[c][b], are brought to you.
translation:
  language: sw
  text: Akiwa amevaa mavazi ya tarizi, anaongozwa kwa mfalme[a]; mabikira[b] walio nyuma yake, rafiki zake, wanaletwa kwako[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Katika kazi ya tarizi, analetwa kwa mfalme.”
    reason: lexical_alternative
  - marker: b
    text: “Mabikira” pia inaweza kutafsiriwa “wanawali” au “wanawake vijana,” lakini neno la Kiebrania hasa linamaanisha wanawake ambao hawajaolewa na ni mabikira.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania cha “kwako” ni cha nafsi ya pili, umoja, jinsia ya kike, hivyo huenda mshairi sasa anamwambia bibi-arusi moja kwa moja. Tafsiri nyingine hulainisha badiliko hilo na kulielekeza kwa mfalme.
    reason: alternative_reading
lexical_decisions:
- source_word: לִרְקָמוֹת
  choice: Akiwa amevaa mavazi yenye tarizi
  rationale: Neno רְקָמוֹת linamaanisha kazi ya tarizi au kitambaa kilichopambwa kwa tarizi. Neno “mavazi” limeongezwa kwa uwazi kutokana na muktadha wa maandamano ya harusi.
- source_word: תּוּבַל
  choice: anaongozwa
  rationale: Hii ni kauli tendwa ya יבל, “kuleta/kuongoza.” Katika maandamano ya harusi, “anaongozwa” linaonyesha vizuri mwendo wa sherehe huku likihifadhi kauli tendwa.
- source_word: לַמֶּלֶךְ
  choice: kwa mfalme
  rationale: Kihusishi ל kinaonyesha mwelekeo; “kwa mfalme” ni usemi wa kawaida wa Kiswahili unaohifadhi maana hiyo.
- source_word: בְּתוּלוֹת
  choice: mabikira
  rationale: Neno hili hasa linataja wanawake vijana ambao hawajaolewa na ni mabikira. “Mabikira” linahifadhi umahususi wa Kiebrania kuliko “wanawake vijana.”
- source_word: אַחֲרֶיהָ
  choice: walio nyuma yake
  rationale: Katika muktadha wa maandamano, usemi huu unaonyesha mahali na mpangilio wa wale wanaomfuata bibi-arusi.
- source_word: רֵעוֹתֶיהָ
  choice: wenzi wake
  rationale: Neno hili humaanisha wenzi au rafiki. “Wenzi wake” linahifadhi uhusiano bila kuwalazimishia cheo maalumu cha wahudumu wa bibi-arusi.
- source_word: מוּבָאוֹת
  choice: wanaletwa
  rationale: Hii ni kauli tendwa ya בוא inayowarejelea mabikira au wenzi. “Wanaletwa” ni tafsiri ya moja kwa moja na ya asili katika Kiswahili.
- source_word: לָךְ
  choice: kwako
  rationale: Kiambishi hiki ni nafsi ya pili, umoja, jinsia ya kike. “Kwako” kinahifadhi badiliko la ghafla kutoka kumwelezea bibi-arusi hadi kusema naye moja kwa moja, ingawa jinsia haionekani katika kiwakilishi cha Kiswahili.
theological_decisions:
- issue: Badiliko la anayesemeshwa katika kiwakilishi לָךְ
  choice: Kuhifadhi nafsi ya pili kwa kusema “kwako,” yaani, kumwelekea bibi-arusi moja kwa moja.
  alternative: Kulainisha sentensi iwe “wanaletwa kwake,” “wanaletwa kwa mfalme,” au “wanaletwa pamoja naye.”
  rationale: Maandishi ya Kimasora yana kiambishi cha nafsi ya pili, umoja, jinsia ya kike. Tafsiri inahifadhi mvutano huu wa kishairi badala ya kuubadili ili mfalme awe anayesemeshwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Tarizi” ni neno mahsusi na la kawaida kwa mapambo yanayoshonwa kwenye kitambaa. Muundo wa kauli tendwa na badiliko la mwisho la anayesemeshwa vimehifadhiwa.
