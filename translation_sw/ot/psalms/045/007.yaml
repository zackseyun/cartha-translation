  text: אָהַ֣בְתָּ צֶּדֶק֮ וַ/תִּשְׂנָ֫א רֶ֥שַׁע עַל כֵּ֤ן מְשָׁחֲ/ךָ֡ אֱלֹהִ֣ים אֱ֭לֹהֶי/ךָ שֶׁ֥מֶן שָׂשׂ֗וֹן מֵֽ/חֲבֵרֶֽי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/007.yaml
  text: You have loved righteousness and hated wickedness[a]; therefore God, your God[b], has anointed you with the oil of gladness beyond your companions.
translation:
  language: sw
  text: Umependa haki na umechukia uovu; kwa hiyo Mungu, Mungu wako,[a] amekupaka mafuta ya furaha kuliko wenzako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa hiyo, ee Mungu, Mungu wako amekupaka mafuta ya furaha kuliko wenzako.” Neno la kwanza “Mungu” linaweza kueleweka kuwa mwito badala ya kuwa kiima cha kitenzi.
    reason: alternative_reading
  - marker: b
    text: Mstari huu unanukuliwa katika Waebrania 1:9.
    reason: cross_reference
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: Umependa
  rationale: Kauli timilifu ya nafsi ya pili umoja inaeleza msimamo thabiti wenye umuhimu wa sasa; wakati timilifu wa Kiswahili unafaa katika usemi huu wa moja kwa moja.
- source_word: צֶּדֶק
  choice: haki
  rationale: Neno hili linahusu lililo sawa na la haki; ‘haki’ ni la kawaida, lenye uzito wa kimaadili, na linafaa katika muktadha wa kifalme.
- source_word: וַתִּשְׂנָא
  choice: na kuchukia
  rationale: Muundo huu unaratibu kitendo cha pili na cha kwanza kwa Kiswahili cha asili, huku mhusika yuleyule akibaki wazi.
- source_word: רֶשַׁע
  choice: uovu
  rationale: Huwakilisha ubaya wa kimaadili na huunda tofauti iliyo wazi na ‘haki’.
- source_word: עַל כֵּן
  choice: kwa hiyo
  rationale: Ni kiunganishi cha kawaida kinachoonyesha matokeo yanayotokana na upendo wa haki na chuki ya uovu.
- source_word: מְשָׁחֲךָ
  choice: amekupaka mafuta
  rationale: Huhifadhi picha halisi ya upakaji mafuta wa kifalme au wa kuwekwa wakfu badala ya kutumia tu istilahi ya kidini iliyofupishwa.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: 'Katika matini kuu limechukuliwa kuwa kiima cha kitenzi: ‘Mungu, Mungu wako’; uwezekano wa kuwa neno la kumwita anayezungumziwa umehifadhiwa katika tanbihi.'
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Ni tafsiri ya moja kwa moja ya umbo lenye kiambishi cha nafsi ya pili umoja, likifafanua ‘Mungu’ wa kwanza.
- source_word: שֶׁמֶן שָׂשׂוֹן
  choice: mafuta ya furaha
  rationale: Huhifadhi mnyororo wa nomino wa Kiebrania na picha ya mafuta yanayohusishwa na shangwe na heshima.
- source_word: מֵחֲבֵרֶיךָ
  choice: kuliko wenzako
  rationale: Kiambishi מן hapa ni cha ulinganisho; ‘kuliko’ huwasilisha wazi kwamba anayesemeshwa ameinuliwa kwa kiwango kinachowapita wenzake.
theological_decisions:
- issue: Sintaksia na uzito wa kitheolojia wa אֱלֹהִים katika kishazi cha upakaji mafuta
  choice: Mungu, Mungu wako, amekupaka mafuta
  alternative: Ee Mungu, Mungu wako amekupaka mafuta
  rationale: Kiebrania kinaruhusu אֱלֹהִים ya kwanza kueleweka ama kama kiima ama kama neno la kumwita anayezungumziwa. Matini kuu inafuata usomaji wa kiima unaoendana kwa urahisi na kitenzi cha mstari huu, lakini tanbihi inalinda usomaji wa mwito bila kuondoa mvutano wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. ‘Kupaka mafuta’ huhifadhi taswira ya Kiebrania, na ‘wenzako’ ni ya kawaida kuliko istilahi nzito zaidi.
