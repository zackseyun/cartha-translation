base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/004.yaml
  text: In your majesty ride on victoriously for the cause of truth and meekness and righteousness[b][a]; let your right hand teach you awesome deeds.
translation:
  language: sw
  text: Katika fahari yako, songa mbele kwa ushindi, ukipigania kweli, upole na haki; na mkono wako wa kuume ukufundishe matendo ya kutisha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na mkono wako wa kuume utakufundisha mambo ya kuogofya.” Kiebrania kinaweza kueleweka kama taarifa ya wakati ujao badala ya agizo, na נוֹרָאוֹת inaweza kuwa “mambo ya kuogofya” badala ya “matendo ya kutisha.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲדָרְךָ
  choice: Katika fahari yako
  rationale: הָדָר humaanisha fahari, utukufu au heshima. Muundo huu unaunganisha fahari ya mfalme na kusonga kwake mbele bila kulazimisha kiunganishi cha Kiebrania kutafsiriwa kwa neno tofauti.
- source_word: צְלַח רְכַב
  choice: songa mbele kwa ushindi
  rationale: צְלַח inaweza kumaanisha kufanikiwa au kusonga kwa mafanikio, nayo רְכַב ni kupanda na kwenda. Katika muktadha wa kifalme na kivita, tafsiri hii inadumisha mwendo na ushindi; tendo la kupanda mnyama au gari halijatajwa wazi kwa sababu Kiswahili 'panda' huhitaji kitu kinachopandwa.
- source_word: עַל דְּבַר אֱמֶת
  choice: ukipigania kweli
  rationale: דְּבַר hapa yaweza kuwa jambo au kusudi. 'Ukipigania kweli' huonyesha kwamba mfalme anasonga kwa ajili ya kweli katika muktadha wa shujaa wa kifalme.
- source_word: וְעַנְוָה צֶדֶק
  choice: upole na haki
  rationale: 'Maneno עַנְוָה na צֶדֶק yamehifadhiwa kama dhana mbili zinazoratibiwa: upole na haki. Hii huepuka kuyafanya kimya kimya kuwa kirai kimoja kama ''haki ya unyenyekevu.'''
- source_word: וְתוֹרְךָ
  choice: na ukufundishe
  rationale: Kitenzi cha Hiphil מן ירה ni 'kufundisha' au 'kuonyesha.' Umbo la nafsi ya tatu ya kike linapatana na 'mkono' katika Kiebrania; Kiswahili kinatumia agizo la nafsi ya tatu ili kuhifadhi nguvu ya kishairi.
- source_word: נוֹרָאוֹת
  choice: matendo ya kutisha
  rationale: נוֹרָאוֹת ni mambo yanayoleta hofu au kicho. 'Matendo ya kutisha' huhifadhi uzito wa hofu kuliko 'matendo ya ajabu,' huku muktadha ukionyesha kuwa ni matendo yenye nguvu.
- source_word: יְמִינֶךָ
  choice: mkono wako wa kuume
  rationale: Taswira halisi ya mkono wa kuume imehifadhiwa kwa kuwa inaashiria nguvu, ustadi na ushindi wa mfalme.
theological_decisions:
- issue: Taswira ya mfalme-shujaa katika zaburi inayosomwa pia kwa maana ya Kimasihi
  choice: Kuhifadhi hotuba ya moja kwa moja kwa mfalme bila kuongeza wazi utambulisho wa Kimasihi.
  alternative: Kutaja Masihi au Kristo moja kwa moja katika mstari.
  rationale: Mstari wenyewe unatumia lugha ya kishairi ya kifalme. Tafsiri inadumisha maana yake ya karibu na kuacha matumizi mapana ya kikanoni yatokane na muktadha wa Maandiko.
- issue: Muundo wa וְעַנְוָה צֶדֶק
  choice: upole na haki
  alternative: haki yenye upole; unyenyekevu wa haki
  rationale: Kiebrania ni kifupi na kinaweza kueleweka kwa zaidi ya njia moja. Kutaja nomino mbili kwa uratibu kunadumisha mvutano huo bila kuingiza uhusiano wa kisarufi usio wazi.
- issue: Nguvu ya וְתוֹרְךָ
  choice: 'agizo/ombi: ''na ukufundishe'''
  alternative: 'taarifa ya wakati ujao: ''utakufundisha'''
  rationale: Kitenzi kinaweza kueleweka kama mwendelezo wa maagizo yaliyotangulia au kama taarifa. Muktadha wa maamrisho unaunga mkono Kiswahili cha agizo, huku uwezekano mwingine ukiwekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. 'Songa mbele kwa ushindi' ni cha asili kuliko kutaja kupanda bila kitu kinachopandwa; 'mkono wa kuume' huhifadhi taswira ya Biblia.
