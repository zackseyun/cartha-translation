  yaml_path: translation/ot/psalms/045/003.yaml
  text: Strap your sword on your thigh[a], mighty warrior[b], in your splendor and your majesty.
translation:
  language: sw
  text: Jifunge upanga wako pajani, ewe shujaa,[a] katika fahari yako na adhama yako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ewe mwenye nguvu.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hakina neno linalolingana moja kwa moja na “katika.” Pia yaweza kutafsiriwa, “fahari yako na adhama yako,” ikiwa maneno hayo yamesimama kama ufafanuzi wa kishairi.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲגוֹר
  choice: Jifungie
  rationale: Amri hii ina maana ya kufunga au kujifunga silaha mwilini. “Jifungie” ni Kiswahili cha kawaida kinachoonyesha kwa uwazi tendo la kuvaa upanga kwa kuufunga.
- source_word: חַרְבְּךָ
  choice: upanga wako
  rationale: Ni nomino yenye kiambishi cha nafsi ya pili ya kiume umoja, ikimaanisha moja kwa moja upanga wa anayeambiwa.
- source_word: עַל יָרֵךְ
  choice: pajani
  rationale: Huhifadhi picha halisi ya upanga uliofungwa juu ya paja, badala ya kuipanua kuwa “ubavuni.”
- source_word: גִּבּוֹר
  choice: ewe shujaa
  rationale: Neno limetumiwa kama mwito kwa mtu mwenye nguvu na ushujaa katika muktadha wa kivita. “Shujaa” ni la asili na lenye hadhi katika Kiswahili.
- source_word: הוֹדְךָ
  choice: fahari yako
  rationale: הוֹד huonyesha uangavu, utukufu au fahari ya kifalme. “Fahari” inafaa katika muktadha huu na haitangamani kabisa na maana ya neno linalofuata.
- source_word: וַהֲדָרֶךָ
  choice: na adhama yako
  rationale: הדר humaanisha adhama, fahari au uzuri wa kifalme. “Adhama” huhifadhi sajili ya juu na ulinganifu wa kishairi.
theological_decisions:
- issue: Anayeambiwa ni mfalme/shujaa na uwezekano wa usomaji wa Kimasihi
  choice: Mstari umetafsiriwa kama mwito wa moja kwa moja kwa shujaa wa kifalme bila kumtaja wazi kuwa Masihi.
  alternative: Kuufanya utambulisho wa Kimasihi uwe wazi katika tafsiri yenyewe.
  rationale: Kiebrania cha mstari huu kinamwambia moja kwa moja mtu wa kifalme mwenye ushujaa, lakini hakimtambulishi wazi hapa kuwa Masihi. Tafsiri inaacha uhusiano mpana wa kikanoni na wa Kimasihi kwa tafsiri ya msomaji.
- issue: Uhusiano wa הוֹדְךָ וַהֲדָרֶךָ na amri iliyotangulia
  choice: Maneno hayo yametafsiriwa kwa kiunganishi kinachodokezwa, “katika fahari yako na adhama yako.”
  alternative: Kuyasoma kama maneno ya ufafanuzi yasiyo na “katika,” au kama yanayohusishwa kwa karibu na upanga.
  rationale: Kiebrania hakina kihusishi kinachoandikwa wazi kabla ya jozi hii, hivyo muundo una kiasi cha utata. “Katika” huleta Kiswahili cha asili na kuonyesha hali ya kifalme ambamo shujaa anatenda, huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na ladha ya kishairi. “Pajani” huhifadhi taswira halisi ya Kiebrania, na “fahari” pamoja na “adhama” huhifadhi jozi ya maneno ya kifalme bila kuyafanya yafanane kabisa.
