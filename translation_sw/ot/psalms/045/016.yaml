  text: In place of your fathers will be your sons[b][a]; you will appoint them as princes in all the earth.
translation:
  language: sw
  text: Badala ya baba zako watakuwa wana wako; utawafanya kuwa wakuu katika dunia yote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika nchi yote.” Neno la Kiebrania אֶרֶץ linaweza kumaanisha “dunia” au “nchi,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: badala ya
  rationale: Katika muktadha huu neno linaonyesha kuchukua nafasi au kufuatana katika ukoo, si kuwa chini kwa mahali.
- source_word: אֲבֹתֶיךָ
  choice: baba zako
  rationale: Huhifadhi maana ya moja kwa moja ya Kiebrania pamoja na wazo la mababu wa ukoo wa kifalme.
- source_word: יִהְיוּ
  choice: watakuwapo
  rationale: Hutoa maana ya wakati ujao na kuonyesha kwamba wana watachukua mahali pa baba bila kufanya sentensi ya Kiswahili isikike pungufu.
- source_word: בָנֶיךָ
  choice: wana wako
  rationale: Kiebrania kimetaja wana wa kiume kwa wingi; neno hili linahifadhi maana ya warithi wa ukoo wa kifalme.
- source_word: תְּשִׁיתֵמוֹ
  choice: utawaweka
  rationale: Hufuata maana ya msingi ya ‘kuweka’ huku muktadha ukionyesha kuwa ni kuwaweka katika madaraka.
- source_word: לְשָׂרִים
  choice: kuwa wakuu
  rationale: שָׂרִים inaweza kumaanisha wakuu, watawala, au maafisa wa cheo; ‘wakuu’ inafaa katika mazingira ya kifalme bila kubana maana kupita kiasi.
- source_word: בְּכָל הָאָרֶץ
  choice: katika dunia yote
  rationale: אֶרֶץ inaweza kuwa ‘dunia’ au ‘nchi.’ Lugha pana ya kifalme katika zaburi inaunga mkono ‘dunia,’ huku uwezekano wa ‘nchi’ ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Upeo wa הָאָרֶץ katika muktadha wa kifalme
  choice: dunia yote
  alternative: nchi yote
  rationale: Kiebrania kinaruhusu maana zote mbili. Tafsiri kuu inahifadhi upeo mpana wa usemi wa zaburi bila kulazimisha tafsiri maalumu ya kimadhehebu, na tanbihi inaonyesha maana nyingine halali.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. ‘Watakuwapo wana wako’ huhifadhi mpangilio na wazo la urithi wa kifalme kwa namna ya asili zaidi kuliko kuacha kitenzi ‘watakuwa’ bila kijalizo.
