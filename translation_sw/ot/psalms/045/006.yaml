  yaml_path: translation/ot/psalms/045/006.yaml
  text: Your throne[a], O God, is forever and ever[b]; the scepter of your kingdom is a scepter of uprightness.
translation:
  language: sw
  text: Kiti chako cha enzi, Ee Mungu, ni cha milele na milele[a]; fimbo ya ufalme wako ni fimbo ya unyofu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kiti chako cha enzi ni Mungu milele na milele,” au “Kiti chako cha enzi cha kimungu ni cha milele na milele.” Muundo wa Kiebrania umejadiliwa; maandishi makuu yanafuata usomaji unaomwita Mungu moja kwa moja.
    reason: alternative_reading
  - marker: b
    text: Au, “fimbo ya unyofu ndiyo fimbo ya ufalme wako.”
    reason: previous_rendering
lexical_decisions:
- source_word: כִּסְאֲךָ
  choice: kiti chako cha enzi
  rationale: כִּסֵּא ni kiti cha mtawala; katika zaburi hii ya kifalme, “kiti cha enzi” ni Kiswahili cha kawaida na sahihi.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Neno hili limeeleweka hapa kama mwito wa moja kwa moja. Usomaji huo unafaa mtindo wa kumsemesha mhusika katika zaburi, huku uwezekano mwingine wa kisintaksia ukihifadhiwa katika tanbihi.
- source_word: עוֹלָם וָעֶד
  choice: milele na milele
  rationale: Jozi hii ya Kiebrania inasisitiza kudumu bila mwisho; usemi wa Kiswahili “milele na milele” huhifadhi mkazo huo.
- source_word: שֵׁבֶט
  choice: fimbo
  rationale: Katika muktadha wa kifalme, שֵׁבֶט ni fimbo ya mamlaka ya mtawala. “Fimbo” ni neno la asili na linaloeleweka kwa urahisi katika Kiswahili, na uhusiano wake na ufalme huonyesha maana ya kifalme.
- source_word: מִישֹׁר
  choice: unyofu
  rationale: מִישֹׁר huonyesha kunyo直oka kwa maana ya kimaadili—uadilifu au haki. “Unyofu” huhifadhi taswira ya msingi bila kuibana kuwa istilahi ya kisheria pekee.
- source_word: שֵׁבֶט מַלְכוּתֶךָ
  choice: fimbo ya ufalme wako
  rationale: Tafsiri hii huhifadhi uhusiano wa muundo wa Kiebrania kati ya fimbo ya utawala na ufalme wa anayesemeshwa.
theological_decisions:
- issue: Nguvu ya kisintaksia na kitheolojia ya אֱלֹהִים katika kishazi cha kwanza
  choice: 'Mwito wa moja kwa moja: “Kiti chako cha enzi, Ee Mungu, ni cha milele na milele”'
  alternative: “Kiti chako cha enzi ni Mungu milele na milele,” au “Kiti chako cha enzi cha kimungu ni cha milele na milele”
  rationale: Muundo wa Kiebrania umejadiliwa, lakini kuichukua אֱלֹהִים kama mwito ni usomaji wa moja kwa moja unaofaa muktadha na mapokeo ya kale. Tanbihi huhifadhi usomaji mwingine halisi bila kuondoa mvutano wa kitheolojia wa maandishi.
- issue: Mpangilio wa kiima na kiarifu katika שֵׁבֶט מִישֹׁר שֵׁבֶט מַלְכוּתֶךָ
  choice: “fimbo ya ufalme wako ni fimbo ya unyofu”
  alternative: “fimbo ya unyofu ndiyo fimbo ya ufalme wako”
  rationale: Kirai bainifu “fimbo ya ufalme wako” kinaeleweka vizuri kama kiima cha sentensi ya Kiswahili, ingawa mpangilio wa maneno wa Kiebrania unaweza kuwakilishwa kwa namna nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Ee” huhifadhi hadhi ya mwito wa moja kwa moja; “kiti cha enzi,” “ufalme,” na “unyofu” ni maneno ya sasa yenye uzito unaofaa zaburi ya kifalme.
