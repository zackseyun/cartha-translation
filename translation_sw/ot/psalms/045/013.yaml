lexical_decisions:
- source_word: כָּל כְּבוּדָּה
  choice: ana utukufu wote
  rationale: Kiswahili hiki kinaonyesha nguvu ya כָּל pamoja na כְּבוּדָּה, yaani utukufu au fahari kamili, bila kuifanya כָּל kuwa tu kibainishi cha idadi.
- source_word: בַת מֶלֶךְ
  choice: Binti wa mfalme
  rationale: Tafsiri ya karibu na muundo wa Kiebrania, huku ikihifadhi taswira ya kifalme kuliko kutumia tu ‘binti mfalme’.
- source_word: פְּנִימָה
  choice: ndani
  rationale: '‘Ndani’ huhifadhi utata wa kimaana: huenda binti yuko ndani ya jumba au chumba, au neno linaelekeza kwenye uzuri au utukufu wa ndani.'
- source_word: מִמִּשְׁבְּצוֹת זָהָב
  choice: limesokotwa kwa dhahabu
  rationale: Hutoa picha ya ufundi wa kitambaa chenye dhahabu kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi uwezekano wa mapambo yaliyotariziwa au kupambwa kwa dhahabu.
- source_word: לְבוּשָׁהּ
  choice: vazi lake
  rationale: ‘Vazi’ ni neno la asili na lenye hadhi linalofaa mazingira ya harusi ya kifalme; linaweza kutaja mavazi yake kwa ujumla au vazi maalumu.
