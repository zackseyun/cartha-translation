  text: Binti wa mfalme ni mtukufu kabisa ndani[a]; vazi lake ni la ufumaji wa dhahabu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Utukufu wote wa binti wa mfalme umo ndani.” “Ndani” inaweza kumaanisha uzuri au utukufu wa moyoni, au kwamba yuko ndani ya jumba au chumba.
    reason: lexical_alternative
