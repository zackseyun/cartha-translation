base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/010.yaml
  text: Listen[a], daughter, and see; incline your ear, and forget your people and your father's house.
translation:
  language: sw
  text: Sikiliza[a], binti, na uone; tega sikio lako, na uwasahau watu wako na nyumba ya baba yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sikia, binti, na utazame.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעִי
  choice: Sikiliza
  rationale: Amri ya nafsi ya pili, umoja wa kike, ya שׁמע. “Sikiliza” huonyesha usikivu wa makini kwa Kiswahili cha sasa.
- source_word: בַת
  choice: binti
  rationale: Ni neno la kumwita moja kwa moja mwanamke anayezungumziwa; “binti” ni la asili na lenye heshima bila kuongeza kihisishi kisichokuwamo.
- source_word: וּרְאִי
  choice: nawe uone
  rationale: Amri ya ראה. “Uone” huhifadhi maana ya moja kwa moja ya kuona, huku “nawe” ikiunganisha kwa kawaida mfululizo wa maagizo.
- source_word: וְהַטִּי אָזְנֵךְ
  choice: tega sikio lako
  rationale: Nahau hii humtaka mtu aelekeze sikio ili asikilize kwa makini. “Tega sikio lako” huhifadhi taswira ya Kiebrania na ni nahau inayoeleweka kwa Kiswahili.
- source_word: וְשִׁכְחִי
  choice: uwasahau
  rationale: Amri ya שכח ina maana ya msingi ya kusahau. Tafsiri hii haisahilishi nguvu ya agizo kuwa kuacha tu au kuweka nyuma.
- source_word: עַמֵּךְ
  choice: watu wako
  rationale: עם hapa huelekea kumaanisha jamii au taifa analotoka mhusika; “watu wako” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: וּבֵית אָבִיךְ
  choice: na nyumba ya baba yako
  rationale: Usemi wa Kiebrania humaanisha nyumba, jamaa, au kaya ya baba. “Nyumba ya baba yako” huhifadhi nahau pamoja na maana yake ya kifamilia.
theological_decisions:
- issue: Nguvu ya himizo kwa bibi arusi
  choice: Kuhifadhi agizo la moja kwa moja la kuhamisha uaminifu mkuu kutoka kwa watu na nyumba ya baba yake kwenda katika ndoa ya kifalme.
  alternative: Kulieleza kwa ujumla kama wito wa hekima wa kusikiliza bila kusisitiza mabadiliko ya uaminifu.
  rationale: Mfululizo wa amri unafikia kilele katika “uwasahau watu wako na nyumba ya baba yako,” jambo linaloonyesha mwelekeo mpya wa mahusiano katika mazingira ya ndoa ya zaburi. Tafsiri haiingizi madai ya baadaye ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kishairi na mfululizo wa amri umehifadhiwa; “tega sikio” hudumisha taswira ya asili bila kuwa wa kizamani.
