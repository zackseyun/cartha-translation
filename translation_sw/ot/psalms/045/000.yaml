  text: 'For the choirmaster: according to “Lilies.” Of the sons of Korah[a]. A Maskil[c][b]. A song of loves.'
translation:
  language: sw
  text: 'Kwa mwongoza muziki: kwa “Maua ya Yungiyungi”[a]. Ya wana wa Kora. Maskili[b]. Wimbo wa mapenzi[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania Shoshannim, yaani “maua ya yungiyungi”; huenda ni jina la melodi au mpangilio wa muziki.
    reason: lexical_alternative
  - marker: b
    text: Maskili ni neno la kiufundi katika vichwa vya Zaburi; huenda linamaanisha tungo ya kutafakari au ya kufundisha.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinasema kwa muundo usio wa kawaida, “wimbo wa mapenzi” (kwa umbo la wingi); huenda maana yake ni “wimbo wa mapenzi” au “wimbo kuhusu mambo ya mapenzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza muziki
  rationale: Katika vichwa vya Zaburi neno hili humtaja kiongozi au msimamizi wa uimbaji na muziki. Tafsiri hii ni ya kawaida katika Kiswahili na haibani jukumu hilo kwa kwaya pekee.
- source_word: עַל
  choice: kwa mtindo wa
  rationale: Katika kichwa cha muziki, עַל huenda likatanguliza jina la melodi, mpangilio, mtindo, au ala. “Kwa mtindo wa” ni ya asili katika Kiswahili huku tanbihi ikihifadhi kutokuwa na uhakika kwa matumizi hayo ya kiufundi.
- source_word: שֹׁשַׁנִּים
  choice: “Maua ya Yungiyungi”
  rationale: Maana yake ya moja kwa moja ni maua ya yungiyungi, lakini hapa huenda ni jina la melodi au mpangilio wa muziki. Alama za kunukuu zinaonyesha kuwa ni jina maalumu katika kichwa.
- source_word: לִבְנֵי קֹרַח
  choice: Ya wana wa Kora
  rationale: Kiambishi ל־ kinaweza kuonyesha uhusiano, utunzi, au kuwekwa wakfu. “Ya wana wa Kora” ni kauli fupi isiyoamua kwa lazima ni uhusiano upi unaokusudiwa.
- source_word: מַשְׂכִּיל
  choice: Maskili
  rationale: Hili ni neno la kiufundi katika vichwa vya Zaburi ambalo maana yake kamili haijulikani. Kulitohoa kunazuia tafsiri kutoa uhakika usiokuwapo.
- source_word: שִׁיר
  choice: Wimbo
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya aina hii ya tungo.
- source_word: יְדִידֹת
  choice: wa mapenzi
  rationale: Nomino ya Kiebrania iko katika wingi usio wa kawaida na huenda inahusu mapenzi au mambo ya mapenzi. “Mapenzi” ni usemi wa asili wa Kiswahili na bado unaacha upeo wake wazi.
