base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/005.yaml
  text: Your arrows are sharp[a]; peoples fall beneath you; they are in the heart of the king’s enemies.
translation:
  language: sw
  text: Mishale yako ni mikali[a]; mataifa yanaanguka chini yako; imo mioyoni mwa maadui wa mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata mpangilio wa Kiebrania kwa karibu zaidi: “Mishale yako ni mikali—mataifa yanaanguka chini yako—mioyoni mwa maadui wa mfalme.” Kiebrania hapa ni kifupi sana na cha kishairi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִצֶּיךָ
  choice: Mishale yako
  rationale: Nomino ya wingi yenye kiambishi cha nafsi ya pili umoja; “mishale yako” ndiyo tafsiri ya kawaida na ya moja kwa moja.
- source_word: שְׁנוּנִים
  choice: ni mikali
  rationale: Neno lina maana ya kuwa mikali au iliyonooshwa; “ni mikali” ni Kiswahili cha kawaida kinachofaa katika nafasi ya kivumishi-arifu.
- source_word: עַמִּים
  choice: watu wa mataifa
  rationale: Wingi huu humaanisha makundi mbalimbali ya watu. “Watu wa mataifa” huonyesha wazi kuwa ni watu wengi wa jamii au mataifa tofauti bila kuwafanya mataifa yenyewe kuwa wahusika wanaoanguka.
- source_word: תַּחְתֶּיךָ
  choice: chini yako
  rationale: Huhifadhi maana ya moja kwa moja ya kuwa chini ya mtu, pamoja na taswira ya kushindwa vitani na kutiishwa.
- source_word: יִפְּלוּ
  choice: wanaanguka
  rationale: Kauli ya wakati usiotimilika inaweza kueleza tukio la sasa kwa uhai wa kishairi au la wakati ujao; “wanaanguka” inafaa katika taswira hai ya mstari huu.
- source_word: בְּלֵב
  choice: iko mioyoni mwa
  rationale: Kiebrania kinasema kwa ufupi “katika moyo wa.” Kiswahili kinatumia wingi wa kawaida “mioyoni mwa” kwa maadui wengi, huku “iko” ikirejelea mishale bila kuongeza kitenzi cha kuchoma ambacho hakijaandikwa wazi.
- source_word: אוֹיְבֵי הַמֶּלֶךְ
  choice: maadui wa mfalme
  rationale: Hii ni tafsiri ya moja kwa moja ya muundo wa umilikaji “maadui wa mfalme,” bila kuubadili kuwa “maadui zako.”
theological_decisions:
- issue: Mhusika anayeitwa “mfalme” katika zaburi ya kifalme yenye uwezekano wa kusomwa kimasihi
  choice: Kudumisha neno la moja kwa moja “mfalme” bila kumtambulisha wazi kama Masihi katika tafsiri.
  alternative: Kumtambulisha mfalme moja kwa moja kuwa Masihi au kubadili usemi kuwa “maadui zako.”
  rationale: Kiebrania chenyewe kinasema “mfalme.” Tafsiri inadumisha usemi wa kihistoria na kishairi na kuacha matumizi ya kimasihi yaamuliwe katika ufasiri, si kuingizwa ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi hudumisha ufupi na mkazo wa mstari wa Kiebrania; tanbihi inaonyesha sintaksia yake iliyobanwa.
