source:
  edition: WLC
  text: תּ֭וּבַלְנָה בִּ/שְׂמָחֹ֣ת וָ/גִ֑יל תְּ֝בֹאֶ֗ינָה בְּ/הֵ֣יכַל מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/015.yaml
  text: They will be led with gladness and rejoicing[b][a]; they will enter the palace of the king.
translation:
  language: sw
  text: Wataongozwa kwa furaha na shangwe; wataingia katika jumba la mfalme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “jumba” linaweza pia kumaanisha “ukumbi” au, katika miktadha mingine, “hekalu”; hapa “jumba” linafaa zaidi katika mazingira ya arusi ya kifalme.
    reason: cultural_note
lexical_decisions:
- source_word: תּוּבַלְנָה
  choice: Wataongozwa
  rationale: Kauli ya kutendwa ya kitenzi יבל ina maana ya kuongozwa au kuletwa. ‘Wataongozwa’ inadumisha picha ya msafara wa arusi.
- source_word: בִּשְׂמָחֹת וָגִיל
  choice: kwa furaha na shangwe
  rationale: Maneno haya mawili yanaeleza hali ya kusherehekea; ‘furaha’ na ‘shangwe’ yanayatofautisha kwa Kiswahili cha kawaida bila kulazimisha wingi wa neno la kwanza.
- source_word: תְּבֹאֶינָה
  choice: wataingia
  rationale: Katika muktadha wa kufika kwenye jengo, בוא inaeleweka kwa usahihi kama kuingia.
- source_word: בְּהֵיכַל
  choice: katika jumba
  rationale: הֵיכָל inaweza kumaanisha jumba, ukumbi, au hekalu. Muktadha wa arusi ya kifalme unapendelea ‘jumba.’
- source_word: מֶלֶךְ
  choice: la mfalme
  rationale: Muundo wa umilikaji na muktadha humrejelea mfalme maalumu wa zaburi hii; ‘mfalme’ ni usemi wa kawaida wa Kiswahili hapa.
theological_decisions:
- issue: Warejelewa wa vitenzi vya wingi wa kike
  choice: Kudumisha kiwakilishi kilichomo katika vitenzi kwa ‘wata-’ bila kuwataja zaidi
  alternative: Kuwataja wazi kuwa mabikira, wasichana wa bibi-arusi, au wanawake wa msafara
  rationale: Muktadha wa karibu unaonyesha kundi la wanawake katika msafara wa arusi, lakini mstari wenyewe hauwataji kwa nomino; tafsiri haiongezi maelezo yasiyosemwa hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kishairi lakini unaeleweka kwa urahisi; ‘shangwe’ huhifadhi nguvu ya furaha ya kusherehekea.
