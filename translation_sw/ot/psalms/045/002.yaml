  text: יָפְיָפִ֡יתָ מִ/בְּנֵ֬י אָדָ֗ם ה֣וּצַק חֵ֭ן בְּ/שְׂפְתוֹתֶ֑י/ךָ עַל כֵּ֤ן בֵּֽרַכְ/ךָ֖ אֱלֹהִ֣ים לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/002.yaml
  text: You are more beautiful than the sons of men[a]; grace is poured upon your lips[c][b]; therefore God has blessed you forever.
translation:
  language: sw
  text: Wewe ni mzuri kuliko wanadamu[a]; neema imemiminwa midomoni mwako[b]; kwa hiyo Mungu amekubariki milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “wana wa mwanadamu,” usemi wa kishairi unaomlinganisha mfalme na wanadamu wengine.
    reason: cultural_note
  - marker: b
    text: Au “kibali” au “upendezi”; usemi huu unaweza kumaanisha kwamba maneno yako yana neema.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָפְיָפִיתָ
  choice: Wewe ni mzuri kuliko
  rationale: Umbo la kishairi lenye mkazo kutoka יפה linaonyesha uzuri unaozidi wa wengine; Kiswahili hiki ni cha kawaida, cha heshima, na kinahifadhi ulinganisho.
- source_word: מִבְּנֵי אָדָם
  choice: wanadamu wengine
  rationale: Kiebrania kwa neno ni ‘wana wa Adamu/mwanadamu,’ yaani wanadamu. Katika Kiswahili, ‘wanadamu wengine’ linaonyesha wazi kwamba mfalme analinganishwa na watu wengine bila kuleta usemi usio wa kawaida ‘wana wa wanadamu.’
- source_word: הוּצַק
  choice: imemiminwa
  rationale: Kauli tendwa ya יצק inadumisha taswira ya kitu kinachomiminwa kwa wingi; wakati timilifu unaafikiana na umbo kamilifu la Kiebrania.
- source_word: חֵן
  choice: neema
  rationale: חֵן inaweza kumaanisha neema, kibali, au uzuri wa kuvutia. Pamoja na midomo inaashiria maneno yenye neema, huku ‘neema’ ikihifadhi upana wa kishairi na kimaadili.
- source_word: בְּשְׂפְתוֹתֶיךָ
  choice: midomoni mwako
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza kwamba neema iko katika au juu ya midomo, na inadumisha sitiari ya usemi wenye neema.
- source_word: עַל כֵּן
  choice: kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho au sababu kwa lugha ya sasa na ya wazi.
- source_word: בֵּרַכְךָ אֱלֹהִים
  choice: Mungu amekubariki
  rationale: Kisintaksia אֱלֹהִים inaeleweka kwa kawaida kuwa kiima, na kitenzi timilifu kinaonyesha baraka iliyotolewa yenye matokeo yanayoendelea.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Neno hili linaeleza muda usio na mwisho au unaodumu; ‘milele’ ndilo neno la kawaida na la kishairi katika Kiswahili.
theological_decisions:
- issue: Ikiwa אֱלֹהִים ni kiima (‘Mungu amekubariki’) au ni mwito (‘Ee Mungu’).
  choice: Mungu amekubariki
  alternative: Ee Mungu, [yeye] amekubariki
  rationale: Muundo wa aya hii pekee unaunga mkono zaidi אֱלֹהִים kuwa kiima cha בֵּרַכְךָ. Tafsiri haiingizi maneno kutoka aya inayofuata wala kulazimisha ufafanuzi wa Kikristo kuhusu Masihi ambao aya hii yenyewe haisemi wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. ‘Mzuri’ linaweza kueleza uzuri wa mwanamume bila kutumia ‘mrembo,’ ambalo kwa matumizi mengi ya sasa huhusishwa zaidi na mwanamke. ‘Wanadamu wengine’ ni la asili kuliko tafsiri neno kwa neno, huku tanbihi ikihifadhi nahau ya Kiebrania.
