  text: And the daughter of Tyre will come with a gift[b][a]; the rich among the people will seek your favor.
translation:
  language: sw
  text: Na binti wa Tiro atakuja na zawadi[a]; matajiri miongoni mwa watu watatafuta kibali chako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka” au “zawadi ya ushuru”; neno la Kiebrania linaweza kumaanisha zawadi, sadaka, au ushuru kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “uso wako.” Pamoja na kitenzi hiki, ni nahau yenye maana ya kuomba au kutafuta kibali chako.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת צֹר
  choice: Na binti wa Tiro
  rationale: Kiunganishi וּ kinaendeleza wazo, na muundo ‘binti wa Tiro’ unaonyesha kwa lugha ya kishairi mji au watu wa Tiro kama mwanamke.
- source_word: בְּמִנְחָה
  choice: atakuja na zawadi
  rationale: מִנְחָה inaweza kumaanisha zawadi, sadaka, au kodi ya heshima. Katika mazingira ya kifalme, ‘zawadi’ ni ya kawaida na haifanyi maana iwe ya kiibada kupita kiasi; kitenzi ‘atakuja’ kimeongezwa kwa Kiswahili ili kuwasilisha kwa kawaida kishazi cha Kiebrania kisicho na kitenzi bayana.
- source_word: פָּנַיִךְ יְחַלּוּ
  choice: watatafuta kibali chako
  rationale: Ingawa פָּנַיִךְ kihalisi ni ‘uso wako,’ pamoja na יְחַלּוּ ni nahau ya kuomba au kutafuta kibali. Tafsiri hii inatoa maana ya nahau kwa Kiswahili cha kawaida na kuhifadhi nafsi ya pili umoja.
- source_word: עֲשִׁירֵי עָם
  choice: matajiri miongoni mwa watu
  rationale: Muundo huu unamaanisha watu wenye mali miongoni mwa watu; tafsiri hii ni ya asili na haibainishi bila msingi kuwa ni taifa fulani.
