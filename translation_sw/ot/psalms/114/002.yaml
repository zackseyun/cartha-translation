translation:
  language: sw
  text: 'Yuda ikawa patakatifu pake[a][b],

    Israeli milki yake[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yuda ilikuwa patakatifu pake.” Kitenzi cha Kiebrania kinaweza kueleza hali (“ilikuwa”) au badiliko lililotokea (“ikawa”).
    reason: lexical_alternative
  - marker: b
    text: Au, “mahali pake patakatifu.” Neno la Kiebrania linaweza kumaanisha utakatifu au mahali patakatifu; hapa maana ya mahali inalingana na “milki yake.”
    reason: lexical_alternative
  - marker: c
    text: Au, “eneo la utawala wake” au “utawala wake.” Nomino ya Kiebrania ina umbo la wingi, lakini hapa huenda inaeleza dhana pana ya utawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיְתָה
  choice: ikawa
  rationale: 'Katika mfululizo wa kihistoria unaoanza na kutoka kwa Israeli, kitenzi היה kinaonyesha hali iliyotokea: Yuda ikawa kitu fulani. Hata hivyo, maana ya hali tu, ‘ilikuwa,’ bado inawezekana na imeonyeshwa katika tanbihi.'
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la kabila na eneo la Yuda.
- source_word: לְקָדְשׁוֹ
  choice: patakatifu pake
  rationale: קֹדֶשׁ inaweza kumaanisha utakatifu au mahali patakatifu. Katika usambamba huu na milki, maana halisi ya mahali au eneo takatifu inafaa, na ‘patakatifu pake’ ni usemi mfupi na wa kishairi.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la watu au taifa la Israeli.
- source_word: מַמְשְׁלוֹתָיו
  choice: milki yake
  rationale: Nomino hii hutaja utawala au eneo linalotawaliwa. Ingawa umbo la Kiebrania ni la wingi, hapa huenda linaonyesha dhana pana ya utawala; ‘milki yake’ ni ya asili katika Kiswahili na inadumisha usambamba na ‘patakatifu pake.’
theological_decisions:
- issue: Anayerejelewa na viambishi vya umilikaji katika ‘patakatifu pake’ na ‘milki yake’
  choice: Viambishi vinamrejelea Mungu/BWANA bila kumtaja moja kwa moja katika mstari huu.
  alternative: 'Kumtaja wazi BWANA: ‘patakatifu pa BWANA’ na ‘milki ya BWANA.’'
  rationale: Muktadha wa zaburi unaonyesha kwamba viambishi vinamrejelea Mungu wa Israeli. Kutumia ‘pake/yake’ kunahifadhi ufupi wa Kiebrania bila kuongeza jina ambalo halimo katika mstari.
- issue: Usambamba wa Yuda na Israeli
  choice: Majina yote mawili yamedumishwa kama vipashio tofauti vya ushairi.
  alternative: Kuyapatanisha kuwa usemi mmoja wa pamoja, kama ‘watu wake watakatifu’ au ‘ufalme wake.’
  rationale: Kiebrania kinataja Yuda na Israeli kila moja katika mstari wake wa usambamba. Kuyadumisha huepuka kufuta muundo wa kishairi au kuingiza ufafanuzi wa baadaye kuhusu uhusiano wao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo mfupi, wenye hadhi na wa kishairi. ‘Patakatifu pake’ na ‘milki yake’ huhifadhi usambamba wa mstari wa Kiebrania; tanbihi zinaweka wazi maana mbadala bila kuamua zaidi ya ushahidi wa chanzo.
