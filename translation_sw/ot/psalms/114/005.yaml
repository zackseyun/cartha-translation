  text: מַה לְּ/ךָ֣ הַ֭/יָּם כִּ֣י תָנ֑וּס הַ֝/יַּרְדֵּ֗ן תִּסֹּ֥ב לְ/אָחֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/005.yaml
  text: What is with you[a], O sea, that you flee—O Jordan, that you turn back?
translation:
  language: sw
  text: Una nini[a], ee bahari, hata unakimbia? Ee Yordani, hata unarudi nyuma?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Umepatwa na nini, ee bahari, hata unakimbia; Yordani, hata unarudi nyuma?” Nahau ya Kiebrania “Una nini?” ni usemi wa mshangao.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לְּךָ
  choice: Una nini
  rationale: Huhifadhi muundo wa nahau ya Kiebrania, kihalisi ‘nini kwako/pamoja nawe,’ huku ikitoa swali la mshangao linaloeleweka katika Kiswahili. Ufafanuzi wa maana yake umetolewa katika tanbihi.
- source_word: הַיָּם
  choice: ee bahari
  rationale: Neno linamaanisha ‘bahari’; ‘ee’ huonyesha kwamba mtunga zaburi anaiambia bahari moja kwa moja.
- source_word: כִּי
  choice: hata
  rationale: 'Katika swali hili la kishairi, neno hilo linaunganisha hali inayosababisha mshangao: ‘Una nini ... hata unakimbia?’ Hii ni ya asili katika Kiswahili kuliko tafsiri ya kisababishi kama ‘kwa sababu.’'
- source_word: תָנוּס
  choice: unakimbia
  rationale: Kitenzi נוּס humaanisha kukimbia au kukimbia mbali; wakati wa sasa hudumisha taswira hai ya bahari kama mhusika anayeambiwa moja kwa moja.
- source_word: הַיַּרְדֵּן
  choice: Ee Yordani
  rationale: Jina la mto limetoholewa kama ‘Yordani,’ na ‘Ee’ huonyesha usemi wa moja kwa moja.
- source_word: תִּסֹּב לְאָחוֹר
  choice: unarudi nyuma
  rationale: Kirai hiki humaanisha kugeuka au kurudi kuelekea nyuma. ‘Unarudi nyuma’ ni cha kawaida, kifupi, na hudumisha usambamba na ‘unakimbia.’
