  text: הֶֽ֭/הָרִים רָקְד֣וּ כְ/אֵילִ֑ים גְּ֝בָע֗וֹת כִּ/בְנֵי צֹֽאן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/004.yaml
  text: The mountains skipped like rams[a], the hills like lambs of the flock.
translation:
  language: sw
  text: 'Milima iliruka-ruka kama kondoo dume,

    vilima kama wanakondoo[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi, “kama wana wa kundi,” yaani kondoo wachanga au wanakondoo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים
  choice: Milima
  rationale: Nomino hii humaanisha milima; umbo la Kiswahili katika muktadha huu linaweza kurejelea milima hiyo bila kuhitaji kiashiria tofauti cha uamilifu.
- source_word: רָקְדוּ
  choice: iliruka-ruka
  rationale: Kitenzi kinaonyesha mwendo wa kuchangamka wa kuruka au kucheza. ‘Iliruka-ruka’ kinaafikiana vizuri na mfano wa kondoo na kudumisha taswira hai ya kishairi.
- source_word: כְאֵילִים
  choice: kama kondoo dume
  rationale: אֵילִים hapa ni kondoo wa kiume waliokomaa; ‘kondoo dume’ ni usemi wa kawaida na sahihi katika Kiswahili.
- source_word: גְּבָעוֹת
  choice: vilima
  rationale: Neno hili humaanisha miinuko midogo kuliko milima, yaani vilima, na linaendeleza usambamba wa kishairi.
- source_word: כִּבְנֵי צֹאן
  choice: kama wanakondoo
  rationale: Kirai hiki ni ‘kama wana wa kundi’ kwa maana ya kondoo wachanga. ‘Wanakondoo’ ni tafsiri ya asili na yenye kueleweka, huku tanbihi ikihifadhi tamathali halisi ya Kiebrania.
