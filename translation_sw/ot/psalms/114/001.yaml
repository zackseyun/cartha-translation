  text: בְּ/צֵ֣את יִ֭שְׂרָאֵל מִ/מִּצְרָ֑יִם בֵּ֥ית יַ֝עֲקֹ֗ב מֵ/עַ֥ם לֹעֵֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/001.yaml
  text: When Israel went out from Egypt[a], the house of Jacob from a people of strange speech,
translation:
  language: sw
  text: 'Israeli walipotoka Misri,

    nyumba ya Yakobo kutoka kwa watu wa lugha ngeni,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kwa watu ambao maneno yao hayakueleweka.” Kiebrania hueleza Wamisri kuwa watu ambao lugha yao ilikuwa ngeni au isiyoeleweka kwa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/צֵאת
  choice: alipotoka
  rationale: Muundo wa ב pamoja na kitenzi-jina cha יצא unaanzisha kishazi cha wakati. Kiswahili cha '-lipo-' kinaonyesha kwa kawaida na kwa ufupi maana ya 'wakati ... alipotoka'.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la taifa na watu wa agano.
- source_word: מִ/מִּצְרָיִם
  choice: Misri
  rationale: Kiambishi cha mahali katika kitenzi 'alipotoka' tayari kinabeba maana ya kutoka mahali; 'Misri' hukamilisha chanzo cha kutoka bila kurudia 'kutoka' kwa namna isiyo ya kawaida.
- source_word: בֵּית יַעֲקֹב
  choice: nyumba ya Yakobo
  rationale: Inahifadhi tamathali ya Kiebrania inayowataja wazao wa Yakobo, pamoja na uzito wake wa kishairi na wa kiagano.
- source_word: מֵ/עַם
  choice: kutoka kwa watu
  rationale: מן huonyesha utengano au chanzo. 'Kutoka kwa watu' ni ya kawaida katika Kiswahili na inadumisha ulinganifu na kutoka kwa Israeli Misri.
- source_word: לֹעֵז
  choice: waliozungumza lugha ya kigeni
  rationale: Neno hilo linaeleza watu ambao lugha yao ilikuwa ngeni au isiyoeleweka kwa Israeli. Tafsiri hii ni wazi, ya sasa, na haiongezi dharau ya kikabila.
theological_decisions:
- issue: Uhusiano wa mistari miwili inayolingana
  choice: 'Mstari wa pili umehifadhiwa kama urudiaji sambamba wa tukio la kutoka: ''nyumba ya Yakobo'' inalingana na ''Israeli,'' na ''kutoka kwa watu waliozungumza lugha ya kigeni'' inalingana na kutoka Misri.'
  alternative: Kuuchukulia mstari wa pili kuwa maelezo ya ziada tu, bila kitenzi kilichoachwa kueleweka.
  rationale: Ushairi wa Kiebrania mara nyingi hutumia ulinganifu wenye maana zinazokaribiana. Kiswahili kinahifadhi muundo huo bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka kwa msomaji wa kawaida. 'Nyumba ya Yakobo' imehifadhiwa kwa sababu ni msemo muhimu wa kibiblia; 'lugha ya kigeni' hutumiwa badala ya maneno yenye hisia ya dharau.
