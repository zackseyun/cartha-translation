lexical_decisions:
- source_word: מִלִּפְנֵי
  choice: mbele za
  rationale: Kirai hiki huonyesha kuwa mbele ya uso au uwepo wa mtu. “Mbele za” ni Kiswahili cha kawaida kinachoeleza itikio la dunia inapokuwa katika uwepo wa Bwana.
- source_word: אָדוֹן
  choice: Bwana
  rationale: Neno hili ni cheo chenye maana ya bwana au mtawala, si jina la Mungu YHWH. “Bwana” huhifadhi tofauti hiyo kwa njia ya kawaida katika Kiswahili.
- source_word: חוּלִי
  choice: Tetemeka
  rationale: Hii ni amri ya umoja wa kike inayoielekea dunia. Kitenzi kinaweza kumaanisha kutetemeka, kutikisika kwa nguvu, au kujikunja kwa maumivu; “tetemeka” ni mwito wa kishairi ulio wazi huku tanbihi ikihifadhi picha yenye nguvu zaidi.
- source_word: אָרֶץ
  choice: ee dunia
  rationale: Ingawa neno linaweza kumaanisha nchi, muktadha mpana wa zaburi na usemi wa kuiita moja kwa moja unaunga mkono “dunia”; “ee” huonyesha mwito huo kwa Kiswahili cha kishairi.
- source_word: אֱלוֹהַּ יַעֲקֹב
  choice: Mungu wa Yakobo
  rationale: Kirai hiki kinamtambulisha Mungu kwa uhusiano wake na Yakobo; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Jina la mtu limetolewa kwa umbo lake la kawaida katika Kiswahili.
theological_decisions:
- issue: Kutofautisha אָדוֹן na jina la Mungu YHWH
  choice: Bwana
  alternative: BWANA
  rationale: Kiebrania kimetumia cheo אָדוֹן, wala si jina יְהוָה. Kwa hiyo “Bwana” huhifadhi cheo hicho bila kuingiza kimakosa desturi ya kuwakilisha jina YHWH kwa “BWANA”.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wa sasa na wenye heshima. Marudio ya “mbele za” yamehifadhiwa ili kudumisha usambamba wa Kiebrania; “ee” linaonyesha kwamba dunia inasemeshwa moja kwa moja.
