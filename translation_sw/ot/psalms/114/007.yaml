    mbele ya Bwana,

    mbele ya Mungu wa Yakobo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jipinde-pinde, ee dunia,” ikihifadhi picha kali zaidi ya mtikisiko wa msukosuko katika kitenzi cha Kiebrania.
