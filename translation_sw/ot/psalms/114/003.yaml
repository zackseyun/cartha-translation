lexical_decisions:
- source_word: הַיָּם
  choice: Bahari
  rationale: Nomino yenye kibainishi humaanisha ‘bahari.’ Haijatajwa wazi kuwa ni Bahari ya Shamu, hivyo tafsiri haiongezi jina hilo.
- source_word: רָאָה
  choice: iliona
  rationale: Hii ni maana ya moja kwa moja ya kitenzi, na inadumisha uhuishaji wa kishairi wa bahari.
- source_word: וַיָּנֹס
  choice: ikakimbia
  rationale: Kitenzi נוס humaanisha kukimbia au kutoroka; ‘ikakimbia’ ni cha kawaida, hai, na kinafaa kwa ushairi huu.
- source_word: הַיַּרְדֵּן
  choice: Yordani
  rationale: Ni jina la mto Yordani; kwa Kiswahili jina ‘Yordani’ linatosha katika mstari huu wa kishairi bila kuongeza ‘Mto.’
- source_word: יִסֹּב
  choice: ikarudi
  rationale: Katika muktadha huu kitenzi סבב huonyesha kugeuka au kurudi; pamoja na לְאָחוֹר kinatafsiriwa kwa kawaida kuwa ‘ikarudi nyuma.’
- source_word: לְאָחוֹר
  choice: nyuma
  rationale: Kirai hiki humaanisha ‘nyuma’ au ‘kuelekea nyuma,’ na maana yake imedumishwa wazi katika ‘ikarudi nyuma.’
theological_decisions:
- issue: Dokezo la kihistoria katika lugha ya kishairi
  choice: Kudumisha uhuishaji wa bahari na Yordani bila kutaja wazi matukio yanayodokezwa katika matini kuu.
  alternative: Bahari iliona hilo, ikakimbia; Yordani ikarudi nyuma.
  rationale: Kiebrania hakitaji kitu kilichoonekana katika aya hii. Kuongeza ‘hilo’ au ‘yeye’ kungeondoa utata wa makusudi na kufasiri zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa vishazi unadumisha usambamba wa Kiebrania; viwakilishi vya ngeli vinaendeleza uhuishaji bila kuongeza kitu ambacho bahari ilikiona.
