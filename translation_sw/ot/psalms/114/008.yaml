  text: who turned the rock into a pool of water[a], the flint into a spring of water.
translation:
  language: sw
  text: 'aliyeugeuza mwamba kuwa dimbwi la maji[a],

    mwamba mgumu kuwa chemchemi ya maji.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayeugeuza mwamba kuwa dimbwi la maji”; Kiebrania kinatumia umbo la kitenzi linaloweza kuonyesha tendo la kawaida au linaloendelea, lakini wakati uliopita unafaa hapa kwa kuwa zaburi inakumbuka matendo ya Mungu jangwani.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהֹפְכִי
  choice: aliyeugeuza
  rationale: Ni kauli ya uhusiano inayobeba mtendaji aliyetajwa katika mstari uliotangulia. Wakati uliopita unafaa kwa kukumbuka matendo ya Mungu jangwani, huku tanbihi ikihifadhi uwezekano wa maana endelevu ya umbo la Kiebrania.
- source_word: הַצּוּר
  choice: mwamba
  rationale: Neno צוּר humaanisha mwamba au tungamo la miamba; “mwamba” ni neno la kawaida na la kishairi linalofaa katika muktadha huu.
- source_word: אֲגַם
  choice: dimbwi
  rationale: אגם hueleza mkusanyiko wa maji yaliyotuama. “Dimbwi” linatoa picha ya mahali palipojaa maji bila kulifanya neno hilo kuwa “bwawa” lililojengwa.
- source_word: מָיִם
  choice: maji
  rationale: Kurudia “maji” katika vipande vyote viwili kunahifadhi usambamba wa kishairi wa Kiebrania.
- source_word: חַלָּמִישׁ
  choice: mwamba mgumu
  rationale: חלמיש ni gumegume au mwamba mgumu sana. “Mwamba mgumu” ni Kiswahili cha kawaida kinachohifadhi msisitizo wa ugumu na hivyo ukubwa wa tendo la ajabu.
- source_word: לְמַעְיְנוֹ
  choice: kuwa chemchemi
  rationale: Kiambishi לְ kinaonyesha matokeo ya ugeuzaji, sawia na kipande cha kwanza; מַעְיָן ni chemchemi, na umbo lake hapa ni la umoja.
theological_decisions:
- issue: Mtendaji wa kimungu anaeleweka kutokana na mstari uliotangulia
  choice: Kutumia kishazi cha uhusiano “aliyeugeuza” bila kurudia “Mungu”
  alternative: “Aliugeuza mwamba kuwa dimbwi la maji...”
  rationale: Kiebrania kinaendeleza maelezo ya Bwana, Mungu wa Yakobo, kutoka mstari wa 7. Kishazi cha uhusiano kinahifadhi uhusiano huo wa kisarufi na mtiririko wa shairi bila kuongeza jina lisilorudiwa katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Usambamba wa mistari miwili na kurudiwa kwa “maji” vimehifadhiwa.
