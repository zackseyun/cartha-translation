  text: O mountains[a], why do you skip like rams, O hills[b], like lambs of the flock?
translation:
  language: sw
  text: Enyi milima, kwa nini mnarukaruka kama kondoo waume, enyi vilima, kama wana-kondoo[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “wana wa kundi”; ni usemi unaomaanisha kondoo wachanga, yaani wana-kondoo.
