lexical_decisions:
- source_word: הֶהָרִים
  choice: Enyi milima
  rationale: Nomino hiyo inamaanisha ‘milima.’ ‘Enyi’ huonyesha kwa Kiswahili cha kawaida kwamba milima inasemeshwa moja kwa moja, kwa kuendeleza swali la mstari uliotangulia.
- source_word: תִּרְקְדוּ
  choice: mnarukaruka
  rationale: Kitenzi רָקַד kinaweza kumaanisha kuruka-ruka au kucheza. ‘Mnarukaruka’ kinaonyesha mwendo mwepesi unaorudiwa na kuendana vizuri na taswira ya wanyama.
- source_word: כְאֵילִים
  choice: kama kondoo dume
  rationale: אֵילִים hapa kwa kawaida ni kondoo dume; tafsiri hii pia hudumisha ulinganifu na wana-kondoo katika kipande cha pili.
- source_word: גְּבָעוֹת
  choice: enyi vilima
  rationale: Nomino hiyo inamaanisha ‘vilima,’ na ‘enyi’ huhifadhi usemi wa moja kwa moja wa kishairi.
- source_word: כִּבְנֵי צֹאן
  choice: kama wana-kondoo wa kundini
  rationale: Kirai hicho kihalisi ni ‘kama wana wa kundi,’ yaani kondoo wachanga. ‘Wana-kondoo wa kundini’ ni Kiswahili cha asili kinachohifadhi maana na rejea ya kundi.
