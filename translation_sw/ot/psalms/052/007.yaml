  text: וְ/יִרְא֖וּ צַדִּיקִ֥ים וְ/יִירָ֗אוּ וְ/עָלָ֥י/ו יִשְׂחָֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/007.yaml
  text: 'The righteous will see and fear[b][a], and they will laugh at him:'
translation:
  language: sw
  text: 'Wenye haki wataona na kuogopa[a], nao watamcheka[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuwa na hofu.” Neno la Kiebrania linaweza kumaanisha kuogopa kwa hofu kuu, lakini katika muktadha huu linaweza pia kujumuisha kicho mbele ya hukumu ya Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au “watamdhihaki.” Kitenzi cha Kiebrania kimsingi humaanisha “kucheka,” huku muktadha ukidokeza dhihaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִרְאוּ
  choice: wataona
  rationale: Ni Qal imperfect nafsi ya tatu wingi ya ראה. “Wataona” huhifadhi maana ya moja kwa moja ya kuona au kushuhudia, pamoja na mwelekeo wa wakati ujao katika mfuatano huu wa kishairi.
- source_word: צַדִּיקִים
  choice: wenye haki
  rationale: Kivumishi cha wingi kimetumiwa kama nomino. “Wenye haki” ni Kiswahili cha kawaida na chenye hadhi kinachohifadhi kundi la kimaadili linalokusudiwa.
- source_word: וְיִירָאוּ
  choice: kuogopa
  rationale: Ni Qal imperfect nafsi ya tatu wingi ya ירא. Katika muundo “wataona na kuogopa,” alama ya wakati ujao inaeleweka kwa vitenzi vyote viwili. “Kuogopa” huhifadhi uwezekano wa hofu na pia kicho mbele ya hukumu ya Mungu bila kuamua maana moja pekee.
- source_word: וְעָלָיו
  choice: -m- katika “watamcheka”
  rationale: Kihusishi עַל pamoja na שׂחק huonyesha mlengwa wa kicheko. Kiambishi cha yambwa “-m-” ndicho Kiswahili cha kawaida cha kuwasilisha maana ya “kumcheka.”
- source_word: יִשְׂחָקוּ
  choice: watamcheka
  rationale: Maana ya msingi ya שׂחק ni kucheka. Muktadha unadokeza dhihaka, lakini tafsiri kuu inadumisha maana ya msingi badala ya kuitafsiri waziwazi kuwa “watamdhihaki.”
theological_decisions:
- issue: Maana ya kuogopa baada ya kushuhudia hukumu
  choice: kuogopa
  alternative: kuwa na hofu; kuwa na kicho
  rationale: Mstari unaonyesha wenye haki wakishuhudia hukumu ya Mungu juu ya mwovu. “Kuogopa” huhifadhi mvutano kati ya hofu ya hukumu na kicho mbele ya Mungu, bila kuifupisha kuwa woga tu au heshima ya ibada tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wenye haki” ni wazi kwa wasomaji wa kawaida. Muundo “wataona na kuogopa” ni wa asili katika Kiswahili na unadumisha ufupi wa ushairi wa Kiebrania; “nao” huonyesha hatua inayofuata kwa mkazo. Alama ya nukta mbili imehifadhiwa kwa kuwa mstari unaongoza kwenye kauli inayofuata.
