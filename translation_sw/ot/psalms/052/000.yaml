lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa kiongozi wa waimbaji
  rationale: Katika vichwa vya Zaburi, neno hili humwelekezea au humhusisha kiongozi wa uimbaji na zaburi hiyo. Tafsiri hii ni ya kawaida na inaeleweka, huku «kwa» ikihifadhi uwezekano wa maana ya «kwa ajili ya» au «kwa/tolewa kwa» kiongozi huyo.
- source_word: מַשְׂכִּיל
  choice: Maskili
  rationale: Hili linaonekana kuwa jina la aina ya utungo au maelekezo ya muziki, lakini maana yake kamili haijulikani. Kulihamisha kama «Maskili» huepuka kulifafanua kwa uhakika usiokuwapo katika Kiebrania.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Muundo wa Kiebrania unaweza kuonyesha utunzi, umiliki, wakfu, au uhusiano. «Ya Daudi» ni usemi mfupi na wa kawaida unaodumisha upana huo kuliko «iliyoandikwa na Daudi».
theological_decisions:
- issue: Uandishi au uhusiano unaodokezwa na לְדָוִד
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi; kwa ajili ya Daudi; inayohusiana na Daudi
  rationale: Kichwa cha Kiebrania hakisemi bila utata kwamba Daudi ndiye mwandishi. Tafsiri haipaswi kugeuza uhusiano huo kuwa dai la moja kwa moja kuhusu uandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi inayofaa kichwa cha Zaburi na kinachoeleweka kwa msomaji wa kawaida. «Maskili» imehifadhiwa kama istilahi ya Kiebrania kwa sababu maana yake mahususi haijulikani; maelezo yametolewa katika tanbihi.
