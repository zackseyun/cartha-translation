base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/009.yaml
  text: But as for me[a], I am like a flourishing olive tree in the house of God[b]; I trust in the steadfast love of God forever and ever.
translation:
  language: sw
  text: Lakini mimi ni kama mzeituni unaostawi[a] katika nyumba ya Mungu; ninautumainia upendo thabiti[b] wa Mungu milele na milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mzeituni wenye majani mabichi” au “mzeituni wenye uhai.” Neno la Kiebrania linasisitiza uhai na ustawi wa mti.
    reason: lexical_alternative
  - marker: b
    text: Maneno “upendo thabiti” hutafsiri neno la Kiebrania hesed, ambalo mara nyingi humaanisha upendo wa Mungu wenye uaminifu na wa kudumu; pia linaweza kutafsiriwa “fadhili,” “rehema,” au “upendo wa agano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Lakini mimi
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha tofauti kati ya msemaji na mtu mwovu aliyetajwa katika muktadha uliotangulia.
- source_word: כְּזַיִת
  choice: kama mzeituni
  rationale: Kiambishi כ־ kinaonyesha ulinganisho, na זַיִת hapa ni mti wa zeituni kulingana na taswira ya kishairi.
- source_word: רַעֲנָן
  choice: unaositawi
  rationale: Neno hili linaonyesha uhai wenye nguvu na hali ya kuwa kijani na kustawi, si rangi ya kijani pekee.
- source_word: בְּבֵית אֱלֹהִים
  choice: katika nyumba ya Mungu
  rationale: Tafsiri hii ya moja kwa moja inahifadhi taswira ya mahali patakatifu au hekalu.
- source_word: בָּטַחְתִּי
  choice: ninautumainia
  rationale: Kauli timilifu ya Kiebrania inaweza kueleza msimamo thabiti unaoendelea; wakati wa sasa unafaa kwa ungamo hili la kudumu.
- source_word: בְחֶסֶד
  choice: upendo thabiti
  rationale: חֶסֶד huunganisha upendo, uaminifu na kudumu. ‘Upendo thabiti’ ni usemi mfupi na wa kawaida unaohifadhi uzito huo bila kuufanya kuwa istilahi ya dhehebu fulani.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hili ndilo jina la kawaida la cheo cha Mungu, na hapa linamtaja Mungu wa Israeli.
- source_word: עוֹלָם וָעֶד
  choice: milele na milele
  rationale: Jozi hii ya maneno inasisitiza muda usio na mwisho; uradidi wa Kiswahili unahifadhi msisitizo huo.
theological_decisions:
- issue: Maana ya חֶסֶד katika msingi wa tumaini la mtunga zaburi
  choice: upendo thabiti
  alternative: fadhili; rehema; upendo wa agano
  rationale: Tafsiri iliyochaguliwa inabeba wazo la upendo wa Mungu ulio wa kudumu na wa uaminifu, huku ikiepuka kuingiza mfumo finyu wa kiteolojia au kupunguza maana kuwa rehema peke yake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi na uradidi wa mwisho vimehifadhiwa.
