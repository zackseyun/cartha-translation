  variant: Standard East African Swahili
source:
  edition: WLC
  text: הִנֵּ֤ה הַ/גֶּ֗בֶר לֹ֤א יָשִׂ֥ים אֱלֹהִ֗ים מָֽע֫וּזּ֥/וֹ וַ֭/יִּבְטַח בְּ/רֹ֣ב עָשְׁר֑/וֹ יָ֝עֹ֗ז בְּ/הַוָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/008.yaml
  text: Look[a], this is the man who did not make God his refuge[b], but trusted in the abundance of his riches and sought strength in his destruction.
translation:
  language: sw
  text: Tazama, huyu ndiye mtu ambaye hakumfanya Mungu kuwa kimbilio lake[a], bali aliutumainia wingi wa utajiri wake, akajitia nguvu kwa uharibifu wake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ngome yake” au “mahali pake pa usalama.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania הַוָּה linaweza pia kumaanisha “maangamizi,” “tamaa mbaya,” au “mipango ya kuharibu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Kihisishi hiki kinaelekeza usikivu kwenye mfano unaofuata; “Tazama” ni la kawaida, lenye hadhi, na huhifadhi msisitizo wa Kiebrania.
- source_word: הַגֶּבֶר
  choice: mtu
  rationale: Ingawa neno linaweza kudokeza mwanamume mwenye nguvu, hapa linamtaja mtu huyo katika kauli ya kumwonyesha; muktadha na viwakilishi vya umoja vinahifadhi rejeo hilo.
- source_word: לֹא יָשִׂים אֱלֹהִים מָעוּזוֹ
  choice: hakumfanya Mungu kuwa kimbilio lake
  rationale: Kitenzi שׂים hapa kina maana ya kumfanya au kumweka fulani awe kitu fulani, na מָעוֹז ni chanzo au mahali pa usalama na nguvu.
- source_word: וַיִּבְטַח
  choice: bali aliutumainia
  rationale: Kiunganishi kinaonyesha tofauti kati ya kutomtegemea Mungu na kutegemea mali; “bali” huonyesha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: בְּרֹב עָשְׁרוֹ
  choice: wingi wa utajiri wake
  rationale: Tafsiri hii huhifadhi maana ya רֹב, yaani wingi au ukubwa, pamoja na עֹשֶׁר, yaani utajiri.
- source_word: יָעֹז
  choice: akajifanya mwenye nguvu
  rationale: Kitenzi kinaeleza kuwa na nguvu, kuwa mwenye nguvu, au kujitia nguvu. Usemi huu unaonyesha nguvu alizojitafutia bila kuingiza maana ya ziada ya usalama au ushindi.
- source_word: בְּהַוָּתוֹ
  choice: kwa uharibifu wake
  rationale: הַוָּה ni neno lenye maana pana inayoweza kuwa uharibifu, maangamizi, tamaa mbaya, au mipango ya kuharibu. “Uharibifu” huhifadhi kiini cha maana bila kuamua kimya-kimya ikiwa ni uharibifu anaosababisha au unaomwangamiza.
theological_decisions:
- issue: Rejeo la kiume la הַגֶּבֶר
  choice: mtu
  alternative: mwanamume
  rationale: Kiswahili “mtu” si neno lenye jinsia ya kisarufi, lakini humtaja kwa usahihi mtu mmoja anayeonyeshwa hapa; hakuna haja ya kuongeza “mwanamume” kwa kuwa nguvu ya kifungu ni tabia yake, si jinsia yake.
- issue: Maana ya הַוָּה
  choice: uharibifu
  alternative: maangamizi; tamaa mbaya; mipango yake ya kuharibu
  rationale: Neno la Kiebrania lina utata wa kweli. “Uharibifu” linafaa katika muktadha wa tumaini potovu, huku tanbihi ikihifadhi maana nyingine zinazowezekana badala ya kuamua jambo hilo kidhehebu.
- issue: Nguvu ya יָעֹז
  choice: akajifanya mwenye nguvu
  alternative: akawa mwenye nguvu; akajitia nguvu
  rationale: Tafsiri iliyochaguliwa huhifadhi wazo la nguvu ya kujitegemea inayopinganishwa na kumfanya Mungu kuwa kimbilio, bila kubadili kitenzi kuwa ‘kutafuta kimbilio.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa kwa sentensi moja yenye tofauti iliyo wazi kupitia “bali.” Alama za tanbihi zimewekwa baada ya maneno yanayohusika, si baada ya “Tazama.”
