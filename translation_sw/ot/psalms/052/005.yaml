lexical_decisions:
- source_word: אָהַבְתָּ
  choice: Unapenda
  rationale: Ingawa kitenzi cha Kiebrania ni qal timilifu, katika shtaka hili la kishairi kinaonyesha mwelekeo uliothibitika; wakati wa sasa wa Kiswahili unawasilisha hali hiyo kwa kawaida. Umbo la wakati timilifu limehifadhiwa katika tanbihi kama uwezekano rasmi zaidi.
- source_word: כָל
  choice: yote
  rationale: Neno hili linaonyesha ujumla wa maneno yanayotajwa na linaambatana kiasili na wingi wa Kiswahili.
- source_word: דִּבְרֵי
  choice: maneno
  rationale: Wingi tegemezi wa דָּבָר hapa unahusu matamshi au maneno, hasa kwa kuwa mstari unamtaja ulimi.
- source_word: בָלַע
  choice: ya kuangamiza
  rationale: Neno hili linatokana na mzizi wenye maana ya kumeza au kuteketeza, na hapa linaeleza athari ya maangamizi ya maneno. 'Ya kuangamiza' ni ya asili katika Kiswahili na bado inaonyesha nguvu ya uharibifu, bila kuifanya picha isomeke kwa namna ngumu.
- source_word: לְשׁוֹן
  choice: ulimi
  rationale: Tafsiri ya moja kwa moja inadumisha sitiari ya Kiebrania inayotumia kiungo cha mwili kumaanisha usemi.
- source_word: מִרְמָה
  choice: mdanganyifu
  rationale: Nomino ya Kiebrania ina maana ya udanganyifu au hila. Kiswahili cha kawaida hutumia kivumishi 'mdanganyifu' kumweleza ulimi katika mwito huu wa moja kwa moja.
