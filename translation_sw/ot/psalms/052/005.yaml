  text: Umependa maneno yote ya maangamizi[a], ewe ulimi wa udanganyifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Unapenda maneno yote ya kuangamiza, ewe ulimi mdanganyifu.”'
