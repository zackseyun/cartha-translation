base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/010.yaml
  text: I will give thanks to you forever[a], because you have done it; I will wait for your name, for it is good[c][b], in the presence of your faithful ones.
translation:
  language: sw
  text: Nitakushukuru milele, kwa kuwa umetenda; nitatumainia jina lako[a], kwa maana ni jema[b], mbele ya waaminifu wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitalingojea jina lako.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, “kwa maana jina lako ni jema.”
    reason: clarification
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Nitakushukuru
  rationale: Hifili ya ידה hapa ina maana ya kumshukuru au kumsifu Mungu. “Nitakushukuru” inaonyesha shukrani inayoelekezwa moja kwa moja kwa Mungu na ni Kiswahili cha kawaida na chenye hadhi.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Neno hili linaonyesha muda usio na mwisho; “milele” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: כִּי עָשִׂיתָ
  choice: kwa kuwa umetenda
  rationale: כִּי inaonyesha sababu, nayo עשה inaweza kumaanisha kufanya au kutenda. Kiswahili kinaweza kutumia “umetenda” bila kuongeza kitu kisichotajwa wazi katika Kiebrania.
- source_word: וַאֲקַוֶּה שִׁמְךָ
  choice: nitalingojea jina lako
  rationale: קוה inaweza kumaanisha kungojea kwa matarajio au kutumaini. Muundo wa Kiebrania una “jina lako” kama shamirisho la moja kwa moja; tafsiri hii inadumisha picha hiyo isiyo ya kawaida na mvutano wake wa kimakusudi.
- source_word: כִּי טוֹב
  choice: kwa maana ni jema
  rationale: Kishazi cha Kiebrania ni kifupi, na “jina lako” ndilo rejeleo la karibu zaidi. Kiswahili hutumia upatanisho wa ngeli wa “jina,” hivyo “ni jema” hudumisha ufupi bila kulirudia jina.
- source_word: נֶגֶד
  choice: mbele ya
  rationale: Neno hili humaanisha mbele ya, machoni pa, au katika uwepo wa. “Mbele ya” ni fupi, ya asili, na inafaa kwa shukrani ya hadharani.
- source_word: חֲסִידֶיךָ
  choice: waaminifu wako
  rationale: חסיד hueleza watu wenye uaminifu na kujitoa katika uhusiano wao na Mungu. “Waaminifu wako” ni wazi kwa wasomaji wa sasa na huepuka maana finyu za kitaasisi ambazo “watakatifu” inaweza kudokeza.
theological_decisions:
- issue: Maana ya קוה pamoja na “jina lako”
  choice: nitalingojea jina lako
  alternative: nitalitumainia jina lako
  rationale: Tafsiri kuu inadumisha muundo na taswira ya Kiebrania, ambapo mtunga-zaburi analingojea jina la Mungu kwa matarajio. Tanbihi inaonyesha maana halali ya kutumaini bila kuifanya tafsiri hiyo ya kimafundisho kuwa ndiyo pekee.
- issue: Rejeleo la neno טוֹב, “jema”
  choice: kwa maana ni jema
  alternative: kwa maana jina lako ni jema
  rationale: Kiebrania hakirudii nomino. Kiswahili kinaweza kuhifadhi ufupi huo kwa kutumia “ni jema,” huku tanbihi ikieleza rejeleo linalowezekana zaidi bila kuficha ufupi wa matini.
- issue: Tafsiri ya neno la jumuiya ya agano חֲסִידֶיךָ
  choice: waaminifu wako
  alternative: watauwa wako; watakatifu wako
  rationale: “Waaminifu wako” huhifadhi wazo la uaminifu na kujitoa kwa Mungu bila kuingiza maana maalumu ya baadaye ya kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kishairi na ufupi wa Kiebrania umehifadhiwa; usemi usio wa kawaida “kulingojea jina” umeachwa katika matini kuu ili kutopoteza taswira ya chanzo, huku maana ya kutumaini ikitolewa katika tanbihi.
