id: PSA.52.4
reference: Psalms 52:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אָהַ֣בְתָּ רָּ֣ע מִ/טּ֑וֹב שֶׁ֓קֶר מִ/דַּבֵּ֖ר צֶ֣דֶק סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/004.yaml
  text: You have loved evil more than good[a], falsehood more than speaking righteousness. Selah
translation:
  language: sw
  text: Umependa uovu kuliko wema, uongo kuliko kusema yaliyo ya haki.[a] Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kusema kwa haki,” au “kusema yaliyo sawa.”
    reason: Neno צֶדֶק linaweza kueleza haki yenyewe, namna ya kusema iliyo nyofu, au mambo yaliyo sawa.
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: Umependa
  rationale: Kitenzi cha Qal timilifu, nafsi ya pili umoja wa kiume, kinamwelekea moja kwa moja mtu mwovu. Wakati timilifu wa Kiswahili unaonyesha upendo uliojidhihirisha na ambao shtaka lake bado lina uzito sasa.
- source_word: רָּע
  choice: uovu
  rationale: Neno hili ni kitu kinachopendwa na linalinganishwa na wema; hapa maana yake ya kimaadili inafaa kuliko ‘madhara’ au ‘jambo baya.’
- source_word: מִטּוֹב
  choice: kuliko wema
  rationale: 'Kiambishi מן baada ya kitenzi cha upendeleo kinaonyesha ulinganisho: kuchagua uovu badala ya wema. ‘Kuliko’ huhifadhi nguvu hiyo kwa Kiswahili cha kawaida.'
- source_word: שֶׁקֶר
  choice: uongo
  rationale: Nomino hii inaweza kumaanisha uongo, udanganyifu, au hali ya kutokuwa kweli. ‘Uongo’ ni ya asili na pana vya kutosha katika muktadha wa usemi.
- source_word: מִדַּבֵּר
  choice: kuliko kusema
  rationale: מן ya pili inaendeleza ulinganisho wa upendeleo, nayo דַּבֵּר inaeleza tendo la kusema. Muundo huu unahifadhi usambamba wa kishairi.
- source_word: צֶדֶק
  choice: yaliyo ya haki
  rationale: Katika kulinganishwa na uongo, neno hili linaeleza usemi ulionyooka na unaopatana na haki. ‘Yaliyo ya haki’ huhifadhi uzito wa kimaadili wa צֶדֶק bila kulifanya limaanishe tu ‘ukweli.’
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya istilahi hii ya kiliturujia au kimuziki haijulikani kwa hakika; imenukuliwa kwa matamshi badala ya kutafsiriwa kwa kubahatisha.
theological_decisions:
- issue: Maana ya צֶדֶק katika muktadha wa usemi
  choice: yaliyo ya haki
  alternative: kusema kwa haki; kusema yaliyo sawa
  rationale: Muktadha unalinganisha uongo na usemi mnyofu. ‘Haki’ huhifadhi maana ya kimaadili na ya kiteolojia ya mzizi huu, huku tanbihi ikionyesha uwezekano wa kuelewa namna ya kusema au jambo linalosemwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi na wa usambamba umehifadhi mtindo wa kishairi wa Kiebrania; ‘Sela’ imeachwa kama istilahi isiyotafsiriwa.
