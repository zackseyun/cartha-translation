  variant: Standard East African Swahili
source:
  edition: WLC
  text: גַּם אֵל֮ יִתָּצְ/ךָ֪ לָ֫/נֶ֥צַח יַחְתְּ/ךָ֣ וְ/יִסָּחֲ/ךָ֣ מֵ/אֹ֑הֶל וְ/שֵֽׁרֶשְׁ/ךָ֨ מֵ/אֶ֖רֶץ חַיִּ֣ים סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/006.yaml
  text: But God will also tear you down forever[a]; he will snatch you up and pull you from your tent, and uproot you from the land of the living[c][b]. Selah
translation:
  language: sw
  text: Lakini Mungu pia atakubomoa milele; atakunyakua[a] na kukuvuta kutoka hemani mwako[b], na kukung’oa[c] kutoka katika nchi ya walio hai. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakukamata” au “atakuondoa.” Kitenzi cha Kiebrania ni adimu na kinaonyesha kuondolewa kwa nguvu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “kutoka hemani”; yaani, kutoka katika makao yako.
    reason: lexical_alternative
  - marker: c
    text: Kwa maana halisi, “mzizi wako kutoka katika nchi ya walio hai”; maana yake ni “kukung’oa kutoka katika nchi ya walio hai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Lakini ... pia
  rationale: Neno hili kwa kawaida humaanisha ‘pia’ au ‘naam’; hapa muktadha unaonyesha utofautishaji na majivuno yaliyotangulia, hivyo ‘Lakini ... pia’ huhifadhi maana zote mbili.
- source_word: אֵל
  choice: Mungu
  rationale: Hili ni neno la kawaida la Kiebrania linalomtaja Mungu; ‘Mungu’ ni tafsiri ya asili na wazi katika Kiswahili.
- source_word: יִתָּצְךָ
  choice: atakubomoa
  rationale: Kitenzi נתץ hutumiwa kwa kubomoa au kuangusha kwa nguvu, hasa majengo; ‘atakubomoa’ huhifadhi taswira hiyo kali.
- source_word: לָנֶצַח
  choice: milele
  rationale: Maana yake ya kawaida hapa ni kudumu bila mwisho; ‘milele’ huhifadhi ukamilifu wa hukumu bila kuongeza ufafanuzi wa kiteolojia.
- source_word: יַחְתְּךָ
  choice: atakunyakua
  rationale: Kitenzi hiki adimu kinaonyesha kuchukua au kuondoa kwa nguvu; ‘atakunyakua’ huwasilisha tendo la ghafla na lenye nguvu.
- source_word: וְיִסָּחֲךָ
  choice: na kukuondoa
  rationale: Mzizi נסח una maana ya kung’oa, kuvuta au kuondoa; hapa ‘kukuondoa’ huungana kwa kawaida na kirai kinachofuata kuhusu hema.
- source_word: מֵאֹהֶל
  choice: kutoka hemani mwako
  rationale: אֹהֶל ni ‘hema’; taswira halisi imehifadhiwa, huku ‘mwako’ ikionyesha makao ya mtu anayehukumiwa kulingana na maana ya mstari.
- source_word: וְשֵׁרֶשְׁךָ
  choice: na kukung’oa
  rationale: Kwa muundo wa maneno ni ‘na mzizi wako,’ lakini ushairi umeacha kitenzi; ‘kuk ung’oa’ huwasilisha maana wazi huku ikihifadhi taswira ya mizizi.
- source_word: מֵאֶרֶץ חַיִּים
  choice: kutoka katika nchi ya walio hai
  rationale: Hii ni nahau ya Kiebrania kwa ulimwengu wa wenye uhai, tofauti na mauti; tafsiri hii ni sahihi na inaeleweka.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya istilahi hii ya kishairi au kimuziki haijulikani; imenukuliwa kwa matamshi badala ya kutafsiriwa kwa kubahatisha.
theological_decisions:
- issue: Asili ya hukumu inayoelezwa na לָנֶצַח
  choice: milele
  alternative: kabisa; mara moja na kwa kudumu
  rationale: Kiebrania kwa kawaida huonyesha kudumu milele. Tafsiri hii huhifadhi uzito wa hukumu ya Mungu bila kuamua zaidi ya yale yanayosemwa na mstari kuhusu hali yake ya kimetafizikia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Taswira za kubomoa, hema na kung’oa zimehifadhiwa. ‘Sela’ imeandikwa kama istilahi isiyotafsiriwa. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
