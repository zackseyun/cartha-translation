  yaml_path: translation/ot/psalms/052/003.yaml
  text: You devise destruction[a]; your tongue is like a sharpened razor[c][b], working deceit.
translation:
  language: sw
  text: Unapanga maangamizi[a]; ulimi wako ni kama wembe ulionolewa, ukitenda hila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uharibifu” au “madhara yenye kuharibu.” Nomino ya Kiebrania iko katika wingi, lakini hutumiwa kwa maana ya jumla ya madhara ya uharibifu.
    reason: lexical_alternative
  - marker: b
    text: Au, “wewe ni mtenda hila.” Kirai cha Kiebrania humweleza mtu anayesemeshwa kuwa atendaye udanganyifu; kimetolewa kwa mtindo mfupi wa kishairi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַוּוֹת
  choice: maangamizi
  rationale: Nomino ya wingi inaonyesha madhara yenye kuleta uharibifu; Kiswahili ‘maangamizi’ huhifadhi uzito na dhana yake ya jumla kwa mtindo wa kawaida.
- source_word: תַּחְשֹׁב
  choice: unapanga
  rationale: Kitenzi kinaonyesha kuwaza kwa makusudi au kutunga mpango wa madhara. Umbo la Kiebrania linaweza kusomwa kama nafsi ya pili ya kiume (‘unapanga’) au nafsi ya tatu ya kike (‘ulimi wako unapanga’); tafsiri mbadala imewekwa katika tanbihi.
- source_word: לְשׁוֹנֶךָ
  choice: ulimi wako
  rationale: Taswira halisi ya kiungo cha mwili imehifadhiwa ili kuonyesha usemi kama chombo cha kudhuru.
- source_word: כְּתַעַר מְלֻטָּשׁ
  choice: kama wembe ulionolewa
  rationale: ‘Wembe’ hutoa tashbihi ya chombo cha kukata, na ‘ulionolewa’ huwasilisha blade iliyofanywa kuwa kali kuliko neno linalomaanisha kung’arishwa tu.
- source_word: עֹשֵׂה רְמִיָּה
  choice: ukitenda kwa hila
  rationale: Kauli hii huonyesha utendaji wa udanganyifu au hila. Kiambishi ‘u-’ katika Kiswahili kinaweza kurejelea mtu anayeambiwa au ‘ulimi,’ hivyo kinasaidia kuhifadhi mvutano wa kishairi.
theological_decisions:
- issue: Mhusika wa תַּחְשֹׁב na uhusiano wa לְשׁוֹנֶךָ
  choice: Unapanga maangamizi; ulimi wako ni kama…
  alternative: Ulimi wako unapanga maangamizi; ni kama…
  rationale: Umbo תַּחְשֹׁב linaweza kuwa nafsi ya pili ya kiume au nafsi ya tatu ya kike, na ‘ulimi’ ni wa kike katika Kiebrania. Ingawa mgawanyo wa kishairi unaweza kuunga mkono kusoma ‘ulimi wako’ pamoja na kitenzi, usomaji wa nafsi ya pili pia unawezekana. Chaguo kuu linafuata safu ya mashauriano, huku tanbihi ikihifadhi usomaji mwingine wa kweli wa chanzo.
- issue: Mrejeo wa עֹשֵׂה רְמִיָּה
  choice: ukitenda kwa hila
  alternative: ewe mtenda hila
  rationale: Kirai kinaweza kueleweka kama maelezo ya mtu anayeambiwa, au kuhusishwa kishairi na ulimi/wembe. Tafsiri kuu haifungi maana kwa namna isiyo ya lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. Taswira za ‘ulimi’ na ‘wembe’ zimehifadhiwa; sentensi ni fupi na kali ili kuendana na shtaka la kishairi.
