lexical_decisions:
- source_word: בְּבֹוא
  choice: wakati ... alipokuja
  rationale: ב pamoja na kitenzi-jina cha בוא huanzisha kishazi cha wakati; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: דּוֹאֵג
  choice: Doegi
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: הָאֲדֹמִי
  choice: Mwedomu
  rationale: Ni jina la asili au utaifa linalomtambulisha Doegi kuwa mtu wa Edomu.
- source_word: וַיַּגֵּד
  choice: kumpasha ... habari
  rationale: Hifili ya נגד hapa ina maana ya kutoa taarifa; nahau hii ya Kiswahili inafaa katika muktadha wa kumpelekea Sauli habari.
- source_word: לְשָׁאוּל
  choice: Sauli
  rationale: Jina la mtu lenye kiashiria cha mlengwa; katika Kiswahili kiambishi cha yambwa katika ‘kumpasha’ kinaonyesha uhusiano huo.
- source_word: וַיֹּאמֶר לוֹ
  choice: akamwambia
  rationale: Inahifadhi mfuatano wa simulizi wa Kiebrania na inaonyesha wazi kuwa Doegi alisema maneno haya kwa Sauli.
- source_word: בָּא
  choice: amefika
  rationale: Timilifu ya בוא katika taarifa ya moja kwa moja inaweza kuonyesha tendo lililokamilika lenye umuhimu wa sasa; ‘amefika’ ni ya kawaida zaidi kuliko ‘amekuja’ mbele ya mahali panapotajwa.
- source_word: דָוִד
  choice: Daudi
  rationale: Umbo la kawaida la jina hili katika Kiswahili.
- source_word: אֶל בֵּית
  choice: nyumbani kwa
  rationale: Inaeleza kwenda kwenye nyumba au makao ya Ahimeleki kwa Kiswahili cha kawaida, bila kuifanya kuwa ‘jamaa’ au ‘ukoo’ wake.
- source_word: אֲחִימֶלֶךְ
  choice: Ahimeleki
  rationale: Jina limetoholewa kwa mfumo wa sauti unaosomeka kwa urahisi katika Kiswahili.
