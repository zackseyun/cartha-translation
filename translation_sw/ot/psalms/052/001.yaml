  text: when Doeg the Edomite came and told Saul[a], saying to him, “David has come to the house of Ahimelech.”
translation:
  language: sw
  text: wakati Doegi, Mwedomu, alipokuja na kumpasha Sauli habari, akisema, “Daudi amefika katika nyumba ya Ahimeleki.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Daudi alifika katika nyumba ya Ahimeleki.” Kitenzi timilifu cha Kiebrania katika taarifa hii kinaweza kutafsiriwa kwa wakati uliopita sahili au kwa hali inayoonyesha tendo lililokamilika lenye umuhimu wa sasa.
