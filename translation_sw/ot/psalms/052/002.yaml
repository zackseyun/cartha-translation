  text: Kwa nini unajivunia uovu, ewe shujaa? Upendo thabiti wa Mungu hudumu siku nzima.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּתְהַלֵּל בְּרָעָה
  choice: unajivunia uovu
  rationale: Muundo wa Kiebrania unauliza kwa nini mhusika anajisifu au kujivunia uovu; Kiswahili hiki ni cha kawaida na kinahifadhi shutuma hiyo.
- source_word: הַגִּבּוֹר
  choice: ewe shujaa
  rationale: Neno linaweza kumaanisha mtu mwenye nguvu au shujaa. Kauli ya moja kwa moja yenye 'ewe' inahifadhi usemi wa kumwambia mhusika, pamoja na uwezekano wa kejeli katika muktadha.
- source_word: חֶסֶד אֵל
  choice: upendo thabiti wa Mungu
  rationale: חֶסֶד huonyesha upendo wa kudumu na wa uaminifu; 'upendo thabiti' ni wazi kwa msomaji wa kisasa bila kubana maana kuwa rehema pekee.
- source_word: כָּל־הַיּוֹם
  choice: mchana kutwa
  rationale: Nahau hii ya Kiswahili huwasilisha maana ya 'siku nzima' au 'daima katika siku hiyo' kwa ufupi na kwa mtiririko wa kishairi.
theological_decisions:
- issue: Uhusiano wa kishazi חֶסֶד אֵל כָּל־הַיּוֹם na swali lililotangulia
  choice: 'Kukitafsiri kama tamko tofauti: “Upendo thabiti wa Mungu wadumu mchana kutwa.”'
  alternative: Kukihusisha moja kwa moja na kujivuna, kwa maana kama “wewe uliye katika upendo thabiti wa Mungu mchana kutwa.”
  rationale: Mgawanyo wa kimapokeo na muktadha wa kulinganisha uovu wa mwenye nguvu na חסד ya Mungu vinaunga mkono tamko tofauti, huku tafsiri isiongeze kiunganishi kisichokuwapo.
- issue: Nguvu ya kisarufi ya kishazi kisicho na kitenzi חֶסֶד אֵל כָּל־הַיּוֹם
  choice: “wadumu”
  alternative: “upo” au “ni wa mchana kutwa”
  rationale: Kiebrania hakina kitenzi wazi. 'Wadumu' hutoa Kiswahili asilia na kuonyesha uthabiti unaodokezwa, bila kulifanya tamko kuwa fundisho maalumu zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. 'Ewe shujaa' huhifadhi mwito wa moja kwa moja; sentensi ya pili imetumia mpangilio wa kawaida wa Kiswahili na sauti ya zaburi.
