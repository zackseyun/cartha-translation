    text: Au, “huapa dhidi yangu,” au, “hunitumia kama laana katika viapo vyao.” Usemi wa Kiebrania ni mgumu; huenda maana yake ni kwamba jina au hali ya mtunga zaburi imetumiwa katika viapo vya dharau na laana.
