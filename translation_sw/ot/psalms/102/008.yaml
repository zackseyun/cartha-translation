lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Mchana kutwa
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha jambo linaloendelea siku nzima.
- source_word: חֵרְפוּנִי
  choice: hunitukana
  rationale: Kitenzi kina maana ya kumshambulia mtu kwa maneno ya dharau; ‘hunitukana’ ni wazi, cha sasa, na kinahifadhi uzito wa uadui katika muktadha.
- source_word: אֹיְבַי
  choice: adui zangu
  rationale: Hili ni tafsiri ya moja kwa moja na ya kawaida ya nomino yenye kiambishi cha umilikaji.
- source_word: מְהוֹלָלַי
  choice: wanaonidhihaki
  rationale: Umbo la Kiebrania ni gumu, lakini katika muktadha linaelekea kumaanisha watu wanaomtendea mtunga zaburi kwa dharau au kejeli.
- source_word: בִּי נִשְׁבָּעוּ
  choice: huapa kwa kunitaja
  rationale: Nִשְׁבָּעוּ kimsingi ni ‘huapa,’ huku בִּי ikimtaja mtunga zaburi kuwa kitu kinachotumiwa katika kiapo. ‘Kwa kunitaja’ ni Kiswahili cha kawaida kinachohifadhi wazo hilo bila kuamua kabisa kama ni kiapo au laana.
