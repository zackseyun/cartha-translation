  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati mataifa na falme zinapokusanyika pamoja”; umbo la Kiebrania linaweza kueleweka kuwa zinakusanywa au zinakusanyika.
