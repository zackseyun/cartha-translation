lexical_decisions:
- source_word: בְּ/הִקָּבֵץ
  choice: wakati ... yanapokusanywa
  rationale: בְּ pamoja na kitenzi-jina cha Nifali huonyesha wakati, yaani ‘wakati wa kukusanywa.’ Kauli tendwa ya Kiswahili inaakisi vizuri umbo la Nifali na pia huepuka kulazimisha mtendaji ambaye hakutajwa.
- source_word: עַמִּים
  choice: mataifa
  rationale: Katika muktadha huu עַמִּים humaanisha makundi ya watu au mataifa kwa wingi. ‘Mataifa’ ni neno la kawaida na lenye hadhi katika Kiswahili, bila kuifanya maana iwe tu nchi za kisiasa za kisasa.
- source_word: יַחְדָּו
  choice: pamoja
  rationale: Neno hili linasisitiza kukusanyika kwa ushirika; ‘pamoja’ ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: וּ/מַמְלָכוֹת
  choice: pamoja na falme
  rationale: מַמְלָכוֹת ni falme au maeneo yanayotawaliwa. ‘Pamoja na falme’ huhifadhi uratibu wake na ‘mataifa’ na kutoa Kiswahili kinachoeleweka.
- source_word: לַ/עֲבֹד
  choice: ili kumtumikia
  rationale: לְ hapa huonyesha kusudi, na עבד inapokuwa na Mungu kama yambwa inaweza kumaanisha kumtumikia au kumwabudu. ‘Kumtumikia’ huhifadhi upana wa kimsamiati.
- source_word: אֶת יְהוָה
  choice: Yahwe
  rationale: אֶת ni kiashiria cha yambwa mahsusi na haitafsiriwi kwa neno tofauti; jina la agano יהוה limetolewa kama ‘Yahwe.’
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina la Mungu יהוה moja kwa moja. ‘Yahwe’ hulihifadhi kama jina maalumu badala ya kulibadilisha kuwa cheo.
- issue: Ikiwa עבד ifupishwe kuwa ibada pekee
  choice: kumtumikia
  alternative: kumwabudu
  rationale: Kitenzi עבד kinaweza kujumuisha ibada Mungu anapokuwa yambwa, lakini maana yake ni pana zaidi. Tafsiri kuu imehifadhi ‘kutumikia,’ huku maana ya ‘kuabudu’ ikiwekwa katika tanbihi.
- issue: Kauli ya בְּהִקָּבֵץ
  choice: yanapokusanywa
  alternative: yanapokusanyika
  rationale: Umbo la Nifali linaweza kuwakilishwa kwa kauli tendwa au kwa tendo la kujikusanya. Kauli tendwa inaakisi umbo la Kiebrania bila kumtaja mkusanyaji, lakini uwezekano wa kauli ya kujitenda umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na hadhi inayofaa Zaburi. ‘Pamoja na falme’ hutumiwa ili kuweka wazi kwamba falme zinashiriki katika kukusanywa bila kufuta kabisa mvutano wa mpangilio wa Kiebrania.
