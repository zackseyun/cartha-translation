lexical_decisions:
- source_word: אַל תַּסְתֵּר
  choice: Usinifiche
  rationale: 'Kikanushi pamoja na kitenzi cha Kiebrania kinaonyesha ombi la kusihi: ‘usinifiche.’'
- source_word: פָּנֶיךָ
  choice: uso wako
  rationale: Huhifadhi taswira halisi ya Kiebrania, ambayo pia inaweza kumaanisha uwepo au fadhili za Mungu.
- source_word: בְּיוֹם צַר לִי
  choice: siku ya dhiki yangu
