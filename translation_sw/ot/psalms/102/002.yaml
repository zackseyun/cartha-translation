- source_word: בְּיוֹם אֶקְרָא
  choice: Siku nitakapokuita
  rationale: Huhifadhi urudiaji wa ‘siku’ na kutafsiri wito wa sala kwa Kiswahili cha kawaida.
- source_word: מַהֵר עֲנֵנִי
  choice: unijibu upesi
  rationale: Hutoa kwa uwazi ombi la jibu la haraka; Kiebrania pia kinaweza kueleweka kama agizo la ‘fanya haraka kunijibu.’
theological_decisions:
- issue: Lugha ya kumwelezea Mungu kwa taswira ya mwili (‘uso,’ ‘sikio’)
  choice: Kuhifadhi taswira halisi katika matini kuu
  alternative: Kutafsiri maana moja kwa moja kuwa ‘uwepo wako’ na ‘unisikilize’
  rationale: Taswira hizo za kishairi zinaonyesha fadhili, uwepo na usikivu wa Mungu bila kulazimisha dai kwamba Mungu ana mwili.
- issue: Urudiaji wa kishairi wa בְּיוֹם (‘siku’)
  choice: Kuhifadhi ‘siku’ katika vipashio vyote viwili
  alternative: Kutumia ‘ninapokuwa katika dhiki’ na ‘ninapokuita’
  rationale: Urudiaji huo ni sehemu ya muundo na msisitizo wa mstari wa Kiebrania.
