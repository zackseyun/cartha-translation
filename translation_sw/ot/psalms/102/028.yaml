  text: The children of your servants will dwell[a], and their offspring will be established before you.
translation:
  language: sw
  text: Watoto wa watumishi wako watakaa, na uzao wao utaimarishwa mbele zako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Watoto wa
  rationale: Nomino hii katika hali ya kutegemea inaweza kumaanisha wana au watoto; hapa “watoto” huwasilisha kwa kawaida maana ya kizazi bila kuifanya ihusu wanaume pekee.
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Katika zaburi inayomwelekea Mungu, “watumishi” ni tafsiri ya kawaida na inayofaa ya עֶבֶד; maana ya utumwa haijasisitizwa hapa.
- source_word: יִשְׁכּוֹנוּ
  choice: watakaa
  rationale: Kitenzi שכן humaanisha kukaa au kuishi mahali. “Watakaa” huhifadhi maana hiyo bila kuongeza wazi wazo la usalama ambalo halitajwi moja kwa moja.
- source_word: וְזַרְעָם
  choice: na wazao wao
  rationale: זֶרַע hapa ni jina la pamoja linalomaanisha uzao au vizazi; “wazao” ni Kiswahili cha sasa na cha kawaida.
- source_word: לְפָנֶיךָ
  choice: mbele zako
  rationale: Huhifadhi kwa ufupi na kwa lugha ya kizaburi maana halisi ya kuwa mbele ya Mungu, yaani katika uwepo wake.
- source_word: יִכּוֹן
  choice: wataimarishwa
  rationale: Nifali ya כון ina maana ya kuwekwa imara au kuthibitishwa. “Wataimarishwa” huhifadhi hali ya kutendwa na wazo la uthabiti wa kudumu.
theological_decisions:
- issue: Iwapo ahadi hii ifafanuliwe wazi kuwa ya agano au ya mwisho wa nyakati
  choice: Kauli imeachwa kuwa ahadi ya wazao wa watumishi wa Mungu kukaa na kuimarishwa mbele zake.
  alternative: Kuitaja moja kwa moja kuwa ahadi ya agano kwa Israeli au ahadi ya wokovu wa mwisho.
  rationale: Kiebrania hakibainishi hapa utaratibu wala upeo kamili wa kitheolojia; tafsiri inalinda mvutano huo bila kuingiza mfumo maalumu wa mafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo sambamba wa mistari miwili umehifadhiwa; “mbele zako” linaendeleza ladha ya kizaburi bila kuwa la kizamani.
