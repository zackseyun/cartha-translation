lexical_decisions:
- source_word: לִשְׁמֹעַ
  choice: aisikie
  rationale: Kitenzi cha kusudi/matokeo katika muktadha mpana; ‘aisikie’ ni cha moja kwa moja na hudumisha muundo sambamba wa vitenzi.
- source_word: אֶנְקַת
  choice: kuugua kwa
  rationale: ‘Kuugua’ huwasilisha sauti nzito ya mateso na dhiki kuliko ‘kuhema’.
- source_word: אָסִיר
  choice: mfungwa
  rationale: Neno hili humaanisha mtu aliyefungwa au kuwekwa kifungoni; ‘mfungwa’ ni la kawaida na wazi katika Kiswahili cha sasa.
- source_word: לְפַתֵּחַ
  choice: awaachilie huru
  rationale: Ingawa mzizi wake una maana halisi ya ‘kufungua,’ hapa unahusu kuwafungulia njia ya kutoka kifungoni au hukumu; ‘kuwaachilia huru’ ni Kiswahili cha asili.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Huhifadhi kwa karibu taswira ya muundo wa Kiebrania ‘wana wa,’ bila kuifasiri kimya kimya.
- source_word: תְמוּתָה
  choice: mauti
  rationale: ‘Mauti’ hudumisha taswira ya Kiebrania na sauti ya kishairi; maana ya nahau hiyo imefafanuliwa katika tanbihi.
