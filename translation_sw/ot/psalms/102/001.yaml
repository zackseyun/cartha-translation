source:
  edition: WLC
  text: יְ֭הוָה שִׁמְעָ֣/ה תְפִלָּתִ֑/י וְ֝/שַׁוְעָתִ֗/י אֵלֶ֥י/ךָ תָבֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/001.yaml
  text: O Yahweh[a], hear my prayer, and let my cry come to you.
translation:
  language: sw
  text: 'Ee Yahweh[a], sikia sala yangu;

    kilio changu kikufikie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa desturi limetafsiriwa “BWANA.” Namna nyingine ni “Yehova.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Ee Yahweh
  rationale: Jina la Mungu YHWH limetoholewa kama “Yahweh,” huku “Ee” likionyesha mwito wa moja kwa moja unaofaa katika ombi.
- source_word: שִׁמְעָה
  choice: sikia
  rationale: 'Kauli ya amri ya nafsi ya pili umoja imetafsiriwa moja kwa moja kama ombi la dhati: “sikia.”'
- source_word: תְפִלָּתִי
  choice: sala yangu
  rationale: תְּפִלָּה humaanisha kwa kawaida sala; “sala yangu” ni usemi wa kawaida, wenye heshima katika Kiswahili.
- source_word: וְשַׁוְעָתִי
  choice: kilio changu
  rationale: שַׁוְעָה ni kilio, mara nyingi kilio cha kuomba msaada. “Kilio changu” kinahifadhi ufupi na uzito wa kihisia bila kuongeza maneno yasiyotajwa wazi.
- source_word: אֵלֶיךָ תָבֹוא
  choice: kikufikie
  rationale: Kirai cha Kiebrania hueleza kilio kikija kwa Mungu. Katika Kiswahili, “kikufikie” huwasilisha kwa asili mwelekeo huo na nguvu ya ombi ya kitenzi hicho.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandiko ya Kiebrania yanatumia jina binafsi YHWH, hivyo “Yahweh” linahifadhi jina hilo badala ya kulibadili kuwa cheo. Tanbihi inaonyesha desturi nyingine za kulitafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa mistari miwili unahifadhi usambamba wa kishairi wa Zaburi; “kikufikie” ni wa asili zaidi kuliko tafsiri neno kwa neno “kije kwako.”
