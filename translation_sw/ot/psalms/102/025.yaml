translation:
  language: sw
  text: Tangu kale uliweka msingi wa dunia[a], na mbingu ni kazi ya mikono yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tangu kale uliiimarisha dunia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנִים
  choice: Hapo zamani
  rationale: Kirai hiki cha wakati humaanisha zamani au tangu kale; “Hapo zamani” ni Kiswahili cha sasa kilicho wazi na chenye hadhi ya kishairi.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: Kwa kuwa neno hili linalinganishwa na “mbingu,” maana yake hapa ni ya ulimwengu mzima, si nchi fulani.
- source_word: יָסַדְתָּ
  choice: uliiweka misingi ya
  rationale: Kitenzi יסד huonyesha kuweka msingi au kuasisi. Kirai hiki kinahifadhi taswira halisi ya ujenzi iliyomo katika Kiebrania.
- source_word: וּמַעֲשֵׂה
  choice: ni kazi
  rationale: Muundo wa Kiebrania ni kishazi kisicho na kitenzi kinachotamkwa; “ni” hukamilisha sentensi kwa Kiswahili bila kuongeza maana mpya.
- source_word: יָדֶיךָ
  choice: ya mikono yako
  rationale: Huhifadhi usemi wa Kiebrania unaomweleza Mungu kwa taswira ya fundi, bila kuufifisha.
- source_word: שָׁמָיִם
  choice: mbingu
  rationale: “Mbingu” ni tafsiri ya kawaida yenye hadhi na inalingana vizuri na “dunia” katika usambamba wa ulimwengu mzima.
theological_decisions:
- issue: Lugha ya uumbaji inayotumiwa moja kwa moja kumhusu Mungu
  choice: 'Kudumisha nafsi ya pili: Mungu ndiye aliyeiweka misingi ya dunia, na mbingu ni kazi ya mikono yake.'
  alternative: Kugeuza kuwa kauli isiyo ya moja kwa moja au kupunguza taswira ya “mikono.”
  rationale: Mstari wenyewe unamhusisha Mungu moja kwa moja na uumbaji katika sala ya kishairi. Tafsiri inadumisha dai hilo pamoja na taswira yake bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa mstari unahifadhi usambamba wa “dunia” na “mbingu” pamoja na taswira ya msingi na mikono.
