  text: הֵ֤מָּה יֹאבֵדוּ֮ וְ/אַתָּ֪ה תַ֫עֲמֹ֥ד וְ֭/כֻלָּ/ם כַּ/בֶּ֣גֶד יִבְל֑וּ כַּ/לְּב֖וּשׁ תַּחֲלִיפֵ֣/ם וְֽ/יַחֲלֹֽפוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/026.yaml
  text: They will perish[a], but you will remain; all of them will wear out like a garment. Like clothing you will change them[b], and they will pass away.
translation:
  language: sw
  text: Hizo zitaangamia, lakini wewe utadumu; zote zitachakaa kama vazi. Kama mavazi utazibadilisha[a], nazo zitapita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utaziweka nyingine badala yake.” Kitenzi cha Kiebrania kinaweza kumaanisha kubadilisha kitu au kuweka kingine badala yake, kikiendeleza mfano wa mavazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Hizo
  rationale: Kiwakilishi hiki kinarejelea mbingu na dunia zilizotajwa katika muktadha; “hizo” ni rejeleo la kawaida na huandaa utofautishaji na “wewe.”
- source_word: יֹאבֵדוּ
  choice: zitaangamia
  rationale: Kitenzi אבד kinaonyesha kuangamia au kufikia mwisho, bila kulazimisha wazo la kutoweka kabisa.
- source_word: וְאַתָּה תַעֲמֹד
  choice: lakini wewe utadumu
  rationale: Kiunganishi kina nguvu ya utofautishaji, na עמד hapa huonyesha kuendelea kuwapo kwa kudumu kinyume na uumbaji unaoangamia.
- source_word: וְכֻלָּם
  choice: zote
  rationale: Hurejelea kwa ujumla vitu vyote vya uumbaji vilivyotajwa, kwa upatanisho wa ngeli unaofaa katika Kiswahili.
- source_word: כַּבֶּגֶד יִבְלוּ
  choice: zitachakaa kama vazi
  rationale: בלה hutumiwa kwa kitu, hasa nguo, kinachochakaa; tafsiri hii inadumisha sitiari ya vazi kwa lugha ya kawaida.
- source_word: כַּלְּבוּשׁ
  choice: Kama mavazi
  rationale: לבוש ni neno la mavazi; wingi wa Kiswahili unasikika kwa kawaida na kudumisha tofauti ndogo na “vazi” la kishoroba kilichotangulia.
- source_word: תַּחֲלִיפֵם
  choice: utazibadilisha
  rationale: Hiphil ya חלף inaweza kumaanisha kubadilisha au kuweka nyingine badala yake. “Utazibadilisha” inaendeleza picha ya mtu kubadili mavazi bila kufunga maana kwa chaguo moja tu.
- source_word: וְיַחֲלֹפוּ
  choice: nazo zitapita
  rationale: Qal ya חלף hapa huonyesha kupita au kuondoka baada ya tendo la kubadilishwa; “zitapita” inadumisha hali ya mpito ya uumbaji.
theological_decisions:
- issue: Kudumu kwa Mungu dhidi ya hali ya mpito ya uumbaji
  choice: “wewe utadumu”
  alternative: “wewe utasimama”
  rationale: Ingawa עמד maana yake halisi ni “kusimama,” katika utofautishaji huu inaonyesha kuendelea kuwapo. “Utadumu” huwasilisha maana hiyo bila kuingiza istilahi za kimafundisho zisizotajwa moja kwa moja.
- issue: Maana ya kubadilisha uumbaji katika sitiari ya mavazi
  choice: “utazibadilisha”
  alternative: “utaziweka nyingine badala yake”
  rationale: Maana ya Kiebrania inaweza kuwa kubadilisha au kuweka vingine badala yake. Tafsiri kuu inahifadhi utata huo na sitiari ya mavazi; tanbihi inataja uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Muundo unahifadhi utofautishaji kati ya uumbaji unaoangamia na Mungu anayedumu, pamoja na sitiari inayoendelea ya mavazi.
