base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/010.yaml
  text: because of your indignation and your wrath[a], for you have lifted me up and cast me away.
translation:
  language: sw
  text: 'Kwa sababu ya ghadhabu yako na hasira yako,

    maana umeniinua na kunitupa mbali.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kunitupilia mbali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי
  choice: kwa sababu ya
  rationale: Katika muundo huu, kirai hiki kinaonyesha sababu, si mahali; ‘kwa sababu ya’ ni Kiswahili cha kawaida na sahihi.
- source_word: זַעַמְךָ
  choice: ghadhabu yako
  rationale: ‘Ghadhabu’ huonyesha hasira kali kwa lugha ya kishairi yenye hadhi na kusaidia kutofautisha neno hili na קֶצֶף linalofuata.
- source_word: וְקִצְפֶּךָ
  choice: na hasira yako
  rationale: ‘Hasira’ huhifadhi maana ya ukali wa kutoridhika huku jozi ya maneno yanayokaribiana katika Kiebrania ikibaki wazi.
- source_word: כִּי
  choice: maana
  rationale: Hapa neno hili linaanzisha maelezo ya sababu; ‘maana’ linafaa kwa mtiririko wa kishairi wa Kiswahili.
- source_word: נְשָׂאתַנִי
  choice: umeniinua
  rationale: Uamuzi huu unahifadhi picha halisi ya kuinuliwa kabla ya kutupwa, badala ya kuifanya kuwa ‘kunibeba.’
- source_word: וַתַּשְׁלִיכֵנִי
  choice: na kunitupa mbali
  rationale: ‘Kunitupa mbali’ huwasilisha tendo lenye nguvu pamoja na wazo la kukataliwa, kwa Kiswahili cha sasa na cha kawaida.
theological_decisions:
- issue: Taswira ya ghadhabu ya Mungu
  choice: Maneno yote mawili ya hasira yamehifadhiwa kama ‘ghadhabu yako na hasira yako.’
  alternative: Kuyafanya yote kuwa neno moja, kama ‘hasira,’ au kuyapunguza makali.
  rationale: Kiebrania kina maneno mawili yanayokaribiana lakini si sawa kabisa. Tafsiri inahifadhi uzito na usambamba wake bila kuongeza ufafanuzi wa kimafundisho.
- issue: Mungu kama mtendaji katika kuinua na kutupa
  choice: Kauli ya moja kwa moja ‘umeniinua na kunitupa mbali’ imehifadhiwa.
  alternative: Kufanya matendo hayo yaonekane kuwa hali tu au matendo ya maadui.
  rationale: Kiebrania kinamwonyesha Mungu moja kwa moja kama mtendaji; mvutano huo wa kitheolojia haujapunguzwa wala kufafanuliwa zaidi ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa mstari umehifadhi mwendo wa sababu na maelezo uliomo katika Kiebrania.
