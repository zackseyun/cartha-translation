  verdict: revise
  source_fidelity: The causal opening and the smoke simile are retained. However, the imperfect/habitual form "hutoweka" does not reflect the Hebrew perfects as well as a completed or present-result expression. The rendering of the final verb should convey being intensely heated/scorched without necessarily implying that the bones have been fully consumed.
  naturalness: '"Siku zangu zimetoweka kama moshi" is idiomatic, poetic Standard East African Swahili. "Mifupa yangu imewaka kama tanuru" naturally conveys the image of bones glowing with severe heat.'
  terminology: '"Tanuru" is an acceptable main rendering for the rare Hebrew term, provided its uncertainty is retained in a clear footnote. The draft footnote''s "kinga ya moto" is not an appropriate equivalent for “firebrand”; "kijiti cha moto" is suitable.'
  issues:
  - severity: medium
    issue: Aspect of "hutoweka"
    rationale: The Hebrew verbs are perfect forms in a lament. The habitual "hutoweka" can suggest a recurring action; "zimetoweka" better preserves the presented, accomplished depletion of the psalmist's days.
  - severity: medium
    issue: Footnote alternative "kinga ya moto"
    rationale: This means protection from fire, not a firebrand or burning stick, and therefore gives a misleading lexical alternative.
  - severity: low
    issue: '"imeungua" may overstate the final image'
    rationale: It can suggest that the bones have been burnt up. "imewaka" preserves the likely sense of glowing/scorching heat while leaving the exact nuance open.
