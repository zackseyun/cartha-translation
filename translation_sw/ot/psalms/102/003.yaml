  yaml_path: translation/ot/psalms/102/003.yaml
  text: For my days vanish like smoke[a], and my bones burn like a hearth.
translation:
  language: sw
  text: Kwa maana siku zangu zimetoweka kama moshi, na mifupa yangu imewaka kama tanuru.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mifupa yangu imechomeka kama kijiti cha moto,” “kama joko,” au “kama chetezo.” Neno la Kiebrania linalorejelea kitu au mahali pa moto ni adimu; hivyo taswira kamili haina uhakika, ingawa maana ya joto kali iko wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu au msingi wa maombolezo na kuhifadhi uhusiano wa kisababishi.
- source_word: כָלוּ
  choice: hutoweka
  rationale: Kitenzi kina maana ya kuisha au kuteketea; pamoja na mfano wa moshi, “hutoweka” huonyesha vizuri hali ya siku kupotea na kuisha.
- source_word: בְעָשָׁן
  choice: kama moshi
  rationale: 'Ingawa kihusishi ni “katika,” katika muktadha huu kirai kinafanya kazi ya ulinganisho: siku hutoweka kama moshi unavyotawanyika.'
- source_word: יָמָי
  choice: siku zangu
  rationale: Tafsiri ya moja kwa moja inayohifadhi maombolezo ya nafsi ya kwanza.
- source_word: וְעַצְמוֹתַי
  choice: na mifupa yangu
  rationale: Inahifadhi taswira halisi ya mwili inayowakilisha mateso makali.
- source_word: כְמוֹ
  choice: kama
  rationale: Ni kiunganishi cha kawaida cha ulinganisho katika Kiswahili.
- source_word: קֵד
  choice: tanuru
  rationale: Neno hili adimu linataja kitu au mahali penye moto mkali; “tanuru” ni taswira ya kawaida na inayoeleweka, lakini rejeo kamili halina uhakika.
- source_word: נִחָרוּ
  choice: imeungua
  rationale: Hueleza kuchomwa, kuwashwa, au kuunguzwa na joto; “imeungua” ni ya asili na huhifadhi ukali wa taswira bila kulazimisha maana ya kuwa makaa kabisa.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kwa maana” huhifadhi muunganiko wa hoja; “hutoweka kama moshi” ni usemi wa asili. Tanbihi imewekwa baada ya kirai husika kwa kuwa inafafanua neno adimu קֵד na njia mbadala za kulielewa.
