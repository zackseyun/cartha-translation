  text: Nimefanana na ndege wa jangwani[a]; nimekuwa kama bundi[b] wa magofu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Nimefanana na mwari wa nyikani.” Jina la ndege la Kiebrania קָאַת halijulikani kwa hakika; tafsiri za jadi mara nyingi hutumia “mwari.”
