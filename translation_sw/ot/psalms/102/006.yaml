lexical_decisions:
- source_word: דָּמִיתִי
  choice: Nimefanana na
  rationale: Kauli ya qal ya דמה inaonyesha ulinganisho. Wakati timilifu wa Kiswahili unadumisha hali yenye matokeo inayoweza kudokezwa na timilifu ya Kiebrania.
- source_word: לִקְאַת
  choice: ndege wa jangwani
  rationale: Jina la ndege קָאַת halijulikani kwa hakika. Tafsiri pana inaepuka kutaja spishi isiyo na uhakika huku ikihifadhi picha ya ndege wa mahali pa ukiwa.
- source_word: מִדְבָּר
  choice: jangwani
  rationale: מִדְבָּר ni nchi isiyolimwa au nyika; “jangwani” ni ya kawaida, fupi, na inafaa katika picha hii ya upweke.
- source_word: הָיִיתִי
  choice: nimekuwa kama
  rationale: Timilifu ya היה inaweza kueleza hali iliyotokea na inayoendelea; “nimekuwa kama” huhifadhi maana hiyo.
- source_word: כְּכוֹס
  choice: kama bundi
  rationale: כּוֹס ni jina la ndege, lakini spishi hususa haina uhakika. “Bundi” ni tafsiri ya jumla inayoeleweka na inayofaa mazingira ya ukiwa.
- source_word: חֳרָבוֹת
  choice: katikati ya magofu
  rationale: Neno hili la wingi humaanisha magofu au maeneo yaliyoharibiwa. “Katikati ya magofu” ni Kiswahili cha asili kinachohifadhi mazingira ya uharibifu.
