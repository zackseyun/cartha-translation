translation:
  language: sw
  text: 'Kwa maana nimekula majivu kama mkate,

    na nimechanganya kinywaji changu na machozi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nimechanganya kinywaji changu kwa kulia.” Kiebrania kinasema “kwa/katika kulia”; “machozi” huwasilisha taswira hiyo kwa usemi wa kawaida wa Kiswahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu au msingi wa maombolezo yanayozunguka mstari huu, huku ikidumisha mtiririko wa kishairi.
- source_word: אֵפֶר
  choice: majivu
  rationale: Ni neno la kawaida na sahihi katika muktadha wa maombolezo, unyonge, na huzuni.
- source_word: כַּלֶּחֶם
  choice: kama mkate
  rationale: Kiambishi כְּ־ kinaonyesha ulinganisho; tafsiri hii inadumisha tashbihi bila kuifafanua kupita kiasi.
- source_word: אָכָלְתִּי
  choice: nimekula
  rationale: Kauli timilifu ya nafsi ya kwanza inaeleza jambo lililotendeka ambalo athari yake inaendelea katika maombolezo ya sasa.
- source_word: שִׁקֻּוַי
  choice: kinywaji changu
  rationale: Hapa nomino inamaanisha kinywaji cha kawaida; hakuna ishara ya kutosha ya maana ya ibada kama 'sadaka ya kinywaji'.
- source_word: בִּבְכִי
  choice: na kilio
  rationale: Nomino ya Kiebrania humaanisha 'kilio' au 'kulia'; muundo huu unaonyesha kile kilichochanganywa na kinywaji na kuhifadhi taswira ya Kiebrania.
- source_word: מָסָכְתִּי
  choice: nimechanganya
  rationale: Kitenzi kwa kawaida humaanisha kuchanganya vimiminika; uchaguzi huu ni wa kawaida katika Kiswahili cha sasa na unadumisha taswira.
