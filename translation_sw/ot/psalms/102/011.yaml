  text: My days are like a lengthening shadow[a], and I wither away like grass.
translation:
  language: sw
  text: Siku zangu ni kama kivuli kinachorefuka[a], nami ninanyauka kama nyasi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kivuli kilichonyoshwa.” Huenda taswira ya Kiebrania ni ya kivuli cha jioni kinachozidi kuwa kirefu, ikiashiria kudhoofika na kupita kwa maisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: Siku zangu
  rationale: Hudumisha wingi halisi wenye kiambishi cha nafsi ya kwanza na taswira ya Kiebrania ya siku za maisha.
- source_word: כְּצֵל
  choice: kama kivuli
  rationale: Kiambishi כְּ kinaonyesha ulinganisho, na צֵל kwa kawaida ni “kivuli”; usemi huu unahifadhi sitiari ya kupita kwa maisha.
- source_word: נָטוּי
  choice: kinachorefuka
  rationale: Neno hili latokana na נטה, “kunyooshwa/kutanuliwa.” Likihusishwa na kivuli, linaeleweka kwa kawaida kuwa kivuli cha jioni kinachozidi kuwa kirefu, huku taswira ya kudhoofika ikibaki bila kuelezwa kupita kiasi.
- source_word: וַאֲנִי
  choice: nami
  rationale: Huakisi kiunganishi rahisi pamoja na kiwakilishi cha nafsi ya kwanza bila kukifanya kwa lazima kuwa kiunganishi cha upinzani.
- source_word: כָּעֵשֶׂב
  choice: kama majani
  rationale: עֵשֶׂב humaanisha nyasi au mimea mibichi. “Majani” ni usemi wa kawaida na wa kishairi katika Kiswahili kwa mimea inayonyauka.
- source_word: אִיבָשׁ
  choice: ninanyauka
  rationale: Kitenzi יבשׁ humaanisha kukauka au kunyauka; “ninanyauka” kinaonyesha hali ya sasa ya kupoteza uhai na kinaendana kiasili na majani.
