translation:
  language: sw
  text: Moyo wangu umepigwa kama nyasi, na umenyauka[c], kwa maana ninasahau[a] kula mkate wangu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nimesahau kula mkate wangu”; hali timilifu ya kitenzi cha Kiebrania inaweza kueleweka kuwa maelezo ya dhiki inayoendelea au tendo lililotimia ambalo matokeo yake bado yapo.
    reason: lexical_alternative
  - marker: b
    text: “Mkate wangu” pia inaweza kumaanisha “chakula changu” kwa ujumla.
    reason: lexical_alternative
