    reason: previous_rendering
lexical_decisions:
- source_word: הוּכָּה
  choice: umepigwa
  rationale: Kauli tendwa ya נכה inaonyesha kupigwa au kuathiriwa kwa pigo. “Umepigwa” huhifadhi kauli tendwa na taswira ya mateso bila kuongeza wazo lisilo wazi katika chanzo.
- source_word: כָעֵשֶׂב
  choice: kama majani
  rationale: עֵשֶׂב humaanisha majani au mimea. “Kama majani” ni tashbihi ya kawaida inayoendeleza taswira ya udhaifu na kunyauka.
- source_word: וַיִּבַשׁ
  choice: na umenyauka
  rationale: יבש humaanisha kukauka au kunyauka. “Umenyauka” inafaa kwa taswira ya majani na huonyesha kupotea kwa uhai na nguvu.
- source_word: לִבִּי
  choice: Moyo wangu
  rationale: לֵב humaanisha moyo au utu wa ndani, ukiwemo upande wa mawazo na hisia. “Moyo wangu” huhifadhi lugha ya kishairi ya chanzo.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inatanguliza sababu ya hali ya mtunga zaburi. “Kwa maana” ni kiunganishi cha asili na chenye hadhi katika Kiswahili.
- source_word: שָׁכַחְתִּי
  choice: ninasahau
  rationale: Ingawa kitenzi cha Kiebrania kiko katika hali timilifu, muktadha unaweza kueleza dhiki inayoendelea. “Ninasahau” huwasilisha hali hiyo ya sasa; uwezekano wa tendo lililotimia umetajwa katika tanbihi.
- source_word: מֵאֲכֹל
  choice: kula
  rationale: Muundo wa Kiebrania ni kihalisi “kutokana na kula,” lakini baada ya “kusahau,” Kiswahili cha kawaida husema “kusahau kula.”
- source_word: לַחְמִי
  choice: mkate wangu
  rationale: לֶחֶם kwa maana ya msingi ni mkate, ingawa inaweza kumaanisha chakula kwa ujumla. “Mkate wangu” huhifadhi neno halisi na taswira ya kishairi.
