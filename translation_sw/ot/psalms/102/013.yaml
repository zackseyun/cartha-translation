  text: אַתָּ֣ה תָ֭קוּם תְּרַחֵ֣ם צִיּ֑וֹן כִּי עֵ֥ת לְ֝/חֶֽנְנָ֗/הּ כִּי בָ֥א מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/013.yaml
  text: You will arise and have compassion on Zion[a], for it is time to show her favor[b], for the appointed time has come.
translation:
  language: sw
  text: Wewe utainuka na kuuhurumia Sayuni, kwa maana wakati wa kuifanyia fadhili umefika, kwa maana wakati uliowekwa umewadia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָקוּם
  choice: utainuka
  rationale: Qal imperfect nafsi ya pili umoja wa kiume; wakati ujao unafaa katika muktadha, na ‘kuinuka’ huhifadhi taswira hai inayomhusu Mungu.
- source_word: תְּרַחֵם
  choice: kuuhurumia
  rationale: Piel imperfect ya רחם huonyesha kutenda kwa huruma. ‘Kuuhurumia’ ni Kiswahili cha kawaida na huhifadhi maana ya huruma inayotendwa kwa Sayuni.
- source_word: צִיּוֹן
  choice: Sayuni
  rationale: Jina limedumishwa kwa unukuzi badala ya kufasiriwa kuwa Yerusalemu au watu wa Mungu.
- source_word: עֵת
  choice: wakati
  rationale: Neno lina maana ya wakati au majira; hapa linataja muda mahususi wa kutenda kwa neema.
- source_word: לְחֶנְנָהּ
  choice: wa kuifadhili
  rationale: Infinitive ya חנן yenye kiambishi cha nafsi ya tatu kike hurejelea Sayuni na kumaanisha kuitendea kwa neema au kuipendelea. ‘Kuifadhili’ hapa ni kuitendea kwa fadhili, si kuipa fedha.
- source_word: בָא
  choice: umewadia
  rationale: Perfect ya בוא huonyesha kwamba wakati huo umefika, ukiwa na umuhimu wa sasa.
- source_word: מוֹעֵד
  choice: wakati uliowekwa
  rationale: מוֹעֵד ni wakati maalumu ulioteuliwa au kuwekwa; tafsiri hii huhifadhi wazo la muda uliopangwa.
theological_decisions:
- issue: Iwapo Sayuni itafsiriwe kwa maana halisi ya jina au kwa ufafanuzi
  choice: Sayuni imedumishwa kama kitu kilichotajwa kinachohurumiwa na Mungu.
  alternative: Yerusalemu; watu wa Mungu
  rationale: Kiebrania kinaitaja Sayuni moja kwa moja. Maana zake pana za kitheolojia hazijaingizwa kimyakimya katika mstari.
- issue: Uhusiano kati ya ‘wakati’ na ‘wakati uliowekwa’
  choice: Virai vyote viwili vimedumishwa ili kuonyesha kwamba muda wa kuifadhili Sayuni ndio wakati maalumu uliowadia.
  alternative: Kuviunganisha kuwa kauli moja ya wakati uliopangwa
  rationale: Muundo wa Kiebrania unarudia wazo la wakati kwa msisitizo, hivyo tafsiri inalihifadhi bila kulifupisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wewe’ imetumika kwa msisitizo wa אַתָּה. Kiwakilishi cha ngeli ya 9 katika ‘kuuhurumia/kuifadhili’ kinarejelea Sayuni kama mahali; ‘naam’ huhifadhi msisitizo wa כִּי ya pili bila kufanya sentensi kuwa nzito.
