  variant: Standard East African Swahili
source:
  edition: WLC
  text: תִּכָּ֣תֶב זֹ֭את לְ/ד֣וֹר אַחֲר֑וֹן וְ/עַ֥ם נִ֝בְרָ֗א יְהַלֶּל יָֽהּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/018.yaml
  text: This will be written for a generation to come[a], and a people yet to be created will praise Yah.
translation:
  language: sw
  text: Hili litaandikwa kwa ajili ya kizazi kijacho, na watu ambao bado hawajaumbwa watamsifu Yah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Yah,” umbo fupi la kishairi la jina la Mungu; tafsiri nyingi hulitafsiri kuwa “BWANA.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכָּתֶב
  choice: litaandikwa
  rationale: Nifali isiyotimilifu ya כתב inaonyesha tendo tendwa linalotazamiwa; katika muktadha huu wakati ujao ni wa kawaida na wazi.
- source_word: זֹאת
  choice: Hili
  rationale: Kiwakilishi cha kuonyesha kinarejelea ushuhuda au ombi lililotangulia bila kuongeza nomino ya kufasiri.
- source_word: לְדוֹר אַחֲרוֹן
  choice: kwa ajili ya kizazi kijacho
  rationale: דור ni ‘kizazi,’ na אחרון hapa ina maana ya wakati ujao au baadaye, si lazima kizazi cha mwisho kwa maana ya kieskatolojia.
- source_word: וְעַם נִבְרָא
  choice: na watu ambao bado hawajaumbwa
  rationale: עם hapa ni jamii ya watu, na participle tendwa נברא, sambamba na kizazi kijacho, inaeleweka kwa mtazamo wa wakati ujao. Muundo huu ni wa kawaida katika Kiswahili na hauwalazimishi kuwa taifa la kisiasa.
- source_word: יְהַלֶּל
  choice: watamsifu
  rationale: Pieli isiyotimilifu ya הלל inaeleza sifa ya wakati ujao; kiambishi ‘-m-’ kinamrejelea mwenye jina la Mungu linalofuata.
- source_word: יָהּ
  choice: Yah
  rationale: Hili ni umbo fupi la kishairi la jina la Mungu, tofauti kimatamshi na יהוה; kulihifadhi kunaakisi maandishi ya Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יָהּ
  choice: Yah
  alternative: BWANA
  rationale: Chanzo kinatumia umbo fupi la kishairi יָהּ, si jina kamili יהוה. ‘Yah’ huhifadhi tofauti hiyo halisi, huku ‘BWANA’ ingeilainisha na kuificha.
- issue: Maana ya אַחֲרוֹן katika kifungu hiki
  choice: kijacho
  alternative: cha mwisho
  rationale: Muktadha unatazama uhifadhi wa maandishi kwa kizazi cha baadaye. Tafsiri ‘cha mwisho’ ingeweza kuingiza dai maalumu la kieskatolojia ambalo neno lenyewe halilazimishi hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Watu ambao bado hawajaumbwa’ ni wazi kwa msomaji wa kawaida na huhifadhi picha ya kuumbwa pamoja na mwelekeo wa wakati ujao.
