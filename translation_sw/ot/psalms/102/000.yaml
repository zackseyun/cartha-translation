base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/000.yaml
  text: A prayer of the afflicted one when he grows faint and pours out his complaint before Yahweh[a][b].
translation:
  language: sw
  text: Sala ya mtu aliyeteswa, anapodhoofika na kumimina malalamiko yake mbele za Yahweh[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anapolemewa,” badala ya “anapodhoofika.”
    reason: lexical_alternative
  - marker: b
    text: Au, “tafakari yake” au “maombolezo yake,” badala ya “malalamiko yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Sala
  rationale: Nomino hii inaanza kichwa cha zaburi; “Sala” ni ya kawaida, yenye heshima, na haihitaji kibainishi katika Kiswahili.
- source_word: לְעָנִי
  choice: ya mtu aliyeteswa
  rationale: Lamedu inaonyesha uhusiano wa sala na mhusika katika kichwa. עָנִי hapa ni mtu mwenye dhiki au aliyedhulumiwa; uchaguzi huu hauifungi maana kwenye umaskini wa kiuchumi wala kusisitiza jinsia.
- source_word: כִּי
  choice: anapo-
  rationale: Katika kichwa hiki neno linaonyesha hali au wakati ambamo sala hutolewa; muundo wa “anapo-” ni wa asili katika Kiswahili.
- source_word: יַעֲטֹף
  choice: anapozimia
  rationale: Kitenzi kinaweza kueleza kudhoofika, kuzimia, au kulemewa. “Kuzimia” huhifadhi wazo la nguvu kumwishia, huku maana mbadala ikitajwa katika tanbihi.
- source_word: וְלִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: “Mbele za” huwasilisha maana ya kuwa katika uwepo wa, na jina la agano יְהוָה limetoholewa kuwa “Yahweh.”
- source_word: יִשְׁפֹּךְ
  choice: kumimina
  rationale: Huhifadhi sitiari ya kumwaga yaliyomo moyoni katika sala na ni usemi unaoeleweka kwa kawaida.
- source_word: שִׂיחוֹ
  choice: malalamiko yake
  rationale: Katika muktadha wa mtu mwenye dhiki, neno linaelekea kwenye maombolezo au usemi wa taabu, ingawa linaweza pia kumaanisha tafakari; utata huo umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni; “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kichwa cha zaburi; lugha ni fupi lakini inahifadhi sitiari na wigo wa maana wa Kiebrania.
