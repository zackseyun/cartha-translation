review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the superscription’s structure: a prayer associated with an afflicted person, offered in a state of distress, who pours out his complaint before Yahweh. However, “anapozimia” normally suggests losing consciousness in contemporary Standard East African Swahili and is too narrow for יַעֲטֹף, which here denotes becoming weak, faint, or overwhelmed.'
  naturalness: The heading is concise and appropriately formal. Replacing “anapozimia” with “anapodhoofika” gives a more natural and contextually fitting expression of weakening under affliction. “Mbele za Yahweh” and “kumimina malalamiko yake” are acceptable modern Swahili.
  terminology: “Sala,” “mtu aliyeteswa,” “Yahweh,” and “malalamiko yake” are suitable. The rendering preserves the heading-like register and does not restrict עָנִי to economic poverty or unnecessarily specify gender.
  issues:
  - severity: medium
    issue: “Anapozimia” is overly specific for יַעֲטֹף.
    rationale: In ordinary Swahili, kuzimia commonly means to faint or lose consciousness. The Hebrew can express becoming weak, faint, or overwhelmed, without necessarily indicating unconsciousness. “Anapodhoofika” better preserves the broader sense.
  revised_text: Sala ya mtu aliyeteswa, anapodhoofika na kumimina malalamiko yake mbele za Yahweh[a][b].
