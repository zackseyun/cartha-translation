  text: וְ/אַתָּה ה֑וּא וּ֝/שְׁנוֹתֶ֗י/ךָ לֹ֣א יִתָּֽמּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/027.yaml
  text: But you are the same[a], and your years will not come to an end.
translation:
  language: sw
  text: Lakini wewe ni yuleyule[a], na miaka yako haitakwisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa neno halisi, “wewe ndiye,” usemi unaoweza kumaanisha “wewe ni yuleyule” au “hubadiliki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Lakini wewe
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha tofauti kati ya Mungu na uumbaji unaoangamia na kubadilika katika muktadha uliotangulia.
- source_word: הוּא
  choice: hubaki vilevile
  rationale: Kiebrania kwa neno halisi ni ‘wewe ndiye’; hapa ni usemi unaosisitiza utambulisho na hali ya Mungu inayoendelea bila kubadilika. ‘Hubaki vilevile’ ni Kiswahili cha kawaida kinachobeba maana hiyo.
- source_word: וּ/שְׁנוֹתֶיךָ
  choice: na miaka yako
  rationale: Nomino שָׁנָה ikiwa na kiambishi cha nafsi ya pili umoja wa kiume inamaanisha moja kwa moja ‘miaka yako’.
- source_word: לֹא יִתָּמּוּ
  choice: haitafika mwisho
  rationale: Kitenzi תמם katika muktadha huu humaanisha kuisha au kufikia mwisho; wakati ujao unaafikiana na kauli ya kishairi kuhusu kudumu kwa Mungu.
theological_decisions:
- issue: Kutafsiri usemi ‘wewe ndiye’ kuhusiana na kutobadilika kwa Mungu
  choice: hubaki vilevile
  alternative: wewe ndiye; wewe ni yuleyule
  rationale: Tafsiri hii inaonyesha utambulisho wa Mungu unaodumu kinyume na uumbaji unaobadilika, bila kuingiza istilahi za kifalsafa zisizotajwa moja kwa moja katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Hubaki vilevile’ ni wazi kwa wasomaji wa kawaida na huhifadhi nguvu ya utofautishaji katika muktadha.
