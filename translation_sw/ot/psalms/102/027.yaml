  - severity: low
    issue: '"Hubaki vilevile" is a slightly interpretive habitual rendering of אַתָּה הוּא.'
    rationale: It conveys the intended sense, but "wewe ni yuleyule" retains the identity formulation of the Hebrew idiom more closely while remaining idiomatic Kiswahili.
  revised_text: Lakini wewe ni yuleyule[a], na miaka yako haitakwisha.
