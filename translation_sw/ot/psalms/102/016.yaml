  text: For Yahweh has built Zion[a]; he has appeared in his glory.
translation:
  language: sw
  text: Kwa maana Yahwe ameijenga Sayuni; amejidhihirisha katika utukufu wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ameonekana katika utukufu wake.” Kitenzi cha Kiebrania kinaweza kueleweka kuwa Yahwe amejidhihirisha au kwamba ameonekana na wengine.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au msingi wa kauli zinazozunguka mstari huu; “Kwa maana” huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: בָנָה
  choice: ameijenga
  rationale: Kauli ya Kiebrania inaonyesha tendo kama lililokamilika. “Ameijenga” ni tafsiri ya karibu bila kuongeza wazi wazo la ‘kujenga upya,’ ingawa urejesho wa Sayuni unaeleweka katika muktadha.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu linahifadhiwa kwa kulinakili kwa herufi za Kiswahili badala ya kulibadilisha kuwa cheo.
- source_word: צִיּוֹן
  choice: Sayuni
  rationale: Jina la mahali linanakiliwa kwa umbo lililozoeleka katika Kiswahili, bila kulipanua kuwa Yerusalemu au watu wa Mungu.
- source_word: נִרְאָה
  choice: amejitokeza
  rationale: Nifali ya ראה inaweza kumaanisha ‘kujitokeza’ au ‘kuonekana.’ “Amejitokeza” hutoa maana ya Mungu kujidhihirisha, huku maana nyingine halali ikihifadhiwa katika tanbihi.
- source_word: בִּכְבוֹדוֹ
  choice: katika utukufu wake
  rationale: Tafsiri hii huhifadhi kwa karibu maana ya כָּבוֹד na namna au mazingira ya kujitokeza kwa Yahwe.
theological_decisions:
- issue: Maana ya נִרְאָה בִּכְבוֹדוֹ katika kujidhihirisha kwa Mungu
  choice: amejitokeza katika utukufu wake
  alternative: ameonekana katika utukufu wake
  rationale: Kitenzi cha Kiebrania kinaweza kueleza Yahwe kujitokeza au kuonekana na wengine. Maana ya kujitokeza imetumiwa katika matini, lakini uwezekano wa kauli ya kutendwa haujaondolewa; umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini wazi na chenye hadhi. “Sayuni” ni umbo la jina lililozoeleka katika matumizi ya Biblia ya Kiswahili.
