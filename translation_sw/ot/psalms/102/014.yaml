base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/014.yaml
  text: For your servants delight in her stones and show favor to her dust[a].
translation:
  language: sw
  text: Kwa maana watumishi wako wanayapenda mawe yake, nao wanayahurumia mavumbi yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanayafurahia mawe yake, nao wanayaonea fadhili mavumbi yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu inayounganisha mstari huu na tumaini au ombi lililotangulia, kwa mtiririko wa kawaida wa kishairi.
- source_word: רָצוּ
  choice: wanayapenda
  rationale: Kitenzi hapa kinaonyesha kuyafurahia na kuyathamini kwa upendo mawe ya Sayuni; ‘wanayapenda’ ni ya asili katika Kiswahili na huhifadhi hisia hiyo.
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Katika zaburi inayomwelekea Mungu, ‘watumishi’ ni neno la kawaida na lenye heshima bila kusisitiza hali ya utumwa isiyolengwa hapa.
- source_word: אֶת אֲבָנֶיהָ
  choice: mawe yake
  rationale: Kiwakilishi cha Kiebrania ni cha kike na kinamrejelea Sayuni; Kiswahili hakitofautishi jinsia katika ‘yake,’ lakini rejeo hilo linaendelea kwa kawaida.
- source_word: וְאֶת עֲפָרָהּ
  choice: mavumbi yake
  rationale: עָפָר ni mavumbi au udongo; wingi wa Kiswahili ‘mavumbi’ huhifadhi taswira ya mabaki ya mji uliobomoka bila kuibadili kuwa ‘vifusi.’
- source_word: יְחֹנֵנוּ
  choice: wanauhurumia
  rationale: Mzizi חנן unaweza kuonyesha fadhili, neema, au huruma. Kwa kitu kilichoharibiwa kama mavumbi ya Sayuni, ‘wanauhurumia’ ni ya asili na huonyesha upendo wenye huruma.
theological_decisions:
- issue: Uhuishaji wa Sayuni/Yerusalemu kwa viambishi vya kike
  choice: Kudumisha rejeo la Sayuni katika ‘mawe yake’ na ‘mavumbi yake’
  alternative: Kutumia maelezo yasiyo na uhuishaji, kama ‘mawe ya mji’ na ‘mavumbi ya mji’
  rationale: Kiebrania kinatumia viambishi vya kike kumrejelea Sayuni. Ingawa Kiswahili hakionyeshi jinsia katika kiwakilishi hiki, muundo wa kishairi unaohusisha sehemu zake moja kwa moja unahifadhi uhuishaji huo kadiri lugha inavyoruhusu.
- issue: Maana ya חנן kuhusiana na mavumbi ya Sayuni
  choice: wanauhurumia
  alternative: wanayafadhili / wanayaonea shauku
  rationale: Neno lina wigo wa fadhili na huruma. ‘Wanauhurumia’ huhifadhi mvutano wa kishairi wa kuwa na huruma hata kwa mavumbi ya mji uliobomoka, bila kuingiza fundisho maalumu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Mavumbi’ yametumiwa kuhifadhi taswira halisi ya עָפָר, na alama ya tanbihi [a] imewekwa moja kwa moja baada ya kishazi kinachohusika.
