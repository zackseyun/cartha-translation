  text: He turned to the prayer of the destitute and did not despise their prayer[a].
translation:
  language: sw
  text: Aliigeukia sala ya mhitaji[a], wala hakuidharau sala yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliye fukara” au “asiye na msaada.” Katika miktadha mingine neno la Kiebrania linaweza kumaanisha kichaka cha jangwani; huenda taswira hiyo ikadokeza mtu aliyeachwa bila kitu au aliye peke yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנָה
  choice: alielekea
  rationale: Kitenzi hiki kimsingi humaanisha kugeuka au kuelekea upande fulani. Pamoja na ‘sala’ kama yambwa, ‘alielekea sala’ huhifadhi picha halisi ya Kiebrania huku kikidokeza kuisikiliza kwa makini.
- source_word: תְּפִלַּת
  choice: sala ya
  rationale: Hili ni umbo la kutegemezwa lenye maana ya moja kwa moja ‘sala ya’; pia huhifadhi urudiaji wa neno ‘sala’ katika sehemu ya pili.
- source_word: הָעַרְעָר
  choice: mhitaji
  rationale: Katika muktadha huu neno hilo humrejelea mtu aliyeachwa bila kitu, mpweke, au asiye na msaada. ‘Mhitaji’ ni Kiswahili cha kawaida kinachoeleza hali hiyo bila kuingiza maana ya kichaka katika maandishi makuu.
- source_word: בָזָה
  choice: hakuidharau
  rationale: ‘Kudharau’ huhifadhi maana ya kuona kuwa kitu hakina thamani na kukitendea kwa dharau; kiambishi ‘-i-’ kinairejelea sala.
- source_word: תְּפִלָּתָם
  choice: sala yao
  rationale: Kiambishi cha Kiebrania ni cha wingi, ‘yao,’ ingawa nomino ‘sala’ ni umoja. Kiswahili pia huweza kutumia ‘sala yao’ kwa kundi na kuhifadhi urudiaji wa neno.
theological_decisions:
- issue: Maana ya kibinadamu ya עַרְעָר
  choice: mtu mhitaji aliyeachwa bila msaada
  alternative: mtu mpweke; mtu aliye kama kichaka cha jangwani
  rationale: Sala na kiambishi cha wingi katika ‘sala yao’ vinaonyesha kuwa anayerejelewa ni binadamu, mmoja kama mwakilishi wa kundi au kundi kwa ujumla. Maandishi makuu yanaeleza hali ya kibinadamu, huku tanbihi ikihifadhi upana wa neno na picha yake inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wa heshima lakini unaoeleweka kwa msomaji wa kawaida. ‘Alielekea sala’ imechaguliwa ili kuhifadhi picha ya kitenzi cha Kiebrania; ‘mhitaji’ ni ya kawaida na pana kuliko istilahi nzito kama ‘fukara hohehahe.’
