  text: מִ/קּ֥וֹל אַנְחָתִ֑/י דָּבְקָ֥ה עַ֝צְמִ֗/י לִ/בְשָׂרִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/005.yaml
  text: From the sound of my groaning[b][a], my bones cling to my flesh.
translation:
  language: sw
  text: Kwa sababu ya kuugua kwangu[a], mifupa yangu imeshikamana na nyama yangu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kutokana na sauti ya kuugua kwangu.” Kihusishi cha Kiebrania kinaweza kuonyesha sababu au chanzo.
    reason: lexical_alternative
  - marker: b
    text: Au, “na ngozi yangu.” Katika muktadha wa kukonda sana, neno la Kiebrania linalomaanisha kwa kawaida “nyama” linaweza kueleweka kuwa ngozi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  choice: Kwa sababu ya
  rationale: Muundo מִן + קוֹל unaweza kuonyesha chanzo au sababu. Katika muktadha huu unatanguliza athari ya maombolezo kwa mwili; tafsiri hii ni ya kawaida katika Kiswahili, huku maana halisi zaidi ikihifadhiwa katika tanbihi.
- source_word: אַנְחָתִי
  choice: kuugua kwangu
  rationale: Nomino hii humaanisha kuugua au kuhema kwa sababu ya dhiki. ‘Kuugua’ linaonyesha uzito wa maumivu katika zaburi hii.
- source_word: דָּבְקָה
  choice: imeshikamana
  rationale: Kitenzi דבק humaanisha kushikamana au kuganda kabisa. ‘Imeshikamana’ kinahifadhi picha dhahiri ya mwili uliokonda sana na ni cha asili katika Kiswahili sanifu.
- source_word: עַצְמִי
  choice: mifupa yangu
  rationale: Ingawa umbo la Kiebrania ni la umoja, עֶצֶם linaweza kutumiwa kwa maana ya jumla; Kiswahili hutumia wingi ‘mifupa yangu’ kwa picha ya kiunzi cha mwili.
- source_word: לִבְשָׂרִי
  choice: na nyama yangu
  rationale: בָּשָׂר kimsingi ni ‘nyama.’ Kiambishi ל־ kinaonyesha kile ambacho mifupa imeshikamana nacho. ‘Nyama’ kinahifadhi taswira halisi ya Kiebrania bila kuibadili kimya kimya kuwa ‘ngozi.’
theological_decisions: []
