  text: He afflicted my strength on the way[b][a]; he shortened my days.
translation:
  language: sw
  text: 'Alidhoofisha nguvu zake njiani[a][b];

    alifupisha siku zangu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema “nguvu zake”; kwa kuzingatia muktadha wa nafsi ya kwanza, wengi huelewa kuwa maana ni “nguvu zangu.”
    reason: alternative_reading
  - marker: b
    text: Au “katika mwendo wa maisha”; kihalisi, “njiani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עִנָּה
  choice: aliidhoofisha
  rationale: Katika Piel, kitenzi hiki kinaweza kumaanisha kutesa, kushusha, au kudhoofisha. Kwa kuwa kinahusu nguvu, “aliidhoofisha” hutoa maana ya kawaida na ya wazi katika Kiswahili bila kuondoa uzito wa tendo hilo.
- source_word: בַדֶּרֶךְ
  choice: njiani
  rationale: Hii ndiyo picha halisi ya Kiebrania, “njiani.” Inaweza pia kutumiwa kwa maana ya kipindi au mwendo wa maisha, lakini picha ya njia imehifadhiwa katika matini kuu.
- source_word: כחו
  choice: nguvu zake
  rationale: Maandishi yaliyotolewa yana kiambishi cha nafsi ya tatu umoja wa kiume, hivyo maana yake ya moja kwa moja ni “nguvu zake.” Muktadha wa nafsi ya kwanza unaweza kuelekeza kwenye “nguvu zangu,” ambayo imeelezwa katika tanbihi.
- source_word: קִצַּר
  choice: alifupisha
  rationale: Kitenzi hiki humaanisha kufupisha au kukatiza. “Alifupisha” ni Kiswahili cha kawaida na hudumisha ulinganifu wa kishairi.
- source_word: יָמָי
  choice: siku zangu
  rationale: Ni nomino yenye kiambishi cha nafsi ya kwanza, ikimaanisha siku za maisha ya mtunga zaburi.
theological_decisions:
- issue: Mabadiliko ya nafsi kati ya “nguvu zake” na “siku zangu”
  choice: Kudumisha nafsi ya tatu katika kishazi cha kwanza na nafsi ya kwanza katika cha pili
  alternative: “Aliidhoofisha nguvu yangu njiani; alifupisha siku zangu.”
  rationale: Maandishi ya Kiebrania yaliyotolewa yana mvutano halisi kati ya “nguvu zake” na “siku zangu.” Tafsiri kuu haiupatanishi kimyakimya; badala yake, inahifadhi umbo hilo na kutaja usomaji unaotarajiwa zaidi kutokana na muktadha katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Njiani” huhifadhi sitiari ya Kiebrania, huku “aliidhoofisha” ikifanya uhusiano kati ya kitenzi na “nguvu” uwe wa kawaida na unaoeleweka.
