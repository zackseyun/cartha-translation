  variant: Standard East African Swahili
source:
  edition: WLC
  text: לְ/סַפֵּ֣ר בְּ֭/צִיּוֹן שֵׁ֣ם יְהוָ֑ה וּ֝/תְהִלָּת֗/וֹ בִּ/ירוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/021.yaml
  text: to declare the name of Yahweh in Zion[a], and his praise in Jerusalem,
translation:
  language: sw
  text: 'ili kulitangaza jina la Yahweh[a] katika Sayuni,

    na sifa zake katika Yerusalemu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina jina la Mungu יהוה (YHWH), ambalo hapa limetafsiriwa “Yahweh.”
    reason: divine_name
lexical_decisions:
- source_word: לְסַפֵּר
  choice: ili kulitangaza
  rationale: Kiambishi לְ kwenye kitenzi cha piel סַפֵּר kinaonyesha kusudi au matokeo. Katika muktadha huu, “kulitangaza” linaonyesha tendo la kulifanya jina la Mungu lijulikane hadharani, huku likihifadhi maana ya kusimulia au kueleza.
- source_word: בְּצִיּוֹן
  choice: katika Sayuni
  rationale: Kihusishi בְּ kinaonyesha mahali; “katika Sayuni” ni tafsiri ya kawaida na wazi katika Kiswahili.
- source_word: שֵׁם
  choice: jina
  rationale: Neno hili humaanisha “jina” na hapa linahusisha utambulisho na sifa ya Mungu. Tafsiri ya moja kwa moja inadumisha upana wa maana yake.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lenye konsonanti nne limetolewa kama jina binafsi “Yahweh,” badala ya kubadilishwa na cheo.
- source_word: וּתְהִלָּתוֹ
  choice: na sifa zake
  rationale: תְּהִלָּה ni sifa au tendo la kusifu, na kiambishi cha nafsi ya tatu umoja kinamrejelea Mungu. Kiswahili cha kawaida hutumia “sifa zake” kwa maana ya sifa inayotolewa kwake au inayomhusu.
- source_word: בִּירוּשָׁלִָם
  choice: katika Yerusalemu
  rationale: Kihusishi בִּ kinaonyesha mahali, na “Yerusalemu” ndilo jina la kawaida la mji huu katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. Kulitaja “Yahweh” huhifadhi tofauti kati ya jina hilo na cheo “Bwana” bila kulazimisha ufafanuzi wa kimadhehebu.
- issue: Maana ya “sifa zake”
  choice: sifa zinazotolewa kwake au zinazomhusu
  alternative: umaarufu wake
  rationale: Kiebrania kinaacha uhusiano huo ukiwa na upana fulani. “Sifa zake” huhifadhi uwezekano wa kumaanisha kusifiwa kwake na pia mambo yanayotangazwa kwa sifa yake, badala ya kuufupisha kuwa umaarufu tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Mistari miwili inadumisha ulinganifu wa kishairi wa Kiebrania kati ya Sayuni na Yerusalemu.
