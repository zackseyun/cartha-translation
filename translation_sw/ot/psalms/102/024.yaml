base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/024.yaml
  text: I say[a], “My God, do not take me away in the middle of my days[b]; your years are through all generations.”
translation:
  language: sw
  text: Ninasema, “Mungu wangu, usiniondoe[a] katikati ya siku zangu; miaka yako ni ya kizazi hadi kizazi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “usinipandishe katikati ya siku zangu.” Hapa kitenzi hicho huenda kinamaanisha kuondolewa katika maisha kabla ya wakati.
    reason: lexical_alternative
  - marker: b
    text: Au “kutoka kizazi hadi kizazi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: Ninasema
  rationale: Ni kitenzi cha Qal, nafsi ya kwanza umoja, ambacho katika ushairi kinaweza kutambulisha ombi kwa mtindo wa wakati wa sasa. “Ninasema” ni ya kawaida na huhifadhi uhai wa ombi.
- source_word: אֵלִי
  choice: Mungu wangu
  rationale: Umbo lenye kiambishi cha nafsi ya kwanza umoja humaanisha “Mungu wangu.” Muktadha unaonyesha kuwa ni mwito wa moja kwa moja bila kulazimika kuongeza “Ee.”
- source_word: אַל תַּעֲלֵנִי
  choice: usioniondoe
  rationale: Kitenzi עלה katika Hiphil, pamoja na kiwakilishi cha nafsi ya kwanza, kwa msingi kinaweza kuwa “usinipandishe,” lakini katika muktadha wa siku za maisha kinamaanisha kuondolewa duniani kabla ya wakati. “Usiniondoe” huhifadhi uzito wa ombi bila kufafanua zaidi ya maandishi.
- source_word: בַּחֲצִי יָמָי
  choice: katikati ya siku zangu
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya maisha kukatizwa katikati, na ni Kiswahili cha asili kuliko “katika nusu ya siku zangu.”
- source_word: בְּדוֹר דּוֹרִים
  choice: katika vizazi vyote
  rationale: Nahau hii inaonyesha mwendelezo katika vizazi vinavyofuatana. “Katika vizazi vyote” ni ya kawaida na inaendana na wazo la kudumu kwa miaka ya Mungu.
- source_word: שְׁנוֹתֶיךָ
  choice: miaka yako
  rationale: Ni nomino ya wingi yenye kiambishi cha nafsi ya pili umoja, ikitofautisha kudumu kwa Mungu na ufupi wa maisha ya mwombaji.
theological_decisions:
- issue: Lugha ya kimafumbo kuhusu kufa kabla ya wakati
  choice: usioniondoe
  alternative: usinipandishe
  rationale: Muktadha unalinganisha siku chache za mwombaji na miaka ya Mungu inayodumu. Maana ya msingi “usinipandishe” inaweza kuficha ombi linalohusu kuondolewa katika maisha; “usioniondoe” hutoa maana ya kimuktadha bila kuongeza dai la kimadhehebu.
- issue: Kudumu kwa miaka ya Mungu
  choice: miaka yako yadumu katika vizazi vyote
  alternative: miaka yako ni ya kizazi hata kizazi
  rationale: Kiebrania hakina kitenzi wazi katika kishazi hiki. “Yadumu” huifanya sentensi iwe ya kawaida kwa Kiswahili huku ikionyesha kwa uwazi maana inayodokezwa, yaani mwendelezo wa miaka ya Mungu katika vizazi vyote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Siku zangu” imehifadhiwa kama sitiari ya muda wa maisha, na “yadumu” imeongezwa kama kitenzi kinachodokezwa ili kishazi cha mwisho kiwe cha asili katika Kiswahili.
