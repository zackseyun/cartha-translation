  text: וְ/יִֽירְא֣וּ ג֭וֹיִם אֶת שֵׁ֣ם יְהוָ֑ה וְֽ/כָל מַלְכֵ֥י הָ֝/אָ֗רֶץ אֶת כְּבוֹדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/015.yaml
  text: Then the nations will fear the name of Yahweh[b][a], and all the kings of the earth your glory.
translation:
  language: sw
  text: Ndipo mataifa yataogopa[a] jina la Yahweh, na wafalme wote wa dunia wataogopa utukufu wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na mataifa yataogopa jina la Yahweh.” Kitenzi cha Kiebrania kinaweza kumaanisha kuogopa au kuwa na kicho cha heshima; kiunganishi kinaweza pia kutafsiriwa moja kwa moja “na.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִירְאוּ
  choice: Ndipo ... yatalicha / watauogopa
  rationale: Kitenzi ירא kinaweza kumaanisha kuogopa au kuwa na hofu yenye staha. Katika muktadha, waw inaonyesha matokeo ya tendo la Yahweh katika mstari uliotangulia; kwa hiyo “Ndipo” linaweka wazi uhusiano huo. Kiswahili cha asili kinahitaji kitenzi kirudiwe katika kishazi cha pili.
- source_word: גּוֹיִם
  choice: mataifa
  rationale: Hili ndilo neno la kawaida na lisiloingiza tofauti ya baadaye ya kidini inayoweza kudokezwa na tafsiri kama “Watu wa Mataifa.”
- source_word: אֶת שֵׁם יְהוָה
  choice: jina la Yahweh
  rationale: Muundo wa kirai na dhana ya “jina” vimehifadhiwa badala ya kufafanuliwa kuwa sifa au utambulisho.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika herufi nne za Kiebrania limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: וְכָל מַלְכֵי הָאָרֶץ
  choice: na wafalme wote wa dunia
  rationale: כָל pamoja na nomino ya wingi ina maana ya “wote”; הָאָרֶץ hapa linafaa kutafsiriwa “dunia.”
- source_word: אֶת כְּבוֹדֶךָ
  choice: utukufu wako
  rationale: כבוד lina maana ya utukufu, heshima, au fahari; “utukufu” linafaa kwa sajili ya kishairi na kitheolojia. Kiambishi cha nafsi ya pili umoja kimehifadhiwa katika “wako.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ina jina binafsi יְהוָה, hivyo “Yahweh” hulihifadhi badala ya kuweka cheo mahali pake.
- issue: Maana ya ירא katika uhusiano na jina na utukufu wa Mungu
  choice: “kulicha” kwa jina na “kuuogopa” utukufu
  alternative: “kuliheshimu” jina na “kuuheshimu” utukufu
  rationale: Neno la Kiebrania linabeba mvutano wa kuogopa na kuwa na kicho cha heshima. “Kulicha” linaonyesha vizuri hofu yenye staha, huku “kuuogopa” likihifadhi nguvu na urudiaji wa kitenzi cha chanzo bila kuondoa uwezekano wa hofu halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na heshima. “Kulicha” ni neno la sasa linaloeleweka kwa maana ya kuogopa kwa staha. Kitenzi kimerudiwa katika kishazi cha pili ili sentensi iwe ya kawaida na wazi kwa Kiswahili, ingawa Kiebrania kinakidokeza kwa ellipsis.
