base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/012.yaml
  text: But you[a], O Yahweh, sit enthroned forever[b], and your remembrance is from generation to generation.
translation:
  language: sw
  text: Lakini wewe, Ee Yahwe, unaketi milele[a], na kumbukumbu yako ni ya kizazi hata kizazi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “unaketi milele” au “unabaki milele.” Kitenzi cha Kiebrania maana yake halisi ni “kuketi,” na katika muktadha wa kifalme kinaweza pia kumaanisha kutawala ukiwa umeketi kwenye kiti cha enzi.
    reason: lexical_alternative
  - marker: b
    text: Au “ukumbusho wako” au “sifa yako.” Nomino ya Kiebrania inaweza kumaanisha kumbukumbu, ukumbusho, au sifa inayodumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Lakini wewe
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha tofauti kubwa na udhaifu na upitaji wa mwanadamu katika muktadha uliotangulia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa namna inayotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Hueleza muda usio na mwisho na kuonyesha udumu wa Mungu.
- source_word: תֵּשֵׁב
  choice: unaketi kwenye kiti cha enzi
  rationale: Kitenzi maana yake ya msingi ni kuketi, lakini katika muktadha huu wa kishairi kinaweza kuashiria kuketi kifalme na kutawala; usemi huu unaonyesha maana hiyo huku mbadala halisi ukihifadhiwa katika tanbihi.
- source_word: וְזִכְרְךָ
  choice: kumbukumbu yako
  rationale: Huhifadhi upana wa nomino ya Kiebrania, ambayo inaweza kumaanisha kukumbukwa, ukumbusho, au sifa inayodumu.
- source_word: לְדֹר וָדֹר
  choice: kizazi hata kizazi
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha mwendelezo katika vizazi vinavyofuatana.
theological_decisions:
- issue: Udumu na ufalme wa Mungu unaoweza kudokezwa na תֵּשֵׁב
  choice: unaketi kwenye kiti cha enzi milele
  alternative: unaketi milele; unabaki milele
  rationale: Tafsiri kuu inaonyesha uwezekano wa maana ya kifalme katika muktadha, lakini tanbihi inahifadhi maana halisi ya ‘kuketi’ na uwezekano wa ‘kubaki.’
- issue: Maana ya וְזִכְרְךָ
  choice: kumbukumbu yako
  alternative: ukumbusho wako; sifa yako
  rationale: ‘Kumbukumbu yako’ haifungi kifungu kwenye wazo la sifa pekee, bali huhifadhi utata wa kukumbukwa au ukumbusho wa kudumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Ee’ huhifadhi mwito wa moja kwa moja, na ‘Yahwe’ hutambulisha jina la Mungu. Muundo wa mstari unabaki mfupi na wenye uwiano wa kishairi.
