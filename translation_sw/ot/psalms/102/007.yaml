  register: Kiswahili sanifu cha Afrika Mashariki chenye mtindo wa kishairi ulio wazi na wenye heshima. “Nakesha” ni fupi na ya kawaida kwa hali ya kubaki macho usiku; “aliye peke yake” huhifadhi hali ya kutengwa bila kulazimisha maana ya kihisia ya “mpweke.”
