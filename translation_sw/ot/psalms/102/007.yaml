base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/007.yaml
  text: I lie awake and am like a solitary bird on a rooftop[a].
translation:
  language: sw
  text: Nakesha, nami ni kama ndege aliye peke yake juu ya paa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama shomoro aliye peke yake juu ya paa.” Neno la Kiebrania צִפּוֹר ni jina la jumla la ndege, ingawa katika tafsiri za mapokeo limetafsiriwa kwa maana maalumu zaidi kuwa “shomoro.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁקַדְתִּי
  choice: Nakesha
  rationale: Kitenzi שׁקד hapa kinaonyesha kukosa usingizi na kubaki macho katika muktadha wa maombolezo, si kufanya ulinzi kwa makusudi.
- source_word: וָאֶהְיֶה
  choice: nami nimekuwa
  rationale: Muundo huu unaendeleza hali ya msemaji na kulinganisha upweke wake na wa ndege; wakati timilifu wa Kiswahili unasikika kwa kawaida na kuhifadhi wazo la kuingia au kuwapo katika hali hiyo.
- source_word: כְּצִפּוֹר
  choice: kama ndege
  rationale: צִפּוֹר ni neno la jumla kwa ndege, mara nyingi ndege mdogo, lakini halimaanishi lazima shomoro; tafsiri ya jumla inahifadhi upana wa maana.
- source_word: בּוֹדֵד
  choice: aliye peke yake
  rationale: בּוֹדֵד humaanisha kuwa peke yako au kutengwa. Kauli hii ni ya asili katika Kiswahili na haiongezi moja kwa moja hisia ya huzuni iliyo katika neno 'mpweke'.
- source_word: עַל גָּג
  choice: juu ya paa
  rationale: Hii ndiyo maana ya moja kwa moja ya kirai cha Kiebrania na inadumisha taswira ya ndege aliye wazi na aliyetengwa juu ya paa.
