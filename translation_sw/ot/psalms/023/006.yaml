  text: אַ֤ךְ ט֤וֹב וָ/חֶ֣סֶד יִ֭רְדְּפוּ/נִי כָּל יְמֵ֣י חַיָּ֑/י וְ/שַׁבְתִּ֥י בְּ/בֵית יְ֝הוָ֗ה לְ/אֹ֣רֶךְ יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/006.yaml
  text: Surely goodness and steadfast love will pursue me all the days of my life[c][b][a], and I will dwell in the house of Yahweh for length of days.
translation:
  language: sw
  text: Hakika, wema na upendo thabiti vitanifuatilia[a] siku zote za maisha yangu, nami nitakaa[b] katika nyumba ya Yahwe kwa siku nyingi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vitanifuata.” Kitenzi cha Kiebrania kina nguvu zaidi ya “kufuatilia” au “kukimbiza,” kikionyesha wema na upendo thabiti wa Mungu vikimwandama mtunga zaburi kwa bidii.
    reason: lexical_alternative
  - marker: b
    text: Au, “nami nitarudi katika nyumba ya Yahwe.” Uwekaji wa irabu wa Kimasora unaunga mkono “nitakaa,” lakini “nitarudi” ni usomaji mbadala wa muda mrefu.
    reason: alternative_reading
  - marker: c
    text: Au, “milele.” Kiebrania kinasema kihalisi “kwa urefu wa siku,” nahau inayoonyesha muda mrefu au wenye kudumu.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Hakika
  rationale: Chembe hii inaanzisha uthibitisho wenye uhakika, si kizuizi; “Hakika” ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: טוֹב
  choice: wema
  rationale: Katika ulinganifu wake na חֶסֶד, neno hili linaeleza wema wa Mungu unaomnufaisha na kumtunza mtu.
- source_word: חֶסֶד
  choice: upendo thabiti
  rationale: Huhifadhi dhana ya upendo mwaminifu na wa kudumu bila kuubana kuwa rehema pekee au kuingiza istilahi ya kiufafanuzi zaidi ya agano.
- source_word: יִרְדְּפוּנִי
  choice: vitanifuatilia
  rationale: Kitenzi cha Kiebrania kina maana hai ya kufuatilia au kukimbiza. “Vitanifuatilia” huhifadhi taswira ya wema na upendo vinavyomwandama mtunga zaburi, bila hisia hasi inayoweza kutawala katika “vitanifukuza.”
- source_word: כָּל יְמֵי חַיָּי
  choice: siku zote za maisha yangu
  rationale: Ni tafsiri ya asili na iliyo karibu na nahau ya Kiebrania, ikihifadhi ukamilifu wa wakati na upeo binafsi.
- source_word: וְשַׁבְתִּי
  choice: nami nitakaa
  rationale: Uwekaji wa irabu wa Kimasora unaunga mkono maana ya kukaa; Kiswahili “nitakaa” kinaweza kueleza ukaaji wa kudumu katika muktadha huu.
- source_word: בְּבֵית יְהוָה
  choice: katika nyumba ya Yahwe
  rationale: Huhifadhi taswira halisi ya nyumba au mahali patakatifu pamoja na jina binafsi la Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni unukuzi wa kawaida wa Kiswahili wa jina la Mungu katika herufi nne za Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: לְאֹרֶךְ יָמִים
  choice: muda wa siku nyingi
  rationale: Hutoa kwa Kiswahili kinachoeleweka wazo halisi la urefu wa siku bila kuamua kimyakimya kwamba usemi huo lazima umaanishe umilele.
theological_decisions:
- issue: Muda unaodokezwa na לְאֹרֶךְ יָמִים
  choice: muda wa siku nyingi
  alternative: milele
  rationale: Usemi huu unaweza kudokeza ushirika wa kudumu au wa maisha yote na Yahwe, na mara nyingi hutafsiriwa “milele.” Matini kuu inahifadhi nahau iliyo wazi zaidi, huku tafsiri yenye nguvu zaidi ikiwekwa katika tanbihi.
- issue: Maana ya וְשַׁבְתִּי
  choice: nami nitakaa
  alternative: nami nitarudi
  rationale: Uwekaji wa irabu wa Kimasora kutoka ישׁב kwa kawaida hutoa “nitakaa.” Kwa kuwa “nitarudi” ni usomaji mbadala wa muda mrefu unaobadili taswira ya mstari, umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa kwa sentensi yenye vipashio viwili. “Yahwe” limetumiwa kama jina binafsi; “upendo thabiti” huhifadhi uzito wa חֶסֶד. Alama zote za tanbihi zimewekwa katika matini kuu.
