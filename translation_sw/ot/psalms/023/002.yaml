  text: בִּ/נְא֣וֹת דֶּ֭שֶׁא יַרְבִּיצֵ֑/נִי עַל מֵ֖י מְנֻח֣וֹת יְנַהֲלֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/002.yaml
  text: In grassy pastures he makes me lie down[a]; beside restful waters he leads me.
translation:
  language: sw
  text: Katika malisho yenye majani mabichi hunilaza; kando ya maji ya utulivu[a] huniongoza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maji matulivu” au “maji ya kupumzikia.” Usemi wa Kiebrania unasisitiza maji yanayohusishwa na utulivu au pumziko.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְאוֹת
  choice: katika malisho
  rationale: Neno נְאוֹת humaanisha maeneo ya makao, malisho, au mahali panapofaa mifugo kupumzika na kula. “Malisho” linadumisha taswira ya mchungaji; kiambishi בִּ kimetafsiriwa “katika.”
- source_word: דֶּשֶׁא
  choice: yenye majani mabichi
  rationale: דֶּשֶׁא hurejelea majani au mimea michanga na yenye uhai. “Majani mabichi” ni usemi wa kawaida wa Kiswahili na hauishii kueleza rangi pekee.
- source_word: יַרְבִּיצֵנִי
  choice: hunilaza
  rationale: Umbo la Hifili la רבץ lina maana ya kumsababisha mtu au mnyama alale chini. “Hunilaza” linahifadhi maana hiyo ya kisababishi bila kuibadili kuwa dhana ya jumla ya kupumzika.
- source_word: עַל
  choice: kando ya
  rationale: Katika muktadha huu עַל huonyesha ukaribu na maji. “Kando ya” ni Kiswahili cha kawaida kinachofaa taswira ya kichungaji.
- source_word: מֵי
  choice: maji
  rationale: Hili ni umbo la wingi katika hali ya muundo. Kiswahili hutumia nomino ya wingi “maji” kwa njia ya kawaida na ya kishairi.
- source_word: מְנֻחוֹת
  choice: ya utulivu
  rationale: מְנֻחוֹת linahusiana na pumziko, kutulia, au mahali pa kupumzikia. “Ya utulivu” linadumisha uhusiano huo na pumziko bila kudai kwamba maji hayatembei kabisa.
- source_word: יְנַהֲלֵנִי
  choice: huniongoza
  rationale: Umbo la Pieli la נהל humaanisha kuongoza au kuelekeza, mara nyingi kwa uangalizi. “Huniongoza” ni la asili na linadumisha taswira ya mchungaji.
theological_decisions:
- issue: Tafsiri ya jadi inayosisitiza maji kutosonga dhidi ya maana inayosisitiza pumziko
  choice: maji ya utulivu
  alternative: maji matulivu
  rationale: Nomino ya Kiebrania inasisitiza utulivu, pumziko, au hali ya kustarehe kuliko kutokuwapo kabisa kwa mwendo wa maji. Tafsiri kuu inalinda maana hiyo, huku tanbihi ikihifadhi tafsiri nyingine inayowezekana na iliyozoeleka.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. Vitenzi “hunilaza” na “huniongoza” vinaonyesha matendo ya kawaida ya mchungaji katika muktadha wa zaburi.
