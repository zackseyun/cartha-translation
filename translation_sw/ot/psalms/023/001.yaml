base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/001.yaml
  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will not lack.
translation:
  language: sw
  text: Zaburi ya Daudi[a]. Yahwe[b] ni mchungaji wangu; sitapungukiwa na kitu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “iliyoandikwa na Daudi” au “kwa ajili ya Daudi”; maneno ya Kiebrania לְדָוִד yanaweza kuonyesha utunzi, kuwekwa wakfu, umiliki, au uhusiano.
    reason: alternative_reading
  - marker: b
    text: Kiebrania YHWH, jina la Mungu ambalo kwa desturi limetafsiriwa “Bwana.”
    reason: lexical_alternative
  - marker: c
    text: Au “sitakosa kitu.” Maana ni kwamba sitakosa ninachohitaji, si kwamba sitakuwa na tamaa yoyote.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Ni kichwa cha aina ya utungo wa kuimbwa; “zaburi” ndiyo istilahi ya kawaida, iliyo wazi na yenye heshima katika Kiswahili.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kihusishi cha Kiebrania לְ katika vichwa vya zaburi kinaweza kuonyesha utunzi, umiliki, kuwekwa wakfu, au uhusiano. “Ya Daudi” huhifadhi upana huo kuliko “iliyoandikwa na Daudi” au “kwa ajili ya Daudi”.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetolewa kama jina binafsi “Yahwe,” badala ya kubadilishwa na cheo “Bwana.”
- source_word: רֹעִי
  choice: mchungaji wangu
  rationale: Neno linalotokana na רעה humaanisha anayechunga kundi. “Mchungaji wangu” ni usemi wa kawaida unaohifadhi sitiari ya uangalizi na uhusiano wa karibu.
- source_word: לֹא אֶחְסָר
  choice: sitapungukiwa na kitu
  rationale: Kitenzi חסר humaanisha kukosa au kupungukiwa na kilicho cha lazima. Usemi huu ni wa asili katika Kiswahili na unahifadhi nguvu ya nafsi ya kwanza pamoja na mtazamo wa kutotokea kwa upungufu.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Bwana; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina YHWH. “Yahwe” hulihifadhi kama jina binafsi la Mungu bila kulibadilisha kuwa cheo.
- issue: Maana ya kichwa לְדָוִד
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi; kwa ajili ya Daudi
  rationale: Muundo wa Kiebrania unaweza kuonyesha utunzi, kuwekwa wakfu, umiliki, au uhusiano. “Ya Daudi” hauamui kimya-kimya maana moja pekee.
- issue: Nguvu ya kitenzi אֶחְסָר
  choice: sitapungukiwa na kitu
  alternative: sikosi kitu; sitakosa kitu
  rationale: Umbo la kitenzi linaweza kueleweka kwa mtazamo wa sasa au ujao kulingana na muktadha. Tafsiri iliyochaguliwa huonyesha uhakika unaotazama mbele bila kudai kwamba mwamini hatapatwa kamwe na hitaji lolote.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi fupi inahifadhi sitiari kuu ya mchungaji na muundo wa nafsi ya kwanza. “Sitapungukiwa na kitu” ni ya kawaida na inaeleweka kwa wasomaji wengi bila kuwa ya kizamani.
