base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/004.yaml
  text: Even though I walk through the valley of deep darkness[a], I will fear no evil, for you are with me; your rod and your staff—they comfort me.
translation:
  language: sw
  text: Hata nijapopita katika bonde la giza nene[a], sitaogopa mabaya, kwa maana wewe uko pamoja nami; fimbo yako na gongo lako—ndivyo vinavyonifariji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bonde la kivuli cha mauti.” Neno la Kiebrania linaweza kumaanisha giza nene, likiwa pia na vidokezo vya kifo.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם כִּי
  choice: Hata nijapopita
  rationale: Muundo huu unawasilisha kishazi cha kukubali hali kinachotofautiana na kishazi kikuu; Kiswahili cha sasa hutumia kwa kawaida “hata nijapo-” katika ushairi wenye hadhi.
- source_word: אֵלֵךְ בְּגֵיא
  choice: nijapopita katika bonde
  rationale: Kitenzi cha mwendo kinaelezwa kwa “kupita katika,” ambacho kinaonyesha kusonga ndani na kuvuka eneo hilo bila kulifanya bonde mahususi zaidi ya Kiebrania.
- source_word: צַלְמָוֶת
  choice: giza nene
  rationale: Neno linaweza kumaanisha giza zito sana na kuwa na vidokezo vya kifo. “Giza nene” linaweka maana pana ya msingi, huku tafsiri ya jadi ikihifadhiwa katika tanbihi.
- source_word: לֹא אִירָא רָע
  choice: sitaogopa mabaya
  rationale: “Mabaya” huhifadhi upana wa רָע, unaoweza kuhusisha uovu, madhara, hatari, au maafa, bila kuubana kwa maana moja tu.
- source_word: כִּי אַתָּה עִמָּדִי
  choice: kwa maana wewe uko pamoja nami
  rationale: “Kwa maana” linaonyesha wazi sababu ya kutokuwa na hofu, na kiwakilishi “wewe” kinahifadhi msisitizo wa Kiebrania.
- source_word: שִׁבְטְךָ
  choice: fimbo yako
  rationale: Katika taswira ya mchungaji, “fimbo” ni neno la kawaida kwa kifaa cha ulinzi au uongozi; maana ya fimbo ya kifalme si ya msingi hapa.
- source_word: וּמִשְׁעַנְתֶּךָ
  choice: gongo lako
  rationale: “Gongo” linatofautisha kifaa cha kujiegemeza au kuongozea na “fimbo,” huku likidumisha taswira ya vifaa viwili vya mchungaji.
- source_word: הֵמָּה
  choice: hivyo
  rationale: Kiwakilishi huru cha Kiebrania kina msisitizo. “Hivyo” pamoja na mstari wa em hudumisha urejeo wenye mkazo kwa fimbo na gongo.
- source_word: יְנַחֲמֻנִי
  choice: hunifariji
  rationale: “Hunifariji” linaonyesha faraja na kutiwa moyo kwa namna ya kawaida na ya kishairi katika Kiswahili.
theological_decisions:
- issue: Maana ya צַלְמָוֶת katika usemi maarufu wa jadi
  choice: giza nene
  alternative: kivuli cha mauti
  rationale: Matini kuu haifanyi kifo kuwa maana pekee ya neno hili, ambalo huenda humaanisha giza zito kwa upana zaidi. Hata hivyo, tanbihi huhifadhi tafsiri ya jadi na kidokezo chake cha kifo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo “Hata nijapopita” unafaa zaburi bila kuwa wa kizamani kupita kiasi. Alama ya mstari wa em inaonyesha msisitizo wa הֵמָּה.
