lexical_decisions:
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: Neno נֶפֶשׁ linaweza kumaanisha nafsi, uhai, au mtu mzima. “Nafsi yangu” linahifadhi taswira ya kishairi huku tanbihi ikizuia maana yake kufikiriwa kuwa sehemu isiyo ya mwili pekee.
- source_word: יְשׁוֹבֵב
  choice: huirejesha
  rationale: Kitenzi cha mzizi שוב hapa kinaweza kumaanisha kurudisha, kurejesha, au kuhuisha. “Huirejesha” kinadumisha upana huo na kinaonyesha utendaji wa mchungaji unaoendelea.
- source_word: יַנְחֵנִי
  choice: huniongoza
  rationale: Hiphil ya נחה humaanisha kuongoza au kuelekeza. “Huniongoza” ni ya kawaida katika Kiswahili na inafaa taswira ya mchungaji.
- source_word: בְמַעְגְּלֵי
  choice: katika mapito ya
  rationale: מַעְגָּל ni pito, njia, au mkondo. “Mapito” yanadumisha taswira halisi ya mchungaji na pia maana ya mwenendo.
- source_word: צֶדֶק
  choice: haki
  rationale: צֶדֶק inaweza kumaanisha haki, uadilifu, au kilicho sawa. “Haki” ni neno pana na la kawaida linaloweza kueleza mapito yaliyo sawa na mwenendo wa uadilifu.
- source_word: לְמַעַן
  choice: kwa ajili ya
  rationale: לְמַעַן huonyesha kusudi au sababu. “Kwa ajili ya” huwasilisha kwa kawaida wazo la kutenda kwa heshima ya jina lake.
- source_word: שְׁמוֹ
  choice: jina lake
  rationale: שֵׁם humaanisha jina, lakini pia inaweza kuhusisha tabia na sifa ya mtu. Tafsiri halisi “jina lake” inadumisha uzito wa kibiblia; tanbihi inafafanua maana pana.
theological_decisions:
- issue: Maana ya “huirejesha nafsi yangu”
  choice: Kurejeshwa au kuhuishwa kwa uhai na utu mzima wa mtunga zaburi chini ya utunzaji wa mchungaji.
  alternative: “Hunihuisha,” “huniburudisha,” au “hunirudisha.”
  rationale: נֶפֶשׁ si lazima iwe nafsi isiyo ya mwili tu; inaweza kumaanisha uhai au mtu mzima. Tafsiri inadumisha lugha ya kishairi bila kuamua kimya-kimya kati ya kurejesha, kuhuisha, na kumrudisha aliyepotea.
- issue: Maana ya “mapito ya haki”
  choice: Njia zilizo sawa na zenye uadilifu ambazo Mungu humwongoza mtu kuzifuata.
  alternative: “Mapito yaliyo sawa” au “mapito ya uadilifu.”
  rationale: צֶדֶק inaweza kueleza usahihi wa njia na pia tabia ya kimaadili. “Haki” inadumisha mvutano huo badala ya kuifunga kauli katika usalama wa njia au maadili pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa hu- unaonyesha matendo ya kawaida au yanayoendelea ya mchungaji. “Mapito” limetumiwa ili kuhifadhi taswira ya njia bila kufanya sentensi kuwa ya kizamani kupita kiasi.
