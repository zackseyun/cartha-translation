translation:
  language: sw
  text: Huirejesha nafsi yangu[a]; huniongoza katika njia za haki[b] kwa ajili ya jina lake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hunihuisha,” “huniburudisha,” au “hunirudisha.” Kiebrania kinasema “nafsi yangu”; hapa “nafsi” inaweza kumaanisha uhai au mtu mzima, si sehemu isiyo ya mwili pekee.
    reason: lexical_alternative
  - marker: b
    text: Au “katika njia zilizo sawa” au “katika njia za uadilifu.”
    reason: lexical_alternative
