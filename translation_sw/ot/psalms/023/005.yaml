base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/005.yaml
  text: You set a table before me in the presence of my enemies[a]; you anoint my head with oil[b]; my cup overflows.
translation:
  language: sw
  text: Unaniandalia meza mbele ya adui zangu[a]; unapaka kichwa changu mafuta[b]; kikombe changu kinafurika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbele ya wapinzani wangu.” Neno la Kiebrania humaanisha watu wanaomwonyesha mtu uadui.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “unakifanya kichwa changu kuwa nono kwa mafuta.” Huu ni usemi wa ukarimu mwingi, heshima, au kuburudishwa kwa wingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעֲרֹךְ
  choice: Unaandaa
  rationale: Kitenzi ערך kina maana ya kupanga au kutayarisha kwa utaratibu. Katika muktadha wa meza, “unaandaa” ni Kiswahili cha kawaida kinachodumisha picha ya mwenyeji anayeandaa karamu.
- source_word: לְפָנַי
  choice: mbele yangu
  rationale: Huwakilisha moja kwa moja maana ya kuwa mbele ya mtu au katika uwepo wake.
- source_word: שֻׁלְחָן
  choice: meza
  rationale: Ni neno la kawaida la Kiswahili kwa meza, hapa likiwa katika picha ya chakula na ukarimu.
- source_word: נֶגֶד צֹרְרָי
  choice: mbele ya adui zangu
  rationale: נֶגֶד huonyesha kuwa adui wako hapo, wakikabiliana naye au wakitazama; “mbele ya adui zangu” huhifadhi uhusiano huo bila kuongeza tendo lisilotajwa wazi.
- source_word: דִּשַּׁנְתָּ בַשֶּׁמֶן רֹאשִׁי
  choice: unanipaka mafuta kichwani
  rationale: דשׁן kimsingi huhusiana na kunenepesha, kutajirisha au kustawisha kwa wingi. Pamoja na “mafuta” na “kichwa,” Kiswahili hiki huonyesha tendo la ukarimu na heshima bila tafsiri potovu ya kunenepesha kichwa.
- source_word: כּוֹסִי רְוָיָה
  choice: kikombe changu kinafurika
  rationale: רְוָיָה huonyesha kujaa sana, kutosheka au wingi. “Kinafurika” ni usemi wa asili unaodumisha picha ya kikombe kilichojaa kupita kiasi.
theological_decisions:
- issue: Picha ya mafuta kichwani
  choice: 'Imetafsiriwa kama tendo la ukarimu: “unanipaka mafuta kichwani.”'
  alternative: “unakistawisha kichwa changu kwa mafuta” au “unakiburudisha kichwa changu kwa mafuta”
  rationale: Muktadha wa meza unaelekeza kwenye heshima na ukarimu mwingi. Tafsiri haifanyi mafuta haya kuwa ibada maalumu ya kuwekwa wakfu au kutawazwa, maana hizo hazisemwi wazi hapa.
- issue: Wakati na hali ya vitenzi
  choice: Wakati wa sasa umetumiwa katika mstari mzima.
  alternative: “Umeandaa… umenipaka…”
  rationale: Kitenzi cha kwanza ni umbo lisilotimilika na cha pili ni umbo timilifu katika Kiebrania, lakini mashairi yanaweza kuvieleza kwa uhai kama matendo ya sasa ya utunzaji wa Bwana. Kiswahili cha wakati wa sasa hudumisha uhai huo bila kulazimisha mpangilio wa nyakati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Kurudiwa kwa “mbele” kunadumisha muundo na msisitizo wa Kiebrania; sentensi zimewekwa kwa lugha rahisi inayoeleweka na wasomaji wa kawaida.
