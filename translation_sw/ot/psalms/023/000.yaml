  text: מִזְמ֥וֹר לְ/דָוִ֑ד יְהוָ֥ה רֹ֝עִ֗/י לֹ֣א אֶחְסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/000.yaml
  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will lack nothing.
translation:
  language: sw
  text: 'Zaburi ya Daudi.[a]

    Yahwe[b] ndiye mchungaji wangu;

    sitapungukiwa na kitu chochote.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “iliyoandikwa na Daudi” au “kwa ajili ya Daudi”; neno la Kiebrania לְדָוִד linaweza kuonyesha uandishi, wakfu, au uhusiano.
    reason: alternative_reading
  - marker: b
    text: Kiebrania YHWH, jina la Mungu ambalo mara nyingi hutafsiriwa “BWANA.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, sitakosa chochote ninachohitaji; kauli hii haimaanishi kwamba sitakuwa na matamanio.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Neno la kawaida na lenye hadhi katika Kiswahili kwa wimbo wa ibada unaoambatana na muziki.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatambulisha jina la Mungu lililoandikwa kwa herufi YHWH, badala ya kulibadilisha kuwa cheo.
- source_word: רֹעִי
  choice: mchungaji wangu
  rationale: Huhifadhi taswira ya moja kwa moja ya mchungaji na uhusiano wa nafsi ya kwanza.
- source_word: לֹא אֶחְסָר
  choice: sitapungukiwa na kitu chochote
  rationale: Hueleza kwa Kiswahili cha kawaida kutokosa mahitaji, bila kuigeuza kauli kuwa ahadi ya kupata kila jambo linalotamaniwa.
theological_decisions:
- issue: Maana ya לְדָוִד katika kichwa
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi; kwa ajili ya Daudi
  rationale: Muundo wa Kiswahili 'ya Daudi' huhifadhi kwa kiasi fulani uwezekano wa uandishi, uhusiano, au wakfu bila kuamua zaidi ya Kiebrania.
- issue: Nguvu ya kauli לֹא אֶחְסָר
  choice: sitapungukiwa na kitu chochote
  alternative: sitataka kitu chochote
  rationale: Chaguo hili huhifadhi maana ya kutokosa au kutopungukiwa, na huepuka kueleweka kana kwamba msemaji hatakuwa na matamanio yoyote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mistari imepangwa kishairi; taswira ya mchungaji na ufupi wa kauli ya Kiebrania vimehifadhiwa.
