  text: פָּקַ֥דְתָּ הָ/אָ֨רֶץ וַ/תְּשֹׁ֪קְקֶ֡/הָ רַבַּ֬ת תַּעְשְׁרֶ֗/נָּה פֶּ֣לֶג אֱ֭לֹהִים מָ֣לֵא מָ֑יִם תָּכִ֥ין דְּ֝גָנָ֗/ם כִּי כֵ֥ן תְּכִינֶֽ/הָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/009.yaml
  text: You visit the earth and water it[a]; you greatly enrich it. The river of God is full of water; you prepare their grain[b], for so you prepare the earth.
translation:
  language: sw
  text: 'Umeitembelea ardhi na kuimwagilia maji;

    umeitajirisha sana.


    Mto wa Mungu[a] umejaa maji;

    unatayarisha nafaka yao[b],

    kwa maana ndivyo unavyoitayarisha ardhi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kijito cha Mungu” au “mfereji wa Mungu.” Usemi wa Kiebrania ni wa kishairi na huenda ukaashiria chanzo cha mbinguni cha mvua na rutuba.
    reason: lexical_alternative
  - marker: b
    text: Au “unawapatia nafaka yao” au “unaimarisha nafaka yao.” Kitenzi cha Kiebrania kinaweza kumaanisha “kutayarisha,” “kuweka tayari,” au “kuimarisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקַדְתָּ
  choice: umeijilia
  rationale: Kitenzi פקד hapa kinaonyesha Mungu kuijia ardhi kwa uangalizi wenye neema. “Umeijilia” kinahifadhi picha ya kuja/kuitembelea huku kikisikika kishairi na chenye hadhi.
- source_word: וַתְּשֹׁקְקֶהָ
  choice: na kuinywesha
  rationale: Katika muktadha wa rutuba, kitenzi kinaeleza kuipatia ardhi maji. “Kuinywesha” ni wazi, cha asili, na kinadumisha taswira ya ardhi inayopokea maji.
- source_word: רַבַּת תַּעְשְׁרֶנָּה
  choice: umeifanya kuwa tajiri sana
  rationale: Kauli hii inadumisha nguvu ya kisababishi ya עשר pamoja na msisitizo wa רבת, huku ikieleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: פֶּלֶג אֱלֹהִים
  choice: Mto wa Mungu
  rationale: פלג inaweza kuwa mto, kijito, au mfereji. “Mto wa Mungu” inadumisha muundo ulioinuliwa wa kishairi na uwezekano wa kuashiria chanzo cha mbinguni cha mvua na rutuba.
- source_word: מָלֵא מָיִם
  choice: umejaa maji
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kishazi kinachoonyesha wingi wa maji.
- source_word: תָּכִין דְּגָנָם
  choice: unatayarisha nafaka yao
  rationale: כון katika kauli ya Hifili inaweza kumaanisha kutayarisha, kuweka tayari, au kuimarisha. “Unatayarisha” linafaa kwa mfuatano wa utoaji wa Mungu, na “yao” inadumisha kiambishi cha wingi wa kiume.
- source_word: כִּי כֵן תְּכִינֶהָ
  choice: kwa maana hivyo ndivyo unavyoitayarisha ardhi
  rationale: Kurudia “tayarisha” kunadumisha uhusiano wa kileksika na kitenzi kilichotangulia; kutaja “ardhi” kwa uwazi kunaonyesha rejeleo la kiambishi cha kike cha umoja.
theological_decisions:
- issue: Rejeleo la kiambishi cha wingi katika דְּגָנָם, “nafaka yao”
  choice: Kiambishi kimehifadhiwa kama “yao,” kikirejelea watu wanaonufaika na mazao ya ardhi.
  alternative: Kutafsiri kwa ujumla kama “mazao ya ardhi” bila kutaja wenye nafaka.
  rationale: Kiambishi cha Kiebrania ni cha wingi wa kiume, si cha kike cha umoja kama “ardhi.” Kuhifadhi “yao” kunatunza tofauti hiyo ya kisarufi bila kulazimisha utambulisho maalumu zaidi wa watu hao.
- issue: Maana ya פֶּלֶג אֱלֹהִים
  choice: “Mto wa Mungu,” kama muundo wa kishairi unaohifadhi umiliki au uhusiano wa moja kwa moja na Mungu.
  alternative: “Kijito cha Mungu” au “mfereji wa Mungu,” ikiwezekana kama taswira ya chanzo cha mbinguni cha mvua.
  rationale: Kirai cha Kiebrania kinaweza kubeba taswira pana kuliko mto wa kawaida. Tafsiri kuu haifungi maana hiyo, na tanbihi inaonyesha upeo wake wa kileksika na kishairi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wenye hadhi lakini unaoeleweka kwa msomaji wa kawaida. “Ardhi” limetumiwa badala ya “nchi” ili kuonyesha wazi muktadha wa kilimo na kuepuka maana ya taifa; “umeijilia” linahifadhi nahau ya Kiebrania ya Mungu kuitembelea ardhi.
