  text: For the choirmaster[a]. A psalm of David[b]; a song.
translation:
  language: sw
  text: Kwa mwongoza muziki. Zaburi ya Daudi[a]; wimbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno ya Kiebrania yanayotafsiriwa “ya Daudi” yanaweza kumaanisha kwamba Daudi ndiye aliyeitunga, kwamba iliwekwa wakfu kwake, au kwamba inahusishwa naye.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza muziki
  rationale: Katika vichwa vya zaburi, neno hili humtaja mwenye kusimamia uimbaji au utendaji wa muziki. “Mwongoza muziki” ni Kiswahili cha sasa na halidokezi kwamba lazima awe mwongoza kwaya pekee; kiambishi לַ kimetafsiriwa “Kwa” kuonyesha maelekezo au kukabidhiwa kwake.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ndilo neno la kawaida la Kiebrania kwa utungo wa aina ya zaburi, hasa katika vichwa vya zaburi, na “Zaburi” ni istilahi iliyozoeleka na sahihi katika Kiswahili.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kiambishi לְ katika vichwa vya zaburi kinaweza kuonyesha utunzi, uhusiano, umiliki, au kuwekwa wakfu kwa mtu. “Ya Daudi” huhifadhi kwa kiasi kikubwa upana huo kuliko “iliyoandikwa na Daudi” au “kwa ajili ya Daudi.”
- source_word: שִׁיר
  choice: wimbo
  rationale: Neno hili ni tofauti na מִזְמוֹר, kwa hiyo limetafsiriwa pia badala ya kuunganishwa nalo. Nukta mkato inaonyesha kuwa “wimbo” ni maelezo ya ziada ya utungo huo.
theological_decisions:
- issue: Maana ya לְ katika לְדָוִד
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi; kwa ajili ya Daudi
  rationale: Maandishi ya Kiebrania hayalazimishi hapa maana moja tu kati ya utunzi, kuwekwa wakfu, au uhusiano. Tafsiri haipaswi kuamua jambo hilo kimadhehebu au kihistoria bila ushahidi wa ziada.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi inayofaa kichwa cha zaburi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo mfupi wa kichwa cha Kiebrania umehifadhiwa, na nukta mkato inaunganisha “wimbo” na “Zaburi ya Daudi” bila kuifanya sentensi kamili tofauti.
