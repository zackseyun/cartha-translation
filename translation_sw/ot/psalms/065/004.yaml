id: PSA.65.4
reference: Psalms 65:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַשְׁרֵ֤י תִּֽבְחַ֣ר וּ/תְקָרֵב֮ יִשְׁכֹּ֪ן חֲצֵ֫רֶ֥י/ךָ נִ֭שְׂבְּעָה בְּ/ט֣וּב בֵּיתֶ֑/ךָ קְ֝דֹ֗שׁ הֵיכָלֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/004.yaml
  text: Blessed is the one you choose and bring near to dwell in your courts[a]; we will be satisfied with the goodness of your house[b], the holiness of your temple.
translation:
  language: sw
  text: Heri mtu unayemchagua na kumleta karibu ili akae katika nyua zako[a]. Tutatosheka kwa wema wa nyumba yako[b], utakatifu wa hekalu lako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Heri sana mtu unayemchagua na kumleta karibu; atakaa katika nyua zako.”
    reason: Mwanzo unaweza kusisitiza ukubwa wa heri, na kitenzi cha mwisho kinaweza kueleweka kama taarifa ya matokeo badala ya kusudi.
  - marker: b
    text: “Wema” pia unaweza kutafsiriwa “mema” au “wingi wa vitu vyema.”
    reason: Neno la Kiebrania linaweza kueleza sifa ya wema au vitu vizuri vinavyotolewa kwa wingi.
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heri mtu
  rationale: Neno hili linaanzisha tamko la heri. “Heri mtu” ni Kiswahili cha kawaida, chenye heshima, na hakikomei tu kueleza hisia ya furaha.
- source_word: תִּבְחַר
  choice: unayemchagua
  rationale: Kitenzi kinamwonyesha Mungu akichukua hatua ya kumchagua mtu, bila kuingiza istilahi maalumu ya kimadhehebu.
- source_word: וּתְקָרֵב
  choice: na kumleta karibu
  rationale: Hifili ya קרב ina maana ya kusababisha mtu akaribie; “kumleta karibu” inahifadhi nguvu hiyo ya kisababishi kwa Kiswahili cha asili.
- source_word: יִשְׁכֹּן
  choice: ili akae
  rationale: Umbo la wakati usiotimilika la nafsi ya tatu linaweza kueleza kusudi au matokeo ya kuletwa karibu. “Ili akae” linafuata mtiririko wa sentensi kwa uwazi, huku uwezekano wa tafsiri ya taarifa ukihifadhiwa katika tanbihi.
- source_word: חֲצֵרֶיךָ
  choice: katika nyua zako
  rationale: Katika muktadha wa hekalu, neno hili linamaanisha nyua au maeneo ya nje ya patakatifu; “nyua” ni neno la kawaida na halisi.
- source_word: נִשְׂבְּעָה
  choice: Tutatosheka
  rationale: Umbo hili linaweza kuwa la hiari au la matarajio yenye uhakika. “Tutatosheka” linaeleza matarajio hayo na maana ya kushibishwa au kuridhishwa kikamilifu.
- source_word: בְּטוּב
  choice: kwa wema
  rationale: טוּב inaweza kumaanisha wema, mema, au ukarimu mwingi. “Wema” inadumisha maana pana ya sifa njema na vipawa vyake bila kubainisha kupita kiasi.
- source_word: בֵּיתֶךָ
  choice: wa nyumba yako
  rationale: Kwa kuwa iko sambamba na “hekalu lako,” “nyumba yako” inarejelea nyumba ya Mungu kama mahali pa ibada.
- source_word: קְדֹשׁ
  choice: utakatifu wa
  rationale: Katika muundo huu neno linaonyesha hali takatifu ya hekalu. “Utakatifu wa” ni ya asili kwa Kiswahili na inadumisha uhusiano wake na kilicho kitakatifu.
- source_word: הֵיכָלֶךָ
  choice: hekalu lako
  rationale: Ingawa הֵיכָל inaweza kumaanisha jumba la kifalme au hekalu, muktadha wa ibada pamoja na “nyumba” na “nyua” unaonyesha wazi hekalu.
theological_decisions:
- issue: Kuchagua kwa Mungu na kumleta mtu karibu katika ibada
  choice: Lugha ya moja kwa moja ya Mungu kumchagua mtu na kumleta karibu imedumishwa.
  alternative: Kutumia istilahi inayofafanua kuchaguliwa kwa mfumo fulani wa kimadhehebu, au kuifanya ihusu uteuzi wa kiibada pekee.
  rationale: Kiebrania kinampa Mungu hatua ya kwanza katika kutoa nafasi ya kumkaribia. Tafsiri haiongezi mfumo wa mafundisho wala kuondoa mvutano huo wa kiteolojia.
- issue: Lugha ya kufikia hekalu
  choice: Maneno halisi “nyua,” “nyumba,” na “hekalu” yametumiwa.
  alternative: Kuyabadilisha yote kuwa lugha ya kimajazi kama “uwepo” au “makao.”
  rationale: Mstari unatokana na mazingira halisi ya ibada ya Israeli. Taswira ya mahali patakatifu inapaswa kubaki wazi badala ya kufasiriwa kiroho ndani ya tafsiri.
- issue: Kusudi au matokeo katika יִשְׁכֹּן
  choice: “ili akae” limetumiwa katika matini kuu.
  alternative: “atakaa” kama taarifa ya matokeo au matarajio.
  rationale: Umbo la Kiebrania linaweza kueleweka kuwa kusudi au matokeo baada ya Mungu kumleta mtu karibu. Matini kuu inatumia muundo wa kusudi ulio wa asili, na tanbihi inadumisha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka katika ibada. “Heri mtu,” “nyua,” “nyumba,” na “hekalu” huhifadhi taswira halisi ya maandishi; “Tutatosheka” ni ya kawaida kuliko muundo mzito wa kisababishi na bado inadumisha maana ya kushiba au kuridhika kikamilifu.
