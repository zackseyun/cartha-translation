base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/013.yaml
  text: The pastures are clothed with flocks[a], and the valleys wrap themselves in grain; they shout for joy, yes[b], they sing.
translation:
  language: sw
  text: 'Malisho yamevikwa na makundi ya kondoo na mbuzi[a],

    na mabonde yamejifunika kwa nafaka[b];

    yanapaza sauti kwa shangwe, naam, yanaimba.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mbuga zimevikwa na makundi ya kondoo na mbuzi.” Neno la Kiebrania hapa linaweza kumaanisha malisho au mbuga.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kinahuisha mandhari kwa taswira: “mabonde yamejifunika kwa nafaka.”'
    reason: cultural_note
lexical_decisions:
- source_word: לָבְשׁוּ כָרִים הַצֹּאן
  choice: Malisho yamevikwa makundi ya kondoo na mbuzi
  rationale: Muundo huu unadumisha sitiari ya ardhi kuvaa, huku כָרִים ikieleweka kuwa malisho kwa sababu inalingana na 'mabonde' na imehusishwa na mifugo. הַצֹּאן ni jina la jumla linalohusu hasa kondoo na mbuzi.
- source_word: וַעֲמָקִים יַעַטְפוּ בָר
  choice: na mabonde yamejifunika nafaka
  rationale: Kitenzi cha Kiebrania ni tendaji na mabonde ndiyo kiima; 'yamejifunika' kinahifadhi uhuishaji wa kishairi kuliko usemi wa kutendwa. בָר ni nafaka kwa ujumla, si lazima ngano pekee.
- source_word: יִתְרוֹעֲעוּ
  choice: yanapiga kelele kwa furaha
  rationale: Kitenzi kinaeleza kupaza sauti, na katika muktadha huu sauti hiyo ni ya shangwe; tafsiri hii pia inahifadhi uhuishaji wa mandhari.
- source_word: אַף
  choice: naam
  rationale: Chembe hii hapa inatilia mkazo na kuendeleza kishairi wazo lililotangulia, badala ya kuongeza jambo lisilohusiana.
- source_word: יָשִׁירוּ
  choice: yanaimba
  rationale: Tafsiri ya moja kwa moja inayodumisha kilele cha usambamba kati ya kupiga kelele kwa furaha na kuimba.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Taswira za ardhi kuvaa, kujifunika, kupiga kelele na kuimba zimehifadhiwa. 'Naam' imetumiwa kama neno la heshima na la kishairi la kusisitiza.
