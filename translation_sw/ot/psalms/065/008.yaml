base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/008.yaml
  text: Those who dwell at the ends of the earth fear because of your signs[b][a]; you make the dawn and the evening shout for joy.
translation:
  language: sw
  text: Wanaoishi katika ncha za dunia wanaogopa kwa sababu ya ishara zako[a]; unazifanya alfajiri na jioni zipige kelele kwa furaha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanasimama kwa kicho kwa sababu ya ishara zako.” Kitenzi cha Kiebrania kinaweza kueleza woga, hofu, au kicho cha kumstahi.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “matokeo ya asubuhi na jioni.” Kirai hiki cha kishairi kinaweza kurejelea alfajiri na jioni, au maeneo au nyakati ambako asubuhi na jioni hutokea.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: wanaogopa
  rationale: Kitenzi ירא kinaweza kumaanisha kuogopa, kuwa na hofu, au kuwa na kicho. “Wanaogopa” kinahifadhi upana huo bila kuamua kuwa ni woga mtupu au kicho cha ibada pekee.
- source_word: יֹשְׁבֵי קְצָוֺת
  choice: wanaoishi katika miisho ya dunia
  rationale: Kirai hiki kihalisi kinataja wakaaji wa miisho; kuongeza “ya dunia” huifanya nahau ieleweke kwa kawaida na kuonyesha maeneo ya mbali zaidi.
- source_word: מֵאוֹתֹתֶיךָ
  choice: kwa sababu ya ishara zako
  rationale: Kihusishi מִן baada ya kitenzi cha kuogopa kinaweza kuonyesha sababu. Tafsiri hii inaweka wazi kwamba ishara za Mungu ndizo zinazoleta mwitikio huo.
- source_word: אוֹתֹתֶיךָ
  choice: ishara zako
  rationale: אוֹת kwa kawaida ni “ishara,” ikiwemo matendo yanayodhihirisha nguvu za Mungu. “Maajabu” kingeongeza ufafanuzi usiolazimishwa na neno lenyewe.
- source_word: מוֹצָאֵי בֹקֶר וָעֶרֶב
  choice: chomozo za asubuhi na jioni
  rationale: מוֹצָאֵי ni “kutokea,” “kutoka,” au “chomozo.” “Chomozo za asubuhi na jioni” huhifadhi taswira ya kishairi na uwezekano wa kurejelea kutokea kwa nyakati hizo au maeneo zinakotokea.
- source_word: תַּרְנִין
  choice: unazifanya ... zipige kelele kwa furaha
  rationale: Hifili ya רנן humaanisha kusababisha kilio au shangwe yenye sauti. Muundo huu unamwonyesha Mungu kuwa msababishaji na kuhifadhi nguvu ya taswira hiyo.
theological_decisions:
- issue: Aina ya mwitikio kwa ishara za Mungu
  choice: “Wanaogopa” bila kubainisha kama ni hofu au kicho cha kumstahi Mungu
  alternative: “Wanastaajabu kwa kicho” au “wanaingiwa na hofu”
  rationale: Kiebrania ירא kinaweza kuonyesha woga, hofu, au kicho cha heshima. Tafsiri imehifadhi mvutano huo badala ya kuufafanua kupita ushahidi wa matini.
- issue: Maana ya “chomozo za asubuhi na jioni”
  choice: Kuhifadhi taswira pana ya kishairi
  alternative: “Mapambazuko na machweo” au “mahali ambapo asubuhi na jioni hutokea”
  rationale: Kirai cha Kiebrania kinaweza kueleweka kwa upande wa nyakati za alfajiri na jioni au maeneo ambako zinachomoza. Tafsiri kuu haifungi maana katika upande mmoja tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Miisho ya dunia” huhifadhi nahau ya ulimwengu mzima; “chomozo” hudumisha taswira isiyo ya kawaida ya Kiebrania, huku tanbihi ikifafanua uwezekano wake.
