  text: שֹׁמֵ֥עַ תְּפִלָּ֑ה עָ֝דֶ֗י/ךָ כָּל בָּשָׂ֥ר יָבֹֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/002.yaml
  text: O you who hear prayer[a], to you all flesh will come.
translation:
  language: sw
  text: 'Ee, wewe usikiaye sala,

    kwako wanadamu wote watakuja.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “mwili wote”; usemi wa kishairi unaomaanisha wanadamu wote.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמֵעַ
  choice: usikiaye
  rationale: Kauli ya kushiriki ya Qal imetumiwa kama jina la kumwita Mungu; “usikiaye” ni ya asili katika Kiswahili na inadumisha wazo la Mungu kuwa msikilizaji wa sala.
- source_word: תְּפִלָּה
  choice: sala
  rationale: Nomino ya umoja imetumiwa kwa maana ya jumla; “sala” huonyesha tendo au kundi la maombi bila kudokeza sala moja maalumu.
- source_word: עָדֶיךָ
  choice: kwako
  rationale: Kihusishi chenye kiambishi cha nafsi ya pili ya umoja kinaonyesha mwendo unaomwelekea anayesemeshwa; “kwako” ni usemi wa kawaida pamoja na kitenzi cha kuja.
- source_word: כָּל בָּשָׂר
  choice: wanadamu wote
  rationale: Ingawa maana halisi ni “wote wenye mwili” au “kila mwili,” hapa nahau hiyo ya kishairi inamaanisha jamii yote ya wanadamu. “Wanadamu wote” ni wazi na ya asili huku tanbihi ikihifadhi taswira halisi.
- source_word: יָבֹאוּ
  choice: watakuja
  rationale: Kitenzi cha Qal kisichotimilika, nafsi ya tatu wingi, kinaeleweka hapa kwa mwelekeo wa wakati ujao; “watakuja” hudumisha maana hiyo.
theological_decisions:
- issue: Upeo wa כָּל בָּשָׂר
  choice: wanadamu wote
  alternative: wote wenye mwili; kila mwili
  rationale: Kirai hiki kinawahusu wanadamu kwa upana bila kuweka mpaka wa kikundi fulani. Tafsiri ya kawaida inaweka wazi upeo huo, na tanbihi inahifadhi nahau na taswira ya Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa mistari miwili unaakisi vifungu viwili vya mstari wa Kiebrania.
