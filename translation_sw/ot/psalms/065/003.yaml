base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/003.yaml
  text: Words of iniquity have prevailed against me[b][a]; our transgressions—you will atone for them.
translation:
  language: sw
  text: 'Mambo ya maovu yamenishinda[a];

    makosa yetu—wewe utayafanyia upatanisho[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mambo ya maovu yana nguvu kuliko mimi.” Mwanzo wa mstari katika Kiebrania umebanwa, na unaweza kutafsiriwa kwa njia ya kawaida zaidi.
    reason: lexical_alternative
  - marker: b
    text: Au, “utayafunika” au, katika muktadha huu, “utayasamehe.” Kitenzi cha Kiebrania humaanisha kufanya upatanisho kwa ajili ya dhambi; kulingana na muktadha, kinaweza kueleza kufunika au kuondoa kosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Maneno ya
  rationale: Nomino hii iko katika hali ya kutegemea neno linalofuata na kwa kawaida humaanisha “maneno ya,” ingawa katika mstari huu inaweza pia kumaanisha “mambo ya.” Tafsiri hii inahifadhi usemi mfupi wa Kiebrania, huku tanbihi ikionyesha maana nyingine.
- source_word: עֲוֺנֹת
  choice: maovu
  rationale: Neno עָוֹן linaweza kumaanisha uovu, hatia, au matokeo ya hatia. “Maovu” linahifadhi uzito wa kimaadili na wingi bila kuamua kimya kimya kuwa maana ni hisia ya hatia au adhabu.
- source_word: גָּבְרוּ
  choice: yamenishinda
  rationale: Kitenzi גבר humaanisha kuwa na nguvu au kumshinda mtu. “Yamenishinda” ni Kiswahili cha kawaida kinachodumisha picha ya maovu kuwa na nguvu kuliko msemaji.
- source_word: מֶנִּי
  choice: -ni- katika “yamenishinda”
  rationale: Baada ya גבר, kihusishi מן chenye kiambishi cha nafsi ya kwanza huonyesha kushindwa au kuzidiwa. Kiswahili kinaeleza uhusiano huo kwa kiambishi cha yambwa ndani ya kitenzi.
- source_word: פְּשָׁעֵינוּ
  choice: makosa yetu
  rationale: פֶּשַׁע huonyesha kosa zito au uasi. “Makosa yetu” ni wazi na ya kawaida kwa wasomaji wengi; bado hudokeza kuvuka mpaka wa maadili, bila kutumia istilahi nzito isiyo ya kawaida.
- source_word: אַתָּה
  choice: wewe
  rationale: Kiwakilishi kimeandikwa wazi kwa ajili ya msisitizo. Kukitaja “wewe” baada ya dash kunahifadhi mkazo huo.
- source_word: תְכַפְּרֵם
  choice: utayafutia hatia
  rationale: Piel ya כפר pamoja na kiambishi cha wingi hueleza kufanya upatanisho kwa ajili ya makosa au kuyaondolea hatia. “Utayafutia hatia” ni ya kueleweka katika Kiswahili na hudumisha wazo la kuondolewa kwa hatia kuliko neno “kufunika” pekee.
theological_decisions:
- issue: Maana ya כפר inapohusu kuondolewa kwa dhambi
  choice: wewe utayafutia hatia
  alternative: wewe utayafanyia upatanisho; wewe utayafunika
  rationale: Tafsiri iliyochaguliwa inadumisha uzito wa upatanisho na kuondolewa kwa hatia bila kuingiza nadharia fulani ya namna upatanisho unavyotenda. Pia haipunguzi maana kuwa kuficha makosa tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Mstari wa pili unatumia dash kuonyesha mkazo wa kiwakilishi cha Kiebrania. Usemi uliobanwa wa mwanzo umehifadhiwa katika matini, na uwezekano wa “mambo” umewekwa katika tanbihi.
