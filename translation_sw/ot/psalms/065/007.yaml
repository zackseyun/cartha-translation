source:
  edition: WLC
  text: מַשְׁבִּ֤יחַ שְׁא֣וֹן יַ֭מִּים שְׁא֥וֹן גַּלֵּי/הֶ֗ם וַ/הֲמ֥וֹן לְאֻמִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/007.yaml
  text: stilling the roar of the seas[a], the roar of their waves[b], and the tumult of the peoples.
translation:
  language: sw
  text: anayenyamazisha[a] kishindo cha bahari, kishindo cha mawimbi yake, na ghasia za mataifa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “anatuliza” au “anadhibiti.”
    reason: lexical_alternative
  - marker: b
    text: Au “makelele ya watu wa mataifa”; neno la Kiebrania linaweza kumaanisha msukosuko wenye kelele na, katika miktadha mingine, umati.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁבִּיחַ
  choice: anayenyamazisha
  rationale: Kauli ya kusababisha katika umbo la participle inaonyesha Mungu akisababisha kelele ikome. “Anayenyamazisha” huhifadhi nguvu hiyo ya maelezo na inafaa kwa bahari na pia kwa ghasia.
- source_word: שְׁאוֹן
  choice: kishindo
  rationale: Neno hili humaanisha kelele kubwa au mvumo. “Kishindo” huleta picha ya sauti yenye nguvu ya bahari na mawimbi; limerudiwa ili kuhifadhi urudiaji wa Kiebrania.
- source_word: יַמִּים
  choice: bahari
  rationale: Ingawa Kiebrania ni wingi, “bahari” lina umbo lilelile katika umoja na wingi wa Kiswahili; hapa linaweza kurejelea bahari mbalimbali bila kuongeza neno lisilokuwamo katika chanzo.
- source_word: גַּלֵּיהֶם
  choice: mawimbi yake
  rationale: Kiwakilishi kinarejelea bahari. Katika Kiswahili cha kawaida, “mawimbi yake” ni uhusiano wa asili na unaoeleweka, huku wingi ukionyeshwa wazi na “mawimbi.”
- source_word: הֲמוֹן
  choice: ghasia
  rationale: Katika ulinganifu na kishindo cha bahari, maana kuu ni msukosuko wenye makelele, si wingi wa watu pekee. “Ghasia” huhifadhi hali ya fujo na kelele.
- source_word: לְאֻמִּים
  choice: mataifa
  rationale: Neno linaweza kumaanisha watu au mataifa. “Mataifa” ni la kawaida na lenye heshima, bila kulazimisha maana ya dola za kisasa.
theological_decisions:
- issue: Upeo wa ulinganifu kati ya machafuko ya asili na ya wanadamu
  choice: Mstari unamwonyesha Mungu akinyamazisha kishindo cha bahari na ghasia za mataifa, bila kupanua dai hili la kishairi kuwa fundisho maalumu la kisiasa au la nyakati za mwisho.
  alternative: Kusoma mstari kuwa unahusu matukio ya asili pekee, au kuufanya hasa kuwa kauli kuhusu kutiishwa kwa mataifa kisiasa.
  rationale: Ulinganifu wa Kiebrania unaunganisha kishindo cha bahari na ghasia za mataifa. Tafsiri inadumisha upana na mvutano huo bila kuingiza mfumo wa nje.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Urudiaji wa “kishindo” umehifadhiwa kwa sababu ni kipengele muhimu cha ushairi wa Kiebrania. “Ghasia” linaendeleza picha ya kelele kutoka baharini hadi kwa mataifa.
