  text: who establishes the mountains by his power[a], being girded with might.
translation:
  language: sw
  text: Anayeiweka milima imara kwa nguvu zake,[a] akiwa amejifunga kwa uweza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Anayeiweka milima imara kwa uweza wake, akiwa amejifunga kwa nguvu.”
    reason: Maneno כֹּחַ na גְּבוּרָה yote yanaweza kutafsiriwa kwa ‘nguvu’ au ‘uweza’; tanbihi inaonyesha uwezekano wa kubadilisha uchaguzi huo.
lexical_decisions:
- source_word: מֵכִין
  choice: anayeiweka ... imara
  rationale: Hifili ya כון ina maana ya kusababisha kitu kiwe thabiti au kimesimama imara. Kauli hii ni ya kawaida katika Kiswahili na haiongezi wazo mahsusi la kuumba kutoka pasipo kitu.
- source_word: הָרִים
  choice: milima
  rationale: Neno hili humaanisha milima; katika Kiswahili halihitaji kibainishi tofauti ili kuirejelea milima kwa ujumla.
- source_word: בְּכֹחוֹ
  choice: kwa nguvu zake
  rationale: כֹּחַ huonyesha nguvu au uweza, na kihusishi ב hapa kinaonyesha chombo au njia ambayo tendo linafanywa. Wingi wa kimofolojia katika 'zake' unapatana na nomino ya Kiswahili 'nguvu' bila kubadili maana ya umoja wa mwenye nguvu.
- source_word: נֶאְזָר
  choice: akiwa amejifunga
  rationale: Kauli ya Kiebrania huhifadhi taswira ya kujifunga mkanda au kujiandaa kwa tendo. Muundo 'akiwa amejifunga' pia unaendeleza uhusiano wa kielezi kati ya vihusishi viwili.
- source_word: בִּגְבוּרָה
  choice: uweza
  rationale: גְּבוּרָה ni nguvu kuu au uweza. 'Uweza' unatofautisha kwa kiasi neno hili na כֹּחַ bila kudhoofisha taswira ya nguvu.
theological_decisions:
- issue: Uhusiano wa vihusishi viwili vya Kiebrania
  choice: Kutafsiri cha kwanza kwa muundo wa 'anaye...' na cha pili kwa 'akiwa...'
  alternative: 'Kutafsiri cha pili kama sentensi nyingine: ''naye amejifunga uweza'''
  rationale: Kiebrania kina vihusishi viwili vinavyomweleza Mungu. Muundo uliochaguliwa unahifadhi mtiririko huo bila kulazimisha uhusiano mpya wa kimantiki.
- issue: Taswira ya Mungu kujifunga nguvu
  choice: Kuhifadhi sitiari kwa kusema 'akiwa amejifunga uweza'
  alternative: 'Kufafanua bila sitiari: ''akiwa mwenye uweza mwingi'''
  rationale: Matini hutumia lugha ya kimwili kwa njia ya kishairi kueleza nguvu za Mungu; kuihifadhi huepuka kubadili ushairi kuwa kauli ya kidhahania tu.
- issue: Nafsi ya viwakilishi
  choice: Kuhifadhi nafsi ya tatu katika 'zake'
  alternative: Kutumia nafsi ya pili, 'zako', kwa kufuata mazungumzo na Mungu katika muktadha mpana
  rationale: Matini ya Kimasora katika mstari huu ina kiambishi cha nafsi ya tatu, hivyo tafsiri haibadilishi kimya kimya kwenda nafsi ya pili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya kujifunga imehifadhiwa, na nafsi ya tatu ya Kiebrania imefuatwa.
