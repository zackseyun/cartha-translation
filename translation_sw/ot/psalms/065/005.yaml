source:
  edition: WLC
  text: נ֤וֹרָא֨וֹת בְּ/צֶ֣דֶק תַּ֭עֲנֵ/נוּ אֱלֹהֵ֣י יִשְׁעֵ֑/נוּ מִבְטָ֥ח כָּל קַצְוֵי אֶ֝֗רֶץ וְ/יָ֣ם רְחֹקִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/005.yaml
  text: With awesome deeds in righteousness you answer us[a], O God of our salvation[b], the confidence of all the ends of the earth and of the distant sea.
translation:
  language: sw
  text: 'Kwa matendo ya kutia kicho unatuitikia kwa haki[a],

    Ee Mungu wa wokovu wetu,

    tegemeo la miisho yote ya dunia

    na la bahari za mbali[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa uadilifu unatuitikia.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina “bahari” katika umoja, lakini huenda neno hilo limetumiwa kwa maana ya jumla, yaani “bahari za mbali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נ֤וֹרָא֨וֹת
  choice: matendo ya kutia kicho
  rationale: Neno hili hueleza mambo yanayoamsha hofu yenye heshima au mshangao mkuu. Katika muktadha wa matendo ya Mungu ya kuokoa, “matendo ya kutia kicho” huhifadhi uzito huo bila kudokeza tu ukatili au maafa.
- source_word: בְּצֶ֣דֶק
  choice: katika haki
  rationale: 'Muundo huu unaonyesha namna Mungu anavyojibu: kwa kupatana na tabia yake iliyo sawa na ya uaminifu. “Katika haki” pia huhifadhi uwezekano mpana wa maana ya uadilifu.'
- source_word: תַּ֭עֲנֵנוּ
  choice: unatuitikia
  rationale: Kitenzi ni cha nafsi ya pili umoja na kiambishi ni cha nafsi ya kwanza wingi. “Unatuitikia” ni usemi wa kawaida na wenye staha katika muktadha wa sala.
- source_word: אֱלֹהֵ֣י יִשְׁעֵ֑נוּ
  choice: Ee Mungu wa wokovu wetu
  rationale: Tafsiri hii huhifadhi muundo wa ‘Mungu wa wokovu wetu’ na kauli ya kumwita Mungu moja kwa moja.
- source_word: מִבְטָ֥ח
  choice: tumaini
  rationale: Neno hilo humaanisha mtu au kitu kinachotegemewa kwa usalama. “Tumaini” ni la asili katika Kiswahili na hapa humtaja Mungu kuwa yule anayetegemewa na maeneo yote ya mbali.
- source_word: כָּל קַצְוֵי אֶ֝֗רֶץ
  choice: miisho yote ya dunia
  rationale: Huu ni usemi wa kishairi unaorejelea maeneo ya mbali kabisa duniani; “miisho yote ya dunia” ni sahihi na unaeleweka vizuri.
- source_word: וְיָ֣ם רְחֹקִֽים
  choice: na la bahari za mbali
  rationale: Ingawa ‘bahari’ iko katika umoja katika Kiebrania, inaweza kutumiwa kwa maana ya jumla, huku kivumishi cha wingi kikiunga mkono wazo la maeneo ya bahari yaliyo mbali. Wingi ni wa asili zaidi katika Kiswahili hapa.
theological_decisions:
- issue: Maana ya צֶדֶק katika muktadha wa zaburi
  choice: haki
  alternative: uadilifu
  rationale: “Haki” huhifadhi upana wa neno la Kiebrania, unaoweza kujumuisha usawa wa hukumu, unyofu wa maadili, na uaminifu wa Mungu. “Uadilifu” ni uwezekano halali lakini unaweza kusikika kuwa mwembamba zaidi hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa ibada lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa mistari huhifadhi mwendo na ulinganifu wa zaburi; alama zote za tanbihi zimewekwa katika matini kuu.
