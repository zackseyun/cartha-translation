base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/001.yaml
  text: To you[a], silence is praise, O God, in Zion, and to you a vow will be paid.
translation:
  language: sw
  text: Kwako wewe, ukimya ni sifa, Ee Mungu, katika Sayuni,[a] na kwako wewe nadhiri itatimizwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sifa inakungoja katika ukimya, Ee Mungu, katika Sayuni,” au, “Sifa ya kimya ni yako, Ee Mungu, katika Sayuni.” Usemi wa Kiebrania ni wa mkato na unaweza kueleweka kwa njia zaidi ya moja.
    reason: alternative_reading
lexical_decisions:
- source_word: דֻמִיָּה
  choice: ukimya
  rationale: Nomino hii kwa kawaida humaanisha ukimya au utulivu. “Ukimya” huhifadhi usemi wa kishairi wenye kushangaza bila kuufafanua kupita kiasi.
- source_word: תְהִלָּה
  choice: sifa
  rationale: Hii ndiyo maana ya kawaida ya neno hilo, na inaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: לְךָ דֻמִיָּה תְהִלָּה
  choice: Kwako wewe, ukimya ni sifa
  rationale: Kiebrania hakina kitenzi wazi na usemi wake ni wa mkato. Tafsiri hii huweka nomino zote mbili na kuhifadhi fumbo la kishairi bila kuongeza kitenzi kama “hungoja.”
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania ni la wingi, hapa linamtaja Mungu mmoja wa Israeli.
- source_word: בְּצִיּוֹן
  choice: katika Sayuni
  rationale: Huhifadhi maana ya mahali ya kihusishi בְּ na ni usemi wa kawaida wa Kiswahili.
- source_word: יְשֻׁלַּם
  choice: itatimizwa
  rationale: Kauli ya kutendwa ya שלם hapa humaanisha kwamba lililoahidiwa katika nadhiri litatolewa au kutekelezwa. “Itatimizwa” huambatana kwa kawaida na “nadhiri” katika Kiswahili.
- source_word: נֶדֶר
  choice: nadhiri
  rationale: Ni ahadi nzito inayowekwa mbele za Mungu; “nadhiri” ndiyo istilahi ya moja kwa moja na iliyozoeleka.
theological_decisions:
- issue: Maana ya usemi wa mkato לְךָ דֻמִיָּה תְהִלָּה
  choice: Ukimya wenyewe unaonyeshwa kuwa sifa inayomwelekea Mungu.
  alternative: Sifa yakungoja kwa ukimya, Ee Mungu, katika Sayuni; au, Sifa ya kimya ni yako, Ee Mungu, katika Sayuni.
  rationale: Kwa kuwa Kiebrania hakina kitenzi wazi, miundo kadhaa inawezekana. Matini kuu huhifadhi mvutano na fumbo la kishairi badala ya kuchagua ufafanuzi wenye kitenzi kilichoongezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Kurudiwa kwa “kwako wewe” huhifadhi msisitizo sambamba wa לְךָ ... וּלְךָ. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
