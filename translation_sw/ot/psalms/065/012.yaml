  yaml_path: translation/ot/psalms/065/012.yaml
  text: The pastures of the wilderness drip[b][a], and the hills gird themselves with rejoicing.
translation:
  language: sw
  text: Malisho ya nyikani yanachuruzika kwa wingi[a], na vilima vinajifunga shangwe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yanafurika”; kitenzi cha Kiebrania kinaweza kuonyesha unyevunyevu unaodondoka, kuchuruzika, au kumwagika kwa wingi.
    reason: lexical_alternative
  - marker: b
    text: Au, “vilima hujivika furaha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְעֲפוּ
  choice: yanachuruzika tele
  rationale: Kitenzi רָעַף huonyesha kudondoka au kuchuruzika kwa unyevunyevu kwa wingi. “Yanachuruzika tele” kinahifadhi taswira ya kishairi na wingi wake bila kuongeza kitu kinachodondoka ambacho hakijatajwa wazi katika Kiebrania.
- source_word: נְאוֹת
  choice: malisho
  rationale: נָוֶה hapa ni maeneo ya malisho; uchaguzi huu unafaa mandhari ya ardhi yenye rutuba katika muktadha.
- source_word: מִדְבָּר
  choice: nyikani
  rationale: מִדְבָּר inaweza kumaanisha nyika au eneo lisilolimwa, si lazima jangwa la mchanga. “Nyikani” linafaa kwa maeneo ya malisho yasiyolimwa.
- source_word: גִיל
  choice: shangwe
  rationale: גִיל ni furaha kubwa yenye kujitokeza wazi. “Shangwe” linaendeleza uhuishaji wa vilima na lina nguvu ya kishairi.
- source_word: גְּבָעוֹת
  choice: vilima
  rationale: Hili ni tafsiri ya kawaida na ya moja kwa moja ya nomino ya wingi גְּבָעוֹת.
- source_word: תַּחְגֹּרְנָה
  choice: vinajifunga
  rationale: חָגַר humaanisha kujifunga kitu kama mkanda. “Vinajifunga” linahifadhi sitiari ya asili badala ya kuibadili moja kwa moja kuwa kuvaa.
