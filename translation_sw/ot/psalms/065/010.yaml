  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּלָמֶיהָ רַוֵּה
  choice: Unazilowesha kwa wingi mifereji yake
  rationale: רוה katika kausativi humaanisha kulowesha au kushibisha kwa maji; תְּלָמִים ni mifereji inayolimwa shambani. ‘Kwa wingi’ huwasilisha wazo la kushibisha maji kwa Kiswahili cha kawaida.
- source_word: נַחֵת גְּדוּדֶיהָ
  choice: unayatandaza matuta yake
  rationale: נחת inaweza kumaanisha kuyafanya yashuke au yatulie; גְּדוּדֶיהָ hapa hueleweka kwa muktadha wa kilimo kuwa matuta ya udongo. ‘Kuyatandaza’ huhifadhi taswira ya mvua inayoyafanya yashuke na kusawazika bila kudai usawazishaji kamili.
- source_word: בִּרְבִיבִים תְּמֹגְגֶנָּה
  choice: Kwa manyunyu unalilainisha
  rationale: רְבִיבִים ni manyunyu mengi ya mvua, na מוג humaanisha kuyeyusha au kulainisha. Kiwakilishi cha umoja kinarejelea ardhi iliyotajwa katika muktadha.
- source_word: צִמְחָהּ תְּבָרֵךְ
  choice: unabariki uoto wake
  rationale: צֶמַח hurejelea kinachochipuka au mazao yanayoota; ‘uoto wake’ ni pana na huhifadhi taswira ya ukuaji unaotokana na ardhi.
