translation:
  language: sw
  text: 'Unautawaza mwaka kwa wema wako,

    na njia zako zinadondosha unono[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “unono”; yaani rutuba na wingi wa riziki. Pia, “njia zako zinadondosha utajiri.” Picha hii huenda inadokeza mwendo wa Mungu unaoacha rutuba nyuma yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִטַּרְתָּ
  choice: Unautia ... taji
  rationale: Huhifadhi sitiari ya Kiebrania ya kuuvika mwaka taji, huku ikiwa kauli ya kishairi na ya kawaida katika Kiswahili.
- source_word: שְׁנַת טוֹבָתֶךָ
  choice: mwaka taji la wema wako
  rationale: Muundo huu unasoma טוֹבָתֶךָ kuwa kitu kinachofanya taji hilo—wema wa Mungu—na kuhifadhi upana wa maana ya wema, neema na ukarimu bila kuufupisha kuwa mavuno pekee.
- source_word: וּמַעְגָּלֶיךָ
  choice: na mapito yako
  rationale: Mapito yanaweza kumaanisha njia au alama za kupita; neno hili linafaa kwa mwendo wa Mungu wa kishairi bila kulazimisha picha ya magurudumu.
- source_word: יִרְעֲפוּן
  choice: yanadondosha
  rationale: Huhifadhi picha halisi ya kutiririka au kudondoka kwa matone, badala ya kuibadili kuwa maelezo ya jumla ya baraka.
- source_word: דָּשֶׁן
  choice: tele
  rationale: Neno la Kiebrania kihalisi lina wazo la unono au ustawi wenye rutuba. 'Tele' huwasilisha wingi na ukarimu kwa Kiswahili cha sasa bila maana potovu ya mafuta ya mwili.
theological_decisions:
- issue: Kuhifadhi picha ya baraka za Mungu katika mazingira ya rutuba na mavuno
  choice: Mungu anautia mwaka taji la wema wake, na mapito yake yanadondosha tele
  alternative: Mungu anaubariki mwaka kwa mavuno mengi
  rationale: Tafsiri iliyochaguliwa huhifadhi sitiari na mvutano wa kishairi wa chanzo badala ya kuufanya mstari kuwa maelezo ya moja kwa moja kuhusu mavuno pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. 'Unautia mwaka taji' huhifadhi mpangilio wa picha ya Kiebrania; 'mapito' ni yenye hadhi na pana kuliko 'alama za magurudumu.'
