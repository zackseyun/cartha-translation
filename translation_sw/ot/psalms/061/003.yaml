  language: sw
  text: Kwa maana umekuwa kimbilio langu, mnara wenye nguvu dhidi ya adui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַחְסֶה
  choice: kimbilio
  rationale: Neno hili huonyesha mahali pa kukimbilia ili kupata ulinzi; “kimbilio” ni la kawaida, lenye hadhi, na linafaa katika muktadha wa zaburi.
- source_word: מִגְדַּל עֹז
  choice: mnara wenye nguvu
  rationale: Tafsiri hii inahifadhi taswira halisi ya mnara na maana ya עֹז kama nguvu au uthabiti wa ulinzi.
- source_word: מִפְּנֵי אוֹיֵב
  choice: dhidi ya adui
  rationale: Katika muktadha wa ulinzi, kirai hiki kinaonyesha kwamba mnara humpa mwombaji kinga dhidi ya adui; “dhidi ya” ni Kiswahili cha asili na huhifadhi uhusiano huo.
theological_decisions:
- issue: Taswira ya Mungu kama ulinzi
  choice: Kuhifadhi mifano miwili, “kimbilio” na “mnara wenye nguvu,” bila kuifafanua zaidi.
  alternative: Kutafsiri kwa ujumla kuwa “ulinzi salama.”
  rationale: Taswira zote mbili ni muhimu kwa ushairi na teolojia ya mstari; kuzifupisha kungepunguza uzito wa lugha ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Mpangilio umewekwa wa asili bila kupoteza ulinganifu wa kishairi.
