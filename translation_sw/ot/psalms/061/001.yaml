  text: Hear my cry[a], O God; listen to my prayer.
translation:
  language: sw
  text: Ee Mungu, sikia kilio changu[a]; sikiliza sala yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kilio changu kikubwa” au “kusihi kwangu.” Neno la Kiebrania linaweza kumaanisha kilio kikubwa na, katika miktadha mingine, kilio cha shangwe au wimbo; hapa muktadha wa sala unaelekeza kwenye kusihi kwa dharura.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה
  choice: sikia
  rationale: Ni amri ya moja kwa moja kwa Mungu. “Sikia” huhifadhi taswira ya kusikia na ni ya kawaida katika lugha ya sala.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Nomino hii imetumiwa kama mwito wa moja kwa moja; “Ee Mungu” huonyesha mwito huo kwa Kiswahili cha asili na chenye heshima.
- source_word: רִנָּתִי
  choice: kilio changu
  rationale: רִנָּה inaweza kumaanisha kilio kikubwa, kelele, au wimbo wa shangwe kulingana na muktadha. Hapa ulinganifu wake na “ombi langu” unaelekeza kwenye kilio cha dharura.
- source_word: הַקְשִׁיבָה
  choice: lisikilize kwa makini
  rationale: Hiphil ya קשׁב inaomba usikivu wenye makini. Kauli hii huhifadhi mkazo ulio zaidi ya amri ya kwanza na ni Kiswahili cha sasa.
- source_word: תְּפִלָּתִי
  choice: ombi langu
  rationale: Ni neno la kawaida kwa sala au ombi linaloelekezwa kwa Mungu. “Ombi langu” ni la asili hapa na hudumisha ulinganifu bila kulichanganya na “kilio changu.”
