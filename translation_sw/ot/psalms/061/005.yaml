base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/005.yaml
  text: For you[a], O God, have heard my vows[b]; you have given me the inheritance of those who fear your name.
translation:
  language: sw
  text: Kwa maana wewe, Ee Mungu, umesikia nadhiri zangu; umetoa urithi wa wale wanaolicha jina lako.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umenipa urithi wa wale wanaolicha jina lako.” Kiebrania hakitaji wazi “mimi” kuwa mpokeaji, ingawa hilo linaweza kueleweka kutokana na muktadha.
    reason: alternative_reading
  - marker: b
    text: “Wale wanaolicha jina lako” ni wale wanaoishi kwa kicho na heshima kuu kwa Mungu.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huonyesha sababu au msingi wa ombi na uhakika uliotangulia, huku ikidumisha uhusiano wa sentensi katika muktadha.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Vitenzi na kiwakilishi vya nafsi ya pili vinaonyesha kwamba Mungu anasemeshwa moja kwa moja; “Ee Mungu” ni mwito wa kawaida na wenye hadhi katika sala ya Kiswahili.
- source_word: שָׁמַעְתָּ
  choice: umesikia
  rationale: Kauli timilifu inaonyesha tendo lililokamilika lenye umuhimu wa sasa; “umesikia” ni ya asili na inaweza kujumuisha kusikiliza kwa makini katika muktadha wa sala.
- source_word: לִנְדָרָי
  choice: nadhiri zangu
  rationale: נדר humaanisha hasa ahadi nzito zilizowekwa mbele za Mungu, si lazima sadaka zilizotolewa kwa kuzitimiza; “nadhiri zangu” ni tafsiri ya moja kwa moja.
- source_word: נָתַתָּ
  choice: umetoa
  rationale: Kauli timilifu imetafsiriwa kama tendo lililokamilika. Kiswahili kinaruhusu mpokeaji kutotajwa, hivyo hakiongezi “umenipa,” ambalo halipo wazi katika Kiebrania.
- source_word: יְרֻשַּׁת
  choice: urithi
  rationale: Neno hili hueleza mali au sehemu inayorithiwa au kutolewa kuwa milki; “urithi” huhifadhi maana hiyo pamoja na mwangwi wake wa agano.
- source_word: יִרְאֵי שְׁמֶךָ
  choice: wale wanaolicha jina lako
  rationale: Usemi huu huwatambulisha watu wanaoishi kwa hofu yenye heshima mbele za Mungu. “Kulicha jina lako” huhifadhi uzito wa ירא bila kuifanya iwe hofu ya kawaida tu.
theological_decisions:
- issue: Maana ya kishazi נָתַתָּ יְרֻשַּׁת יִרְאֵי שְׁמֶךָ na mpokeaji wa urithi
  choice: umetoa urithi wa wale wanaolicha jina lako
  alternative: umenipa urithi wa wale wanaolicha jina lako
  rationale: Kiebrania hakina kiwakilishi cha yambwa kisicho cha moja kwa moja kinachosema wazi “mimi.” Tafsiri kuu haikiongezi, ingawa muktadha unaweza kumfanya msomaji amwelewe mtunga zaburi kuwa mpokeaji; uwezekano huo umehifadhiwa katika tanbihi.
- issue: Maana ya “kulicha jina” la Mungu
  choice: wale wanaolicha jina lako
  alternative: wale wanaoliheshimu jina lako
  rationale: “Kulicha” huhifadhi kwa uwazi mvutano wa kibiblia kati ya hofu na heshima. Tanbihi inaeleza kwamba huu si woga wa kawaida bali kicho chenye heshima kinachoongoza maisha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sala ulio wa sasa, wa kawaida na wenye hadhi. “Ee Mungu” hudumisha usemi wa moja kwa moja; “nadhiri,” “urithi,” na “kulicha jina lako” ni maneno yanayoeleweka huku yakihifadhi uzito wa kishairi na kiteolojia wa Kiebrania.
