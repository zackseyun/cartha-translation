source:
  edition: WLC
  text: יֵשֵׁ֣ב ע֭וֹלָם לִ/פְנֵ֣י אֱלֹהִ֑ים חֶ֥סֶד וֶ֝/אֱמֶ֗ת מַ֣ן יִנְצְרֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/007.yaml
  text: May he sit enthroned before God forever[b][a]; appoint steadfast love and truth to guard him.
translation:
  language: sw
  text: 'Na akae mbele za Mungu milele[a];

    weka upendo thabiti na kweli[b] zimlinde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na aketi akitawala mbele za Mungu milele,” au “Na aishi mbele za Mungu milele.” Kitenzi cha Kiebrania kinaweza kumaanisha kuketi, kukaa au kuishi; katika muktadha huu wa kifalme huenda kinadokeza kuendelea kutawala.
    reason: lexical_alternative
  - marker: b
    text: “Kweli” hapa pia inaweza kutafsiriwa “uaminifu.” Jozi ya Kiebrania “upendo thabiti na kweli/uaminifu” mara nyingi huonyesha upendo mwaminifu wa Mungu na kutegemeka kwake.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: Na akae
  rationale: Kauli ya kutakia au kuomba inafaa katika muktadha huu wa sala. Kitenzi kinaweza kumaanisha kuketi, kukaa mahali, au kuendelea kutawala; “akae” huhifadhi upana huo bila kulazimisha maana moja.
- source_word: עוֹלָם
  choice: milele
  rationale: Ni usemi wa kawaida na wenye hadhi unaoonyesha muda usio na mwisho au wa kudumu.
- source_word: לִפְנֵי אֱלֹהִים
  choice: mbele za Mungu
  rationale: Huhifadhi maana ya kuwa mbele ya Mungu au katika uwepo wake kwa Kiswahili cha kawaida cha kibiblia.
- source_word: חֶסֶד
  choice: upendo thabiti
  rationale: Huonyesha upendo wenye kudumu na uaminifu wa agano, badala ya kuufupisha kuwa rehema pekee.
- source_word: אֱמֶת
  choice: kweli
  rationale: Huhifadhi maana ya msingi ya neno la Kiebrania; katika jozi hii pia linaweza kumaanisha uaminifu, jambo linaloelezwa katika tanbihi.
- source_word: מַן
  choice: weka
  rationale: Amri hii inamwomba Mungu aviteue au kuviweka sifa hizi kuwa walinzi wa mfalme. “Weka” ni ya asili zaidi kwa Kiswahili kuliko “teua” inapotumiwa kuhusu sifa zilizofanywa kama wahusika.
- source_word: יִנְצְרֻהוּ
  choice: vimlinde
  rationale: Kitenzi cha wingi kinaonyesha kuwa upendo thabiti na kweli zimefanywa kama walinzi wawili wa mtu huyo; “vimlinde” huhifadhi taswira hiyo.
theological_decisions:
- issue: Nguvu ya kitenzi יֵשֵׁב katika sala ya kifalme
  choice: 'Imetafsiriwa kama ombi au takwa: “Na akae.”'
  alternative: “Atakaa” kama taarifa ya wakati ujao, au “na aketi akitawala” kwa kusisitiza ufalme.
  rationale: Muktadha wa maombi na amri katika mstari wa pili unaunga mkono ombi, lakini tanbihi huhifadhi uwezekano wa kuketi, kukaa, au kutawala.
- issue: Maana ya jozi חֶסֶד וֶאֱמֶת
  choice: “upendo thabiti na kweli” kama sifa za Mungu zilizofanywa walinzi.
  alternative: “upendo thabiti na uaminifu.”
  rationale: “Kweli” huhifadhi uwazi wa kileksia, huku “uaminifu” ikiwa maana yenye nguvu katika jozi hii inayohusu ushikamanifu na kutegemeka kwa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. “Mbele za Mungu” hudumisha hadhi ya zaburi; “vimlinde” huhifadhi uhusishaji wa upendo thabiti na kweli kama walinzi.
