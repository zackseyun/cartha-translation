  source_fidelity: The draft accurately reflects the optative force of יֵשֵׁב (“Na akae”), the enduring sense of עוֹלָם, and the imperative request that חֶסֶד and אֱמֶת protect the king. “Weka” is a defensible rendering of the difficult imperative מַן and avoids overstating its nuance.
  naturalness: The verse is otherwise clear and suitably elevated for a psalm. However, the coordinated subjects “upendo thabiti na kweli” require the plural subject concord zi- in Standard East African Swahili, not vi-.
  terminology: “Upendo thabiti” and “kweli” preserve the lexical distinction in חֶסֶד וֶאֱמֶת; the footnote appropriately supplies “uaminifu” as the strong contextual alternative. “Mbele za Mungu” and “milele” are idiomatic and appropriate in register.
