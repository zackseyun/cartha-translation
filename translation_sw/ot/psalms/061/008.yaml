translation:
  language: sw
  text: Hivyo nitaimba sifa kwa jina lako milele, ili nitimize nadhiri zangu[a] siku baada ya siku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili nilipe nadhiri zangu siku baada ya siku.” Kitenzi cha Kiebrania kinaweza kumaanisha “kulipa” au, kinapotumiwa kuhusu nadhiri, kwa upana zaidi “kutimiza.”
    reason: Huhifadhi mbadala wa kileksia wa לְשַׁלְּמִי bila kuondoa tafsiri kuu ya Kiswahili.
lexical_decisions:
- source_word: כֵּן
  choice: Hivyo
  rationale: Huonyesha hitimisho au azimio linalotokana na sala na tumaini lililotangulia.
- source_word: אֲזַמְּרָה
  choice: nitaimba sifa
  rationale: Kitenzi זמר katika piel kwa kawaida humaanisha kuimba sifa, huku kikibeba pia wazo la muziki.
- source_word: שִׁמְךָ
  choice: kwa jina lako
  rationale: Muundo wa kawaida wa Kiswahili kwa kuimba sifa kwa jina la Mungu; unahifadhi taswira ya Kiebrania ya jina.
- source_word: לָעַד
  choice: milele
  rationale: Huonyesha kudumu bila mwisho na ni usemi wa kawaida, wenye hadhi katika Kiswahili.
- source_word: לְשַׁלְּמִי
  choice: nikitimiza
  rationale: שלם katika piel ikitumiwa na nadhiri humaanisha kulipa au kutimiza wajibu wa nadhiri. 'Kutimiza' ni wazi na ya kawaida katika Kiswahili.
- source_word: נְדָרַי
  choice: nadhiri zangu
  rationale: Ni tafsiri ya moja kwa moja ya nadhiri alizoziweka msemaji.
- source_word: יוֹם יוֹם
  choice: siku baada ya siku
  rationale: Urudiaji wa 'siku' unaonyesha tendo linaloendelea kwa ukawaida; usemi huu unahifadhi nguvu hiyo ya kurudiwa.
