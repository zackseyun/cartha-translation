  yaml_path: translation/ot/psalms/061/004.yaml
  text: Let me dwell in your tent forever[a]; let me take refuge in the shelter of your wings[b]. Selah
translation:
  language: sw
  text: Na nikae[a] hemani mwako[b] milele; na nipate hifadhi katika maficho ya mabawa yako. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nitakaa.” Umbo la Kiebrania linaweza kueleza ombi au tamanio thabiti, na pia azimio.
    reason: lexical_alternative
  - marker: b
    text: “Hema” linaweza kudokeza patakatifu au makao ya Mungu; tafsiri za jadi mara nyingi hutumia “tabernakulo.”
    reason: cultural_note
lexical_decisions:
- source_word: אָג֣וּרָה
  choice: Na niketi
  rationale: Kitenzi cha Kiebrania ni cohortative cha nafsi ya kwanza, kikieleza ombi au tamanio thabiti. Muundo wa Kiswahili ‘na niketi’ unahifadhi nguvu hiyo ya hiari na maombi bila kukifanya kuwa taarifa rahisi ya wakati ujao.
- source_word: בְ֭/אָהָלְ/ךָ
  choice: hemani mwako
  rationale: אָהֶל humaanisha kihalisi ‘hema.’ ‘Hema lako’ pia lingewezekana, lakini ‘hemani mwako’ ni ya asili na huhifadhi taswira halisi bila kuifafanua moja kwa moja kuwa hekalu au patakatifu.
- source_word: עוֹלָמִ֑ים
  choice: milele
  rationale: Wingi huu wa עוֹלָם unasisitiza muda usio na mwisho; ‘milele’ ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: אֶֽחֱסֶ֨ה
  choice: na nijifiche
  rationale: חסה humaanisha kukimbilia au kupata hifadhi. Katika usambamba na cohortative iliyotangulia, ‘na nijifiche’ huonyesha ombi la kupata usalama na inaendana kiasili na taswira ya kivuli cha mabawa.
- source_word: בְ/סֵ֖תֶר
  choice: katika kivuli
  rationale: סֵתֶר ni mahali pa siri au pa kujisitiri na kulindwa. ‘Kivuli’ hapa huwasilisha mahali pa kujisitiri chini ya mabawa, ingawa ‘maficho’ au ‘hifadhi’ ni mbadala zinazowezekana.
- source_word: כְּנָפֶ֣י/ךָ
  choice: cha mabawa yako
  rationale: Tafsiri hii huhifadhi taswira ya mabawa ya Mungu na uhusiano wa kisarufi wa mahali pa kujisitiri panapotolewa na mabawa hayo.
- source_word: סֶּֽלָה
  choice: Sela
  rationale: Maana kamili ya neno hili haijulikani; limenukuliwa kwa herufi za Kiswahili badala ya kutafsiriwa kwa kubahatisha.
theological_decisions:
- issue: Taswira ya patakatifu katika ‘hema lako’
  choice: Kuhifadhi taswira halisi kwa ‘hemani mwako’
  alternative: katika patakatifu pako; katika maskani yako
  rationale: Huenda hema linadokeza patakatifu au makao ya Mungu, lakini Kiebrania chenyewe kinatumia nomino halisi ‘hema.’ Tafsiri haipaswi kuamua kimya-kimya ni patakatifu pa kidunia au makao ya mbinguni.
- issue: Nguvu ya kauli katika kitenzi cha kwanza
  choice: 'Ombi/tamanio: ‘Na niketi’'
  alternative: 'Azimio: ‘Nitakaa’'
  rationale: Cohortative inaweza kubeba tamanio au azimio thabiti. Muktadha wa sala unaunga mkono ombi, huku tanbihi ikihifadhi uwezekano wa azimio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Taswira za ‘hema,’ ‘kivuli,’ na ‘mabawa’ zimehifadhiwa; ‘Sela’ haijafasiriwa kwa sababu maana yake haijulikani kwa uhakika.
