  rationale: The revision makes the plea explicitly directed to God and preserves the urgent sense of קרא in this context, without changing the poetic register. The principal reading continues to retain the Hebrew’s straightforward comparison, while the footnote preserves the traditional interpretive possibility that the rock is beyond the speaker’s own reach.
