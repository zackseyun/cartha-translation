  text: מִ/קְצֵ֤ה הָ/אָ֨רֶץ אֵלֶ֣י/ךָ אֶ֭קְרָא בַּ/עֲטֹ֣ף לִבִּ֑/י בְּ/צוּר יָר֖וּם מִמֶּ֣/נִּי תַנְחֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/002.yaml
  text: From the end of the earth I call to you when my heart grows faint[b][a]; lead me to a rock higher than I.
translation:
  language: sw
  text: 'Kutoka mwisho wa dunia ninakulilia,

    moyo wangu unapozimia;[a]

    uniongoze kwenye mwamba ulio juu kuliko mimi.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “moyo wangu unapolemewa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mwamba ulio juu mno nisipoweza kuufikia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה הָאָרֶץ
  choice: Kutoka mwisho wa dunia
  rationale: Neno קָצֶה huonyesha mwisho au ukingo. Katika ushairi huu, “dunia” huhifadhi wazo la umbali mkubwa na hali ya kuwa mbali kabisa.
- source_word: אֵלֶיךָ אֶקְרָא
  choice: ninakuita
  rationale: Kitenzi קרא kinaweza kumaanisha kuita au kulilia. “Ninakuita” ni Kiswahili cha kawaida kinachobaki na uzito wa ombi la sala.
- source_word: בַּעֲטֹף לִבִּי
  choice: moyo wangu unapozimia
  rationale: Kitenzi עטף hapa huonyesha nguvu za ndani zikidhoofika au moyo kulemewa. “Unapozimia” huhifadhi taswira ya kufifia kwa nguvu bila kuifafanua kupita kiasi.
- source_word: בְּצוּר
  choice: kwenye mwamba
  rationale: צוּר ni mwamba halisi unaotumika kitamathali kuonyesha usalama na hifadhi. “Kwenye mwamba” linafaa kwa mwendo unaoonyeshwa na ombi la kuongozwa.
- source_word: יָרוּם מִמֶּנִּי
  choice: ulio juu kuliko mimi
  rationale: Maneno haya yanafanya ulinganisho wa urefu kwa njia ya moja kwa moja. Tafsiri hii haiingizii wazi wazo la kutoweza kuufikia, ingawa hilo ni jambo linalowezekana katika muktadha.
- source_word: תַנְחֵנִי
  choice: uniongoze
  rationale: Katika umbo la Hiphil, נחה humaanisha kuongoza au kuelekeza. “Uniongoze” huonyesha utegemezi wa mwombaji na inaungana kwa kawaida na mahali anapoomba kufikishwa.
theological_decisions:
- issue: Nguvu ya kitamathali ya “mwamba”
  choice: Kuhifadhi “mwamba” bila kuufafanua katika matini kuu
  alternative: uniongoze mahali salama / kwenye kimbilio
  rationale: Kiebrania kinatumia taswira halisi ya צוּר. Kuihifadhi kunadumisha ushairi na maana ya usalama wa Mungu bila kuibadili taswira hiyo kuwa ufafanuzi.
- issue: Maana ya יָרוּם מִמֶּנִּי
  choice: ulio juu kuliko mimi
  alternative: ulio juu nisioweza kuufikia
  rationale: Muundo wa Kiebrania unaweza kusomwa kama ulinganisho rahisi au kama mwamba ulio juu mno kwa mwombaji kuufikia mwenyewe. Matini kuu huhifadhi ulinganisho wa moja kwa moja, na tanbihi huhifadhi maana ya pili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa mistari unafuata vipashio vya shairi la Kiebrania, huku taswira ya “mwamba” na utata wa hali ya moyo vikihifadhiwa.
