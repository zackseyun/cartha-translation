review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the spatial extremity, the fainting/overwhelmed-heart image, the rock metaphor, and the comparative height. However, “ninakuita” can mean “I call you” (as a direct object) and does not as clearly retain the Hebrew directional sense, “I call/cry to you.” “Nakuita” is not wrong in prayer language, but “ninakulilia” more explicitly conveys the urgent appeal directed to God.
  naturalness: The verse is clear, poetic, and uses standard East African Swahili. “Ninakulilia” is natural in a prayer context and better carries the urgency of the Hebrew. The lineation and syntax remain smooth.
  terminology: “Dunia,” “moyo,” “mwamba,” and “uniongoze” are appropriate, modern, and faithful. The main-text comparative “ulio juu kuliko mimi” properly preserves the Hebrew without imposing the stronger interpretation of inability.
  issues:
  - severity: low
    issue: The appeal verb does not explicitly express direction toward God.
    rationale: Hebrew אֵלֶיךָ אֶקְרָא is literally “to you I call.” Replacing “ninakuita” with “ninakulilia” naturally retains both the prayerful urgency and the directional sense in Swahili.
  - severity: low
    issue: Footnote b can state the interpretive alternative more idiomatically.
    rationale: “Mwamba ulio juu mno nisipoweza kuufikia” clearly expresses “a rock too high for me [to reach]” while remaining an alternative rather than the main reading.
