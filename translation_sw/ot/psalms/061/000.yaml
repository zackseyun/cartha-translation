  text: For the choir director; with stringed instruments. Of David[a].
translation:
  language: sw
  text: Kwa mwongoza muziki; kwa ala za nyuzi. Ya Daudi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Iliyoandikwa na Daudi” au “Kwa ajili ya Daudi”; muundo wa Kiebrania unaweza kuonyesha utunzi, uhusiano, au wakfu.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza muziki
  rationale: Katika vichwa vya zaburi neno hili humaanisha mtu anayeongoza au kusimamia utendaji wa muziki; tafsiri hii ni ya kawaida, wazi, na haibanwi kwa kwaya pekee.
- source_word: עַל
  choice: kwa
  rationale: Hapa neno hili linaanzisha maelekezo kuhusu uandamani wa muziki; ‘kwa’ linaeleza kwa kawaida kwamba ala hizo zitumike katika uimbaji.
- source_word: נְגִינַת
  choice: ala za nyuzi
  rationale: Neno hilo hurejelea muziki au uandamani wa ala za nyuzi; ‘ala za nyuzi’ ni wazi na linafaa katika kichwa cha muziki.
- source_word: לְדָוִד
  choice: Zaburi ya Daudi
  rationale: Kirai ‘ya Daudi’ kinahifadhi kwa kiasi fulani unyumbufu wa kiambishi cha Kiebrania, ambacho kinaweza kuonyesha utunzi, uhusiano, au wakfu, bila kusisitiza moja kwa moja kwamba Daudi ndiye aliyeiandika.
theological_decisions:
- issue: Maana ya lamed katika לְדָוִד kwenye kichwa cha zaburi
  choice: Zaburi ya Daudi
  alternative: Zaburi iliyoandikwa na Daudi; Zaburi kwa ajili ya Daudi
  rationale: Muundo wa Kiebrania hauamui kwa lazima kwamba Daudi ndiye mwandishi; unaweza kuonyesha utunzi, uhusiano, au wakfu. Tafsiri na tanbihi vinahifadhi utata huo badala ya kuutatua kimadhehebu au kihistoria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Mwongoza muziki’ ni pana kuliko ‘mwongoza kwaya’ na linaendana vizuri na muktadha wa ala. Alama ya tanbihi imewekwa baada ya ‘Daudi,’ ambayo ndiyo inayofafanuliwa.
