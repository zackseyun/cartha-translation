  text: יָמִ֣ים עַל יְמֵי מֶ֣לֶךְ תּוֹסִ֑יף שְׁ֝נוֹתָ֗י/ו כְּמוֹ דֹ֥ר וָ/דֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/006.yaml
  text: May you add days to the days of the king[b][a]; may his years be like generation after generation.
translation:
  language: sw
  text: Uongeze siku kwa siku za mfalme[a]; miaka yake iwe kama kizazi baada ya kizazi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Utaongeza siku kwa siku za mfalme; miaka yake itakuwa kama kizazi baada ya kizazi.” Umbo la kitenzi cha Kiebrania linaweza kueleweka kama taarifa ya wakati ujao badala ya ombi.
    reason: alternative_reading
  - marker: b
    text: Kwa Kiebrania, “kizazi na kizazi,” yaani, kuendelea katika vizazi vinavyofuatana.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִים עַל יְמֵי מֶלֶךְ
  choice: siku kwa siku za mfalme
  rationale: Huhifadhi taswira ya Kiebrania ya kuongeza siku juu ya siku, huku ‘kwa’ ikieleza kwa Kiswahili cha kawaida kile kinachoongezwa kwenye siku alizo nazo mfalme.
- source_word: תּוֹסִיף
  choice: uongeze
  rationale: Ni kauli ya ombi inayoelekezwa kwa Mungu. Muundo huu unafaa muktadha wa sala, bila kuficha kwamba kitenzi hicho kinaweza pia kueleweka kama taarifa ya wakati ujao.
- source_word: שְׁנוֹתָיו
  choice: miaka yake
  rationale: Kiwakilishi cha nafsi ya tatu, umoja wa kiume, kinamrejelea mfalme na kudumisha ulinganifu wa ‘siku’ na ‘miaka.’
- source_word: כְּמוֹ
  choice: na iwe
  rationale: Katika Kiswahili, ‘miaka yake na iwe…’ huwasilisha kwa kawaida ombi la ulinganisho linalodokezwa na כְּמוֹ, badala ya tafsiri ngumu ya neno kwa neno.
- source_word: דֹר וָדֹר
  choice: kizazi baada ya kizazi
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha mfululizo wa vizazi unaokusudiwa na nahau ya Kiebrania ‘kizazi na kizazi.’
theological_decisions:
- issue: Ikiwa mstari ni ombi kuhusu maisha marefu ya mfalme au taarifa ya wakati ujao
  choice: 'Imetafsiriwa kama ombi: ‘Uongeze…; miaka yake na iwe…’'
  alternative: ‘Utaongeza…; miaka yake itakuwa…’
  rationale: Ingawa umbo la kitenzi linaweza kueleweka kama wakati ujao, muktadha wa sala unaunga mkono ombi. Tanbihi inahifadhi uwezekano wa tafsiri nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya ‘siku kwa siku’ na ‘kizazi baada ya kizazi’ yanahifadhi taswira na mwendo wa ushairi wa Kiebrania.
