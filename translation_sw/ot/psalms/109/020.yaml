  text: זֹ֤את פְּעֻלַּ֣ת שֹׂ֭טְנַ/י מֵ/אֵ֣ת יְהוָ֑ה וְ/הַ/דֹּבְרִ֥ים רָ֝֗ע עַל נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/020.yaml
  text: This is the reward of my accusers from Yahweh[b][a], and of those who speak evil against my life.
translation:
  language: sw
  text: 'Haya ndiyo malipo ya washtaki wangu yatokayo kwa Yahwe,[a]

    na ya wale wanaosema mabaya dhidi ya uhai wangu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hili ndilo tendo la wapinzani wangu kutoka kwa Yahwe.” Neno la Kiebrania linaweza kumaanisha “tendo,” “kazi,” au, kwa upanuzi wa maana, “malipo”; neno lililotafsiriwa “washtaki” linaweza pia kutafsiriwa “wapinzani.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “dhidi ya nafsi yangu.” Hapa “nafsi” yaweza kumaanisha uhai wangu au mimi mwenyewe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת פְּעֻלַּת
  choice: Haya ndiyo malipo
  rationale: Ingawa פְּעֻלָּה kimsingi ni ‘tendo’ au ‘kazi,’ katika muktadha huu linaonyesha kile kinachowapata wapinzani kama malipo. Kiswahili ‘malipo’ kinafikisha maana hiyo bila kuamua wazi kama ni thawabu au adhabu; muktadha unaonyesha kuwa ni mabaya.
- source_word: שֹׂטְנַי
  choice: washtaki wangu
  rationale: Neno hili linaweza kumaanisha wapinzani au washtaki. Katika Zaburi hii mashitaka na maneno ya uadui yamesisitizwa, hivyo ‘washtaki wangu’ linafaa zaidi hapa.
- source_word: מֵאֵת יְהוָה
  choice: yatokayo kwa Yahwe
  rationale: מֵאֵת huonyesha chanzo au mhusika; ‘yatokayo kwa’ ni Kiswahili cha kawaida kinachoonyesha kuwa malipo hayo yanatoka kwa Yahwe. Jina la agano יְהוָה limetoholewa kama ‘Yahwe.’
- source_word: וְהַדֹּבְרִים רָע
  choice: na ya wale wanaosema mabaya
  rationale: Kiunganishi וְ kimehifadhiwa, na muundo wa pili umeunganishwa na ‘malipo’ kwa kurudia ‘ya.’ רָע hapa ni jambo baya linalosemwa, kwa hiyo ‘wanasema mabaya’ ni sahihi na ya kawaida.
- source_word: עַל נַפְשִׁי
  choice: dhidi ya uhai wangu
  rationale: נֶפֶשׁ linaweza kumaanisha nafsi, mtu mwenyewe, au uhai. ‘Uhai wangu’ huhifadhi uzito wa hatari binafsi katika muktadha huu, huku ‘dhidi ya’ ikionyesha uelekeo wa uadui.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu, si cheo אֲדֹנָי. Kutumia ‘Yahwe’ huhifadhi tofauti hiyo ya kimaandishi bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Ikiwa mstari unasema tendo la washtaki au malipo yao kutoka kwa Mungu
  choice: malipo ya washtaki wangu yatokayo kwa Yahwe
  alternative: tendo la washtaki wangu mbele za Yahwe
  rationale: Muungano wa פְּעֻלַּת na מֵאֵת יְהוָה katika muktadha wa hukumu unaunga mkono maana ya malipo yanayotoka kwa Yahwe, lakini maana ya msingi ‘tendo/kazi’ imehifadhiwa katika tanbihi kwa sababu nomino hiyo ina upana wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa mistari miwili unaakisi usambamba wa kishairi. ‘Yatokayo’ ni rasmi lakini linaeleweka kwa urahisi; ‘wanaosema mabaya’ ni la kawaida na halipunguzi uzito wa kimaadili wa רָע.
