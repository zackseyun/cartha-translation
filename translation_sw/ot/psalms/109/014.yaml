base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/014.yaml
  text: May the guilt of his fathers be remembered before Yahweh[c][b][a], and may the sin of his mother not be blotted out.
translation:
  language: sw
  text: Hatia[a] ya baba zake ikumbukwe mbele za Yahwe, na dhambi ya mama yake isifutwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hatia” pia inaweza kutafsiriwa “uovu” au “wajibu unaotokana na dhambi.” “Baba zake” inaweza pia kueleweka “mababu zake”; kwa Kiebrania, ni “baba zake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזָּכֵר
  choice: na ikumbukwe
  rationale: Niphal isiyo timilifu ina nguvu ya ombi au laana katika muktadha huu; umbo la kutendwa linahifadhiwa kwa Kiswahili cha kawaida.
- source_word: עֲוֺן
  choice: hatia
  rationale: Neno linaweza kumaanisha uovu, hatia, au wajibu wa adhabu unaotokana na dhambi. Hapa “hatia” linafaa na wazo la kukumbukwa mbele za Mungu.
- source_word: אֲבֹתָיו
  choice: baba zake
  rationale: Tafsiri ya karibu ya wingi wa “baba zake”; katika muktadha inaweza pia kuelekea kwa mababu zake, bila kupanua kimya kimya kuwa wazazi wote.
- source_word: אֶל יְהוָה
  choice: mbele za Yahwe
  rationale: Pamoja na kitenzi “kukumbuka,” kirai hiki kinaonyesha jambo kuwekwa katika uwepo na hukumu ya Mungu. Jina la agano linatolewa kama Yahwe.
- source_word: וְחַטַּאת אִמּוֹ
  choice: na dhambi ya mama yake
  rationale: חַטָּאת hapa ni dhambi, si sadaka ya dhambi; umilikaji na uhusiano wa kifamilia vinahifadhiwa moja kwa moja.
- source_word: אַל תִּמָּח
  choice: isifutwe
  rationale: Amri hasi yenye maana ya ombi inaomba dhambi isiondolewe kwenye kumbukumbu; “kufutwa” huhifadhi taswira ya maandishi au kumbukumbu inayofutwa.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina maalumu la agano; “Yahwe” hulitofautisha na cheo cha Bwana na kuakisi kwa karibu zaidi jina hilo.
- issue: Hatia ya vizazi vilivyotangulia kukumbukwa mbele za Mungu
  choice: Kutunza ombi la mshairi bila kulifafanua kama tamko la jumla la mafundisho
  alternative: Kulainisha kuwa matokeo ya dhambi za mababu pekee
  rationale: Aya ni sehemu ya ombi la laana. Tafsiri inapaswa kuhifadhi ukali na mvutano wake wa kitheolojia bila kuamua kimya kimya namna jukumu la mtu binafsi na la vizazi linavyohusiana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. “Mbele za” huhifadhi ladha ya kimahakama bila kuwa kizamani kupita kiasi; “isifutwe” ni ya kawaida na huhifadhi taswira ya Kiebrania.
