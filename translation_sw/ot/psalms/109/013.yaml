  text: May his posterity be cut off[a]; in the next generation may their name be blotted out.
translation:
  language: sw
  text: Wazao wake wakatiliwe mbali[a]; katika kizazi kinachofuata jina lao lifutwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwisho wake uwe wa kukatiliwa mbali.” Neno la Kiebrania אַחֲרִית linaweza kumaanisha “mwisho” au “wakati ujao,” lakini hapa muktadha unaelekeza kwa wazao.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: na waangamizwe
  rationale: Muundo wa ombi/laanisho unaonyeshwa kwa kiambishi cha kutakia ‘na’, kinachohifadhi nguvu ya jussive katika Kiswahili cha kawaida.
- source_word: אַחֲרִיתוֹ
  choice: wazao wake
  rationale: Ingawa neno linaweza kumaanisha ‘mwisho wake’ au ‘wakati wake ujao’, muktadha wa kukatiliwa mbali na kufutwa kwa jina katika kizazi kinachofuata unaelekeza kwa ukoo au wazao wake.
- source_word: לְהַכְרִית
  choice: waangamizwe
  rationale: Kitenzi כרת hapa kina wazo la kukatiliwa mbali au kuondolewa kabisa. ‘Waangamizwe’ ni cha asili kwa watu katika Kiswahili na kinaonyesha matokeo bila kupunguza ukali wa ombi.
- source_word: בְּדוֹר אַחֵר
  choice: katika kizazi kinachofuata
  rationale: Hueleza kizazi cha baadaye kinachofuata; usemi huu ni wazi na wa kawaida kuliko tafsiri halisi ‘kizazi kingine’.
- source_word: יִמַּח
  choice: na lifutwe
  rationale: Nifali ya מחה humaanisha kufutwa au kuondolewa; ‘lifutwe’ linafaa kwa kitu ‘jina’ na kuhifadhi taswira ya maandishi ya Kiebrania.
- source_word: שְׁמָם
  choice: jina lao
  rationale: Kiambishi cha Kiebrania ni cha wingi, kikirejelea wazao kama kundi, huku ‘jina’ likibaki umoja wa kijumla; Kiswahili ‘jina lao’ huhifadhi mabadiliko hayo.
theological_decisions:
- issue: Nguvu ya laana/ombi la hukumu
  choice: Kuhifadhi muundo wa kutakia kwa ‘na ...’ kama ombi la hukumu dhidi ya ukoo wa mtu mwovu
  alternative: Kulitafsiri kama utabiri tu wa yatakayotokea
  rationale: Jussive na muktadha wa Zaburi 109 vinaonyesha ombi la hukumu, si taarifa isiyoegemea upande wowote. Tafsiri hailegezi ukali huo wala kuufafanua kwa mfumo fulani wa kimadhehebu.
- issue: Rejeo la אַחֲרִיתוֹ
  choice: Wazao wake
  alternative: Mwisho wake uwe wa kuangamizwa
  rationale: Mstari sambamba kuhusu kizazi kinachofuata na ‘jina lao’ unaunga mkono rejeo la kizazi/ukoo, lakini maana mbadala halisi imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘na ...’ umetumiwa kuwasilisha ombi/laanisho la kishairi. ‘Wazao’ ni neno linaloeleweka kwa urahisi na linafaa kwa ukoo unaoendelea. Alama ya tanbihi [a] imewekwa baada ya kipashio kinachohusika.
