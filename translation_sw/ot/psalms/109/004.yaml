  text: In return for my love[a], they accuse me, but I am prayer.
translation:
  language: sw
  text: Kwa malipo ya upendo wangu, wao hunishtaki, lakini mimi ni sala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kueleza wazi zaidi: “lakini mimi husali” au “lakini mimi ni mtu wa sala.” Katika Kiebrania, kihalisi ni, “lakini mimi ni sala.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: Badala ya
  rationale: Katika muktadha huu neno linaonyesha malipo ya kinyume—wanarudisha uadui kwa upendo—wala si maana ya mahali ya kuwa chini ya kitu.
- source_word: אַהֲבָתִי
  choice: upendo wangu
  rationale: Hili ni neno la kawaida na la moja kwa moja kwa upendo, na linahifadhi uhusiano wake na msamiati mpana wa kibiblia wa kupenda.
- source_word: יִשְׂטְנוּנִי
  choice: wao hunishtaki
  rationale: Kitenzi kinaweza kumaanisha kutenda kama adui au kushtaki. 'Hunishtaki' kinabeba vizuri maana ya uadui yenye kidokezo cha kimahakama.
- source_word: וַאֲנִי
  choice: lakini mimi
  rationale: Ingawa kiunganishi kimsingi ni 'na,' hapa kinaonyesha tofauti kati ya tendo lao na mwitikio wa msemaji.
- source_word: תְפִלָּה
  choice: sala
  rationale: Kiebrania kina kishazi kifupi kisicho na kitenzi, kihalisi 'mimi [ni] sala.' Kutumia nomino kunahifadhi mkazo na taswira yake ya kushangaza.
theological_decisions:
- issue: Maana ya kishazi kifupi וַאֲנִי תְפִלָּה
  choice: lakini mimi ni sala
  alternative: lakini mimi husali; lakini mimi ni mtu wa sala
  rationale: Matini kuu inahifadhi muundo wa kinomino na nguvu ya usemi wa Kiebrania bila kuufafanua kupita kiasi. Maana zilizo wazi zaidi zimewekwa katika tanbihi ili kuhifadhi utata halisi wa usemi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Neno 'sala' limechaguliwa badala ya kulainisha usemi kuwa kitenzi, ili kuhifadhi ufupi na uzito wa kishazi cha Kiebrania.
