  text: תְּהִי ל֭/וֹ כְּ/בֶ֣גֶד יַעְטֶ֑ה וּ֝/לְ/מֵ֗זַח תָּמִ֥יד יַחְגְּרֶֽ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/019.yaml
  text: May it be like a garment that he wraps around himself[a], and like a belt that he always girds on.
translation:
  language: sw
  text: Na iwe kwake kama vazi analojifunika nalo,[a] na kama mshipi anaoujifunga daima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na iwe kwake kama nguo anayovaa, na kama ukanda anaojifunga sikuzote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהִי
  choice: Na iwe
  rationale: Kauli ya jussive ya kitenzi היה inaonyesha ombi au laana; “na iwe” huhifadhi nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: ל֭וֹ
  choice: kwake
  rationale: Kihusishi chenye kiambishi cha nafsi kinaonyesha jambo hilo liwe juu ya au limhusu mtu anayelengwa.
- source_word: כְּבֶגֶד
  choice: kama vazi
  rationale: בגד ni neno la jumla kwa vazi au nguo; “vazi” huhifadhi sitiari bila kutaja aina maalumu ya nguo.
- source_word: יַעְטֶה
  choice: analojifunika nalo
  rationale: עטה inaweza kumaanisha kujifunika, kujizungushia, au kuvaa; uchaguzi huu huhifadhi picha ya kufunikwa na vazi.
- source_word: וּלְמֵזַח
  choice: na kama mshipi
  rationale: מֵזַח ni kitu kinachofungwa kiunoni, yaani mshipi; neno hili ni wazi na la sasa katika Kiswahili.
- source_word: תָּמִיד
  choice: daima
  rationale: Kielezi hiki huonyesha hali ya kudumu au kuendelea bila kukoma.
- source_word: יַחְגְּרֶהָ
  choice: anaoujifunga
  rationale: חגר pamoja na kiambishi cha kike hurejelea kufunga kitu hicho kiunoni; “anaoujifunga” huhifadhi tendo mahsusi kuliko kusema tu “anaouvaa”.
theological_decisions:
- issue: Nguvu ya jussive katika muktadha wa laana
  choice: 'Kutafsiri kama ombi/laana: “Na iwe...”'
  alternative: 'Kutafsiri kama taarifa ya wakati ujao: “Itakuwa...”'
  rationale: Maumbo ya Kiebrania na muktadha wa Zaburi 109 yanaonyesha hukumu inayotamaniwa au kuombwa, si utabiri wa kawaida tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Mshipi” na “kujifunga” huhifadhi taswira ya kitu kinachofungwa kiunoni; tanbihi inaonyesha uwezekano mpana wa עטה na tofauti halali za msamiati.
