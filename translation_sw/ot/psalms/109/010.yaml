  text: May his children wander about and beg[a]; may they seek from their ruins.
translation:
  language: sw
  text: Watoto wake watangatange huku na huku na waombeomba; watafute kutoka katika magofu yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watafute mbali na magofu yao,” ikiwa kihusishi kinaeleweka kumaanisha kujitenga badala ya chanzo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנ֤וֹעַ יָנ֣וּעוּ
  choice: na watangatange huku na huku
  rationale: Muundo wa kitenzi-jina kisicho kikomo pamoja na kitenzi cha hali isiyotimilika unasisitiza kutangatanga. Katika muktadha huu wa laana, ‘na watangatange’ huwasilisha matakwa ya msemaji, huku ‘huku na huku’ ikidokeza mwendo unaorudiwa.
- source_word: בָנָיו
  choice: watoto wake
  rationale: Ingawa neno linaweza kumaanisha ‘wanawe,’ hapa ‘watoto wake’ ni Kiswahili cha kawaida kinachohifadhi maana pana ya kifamilia.
- source_word: וְשִׁאֵלוּ
  choice: na kuombaomba
  rationale: Katika muktadha wa ufukara na kutangatanga, kitenzi hiki kina maana ya kuomba msaada au sadaka; ‘kuombaomba’ ni cha asili zaidi kuliko ‘kuuliza’.
- source_word: וְדָרְשׁוּ
  choice: watafute riziki
  rationale: Maana ya msingi ni ‘kutafuta.’ Kirai ‘riziki’ kinaweka wazi kitu kinachodokezwa na muktadha wa kuombaomba, bila kukifunga kwa chakula pekee.
- source_word: מֵחָרְבוֹתֵיהֶם
  choice: katika magofu yao
  rationale: חָרְבוֹת ni mahali palipoharibiwa au magofu. מִן inaweza kuonyesha chanzo, hivyo Kiswahili cha asili ‘katika magofu yao’ huonyesha kwamba wanatafuta riziki humo; uwezekano wa maana ya kujitenga umehifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Kuombaomba’ na ‘magofu’ ni maneno ya sasa na ya kawaida. Muundo wa matakwa ya laana umehifadhiwa bila kupunguza ukali wake.
