translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya kawaida lakini yenye hadhi. ‘Magoti yangu yanalegea’ huonyesha kudhoofika kimwili; ‘mwili wangu umekonda’ ni ya kawaida zaidi kuliko ‘nyama yangu imekonda.’ Alama ya tanbihi [a] imewekwa baada ya kishazi kinachoifafanua.
