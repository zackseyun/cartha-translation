  text: My knees give way from fasting[a], and my flesh grows lean from lack of fat.
translation:
  language: sw
  text: Magoti yangu yanalegea kwa kufunga, na mwili wangu umekonda kwa kukosa mafuta mwilini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwili wangu umepungua mafuta mwilini.” Usemi wa Kiebrania unarejelea kupoteza mafuta ya mwilini, yaani kukonda sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכַּי
  choice: magoti yangu
  rationale: Nomino ya wingi yenye kiambishi cha nafsi ya kwanza; maana ya kawaida ya kiungo cha mwili inafaa katika picha hii ya udhaifu wa kimwili.
- source_word: כָּשְׁלוּ
  choice: yanalegea
  rationale: Kitenzi huonyesha kujikwaa, kuyumba, au kushindwa kusimama imara. Kwa magoti yaliyodhoofishwa na kufunga, ‘yanalegea’ ni usemi wa kawaida wa Kiswahili unaohifadhi picha hiyo.
- source_word: מִצּוֹם
  choice: kwa kufunga
  rationale: 'Kihusishi מִן kinaonyesha sababu hapa: magoti yamedhoofika kutokana na kufunga. ‘Kwa kufunga’ ni kifupi na cha asili.'
- source_word: וּבְשָׂרִי
  choice: na mwili wangu
  rationale: בשר ni ‘nyama/mwili.’ Katika Kiswahili, ‘mwili wangu’ huwasilisha kwa kawaida maelezo haya ya hali ya kimwili bila maana isiyokusudiwa ya nyama kama chakula.
- source_word: כָּחַשׁ
  choice: umekonda
  rationale: Kitenzi kina maana ya kuwa mwembamba, kudhoofika, au kukonda. ‘Umekonda’ ni wazi, cha sasa, na kinaonyesha ukondefu wa mwili.
- source_word: מִשָּׁמֶן
  choice: kwa kukosa mafuta
  rationale: Kirai kinaonyesha kutoweka au kukosekana kwa mafuta ya mwilini. Tafsiri hii inadumisha nahau ya Kiebrania huku ikiifanya ieleweke kwa msomaji wa Kiswahili.
