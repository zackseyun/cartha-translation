  yaml_path: translation/ot/psalms/109/002.yaml
  text: For the mouth of the wicked and the mouth of deceit have opened against me[b][a]; they have spoken to me with a lying tongue.
translation:
  language: sw
  text: Kwa maana kinywa cha mwovu na kinywa cha udanganyifu vimefunguka dhidi yangu; wamesema nami kwa ulimi wa uongo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wamesema pamoja nami kwa ulimi wa uongo.” Kiebrania kina neno linaloweza kumaanisha “nami/pamoja nami”; katika muktadha huu linaweza pia kueleweka kuwa maneno hayo yalielekezwa kwa mtunga zaburi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza nguvu ya kisababishi ya mstari huu kama sababu ya ombi la mtunga zaburi katika muktadha.
- source_word: פִי רָשָׁע
  choice: kinywa cha mwovu
  rationale: Inahifadhi muundo wa Kiebrania wa nomino katika hali ya uhusiano; רָשָׁע hapa imetumika kama nomino ya mtu mwovu bila kuongeza jinsia isiyotajwa.
- source_word: וּפִי מִרְמָה
  choice: na kinywa cha udanganyifu
  rationale: Inahifadhi kurudiwa kwa neno 'kinywa' na usambamba wa Kiebrania; מִרְמָה huonyesha udanganyifu au hila.
- source_word: עָלַי פָּתָחוּ
  choice: vimefunguka dhidi yangu
  rationale: Muundo wa 'kufungua kinywa dhidi ya' unaonyesha usemi wa uhasama. Wingi wa kitenzi cha Kiebrania umeakisiwa kwa 'vimefunguka' kwa kuwa vinywa viwili vimetajwa.
- source_word: דִּבְּרוּ אִתִּי
  choice: wamesema nami
  rationale: אִתִּי kimsingi inaweza kuwa 'nami/pamoja nami'; tafsiri hii huhifadhi utata wa uhusiano wa usemi bila kurudia moja kwa moja 'dhidi yangu' ya kishazi kilichotangulia.
- source_word: לְשׁוֹן שָׁקֶר
  choice: kwa ulimi wa uongo
  rationale: Inadumisha taswira halisi ya Kiebrania ya 'ulimi' na muundo wa uhusiano 'wa uongo' kwa Kiswahili cha asili.
theological_decisions: []
