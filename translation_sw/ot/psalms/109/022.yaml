translation:
  language: sw
  text: 'Kwa maana mimi ni maskini na mhitaji,

    na moyo wangu umejeruhiwa ndani yangu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “moyo wangu umechomwa ndani yangu.” Kitenzi cha Kiebrania kinaweza kumaanisha kuchomwa, kujeruhiwa, au kuumizwa hadi kufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu au msingi wa ombi katika muktadha, huku ikidumisha kiunganishi cha Kiebrania kwa Kiswahili cha kawaida.
- source_word: עָנִי
  choice: maskini
  rationale: Neno linaweza kumaanisha maskini, mwenye kuteseka, au aliyeonewa. “Maskini” linafaa katika jozi hii bila kuficha hali ya dhiki.
- source_word: אֶבְיוֹן
  choice: mhitaji
  rationale: Linadumisha tofauti na עָנִי na kueleza mtu asiye na mahitaji ya msingi au asiyejiweza.
- source_word: אָנֹכִי
  choice: mimi ni
  rationale: Kiwakilishi huru kimetajwa wazi na kwa mkazo; “mimi ni” kinadumisha mkazo huo kwa Kiswahili cha asili.
- source_word: לִבִּי
  choice: moyo wangu
  rationale: Ni tafsiri ya kawaida inayoweza pia kuwakilisha nafsi ya ndani, mawazo, na nia katika mtazamo wa Kiebrania.
- source_word: חָלַל
  choice: umejeruhiwa
  rationale: Katika muktadha huu kitenzi kinaonyesha kuchomwa, kujeruhiwa, au kupigwa vibaya sana. “Umejeruhiwa” ni cha asili na kinahifadhi upana wa maana bila kulazimisha aina moja ya jeraha.
- source_word: בְּקִרְבִּי
  choice: ndani yangu
  rationale: Kifungu kinaonyesha mahali pa ndani; “ndani yangu” ni wazi na cha kawaida katika Kiswahili.
theological_decisions:
- issue: Ikiwa jeraha la moyo lieleweke kihalisi au kama taswira ya dhiki ya ndani
  choice: moyo wangu umejeruhiwa ndani yangu
  alternative: moyo wangu umechomwa ndani yangu
  rationale: Tafsiri inadumisha taswira halisi ya Kiebrania bila kuamua kwamba ni jeraha la mwili au huzuni ya kihisia pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa mistari unafuata usambamba wa kishairi wa mstari wa Kiebrania.
