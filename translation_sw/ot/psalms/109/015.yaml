  text: יִהְי֣וּ נֶֽגֶד יְהוָ֣ה תָּמִ֑יד וְ/יַכְרֵ֖ת מֵ/אֶ֣רֶץ זִכְרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/015.yaml
  text: May they be before Yahweh continually[a], and may he cut off their memory from the earth.
translation:
  language: sw
  text: Na hayo yawe mbele ya Yahweh daima, naye afutilie mbali kumbukumbu yao duniani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nchini”; neno la Kiebrania אֶרֶץ linaweza kumaanisha “dunia” au “nchi,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Na yawe
  rationale: Kauli ya Qal isiyotimilika, nafsi ya tatu wingi, ina nguvu ya ombi katika muktadha huu wa maombi ya hukumu; Kiswahili hiki kinaendeleza ombi hilo.
- source_word: נֶגֶד
  choice: mbele za
  rationale: Inaonyesha kuwa katika uwepo wa mtu au kuwekwa mbele yake; usemi huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: תָּמִיד
  choice: daima
  rationale: Huwasilisha mwendelezo usiokoma kwa lugha ya kawaida na yenye uzito.
- source_word: וְיַכְרֵת
  choice: naye ayafutilie mbali
  rationale: Hiphil isiyotimilika ya nafsi ya tatu umoja inaeleweka hapa kama ombi linaloendeleza kishazi kilichotangulia. ‘Kufutilia mbali’ huwasilisha kuondolewa kabisa kwa kumbukumbu.
- source_word: מֵאֶרֶץ
  choice: duniani
  rationale: אֶרֶץ inaweza kumaanisha dunia au nchi; katika usemi wa kuondoa kumbukumbu, ‘duniani’ linaonyesha kwa kawaida upeo mpana, huku uwezekano wa ‘nchini’ ukihifadhiwa katika tanbihi.
- source_word: זִכְרָם
  choice: kumbukumbu yao
  rationale: Hurejelea kile kinachowafanya wakumbukwe au ukumbusho wao; tafsiri hii ni ya asili na inahifadhi nahau ya Kiebrania.
theological_decisions:
- issue: Nguvu ya ombi/laana katika vitenzi vya mstari
  choice: 'Vitenzi vyote viwili vimetafsiriwa kama maombi: ‘Na yawe ... naye ayafutilie mbali.’'
  alternative: ‘Yatakuwa mbele za Yahweh daima, naye atafutilia mbali kumbukumbu yao duniani.’
  rationale: Muktadha ni sala ya hukumu, na vitenzi vya Kiebrania visivyotimilika vinaweza kuwa na nguvu ya ombi hapa. Tafsiri hii inadumisha mvutano na ukali wa sala bila kuifanya kuwa taarifa rahisi ya wakati ujao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kiwakilishi ‘ya-’ kinarejelea mambo yaliyotajwa katika muktadha uliotangulia, hasa uovu na dhambi; ‘naye’ humrejelea Yahweh.
