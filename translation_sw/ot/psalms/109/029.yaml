  text: יִלְבְּשׁ֣וּ שׂוֹטְנַ֣/י כְּלִמָּ֑ה וְ/יַעֲט֖וּ כַ/מְעִ֣יל בָּשְׁתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/029.yaml
  text: May my accusers be clothed with disgrace[a], and wrap themselves in their shame like a robe.
translation:
  language: sw
  text: Wanaonishtaki wavikwe fedheha[a], na wajifunike kwa aibu yao kama kwa joho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wapinzani wangu.” Neno la Kiebrania linaweza kumaanisha wapinzani kwa jumla au wale wanaomshtaki mtu katika maana ya kisheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִלְבְּשׁוּ
  choice: wavikwe
  rationale: Kauli ya kutendwa katika Kiswahili inaendeleza picha ya kuvikwa fedheha, huku hali ya kutamani au kuomba ikionyeshwa na kiambishi cha utegemezi katika muktadha wa sala.
- source_word: שׂוֹטְנַי
  choice: wanaonishtaki
  rationale: Neno hili linaweza kumaanisha wapinzani kwa jumla au washitaki katika maana ya kisheria; hapa tafsiri hii inafaa muktadha wa mashtaka na inadumisha kiambishi cha nafsi ya kwanza.
- source_word: כְּלִמָּה
  choice: fedheha
  rationale: Fedheha hueleza aibu ya hadharani na pia hutofautisha neno hili na בָּשְׁתָּם, lililotafsiriwa ‘aibu yao.’
- source_word: וְיַעֲטוּ
  choice: na wajifunike
  rationale: Kitenzi עטה kina maana ya kujifunika au kujizungushia vazi; umbo la kujirejelea ni la kawaida na wazi katika Kiswahili.
- source_word: כַמְעִיל
  choice: kama kwa joho
  rationale: מְעִיל ni vazi la nje linalofunika mwili; ‘joho’ ni neno la sasa na lenye hadhi linalodumisha sitiari ya vazi.
- source_word: בָּשְׁתָּם
  choice: aibu yao
  rationale: Tafsiri ya moja kwa moja inadumisha kiambishi cha wingi cha nafsi ya tatu na picha ya aibu kuwa kitu kinachowafunika.
theological_decisions:
- issue: Hali ya vitenzi katika zaburi ya maombi dhidi ya maadui
  choice: 'Kutafsiri vitenzi kama ombi au tamanio: ‘wavikwe ... na wajifunike.’'
  alternative: 'Kutafsiri kama utabiri wa wakati ujao: ‘watafunikwa ... nao watajifunika.’'
  rationale: Katika muktadha wa maombi ya Zaburi 109, vitenzi vya wakati usiotimilika vinaeleweka kwa kawaida kama ombi dhidi ya maadui. Hali ya utegemezi ya Kiswahili inadumisha maana hiyo bila kuifanya kuwa utabiri wa moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Fedheha’ na ‘aibu’ zinadumisha maneno mawili ya Kiebrania yaliyo katika uwanja mmoja wa maana bila kurudia neno lilelile; picha ya mavazi inadumishwa kwa ‘wavikwe,’ ‘wajifunike,’ na ‘joho.’
