base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/031.yaml
  text: For he stands at the right hand of the poor[b][a], to save him from those who judge his soul.
translation:
  language: sw
  text: Kwa maana yeye husimama upande wa kulia wa mhitaji, ili kumwokoa kutoka kwa wale wanaohukumu maisha yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kwa wahukumu wake.” Kiebrania kinaweza kumaanisha wale wanaomhukumu rasmi au, kwa upana zaidi, wale wanaotamka hukumu dhidi yake. Pia, “maisha yake” linaweza kutafsiriwa “nafsi yake” au “yeye mwenyewe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya sifa na uhakikisho uliotangulia, huku ikidumisha mtiririko wa kishairi.
- source_word: יַעֲמֹד
  choice: husimama
  rationale: Kauli ya kutokamilika inaweza kueleza tendo la kawaida au la hakika; 'husimama' linaonyesha msimamo wa Mungu wa kudumu bila kulazimisha wakati ujao.
- source_word: לִימִין
  choice: upande wa kulia wa
  rationale: Inahifadhi sitiari ya Kiebrania ya uwepo wa karibu, msaada, na utetezi.
- source_word: אֶבְיוֹן
  choice: mhitaji
  rationale: Neno hili humaanisha mtu maskini, mwenye uhitaji, na aliye katika hali ya kudhulumiwa; 'mhitaji' ni la kawaida na pana katika Kiswahili cha sasa.
- source_word: לְהוֹשִׁיעַ
  choice: ili kumwokoa
  rationale: Kitenzi-jina kinaonyesha kusudi; 'kumwokoa' kinafaa kwa uokozi wa kimahakama na wa maisha.
- source_word: מִשֹּׁפְטֵי
  choice: kutoka kwa wale wanaohukumu
  rationale: Kinadumisha maana ya watu wanaotekeleza hukumu au wanaotamka hukumu dhidi yake bila kuongeza wazi dhana ya kumtia hatiani.
- source_word: נַפְשׁוֹ
  choice: maisha yake
  rationale: Katika muktadha huu wa tishio na hukumu, נֶפֶשׁ linaelekea kumaanisha maisha au nafsi nzima ya mtu, si lazima sehemu isiyo ya mwili.
theological_decisions:
- issue: Maana ya kianthropolojia ya נֶפֶשׁ
  choice: maisha yake
  alternative: nafsi yake; yeye mwenyewe
  rationale: Muktadha unahusu kuokolewa kutoka kwa wahukumu wenye uhasama. 'Maisha yake' linatunza uzito wa tishio bila kulifanya neno hilo limaanishe kwa lazima nafsi isiyo ya mwili.
- issue: Wakati na namna ya יַעֲמֹד
  choice: husimama
  alternative: atasimama; anasimama
  rationale: Hali ya kitenzi inaweza kueleza tendo la kawaida au uhakika wa tendo. Tafsiri hii haifungi mstari katika wakati ujao pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya kusimama upande wa kulia imehifadhiwa; alama ya tanbihi imewekwa baada ya kishazi kinachohitaji ufafanuzi.
