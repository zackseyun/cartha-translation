  text: יִֽהְיוּ בָנָ֥י/ו יְתוֹמִ֑ים וְ֝/אִשְׁתּ/וֹ אַלְמָנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/009.yaml
  text: May his sons be fatherless[a], and his wife a widow.
translation:
  language: sw
  text: Wanawe wa kiume wawe bila baba[a], na mke wake awe mjane.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yatima.” Neno la Kiebrania linaweza kumaanisha watoto yatima; hapa “bila baba” hufaa kwa sababu ya ulinganifu na maneno “mke wake awe mjane.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: na wawe
  rationale: Muundo huu wa Kiswahili unaonyesha hali ya ombi au laana inayotakiwa itimie, badala ya kuitafsiri kama taarifa rahisi ya wakati ujao.
- source_word: בָנָיו
  choice: wanawe
  rationale: Neno hili linarejelea wana wa mtu huyo. “Wanawe” ni la kawaida na lenye hadhi katika Kiswahili, bila kutumia maelezo mazito kama “watoto wake wa kiume.”
- source_word: יְתוֹמִים
  choice: wasio na baba
  rationale: Katika muktadha huu, kufanywa kwa mke kuwa mjane kunaonyesha hasa kupotea kwa baba. Tafsiri hii inaweka wazi ulinganifu huo; “yatima” limewekwa kama chaguo la kileksika katika tanbihi.
- source_word: וְאִשְׁתּוֹ
  choice: na mke wake
  rationale: Katika muktadha huu אִשָּׁה pamoja na kiambishi cha nafsi humaanisha waziwazi mke wake; kiunganishi וְ kimetafsiriwa “na.”
- source_word: אַלְמָנָה
  choice: mjane
  rationale: Neno la Kiebrania humaanisha moja kwa moja mwanamke aliyefiwa na mume.
theological_decisions:
- issue: Hali ya laana au ombi katika zaburi
  choice: 'Kutafsiri kama takwa au ombi: “na wawe ... awe.”'
  alternative: 'Kauli ya wakati ujao: “watakuwa ... atakuwa.”'
  rationale: Umbo la kitenzi na muktadha wa Zaburi 109 vinaunga mkono maana ya kutakia au kuomba jambo litokee, si unabii au taarifa rahisi. Tafsiri haipunguzi ukali wa maneno hayo wala kuyageuza kuwa maelezo yasiyo ya maombi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Na wawe” na “awe” zinahifadhi mtindo wa ombi au laana; “wasio na baba” ni wazi kwa msomaji wa kawaida na hudumisha ulinganifu wa mstari.
