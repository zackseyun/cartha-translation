base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/008.yaml
  text: May his days be few[a]; may another take his office.
translation:
  language: sw
  text: Siku zake ziwe chache; mwingine achukue wadhifa wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jukumu lake,” “usimamizi wake,” au “nafasi yake.” Neno la Kiebrania linamaanisha wajibu uliokabidhiwa au nafasi ya uteuzi aliyokabidhiwa mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: na ziwe
  rationale: Muundo huu wa Kiswahili unaonyesha nguvu ya ombi au laana ya kijussive katika muktadha, si taarifa rahisi ya wakati ujao.
- source_word: יָמָיו
  choice: siku zake
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya wingi yenye kiambishi cha nafsi ya tatu umoja; hapa inamaanisha muda wa maisha yake.
- source_word: מְעַטִּים
  choice: chache
  rationale: Neno hili linaonyesha idadi ndogo ya siku na kwa kudokeza ufupi wa maisha.
- source_word: פְּקֻדָּתוֹ
  choice: wadhifa wake
  rationale: “Wadhifa” huwasilisha jukumu au nafasi aliyokabidhiwa mtu bila kuifanya istilahi maalumu ya kikanisa.
- source_word: יִקַּח
  choice: na achukue
  rationale: Ingawa kimaumbo ni imperfekti, usambamba wake na kishazi cha kwanza unaipa maana ya kijussive; “na achukue” huhifadhi nguvu hiyo.
- source_word: אַחֵר
  choice: mwingine
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya פְּקֻדָּתוֹ katika mstari unaonukuliwa baadaye katika Matendo 1:20
  choice: wadhifa wake
  alternative: jukumu lake, usimamizi wake, au nafasi yake
  rationale: Neno la Kiebrania linaweza kumaanisha jukumu, usimamizi, au nafasi aliyokabidhiwa mtu. “Wadhifa” huhifadhi maana ya nafasi rasmi iliyokabidhiwa bila kuingiza katika Zaburi maana finyu ya cheo maalumu cha kanisa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa urahisi. Muundo “na ziwe… na achukue” umetumiwa kuhifadhi nguvu ya ombi la laana katika ushairi.
