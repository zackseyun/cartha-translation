source:
  edition: WLC
  text: וְֽ֭/יֵדְעוּ כִּי יָ֣דְ/ךָ זֹּ֑את אַתָּ֖ה יְהוָ֣ה עֲשִׂיתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/027.yaml
  text: Let them know that this is your hand; you[a], O Yahweh, have done it.
translation:
  language: sw
  text: Na wajue kwamba hili ni tendo la mkono wako; wewe, Ee Yahweh, ndiwe uliyelifanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wajue” au “Nao wajue”; umbo la kitenzi cha Kiebrania katika muktadha linaweza kuonyesha ombi au matakwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: Na wajue
  rationale: Kauli ya Qal isiyotimilika, nafsi ya tatu wingi, pamoja na kiunganishi, ina nguvu ya kutakia au kuomba katika muktadha huu. “Na wajue” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: כִּי
  choice: kwamba
  rationale: Neno hili linaanzisha maudhui wanayopaswa kujua, si sababu.
- source_word: יָדְךָ זֹּאת
  choice: hili ni tendo la mkono wako
  rationale: Kiebrania kinasema kwa karibu “hili ni mkono wako.” Kuongeza “tendo la” kunafanya rejeo la kitendo lieleweke katika Kiswahili huku sitiari ya mkono kama uwakilishi wa utendaji na nguvu ya Mungu ikihifadhiwa.
- source_word: אַתָּה
  choice: wewe ... ndiwe
  rationale: Kiwakilishi huru kina mkazo; muundo “wewe ... ndiwe” unaonyesha mkazo huo kwa Kiswahili cha asili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: עֲשִׂיתָהּ
  choice: uliyelifanya
  rationale: Kitenzi עשה pamoja na kiambishi cha kike kinarejelea jambo au tendo lililotajwa. “Uliyelifanya” kinahifadhi maana ya kwamba Yahweh ndiye aliyelitenda.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia jina binafsi la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kuweka cheo mahali pake.
- issue: Mkazo juu ya mtendaji wa tendo
  choice: wewe, Ee Yahweh, ndiwe uliyelifanya
  alternative: Ee Yahweh, umelifanya
  rationale: Kiwakilishi אַתָּה kimetajwa wazi katika Kiebrania kwa ajili ya mkazo; “wewe ... ndiwe” kinahifadhi mkazo bila kuamua zaidi asili ya tendo linalorejelewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Tendo la mkono wako” linafafanua kwa kawaida muundo wa Kiebrania huku likidumisha sitiari ya mkono; “Ee” hutumika kama neno la mwito kwa jina Yahweh.
