base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/030.yaml
  text: I will give great thanks to Yahweh with my mouth[b][a]; in the midst of many I will praise him.
translation:
  language: sw
  text: Nitamshukuru Yahweh sana kwa kinywa changu; katikati ya watu wengi nitamsifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Katikati ya watu wengi” yaani, hadharani miongoni mwa umati.
    reason: cultural_note
lexical_decisions:
- source_word: א֘וֹדֶ֤ה
  choice: Nitamshukuru
  rationale: Hifili ya ידה katika muktadha wa ibada wa Zaburi humaanisha kumshukuru au kumsifu; hapa “nitamshukuru” ni ya kawaida na inaendana na kishazi sambamba “nitamsifu.”
- source_word: יְהוָ֣ה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetolewa moja kwa moja kama “Yahweh,” kwa mujibu wa uamuzi wa kitheolojia uliotolewa.
- source_word: מְאֹ֣ד
  choice: sana
  rationale: Kielezi hiki kinaongeza nguvu ya tendo la kushukuru; “sana” ni Kiswahili cha kawaida, fasaha na cha moja kwa moja.
- source_word: בְּ/פִ֑/י
  choice: kwa kinywa changu
  rationale: Kiambishi ב hapa kinaonyesha chombo au njia ya kutoa shukrani; “kwa kinywa changu” kinadumisha taswira halisi ya Kiebrania.
- source_word: וּ/בְ/ת֖וֹךְ רַבִּ֣ים
  choice: katikati ya watu wengi
  rationale: Tafsiri hii inadumisha maana ya mahali na jamii bila kuongeza wazo la “kusanyiko,” ambalo halijaelezwa wazi katika Kiebrania.
- source_word: אֲהַֽלְלֶֽ/נּוּ
  choice: nitamsifu
  rationale: Pieli ya הלל hapa humaanisha kusifu, na kiambishi cha nafsi ya tatu ya kiume kinamrejelea Yahweh.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; “Yahweh” linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Utambulisho wa kiambishi katika אֲהַלְלֶנּוּ
  choice: Kinamrejelea Yahweh
  alternative: Kuacha mrejeleo ukiwa wa kijumla
  rationale: Muundo wa mstari unamweka Yahweh kama mtendewa wa shukrani na sifa, hivyo “nitamsifu” humrejelea yeye bila kuongeza ufafanuzi wa kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa vishazi na taswira ya “kinywa” vimehifadhiwa; usemi “katikati ya watu wengi” umeachwa katika matini ili kutunza upana wa Kiebrania, huku tanbihi ikieleza maana yake ya hadharani.
