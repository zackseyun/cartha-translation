  text: עָ֭זְרֵ/נִי יְהוָ֣ה אֱלֹהָ֑/י ה֭וֹשִׁיעֵ֣/נִי כְ/חַסְדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/026.yaml
  text: Help me[a], O Yahweh my God; save me according to your steadfast love.
translation:
  language: sw
  text: Ee Yahwe, Mungu wangu, nisaidie; uniokoe kulingana na upendo wako thabiti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uniokoe kwa kadiri ya uaminifu wako wa agano.” Neno la Kiebrania חֶסֶד humaanisha upendo mwaminifu na wa kudumu, na linaweza pia kuwa na maana inayohusiana na agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזְרֵנִי
  choice: nisaidie
  rationale: Ni kauli ya amri yenye kiambishi cha nafsi ya kwanza umoja, na inaeleza moja kwa moja ombi la msaada.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi matumizi ya jina la agano katika maandishi ya Kiebrania.
- source_word: אֱלֹהָי
  choice: Mungu wangu
  rationale: Umbo hili lina kiambishi cha nafsi ya kwanza umoja na hapa linatumika kumwita Mungu moja kwa moja.
- source_word: הוֹשִׁיעֵנִי
  choice: uniokoe
  rationale: Ni kauli ya amri ya mzizi ישׁע yenye kiambishi cha nafsi ya kwanza umoja; ‘uniokoe’ huhifadhi maana pana ya kuokolewa kutoka hatarini.
- source_word: כְחַסְדֶּךָ
  choice: kulingana na upendo wako thabiti
  rationale: כְּ huonyesha kipimo au msingi unaolingana na tendo linaloombwa, huku חֶסֶד ikieleza upendo mwaminifu, imara na wa kudumu; inaweza pia kuwa na maana ya kiagano.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina binafsi la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya חֶסֶד
  choice: upendo wako thabiti
  alternative: uaminifu wako wa agano
  rationale: ‘Upendo wako thabiti’ huhifadhi upana wa neno, ambalo huunganisha upendo, uaminifu na ushikamanifu; maana ya agano inawezekana lakini haijawekwa wazi kwa lazima katika mstari huu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sala ulio wazi na wenye heshima. ‘Ee’ huonyesha mwito wa moja kwa moja; vitenzi ‘nisaidie’ na ‘uniokoe’ huhifadhi uharaka na usambamba wa kishairi wa Kiebrania.
