translation:
  language: sw
  text: 'Kwa mwongozi wa waimbaji. Zaburi ya Daudi.[a]


    Ee Mungu wa sifa yangu, usinyamaze.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa Daudi,” “kwa ajili ya Daudi,” au “kuhusu Daudi”; maneno ya Kiebrania katika kichwa yanaweza kueleweka kwa njia zaidi ya moja.
    reason: alternative_reading
  - marker: b
    text: Au “usibaki kimya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwiongozi wa waimbaji
  rationale: Neno hili la kichwa linaelekea kumtaja msimamizi wa uimbaji au muziki; tafsiri hii ni wazi na ya kawaida katika Kiswahili bila kudai kwa uhakika zaidi ya Kiebrania.
- source_word: אֱלֹהֵי תְהִלָּתִי
  choice: Ee Mungu ninayekusifu
  rationale: Muundo halisi ni ‘Mungu wa sifa yangu.’ Tafsiri hii ya asili inaeleweka kwa urahisi na kuhifadhi wazo kwamba Mungu ndiye anayesifiwa na mtunga zaburi.
- source_word: אַל־תֶּחֱרַשׁ
  choice: usinyamaze
  rationale: Kitenzi kina maana ya kuwa au kubaki kimya; katika ombi hili ‘usinyamaze’ ni fupi, ya asili, na yenye nguvu.
theological_decisions:
- issue: Maana ya לְדָוִד katika kichwa
  choice: ya Daudi
  alternative: cha Daudi; kwa ajili ya Daudi; kuhusu Daudi
  rationale: Kihusishi cha Kiebrania kinaweza kuonyesha uandishi au uhusiano mwingine. Tafsiri ya kawaida imewekwa katika maandishi, huku utata wa kweli ukihifadhiwa katika tanbihi.
- issue: Uhusiano wa Mungu na ‘sifa yangu’
  choice: Mungu ninayekusifu
  alternative: Mungu wa sifa yangu
  rationale: Chaguo hili haliongezi dai maalumu la kidhehebu; linaeleza kwa Kiswahili cha kawaida maana inayowezekana zaidi, huku tafsiri ya karibu zaidi na muundo wa Kiebrania ikitajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Kichwa kimetenganishwa na ombi kuu kwa kuvunja mstari; lugha imewekwa kwa ufupi unaolingana na mtindo wa zaburi.
