source:
  edition: WLC
  text: אַל יְהִי ל֭/וֹ מֹשֵׁ֣ךְ חָ֑סֶד וְֽ/אַל יְהִ֥י ח֝וֹנֵ֗ן לִ/יתוֹמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/012.yaml
  text: Let there be no one to extend kindness to him[b][a], and let there be no one to show favor to his fatherless children.
translation:
  language: sw
  text: Asiwepo mtu wa kuendelea kumtendea wema,[a] wala asiwepo wa kuwaonea huruma watoto wake waliofiwa na baba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wa kumwendelezea fadhili”; nahau ya Kiebrania husema kihalisi “kuvuta” wema.
    reason: lexical_alternative
  - marker: b
    text: Au, “yatima wake.” Neno la Kiebrania mara nyingi humaanisha watoto waliofiwa na baba.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֵׁךְ
  choice: kuendelea kumtendea
  rationale: Kitenzi hiki kihalisi huhusu kuvuta au kurefusha; pamoja na חֶסֶד hapa kinamaanisha kuendeleza au kuzidisha wema kwa mtu. Kauli hii ni ya kawaida na wazi katika Kiswahili.
- source_word: חָסֶד
  choice: wema
  rationale: Katika muktadha huu neno linahusu fadhili, rehema, au upendo mwaminifu anaotendewa mtu. “Wema” ni fupi na ya kawaida huku ikiacha upana wa maana ya Kiebrania.
- source_word: חוֹנֵן
  choice: kuwaonea huruma
  rationale: Kitenzi חנן humaanisha kumfadhili mtu au kumwonyesha neema na huruma. Kwa watoto walio katika hali ya hatari, “kuwaonea huruma” ni Kiswahili cha kawaida kinachodokeza matendo ya fadhili, si hisia pekee.
- source_word: יְתוֹמָיו
  choice: watoto wake waliofiwa na baba
  rationale: יָתוֹם humaanisha yatima, na mara nyingi hasa mtoto asiye na baba katika mazingira ya kijamii na kisheria ya Kiebrania. Tafsiri hii inaweka wazi uhusiano unaodokezwa na kiambishi cha umilikaji.
- source_word: אַל יְהִי
  choice: Asiwepo mtu
  rationale: Muundo wa kukataza katika hali ya ombi unaonyesha tamanio au dua kwamba mtu wa aina hiyo asiwepo. “Asiwepo mtu” huhifadhi nguvu ya ombi la laana bila kuligeuza kuwa utabiri.
theological_decisions:
- issue: Kuhifadhi nguvu ya ombi la laana
  choice: 'Kutumia ombi la moja kwa moja: “Asiwepo mtu...”'
  alternative: 'Kulainisha kuwa taarifa ya wakati ujao: “Hatakuwapo mtu...”'
  rationale: Vitenzi vya Kiebrania ni vya hali ya ombi/tamanio, si utabiri wa kawaida. Tafsiri ya moja kwa moja huhifadhi mvutano na ukali wa Zaburi hii ya maombi ya hukumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kurudia “asiwepo” huhifadhi ulinganifu wa kishairi na hali ya ombi la Kiebrania.
