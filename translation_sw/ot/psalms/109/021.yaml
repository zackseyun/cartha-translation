  yaml_path: translation/ot/psalms/109/021.yaml
  text: But you[a], O Lord Yahweh, deal with me for your name’s sake; because your steadfast love is good[d][c][b], deliver me.
translation:
  language: sw
  text: Lakini wewe, Ee Yahweh, Bwana wangu[a], unitendee[b] kwa ajili ya jina lako; kwa kuwa fadhili zako ni njema[c], uniokoe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kina majina mawili kwa mfuatano: “Yahweh, Bwana wangu.” Baadhi ya tafsiri husema “Bwana MUNGU.”'
    reason: alternative_reading
  - marker: b
    text: 'Au: “tenda kwa niaba yangu”; kwa karibu zaidi, “tenda nami” au “unitendee.”'
    reason: lexical_alternative
  - marker: c
    text: “Fadhili” limetafsiri neno la Kiebrania חֶסֶד (hesed), linaloweza pia kumaanisha upendo thabiti, rehema, au uaminifu wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Lakini wewe
  rationale: Kiunganishi pamoja na kiwakilishi chenye mkazo kinaonyesha utofautishaji na maadui waliotajwa katika muktadha uliotangulia.
- source_word: יְהוָה אֲדֹנָי
  choice: Ee Yahweh, Bwana wangu
  rationale: Huhifadhi majina mawili tofauti ya Mungu kwa mpangilio wa Kiebrania na maana ya kibinafsi ya אֲדֹנָי katika mapokeo ya Kimasora.
- source_word: עֲשֵׂה אִתִּי
  choice: unitendee
  rationale: Kitenzi עשה pamoja na אִתִּי kina maana pana ya kutenda au kushughulika na mtu. “Unitendee” ni ombi la kawaida la Kiswahili na halibainishi kupita kiasi aina ya tendo linaloombwa.
- source_word: לְמַעַן שְׁמֶךָ
  choice: kwa ajili ya jina lako
  rationale: Huhifadhi usemi wa Kiebrania unaotegemeza ombi katika jina, sifa, na tabia ya Mungu.
- source_word: כִּי
  choice: kwa kuwa
  rationale: Huonyesha sababu inayotolewa kwa ombi la kuokolewa.
- source_word: טוֹב חַסְדְּךָ
  choice: fadhili zako ni njema
  rationale: “Fadhili” huwasilisha wema wa upendo na uaminifu unaodokezwa na חֶסֶד; umbo la wingi katika Kiswahili ni la kawaida ingawa neno la Kiebrania ni umoja.
- source_word: הַצִּילֵנִי
  choice: uniokoe
  rationale: Huwasilisha ombi la kuondolewa katika hatari bila kufafanua hatari hiyo zaidi ya maandishi.
theological_decisions:
- issue: Majina mawili ya Mungu יְהוָה אֲדֹנָי
  choice: Ee Yahweh, Bwana wangu
  alternative: Ee Bwana MUNGU
  rationale: Maandishi yana majina mawili kwa mfuatano; tafsiri inayahifadhi badala ya kuyaunganisha kuwa cheo kimoja.
- issue: Upana wa maana ya חֶסֶד
  choice: fadhili zako
  alternative: upendo wako thabiti; rehema zako; uaminifu wako wa agano
  rationale: “Fadhili” ni lugha ya asili ya Kiswahili inayoweza kujumuisha wema, rehema, na upendo wenye uaminifu bila kuifungia istilahi katika ufafanuzi mmoja wa kimadhehebu.
- issue: Mwelekeo wa עֲשֵׂה אִתִּי
  choice: unitendee
  alternative: tenda kwa niaba yangu
  rationale: Maana ya muktadha huenda ni kutenda kwa faida ya mwombaji, lakini Kiebrania chenyewe ni kipana zaidi; “unitendee” huhifadhi mvutano huo huku tanbihi ikitoa maana ya kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Ee” huhifadhi mwito wa moja kwa moja; “uniokoe” ni la kawaida na lenye uzito wa lugha ya Zaburi. Alama za tanbihi [a], [b], na [c] zote zimewekwa katika matini kuu.
