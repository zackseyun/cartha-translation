base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/016.yaml
  text: because he did not remember to show kindness[a], but pursued the poor and needy man, and the brokenhearted[b], to put them to death.
translation:
  language: sw
  text: kwa sababu hakukumbuka kutenda fadhili[a], bali alimwandama mtu maskini na mhitaji, na aliyevunjika moyo[b], ili kumwua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutenda rehema.” Neno la Kiebrania חָסֶד linaweza pia kumaanisha upendo mwaminifu au uaminifu wa agano; hapa linahusu fadhili za vitendo kwa walio dhaifu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mtu maskini na mhitaji, na aliyevunjika moyo.” Matumizi ya umoja huenda yanawakilisha aina ya watu aliowalenga.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: kwa sababu
  rationale: Kirai hiki kinaonyesha sababu ya hukumu inayotajwa katika muktadha; “kwa sababu” ni Kiswahili cha kawaida na huhifadhi uhusiano huo wa kisababu.
- source_word: לֹא זָכַר עֲשׂוֹת חָסֶד
  choice: hakukumbuka kutenda fadhili
  rationale: זָכַר pamoja na kitenzi-jina hapa humaanisha kutokuweka jambo akilini kiasi cha kulitekeleza. “Kutenda fadhili” huonyesha tendo halisi la חָסֶד bila kulazimisha maana yake ya uaminifu wa agano.
- source_word: וַיִּרְדֹּף
  choice: bali alimwandama
  rationale: “Alimwandama” huhifadhi picha ya kumfuatilia mtu kwa nia mbaya; “bali” huonyesha tofauti kati ya kutotenda fadhili na kuwashambulia walio dhaifu.
- source_word: אִישׁ עָנִי וְאֶבְיוֹן
  choice: mtu maskini na mhitaji
  rationale: Tafsiri hii huhifadhi umoja wa אִישׁ na jozi ya sifa zinazoonyesha umaskini na uhitaji.
- source_word: וְנִכְאֵה לֵבָב
  choice: na aliyevunjika moyo
  rationale: Kirai hiki kinaeleza mtu aliyepondwa au kujeruhiwa ndani; “aliyevunjika moyo” ni usemi wa asili na wenye kueleweka katika Kiswahili.
- source_word: לְמוֹתֵת
  choice: ili kumwua
  rationale: Kitenzi-jina kinaweza kuonyesha kusudi au matokeo ya kumwandama. Umoja wa “kumwua” unaendeleza umbo la umoja la mtu anayeelezwa katika mstari.
theological_decisions:
- issue: Maana ya חָסֶד katika wajibu kwa walio dhaifu
  choice: fadhili
  alternative: rehema; upendo mwaminifu
  rationale: Katika muktadha huu neno linahusu tendo halisi la wema kwa mtu dhaifu. “Fadhili” huhifadhi upana wa maana bila kulifanya neno liwe fundisho maalumu la agano pekee.
- issue: Umoja wa mtu anayelengwa
  choice: kuhifadhi umoja katika “mtu” na “kumwua”
  alternative: kutumia wingi wa kiwakilishi kwa kundi la watu dhaifu
  rationale: Maandishi ya Kiebrania yako katika umoja, ingawa huenda umoja huo unawakilisha aina nzima ya watu wanaolengwa. Tafsiri kuu huhifadhi umbo hilo huku tanbihi ikieleza uwezekano wa matumizi ya uwakilishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Alimwandama” hudumisha picha ya ufuatiliaji wenye uadui, na miundo ya umoja imehifadhiwa ili kufuata maandishi ya Kiebrania.
