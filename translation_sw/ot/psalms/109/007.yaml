lexical_decisions:
- source_word: בְּהִשָּׁפְטוֹ
  choice: Anapohukumiwa
  rationale: 'Muundo wa ב pamoja na kitenzi-jina cha Niphal na kiambishi cha nafsi ya tatu umoja wa kiume una maana ya wakati na hali ya kutendwa: ‘anapohukumiwa.’ Hii inadumisha muktadha wa mahakama.'
- source_word: יֵצֵא
  choice: na atoke
  rationale: Kitenzi יצא humaanisha ‘kutoka’; katika muktadha wa hukumu kinataja matokeo ya kesi. Muundo ‘na atoke’ unaonyesha ombi au tamko la kutakia, si utabiri wa kawaida.
- source_word: רָשָׁע
  choice: akiwa na hatia
  rationale: Ingawa רָשָׁע pia humaanisha ‘mwovu,’ katika muktadha wa mahakama inaweza kumaanisha mtu anayepatikana na hatia. Kiswahili ‘akiwa na hatia’ kinaeleza wazi matokeo ya hukumu.
- source_word: וּתְפִלָּתוֹ
  choice: na sala yake
  rationale: תְּפִלָּה ni ‘sala.’ Kiunganishi kinaendeleza ombi la laana lililo katika kishazi cha kwanza.
- source_word: תִּהְיֶה לַחֲטָאָה
  choice: iwe dhambi
  rationale: היה pamoja na ל inaweza kuonyesha kuwa au kuhesabiwa kuwa kitu. ‘Iwe dhambi’ ni ya moja kwa moja na inadumisha uwezekano wa maana ya sala yenyewe kuwa dhambi au kuhesabiwa kama dhambi.
theological_decisions:
- issue: Nguvu ya vitenzi katika muktadha wa sala ya laana
  choice: 'Kutafsiri kama ombi au tamko la kutakia: ‘na atoke ... na sala yake iwe ...’'
  alternative: 'Kutafsiri kama wakati ujao wa utabiri: ‘atatoka ... sala yake itakuwa ...’'
  rationale: Mfuatano wa Zaburi 109 unaonyesha maombi ya kutakia hukumu. Muundo wa Kiswahili wenye ‘na’ pamoja na hali ya kutakia unahifadhi nguvu hiyo bila kuufanya kuwa utabiri wa hakika.
- issue: Maana ya sala kuwa dhambi
  choice: ‘sala yake iwe dhambi’
  alternative: ‘sala yake ihesabiwe kuwa dhambi’
  rationale: Maandishi ya Kiebrania yana usemi mfupi wenye לַחֲטָאָה. Tafsiri kuu inadumisha ukali na utata huo; tanbihi inatoa uwezekano wa maana ya kuhesabiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Sala’ imetumiwa badala ya ‘maombi’ ili kuwakilisha nomino ya umoja תְּפִלָּה. Muundo wa mahakama umehifadhiwa.
