base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/028.yaml
  text: They may curse[a], but you will bless. They rise up and are put to shame[b], but your servant will rejoice.
translation:
  language: sw
  text: Wanaweza kulaani[a], lakini wewe utabariki. Wakiinuka, waaibike[b], lakini mtumishi wako atafurahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Walaani, lakini wewe ubariki.” Vitenzi vya Kiebrania vinaweza kueleweka kwa nguvu ya ruhusa au kauli ya kutaka.
    reason: alternative_reading
  - marker: b
    text: Kitenzi cha Kiebrania kina maana ya “kuinuka” au “kusimama.” Huenda kikadokeza tendo la uhasama katika muktadha, lakini andiko halisemi wazi kwamba walishambulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקַֽלְלוּ
  choice: na walaani
  rationale: 'Kauli ya kutaka au kuruhusu inaendana na muktadha wa ulinganifu wenye ukinzani: hata kama wapinzani wanaleta laana, baraka ya Mungu ndiyo inayotazamiwa. Tanbihi inahifadhi uwezekano wa kauli ya taarifa.'
- source_word: הֵמָּה
  choice: wao
  rationale: Kiwakilishi huru kinasisitiza tofauti kati yao na Mungu; ‘wao’ huiweka wazi kwa Kiswahili cha kawaida.
- source_word: וְ/אַתָּה
  choice: lakini wewe
  rationale: Ingawa וְ kimsingi ni ‘na,’ hapa uhusiano wa vifungu ni wa ukinzani, hivyo ‘lakini’ ni wa asili na sahihi.
- source_word: תְבָ֫רֵךְ
  choice: utabariki
  rationale: Wakati ujao unafaa mtiririko wa ombi na kudumisha ukinzani wa ‘kulaani/kubariki.’
- source_word: קָ֤מוּ
  choice: wameinuka
  rationale: Kitenzi קום kinamaanisha kuinuka au kusimama. Tafsiri haiongezi wazo la kushambulia ambalo halijasemwa wazi.
- source_word: וַ/יֵּבֹ֗שׁוּ
  choice: wameaibishwa
  rationale: בוש inaweza kueleza aibu au fedheha. ‘Wameaibishwa’ huonyesha hali ya kuaibika hadharani katika muktadha huu bila kuifanya kuwa hisia ya ndani tu.
- source_word: וְֽ/עַבְדְּ/ךָ֥
  choice: lakini mtumishi wako
  rationale: ‘Mtumishi wako’ ni namna ya kawaida ya mzungumzaji kujitaja kwa unyenyekevu mbele za Mungu; ‘lakini’ huonyesha tofauti na aibu ya wapinzani.
- source_word: יִשְׂמָֽח
  choice: atafurahi
  rationale: Kitenzi שמח humaanisha kufurahi; wakati ujao unaendana na matokeo yanayotazamiwa na unalingana na ‘utabariki.’
theological_decisions:
- issue: Anayerejelewa na ‘mtumishi wako’
  choice: Mzungumzaji anajitaja mwenyewe kwa unyenyekevu mbele za Mungu.
  alternative: Mtumishi mwadilifu kwa maana ya jumla.
  rationale: Katika muktadha wa zaburi, usemi huu ni jina la kujitaja katika sala. Tafsiri haiingizi utambulisho mwingine wa kiteolojia ambao mstari wenyewe haulazimishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa ukinzani na jozi ya kulaani/kubariki umehifadhiwa; alama zote za tanbihi zimo katika matini kuu.
