  text: 'Kwa mwongoza wa waimbaji. Ya Daudi.[a] Zaburi.


    Ee Mungu wa sifa yangu, usinyamaze.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Na Daudi,” “Kwa Daudi,” au “Kwa ajili ya Daudi”; kichwa cha Kiebrania kinaweza kueleweka kwa njia zaidi ya moja.
