lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza wa waimbaji
  rationale: Katika vichwa vya zaburi neno hili humrejelea kiongozi wa muziki; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Muundo huu unabaki wazi kuhusu iwapo zaburi ni ya utunzi wa Daudi, imewekwa wakfu kwake, au inahusishwa naye.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa aina hii ya wimbo wa ibada.
- source_word: אֱלֹהֵי תְהִלָּתִי
  choice: Ee Mungu ninayekusifu
  rationale: Hutoa kwa Kiswahili cha asili maana ya moja kwa moja ya maombi, bila kutumia muundo mgumu 'Mungu wa sifa yangu'; bado inadumisha kwamba Mungu ndiye anayesifiwa na mwombaji.
- source_word: אַל תֶּחֱרַשׁ
  choice: usinyamaze
  rationale: Ni ombi la haraka kwamba Mungu asibaki kimya au bila kuitikia.
theological_decisions:
- issue: Maana ya kichwa לְדָוִד
  choice: Ya Daudi
  alternative: Na Daudi; Kwa Daudi; Kwa ajili ya Daudi
  rationale: Kihusishi cha Kiebrania kinaweza kuonyesha utunzi, wakfu, au uhusiano. Tafsiri kuu haikulazimishi dai la utunzi kuliko chanzo kinavyoruhusu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Kichwa kimewekwa kwa vipashio vifupi kama kilivyo katika Kiebrania; mwito wa maombi umetafsiriwa kwa lugha ya asili ya Kiswahili.
