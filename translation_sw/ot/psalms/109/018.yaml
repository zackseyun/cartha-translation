    rationale: Although possible in isolation, this is semantically broad and can refer to an inner self rather than bodily inward parts. In the immediate Hebrew parallel with “his bones,” “sehemu zake za ndani” more faithfully retains the somatic imagery.
  - severity: medium
    issue: Footnote a reads “Alijivika kulaani kama joho lake.”
    rationale: “Kulaani” is an infinitive and is unnatural in this metaphorical construction. A noun-based alternative accurately reflects the Hebrew noun and reads naturally in Swahili.
