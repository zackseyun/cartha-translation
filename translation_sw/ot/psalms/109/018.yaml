  text: וַ/יִּלְבַּ֥שׁ קְלָלָ֗ה כְּ/מַ֫דּ֥/וֹ וַ/תָּבֹ֣א כַ/מַּ֣יִם בְּ/קִרְבּ֑/וֹ וְ֝/כַ/שֶּׁ֗מֶן בְּ/עַצְמוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/018.yaml
  text: He clothed himself with cursing as his garment[a]; it came into his inward parts like water[c][b], and like oil into his bones.
translation:
  language: sw
  text: Alijivika laana kama vazi lake[a]; nayo ikaingia katika sehemu zake za ndani kama maji[b], na mifupani mwake kama mafuta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Alivaa laana kama joho lake.”
    reason: lexical_alternative
  - marker: b
    text: “Sehemu zake za ndani” pia inaweza kutafsiriwa “ndani yake” au “katika utu wake wa ndani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְבַּשׁ
  choice: Alijivika
  rationale: Kitenzi hiki huhifadhi maana ya kujivika au kuvaa, pamoja na picha ya mtu kuifanya laana kuwa kama vazi lake.
- source_word: קְלָלָה
  choice: laana
  rationale: Nomino hii inaweza kumaanisha laana au tendo la kulaani. Katika Kiswahili, “laana” ni ya asili zaidi katika sitiari ya kitu kinachovaliwa na pia hudumisha uwezekano wa kuelewa matokeo ya kulaani.
- source_word: כְּמַדּוֹ
  choice: kama vazi lake
  rationale: מַד ni vazi au joho. “Vazi lake” ni fasaha, lenye hadhi, na halibainishi aina ya vazi kuliko chanzo.
- source_word: וַתָּבֹא
  choice: nayo ikaingia
  rationale: Kiambishi “-yo” kinarejelea laana, na “ikaingia” huonyesha mwendo wa kupenya unaoendelezwa na mifano ya maji na mafuta.
- source_word: כַמַּיִם
  choice: kama maji
  rationale: Tafsiri ya moja kwa moja inadumisha tashbihi ya kitu kinachopenya kabisa.
- source_word: בְּקִרְבּוֹ
  choice: ndani yake
  rationale: קֶרֶב inaweza kuwa sehemu za ndani au utu wa ndani. “Ndani yake” ni Kiswahili cha kawaida kinachohifadhi upana huo bila kuondoa picha ya mwili.
- source_word: וְכַשֶּׁמֶן
  choice: na kama mafuta
  rationale: Muundo wa tashbihi umehifadhiwa; katika muktadha huu mafuta yanaonyesha kupenya kwa kina.
- source_word: בְּעַצְמוֹתָיו
  choice: mifupani mwake
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kusema kitu kimeingia ndani ya mifupa, huku ikidumisha ulinganifu na kuingia ndani yake.
theological_decisions:
- issue: Taswira ya laana na mhusika anayeisababisha
  choice: Mstari unasema mtu huyo alijivika laana, nayo ikamwingia, bila kuongeza kwamba Mungu ndiye aliyeiingiza moja kwa moja.
  alternative: Kutaja wazi kwamba Mungu alimtwika au alimwingiza laana.
  rationale: Kiebrania kinaeleza uhusiano wa mtu huyo na laana na matokeo yake, lakini katika mstari huu hakielezi wazi njia au mhusika aliyesababisha laana imwingie. Tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishairi na tashbihi za vazi, maji, mafuta, na mifupa zimehifadhiwa kwa lugha inayoeleweka kwa urahisi.
