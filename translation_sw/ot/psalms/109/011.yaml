base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/011.yaml
  text: May a creditor seize all that belongs to him[a], and may strangers plunder the fruit of his labor.
translation:
  language: sw
  text: Mkopeshaji na akamate mali yake yote[a], na wageni wapore matunda ya kazi yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anase”; kitenzi cha Kiebrania kinaweza kumaanisha kutega mtego au kunasa, lakini hapa huenda kinamaanisha mkopeshaji kudai na kukamata mali yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְנַקֵּשׁ
  choice: akamate
  rationale: Katika pieli, kitenzi kinaweza kumaanisha kunasa au kukamata. Pamoja na נוֹשֶׁה na mali kuwa kitu kinacholengwa, “akamate” huwasilisha kwa kawaida hatua ya mkopeshaji kudai na kutwaa mali.
- source_word: נ֭וֹשֶׁה
  choice: mkopeshaji
  rationale: Neno humaanisha mtu aliyekopesha na anayedai malipo; “mkopeshaji” ni neno la kawaida la Kiswahili bila kuifanya maana kuwa mkopeshaji wa fedha pekee.
- source_word: לְכָל אֲשֶׁר לוֹ
  choice: mali yake yote
  rationale: Kirai kinahusu kwa ujumla kila kitu alicho nacho; “mali yake yote” ni cha asili na kifupi katika muktadha wa kunyang’anywa mali.
- source_word: וְיָבֹזּוּ
  choice: wapora
  rationale: בזז hudokeza kutwaa nyara kwa nguvu; “wapora” huhifadhi uzito huo wa uporaji.
- source_word: זָרִים
  choice: wageni
  rationale: Neno linataja watu wasio wa jamaa au jumuiya yake. “Wageni” huhifadhi upana wake bila kulazimisha maana ya utaifa.
- source_word: יְגִיעוֹ
  choice: matunda ya kazi yake
  rationale: Neno linaweza kutaja kile kilichopatikana kwa taabu, si tendo la kufanya kazi tu; kirai hiki kinaonyesha mazao au mapato ya jitihada zake.
theological_decisions:
- issue: Nguvu ya maombi ya laana katika vitenzi vya yiqtol
  choice: Kutumia “na akamate ... na wapora ...” kama matakwa au maombi
  alternative: 'Kutumia wakati ujao wa taarifa: “atakamatwa ... watapora ...”'
  rationale: Katika mfululizo wa laana za Zaburi 109, maumbo haya yanaeleweka vizuri kama matakwa, si utabiri wa kawaida. Muundo wa “na ...” huhifadhi nguvu ya ombi hilo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Muundo wa kutakia “na ...” umetumiwa kuhifadhi sauti ya laana/ombi, huku “mali yake yote” na “matunda ya kazi yake” vikitoa maana kwa lugha ya kawaida na yenye heshima.
