  yaml_path: translation/ot/psalms/109/006.yaml
  text: Appoint a wicked man over him[a], and let an accuser stand at his right hand.
translation:
  language: sw
  text: Mteue mtu mwovu juu yake, na mshtaki asimame upande wake wa kulia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Shetani asimame upande wake wa kulia.” Neno la Kiebrania linaweza kumaanisha “mshtaki,” “mpinzani,” au, katika baadhi ya miktadha, jina maalumu Shetani.
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְקֵד
  choice: Mweke
  rationale: Kauli ya kuamuru katika Hifili ya פקד hapa inataka mtu awekwa au ateuliwe juu ya mwingine. “Mweke” ni ya asili katika Kiswahili na inadumisha nguvu ya amri bila kubainisha cheo kisichotajwa.
- source_word: עָלָיו
  choice: juu yake
  rationale: Pamoja na פקד, kihusishi על kinaonyesha mtu ambaye mwingine anawekwa juu yake. “Juu yake” kinadumisha maana ya mamlaka au usimamizi, ingawa muktadha unaweza kuifanya hatua hiyo iwe dhidi yake.
- source_word: רָשָׁע
  choice: mtu mwovu
  rationale: Neno hili humaanisha mtu mwenye uovu au aliye na hatia. “Mtu mwovu” ni wazi, la kawaida, na linadumisha rejeleo la mtu.
- source_word: שָׂטָן
  choice: mshtaki
  rationale: Katika muktadha huu wa kimahakama, שָׂטָן linaeleweka vizuri kama nomino ya kawaida inayomaanisha mshtaki au mpinzani. “Mshtaki” linaendana na taswira ya kusimama upande wa kulia ili kutoa mashtaka, bila kulazimisha jina maalumu Shetani.
- source_word: יַעֲמֹד
  choice: asimame
  rationale: Kauli isiyotimilika inayofuata amri ina nguvu ya kutakia au kuamuru. “Asimame” huiwasilisha kwa kawaida katika Kiswahili.
- source_word: עַל יְמִינוֹ
  choice: upande wake wa kulia
  rationale: Hii inadumisha nafasi halisi ya kusimama kulia kwa mtu katika mazingira ya kimahakama. Kiswahili “upande wake wa kulia” ni cha kawaida na wazi.
theological_decisions:
- issue: Iwapo שָׂטָן litafsiriwe kama jina maalumu “Shetani” au nomino ya kawaida
  choice: 'nomino ya kawaida: “mshtaki”'
  alternative: “Shetani” au “mpinzani”
  rationale: 'Kiebrania hakilazimishi jina maalumu, na muktadha wa karibu ni wa kimahakama na wa laana: mtu mwovu anawekwa juu yake, kisha mshtaki anasimama upande wake wa kulia. “Mshtaki” kinadumisha maana ya moja kwa moja bila kuingiza kwa lazima ufafanuzi wa kishetani; uwezekano wa “Shetani” umehifadhiwa katika tanbihi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka. Muundo wa kishairi na taswira ya kimahakama vimedumishwa bila kuongeza ufafanuzi wa kimadhehebu.
