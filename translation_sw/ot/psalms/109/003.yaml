lexical_decisions:
- source_word: דִבְרֵי
  choice: Maneno ya
  rationale: Nomino hii katika muundo wa kutegemeana inaonyesha maneno au matamshi; “maneno ya” huhifadhi uhusiano wake na nomino inayofuata kwa Kiswahili cha kawaida.
- source_word: שִׂנְאָה
  choice: chuki
  rationale: “Chuki” ni neno la moja kwa moja na la kawaida kwa hisia au uhasama unaoelezwa hapa.
- source_word: סְבָבוּנִי
  choice: yamenizunguka
  rationale: Kitenzi kinamaanisha kuzunguka au kuzingira. Kauli timilifu ya Kiswahili inaonyesha kuwa maneno hayo yamemzingira msemaji na hali hiyo inaendelea.
- source_word: וַיִּלָּחֲמוּנִי
  choice: nao wanapigana nami
  rationale: Mzizi huu katika Nifali una maana ya kupigana au kufanya vita dhidi ya mtu. “Wanapigana nami” ni ya asili na huhifadhi taswira ya mapambano bila kulazimisha maana ya vita kamili.
- source_word: חִנָּם
  choice: bila sababu
  rationale: Kirai hiki huonyesha kuwa uhasama huo hauna msingi au sababu halali; “bila sababu” ni wazi na cha kawaida katika Kiswahili.
