translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Viunganishi “nayo” vinarejelea “laana” na “baraka” kwa uwazi, na sentensi inahifadhi ulinganifu wa kinyume wa mstari wa Kiebrania.
