  yaml_path: translation/ot/psalms/109/017.yaml
  text: He loved cursing[a], and it came upon him; he did not delight in blessing[b], and it was far from him.
translation:
  language: sw
  text: Alipenda laana[a], nayo ikamjia; hakufurahia baraka[b], nayo ikawa mbali naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Alipenda laana fulani, nayo ikamjia.” Nomino ya Kiebrania inaweza kumaanisha kulaani kwa jumla au laana fulani.
    reason: lexical_alternative
  - marker: b
    text: Au, “hakupendezwa na baraka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: Alipenda
  rationale: Kitenzi אהב kinaonyesha kupenda au kutamani; “alipenda” ni tafsiri ya moja kwa moja na ya kawaida inayohifadhi wazo la hiari yake.
- source_word: קְלָלָה
  choice: laana
  rationale: Nomino hii inaweza kumaanisha kitendo cha kulaani au laana iliyotamkwa. “Laana” inadumisha umbo la nomino na ulinganifu wake wa kinyume na “baraka,” huku tanbihi ikihifadhi maana nyingine.
- source_word: וַתְּבוֹאֵהוּ
  choice: nayo ikamjia
  rationale: Kitenzi בוא pamoja na kiambishi cha yambwa kinamaanisha kwamba laana ilimjia. “Ikamjia” ni ya asili katika Kiswahili na haisisitizi zaidi ya maandishi ya Kiebrania.
- source_word: וְלֹא חָפֵץ
  choice: hakupendezwa na
  rationale: חפץ huonyesha kutamani, kufurahia, au kupendezwa na jambo. “Hakupendezwa na” inahifadhi tofauti ya kihisia dhidi ya “alipenda.”
- source_word: בִּבְרָכָה
  choice: baraka
  rationale: “Baraka” inawakilisha nomino ya Kiebrania katika maana ya jumla na kusimama kinyume na “laana.”
- source_word: וַתִּרְחַק מִמֶּנּוּ
  choice: nayo ikawa mbali naye
  rationale: רחק humaanisha kuwa au kuwa mbali. Tafsiri hii inafuata kwa karibu hali ya kutengwa bila kuongeza wazo lisilo wazi la kuendelea au kuondoka.
