  text: Kama kivuli kinaporefuka[a], nimeondoka[b]; nimekung’utwa kama nzige[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kinapoinama” au “kinaponyooshwa”; kitenzi cha Kiebrania kinaweza kuonyesha kivuli kinachorefuka, kinachoinama, au kinachoelekea upande wa jioni.
    reason: lexical_alternative
  - marker: b
    text: Au, “nimepita” au “nimekwenda”; kwa Kiebrania limetumiwa neno “kwenda,” ambalo hapa linaweza kueleza kuondoka au kutoweka.
    reason: lexical_alternative
  - marker: c
    text: “Nzige” ndiyo maana ya kawaida ya neno la Kiebrania; wengine hutafsiri “panzi.”
