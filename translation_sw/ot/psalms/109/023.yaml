lexical_decisions:
- source_word: כְּצֵל
  choice: Kama kivuli
  rationale: Kiambishi כְּ kinaonyesha ulinganisho, na צֵל ni ‘kivuli’; tafsiri hii ni ya kawaida na inahifadhi tashbihi.
- source_word: כִּנְטוֹתוֹ
  choice: kinaporefuka
  rationale: Kitenzi נטה kinaweza kumaanisha kunyooshwa, kuelekezwa, au kuinama. Katika picha ya kivuli, ‘kinaporefuka’ kinaeleza kivuli cha jioni bila kufuta uwezekano wa maana ya kuelekea kutoweka.
- source_word: נֶהֱלָכְתִּי
  choice: mimi natoweka
  rationale: Nifali ya הלך hapa inaonyesha kwenda au kupita mpaka kutokuwapo. ‘Natoweka’ ni Kiswahili cha asili kinachobeba picha ya kupotea kama kivuli, ingawa kihalisi kitenzi ni ‘kwenda.’
- source_word: נִנְעַרְתִּי
  choice: ninakung’utwa
  rationale: Nifali ya נער humaanisha kutikiswa au kukung’utwa ili kitu kiondolewe. ‘Ninakung’utwa’ inahifadhi hali ya kutendwa na picha ya kuondolewa kwa nguvu.
- source_word: כָּאַרְבֶּה
  choice: kama nzige
  rationale: אַרְבֶּה kwa kawaida ni ‘nzige’; hili ndilo neno sanifu la Kiswahili na linahifadhi taswira ya Kiebrania.
