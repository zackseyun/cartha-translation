translation:
  language: sw
  text: Wakanilipa mabaya kwa mema[a], na chuki kwa upendo wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wakaweka mabaya dhidi yangu badala ya mema.” Kitenzi cha Kiebrania kwa msingi humaanisha “kuweka,” lakini hapa huenda kina maana ya kulipa au kutenda jambo fulani kwa malipo ya jingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: Wakanilipa
  rationale: Kitenzi שׂוּם kwa msingi humaanisha ‘kuweka,’ lakini hapa muundo wa עָלַי pamoja na vifungu viwili vya תַּחַת unaonyesha kubadilishana au kulipa kwa kutenda jambo fulani badala ya jingine. ‘Wakanilipa’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: עָלַי
  choice: -ni- katika ‘wakanilipa’
  rationale: עַל yenye kiambishi cha nafsi ya kwanza ni kihalisi ‘juu yangu/dhidi yangu,’ lakini katika Kiswahili yule anayetendewa huonyeshwa kwa kiambishi cha yambwa katika kitenzi ‘kunilipa.’
- source_word: רָעָה
  choice: mabaya
  rationale: ‘Mabaya’ huhifadhi upana na uzito wa kimaadili wa רָעָה; ‘madhara’ ingeifanya maana kuwa finyu zaidi, yaani kuumiza tu.
- source_word: תַּחַת
  choice: kwa
  rationale: Katika mistari hii תַּחַת huonyesha ubadilishaji au malipo. ‘Kwa’ ni fupi na ya asili katika ulinganifu ‘mabaya kwa mema’ na ‘chuki kwa upendo.’
- source_word: טוֹבָה
  choice: mema
  rationale: ‘Mema’ huhifadhi maana pana ya טוֹבָה na kuleta ukinzani wa moja kwa moja na ‘mabaya,’ bila kuibana kuwa ‘fadhili’ pekee.
- source_word: וְשִׂנְאָה
  choice: na chuki
  rationale: Nomino ‘chuki’ inalingana na שִׂנְאָה na kudumisha ulinganifu wa kishairi na nomino ‘upendo.’
- source_word: אַהֲבָתִי
  choice: upendo wangu
  rationale: Hii ni tafsiri ya moja kwa moja ya nomino אַהֲבָה yenye kiambishi cha nafsi ya kwanza, na haiongezi maelezo yasiyosemwa wazi kama ‘upendo niliowaonyesha.’
