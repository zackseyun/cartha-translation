base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/010.yaml
  text: But you have exalted my horn like that of a wild ox[b][a]; I have been anointed with fresh oil.
translation:
  language: sw
  text: Lakini umeiinua pembe yangu kama ile ya ng’ombe wa mwitu[a]; nimepakwa mafuta mapya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania re’em humaanisha mnyama mwenye nguvu wa jamii ya ng’ombe wa porini, ambaye kwa kawaida hutafsiriwa ‘ng’ombe wa mwitu.’ Tafsiri za zamani wakati mwingine zilitumia ‘farasi mwenye pembe moja.’
    reason: cultural_note
  - marker: b
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, ‘nimeloweshwa kwa mafuta mapya’ au ‘nimechanganywa na mafuta mapya.’ Kitenzi cha Kiebrania hapa si cha kawaida, na maana yake kamili inajadiliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרֶם
  choice: umeiinua
  rationale: Kitenzi רום kina maana ya kuinua au kuweka juu. Muktadha unaonyesha kuwa mtunga zaburi anamwelekea Mungu moja kwa moja; ‘umeiinua’ ni ya kawaida na inadumisha picha ya pembe iliyoinuliwa.
- source_word: כִּרְאֵים
  choice: kama ile ya ng’ombe-mwitu
  rationale: רְאֵם humaanisha mnyama mwenye nguvu wa jamii ya ng’ombe wa porini. ‘Kama ile ya’ inaonyesha wazi kwamba kinacholinganishwa ni pembe, wala si msemaji mwenyewe.
- source_word: קַרְנִי
  choice: pembe yangu
  rationale: קֶרֶן ni ‘pembe’ kihalisi na katika ushairi huwakilisha nguvu, heshima, au mamlaka. Picha ya asili imehifadhiwa badala ya kufasiriwa moja kwa moja kuwa ‘nguvu yangu.’
- source_word: בַּלֹּתִי
  choice: nimetiwa mafuta
  rationale: Kitenzi בלל hapa si cha kawaida na maana yake kamili inajadiliwa. Katika muungano wake na ‘mafuta,’ ‘nimetiwa mafuta’ huwasilisha kwa Kiswahili maana inayowezekana ya kupakwa au kuloweshwa mafuta, huku tanbihi ikihifadhi tafsiri za karibu zaidi na umbo la Kiebrania.
- source_word: בְּשֶׁמֶן
  choice: mafuta
  rationale: שֶׁמֶן humaanisha mafuta; katika Kiswahili, muundo ‘nimetiwa mafuta’ tayari unaonyesha kitu kilichotumiwa, hivyo si lazima kuongeza kihusishi.
- source_word: רַעֲנָן
  choice: mapya
  rationale: רַעֲנָן hudokeza upya, ubichi, uhai, au wingi. Kuhusu mafuta, ‘mapya’ ni usemi wa kawaida unaobeba wazo la mafuta yasiyochakaa na yenye ubora.
theological_decisions:
- issue: Picha ya ‘pembe’
  choice: Kudumisha ‘pembe’ kama picha ya nguvu na heshima iliyoinuliwa
  alternative: nguvu yangu; mamlaka yangu
  rationale: Tafsiri ya moja kwa moja ya picha hii inadumisha ushairi na kina cha kitheolojia cha Kiebrania bila kuifungia katika maana moja tu.
- issue: Maana ya בַּלֹּתִי pamoja na mafuta
  choice: nimetiwa mafuta
  alternative: nimelowana kwa mafuta; nimechanganywa na mafuta
  rationale: ‘Nimetiwa mafuta’ ni ya asili katika Kiswahili na inafaa muktadha wa heshima na uhai. Hata hivyo, kwa kuwa kitenzi cha Kiebrania ni nadra na chenye utata, uwezekano wa maana ya kuloweshwa au kuchanganywa umewekwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi ya kishairi. Muundo ‘umeiinua pembe yangu’ unahifadhi sitiari ya Kiebrania; ‘kama ile ya’ huzuia utata usio wa lazima kuhusu kitu kinacholinganishwa. Alama zote za tanbihi zimewekwa katika matini kuu kwa mpangilio wa kuonekana.
