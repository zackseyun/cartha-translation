  text: מַה גָּדְל֣וּ מַעֲשֶׂ֣י/ךָ יְהוָ֑ה מְ֝אֹ֗ד עָמְק֥וּ מַחְשְׁבֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/005.yaml
  text: How great are your works[a], O Yahweh; your thoughts are very deep.
translation:
  language: sw
  text: Matendo yako ni makuu jinsi gani, ee Yahwe! Mawazo yako ni ya kina sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mipango yako” au “makusudi yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה גָּדְלוּ
  choice: ni makuu jinsi gani
  rationale: מַה ni ya mshangao hapa, si swali; muundo huu wa Kiswahili unaonyesha kuvutiwa na ukuu wa matendo ya Mungu.
- source_word: מַעֲשֶׂיךָ
  choice: matendo yako
  rationale: Neno hili linaweza kumaanisha kazi au matendo; “matendo” ni la kawaida na lina upana unaofaa katika muktadha wa sifa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: מְאֹד עָמְקוּ
  choice: ni ya kina sana
  rationale: Kitenzi kina maana ya hali ya kuwa na kina, na מְאֹד hukazia kiwango chake; usemi huu ni wa asili katika Kiswahili cha sasa.
- source_word: מַחְשְׁבֹתֶיךָ
  choice: mawazo yako
  rationale: “Mawazo” ndiyo maana ya moja kwa moja na pana zaidi, huku “mipango” na “makusudi” yakiendelea kuwa uwezekano halisi wa kileksika.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Upana wa maana ya מַחְשְׁבֹתֶיךָ
  choice: mawazo yako
  alternative: mipango yako au makusudi yako
  rationale: Chaguo kuu linaacha wazi hekima na nia ya Mungu bila kuifanya aya izungumzie mipango pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Kihisishi “ee” kinaendeleza mwito wa moja kwa moja, na mshangao umewekwa wazi bila kugeuza sentensi kuwa swali.
