base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/009.yaml
  text: For behold[a], your enemies, O Yahweh— for behold, your enemies will perish; all workers of wickedness will be scattered.
translation:
  language: sw
  text: Kwa maana, tazama, adui zako, ee Yahwe—kwa maana, tazama, adui zako wataangamia; wote watendao uovu[a] watatawanyika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “watenda maovu”; kwa maneno halisi, Kiebrania: “wafanyao uovu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza uhusiano wa maelezo na mstari uliotangulia huku ikidumisha msisitizo wa kishairi.
- source_word: הִנֵּה
  choice: tazama
  rationale: Inahifadhi wito wa kuelekeza fikira na msisitizo wa Kiebrania kwa lugha ya heshima inayoeleweka.
- source_word: אֹיְבֶיךָ
  choice: adui zako
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya wingi yenye kiambishi cha nafsi ya pili umoja, ikimrejelea Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Inawakilisha jina binafsi la Mungu katika umbo lililozoeleka katika Kiswahili cha Afrika Mashariki.
- source_word: כִּי הִנֵּה ... כִּי הִנֵּה
  choice: Kwa maana tazama ... kwa maana tazama
  rationale: Marudio yamehifadhiwa kwa kuwa ni sifa ya makusudi ya ushairi inayoongeza msisitizo na uhakika.
- source_word: יֹאבֵדוּ
  choice: wataangamia
  rationale: Kitenzi hiki huonyesha kuangamia au kupotea; ‘wataangamia’ ni cha asili na hakibainishi isivyofaa namna hukumu itakavyotekelezwa.
- source_word: יִתְפָּרְדוּ
  choice: watatawanyika
  rationale: Umbo la Kiebrania lina wazo la kutengana au kutawanywa; ‘watatawanyika’ linadumisha maana hiyo na usambamba wa kishairi.
- source_word: כָּל
  choice: wote
  rationale: Inahifadhi upeo unaojumuisha kila mmoja katika kundi linalotajwa.
- source_word: פֹּעֲלֵי אָוֶן
  choice: watendao uovu
  rationale: Inawakilisha kwa uwazi watu wanaotenda uovu, huku ikibaki ya kawaida na yenye uzito wa kimaadili katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja; ‘Yahwe’ huhifadhi rejeo la jina binafsi la agano bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya Kiebrania na mkato wa kishairi yamehifadhiwa; alama ya tanbihi imewekwa baada ya kirai inachokifafanua.
