lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya sifa katika muktadha na kudumisha uhusiano wa kisababishi kwa Kiswahili cha kawaida.
- source_word: שִׂמַּחְתַּנִי
  choice: umenifurahisha
  rationale: Muundo wa Piel wenye kiambishi cha nafsi ya kwanza una maana ya kusababisha furaha; tafsiri hii ni ya moja kwa moja na ya asili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: בְּפָעֳלֶךָ
  choice: kwa kazi yako
  rationale: פֹּעַל ni kazi au tendo; kihusishi ב hapa kinaonyesha sababu au njia ambayo kwayo mtunga zaburi amefurahishwa. Umoja wa nomino umehifadhiwa.
- source_word: בְּמַעֲשֵׂי יָדֶיךָ
  choice: kwa sababu ya matendo ya mikono yako
  rationale: Inahifadhi wingi na taswira halisi ya Kiebrania ya ‘matendo ya mikono,’ huku ikieleza kwa kawaida kuwa matendo hayo ndiyo kichocheo cha shangwe.
- source_word: אֲרַנֵּן
  choice: ninaimba kwa shangwe
  rationale: Kitenzi רנן kinaweza kumaanisha kuimba kwa shangwe au kutoa kilio kikubwa cha furaha. Muktadha wa sifa unaunga mkono ‘ninaimba kwa shangwe,’ lakini uwezekano mwingine umewekwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Ee Yahwe
  alternative: Ee BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu, si cheo. ‘Yahwe’ hulihifadhi jina hilo bila kulibadilisha kuwa ‘BWANA.’
- issue: Thamani ya wakati wa אֲרַנֵּן
  choice: ninaimba kwa shangwe
  alternative: nitaimba kwa shangwe
  rationale: Ingawa imperfecti ya Kiebrania inaweza kuelekeza wakati ujao, hapa inaweza kueleza itikio la sasa au linaloendelea kutokana na kufurahishwa. Tafsiri haifanyi ahadi ya wakati ujao kuwa lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Taswira ya ‘matendo ya mikono yako’ imehifadhiwa, na sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili.
