  text: Kwa maana, Ee Yahweh[a], umenifurahisha kwa kazi yako; ninaimba kwa shangwe[b] kwa ajili ya matendo ya mikono yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH, jina binafsi la Mungu; limetoholewa hapa kama “Yahweh.”'
