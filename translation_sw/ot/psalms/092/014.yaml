base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/014.yaml
  text: They still bear fruit in old age[c][b][a]; they are full of sap and green.
translation:
  language: sw
  text: Wakiwa wazee bado huzaa matunda; huwa na utomvu mwingi[b] na hubaki wabichi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wakiwa wazee bado watazaa matunda; watakuwa wenye utomvu mwingi na wabichi.” Vitenzi vya Kiebrania vinaweza pia kutafsiriwa kwa wakati ujao.
    reason: alternative_reading
  - marker: b
    text: Kihalisi, “wanene”; katika taswira hii ya miti, maana yake ni iliyonawiri na yenye uhai mwingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹד
  choice: bado
  rationale: 'Huonyesha mwendelezo wa hali iliyotangulia: hata katika uzee uzima na kuzaa matunda vinaendelea.'
- source_word: יְנוּבוּן
  choice: huzaa matunda
  rationale: Kitenzi נוב kinamaanisha kutoa au kuzaa, hasa katika taswira ya mimea; hapa kinaendeleza mfano wa miti katika muktadha.
- source_word: בְּשֵׂיבָה
  choice: wakiwa wazee
  rationale: Ingawa nomino hiyo inahusiana moja kwa moja na mvi, kimuktadha ni nahau ya uzee; tafsiri hii ni ya kawaida na wazi kwa Kiswahili.
- source_word: דְּשֵׁנִים
  choice: huwa na utomvu mwingi
  rationale: Neno hilo kihalisi linaweza kumaanisha ‘wanene’ au ‘walionawiri’; katika taswira ya miti linaonyesha uhai na lishe tele, jambo linaloelezwa kwa Kiswahili cha kawaida kwa ‘utomvu mwingi’.
- source_word: רַעֲנַנִּים
  choice: hubaki kijani kibichi
  rationale: Hueleza ubichi na ustawi wa mimea; ‘kijani kibichi’ inadumisha taswira ya mti wenye uhai.
- source_word: יִהְיוּ
  choice: huwa … hubaki
  rationale: Kauli ya kutokamilika imetafsiriwa kama hali ya kawaida inayoendelea, kulingana na tabia ya kimethali ya mstari huu.
theological_decisions:
- issue: Wakati na hali ya vitenzi vya Kiebrania katika ushairi
  choice: 'Kauli ya kawaida na endelevu: ‘huzaa … huwa … hubaki’'
  alternative: 'Kauli ya wakati ujao: ‘wataendelea kuzaa … watakuwa’'
  rationale: Vitenzi vya kutokamilika vinaweza kueleza hali ya kawaida au wakati ujao. Muktadha unaeleza kwa ujumla hali ya wenye haki kwa mfano wa miti, lakini uwezekano wa wakati ujao umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘hu-’ unaonyesha ukweli wa kawaida unaoendelea. Taswira ya mti imehifadhiwa kwa ‘kuzaa matunda,’ ‘utomvu mwingi,’ na ‘kijani kibichi.’
