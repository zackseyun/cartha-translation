  text: לְ֭/הַגִּיד כִּֽי יָשָׁ֣ר יְהוָ֑ה צ֝וּרִ֗/י וְֽ/לֹא עלת/ה בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/015.yaml
  text: to declare that Yahweh is upright; he is my rock[a], and there is no unrighteousness in him.
translation:
  language: sw
  text: 'kutangaza kwamba Yahwe ni mnyofu;

    yeye ni mwamba wangu, wala hamna udhalimu ndani yake.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַגִּיד
  choice: kutangaza
  rationale: Kitenzi-jina hiki kinaonyesha kusudi au matokeo yanayotokana na muktadha uliotangulia; ‘kutangaza’ kinadumisha wazo la kutoa ushuhuda waziwazi.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa neno hili linaanzisha maudhui ya kile kinachotangazwa, si sababu.
- source_word: יָשָׁר
  choice: mnyofu
  rationale: Katika kumwelezea Mungu, ‘mnyofu’ linaonyesha uadilifu mpana wa tabia huku likidumisha picha ya msingi ya unyofu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa umbo la Kiswahili linalotumiwa kwa kawaida kwa jina la Kiebrania YHWH, badala ya kulibadili kuwa cheo.
- source_word: צוּרִי
  choice: mwamba wangu
  rationale: Tafsiri hii inadumisha sitiari halisi na iliyoenea katika Zaburi ya Mungu kuwa mwamba, badala ya kuifafanua kuwa ‘kimbilio langu.’
- source_word: וְלֹא
  choice: wala hamna
  rationale: Muundo huu wa Kiswahili unawasilisha kwa kawaida kishazi cha Kiebrania kisicho na kitenzi na chenye ukanushi.
- source_word: עַוְלָתָה
  choice: udhalimu
  rationale: Neno hili linaweza kumaanisha ukosefu wa haki, uovu, au tendo lisilo la haki; ‘udhalimu’ linaeleweka kiasili na linaweka wazi kinyume cha unyofu wa Yahwe bila kulibana kwenye mahakama pekee.
- source_word: בּוֹ
  choice: ndani yake
  rationale: Huu ni usemi wa kawaida unaoonyesha kwamba hakuna upotovu wowote unaopatikana katika Mungu.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano YHWH. ‘Yahwe’ linadumisha jina hilo binafsi badala ya kulibadili kuwa cheo.
- issue: Uhusiano kati ya יָשָׁר na עַוְלָתָה
  choice: mnyofu … hamna udhalimu ndani yake
  alternative: mwenye haki … hamna ukosefu wa haki ndani yake
  rationale: Chaguo hili linahifadhi upana wa maadili na mvutano wa kishairi kati ya unyofu wa Yahwe na kutokuwapo kwa upotovu ndani yake, bila kuufanya mstari kuwa kauli ya kimahakama tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa mistari unadumisha vipashio viwili vya kauli ya Kiebrania. Hakuna tanbihi iliyoongezwa, kwa kuwa ‘udhalimu’ linabeba kwa kutosha maana ya ukosefu wa haki au uovu katika muktadha huu.
