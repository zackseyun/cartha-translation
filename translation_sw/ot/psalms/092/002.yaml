  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַגִּיד
  choice: kutangaza
  rationale: Kitenzi-jina chenye ל kinaendeleza wazo la kusudi kutoka mstari uliotangulia. “Kutangaza” hudumisha maana ya kueleza wazi au hadharani kuliko “kusema” tu.
- source_word: בַּבֹּקֶר
  choice: asubuhi
  rationale: ב pamoja na nomino yenye kibainishi inaonyesha wakati. “Asubuhi” ni Kiswahili cha kawaida na huunda ulinganifu wa kishairi na sifa inayotolewa nyakati za usiku.
- source_word: חַסְדֶּךָ
  choice: upendo wako thabiti
  rationale: חֶסֶד huunganisha wema wa upendo na ushikamanifu unaodumu. “Upendo thabiti” hubeba vipengele hivyo bila kuifungia maana katika istilahi ya kimadhehebu.
- source_word: וֶאֱמוּנָתְךָ
  choice: na uaminifu wako
  rationale: אֱמוּנָה hapa ni kutegemeka na kudumu kwa Mungu. “Uaminifu” ni neno la kawaida, lenye heshima, na linafaa katika usambamba na upendo thabiti.
- source_word: בַּלֵּילוֹת
  choice: usiku baada ya usiku
  rationale: Nomino ya Kiebrania ni wingi, “nyakati za usiku.” Kiswahili kwa kawaida hakitumii wingi “usiku mbalimbali” katika sentensi hii; “usiku baada ya usiku” huwasilisha kwa ufasaha maana ya kurudiwa inayowezekana katika wingi huo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Muundo unadumisha usambamba kati ya asubuhi na nyakati za usiku. Wingi wa בַּלֵּילוֹת umeonyeshwa ndani ya maandishi kwa “usiku baada ya usiku,” hivyo tanbihi si ya lazima.
