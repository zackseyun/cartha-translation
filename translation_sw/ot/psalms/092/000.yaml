lexical_decisions:
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Neno la kawaida la Kiswahili kwa utungo wa aina hii katika vichwa vya Zaburi; linadumisha pia uhusiano wake wa kimuziki.
- source_word: שִׁיר
  choice: wimbo
  rationale: Tafsiri ya kawaida na ya asili ya neno la Kiebrania la wimbo; limeachwa tofauti na מִזְמוֹר ili kuhifadhi nomino zote mbili katika kichwa.
- source_word: לְיוֹם
  choice: kwa ajili ya siku
  rationale: Kiambishi לְ pamoja na 'siku' kinaweza kuonyesha kusudi au uhusiano; usemi huu wa Kiswahili huhifadhi maana kwamba wimbo huu unahusishwa na au ulikusudiwa kwa siku hiyo.
- source_word: הַשַּׁבָּת
  choice: Sabato
  rationale: Linarejelea Sabato mahususi. 'Siku ya Sabato' ni usemi wa kawaida na wazi katika Kiswahili.
theological_decisions:
- issue: Asili ya mstari huu kama kichwa badala ya mstari wa kishairi
  choice: 'Kutafsiri kama kichwa: “Zaburi, wimbo kwa ajili ya siku ya Sabato.”'
  alternative: Kuuchukulia kuwa mstari wa kwanza wa shairi bila uakifishaji wa kichwa
  rationale: Kiebrania kina vipashio vya kinomino vya kichwa bila kitenzi chenye ukomo. Kuutoa kama kichwa kunawakilisha vyema kazi yake ya kifasihi katika kitabu cha Zaburi bila kuongeza kauli isiyokuwamo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo mfupi wa kinomino umehifadhiwa ili uonekane wazi kuwa ni kichwa cha zaburi.
