lexical_decisions:
- source_word: עֲלֵי
  choice: kwa
  rationale: Katika muktadha wa muziki, kihusishi hiki huonyesha chombo kinachotumiwa kuandamana na uimbaji; “kwa” ni Kiswahili cha kawaida na huhifadhi maana hiyo.
- source_word: עָשׂוֹר
  choice: chombo cha nyuzi kumi
  rationale: Hapa neno hili linaashiria chombo cha muziki chenye nyuzi kumi. Tafsiri hii haibashiri aina mahususi ya chombo kuliko Kiebrania kinavyoruhusu.
- source_word: וַעֲלֵי
  choice: na kwa
  rationale: Muundo wa kiunganishi pamoja na kihusishi umerudiwa ili kudumisha orodha ya kishairi ya vyombo.
- source_word: נָבֶל
  choice: kinanda
  rationale: Neno hili linataja chombo cha nyuzi ambacho utambulisho wake kamili hauna uhakika. “Kinanda” linatumika hapa kama jina la jumla la chombo hicho, huku tanbihi ikihifadhi kutokuwa na uhakika wa kihistoria.
- source_word: הִגָּיוֹן
  choice: mlio
  rationale: Katika mazingira haya ya vyombo vya muziki, neno linaweza kumaanisha sauti yenye mwangwi au muziki unaotafakariwa. “Mlio” linafaa kwa muktadha bila kuifanya maana kuwa “tafakari” pekee.
- source_word: בְּכִנּוֹר
  choice: wa kinubi
  rationale: Kihusishi בְּ kinaonyesha chombo kinachotoa mlio. “Kinubi” linatofautisha כִּנּוֹר na נָבֶל, ingawa utambulisho kamili wa vyombo vyote viwili hauna uhakika.
