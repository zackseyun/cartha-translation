  text: 'A brutish man does not know[a], and a fool does not understand this:'
translation:
  language: sw
  text: 'Mtu asiye na akili hajui[a], na mpumbavu haelewi jambo hili:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtu asiye na ufahamu” au “mtu mpumbavu.” Neno la Kiebrania humfafanua mtu kuwa asiye na ufahamu, kwa taswira ya mtu aliye kama mnyama, si mtu asiyejua habari tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: mtu
  rationale: Ingawa nomino ya Kiebrania ni ya kiume katika umoja, hapa inamwakilisha mtu kwa ujumla. Kiswahili cha kawaida hutumia “mtu” kwa njia ya asili bila kupoteza maana hiyo.
- source_word: בַּעַר
  choice: asiye na akili
  rationale: Neno hili humweleza mtu aliyepumbaa na asiye na ufahamu, kama mnyama. “Asiye na akili” ni wazi na la kawaida katika Kiswahili, huku tanbihi ikihifadhi uzito wa taswira ya Kiebrania.
- source_word: יֵדָע
  choice: hajui
  rationale: Hili ndilo neno la moja kwa moja na la kawaida kwa kukosa maarifa au utambuzi katika muktadha huu.
- source_word: כְסִיל
  choice: mpumbavu
  rationale: Ni istilahi ya kawaida ya fasihi ya hekima kwa mtu mwenye upumbavu wa kiakili na kimaadili; “mpumbavu” huhifadhi uzito huo.
- source_word: יָבִין
  choice: haelewi
  rationale: Kitenzi hiki huhusu kuelewa au kupambanua. “Haelewi” ni cha asili na hudumisha ulinganifu na “hajui,” huku tofauti ndogo ya maana ikibaki.
- source_word: אֶת זֹאת
  choice: jambo hili
  rationale: Kiashiria kinarejelea jambo linalozungumziwa katika muktadha. “Jambo hili” ni wazi na cha asili kwa Kiswahili, na alama ya nukta mbili inaonyesha kuwa mstari unaofuata unalifafanua.
