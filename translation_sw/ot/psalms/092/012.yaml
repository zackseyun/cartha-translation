  text: The righteous flourishes like the palm tree[b][a]; he grows like a cedar in Lebanon.
translation:
  language: sw
  text: Mwenye haki atasitawi kama mtende; atakua kama mwerezi katika Lebanoni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwerezi wa Lebanoni.” Kiebrania husema “katika Lebanoni”; usemi “wa Lebanoni” pia ni wa kawaida kwa kurejelea mwerezi unaohusishwa na eneo hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Nomino-kivumishi ya umoja imetafsiriwa kwa usemi wa kawaida wa Kiswahili unaoweza kumwakilisha kila mtu mwenye haki bila kuongeza neno lisilokuwapo katika Kiebrania.
- source_word: כַּתָּמָר
  choice: kama mtende
  rationale: Huhifadhi tashbihi ya mti wa mtende kwa Kiswahili cha kawaida na cha asili.
- source_word: יִפְרָח
  choice: atasitawi
  rationale: Kitenzi kinaweza kumaanisha kuchanua au kustawi; hapa maana ya kimfano ya kustawi inafaa sambamba na ukuaji wa miti.
- source_word: כְּאֶרֶז
  choice: kama mwerezi
  rationale: Hutoa ulinganisho wa moja kwa moja na mti wa mwerezi kwa lugha ya kawaida.
- source_word: בַּלְּבָנוֹן
  choice: wa Lebanoni
  rationale: Ingawa kihusishi cha Kiebrania kwa kawaida ni ‘katika,’ katika Kiswahili ‘mwerezi wa Lebanoni’ ni muundo wa asili unaotambulisha mwerezi maarufu wa eneo hilo bila kubadili taswira.
- source_word: יִשְׂגֶּה
  choice: atakua
  rationale: Huhifadhi wazo pana la kukua, kuongezeka, au kuwa mkubwa bila kulazimisha maana maalumu ya kukua kwa urefu.
