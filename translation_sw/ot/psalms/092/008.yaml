translation:
  language: sw
  text: Lakini wewe, ee Yahwe, uko juu milele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH,” jina binafsi la Mungu; limetafsiriwa hapa kuwa “Yahwe.”'
    reason: Hufafanua jina la Mungu lililotoholewa katika maandishi makuu bila kudai matamshi ya kihistoria yasiyo na uhakika.
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Lakini wewe
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha tofauti na waovu wanaoangamia katika muktadha uliotangulia. “Lakini wewe” huwasilisha mkazo huo kwa Kiswahili cha kawaida.
- source_word: מָרוֹם
  choice: uko juu
  rationale: Neno hili linaashiria kuwa mahali pa juu au hali ya kutukuka. “Uko juu” huhifadhi taswira ya kimahali na maana ya ukuu bila kulifanya moja kwa moja kuwa jina la cheo kama “Aliye Juu Sana.”
- source_word: לְ/עֹלָם
  choice: milele
  rationale: Kirai hiki kinaonyesha kudumu bila mwisho; “milele” ni usemi wa kawaida, wazi na wenye hadhi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה katika usemi wa kumwita Mungu moja kwa moja
  choice: ee Yahwe
  alternative: ee BWANA
  rationale: Maandishi yana jina la Mungu יְהוָה katika usemi wa moja kwa moja. “Ee Yahwe” huhifadhi jina hilo na pia huonyesha wazi kwamba mtunga zaburi anamwelekea Mungu.
- issue: Maana ya מָרוֹם kama mahali au hali ya kutukuka
  choice: uko juu
  alternative: umetukuka
  rationale: “Uko juu” huhifadhi kwa pamoja uwezekano wa taswira ya mahali pa juu na wazo la ukuu; “umetukuka” lingechagua maana ya kiishara pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi wa kishairi na tofauti kati ya Mungu na waovu katika muktadha umehifadhiwa; “ee” inaonyesha usemi wa moja kwa moja bila kufanya sentensi kuwa nzito.
