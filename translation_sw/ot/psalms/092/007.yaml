  yaml_path: translation/ot/psalms/092/007.yaml
  text: When the wicked sprout like grass and all workers of wickedness flourish[b][a], it is so that they may be destroyed forever.
translation:
  language: sw
  text: Waovu wanapochipuka kama nyasi, na wote watendao uovu wanapositawi[a], ni ili waangamizwe milele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na watenda maovu wote wanachanua.” Kiebrania kwa maana halisi ni “wote watendao uovu wanachanua” au “wanastawi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa kuangamizwa kwao milele,” au “ili tu waangamizwe milele.”
    reason: alternative_reading
lexical_decisions:
- source_word: בִּפְרֹחַ
  choice: wanapochipuka
  rationale: Muundo wa ב pamoja na kitenzi-jina unaonyesha hali ya wakati, ‘wanapochipuka.’ Neno hili pia linadumisha taswira ya mimea.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Ni kivumishi cha wingi kilichotumika kama nomino kwa watu waovu; ‘waovu’ ni kifupi, cha kawaida, na chenye maana hiyo ya kijumla.
- source_word: כְּמוֹ עֵשֶׂב
  choice: kama majani
  rationale: עֵשֶׂב humaanisha majani au mimea ya ardhini. ‘Kama majani’ ni lugha ya kawaida na inadumisha taswira ya ukuaji wa haraka na wa muda mfupi.
- source_word: וַיָּצִיצוּ
  choice: wanapositawi
  rationale: Kitenzi צוץ hueleza kuchanua au kustawi. ‘Wanapositawi’ kinaonyesha mafanikio yanayoonekana huku kikiendelea na taswira ya mimea.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: wote watendao uovu
  rationale: Tafsiri hii inadumisha wazo la watu wanaotenda uovu, huku ikiwa ya asili na inayoeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: לְהִשָּׁמְדָם
  choice: ni ili waangamizwe
  rationale: 'Kitenzi-jina cha Nifali pamoja na kiambishi cha nafsi ya tatu wingi kina maana ya kutendwa: ‘waangamizwe.’ ‘Ni ili’ huonyesha uwezekano wa kusudi au matokeo bila kumtaja wazi mtendaji ambaye Kiebrania hakumtaji.'
- source_word: עֲדֵי עַד
  choice: milele
  rationale: Nahau hii ya Kiebrania huonyesha hali ya kudumu; ‘milele’ ndiyo tafsiri ya kawaida na iliyo wazi.
theological_decisions:
- issue: Ikiwa kustawi kwa waovu ni uchunguzi tu wa mafanikio yao ya muda au kunaelekezwa kwenye hukumu yao ya mwisho
  choice: ni ili waangamizwe milele
  alternative: kwa kuangamizwa kwao milele; ili tu waangamizwe milele
  rationale: Kihusishi לְ kinaweza kuonyesha kusudi au matokeo. Tafsiri kuu inadumisha uhusiano kati ya kustawi kwao na kuangamizwa kwao, lakini haiongezi mtendaji wa kimungu ambaye hakutajwa wazi wala kuamua kabisa kati ya kusudi na matokeo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ni wa kawaida kwa wasomaji wengi; ‘wanapochipuka’ na ‘wanapositawi’ hudumisha taswira sambamba ya mimea, huku tanbihi zikihifadhi mbadala wa karibu zaidi na umbo la Kiebrania.
