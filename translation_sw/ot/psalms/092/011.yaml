  text: וַ/תַּבֵּ֥ט עֵינִ֗/י בְּ/שׁ֫וּרָ֥/י בַּ/קָּמִ֖ים עָלַ֥/י מְרֵעִ֗ים תִּשְׁמַ֥עְנָה אָזְנָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/011.yaml
  text: My eye has looked on my foes[b][a]; my ears hear of the evildoers who rise against me.
translation:
  language: sw
  text: Jicho langu limewatazama adui zangu[a]; masikio yangu yamesikia[b] habari za watenda maovu wanaoinuka dhidi yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale wanaonitazama” au “wanaonivizia.” Neno la Kiebrania linaweza kutaja watazamaji wenye uhasama.
    reason: lexical_alternative
  - marker: b
    text: Au, “yanasikia” au “yatasikia.” Umbo la kitenzi cha Kiebrania linaweza kueleweka kwa nyakati au mitazamo tofauti katika muktadha huu wa kishairi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּבֵּט
  choice: limewatazama
  rationale: Kitenzi נבט humaanisha kutazama au kuelekeza macho kwa mtu au kitu. Wakati timilifu wa Kiswahili unawasilisha tendo lililotimizwa bila kuongeza wazo la kufurahia anguko lao.
- source_word: עֵינִי
  choice: Jicho langu
  rationale: Umoja wa Kiebrania umehifadhiwa, nao unasikika kwa kawaida katika lugha ya kishairi ya Kiswahili.
- source_word: בְּשׁוּרָי
  choice: adui zangu
  rationale: Neno hili linaweza kumaanisha wanaomtazama au kumvizia msemaji; muktadha wa uhasama unaunga mkono maana ya wapinzani. Tafsiri ya moja kwa moja zaidi imewekwa katika tanbihi.
- source_word: בַּקָּמִים עָלַי
  choice: wanaoinuka dhidi yangu
  rationale: Hii huhifadhi taswira ya קום pamoja na עַל, ambayo hapa inaonyesha kusimama kwa uhasama au kumpinga mtu.
- source_word: מְרֵעִים
  choice: watenda maovu
  rationale: Umbo hili la kishiriki linawataja watu wanaofanya uovu au madhara; ‘watenda maovu’ ni la kawaida, wazi, na huhifadhi uzito wa kimaadili.
- source_word: תִּשְׁמַעְנָה אָזְנָי
  choice: masikio yangu yamesikia
  rationale: Umoja wa kisarufi wa kitenzi cha Kiebrania unaafikiana na ‘masikio’ ya wingi wa kike. Kiswahili kimetumia wakati timilifu kwa tendo lenye matokeo ya sasa na kuhifadhi taswira ya masikio kama kiima.
- source_word: תִּשְׁמַעְנָה ... בַּקָּמִים ... מְרֵעִים
  choice: yamesikia habari za watenda maovu wanaoinuka
  rationale: Kiebrania ni kifupi na hakitaji wazi kitu kilichosikiwa. ‘Habari za’ huunda sentensi ya kawaida ya Kiswahili bila kubainisha kuwa msemaji alisikia sauti zao au taarifa ya mwisho wao.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi ulio wazi na wenye heshima. Umoja wa ‘jicho langu’ na taswira ya ‘masikio yangu’ zimehifadhiwa; ‘habari za’ imetumiwa kukamilisha kwa kawaida uhusiano ambao Kiebrania kinauacha kwa ufupi.
