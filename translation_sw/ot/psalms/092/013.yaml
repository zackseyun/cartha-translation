  text: Planted in the house of Yahweh[b][a], they will flourish in the courts of our God.
translation:
  language: sw
  text: Waliopandwa katika nyumba ya Yahweh, watasitawi katika nyua za Mungu wetu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁתוּלִים
  choice: Wakiwa wamepandwa
  rationale: Kivumishi-tendo cha hali ya kutendwa kinamaanisha ‘waliopandwa’; muundo huu wa Kiswahili ni wa kawaida na unadumisha sitiari ya mimea pamoja na uhusiano wake na mstari uliotangulia.
- source_word: בְּבֵית
  choice: katika nyumba ya
  rationale: בַּיִת kimsingi ni ‘nyumba.’ Ingawa hapa inaweza kumaanisha hekalu, ‘nyumba ya’ inadumisha taswira ya Kiebrania bila kuifafanua kupita kiasi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetoholewa kama jina binafsi ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
- source_word: בְּחַצְרוֹת
  choice: katika nyua za
  rationale: חָצֵר ni ua au eneo la wazi linalozungukwa na majengo; katika wingi hapa hurejelea nyua za mahali patakatifu. ‘Nyua’ ni Kiswahili cha kawaida na sahihi.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Ni muundo wa kawaida wenye kiambishi cha nafsi ya kwanza wingi, yaani ‘Mungu wetu.’
- source_word: יַפְרִיחוּ
  choice: watasitawi
  rationale: Hifili ya פרח inaweza kumaanisha kuchipua, kuchanua, au kustawi. ‘Watasitawi’ huonyesha ukuaji wenye nguvu na kudumisha sitiari ya mimea katika Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la Mungu YHWH. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa kishazi cha mwanzo umehifadhiwa ili kuonyesha kwamba mstari unaendeleza maelezo ya wenye haki kutoka muktadha uliotangulia.
