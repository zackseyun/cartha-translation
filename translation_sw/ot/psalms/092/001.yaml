base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/001.yaml
  text: It is good to give thanks to Yahweh[a], and to sing praise to your name, O Most High,
translation:
  language: sw
  text: Ni vema kumshukuru Yahweh, na kuimba sifa kwa jina lako, Ee Uliye Juu Zaidi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב
  choice: Ni vema
  rationale: Kivumishi hiki kinatathmini vitendo viwili vinavyofuata kuwa vyema; muundo wa Kiswahili “Ni vema” ni wa kawaida, wenye heshima, na haupunguzi maana kuwa raha au wajibu tu.
- source_word: לְהֹדוֹת
  choice: kumshukuru
  rationale: Katika muktadha huu wa ibada, kitenzi ידה katika Hiphil kina maana ya kutoa shukrani au sifa. “Kumshukuru” huhifadhi shukrani kama wazo kuu na kuitofautisha na uimbaji wa sifa katika kipande cha pili.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetafsiriwa moja kwa moja kama “Yahweh,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: וּלְזַמֵּר
  choice: na kuliimbia sifa
  rationale: זמר katika Piel humaanisha kufanya muziki wa sifa, mara nyingi kwa kuimba. “Kuliimbia sifa” ni Kiswahili cha kawaida na hakiongezi ala ambazo hazikutajwa.
- source_word: לְשִׁמְךָ
  choice: jina lako
  rationale: Usemi wa Kiebrania kuhusu kulisifu jina la Mungu umehifadhiwa kwa sababu “jina” hubeba maana ya utambulisho na sifa zake, si rejeo tupu la nafsi.
- source_word: עֶלְיוֹן
  choice: Ee Uliye Juu Zaidi
  rationale: Cheo hiki cha Mungu kinaonyesha ukuu wake usio na kifani. “Ee” huweka wazi kwamba ni mwito wa moja kwa moja, kama inavyoashiriwa na “jina lako.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania ina Tetragramatoni moja kwa moja. “Yahweh” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo, huku “Yehova” ikiwa umbo la baadaye.
- issue: Maana ya עֶלְיוֹן kama cheo cha Mungu
  choice: Uliye Juu Zaidi
  alternative: Aliye Mkuu; Aliye Juu Sana
  rationale: Tafsiri hii huhifadhi maana ya cheo cha ulinganisho mkuu bila kukifanya jina la dhehebu au kuondoa nguvu ya mwito wa moja kwa moja.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi bila kuwa cha kale. Mpangilio sambamba wa kishairi umehifadhiwa: kushukuru Yahweh na kuliimbia sifa jina lake.'
