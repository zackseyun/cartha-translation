  text: גַּם לְשׁוֹנִ֗/י כָּל הַ֭/יּוֹם תֶּהְגֶּ֣ה צִדְקָתֶ֑/ךָ כִּי בֹ֥שׁוּ כִֽי חָ֝פְר֗וּ מְבַקְשֵׁ֥י רָעָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/024.yaml
  text: My tongue also will speak of your righteousness all day long[a], for those seeking my harm have been put to shame; they have been disgraced.
translation:
  language: sw
  text: Ulimi wangu pia utasema juu ya haki yako mchana kutwa[a], kwa maana wanaotafuta kunidhuru wameaibika na wamefedheheka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uadilifu wako.” Neno la Kiebrania linaweza kumaanisha uadilifu na pia haki, hasa linapozungumzia Mungu kumwokoa na kumtetea mtu kwa haki.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: pia
  rationale: 'Hudumisha wazo la kuendelea na sifa zilizotangulia: ulimi wake pia utashiriki katika kumsifu Mungu.'
- source_word: לְשׁוֹנִי
  choice: Ulimi wangu
  rationale: Taswira halisi ya kiungo cha mwili imehifadhiwa badala ya kubadilishwa kuwa dhana ya jumla kama ‘maneno yangu’.
- source_word: כָּל הַיּוֹם
  choice: mchana kutwa
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha tendo linaloendelea siku nzima.
- source_word: תֶּהְגֶּה
  choice: utatafakari kwa kusema kuhusu
  rationale: Kitenzi הגה kinaweza kumaanisha kutafakari, kunong’ona, au kutamka kwa sauti ya chini. Kwa kuwa ‘ulimi’ ndio kiima, tafsiri hii inadumisha kwa kiasi fulani mvutano kati ya kutafakari na kutamka.
- source_word: צִדְקָתֶךָ
  choice: haki yako
  rationale: ‘Haki’ katika Kiswahili inaweza kujumuisha unyofu wa Mungu na tendo lake la kutoa hukumu au kumtetea mwombaji, hivyo inalinda upana wa neno la Kiebrania.
- source_word: כִּי
  choice: kwa maana
  rationale: Inaingiza sababu ya sifa za mtunga zaburi kwa Kiswahili cha kawaida.
- source_word: בֹשׁוּ
  choice: wameaibishwa
  rationale: Huwasilisha hali iliyotokea yenye matokeo yanayoendelea sasa.
- source_word: כִּי חָפְרוּ
  choice: na kufedheheshwa
  rationale: כי ya pili imewakilishwa kwa kiunganishi cha mtiririko badala ya kurudiwa kwa namna ngumu; ‘kufedheheshwa’ hutofautisha fedheha ya wazi na aibu huku ikihifadhi usambamba.
- source_word: מְבַקְשֵׁי רָעָתִי
  choice: wanaotafuta kunidhuru
  rationale: Huwasilisha nia endelevu ya wale wanaotaka mabaya yampate mtunga zaburi kwa lugha ya asili na iliyo wazi.
theological_decisions:
- issue: Maana ya צִדְקָתֶךָ katika muktadha wa Zaburi
  choice: haki yako
  alternative: uadilifu wako
  rationale: ‘Haki’ inadumisha uwezekano wa kumaanisha tabia nyofu ya Mungu pamoja na hukumu yake ya haki na tendo lake la kuokoa au kutetea, bila kuifunga maana katika upande mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘utatafakari kwa kusema’ umetumiwa kwa makusudi kuhifadhi maana mbili za הגה, ingawa ni mzito kidogo kuliko usemi wa kawaida.
