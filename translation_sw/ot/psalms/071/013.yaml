source:
  edition: WLC
  text: יֵבֹ֣שׁוּ יִכְלוּ֮ שֹׂטְנֵ֪י נַ֫פְשִׁ֥/י יַֽעֲט֣וּ חֶ֭רְפָּה וּ/כְלִמָּ֑ה מְ֝בַקְשֵׁ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/013.yaml
  text: Let those who are hostile to my life be put to shame and come to an end[b][a]; let those who seek my harm be clothed with reproach and disgrace.
translation:
  language: sw
  text: Waaibike na waangamie[a] wale walio adui wa maisha yangu[b]; wajifunike kwa lawama na fedheha wale wanaotafuta kunidhuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waishe” au “wafikie mwisho.”
    reason: lexical_alternative
  - marker: b
    text: Au “nafsi yangu”; neno la Kiebrania hapa mara nyingi humaanisha maisha ya mtu au mtu mwenyewe, si hasa roho isiyo ya mwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: Waaibike
  rationale: Kauli ya kutakia au kuomba katika muktadha huu; ‘waaibike’ ni ya asili katika Kiswahili na huhifadhi nguvu ya ombi bila kuigeuza kuwa utabiri.
- source_word: יִכְלוּ
  choice: waangamie
  rationale: Kitenzi כלה kinaweza kumaanisha kufikia mwisho, kuisha, au kuangamia. ‘Waangamie’ linafaa kwa watu na kwa muktadha wa ombi la hukumu, huku tanbihi ikihifadhi wigo mpana wa maana.
- source_word: שֹׂטְנֵי נַפְשִׁי
  choice: wale wanaopinga maisha yangu
  rationale: שׂטן hapa huonyesha uadui au upinzani, na נֶפֶשׁ katika muktadha huu hurejelea maisha au nafsi nzima ya mwombaji, si lazima roho isiyo ya kimwili.
- source_word: יַעֲטוּ
  choice: wavikwe
  rationale: Huhifadhi sitiari ya kujifunika au kuvikwa, na ni usemi wa kawaida wenye hadhi katika Kiswahili.
- source_word: חֶרְפָּה
  choice: shutuma
  rationale: Huwasilisha aibu ya hadharani inayotokana na kulaumiwa au kudharauliwa, na kuitofautisha na כְלִמָּה.
- source_word: וּכְלִמָּה
  choice: na fedheha
  rationale: ‘Fedheha’ huonyesha kuaibishwa na kudhalilishwa hadharani, na hudumisha mkazo wa jozi ya maneno ya Kiebrania.
- source_word: מְבַקְשֵׁי רָעָתִי
  choice: wale wanaotafuta kunidhuru
  rationale: Ni Kiswahili cha asili kinachoonyesha nia hai ya kuleta madhara, bila kulazimisha maana pana ya ‘uovu’.
theological_decisions:
- issue: Nguvu ya kauli ya kutakia katika vitenzi vya imperfecti
  choice: Kutumia ‘Waaibike ... waangamie ... wavikwe’ kama ombi au takwa
  alternative: ‘Wataaibika ... wataangamia ... watavikwa’ kama utabiri wa wakati ujao
  rationale: Katika muktadha wa sala ya kishairi, vitenzi hivyo vina nguvu ya jussive/imprecatory. Muundo huu huhifadhi ombi la moja kwa moja bila kuligeuza kuwa taarifa ya utabiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishairi, ulinganifu wa vipashio, na sitiari ya kuvikwa vimehifadhiwa. Alama zote za tanbihi zimewekwa mara tu baada ya maneno yanayofafanuliwa.
