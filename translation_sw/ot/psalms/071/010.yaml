base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/010.yaml
  text: For my enemies speak against me[b][a], and those who watch for my life consult together.
translation:
  language: sw
  text: Kwa maana adui zangu wanasema dhidi yangu, nao wanaovizia maisha yangu[a] wanashauriana pamoja[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanaonyemelea maisha yangu” au “wanaotafuta maisha yangu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wanafanya shauri pamoja”; katika muktadha huu kitenzi hicho kinaweza pia kuwa na maana ya uhasama, “wanakula njama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza sababu ya ombi lililotangulia na kuhifadhi nguvu ya maelezo ya kiunganishi hicho.
- source_word: אָמְרוּ
  choice: wanasema
  rationale: Ingawa kitenzi cha Kiebrania kiko katika umbo timilifu, katika ushairi kinaweza kueleza maneno ya uhasama yanayoendelea; wakati wa sasa ni wa kawaida katika Kiswahili hapa.
- source_word: אֹיְבַי לִי
  choice: adui zangu wanasema dhidi yangu
  rationale: “Adui zangu” ni tafsiri ya moja kwa moja, na “dhidi yangu” huonyesha kwa kawaida mwelekeo wa uhasama wa לִי katika muktadha huu.
- source_word: וְשֹׁמְרֵי נַפְשִׁי
  choice: nao wanaovizia maisha yangu
  rationale: Katika muktadha wa uhasama, שׁמר ina maana ya kufuatilia kwa kusudi la kudhuru, si kulinda; נֶפֶשׁ hapa ni uhai wa mtu. “Kuvizia” ni Kiswahili cha kawaida kinachoonyesha kusubiri nafasi ya kushambulia.
- source_word: נוֹעֲצוּ
  choice: wanashauriana
  rationale: Huhifadhi maana ya msingi ya kujadiliana au kufanya shauri pamoja bila kulazimisha maana yenye nguvu zaidi ya “kula njama,” ingawa muktadha ni wa uhasama.
- source_word: יַחְדָּו
  choice: pamoja
  rationale: Ni tafsiri ya kawaida ya kielezi kinachoonyesha hatua iliyoratibiwa.
