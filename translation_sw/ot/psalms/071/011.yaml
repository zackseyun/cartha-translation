  text: saying[a], “God has forsaken him; pursue and seize him, for there is no one to rescue him.”
translation:
  language: sw
  text: wakisema, “Mungu amemwacha[a]; mwandameni na mkamateni, kwa maana hakuna wa kumwokoa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amemtelekeza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Kitenzi-jina hiki kinatanguliza maneno yaliyonukuliwa. “Wakisema” ni Kiswahili cha kawaida kinachoendeleza kwa asili wahusika waliotajwa katika muktadha uliotangulia.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania linaweza kuonekana kama wingi, kitenzi cha umoja עֲזָבוֹ kinaonyesha wazi kwamba hapa ni jina la Mungu mmoja.
- source_word: עֲזָבוֹ
  choice: amemwacha
  rationale: Wakati timilifu unaonyesha tendo lililokamilika lenye matokeo yanayoendelea. “Amemwacha” ni la kawaida na lenye uzito katika kilio, bila kuthibitisha kwamba madai ya maadui ni ya kweli.
- source_word: רִדְפוּ
  choice: mfuateni
  rationale: Ni amri ya wingi ya kumwandama mtu. “Mfuateni” hudumisha wazo la kumfuatia kwa nia ya kumkamata bila kuongeza maana isiyolazimu.
- source_word: וְתִפְשֻׂהוּ
  choice: na kumkamata
  rationale: Kitenzi kina maana ya kumshika au kumtia mtu mikononi. “Kumkamata” ni cha moja kwa moja na cha kawaida katika muktadha huu.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya amri iliyotangulia.
- source_word: אֵין מַצִּיל
  choice: hakuna wa kumwokoa
  rationale: Tafsiri hii huhifadhi wazo la kutokuwapo kwa mtu anayemnusuru, kwa Kiswahili cha kawaida na wazi.
theological_decisions:
- issue: Dai la maadui kwamba Mungu amemwacha mtunga zaburi
  choice: Mungu amemwacha
  alternative: Mungu amemtelekeza
  rationale: Aya inaripoti maneno ya maadui, si uthibitisho wa msimulizi kwamba Mungu kwa kweli amemwacha mwenye haki. “Amemwacha” huhifadhi uzito na mvutano huo bila kuutatua kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi ni mfupi na mkali kama kejeli ya maadui; amri za wingi na mvutano wa madai yao kuhusu Mungu vimehifadhiwa.
