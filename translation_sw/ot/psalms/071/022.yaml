base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/022.yaml
  text: I also will praise you with the harp for your faithfulness[a], my God; I will make music to you with the lyre[c][b], Holy One of Israel.
translation:
  language: sw
  text: Mimi pia nitakusifu kwa kinubi kwa ajili ya uaminifu wako[a], Mungu wangu; nitakuimbia kwa zeze[b], Ee Mtakatifu wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukweli wako.” Neno la Kiebrania linaweza kumaanisha ukweli au uaminifu.
    reason: lexical_alternative
  - marker: b
    text: Utambulisho kamili wa ala mbili za kale zilizotajwa hapa (nevel na kinnor) hauna uhakika; hapa zimetafsiriwa “kinubi” na “zeze.”
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: Mimi pia
  rationale: 'Muundo huu unahifadhi msisitizo wa kiwakilishi huru pamoja na wazo la kuendelea au kujumuika: ‘mimi pia.’'
- source_word: אוֹדְךָ
  choice: nitakusifu
  rationale: Kitenzi ידה katika muktadha wa ibada humaanisha kusifu au kushukuru; hapa usambamba wake na uimbaji wa muziki unaunga mkono ‘kusifu.’
- source_word: בִכְלִי נֶבֶל
  choice: kwa kinanda
  rationale: כְּלִי ni ala, na נֶבֶל huitaja aina yake. ‘Kinanda’ ni istilahi ya jadi ya Kiswahili katika muktadha wa kibiblia, ingawa utambulisho kamili wa ala ya kale haujulikani.
- source_word: אֲמִתְּךָ
  choice: kwa ajili ya uaminifu wako
  rationale: אֱמֶת linaweza kumaanisha ukweli au uaminifu. Katika sifa kwa Mungu, ‘uaminifu wako’ linaonyesha kutegemeka kwake; ‘kwa ajili ya’ linaeleza kwa Kiswahili sababu au mada ya sifa.
- source_word: אֱלֹהָי
  choice: Mungu wangu
  rationale: Ni umbo la moja kwa moja la umilikaji na hapa ni namna ya kumwambia Mungu.
- source_word: אֲזַמְּרָה לְךָ
  choice: nitakuimbia sifa
  rationale: זמר katika muktadha huu ni kuimba au kufanya muziki wa sifa. ‘Nitakuimbia sifa’ ni Kiswahili cha kawaida na huhifadhi mwelekeo wa ibada kwa Mungu.
- source_word: בְכִנּוֹר
  choice: kwa kinubi
  rationale: כִּנּוֹר ni ala ya nyuzi, kwa kawaida hutafsiriwa ‘kinubi.’ Neno tofauti limetumiwa ili kuhifadhi utofauti wa ala mbili katika Kiebrania.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: Ee Mtakatifu wa Israeli
  rationale: Hili ni jina la heshima la Mungu katika usemi wa moja kwa moja; ‘Ee’ huonyesha wazi namna ya kumwita bila kubadili maana.
theological_decisions:
- issue: Maana ya אֱמֶת linapotumiwa kuhusu Mungu katika sifa
  choice: uaminifu
  alternative: ukweli
  rationale: ‘Uaminifu’ huonyesha tabia ya Mungu ya kutegemeka katika uhusiano wake na matendo yake ya kuokoa. Kwa kuwa neno la Kiebrania pia linaweza kumaanisha ‘ukweli,’ uwezekano huo umehifadhiwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha ushairi na usambamba wa mistari miwili, huku istilahi za jadi za ala zikifafanuliwa katika tanbihi.
