  text: יִמָּ֣לֵא פִ֭/י תְּהִלָּתֶ֑/ךָ כָּל הַ֝/יּ֗וֹם תִּפְאַרְתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/008.yaml
  text: My mouth will be filled with your praise[b][a], with your splendor all day long.
translation:
  language: sw
  text: Kinywa changu kitajawa na sifa zako[a], na utukufu wako siku nzima.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kinywa changu kinajawa na sifa zako,” au huenda, “Kinywa changu kijazwe na sifa zako.” Katika ushairi, kitenzi cha Kiebrania kinaweza kueleweka kwa maana ya wakati ujao, hali ya sasa, au ombi.
    reason: alternative_reading
  - marker: b
    text: Au “fahari yako,” “uzuri wako,” au “adhama yako” badala ya “utukufu wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּלֵא
  choice: kitajaa
  rationale: Kauli ya Kiebrania ya Nifali isiyotimilika imetafsiriwa kwa wakati ujao, kulingana na mtiririko wa muktadha, huku uwezekano wa maana ya hali ya sasa au ombi ukihifadhiwa katika tanbihi.
- source_word: פִי
  choice: kinywa changu
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya sitiari ya Kiebrania inayohusu usemi wa sifa.
- source_word: תְּהִלָּתֶךָ
  choice: sifa zako
  rationale: Muundo wenye kiambishi cha nafsi ya pili umoja wa kiume unaonyesha sifa zinazoelekezwa kwa Mungu au zinazomhusu; Kiswahili 'sifa zako' ni cha asili na huhifadhi ufupi wa kishairi.
- source_word: כָּל הַיּוֹם
  choice: mchana kutwa
  rationale: Usemi wa kawaida wa Kiswahili unaowasilisha muda wote wa siku.
- source_word: תִּפְאַרְתֶּךָ
  choice: fahari yako
  rationale: Neno תפארת linaweza kumaanisha fahari, utukufu, uzuri, au adhama. 'Fahari' linafaa katika usambamba wa kishairi na 'sifa' bila kulifanya neno hili lifanane kabisa na neno la kawaida la 'utukufu'.
theological_decisions:
- issue: Nguvu ya kitenzi יִמָּלֵא katika ushairi
  choice: 'Kauli ya wakati ujao: ''kitajaa'''
  alternative: 'Hali ya sasa: ''kinajaa''; au ombi: ''na kijazwe'''
  rationale: Umbo la Kiebrania linaweza kuwa na maana ya wakati ujao, hali inayoendelea, au ombi katika muktadha wa kishairi. Tafsiri kuu inafuata usomaji wa wakati ujao bila kuficha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wa heshima. 'Mchana kutwa' ni usemi wa sasa na unaoeleweka kwa urahisi; mpangilio wa sentensi huhifadhi usambamba wa mistari ya Kiebrania.
