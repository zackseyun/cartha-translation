  yaml_path: translation/ot/psalms/071/023.yaml
  text: My lips will shout for joy when I sing praise to you[a], and my soul[c][b], which you have redeemed.
translation:
  language: sw
  text: Midomo yangu itapaza sauti kwa shangwe[a] nitakapokuimbia sifa, na nafsi yangu pia, uliyoikomboa[c].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “itaimba kwa shangwe” au “itapiga kelele kwa furaha”; kitenzi cha Kiebrania kinaweza kumaanisha kuimba kwa shangwe au kupaza sauti ya furaha.
    reason: lexical_alternative
  - marker: b
    text: Au, “uhai wangu” au “mimi mwenyewe”; neno la Kiebrania נפש (nefesh) linaweza kumaanisha nafsi, uhai, au mtu mwenyewe.
    reason: lexical_alternative
  - marker: c
    text: Au, “umeiokoa,” “umeinunua kwa fidia,” au “umeiweka huru”; kitenzi cha Kiebrania kinaweza kueleza ukombozi, kuachiliwa, au wokovu.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרַנֵּנָּה
  choice: itapiga kelele kwa furaha
  rationale: Kitenzi hiki katika Piel huonyesha kilio cha shangwe au uimbaji wa furaha; usemi huu unahifadhi nguvu ya sauti ya kushangilia bila kuifanya lazima kuwa wimbo.
- source_word: שְׂפָתַי
  choice: midomo yangu
  rationale: Tafsiri ya moja kwa moja inayohifadhi taswira ya kishairi ya sifa kutoka kinywani mwa msemaji.
- source_word: כִּי
  choice: ninapo-
  rationale: Hapa inaeleweka kwa kawaida kuwa inataja wakati au tukio ambapo midomo inashangilia, ingawa inaweza pia kueleweka kuwa ‘kwa kuwa’.
- source_word: אֲזַמְּרָה לָּךְ
  choice: ninapokuimbia sifa
  rationale: זמר katika Piel humaanisha kutoa sifa kwa muziki; muundo huu ni wa kawaida katika Kiswahili na unaonyesha Mungu kuwa anayeelekezewa sifa.
- source_word: וְנַפְשִׁי
  choice: na nafsi yangu pia
  rationale: נפשׁ inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. ‘Nafsi yangu’ huhifadhi sambamba ya kishairi kati ya midomo na utu wa ndani, huku ‘pia’ ikifanya uhusiano huo uwe wazi.
- source_word: פָּדִיתָ
  choice: umeikomboa
  rationale: פדה hueleza kuachiliwa kwa ukombozi kutoka hatarini au utumwani; ‘kuikomboa’ huhifadhi uzito wa wokovu bila kuingiza maelezo finyu yasiyotajwa hapa.
theological_decisions:
- issue: Maana ya פדה katika muktadha wa sifa
  choice: umeikomboa
  alternative: umeiokoa / umeikomboa kwa kulipia fidia
  rationale: Mstari unaweka msingi wa sifa katika tendo la Mungu la kuokoa. ‘Umeikomboa’ huhifadhi maana pana na uzito wa kitheolojia wa פדה bila kudai wazi namna ya ukombozi ambayo mstari wenyewe haibainishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa sentensi umehifadhi sambamba ya ‘midomo yangu’ na ‘nafsi yangu,’ huku ‘pia’ ikifafanua kwamba nafsi nayo inashiriki katika shangwe. Alama zote za tanbihi zimewekwa katika matini kuu karibu na maneno yanayohusika.
