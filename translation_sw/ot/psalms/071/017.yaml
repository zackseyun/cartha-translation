  text: אֱֽלֹהִ֗ים לִמַּדְתַּ֥/נִי מִ/נְּעוּרָ֑/י וְ/עַד הֵ֝֗נָּה אַגִּ֥יד נִפְלְאוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/017.yaml
  text: God[a], you have taught me from my youth, and to this day I declare your wondrous deeds.
translation:
  language: sw
  text: Ee Mungu, umenifundisha tangu ujana wangu, na mpaka sasa ninatangaza matendo yako ya ajabu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maajabu yako” au “kazi zako za ajabu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Nomino hii inatumika kama mwito wa moja kwa moja. Kiswahili cha sala hutumia kwa kawaida “Ee Mungu,” jambo linaloweka wazi mwito ambao Kiebrania kinaweza kuonyesha bila chembe maalumu.
- source_word: לִמַּדְתַּנִי
  choice: umenifundisha
  rationale: Piel ya למד pamoja na kiambishi cha nafsi ya kwanza umoja humaanisha “umenifundisha.” Kauli ya wakati timilifu inaonyesha tendo lililoanza zamani lenye umuhimu unaoendelea.
- source_word: מִנְּעוּרָי
  choice: tangu ujana wangu
  rationale: נְעוּרִים hurejelea miaka ya ujana. “Tangu ujana wangu” ni ya asili katika Kiswahili na huonyesha kipindi kinachoanzia ujana hadi wakati wa sasa.
- source_word: וְעַד הֵנָּה
  choice: na mpaka sasa
  rationale: Kirai hiki huonyesha mwendelezo hadi wakati wa sasa; “mpaka sasa” ni tafsiri ya kawaida na iliyo wazi.
- source_word: אַגִּיד
  choice: ninatangaza
  rationale: Hiphil ya נגד inaweza kumaanisha kutangaza, kusimulia, au kujulisha. “Ninatangaza” inadumisha hali ya ushuhuda wa sifa bila kuongeza nguvu isiyokuwamo katika neno.
- source_word: נִפְלְאוֹתֶיךָ
  choice: matendo yako ya ajabu
  rationale: נִפְלָאוֹת mara nyingi hurejelea matendo ya Mungu yaliyo ya ajabu. Tafsiri hii ni wazi na ya asili, huku tanbihi ikihifadhi uwezekano wa tafsiri fupi zaidi.
theological_decisions:
- issue: Kuhifadhi mwito wa moja kwa moja kwa Mungu
  choice: “Ee Mungu, umenifundisha...”
  alternative: Kuitafsiri kama taarifa inayomhusu Mungu badala ya usemi unaoelekezwa kwake
  rationale: Vitenzi na viambishi vya nafsi ya pili ya kiume umoja vinaonyesha kwamba mtunga zaburi anamwelekea Mungu moja kwa moja. Mwito huo huhifadhi hali ya sala bila kuingiza fundisho la dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ee Mungu” kinafaa kwa mwito wa sala; “tangu ujana wangu” na “mpaka sasa” vinaonyesha mwendelezo wa wakati kwa uwazi.
