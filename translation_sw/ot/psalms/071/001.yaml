source:
  edition: WLC
  text: בְּ/ךָֽ יְהוָ֥ה חָסִ֑יתִי אַל אֵב֥וֹשָׁה לְ/עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/001.yaml
  text: In you[a], O Yahweh, I have taken refuge; let me never be put to shame.
translation:
  language: sw
  text: Ee Yahwe, nimekimbilia kwako; nisiaibishwe kamwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/ךָ
  choice: nimekukimbilia wewe
  rationale: Kiambishi בְּ pamoja na kiwakilishi cha nafsi ya pili kinaonyesha kwamba Yahwe ndiye kimbilio la mwombaji. Kiswahili cha kawaida hutumia ‘kumkimbilia’ mtu badala ya tafsiri ya moja kwa moja ‘ndani yako’; ‘wewe’ hudumisha msisitizo wa neno lililotangulizwa katika Kiebrania bila kuongeza wazo la ‘wewe peke yako’.
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi ‘Yahwe’; ‘Ee’ linaonyesha mwito wa moja kwa moja unaofaa katika sala.
- source_word: חָסִיתִי
  choice: nimekukimbilia
  rationale: Kitenzi חסה humaanisha kutafuta au kupata kimbilio. Kauli timilifu ya nafsi ya kwanza inaelezwa kwa ‘nimekukimbilia,’ ambayo huonyesha tendo lililofanyika lenye matokeo ya sasa na kuhifadhi picha ya ulinzi.
- source_word: אַל אֵבוֹשָׁה
  choice: usiruhusu niaibishwe
  rationale: אַל pamoja na umbo la nafsi ya kwanza huleta ombi hasi. ‘Usiruhusu niaibishwe’ ni sala ya kawaida ya Kiswahili na huonyesha aibu au fedheha inayompata mwombaji, si hisia ya ndani tu.
- source_word: לְ/עוֹלָם
  choice: kamwe
  rationale: Katika ombi hasi, לְעוֹלָם ina maana ya ‘wakati wowote kabisa’; ‘kamwe’ ni usemi wa asili na wazi wa Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, si cheo. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Maana ya kuumbuka katika אֵבוֹשָׁה
  choice: niaibishwe
  alternative: nione aibu
  rationale: Katika sala hii, neno linaweza kuhusisha kufedheheshwa au matumaini kuthibitishwa kuwa bure. ‘Niaibishwe’ hudumisha upande wa hadharani na wa kimahusiano bila kuufanya kuwa hisia ya ndani pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi bila kuwa kigumu. Muundo umewekwa mfupi ili kuhifadhi mkazo na usawaziko wa mstari wa Kiebrania.
