review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Yahweh as the addressee, the refuge imagery of חָסִיתִי, and the enduring force of לְעוֹלָם under negation. However, “usiruhusu niaibishwe” recasts the Hebrew first-person negative prayer as a request that Yahweh not permit an event, adding a causative/permission frame not explicitly present in אַל אֵבוֹשָׁה.
  naturalness: “Nimekukimbilia wewe” is understandable but marked and less idiomatic than “nimekimbilia kwako.” The revised wording is concise, natural Standard East African Swahili, and retains the elevated prayerful register.
  terminology: “Yahwe” is an appropriate Swahili transliteration of the Tetragrammaton. “Nisiaibishwe” suitably conveys the public disgrace/vindication dimension of בושׁ without reducing it to private embarrassment.
  issues:
  - severity: medium
    issue: The clause “usiruhusu niaibishwe” adds a permission construction.
    rationale: The Hebrew uses אַל with a first-person imperfect, a direct negative petition (“may I not be put to shame”); it does not explicitly say “do not allow [it].”
  - severity: low
    issue: “Nimekukimbilia wewe” is unnecessarily emphatic and stylistically awkward.
    rationale: The final “wewe” is not needed in natural Kiswahili. “Nimekimbilia kwako” expresses the metaphorical object of refuge clearly and idiomatically.
  revised_text: Ee Yahwe, nimekimbilia kwako; nisiaibishwe kamwe.
  revised_footnotes: []
  revision_rationale: The revision removes the added permission frame, uses an idiomatic Swahili expression for taking refuge, and preserves the Hebrew prayer’s compactness, shame/disgrace sense, and “never” force.
