  yaml_path: translation/ot/psalms/071/003.yaml
  text: Be for me a rock of refuge[a], to which I may always come; you have commanded salvation for me[b], for you are my crag and my fortress.
translation:
  language: sw
  text: Uwe kwangu mwamba wa kukimbilia[a], ambako naweza kuja daima; umeamuru kuniokoa[b], kwa maana wewe ni jabali langu na ngome yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
