lexical_decisions:
- source_word: הֱיֵה לִי
  choice: Uwe kwangu
  rationale: Kauli ya amri katika ombi la moja kwa moja kwa Mungu; “kwangu” huonyesha uhusiano na manufaa kwa mtunga zaburi kwa Kiswahili cha kawaida.
- source_word: לְצוּר מָעוֹן
  choice: mwamba wa kukimbilia
  rationale: צוּר inadumisha taswira ya mwamba, huku מָעוֹן katika muktadha wa ulinzi ikielezwa kwa njia ya asili kama mahali pa kukimbilia; maana halisi zaidi ya “makao” imehifadhiwa katika tanbihi.
- source_word: לָבוֹא תָּמִיד
  choice: ambao naweza kuujia daima
  rationale: Huwasilisha mwamba kama mahali ambapo mwombaji anaweza kufika wakati wote, kwa sarufi ya Kiswahili iliyo wazi.
- source_word: צִוִּיתָ לְהוֹשִׁיעֵנִי
  choice: umeamuru kuniokoa
  rationale: Huhifadhi kitenzi cha Kiebrania “umeamuru” na pia muundo wa moja kwa moja wa infinitivu “kuniokoa,” bila kubadili wokovu kuwa nomino milikishi.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha msingi wa ombi kwa mtindo wa heshima unaofaa zaburi na unaoeleweka kwa urahisi.
- source_word: סַלְעִי
  choice: jabali langu
  rationale: סֶלַע inaweza kumaanisha jabali au mwamba mkubwa; “jabali” huitofautisha na צוּר iliyotafsiriwa “mwamba” huku ikidumisha taswira ya ulinzi.
- source_word: וּמְצוּדָתִי
  choice: na ngome yangu
  rationale: מצודה humaanisha ngome au boma imara; “ngome” ni neno la kawaida na lenye nguvu katika Kiswahili.
theological_decisions:
- issue: Iwapo צִוִּיתָ לְהוֹשִׁיעֵנִי itafsiriwe kwa tafsiri laini ya “umekusudia kuniokoa” au kwa maana yenye nguvu ya amri ya Mungu
  choice: umeamuru kuniokoa
  alternative: umekusudia kuniokoa
  rationale: Kiebrania kinatumia wazi kitenzi “kuamuru.” Kukihifadhi kunaacha msisitizo wa mamlaka ya Mungu bila kuufungamanisha mstari na mfumo fulani wa kimadhehebu; tafsiri mbadala imewekwa tanbihini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Taswira tofauti za mwamba, jabali, na ngome zimehifadhiwa.
