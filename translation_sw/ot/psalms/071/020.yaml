  text: אֲשֶׁ֤ר הראית/נו צָר֥וֹת רַבּ֗וֹת וְ/רָ֫ע֥וֹת תָּשׁ֥וּב תחיי/נו וּֽ/מִ/תְּהֹמ֥וֹת הָ֝/אָ֗רֶץ תָּשׁ֥וּב תַּעֲלֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/020.yaml
  text: You[a], who have made us see many troubles and calamities, will return and revive us[d][c][b]; and from the depths of the earth you will return and bring me up.
translation:
  language: sw
  text: Wewe uliyetufanya tuone taabu nyingi na majanga mengi[a][b], utarudi kutuhuisha[c]; na utarudi kunipandisha kutoka vilindi vya ardhi[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “uliyetuonyesha.” Kitenzi cha Kiebrania kina umbo la kisababishi: “uliyetufanya tuone” au “uliyetuonyesha.”'
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinaweza kutafsiriwa pia “taabu nyingi na mabaya mengi.” Hapa “mabaya” ni majanga au mateso, si uovu wa kimaadili.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania hubadilika kutoka wingi kwenda umoja: “kutuhuisha ... kunipandisha.”'
    reason: textual_feature
  - marker: d
    text: “Vilindi vya ardhi” vinaweza kuwa taswira ya fedheha kali au kukaribia kifo, na pia vinaweza kukumbusha kushuka kaburini.
    reason: cultural_note
lexical_decisions:
- source_word: הראיתנו
  choice: uliyetufanya tuone
  rationale: Hifili ya ראה ina maana ya kusababisha kuona. Tafsiri hii huhifadhi wazi nguvu hiyo ya kisababishi; “uliyetuonyesha” ni mbadala wa asili zaidi lakini usio wazi kwa kiwango kilekile.
- source_word: צָרוֹת רַבּוֹת
  choice: taabu nyingi
  rationale: “Taabu” ni neno la kawaida na lenye hadhi linaloeleza dhiki au mateso, na רַבּוֹת hapa kwa kawaida huonyesha wingi.
- source_word: וְרָעוֹת
  choice: na majanga mengi
  rationale: Katika muktadha huu רָעוֹת ni mabaya yanayompata mtu—maafa au mateso—si uovu wa kimaadili. “Majanga” huwasilisha uzito wa madhara hayo bila kudokeza kwamba Mungu hutenda uovu wa kimaadili. Neno “mengi” limeeleweka kuwa linahusu nomino zote mbili katika jozi hiyo.
- source_word: תָּשׁוּב
  choice: utarudi
  rationale: Kitenzi שוב kimerudiwa mara mbili katika mstari. Kutafsiri kila tukio kwa “utarudi” huhifadhi urudiaji na muundo wa kishairi, badala ya kulainisha kuwa “tena” pekee.
- source_word: תְּחַיֵּנוּ
  choice: kutuhuisha
  rationale: Pieli ya חיה inaonyesha kurudishwa kwenye uhai au nguvu baada ya mateso makali. “Kutuhuisha” ni fupi, wazi, na yenye hadhi.
- source_word: וּמִתְּהוֹמוֹת הָאָרֶץ
  choice: kutoka vilindi vya ardhi
  rationale: תְּהוֹמוֹת hueleza vilindi au mashimo yenye kina. “Vilindi vya ardhi” huhifadhi taswira ya mahali pa chini sana bila kuifanya moja kwa moja kuwa kaburi au ufufuo.
- source_word: תַּעֲלֵנִי
  choice: kunipandisha
  rationale: Hifili ya עלה humaanisha kusababisha mtu apande. “Kunipandisha” hudumisha mwelekeo wa kwenda juu kutoka vilindini bila kubainisha ufufuo wa mwili.
- source_word: נו ... ני
  choice: tu- ... ni-
  rationale: Maandishi ya Kimasora hubadilika kutoka nafsi ya kwanza wingi katika “kutuhuisha” hadi nafsi ya kwanza umoja katika “kunipandisha.” Mabadiliko hayo yamehifadhiwa.
theological_decisions:
- issue: Iwapo רָעוֹת itafsiriwe kuwa uovu wa kimaadili au majanga yanayowapata watu
  choice: majanga yanayowapata watu
  alternative: mabaya; maafa
  rationale: Muktadha unahusu taabu ambazo mtunga zaburi amezipitia, si dai kwamba Mungu hutenda uovu wa kimaadili. “Majanga” huhifadhi ukali wa mateso bila kuingiza hitimisho hilo la kimaadili.
- issue: Iwapo “kutoka vilindi vya ardhi” ifanywe kuwa lugha ya wazi ya ufufuo
  choice: kuhifadhi taswira bila kuitafsiri moja kwa moja kuwa ufufuo
  alternative: utanifufua kutoka kaburini
  rationale: Taswira ya Kiebrania inaweza kueleza fedheha kali, kukaribia kifo, vilindi vinavyofanana na Sheoli, au kurejeshwa kutoka hali hiyo. Tafsiri haichagui maana moja ya kiteolojia kuliko nyingine.
- issue: Jinsi ya kuwasilisha kisababishi katika הראיתנו bila kuficha mvutano kuhusu utendaji wa Mungu
  choice: uliyetufanya tuone
  alternative: uliyetuonyesha; uliyetuwezesha kuona
  rationale: Kisababishi kiko wazi katika Kiebrania. Tafsiri kuu inakihifadhi badala ya kukibadili kuwa lugha ya kuruhusu tu, huku tanbihi ikitoa “uliyetuonyesha” kama uwezekano halali wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi urudiaji wa “utarudi” na mabadiliko ya viwakilishi kutoka “sisi” kwenda “mimi.” “Ardhi” limetumiwa badala ya “dunia” ili kudumisha taswira ya kina cha chini ya nchi bila kudokeza ulimwengu kwa ujumla.
