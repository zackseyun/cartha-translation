  text: I will come in the mighty deeds of the Lord GOD[a]; I will proclaim your righteousness[c][b], yours alone.
translation:
  language: sw
  text: Nitakuja kwa matendo ya uweza ya Bwana Yahweh[a]; nitatangaza[b] haki yako[c]—yako peke yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika matendo ya uweza ya Bwana Yahweh.” Kihusishi cha Kiebrania kinaweza kueleweka kwa maana ya njia/chombo au ya mahali/nyanja.
    reason: lexical_alternative
  - marker: b
    text: Au, “nitaitaja haki yako” au “nitasimulia haki yako.” Kitenzi cha Kiebrania kinaweza kumaanisha kutaja, kusimulia, au kutangaza.
    reason: lexical_alternative
  - marker: c
    text: “Haki yako” inaweza pia kueleweka kuwa “uadilifu wako” au, katika muktadha huu, “matendo yako ya haki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבוֹא
  choice: Nitakuja
  rationale: Qal isiyotimilika, nafsi ya kwanza umoja, ya בוא kimsingi humaanisha kuja, kwenda, au kuingia. “Nitakuja” huhifadhi umbo la msingi bila kuifafanua kupita kiasi nahau ya kishairi.
- source_word: בִּגְבֻרוֹת
  choice: kwa matendo ya uweza
  rationale: Wingi wa גְּבוּרָה unaweza kutaja nguvu au matendo yanayoonyesha nguvu. Katika muktadha wa matendo ya Mungu, “matendo ya uweza” ni ya asili na huhifadhi wazo la nguvu inayodhihirishwa; “kwa” pia huacha wazi matumizi ya kihusishi ב.
- source_word: אֲדֹנָי יְהוִה
  choice: Bwana Yahwe
  rationale: “Bwana” huwakilisha אֲדֹנָי, na “Yahwe” huhifadhi jina la agano יהוה badala ya kulibadilisha kuwa cheo kingine.
- source_word: אַזְכִּיר
  choice: nitatangaza
  rationale: Hiphil ya זכר inaweza kumaanisha kusababisha kukumbukwa, kutaja, kusimulia, au kutangaza. “Nitatangaza” inafaa kwa usemi wa hadharani wa mtunga zaburi bila kuondoa maana nyingine zinazowezekana.
- source_word: צִדְקָתְךָ
  choice: haki yako
  rationale: צדקה hujumuisha uadilifu, haki, na wakati mwingine matendo yanayodhihirisha haki. “Haki yako” ni usemi wa kawaida wa Kiswahili unaohifadhi upana huo.
- source_word: לְבַדֶּךָ
  choice: yako peke yake
  rationale: Neno hili linasisitiza upekee. Kurudia “yako” baada ya “haki yako” huonyesha wazi kwamba haki anayoitangaza mtunga zaburi ni ya Mungu peke yake.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה katika cheo cha pamoja אֲדֹנָי יְהוִה
  choice: Bwana Yahwe
  alternative: Bwana MUNGU; Bwana Mwenyezi
  rationale: Maandishi yana cheo אֲדֹנָי pamoja na jina binafsi יהוה. “Bwana Yahwe” hutofautisha cheo na jina na huepuka kulibadilisha jina kuwa cheo kingine.
- issue: Maana ya צִדְקָתְךָ katika muktadha
  choice: haki yako
  alternative: uadilifu wako; matendo yako ya haki
  rationale: “Haki” huhifadhi mvutano kati ya sifa ya Mungu, hukumu yake ya haki, na matendo yake ya haki, bila kuchagua maana moja pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. “Matendo ya uweza” ni rahisi kueleweka kuliko tafsiri halisi ya wingi wa “nguvu,” huku “haki” ikihifadhi upana wa maana ya neno la Kiebrania. Alama zote za tanbihi zimewekwa moja kwa moja katika mstari.
