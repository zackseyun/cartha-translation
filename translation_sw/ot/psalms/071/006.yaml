base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/006.yaml
  text: Upon you I have leaned from the womb; from my mother’s inward parts you are the one who brought me out[a]. In you is my praise continually.
translation:
  language: sw
  text: Nimekutegemea tangu tumboni; tangu ndani ya tumbo la mama yangu, wewe ndiye uliyenitoa[a]. Sifa yangu ni kwako daima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa usemi laini zaidi, “tangu tumboni mwa mama yangu, wewe ndiye uliyenitoa.” Kiebrania hapa kinatumia neno tofauti na lile la kishazi kilichotangulia; kihalisi ni “tangu sehemu za ndani za mama yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיךָ נִסְמַכְתִּי
  choice: Nimekutegemea
  rationale: Kitenzi סמך katika Niphal pamoja na עַל kinaonyesha kumtegemea au kuegemea Mungu. Kiswahili ‘nimekutegemea’ ni cha kawaida na huhifadhi maana ya utegemezi, ingawa taswira halisi ya kuegemea haijasisitizwa.
- source_word: מִבֶּטֶן
  choice: tangu tumboni
  rationale: בטן humaanisha tumbo au tumbo la uzazi; katika muktadha huu ‘tangu tumboni’ ni usemi wa asili unaohifadhi taswira ya kabla ya kuzaliwa.
- source_word: מִמְּעֵי אִמִּי
  choice: tangu viungo vya ndani vya mama yangu
  rationale: מֵעֶה hurejelea viungo vya ndani. Tafsiri hii inadumisha tofauti ya msamiati kati yake na בטן iliyotangulia, huku tanbihi ikitoa usemi laini zaidi.
- source_word: אַתָּה
  choice: wewe ndiye
  rationale: Kiwakilishi huru kina mkazo; ‘wewe ndiye’ huonyesha mkazo huo kwa Kiswahili cha kawaida.
- source_word: גוֹזִי
  choice: uliyenitoa
  rationale: Katika muktadha wa kuzaliwa, neno hili linaeleweka kuwa kumtoa mtoto tumboni au kumwezesha azaliwe. ‘Uliyenitoa’ huhifadhi taswira hiyo bila kuongeza dhana pana ya ukombozi.
- source_word: בְּךָ תְהִלָּתִי
  choice: Sifa yangu iko kwako
  rationale: בְּךָ ni usemi mfupi ambao unaweza kuonyesha mahali, mwelekeo, au kitu kinachohusika na sifa. ‘Iko kwako’ ni Kiswahili cha asili kinachodumisha kwa kiasi fulani ufupi na utata huo.
- source_word: תָמִיד
  choice: daima
  rationale: תמיד huonyesha mwendelezo usiokoma; ‘daima’ ni neno la kawaida, lenye hadhi, na linalofaa ushairi.
theological_decisions:
- issue: Utendaji wa Mungu katika taswira ya kuzaliwa
  choice: Mungu anaelezwa kuwa ndiye aliyemtoa mtunga zaburi kutoka ndani ya mama yake.
  alternative: Mungu alimtegemeza tangu kuzaliwa bila msisitizo maalumu kwamba ndiye aliyemtoa tumboni.
  rationale: Muktadha na umbo la kirai cha Kiebrania vinaelekeza kwenye utendaji wa Mungu wakati wa kuzaliwa. Tafsiri inadumisha taswira hiyo bila kuingiza madai ya kimafundisho yaliyo nje ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo ‘wewe ndiye’ huhifadhi mkazo wa Kiebrania; tanbihi huhifadhi tofauti ya maneno ya asili bila kuufanya mstari mkuu kuwa mzito kupita kiasi.
