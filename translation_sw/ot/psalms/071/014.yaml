base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/014.yaml
  text: But as for me[a], I will continually hope[c][b], and I will add to all your praise.
translation:
  language: sw
  text: Lakini mimi nitatumaini daima,[a] nami nitazidi kukusifu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitaendelea kutumaini,” au “nitaendelea kungoja kwa tumaini.” Kitenzi cha Kiebrania kinaweza kusisitiza matarajio yanayoendelea, si tumaini la wakati ujao tu.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “nami nitaongeza juu ya sifa zako zote.” Nahau hiyo inaonyesha kuongeza au kuzidisha sifa anazopewa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Lakini mimi
  rationale: Kiunganishi pamoja na kiwakilishi huru huonyesha utofautishaji na kumkazia msemaji; “Lakini mimi” ni ya kawaida na huhifadhi msisitizo huo.
- source_word: תָּמִיד
  choice: daima
  rationale: Kielezi hiki huonyesha mwendelezo usiokoma; “daima” ni fupi, ya asili, na yenye hadhi katika Kiswahili.
- source_word: אֲיַחֵל
  choice: nitatumaini
  rationale: Kitenzi יחל katika piel huonyesha kutumaini au kungoja kwa matarajio. “Nitatumaini” huhifadhi maana kuu bila kuamua kimya kimya kati ya tumaini na kungoja kwa matumaini.
- source_word: וְהוֹסַפְתִּי עַל כָּל תְּהִלָּתֶךָ
  choice: nami nitazidi kukusifu
  rationale: Nahau ya Kiebrania, kwa maana ya kuongeza juu ya sifa zote za Mungu, inaelezwa kwa Kiswahili cha kawaida kama kuendelea au kuzidi kumsifu. Hii huepuka usemi usio wa kawaida “kuongeza kwa sifa zako” huku tanbihi ikihifadhi picha halisi ya Kiebrania.
