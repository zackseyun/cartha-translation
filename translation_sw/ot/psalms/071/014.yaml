  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi kuu imetafsiriwa kwa ulinganifu mwafaka: ni rahisi kueleweka kwa msomaji wa kawaida, huku tanbihi zikihifadhi maana mbadala ya יחל na picha ya nahau וְהוֹסַפְתִּי עַל.'
