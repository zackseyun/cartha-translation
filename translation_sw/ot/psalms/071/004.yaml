translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kishairi wenye vipashio sambamba umehifadhiwa. “Mkononi mwa” huhifadhi taswira ya Kiebrania, na “makucha ya” huwasilisha kwa kawaida maana ya mshiko au udhibiti.
