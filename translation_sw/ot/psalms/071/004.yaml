  text: Mungu wangu, uniokoe kutoka mkononi mwa mwovu, kutoka katika kiganja cha mtu dhalimu na mkatili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Ni nomino yenye kiambishi cha nafsi ya kwanza umoja, ikitumika hapa kama mwito wa moja kwa moja; “Mungu wangu” ni Kiswahili cha kawaida na chenye heshima.
- source_word: פַּלְּטֵנִי
  choice: uniokoe
  rationale: Ombi hili lina maana ya kumtoa mtu katika hatari au mamlaka ya adui; “uniokoe” ni ya asili na inaeleweka kwa urahisi katika muktadha huu.
- source_word: מִיַּד
  choice: kutoka mkononi mwa
  rationale: Neno יד ni “mkono” na hapa ni taswira ya mamlaka au udhibiti. Kiswahili “mkononi mwa” huhifadhi taswira hiyo na maana yake ya kimethali.
- source_word: רָשָׁע
  choice: mwovu
  rationale: Kivumishi hiki kimetumika kama nomino kumtaja mtu mwovu; “mwovu” huhifadhi umoja na maana ya kimaadili.
- source_word: מִכַּף
  choice: kutoka katika makucha ya
  rationale: כף kimsingi ni kiganja, lakini hapa humaanisha mshiko au udhibiti. “Makucha ya” ni nahau ya Kiswahili inayoonyesha kuwa chini ya mamlaka yenye kudhuru, huku ikitofautisha taswira na “mkononi mwa.”
- source_word: מְעַוֵּל
  choice: mtu asiye haki
  rationale: Ni umbo linalomtaja atendaye yasiyo ya haki. Kauli hii ni ya wazi na huhifadhi uzito wa kimaadili na kisheria.
- source_word: וְחוֹמֵץ
  choice: na mkatili
  rationale: Neno hili humweleza mtu mwenye ukatili, jeuri, au uonevu. “Mkatili” ni la kawaida na linafaa kama sifa ya mtu yuleyule aliyetajwa katika kishazi.
