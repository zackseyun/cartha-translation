  text: May you increase my greatness and comfort me again[a][b][c].
translation:
  language: sw
  text: Uongeze ukuu wangu[a], na unigeukie tena ili unifariji[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Utaongeza ukuu wangu.” Kiebrania, “ukuu wangu”; neno hilo linaweza pia kumaanisha hadhi au heshima, si ukubwa pekee.
    reason: alternative_reading
  - marker: b
    text: Kihalisi, “na ugeuke na kunifariji.” Vitenzi vya Kiebrania vinaweza kueleweka kama kauli za wakati ujao au kama ombi katika ushairi. “Ugeuke” huenda ikimaanisha kumgeukia tena mwombaji ili kumfariji.
    reason: alternative_reading; lexical_alternative
lexical_decisions:
- source_word: תֶּרֶב
  choice: Na uongeze
  rationale: Hifili ya רבה humaanisha kufanya kuwa kubwa au kuongeza. Katika muktadha huu wa kishairi, hali ya kitenzi inaweza kueleza ombi au tumaini la wakati ujao; “na uongeze” huwasilisha ombi kwa Kiswahili cha kawaida.
- source_word: גְּדֻלָּתִי
  choice: heshima yangu
  rationale: Nomino גְּדוּלָּה inaweza kumaanisha ukuu, hadhi, au heshima. “Heshima yangu” ni ya asili zaidi kwa mtu anayezungumza hapa, huku tanbihi ikihifadhi maana ya moja kwa moja ya “ukuu wangu.”
- source_word: וְתִסֹּב
  choice: na ugeuke tena
  rationale: Kitenzi סבב kimsingi humaanisha kugeuka au kuzunguka. Hapa kinaelekea kuonyesha kumgeukia tena mwombaji ili kumfariji; “ugeuke tena” huhifadhi taswira hiyo.
- source_word: תְּנַחֲמֵנִי
  choice: kunifariji
  rationale: Pieli ya נחם hapa humaanisha kufariji au kutuliza moyo. “Kunifariji” ni lugha ya kawaida, yenye staha, na inafaa katika muktadha wa zaburi.
theological_decisions:
- issue: Hali ya vitenzi vya Kiebrania
  choice: 'Vimetafsiriwa kama ombi: “Na uongeze ... na ugeuke.”'
  alternative: 'Vinaweza kutafsiriwa kama kauli ya tumaini la wakati ujao: “Utaongeza ... nawe utageuka.”'
  rationale: Vitenzi vya hali isiyotimilika katika ushairi wa Kiebrania vinaweza kuwa ombi au kauli ya wakati ujao. Muktadha wa sala unaunga mkono ombi, lakini tanbihi inalinda uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Tafsiri imetumia “heshima” badala ya “ukuu” katika mstari mkuu kwa ufasaha wa kawaida, huku maana halisi ikihifadhiwa katika tanbihi. Muundo wa ombi umechaguliwa bila kuficha uwezekano wa kauli ya wakati ujao.
