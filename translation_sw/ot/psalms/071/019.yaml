  text: וְ/צִדְקָתְ/ךָ֥ אֱלֹהִ֗ים עַד מָ֫ר֥וֹם אֲשֶׁר עָשִׂ֥יתָ גְדֹל֑וֹת אֱ֝לֹהִ֗ים מִ֣י כָמֽוֹ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/019.yaml
  text: And your righteousness[a], O God, reaches to the heights—you who have done great things. O God[b], who is like you?
translation:
  language: sw
  text: Na haki yako[a], Ee Mungu, hufika juu sana[b]—wewe uliyefanya mambo makuu. Ee Mungu, ni nani aliye kama wewe?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uadilifu wako.” Neno la Kiebrania צדקה linaweza kumaanisha haki, uadilifu, au kutenda kwa haki kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au, “hufika mbinguni.” Kirai cha Kiebrania kihalisi ni “mpaka juu” au “mpaka mahali pa juu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/צִדְקָתְ/ךָ
  choice: Na haki yako
  rationale: Neno צדקה linaweza kumaanisha haki, uadilifu, au kutenda kwa haki. Katika sifa hii pana ya tabia na matendo ya Mungu, “haki yako” ni ya asili katika Kiswahili na inadumisha upana wa maana; “uadilifu wako” ni uwezekano mwingine.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Hapa jina linatumika kama mwito wa moja kwa moja. “Ee Mungu” huwasilisha hali hiyo kwa Kiswahili cha kishairi kinachoeleweka, na inafaa pia katika kurudiwa kwake mwishoni mwa mstari.
- source_word: עַד מָרוֹם
  choice: hufika juu sana
  rationale: Kirai hiki kihalisi kinaelekeza ‘mpaka juu/mahali pa juu.’ Tafsiri hii inahifadhi taswira ya kufika juu bila kuamua kimya kimya kwamba מָרוֹם lazima iwe ‘mbinguni.’
- source_word: אֲשֶׁר עָשִׂיתָ גְדֹלוֹת
  choice: wewe uliyefanya mambo makuu
  rationale: אֲשֶׁר inaanzisha kishazi rejeshi. “Wewe uliyefanya mambo makuu” hudumisha uhusiano huo wa kisarufi na mwito unaotangulia badala ya kuugeuza kuwa sababu iliyo wazi zaidi kuliko Kiebrania.
- source_word: גְדֹלוֹת
  choice: mambo makuu
  rationale: Kivumishi cha wingi kinatumika kama nomino na kina maana pana ya mambo au matendo makuu. “Mambo makuu” ni Kiswahili cha kawaida na hakibani maana kuwa matendo pekee.
- source_word: מִי כָמוֹךָ
  choice: ni nani aliye kama wewe?
  rationale: Hili ni swali la balagha linalotangaza kwamba Mungu hana kifani. Tafsiri hii ni ya moja kwa moja, ya asili, na inadumisha nguvu ya swali.
theological_decisions:
- issue: Maana ya צדקה inaposemwa kuhusu Mungu
  choice: haki
  alternative: uadilifu; kutenda kwa haki
  rationale: Muktadha unasifu kwa upana ukamilifu wa Mungu na mambo makuu aliyofanya, si hukumu zake za kimahakama pekee. “Haki” huhifadhi upana huo, huku mbadala unaowezekana ukiwekwa katika tanbihi.
- issue: Mahali panapodokezwa na מָרוֹם
  choice: juu sana
  alternative: mbinguni
  rationale: Kiebrania kinataja urefu au mahali pa juu bila kulazimisha neno mahsusi la ‘mbingu.’ Tafsiri kuu inahifadhi utata huo wa kishairi, na usomaji unaowezekana wa ‘mbinguni’ umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Ee Mungu” inadumisha mwito wa moja kwa moja; “juu sana” ni ya asili na huhifadhi taswira ya Kiebrania bila kuifafanua kupita kiasi.
