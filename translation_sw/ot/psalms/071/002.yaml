  yaml_path: translation/ot/psalms/071/002.yaml
  text: In your righteousness rescue me and deliver me[a]; incline your ear to me and save me.
translation:
  language: sw
  text: Kwa haki yako, uniokoe na uninasue[a]; uinamishe sikio lako kwangu, uniokoe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Katika haki yako”; “haki” pia inaweza kumaanisha “uadilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצִדְקָתְךָ
  choice: Kwa haki yako
  rationale: Kiambishi בְּ kinaweza kuonyesha njia au msingi wa tendo; “kwa” kinahifadhi uwezekano huo. “Haki” katika Kiswahili inaweza kurejelea uadilifu wa Mungu na pia kutenda kwake kwa haki.
- source_word: תַּצִּילֵנִי
  choice: uniokoe
  rationale: Hifili ya נצל humaanisha kumwokoa mtu kutoka hatarini; “uniokoe” ni ya kawaida na ya moja kwa moja.
- source_word: וּתְפַלְּטֵנִי
  choice: na kuniponya
  rationale: Pieli ya פלט hubeba wazo la kumwezesha mtu kuponyoka au kumtoa salama. “Kuniponya” hapa ni kwa maana ya kuninusuru, na inatofautisha kitenzi hiki na נצל huku ikihifadhi usambamba wa kishairi.
- source_word: הַטֵּה
  choice: uinamishe
  rationale: Amri ya נטה pamoja na “sikio” ni sitiari ya kusikiliza kwa makini. “Uinamishe” inahifadhi picha halisi ya Kiebrania.
- source_word: אָזְנְךָ
  choice: sikio lako
  rationale: Nomino halisi “sikio” imehifadhiwa kwa kuwa taswira hiyo ni ya asili na inaeleweka katika ushairi wa Kiswahili.
- source_word: וְהוֹשִׁיעֵנִי
  choice: uniokoe
  rationale: Hifili ya ישׁע ina maana ya kuokoa. Kurudia “uniokoe” kunafuata maana pana ya mzizi bila kuingiza wazo la ushindi ambalo muktadha haulazimishi.
theological_decisions:
- issue: Maana ya צְדָקָה katika ombi linaloelekezwa kwa Mungu
  choice: haki
  alternative: uadilifu
  rationale: “Haki” ni neno pana la Kiswahili linaloweza kujumuisha tabia nyofu ya Mungu na matendo yake ya haki, hivyo halibani maana kuwa hukumu ya kimahakama pekee. Tanbihi inahifadhi uwezekano wa kuelewa neno hilo kama uadilifu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Taswira ya kuinamisha sikio imehifadhiwa, na maneno ya wokovu yamewekwa kwa mtiririko wa asili.
