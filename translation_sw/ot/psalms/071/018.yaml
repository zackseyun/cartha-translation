  text: וְ/גַ֤ם עַד זִקְנָ֨ה וְ/שֵׂיבָה֮ אֱלֹהִ֪ים אַֽל תַּעַ֫זְבֵ֥/נִי עַד אַגִּ֣יד זְרוֹעֲ/ךָ֣ לְ/ד֑וֹר לְ/כָל יָ֝ב֗וֹא גְּבוּרָתֶֽ/ךָ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/018.yaml
  text: Even to old age and gray hairs[a], O God, do not forsake me, until I declare your arm to the next generation[b], your might to everyone who is to come.
translation:
  language: sw
  text: Hata nitakapokuwa mzee na mwenye mvi, Ee Mungu, usiniache, mpaka niutangaze mkono wako[a] kwa kizazi kijacho, na uweza wako kwa wote watakaokuja[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nguvu yako” au “uweza wako.” Kiebrania kinahifadhi taswira ya mkono wa Mungu kama nguvu yake inayotenda.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa vizazi vyote vijavyo.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם עַד זִקְנָה וְשֵׂיבָה
  choice: Hata nitakapokuwa mzee na mwenye mvi
  rationale: Neno “hata” linaonyesha mwendelezo wenye msisitizo, na usemi huu wa Kiswahili unawasilisha kwa kawaida hatua ya kufikia uzee huku ukihifadhi taswira halisi ya mvi.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Hili ni tamko la moja kwa moja kwa Mungu katika sala; “Ee Mungu” linafaa kwa lugha ya heshima ya zaburi.
- source_word: אַל תַּעַזְבֵנִי
  choice: usiniache
  rationale: Kitenzi kinaweza kumaanisha kuacha au kutupa; “usiniache” ni cha kawaida, chenye uzito wa ombi, bila kuongeza maana isiyokuwapo.
- source_word: עַד אַגִּיד
  choice: mpaka niutangaze
  rationale: Muundo huu unaonyesha kuendelea kwa msaada wa Mungu hadi mtunga-zaburi atoe ushuhuda wake; “kutangaza” linafaa kwa habari inayotolewa hadharani.
- source_word: זְרוֹעֲךָ
  choice: mkono wako
  rationale: Maana halisi ni “mkono,” taswira ya Kiebrania ya nguvu ya Mungu inayotenda. Taswira hiyo imehifadhiwa badala ya kufasiriwa moja kwa moja kuwa nguvu.
- source_word: לְדוֹר
  choice: kwa kizazi kijacho
  rationale: Katika muktadha, neno la umoja “kizazi” linaelekea kwa kizazi kinachofuata cha mtunga-zaburi.
- source_word: לְכָל יָבוֹא
  choice: kwa wote watakaokuja
  rationale: Kauli hii ya jumla inaelekeza kwa watu wote wa wakati ujao na kuhifadhi upanuzi wa wazo baada ya kutajwa kwa kizazi kijacho.
- source_word: גְּבוּרָתֶךָ
  choice: uweza wako
  rationale: Neno linaweza kumaanisha nguvu, uweza, au matendo makuu. “Uweza” huhifadhi maana pana ya sifa na utendaji bila kurudia neno “nguvu.”
theological_decisions:
- issue: Kuhifadhi au kufafanua taswira ya זְרוֹעֲךָ
  choice: Kuhifadhi “mkono wako” katika matini kuu
  alternative: “nguvu zako” au “uweza wako”
  rationale: Kiebrania kinatumia lugha ya mwili kuonyesha nguvu ya Mungu inayotenda. Kuihifadhi taswira hiyo kunadumisha ushairi na mvutano wa kitheolojia wa matini, huku tanbihi ikifafanua maana yake.
- issue: Upeo wa hadhira ya wakati ujao katika לְדוֹר ... לְכָל יָבוֹא
  choice: Kutofautisha “kizazi kijacho” na “wote watakaokuja”
  alternative: “kwa vizazi vyote vijavyo”
  rationale: Kauli inaonekana kusonga kutoka kizazi kimoja kinachofuata hadi kundi pana la wote wa wakati ujao. Tofauti hiyo imehifadhiwa badala ya kuunganisha vipashio vyote kuwa wazo moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sala ni wa heshima, wa sasa, na unaoeleweka kwa wasomaji wa kawaida. Mpangilio umewekwa kuwa wa kawaida katika Kiswahili huku usambamba wa kishairi na taswira ya Kiebrania vikihifadhiwa.
