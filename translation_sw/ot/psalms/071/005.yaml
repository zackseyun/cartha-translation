lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huonyesha sababu au msingi wa ombi linalozunguka mstari huu, kwa mtiririko wa kawaida wa Kiswahili.
- source_word: אַתָּה
  choice: wewe ndiwe
  rationale: Kiwakilishi kimetajwa wazi na kwa msisitizo katika Kiebrania; “wewe ndiwe” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: תִקְוָתִי
  choice: tumaini langu
  rationale: Neno hilo humaanisha tumaini au matarajio; “tumaini langu” ni la kawaida na linafaa katika sala hii.
- source_word: אֲדֹנָי יְהוִה
  choice: Bwana Yahwe
  rationale: Huhifadhi cheo אֲדֹנָי (“Bwana”) na kulitaja jina la Mungu יהוה (“Yahwe”) bila kuvichanganya kuwa cheo kimoja.
- source_word: מִבְטַחִי
  choice: tegemeo langu
  rationale: Nomino hii hueleza yule au kile kinachotegemewa kwa usalama; “tegemeo langu” ni ya asili na huepuka kurudia tu “tumaini langu.”
- source_word: מִנְּעוּרָי
  choice: tangu ujana wangu
  rationale: Kiambishi מן kinaonyesha mwanzo wa kipindi kinachoendelea; “tangu ujana wangu” hutoa maana hiyo kwa uwazi.
theological_decisions:
- issue: Kutafsiri jina יהוה likiwa pamoja na cheo אֲדֹנָי
  choice: Bwana Yahwe
  alternative: Bwana MUNGU; Bwana BWANA
  rationale: Kiebrania kina cheo na jina la agano kwa pamoja. “Bwana Yahwe” hutofautisha vipengele hivyo viwili na kuepuka kuficha jina ndani ya cheo, bila kuongeza fundisho lisilokuwamo katika maandishi.
- issue: Uhusiano kati ya tumaini na tegemeo
  choice: tumaini langu … tegemeo langu
  alternative: tumaini langu … imani yangu
  rationale: Maneno mawili ya Kiebrania yanahusiana lakini si sawa kabisa. Tafsiri iliyochaguliwa huhifadhi uwiano huo bila kuyafanya kuwa madai mawili yanayofanana kabisa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Wewe ndiwe” huhifadhi msisitizo wa kiwakilishi cha Kiebrania; “tegemeo” ni la sasa na la kawaida bila kuwa la kimadhehebu.
