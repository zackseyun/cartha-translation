  yaml_path: translation/ot/psalms/071/015.yaml
  text: My mouth will recount your righteousness and your salvation all day long[b][a], for I do not know their number.
translation:
  language: sw
  text: Kinywa changu kitasimulia haki yako na wokovu wako siku nzima[a][b], kwa maana sijui idadi yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uadilifu wako” au “matendo yako ya haki.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, mtunga-zaburi anasema kuwa matendo ya Mungu ya haki na ya kuokoa ni mengi mno asiweze kuyahesabu.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: Kinywa changu
  rationale: Muundo halisi wa Kiebrania unadumishwa kwa kuwa unakazia kinywa kama chombo cha kutangaza sifa.
- source_word: יְסַפֵּר
  choice: kitasimulia
  rationale: Kauli ya piel ya ספר hapa ina maana ya kueleza au kusimulia kwa kina; pia inadumisha mwangwi wa kuhesabu unaojitokeza mwishoni mwa mstari.
- source_word: צִדְקָתֶךָ
  choice: haki yako
  rationale: “Haki” ni tafsiri ya kawaida na pana ya צדקה, ikihifadhi maana ya tabia ya Mungu iliyo sawa na matendo yake ya uaminifu bila kuibana kuwa matendo pekee.
- source_word: כָּל הַיּוֹם
  choice: mchana kutwa
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kipindi chote cha siku na mwendelezo wa kutangaza.
- source_word: תְּשׁוּעָתֶךָ
  choice: wokovu wako
  rationale: “Wokovu” hudumisha maana pana ya kuokoa au kukomboa katika muktadha wa sifa.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinaonyesha sababu ya kusimulia bila kukoma.
- source_word: לֹא יָדַעְתִּי
  choice: sijui
  rationale: Ingawa kitenzi cha Kiebrania kina umbo la wakati timilifu, katika muktadha kinaeleza hali ya sasa ya kutoweza kujua au kubainisha idadi.
- source_word: סְפֹרוֹת
  choice: idadi yake
  rationale: Neno la wingi linalotokana na ספר linahusu hesabu au idadi; Kiswahili cha kawaida “idadi yake” kinaeleza kwa ufupi kuwa mambo yanayotajwa hayawezi kuhesabika.
theological_decisions:
- issue: Iwapo צִדְקָתֶךָ itafsiriwe kama sifa dhahania au matendo halisi ya Mungu
  choice: haki yako
  alternative: matendo yako ya haki; hukumu yako ya haki
  rationale: Nomino ya Kiebrania iko katika umoja na kwa asili inaweza kumaanisha “haki,” huku katika Zaburi haki hiyo ikijidhihirisha pia katika matendo ya Mungu ya kuokoa. Tafsiri kuu inadumisha mvutano huo, na maana halisi zaidi inawekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Kinywa changu” huhifadhi taswira ya Kiebrania, na “mchana kutwa” hutoa mtiririko wa kawaida wa Kiswahili.
