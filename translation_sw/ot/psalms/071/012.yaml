  text: אֱ֭לֹהִים אַל תִּרְחַ֣ק מִמֶּ֑/נִּי אֱ֝לֹהַ֗/י לְ/עֶזְרָ֥תִ/י חיש/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/012.yaml
  text: God[a], do not be far from me; my God, hurry to help me.
translation:
  language: sw
  text: Ee Mungu, usiwe mbali nami; Mungu wangu, fanya haraka kunisaidia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Nomino hii inatumika kama mwito wa moja kwa moja. Katika Kiswahili cha kawaida na chenye hadhi, “Ee Mungu” huonyesha wazi mwito bila kuwa ya kizamani.
- source_word: אַל
  choice: usiwe
  rationale: 'Kipashio cha kukataza pamoja na kitenzi kinawasilishwa kama ombi la moja kwa moja: “usiwe.”'
- source_word: תִּרְחַק
  choice: mbali
  rationale: Mzizi רחק una maana ya kuwa au kwenda mbali. “Usiwe mbali” huhifadhi taswira ya nafasi na uhusiano kwa Kiswahili cha kawaida.
- source_word: מִמֶּנִּי
  choice: nami
  rationale: Katika muundo “usiwe mbali nami,” kiambishi “nami” huwasilisha kwa kawaida maana ya kutokuwa mbali na msemaji.
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Umbo lenye kiambishi cha nafsi ya kwanza umoja linaonyesha umilikaji na utegemezi wa kibinafsi katika mwito.
- source_word: לְעֶזְרָתִי
  choice: kunisaidia
  rationale: Kihalisi ni “kwa ajili ya msaada wangu”; baada ya amri ya kuharakisha, “kunisaidia” ni Kiswahili cha asili kinachohifadhi kusudi hilo.
- source_word: חִישָׁה
  choice: fanya haraka
  rationale: Amri hii ina maana ya kuharakisha. “Fanya haraka” ni ya sasa, wazi, na haiongezi kitenzi cha kuja ambacho hakijaelezwa moja kwa moja katika Kiebrania.
theological_decisions:
- issue: Kurudia majina ya Mungu katika mwito wa moja kwa moja
  choice: Ee Mungu ... Mungu wangu
  alternative: Mungu ... Mungu wangu
  rationale: Kiebrania kinatumia majina yote mawili kama mwito. “Ee” katika mwito wa kwanza huweka wazi hali ya sala, huku kurudiwa kwa “Mungu wangu” kukihifadhi msisitizo wa utegemezi wa kibinafsi bila kuongeza fundisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima, na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa vipashio na urudiaji wa jina la Mungu umehifadhiwa; lugha ya kizamani imeepukwa.
