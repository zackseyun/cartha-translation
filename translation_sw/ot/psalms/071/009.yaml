    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשְׁלִיכֵנִי
  choice: usinitupe
  rationale: Kitenzi katika Hifili kina wazo la kumtupa mtu mbali au kumkataa. “Usinitupe” kinahifadhi taswira hiyo kwa Kiswahili cha kawaida na chenye uzito wa sala.
- source_word: לְעֵת זִקְנָה
  choice: wakati wa uzee
  rationale: Tafsiri hii inawakilisha עֵת, “wakati/majira,” pamoja na זִקְנָה, “uzee,” bila kuufupisha mno usemi wa Kiebrania.
- source_word: כִּכְלוֹת
  choice: zinapoisha
  rationale: Muundo huu unaonyesha hali ya wakati ambapo nguvu zinafikia mwisho au kutoweka; “zinapoisha” ni ya asili na inahifadhi wazo la kudhoofika kabisa.
- source_word: כֹּחִי
  choice: nguvu zangu
  rationale: Katika muktadha wa uzee, “nguvu zangu” ndiyo tafsiri ya kawaida na inayofaa zaidi ya כֹּחַ.
- source_word: תַּעַזְבֵנִי
  choice: usiniache
  rationale: עזב inaweza kumaanisha kuacha au kutelekeza. “Usiniache” ni ya asili katika sala na haiingizi maana ya ziada.
- source_word: אַל
  choice: usi-
  rationale: אַל pamoja na umbo la kitenzi hapa ni ombi la kukataza lenye msisitizo; kiambishi cha kukataa “usi-” ndicho kisawe wazi cha Kiswahili.
theological_decisions:
- issue: Hali ya ombi kuhusu uzee na uwepo wa Mungu
  choice: Ombi la moja kwa moja kwamba Mungu asimtupilie mbali wala kumwacha mwombaji anapodhoofika uzeeni
  alternative: Malalamiko ya jumla kuhusu mateso yasiyosisitiza hasa uzee
  rationale: Mstari unataja wazi wakati wa uzee na kuisha kwa nguvu. Tafsiri inadumisha utegemezi huo kwa Mungu bila kuongeza dai la kimafundisho lisilosemwa na maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala. Muundo wa mistari miwili na marudio ya ombi hasi umehifadhiwa; lugha ni wazi kwa msomaji wa kawaida bila kupoteza uzito wa zaburi.
