base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/009.yaml
  text: Do not cast me off in the time of old age[a]; when my strength fails[c][b], do not forsake me.
translation:
  language: sw
  text: Usinitupe wakati wa uzee[a]; nguvu zangu zinapoisha[b], usiniache[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “usinitupe mbali.” Kitenzi cha Kiebrania kinaweza kumaanisha kumtupa mtu mbali au kumkataa.
    reason: lexical_alternative
  - marker: b
    text: Au “nguvu zangu zinapokwisha kabisa.”
    reason: lexical_alternative
  - marker: c
