  text: כְּ֭/מוֹפֵת הָיִ֣יתִי לְ/רַבִּ֑ים וְ֝/אַתָּ֗ה מַֽחֲסִ/י עֹֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/007.yaml
  text: I have become like a portent to many[a], but you are my strong refuge.
translation:
  language: sw
  text: Nimekuwa kama ishara ya ajabu kwa wengi[a], lakini wewe ndiwe kimbilio langu imara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ishara,” “ajabu,” au “kitu cha kushangaza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹפֵת
  choice: kama ishara ya ajabu
  rationale: מוֹפֵת humaanisha ishara, ajabu, au jambo linalowashangaza watazamaji. “Ishara ya ajabu” inawakilisha kiambishi כְּ (“kama”) na inadumisha maana pana bila kuamua kwamba ishara hiyo ni njema au ya kutisha.
- source_word: הָיִיתִי
  choice: Nimekuwa
  rationale: Kauli hii ya wakati uliotimia inaeleweka hapa kama hali iliyoanza kabla na inayoendelea wakati wa usemi; “nimekuwa” ni ya asili katika Kiswahili na inadumisha maana hiyo.
- source_word: לְרַבִּים
  choice: kwa wengi
  rationale: Kiambishi לְ kinaonyesha watu ambao machoni pao mtunga zaburi amekuwa ishara; “kwa wengi” ni tafsiri ya kawaida na wazi.
- source_word: מַחֲסִי
  choice: kimbilio langu
  rationale: מַחֲסֶה ni mahali pa usalama au hifadhi. “Kimbilio langu” ni usemi mfupi, wa kawaida, na unaodumisha sitiari ya Mungu kuwa ulinzi.
- source_word: עֹז
  choice: imara
  rationale: עֹז humaanisha nguvu au uwezo. Katika muundo wa “kimbilio langu la nguvu,” Kiswahili cha asili hutumia kivumishi “imara,” ambacho kinadumisha wazo la kimbilio lenye nguvu.
theological_decisions:
- issue: Maana pana ya מוֹפֵת kuhusu hali ya mtunga zaburi mbele ya watu
  choice: Mtunga zaburi amekuwa ishara ya ajabu inayowashangaza wengi, bila kubainisha kama ni ya kutisha, ya kuvutia, au ya kustaajabisha tu.
  alternative: Kauli hiyo inaweza kumaanisha kwamba amekuwa ajabu njema, ishara ya kuonya, au kitu cha kushangaza machoni pa wengi.
  rationale: Neno la Kiebrania lina maana kadhaa zinazokaribiana. Matini kuu pamoja na tanbihi zinadumisha mvutano huo badala ya kuchagua upande mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. “Lakini” linaonyesha utofautishaji unaodokezwa na וְ katika muktadha, na “wewe ndiwe” linadumisha mkazo wa kiwakilishi אַתָּה.
