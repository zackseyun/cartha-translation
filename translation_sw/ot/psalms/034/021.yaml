source:
  edition: WLC
  text: תְּמוֹתֵ֣ת רָשָׁ֣ע רָעָ֑ה וְ/שֹׂנְאֵ֖י צַדִּ֣יק יֶאְשָֽׁמוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/021.yaml
  text: Evil will put the wicked to death[a], and those who hate the righteous will be held guilty.
translation:
  language: sw
  text: 'Uovu utamwua mwovu[a],

    nao wanaomchukia mwenye haki watahesabiwa kuwa na hatia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Maafa yatamwua mwovu.” Neno la Kiebrania רָעָה linaweza kumaanisha “uovu,” “madhara,” au “maafa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּמוֹתֵת
  choice: utamwua
  rationale: Kitenzi hiki ni Hifili kisichotimilika, nafsi ya tatu umoja wa kike, kutoka מות; kinaonyesha kusababisha kifo. “Utamwua” ni Kiswahili cha kawaida na huhifadhi nguvu hiyo ya kisababishi.
- source_word: רָשָׁע
  choice: mwovu
  rationale: Ni kivumishi cha umoja kilichotumiwa kama nomino kumwakilisha mtu mwenye tabia ya uovu. “Mwovu” ni kifupi, cha asili, na hakiongezi jinsia isiyobainishwa na muktadha.
- source_word: רָעָה
  choice: uovu
  rationale: Neno hili linaweza kumaanisha uovu wa kimaadili, madhara, au maafa. “Uovu” huhifadhi usemi mfupi na uwezekano wa kejeli ya kimaadili kwamba uovu wenyewe unamwangamiza mwovu; maana ya “maafa” imehifadhiwa katika tanbihi.
- source_word: שֹׂנְאֵי
  choice: wanaomchukia
  rationale: Ni umbo la kushiriki la wingi katika hali ya kuunganisha. Kishazi hiki cha uhusiano ni cha kawaida katika Kiswahili na huonyesha tabia inayoendelea.
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Ni kivumishi cha umoja kilichotumiwa kama nomino. “Mwenye haki” ni usemi wa kawaida unaodumisha umoja wa mwakilishi bila kumwekea jinsia.
- source_word: יֶאְשָׁמוּ
  choice: watahesabiwa kuwa na hatia
  rationale: Kitenzi אשם hapa huonyesha kuingia katika hatia au kuwajibika kwa hatia. Tafsiri hii huhifadhi wazo la hatia na uwajibikaji bila kulifanya kwa lazima kuwa hukumu ya mwisho.
theological_decisions:
- issue: Iwapo רָעָה itafsiriwe kuwa uovu wa kimaadili au maafa yanayompata mtu
  choice: uovu
  alternative: maafa
  rationale: “Uovu” huhifadhi upana wa neno la Kiebrania na taswira yake kama nguvu inayomwua mwovu. “Maafa” pia yanafaa kimuktadha, lakini yanafupisha uwezekano wa maana ya kimaadili; kwa hiyo yamewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye hadhi unaofaa ushairi. Marudio ya “uovu ... mwovu” yamehifadhiwa kwa sababu yanaakisi uhusiano wa maneno na mkazo wa mstari wa Kiebrania.
