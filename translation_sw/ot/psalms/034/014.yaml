base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/014.yaml
  text: Turn away from evil and do good[a]; seek peace and pursue it.
translation:
  language: sw
  text: Jiepushe na uovu, utende mema; tafuta amani[a] na uifuatilie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hali njema” au “ukamilifu.” Neno la Kiebrania shalom lina maana pana kuliko kutokuwapo kwa migogoro tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּר
  choice: Jiepushe
  rationale: Kitenzi cha amri kinamaanisha kuondoka au kugeuka kutoka katika jambo fulani. “Jiepushe” ni Kiswahili cha kawaida kinachoonyesha hatua ya makusudi ya kuacha uovu.
- source_word: מֵרָע
  choice: na uovu
  rationale: Kihusishi מִן kinaonyesha kujitenga na kitu, nacho רַע hapa, katika wito wa kimaadili, kinamaanisha uovu. Muundo “jiepushe na uovu” unawasilisha maana hiyo kwa kawaida katika Kiswahili.
- source_word: וַעֲשֵׂה טוֹב
  choice: utende mema
  rationale: Ni amri inayokinzana moja kwa moja na kujiepusha na uovu. “Tenda mema” ni usemi wa asili na wenye hadhi katika Kiswahili.
- source_word: בַּקֵּשׁ
  choice: tafuta
  rationale: Amri hii inaonyesha kutafuta kwa makusudi na kwa bidii. “Tafuta” ni wazi na ya kawaida bila kuongeza maana isiyokuwamo katika chanzo.
- source_word: שָׁלוֹם
  choice: amani
  rationale: “Amani” ndiyo tafsiri kuu inayofaa katika wito huu, huku upana wa maana ya שָׁלוֹם—hali njema, uzima kamili, na uhusiano mwema—ukibainishwa katika tanbihi.
- source_word: וְרָדְפֵהוּ
  choice: na uifuatilie
  rationale: Kitenzi רדף kinaonyesha kufuatilia kwa bidii na kwa kudumu. Kiambishi “-i-” kinarejelea “amani,” kama kiambishi cha nafsi ya tatu katika Kiebrania kinavyorejelea שָׁלוֹם.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye hadhi. Mistari miwili ya amri imeunganishwa kwa alama ya nusu koloni ili kuhifadhi usambamba wa kishairi. Alama ya tanbihi imewekwa baada ya “amani,” neno linalohusika moja kwa moja na tanbihi.
