    text: Mapokeo ya usomaji wa Kiebrania yanatofautiana hapa kati ya “walimtazama yeye” na “walinitazama mimi.” Matini kuu inafuata “walimtazama yeye” kwa kuzingatia muktadha; “walinitazama mimi” ni usomaji mwingine uliohifadhiwa.
