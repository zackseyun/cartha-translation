lexical_decisions:
- source_word: הִבִּיטוּ אֵלָיו
  choice: Walimtazama
  rationale: Muundo huu unaonyesha kuwa watu walielekeza macho yao kwake. Kitenzi chenye kiambishi cha yambwa '-m-' ni cha kawaida na cha kishairi bila kuongeza wazo la kutazama kwa muda mrefu.
- source_word: וְנָהָרוּ
  choice: wakang’aa
  rationale: Katika muktadha wa nyuso na aibu, kitenzi kinaeleza kung’aa au kuwa na nuru, si kutiririka. ‘Wakang’aa’ ni Kiswahili cha kawaida na kinahifadhi taswira ya kishairi.
- source_word: וּפְנֵיהֶם
  choice: nyuso zao
  rationale: Tafsiri ya moja kwa moja inadumisha taswira halisi ya Kiebrania badala ya kuibadili kuwa kauli dhahania kuhusu watu wenyewe.
- source_word: אַל יֶחְפָּרוּ
  choice: hazikuaibishwa
  rationale: Katika muktadha huu אַל pamoja na kitenzi kisichotimilika hutoa ukanushi wa matokeo, wala si amri. Kauli ‘hazikuaibishwa’ inaleta wazo la kutotiwa aibu na inapatana na usimulizi wa wakati uliopita.
theological_decisions:
- issue: Tofauti ya mapokeo ya maandishi na usomaji katika אֵלָי/ו
  choice: Walimtazama (‘walimtazama yeye’)
  alternative: Walinitazama (‘walimtazama mimi’)
  rationale: Usomaji wa nafsi ya tatu unafaa zaidi katika muktadha, ambamo watu wanamtazama Bwana. Hata hivyo, umbo la nafsi ya kwanza limehifadhiwa katika tanbihi kwa sababu ni tofauti halisi inayobadili mtazamo wa msemaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Nusu-koloni inadumisha uwiano wa mistari ya kishairi. Alama zote za tanbihi zimewekwa moja kwa moja katika matini kuu.
