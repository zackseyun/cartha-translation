  yaml_path: translation/ot/psalms/034/004.yaml
  text: I sought Yahweh[a], and he answered me; he delivered me from all my fears.
translation:
  language: sw
  text: 'Nilimtafuta Yahweh, naye akanijibu;

    akaniokoa kutoka katika hofu zangu zote.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka katika mambo yote niliyoyaogopa” au “kutoka katika vitisho vyangu vyote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּרַשְׁתִּי
  choice: Nilimtafuta
  rationale: Kitenzi דרשׁ hapa kinaeleza kumtafuta Yahweh kwa sala na kumtegemea, si kuuliza swali tu. “Nilimtafuta” ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: וְעָנָנִי
  choice: naye akanijibu
  rationale: ענה pamoja na kiambishi cha nafsi ya kwanza humaanisha “akanijibu.” “Naye” huonyesha kwa kawaida kwamba anayejibu ni Yahweh aliyetajwa awali.
- source_word: מִכָּל מְגוּרוֹתַי
  choice: kutoka katika hofu zangu zote
  rationale: מן pamoja na כל huonyesha ukombozi unaohusu kila kitu katika kundi hilo. מְגוּרוֹתַי hapa ina maana ya hofu au mambo ya kutisha, si makao ya ugenini.
- source_word: הִצִּילָנִי
  choice: akaniokoa
  rationale: Katika kausativi, נצל humaanisha kumwondoa mtu katika hatari au kumkomboa. “Akaniokoa” ni ya asili katika Kiswahili na haifungi maana kwenye hatari ya kimwili pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia Tetragramatoni יהוה moja kwa moja. “Yahweh” huhifadhi jina hilo la agano badala ya kuliweka kama cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa mistari unadumisha usambamba wa kishairi wa ushuhuda na ukombozi.
