  yaml_path: translation/ot/psalms/034/012.yaml
  text: Who is the man who delights in life[b][a], loving days to see good?
translation:
  language: sw
  text: Ni mtu gani anayetamani maisha, anayependa siku za kuona mema[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ayapate mema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הָאִישׁ
  choice: Ni mtu gani
  rationale: Huhifadhi swali la balagha na maana ya nomino ya umoja inayomwakilisha mtu yeyote; Kiswahili sanifu hutumia “mtu” kwa maana hii bila kulazimika kuonyesha jinsia ya kiume.
- source_word: הֶחָפֵץ
  choice: anayetamani
  rationale: Kitenzi חפץ kinaweza kumaanisha kutamani, kupendezwa na, au kufurahia. “Anayetamani” ni cha kawaida katika Kiswahili na kinaonyesha mwelekeo wenye nguvu wa moyo bila kuongeza wazo lisilokuwamo.
- source_word: חַיִּים
  choice: maisha
  rationale: Ingawa umbo la Kiebrania ni la wingi, hapa ni istilahi ya kawaida inayomaanisha maisha au uhai; “maisha” ndiyo usemi wa asili katika Kiswahili.
- source_word: אֹהֵב יָמִים
  choice: anayependa siku nyingi
  rationale: “Siku nyingi” huwasilisha kwa Kiswahili maana ya kupenda kuendelea kuwa na siku za kuishi. Neno “nyingi” linafanya nahau ieleweke kwa kawaida, ingawa halijatajwa kando katika Kiebrania.
- source_word: לִרְאוֹת טוֹב
  choice: ili aone mema
  rationale: Huhifadhi taswira halisi ya “kuona” na upana wa טוֹב, badala ya kuibana iwe ustawi wa mali tu.
theological_decisions:
- issue: Usemi wa umoja wa kiume wenye maana ya jumla
  choice: mtu
  alternative: mwanamume
  rationale: הָאִישׁ ni nomino ya umoja wa kiume kisarufi, lakini katika swali hili la hekima inamwakilisha mtu yeyote. “Mtu” huwasilisha maana hiyo ya jumla kwa Kiswahili bila kuzuia matumizi kwa wanaume pekee.
- issue: Maana pana ya kuona mema
  choice: aone mema
  alternative: apatwe na mema / afurahie mema
  rationale: Tafsiri ya moja kwa moja hudumisha uwezekano kwamba usemi huo unahusu kuyaona, kuyapata, au kuyapitia mambo mema, bila kuufanya ahadi mahsusi ya mafanikio ya kimwili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na wa hekima. Usemi “siku nyingi” umetumiwa ili kufanya nahau ya Kiebrania ieleweke kwa kawaida, huku “aone mema” ikihifadhi taswira na upana wa maana ya chanzo.
