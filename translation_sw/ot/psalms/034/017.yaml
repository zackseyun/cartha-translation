  text: They cried out[a], and Yahweh heard, and delivered them from all their troubles.
translation:
  language: sw
  text: Walilia, naye Yahwe[a] akasikia, akawaokoa kutoka katika taabu zao zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa desturi hutafsiriwa “BWANA.”'
