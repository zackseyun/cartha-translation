lexical_decisions:
- source_word: צָעֲקוּ
  choice: Walipaza sauti
  rationale: Kitenzi צעק kinaeleza kilio cha dharura cha kuomba msaada. “Walipaza sauti” ni Kiswahili cha kawaida kinachobeba uzito wa kilio hicho bila kuongeza mlengwa ambaye hajatajwa wazi katika Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe” badala ya kubadilishwa na cheo, ili kuhifadhi jina la kibinafsi lililo katika matini ya Kiebrania.
- source_word: שָׁמֵעַ
  choice: akasikia
  rationale: Ingawa umbo la Kiebrania ni participio, katika mfululizo huu wa kishairi linaeleweka kwa kawaida kama tendo lililofuata kilio. “Akasikia” linaunganisha matendo kwa ufasaha wa simulizi la Kiswahili.
- source_word: מִכָּל צָרוֹתָם
  choice: katika taabu zao zote
  rationale: Kirai hiki kinaonyesha kuondolewa kutoka katika jumla ya hali zao za dhiki. “Taabu zao zote” ni cha kawaida, wazi, na kinahifadhi upana wa maana ya צָרוֹת.
- source_word: הִצִּילָם
  choice: akawaokoa
  rationale: Hifili ya נצל humaanisha kuokoa au kunusuru kutoka hatarini. “Akawaokoa” ni ya asili katika Kiswahili na hapa haiongezi maana zaidi ya ukombozi kutoka taabuni uliotajwa wazi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini inatumia moja kwa moja Tetragramatoni יהוה. Kutumia “Yahwe” kunahifadhi jina hilo badala ya kulibadilisha na cheo; tanbihi inataja desturi nyingine iliyozoeleka.
translation_notes:
  register: Lugha ni ya sasa, yenye heshima na inayoeleweka katika Kiswahili Sanifu cha Afrika Mashariki. Nusu koloni linaonyesha uhusiano wa karibu kati ya kusikia kwa Yahwe na tendo lake la kuwaokoa.
