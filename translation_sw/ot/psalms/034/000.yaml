  text: לְ/דָוִ֗ד בְּ/שַׁנּוֹת֣/וֹ אֶת טַ֭עְמ/וֹ לִ/פְנֵ֣י אֲבִימֶ֑לֶךְ וַֽ֝/יְגָרֲשֵׁ֗/הוּ וַ/יֵּלַֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/000.yaml
  text: Of David[a], when he changed his behavior before Abimelech, and he drove him away, and he went away.
translation:
  language: sw
  text: Ya Daudi. Alipobadili mwenendo wake mbele ya Abimeleki[a], Abimeleki akamfukuza, naye akaondoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika 1 Samweli 21:10–15, mfalme huyu anaitwa Akishi; huenda “Abimeleki” hapa ni jina jingine au cheo cha kifalme.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Kihusishi לְ katika vichwa vya Zaburi kinaweza kuonyesha uandishi, uhusiano, au wakfu. “Ya Daudi” ni usemi wa kawaida wa Kiswahili unaohifadhi upana huo kuliko “Iliyoandikwa na Daudi” au “Kwa ajili ya Daudi.”
- source_word: בְּשַׁנּוֹתוֹ
  choice: Alipobadili
  rationale: Muundo wenye בְּ na kitenzi-jina una maana ya wakati hapa; “alipobadili” ni Kiswahili cha kawaida na sahihi.
- source_word: טַעְמוֹ
  choice: mwenendo wake
  rationale: Ingawa neno hili linaweza kumaanisha ladha, utambuzi, au akili, katika muktadha huu linarejelea namna alivyotenda au alivyojionyesha. “Mwenendo wake” linaeleza maana hiyo bila kulifanya kuwa istilahi ya kitabibu.
- source_word: לִפְנֵי אֲבִימֶלֶךְ
  choice: mbele ya Abimeleki
  rationale: Ni tafsiri fupi na ya kawaida ya kuwa katika uwepo wa Abimeleki.
- source_word: וַיְגָרֲשֵׁהוּ
  choice: Abimeleki akamfukuza
  rationale: Kitenzi kina maana ya kumfukuza au kumtoa. Kutaja Abimeleki wazi kunaondoa utata usio wa lazima wa viwakilishi katika Kiswahili na kupatana na tukio linalorejelewa, bila kuongeza uhusiano wa kusudi usiomo katika Kiebrania.
- source_word: וַיֵּלַךְ
  choice: naye akaondoka
  rationale: Kitenzi kina maana ya kwenda; baada ya kufukuzwa, “akaondoka” ni usemi wa asili wa Kiswahili unaowasilisha mwendelezo wa simulizi.
- source_word: אֲבִימֶלֶךְ
  choice: Abimeleki
  rationale: Jina lililo katika maandishi ya Kiebrania limehifadhiwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa Akishi.
theological_decisions:
- issue: Utambulisho wa kihistoria wa Abimeleki
  choice: Kuhifadhi “Abimeleki” katika maandishi makuu kama ilivyo katika Kiebrania.
  alternative: Kumtambua moja kwa moja kuwa Akishi wa Gathi katika maandishi makuu.
  rationale: Kipaumbele cha maandishi ya lugha asilia kinahitaji jina Abimeleki lihifadhiwe. Uhusiano unaowezekana na Akishi wa 1 Samweli 21 unaelezwa katika tanbihi badala ya kusawazisha vifungu kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kichwa kinatumia sentensi fupi na mtiririko wa simulizi unaoeleweka kwa msomaji wa kawaida; utata mpana wa לְדָוִד umehifadhiwa kwa “Ya Daudi.”
