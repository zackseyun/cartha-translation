base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/006.yaml
  text: This poor man cried out[a], and Yahweh heard[b], and saved him from all his troubles.
translation:
  language: sw
  text: Maskini huyu[a] alilia, naye Yahweh akamsikia, akamwokoa[b] kutoka katika taabu zake zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mnyonge huyu” au “mtu huyu aliyeteswa.” Neno la Kiebrania linaweza kumaanisha maskini, mnyonge, aliyeteswa, au mnyenyekevu.
    reason: lexical_alternative
  - marker: b
    text: Au, “akamkomboa.” Kitenzi cha Kiebrania kina maana ya kuokoa au kukomboa kutoka hatarini au dhikini.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עָנִי
  choice: Maskini huyu
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unadumisha kiashiria pamoja na umoja wa nomino; עָנִי inaweza kumaanisha mtu maskini, aliyeteswa, au mnyenyekevu.
- source_word: קָרָא
  choice: alilia
  rationale: Katika muktadha wa dhiki na msaada wa Mungu, kitenzi hiki kinaonyesha kilio cha kuomba msaada, si kuita kwa kawaida tu.
- source_word: יהוה
  choice: Yahweh
  rationale: Jina la agano יהוה limetafsiriwa moja kwa moja kama Yahweh badala ya kubadilishwa kuwa cheo.
- source_word: שָׁמֵעַ
  choice: akasikia
  rationale: Wakati uliopita unafaa ushuhuda wa mtunga zaburi; kiunganishi 'aka-' kinaonyesha tendo lililofuata kilio hicho.
- source_word: מִכָּל צָרוֹתָיו
  choice: katika taabu zake zote
  rationale: Kiswahili cha kawaida husema kuokolewa katika au kutoka katika taabu; 'taabu' linabeba maana ya dhiki na matatizo.
- source_word: הוֹשִׁיעוֹ
  choice: akamwokoa
  rationale: Hifili ya ישׁע ina maana ya kuokoa au kukomboa kutoka hatarini; 'akamwokoa' inadumisha msamiati mpana wa wokovu huku ikifaa ukombozi wa hapa.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina maalumu la Mungu; 'Yahweh' hulihifadhi kama jina badala ya cheo.
- issue: Maana mbalimbali za עָנִי
  choice: maskini
  alternative: aliyeteswa / mnyonge
  rationale: Neno linaweza kuonyesha umaskini, mateso, au unyenyekevu. 'Maskini' linadumisha maana halisi na ya kiwakilishi, huku tanbihi ikihifadhi uwezekano mwingine.
- issue: Upeo wa wokovu katika הוֹשִׁיעוֹ
  choice: akamwokoa
  alternative: akamkomboa / akamponya na hatari
  rationale: Muktadha unaonyesha kuondolewa katika taabu, lakini kitenzi pia ni sehemu ya msamiati mpana wa wokovu; tafsiri haibani maana kwa aina moja ya hatari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa 'naye ... aka-' unaendeleza ushuhuda wa simulizi. Alama zote za tanbihi zimo katika matini kuu.
