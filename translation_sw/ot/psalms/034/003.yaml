lexical_decisions:
- source_word: גַּדְּלוּ
  choice: Mtukuzeni
  rationale: Amri ya wingi kutoka גדל hapa ni mwito wa kumkiri na kumsifu Mungu kuwa mkuu, si wa kumfanya awe mkubwa kihalisi. “Mtukuzeni” ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetolewa kama “Yahweh” ili kuhifadhi jina la agano lililo katika maandishi ya Kiebrania.
- source_word: אִתִּי
  choice: pamoja nami
  rationale: Inaonyesha ushiriki wa pamoja na msemaji katika sifa.
- source_word: וּנְרוֹמְמָה
  choice: na tuliinue
  rationale: Umbo la cohortative la wingi linaonyesha mwaliko au himizo la pamoja; “tuliinue” huhifadhi picha ya kukweza na nguvu ya mwito huo.
- source_word: שְׁמוֹ
  choice: jina lake
  rationale: Tafsiri ya moja kwa moja huhifadhi maana ya jina kama utambulisho na sifa ya Mungu iliyofunuliwa.
- source_word: יַחְדָּו
  choice: sote kwa pamoja
  rationale: Husisitiza tendo la umoja; “sote kwa pamoja” ni wazi na la asili katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia Tetragramatoni moja kwa moja. “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, huku tanbihi ikieleza umbo la Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa heshima. Alama ya nusu koloni inaonyesha usambamba wa mistari miwili ya Kiebrania.
