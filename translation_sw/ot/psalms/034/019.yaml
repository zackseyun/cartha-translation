source:
  edition: WLC
  text: רַ֭בּוֹת רָע֣וֹת צַדִּ֑יק וּ֝/מִ/כֻּלָּ֗/ם יַצִּילֶ֥/נּוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/019.yaml
  text: Many are the afflictions of the righteous man[b][a], but Yahweh delivers him out of them all.
translation:
  language: sw
  text: Mateso[a] ya mtu mwenye haki[b] ni mengi, lakini Yahwe humwokoa kutoka katika hayo yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mabaya,” “shida,” au “maafa.” Neno la Kiebrania רָעוֹת linaweza kuwa na maana hizo; hapa linataja taabu zinazompata mwenye haki.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina umbo la umoja wa kiume, linaloweza kutumiwa kiuwakilishi kumaanisha mtu mwenye haki.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת
  choice: ni mengi
  rationale: Kivumishi hiki ni kiarifu na kinasisitiza wingi; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: רָעוֹת
  choice: mateso
  rationale: Katika muktadha huu neno linataja shida na maafa yanayompata mwenye haki, si uovu anaoutenda.
- source_word: צַדִּיק
  choice: mtu mwenye haki
  rationale: Ni umbo la umoja linalotumiwa kama nomino. Kiswahili hiki huhifadhi umoja na maana ya uwakilishi bila kudai kuwa ahadi inawahusu wanaume pekee.
- source_word: וּמִכֻּלָּם
  choice: lakini ... kutoka katika hayo yote
  rationale: Kiunganishi kinaonyesha utofauti wa kimuktadha, huku 'hayo yote' kikihifadhi maana kamili ya כֻּלָּם.
- source_word: יַצִּילֶנּוּ
  choice: humwokoa
  rationale: Hifili ya נצל humaanisha kuokoa au kukomboa kutoka hatarini; 'humwokoa' ni ya asili na hueleweka wazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo; 'Yahwe' ni tahajia inayolingana na matamshi na mfumo wa Kiswahili.
theological_decisions:
- issue: Umoja wa kiume unaotumika kiuwakilishi katika צַדִּיק
  choice: mtu mwenye haki
  alternative: mwanamume mwenye haki; wenye haki
  rationale: Kiebrania ni umoja wa kiume, lakini hapa kinaweza kumwakilisha mtu yeyote mwenye haki. 'Mtu mwenye haki' huhifadhi umoja bila kuingiza dai kwamba anayelengwa lazima awe mwanamume.
- issue: Maana ya רָעוֹת yanayompata mwenye haki
  choice: mateso
  alternative: mabaya; shida; maafa
  rationale: Muktadha unahusu taabu anazopata mwenye haki na ambazo Yahwe humwokoa kutoka kwazo. Tafsiri hii haibadili ugumu huo kuwa uovu wa kimaadili wa mwenye haki.
- issue: Uwasilishaji wa יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, kwa hiyo limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Mpangilio wa kishazi cha kwanza ni wa asili katika Kiswahili, na wakati wa mazoea katika “humwokoa” unaendana na kauli ya jumla ya mstari.
