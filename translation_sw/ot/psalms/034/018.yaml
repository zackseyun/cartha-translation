  text: 'Yahwe yuko karibu na waliovunjika moyo,

    naye anawaokoa waliopondeka rohoni[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walionyenyekea rohoni.” Kiebrania kinaweza kueleza watu waliopondeka ndani yao au walionyenyekea.
