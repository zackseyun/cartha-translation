lexical_decisions:
- source_word: קָרוֹב
  choice: yuko karibu
  rationale: Inaonyesha ukaribu wa Yahwe kwa namna ya kawaida katika Kiswahili, huku ikihifadhi maana ya mahali na ya uhusiano.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika Kiebrania limeandikwa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: לְנִשְׁבְּרֵי לֵב
  choice: na waliovunjika moyo
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi picha ya Kiebrania ya moyo uliovunjika na kueleza maumivu makali ya ndani.
- source_word: דַּכְּאֵי רוּחַ
  choice: waliopondeka roho
  rationale: Neno דַּכְּאֵי lina nguvu ya kupondwa au kuvunjwa kabisa; ‘roho’ huhifadhi maana ya רוּחַ bila kuifanya kwa lazima kuwa toba.
- source_word: יוֹשִׁיעַ
  choice: anawaokoa
  rationale: Huhifadhi maana ya kuokoa au kukomboa na uhusiano wake na msamiati mpana wa wokovu katika Biblia.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu; ‘Yahwe’ hulihifadhi badala ya kuweka cheo mahali pake.
- issue: Maana ya דַּכְּאֵי רוּחַ
  choice: waliopondeka roho
  alternative: walionyenyekea rohoni
  rationale: Muktadha unaweza kumaanisha watu waliovunjwa na mateso au waliotiishwa ndani yao. Tafsiri kuu haiwekei kifungu maana ya toba pekee, na tanbihi huhifadhi uwezekano wa unyenyekevu wa ndani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa mistari unahifadhi usambamba wa kishairi wa Kiebrania; lugha ni rahisi kueleweka bila kupunguza uzito wa picha za moyo na roho.
