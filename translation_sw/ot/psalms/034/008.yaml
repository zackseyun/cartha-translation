  text: טַעֲמ֣וּ וּ֭/רְאוּ כִּי ט֣וֹב יְהוָ֑ה אַֽשְׁרֵ֥י הַ֝/גֶּ֗בֶר יֶחֱסֶה בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/008.yaml
  text: Taste and see that Yahweh is good[a]; blessed is the man who takes refuge in him.
translation:
  language: sw
  text: Onjeni, mwone kwamba Yahwe ni mwema; heri mwanamume[a] anayekimbilia kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema “mwanamume”; hapa umoja wa kiume unatumiwa kwa maana ya uwakilishi kumhusu mtu yeyote anayekimbilia kwa Yahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַעֲמוּ
  choice: Onjeni
  rationale: Kitenzi cha amri kwa wingi kinamaanisha kihalisi ‘onjeni.’ Taswira halisi ya kuonja imehifadhiwa kwa sababu, pamoja na ‘mwone,’ inaelekeza pia kwenye kumjua Mungu kwa uzoefu.
- source_word: וּרְאוּ
  choice: mwone
  rationale: Kitenzi cha amri kwa wingi ‘mwone’ kinadumisha ulinganifu wa hisi kati ya kuonja na kuona, huku maana ya kutambua kwa uzoefu ikibaki wazi.
- source_word: כִּי
  choice: kwamba
  rationale: 'Hapa כִּי inaanzisha maudhui ya yale ambayo wasomaji wanaalikwa kuyaonja na kuyaona: kwamba Yahwe ni mwema.'
- source_word: טוֹב
  choice: mwema
  rationale: Kwa kuwa kivumishi kinamwelezea Yahwe mwenyewe, ‘mwema’ ni Kiswahili cha kawaida kinachohifadhi wigo wa tabia yake njema na matendo yake yenye kufadhili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo kama ‘BWANA,’ hivyo jina binafsi katika matini ya Kiebrania linahifadhiwa.
- source_word: אַשְׁרֵי
  choice: heri
  rationale: ‘Heri’ ni usemi wa kawaida wa baraka katika Kiswahili cha kibiblia na unaonyesha hali ya kustawi inayotamaniwa, si hisia ya furaha pekee.
- source_word: הַגֶּבֶר
  choice: mwanamume
  rationale: גֶּבֶר ni nomino ya umoja wa kiume. ‘Mwanamume’ huhifadhi umbo hilo la chanzo; matumizi yake ya uwakilishi kwa mtu yeyote yanafafanuliwa katika tanbihi.
- source_word: יֶחֱסֶה בּוֹ
  choice: anayemkimbilia
  rationale: Mzizi חסה unaonyesha kumwendea mwingine ili kupata hifadhi au ulinzi. ‘Anayemkimbilia’ ni usemi wa asili wa Kiswahili unaodumisha taswira ya kutafuta kimbilio kwa Yahwe, na kiambishi ‘-m-’ kinarejelea yeye.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini inatumia moja kwa moja jina la agano יהוה. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Umoja wa kiume wenye matumizi ya uwakilishi katika הַגֶּבֶר
  choice: mwanamume
  alternative: mtu; yeyote
  rationale: ‘Mwanamume’ huhifadhi jinsia na umoja wa nomino ya Kiebrania, huku tanbihi ikieleza kuwa katika muktadha huu anawakilisha mtu yeyote anayemkimbilia Yahwe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wenye hadhi lakini unaoeleweka kwa urahisi. Vitenzi halisi ‘onjeni’ na ‘mwone’ vinahifadhi taswira kuu ya mstari, na ‘heri’ inadumisha muundo wa tamko la baraka.
