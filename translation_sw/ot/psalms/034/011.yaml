base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/011.yaml
  text: Come[a], children, listen to me[b]; I will teach you the fear of Yahweh.
translation:
  language: sw
  text: Njoni, watoto[a], nisikilizeni; nitawafundisha kumcha Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “wana,” lakini hapa yaelekea ni mwito wa kimafundisho kwa wanafunzi kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: “Kumcha Yahweh” ni usemi wa hekima unaojumuisha kicho, heshima, utiifu na hofu inayofaa mbele za Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Njoni
  rationale: Ingawa kitenzi cha Kiebrania kwa msingi humaanisha ‘kwenda/kutembea,’ katika mwito huu kinatumika kama mwaliko wa kuwasogeleza wasikilizaji; ‘Njoni’ ni Kiswahili cha kawaida na cha asili.
- source_word: בָנִים
  choice: watoto
  rationale: Neno lenyewe ni wingi wa ‘wana,’ lakini katika mtindo wa fasihi ya hekima ni mwito kwa wanafunzi kwa ujumla; ‘watoto’ huhifadhi sauti ya kimalezi bila kuufanya mwito uwahusu wanaume pekee.
- source_word: שִׁמְעוּ לִי
  choice: nisikilizeni
  rationale: Muundo huu unadai usikivu wa makini na kutii, si kusikia sauti tu; ‘nisikilizeni’ huwasilisha mwito huo kwa Kiswahili cha sasa.
- source_word: יִרְאַת יְהוָה
  choice: kumcha Yahweh
  rationale: ‘Kumcha’ huhifadhi upana wa dhana ya Kiebrania unaojumuisha hofu inayofaa, kicho, heshima na utiifu mbele za Mungu, bila kuipunguza kuwa heshima pekee.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: אֲלַמֶּדְכֶם
  choice: nitawafundisha
  rationale: Kauli ya wakati usiotimilika katika muktadha huu huonyesha nia au ahadi ya msemaji; ‘nitawafundisha’ ni ya moja kwa moja na ya asili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya יִרְאַת יְהוָה
  choice: kumcha Yahweh
  alternative: kumheshimu Yahweh / kuwa na kicho kwa Yahweh
  rationale: '‘Kumcha’ huhifadhi mvutano na uzito wa usemi wa hekima: unahusisha kicho na heshima, lakini pia hofu inayofaa na utiifu mbele za Mungu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mwito umewekwa mfupi na wa moja kwa moja ili kuhifadhi sauti ya mwalimu wa hekima.
