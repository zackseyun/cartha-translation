  yaml_path: translation/ot/psalms/034/001.yaml
  text: I will bless Yahweh at all times[a]; his praise will continually be in my mouth.
translation:
  language: sw
  text: Nitamhimidi Yahweh wakati wote[a]; sifa yake itakuwa kinywani mwangu daima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; pia hutafsiriwa “Yahweh.”'
    reason: Hufafanua kwamba “Yahweh” linawakilisha jina la Mungu יהוה katika maandishi ya Kiebrania.
lexical_decisions:
- source_word: אֲבָרֲכָה
  choice: Nitamshukuru
  rationale: Kitenzi cha nafsi ya kwanza chenye he ya msisitizo kinaonyesha azimio la kuendelea kumbariki au kumsifu Mungu. Katika Kiswahili, “nitamshukuru” ni usemi wa kawaida na wenye heshima katika muktadha wa ibada, ingawa neno la Kiebrania kihalisi ni “nitambariki.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limeandikwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA,” ili kuhifadhi jina binafsi lililo katika chanzo.
- source_word: בְּכָל עֵת
  choice: wakati wote
  rationale: Kirai hiki kinamaanisha katika kila wakati au bila kujali hali; “wakati wote” ni cha asili na hudumisha upana wa maana.
- source_word: תָּמִיד
  choice: daima
  rationale: Kielezi hiki kinasisitiza mwendelezo usiokoma. “Daima” ni fasaha, kifupi, na kinafaa katika ushairi.
- source_word: תְּהִלָּתוֹ
  choice: sifa zake
  rationale: Nomino תהלה yenye kiambishi cha nafsi ya tatu ya kiume inaweza kumaanisha sifa yake, yaani sifa inayomhusu au anayostahili; “sifa zake” ni ya kawaida katika Kiswahili na huhifadhi marejeo hayo.
- source_word: בְּפִי
  choice: kinywani mwangu
  rationale: Tafsiri hii inadumisha taswira halisi ya sifa iliyomo kinywani na hivyo inayotamkwa, badala ya kuibadili kuwa “midomoni mwangu.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja. “Yahwe” huhifadhi jina binafsi la Mungu na ni umbo linalosomeka kwa kawaida katika Kiswahili.
- issue: Maana ya אֲבָרֲכָה inapomhusu Mungu
  choice: Nitamshukuru
  alternative: Nitambariki; Nitamsifu
  rationale: “Nitambariki” ndilo linalokaribia zaidi umbo la Kiebrania, lakini katika Kiswahili cha kawaida linaweza kudokeza kumpa Mungu baraka. “Nitamshukuru” huwasilisha tendo la ibada kwa lugha ya asili bila kuondoa azimio la msemaji; “nitamsifu” linawezekana lakini lingerudia zaidi wazo la nusu ya pili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa mistari na taswira ya “kinywani mwangu” vinahifadhi usambamba wa ushairi wa Kiebrania.
