lexical_decisions:
- source_word: שֹׁמֵר
  choice: Huyalinda
  rationale: Kitenzi שׁמר hapa kina maana ya kulinda au kuhifadhi. Kauli ya mazoea katika Kiswahili inafaa nguvu ya kimethali ya mstari huu.
- source_word: כָּל עַצְמוֹתָיו
  choice: mifupa yake yote
  rationale: Kifungu hiki kinataja jumla ya mifupa ya mtu huyo, huku kiambishi cha nafsi ya tatu umoja kikihifadhiwa kwa ‘yake’.
- source_word: אַחַת מֵהֵנָּה
  choice: hakuna hata mmoja
  rationale: Neno ‘moja’ ni la kike katika Kiebrania kwa sababu linarejelea mfupa; katika Kiswahili, ‘mfupa’ ni wa ngeli ya 3/4, hivyo ‘mmoja’ ndiyo upatanisho wa kawaida. ‘Hata’ huonyesha mkazo wa kwamba si mmoja kabisa.
- source_word: לֹא נִשְׁבָּרָה
  choice: unaovunjika
  rationale: Nifali ya שׁבר humaanisha ‘kuvunjwa/kuvunjika.’ Wakati wa sasa unaonyesha kauli ya jumla ya kishairi bila kuilazimisha kuwa ya wakati uliopita au ujao.
theological_decisions:
- issue: Mrejelewa wa viambishi vya umoja
  choice: ‘yake’ inamrejelea mtu mwenye haki katika muktadha wa moja kwa moja wa zaburi.
  alternative: Kusema ‘mifupa ya mwenye haki,’ au kufanya rejeo la Kikristo kwa Yesu liwe wazi katika matini kuu.
  rationale: Kiebrania kina viambishi vya nafsi ya tatu umoja, na muktadha wa zaburi unazungumzia mwenye haki anayeteseka ambaye BWANA anamwokoa. Tafsiri haiongezi utambulisho usiotajwa wazi, huku tanbihi ikionyesha matumizi ya mstari huu katika Yohana 19:36.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Huyalinda’ ni ya asili na inaonyesha ulinzi endelevu; ‘hakuna hata mmoja unaovunjika’ huhifadhi umoja wa ‘mfupa’ na nguvu ya kishairi ya sentensi.
