  text: Huyalinda[a] mifupa yake yote; hakuna hata mfupa mmoja unaovunjika.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Huihifadhi mifupa yake yote.”'
