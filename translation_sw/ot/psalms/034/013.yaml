  yaml_path: translation/ot/psalms/034/013.yaml
  text: Guard your tongue from evil[a], and your lips from speaking deceit.
translation:
  language: sw
  text: 'Zuia ulimi wako usinene mabaya,[a]

    na midomo yako isiseme udanganyifu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uulinde ulimi wako usinene uovu, na midomo yako isiseme maneno ya hila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְצֹר
  choice: Uulinde
  rationale: Amri hii ina maana ya kulinda au kutunza kwa uangalifu; katika muktadha huu inahimiza mtu kuzuia ulimi wake usinene mabaya.
- source_word: לְשׁוֹנְךָ
  choice: ulimi wako
  rationale: Tafsiri ya moja kwa moja inadumisha taswira halisi ya kishairi, huku maana ya usemi ikieleweka kwa kawaida katika Kiswahili.
- source_word: מֵרָע
  choice: na uovu
  rationale: Katika muundo wa Kiswahili, ‘linda ... na’ huwasilisha kujiepusha na kitu; ‘uovu’ inadumisha uzito wa kimaadili wa רַע.
- source_word: וּשְׂפָתֶיךָ
  choice: na midomo yako
  rationale: Inadumisha ulinganifu wa kishairi kati ya ulimi na midomo uliopo katika Kiebrania.
- source_word: מִדַּבֵּר
  choice: isiseme
  rationale: Kiswahili cha kawaida hutumia umoja ‘isiseme’ kwa ‘midomo’ katika maana ya kiungo cha kunenea; muundo huu pia unaeleza wazi zuio linalodokezwa na mstari wa kwanza.
- source_word: מִרְמָה
  choice: udanganyifu
  rationale: Neno hili linaeleza usemi wa hila au wa kupotosha kwa lugha ya sasa na iliyo wazi.
