  text: עֵינֵ֣י יְ֭הוָה אֶל צַדִּיקִ֑ים וְ֝/אָזְנָ֗י/ו אֶל שַׁוְעָתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/015.yaml
  text: The eyes of Yahweh are toward the righteous[a], and his ears toward their cry for help.
translation:
  language: sw
  text: Macho ya Yahwe yanawaelekea wenye haki, na masikio yake yanaelekea kilio chao cha kuomba msaada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ombi lao la msaada.” Neno la Kiebrania linamaanisha kilio kinachotokana na dhiki.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי
  choice: Macho ya
  rationale: Inahifadhi taswira halisi ya wingi wa neno la Kiebrania na lugha ya kishairi kuhusu uangalifu wa Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni unukuzi wa kawaida wa Kiswahili wa jina binafsi la Mungu katika tetragramatoni, badala ya kulibadilisha kuwa cheo.
- source_word: אֶל
  choice: yanawaelekea / yanaelekea
  rationale: Kihusishi hiki huonyesha mwelekeo. Vitenzi hivi vinaleta maana hiyo kwa Kiswahili cha kawaida huku vikidumisha usambamba wa kishairi.
- source_word: צַדִּיקִים
  choice: wenye haki
  rationale: Ni tafsiri ya kawaida na ya asili ya kivumishi cha wingi kilichotumiwa kama nomino, bila kupunguza maana yake ya kimaadili.
- source_word: וְאָזְנָיו
  choice: na masikio yake
  rationale: Inahifadhi wingi na taswira ya viungo vya mwili inayolingana na “macho.”
- source_word: שַׁוְעָתָם
  choice: kilio chao cha kuomba msaada
  rationale: Neno hili humaanisha kilio kinachotokana na dhiki na kinachoomba msaada, si kilio chochote tu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania inatumia jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Lugha inayomwelezea Mungu kwa taswira za kibinadamu
  choice: Kuhifadhi “macho” na “masikio”
  alternative: Kufasiri kuwa “Yahwe anawaangalia” na “anasikiliza”
  rationale: Taswira halisi ndiyo hubeba nguvu ya kishairi ya mstari na kueleza uangalifu wa Mungu bila kuifafanua kupita matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usambamba wa kishairi na taswira za Kiebrania zimehifadhiwa, huku muundo ukibaki wazi kwa msomaji wa kawaida.
