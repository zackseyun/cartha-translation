  text: בַּ֭/יהוָה תִּתְהַלֵּ֣ל נַפְשִׁ֑/י יִשְׁמְע֖וּ עֲנָוִ֣ים וְ/יִשְׂמָֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/002.yaml
  text: In Yahweh my soul will boast[b][a]; the humble will hear and rejoice.
translation:
  language: sw
  text: Nafsi yangu itajisifu katika Yahweh; wanyenyekevu[a] watasikia na kufurahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wapole” au “wanaoteseka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיהוָה
  choice: katika Yahweh
  rationale: Kihusishi ב kinaonyesha msingi au nyanja ya kujisifu; “katika Yahweh” kinahifadhi muundo huo pamoja na jina la agano יהוה.
- source_word: תִּתְהַלֵּל
  choice: itajisifu
  rationale: Hithpaeli ya הלל hapa ina maana ya kujisifu au kujivunia, si hasa kusifu. Wakati ujao unafaa kwa hali ya tamko la kishairi la kitenzi kisichotimilika.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: Tafsiri hii inahifadhi usemi wa kishairi wa Kiebrania, ingawa neno נפש linaweza pia kumaanisha mtu mwenyewe au uhai wake.
- source_word: יִשְׁמְעוּ
  choice: watasikia
  rationale: Kitenzi cha qal kisichotimilika kina maana ya moja kwa moja ya kusikia, na wakati ujao unalingana na vitenzi vingine katika mstari.
- source_word: עֲנָוִים
  choice: wanyenyekevu
  rationale: Neno linaweza kutaja wanyenyekevu, wapole, au wanaoteseka. “Wanyenyekevu” linafaa kwa muktadha huku tanbihi ikihifadhi upana wa maana.
- source_word: וְיִשְׂמָחוּ
  choice: na kufurahi
  rationale: שמח humaanisha kufurahi au kuwa na furaha. Muundo huu wa Kiswahili ni wa asili baada ya “watasikia” na unahifadhi mfuatano wa kusikia kisha kufurahi.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Nafsi yangu” imehifadhiwa badala ya kurahisishwa kuwa “mimi,” na “itajisifu katika Yahweh” inalinda picha na msingi wa usemi wa Kiebrania.
