  text: פּוֹדֶ֣ה יְ֭הוָה נֶ֣פֶשׁ עֲבָדָ֑י/ו וְ/לֹ֥א יֶ֝אְשְׁמ֗וּ כָּֽל הַ/חֹסִ֥ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/022.yaml
  text: Yahweh redeems the life of his servants[b][a], and none of those who take refuge in him will be held guilty.
translation:
  language: sw
  text: Yahwe huukomboa uhai wa watumishi wake[a], wala hakuna hata mmoja wa wale wanaomkimbilia kupata hifadhi atakayehesabiwa kuwa na hatia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafsi”; neno la Kiebrania linaweza kurejelea mtu mzima aliye hai.
    reason: lexical_alternative
  - marker: b
    text: Au “atakayepatikana na hatia” au “atakayehukumiwa.” Kitenzi cha Kiebrania kina maana ya hatia katika muktadha wa kisheria.
    reason: alternative_reading
lexical_decisions:
- source_word: פּוֹדֶה
  choice: huukomboa
  rationale: Kitenzi hiki kina maana ya kukomboa au kuokoa kwa gharama; “huukomboa” kinadumisha maana za uokozi na ukombozi zilizomo katika neno la Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetafsiriwa kwa umbo la Kiswahili linalotumiwa kwa kawaida, badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: נֶפֶשׁ
  choice: uhai
  rationale: Katika muktadha huu neno linamaanisha uhai au nafsi hai kwa ujumla, si lazima sehemu isiyo ya mwili ya mtu.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: “Watumishi” ni lugha ya kawaida na yenye heshima katika muktadha huu wa Zaburi, huku ikihifadhi uhusiano wa kumtumikia Yahwe.
- source_word: יֶאְשְׁמוּ
  choice: atakayehesabiwa kuwa na hatia
  rationale: Usemi huu unahifadhi maana ya kisheria ya kubeba au kuhesabiwa hatia bila kuifanya iwe kauli mahsusi kuhusu hukumu ya mwisho.
- source_word: הַחֹסִים בּוֹ
  choice: wale wanaomkimbilia kupata hifadhi
  rationale: Tafsiri hii inadumisha taswira halisi ya kutafuta usalama au hifadhi kwa Yahwe, badala ya kuipanua tu kuwa “kumtumaini.”
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika muktadha wa wokovu
  choice: Imetafsiriwa “uhai.”
  alternative: “nafsi”
  rationale: Neno la Kiebrania linaweza kumaanisha kiumbe hai, mtu mwenyewe, au uhai wake. “Uhai” huepuka kuingiza mgawanyo wa mwili na roho ambao mstari haulazimishi; tanbihi inahifadhi “nafsi” kama uwezekano.
- issue: Nguvu ya יֶאְשְׁמוּ
  choice: “atakayehesabiwa kuwa na hatia”
  alternative: “atakayehukumiwa” au “atakayepatikana na hatia”
  rationale: Kitenzi kina maana ya hatia au kuwajibika kisheria. Tafsiri iliyochaguliwa inadumisha uzito huo bila kulazimisha ufafanuzi mwembamba wa aina ya hukumu inayokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka. Muundo “hakuna hata mmoja ... atakayehesabiwa” umetumiwa kuwasilisha kwa kawaida msisitizo wa Kiebrania kwamba wote wanaomkimbilia Yahwe hawatahesabiwa kuwa na hatia.
