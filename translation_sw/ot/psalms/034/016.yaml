  text: פְּנֵ֣י יְ֭הוָה בְּ/עֹ֣שֵׂי רָ֑ע לְ/הַכְרִ֖ית מֵ/אֶ֣רֶץ זִכְרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/016.yaml
  text: The face of Yahweh is against those who do evil[b][a], to cut off the memory of them from the earth.
translation:
  language: sw
  text: Uso wa Yahweh uko dhidi ya watendao maovu, ili kuondoa kumbukumbu yao kutoka duniani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka nchini,” ikiwa אֶרֶץ inaeleweka hapa kwa maana ya eneo maalumu badala ya dunia kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנֵי
  choice: Uso wa
  rationale: Neno hilo kihalisi ni “uso wa” na hapa linaonyesha uwepo na msimamo wa Yahweh unaoelekezwa kwa upinzani. Kudumisha “uso” kunahifadhi taswira ya Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania linatoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: בְּעֹשֵׂי רָע
  choice: uko dhidi ya watendao maovu
  rationale: Katika muktadha huu, kihusishi kinaonyesha uelekeo wa uhasama. “Watendao maovu” huhifadhi hali ya kitenzi cha Kiebrania badala ya kuwapa tu lebo ya kudumu.
- source_word: לְהַכְרִית
  choice: ili kuifuta
  rationale: 'Kitenzi hiki kinaonyesha kusudi la upinzani wa Yahweh: kuondoa kabisa kumbukumbu yao. “Kuifuta” ni Kiswahili cha kawaida kinachopatana kiasili na “kumbukumbu,” huku kikibeba nguvu ya kukomesha.'
- source_word: מֵאֶרֶץ
  choice: duniani
  rationale: אֶרֶץ linaweza kumaanisha nchi au dunia. Kauli hii ya hekima ina upeo wa jumla, hivyo “duniani” inafaa, huku uwezekano wa “nchini” ukihifadhiwa katika tanbihi.
- source_word: זִכְרָם
  choice: kumbukumbu yao
  rationale: Huhifadhi maana ya nomino “kumbukumbu/ukumbusho” pamoja na kiambishi cha nafsi ya wingi, kwa Kiswahili cha kawaida na wazi.
theological_decisions:
- issue: Taswira ya kibinadamu katika usemi “uso wa Yahweh”
  choice: Taswira halisi ya “Uso wa Yahweh” imedumishwa ili kuonyesha uwepo wake na upinzani wake hai dhidi ya watendao maovu.
  alternative: “Uwepo wa Yahweh uko dhidi ya watendao maovu” au “Yahweh anawapinga watendao maovu.”
  rationale: Kufupisha kuwa “Yahweh anawapinga” kungeeleza maana lakini kungefifisha taswira ya kishairi na nguvu ya kitheolojia ya Kiebrania. “Uso” haikulazimishi dhana ya mwili wa kimwili, bali huonyesha msimamo wa Mungu unaomwelekea mtu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Uso wa Yahweh uko dhidi ya...” ni usemi wa kishairi unaohifadhi muundo wa Kiebrania; “watendao maovu” ni wa heshima na unaoeleweka kwa wasomaji wa kawaida.
