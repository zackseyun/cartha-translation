  text: חֹנֶ֤ה מַלְאַךְ יְהוָ֓ה סָ֘בִ֤יב לִֽ/ירֵאָ֗י/ו וַֽ/יְחַלְּצֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/007.yaml
  text: The angel of Yahweh encamps around those who fear him[a], and rescues them.
translation:
  language: sw
  text: Malaika wa Yahweh hupiga kambi kuwazunguka wale wanaomcha[a], naye huwaokoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mjumbe wa Yahweh.” Neno la Kiebrania מַלְאַךְ linaweza kumaanisha “mjumbe” au “malaika,” ingawa hapa maana ya “malaika” inaelekea zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹנֶה
  choice: hupiga kambi
  rationale: Kitenzi hiki katika kauli ya wakati unaoendelea kinaonyesha kupiga kambi; usemi huu unadumisha taswira ya ulinzi.
- source_word: מַלְאַךְ יְהוָה
  choice: Malaika wa Yahweh
  rationale: מַלְאָךְ inaweza kumaanisha mjumbe au malaika, lakini katika muunganiko huu maana ya kiumbe wa mbinguni inaelekea zaidi; utambulisho wake haujaelezwa zaidi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: סָבִיב
  choice: kuwazunguka
  rationale: Huwasilisha nafasi ya kuzunguka pande zote na kuendeleza taswira ya ulinzi kwa Kiswahili cha kawaida.
- source_word: לִירֵאָיו
  choice: wale wanaomcha
  rationale: Huhifadhi usemi wa kibiblia wa kumcha Mungu, unaoweza kujumuisha hofu yenye heshima na unyenyekevu.
- source_word: וַיְחַלְּצֵם
  choice: naye huwaokoa
  rationale: חלץ hapa humaanisha kuwatoa katika hatari au kuwaokoa; ‘huwaokoa’ ni ya sasa, wazi, na inalingana na taswira ya ulinzi.
theological_decisions:
- issue: Iwapo מַלְאַךְ יְהוָה atafsiriwe ‘mjumbe wa Yahweh’ au ‘malaika wa Yahweh,’ na iwapo utambulisho maalumu udokezwe.
  choice: Malaika wa Yahweh, bila kufafanua zaidi utambulisho wake.
  alternative: Mjumbe wa Yahweh; au kumtambulisha wazi kuwa udhihirisho wa Mungu/Kristo.
  rationale: ‘Malaika’ ndiyo maana inayowezekana zaidi katika muktadha, lakini Kiebrania pia huruhusu ‘mjumbe.’ Aya yenyewe haifafanui utambulisho wake zaidi, hivyo mvutano huo unahifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Hupiga kambi kuwazunguka’ huhifadhi taswira halisi ya kijeshi na ya ulinzi bila kufanya sentensi kuwa ngumu.
