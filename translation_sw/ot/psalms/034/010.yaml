  text: כְּ֭פִירִים רָשׁ֣וּ וְ/רָעֵ֑בוּ וְ/דֹרְשֵׁ֥י יְ֝הוָ֗ה לֹא יַחְסְר֥וּ כָל טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/010.yaml
  text: Young lions suffer want and hunger[a], but those who seek Yahweh lack no good thing.
translation:
  language: sw
  text: 'Simba wachanga hupungukiwa na kuona njaa[a],

    lakini wanaomtafuta Yahweh hawakosi jambo lolote jema.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Simba wachanga huwa maskini na wenye njaa.” Kitenzi cha Kiebrania kinaweza kumaanisha kuwa katika uhitaji au kuwa maskini.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפִירִים
  choice: Simba wachanga
  rationale: Nomino hii humaanisha simba vijana wenye nguvu, si simba kwa ujumla; picha inasisitiza kwamba hata wanyama wenye uwezo mkubwa wa kujipatia mawindo wanaweza kukosa.
- source_word: רָשׁוּ
  choice: hupungukiwa
  rationale: Kitenzi kinaweza kumaanisha kuwa katika uhitaji au kuwa maskini. “Hupungukiwa” ni Kiswahili cha kawaida kinachohifadhi maana pana ya kukosa bila kuirudia tu dhana ya njaa.
- source_word: וְרָעֵבוּ
  choice: na kuona njaa
  rationale: Kirai hiki cha kawaida cha Kiswahili huwasilisha moja kwa moja hali ya kuwa na njaa na kuendeleza usambamba wa kishairi.
- source_word: וְדֹרְשֵׁי יְהוָה
  choice: lakini wanaomtafuta Yahweh
  rationale: Muundo wa kivumishi-tendo unaonyesha watu wenye sifa ya kumtafuta Yahweh. “Wanaomtafuta” ni wa asili na unaeleweka katika Kiswahili cha sasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano limewasilishwa kama jina binafsi badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: לֹא יַחְסְרוּ
  choice: hawakosi
  rationale: Wakati uliopo wa mazoea unafaa kwa hakikisho la jumla la kishairi lililo katika kitenzi cha Kiebrania.
- source_word: כָל טוֹב
  choice: jambo lolote jema
  rationale: Katika muktadha wa ukanushaji, kirai hiki humaanisha kutokosa kitu chochote kilicho chema; tafsiri hii ni wazi na ya asili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni, jina binafsi la Mungu. “Yahweh” huhifadhi jina hilo badala ya kuliweka kama cheo.
- issue: Upeo wa ahadi ya kutokosa mema
  choice: hawakosi jambo lolote jema
  alternative: hawatakosa kitu kizuri wanachotamani
  rationale: Tafsiri inahifadhi dai pana la kishairi la כָל־טוֹב bila kuongeza kwamba “jema” humaanisha kila kitu ambacho mtu anakitamani, wala bila kufafanua kimadhehebu aina ya mema yanayokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa mistari umehifadhi ulinganifu wa sehemu mbili za mstari, huku maneno ya kawaida “kuona njaa” na “jambo lolote jema” yakisaidia usomaji wa wazi.
