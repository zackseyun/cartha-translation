  yaml_path: translation/ot/psalms/034/009.yaml
  text: Fear Yahweh[a], his holy ones[b], for those who fear him lack nothing.
translation:
  language: sw
  text: Mcheni Yahweh, enyi watakatifu wake, kwa maana wale wanaomcha hawapungukiwi na kitu chochote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְר֣אוּ
  choice: Mcheni
  rationale: Ni amri ya nafsi ya pili wingi kutoka ירא. “Mcheni” huhifadhi maana ya kumwogopa Mungu kwa heshima na uchaji, na pia uhusiano wa kileksia na לִירֵאָיו baadaye katika mstari.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: אֶת ni kiashiria cha yambwa, na יְהוָה ni jina la Mungu; limetoholewa kuwa “Yahweh” ili kuhifadhi jina la agano lililo katika maandishi ya Kiebrania.
- source_word: קְדֹשָׁיו
  choice: watakatifu wake
  rationale: Nomino-kivumishi cha wingi chenye kiambishi cha nafsi ya tatu umoja. “Watakatifu wake” ni Kiswahili cha kawaida na huhifadhi utambulisho wa watu waliowekwa wakfu kwake.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu ya amri iliyotangulia; “kwa maana” huonyesha uhusiano huo kwa Kiswahili cha asili na chenye hadhi.
- source_word: אֵין מַחְסוֹר
  choice: hawakosi kitu
  rationale: Nahau hii inaeleza kutokuwapo kwa upungufu. “Hawakosi kitu” ni ya kawaida katika Kiswahili cha sasa na haiongezi wazo la kuwa na mali zote.
- source_word: לִירֵאָיו
  choice: wale wanaomcha
  rationale: Kirai chenye לְ na umbo la wingi la anayemcha Mungu. Muundo huu ni wa asili kwa Kiswahili na hurudia mzizi “-cha” kama Kiebrania kinavyorudia ירא.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia Tetragramatoni moja kwa moja. “Yahweh” huhifadhi jina binafsi la agano bila kulibadili kuwa cheo; “Yehova” ni umbo la kimapokeo la baadaye.
- issue: Maana ya kumcha Mungu
  choice: mcheni / wanaomcha
  alternative: mheshimuni / wanaomheshimu
  rationale: Kitenzi “-cha” huhifadhi nguvu na mvutano wa ירא, unaoweza kujumuisha hofu, uchaji, na heshima. “-heshimu” peke yake ingepunguza maana hiyo.
- issue: Upeo wa ahadi ya kutokosa
  choice: hawakosi kitu
  alternative: hawana uhitaji wowote
  rationale: Tafsiri inahifadhi dai la kishairi la אֵין מַחְסוֹר bila kulifafanua kimadhehebu kuwa ahadi ya utajiri au kulipunguza kimya kimya kuwa mahitaji ya aina fulani tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa msomaji wa kawaida. Mstari umehifadhi urudiaji wa wazo la “kumcha” na mtiririko wa amri kisha sababu yake.
