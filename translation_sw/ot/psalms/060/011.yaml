lexical_decisions:
- source_word: הָבָה
  choice: Utupe
  rationale: Ombi la moja kwa moja kwa Mungu la kutoa msaada; umbo la Kiswahili linaunganisha kitenzi na viwakilishi vya mtendaji na mpokeaji kwa njia ya asili.
- source_word: לָּנוּ
  choice: -tu- katika “Utupe”
  rationale: Kiwakilishi cha nafsi ya kwanza wingi kimeingizwa kiasili katika kitenzi cha Kiswahili.
- source_word: עֶזְרַת
  choice: msaada
  rationale: Neno la kawaida, lenye hadhi, linalofaa ombi la sala na maana ya msaada au auni.
- source_word: מִצָּר
  choice: dhidi ya adui
  rationale: צַר inaweza kumaanisha adui au dhiki. Muktadha wa vita katika zaburi hii unaunga mkono maana ya adui, na מן pamoja na ‘msaada’ imetafsiriwa kiasili kuwa ‘dhidi ya.’
- source_word: וְשָׁוְא
  choice: kwa maana ... ni bure
  rationale: שָׁוְא huonyesha ubatili au kutofaa. ‘Ni bure’ ni Kiswahili cha sasa na cha kishairi kinachoonyesha kwamba wokovu huo hauwezi kutegemewa; kiunganishi kimetolewa kama sababu inayounga mkono ombi.
- source_word: תְּשׁוּעַת
  choice: wokovu
  rationale: Neno hilo linaweza kumaanisha wokovu, ukombozi, au ushindi. ‘Wokovu’ huhifadhi upana wa neno huku tanbihi ikitaja njia mbadala zinazofaa muktadha wa vita.
- source_word: אָדָם
  choice: mwanadamu
  rationale: Hapa neno linawakilisha wanadamu kwa jumla, si mwanamume mmoja; ‘mwanadamu’ ni la kawaida na sahihi katika Kiswahili sanifu.
theological_decisions:
- issue: Msaada wa wanadamu ukilinganishwa na msaada wa Mungu
  choice: Mstari unasema kwamba wokovu unaotokana na mwanadamu ni bure, ukitofautishwa na msaada unaoombwa kwa Mungu.
  alternative: Kauli ya jumla kwamba kila jitihada ya mwanadamu ni bure.
  rationale: Muktadha unahusu kutotosha kwa uokozi wa kibinadamu katika hali hii; tafsiri haipanui kauli hiyo kuwa fundisho kuhusu kila tendo au jitihada ya mwanadamu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Utupe’ ni ombi la moja kwa moja na la kawaida; ‘ni bure’ huhifadhi ufupi na uzito wa mstari bila kutumia lugha ngumu isiyo ya kawaida.
