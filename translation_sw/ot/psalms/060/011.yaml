  text: Utupe msaada dhidi ya adui[a]; ukombozi wa mwanadamu[c] ni bure[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka katika dhiki.” Neno la Kiebrania צַר linaweza kumaanisha “adui” au “dhiki.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wokovu” au “ushindi.”
