  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kichwa cha zaburi lakini kinachoeleweka kwa wasomaji wa kawaida. Rasimu inatafsiri maandishi ya Kiebrania yaliyotolewa pekee, ambayo yanaishia kwenye לְלַמֵּד (“kwa ajili ya kufundisha”); maelezo ya vita na Edomu katika safu ya Kiingereza hayamo katika ushahidi wa chanzo uliotolewa, hivyo hayajaongezwa.
