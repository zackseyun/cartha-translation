base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/000.yaml
  text: 'For the choirmaster: according to “Lily of Testimony.”[a] A miktam[b] of David[c], for teaching when he fought against Aram-naharaim and Aram-zobah, and Joab returned and struck down twelve thousand of Edom in the Valley of Salt.'
translation:
  language: sw
  text: 'Kwa kiongozi wa waimbaji: kwa kufuata “Yungiyungi la Ushuhuda.”[a] Miktamu[b] ya Daudi[c], kwa ajili ya kufundisha.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “kwa tuni ya ‘Yungiyungi la Ushuhuda.’” Inaelekea Kiebrania kimehifadhi jina la kimuziki au la kiliturujia, lakini maana yake kamili haijulikani.
    reason: lexical_alternative
  - marker: b
    text: “Miktamu” ni jina la Kiebrania la aina ya utungo ambalo maana yake haijulikani kwa hakika; huenda likawa istilahi ya kimuziki au ya kifasihi.
    reason: lexical_alternative
  - marker: c
    text: “Ya Daudi” inaweza pia kumaanisha “iliyoandikwa na Daudi” au “kwa ajili ya Daudi”; muundo wa Kiebrania unaweza kuonyesha utunzi, uhusiano, au kuwekwa wakfu.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa kiongozi wa waimbaji
  rationale: Katika vichwa vya Zaburi neno hili humwelekezea kiongozi au msimamizi wa uimbaji wa ibada; tafsiri hii ni wazi na ya kawaida kwa wasomaji wa Kiswahili.
- source_word: עַל
  choice: kwa kufuata
  rationale: Katika vichwa vya Zaburi huenda neno hili likatanguliza tuni au mpangilio wa muziki. Kauli hii inadokeza uhusiano huo bila kuamua kwa uhakika maana yake ya kitaalamu.
- source_word: שׁוּשַׁן עֵדוּת
  choice: “Ua la Yungiyungi la Ushuhuda”
  rationale: Inaonekana kuwa jina la kimuziki au la kiliturujia. Tafsiri ya karibu na muundo wa Kiebrania, pamoja na alama za kunukuu, huiwasilisha kama kichwa bila kubashiri kiwakilishi chake.
- source_word: מִכְתָּם
  choice: Miktamu
  rationale: Maana ya jina hili la aina ya utungo haijulikani kwa hakika; kulinakili kwa muundo unaotamkika katika Kiswahili huepuka tafsiri ya kubuni.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Muundo wa Kiebrania unaweza kumaanisha utunzi, uhusiano, au kuwekwa wakfu kwa Daudi. “Ya Daudi” huhifadhi upana huo kuliko “iliyoandikwa na Daudi.”
- source_word: לְלַמֵּד
  choice: kwa ajili ya kufundisha
  rationale: Kitenzi-jina chenye kiambishi hiki kinaonyesha kusudi; kauli hiyo ni ya asili katika Kiswahili na huhifadhi dhana ya matumizi ya kufundishia.
