  yaml_path: translation/ot/psalms/060/007.yaml
  text: Gilead is mine[a], and Manasseh is mine; Ephraim is the stronghold of my head[b]; Judah is my scepter.
translation:
  language: sw
  text: Gileadi ni yangu, na Manase ni yangu; Efraimu ni ngome ya kichwa changu; Yuda ni fimbo yangu ya utawala[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtoa sheria wangu” au “fimbo ya mtawala wangu.” Neno la Kiebrania linaweza kumaanisha mtu anayetoa amri au fimbo inayowakilisha utawala.
    reason: alternative_reading
lexical_decisions:
- source_word: לִי
  choice: ni yangu
  rationale: Kiambishi cha nafsi ya kwanza umoja kinaonyesha umiliki; “ni yangu” ni kauli ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: גִלְעָד
  choice: Gileadi
  rationale: Jina la mahali limetolewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: מְנַשֶּׁה
  choice: Manase
  rationale: Jina la kabila na eneo limetolewa kwa umbo la kawaida la Kiswahili.
- source_word: אֶפְרַיִם
  choice: Efraimu
  rationale: Jina la kabila limetolewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: מָעוֹז
  choice: ngome
  rationale: Neno hili huonyesha mahali au chanzo cha nguvu na ulinzi; “ngome” inadumisha taswira ya kijeshi.
- source_word: רֹאשִׁי
  choice: kichwa changu
  rationale: Tafsiri ya moja kwa moja inadumisha sitiari ya Kiebrania bila kuifafanua kupita kiasi kuwa ulinzi au taji.
- source_word: מְחֹקְקִי
  choice: fimbo yangu ya utawala
  rationale: Neno linaweza kumaanisha mwenye kutoa amri au fimbo inayowakilisha mamlaka. Katika muktadha huu, “fimbo yangu ya utawala” inadumisha taswira ya kifalme huku maana nyingine ikiwekwa katika tanbihi.
theological_decisions:
- issue: Maana ya מְחֹקְקִי katika taswira ya kifalme
  choice: fimbo yangu ya utawala
  alternative: mtoa sheria wangu; mtawala wangu
  rationale: Mstari unayahusisha maeneo na makabila na majukumu ya kijeshi na kifalme. “Fimbo yangu ya utawala” inaonyesha mamlaka ya kifalme bila kulazimisha maana finyu ya mtu anayebuni sheria; hata hivyo, maana ya mtu anayetoa amri inawezekana na imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo “ngome ya kichwa changu” umehifadhiwa ili kudumisha sitiari halisi na utata wa kishairi wa Kiebrania.
