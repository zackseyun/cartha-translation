base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/010.yaml
  text: Have you not[a], O God, rejected us, and do you not go out, O God[c][b], with our armies?
translation:
  language: sw
  text: Je, si wewe, Ee Mungu, umetukataa, na je, hutoki, Ee Mungu, pamoja na majeshi yetu[a][b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umetutupa mbali.”
    reason: lexical_alternative
  - marker: b
    text: Hapa “kutoka pamoja na majeshi” humaanisha kwenda vitani pamoja nayo.
    reason: cultural_note
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, si
  rationale: Huanzisha swali la balagha linalotarajia jibu la kukubali; muundo huu unadumisha nguvu ya swali katika Kiswahili cha kawaida.
- source_word: אַתָּה
  choice: wewe
  rationale: Kiwakilishi huru cha Kiebrania kinasisitiza mhusika; “wewe” kinahifadhi msisitizo huo.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Hapa ni mwito wa moja kwa moja. Kurudiwa kwake katika kishazi cha pili kumehifadhiwa kama ilivyo katika Kiebrania.
- source_word: זְנַחְתָּנוּ
  choice: uliyetukataa
  rationale: Kitenzi זנח humaanisha kukataa au kutupilia mbali. “Uliyetukataa” ni wazi, cha kisasa, na hakipunguzi ukali wa maombolezo.
- source_word: וְלֹא
  choice: wala
  rationale: “Wala” huunganisha kishazi cha pili kilichokanushwa na swali lilelile la balagha, bila kukifanya kisikike kama amri hasi.
- source_word: תֵצֵא
  choice: hutoki
  rationale: Huhifadhi picha halisi ya ‘kutoka’; katika muktadha wa majeshi, maana yake ni kutoka kwenda vitani.
- source_word: בְּצִבְאוֹתֵינוּ
  choice: pamoja na majeshi yetu
  rationale: צְבָאוֹת hapa ni vikosi vya kijeshi, na kihusishi kinaonyesha kuandamana navyo vitani.
theological_decisions:
- issue: Lugha ya Mungu kuwakataa watu wake katika maombolezo
  choice: Kudumisha dai la moja kwa moja kwamba Mungu amewakataa na hatoki pamoja na majeshi yao.
  alternative: Kulainisha kuwa Mungu ‘ameruhusu wakataliwe’ au ‘anaonekana kuwa amewakataa.’
  rationale: Kiebrania kinamhusisha Mungu moja kwa moja na kukataliwa kwao na kutokwenda kwake vitani pamoja nao. Tafsiri haiondoi mvutano wa kitheolojia wa maombolezo.
- issue: Upeo wa swali la balagha
  choice: Kuvihusisha vishazi vyote viwili ndani ya swali moja kwa kutumia “Je, si ... wala ...?”
  alternative: 'Kutafsiri kishazi cha pili kama taarifa huru: “na hutoki.”'
  rationale: הֲלֹא mwanzoni inaeleweka kwa kawaida kutawala sentensi nzima iliyoratibiwa, ingawa umbo la Kiebrania linaweza kusikika pia kama swali likifuatiwa na taarifa. Tafsiri inahifadhi usomaji mkuu bila kugeuza sehemu ya pili kuwa amri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Kurudiwa kwa “Ee Mungu” kunahifadhi msisitizo wa maandishi ya Kiebrania; “wala” hufanya swali moja la balagha lisikike kwa ufasaha.
