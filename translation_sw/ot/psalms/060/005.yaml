  text: לְ֭מַעַן יֵחָלְצ֣וּ/ן יְדִידֶ֑י/ךָ הוֹשִׁ֖יעָ/ה יְמִֽינְ/ךָ֣ ו/ענ/נו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/005.yaml
  text: So that your beloved ones may be delivered[b][a], save with your right hand and answer me.
translation:
  language: sw
  text: Ili wapendwa wako waokolewe[a], okoa kwa mkono wako wa kuume, na utujibu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waondolewe hatarini.”
    reason: lexical_alternative
  - marker: b
    text: Usomaji mwingine unasema “unijibu.”
    reason: textual_variant
lexical_decisions:
- source_word: לְמַעַן
  choice: Ili
  rationale: Huonyesha kusudi au matokeo; “ili” ni ya kawaida na huhifadhi uhusiano huo kwa ufupi.
- source_word: יֵחָלְצוּן
  choice: waokolewe
  rationale: Nifali ya חלץ ina maana ya kutolewa au kuondolewa hatarini; “waokolewe” ni ya asili katika ombi hili bila kufafanua kupita kiasi.
- source_word: יְדִידֶיךָ
  choice: wapendwa wako
  rationale: Huhifadhi wingi na maana ya watu walio wapendwa sana na Mungu.
- source_word: הוֹשִׁיעָה
  choice: okoa
  rationale: Amri ya Hifili kutoka ישׁע ni ombi la moja kwa moja la Mungu kutenda wokovu; “okoa” ni tafsiri wazi na ya kawaida.
- source_word: יְמִינְךָ
  choice: kwa mkono wako wa kuume
  rationale: Huhifadhi taswira ya Kiebrania ya mkono wa kuume na pia maana ya chombo au njia ya kuokoa.
- source_word: וַעֲנֵנוּ
  choice: na utujibu
  rationale: Maandishi yaliyotolewa yana kiambishi cha nafsi ya kwanza wingi, kwa hiyo ombi ni “utujibu”; umoja unaojulikana kutoka usomaji mwingine umewekwa katika tanbihi.
theological_decisions:
- issue: Taswira ya mkono wa kuume wa Mungu
  choice: Kuhifadhi usemi “kwa mkono wako wa kuume” kama taswira ya nguvu ya Mungu ya kuokoa.
  alternative: Kutafsiri kwa ufafanuzi kuwa “kwa nguvu zako.”
  rationale: Taswira halisi ya Kiebrania ina umuhimu wa kishairi na kiteolojia, hivyo haipaswi kubadilishwa kuwa dhana tupu.
- issue: Kiambishi cha mtendewa katika kitenzi cha mwisho
  choice: 'Kutafsiri kwa wingi: “utujibu.”'
  alternative: “unijibu,” kwa kufuata usomaji wa umoja unaopatikana katika mapokeo au ulinganifu mwingine wa kifungu.
  rationale: WLC iliyotolewa ina ועננו, inayounga mkono nafsi ya kwanza wingi. Tofauti ya umoja inahifadhiwa katika tanbihi bila kuondoa ushahidi wa matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inabaki kuwa ombi la kishairi na la moja kwa moja; taswira ya “mkono wa kuume” imehifadhiwa. Alama zote za tanbihi zimewekwa katika matini kuu.
