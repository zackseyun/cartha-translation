  yaml_path: translation/ot/psalms/060/012.yaml
  text: With God we will do valiantly[b][a], and he will trample our adversaries.
translation:
  language: sw
  text: Kwa Mungu tutatenda kwa ushujaa,[a] naye atawakanyaga adui zetu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa msaada wa Mungu tutatenda kwa ushujaa.” Kihusishi cha Kiebrania kinaweza kuonyesha ushirika au njia ambayo tendo linafanyika.
    reason: lexical_alternative
  - marker: b
    text: Au, “wapinzani wetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Kwa Mungu
  rationale: Kihusishi ב hapa kinaweza kuonyesha njia au ushirika. “Kwa Mungu” ni Kiswahili cha kawaida kinachoonyesha kuwa ushindi unatokana na msaada wake bila kufunga maana katika wazo moja tu.
- source_word: נַעֲשֶׂה חָיִל
  choice: tutatenda kwa ushujaa
  rationale: Muungano huu wa maneno ni nahau yenye maana ya kutenda kwa nguvu au ushujaa. Tafsiri hii ni ya asili katika Kiswahili na inadumisha kipengele cha watu kutenda.
- source_word: וְהוּא
  choice: naye
  rationale: Kiwakilishi huru cha Kiebrania kinaweka mkazo kwa Mungu kama mtendaji wa hatua inayofuata; “naye” huhifadhi muendelezo na mkazo huo kwa ufupi.
- source_word: יָבוּס
  choice: atawakanyaga
  rationale: Kitenzi hiki kina picha halisi ya kukanyaga chini. “Atawakanyaga” ni wazi, hai, na hakibadili picha hiyo kuwa kauli ya jumla kama ‘atawashinda.’
- source_word: צָרֵינוּ
  choice: watesi wetu
  rationale: Neno hili humaanisha maadui au wapinzani wanaomkabili mtu. “Watesi wetu” linaonyesha uhasama huo, huku tanbihi ikihifadhi tafsiri mbadala iliyo ya moja kwa moja zaidi.
theological_decisions:
- issue: Utendaji katika ushindi
  choice: Aya inadumisha kwa pamoja tendo la watu kwa kumtegemea Mungu na tendo la Mungu la kuwatiisha wapinzani.
  alternative: Kusisitiza tendo la wanadamu pekee au tendo la Mungu pekee.
  rationale: Kiebrania kinasema ‘tutatenda’ na kisha ‘yeye atawakanyaga.’ Tafsiri haifuti mvutano huo wala kuunganisha matendo hayo kana kwamba ni tendo moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo ni mfupi na wenye hadhi, ukihifadhi usambamba wa kishairi na picha ya kijeshi ya kukanyaga.
