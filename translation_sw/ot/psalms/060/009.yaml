  text: מִ֣י יֹ֭בִלֵ/נִי עִ֣יר מָצ֑וֹר מִ֖י נָחַ֣/נִי עַד אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/009.yaml
  text: Who will bring me to the fortified city? Who will lead me as far as Edom?[a]
translation:
  language: sw
  text: Ni nani atakayenifikisha kwenye mji wenye ngome? Ni nani atakayeniongoza mpaka Edomu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ni nani atakayeniongoza kwenye mji wenye ngome? Ni nani aliyeniongoza mpaka Edomu?” Vitenzi vya Kiebrania vinaweza kuwa na vivuli tofauti kidogo vya hali na wakati, lakini matini kuu inadumisha usambamba wa kishairi kama maswali mawili yanayoelekea wakati ujao.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Ni nani
  rationale: Kiwakilishi cha kuuliza kinachoanzisha maswali ya kishairi; “Ni nani” ni Kiswahili cha kawaida na chenye nguvu inayofaa.
- source_word: יֹבִלֵנִי
  choice: atakayenifikisha
  rationale: Hifili ya יבל ina maana ya kumpeleka au kumfikisha mtu mahali; “atakayenifikisha” inaonyesha wazi mwelekeo kuelekea mahali panapotajwa.
- source_word: עִיר מָצוֹר
  choice: mji wenye ngome
  rationale: Kirai hiki kinaeleza mji uliolindwa kwa ngome. “Mji wenye ngome” ni cha kawaida na huepuka maana ya mji unaozingirwa.
- source_word: נָחַנִי
  choice: atakayeniongoza
  rationale: Kutoka נחה, ‘kuongoza.’ Ingawa umbo linaweza kueleweka kama timilifu, usambamba wa kishairi unaruhusu swali lenye mwelekeo wa wakati ujao.
- source_word: עַד אֱדוֹם
  choice: mpaka Edomu
  rationale: עַד huonyesha kikomo au mwisho wa safari; “mpaka Edomu” huhifadhi maana hiyo kwa Kiswahili cha asili.
- source_word: אֱדוֹם
  choice: Edomu
  rationale: Jina la mahali limetolewa kwa umbo lililozoeleka katika Kiswahili.
