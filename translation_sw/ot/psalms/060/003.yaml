  yaml_path: translation/ot/psalms/060/003.yaml
  text: You have shown your people hard things[a]; you have made us drink wine of staggering.
translation:
  language: sw
  text: Umewaonyesha watu wako mambo magumu; umetunywesha divai inayotufanya tuyumbe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “divai ya kulewesha”; au, “divai ya kuchanganya akili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְאִיתָה
  choice: Umewaonyesha
  rationale: Hifili ya ראה humaanisha ‘kusababisha kuona’ au ‘kuonyesha.’ ‘Umewaonyesha’ inadumisha tamathali ya Kiebrania huku ikieleweka kuwa Mungu amewapitisha watu wake katika hali hizo.
- source_word: עַמְּךָ
  choice: watu wako
  rationale: עַם hapa inarejelea jamii ya watu wa Mungu; ‘watu wako’ ni tafsiri ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: קָשָׁה
  choice: mambo magumu
  rationale: Kivumishi hiki kimetumiwa kama nomino kueleza mambo au hali kali walizopitia. ‘Mambo magumu’ huhifadhi ufupi na upana wa maana bila kubainisha aina fulani ya mateso.
- source_word: הִשְׁקִיתָנוּ
  choice: umetunywesha
  rationale: Hifili ya שקה ina maana ya kumpa au kumsababisha mtu anywe. ‘Umetunywesha’ huwasilisha kwa ufupi tendo hilo la kusababisha.
- source_word: יַיִן
  choice: divai
  rationale: Maana ya kawaida ya יַיִן ni ‘divai’; hapa neno hilo linadumishwa katika picha ya kishairi badala ya kufafanuliwa kuwa mateso.
- source_word: תַּרְעֵלָה
  choice: inayotufanya tuyumbe
  rationale: Nomino hii huonyesha kuyumba, kulewa, au kuchanganyikiwa. Kishazi hiki ni cha kawaida katika Kiswahili na kinaeleza athari ya divai katika picha ya kishairi.
theological_decisions:
- issue: Maana ya kishairi ya ‘divai’
  choice: Kudumisha picha ya Mungu kuwanywesha watu wake divai inayowafanya wayumbe, ikionyesha hali kali ya kuhukumiwa na kufadhaika.
  alternative: Kutafsiri moja kwa moja kuwa Mungu amewaletea mateso au kuchanganyikiwa, au kuelewa kuwa ni divai halisi.
  rationale: Usambamba na ‘mambo magumu’ pamoja na matumizi ya kibiblia ya divai inayowafanya watu wayumbe unaunga mkono maana ya kishairi. Tafsiri haiondoi picha hiyo wala kuifungia katika ufafanuzi mmoja pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi kama mstari wa Kiebrania; ‘mambo magumu’ na ‘divai inayotufanya tuyumbe’ ni wazi kwa msomaji wa kawaida huku zikidumisha lugha ya kishairi.
