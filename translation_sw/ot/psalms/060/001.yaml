  text: אֱ֭לֹהִים זְנַחְתָּ֣/נוּ פְרַצְתָּ֑/נוּ אָ֝נַ֗פְתָּ תְּשׁ֣וֹבֵ֥ב לָֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/001.yaml
  text: God[a], you have rejected us; you have broken us through; you have been angry[b]. Restore us.
translation:
  language: sw
  text: Ee Mungu, umetukataa; umetupasua; umekuwa na hasira. Uturejeshe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uturudie.” Kiebrania kinaweza kumaanisha Mungu kuwarejesha watu wake au yeye mwenyewe kuwarudia.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Nomino hii inatumika kama mwito wa moja kwa moja. “Ee Mungu” ni ya asili, yenye heshima, na inaonyesha wazi nguvu ya mwito katika Kiswahili.
- source_word: זְנַחְתָּנוּ
  choice: umetukataa
  rationale: Kitenzi hiki humaanisha kukataa au kutupilia mbali. “Umetukataa” ni wazi na huhifadhi wazo la Mungu kuwatenga watu wake.
- source_word: פְרַצְתָּנוּ
  choice: umetupasua
  rationale: Mzizi פרץ una picha ya kuvunja au kupenya kwa nguvu na kuacha ufa. “Umetupasua” huhifadhi ukali na picha ya mgawanyiko bila kuongeza kitu kama ukuta ambacho hakitajwi wazi katika Kiebrania.
- source_word: אָנַפְתָּ
  choice: umekuwa na hasira
  rationale: Kauli hii huonyesha hasira ya Mungu kama hali inayoambatana na matendo yaliyotangulia. Kiswahili hiki ni cha kawaida na hakiongezi nguvu isiyokuwamo kama “umefoka.”
- source_word: תְּשׁוֹבֵב לָנוּ
  choice: Uturejeshe
  rationale: Ombi hili linaweza kueleweka kuwa kuwarejesha watu katika hali yao au Mungu kuwarudia. “Uturejeshe” ni ombi fupi na la asili; uwezekano wa maana nyingine umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya ombi la mwisho תְּשׁוֹבֵב לָנוּ
  choice: Ombi kwamba Mungu awarejeshe watu wake baada ya hukumu
  alternative: Ombi kwamba Mungu awarudie watu wake
  rationale: Muundo wa Kiebrania una nafasi ya kueleweka kama kurejeshwa kwa watu au kurudi kwa Mungu kwao. Matini kuu inatumia “Uturejeshe” kwa mtiririko wa maombolezo, lakini tanbihi inalinda utata huo wa kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. Vipashio vifupi vilivyotenganishwa kwa alama za nusu-koloni vinaendeleza msisitizo wa maombolezo ya Kiebrania.
