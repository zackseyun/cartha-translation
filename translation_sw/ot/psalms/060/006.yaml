base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/006.yaml
  text: 'God has spoken in his holiness: “I will exult[a]; I will divide up Shechem[b], and measure out the Valley of Succoth.”'
translation:
  language: sw
  text: 'Mungu amesema katika utakatifu wake[a]: “Nitashangilia[b]; nitagawa Shekemu, nami nitalipima Bonde la Sukothi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali pake patakatifu,” au “kwa utakatifu wake.” Kirai cha Kiebrania kinaweza kumaanisha utakatifu wa Mungu mwenyewe au eneo la uwepo wake mtakatifu.
    reason: lexical_alternative
  - marker: b
    text: Wengine wanaelewa “Nitashangilia” kuwa jibu la mtunga zaburi kwa maneno ya Mungu, badala ya kuwa sehemu ya tamko la Mungu mwenyewe.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la nomino ni la wingi kisarufi, kitenzi cha umoja דִּבֶּר kinaonyesha wazi kuwa hapa anatajwa Mungu mmoja wa Israeli.
- source_word: דִּבֶּר
  choice: amesema
  rationale: Kauli timilifu ya Kiebrania inaripoti tamko la Mungu lililokamilika lakini lenye umuhimu wa sasa; “amesema” ni ya kawaida na ya wazi katika Kiswahili.
- source_word: בְּקָדְשׁוֹ
  choice: katika utakatifu wake
  rationale: Tafsiri hii inadumisha ufupi na uwezekano wa kirai hicho kurejelea utakatifu wa Mungu au eneo la uwepo wake mtakatifu bila kukifanya kiwe hekalu moja kwa moja.
- source_word: אֶעְלֹזָה
  choice: Nitashangilia
  rationale: Kitenzi kinaonyesha furaha kubwa ya ushindi; “nitashangilia” ni lugha ya sasa, inayoeleweka, na inadumisha nguvu ya kauli hiyo.
- source_word: אֲחַלְּקָה
  choice: nitagawa
  rationale: Katika muktadha wa kumiliki nchi, kitenzi kinamaanisha kugawa au kutenga eneo; “nitagawa” kinadumisha picha hiyo bila kuongeza mpokeaji asiyetajwa.
- source_word: שְׁכֶם
  choice: Shekemu
  rationale: Jina la mahali limetolewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: וְעֵמֶק סֻכּוֹת
  choice: Bonde la Sukothi
  rationale: Kirai cha Kiebrania kinataja eneo la kijiografia linalohusishwa na Sukothi; tafsiri inadumisha jina la mahali na aina ya eneo.
- source_word: אֲמַדֵּד
  choice: nitalipima
  rationale: Kitenzi kina picha ya kupima eneo, huku muktadha ukidokeza kulipanga au kulitenga; kiambishi “-li-” kinarejelea bonde kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Mabadiliko ya msemaji na mipaka ya nukuu
  choice: 'Maneno yanayofuata utangulizi yamewasilishwa kama kauli ya moja kwa moja ya Mungu: “Nitashangilia; nitagawa...”'
  alternative: Mtunga zaburi ndiye anayesema “Nitashangilia” kwa kuitikia neno la Mungu, kisha kauli ya Mungu inaanza na “nitagawa.”
  rationale: Mfuatano wa vitenzi vya nafsi ya kwanza na lugha ya kugawa na kupima nchi unaunga mkono zaidi kuyaona yote kama sehemu ya tamko la Mungu kuhusu mamlaka yake juu ya nchi. Hata hivyo, mipaka ya nukuu haijaonyeshwa katika Kiebrania, kwa hiyo uwezekano mwingine umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Majina “Shekemu” na “Sukothi” yanafuata maumbo yaliyozoeleka katika matumizi ya Biblia ya Kiswahili. Alama za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
