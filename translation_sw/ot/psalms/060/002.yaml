translation:
  language: sw
  text: Umeitikisa dunia; umeipasua. Ponya nyufa zake[a], kwa maana dunia inayumba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nchi” badala ya “dunia.” Neno la Kiebrania אֶרֶץ linaweza kumaanisha dunia nzima au nchi fulani; muktadha wa kishairi unaruhusu maana zote mbili.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְעַשְׁתָּה
  choice: umeitikisa
  rationale: Hifili ya רָעַשׁ ina maana ya kusababisha kutikisika. “Umeitikisa” ni Kiswahili cha kawaida kinachohifadhi nguvu ya kisababishi na picha ya tetemeko.
- source_word: אֶרֶץ
  choice: dunia
  rationale: אֶרֶץ inaweza kumaanisha dunia au nchi. “Dunia” inafaa picha pana ya kishairi, huku tanbihi ikihifadhi uwezekano wa “nchi.”
- source_word: פְּצַמְתָּהּ
  choice: umeipasua
  rationale: Kitenzi kinaonyesha kuvunja au kupasua. “Umeipasua” huendeleza kwa uwazi taswira ya ardhi iliyofunguka na yenye nyufa.
- source_word: רְפָה
  choice: ponya
  rationale: Ni amri ya רָפָא, ‘ponya.’ Inadumisha uhuishaji wa kishairi wa dunia badala ya kupunguza taswira hiyo kuwa ‘rekebisha.’
- source_word: שְׁבָרֶיהָ
  choice: nyufa zake
  rationale: שֶׁבֶר inaweza kutaja mipasuko, sehemu zilizovunjika, au mianya. “Nyufa” inaendana kwa kawaida na taswira ya tetemeko na ombi la kuziponya.
- source_word: כִי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya ombi lililotangulia. “Kwa maana” ni wazi na kinafaa sajili ya kishairi yenye hadhi.
- source_word: מָטָה
  choice: inayumba
  rationale: Kitenzi huonyesha kuinama, kuyumba, au kuwa karibu kuanguka. “Inayumba” huhifadhi hali ya kutokuwa imara inayoendelea bila kudai kwamba tayari imeanguka.
