base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/008.yaml
  text: Moab is my washbasin[a]; on Edom I cast my sandal; over Philistia[b], shout in triumph for me.
translation:
  language: sw
  text: Moabu ni beseni langu la kuogea[a]; juu ya Edomu nitatupa kiatu changu; Ee Ufilisti, piga kelele juu yangu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Beseni la kuogea” pia limetafsiriwa “chungu cha kuogea.” Picha hii inaonyesha kudhalilishwa na kutiishwa.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania cha sehemu hii ni kigumu. Maandishi ya Kimasora yanaweza kueleweka, “Ee Ufilisti, piga kelele juu yangu,” huenda kama amri ya kejeli. Wengine huelewa maneno haya kama tamko la nafsi ya kwanza: “Juu ya Ufilisti nitapiga kelele za ushindi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: סִיר רַחְצִי
  choice: beseni langu la kuogea
  rationale: Neno סִיר hutaja chombo au beseni, na רַחְצִי hulihusianisha na kuogea au kujiosha. “Beseni langu la kuogea” ni Kiswahili cha sasa kinachodumisha picha ya kudhalilishwa na kutiishwa.
- source_word: אַשְׁלִיךְ נַעֲלִי
  choice: nitatupa kiatu changu
  rationale: Kitenzi שלך katika Hiphil humaanisha kutupa, na נַעַל ni kiatu. “Kiatu” ni neno la kawaida na linaloeleweka kote Afrika Mashariki; wakati ujao unafaa kwa umbo la kitenzi katika tangazo hili la kishairi.
- source_word: עַל אֱדוֹם
  choice: juu ya Edomu
  rationale: Tafsiri hii inadumisha picha ya kutupa kiatu juu ya Edomu kama ishara ya mamlaka na kutiishwa.
- source_word: עָלַי פְּלֶשֶׁת
  choice: Ee Ufilisti ... juu yangu
  rationale: Kisarufi, עָלַי kwa kawaida ni “juu yangu,” na פְּלֶשֶׁת ndiye anayeambiwa kwa umoja wa kike. Mpangilio huu unafuata maandishi ya Kiebrania bila kuhamisha kimya kimya maana kuwa “juu ya Ufilisti ... kwa ajili yangu.”
- source_word: הִתְרֹעָעִי
  choice: nipigie kelele za ushindi
  rationale: Umbo hili ni amri ya nafsi ya pili, umoja wa kike, kutoka mzizi רוע, unaoeleza kupiga kelele kubwa, mara nyingi za vita au ushindi. “Nipigie” huonyesha kwamba Ufilisti ndiye anayeamriwa na kwamba kelele zinaelekezwa juu ya msemaji.
- source_word: מוֹאָב / אֱדוֹם / פְּלֶשֶׁת
  choice: Moabu / Edomu / Ufilisti
  rationale: Haya ni maumbo ya majina ya maeneo na mataifa yaliyozoeleka katika Kiswahili cha Biblia; “Ufilisti” hutaja nchi au taifa, si watu mmoja mmoja.
theological_decisions:
- issue: Nguvu na mhusika wa amri הִתְרֹעָעִי kwa Ufilisti
  choice: “Ee Ufilisti, nipigie kelele za ushindi juu yangu” kama amri ya kejeli au changamoto inayodumisha maandishi ya Kimasora.
  alternative: “Juu ya Ufilisti nitapiga kelele za ushindi,” kwa kufuata usomaji unaofanana na Zaburi 108:9 au kwa kubadili uelewekaji wa umbo la kitenzi.
  rationale: Maandishi ya Kimasora yana amri ya umoja wa kike inayoweza kuelekezwa kwa Ufilisti, na עָלַי humaanisha moja kwa moja “juu yangu.” Katika muktadha wa ushindi wa Mungu, amri hiyo inaweza kuwa ya kejeli au changamoto. Tafsiri haibadili nafsi ya kitenzi, huku tanbihi ikionyesha usomaji mwingine wa kale na wa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Beseni” na “kiatu” yamechaguliwa badala ya maneno ya kizamani au ya kikanda. Vihisishi na mpangilio wa mstari wa mwisho vinaweka wazi anayesemeshwa bila kufuta ugumu halisi wa Kiebrania.
