  text: You have given a banner to those who fear you[a], to be raised up because of the truth[b]. Selah
translation:
  language: sw
  text: 'Umewapa wanaokucha bendera[a],

    ili inuliwe kwa sababu ya ukweli.[b]

    Sela'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ili ionyeshwe,” “ili watu wajikusanye,” au, yawezekana, “ili wakimbie.” Kitenzi cha Kiebrania ni kigumu na kinabishaniwa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania qoshet huenda zaidi linamaanisha “ukweli” au “uaminifu”; baadhi ya matoleo ya kale na wafasiri huuelewa usemi huu kwa namna tofauti, na hivyo kupata maana kama “kwa sababu ya upinde.”
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתָּה
  choice: Umewapa
  rationale: Kitenzi cha Qal timilifu, nafsi ya pili umoja wa kiume, kinamwelekea Mungu. Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika lenye umuhimu wa sasa.
- source_word: לִירֵאֶיךָ
  choice: wale wanaokuogopa
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya kumcha Mungu kwa heshima, si hofu tupu.
- source_word: נֵס
  choice: bendera
  rationale: Neno hilo humaanisha ishara au bendera iliyoinuliwa; “bendera” ni la kawaida na linadumisha taswira ya hadharani au ya kijeshi.
- source_word: לְהִתְנוֹסֵס
  choice: ili inuliwe
  rationale: Kitenzi hiki ni kigumu na kinabishaniwa. Katika muktadha wa נֵס, maana ya bendera kuinuliwa inaendana vizuri na taswira, huku maana nyingine zikihifadhiwa katika tanbihi.
- source_word: מִפְּנֵי
  choice: kwa sababu ya
  rationale: Ingawa kimsingi kinaweza kumaanisha “mbele ya” au “kutoka mbele ya,” hapa uhusiano wa kisababishi unatoa Kiswahili cha asili kinacholingana na muktadha.
- source_word: קֹשֶׁט
  choice: ukweli
  rationale: Hili ni umbo la kishairi linaloelekea kumaanisha ukweli au uaminifu. “Ukweli” hudumisha maana ya msingi bila kulazimisha ufafanuzi mwembamba.
- source_word: סֶלָה
  choice: Sela
  rationale: Limeendelezwa kwa unukuzi kwa sababu ni alama ya kiliturujia au kimuziki ambayo maana yake kamili haijulikani.
