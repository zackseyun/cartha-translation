  text: Look[a], they pour out from their mouths; swords are on their lips, for they say[b], “Who hears?”
translation:
  language: sw
  text: Tazama[a], wanabubujisha kutoka vinywani mwao; panga ziko kwenye midomo yao, kwa maana wanasema[b], “Ni nani anayesikia?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tazama, wanabubujisha vinywani mwao”; kitenzi cha Kiebrania huleta picha ya usemi unaobubujika au kumiminika.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema tu, “Ni nani anayesikia?” Kitu kinachosikiwa hakijatajwa, hivyo dai lao la kiburi linaachwa wazi kimakusudi.
