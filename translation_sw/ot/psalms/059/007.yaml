lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni chembe ya kuvuta uangalifu; “Tazama” inadumisha nguvu yake ya kuelekeza msomaji kwa lugha ya heshima na inayoeleweka.
- source_word: יַבִּיעוּן
  choice: maneno yanabubujika
  rationale: Hifili ya נבע huonyesha kitu kinachobubujika au kumiminika. Kwa kuwa kinachotoka vinywani ni usemi, “maneno yanabubujika” huifanya picha iwe ya kawaida kwa Kiswahili bila kupunguza nguvu yake.
- source_word: בְּפִיהֶם
  choice: vinywani mwao
  rationale: Ingawa ב inaweza kuwa “katika/kwa,” pamoja na kitenzi cha kububujika, Kiswahili “vinywani mwao” huonyesha kwa kawaida mahali maneno yanapotokea.
- source_word: חֲרָבוֹת
  choice: panga
  rationale: Nomino hii kwa kawaida humaanisha panga. Hapa ni sitiari ya maneno yenye kudhuru, nayo imehifadhiwa badala ya kufasiriwa kuwa “maangamizi” au “maneno makali.”
- source_word: בְּשִׂפְתוֹתֵיהֶם
  choice: midomoni mwao
  rationale: Usemi huu ni wa kawaida kwa Kiswahili na unahifadhi ulinganifu wa kishairi na “vinywani mwao,” huku ukionyesha panga kama maneno yaliyo tayari kutamkwa.
- source_word: כִּי
  choice: kwa maana wanasema
  rationale: Kiunganishi kinatanguliza msingi wa kiburi chao. “Wanasema” limeongezwa ili kutambulisha wazi swali linalofuata, bila kulifanya kuwa sehemu ya maandishi ya Kiebrania isiyotajwa.
- source_word: מִי שֹׁמֵעַ
  choice: Ni nani anayesikia?
  rationale: Kirai cha Kiebrania ni kifupi na hakitaji kitu kinachosikiwa. Wakati uliopo wa “anayesikia” unaakisi umbo la kitenzi kishirikishi na kudumisha nguvu ya swali la kejeli.
theological_decisions:
- issue: Kitu kisichotajwa kinachosikiwa katika swali la kejeli
  choice: “Ni nani anayesikia?” bila kutaja kitu kinachosikiwa
  alternative: “Ni nani anayetusikia?” au “Ni nani anayesikia hayo?”
  rationale: Kiebrania hakitaji yule au kile kinachosikiwa. Kuacha swali wazi kunadumisha kiburi chao kana kwamba hakuna yeyote—hata Mungu—anayesikia, bila kuingiza kitu ambacho hakipo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na wa kishairi. “Maneno” limewekwa wazi ili kitenzi cha kububujika kiwe cha kawaida katika Kiswahili, huku “panga” likibaki katika kishazi kinachofuata kama ilivyo katika muundo wa Kiebrania. Alama zote za tanbihi [a] na [b] zimo katika matini kuu.
