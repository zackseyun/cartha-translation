  text: Without guilt[a], they run and set themselves in place; awake to meet me and see.
translation:
  language: sw
  text: Bila kosa langu, wanakimbia na kujipanga[a]; amka, unilaki, uone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanakimbia na kujisimamisha mahali pao.” Kitenzi cha pili kinaweza kumaanisha kujisimamisha imara au kujiandaa kwa tendo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלִי עָוֺן
  choice: Bila hatia
  rationale: Kirai hiki huonyesha kutokuwapo kwa hatia; katika muktadha huu mtunga zaburi anasisitiza kwamba hajafanya kosa linalosababisha mashambulizi yao.
- source_word: יְרוּצוּן
  choice: wanakimbia
  rationale: Huhifadhi picha halisi ya kukimbia au kwenda kwa haraka iliyo katika mzizi רוץ.
- source_word: וְיִכּוֹנָנוּ
  choice: na kujiweka tayari
  rationale: Kitenzi kinaweza kumaanisha kujisimamisha mahali au kujiandaa kwa tendo; Kiswahili hiki ni cha kawaida na bado kinahifadhi wazo la kujitayarisha.
- source_word: עוּרָה
  choice: amka
  rationale: Huhifadhi amri na sitiari ya kishairi inayomwomba Mungu aingilie kati.
- source_word: לִקְרָאתִי
  choice: unijie
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha tendo la kuja kumlaki msemaji, bila kuongeza waziwazi wazo la msaada ambalo linaeleweka kutokana na muktadha.
- source_word: וּרְאֵה
  choice: uone
  rationale: Huhifadhi amri fupi na ya moja kwa moja ya Kiebrania.
theological_decisions:
- issue: Amri ya kibinadamu inayomwelezea Mungu kana kwamba amelala
  choice: Kuhifadhi sitiari “amka”
  alternative: Inuka; jiamshie
  rationale: Lugha ya maombi ya maombolezo humwomba Mungu achukue hatua. “Amka” huhifadhi nguvu ya kishairi na mvutano wa kitheolojia bila kudai kwamba Mungu amelala kihalisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo ni mfupi ili kuhifadhi kasi ya mstari wa Kiebrania; “unijie” ni wa asili zaidi kuliko tafsiri ya neno kwa neno “uje kunilaki.”
