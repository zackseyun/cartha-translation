  source_fidelity: The two imperative pleas and both prepositional phrases are represented. However, "na watendao uovu" does not clearly express the Hebrew separative force "from," and "watu wa damu" is not a sufficiently established natural Swahili idiom for violent, bloodguilty people.
  naturalness: '"Watenda maovu" and "watu wa kumwaga damu" are clear, current Standard East African Swahili. Repeating "kutoka kwa" makes the parallel Hebrew pleas unambiguous and natural.'
  terminology: '"Uninusuru" and "uniokoe" fittingly retain the source''s paired rescue/save verbs. "Watu wa kumwaga damu" idiomatically conveys אַנְשֵׁי דָמִים without introducing a doctrinal interpretation; the footnote preserves the literal Hebrew image and its semantic range.'
  issues:
