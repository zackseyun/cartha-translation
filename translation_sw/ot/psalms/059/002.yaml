  text: הַ֭צִּילֵ/נִי מִ/פֹּ֣עֲלֵי אָ֑וֶן וּֽ/מֵ/אַנְשֵׁ֥י דָ֝מִ֗ים הוֹשִׁיעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/002.yaml
  text: Deliver me from workers of wickedness[b][a], and save me from men of blood.
translation:
  language: sw
  text: Uninusuru kutoka kwa watenda maovu, na uniokoe kutoka kwa watu wa kumwaga damu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “watu wa damu”; yaani, watu wenye kiu ya damu au walio na hatia ya umwagaji damu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Uninusuru
  rationale: Kitenzi נצל hapa ni ombi la kuondolewa katika hatari. “Uninusuru” ni Kiswahili cha kawaida kinachoonyesha kuokolewa kutoka kwa adui bila kuingiza wazo maalumu la ukombozi wa kidini.
- source_word: מִפֹּעֲלֵי אָוֶן
  choice: na watendao uovu
  rationale: Kirai hiki kihalisi kina maana ya “kutoka kwa watendaji wa uovu.” “Watendao uovu” ni cha asili katika Kiswahili na kinahifadhi muundo wa tendo na maana ya kimaadili ya אָוֶן.
- source_word: וּמֵאַנְשֵׁי דָמִים
  choice: na watu wa damu
  rationale: “Watu wa damu” kinahifadhi tamathali ya Kiebrania inayowataja watu wenye hatia ya umwagaji damu au wenye kiu ya damu; ufafanuzi umetolewa katika tanbihi.
- source_word: הוֹשִׁיעֵנִי
  choice: uniokoe
  rationale: Kitenzi ישׁע kina maana pana ya kuokoa. Katika muktadha wa hatari kutoka kwa maadui, “uniokoe” ni wazi na hakibainishi zaidi ya chanzo.
theological_decisions:
- issue: Maana ya tamathali דָמִים (damu katika wingi)
  choice: watu wa damu
  alternative: watu wamwagao damu; watu wenye kiu ya damu
  rationale: Matini kuu inadumisha tamathali na ukali wa Kiebrania badala ya kuamua kimya kimya ikiwa watu hao tayari wana hatia ya mauaji au wanakusudia kumwaga damu. Tanbihi inaeleza upeo wa maana.
- issue: Umasculini wa אַנְשֵׁי
  choice: watu wa damu
  alternative: wanaume wa damu
  rationale: Ingawa nomino ya Kiebrania ni ya kiume kisarufi, “watu” katika Kiswahili ni tafsiri ya kawaida ya kundi la wanadamu na haifuti dai lolote la muktadha kuhusu utambulisho wao. “Wanaume wa damu” ingesikika isivyo asili na ingeweza kusisitiza jinsia kuliko inavyohitajika hapa.
translation_notes:
  register: Lugha ni ya sasa, yenye heshima na rahisi kueleweka. “Watendao uovu” huhifadhi dhana ya wale wanaotenda uovu kwa mtindo wa asili wa kishairi; “watu wa damu” huhifadhi tamathali ya chanzo na inaelezwa kwa tanbihi.
