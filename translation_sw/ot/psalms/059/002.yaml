    issue: The first hostile group is introduced with "na" rather than an explicit equivalent of "from."
    rationale: The Hebrew מִפֹּעֲלֵי means "from workers/doers of." In this construction, "Uninusuru na watendao uovu" is at best unclear and may be read with the ordinary associative sense of na ("and/with"), rather than the intended separation from danger.
  - severity: medium
    issue: '"Watu wa damu" is unnatural and potentially unclear in contemporary Standard East African Swahili.'
    rationale: Unlike the recognizable Hebrew idiom, the literal Swahili phrase can be misunderstood and does not reliably denote bloodthirsty or bloodguilty people. "Watu wa kumwaga damu" gives the idiomatic sense while the note records the literal expression and its range.
