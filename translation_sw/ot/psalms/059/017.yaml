  yaml_path: translation/ot/psalms/059/017.yaml
  text: O my strength[a], to you I will sing praises, for God is my stronghold, the God of my steadfast love.
translation:
  language: sw
  text: 'Ee nguvu yangu, nitakuimbia sifa,

    kwa maana Mungu ni ngome yangu,

    Mungu wa upendo wangu wa kudumu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mungu wangu mwenye fadhili,” au “Mungu anayenionyesha upendo wa kudumu.” Kiebrania ni, kwa maana halisi, “Mungu wa upendo wangu wa kudumu.”
    reason: alternative_reading
lexical_decisions:
- source_word: עֻזִּי
  choice: Ee nguvu yangu
  rationale: Nomino hii humaanisha ‘nguvu’ au ‘uwezo.’ Katika ushairi huu inatumika kumwita Mungu moja kwa moja; ‘Ee’ huonyesha wazi mwito huo kwa Kiswahili cha kishairi.
- source_word: אֵלֶיךָ
  choice: nitakuimbia
  rationale: Kihusishi אֶל huelekeza tendo kwa mhusika, yaani ‘kwako.’ Kiswahili hutumia kwa kawaida kitenzi ‘kuimbia’ kumaanisha kumwelekezea mtu wimbo, hivyo kiambishi ‘-ku-’ kinahifadhi uelekeo huo kwa njia ya asili.
- source_word: אֲזַמֵּרָה
  choice: nitakuimbia sifa
  rationale: Piel ya זמר katika Zaburi kwa kawaida humaanisha kuimba kwa kusifu, wakati mwingine pamoja na kupiga muziki. ‘Kuimbia sifa’ huweka wazi maana ya ibada bila kuifanya kuwa maelezo marefu.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inatoa sababu ya mwimbaji kuimba sifa. ‘Kwa maana’ huhifadhi uhusiano huo wa kisababishi na inafaa katika ushairi wenye hadhi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania ni la wingi kisarufi, hapa neno hilo linamtaja Mungu wa Israeli kwa maana ya umoja.
- source_word: מִשְׂגַּבִּי
  choice: ngome yangu
  rationale: מִשְׂגָּב ni mahali pa juu na salama pa kujikinga. ‘Ngome yangu’ huwasilisha usalama na ulinzi kwa Kiswahili cha kawaida, ingawa wazo la kuinuka juu halisiki kikamilifu.
- source_word: אֱלֹהֵי חַסְדִּי
  choice: Mungu wa upendo wangu thabiti
  rationale: Muundo wa Kiebrania ni kwa karibu ‘Mungu wa hesed yangu.’ ‘Upendo thabiti’ huwasilisha uaminifu na kudumu kwa חֶסֶד, huku muundo wa kimilikishi ukihifadhi ufupi na utata wa kishairi wa chanzo badala ya kuamua kimya-kimya kuwa ni Mungu anayeonyesha upendo huo.
theological_decisions:
- issue: Maana ya חַסְדִּי kuhusiana na Mungu
  choice: Muundo wa kimilikishi umehifadhiwa kama ‘Mungu wa upendo wangu thabiti.’
  alternative: ‘Mungu wangu mwenye fadhili’ au ‘Mungu anayenionyesha upendo thabiti.’
  rationale: Kiebrania kina usemi mfupi wa kishairi unaoweza kueleza upendo mwaminifu wa Mungu kwa mwimbaji, au Mungu akiwa chanzo na udhihirisho wa upendo huo. Tafsiri kuu haichagui kwa lazima mojawapo ya maana hizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mistari mitatu inafuata vifungu vya kishairi vya Kiebrania. ‘Ee’ hutia wazi mwito, na ‘nitakuimbia sifa’ ni usemi wa asili wa ibada.
