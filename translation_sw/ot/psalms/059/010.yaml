  text: Mungu wa upendo wake wa kudumu[b] atanitangulia[a]; Mungu atanifanya niwaone adui zangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata uwekaji mwingine wa irabu au mapokeo mengine ya tafsiri: “Mungu wangu kwa upendo wake wa kudumu atanitangulia,” au “Mungu wangu wa upendo wa kudumu atanitangulia.”'
    reason: alternative_reading
  - marker: b
