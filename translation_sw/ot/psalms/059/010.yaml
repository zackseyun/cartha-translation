    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי
  choice: Mungu wa
  rationale: Hii ni hali ya muundo tegemezi ya אֱלֹהִים, inayounganisha “Mungu” na nomino inayofuata; “Mungu wa” huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: חסדו
  choice: upendo wake wa kudumu
  rationale: חֶסֶד huonyesha upendo mwaminifu na wa kudumu, au rehema. Tafsiri hii inadumisha wazo la upendo na uthabiti wake bila kufafanua kupita kiasi maana ya agano; kiambishi cha nafsi ya tatu umoja wa kiume kimehifadhiwa kwa “wake.”
- source_word: יְקַדְּמֵנִי
  choice: atanitangulia
  rationale: Kitenzi קדם katika Piel kinaweza kumaanisha kwenda mbele ya mtu, kumjia, au kukutana naye. “Atanitangulia” huhifadhi wazo la Mungu kwenda mbele kwa msaada bila kuongeza maelezo yasiyomo wazi katika maandishi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Jina limerudiwa katika Kiebrania kwa msisitizo; limerudiwa pia badala ya kubadilishwa kuwa kiwakilishi.
- source_word: יַרְאֵנִי
  choice: ataniruhusu niwaone
  rationale: Hiphil ya ראה ina maana ya kusababisha au kuruhusu mtu aone. Kauli hii huhifadhi maana hiyo bila kuingiza wazi wazo la ushindi dhidi ya adui.
- source_word: בְשֹׁרְרָי
  choice: adui zangu
  rationale: Neno hili linamaanisha watu wenye uhasama au wapinzani. “Adui zangu” ni tafsiri wazi na ya kawaida katika muktadha huu.
theological_decisions:
- issue: Kiambishi cha nafsi katika חסדו
  choice: upendo wake wa kudumu
  alternative: Mungu wangu kwa upendo wake wa kudumu / Mungu wangu wa upendo wa kudumu
  rationale: Uwekaji wa irabu wa Kimasedi katika WLC unaonyesha kiambishi cha nafsi ya tatu umoja, “wake,” na hivyo kutoa usemi usio wa kawaida, “Mungu wa upendo wake wa kudumu.” Mapokeo mengine ya uwekaji irabu au tafsiri yanaelewa neno la kwanza kuwa “Mungu wangu.” Maandishi makuu yanafuata WLC, huku uwezekano huo muhimu ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Muundo usio wa kawaida “Mungu wa upendo wake wa kudumu” umehifadhiwa kwa sababu unatokana moja kwa moja na WLC; tanbihi inaonyesha usomaji mwingine unaojulikana. Alama zote za tanbihi zimewekwa katika maandishi makuu.
