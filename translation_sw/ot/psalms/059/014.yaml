  text: They return at evening[c][b][a]; they growl like dogs and prowl around the city.
translation:
  language: sw
  text: Wanarudi jioni; wananguruma kama mbwa, na wanauzunguka mji.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשׁוּבוּ
  choice: Wanarudi
  rationale: Kitenzi שוב humaanisha kurudi; wakati wa sasa wa mazoea unaonyesha tendo lao linalojirudia bila kuongeza kusudi lisilotajwa.
- source_word: לָעֶרֶב
  choice: jioni
  rationale: עֶרֶב ni wakati wa jioni; Kiswahili cha kawaida hakihitaji kihusishi hapa.
- source_word: יֶהֱמוּ
  choice: wananguruma
  rationale: המה huonyesha kutoa sauti kubwa ya kinyama, kama kunguruma au kuvuma. 'Wananguruma' huhifadhi upana wa sauti hiyo na inafaa katika tashbihi ya mbwa.
- source_word: כַכָּלֶב
  choice: kama mbwa
  rationale: Umoja wa Kiebrania umetumiwa kimajumui katika tashbihi. 'Mbwa' katika Kiswahili lina umbo lilelile katika umoja na wingi, hivyo tafsiri ni ya kawaida huku ikihifadhi utata wa idadi.
- source_word: וִיסוֹבְבוּ
  choice: na kuzunguka
  rationale: סבב humaanisha kwenda au kuzunguka. Tafsiri hii huhifadhi kitendo cha msingi bila kuongeza waziwazi wazo la kuwinda.
- source_word: עִיר
  choice: mjini
  rationale: עִיר ni mji; 'mjini' hutoa kwa asili maana ya kuzunguka ndani au katika eneo la mji unaojulikana katika muktadha.
