  text: They return at evening[c][b][a]; they growl like dogs and go around the city.
translation:
  language: sw
  text: Wao hurudi jioni; wananguruma kama mbwa[a] na kuzunguka mjini[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanapiga yowe kama mbwa.” Kitenzi cha Kiebrania kinaweza kumaanisha kutoa sauti kubwa kama ya mnyama.
    reason: lexical_alternative
  - marker: b
    text: Au, “na kuzurura mjini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: wao hurudi
  rationale: Kitenzi cha Kiebrania kina maana ya kurudi; hali ya sasa ya mazoea inafaa katika maelezo haya ya kishairi yanayorudiwa.
- source_word: לָעֶרֶב
  choice: jioni
  rationale: Kirai hiki huonyesha wakati; ‘jioni’ ni cha kawaida na cha moja kwa moja katika Kiswahili.
- source_word: יֶהֱמוּ
  choice: wananguruma
  rationale: Kitenzi kinaweza kumaanisha kutoa sauti kubwa kama ya mnyama. ‘Kunuruma’ huhifadhi picha ya sauti ya kutisha bila kuibana kuwa kulia pekee.
- source_word: כַכָּלֶב
  choice: kama mbwa
  rationale: Nomino ya umoja katika Kiebrania imetumiwa kwa maana ya jumla; ‘mbwa’ katika Kiswahili inaweza pia kuwa na maana ya umoja au ya kundi kulingana na muktadha.
- source_word: וִיסוֹבְבוּ
  choice: na kuzunguka
  rationale: Mzizi סבב humaanisha kwenda kuzunguka au kuzunguka-zunguka. Tafsiri hii haiingizi dhana ya ziada ya kuvizia.
- source_word: עִיר
  choice: mjini
  rationale: Muktadha unaelekeza kwenye mji maalumu unaozungumziwa; ‘mjini’ ni usemi wa asili wa Kiswahili kwa mwendo ndani au kandokando ya mji.
