    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: niokoe
  rationale: Kitenzi נצל katika Hifili ya amri pamoja na kiambishi cha nafsi ya kwanza umoja huomba kuondolewa katika hatari. “Niokoe” ni ombi la kawaida na lenye nguvu katika Kiswahili bila kulazimisha maana pana ya kitheolojia.
- source_word: מֵאֹיְבַי
  choice: kutoka kwa adui zangu
  rationale: אֹיֵב humaanisha adui, na kihusishi מִן kinaonyesha kuondolewa au kutenganishwa nao.
- source_word: אֱלֹהָי
  choice: Ee Mungu wangu
  rationale: Ni mwito wa moja kwa moja wenye kiambishi cha umilikaji cha nafsi ya kwanza umoja. “Ee” huweka wazi mwito huo kwa Kiswahili cha heshima na cha kawaida.
- source_word: מִּמִתְקוֹמְמַי
  choice: mbali na wale wanaoniinukia
  rationale: Umbo la קום hapa linawataja watu wanaojiweka dhidi ya msemaji. “Wale wanaoniinukia” huhifadhi taswira ya kuinuka dhidi yake, huku “mbali na” ikihusisha kishazi hiki na usalama unaotokana na kuwekwa juu.
- source_word: תְּשַׂגְּבֵנִי
  choice: uniweke juu
  rationale: שגב katika Pieli inaweza kumaanisha kumweka mtu mahali pa juu pasipofikika na hivyo kumlinda. Tafsiri hii huhifadhi taswira halisi ya kuinuliwa na kuacha maana ya ulinzi idokezwe na muktadha.
theological_decisions:
- issue: Mwito wa Mungu katika אֱלֹהָי
  choice: Ee Mungu wangu
  alternative: Mungu wangu
  rationale: Maneno yote mawili yanaakisi umilikaji wa kibinafsi; “Ee” huonyesha wazi kuwa ni mwito bila kuongeza dai la kimadhehebu.
- issue: Maana ya ulinzi katika תְּשַׂגְּבֵנִי
  choice: uniweke juu
  alternative: unilinde
  rationale: “Uniweke juu” huhifadhi sitiari ya Kiebrania ya mahali palipoinuka na pasipofikika, huku “unilinde” ikitoa maana inayodokezwa lakini kupoteza picha ya kishairi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa mwito umefanywa wa asili kwa Kiswahili, na sitiari ya kuwekwa juu imehifadhiwa bila maelezo ya ziada ndani ya mstari.
