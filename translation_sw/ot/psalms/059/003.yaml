  text: כִּ֤י הִנֵּ֪ה אָֽרְב֡וּ לְ/נַפְשִׁ֗/י יָג֣וּרוּ עָלַ֣/י עַזִ֑ים לֹא פִשְׁעִ֖/י וְ/לֹא חַטָּאתִ֣/י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/003.yaml
  text: For look, they lie in wait for my life; fierce men gather against me, for no transgression or sin of mine, O LORD.
translation:
  language: sw
  text: Kwa maana, tazama, wanavizia uhai wangu; watu wenye nguvu wanakusanyika dhidi yangu, si kwa sababu ya kosa langu wala dhambi yangu, Ee BWANA.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: tazama
  rationale: Kihisishi hiki kinavuta fikira kwenye hatari iliyo mbele ya mtunga zaburi; “tazama” ni cha heshima na kinaeleweka katika Kiswahili sanifu.
- source_word: אָרְבוּ לְנַפְשִׁי
  choice: wanavizia uhai wangu
  rationale: Katika muktadha wa tishio la kuuawa, נֶפֶשׁ humaanisha uhai wa msemaji, na kitenzi אָרַב huonyesha kuvizia kwa nia ya kushambulia.
- source_word: יָגוּרוּ עָלַי
  choice: wanakusanyika dhidi yangu
  rationale: Kitenzi kinaeleza kukusanyika kwa uhasama, huku עָלַי ikionyesha kuwa mkusanyiko huo unaelekezwa dhidi ya msemaji.
- source_word: עַזִּים
  choice: watu wenye nguvu
  rationale: Neno linaweza kumaanisha wenye nguvu au wakali; “wenye nguvu” huhifadhi maana ya msingi bila kuongeza sifa isiyo ya lazima.
- source_word: פִשְׁעִי ... חַטָּאתִי
  choice: kosa langu ... dhambi yangu
  rationale: Maneno hayo yanatofautisha uasi/kosa na dhambi; tafsiri hii inadumisha jozi hiyo kwa lugha ya kawaida na ya heshima.
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea ya Biblia za Kiswahili ya kuwakilisha jina la agano YHWH kwa herufi kubwa.
theological_decisions:
- issue: Kauli ya mtunga zaburi kuhusu kutokuwa na kosa au dhambi
  choice: si kwa sababu ya kosa langu wala dhambi yangu
  alternative: ingawa sina kosa wala dhambi
  rationale: Muundo wa Kiebrania una vipashio vya ukanushi bila kiunganishi wazi. Chaguo hili linaunganisha kutokuwa na kosa na mashambulizi hayo kama sababu isiyokuwapo, bila kugeuza mstari kuwa madai ya jumla kwamba msemaji hana dhambi kabisa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa kwa vipashio viwili vinavyoeleza tishio, vikifuatiwa na tamko la kutokuwa na hatia katika jambo hili na mwito kwa BWANA.
