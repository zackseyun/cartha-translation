base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/008.yaml
  text: But you[a], O Yahweh, laugh at them; you mock all the nations.
translation:
  language: sw
  text: Lakini wewe, Ee Yahweh, utawacheka; utayadhihaki mataifa yote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Lakini wewe
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha mgeuko wa kulinganisha; “Lakini wewe” ni Kiswahili cha kawaida kinachowasilisha nguvu hiyo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne linatunzwa kama jina binafsi “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: תִּשְׂחַק לָ/מוֹ
  choice: unawacheka
  rationale: Kitenzi kinamaanisha kucheka, na kihusishi chenye kiambishi kinaonyesha wale wanaoelekezewa kicheko; “unawacheka” inadumisha picha halisi kwa Kiswahili cha asili.
- source_word: תִּלְעַג
  choice: unayadhihaki
  rationale: Kitenzi kina maana ya kudhihaki au kubeza; “unayadhihaki” ni wazi, cha sasa, na chenye uzito unaofaa.
- source_word: לְ/כָל גּוֹיִם
  choice: mataifa yote
  rationale: גּוֹיִם hapa ni mataifa kwa upana, si lazima ‘Wamataifa’ kama istilahi maalumu; mpangilio huu ni wa kawaida katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Ee Yahweh
  alternative: Ee Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu moja kwa moja; “Yahweh” hulihifadhi kwa kulinakili badala ya kuweka cheo mahali pake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mwito “Ee Yahweh” unafaa katika ushairi na sala; ulinganifu wa vishazi viwili umehifadhiwa.
