  text: עֻ֭זּ/וֹ אֵלֶ֣י/ךָ אֶשְׁמֹ֑רָה כִּֽי אֱ֝לֹהִ֗ים מִשְׂגַּבִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/009.yaml
  text: O my strength[a], I will watch for you[c][b], for God is my stronghold.
translation:
  language: sw
  text: 'Nguvu yake[a]—nitakutazamia[b],

    kwa maana Mungu ni ngome yangu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata ufafanuzi wa kawaida wa kimapokeo: “Ee nguvu zangu, nitakutazamia.” Wengine pia huelewa kitenzi cha mwisho kuwa “nitakuimbia.”'
    reason: alternative_reading
  - marker: b
    text: “Nitakutazamia” pia inaweza kueleweka kuwa “nitakungoja” au “nitakesha nikikutazama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻזּוֹ
  choice: Nguvu yake
  rationale: Maandishi ya Kimasoreti yaliyotolewa yana kiambishi cha nafsi ya tatu umoja, hivyo maana yake ya moja kwa moja ni “nguvu yake.” Ingawa mwanzo huu ni wa ghafla na mgumu, umehifadhiwa katika andiko kuu badala ya kubadilishwa kimya kimya kuwa usemi wa kumwita Mungu.
- source_word: אֵלֶיךָ אֶשְׁמֹרָה
  choice: nitakutazamia
  rationale: Kirai hiki kinaelekeza tendo la kutazama kwa Mungu. “Nitakutazamia” ni Kiswahili cha kawaida kinachoweza kuonyesha kumwelekea Mungu kwa macho na kwa matarajio, huku tanbihi ikihifadhi maana nyingine zinazowezekana za mzizi שׁמר.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa neno hili linatanguliza sababu ya mtunga zaburi kumtazamia Mungu.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa Mungu wa Israeli katika muktadha huu.
- source_word: מִשְׂגַּבִּי
  choice: ngome yangu
  rationale: Neno hili linamaanisha mahali palipoinuka na salama pa ulinzi; “ngome yangu” huhifadhi picha ya usalama na kinga kwa lugha inayoeleweka.
theological_decisions:
- issue: Iwapo עֻזּוֹ itafsiriwe kwa umbo la nafsi ya tatu au kama mwito kwa Mungu
  choice: Nguvu yake
  alternative: Ee nguvu zangu
  rationale: WLC iliyotolewa ina umbo lenye maana ya “nguvu yake.” Usomaji wa kimapokeo unaoelewa kirai hiki kama mwito kwa Mungu una uzito wa kale na wa kimuktadha, lakini haujawekwa katika andiko kuu kwa gharama ya umbo halisi la chanzo; umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Mwanzo mgumu wa Kiebrania umehifadhiwa kwa kutumia kistari, bila kuongeza kiunganishi kinachoweza kuamua maana isiyo wazi.
