source:
  edition: WLC
  text: וַ/אֲנִ֤י אָשִׁ֣יר עֻזֶּ/ךָ֮ וַ/אֲרַנֵּ֥ן לַ/בֹּ֗קֶר חַ֫סְדֶּ֥/ךָ כִּֽי הָיִ֣יתָ מִשְׂגָּ֣ב לִ֑/י וּ֝/מָנ֗וֹס בְּ/י֣וֹם צַר לִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/016.yaml
  text: But I will sing of your strength[a]; I will sing aloud of your steadfast love in the morning, for you have been a stronghold for me[c][b], and a refuge in the day of my distress.
translation:
  language: sw
  text: 'Lakini mimi nitaimba juu ya uweza wako;

    asubuhi nitaimba kwa shangwe[b] juu ya upendo wako wa kudumu[a],

    kwa maana umekuwa ngome yangu

    na mahali pa kukimbilia siku ya dhiki yangu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “upendo wa kudumu” mara nyingi humaanisha upendo mwaminifu unaoonyeshwa kwa matendo.
    reason: lexical_alternative
  - marker: b
    text: Au “nitapaza sauti kwa furaha.” Kitenzi cha Kiebrania kinaweza kumaanisha kuimba kwa shangwe au kupaza sauti kwa furaha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Lakini mimi
  rationale: Kiwakilishi huru pamoja na kiunganishi kinaonyesha tofauti kati ya mtunga zaburi na maadui waliotajwa kabla; “Lakini mimi” huonyesha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: אָשִׁיר עֻזֶּךָ
  choice: nitaimba juu ya uweza wako
  rationale: Kitenzi kinaeleza azimio la kuimba, na עֹז humaanisha nguvu au uweza, hasa uwezo wa Mungu wa kumlinda mwombaji.
- source_word: וַאֲרַנֵּן
  choice: nitaimba kwa shangwe
  rationale: רנן huonyesha sauti kubwa ya furaha, mara nyingi katika sifa ya kuimba. Tafsiri hii inadumisha wazo la muziki na msisimko wa furaha.
- source_word: לַבֹּקֶר
  choice: asubuhi
  rationale: Kirai hiki kinaonyesha wakati na kinapatana na muktadha wa zamu ya usiku katika mistari iliyotangulia.
- source_word: חַסְדֶּךָ
  choice: upendo wako wa kudumu
  rationale: חֶסֶד huonyesha upendo mwaminifu na wa kudumu unaodhihirishwa kwa matendo; uchaguzi huu ni wa kawaida na unaeleweka bila kupunguza maana yake kuwa hisia pekee.
- source_word: כִּי הָיִיתָ
  choice: kwa maana umekuwa
  rationale: כִּי inaanzisha sababu ya sifa, huku kauli timilifu הָיִיתָ ikitaja ulinzi wa Mungu uliothibitishwa zamani na wenye umuhimu unaoendelea.
- source_word: מִשְׂגָּב לִי
  choice: ngome yangu
  rationale: מִשְׂגָּב ni mahali salama palipoinuka au ngome; umilikishi wa Kiswahili unaeleza kwa kawaida kwamba Mungu amekuwa ngome kwa mtunga zaburi.
- source_word: וּמָנוֹס
  choice: na mahali pa kukimbilia
  rationale: מָנוֹס ni mahali ambako mtu hukimbilia ili apate usalama. Kirai hiki kinahifadhi picha ya kukimbia kwenda mahali pa usalama na kukitofautisha na “ngome.”
- source_word: בְּיוֹם צַר לִי
  choice: siku ya dhiki yangu
  rationale: Tafsiri hii inadumisha picha ya Kiebrania ya “siku” kama kipindi cha taabu na pia hali binafsi ya dhiki ya mtunga zaburi.
theological_decisions:
- issue: Maana ya חֶסֶד katika muktadha wa ukombozi wa Mungu
  choice: upendo wako wa kudumu
  alternative: upendo wako mwaminifu; rehema zako
  rationale: Neno hili linajumuisha wema wa Mungu wenye uaminifu na udumifu unaoonekana katika kumwokoa mtu. “Upendo wa kudumu” huwasilisha vipengele hivyo bila kuingiza istilahi ya kimadhehebu au kudai kwamba neno lenyewe linataja wazi agano katika kila matumizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini wa sasa. Mpangilio wa mistari umehifadhi ulinganifu wa kishairi. “Mahali pa kukimbilia” limetumiwa badala ya kurudia neno linalofanana na “ngome,” ili kudumisha tofauti kati ya מִשְׂגָּב na מָנוֹס.
