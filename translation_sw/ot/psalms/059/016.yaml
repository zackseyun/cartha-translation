  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: kiambishi cha utofautishaji katika “Lakini mimi,” azimio la wakati ujao la kuimba, sifa za uweza na hesedi ya Mungu, wakati wa asubuhi, na sababu inayotokana na Mungu kuwa ngome na makimbilio katika dhiki. “Siku ya dhiki yangu” huhifadhi taswira ya זמן/‘siku’ ya Kiebrania na umilikishi wa binafsi.'
