source:
  edition: WLC
  text: אַל תַּהַרְגֵ֤/ם פֶּֽן יִשְׁכְּח֬וּ עַמִּ֗/י הֲנִיעֵ֣/מוֹ בְ֭/חֵילְ/ךָ וְ/הוֹרִידֵ֑/מוֹ מָֽגִנֵּ֣/נוּ אֲדֹנָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/011.yaml
  text: Do not kill them[a], lest my people forget; make them wander by your power and bring them down[b], O Lord our shield.
translation:
  language: sw
  text: Usiwaue, watu wangu wasije wakasahau; wafanye watangetange[a] kwa uwezo wako[b], na uwaangushe, Ee Bwana, ngao yetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwatikise” au “uwafanye wayumbeyumbe.” Kitenzi cha Kiebrania kinaweza kumaanisha kusababisha mwendo usiotulia au hali ya kutokuwa imara.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa nguvu zako.” Neno la Kiebrania linaweza kumaanisha uwezo, nguvu, au nguvu za kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּהַרְגֵם
  choice: Usiwaue
  rationale: Kikanushi אַל pamoja na kitenzi cha hali ya amri huonyesha katazo; ‘Usiwaue’ ni kauli ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: פֶּן יִשְׁכְּחוּ עַמִּי
  choice: watu wangu wasije wakasahau
  rationale: פֶּן huanzisha matokeo yanayohofiwa. Muundo ‘wasije wakasahau’ unatoa maana hiyo kwa Kiswahili cha kawaida huku ukihifadhi ‘watu wangu’ ya Kiebrania.
- source_word: הֲנִיעֵמוֹ
  choice: wafanye watangetange
  rationale: Kitenzi hiki katika kausativi kinaweza kumaanisha kusababisha mwendo usiotulia au kuyumba. ‘Wafanye watangetange’ kinafaa katika muktadha wa hukumu inayoendelea bila kuficha uwezekano wa maana nyingine.
- source_word: בְחֵילְךָ
  choice: kwa uwezo wako
  rationale: חַיִל hapa inaweza kumaanisha nguvu, uwezo, au nguvu za kijeshi. ‘Kwa uwezo wako’ inaeleweka kama njia ambayo Mungu anatumia na haibani maana kuwa jeshi.
- source_word: וְהוֹרִידֵמוֹ
  choice: kisha uwaangushe
  rationale: Hifili ya ירד humaanisha kusababisha washuke. ‘Uwaangushe’ huhifadhi picha ya kushushwa au kudhalilishwa bila kubainisha zaidi namna ya hukumu.
- source_word: מָגִנֵּנוּ
  choice: ngao yetu
  rationale: Maana halisi ni ‘ngao’; taswira hii ya kawaida katika Zaburi imehifadhiwa badala ya kubadilishwa kuwa neno dhahania kama ‘mlinzi.’
- source_word: אֲדֹנָי
  choice: Ee Bwana
  rationale: Hili ni jina la heshima אֲדֹנָי katika usemi wa kumwita Mungu moja kwa moja; ‘Ee Bwana’ huonyesha vizuri hali hiyo ya mwito.
theological_decisions:
- issue: Aina ya hukumu inayoombwa
  choice: Mwandishi anaomba maadui wasiuawe mara moja, bali wawekwe katika hali ya kutotulia na hatimaye waangushwe, ili watu wake wasisahau.
  alternative: Kauli hiyo inaweza kueleweka kwa ujumla kuwa ombi la kuwatikisa au kuwafanya wayumbeyumbe na kuwadhili, bila kudokeza kutangatanga kihalisi.
  rationale: Mfuatano ‘usiwaue … wafanye watangetange … uwaangushe’ unaweka mvutano kati ya kutoua mara moja na hukumu inayoonekana na inayoendelea. Tafsiri na tanbihi zinahifadhi uwezekano wa maana za kitenzi bila kuamua zaidi ya ushahidi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi bila kutumia misamiati ya kizamani. Muundo ‘watu wangu wasije wakasahau’ ni wa asili katika Kiswahili na unaonyesha matokeo yanayohofiwa. ‘Ee Bwana, ngao yetu’ huhifadhi mwito na sitiari ya Kiebrania.
