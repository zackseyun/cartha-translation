base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/000.yaml
  text: 'For the choir director: “Do Not Destroy.” Of David[a]. A miktam, when Saul sent men[d][c][b], and they watched the house to kill him.'
translation:
  language: sw
  text: 'Kwa mwongoza muziki: “Usiharibu.” Ya Daudi. Miktamu,[a] wakati Sauli alipotuma watu,[b] nao wakailinda nyumba ili wamuue.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maana ya neno “miktamu” haijulikani kwa hakika; kwa hiyo limetoholewa badala ya kutafsiriwa.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana rasmi zaidi, “wakati Sauli alipotuma, nao wakailinda nyumba ili wamuue.” Kiebrania hakitaji wazi “watu,” lakini kitenzi cha wingi kinaonyesha kwamba Sauli alituma wajumbe.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza muziki
  rationale: Hili ni agizo la kichwa cha zaburi kwa kiongozi wa muziki; tafsiri hii ni ya kawaida na haifungii jukumu hilo kwa kwaya pekee.
- source_word: אַל תַּשְׁחֵת
  choice: Kwa mtindo wa “Usiharibu”
  rationale: Inaelekea kuwa jina la wimbo au maelekezo ya muziki, si amri iliyo ndani ya zaburi; ‘kwa mtindo wa’ hufanya kazi yake iwe wazi bila kudai uhakika usiokuwapo.
- source_word: לְדָוִד
  choice: Zaburi ya Daudi
  rationale: Kirai hiki cha kawaida katika vichwa vya Zaburi kinaweza kuonyesha uandishi, uhusiano, au wakfu. Kiswahili cha kawaida ‘ya Daudi’ kinadumisha kiasi cha utata huo kuliko ‘iliyoandikwa na Daudi.’
- source_word: מִכְתָּם
  choice: Miktamu
  rationale: Maana kamili ya istilahi hii haijulikani; imetoholewa badala ya kupewa maana ya kubahatisha.
- source_word: בִּשְׁלֹחַ
  choice: wakati Sauli alipotuma watu
  rationale: Muundo wa Kiebrania una maana ya wakati. Nomino ‘watu’ haijaandikwa wazi, lakini inatolewa na kitenzi kinachofuata kilicho katika wingi na hufanya Kiswahili kiwe cha kawaida.
- source_word: וַיִּשְׁמְרוּ
  choice: nao wakaitazama
  rationale: Katika muktadha wa kusudi la kumuua Daudi, kitenzi kinaonyesha kuifuatilia au kuichunga nyumba kwa nia ya uadui, si kuilinda.
- source_word: אֶת הַבַּיִת
  choice: nyumba
  rationale: Chanzo kinasema ‘nyumba’ kwa hali ya uainisho; muktadha unaonyesha ni nyumba ya Daudi bila kulazimika kuongeza umilikaji.
- source_word: לַהֲמִיתוֹ
  choice: ili wamuue
  rationale: Hii ni infinitivu ya kusudi yenye kiambishi cha nafsi ya tatu ya kiume; tafsiri inaonyesha kusudi hilo moja kwa moja.
theological_decisions:
- issue: Uhusiano wa Daudi na zaburi katika לְדָוִד
  choice: Zaburi ya Daudi
  alternative: Zaburi iliyoandikwa na Daudi
  rationale: ‘Ya Daudi’ huepuka kuamua kwamba kihusishi lazima kionyeshe uandishi pekee, hivyo huhifadhi upana wa muundo wa Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi inayofaa kichwa cha zaburi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Mwongoza muziki’ ni pana na ya asili; ‘Miktamu’ imehifadhiwa kama istilahi isiyo na maana hakika. Alama zote za tanbihi zimewekwa katika matini kuu.
