base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/012.yaml
  text: The sin of their mouth is the word of their lips[a]; let them be caught in their pride[b], because of the curse and the lie that they tell.
translation:
  language: sw
  text: Dhambi ya kinywa chao ni maneno ya midomo yao[a]; na wanaswe katika kiburi chao[b], kwa sababu ya laana na uongo wanaosema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa sababu ya dhambi ya kinywa chao—maneno ya midomo yao—wanaswe katika kiburi chao; na kwa sababu ya laana na uongo wanaosema.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wanaswe kwa kiburi chao.”
    reason: previous_rendering
lexical_decisions:
- source_word: חַטַּאת
  choice: dhambi
  rationale: Nomino hii hapa inamaanisha kosa la kimaadili linalojitokeza katika usemi, si dhabihu ya dhambi.
- source_word: פִּימוֹ
  choice: kinywa chao
  rationale: Umoja wenye kiambishi cha wingi umetumiwa kwa maana ya jumla; tafsiri hii pia inadumisha taswira sambamba ya kinywa na midomo.
- source_word: דְּבַר שְׂפָתֵימוֹ
  choice: maneno ya midomo yao
  rationale: Neno דְּבַר linaweza kuwa la umoja wa kijumla; 'maneno' ni Kiswahili cha kawaida na cha kishairi kinachohifadhi taswira halisi ya midomo.
- source_word: וְיִלָּכְדוּ
  choice: na wanaswe
  rationale: Niphal ya muktadha huu ina nguvu ya ombi au tamani ya hukumu; 'wanaswe' huonyesha hali ya kunaswa kwa ufupi.
- source_word: בִגְאוֹנָם
  choice: katika kiburi chao
  rationale: גאון hapa ni majivuno au kujikweza; 'katika' huhifadhi kwa makusudi uwezekano kwamba kiburi ni mazingira au njia ya kunaswa kwao.
- source_word: מֵאָלָה
  choice: kwa sababu ya laana
  rationale: מן inaeleweka kwa njia ya kisababishi baada ya ombi la kunaswa; אָלָה humaanisha laana au usemi wa kulaani.
- source_word: וּמִכַּחַשׁ
  choice: na uongo
  rationale: כחש ni uongo, uwongo au udanganyifu; 'uongo' ni neno la kawaida na linaendana na usemi unaofuata.
- source_word: יְסַפֵּרוּ
  choice: wanaousema
  rationale: Ingawa ספר mara nyingi ni kusimulia, hapa inaelekea kwa yale wanayonena; 'kusema uongo' ni muungano wa asili katika Kiswahili.
theological_decisions:
- issue: Uhusiano wa kisintaksia kati ya dhambi ya usemi, kunaswa katika kiburi, na laana pamoja na uongo
  choice: Maandishi makuu yanachukulia sentensi ya kwanza kuwa kauli kamili, kisha laana na uongo kuwa sababu ya kunaswa kwao.
  alternative: 'Kauli yote inaweza kusomwa kama sababu zilizotangulia ombi: ''Kwa sababu ya dhambi ya kinywa chao—maneno ya midomo yao—na kwa sababu ya laana na uongo wanaousema, wanaswe katika kiburi chao.'''
  rationale: Sintaksia ya Kiebrania ni fupi na yenye uwezekano zaidi ya mmoja; tanbihi huhifadhi usomaji mbadala bila kuamua kimya kimya maana ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Taswira ya Kiebrania ya kinywa na midomo imehifadhiwa. 'Wanaswe' limetumiwa kama ombi la kishairi; tanbihi zimehifadhi sintaksia na maana mbadala halisi.
