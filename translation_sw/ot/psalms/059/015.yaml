lexical_decisions:
- source_word: הֵמָּה
  choice: Wao
  rationale: Kiwakilishi huru cha wingi kinaonyesha au kusisitiza wahusika; “Wao” ni cha kawaida na chenye uzito unaofaa katika Kiswahili.
- source_word: ינועון
  choice: hutanga-tanga
  rationale: Kitenzi נוּעַ hapa kinaonyesha kwenda huku na huku; hali ya mazoea inafaa muktadha wa maadui wanaofananishwa na mbwa wanaozunguka mjini.
- source_word: לֶאֱכֹל
  choice: wakitafuta chakula
  rationale: Kis infinitivu chenye לְ kinaonyesha kusudi, kihalisi “ili kula.” Katika muktadha huu, “wakitafuta chakula” linaeleza kusudi hilo kwa Kiswahili cha kawaida bila kuongeza wazo lisilokuwamo.
- source_word: אִם לֹא יִשְׂבְּעוּ
  choice: wasiposhiba
  rationale: Muundo huu wa sharti una maana ya “ikiwa hawatashiba.” “Wasiposhiba” ni mfupi, wa kawaida, na huhifadhi picha ya njaa.
- source_word: וַיָּלִינוּ
  choice: hukaa huko usiku
  rationale: Uchanganuzi wa kawaida kutoka לוּן/לִין hutoa maana ya kukaa au kulala mahali usiku. “Hukaa huko usiku” huhifadhi wazo la kubaki usiku bila kulazimisha kwamba wanalala.
