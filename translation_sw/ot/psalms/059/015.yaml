  text: Wao hutanga-tanga kutafuta chakula; wasiposhiba, hupitisha usiku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hunung’unika” au “hunguruma.” Kitenzi cha Kiebrania kinaweza kumaanisha “kupitisha usiku” au “kulala mahali usiku”; katika muktadha wa mbwa wenye njaa, kinaweza pia kueleweka kuwa kutoa sauti ya kunung’unika au kunguruma.
