base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/013.yaml
  text: Consume them in wrath[a]; consume them until they are no more, so that they may know that God rules in Jacob to the ends of the earth[b]. Selah
translation:
  language: sw
  text: Waangamize kwa ghadhabu[a]; waangamize mpaka wasiwepo tena, ili wajue kwamba Mungu anatawala katika Yakobo hadi miisho ya dunia[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wateketeze kwa ghadhabu; wateketeze, nao wasiwepo tena.” Kiebrania kinaweza kutafsiriwa kwa mkato zaidi na kwa kufuata muundo wake wa moja kwa moja.
    reason: lexical_alternative
  - marker: b
    text: “Katika Yakobo” humaanisha utawala wa Mungu kuhusiana na Yakobo, yaani Israeli; wengine hutafsiri “juu ya Yakobo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּלֵּה
  choice: waangamize
  rationale: Amri ya Piel ya כלה humaanisha kufikisha mwisho au kuharibu kabisa. “Waangamize” ni ya asili katika Kiswahili, inadumisha ukali wa ombi, na marudio yake yanahifadhi msisitizo wa Kiebrania.
- source_word: בְחֵמָה
  choice: kwa ghadhabu
  rationale: חֵמָה ni hasira kali inayowaka. “Kwa ghadhabu” huwasilisha kwa ufupi namna au chombo cha kuangamiza.
- source_word: וְאֵינֵמוֹ
  choice: mpaka wasiwepo tena
  rationale: Kirai hiki kwa karibu ni “na hawapo.” Katika mfuatano wa amri, “mpaka wasiwepo tena” huonyesha matokeo kamili kwa Kiswahili cha kawaida, ingawa Kiebrania kinaweza kutafsiriwa kwa mkato zaidi.
- source_word: וְיֵדְעוּ
  choice: ili wajue
  rationale: Waw pamoja na imperfect baada ya ombi inaweza kuonyesha kusudi au matokeo. “Ili wajue” ni ya kawaida na inadumisha uhusiano huo bila kuufanya kuwa kauli rahisi ya wakati ujao.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu wa zaburi, neno hili linamtaja Mungu mmoja wa Israeli; “Mungu” ndiyo tafsiri ya moja kwa moja.
- source_word: מֹשֵׁל
  choice: anatawala
  rationale: Participio hii huonyesha utawala unaoendelea. “Anatawala” ni Kiswahili cha sasa, wazi, na cha heshima.
- source_word: בְּיַעֲקֹב
  choice: katika Yakobo
  rationale: בְּ kimsingi ni “katika.” Jina “Yakobo” limehifadhiwa kama jina la watu wa agano badala ya kufasiriwa kimya kimya kuwa “Israeli”; “juu ya Yakobo” pia yawezekana kulingana na muktadha.
- source_word: לְאַפְסֵי הָאָרֶץ
  choice: mpaka miisho ya dunia
  rationale: Hiki ni kirai cha kufikia sehemu za mbali kabisa za dunia. “Mpaka miisho ya dunia” ni wazi na ya asili katika Kiswahili.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya neno hili haijulikani kwa hakika; limetoholewa badala ya kutafsiriwa kwa kubahatisha.
theological_decisions:
- issue: Lugha ya laana dhidi ya maadui
  choice: Ombi la moja kwa moja la kuangamizwa kwao kabisa limehifadhiwa bila kulainishwa.
  alternative: Kutafsiri kama kuwazuia tu, kuwaangamiza kwa sehemu, au kuondoa wazo la kuharibiwa kabisa.
  rationale: Kiebrania kinarudia amri na kinaomba wafikishwe mahali ambapo hawapo tena. Tafsiri inapaswa kuhifadhi ukali huo.
- issue: Upeo wa utawala wa Mungu kuhusiana na Yakobo na mataifa
  choice: Utawala wa Mungu “katika Yakobo” pamoja na kutambuliwa kwake mpaka miisho ya dunia umehifadhiwa.
  alternative: Kutafsiri “juu ya Yakobo,” au kubadili Yakobo kuwa kauli ya ulimwengu wote pekee.
  rationale: Mstari unaunganisha uhusiano maalumu wa Mungu na Yakobo na upeo wa ulimwengu wote. Mvutano huo umeachwa wazi badala ya kutatuliwa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Waangamize” huhifadhi nguvu ya ombi bila kuwa ya kizamani; “ghadhabu” inafaa kwa ushairi wa zaburi. Alama zote za tanbihi zimewekwa katika matini kuu.
