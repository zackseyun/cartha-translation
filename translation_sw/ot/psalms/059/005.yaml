  text: וְ/אַתָּ֤ה יְהוָֽה אֱלֹהִ֥ים צְבָא֡וֹת אֱלֹ֘הֵ֤י יִשְׂרָאֵ֗ל הָקִ֗יצָ/ה לִ/פְקֹ֥ד כָּֽל הַ/גּוֹיִ֑ם אַל תָּחֹ֨ן כָּל בֹּ֖גְדֵי אָ֣וֶן סֶֽלָה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/005.yaml
  text: But you[a], O Yahweh God of hosts, God of Israel, awake to punish all the nations; show no favor to any treacherous evildoers[c][b]. Selah
translation:
  language: sw
  text: Lakini wewe, Ee YHWH, Mungu wa majeshi, Mungu wa Israeli, amka uyadhibu mataifa yote; usiwaonee fadhili hata mmoja wa watenda maovu wenye hila.[a] Sela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amka uyatembelee/yawajibishe mataifa yote; usiwaonee huruma hata mmoja wa watenda maovu wenye hila.” Kitenzi cha Kiebrania kilichotafsiriwa “uyadhibu” kinaweza kumaanisha “kutembelea,” “kuangalia,” “kuwawajibisha,” au “kuadhibu,” kutegemea muktadha. Kitenzi kilichotafsiriwa “usiwaonee fadhili” humaanisha kuonyesha fadhili au neema.
    reason: lexical_alternative
  - marker: b
    text: “Sela” huenda ni alama ya muziki au ibada; maana yake kamili haijulikani.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: YHWH
  rationale: Jina la Mungu limehifadhiwa kwa herufi zake nne ili kutolitia matamshi yasiyo hakika na kulitofautisha na cheo ‘Bwana’.
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Mungu wa majeshi
  rationale: ‘Majeshi’ huhifadhi maana ya kijeshi ya צבאות bila kuamua kimya-kimya kama yanakusudiwa majeshi ya mbinguni, ya duniani, au yote mawili.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya mnyororo huu wa nomino.
- source_word: הָקִיצָה
  choice: amka
  rationale: Huhifadhi sitiari ya kishairi ya mwombaji anayemsihi Mungu aamke na kutenda.
- source_word: לִפְקֹד
  choice: ili uyaadhibu
  rationale: Katika muktadha huu wa hukumu na ombi linalofuata la kutowafadhili waovu, ‘adhibu’ huwasilisha vizuri nguvu ya kimahakama ya פקד, ingawa kitenzi kinaweza pia kumaanisha kuja kuangalia au kuwajibisha.
- source_word: כָּל הַגּוֹיִם
  choice: mataifa yote
  rationale: ‘Mataifa’ ni pana na ya kawaida kuliko ‘watu wa Mataifa,’ na haiingizi utofautishaji wa baadaye wa kidini au kikabila.
- source_word: אַל תָּחֹן
  choice: usiwafadhili kamwe
  rationale: ‘Kufadhili’ hapa ni kuonyesha fadhili au neema; ‘kamwe’ huakisi nguvu ya כָּל pamoja na kundi lote linalofuata.
- source_word: בֹּגְדֵי אָוֶן
  choice: wote watendao uovu kwa hila
  rationale: Usemi huu wa kawaida wa Kiswahili huhifadhi uovu wa אָוֶן na hali ya usaliti au udanganyifu ya בגד.
- source_word: סֶלָה
  choice: Sela
  rationale: Neno limeandikwa kwa matamshi ya Kiswahili badala ya kufasiriwa, kwa sababu maana yake kamili haijulikani.
theological_decisions:
- issue: Upeo wa כָּל הַגּוֹיִם katika ombi la hukumu
  choice: mataifa yote
  alternative: watu wote wa Mataifa
  rationale: Maandishi yanataja mataifa kwa upana katika muktadha wa hukumu; tafsiri hii haipunguzi upeo wala kuingiza mgawanyiko wa kitheolojia wa baadaye.
- issue: Nguvu ya פקד katika tendo la Mungu
  choice: kuadhibu
  alternative: kuja kuyaangalia / kuyawajibisha
  rationale: Muktadha unaunga mkono hukumu, lakini tanbihi huhifadhi upana halisi wa kitenzi bila kufuta mvutano wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa mwito na sitiari ya ‘amka’ umehifadhiwa; sentensi imefanywa ya kawaida kwa Kiswahili bila kufuta ukali wa ombi la hukumu.
