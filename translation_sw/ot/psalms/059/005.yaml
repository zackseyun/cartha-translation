  naturalness: Sentensi ya “usiwafadhili kamwe wote ...” haisikiki kwa urahisi katika Kiswahili Sanifu. Muundo “usiwaonee fadhili hata mmoja wa ...” ni wa kawaida zaidi na unaonyesha vizuri “show no favor to any.”
