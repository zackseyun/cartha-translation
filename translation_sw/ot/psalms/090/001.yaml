id: PSA.90.1
reference: Psalms 90:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: תְּפִלָּה֮ לְ/מֹשֶׁ֪ה אִֽישׁ הָ/אֱלֹ֫הִ֥ים אֲֽדֹנָ֗/י מָע֣וֹן אַ֭תָּה הָיִ֥יתָ לָּ֗/נוּ בְּ/דֹ֣ר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/001.yaml
  text: A prayer of Moses[a], the man of God. Lord[b], you have been a dwelling place for us from generation to generation.
translation:
  language: sw
  text: 'Sala ya Musa,[a] mtu wa Mungu.

    Bwana, umekuwa makao yetu kizazi baada ya kizazi.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “iliyoandikwa na Musa” au “kwa ajili ya Musa”; kihusishi cha Kiebrania katika kichwa kinaweza kuonyesha uandishi, uhusiano, au kuwekwa wakfu.
    reason: alternative_reading
  - marker: b
    text: Au “tangu kizazi hadi kizazi.”
    reason: idiomatic_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Sala
  rationale: Neno hili ni kichwa cha aina ya zaburi; “Sala” ni tafsiri ya kawaida, fupi, na yenye hadhi katika Kiswahili.
- source_word: לְמֹשֶׁה
  choice: ya Musa
  rationale: Kihusishi cha Kiebrania לְ katika vichwa vya zaburi kinaweza kuonyesha uandishi, uhusiano, au kuwekwa wakfu. “Ya Musa” huhifadhi upana huo kuliko kuamua moja kwa moja kwamba iliandikwa na Musa au kwa ajili yake.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Huhifadhi cheo cha Kiebrania kinachotumiwa kumtambulisha Musa bila kukipunguza au kukifafanua zaidi ya matini.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Hapa ni cheo cha Mungu katika usemi wa moja kwa moja; “Bwana” ni tafsiri ya kawaida na ya asili katika Kiswahili cha Biblia.
- source_word: מָעוֹן
  choice: makao
  rationale: “Makao” huhifadhi taswira ya mahali pa kukaa au kuishi. Ni pana kuliko “kimbilio,” ambalo lingeingiza moja kwa moja wazo la ulinzi.
- source_word: הָיִיתָ לָּנוּ
  choice: umekuwa makao yetu
  rationale: Muundo huu wa Kiswahili unaonyesha uhusiano unaodumu hadi sasa na kwa kawaida zaidi huunganisha kiarifu “makao” na kiwakilishi “yetu.”
- source_word: בְּדֹר וָדֹר
  choice: kizazi baada ya kizazi
  rationale: Ni nahau ya Kiswahili inayoeleza mwendelezo katika vizazi vinavyofuatana na kuhifadhi nguvu ya urudiaji wa Kiebrania.
theological_decisions:
- issue: Maana ya לְמֹשֶׁה katika kichwa cha zaburi
  choice: ya Musa
  alternative: na Musa; kwa ajili ya Musa
  rationale: Kihusishi cha Kiebrania kina maana pana na hakilazimishi hitimisho moja kuhusu uandishi au kuwekwa wakfu. Tafsiri hii huhifadhi utata halisi wa matini.
- issue: Taswira ya Mungu kama מָעוֹן
  choice: makao yetu
  alternative: kimbilio letu; mahali petu pa kukaa
  rationale: “Makao” huhifadhi sitiari ya Mungu kuwa mahali pa kudumu kwa watu wake bila kuibana kuwa ulinzi pekee, ingawa wazo la kimbilio linaweza kudokezwa katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi, na yenye hadhi. Kichwa kimetenganishwa na mstari wa sala. “Makao yetu” ni cha asili na huhifadhi sitiari ya Kiebrania; “kizazi baada ya kizazi” kinaeleweka kwa urahisi na watu wa kawaida.
