  yaml_path: translation/ot/psalms/090/012.yaml
  text: Teach us to number our days[a], that we may gain a heart of wisdom.
translation:
  language: sw
  text: Tufundishe jinsi ya kuzihesabu siku zetu[a], ili tupate moyo wa hekima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na maneno ya Kiebrania, “Tufundishe hivyo kuzihesabu siku zetu, nasi tutaleta moyo wa hekima.” Kiebrania cha kifungu cha mwisho ni kigumu; wengi hukielewa kuwa, “ili tupate moyo wa hekima.”
    reason: alternative_reading
lexical_decisions:
- source_word: לִמְנוֹת
  choice: kuzihesabu
  rationale: Kitenzi מנה humaanisha kuhesabu. Kiambishi cha yambwa “-zi-” kinarejelea “siku” na kufanya sentensi iwe ya kawaida katika Kiswahili.
- source_word: יָמֵינוּ
  choice: siku zetu
  rationale: Hili ndilo tafsiri ya moja kwa moja ya nomino yenye kiambishi cha nafsi ya kwanza wingi; katika muktadha linamaanisha muda mfupi wa maisha yetu.
- source_word: כֵּן
  choice: —
  rationale: Neno hili linaweza kumaanisha “hivyo/namna hiyo.” Halikutafsiriwa kwa neno tofauti katika mstari mkuu kwa sababu kazi yake katika muundo huu si wazi; maana yake imedokezwa katika ombi zima na imehifadhiwa katika tanbihi.
- source_word: הוֹדַע
  choice: Tufundishe
  rationale: Hii ni amri ya kisababishi ya ידע, yaani “tujulishe” au “utufanye tujue.” “Tufundishe” ni ombi la kawaida na la asili kwa Mungu katika Kiswahili, huku likihifadhi maana ya kupewa ufahamu.
- source_word: וְנָבִא
  choice: ili tupate
  rationale: Kifungu hiki ni kigumu. Ingawa kitenzi בוא kwa msingi humaanisha “kuja/kuleta” kulingana na muundo, hapa wengi hukielewa kwa maana ya kufikia au kupata. “Ili tupate” hutoa maana ya asili katika muktadha bila kuficha uwezekano wa tafsiri halisi ulio katika tanbihi.
- source_word: לְבַב חָכְמָה
  choice: moyo wa hekima
  rationale: Muundo wa Kiebrania ni halisi “moyo wa hekima.” Usemi huu wa Kiswahili huhifadhi mkazo wa Biblia juu ya utu wa ndani na pia unasikika kwa heshima na kwa uelewevu.
theological_decisions:
- issue: Maana ya kifungu cha mwisho kama kusudi/matokeo
  choice: Ombi ni kwamba Mungu atufundishe kutambua ukomo wa maisha yetu ili tupate moyo unaoongozwa na hekima.
  alternative: 'Kufasiri kwa uhalisi zaidi: “Tufundishe hivyo kuzihesabu siku zetu, nasi tutaleta moyo wa hekima.”'
  rationale: Kiebrania cha kifungu cha mwisho ni kifupi na kigumu kisintaksia. “Ili tupate” kinaendana vizuri na tafakari ya zaburi kuhusu maisha mafupi ya binadamu, lakini tanbihi huhifadhi uwezekano wa “tutaleta” na nafasi ya כֵּן (“hivyo”).
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na rahisi kueleweka. “Kuzihesabu siku zetu” huhifadhi taswira halisi ya Kiebrania; “moyo wa hekima” huhifadhi muundo wake bila kuwa mzito.
