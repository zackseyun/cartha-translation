lexical_decisions:
- source_word: תְּפִלָּה
  choice: Sala
  rationale: Neno la kawaida na lenye heshima linalowasilisha maana ya ombi au sala.
- source_word: לְמֹשֶׁה
  choice: ya Musa
  rationale: Kichwa hiki kinaweza kuonyesha uandishi, uhusiano, au kuwekwa wakfu; “ya Musa” huhifadhi kwa kiasi fulani upana huo katika Kiswahili.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Tafsiri ya moja kwa moja ya cheo hiki cha heshima.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Huwasilisha cheo cha Mungu katika mtindo wa kawaida wa Biblia ya Kiswahili.
- source_word: מָעוֹן
  choice: makao
  rationale: Hutoa maana ya mahali pa kukaa na pia inaweza kudokeza usalama, bila kuibadili moja kwa moja kuwa “kimbilio.”
- source_word: בְּדֹר וָדֹר
  choice: kizazi baada ya kizazi
  rationale: Nahau ya Kiswahili yenye kueleweka inayowasilisha mwendelezo katika vizazi vyote.
theological_decisions:
- issue: Uhusiano wa Musa na sala katika kichwa
  choice: ya Musa
  alternative: na Musa; kwa ajili ya Musa
  rationale: Kihusishi cha Kiebrania לְ kinaweza kuonyesha uandishi, uhusiano, au kuwekwa wakfu; tanbihi inahifadhi uwezekano huo badala ya kuamua kwa uhakika.
- issue: Taswira ya Mungu kama מָעוֹן
  choice: makao yetu
  alternative: kimbilio letu; mahali petu pa kukaa
  rationale: “Makao” huhifadhi taswira kuu ya Mungu kama mahali ambapo watu wake hukaa, huku tanbihi ikitaja maana mbadala inayohusiana na usalama.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Kichwa kimetenganishwa na mstari mkuu; lugha ni rahisi kwa msomaji wa kawaida huku ikihifadhi utata wa kihusishi cha Kiebrania na taswira ya makao.
