base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/011.yaml
  text: Who knows the power of your anger[a], and your wrath according to the fear due to you?
translation:
  language: sw
  text: Ni nani ajuaye nguvu ya hasira yako, na ghadhabu yako kulingana na kicho unachostahili[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na ghadhabu yako ni kulingana na kicho chako,” au, “Kama kilivyo kicho chako, ndivyo ilivyo ghadhabu yako.” Usemi wa Kiebrania ni mfupi na unaweza kueleweka kwa njia zaidi ya moja.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי
  choice: Ni nani
  rationale: Kiwakilishi cha kuuliza kinaanzisha swali la balagha; “Ni nani” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: יוֹדֵעַ
  choice: ajuaye
  rationale: Kitenzi ידע hapa humaanisha kujua au kutambua. Umbo “ajuaye” linaendeleza swali moja lenye mtiririko wa kishairi.
- source_word: עֹז
  choice: nguvu
  rationale: עֹז humaanisha nguvu au uweza; “nguvu” huonyesha uzito na athari ya hasira.
- source_word: אַפֶּךָ
  choice: hasira yako
  rationale: Ingawa אַף kihalisi huhusiana na pua, katika nahau hii humaanisha hasira; tafsiri ya maana ndiyo ya asili katika Kiswahili.
- source_word: וּכְיִרְאָתְךָ
  choice: na ... kulingana na kicho unachostahili
  rationale: Kirai hiki ni kifupi na kinaweza kueleweka kwa njia zaidi ya moja. “Kicho unachostahili” huonyesha heshima yenye hofu anayostahili Mungu bila kufuta uhusiano wa kulinganisha unaoletwa na כְּ.
- source_word: עֶבְרָתֶךָ
  choice: ghadhabu yako
  rationale: עֶבְרָה ni hasira kali au ghadhabu. “Ghadhabu” hudumisha sajili ya juu na huitofautisha kwa kiasi na אַף iliyotafsiriwa “hasira.”
theological_decisions:
- issue: Uhusiano kati ya ghadhabu ya Mungu na kicho katika וּכְיִרְאָתְךָ עֶבְרָתֶךָ
  choice: ghadhabu yako kulingana na kicho unachostahili
  alternative: na ghadhabu yako ni kama kicho chako; au, kadiri watu wanavyokucha, ndivyo ghadhabu yako ilivyo
  rationale: Kiebrania ni kifupi na uhusiano wa kisintaksia unaweza kueleweka kwa namna mbalimbali. Tafsiri kuu inadumisha ulinganifu bila kuamua kabisa kama mstari unazungumzia ukubwa wa ghadhabu au namna wanadamu wanavyopaswa kuitambua.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Kicho” kimetumiwa kwa hofu yenye heshima, na tanbihi inadumisha utata halisi wa Kiebrania.
