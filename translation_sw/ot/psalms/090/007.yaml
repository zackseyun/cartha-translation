lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu ya kauli iliyotangulia; “kwa maana” kinafaa kwa mtiririko wa ufafanuzi wa zaburi.
- source_word: כָלִינוּ
  choice: tumeangamizwa
  rationale: Kitenzi כלה kinaweza kumaanisha kuisha, kumalizika, au kuangamizwa. “Tumeangamizwa” kinaonyesha uzito wa matokeo ya hasira ya Mungu bila kuondoa uwezekano wa maana ya kufikia mwisho.
- source_word: בְאַפֶּךָ
  choice: na hasira yako
  rationale: 'Herufi ב hapa inaeleweka kwa maana ya chombo au kisababishi: hasira ya Mungu ndiyo inayosababisha kuangamizwa. Kiswahili cha “na hasira yako” huwasilisha uhusiano huo kwa kawaida.'
- source_word: חֲמָתְךָ
  choice: ghadhabu yako
  rationale: חֵמָה ni hasira kali au iliyowaka. “Ghadhabu” ni neno la heshima na lenye uzito, na linatunza tofauti ya kishairi kati yake na אַף, “hasira.”
- source_word: נִבְהָלְנוּ
  choice: imetutia hofu
  rationale: Kitenzi בהל huonyesha kushtuliwa, kufadhaishwa, au kuingiwa na hofu. “Imetutia hofu” ni Kiswahili cha kawaida kinachoonyesha ukali wa mwitikio kwa ghadhabu ya Mungu.
theological_decisions:
- issue: Uwasilishaji wa maneno mawili yanayohusu hasira ya Mungu katika usambamba
  choice: Kutofautisha “hasira” na “ghadhabu”
  alternative: Kutumia “hasira” kwa maneno yote mawili, au “hasira” na “ukali”
  rationale: Kiebrania kinatumia maneno mawili yanayohusiana lakini tofauti, אַף na חֵמָה. Kuyatofautisha kunadumisha ongezeko la nguvu la kishairi bila kuongeza fundisho lisilokuwamo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Usambamba wa mistari miwili na tofauti kati ya “hasira” na “ghadhabu” umehifadhiwa.
