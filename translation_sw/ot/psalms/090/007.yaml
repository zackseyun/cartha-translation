  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tumefikia mwisho kwa sababu ya hasira yako.” Kitenzi cha Kiebrania kinaweza kumaanisha kumalizika, kuangamizwa, au kufikishwa mwisho.
