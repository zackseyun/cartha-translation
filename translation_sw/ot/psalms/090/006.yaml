lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: Asubuhi
  rationale: Kirai hiki cha wakati kinaonyesha mwanzo wa siku; “Asubuhi” ni usemi wa kawaida na wa asili katika Kiswahili.
- source_word: יָצִיץ
  choice: huchipuka
  rationale: Kitenzi kinaweza kumaanisha kuchipuka au kuchanua. “Huchipuka” kinaonyesha kuanza kwa ukuaji wa majani na kinafaa katika taswira ya mzunguko mfupi wa uhai.
- source_word: וְחָלָף
  choice: na kusitawi
  rationale: Ingawa חלף kwa kawaida huhusisha kupita au kubadilika, katika taswira hii ya mimea huenda inaeleza hali ya majani kuendelea kuwa mabichi na kustawi. Tafsiri hii ni ya asili katika Kiswahili bila kuficha kwamba neno la Kiebrania lina utata.
- source_word: לָעֶרֶב
  choice: kufikia jioni
  rationale: Huhifadhi tofauti ya wakati kati ya asubuhi na jioni na kusisitiza kasi ya mabadiliko.
- source_word: יְמוֹלֵל
  choice: hunyauka
  rationale: Katika muktadha wa mimea, kitenzi kinaweza kueleza kunyauka, ingawa pia huenda kikamaanisha kukatwa. “Hunyauka” kinaendana vizuri na kitenzi kinachofuata, “kukauka,” bila kudokeza mtendaji asiyeelezwa.
- source_word: וְיָבֵשׁ
  choice: na kukauka
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya hali ya mmea kupoteza unyevu kabisa.
