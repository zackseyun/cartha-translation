base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/009.yaml
  text: For all our days pass away in your wrath[a]; we finish our years like a sigh.
translation:
  language: sw
  text: Kwa maana siku zetu zote zimepita katika ghadhabu yako; tumemaliza miaka yetu kama mguno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama mnong’ono” au “kama sauti ya kuugua.” Neno la Kiebrania linaweza kumaanisha sauti ya chini; “mguno” umetumiwa katika maandishi makuu ili kuonyesha kwa ufupi jinsi maisha yanavyokwisha katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha sababu au ufafanuzi wa wazo lililotangulia, na “kwa maana” kinafaa kwa mtiririko wa kishairi wa Kiswahili.
- source_word: כָל יָמֵינוּ
  choice: siku zetu zote
  rationale: Tafsiri hii inahifadhi wingi na picha halisi ya siku za maisha, sambamba na “miaka yetu” katika mstari unaofuata.
- source_word: פָּנוּ
  choice: hupita
  rationale: Katika muktadha wa wakati, kitenzi hiki kina maana ya kugeuka na kupita; “hupita” ni Kiswahili cha kawaida bila kuongeza wazo la kutoweka kabisa.
- source_word: בְעֶבְרָתֶךָ
  choice: katika ghadhabu yako
  rationale: עֶבְרָה inaonyesha hasira kali. “Ghadhabu” inadumisha uzito wake, na “katika” inaonyesha hali au mazingira ambamo siku zinapita.
- source_word: כִּלִּינוּ
  choice: tunamaliza
  rationale: Kitenzi cha Kiebrania katika Piel hapa kinaonyesha kufikisha mwisho au kumaliza; “tunamaliza” ni fupi, ya kawaida, na inahifadhi udhaifu unaodokezwa.
- source_word: שָׁנֵינוּ
  choice: miaka yetu
  rationale: Tafsiri ya moja kwa moja inayohifadhi wingi na ulinganifu wa kishairi na “siku zetu zote.”
- source_word: כְמוֹ
  choice: kama
  rationale: Hiki ndicho kiunganishi cha kawaida cha Kiswahili cha kuonyesha ulinganisho.
- source_word: הֶגֶה
  choice: kite
  rationale: Neno hili linaweza kutaja sauti ya chini kama kuugua, kunong’ona, au kulalamika. “Kite” kinatoa picha ya sauti fupi inayotolewa kwa pumzi na kinafaa katika muktadha wa maisha kupita upesi, huku maana nyingine zikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Istilahi ya hasira ya Mungu
  choice: ghadhabu yako
  alternative: hasira yako; ukali wako
  rationale: Mstari unahusisha wazi kupita kwa maisha ya mwanadamu na עֶבְרָה ya Mungu. “Ghadhabu” inahifadhi nguvu na uzito wa kitheolojia wa neno hilo bila kulainisha mvutano wa maandiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. “Kite” ni neno fupi linalofaa picha ya kishairi; tanbihi inafafanua maana zake mbadala kwa wasomaji wa kawaida.
