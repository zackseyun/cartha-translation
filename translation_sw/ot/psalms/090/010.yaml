source:
  edition: WLC
  text: יְמֵֽי שְׁנוֹתֵ֨י/נוּ בָ/הֶ֥ם שִׁבְעִ֪ים שָׁנָ֡ה וְ/אִ֤ם בִּ/גְבוּרֹ֨ת שְׁמ֘וֹנִ֤ים שָׁנָ֗ה וְ֭/רָהְבָּ/ם עָמָ֣ל וָ/אָ֑וֶן כִּי גָ֥ז חִ֝֗ישׁ וַ/נָּעֻֽפָ/ה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/010.yaml
  text: The days of our years are seventy years[a], or if by strength, eighty years; yet their pride is toil and trouble, for it is soon gone[b], and we fly away.
translation:
  language: sw
  text: Siku za miaka yetu ni miaka sabini, au tukiwa na nguvu, miaka themanini; lakini fahari yao[a] ni taabu na huzuni, maana hupita upesi[b], nasi tunaruka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lakini kilicho bora zaidi katika miaka hiyo ni taabu na huzuni.” Neno la Kiebrania lililotafsiriwa “fahari yao” linaweza pia kumaanisha sehemu yenye kuvutia au yenye nguvu zaidi ya miaka hiyo.
    reason: lexical_alternative
  - marker: b
    text: Au, “maana hukatika upesi.” Kitenzi cha Kiebrania kinaweza kueleza kupita au kukatiliwa mbali.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמֵי שְׁנוֹתֵינוּ
  choice: Siku za miaka yetu
  rationale: Inahifadhi nahau na mtiririko wa kishairi wa Kiebrania huku ikieleweka katika Kiswahili sanifu.
- source_word: בָהֶם שִׁבְעִים שָׁנָה
  choice: ni miaka sabini
  rationale: Kihusishi cha Kiebrania kinafanya kazi kinahau katika kueleza jumla ya muda wa maisha; Kiswahili hutumia kiunganishi ‘ni’ kwa kawaida.
- source_word: וְאִם בִּגְבוּרֹת
  choice: au tukiwa na nguvu
  rationale: Inaonyesha hali ya kipekee ambamo nguvu humwezesha mtu kufikia umri mrefu zaidi, huku ikihifadhi maana ya sharti.
- source_word: וְרָהְבָּם
  choice: lakini fahari yake
  rationale: ‘Fahari’ huhifadhi wazo la kile kinachovutia, chenye nguvu, au kinachoweza kujivuniwa katika miaka hiyo, badala ya kulainisha moja kwa moja kuwa ‘sehemu yake bora.’ Kiwakilishi ‘yake’ kinarejelea ‘miaka.’
- source_word: עָמָל וָאָוֶן
  choice: taabu na huzuni
  rationale: Katika muktadha wa ufupi na uzito wa maisha, maneno haya yanaeleza kazi ngumu yenye mateso na dhiki, si lazima uovu wa kimaadili.
- source_word: כִּי גָז חִישׁ
  choice: maana hupita upesi
  rationale: Kitenzi kinaweza kumaanisha kupita au kukatiliwa mbali; tafsiri kuu inatoa Kiswahili cha asili, na maana nyingine imehifadhiwa katika tanbihi.
- source_word: וַנָּעֻפָה
  choice: nasi tunaruka na kutoweka
  rationale: Inahifadhi picha hai ya kuruka na kuondoka, huku ‘kutoweka’ ikifanya maana ya kuondoka maishani ieleweke bila kuondoa sitiari.
theological_decisions: []
