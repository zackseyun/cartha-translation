  yaml_path: translation/ot/psalms/090/005.yaml
  text: You sweep them away[a]; they are like a dream[c][b]. In the morning they are like grass that sprouts anew.
translation:
  language: sw
  text: 'Unawafagilia mbali; wao ni kama ndoto.[a]

    Asubuhi ni kama nyasi inayochipuka upya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “wao ni kama usingizi.” Kiebrania hapa ni kifupi sana, na kitenzi cha mwisho kiko katika umoja, kikiambatana rasmi na “nyasi.” Pia yaweza kutafsiriwa: “Unawafagilia mbali kwa gharika; wao ni kama usingizi. Asubuhi, nyasi huchipuka upya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: זְרַמְתָּם
  choice: Unawafagilia mbali
  rationale: Kitenzi זָרַם kinaonyesha kuchukuliwa kwa nguvu na mkondo. Kauli hii ya Kiswahili inaeleza kuondolewa kwa ghafula na kwa nguvu bila kulazimisha picha maalumu ya kuzamishwa.
- source_word: שֵׁנָה
  choice: kama ndoto
  rationale: Nomino hiyo kimsingi ni ‘usingizi,’ lakini katika mshororo huu mfupi picha inalenga hali ya kupita haraka na kutokuwa na uthabiti. ‘Kama ndoto’ ni Kiswahili cha kawaida na cha kueleweka; maana ya moja kwa moja imehifadhiwa katika tanbihi.
- source_word: יִהְיוּ
  choice: wao ni
  rationale: Ingawa umbo hilo ni la kutokamilika, hapa linaweza kutumika kueleza ukweli wa jumla katika ushairi. Wakati wa sasa unafaa katika Kiswahili.
- source_word: בַּבֹּקֶר
  choice: Asubuhi
  rationale: Hii ndiyo njia ya kawaida na fupi ya kuonyesha wakati unaotajwa katika picha ya kishairi.
- source_word: כֶּחָצִיר
  choice: kama majani
  rationale: חָצִיר ni majani au uoto wa kondeni. ‘Majani’ ni neno la kawaida katika Kiswahili na linafaa kwa picha ya uoto unaochipuka na kunyauka.
- source_word: יַחֲלֹף
  choice: yanayochipuka upya
  rationale: Katika muktadha wa mstari unaofuata, mzizi חלף unaonyesha majani kujitokeza au kufanywa mapya asubuhi, kabla ya kunyauka jioni. Umbo la umoja katika Kiebrania linapatana na nomino ya pamoja ‘majani’; Kiswahili hutumia upatanisho wa ngeli ya ‘majani.’
