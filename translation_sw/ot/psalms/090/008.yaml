lexical_decisions:
- source_word: שַׁתָּה / שת
  choice: Umeweka
  rationale: Kitenzi cha hali timilifu kinamwelekea Mungu moja kwa moja na kueleza tendo lake lililothibitika; wakati timilifu wa Kiswahili unaendana vizuri na muktadha.
- source_word: עֲוֺנֹתֵינוּ
  choice: maovu yetu
  rationale: עָוֹן hubeba maana ya uovu, kosa, au hatia. “Maovu yetu” huhifadhi uzito wa kimaadili na wingi bila kutumia neno la kitaalamu lisilo la kawaida.
- source_word: לְנֶגְדֶּךָ
  choice: mbele zako
  rationale: Hii ni kauli ya kawaida ya Kiswahili inayoonyesha kwamba maovu yako wazi machoni pa Mungu.
- source_word: עֲלֻמֵנוּ
  choice: dhambi zetu zilizofichika
  rationale: Neno hilo hurejelea vitu vilivyofichwa; usambamba na “maovu yetu” unaonyesha kuwa kinachokusudiwa ni dhambi zilizofichika.
- source_word: לִמְאוֹר
  choice: katika nuru ya
  rationale: Kauli hii inaeleza kufunuliwa kabisa kwa kilichofichika; “katika nuru ya” ni ya asili na inahifadhi taswira ya mwanga.
- source_word: פָּנֶיךָ
  choice: uso wako
  rationale: Tafsiri halisi huhifadhi taswira ya Kiebrania ya kuwapo kwa Mungu na uchunguzi wake unaofunua yote.
theological_decisions:
- issue: Iwapo kufafanua kitu kinachodokezwa na עֲלֻמֵנוּ
  choice: dhambi zetu zilizofichika
  alternative: mambo yetu yaliyofichika; siri zetu
  rationale: Usambamba wa kishairi na “maovu yetu” unaonyesha wazi kuwa mambo yaliyofichika ni makosa ya kimaadili, lakini tanbihi inahifadhi upana wa neno la Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. “Mbele zako” na “uso wako” zinahifadhi lugha ya moja kwa moja na taswira ya zaburi; “maovu” huepuka urudiaji usio wa lazima wa neno “dhambi.”
