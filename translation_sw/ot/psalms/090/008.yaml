  text: You have set our iniquities before you[b][a], our hidden sins in the light of your face.
translation:
  language: sw
  text: Umeweka maovu yetu mbele zako, dhambi zetu zilizofichika[a] katika nuru ya uso wako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mambo yetu yaliyofichika” au “dhambi zetu za siri.” Neno la Kiebrania hurejelea kilichofichwa au kufunikwa.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “katika nuru ya uso wako”; ni taswira ya kufunuliwa kabisa mbele zako.
