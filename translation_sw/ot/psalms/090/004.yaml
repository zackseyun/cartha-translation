base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/004.yaml
  text: For a thousand years in your sight are like yesterday when it is past[c][b][a], or like a watch in the night.
translation:
  language: sw
  text: Kwa maana miaka elfu machoni pako ni kama siku ya jana ilipopita[a], au kama zamu ya ulinzi wakati wa usiku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “inapopita.” Kishazi cha Kiebrania kinaweza kutafsiriwa kwa nuansi tofauti kidogo ya wakati.
    reason: lexical_alternative
  - marker: b
    text: “Zamu ya ulinzi” ilikuwa sehemu ya usiku ambayo walinzi walikesha.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza sababu au ufafanuzi wa kauli iliyotangulia; ‘Kwa maana’ ni ya kawaida na yenye hadhi katika muktadha huu.
- source_word: אֶלֶף שָׁנִים
  choice: miaka elfu
  rationale: Inahifadhi moja kwa moja idadi na msingi wa ulinganisho wa kishairi.
- source_word: בְּעֵינֶיךָ
  choice: machoni pako
  rationale: Inahifadhi taswira ya Kiebrania kuhusu mtazamo au tathmini ya Mungu, huku ikiwa usemi wa kawaida wa Kiswahili.
- source_word: כְּיוֹם אֶתְמוֹל
  choice: kama siku ya jana
  rationale: Inawakilisha ulinganisho na siku iliyopita bila kuondoa nomino ‘siku’ iliyo katika Kiebrania.
- source_word: כִּי יַעֲבֹר
  choice: ikiisha kupita
  rationale: Inaonyesha siku ya jana ikiwa tayari imepita, lakini haitoi kwa nguvu uwezekano wa kuelewa kishazi hicho kama kitendo cha kupita.
- source_word: וְאַשְׁמוּרָה
  choice: au kama zamu ya ulinzi
  rationale: Kiunganishi kinaendeleza ulinganisho kwa taswira ya pili; ‘au kama’ ni ya asili katika Kiswahili, na ‘zamu ya ulinzi’ inaeleza kipindi cha kukesha kwa walinzi.
- source_word: בַלָּיְלָה
  choice: wakati wa usiku
  rationale: Inaonyesha wazi muda ambao zamu hiyo ya ulinzi ilifanyika.
theological_decisions:
- issue: Lugha ya kibinadamu kuhusu mtazamo wa Mungu kwa wakati
  choice: Kuhifadhi ‘machoni pako’ pamoja na milinganisho ya wakati bila maelezo ya kifalsafa.
  alternative: Kusema kwamba miaka elfu si kitu mbele za Mungu, au kwamba kwake huhisiwa kama jana.
  rationale: Mstari unatofautisha kwa lugha ya kishairi mtazamo wa Mungu na uzoefu wa binadamu wa wakati; tafsiri haiongezi fundisho kuhusu kutokuwa chini ya wakati ambalo halijasemwa moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na taswira ya ‘machoni pako’ zimehifadhiwa; maelezo mafupi yametolewa tu pale ambapo desturi ya zamu za usiku huenda isieleweke mara moja.
