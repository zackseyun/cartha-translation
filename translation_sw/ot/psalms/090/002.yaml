  text: בְּ/טֶ֤רֶם הָ֘רִ֤ים יֻלָּ֗דוּ וַ/תְּח֣וֹלֵֽל אֶ֣רֶץ וְ/תֵבֵ֑ל וּֽ/מֵ/עוֹלָ֥ם עַד ע֝וֹלָ֗ם אַתָּ֥ה אֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/002.yaml
  text: Before the mountains were born[a], and you brought forth the earth and the world, from everlasting to everlasting you are God.
translation:
  language: sw
  text: Kabla milima haijazaliwa, na kabla hujazaa[a] dunia na ulimwengu, tangu milele hadi milele wewe ni Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hujailea dunia na ulimwengu kwa uchungu wa kuzaa”; kitenzi cha Kiebrania hubeba taswira ya uchungu wa kuzaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: Kabla
  rationale: Neno hili linaonyesha wakati uliotangulia uumbaji; “kabla” ni la kawaida na sahihi katika Kiswahili cha sasa.
- source_word: הָרִים
  choice: milima
  rationale: Nomino ya wingi yenye taswira ya milima kama sehemu ya uumbaji wa mwanzo.
- source_word: יֻלָּדוּ
  choice: haijazaliwa
  rationale: Kauli tendwa ya ילד ina maana halisi ya kuzaliwa; muundo huu unahifadhi taswira ya uzazi inayotumiwa kishairi kuhusu milima.
- source_word: וַתְּחוֹלֵל
  choice: hujazaa
  rationale: Kitenzi kinaweza kuonyesha uchungu wa kuzaa au kuleta kitu duniani. “Hujazaa” kinahifadhi taswira hiyo kwa Kiswahili kinachoeleweka, huku muundo wa “kabla huja-” ukionyesha kwamba tendo hilo linafuata upeo wa בטרם.
- source_word: אֶרֶץ
  choice: dunia
  rationale: Katika muktadha wa uumbaji wa ulimwengu mzima, “dunia” inafaa kuliko “nchi,” ambalo lingeweza kueleweka kama eneo fulani.
- source_word: וְתֵבֵל
  choice: na ulimwengu
  rationale: תבל huelekea kumaanisha ulimwengu uliopangwa au unaokaliwa; “ulimwengu” ni tafsiri fupi na ya kawaida.
- source_word: וּמֵעוֹלָם עַד עוֹלָם
  choice: tangu milele hadi milele
  rationale: Muundo huu wa Kiswahili unahifadhi nahau ya Kiebrania inayoeleza muda usio na mipaka katika pande zote mbili.
- source_word: אַתָּה
  choice: wewe
  rationale: Kiwakilishi kilicho wazi kinahifadhi msisitizo wa Kiebrania.
- source_word: אֵל
  choice: Mungu
  rationale: Hapa אֵל ni jina la kumtaja Mungu; “Mungu” ni tafsiri iliyo wazi bila kuongeza maana isiyolazimishwa na muktadha.
theological_decisions:
- issue: Taswira ya uzazi inayotumiwa kueleza uumbaji
  choice: Kuhifadhi taswira hiyo katika “milima haijazaliwa” na “hujazaa dunia na ulimwengu.”
  alternative: Kutumia “kuumbwa,” “kuumba,” au “kufanyiza” na hivyo kupunguza taswira ya uzazi.
  rationale: Kiebrania kinatumia lugha ya kuzaliwa na kuzaa ili kueleza asili ya uumbaji na kuwapo kwa Mungu kabla yake. Tafsiri inaihifadhi kama lugha ya kishairi bila kudai jambo la ziada kuhusu namna uumbaji ulivyotokea.
- issue: Umilele wa Mungu
  choice: tangu milele hadi milele wewe ni Mungu
  alternative: tangu enzi hata enzi wewe ni Mungu
  rationale: Chaguo hili linadumisha nahau ya muda usio na mwanzo wala mwisho na dai la mstari kwamba Mungu yuko kabla na baada ya uumbaji, bila kulifafanua kupita kiasi kifalsafa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Kurudiwa kwa “kabla” kunafanya upeo wa kishazi cha wakati uwe wazi kwa msomaji wa kawaida, huku lugha ya uzazi ikihifadhiwa kwa sababu ni sehemu muhimu ya taswira ya Kiebrania.
