  yaml_path: translation/ot/psalms/090/016.yaml
  text: Let your work appear to your servants, and your splendor upon their children.
translation:
  language: sw
  text: Na kazi yako ionekane kwa watumishi wako, na adhama yako juu ya watoto wao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵרָאֶה
  choice: na ionekane
  rationale: Muundo huu wa ombi unatolea maana ya jussive ya Kiebrania kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: פָעֳלֶךָ
  choice: kazi yako
  rationale: Neno hili hurejelea tendo au kazi ya Mungu; “kazi yako” ni wazi na huhifadhi upana wa maana.
- source_word: הֲדָרְךָ
  choice: fahari yako
  rationale: “Fahari” huwasilisha utukufu, adhama, na uzuri wa kifalme unaodokezwa na neno la Kiebrania.
- source_word: עַל־בְּנֵיהֶם
  choice: juu ya watoto wao
  rationale: Huhifadhi kihusishi “juu ya” na maana ya wazao/ watoto bila kubadili uhusiano unaoelezwa.
theological_decisions:
- issue: Uhusiano wa “fahari” na watoto wa watumishi
  choice: fahari yako juu ya watoto wao
  alternative: fahari yako ionekane kwa watoto wao
  rationale: Chanzo hakirudii kitenzi waziwazi katika kishazi cha pili na hutumia kihusishi “juu ya”; tafsiri imehifadhi mvutano huo badala ya kuongeza wazo la kuonekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Usambamba wa kishairi na ufupi wa mstari wa Kiebrania umehifadhiwa.
