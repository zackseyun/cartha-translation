  yaml_path: translation/ot/psalms/090/015.yaml
  text: Make us glad for as many days as you have afflicted us[a], for as many years as we have seen trouble.
translation:
  language: sw
  text: Utufurahishe kwa kadiri ya siku ulizotutesa, kwa kadiri ya miaka tuliyoona taabu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mateso,” “msiba,” au “uovu.” Neno la Kiebrania linaweza kumaanisha taabu, msiba, au uovu kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְּחֵנוּ
  choice: Utufurahishe
  rationale: Kauli ya kuamuru ya Piel yenye kiambishi cha nafsi ya kwanza wingi ni ombi la Mungu awafanye waombaji wafurahi; “utufurahishe” ni Kiswahili cha kawaida na chenye staha.
- source_word: כִּימוֹת
  choice: kwa siku nyingi kadiri ya zile
  rationale: 'כ pamoja na “siku” huonyesha uwiano wa muda: furaha inayoombwa ilingane na kipindi cha mateso. Muundo huu unaweka wazi maana hiyo ya uwiano kwa Kiswahili cha asili.'
- source_word: עִנִּיתָנוּ
  choice: ulizotutesa
  rationale: Piel ya ענה hapa humaanisha kusababisha mateso au taabu. “Ulizotutesa” huhifadhi tendo la Mungu linalotajwa moja kwa moja bila kulibana kuwa unyanyasaji pekee au unyenyekezaji wa ndani.
- source_word: שְׁנוֹת
  choice: kwa miaka mingi kadiri ya ile
  rationale: Wingi wa “miaka” unaendeleza ulinganifu na “siku”; maneno yaliyoongezwa huonyesha wazi ombi la muda wa furaha unaolingana na miaka ya taabu.
- source_word: רָאִינוּ
  choice: tuliyoona
  rationale: “Kuona” huhifadhi picha ya kitenzi cha Kiebrania, ambacho katika muktadha huu pia humaanisha kupitia jambo.
- source_word: רָעָה
  choice: taabu
  rationale: רעה hapa humaanisha hali mbaya, msiba, au dhiki inayopitiwa, si lazima uovu wa kimaadili. “Taabu” ni pana na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya רָעָה kuhusiana na tendo la Mungu
  choice: taabu inayopitiwa
  alternative: uovu; msiba; mateso
  rationale: Muktadha unalinganisha furaha inayoombwa na mateso ya awali. Kwa hiyo neno linaelekea kutaja hali mbaya iliyowapata waombaji, bila kudai kwamba walitenda uovu au kumhusisha Mungu moja kwa moja na uovu wa kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa “kwa ... kadiri ya ...” umetumiwa kuonyesha uwiano wa muda uliomo katika Kiebrania.
