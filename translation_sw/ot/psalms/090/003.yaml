base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/003.yaml
  text: You return man to dust[a], and say, “Return[b], sons of man.”
translation:
  language: sw
  text: Unamrudisha mwanadamu mavumbini[a], nawe unasema, “Rudini, enyi wanadamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika hali ya kupondwa” au “kwenye kilichosagwa”; neno la Kiebrania humaanisha kitu kilichopondwa au kusagwa kuwa unga. Katika muktadha huu, “mavumbini” huonyesha maana yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשֵׁב
  choice: unamrudisha
  rationale: Hifili ya שׁוב ina maana ya kusababisha arudi. “Unamrudisha” humweka Mungu wazi kuwa mtendaji na huhifadhi uhusiano wa kitenzi hiki na amri “Rudini.”
- source_word: אֱנוֹשׁ
  choice: mwanadamu
  rationale: Neno hili humaanisha binadamu, mara nyingi likisisitiza udhaifu na hali yake ya kufa. Umoja umetumiwa kwa maana ya jamii yote ya wanadamu.
- source_word: עַד דַּכָּא
  choice: mavumbini
  rationale: דַּכָּא huelekeza kwenye kitu kilichopondwa au kusagwa. Katika muktadha wa kufa kwa mwanadamu, “mavumbini” hutoa maana hiyo kwa Kiswahili cha kawaida huku tanbihi ikihifadhi upana wa neno la Kiebrania.
- source_word: וַתֹּאמֶר
  choice: nawe unasema
  rationale: Huhifadhi mfuatano wa kishairi na kurejelea wazi mhusika yuleyule, Mungu, kwa lugha ya sasa na yenye hadhi.
- source_word: שׁוּבוּ
  choice: Rudini
  rationale: Ni amri ya wingi ya שׁוב. “Rudini” huhifadhi uhusiano wa kimakusudi na “unamrudisha” katika sehemu ya kwanza.
- source_word: בְנֵי אָדָם
  choice: enyi wanadamu
  rationale: Kirai hiki kwa kawaida humaanisha jamii ya wanadamu. “Enyi wanadamu” ni cha asili na wazi kwa Kiswahili, huku tanbihi ikihifadhi muundo halisi “wana wa Adamu/mwanadamu.”
theological_decisions:
- issue: Maana ya דַּכָּא katika kauli kuhusu kufa kwa mwanadamu
  choice: mavumbini
  alternative: katika hali ya kupondwa / kwenye kilichosagwa
  rationale: Muktadha wa zaburi unazungumzia kurudishwa kwa mwanadamu katika hali yake ya kufa, na “mavumbini” huwasilisha dokezo hilo kwa uwazi. Kwa kuwa neno lenyewe linaweza kumaanisha hali au kitu kilichopondwa, maana hiyo haijafichwa bali imewekwa katika tanbihi.
- issue: Uwasilishaji wa בְנֵי אָדָם
  choice: enyi wanadamu
  alternative: enyi wana wa Adamu / wana wa mwanadamu
  rationale: Kirai hiki ni namna ya Kiebrania ya kuwaita wanadamu kwa ujumla. Tafsiri kuu inaepuka usemi usio wa kawaida katika Kiswahili, lakini tanbihi inadumisha uwezekano wa kusikia uhusiano wa neno hilo na Adamu pamoja na asili na hali ya kufa kwa binadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi na ulinganifu wa “unamrudisha/Rudini” umehifadhiwa bila kufanya kifungu kuwa kigumu.
