  text: וִ/יהִ֤י נֹ֤עַם אֲדֹנָ֥/י אֱלֹהֵ֗י/נוּ עָ֫לֵ֥י/נוּ וּ/מַעֲשֵׂ֣ה יָ֭דֵי/נוּ כּוֹנְנָ֥/ה עָלֵ֑י/נוּ וּֽ/מַעֲשֵׂ֥ה יָ֝דֵ֗י/נוּ כּוֹנְנֵֽ/הוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/017.yaml
  text: May the favor of the Lord our God be upon us[a], and establish the work of our hands upon us; yes[c][b], establish the work of our hands.
translation:
  language: sw
  text: Na kibali cha Bwana, Mungu wetu, kiwe juu yetu[a]; uithibitishe kwa ajili yetu kazi ya mikono yetu; naam, kazi ya mikono yetu, uithibitishe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uzuri,” “upendezo,” au “furaha” ya Bwana, Mungu wetu.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kinarudia ombi hilo kwa ajili ya mkazo: “na kazi ya mikono yetu, ithibitishe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי
  choice: uwe
  rationale: Umbo hili lina nguvu ya ombi au tamanio; “uwe” ni njia ya kawaida na yenye heshima ya kuomba katika Kiswahili.
- source_word: נֹעַם
  choice: wema
  rationale: Neno linaweza kumaanisha uzuri, upendezo, au kibali. “Wema” hapa huonyesha hali ya Mungu yenye kupendeza na neema yake kwa watu, bila kulifinya kuwa idhini pekee.
- source_word: אֲדֹנָי אֱלֹהֵינוּ
  choice: Bwana, Mungu wetu
  rationale: Huhifadhi vyeo vyote viwili vya Mungu kwa lugha ya kawaida ya kibiblia ya Kiswahili.
- source_word: עָלֵינוּ
  choice: juu yetu / kwa ajili yetu
  rationale: Katika ombi la kwanza, “juu yetu” huhifadhi taswira ya baraka inayokaa juu ya watu. Katika ombi kuhusu kazi, “kwa ajili yetu” huwasilisha maana ya manufaa kwa Kiswahili cha asili, kwa kuwa “ithibitishe juu yetu” si wazi.
- source_word: מַעֲשֵׂה יָדֵינוּ
  choice: kazi ya mikono yetu
  rationale: Huhifadhi taswira halisi ya Kiebrania na ni msemo unaoeleweka kwa kazi na shughuli za wanadamu.
- source_word: כּוֹנְנָה / כּוֹנְנֵהוּ
  choice: uithibitishe
  rationale: Kitenzi kinamaanisha kufanya imara, kudumu, au salama. “Uithibitishe” huomba Mungu aifanye kazi isimame na kudumu bila kuongeza dhana finyu ya mafanikio ya mali.
theological_decisions:
- issue: Maana ya נֹעַם katika ombi la baraka ya Mungu
  choice: wema
  alternative: kibali; uzuri; upendezo
  rationale: “Wema” huhifadhi upana wa neno, likijumuisha upendezo na neema ya Mungu. Tanbihi inaonyesha maana nyingine halali bila kuamua kwamba kifungu kinahusu idhini pekee.
- issue: Uhusiano wa עָלֵינוּ ya pili na kazi ya mikono
  choice: kwa ajili yetu
  alternative: juu yetu
  rationale: Kiebrania kinaweza kuhifadhi maana ya kitu kuimarishwa kwa manufaa ya waombaji. Kiswahili “kwa ajili yetu” ni wazi na cha asili, huku marudio halisi yakibainishwa katika maelezo ya uamuzi wa kileksika.
- issue: Marudio ya ombi la mwisho
  choice: kazi ya mikono yetu, uithibitishe
  alternative: uithibitishe kazi ya mikono yetu
  rationale: Mpangilio huu huhifadhi mkazo wa marudio ya Kiebrania na kiambishi cha nafsi ya tatu kinachorejelea “kazi,” bila kuongeza “naam” isiyowakilishwa moja kwa moja na neno tofauti katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya “kazi ya mikono yetu” na marudio ya ombi yamehifadhiwa; msamiati wa zamani usio wa lazima umeepukwa.
