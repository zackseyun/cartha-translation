id: PSA.90.13
reference: Psalms 90:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: שׁוּבָ֣/ה יְ֭הוָה עַד מָתָ֑י וְ֝/הִנָּחֵ֗ם עַל עֲבָדֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/013.yaml
  text: Return[a], O Yahweh—how long? And have compassion on your servants.
translation:
  language: sw
  text: Ee Yahwe, rudi—mpaka lini? Uwahurumie watumishi wako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ubadili uamuzi wako kuhusu watumishi wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבָה
  choice: rudi
  rationale: Amri hii kwa Yahwe inadumisha maana ya moja kwa moja ya kurudi katika lugha ya maombolezo, bila kuingiza mapema wazo la kubadili uamuzi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: עַד מָתָי
  choice: mpaka lini?
  rationale: Huu ni usemi wa kawaida na wenye uzito katika maombolezo ya Kiswahili, unaohifadhi ombi la haraka la Kiebrania.
- source_word: וְהִנָּחֵם
  choice: uwahurumie
  rationale: Niphal ya נחם inaweza kumaanisha kughairi au kusukumwa na huruma. 'Uwahurumie' ni ya asili katika Kiswahili na inadumisha upande wa huruma bila kudokeza kwamba Mungu anatubu kosa la kimaadili.
- source_word: עַל
  choice: wa- katika uwahurumie
  rationale: Kihusishi kinachotaja walengwa wa huruma kimewasilishwa kiasili kwa kiambishi cha yambwa katika kitenzi cha Kiswahili.
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Katika sala kwa Mungu, 'watumishi' ni tafsiri ya kawaida na inayofaa ya עבד, huku ikidumisha uhusiano wao wa kumtumikia.
theological_decisions:
- issue: Tafsiri ya נחם inapomhusu Mungu
  choice: uwahurumie
  alternative: ubadili uamuzi wako kuhusu watumishi wako
  rationale: Maandishi yanaweza kueleza Mungu akiguswa na huruma au akibadili mwenendo wake. Tafsiri kuu huepuka lugha inayoweza kudokeza kosa la kimaadili, lakini tanbihi inadumisha maana halisi ya uwezekano wa kubadili uamuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala. 'Ee' inafaa kwa mwito wa moja kwa moja; mstari mfupi na alama ya mkato zinahifadhi dharura ya maombolezo.
