  variant: Standard East African Swahili
source:
  edition: WLC
  text: שַׂבְּעֵ֣/נוּ בַ/בֹּ֣קֶר חַסְדֶּ֑/ךָ וּֽ/נְרַנְּנָ֥ה וְ֝/נִשְׂמְחָ֗ה בְּ/כָל יָמֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/014.yaml
  text: Satisfy us in the morning with your steadfast love[a], and we will sing for joy and be glad all our days.
translation:
  language: sw
  text: Utushibishe asubuhi kwa upendo wako thabiti[a], nasi tutaimba kwa shangwe na kufurahi siku zetu zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upendo wako wa agano,” au “rehema zako.” Neno la Kiebrania חֶסֶד linahusisha upendo na wema wenye uaminifu na kudumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂבְּעֵנוּ
  choice: Utushibishe
  rationale: Kitenzi שבע katika hali ya Piel ya amri, pamoja na kiambishi cha nafsi ya kwanza wingi, kinaomba kushibishwa kikamilifu. “Utushibishe” ni Kiswahili cha kawaida kinachohifadhi wazo la kutoshelezwa kwa wingi.
- source_word: בַבֹּקֶר
  choice: asubuhi
  rationale: Kirai hiki kinasema moja kwa moja “asubuhi.” Tafsiri haikiongezei maana ya kurudiwa-rudiwa kama “kila asubuhi,” wala maana ya ukomo wa muda kama “ifikapo asubuhi.”
- source_word: חַסְדֶּךָ
  choice: upendo wako thabiti
  rationale: חֶסֶד huonyesha upendo wenye uaminifu, wema, na kudumu, mara nyingi katika uhusiano wa agano. “Upendo wako thabiti” huhifadhi upana huo bila kuufupisha kuwa rehema pekee.
- source_word: וּנְרַנְּנָה
  choice: nasi tutaimba kwa shangwe
  rationale: רנן huonyesha sauti ya furaha, iwe kilio au wimbo wa shangwe. Katika muktadha wa ombi linalofuatwa na cohortative, “nasi tutaimba kwa shangwe” huwasilisha kwa kawaida itikio au matokeo yanayotarajiwa.
- source_word: וְנִשְׂמְחָה
  choice: na kufurahi
  rationale: שמח humaanisha kufurahi au kuwa na furaha. “Na kufurahi” huhifadhi ulinganifu wa kishairi bila kurudia kabisa wazo la kuimba kwa shangwe.
- source_word: בְּכָל יָמֵינוּ
  choice: siku zetu zote
  rationale: Kirai hiki kinamaanisha muda wote wa maisha ya waombaji. “Siku zetu zote” ni cha kawaida, kifupi, na kiaminifu kwa Kiebrania.
theological_decisions:
- issue: Tafsiri ya חֶסֶד katika ombi la kupata fadhili za Mungu
  choice: upendo wako thabiti
  alternative: upendo wako wa agano; rehema zako
  rationale: Aya inaomba upendo wa Mungu wenye kudumu na uaminifu uwe msingi wa shangwe ya watu. “Upendo wako thabiti” huhifadhi kina hicho bila kuingiza dai finyu zaidi la kimadhehebu; tanbihi inaonyesha maana mbadala halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sala ni wa heshima, wa sasa, na unaoeleweka kwa wasomaji wa kawaida. Ulinganifu wa kishairi na mlolongo wa ombi kisha shangwe umehifadhiwa.
