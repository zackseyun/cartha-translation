base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/004.yaml
  text: Shout joyfully to Yahweh[a], all the earth[b]; break forth and sing for joy and make music.
translation:
  language: sw
  text: Mpigieni Yahweh kelele za shangwe, enyi dunia yote; pazeni sauti, imbeni kwa furaha, na pigeni muziki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִיעוּ
  choice: Mpigieni ... kelele za shangwe
  rationale: Hifili ya רוע hapa ni mwito wa kutoa kelele ya furaha na ushindi; usemi huu ni wa kawaida na unahifadhi nguvu ya amri.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Kihusishi ל kinaelekeza shangwe kwa Mungu, na jina יהוה limetafsiriwa kwa kunukuliwa kama Yahweh.
- source_word: כָּל הָאָרֶץ
  choice: enyi dunia yote
  rationale: Katika mwito huu wa ulimwengu mzima, אָרֶץ ina maana ya dunia nzima; 'enyi' huonyesha kuwa dunia inaambiwa moja kwa moja.
- source_word: פִּצְחוּ
  choice: pazeni sauti
  rationale: פצח inaonyesha kuanza ghafla kutoa sauti kwa nguvu; Kiswahili hiki kinatoa picha hiyo kwa njia ya asili.
- source_word: וְרַנְּנוּ
  choice: imbeni kwa furaha
  rationale: רנן katika muktadha wa sifa huonyesha uimbaji au kilio cha shangwe; hapa 'imbeni kwa furaha' kinatofautisha tendo hili na kelele ya mwanzo.
- source_word: וְזַמֵּרוּ
  choice: kupiga muziki
  rationale: זמר inaweza kumaanisha kufanya muziki wa sifa, kwa kuimba na pengine kwa ala; tafsiri hii haiibani kwenye kuimba pekee.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה; 'Yahweh' huhifadhi jina hilo bila kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Mfululizo wa amri na mwito wa ulimwengu mzima umehifadhiwa.
