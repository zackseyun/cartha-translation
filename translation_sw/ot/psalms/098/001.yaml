  text: מִזְמ֡וֹר שִׁ֤ירוּ לַֽ/יהוָ֨ה שִׁ֣יר חָ֭דָשׁ כִּֽי נִפְלָא֣וֹת עָשָׂ֑ה הוֹשִֽׁיעָה לּ֥/וֹ יְ֝מִינ֗/וֹ וּ/זְר֥וֹעַ קָדְשֽׁ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/001.yaml
  text: A psalm. Sing to Yahweh a new song[a], for he has done wondrous things; his right hand and his holy arm have worked salvation for him.
translation:
  language: sw
  text: Zaburi. Mwimbieni Yahwe wimbo mpya, kwa maana ametenda mambo ya ajabu; mkono wake wa kuume na mkono wake mtakatifu vimemletea wokovu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “vimemwokoa” au “vimemletea ushindi.” Usemi wa Kiebrania unaonyesha kwamba nguvu za Yahwe mwenyewe zimetimiza wokovu au ushindi kwa ajili yake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Kichwa cha aina ya utungo; “Zaburi” ni istilahi ya kawaida, wazi na yenye hadhi katika Kiswahili.
- source_word: שִׁירוּ לַיהוָה
  choice: Mwimbieni Yahwe
  rationale: Amri ya wingi שִׁירוּ na kihusishi ל zinaonyesha kumwimbia Yahwe; umbo hili ni la kawaida katika Kiswahili.
- source_word: שִׁיר חָדָשׁ
  choice: wimbo mpya
  rationale: Tafsiri ya moja kwa moja na ya kawaida inayohifadhi usemi wa kishairi.
- source_word: נִפְלָאוֹת עָשָׂה
  choice: ametenda mambo ya ajabu
  rationale: Inawasilisha matendo yaliyokamilika yenye umuhimu wa sasa na kuhifadhi wazo la matendo yanayostaajabisha.
- source_word: יְמִינוֹ
  choice: mkono wake wa kuume
  rationale: Inahifadhi taswira ya Kiebrania ya upande wa kuume kama ishara ya nguvu na utendaji.
- source_word: וּזְרוֹעַ קָדְשׁוֹ
  choice: na mkono wake mtakatifu
  rationale: Kiswahili hutumia “mkono” kwa kiungo hiki kwa kawaida; kivumishi “mtakatifu” kinahifadhi sifa ya קֹדֶשׁ na ulinganifu wa kishairi.
- source_word: הוֹשִׁיעָה לּוֹ
  choice: vimemletea wokovu
  rationale: Kitenzi cha umoja wa kike kinatazama jozi ya kishairi kama nguvu moja ya utendaji. Tafsiri hii huhifadhi wazo lisilo la kawaida la wokovu kutendwa ‘kwa ajili yake’ bila kulibana kuwa ushindi pekee.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: “Yahwe” hulitambulisha jina la agano moja kwa moja na kufuata safu ya mashauriano iliyotolewa, bila kulibadilisha kuwa cheo.
- issue: Maana ya הוֹשִׁיעָה לּוֹ kuhusiana na mkono wa Mungu mwenyewe
  choice: vimemletea wokovu
  alternative: vimemwokoa; vimemletea ushindi
  rationale: Kiebrania kinaweza kueleweka kihalisi kuwa nguvu zake zimemwokoa au zimempatia wokovu/ushindi. “Vimemletea wokovu” huhifadhi mvutano huo na kusisitiza kuwa nguvu za Yahwe mwenyewe ndizo zinazotimiza ukombozi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi na chenye hadhi lakini kinachoeleweka kwa urahisi. Taswira za “mkono wa kuume” na “mkono mtakatifu” zimehifadhiwa; kiambishi cha upatanisho “vi-” kinachukulia viungo hivyo viwili kama kiima cha pamoja.
