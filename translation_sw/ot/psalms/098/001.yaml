  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: kichwa cha zaburi, mwito wa wingi wa kumwimbia Yahwe wimbo mpya, sababu ya matendo yake ya ajabu, na taswira ya mkono wa kuume pamoja na mkono/ugwe wake mtakatifu. “Vimemletea wokovu” hudumisha utata wa הוֹשִׁיעָה לּוֹ bila kuufunga kuwa “ushindi” pekee.'
  naturalness: Kiswahili ni sanifu, cha kishairi, na kinaeleweka. “Mwimbieni Yahwe,” “mambo ya ajabu,” na “mkono wake wa kuume” ni miundo ya kawaida na yenye hadhi. Katika Kiswahili, “mkono” inaweza kutaja hand/arm kulingana na muktadha; kwa hiyo “mkono wake mtakatifu” ni uwasilishaji wa asili wa זְרוֹעַ katika ulinganifu huu wa kishairi.
