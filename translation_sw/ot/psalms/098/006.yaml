base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/006.yaml
  text: With trumpets and the sound of the horn[a], raise a shout before the King, Yahweh.
translation:
  language: sw
  text: Kwa tarumbeta na sauti ya pembe ya kondoo-dume[a], pigeni kelele za shangwe mbele ya Mfalme, Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “pembe.” Neno la Kiebrania שׁוֹפָר mara nyingi humaanisha hasa pembe ya kondoo-dume, tofauti na tarumbeta zilizotajwa mwanzoni mwa mstari.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲצֹצְרוֹת
  choice: Kwa tarumbeta
  rationale: 'Nomino חֲצֹצְרוֹת inamaanisha tarumbeta, hasa ala za moja kwa moja za metali, tofauti na שׁוֹפָר. Kiambishi בַּ kimetafsiriwa kwa maana ya ala: “kwa.” Neno “fedha” halijaongezwa kwa kuwa halipo katika mstari huu.'
- source_word: וְקוֹל שׁוֹפָר
  choice: na sauti ya pembe ya kondoo-dume
  rationale: קוֹל ni “sauti,” na שׁוֹפָר ni ala ya pembe, mara nyingi pembe ya kondoo-dume. Tafsiri hii inaweka wazi tofauti yake na tarumbeta zilizotajwa kwanza, huku tanbihi ikihifadhi uwezekano wa tafsiri pana zaidi.
- source_word: הָרִיעוּ
  choice: pigeni vigelegele
  rationale: Hii ni amri ya wingi inayotaka mwito mkubwa wa shangwe au kelele ya kumshangilia mfalme. “Pigeni vigelegele” ni Kiswahili cha sasa na cha kawaida kinachoonyesha shangwe ya sauti bila kuifanya kitenzi hiki kuwa amri ya kupiga ala.
- source_word: לִפְנֵי
  choice: mbele za
  rationale: לִפְנֵי humaanisha “mbele ya” au “katika uwepo wa.” “Mbele za” ni usemi wa Kiswahili unaofaa muktadha wa heshima.
- source_word: הַמֶּלֶךְ
  choice: Mfalme
  rationale: Nomino yenye uainisho inamtaja “Mfalme”; herufi kubwa inaonyesha kuwa ni cheo cha Mungu anayefafanuliwa mara moja kuwa Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kwa umbo la Kiswahili “Yahwe,” badala ya kulibadilisha kuwa cheo kama “BWANA,” ili kuhifadhi jina binafsi katika matini.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania ina Tetragramatoni yenyewe. “Yahwe” huhifadhi jina la Mungu badala ya kulibadilisha kuwa cheo, na ni umbo linalosomeka kwa urahisi katika Kiswahili.
- issue: Uhusiano wa הַמֶּלֶךְ na יְהוָה
  choice: Mfalme, Yahwe
  alternative: Yahwe, Mfalme
  rationale: Mpangilio wa Kiebrania unaunga mkono uhusiano wa ufafanuzi ambapo “Yahwe” anamtambulisha “Mfalme.” Mpangilio huo umehifadhiwa bila kubadili msisitizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Pigeni vigelegele” hutoa mwito wa shangwe kwa lugha inayoeleweka, na “mbele za” hudumisha heshima inayofaa ibada.
