  text: זָ֘כַ֤ר חַסְדּ֨/וֹ וֶֽ/אֱֽמוּנָת/וֹ֮ לְ/בֵ֪ית יִשְׂרָ֫אֵ֥ל רָא֥וּ כָל אַפְסֵי אָ֑רֶץ אֵ֝֗ת יְשׁוּעַ֥ת אֱלֹהֵֽי/נוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/003.yaml
  text: He has remembered his steadfast love and his faithfulness to the house of Israel[a]; all the ends of the earth have seen the salvation of our God.
translation:
  language: sw
  text: Amekumbuka upendo wake thabiti na uaminifu wake kwa nyumba ya Israeli; ncha zote za dunia zimeuona wokovu[a] wa Mungu wetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukombozi wa Mungu wetu”; katika muktadha wa zaburi, neno la Kiebrania linaweza pia kumaanisha tendo la wokovu lenye ushindi.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַר
  choice: amekumbuka
  rationale: Kitenzi cha Qal timilifu, nafsi ya tatu umoja wa kiume. Wakati timilifu wa Kiswahili unaonyesha tendo lililotimizwa lenye umuhimu katika sifa ya sasa, huku maana ya msingi ya ‘kukumbuka’ ikihifadhiwa.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד huonyesha upendo wa kudumu na mwaminifu, hasa katika uhusiano wa agano. ‘Upendo thabiti’ ni wa kawaida na unaeleweka bila kuingiza istilahi nzito ya kidhehebu.
- source_word: וֶאֱמוּנָתוֹ
  choice: na uaminifu wake
  rationale: Katika ulinganifu na חֶסֶד, אֱמוּנָה hapa ni kutegemeka au kuwa mwaminifu, si hasa ‘ukweli’ wa kinadharia.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: kwa nyumba ya Israeli
  rationale: ‘Kwa’ huwasilisha uelekeo na uhusiano unaoweza kuonyeshwa na לְ, na ‘nyumba ya Israeli’ huhifadhi tamathali ya Kiebrania kwa taifa au watu wa Israeli.
- source_word: רָאוּ
  choice: imeuona
  rationale: Kitenzi timilifu cha wingi kinapatana kisarufi na kirai cha Kiswahili ‘miisho yote’ kama jumla moja. Kiambishi -u- kinaelekeza wazi kwa ‘wokovu.’
- source_word: כָל אַפְסֵי אָרֶץ
  choice: miisho yote ya dunia
  rationale: Hii ni nahau ya Kiebrania inayomaanisha hata maeneo ya mbali zaidi ya ulimwengu; tafsiri hii ni ya kawaida na huhifadhi taswira ya chanzo.
- source_word: אֵת
  choice: '[alama ya yambwa, haijatafsiriwa]'
  rationale: Ni alama ya Kiebrania ya yambwa dhahiri isiyo na neno linalolingana moja kwa moja katika Kiswahili; kazi yake inaonyeshwa na muundo wa sentensi na kiambishi cha yambwa -u-.
- source_word: יְשׁוּעַת
  choice: wokovu
  rationale: Neno linaweza kumaanisha wokovu, ukombozi, au tendo la ushindi. ‘Wokovu’ huhifadhi upana wake wa kitheolojia, huku tanbihi ikitaja uwezekano mwingine.
- source_word: אֱלֹהֵינוּ
  choice: wa Mungu wetu
  rationale: Huhifadhi muundo wa hali ya umilikaji katika kirai ‘wokovu wa Mungu wetu’ bila kuamua kupita kiasi kama wokovu huo ni ‘kutoka kwa’ Mungu au ni tendo lake.
theological_decisions:
- issue: Dhana ya kiagano katika חֶסֶד na אֱמוּנָה
  choice: upendo wake thabiti na uaminifu wake
  alternative: rehema yake na kweli yake
  rationale: Jozi iliyochaguliwa huonyesha upendo wa kudumu na kutegemeka kwa Mungu kwa Israeli bila kupunguza חֶסֶד kuwa huruma pekee wala אֱמוּנָה kuwa ukweli wa kinadharia.
- issue: Upana wa maana ya יְשׁוּעַת אֱלֹהֵינוּ
  choice: wokovu wa Mungu wetu
  alternative: ukombozi wa Mungu wetu; ushindi wa Mungu wetu
  rationale: Kiebrania kinaruhusu maana pana ya kuokoa au kukomboa, yenye uwezekano wa vidokezo vya ushindi. ‘Wokovu’ hauifungi maana katika ushindi wa kijeshi, na tanbihi huhifadhi mbadala halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, katika mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Muundo wa kishairi na taswira ya ‘miisho yote ya dunia’ zimehifadhiwa; alama ya tanbihi imewekwa moja kwa moja baada ya neno ‘wokovu’ ambalo tanbihi inalifafanua.
