  text: מִזְמ֡וֹר שִׁ֤ירוּ לַֽ/יהוָ֨ה שִׁ֣יר חָ֭דָשׁ כִּֽי נִפְלָא֣וֹת עָשָׂ֑ה הוֹשִֽׁיעָה לּ֥/וֹ יְ֝מִינ֗/וֹ וּ/זְר֥וֹעַ קָדְשֽׁ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/000.yaml
  text: A psalm. Sing to Yahweh a new song[a], for he has done wondrous things; his right hand and his holy arm have brought him salvation.
translation:
  language: sw
  text: Zaburi. Mwimbieni Yahwe wimbo mpya, kwa maana ametenda mambo ya ajabu; mkono wake wa kuume na mkono wake mtakatifu vimemletea wokovu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “vimemwokoa” au “vimemletea ushindi.” Usemi wa Kiebrania unaonyesha kwamba nguvu za Yahwe mwenyewe zimefanikisha wokovu au ushindi kwa ajili yake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Neno la kawaida na lenye hadhi kwa utungo wa kuimbwa kwa kuandamana na muziki; hapa linatumika kama kichwa kifupi.
- source_word: שִׁירוּ לַיהוָה שִׁיר חָדָשׁ
  choice: Mwimbieni Yahwe wimbo mpya
  rationale: Linahifadhi amri ya wingi, mlengwa wa wimbo, jina la agano יהוה, na mpangilio wa asili kwa Kiswahili cha kawaida.
- source_word: נִפְלָאוֹת
  choice: mambo ya ajabu
  rationale: Huwasilisha matendo makuu ya kushangaza bila kuyafinyanga kuwa miujiza pekee.
- source_word: יְמִינוֹ וּזְרוֹעַ קָדְשׁוֹ
  choice: mkono wake wa kuume na mkono wake mtakatifu
  rationale: Inadumisha picha mbili za kishairi za nguvu ya Mungu; urudiaji wa 'mkono' ni wa asili na unaeleweka katika Kiswahili.
- source_word: הוֹשִׁיעָה לּוֹ
  choice: vimemletea wokovu
  rationale: Huhifadhi dhana ya wokovu/ukombozi na kiwakilishi 'kwa ajili yake' bila kuamua kimya kimya kwamba maana ni ushindi pekee.
theological_decisions:
- issue: Maana ya הוֹשִׁיעָה לּוֹ katika kauli kuhusu mkono wa Yahwe
  choice: vimemletea wokovu
  alternative: vimemwokoa; vimemletea ushindi
  rationale: Kiebrania kinaweza kueleweka kwa ukaribu kuwa nguvu zake mwenyewe zimemfanyia wokovu, yaani zimefanikisha ukombozi au ushindi wake. Tafsiri kuu inadumisha mvutano huo, huku tanbihi ikionyesha njia nyingine halali za kuieleza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa wasomaji wa kawaida. Jina “Yahwe” limetumiwa kuwakilisha יהוה moja kwa moja; picha ya kishairi ya mkono wa kuume na mkono mtakatifu imehifadhiwa.
