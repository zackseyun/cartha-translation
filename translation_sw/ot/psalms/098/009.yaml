base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/009.yaml
  text: before Yahweh[a], for he comes to judge the earth; he will judge the world with righteousness[e][d][c][b], and the peoples with equity.
translation:
  language: sw
  text: mbele za Yahweh[a], kwa maana anakuja kuuhukumu dunia; atauhukumu ulimwengu kwa haki, na mataifa kwa usawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika uwepo wa Yahweh.” Jina hilo katika Kiebrania huandikwa YHWH; katika tafsiri nyingine hutafsiriwa “BWANA.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: mbele za
  rationale: Nahau hii humaanisha kuwa mbele ya mtu au katika uwepo wake; “mbele za” ni ya kawaida, fupi, na yenye hadhi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya shangwe iliyoelezwa katika muktadha uliotangulia.
- source_word: בָא
  choice: anakuja
  rationale: Kauli ya kishairi huonyesha tendo linalokaribia au lililo hakika; “anakuja” huhifadhi uhai huo bila kulifanya wazi kuwa wakati uliopita.
- source_word: לִשְׁפֹּט
  choice: kuuhukumu
  rationale: Kitenzi kinaweza pia kuhusisha kutawala au kutetea haki, lakini katika muktadha huu wa haki na usawa, “kuhukumu” ndilo neno la moja kwa moja lisilobana maana kuwa adhabu pekee.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: Ulinganifu na “ulimwengu” pamoja na “watu wa mataifa” unaonyesha upeo wa dunia yote, si nchi fulani.
- source_word: יִשְׁפֹּט
  choice: atauhukumu
  rationale: Wakati ujao wa Kiswahili unaonyesha tendo la hukumu linalotarajiwa kufuatia kuja kwake.
- source_word: תֵּבֵל
  choice: ulimwengu
  rationale: Neno hili hasa humaanisha ulimwengu unaokaliwa; “ulimwengu” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: בְּצֶדֶק
  choice: kwa haki
  rationale: Hapa kihusishi kinaonyesha namna ya kuhukumu; “kwa haki” ni usemi wa asili unaohifadhi sifa ya kimaadili na kimahakama.
- source_word: עַמִּים
  choice: watu wa mataifa
  rationale: Wingi huu unaonyesha makundi mbalimbali ya wanadamu; “watu wa mataifa” ni wazi zaidi kwa msomaji wa kawaida kuliko “watu” pekee.
- source_word: בְּמֵישָׁרִים
  choice: kwa usawa
  rationale: Katika muktadha wa hukumu, neno hili huonyesha unyofu, kutopendelea, na haki sawa; “kwa usawa” ni Kiswahili cha kawaida kinacholingana na “kwa haki.”
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. Kulitohoa kama “Yahwe” huhifadhi jina hilo badala ya kuliweka cheo, huku tanbihi ikifafanua desturi nyingine ya tafsiri.
- issue: Maana ya hukumu ya Mungu katika שׁפט
  choice: kuhukumu
  alternative: kutawala au kutetea haki
  rationale: “Kuhukumu” huhifadhi kwa pamoja uwajibikaji, utoaji wa haki, na kuweka mambo sawa, bila kupunguza maana kuwa kuadhibu au kusimamia tu.
- issue: Wakati na hali ya בָא
  choice: anakuja
  alternative: amekuja au yu karibu kuja
  rationale: Umbo la Kiebrania katika ushairi linaweza kuonyesha tendo lililo karibu au hakika. “Anakuja” huhifadhi mvutano huo wa kishairi bila kulazimisha tafsiri ya wakati uliopita.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umehifadhi mistari miwili ya kishairi na ulinganifu wa “dunia/ulimwengu” na “haki/usawa.”
