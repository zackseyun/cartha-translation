  text: Sing praises to Yahweh with the lyre[b][a], with the lyre and the sound of song.
translation:
  language: sw
  text: Mwimbieni Yahweh sifa kwa kinubi[a], kwa kinubi na sauti ya wimbo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinnor, ala ya kale ya nyuzi ambayo kwa kawaida hutafsiriwa “kinubi”; aina yake halisi haijulikani kwa uhakika.
    reason: lexical_alternative
  - marker: b
    text: Au, “na sauti ya melodi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Mwimbieni ... sifa
  rationale: Kitenzi cha Pi‘el katika hali ya kuamuru, wingi, kinatoa mwito wa kumsifu kwa muziki; “mwimbieni ... sifa” ni Kiswahili cha kawaida kinachohifadhi tendo la kuimba na kusifu.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Herufi ל inaonyesha anayeelekezewa sifa, huku jina la agano יהוה likitoholewa kuwa “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: בְּכִנּוֹר
  choice: kwa kinubi
  rationale: כִּנּוֹר ni ala ya kale ya nyuzi; “kinubi” ni jina linaloeleweka katika Kiswahili, ingawa halibainishi kwa ukamilifu umbo la ala hiyo ya kale. ב ni ya matumizi ya ala, “kwa.”
- source_word: בְּכִנּוֹר
  choice: kwa kinubi
  rationale: Marudio yamehifadhiwa ili kudumisha usambamba na mkazo wa kishairi wa Kiebrania.
- source_word: וְקוֹל זִמְרָה
  choice: na sauti ya wimbo
  rationale: קוֹל inaweza kuwa “sauti” au “sauti ya mtu,” na זִמְרָה ni “wimbo,” “uimbaji,” au “melodi.” Tafsiri hii inadumisha taswira halisi ya kitu kinachosikika na uhusiano wa maneno hayo mawili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano יהוה. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya “kwa kinubi” yamehifadhiwa kwa ajili ya muundo na mkazo wa mstari wa Kiebrania.
