  text: הוֹדִ֣יעַ יְ֭הוָה יְשׁוּעָת֑/וֹ לְ/עֵינֵ֥י הַ֝/גּוֹיִ֗ם גִּלָּ֥ה צִדְקָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/002.yaml
  text: Yahweh has made his salvation known[b][a]; before the eyes of the nations he has revealed his righteousness.
translation:
  language: sw
  text: Yahweh ameufanya wokovu wake ujulikane; mbele ya macho ya mataifa[a] ameifunua haki yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “machoni pa mataifa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “uadilifu wake.” Neno la Kiebrania linaweza kumaanisha haki, uadilifu, au utetezi wa haki, kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la Mungu lililoandikwa katika Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: הוֹדִיעַ
  choice: ameufanya ... ujulikane
  rationale: Hili linaonyesha maana ya kisababishi ya Hiphil ya ידע na ni Kiswahili cha kawaida na kinachoeleweka.
- source_word: יְשׁוּעָתוֹ
  choice: wokovu wake
  rationale: Wokovu huhifadhi maana pana ya tendo la kuokoa, ingawa neno la Kiebrania pia linaweza kumaanisha ukombozi au ushindi.
- source_word: לְעֵינֵי
  choice: mbele ya macho ya
  rationale: Tafsiri hii inadumisha taswira halisi ya nahau ya Kiebrania; maana mbadala ya asili zaidi imewekwa katika tanbihi.
- source_word: הַגּוֹיִם
  choice: mataifa
  rationale: Katika muktadha huu neno linarejelea mataifa kwa upana, si kundi maalumu la kidini pekee.
- source_word: גִּלָּה
  choice: ameifunua
  rationale: Kitenzi cha Piel hapa kinamaanisha kufunua au kuweka wazi na kinaendana na ulinganifu wa kishairi wa mstari.
- source_word: צִדְקָתוֹ
  choice: haki yake
  rationale: Haki ni neno la Kiswahili linalobeba kwa upana wazo la unyofu, uadilifu na kutenda yaliyo sawa, bila kuifunga maana kwenye adhabu au hukumu pekee.
theological_decisions:
- issue: Maana ya צִדְקָה katika muktadha wa wokovu
  choice: haki yake
  alternative: uadilifu wake
  rationale: Haki hudumisha upana na mvutano wa neno la Kiebrania, ambalo hapa linaweza kuhusisha unyofu wa Mungu, utendaji wake wa haki, na kuthibitishwa kwa haki yake kupitia tendo la wokovu. Uadilifu ni uwezekano halali na umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na ulinganifu wa vitenzi umehifadhiwa, huku sentensi ikibaki wazi kwa msomaji wa kawaida.
