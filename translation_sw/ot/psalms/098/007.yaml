base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/007.yaml
  text: Let the sea roar[a], and all that fills it[b], the world and those who dwell in it.
translation:
  language: sw
  text: Bahari na ivume, na vyote vilivyomo ndani yake; ulimwengu na wote wanaokaa ndani yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִרְעַם
  choice: na ivume
  rationale: Kitenzi רעם humaanisha kutoa sauti kubwa kama ya ngurumo au mvumo. Muundo wa Kiswahili wenye kiunganishi na hali ya kutaka, “na ivume,” unaendeleza mwito wa kishairi wa sifa.
- source_word: הַיָּם
  choice: Bahari
  rationale: “Bahari” ndilo neno la kawaida na la asili kwa יָם katika Kiswahili, nalo linafaa katika ushairi huu.
- source_word: וּמְלֹאוֹ
  choice: pamoja na vyote vilivyo ndani yake
  rationale: Kirai hiki kihalisi ni “na ujazo wake,” yaani kila kitu kilichomo baharini. Tafsiri hii inaeleza maana hiyo kwa Kiswahili cha kawaida bila kuifanya bahari kuwa mtendaji wa kitendo kisicho wazi.
- source_word: תֵּבֵל
  choice: ulimwengu
  rationale: תֵּבֵל huonyesha ulimwengu, hasa dunia inayokaliwa na watu. “Ulimwengu” ni tafsiri fupi na ya kawaida, huku kirai kinachofuata kikidhihirisha wazo la kukaliwa.
- source_word: וְיֹשְׁבֵי בָהּ
  choice: na wote wanaokaa ndani yake
  rationale: Muundo wa Kiebrania ni “na wakaaji ndani yake.” “Wote wanaokaa ndani yake” huhifadhi hali ya kitenzi na mtiririko wa kishairi kwa lugha ya sasa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo “na ivume” umetumiwa kuonyesha nguvu ya hiari/ya mwito katika kitenzi cha Kiebrania; alama ya nusu koloni inaonyesha ulinganifu wa mistari miwili.
