lexical_decisions:
- source_word: נְהָרוֹת
  choice: Mito
  rationale: Nomino ya wingi inamaanisha mito; uchaguzi huu ni wa moja kwa moja na unaendeleza taswira ya uumbaji ukimsifu Mungu.
- source_word: יִמְחֲאוּ כָף
  choice: na ipige makofi
  rationale: Kirai hiki kwa kawaida humaanisha kupiga makofi. Kiswahili hutumia ‘kupiga makofi’ kwa ufasaha, huku umoja wa kisarufi ‘ipige’ ukipatana na ngeli ya ‘mito’.
- source_word: יַחַד
  choice: pamoja
  rationale: Kielezi hiki humaanisha ‘pamoja’ na kinaonyesha milima ikiungana katika sifa.
- source_word: הָרִים
  choice: milima
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi ukubwa wa taswira kuliko ‘vilima’.
- source_word: יְרַנֵּנוּ
  choice: na iimbe ... kwa shangwe
  rationale: Kitenzi kinaweza kuashiria kuimba kwa furaha au kutoa mwito wa shangwe. ‘Kuimba kwa shangwe’ ni cha asili katika Kiswahili na huhifadhi hali ya furaha bila kuondoa uwezekano wa mwito wa kishangwe.
theological_decisions:
- issue: Uhuishaji wa kishairi wa uumbaji katika sifa
  choice: Kuhifadhi moja kwa moja taswira ya mito ikipiga makofi na milima ikiimba kwa shangwe
  alternative: Kufafanua kwa njia ya dhahania kuwa uumbaji unawachochea wanadamu kumsifu Mungu
  rationale: Kiebrania huonyesha mito na milima kama washiriki waliohuishwa katika sifa ya ulimwengu wote; taswira hiyo ihifadhiwe bila kuongeza dai jingine la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Miundo ya ‘na’ yenye kiima cha nafsi ya tatu imetumiwa kuwasilisha nguvu ya wito wa kishairi. Hakuna tanbihi iliyowekwa kwa sababu maana pana ya יְרַנֵּנוּ imewasilishwa kwa ‘iimbe kwa shangwe’ bila kulazimisha utata wa msingi.
