  text: גַּֽם עַ֭בְדְּ/ךָ נִזְהָ֣ר בָּ/הֶ֑ם בְּ֝/שָׁמְרָ֗/ם עֵ֣קֶב רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/011.yaml
  text: Also[a], your servant is warned by them[b]; in keeping them there is great reward.
translation:
  language: sw
  text: Pia, mtumishi wako huonywa nazo[a]; katika kuzishika kuna thawabu kubwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huchukua tahadhari kwa kuyasikiliza”; kitenzi cha Kiebrania kinaweza kumaanisha kuonywa au kuchukua tahadhari.
    reason: lexical_alternative
  - marker: b
    text: Au, “matokeo mengi yenye manufaa.” Neno la Kiebrania linaweza kumaanisha thawabu, malipo, au matokeo yanayofuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Pia
  rationale: Inaendeleza sifa za maagizo ya BWANA katika mistari iliyotangulia na kuhifadhi maana ya nyongeza.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Mtunga zaburi anajitaja kwa Mungu kwa lugha ya uhusiano na ibada; “mtumishi” ni ya asili na yenye heshima katika muktadha huu.
- source_word: נִזְהָר
  choice: huonywa
  rationale: Kauli ya Kiebrania hapa inaweza kumaanisha kuonywa au kuchukua tahadhari. “Huonywa” huhifadhi vizuri hali ya kutendwa bila kufunga uwezekano wa kuitikia onyo.
- source_word: בָּהֶם
  choice: nazo
  rationale: Kiwakilishi kinarejelea hukumu na maagizo ya BWANA yaliyotajwa kabla; pamoja na “huonywa,” “nazo” huonyesha kuwa hayo ndiyo yanayotoa onyo.
- source_word: בְּשָׁמְרָם
  choice: katika kuzishika
  rationale: Huhifadhi uhusiano wa kimazingira au wa njia kati ya kutii maagizo na matokeo yanayofuata.
- source_word: עֵקֶב
  choice: thawabu
  rationale: Katika muktadha huu neno linaonyesha manufaa au malipo yanayofuata kuyashika maagizo, bila kufafanua mfumo wa kustahili mbele za Mungu.
- source_word: רָב
  choice: kubwa
  rationale: Hueleza ukubwa au wingi wa thawabu kwa Kiswahili cha kawaida na cha asili.
theological_decisions:
- issue: Je, mstari unafundisha kupata thawabu kwa kustahili mbele za Mungu, au unaeleza tu matokeo yenye manufaa ya utii?
  choice: Maneno yanaeleza kwamba kuyashika maagizo ya Mungu kuna thawabu kubwa, bila kuingiza fundisho maalumu la kustahili.
  alternative: Kuyashika maagizo humfanya mtu ajipatie thawabu kutoka kwa Mungu kwa kustahili.
  rationale: Kiebrania kinaunganisha kuyashika maagizo na “thawabu kubwa,” lakini hakifafanui msingi au namna ya thawabu hiyo. Tafsiri inadumisha kauli chanya pamoja na mvutano wake wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Huonywa nazo” ni kifupi na cha asili, huku “katika kuzishika” kikihifadhi muundo na mvutano wa chanzo bila kuufanya mstari kuwa dai la moja kwa moja kuhusu kustahili.
