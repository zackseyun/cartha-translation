base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/009.yaml
  text: The fear of Yahweh is pure[a], enduring forever; the judgments of Yahweh are true[d][c][b]; they are altogether righteous.
translation:
  language: sw
  text: Kumcha Yahweh ni safi[a], hudumu milele[b]; hukumu za Yahweh ni kweli[c]; zote ni za haki kabisa[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ni safi.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “husimama milele.”
    reason: lexical_alternative
  - marker: c
    text: Neno la Kiebrania linaweza pia kumaanisha kwamba hukumu hizo ni za kuaminika.
    reason: lexical_alternative
  - marker: d
    text: Kiebrania, “zimekuwa za haki pamoja”; yaani, hukumu zote za Yahweh ni za haki kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: Kumcha Yahweh
  rationale: Inahifadhi nahau ya Kiebrania ya hofu yenye heshima na uchaji unaoelekezwa kwa Yahweh, bila kuifasiri kwa kuibadili kuwa “ibada” au “dini.”
- source_word: טְהוֹרָה
  choice: ni safi
  rationale: “Safi” ni Kiswahili cha kawaida kinachoweza kueleza usafi wa kimaadili au wa kiibada; kinadumisha picha ya neno la Kiebrania.
- source_word: עוֹמֶדֶת לָעַד
  choice: hudumu milele
  rationale: Kirai hicho kihalisi ni “husimama milele,” lakini hapa kina maana ya kudumu bila mwisho; “hudumu milele” ni ya asili na wazi kwa Kiswahili.
- source_word: מִשְׁפְּטֵי יְהוָה
  choice: hukumu za Yahweh
  rationale: “Hukumu” inadumisha wazo la maamuzi au masharti ya kimahakama ya Mungu na ni sawa na wingi wa מִשְׁפָּט.
- source_word: אֱמֶת
  choice: ni kweli
  rationale: Nomino ya Kiebrania inafanya kazi kama kiarifu; “ni kweli” ni usemi wa kawaida wa Kiswahili na hudumisha dai kwamba hukumu hizo zina ukweli na uaminifu.
- source_word: צָדְקוּ יַחְדָּו
  choice: zote kwa pamoja ni za haki
  rationale: 'Inahifadhi nguvu ya pamoja ya יַחְדָּו: hukumu zote, zikichukuliwa kwa pamoja, ni za haki kabisa.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo, kwa kufuata ushahidi wa maandishi ya chanzo.
theological_decisions:
- issue: Maana ya “kumcha Yahweh” katika mfululizo unaosifu ufunuo na maagizo ya Mungu
  choice: Kudumisha usemi “Kumcha Yahweh”
  alternative: “Ibada ya Yahweh” au “dini ya Yahweh”
  rationale: Ingawa usemi huo unaweza kueleweka kimetonimia kuwa uchaji au ibada iliyofunuliwa, tafsiri haipaswi kufuta wigo wake wa hofu, heshima, uchaji, na uaminifu kwa Mungu.
- issue: Nguvu ya pamoja ya צָדְקוּ יַחְדָּו
  choice: “zote kwa pamoja ni za haki”
  alternative: “kila moja ni ya haki” au “ni za haki kabisa”
  rationale: Uchaguzi unahifadhi uwezekano kwamba kauli inazisifu hukumu zote kama jumla yenye upatano, bila kupoteza maana kwamba ni za haki kikamilifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi unafuata usambamba wa Kiebrania. Jina “Yahweh” limedumishwa. Alama zote za tanbihi zimewekwa baada ya vipashio vinavyohusika.
