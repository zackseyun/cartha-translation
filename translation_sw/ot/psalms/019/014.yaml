base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/014.yaml
  text: May the words of my mouth and the meditation of my heart be acceptable before you[a], O Yahweh[b], my rock and my redeemer.
translation:
  language: sw
  text: Maneno ya kinywa changu na tafakari ya moyo wangu vikubalike mbele zako,[a] Ee Yahweh, mwamba wangu na mkombozi wangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “machoni pako.” Kihalisi, Kiebrania kinasema “mbele ya uso/uwepo wako.”
    reason: lexical_alternative
  - marker: b
    text: “Mkombozi” hutafsiri neno linalomhusu anayeokoa au kurejesha kilichopotea, na mara nyingi lilihusishwa na wajibu wa jamaa wa karibu katika sheria ya Israeli.
    reason: cultural_note
lexical_decisions:
- source_word: יִהְיוּ
  choice: na vikubalike
  rationale: Kauli ya hali isiyotimilika ya היה ina nguvu ya ombi au tamanio hapa; muundo wa Kiswahili wenye “na” unaonyesha ombi hilo kwa kawaida.
- source_word: לְרָצוֹן
  choice: vikubalike
  rationale: Muundo huu unaonyesha kukubaliwa au kupendeza mbele za Mungu; “vikubalike” ni wa asili katika sala na huhifadhi maana hiyo.
- source_word: אִמְרֵי פִי
  choice: maneno ya kinywa changu
  rationale: Tafsiri hii huhifadhi taswira halisi ya maneno yanayotamkwa na ulinganifu wake wa kishairi.
- source_word: הֶגְיוֹן לִבִּי
  choice: tafakari ya moyo wangu
  rationale: הֶגְיוֹן inaweza kumaanisha kutafakari, kuwaza, au kunong’ona; hapa “tafakari” huonyesha shughuli ya ndani inayolinganishwa na maneno ya kinywa.
- source_word: לְפָנֶיךָ
  choice: mbele zako
  rationale: Huhifadhi kwa kifupi nahau ya Kiebrania yenye maana halisi ya kuwa mbele ya uso au uwepo wa Mungu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: צוּרִי
  choice: mwamba wangu
  rationale: Huhifadhi sitiari ya Kiebrania ya mwamba kama picha ya uthabiti na ulinzi.
- source_word: וְגֹאֲלִי
  choice: na mkombozi wangu
  rationale: גאל humaanisha kukomboa au kuokoa, mara nyingi katika wajibu wa jamaa wa karibu; “mkombozi” ni fupi na haibani maana kwa muktadha mmoja tu.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Ee Yahweh
  alternative: Ee Yehova
  rationale: Andiko linatumia Tetragramatoni moja kwa moja; “Yahweh” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Sitiari צוּרִי
  choice: mwamba wangu
  alternative: kimbilio langu
  rationale: “Mwamba wangu” huhifadhi sitiari ya kishairi bila kuitafsiri kwa maana moja nyembamba ya ulinzi.
- issue: Maana ya גֹאֲלִי
  choice: mkombozi wangu
  alternative: jamaa yangu mkombozi
  rationale: Neno linaweza kuwa na usuli wa wajibu wa jamaa, lakini katika hotuba hii ya kishairi “jamaa yangu mkombozi” ingeweka wazi zaidi ya yale mstari wenyewe unayosema.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi ya sala ya kishairi. Muundo wa “na vikubalike” huwasilisha tamanio la Kiebrania; kiima ambatani kimefuatwa na upatanisho wa ngeli ya vi- kwa mtazamo wa jumla.
