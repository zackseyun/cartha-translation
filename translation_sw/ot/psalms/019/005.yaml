  text: And it is like a bridegroom coming out from his wedding chamber[a]; it rejoices like a warrior to run a course.
translation:
  language: sw
  text: Nalo ni kama bwana arusi anayetoka katika chumba chake cha arusi[a]; linafurahia kukimbia njia, kama shujaa afurahivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka chini ya dari yake ya harusi,” au “kutoka katika chumba cha harusi.” Neno la Kiebrania חֻפָּה linaweza kumaanisha dari ya harusi au chumba cha arusi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Nalo ni
  rationale: Kiwakilishi kinarejelea jua katika mstari uliotangulia. Kiswahili hulitaja jua katika ngeli ya LI-YA, hivyo “nalo” linahifadhi kiunganishi na rejeleo hilo.
- source_word: כְּחָתָן
  choice: kama bwana arusi
  rationale: “Bwana arusi” ni usemi wa kawaida na wenye hadhi kwa mwanamume anayefunga ndoa, na unadumisha taswira ya harusi.
- source_word: יֹצֵא
  choice: anayetoka
  rationale: Huwasilisha tendo la kutoka kwa namna hai, sambamba na umbo la Kiebrania linaloonyesha tendo linaloendelea.
- source_word: מֵחֻפָּתוֹ
  choice: katika chumba chake cha arusi
  rationale: חֻפָּה inaweza kumaanisha dari ya harusi au chumba cha arusi. Katika taswira ya bwana arusi akitoka, “chumba cha arusi” ni ya asili kwa Kiswahili; uwezekano mwingine umehifadhiwa katika tanbihi.
- source_word: יָשִׂישׂ
  choice: linashangilia
  rationale: Kitenzi kinaonyesha furaha kubwa na yenye nguvu. “Linashangilia” ni cha sasa, cha asili, na kinaendeleza uhuishaji wa jua.
- source_word: כְּגִבּוֹר
  choice: kama shujaa
  rationale: גִּבּוֹר humaanisha mtu hodari au shujaa, mara nyingi mpiganaji. “Shujaa” huhifadhi nguvu na hadhi ya taswira bila kulazimisha maana ya vita pekee.
- source_word: לָרוּץ
  choice: kukimbia
  rationale: Ni tafsiri ya moja kwa moja ya רוץ na haiongezi wazo la mashindano.
- source_word: אֹרַח
  choice: njia yake
  rationale: אֹרַח ni njia au mapito. “Njia yake” ni Kiswahili cha asili katika muktadha wa jua likipita angani, huku kimilikishi kikibainisha rejeleo bila kubadili taswira.
