  text: The heavens declare the glory of God[b][a], and the expanse proclaims the work of his hands.
translation:
  language: sw
  text: Mbingu zinatangaza utukufu wa Mungu, na anga[a] hudhihirisha kazi ya mikono yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anga lililotandazwa.” Neno la Kiebrania רָקִיעַ hurejelea anga lililoenea au kuba ya mbinguni.
    reason: lexical_alternative
  - marker: b
    text: Au, “ufundi wa mikono yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁמַיִם
  choice: Mbingu
  rationale: Neno hili linaweza kumaanisha mbingu au anga; “Mbingu” linadumisha mtindo wa kishairi na upeo mpana wa ulimwengu.
- source_word: מְסַפְּרִים
  choice: zinatangaza
  rationale: Kitenzi hiki cha hali endelevu kina maana ya kusimulia au kutangaza; “zinatangaza” kinaonyesha uhuishaji wa mbingu kwa Kiswahili cha kawaida.
- source_word: כְּבוֹד
  choice: utukufu
  rationale: “Utukufu” ni tafsiri iliyozoeleka na yenye hadhi kwa כבוד, ikijumuisha heshima na ukuu wa Mungu.
- source_word: אֵל
  choice: Mungu
  rationale: Hapa אֵל ni cheo cha Mungu Muumba, hivyo “Mungu” ni tafsiri ya asili kuliko kunukuu jina “El.”
- source_word: וּמַעֲשֵׂה יָדָיו
  choice: kazi ya mikono yake
  rationale: Tafsiri hii inadumisha taswira halisi ya Kiebrania ya kazi iliyofanywa kwa mikono yake.
- source_word: מַגִּיד
  choice: linahubiri
  rationale: Hiphil ya נגד humaanisha kufanya jambo lijulikane au kulitangaza; “linahubiri” linatoa ulinganifu wa kishairi bila kurudia tu “linatangaza.”
- source_word: הָרָקִיעַ
  choice: anga
  rationale: רָקִיעַ hurejelea eneo lililotandazwa la mbinguni; “anga” ni neno la sasa na la kawaida, huku tanbihi ikihifadhi taswira pana zaidi ya chanzo.
theological_decisions:
- issue: Tafsiri ya אֵל
  choice: Mungu
  alternative: El
  rationale: Ingawa אֵל yaweza kutumiwa kama jina au cheo “El,” katika mstari huu inamtaja Mungu ambaye utukufu wake unaonyeshwa na uumbaji. “Mungu” huwasilisha maana hiyo bila kuongeza mkazo wa jina maalumu ambao muktadha haulazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki chenye mtindo wa kishairi, wa sasa na wenye hadhi. Ulinganifu wa mistari ya Kiebrania na taswira ya “mikono yake” vimedumishwa.
