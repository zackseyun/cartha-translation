translation:
  language: sw
  text: Ni nani anayeweza kutambua makosa yake? Unitakase kutoka katika makosa yaliyofichika[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhambi za siri,” au “mambo yaliyofichika.” Kiebrania kinaweza kumaanisha makosa yaliyofichika kwa msemaji mwenyewe, kwa watu wengine, au mambo yaliyofichika kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁגִיאוֹת
  choice: makosa
  rationale: Neno hili humaanisha makosa, kupotoka, au dhambi zinazotendwa kwa kukosea. “Makosa” ni la kawaida na linaacha wazi ikiwa hayakukusudiwa, huku muktadha ukidumisha uzito wake wa kimaadili.
- source_word: מִי
  choice: Ni nani
  rationale: Hili ni neno la kawaida la kuuliza, na hapa linaanzisha swali la balagha.
- source_word: יָבִין
  choice: anayeweza kutambua
  rationale: Kitenzi humaanisha kuelewa au kutambua. Kauli hii inaonyesha ugumu wa mwanadamu kuyagundua kikamilifu makosa yake mwenyewe.
- source_word: מִנִּסְתָּרוֹת
  choice: na makosa yaliyofichika
  rationale: Muundo huu kihalisi ni “kutoka kwa mambo yaliyofichwa.” Usambamba na “makosa” unaelekeza kwenye makosa au dhambi zilizofichika, lakini hauamui ikiwa zimefichika kwa msemaji mwenyewe au kwa wengine.
- source_word: נַקֵּנִי
  choice: Unitakase
  rationale: Amri hii inaweza kumaanisha kumweka mtu bila hatia, kumsafisha, au kumwondolea hatia. “Unitakase” ni Kiswahili cha kawaida katika ombi kwa Mungu na kinadumisha wazo la kuondolewa uchafu au hatia, ingawa upande wa kimahakama si wazi kwa kiwango kilekile.
theological_decisions:
- issue: Asili ya mambo au makosa yaliyofichika
  choice: Kauli inarejelea makosa au dhambi zilizofichika.
  alternative: Dhambi za siri, au mambo yaliyofichika kwa ujumla.
  rationale: Usambamba wake na “makosa” unapendelea maana ya kimaadili. Tafsiri haibainishi ikiwa makosa hayo hayajulikani kwa msemaji mwenyewe au yamefichwa kwa wengine.
translation_notes:
