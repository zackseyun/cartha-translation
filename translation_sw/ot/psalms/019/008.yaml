id: PSA.19.8
reference: Psalms 19:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: פִּקּ֘וּדֵ֤י יְהוָ֣ה יְ֭שָׁרִים מְשַׂמְּחֵי לֵ֑ב מִצְוַ֥ת יְהוָ֥ה בָּ֝רָ֗ה מְאִירַ֥ת עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/008.yaml
  text: The precepts of Yahweh are right[a], rejoicing the heart; the commandment of Yahweh is pure, enlightening the eyes.
translation:
  language: sw
  text: Maagizo ya Yahwe ni manyofu, huufurahisha moyo; amri ya Yahwe ni safi[a], huyatia macho nuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wazi”; kivumishi cha Kiebrania kinaweza kusisitiza usafi, huku maana ya uwazi ikipatana na kishazi kinachofuata, “huyatia macho nuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּקּוּדֵי
  choice: maagizo
  rationale: Neno hili linamaanisha maelekezo au matakwa yaliyowekwa kwa mamlaka. “Maagizo” ni la kawaida na la kueleweka, huku likitofautishwa na “amri” katika nusu ya pili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: יְשָׁרִים
  choice: manyofu
  rationale: “Manyofu” huwasilisha maana ya kuwa sawa na kutopotoka, na linafaa kwa lugha ya kishairi inayoyaelezea maagizo.
- source_word: מְשַׂמְּחֵי לֵב
  choice: huufurahisha moyo
  rationale: Muundo huu huhifadhi maana sababishi na athari inayoendelea ya maagizo kwa moyo.
- source_word: לֵב
  choice: moyo
  rationale: “Moyo” huhifadhi taswira ya Kiebrania, ambayo hapa inaweza kuhusisha hisia, fikra na nia.
- source_word: מִצְוַת
  choice: amri
  rationale: Umoja wa Kiebrania umehifadhiwa, na “amri” linatofautisha neno hili na פִּקּוּדֵי katika mstari sambamba.
- source_word: בָּרָה
  choice: safi
  rationale: Maana ya msingi ni safi au isiyo na uchafu; “safi” huhifadhi maana hiyo bila kulazimisha wazo la uwazi.
- source_word: מְאִירַת עֵינָיִם
  choice: huyatia macho nuru
  rationale: Tafsiri hii huhifadhi kitendo sababishi na taswira halisi ya nuru na macho kwa Kiswahili cha asili.
- source_word: עֵינָיִם
  choice: macho
  rationale: Nomino halisi imehifadhiwa badala ya kubadilishwa kuwa tafsiri ya kimawazo kama “ufahamu”.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya בָּרָה katika uhusiano na kutiwa nuru kwa macho
  choice: safi
  alternative: wazi
  rationale: “Safi” ndiyo maana ya msingi ya kivumishi, lakini “wazi” linawezekana kwa sababu athari inayofuata ni kuyatia macho nuru; uwezekano huo umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Usambamba wa vipashio viwili umehifadhiwa, pamoja na taswira za “moyo,” “macho,” na “nuru.”
