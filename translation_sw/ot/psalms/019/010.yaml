  yaml_path: translation/ot/psalms/019/010.yaml
  text: They are more desirable than gold[a], even than much fine gold, and sweeter than honey and drippings from the honeycomb.
translation:
  language: sw
  text: Ni za kutamanika kuliko dhahabu[a], hata kuliko dhahabu safi nyingi; ni tamu kuliko asali, hata asali inayodondoka kutoka kwenye masega.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zinazotamanika kuliko dhahabu ... na tamu kuliko asali, hata asali inayodondoka kutoka kwenye masega.” Kiebrania hutumia miundo ya sifa pamoja na vifungu vya ulinganisho; maneno ya mwisho yanaweza kutafsiriwa kwa ukaribu zaidi kuwa “asali inayodondoka ya masega.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּחֱמָדִים
  choice: Ni za kutamanika
  rationale: Umbo tendwa la kitenzi חמד linaeleza sifa ya mambo yaliyotajwa katika mstari uliotangulia. Kiswahili hiki ni cha kawaida na hudumisha maana ya kwamba yanastahili kutamaniwa.
- source_word: מִזָּהָב
  choice: kuliko dhahabu
  rationale: Kiambishi מִן kinaonyesha ulinganisho; “kuliko dhahabu” ni ulinganisho wa asili katika Kiswahili.
- source_word: וּמִפַּז רָב
  choice: naam, kuliko dhahabu safi nyingi
  rationale: פַּז ni dhahabu bora au iliyosafishwa, na רָב huonyesha wingi. “Naam” hudhihirisha kupanda kwa nguvu kwa ulinganisho bila kufuta tofauti kati ya זָהָב na פַּז.
- source_word: וּמְתוּקִים
  choice: ni tamu
  rationale: Katika Kiswahili, kiwango cha ulinganisho huonyeshwa kwa “kuliko” badala ya kubadili kivumishi; hivyo “ni tamu kuliko” huwasilisha maana ya ulinganisho kwa kawaida.
- source_word: מִדְּבַשׁ
  choice: kuliko asali
  rationale: מִן tena ni ya ulinganisho, na דְּבַשׁ ni asali.
- source_word: וְנֹפֶת צוּפִים
  choice: hata asali inayodondoka kutoka kwenye masega
  rationale: נֹפֶת huleta picha ya asali inayotiririka au kudondoka, huku צוּפִים ikielekea kumaanisha masega. “Hata” huonyesha kwamba fungu hili linaongeza aina iliyo bora sana ya asali katika ulinganisho.
