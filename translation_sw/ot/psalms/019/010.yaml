translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. “Ni za kutamanika” hukubaliana na rejeleo la wingi kutoka mstari uliotangulia; nusu ya pili haitumii “tamu zaidi” kwa sababu muundo wa kawaida wa Kiswahili ni “tamu kuliko.”
