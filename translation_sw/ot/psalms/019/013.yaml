  edition: WLC
  text: גַּ֤ם מִ/זֵּדִ֨ים חֲשֹׂ֬ךְ עַבְדֶּ֗/ךָ אַֽל יִמְשְׁלוּ בִ֣/י אָ֣ז אֵיתָ֑ם וְ֝/נִקֵּ֗יתִי מִ/פֶּ֥שַֽׁע רָֽב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/013.yaml
  text: Also keep your servant back from presumptuous sins[a]; do not let them rule over me[d][c][b]. Then I will be blameless and be cleared from great transgression.
translation:
  language: sw
  text: Pia unizuie, mimi mtumishi wako, nisitende dhambi za kiburi[a]; zisinitawale. Ndipo nitakuwa bila lawama[b], nami nitakuwa huru na uasi mkubwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhidi ya wenye kiburi.” Neno la Kiebrania linaweza kumaanisha watu wenye kiburi au dhambi za kiburi.
    reason: alternative_reading
  - marker: b
    text: Au, “mnyofu,” “mkamilifu,” au “asiye na hatia.” Neno la Kiebrania linaweza kuonyesha uadilifu au ukamilifu wa mwenendo.
    reason: lexical_alternative
  - marker: c
    text: Au, “kosa kubwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Pia
  rationale: Inaunganisha ombi hili na ombi la mstari uliotangulia kuhusu makosa yaliyofichika, huku ikihifadhi maana ya nyongeza.
- source_word: מִזֵּדִים
  choice: asitende dhambi za kiburi
  rationale: Neno la Kiebrania linaweza kumaanisha watu wenye kiburi au matendo ya kiburi. Muktadha wa makosa na dhambi katika mstari uliotangulia unaunga mkono maana ya dhambi zinazotendwa kwa kiburi; muundo huu pia hufanya ombi la kumzuia mtumishi lisikike kwa Kiswahili cha kawaida.
- source_word: חֲשֹׂךְ
  choice: umlinde ... asitende
  rationale: Kitenzi kinaomba Mungu amzuie au amkinge mtumishi wake; tafsiri hii ni ya asili kwa Kiswahili na inaonyesha kwamba Mungu anamzuia asiingie katika dhambi hizo.
- source_word: עַבְדֶּךָ
  choice: mtumishi wako
  rationale: Ni usemi wa kawaida na wenye heshima katika sala, unaohifadhi hali ya kujitiisha kwa Mungu.
- source_word: אַל יִמְשְׁלוּ בִי
  choice: usiziache zimtawale
  rationale: Inahifadhi taswira ya dhambi kuwa nguvu inayoweza kumiliki na kutawala mtu.
- source_word: אָז
  choice: Ndipo
  rationale: Inaonyesha matokeo yanayofuata Mungu anapomzuia mtumishi wake.
- source_word: אֵיתָם
  choice: nitakapokuwa bila lawama
  rationale: Neno linaonyesha ukamilifu wa mwenendo au uadilifu, si lazima kutokuwa na dhambi kabisa.
- source_word: וְנִקֵּיתִי
  choice: na kutakaswa
  rationale: Mzizi נקה una maana ya kuwa huru na hatia au kuhesabiwa safi; 'kutakaswa' ni Kiswahili cha kawaida katika muktadha huu, ingawa kinaweza pia kueleweka kuwa kuondolewa hatia.
- source_word: מִפֶּשַׁע רָב
  choice: na kosa kubwa
  rationale: פשע ni kosa zito au uasi dhidi ya Mungu; 'kosa kubwa' ni wazi na huhifadhi uzito wa usemi wa Kiebrania.
theological_decisions:
- issue: Kirejeleo cha מִזֵּדִים
  choice: dhambi za kiburi
  alternative: watu wenye kiburi
  rationale: Muktadha wa karibu unazungumzia makosa na dhambi, na kauli ya kutotawaliwa nayo inafaa vizuri kwa nguvu ya dhambi. Hata hivyo, maana ya watu wenye kiburi imehifadhiwa katika tanbihi.
- issue: Maana ya אֵיתָם
  choice: bila lawama kwa maana ya uadilifu wa mwenendo
  alternative: mkamilifu au asiye na hatia
  rationale: Tafsiri hii inaonyesha unyofu mbele za Mungu bila kudai kwamba msemaji hana dhambi yoyote kabisa.
- issue: Maana ya וְנִקֵּיתִי
  choice: kutakaswa na kosa kubwa
  alternative: kuwa huru na hatia ya uasi mkubwa
  rationale: Usemi unaonyesha kuondolewa au kutokuwa chini ya hatia; haupaswi kulazimishwa kuwa dai la kutokuwa na dhambi kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sala umehifadhiwa, na sintaksia imetengenezwa kuwa ya asili bila kufuta utata halisi wa מִזֵּדִים.
