  text: מִ/קְצֵ֤ה הַ/שָּׁמַ֨יִם מֽוֹצָא֗/וֹ וּ/תְקוּפָת֥/וֹ עַל קְצוֹתָ֑/ם וְ/אֵ֥ין נִ֝סְתָּ֗ר מֵֽ/חַמָּת/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/006.yaml
  text: Its rising is from one end of the heavens[a], and its circuit to their ends[c][b], and nothing is hidden from its heat.
translation:
  language: sw
  text: Kuchomoza kwake ni kutoka upande mmoja wa mbingu[a], na mzunguko wake hufika mpaka ncha zake[b]; wala hakuna chochote kinachoweza kujificha joto lake lisikifikie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kwake.” Neno la Kiebrania linaweza kumaanisha kujitokeza au mahali pa kutoka.
    reason: lexical_alternative
  - marker: b
    text: Au, “mwendo wake hufika mpaka ncha zake.” Neno la Kiebrania linaweza kumaanisha mzunguko, njia inayozunguka, au kugeuka.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה הַשָּׁמַיִם
  choice: kutoka upande mmoja wa mbingu
  rationale: קָצֶה ni mwisho au ukingo. Katika muktadha huu, Kiswahili cha asili kinahitaji 'upande mmoja' ili kuonyesha mahali pa kuanzia bila kudokeza kwamba mbingu ina mwisho mmoja tu; 'mbingu' huhifadhi istilahi ya kishairi.
- source_word: מוֹצָאוֹ
  choice: kuchomoza kwake
  rationale: מוֹצָא ni kutoka au kujitokeza, na kwa jua inaweza kumaanisha kuchomoza. 'Kuchomoza kwake' ni wazi na ya kishairi katika Kiswahili, huku tanbihi ikihifadhi maana pana ya kutoka kwake.
- source_word: וּתְקוּפָתוֹ
  choice: na mzunguko wake
  rationale: תְּקוּפָה huonyesha mzunguko, kuzunguka, au mwendo unaokamilisha njia. 'Mzunguko' huhifadhi taswira ya kishairi ya njia ya jua katika mbingu.
- source_word: עַל קְצוֹתָם
  choice: hufika miisho yake
  rationale: עַל pamoja na wazo la mzunguko huonyesha upeo wa mwendo. 'Hufika miisho yake' ni Kiswahili cha kawaida na kiambishi 'yake' kinarejelea mbingu.
- source_word: וְאֵין נִסְתָּר
  choice: wala hakuna chochote kilichofichika
  rationale: אֵין na participio ya kutendwa נִסְתָּר hutoa dai la jumla kwamba hakuna kitu kilichofichika. Muundo huu ni wa asili na wenye hadhi katika Kiswahili.
- source_word: מֵחַמָּתוֹ
  choice: na joto lake
  rationale: מִן hapa huonyesha kile ambacho hakuna kinachoweza kujificha nacho au kukiepuka. Kiswahili 'kilichofichika na joto lake' ni cha asili zaidi kuliko 'kutoka kwa joto lake'; חַמָּה ni joto kali la jua, si uvuguvugu.
theological_decisions:
- issue: Kiwango cha kulifanya jua lionekane kama mtu
  choice: Kutumia viambishi vya kawaida vya ngeli ya jua ('kwake,' 'wake,' 'lake') bila kuongeza lugha inayolifanya kuwa kiumbe cha kiungu.
  alternative: Kutumia lugha yenye uhuishaji mkubwa zaidi ili kuakisi viambishi vya kiume vya Kiebrania.
  rationale: Viambishi vya umoja wa kiume katika Kiebrania vinafuata jinsia ya kisarufi ya 'jua.' Kiswahili nacho hutumia upatanisho wa ngeli; hivyo tafsiri inahifadhi picha ya kishairi bila kuingiza wazo la kimytholojia au la kiungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka kwa wasomaji wa kawaida. Alama zote za tanbihi zimewekwa baada ya vifungu vinavyohusika; mpangilio wake umewekwa a, b.
