base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/004.yaml
  text: Their line has gone out through all the earth[a], and their words to the end of the world. In them he has set a tent for the sun[b],
translation:
  language: sw
  text: Kamba yao imeenea katika dunia yote[a], na maneno yao hadi miisho ya ulimwengu. Ndani yao ameliwekea jua hema[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sauti yao imeenea katika dunia yote.” Maandishi ya konsonanti ya Kiebrania yanasema “kamba yao,” lakini baadhi ya tafsiri za kale na wafafanuzi wengi huelewa maana yake kuwa “sauti” katika muktadha huu wa kishairi.
    reason: alternative_reading
  - marker: b
    text: “Ndani yao” huenda inarejelea mbingu zilizotajwa katika aya iliyotangulia.
    reason: cross_reference
lexical_decisions:
- source_word: קַוָּם
  choice: kamba yao
  rationale: Maandishi ya konsonanti ya Kiebrania yana neno קַו, yaani ‘kamba/mstari.’ ‘Kamba yao’ linahifadhi picha halisi ya maandishi huku wazo la kufika kwake kila mahali likionyeshwa kwa ‘imeenea.’ Maana mbadala ya ‘sauti yao’ imehifadhiwa katika tanbihi kwa sababu ushahidi wa tafsiri za kale na muktadha wa kishairi umeifanya ikubalike sana.
- source_word: יָצָא
  choice: imeenea
  rationale: Kitenzi hiki kimsingi ni ‘imetoka,’ lakini pamoja na ‘kamba’ hapa ‘imeenea’ ni Kiswahili cha kawaida kinachoeleza kutoka na kufika kote bila kuondoa picha ya kamba.
- source_word: מִלֵּיהֶם
  choice: maneno yao
  rationale: Neno hili humaanisha maneno au usemi; ‘maneno yao’ ni la moja kwa moja na linadumisha ulinganifu wa kishairi.
- source_word: תֵבֵל
  choice: ulimwengu
  rationale: תֵבֵל hurejelea ulimwengu, hasa dunia inayokaliwa; ‘ulimwengu’ ni tamko la kawaida na la kishairi katika Kiswahili.
- source_word: שָׂם
  choice: ameliwekea
  rationale: Kitenzi kinaeleza tendo la Mungu la kuweka. Muundo ‘ameliwekea jua’ ni wa asili katika Kiswahili na unaonyesha kuwa hema limewekwa kwa ajili ya jua.
- source_word: אֹהֶל
  choice: hema
  rationale: Maana ya kawaida ni hema; neno hili huepuka kuingiza maana maalumu ya kiibada isiyodaiwa na muktadha.
- source_word: בָּהֶם
  choice: ndani yake
  rationale: Kiwakilishi cha Kiebrania kinarejelea kwa wingi vitu vilivyotangulia, huenda mbingu katika aya iliyopita. Kiswahili hutumia ‘ndani yake’ kwa marejeo ya mahali pa jumla; tanbihi inabainisha rejeo linalowezekana bila kulifanya kuwa wazi kupita maandishi.
- source_word: לַשֶּׁמֶשׁ
  choice: kwa jua
  rationale: Hii ni tafsiri ya moja kwa moja ya kishazi cha kihusishi, ikionyesha hema lililowekwa kwa ajili ya jua.
