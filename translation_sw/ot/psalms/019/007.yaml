  text: תּ֘וֹרַ֤ת יְהוָ֣ה תְּ֭מִימָה מְשִׁ֣יבַת נָ֑פֶשׁ עֵד֥וּת יְהוָ֥ה נֶ֝אֱמָנָ֗ה מַחְכִּ֥ימַת פֶּֽתִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/007.yaml
  text: The law of Yahweh is perfect[a], restoring the soul; the testimony of Yahweh is trustworthy, making the simple wise.
translation:
  language: sw
  text: Sheria ya Yahwe ni kamilifu, huirejesha nafsi[a]; ushuhuda wa Yahwe ni wa kuaminika, humtia hekima asiye na uzoefu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, huifufua nafsi. Kifungu מְשִׁיבַת נָפֶשׁ kinaweza kueleweka kama kuirejesha nafsi au kuifufua/kuitia uhai upya.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: sheria
  rationale: Neno תּוֹרָה linaweza kumaanisha mafundisho au maagizo kwa upana, lakini hapa lina uzito wa ufunuo wa agano wa Yahwe. “Sheria” ni ya kawaida na yenye uzito huo katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kama “Yahwe,” badala ya kubadilishwa kwa cheo kama “BWANA.”
- source_word: תְּמִימָה
  choice: kamilifu
  rationale: Neno hili huonyesha ukamilifu, uzima na kutokuwa na dosari; “kamilifu” linafaa kwa sifa ya sheria katika muktadha huu wa kishairi.
- source_word: מְשִׁיבַת
  choice: huirejesha
  rationale: Umbo hili la kitenzi שוב lina wazo la kusababisha kitu kirudi au kurejea katika hali yake. “Huirejesha” huhifadhi maana hiyo ya msingi bila kuifafanua kupita kiasi.
- source_word: נָפֶשׁ
  choice: nafsi
  rationale: נֶפֶשׁ linaweza kumaanisha uhai, mtu mwenyewe, au nafsi. “Nafsi” ni fupi, ya kishairi, na inaacha upana wa maana wa Kiebrania.
- source_word: עֵדוּת
  choice: ushuhuda
  rationale: Katika mfululizo huu wa maneno ya ufunuo wa Mungu, עֵדוּת ni ushuhuda au uthibitisho wa Yahwe wenye maana ya kiagano; “ushuhuda” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: נֶאֱמָנָה
  choice: wa kuaminika
  rationale: Neno hili huonyesha uthabiti na uaminifu. “Wa kuaminika” linaeleweka wazi katika Kiswahili cha sasa.
- source_word: מַחְכִּימַת
  choice: humtia hekima
  rationale: Umbo hili humaanisha kumsababisha mtu awe na hekima. “Humtia hekima” ni la asili na hudumisha kauli tendaji ya Kiebrania.
- source_word: פֶּתִי
  choice: asiye na uzoefu
  rationale: פֶּתִי humaanisha mtu asiye na uzoefu, aliye mwepesi kudanganyika au ambaye bado hajakomaa katika uamuzi, si lazima mpumbavu mwovu. Tafsiri hii huepuka maana kali isiyokusudiwa ya “mjinga.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina la agano יהוה. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kwa cheo.
- issue: Maana ya מְשִׁיבַת נָפֶשׁ
  choice: huirejesha nafsi
  alternative: huifufua nafsi
  rationale: “Huirejesha nafsi” huhifadhi wazo la msingi la שוב la kurudisha au kurejesha, huku “huifufua nafsi” likibaki uwezekano thabiti wa kimuktadha na limeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo sambamba wa mistari ya Kiebrania umehifadhiwa, na msamiati umechaguliwa ili ueleweke kwa msomaji wa kawaida bila kupoteza uzito wa kiagano.
