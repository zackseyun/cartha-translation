base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/003.yaml
  text: There is no speech[a], and there are no words; their voice is not heard.
translation:
  language: sw
  text: Hakuna usemi, wala hakuna maneno; sauti yao haisikiki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlio wao hausikiki.” Neno la Kiebrania קוֹל linaweza kumaanisha “sauti” au “mlio.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: hakuna
  rationale: Ni ukanushaji wa kuwepo; “hakuna” ni wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: אֹמֶר
  choice: usemi
  rationale: Hueleza kwa upana jambo linalosemwa na kudumisha ulinganifu wa kishairi na “maneno.”
- source_word: דְּבָרִים
  choice: maneno
  rationale: Katika muktadha huu wa mawasiliano na kusikia, maana halisi ya “maneno” inafaa zaidi.
- source_word: בְּלִי
  choice: hai-
  rationale: Maana ya hali hasi imejumuishwa kiasili katika kitenzi “haisikiki.”
- source_word: נִשְׁמָע
  choice: inasikika
  rationale: Huwakilisha moja kwa moja hali ya kutendwa ya mzizi שׁמע kwa Kiswahili cha sasa.
- source_word: קוֹלָם
  choice: sauti yao
  rationale: “Sauti” inaweza kurejelea sauti ya kiumbe au mlio, hivyo inadumisha kwa kiasi kikubwa upana wa maana wa קוֹל na taswira ya mbingu zilizohuishwa.
theological_decisions:
- issue: Ushuhuda wa mbingu kama mawasiliano yasiyo ya maneno
  choice: 'Mstari unakana kuwapo kwa usemi na maneno ya kawaida: “Hakuna usemi, wala hakuna maneno; sauti yao haisikiki.”'
  alternative: Kauli inaweza kueleweka kuwa sauti yao huenea bila usemi wala maneno, ikisisitiza ushuhuda wa kimya lakini wa ulimwengu wote.
  rationale: 'Muundo wa Kiebrania unaunga mkono kwa kawaida kukosekana kwa lugha halisi na sauti inayosikika. Tafsiri inadumisha mvutano wa kishairi: uumbaji hutangaza utukufu wa Mungu, lakini si kwa lugha ya kawaida ya wanadamu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. “Wala” inadumisha ulinganifu wa kishairi bila kufanya mstari kuwa mzito.
