  text: 'Siku kwa siku humimina usemi[a],

    na usiku kwa usiku hutangaza maarifa[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hutoa usemi”; kitenzi cha Kiebrania kinaonyesha utokaji au umiminikaji wa wingi, si kusema tu.
    reason: lexical_alternative
  - marker: b
    text: Au, “hudhihirisha maarifa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: י֣וֹם ... לְיוֹם
  choice: Mchana kwa mchana
  rationale: Muundo wa nomino iliyorudiwa pamoja na ל unaonyesha mwendelezo au kupokezana kutoka mchana mmoja hadi mwingine; tafsiri hii pia inadumisha usambamba wa kishairi.
- source_word: יַבִּיעַ
  choice: hububujika
  rationale: Hifili ya נבע ina picha ya kitu kinachochuruzika au kububujika kwa wingi. ‘Hububujika’ inahifadhi sitiari hiyo ya mtiririko tele badala ya kuifanya kuwa kusema tu.
- source_word: אֹמֶר
  choice: usemi
  rationale: Nomino hii hapa ni jambo linalotamkwa au ujumbe wa maneno kwa maana ya jumla; ‘usemi’ ni fupi, ya kishairi, na inaendana na kitenzi cha kububujika.
- source_word: וְלַיְלָה לְּלַיְלָה
  choice: na usiku kwa usiku
  rationale: Tafsiri sambamba na ‘mchana kwa mchana’ inatunza urudiaji na ulinganifu wa mistari ya Kiebrania.
- source_word: יְחַוֶּה
  choice: hutangaza
  rationale: Pieli ya חוה humaanisha kufanya jambo lijulikane au kulitangaza. ‘Hutangaza’ ni ya asili katika Kiswahili na haipunguzi tendo hili kuwa ufunuo wa siri pekee.
- source_word: דָּעַת
  choice: maarifa
  rationale: Nomino hii ina maana ya maarifa au ufahamu. ‘Maarifa’ ndiyo tafsiri ya moja kwa moja na inadumisha ulinganifu wa dhana na ‘usemi’.
