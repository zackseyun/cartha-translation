lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongozaji wa muziki
  rationale: Katika vichwa vya zaburi neno hili humwelekea anayesimamia uimbaji au utendaji wa muziki. Kauli hii ni ya kawaida katika Kiswahili cha sasa na haitumii neno la jumla mno kama “kiongozi.” Kiambishi לַ kimetafsiriwa “kwa,” kuonyesha kwamba zaburi inaelekezwa kwa msimamizi huyo.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ni jina mahususi la utanzu wa wimbo wa ibada wenye uhusiano na muziki; “zaburi” ni istilahi iliyozoeleka na sahihi katika Kiswahili.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Muundo “ya Daudi” ni wa asili katika vichwa vya zaburi vya Kiswahili na kwa kiasi fulani huhifadhi uwezekano wa uandishi, uhusiano, umiliki, au wakfu bila kulazimisha maana moja.
theological_decisions:
- issue: Maana ya לְדָוִד katika kichwa cha zaburi
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi; kwa ajili ya Daudi
  rationale: Kihusishi cha Kiebrania לְ kinaweza kuonyesha uandishi, uhusiano, umiliki, au wakfu. Tafsiri kuu haifanyi dai la uandishi kuwa bayana kuliko maandishi ya Kiebrania, na tanbihi inaweka wazi uwezekano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Mwongozaji wa muziki” kinaeleweka kwa wasomaji wa kawaida bila kudokeza kwamba lazima kulikuwa na kwaya pekee.
