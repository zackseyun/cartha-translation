  text: וְ/אַתָּ֣ה זָ֭נַחְתָּ וַ/תִּמְאָ֑ס הִ֝תְעַבַּ֗רְתָּ עִם מְשִׁיחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/038.yaml
  text: But you have cast off and rejected[a]; you have become enraged with your anointed one.
translation:
  language: sw
  text: Lakini wewe umemtupa na umemkataa; umemkasirikia sana mtiwa-mafuta wako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mtiwa-mafuta wako” au “Masihi wako.” Ni neno lilelile linalotafsiriwa mahali pengine kuwa “Masihi,” lakini hapa hasa linamhusu mfalme wa Daudi aliye chini ya agano la Mungu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Lakini wewe
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha geuko kali linalotofautiana na uthibitisho uliotangulia kuhusu uaminifu wa agano la Mungu.
- source_word: זָנַחְתָּ
  choice: umemkataa
  rationale: Kitenzi hiki huonyesha kukataa au kutupilia mbali; hapa 'umemkataa' ni wazi na cha kawaida katika Kiswahili.
- source_word: וַ/תִּמְאָס
  choice: na kumtupa
  rationale: Kitenzi מאס kina maana ya kukataa kwa dharau. Kuunganisha 'umemkataa na kumtupa' kunahifadhi mkazo wa jozi ya vitenzi vya Kiebrania bila urudiaji usio wa kawaida.
- source_word: הִתְעַבַּרְתָּ
  choice: umemkasirikia sana
  rationale: Muundo huu wa kitenzi unaeleza kuwaka au kufurika kwa hasira; 'umemkasirikia sana' huwasilisha nguvu hiyo kwa Kiswahili cha sasa na chenye hadhi.
- source_word: עִם
  choice: -kasirikia
  rationale: Ingawa kihalisia ni 'pamoja na/na,' katika muktadha wa hasira Kiswahili huwasilisha uhusiano huu kiasili kwa kiambishi cha kutendewa katika 'kumkasirikia,' bila kuongeza maana iliyo wazi zaidi ya 'dhidi ya.'
- source_word: מְשִׁיחֶךָ
  choice: mtiwa-mafuta wako
  rationale: Neno hili humaanisha mtu aliyetiwa mafuta. Katika zaburi hii linamhusu moja kwa moja mfalme wa ukoo wa Daudi chini ya agano la Mungu, huku uhusiano wa kileksia na 'Masihi' ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Kutafsiri מְשִׁיחֶךָ katika ombolezo la kifalme lenye mwangwi wa Kimasihi
  choice: mtiwa-mafuta wako
  alternative: Masihi wako
  rationale: Neno la Kiebrania ndilo chanzo cha jina 'Masihi,' lakini katika muktadha wa karibu linamhusu mfalme wa Daudi aliyetiwa mafuta na Mungu. Tafsiri kuu haifanyi utambulisho wa Kikristo uwe wazi zaidi kuliko mstari wenyewe, na tanbihi inahifadhi uhusiano wa Kimasihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Jozi ya vitenzi imehifadhiwa ili kuonyesha mkazo wa Kiebrania; 'mtiwa-mafuta' huhifadhi taswira ya kifalme na mwangwi wa Kimasihi bila kuamua mvutano wa kitheolojia.
