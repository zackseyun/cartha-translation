id: PSA.89.1
reference: Psalms 89:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: חַֽסְדֵ֣י יְ֭הוָה עוֹלָ֣ם אָשִׁ֑ירָה לְ/דֹ֥ר וָ/דֹ֓ר אוֹדִ֖יעַ אֱמוּנָתְ/ךָ֣ בְּ/פִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/001.yaml
  text: I will sing of the steadfast love of Yahweh forever[a]; from generation to generation I will make your faithfulness known with my mouth.
translation:
  language: sw
  text: Nitaziimba milele fadhili za Yahwe[a]; kizazi baada ya kizazi nitatangaza uaminifu wako kwa kinywa changu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “rehema” au “matendo ya upendo mwaminifu.” Neno la Kiebrania linaweza kumaanisha upendo wa agano wa Yahwe unaodhihirishwa kwa matendo ya rehema yanayorudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדֵי
  choice: fadhili
  rationale: Nomino hii ya wingi inaweza kumaanisha matendo ya upendo wa agano, rehema, au wema mwaminifu wa Mungu. “Fadhili” ni neno la kawaida na lenye hadhi linaloweza kuonyesha wema huo unaodhihirika mara nyingi; umbo la kitenzi “nitaziimba” linadumisha wingi wa Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kwa cheo “BWANA.” “Yahwe” ni umbo linalofaa matamshi na tahajia ya Kiswahili.
- source_word: עוֹלָם
  choice: milele
  rationale: Hapa neno hili linaeleza muda wa kuimba; “milele” ni Kiswahili cha kawaida kinachoonyesha mwendelezo usio na kikomo kilichotajwa.
- source_word: אָשִׁירָה
  choice: nitaziimba
  rationale: Umbo la Kiebrania linaonyesha azimio au nia. Wakati ujao wa Kiswahili unaonyesha azimio hilo, na kiambishi “-zi-” kinarejelea “fadhili” za wingi.
- source_word: לְדֹר וָדֹר
  choice: kizazi baada ya kizazi
  rationale: Hii ni nahau inayoonyesha mwendelezo katika vizazi vinavyofuatana. Tafsiri hii ni ya asili katika Kiswahili na huhifadhi urudiaji wa wazo.
- source_word: אוֹדִיעַ
  choice: nitatangaza
  rationale: Hiphil ya ידע ina maana ya kufanya jambo lijulikane. “Nitatangaza” huwasilisha wazi tendo la kuwajulisha wengine kwa sauti.
- source_word: אֱמוּנָתְךָ
  choice: uaminifu wako
  rationale: Neno hili humaanisha uthabiti, kutegemeka, na uaminifu. “Uaminifu wako” linafaa katika usambamba wake na fadhili za Mungu.
- source_word: בְּפִי
  choice: kwa kinywa changu
  rationale: Tafsiri hii huhifadhi taswira halisi ya Kiebrania ya kutamka kwa kinywa, huku ikieleweka kwa urahisi katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi jina hilo kwa umbo linalopatana na tahajia ya Kiswahili.
- issue: Maana ya חַסְדֵי katika muktadha wa agano
  choice: fadhili
  alternative: rehema au matendo ya upendo mwaminifu
  rationale: “Fadhili” halifungi neno hilo kwenye hisia tu, bali linaweza kujumuisha wema na rehema za Mungu zinazotokana na uaminifu wake. Tanbihi inahifadhi upana wa maana ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umetunza ushairi na usambamba wa mstari wa Kiebrania bila kuwa mgumu kueleweka.
