  text: You have brought his splendor to an end and cast his throne to the ground[a][b].
translation:
  language: sw
  text: Umeikomesha fahari yake[a], na umetupa kiti chake cha enzi ardhini[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Umeukomesha mng’ao wake” au “Umeukomesha usafi wake.” Neno la Kiebrania linaweza kumaanisha mng’ao, usafi, au fahari; “fahari” inafaa zaidi katika muktadha huu wa kifalme.
    reason: lexical_alternative
  - marker: b
    text: Au “na umetupa kiti chake cha enzi chini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּתָּ
  choice: Umeikomesha
  rationale: Kauli ya kusababisha ya kitenzi שׁבת ina maana ya kusababisha kitu kikome. “Umeikomesha” ni Kiswahili cha kawaida kinachohifadhi maana hiyo kwa ufupi.
- source_word: מִטְּהָרוֹ
  choice: fahari yake
  rationale: Nomino טֹהַר inaweza kumaanisha mng’ao, usafi, au fahari. Katika muktadha wa kifalme, “fahari” inaeleza vizuri utukufu wa kifalme uliokomesha bila kuifanya sentensi ihusu hasa usafi wa kimaadili.
- source_word: וְכִסְאוֹ
  choice: na ... kiti chake cha enzi
  rationale: כִּסֵּא ni kiti cha enzi; kiunganishi וְ kimehifadhiwa kwa “na.”
- source_word: לָאָרֶץ
  choice: chini
  rationale: Ingawa אֶרֶץ inaweza kuwa “ardhi” au “dunia,” katika picha ya kukitupa kiti cha enzi, “chini” ni usemi wa asili unaoonyesha kushushwa na kufedheheshwa.
- source_word: מִגַּרְתָּה
  choice: kukitupa
  rationale: Kitenzi kinaonyesha kutupa au kuburuta kitu chini. “Kukitupa chini” huhifadhi picha ya kishairi kwa lugha ya sasa na inayoeleweka.
theological_decisions:
- issue: Kirejelewa cha viambishi vya nafsi ya tatu
  choice: Imetafsiriwa “yake/chake” bila kumtaja mhusika waziwazi.
  alternative: Kumtaja kuwa mfalme wa ukoo wa Daudi au mtiwa-mafuta wa agano.
  rationale: Kiebrania kina viambishi vya nafsi ya tatu umoja bila kurudia jina la mhusika katika mstari huu. Kuvihifadhi huacha kirejelewa cha kifalme kama kilivyo katika mtiririko wa zaburi na huepuka kuingiza ufafanuzi usiotajwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini wazi. Mpangilio “kukitupa chini kiti chake cha enzi” ni wa asili na unaweka mkazo kwenye kushushwa kwa kiti hicho; lugha haibainishi zaidi mhusika wa viambishi.
