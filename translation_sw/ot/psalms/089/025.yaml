base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/025.yaml
  text: I will set his hand on the sea[a], and his right hand on the rivers.
translation:
  language: sw
  text: Nitaweka mkono wake juu ya bahari[a], na mkono wake wa kuume juu ya mito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, juu ya bahari na mito; taswira hii huenda inaonyesha mamlaka yake au upeo wa mamlaka yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Nitaweka
  rationale: Kitenzi cha Kiebrania ni Qal timilifu nafsi ya kwanza umoja chenye kiunganishi; katika muktadha huu wa ahadi, wakati ujao wa Kiswahili unaifaa maana yake. ‘Nitaweka’ huhifadhi taswira halisi.
- source_word: בַיָּם
  choice: juu ya bahari
  rationale: Kihusishi ב katika taswira hii kinaweza kumaanisha kuweka mkono juu ya eneo fulani. ‘Juu ya bahari’ huhifadhi taswira na pia kinaweza kudokeza mamlaka bila kuifanya tafsiri kuwa ufafanuzi.
- source_word: יָדוֹ
  choice: mkono wake
  rationale: Tafsiri halisi huhifadhi taswira ya kiungo cha mwili inayowakilisha uwezo au ufikivu.
- source_word: וּבַנְּהָרוֹת
  choice: na ... juu ya mito
  rationale: נְהָרוֹת ni wingi wa ‘mto.’ Kurudia ‘juu ya’ hudumisha usambamba wa kishairi na huleta uwazi katika Kiswahili.
- source_word: יְמִינוֹ
  choice: mkono wake wa kuume
  rationale: Huhifadhi usambamba halisi wa Kiebrania na madokezo ya nguvu na mamlaka yanayohusishwa na mkono wa kuume.
theological_decisions:
- issue: Taswira ya ufalme na mamlaka
  choice: Kuhifadhi taswira halisi ya mkono na mkono wa kuume vilivyowekwa juu ya bahari na mito, huku ikidokeza utawala mpana bila kuufafanua wazi katika matini kuu.
  alternative: Nitaeneza mamlaka yake juu ya bahari, na nguvu zake juu ya mito.
  rationale: Mstari huu ni wa kishairi na wa kimajazi, na huenda unaeleza mamlaka ya mfalme aliyopewa na Mungu. Ulinganifu mwafaka huhifadhi sitiari badala ya kuibadili kuwa maelezo ya moja kwa moja kuhusu mamlaka.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. Muundo wa kishairi na usambamba wa ‘mkono wake / mkono wake wa kuume’ umehifadhiwa.
