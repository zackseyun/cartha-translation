  yaml_path: translation/ot/psalms/089/028.yaml
  text: Forever I will keep my steadfast love for him[a], and my covenant will remain faithful to him.
translation:
  language: sw
  text: Milele nitamhifadhia upendo wangu thabiti, na agano langu litakuwa imara kwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “agano langu litakuwa aminifu kwake,” au “agano langu litakuwa la hakika kwake.”
    reason: Neno נֶאֱמֶנֶת linaweza kumaanisha kuwa imara, aminifu, au la hakika.
lexical_decisions:
- source_word: לְעוֹלָם
  choice: Milele
  rationale: Kiambishi ל pamoja na עוֹלָם huonyesha muda usio na mwisho; “milele” ni usemi wa kawaida na wenye hadhi unaosisitiza kudumu kwa ahadi.
- source_word: אֶשְׁמֹר
  choice: nitamhifadhia
  rationale: Kitenzi שׁמר hapa kina maana ya kutunza au kudumisha kwa ajili ya mtu. “Nitamhifadhia” huhifadhi maana ya ulinzi na uendelevu pamoja na kiwakilishi לוֹ.
- source_word: חַסְדִּי
  choice: upendo wangu thabiti
  rationale: חֶסֶד huunganisha upendo, uaminifu, na kujitoa kwa kudumu katika uhusiano wa agano. “Upendo wangu thabiti” ni lugha ya sasa inayoepuka kupunguza neno hilo kuwa huruma pekee.
- source_word: וּבְרִיתִי
  choice: na agano langu
  rationale: בְּרִית ni neno la kawaida la Kiebrania kwa agano; “agano” ni sahihi katika muktadha wa ahadi kwa Daudi na uzao wake.
- source_word: נֶאֱמֶנֶת לוֹ
  choice: litakuwa imara kwake
  rationale: Kivumishi cha hali נֶאֱמֶנֶת kutoka אמן huonyesha uthabiti, kutegemeka, au uaminifu. “Litakuwa imara kwake” ni Kiswahili cha kawaida na huhifadhi wazo la uhakika wa agano bila kulifafanua kupita kiasi.
theological_decisions:
- issue: Lugha ya agano bila kutaja wazi utimilifu wa Kimasihi
  choice: Kudumisha ahadi ya Mungu kwa mhusika anayetajwa kwa kiwakilishi “-m-” na “kwake,” bila kuongeza jina au utambulisho mwingine.
  alternative: Kutaja moja kwa moja Daudi, mfalme wa Kimasihi, au Kristo katika mstari.
  rationale: Muktadha unahusu agano la Daudi, lakini mstari wa Kiebrania wenyewe unasema tu “kwake.” Tafsiri huhifadhi rejeleo hilo la karibu na kuacha maendeleo mapana ya kiteolojia yaelezwe katika ufafanuzi.
- issue: Maana ya נֶאֱמֶנֶת kuhusu agano
  choice: litakuwa imara kwake
  alternative: litakuwa aminifu kwake; litakuwa la hakika kwake
  rationale: Kiebrania kinaweza kueleza agano kuwa imara, la kutegemeka, au aminifu. Matini kuu inatumia “imara,” huku tanbihi ikihifadhi uwezekano mwingine halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio unaanza na “Milele” ili kuhifadhi msisitizo wa Kiebrania; “nitamhifadhia” ni fupi na ya kawaida, nayo “upendo wangu thabiti” huwasilisha uzito wa חֶסֶד bila lugha ya kizamani.
