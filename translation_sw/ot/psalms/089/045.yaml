  text: You have shortened the days of his youth; you have covered him with shame[a]. Selah
translation:
  language: sw
  text: Umezifupisha siku za ujana wake; umemfunika kwa aibu[a]. Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umemvika aibu.”
    reason: עטה inaweza kumaanisha kufunika au kuvika; chaguo jingine linadumisha taswira ya aibu kama vazi.
lexical_decisions:
- source_word: הִקְצַרְתָּ
  choice: umezifupisha
  rationale: Hifili ya קצר humaanisha kufanya kuwa fupi au kufupisha. Kauli timilifu imetafsiriwa kwa wakati timilifu wa Kiswahili, unaoonyesha tendo lililotendeka lenye matokeo yanayoendelea.
- source_word: יְמֵי
  choice: siku za
  rationale: Wingi tegemezi wa 'siku' unaweza kumaanisha kipindi cha maisha, lakini 'siku za' huhifadhi taswira ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: עֲלוּמָיו
  choice: ujana wake
  rationale: Nomino hii hurejelea ujana au kipindi cha kuwa kijana; 'ujana wake' ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: הֶעֱטִיתָ
  choice: umemfunika
  rationale: Hifili ya עטה inaweza kumaanisha kufunika, kuzungushia, au kuvika. Pamoja na 'aibu,' 'umemfunika' ni ya asili na huhifadhi picha ya kitu kilichowekwa juu ya mtu.
- source_word: עָלָיו
  choice: -m- katika “umemfunika”
  rationale: Kihusishi chenye kiambishi cha nafsi kinamaanisha kihalisi 'juu yake'; katika Kiswahili, yambwa katika 'umemfunika' huwasilisha maana hiyo kwa kawaida bila kurudia 'juu yake.'
- source_word: בּוּשָׁה
  choice: aibu
  rationale: '''Aibu'' ni kisawe cha msingi na cha kawaida kwa hali ya kuaibishwa au fedheha, na kinafaa katika mstari huu wa kishairi.'
- source_word: סֶלָה
  choice: Sela
  rationale: Neno hili la kiliturujia au kimuziki lina maana isiyo hakika; limenukuliwa kwa herufi za Kiswahili badala ya kufasiriwa kupita ushahidi.
theological_decisions:
- issue: Mrejelewa wa viambishi vya nafsi ya tatu umoja wa kiume katika 'ujana wake' na 'juu yake'
  choice: Kudumisha rejeo la nafsi ya tatu umoja kwa 'wake' na 'm-' bila kumtaja mrejelewa.
  alternative: Kulieleza wazi kuwa rejeo ni mfalme wa ukoo wa Daudi, nasaba ya Daudi, au mtiwa-mafuta aliyewakilishwa kama mtu mmoja.
  rationale: Muktadha unaelekeza kwa mfalme mtiwa-mafuta au nasaba yake iliyofedheheshwa, lakini mstari wenyewe hautaji mrejelewa kwa jina. Tafsiri inadumisha utata huo wa kishairi na wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa 'siku za ujana wake' umehifadhi ulinganifu wa Kiebrania bila kuwa mgumu, na 'Sela' limetumika kama unukuzi wa jadi.
