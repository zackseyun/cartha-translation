  text: צֶ֣דֶק וּ֭/מִשְׁפָּט מְכ֣וֹן כִּסְאֶ֑/ךָ חֶ֥סֶד וֶ֝/אֱמֶ֗ת יְֽקַדְּמ֥וּ פָנֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/014.yaml
  text: Righteousness and justice are the foundation of your throne[a]; steadfast love and faithfulness go before you.
translation:
  language: sw
  text: 'Uadilifu na haki ndio msingi wa kiti chako cha enzi;

    upendo thabiti na uaminifu huenda mbele zako.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “mbele za uso wako”; yaani, katika uwepo wako.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶדֶק
  choice: uadilifu
  rationale: Katika jozi hii, neno hili linaonyesha unyoofu wa kimaadili na mpangilio ulio sawa; “uadilifu” hulitofautisha na מִשְׁפָּט, iliyotafsiriwa “haki.”
- source_word: מִשְׁפָּט
  choice: haki
  rationale: Hapa linaonyesha utekelezaji wa hukumu ya haki katika utawala wa Mungu; “haki” ni ya kawaida na ya asili katika Kiswahili cha sasa.
- source_word: מְכוֹן
  choice: msingi
  rationale: Neno linamaanisha mahali palipowekwa imara au tegemezo; kwa kiti cha enzi, “msingi” hudumisha vizuri mfano wa utawala uliothibitishwa.
- source_word: כִּסְאֶךָ
  choice: kiti chako cha enzi
  rationale: Hii ni tafsiri ya kawaida na iliyo wazi ya mfano wa kifalme, huku kiambishi cha nafsi ya pili kikihifadhiwa.
- source_word: חֶסֶד
  choice: upendo thabiti
  rationale: Huwasilisha upendo wa kudumu, wa uaminifu na mshikamano bila kutumia istilahi ya kimadhehebu au lugha ya kizamani.
- source_word: אֱמֶת
  choice: uaminifu
  rationale: Katika jozi חֶסֶד וֶאֱמֶת, maana ya kutegemeka na kuwa mwaminifu inafaa zaidi kuliko dhana ya “ukweli” pekee.
- source_word: יְקַדְּמוּ
  choice: hutangulia
  rationale: Kitenzi kina maana ya kwenda mbele au kutangulia; “hutangulia” ni kifupi, cha kishairi, na cha kawaida katika Kiswahili.
- source_word: פָנֶיךָ
  choice: mbele zako
  rationale: Ingawa kihalisi ni “uso wako,” hapa ni nahau ya uwepo wa mtu. “Mbele zako” ni ya asili katika Kiswahili, huku taswira halisi ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya jozi חֶסֶד וֶאֱמֶת
  choice: upendo thabiti na uaminifu
  alternative: rehema na ukweli
  rationale: Chaguo hili linahifadhi wazo la upendo wa kudumu na kutegemeka kwa Mungu bila kuifanya jozi hii kuwa dhana dhahania tu au kuingiza istilahi maalumu ya kimadhehebu.
- issue: Tafsiri ya פָנֶיךָ kama nahau au taswira halisi
  choice: mbele zako
  alternative: mbele za uso wako
  rationale: “Mbele zako” huwasilisha kwa Kiswahili cha asili maana ya sifa hizi kwenda mbele ya uwepo wa Mungu. Maana halisi ya “uso wako” imeonyeshwa katika tanbihi ili kutopoteza taswira ya Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi na chenye heshima lakini kinachoeleweka kwa urahisi. Mpangilio wa mistari unadumisha usambamba wa kishairi wa Kiebrania.
