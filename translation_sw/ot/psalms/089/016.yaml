  text: In your name they rejoice all day long[a], and in your righteousness they are exalted.
translation:
  language: sw
  text: Kwa jina lako wanafurahi siku nzima, na kwa haki yako wanainuliwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kwa uadilifu wako wanainuliwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁמְךָ
  choice: Kwa jina lako
  rationale: Kihusishi ב kinaonyesha msingi au nyanja ya kufurahi kwao. Katika Kiebrania, “jina” la Mungu linahusisha tabia na sifa yake iliyofunuliwa, si jina linalotamkwa tu.
- source_word: יְגִילוּן
  choice: wanafurahi
  rationale: Kitenzi גיל huonyesha furaha yenye shangwe. “Wanafurahi” ni Kiswahili cha sasa, cha kawaida, kinachohifadhi maana hiyo bila kuwa kizito.
- source_word: כָּל הַיּוֹם
  choice: mchana kutwa
  rationale: Usemi huu unaonyesha muda wote wa siku. “Mchana kutwa” ni nahau ya kawaida ya Kiswahili inayohifadhi msisitizo wa kuendelea siku nzima.
- source_word: וּבְצִדְקָתְךָ
  choice: na kwa haki yako
  rationale: צדקה inaweza kumaanisha uadilifu, haki, au utendaji wa haki. “Haki yako” ni ya asili katika Kiswahili na inabaki pana vya kutosha kujumuisha tabia nyofu ya Mungu na matendo yake ya haki.
- source_word: יָרוּמוּ
  choice: wanainuliwa
  rationale: Kitenzi רום humaanisha kuwa juu au kuinuliwa. Umbo “wanainuliwa” linaonyesha kwamba haki ya Mungu ndiyo msingi au sababu ya kuinuliwa kwao, bila kudokeza kuwa wanajiinua wenyewe.
theological_decisions:
- issue: Maana ya צְדָקָה kuhusu Mungu katika muktadha wa sifa
  choice: haki
  alternative: uadilifu
  rationale: Neno la Kiebrania linajumuisha tabia nyofu na matendo ya hukumu yaliyo sawa. “Haki” huhifadhi upana huo kwa Kiswahili, huku “uadilifu” ukiwa mbadala unaowezekana lakini wenye mkazo zaidi juu ya unyofu wa kitabia.
- issue: Uhusiano kati ya haki ya Mungu na kuinuliwa kwa watu
  choice: wanainuliwa
  alternative: wanatukuzwa
  rationale: Kiebrania hakitaji wazi mtendaji, lakini muundo wa sentensi unaonyesha kuwa kuinuliwa kwao kunahusiana na haki ya Mungu. “Wanainuliwa” huhifadhi hali hiyo bila kuongeza maelezo ya kimafundisho yasiyotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Mchana kutwa” limetumiwa kama nahau ya kawaida ya “siku nzima”; “haki” huhifadhi upana wa maana wa צדקה.
