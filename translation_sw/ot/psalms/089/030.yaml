base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/030.yaml
  text: If his sons abandon my law and do not walk in my judgments[b][a],
translation:
  language: sw
  text: Ikiwa wanawe wataiacha sheria yangu[a], wala hawataenenda kulingana na hukumu zangu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mafundisho yangu.” Neno la Kiebrania torah linaweza kumaanisha mafundisho au maelekezo, pamoja na sheria; hapa “sheria” imetumiwa kwa sababu ya ulinganifu wake na “hukumu zangu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hawataenenda kwa kufuata maagizo yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Ikiwa
  rationale: Hutambulisha sharti bila kudokeza kwamba jambo hilo lazima litokee.
- source_word: יַעַזְבוּ
  choice: wataiacha
  rationale: Kitenzi kina maana ya kuacha au kutupa; hapa ‘kuiacha’ kinaeleza wazi kutokuwa waaminifu kwa agano bila kutumia lugha nzito isiyo ya lazima.
- source_word: בָנָיו
  choice: wanawe
  rationale: Kiebrania kinasema kihalisi ‘wana wake’ kwa umbo la kiume la wingi; ‘wanawe’ ni Kiswahili cha kawaida na huhifadhi rejeo hilo.
- source_word: תּוֹרָתִי
  choice: sheria yangu
  rationale: Torah inaweza kumaanisha mafundisho au sheria. Ulinganifu wake na ‘hukumu zangu’ hapa unaipa kauli muktadha wa kisheria na wa agano.
- source_word: וּבְמִשְׁפָּטַי
  choice: kulingana na hukumu zangu
  rationale: Mishpatim inaweza kumaanisha hukumu, masharti ya kisheria, au maagizo. ‘Kulingana na hukumu zangu’ huwasilisha maana ya kiambishi בְ kwa Kiswahili cha kawaida.
- source_word: לֹא יֵלֵכוּן
  choice: hawataenenda
  rationale: Huhifadhi sitiari ya kibiblia ya ‘kuenenda’ kwa maana ya mwenendo wa maisha, huku umbo la wakati ujao likifaa baada ya ‘ikiwa.’
theological_decisions:
- issue: Maana ya תּוֹרָה katika muktadha wa agano na sheria
  choice: sheria yangu
  alternative: mafundisho yangu
  rationale: Ingawa neno hilo linaweza kuwa pana kuliko ‘sheria,’ ulinganifu wa karibu na ‘hukumu zangu’ unaunga mkono maana ya kisheria hapa bila kuondoa maana nyingine kwa kimya.
- issue: Jinsia katika בָנָיו
  choice: wanawe
  alternative: watoto wake
  rationale: Umbo la Kiebrania ni la kiume na muktadha wa agano la Daudi unawahusu wana au wazao wake; tafsiri kuu huhifadhi umbo hilo.
- issue: Sitiari ya kuenenda katika לֹא יֵלֵכוּן
  choice: hawataenenda
  alternative: hawataishi kwa kufuata
  rationale: ‘Kuenenda’ huhifadhi sitiari ya mwenendo wa maisha iliyo katika Kiebrania na inaeleweka katika lugha yenye hadhi ya kibiblia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kuenenda’ kimetumiwa makusudi kuhifadhi sitiari ya Kiebrania; ‘kulingana na’ hufanya uhusiano na ‘hukumu’ uwe wa kawaida na wazi katika Kiswahili. Koma ya mwisho inaonyesha kuwa kishazi cha sharti kinaendelea katika mstari unaofuata.
