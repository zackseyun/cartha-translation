base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/012.yaml
  text: The north and the south—you created them[b][a]; Tabor and Hermon sing for joy in your name.
translation:
  language: sw
  text: Kaskazini na kusini[a]—wewe uliviumba; Tabori na Hermoni zinaimba kwa shangwe kwa jina lako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kaskazini na upande wa kulia—wewe uliviumba.” Hapa “upande wa kulia” huenda ni nahau ya kijiografia inayomaanisha “kusini.”
    reason: lexical_alternative
  - marker: b
    text: Au, “zinapiga kelele kwa shangwe kwa jina lako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צָפוֹן
  choice: Kaskazini
  rationale: Neno hili kwa kawaida humaanisha upande au eneo la kaskazini. Hapa limewekwa sambamba na יָמִין, hivyo maana ya mwelekeo inafaa zaidi kuliko kulichukua kama jina maalumu, Zafoni.
- source_word: יָמִין
  choice: kusini
  rationale: Maana ya msingi ni ‘mkono wa kulia’ au ‘upande wa kulia,’ lakini katika mtazamo wa kijiografia wa Kiebrania linaweza kumaanisha kusini. Likioanishwa na ‘kaskazini,’ linaunda jozi ya mielekeo inayowakilisha maeneo ya ulimwengu.
- source_word: בְרָאתָם
  choice: wewe ndiye uliyeziumba
  rationale: Kitenzi ni qal timilifu, nafsi ya pili umoja wa kiume, pamoja na kiambishi cha yambwa cha wingi. Muundo huu wa Kiswahili unasisitiza kwamba Mungu ndiye Muumba wa pande zote mbili.
- source_word: תָּבוֹר
  choice: Tabori
  rationale: Ni jina maalumu la mlima; limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: חֶרְמוֹן
  choice: Hermoni
  rationale: Ni jina maalumu la mlima; limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: בְּשִׁמְךָ
  choice: kwa jina lako
  rationale: Kihusishi בְּ kinaweza kuonyesha msingi, nyanja, au sababu. ‘Kwa jina lako’ ni usemi wa asili unaodumisha uhusiano wa shangwe hiyo na utambulisho na sifa ya Mungu bila kuifafanua kupita kiasi.
- source_word: יְרַנֵּנוּ
  choice: zinaimba kwa shangwe
  rationale: Piel ya רנן huonyesha kilio au uimbaji wenye furaha. ‘Zinaimba kwa shangwe’ inadumisha taswira ya kishairi ya milima iliyohuishwa kana kwamba inamsifu Mungu; maana ya ‘zinapiga kelele kwa shangwe’ pia inawezekana.
theological_decisions:
- issue: Maana ya יָמִין inapowekwa sambamba na צָפוֹן
  choice: 'Jozi ya mielekeo: ‘kaskazini na kusini’'
  alternative: 'Maana halisi ya nafasi ya mwili: ‘kaskazini na upande wa kulia’'
  rationale: Muktadha unasifu uumbaji wa Mungu kwa upana, kisha unataja milima miwili. Maana ya kijiografia ya ‘kusini’ inaonyesha vizuri jozi hiyo ya kishairi, huku tanbihi ikihifadhi maana halisi inayowezekana.
- issue: Uhuishaji wa Tabori na Hermoni
  choice: Milima yenyewe inaelezwa kishairi kuwa inaimba kwa shangwe
  alternative: Wakazi wa maeneo hayo ndio wanaoimba kwa shangwe
  rationale: Kitenzi cha wingi kinaweza kuwa na majina hayo mawili kama kiima ambatano, na mashairi ya Zaburi mara nyingi huonyesha viumbe na maumbile vikimsifu Mungu. Tafsiri haibadili taswira hiyo kuwa maelezo kuhusu wakazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na ya kishairi lakini inayoeleweka kwa urahisi. Majina ya milima yametoholewa kama Tabori na Hermoni; uhuishaji wa kishairi wa milima umehifadhiwa.
