  text: אֵ֣ל נַ֭עֲרָץ בְּ/סוֹד קְדֹשִׁ֣ים רַבָּ֑ה וְ֝/נוֹרָ֗א עַל כָּל סְבִיבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/007.yaml
  text: God is greatly feared in the council of the holy ones[b][a], and awesome above all who surround him.
translation:
  language: sw
  text: Mungu huogopwa sana katika baraza[a] la watakatifu[b]; anatisha kuliko wote wanaomzunguka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ‘kusanyiko’; neno la Kiebrania linaweza kumaanisha baraza la karibu au mkutano wa kushauriana.
    reason: lexical_alternative
  - marker: b
    text: Inaelekea ‘watakatifu’ hapa ni viumbe watakatifu wa mbinguni, si waumini wa kibinadamu.
    reason: cultural_note
lexical_decisions:
- source_word: אֵל
  choice: Mungu
  rationale: Katika muktadha huu wa kishairi, neno hili linamtaja Mungu wa Israeli, si mungu wa kawaida.
- source_word: נַעֲרָץ
  choice: huogopwa sana
  rationale: Kauli hii huonyesha kwamba Mungu huonwa kwa hofu yenye kicho; ‘huogopwa’ inadumisha maana hiyo bila kudokeza uovu.
- source_word: בְּסוֹד
  choice: katika baraza
  rationale: סוֹד inaweza kumaanisha baraza la karibu linalokusanyika kushauriana; hapa muktadha unaelekea kwenye baraza la mbinguni.
- source_word: קְדֹשִׁים
  choice: watakatifu
  rationale: Tafsiri hii inadumisha upana wa Kiebrania, huku tanbihi ikieleza kwamba huenda hapa ni viumbe watakatifu wa mbinguni.
- source_word: רַבָּה
  choice: sana
  rationale: Neno hili limetumiwa kama kielezi kinachoongeza nguvu ya ‘huogopwa’.
- source_word: וְנוֹרָא
  choice: anatisha
  rationale: Neno hili huonyesha kusababisha hofu na kicho; ‘anatisha’ ni la kawaida na lenye nguvu katika Kiswahili, bila kudokeza kwamba Mungu ni mwovu.
- source_word: עַל כָּל סְבִיבָיו
  choice: kuliko wote wanaomzunguka
  rationale: 'עַל hapa inaeleweka kwa ulinganisho: Mungu anatisha zaidi ya wote walio karibu naye, ambao yaelekea ni wahudumu wa mbinguni.'
theological_decisions:
- issue: Utambulisho wa ‘watakatifu’ na wale wanaomzunguka Mungu
  choice: Maneno mapana ‘watakatifu’ yamedumishwa katika matini, huku yakieleweka kwa uwezekano mkubwa kuwa viumbe wa mbinguni.
  alternative: Waumini watakatifu wa kibinadamu, au kusanyiko lenye viumbe wa mbinguni na wanadamu.
  rationale: Muktadha wa karibu wa Zaburi 89 hutaja mbingu na kusanyiko la mbinguni. Hata hivyo, tafsiri haijaweka ‘malaika’ katika matini kwa sababu Kiebrania kinasema kwa upana ‘watakatifu’.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa kwa vipande viwili vinavyolingana; ‘baraza’ na ‘watakatifu’ hudumisha taswira na kiasi cha kutobainika kilichomo katika Kiebrania.
