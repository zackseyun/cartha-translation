base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/033.yaml
  text: But my steadfast love I will not remove from him[b][a], nor will I deal falsely in my faithfulness.
translation:
  language: sw
  text: Lakini sitamwondolea upendo wangu wa kudumu[a], wala sitakwenda kinyume na uaminifu wangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upendo wangu wa agano,” au “fadhili zangu za kudumu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wala sitaonyesha kutokuwa mwaminifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדִּי
  choice: upendo wangu thabiti
  rationale: Neno חֶסֶד hapa linaonyesha upendo wa kudumu na wa uaminifu katika agano, si hisia tu. ‘Upendo wangu thabiti’ ni Kiswahili cha sasa kinachohifadhi wazo la upendo na uthabiti wake.
- source_word: אָפִיר
  choice: sitamwondolea
  rationale: Hifili ya פור hapa ina maana ya kuondoa au kunyima. Muundo ‘sitamwondolea’ unaunganisha kitendo hicho na mtu anayelengwa kwa Kiswahili cha kawaida.
- source_word: מֵעִמּוֹ
  choice: -mwondolea
  rationale: Wazo la kujitenga ‘kutoka kwake’ limewasilishwa kiasili ndani ya kitenzi chenye yambwa ‘-mw-’ na kiambishi tumizi ‘-olea’, badala ya tafsiri nzito ya neno kwa neno.
- source_word: אֲשַׁקֵּר
  choice: sitatenda kwa uongo
  rationale: Pieli ya שׁקר inaweza kumaanisha kutenda kwa udanganyifu au kuwa si mwaminifu, si kusema uongo kwa maneno pekee. ‘Sitatenda kwa uongo’ huhifadhi upana huo.
- source_word: בֶּאֱמוּנָתִי
  choice: kuhusu uaminifu wangu
  rationale: אֱמוּנָה hapa ni uthabiti au uaminifu wa Mungu. ‘Kuhusu’ linaonyesha kwamba hatatenda kwa namna inayopingana na uaminifu wake, huku likikubali kwamba matumizi ya ב ni ya kiidioma.
- source_word: וְ
  choice: Lakini
  rationale: 'Kiunganishi kina nguvu ya utofautishaji katika muktadha: adhabu iliyotajwa kabla haitabatilisha upendo wa Mungu wa kudumu.'
theological_decisions:
- issue: Lugha ya agano kuhusu kujitoa kwa Mungu kwa mfalme wa ukoo wa Daudi
  choice: Kutumia ‘upendo wangu thabiti’ na ‘uaminifu wangu’ ili kuonyesha uaminifu wa kudumu wa agano bila kuingiza istilahi za kimadhehebu.
  alternative: Kutumia ‘rehema yangu’ na ‘kweli yangu’ kwa mtindo wa kimapokeo.
  rationale: Aya inashikilia pamoja nidhamu ya Mungu na kutobatilika kwa upendo wake wa agano. Tafsiri hii inadumisha mvutano huo bila kuufafanua kupita kiasi.
- issue: Uhusiano wa שׁקר na אֱמוּנָה katika kishazi cha pili
  choice: ‘wala sitatenda kwa uongo kuhusu uaminifu wangu’
  alternative: ‘wala sitaacha kuwa mwaminifu’
  rationale: Chaguo kuu linahifadhi taswira ya Kiebrania ya kutotenda kwa uongo kuhusiana na uaminifu wa Mungu; chaguo mbadala ni laini zaidi lakini linafafanua maana badala ya kuhifadhi muundo na mvutano wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio ni wa asili kwa Kiswahili lakini unahifadhi msisitizo wa upendo thabiti na uaminifu wa Mungu. Alama zote za tanbihi zimewekwa katika matini.
