base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/039.yaml
  text: You have renounced the covenant of your servant[b][a]; you have defiled his crown to the ground.
translation:
  language: sw
  text: Umelikataa agano la mtumishi wako[a]; umeinajisi taji yake kwa kulidhalilisha hadi ardhini[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umelitupilia mbali” au “umelidharau” agano la mtumishi wako.
    reason: lexical_alternative
  - marker: b
    text: Au “umeitia unajisi diademu yake hadi ardhini.” Neno la Kiebrania linalotafsiriwa “taji” linaweza pia kuwa na dhana ya kuwekwa wakfu.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵאַרְתָּה
  choice: umeikataa
  rationale: Kitenzi hiki katika Piel kinaonyesha kukataa au kutupilia mbali kwa nguvu. “Umeikataa” ni Kiswahili cha kawaida kinachohifadhi tendo la kukataa agano bila kuongeza wazo lisilo wazi katika chanzo.
- source_word: בְּרִית
  choice: agano
  rationale: “Agano” ndilo neno la kawaida la Kiswahili kwa makubaliano rasmi yenye uzito wa kiuhusiano na kitheolojia, hasa katika muktadha wa Daudi.
- source_word: עַבְדֶּךָ
  choice: mtumishi wako
  rationale: Katika muktadha huu humrejelea mfalme aliye chini ya Mungu; “mtumishi wako” ni ya asili na huhifadhi uhusiano huo bila kusisitiza hali ya utumwa.
- source_word: חִלַּלְתָּ
  choice: umeitia unajisi
  rationale: Piel ya חלל ina maana ya kunajisi au kuvunjia utakatifu/heshima. Usemi huu huhifadhi mguso wa kunajisi kilichowekwa wakfu unaohusishwa na taji.
- source_word: לָאָרֶץ
  choice: hata chini
  rationale: Kiebrania ni “kwenye/nchini,” kikionyesha kushushwa kabisa na kudhalilishwa. “Hata chini” ni usemi wa kawaida wa Kiswahili unaohifadhi picha hiyo.
- source_word: נִזְרוֹ
  choice: taji yake
  rationale: Katika zaburi hii ya kifalme, neno linamaanisha taji au kilemba cha kifalme, huku likiwa pia na mguso wa kuwekwa wakfu. “Taji yake” ndilo chaguo linaloeleweka kwa urahisi zaidi.
theological_decisions:
- issue: Taswira ya kifalme na ya agano kuhusu mtumishi wa ukoo wa Daudi
  choice: Kuhifadhi kauli kali ya kukataliwa kwa agano na kudhalilishwa kwa taji, bila kutatua mvutano wa maombolezo.
  alternative: Kuelekeza mstari moja kwa moja kwenye utimilifu wa Kimasihi, au kuupunguza uwe maelezo ya kushindwa kisiasa tu.
  rationale: Mstari unaeleza hali inayoonekana ya kuporomoka kwa agano la kifalme. Tafsiri inadumisha mvutano huo wa kitheolojia bila kuuingizia ufafanuzi wa baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na wa kishairi; “hata chini” huwasilisha kudhalilishwa kwa mfalme, huku tanbihi ikihifadhi tafsiri ya karibu zaidi ya “ardhini” na mguso wa kuwekwa wakfu.
