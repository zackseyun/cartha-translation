translation_notes:
  register: Kichwa kimetafsiriwa kwa Kiswahili sanifu cha Afrika Mashariki, kwa mtindo mfupi na wenye hadhi. “Maskili” imehifadhiwa kama istilahi maalumu yenye utata, na “ya” hudumisha kutokuwa wazi kwa aina ya uhusiano kati ya zaburi na Ethani.
