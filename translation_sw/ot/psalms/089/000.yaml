  text: A Maskil of Ethan the Ezrahite[a][b].
translation:
  language: sw
  text: Maskili ya Ethani, Mwezrahi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Maskili” ni istilahi ya Kiebrania ya kimuziki au kifasihi inayopatikana katika kichwa cha zaburi. Maana yake kamili haijulikani kwa hakika; huenda ikamaanisha utungo wa kutafakari au wa kufundisha.
    reason: lexical_alternative
  - marker: b
    text: Au “Mzera,” ikiwa kichwa hiki kinaeleweka kuwa kinataja mtu wa ukoo wa Zera.
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Maskili
  rationale: Ni istilahi ya Kiebrania katika kichwa cha zaburi, na maana yake kamili haijulikani kwa hakika. Kuitohhoa kama “Maskili” kunahifadhi aina hiyo ya kifasihi au kimuziki bila kulazimisha tafsiri yenye utata.
- source_word: לְ
  choice: ya
  rationale: Katika vichwa vya zaburi, kiambishi hiki huonyesha uhusiano au kuhusishwa na mtu. “Ya” ni ya kawaida na fupi, huku ikiacha wazi kama kinamaanisha utunzi, wakfu, umiliki, au uhusiano mwingine.
- source_word: אֵיתָן
  choice: Ethani
  rationale: Jina la mtu limetoholewa kwa namna inayoeleweka katika Kiswahili na inayokaribia umbo la Kiebrania.
- source_word: הָאֶזְרָחִי
  choice: Mwezrahi
  rationale: Umbo hili linawakilisha moja kwa moja jina la ukoo au nasaba lililohifadhiwa katika maandishi ya Kiebrania. Uhusiano unaowezekana na Zera umewekwa katika tanbihi badala ya kuamuliwa katika matini kuu.
