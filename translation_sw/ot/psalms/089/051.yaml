  yaml_path: translation/ot/psalms/089/051.yaml
  text: with which your enemies have taunted[a], O Yahweh[b], with which they have taunted the footsteps of your anointed.
translation:
  language: sw
  text: ambavyo adui zako wamekutukana, ee Yahwe, ambavyo wameyatukana nyayo za mtiwa mafuta wako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyayo za Masihi wako.” Kiebrania מְשִׁיחֶךָ humaanisha “mtiwa mafuta wako”; katika muktadha huenda kinamrejelea mfalme wa ukoo wa Daudi, lakini pia kina mwangwi wa Kimasihi. “Nyayo” pia zinaweza kueleweka kuwa “visigino,” “hatua,” au “alama za miguu,” zikidokeza mwendo au kuja kwa mtiwa mafuta wa Yahwe.
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: חֵרְפוּ
  choice: wamekukejeli / wamekejeli
  rationale: Kitenzi kina maana ya kushutumu kwa dharau au kudhihaki. ‘Kukejeli’ ni Kiswahili cha sasa kinachohifadhi nguvu ya dharau; kiambishi cha yambwa katika sehemu ya kwanza kinaonyesha kwamba Yahwe ndiye anayelengwa na kejeli.
- source_word: אוֹיְבֶיךָ
  choice: adui zako
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya nomino yenye kiambishi cha nafsi ya pili umoja.
- source_word: יְהוָה
  choice: ee Yahwe
  rationale: Jina la Mungu limetoholewa kama ‘Yahwe’ badala ya kubadilishwa na cheo; ‘ee’ huonyesha usemi wa kumwita moja kwa moja.
- source_word: אֲשֶׁר
  choice: ambayo
  rationale: Kiwakilishi hiki huunganisha mstari na shutuma iliyotajwa katika muktadha uliotangulia. Kurudiwa kwake kunahifadhi muundo sambamba wa Kiebrania.
- source_word: עִקְּבוֹת
  choice: nyayo
  rationale: Neno linaweza kumaanisha visigino, hatua, nyayo, au alama za miguu. ‘Nyayo’ huhifadhi taswira halisi huku ikiruhusu maana ya kimfano kuhusu mwendo au kuja kwa mtiwa-mafuta.
- source_word: מְשִׁיחֶךָ
  choice: mtiwa-mafuta wako
  rationale: Katika muktadha wa kifalme, neno hili humrejelea hasa mfalme wa ukoo wa Daudi aliyetiwa mafuta na Yahwe. Tafsiri ya maelezo huhifadhi maana hiyo bila kulifanya moja kwa moja kuwa jina la cheo ‘Masihi,’ huku mwangwi wa Kimasihi ukibainishwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya מְשִׁיחֶךָ katika zaburi ya kifalme yenye mwangwi wa Kimasihi
  choice: mtiwa-mafuta wako
  alternative: Masihi wako
  rationale: Muktadha wa karibu unamhusu mfalme wa Daudi kama mtiwa-mafuta wa Yahwe. Hata hivyo, kwa kuwa neno lilelile ndilo linalotafsiriwa ‘Masihi’ na lina mwangwi mpana wa Kimasihi, uwezekano huo umehifadhiwa katika tanbihi.
- issue: Yule anayelengwa na kejeli katika kishazi cha kwanza
  choice: wamekukejeli
  alternative: wamekejeli
  rationale: Ingawa Kiebrania hakina yambwa iliyoandikwa wazi baada ya kitenzi, kumwita Yahwe katikati ya mstari na muktadha wa mstari uliotangulia kunaunga mkono kuelewa kwamba maadui wanamkejeli yeye. Tafsiri hii inaweka wazi uhusiano huo bila kuondoa taswira tofauti ya kejeli dhidi ya nyayo za mtiwa-mafuta katika kishazi cha pili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kurudia ‘ambayo ... ambayo’ umehifadhiwa ili kuakisi usambamba wa kishairi, na ‘nyayo’ limetumiwa kuhifadhi taswira ya Kiebrania.
