base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/049.yaml
  text: Where are your former acts of steadfast love[a], Lord[b], which you swore to David in your faithfulness?
translation:
  language: sw
  text: Fadhili zako za zamani ziko wapi, Ee Bwana, ulizomwapia Daudi katika uaminifu wako[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa uaminifu wako.” Kirai hiki kinaweza kuonyesha namna au msingi wa kiapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: yako wapi
  rationale: Kiulizi hiki huuliza mahali au kuwapo kwa kitu; upatanisho wa ngeli katika “yako” unalingana na wingi wa “matendo.”
- source_word: חֲסָדֶיךָ
  choice: matendo yako ... ya upendo thabiti
  rationale: חֶסֶד huonyesha upendo, fadhili, na uaminifu wa kudumu katika uhusiano wa agano. Kuongeza “matendo” kunaonyesha kwa Kiswahili cha kawaida kwamba neno la Kiebrania limetumiwa katika wingi na linarejelea maonyesho halisi ya upendo huo.
- source_word: הָרִאשֹׁנִים
  choice: ya zamani
  rationale: Katika ombolezo hili, neno hilo linarejelea matendo ya awali ya Mungu yanayotofautishwa na dhiki ya sasa; “ya zamani” ni ya kawaida na wazi.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Hili ni jina la cheo cha Mungu linalotumiwa katika kumwita moja kwa moja; “Bwana” ndilo neno la kawaida la Kiswahili kwa cheo hiki.
- source_word: נִשְׁבַּעְתָּ
  choice: uliyomwapia
  rationale: Kitenzi kinarejelea kiapo cha Mungu cha wakati uliopita kwa Daudi; “mwapia” huhifadhi wazi wazo la kuapa.
- source_word: לְדָוִד
  choice: Daudi
  rationale: Kiambishi cha mtendewa katika “uliyomwapia” kinaonyesha kwamba Daudi ndiye aliyepewa kiapo, hivyo hakuna haja ya kuongeza kihusishi tofauti.
- source_word: בֶּאֱמוּנָתֶךָ
  choice: kwa uaminifu wako
  rationale: אֱמוּנָה humaanisha uthabiti, kutegemeka, au uaminifu. “Kwa” huweza kuonyesha namna au msingi wa kiapo bila kulazimisha maana moja tu.
theological_decisions:
- issue: Jinsi ya kutafsiri חֶסֶד katika ombolezo linalohusu agano
  choice: upendo thabiti
  alternative: fadhili; rehema
  rationale: Muktadha unaomba Mungu akumbuke uaminifu wake kwa ahadi aliyompa Daudi. “Upendo thabiti” huonyesha upendo wa kudumu bila kuufanya kuwa hisia tu, huku tanbihi ikihifadhi tafsiri nyingine halali.
- issue: Kuonyesha wingi wa חֲסָדֶיךָ
  choice: matendo ... ya upendo thabiti
  alternative: fadhili zako; rehema zako
  rationale: Usemi huu unaonyesha maonyesho mengi ya upendo huo na unasikika kwa kawaida zaidi kuliko kuunda wingi usio wa kawaida wa neno “upendo.”
- issue: Maana ya ב katika בֶּאֱמוּנָתֶךָ
  choice: kwa uaminifu wako
  alternative: katika uaminifu wako
  rationale: Kihusishi kinaweza kuonyesha namna au msingi wa kiapo. Tafsiri kuu haifungi kabisa uwezekano wowote, na tanbihi inaonyesha usemi mwingine unaowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali na wazo la kiapo vimehifadhiwa, na utata halisi wa kihusishi ב umeonyeshwa katika tanbihi.
