id: PSA.89.9
reference: Psalms 89:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַתָּ֣ה מ֭וֹשֵׁל בְּ/גֵא֣וּת הַ/יָּ֑ם בְּ/שׂ֥וֹא גַ֝לָּ֗י/ו אַתָּ֥ה תְשַׁבְּחֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/009.yaml
  text: You rule over the swelling of the sea[a]; when its waves rise[b], you still them.
translation:
  language: sw
  text: Wewe unatawala kufura kwa bahari[a]; mawimbi yake yanapoinuka, wewe huyatuliza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiburi cha bahari” au “fahari ya bahari.” Neno la Kiebrania linaweza kumaanisha kuinuka, fahari, au kufura; hapa muktadha unapendelea picha ya bahari inayofura.
    reason: lexical_alternative
  - marker: b
    text: Au, “huyanyamazisha” au “huyatiisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשֵׁל
  choice: unatawala
  rationale: Kitenzi hiki kinaonyesha utawala wa kudumu na wenye mamlaka; “unatawala” ni Kiswahili cha kawaida na kinahifadhi wazo la mamlaka hai juu ya bahari.
- source_word: בְּגֵאוּת
  choice: kufura kwa
  rationale: גֵּאוּת inaweza kumaanisha kuinuka, fahari, au kufura. Inapotumiwa kuhusu bahari, “kufura” inatoa picha halisi ya maji yanayochafuka na kuinuka, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: הַיָּם
  choice: bahari
  rationale: “Bahari” ndilo neno la kawaida la Kiswahili kwa יָם na linafaa katika lugha ya kishairi ya Zaburi.
- source_word: בְּשׂוֹא
  choice: yanapoinuka
  rationale: Muundo huu unaonyesha hali au wakati wa mawimbi kuinuka; “yanapoinuka” ni wa asili katika Kiswahili na unahifadhi mwendo wa picha hiyo.
- source_word: גַלָּיו
  choice: mawimbi yake
  rationale: Kiambishi cha umilikaji kinarejelea bahari; “mawimbi yake” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: תְשַׁבְּחֵם
  choice: huyatuliza
  rationale: Katika muktadha huu, Piel ya שׁבח ina maana ya kutuliza au kutiisha maji yenye msukosuko. “Huyatuliza” ni wazi, hai, na inaonyesha tendo la Mungu linalojirudia au lililo tabia yake.
theological_decisions:
- issue: Mamlaka ya Mungu juu ya maji yenye msukosuko
  choice: Mstari unasema moja kwa moja kwamba Mungu anaitawala bahari na kuyatuliza mawimbi yake.
  alternative: Picha hiyo inaweza pia kusikika kama dokezo la kishairi kuhusu ushindi wa Mungu juu ya machafuko ya ulimwengu.
  rationale: Tafsiri inahifadhi picha halisi ya bahari inayofura bila kuongeza mfumo wa kimytholojia ambao haujaelezwa wazi katika mstari huu; hata hivyo, haifungi uwezekano wa dokezo pana la kishairi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Kufura kwa bahari” ni picha wazi kwa wasomaji wa kawaida, na matumizi ya “huyatuliza” yanaonyesha mamlaka ya Mungu kwa lugha ya asili bila kuingiza istilahi za dhehebu.
