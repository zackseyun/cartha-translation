base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/026.yaml
  text: He will call to me[a], ‘You are my Father, my God, and the rock of my salvation.’
translation:
  language: sw
  text: Yeye ataniita[a], “Wewe ni Baba yangu, Mungu wangu, na mwamba wa wokovu wangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ataniita kwa sauti ya kilio.” Kitenzi cha Kiebrania kinaweza pia kumaanisha kuita kwa kilio, hasa katika sala.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: A- (katika “Ataniita”)
  rationale: Kiwakilishi huru cha nafsi ya tatu umoja wa kiume kimewakilishwa na kiambishi cha kiima “a-”, kama ilivyo kawaida katika Kiswahili; mkazo wa Kiebrania unaeleweka kutokana na muktadha.
- source_word: יִקְרָאֵנִי
  choice: ataniita
  rationale: Kitenzi קרא kinaweza kumaanisha kuita au kupaza sauti. Kiambishi cha nafsi ya kwanza umoja kimehifadhiwa kwa “-ni-”. “Ataniita” ni usemi wa asili na unaacha wazi iwapo maana ni kuniita kwa jina au kuniita katika sala.
- source_word: אָבִי
  choice: Baba yangu
  rationale: Nomino yenye kiambishi cha nafsi ya kwanza umoja imetafsiriwa moja kwa moja. Herufi kubwa inaonyesha kuwa ni usemi wa moja kwa moja kwa Mungu, bila kuongeza hitimisho la kimadhehebu.
- source_word: אָתָּה
  choice: Wewe ni
  rationale: Kiwakilishi huru kilicho wazi katika Kiebrania kimehifadhiwa kwa “Wewe”; kishirikishi “ni” kinakamilisha sentensi kwa Kiswahili cha kawaida.
- source_word: אֵלִי
  choice: Mungu wangu
  rationale: Katika ulinganifu na “Baba yangu” na “mwamba wa wokovu wangu,” אֵלִי humrejelea Mungu waziwazi.
- source_word: וְצוּר
  choice: na mwamba
  rationale: Taswira halisi ya “mwamba” imehifadhiwa kama sitiari ya uimara na usalama; hakuna kiwakilishi cha umilikaji kilichoongezwa kwenye nomino hii.
- source_word: יְשׁוּעָתִי
  choice: wa wokovu wangu
  rationale: “Wokovu” huhifadhi maana ya ישועה na uhusiano wa muundo kati ya “mwamba” na “wokovu wangu”; pia ni lugha ya kawaida ya kibiblia katika Kiswahili.
theological_decisions:
- issue: Kumwita Mungu Baba katika muktadha wa kifalme/kimasihi
  choice: 'Maneno yametafsiriwa kama usemi wa moja kwa moja kwa Mungu: “Wewe ni Baba yangu, Mungu wangu, na mwamba wa wokovu wangu.”'
  alternative: Kutumia “baba” kwa herufi ndogo au kufafanua kauli hii kuwa lugha ya kifalme tu.
  rationale: Zaburi 89 inahusu mfalme wa ukoo wa Daudi na agano, lakini mstari wenyewe unamwonyesha akimwambia Mungu maneno ya uhusiano na tumaini. Tafsiri huhifadhi uzito huo bila kuingiza hitimisho la baadaye la kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kueleweka. “Ataniita” huchaguliwa kwa ufupi na uasilia; tanbihi huhifadhi upana wa maana wa kitenzi cha Kiebrania.
