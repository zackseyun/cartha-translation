  text: אַף תָּ֭שִׁיב צ֣וּר חַרְבּ֑/וֹ וְ/לֹ֥א הֲ֝קֵימֹת֗/וֹ בַּ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/043.yaml
  text: Indeed[a], you turn back the edge of his sword[b], and you have not made him stand in battle.
translation:
  language: sw
  text: 'Tena, umeyarudisha nyuma makali ya upanga wake,[a]

    wala hukumfanya asimame vitani.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umeyafanya makali ya upanga wake yawe butu.” Kiebrania husema kihalisi, “umeyarudisha nyuma makali ya upanga wake,” ikionyesha kwamba umeufanya upanga wake usiwe na ufanisi.
    reason: lexical_alternative
  - marker: b
    text: Au, “hukumtegemeza vitani,” au “hukumwezesha kusimama vitani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Naam
  rationale: Hapa ni chembe ya kusisitiza na kuongeza hoja katika mfululizo wa maombolezo; “Naam” huhifadhi msisitizo huo kwa lugha yenye heshima.
- source_word: תָּשִׁיב
  choice: umeurudisha nyuma
  rationale: Hifili ya שוב ina maana ya kusababisha kurudi au kurudisha nyuma. Tafsiri hii inadumisha taswira halisi ya Kiebrania badala ya kuitafsiri moja kwa moja kuwa “umebutuza.”
- source_word: צוּר
  choice: ukali
  rationale: Katika muundo wa סמיכות pamoja na “upanga wake,” neno hili humaanisha ukali au makali ya upanga. “Ukali” huambatana kwa kawaida na kitenzi “kurudisha nyuma” na kuhifadhi taswira ya silaha kupoteza ufanisi.
- source_word: חַרְבּוֹ
  choice: wa upanga wake
  rationale: 'Huwakilisha wazi uhusiano wa סמיכות: ukali ni wa upanga wa mfalme.'
- source_word: הֲקֵימֹתוֹ
  choice: hukumwezesha kusimama imara
  rationale: Hifili ya קום ni kusababisha mtu asimame, kumthibitisha, au kumwezesha kudumu. Katika muktadha wa vita, usemi huu huhifadhi taswira ya kumwezesha ashikilie msimamo wake.
- source_word: בַּמִּלְחָמָה
  choice: vitani
  rationale: “Vitani” ni Kiswahili cha kawaida na cha moja kwa moja kwa maana ya kuwa katika mapigano au vita.
theological_decisions:
- issue: Mungu anaelezwa moja kwa moja kuwa ametenda dhidi ya mfalme wa ukoo wa Daudi
  choice: 'Kudumisha nafsi ya pili: “umeurudisha ... hukumwezesha”'
  alternative: Kutumia kauli isiyoonyesha mtendaji ili kupunguza uwakala wa Mungu
  rationale: Maombolezo ya zaburi yanamhusisha Mungu moja kwa moja na kushindwa kwa mfalme. Mvutano huo wa kiteolojia unapaswa kubaki bila kupunguzwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Naam” huhifadhi msisitizo wa maombolezo; “kusimama imara vitani” ni ya asili zaidi kuliko “kumfanya asimame” huku ikidumisha taswira ya Kiebrania.
