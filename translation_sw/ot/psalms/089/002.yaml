  text: כִּֽי אָמַ֗רְתִּי ע֭וֹלָם חֶ֣סֶד יִבָּנֶ֑ה שָׁמַ֓יִם תָּכִ֖ן אֱמוּנָתְ/ךָ֣ בָ/הֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/002.yaml
  text: For I said[a], “Steadfast love will be built up forever; in the heavens you will establish your faithfulness.”
translation:
  language: sw
  text: Kwa maana nilisema, “Upendo thabiti utajengwa[a] milele; mbinguni utauthibitisha uaminifu wako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Upendo thabiti utathibitishwa milele.” Kitenzi cha Kiebrania kinaweza kutafsiriwa kwa maana ya “kujengwa” au, kwa ujumla zaidi, “kuthibitishwa”; tafsiri kuu inadumisha sitiari ya ujenzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huonyesha kuwa kauli hii inatoa sababu au ufafanuzi wa yaliyotangulia, bila kuamua kwa nguvu zaidi ya hapo.
- source_word: אָמַרְתִּי
  choice: nilisema
  rationale: Ni kitenzi cha Qal timilifu, nafsi ya kwanza umoja; wakati uliopita ni wa moja kwa moja na wa kawaida katika Kiswahili.
- source_word: עוֹלָם
  choice: milele
  rationale: Hutumika hapa kama kielezi cha muda usio na mwisho; “milele” ni Kiswahili cha kawaida chenye hadhi ya kishairi.
- source_word: חֶסֶד
  choice: upendo thabiti
  rationale: Huhifadhi pamoja wazo la upendo na la uaminifu wa kudumu, bila kulifinya neno kuwa huruma pekee au kulifafanua waziwazi kuwa la agano.
- source_word: יִבָּנֶה
  choice: utajengwa
  rationale: Nifali ya בנה ina maana ya kujengwa. Tafsiri hii inadumisha sitiari ya ujenzi na hali ya kauli inayotazamia kudumu.
- source_word: שָׁמַיִם
  choice: mbinguni
  rationale: Katika Kiswahili, “mbinguni” ni njia ya asili ya kueleza mahali panaporejelewa na wingi wa Kiebrania שָׁמַיִם bila kulazimisha umbo lisilo la kawaida.
- source_word: תָּכִן
  choice: utauthibitisha
  rationale: Hifili ya כון ina maana ya kufanya kitu kiwe imara au thabiti. “Utauthibitisha” huonyesha tendo la Mungu la kuufanya uaminifu wake usimame imara.
- source_word: אֱמוּנָתְךָ
  choice: uaminifu wako
  rationale: Neno hili huonyesha uthabiti, kutegemeka, na uaminifu; “uaminifu wako” ndilo chaguo la asili na lenye uzito katika muktadha huu.
- source_word: בָהֶם
  choice: mbinguni
  rationale: Kiwakilishi hiki kinarejelea שָׁמַיִם. Kurudia “mbinguni” kwa maana huleta Kiswahili kilicho wazi na cha asili kuliko “ndani yake/yao,” ambako rejeo lingeweza kuwa gumu.
theological_decisions:
- issue: Maana ya חֶסֶד katika muktadha wa kishairi unaohusu uaminifu wa Mungu
  choice: upendo thabiti
  alternative: fadhili; rehema; upendo wa agano
  rationale: “Upendo thabiti” huhifadhi upendo na ushikamanifu wa kudumu wa Mungu bila kuingiza neno “agano,” ambalo halipo wazi katika mstari huu, wala kupunguza maana kuwa rehema pekee.
- issue: Je, kishororo cha pili ni usemi wa moja kwa moja kwa Mungu?
  choice: 'usemi wa moja kwa moja: “utauthibitisha uaminifu wako”'
  alternative: kauli isiyo ya moja kwa moja kwamba uaminifu umethibitishwa mbinguni
  rationale: Kitenzi cha nafsi ya pili ya kiume umoja na kiambishi cha nafsi ya pili katika אֱמוּנָתְךָ vinaunga mkono kwa nguvu kumwelekea Mungu moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa mistari miwili na sitiari ya ujenzi vimehifadhiwa, huku “mbinguni” na “utauthibitisha” vikifanya sentensi isomeke kwa kawaida.
