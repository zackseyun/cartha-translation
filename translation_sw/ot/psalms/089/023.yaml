base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/023.yaml
  text: And I will crush his adversaries before him[b][a], and strike down those who hate him.
translation:
  language: sw
  text: 'Nami nitawaponda adui zake mbele yake[a],

    na kuwapiga wale wanaomchukia.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka mbele yake,” kwa kufuata kwa karibu zaidi nahau ya Kiebrania ya kuwaondoa maadui kutoka mbele yake.
    reason: lexical_alternative
  - marker: b
    text: Au, “kuwapiga kwa nguvu”; kitenzi cha Kiebrania kinaweza kumaanisha kupiga kwa nguvu katika hukumu au vitani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַתּוֹתִי
  choice: Nami nitawaponda
  rationale: Kitenzi כתת kinaonyesha kuvunja au kuponda kwa nguvu. Wakati ujao unafaa katika mfululizo huu wa ahadi ya Mungu, na “kuponda” huhifadhi picha kali ya ushindi.
- source_word: מִפָּנָיו
  choice: mbele yake
  rationale: Kirai hiki ni halisi zaidi kama “kutoka mbele ya uso wake.” “Mbele yake” ni Kiswahili cha kawaida na huhifadhi wazo la Mungu kuwaondoa maadui wanaomkabili mfalme.
- source_word: צָרָיו
  choice: watesi wake
  rationale: צָרָיו humaanisha wapinzani au maadui wenye uhasama. “Watesi wake” huonyesha upinzani hai na kutofautisha kundi hili na “wale wanaomchukia” katika mstari sambamba.
- source_word: וּמְשַׂנְאָיו
  choice: wale wanaomchukia
  rationale: Umbo la kishiriki kutoka שׂנא linaonyesha chuki ya kudumu au yenye sifa bainifu. Usemi huu ni wa kawaida na huhifadhi nguvu ya kitenzi.
- source_word: אֶגּוֹף
  choice: kuwapiga
  rationale: נגף inaweza kumaanisha kupiga, kuangusha kwa pigo, au kupiga kwa hukumu. “Kuwapiga” huhifadhi upana wa maana bila kulazimisha namna mahususi ya adhabu; tanbihi inaonyesha maana kali zaidi inayowezekana.
theological_decisions:
- issue: Lugha ya Mungu kama shujaa katika ahadi ya agano kwa mfalme wa ukoo wa Daudi
  choice: Kuhifadhi picha kali ya Mungu akiwashinda moja kwa moja maadui wa mfalme.
  alternative: Kutafsiri kwa ujumla zaidi kuwa “kuwashinda” au “kuwalinda dhidi ya maadui.”
  rationale: Vitenzi vya Kiebrania vina nguvu na vinaonyesha tendo la Mungu katika vita au hukumu. Tafsiri haipunguzi ukali huo wala kuingiza dai la baadaye la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi wenye vipashio viwili sambamba umehifadhiwa; msamiati wa kivita haujalainishwa kupita kiasi.
