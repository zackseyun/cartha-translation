  text: כִּ֣י לַֽ֭/יהוָה מָֽגִנֵּ֑/נוּ וְ/לִ/קְד֖וֹשׁ יִשְׂרָאֵ֣ל מַלְכֵּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/018.yaml
  text: For our shield belongs to Yahweh[a], and our king to the Holy One of Israel.
translation:
  language: sw
  text: Kwa maana ngao yetu ni ya BWANA,[a] na mfalme wetu ni wa Mtakatifu wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana ngao yetu ni mali ya BWANA, na mfalme wetu ni wa Mtakatifu wa Israeli.” Kiebrania kina usemi mfupi usiotaja kitenzi waziwazi, na vishazi vyake viwili vina ulinganifu mkubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha msingi au maelezo ya sifa na tumaini lililotangulia, bila kuongeza msisitizo usiokuwamo.
- source_word: לַיהוָה
  choice: ni ya BWANA
  rationale: Kiambishi ל hapa kinaonyesha umiliki au uhusiano. Usemi huu wa Kiswahili ni wa kawaida na unabaki karibu na muundo wa Kiebrania.
- source_word: מָגִנֵּנוּ
  choice: ngao yetu
  rationale: Taswira halisi ya ngao imehifadhiwa kwa kuwa ni wazi na ya kawaida katika Zaburi, bila kuifafanua moja kwa moja kuwa 'mlinzi'.
- source_word: וְלִקְדוֹשׁ יִשְׂרָאֵל
  choice: na ... ni wa Mtakatifu wa Israeli
  rationale: ל ya pili inalingana na ya kwanza na inaonyesha umiliki au uhusiano; mpangilio umefanywa wa kawaida katika Kiswahili huku ulinganifu ukihifadhiwa.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: Mtakatifu wa Israeli
  rationale: Hili ni jina rasmi la Mungu katika Maandiko ya Kiebrania; tafsiri hii huhifadhi uzito na utambulisho wake.
- source_word: מַלְכֵּנוּ
  choice: mfalme wetu
  rationale: Neno hilo humaanisha moja kwa moja 'mfalme' na huhifadhi taswira ya kifalme pamoja na uwezekano wa kumrejelea mfalme wa kibinadamu aliye chini ya mamlaka ya Mungu.
theological_decisions:
- issue: Anayerejelewa na “ngao yetu” na “mfalme wetu”
  choice: Tafsiri inaonyesha kwamba ngao yetu ni ya BWANA na mfalme wetu ni wa Mtakatifu wa Israeli, huku ikiacha taswira ya “ngao” bila kuifafanua.
  alternative: “Ngao yetu” humrejelea Mungu moja kwa moja, ilhali “mfalme wetu” humrejelea mfalme wa kibinadamu.
  rationale: Vishazi vyote viwili vina miundo sambamba yenye ל (‘ya BWANA’ // ‘wa Mtakatifu wa Israeli’). Katika zaburi za kifalme, ‘ngao’ pia inaweza kuwa sitiari ya mfalme kama mlinzi. Tafsiri na tanbihi huhifadhi ufupisho na mvutano wa Kiebrania badala ya kulazimisha ufafanuzi mmoja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na ya kishairi. ‘BWANA’ limetumiwa kwa jina יהוה kulingana na desturi ya tafsiri iliyotolewa; ‘ngao’ na ‘mfalme’ zimehifadhiwa ili kutopoteza taswira za zaburi.
