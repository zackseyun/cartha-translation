  yaml_path: translation/ot/psalms/089/006.yaml
  text: For who in the skies can be compared to Yahweh? Who among the sons of God is like Yahweh?[a]
translation:
  language: sw
  text: Kwa maana, ni nani mbinguni anayeweza kulinganishwa na BWANA? Ni nani miongoni mwa wana wa Mungu anayefanana na BWANA?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miongoni mwa viumbe wa mbinguni,” “miongoni mwa viumbe wa kiungu,” au “miongoni mwa wana wa wenye nguvu.” Kwa tafsiri halisi, Kiebrania husema “miongoni mwa wana wa Mungu/miungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Hutanguliza msingi wa sifa iliyotangulia na kuingia kwa kawaida katika maswali ya balagha.
- source_word: בַשַּׁחַק
  choice: mbinguni
  rationale: Neno שׁחק linaweza kumaanisha anga, mbingu, au mawingu; hapa muktadha wa viumbe wa mbinguni unaunga mkono 'mbinguni'.
- source_word: יַעֲרֹךְ לַיהוָה
  choice: anayeweza kulinganishwa na BWANA
  rationale: Kitenzi ערך hapa kina wazo la kumweka mmoja kando ya mwingine ili kuwalinganisha; usemi huu unatoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: יִדְמֶה לַיהוָה
  choice: anayefanana na BWANA
  rationale: Huhifadhi usambamba wa kishairi na swali la kwanza huku ikitoa maana ya kufanana au kulingana.
- source_word: בִּבְנֵי אֵלִים
  choice: miongoni mwa wana wa Mungu
  rationale: Huhifadhi taswira halisi na utata wa Kiebrania badala ya kuibadili moja kwa moja kuwa maelezo ya viumbe wa mbinguni.
- source_word: יהוה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea ya Kiswahili ya kutofautisha jina la agano יהוה kwa herufi kubwa.
theological_decisions:
- issue: Uwasilishaji wa יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ ni namna ya heshima iliyozoeleka katika Biblia za Kiswahili, huku herufi kubwa zikionyesha kuwa chanzo kina jina יהוה.
- issue: Maana ya בִּבְנֵי אֵלִים
  choice: wana wa Mungu
  alternative: viumbe wa mbinguni; viumbe wa kimungu; wana wa wenye nguvu
  rationale: Tafsiri ya karibu huhifadhi taswira na mvutano wa kiteolojia wa maneno ya Kiebrania; maana mbadala zinazowezekana zinawekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Maswali mawili sambamba yamehifadhiwa, na tanbihi inaweka wazi utata wa usemi wa Kiebrania.
