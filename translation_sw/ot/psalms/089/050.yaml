base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/050.yaml
  text: Remember[a], Lord, the reproach of your servants[b], which I bear in my bosom from many peoples.
translation:
  language: sw
  text: Kumbuka, Ee Bwana, fedheha ya watumishi wako, ninayoibeba kifuani mwangu[a] kutoka kwa mataifa mengi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kifuani mwangu” ni nahau ya Kiebrania inayomaanisha kubeba jambo binafsi na kwa undani, si kulibeba kimwili tu.
    reason: cultural_note
  - marker: b
    text: Au, “ninayoibeba kifuani mwangu—fedheha ya mataifa mengi yote.” Muundo wa Kiebrania baada ya “kifuani mwangu” umebanwa; unaweza kueleweka kuwa mataifa mengi ndiyo chanzo cha fedheha (“kutoka kwa mataifa mengi”) au kuwa maneno hayo yanaeleza fedheha inayobebwa.
    reason: alternative_reading
lexical_decisions:
- source_word: זְכֹר
  choice: Kumbuka
  rationale: Ni amri ya moja kwa moja inayotumika kama ombi kwa Mungu; “kumbuka” ni usemi wa kawaida na wenye hadhi katika sala ya maombolezo.
- source_word: אֲדֹנָי
  choice: Ee Bwana
  rationale: Hili ni jina la cheo la Mungu katika mwito wa moja kwa moja. “Ee” huonyesha mwito kwa Kiswahili bila kulifanya jina hilo limaanishe “Bwana wangu.”
- source_word: חֶרְפַּת
  choice: fedheha
  rationale: Neno hili linaweza kumaanisha aibu, dharau au shutuma inayomletea mtu fedheha. “Fedheha” huhifadhi uzito wa hali ya kuaibishwa bila kuifanya iwe maneno ya dhihaka pekee.
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Katika lugha ya sala kuhusu watu wa Mungu, “watumishi” ndiyo tafsiri ya asili na inayofaa zaidi kuliko “watumwa,” ingawa neno la Kiebrania linaweza kuwa na maana zote mbili.
- source_word: שְׂאֵתִי
  choice: ninayoibeba
  rationale: Kitenzi kina maana ya kuinua, kuchukua au kubeba. Hapa kinaonyesha kwamba mtunga zaburi anaistahimili fedheha hiyo binafsi.
- source_word: בְּחֵיקִי
  choice: kifuani mwangu
  rationale: Tafsiri hii huhifadhi picha halisi ya Kiebrania ya kubeba kitu karibu kabisa na nafsi na mwili.
- source_word: כָּל רַבִּים עַמִּים
  choice: kutoka kwa mataifa mengi
  rationale: Muundo wa Kiebrania umebanwa na si rahisi. Tafsiri hii huelewa mataifa mengi kuwa chanzo cha fedheha. “Mataifa” huhifadhi wingi wa עַמִּים na maana yake ya makundi ya watu.
theological_decisions:
- issue: Tafsiri ya jina la cheo אֲדֹנָי
  choice: Ee Bwana
  alternative: Ee Bwana wangu
  rationale: Katika Zaburi neno hili hutumiwa kama jina maalumu la cheo cha Mungu. “Ee Bwana” hudumisha matumizi hayo bila kuingiza umilikishi ambao si lazima katika muktadha huu.
- issue: Uhusiano wa maneno כָּל רַבִּים עַמִּים na sehemu inayotangulia
  choice: kutoka kwa mataifa mengi
  alternative: fedheha ya mataifa yote yaliyo mengi
  rationale: Sintaksia ya Kiebrania imebanwa, hivyo inaweza kuonyesha chanzo cha fedheha au kile kinachobebwa. Maandishi makuu yanaonyesha chanzo, huku tanbihi ikihifadhi usomaji mwingine bila kuamua zaidi ya ushahidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sala ya maombolezo ulio wa sasa na wenye hadhi. Picha ya Kiebrania ya kubeba kifuani imehifadhiwa, huku sintaksia tata ikielezwa katika tanbihi.
