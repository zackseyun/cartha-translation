  text: ambaye mkono wangu utakuwa imara pamoja naye[a]; naam, mkono wangu wa juu utamtia nguvu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkono wangu utasimama imara pamoja naye.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinatumia “mkono” na “mkono wa juu”; yote mawili ni taswira za kishairi za nguvu na uwezo.
