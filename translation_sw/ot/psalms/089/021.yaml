lexical_decisions:
- source_word: אֲשֶׁר ... עִמּוֹ
  choice: ambaye ... pamoja naye
  rationale: Kiwakilishi cha uhusiano kinaendeleza maelezo ya mfalme aliyechaguliwa katika mstari uliotangulia, huku עִמּוֹ ikitafsiriwa wazi kuwa ‘pamoja naye.’
- source_word: יָדִי
  choice: mkono wangu
  rationale: Huhifadhi taswira halisi ya kishairi ya mkono wa Mungu kama ishara ya utendaji na msaada wake.
- source_word: תִּכּוֹן
  choice: utakuwa thabiti
  rationale: Niphal ya כון hapa ina maana ya kuwa imara au thabiti. Tafsiri hii ni ya asili zaidi katika Kiswahili kuliko ‘utawekwa imara’ na haiingizi mtendaji mwingine asiyeelezwa.
- source_word: אַף
  choice: naam
  rationale: Neno hili linaongeza mkazo katika mstari sambamba; ‘naam’ linatunza uzito wa kishairi na maana ya uthibitisho.
- source_word: זְרוֹעִי
  choice: mkono wangu
  rationale: Kiswahili cha kawaida hutumia ‘mkono’ kwa eneo pana linaloweza kuwakilisha ‘hand’ na ‘arm.’ Taswira ya kiungo cha mwili imehifadhiwa, na tofauti ya maneno ya Kiebrania imeelezwa katika tanbihi.
- source_word: תְאַמְּצֶנּוּ
  choice: utamtia nguvu
  rationale: Piel ya אמץ ina maana ya kumfanya mtu awe na nguvu au kumwimarisha; ‘utamtia nguvu’ ni sahihi na ya kawaida.
theological_decisions:
- issue: Lugha ya kumwelezea Mungu kwa viungo vya mwili
  choice: Kuhifadhi ‘mkono wangu’ kama taswira ya kishairi ya uwezo na msaada wa Mungu.
  alternative: Kutafsiri kwa ufafanuzi kuwa ‘nguvu zangu’ au ‘uwezo wangu.’
  rationale: Maandishi ya Kiebrania yanatumia taswira ya mwili kwa makusudi kueleza msaada wa Mungu kwa mfalme wa Daudi; kuiacha taswira hiyo kunahifadhi ushairi bila kudai kwamba Mungu ana mwili wa kibinadamu.
- issue: Ahadi ya wakati ujao dhidi ya ukweli wa kawaida wa wakati wa sasa
  choice: 'Kutumia wakati ujao: ‘utakuwa’ na ‘utamtia.’'
  alternative: 'Kutumia wakati wa sasa wa mazoea: ‘ni thabiti’ na ‘unamtia.’'
  rationale: Vitenzi visivyotimilika katika muktadha huu wa agano vina nguvu ya ahadi inayoendelea au ya wakati ujao.
- issue: Uhusiano wa mkono wa Mungu na mfalme katika תִּכּוֹן עִמּוֹ
  choice: ‘mkono wangu utakuwa thabiti pamoja naye,’ bila kufafanua zaidi namna ya uthabiti huo.
  alternative: ‘mkono wangu utamtegemeza kwa uthabiti’ au ‘nitamsaidia daima.’
  rationale: Tafsiri iliyochaguliwa inahifadhi mvutano na upekee wa tamathali ya Kiebrania badala ya kuibadili kuwa maelezo ya moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Naam’ limetumiwa kwa mkazo wa kishairi; muundo wa uhusiano ‘ambaye’ umeachwa kama mwendelezo wa mstari uliotangulia.
