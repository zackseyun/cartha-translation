  yaml_path: translation/ot/psalms/089/020.yaml
  text: I have found David my servant[a]; with my holy oil I have anointed him.
translation:
  language: sw
  text: Nimempata Daudi, mtumishi wangu; kwa mafuta yangu matakatifu nimemtia mafuta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nilimpata Daudi, mtumishi wangu; kwa mafuta yangu matakatifu nilimtia mafuta.” Kauli timilifu za Kiebrania zinaweza pia kutafsiriwa kwa wakati uliopita.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי
  choice: Nimempata
  rationale: Kauli timilifu ya Kiebrania, nafsi ya kwanza umoja, inaeleza tendo lililokamilika lenye umuhimu unaoendelea katika tangazo hili la agano. Kiswahili sanifu hutumia wakati timilifu kwa njia ya asili hapa; 'Nilimpata' pia yawezekana.
- source_word: דָּוִד
  choice: Daudi
  rationale: Jina hili limetolewa kwa umbo lake la kawaida katika matumizi ya Biblia ya Kiswahili.
- source_word: עַבְדִּי
  choice: mtumishi wangu
  rationale: Katika muktadha wa kifalme na wa agano, neno hili ni cheo cha heshima kinachoonyesha huduma kwa Mungu, wala halisisitizi hali ya utumwa.
- source_word: בְּשֶׁמֶן קָדְשִׁי
  choice: kwa mafuta yangu matakatifu
  rationale: Kihusishi ב kinaonyesha chombo kilichotumiwa katika tendo la kutia mafuta. 'Matakatifu' linahifadhi wazo la mafuta yaliyowekwa wakfu kuwa ya Mungu.
- source_word: מְשַׁחְתִּיו
  choice: nimemtia mafuta
  rationale: Kauli timilifu yenye kiambishi cha nafsi ya tatu ya kiume inaeleza kuwa Mungu alimwekea Daudi wakfu na kumpa utume wa kifalme. Usemi 'kutia mafuta' ni wa asili na unaeleweka katika Kiswahili cha Biblia.
theological_decisions:
- issue: Lugha ya kutawazwa kwa mfalme na uwezekano wa maana ya Kimasihi
  choice: Kutaja moja kwa moja kutiwa mafuta kwa Daudi bila kuongeza cheo cha Kimasihi
  alternative: Tafsiri yenye kuweka wazi kwamba Daudi ni mfano wa Masihi au kumwita 'mtiwa-mafuta' hapa
  rationale: Kiebrania kinamtaja Daudi waziwazi na kueleza tendo la kutiwa kwake mafuta. Ingawa zaburi nzima inaweza kusomwa kwa mtazamo wa Kimasihi, tafsiri haipaswi kuingiza dai ambalo mstari huu haulitamki moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umehifadhi usambamba wa kishairi, na wakati timilifu umetumiwa kuonyesha matendo yaliyokamilika yenye umuhimu unaoendelea.
