base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/017.yaml
  text: For you are the glory of their strength[b][a], and by your favor you exalt our horn.
translation:
  language: sw
  text: Kwa maana wewe ndiwe utukufu[a] wa nguvu zao, na kwa kibali chako unaiinua pembe yetu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “fahari,” “uzuri,” au “uangavu.”
    reason: lexical_alternative
  - marker: b
    text: Katika ushairi wa Kiebrania, “pembe” ni mfano wa nguvu, uwezo, heshima, au hali iliyoinuliwa.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza sababu au msingi wa kauli iliyotangulia na kuendeleza mtiririko wa maelezo kwa Kiswahili cha kawaida.
- source_word: תִפְאֶרֶת
  choice: utukufu
  rationale: Neno hili linaweza kumaanisha utukufu, fahari, uzuri, au uangavu. “Utukufu” linahifadhi maana pana na uhusiano wake na nguvu bila kuufafanua kupita kiasi.
- source_word: עֻזָּמוֹ
  choice: nguvu zao
  rationale: Nomino humaanisha nguvu au uwezo, na kiambishi chake ni cha nafsi ya tatu wingi. Tafsiri hii inalinda mabadiliko halisi ya viwakilishi katika Kiebrania.
- source_word: אָתָּה
  choice: wewe ndiwe
  rationale: Kiwakilishi huru kina mkazo na kinatumika kiarifu; “wewe ndiwe” huonyesha mkazo huo kwa Kiswahili cha asili.
- source_word: וּבִרְצֹנְךָ
  choice: na kwa kibali chako
  rationale: רָצוֹן hapa huonyesha kibali, fadhili, au nia njema. “Kwa kibali chako” linaonyesha kuwa tendo linalofuata hutokana na upendeleo mwema wa Mungu.
- source_word: תרים
  choice: unaiinua
  rationale: Hifili ya רוּם humaanisha kuinua au kutukuza. “Unaiinua” linahifadhi tendo na taswira ya pembe bila kuibadili moja kwa moja kuwa dhana ya nguvu.
- source_word: קַרְנֵנוּ
  choice: pembe yetu
  rationale: Maana ya moja kwa moja ni “pembe yetu.” Katika ushairi wa Kiebrania pembe ni mfano wa nguvu, uwezo, heshima, au hali iliyoinuliwa; taswira imehifadhiwa katika matini na kufafanuliwa katika tanbihi.
theological_decisions:
- issue: Maana ya mfano wa “pembe”
  choice: Kuhifadhi “pembe yetu” katika matini kuu.
  alternative: nguvu yetu; uwezo wetu; heshima yetu
  rationale: Taswira ya Kiebrania ni ya makusudi na hubeba maana kadhaa zinazohusiana. Kuibadili kuwa neno moja la kufasiri kungepunguza upana wake; tanbihi inasaidia msomaji bila kuondoa taswira.
- issue: Mabadiliko kutoka “zao” hadi “yetu”
  choice: 'Kuhifadhi viwakilishi vya Kiebrania: “nguvu zao” na “pembe yetu.”'
  alternative: Kuvilinganisha vyote kuwa “yetu”
  rationale: Chanzo kina mabadiliko halisi kutoka nafsi ya tatu wingi kwenda nafsi ya kwanza wingi. Kuyasawazisha kungeondoa mvutano au mgeuko wa kishairi uliopo katika matini.
- issue: Uhusiano wa Mungu na nguvu za jumuiya
  choice: “Wewe ndiwe utukufu wa nguvu zao.”
  alternative: Wewe ndiwe chanzo cha nguvu zao; wanajivunia nguvu zako
  rationale: Kiebrania hakisemi wazi “chanzo” wala hakigeuzi nguvu kuwa za Mungu. Tafsiri iliyochaguliwa huhifadhi kauli ya kiarifu na uwazi wake wenye mvutano bila kuingiza ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Wewe ndiwe” huhifadhi mkazo wa kiwakilishi cha Kiebrania; “unaiinua pembe” huhifadhi picha ya asili. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
