id: PSA.89.15
reference: Psalms 89:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַשְׁרֵ֣י הָ֭/עָם יוֹדְעֵ֣י תְרוּעָ֑ה יְ֝הוָ֗ה בְּֽ/אוֹר פָּנֶ֥י/ךָ יְהַלֵּכֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/015.yaml
  text: Blessed are the people who know the joyful shout[a]; O Yahweh[b], they walk in the light of your face.
translation:
  language: sw
  text: Heri watu wanaoijua sauti ya shangwe[a]! Ee Yahwe, wanatembea katika nuru ya uso wako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “shangwe ya sikukuu”; huenda ikatia ndani pia sauti ya tarumbeta ya kushangilia katika ibada.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “uso wako”; yaani, uwepo wako au kibali chako.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heri
  rationale: Neno hili linatanguliza tamko la heri. “Heri” ni la kawaida katika Kiswahili cha kibiblia na lina uzito wa kiroho bila kulifanya tamko lihusu hisia za furaha pekee.
- source_word: הָעָם
  choice: watu
  rationale: Katika muktadha huu neno hilo linamaanisha jumuiya ya watu, si taifa kwa maana ya kisiasa.
- source_word: יוֹדְעֵי
  choice: wanaoijua
  rationale: Umbo la kishirikishi linaonyesha watu wanaotambulika kwa kuijua shangwe hiyo; “wanaoijua” ni Kiswahili cha asili na huhifadhi hali hiyo endelevu.
- source_word: תְרוּעָה
  choice: sauti ya shangwe
  rationale: Neno linaweza kumaanisha mwangwi mkubwa wa kushangilia, shangwe ya sikukuu, au sauti ya tarumbeta. “Sauti ya shangwe” linafaa kwa muktadha wa ibada bila kulibana neno liwe sauti ya ala pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limewasilishwa kama jina binafsi badala ya kubadilishwa kuwa cheo kama “BWANA”; hapa ni usemi wa kumwita moja kwa moja, “Ee Yahwe.”
- source_word: בְּאוֹר
  choice: katika nuru
  rationale: Kirai hiki kinaonyesha mazingira au hali ambamo watu wanatembea, hivyo “katika nuru” ni cha asili na karibu na Kiebrania.
- source_word: פָּנֶיךָ
  choice: uso wako
  rationale: Hili ndilo taswira halisi ya Kiebrania. Linaweza kudokeza uwepo au kibali cha Mungu, lakini taswira ya uso imehifadhiwa katika matini.
- source_word: יְהַלֵּכוּן
  choice: wanatembea
  rationale: Kitenzi kinaonyesha mwenendo unaoendelea. “Wanatembea” huhifadhi taswira ya mwendo na pia maana pana ya kuishi mbele za Mungu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe, katika mwito “Ee Yahwe”
  alternative: BWANA au Yehova
  rationale: Matini ina jina la agano la Mungu moja kwa moja. Kulitaja kama “Yahwe” huhifadhi jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Iwapo פָּנֶיךָ itafsiriwe kwa taswira ya “uso” au kwa maana ya “uwepo”
  choice: uso wako
  alternative: uwepo wako au kibali chako
  rationale: Kiebrania kinasema kihalisi “uso wako.” Matini kuu imehifadhi taswira hiyo na tanbihi inaeleza maana zinazoweza kudokezwa, bila kuamua maana moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Heri” na “Ee Yahwe” hudumisha sauti ya kishairi na ya ibada, huku muundo mwingine ukibaki wazi kwa msomaji wa kawaida.
