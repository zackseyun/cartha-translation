base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/047.yaml
  text: Remember how short my lifetime is! For what vanity have you created all the sons of man?[a][b]
translation:
  language: sw
  text: Kumbuka jinsi muda wa maisha yangu ulivyo mfupi! Kwa ubatili gani umewaumba wanadamu wote?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno kwa neno: “wana wote wa Adamu.” Yaani, wanadamu wote.'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “Kwa ubatili umewaumba wanadamu wote.”'
    reason: previous_rendering
lexical_decisions:
- source_word: זְכָר
  choice: Kumbuka
  rationale: Ni amri ya nafsi ya pili ya kiume, ikielekezwa kwa Mungu; ombi la moja kwa moja linahifadhiwa vizuri kwa “Kumbuka.”
- source_word: אֲנִי מֶה חָלֶד
  choice: jinsi muda wa maisha yangu ulivyo mfupi
  rationale: Ingawa אֲנִי ni “mimi,” muundo mzima kwa kawaida unaeleza ufupi wa muda wa maisha ya msemaji. Tafsiri hii ni ya asili kwa Kiswahili na inaleta wazi kilio cha kishairi bila kubadili maana yake.
- source_word: עַל מַה
  choice: Ni kwa ajili ya ... gani
  rationale: Muundo huu unahifadhi swali la kusudi au sababu kuliko kutumia “kwa nini” pekee.
- source_word: שָּׁוְא
  choice: ubatili
  rationale: Neno hili linaweza kumaanisha hali ya kutokuwa na maana, utupu, au kazi ya bure. “Ubatili” linafaa kwa mtindo wa kishairi na linahifadhi uzito wa swali.
- source_word: בָּרָאתָ
  choice: umewaumba
  rationale: Kitenzi ni cha nafsi ya pili umoja, Mungu akiwa ndiye anayeambiwa; kauli timilifu ya Kiswahili inaunganisha tendo la uumbaji na kilio cha sasa.
- source_word: כָל בְּנֵי אָדָם
  choice: wanadamu wote
  rationale: Kirai cha Kiebrania humaanisha wanadamu kwa ujumla. “Wanadamu wote” ni sawa kimaana, cha asili, na chenye hadhi katika Kiswahili; tafsiri ya neno kwa neno imewekwa katika tanbihi.
theological_decisions:
- issue: Rejeo la jumla kwa binadamu katika בְּנֵי אָדָם
  choice: wanadamu wote
  alternative: wana wote wa Adamu
  rationale: Kirai hiki kinawahusu watu wote, si wanaume pekee. Kiswahili “wanadamu” tayari huhifadhi uhusiano wa kiisimu na Adamu huku kikitoa maana ya jumla kwa njia ya kawaida.
- issue: Iwapo mstari wa pili ni swali au kauli
  choice: swali la balagha
  alternative: 'kauli: “Kwa ubatili umewaumba wanadamu wote”'
  rationale: עַל מַה huunga mkono usomaji wa swali la kusudi/sababu, lakini mpangilio wa Kiebrania unaweza pia kuwakilishwa kama kauli ya kilio; uwezekano huo umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi na chenye hadhi lakini kinachoeleweka kwa urahisi. “Muda wa maisha” huepuka ugumu wa “uhai wangu ni nini” na kuhifadhi wazo la kipindi kifupi cha maisha; “Ni kwa ajili ya ubatili gani” hudumisha mvutano wa swali la mshairi.
