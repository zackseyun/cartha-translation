  text: 'I have made a covenant with my chosen one[a]; I have sworn to David my servant:'
translation:
  language: sw
  text: “Nimefanya agano na mteule wangu[a]; nimemwapia Daudi, mtumishi wangu:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kihalisi, “nimekata agano na mteule wangu.”
