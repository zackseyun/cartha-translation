lexical_decisions:
- source_word: כָּרַתִּי
  choice: Nimefanya
  rationale: Katika msemo wa Kiebrania כרת ברית, maana ya kawaida ni kufanya au kuanzisha agano. Kiswahili cha sasa husema kwa ufasaha ‘kufanya agano’; wakati timilifu ‘nimefanya’ huhifadhi tendo lililokamilika lenye athari inayoendelea.
- source_word: בְּרִית
  choice: agano
  rationale: ‘Agano’ huhifadhi uzito wa neno la Kiebrania na ni istilahi ya kawaida na inayoeleweka katika muktadha huu.
- source_word: לִבְחִירִי
  choice: na mteule wangu
  rationale: Baada ya ‘kufanya agano,’ ל inaonyesha mhusika ambaye agano limefanywa naye. ‘Mteule wangu’ ni ya asili, fupi, na huhifadhi wazo la mtu aliyechaguliwa.
- source_word: נִשְׁבַּעְתִּי
  choice: nimemwapia
  rationale: Nifali ya שׁבע ina maana ya kuapa. ‘Nimemwapia’ humtaja kwa kawaida mtu ambaye kiapo kimetolewa kwake na huhifadhi nguvu endelevu ya kauli hiyo.
- source_word: לְדָוִד
  choice: Daudi
  rationale: Kiambishi cha yambwa katika ‘nimemwapia’ hubeba maana ya ל, huku ‘Daudi’ akibainisha anayehusika bila kurudia kihusishi kisicho cha asili katika Kiswahili.
- source_word: עַבְדִּי
  choice: mtumishi wangu
  rationale: Katika muktadha wa kifalme na wa agano, ‘mtumishi wangu’ ndiyo tafsiri inayofaa; mstari huu hautangulizi maana ya hali ya utumwa.
theological_decisions:
- issue: Utambulisho wa ‘mteule wangu’
  choice: Maneno yameachwa yakimtaja Daudi katika muktadha wa moja kwa moja wa agano la Daudi.
  alternative: Kuyafanya maneno hayo yamtaje moja kwa moja Masihi au kuyapanua kwa tafsiri ya kimasihi.
  rationale: Usambamba wa ‘mteule wangu’ na ‘Daudi, mtumishi wangu’ humfanya Daudi kuwa rejeo la wazi katika mstari huu. Uhusiano mpana wa kimasihi ni suala la ufasiri, si jambo la kuingizwa kimya katika tafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na usambamba wa kauli mbili umehifadhiwa; nuktambili ya mwisho inaonyesha kuwa kiapo kinaendelea katika mstari unaofuata.
