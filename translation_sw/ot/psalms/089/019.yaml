  yaml_path: translation/ot/psalms/089/019.yaml
  text: Then you spoke in a vision to your faithful ones and said[a], “I have set help upon a mighty one[d][c][b]; I have exalted one chosen from the people.”
translation:
  language: sw
  text: Ndipo ulizungumza kwa njia ya maono na waaminifu wako, ukasema[a], “Nimempa shujaa msaada[b]; nimemwinua mteule kutoka miongoni mwa watu[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata usomaji mwingine unaoakisiwa katika baadhi ya tafsiri, “na mwaminifu wako.”
    reason: textual_variant
  - marker: b
    text: “Shujaa” pia inaweza kutafsiriwa “mtu hodari” au “mpiganaji hodari.”
    reason: lexical_alternative
  - marker: c
    text: “Mteule” pia inaweza kueleweka kuwa “kijana”; lakini hapa muktadha wa kuchaguliwa na Mungu unaunga mkono “mteule.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Huendeleza mfuatano wa kisimulizi-kishairi kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: דִּבַּרְתָּ
  choice: ulizungumza
  rationale: Hutofautisha kitenzi hiki cha kusema kwa jumla na וַתֹּאמֶר, kinachofuata kama ‘ukasema’.
- source_word: בְחָזוֹן
  choice: katika maono
  rationale: Huonyesha mazingira au njia ya ufunuo bila kulazimisha maana finyu.
- source_word: לַחֲסִידֶיךָ
  choice: na waaminifu wako
  rationale: Kiambishi ל kinaweza kuonyesha walengwa wa mawasiliano; Kiswahili hutumia ‘kuzungumza na’. Wingi unafuata maandishi yaliyotolewa, na ‘waaminifu’ huwasilisha uaminifu wa agano bila maana za baadaye za kidhehebu.
- source_word: וַתֹּאמֶר
  choice: ukasema
  rationale: Ni mwendelezo wa kawaida wa usemi wa Mungu na huhifadhi utofauti na ‘ulizungumza’.
- source_word: שִׁוִּיתִי עֵזֶר עַל
  choice: Nimemwekea ... msaada
  rationale: Muundo huu wa Kiswahili huhifadhi wazo la kuweka au kukabidhi msaada juu ya mtu, lakini unasikika kwa ufasaha zaidi kuliko tafsiri ya neno kwa neno.
- source_word: גִּבּוֹר
  choice: shujaa
  rationale: Neno linaweza kumaanisha mtu hodari, mpiganaji, au shujaa; ‘shujaa’ ni la kishairi na halifungi maana katika nguvu za kijeshi pekee.
- source_word: הֲרִימוֹתִי
  choice: nimemwinua
  rationale: Huwasilisha tendo la kumweka mtu juu au kumpandisha cheo, linalofaa muktadha wa kifalme.
- source_word: בָחוּר
  choice: mteule
  rationale: Ingawa neno linaweza kumaanisha kijana, katika ulinganifu huu maana ya mtu aliyechaguliwa inafaa zaidi.
- source_word: מֵעָם
  choice: kutoka miongoni mwa watu
  rationale: Huonyesha wazi kwamba mtu huyo alichaguliwa kutoka ndani ya jumuiya ya watu.
theological_decisions:
- issue: Mhusika wa mstari katika muktadha wa agano la Daudi
  choice: Tafsiri imebaki katika kiwango cha mhusika wa karibu wa Kidaudi.
  alternative: Kuongeza wazi tafsiri ya Kimasihi inayotazama zaidi ya Daudi.
  rationale: Mstari wenyewe unasimulia uchaguzi na kuinuliwa kwa mtu katika agano la Daudi; uhusiano wa kiishara au wa Kimasihi unaweza kueleweka bila kuingizwa moja kwa moja katika tafsiri.
- issue: Wingi au umoja wa לַחֲסִידֶיךָ
  choice: waaminifu wako, kwa wingi
  alternative: mwaminifu wako, kwa umoja
  rationale: Maandishi ya WLC yaliyotolewa yanaonyesha wingi; usomaji wa umoja unaoshuhudiwa katika mapokeo mengine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo ‘nimemwekea shujaa msaada’ umechaguliwa ili kudumisha taswira ya Kiebrania huku ukibaki wa kueleweka. Alama zote za tanbihi zimewekwa katika matini kuu.
