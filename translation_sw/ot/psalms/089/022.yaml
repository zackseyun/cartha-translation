base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/022.yaml
  text: No enemy will exact tribute from him[b][a], and no son of wickedness will afflict him.
translation:
  language: sw
  text: Hakuna adui atakayemtoza ushuru[a], wala mwana wa uovu[b] hatamtesa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakayemdanganya,” “atakayejitwalia faida kwake,” au “atakayemdhulumu.” Kitenzi cha Kiebrania kinaweza kuwa na maana kadhaa zinazohusiana; hapa kimetafsiriwa kulingana na muktadha wa ukandamizaji wa adui.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “mwana wa uovu,” yaani mtu mwovu au mtenda maovu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַשִּׁא
  choice: atakayemtoza ushuru
  rationale: Katika muktadha wa ulinzi wa mfalme na kwa kuzingatia mstari sambamba unaotaja kuteswa, kausativi hii inaeleweka vizuri kama kumtoza mtu ushuru au malipo kwa nguvu. Tanbihi huhifadhi maana nyingine zinazowezekana za kitenzi.
- source_word: אוֹיֵב
  choice: adui
  rationale: Ni neno la kawaida na wazi katika Kiswahili kwa adui mmoja, na linafaa muktadha wa kifalme na wa migogoro.
- source_word: בּוֹ
  choice: -m- katika “kumtoza”
  rationale: Kwa maana iliyochaguliwa ya kutoza, kiambishi cha yambwa katika Kiswahili huwasilisha kwa kawaida mtu anayedaiwa ushuru; hakuna haja ya kihusishi tofauti.
- source_word: בֶן עַוְלָה
  choice: mwana wa uovu
  rationale: Tafsiri hii inadumisha nahau na nguvu ya kishairi ya Kiebrania, huku tanbihi ikifafanua kuwa maana yake ni mtu mwovu.
- source_word: עַוְלָה
  choice: uovu
  rationale: Neno hili linabeba wigo mpana wa ubaya wa kimaadili, ingawa katika miktadha mingine linaweza kumaanisha dhuluma au kutenda mabaya.
- source_word: יְעַנֶּנּוּ
  choice: hatamtesa
  rationale: Kitenzi hiki katika Piel huonyesha kutesa, kunyanyasa, au kudhulumu. “Kumtesa” ni cha asili na kinachoeleweka, na kinaendana na ahadi ya ulinzi dhidi ya adui.
theological_decisions:
- issue: Anayerejelewa na kiwakilishi cha umoja
  choice: Kudumisha kiwakilishi cha umoja katika “kumtoza” na “hatamtesa” bila kuongeza utambulisho wake.
  alternative: Kumtaja wazi Daudi, mfalme wa ukoo wa Daudi, au Masihi.
  rationale: Kiebrania kinamrejelea mhusika wa kifalme kwa umoja katika muktadha wa agano. Tafsiri haipaswi kubana wala kupanua utambulisho huo kwa ufafanuzi wa kitheolojia ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Muundo wa mistari miwili na nahau ya Kiebrania “mwana wa uovu” vimedumishwa; maana yake imefafanuliwa katika tanbihi.
