  text: אַף אָ֭נִי בְּכ֣וֹר אֶתְּנֵ֑/הוּ עֶ֝לְי֗וֹן לְ/מַלְכֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/027.yaml
  text: Indeed[a], I will make him the firstborn, the highest of the kings of the earth.
translation:
  language: sw
  text: Naam, mimi nitamweka kuwa mzaliwa wa kwanza,[a] aliye juu kuliko wafalme wa dunia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwenye cheo cha kwanza”; hapa “mzaliwa wa kwanza” humaanisha mwenye cheo na heshima ya juu zaidi, si lazima aliyezaliwa kwanza.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Naam
  rationale: Hapa ni chembe ya msisitizo inayoanzisha ahadi nyingine ya Mungu; “Naam” huwasilisha msisitizo huo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: אָנִי
  choice: mimi
  rationale: Kiwakilishi huru kimetajwa wazi katika Kiebrania kwa ajili ya msisitizo, hivyo kinahifadhiwa kama “mimi.”
- source_word: בְּכוֹר
  choice: mzaliwa wa kwanza
  rationale: Neno linahifadhi taswira ya Kiebrania ya hadhi ya kifalme, urithi na ukuu, bila kulifupisha kuwa tafsiri ya maana pekee.
- source_word: אֶתְּנֵהוּ
  choice: nitamweka kuwa
  rationale: Kitenzi נתן pamoja na kiarifu hapa kina maana ya kumweka au kumfanya mtu awe na hadhi fulani; “nitamweka kuwa” ni ya asili na huhifadhi maana ya uteuzi.
- source_word: עֶלְיוֹן
  choice: aliye juu kuliko
  rationale: Katika ulinganisho na wafalme wa dunia, neno linaonyesha cheo cha juu kabisa. Kauli hii huepuka kulifanya kuwa jina la Mungu “Aliye Juu Zaidi.”
- source_word: לְמַלְכֵי אָרֶץ
  choice: kuliko wafalme wa dunia
  rationale: Herufi ל baada ya עֶלְיוֹן inaonyesha uhusiano wa kulinganisha; Kiswahili huwasilisha ukuu huo kwa kawaida kwa “juu kuliko.”
theological_decisions:
- issue: Nguvu ya kifalme na uwezekano wa maana ya Kimasihi katika “mzaliwa wa kwanza”
  choice: Kuhifadhi “mzaliwa wa kwanza” kama istilahi ya hadhi ya kifalme bila kutaja wazi tafsiri ya Kimasihi katika andiko.
  alternative: “mwenye cheo cha kwanza” au “mrithi mkuu”
  rationale: Katika muktadha, usemi unamhusu mfalme wa ukoo wa Daudi na unaweza kuwa na umuhimu wa Kimasihi katika usomaji wa kikanoni. Kuhifadhi taswira ya Kiebrania huacha kina na mvutano huo bila kuingiza dai la ziada katika tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi ni mfupi, na msisitizo wa kiwakilishi “mimi” umehifadhiwa.
