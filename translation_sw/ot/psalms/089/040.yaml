  text: You have broken down all his walls[c][b][a]; you have made his strongholds a ruin.
translation:
  language: sw
  text: Umebomoa kuta zake zote[a]; umefanya ngome zake[b] kuwa magofu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nyua zake zote” au “vizuizi vyake vyote.” Neno la Kiebrania linaweza kumaanisha ukuta, ua, au kizuizi kinachozunguka na kulinda.
    reason: lexical_alternative
  - marker: b
    text: Au “ngome zilizojengewa ulinzi” au “mahali pake palipoimarishwa kwa ulinzi.”
    reason: lexical_alternative
  - marker: c
    text: Au “uharibifu” au “kuvunjika.” Neno la Kiebrania linaweza kumaanisha hali ya kuharibiwa au kuvunjwa; katika miktadha mingine linaweza kuhusishwa na hofu au taharuki.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַצְתָּ
  choice: Umebomoa
  rationale: Kitenzi פרץ humaanisha kuvunja au kupenya kinga. Pamoja na גְּדֵרֹתָיו, “umebomoa” ni Kiswahili cha kawaida kinachoonyesha kuondolewa kwa kinga kwa nguvu.
- source_word: כָל
  choice: zote
  rationale: Limehifadhi wazo la ujumla kamili wa uharibifu.
- source_word: גְּדֵרֹתָיו
  choice: kuta zake
  rationale: גְּדֵרָה inaweza kuwa ukuta, ua, au kizuizi kinachozingira. “Kuta” linafaa katika muktadha wa ulinzi na katika usambamba na ngome.
- source_word: שַׂמְתָּ
  choice: umefanya ... kuwa
  rationale: Katika muundo huu שׂים ina maana ya kusababisha kitu kiwe katika hali fulani; “umefanya ... kuwa” ni usemi wa asili wa Kiswahili.
- source_word: מִבְצָרָיו
  choice: ngome zake
  rationale: מִבְצָר ni mahali palipoimarishwa kwa ulinzi; “ngome” ni neno wazi, fupi, na la kishairi katika Kiswahili.
- source_word: מְחִתָּה
  choice: magofu
  rationale: Katika muktadha huu neno linaelekea kuonyesha hali ya kubomolewa au kuharibiwa. “Magofu” huendana kiasili na ngome nyingi na kudumisha taswira ya uharibifu wa kimwili.
theological_decisions:
- issue: Kirejelewa cha viambishi vya nafsi ya tatu umoja wa kiume katika “kuta zake” na “ngome zake”
  choice: Kuhifadhi “zake” bila kumtaja mhusika waziwazi
  alternative: Kutafsiri “kuta za mfalme” au kueleza kuwa ni ulinzi wa Sayuni/Yerusalemu
  rationale: Kiebrania kina viambishi vya umoja wa kiume, huku muktadha ukimlilia mtiwa-mafuta wa ukoo wa Daudi. Kutomtaja mhusika moja kwa moja kunahifadhi utata wa kishairi na mvutano wa kitheolojia wa kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. Wakati timilifu “umebomoa/umefanya” unaonyesha matendo yaliyotimizwa yenye matokeo yanayoonekana. Viwakilishi vimehifadhiwa bila ufafanuzi wa ziada.
