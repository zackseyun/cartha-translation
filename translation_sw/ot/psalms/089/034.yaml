  yaml_path: translation/ot/psalms/089/034.yaml
  text: I will not violate my covenant[b][a], or alter what has gone out from my lips.
translation:
  language: sw
  text: Sitakiuka agano langu,[a] wala sitabadilisha kile kilichotoka midomoni mwangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sitalitia unajisi agano langu” au “Sitalivunja agano langu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kwa karibu: “kile kilichotoka midomoni mwangu”; yaani, kile nilichosema.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחַלֵּל
  choice: Sitalinajisi
  rationale: Piel ya חלל hapa ina maana ya kulifanya agano kuwa najisi au kulivunja kwa kulikosea heshima. ‘Sitalinajisi’ huhifadhi uzito wa picha ya Kiebrania, huku tanbihi ikitoa maana mbadala ya kawaida zaidi.
- source_word: בְּרִיתִי
  choice: agano langu
  rationale: ‘Agano’ ndilo neno la kawaida la Kiswahili kwa בְּרִית katika muktadha wa kibiblia, na kiambishi cha nafsi ya kwanza kimehifadhiwa.
- source_word: מוֹצָא שְׂפָתַי
  choice: neno lililotoka midomoni mwangu
  rationale: Kifungu hiki kwa karibu ni ‘kile kinachotoka midomoni mwangu.’ Tafsiri hii huhifadhi taswira ya Kiebrania na kueleza kwa kawaida kwamba kinachokusudiwa ni neno lililosemwa.
- source_word: אֲשַׁנֶּה
  choice: sitabadilisha
  rationale: Piel ya שנה ina maana ya kubadili. Kiswahili ‘sitabadilisha’ kinafaa kwa neno au ahadi iliyotamkwa.
- source_word: לֹא ... לֹא
  choice: Sita... wala sita...
  rationale: ‘Wala’ huhifadhi ukanushaji wa pili na usambamba wenye msisitizo wa mistari miwili ya Kiebrania.
theological_decisions:
- issue: Lugha ya ahadi na uaminifu wa Mungu
  choice: Kuhifadhi maneno mahsusi kuhusu agano na neno lililotamkwa bila kuyapanua kuwa tamko la kimafundisho kuhusu kutobadilika kwa Mungu.
  alternative: Sitavunja ahadi yangu.
  rationale: Aya inataja hasa agano la Mungu na kile kilichotoka midomoni mwake; tafsiri inahifadhi lugha hiyo halisi badala ya kuingiza hitimisho pana la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Usambamba wa kishairi umehifadhiwa kwa ‘wala,’ na taswira ya midomo imebakizwa.
