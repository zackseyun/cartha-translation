- from: Sitalinajisi agano langu,[a] wala sitabadilisha neno lililotoka midomoni mwangu.[b]
  to: Sitakiuka agano langu,[a] wala sitabadilisha kile kilichotoka midomoni mwangu.[b]
  rationale: The revision uses the idiomatic covenantal expression “kukiuka agano” for the Hebrew Piel of חלל, while retaining the more literal profanation imagery in a footnote. It preserves the Hebrew parallelism with “wala,” retains the covenant and lips imagery, and avoids both the overly narrow “neno” and the unsuitable alternative “kufuru agano.”
  reviewer_model: gpt-5.6-terra
