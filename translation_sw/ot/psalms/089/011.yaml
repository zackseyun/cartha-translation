  text: לְ/ךָ֣ שָׁ֭מַיִם אַף לְ/ךָ֥ אָ֑רֶץ תֵּבֵ֥ל וּ֝/מְלֹאָ֗/הּ אַתָּ֥ה יְסַדְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/011.yaml
  text: The heavens are yours; the earth also is yours[a]. The world and its fullness—you founded them.
translation:
  language: sw
  text: Mbingu ni zako; dunia pia ni yako. Ulimwengu na vyote vilivyomo ndani yake—wewe ndiwe uliyevitia misingi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְךָ
  choice: ni zako / ni yako
  rationale: Kiambishi cha nafsi ya pili umoja pamoja na לְ huonyesha umiliki; muundo wa Kiswahili wenye ‘ni ... yako/zako’ ni wa moja kwa moja na wa asili.
- source_word: שָׁמַיִם
  choice: mbingu
  rationale: ‘Mbingu’ hudumisha maana ya eneo la juu na hadhi ya kishairi ya neno la Kiebrania.
- source_word: אַף
  choice: pia
  rationale: Hupanua kauli kutoka mbinguni hadi duniani kwa njia ya kawaida katika Kiswahili cha sasa.
- source_word: אָרֶץ
  choice: dunia
  rationale: Katika ulinganifu na mbingu na pamoja na תֵּבֵל, hapa neno lina maana ya kik宇宙 ya dunia, si nchi fulani.
- source_word: תֵּבֵל
  choice: ulimwengu
  rationale: Neno hili humaanisha dunia iliyopangwa au inayokaliwa; ‘ulimwengu’ ni tafsiri ya kawaida na yenye hadhi.
- source_word: מְלֹאָהּ
  choice: vyote vilivyomo ndani yake
  rationale: Kihalisi ni ‘ujazo wake’; usemi huu wa Kiswahili unaeleza kwa uwazi kila kilichomo ulimwenguni bila kuwa mgumu.
- source_word: יְסַדְתָּם
  choice: wewe ndiye uliyeviweka msingi
  rationale: Huhifadhi taswira ya kuweka msingi na wingi wa kiambishi cha yambwa, kinachorejelea ulimwengu na vyote vilivyomo.
theological_decisions:
- issue: Umiliki wa Mungu na lugha ya uumbaji
  choice: Kuthibitisha kwamba mbingu na dunia ni za Mungu na kwamba yeye ndiye aliyeweka msingi wa ulimwengu na vyote vilivyomo.
  alternative: Kupanua mstari uwe tamko la wazi kuhusu uumbaji kutoka kutokuwako, au kuufanya useme tu juu ya utawala.
  rationale: Kiebrania kinathibitisha umiliki na tendo la kuweka msingi; tafsiri haiingizi mfumo wa mafundisho unaozidi yaliyoandikwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi na chenye heshima lakini kinachoeleweka kwa msomaji wa kawaida. Mkazo wa אַתָּה umeonyeshwa kwa ‘wewe ndiye’. Hakuna tanbihi iliyohitajika kwa sababu ‘vyote vilivyomo ndani yake’ huwasilisha מְלֹאָהּ kwa uwazi.
