  text: בָּר֖וּךְ יְהוָ֥ה לְ֝/עוֹלָ֗ם אָ֘מֵ֥ן וְ/אָמֵֽן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/052.yaml
  text: Blessed be Yahweh forever[a]. Amen and amen.
translation:
  language: sw
  text: Yahwe na abarikiwe milele. Amina na amina.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: na abarikiwe
  rationale: Kauli hii ya kiliturujia ina nguvu ya baraka na sifa. “Na abarikiwe” ni ya asili katika Kiswahili na inadumisha umbo la baraka bila kuipanua kuwa “asifiwe.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kwa tahajia ya kawaida ya Kiswahili kama “Yahwe,” badala ya kubadilishwa na cheo.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya kuendelea bila mwisho katika muktadha huu wa sifa.
- source_word: אָמֵן
  choice: Amina
  rationale: “Amina” ni umbo lililozoeleka katika Kiswahili kwa tamko hili la uthibitisho wa kiliturujia.
- source_word: וְאָמֵן
  choice: na amina
  rationale: Kiunganishi na urudiaji vimedumishwa ili kuhifadhi msisitizo wa fomula ya mwisho ya Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina lenyewe la Mungu; kulitaja “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, huku tahajia ikilingana na Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo mfupi, wenye hadhi na wa kiliturujia. Mpangilio “Yahwe na abarikiwe” ni wa asili na unaweka jina la Mungu mbele kama lilivyo katika Kiebrania. Hakuna tanbihi iliyoongezwa kwa sababu ushahidi wa chanzo hauna usomaji mbadala unaohitaji kuelezwa hapa.
