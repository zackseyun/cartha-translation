  text: זַ֭רְע/וֹ לְ/עוֹלָ֣ם יִהְיֶ֑ה וְ/כִסְא֖/וֹ כַ/שֶּׁ֣מֶשׁ נֶגְדִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/036.yaml
  text: His offspring will endure forever[c][b][a], and his throne will be like the sun before me.
translation:
  language: sw
  text: Uzao wake utadumu milele,[a] na kiti chake cha enzi kitakuwa kama jua mbele yangu.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uzao wake utakuwa milele.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika uwepo wangu.” Kiebrania kinasema kihalisi “mbele yangu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “na kiti chake cha enzi kama jua mbele yangu.”
    reason: previous_rendering
lexical_decisions:
- source_word: זַרְעוֹ
  choice: uzao wake
  rationale: Neno זֶרַע linaweza kumaanisha mbegu au uzao. Katika muktadha wa agano la kifalme, “uzao wake” linaeleza vizazi vya nasaba kwa maana ya pamoja bila kuondoa taswira ya neno la Kiebrania.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Hapa עוֹלָם linaonyesha kudumu kwa ahadi ya agano; “milele” ni tafsiri ya kawaida, wazi na yenye hadhi katika Kiswahili.
- source_word: יִהְיֶה
  choice: utadumu
  rationale: Kitenzi hiki kimsingi ni “utakuwa,” lakini “uzao wake utakuwa milele” si usemi wa kawaida sana katika Kiswahili. “Utadumu milele” huwasilisha maana ya kuendelea kuwapo bila kuongeza wazo lisilomo katika muktadha.
- source_word: וְכִסְאוֹ
  choice: na kiti chake cha enzi
  rationale: כִּסֵּא ni kiti cha enzi na kwa muktadha huwakilisha utawala wa kifalme. Taswira halisi imehifadhiwa badala ya kubadilishwa kuwa “ufalme” au “utawala.”
- source_word: כַשֶּׁמֶשׁ
  choice: kama jua
  rationale: Kiambishi כ־ kinaonyesha ulinganisho; “kama jua” huhifadhi tashbihi hiyo kwa Kiswahili cha kawaida.
- source_word: נֶגְדִּי
  choice: mbele yangu
  rationale: Neno hili lina maana ya “mbele yangu” au “katika uwepo wangu.” Tafsiri ya moja kwa moja “mbele yangu” inadumisha usemi wa nafsi ya kwanza wa Mungu na uzito wa agano.
theological_decisions:
- issue: Mrejeo wa msemaji katika kiambishi cha nafsi ya kwanza cha נֶגְדִּי
  choice: Kuhifadhi “mbele yangu” kama maneno ya Mungu mwenyewe
  alternative: katika uwepo wangu
  rationale: Sehemu hii ya zaburi imewekwa kama maneno ya BWANA kuhusu Daudi na uzao wake. Nafsi ya kwanza imehifadhiwa wazi bila kuifafanua kwa maneno ya ziada.
- issue: Kitenzi kilichodokezwa katika kishazi cha pili
  choice: kitakuwa kama jua
  alternative: na kiti chake cha enzi kama jua mbele yangu
  rationale: Kiebrania hakirudii kitenzi katika kishazi cha pili, lakini Kiswahili cha sasa huwa wazi zaidi kitenzi kinapotajwa. “Kitakuwa” kinachukua kitenzi cha msingi יִהְיֶה bila kudai mahsusi kwamba kiti “kitadumu kama jua.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. “Uzao” huhifadhi maana ya pamoja ya nasaba; “kiti cha enzi” huhifadhi taswira ya kifalme. Alama zote za tanbihi zimewekwa katika matini kuu.
