  yaml_path: translation/ot/psalms/089/032.yaml
  text: Then I will punish their transgression with the rod[a], and their iniquity with blows.
translation:
  language: sw
  text: Kisha nitaadhibu uasi wao kwa fimbo[a], na uovu wao kwa mapigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, «nitautembelea uasi wao kwa fimbo ... na uovu wao kwa mapigo.» Kitenzi cha Kiebrania kinaweza kumaanisha «kutembelea» kwa maana ya kushughulikia au kuadhibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: Ndipo nitauadhibu
  rationale: Katika muktadha huu פקד ina maana ya kushughulikia kosa kwa adhabu. «Ndipo» linaonyesha mwendelezo wa sharti la mstari uliotangulia, na «nitauadhibu» ni Kiswahili cha kawaida kinachowasilisha maana ya adhabu bila kuondoa wigo wa kitenzi cha Kiebrania.
- source_word: בְשֵׁבֶט
  choice: kwa fimbo
  rationale: שֵׁבֶט hapa ni chombo cha kuadhibia, si ishara ya utawala; «fimbo» inadumisha taswira halisi ya nidhamu.
- source_word: פִּשְׁעָם
  choice: uasi wao
  rationale: פֶּשַׁע huonyesha kuvunja mipaka kwa makusudi au uasi. «Uasi wao» ni wa asili na wenye uzito wa kimaadili, huku ukitofautiana kwa kiasi na עָוֹן katika mstari sambamba.
- source_word: וּבִנְגָעִים
  choice: na ... kwa mapigo
  rationale: נֶגַע inaweza kuwa pigo, jeraha, tauni, au mateso. Sambamba na «fimbo», «mapigo» yanafaa zaidi kama adhabu iliyotolewa bila kuifanya iwe ugonjwa pekee.
- source_word: עֲוֺנָם
  choice: uovu wao
  rationale: עָוֹן inaweza kumaanisha uovu, hatia, au matokeo yake. «Uovu wao» ni lugha ya sasa, yenye heshima, na inadumisha uzito wa kimaadili pamoja na usambamba wa kishairi.
theological_decisions:
- issue: Asili ya mwitikio wa Mungu kwa dhambi ya walio katika agano
  choice: Mstari unaahidi adhabu halisi ya kinidhamu kwa uasi na uovu.
  alternative: Kutafsiri kwa lugha laini ya kutembelea au kusahihisha tu, au kuongeza kwamba ni kukataliwa kabisa.
  rationale: Taswira za fimbo na mapigo haziruhusu kupunguza ukali wa adhabu. Hata hivyo, tafsiri haiongezi hitimisho kuhusu kukataliwa kabisa; mvutano huo unabaki katika muktadha mpana wa zaburi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na usambamba wa vipashio viwili umehifadhiwa; «fimbo» na «mapigo» ni maneno yanayoeleweka kwa urahisi na yanadumisha taswira ya Kiebrania.
