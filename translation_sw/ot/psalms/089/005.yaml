  text: וְ/י֘וֹד֤וּ שָׁמַ֣יִם פִּלְאֲ/ךָ֣ יְהוָ֑ה אַף אֱ֝מֽוּנָתְ/ךָ֗ בִּ/קְהַ֥ל קְדֹשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/005.yaml
  text: The heavens will praise your wonders[a], O Yahweh—indeed, your faithfulness in the assembly of the holy ones.
translation:
  language: sw
  text: Mbingu zitayasifu maajabu yako, Ee Yahwe; naam, uaminifu wako katika kusanyiko la watakatifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza kurejelea watu au viumbe walio watakatifu; katika muktadha huu, huenda linarejelea viumbe wa mbinguni.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֹודוּ
  choice: zitayasifu
  rationale: Hifili ya ידה hapa ina maana ya kusifu; kiambishi cha wakati ujao kinadumisha hali ya kitenzi cha Kiebrania, huku kiambishi cha yambwa kikirejelea “maajabu.”
- source_word: שָׁמַיִם
  choice: Mbingu
  rationale: “Mbingu” ni namna ya kawaida na yenye hadhi ya kuwasilisha wingi wa Kiebrania katika ushairi wa Biblia.
- source_word: פִּלְאֲךָ
  choice: maajabu yako
  rationale: פלא hueleza mambo ya ajabu au matendo ya kushangaza; “maajabu” inawasilisha vizuri maana yake ya jumla hapa.
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la Mungu limetoholewa kuwa “Yahwe,” nalo limewekwa katika hali ya mwito kama ilivyo katika mstari.
- source_word: אַף
  choice: naam
  rationale: “Naam” linaonyesha mwendelezo wenye msisitizo na linafaa kwa sajili ya kishairi bila kufanya uhusiano wa vishazi kuwa wazi kupita Kiebrania.
- source_word: אֱמוּנָתְךָ
  choice: uaminifu wako
  rationale: אֱמוּנָה hapa hueleza kutegemeka na kutimiza ahadi kwa Mungu.
- source_word: בִּקְהַל
  choice: katika kusanyiko la
  rationale: Tafsiri hii inadumisha picha halisi ya kundi lililokusanyika.
- source_word: קְדֹשִׁים
  choice: watakatifu
  rationale: Neno hili linaweza kurejelea walio watakatifu bila kutaja wazi ikiwa ni wanadamu au viumbe wa mbinguni; muktadha unaelekeza zaidi kwa viumbe wa mbinguni.
theological_decisions:
- issue: Wanaorejelewa na קְדֹשִׁים
  choice: watakatifu, huku utambulisho wao ukiachwa wazi katika matini
  alternative: malaika; au watu watakatifu
  rationale: Muktadha wa mbingu na baraza la mbinguni unaunga mkono uwezekano wa viumbe wa mbinguni, lakini neno la Kiebrania lenyewe halisemi wazi “malaika.” Kwa hiyo tafsiri hailazimishi utambulisho huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki chenye mtindo wa kishairi na wenye hadhi. “Naam” limetumiwa kuhifadhi msisitizo wa kishairi, na “watakatifu” limedumisha utata halisi wa rejeleo.
