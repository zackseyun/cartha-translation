  text: שַׁ֭סֻּ/הוּ כָּל עֹ֣בְרֵי דָ֑רֶךְ הָיָ֥ה חֶ֝רְפָּ֗ה לִ/שְׁכֵנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/041.yaml
  text: All who pass by the way have plundered him[a]; he has become a reproach to his neighbors.
translation:
  language: sw
  text: Wote wanaopita njiani wamempora[a]; amekuwa fedheha kwa majirani zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wapita-njia wote wamemharibu.” Kirai cha Kiebrania kwa tafsiri ya moja kwa moja ni “wote wapitao wa njia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁסֻּהוּ
  choice: wamempora
  rationale: Kitenzi שסה kina maana ya kupora au kuteka nyara. “Wamempora” kinaonyesha tendo lililokamilika la kumnyang’anya kwa uhasama, kwa Kiswahili cha kawaida na chenye nguvu halisi.
- source_word: כָּל
  choice: Wote
  rationale: כָּל hapa ina maana jumuishi pamoja na kishiriki kinachofuata. “Wote” huhifadhi upeo unaowahusu wapita-njia bila ubaguzi.
- source_word: עֹבְרֵי דָרֶךְ
  choice: wapitao njiani
  rationale: Kirai hiki kihalisi ni “wapitao wa njia/barabara.” “Wapitao njiani” ni cha asili katika Kiswahili na huhifadhi picha ya watu wanaopita katika njia.
- source_word: הָיָה
  choice: amekuwa
  rationale: Qatal hapa inaeleza hali ya sasa iliyotokana na fedheha iliyotangulia. “Amekuwa” huwasilisha vizuri matokeo hayo yanayoendelea.
- source_word: חֶרְפָּה
  choice: kitu cha kudharauliwa
  rationale: חֶרְפָּה huonyesha fedheha, shutuma, au hali ya kudharauliwa. Kirai hiki ni cha kawaida na kinaonyesha kwamba amekuwa mlengwa wa dharau.
- source_word: לִשְׁכֵנָיו
  choice: na majirani zake
  rationale: שָׁכֵן ni jirani au mtu anayeishi karibu. Ingawa ל ni kihusishi chenye maana pana, Kiswahili cha asili hueleza uhusiano huu kwa “kudharauliwa na majirani zake.”
theological_decisions:
- issue: Mhusika anayerejelewa na viambishi vya nafsi ya tatu umoja
  choice: Kumrejelea tu kwa kiambishi cha nafsi ya tatu umoja bila kumtaja wazi.
  alternative: Mfalme wa ukoo wa Daudi; mtiwa-mafuta; au watu wanaowakilishwa na mfalme.
  rationale: Muktadha wa karibu unahusu kuanguka kwa mfalme au mtiwa-mafuta wa ukoo wa Daudi, lakini mstari wenyewe una viambishi vya nafsi ya tatu umoja tu. Tafsiri haibainishi mhusika ili kuhifadhi uwazi wenye mipaka na mvutano wa kifasiri wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya zaburi ya maombolezo. Muundo ni wa asili kwa msomaji wa kawaida huku ukihifadhi picha ya njia, tendo la kupora, na hali ya kudharauliwa.
