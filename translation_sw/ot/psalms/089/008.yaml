  text: יְהוָ֤ה אֱלֹ֘הֵ֤י צְבָא֗וֹת מִֽי כָֽמ֖וֹ/ךָ חֲסִ֥ין יָ֑הּ וֶ֝/אֱמֽוּנָתְ/ךָ֗ סְבִיבוֹתֶֽי/ךָ׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/008.yaml
  text: O Yahweh[a], God of hosts, who is mighty like you, O Yah? Your faithfulness surrounds you.
translation:
  language: sw
  text: 'Ee Yahwe, Mungu wa majeshi,

    ni nani aliye na nguvu kama wewe, Ee Yah?[a]

    Uaminifu wako uko pande zote zako.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Yah,” umbo fupi la “Yahwe,” jina la Mungu; tafsiri nyingi hutumia “BWANA” hapa.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kama “Yahwe”; “Ee” linaonyesha kwamba mtunga zaburi anamwita moja kwa moja.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Mungu wa majeshi
  rationale: Muundo huu una maana pana ya Mungu wa majeshi au vikosi; tafsiri haibainishi bila msingi kama ni ya duniani au ya mbinguni.
- source_word: מִי כָמוֹךָ
  choice: ni nani ... kama wewe
  rationale: Huhifadhi swali la balagha linalosisitiza kwamba hakuna anayelingana na Mungu.
- source_word: חֲסִין
  choice: aliye hodari
  rationale: “Hodari” huwasilisha nguvu na uwezo kwa Kiswahili cha kishairi lakini kinachoeleweka kwa urahisi.
- source_word: יָהּ
  choice: Ee Yah
  rationale: Umbo fupi la jina la Mungu linahifadhiwa likiwa tofauti na יְהוָה iliyotumiwa mwanzoni mwa mstari.
- source_word: וֶאֱמוּנָתְךָ
  choice: Uaminifu wako
  rationale: אֱמוּנָה hapa ni sifa ya kutegemeka na kuwa mwaminifu; sentensi mpya ya kishairi huwasilisha kiunganishi kwa kawaida bila kulazimisha “na”.
- source_word: סְבִיבוֹתֶיךָ
  choice: unakuzunguka
  rationale: Wingi huu hutumika kwa maana ya mahali, “pande zote zako”; kitenzi hiki huhifadhi picha ya uaminifu uliomzunguka Mungu.
theological_decisions:
- issue: Kutofautisha יְהוָה na umbo fupi יָהּ katika mstari mmoja
  choice: יְהוָה limetafsiriwa “Yahwe,” na יָהּ limetoholewa “Yah.”
  alternative: Kuyatafsiri yote mawili “Bwana,” au kuyatoa yote kama “Yahwe.”
  rationale: Maandishi ya Kiebrania yanatumia maumbo mawili tofauti ya jina la Mungu. Kuyahifadhi kunafuata ushahidi wa chanzo bila kufuta tofauti hiyo.
- issue: Uhusiano wa חֲסִין na יָהּ
  choice: “aliye hodari kama wewe, Ee Yah?”
  alternative: “ni nani kama wewe? Mwenye nguvu ni Yah.”
  rationale: Mpangilio wa kishairi unaunga mkono kusoma חֲסִין kama sifa inayohusishwa na swali la kutolinganishwa, huku יָהּ ikiwa mwito wa moja kwa moja; tafsiri haiongezi kiunganishi kisichokuwapo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini cha sasa na kinachoeleweka. Mistari mitatu inadumisha usambamba wa zaburi; “Ee” hutumiwa kwa mwito wa moja kwa moja, na alama [a] imewekwa baada ya “Yah.”
