- from: Kama wakizinajisi sheria zangu na kutoshika amri zangu,[a]
  to: Kama wakiyavunjia heshima maagizo yangu, na wasipozishika amri zangu,[a]
  rationale: The revision replaces an unnatural literal collocation with an idiomatic Swahili expression that communicates the Hebrew verb’s force of profaning or dishonoring God’s ordinances. It also makes the parallel conditional clauses more natural, while retaining the source’s conditional ambiguity and legal-covenantal register.
  reviewer_model: gpt-5.6-terra
