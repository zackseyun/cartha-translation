review_pass:
  verdict: revise
  source_fidelity: The draft preserves the conditional structure, the two possessive first-person objects, and the parallel between statutes and commandments. Its rendering of חלל as “kunajisi” attempts to retain the verb’s stronger sense of profanation.
  naturalness: '“Kama wakizinajisi sheria zangu” is understandable but is not idiomatic modern Standard East African Swahili: sheria are not naturally said to be ‘defiled.’ “Kuyavunjia heshima maagizo yangu” naturally expresses treating God’s prescribed ordinances with contempt and retains the heightened force beyond mere non-observance. “Wasipozishika” also gives the second parallel verb a fully natural conditional form.'
  terminology: “Maagizo” suitably renders חֻקּוֹת as prescribed ordinances and remains distinct from “amri” for מִצְוֺת. “Kuvunjia heshima” is an appropriate contextual rendering of חלל here; the footnote retains ‘kuyavunja’ as a less forceful alternative.
  issues:
  - severity: medium
    issue: “wakizinajisi sheria zangu” is lexically and collocationally unnatural in Swahili.
    rationale: Kunajisi normally takes persons, bodies, places, or sacred things; with sheria it sounds literalistic and unclear. The Hebrew verb’s contempt/profanation sense can be conveyed naturally as treating the ordinances disrespectfully.
  - severity: low
    issue: The second predicate is less parallel than the Hebrew.
    rationale: Changing “na kutoshika amri zangu” to “na wasipozishika amri zangu” gives a coordinated conditional verbal clause and preserves the plural object reference explicitly.
  revised_text: Kama wakiyavunjia heshima maagizo yangu, na wasipozishika amri zangu,[a]
  revised_footnotes:
  - marker: a
    text: Au, “wakiyavunja maagizo yangu.” Kitenzi cha Kiebrania kinaweza kumaanisha kuvunjia heshima, kunajisi, au kutendea kama kitu cha kawaida; “wakiyavunjia heshima” huhifadhi maana yake yenye nguvu zaidi.
    reason: lexical_alternative
  revision_rationale: The revision replaces an unnatural literal collocation with an idiomatic Swahili expression that communicates the Hebrew verb’s force of profaning or dishonoring God’s ordinances. It also makes the parallel conditional clauses more natural, while retaining the source’s conditional ambiguity and legal-covenantal register.
