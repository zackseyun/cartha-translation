  text: אִם חֻקֹּתַ֥/י יְחַלֵּ֑לוּ וּ֝/מִצְוֺתַ֗/י לֹ֣א יִשְׁמֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/031.yaml
  text: If they profane my statutes and do not keep my commandments,[a]
translation:
  language: sw
  text: Kama wakiyavunjia heshima maagizo yangu, na wasipozishika amri zangu,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakiyavunja maagizo yangu.” Kitenzi cha Kiebrania kinaweza kumaanisha kuvunjia heshima, kunajisi, au kutendea kama kitu cha kawaida; “wakiyavunjia heshima” huhifadhi maana yake yenye nguvu zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kama
  rationale: Huanzisha sharti moja kwa moja; “kama” huhifadhi maana hiyo bila kuifanya kuwa tukio la hakika la wakati ujao.
- source_word: חֻקֹּתַי
  choice: sheria zangu
  rationale: Neno hili humaanisha masharti au sheria zilizowekwa. “Sheria zangu” ni ya kawaida na inaeleweka, huku ikitofautishwa na “amri zangu” katika mstari sambamba.
- source_word: יְחַלֵּלוּ
  choice: wakizinajisi
  rationale: Kauli ya piel ya חלל ina nguvu ya kunajisi, kuvunjia heshima, au kufanya kisicho kitakatifu. “Kuzinajisi” huhifadhi uzito huo kuliko “kuzivunja” pekee.
- source_word: וּמִצְוֺתַי
  choice: na ... amri zangu
  rationale: מִצְוָה katika muktadha wa agano na sheria ni “amri”; uchaguzi huu ni wa kawaida, wenye hadhi, na huhifadhi ulinganifu na “sheria.”
- source_word: לֹא יִשְׁמֹרוּ
  choice: kutoshika
  rationale: שׁמר kuhusu amri humaanisha kuzishika au kuzitii. Muundo huu unaunganisha kwa asili kitendo cha pili na sharti lililoanzishwa na “kama.”
theological_decisions:
- issue: Uzito wa lugha ya kuvunja agano katika חלל inapohusishwa na sheria za Mungu
  choice: wakizinajisi sheria zangu
  alternative: wakizivunja sheria zangu
  rationale: “Kuzinajisi” hudumisha wazo la kuvunjia heshima au kutendea kama kitu kisicho kitakatifu, bila kuongeza fundisho lisilokuwamo katika Kiebrania. “Kuzivunja” ni mbadala wa kimuktadha lakini ni dhaifu zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kisharti na ulinganifu wa kishairi umehifadhiwa; msamiati wa kisheria umewekwa wazi kwa msomaji wa kawaida.
