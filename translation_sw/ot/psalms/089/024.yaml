  text: And my faithfulness and my steadfast love will be with him[a], and in my name his horn will be exalted.
translation:
  language: sw
  text: Na uaminifu wangu na upendo wangu thabiti vitakuwa pamoja naye, na kwa jina langu pembe yake[a] itainuliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pembe” ni taswira ya Kiebrania inayowakilisha nguvu, heshima, au mamlaka ya kifalme.
    reason: cultural_note
lexical_decisions:
- source_word: אֱמוּנָתִי
  choice: uaminifu wangu
  rationale: Katika muktadha huu neno hilo linaonyesha kutegemeka na uaminifu wa Mungu, si tendo la kuamini.
- source_word: חַסְדִּי
  choice: upendo wangu thabiti
  rationale: Usemi huu unaonyesha upendo wa Mungu wenye ushikamanifu na kudumu katika uhusiano wa agano.
- source_word: עִמּוֹ
  choice: pamoja naye
  rationale: Hutoa kwa kawaida maana ya kuwapo pamoja naye na kumtegemeza.
- source_word: בִשְׁמִי
  choice: kwa jina langu
  rationale: Kihusishi kinaweza kuwa ‘katika’ au ‘kwa’; ‘kwa jina langu’ ni Kiswahili cha kawaida kinachoonyesha kwamba kuinuliwa huko kunatokana na mamlaka na uwezo wa Mungu bila kufafanua zaidi ya Kiebrania.
- source_word: תָּרוּם
  choice: itainuliwa
  rationale: Huhifadhi maana ya kuwa juu au kuinuliwa na kuendeleza taswira halisi ya pembe.
- source_word: קַרְנוֹ
  choice: pembe yake
  rationale: Taswira ya Kiebrania imehifadhiwa badala ya kubadilishwa moja kwa moja kuwa ‘nguvu’ au ‘mamlaka’.
theological_decisions:
- issue: Kuhifadhi sitiari ya kifalme ya pembe
  choice: pembe yake itainuliwa
  alternative: nguvu zake zitatukuzwa
  rationale: Kuhifadhi ‘pembe’ kunadumisha ushairi na taswira ya nguvu, heshima, au mamlaka ya kifalme iliyomo katika zaburi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa viambishi ‘vitakuwa’ unafuata kiima ambatano cha ‘uaminifu’ na ‘upendo’; sitiari ya pembe imehifadhiwa na kufafanuliwa katika tanbihi.
