  text: הֲ֭רִימוֹתָ יְמִ֣ין צָרָ֑י/ו הִ֝שְׂמַ֗חְתָּ כָּל אוֹיְבָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/042.yaml
  text: You have exalted the right hand of his foes[a]; you have made all his enemies rejoice.
translation:
  language: sw
  text: Umeuinua mkono wa kuume wa wapinzani wake[a]; umewafanya adui zake wote wafurahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Umeutukuza mkono wa kuume wa wapinzani wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרִימוֹתָ
  choice: umeuinua
  rationale: Hifili timilifu nafsi ya pili umoja ya רום ina maana ya kusababisha kitu kiinuke au kitukuzwe. Pamoja na ‘mkono wa kuume,’ ‘umeuinua’ huhifadhi picha ya Kiebrania na pia hudokeza kuwapa nguvu au ushindi.
- source_word: יְמִין
  choice: mkono wa kuume
  rationale: Nomino hii kwa kawaida humaanisha mkono wa kuume na mara nyingi ni ishara ya nguvu au uwezo; nahau ya chanzo imehifadhiwa.
- source_word: צָרָיו
  choice: watesi wake
  rationale: Neno צר/צרר humaanisha wapinzani wenye uhasama. ‘Watesi wake’ ni la kawaida na hutofautisha neno hili na אוֹיְבָיו katika kishazi cha pili bila kudai tofauti kubwa kupita kiasi.
- source_word: הִשְׂמַחְתָּ
  choice: umewafanya ... wafurahi
  rationale: Hifili ya שׂמח ina nguvu ya kusababisha; tafsiri hii inaonyesha wazi kwamba Mungu ndiye aliyesababisha furaha yao.
- source_word: כָּל
  choice: wote
  rationale: Pamoja na nomino ya wingi ‘adui zake,’ ‘wote’ huwasilisha kwa kawaida maana ya jumla ya כָּל.
- source_word: אוֹיְבָיו
  choice: adui zake
  rationale: Hili ni neno la kawaida kwa maadui, hivyo ‘adui zake’ ni tafsiri ya moja kwa moja na ya asili katika Kiswahili.
theological_decisions:
- issue: Rejeo la viambishi vya nafsi ya tatu, umoja wa kiume
  choice: Vimetafsiriwa ‘wake/zake,’ vikimrejelea mfalme mtiwa-mafuta wa ukoo wa Daudi katika muktadha wa karibu.
  alternative: Kutafsiri kwa njia ya jumla isiyobainisha rejeo.
  rationale: Viambishi katika vishazi vyote viwili ni vya nafsi ya tatu, umoja wa kiume. Katika Zaburi 89, ombolezo linahusu hali inayoonekana kuwa kinyume cha ahadi za Mungu kwa mfalme mtiwa-mafuta wa Daudi. ‘Wake/zake’ huhifadhi sarufi bila kuingiza ufafanuzi zaidi wa kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unahifadhi picha ya ‘mkono wa kuume’ huku ukitumia maneno yanayoeleweka kwa wasomaji wa kawaida.
