  text: כְּ֭/יָרֵחַ יִכּ֣וֹן עוֹלָ֑ם וְ/עֵ֥ד בַּ֝/שַּׁ֗חַק נֶאֱמָ֥ן סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/037.yaml
  text: Like the moon[a], it will be established forever, and the witness in the sky is faithful[b]. Selah
translation:
  language: sw
  text: Kama mwezi, kitakuwa imara milele; na shahidi aliye angani ni mwaminifu.[a] Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda “shahidi aliye angani” ni mwezi, unaotumika kama shahidi wa kutegemeka wa kudumu kwa agano; hata hivyo, Kiebrania hakimtambulishi wazi.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּיָרֵחַ
  choice: Kama mwezi
  rationale: Kiambishi כְּ־ kinaonyesha ulinganisho, na יָרֵחַ ni “mwezi.” “Kama mwezi” ni usemi wa kawaida wa Kiswahili unaohifadhi tashbihi.
- source_word: יִכּוֹן
  choice: kitakuwa imara
  rationale: Kitenzi cha Nifali kutoka כון kina maana ya kuwekwa imara au kuwa thabiti. Kiambishi “ki-” kinarejelea kiti cha enzi kilichotajwa katika muktadha uliotangulia bila kukitaja upya ndani ya mstari huu.
- source_word: עוֹלָם
  choice: milele
  rationale: Katika muktadha wa kishairi wa agano, neno hili linaonyesha kudumu bila mwisho; “milele” ni la asili na lenye uzito unaofaa.
- source_word: וְעֵד
  choice: na shahidi
  rationale: עֵד humaanisha shahidi. Kutotumia kibainishi maalumu kunadumisha kutotajwa wazi kwa utambulisho wa shahidi huyo katika Kiebrania.
- source_word: בַּשַּׁחַק
  choice: aliye angani
  rationale: שַׁחַק katika ushairi inaweza kumaanisha anga, mawingu, au mbingu. “Angani” ni ya asili katika Kiswahili na haibani maana kuwa mawingu pekee.
- source_word: נֶאֱמָן
  choice: ni mwaminifu
  rationale: Neno hili huonyesha uaminifu, uthabiti, na kutegemeka; “mwaminifu” huhifadhi pia mwangwi wa lugha ya agano.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya neno hili la kimuziki au kiliturujia haijulikani kwa hakika, hivyo limetoholewa badala ya kutafsiriwa kwa kubahatisha.
theological_decisions:
- issue: Mhusika asiyeelezwa wazi wa יִכּוֹן
  choice: Kiambishi “ki-” kinarejelea kiti cha enzi katika muktadha uliotangulia bila kukitaja tena.
  alternative: Kutaja wazi “kiti chake cha enzi” au kuchagua uzao wa Daudi kuwa mhusika.
  rationale: Kiebrania hakitaji mhusika kwa jina katika mstari huu, bali humtegemea msomaji kuupata kutoka muktadha. Marejeo ya kisarufi yanahifadhi ufupi huo bila kuongeza ufafanuzi wa kimafundisho.
- issue: Utambulisho wa shahidi aliye angani
  choice: Shahidi hajaainishwa katika maandishi makuu.
  alternative: Kumtambulisha moja kwa moja kuwa mwezi, upinde wa mvua, au ishara nyingine ya mbinguni.
  rationale: Kiebrania hakisemi wazi shahidi huyo ni nani. Tanbihi inataja uwezekano unaokubalika sana bila kuondoa utata wa asili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Nusu-koloni inadumisha uwiano wa vipashio viwili vya mstari, na “Sela” limehifadhiwa kama istilahi ya Zaburi.
