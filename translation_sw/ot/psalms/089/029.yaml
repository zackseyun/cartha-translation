base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/029.yaml
  text: I will establish his offspring forever[a], and his throne as the days of heaven.
translation:
  language: sw
  text: Nitaudumisha uzao wake milele, na kiti chake cha enzi kitadumu kama siku za mbingu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kawaida zaidi, “maadamu mbingu zinadumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Nitaudumisha
  rationale: Kitenzi שׂים kimsingi ni ‘kuweka,’ lakini katika ahadi hii ya agano kina maana ya kufanya uzao uendelee na kuwa imara; ‘nitaudumisha’ ni Kiswahili cha kawaida kinachoonyesha mwendelezo huo.
- source_word: לָעַד
  choice: milele
  rationale: לָעַד huonyesha kudumu bila mwisho; ‘milele’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: זַרְעוֹ
  choice: uzao wake
  rationale: זֶרַע ni nomino ya pamoja inayoweza kumaanisha uzao au wazao. ‘Uzao wake’ huhifadhi maana ya pamoja na mwangwi wa lugha ya agano.
- source_word: וְכִסְאוֹ
  choice: na kiti chake cha enzi
  rationale: כִּסֵּא hapa ni kiti cha enzi, ishara ya utawala wa kifalme.
- source_word: כִּימֵי
  choice: kama siku za
  rationale: Kiambishi כְּ kinaonyesha ulinganisho, na יְמֵי ni ‘siku za.’ Muundo huu unahifadhi taswira ya kishairi ya Kiebrania.
- source_word: שָׁמָיִם
  choice: mbingu
  rationale: שָׁמַיִם kwa kawaida humaanisha mbingu; ‘mbingu’ ni neno la asili na la kawaida katika Kiswahili.
theological_decisions:
- issue: Lugha ya muda katika ahadi ya agano la Daudi
  choice: 'Kuhifadhi maneno yenye nguvu ya kudumu: ‘milele’ na ‘kama siku za mbingu.’'
  alternative: 'Kutafsiri kwa ufafanuzi: ‘kwa vizazi vyote’ au ‘maadamu mbingu zinadumu.’'
  rationale: Mstari unatoa ahadi ya kishairi ya kudumu. Tafsiri haiififishi wala kuifungamanisha na mfumo maalumu wa kifalme au wa nyakati za mwisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kiti cha enzi’ ni wazi zaidi kuliko ‘kiti’ peke yake, na ‘uzao’ huhifadhi maana ya pamoja ya neno la Kiebrania.
