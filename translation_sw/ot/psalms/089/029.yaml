  source_fidelity: Tafsiri inawakilisha kwa usahihi ahadi ya kudumu kuhusu uzao na kiti cha enzi. Hata hivyo, kishazi cha pili katika Kiswahili kinabaki bila kitenzi kinachoeleweka wazi; Kiebrania kinaweza kutumia muundo wa mkato wa kishairi, lakini Kiswahili sanifu kinahitaji kitenzi ili kuwasilisha ulinganisho huo kwa uwazi.
  naturalness: “Nitaudumisha uzao wake milele” ni ya kawaida na yenye hadhi inayofaa. Kuongeza “kitadumu” katika kishazi cha pili hufanya sentensi iwe kamili na ya asili katika Kiswahili bila kupunguza taswira ya “siku za mbingu.”
  terminology: “Uzao wake,” “kiti chake cha enzi,” “milele,” na “mbingu” ni istilahi sahihi na za kawaida katika Kiswahili sanifu. Kiashiria cha tanbihi kinapaswa kufungamanishwa na kifungu kinachofafanuliwa, yaani “kama siku za mbingu,” si “milele.”
