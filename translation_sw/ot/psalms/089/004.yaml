  text: עַד ע֭וֹלָם אָכִ֣ין זַרְעֶ֑/ךָ וּ/בָנִ֨יתִי לְ/דֹר וָ/ד֖וֹר כִּסְאֲ/ךָ֣ סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/004.yaml
  text: I will establish your offspring forever[a], and build your throne for generation after generation[b]. Selah
translation:
  language: sw
  text: Nitauimarisha uzao wako milele[a], na nitakijenga kiti chako cha enzi kwa kizazi baada ya kizazi. Sela[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbegu yako”; neno la Kiebrania liko katika umoja lakini linaweza kumaanisha wazao kwa pamoja.
    reason: lexical_alternative
  - marker: b
    text: “Sela” huenda ni alama ya kimuziki au ya ibada; maana yake kamili haijulikani.
    reason: cultural_note
lexical_decisions:
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Kirai hiki kinaonyesha kudumu bila mwisho; “milele” ni Kiswahili cha kawaida na chenye hadhi kinachohifadhi maana ya ahadi ya kudumu.
- source_word: אָכִין
  choice: Nitauimarisha
  rationale: Hifili ya כון humaanisha kufanya imara au kuthibitisha. “Nitauimarisha” inafaa kwa uzao wa kifalme na kuhifadhi wazo la kuufanya udumu kwa uthabiti.
- source_word: זַרְעֶךָ
  choice: uzao wako
  rationale: זֶרַע ni nomino ya umoja inayoweza kurejelea kwa pamoja watoto na vizazi vya mtu. “Uzao wako” ni ya asili katika Kiswahili na huhifadhi maana hiyo ya pamoja na muktadha wa agano.
- source_word: וּבָנִיתִי
  choice: na kukijenga
  rationale: Ingawa umbo la kitenzi ni timilifu, ushairi wake unaendelea na ahadi ya wakati ujao katika mstari wa kwanza. “Kukijenga” hutegemea “Nitauimarisha” na kuhifadhi taswira halisi ya kujenga.
- source_word: לְדֹר וָדֹר
  choice: kizazi baada ya kizazi
  rationale: Usemi huu unaonyesha mwendelezo katika vizazi vinavyofuatana; tafsiri hii ni ya kawaida na huhifadhi nguvu yake ya kurudiwa.
- source_word: כִּסְאֲךָ
  choice: kiti chako cha enzi
  rationale: Katika muktadha wa kifalme, כִּסֵּא humaanisha kiti cha enzi na, kwa upana, utawala wa kifalme. Usemi huu unaeleweka wazi kuliko “kiti” peke yake.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya neno hili haijulikani; kulinakili kwa herufi za Kiswahili huepuka kulipa maana ya uhakika isiyothibitishwa.
theological_decisions:
- issue: Ahadi ya kifalme kuhusu uzao na kiti cha enzi
  choice: Kuhifadhi usemi wa moja kwa moja “uzao wako” na “kiti chako cha enzi” katika maana yake ya kihistoria ya nasaba ya kifalme.
  alternative: Kufanya utimilifu wa Kimasihi uwe wazi ndani ya mstari, au kuufanya kuwa ahadi ya kawaida tu kuhusu wazao.
  rationale: Kiebrania kinamwambia moja kwa moja mfalme kuhusu uzao na kiti chake cha enzi. Tafsiri haipaswi kuingiza hitimisho la baadaye la kiteolojia ndani ya maneno ya mstari wala kufifisha muktadha wake wa agano la kifalme.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kiti cha enzi” huweka wazi muktadha wa kifalme, huku “uzao” ikihifadhi umoja wa kijumla wa neno la Kiebrania. Alama zote za tanbihi zimewekwa katika matini kuu.
