  yaml_path: translation/ot/psalms/089/013.yaml
  text: Yours is an arm with might[a]; your hand is strong; your right hand is exalted.
translation:
  language: sw
  text: Wewe una mkono wenye nguvu; mkono wako una nguvu; mkono wako wa kuume umetukuka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mkono wako wa kuume umeinuliwa juu.”
    reason: Kitenzi cha Kiebrania kinaweza kumaanisha kuwa juu, kuinuliwa, au kutukuzwa.
lexical_decisions:
- source_word: לְךָ
  choice: Wewe una
  rationale: Muundo wa Kiebrania unaonyesha umilikaji kwa msisitizo. ‘Wewe una’ ni Kiswahili cha kawaida na huhifadhi uwekaji wa Mungu mbele katika mstari.
- source_word: זְרוֹעַ
  choice: mkono
  rationale: Neno hili hasa humaanisha mkono, hasa sehemu yake yenye nguvu, na hapa ni taswira ya uwezo. ‘Mkono’ huhifadhi taswira ya kishairi bila kuibadili kuwa dhana tupu.
- source_word: עִם גְּבוּרָה
  choice: wenye nguvu
  rationale: Kirai hiki kinautambulisha mkono kuwa na uweza au nguvu. ‘Wenye nguvu’ ni cha asili katika Kiswahili na kinaendana na nomino ‘mkono’.
- source_word: תָּעֹז
  choice: una nguvu
  rationale: Kitenzi kina maana ya kuwa hodari au kuwa na nguvu. Tafsiri hii huhifadhi kauli kuhusu mkono wa Mungu bila kuongeza wazo la ushindi lisilotajwa wazi.
- source_word: יָדְךָ
  choice: mkono wako
  rationale: Tafsiri ya moja kwa moja huhifadhi taswira ya Kiebrania ya nguvu inayotenda.
- source_word: תָּרוּם
  choice: umeinuliwa juu
  rationale: Kitenzi רום kinaweza kumaanisha kuwa juu, kuinuliwa, au kutukuzwa. ‘Umeinuliwa juu’ huhifadhi kwa kiasi kikubwa taswira halisi na maana ya hadhi iliyoinuka.
- source_word: יְמִינֶךָ
  choice: mkono wako wa kuume
  rationale: Tafsiri halisi huhifadhi ulinganifu wa kishairi na taswira ya kibiblia ya upande wa kuume unaohusishwa na nguvu.
theological_decisions:
- issue: Lugha ya kumweleza Mungu kwa viungo vya mwili
  choice: Kuhifadhi taswira za ‘mkono’ na ‘mkono wa kuume’ katika matini kuu.
  alternative: Kubadili taswira hizo kuwa maneno ya moja kwa moja kama ‘uweza’ au ‘nguvu’.
  rationale: Kiebrania kinatumia lugha ya kishairi kuhusu mwili kuonyesha nguvu ya Mungu. Kuihifadhi hulinda ushairi na haidai kwamba Mungu ana mwili wa kibinadamu.
- issue: Maana ya תָּרוּם
  choice: umeinuliwa juu
  alternative: umetukuka
  rationale: Kitenzi kinaweza kueleza kuinuliwa kimahali au kutukuzwa. Matini kuu inadumisha taswira ya kuinuliwa, huku tanbihi ikionyesha uwezekano wa maana ya kutukuka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya ‘mkono’ yamehifadhiwa ili kudumisha ulinganifu na taswira ya Kiebrania.
