base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/010.yaml
  text: You crushed Rahab like one slain[a]; with your mighty arm you scattered your enemies.
translation:
  language: sw
  text: Ulimponda Rahabu kama mtu aliyeuawa[a]; kwa mkono wako wenye nguvu uliwatawanya adui zako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rahabu ni jina la kishairi linaloweza kumaanisha Misri au kiumbe au nguvu ya machafuko iliyoshindwa na Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: דִכִּאתָ
  choice: ulimponda
  rationale: Kitenzi kinaonyesha kuvunja au kuponda kwa nguvu. “Ulimponda” ni cha moja kwa moja, chenye picha hai, na kinafaa kwa muktadha wa ushindi.
- source_word: כֶחָלָל
  choice: kama aliyeuawa
  rationale: Kiambishi כֶ kinaonyesha ulinganisho, na חָלָל humaanisha mtu aliyechomwa au kuuawa, hasa vitani. Tafsiri hii inadumisha tashbihi bila kuongeza maelezo yasiyokuwamo.
- source_word: רָהַב
  choice: Rahabu
  rationale: Jina la kishairi limehifadhiwa ili kutotatua mapema ikiwa linamaanisha Misri au kiumbe/nguvu ya machafuko. Umbo “Rahabu” linafuata namna majina ya Kiebrania yanavyotoholewa kwa Kiswahili.
- source_word: בִּזְרוֹעַ עֻזְּךָ
  choice: kwa mkono wako wenye nguvu
  rationale: Kirai hiki kinaonyesha chombo cha kutenda na picha ya kibinadamu ya nguvu za Mungu. “Mkono” ni Kiswahili cha kawaida katika usemi huu na hueleweka kwa urahisi.
- source_word: פִּזַּרְתָּ
  choice: uliwatawanya
  rationale: Kitenzi humaanisha kutawanya au kusambaza. “Uliwatawanya” kinadumisha maana ya moja kwa moja bila kuongeza dhana mahsusi ya kuwafukuza vitani.
- source_word: אוֹיְבֶיךָ
  choice: adui zako
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya nomino ya wingi yenye umilikaji.
theological_decisions:
- issue: Utambulisho wa רָהַב katika muktadha wa kishairi
  choice: Kuhifadhi “Rahabu” katika matini kuu kama jina la kishairi la adui aliyeshindwa.
  alternative: Kutafsiri “Misri,” au kueleza moja kwa moja kuwa ni kiumbe/nguvu ya machafuko.
  rationale: רָהַב linaweza kutumiwa kishairi kuhusu Misri na pia kuibua picha ya kiumbe au nguvu ya machafuko. Kulihifadhi kama jina kunadumisha utata halisi na mvutano wa kishairi na kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio unabaki wazi na rahisi kwa msomaji wa kawaida huku ukihifadhi taswira ya nguvu na utata wa jina Rahabu.
