lexical_decisions:
- source_word: אַחַת
  choice: Mara moja
  rationale: Katika muktadha wa kiapo, neno hili linatumika kielezi kumaanisha kiapo kimoja cha uamuzi; ‘Mara moja’ ni Kiswahili cha kawaida, huku uwezekano wa ‘mara moja tu’ ukionyeshwa katika tanbihi.
- source_word: נִשְׁבַּעְתִּי
  choice: nimeapa
  rationale: Kauli timilifu inaonyesha tendo la kuapa lililokwisha kutokea na ambalo nguvu yake bado inadumu.
- source_word: בְקָדְשִׁי
  choice: kwa utakatifu wangu
  rationale: Kiambishi בְּ hapa kinaonyesha msingi au dhamana inayoitishwa katika kiapo; Mungu anaapa kwa utakatifu wake mwenyewe.
- source_word: אִם
  choice: Sitـ
  rationale: Baada ya kiapo, אִם huanzisha fomula ya kiapo yenye laana iliyodokezwa; maana yake hapa ni kukanusha kwa nguvu, si kuacha sentensi ya masharti isiyokamilika.
- source_word: לְדָוִד
  choice: Daudi
  rationale: Katika Kiswahili, mtendewa wa kitenzi ‘danganya’ huonyeshwa kimaumbo kwa kiambishi cha yambwa ‘-m-’, hivyo maana ya לְ (‘kwa Daudi’) imo ndani ya ‘Sitamdanganya Daudi’.
- source_word: אֲכַזֵּב
  choice: danganya
  rationale: Piel ya כזב hapa inaweza kumaanisha kusema uongo au kutokuwa mwaminifu kuhusu ahadi. ‘Kumdanganya Daudi’ ni usemi wa asili unaohifadhi nguvu ya binafsi ya kauli hiyo.
theological_decisions:
- issue: Kuwasilisha fomula ya kiapo cha Mungu bila kuongeza maana isiyosemwa wazi
  choice: Sitamdanganya Daudi
  alternative: ikiwa nitamdanganya Daudi
  rationale: Kiebrania kina אִם katika fomula ya kiapo yenye adhabu au laana iliyofichwa. Kukanusha moja kwa moja kunatoa maana inayokusudiwa kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi umbo halisi na mvutano wake.
- issue: Kitu ambacho Mungu anaapa nacho
  choice: kwa utakatifu wangu
  alternative: kwa patakatifu pangu
  rationale: Katika muktadha huu קָדְשִׁי inaeleweka vizuri zaidi kuwa sifa ya Mungu ya utakatifu, inayotumika kama dhamana ya kiapo, badala ya mahali patakatifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Nimeapa’ huonyesha kiapo kilichotolewa ambacho bado kina nguvu; mpangilio wa tanbihi umewekwa kwenye maneno yanayohusika moja kwa moja.
