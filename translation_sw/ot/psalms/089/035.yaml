  text: 'Nimeapa mara moja[b] kwa utakatifu wangu: Sitamwambia Daudi uongo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa maneno halisi, “ikiwa nitamwambia Daudi uongo”; hii ni fomula ya kiapo yenye maana ya “hakika sitamwambia Daudi uongo” au “hakika sitakuwa mwongo kwa Daudi.”
    reason: lexical_alternative
  - marker: b
