  text: עַד מָ֣ה יְ֭הוָה תִּסָּתֵ֣ר לָ/נֶ֑צַח תִּבְעַ֖ר כְּמוֹ אֵ֣שׁ חֲמָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/046.yaml
  text: How long[a], O Yahweh? Will you hide yourself forever? Will your wrath burn like fire?
translation:
  language: sw
  text: Mpaka lini, ee Yahwe[a]? Je, utajificha milele? Je, ghadhabu yako itawaka kama moto?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa desturi limetafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: עַד מָה
  choice: Mpaka lini
  rationale: Ni usemi wa kawaida wa maombolezo unaouliza muda wa dhiki kwa msisitizo na uharaka.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uandishi wa Kiswahili wa jina la Mungu YHWH, badala ya kulibadilisha kuwa cheo.
- source_word: תִּסָּתֵר
  choice: utajificha
  rationale: Nifali ya סתר hapa inaeleza Mungu kujificha au kuonekana kana kwamba amejificha; kauli hii ni ya asili katika Kiswahili.
- source_word: לָנֶצַח
  choice: milele
  rationale: Neno hili linaonyesha muda usio na mwisho na linahifadhi ukali wa swali la mwombolezaji.
- source_word: תִּבְעַר
  choice: itawaka
  rationale: Kitenzi kinamaanisha kuwaka; umoja wake unaafikiana na 'ghadhabu' katika tafsiri na kuhifadhi mfano wa moto.
- source_word: כְּמוֹ אֵשׁ
  choice: kama moto
  rationale: Hii ni tashbihi ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: חֲמָתֶךָ
  choice: ghadhabu yako
  rationale: '''Ghadhabu'' huwasilisha hasira kali kwa lugha yenye hadhi inayofaa zaburi bila kuongeza wazo la kuangamiza.'
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu YHWH
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linamwita Mungu wa Israeli moja kwa moja kwa jina lake la agano; 'Yahwe' hulihifadhi kama jina binafsi badala ya kuweka cheo.
- issue: Swali kuhusu Mungu kujificha
  choice: Je, utajificha milele?
  alternative: Je, utaendelea kuwa mafichoni milele?
  rationale: Tafsiri hii huhifadhi lugha ya ujasiri ya maombolezo bila kuamua ikiwa kujificha huko ni halisi au ni jinsi mwombolezaji anavyohisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Maswali matatu mafupi yanahifadhi mdundo wa haraka wa maombolezo ya Kiebrania; 'Je' imetumiwa katika maswali mawili ya ndiyo-au-hapana ili sentensi ziwe wazi na za kawaida.
