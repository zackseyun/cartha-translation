source:
  edition: WLC
  text: מִ֤י גֶ֣בֶר יִֽ֭חְיֶה וְ/לֹ֣א יִרְאֶה מָּ֑וֶת יְמַלֵּ֨ט נַפְשׁ֖/וֹ מִ/יַּד שְׁא֣וֹל סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/048.yaml
  text: What man can live and not see death? Can he deliver his soul from the hand of Sheol? Selah[a][b][c]
translation:
  language: sw
  text: Ni mwanamume gani anayeweza kuishi bila kuona mauti?[a] Je, anaweza kuiokoa nafsi yake[b] kutoka mkononi mwa Sheoli?[c] Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bila kupatwa na mauti.” Kwa neno halisi, “bila kuona mauti.”
    reason: lexical_alternative
  - marker: b
    text: Au, “uhai wake” au “yeye mwenyewe.”
    reason: lexical_alternative
  - marker: c
    text: Sheoli ni neno la Kiebrania linalotaja ulimwengu wa wafu; au, “kaburi.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִי גֶבֶר
  choice: Ni mwanamume gani
  rationale: Muundo huu unaanzisha swali la balagha. ‘Mwanamume’ huakisi nomino ya Kiebrania גֶבֶר, huku swali likiwakilisha hali ya wanadamu kwa ujumla.
- source_word: יִחְיֶה
  choice: anayeweza kuishi
  rationale: Katika swali hili la balagha, hali ya kitenzi inaonyesha uwezekano; ‘anayeweza kuishi’ ni ya asili katika Kiswahili kuliko wakati ujao wa moja kwa moja.
- source_word: וְלֹא יִרְאֶה מָוֶת
  choice: bila kuona mauti
  rationale: Inahifadhi taswira halisi ya nahau ya Kiebrania ‘kuona mauti,’ huku ‘bila’ ikiunganisha sentensi kwa Kiswahili cha kawaida.
- source_word: יְמַלֵּט
  choice: anaweza kuiokoa
  rationale: Hali ya kusababisha ya kitenzi ina maana ya kuponya au kuokoa kutoka katika hatari; ‘anaweza’ huendeleza nguvu ya swali la balagha.
- source_word: נַפְשׁוֹ
  choice: nafsi yake
  rationale: ‘Nafsi’ huhifadhi upana wa kishairi wa נֶפֶשׁ, ambalo hapa linaweza pia kumaanisha uhai wake au yeye mwenyewe; maana hizo zimewekwa katika tanbihi.
- source_word: מִיַּד
  choice: kutoka mkononi mwa
  rationale: Tafsiri hii huhifadhi sitiari ya Kiebrania ya ‘mkono’ kama nguvu au mamlaka inayoshikilia.
- source_word: שְׁאוֹל
  choice: Sheoli
  rationale: Utohozi huu huhifadhi dhana ya Kiebrania bila kuifananisha moja kwa moja na jehanamu au kuipunguza kuwa kaburi tu.
- source_word: סֶלָה
  choice: Sela
  rationale: Neno limehifadhiwa kwa utohozi wa kimapokeo kwa kuwa maana na kazi yake kamili hazijulikani kwa uhakika.
theological_decisions:
- issue: Maana ya שְׁאוֹל katika muktadha wa kishairi
  choice: Sheoli
  alternative: ulimwengu wa wafu; kaburi
  rationale: Utohozi unahifadhi dhana ya Kiebrania na mvutano wake wa kitheolojia bila kuingiza maana maalumu ya baadaye kama ‘jehanamu’ wala kuamua kwamba ni kaburi pekee.
- issue: Lugha wakilishi ya kiume katika גֶבֶר
  choice: mwanamume
  alternative: mtu; mwanadamu
  rationale: Nomino ya Kiebrania humaanisha mwanamume na wakati huohuo swali la balagha linahusu hali ya kufa kwa wanadamu wote. Tafsiri kuu huhifadhi jinsia ya neno la chanzo bila kuficha maana yake wakilishi.
- issue: Upeo wa maana ya נַפְשׁוֹ
  choice: nafsi yake
  alternative: uhai wake; yeye mwenyewe
  rationale: ‘Nafsi’ huhifadhi uzito wa kishairi bila kuamua kimyakimya ikiwa mkazo ni uhai wa mtu au mtu mwenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Taswira za ‘kuona mauti’ na ‘mkono wa Sheoli’ zimehifadhiwa, huku tanbihi zikieleza maana mbadala.
