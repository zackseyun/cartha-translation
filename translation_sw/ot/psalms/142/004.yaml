base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/004.yaml
  text: 'Look to the right and see: there is no one who recognizes me[a]; refuge has perished from me[b]; no one seeks my life.'
translation:
  language: sw
  text: 'Tazama upande wa kulia na uone: hakuna anayenitambua; kimbilio limenipotea[a]; hakuna anayejali maisha yangu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “njia yangu ya kutorokea imetoweka.” Neno la Kiebrania linaweza kumaanisha mahali pa kukimbilia au njia ya kutorokea.
    reason: lexical_alternative
  - marker: b
    text: Au “hakuna anayeitafuta nafsi yangu.” Hapa “nafsi” yaelekea kumaanisha maisha yangu au mimi mwenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֵּיט יָמִין וּרְאֵה
  choice: Tazama upande wa kulia, uone
  rationale: Huhifadhi amri mbili zinazosisitizana, pamoja na maana ya mahali ya יָמִין, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: מַכִּיר
  choice: anayenitambua
  rationale: Kitenzi hiki hapa kina maana ya kumtambua au kumkubali mtu, si kujua tu habari zake; muktadha ni wa kuachwa bila msaidizi.
- source_word: אָבַד מָנוֹס מִמֶּנִּי
  choice: kimbilio langu limetoweka
  rationale: מָנוֹס inaweza kuwa kimbilio au njia ya kutorokea. Muundo huu unaeleza kwa kawaida kwamba uwezekano huo haupo tena, huku ukihifadhi uzito wa אָבַד.
- source_word: דּוֹרֵשׁ לְנַפְשִׁי
  choice: anayejali maisha yangu
  rationale: Katika maombolezo haya, דרש pamoja na לְנֶפֶשׁ hueleza kumtafuta mtu kwa kujali hali na uhai wake. Tafsiri ya moja kwa moja 'anayetafuta maisha yangu' ingeweza kueleweka kimakosa kuwa mtu anayetaka kumuua.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika muktadha wa maombolezo
  choice: maisha yangu
  alternative: nafsi yangu
  rationale: Hapa נֶפֶשׁ inaelekea kumaanisha uhai au mtu mwenyewe, wala si lazima sehemu isiyo ya mwili. 'Maisha yangu' huepuka kuingiza mgawanyo wa kiteolojia ambao Kiebrania hakilazimishi.
- issue: Nguvu ya דּוֹרֵשׁ katika kirai דּוֹרֵשׁ לְנַפְשִׁי
  choice: anayejali
  alternative: anayeitafuta
  rationale: Maana ya msingi ya kutafuta au kuulizia katika muktadha huu hubeba wazo la kujishughulisha na hali ya mwombolezaji. 'Anayejali' hutoa maana hiyo kwa Kiswahili wazi bila kugeuza sentensi kuwa tishio dhidi ya maisha yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi fupi na mfuatano wa kishairi vimehifadhiwa; maneno yanayoweza kupotosha katika Kiswahili cha kawaida yamefafanuliwa katika tanbihi.
