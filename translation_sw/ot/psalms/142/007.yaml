    issue: The phrase 'Uitoe nafsi yangu gerezani' does not explicitly render the Hebrew preposition מִן ('out of/from').
    rationale: In Swahili, this wording may be read as a request concerning the soul while it is in prison, rather than a request to bring it out. 'Uitoe nafsi yangu kutoka gerezani' clearly conveys release from confinement.
