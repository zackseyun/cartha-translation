  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: ה֘וֹצִ֤יאָ/ה מִ/מַּסְגֵּ֨ר נַפְשִׁ/י֮ לְ/הוֹד֪וֹת אֶת שְׁ֫מֶ֥/ךָ בִּ֭/י יַכְתִּ֣רוּ צַדִּיקִ֑ים כִּ֖י תִגְמֹ֣ל עָלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/007.yaml
  text: Bring my soul out of prison[a], so that I may give thanks to your name; the righteous will gather around me, for you will deal bountifully with me.
translation:
  language: sw
  text: 'Uitoe nafsi yangu kutoka gerezani,

    ili nilishukuru jina lako;

    wenye haki watakusanyika kunizunguka[a],

    kwa kuwa utanitendea mema.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wenye haki watanizunguka.” Kitenzi cha Kiebrania kinaweza pia kueleweka, kwa maana isiyo ya kawaida zaidi, kuwa “wenye haki watajivika taji kwa sababu yangu” au “watajivunia kwa sababu yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצִיאָה
  choice: Uitoe
  rationale: Kauli ya kusababisha ya kitenzi יצא hapa ni ombi la kusababisha kitu kitoke. “Uitoe” ni ombi la moja kwa moja na la kawaida katika Kiswahili.
- source_word: מִמַּסְגֵּר
  choice: gerezani
  rationale: מַסְגֵּר humaanisha mahali pa kifungo. “Gerezani” ni wazi na haibani picha hiyo iwe shimo maalumu au kifungo cha aina fulani.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: נֶפֶשׁ inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. “Nafsi yangu” inadumisha tamathali ya Kiebrania na kuonyesha kwamba ombi linahusu mtu mzima, si mwili pekee.
- source_word: לְהוֹדוֹת אֶת שְׁמֶךָ
  choice: ili nilishukuru jina lako
  rationale: Kitenzi ידה hapa huonyesha shukrani au sifa, na umbo la kitenzi-jina linaonyesha kusudi. “Kulishukuru jina lako” ni usemi wa kawaida wa kibiblia unaohifadhi dhana ya jina.
- source_word: בִּי יַכְתִּרוּ
  choice: watakusanyika kunizunguka
  rationale: כּתר katika kauli hii inaweza kueleweka kama kuzunguka au kukusanyika kumzunguka mtu. Uamuzi huu unatoa picha ya jumuiya ya wenye haki ikimzunguka mwombaji baada ya kuokolewa, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: צַדִּיקִים
  choice: wenye haki
  rationale: Ni kivumishi kinachotumiwa kama nomino kwa watu wanaotambuliwa kuwa waadilifu; “wenye haki” ni tafsiri ya kawaida na inayoeleweka.
- source_word: כִּי תִגְמֹל עָלָי
  choice: kwa kuwa utanitendea mema
  rationale: גמל pamoja na על inaweza kumaanisha kumtendea mtu kwa namna fulani, na katika muktadha huu tendo hilo ni la manufaa. “Utanitendea mema” ni la kawaida na halilazimishi wazo la malipo yaliyostahili.
theological_decisions:
- issue: Iwapo kifungu cha mwisho kinamaanisha malipo yanayotokana na kustahili
  choice: Mungu atamtendea mwombaji mema
  alternative: Mungu atamlipa mwombaji kulingana na alivyostahili
  rationale: Muktadha ni kilio cha kuomba kuokolewa, na גמל inaweza kueleza kutendewa mema pamoja na wazo la kulipwa. Tafsiri hii inadumisha matarajio ya tendo jema la Mungu bila kuingiza dai kwamba mwombaji amelipata kwa kustahili.
- issue: Maana ya בִּי יַכְתִּרוּ
  choice: Wenye haki watakusanyika kumzunguka mwombaji
  alternative: Wenye haki watajivika taji au watajivunia kwa sababu yake
  rationale: Kitenzi na kihusishi vina utata halisi. Maana ya kuzunguka inafaa vizuri katika muktadha wa jumuiya inayoshiriki shukrani ya aliyeokolewa, lakini maana nyingine haijaondolewa na imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, katika mtindo wa kishairi ulio wazi, wa sasa na wenye heshima. Mpangilio wa mistari unafuata vifungu vya kishairi vya aya. “Nafsi yangu” inadumisha picha ya chanzo, na “utanitendea mema” ni ya kawaida kuliko usemi mzito au usio wa asili wa kuonyesha ukarimu.
