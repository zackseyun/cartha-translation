  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: זָעַ֥קְתִּי אֵלֶ֗י/ךָ יְה֫וָ֥ה אָ֭מַרְתִּי אַתָּ֣ה מַחְסִ֑/י חֶ֝לְקִ֗/י בְּ/אֶ֣רֶץ הַֽ/חַיִּים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/005.yaml
  text: I cried out to you[a], O Yahweh; I said, “You are my refuge, my portion in the land of the living.”
translation:
  language: sw
  text: Nilikulilia, ee Yahwe; nilisema, “Wewe ndiwe kimbilio langu, fungu langu katika nchi ya walio hai.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָעַקְתִּי
  choice: Nilikulilia
  rationale: Kitenzi זעק huonyesha kilio kikali cha kuomba msaada. “Nilikulilia” ni Kiswahili cha kawaida kinachoonyesha kilio kilichoelekezwa kwa Mungu bila kuongeza maneno yasiyokuwamo katika chanzo.
- source_word: אֵלֶיךָ
  choice: -ku- katika “nilikulilia”
  rationale: Kielekeo cha kilio kwa mhusika wa pili kimewasilishwa kiasili kwa kiambishi cha Kiswahili “-ku-” katika kitenzi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa uhawilishaji wa kawaida wa Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: אָמַרְתִּי
  choice: nilisema
  rationale: Wakati uliopita rahisi unafaa kwa mfuatano wa matendo katika mstari huu na hauongezi mkazo usiokuwamo katika kitenzi cha kawaida אמר.
- source_word: אַתָּה
  choice: Wewe ndiwe
  rationale: Kiwakilishi cha Kiebrania kina mkazo; “Wewe ndiwe” huuhifadhi kwa Kiswahili cha kawaida katika sentensi ya utambulisho.
- source_word: מַחְסִי
  choice: kimbilio langu
  rationale: Neno מַחְסֶה hapa humaanisha mahali pa kukimbilia ili kupata usalama; “kimbilio langu” ni tafsiri ya moja kwa moja na ya asili katika Zaburi.
- source_word: חֶלְקִי
  choice: fungu langu
  rationale: “Fungu” huhifadhi maana ya sehemu aliyogawiwa mtu bila kuibana kuwa “urithi,” ambalo lingeongeza ufafanuzi usiolazimishwa na muktadha.
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: katika nchi ya walio hai
  rationale: Huu ni usemi unaoelekeza kwenye ulimwengu wa maisha ya sasa, kinyume na mauti; muundo huu unahifadhi taswira ya Kiebrania na unaeleweka kwa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi יהוה moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya חֶלְקִי inaposemwa kumhusu Mungu
  choice: fungu langu
  alternative: urithi wangu
  rationale: “Fungu langu” huhifadhi upana na mvutano wa sitiari ya Mungu kuwa sehemu aliyogawiwa mwombaji; “urithi wangu” ni tafsiri inayowezekana lakini ingekuwa ya kiufafanuzi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ee” imetumiwa kwa mwito wa moja kwa moja, na mpangilio wa kishairi umehifadhiwa bila kufanya sentensi kuwa ngumu.
