  text: I pour out my complaint before him[b][a]; I declare my distress before him.
translation:
  language: sw
  text: Ninamimina malalamiko yangu mbele zake[a]; ninaiweka wazi dhiki yangu mbele zake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tafakari yangu” au “mawazo yangu,” badala ya “malalamiko yangu.” Katika muktadha huu wa maombolezo, huenda maana ni malalamiko yanayotamkwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “taabu yangu” au “mateso yangu,” badala ya “dhiki yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁפֹּךְ
  choice: Ninamimina
  rationale: Kitenzi hiki huhifadhi taswira ya Kiebrania ya kumwaga yaliyo moyoni kwa uhuru katika sala ya maombolezo.
- source_word: לְפָנָיו
  choice: mbele zake
  rationale: Huwakilisha kihalisi kuwapo mbele ya Mungu na huhifadhi urudiaji wa kishairi katika vipande vyote viwili.
- source_word: שִׂיחִי
  choice: malalamiko yangu
  rationale: Neno linaweza kumaanisha tafakari, mawazo, au malalamiko; katika muktadha huu wa maombolezo unaoambatana na dhiki, malalamiko ndiyo maana inayofaa zaidi bila kuficha uwezekano mwingine.
- source_word: צָרָתִי
  choice: dhiki yangu
  rationale: Dhiki ni neno la kawaida na lenye uzito linaloweza kujumuisha taabu ya ndani na hali ngumu ya nje.
- source_word: אַגִּיד
  choice: ninamweleza
  rationale: Hiphil ya נגד humaanisha kueleza au kujulisha; 'ninamweleza' ni ya asili katika Kiswahili na inaonyesha kumjulisha Mungu hali yake kwa makusudi.
