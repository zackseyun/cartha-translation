  text: בְּ/הִתְעַטֵּ֬ף עָלַ֨/י רוּחִ֗/י וְ/אַתָּה֮ יָדַ֪עְתָּ נְֽתִיבָ֫תִ֥/י בְּ/אֹֽרַח ז֥וּ אֲהַלֵּ֑ךְ טָמְנ֖וּ פַ֣ח לִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/003.yaml
  text: When my spirit grows faint within me[a], you know my path. On the way where I walk[b], they have hidden a trap for me.
translation:
  language: sw
  text: Roho yangu inapozimia ndani yangu[a], wewe unaijua njia yangu. Katika njia ninayotembea, wamenifichia mtego[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Roho yangu inapolemewa ndani yangu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “tanzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/הִתְעַטֵּף
  choice: inapozimia
  rationale: Muundo wenye ב na kitenzi-jina unaanzisha kishazi cha wakati. Kitenzi kinaweza kumaanisha kudhoofika, kuzimia, au kulemewa; “inapozimia” ni lugha ya kawaida na huhifadhi hali ya taabu bila kufafanua kupita kiasi.
- source_word: רוּחִי
  choice: roho yangu
  rationale: רוּחַ hapa ni uhai wa ndani au nafsi ya mwombaji iliyo katika dhiki, si upepo halisi; “roho yangu” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: עָלַי
  choice: ndani yangu
  rationale: Ingawa maana ya msingi ni “juu yangu,” katika nahau hii Kiswahili cha “ndani yangu” huonyesha vizuri kudhoofika kwa hali ya ndani.
- source_word: יָדַעְתָּ
  choice: unaijua
  rationale: Qatal hii ya kishairi inaweza kueleza hali ya sasa. “Unaijua” hudumisha usemi wa moja kwa moja kwa Mungu na ufahamu wake wa sasa.
- source_word: נְתִיבָתִי
  choice: njia yangu
  rationale: Nomino hii humaanisha kijia, njia, au mwendo; “njia yangu” ni fupi, wazi, na huhifadhi sitiari ya mwendo wa maisha.
- source_word: בְּאֹרַח
  choice: katika njia
  rationale: אֹרַח ni njia au kijia. “Katika njia” huhifadhi taswira ya kusafiri na uhusiano wa mahali.
- source_word: זוּ
  choice: ninayotembea
  rationale: זוּ hapa hutenda kama kiwakilishi cha uhusiano kinachounganisha “njia” na tendo la kutembea; kiambishi “-yo-” katika Kiswahili huwasilisha uhusiano huo kwa kawaida.
- source_word: אֲהַלֵּךְ
  choice: ninayotembea
  rationale: הלך hapa huonyesha mwendo unaoendelea. “Ninayotembea” huhifadhi sitiari ya kutembea na ni Kiswahili cha asili.
- source_word: טָמְנוּ
  choice: wamenifichia
  rationale: Kitenzi humaanisha kuficha au kuweka kwa siri. “Wamenifichia” huonyesha kitendo kilichokamilika chenye matokeo ya sasa na kwamba mtego huo umelengwa kwa mwombaji.
- source_word: פַח
  choice: mtego
  rationale: פַח ni mtego au tanzi. “Mtego” ni neno la sasa, wazi, na linaloeleweka kwa wasomaji wengi.
- source_word: לִי
  choice: -ni-…-ia katika “wamenifichia”
  rationale: Kihusishi chenye kiwakilishi kinaonyesha kwamba mtego umewekwa kwa ajili ya au dhidi ya mwombaji; muundo wa kutendea pamoja na yambwa “ni” huwasilisha jambo hilo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Ufahamu wa Mungu kuhusu njia ya mwombaji
  choice: wewe unaijua njia yangu
  alternative: wewe uliijua njia yangu
  rationale: Kauli ya wakati wa sasa huwasilisha qatal ya hali katika ushairi na kusisitiza ufahamu wa Mungu wakati wa dhiki, bila kuongeza dai la kiteolojia lisilomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa kishairi na sitiari za njia na mtego zimehifadhiwa; lugha imewekwa wazi kwa msomaji wa kawaida.
