  text: ק֭וֹלִ/י אֶל יְהוָ֣ה אֶזְעָ֑ק ק֝וֹלִ֗/י אֶל יְהוָ֥ה אֶתְחַנָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/001.yaml
  text: With my voice I cry out to Yahweh[c][b][a]; with my voice I plead to Yahweh for mercy.
translation:
  language: sw
  text: 'Kwa sauti yangu namlilia Yahwe;

    kwa sauti yangu namwomba Yahwe anirehemu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוֹלִי
  choice: kwa sauti yangu
  rationale: Huhifadhi maana halisi ya ‘sauti yangu,’ msisitizo wa kuwekwa mwanzoni, na urudiaji wa kishairi katika mistari yote miwili.
- source_word: אֶל
  choice: Yahwe kama mlengwa wa kilio na ombi
  rationale: Katika Kiswahili, viambishi vya yambwa katika ‘namlilia’ na ‘namwomba’ huonyesha kwa njia ya kawaida kwamba kilio na ombi vinaelekezwa kwa Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uwasilishaji wa kawaida wa Kiswahili wa jina la Mungu lililoandikwa kwa herufi YHWH, badala ya kulibadili kuwa cheo.
- source_word: אֶזְעָק
  choice: namlilia
  rationale: Kitenzi זעק kinaeleza kilio chenye nguvu kinachoelekezwa kwa mtu; ‘namlilia’ ni cha asili katika Kiswahili na kinafaa pamoja na ‘kwa sauti yangu.’
- source_word: אֶתְחַנָּן
  choice: namwomba ... anirehemu
  rationale: Umbo la חנן hapa linaeleza kusihi ili kupata fadhili au rehema. Kauli hii ni wazi na ya kawaida kwa wasomaji wa sasa bila kupunguza uzito wa ombi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, si neno la cheo ‘Bwana’; kwa hiyo ‘Yahwe’ huhifadhi tofauti hiyo.
- issue: Maana ya אֶתְחַנָּן
  choice: namwomba Yahwe anirehemu
  alternative: namsihi Yahwe
  rationale: Tafsiri iliyochaguliwa huonyesha wazi kipengele cha kuomba fadhili au rehema, huku ‘namsihi’ peke yake ikiweza kuacha jambo linaloombwa bila kubainishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Urudiaji wa ‘kwa sauti yangu’ umehifadhiwa kwa sababu ni sehemu muhimu ya msisitizo na usambamba wa kishairi wa Kiebrania.
