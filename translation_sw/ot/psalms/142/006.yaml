  text: הַקְשִׁ֤יבָ/ה אֶֽל רִנָּתִ/י֮ כִּֽי דַלּ֪וֹתִ֫י מְאֹ֥ד הַצִּילֵ֥/נִי מֵ/רֹדְפַ֑/י כִּ֖י אָמְצ֣וּ מִמֶּֽ/נִּי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/006.yaml
  text: Attend to my cry[a], for I am brought very low; deliver me from my pursuers[c][b], for they are stronger than I.
translation:
  language: sw
  text: Sikiliza kwa makini kilio changu, kwa maana nimedhoofika sana[a]. Niokoe kutoka kwa wanaonifuatilia, kwa maana wana nguvu kuliko mimi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nimeshushwa chini sana.” Kiebrania kinaweza kuonyesha kudhoofika sana au kuletwa katika hali ya chini kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: Sikiliza kwa makini
  rationale: Kitenzi hiki ni agizo la kusikiliza kwa uangalifu; kauli hii ni ya kawaida katika Kiswahili cha sasa na inadumisha uzito wa ombi.
- source_word: רִנָּתִי
  choice: kilio changu
  rationale: Katika muktadha huu wa maombolezo, neno linamaanisha kilio kikubwa cha kuomba msaada, si wimbo wa furaha.
- source_word: דַלּוֹתִי מְאֹד
  choice: nimedhoofika sana
  rationale: Mzizi דלל unaonyesha kupungua nguvu, kudhoofishwa, au kushushwa chini. Tafsiri hii ni ya asili katika Kiswahili huku tanbihi ikihifadhi maana mbadala ya kushushwa chini sana.
- source_word: הַצִּילֵנִי
  choice: Niokoe
  rationale: Katika muktadha huu, נצל ni kuokolewa kutoka hatari halisi inayosababishwa na wanaomfuatilia mwombaji.
- source_word: מֵרֹדְפַי
  choice: kutoka kwa wanaonifuatilia
  rationale: Hii inatafsiri moja kwa moja participio ya רדף kama watu wanaomfuatilia au kumwandama mwombaji bila kuipanua kuwa ‘maadui’ kwa ujumla.
- source_word: אָמְצוּ מִמֶּנִּי
  choice: wana nguvu kuliko mimi
  rationale: 'Kauli hii inadumisha ulinganisho ulio wazi katika Kiebrania: wanaomfuatilia wana nguvu zaidi ya mwombaji.'
theological_decisions:
- issue: Iwapo הַצִּילֵנִי itafsiriwe kwa maana pana ya wokovu wa kiroho
  choice: Niokoe
  alternative: Nikomboe
  rationale: Muktadha unahusu kuondolewa katika hatari kutoka kwa watu wanaomfuatilia mtunga zaburi. ‘Niokoe’ ni ombi la kawaida la kuokolewa na haiongezi maana maalumu ya kimafundisho isiyotajwa wazi hapa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sababu unaorudiwa kwa ‘kwa maana’ unadumisha mpangilio na msisitizo wa Kiebrania.
