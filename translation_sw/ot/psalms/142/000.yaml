  yaml_path: translation/ot/psalms/142/000.yaml
  text: A Maskil[a] of David[b], when he was in the cave. A prayer.
translation:
  language: sw
  text: Maskili[a] ya Daudi[b], alipokuwa pangoni. Sala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania Maskil, neno la kitaalamu katika vichwa vya zaburi; huenda linaonyesha utungo wa kutafakari au wa kufundisha.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa ajili ya Daudi” au “iliyotungwa na Daudi”; kichwa cha Kiebrania kinaweza kuonyesha utunzi, wakfu, au uhusiano.
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Maskili
  rationale: Hili ni neno la kitaalamu katika vichwa vya zaburi, na maana yake kamili haijulikani kwa hakika. Kulitohoa kunahifadhi jina la Kiebrania bila kulifasiri kwa uhakika kupita ushahidi.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kihusishi לְ katika vichwa vya zaburi kinaweza kuonyesha utunzi, wakfu, umilikaji, au uhusiano. ‘Ya Daudi’ ni ya kawaida katika Kiswahili na inaacha uhusiano huo ukiwa wazi kuliko ‘iliyotungwa na Daudi’.
- source_word: בִּהְיוֹתוֹ
  choice: alipokuwa
  rationale: Muundo huu wa Kiebrania una maana ya wakati. ‘Alipokuwa’ ni tafsiri ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: בַמְּעָרָה
  choice: pangoni
  rationale: Nomino ya Kiebrania ina kibainishi cha uhakika na huenda inarejelea pango lililojulikana katika simulizi kuhusu Daudi. Kiswahili ‘pangoni’ ni cha asili katika muktadha huu; uhakika wa rejeo unaeleweka kutokana na muktadha bila kuongeza neno la kuonyesha kama ‘lile’.
- source_word: תְפִלָּה
  choice: Sala
  rationale: Nomino hii ni lebo ya aina ya utungo katika kichwa cha zaburi. Imetolewa kama kipashio kifupi kinachojitegemea, kama ilivyo katika Kiebrania.
theological_decisions:
- issue: Uhusiano unaoonyeshwa na לְ katika לְדָוִד
  choice: ya Daudi
  alternative: kwa ajili ya Daudi; iliyotungwa na Daudi
  rationale: Tafsiri kuu haipaswi kuamua kwamba Daudi ndiye mtunzi au kwamba zaburi iliwekwa wakfu kwake, kwa kuwa muundo wa Kiebrania unaweza kuwa na mojawapo ya maana hizo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. ‘Maskili’ limetoholewa ili kuhifadhi istilahi ya Kiebrania yenye maana isiyo hakika. Muundo mfupi wa kichwa na sentensi ‘Sala’ unafuata vipashio vya maandishi ya chanzo.
