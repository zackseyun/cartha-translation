base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/005.yaml
  text: Yahweh tests the righteous[a], but his soul hates the wicked and the one who loves violence.
translation:
  language: sw
  text: Yahwe humchunguza mwenye haki, lakini nafsi yake humchukia mwovu na anayependa ukatili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa Kiswahili laini zaidi: “Yahwe humchunguza mwenye haki, lakini humchukia mwovu na anayependa ukatili.” Kiebrania kinasema kihalisi “nafsi yake humchukia,” nahau inayoonyesha chuki ya ndani na ya kina.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Ni kivumishi kilichotumiwa kama nomino kwa mtu anayetambulika kwa haki; umoja wa jumla unatunzwa.
- source_word: יִבְחָן
  choice: humchunguza
  rationale: Kitenzi בחן humaanisha kuchunguza au kupima ili kubaini hali ya mtu; 'humchunguza' ni Kiswahili cha kawaida na hakiongezi wazo la adhabu.
- source_word: וְרָשָׁע
  choice: mwovu
  rationale: Kinawakilisha mtu mwenye uovu na kudumisha ulinganifu na 'mwenye haki'.
- source_word: וְאֹהֵב חָמָס
  choice: anayependa ukatili
  rationale: Muundo huu unatambulisha mtu mwenye mazoea au mwelekeo wa kupenda ukatili.
- source_word: חָמָס
  choice: ukatili
  rationale: Katika muktadha huu neno linahusu vurugu au uovu wa kutumia nguvu; 'ukatili' ni la kawaida na linaonyesha ubaya wa kimaadili.
- source_word: שָׂנְאָה נַפְשׁוֹ
  choice: nafsi yake humchukia
  rationale: Linadumisha nahau halisi ya Kiebrania inayosisitiza chuki ya ndani na ya kina, bila kuirahisisha kuwa 'anamchukia' tu.
theological_decisions:
- issue: Rejeo na nguvu ya maneno 'nafsi yake' katika kishazi cha mwisho
  choice: '''nafsi yake'' inamrejelea Yahwe na kuonyesha chuki yake ya ndani na ya kina'
  alternative: Kurahisisha kuwa 'anamchukia' na kuacha neno 'nafsi'
  rationale: Kiebrania kinaihusisha chuki na נפש ya Yahwe, nahau ya kibinadamu inayosisitiza jinsi anavyochukizwa sana; tafsiri inadumisha mvutano na uzito huo bila kubuni maelezo zaidi kuhusu hisia za Mungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Humchunguza' na vitenzi vya hali ya mazoea vinaakisi kauli za jumla za mstari. Nahau 'nafsi yake humchukia' imehifadhiwa kwa sababu ya uzito wake wa kimaana, huku tanbihi ikitoa usemi laini zaidi.
