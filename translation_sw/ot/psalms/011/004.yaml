  text: יְהוָ֤ה בְּֽ/הֵ֘יכַ֤ל קָדְשׁ֗/וֹ יְהוָה֮ בַּ/שָּׁמַ֪יִם כִּ֫סְא֥/וֹ עֵינָ֥י/ו יֶחֱז֑וּ עַפְעַפָּ֥י/ו יִ֝בְחֲנ֗וּ בְּנֵ֣י אָדָֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/004.yaml
  text: Yahweh is in his holy temple[a]; Yahweh—his throne is in heaven. His eyes see[d][c][b]; his eyelids examine the children of man.
translation:
  language: sw
  text: Yahwe yuko katika hekalu lake takatifu; Yahwe—kiti chake cha enzi kiko mbinguni. Macho yake huona; kope zake huwachunguza wanadamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “wana wa mtu”; yaani, wanadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Limetumiwa umbo la kawaida la Kiswahili la jina la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadili kuwa cheo kama “BWANA”.
- source_word: בְּהֵיכַל קָדְשׁוֹ
  choice: katika hekalu lake takatifu
  rationale: הֵיכָל inaweza kumaanisha jumba au hekalu; hapa muktadha wa makao matakatifu ya Mungu na usambamba na kiti chake cha enzi unaunga mkono “hekalu,” bila kuamua kwamba ni jengo la duniani pekee.
- source_word: בַּשָּׁמַיִם כִּסְאוֹ
  choice: kiti chake cha enzi kiko mbinguni
  rationale: Hii ni tafsiri ya asili na wazi ya mahali pa kiti cha enzi, huku ikihifadhi mpangilio wenye jina la Yahwe lililorudiwa.
- source_word: עֵינָיו יֶחֱזוּ
  choice: Macho yake yanaona
  rationale: חזה humaanisha kuona au kutazama. “Yanaona” ni ya moja kwa moja, ya sasa, na huhifadhi taswira ya macho.
- source_word: עַפְעַפָּיו יִבְחֲנוּ
  choice: kope zake huwachunguza
  rationale: Tafsiri inadumisha taswira ya kishairi ya kope badala ya kuibadili kuwa “mtazamo”; בחן hapa ina wazo la kuchunguza au kupima kwa makini.
- source_word: בְּנֵי אָדָם
  choice: wanadamu
  rationale: Nahau ya Kiebrania, kihalisi “wana wa Adamu/mtu,” inarejelea watu wote. “Wanadamu” ni ya asili katika Kiswahili na inahifadhi maana jumuishi.
theological_decisions:
- issue: Taswira ya makao ya Mungu
  choice: Kudumisha kauli kwamba Yahwe yuko katika hekalu lake takatifu na kwamba kiti chake cha enzi kiko mbinguni.
  alternative: Kulieleza hekalu kuwa hekalu la duniani pekee, au kulifanya liwe kisawe cha mbingu pekee.
  rationale: Kiebrania kinaweka taswira zote mbili pamoja bila kuzisawazisha wazi; tafsiri inadumisha mvutano huo.
- issue: Maana ya pamoja ya בְּנֵי אָדָם
  choice: wanadamu
  alternative: wana wa Adamu; watoto wa binadamu
  rationale: Kirai kinawahusu watu kwa ujumla, si wanaume pekee. Chaguo hili ni la kawaida na sahihi kijinsia katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na ya kishairi. Alama ya mkato baada ya “Yahwe” inadumisha muundo wa Kiebrania unaolitaja jina kisha kueleza mahali pa kiti chake cha enzi.
