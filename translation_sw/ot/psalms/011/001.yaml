  text: For the choirmaster. Of David. In the LORD I have taken refuge; how can you say to me, “Flee to your mountain like a bird”?
translation:
  language: sw
  text: 'Kwa mwongoza wa uimbaji. Ya Daudi.


    Nimekimbilia BWANA kupata hifadhi; mnawezaje kuniambia, “Kimbilieni mlima wenu kama ndege”[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania cha sehemu hii ni kigumu: neno “ndege” linaweza pia kueleweka kama mwito, “ee ndege.”'
    reason: Huhifadhi utata wa kisintaksia wa צִפּוֹר bila kubadilisha tafsiri kuu inayolingana na njia ya ukaguzi ya Kiingereza.
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza wa waimbaji
  rationale: Kichwa hiki kinaelekezwa kwa kiongozi wa utendaji wa muziki; tafsiri hii ni ya kawaida na inaeleweka, ingawa neno la Kiebrania halitaji waimbaji waziwazi.
- source_word: לְדָוִד
  choice: Zaburi ya Daudi
  rationale: Kirai kinaonyesha uhusiano wa zaburi na Daudi; kuongeza ‘Zaburi’ hufanya kichwa kisomeke kwa kawaida bila kulazimisha kama maana yake ni utunzi, wakfu, au mali.
- source_word: בַּיהוָה חָסִיתִי
  choice: Nimemkimbilia BWANA kupata hifadhi
  rationale: Kitenzi חָסָה huonyesha kwenda kwa mtu au mahali ili kupata ulinzi; usemi huu wa Kiswahili huhifadhi picha ya kukimbilia hifadhi.
- source_word: לְנַפְשִׁי
  choice: kuniambia
  rationale: Hapa נֶפֶשׁ humaanisha nafsi au mtu mwenyewe; ‘kuniambia’ ni Kiswahili cha kawaida kwa maana ya ‘kuiambia nafsi yangu’.
- source_word: נודו הַרְכֶם צִפּוֹר
  choice: Kimbilia mlima wenu kama ndege
  rationale: Huhifadhi wingi wa kiwakilishi katika ‘mlima wenu’ na ulinganisho wa ndege. Kitenzi cha Kiebrania kina umbo la wingi, ambalo linaweza kuelekezwa kwa mtunga-zaburi pamoja na wenzake.
theological_decisions:
- issue: Jina la agano יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ kwa herufi kubwa ni desturi iliyoenea ya tafsiri za Biblia za Kiswahili kwa Tetragramatoni, bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Mhusika wa kauli ‘mwawezaje kuniambia’
  choice: Wingi umehifadhiwa katika ‘mwawezaje’
  alternative: ‘wawezaje kuniambia’ kwa umoja
  rationale: תֹּאמְרוּ ni wingi; tafsiri haiamui kimya kimya kwamba ni mshauri mmoja tu anayesema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Mwawezaje’ ni umbo fasaha na fupi; ‘BWANA’ huonyesha jina יהוה kwa desturi ya kibiblia.
