base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/002.yaml
  text: For look[a], the wicked bend the bow; they have fitted their arrow to the string to shoot in the darkness at the upright in heart.
translation:
  language: sw
  text: Kwa maana, tazama, waovu wanakaza upinde; wameuweka mshale wao kwenye kamba ya upinde, ili kuwapiga kwa mishale gizani[a] wenye moyo mnyofu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka gizani.” Usemi wa Kiebrania unaweza kukazia ama mazingira ya giza ambamo shambulio linafanywa, ama maficho ya giza ambako shambulio linaanzia.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu au msingi wa kauli iliyotangulia na kuhifadhi uhusiano wa hoja katika muktadha.
- source_word: הִנֵּה
  choice: tazama
  rationale: Ni neno la kuvuta fikira kwa tishio lililo karibu; “tazama” ni la sasa, lenye hadhi, na linaendeleza uzito wa kishairi.
- source_word: הָרְשָׁעִים
  choice: waovu
  rationale: Hurejelea wapinzani wenye uovu wa kimaadili, si watu waliopatikana na hatia kisheria tu.
- source_word: יִדְרְכוּן קֶשֶׁת
  choice: wanakaza upinde
  rationale: Nahau ya Kiebrania inaeleza kupinda au kuukanyaga upinde ili kuutayarisha; “wanakaza upinde” ni usemi wa kawaida wa Kiswahili unaoonyesha kutayarisha silaha hiyo.
- source_word: כּוֹנְנוּ
  choice: wameuweka
  rationale: Inaonyesha maandalizi ya makusudi, yaani kuuweka mshale mahali pake tayari kurushwa.
- source_word: חִצָּם
  choice: mshale wao
  rationale: Umbo la Kiebrania ni umoja lenye kiambishi cha nafsi ya tatu wingi; umoja umehifadhiwa kama picha ya mshale mmoja ulio tayari kurushwa.
- source_word: עַל יֶתֶר
  choice: kwenye uzi
  rationale: Neno linamaanisha uzi wa upinde; muktadha wa upinde unaifanya maana hiyo iwe wazi bila kurudia “uzi wa upinde.”
- source_word: לִירוֹת
  choice: ili kuwapiga
  rationale: Kitenzi kinamaanisha kurusha mshale. Katika Kiswahili, “kuwapiga” katika muktadha huu huwasilisha kusudi la shambulio kwa mshale kwa ufasaha.
- source_word: בְּמוֹ אֹפֶל
  choice: gizani
  rationale: Huhifadhi picha ya shambulio la siri katika hali au mahali penye giza, huku tanbihi ikitaja uwezekano wa maana ya kutoka mafichoni mwa giza.
- source_word: לְיִשְׁרֵי לֵב
  choice: walio wanyofu wa moyo
  rationale: Huhifadhi wazo la uadilifu wa ndani na maadili lililomo katika usemi wa Kiebrania.
