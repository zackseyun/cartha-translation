  yaml_path: translation/ot/psalms/011/000.yaml
  text: For the choirmaster[a]. Of David. In Yahweh I take refuge; how can you say to my soul, “Flee to your mountain[b], bird” ?
translation:
  language: sw
  text: 'Kwa mwongoza muziki[a]. Ya Daudi.


    Nimemkimbilia Yahwe;


    awezaje kuiambia nafsi yangu,


    “Kimbilia mlima wako, ewe ndege”[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kwa kiongozi.” Maana kamili ya neno la Kiebrania haijulikani kwa hakika; huenda linamhusu msimamizi wa muziki.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania ni kigumu. Pia yawezekana: “Kimbia kama ndege uende kwenye mlima wako.” Maandishi ya konsonanti (ketivu) yana “mlima wenu,” lakini mapokeo ya usomaji (qere) yana “mlima wako.”'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza muziki
  rationale: Neno hili la vichwa vya zaburi linaelekea kumtaja mtu aliyesimamia uimbaji au muziki; tafsiri hii ni ya kawaida na inaeleweka, huku tanbihi ikihifadhi kutokuwa na uhakika kwa maana yake kamili.
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Muundo huu unaweza kuonyesha utunzi, uhusiano, au wakfu kwa Daudi. “Ya Daudi” huhifadhi upana huo kuliko kusema moja kwa moja “iliyoandikwa na Daudi.”
- source_word: בַּיהוָה חָסִיתִי
  choice: Nimemkimbilia Yahwe
  rationale: Kitenzi חסה hueleza kutafuta na kupata hifadhi kwa mtu; kauli ya wakati timilifu wa Kiswahili huonyesha hatua iliyofanywa yenye hali inayoendelea.
- source_word: לְנַפְשִׁי
  choice: kuiambia nafsi yangu
  rationale: Tafsiri hii huhifadhi picha halisi ya kusema kwa ‘nafsi yangu’ badala ya kuipunguza kimyakimya kuwa ‘kuniambia.’
- source_word: נוּדוּ/נוּדִי הַרְכֶם צִפּוֹר
  choice: Kimbilia mlima wenu, ewe ndege
  rationale: Maneno ya Kiebrania na tofauti ya umbo linalosomwa dhidi ya lililoandikwa ni magumu. Tafsiri kuu huhifadhi mpangilio na mvutano wa ‘mlima wenu’ pamoja na ‘ewe ndege,’ huku tanbihi ikitoa uwezekano wa ulinganisho ‘kama ndege.’
theological_decisions:
- issue: Jina la agano יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu, hivyo “Yahwe” hulitofautisha na cheo ‘Bwana’ bila kuingiza tafsiri ya kimadhehebu.
- issue: Uhusiano wa Daudi na zaburi
  choice: Ya Daudi
  alternative: Zaburi iliyoandikwa na Daudi
  rationale: Kihusishi לְ kinaweza kubeba zaidi ya maana moja; “Ya Daudi” hakifungi kichwa katika dai moja tu kuhusu uandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mistari imepangwa kwa mtindo wa zaburi. “Nafsi yangu” imehifadhiwa kwa sababu ya uzito wa picha ya Kiebrania, na ugumu wa kishazi cha mwisho umeelezwa badala ya kutatuliwa kimyakimya.
