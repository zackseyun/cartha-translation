  text: יַמְטֵ֥ר עַל רְשָׁעִ֗ים פַּ֫חִ֥ים אֵ֣שׁ וְ֭/גָפְרִית וְ/ר֥וּחַ זִלְעָפ֗וֹת מְנָ֣ת כּוֹסָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/006.yaml
  text: He will rain down traps on the wicked; fire and sulfur and a scorching wind will be the portion of their cup.
translation:
  language: sw
  text: Atawanyeshea waovu mitego; moto, kiberiti, na upepo mkali unaochoma vitakuwa fungu la kikombe chao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַמְטֵר
  choice: atawanyeshea
  rationale: Hudumisha taswira ya kunyesha kitu kutoka juu na kuchukua yule anayetendewa kwa kiambishi cha Kiswahili.
- source_word: פַּחִים
  choice: mitego
  rationale: Maana ya kawaida ya neno hili la Kiebrania ni mitego au tanzi; “mitego” ni ya asili na inafahamika kwa urahisi huku ikidumisha taswira ya hukumu.
- source_word: גָפְרִית
  choice: kiberiti
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa sulfur/brimstone katika muktadha huu.
- source_word: רוּחַ זִלְעָפוֹת
  choice: upepo mkali unaochoma
  rationale: Kirai hiki kinaashiria upepo wenye joto kali na ghadhabu; tafsiri hii huwasilisha ukali na athari ya kuunguza bila kuifanya ghadhabu kuwa maana pekee.
- source_word: מְנָת כּוֹסָם
  choice: fungu la kikombe chao
  rationale: Hudumisha sitiari ya Kiebrania ya kikombe kama sehemu au hatima waliyopewa, badala ya kuifafanua kupita kiasi.
theological_decisions:
- issue: Mtendaji wa hukumu
  choice: Kitenzi kimeachwa na kiwakilishi cha nafsi ya tatu, “Atawanyeshea,” kama ilivyo katika aya ya Kiebrania.
  alternative: Kutaja wazi “BWANA” au “Mungu.”
  rationale: Mhusika hutambulika katika muktadha, lakini aya hii yenyewe haitaji jina; kutoliongeza hudumisha umbo la chanzo.
- issue: Sitiari ya kikombe cha hukumu
  choice: “fungu la kikombe chao”
  alternative: “hiyo ndiyo adhabu yao”
  rationale: Sitiari ya kikombe ina uzito wa kibiblia na haipaswi kubadilishwa kuwa maelezo ya moja kwa moja yanayofuta taswira na mvutano wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio na taswira kuu za Kiebrania zimehifadhiwa kwa lugha ya asili ya Kiswahili.
