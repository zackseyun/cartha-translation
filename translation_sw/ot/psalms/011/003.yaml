translation:
  language: sw
  text: Ikiwa misingi inabomolewa[a], mwenye haki anaweza kufanya nini?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kwa maana misingi inabomolewa; mwenye haki amefanya nini?” Umbo la Kiebrania la kitenzi cha mwisho linaweza kutafsiriwa kwa kuelekea zaidi wakati uliopita, ingawa kwa kawaida muktadha hueleweka kuwa, “mwenye haki anaweza kufanya nini?”'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ikiwa
  rationale: Ingawa neno hili mara nyingi humaanisha ‘kwa maana’, hapa linaweza kuanzisha hali ya masharti inayoendana vizuri na swali la balagha linalofuata.
- source_word: הַשָּׁתוֹת
  choice: misingi
  rationale: Huhifadhi picha halisi ya msingi huku ikiacha wazi matumizi yake ya kimfano kuhusu utaratibu wa kijamii, maadili, au haki.
- source_word: יֵהָרֵסוּן
  choice: inabomolewa
  rationale: Kauli ya kutendwa inaakisi umbo la Kiebrania na kuwasilisha tendo la kuangusha au kuharibu misingi.
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Ni usemi wa kawaida na wenye heshima unaowakilisha mtu mwenye haki bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: מַה פָּעָל
  choice: anaweza kufanya nini?
  rationale: Ingawa kitenzi kwa umbo ni qatal, muktadha wa swali la balagha unaelekea kuuliza uwezekano wa hatua ambayo mwenye haki anaweza kuchukua.
theological_decisions:
- issue: Maana ya kimfano ya ‘misingi’
  choice: Kuhifadhi sitiari ‘misingi’ bila kuifafanua zaidi
  alternative: Kuitafsiri moja kwa moja kuwa utaratibu wa jamii, haki, au maadili
  rationale: Kiebrania kinaacha picha hii ikiwa pana; tafsiri haipaswi kuifungamanisha na maana moja ya kiteolojia au kijamii.
- issue: Wakati na maana ya פָּעָל
  choice: anaweza kufanya nini?
  alternative: amefanya nini?
  rationale: Usomaji wa uwezo unaendana vyema na hali ya masharti na swali la balagha, lakini umbo la kitenzi pia huruhusu usomaji unaoelekea wakati uliopita, ambao umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Inabomolewa’ ni ya asili kwa misingi na huhifadhi kauli ya kutendwa; ‘mwenye haki’ ni wazi kwa msomaji wa kawaida.
