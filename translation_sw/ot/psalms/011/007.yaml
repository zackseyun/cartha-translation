source:
  edition: WLC
  text: כִּֽי צַדִּ֣יק יְ֭הוָה צְדָק֣וֹת אָהֵ֑ב יָ֝שָׁ֗ר יֶחֱז֥וּ פָנֵֽי/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/007.yaml
  text: For Yahweh is righteous[a]; he loves righteous deeds[b]; the upright will behold his face.
translation:
  language: sw
  text: 'Kwa maana Yahwe ni mwenye haki;

    anapenda matendo ya haki;

    wanyofu watauona uso wake.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ingawa uwezekano wake ni mdogo, “uso wake huwaona wanyofu.” Muundo wa Kiebrania wa kishazi cha mwisho umeeleweka kwa zaidi ya njia moja.
    reason: alternative_reading
  - marker: b
    text: Kihalisi, “uso wake.” Maneno hayo yanaweza pia kumaanisha kuwapo kwake au fadhili zake.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kishazi hiki kinatoa sababu ya kauli iliyotangulia; “kwa maana” kinaonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Kinaeleza tabia ya maadili ya Yahwe na kudumisha uhusiano wa mzizi na צְדָקוֹת, “matendo ya haki.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetafsiriwa kwa umbo linalotambulika katika Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: צְדָקוֹת
  choice: matendo ya haki
  rationale: Nomino ya wingi hapa inaelekea kumaanisha matendo halisi yaliyo ya haki, si sifa dhahania pekee.
- source_word: אָהֵב
  choice: anapenda
  rationale: Wakati wa sasa unaonyesha msimamo wa kudumu wa Yahwe, na kitenzi hiki kinatoa maana ya moja kwa moja ya upendo au kupendezwa.
- source_word: יָשָׁר
  choice: wanyofu
  rationale: Kivumishi kimetumiwa kama nomino kwa watu wenye mwenendo ulionyooka; kitenzi cha wingi kinathibitisha maana ya wingi.
- source_word: יֶחֱזוּ
  choice: watauona
  rationale: Kitenzi kina maana ya kuona au kutazama. “Watauona” ni cha asili katika Kiswahili huku kikihifadhi maana ya kuona uso wa Mungu.
- source_word: פָנֵימוֹ
  choice: uso wake
  rationale: Tafsiri halisi ya taswira ya Kiebrania imehifadhiwa; inaweza pia kudokeza kuwapo au fadhili zake.
theological_decisions:
- issue: Mhusika na muundo wa kishazi cha mwisho
  choice: wanyofu watauona uso wake
  alternative: uso wake huwaona wanyofu
  rationale: Kitenzi יֶחֱזוּ ni cha wingi, hivyo “wanyofu” wanaeleweka kwa urahisi zaidi kuwa mhusika, na “uso wake” kuwa shamirisho. Hata hivyo, muundo wa Kiebrania unaweza kufasiriwa kwa njia nyingine, kwa hiyo uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Mistari mitatu inadumisha mpangilio sambamba wa aya ya Kiebrania.
