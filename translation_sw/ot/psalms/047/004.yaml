translation:
  language: sw
  text: Anatuchagulia urithi wetu,[a] fahari ya Yakobo, ambaye Mungu anampenda.[b] Sela.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Atatuchagulia urithi wetu, utukufu wa Yakobo, ambaye Mungu anampenda.”
    reason: lexical_alternative
  - marker: b
    text: 'Kirai “ambaye Mungu anampenda” kinaweza pia kueleweka kuwa kinarejelea urithi au nchi: “fahari ya Yakobo, ambayo Mungu anaipenda.”'
    reason: alternative_reading
  - marker: c
    text: “Sela” ni istilahi ya Kiebrania ya kiliturujia au kimuziki ambayo maana yake kamili haijulikani; kwa kawaida huachwa bila kutafsiriwa.
    reason: cultural_note
lexical_decisions:
- source_word: יִבְחַר
  choice: Anatuchagulia
  rationale: Qal imperfect inaweza kueleza tendo linaloendelea au la kawaida, au tendo la wakati ujao. Wakati wa sasa unaendana na sifa za utawala na matendo ya Mungu katika zaburi hii, huku uwezekano wa wakati ujao ukihifadhiwa katika tanbihi.
- source_word: לָנוּ
  choice: -tu- ... -ia (‘kwa ajili yetu’)
  rationale: Kiambishi cha yambwa pamoja na kauli ya kutendea katika ‘anatuchagulia’ kinawasilisha kwa Kiswahili cha kawaida maana ya לָנוּ, yaani ‘kwa ajili yetu.’
- source_word: נַחֲלָתֵנוּ
  choice: urithi wetu
  rationale: ‘Urithi’ huhifadhi maana ya fungu au milki iliyogawiwa, hasa nchi ya agano, kuliko neno pana zaidi kama ‘turathi.’
- source_word: אֶת ... אֶת
  choice: havikutafsiriwa kwa maneno tofauti
  rationale: Hivi ni viashiria vya yambwa katika Kiebrania. אֶת ya pili inatanguliza kirai kinachofafanua zaidi ‘urithi wetu.’
- source_word: גְּאוֹן
  choice: fahari
  rationale: Neno linaweza kumaanisha fahari, utukufu, ukuu au adhama. Hapa lina maana chanya ya kile kilicho bora na cha kujivunia kwa Yakobo.
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Jina la Kiebrania limetoholewa moja kwa moja badala ya kufasiriwa kuwa ‘Israeli,’ ingawa linawakilisha pia watu waliotokana na Yakobo.
- source_word: אֲשֶׁר אָהֵב
  choice: ambaye anampenda
  rationale: Kirai hiki kinaweza kurejelea Yakobo, na hali ya kitenzi inaweza kueleza upendo wa Mungu unaoendelea. Kiswahili hiki kinaweka Yakobo kama rejeleo kuu bila kuficha uwezekano mwingine.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya istilahi hii ya kiliturujia au kimuziki haijulikani; kwa hiyo imetoholewa badala ya kutafsiriwa kwa kubahatisha.
theological_decisions:
- issue: Rejeleo la ‘ambaye anampenda’
  choice: Kirai kimehusishwa hasa na Yakobo.
  alternative: 'Kirai kinaweza kuhusishwa na urithi au nchi: ‘fahari ya Yakobo, ambayo anaipenda.’'
  rationale: Yakobo ndiye rejeleo la karibu la kibinafsi, na wazo la Mungu kumpenda Yakobo linaendana na lugha nyingine za Biblia. Hata hivyo, muundo wa Kiebrania unaruhusu pia urithi au nchi kuwa rejeleo, hivyo uwezekano huo umeandikwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. ‘Anatuchagulia’ ni ya kawaida na hubeba kwa ufupi maana ya ‘anachagua kwa ajili yetu.’
