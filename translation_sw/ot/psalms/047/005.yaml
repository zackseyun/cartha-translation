  yaml_path: translation/ot/psalms/047/005.yaml
  text: God has gone up with a shout[a]; Yahweh[b], with the sound of a trumpet.
translation:
  language: sw
  text: 'Mungu amekwenda juu[a] kwa sauti kuu;

    Yahweh, kwa sauti ya baragumu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amepaa.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania shofar: pembe iliyotumiwa kama baragumu, kwa desturi pembe ya kondoo dume.'
