lexical_decisions:
- source_word: עָלָה
  choice: amepaa
  rationale: Kitenzi hiki humaanisha kwenda juu au kupaa. “Amepaa” kinadumisha tangazo la kishairi bila kulazimisha maana maalumu ya kiteolojia ya baadaye.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hapa neno hili linamtaja Mungu wa Israeli katika ulinganifu na Yahweh, kwa hiyo limetafsiriwa kwa umoja.
- source_word: בִּתְרוּעָה
  choice: kwa kelele za shangwe
  rationale: תְּרוּעָה ni mlio mkubwa wa watu, kama kelele za kushangilia au mwito wa ushindi. Tafsiri hii ni ya kawaida katika Kiswahili na inafaa muktadha wa sherehe, ingawa kipengele cha shangwe kinaelezwa kwa kiasi na muktadha.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limehifadhiwa kwa kulinakili badala ya kulibadilisha kuwa cheo.
- source_word: בְּקוֹל
  choice: kwa sauti ya
  rationale: קוֹל humaanisha sauti au mlio; pamoja na shofar, “kwa sauti ya” ni usemi wa asili na hudumisha taswira ya kusikia.
- source_word: שׁוֹפָר
  choice: baragumu
  rationale: Shofar ni tarumbeta ya pembe iliyotumiwa kutoa ishara na katika ibada. “Baragumu” linafaa mtindo wa kishairi wa Kibiblia, huku maelezo mahususi ya ala hiyo yakitolewa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina lenyewe; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Lugha ya kupaa inayoweza kusomwa kwa maana maalumu ya baadaye
  choice: Mungu amepaa
  alternative: Mungu amekwenda juu
  rationale: “Amepaa” hudumisha taswira ya kifalme na kishairi ya zaburi bila kulazimisha tafsiri mahususi ya Kikristo ambayo haijaelezwa moja kwa moja katika mstari huu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo wa mistari miwili na udondoshaji wa kitenzi katika mstari wa pili vimehifadhi ulinganifu na ufupi wa Kiebrania.
