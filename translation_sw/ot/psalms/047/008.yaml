base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/008.yaml
  text: God reigns over the nations[a]; God sits on his holy throne.
translation:
  language: sw
  text: Mungu anatawala juu ya mataifa[a]; Mungu ameketi juu ya kiti chake cha enzi kitakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu amekuwa mfalme juu ya mataifa; Mungu amekalia kiti chake cha enzi kitakatifu.” Vitenzi timilifu vya Kiebrania vinaweza kueleweka kuwa vinasisitiza kuanzishwa kwa utawala wake.
    reason: alternative_reading
lexical_decisions:
- source_word: מָלַךְ
  choice: anatawala
  rationale: Kauli timilifu ya Kiebrania inaweza kutangaza hali ya sasa au matokeo yanayoendelea katika ushairi. “Anatawala” ni Kiswahili cha kawaida kinachoeleza ufalme wa Mungu bila kudokeza kwamba ndipo kwanza amekuwa Mfalme.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania ni la wingi, hapa linamtaja Mungu mmoja wa Israeli. Kurudia “Mungu” katika vipande vyote viwili kunahifadhi msisitizo wa mstari.
- source_word: עַל
  choice: juu ya
  rationale: Pamoja na wazo la kutawala mataifa, “juu ya” huonyesha mamlaka na utawala. Katika sehemu ya pili pia huhifadhi mahali panapoelezwa kwa kuketi juu ya kiti cha enzi.
- source_word: גּוֹיִם
  choice: mataifa
  rationale: “Mataifa” ni neno la kawaida na pana kwa jamii za watu zilizo chini ya utawala wa Mungu; halileti maana za baadaye zinazoweza kuambatana na “Watu wa Mataifa.”
- source_word: יָשַׁב
  choice: ameketi
  rationale: Kitenzi humaanisha kuketi au kukaa. “Ameketi” huhifadhi picha halisi ya kifalme na pia uwezekano wa hali iliyothibitishwa unaoletwa na kauli timilifu.
- source_word: כִּסֵּא
  choice: kiti cha enzi
  rationale: Katika muktadha wa kifalme na wa Mungu, “kiti cha enzi” ndilo neno sahihi kuliko “kiti” pekee.
- source_word: קָדְשׁוֹ
  choice: kitakatifu
  rationale: Kirai cha Kiebrania ni kihalisi “kiti cha enzi cha utakatifu wake.” Kiswahili cha kawaida ni “kiti chake cha enzi kitakatifu,” kinachohifadhi umiliki na sifa ya utakatifu.
theological_decisions:
- issue: Ufalme wa Mungu unaoelezwa kwa vitenzi timilifu katika ushairi wa Kiebrania
  choice: 'Tangazo la sasa: “Mungu anatawala ... Mungu ameketi juu ya kiti chake cha enzi kitakatifu.”'
  alternative: 'Maana ya kuanza au kutimilika: “Mungu amekuwa Mfalme juu ya mataifa; Mungu ameketi kwenye kiti chake cha enzi kitakatifu.”'
  rationale: Zaburi inashangilia utawala wa Mungu wa sasa na wa ulimwengu wote. Wakati wa sasa katika sehemu ya kwanza unasikika kwa kawaida katika Kiswahili, huku “ameketi” ikihifadhi picha ya kifalme na hali iliyothibitishwa. Tanbihi inalinda uwezekano wa kusisitiza kuanzishwa au kudhihirishwa kwa utawala huo bila kufanya dai la ziada la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na kurudiwa kwa “Mungu” vimehifadhiwa; “kiti cha enzi” ni usemi wa kawaida wa kifalme.
