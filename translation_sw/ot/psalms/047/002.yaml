  yaml_path: translation/ot/psalms/047/002.yaml
  text: For Yahweh Most High is to be feared[a], a great King over all the earth.
translation:
  language: sw
  text: 'Kwa maana Yahweh Aliye Juu Zaidi ni wa kuogopwa[a],

    Mfalme mkuu juu ya dunia yote.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ni wa kutisha” au “anastaajabisha.” Neno la Kiebrania linamweleza Yahweh kuwa yeye huamsha hofu yenye uchaji na kicho.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya mwito wa kusifu katika muktadha unaozunguka, huku ikidumisha mtiririko wa kishairi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ni unukuzi wa jina la Mungu, Tetragramatoni, badala ya kulibadilisha kuwa cheo.
- source_word: עֶלְיוֹן
  choice: Aliye Juu Zaidi
  rationale: Huwasilisha cheo cha kimungu chenye maana ya aliye juu kabisa; herufi kubwa zinaonyesha matumizi yake kama cheo.
- source_word: נוֹרָא
  choice: ni wa kuogopwa
  rationale: Hudumisha wazo la Mungu kuamsha hofu yenye uchaji na kicho, bila kulipunguza kuwa mshangao wa kawaida au hofu tupu.
- source_word: מֶלֶךְ גָּדוֹל
  choice: Mfalme mkuu
  rationale: Hudumisha taswira ya kifalme na ukuu wa mamlaka yake kwa lugha ya kawaida na yenye hadhi.
- source_word: עַל כָּל הָאָרֶץ
  choice: juu ya dunia yote
  rationale: Katika muktadha huu wa kutawazwa, אֶרֶץ ina upeo wa ulimwengu mzima, na עַל huonyesha utawala juu yake.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; kulinakili kama Yahweh huhifadhi jina hilo badala ya kuweka cheo mahali pake.
- issue: Maana ya נוֹרָא inapomhusu Mungu
  choice: ni wa kuogopwa
  alternative: ni wa kutisha / anastaajabisha
  rationale: Uteuzi huu huhifadhi mvutano wa Kiebrania kati ya hofu, kicho, na uchaji katika mazingira ya ibada, bila kuufanya uwe woga pekee wala mshangao pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa mistari miwili unadumisha ulinganifu wa kishairi wa zaburi; “dunia yote” ni ya kawaida na inaonyesha upeo wa ulimwengu mzima.
