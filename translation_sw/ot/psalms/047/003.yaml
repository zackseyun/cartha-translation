    issue: “Makabila” renders לְאֻמִּים too specifically.
    rationale: לְאֻמִּים refers broadly to nations/peoples, not necessarily tribes. In contemporary Standard East African Swahili, “makabila” can imply constituent ethnic tribes and may narrow the source meaning.
  - severity: low
    issue: The footnote’s alternative repeats “mataifa” although the revised first colon uses “watu.”
    rationale: The alternative should correspond to the noun in the translated colon and should describe the contextual sense without implying that the verb can never mean “speak.”
