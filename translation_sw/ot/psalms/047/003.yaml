  text: יַדְבֵּ֣ר עַמִּ֣ים תַּחְתֵּ֑י/נוּ וּ֝/לְאֻמִּ֗ים תַּ֣חַת רַגְלֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/003.yaml
  text: He subdues peoples under us[a], and nations under our feet.
translation:
  language: sw
  text: 'Anawatiisha watu chini yetu[a],

    na mataifa chini ya miguu yetu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Anawatia watu chini ya mamlaka yetu.” Kitenzi cha Kiebrania katika muktadha huu kina maana ya kutiisha, wala si ya kusema.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַדְבֵּר
  choice: anawatiisha
  rationale: Katika muktadha huu kitenzi hiki kina maana ya kusababisha watu wawe chini ya mamlaka, si kusema. ‘Anawatiisha’ ni cha asili katika Kiswahili na kinadumisha muktadha wa kifalme na ushindi.
- source_word: עַמִּים
  choice: mataifa
  rationale: Wingi huu unarejelea jamii au makundi ya watu. ‘Mataifa’ ni neno linaloeleweka kwa urahisi, huku utofauti wa kishairi na לְאֻמִּים ukihifadhiwa kwa kutumia ‘makabila’ katika mstari wa pili.
- source_word: תַּחְתֵּינוּ
  choice: chini yetu
  rationale: Tafsiri hii ya moja kwa moja inadumisha sitiari ya kutiishwa na usambamba na ‘chini ya miguu yetu.’
- source_word: וּלְאֻמִּים
  choice: na makabila
  rationale: Neno hili linaweza kumaanisha mataifa au jumuiya za watu. ‘Makabila’ hapa linadumisha utofauti wa msamiati kati ya maneno mawili ya Kiebrania bila kubadili usambamba wake.
- source_word: תַּחַת רַגְלֵינוּ
  choice: chini ya miguu yetu
  rationale: Hii inadumisha taswira halisi ya Kiebrania na nahau ya ushindi au kuwa chini ya mamlaka.
theological_decisions:
- issue: Sauti ya pamoja na mtendaji katika lugha ya ushindi
  choice: Mungu ndiye anayewatiisha watu wengine chini ya ‘sisi.’
  alternative: Kauli ya jumla ya kifalme kuhusu ushindi wa kijeshi wa Israeli.
  rationale: Muktadha wa karibu unamhusisha Mungu na ufalme pamoja na ushindi. Tafsiri inadumisha nafsi ya kwanza wingi na taswira ya kutiishwa bila kuipunguza au kuipa tafsiri ya baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha na inayoeleweka kwa msomaji wa kawaida. Usambamba wa kishairi na taswira ya kifalme vimedumishwa.
