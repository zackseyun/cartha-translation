  yaml_path: translation/ot/psalms/047/007.yaml
  text: For God is the King of all the earth[a]; sing a psalm with understanding.
translation:
  language: sw
  text: Kwa maana Mungu ni Mfalme wa dunia yote; imbeni kwa ufahamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “imbeni kwa ustadi,” au huenda, “imbeni maskili” (istilahi ya muziki au fasihi).
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya mwito uliotangulia wa kumsifu Mungu, kwa Kiswahili cha kawaida na cha heshima.
- source_word: מֶלֶךְ כָּל־הָאָרֶץ
  choice: Mfalme wa dunia yote
  rationale: Inahifadhi muundo na upeo wa kauli ya Kiebrania kwamba ufalme wa Mungu unahusu dunia nzima.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania ni la wingi, hapa lina maana ya umoja na linamtaja Mungu.
- source_word: זַמְּרוּ
  choice: imbeni
  rationale: Ni amri kwa watu wengi ya kuimba sifa kwa muziki; muktadha unaonyesha wazi kuwa Mungu ndiye anayesifiwa.
- source_word: מַשְׂכִּיל
  choice: kwa ufahamu
  rationale: Huhifadhi maana inayohusiana na kuelewa au kuwa na maarifa bila kuficha uwezekano kwamba neno hilo ni istilahi ya muziki au fasihi.
theological_decisions:
- issue: Upeo wa ufalme wa Mungu
  choice: Mungu ni Mfalme wa dunia yote
  alternative: Mungu ni mfalme juu ya nchi yote
  rationale: Kauli ya Kiebrania inaelekea kutangaza ufalme wa Mungu wenye upeo wa ulimwengu wote; tafsiri haipaswi kuupunguza upeo huo.
- issue: Maana ya מַשְׂכִּיל
  choice: imbeni kwa ufahamu
  alternative: imbeni kwa ustadi; imbeni maskili
  rationale: Neno linaweza kueleza kuimba kwa ufahamu au ustadi, au kuwa jina la aina ya wimbo. Matini kuu inatumia maana inayoeleweka kwa urahisi huku tanbihi ikihifadhi utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
