  text: כָּֽל הָ֭/עַמִּים תִּקְעוּ כָ֑ף הָרִ֥יעוּ לֵ֝/אלֹהִ֗ים בְּ/ק֣וֹל רִנָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/001.yaml
  text: Clap your hands[a], all peoples[b]; shout to God with a voice of joy.
translation:
  language: sw
  text: Enyi watu wote, pigeni makofi; mpigieni Mungu kelele za shangwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעַמִּים
  choice: Enyi watu wote
  rationale: Wingi wa עַמִּים unarejelea makundi yote ya watu. Muundo wa wito “Enyi watu wote” ni wa asili katika Kiswahili na unaonyesha kwamba wote wanaelekezewa maneno haya bila kuifanya dhana hiyo kuwa ya kisiasa kama “mataifa” pekee.
- source_word: תִּקְעוּ כָף
  choice: pigeni makofi
  rationale: Hii ni nahau ya kupiga viganja. “Pigeni makofi” ndiyo usemi wa kawaida na wazi wa Kiswahili kwa tendo hili la shangwe.
- source_word: הָרִיעוּ
  choice: mpigieni ... kelele
  rationale: Kitenzi hiki katika kausativi kina maana ya kutoa sauti kubwa ya shangwe au ya kumshangilia mtu. “Mpigieni ... kelele” kinahifadhi nguvu ya amri na mwelekeo wa sifa.
- source_word: לֵאלֹהִים
  choice: Mungu
  rationale: Kiambishi ל kinaonyesha anayeelekezewa mshangilio. Katika Kiswahili, yambwa katika “mpigieni Mungu kelele” huwasilisha maana hiyo kwa kawaida.
- source_word: בְּקוֹל רִנָּה
  choice: kelele za shangwe
  rationale: קוֹל ni sauti, na רִנָּה ni kilio au sauti ya furaha na shangwe. “Kelele za shangwe” huunganisha ukubwa wa sauti na furaha bila kulazimisha maana ya wimbo.
theological_decisions:
- issue: Upeo wa wanaoitwa kumsifu Mungu
  choice: Wito unaelekezwa kwa watu wote kwa ujumla.
  alternative: Wito ni wa kimtindo tu kwa mataifa yanayoizunguka Israeli.
  rationale: Kiebrania kinasema wazi “watu wote”; kwa hiyo tafsiri inadumisha upeo huo wa jumla bila kuupunguza.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Mstari unabaki na muundo wa kishairi wa amri mbili zinazolingana.
