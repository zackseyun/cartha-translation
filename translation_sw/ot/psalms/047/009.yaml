id: PSA.47.9
reference: Psalms 47:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: נְדִ֘יבֵ֤י עַמִּ֨ים נֶאֱסָ֗פוּ עַם֮ אֱלֹהֵ֪י אַבְרָ֫הָ֥ם כִּ֣י לֵֽ֭/אלֹהִים מָֽגִנֵּי אֶ֗רֶץ מְאֹ֣ד נַעֲלָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/009.yaml
  text: The nobles of the peoples have gathered as the people of the God of Abraham[a], for the shields of the earth belong to God[b]; he is greatly exalted.
translation:
  language: sw
  text: Wakuu wa mataifa wamekusanyika wakiwa watu wa Mungu wa Abrahamu[a], kwa maana ngao za dunia ni za Mungu[b]; ametukuka sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja na watu wa Mungu wa Abrahamu.” Kirai cha Kiebrania kinaweza kuonyesha ushirika wa karibu au kutambulishwa pamoja nao.
    reason: alternative_reading
  - marker: b
    text: Au, “watawala wa dunia”; kwa neno halisi, “ngao za dunia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדִיבֵי
  choice: wakuu wa
  rationale: Neno hili humaanisha watu wenye cheo, hasa wakuu au viongozi. “Wakuu” ni la kawaida na lenye heshima katika Kiswahili, na linaendana na mfano wa “ngao” baadaye katika mstari.
- source_word: עַמִּים
  choice: mataifa
  rationale: Wingi huu unahusu makundi mbalimbali ya watu. “Mataifa” ni tafsiri ya kawaida ya kishairi na inaonyesha wingi wa jamii bila kuwalazimisha kuwa dola za kisasa.
- source_word: נֶאֱסָפוּ
  choice: wamekusanyika
  rationale: Kauli ya Nifali hapa inaeleza kukusanyika kwao. Wakati timilifu wa Kiswahili unafaa kwa tangazo hili la kishairi.
- source_word: עַם אֱלֹהֵי אַבְרָהָם
  choice: wakiwa watu wa Mungu wa Abrahamu
  rationale: Kirai cha Kiebrania kimebanwa kisarufi na kinaweza kuonyesha utambulisho au ushirika wa karibu. “Wakiwa” linaonyesha kwa kiasi maana ya kutambuliwa kuwa watu wa Mungu wa Abrahamu bila kuficha uwezekano wa tafsiri nyingine.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutanguliza msingi au maelezo ya kauli iliyotangulia.
- source_word: לֵאלֹהִים
  choice: ni za Mungu
  rationale: Kihusishi ל hapa kinaonyesha umilikaji; Kiswahili “ni za Mungu” ni cha kawaida na wazi.
- source_word: מָגִנֵּי אֶרֶץ
  choice: ngao za dunia
  rationale: Tafsiri halisi huhifadhi taswira yenye nguvu ya Kiebrania. Huenda “ngao” ikawakilisha watawala au walinzi, jambo linaloelezwa katika tanbihi.
- source_word: מְאֹד נַעֲלָה
  choice: ametukuka sana
  rationale: Kitenzi ni cha nafsi ya tatu umoja wa kiume, na Mungu ndiye kiima kinachoeleweka kutokana na muktadha. “Ametukuka” kinafaa kwa lugha ya sifa ya zaburi.
theological_decisions:
- issue: Uhusiano wa wakuu wa mataifa na watu wa Mungu wa Abrahamu
  choice: Wakuu wanaelezwa kuwa wamekusanyika wakiwa watu wa Mungu wa Abrahamu.
  alternative: Wamekusanyika pamoja na watu wa Mungu wa Abrahamu.
  rationale: Kiebrania kina kirai kilichobanwa ambacho kinaweza kueleza kutambulishwa pamoja nao au kujiunga nao kwa karibu. Muktadha unaunga mkono ujumuishwaji wa mataifa, lakini tanbihi inahifadhi uwezekano wa maana ya kusanyiko la pamoja bila kuamua zaidi ya maandishi.
- issue: Maana ya “ngao za dunia”
  choice: Taswira halisi ya ngao imehifadhiwa katika matini.
  alternative: Watawala au walinzi wa dunia.
  rationale: Inawezekana “ngao” ni sitiari ya watawala au walinzi, lakini kuhifadhi taswira ya Kiebrania huepuka kuifafanua kimya kimya na kudumisha uhusiano wa kishairi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Wakuu,” “wamekusanyika,” na “ametukuka” ni maneno ya sasa na yenye heshima; taswira ya “ngao” imehifadhiwa.
