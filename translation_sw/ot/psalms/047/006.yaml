  yaml_path: translation/ot/psalms/047/006.yaml
  text: Sing praises to God[a], sing praises; sing praises to our King, sing praises.
translation:
  language: sw
  text: Mwimbieni Mungu sifa[a], mwimbieni sifa; mwimbieni Mfalme wetu sifa, mwimbieni sifa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mpigieni Mungu muziki ... mpigieni Mfalme wetu muziki.” Kitenzi cha Kiebrania kinaweza kumaanisha sifa ya kimuziki kwa upana zaidi, si kuimba tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ / זַמֵּרוּ
  choice: mwimbieni ... sifa
  rationale: Amri ya wingi ya זמר katika muktadha huu wa ibada inahimiza sifa ya sauti au ya muziki. Usemi huu wa Kiswahili ni wa kawaida na wenye hadhi, na marudio yake mara nne yanafuata msisitizo na muundo wa Kiebrania.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hapa אֱלֹהִים humrejelea Mungu wa Israeli katika mwito wa kumsifu, kwa hiyo nomino ya umoja “Mungu” ndiyo tafsiri ya kawaida.
- source_word: לְמַלְכֵּנוּ
  choice: Mfalme wetu
  rationale: Kiambishi לְ kinaonyesha anayeelekezewa sifa, jambo linalowasilishwa kiasili na umbo la Kiswahili “mwimbieni Mfalme wetu.” Herufi kubwa inaonyesha kuwa “Mfalme” ni cheo cha Mungu katika muktadha huu.
theological_decisions:
- issue: Cheo cha Mungu cha ufalme
  choice: Mfalme wetu
  alternative: mfalme wetu
  rationale: Muktadha wa zaburi unasherehekea utawala wa Mungu, hivyo “Mfalme” linatumiwa kama cheo chake bila kuongeza fundisho lisilokuwamo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, ya kawaida na yenye hadhi. Mpangilio “mwimbieni ... sifa” umetumiwa ili kudumisha walengwa wa sifa na marudio manne ya kishairi ya maandishi ya Kiebrania.
