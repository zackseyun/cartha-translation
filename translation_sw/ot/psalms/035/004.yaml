review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the imprecatory force, the hostile idiom of seeking the psalmist’s life, the reversal in ‘warudi nyuma,’ and the sense of planning harm. However, ‘waaibishwe’ is a causative-passive (‘let them be shamed by someone’), whereas וְיַחְפְּרוּ is an intransitive expression of becoming ashamed/disgraced. The Swahili should retain that intransitive sense.
  naturalness: The register is natural, standard East African Swahili and suitably poetic. ‘Waaibike na wafedheheke’ and ‘warudi nyuma’ are idiomatic in a prayer/psalm register.
  terminology: ‘Uhai wangu’ appropriately communicates the Hebrew idiom in this hostile context. ‘Wanaonipangia mabaya’ is a clear rendering of those devising evil/harm against the speaker. Replacing the final causative-passive with an intransitive shame expression corrects the verbal nuance.
  issues:
  - severity: medium
    issue: ‘Waaibishwe’ renders the final verb as causative-passive.
    rationale: The Hebrew וְיַחְפְּרוּ means that the plotters themselves become ashamed, confounded, or disgraced; it does not explicitly say that another party causes their shaming. ‘Waaibike’ preserves the intransitive result and the jussive wish.
  revised_text: Waaibike na wafedheheke wale wanaoutafuta uhai wangu; warudi nyuma na waaibike wale wanaonipangia mabaya.
