id: PSA.35.4
reference: Psalms 35:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: יֵבֹ֣שׁוּ וְ/יִכָּלְמוּ֮ מְבַקְשֵׁ֪י נַ֫פְשִׁ֥/י יִסֹּ֣גוּ אָח֣וֹר וְ/יַחְפְּר֑וּ חֹ֝שְׁבֵ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/004.yaml
  text: Let those who seek my life be put to shame and humiliated[b][a]; let those who devise my harm turn back and be disgraced.
translation:
  language: sw
  text: Waaibike na wafedheheke wale wanaoutafuta uhai wangu; warudi nyuma na waaibike wale wanaonipangia mabaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: waaibike
  rationale: Kitenzi hiki huonyesha kupatwa na aibu; umbo la ombi limetolewa kwa ‘wa-’ ili kuhifadhi nguvu ya matamanio/maombi katika muktadha.
- source_word: וְיִכָּלְמוּ
  choice: na wafedheheke
  rationale: ‘Wafedheheke’ huhifadhi uzito wa kuaibishwa na kutwezwa, huku kikitofautishwa kiasi na ‘waaibike’ katika ulinganifu wa kishairi.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: wale wanaoutafuta uhai wangu
  rationale: Katika muktadha wa uhasama, נֶפֶשׁ pamoja na ‘kutafuta’ ni nahau ya kutafuta kuondoa uhai wa mtu; ‘uhai wangu’ ni ya asili na wazi kwa Kiswahili.
- source_word: יִסֹּגוּ אָחוֹר
  choice: warudi nyuma
  rationale: Kirai hiki huonyesha kurudi au kuondolewa katika hatua iliyokusudiwa; ‘warudi nyuma’ huhifadhi picha ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: וְיַחְפְּרוּ
  choice: na waaibishwe
  rationale: Katika mstari huu mzizi huu unahusu kuaibika au kufedheheka, si kuchimba; ‘waaibishwe’ hudumisha uga wa maana wa aibu bila kurudia neno lilelile.
- source_word: חֹשְׁבֵי רָעָתִי
  choice: wale wanaonipangia mabaya
  rationale: חֹשְׁבֵי huonyesha kupanga au kuwaza kwa kusudi, na רָעָתִי hapa ni mabaya yanayokusudiwa dhidi ya mwandishi; ‘wanaonipangia mabaya’ ni fasaha na hudumisha uwezekano mpana wa ‘uovu/madhara dhidi yangu.’
theological_decisions:
- issue: Nguvu ya ombi la laana/hukumu katika vitenzi vya Kiebrania
  choice: Kutumia ‘waaibike ... wafedheheke ... warudi ... waaibishwe’ kama maombi au matamanio.
  alternative: 'Kauli ya wakati ujao: ‘wataaibika ... watarudi nyuma.’'
  rationale: Ingawa maumbo ya Kiebrania yanaweza kufasiriwa kama yasiyokamilika, katika sala hii yanafanya kazi kwa kawaida kama maombi ya hukumu. Kiswahili cha ‘wa-’ huhifadhi ombi hilo bila kuligeuza kuwa utabiri wa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Ulinganifu wa vipashio viwili umehifadhiwa, na msamiati unaeleweka kwa wasomaji wa kawaida bila kuingiza ufafanuzi wa kimadhehebu.
