  yaml_path: translation/ot/psalms/035/005.yaml
  text: May they be like chaff before the wind[a], with the angel of Yahweh driving them away.
translation:
  language: sw
  text: 'Wawe kama makapi mbele ya upepo,[a]

    na malaika wa Yahweh akiwafukuza.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huku malaika wa Yahweh akiwafukuza.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa kwa urahisi kuwa “na”; kitenzi pia kinaweza kumaanisha “akiwasukuma mbali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Na wawe
  rationale: Umbo hili linaeleza ombi au laana katika muktadha, si taarifa rahisi ya wakati ujao.
- source_word: כְּמֹץ
  choice: kama makapi
  rationale: מֹץ ni makapi mepesi yanayopeperushwa wakati wa kupura; Kiswahili hiki kinahifadhi tashbihi.
- source_word: לִפְנֵי רוּחַ
  choice: mbele ya upepo
  rationale: Tafsiri hii inafuata picha halisi ya makapi yaliyo wazi kwa nguvu ya upepo.
- source_word: וּמַלְאַךְ יְהוָה
  choice: huku malaika wa Yahweh
  rationale: Waw linaunganisha tendo la malaika na picha ya makapi; “huku” linaonyesha kitendo kinachoandamana kwa Kiswahili cha kawaida. מַלְאָךְ hapa linaeleweka kwa kawaida kuwa malaika, bila kufafanua zaidi utambulisho wake.
- source_word: דּוֹחֶה
  choice: akiwafukuza
  rationale: Kitenzi דחה kina maana ya kusukuma, kufukuza, au kuondosha kwa nguvu. “Akiwafukuza” ni cha asili na kinahifadhi nguvu pamoja na mwelekeo wa tendo; kiwakilishi cha watendwa kinatokana na muktadha.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Jina la agano limeandikwa moja kwa moja katika Kiebrania; “Yahweh” hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo.
- issue: Utambulisho wa מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  alternative: mjumbe wa Yahweh
  rationale: מַלְאָךְ linaweza kumaanisha mjumbe au malaika, lakini katika msemo huu na muktadha huu maana ya kiumbe wa mbinguni ndiyo ya kawaida zaidi. Tafsiri haiongezi dai kuhusu utambulisho wake zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa mistari unadumisha usambamba wa kishairi wa zaburi.
