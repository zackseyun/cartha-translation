  text: Miongoni mwa wadhihaki wasiomcha Mungu kwenye karamu[a], wananisagia meno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwa wadhihaki wasiomcha Mungu kwa ajili ya keki/tonge”; neno la Kiebrania lililotafsiriwa “kwenye karamu” ni adimu na maana yake si hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַנְפֵי
  choice: Miongoni mwa watu wasiomcha Mungu
  rationale: Nomino inayotokana na חנף inaweza kumaanisha watu wanajisi, waovu, au wanafiki. Katika muktadha huu wa washambulizi wenye dhihaka, ‘watu wasiomcha Mungu’ huonyesha upotovu wa kidini na kimaadili bila kupunguza maana kuwa unafiki tu; kiambishi בְּ kimetafsiriwa kwa maana ya ushirika au mahali, ‘miongoni mwa.’
- source_word: לַעֲגֵי
  choice: wenye kudhihaki
  rationale: Neno hili linatokana na לעג na huonyesha watu wanaodhihaki au kubeza. ‘Wenye kudhihaki’ ni Kiswahili cha kawaida kinachohifadhi uhasama wa tendo hilo.
- source_word: מָעוֹג
  choice: karamuni
  rationale: Neno hili adimu lina maana isiyo hakika. Huenda linahusiana na karamu na dhihaka za mezani, au na keki/kipande cha chakula. ‘Karamuni’ huwasilisha mazingira ya kijamii yanayowezekana, huku tanbihi ikihifadhi kutokuwa na uhakika kwa neno hilo.
- source_word: חָרֹק
  choice: wananisagia
  rationale: Kitenzi חרק humaanisha kusaga au kusaga meno kwa kuonyesha uhasama. Muundo wa kitenzi kamili unaleta Kiswahili cha asili katika mstari huu.
- source_word: עָלַי
  choice: -ni-
  rationale: Kwa kuunganishwa na kitenzi ‘kusagia meno,’ kiambishi cha yambwa ‘-ni-’ huwasilisha kwa kawaida maana ya kuelekeza tendo hilo kwangu.
- source_word: שִׁנֵּימוֹ
  choice: meno
  rationale: Ni wingi wa ‘jino’ wenye kiambishi cha nafsi ya tatu wingi. Katika Kiswahili, mwenye meno anaeleweka tayari kutoka katika kiima ‘wao,’ hivyo ‘meno’ ni ya asili kuliko ‘meno yao,’ bila kupoteza maana.
