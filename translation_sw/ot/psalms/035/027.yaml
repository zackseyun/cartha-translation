  variant: Standard East African Swahili
source:
  edition: WLC
  text: יָרֹ֣נּוּ וְ/יִשְׂמְחוּ֮ חֲפֵצֵ֪י צִ֫דְקִ֥/י וְ/יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל יְהוָ֑ה הֶ֝/חָפֵ֗ץ שְׁל֣וֹם עַבְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/027.yaml
  text: Let those who delight in my vindication shout for joy and be glad[a]; let them say continually, “May Yahweh be magnified[b], who delights in the peace of his servant.”
translation:
  language: sw
  text: Wale wanaofurahia kuthibitishwa kwamba mimi ni mwenye haki wapige kelele za shangwe na wafurahi[a]; na waseme daima, “Yahweh na atukuzwe, yeye anayependezwa na amani[b] ya mtumishi wake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “haki yangu” au “uadilifu wangu.” Neno la Kiebrania linaweza kumaanisha haki katika maana ya kimaadili au ya kisheria; hapa yaelekea linamaanisha kuthibitishwa kwa mtunga-zaburi kuwa mwenye haki.
    reason: lexical_alternative
  - marker: b
    text: “Amani” inaweza pia kumaanisha “hali njema” au “ustawi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרֹנּוּ
  choice: Wapige kelele kwa shangwe
  rationale: Kitenzi רנן kinaeleza kilio chenye shangwe, mara nyingi katika sifa ya hadharani; usemi huu unahifadhi nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: וְיִשְׂמְחוּ
  choice: na kufurahi
  rationale: שמח humaanisha kufurahi; muundo huu unadumisha ulinganifu na mwitikio wa kwanza bila kuufanya kuwa wa kimuziki pekee.
- source_word: חֲפֵצֵי
  choice: wale wanaopendezwa na
  rationale: Kitenzi חפץ hapa ni participio inayoonyesha kupendezwa au kupata furaha katika jambo fulani.
- source_word: צִדְקִי
  choice: kutetewa kwangu kuwa mwenye haki
  rationale: Katika muktadha wa mashitaka na maadui katika zaburi hii, צֶדֶק ina maana ya kisheria ya kuthibitishwa kuwa upande wa haki; usemi huu ni wazi zaidi kwa wasomaji kuliko nomino isiyo ya kawaida ya kifasihi.
- source_word: וְיֹאמְרוּ תָמִיד
  choice: na waseme daima
  rationale: Huhifadhi nguvu ya ombi au matakwa ya vitenzi vya Kiebrania pamoja na hali endelevu ya תָמִיד.
- source_word: יִגְדַּל יְהוָה
  choice: Yahweh na atukuzwe
  rationale: Imperfecti hii ina nguvu ya jussive katika kauli ya sifa; ‘na atukuzwe’ huonyesha matakwa ya ukuu wake kutangazwa badala ya taarifa tambarare.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa unukuzi wa kawaida badala ya kubadilishwa na cheo.
- source_word: הֶחָפֵץ
  choice: yeye anayependezwa na
  rationale: Huhifadhi maana ya kupendezwa na pia mwangwi wa חֲפֵצֵי iliyotokea mapema katika mstari.
- source_word: שְׁלוֹם
  choice: amani
  rationale: ‘Amani’ ndiyo tafsiri ya moja kwa moja ya שָׁלוֹם, huku maana pana ya hali njema ikihifadhiwa katika tanbihi.
- source_word: עַבְדּוֹ
  choice: mtumishi wake
  rationale: Katika Zaburi, עבד kama jina la mwandishi mbele za Mungu hutafsiriwa kwa kawaida na kwa kufaa kama ‘mtumishi,’ si ‘mtumwa.’
theological_decisions:
- issue: Maana ya צִדְקִי kuhusu mtunga-zaburi
  choice: kutetewa kwangu kuwa mwenye haki
  alternative: haki yangu; uadilifu wangu
  rationale: Muktadha wa mgogoro wa kisheria unaelekeza kwenye kuthibitishwa kuwa upande wa haki bila kudai ukamilifu wa kimaadili; maana nyingine halali zimehifadhiwa katika tanbihi.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Unukuzi wa jina binafsi unahifadhi tofauti yake na cheo na kufuata chaguo la mradi.
- issue: Nguvu ya יִגְדַּל katika kauli ya sifa
  choice: na atukuzwe
  alternative: ni mkuu; na ainuliwe
  rationale: Umbo hili linaeleweka vizuri kama jussive ya sifa, si tu taarifa kwamba Yahweh ni mkuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Lugha imewekwa wazi kwa msomaji wa kawaida, huku ulinganifu wa kishairi, nguvu ya matakwa, marudio ya wazo la ‘kupendezwa,’ na utata halisi wa צֶדֶק na שָׁלוֹם vikihifadhiwa.
