  text: יֵ֘בֹ֤שׁוּ וְ/יַחְפְּר֨וּ יַחְדָּו֮ שְׂמֵחֵ֪י רָעָ֫תִ֥/י יִֽלְבְּשׁוּ בֹ֥שֶׁת וּ/כְלִמָּ֑ה הַֽ/מַּגְדִּילִ֥ים עָלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/026.yaml
  text: Let those who rejoice at my harm be put to shame and humiliated together[a]; let those who magnify themselves against me be clothed with shame and disgrace.
translation:
  language: sw
  text: Wote wanaofurahia mabaya yangu waaibike na kufedheheka pamoja; wale wanaojikuza juu yangu[a] wavikwe aibu na fedheha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanaojiinua dhidi yangu” au “wanaojitukuza dhidi yangu.” Kiebrania kinasema kihalisi juu ya kujifanya mkuu juu ya mtu mwingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: waaibike
  rationale: Kauli hii ni ombi lenye nguvu kwamba wapinzani waingie katika hali ya aibu; ‘waaibike’ ni ya kawaida na inaendana na muktadha wa sala.
- source_word: וְיַחְפְּרוּ
  choice: na kufedheheka
  rationale: Kitenzi hiki katika muktadha wa aibu kinaonyesha kudhalilika au kufedheheka; neno hili linaeleweka vizuri katika Kiswahili cha sasa.
- source_word: יַחְדָּו
  choice: pamoja
  rationale: Kielezi hiki kinaonyesha kwamba kundi lote lipatwe na hali hiyo kwa pamoja.
- source_word: שְׂמֵחֵי רָעָתִי
  choice: wanaofurahia madhara yangu
  rationale: רָעָתִי hapa inaelekea kumaanisha madhara au msiba unaompata mwombaji, si uovu wake wa kimaadili.
- source_word: יִלְבְּשׁוּ
  choice: wavikwe
  rationale: Huhifadhi sitiari ya Kiebrania ya kuvaa hali au sifa kama vazi.
- source_word: בֹשֶׁת
  choice: aibu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya nomino hii, na inadumisha wazo kuu la mstari.
- source_word: וּכְלִמָּה
  choice: na fedheha
  rationale: Nomino hii inaongeza na kusisitiza wazo la aibu; ‘fedheha’ huunda jozi ya asili ya Kiswahili pamoja na ‘aibu.’
- source_word: הַמַּגְדִּילִים עָלָי
  choice: wale wanaojikuza juu yangu
  rationale: Huhifadhi taswira ya Kiebrania ya mtu kujifanya mkuu juu ya mwingine, bila kuibana iwe majivuno ya maneno pekee.
