base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/008.yaml
  text: Let destruction come upon him unawares[a], and let the net that he hid catch him[c][b]; into that very destruction let him fall.
translation:
  language: sw
  text: Maangamizi na yamjie bila yeye kujua[a]; wavu wake aliouficha na umnase. Katika maangamizi hayo na aanguke[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Maangamizi na yamjie ghafula.” Kiebrania kinasema kihalisi, “Maangamizi na yamjie; yeye hajui.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi, “Katika maangamizi na aanguke ndani yake.” “Ndani yake” huenda ikarejelea maangamizi kwa msisitizo, au wavu aliouficha, yaani, “na aanguke ndani ya wavu huo.”
    reason: alternative_reading
lexical_decisions:
- source_word: תְּבוֹאֵהוּ
  choice: na yamjie
  rationale: Kitenzi בוא kina maana ya ‘kuja’ na hapa kina kiambishi cha kumwelekea mtu. Muundo wa ‘na yamjie’ unaonyesha ombi au laana ya kishairi bila kugeuza maana kuwa taarifa ya uhakika.
- source_word: שׁוֹאָה
  choice: maangamizi
  rationale: Neno hili humaanisha uharibifu mkubwa, msiba, au uangamivu. ‘Maangamizi’ ni neno la kawaida, lenye uzito wa kishairi, na linafaa katika sehemu zote mbili.
- source_word: לֹא יֵדָע
  choice: bila yeye kujua
  rationale: Huhifadhi kwa uwazi muundo wa Kiebrania, ‘hajui,’ na kueleza kwamba maangamizi yatamjia bila kuwa na habari nayo.
- source_word: וְרִשְׁתּוֹ אֲשֶׁר טָמַן
  choice: wavu wake aliouficha
  rationale: Kiambishi katika רִשְׁתּוֹ kinaonyesha kuwa ni wavu wake mwenyewe, na טמן humaanisha kuuficha au kuuweka kwa siri kama mtego.
- source_word: תִּלְכְּדוֹ
  choice: na umnase
  rationale: Katika muktadha wa wavu, ‘kunasa’ ni kitenzi cha asili na sahihi kwa maana ya לכד, ‘kukamata.’
- source_word: בְּשׁוֹאָה יִפָּל בָּהּ
  choice: Katika maangamizi hayo na aanguke
  rationale: 'Tafsiri hii inaelewa kishazi cha mwisho kama muundo wa msisitizo unaorejelea tena maangamizi: ‘katika maangamizi ... ndani yake.’ Pia inasikika kwa kawaida katika Kiswahili, huku uwezekano wa kiwakilishi kurejelea wavu ukihifadhiwa katika tanbihi.'
theological_decisions:
- issue: Kauli ya ombi la hukumu dhidi ya adui
  choice: Muundo wa ‘na ...’ umetumiwa kuonyesha ombi la kishairi
  alternative: 'Kutafsiri kama taarifa ya wakati ujao: ‘maangamizi yatamjia’'
  rationale: Vitenzi vya Kiebrania katika muktadha huu vina nguvu ya matakwa au ombi. Tafsiri haibadili ombi hilo kuwa unabii wa uhakika wala hailainishi mvutano wake.
- issue: Kirejeleo cha בָּהּ katika kishazi cha mwisho
  choice: Kimeeleweka kuwa kinarejelea ‘maangamizi’ kwa msisitizo
  alternative: 'Kinaweza kurejelea ‘wavu,’ hivyo: ‘na aanguke ndani yake’'
  rationale: Nomino zote mbili ni za kike katika Kiebrania, hivyo kirejeleo kina utata halisi. Mpangilio wa maneno unaunga mkono kurejelea maangamizi, lakini tafsiri nyingine imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na uzito wa kishairi. Muundo wa ‘na yamjie ... na umnase ... na aanguke’ unadumisha mfululizo wa matakwa ya Kiebrania bila kuwa mgumu kwa msomaji wa kawaida.
