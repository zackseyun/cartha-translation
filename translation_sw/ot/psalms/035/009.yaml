lexical_decisions:
- source_word: וְנַפְשִׁי
  choice: Ndipo nafsi yangu
  rationale: נֶפֶשׁ hapa inaonyesha nafsi au mtu mwenyewe kwa ndani. Kiunganishi וְ kimetafsiriwa “Ndipo” ili kuonyesha kwamba furaha hii inafuata ukombozi unaotazamiwa katika muktadha uliotangulia.
- source_word: תָּגִיל
  choice: itakapofurahi
  rationale: Kitenzi גיל huonyesha kufurahi. Umbo la “itakapofurahi” linaungana kiasili na “Ndipo” na kudumisha matarajio ya tendo la baadaye.
- source_word: בַּיהוָה
  choice: katika Yahweh
  rationale: Kihusishi ב kimedumishwa kwa maana ya eneo au msingi wa furaha, huku jina la agano יְהוָה likitolewa kama “Yahweh.”
- source_word: תָּשִׂישׂ
  choice: itashangilia
  rationale: שׂישׂ huonyesha furaha kubwa au kushangilia. “Itashangilia” inadumisha nguvu yake na utofauti wa kishairi na “itakapofurahi.”
- source_word: בִּישׁוּעָתוֹ
  choice: kwa wokovu wake
  rationale: יְשׁוּעָה inaweza kuwa wokovu au ukombozi. “Wokovu” inadumisha upana wa neno, ilhali muktadha unahusu pia kuokolewa kutoka kwa maadui. “Kwa” ni Kiswahili cha kawaida kinachoonyesha msingi wa kushangilia.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יְהוָה moja kwa moja; “Yahweh” hulidumisha kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya יְשׁוּעָה katika muktadha wa kuokolewa kutoka kwa maadui
  choice: wokovu
  alternative: ukombozi
  rationale: “Wokovu” huhifadhi maana pana ya neno bila kufuta maana halisi ya kuokolewa katika zaburi hii; uwezekano wa “ukombozi” umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka kwa wasomaji wa kawaida. Ulinganifu wa vitenzi viwili vya furaha umehifadhiwa kwa “furahi” na “shangilia,” bila kuvifanya viwe na maana ileile kabisa.
