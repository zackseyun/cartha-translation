  text: אֲדֹנָ/י֮ כַּ/מָּ֪ה תִּ֫רְאֶ֥ה הָשִׁ֣יבָ/ה נַ֭פְשִׁ/י מִ/שֹּׁאֵי/הֶ֑ם מִ֝/כְּפִירִ֗ים יְחִידָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/017.yaml
  text: Lord, how long will you look on? Restore my life from their ravages, my only one from the young lions.
translation:
  language: sw
  text: Ee Bwana, utatazama mpaka lini? Uurudishe uhai wangu kutoka katika maangamizi yao, uhai wangu wa pekee kutoka kwa simba wachanga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Ee Bwana
  rationale: Neno hili ni mwito wa moja kwa moja kwa Mungu; “Ee Bwana” ni Kiswahili cha kawaida, chenye heshima, na huhifadhi hali ya ombi.
- source_word: כַּמָּה תִרְאֶה
  choice: utatazama mpaka lini?
  rationale: Nahau hii inauliza Mungu ataendelea kuwa mtazamaji bila kuingilia mpaka lini; tafsiri inahifadhi swali na mvutano wake bila kuongeza ufafanuzi.
- source_word: הָשִׁיבָה נַפְשִׁי
  choice: Okoa maisha yangu
  rationale: Katika muktadha wa hatari, נֶפֶשׁ humaanisha uhai au maisha ya mtu; הָשִׁיבָה hapa ni ombi la kuurudisha au kuuokoa uhai kutoka hatarini.
- source_word: מִשֹּׁאֵיהֶם
  choice: kutokana na maangamizi yao
  rationale: Umbo hili ni gumu na huenda likarejelea uharibifu au maangamizi yanayosababishwa nao; uchaguzi huu unafuata ushahidi wa WLC na huepuka kubainisha zaidi ya maandishi.
- source_word: מִכְּפִירִים
  choice: kutoka kwa simba wachanga
  rationale: כְּפִירִים humaanisha simba wachanga wenye nguvu, picha ya washambuliaji hatari.
- source_word: יְחִידָתִי
  choice: maisha yangu pekee
  rationale: Neno linaweza kumaanisha kilicho cha pekee au cha thamani sana, na kishairi hutaja uhai wa mtu; muundo huu huhifadhi msisitizo wa kwamba anao uhai mmoja tu.
theological_decisions:
- issue: Maana ya נַפְשִׁי na יְחִידָתִי
  choice: Zote zimetafsiriwa zikirejelea maisha/uhai wa mwombaji.
  alternative: “nafsi yangu” na “mmoja wangu wa pekee”
  rationale: Muktadha ni kuokolewa kutoka kwa washambuliaji wanaofananishwa na simba; lugha ya uhai ni ya kawaida na haingizi mgawanyo wa kimetafizikia wa mwili na nafsi.
- issue: Mungu ‘kutazama’ bila kuingilia
  choice: Swali limehifadhiwa moja kwa moja.
  alternative: “utavumilia mpaka lini?”
  rationale: Maandishi yanatumia kitenzi ‘kuona/kutazama’; kuyabadilisha kuwa ‘kuvumilia’ kungetatua kwa tafsiri kile ambacho zaburi inaacha katika mvutano wa kilio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Urudiaji wa “maisha yangu” unahifadhi ulinganifu wa kishairi wa Kiebrania na msisitizo wa uhai wa mwombaji.
