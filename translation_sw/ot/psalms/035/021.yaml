lexical_decisions:
- source_word: וַיַּרְחִיבוּ ... פִּיהֶם
  choice: Walinifungulia vinywa vyao kwa upana
  rationale: Hifili ya רחב ina maana halisi ya ‘kufanya kipana’; pamoja na ‘kinywa’ inaonyesha kufungua kinywa sana kwa dhihaka au majivuno. Kiswahili kimetumia wingi wa kugawanya, ‘vinywa vyao,’ kwa sababu ya kiima cha wingi.
- source_word: עָלַי
  choice: walinifungulia
  rationale: Kiambishi cha yambwa ‘-ni-’ pamoja na muundo huu huwasilisha kwamba tendo la uhasama lilielekezwa dhidi ya msemaji; tafsiri ya kikanuni zaidi ingekuwa ‘dhidi yangu.’
- source_word: הֶאָח הֶאָח
  choice: Aha! Aha!
  rationale: Kihisishi hiki huonyesha furaha ya kijicho au shangwe ya dhihaka. Kurudia kwake kumehifadhiwa.
- source_word: רָאֲתָה עֵינֵינוּ
  choice: Macho yetu yameona
  rationale: Kiebrania kina kitenzi cha umoja pamoja na usemi wa pamoja unaomaanisha ‘macho yetu.’ Kiswahili cha kawaida hutumia upatanisho wa wingi bila kuongeza yambwa lisilotajwa wazi.
