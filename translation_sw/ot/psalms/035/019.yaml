  yaml_path: translation/ot/psalms/035/019.yaml
  text: Do not let my enemies falsely rejoice over me[b][a], nor let those who hate me without cause wink the eye.
translation:
  language: sw
  text: Usiwaache adui zangu washangilie juu yangu kwa uongo[a], wala wale wanaonichukia bila sababu wasikonyeze jicho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “adui zangu waongo.” Kifungu cha Kiebrania ni kifupi na kinaweza kumaanisha adui wanaotenda kwa uongo au adui wenye sifa ya uongo.
    reason: lexical_alternative
  - marker: b
    text: Hapa “kukonyeza jicho” ni kutoa ishara ya siri yenye nia mbaya, ya dharau, au ya kupanga njama.
    reason: cultural_note
lexical_decisions:
- source_word: אַל יִשְׂמְחוּ לִי
  choice: Usiwaache ... washangilie juu yangu
  rationale: Muundo huu unawasilisha ombi la kukataza linaloelekezwa kwa Mungu. “Washangilie juu yangu” inadumisha wazo la maadui kufurahia kwa ushindi juu ya mtunga zaburi bila kuongeza wazi tukio la kuanguka au kushindwa ambalo halikutajwa moja kwa moja.
- source_word: אֹיְבַי שֶׁקֶר
  choice: adui zangu ... kwa uongo
  rationale: Kifungu cha Kiebrania ni kifupi na kinaweza kuwaeleza adui kuwa waongo au kuonyesha kwamba wanatenda kwa uongo. Tafsiri kuu inaunganisha שֶׁקֶר na mwenendo wao, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: שֹׂנְאַי חִנָּם
  choice: wale wanaonichukia bila sababu
  rationale: Hii inadumisha hali endelevu ya chuki iliyo katika umbo la kishiriki na maana ya חִנָּם kuwa chuki isiyo na msingi halali.
- source_word: יִקְרְצוּ עָיִן
  choice: wasikonyeze jicho
  rationale: Tafsiri hii inadumisha picha halisi ya ishara ya jicho. Kwa kuwa kukonyeza kunaweza kueleweka kwa namna isiyo ya uadui katika Kiswahili, tanbihi inafafanua maana yake katika muktadha huu.
