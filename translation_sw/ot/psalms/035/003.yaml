  yaml_path: translation/ot/psalms/035/003.yaml
  text: Draw the spear and block the way against those who pursue me[a]; say to my soul[b], “I am your salvation.”
translation:
  language: sw
  text: Chomoa mkuki, uwazuilie njia wanaonifuatilia[a]; iambie nafsi yangu[b], “Mimi ni wokovu wako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Chomoa mkuki na shoka la vita dhidi ya wanaonifuatilia,” ikiwa וּסְגֹר linaeleweka kuwa jina la silaha badala ya kitenzi “zuia njia” au “funga.”
    reason: alternative_reading
  - marker: b
    text: Au “ukombozi wako.” Neno la Kiebrania linaweza kumaanisha kuokolewa katika hatari ya sasa, na pia wokovu kwa maana pana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרֵק
  choice: Uchomoe
  rationale: Kitenzi cha Kiebrania katika kauli ya kuamuru kina maana ya kutoa au kuchomoa silaha. “Uchomoe” ni Kiswahili cha kawaida na kinadumisha taswira ya vita.
- source_word: חֲנִית
  choice: mkuki
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa silaha inayotajwa hapa.
- source_word: וּסְגֹר
  choice: uzuie njia
  rationale: Maana ya msingi ni kufunga au kuzuia. Kwa kuwa kitu kinachozuiwa hakikutajwa wazi, “uzuie njia” huwasilisha maana inayodokezwa na muktadha bila kubadili hatua kuwa shambulio.
- source_word: לִקְרַאת רֹדְפָי
  choice: ya wanaonifuatilia
  rationale: רֹדְפָי ni wale wanaomwandama mwombaji kwa uhasama. “Wanaonifuatilia” linaonyesha tendo linaloendelea; wazo la kuwakabili linabebwa na kauli “uzuie njia.”
- source_word: אֱמֹר לְנַפְשִׁי
  choice: iambie nafsi yangu
  rationale: “Nafsi yangu” inadumisha lugha ya kishairi na ya ndani ya נֶפֶשׁ badala ya kuifanya tu kuwa “niambie.”
- source_word: יְשֻׁעָתֵךְ אָֽנִי
  choice: Mimi ni wokovu wako
  rationale: Mpangilio huu unadumisha msisitizo wa kiwakilishi אָֽנִי na upeo mpana wa יְשׁוּעָה, huku ukiendelea kufaa katika muktadha wa kuokolewa kutoka hatarini.
theological_decisions:
- issue: Maana ya יְשׁוּעָה katika ombi la kuokolewa vitani
  choice: wokovu
  alternative: ukombozi
  rationale: Muktadha wa karibu unahusu kuokolewa kutoka kwa maadui, lakini neno la Kiebrania linaweza kuwa na maana pana zaidi. “Wokovu” huhifadhi upeo huo bila kulazimisha fundisho la baadaye ndani ya mstari.
- issue: Utambulisho wa וּסְגֹר kama kitenzi au jina la silaha
  choice: kitenzi, “uzuie njia”
  alternative: jina la silaha, “shoka la vita”
  rationale: Uchanganuzi wa kawaida unaichukua kama kauli ya kuamuru ya kitenzi “kufunga/kuzuia,” lakini uwezekano wa kuwa jina la silaha ni wa kale na una maana ya kutosha kuhifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa lakini yenye hadhi ya kishairi. Kauli za kuamuru zinaelekezwa kwa Mungu kwa heshima; “nafsi yangu” imehifadhiwa ili kutopoteza nguvu ya kishairi ya Kiebrania.
