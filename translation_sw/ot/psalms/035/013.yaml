  text: וַ/אֲנִ֤י בַּ/חֲלוֹתָ֡/ם לְב֬וּשִׁ/י שָׂ֗ק עִנֵּ֣יתִי בַ/צּ֣וֹם נַפְשִׁ֑/י וּ֝/תְפִלָּתִ֗/י עַל חֵיקִ֥/י תָשֽׁוּב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/013.yaml
  text: But as for me[a], when they were sick, my clothing was sackcloth; I humbled myself with fasting[c][b], and my prayer returned to my own bosom.
translation:
  language: sw
  text: Lakini mimi, walipokuwa wagonjwa, vazi langu lilikuwa la gunia[a]; nilijinyenyekeza kwa kufunga[b], na sala yangu ilinirejea kifuani mwangu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguo ya gunia ilikuwa vazi gumu lililovaliwa wakati wa maombolezo, dhiki au toba.
    reason: cultural_note
  - marker: b
    text: 'Kwa neno kwa neno katika Kiebrania: “Niliitesa nafsi yangu kwa kufunga,” yaani nilijinyenyekeza kwa kujinyima chakula.'
    reason: lexical_alternative
  - marker: c
    text: Maana nyingine zinazowezekana ni “sala yangu ilirudi bila kujibiwa” au “sala yangu ilinirudia kwa faida yangu.” Nahau ya Kiebrania inaweza kumaanisha kwamba maombezi yake hayakubadili uadui wao, au kwamba manufaa yake yalimrudia yeye.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֲלוֹתָם
  choice: walipokuwa wagonjwa
  rationale: Muundo wa ב pamoja na kitenzi-jina na kiambishi cha nafsi ya tatu wingi unaonyesha wakati walipokuwa wagonjwa; tafsiri hii ni ya kawaida na huhifadhi maana ya wakati.
- source_word: לְבוּשִׁי שָׂק
  choice: vazi langu lilikuwa nguo ya gunia
  rationale: Huhifadhi kishazi kisicho na kitenzi cha Kiebrania na kusisitiza hali ya mwombolezaji badala ya kukibadili kuwa tendo la kuvaa.
- source_word: עִנֵּיתִי בַצּוֹם נַפְשִׁי
  choice: nilijinyenyekeza kwa kufunga
  rationale: Kwa kuhusishwa na kufunga, ענה katika piel pamoja na נַפְשִׁי ni nahau ya kujitesa au kujinyenyekeza; Kiswahili hiki huwasilisha maana kwa kawaida bila tafsiri ngumu ya neno kwa neno.
- source_word: וּתְפִלָּתִי
  choice: na sala yangu
  rationale: Tafsiri ya moja kwa moja ya nomino, huku kiunganishi kikihusisha sala yake na maombolezo na kufunga kwake.
- source_word: עַל חֵיקִי תָשׁוּב
  choice: ilinirejea kifuani
  rationale: חֵיק inaweza kumaanisha kifua, kifuani au mapajani, na שוב humaanisha kurudi. Taswira ya Kiebrania imehifadhiwa kwa sababu maana kamili ya nahau hiyo haijulikani kwa hakika.
theological_decisions:
- issue: Maana ya kauli kwamba sala ilirudi kifuani
  choice: 'Kuhifadhi taswira ya Kiebrania: “sala yangu ilinirejea kifuani.”'
  alternative: Sala yangu ilirudi bila kujibiwa; au sala yangu ilinirudia kwa faida yangu.
  rationale: Nahau ya Kiebrania ina utata wa kweli. Inaweza kuonyesha kwamba maombezi hayakubadili uadui wao au kwamba manufaa ya sala yalimrudia mwombaji; matini kuu haipaswi kulazimisha mojawapo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nguo ya gunia” inaeleweka zaidi kuliko “gunia” peke yake kama aina ya vazi la maombolezo. Alama zote za tanbihi zimewekwa mara tu baada ya vifungu vinavyohusika.
