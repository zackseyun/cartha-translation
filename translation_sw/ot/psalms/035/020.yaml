  text: For they do not speak peace[a], but against the quiet ones of the land they devise deceitful words.
translation:
  language: sw
  text: Kwa maana hawasemi maneno ya amani,[a] bali dhidi ya watu waishio kwa utulivu katika nchi hupanga maneno ya udanganyifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawasemi kwa amani” au “hawasemi kuhusu amani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya ombi au malalamiko yaliyotangulia na inafaa katika mtiririko wa kishairi.
- source_word: לֹא שָׁלוֹם יְדַבֵּרוּ
  choice: hawasemi maneno ya amani
  rationale: Inadumisha neno 'amani' kama lengo la usemi, badala ya kuligeuza kuwa kielezi, huku ikisikika kwa kawaida katika Kiswahili.
- source_word: שָׁלוֹם
  choice: amani
  rationale: Hili ndilo neno la kawaida lenye maana kuu ya amani, pamoja na vidokezo vya hali njema.
- source_word: וְעַל
  choice: bali ... watu
  rationale: '''Bali'' huonyesha utofautishaji kati ya kutosema kwa amani na kuwafanyia hila watu watulivu; uhusiano wa עַל unaonyeshwa na muundo wa kitenzi ''wanawatungia''.'
- source_word: רִגְעֵי אֶרֶץ
  choice: watu waishio kwa utulivu nchini
  rationale: Inaeleza kwa Kiswahili cha kawaida watu wanaoishi maisha ya utulivu na amani katika nchi, bila kuwafanya kuwa sifa ya kijiografia.
- source_word: דִּבְרֵי מִרְמוֹת
  choice: maneno ya udanganyifu
  rationale: Inahifadhi muundo wa nomino wa Kiebrania na kueleza wazi tabia ya maneno hayo.
- source_word: יַחֲשֹׁבוּן
  choice: wanawatungia
  rationale: Katika muktadha huu kitenzi kinaonyesha kubuni au kupanga kwa makusudi; 'wanawatungia' huunganisha kwa kawaida kupanga huko na maneno ya udanganyifu.
