  text: רָאִ֣יתָה יְ֭הוָה אַֽל תֶּחֱרַ֑שׁ אֲ֝דֹנָ֗/י אֲל תִּרְחַ֥ק מִמֶּֽ/נִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/022.yaml
  text: You have seen[a], O Yahweh; do not be silent. O Lord, do not be far from me.
translation:
  language: sw
  text: Umeona, ee Yahwe; usinyamaze. Ee Bwana, usiwe mbali nami.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאִיתָה
  choice: Umeona
  rationale: Kauli timilifu ya Qal, nafsi ya pili umoja wa kiume, inamwelekea Mungu moja kwa moja na kuonyesha kwamba tayari ameona dhuluma inayolalamikiwa.
- source_word: יְהוָה
  choice: ee Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna ya kulitaja moja kwa moja, likitofautishwa na cheo אֲדֹנָי kinachofuata.
- source_word: אַל תֶּחֱרַשׁ
  choice: usinyamaze
  rationale: Kitenzi חרשׁ hapa kina maana ya kunyamaza; ombi hili pia linaashiria kutotenda au kutojibu, bila kuondoa picha ya msingi ya ukimya.
- source_word: אֲדֹנָי
  choice: Ee Bwana
  rationale: Hiki ni cheo cha Mungu, ‘Bwana’; katika matumizi haya umbo lake halilazimishi tafsiri ‘Bwana wangu.’
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: usiwe mbali nami
  rationale: רחק pamoja na מן huonyesha kuwa mbali na mtu. Kiswahili ‘mbali nami’ ni cha kawaida na kinahifadhi sitiari ya umbali wa kimahusiano na kieneo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, tofauti na cheo אֲדֹנָי katika mstari huohuo; hivyo tofauti hiyo imehifadhiwa kwa ‘Yahwe’ na ‘Bwana.’
- issue: Maana pana ya ukimya wa Mungu
  choice: usinyamaze
  alternative: usiendelee kunyamaza / usikae bila kutenda
  rationale: Tafsiri inahifadhi maana halisi ya חרשׁ na haifanyi maana inayodokezwa ya kutotenda kuwa tafsiri pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Kihisishi ‘ee’ kimetumiwa katika miito ya moja kwa moja. Hakuna tanbihi iliyoongezwa kwa kuwa tanbihi ya Kiingereza iliyoripotiwa haipatani na neno lililowekewa alama, na ‘usinyamaze’ tayari huwasilisha maana ya Kiebrania waziwazi.
