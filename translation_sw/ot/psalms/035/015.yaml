  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya Kiebrania yamehifadhiwa, na kutokuwa na uhakika kwa נֵכִים, וְלֹא יָדַעְתִּי, na וְלֹא דָמּוּ kumeonyeshwa kwa tanbihi bila kulazimisha ufafanuzi mmoja.
