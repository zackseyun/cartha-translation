base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/015.yaml
  text: But at my stumbling they rejoiced and gathered together[a]; they gathered against me—strangers whom I did not know[d][c][b]. They tore at me and did not stop.
translation:
  language: sw
  text: Lakini nilipojikwaa walifurahi na kukusanyika pamoja[a]; walikusanyika dhidi yangu—washambulizi ambao sikuwajua[b]. Walinirarua, wala hawakuacha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nilipochechemea” au “wakati nilipokuwa dhaifu.” Kiebrania kinaweza kumaanisha ulemavu wa mwili au, kwa upana zaidi, wakati wa udhaifu au anguko.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “washambulizi” ni adimu na maana yake si hakika. Huenda likamaanisha “wapigaji,” au labda “walemavu/walioteseka.” Pia kifungu kinaweza kutafsiriwa, “washambulizi wakakusanyika dhidi yangu, nami sikujua.”
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: Au, “walinirarua, wala hawakunyamaza,” ikiwa picha hiyo inaeleza matusi yasiyokoma badala ya shambulio la mwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְצַלְעִי
  choice: nilipojikwaa
  rationale: Neno צלע linaweza kuashiria kuchechemea, ulemavu, kujikwaa, au hali ya udhaifu. Katika muktadha huu, “nilipojikwaa” ni Kiswahili cha kawaida kinachoweza kueleza anguko au wakati wa udhaifu bila kulazimisha maana ya jeraha la mwili.
- source_word: שָׂמְחוּ
  choice: walifurahi
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi שמח, ikionyesha furaha ya maadui juu ya taabu ya mtunga zaburi.
- source_word: וְנֶאֱסָפוּ / נֶאֶסְפוּ
  choice: na kukusanyika pamoja; walikusanyika
  rationale: Marudio ya kitenzi אסף yamehifadhiwa ili kuonyesha msisitizo wa Kiebrania.
- source_word: עָלַי
  choice: dhidi yangu
  rationale: Ingawa maana ya msingi ni “juu yangu,” muktadha wa uadui unafanya “dhidi yangu” iwe ya asili na sahihi zaidi katika Kiswahili.
- source_word: נֵכִים
  choice: washambulizi
  rationale: Neno hili adimu halina maana iliyo hakika. Katika muktadha wa kukusanyika kwa uadui na kurarua, “washambulizi” huwasilisha uwezekano wa watu wanaopiga au kushambulia; uwezekano mwingine umehifadhiwa katika tanbihi.
- source_word: וְלֹא יָדַעְתִּי
  choice: ambao sikuwajua
  rationale: Kifungu kimeunganishwa na נֵכִים kama maelezo ya watu ambao mtunga zaburi hakuwajua. Hata hivyo, Kiebrania kinaweza pia kumaanisha kwamba hakujua kuhusu kukusanyika au njama yao, jambo lililotajwa katika tanbihi.
- source_word: קָרְעוּ
  choice: walinirarua
  rationale: קרע humaanisha kurarua au kupasua. Tafsiri hii huhifadhi picha kali bila kuamua ikiwa shambulio lilikuwa la mwili au la maneno.
- source_word: וְלֹא דָמּוּ
  choice: wala hawakuacha
  rationale: דמם inaweza kumaanisha kunyamaza au kukoma. “Hawakuacha” inaonyesha mwendelezo wa shambulio, huku uwezekano wa “hawakunyamaza” ukihifadhiwa katika tanbihi.
