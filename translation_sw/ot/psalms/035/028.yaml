lexical_decisions:
- source_word: וּלְשׁוֹנִי
  choice: Na ulimi wangu
  rationale: Inahifadhi kiunganishi na sitiari ya kawaida ya Kiebrania inayotumia “ulimi” kumaanisha usemi wa mtu.
- source_word: תֶּהְגֶּה
  choice: utanena kuhusu
  rationale: Kitenzi kinaweza kumaanisha kunong’ona, kutafakari, au kutamka. Kwa kuwa “ulimi” ndio kiima na muktadha ni wa sifa, hapa kinaelekea kumaanisha usemi unaosikika; “utanena kuhusu” ni Kiswahili cha kawaida bila kubainisha kupita kiasi namna au sauti ya usemi.
- source_word: צִדְקֶךָ
  choice: haki yako
  rationale: “Haki” katika Kiswahili inaweza kujumuisha unyofu wa Mungu na tendo lake la kutenda kwa haki, hivyo inadumisha upana wa neno la Kiebrania katika muktadha wa kumtetea mtunga-zaburi.
- source_word: כָּל הַיּוֹם
  choice: mchana kutwa
  rationale: Ni usemi wa asili wa Kiswahili unaomaanisha katika muda wote wa siku na unaodumisha nguvu ya mwendelezo.
- source_word: תְּהִלָּתֶךָ
  choice: sifa zako
  rationale: Inadumisha nomino ya Kiebrania na maana yake ya sifa zinazomhusu au kuelekezwa kwa Mungu.
theological_decisions:
- issue: Maana ya צִדְקֶךָ katika muktadha wa Mungu kumtetea mwombaji
  choice: haki yako
  alternative: uadilifu wako; hukumu yako ya haki
  rationale: “Haki yako” haifungi maana katika tabia ya kimaadili pekee wala katika hukumu pekee, bali inaacha pamoja unyofu wa Mungu na tendo lake la haki la kumtetea mwombaji.
- issue: Je, תֶּהְגֶּה ni kutafakari au kusema kwa sauti
  choice: utanena kuhusu
  alternative: utatafakari juu ya; utanong’ona kuhusu
  rationale: Ulimi kuwa kiima pamoja na muktadha wa sifa unaunga mkono usemi unaotamkwa, lakini tanbihi inadumisha upana halisi wa kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Mchana kutwa” ni usemi wa kawaida na wenye mtiririko mzuri; “haki yako” inadumisha upana wa kitheolojia wa Kiebrania.
