  text: Na ulimi wangu utanena kuhusu haki yako[a], na sifa zako mchana kutwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uadilifu wako.” Neno la Kiebrania linaweza kumaanisha uadilifu na pia haki, hasa katika muktadha wa Mungu kumtetea mtu.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi kilichotafsiriwa “utanena” kinaweza pia kumaanisha “utatafakari” au “utanong’ona.” Kwa kuwa ulimi ndio kiima na muktadha ni wa sifa, hapa kinaelekea kumaanisha usemi unaotamkwa.
