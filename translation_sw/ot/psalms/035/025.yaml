  text: Let them not say in their heart[a], “Aha, our desire!” Let them not say, “We have swallowed him up.”
translation:
  language: sw
  text: Wasije wakasema mioyoni mwao, “Ahaa, tulichotamani!”[a] Wasije wakasema, “Tumemmeza.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza pia kutafsiriwa “nafsi yetu,” “kile tulichotamani,” au “hamu yetu.” Katika muktadha huu linaweza kueleza tamaa yao au kuridhika kwao.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יֹאמְרוּ
  choice: Wasije wakasema
  rationale: Muundo wa Kiebrania unaonyesha ombi hasi kuhusu maneno ya maadui. Kiswahili ‘Wasije wakasema’ huwasilisha kwa kawaida ombi hilo bila kulifanya kuwa amri ya moja kwa moja kwao.
- source_word: בְלִבָּם
  choice: mioyoni mwao
  rationale: Huhifadhi taswira ya Kiebrania ya kusema ndani ya moyo, yaani kujisemea au kuwaza kwa siri; wingi ni wa kawaida kwa Kiswahili kwa kundi la watu.
- source_word: הֶאָח
  choice: Ahaa
  rationale: Ni mshangao wa furaha yenye nia mbaya au wa kujigamba baada ya kudhani wameshinda.
- source_word: נַפְשֵׁנוּ
  choice: tumepata tulichotamani
  rationale: Ingawa נֶפֶשׁ kimsingi inaweza kumaanisha nafsi, uhai, au mtu, katika mshangao huu inaelekea kueleza tamaa au kuridhika kwa ndani. Kauli hii ya Kiswahili huwasilisha maana hiyo kwa uwazi na kwa lugha ya kawaida.
- source_word: בִּלַּעֲנוּהוּ
  choice: Tumemmeza kabisa
  rationale: Huhifadhi sitiari hai ya kumeza na kueleza majivuno yao kwamba wamemwangamiza au kumshinda kikamilifu; ‘kabisa’ huakisi nguvu ya wazo la kummeza mtu mzima.
