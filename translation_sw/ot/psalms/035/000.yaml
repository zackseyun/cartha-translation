base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/000.yaml
  text: Of David[a]. Contend, Yahweh, with those who contend with me[b]; fight against those who fight against me.
translation:
  language: sw
  text: Ya Daudi. Ee YHWH, pinga wale wanaonipinga; pigana na wale wanaopigana nami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kitenzi cha Kiebrania kilichotafsiriwa “pinga” kinaweza pia kuwa na maana ya kutetea au kuendesha shauri la kisheria: “Ee YHWH, utete shauri langu dhidi ya wapinzani wangu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Kichwa hiki kinaweza kuonyesha uhusiano wa zaburi na Daudi—kwa maana ya kuwa yake, kuandikwa naye, au kumhusu—bila kulazimisha maana moja.
- source_word: רִיבָה ... אֶת־יְרִיבַי
  choice: pinga wale wanaonipinga
  rationale: Mzizi ריב unaweza kuwa na maana ya kushindana au kutetea kesi mahakamani. 'Pinga' huhifadhi maana pana na kurudia kwa mzizi katika Kiebrania.
- source_word: יְהוָה
  choice: YHWH
  rationale: Huwakilisha jina binafsi la Mungu katika maandishi ya Kiebrania bila kulibadilisha kuwa cheo.
- source_word: לְחַם אֶת־לֹחֲמָי
  choice: pigana na wale wanaopigana nami
  rationale: Huhifadhi usambamba na urudiaji wa mzizi לחם kwa Kiswahili cha kawaida na chenye hadhi.
theological_decisions:
- issue: Maana ya kisheria ya ריב
  choice: pinga wale wanaonipinga
  alternative: nitetee katika kesi dhidi ya wanaonishtaki
  rationale: Maandishi yanaweza kueleweka kwa upana kama mapambano au kwa namna ya shauri la kisheria; tafsiri kuu haifungi maana kwenye mazingira ya mahakama, na tanbihi huhifadhi uwezekano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Ombi la moja kwa moja 'Ee YHWH' na usambamba wa kishairi vimehifadhiwa; lugha imeepuka istilahi za kimadhehebu.
