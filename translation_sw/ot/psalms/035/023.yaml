base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/023.yaml
  text: Awake and rise up for my judgment[a], my God and my Lord[c][b], for my cause.
translation:
  language: sw
  text: Amka, uinuke kwa ajili ya hukumu yangu[a], Ee Mungu wangu na Bwana wangu, kwa ajili ya shauri langu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa ajili ya haki yangu” au “ili unithibitishe kuwa mwenye haki.” Neno la Kiebrania linaweza kumaanisha hukumu, haki, au uamuzi unaompatia mtu haki katika shauri.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa ajili ya kesi yangu.” Neno la Kiebrania humaanisha shauri, mzozo, au dai la kisheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעִירָה
  choice: Amka
  rationale: Kitenzi hiki ni ombi la dhati kwa Mungu aache hali inayoonekana kama kutotenda na aingilie kati. “Amka” huhifadhi sitiari hiyo kwa Kiswahili cha kawaida.
- source_word: וְהָקִיצָה
  choice: uinuke
  rationale: Kitenzi cha pili cha kuamka kinaimarisha ombi la kwanza. “Uinuke” huepuka marudio yasiyo ya kawaida huku kikidumisha ulinganifu na dharura ya vitenzi viwili.
- source_word: לְמִשְׁפָּטִי
  choice: ili unitendee haki
  rationale: מִשְׁפָּט inaweza kumaanisha hukumu, haki, au kuthibitishwa kuwa mwenye haki katika mazingira ya kisheria. Tafsiri hii ni ya asili kwa Kiswahili na inaonyesha ombi la mwombaji kwamba Mungu aamue kwa niaba yake bila kufunga maana katika neno moja tu la kisheria.
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Ni umbo la kumiliki linalotumiwa kama mwito wa moja kwa moja.
- source_word: וַאדֹנָי
  choice: na Bwana wangu
  rationale: אֲדֹנָי ni cheo cha heshima kinachomwelekea Mungu. “Bwana” ndilo neno la kawaida na linalofaa katika sala.
- source_word: לְרִיבִי
  choice: katika shauri langu
  rationale: רִיב humaanisha shauri, kesi, mzozo, au dai la kisheria. “Shauri langu” huhifadhi wigo huo wa kisheria bila kulifanya kuwa kesi rasmi ya mahakamani pekee.
theological_decisions:
- issue: 'Majina mawili ya kumwita Mungu: אֱלֹהַי וַאדֹנָי'
  choice: Mungu wangu na Bwana wangu
  alternative: Mungu wangu na Mkuu wangu
  rationale: Maneno hayo mawili ni miito ya heshima kwa Mungu. “Bwana” hutafsiri cheo cha Mungu kwa matumizi yaliyozoeleka katika Biblia bila kuingiza dai maalumu la kikristo katika zaburi hii.
- issue: Maana ya kisheria ya לְמִשְׁפָּטִי
  choice: ili unitendee haki
  alternative: kwa ajili ya hukumu yangu
  rationale: Muktadha ni ombi la Mungu kuingilia shauri la mwombaji. Tafsiri iliyochaguliwa inasikika kiasili na inadumisha wazo la haki au kuthibitishwa kuwa mwenye haki, huku tanbihi ikihifadhi maana nyingine halali ya “hukumu.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sala ni ya heshima, ya sasa, na inayoeleweka kwa wasomaji wa kawaida. Mpangilio wa mwito “Mungu wangu na Bwana wangu” umehifadhiwa katikati ya vipashio kama katika Kiebrania, huku sentensi ikibaki ya asili kwa Kiswahili.
