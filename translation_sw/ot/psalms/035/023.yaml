  source_fidelity: The draft accurately conveys the urgent double plea and the two divine titles. However, “ili unitendee haki” recasts לְמִשְׁפָּטִי (“for/to my judgment, justice, or legal vindication”) as a finite purpose clause and makes God’s favorable action explicit. A more source-near rendering should retain the nominal forensic expression, with the contextual sense explained in the footnote.
  naturalness: “Amka, uinuke” is natural, reverent, and suitably poetic Standard East African Swahili. “Kwa ajili ya hukumu yangu” is clear in this judicial plea; retaining the subsequent “kwa ajili ya shauri langu” also reflects the Hebrew’s parallel prepositional phrases. The vocative is naturally marked with “Ee.”
  terminology: “Mungu wangu na Bwana wangu” appropriately renders the paired direct address. “Hukumu yangu” preserves the broad legal term מִשְׁפָּט without prematurely selecting either ‘justice’ or ‘vindication’; “shauri langu” suitably renders רִיב in its legal-dispute sense.
