base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/001.yaml
  text: Of David[a]. Contend, O Yahweh, with those who contend with me[b]; fight against those who fight against me.
translation:
  language: sw
  text: 'Ya Daudi.[a]


    Ee Yahweh, teta na wanaoteta nami;[b]

    pigana na wanaopigana nami.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kwa ajili ya Daudi.” Kihusishi cha Kiebrania kinaweza kuonyesha utunzi, uhusiano, au wakfu.'
    reason: lexical_alternative
  - marker: b
    text: 'Kitenzi cha Kiebrania kinaweza pia kuwa na maana ya kisheria: “Tetea shauri langu dhidi ya wapinzani wangu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Kihusishi לְ kabla ya jina la Daudi katika vichwa vya zaburi kinaweza kuonyesha utunzi, uhusiano, au wakfu. “Ya Daudi” ni ya kawaida na haifungii maana katika utunzi pekee.
- source_word: רִיבָה ... אֶת יְרִיבַי
  choice: teta na wanaoteta nami
  rationale: Mzizi ריב unaweza kueleza mzozo, ubishi, au shauri la kisheria. “Teta” hudumisha urudiaji wa mzizi uliopo katika Kiebrania na maana pana ya kukabiliana katika mzozo, bila kuongeza waziwazi maneno “kesi yangu.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kwa unukuzi “Yahwe,” badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: לְחַם ... אֶת לֹחֲמָי
  choice: pigana na wanaopigana nami
  rationale: Mzizi לחם una maana ya kupigana au kufanya vita. Tafsiri hii ni ya moja kwa moja, ya asili katika Kiswahili, na inahifadhi urudiaji wa kitenzi na mtendaji katika Kiebrania.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi יהוה. “Yahwe” huhifadhi jina hilo kwa unukuzi bila kulibadilisha kuwa cheo.
- issue: Iwapo ריבָה inaeleza kuteta au kutetea shauri mahakamani
  choice: teta na wanaoteta nami
  alternative: tetea shauri langu dhidi ya wapinzani wangu
  rationale: Muundo wenye אֶת unawaweka wapinzani kama wale ambao Yahwe anatakiwa kukabiliana nao. Tafsiri kuu inahifadhi maana pana na urudiaji wa mzizi; tanbihi inadumisha uwezekano wa maana ya kisheria bila kuufanya kuwa maana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na ya moja kwa moja. Urudiaji wa “teta/wanaoteta” na “pigana/wanaopigana” umehifadhi usambamba na mchezo wa mizizi wa Kiebrania. Jina “Yahwe” limetumiwa moja kwa moja.
