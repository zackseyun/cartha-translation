base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/014.yaml
  text: I walked about as though he were my friend[a], as though he were my brother; I bowed down in gloom[c][b], like one mourning for a mother.
translation:
  language: sw
  text: Nilitembea huku na huku kana kwamba alikuwa rafiki yangu[a], kana kwamba alikuwa ndugu yangu; niliinama kwa huzuni nzito[b], kama mtu anayemwombolezea mama yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Nilitembea kama rafiki, kama ndugu kwangu.” Maneno hayo yanaonyesha ukaribu mkubwa wa kibinafsi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi kina wazo la kuwa “mwenye giza” au “aliyetiwa giza,” yaani kuonekana mwenye huzuni na aliyelemewa kama mwombolezaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/רֵעַ
  choice: kana kwamba alikuwa rafiki yangu
  rationale: Nomino רֵעַ humaanisha rafiki au mwenzi, na kiambishi כְּ kinaonyesha ulinganisho. Muktadha unaruhusu kuongeza 'alikuwa' ili sentensi iwe ya kawaida kwa Kiswahili bila kuondoa ukaribu unaokusudiwa.
- source_word: כְּ/אָח לִי
  choice: kana kwamba alikuwa ndugu yangu
  rationale: אָח ni 'ndugu wa kiume,' huku לִי ikionyesha uhusiano wa karibu 'kwangu'; Kiswahili cha kawaida huuwakilisha kwa umilikishi 'ndugu yangu.'
- source_word: הִתְהַלָּכְתִּי
  choice: Nilitembea huku na huku
  rationale: Muundo wa Hitpael wa הלך hapa unaonyesha kutembea au kwenda huku na huku, na huenda pia ukadokeza mwenendo; tafsiri hii inadumisha taswira halisi.
- source_word: כַּ/אֲבֶל אֵם
  choice: kama mtu anayemwombolezea mama yake
  rationale: Kirai hiki ni ulinganisho na mwombolezaji wa mama. 'Mama yake' hufanya uhusiano uliodokezwa uwe wa kawaida katika Kiswahili.
- source_word: קֹדֵר
  choice: kwa huzuni nzito
  rationale: קֹדֵר kihalisi huhusiana na kuwa na giza au sura iliyotiwa giza, na katika muktadha wa maombolezo huonyesha hali ya huzuni na kukata tamaa. 'Huzuni nzito' huwasilisha nahau hiyo kwa uwazi.
- source_word: שַׁחֽוֹתִי
  choice: niliinama
  rationale: Kitenzi huonyesha kuinama au kujikunja chini kwa huzuni; 'niliinama' kinahifadhi mkao wa mwili bila kulazimisha maana ya ibada.
theological_decisions: []
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Mpangilio wa kishairi umetunza picha mbili tofauti: hali ya kuinama kwa huzuni nzito na ulinganisho na mtu anayemwombolezea mama yake.'
