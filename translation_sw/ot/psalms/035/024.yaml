base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/024.yaml
  text: Vindicate me according to your righteousness[a], O Yahweh my God, and do not let them rejoice over me.
translation:
  language: sw
  text: Nihukumu kulingana na haki yako,[a] Ee Yahweh, Mungu wangu; wala wasifurahi juu yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kulingana na uadilifu wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁפְטֵנִי
  choice: Nihukumu
  rationale: Kitenzi cha amri שׁפט chenye mtendwa wa nafsi katika ombi hili kinamwomba Mungu atoe hukumu kwa ajili ya mtunga-zaburi. “Nihukumu” huhifadhi lugha ya kimahakama na, katika muktadha, hudokeza ombi la kutetewa bila kuongeza matokeo hayo moja kwa moja katika neno lenyewe.
- source_word: כְצִדְקְךָ
  choice: kulingana na haki yako
  rationale: צדק inaweza kueleza uadilifu wa Mungu na pia haki yake katika kutoa hukumu. “Haki yako” ni ya kawaida na yenye uzito katika Kiswahili, huku “uadilifu wako” ikiwa mbadala unaowezekana.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi, badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהָי
  choice: Mungu wangu
  rationale: Kiambishi cha nafsi ya kwanza umoja kimehifadhiwa wazi kwa Kiswahili cha kawaida.
- source_word: וְאַל יִשְׂמְחוּ
  choice: wala usiwaache ... wafurahie
  rationale: אַל pamoja na kitenzi kisichotimilika huonyesha ombi la kukataza; “usiwaache” huonyesha kwamba ombi linaelekezwa kwa Mungu kuhusu tendo la maadui.
- source_word: לִי
  choice: wanifurahie
  rationale: Katika mazingira ya uadui, לִי pamoja na שמח humaanisha kufurahia kwa sababu ya msiba au kushindwa kwa mtu. Muundo “wanifurahie” ni wa asili na hudumisha wazo la kuwika juu yake bila kulipanua.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu; “Yahweh” hulihifadhi kwa kulitohoa badala ya kuweka cheo.
- issue: Maana ya צִדְקְךָ
  choice: haki yako
  alternative: uadilifu wako
  rationale: Neno la Kiebrania linaweza kuhusisha uadilifu wa tabia na haki ya kimahakama. “Haki” huhifadhi mwingiliano huo, na mbadala umewekwa katika tanbihi.
- issue: Nguvu ya ombi שָׁפְטֵנִי
  choice: Nihukumu
  alternative: Unitetee kwa hukumu
  rationale: “Nihukumu” hudumisha usemi wa Kiebrania na mvutano wa ombi la mtu kuwekwa chini ya hukumu ya haki ya Mungu; muktadha unaonyesha kwamba anatarajia hukumu ya kumtetea.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kishairi lakini unaeleweka kwa wasomaji wa kawaida; jina Yahweh limehifadhiwa.
