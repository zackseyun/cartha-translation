  text: 'Wananilipa mabaya badala ya mema;

    kufiwa kwa nafsi yangu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hasara kwa uhai wangu” au “kufiwa kwangu.” Neno la Kiebrania linalotafsiriwa “nafsi” linaweza pia kumaanisha “uhai” au mtu mwenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלְּמוּנִי
  choice: Wananilipa
  rationale: Kitenzi hiki katika Piel kina maana ya kulipa au kurudisha kwa mtu kulingana na alichotenda; “wananilipa” ni Kiswahili cha kawaida kinachohifadhi wazo la malipo ya uhasama.
- source_word: רָעָה תַּחַת טוֹבָה
  choice: mabaya badala ya mema
  rationale: 'Kirai hiki kinaonyesha ubadilishanaji usio wa haki: mabaya yanatolewa badala ya mema. Wingi wa dhahania “mabaya” na “mema” unasikika kwa kawaida katika Kiswahili na kuhifadhi ulinganifu wa Kiebrania.'
- source_word: שְׁכוֹל
  choice: imefiwa
  rationale: Nomino hii huashiria kufiwa au kupoteza kwa uchungu, mara nyingi mtoto. Muundo wa kimethali “nafsi yangu imefiwa” unahifadhi ukali wa taswira bila kuifanya iwe hasara ya mtoto kihalisi.
- source_word: לְנַפְשִׁי
  choice: nafsi yangu
  rationale: נֶפֶשׁ inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. “Nafsi yangu” huhifadhi taswira ya kishairi na haifungi maana kwenye uhai wa kimwili pekee.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi na wa kishairi. “Nafsi yangu imefiwa” ni taswira iliyokusudiwa kuwa nzito na isiyo ya kawaida kidogo, kama ilivyo nomino ya Kiebrania; tanbihi inaonyesha uwezekano wa maana ya uhai au mtu mwenyewe.
