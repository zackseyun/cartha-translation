  yaml_path: translation/ot/psalms/035/007.yaml
  text: For without cause they hid their net's pit for me[d][c][b][a]; without cause they dug it for my life.
translation:
  language: sw
  text: Kwa maana bila sababu walinifichia shimo la wavu wao[a]; bila sababu walinichimbia shimo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walinifichia shimo pamoja na wavu wao,” au “walificha kwa ajili yangu shimo la wavu wao.” Kiebrania kinaunganisha “shimo” na “wavu wao” kwa karibu, lakini uhusiano kamili kati ya maneno hayo unaweza kueleweka kwa njia zaidi ya moja.
    reason: lexical_alternative
  - marker: b
    text: “Walinichimbia shimo” hutafsiri Kiebrania “walichimba kwa ajili ya nephesh yangu.” Nephesh hapa inaweza kumaanisha mtunga zaburi mwenyewe au uhai wake, si lazima “roho” kwa maana finyu ya baadaye ya kiteolojia.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya ombi la mtunga zaburi katika muktadha unaotangulia.
- source_word: חִנָּם
  choice: bila sababu
  rationale: Inaeleza uhasama usio na msingi wala sababu ya haki; marudio yake yamehifadhiwa katika vipashio vyote viwili.
- source_word: טָמְנוּ
  choice: walinitegea kwa siri
  rationale: Kitenzi kimsingi humaanisha kuficha; katika picha ya uwindaji, tafsiri hii ya kimuktadha inaonyesha kwamba mtego ulifichwa kwa kusudi la kumnasa msemaji.
- source_word: לִי
  choice: walinitegea
  rationale: Kiambishi cha yambwa katika kitenzi kinaonyesha kwamba msemaji ndiye aliyelengwa na shimo lililofichwa.
- source_word: שַׁחַת רִשְׁתָּם
  choice: shimo la wavu wao
  rationale: Inahifadhi nomino zote mbili na uhusiano wao wa karibu, huku tanbihi ikieleza kwamba uhusiano kamili kati ya shimo na wavu hauna uhakika.
- source_word: חָפְרוּ
  choice: walichimba shimo
  rationale: Kitenzi kina maana ya kuchimba; neno 'shimo' limerudiwa kwa uwazi kwa kuwa ndilo kitu kinachoeleweka kutokana na kipashio cha kwanza.
- source_word: לְנַפְשִׁי
  choice: ili kuuangamiza uhai wangu
  rationale: Nֶפֶשׁ hapa humaanisha uhai au nafsi nzima ya msemaji, si lazima roho isiyo ya mwili; muundo huu unaonyesha tishio dhidi ya maisha yake.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika muktadha huu
  choice: uhai wangu
  alternative: roho yangu / mimi mwenyewe
  rationale: Muktadha wa mtego wa kuua unaelekeza kwenye uhai wa mtunga zaburi; 'roho yangu' ingeweza kuingiza maana finyu ya kiteolojia ambayo si lazima iwepo hapa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na lugha inayoeleweka kwa wasomaji wa kawaida. Taswira halisi ya shimo na wavu imehifadhiwa; “walinitegea kwa siri” imetumiwa kuwasilisha kwa ufasaha tendo la kuficha mtego dhidi ya mtu.
