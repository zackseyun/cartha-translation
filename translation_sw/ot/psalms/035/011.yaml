lexical_decisions:
- source_word: יְקוּמוּן
  choice: wanasimama dhidi yangu
  rationale: Kitenzi קום hapa kinaonyesha mashahidi wenye uhasama wakijitokeza au kusimama kutoa ushahidi. Kirai “dhidi yangu” kinaweka wazi muktadha wa upinzani bila kupanua maana kupita kiasi.
- source_word: עֵדֵי חָמָס
  choice: mashahidi wa jeuri
  rationale: Huhifadhi kwa ukaribu muundo wa Kiebrania, yaani “mashahidi wa חָמָס,” neno linaloweza kumaanisha jeuri, uovu au dhuluma. Tafsiri hii haifungi maana kwenye ushahidi wa uongo pekee.
- source_word: אֲשֶׁר לֹא יָדַעְתִּי
  choice: mambo nisiyoyajua
  rationale: Kiebrania hakitaji wazi nomino inayorejelewa; “mambo” inaongezwa kwa kiwango cha chini ili sentensi iwe ya kawaida na wazi katika Kiswahili, huku dai la kutoyajua likihifadhiwa.
- source_word: יִשְׁאָלוּנִי
  choice: wananiuliza kuhusu
  rationale: שׁאל kimsingi ni kuuliza au kutaka habari. “Wananiuliza kuhusu” ni ya kawaida na yenye kiasi; “wananihoji” ingeweza kuongeza nguvu ya kimahakama isiyo wazi katika kitenzi chenyewe.
