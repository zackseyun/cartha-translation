  text: יְֽהִי דַרְכָּ֗/ם חֹ֥שֶׁךְ וַ/חֲלַקְלַקּ֑וֹת וּ/מַלְאַ֥ךְ יְ֝הוָ֗ה רֹדְפָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/006.yaml
  text: May their way be dark and slippery[a], with the angel of Yahweh pursuing them.
translation:
  language: sw
  text: Njia yao iwe ya giza na yenye kuteleza[a], na malaika wa Yahweh akiwafuatilia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Njia yao iwe giza na utelezi.” Neno la Kiebrania linaweza kumaanisha “utelezi” au “sehemu zenye kuteleza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: na iwe
  rationale: Ni umbo la amri-tamanio la kitenzi היה, linaloonyesha ombi au laana ya kutamani jambo litokee. “Na iwe” ni Kiswahili cha kawaida kinachohifadhi nguvu hiyo.
- source_word: דַרְכָּם
  choice: njia yao
  rationale: דֶּרֶךְ humaanisha njia au mwendo; “njia yao” huhifadhi uwezekano wa picha halisi na maana ya kimfano.
- source_word: חֹשֶׁךְ
  choice: yenye giza
  rationale: Nomino ya Kiebrania imetafsiriwa kwa muundo wa kivumishi unaosikika kwa kawaida katika Kiswahili huku picha ya hatari na kutokuona ikihifadhiwa.
- source_word: וַחֲלַקְלַקּוֹת
  choice: na utelezi
  rationale: Neno hili la wingi linaashiria sehemu laini au zenye kuteleza. “Utelezi” ni fasaha katika kishazi hiki na hudumisha picha ya njia hatari.
- source_word: וּמַלְאַךְ יְהוָה
  choice: huku malaika wa Yahwe
  rationale: “Huku” linaonyesha hali inayoambatana na njia kuwa yenye giza na utelezi. Hata hivyo, וּ־ pia linaweza kutafsiriwa kwa urahisi kuwa “na,” jambo lililoonyeshwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: רֹדְפָם
  choice: akiwafuatilia
  rationale: רדף humaanisha kufuatilia au kuwinda kwa nia ya kuwakamata. “Akiwafuatilia” huhifadhi tendo endelevu na lenye uhasama bila kuongeza namna isiyotajwa.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” huhifadhi jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa kishazi kinachomtaja malaika na sehemu ya kwanza
  choice: huku malaika wa Yahwe akiwafuatilia
  alternative: na malaika wa Yahwe akiwafuatilia
  rationale: Kiunganishi וּ־ kinaweza kuwa uratibu rahisi (“na”) au kuonyesha hali inayoambatana. Tafsiri kuu imetumia “huku” kwa mtiririko wa kawaida, lakini tanbihi imehifadhi uwezekano wa “na” bila kuamua utata kimya-kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “na iwe” unaonyesha tamanio au laana kwa njia ya asili; “yenye giza na utelezi” ni wazi kwa msomaji wa kawaida huku ukihifadhi taswira ya kishairi.
