  text: Take hold of shield and buckler[a], and rise up for my help.
translation:
  language: sw
  text: Shika ngao na ngao kubwa[a], uinuke unisaidie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinatumia maneno mawili tofauti ya ngao; neno la pili huenda linamaanisha ngao kubwa iliyofunika sehemu kubwa ya mwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲזֵק
  choice: Shika
  rationale: Amri hii inamtaka Mungu ashike silaha za kujikinga akiwa tayari kutenda; “shika” ni ya kawaida na inadumisha taswira halisi ya kivita.
- source_word: מָגֵן
  choice: ngao
  rationale: Hili ndilo neno la kawaida la Kiebrania kwa ngao, na “ngao” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: צִנָּה
  choice: ngao kubwa
  rationale: Neno hili linaashiria ngao kubwa ya kufunika mwili, tofauti na מָגֵן; kivumishi “kubwa” kinahifadhi tofauti ya maneno hayo mawili bila kutumia istilahi isiyoeleweka kwa wasomaji wengi.
- source_word: וְקוּמָה
  choice: uinuke
  rationale: Amri ya קום inaonyesha ombi la dharura la Mungu kuanza kutenda; “uinuke” ni ya asili katika lugha ya sala na inadumisha taswira ya hatua.
- source_word: בְּעֶזְרָתִי
  choice: unisaidie
  rationale: Ingawa Kiebrania kinatumia nomino “msaada,” katika Kiswahili “uinuke unisaidie” huwasilisha kwa kawaida kusudi la hatua hiyo kwa niaba ya mwombaji.
theological_decisions:
- issue: Mungu kuonyeshwa kwa taswira ya kivita
  choice: Kudumisha taswira halisi ya Mungu akishika ngao na kuinuka kumsaidia mwombaji.
  alternative: Kulainisha kuwa ombi la jumla la ulinzi.
  rationale: Kiebrania kinatumia waziwazi lugha ya kivita kumwonyesha Mungu kama mtetezi; taswira hiyo haipaswi kubadilishwa kuwa ombi lisilo na picha halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya moja kwa moja, huku tofauti kati ya aina mbili za ngao ikihifadhiwa kwa lugha inayoeleweka.
