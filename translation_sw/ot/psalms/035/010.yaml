translation:
  language: sw
  text: 'Mifupa yangu yote itasema: “Ee BWANA, ni nani aliye kama wewe, wewe umwokoaye maskini kutoka kwa aliye na nguvu kuliko yeye, maskini na mhitaji kutoka kwa mnyang’anyi wake?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עַצְמוֹתַי
  choice: Mifupa yangu yote
  rationale: Inahifadhi taswira halisi ya Kiebrania ya mtu mzima, kwa undani kabisa, akitoa ushuhuda.
- source_word: עָנִי
  choice: maskini
  rationale: Neno linaweza kumaanisha maskini au mtu aliyeteswa; hapa ‘maskini’ linafuata muktadha wa unyonge na hitaji bila kufuta uwezekano wa kuonewa.
- source_word: אֶבְיוֹן
  choice: mhitaji
  rationale: Linabainisha mtu mwenye uhitaji mkubwa na linatofautishwa kwa kawaida na ‘maskini’.
- source_word: מַצִּיל
  choice: Unamwokoa
  rationale: Kauli ya Kiebrania ni umbo la kisifa linaloeleza tendo la BWANA la kuokoa; wakati wa sasa wa Kiswahili unasomeka kwa kawaida katika sifa hii.
- source_word: גֹּזְלוֹ
  choice: anayemnyang’anya
  rationale: Mzizi גזל unaashiria kupora au kunyang’anya kwa nguvu; tafsiri hii inahifadhi uonevu wa mtendaji.
theological_decisions:
- issue: Jina la Mungu יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ kwa herufi kubwa ni desturi pana ya Biblia za Kiswahili kwa Tetragramatoni, huku ikitofautisha jina la agano na neno la kawaida ‘Bwana’.
- issue: Ulinganisho wa kipekee wa Mungu katika מִי כָמוֹךָ
  choice: ni nani aliye kama wewe?
  alternative: hakuna aliye kama wewe
  rationale: Swali la balagha la chanzo limehifadhiwa badala ya kugeuzwa kuwa kauli ya moja kwa moja.
- issue: Uhusiano wa kishazi cha pili cha wokovu
  choice: naam, maskini na mhitaji
  alternative: na maskini na mhitaji
  rationale: ‘Naam’ linaonyesha kwamba kishazi cha pili kinaendeleza na kupanua wazo la kwanza bila kuamua kwa nguvu kama מדובר watu tofauti au maelezo yaliyoongezwa kuhusu kundi lilelile.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa swali na marudio ya ‘maskini’ umehifadhiwa; sentensi imegawanywa kwa alama za uandishi ili isomeke kwa urahisi.
