reference: Psalms 27:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַחַ֤ת שָׁאַ֣לְתִּי מֵֽ/אֵת יְהוָה֮ אוֹתָ֪/הּ אֲבַ֫קֵּ֥שׁ שִׁבְתִּ֣/י בְּ/בֵית יְ֭הוָה כָּל יְמֵ֣י חַיַּ֑/י לַ/חֲז֥וֹת בְּ/נֹֽעַם יְ֝הוָ֗ה וּ/לְ/בַקֵּ֥ר בְּ/הֵיכָלֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/004.yaml
  text: 'One thing I have asked from Yahweh[a]; this I will seek: that I may dwell in the house of Yahweh all the days of my life[c][b], to behold the beauty of Yahweh and to inquire in his temple.'
translation:
  language: sw
  text: 'Jambo moja nimemwomba Yahweh; ndilo nitakalolitafuta: nikae katika nyumba ya Yahweh siku zote za maisha yangu, niutazame uzuri wa Yahweh[a], na niulize katika hekalu lake.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upendezi wa Yahweh” au “fadhili ya Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Au, “na kutafuta katika hekalu lake” au “na kutafakari katika hekalu lake.” Kitenzi cha Kiebrania hapa ni kigumu na huenda kina maana ya kuuliza au kuchunguza kwa makini katika patakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת
  choice: Jambo moja
  rationale: Namba ya kike ya umoja imetumiwa kama nomino na kusisitiza ombi moja kuu; “jambo moja” ni Kiswahili cha kawaida na wazi.
- source_word: שָׁאַלְתִּי
  choice: nimemwomba
  rationale: Kauli timilifu ya Kiebrania inaonyesha ombi lililokwisha kutolewa lakini bado ni muhimu; wakati timilifu wa Kiswahili unafaa katika muktadha huu.
- source_word: מֵאֵת יְהוָה
  choice: nimemwomba Yahweh
  rationale: Muundo wa Kiswahili “kumwomba mtu jambo” unaeleza kwa kawaida kwamba ombi limeelekezwa kwa Yahweh, ingawa kihalisia kihusishi cha Kiebrania kinaonyesha chanzo, yaani jambo lililoombwa kutoka kwake.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu YHWH limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: אוֹתָהּ אֲבַקֵּשׁ
  choice: hilo ndilo nitakalolitafuta
  rationale: Kiwakilishi kinarudia na kukazia jambo moja lililotajwa; muundo huu wa Kiswahili huhifadhi msisitizo na azimio la kitendo kinachoendelea.
- source_word: שִׁבְתִּי
  choice: niishi
  rationale: Katika muktadha wa nyumba ya Yahweh, kitenzi kina maana ya kukaa au kudumu huko; “niishi” ni cha asili na kinaeleza maudhui ya ombi bila kudokeza kuketi tu.
- source_word: בְּבֵית יְהוָה
  choice: katika nyumba ya Yahweh
  rationale: Tafsiri hii huhifadhi taswira ya nyumba au mahali pa ibada ya Yahweh iliyo katika matini.
- source_word: כָּל יְמֵי חַיַּי
  choice: siku zote za maisha yangu
  rationale: Huu ni usemi wa Kiswahili unaohifadhi maana ya muda wote wa maisha ya mtunga zaburi.
- source_word: לַחֲזוֹת
  choice: niutazame
  rationale: Kitenzi kinaonyesha kutazama kwa makini au kwa kutafakari, si kuona kwa kawaida tu; “kutazama” huhifadhi nguvu hiyo kwa lugha inayoeleweka.
- source_word: בְּנֹעַם יְהוָה
  choice: uzuri wa Yahweh
  rationale: נֹעַם inaweza kumaanisha uzuri, kupendeza, au fadhili. “Uzuri” ni wa asili katika muktadha wa ibada, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: וּלְבַקֵּר בְּהֵיכָלוֹ
  choice: na kutafuta mwongozo katika hekalu lake
  rationale: Kitenzi ni kigumu hapa na huenda kina wazo la kuchunguza, kuuliza, au kutafakari kwa makini patakatifu. “Kutafuta mwongozo” hutoa maana inayoeleweka bila kuficha utata, ambao umeelezwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Matini ina jina la Mungu YHWH, kwa hiyo “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya נֹעַם יְהוָה
  choice: uzuri wa Yahweh
  alternative: kupendeza kwa Yahweh; fadhili za Yahweh
  rationale: Neno lina wigo unaojumuisha uzuri, kupendeza, na fadhili. “Uzuri” linafaa katika muktadha wa kumtazama Yahweh, lakini tanbihi huhifadhi maana nyingine halali.
- issue: Maana ya וּלְבַקֵּר katika hekalu
  choice: kutafuta mwongozo katika hekalu lake
  alternative: kuuliza katika hekalu lake; kutafakari katika hekalu lake
  rationale: Kitenzi kina utata wa kileksika katika muktadha huu. Tafsiri kuu inaonyesha utafutaji makini mbele za Mungu bila kuamua kwa uhakika kama tendo hilo ni kuuliza au kutafakari.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Ulinganifu bora umetumiwa: mpangilio na taswira kuu za Kiebrania zimehifadhiwa, huku miundo ya Kiswahili ikifanywa kuwa ya asili. Alama zote za tanbihi zimewekwa katika matini kuu.'
