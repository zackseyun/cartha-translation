source:
  edition: WLC
  text: אַֽל תִּ֭תְּנֵ/נִי בְּ/נֶ֣פֶשׁ צָרָ֑/י כִּ֥י קָֽמוּ בִ֥/י עֵֽדֵי שֶׁ֝֗קֶר וִ/יפֵ֥חַ חָמָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/012.yaml
  text: Do not give me over to the desire of my adversaries[a], for false witnesses have risen against me[c][b], and they breathe out violence.
translation:
  language: sw
  text: Usinikabidhi kwa matakwa ya adui zangu[a], kwa maana mashahidi wa uongo wameinuka dhidi yangu, nao wanapumua jeuri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa nia ya adui zangu” au “kwa tamaa ya adui zangu.” Neno la Kiebrania hapa linaweza kumaanisha matakwa, nia, au tamaa, wala si “nafsi” kwa maana finyu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina umbo la umoja, ambalo pia linaweza kutafsiriwa “na mtu anayepumua jeuri.” Huenda usemi huo unawaeleza mashahidi wa uongo kwa pamoja au unamtaja shahidi mmoja wa aina hiyo.
    reason: lexical_and_grammatical_ambiguity
lexical_decisions:
- source_word: תִּתְּנֵנִי
  choice: usinikabidhi
  rationale: Kitenzi נתן pamoja na אַל na kiambishi cha yambwa hapa humaanisha kutomkabidhi mtu chini ya mamlaka ya wengine. “Usinikabidhi” ni Kiswahili cha kawaida na huhifadhi wazo hilo.
- source_word: בְּנֶפֶשׁ
  choice: kwa matakwa ya
  rationale: Katika nahau hii נֶפֶשׁ ina maana ya matakwa, nia, au tamaa, si “nafsi” kwa maana finyu. “Kwa matakwa ya” inaeleza kuachwa wengine wafanye wanavyotaka juu ya msemaji.
- source_word: צָרָי
  choice: adui zangu
  rationale: צַר humaanisha mpinzani mwenye uhasama au adui. “Adui zangu” ni wazi, ya kawaida, na inafaa muktadha wa mashitaka ya uongo.
- source_word: קָמוּ בִי
  choice: wameinuka dhidi yangu
  rationale: קום pamoja na בְּ kwa mtu humaanisha kuinuka dhidi yake. Tafsiri hii huhifadhi taswira na maana ya uhasama.
- source_word: עֵדֵי שֶׁקֶר
  choice: mashahidi wa uongo
  rationale: Hili ni fungu la kimahakama linalomaanisha mashahidi wanaotoa ushahidi wa uongo. “Mashahidi wa uongo” ni usemi wa asili na ulio wazi kwa Kiswahili.
- source_word: וִיפֵחַ חָמָס
  choice: nao wanapumua jeuri
  rationale: יפח huleta taswira ya kupumua au kutoa kitu kwa pumzi, na חמס ni jeuri, ukatili, au dhuluma yenye nguvu. Wingi wa Kiswahili unaunganisha kishazi kwa kawaida na “mashahidi,” huku tanbihi ikihifadhi umbo la umoja la Kiebrania.
theological_decisions:
- issue: Rejeleo la וִיפֵחַ baada ya “mashahidi” wa wingi
  choice: 'Imetafsiriwa kwa maana ya pamoja: “nao wanapumua jeuri.”'
  alternative: “na mtu anayepumua jeuri” au “na shahidi anayepumua jeuri.”
  rationale: Kiebrania kina umbo la umoja baada ya nomino ya wingi, jambo linaloweza kueleweka kama matumizi ya kugawa kwa kila mmoja, kama maelezo ya aina ya shahidi, au kama mhusika mmoja. Tafsiri kuu ni ya kawaida kwa Kiswahili bila kuficha uwezekano mwingine, ambao umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Wanapumua jeuri” imehifadhi taswira hai ya Kiebrania, na tanbihi zimebeba utata wa kisarufi na kimsamiati bila kuutatua kimadhehebu.
