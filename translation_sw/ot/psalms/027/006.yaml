source:
  edition: WLC
  text: וְ/עַתָּ֨ה יָר֪וּם רֹאשִׁ֡/י עַ֤ל אֹֽיְבַ֬/י סְֽבִיבוֹתַ֗/י וְ/אֶזְבְּחָ֣ה בְ֭/אָהֳל/וֹ זִבְחֵ֣י תְרוּעָ֑ה אָשִׁ֥ירָה וַ֝/אֲזַמְּרָ֗ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/006.yaml
  text: And now my head will be lifted up above my enemies around me[a], and I will offer in his tent sacrifices of joyful shouting; I will sing, yes[b], I will make music to Yahweh.
translation:
  language: sw
  text: Na sasa kichwa changu kitainuliwa juu ya adui zangu wanaonizunguka; nami katika hema lake[a] nitatoa dhabihu za nderemo[b]. Nitaimba na nitampigia Yahwe muziki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lake” hapa kwa kawaida humrejelea Yahwe.
    reason: alternative_reading
  - marker: b
    text: Au, “dhabihu pamoja na kelele za shangwe.” Kifungu cha Kiebrania kinaweza kusisitiza tabia ya dhabihu hizo au nderemo zilizoandamana nazo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Huhifadhi kiunganishi וְ pamoja na mgeuko wa wakati unaoonyeshwa na עַתָּה.
- source_word: יָרוּם רֹאשִׁי
  choice: kichwa changu kitainuliwa
  rationale: Huhifadhi taswira ya Kiebrania ya kichwa kuinuliwa, inayodokeza heshima, ujasiri na ushindi, bila kuigeuza kuwa maelezo ya moja kwa moja.
- source_word: עַל אֹיְבַי סְבִיבוֹתַי
  choice: juu ya adui zangu wanaonizunguka
  rationale: “Juu ya” huhifadhi wazo la kuinuliwa kuliko maadui, na “wanaonizunguka” huonyesha kwamba maadui wako pande zote.
- source_word: וְאֶזְבְּחָה
  choice: nami ... nitatoa dhabihu
  rationale: Umbo la kohotativi linaonyesha azimio la msemaji; “nitatoa dhabihu” ni Kiswahili cha kawaida na cha heshima.
- source_word: בְאָהֳלוֹ
  choice: katika hema lake
  rationale: Huhifadhi jina “hema” na kiambishi cha nafsi ya tatu bila kubadilisha taswira hiyo kuwa istilahi ya kimadhehebu.
- source_word: זִבְחֵי תְרוּעָה
  choice: dhabihu za nderemo
  rationale: “Nderemo” huwasilisha sauti kubwa ya furaha na shangwe iliyomo katika תְרוּעָה, huku muundo wa “za” ukihifadhi kwa kiasi fulani uhusiano mpana wa muundo wa Kiebrania.
- source_word: אָשִׁירָה וַאֲזַמְּרָה
  choice: Nitaimba, naam, nitampigia ... muziki
  rationale: 'Vitenzi viwili vya ibada vimetofautishwa: kuimba na kupiga/kufanya muziki; “naam” huonyesha msisitizo na mwendelezo wa kilele.'
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kwa umbo la Kiswahili “Yahwe,” badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina, si cheo.
- issue: Mrejelewa wa kiambishi katika בְאָהֳלוֹ
  choice: hema lake, likieleweka kuwa hema la Yahwe
  alternative: hema la mtunga zaburi
  rationale: Muktadha wa dhabihu na sifa zinazoelekezwa kwa Yahwe hufanya Yahwe kuwa mrejelewa wa kawaida zaidi, lakini tanbihi inaweka wazi jambo hili badala ya kuongeza jina katika mstari.
- issue: Uhusiano wa זִבְחֵי תְרוּעָה
  choice: dhabihu za nderemo
  alternative: dhabihu pamoja na kelele za shangwe
  rationale: Muundo wa Kiebrania unaweza kueleza sifa ya dhabihu au nderemo zinazoambatana nazo; tafsiri kuu huhifadhi ufupi wake, na tanbihi huhifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Nderemo” limetumiwa kwa sauti ya wazi ya furaha; sentensi imehifadhi taswira na mwendo wa kishairi wa Kiebrania.
