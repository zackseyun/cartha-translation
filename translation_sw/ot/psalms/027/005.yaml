  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֤י יִצְפְּנֵ֨/נִי בְּ/סֻכֹּ/ה֮ בְּ/י֪וֹם רָ֫עָ֥ה יַ֭סְתִּרֵ/נִי בְּ/סֵ֣תֶר אָהֳל֑/וֹ בְּ֝/צ֗וּר יְרוֹמְמֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/005.yaml
  text: For he will hide me in his shelter in the day of trouble[a]; he will conceal me in the secret place of his tent[c][b]; he will lift me high upon a rock.
translation:
  language: sw
  text: Kwa maana atanisitiri katika kibanda chake siku ya taabu; atanificha mahali pa siri ndani ya hema lake; ataniinua juu ya mwamba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya tumaini la mtunga zaburi katika muktadha uliotangulia.
- source_word: יִצְפְּנֵנִי
  choice: atanisitiri
  rationale: Kitenzi צפן kina wazo la kumficha mtu ili kumlinda; ‘atanisitiri’ ni Kiswahili cha kawaida kinachobeba maana zote mbili.
- source_word: בְּסֻכּוֹ
  choice: katika kibanda chake
  rationale: סֻכָּה ni kibanda au makao ya muda yanayotoa hifadhi; tafsiri hii inadumisha picha halisi bila kulazimisha maana ya kiibada.
- source_word: בְּיוֹם רָעָה
  choice: siku ya taabu
  rationale: Katika muktadha huu רָעָה ni hali ya shida au maafa, si ubaya wa kimaadili.
- source_word: יַסְתִּרֵנִי
  choice: atanificha
  rationale: סתר humaanisha kuficha au kuweka pasipo kuonekana; tofauti ya kitenzi na ‘atanisitiri’ inadumisha usambamba bila marudio yasiyo ya lazima.
- source_word: בְּסֵתֶר אָהֳלוֹ
  choice: mahali pa siri ndani ya hema lake
  rationale: בְּסֵתֶר ni mahali palipofichika, na אֹהֶל ni hema; ‘ndani ya’ huonyesha kwa kawaida nafasi salama iliyo katika hema.
- source_word: בְּצוּר
  choice: juu ya mwamba
  rationale: צוּר ni mwamba au jabali, hapa ukiwa picha ya usalama mahali palipoinuka.
- source_word: יְרוֹמְמֵנִי
  choice: ataniinua
  rationale: Kitenzi רום kina maana ya kuinua au kuweka juu; pamoja na ‘juu ya mwamba’ picha ya kuinuliwa inaeleweka wazi.
theological_decisions:
- issue: Dokezo la patakatifu katika סֻכּוֹ na אָהֳלוֹ
  choice: Kutumia ‘kibanda chake’ na ‘hema lake,’ huku picha kuu ikiwa hifadhi na ulinzi.
  alternative: Kutumia lugha ya moja kwa moja ya patakatifu, kama ‘maskani yake.’
  rationale: Maneno ya Kiebrania ni majina halisi ya kibanda na hema, ingawa yanaweza kudokeza patakatifu katika muktadha wa zaburi. Tafsiri haipaswi kuondoa wala kulazimisha dokezo hilo.
- issue: Maana ya רָעָה katika בְּיוֹם רָעָה
  choice: ‘taabu,’ yaani wakati wa shida au maafa.
  alternative: ‘uovu,’ kwa maana ya ubaya wa kimaadili.
  rationale: Muktadha unahusu hatari na dhiki ambayo mtunga zaburi analindwa nayo, hivyo maana ya hali mbaya ndiyo inayofaa hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usambamba wa kishairi umehifadhiwa kwa ‘atanisitiri / atanificha,’ na picha halisi za kibanda, hema, na mwamba zimedumishwa.
