base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/003.yaml
  text: Though an army encamps against me[a], my heart will not fear; though war rises against me[c][b], even then I will trust.
translation:
  language: sw
  text: Hata[b] jeshi[a] likipiga kambi dhidi yangu, moyo wangu hautaogopa; hata vita vikiinuka dhidi yangu, hata katika hali hii ninatumaini.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania pia kinaweza kutafsiriwa ‘kambi’; hapa neno hilo linamaanisha jeshi lililopiga kambi.
    reason: lexical_alternative
  - marker: b
    text: Au, ‘Ikiwa jeshi litapiga kambi dhidi yangu ... ikiwa vita vitainuka dhidi yangu.’ Neno la Kiebrania אִם linaweza kuonyesha sharti (‘ikiwa’) au maana ya kukubali hali (‘hata ikiwa’).
    reason: lexical_alternative
  - marker: c
    text: Au, ‘katika hili nina uhakika’ au ‘licha ya hali hii nina uhakika.’ Kiebrania kinaweza kukazia tumaini au uhakika mbele ya tishio, na hakitaji wazi kitu kinachotumainiwa.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Hata ... liki-/viki-
  rationale: 'Katika ushairi huu אִם inaeleweka vizuri kwa maana ya kukubali hali inayoweza kutokea: ‘hata ikiwa.’ Muundo wa Kiswahili ‘hata ... liki-/viki-’ ni wa asili na unadumisha ulinganifu wa vifungu viwili.'
- source_word: תַּחֲנֶה
  choice: likipiga kambi
  rationale: Kitenzi חנה kinamaanisha kupiga kambi. Tafsiri hii inadumisha taswira ya kijeshi na uhusiano wake na nomino מַחֲנֶה.
- source_word: מַחֲנֶה
  choice: jeshi
  rationale: Ingawa maana yake ya msingi ni ‘kambi,’ katika muktadha wa uadui na sambamba na ‘vita’ neno hili linawakilisha jeshi lililopiga kambi.
- source_word: לֹא יִירָא לִבִּי
  choice: moyo wangu hautaogopa
  rationale: Tafsiri inadumisha ‘moyo wangu’ kama kiima kilicho wazi katika Kiebrania, badala ya kuirahisisha kuwa ‘sitaogopa.’
- source_word: תָּקוּם ... מִלְחָמָה
  choice: vita vikiinuka
  rationale: Neno קום ni ‘kuinuka/kutokea.’ ‘Vita vikiinuka’ inadumisha taswira hai ya Kiebrania na inaeleweka katika Kiswahili cha kishairi.
- source_word: בְּזֹאת
  choice: hata katika hali hii
  rationale: Kirai hiki ni kifupi na kinaweza kuelekeza kwenye hatari iliyoelezwa. ‘Hata katika hali hii’ kinaonyesha kuendelea kwa tumaini katikati ya tishio bila kutaja wazi kitu ambacho Kiebrania hakijakitaja.
- source_word: אֲנִי בוֹטֵחַ
  choice: ninatumaini
  rationale: בטח huonyesha kutumaini au kuwa na uhakika. ‘Ninatumaini’ ni ya kawaida na inadumisha lugha ya utegemezi, huku tanbihi ikionyesha maana mbadala ya kuwa na uhakika.
theological_decisions:
- issue: Kirejeleo cha בְּזֹאת mwishoni mwa mstari
  choice: 'Kukihusisha kwa ujumla na hali ya tishio iliyotangulia: ‘hata katika hali hii ninatumaini.’'
  alternative: Kukihusisha na BWANA katika muktadha uliotangulia, au kutafsiri ‘licha ya hayo nina uhakika.’
  rationale: Muktadha wa karibu unaelekeza kwenye jeshi na vita, lakini Kiebrania hakitaji wazi kitu cha tumaini. Tafsiri na tanbihi zinadumisha ufupi na mvutano huo badala ya kuingiza kirejeleo maalumu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. ‘Kupiga kambi,’ ‘moyo wangu hautaogopa,’ na ‘vita vikiinuka’ zinadumisha taswira na ulinganifu wa Kiebrania bila kuwa za kizamani.
