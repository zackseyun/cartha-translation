  text: בִּ/קְרֹ֤ב עָלַ֨/י מְרֵעִים֮ לֶ/אֱכֹ֪ל אֶת בְּשָׂ֫רִ֥/י צָרַ֣/י וְ/אֹיְבַ֣/י לִ֑/י הֵ֖מָּה כָשְׁל֣וּ וְ/נָפָֽלוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/002.yaml
  text: When evildoers came near me to devour my flesh[b][a], my adversaries and my enemies—they stumbled and fell.
translation:
  language: sw
  text: Watenda maovu waliponikaribia ili wale nyama yangu—wapinzani wangu na adui zangu—wao walijikwaa na kuanguka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּקְרֹב עָלַי
  choice: waliponikaribia
  rationale: Muundo wa infinitivu pamoja na בִּ unaonyesha wakati, na עָלַי hapa inaeleza kuwakaribia kwa uhasama. “Waliponikaribia” ni Kiswahili cha kawaida kinachohifadhi maana bila kuongeza maneno yasiyo ya lazima.
- source_word: מְרֵעִים
  choice: watenda maovu
  rationale: Neno hili ni umbo la kushiriki linalowataja watu wanaotenda maovu; tafsiri hii inaonyesha matendo yao na haiongezi jinsia.
- source_word: לֶאֱכֹל אֶת־בְּשָׂרִי
  choice: ili wale nyama yangu
  rationale: Tafsiri hii inadumisha picha halisi na kali ya shambulio la kikatili iliyomo katika Kiebrania, bila kuifafanua tu kuwa “waniangamize.”
- source_word: צָרַי
  choice: wapinzani wangu
  rationale: “Wapinzani” linaonyesha watu wenye uhasama au wanaosimama dhidi ya mtunga zaburi, huku likitofautishwa na neno linalofuata la “adui.”
- source_word: וְאֹיְבַי לִי
  choice: na adui zangu
  rationale: Kiambishi cha umilikaji tayari kinaonyesha uhusiano wao na msemaji; nguvu ya לִי ya uhasama inaeleweka katika muktadha, hivyo “dhidi yangu” ya ziada ingeleta uradidi usio wa asili.
- source_word: הֵמָּה
  choice: wao
  rationale: Kiwakilishi huru kina mkazo; “wao” kinahifadhi mkazo huo baada ya maelezo yaliyotengwa kwa vistari.
- source_word: כָשְׁלוּ וְנָפָלוּ
  choice: walijikwaa na kuanguka
  rationale: Maneno haya yanahifadhi mfuatano wa vitenzi viwili na picha ya kushindwa au kuporomoka bila kuamua kimabavu kama tukio hilo ni la kijeshi, la kimwili, au la aina nyingine.
