  text: שְׁמַע יְהוָ֖ה קוֹלִ֥/י אֶקְרָ֗א וְ/חָנֵּ֥/נִי וַ/עֲנֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/007.yaml
  text: Hear[a], O Yahweh, when I cry aloud[b]; be gracious to me and answer me.
translation:
  language: sw
  text: Ee Yahweh, isikie sauti yangu ninapokuita[a]; unionee neema[b] na unijibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinaweza kutafsiriwa kwa karibu zaidi: “Ee Yahweh, isikie sauti yangu; ninaita.”'
    reason: lexical_alternative
  - marker: b
    text: Au “unifadhili”; kimapokeo pia “unirehemu.” Kitenzi cha Kiebrania חנן kimsingi huomba neema au fadhili.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: isikie
  rationale: Ni amri ya moja kwa moja inayomwomba Yahweh asikilize kwa makini; pamoja na ‘sauti yangu,’ ‘isikie’ ni Kiswahili cha kawaida na huhifadhi muundo halisi wa Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kuwa ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
- source_word: קוֹלִי
  choice: sauti yangu
  rationale: Huhifadhi taswira halisi ya קוֹלִי na usemi wa sala ‘isikie sauti yangu,’ bila kuufupisha kuwa ‘nisikie.’
- source_word: אֶקְרָא
  choice: ninapokuita
  rationale: Kitenzi קרא hapa kinaeleza kumwita Mungu kwa sauti katika sala. ‘Ninapokuita’ ni cha asili katika Kiswahili na kinaonyesha wazi anayeelekezewa mwito kutokana na muktadha.
- source_word: וְחָנֵּנִי
  choice: unionee neema
  rationale: חנן huomba fadhili au neema; ‘unionee neema’ ni usemi wa sala ulio wazi na sahihi zaidi kimsamiati kuliko kuuhusisha moja kwa moja na huruma.
- source_word: וַעֲנֵנִי
  choice: na unijibu
  rationale: ענה hapa humaanisha kujibu au kuitikia ombi. ‘Unijibu’ ni tafsiri ya moja kwa moja na ya kawaida katika lugha ya sala.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Andiko linatumia jina maalumu la agano, si cheo; ‘Yahweh’ hulihifadhi kama jina huku ‘BWANA’ ikiwa desturi mbadala ya tafsiri.
- issue: Maana ya חנן
  choice: unionee neema
  alternative: unirehemu
  rationale: Tafsiri iliyochaguliwa huhifadhi ombi la kufadhiliwa kwa neema bila kulifanya sawasawa kabisa na kitenzi cha kuhurumia; hata hivyo, ‘unirehemu’ ni tafsiri ya kimapokeo inayokaribiana kimaana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa urahisi. Muundo ‘isikie sauti yangu’ umehifadhi usemi halisi wa Kiebrania, huku ‘ninapokuita’ ukitoa mtiririko wa kawaida wa Kiswahili.
