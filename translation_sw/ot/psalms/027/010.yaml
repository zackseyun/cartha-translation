base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/010.yaml
  text: For my father and my mother have forsaken me[a], but Yahweh will take me in.
translation:
  language: sw
  text: Kwa maana baba yangu na mama yangu wameniacha,[a] lakini Yahwe atanipokea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wamenitelekeza.” Kitenzi cha Kiebrania kinaweza kumaanisha kuacha au kutelekeza. Katika sehemu ya mwisho ya mstari, neno lililotafsiriwa “atanipokea” kihalisi ni “atanikusanya,” likitoa wazo la Yahwe kumkaribisha na kumlinda mtu aliyeachwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleweka vizuri kama kinachotoa msingi au hali inayohusiana na tumaini la mtunga zaburi; “Kwa maana” huhifadhi uhusiano huo bila kukifanya kuwa cha kukubali hali kinyume waziwazi.
- source_word: אָבִי וְאִמִּי
  choice: baba yangu na mama yangu
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya nomino hizi zenye viambishi vya nafsi.
- source_word: עֲזָבוּנִי
  choice: wameniacha
  rationale: Kitenzi עזב kinaweza kumaanisha kuacha au kutelekeza. “Wameniacha” ni Kiswahili cha kawaida chenye uzito unaofaa katika muktadha, bila kuongeza ufafanuzi usiomo katika neno lenyewe.
- source_word: וַיהוָה
  choice: lakini Yahwe
  rationale: Ingawa ו ni kiunganishi cha “na,” hapa kinaonyesha tofauti kati ya kuachwa na wazazi na kupokelewa na Mungu; “lakini” huwasilisha tofauti hiyo kwa kawaida. Jina la agano limetafsiriwa “Yahwe.”
- source_word: יַאַסְפֵנִי
  choice: atanipokea
  rationale: Maana halisi ya אסף ni kukusanya, lakini katika muktadha huu wa mtu aliyeachwa linaashiria kumkaribisha, kumchukua chini ya ulinzi, au kumpokea. “Atanipokea” ni ya asili katika Kiswahili na huhifadhi wazo kuu huku tanbihi ikieleza taswira halisi.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: “Yahwe” hulihifadhi jina maalumu la agano lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kupokelewa katika יַאַסְפֵנִי
  choice: atanipokea
  alternative: atanikusanya / atanichukua kwake
  rationale: Tafsiri hii haibainishi kupita kiasi namna ya ulinzi wa Mungu; inahifadhi maana ya kumkaribisha na kumtunza mtu aliyeachwa, huku tanbihi ikionyesha upana wa kitenzi cha Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni rahisi kueleweka kwa msomaji wa kawaida; “wameniacha” na “atanipokea” huunda tofauti ya wazi bila kupoteza uzito wa kishairi.
