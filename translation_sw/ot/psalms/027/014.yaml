  text: קַוֵּ֗ה אֶל יְה֫וָ֥ה חֲ֭זַק וְ/יַאֲמֵ֣ץ לִבֶּ֑/ךָ וְ֝/קַוֵּ֗ה אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/014.yaml
  text: Wait for Yahweh[a]; be strong, and let your heart take courage; yes[c][b], wait for Yahweh.
translation:
  language: sw
  text: 'Mngojee Yahweh[a]; uwe imara, na moyo wako upate ujasiri[b]; naam, mngojee Yahweh.


    [a] Au, “Mtumainie Yahweh.” Neno la Kiebrania linamaanisha kungoja kwa tumaini na matarajio.

    [b] Au, “naye atautia nguvu moyo wako.” Kitenzi cha Kiebrania kinaweza kueleweka kuwa ahadi badala ya kuwa himizo linaloendelea.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtumainie Yahweh.” Neno la Kiebrania linamaanisha kungoja kwa tumaini na matarajio.
    reason: lexical_alternative
  - marker: b
    text: Au, “naye atautia nguvu moyo wako.” Kitenzi cha Kiebrania kinaweza kueleweka kuwa ahadi badala ya kuwa himizo linaloendelea.
    reason: alternative_reading
lexical_decisions:
- source_word: קַוֵּה / וְקַוֵּה
  choice: Mngojee / mngojee
  rationale: Kauli ya amri ya קוה ina wazo la kungoja kwa matarajio na tumaini. “Mngojee” huhifadhi maana ya kungoja, huku maana ya kumtumaini ikielezwa katika tanbihi. Kurudiwa kwa amri mwishoni kumehifadhiwa kwa msisitizo wa kishairi.
- source_word: אֶל
  choice: '- (kiambishi cha yambwa katika “Mngojee”)'
  rationale: Katika Kiswahili, yule anayengojewa huonyeshwa kiasili kwa kiambishi cha yambwa “-m-”; hivyo אֶל haitafsiriwi kwa neno tofauti.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limeandikwa kwa unukuzi “Yahweh,” badala ya kubadilishwa na cheo.
- source_word: חֲזַק
  choice: uwe imara
  rationale: Huhifadhi nguvu ya himizo bila kuifungamanisha tu na nguvu za mwili; “imara” inaweza kuhusisha uthabiti wa ndani unaokusudiwa katika muktadha.
- source_word: וְיַאֲמֵץ לִבֶּךָ
  choice: na moyo wako upate ujasiri
  rationale: Tafsiri hii hudumisha mlolongo wa mahimizo na pia huhifadhi taswira ya moyo kama kitovu cha azimio na ujasiri. Uwezekano wa kuisoma kama ahadi umehifadhiwa katika tanbihi.
- source_word: וְ
  choice: naam
  rationale: Kabla ya amri inayorudiwa, “naam” huonyesha uthibitisho na msisitizo wa hitimisho bila kuondoa urudiaji wa kishairi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; unukuzi hulihifadhi badala ya kuweka cheo mahali pake.
- issue: Nguvu ya kisintaksia ya וְיַאֲמֵץ
  choice: 'Himizo: “na moyo wako upate ujasiri”'
  alternative: 'Ahadi: “naye atautia nguvu moyo wako”'
  rationale: Muktadha una amri zinazofuatana, kwa hiyo usomaji wa kihimizo unafaa katika mstari mkuu. Hata hivyo, umbo la kitenzi linaweza kusomwa kwa nguvu ya kutabiri, hivyo usomaji huo halali umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo mfupi, wa kishairi na wenye heshima. “Mngojee” ni kauli ya kawaida na inayoeleweka, huku “naam” ikitoa msisitizo wa kishairi unaolingana na urudiaji wa Kiebrania.
