  text: אַל תַּסְתֵּ֬ר פָּנֶ֨י/ךָ מִמֶּ/נִּי֮ אַֽל תַּט בְּ/אַ֗ף עַ֫בְדֶּ֥/ךָ עֶזְרָתִ֥/י הָיִ֑יתָ אַֽל תִּטְּשֵׁ֥/נִי וְ/אַל תַּֽ֝עַזְבֵ֗/נִי אֱלֹהֵ֥י יִשְׁעִֽ/י־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/009.yaml
  text: Do not hide your face from me[a]; do not turn your servant away in anger. You have been my help. Do not cast me off, and do not forsake me[c][b], O God of my salvation.
translation:
  language: sw
  text: Usiufiche uso wako mbali nami; usimkatae mtumishi wako kwa hasira.[a] Umekuwa msaada wangu. Usinitupe mbali,[b] wala usiniache, ee Mungu wa wokovu wangu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usimwache mtumishi wako kwa hasira.”
    reason: lexical_alternative
  - marker: b
    text: Au, “usinikatae.”
    reason: lexical_alternative
  - marker: c
    text: Au, “ee Mungu wa ukombozi wangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתֵּר
  choice: usinifiche
  rationale: Kitenzi סתר humaanisha kuficha. Muundo huu ni wa kawaida na unadumisha ombi la moja kwa moja la Kiebrania.
- source_word: פָּנֶיךָ
  choice: uso wako
  rationale: Taswira halisi ya 'uso' imehifadhiwa badala ya kufafanuliwa kuwa 'uwepo,' kwa kuwa ni lugha ya kishairi inayoeleweka kuhusu kibali na ukaribu wa Mungu.
- source_word: תַּט בְּאַף
  choice: usimkatae ... kwa hasira
  rationale: נטה kimsingi ni kugeuza au kuelekeza kando. Katika muktadha huu, ambapo mtumishi ndiye anayelengwa na kitendo, maana ya kimahusiano ni kumwondoa au kumkataa kwa hasira. 'Usimkatae' ni Kiswahili cha sasa na cha asili, huku tanbihi ikihifadhi taswira ya kugeuza kando.
- source_word: עַבְדֶּךָ
  choice: mtumishi wako
  rationale: Katika sala hii neno עבד ni namna ya unyenyekevu ya mwombaji kujitaja mbele za Mungu; 'mtumishi' linafaa kuliko 'mtumwa,' kwa kuwa hali ya utumwa wa kisheria si jambo linalosisitizwa hapa.
- source_word: עֶזְרָתִי הָיִיתָ
  choice: umekuwa msaada wangu
  rationale: עזרה ni msaada, na kauli ya wakati uliotimia הָיִיתָ inaonyesha msaada wa Mungu uliothibitishwa zamani na wenye umuhimu hadi sasa.
- source_word: תִּטְּשֵׁנִי
  choice: usinitupe mbali
  rationale: נטש inaweza kumaanisha kuacha, kutupa mbali, au kukataa. 'Usinitupe mbali' linaonyesha uzito wa kukataliwa na pia linatofautishwa na kitenzi kinachofuata.
- source_word: תַּעַזְבֵנִי
  choice: usiniache
  rationale: עזב humaanisha kuacha au kutelekeza. 'Usiniache' ni ya asili katika Kiswahili na inadumisha tofauti na 'usinitupe mbali.'
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: ee Mungu wa wokovu wangu
  rationale: Muundo wa utegemezi wa Kiebrania umehifadhiwa. 'Wokovu' hapa unaweza kujumuisha kuokolewa au kukombolewa katika dhiki, bila kuufanya usemi huo uwe finyu mno.
theological_decisions:
- issue: Lugha inayomhusisha Mungu na 'uso'
  choice: Kuhifadhi usemi 'uso wako' katika matini kuu
  alternative: uwepo wako
  rationale: Kiebrania kinatumia 'uso' waziwazi kama taswira ya kibali au uwepo wa Mungu. Kuihifadhi kunadumisha ushairi na mvutano wa kitheolojia wa sala bila kuibadili kuwa dhana ya kinadharia.
- issue: Maana ya עבד katika uhusiano na Mungu
  choice: mtumishi
  alternative: mtumwa
  rationale: Katika muktadha huu mwombaji anajitambulisha kwa unyenyekevu na uaminifu mbele za Mungu; hadhi ya utumwa wa kisheria haisisitizwi.
- issue: Maana pana ya יִשְׁעִי
  choice: wokovu wangu
  alternative: kuokolewa kwangu
  rationale: Neno linabeba wazo la wokovu au ukombozi. Muundo rasmi umehifadhiwa bila kuamua kwamba unarejelea tu wokovu wa kiroho au tu kuponywa katika hatari ya muda.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa wasomaji wa kawaida. 'Ee' limetumiwa kuonyesha mwito wa moja kwa moja. Taswira ya 'uso' na urudiaji wa maombi hasi vimehifadhiwa; vitenzi viwili vya mwisho vimetofautishwa kwa 'kutupa mbali' na 'kuacha.'
