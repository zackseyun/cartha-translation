  text: לְ/דָוִ֨ד יְהוָ֤ה אוֹרִ֣/י וְ֭/יִשְׁעִ/י מִ/מִּ֣י אִירָ֑א יְהוָ֥ה מָֽעוֹז חַ֝יַּ֗/י מִ/מִּ֥י אֶפְחָֽד׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/001.yaml
  text: Of David[a]. Yahweh is my light and my salvation; whom shall I fear? Yahweh is the stronghold of my life[b]; of whom shall I be afraid?
translation:
  language: sw
  text: 'Ya Daudi.[a]


    Yahwe ni nuru yangu na wokovu wangu;

    nitamwogopa nani?

    Yahwe ni ngome ya maisha yangu;

    nitaogopa nani?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kwa Daudi” au “Kuhusu Daudi.” Katika kichwa hiki, neno la Kiebrania linaweza kuonyesha kwamba Daudi ndiye mwandishi au kwamba zaburi inahusishwa naye kwa namna nyingine.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Kihusishi לְ katika kichwa cha zaburi kinaweza kuonyesha utunzi, uhusiano, au wakfu. “Ya Daudi” ni kifupi na huhifadhi kiwango fulani cha utata huo bila kudai wazi kuwa Daudi ndiye mwandishi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetolewa kama jina binafsi “Yahwe,” badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: אוֹרִי
  choice: nuru yangu
  rationale: Taswira halisi ya “nuru” inaeleweka kwa Kiswahili na haifai kufafanuliwa kwa kuibadili kuwa mwongozo au tumaini pekee.
- source_word: וְיִשְׁעִי
  choice: na wokovu wangu
  rationale: “Wokovu” hutoa maana pana ya kuokolewa au kukombolewa na pia ni istilahi ya kawaida ya kibiblia katika Kiswahili.
- source_word: מִמִּי אִירָא
  choice: nitamwogopa nani?
  rationale: 'Swali hili la balagha linaonyesha uhakika. Kiswahili cha kawaida huunganisha kiambishi cha mtendwa na kitenzi: “nitamwogopa nani?”'
- source_word: מָעוֹז חַיַּי
  choice: ngome ya maisha yangu
  rationale: “Ngome” huhifadhi taswira ya mahali au chanzo chenye nguvu cha ulinzi; kirai “ya maisha yangu” kinafuata uhusiano wa muundo wa Kiebrania bila kuufafanua kupita kiasi.
- source_word: מִמִּי אֶפְחָד
  choice: nitamwonea nani hofu?
  rationale: Usemi huu ni wa asili na wenye hadhi katika Kiswahili, huku utofauti wa “hofu” ukidumisha mlingano wa kishairi bila kurudia kabisa kitenzi cha mstari uliotangulia.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza tafsiri ya kimadhehebu.
- issue: Uhusiano unaoonyeshwa na לְדָוִד
  choice: Ya Daudi
  alternative: Na Daudi; Kwa Daudi
  rationale: Kiebrania kinaweza kuashiria utunzi au uhusiano mwingine. Maandishi makuu yanatumia “Ya Daudi,” na tanbihi inaweka wazi uwezekano mwingine badala ya kuamua suala lisiloamuliwa na muundo wenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. Mpangilio wa mistari unadumisha usambamba wa kishairi wa Kiebrania. “Yahwe” limetumika kila linapotokea jina la Mungu; “ngome” huhifadhi taswira ya ulinzi imara.
