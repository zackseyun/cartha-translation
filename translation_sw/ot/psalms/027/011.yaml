  text: ה֤וֹרֵ֥/נִי יְהוָ֗ה דַּ֫רְכֶּ֥/ךָ וּ֭/נְחֵ/נִי בְּ/אֹ֣רַח מִישׁ֑וֹר לְ֝מַ֗עַן שׁוֹרְרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/011.yaml
  text: Teach me your way[a], O Yahweh, and lead me on a level path because of my enemies.
translation:
  language: sw
  text: 'Ee Yahweh, nifundishe njia yako,

    na uniongoze katika njia tambarare

    kwa sababu ya adui zangu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu ya wale wanaoniangalia kwa uhasama.” Neno la Kiebrania linaweza kumaanisha adui au wapinzani wanaomvizia mtu na kutafuta nafasi ya kumdhuru.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרֵנִי
  choice: nifundishe
  rationale: Kitenzi ירה katika Hiphil kina maana ya kufundisha au kuelekeza. “Nifundishe” huhifadhi wazo la kupokea maelekezo na ni ombi la kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: דַּרְכֶּךָ
  choice: njia yako
  rationale: דֶּרֶךְ humaanisha njia, mwenendo, au namna ya kuishi. “Njia yako” huhifadhi taswira halisi pamoja na maana pana ya mwenendo anaoutaka Mungu.
- source_word: וּנְחֵנִי
  choice: na uniongoze
  rationale: נחה humaanisha kuongoza. Chaguo hili ni la kawaida katika Kiswahili na linaendeleza taswira ya kusafiri katika njia.
- source_word: בְּאֹרַח מִישׁוֹר
  choice: katika njia tambarare
  rationale: אֹרַח ni njia, na מִישׁוֹר kimsingi ni sehemu iliyo sawa au tambarare. Tafsiri hii huhifadhi taswira halisi bila kuondoa uwezekano wa maana ya njia iliyo nyofu au salama.
- source_word: לְמַעַן
  choice: kwa sababu ya
  rationale: Katika muktadha huu kirai kinaonyesha sababu ya ombi la mwombaji mbele ya wapinzani wake.
- source_word: שׁוֹרְרָי
  choice: adui zangu
  rationale: Neno hili humaanisha wapinzani wenye uhasama, huenda likiwa na wazo la watu wanaomwangalia mwombaji ili wapate nafasi ya kumdhuru. “Adui zangu” ni wazi na asilia, huku maana mahsusi zaidi ikielezwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Kutumia “Yahweh” huhifadhi jina binafsi la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- issue: Maana ya njia tambarare
  choice: Kuhifadhi taswira ya njia iliyo tambarare
  alternative: njia iliyonyooka
  rationale: מִישׁוֹר hutaja kimsingi ardhi tambarare, lakini inaweza pia kudokeza unyofu au uadilifu. “Njia tambarare” huhifadhi taswira ya msingi na kuacha maana ya kimaadili isikike bila kuilazimisha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ee” limetumiwa kuonyesha mwito wa sala. Mpangilio wa kishairi umehifadhiwa kwa mistari mitatu, na alama ya tanbihi imewekwa baada ya “adui zangu,” ambako neno linalofafanuliwa linatokea.
