  yaml_path: translation/ot/psalms/027/000.yaml
  text: Of David[a]. Yahweh is my light and my salvation; whom shall I fear? Yahweh is the stronghold of my life[b]; of whom shall I be afraid?
translation:
  language: sw
  text: 'Ya Daudi.[a]


    Yahwe ni nuru yangu na wokovu wangu;

    nimwogope nani?

    Yahwe ni ngome ya maisha yangu;

    nimwogope nani?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Iliyotungwa na Daudi” au “Kwa ajili ya Daudi.” Katika kichwa hiki, neno la Kiebrania לְדָוִד linaweza kuonyesha kuwa Daudi ndiye mtunzi au kwamba zaburi hii inahusiana naye.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Kihusishi לְ kinaweza kuonyesha utunzi au uhusiano; “Ya Daudi” ni kichwa cha asili katika Kiswahili na huhifadhi upana huo kwa kiasi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetafsiriwa kwa umbo la Kiswahili linalotambulika, badala ya kulibadilisha kuwa cheo.
- source_word: אוֹרִי
  choice: nuru yangu
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya sitiari ya Kiebrania.
- source_word: יִשְׁעִי
  choice: wokovu wangu
  rationale: Huwasilisha hali na tendo la kuokolewa kwa lugha ya kawaida ya kibiblia ya Kiswahili.
- source_word: מָעוֹז חַיַּי
  choice: ngome ya maisha yangu
  rationale: “Ngome” huonyesha mahali au chanzo cha ulinzi wenye nguvu, huku “maisha yangu” kikihifadhi muundo wa Kiebrania.
- source_word: אִירָא / אֶפְחָד
  choice: nitamwogopa / nitamhofu
  rationale: Vitenzi viwili vinavyokaribiana vimetofautishwa kidogo ili kuhifadhi usambamba bila kufanya mstari usikike wa kurudiarudia kupita kiasi.
theological_decisions:
- issue: Uhusiano wa Daudi na zaburi katika kichwa
  choice: Ya Daudi
  alternative: Na Daudi; Kwa ajili ya Daudi
  rationale: Kiebrania לְדָוִד kinaweza kumaanisha utunzi au uhusiano; tanbihi huhifadhi uwezekano huo bila kuamua zaidi ya ushahidi.
- issue: Uwakilishi wa jina la Mungu
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya chanzo yana jina binafsi יהוה; “Yahwe” hulitambulisha wazi bila kuligeuza kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Usambamba wa kishairi na maswali ya balagha umehifadhiwa.
