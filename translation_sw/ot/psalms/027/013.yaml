  text: לׅׄוּלֵׅׄ֗אׅׄ הֶ֭אֱמַנְתִּי לִ/רְא֥וֹת בְּֽ/טוּב יְהוָ֗ה בְּ/אֶ֣רֶץ חַיִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/013.yaml
  text: Unless I had believed that I would see the goodness of Yahweh in the land of the living[a][b].
translation:
  language: sw
  text: Kama nisingeamini kwamba nitauona wema wa Yahweh katika nchi ya walio hai—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kina sentensi isiyokamilika: “Kama nisingeamini kwamba nitauona wema wa Yahweh katika nchi ya walio hai—”. Matokeo ya hali hiyo hayajasemwa wazi.'
    reason: alternative_reading
  - marker: b
    text: 'Maana inayodokezwa inaweza kuwa: “Ningekata tamaa kama nisingeamini kwamba nitauona wema wa Yahweh katika nchi ya walio hai.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּלֵא
  choice: Kama nisinge-
  rationale: Kifungu hiki huanzisha hali ya kinyume na uhalisi, ‘kama si kwamba/kama nisinge-’. Muundo wa Kiswahili wenye ‘kama’ na hali ya -nge- unaonyesha nguvu hiyo kwa kawaida.
- source_word: הֶאֱמַנְתִּי
  choice: nisingeamini
  rationale: Kitenzi cha mzizi אמן katika Hiphil hapa ni ‘kuamini’ au ‘kutumaini’. ‘Kuamini’ kinafaa kwa sababu kinachofuata kinaeleza jambo lililoaminiwa.
- source_word: לִרְאוֹת
  choice: kwamba nitauona
  rationale: Ingawa Kiebrania kina jina-kitenzi ‘kuona’, baada ya ‘kuamini’ Kiswahili cha kawaida hutumia kishazi cha maudhui. Wakati ujao unaonyesha tumaini la mtunga zaburi kwamba bado atauona wema huo.
- source_word: בְּטוּב
  choice: wema
  rationale: טוּב inaweza kumaanisha wema, mema, au ukarimu. ‘Wema’ huhifadhi maana pana bila kuifanya ihusu baraka za mali pekee.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetafsiriwa kwa kulinakili kama ‘Yahweh’, badala ya kulibadili kuwa cheo.
- source_word: בְּאֶרֶץ חַיִּים
  choice: katika nchi ya walio hai
  rationale: Hii ni nahau ya Kiebrania inayomaanisha ulimwengu wa wanaoishi, kwa kulinganisha na kifo au Sheoli.
- source_word: '[jibu la sharti lililoachwa baada ya לוּלֵא]'
  choice: —
  rationale: Kiebrania hakisemi matokeo ya hali hii. Mkato mrefu unahifadhi ukamilifu huo uliokusudiwa badala ya kuweka maneno yasiyomo katika matini.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ina jina binafsi יהוה; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Kishazi kikuu kilichoachwa katika sentensi ya Kiebrania
  choice: Kuacha sentensi ikiwa haijakamilika na kutumia mkato mrefu
  alternative: Kuongeza ‘ningekata tamaa’
  rationale: Kiebrania hakitaji wazi matokeo. Muundo usiokamilika huhifadhi utata wa matini, huku tanbihi ikieleza maana inayodokezwa na muktadha bila kuifanya kuwa sehemu ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka. Muundo wa -nge- unaonyesha hali ya kinyume na uhalisi, na mkato mrefu unahifadhi ellipsisi ya Kiebrania.
