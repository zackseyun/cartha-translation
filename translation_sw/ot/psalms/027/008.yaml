base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/008.yaml
  text: On your behalf my heart says[a], “Seek my face.” Your face, Yahweh[c][b], I seek.
translation:
  language: sw
  text: Kwa niaba yako moyo wangu unasema[a], “Tafuteni uso wangu.” Uso wako[b], Yahwe, nautafuta[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mwanzo wa Kiebrania ni mgumu. Unaweza pia kueleweka, “Kwako moyo wangu unasema,” au, kwa kuhusianisha maneno kwa njia tofauti kidogo, “Moyo wangu unasema juu yako, ‘Tafuteni uso wake.’”
    reason: alternative_reading
  - marker: b
    text: Au “Uwepo wako.” Katika Kiebrania, “uso” mara nyingi humaanisha uwepo wa mtu mwenyewe.
    reason: lexical_alternative
  - marker: c
    text: Au “nitautafuta.” Kitenzi cha Kiebrania kinaweza kueleza azimio la sasa au nia ya wakati ujao.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ
  choice: Kwa niaba yako
  rationale: Muundo wa Kiebrania ni mgumu. Tafsiri hii inaonyesha kwamba moyo wa mtunga zaburi unanena kwa kumwakilisha au kwa kurejelea Yahwe, bila kuficha uwezekano wa kuelewa maneno hayo kwa njia nyingine.
- source_word: אָמַר לִבִּי
  choice: moyo wangu unasema
  rationale: Ingawa kitenzi cha Kiebrania kiko katika umbo ambalo mara nyingi hueleza tendo lililokamilika, katika ushairi hapa kinaweza kueleza sauti ya ndani inayoendelea au azimio la sasa.
- source_word: בַּקְּשׁוּ
  choice: Utafuteni
  rationale: Ni amri ya wingi. Neno hili linadumisha wito wa moja kwa moja wa kumtafuta Mungu.
- source_word: פָנָי
  choice: uso wangu
  rationale: Hii ndiyo maana ya moja kwa moja, na inadumisha taswira pamoja na urudiaji wa neno ‘uso’ katika mstari huu; katika matumizi haya uso unaweza pia kumaanisha uwepo wa mtu.
- source_word: אֶת פָּנֶיךָ
  choice: Uso wako
  rationale: Mpangilio huu unadumisha urudiaji wa neno ‘uso’ na kulitanguliza kama lilivyosisitizwa katika kishazi cha Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo ‘BWANA’.
- source_word: אֲבַקֵּשׁ
  choice: nautafuta
  rationale: Kitenzi hiki kinaweza kueleza azimio la sasa au nia ya wakati ujao. ‘Nautafuta’ kinafaa kwa jibu la sasa la mtunga zaburi na kinaambatana na ‘uso’ kwa kiambishi cha yambwa.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina binafsi la Mungu. Kulitaja kama ‘Yahwe’ kunadumisha jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kishazi kigumu לְךָ אָמַר לִבִּי
  choice: Kwa niaba yako moyo wangu unasema, “Utafuteni uso wangu.”
  alternative: 'Kwako moyo wangu unasema, “Utafuteni uso wangu”; au: Moyo wangu unasema juu yako, “Utafuteni uso wake.”'
  rationale: Sintaksia ya Kiebrania inaruhusu zaidi ya uchanganuzi mmoja. Chaguo kuu linadumisha Maandishi ya Kimasora na kuyaelewa maneno ya moyo kama mwangwi wa mwito wa Mungu, huku tanbihi ikihifadhi utata halisi.
- issue: Wakati au namna ya אֲבַקֵּשׁ
  choice: nautafuta
  alternative: nitautafuta
  rationale: Umbo la kitenzi linaweza kuonyesha azimio la sasa au kusudi la wakati ujao; matini kuu inatumia hali ya sasa bila kuondoa uwezekano wa wakati ujao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio “Uso wako, Yahwe, nautafuta” unadumisha msisitizo na urudiaji wa kishairi wa Kiebrania. Amri “Utafuteni” inadumisha wingi wa chanzo, ingawa bila muktadha inaweza kusikika isivyo kawaida; hali hiyo ni sehemu ya ugumu halisi wa mstari.
