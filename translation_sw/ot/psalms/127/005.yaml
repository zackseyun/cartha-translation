  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַשְׁרֵ֤י הַ/גֶּ֗בֶר אֲשֶׁ֤ר מִלֵּ֥א אֶת אַשְׁפָּת֗/וֹ מֵ֫/הֶ֥ם לֹֽא יֵבֹ֑שׁוּ כִּֽי יְדַבְּר֖וּ אֶת אוֹיְבִ֣ים בַּ/שָּֽׁעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/005.yaml
  text: Blessed is the man who fills his quiver with them[c][b][a]; they will not be put to shame when they speak with enemies in the gate.
translation:
  language: sw
  text: Heri mwanamume aliyejaza podo lake nao! Hawataaibishwa[a] watakaposema[b] na maadui langoni.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawataaibika.” Baadhi ya watu hukielewa kiima kuwa baba peke yake na kutafsiri, “hataaibishwa.” Vitenzi vya Kiebrania ni vya wingi.
    reason: alternative_reading
  - marker: b
    text: Au, “watakapobishana na maadui” au “watakapotetea kesi yao mbele ya maadui.” Katika mazingira haya kitenzi kinaweza kuwa na maana ya kisheria au ya kushindana kwa hoja.
    reason: lexical_alternative
  - marker: c
    text: Katika mji wa kale, lango lilikuwa mahali pa hukumu za hadharani na shughuli za kiraia.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heri
  rationale: Neno hili linaanzisha tamko la baraka au hali njema; “Heri” ni la kawaida, lenye hadhi, na linafaa kwa mtindo wa Zaburi za hekima.
- source_word: הַגֶּבֶר
  choice: mwanamume
  rationale: Nomino ya Kiebrania ni ya kiume na hapa inamrejelea baba anayezungumziwa; “mwanamume” huhifadhi maana hiyo bila kuongeza wazo la shujaa.
- source_word: מִלֵּא אֶת אַשְׁפָּתוֹ
  choice: aliyejaza podo lake
  rationale: Kauli ya wakati uliotimilika humweleza mwanamume kwa tendo ambalo tayari limetimizwa; “aliyejaza” ni ya asili katika tamko la heri. “Podo” ni kifaa cha kubebea mishale na huhifadhi sitiari ya mstari uliotangulia.
- source_word: מֵהֶם
  choice: nao
  rationale: Kiwakilishi kinawarejelea wana waliolinganishwa na mishale katika muktadha. “Nao” huonyesha kile kilichotumika kulijaza podo bila kurudia au kufafanua zaidi ya Kiebrania.
- source_word: לֹא יֵבֹשׁוּ
  choice: hawataaibishwa
  rationale: Kitenzi ni cha wingi na kinaweza kumaanisha kupata aibu au fedheha hadharani. Kauli tendwa “hawataaibishwa” huhifadhi upande wa kuaibishwa mbele ya wengine.
- source_word: כִּי
  choice: watakapo-
  rationale: Hapa kiunganishi kinaanzisha mazingira ya wakati ambapo hawataaibishwa; muundo wa “watakaposema” ni wa asili katika Kiswahili.
- source_word: יְדַבְּרוּ
  choice: watakaposema
  rationale: Maana ya msingi ni kusema, ingawa katika mazingira ya lango inaweza kuhusisha mabishano au utetezi wa kesi; tafsiri kuu inadumisha upana huo.
- source_word: אֶת אוֹיְבִים
  choice: na maadui
  rationale: Baada ya kitenzi cha kusema, muundo huu huonyesha watu wanaozungumziwa nao au wanaokabiliwa; “na maadui” hauamui kimya kimya kama ni mazungumzo, mabishano, au utetezi wa kesi.
- source_word: בַּשָּׁעַר
  choice: langoni
  rationale: “Langoni” ni tafsiri ya asili ya mahali hapo na huhifadhi mazingira ya kale bila kuyaingiza maelezo yake yote katika matini kuu.
theological_decisions:
- issue: Lugha wakilishi ya kijinsia
  choice: mwanamume
  alternative: mtu; mmoja
  rationale: Kiebrania kinatumia nomino ya kiume na muktadha unamhusu baba. Tafsiri haibadili kimya kimya rejeo hilo kuwa lisiloonyesha jinsia.
- issue: Kiima cha wingi katika לֹא יֵבֹשׁוּ na יְדַבְּרוּ
  choice: hawataaibishwa ... watakaposema
  alternative: hataaibishwa ... atakaposema
  rationale: Vitenzi vya Kiebrania ni vya wingi, huenda vikimhusu baba pamoja na wanawe au familia kwa pamoja. Wingi umehifadhiwa ili kutatua kwa lazima mvutano uliomo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka. “Heri” hudumisha sauti ya kishairi na ya hekima; “podo” huhifadhi taswira ya mishale kutoka mstari uliotangulia. Alama zote za tanbihi zimewekwa karibu na vifungu vinavyohusika.
