base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/000.yaml
  text: A Song of Ascents[a]. Of Solomon. Unless Yahweh builds the house, its builders labor over it in vain. Unless Yahweh guards the city[c][b], the watchman stays awake in vain.
translation:
  language: sw
  text: 'Wimbo wa Kupandia. Wa Sulemani.[a]


    Yahwe asipoijenga nyumba,[b]


    wajenzi wake huifanyia kazi bure.[c]


    Yahwe asipoulinda mji,


    mlinzi hukesha bure.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kwa ajili ya Sulemani” au “Unaohusiana na Sulemani”; kichwa cha Kiebrania kinaweza kuonyesha mtunzi, wakfu, au uhusiano.
    reason: alternative_reading
  - marker: b
    text: Katika matumizi ya Kiebrania, “nyumba” inaweza pia kumaanisha jamaa, ukoo, au nasaba.
    reason: lexical_alternative
  - marker: c
    text: 'Kwa tafsiri ya karibu zaidi na mpangilio wa Kiebrania: “wajenzi wake hufanya kazi bure ndani yake.”'
    reason: literal_rendering
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa kupanda
  rationale: Huhifadhi taswira ya kupanda katika kichwa cha Kiebrania bila kuongeza wazi mahali au tukio ambalo halikutajwa katika maandishi.
- source_word: לִשְׁלֹמֹה
  choice: Wa Sulemani
  rationale: Ni tafsiri fupi na ya kawaida ya kichwa, huku tanbihi ikihifadhi uwezekano wa maana ya ‘kwa ajili ya Sulemani’ au uhusiano mwingine naye.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina binafsi la Mungu katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: בַיִת
  choice: nyumba
  rationale: Hii ndiyo maana ya moja kwa moja katika muktadha wa kujenga; uwezekano wa maana pana ya jamaa au nasaba umewekwa katika tanbihi.
- source_word: שָׁוְא
  choice: bure
  rationale: Neno hili linaonyesha kazi isiyoleta mafanikio au faida; ‘bure’ ni la asili na hudumisha uradidi wa kishairi.
- source_word: שָׁקַד שׁוֹמֵר
  choice: mlinzi hukesha
  rationale: Hutoa kwa Kiswahili cha asili wazo la mlinzi kuendelea kuwa macho, huku likidumisha ulinganifu wa mstari.
theological_decisions:
- issue: Uhusiano wa juhudi za binadamu na tendo la Yahwe
  choice: Muundo wa masharti ‘Yahwe asipo- ... bure’ umehifadhiwa katika mistari yote miwili.
  alternative: Kutafsiri kama katazo la juhudi zote za binadamu au kama ahadi kwamba juhudi zote zitafanikiwa.
  rationale: Kiebrania huweka utegemezi wa kazi na ulinzi kwa Yahwe lakini hakifafanui zaidi namna ambavyo utendaji wa Mungu na kazi ya binadamu vinahusiana.
- issue: Maana ya ‘nyumba’
  choice: Maandishi makuu yametumia maana halisi ‘nyumba’.
  alternative: ‘Jamaa’, ‘ukoo’, au ‘nasaba’.
  rationale: Muktadha wa wajenzi unaunga mkono maana halisi, lakini matumizi mapana ya neno la Kiebrania yanawezekana na yamehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mistari mifupi inadumisha ulinganifu wa kishairi wa Kiebrania. ‘Huifanyia kazi’ huepuka uradidi mzito wa ‘ndani yake’ katika maandishi makuu, huku tanbihi ikihifadhi kirai hicho cha Kiebrania.
