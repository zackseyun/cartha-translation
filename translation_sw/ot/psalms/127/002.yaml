base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/002.yaml
  text: It is in vain for you to rise early[a], to sit up late, eating the bread of toil; for he gives sleep to his beloved.
translation:
  language: sw
  text: 'Ni bure kwenu kuamka mapema,


    kukaa hadi usiku sana,


    huku mkila mkate wa taabu;


    kwa maana yeye humpa mpendwa wake usingizi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana ndivyo anavyompa mpendwa wake akiwa usingizini,” au, “kwa maana humpa mpendwa wake wakati amelala.” Kiebrania kimefupishwa na kinaweza kumaanisha ama kwamba Mungu hutoa usingizi wenyewe, ama kwamba hutoa zawadi zake wakati mpendwa wake amelala.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁוְא
  choice: Ni kazi bure
  rationale: Usemi huu wa kawaida unaonyesha kwamba jitihada hizo hazina faida wala matokeo yanayokusudiwa katika muktadha huu.
- source_word: מַשְׁכִּימֵי קוּם
  choice: kuamka mapema
  rationale: Unawasilisha wazi tendo la kuamka asubuhi na mapema na kudumisha mfuatano wa vitenzi katika mstari.
- source_word: מְאַחֲרֵי שֶׁבֶת
  choice: kukaa hadi usiku sana
  rationale: Unahifadhi picha ya Kiebrania ya kukaa kwa muda mrefu, huku katika Kiswahili cha kawaida ukimaanisha kuendelea kuwa macho na kufanya kazi hadi usiku sana.
- source_word: אֹכְלֵי לֶחֶם הָעֲצָבִים
  choice: huku mkila mkate wa taabu
  rationale: Unahifadhi sitiari ya mkate na upana wa עֲצָבִים, linaloweza kuhusisha kazi ngumu, maumivu, na mahangaiko bila kulibana kuwa hisia moja tu.
- source_word: כֵּן
  choice: kwa maana
  rationale: Katika usomaji mkuu, linaonyesha msingi wa tofauti kati ya juhudi zenye mahangaiko na kile Mungu anachompa mpendwa wake; tafsiri nyingine ya kisintaksia imehifadhiwa katika tanbihi.
- source_word: יִתֵּן
  choice: humpa
  rationale: Wakati wa sasa unafaa kwa kauli ya jumla, na nafsi ya umoja inadokeza Mungu kutokana na muktadha wa zaburi.
- source_word: לִידִידוֹ
  choice: mpendwa wake
  rationale: Inadumisha umoja na wazo la mtu anayependwa kwa upendo wa karibu.
- source_word: שֵׁנָא
  choice: usingizi
  rationale: Nomino hii kwa kawaida humaanisha usingizi; katika usomaji mkuu inachukuliwa kuwa kitu kinachotolewa, huku uwezekano wa maana ya kutoa wakati wa usingizi ukibainishwa katika tanbihi.
theological_decisions:
- issue: Muundo mfupi na wenye utata wa כֵּן יִתֵּן לִידִידוֹ שֵׁנָא
  choice: kwa maana yeye humpa mpendwa wake usingizi
  alternative: ndivyo anavyompa mpendwa wake akiwa usingizini; au, humpa mpendwa wake hata anapolala
  rationale: Kiebrania kinaweza kueleweka kuwa Mungu hutoa usingizi wenyewe, au kwamba Mungu hutoa zawadi zake wakati mpendwa wake amelala. Usomaji mkuu ni wa asili na unaendana na tofauti kati ya mahangaiko ya binadamu na utoaji wa Mungu, lakini tanbihi inalinda utata halisi wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishairi na sitiari ya “mkate wa taabu” vimehifadhiwa; usemi umewekwa wazi kwa msomaji wa kawaida bila kuondoa utata wa kishazi cha mwisho.
