base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/001.yaml
  text: A Song of Ascents[a]. Of Solomon. Unless Yahweh builds the house, its builders labor in vain; unless Yahweh guards the city[c][b], the watchman stays awake in vain.
translation:
  language: sw
  text: 'Wimbo wa Kupanda[a]. Wa Sulemani.[b]


    Yahwe asipoijenga nyumba[c], wajenzi wake hufanya kazi bure;

    Yahwe asipoulinda mji, mlinzi hukesha bure.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wimbo wa Mapando.” Hiki ni kichwa cha mkusanyo wa zaburi; maana kamili ya “mapando” katika matumizi haya haijaelezwa.
    reason: alternative_reading
  - marker: b
    text: Au “Kwa ajili ya Sulemani” au “Unaohusiana na Sulemani”; kihusishi cha Kiebrania kinaweza kuonyesha uandishi, kuwekwa wakfu, au uhusiano.
    reason: alternative_reading
  - marker: c
    text: Katika Kiebrania, “nyumba” inaweza pia kumaanisha watu wa nyumbani au nasaba.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa Safari za Kupanda
  rationale: Huhifadhi wazo la kupanda katika kichwa cha mkusanyo huku ikitoa Kiswahili cha kawaida kinachoweza kueleweka kama safari za kwenda Yerusalemu.
- source_word: לִשְׁלֹמֹה
  choice: Wa Sulemani
  rationale: Ni usemi mfupi wa kawaida katika vichwa vya zaburi na hauamui kabisa ikiwa Sulemani ndiye mwandishi, mpokeaji, au mhusika anayehusishwa na zaburi.
- source_word: אִם ... לֹא
  choice: asipo-
  rationale: Muundo wa masharti wa Kiswahili unaonyesha kwa ufasaha maana ya ‘ikiwa ... si’ au ‘isipokuwa’ katika vifungu vyote viwili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika maandishi ya Kiebrania limetoholewa badala ya kubadilishwa na cheo.
- source_word: יִבְנֶה בַיִת
  choice: asipoijenga nyumba
  rationale: ‘Nyumba’ hudumisha taswira halisi inayolingana na ‘mji,’ bila kuondoa uwezekano wa maana pana ya jamaa au nasaba.
- source_word: שָׁוְא
  choice: bure
  rationale: Neno hili la kawaida na lenye uzito linaonyesha ubatili wa juhudi, na kurudiwa kwake kunahifadhi ulinganifu wa kishairi.
- source_word: עָמְלוּ בֹנָיו בוֹ
  choice: wanaoijenga wanajitaabisha
  rationale: ‘Wanajitaabisha’ huonyesha kazi ngumu; kiwakilishi cha ‘humo’ hakikutafsiriwa wazi kwa sababu uhusiano wake na nyumba tayari unaeleweka na kingefanya Kiswahili kuwa kizito.
- source_word: יִשְׁמָר עִיר
  choice: asipoulinda mji
  rationale: ‘Kulinda’ huonyesha ulinzi wa mji na kudumisha uhusiano wa moja kwa moja na mlinzi.
- source_word: שָׁקַד שׁוֹמֵר
  choice: mlinzi hukesha
  rationale: ‘Hukesha’ huhifadhi picha ya kuwa macho, huku ‘mlinzi’ ikibainisha kusudi la kukesha huko.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano lenyewe; kulitohowa kama ‘Yahwe’ huhifadhi jina badala ya kuliweka cheo mahali pake.
- issue: Maana ya בַיִת katika muktadha huu wa hekima
  choice: nyumba
  alternative: jamaa ya nyumbani au nasaba
  rationale: Ulinganifu wa kishairi na ‘mji’ na ‘mlinzi’ unaunga mkono taswira halisi, lakini maana pana inayowezekana imewekwa katika tanbihi bila kulazimishwa katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo unaorudiwa ‘Yahwe asipo- ... bure’ umehifadhi ulinganifu wa Kiebrania. Wakati wa mazoea (‘wanajitaabisha,’ ‘hukesha’) umetumiwa kwa kuwa kauli ni ya hekima ya jumla.
