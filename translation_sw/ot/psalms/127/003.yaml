lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta usikivu na kuingiza tamko kwa mkazo; “Tazama” huhifadhi nguvu hiyo katika ushairi wa Kiswahili.
- source_word: נַחֲלַת יְהוָה
  choice: urithi kutoka kwa Yahwe
  rationale: Muundo wa Kiebrania unaweza kuonyesha milki au chanzo. Usambamba na “thawabu” unaunga mkono maana ya watoto kuwa zawadi inayotoka kwa Yahwe, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina la Mungu lililoandikwa moja kwa moja katika matini ya Kiebrania.
- source_word: בָּנִים
  choice: watoto
  rationale: Ingawa nomino ya Kiebrania ina umbo la kiume kwa wingi, hapa maana ni ya jumla kwa uzao, si wana wa kiume pekee.
- source_word: שָׂכָר
  choice: thawabu
  rationale: Huwasilisha maana chanya ya malipo au zawadi bila kulazimisha wazo la mshahara wa biashara.
- source_word: פְּרִי הַבָּטֶן
  choice: uzao wa tumbo
  rationale: Huhifadhi picha ya Kiebrania ya tunda/zao linalotoka tumboni kwa usemi wa Kiswahili unaoeleweka na wenye hadhi ya kishairi.
theological_decisions:
- issue: Maana ya muundo נַחֲלַת יְהוָה
  choice: watoto ni urithi kutoka kwa Yahwe
  alternative: watoto ni urithi wa Yahwe
  rationale: 'Muundo wa umilikaji wa Kiebrania una utata halisi: unaweza kumaanisha urithi ambao Yahwe hutoa au urithi ulio wake. Usambamba na “thawabu” unapendelea maana ya chanzo, lakini maana ya umilikaji imehifadhiwa katika tanbihi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. “Tazama” na “uzao wa tumbo” huhifadhi picha za Kiebrania bila kufanya sentensi kuwa ngumu kwa msomaji wa kawaida.
