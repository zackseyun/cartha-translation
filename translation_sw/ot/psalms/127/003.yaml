  yaml_path: translation/ot/psalms/127/003.yaml
  text: Behold[a], children are a heritage from Yahweh, the fruit of the womb a reward.
translation:
  language: sw
  text: Tazama, watoto ni urithi kutoka kwa Yahwe; zao la tumbo ni thawabu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watoto ni urithi wa Yahwe.”
