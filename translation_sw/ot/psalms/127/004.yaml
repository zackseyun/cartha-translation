base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/004.yaml
  text: Like arrows in the hand of a warrior[a], so are the sons of one's youth.
translation:
  language: sw
  text: Kama mishale mkononi mwa shujaa, ndivyo walivyo wana wa ujanani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, wana waliozaliwa wakati mtu alipokuwa kijana.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/חִצִּים
  choice: Kama mishale
  rationale: חִצִּים ni wingi wa חֵץ, neno la kawaida kwa mishale; kiambishi כְּ kinaanzisha tashbihi, hivyo “kama mishale” ni tafsiri ya asili na sahihi.
- source_word: בְּ/יַד
  choice: mkononi mwa
  rationale: בְּיַד, kwa umoja, huonyesha kitu kilicho mikononi, chini ya udhibiti, au kinachotumiwa na mtu; “mkononi mwa” ni usemi wa kawaida wa Kiswahili na huhifadhi umoja.
- source_word: גִּבּוֹר
  choice: shujaa
  rationale: גִּבּוֹר hapa humaanisha mtu hodari wa vita. “Shujaa” linafaa kwa taswira ya mtu anayetumia mishale bila kuongeza maelezo yasiyokuwamo katika Kiebrania.
- source_word: כֵּן
  choice: ndivyo walivyo
  rationale: כֵּן hukamilisha ulinganisho kwa maana ya “vivyo hivyo/ndivyo”; “ndivyo walivyo” ni Kiswahili cha asili kinacholingana na nomino hai ya wingi inayofuata.
- source_word: בְּנֵי
  choice: wana
  rationale: בְּנֵי ni wingi wa kiume wa “mwana” katika hali ya muundo. “Wana” huhifadhi marejeo ya wana wa kiume badala ya kuyapanua kimyakimya kuwa watoto wote.
- source_word: הַ/נְּעוּרִים
  choice: ujana wa mtu
  rationale: נְעוּרִים humaanisha ujana au miaka ya ujana. Kiebrania hakimtaji mwenye ujana waziwazi; “wa mtu” hutoa maana ya jumla kwa Kiswahili cha kawaida huku tanbihi ikieleza maana ya kimuktadha.
theological_decisions:
- issue: Usemi wenye jinsia katika בְּנֵי הַנְּעוּרִים
  choice: wana wa ujana wa mtu
  alternative: watoto waliozaliwa wakati wa ujana wa mtu
  rationale: Kiebrania kina nomino ya wingi wa kiume na huenda taswira ya zaburi inawalenga hasa wana katika mazingira ya kijamii ya wakati huo. Matini kuu huhifadhi jinsia na muundo wa Kiebrania; tanbihi inaeleza maana ya kiidioma bila kuibadili kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kimethali na tashbihi ya Kiebrania umehifadhiwa; “mkononi mwa” na “ndivyo walivyo” ni miundo ya kawaida ya Kiswahili.
