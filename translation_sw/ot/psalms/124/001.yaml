  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד לוּלֵ֣י יְ֭הוָה שֶׁ/הָ֣יָה לָ֑/נוּ יֹֽאמַר נָ֝א יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/001.yaml
  text: A Song of Ascents[a]. Of David. If Yahweh had not been for us—let Israel now say—
translation:
  language: sw
  text: 'Wimbo wa kwenda juu. Wa Daudi.

    Kama Yahwe asingekuwa kwa ajili yetu[a]—

    Israeli na aseme sasa—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa lugha ya kiidioma zaidi, “asingekuwa upande wetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa kwenda juu
  rationale: Inabaki karibu na maana ya msingi ya ‘wimbo wa kupanda/kwenda juu’ huku ikiacha wazi iwapo kichwa hiki kinahusu safari ya hija, matumizi ya kiliturujia, au namna nyingine ya kupanda.
- source_word: לְדָוִד
  choice: Wa Daudi
  rationale: Kirai hiki cha kawaida katika vichwa vya zaburi hakilazimishi kuamua ikiwa Daudi ndiye mtunzi, mhusika anayehusishwa na wimbo, au aliyelengwa kupewa wimbo.
- source_word: לוּלֵי
  choice: Kama ... asingekuwa
  rationale: Muundo huu unaonyesha hali ya kudhani kinyume na kilichotokea na unaandaa kukamilishwa kwa wazo katika mstari unaofuata.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetafsiriwa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: שֶׁהָיָה לָנוּ
  choice: asingekuwa kwa ajili yetu
  rationale: Tafsiri hii inafuata kwa ukaribu wazo la Yahwe kuwapo kwa manufaa na msaada wa Israeli bila kulifafanua kabisa kwa sitiari ya kuwa ‘upande wetu.’
- source_word: יֹאמַר נָא
  choice: na aseme sasa
  rationale: Huwasilisha mwito wa kusisitiza unaotolewa kwa Israeli kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Ni umbo la kawaida la Kiswahili la jina la taifa na watu wa agano.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya שֶׁהָיָה לָנוּ
  choice: asingekuwa kwa ajili yetu
  alternative: asingekuwa upande wetu
  rationale: Matini kuu inadumisha kwa ukaribu muundo mpana wa Kiebrania; tafsiri ya kiidioma zaidi imehifadhiwa katika tanbihi bila kuifanya kuwa maana pekee inayowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo mfupi, wa kishairi na wenye hadhi. Mistari na vistari virefu vinahifadhi hali ya sentensi kutokamilika hadi mstari unaofuata. Alama [a] imewekwa mara baada ya kirai kinachofafanuliwa na tanbihi.
