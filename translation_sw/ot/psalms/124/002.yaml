  text: If Yahweh had not been for us when man rose up against us—[a]
translation:
  language: sw
  text: Kama Yahwe asingekuwa upande wetu wakati wanadamu walipoinuka dhidi yetu—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kama Yahwe asingekuwa kwa ajili yetu wakati wanadamu walipoinuka dhidi yetu.”
    reason: Mbadala huu unafuata kwa karibu zaidi muundo halisi wa לָנוּ, ingawa si wa kawaida sana katika Kiswahili.
lexical_decisions:
- source_word: לוּלֵי
  choice: Kama ... asingekuwa
  rationale: Huanzisha hali ya kinyume na ukweli iliyopita; muundo huu wa Kiswahili huendelea kwa kawaida hadi jibu la sharti katika mstari unaofuata.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: שֶׁהָיָה לָנוּ
  choice: asingekuwa upande wetu
  rationale: Katika muktadha huu, kuwa 'kwetu' kuna maana ya kutuunga mkono au kututetea. 'Upande wetu' ni Kiswahili cha asili kinachoonyesha maana hiyo.
- source_word: בְּקוּם עָלֵינוּ
  choice: wakati ... walipotuinukia
  rationale: בְּ pamoja na kitenzi-jina huonyesha wakati, huku קום על katika muktadha wa uhasama ikimaanisha kuinuka dhidi ya mtu.
- source_word: אָדָם
  choice: wanadamu
  rationale: Nomino ya Kiebrania iko katika umoja lakini hapa inatumiwa kwa maana ya kijumla ya washambuliaji wa kibinadamu; 'wanadamu' ni ya kawaida na huepuka kudokeza mshambuliaji mmoja tu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina la agano; 'Yahwe' hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya שֶׁהָיָה לָנוּ
  choice: asingekuwa upande wetu
  alternative: asingekuwa kwa ajili yetu
  rationale: Chaguo kuu linaonyesha msaada wa Yahwe kwa lugha ya kawaida ya Kiswahili, bila kulifanya dai hilo kuwa la uwepo tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Alama ya mkwaju mwishoni inaonyesha kuwa sentensi inaendelea katika mstari unaofuata.
