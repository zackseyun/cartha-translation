  text: then they would have swallowed us alive when their anger burned against us[a][b].
translation:
  language: sw
  text: ndipo wangetumeza tukiwa hai, hasira yao ilipowaka dhidi yetu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walitumeza,” ikiwa kitenzi kitaeleweka kuwa wakati uliopita wa kawaida; muktadha mpana (mistari 2–5) unaunga mkono maana ya jambo lisilotimia, “wangetumeza.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “pua yao ilipowaka dhidi yetu,” nahau ya Kiebrania inayomaanisha hasira.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲזַי
  choice: ndipo
  rationale: Kielezi hiki huonyesha matokeo katika mfululizo wa masharti usiotimia; “ndipo” ni ya asili na inaunganisha mstari huu na uliotangulia.
- source_word: חַיִּים
  choice: tukiwa hai
  rationale: Neno hili linatumika kielezi kumaanisha kwamba wangetumeza bado tukiwa hai; muundo huu ni wazi na wa kawaida katika Kiswahili.
- source_word: בְּלָעוּנוּ
  choice: wangetumeza
  rationale: Ingawa kitenzi ni timilifu katika Kiebrania, muktadha wa Zaburi 124:2–5 ni wa jambo la kudhaniwa lisilotimia, hivyo hali ya masharti inaafiki Kiswahili; taswira halisi ya kumeza imehifadhiwa.
- source_word: בַּחֲרוֹת
  choice: ilipowaka
  rationale: Kitenzi kisicho na ukomo chenye kiambishi בְּ huonyesha wakati au mazingira, kihalisi ‘katika kuwaka’; “ilipowaka” huhifadhi sitiari ya moto kwa lugha ya asili.
- source_word: אַפָּם
  choice: hasira yao
  rationale: Neno אַף lina maana ya msingi ya ‘pua,’ lakini hapa ni nahau ya Kiebrania ya hasira; “hasira” ndiyo maana inayoeleweka moja kwa moja.
- source_word: בָּנוּ
  choice: dhidi yetu
  rationale: Pamoja na kitenzi cha kukasirika, בְּ huonyesha uhasama unaoelekezwa kwa mtu; “dhidi yetu” hudokeza nguvu hiyo kwa usahihi.
