  text: then the waters would have swept us away[a]; the stream would have passed over our soul.
translation:
  language: sw
  text: 'ndipo maji yangetukumba;

    mkondo wa maji ungepita juu ya uhai wetu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafsi yetu,” au kwa urahisi “sisi wenyewe.” Neno la Kiebrania linaweza kumaanisha uhai au mtu mzima.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲזַי
  choice: ndipo
  rationale: Ni kielezi cha wakati kinachoendeleza hali ya kudhaniwa iliyoanza katika mstari uliotangulia; “ndipo” ni ya asili na yenye uzito wa kishairi.
- source_word: הַמַּיִם
  choice: maji
  rationale: Nomino ya Kiebrania iko katika wingi na inaleta taswira halisi ya maji hatari; Kiswahili hutumia “maji” bila kutofautisha umoja na wingi.
- source_word: שְׁטָפוּנוּ
  choice: yangetukumba
  rationale: Kitenzi kinaonyesha maji yanayofurika na kushinda nguvu ya watu. “Yangetukumba” hudumisha nguvu ya taswira bila kuongeza wazi wazo la kufa maji; hali ya -nge- huonyesha maana ya kudhaniwa kutokana na muktadha.
- source_word: נַחְלָה
  choice: mkondo wa maji
  rationale: Neno linaweza kumaanisha kijito au mto wa bondeni, lakini hapa linaonyesha maji yanayotiririka kwa nguvu. “Mkondo wa maji” ni wazi na halidhoofishi hatari kama ambavyo “kijito” lingeweza kufanya.
- source_word: עָבַר עַל
  choice: ungepita juu ya
  rationale: Huhifadhi kitenzi cha msingi “kupita” na kihusishi kinachoonyesha maji yakivuka juu ya aliye hatarini.
- source_word: נַפְשֵׁנוּ
  choice: uhai wetu
  rationale: Katika muktadha huu נֶפֶשׁ humaanisha uhai au mtu mwenyewe, si lazima sehemu tofauti isiyo ya mwili. “Uhai wetu” ni Kiswahili cha kawaida kinachodumisha hatari ya kupoteza maisha; tanbihi inaweka wazi upana wa maana.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika muktadha wa hatari ya mafuriko
  choice: uhai wetu
  alternative: nafsi yetu; sisi wenyewe
  rationale: Neno hapa halilazimishi fundisho maalumu kuhusu sehemu za mwanadamu. “Uhai wetu” huwasilisha maana ya kimuktadha huku tanbihi ikihifadhi uwezekano wa kurejelea mtu mzima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa mistari miwili na urudiaji wa taswira ya maji umehifadhiwa; hali ya kudhaniwa imeonyeshwa kwa viambishi vya -nge-.
