  text: Our help is in the name of Yahweh[a], maker of heaven and earth.
translation:
  language: sw
  text: Msaada wetu uko katika jina la Yahwe[a], Muumba wa mbingu na nchi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH,” jina la Mungu; pia hutamkwa “Yahweh” au “Yehova.” Katika tafsiri nyingi za Kiswahili hutolewa kwa “BWANA.”'
    reason: Hufafanua umbo la Kiebrania la jina na matumizi ya kibadala cha kimapokeo bila kubadilisha jina lililotumiwa katika tafsiri.
lexical_decisions:
- source_word: עֶזְרֵנוּ
  choice: Msaada wetu
  rationale: Nomino עֵזֶר pamoja na kiambishi cha nafsi ya kwanza wingi humaanisha msaada wetu, si mtu aliye msaidizi wetu.
- source_word: בְּשֵׁם
  choice: uko katika jina la
  rationale: Muundo huu unaonyesha msingi au mahali pa kutegemea na kuomba; ‘katika jina la’ huhifadhi uzito wa kiagano na kiliturujia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: עֹשֵׂה
  choice: aliyezifanya
  rationale: Kitenzi-shirikishi cha Kiebrania humtambulisha Yahwe kwa tendo lake la kuumba; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: mbingu na dunia
  rationale: Jozi hii ni usemi unaojumlisha uumbaji wote; ‘mbingu na dunia’ ni tafsiri ya kawaida na sahihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi YHWH. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku tanbihi ikieleza umbo la Kiebrania.
- issue: Nguvu ya usemi ‘katika jina la’
  choice: katika jina la
  alternative: hutoka kwa; kwa uwezo wa
  rationale: Tafsiri ya karibu huhifadhi uwezekano wa maana zinazohusiana za kutegemea, mamlaka, na kuliitia jina bila kuuchukulia usemi huo kwa maana moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayofaa kwa usomaji wa ibada. ‘Uko’ limechaguliwa ili kupatana na nomino ‘msaada,’ na ‘aliyezifanya’ huepuka kulazimisha cheo kisichotajwa wazi katika Kiebrania.
