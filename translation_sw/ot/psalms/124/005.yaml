  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maji yenye kiburi yangepita juu yetu.” Kivumishi cha Kiebrania kinaweza kumaanisha “yenye kiburi,” “yenye jeuri,” au “ya kujikinai”; hapa kinayaeleza maji kisitiari kuwa yenye nguvu ya kupita kiasi na ya kutisha.
