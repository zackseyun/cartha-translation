lexical_decisions:
- source_word: אֲזַי
  choice: ndipo
  rationale: Ni kielezi cha wakati kinachoendeleza matokeo ya hali isiyotokea katika mistari iliyotangulia; “ndipo” ni kiunganishi cha kawaida na cha kishairi.
- source_word: עָבַר עַל
  choice: yangepita juu ya
  rationale: Muundo huu unadumisha picha halisi ya maji kupita juu ya mtu, huku kiambishi -nge- kikionyesha matokeo ya hali isiyotokea yanayotokana na muktadha.
- source_word: נַפְשֵׁנוּ
  choice: yetu
  rationale: Ingawa neno hilo linaweza kutafsiriwa kihalisi kuwa “nafsi yetu” au “uhai wetu,” hapa linamaanisha sisi wenyewe kwa pamoja; “juu yetu” ni Kiswahili cha kawaida na kinadumisha maana hiyo.
- source_word: הַמַּיִם
  choice: maji
  rationale: “Maji” ndiyo neno la kawaida la Kiswahili na linafaa kwa taswira ya gharika.
- source_word: הַזֵּידוֹנִים
  choice: yenye jeuri
  rationale: Kivumishi hicho hutokana na wazo la kiburi, ukaidi, au kujikinai. Kinapotumiwa kwa maji kwa njia ya sitiari, “yenye jeuri” huwasilisha nguvu yake kali na ya kuonea bila kuondoa sitiari.
