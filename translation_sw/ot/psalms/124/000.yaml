lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa Kupanda
  rationale: Huhifadhi picha ya kupanda katika kichwa cha zaburi kwa Kiswahili cha kawaida, bila kuamua ikiwa inahusu safari ya kwenda Yerusalemu au maana nyingine ya ‘hatua’.
- source_word: יְהוָה
  choice: YAHWE
  rationale: Huwakilisha jina binafsi la Mungu lililoandikwa kwa konsonanti nne katika maandishi ya Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: לוּלֵי ... שֶׁהָיָה לָנוּ
  choice: Kama ... asingekuwa upande wetu
  rationale: Muundo wa Kiswahili unaonyesha hali ya kinyume na uhalisi inayokusudiwa na לוּלֵי, huku ‘upande wetu’ ukitoa kwa kawaida maana ya Mungu kuwa kwa ajili ya Israeli.
- source_word: יֹאמַר נָא יִשְׂרָאֵל
  choice: Israeli na aseme sasa
  rationale: Huhifadhi mwito wa mshairi kwa jumuiya nzima ya Israeli kutamka maneno yanayofuata.
theological_decisions:
- issue: Maana ya kuwa kwa ajili ya Israeli
  choice: asingekuwa upande wetu
  alternative: asingekuwa kwa ajili yetu
  rationale: Chaguo hili linaeleza kwa Kiswahili cha kawaida msaada na utetezi wa YAHWE bila kuingiza fundisho maalumu zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya heshima, ya sasa, na rahisi kusomeka kwa sauti. Mistari na vistari virefu huhifadhi sentensi isiyokamilika inayoendelea katika aya inayofuata.
