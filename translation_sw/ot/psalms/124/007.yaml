source:
  edition: WLC
  text: נַפְשֵׁ֗/נוּ כְּ/צִפּ֥וֹר נִמְלְטָה֮ מִ/פַּ֪ח י֫וֹקְשִׁ֥ים הַ/פַּ֥ח נִשְׁבָּ֗ר וַ/אֲנַ֥חְנוּ נִמְלָֽטְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/007.yaml
  text: Our soul has escaped like a bird from the snare of the fowlers[a]; the snare is broken[b], and we have escaped.
translation:
  language: sw
  text: Nafsi yetu imeponyoka kama ndege kutoka mtegoni mwa wategaji; mtego umevunjika, nasi tumeponyoka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַפְשֵׁנוּ
  choice: uhai wetu
  rationale: Katika muktadha huu נֶפֶשׁ humaanisha uhai au nafsi nzima iliyo katika hatari. “Uhai wetu” huwasilisha wazi wokovu wa watu bila kuingiza dhana ya kugawanya mwili na roho.
- source_word: כְּצִפּוֹר
  choice: kama ndege
  rationale: צִפּוֹר ni neno la jumla kwa ndege, hasa ndege mdogo; hakuna sababu ya kulitaja kama aina maalumu.
- source_word: נִמְלְטָה / נִמְלָטְנוּ
  choice: umeokoka / tumeokoka
  rationale: Kitenzi מלט katika Niphal kinaonyesha kuponyoka au kuokolewa kutoka hatarini. Kurudia “okoka” kunahifadhi marudio ya kishairi ya Kiebrania.
- source_word: פַּח
  choice: mtego
  rationale: פַּח ni mtego unaotegwa hasa kwa ndege. “Mtego” ni neno la kawaida na linaloeleweka katika Kiswahili, na limerudiwa ili kuhifadhi msisitizo wa asili.
- source_word: יוֹקְשִׁים
  choice: wategaji
  rationale: Umbo hili linamaanisha watu wanaoweka mitego. “Wategaji” ni la asili katika Kiswahili na linafaa kwa taswira ya ndege aliyenaswa.
- source_word: נִשְׁבָּר
  choice: umevunjika
  rationale: 'Kauli ya kutendwa inaeleza tendo lililokamilika lenye matokeo ya sasa: mtego sasa hauna nguvu ya kuwazuia.'
- source_word: וַאֲנַחְנוּ
  choice: nasi
  rationale: Kiwakilishi cha wazi kina msisitizo; “nasi” kinauhifadhi kwa njia fupi na ya kishairi.
theological_decisions:
- issue: Maana ya נַפְשֵׁנוּ
  choice: uhai wetu
  alternative: nafsi yetu
  rationale: Katika picha ya ndege anayeponyoka mtegoni, maana kuu ni uhai wa jumuiya uliookolewa. “Uhai” huepuka kuelekeza mstari bila ulazima kwenye fundisho maalumu kuhusu nafsi, huku maana ya mtu mzima ikibaki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini rahisi kueleweka. Marudio ya “mtego” na “okoka” yamehifadhiwa kwa sababu ni muhimu katika muundo na msisitizo wa mstari wa Kiebrania.
