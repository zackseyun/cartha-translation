  text: בָּר֥וּךְ יְהוָ֑ה שֶׁ/לֹּ֥א נְתָנָ֥/נוּ טֶ֝֗רֶף לְ/שִׁנֵּי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/006.yaml
  text: Blessed be Yahweh[a], who has not given us as prey to their teeth.
translation:
  language: sw
  text: Abarikiwe Yahwe[a], ambaye hakutuwapa meno yao kama mawindo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Asifiwe Yahwe.” Kauli ya Kiebrania ni tamko la baraka lenye nguvu ya sifa; “Abarikiwe Yahwe” huhifadhi moja kwa moja lugha ya baraka.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Abarikiwe
  rationale: Kauli hii ya baraka ina nguvu ya kiliturujia na ya sifa. “Abarikiwe” huhifadhi lugha ya kubariki badala ya kuibadili moja kwa moja kuwa lugha ya kusifu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili, badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: שֶׁלֹּא
  choice: ambaye haku-
  rationale: Kiwakilishi “ambaye” kinaunganisha baraka hiyo na tendo la Yahwe kwa Kiswahili cha kawaida; ukanushi umebebwa na kitenzi “hakututoa.”
- source_word: נְתָנָנוּ
  choice: hakututoa
  rationale: Kitenzi cha wakati uliopita kinaeleza tendo la ukombozi lililokamilika. “Kututoa” huhifadhi maana ya msingi ya kutoa bila kuongeza wazo la ‘kutukabidhi’ lisilotajwa wazi.
- source_word: טֶרֶף
  choice: mawindo
  rationale: Katika muktadha wa “meno yao,” neno hili linaonyesha mawindo ya mnyama, hivyo linahifadhi taswira ya maadui kama wanyama wanaowinda.
- source_word: לְשִׁנֵּיהֶם
  choice: ya meno yao
  rationale: Muundo “mawindo ya meno yao” ni wa asili katika Kiswahili na huhifadhi taswira halisi ya meno badala ya kuifafanua kuwa ‘ili watutafune’ au ‘watuchane.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandiko ya Kiebrania yanatumia jina binafsi la Mungu hapa. “Yahwe” huhifadhi jina hilo kwa tahajia inayofaa Kiswahili badala ya kulibadilisha kuwa cheo.
- issue: Kauli ya baraka בָּרוּךְ
  choice: Abarikiwe
  alternative: Asifiwe
  rationale: “Abarikiwe” huhifadhi dhana ya Kiebrania ya kutamka baraka juu ya Yahwe, huku “Asifiwe” ikiwa tafsiri ya maana inayohamisha kauli hiyo waziwazi kwenda kwenye sifa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Taswira halisi ya mawindo na meno imehifadhiwa.
