source:
  edition: WLC
  text: יְהוָ֤ה פֹּ֘קֵ֤חַ עִוְרִ֗ים יְ֭הוָה זֹקֵ֣ף כְּפוּפִ֑ים יְ֝הוָ֗ה אֹהֵ֥ב צַדִּיקִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/008.yaml
  text: Yahweh opens the eyes of the blind[a]; Yahweh raises up those who are bowed down; Yahweh loves the righteous.
translation:
  language: sw
  text: Yahwe huyafumbua macho ya vipofu[a]; Yahwe huwainua walioinama; Yahwe huwapenda wenye haki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huwapa vipofu uwezo wa kuona.” Kiebrania husema kihalisi kwamba anawafumbua vipofu, yaani, anafumbua macho yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi wa Kiswahili “Yahwe,” badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: פֹּקֵחַ
  choice: huyafumbua macho ya
  rationale: Pamoja na עִוְרִים, kitenzi kinaeleza kufumbuliwa kwa macho ili kuona. “Huyafumbua macho ya” huhifadhi taswira halisi ya Kiebrania na ni Kiswahili cha kawaida.
- source_word: עִוְרִים
  choice: vipofu
  rationale: Kivumishi cha wingi kimetumika kama nomino; “vipofu” ni usemi mfupi na wa kawaida kwa watu wasioona.
- source_word: זֹקֵף
  choice: huwainua
  rationale: Kitenzi kinaweza kumaanisha kuinua au kufanya mtu asimame wima. “Huwainua” hudumisha maana ya kimwili na pia uwezekano wa kurejeshwa kutoka hali ya mateso.
- source_word: כְּפוּפִים
  choice: walioinama
  rationale: Neno linaonyesha watu waliopinda au kuinamishwa. “Walioinama” huhifadhi sitiari bila kuamua ikiwa hali hiyo ni ya kimwili, ya mateso, au ya kunyenyekezwa.
- source_word: אֹהֵב
  choice: huwapenda
  rationale: Kauli ya mazoea “huwapenda” inalingana na umbo la Kiebrania linaloonyesha tabia ya kudumu.
- source_word: צַדִּיקִים
  choice: wenye haki
  rationale: “Wenye haki” ni tafsiri ya kawaida na wazi ya neno hili linapotumiwa kama nomino ya watu, bila kulibana kwenye maana ya kimahakama pekee.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano YHWH. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya walioinama
  choice: walioinama
  alternative: waliopinda; walioteswa
  rationale: Tafsiri hii huhifadhi upana wa taswira ya Kiebrania, ambayo inaweza kueleweka kimwili au kama hali ya kudhulumiwa na kuteseka, bila kuamua maana moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Marudio ya “Yahwe” yamehifadhiwa ili kufuata msisitizo na mpangilio wa kishairi wa Kiebrania.
