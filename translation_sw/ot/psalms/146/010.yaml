source:
  edition: WLC
  text: יִמְלֹ֤ךְ יְהוָ֨ה לְ/עוֹלָ֗ם אֱלֹהַ֣יִ/ךְ צִ֭יּוֹן לְ/דֹ֥ר וָ/דֹ֗ר הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/010.yaml
  text: Yahweh will reign forever—your God[a], Zion, from generation to generation. Hallelujah!
translation:
  language: sw
  text: Yahwe atatawala milele—Mungu wako, Ee Sayuni—kizazi baada ya kizazi. Haleluya![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa Kiebrania: “Msifuni Yah!” “Yah” ni umbo fupi la jina Yahwe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְלֹךְ
  choice: atatawala
  rationale: Kitenzi hiki cha Kiebrania katika hali ya kutotimia kinaeleza utawala wa Yahwe unaoendelea bila mwisho, huku hapa kikitoa tangazo lenye mwelekeo wa wakati ujao.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo kama “BWANA”.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Katika muktadha huu wa sifa, neno hili linaonyesha muda usio na mwisho; “milele” ni usemi wa kawaida na wazi wa Kiswahili.
- source_word: אֱלֹהַיִךְ
  choice: Mungu wako
  rationale: Kiambishi cha nafsi ya pili umoja wa kike kinamhusu Sayuni anayesemeshwa kama mwanamke; Kiswahili hakihitaji kuonyesha jinsia hiyo katika kiwakilishi.
- source_word: צִיּוֹן
  choice: Ee Sayuni
  rationale: Jina limetoholewa kama “Sayuni,” na “Ee” linaonyesha wazi kwamba Sayuni anaitwa moja kwa moja bila kubadili maana ya kishairi.
- source_word: לְדֹר וָדֹר
  choice: kizazi baada ya kizazi
  rationale: Usemi huu wa Kiswahili unaonyesha mfululizo usiokoma wa vizazi na kuhifadhi urudiaji wa nahau ya Kiebrania.
- source_word: הַלְלוּ יָהּ
  choice: Haleluya!
  rationale: Huu ni utohozi uliozoeleka katika Kiswahili wa mwito wa kiliturujia wa Kiebrania; maana yake ya moja kwa moja imeelezwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. Kulitohowa kama “Yahwe” huhifadhi jina hilo badala ya kuliwakilisha kwa cheo.
- issue: Uwasilishaji wa mwito הַלְלוּ יָהּ
  choice: Haleluya!
  alternative: Msifuni Yah!; Msifuni Yahwe!
  rationale: “Haleluya” huhifadhi umbo la mwito wa Kiebrania linalotambulika katika ibada ya Kiswahili, huku tanbihi ikifafanua maana yake na jina fupi “Yah.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mistari mirefu imetenganishwa kwa vistari ili kuonyesha kwamba “Mungu wako, Ee Sayuni” ni maelezo ya kati yanayomsemesha Sayuni moja kwa moja.
