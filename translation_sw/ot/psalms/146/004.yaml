base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/004.yaml
  text: His breath goes out[a]; he returns to his ground; on that very day his plans perish.
translation:
  language: sw
  text: Pumzi yake imetoka[a]; yeye amerudi katika ardhi yake; siku hiyo hiyo mipango yake imeangamia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho yake imetoka.” Neno la Kiebrania רוּחַ linaweza kumaanisha “pumzi” au “roho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּצֵא
  choice: hutoka
  rationale: Kitenzi יצא kina picha halisi ya kutoka kwa pumzi ya uhai wakati wa kifo; “hutoka” ni cha kawaida na hakiongezi tafsiri ya kimafundisho.
- source_word: רוּחוֹ
  choice: pumzi yake
  rationale: רוּחַ inaweza kumaanisha pumzi au roho. Katika muktadha huu wa kufa na kurudi udongoni, “pumzi” huonyesha uhai unaokoma bila kulazimisha msimamo maalumu kuhusu hali ya mtu baada ya kifo.
- source_word: יָשֻׁב
  choice: hurudi
  rationale: שוב humaanisha kurudi; hapa mhusika anaeleweka kuwa mtu anayerejea udongoni.
- source_word: לְאַדְמָתוֹ
  choice: kwenye udongo wake
  rationale: אֲדָמָה ni ardhi au udongo, na kiambishi cha umilikaji kimehifadhiwa kwa “wake.” “Udongo” pia hudumisha picha ya asili bila kuingiza neno “mavumbi” kutoka vifungu vingine.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo hiyo
  rationale: Usemi huu unasisitiza kwamba mwisho wa mipango yake hutokea mara moja siku hiyo.
- source_word: אָבְדוּ
  choice: huangamia
  rationale: אבד huonyesha kupotea, kuharibika, au kufikia mwisho; “huangamia” ni neno lenye uzito linalofaa onyo la zaburi kuhusu kutowategemea wanadamu.
- source_word: עֶשְׁתֹּנֹתָיו
  choice: mipango yake
  rationale: Nomino hii adimu inaweza kumaanisha mawazo, makusudio, au mipango. “Mipango” hufaa muktadha wa makusudio ya mwanadamu yanayokoma wakati wa kifo.
theological_decisions:
- issue: Maana ya רוּחוֹ katika muktadha wa kifo
  choice: “Pumzi yake” katika matini kuu
  alternative: “Roho yake”
  rationale: “Pumzi” hudumisha picha halisi ya uhai unaokoma na huepuka kutoa uamuzi kuhusu hali ya kati baada ya kifo. Kwa kuwa neno la Kiebrania linaweza pia kumaanisha “roho,” uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; urudiaji “siku hiyo hiyo” unatoa msisitizo wa wakati uliopo katika Kiebrania.
