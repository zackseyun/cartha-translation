    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהַלְלָה
  choice: Nitam­sifu
  rationale: Kauli ya nafsi ya kwanza inaonyesha azimio la hiari lenye mwelekeo wa wakati ujao; “nitamsifu” ni ya kawaida na haiongezi wazo la kuendelea lisilotajwa wazi katika kitenzi chenyewe.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lenye herufi nne limeandikwa moja kwa moja katika Kiebrania; “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- source_word: בְּחַיָּי
  choice: maisha yangu yote
  rationale: Kihalisi ni “katika maisha yangu,” lakini hapa ni nahau ya muda unaoenea katika kipindi chote cha maisha ya msemaji.
- source_word: אֲזַמְּרָה
  choice: nitamwimbia ... sifa
  rationale: Kitenzi זמר huonyesha kuimba au kufanya muziki wa sifa; muundo huu wa Kiswahili huhifadhi wazo la muziki na la kusifu.
- source_word: לֵאלֹהַי
  choice: Mungu wangu
  rationale: Kiambishi ל־ humtaja anayeelekezewa wimbo; katika Kiswahili uhusiano huo unaonyeshwa kwa kiambishi cha yambwa katika “nitamwimbia.”
- source_word: בְּעוֹדִי
  choice: maadamu ninaishi
  rationale: Kirai hiki huonyesha kuendelea kuwapo; “maadamu ninaishi” ni nahau ya kawaida ya Kiswahili inayoeleza muda huo bila ukakamavu wa tafsiri ya neno kwa neno.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia jina la Mungu moja kwa moja. “Yahweh” hulihifadhi kwa unukuzi bila kulibadilisha kuwa cheo au kuchagua matamshi mbadala.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Mistari sambamba imehifadhiwa kwa “maisha yangu yote” na “maadamu ninaishi”; “nitamwimbia ... sifa” ni muundo wa kawaida unaoonyesha kuwa Mungu ndiye anayeimbiwa sifa.
