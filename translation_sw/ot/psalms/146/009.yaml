base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/009.yaml
  text: Yahweh watches over the sojourners[a]; he upholds the fatherless and the widow[b], but he twists the way of the wicked.
translation:
  language: sw
  text: Yahwe huwalinda wageni[a]; huwategemeza yatima na mjane, lakini hupindisha njia ya waovu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wasio wenyeji” au “wageni wanaoishi miongoni mwa watu”; Kiebrania kinamaanisha watu wa kutoka nje wanaoishi miongoni mwa wenyeji.
    reason: lexical_alternative
  - marker: b
    text: Au “huifanya njia ya waovu kuwa potovu” au “huiharibu njia ya waovu.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina la Mungu lililofunuliwa badala ya kulibadilisha kuwa cheo; tahajia hii ni ya kawaida katika Kiswahili.
- source_word: שֹׁמֵר
  choice: huwalinda
  rationale: Wakati wa mazoea unaonyesha ulinzi na utunzaji wa Yahwe unaoendelea.
- source_word: גֵּרִים
  choice: wageni
  rationale: Katika muktadha huu ni watu wasio wenyeji wanaoishi miongoni mwa jamii; neno la kawaida la Kiswahili linahitaji ufafanuzi wa tanbihi ili kuhifadhi maana hiyo ya kijamii.
- source_word: יָתוֹם וְאַלְמָנָה
  choice: yatima na mjane
  rationale: Umoja wa kiujumla wa Kiebrania umehifadhiwa na unatoa jozi ya kishairi ya watu walio hatarini.
- source_word: יְעוֹדֵד
  choice: humtegemeza
  rationale: Huonyesha kumshikilia na kumpa nguvu aliye dhaifu, si kumtia moyo kwa maneno tu.
- source_word: דֶרֶךְ רְשָׁעִים
  choice: njia ya waovu
  rationale: Inahifadhi sitiari ya njia kama mwenendo au mwelekeo wa maisha.
- source_word: יְעַוֵּת
  choice: huipotosha
  rationale: Inahifadhi wazo la msingi la kuifanya njia ipinde au ikengeuke bila kulifafanua moja kwa moja kuwa kuangamiza.
theological_decisions:
- issue: Taswira ya hukumu ya Mungu katika kishazi cha mwisho
  choice: huipotosha njia ya waovu
  alternative: huiharibu njia ya waovu; huifanya njia ya waovu kuwa potovu
  rationale: Kitenzi עות kina wazo la kupinda au kupotosha. Tafsiri inadumisha sitiari na mvutano wa kwamba Yahwe anaingilia njia ya waovu, bila kuamua kimya kimya kwamba maana yake ni kuiangamiza.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi ni mfupi; matumizi ya “hu-” yanaonyesha matendo ya Yahwe yanayoendelea. “Wageni” ni rahisi kueleweka, huku tanbihi ikibainisha maana maalumu ya גרים.
