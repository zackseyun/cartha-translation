    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה מִשְׁפָּט
  choice: huwatendea haki
  rationale: Kirai hiki kinaeleza tendo la kawaida na la kudumu la kutekeleza haki; muundo huu ni wa asili katika Kiswahili na unaunganisha vizuri na wanaoonewa.
- source_word: לָעֲשׁוּקִים
  choice: wanaoonewa
  rationale: Umbo la Kiebrania linamaanisha watu wanaokandamizwa au kudhulumiwa; ‘wanaoonewa’ ni wazi, la sasa, na linahifadhi uzito wa kijamii wa neno.
- source_word: נֹתֵן לֶחֶם
  choice: huwapa mkate
  rationale: ‘Mkate’ huhifadhi neno mahususi la Kiebrania, huku kiambishi cha mazoea ‘hu-’ kikionyesha tabia inayoendelea ya tendo hilo.
- source_word: לָרְעֵבִים
  choice: wenye njaa
  rationale: Hili ni tamko la kawaida na linaloeleweka kwa watu wanaosumbuliwa na njaa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limehifadhiwa kwa umbo la Kiswahili ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: מַתִּיר אֲסוּרִים
  choice: huwafungua waliofungwa
  rationale: Kitenzi kina maana ya kulegeza au kufungua, na nomino inaashiria watu waliofungwa. Tafsiri hii huhifadhi taswira pana ya kifungo kuliko kuiwekea mipaka ya wafungwa gerezani pekee.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; kulitaja kama ‘Yahwe’ huhifadhi tofauti kati ya jina hilo na cheo ‘Bwana’.
- issue: Maana ya אֲסוּרִים
  choice: waliofungwa
  alternative: wafungwa
  rationale: ‘Waliofungwa’ huhifadhi upana wa Kiebrania, ambao unaweza kumaanisha waliofungwa kwa minyororo au waliozuiliwa, bila kulazimisha mazingira mahususi ya gereza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye staha na inayoeleweka kwa urahisi. Muundo wa ‘hu-’ umetumiwa kuonyesha matendo ya kudumu yanayoelezwa na vishirikishi vya Kiebrania.
