  text: who executes justice for the oppressed[a], who gives bread to the hungry[b]. Yahweh frees the prisoners.
translation:
  language: sw
  text: Huwatendea haki wanaoonewa[a]; huwapa wenye njaa mkate. Yahwe huwafungua waliofungwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hutenda haki kwa ajili ya wanaoonewa.”
    reason: lexical_alternative
  - marker: b
