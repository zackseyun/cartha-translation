translation:
  language: sw
  text: Msifuni Yah! Sifu, ee nafsi yangu, Yahweh![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Msifuni Yah.” Kauli hii ya mwanzo huwakilishwa kimapokeo kwa neno “Haleluya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: Msifuni
  rationale: Ni amri ya wingi ya הלל, inayowaita watu kwa pamoja wasifu; umbo la Kiswahili linaonyesha wazi wingi huo.
- source_word: יָהּ
  choice: Yah
  rationale: Ni umbo fupi la kishairi la jina la Mungu; limehifadhiwa kama jina tofauti badala ya kufichwa ndani ya neno “Haleluya.”
- source_word: הַלְלִי
  choice: msifu
  rationale: Ni amri ya umoja wa kike inayomwelekea נֶפֶשׁ; Kiswahili hutumia amri ya umoja bila kuonyesha jinsia.
- source_word: נַפְשִׁי
  choice: Ee nafsi yangu
  rationale: Katika kujisemeza kwa kishairi, “nafsi yangu” huhifadhi wazo la mtu kujihimiza mwenyewe; “Ee” huonyesha kwa kawaida kwamba nafsi ndiyo inayosemezwa.
- source_word: אֶת
  choice: (halitafsiriwi kwa neno tofauti)
  rationale: Ni kiashiria cha yambwa moja kwa moja; kazi yake inaonyeshwa na muundo wa kawaida wa Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa moja kwa moja katika Kiebrania, kwa hiyo limehifadhiwa kama jina badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa majina יָהּ na יְהוָה katika mstari mmoja
  choice: Kutafsiri יָהּ kuwa “Yah” na יְהוָה kuwa “Yahweh”
  alternative: Kutumia “Bwana” kwa yote mawili, au “Haleluya” katika mwanzo
  rationale: Kiebrania kinatumia umbo fupi la jina na umbo kamili katika vipashio tofauti. Kuyatofautisha huhifadhi muundo na msisitizo wa chanzo bila kuyaingiza katika cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Msifuni” huhifadhi wito wa wingi, na “Ee nafsi yangu” huweka wazi kujisemeza kwa mtunga zaburi.
