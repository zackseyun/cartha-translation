  text: who made heaven and earth[a], the sea and all that is in them, who keeps faith forever,
translation:
  language: sw
  text: aliyezifanya mbingu na dunia, bahari na vyote vilivyomo humo; anayedumisha uaminifu milele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayedumisha kweli milele.” Neno la Kiebrania אֱמֶת linaweza kumaanisha “kweli” au “uaminifu”; hapa “uaminifu” linafaa zaidi kwa maana ya kutegemeka daima.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  choice: aliyezifanya
  rationale: Kitenzi kishirikishi cha Kiebrania kinaendelea kumfafanua BWANA kuwa ndiye aliyevifanya vitu vilivyotajwa. Wakati uliopita unafaa kwa tendo la uumbaji, huku muundo wa ‘aliye-’ ukihifadhi uhusiano wake na mstari uliotangulia.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: mbingu na dunia
  rationale: Huu ni msemo unaojumlisha ulimwengu ulioumbwa. ‘Mbingu na dunia’ ni Kiswahili cha kawaida na chenye hadhi.
- source_word: אֶת הַיָּם
  choice: bahari
  rationale: Nomino ya Kiebrania iko katika umoja na hurejelea bahari kwa ujumla; Kiswahili hakihitaji kibainishi sawa na ‘the’.
- source_word: וְאֶת כָּל אֲשֶׁר בָּם
  choice: na vyote vilivyomo ndani yake
  rationale: Kiwakilishi cha Kiebrania kinaweza kurejelea kwa pamoja mbingu, dunia na bahari. Kiswahili hutumia ‘ndani yake’ kwa kurejelea orodha hiyo kama jumla moja, bila kupunguza maana yake pana.
- source_word: הַשֹּׁמֵר
  choice: anayedumisha
  rationale: Kitenzi שמר hapa kina maana ya kutunza au kuendeleza bila kukoma. ‘Anayedumisha’ kinaungana kwa kawaida na ‘uaminifu’ na kuhifadhi wazo la uthabiti unaoendelea.
- source_word: אֱמֶת
  choice: uaminifu
  rationale: Katika muktadha huu neno linaelekea kumaanisha kutegemeka na kuwa mwaminifu, si ukweli wa kinadharia pekee. Maana mbadala ya ‘kweli’ imehifadhiwa katika tanbihi.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Neno hili linaonyesha kudumu bila mwisho; ‘milele’ ni tafsiri ya kawaida na ya asili katika Kiswahili.
theological_decisions:
- issue: Maana ya אֱמֶת inapohusishwa na tabia ya Mungu
  choice: uaminifu
  alternative: kweli
  rationale: Muktadha unamsifu BWANA kuwa Muumba anayetegemeka daima. ‘Uaminifu’ huonyesha vizuri maana hiyo ya kimahusiano bila kuondoa uwezekano wa maana ya ‘kweli,’ ambao umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa kwa vifungu viwili vinavyomfafanua Mungu; nukta mkato inasaidia kutenganisha kazi yake ya uumbaji na uaminifu wake wa kudumu.
