  text: אַשְׁרֵ֗י שֶׁ֤/אֵ֣ל יַעֲקֹ֣ב בְּ/עֶזְר֑/וֹ שִׂ֝בְר֗/וֹ עַל יְהוָ֥ה אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/005.yaml
  text: Blessed is the one whose help is the God of Jacob[a], whose hope is in Yahweh his God.
translation:
  language: sw
  text: Heri yule ambaye msaada wake ni Mungu wa Yakobo[a], ambaye tumaini lake liko kwa Yahwe, Mungu wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye msaidizi wake ni Mungu wa Yakobo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heri yule
  rationale: Neno hili linaanzisha tamko la hali yenye baraka na kustahili kutamaniwa. “Heri” ni usemi wa kawaida na wenye hadhi katika Kiswahili cha zaburi, bila kuufanya kuwa hisia ya furaha tu.
- source_word: שֶׁאֵל יַעֲקֹב בְּעֶזְרוֹ
  choice: ambaye msaada wake ni Mungu wa Yakobo
  rationale: Muundo huu unaonyesha kwamba Mungu wa Yakobo ndiye msaada wa mtu huyo. Tafsiri hii ni ya asili katika Kiswahili na inahifadhi jina la kihistoria la agano, “Mungu wa Yakobo.”
- source_word: שִׂבְרוֹ
  choice: tumaini lake
  rationale: Nomino hii humaanisha tumaini au matarajio. “Tumaini lake” linahifadhi muundo wa nomino na wazo la kumtegemea Mungu.
- source_word: עַל
  choice: liko kwa
  rationale: Kihusishi hiki kinaonyesha yule ambaye tumaini linaelekezwa kwake na ambaye linamtegemea. “Liko kwa” ni Kiswahili cha asili katika muktadha huu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetafsiriwa kwa namna ya kulitaja kama jina binafsi, badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהָיו
  choice: Mungu wake
  rationale: Kiambishi cha umilikaji cha umoja kimerejeshwa kwa yule anayetajwa kuwa mwenye heri, hivyo kuhifadhi uhusiano wa kibinafsi ulio katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Kifungu kinatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Mhusika aliyedokezwa katika tamko la heri
  choice: yule
  alternative: mtu; yeye
  rationale: Kiebrania hakitaji nomino kama “mtu” wala jinsia ya mhusika kwa neno tofauti. “Yule” ni ya asili na haiingizi maelezo yasiyokuwapo katika matini.
- issue: Uhusiano wa Mungu wa Yakobo na mhusika
  choice: msaada wake ni Mungu wa Yakobo
  alternative: msaidizi wake ni Mungu wa Yakobo
  rationale: Chaguo kuu linahifadhi nomino “msaada,” huku chaguo jingine likieleza Mungu moja kwa moja kuwa msaidizi. Maana zote zinawezekana kulingana na muundo wa Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. Urudiaji wa “ambaye” unahifadhi ulinganifu wa vifungu viwili vya Kiebrania.
