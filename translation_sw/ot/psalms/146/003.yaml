  - marker: c
    text: Au “ukombozi”; maana inaweza pia kuelezwa, “asiyeweza kuokoa.”
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: אַל תִּבְטְחוּ
  choice: Msiwatumainie
  rationale: Kikanushi אַל pamoja na kitenzi kisichotimilika hutoa katazo. “Msiwatumainie” ni katazo la kawaida na la moja kwa moja kwa watu wengi, likihifadhi maana ya kutegemea au kuweka tumaini kwa mtu.
- source_word: בִנְדִיבִים
  choice: wakuu
  rationale: Neno נְדִיבִים hapa linamaanisha watu wenye cheo na mamlaka, kama wakuu, watawala, au watu mashuhuri. “Wakuu” ni la asili katika Kiswahili na halifungii maana kwenye cheo maalumu cha kifalme.
- source_word: בְּבֶן אָדָם
  choice: mwanadamu
  rationale: Kirai hiki ni halisi “mwana wa Adamu/mwanadamu,” lakini hapa ni nahau ya mtu anayekufa, si cheo cha Kimasihi. “Mwanadamu” hutoa maana hiyo kwa uwazi huku tanbihi ikihifadhi umbo la Kiebrania.
- source_word: שֶׁאֵין לוֹ
  choice: ambaye kwake hakuna
  rationale: Muundo huu unahifadhi kauli ya Kiebrania ya kuwapo kwa kukataliwa, “ambaye kwake hakuna,” badala ya kuibadili moja kwa moja kuwa maelezo ya uwezo wake.
- source_word: תְשׁוּעָה
  choice: wokovu
  rationale: תְשׁוּעָה linaweza kumaanisha wokovu au ukombozi. “Wokovu” huhifadhi upana na uzito wa neno, bila kuzuia maana ya kuokolewa kutoka hatarini.
theological_decisions:
- issue: Maana ya “mwana wa Adamu”
  choice: mwanadamu wa kawaida anayekufa, si cheo cha Kimasihi
  alternative: kutafsiri kihalisi “mwana wa Adamu,” jambo linaloweza kueleweka kama cheo maalumu
  rationale: Muktadha unatofautisha wanadamu wenye mamlaka na Mungu, ambaye peke yake ndiye tumaini la kweli. Hakuna dalili hapa ya matumizi ya cheo cha Kimasihi.
- issue: Maana ya תְשׁוּעָה kwa mwanadamu
  choice: “ambaye kwake hakuna wokovu,” kwa kuhifadhi uwezekano wa kueleweka kuwa wokovu hautokani kwake
  alternative: “asiyeweza kuokoa,” ambayo hutaja uwezo moja kwa moja
  rationale: Kiebrania kinasema kwa namna pana kwamba kwake hakuna wokovu. Tafsiri iliyochaguliwa haiingizi ufafanuzi finyu zaidi kuliko maandishi, ingawa katika muktadha inaonya kwamba mwanadamu si chanzo cha wokovu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Wakuu” ni pana na ya kawaida; “ambaye kwake hakuna wokovu” ni rasmi kidogo ili kuhifadhi muundo na mvutano wa Kiebrania.
