  yaml_path: translation/ot/psalms/146/003.yaml
  text: Do not trust in princes[a], in a son of man[b], in whom there is no salvation.
translation:
  language: sw
  text: Msiwatumainie wakuu[a], wala mwanadamu[b], ambaye kwake hakuna wokovu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watawala” au “watu wenye vyeo.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “mwana wa mtu”; hapa ni nahau ya mwanadamu anayekufa, si cheo cha Kimasihi.
