  yaml_path: translation/ot/psalms/057/005.yaml
  text: Be exalted above the heavens[a], O God; let your glory be over all the earth.
translation:
  language: sw
  text: 'Uinuliwe juu ya mbingu, Ee Mungu;

    utukufu wako uwe juu ya dunia yote.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utukufu wako uko juu ya dunia yote.” Mstari wa pili katika Kiebrania hauna kitenzi, hivyo unaweza kusomwa ama kama ombi au kama taarifa.
    reason: alternative_reading
lexical_decisions:
- source_word: ר֣וּמָה
  choice: Uinuliwe
  rationale: Umbo hili la mzizi רום ni ombi la kishairi la Mungu kutukuzwa. “Uinuliwe” huhifadhi taswira ya kuinuliwa na maana ya kutukuzwa bila kudokeza kupanda kimwili tu.
- source_word: עַל הַשָּׁמַיִם
  choice: juu ya mbingu
  rationale: “Juu ya” huonyesha ukuu unaopita mbingu na kuhifadhi taswira ya mahali katika ushairi wa Kiebrania.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Hii ni hotuba ya moja kwa moja; “Ee Mungu” ni mwito wa kawaida, wenye heshima, katika Kiswahili.
- source_word: עַל כָּל הָאָרֶץ
  choice: juu ya dunia yote
  rationale: Kauli hii huonyesha kuenea au kutawala kote, huku ikidumisha ulinganifu na mstari wa kwanza.
- source_word: כְּבוֹדֶךָ
  choice: utukufu wako
  rationale: “Utukufu” ni neno la kawaida na linaloeleweka kwa כבוד ya Mungu, likibeba wazo la fahari na ukuu wake unaodhihirika.
theological_decisions:
- issue: Iwapo kishazi cha pili kisicho na kitenzi ni ombi au taarifa
  choice: utukufu wako uwe juu ya dunia yote
  alternative: utukufu wako uko juu ya dunia yote
  rationale: Kwa kulingana na ombi la mstari wa kwanza, kishazi cha pili kinaweza kueleweka kwa kawaida kama ombi. Hata hivyo, kwa kuwa Kiebrania hakina kitenzi, tanbihi huhifadhi uwezekano wa kukisoma kama taarifa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa mistari huhifadhi ulinganifu wa zaburi; “Uinuliwe” na “uwe” huwasilisha ombi bila kulazimisha maana isiyokuwamo, huku tanbihi ikihifadhi utata halisi wa Kiebrania.
