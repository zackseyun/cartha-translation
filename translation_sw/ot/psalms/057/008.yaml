  yaml_path: translation/ot/psalms/057/008.yaml
  text: Awake[a], my glory! Awake[b], harp and lyre! I will awaken the dawn.
translation:
  language: sw
  text: Amka, utukufu wangu![a] Amkeni, kinubi na zeze![b] Nitaliamsha pambazuko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafsi yangu” au “utu wangu wote.” “Utukufu wangu” ni kauli ya kishairi inayoweza kumrejelea mwimbaji mwenyewe.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinataja ala mbili za kale za nyuzi; ala za kisasa zinazolingana nazo kikamili hazijulikani kwa uhakika.
    reason: cultural_note
lexical_decisions:
- source_word: עוּרָה
  choice: Amka / Amkeni
  rationale: 'Amri ya moja kwa moja ya kuamka; katika Kiswahili idadi inapatanishwa na anayeitwa: umoja kwa “utukufu wangu,” na wingi kwa ala mbili.'
- source_word: כְבוֹדִי
  choice: utukufu wangu
  rationale: Huhifadhi maana ya moja kwa moja na taswira ya kishairi ya Kiebrania bila kuifasiri kimya kimya kuwa nafsi au utu wote.
- source_word: הַנֵּבֶל
  choice: kinubi
  rationale: Ni ala ya kale ya nyuzi ambayo utambulisho wake kamili hauna uhakika; “kinubi” ni kisawe kinachoeleweka na kinachofaa katika lugha ya kishairi.
- source_word: כִנּוֹר
  choice: zeze
  rationale: Ni ala ya kale ya nyuzi; “zeze” huitofautisha na נבל huku ikidumisha jozi ya ala katika mstari.
- source_word: אָעִירָה
  choice: Nitaliamsha
  rationale: 'Huhifadhi hali ya kusababisha ya kitenzi: mwimbaji anasema kwa taswira kwamba atafanya pambazuko liamke.'
- source_word: שָּׁחַר
  choice: pambazuko
  rationale: Neno la asili humaanisha mapambazuko au alfajiri; “pambazuko” huendeleza taswira hai ya kishairi.
