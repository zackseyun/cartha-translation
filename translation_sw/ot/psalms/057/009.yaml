  text: I will give thanks to you among the peoples[a], Lord; I will sing praise to you among the nations.
translation:
  language: sw
  text: 'Nitakushukuru miongoni mwa mataifa[a], Bwana;

    nitakuimbia sifa miongoni mwa mataifa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nitakusifu miongoni mwa mataifa.” Kitenzi cha Kiebrania kinaweza kumaanisha kushukuru au kusifu; “nitakushukuru” kimetumiwa ili kukitofautisha na “nitakuimbia sifa” katika mstari unaofuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Nitakushukuru
  rationale: Hifili ya ידה inaweza kumaanisha kushukuru au kusifu. “Nitakushukuru” huhifadhi maana inayowezekana ya shukrani na kuitofautisha na “nitakuimbia sifa” katika mstari unaofuata.
- source_word: בָעַמִּים
  choice: kati ya mataifa
  rationale: Wingi עַמִּים hurejelea vikundi vya watu au mataifa. “Mataifa” ni Kiswahili cha kawaida na huonyesha wingi huo wa kijamii.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Hili ni jina la cheo la Mungu אֲדֹנָי, si jina la agano יהוה; kwa hiyo limetafsiriwa “Bwana” bila kuongeza kihisishi cha kale.
- source_word: אֲזַמֶּרְךָ
  choice: nitakuimbia sifa
  rationale: Pieli ya זמר katika Zaburi humaanisha kuimba sifa, mara nyingi ikiwa na wazo la muziki. Usemi huu ni wa kawaida na wa ibada katika Kiswahili.
- source_word: בַּל
  choice: kati ya
  rationale: Hapa בַּל ni kihusishi cha kishairi kinacholingana na ב katika mstari wa kwanza na kinaonyesha mazingira ambamo sifa zitaimbwa.
- source_word: אֻמִּים
  choice: makabila ya watu
  rationale: אֻמִּים humaanisha mataifa au jamii za watu. “Makabila ya watu” huitofautisha na עַמִּים iliyotafsiriwa “mataifa,” huku ikihifadhi ulinganifu wa kishairi bila kudokeza lazima mgawanyo wa kisiasa.
theological_decisions:
- issue: Tafsiri ya jina la cheo אֲדֹנָי
  choice: Bwana
  alternative: Ee Bwana
  rationale: Maandishi yana jina la cheo la Mungu, si Tetragramatoni. “Bwana” huhifadhi tofauti hiyo; nguvu ya mwito inaeleweka bila kuongeza “Ee.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa mistari miwili umehifadhi ulinganifu wa kishairi; “mataifa” na “makabila ya watu” zinawakilisha maneno mawili ya Kiebrania yanayokaribiana lakini si sawa kabisa.
