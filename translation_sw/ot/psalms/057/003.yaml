  text: יִשְׁלַ֤ח מִ/שָּׁמַ֨יִם וְֽ/יוֹשִׁיעֵ֗/נִי חֵרֵ֣ף שֹׁאֲפִ֣/י סֶ֑לָה יִשְׁלַ֥ח אֱ֝לֹהִ֗ים חַסְדּ֥/וֹ וַ/אֲמִתּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/003.yaml
  text: He will send from heaven and save me[a]; he reproaches the one who pants after me. Selah[b]. God will send his steadfast love and his faithfulness.
translation:
  language: sw
  text: Atatuma kutoka mbinguni na kuniokoa[a]; anamkemea yule anayenifuatilia kwa uchu[b]. Sela. Mungu atatuma upendo wake thabiti na uaminifu wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yule anayenifuatilia kwa uchu ananitukana.” Katika uchanganuzi huu, adui ndiye kiima cha kitenzi “kutukana,” si Mungu.
    reason: alternative_reading
  - marker: b
    text: “Yule anayenifuatilia kwa uchu” pia inaweza kutafsiriwa, “yule anayeniandama,” au “yule anayetaka kunimeza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: atatuma
  rationale: Kauli isiyokamilika ya Kiebrania inaeleza kwa ujasiri tendo la Mungu linalotarajiwa; wakati ujao ni wa asili katika Kiswahili hapa.
- source_word: מִשָּׁמַיִם
  choice: kutoka mbinguni
  rationale: Huwasilisha kwa Kiswahili sanifu chanzo cha uingiliaji wa Mungu bila kulazimisha wingi wa neno la Kiebrania.
- source_word: וְיוֹשִׁיעֵנִי
  choice: na kuniokoa
  rationale: Kitenzi cha Hiphil cha ישׁע kina maana pana ya kumwokoa au kumkomboa mtu; “kuniokoa” ni wazi na ya kawaida.
- source_word: חֵרֵף
  choice: anamkemea
  rationale: Hushikilia maana ya moja kwa moja ya kukemea, kulaumu, au kutukana badala ya kuigeuza kuwa matokeo ya kitafsiri kama “kumwaibisha.” Wakati wa sasa wa kishairi unaepuka kuficha hali iliyobanwa ya tungo.
- source_word: שֹׁאֲפִי
  choice: yule anayenifuatilia kwa uchu
  rationale: Huhifadhi picha ya adui anayemwandama mtunga-zaburi kwa hamu kali, huku ikiwa ya kueleweka kwa msomaji wa kisasa.
- source_word: סֶלָה
  choice: Sela
  rationale: Neno limenakiliwa kwa kuwa maana au kazi yake kamili haijulikani kwa uhakika.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hili ndilo jina la kawaida la Mungu katika Kiswahili, na muktadha unaonyesha maana ya umoja.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: Huwasilisha upendo, rehema, na uaminifu wa kudumu uliomo katika חסד bila kuubana kuwa dhana moja tu.
- source_word: וַאֲמִתּוֹ
  choice: na uaminifu wake
  rationale: Katika jozi na חסד, אמת humaanisha hasa kutegemeka na uaminifu wa Mungu.
theological_decisions:
- issue: Muundo wa חֵרֵף שֹׁאֲפִי
  choice: Mungu ndiye kiima cha “anamkemea,” naye anayefuatilia kwa uchu ndiye mtendwa.
  alternative: 'Adui anaweza kuchukuliwa kuwa kiima: “yule anayenifuatilia kwa uchu ananitukana/ananishutumu”; pia tungo inaweza kueleweka kuwa Mungu anamwokoa mwombaji kutokana na shutuma za mfuatiliaji wake.'
  rationale: Kiebrania ni kifupi na kinaweza kuchanganuliwa kwa njia zaidi ya moja. Matini kuu inafuata mtiririko wa tendo la Mungu, lakini tanbihi inahifadhi utata wa kweli bila kuufanya kuwa fundisho maalumu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Kwa uchu” huhifadhi taswira ya adui mwenye hamu kali bila kutumia msemo usio wa kawaida. Alama za tanbihi zimewekwa mara tu baada ya sehemu zinazohusika.
