translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini rahisi kueleweka. Marudio ya “moyo wangu ni thabiti” yamehifadhiwa kwa sababu ni sehemu muhimu ya msisitizo wa mstari. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
