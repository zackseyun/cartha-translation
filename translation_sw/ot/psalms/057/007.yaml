  yaml_path: translation/ot/psalms/057/007.yaml
  text: My heart is steadfast[a], O God; my heart is steadfast. I will sing, yes[b], I will make melody.
translation:
  language: sw
  text: 'Moyo wangu ni thabiti, Ee Mungu;

    moyo wangu ni thabiti.

    Nitaimba na kupiga muziki.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitaimba sifa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכוֹן
  choice: ni thabiti
  rationale: Katika muktadha huu neno linaonyesha moyo uliothibitishwa, imara na usiotikisika katika kumtumaini Mungu; “ni thabiti” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: לִבִּי
  choice: moyo wangu
  rationale: Huhifadhi taswira ya Kiebrania ya moyo kama kitovu cha nia na hisia, bila kuibana kuwa akili pekee.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Hii ni kauli ya kumwambia Mungu moja kwa moja; “Ee Mungu” huonyesha mwito huo kwa Kiswahili cha kawaida cha sala.
- source_word: אָשִׁירָה
  choice: Nitaimba
  rationale: Umbo la cohortative linaonyesha azimio la msemaji; “Nitaimba” hulitoa kwa lugha ya sasa na ya asili.
- source_word: וַאֲזַמֵּרָה
  choice: naam, nitapiga muziki
  rationale: Kitenzi זמר katika piel kinaweza kumaanisha kufanya muziki au kuimba sifa. “Nitapiga muziki” huhifadhi tofauti yake na kitenzi kilichotangulia, huku “naam” ikionyesha msisitizo wa jozi ya maazimio.
