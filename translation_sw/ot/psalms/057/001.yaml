base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/001.yaml
  text: Be gracious to me[a], God, be gracious to me, for in you my soul takes refuge[b]; and in the shadow of your wings I will take refuge until destruction passes by.
translation:
  language: sw
  text: Unirehemu, Ee Mungu, unirehemu; kwa maana nafsi yangu imekimbilia kwako kupata hifadhi[a], nami nitapata hifadhi katika uvuli wa mabawa yako mpaka maafa yapite[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maisha yangu yamekimbilia kwako kupata hifadhi,” au kwa urahisi, “nimekimbilia kwako kupata hifadhi.” Neno la Kiebrania נַפְשִׁי linaweza kumaanisha “nafsi yangu,” “maisha yangu,” au “mimi mwenyewe.”
    reason: lexical_alternative
  - marker: b
    text: 'Kwa Kiebrania ni wingi: “maangamizi” au “majanga”; huenda ni usemi wa jumla kwa hatari zenye kuleta uharibifu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Unirehemu
  rationale: Kitenzi חנן katika kauli ya amri pamoja na kiambishi cha nafsi ya kwanza ni ombi la kuonyeshwa fadhili au rehema. “Unirehemu” ni ombi la kawaida, lenye heshima, na la asili katika Kiswahili.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: “Mungu” ndilo neno la kawaida kwa jina hili la Mungu; “Ee” huonyesha kwamba ni mwito wa moja kwa moja katika sala.
- source_word: כִּי
  choice: kwa maana
  rationale: Inaonyesha sababu ya ombi lililotangulia na inafaa katika mtindo wa kishairi wa Kiswahili.
- source_word: בְךָ חָסָיָה נַפְשִׁי
  choice: nafsi yangu inakukimbilia kupata hifadhi
  rationale: Muundo huu unahifadhi neno נֶפֶשׁ na pia maana ya חָסָה ya kumkimbilia mtu kuwa mahali pa usalama, bila kudokeza hifadhi ya mahali tu.
- source_word: וּבְצֵל כְּנָפֶיךָ
  choice: nitajisitiri katika uvuli wa mabawa yako
  rationale: “Uvuli wa mabawa yako” huhifadhi taswira ya kishairi ya ulinzi; “nitajisitiri” huwasilisha tendo la kutafuta hifadhi ndani ya uvuli huo kwa Kiswahili cha asili.
- source_word: אֶחְסֶה
  choice: nitajisitiri
  rationale: Kauli ya wakati usiotimilika ya nafsi ya kwanza inaonyesha tendo linaloendelea au la mbele la kutafuta hifadhi. Katika muktadha wa uvuli wa mabawa, “nitajisitiri” ni ya asili na huhifadhi maendeleo kutoka hali ya kumtegemea Mungu hadi kuendelea kujificha kwake.
- source_word: עַד יַעֲבֹר
  choice: mpaka ... yapite
  rationale: Huhifadhi mpaka wa wakati na taswira ya hatari zinazopita kama dhoruba.
- source_word: הַוּוֹת
  choice: maafa
  rationale: Nomino hii ya wingi hurejelea matukio yenye kuleta uharibifu au maangamizi. “Maafa” huhifadhi wingi na ni neno la kawaida la Kiswahili kwa hatari kubwa zenye kuharibu.
theological_decisions:
- issue: Maana ya kiantropolojia ya נַפְשִׁי
  choice: nafsi yangu
  alternative: maisha yangu; mimi mwenyewe
  rationale: נֶפֶשׁ inaweza kumaanisha nafsi, uhai, au mtu mwenyewe, si lazima sehemu isiyo ya mwili kwa maana ya falsafa ya baadaye. Tafsiri kuu huhifadhi usemi wa Kiebrania, huku tanbihi ikieleza upana wake.
- issue: Taswira ya “uvuli wa mabawa yako”
  choice: kuhifadhi taswira ya kishairi ya ulinzi wa Mungu
  alternative: kuifafanua moja kwa moja kuwa “ulinzi wako”
  rationale: Kutafsiri taswira yenyewe huepuka kuifuta au kuigeuza kuwa fundisho maalumu kuhusu umbo la Mungu; maana ya ulinzi inabaki wazi kutokana na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki chenye mtindo wa sala ulio wa sasa, wenye heshima na wa kishairi. Marudio ya “unirehemu” yamehifadhiwa kwa mkazo, pamoja na taswira ya uvuli wa mabawa. “Maafa” limechaguliwa ili kuhifadhi wingi wa Kiebrania, na alama zote za tanbihi [a] na [b] zimo katika matini kuu.
