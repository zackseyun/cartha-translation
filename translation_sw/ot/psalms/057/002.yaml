  text: 'Namwita Mungu Aliye Juu Sana,

    Mungu anayekamilisha mambo yanayonihusu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu anayatimiza kusudi lake kwa ajili yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶקְרָא
  choice: Ninamwita
  rationale: Kauli ya Qal isiyotimilika, nafsi ya kwanza umoja, inaweza kueleza tendo la sasa au la baadaye katika ushairi. Wakati wa sasa unaleta maana hai bila kuongeza mkazo wa kihisia wa ‘ninamlilia.’
- source_word: לֵאלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la אֱלֹהִים ni la wingi, hapa muktadha na ulinganifu na אֵל vinaonyesha wazi Mungu wa Israeli katika maana ya umoja.
- source_word: עֶלְיוֹן
  choice: Aliye Juu Zaidi
  rationale: Ni cheo cha Mungu chenye maana ya aliye juu kabisa; usemi huu ni wa kawaida, wenye heshima, na unaeleweka katika Kiswahili cha sasa.
- source_word: לָאֵל
  choice: Mungu
  rationale: אֵל ni neno au cheo cha kawaida cha Kisemiti kwa Mungu. Kulitafsiri ‘Mungu’ kunahifadhi ulinganifu wa kishairi bila kuleta jina lisiloeleweka kwa urahisi.
- source_word: גֹמֵר
  choice: anayekamilisha
  rationale: Kitenzi kishirikishi cha גמר humaanisha kukamilisha, kumaliza, au kufikisha mwisho. ‘Anayekamilisha’ hudumisha maana ya msingi na huepuka kuongeza wazi wazo la ‘kusudi,’ ambalo halijatajwa moja kwa moja katika Kiebrania.
- source_word: עָלָי
  choice: yanayonihusu
  rationale: עַל pamoja na kiambishi cha nafsi, baada ya גמר, inaweza kueleza mambo yanayomhusu msemaji au yanayotendwa kwa ajili yake. ‘Yanayonihusu’ huhifadhi upana huo wa maana kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya גֹמֵר עָלָי
  choice: Mungu anakamilisha yanayomhusu mtunga zaburi
  alternative: Mungu anatimiza kusudi lake kwa ajili yangu
  rationale: Kiebrania hakitaji moja kwa moja nomino ‘kusudi.’ Tafsiri kuu inahifadhi maana ya kukamilisha kile kinachomhusu msemaji, huku tanbihi ikitoa usomaji wa kimuktadha unaoeleza tendo hilo kuwa kutimiza kusudi la Mungu kwa ajili yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa mistari miwili unahifadhi ulinganifu wa Kiebrania; ‘Aliye Juu Zaidi’ limetumiwa kama cheo cha Mungu.
