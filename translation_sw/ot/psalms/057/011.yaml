  yaml_path: translation/ot/psalms/057/011.yaml
  text: Be exalted above the heavens[a], O God; let your glory be above all the earth.
translation:
  language: sw
  text: Uinuliwe juu ya mbingu, Ee Mungu; utukufu wako uwe juu ya dunia yote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utukufu wako uko juu ya dunia yote.” Mstari wa pili katika Kiebrania hauna kitenzi kilichotajwa wazi; kitenzi lazima kieleweke kutokana na muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: ר֣וּמָה
  choice: Uinuliwe
  rationale: Umbo hili linamwelekea Mungu kama ombi au wito wa kishairi. “Uinuliwe” linaonyesha kutukuzwa na kudhihirishwa kuwa mkuu, huku likidumisha taswira ya kuwa juu.
- source_word: עַל
  choice: juu ya
  rationale: Katika mistari yote miwili, kirai hiki kinaonyesha kuwa juu na ukuu. “Juu ya” ni cha kawaida katika Kiswahili na kinahifadhi taswira ya wima ya Kiebrania.
- source_word: שָׁמַיִם
  choice: mbingu
  rationale: “Mbingu” ni tafsiri ya kawaida na yenye hadhi ya umbo la Kiebrania linaloweza kumaanisha anga au mbingu.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Hapa ni mwito wa moja kwa moja kwa Mungu. “Ee” huonyesha mwito huo kwa kawaida katika lugha ya sala na ushairi.
- source_word: כָּל הָאָרֶץ
  choice: dunia yote
  rationale: Mlingano na “mbingu” unaonyesha upeo wa ulimwengu mzima, si nchi au eneo fulani; kwa hiyo “dunia yote” linafaa.
- source_word: כְּבוֹדֶךָ
  choice: utukufu wako
  rationale: Katika kumhusu Mungu, כָּבוֹד humaanisha utukufu, ukuu na fahari yake inayodhihirika. “Utukufu wako” ni wazi na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Mstari wa pili wa kishairi hauna kitenzi kilichoandikwa wazi katika Kiebrania.
  choice: utukufu wako uwe juu ya dunia yote
  alternative: utukufu wako uko juu ya dunia yote
  rationale: “Uwe” linaendeleza nguvu ya ombi iliyo katika mstari wa kwanza na kudumisha ulinganifu wa kishairi. Hata hivyo, kwa kuwa Kiebrania hakina kitenzi wazi, maana ya taarifa—“uko”—inawezekana pia; tanbihi inahifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya sala na yenye hadhi. Mpangilio wa mistari miwili ya kishairi umehifadhiwa bila kuongeza ufafanuzi wa kimadhehebu.
