base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/004.yaml
  text: My soul is in the midst of lions[a]; I lie down among those who are aflame—sons of man, whose teeth are spears and arrows[b], and whose tongue is a sharp sword.
translation:
  language: sw
  text: Nafsi yangu iko katikati ya simba; najilaza kati ya wanaowaka moto[b]—wanadamu[a], ambao meno yao ni mkuki na mishale, na ulimi wao ni upanga mkali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Adamu,” yaani wanadamu.'
    reason: lexical_alternative
  - marker: b
    text: “Wanaowaka moto” pia inaweza kueleweka kuwa “walio kama miali,” ikionyesha ukali wa maadui.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשִׁי
  choice: Nafsi yangu
  rationale: Huhifadhi taswira ya kishairi ya נֶפֶשׁ, ambayo hapa inaweza kumaanisha nafsi, uhai, au mtu mwenyewe, bila kuibana kuwa ‘mimi’ pekee.
- source_word: בְּתוֹךְ לְבָאִם
  choice: imo katikati ya simba
  rationale: ‘Katikati ya’ huonyesha kuzungukwa na hatari, huku ‘simba’ ikihifadhi taswira ya moja kwa moja ya Kiebrania.
- source_word: אֶשְׁכְּבָה
  choice: ninalala
  rationale: Hutoa kwa lugha ya kawaida tendo halisi la kulala au kujilaza bila kuongeza wazo la kulazimishwa.
- source_word: לֹהֲטִים
  choice: wanaowaka moto
  rationale: Huhifadhi sitiari ya kuwaka au kuwa kama miali na ukali wake, badala ya kuifasiri moja kwa moja kuwa hasira au ulafi.
- source_word: בְּנֵי אָדָם
  choice: wanadamu
  rationale: Ni Kiswahili cha kawaida na chenye hadhi kwa watu wa kibinadamu; tofauti na Kiingereza, tafsiri ya neno kwa neno ‘wana wa Adamu’ ingeweza kusikika kama ukoo maalumu badala ya usemi wa kawaida wa kishairi.
- source_word: שִׁנֵּיהֶם חֲנִית וְחִצִּים
  choice: ambao meno yao ni mikuki na mishale
  rationale: Huhifadhi sitiari ya meno kama silaha. Wingi ‘mikuki’ unasikika kwa kawaida sambamba na ‘mishale,’ ingawa Kiebrania kina ‘mkuki’ katika umoja.
- source_word: וּלְשׁוֹנָם חֶרֶב חַדָּה
  choice: na ulimi wao ni upanga mkali
  rationale: Huhifadhi umoja wa pamoja wa ‘ulimi’ na sitiari ya usemi wenye kuumiza kama upanga mkali.
theological_decisions:
- issue: Iwapo simba na silaha zitafsiriwe kihalisi au kisitiari
  choice: Taswira zimehifadhiwa kama zilivyo, huku wanadamu wanaotajwa wakibaki maadui wanaoweza kuelezwa kwa taswira hizo.
  alternative: Kufafanua simba wote kuwa watu wakatili, au kutenganisha simba halisi na maadui wa kibinadamu.
  rationale: Mstari unasogeza picha kutoka kwa simba hadi kwa wanadamu wenye meno kama silaha. Tafsiri haipaswi kuondoa mvutano huo wa kishairi.
- issue: Maana ya לֹהֲטִים
  choice: wanaowaka moto
  alternative: wenye ukali; wanaoteketeza; walio kama miali
  rationale: Kitenzi kishirikishi kina taswira ya kuwaka, lakini muundo wake umebanwa na kinaweza kueleza ukali wa maadui. Tafsiri kuu huhifadhi sitiari, na tanbihi hueleza uwezekano huo.
- issue: Uhusiano wa בְּנֵי אָדָם na lugha ya jinsia
  choice: wanadamu
  alternative: wana wa Adamu; wanaume
  rationale: Katika Kiswahili ‘wanadamu’ huwasilisha usemi wa Kiebrania kwa kawaida bila kuufanya kuwa jina la ukoo wala kuongeza maana finyu ya wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. ‘Nafsi yangu’ na taswira za simba, moto, meno, silaha, na ulimi zimehifadhiwa; sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili.
