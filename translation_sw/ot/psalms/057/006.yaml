  yaml_path: translation/ot/psalms/057/006.yaml
  text: They prepared a net for my steps[a]; my soul was bowed down; they dug a pit before me; they fell into the midst of it[d][c][b]. Selah
translation:
  language: sw
  text: Walitandika wavu kwa ajili ya hatua zangu[a]; nafsi yangu iliinamishwa chini[b]; walichimba shimo mbele yangu; wakaanguka ndani yake[c]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “mtego kwa ajili ya nyayo zangu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “nafsi yangu iliinamishwa chini”; “nafsi yangu” pia inaweza kumaanisha “mimi” au “uhai wangu.”'
    reason: lexical_alternative
  - marker: c
    text: 'Kwa neno halisi: “wakaanguka katikati yake.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶשֶׁת
  choice: wavu
  rationale: Neno hili linamaanisha wavu wa kunasia; “wavu” ni sawia ya moja kwa moja na hudumisha picha halisi ya mtego.
- source_word: הֵכִינוּ
  choice: walitandika
  rationale: Ingawa kitenzi kimsingi humaanisha kuandaa au kuweka tayari, kwa wavu wa kunasia Kiswahili cha kawaida hutumia “kutandika,” kinachoonyesha hatua ya makusudi bila kubadili picha.
- source_word: לִפְעָמַי
  choice: kwa ajili ya hatua zangu
  rationale: פעם hapa hurejelea hatua au nyayo; “hatua zangu” hudumisha wingi na wazo la mwendo.
- source_word: כָּפַף
  choice: iliinama chini
  rationale: Kitenzi humaanisha kuinama au kupinda chini; tafsiri hii hudumisha hali ya kunyenyekezwa bila kuongeza kisababishi kisichotajwa.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: נפשׁ linaweza kumaanisha nafsi, mtu mwenyewe, au uhai. “Nafsi yangu” hudumisha tamathali ya Kiebrania na mtindo wa kishairi, huku tanbihi ikionyesha upana wa maana.
- source_word: כָּרוּ
  choice: walichimba
  rationale: Hii ndiyo maana ya moja kwa moja ya kitenzi katika muktadha wa kutengeneza shimo.
- source_word: לְפָנַי
  choice: mbele yangu
  rationale: Kirai kinaonyesha mahali palipo mbele ya mwimbaji na hutafsiriwa kwa Kiswahili cha kawaida na cha kishairi.
- source_word: שִׁיחָה
  choice: shimo
  rationale: Nomino hii ni shimo linaloweza kutumiwa kama mtego; “shimo” ni fupi, wazi, na halifafanui kupita chanzo.
- source_word: נָפְלוּ בְתוֹכָהּ
  choice: wao wenyewe wakaanguka ndani yake
  rationale: Kiebrania husema kwa kawaida “wakaanguka katikati yake.” “Ndani yake” ni Kiswahili asilia, na “wao wenyewe” huonyesha wazi ugeukaji wa hila bila kudai kuwa ni sehemu ya neno moja la chanzo.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya istilahi hii ya kiliturujia au kimuziki haijulikani; kwa hiyo imenukuliwa kwa herufi badala ya kutafsiriwa kwa kubahatisha.
theological_decisions:
- issue: Mhusika wa נָפְלוּ (“wakaanguka”)
  choice: wao wenyewe wakaanguka
  alternative: wakaanguka
  rationale: Kiima kilichodokezwa ni wale waliotandika wavu na kuchimba shimo. “Wao wenyewe” huweka wazi ugeukaji wa hila unaoeleweka katika Kiebrania, bila kuingiza mhusika mwingine.
- issue: Maana ya נַפְשִׁי
  choice: nafsi yangu
  alternative: mimi / uhai wangu
  rationale: Chanzo kina usemi wa kishairi wenye wigo wa maana unaoweza kumaanisha nafsi, mtu mwenyewe, au uhai. Maandishi makuu yanadumisha “nafsi,” na tanbihi inalinda uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka kwa wasomaji wa kawaida. Alama za nusu koloni na sentensi fupi zinadumisha mistari sambamba ya Kiebrania. “Sela” imeachwa kama istilahi isiyotafsiriwa.
