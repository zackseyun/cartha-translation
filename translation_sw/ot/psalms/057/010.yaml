base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/010.yaml
  text: For your steadfast love is great to the heavens[b][a], and your faithfulness to the clouds.
translation:
  language: sw
  text: Kwa maana upendo wako thabiti ni mkuu hadi mbinguni,[a] na uaminifu wako hadi mawinguni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana upendo wako thabiti ni mkuu hadi mbinguni, na ukweli wako hadi mawinguni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya sifa iliyotangulia na inatiririka kwa kawaida katika ushairi wa Kiswahili.
- source_word: גָדֹל
  choice: ni mkuu
  rationale: Inaeleza ukubwa wa upendo wa Mungu kwa lugha ya kawaida lakini yenye hadhi.
- source_word: עַד
  choice: hadi
  rationale: Inahifadhi wazo la kufikia au kuenea mpaka mbinguni bila kulazimisha taswira kuwa kipimo halisi.
- source_word: שָׁמַיִם
  choice: mbinguni
  rationale: Ni usemi wa kawaida wa kishairi kwa anga za juu na unaendana na taswira ya mstari.
- source_word: חַסְדֶּךָ
  choice: upendo wako thabiti
  rationale: Huwasilisha upendo wenye kudumu, rehema, na uaminifu wa agano bila kutumia istilahi ya kidhehebu.
- source_word: שְׁחָקִים
  choice: mawinguni
  rationale: Inatoa taswira halisi ya mawingu na kudumisha ulinganifu wa kishairi na mbingu.
- source_word: אֲמִתֶּךָ
  choice: uaminifu wako
  rationale: Katika ulinganifu na חֶסֶד, neno hili linasisitiza kutegemeka kwa Mungu; hata hivyo maana ya 'ukweli' imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Jozi ya sifa za Mungu חֶסֶד na אֱמֶת
  choice: upendo thabiti na uaminifu
  alternative: fadhili na ukweli
  rationale: Chaguo hili linaonyesha tabia ya Mungu ya kupenda kwa kudumu na kutegemeka katika muktadha huu wa kishairi, bila kuondoa maana mbadala ya אֱמֶת.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo sambamba wa Kiebrania umehifadhiwa, pamoja na marudio ya “hadi”.
