base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/000.yaml
  text: 'For the choirmaster: “Do Not Destroy.” Of David[a]. A miktam, when he fled from Saul[b], in the cave.'
translation:
  language: sw
  text: 'Kwa kiongozi wa muziki: “Usiharibu.”[a] Ya Daudi. Miktamu,[b] alipomkimbia Sauli, pangoni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Huenda hili ni jina la mdundo au kibwagizo: “Usiharibu.”'
    reason: alternative_reading
  - marker: b
    text: Maana ya “Miktamu” haijulikani kwa hakika; kwa hiyo neno hilo limenakiliwa badala ya kutafsiriwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa kiongozi wa muziki
  rationale: Hutambulisha anayesimamia uimbaji au muziki katika vichwa vya Zaburi; tafsiri hii ni ya kawaida, wazi, na haibani jukumu hilo kwa waimbaji pekee.
- source_word: אַל־תַּשְׁחֵת
  choice: “Usiharibu”
  rationale: Katika kichwa hiki inaelekea kuwa jina la wimbo, mdundo, au kibwagizo; alama za kunukuu zinaonyesha kazi hiyo bila kuifanya kuwa amri ndani ya shairi.
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Neno la uhusiano לְ linaweza kuonyesha utunzi, umiliki, kujitolea, au uhusiano mwingine. “Ya Daudi” huhifadhi upana huo kuliko “iliyoandikwa na Daudi.”
- source_word: מִכְתָּם
  choice: Miktamu
  rationale: Maana ya istilahi hii ya Kiebrania haijulikani kwa hakika; imeandikwa kwa namna inayotamkika kwa Kiswahili badala ya kupewa tafsiri ya kubahatisha.
- source_word: בְּבָרְחוֹ
  choice: alipomkimbia
  rationale: Muundo huu unaonyesha wakati au mazingira ya tukio; “alipomkimbia” ni Kiswahili cha asili na huwasilisha kitendo cha kumtoroka Sauli.
- source_word: מִפְּנֵי שָׁאוּל
  choice: Sauli
  rationale: Katika muundo wa “alimkimbia Sauli,” maana ya kujiepusha na au kumtoroka Sauli inaeleweka bila kutafsiri kihalisi nahau ya Kiebrania “kutoka mbele ya uso wa.”
- source_word: בַּמְּעָרָה
  choice: pangoni
  rationale: Kiambishi בְּ kinaonyesha mahali hapa; “pangoni” huhifadhi taarifa fupi ya mazingira bila kuongeza wazo la kuingia pangoni.
theological_decisions:
- issue: Kazi ya maandishi haya
  choice: Yamewasilishwa kama kichwa cha Zaburi chenye maelekezo ya muziki, uhusiano na Daudi, aina ya utungo, na mazingira ya kihistoria.
  alternative: Kuchukulia “Usiharibu” kuwa sehemu ya shairi lenyewe.
  rationale: Vipengele vyote vina muundo unaotumika kwa kawaida katika vichwa vya Zaburi katika maandishi ya Kimasora.
- issue: Uhusiano unaoonyeshwa na לְדָוִד
  choice: “Ya Daudi,” bila kudai wazi kwamba Daudi ndiye mwandishi.
  alternative: “Iliyoandikwa na Daudi” au “Kwa ajili ya Daudi.”
  rationale: Kihusishi cha Kiebrania kinaweza kubeba maana kadhaa; tafsiri iliyochaguliwa huhifadhi utata halisi wa chanzo.
- issue: Maana ya מִכְתָּם
  choice: Kutumia umbo la kunakili sauti, “Miktamu.”
  alternative: “Maandishi,” “Zaburi ya dhahabu,” au aina nyingine ya utungo.
  rationale: Maana yake haijathibitishwa; kuitafsiri kwa istilahi maalumu kungeingiza uhakika usiokuwamo katika chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, kwa mtindo mfupi na wenye hadhi unaofaa kichwa cha Zaburi. “Kiongozi wa muziki” ni wazi kwa wasomaji wa sasa; “Ya Daudi” huhifadhi utata wa kihusishi cha Kiebrania. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
