  text: אַשְׂכִּ֤ילָה בְּ/דֶ֬רֶךְ תָּמִ֗ים מָ֭תַי תָּב֣וֹא אֵלָ֑/י אֶתְהַלֵּ֥ךְ בְּ/תָם לְ֝בָבִ֗/י בְּ/קֶ֣רֶב בֵּיתִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/002.yaml
  text: I will give attention to the blameless way—when will you come to me? I will walk with integrity of heart within my house[a][b].
translation:
  language: sw
  text: Nitaizingatia njia isiyo na lawama[b]—utakuja kwangu lini?[a] Nitaenenda kwa unyofu wa moyo wangu ndani ya nyumba yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema, “utakuja kwangu lini?” Mtendaji hajatajwa wazi; wengi huelewa kuwa maneno haya yanaelekezwa kwa Mungu.
    reason: alternative_reading
  - marker: b
    text: Au “Nitaitafakari njia ya uadilifu,” au “Nitatenda kwa busara katika njia isiyo na lawama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׂכִּילָה
  choice: Nitaizingatia
  rationale: Hifili ya שׂכל inaweza kumaanisha kutenda kwa busara au kuelekeza fikira kwa makini. Hapa kitenzi kinaonyesha azimio la kuzingatia kwa makusudi mwenendo wa maisha usio na lawama.
- source_word: בְּדֶרֶךְ תָּמִים
  choice: njia isiyo na lawama
  rationale: דֶּרֶךְ ni sitiari ya kawaida ya mwenendo wa maisha, na תָּמִים hapa inaonyesha ukamilifu wa kimaadili au uadilifu, si kutokuwa na dhambi kabisa.
- source_word: מָתַי תָּבוֹא אֵלָי
  choice: utakuja kwangu lini?
  rationale: Kitenzi ni nafsi ya pili, umoja, jinsia ya kiume, lakini mtendaji hajatajwa wazi. Tafsiri ya moja kwa moja inadumisha usemi wa kumwelekea mtu bila kumtaja kuwa Mungu.
- source_word: אֶתְהַלֵּךְ
  choice: Nitaenenda
  rationale: Hitpaeli ya הלך inaweza kueleza mwenendo wa maisha. ‘Nitaenenda’ inadumisha sitiari ya kimaadili na ina hadhi ya kishairi bila kuwa ngumu kueleweka.
- source_word: בְּתָם לְבָבִי
  choice: kwa unyofu wa moyo
  rationale: תֹּם huonyesha uadilifu, kutokuwa na hila, au ukamilifu wa ndani. ‘Unyofu wa moyo’ ni Kiswahili cha asili kinachoeleza uadilifu wa ndani bila kudokeza kutokuwa na dhambi kabisa.
- source_word: בְּקֶרֶב בֵּיתִי
  choice: ndani ya nyumba yangu
  rationale: בְּקֶרֶב kwa maana ya mahali ni ‘katikati ya’ au ‘ndani ya’; hapa ‘ndani ya nyumba yangu’ huwasilisha kwa kawaida mazingira ya nyumbani.
theological_decisions:
- issue: Mtendaji aliyedokezwa katika ‘utakuja kwangu lini?’
  choice: Kudumisha nafsi ya pili bila kumtaja mtendaji katika maandishi makuu.
  alternative: Kumtaja Mungu waziwazi, au kulihusisha fungu hilo kwa namna isiyo ya kibinafsi na njia isiyo na lawama.
  rationale: Kiebrania kina kitenzi cha nafsi ya pili lakini hakitaji kiima. Wengi hulielewa kama ombi kwa Mungu, lakini tafsiri haipaswi kuondoa utata ambao maandishi yenyewe yameuacha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Nitaenenda’ inadumisha sitiari ya kibiblia ya maisha kama kutembea; ‘unyofu wa moyo’ huepuka wazo la ukamilifu usio na dhambi huku ikihifadhi maana ya uadilifu wa ndani.
