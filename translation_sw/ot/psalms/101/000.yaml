  text: Of David[a]. A psalm. I will sing of steadfast love and justice; to you, Yahweh[b], I will sing praise.
translation:
  language: sw
  text: 'Wa Daudi.[a] Zaburi.


    Nitaimba juu ya upendo thabiti na haki;[b]


    kwako, ee Yahwe, nitaimba.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Wa Daudi.” Maneno haya yanaweza kumaanisha kwamba Daudi ndiye mwandishi, kwamba zaburi imewekwa wakfu kwake, au kwamba inahusishwa naye.'
    reason: alternative_reading
  - marker: b
    text: Au “rehema na hukumu.” Maneno ya Kiebrania yanaweza pia kutafsiriwa kwa maana finyu zaidi hivyo, lakini “upendo thabiti na haki” huonyesha vizuri zaidi maana yake pana katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: upendo thabiti
  rationale: Neno hili linaonyesha upendo wa kudumu na uaminifu, mara nyingi katika muktadha wa agano; ‘upendo thabiti’ huhifadhi maana yake pana kuliko ‘rehema’ pekee.
- source_word: מִשְׁפָּט
  choice: haki
  rationale: Katika muktadha huu neno linaelekea kumaanisha haki au utendaji wa haki, si hukumu ya mahakama pekee.
- source_word: אֲזַמֵּרָה
  choice: nitakuimbia sifa
  rationale: Kitenzi hiki humaanisha kuimba au kupiga muziki wa sifa; usemi huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limewakilishwa moja kwa moja badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Maana ya לְדָוִד katika kichwa cha zaburi
  choice: Wa Daudi
  alternative: Iliyotungwa na Daudi / Kwa ajili ya Daudi
  rationale: Muundo wa Kiebrania unaweza kuonyesha uandishi, wakfu, au uhusiano na Daudi; tafsiri fupi inahifadhi utata huo.
- issue: Uhusiano kati ya חֶסֶד na מִשְׁפָּט
  choice: upendo thabiti na haki
  alternative: rehema na hukumu
  rationale: Chaguo hili huhifadhi pamoja wazo la uaminifu wa upendo na utendaji wa haki bila kuyafanya maneno kuwa finyu kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi, wa sasa na wenye hadhi. Kihisishi ‘ee’ kimetumiwa kuonyesha usemi wa moja kwa moja kwa Yahwe.
