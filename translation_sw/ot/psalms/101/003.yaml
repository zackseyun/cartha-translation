review_pass:
  verdict: revise
  source_fidelity: The draft preserves the three Hebrew clauses, the first-person resolve, the concrete image of setting something before one's eyes, and the final metaphor of corrupt conduct not adhering to the speaker. However, “lisilofaa” commonly means unsuitable or inappropriate and is too weak for דְּבַר־בְּלִיַּעַל, which denotes a base, wicked, or worthless matter in this context. “Ovu” better retains the moral force without treating Belial as a proper name.
  naturalness: The Swahili is clear, idiomatic, and appropriately dignified. “Mbele ya macho yangu,” “Ninachukia,” and “halitashikamana nami” are natural modern Standard East African Swahili. The revised wording remains equally natural.
  terminology: “Jambo lolote ovu” is a more accurate rendering of the morally charged Hebrew expression than “jambo lolote lisilofaa.” “Wale wanaopotoka” appropriately conveys those who turn aside; it does not unnecessarily impose a narrowly denominational sense such as apostasy.
  issues:
  - severity: medium
    issue: “Lisilofaa” weakens the sense of דְּבַר בְּלִיָּעַל.
    rationale: In ordinary Swahili, “lisilofaa” can indicate mere unsuitability. The Hebrew expression carries a clearly negative ethical sense—base, wicked, or worthless. “Ovu” conveys this force more faithfully.
  revised_text: Sitaweka mbele ya macho yangu jambo lolote ovu[a]. Ninachukia tendo la wale wanaopotoka[b]; halitashikamana nami.
  revised_footnotes:
  - marker: a
    text: Au, “jambo lolote lisilo na thamani,” au “jambo lolote la Beliali.” Neno la Kiebrania בְּלִיַּעַל hapa linaelekea kueleza ubatili au uovu, si jina maalumu “Beliali.”
    reason: lexical_alternative
  - marker: b
    text: Au, “tendo la waasi,” au “matendo ya waliopotoka.”
    reason: lexical_alternative
  revision_rationale: A single lexical revision changes “lisilofaa” to “ovu” in order to represent the ethical force of בְּלִיַּעַל more accurately. The first footnote is adjusted so that it supplies genuine alternatives to the revised main rendering and retains the note that a proper-name reading is not required. No other change is needed.
