id: PSA.101.3
reference: Psalms 101:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לֹֽא אָשִׁ֨ית לְ/נֶ֥גֶד עֵינַ֗/י דְּֽבַר בְּלִ֫יָּ֥עַל עֲשֹֽׂה סֵטִ֥ים שָׂנֵ֑אתִי לֹ֖א יִדְבַּ֣ק בִּֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/003.yaml
  text: I will not set any worthless thing before my eyes[a]; I hate the work of those who turn aside[b]; it will not cling to me.
translation:
  language: sw
  text: Sitaweka mbele ya macho yangu jambo lolote ovu[a]. Ninachukia tendo la wale wanaopotoka[b]; halitashikamana nami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jambo lolote lisilo na thamani,” au “jambo lolote la Beliali.” Neno la Kiebrania בְּלִיַּעַל hapa linaelekea kueleza ubatili au uovu, si jina maalumu “Beliali.”
    reason: lexical_alternative
  - marker: b
    text: Au, “tendo la waasi,” au “matendo ya waliopotoka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשִׁית
  choice: Sitaweka
  rationale: Kitenzi hiki cha Qal, nafsi ya kwanza umoja, humaanisha kuweka au kutia. Muundo wa wakati ujao wenye kukanusha unaonyesha azimio la msemaji.
- source_word: לְנֶגֶד עֵינַי
  choice: mbele ya macho yangu
  rationale: Tafsiri hii inadumisha taswira halisi ya kitu kuwekwa mahali ambapo msemaji anakitazama.
- source_word: דְּבַר בְּלִיָּעַל
  choice: jambo lolote lisilofaa
  rationale: דְּבַר ni jambo au kitu, na בְּלִיָּעַל hapa inaelekea kueleza ubatili, uovu, au kutofaa, si jina la kiumbe aitwaye Beliali. ‘Lisilofaa’ ni Kiswahili cha kawaida chenye uzito wa kimaadili bila kuifanya maana kuwa finyu kupita kiasi.
- source_word: עֲשֹׂה סֵטִים
  choice: tendo la wale wanaopotoka
  rationale: עֲשֹׂה huonyesha kufanya au tendo, ilhali סֵטִים hueleza wanaogeuka kando au kupotoka. Umoja ‘tendo’ unasaidia kuhifadhi muundo wa Kiebrania na rejeo linalowezekana la kitenzi kinachofuata.
- source_word: שָׂנֵאתִי
  choice: Ninachukia
  rationale: Ingawa umbo la Kiebrania ni timilifu, hapa linaonyesha msimamo thabiti wa msemaji; wakati wa sasa katika Kiswahili unaeleza vizuri azimio hilo la kudumu.
- source_word: לֹא יִדְבַּק בִּי
  choice: halitashikamana nami
  rationale: דבק humaanisha kushikamana, kuambatana, au kung’ang’ania. ‘Kushikamana nami’ inadumisha sitiari ya tendo ovu kujifunga kwa msemaji.
theological_decisions:
- issue: Maana ya בְּלִיָּעַל
  choice: Neno la kawaida lenye maana ya jambo lisilofaa, ovu, au lisilo na thamani
  alternative: jambo la Beliali
  rationale: Katika muktadha huu neno hilo linaelekea kuwa sifa ya ubatili au uovu, wala si lazima jina maalumu la kiumbe wa kiroho. Tafsiri hii haileti katika zaburi dhana ya baadaye ambayo maandishi ya Kiebrania hayahitaji.
- issue: Kinachosemwa ‘halitashikamana nami’
  choice: Kisarufi limeunganishwa na ‘tendo’
  alternative: Linaweza kueleweka kuwa ‘jambo lisilofaa’ lililotajwa mwanzoni
  rationale: Nomino zote mbili zinaweza kuwa rejeo la wazo linalofuata katika mfuatano wa kishairi. Kutumia ‘tendo’ katika umoja kunatoa Kiswahili kinachoeleweka bila kufuta kabisa uhusiano wa maana na ‘jambo lisilofaa’.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zinadumisha taswira ya macho na ya kushikamana, huku msamiati ukibaki wazi kwa msomaji wa kawaida.
