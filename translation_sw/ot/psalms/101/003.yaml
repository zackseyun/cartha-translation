- from: Sitaweka mbele ya macho yangu jambo lolote lisilofaa[a]. Ninachukia tendo la wale wanaopotoka[b]; halitashikamana nami.
  to: Sitaweka mbele ya macho yangu jambo lolote ovu[a]. Ninachukia tendo la wale wanaopotoka[b]; halitashikamana nami.
  rationale: A single lexical revision changes “lisilofaa” to “ovu” in order to represent the ethical force of בְּלִיַּעַל more accurately. The first footnote is adjusted so that it supplies genuine alternatives to the revised main rendering and retains the note that a proper-name reading is not required. No other change is needed.
