  variant: Standard East African Swahili
source:
  edition: WLC
  text: לַ/בְּקָרִ֗ים אַצְמִ֥ית כָּל רִשְׁעֵי אָ֑רֶץ לְ/הַכְרִ֥ית מֵֽ/עִיר יְ֝הוָ֗ה כָּל פֹּ֥עֲלֵי אָֽוֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/008.yaml
  text: Morning by morning I will destroy all the wicked of the land[b][a], cutting off from the city of Yahweh all workers of iniquity.
translation:
  language: sw
  text: Kila asubuhi nitawaangamiza waovu wote wa nchi[a], ili niwaondoe kutoka katika mji wa Yahwe[b] watenda maovu wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waovu wote wa dunia.” Neno la Kiebrania אֶרֶץ linaweza kumaanisha “nchi” au “dunia”; hapa “nchi” linafaa zaidi katika mazingira ya kifalme ya zaburi hii.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: YHWH; kwa desturi hutafsiriwa “BWANA.” “Yahwe” ni umbo la Kiswahili lililotumiwa hapa; maumbo mengine ni “Yahweh” na “Yehova.”'
    reason: alternative_reading
lexical_decisions:
- source_word: לַבְּקָרִים
  choice: Kila asubuhi
  rationale: Wingi wa neno pamoja na kihusishi una maana ya tendo linalorudiwa kila asubuhi; Kiswahili hiki ni cha kawaida na wazi.
- source_word: אַצְמִית
  choice: nitawaangamiza
  rationale: Hifili ya צמת hapa ina maana ya kusababisha waovu waangamie au kukomesha kabisa, katika muktadha wa hukumu ya kifalme.
- source_word: כָּל רִשְׁעֵי אָרֶץ
  choice: waovu wote wa nchi
  rationale: רִשְׁעֵי ni kivumishi kilichotumika kama nomino, ‘waovu’; אָרֶץ imetafsiriwa ‘nchi’ kwa sababu ya mazingira ya utawala wa mfalme, huku ‘dunia’ ikibaki uwezekano halisi.
- source_word: לְהַכְרִית
  choice: ili kuwaondoa
  rationale: Kitenzi-jina hiki kinaonyesha kusudi la kuwaondoa kabisa watenda uovu kutoka mjini; tafsiri hii ni ya asili kwa Kiswahili bila kupoteza nguvu ya hukumu.
- source_word: מֵעִיר יְהוָה
  choice: katika mji wa Yahwe
  rationale: Muundo huu unaonyesha mji unaohusishwa na au ulio mali ya Yahwe; ‘katika’ hufuata kwa kawaida kitenzi ‘kuwaondoa’.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kwa umbo la Kiswahili ‘Yahwe’ badala ya kubadilishwa na cheo ‘BWANA’.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: wote wanaotenda uovu
  rationale: Hii inawakilisha kwa kawaida katika Kiswahili maana halisi ya ‘wote watendao uovu,’ huku ikidumisha uzito wa kimaadili wa msemo wa Kiebrania.
theological_decisions:
- issue: Upeo wa אָרֶץ
  choice: nchi
  alternative: dunia
  rationale: Sauti ya mfalme na kutajwa kwa mji wa Yahwe vinaelekeza kwenye eneo halisi la utawala; hata hivyo, neno la Kiebrania linaweza pia kumaanisha dunia.
- issue: Utoaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina maalumu la Mungu, si cheo; umbo ‘Yahwe’ linatumika kulihifadhi kwa matamshi ya kawaida ya Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Kila asubuhi’ ni ya kawaida kuliko tafsiri ya neno kwa neno, na ‘wote wanaotenda uovu’ ni ya asili kuliko msemo mzito ‘watenda maovu,’ bila kulegeza maana.
