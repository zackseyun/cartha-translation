  variant: Standard East African Swahili
source:
  edition: WLC
  text: עֵינַ֤/י בְּ/נֶֽאֶמְנֵי אֶרֶץ֮ לָ/שֶׁ֪בֶת עִמָּ֫דִ֥/י הֹ֭לֵךְ בְּ/דֶ֣רֶךְ תָּמִ֑ים ה֝֗וּא יְשָׁרְתֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/006.yaml
  text: My eyes are on the faithful of the land[a], that they may dwell with me; he who walks in a blameless way[b], he shall serve me.
translation:
  language: sw
  text: Macho yangu yatawaelekea waaminifu wa nchi, ili wakae pamoja nami; anayetembea katika njia ya uadilifu[a], ndiye atakayenitumikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika njia isiyo na lawama.” Hapa maana ni mwenendo wa unyoofu na ukamilifu wa tabia, si kutokuwa na dhambi kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַי
  choice: Macho yangu yatawaelekea
  rationale: Inahifadhi taswira halisi ya macho huku ikitoa maana ya kuelekeza uangalifu na kibali; wakati ujao unafaa muktadha wa azimio la kifalme katika zaburi hii.
- source_word: בְּנֶאֶמְנֵי אֶרֶץ
  choice: waaminifu katika nchi
  rationale: נֶאֱמָן humaanisha mtu mwaminifu au anayeaminika; 'katika nchi' ni Kiswahili cha kawaida na hapa nchi inaelekea kuwa eneo la utawala wa mfalme.
- source_word: לָשֶׁבֶת עִמָּדִי
  choice: ili wakae pamoja nami
  rationale: יָשַׁב inaweza kumaanisha kukaa au kuishi. 'Wakae pamoja nami' huhifadhi utata huo na kudokeza ushirika wa kudumu katika uwepo wa mfalme.
- source_word: הֹלֵךְ
  choice: anayetembea
  rationale: Kitenzi-jina hiki kinaeleza mwenendo wa kawaida wa maisha; taswira ya kutembea ni ya asili na inaeleweka katika Kiswahili.
- source_word: בְּדֶרֶךְ תָּמִים
  choice: katika njia ya uadilifu
  rationale: דֶּרֶךְ ni sitiari ya mwenendo wa maisha, na תָּמִים hapa hudokeza ukamilifu wa tabia, unyoofu, au kutolaumika, si kutokuwa na dhambi kabisa.
- source_word: הוּא
  choice: ndiye
  rationale: Muundo huu wa Kiswahili unahifadhi msisitizo wa kiwakilishi cha Kiebrania kwamba mtu huyo ndiye anayestahili kutumikia.
- source_word: יְשָׁרְתֵנִי
  choice: atakayenitumikia
  rationale: שׁרת huonyesha huduma ya kibinafsi, mara nyingi katika mazingira rasmi au ya kifalme; 'atanitumikia' ni ya kawaida bila kuipa maana finyu ya kidini.
theological_decisions:
- issue: Sifa ya kimaadili ya washirika wa mfalme
  choice: Mwandishi anamwangalia kwa kibali mtu mwaminifu katika nchi, na mwenye kuishi kwa uadilifu ndiye anayefaa kumtumikia.
  alternative: Mstari unaweza kueleweka kwa maana finyu zaidi kuwa unahusu uteuzi wa maofisa wa ikulu pekee.
  rationale: Kiebrania kinaweza kujumuisha ushirika wa karibu ('wakae pamoja nami') pamoja na huduma rasmi ('atanitumikia'); tafsiri haifungi maana katika upande mmoja tu.
- issue: Maana ya תָּמִים
  choice: '''Uadilifu'' unaonyesha maisha yaliyo manyofu na yenye ukamilifu wa tabia.'
  alternative: '''Bila lawama'' inaweza kutumiwa, lakini huenda baadhi ya wasomaji wakaielewa kuwa kutokuwa na dhambi kabisa.'
  rationale: Katika muktadha huu neno linahusu unyoofu au ukamilifu wa mwenendo, si dai la ukamilifu usio na dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. 'Wakae pamoja nami' huhifadhi uwezekano wa kukaa au kuishi katika uwepo wa mfalme. Alama ya tanbihi [a] imewekwa baada ya kirai husika.
