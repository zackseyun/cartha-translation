  yaml_path: translation/ot/psalms/101/004.yaml
  text: A crooked heart will depart from me[a]; I will not know evil.
translation:
  language: sw
  text: Moyo mpotovu utaondoka kwangu; sitaujua uovu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sitakuwa na uhusiano wowote na uovu.” Kiebrania kinasema kihalisi, “Sitaujua uovu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵבָב
  choice: moyo
  rationale: Katika mtazamo wa Kiebrania, neno hili humaanisha utu wa ndani, pamoja na nia na mawazo. “Moyo” ni tafsiri ya kawaida na wazi inayodumisha uzito wa kimaadili.
- source_word: עִקֵּשׁ
  choice: mpotovu
  rationale: Kivumishi hiki hueleza hali ya kupinda au kupotoka kimaadili. “Mpotovu” ni Kiswahili cha asili na chenye heshima, ingawa sitiari ya kitu kilichopinda imeelezwa kwa maana yake ya kimaadili.
- source_word: יָסוּר
  choice: utaondoka
  rationale: Kitenzi סור humaanisha kugeuka kando au kuondoka. Pamoja na מִמֶּנִּי, kinaonyesha kutengana na msemaji.
- source_word: מִמֶּנִּי
  choice: kwangu
  rationale: Kihusishi מן chenye kiambishi cha nafsi ya kwanza kinaonyesha kuondoka au kutengwa na msemaji; “kuondoka kwangu” ni usemi wa kawaida wa Kiswahili.
- source_word: רָע
  choice: uovu
  rationale: Hapa neno hili linatumika kwa maana pana ya ubaya wa kimaadili. “Uovu” hudumisha upana huo bila kuufanya kuwa tendo mahususi.
- source_word: לֹא אֵדָע
  choice: sitaujua
  rationale: Tafsiri hii inahifadhi kitenzi cha Kiebrania “kujua” na fumbo lake la kimakusudi. Kiambishi “-u-” kinarejelea “uovu” kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya “kujua” kuhusiana na uovu
  choice: Kauli ya moja kwa moja “sitaujua uovu” imehifadhiwa katika matini, huku tanbihi ikionyesha uwezekano wa maana ya kutoshirikiana nao.
  alternative: Sitakuwa na uhusiano wowote na uovu.
  rationale: ידע inaweza kumaanisha zaidi ya ufahamu wa kiakili, ikihusisha utambuzi wa karibu, ushirika, au kushiriki. Kuhifadhi “kujua” hakufuti mvutano wa kitheolojia na kimaadili wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mpangilio wa kishairi na mkazo wa kimaadili wa Kiebrania umehifadhiwa.
