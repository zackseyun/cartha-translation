  yaml_path: translation/ot/psalms/101/001.yaml
  text: Of David[a]. A psalm. I will sing of steadfast love and justice; to you, O Yahweh[b], I will sing praise.
translation:
  language: sw
  text: 'Ya Daudi.[a] Zaburi.


    Nitaimba kuhusu upendo thabiti na haki;

    Ee Yahweh, nitakuimbia sifa.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaweza kueleweka kuwa “ya Daudi,” “kwa ajili ya Daudi,” au kuwa zaburi inayohusishwa na Daudi.
    reason: alternative_reading
  - marker: b
    text: Au “nitakupigia muziki wa sifa.” Kitenzi cha Kiebrania kinaweza kumaanisha kuimba sifa au kufanya muziki, huenda kwa ala.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Katika kichwa cha zaburi, לְ inaweza kuonyesha utunzi, wakfu, au uhusiano. “Ya Daudi” ni ya kawaida kwa Kiswahili na haibani maana kuwa lazima ni “iliyoandikwa na Daudi.”
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ndilo neno la Kiswahili lililozoeleka kwa wimbo wa ibada wa aina hii; muundo “Zaburi ya Daudi” pia ni kichwa cha asili na chenye hadhi.
- source_word: חֶסֶד
  choice: upendo thabiti
  rationale: חֶסֶד huhusisha upendo, rehema, na uaminifu wa kudumu katika uhusiano wa agano. “Upendo thabiti” huonyesha uthabiti huo bila kulibana neno kuwa rehema pekee.
- source_word: וּמִשְׁפָּט
  choice: na haki
  rationale: מִשְׁפָּט inaweza kumaanisha haki, hukumu, au uamuzi wa kisheria. Katika jozi hii na חֶסֶד, “haki” huonyesha vizuri kanuni ya utawala na mwenendo wa adili.
- source_word: אָשִׁירָה
  choice: Nitaimba
  rationale: Umbo la kohortativi linaonyesha azimio au nia; “Nitaimba” ni la kawaida na linadumisha nguvu hiyo.
- source_word: לְךָ
  choice: nitakuimbia
  rationale: Kiambishi “-ku-” na kiendelezi “-ia” vinaonyesha kwa kawaida kwamba Yahweh ndiye anayeimbwa sifa, hivyo maana ya “kwako” imehifadhiwa bila tungo nzito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa na cheo, kwa kuwa maandishi ya Kiebrania yana יהוה.
- source_word: אֲזַמֵּרָה
  choice: nitaimba sifa
  rationale: זמר hueleza kuimba au kufanya muziki wa sifa. “Nitaimba sifa” ni Kiswahili cha asili, cha kishairi, na hutofautisha kwa kiasi kitenzi hiki na אָשִׁירָה bila kupoteza usambamba.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la herufi nne יהוה. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Upana wa maana ya חֶסֶד
  choice: upendo thabiti
  alternative: rehema au uaminifu wa agano
  rationale: Neno linaunganisha upendo, rehema, na uaminifu wa kudumu. Tafsiri iliyochaguliwa haifungi maana katika kipengele kimoja cha kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Kichwa kimefupishwa kiasili kuwa “Zaburi ya Daudi,” na mstari umewekwa katika mistari miwili ili kudumisha usambamba wa Kiebrania.
