  text: לֹֽא יֵשֵׁ֨ב בְּ/קֶ֥רֶב בֵּיתִ/י֮ עֹשֵׂ֪ה רְמִ֫יָּ֥ה דֹּבֵ֥ר שְׁקָרִ֑ים לֹֽא יִ֝כּ֗וֹן לְ/נֶ֣גֶד עֵינָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/007.yaml
  text: One who practices deceit will not dwell within my house[b][a]; one who speaks lies will not stand before my eyes.
translation:
  language: sw
  text: Afanyaye udanganyifu[a] hatakaa ndani ya nyumba yangu; asemaye uongo hatasimama[b] mbele ya macho yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atendaye kwa udanganyifu.” Usemi wa Kiebrania ni halisi, “afanyaye udanganyifu,” ukionyesha mwenendo wa udanganyifu ambao ni tabia yake.
    reason: lexical_alternative
  - marker: b
    text: Au, “hatathibitika mbele ya macho yangu.” Kitenzi cha Kiebrania kinaweza kumaanisha kuthibitika, kuimarishwa, au kusimama imara; hapa huenda maana ni kwamba mtu huyo hataruhusiwa kubaki mbele ya msemaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: hatakaa
  rationale: Kitenzi kinaweza kumaanisha kuketi, kukaa, kuishi au kubaki. Katika muktadha wa nyumba, “hatakaa” huonyesha kutoruhusiwa kuendelea kuwa humo bila kulazimisha maana ya makazi ya kudumu pekee.
- source_word: בְּקֶרֶב בֵּיתִי
  choice: ndani ya nyumba yangu
  rationale: Hii ni Kiswahili cha kawaida na cha moja kwa moja kwa wazo la kuwa katikati au ndani ya nyumba ya msemaji.
- source_word: עֹשֵׂה רְמִיָּה
  choice: atendaye kwa udanganyifu
  rationale: Muundo wa kirai cha Kiebrania unaonyesha mtu mwenye mwenendo wa kufanya udanganyifu; tafsiri hii huhifadhi tendo linalomwelezea mtu badala ya kumwita tu mdanganyifu.
- source_word: דֹּבֵר שְׁקָרִים
  choice: asemaye uongo
  rationale: Huhifadhi umbo la kitendo na usambamba na kishazi cha kwanza. Katika Kiswahili, “uongo” hutumika kwa kawaida kama nomino isiyohesabika ingawa Kiebrania kina wingi.
- source_word: יִכּוֹן
  choice: hatasimama
  rationale: Katika Niphal, kitenzi kinaweza kumaanisha kuimarishwa, kuthibitika au kusimama imara. “Hatasimama” huhifadhi taswira na inafaa kwa muktadha wa kutoruhusiwa kubaki mbele ya msemaji.
- source_word: לְנֶגֶד עֵינַי
  choice: mbele ya macho yangu
  rationale: Tafsiri hii huhifadhi taswira halisi ya Kiebrania na maana ya kuwa machoni au mbele ya msemaji.
theological_decisions:
- issue: Upeo wa msemaji kuwafukuza wadanganyifu
  choice: Kauli imehifadhiwa kama azimio la binafsi au la kifalme kuhusu nani anayeruhusiwa kukaa katika nyumba na mbele ya msemaji.
  alternative: Kuifanya kuwa kauli ya jumla kuhusu nyumba ya Mungu au mfano wa usafi wa ndani.
  rationale: Nafsi ya kwanza katika “nyumba yangu” na “macho yangu” inapaswa kuhifadhiwa; muktadha wa Zaburi 101 ni azimio la mtawala kuhusu nyumba yake na utawala wa haki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Miundo “atendaye” na “asemaye” huhifadhi usambamba wa kishairi wa Kiebrania. Alama za tanbihi zimewekwa mara moja kila moja katika sehemu inayohusika.
