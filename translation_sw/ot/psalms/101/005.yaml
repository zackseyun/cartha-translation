  yaml_path: translation/ot/psalms/101/005.yaml
  text: Whoever secretly slanders his neighbor[a], him I will destroy; one with haughty eyes and a proud heart[b], him I cannot endure.
translation:
  language: sw
  text: Yeyote anayemkashifu jirani yake kwa siri,[a] huyo nitamwangamiza; mwenye macho ya kiburi na moyo wa majivuno,[b] huyo siwezi kumvumilia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtu anayemkashifu mwenzake kwa siri, huyo nitamkatilia mbali.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “mwenye macho yaliyoinuka na moyo mpana”; hii ni nahau ya Kiebrania inayomaanisha mwonekano wa kujivuna na moyo wa kiburi.
    reason: cultural_note
lexical_decisions:
- source_word: מלושני
  choice: Yeyote anayemchongea
  rationale: Kitenzi cha Kiebrania kinamaanisha kusema kwa nia mbaya ili kumharibia mwingine sifa. ‘Kumchongea’ ni Kiswahili cha kawaida kinachobeba wazo la mashtaka au maneno mabaya dhidi ya mtu, huku muundo ‘yeyote anaye-’ ukihifadhi maana ya mtu yeyote mwenye tabia hiyo.
- source_word: בַסֵּתֶר
  choice: kwa siri
  rationale: Huhifadhi maana ya tendo linalofanywa kwa kujificha na ni usemi wa asili katika Kiswahili.
- source_word: רֵעֵהוּ
  choice: jirani yake
  rationale: Neno linaweza kumaanisha jirani, mwenzake, au mtu aliye karibu naye kijamii. ‘Jirani yake’ ni tafsiri pana iliyozoeleka katika muktadha wa kibiblia.
- source_word: אַצְמִית
  choice: nitamwangamiza
  rationale: Hifili ya צמת ina nguvu ya kukomesha au kuharibu kabisa. ‘Nitamwangamiza’ huhifadhi ukali wa tamko bila kubainisha njia mahsusi ya adhabu.
- source_word: גְּבַהּ עֵינַיִם
  choice: mwenye macho ya kiburi
  rationale: Huhifadhi taswira halisi ya Kiebrania ya macho yaliyoinuka, ambayo ni nahau ya majivuno na dharau.
- source_word: וּרְחַב לֵבָב
  choice: na moyo wa majivuno
  rationale: Ingawa maana halisi ni ‘mpana wa moyo,’ katika muktadha huu ni nahau ya kujikweza, si ukarimu. ‘Moyo wa majivuno’ hutoa maana hiyo wazi.
- source_word: לֹא אוּכָל
  choice: siwezi kumvumilia
  rationale: Maana halisi ni ‘siwezi,’ huku tendo la kustahimili likidokezwa. Tafsiri hii hudumisha mvutano kati ya kutoweza na kukataa kimaadili.
theological_decisions:
- issue: Upeo wa hukumu katika azimio la kifalme na kimaadili
  choice: Msemaji anaazimia kumwondoa au kumkomesha mtu anayechongea na kukataa kumvumilia mwenye kiburi, bila kutaja njia mahsusi ya hukumu.
  alternative: Kauli hiyo inaweza kueleweka kuwa ahadi ya kumuua kihalisi mtu huyo, au kuwa lugha ya mkazo kuhusu kukataa tu kushirikiana naye.
  rationale: Kitenzi אַצְמִית ni kikali, lakini mstari hautaji utaratibu maalumu wa adhabu. Tafsiri inahifadhi ukali huo bila kuingiza maelezo yasiyokuwapo katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi wenye vipashio viwili umehifadhiwa, pamoja na kurudiwa kwa ‘huyo’ ili kuakisi msisitizo wa Kiebrania.
