  text: כְּמ֣וֹ שַׁ֭בְּלוּל תֶּ֣מֶס יַהֲלֹ֑ךְ נֵ֥פֶל אֵ֝֗שֶׁת בַּל חָ֥זוּ שָֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/008.yaml
  text: Like a snail that melts away as it goes[b][a], like a stillborn child that has not seen the sun.
translation:
  language: sw
  text: Kama konokono anayeyeyuka anapotambaa, kama mtoto aliyezaliwa mfu ambaye hajaliona jua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּמוֹ
  choice: Kama
  rationale: Huanzisha tashbihi kwa njia ya kawaida na ya kishairi katika Kiswahili.
- source_word: שַׁבְּלוּל
  choice: konokono
  rationale: Maana ya kimapokeo na iliyoimarika ni konokono; taswira ni ya kiumbe anayeonekana kuyeyuka anapotembea.
- source_word: תֶּמֶס
  choice: anayeyeyuka
  rationale: Neno linahusiana na kuyeyuka au kutoweka; muundo wa kitenzi unaifanya taswira ieleweke kwa kawaida katika Kiswahili.
- source_word: יַהֲלֹךְ
  choice: aendapo
  rationale: Ni kitenzi cha kwenda au kutembea; ‘aendapo’ ni kifupi, cha kishairi, na kinaonyesha tendo linaloendelea sambamba na kuyeyuka.
- source_word: נֵפֶל
  choice: mtoto aliyezaliwa mfu
  rationale: Katika muktadha huu neno humaanisha mimba iliyoharibika au mtoto aliyezaliwa mfu. Chaguo hili linaweka wazi kuwa kishazi kinachofuata kinamhusu mtoto, si mwanamke.
- source_word: אֵשֶׁת
  choice: —
  rationale: Neno la Kiebrania ‘wa mwanamke’ halijatafsiriwa kwa namna ya moja kwa moja kwa sababu Kiswahili cha kawaida hakihitaji kubainisha hilo baada ya ‘mtoto aliyezaliwa mfu’; maana kuu ya taswira imehifadhiwa.
- source_word: בַּל חָזוּ
  choice: ambaye hajaliona
  rationale: Ingawa kitenzi cha Kiebrania ni cha wingi na sintaksia ni ngumu, kimantiki kinarejelea mtoto ambaye hakuliona jua. Umoja wa Kiswahili unapatana na nomino iliyotumiwa.
- source_word: שָׁמֶשׁ
  choice: jua
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida; hapa kuona jua hudokeza kuingia katika maisha ya ulimwengu.
theological_decisions:
- issue: Kirejelewa cha kishazi ‘hawakuliona jua’
  choice: Kishazi kimerejeshwa kwa mtoto aliyezaliwa mfu.
  alternative: Kukihusisha na mwanamke, au kuhifadhi wingi usio na kirejelewa wazi.
  rationale: Ingawa Kiebrania kina kitenzi cha wingi kisicholingana kwa urahisi na nomino ya umoja, muktadha unaonyesha kuwa wasiokuwa wameliona jua ni watoto ambao hawakupata kuishi, si mama.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Aendapo’ hudumisha ufupi na hadhi ya zaburi; ‘mtoto aliyezaliwa mfu’ huepuka kishazi kuelekezwa kimakosa kwa mwanamke.
