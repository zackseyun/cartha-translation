translation_notes:
  register: Lugha ni ya sasa, yenye heshima na ya kishairi kwa kiasi. ‘Ulozi’ na ‘walogaji’ yanaeleweka kwa wasomaji wa Afrika Mashariki, huku tanbihi zikihifadhi uhusiano wa neno la asili na kunong’ona pamoja na nahau ya ‘kufunga’ ulozi.
