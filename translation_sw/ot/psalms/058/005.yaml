lexical_decisions:
- source_word: אֲשֶׁר
  choice: ambayo
  rationale: Kiwakilishi hiki cha uhusiano kinaendeleza maelezo ya nyoka katika mstari uliotangulia bila kuanzisha sentensi mpya isiyohusiana.
- source_word: לֹא יִשְׁמַע
  choice: haisikilizi
  rationale: Hapa kitenzi kinaonyesha kwamba nyoka haitikii sauti, si kwamba haina uwezo wa kuisikia tu; wakati wa sasa unaonyesha tabia yake katika tashbihi hii.
- source_word: לְקוֹל
  choice: sauti ya
  rationale: קוֹל inaweza kumaanisha sauti au neno linalotamkwa; hapa inahusishwa na watu wanaonong’ona au kutamka maneno ya ulozi.
- source_word: מְלַחֲשִׁים
  choice: walogaji
  rationale: Neno linatokana na wazo la kunong’ona, hasa kunong’ona maneno ya hirizi au ulozi. Katika muktadha wa kutuliza nyoka, ‘walogaji’ linaonyesha wazi kazi ya watu hao.
- source_word: חוֹבֵר חֲבָרִים
  choice: mfungaji ... wa ulozi
  rationale: Usemi wa Kiebrania una maana halisi ya mtu ‘anayefunga mafungo/ulozi’ na ni nahau inayomhusu mtu anayetumia maneno au hirizi za uchawi. ‘Mfungaji wa ulozi’ huhifadhi taswira ya asili bila kuwa mgumu kupita kiasi.
- source_word: מְחֻכָּם
  choice: stadi
  rationale: Katika muktadha huu neno linasisitiza ustadi au ujuzi wa mhusika, wala si hekima yenye thamani ya kimaadili.
