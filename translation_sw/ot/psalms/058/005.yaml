  text: isiyosikiliza sauti ya walogaji,[a] ya mwenye ustadi wa kufunga hirizi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sauti ya wanong’onezaji.” Neno la Kiebrania lina uhusiano na kunong’ona au kutamka maneno ya hirizi.
