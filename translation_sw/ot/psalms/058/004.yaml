lexical_decisions:
- source_word: חֲמַת
  choice: sumu
  rationale: Katika ulinganisho na nyoka, neno hili humaanisha sumu ya nyoka, si ghadhabu.
- source_word: לָמוֹ
  choice: yao
  rationale: 'Katika muundo huu, kiwakilishi kinaonyesha umilikaji: “sumu yao.”'
- source_word: כִּדְמוּת
  choice: ni kama
  rationale: Huwasilisha ulinganisho kwa Kiswahili cha kawaida na kuhifadhi taswira ya kishairi.
- source_word: נָחָשׁ
  choice: nyoka
  rationale: Ni jina la jumla la mnyama huyu na linafaa kabla ya aina maalumu inayotajwa katika mstari unaofuata.
- source_word: כְּמוֹ
  choice: kama ya
  rationale: Neno “ya” linarejelea sumu bila kuirudia, huku ulinganisho ukibaki wazi na wa asili katika Kiswahili.
- source_word: פֶתֶן
  choice: swila
  rationale: Neno la Kiebrania humaanisha nyoka mwenye sumu; “swila” ni neno la kawaida la Kiswahili kwa cobra, ingawa utambulisho kamili wa spishi hauna uhakika.
- source_word: חֵרֵשׁ
  choice: kiziwi
  rationale: Taswira ni ya nyoka asiyesikia, si asiyeweza kusema.
- source_word: יַאְטֵם
  choice: anayeziba
  rationale: Huhifadhi maana hai ya kufunga au kuziba sikio.
- source_word: אָזְנוֹ
  choice: sikio lake
  rationale: Kiswahili hutumia upatanisho wa ngeli kwa swila na kiwakilishi “lake” kwa kawaida.
