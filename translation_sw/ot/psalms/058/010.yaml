  text: יִשְׂמַ֣ח צַ֭דִּיק כִּי חָזָ֣ה נָקָ֑ם פְּעָמָ֥י/ו יִ֝רְחַ֗ץ בְּ/דַ֣ם הָ/רָשָֽׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/010.yaml
  text: The righteous will rejoice when he sees vengeance[b][a]; he will wash his feet in the blood of the wicked.
translation:
  language: sw
  text: Mwenye haki atafurahi atakapoona kisasi[a]; ataosha miguu yake katika damu ya mwovu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu ameona kisasi.” Kiunganishi cha Kiebrania kinaweza kueleweka kwa maana ya sababu (“kwa sababu/kwani”) au ya wakati (“wakati”).
    reason: lexical_alternative
  - marker: b
    text: Picha ya “kuosha miguu yake katika damu ya mwovu” ni ya kishairi na huonyesha ukamilifu wa hukumu; si amri ya mtu binafsi kutumia jeuri.
    reason: cultural_note
lexical_decisions:
- source_word: יִשְׂמַח
  choice: atafurahi
  rationale: Kitenzi cha Qal imperfect katika muktadha huu wa kishairi kinaelekea kuonyesha jambo la wakati ujao; “atafurahi” ni Kiswahili cha kawaida na huhifadhi nguvu hiyo.
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Kivumishi hiki cha umoja kimetumiwa kama nomino. “Mwenye haki” ni cha asili katika Kiswahili na huhifadhi umoja wa uwakilishi bila kuongeza neno “mwanamume.”
- source_word: כִּי
  choice: atakapo-
  rationale: Hapa kiunganishi kinaweza kueleweka kwa maana ya wakati au sababu. Muundo “atakapoona” unawasilisha kwa kawaida mazingira yanayochochea furaha, huku maana ya sababu ikitajwa katika tanbihi.
- source_word: חָזָה
  choice: ona
  rationale: Kitenzi hiki humaanisha kuona au kutazama. Katika kishazi kinachoelekezwa kwa wakati ujao, “atakapoona” ni cha asili kuliko tafsiri yenye ladha ya kizamani.
- source_word: נָקָם
  choice: kisasi
  rationale: Neno hili humaanisha kisasi au tendo la kulipiza. “Kisasi” huhifadhi ukali wa hukumu katika picha ya Kiebrania bila kuilegeza kuwa ukombozi au kuthibitishwa kuwa na haki.
- source_word: פְּעָמָיו
  choice: miguu yake
  rationale: Ingawa neno linaweza kuhusiana na hatua au nyayo, pamoja na tendo la kuosha katika damu picha halisi ya “miguu yake” ndiyo inayoeleweka vizuri zaidi.
- source_word: יִרְחַץ
  choice: ataosha
  rationale: Qal imperfect ya רחץ humaanisha kuosha; “ataosha” huhifadhi hali ya wakati ujao na picha dhahiri ya kishairi.
- source_word: בְּדַם
  choice: katika damu
  rationale: Kihusishi ב hapa kinafaa kueleweka kwa maana ya ndani ya kitu au kwa kutumia kitu. “Katika damu” huhifadhi moja kwa moja picha kali ya maandishi.
- source_word: הָרָשָׁע
  choice: mwovu
  rationale: Kivumishi cha umoja kimetumiwa kama nomino, kwa maana ya mtu mwovu anayewakilisha waovu; “mwovu” huhifadhi umoja huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Ikiwa mstari unaonyesha chuki binafsi ya kulipiza kisasi au furaha kwa sababu ya hukumu ya haki
  choice: Tafsiri inaonyesha mwenye haki akifurahi anapoona kisasi, bila kukiongeza wazi kuwa ni kisasi chake binafsi au kukifafanua katika matini kuwa hukumu ya Mungu.
  alternative: Kutafsiri kama mwenye haki anashangilia kulipiza kwake binafsi, au kulainisha “kisasi” kuwa kuthibitishwa kuwa na haki.
  rationale: Kiebrania kinasema kwamba mwenye haki anafurahi akiona kisasi na kinahifadhi picha kali ya kuosha miguu katika damu ya mwovu. Tafsiri haiongezi mhusika wa kisasi ambaye hajasemwa wazi, hivyo inadumisha mvutano wa kiteolojia wa zaburi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Sentensi ni fupi na ya moja kwa moja; picha kali ya Kiebrania na umoja wa uwakilishi katika “mwenye haki” na “mwovu” zimehifadhiwa.
