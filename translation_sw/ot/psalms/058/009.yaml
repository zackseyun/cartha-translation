  text: Before your pots can feel the thornbush[a], whether green or burning, he will sweep them away.
translation:
  language: sw
  text: Kabla vyungu vyenu havijahisi joto la kichaka cha miiba[a], kikiwa bado kibichi au tayari kinawaka, atavipeperusha mbali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania hapa ni kigumu: kwa karibu kabisa, ‘Kabla vyungu vyenu havijatambua kichaka cha miiba, kama kilicho hai, kama mwako/hasira, atakipeperusha mbali.’ Huenda maana ni kwamba vitaondolewa kwa ghafula kabla joto halijavipasha vyungu. Wengine hutafsiri kishazi cha mwisho kuwa ‘atavifagilia mbali kwa hasira.’ Kiwakilishi cha Kiebrania ni cha umoja, hivyo kinaweza pia kumaanisha ‘atakipeperusha/atampeperusha mbali.’'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: Kabla ... havija-
  rationale: Muundo huu unaonyesha kwamba kupeperushwa kunatokea kabla ya vyungu kuanza kuhisi moto, na unadumisha ghafla ya picha ya Kiebrania.
- source_word: יָבִינוּ
  choice: havijahisi
  rationale: Kitenzi kwa kawaida humaanisha ‘kufahamu’ au ‘kutambua’; kwa kuwa vyungu ndivyo kiima katika picha hii, ‘kuhisi’ huwasilisha kwa lugha ya kawaida wazo la kuanza kupata moto bila kupanua sana maana.
- source_word: סִּירֹתֵיכֶם
  choice: vyungu vyenu
  rationale: Ni vyombo vya kupikia; ‘vyungu’ ni neno la kawaida na la wazi katika Kiswahili cha Afrika Mashariki.
- source_word: אָטָד
  choice: kichaka cha miiba
  rationale: Neno hili linataja kichaka chenye miiba ambacho kingeweza kutumiwa kama kuni zinazowaka haraka; tafsiri hii inadumisha picha halisi.
- source_word: כְּמוֹ חַי
  choice: kiwe kibichi
  rationale: Katika muktadha wa kuni, ‘hai’ yaelekea kumaanisha kichaka ambacho bado ni kibichi, tofauti na kile kinachowaka.
- source_word: כְּמוֹ חָרוֹן
  choice: au kinawaka
  rationale: חָרוֹן mara nyingi humaanisha hasira kali, lakini katika picha ya moto inaweza kueleza hali ya kuwaka. ‘Kinawaka’ inadumisha picha ya moto huku uwezekano wa ‘hasira’ ukihifadhiwa katika tanbihi.
- source_word: יִשְׂעָרֶנּוּ
  choice: atavipeperusha mbali
  rationale: Kitenzi kina wazo la dhoruba au kisulisuli kinachochukua kitu kwa nguvu. ‘Atavipeperusha mbali’ ni Kiswahili cha asili kinachoonyesha kuondolewa kwa ghafula; kiambishi cha wingi kinaelekeza kwa vyungu katika picha kuu, huku utata wa kiwakilishi cha Kiebrania ukitajwa katika tanbihi.
theological_decisions:
- issue: Maana ya picha ngumu ya kishairi na utambulisho wa kinachoondolewa
  choice: Mstari unaonyesha kuondolewa kwa ghafula kabla moto wa miiba haujapata kuvipasha vyungu, ikiwa kichaka ni kibichi au tayari kinawaka.
  alternative: Kishazi cha mwisho kinaweza kueleweka kuwa ‘atafagilia mbali kwa hasira,’ na kiambishi cha Kiebrania kinaweza kurejelea kitu au mtu mmoja badala ya vyungu.
  rationale: Tafsiri kuu inafuata muktadha wa hukumu ya ghafula na kudumisha picha ya vyungu, miiba, na moto. Haitaji wazi kwamba ‘hasira’ ndiyo maana pekee ya חָרוֹן, wala haifichi utata wa kisintaksia, ambao umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Vyungu,’ ‘kichaka cha miiba,’ na ‘kupeperusha mbali’ ni maneno yanayoeleweka kwa wasomaji wa kawaida. Tanbihi inadumisha ugumu wa Kiebrania bila kulemea mstari mkuu.
