    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֻמְנָם
  choice: Je, kweli
  rationale: Huendeleza swali la balagha lenye msisitizo na changamoto ya kimzaha iliyomo katika Kiebrania.
- source_word: אֵלֶם
  choice: katika ukimya
  rationale: Hufuata uwekaji wa vokali wa Maandishi ya Kimasoreti, unaoelekeza kwenye maana ya ukimya au ububu, huku ugumu wake ukielezwa katika tanbihi.
- source_word: צֶדֶק
  choice: haki
  rationale: Neno hili lina maana ya kimaadili na kimahakama na linaambatana kwa kawaida na kitenzi 'kunena' katika Kiswahili.
- source_word: תְּדַבֵּרוּן
  choice: mnanena
  rationale: Huwasilisha kitendo cha kusema kwa lugha ya kishairi, ya heshima, na inayoeleweka.
- source_word: מֵישָׁרִים
  choice: kwa unyofu
  rationale: Huhifadhi taswira ya unyofu na maana ya kutenda kwa usawa katika hukumu.
- source_word: תִּשְׁפְּטוּ
  choice: mnahukumu
  rationale: Huhifadhi maana ya moja kwa moja ya kimahakama ya kitenzi.
- source_word: בְּנֵי אָדָם
  choice: wanadamu
  rationale: Ni Kiswahili cha kawaida na cha sasa kwa usemi wa Kiebrania 'wana wa mtu/Adamu'; hudumisha maana ya kuwa viumbe wenye kufa bila kuleta mkanganyiko wa Kiswahili wa tafsiri sisisi.
theological_decisions:
- issue: Maana ya אֵלֶם katika mstari huu mgumu
  choice: Kufuata uwekaji wa vokali wa Maandishi ya Kimasoreti kwa maana ya 'ukimya' katika matini kuu
  alternative: Kulisoma kama neno la kuwaita 'wenye nguvu' au hata 'miungu'
  rationale: Matini ya Kimasoreti inaunga mkono maana inayohusiana na ukimya au ububu, lakini usomaji mwingine wa kale hubadili sana anayelengwa na swali; kwa hiyo haujaondolewa bali umehifadhiwa katika tanbihi.
translation_notes:
