  text: Je, kweli mnanena haki katika ukimya? Je, mnahukumu kwa unyofu, wanadamu?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Neno la Kiebrania אֵלֶם ni gumu. Uwekaji wa vokali katika Matini ya Kimasoreti unaelekeza kwenye maana ya “ukimya” au “ububu”; wengi hulielewa badala yake kuwa “wenye nguvu,” au hata “miungu,” hivyo: “Je, kweli mnanena haki, enyi wenye nguvu?”'
    reason: alternative_reading
  - marker: b
