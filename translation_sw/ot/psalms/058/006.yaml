  text: אֱֽלֹהִ֗ים הֲרָס שִׁנֵּ֥י/מוֹ בְּ/פִ֑י/מוֹ מַלְתְּע֥וֹת כְּ֝פִירִ֗ים נְתֹ֣ץ יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/006.yaml
  text: God[a], break their teeth in their mouths; shatter the fangs of the young lions[b], O Yahweh.
translation:
  language: sw
  text: Ee Mungu, yavunje meno yao vinywani mwao; yavunjavunje magego ya simba wachanga, Ee Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Nomino hii ni mwito wa moja kwa moja; kiingizi “Ee” kinaonyesha wazi na kwa lugha ya kishairi ya Kiswahili kwamba Mungu anaombwa.
- source_word: הֲרָס
  choice: yavunje
  rationale: Amri kutoka הרס ina maana ya kubomoa au kuvunja; inapohusishwa na meno, “yavunje” ni ya kawaida na inadumisha ukali wa taswira.
- source_word: שִׁנֵּימוֹ
  choice: meno yao
  rationale: Ni nomino ya wingi yenye kiambishi cha nafsi ya tatu wingi wa kiume.
- source_word: בְּפִימוֹ
  choice: vinywani mwao
  rationale: Huhifadhi maana ya kawaida ya ב kama mahali—meno yakiwa ndani ya vinywa vyao—bila kuitafsiri kuwa kuondolewa kutoka humo.
- source_word: מַלְתְּעוֹת
  choice: meno ya mashambulizi
  rationale: Neno hili linaelekea kumaanisha meno makubwa ya kusagia au sehemu yenye nguvu ya taya. Katika taswira ya simba, “meno ya mashambulizi” huwasilisha kazi yake ya hatari bila kuyabainisha kwa uhakika kuwa magego au meno ya mbele.
- source_word: כְּפִירִים
  choice: simba wachanga
  rationale: Hurejelea simba vijana wenye nguvu, si lazima vitoto vidogo vya simba.
- source_word: נְתֹץ
  choice: yapondaponda
  rationale: Amri kutoka נתץ hubeba maana ya kubomoa, kuvunja, au kuponda. “Yapondaponda” inafaa kwa meno na kudumisha ulinganifu wenye nguvu na “yavunje.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetoholewa kama “Yahweh” badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la agano; kulitohowa kama “Yahweh” hulihifadhi badala ya kuweka cheo mahali pake.
- issue: Taswira kali ya laana katika sala
  choice: Kudumisha ombi halisi la kuvunjwa kwa meno
  alternative: Kulainisha kuwa “ondoa nguvu zao”
  rationale: Kiebrania kinatumia taswira mahususi ya kimwili; kuibadili kuwa wazo dhahania kungepunguza ukali na ushairi wa ombi.
- issue: Utambulisho wa מַלְתְּעוֹת
  choice: meno ya mashambulizi
  alternative: magego, meno ya taya, au makucha
  rationale: Maana yake mahususi ya kianatomia haijathibitishwa kabisa. Tafsiri iliyochaguliwa inadumisha taswira ya meno hatari ya simba bila kudai usahihi usio na uhakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa mistari sambamba na ukali wa ombi la Kiebrania vimehifadhiwa; “Ee” imetumiwa kwa mwito wa moja kwa moja.
