  text: 'Waovu wametengwa tangu tumboni;

    hupotoka tangu kuzaliwa[a], wakisema uongo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kihalisi: “tangu tumboni” ... “kutoka tumboni”; mstari huu unatia chumvi kwa kishairi kueleza kwamba waovu wamepotoka tangu mwanzo kabisa wa maisha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹרוּ
  choice: wametengwa
  rationale: Kitenzi hiki kinaonyesha hali ya kuwa mbali au kutengwa. ‘Wametengwa’ huhifadhi wazo la kujitenga bila kulifasiri moja kwa moja kuwa uharibifu wa kimaadili.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Hili ni neno la kawaida na la wazi kwa kundi la watu wanaotenda uovu.
- source_word: מֵרָחֶם
  choice: tangu tumboni
  rationale: Huhifadhi taswira ya Kiebrania na mwanzo wa ulinganifu wa kishairi.
- source_word: תָּעוּ
  choice: hupotea
  rationale: Wakati wa mazoea katika Kiswahili huwasilisha kauli ya jumla inayodokezwa na muktadha; neno hili linaendana na wazo la kukengeuka au kwenda njia isiyofaa.
- source_word: מִבֶּטֶן
  choice: tangu kuzaliwa
  rationale: Ni usemi wa asili katika Kiswahili unaowasilisha maana ya tangu mwanzo wa maisha, huku tanbihi ikihifadhi maana halisi ya ‘tumboni.’
- source_word: דֹּבְרֵי כָזָב
  choice: wakisema uongo
  rationale: Huwasilisha kwa uwazi hali yao ya kudumu kama wasemaji wa mambo ya uongo.
- source_word: כָזָב
  choice: uongo
  rationale: Ni neno la kawaida, wazi, na linalofaa katika muktadha wa kusema.
theological_decisions:
- issue: Iwapo mstari utafsiriwe kama fundisho la moja kwa moja kuhusu hatia ya kimaadili kabla ya kuzaliwa au dhambi ya kurithi
  choice: Kuhifadhi chumvi ya kishairi kwamba waovu hukengeuka tangu mwanzo kabisa wa maisha, bila kuigeuza kuwa kauli ya kitaalamu ya kimafundisho.
  alternative: Kutafsiri mstari kama fundisho la wazi la hatia tangu kutungwa mimba, au kuudhoofisha kuwa shutuma ya kishairi isiyo na maana yoyote kuhusu hali ya mwanadamu.
  rationale: Kiebrania kinatumia ulinganifu wa kishairi, ‘tangu tumboni’ na ‘tangu kuzaliwa,’ katika zaburi ya kuwakemea waovu. Tafsiri inapaswa kuhifadhi nguvu na mvutano wa taswira hiyo bila kuingiza hitimisho la kimfumo lisilotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mistari miwili inahifadhi ulinganifu wa kishairi; ‘tangu kuzaliwa’ ni ya kawaida zaidi katika kishazi cha pili, na tanbihi inaonyesha urudiaji halisi wa taswira ya tumbo la uzazi.
