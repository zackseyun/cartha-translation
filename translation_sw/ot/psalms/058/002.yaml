base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/002.yaml
  text: Even in your heart you work injustice[b][a]; on the earth your hands weigh out violence.
translation:
  language: sw
  text: Hata mioyoni mwenu mnatenda udhalimu; duniani[b] mikono yenu hupima[a] jeuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hupima kwa uzani” au “hupima kwa kipimo.” Kitenzi cha Kiebrania kinaweza kumaanisha kupima kwa uzani au kwa kipimo.
    reason: lexical_alternative
  - marker: b
    text: Au “nchini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Naam
  rationale: Ni chembe ya kusisitiza inayotanguliza shtaka; “Naam” huonyesha uthibitisho wenye mkazo kwa Kiswahili cha hadhi.
- source_word: בְּלֵב
  choice: mioyoni mwenu
  rationale: Ingawa Kiebrania kina umoja wa kijumla, Kiswahili hutumia wingi kwa kawaida linaposemwa kundi la watu; kauli hii inaelekeza kwa nia yao ya ndani.
- source_word: עוֹלֹת
  choice: udhalimu
  rationale: Neno hili humaanisha uovu au ukosefu wa haki; “udhalimu” linafaa katika muktadha wa viongozi au waamuzi wapotovu.
- source_word: תִּפְעָלוּן
  choice: mnatenda
  rationale: Kitenzi פעל kina maana ya kufanya au kutenda; “mnatenda” huonyesha tendo la makusudi kwa lugha ya kawaida na yenye hadhi.
- source_word: בָּאָרֶץ
  choice: duniani
  rationale: Hutoa maana pana ya matendo yao ya hadharani duniani; maana ya “nchini” pia inawezekana na imehifadhiwa katika tanbihi.
- source_word: חֲמַס
  choice: jeuri
  rationale: חמס humaanisha jeuri au uovu wenye madhara; “jeuri” ni neno fupi na la kawaida linalohifadhi uzito wa shtaka.
- source_word: יְדֵיכֶם
  choice: mikono yenu
  rationale: Taswira halisi imehifadhiwa, huku mikono ikiwakilisha matendo na uwezo wa kuyatenda.
- source_word: תְּפַלֵּסוּן
  choice: hupima
  rationale: Kitenzi פלס kinaweza kumaanisha kupima kwa uzani au kipimo. “Hupima” huhifadhi sitiari ya ugawaji uliopimwa na kejeli ya waamuzi wanaotoa jeuri badala ya haki.
theological_decisions:
- issue: Nguvu ya kisitiari ya תְּפַלֵּסוּן katika muktadha wa hukumu
  choice: Kutafsiri kwa “hupima” ili kuhifadhi picha ya kupima au kugawa kwa kipimo
  alternative: “hugawa jeuri” au “hutoa jeuri kwa kipimo”
  rationale: Taswira ya kupima hudumisha kejeli ya watu wanaopaswa kupima haki lakini badala yake wanapima jeuri. Uamuzi huu hauondoi uwezekano wa maana ya kugawa kwa kipimo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Naam” hudumisha mkazo wa kishairi; “mioyoni mwenu” ni usemi wa kawaida kwa kundi la watu. Mpangilio wa maneno huhifadhi ulinganifu kati ya nia ya ndani na matendo ya mikono.
