translation:
  language: sw
  text: Na watu watasema, “Hakika kuna matunda kwa mwenye haki[a]; hakika kuna Mungu anayehukumu duniani[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kwa uhalisi zaidi: “matunda ni kwa mwenye haki”; yaani, mwenye haki hupata matokeo au malipo.'
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linalomaanisha “anayehukumu” lina umbo la wingi. Wengi hulielewa kuwa linamhusu Mungu mmoja, huku wengine wakitafsiri, ingawa huenda si hivyo, “miungu inayohukumu duniani.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֹאמַר אָדָם
  choice: Ndipo watu watasema
  rationale: Imperfecti katika muktadha huu wa kishairi inaeleza mwitikio unaofuata hukumu iliyotangulia. אָדָם ni umoja wenye maana ya jumla; Kiswahili cha kawaida huwasilisha maana hiyo kwa ‘watu’.
- source_word: אַךְ
  choice: Hakika
  rationale: Chembe hii inasisitiza uthibitisho katika sehemu zote mbili za mstari, wala hapa haimaanishi ‘ila’ au ‘tu’.
- source_word: פְּרִי לַצַּדִּיק
  choice: mwenye haki ana matunda
  rationale: ‘Matunda’ huhifadhi taswira halisi ya Kiebrania ya matokeo au malipo yanayompata mwenye haki. Muundo huu ni wa asili zaidi katika Kiswahili kuliko tafsiri ya moja kwa moja ‘matunda ni kwa mwenye haki’.
- source_word: יֵשׁ אֱלֹהִים
  choice: yuko Mungu
  rationale: יֵשׁ ni usemi wa kuwepo. Kiswahili hakihitaji kibainishi kisicho dhahiri kama ‘a’ ya Kiingereza; ‘yuko Mungu’ hukiri kuwepo na kutenda kwake Mungu.
- source_word: שֹׁפְטִים
  choice: anayehukumu
  rationale: Ingawa participo hiyo ina umbo la wingi, katika muktadha huu אֱלֹהִים inaeleweka zaidi kumrejelea Mungu mmoja. Umoja wa Kiswahili hutoa sentensi ya kawaida huku tanbihi ikihifadhi utata wa umbo la asili.
- source_word: בָּאָרֶץ
  choice: duniani
  rationale: Muktadha unahusu utekelezaji mpana wa haki ya Mungu katika ulimwengu, si nchi fulani tu.
theological_decisions:
- issue: Iwapo אֱלֹהִים שֹׁפְטִים itafsiriwe kwa umoja au wingi
  choice: Mungu anayehukumu
  alternative: miungu inayohukumu
  rationale: Kilele cha zaburi kinathibitisha haki ya Mungu, na muktadha unaunga mkono kumwelewa אֱלֹהִים kuwa Mungu mmoja. Hata hivyo, kwa kuwa שֹׁפְטִים ina umbo la wingi, tanbihi inaweka wazi usomaji mwingine badala ya kuuficha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mwenye haki’ ni rahisi na cha kawaida; ‘matunda’ yanahifadhi sitiari ya kishairi. Alama zote za tanbihi zimewekwa katika matini kuu.
