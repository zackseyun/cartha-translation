  text: 'Kwa mwongoza wa waimbaji: “Usiharibu.”[a] Ya Daudi. Miktamu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda, “kwa kufuata ‘Usiharibu,’” ikiwa maneno haya yanarejelea jina la wimbo au mpangilio wa muziki.
    reason: alternative_reading
  - marker: b
    text: Neno la Kiebrania Miktamu ni istilahi katika kichwa cha zaburi yenye maana isiyojulikana kwa hakika; huenda linataja aina ya utunzi au mpangilio wa muziki.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza wa waimbaji
  rationale: Kichwa hiki cha kawaida katika Zaburi humwelekezea kiongozi wa muziki; tafsiri hii ni ya kawaida na inaonyesha kazi yake ya kiliturujia bila kuipanua kuwa uongozi wa jumla.
- source_word: אַל תַּשְׁחֵת
  choice: “Usiharibu”
  rationale: Inaelekea kuwa jina la wimbo au mpangilio wa muziki. Alama za kunukuu huonyesha kuwa ni kichwa, huku maneno yenyewe yakibaki karibu na muundo wa Kiebrania.
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Kihusishi cha Kiebrania kinaweza kuonyesha uandishi, kuwekwa wakfu, au uhusiano. “Ya Daudi” huhifadhi upana huo kuliko “Iliyoandikwa na Daudi.”
- source_word: מִכְתָּם
  choice: Miktamu
  rationale: Maana kamili ya neno hili la kichwa cha zaburi haijulikani. Kulitohoa huhifadhi istilahi hiyo bila kulazimisha maana ya kubahatisha kama aina fulani ya maandishi au wimbo.
theological_decisions:
- issue: Asili ya istilahi katika kichwa cha zaburi
  choice: Mstari umetafsiriwa kama kichwa cha zaburi chenye maelekezo ya muziki na aina ya utungo, huku utata wa istilahi zake ukihifadhiwa.
  alternative: Kutafsiri אַל תַּשְׁחֵת kama amri ya moja kwa moja, au לְדָוִד kama dai la wazi kwamba Daudi ndiye mwandishi.
  rationale: Kiebrania hakielezi kwa uhakika kazi ya kila istilahi. Tafsiri haipaswi kudai zaidi kuhusu uandishi au maana ya kimuziki kuliko ushahidi wa chanzo unavyoruhusu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Mwongoza wa waimbaji” ni wazi na wa kawaida; “miktamu” limetoholewa kwa kuwa maana ya istilahi ya Kiebrania haina uhakika.
