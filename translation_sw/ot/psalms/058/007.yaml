  text: יִמָּאֲס֣וּ כְמוֹ מַ֭יִם יִתְהַלְּכוּ לָ֑/מוֹ יִדְרֹ֥ךְ חצ/ו כְּמ֣וֹ יִתְמֹלָֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/007.yaml
  text: Let them melt away like water that runs off[a]; when he aims his arrows[c][b], let them be as though cut off.
translation:
  language: sw
  text: Wayeyuke kama maji yanayotiririka na kutoweka[a]; anapolenga mishale yake[b], wawe kana kwamba wamekatwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yanayotiririka na kuondoka.” Usemi wa Kiebrania unaonyesha maji yakisonga na kutoweka.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mshale wake” (umoja); neno hilo linaweza pia kueleweka kwa maana ya kijumla, “mishale yake.”'
    reason: lexical_alternative
  - marker: c
    text: Kishazi cha mwisho ni kigumu katika maandishi na maana ya maneno. Tafsiri nyingine zinazowezekana ni “mishale yake iwe butu” au “inyauke.”
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּאֲסוּ
  choice: wayeyuke
  rationale: Katika taswira hii ya maji, kitenzi kinaeleweka kama kuharibika, kuyeyuka au kutoweka. “Wayeyuke” ni la kishairi, la kawaida, na linadumisha maana ya ombi la hukumu.
- source_word: כְמוֹ מַיִם
  choice: kama maji
  rationale: Hii inadumisha tashbihi ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: יִתְהַלְּכוּ לָמוֹ
  choice: yanayotiririka na kutoweka
  rationale: Usemi unaonyesha maji yakisonga na kupotea. Kuongeza “na kutoweka” kunadhihirisha matokeo ya kutiririka bila kuondoa taswira ya awali.
- source_word: יִדְרֹךְ
  choice: anapolenga
  rationale: Kitenzi hutumiwa kwa tendo la kutayarisha silaha ya upinde kwa kurusha. “Anapolenga” ni usemi wa kawaida wa Kiswahili unaoeleza tendo hilo bila kuingiza wazi neno “upinde,” ambalo halipo katika maandishi haya.
- source_word: חצו
  choice: mishale yake
  rationale: Maandishi ya Kiebrania yana umbo la umoja, “mshale wake,” lakini linaweza kueleweka kwa maana ya kijumla. Wingi unasikika kwa kawaida katika Kiswahili na unaendana na kitenzi cha wingi kinachofuata; umoja umehifadhiwa katika tanbihi.
- source_word: כְּמוֹ יִתְמֹלָלוּ
  choice: iwe kana kwamba imekatwa
  rationale: Umbo hili ni nadra na lenye utata. Tafsiri hii inadumisha wazo linalowezekana la mishale kufanywa isifae, huku “kana kwamba” ikiepuka kudai uhakika usiokuwapo katika Kiebrania.
theological_decisions:
- issue: Mhusika wa kitenzi “anapolenga”
  choice: Kiwakilishi cha nafsi ya tatu “ana-” kimeachwa bila kumtaja mhusika.
  alternative: Kumtaja Mungu au mtu mwovu waziwazi.
  rationale: Kiebrania hakumtaji mhusika kwa jina katika mstari huu. Kumtaja Mungu au mtu mwovu kungeondoa utata wa kweli wa maandishi na kuingiza uamuzi wa kifasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka kwa msomaji wa kawaida. Muundo wa ombi “wayeyuke” umehifadhi nguvu ya zaburi ya hukumu, na tanbihi zinatunza utata wa maandishi bila kuubebesha mstari maelezo mengi.
