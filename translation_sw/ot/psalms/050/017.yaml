  text: וְ֭/אַתָּה שָׂנֵ֣אתָ מוּסָ֑ר וַ/תַּשְׁלֵ֖ךְ דְּבָרַ֣/י אַחֲרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/017.yaml
  text: For you hate discipline[b][a], and you cast my words behind you.
translation:
  language: sw
  text: Kwa maana unachukia nidhamu[b][a], nawe unatupa maneno yangu nyuma yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lakini unachukia nidhamu.” Kiunganishi cha Kiebrania kinaweza kueleweka kuwa cha upinzani au cha kutoa maelezo/kuendeleza wazo.
    reason: lexical_alternative
  - marker: b
    text: “Nidhamu” pia inaweza kutafsiriwa “mafundisho,” “masahihisho,” au “maonyo,” kulingana na wigo wa maana wa neno la Kiebrania musar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Kwa maana una-
  rationale: Kiunganishi וְ pamoja na kiwakilishi kilichotajwa wazi kinaendeleza shtaka kwa kutoa maelezo ya tabia inayokemewa; “Kwa maana” ni ya asili katika muktadha huu, huku uwezekano wa maana ya upinzani ukihifadhiwa katika tanbihi.
- source_word: שָׂנֵאתָ
  choice: unachukia
  rationale: Qal perfect nafsi ya pili umoja wa kiume hapa inaeleza tabia inayomtambulisha anayesemeshwa; wakati wa sasa wa Kiswahili unaifikisha vizuri nguvu hiyo.
- source_word: מוּסָר
  choice: nidhamu
  rationale: Neno hili linahusu malezi yenye kusahihisha, maonyo, au mafundisho ya kurekebisha. “Nidhamu” huhifadhi wazo la urekebishaji wa tabia bila kulifanya kuwa mafundisho ya kawaida tu.
- source_word: וַתַּשְׁלֵךְ
  choice: unatupa
  rationale: Kitenzi שלך kina picha halisi ya kutupa au kurusha. “Unatupa” ni cha sasa, cha kawaida, na chenye nguvu katika Kiswahili, kikidokeza kitendo cha kuyakataa maneno.
- source_word: דְּבָרַי
  choice: maneno yangu
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya nomino ya wingi yenye kiambishi cha nafsi ya kwanza umoja; haiongezi kimakusudi maana ya amri au mafundisho.
- source_word: אַחֲרֶיךָ
  choice: nyuma yako
  rationale: Tafsiri ya moja kwa moja huhifadhi sitiari ya kuyatupa maneno yasibaki mbele ya mtu, yaani kuyapuuza au kuyakataa.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. Muundo unahifadhi usemi wa moja kwa moja na picha halisi ya kutupa maneno “nyuma yako.” Alama za tanbihi zimewekwa baada ya “nidhamu” kwa mpangilio unaolingana na rasimu ya Kiingereza iliyokaguliwa.
