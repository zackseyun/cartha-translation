  text: יָ֭דַעְתִּי כָּל ע֣וֹף הָרִ֑ים וְ/זִ֥יז שָׂ֝דַ֗י עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/011.yaml
  text: I know every bird of the mountains[b][a], and the creatures of the field are with me.
translation:
  language: sw
  text: 'Ninajua kila ndege wa milimani,

    na viumbe vya porini[a] viko pamoja nami.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vitu vinavyotembea vya porini” au “wanyama wa porini”; neno la Kiebrania זִיז lina maana isiyo hakika.
    reason: lexical_alternative
  - marker: b
    text: Au “ni vyangu”; kwa tafsiri ya karibu zaidi Kiebrania kinasema “viko pamoja nami.”
    reason: alternative_reading
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Ninamjua
  rationale: Kauli timilifu ya Kiebrania hapa inaeleza hali ya kudumu ya kujua; wakati wa sasa ni wa asili katika Kiswahili. Kiambishi cha ngeli katika “ninamjua” kinapatana na “kila ndege” na kusisitiza kila mmoja.
- source_word: כָּל עוֹף הָרִים
  choice: kila ndege wa milimani
  rationale: “Kila ndege” huwasilisha vizuri nguvu ya kugawa ya כָּל pamoja na nomino ya umoja ya kijumla. “Milimani” ni Kiswahili cha kawaida kwa mazingira ya milima yanayokusudiwa.
- source_word: וְזִיז שָׂדַי
  choice: na viumbe vya porini
  rationale: זִיז ni neno gumu linaloweza kumaanisha vitu vinavyotembea au wanyama wa eneo la wazi. “Viumbe” huepuka kubainisha kupita ushahidi, na “porini” huwakilisha שָׂדַי kwa kawaida katika muktadha huu wa mashairi.
- source_word: עִמָּדִי
  choice: viko pamoja nami
  rationale: Huhifadhi maana ya moja kwa moja ya ‘viko nami/pamoja nami’ badala ya kuifanya dhana ya umiliki iwe wazi kama ‘ni vyangu.’
theological_decisions:
- issue: Dhana ya umiliki wa Mungu katika עִמָּדִי
  choice: viko pamoja nami
  alternative: ni vyangu
  rationale: Ingawa muktadha unaweza kudokeza umiliki na mamlaka ya Mungu juu ya viumbe, Kiebrania kinasema kwa karibu zaidi ‘pamoja nami.’ Tafsiri inadumisha kauli hiyo na kuacha dokezo la umiliki litokane na muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini wazi kwa msomaji wa kawaida. Mistari miwili inadumisha usambamba wa Kiebrania; “porini” ni ya asili zaidi kuliko “wa shambani” kwa viumbe vya eneo la wazi.
