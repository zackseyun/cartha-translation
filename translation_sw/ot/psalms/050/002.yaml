  text: מִ/צִּיּ֥וֹן מִכְלַל יֹ֗פִי אֱלֹהִ֥ים הוֹפִֽיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/002.yaml
  text: From Zion[a], the perfection of beauty, God shines forth.
translation:
  language: sw
  text: Kutoka Sayuni[a], ukamilifu wa uzuri, Mungu anang’aa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kutoka Sayuni, ukamilifu wa uzuri, Mungu ameng’aa”; au “Kutoka Sayuni, kwa uzuri mkamilifu, Mungu anang’aa.”
    reason: Usomaji mwingine unawezekana kuhusu wakati wa kitenzi na iwapo “ukamilifu wa uzuri” inaielezea Sayuni au namna Mungu anavyong’aa.
lexical_decisions:
- source_word: מִ/צִּיּוֹן
  choice: Kutoka Sayuni
  rationale: Kihusishi מִן kinaonyesha chanzo au mahali ambapo kung’aa kwa Mungu kunatokea; “kutoka Sayuni” ni Kiswahili cha kawaida na chenye maana hiyo wazi.
- source_word: מִכְלַל
  choice: ukamilifu wa
  rationale: Katika muundo wake pamoja na יֹפִי, neno hili linaonyesha ukamilifu au utimilifu wa sifa fulani. “Ukamilifu wa” inadumisha uzito wa kishairi na uhusiano wake na “uzuri.”
- source_word: יֹפִי
  choice: uzuri
  rationale: Neno hili humaanisha uzuri au kupendeza. “Uzuri” ndilo neno la Kiswahili lililo wazi na la moja kwa moja zaidi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Kitenzi kinachofuata kiko katika umoja, hivyo אֱלֹהִים hapa humaanisha Mungu mmoja.
- source_word: הוֹפִיעַ
  choice: anang’aa
  rationale: Hiphil ya יפע huonyesha kung’aa au kujidhihirisha kwa mng’ao. “Anang’aa” inadumisha taswira ya nuru na matumizi ya wakati wa sasa yenye uhai katika ushairi, ingawa umbo la Kiebrania linaweza pia kutafsiriwa kwa wakati timilifu.
theological_decisions:
- issue: Uhusiano wa “ukamilifu wa uzuri” na Sayuni au Mungu
  choice: Kirai “ukamilifu wa uzuri” kimewekwa kama maelezo ya Sayuni.
  alternative: 'Kirai kinaweza kueleweka kama kielezi cha jinsi Mungu anavyong’aa: “kwa uzuri mkamilifu,” au kama maelezo yanayomhusu Mungu kwa karibu zaidi.'
  rationale: Mpangilio wa Kiebrania unaelekea zaidi kuweka kirai hiki baada ya Sayuni kama maelezo yake, lakini tanbihi inadumisha uwezekano mwingine wa kisarufi bila kuamua mvutano huo kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, ya kishairi na yenye heshima. “Anang’aa” ni ya kawaida kwa wasomaji wa sasa huku ikihifadhi taswira ya mng’ao wa maandishi ya Kiebrania.
