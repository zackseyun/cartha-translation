  text: For every wild animal of the forest is mine[b][a], the cattle on a thousand hills.
translation:
  language: sw
  text: 'Kwa maana kila mnyama wa msituni ni wangu,

    na mifugo iliyo kwenye milima elfu ni yangu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanyama wakubwa kwenye vilima elfu.” Neno la Kiebrania linaweza kumaanisha mifugo au wanyama wakubwa kwa ujumla, na neno linalotafsiriwa “milima” linaweza pia kutafsiriwa “vilima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya kauli iliyotangulia; “Kwa maana” ni cha asili na chenye hadhi katika muktadha huu.
- source_word: לִי
  choice: ni wangu
  rationale: Kirai hiki kinaonyesha umiliki; “ni wangu” ni Kiswahili cha kawaida kinachohifadhi madai ya Mungu ya kuwa mwenye wanyama hao.
- source_word: כָל
  choice: kila
  rationale: Kwa kuwa nomino inayofuata iko katika umoja, “kila” linaonyesha vizuri maana ya kugawa kwa mmoja mmoja.
- source_word: חַיְתוֹ יָעַר
  choice: mnyama wa msituni
  rationale: Kirai hiki kinamaanisha mnyama wa porini anayeishi msituni. “Mnyama wa msituni” ni wazi, cha sasa, na hakina ladha ya kizamani.
- source_word: בְּהֵמוֹת
  choice: mifugo
  rationale: Neno hili linaweza kumaanisha wanyama wakubwa au wanyama wa kufugwa. Katika ulinganifu na wanyama wa msituni, “mifugo” linaonyesha kwa kawaida kundi la wanyama wa kufugwa bila kulibana kwa ng’ombe pekee.
- source_word: בְּהַרְרֵי
  choice: kwenye milima
  rationale: Kihusishi kinaonyesha mahali, na הָר inaweza kuwa mlima au kilima. “Kwenye milima” ni usemi wa kawaida unaohifadhi picha ya Kiebrania.
- source_word: אָלֶף
  choice: elfu
  rationale: Namba imetafsiriwa moja kwa moja badala ya kufafanuliwa kuwa “isiyohesabika,” hivyo picha ya kishairi imehifadhiwa.
theological_decisions:
- issue: Upeo wa picha ya umiliki wa Mungu
  choice: Mstari unatangaza kwa picha ya kishairi kwamba Mungu ndiye mwenye wanyama wa porini na mifugo kwa wingi mkubwa.
  alternative: Kuelewa kuwa unazungumzia mifugo iliyo kwenye milima elfu moja kamili tu, au kubadili “elfu” kuwa “isiyohesabika.”
  rationale: Kutaja milima elfu kunahifadhi picha na nguvu ya kishairi ya chanzo bila kuifanya kuwa hesabu halisi wala kuondoa namba iliyotajwa.
- issue: Uhusiano wa vipashio viwili vya kishairi
  choice: “na” limetumiwa kuonyesha kwamba wanyama wa msituni na mifugo ni makundi mawili yanayomilikiwa na Mungu.
  alternative: Kuyaunganisha kwa koma pekee kama apposition, jambo linaloweza kufanya kundi la pili lionekane kana kwamba linafafanua la kwanza.
  rationale: Ingawa Kiebrania hakina kiunganishi kilichoandikwa hapa, mshororo wa pili unaendeleza dai la umiliki. Kiunganishi hicho kinakamilisha kwa uwazi kitenzi kinachoeleweka huku kikihifadhi usambamba wa kishairi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, wazi na yenye hadhi. Mpangilio wa mistari miwili umehifadhi usambamba wa kishairi, huku “na” likisaidia sentensi kusomeka kwa kawaida katika Kiswahili.
