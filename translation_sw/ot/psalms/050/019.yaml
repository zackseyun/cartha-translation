lexical_decisions:
- source_word: פִּיךָ
  choice: kinywa chako
  rationale: Neno halisi la kiungo cha mwili limetumiwa kwa maana ya usemi; ‘kinywa chako’ inadumisha taswira ya Kiebrania na ulinganifu wake na ‘ulimi wako.’
- source_word: שָׁלַחְתָּ
  choice: unakiachia … kinene
  rationale: Kitenzi hiki kwa msingi humaanisha ‘kutuma’ au ‘kuachilia’; katika muktadha huu kinaonyesha kukiacha kinywa kiseme maovu bila kukizuia. Muundo huu ni wa kawaida katika Kiswahili huku ukihifadhi taswira hai ya chanzo.
- source_word: בְרָעָה
  choice: maovu
  rationale: Hapa ב inaweza kuonyesha mwelekeo au eneo la tendo. ‘Maovu’ inadumisha maana pana ya uovu wa kimaadili, si madhara pekee.
- source_word: וּלְשׁוֹנְךָ
  choice: na … ulimi wako
  rationale: Tafsiri ya moja kwa moja inadumisha usambamba wa kishairi kati ya kinywa na ulimi.
- source_word: תַּצְמִיד
  choice: unaufungamanisha … na
  rationale: Hifili ya צמד ina maana ya kusababisha kitu kiambatane au kiungane na kingine. ‘Kufungamanisha’ inadumisha kitendo cha makusudi na taswira ya kuunganisha ulimi na udanganyifu.
- source_word: מִרְמָה
  choice: udanganyifu
  rationale: ‘Udanganyifu’ ni neno pana na la kawaida linalofaa kwa usemi wa uongo au hila katika muktadha huu wa kishairi.
