lexical_decisions:
- source_word: אִם
  choice: Uki-
  rationale: Kiambishi cha sharti “uki-” kinawasilisha moja kwa moja nguvu ya אִם katika shtaka hili la balagha.
- source_word: רָאִיתָ
  choice: -mwona
  rationale: Kitenzi cha nafsi ya pili umoja kimetafsiriwa kwa muundo wa kawaida wa Kiswahili; wakati wa sasa wa kimazoea unafaa kwa muktadha wa tabia inayoshutumiwa.
- source_word: גַנָּב
  choice: mwizi
  rationale: Hili ndilo neno la kawaida na sahihi kwa mtu anayeiba.
- source_word: וַתִּרֶץ
  choice: unafurahia kuwa pamoja naye
  rationale: Mzizi רצה hapa una wazo la kupendezwa, kukubali, au kuridhia. Tafsiri hii huhifadhi maana kuu ya kufurahia/kupendezwa bila kuifanya iwe tu tendo la kuandamana.
- source_word: עִמּוֹ
  choice: pamoja naye
  rationale: Huwakilisha kihusishi “pamoja na” na kiambishi cha nafsi ya tatu kiume kwa Kiswahili cha kawaida.
- source_word: וְעִם
  choice: na ... pamoja na
  rationale: Huunganisha kishazi cha pili na kudumisha uhusiano unaoonyeshwa na kihusishi cha Kiebrania.
- source_word: מְנָאֲפִים
  choice: wazinzi
  rationale: Neno hili hutaja kwa ufupi watu wanaofanya uzinzi, sawasawa na participle iliyotumiwa kama nomino.
- source_word: חֶלְקֶךָ
  choice: fungu lako ni
  rationale: “Fungu” huhifadhi sitiari ya Kiebrania ya sehemu au mgao, ambayo hapa inadokeza kujihusisha au kujipanga pamoja na kundi hilo.
