  text: 'Ukiona mwizi, unapendezwa naye,[a]

    na fungu lako ni pamoja na wazinzi.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “unamkubali” au “unaridhiana naye.” Kitenzi cha Kiebrania kinaweza kuonyesha kupendezwa, kukubali, au kuridhia.
