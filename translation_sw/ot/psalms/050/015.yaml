  text: וּ֭/קְרָאֵ/נִי בְּ/י֣וֹם צָרָ֑ה אֲ֝חַלֶּצְ/ךָ֗ וּֽ/תְכַבְּדֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/015.yaml
  text: And call on me in the day of distress; I will deliver you[a], and you will honor me.
translation:
  language: sw
  text: Nawe uniite siku ya dhiki; nitakuokoa, nawe utaniheshimu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utanitukuza.” Kitenzi cha Kiebrania kinaweza kumaanisha “kuheshimu” au “kutukuza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאֵנִי
  choice: Nawe uniite
  rationale: Kitenzi קרא pamoja na kiambishi cha yambwa hapa kina maana ya kumwitia Mungu ili kupata msaada. “Uniite” ni Kiswahili cha kawaida na huhifadhi mwito wa moja kwa moja.
- source_word: בְּיוֹם צָרָה
  choice: siku ya dhiki
  rationale: Kirai hiki ni usemi wa wakati unaomaanisha kipindi cha taabu au shida kubwa. “Siku ya dhiki” huhifadhi muundo wa kishairi na uzito wa צָרָה.
- source_word: אֲחַלֶּצְךָ
  choice: nitakuokoa
  rationale: Piel ya חלץ hapa humaanisha kumwokoa au kumkomboa mtu kutoka hatarini. “Nitakuokoa” ni ya asili na inaeleweka wazi katika Kiswahili cha sasa.
- source_word: וּתְכַבְּדֵנִי
  choice: nawe utaniheshimu
  rationale: Piel ya כבד inaweza kumaanisha kuheshimu au kutukuza. “Utaniheshimu” huhifadhi maana pana ya kumpa Mungu heshima inayomstahili bila kuifanya kauli iwe ya kiliturujia kuliko ilivyo lazima.
theological_decisions:
- issue: Mwitikio wa mwanadamu baada ya kuokolewa na Mungu
  choice: nawe utaniheshimu
  alternative: nawe utanitukuza
  rationale: Kiebrania kinaonyesha kwamba aliyeokolewa atampa Mungu heshima inayomstahili. “Utaniheshimu” huhifadhi maana hiyo pana, huku “utanitukuza” pia ikiwa tafsiri halali ya kitenzi hicho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. “Dhiki” ni neno la kawaida katika muktadha wa taabu kubwa, na urudiaji wa “nawe” huonyesha mwendelezo na uwiano wa mistari ya Kiebrania.
