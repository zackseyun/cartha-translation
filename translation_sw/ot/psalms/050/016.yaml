  yaml_path: translation/ot/psalms/050/016.yaml
  text: But to the wicked God says[b][a], “What right do you have to recount my statutes and to take my covenant on your lips?”
translation:
  language: sw
  text: Lakini Mungu anamwambia mwovu, “Una haki gani kuzitangaza sheria zangu na kulitamka agano langu kwa kinywa chako?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya neno kwa neno zaidi: “na kulichukua agano langu juu ya kinywa chako.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָרָשָׁע
  choice: Lakini ... mwovu
  rationale: Kiunganishi kina nguvu ya kulinganisha kwa ukinzani na maneno yaliyotangulia; רָשָׁע ni mtu mwovu kimaadili, si tu mwenye hatia kisheria.
- source_word: אָמַר אֱלֹהִים
  choice: Mungu anamwambia
  rationale: Ingawa kitenzi cha Kiebrania kina umbo la wakati uliotimia, katika utangulizi wa usemi wa moja kwa moja wa kishairi kinaweza kuwasilishwa kwa wakati wa sasa ili kudumisha uhai wa tamko.
- source_word: מַה לְּךָ
  choice: Una haki gani
  rationale: Nahau hii ni changamoto kuhusu uhalali au ustahili wa mwovu kufanya jambo hilo, wala si swali la kawaida la kutaka habari.
- source_word: לְסַפֵּר
  choice: kuyasimulia
  rationale: Kitenzi kina maana ya kutaja, kutangaza, au kukariri masharti ya Mungu; ‘kuyasimulia’ ni cha kawaida na bado huhifadhi wazo la kuyatamka.
- source_word: חֻקָּי
  choice: masharti yangu
  rationale: חֹק hurejelea maagizo au sheria zilizowekwa. ‘Masharti’ ni Kiswahili cha sasa kinachoeleweka na kinadumisha muktadha wa agano.
- source_word: וַתִּשָּׂא
  choice: na kulitaja
  rationale: Maana halisi ni ‘kuinua/kubeba,’ lakini pamoja na agano kuwa juu ya kinywa humaanisha kulitia katika usemi; ‘kulitaja’ huwasilisha nahau hiyo kwa Kiswahili asilia.
- source_word: בְרִיתִי
  choice: agano langu
  rationale: ‘Agano’ ni istilahi ya kawaida ya Kibiblia kwa בְּרִית na huhifadhi uzito wake wa uhusiano na wajibu.
- source_word: עֲלֵי פִיךָ
  choice: kwa kinywa chako
  rationale: Kiebrania ni ‘juu ya kinywa chako.’ Kiswahili ‘kwa kinywa chako’ huhifadhi taswira ya usemi bila kuwa ngumu isivyo kawaida.
theological_decisions:
- issue: Asili ya karipio kwa mwovu
  choice: Maneno haya yanapinga haki au ustahili wa mwovu kutamka masharti na agano la Mungu huku maisha yake yakipingana nayo.
  alternative: Kuyachukulia kama marufuku kamili kwa mwovu kutaja agano la Mungu kwa namna yoyote.
  rationale: Nahau מַה לְּךָ inahoji madai au uhalali wa mtu huyo na hivyo hukazia unafiki na kutolingana na agano, bila kupanua mstari kuwa marufuku ya kila aina ya kumtaja Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Una haki gani’ huweka wazi nguvu ya karipio; tanbihi huhifadhi taswira halisi ya Kiebrania katika sehemu ya pili.
