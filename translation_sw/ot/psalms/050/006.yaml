  text: וַ/יַּגִּ֣ידוּ שָׁמַ֣יִם צִדְק֑/וֹ כִּֽי אֱלֹהִ֓ים שֹׁפֵ֖ט ה֣וּא סֶֽלָה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/006.yaml
  text: And the heavens declare his righteousness[a], for God himself is judge. Selah
translation:
  language: sw
  text: Mbingu zinatangaza haki yake[a], kwa maana Mungu mwenyewe ndiye mwamuzi. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uadilifu wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּידוּ
  choice: zinatangaza
  rationale: Hifili ya נגד ina maana ya kufanya jambo lijulikane hadharani; “zinatangaza” ni ya asili katika Kiswahili na inadumisha sauti ya kishairi na ya hadhara.
- source_word: שָׁמַיִם
  choice: Mbingu
  rationale: Neno la Kiebrania lina umbo la wingi lakini hutumika kama jina la jumla; “mbingu” ni tafsiri ya kawaida na yenye hadhi katika ushairi wa kibiblia.
- source_word: צִדְקוֹ
  choice: haki yake
  rationale: צדק inaweza kumaanisha uadilifu wa kimaadili au haki katika hukumu. “Haki yake” ni pana vya kutosha kuhusisha yote mawili, huku tanbihi ikihifadhi uwezekano wa “uadilifu wake.”
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inatoa msingi wa tangazo la mbingu; “kwa maana” inaonyesha uhusiano huo wa sababu kwa lugha ya asili na yenye hadhi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la neno ni la wingi, kitenzi-jina na kiwakilishi vinaonyesha wazi maana ya umoja.
- source_word: שֹׁפֵט
  choice: mwamuzi
  rationale: Kishirikishi hiki kinatumika kama kiarifu cha jina; “mwamuzi” huhifadhi maana ya cheo au jukumu badala ya kukifanya moja kwa moja kuwa kitenzi “anahukumu.”
- source_word: הוּא
  choice: mwenyewe ndiye
  rationale: Kiwakilishi huru kinasisitiza mhusika. “Mungu mwenyewe ndiye mwamuzi” huwasilisha mkazo huo kwa Kiswahili cha kawaida bila kuongeza maana nyingine.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya alama hii ya kiliturujia au kimuziki haijulikani; kwa hiyo imetoholewa badala ya kutafsiriwa kwa uhakika usiokuwapo.
theological_decisions:
- issue: Maana ya צדק kuhusiana na Mungu kama mwamuzi
  choice: haki yake
  alternative: uadilifu wake
  rationale: “Haki” katika Kiswahili inaweza kueleza unyofu wa Mungu na kutenda kwake kwa haki katika hukumu. “Uadilifu” ni uwezekano halali unaosisitiza zaidi tabia ya kimaadili, kwa hiyo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Mwenyewe ndiye” hudumisha mkazo wa Kiebrania, na “Sela” imehifadhiwa kama alama isiyo na maana kamili inayojulikana.
