  text: אִם אֶ֭רְעַב לֹא אֹ֣מַר לָ֑/ךְ כִּי לִ֥/י תֵ֝בֵ֗ל וּ/מְלֹאָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/012.yaml
  text: If I were hungry[a], I would not tell you, for the world and its fullness are mine.
translation:
  language: sw
  text: Kama ningekuwa na njaa, nisingekuambia, kwa maana ulimwengu na vyote vilivyomo ni vyangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם אֶרְעַב
  choice: Kama ningekuwa na njaa
  rationale: Muundo wa sharti unaeleza hali ya kudhaniwa katika hoja ya balagha; Kiswahili cha masharti kwa ‘kama’ na ‘ningekuwa’ kinahifadhi maana hiyo kwa lugha ya kawaida.
- source_word: לֹא אֹמַר לָךְ
  choice: nisingekuambia
  rationale: אמר pamoja na mtendewa hapa ina maana ya kumwambia mtu; umbo la ‘nisinge-’ linaendana na sharti la kudhaniwa katika kishazi cha kwanza.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya kauli iliyotangulia; ‘kwa maana’ ni cha asili na chenye hadhi katika muktadha huu.
- source_word: לִי
  choice: ni vyangu
  rationale: Kirai hiki kinaonyesha umiliki; umbo la wingi linaendana kwa kawaida na ‘ulimwengu na vyote vilivyomo.’
- source_word: תֵבֵל
  choice: ulimwengu
  rationale: Neno hili humaanisha ulimwengu, hasa dunia inayokaliwa; ‘ulimwengu’ ni tafsiri pana, ya kawaida, na inayofaa kishairi.
- source_word: וּמְלֹאָהּ
  choice: na vyote vilivyomo
  rationale: Neno linamaanisha ujazo wake au kila kinachoujaza. ‘Vyote vilivyomo’ linaeleza nahau hiyo kwa Kiswahili cha sasa bila kupunguza upeo wake.
theological_decisions:
- issue: Kujitosheleza kwa Mungu katika muktadha wa dhabihu
  choice: Sharti la balagha limetafsiriwa kama hali ya kudhaniwa, likisisitiza kwamba Mungu hategemei wanadamu wampatie chakula.
  alternative: 'Tafsiri ya moja kwa moja zaidi: ‘Kama nina njaa, sitakuambia.’'
  rationale: Muktadha unaonyesha kuwa Mungu hahitaji dhabihu ili apate chakula. Tafsiri hii huhifadhi hoja hiyo bila kuongeza istilahi za kifalsafa zisizomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Vyote vilivyomo’ kimetumiwa badala ya ‘ujazo wake’ kwa sababu ni wazi na asili zaidi kwa msomaji wa kawaida huku kikihifadhi maana ya מְלֹאָהּ.
