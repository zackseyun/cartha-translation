  text: בִּֽינוּ נָ֣א זֹ֭את שֹׁכְחֵ֣י אֱל֑וֹהַּ פֶּן אֶ֝טְרֹ֗ף וְ/אֵ֣ין מַצִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/022.yaml
  text: Understand this[a], please, you who forget God, lest I tear you apart, and there be no one to rescue.
translation:
  language: sw
  text: Fahamuni jambo hili, tafadhali, enyi mnaomsahau Mungu, nisije nikawararua vipande-vipande[a], wala asiwepo wa kuwaokoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “nisije nikararua, wala asiwepo mwokoaji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּינוּ
  choice: Fahamuni
  rationale: Ni amri ya wingi kutoka בין, inayowataka wasikilizaji watambue na kuelewa kwa makini. “Fahamuni” ni ya moja kwa moja na ya kawaida katika Kiswahili sanifu.
- source_word: נָא
  choice: tafadhali
  rationale: Chembe hii huongeza msisitizo wa ombi au himizo. “Tafadhali” inadumisha sauti hiyo bila kuifanya kuwa kiashirio cha wakati.
- source_word: זֹאת
  choice: jambo hili
  rationale: Kiwakilishi hiki hurejelea onyo lililotangulia. Kuongeza “jambo” kunafanya usemi uwe wa kawaida katika Kiswahili bila kufafanua onyo lenyewe kupita kiasi.
- source_word: שֹׁכְחֵי אֱלוֹהַּ
  choice: enyi mnaomsahau Mungu
  rationale: Kirai cha kisifa kinatumika kama mwito kwa wale wanaomsahau Mungu. “Enyi” huonyesha mwito huo kwa lugha yenye hadhi na iliyo wazi.
- source_word: פֶּן
  choice: nisije
  rationale: Huanzisha tokeo baya linaloonya. Muundo wa Kiswahili “nisije” huwasilisha kwa kawaida maana ya ‘asije nikafanya’ katika kauli ya nafsi ya kwanza.
- source_word: אֶטְרֹף
  choice: nikawararua vipande-vipande
  rationale: Kitenzi טרף kina taswira kali ya mnyama anayerarua mawindo. Tafsiri hii inadumisha ukali wa taswira; yambwa “wa-” linaeleweka kutokana na wale wanaoonywa.
- source_word: וְאֵין מַצִּיל
  choice: wala asiwepo wa kuwaokoa
  rationale: Kanusho la uwepo pamoja na kisifa cha Hifili cha נצל linaonyesha kwamba hakutakuwa na mwokoaji. “Wa kuwaokoa” ni usemi wa sasa na wa kawaida unaodumisha wazo la uokoaji.
theological_decisions:
- issue: Taswira ya hukumu ya Mungu katika אֶטְרֹף
  choice: 'Kudumisha sitiari ya kurarua moja kwa moja: “nikawararua vipande-vipande.”'
  alternative: Kulainisha kuwa “nikawaangamiza” au “nikawashika.”
  rationale: Kiebrania kinatumia taswira dhahiri na kali ya kurarua mawindo. Kuilainisha kungepunguza uzito wa onyo na kuingiza ufafanuzi usiotolewa na matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mwito “enyi” unafaa kwa onyo rasmi la kimungu, huku “fahamuni” na “kuwaokoa” vikibaki wazi kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa kwenye kirai ambacho mbadala wake unafafanuliwa.
