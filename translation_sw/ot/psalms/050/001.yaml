base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/001.yaml
  text: A psalm of Asaph. The Mighty One[a], God, Yahweh, has spoken and called the earth from the rising of the sun to its setting.
translation:
  language: sw
  text: 'Zaburi ya Asafu.


    Mwenye Nguvu, Mungu, Yahwe, amesema,


    akaiita dunia,


    kutoka kuchomoza kwa jua hadi kutua kwake.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Mungu, Mungu, Yahwe”; wengine huelewa majina haya ya mwanzo kwa namna tofauti, kutia ndani: “Mungu wa miungu, Yahwe.”'
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Neno la kawaida la kichwa cha zaburi; ‘Zaburi’ ni jina la utanzu lililozoeleka na sahihi katika Kiswahili.
- source_word: לְאָסָף
  choice: ya Asafu
  rationale: Kiambishi לְ katika vichwa vya zaburi kinaweza kuonyesha uandishi, uhusiano, au mkusanyo. ‘Ya Asafu’ ni fupi na ya kawaida huku ikiacha uhusiano huo bila kuufafanua kupita kiasi.
- source_word: אֵל
  choice: Mwenye Nguvu
  rationale: Hutofautisha אֵל na אֱלֹהִים katika mfuatano wa majina matatu ya Mungu na kuhifadhi wazo la uwezo bila kuyafanya yote kuwa ‘Mungu’.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Jina Yahwe na vitenzi vya umoja vinaonyesha kuwa anayerejelewa ni Mungu wa Israeli, si miungu mingi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Unukuzi wa jina binafsi la Mungu katika Kiswahili, badala ya kulibadilisha kuwa cheo ‘BWANA’.
- source_word: דִּבֶּר
  choice: amesema
  rationale: Kauli timilifu ya Kiebrania inaonyesha tendo lililotimia lenye umuhimu wa sasa; ‘amesema’ linafaa kwa tangazo hili zito.
- source_word: וַיִּקְרָא
  choice: naye ameiita
  rationale: Huendeleza tendo kutoka kusema hadi kuita; ‘ameiita’ hudumisha uwezekano wa mwito au kuitisha bila kuongeza maelezo ya kimahakama yasiyotajwa wazi.
- source_word: אָרֶץ
  choice: dunia
  rationale: Muktadha wa kutoka kuchomoza kwa jua hadi kutua kwake unaonyesha upeo wa ulimwengu mzima, si nchi moja tu.
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: tangu jua linapochomoza
  rationale: Huhifadhi taswira ya kishairi ya kuchomoza kwa jua kwa Kiswahili cha kawaida.
- source_word: עַד מְבֹאוֹ
  choice: hadi linapotua
  rationale: Kiambishi cha nafsi kinarejelea jua; tafsiri hii ni ya asili na huhifadhi taswira ya mipaka yote miwili.
theological_decisions:
- issue: Tafsiri ya mfuatano wa majina ya Mungu אֵל אֱלֹהִים יְהוָה
  choice: Mwenye Nguvu, Mungu, Yahwe
  alternative: Mungu, Mungu, Yahwe; au Mungu wa miungu, Yahwe
  rationale: Kiebrania kina majina matatu ya Mungu yaliyofuatana. Kutafsiri אֵל kwa namna tofauti huhifadhi uzito wa balagha na maana yake ya nguvu. Muundo unaweza kueleweka kwa njia nyingine, kwa hiyo njia hizo zimeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mistari imepangwa ili kudumisha mwendo wa kishairi. ‘Yahwe’ limetumiwa kwa jina יהוה, na ‘Asafu’ ni umbo lililozoeleka katika Biblia za Kiswahili.
