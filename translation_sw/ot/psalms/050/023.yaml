  yaml_path: translation/ot/psalms/050/023.yaml
  text: Whoever offers a sacrifice of thanksgiving honors me[c][b][a], and to the one who orders his way I will show the salvation of God.
translation:
  language: sw
  text: Anayetoa dhabihu ya shukrani[a] ananiheshimu; na yule anayeiweka sawa njia yake[b], nitamwonyesha wokovu wa Mungu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya shukrani.” Neno la Kiebrania תּוֹדָה katika muktadha huu hurejelea shukrani inayotolewa kwa njia ya dhabihu.
    reason: lexical_alternative
  - marker: b
    text: Au, “anayepanga mwenendo wake sawasawa”; pia inawezekana, “anayetayarisha njia.” Usemi wa Kiebrania ni mfupi na unaweza kueleweka kwa namna zaidi ya moja.
    reason: alternative_reading
  - marker: c
    text: Au, “ukombozi wa Mungu” au “ushindi wa Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹבֵחַ
  choice: Anayetoa dhabihu
  rationale: Kirai cha Kiebrania ni kitenzi shiriki cha Qal kinachotumiwa kama nomino ya mtu; Kiswahili cha kawaida hukieleza kwa muundo wa ‘anayetoa’. ‘Dhabihu’ hudumisha muktadha wa ibada.
- source_word: תּוֹדָה
  choice: ya shukrani
  rationale: Katika muktadha huu neno hilo linaonyesha shukrani inayotolewa kwa namna ya dhabihu, si maneno ya kushukuru pekee.
- source_word: יְכַבְּדָנְנִי
  choice: ananiheshimu
  rationale: Piel ya כבד hapa ina maana ya kumpa heshima au kumtukuza; ‘ananiheshimu’ ni wazi, ya sasa, na ya kawaida katika Kiswahili.
- source_word: וְשָׂם דֶּרֶךְ
  choice: naye anayeiweka sawa njia yake
  rationale: Kiebrania ni kifupi na kinaweza kufasiriwa kwa namna kadhaa. Tafsiri hii inadumisha taswira ya ‘njia’ huku ikielekeza kwenye kuyapanga mwenendo wa maisha kwa usahihi.
- source_word: אַרְאֶנּוּ
  choice: nitamwonyesha
  rationale: Hiphil ya ראה pamoja na kiambishi cha nafsi ya tatu umoja ina maana ya ‘nitamfanya aone’ au kwa Kiswahili cha kawaida, ‘nitamwonyesha’.
- source_word: בְּיֵשַׁע אֱלֹהִים
  choice: wokovu wa Mungu
  rationale: יֵשַׁע linaweza kumaanisha wokovu, ukombozi, au ushindi. ‘Wokovu wa Mungu’ hudumisha usemi wa Kiebrania na inafaa katika muktadha wa zaburi.
theological_decisions:
- issue: Maana ya וְשָׂם דֶּרֶךְ katika sehemu ya pili
  choice: Ahadi inaelekezwa kwa mtu anayeiweka sawa njia yake, yaani mwenendo wake.
  alternative: ‘Anayetayarisha njia’ au kwa karibu zaidi ‘anayeweka njia’.
  rationale: Muundo wa Kiebrania ni mshikamano na una utata halisi. Maana ya mwenendo uliopangwa vizuri inafaa muktadha wa zaburi, lakini tanbihi inahifadhi uwezekano wa kusoma kuwa ni kuitayarisha njia.
- issue: Maana ya יֵשַׁע אֱלֹהִים
  choice: wokovu wa Mungu
  alternative: ukombozi wa Mungu; ushindi wa Mungu
  rationale: ‘Wokovu’ ni tafsiri pana na ya asili katika Kiswahili, bila kufuta maana zinazowezekana za kuokolewa au kupewa ushindi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo sambamba wa mstari umehifadhiwa, pamoja na taswira ya ‘njia’; tanbihi zinaonyesha utata wa Kiebrania bila kuubana katika fundisho maalumu la dhehebu.
