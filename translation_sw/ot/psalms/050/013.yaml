  text: Je, ninakula nyama ya mafahali, au nakunywa damu ya mbuzi dume?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאוֹכַל
  choice: Je, mimi hula
  rationale: Kiulizi הֲ pamoja na kitenzi cha nafsi ya kwanza kinaanzisha swali la balagha. Muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: בְּשַׂר
  choice: nyama ya
  rationale: Ingawa neno linaweza kutafsiriwa ‘mwili,’ katika muktadha wa wanyama wa dhabihu ‘nyama’ ni Kiswahili cha kawaida na huhifadhi taswira halisi ya kula.
- source_word: אַבִּירִים
  choice: mafahali
  rationale: Neno hilo kimsingi lina wazo la walio hodari au wenye nguvu, lakini hapa muktadha wa dhabihu na ulinganifu na mbuzi dume unaonyesha ng’ombe dume.
- source_word: וְדַם
  choice: au ... damu
  rationale: וְ kwa kawaida ni ‘na,’ lakini katika swali hili lenye vitendo viwili sambamba, ‘au’ huwasilisha kwa kawaida uhusiano wa vipashio bila kubadili maana.
- source_word: עַתּוּדִים
  choice: mbuzi dume
  rationale: Neno hili humaanisha mbuzi wa kiume, hasa katika muktadha wa dhabihu. ‘Mbuzi dume’ ni sahihi na linaeleweka kwa upana kuliko istilahi za kikanda.
- source_word: אֶשְׁתֶּה
  choice: hunywa
  rationale: Kitenzi kinaendeleza swali lilelile la balagha katika nafsi ya kwanza; ‘hunywa’ kinalingana kiasili na ‘hula.’
theological_decisions:
- issue: Lugha ya dhabihu inayomwelezea Mungu kwa mfano wa kibinadamu
  choice: Kuhifadhi swali halisi kuhusu kula nyama na kunywa damu
  alternative: Kulifafanua kwa jumla kama ‘Je, ninahitaji dhabihu zenu?’
  rationale: Kiebrania kinatumia taswira dhahiri ya ibada ili kukataa wazo kwamba Mungu hutegemea dhabihu kama chakula au kinywaji. Tafsiri haipaswi kulainisha mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Je’ huonyesha wazi swali la balagha, na msamiati wa wanyama unabaki wa kawaida na sahihi.
