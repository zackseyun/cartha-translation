  text: 'He calls to the heavens above and to the earth[a], that he may judge his people:'
translation:
  language: sw
  text: 'Anaita mbingu zilizo juu na dunia[a], ili awahukumu watu wake:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Anazitia wito mbingu zilizo juu na dunia.” Kitenzi kinaweza kuwa na maana ya kuita kwa wito rasmi, hasa katika muktadha wa hukumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרָא
  choice: Anaziita
  rationale: Qal isiyotimilifu ya קרא inaweza kumaanisha ‘kuita’ au ‘kuitisha.’ ‘Anaziita’ ni Kiswahili cha kawaida kinachohifadhi tendo hilo wazi bila kulifanya moja kwa moja kuwa wito rasmi wa kimahakama.
- source_word: אֶל הַשָּׁמַיִם מֵעָל
  choice: mbingu zilizo juu
  rationale: אֶל inaelekeza wito kwa mbingu, na מֵעָל hutumika hapa kueleza mahali pake, yaani ‘zilizo juu.’ ‘Mbingu’ huhifadhi upana na hadhi ya kishairi ya שׁמים.
- source_word: וְאֶל הָאָרֶץ
  choice: na dunia
  rationale: Katika ulinganifu na mbingu, הָאָרֶץ ina maana ya dunia nzima, si nchi fulani. Kiunganishi na kihusishi vinawasilishwa kwa ‘na,’ kwa kuwa kitenzi ‘anaziita’ kinatawala nomino zote mbili kwa kawaida katika Kiswahili.
- source_word: לָדִין
  choice: ili awahukumu
  rationale: Infinitivu yenye ל inaonyesha kusudi. ‘Ili awahukumu’ huweka wazi uhusiano huo wa kusudi na pia upatanisho wa kawaida wa Kiswahili kwa watu.
- source_word: עַמּוֹ
  choice: watu wake
  rationale: עם katika muktadha huu wa uhusiano wa agano humaanisha ‘watu’; kiambishi cha umilikaji kinaonyeshwa kwa ‘wake.’
theological_decisions:
- issue: Utambulisho wa mtenda asiyeelezwa kwa jina
  choice: Kiambishi cha nafsi katika ‘anaziita’ na ‘awahukumu’ kinabaki kumrejelea yeye bila kuongeza jina ‘Mungu.’
  alternative: Kusema wazi ‘Mungu anaziita…’
  rationale: Kiebrania kina kitenzi cha nafsi ya tatu umoja wa kiume bila nomino ya mtenda katika aya hii. Kutotaja ‘Mungu’ moja kwa moja kunahifadhi mtiririko wa matini na kuepuka kuongeza jina ambalo aya yenyewe haijataja.
- issue: Kazi ya mbingu na dunia katika tukio la hukumu
  choice: Matini inasema kuwa anaziita, bila kueleza wazi kuwa ni mashahidi wa kimahakama.
  alternative: Kutafsiri ‘anaz召召召’ kama kuziita rasmi ziwe mashahidi
  rationale: Muktadha una ladha ya kimahakama, lakini aya yenyewe haisemi moja kwa moja ‘mashahidi.’ Tafsiri kuu inahifadhi kutokubainika huko; tanbihi inaonyesha maana mbadala ya kuitisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Mbingu zilizo juu na dunia’ huhifadhi jozi ya ulimwengu mzima; ‘ili awahukumu watu wake’ ni ya kawaida na inaonyesha kusudi la Kiebrania.
