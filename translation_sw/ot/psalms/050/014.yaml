base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/014.yaml
  text: Offer to God a sacrifice of thanksgiving[a], and fulfill your vows to the Most High.
translation:
  language: sw
  text: Mtolee Mungu dhabihu ya shukrani[a], na utimize nadhiri zako kwa Aliye Juu Sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtolee Mungu shukrani kama dhabihu”; neno la Kiebrania linaweza kumaanisha “shukrani” au “dhabihu ya shukrani” katika muktadha huu wa dhabihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבַח
  choice: Mtolee
  rationale: Kitenzi cha amri chenye maana ya kutoa dhabihu. Muundo “mtolee” ni wa kawaida katika Kiswahili na unaonyesha kwamba Mungu ndiye anayepokea dhabihu.
- source_word: לֵאלֹהִים
  choice: Mungu
  rationale: Kiambishi ל־ kinaonyesha anayepokea tendo; maana yake imejumuishwa kiasili katika kitenzi “mtolee.”
- source_word: תּוֹדָה
  choice: dhabihu ya shukrani
  rationale: Neno hili linaweza kumaanisha shukrani au sadaka ya shukrani. Tafsiri hii inadumisha kwa pamoja wazo la ibada ya dhabihu na tendo la kushukuru bila kulifanya kuwa istilahi finyu mno.
- source_word: וְשַׁלֵּם
  choice: na utimize
  rationale: Katika muktadha wa nadhiri, שלם humaanisha kutekeleza au kutimiza wajibu ulioahidiwa. “Utimize” ni Kiswahili cha kawaida na chenye uzito unaofaa.
- source_word: לְעֶלְיוֹן
  choice: kwa Aliye Juu Zaidi
  rationale: עֶלְיוֹן ni cheo cha Mungu kinachomaanisha aliye juu kabisa. “Aliye Juu Zaidi” hutafsiri maana ya cheo hicho badala ya kukinakili kama jina.
- source_word: נְדָרֶיךָ
  choice: nadhiri zako
  rationale: Nomino ya wingi yenye kiambishi cha nafsi ya pili ya kiume umoja; “nadhiri zako” ni tafsiri ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Usemi wa kiibada unaounganisha זבח na תודה
  choice: dhabihu ya shukrani
  alternative: shukrani kama dhabihu; sadaka ya shukrani
  rationale: Kiebrania kinaweza kueleweka kama shukrani inayotolewa kidhabihu au kama sadaka maalumu ya shukrani. Tafsiri kuu inahifadhi pande zote kwa kadiri inayowezekana, na tanbihi inaonyesha utata halisi.
- issue: Cheo cha Mungu עֶלְיוֹן
  choice: Aliye Juu Zaidi
  alternative: Elyoni
  rationale: Kutafsiri cheo hiki kunawasilisha maana yake wazi kwa msomaji wa kawaida bila kukigeuza kuwa jina lisiloeleweka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi inayofaa Zaburi. Umoja wa anayeambiwa umehifadhiwa katika “mtolee,” “utimize,” na “zako.”
