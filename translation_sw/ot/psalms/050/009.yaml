lexical_decisions:
- source_word: אֶקַּח
  choice: Sitachukua
  rationale: Kitenzi cha Qal imperfect nafsi ya kwanza umoja pamoja na לֹא kinaonyesha tangazo la Mungu la kutofanya tendo hilo; wakati ujao ni wa asili katika Kiswahili hapa.
- source_word: מִבֵּיתְךָ
  choice: kutoka nyumbani mwako
  rationale: בַּיִת hapa ina maana halisi ya nyumba au eneo la mali ya mwabudu, si watu wa familia yake.
- source_word: פָר
  choice: fahali
  rationale: Neno hili humaanisha ng'ombe dume, hasa katika muktadha wa dhabihu; “fahali” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: מִמִּכְלְאֹתֶיךָ
  choice: kutoka mazizi yako
  rationale: מִכְלָאָה ni eneo lililozungushiwa kwa ajili ya mifugo; “mazizi” ni neno la kawaida na linaloeleweka katika muktadha huu.
- source_word: עַתּוּדִים
  choice: beberu
  rationale: Neno la Kiebrania humaanisha mbuzi dume; “beberu” huhifadhi kwa usahihi jinsia ya wanyama hao bila kuhitaji tanbihi.
