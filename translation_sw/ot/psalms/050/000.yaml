  yaml_path: translation/ot/psalms/050/000.yaml
  text: A psalm of Asaph. God[a], God, Yahweh, has spoken and called the earth from the rising of the sun to its setting.
translation:
  language: sw
  text: Zaburi ya Asafu. Mungu[a], Mungu, YHWH, amezungumza, naye ameiita dunia, kutoka mawio ya jua hadi machweo yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu, Mungu, BWANA”; wengine huelewa majina haya ya mwanzo kwa njia tofauti, kutia ndani, “Mungu wa miungu, YHWH.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: Zaburi ya Asafu
  rationale: Muundo huu wa kawaida na wa asili katika Kiswahili huhifadhi maana ya kichwa cha Kiebrania bila kuamua kama Asafu ndiye mtunzi, mpokeaji, au mhusika mwingine anayehusishwa na zaburi.
- source_word: אֵל אֱלֹהִים יְהוָה
  choice: Mungu, Mungu, YHWH
  rationale: Huhifadhi mfuatano wa majina matatu ya kimungu na mvutano wake wa kisarufi badala ya kuyafanya kimya kimya kuwa usemi mmoja kama ‘Mungu wa miungu.’ Jina la agano limetolewa kama YHWH.
- source_word: וַיִּקְרָא אָרֶץ
  choice: na kuiita dunia
  rationale: ‘Kuiita’ huakisi kitenzi קרא na hapa ina maana ya kuit召/kuikusanya dunia ili isikilize, huku ‘dunia’ ikihifadhi uwezekano wa kurejelea nchi yote au wakaaji wake.
- source_word: מִמִּזְרַח שֶׁמֶשׁ עַד מְבוֹאוֹ
  choice: tangu mahali jua linapochomoza mpaka linapozama
  rationale: Usemi wa Kiswahili unaoeleweka unaonyesha upeo wa mashariki hadi magharibi na kuhifadhi taswira ya kuchomoza na kuzama kwa jua.
theological_decisions:
- issue: Uhusiano wa majina ya kimungu אֵל אֱלֹהִים יְהוָה
  choice: Mungu, Mungu, YHWH
  alternative: Mungu wa miungu, YHWH
  rationale: Kiebrania kinaweza kueleweka kwa njia zaidi ya moja. Matini kuu inafuata kwa karibu mfuatano wa maneno, na tanbihi inataja tafsiri kuu mbadala bila kuondoa utata halisi.
- issue: Uwakilishaji wa tetragramatoni יהוה
  choice: YHWH
  alternative: BWANA
  rationale: YHWH huhifadhi jina binafsi lililo katika matini ya Kiebrania na kulitofautisha na cheo ‘Bwana.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa heshima, wazi, na wa sasa. Kichwa na sentensi kuu zimetenganishwa kwa uakifishaji wa kawaida, na utata wa majina ya kimungu umehifadhiwa kwa tanbihi.
