base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/003.yaml
  text: Our God comes and does not keep silent[a]; a fire devours before him[b], and around him it storms violently.
translation:
  language: sw
  text: Mungu wetu anakuja, naye hakai kimya[a]; moto unateketeza mbele yake, na dhoruba kali sana inavuma kumzunguka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu wetu atakuja, wala hatakaa kimya.” Miundo ya vitenzi vya Kiebrania inaweza kueleweka kuwa ya wakati ujao katika muktadha huu wa kishairi.
    reason: alternative_reading
  - marker: b
    text: Au, “na kumzunguka kuna tufani kali sana,” au “kumzunguka kuna hali ya tufani kali mno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֹא
  choice: anakuja
  rationale: Kauli ya Kiebrania yaweza kuwa ya sasa au ya wakati ujao katika ushairi. Wakati wa sasa unadumisha uhai na ukaribu wa tukio la Mungu kujidhihirisha.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Hii ni tafsiri ya moja kwa moja ya nomino yenye kiambishi cha nafsi ya kwanza wingi.
- source_word: וְאַל יֶחֱרַשׁ
  choice: naye hakai kimya
  rationale: Muktadha unaunga mkono tamko linaloandamana na kuja kwake. ‘Hakai kimya’ ni Kiswahili cha kawaida kinachohifadhi maana ya kutonyamaza bila kuifanya kuwa amri.
- source_word: אֵשׁ ... תֹאכֵל
  choice: moto unateketeza
  rationale: Kitenzi אכל kinapotumiwa kuhusu moto humaanisha kuteketeza au kuunguza kabisa; ‘unateketeza’ ni cha asili na chenye nguvu.
- source_word: לְפָנָיו
  choice: mbele zake
  rationale: Hudumisha taswira ya mahali ya moto kutangulia mbele ya Mungu kwa lugha ya heshima na ya kawaida.
- source_word: וּסְבִיבָיו נִשְׂעֲרָה מְאֹד
  choice: na dhoruba kali sana inavuma kumzunguka
  rationale: Kitenzi cha Nifali kinaonyesha hali ya tufani au kuvuma kwa nguvu. Kiswahili huhitaji kiima kilicho wazi zaidi, hivyo ‘dhoruba’ kinawekwa wazi bila kubadili taswira; מְאֹד imetafsiriwa ‘kali sana’.
theological_decisions:
- issue: Tukio la Mungu kujidhihirisha katika hukumu
  choice: Taswira imeachwa kuwa maelezo ya moja kwa moja ya kuja kwa Mungu kukiwa na moto na dhoruba.
  alternative: Kulieleza wazi kuwa unabii wa hukumu ya mwisho au tukio maalumu la Kikristo.
  rationale: Maandishi ya Kiebrania yenyewe hayataji utimilifu maalumu wa baadaye; tafsiri haipaswi kuingiza mfumo wa kimadhehebu.
- issue: Nguvu ya wakati katika יָבֹא na יֶחֱרַשׁ
  choice: 'Wakati wa sasa wa kishairi: ‘anakuja ... hakai kimya.’'
  alternative: 'Wakati ujao: ‘atakuja ... hatakaa kimya.’'
  rationale: Miundo hiyo ya Kiebrania inaweza kubeba nguvu ya sasa au ya wakati ujao. Maandishi makuu yanahifadhi uhai wa kishairi, huku tanbihi ikitunza uwezekano wa wakati ujao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. ‘Mbele zake’ na ‘kumzunguka’ huhifadhi mpangilio wa taswira ya Kiebrania; tanbihi zinaonyesha utata halisi wa wakati na muundo wa kishazi cha mwisho.
