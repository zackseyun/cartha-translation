base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/021.yaml
  text: You did these things[a], and I kept silent; you thought that I was altogether like you[b]. I will rebuke you and set the case before your eyes.
translation:
  language: sw
  text: Mambo haya umeyafanya, nami nikanyamaza; ukadhani kwamba ningekuwa kama wewe.[a] Nitakukemea na kuweka kwa mpangilio mbele ya macho yako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulidhani kwamba mimi ni kama wewe,” au “kwamba nitakuwa kama wewe.” Muundo wa Kiebrania unaweza kuwasilishwa kwa tofauti ndogo za wakati na hali.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “nitaweka kwa mpangilio mbele ya macho yako.” Kiebrania hakitaji wazi ni nini kitakachowekwa; katika muktadha kinaweza kuwa mambo hayo au mashitaka dhidi yako.
    reason: implicit_object
lexical_decisions:
- source_word: אֵלֶּה עָשִׂיתָ
  choice: Mambo haya umeyafanya
  rationale: Kiwakilishi cha wingi kinarejelea makosa yaliyotajwa kabla; ‘mambo haya’ ni Kiswahili cha kawaida kinachohifadhi rejeleo hilo.
- source_word: וְהֶחֱרַשְׁתִּי
  choice: nami nikanyamaza
  rationale: Kitenzi kinaeleza Mungu kutosema au kutochukua hatua kwa muda; ‘nikanyamaza’ ni wazi bila kuongeza moja kwa moja tafsiri ya ukimya huo kuwa idhini.
- source_word: דִּמִּיתָ
  choice: ukadhani
  rationale: Hapa kitenzi kina maana ya kuwaza au kukisia kimakosa.
- source_word: הֱיוֹת אֶהְיֶה כָמוֹךָ
  choice: kwamba ningekuwa kama wewe kabisa
  rationale: Muundo wa Kiebrania unaeleza dhana potovu ya mzungumziwa. ‘Kabisa’ huonyesha msisitizo, huku ‘ningekuwa’ ikihifadhi hali ya kudhani badala ya kuifanya kauli ya ukweli.
- source_word: אוֹכִיחֲךָ
  choice: Nitakukemea
  rationale: Katika muktadha huu kitenzi kinahusu karipio lenye kufichua kosa; ‘kukemea’ ni neno la kawaida, zito, na lisilobana maana kwenye hukumu rasmi pekee.
- source_word: וְאֶעֶרְכָה
  choice: na kuweka mambo hayo kwa mpangilio
  rationale: Kitenzi kina maana ya kupanga au kuweka kwa utaratibu. Kitu kinachowekwa hakikutajwa wazi katika Kiebrania; ‘mambo hayo’ kinaeleweka kutokana na mashitaka yaliyotangulia lakini kinaelezwa katika tanbihi kuwa ni nyongeza ya kimuktadha.
- source_word: לְעֵינֶיךָ
  choice: mbele ya macho yako
  rationale: Tafsiri hii huhifadhi taswira ya Kiebrania ya jambo kuwekwa wazi kabisa machoni pa mhusika.
theological_decisions:
- issue: Ukimya wa Mungu na karipio linalofuata
  choice: Ukimya unaachwa kama kitendo cha muda kinachofuatwa na karipio, bila kuitaja moja kwa moja kuwa idhini wala kutokuidhinisha.
  alternative: ‘Nilivumilia kimya’ ingeutafsiri ukimya huo waziwazi kuwa ustahimilivu wa Mungu.
  rationale: Muktadha unaonyesha kuwa mwenye dhambi aliuelewa ukimya vibaya, lakini mstari wenyewe unasema tu kwamba Mungu alinyamaza; tafsiri hii inahifadhi mvutano huo.
- issue: Tabia ya kuweka mashitaka mbele ya mhusika
  choice: ‘kuweka mambo hayo kwa mpangilio’ huhifadhi taswira pana ya kupanga na kuwasilisha.
  alternative: ‘kuweka kesi yangu mbele yako’ ingeonyesha wazi zaidi taswira ya kimahakama.
  rationale: Muktadha una sauti ya mashitaka, lakini Kiebrania hakitaji ‘kesi’ kama yambwa; hivyo tafsiri kuu haipaswi kuibana maana hiyo kupita maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi umehifadhiwa kwa vifungu viwili; ‘mbele ya macho yako’ huhifadhi taswira ya asili badala ya kuirahisisha kuwa ‘mbele yako’.
