translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi na picha ya ‘kuketi’ zimehifadhiwa; nahau ya mwisho imetafsiriwa kwa Kiswahili cha kawaida huku maana yake halisi ikielezwa katika tanbihi.
