translation:
  language: sw
  text: Unaketi na kusema dhidi ya ndugu yako; unamsingizia mwana wa mama yako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unamwekea lawama mwana wa mama yako.” Kirai cha Kiebrania kihalisi ni “unatoa דֹּפִי,” yaani kumwekea mtu lawama, shutuma, au maneno yanayomharibia sifa.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּשֵׁב
  choice: Unaketi
  rationale: Huhifadhi picha halisi ya kitenzi ישׁב, ‘kuketi,’ na nguvu ya shutuma ya tendo linalofanywa kwa makusudi.
- source_word: בְּאָחִיךָ תְדַבֵּר
  choice: na kusema dhidi ya ndugu yako
  rationale: Kihusishi ב pamoja na דבר kina maana ya usemi wa uhasama hapa; ‘dhidi ya’ huifanya maana hiyo iwe wazi bila kukitia kitenzi maana kupita kiasi.
- source_word: בְּבֶן אִמְּךָ
  choice: mwana wa mama yako
  rationale: Tafsiri ya karibu na muundo wa Kiebrania huhifadhi msisitizo juu ya undugu wa karibu na ulinganifu wa kishairi.
- source_word: תִּתֶּן דֹּפִי
  choice: unamsingizia
  rationale: Kirai hiki cha Kiebrania humaanisha kumwekea mtu lawama au kumharibia sifa kwa maneno; ‘unamsingizia’ ni Kiswahili cha sasa na cha kawaida kinachowasilisha tendo hilo.
