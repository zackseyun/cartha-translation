  text: 'Wakusanyeni kwangu waaminifu wangu,

    wanaofanya agano langu kwa dhabihu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kihalisi: “wanaokata agano langu kwa dhabihu” au “juu ya dhabihu.”'
