lexical_decisions:
- source_word: אִסְפוּ
  choice: Wakusanyeni
  rationale: Kitenzi cha kuamuru katika wingi kinadumisha mwito unaoelekezwa kwa watendaji wengi; “kusanya” ni neno la kawaida na la moja kwa moja.
- source_word: לִי
  choice: kwangu
  rationale: Katika muktadha huu wa kuitisha kusanyiko mbele za Mungu, “kwangu” huonyesha kuletwa katika uwepo wake kuliko maana ya jumla ya “kwa ajili yangu.”
- source_word: חֲסִידָי
  choice: waaminifu wangu
  rationale: Neno hili huwaeleza watu wenye uaminifu na ushikamanifu kwa Mungu katika uhusiano wa agano. “Waaminifu wangu” ni la kawaida na halileti maana maalumu za baadaye zinazoweza kuambatana na “watakatifu.”
- source_word: כֹּרְתֵי
  choice: wanaofanya
  rationale: Ingawa kitenzi kwa kawaida humaanisha “kukata,” pamoja na “agano” kinaunda nahau ya kufanya au kufunga agano. “Wanaofanya” hutoa maana hiyo kwa Kiswahili cha kawaida, huku tafsiri halisi ikihifadhiwa katika tanbihi.
- source_word: בְרִיתִי
  choice: agano nami
  rationale: Kiebrania kinasema kihalisi “agano langu.” Kiswahili cha kawaida hueleza uhusiano huo kwa uwazi kama kufanya agano “nami,” bila kubadili mhusika wa agano.
- source_word: עֲלֵי זָבַח
  choice: kwa dhabihu
  rationale: Kirai hiki kinaunganisha kufanywa kwa agano na ibada ya dhabihu. “Kwa dhabihu” hudumisha uwezekano wa dhabihu kuwa njia au mazingira ya kuthibitisha agano bila kulazimisha maana finyu zaidi.
theological_decisions:
- issue: Maana ya חֲסִידָי katika muktadha wa agano
  choice: waaminifu wangu
  alternative: watakatifu wangu; wacha Mungu wangu; washikamanifu wangu
  rationale: Chaguo hili linasisitiza uaminifu wa kimahusiano kwa Mungu na linaepuka kuingiza maana ya kitaalamu ya baadaye ya “watakatifu.”
- issue: Nahau ya “kukata agano”
  choice: wanaofanya agano nami kwa dhabihu
  alternative: wanaokata agano langu juu ya dhabihu
  rationale: Kiswahili cha kawaida hakitumii “kukata agano” kwa maana hii. Tafsiri kuu inawasilisha maana ya nahau, na tanbihi inahifadhi umbo la Kiebrania pamoja na utata wa kihusishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa mistari unadumisha mwito na ufafanuzi unaofuata.
