  text: I do not rebuke you for your sacrifices[a]; your burnt offerings are continually before me.
translation:
  language: sw
  text: Sikukemei kwa sababu ya dhabihu zako[a]; sadaka zako za kuteketezwa ziko mbele zangu daima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sikukaripii kwa sababu ya dhabihu zako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: si-
  rationale: Kikanushi kimeunganishwa na kitenzi kwa mujibu wa sarufi ya kawaida ya Kiswahili.
- source_word: עַל
  choice: kwa ajili ya
  rationale: Pamoja na kitenzi 'kukemea,' hapa huonyesha jambo au sababu inayohusu karipio.
- source_word: זְבָחֶיךָ
  choice: dhabihu zako
  rationale: Neno זֶבַח ni neno pana la dhabihu, mara nyingi dhabihu ya mnyama; 'dhabihu' linadumisha upana huo bila kuongeza maelezo yasiyokuwamo.
- source_word: אוֹכִיחֶךָ
  choice: Sikukemei
  rationale: Hifili ya יכח hapa ina maana ya kukemea au kuonya kwa lawama, si lazima kushtaki katika maana finyu ya kisheria.
- source_word: וְעוֹלֹתֶיךָ
  choice: sadaka zako za kuteketezwa
  rationale: עוֹלָה ni istilahi maalumu ya sadaka inayoteketezwa; tafsiri hii ni wazi na ya kawaida katika Kiswahili cha Biblia.
- source_word: לְנֶגְדִּי
  choice: mbele zangu
  rationale: Kirai hiki huonyesha kuwapo katika uwepo au machoni pa Mungu; 'mbele zangu' huhifadhi maana hiyo kwa lugha ya asili.
- source_word: תָמִיד
  choice: daima
  rationale: Neno linaonyesha mwendelezo au ukawaida usiokoma; 'daima' ni fupi na ya kawaida.
theological_decisions:
- issue: Maana ya mstari kuhusu mfumo wa dhabihu wa Israeli
  choice: Mungu hakemei kwa sababu ya ukosefu wa dhabihu; sadaka zao za kuteketezwa ziko mbele zake daima.
  alternative: Mstari unakataa dhabihu zote kuwa batili.
  rationale: Kishazi cha pili kinathibitisha kuwapo kwa sadaka hizo daima mbele za Mungu. Kwa hiyo tatizo si kutokuwapo kwa ibada hiyo, bali jambo la ndani zaidi linalofafanuliwa katika muktadha unaofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unahifadhi ulinganifu wa kishairi wa Kiebrania huku ukibaki wazi kwa msomaji wa kawaida.
