base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/007.yaml
  text: 'Hear[a], my people, and I will speak; O Israel, and I will testify against you: I am God, your God.'
translation:
  language: sw
  text: 'Sikieni, enyi watu wangu, nami nitasema;

    ee Israeli, nitashuhudia dhidi yako[a]:

    Mimi ni Mungu, Mungu wako.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitakuwa shahidi dhidi yako.” Kitenzi cha Kiebrania kina maana ya kutoa ushahidi katika muktadha wa kisheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה
  choice: Sikilizeni
  rationale: Ni amri inayodai kusikiliza kwa makini. Ingawa Kiebrania kinatumia umoja kwa watu kama kundi, Kiswahili cha kawaida hutumia wingi linapowahutubia “watu.”
- source_word: עַמִּי
  choice: watu wangu
  rationale: Inahifadhi uhusiano wa agano na umilikaji ulioonyeshwa na kiambishi cha nafsi ya kwanza.
- source_word: וַאֲדַבֵּרָה
  choice: nami nitasema
  rationale: Inawasilisha mfuatano na dhamira nzito ya hali ya Kiebrania ya cohortative kwa Kiswahili cha asili.
- source_word: יִשְׂרָאֵל
  choice: ee Israeli
  rationale: Jina limehifadhiwa kwa unukuzi; “ee” linaonyesha wazi kuwa Israeli anaitwa moja kwa moja.
- source_word: וְאָעִידָה בָּךְ
  choice: nitashuhudia dhidi yako
  rationale: Kitenzi kina nguvu ya kisheria ya kutoa ushahidi, na kihusishi pamoja na muktadha kinaelekeza ushahidi huo dhidi ya Israeli.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la neno ni la wingi, maana yake hapa ni ya umoja na linamtaja msemaji.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Inahifadhi kiambishi cha nafsi ya pili umoja na dai la uhusiano wa agano.
- source_word: אָנֹכִי
  choice: Mimi ni
  rationale: Kiwakilishi huru cha Kiebrania kinasisitiza utambulisho wa msemaji; “Mimi ni” ni muundo wa asili wa Kiswahili unaohifadhi msisitizo huo.
theological_decisions:
- issue: Tafsiri ya kujitambulisha kwa Mungu katika אֱלֹהִים אֱלֹהֶיךָ אָנֹכִי
  choice: Mimi ni Mungu, Mungu wako
  alternative: Mungu, Mungu wako, ni mimi
  rationale: Muundo huu ni wazi na wa asili katika Kiswahili, huku ukihifadhi msisitizo wa kujitambulisha na dai la uhusiano wa agano bila kuongeza maelezo ya kiteolojia.
- issue: Nguvu ya kisheria ya וְאָעִידָה בָּךְ
  choice: nitashuhudia dhidi yako
  alternative: nitakuwa shahidi dhidi yako
  rationale: Chaguo kuu linahifadhi taswira ya kutoa ushahidi katika mazingira ya hukumu; tanbihi inaweka wazi njia nyingine halali ya kueleza maana hiyo bila kuilegeza kuwa onyo tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Enyi” na “ee” vinadumisha wito rasmi wa kishairi; wingi wa “Sikilizeni” unafuata upatanisho wa kawaida wa Kiswahili kwa “watu,” huku “yako” ikimhutubia Israeli kama taifa moja.
