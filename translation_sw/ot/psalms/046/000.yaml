  text: For the choir director. Of the sons of Korah. According to Alamoth[a]. A song.
translation:
  language: sw
  text: Kwa mwongoza wa waimbaji. Wa wana wa Kora. Kwa Alamoth[a]. Wimbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “kwa wasichana,” yaani kwa sauti za wanawake au sauti za juu; neno la Kiebrania “Alamoth” yaelekea ni agizo la muziki au jina la melodi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza wa waimbaji
  rationale: Katika vichwa vya Zaburi, neno hili humtaja msimamizi wa utendaji wa muziki. Kauli hii ni ya kawaida na inaeleweka bila kuifanya maana iwe pana mno.
- source_word: לִבְנֵי קֹרַח
  choice: Wa wana wa Kora
  rationale: Herufi ya uhusiano ל inaweza kuonyesha utunzi, umiliki, uhusiano au kukabidhiwa kwa kundi hilo. Tafsiri hii fupi inadumisha kwa kiasi kikubwa kutobainika huko.
- source_word: עַל
  choice: Kwa mtindo wa
  rationale: Katika kichwa cha muziki, עַל huenda ikaanzisha jina la melodi au maelekezo ya namna ya kuimba. 'Kwa mtindo wa' ni Kiswahili cha asili kinachoonyesha kazi hiyo bila kudai kwa uhakika Alamoth ilikuwa nini.
- source_word: עֲלָמוֹת
  choice: Alamoth
  rationale: Maana ya istilahi hii ya kiufundi haijulikani kwa hakika; huenda ni jina la melodi, au maelekezo yanayohusiana na wasichana au sauti za juu. Kuitoa kwa matamshi ya Kiebrania kunahifadhi utata huo.
- source_word: שִׁיר
  choice: Wimbo
  rationale: Neno hili hutaja aina ya utungo. 'Wimbo' ni tafsiri ya moja kwa moja, ya kawaida na yenye hadhi.
