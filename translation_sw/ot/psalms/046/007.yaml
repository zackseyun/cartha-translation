  text: יְהוָ֣ה צְבָא֣וֹת עִמָּ֑/נוּ מִשְׂגָּֽב לָ֝/נוּ אֱלֹהֵ֖י יַעֲקֹ֣ב סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/007.yaml
  text: Yahweh of Armies is with us; the God of Jacob is a stronghold for us[a]. Selah
translation:
  language: sw
  text: 'Yahwe wa Majeshi yuko pamoja nasi;

    Mungu wa Yakobo ni ngome yetu.

    Sela.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi wa Kiswahili badala ya kubadilishwa kuwa cheo kama “BWANA,” hivyo kuhifadhi jina la agano lililo katika Kiebrania.
- source_word: צְבָאוֹת
  choice: wa Majeshi
  rationale: Muundo huu pamoja na יְהוָה huunda cheo “Yahwe wa Majeshi.” “Majeshi” ni wazi katika Kiswahili cha sasa na huhifadhi maana ya nguvu za kijeshi au majeshi ya mbinguni bila kuibana zaidi.
- source_word: עִמָּנוּ
  choice: yuko pamoja nasi
  rationale: Kirai hiki huonyesha uwepo wenye mshikamano na ulinzi. “Yuko pamoja nasi” ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: מִשְׂגָּב
  choice: ngome
  rationale: Nomino hii humaanisha mahali pa juu, salama na pa kujilinda. “Ngome” huwasilisha kwa ufupi wazo la ulinzi imara bila kulazimisha muundo maalumu wa jengo.
- source_word: לָנוּ
  choice: yetu
  rationale: Kihusishi chenye kiambishi cha nafsi ya kwanza wingi hapa huonyesha uhusiano na manufaa. Katika Kiswahili, “ngome yetu” ni ya asili zaidi kuliko tafsiri ya neno kwa neno “ngome kwa ajili yetu,” huku ikihifadhi maana.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: Mungu wa Yakobo
  rationale: Hii ni tafsiri ya moja kwa moja ya muundo wa umilikaji na huhifadhi rejeo la agano kwa babu Yakobo.
- source_word: סֶלָה
  choice: Sela
  rationale: Kwa kuwa maana kamili ya neno hili haijulikani kwa uhakika, limehifadhiwa kwa unukuzi badala ya kupewa tafsiri ya kimahususi.
theological_decisions:
- issue: Tafsiri ya cheo יְהוָה צְבָאוֹת
  choice: Yahwe wa Majeshi
  alternative: BWANA wa majeshi
  rationale: Andiko la Kiebrania linatumia jina la Mungu יְהוָה moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi, na “wa Majeshi” huhifadhi nguvu ya cheo צְבָאוֹת bila kutumia mbadala wa kimapokeo “BWANA.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mpangilio wa kishairi na urudiaji wa “nasi/yetu” umehifadhiwa kwa lugha ya asili. Hakuna tanbihi iliyoongezwa kwa kuwa mbadala wa kimapokeo hauwakilishi usomaji tofauti wa maandishi ya Kiebrania bali desturi tofauti ya kutafsiri.
