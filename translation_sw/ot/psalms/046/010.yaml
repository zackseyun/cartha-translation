  text: הַרְפּ֣וּ וּ֭/דְעוּ כִּי אָנֹכִ֣י אֱלֹהִ֑ים אָר֥וּם בַּ֝/גּוֹיִ֗ם אָר֥וּם בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/010.yaml
  text: Be still[a], and know that I am God. I will be exalted among the nations[c][b]; I will be exalted in the earth.
translation:
  language: sw
  text: Acheni[a], mjue kwamba mimi ni Mungu. Nitatukuka[b] miongoni mwa mataifa; nitatukuka duniani[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Tulieni,” “Komeni,” au “Legezeni”; amri ya Kiebrania inaweza kumaanisha kuacha, kulegeza, au kusitisha jitihada.
    reason: lexical_alternative
  - marker: b
    text: Au “Nimetukuka” au “Natukuka”; umbo la Kiebrania linaweza kueleweka kwa nguvu ya sasa au ya wakati ujao katika muktadha huu.
    reason: alternative_reading
  - marker: c
    text: Neno la Kiebrania linaweza pia kumaanisha “katika nchi,” lakini upeo mpana wa zaburi unaunga mkono maana ya dunia yote.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְפּוּ
  choice: Acheni
  rationale: Kitenzi רפה katika amri kina maana ya kuacha, kulegeza, au kusitisha jitihada. “Acheni” kinahifadhi nguvu ya amri na kinafaa katika muktadha wa vurugu za mataifa, bila kuifupisha kuwa mwaliko wa kutafakari kimya tu.
- source_word: וּדְעוּ
  choice: mjue
  rationale: ידע hapa ni amri ya kutambua au kujua. “Mjue” ni ya moja kwa moja na inaweza kujumuisha ufahamu pamoja na kukiri ukweli huo.
- source_word: כִּי
  choice: kwamba
  rationale: כִּי inatanguliza jambo linalopaswa kujulikana; “kwamba” ni kiunganishi cha kawaida na cha asili katika Kiswahili.
- source_word: אָנֹכִי אֱלֹהִים
  choice: mimi ni Mungu
  rationale: Kiwakilishi אָנֹכִי kina uzito wa mkazo. Kutaja “mimi” wazi kabla ya “ni Mungu” kunahifadhi mkazo huo kwa Kiswahili cha kawaida.
- source_word: אָרוּם
  choice: nitatukuka
  rationale: Qal ya רום ina wazo la kuwa juu au kutukuka. “Nitatukuka” huhifadhi hali ya ukuu wa Mungu bila kuingiza wazi mtendaji wa kumtukuza, na wakati ujao unaonyesha uhakika wa kutukuka kwake katika muktadha.
- source_word: בַּגּוֹיִם
  choice: miongoni mwa mataifa
  rationale: גּוֹיִם hapa ni mataifa au jamii za kisiasa kwa upana. “Miongoni mwa mataifa” ni usemi wa asili unaofaa upeo wa kimataifa wa zaburi.
- source_word: בָּאָרֶץ
  choice: duniani
  rationale: אֶרֶץ inaweza kuwa nchi au dunia. Ulinganifu wake na “mataifa” unaunga mkono maana pana ya dunia; “duniani” ni usemi wa asili wa Kiswahili.
theological_decisions:
- issue: Nguvu ya amri הַרְפּוּ
  choice: Amri ya kuacha au kusitisha jitihada mbele ya enzi ya Mungu, iliyotafsiriwa “Acheni”
  alternative: “Tulieni,” kama mwaliko wa kuwa kimya; au amri mahsusi ya kuacha vita
  rationale: Kitenzi chenyewe kina maana pana ya kulegeza au kuacha. Muktadha unahusu mataifa yenye vurugu na utawala wa Mungu, lakini hauhalalishi kuifunga amri kwa vita pekee wala kwa utulivu wa ndani pekee.
- issue: Nguvu ya wakati katika אָרוּם
  choice: 'Wakati ujao wenye uhakika: “nitatukuka”'
  alternative: 'Wakati wa sasa: “nimetukuka” au “natukuka”'
  rationale: Umbo la yiqtol linaweza kueleweka kwa nguvu ya sasa au ya baadaye kulingana na muktadha. Wakati ujao unaonyesha tangazo la uhakika wa ukuu wa Mungu, huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini rahisi kueleweka. “Acheni” limechaguliwa badala ya usemi wa kidini uliozoeleka “Tulieni” ili kudumisha wazo la msingi la kusitisha au kulegeza. Mistari sambamba na marudio ya “nitatukuka” yamehifadhiwa.
