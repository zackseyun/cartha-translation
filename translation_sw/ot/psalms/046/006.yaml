  text: הָמ֣וּ ג֭וֹיִם מָ֣טוּ מַמְלָכ֑וֹת נָתַ֥ן בְּ֝/קוֹל֗/וֹ תָּמ֥וּג אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/006.yaml
  text: Nations raged[a], kingdoms tottered; he uttered his voice, the earth melted.
translation:
  language: sw
  text: Mataifa yalikuwa katika msukosuko[a], falme zikayumba; alitoa sauti yake, dunia ikayeyuka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mataifa yalifanya ghasia, falme zikatitikiswa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָמוּ
  choice: yalifanya ghasia
  rationale: Kitenzi kinaonyesha makelele na msukosuko. Usemi huu ni wa kawaida katika Kiswahili na unahifadhi wazo la vurugu bila kulifanya kuwa uhasama pekee.
- source_word: גּוֹיִם
  choice: Mataifa
  rationale: Hapa neno linamaanisha makundi ya kisiasa kwa upana na linaendana na ulinganifu wa kishairi na “falme”; “watu wa mataifa” lingeingiza utofautishaji usiolengwa.
- source_word: מָטוּ
  choice: zikayumba
  rationale: Kitenzi kinaonyesha kupoteza uthabiti au kutikisika, bila kulazimisha maana kwamba falme tayari zilianguka kabisa.
- source_word: מַמְלָכוֹת
  choice: falme
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida kwa maeneo au tawala za kifalme.
- source_word: נָתַן בְּקוֹלוֹ
  choice: alitoa sauti yake
  rationale: Inafuata kwa karibu nahau ya Kiebrania “alitoa sauti yake” huku ikibaki wazi na yenye hadhi katika Kiswahili.
- source_word: תָּמוּג
  choice: ikayeyuka
  rationale: Inahifadhi picha ya dunia kupoteza uimara mbele ya sauti ya Mungu; “kuyeyuka” ni ya moja kwa moja na ya kishairi.
- source_word: אָרֶץ
  choice: dunia
  rationale: Muktadha wa mataifa na falme unaelekeza kwenye upeo wa ulimwengu mzima kuliko nchi fulani.
theological_decisions:
- issue: Kiima kisichotajwa wazi cha נָתַן
  choice: “alitoa” — kiima kinaeleweka kuwa Mungu kutokana na muktadha
  alternative: Kutaja wazi “Mungu” au “BWANA”
  rationale: Kiebrania kina kiima cha nafsi ya tatu umoja bila jina la Mungu katika mstari huu. Kiswahili kinaweza kuhifadhi ufupi huo kwa kutumia “alitoa,” huku muktadha ukimtambulisha; kutaja jina kungeongeza jambo lisilo wazi katika mstari wenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishairi na mwendo wa haraka wa vitenzi umehifadhiwa; “zikayumba” na “ikayeyuka” zinatunza picha za kupotea kwa uthabiti bila kuzifafanua kupita kiasi.
