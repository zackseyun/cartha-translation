  yaml_path: translation/ot/psalms/046/004.yaml
  text: A river—its streams make glad the city of God[b][a], the holy dwelling place of the Most High.
translation:
  language: sw
  text: Mto[a]—vijito vyake vyaufurahisha mji wa Mungu, makao[b] matakatifu ya Aliye Juu Sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kuna mto ambao vijito vyake vyaufurahisha mji wa Mungu.” Kiebrania kinaanza kishairi bila kitenzi.'
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina neno la wingi “makao”; baadhi ya tafsiri hutoa maana hiyo kwa umoja, kama “mahali patakatifu” au “patakatifu.”
    reason: alternative_reading
lexical_decisions:
- source_word: נָהָר
  choice: Mto
  rationale: Nomino haina kibainishi, na mwanzo huu usio na kitenzi umehifadhiwa kwa mtindo wa kishairi. Kiswahili pia kinaweza kusema “Kuna mto,” kama ilivyoelezwa katika tanbihi.
- source_word: פְּלָגָיו
  choice: vijito vyake
  rationale: Wingi wenye kiambishi cha nafsi ya tatu umoja unarejelea mto. “Vijito” huwasilisha kwa lugha ya kawaida mikondo inayotoka au kugawanyika kutoka katika mto.
- source_word: יְשַׂמְּחוּ
  choice: vyaufurahisha
  rationale: Kauli ya Piel inaonyesha kwamba vijito hivyo vinasababisha furaha. “Vyaufurahisha” huhifadhi maana hiyo ya kisababishi na kupatana na ngeli ya “vijito.”
- source_word: עִיר אֱלֹהִים
  choice: mji wa Mungu
  rationale: Hili ni tamko la moja kwa moja la muundo wa utegemezi wa Kiebrania, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: קְדֹשׁ
  choice: mahali patakatifu pa
  rationale: Katika muundo huu neno linaeleweka vizuri kama nomino ya mahali patakatifu inayotawala “makao,” badala ya kulazimishwa kuwa kivumishi cha moja kwa moja.
- source_word: מִשְׁכְּנֵי
  choice: makao
  rationale: Umbo la Kiebrania ni wingi wa utegemezi. “Makao” huhifadhi wingi huo huku likibaki la asili katika Kiswahili.
- source_word: עֶלְיוֹן
  choice: Aliye Juu Zaidi
  rationale: Hiki ni cheo cha Mungu. Tafsiri hii ni wazi, yenye hadhi, na huhifadhi maana ya ukuu ulio juu kabisa.
theological_decisions:
- issue: Ikiwa wingi wa מִשְׁכְּנֵי usawazishwe kuwa umoja unaorejelea patakatifu pa Mungu
  choice: Kuhifadhi wingi kwa “makao”
  alternative: makao yake; maskani; mahali pake pa kukaa
  rationale: Maandishi ya Kiebrania yana umbo la wingi. Kulihifadhi huepuka kufuta kwa kimya mvutano kati ya “mahali patakatifu” na “makao,” ambao unaweza kuwa wa kishairi au kuashiria maeneo ya patakatifu.
- issue: Uhusiano wa קְדֹשׁ na מִשְׁכְּנֵי עֶלְיוֹן
  choice: “mahali patakatifu pa makao ya Aliye Juu Zaidi”
  alternative: “makao matakatifu ya Aliye Juu Zaidi”
  rationale: Umbo קְדֹשׁ linaweza kusomwa kama “mahali patakatifu” katika muundo wa utegemezi. Chaguo hili linaonyesha kwa karibu zaidi sintaksia ya Kiebrania bila kuvunja uambatanisho wake na “mji wa Mungu.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Mkwaju mrefu umehifadhi mwanzo mfupi wa Kiebrania, na “Aliye Juu Zaidi” limetumiwa kama jina la cheo cha Mungu.
