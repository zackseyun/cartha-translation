lexical_decisions:
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na ungamo la mstari uliotangulia kwamba Mungu ni kimbilio na nguvu.
- source_word: לֹא נִירָא
  choice: hatutaogopa
  rationale: Kauli hii inaeleza azimio na uhakika wa waabudu; wakati ujao wa Kiswahili unawasilisha maana hiyo kwa kawaida.
- source_word: בְּהָמִיר אָרֶץ
  choice: hata dunia ikibadilika
  rationale: Muundo wenye בְּ na kitenzi מוּר unaonyesha hali ambayo ndani yake hawaogopi. ‘Ikibadilika’ huakisi moja kwa moja maana ya kubadilika bila kuficha picha ya kuvurugika kwa dunia.
- source_word: וּבְמוֹט הָרִים
  choice: hata milima ikiteleza
  rationale: מוֹט huonyesha kuondoka katika uthabiti, kuyumba au kuteleza. ‘Ikiteleza’ inafaa kwa picha ya milima inayohama kuelekea baharini.
- source_word: בְּלֵב יַמִּים
  choice: na kuingia moyoni mwa bahari
  rationale: ‘Moyoni mwa’ huhifadhi sitiari halisi ya לֵב huku ikimaanisha sehemu ya ndani au katikati; ‘kuingia’ huweka wazi mwendo unaodokezwa na picha nzima. ‘Bahari’ katika Kiswahili inaweza kuwa umoja au wingi kulingana na muktadha.
