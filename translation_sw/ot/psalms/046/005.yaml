lexical_decisions:
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania linaweza kuwa la wingi, katika muktadha huu linamtaja Mungu mmoja wa Israeli.
- source_word: בְּקִרְבָּהּ
  choice: yuko ndani yake
  rationale: Kirai hiki kinaonyesha uwepo wa Mungu ndani ya mji. Kiswahili hutumia kiwakilishi cha ngeli ya mji bila kulazimisha jinsia ya kisarufi ya Kiebrania.
- source_word: בַּל תִּמּוֹט
  choice: hautatikisika
  rationale: Kitenzi מוט katika Niphal kina maana ya kutikiswa, kuyumba, au kuondolewa katika uthabiti; ‘hautatikisika’ ni cha kawaida na kinahifadhi taswira ya uthabiti.
- source_word: יַעְזְרֶהָ
  choice: atausaidia
  rationale: Kiwakilishi cha yambwa ‘u’ kinarejelea mji uliotajwa katika muktadha, na wakati ujao unaonyesha msaada wa Mungu uliohakikishwa.
- source_word: לִפְנוֹת בֹּקֶר
  choice: wakati mapambazuko yanapowadia
  rationale: Kirai hiki hueleza kugeuka au kuwadia kwa asubuhi. Tafsiri hii ni ya asili katika Kiswahili huku ikihifadhi wazo la kuchomoza kwa siku.
theological_decisions:
- issue: Kirejeleo cha viwakilishi vya umoja wa kike katika Kiebrania
  choice: 'Virejelee mji wa Mungu/Sayuni unaotajwa katika muktadha wa karibu, kwa kutumia ngeli ya Kiswahili ya ‘mji’: ‘hautatikisika’ na ‘atausaidia’.'
  alternative: Virejelee kwa upana zaidi jumuiya ya watu wa Mungu.
  rationale: Sarufi ya Kiebrania inaelekeza kwa kawaida kwa neno la kike ‘mji’ katika muktadha uliotangulia. Tafsiri haibadilishi kirejeleo hicho kuwa jina la ufafanuzi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wa heshima. Viwakilishi vinafuata ngeli ya ‘mji’ badala ya kuiga jinsia ya kisarufi ya Kiebrania.
