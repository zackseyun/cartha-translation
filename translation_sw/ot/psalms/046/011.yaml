  yaml_path: translation/ot/psalms/046/011.yaml
  text: Yahweh of Armies is with us[a]; the God of Jacob is a stronghold for us[c][b]. Selah
translation:
  language: sw
  text: Yahweh wa Majeshi yuko pamoja nasi;[a] Mungu wa Yakobo ni ngome yetu.[b] Sela.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “BWANA wa majeshi yuko pamoja nasi.” Neno la Kiebrania צְבָאוֹת, ambalo kijadi limetafsiriwa “majeshi,” humaanisha majeshi au vikosi vya kijeshi, mara nyingi likidokeza majeshi ya mbinguni.
    reason: lexical_alternative
  - marker: b
    text: “Ngome” pia inaweza kutafsiriwa “kimbilio” au “ngome ya juu.” Neno la Kiebrania מִשְׂגָּב humaanisha mahali salama, palipoinuka na penye ulinzi.
    reason: lexical_alternative
  - marker: c
    text: “Sela” ni istilahi ya Kiebrania ya kiliturujia au kimuziki ambayo maana yake kamili haijulikani kwa uhakika; kwa hiyo imeachwa bila kutafsiriwa.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi utambulisho wa agano katika maandishi ya Kiebrania.
- source_word: צְבָאוֹת
  choice: wa Majeshi
  rationale: Neno hili linamaanisha majeshi au makundi ya kijeshi, mara nyingi likiwa na dokezo la majeshi ya mbinguni; “wa Majeshi” ni wazi na ya kawaida katika Kiswahili cha sasa.
- source_word: עִמָּנוּ
  choice: yuko pamoja nasi
  rationale: Kirai hiki humaanisha “pamoja nasi”; kitenzi “yuko” kimeongezwa kwa sababu sentensi ya Kiebrania haina kitenzi kinachoonekana.
- source_word: מִשְׂגָּב לָנוּ
  choice: ngome yetu
  rationale: מִשְׂגָּב ni mahali salama, palipoinuka na penye ulinzi. “Ngome yetu” huwasilisha kwa Kiswahili cha kawaida maana ya ngome iliyo kwa ajili yetu.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: Mungu wa Yakobo
  rationale: Huhifadhi muundo wa Kiebrania na utambulisho wa Mungu kwa uhusiano wake wa agano na Yakobo.
- source_word: סֶלָה
  choice: Sela
  rationale: Kwa kuwa maana kamili ya istilahi hii ya kiliturujia au kimuziki haijulikani kwa uhakika, imetoholewa badala ya kufasiriwa kwa kubahatisha.
theological_decisions:
- issue: Jinsi ya kutafsiri יְהוָה צְבָאוֹת
  choice: Yahwe wa Majeshi
  alternative: BWANA wa majeshi
  rationale: Huhifadhi jina la Mungu lililo katika maandishi pamoja na maana ya kijeshi ya צְבָאוֹת, bila kulibadilisha jina hilo kuwa cheo.
- issue: Maana ya מִשְׂגָּב
  choice: ngome yetu
  alternative: kimbilio letu; ngome ya juu kwa ajili yetu
  rationale: “Ngome” huhifadhi picha ya mahali salama penye ulinzi. Kiwakilishi “yetu” huwasilisha kwa ufasaha לָנוּ, yaani ngome iliyo kwa ajili yetu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mpangilio wa kishairi na usambamba wa Kiebrania umehifadhiwa kwa sentensi mbili fupi.
