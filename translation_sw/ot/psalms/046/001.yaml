  text: Mungu ni kimbilio letu na nguvu zetu, ambaye huthibitika kuwa msaada sana katika taabu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kihalisi, Kiebrania husema: “msaada katika taabu, aliyepatikana sana mno.” Hapa “aliyepatikana” ni usemi unaomaanisha kwamba Mungu huthibitika kuwa msaada kwa kiwango kikubwa wakati wa dhiki.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania ni la wingi kisarufi, hapa maana yake ni ya umoja na linamtaja Mungu wa Israeli.
- source_word: לָנוּ
  choice: letu / zetu
  rationale: Kihalisi ni ‘kwa ajili yetu’ au ‘kwetu’; katika Kiswahili umilikaji wa kipredikati unaelezwa kwa kawaida kwa ‘kimbilio letu na nguvu zetu’.
- source_word: מַחֲסֶה
  choice: kimbilio
  rationale: Neno hili linaeleza mahali pa kukimbilia ili kupata usalama na ulinzi; ‘kimbilio’ ni la kawaida, fupi, na linafaa katika ushairi wa zaburi.
- source_word: וָעֹז
  choice: na nguvu zetu
  rationale: עֹז humaanisha nguvu au uweza. ‘Nguvu’ hudumisha nomino dhahania ya Kiebrania na inaungana kwa asili na ‘kimbilio’.
- source_word: עֶזְרָה
  choice: msaada
  rationale: Nomino hii humaanisha msaada au usaidizi; ‘msaada’ ni neno la kawaida na lenye hadhi katika Kiswahili cha sasa.
- source_word: בְּצָרוֹת
  choice: wakati wa taabu
  rationale: Wingi wa Kiebrania unaonyesha hali au nyakati za dhiki. Kiswahili hutumia kwa kawaida ‘wakati wa taabu’ kwa maana ya jumla bila kulazimika kuongeza ‘mbalimbali’ isiyopo wazi katika chanzo.
- source_word: נִמְצָא מְאֹד
  choice: anayepatikana kwa urahisi sana
  rationale: Kihalisi ni ‘anayepatikana sana mno,’ lakini katika muktadha huu maana ni kwamba Mungu huthibitika kuwa karibu na tayari kusaidia. ‘Kwa urahisi sana’ huwasilisha upatikanaji huo kwa Kiswahili cha kawaida bila kubadili wazo kuwa kuwapo tu.
theological_decisions:
- issue: Muundo na maana ya kishazi עֶזְרָה בְצָרוֹת נִמְצָא מְאֹד
  choice: msaada anayepatikana kwa urahisi sana wakati wa taabu
  alternative: msaada katika taabu, anayepatikana sana mno
  rationale: Kishazi cha Kiebrania kimebanwa na kinaweza kusomwa kwa ukaribu zaidi kama ‘msaada katika taabu, anayepatikana sana mno.’ Tafsiri kuu inaeleza kwa Kiswahili cha asili wazo la Mungu kuwa tayari na kupatikana katika dhiki, huku tanbihi ikihifadhi muundo na ukali wa usemi wa chanzo.
- issue: Upatanisho wa kisarufi wa ‘anayepatikana’
  choice: anayepatikana
  alternative: unaopatikana
  rationale: ‘Msaada’ hapa ni maelezo ya Mungu mwenyewe, si kitu kisicho na uhai kilichotengwa naye. Upatanisho wa ‘anayepatikana’ huweka wazi kwamba ni Mungu anayepatikana kuwa msaada, bila kuongeza fundisho lisilomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. ‘Wakati wa taabu’ ni usemi wa kawaida zaidi kuliko ‘katika taabu,’ na tanbihi inahifadhi muundo ulio karibu zaidi na Kiebrania.
