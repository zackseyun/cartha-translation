  text: Maji yake yangurume na kutoa povu; milima itetemeke kwa kufura kwake.[a] Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “milima itetemeke kwa majivuno yake,” au “kwa kuinuka kwake.” Nomino ya Kiebrania inaweza kumaanisha kuinuka, majivuno, au kufura; hapa taswira ya maji yanayofura imependelewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶהֱמוּ
  choice: yangurume
  rationale: Kitenzi המה kinaonyesha kelele kubwa yenye msukosuko; “yangurume” ni usemi hai na wa kawaida kwa maji yenye kishindo.
- source_word: יֶחְמְרוּ
  choice: kutoa povu
  rationale: Katika muktadha wa maji yaliyochafuka na kusukumwa kwa nguvu, חמר yaelekea kuonyesha kutibuka au kutoa povu; usemi huu unaendana kwa kawaida na maji kwa Kiswahili.
- source_word: מֵימָיו
  choice: maji yake
  rationale: Kiambishi cha umoja wa kiume kinahifadhiwa kwa umilikaji wa “yake,” kikirejelea taswira ya bahari katika mstari uliotangulia bila kuifanya kuwa nafsi.
- source_word: יִרְעֲשׁוּ
  choice: itetemeke
  rationale: רעשׁ huonyesha kutikisika kwa nguvu; “itetemeke” ni lugha ya asili kwa milima inayotikiswa.
- source_word: הָרִים
  choice: milima
  rationale: Nomino ina kiambishi bainifu katika Kiebrania; Kiswahili hakihitaji neno tofauti la uainishaji hapa, na “milima” inarejelea milima ya mandhari hii kwa ujumla.
- source_word: בְּגַאֲוָתוֹ
  choice: kwa kufurika kwake
  rationale: גאוה inaweza kumaanisha kuinuka, majivuno, au kujaa/kufura. Katika taswira ya maji yenye msukosuko, “kufurika” huwasilisha kuinuka na kusonga kwa maji bila kulazimisha maana ya kimaadili.
- source_word: סֶלָה
  choice: Sela
  rationale: Neno linaachwa kwa unukuzi kwa kuwa kazi yake sahihi ya kiliturujia au kimuziki haijulikani kwa uhakika.
