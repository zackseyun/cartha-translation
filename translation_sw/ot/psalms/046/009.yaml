  text: מַשְׁבִּ֥ית מִלְחָמוֹת֮ עַד קְצֵ֪ה הָ֫/אָ֥רֶץ קֶ֣שֶׁת יְ֭שַׁבֵּר וְ/קִצֵּ֣ץ חֲנִ֑ית עֲ֝גָל֗וֹת יִשְׂרֹ֥ף בָּ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/009.yaml
  text: He makes wars cease to the end of the earth[a]; he breaks the bow and cuts the spear in two[b]; he burns the wagons with fire.
translation:
  language: sw
  text: 'Hukomesha vita hadi miisho ya dunia;

    huvunja upinde na hukatakata mkuki[a];

    huchoma mikokoteni[b] kwa moto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na hukata mkuki.”
    reason: Tofauti hiyo huhifadhi uwezekano wa kutafsiri kitenzi kwa maana rahisi zaidi ya kukata.
  - marker: b
    text: Au, “magari ya vita.” Neno la Kiebrania kwa kawaida humaanisha mikokoteni au magari ya kubebea mizigo, lakini hapa liko katika muktadha wa kijeshi.
    reason: Huhifadhi tafsiri mbadala inayotokana na muktadha wa vita bila kuiondoa maana ya msingi ya neno.
lexical_decisions:
- source_word: מַשְׁבִּית מִלְחָמוֹת
  choice: Hukomesha vita
  rationale: Kitenzi cha Kiebrania katika kauli ya kusababisha kinaonyesha kwamba Mungu ndiye anayefanya vita vikome. ‘Hukomesha vita’ ni ya kawaida na huhifadhi nguvu hiyo ya kisababishi.
- source_word: עַד קְצֵה הָאָרֶץ
  choice: hadi mwisho wa dunia
  rationale: Hufuata muundo wa umoja wa Kiebrania na kueleza upeo unaofika mbali kabisa bila kulazimisha wingi usio katika maandishi.
- source_word: קֶשֶׁת יְשַׁבֵּר
  choice: huvunja upinde
  rationale: Umoja umetumiwa kwa maana ya kijumla kuhusu silaha hiyo; ‘huvunja’ huwasilisha tendo la kuiharibu kwa uwazi.
- source_word: וְקִצֵּץ חֲנִית
  choice: na kuukata mkuki vipande
  rationale: קצץ humaanisha kukata au kukata vipande. Usemi huu ni wa kawaida kwa Kiswahili na unaonyesha kuharibiwa kwa mkuki bila kuongeza idadi maalumu ya vipande ambayo Kiebrania haitaji.
- source_word: עֲגָלוֹת
  choice: mikokoteni
  rationale: Neno hili humaanisha kwa kawaida mikokoteni au magari ya kubebea mizigo, si neno la kawaida la Kiebrania kwa magari ya vita. ‘Mikokoteni’ huepuka maana ya magari ya kisasa.
- source_word: יִשְׂרֹף בָּאֵשׁ
  choice: huchoma ... kwa moto
  rationale: ‘Kwa moto’ ni Kiswahili cha kawaida kinachohifadhi picha halisi ya kuchomwa kwa moto.
theological_decisions:
- issue: Maana ya עֲגָלוֹת katika muktadha wa vita
  choice: mikokoteni
  alternative: magari ya vita
  rationale: Hakuna fundisho maalumu linalotegemea uchaguzi huu. Maana ya kawaida ya neno la Kiebrania imetangulizwa, huku tafsiri ya kimuktadha inayohusisha magari ya vita ikihifadhiwa katika tanbihi.
- issue: Kiwango cha ukataji kinachoelezwa na וְקִצֵּץ
  choice: kuukata mkuki vipande
  alternative: kuukata mkuki
  rationale: Kiebrania kinaonyesha kukatwa kwa kuuharibu mkuki, lakini hakisemi wazi kuwa ulikatwa vipande viwili. Tafsiri haijaongeza idadi hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka kwa wasomaji wa kawaida. Vitenzi vya ‘hu-’ vinaonyesha matendo ya Mungu kwa mtiririko mmoja. Mistari mitatu inadumisha usambamba wa kishairi wa Kiebrania.
