  text: Njooni, mtazame matendo ya BWANA, ambaye ameleta ukiwa duniani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכוּ
  choice: Njooni
  rationale: Mwito wa wingi unaowaalika wasikilizaji waende wakajionee; katika Kiswahili, “Njooni” ni mwito wa kawaida na wa moja kwa moja.
- source_word: חֲזוּ
  choice: myatazame
  rationale: Kitenzi hiki kinamaanisha kuona kwa makini au kutazama; “myatazame” hudokeza uchunguzi wa matendo yanayotajwa.
- source_word: מִפְעֲלוֹת
  choice: matendo
  rationale: Hurejelea kazi au matendo yaliyotekelezwa; “matendo” ni ya asili na yenye hadhi katika muktadha huu.
- source_word: יְהוָה
  choice: BWANA
  rationale: Huwakilisha jina la Mungu YHWH kwa desturi iliyoenea katika tafsiri za Biblia za Kiswahili.
- source_word: שָׂם
  choice: ameleta
  rationale: Kimsingi ni ‘ameweka/amefanya’; pamoja na ‘ukiwa’ inaeleza kwamba BWANA ndiye aliyesababisha hali hiyo itokee, bila kutumia Kiswahili kigumu ‘ameweka ukiwa’.
- source_word: שַׁמּוֹת
  choice: ukiwa
  rationale: Nomino ya wingi ya Kiebrania hueleza maangamizi au maeneo yaliyofanywa magofu; Kiswahili hutumia kwa kawaida nomino ya jumla “ukiwa”.
- source_word: בָּאָרֶץ
  choice: duniani
  rationale: אֶרֶץ inaweza kumaanisha nchi au dunia; bila kikomo cha eneo katika mstari huu, “duniani” huhifadhi upeo mpana unaowezekana.
theological_decisions:
- issue: Uhusiano wa BWANA na ukiwa
  choice: ambaye ameleta ukiwa
  alternative: ambaye ameweka ukiwa
  rationale: Tafsiri inahifadhi dai la wazi la mstari kwamba ukiwa unatokana na tendo la BWANA, bila kulainisha mvutano wa kitheolojia; “ameleta” ni Kiswahili cha asili zaidi kuliko “ameweka” katika muunganiko huu.
- issue: Upeo wa אֶרֶץ
  choice: duniani
  alternative: nchini
  rationale: Neno la Kiebrania linaweza kuwa na maana zote mbili. Muktadha mpana wa zaburi na ukosefu wa utambulisho wa nchi fulani vinaunga mkono “duniani,” huku uwezekano wa “nchini” ukibaki kuwa mbadala wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Wingi wa amri umehifadhiwa katika “Njooni, myatazame,” na sentensi imewekwa wazi kwa msomaji wa kawaida bila kupunguza ukali wa kauli ya chanzo.
