base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/022.yaml
  text: Bless Yahweh[a], all his works, in all the places of his dominion. Bless Yahweh[c][b], O my soul.
translation:
  language: sw
  text: Enyi kazi zake zote, mbarikini Yahwe[a] katika mahali pote pa utawala wake.[b] Ee nafsi yangu, mbariki Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Msifuni Yahwe.” Kitenzi cha Kiebrania kinamaanisha kihalisi “barikini” na kinarudiwa mwishoni mwa mstari.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “katika mahali pote pa utawala wake”; yaani, kila mahali ambapo utawala wake unaenea.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרֲכ֤וּ / בָּרֲכִ֥י
  choice: Mbarikini / mbariki
  rationale: Vitenzi vya kuamuru vya mzizi ברך vimetafsiriwa kwa “bariki” ili kuhifadhi maana ya msingi na urudiaji wa kishairi; umbo la wingi kwanza linazielekea kazi zote za Mungu, na umbo la umoja baadaye linaielekea nafsi ya mtunga zaburi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limewasilishwa kama “Yahwe,” badala ya kulibadilisha kuwa cheo kama “Bwana.”
- source_word: כָּל מַעֲשָׂיו
  choice: kazi zake zote
  rationale: מַעֲשֶׂה inaweza kurejelea mambo aliyoyatenda au aliyoyafanya Mungu. “Kazi zake zote” huhifadhi upana huo bila kuibana kauli iwe matendo tu au viumbe tu; “enyi” huonyesha wazi kuwa ndizo zinazoamriwa.
- source_word: בְּכָל מְקֹמוֹת מֶמְשַׁלְתּוֹ
  choice: kila mahali pa utawala wake
  rationale: Kauli hii huhifadhi wazo la maeneo yote ambako mamlaka yake inatawala, kwa Kiswahili cha kawaida na cha kishairi.
- source_word: נַפְשִׁי
  choice: Ee nafsi yangu
  rationale: Hii ni hotuba ya mtunga zaburi kwa nafsi yake mwenyewe; “Ee” huweka wazi mwito na kudumisha hadhi ya kishairi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Bwana
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu moja kwa moja; “Yahwe” hulihifadhi badala ya kuweka cheo mahali pake.
- issue: Upeo wa כָּל מַעֲשָׂיו
  choice: kazi zake zote
  alternative: viumbe vyake vyote
  rationale: Neno la Kiebrania linaweza kujumuisha yote aliyoyafanya au kuyatenda Mungu. “Kazi zake zote” huhifadhi upana huo, ilhali “viumbe vyake vyote” kingefanya maana iwe uumbaji pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka kwa wasomaji wa kawaida. “Enyi” linafafanua kwamba “kazi zake zote” ndizo zinazopewa amri, na “Ee nafsi yangu” huhifadhi mwito wa kujisemea wa zaburi.
