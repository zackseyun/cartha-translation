base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/004.yaml
  text: who redeems your life from the pit[a], who crowns you with steadfast love and compassion[b],
translation:
  language: sw
  text: 'anayekomboa uhai wako kutoka shimoni[a],

    anayekuvika taji la upendo wa kudumu na huruma[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka maangamizini” au “kutoka kaburini.”
    reason: lexical_alternative
  - marker: b
    text: Au “na rehema nyingi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגּוֹאֵל
  choice: anayekomboa
  rationale: Kitenzi hiki huhusisha kukomboa au kurejesha kilicho katika hatari au utumwa. “Anayekomboa” kinadumisha nguvu ya kishairi na maana pana ya wokovu bila kuibana iwe tendo la kisheria pekee.
- source_word: מִשַּׁחַת
  choice: kutoka shimoni
  rationale: שַׁחַת linaweza kumaanisha shimo, kaburi, au maangamizi. “Shimoni” linahifadhi picha halisi ya kishairi, huku maana nyingine zikitolewa katika tanbihi.
- source_word: חַיָּיִכִי
  choice: uhai wako
  rationale: Katika muktadha huu neno linamaanisha maisha au uhai wa mtu kwa ujumla. “Uhai wako” ni Kiswahili cha kawaida na halilazimishi maana ya nafsi isiyo ya kimwili.
- source_word: הַמְעַטְּרֵכִי
  choice: anayekuvika taji
  rationale: עטר huonyesha kuvika taji au kuzungushia kwa heshima. “Anayekuvika taji” linahifadhi sitiari ya kupewa heshima na mema.
- source_word: חֶסֶד
  choice: upendo wa kudumu
  rationale: חֶסֶד huonyesha upendo mwaminifu, wenye uthabiti na uaminifu wa agano. “Upendo wa kudumu” ni wa asili na unaeleweka kwa wasomaji wa sasa, bila kupoteza wazo la upendo usiokoma.
- source_word: וְרַחֲמִים
  choice: na huruma
  rationale: רַחֲמִים ni umbo la wingi linaloweza kueleza huruma nyingi au yenye kina. Kiswahili kwa kawaida hutumia nomino dhahania “huruma”; tanbihi inahifadhi uwezekano wa kuonyesha wingi huo.
theological_decisions:
- issue: Upeo wa picha ya ukombozi kutoka שַׁחַת
  choice: Ukombozi kutoka hatari ya mauti au uharibifu, ulioelezwa kwa picha pana ya kishairi.
  alternative: Ukombozi kutoka kaburini hasa, au wokovu wa kiroho pekee.
  rationale: Neno la Kiebrania linaweza kuhusisha shimo, kaburi, au maangamizi. Tafsiri haifungi mstari huu kwenye fundisho moja pekee, bali inadumisha upana na mvutano wa picha ya kishairi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa virai viwili vinavyoanza na “anaye-” umehifadhiwa. “Kukuvika taji” ni ya asili zaidi kuliko “kukutia taji” katika muktadha huu, na “upendo wa kudumu” huepuka istilahi ya kimadhehebu huku ikibeba uthabiti wa חֶסֶד.
