  yaml_path: translation/ot/psalms/103/010.yaml
  text: He has not dealt with us according to our sins[a], nor repaid us according to our iniquities.
translation:
  language: sw
  text: 'Hajatutendea kulingana na dhambi zetu,[a]

    wala hajatulipa kulingana na maovu yetu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Hajatutendea kama dhambi zetu zinavyostahili, wala hajatulipa kama maovu yetu yanavyostahili.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּ/חֲטָאֵינוּ
  choice: kulingana na dhambi zetu
  rationale: 'Kiambishi כ kinaonyesha ulinganisho au kipimo: ‘kulingana na, kwa kadiri ya.’ Tafsiri hii ni ya kawaida katika Kiswahili na inaonyesha kwamba Mungu hakututendea kwa kipimo cha dhambi zetu.'
- source_word: עָשָׂה לָנוּ
  choice: hakututendea
  rationale: Kitenzi עשה ni kipana, ‘kufanya’ au ‘kutenda.’ Pamoja na לָנוּ na katika muktadha huu, ‘kututendea’ huwasilisha kwa kawaida namna Mungu alivyoshughulika nasi bila kuongeza maana isiyokuwamo.
- source_word: וְלֹא
  choice: wala ...-ku-
  rationale: ‘Wala’ huunganisha kwa kawaida na kwa ufupi ukanushaji wa mstari wa pili na ule wa kwanza, huku ukihifadhi usambamba wa kishairi.
- source_word: כַּ/עֲוֺנֹתֵינוּ
  choice: kulingana na maovu yetu
  rationale: עון inaweza kumaanisha uovu, hatia, au matokeo ya hatia. ‘Maovu’ huhifadhi tofauti fulani na ‘dhambi’ katika mstari wa kwanza bila kuibana maana kuwa hatia pekee.
- source_word: גָּמַל עָלֵינוּ
  choice: hakutulipa
  rationale: גמל hapa ina maana ya kumpa mtu malipo yanayolingana na matendo yake. ‘Kutulipa’ ni Kiswahili cha kawaida na kinaonyesha wazi kwamba Mungu hakutupa kile ambacho maovu yetu yangestahili.
- source_word: לֹא ... לֹא
  choice: haku- ... wala haku-
  rationale: Ukanushaji unaorudiwa umehifadhiwa katika mistari miwili iliyosawazishwa, ukisisitiza rehema ya Mungu.
theological_decisions:
- issue: Kueleza rehema ya Mungu bila kuingiza nadharia maalumu kuhusu upatanisho au wakati wa hukumu
  choice: Kauli ya jumla kwamba Mungu hakututendea kwa kipimo cha dhambi zetu wala kutulipa kwa kipimo cha maovu yetu
  alternative: Kuifanya ihusu adhabu za duniani pekee, au kuisoma kuwa inakana kila aina ya hukumu ya Mungu
  rationale: Kiebrania kinasema kwa upana kuhusu namna ya Mungu yenye rehema na kutolipa kwa kadiri ya dhambi. Tafsiri haiibani kwa matokeo ya hapa duniani wala kuipanua kuwa kukana hukumu yote; hivyo inadumisha mvutano wa kiteolojia uliomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Usambamba wa mistari miwili umehifadhiwa; ‘dhambi’ na ‘maovu’ zinatofautisha kwa kiasi istilahi mbili za Kiebrania bila kutumia msamiati mgumu.
