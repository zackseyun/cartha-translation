  yaml_path: translation/ot/psalms/103/006.yaml
  text: Yahweh works righteousness and justice for all who are oppressed[a].
translation:
  language: sw
  text: 'Yahwe hutenda matendo ya haki,

    na hukumu kwa ajili ya wote wanaokandamizwa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe hutenda haki na hukumu kwa ajili ya wote wanaokandamizwa.”
    reason: Mbadala huu unaonyesha kuwa צְדָקוֹת inaweza kutafsiriwa kwa ujumla kuwa “haki,” na מִשְׁפָּטִים kwa maana ya “hukumu.”
lexical_decisions:
- source_word: עֹשֵׂה
  choice: hutenda
  rationale: Kirai cha Kiebrania ni kitenzi-shirikishi cha Qal kinachoeleza tendo la kawaida na endelevu la Yahwe; “hutenda” huwasilisha hali hiyo kwa Kiswahili cha kawaida.
- source_word: צְדָקוֹת
  choice: matendo ya haki
  rationale: Wingi wa צְדָקוֹת hapa unaweza kumaanisha matendo ya uadilifu au ya kutekeleza haki. “Matendo ya haki” huhifadhi wingi na kutofautisha neno hili na מִשְׁפָּטִים.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kuwa “Yahwe” badala ya kubadilishwa na cheo.
- source_word: וּמִשְׁפָּטִים
  choice: na kuwapatia haki
  rationale: מִשְׁפָּטִים inaweza kumaanisha hukumu au matendo ya kutekeleza haki. Katika muktadha wa wenye kukandamizwa, “kuwapatia haki” huonyesha kwa asili tendo la Mungu la kuwatendea haki bila kulichanganya na צְדָקוֹת.
- source_word: לְכָל
  choice: wote
  rationale: לְ hapa huonyesha wanaonufaika na tendo hilo; kiambishi “-wa-” katika “kuwapatia” pamoja na “wote” huwasilisha maana ya ‘kwa wote.’
- source_word: עֲשׁוּקִים
  choice: wanaokandamizwa
  rationale: Umbo hili la kushirikisha la kutendwa linataja watu wanaoonewa, kunyonywa, au kukandamizwa; “wanaokandamizwa” ni wazi na huhifadhi hali ya kutendwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יהוה; “Yahwe” hulihifadhi badala ya kulibadilisha na cheo.
- issue: Uhusiano kati ya צְדָקוֹת na מִשְׁפָּטִים
  choice: matendo ya haki, na kuwapatia haki
  alternative: haki na hukumu
  rationale: 'Uamuzi huu huhifadhi dhana mbili zinazokaribiana lakini zisizofanana: matendo ya Mungu yaliyo ya haki na utekelezaji wake wa haki kwa waliokandamizwa.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mistari miwili unaakisi usambamba wa kishairi wa Zaburi; “kuwapatia haki” ni usemi wa kawaida unaoeleweka kwa wasomaji wengi.
