  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kishairi; tashihisi ya mahali kutambua imehifadhiwa. Viwakilishi vya ngeli vinarejelea ua la mstari uliotangulia: ''yake'' na ''nayo''; ''hapaitambui'' humrejelea ua kwa kiambishi cha yambwa ''i''.'
