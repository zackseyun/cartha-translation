base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/016.yaml
  text: For the wind passes over it[a], and it is gone[c][b], and its place knows it no more.
translation:
  language: sw
  text: Kwa maana upepo hupita juu yake[a], nayo hutoweka[b]; mahali pake hapaitambui tena[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “pumzi” au “roho” badala ya “upepo”; muktadha wa kishairi wa majani na maua unaunga mkono “upepo.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “nayo haipo.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania panapapa mahali sifa ya kibinadamu ya “kutambua” kile kilichotoweka.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaendeleza maelezo ya sababu ya mfano uliotangulia kuhusu maisha ya mwanadamu kuwa kama majani na ua.
- source_word: רוּחַ
  choice: upepo
  rationale: Katika muktadha wa kishairi wa majani na ua, maana ya upepo ndiyo inayofaa zaidi, ingawa neno pia linaweza kumaanisha pumzi au roho.
- source_word: עָבְרָה בּוֹ
  choice: hupita juu yake
  rationale: Kauli ya mazoea huwasilisha ukweli wa jumla, na 'juu yake' huhifadhi picha ya upepo kupita juu ya ua au majani.
- source_word: וְאֵינֶנּוּ
  choice: nayo hutoweka
  rationale: Kiebrania halisi ni 'nayo haipo'; 'hutoweka' ni Kiswahili cha kawaida kinachowasilisha kutokuwapo kunakofuata kupita kwa upepo.
- source_word: וְלֹא יַכִּירֶנּוּ עוֹד מְקוֹמוֹ
  choice: mahali pake hapaitambui tena
  rationale: Huhifadhi tashihisi ya Kiebrania ambamo mahali penyewe panaelezwa kuwa hakilitambui tena ua lililotoweka.
