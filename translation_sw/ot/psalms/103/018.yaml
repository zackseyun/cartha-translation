lexical_decisions:
- source_word: שֹׁמְרֵי
  choice: wale wanaolishika
  rationale: Kitenzi שׁמר kina maana ya kushika, kulinda, au kuzingatia. Katika muktadha wa agano, “kulishika” ni Kiswahili cha kawaida kinachoonyesha uaminifu na utiifu.
- source_word: בְרִיתוֹ
  choice: agano lake
  rationale: בְּרִית humaanisha agano, hasa uhusiano wa ahadi kati ya Mungu na watu wake; “agano” huhifadhi uzito wake wa kibiblia.
- source_word: וּלְזֹכְרֵי
  choice: na kwa wale wanaoyakumbuka
  rationale: זכר hapa si kukumbuka kiakili tu, bali kuyaweka maagizo akilini kwa nia ya kuyatenda. “Kuyakumbuka” huhifadhi neno la msingi huku kishazi kinachofuata kikionyesha matokeo yake ya kiutendaji.
- source_word: פִקֻּדָיו
  choice: maagizo yake
  rationale: פִּקּוּדִים hurejelea maagizo au masharti yaliyowekwa na Mungu. “Maagizo” ni neno la sasa, linaloeleweka kwa urahisi, na lisilo finyu kupita maana ya Kiebrania.
- source_word: לַעֲשׂוֹתָם
  choice: ili kuyatenda
  rationale: Muundo wa ל pamoja na jina-kitenzi unaunganisha kuyakumbuka maagizo na kuyafanya kwa vitendo. “Ili kuyatenda” huonyesha kwa Kiswahili sanifu kusudi au mwelekeo huo bila kuongeza wazo jipya.
theological_decisions:
- issue: Nguvu ya kimaadili ya “kukumbuka” maagizo ya Mungu
  choice: wanaoyakumbuka maagizo yake ili kuyatenda
  alternative: wanaokumbuka maagizo yake, kuyatenda
  rationale: Kiebrania kinaunganisha kukumbuka na kutenda. Tafsiri inaacha wazi kwamba kukumbuka huku ni kwa vitendo, bila kuingiza fundisho la wokovu kwa matendo au kuondoa msisitizo wa kifungu juu ya utiifu wa agano.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa msomaji wa kawaida. Muundo wa kirai umehifadhiwa kwa kuwa mstari huu unaendeleza sentensi ya mstari uliotangulia.
