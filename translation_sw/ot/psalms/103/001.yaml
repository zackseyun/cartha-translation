  text: Of David. Bless Yahweh[a], O my soul, and all that is within me, bless his holy name.
translation:
  language: sw
  text: 'Ya Daudi.

    Ee nafsi yangu, mbariki Yahwe; na vyote vilivyo ndani yangu, vibariki jina lake takatifu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “sehemu zangu zote za ndani,” au “utu wangu wote wa ndani.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Zaburi ya Daudi
  rationale: Kichwa hiki kinaonyesha uhusiano wa zaburi na Daudi bila kulazimisha iwapo aliitungia mwenyewe au ilihusishwa naye.
- source_word: בָּרֲכִי
  choice: mbariki / vilibariki
  rationale: Kitenzi ברך katika piel kina maana ya ‘bariki.’ Hapa ni mwito wa mshairi kwa nafsi yake na vyote vilivyo ndani yake; ‘bariki’ huhifadhi maana ya msingi badala ya kuifasiri moja kwa moja kuwa ‘sifu.’
- source_word: נַפְשִׁי
  choice: Ee nafsi yangu
  rationale: נפש hapa ni nafsi au utu wa ndani unaoambiwa moja kwa moja; ‘Ee nafsi yangu’ huhifadhi nguvu ya kishairi ya usemi huo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kwa umbo la Kiswahili ‘Yahwe,’ badala ya kubadilishwa na cheo kama ‘BWANA.’
- source_word: וְכָל קְרָבַי
  choice: vyote vilivyo ndani yangu
  rationale: קרבים kwa wingi humaanisha sehemu za ndani au utu wote wa ndani. Usemi huu ni wa kawaida na unaeleweka, huku tanbihi ikihifadhi picha halisi ya Kiebrania.
- source_word: שֵׁם קָדְשׁוֹ
  choice: jina lake takatifu
  rationale: Hili ni toleo la asili la Kiswahili la muundo ‘jina la utakatifu wake,’ likihifadhi dhana za jina na utakatifu.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi yana jina la agano יהוה moja kwa moja. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya ‘kuibariki’ Yahwe
  choice: mbariki Yahwe
  alternative: msifu Yahwe
  rationale: Neno ‘bariki’ huhifadhi chaguo la msamiati wa Kiebrania na mvutano wa kusema mwanadamu anam bariki Mungu, bila kulirahisisha kuwa ‘sifu.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Kurudiwa kwa ‘bariki’ kumehifadhiwa katika mistari sambamba; upatanisho wa kisarufi umebadilika kuwa ‘vilibariki’ kwa sababu kiima ni ‘vyote.’
