  text: כְּ/רַחֵ֣ם אָ֭ב עַל בָּנִ֑ים רִחַ֥ם יְ֝הוָ֗ה עַל יְרֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/013.yaml
  text: As a father has compassion on his children[a], so Yahweh has compassion on those who fear him.
translation:
  language: sw
  text: Kama baba anavyowahurumia watoto wake,[a] ndivyo Yahwe anavyowahurumia wanaomcha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kama baba anavyowaonea huruma wanawe, ndivyo Yahwe anavyowaonea huruma wanaomcha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרַחֵם
  choice: Kama ... anavyowahurumia
  rationale: Kiambishi כְּ kinaonyesha ulinganisho, na רחם hapa ni kuwa na huruma ya ndani na nyororo. Muundo huu ni wa kawaida katika Kiswahili na unadumisha ulinganisho wa mstari.
- source_word: אָב
  choice: baba
  rationale: Nomino hii ni ya jumla katika mfano huu; Kiswahili hakihitaji kibainishi kisicho dhahiri kama Kiingereza ‘a’.
- source_word: עַל בָּנִים
  choice: watoto wake
  rationale: בָּנִים ni wingi wa kiume kisarufi lakini hapa inarejelea watoto wa baba kwa ujumla. Kiwakilishi ‘wake’ kinaweka wazi uhusiano wa kifamilia uliodokezwa na Kiebrania.
- source_word: רִחַם
  choice: anavyowahurumia
  rationale: Kurudia kitenzi kilekile kunahifadhi ulinganifu na urudiaji wa kishairi wa רחם katika vipande vyote viwili. Wakati wa sasa unaeleza ukweli wa kawaida na wa kudumu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa moja kwa moja kwa tahajia iliyozoeleka katika Kiswahili, badala ya kubadilishwa na cheo.
- source_word: יְרֵאָיו
  choice: wanaomcha
  rationale: Hili linatafsiri moja kwa moja watu wenye sifa ya kumwogopa Mungu. ‘Kumcha’ ni Kiswahili cha kawaida cha kibiblia kinachobeba wazo la hofu pamoja na heshima bila kulainisha maana kuwa heshima pekee.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi ya Kiebrania yana jina lenyewe la Mungu. ‘Yahwe’ hulihifadhi kama jina binafsi kwa tahajia ya kawaida ya Kiswahili, badala ya kulibadilisha kuwa cheo.
- issue: Lugha ya kifamilia katika בָּנִים
  choice: watoto wake
  alternative: wanawe
  rationale: Ingawa umbo la Kiebrania ni wingi wa kiume, katika ulinganisho huu linatumika kwa uzao wa baba kwa ujumla. ‘Watoto wake’ ni wazi na halipunguzi maana kuwa wavulana pekee.
- issue: Maana ya יְרֵאָיו
  choice: wanaomcha
  alternative: wanaomheshimu
  rationale: ‘Wanaomcha’ huhifadhi mvutano wa Kiebrania kati ya hofu na heshima; ‘wanaomheshimu’ lingeondoa kipengele cha hofu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya kishairi. ‘Kuwahurumia’ ni ya kisasa na wazi; tanbihi inahifadhi mbadala ‘kuwaonea huruma’ na ‘wanawe’. Alama ya tanbihi [a] imewekwa katika matini kuu.
