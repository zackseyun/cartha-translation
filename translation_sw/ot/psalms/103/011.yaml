base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/011.yaml
  text: For as high as the heavens are above the earth[a], so great is his steadfast love toward those who fear him.
translation:
  language: sw
  text: Kwa maana, kama mbingu zilivyo juu ya dunia, ndivyo upendo wake wa kudumu[a] ulivyo mkuu kwa wale wanaomcha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “rehema yake” au “upendo wake wa uaminifu wa agano.” Neno la Kiebrania חֶסֶד linaweza kumaanisha upendo wa kudumu na mwaminifu, rehema, au uaminifu katika uhusiano wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au ufafanuzi wa sifa iliyotangulia, na “kwa maana” kinafaa katika mtiririko wa kishairi.
- source_word: כִגְבֹהַּ שָׁמַיִם עַל־הָאָרֶץ
  choice: kama mbingu zilivyo juu sana kuliko dunia
  rationale: Muundo wa ulinganisho unaonyesha kiwango kisichopimika cha urefu wa mbingu juu ya dunia; Kiswahili hiki ni cha asili na kinadumisha taswira ya kishairi.
- source_word: גָּבַר
  choice: ulivyo mkuu
  rationale: Kitenzi kina maana ya kuwa na nguvu, kushinda, au kuwa mkuu. Hapa kinaeleza ukubwa wenye nguvu wa upendo wa Mungu bila kuingiza wazo lisilo la lazima la mapambano.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד huunganisha upendo, rehema, uaminifu, na ushikamanifu wa agano. “Upendo thabiti” huhifadhi kwa lugha inayoeleweka wazo la upendo wa kudumu na mwaminifu.
- source_word: עַל־יְרֵאָיו
  choice: kwa wale wanaomcha
  rationale: עַל hapa huelekeza upendo kwa walengwa wake, nayo יְרֵאָיו ni wale wenye tabia ya kumcha Mungu. “Wanaomcha” huhifadhi nguvu ya neno huku ikiruhusu maana ya hofu yenye staha.
theological_decisions:
- issue: Tafsiri ya חֶסֶד katika muktadha wa huruma na uaminifu wa Bwana
  choice: upendo wake thabiti
  alternative: rehema zake; upendo wake wa agano; fadhili zake za kudumu
  rationale: Chaguo hili hudumisha kwa pamoja hisia ya upendo na uaminifu wa kudumu bila kupunguza neno kuwa rehema pekee wala kulifanya kuwa istilahi nzito isiyo ya kawaida.
- issue: Maana ya ירא kuhusu uhusiano na Mungu
  choice: wanaomcha
  alternative: wanaomheshimu kwa kicho
  rationale: Tafsiri ya moja kwa moja “wanaomcha” huhifadhi mvutano wa neno la Kiebrania, ambalo linajumuisha hofu na staha, badala ya kulainisha maana kuwa heshima tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Ulinganisho wa “kama ... ndivyo ...” umehifadhiwa, na “juu sana kuliko dunia” hufanya uhusiano wa wima uwe wazi.
