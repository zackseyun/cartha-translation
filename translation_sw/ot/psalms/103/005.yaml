lexical_decisions:
- source_word: הַמַּשְׂבִּיעַ
  choice: anayekushibisha
  rationale: Kitenzi cha Hifili kutoka שׂבע kina maana ya kumtosheleza mtu kikamilifu. “Anayekushibisha” ni cha kawaida na kinaendeleza mfululizo wa matendo ya BWANA.
- source_word: בַּטּוֹב
  choice: kwa mema
  rationale: טוֹב limetumiwa kama nomino ya kijumla. “Kwa mema” huhifadhi ufupi na upana wa Kiebrania bila kutaja vitu fulani.
- source_word: עֶדְיֵךְ
  choice: -ku- katika “anayekushibisha”
  rationale: Neno hilo kwa kawaida humaanisha “pambo lako,” lakini kishazi hiki ni kigumu. Tafsiri ya kimuktadha humtaja anayeshibishwa moja kwa moja, huku maana halisi na mapokeo mbadala yakihifadhiwa katika tanbihi.
- source_word: תִּתְחַדֵּשׁ
  choice: ufanywe upya
  rationale: Muundo wa Hitpaeli una maana ya kutendwa au kujirejelea. Kauli “ufanywe upya” ni ya asili katika Kiswahili na haiamui wazi mtendaji ambaye hakutajwa katika kishazi hiki.
- source_word: כַּנֶּשֶׁר
  choice: kama wa tai
  rationale: נֶשֶׁר ni ndege mkubwa wa kuwinda, ambaye kwa mapokeo hutafsiriwa “tai.” Muundo “kama wa tai” unaunganisha ulinganisho huo na “ujana wako.”
- source_word: נְעוּרָיִכִי
  choice: ujana wako
  rationale: Nomino hii ya dhahania humaanisha ujana au nguvu za ujana. “Ujana wako” huhifadhi picha ya kishairi bila kuibana kuwa umri tu.
