  edition: WLC
  text: וְ/חֶ֤סֶד יְהוָ֨ה מֵ/עוֹלָ֣ם וְ/עַד ע֭וֹלָם עַל יְרֵאָ֑י/ו וְ֝/צִדְקָת֗/וֹ לִ/בְנֵ֥י בָנִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/017.yaml
  text: But the steadfast love of Yahweh is from everlasting to everlasting on those who fear him[a], and his righteousness to children's children.
translation:
  language: sw
  text: 'Lakini upendo mwaminifu wa Yahwe ni tangu milele hata milele kwa wale wanaomcha,

    na uadilifu wake[a] kwa watoto wa watoto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “haki yake.” Neno la Kiebrania linaweza kuwa na maana zote mbili katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחֶסֶד
  choice: Lakini upendo mwaminifu
  rationale: חֶסֶד hueleza upendo wa kudumu, ulio mwaminifu na wenye ushikamanifu. “Upendo mwaminifu” ni Kiswahili cha sasa kinachobeba maana hiyo bila kutumia istilahi nzito; וְ limetafsiriwa “Lakini” ili kuonyesha tofauti na ufupi wa maisha ya mwanadamu katika mstari uliotangulia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kama “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: מֵעוֹלָם וְעַד עוֹלָם
  choice: tangu milele hata milele
  rationale: Usemi huu wa kishairi unaonyesha muda usio na mpaka kuelekea nyuma na mbele. “Tangu milele hata milele” huhifadhi muundo na nguvu ya kishairi ya Kiebrania.
- source_word: עַל
  choice: kwa
  rationale: Katika muktadha huu עַל huonyesha watu ambao upendo wa Yahwe unawaelekea au unakaa juu yao. “Kwa” ni ya kawaida na ya asili katika Kiswahili.
- source_word: יְרֵאָיו
  choice: wale wanaomcha
  rationale: Kitenzi hiki kina maana ya wale wanaomwogopa Mungu kwa hofu yenye heshima na unyenyekevu. “Wanaomcha” ni usemi wa kawaida wa kibiblia na haupunguzi maana kuwa heshima tu.
- source_word: וְצִדְקָתוֹ
  choice: na haki yake
  rationale: צְדָקָה inaweza kumaanisha uadilifu au haki. “Haki yake” inahifadhi upana wa tabia yake iliyo sawa na matendo yake ya haki; uwezekano wa “uadilifu wake” umeonyeshwa katika tanbihi.
- source_word: לִבְנֵי בָנִים
  choice: huwafikia watoto wa watoto wao
  rationale: Kiebrania kinasema kihalisi “kwa watoto wa watoto.” “Watoto wa watoto wao” huhifadhi taswira ya vizazi kuliko “wazao,” huku “huwafikia” ikikamilisha kishazi kwa Kiswahili cha asili bila kubadili uhusiano wa maana.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko lina jina la agano יהוה moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya צִדְקָה katika muktadha huu wa kishairi
  choice: haki yake
  alternative: uadilifu wake
  rationale: Neno hili linaweza kuonyesha hali ya kuwa sawa kimaadili pamoja na utekelezaji wa haki. “Haki yake” linafaa katika usambamba na upendo mwaminifu, huku tanbihi ikihifadhi maana mbadala ya “uadilifu wake.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mstari umegawanywa katika vipande viwili ili kuonyesha usambamba wa zaburi. Usemi “watoto wa watoto wao” umehifadhi taswira ya vizazi ya Kiebrania.
