id: PSA.103.19
reference: Psalms 103:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: יְֽהוָ֗ה בַּ֭/שָּׁמַיִם הֵכִ֣ין כִּסְא֑/וֹ וּ֝/מַלְכוּת֗/וֹ בַּ/כֹּ֥ל מָשָֽׁלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/019.yaml
  text: Yahweh has established his throne in the heavens[b][a], and his kingdom rules over all.
translation:
  language: sw
  text: 'Yahwe amekiweka imara kiti chake cha enzi mbinguni[a],

    na ufalme wake[b] unatawala juu ya vyote.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “katika mbingu,” katika umbo la wingi.
    reason: lexical_alternative
  - marker: b
    text: Au, “utawala wake wa kifalme” au “kutawala kwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Imetafsiriwa kwa umbo la kawaida la Kiswahili la jina la Mungu, badala ya kulibadilisha kuwa cheo kama “Bwana”.
- source_word: בַּשָּׁמַיִם
  choice: mbinguni
  rationale: Ni usemi wa asili na wenye hadhi katika Kiswahili; neno la Kiebrania lina umbo la wingi, jambo linaloelezwa katika tanbihi.
- source_word: הֵכִין
  choice: amekiweka imara
  rationale: Huwasilisha maana ya kusimamisha au kuthibitisha kwa uthabiti, na pia hudumisha hali ya tendo lililotimizwa yenye matokeo ya kudumu.
- source_word: כִּסְאוֹ
  choice: kiti chake cha enzi
  rationale: Huu ndio usemi wa kawaida wa Kiswahili kwa kiti cha kifalme katika muktadha wa utawala.
- source_word: וּמַלְכוּתוֹ
  choice: na ufalme wake
  rationale: “Ufalme” ni tafsiri ya kawaida na ya kueleweka, huku maana mbadala za mamlaka ya kifalme au utawala zikihifadhiwa katika tanbihi.
- source_word: בַּכֹּל
  choice: juu ya vyote
  rationale: Pamoja na kitenzi cha kutawala, usemi huu unaonyesha upeo wa mamlaka juu ya kila kitu.
- source_word: מָשָׁלָה
  choice: unatawala
  rationale: Wakati wa sasa unaeleza ukweli wa kudumu wa kishairi kuhusu utawala wa Mungu, badala ya kuufunga kwenye tendo la zamani pekee.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Bwana au Yehova
  rationale: Jina binafsi limehifadhiwa kwa umbo linalofaa Kiswahili badala ya kubadilishwa kuwa cheo.
- issue: Hali ya tendo katika מָשָׁלָה
  choice: unatawala
  alternative: umetawala au ulitawala
  rationale: Kauli ya kishairi inaeleza hali endelevu ya mamlaka ya Mungu; wakati wa sasa unawasilisha maana hiyo kwa Kiswahili cha kawaida bila kukana umbo la Kiebrania.
- issue: Maana ya מַלְכוּת
  choice: ufalme
  alternative: ufalme wake wa kifalme au utawala wake
  rationale: Neno la Kiebrania linaweza kumaanisha eneo la ufalme, hadhi ya kifalme, au utawala. “Ufalme” ni wa kawaida, na tanbihi inahifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa mistari unadumisha uwiano wa kishairi kati ya kiti cha enzi cha Yahwe na ufalme wake.
