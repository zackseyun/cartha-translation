  text: He will not contend forever[b][a], nor will he keep his anger for all time.
translation:
  language: sw
  text: Hatateta daima[a], wala hatahifadhi hasira yake milele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hatalaumu daima” au “Hatashindana daima.” Kitenzi cha Kiebrania kinaweza kumaanisha kuteta, kushindana, kulaumu, au kuendesha shauri.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi, “wala hatahifadhi milele,” bila kutaja wazi kinachohifadhiwa. Katika muktadha huu maana ni kuhifadhi hasira, kushikilia kinyongo, au kudumisha ghadhabu.
