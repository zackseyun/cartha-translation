lexical_decisions:
- source_word: לָנֶצַח
  choice: daima
  rationale: Kirai hiki huonyesha muda unaoendelea bila kikomo. “Daima” ni Kiswahili cha kawaida na kinaendana na ulinganifu wa kishairi wa לְעוֹלָם.
- source_word: יָרִיב
  choice: atateta
  rationale: Kitenzi ריב kinaweza kumaanisha kushindana, kubishana, kulaumu, au kuendesha shauri. “Kuteta” kinahifadhi wazo pana la kuwa na ugomvi au hoja dhidi ya mwingine bila kulifanya kuwa shauri rasmi la mahakama.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Neno עוֹלָם huonyesha muda usio na mwisho unaoonekana au muda wa kudumu. “Milele” ni tafsiri ya asili na yenye hadhi katika mstari huu.
- source_word: יִטּוֹר
  choice: ataweka hasira yake
  rationale: Katika muktadha huu נטר humaanisha kuhifadhi au kushikilia hasira, yaani kuweka kinyongo. Kiswahili huhitaji kitu cha kitenzi ili maana hii iwe wazi na ya kawaida; “hasira yake” imetolewa wazi ingawa imeachwa kudokezwa katika Kiebrania.
theological_decisions:
- issue: Iwapo kitu ambacho Mungu anakihifadhi kitajwe wazi
  choice: Kutaja “hasira yake” katika maandishi kwa ajili ya Kiswahili cha kawaida, huku tanbihi ikieleza kwamba Kiebrania hakitaji kitu hicho moja kwa moja.
  alternative: “Wala hataweka milele,” kwa kuacha kitu cha kitenzi bila kutajwa kama katika Kiebrania.
  rationale: Muktadha na matumizi ya נטר yanaonyesha kuhifadhi hasira au kuweka kinyongo, lakini Kiebrania kinaacha kitu cha kitenzi kikiwa kimedokezwa. Kukitaja katika Kiswahili kunazuia sentensi isiyo kamili, bila kudai kwamba neno “hasira” limeandikwa wazi katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wa sasa na wenye hadhi. “Hatateta” huhifadhi ufupi na upana wa kitenzi cha Kiebrania; “ataweka hasira yake” ni wazi kwa msomaji wa kawaida huku tanbihi ikihifadhi udokezi wa maandishi ya chanzo.
