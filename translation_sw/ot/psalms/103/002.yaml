lexical_decisions:
- source_word: בָּרֲכִי
  choice: mbariki
  rationale: Amri ya umoja wa kike inayoelekezwa kwa nafsi ya mtunga zaburi; “mbariki” huhifadhi maana ya kidini ya ברך na ni ya kawaida katika Kiswahili cha Biblia.
- source_word: נַפְשִׁי
  choice: Ee nafsi yangu
  rationale: נפש hapa ni mtu mwenyewe anayejisemeza; “Ee nafsi yangu” huonyesha wazi usemi wa moja kwa moja na mtindo wa kishairi.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetafsiriwa kwa kulitaja kama Yahweh, bila kulibadili kuwa cheo.
- source_word: וְאַל תִּשְׁכְּחִי
  choice: wala usisahau
  rationale: Huonyesha kiunganishi pamoja na katazo, na pia huendeleza maelekezo yanayoelekezwa kwa nafsi.
- source_word: כָּל
  choice: yote
  rationale: Huhifadhi nguvu jumuishi ya כָּל.
- source_word: גְּמוּלָיו
  choice: mema yote aliyokutendea
  rationale: גמול inaweza kumaanisha matendo, malipo, au mema anayopokea mtu. Muktadha wa shukrani na orodha inayofuata unapendelea maana chanya; usemi huu ni wa asili na unaeleweka kwa urahisi katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Upana wa maana ya גְּמוּלָיו
  choice: mema yote aliyokutendea
  alternative: matendo yake yote au malipo yake yote
  rationale: Neno lenyewe lina upana wa maana, lakini muktadha unaofuata unaorodhesha matendo ya neema ya Yahweh. Maana hiyo chanya imewekwa katika mstari, huku uwezekano mpana ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Ee nafsi yangu” huhifadhi mtindo wa mtu kujisemeza; “wala usisahau” ni katazo la asili na lenye uzito. Kiwakilishi cha yule anayeambiwa kimewekwa katika “aliyokutendea” ili maana ya גְּמוּלָיו iwe wazi kwa msomaji wa kawaida.
