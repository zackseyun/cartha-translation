  text: Ee nafsi yangu, mbariki Yahweh, wala usisahau fadhila zake zote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “matendo yake yote” au “malipo yake yote.” Neno la Kiebrania linaweza kumaanisha kwa upana yale anayopokea mtu kutoka kwa mwingine, lakini hapa muktadha unapendelea maana chanya: “fadhila.”'
