  yaml_path: translation/ot/psalms/103/015.yaml
  text: As for man[a], his days are like grass; he flourishes like a flower of the field.
translation:
  language: sw
  text: Mwanadamu, siku zake ni kama nyasi; kama ua la shambani, ndivyo anavyochanua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: Mwanadamu
  rationale: Neno hili humaanisha binadamu, hasa likidokeza udhaifu na hali yake ya kufa. “Mwanadamu” ni neno la kawaida, lenye heshima, na linadumisha umoja wa picha ya kishairi bila kuongeza waziwazi maana ya ‘mwenye kufa.’
- source_word: כֶּחָצִיר
  choice: kama majani
  rationale: Kiambishi כְּ kinaonyesha ulinganisho. “Majani” ni usemi wa kawaida wa Kiswahili unaoweza kutaja mimea ya majani kwa ujumla na unafaa kwa picha ya maisha yanayokua na kunyauka upesi.
- source_word: יָמָיו
  choice: siku zake
  rationale: Hii inafuata moja kwa moja nomino ya wingi yenye kiambishi cha nafsi ya tatu umoja na kudumisha nahau ya Kiebrania inayomaanisha muda wa maisha yake.
- source_word: כְּצִיץ הַשָּׂדֶה
  choice: kama ua la shambani
  rationale: צִיץ ni ua au chipukizi lenye kuchanua, na הַשָּׂדֶה ni shamba au uwanda. “Ua la shambani” ni la asili katika Kiswahili na haliongezi maelezo yasiyokuwamo katika Kiebrania.
- source_word: כֵּן
  choice: ndivyo
  rationale: Neno hili linamaanisha ‘hivyo/ndivyo’ na linaunganisha kwa uwazi mwanadamu na mfano wa ua katika muundo wa kishairi wa Kiswahili.
- source_word: יָצִיץ
  choice: anavyochanua
  rationale: Kitenzi kinaibua picha ya kuchipua au kuchanua kwa ua. “Anavyochanua” kinadumisha picha hiyo huku kikimrejesha msomaji kwa “mwanadamu” kama mhusika wa ulinganisho.
theological_decisions:
- issue: Udhaifu na upitaji wa maisha ya mwanadamu
  choice: Kudumisha mifano ya majani na ua bila kuongeza maneno kama ‘mwenye kufa’ au ‘hunyauka upesi.’
  alternative: Kufafanua moja kwa moja kwamba mwanadamu ni mwenye kufa na maisha yake ni mafupi.
  rationale: Mstari wenyewe unawasilisha hali hiyo kwa picha ya kishairi; ufafanuzi wa moja kwa moja ungeongeza jambo ambalo limeachwa lidokezwe katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Alama ya mkato baada ya “Mwanadamu” inaakisi ufunguzi wa kishairi wa mada, na mpangilio wa sentensi unahifadhi ulinganifu wa vipande viwili vya mstari.
