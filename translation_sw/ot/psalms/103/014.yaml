  text: כִּי ה֖וּא יָדַ֣ע יִצְרֵ֑/נוּ זָ֝כ֗וּר כִּי עָפָ֥ר אֲנָֽחְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/014.yaml
  text: For he knows our frame[a]; he remembers that we are dust.
translation:
  language: sw
  text: Kwa maana yeye anajua jinsi tulivyoumbwa[a]; anakumbuka kwamba sisi ni mavumbi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “muundo wetu” au “namna tulivyofanyizwa.” Neno la Kiebrania linahusu kitu kilichofinyangwa au kufanyizwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu au ufafanuzi wa kauli iliyotangulia kwa Kiswahili cha kawaida.
- source_word: הוּא
  choice: yeye
  rationale: Kiwakilishi cha wazi katika Kiebrania kimehifadhiwa ili kuonyesha msisitizo; katika muktadha kinamrejelea Mungu.
- source_word: יָדַע
  choice: anajua
  rationale: Kauli timilifu hapa inaeleza ujuzi wa kudumu wa Mungu; wakati wa sasa unasikika kiasili katika Kiswahili.
- source_word: יִצְרֵנוּ
  choice: jinsi tulivyoumbwa
  rationale: Neno linahusu kile kilichofinyangwa au namna ya kufanyizwa; tafsiri hii ni wazi kwa wasomaji wa sasa huku ikihifadhi wazo la kuwa viumbe.
- source_word: זָכוּר
  choice: anakumbuka
  rationale: Ingawa umbo la Kiebrania ni la kihusishi/kivumishi, katika muktadha linaeleza kukumbuka kwa Mungu kunakoendelea na kusawazisha kishazi cha kwanza.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa linaanzisha yaliyomo katika kile ambacho Mungu anakumbuka.
- source_word: עָפָר
  choice: mavumbi
  rationale: Huhifadhi picha ya Kiebrania inayohusishwa na kuumbwa kwa mwanadamu, udhaifu, na kufa.
- source_word: אֲנָחְנוּ
  choice: sisi ni
  rationale: Kiswahili huhitaji kiunganishi cha kisarufi ili kutoa kishazi cha kawaida, ‘sisi ni mavumbi.’
theological_decisions:
- issue: Taswira ya mwanadamu kuwa mavumbi
  choice: sisi ni mavumbi
  alternative: sisi si kitu ila mavumbi
  rationale: Tafsiri iliyochaguliwa huhifadhi moja kwa moja taswira ya udhaifu na hali ya mwanadamu kuwa kiumbe bila kuongeza msisitizo wa kudunisha usiomo wazi katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Jinsi tulivyoumbwa’ ni wazi zaidi kwa watu wa kawaida kuliko ‘umbile letu,’ huku tanbihi ikihifadhi upeo wa maana ya neno la Kiebrania.
