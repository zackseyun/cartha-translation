id: PSA.103.21
reference: Psalms 103:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בָּרֲכ֣וּ יְ֭הוָה כָּל צְבָאָ֑י/ו מְ֝שָׁרְתָ֗י/ו עֹשֵׂ֥י רְצוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/021.yaml
  text: Bless Yahweh[a], all his hosts, his ministers[b], who do his will.
translation:
  language: sw
  text: Mbarikini Yahwe, enyi majeshi yake yote,[a] enyi watumishi wake,[b] mnaofanya mapenzi yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “majeshi yake ya mbinguni.”
    reason: lexical_alternative
  - marker: b
    text: Au “wale wanaomhudumia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרֲכוּ
  choice: Mbarikini
  rationale: Kauli ya amri ya wingi inaelekezwa kwa viumbe wa mbinguni; ‘mbarikini’ inadumisha kibwagizo kinachorudiwa katika Zaburi hii kuliko ‘msifuni’.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: כָּל צְבָאָיו
  choice: majeshi yake yote
  rationale: צָבָא humaanisha jeshi au kundi la majeshi; katika muktadha huu huenda ni jeshi la mbinguni, lakini tafsiri haifungi maana hiyo pekee.
- source_word: מְשָׁרְתָיו
  choice: watumishi wake
  rationale: Neno hili hutaja wanaohudumu au kutumikia, mara nyingi katika huduma rasmi. ‘Watumishi’ ni la asili na wazi kwa msomaji wa Kiswahili.
- source_word: עֹשֵׂי רְצוֹנוֹ
  choice: mnaofanya mapenzi yake
  rationale: Kirai cha kisifa kimetafsiriwa kwa nafsi ya pili ili kiendelee kwa kawaida na mwito ‘enyi watumishi wake’; רָצוֹן hapa ni yale anayotaka au yanayompendeza.
theological_decisions:
- issue: Wanaorejelewa na ‘majeshi yake’ na ‘watumishi wake’
  choice: Maneno yameachwa mapana, huku muktadha ukidokeza viumbe au wahudumu wa mbinguni.
  alternative: Watumishi wa Mungu duniani kwa maana pana.
  rationale: Mstari uliotangulia unawataja malaika, hivyo uwezekano mkubwa ni kwamba mwito unaendelea kuelekezwa kwa baraza la mbinguni; hata hivyo, Kiebrania chenyewe hakitumii hapa neno maalumu la ‘malaika’.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. ‘Enyi’ inaonyesha wazi kwamba makundi hayo ndiyo yanayoamriwa, na urudiaji wake unafaa mtindo wa kishairi wa mstari.
