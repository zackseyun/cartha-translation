  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: amri ya wingi ya kumbariki Yahwe inaelekezwa kwa “majeshi yake yote,” kisha kwa “watumishi wake” wanaofanya mapenzi yake. Haibani bila lazima utambulisho wa wahudumu hawa kuwa malaika, ingawa muktadha unadokeza hivyo.'
