  text: Of David. Bless the LORD, O my soul, and all that is within me[a], bless his holy name.
translation:
  language: sw
  text: Ya Daudi. Ee nafsi yangu, umbariki BWANA; na vyote vilivyo ndani yangu[a], vibariki jina lake takatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “sehemu zangu zote za ndani,” au “utu wangu wote wa ndani.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Kichwa hiki kinaweza kuonyesha utunzi, uhusiano, au wakfu kwa Daudi; tafsiri fupi inadumisha upana huo wa maana.
- source_word: בָּרֲכִי
  choice: umhimidi / vilihimidi
  rationale: Katika muktadha wa mwanadamu kumwelekea Mungu, kitenzi ברך kina maana ya kumsifu au kumhimidi; 'himidi' ni ya asili na yenye heshima katika Kiswahili.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: Hifadhi picha ya mshairi akijisemeza mwenyewe kwa ujumla wa utu wake.
- source_word: כָל־קְרָבַי
  choice: vyote vilivyo ndani yangu
  rationale: Usemi huu wa asili una maana halisi ya sehemu zote za ndani, lakini kimuktadha unamaanisha utu wote wa ndani; tafsiri hii ni wazi huku tanbihi ikihifadhi picha halisi.
- source_word: שֵׁם קָדְשׁוֹ
  choice: jina lake takatifu
  rationale: Hufuata muundo wa Kiebrania na kuhifadhi maana ya jina linalowakilisha tabia na utambulisho wa Mungu.
theological_decisions:
- issue: Uwakilishi wa jina la agano יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: BWANA kwa herufi kubwa hufuata desturi pana ya Biblia za Kiswahili ya kuonyesha Tetragramatoni bila kuingiza matamshi yanayobishaniwa katika matini kuu.
- issue: Maana ya kichwa לְדָוִד
  choice: Ya Daudi
  alternative: Zaburi ya Daudi / Kwa ajili ya Daudi
  rationale: Kiambishi לְ kinaweza kueleza utunzi, uhusiano, au wakfu; 'Ya Daudi' hakifungi tafsiri kwa uwezekano mmoja tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. 'Naam' linaendeleza msisitizo wa mstari bila kufanya sentensi iwe nzito; viambishi vya amri vinakubaliana na 'nafsi' na 'vyote'.
