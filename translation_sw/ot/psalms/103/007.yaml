lexical_decisions:
- source_word: יוֹדִיעַ
  choice: alimjulisha
  rationale: Hifili ya ידע ina maana ya kusababisha mtu ajue au kumjulisha. “Alimjulisha” ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya kisababishi; katika kishazi cha pili kitenzi hicho kinaeleweka bila kurudiwa.
- source_word: דְּרָכָיו
  choice: njia zake
  rationale: Neno דֶּרֶךְ lina maana halisi ya njia, lakini hapa ni sitiari ya namna au mwenendo wa Mungu katika kutenda. “Njia zake” huhifadhi sitiari ya Kiebrania na ni nahau ya kibiblia inayoeleweka.
- source_word: לְמֹשֶׁה
  choice: Musa
  rationale: Kiambishi לְ kinamtaja Musa kuwa mpokeaji wa ufunuo; katika Kiswahili uhusiano huo unaonyeshwa kiasili na muundo wa kitenzi “alimjulisha Musa.”
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hili ni jina la pamoja lenye maana halisi ya wazao au wana wa Israeli. “Wana wa Israeli” linakaribia muundo wa Kiebrania na ni usemi wenye hadhi unaoeleweka katika Kiswahili; mbadala wa kiidioma zaidi umetajwa katika tanbihi.
- source_word: עֲלִילוֹתָיו
  choice: matendo yake
  rationale: Neno hili humaanisha matendo au shughuli za mtu. “Matendo yake” ni wazi na haliongezi wazo la kwamba yalikuwa matendo makuu, ambalo halijaonyeshwa wazi na neno lenyewe.
theological_decisions:
- issue: Usemi wa pamoja wenye umbo la kiume בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: watu wa Israeli
  rationale: Usemi wa Kiebrania ni jina la kikundi katika wingi wa kiume. “Wana wa Israeli” huhifadhi picha ya ukoo bila kudai kwamba wanaume pekee ndio waliokusudiwa; “watu wa Israeli” ni wazi zaidi kama jina la taifa lakini hufifisha picha hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Kiunganishi “na” kinaweka wazi ulinganifu wa mistari miwili, huku kitenzi cha kishazi cha pili kikieleweka kutokana na kishazi cha kwanza.
