  text: Alimjulisha Musa njia zake, na aliwajulisha wana wa Israeli[a] matendo yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watoto wa Israeli” au “watu wa Israeli.”
