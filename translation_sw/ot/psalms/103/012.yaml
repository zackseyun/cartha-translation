base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/012.yaml
  text: As far as the east is from the west[b][a], so far he has removed our transgressions from us.
translation:
  language: sw
  text: Kama mashariki ilivyo mbali na magharibi, ndivyo alivyoyaweka maasi yetu mbali nasi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndivyo alivyoondoa maasi yetu mbali nasi.” Neno lililotafsiriwa “maasi” linaweza pia kumaanisha “makosa ya kuvunja sheria” au “uasi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּרְחֹק
  choice: Kama ... ilivyo mbali
  rationale: Muundo huu unaanzisha ulinganisho wa umbali na unasikika kwa kawaida katika Kiswahili.
- source_word: מִזְרָח מִמַּעֲרָב
  choice: mashariki ... na magharibi
  rationale: Jozi hii ya pande mbili inadumisha taswira ya umbali mkubwa sana kati ya mashariki na magharibi.
- source_word: הִרְחִיק
  choice: alivyoyaweka ... mbali
  rationale: Hifili ya רחק ina maana ya kufanya kitu kiwe mbali au kukiondoa; usemi huu unahifadhi maana ya kisababishi na taswira ya nafasi.
- source_word: מִמֶּנּוּ
  choice: nasi
  rationale: Kiambishi cha nafsi ya kwanza wingi kinaonyesha wazi kwamba makosa yametenganishwa na jamii inayosema zaburi.
- source_word: פְּשָׁעֵינוּ
  choice: makosa yetu
  rationale: Neno פשע linaweza kumaanisha makosa mazito, uasi, au uvunjaji wa mipaka. 'Makosa yetu' ni la kawaida na lenye heshima, huku tanbihi ikihifadhi uzito wa maana ya uasi.
theological_decisions:
- issue: Taswira ya nafasi kuhusu msamaha
  choice: Kudumisha ulinganisho wa mashariki na magharibi na kusema Mungu ameweka makosa mbali nasi.
  alternative: Kufafanua kwa ujumla tu kwamba Mungu ametusamehe.
  rationale: Kiebrania kinatumia wazi taswira ya umbali na kuitumia kueleza kuondolewa kwa makosa; kuitunza kunasisitiza ukamilifu wa msamaha bila kueleza zaidi ya matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa ulinganisho umewekwa wazi bila kuwa mzito; tanbihi huhifadhi mbadala wa kitenzi na upana wa maana ya פשע.
