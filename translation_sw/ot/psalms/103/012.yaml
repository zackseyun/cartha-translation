review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the east–west comparison, the causative force of הִרְחִיק (“has made far/put far away”), and the first-person plural relationship (“from us”). However, “makosa” is too broad for פְּשָׁעֵינוּ, which specifically carries the sense of transgressions or rebellions.
  naturalness: The comparative construction is natural Standard East African Swahili and retains an appropriately elevated psalmic register. “Alivyoyaweka … mbali nasi” is idiomatic and preserves the spatial metaphor.
  terminology: Replace “makosa yetu” with “maasi yetu.” In this context, “maasi” more accurately conveys the deliberate/covenantal weight of פֶּשַׁע without adding doctrinal interpretation. The footnote’s alternative “alivyoondoa makosa yetu kwetu” is not idiomatic for separation; “mbali nasi” is required.
  issues:
  - severity: medium
    issue: “Makosa yetu” understates פְּשָׁעֵינוּ.
    rationale: Makosa can denote mistakes or general faults, whereas the Hebrew פֶּשַׁע denotes transgressions/rebellions. “Maasi” better preserves the source term’s moral force.
  - severity: medium
    issue: The footnote alternative “alivyoondoa makosa yetu kwetu” has an incorrect/unnatural directional expression.
    rationale: Kiswahili “kwetu” means ‘to/at our place’ rather than separation from us. The Hebrew מִמֶּנּוּ requires “mbali nasi” (or “kutoka kwetu”).
  revised_text: Kama mashariki ilivyo mbali na magharibi, ndivyo alivyoyaweka maasi yetu mbali nasi.[a]
