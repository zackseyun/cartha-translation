    reason: lexical_alternative
  revision_rationale: The revision retains the Hebrew comparison and its metaphor of complete removal while using “maasi” for the more specific force of פְּשָׁעֵינוּ. It also corrects the footnote’s directional phrasing so that it accurately expresses removal from the speakers.
