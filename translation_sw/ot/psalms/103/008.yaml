lexical_decisions:
- source_word: רַחוּם
  choice: mwenye huruma
  rationale: Huwasilisha hali ya kuwa na huruma ya ndani kwa lugha ya kawaida na yenye heshima; pia hubaki tofauti na חַנּוּן.
- source_word: חַנּוּן
  choice: mwenye neema
  rationale: Hudumisha wazo la kutoa fadhili bila kustahili na ni usemi unaotambulika katika Kiswahili cha Biblia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni unukuzi wa kawaida wa Kiswahili wa jina binafsi la Mungu katika Tetragramatoni, badala ya kulibadili kuwa cheo.
- source_word: אֶרֶךְ אַפַּיִם
  choice: si mwepesi wa hasira
  rationale: Ni tafsiri ya kimaanawi na ya asili ya nahau ya Kiebrania, inayomaanisha kuchelewa kukasirika.
- source_word: רַב
  choice: amejaa
  rationale: Katika muundo huu huonyesha wingi mkubwa; “amejaa” ni ya asili na huunganika vizuri na nomino inayofuata.
- source_word: חָסֶד
  choice: upendo mwaminifu
  rationale: Hukusanya vipengele vya upendo, uaminifu na ushikamanifu vilivyomo katika neno hili, bila kulifunga kwenye mfumo finyu wa kiteolojia.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: YEHOVA; BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu, hivyo limedumishwa kama jina badala ya kubadilishwa kuwa cheo.
- issue: Maana pana ya חָסֶד
  choice: upendo mwaminifu
  alternative: upendo thabiti; fadhili za agano; rehema
  rationale: Chaguo hili linadumisha kwa pamoja upendo na uaminifu wa kudumu, huku tanbihi ikihifadhi uwezekano wa maana ya kiagano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ni rahisi kueleweka kwa wasomaji wa kawaida, huku urudiaji wa “mwenye” ukitofautisha kwa uwazi sifa mbili za kwanza. Jina “Yahwe” limetumiwa kwa tahajia ya Kiswahili.
