  text: Yahwe ni mwenye huruma[a] na mwenye neema, si mwepesi wa hasira, naye ni mwingi wa upendo mwaminifu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwenye rehema.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania חָסֶד mara nyingi humaanisha upendo wenye uaminifu na ushikamanifu, hasa katika uhusiano wa agano; pia linaweza kutafsiriwa “upendo thabiti” au “uaminifu wa agano.”
