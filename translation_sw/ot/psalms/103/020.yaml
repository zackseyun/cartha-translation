  variant: Standard East African Swahili
source:
  edition: WLC
  text: בָּרֲכ֥וּ יְהוָ֗ה מַלְאָ֫כָ֥י/ו גִּבֹּ֣רֵי כֹ֭חַ עֹשֵׂ֣י דְבָר֑/וֹ לִ֝/שְׁמֹ֗עַ בְּ/ק֣וֹל דְּבָרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/020.yaml
  text: Bless Yahweh[a], his angels, mighty in strength, who do his word[b], obeying the voice of his word.
translation:
  language: sw
  text: Mbarikini Yahweh, enyi malaika wake wenye nguvu kuu, mnaotenda neno lake, mkiitii sauti ya neno lake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri ya moja kwa moja zaidi: “mkisikiliza sauti ya neno lake.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרֲכוּ
  choice: Mbarikini
  rationale: Ni amri ya wingi inayowaelekea malaika. “Mbarikini” inadumisha mwito unaorudiwa katika Zaburi 103 bila kuupanua kuwa sifa kwa ujumla tu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi, si kubadilishwa na cheo.
- source_word: מַלְאָכָיו
  choice: malaika wake
  rationale: Katika muktadha huu wa viumbe wa mbinguni, neno hili linamaanisha malaika, si wajumbe wa kibinadamu.
- source_word: גִּבֹּרֵי כֹחַ
  choice: wenye nguvu kuu
  rationale: Usemi huu wa kawaida na wenye heshima unaonyesha uwezo mkubwa bila kuingiza wazo la kijeshi lisilolazimishwa na matini.
- source_word: עֹשֵׂי דְבָרוֹ
  choice: mnaotenda neno lake
  rationale: Kauli ya pili inawaelekea malaika moja kwa moja na kuhifadhi kitenzi “kutenda” pamoja na kurudiwa kwa “neno lake.”
- source_word: לִשְׁמֹעַ בְּקוֹל דְּבָרוֹ
  choice: mkiitii sauti ya neno lake
  rationale: Katika Kiebrania, kusikia sauti mara nyingi kunajumuisha kuitikia kwa utii. Tafsiri hii ni ya kawaida kwa Kiswahili huku ikihifadhi taswira ya “sauti” na “neno.”
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ina jina binafsi la Mungu; kulitaja kama Yahweh hulihifadhi badala ya kulibadilisha na cheo.
- issue: Maana ya לִשְׁמֹעַ katika usemi wa kusikia sauti
  choice: mkiitii
  alternative: mkisikiliza
  rationale: Muktadha unawaeleza malaika wanaotekeleza neno la Mungu, hivyo maana ya kusikia kwa kuitikia inafaa. Tanbihi huhifadhi maana halisi zaidi ya kusikiliza bila kufuta mvutano huo wa kimaana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo wa usemi wa moja kwa moja kwa malaika umechaguliwa ili amri ya wingi iwe wazi na ya kawaida katika Kiswahili.
