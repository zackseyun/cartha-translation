  source_fidelity: 'Tafsiri inafuata Kiebrania kwa uaminifu: amri ya wingi inaelekezwa kwa malaika wa Yahweh; גִּבֹּרֵי כֹחַ imetolewa kwa maana ya wenye nguvu nyingi; na uhusiano wa kutenda neno lake huku wakitii/kusikia sauti yake umehifadhiwa. “Mkiitii” kwa usahihi huonyesha maana ya kuitikia kwa utii inayowezekana katika לִשְׁמֹעַ, bila kufuta maana ya msingi ya kusikia, ambayo imehifadhiwa katika tanbihi.'
