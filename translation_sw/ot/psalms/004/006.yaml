source:
  edition: WLC
  text: רַבִּ֥ים אֹמְרִים֮ מִֽי יַרְאֵ֪/נ֫וּ ט֥וֹב נְֽסָ/ה עָ֭לֵי/נוּ א֨וֹר פָּנֶ֬י/ךָ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/006.yaml
  text: Many are saying[a], “Who will show us good? Lift up the light of your face upon us[c][b], O Yahweh.”
translation:
  language: sw
  text: Wengi wanasema, “Ni nani atakayetuonyesha mema[a]? Ee Yahwe[c], uinue nuru ya uso wako[b] juu yetu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ni nani atakayetuwezesha kuona mema?” Kitenzi cha Kiebrania kina maana ya kisababishi, yaani “kuonyesha/kusababisha kuona.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “nuru ya uso wako”; hii ni taswira ya kishairi ya kibali cha Mungu au uwepo wake wenye neema.
    reason: lexical_alternative
  - marker: c
    text: Kwa Kiebrania YHWH, jina la Mungu ambalo kwa desturi limetafsiriwa “BWANA.”
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים אֹמְרִים
  choice: Wengi wanasema
  rationale: “Wengi” limetumiwa kama nomino kwa kundi lisilotajwa kwa jina, na “wanasema” linaonyesha usemi unaoendelea au unaotokea mara kwa mara.
- source_word: מִי יַרְאֵנוּ טוֹב
  choice: Ni nani atakayetuonyesha mema?
  rationale: Kitenzi יַרְאֵנוּ ni cha kisababishi, yaani ‘atasababisha tuone/atatuonyesha.’ “Mema” linadumisha upana wa טוֹב bila kuifasiri kuwa mali au mafanikio pekee.
- source_word: נְסָה עָלֵינוּ
  choice: uinue juu yetu
  rationale: Tafsiri hii inadumisha amri na taswira ya kuinuliwa au kuangazwa juu ya waombaji, badala ya kuibadili moja kwa moja kuwa ombi la kupata kibali.
- source_word: אוֹר פָּנֶיךָ
  choice: nuru ya uso wako
  rationale: Tafsiri halisi inadumisha taswira ya kishairi ya uso wa Mungu unaong'aa, inayodokeza kibali na uwepo wake wa neema.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi YHWH; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Taswira ya kibinadamu ya ‘nuru ya uso wako’
  choice: Kudumisha taswira katika matini kuu
  alternative: kibali chako; nuru ya uwepo wako
  rationale: Kudumisha uso na nuru kunahifadhi ushairi na maana pana ya kibali na uwepo wa Mungu bila kuifafanua kupita kiasi.
- issue: Mhusika wa ombi baada ya swali
  choice: Ombi kwa Yahwe limewekwa ndani ya maneno yaliyonukuliwa
  alternative: Kuliona kama kauli tofauti ya mtunga zaburi
  rationale: Kiebrania hakina alama za kunukuu zinazotatua wazi mabadiliko ya msemaji; mwendelezo wa mstari unaruhusu kulisoma ombi hilo kama sehemu ya usemi unaonukuliwa, huku mvutano huo usifichwe kwa ufafanuzi wa ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Wengi wanasema” ni rahisi kueleweka; “mema” linaacha maana ya manufaa, hali njema, au wema ikiwa pana. Muundo “uinue juu yetu nuru ya uso wako” umechaguliwa ili kuhifadhi sitiari ya Kiebrania, ingawa ni wa kishairi kuliko usemi wa kawaida.
