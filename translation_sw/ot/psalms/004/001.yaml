  source_fidelity: 'Tafsiri inafuata kwa uaminifu mpangilio na maana ya Kiebrania: wito wa wakati, ombi la kujibiwa, usemi wenye utata wa makusudi “Mungu wa haki yangu,” dhiki, taswira ya kupanuliwa/kupatiwa nafasi, na maombi ya neema na kusikilizwa. “Unirehemu” ni tafsiri ya kimuktadha inayokubalika kwa חָנֵּנִי katika lugha ya sala, ingawa ina msisitizo wa rehema kuliko fadhili/neema.'
