  text: בְּ/קָרְאִ֡/י עֲנֵ֤/נִי אֱלֹ֘הֵ֤י צִדְקִ֗/י בַּ֭/צָּר הִרְחַ֣בְתָּ לִּ֑/י חָ֝נֵּ֗/נִי וּ/שְׁמַ֥ע תְּפִלָּתִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/001.yaml
  text: When I call[a], answer me, O God of my righteousness. In distress you have made room for me[b]. Be gracious to me and hear my prayer.
translation:
  language: sw
  text: Ninapokuita, unijibu, Ee Mungu wa haki yangu.[a] Katika dhiki umenipatia nafasi.[b] Unirehemu na usikie sala yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Ee Mungu wangu mwenye haki,” au “Ee Mungu unayenitendea haki.” Kiebrania kinasema kihalisi, “Mungu wa haki yangu.”
    reason: alternative_reading
  - marker: b
    text: 'Au “umenipa nafuu.” Taswira ya Kiebrania ni ya nafasi: Mungu amemtoa mwombaji katika hali ya dhiki au kubanwa na kumpatia nafasi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקָרְאִי
  choice: Ninapokuita
  rationale: 'Muundo wa ב pamoja na kitenzi-jina na kiambishi cha nafsi ya kwanza una maana ya wakati: “ninapokuita.” Kiswahili hiki ni cha kawaida katika sala na hakiongezi hisia zisizolazimishwa na Kiebrania.'
- source_word: עֲנֵנִי
  choice: unijibu
  rationale: ענה hapa humaanisha kujibu au kuitikia; “unijibu” ni ombi la moja kwa moja na la asili kwa Kiswahili.
- source_word: אֱלֹהֵי צִדְקִי
  choice: Ee Mungu wa haki yangu
  rationale: Huhifadhi kwa karibu mnyororo wa nomino wa Kiebrania, “Mungu wa haki yangu,” bila kuamua kama haki ni sifa ya Mungu, kipawa chake kwa mwombaji, au tendo lake la kumtetea.
- source_word: בַּצָּר
  choice: Katika dhiki
  rationale: צַר huonyesha dhiki, shida, au hali ya kubanwa. “Katika dhiki” ni ya kishairi lakini inaeleweka kwa wasomaji wa sasa.
- source_word: הִרְחַבְתָּ לִּי
  choice: umenipatia nafasi
  rationale: Hiphil ya רחב ina taswira ya kufanya pana. “Umenipatia nafasi” huhifadhi taswira ya kuondolewa katika hali ya kubanwa na ni Kiswahili cha asili.
- source_word: חָנֵּנִי
  choice: Unirehemu
  rationale: חנן humaanisha kuonyesha neema au fadhili. Katika ombi la sala, “unirehemu” ni usemi wa kawaida na wenye heshima, ingawa unaweza pia kutafsiriwa “unionyeshe neema.”
- source_word: וּשְׁמַע
  choice: na usikie
  rationale: שׁמע katika lugha ya sala ni kusikia kwa makini na kuitikia; “usikie” ni tafsiri fupi na ya kawaida.
- source_word: תְּפִלָּתִי
  choice: sala yangu
  rationale: תְּפִלָּה ni neno la kawaida kwa sala; “sala yangu” ni tafsiri ya moja kwa moja.
theological_decisions:
- issue: Maana ya אֱלֹהֵי צִדְקִי, “Mungu wa haki yangu”
  choice: Kudumisha usemi “Ee Mungu wa haki yangu” katika matini kuu
  alternative: “Ee Mungu wangu mwenye haki” au “Ee Mungu unayenitendea haki”
  rationale: Muundo wa Kiebrania haulazimishi maana moja pekee. Tafsiri rasmi huhifadhi uwezekano wa Mungu kuwa chanzo cha haki ya mwombaji au yeye anayemtetea na kumtendea haki, badala ya kuamua tafsiri moja kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi na cha sala lakini kinachoeleweka kwa msomaji wa kawaida. “Ee” inadumisha mwito wa moja kwa moja; taswira ya kubanwa na kupatiwa nafasi imehifadhiwa.
