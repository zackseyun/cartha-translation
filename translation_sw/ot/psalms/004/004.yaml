base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/004.yaml
  text: Tremble[a], and do not sin; speak in your hearts on your beds, and be still[b]. Selah
translation:
  language: sw
  text: Tetemekeni[a], wala msitende dhambi; semeni mioyoni mwenu mkiwa katika vitanda vyenu, na mtulie[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kasirikeni, lakini msitende dhambi.” Kitenzi cha Kiebrania kinaweza kumaanisha kufadhaika, kutetemeka, au kukasirika.
    reason: alternative_reading
  - marker: b
    text: Au, “mnyamaze.”
    reason: alternative_reading
lexical_decisions:
- source_word: רִגְזוּ
  choice: Tetemekeni
  rationale: Kitenzi רגז kinaweza kueleza kutetemeka, kufadhaika, au kukasirika. “Tetemekeni” kinahifadhi wazo pana la msukosuko wa ndani bila kulifunga katika hasira pekee.
- source_word: וְאַל תֶּחֱטָאוּ
  choice: wala msitende dhambi
  rationale: Ni katazo la moja kwa moja; usemi huu ni wa kawaida na wenye heshima katika Kiswahili.
- source_word: אִמְרוּ בִלְבַבְכֶם
  choice: semeni mioyoni mwenu
  rationale: Tafsiri hii inadumisha maana halisi ya “semeni” na dhana ya Kiebrania ya moyo kama utu wa ndani, bila kuibadili kimyakimya kuwa “tafakarini.”
- source_word: עַל מִשְׁכַּבְכֶם
  choice: mkiwa vitandani mwenu
  rationale: Muundo huu wa Kiswahili unaonyesha mahali au hali ya kutafakari faraghani na unahifadhi wingi wa maandishi ya Kiebrania.
- source_word: וְדֹמּוּ
  choice: na mtulie
  rationale: דמם inaweza kumaanisha kunyamaza au kutulia. “Mtulie” linafaa kwa mwendo wa mstari kutoka msukosuko wa ndani hadi utulivu, huku maana ya kunyamaza ikiwekwa katika tanbihi.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya neno hili la kiliturujia haijulikani kwa hakika; limenukuliwa kwa herufi za Kiswahili badala ya kutafsiriwa kwa kubahatisha.
theological_decisions:
- issue: Maana ya רגזו katika himizo la kimaadili
  choice: Agizo la kutetemeka au kufadhaika bila kutenda dhambi
  alternative: Kasirikeni, lakini msitende dhambi
  rationale: Muktadha unaelekea kwenye kujichunguza kwa ndani na kutulia, hivyo “tetemekeni” halipunguzi maana kuwa hasira tu. Hata hivyo, maana ya hasira ina uwezekano wa kileksika na imehifadhiwa katika tanbihi.
- issue: Maana ya דמם
  choice: Mtulie
  alternative: Mnyamaze
  rationale: Kitenzi kinaweza kuonyesha ukimya au kutulia. Maandishi makuu yanatumia neno pana zaidi, na maana nyingine halali imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Semeni mioyoni mwenu” kimedumishwa kwa sababu kinaakisi kwa karibu nahau ya Kiebrania na kuhifadhi taswira ya usemi wa ndani; “mkiwa vitandani mwenu” kinafanya mahali pa tendo hilo lieleweke kwa Kiswahili cha kawaida.
