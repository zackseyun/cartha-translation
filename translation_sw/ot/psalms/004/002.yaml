base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/002.yaml
  text: Sons of men[a], how long will my honor be turned into shame? Will you love emptiness and seek falsehood? Selah
translation:
  language: sw
  text: Enyi wanadamu, mpaka lini mtaigeuza heshima yangu kuwa aibu?[a] Je, mtapenda ubatili na kutafuta uongo? Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utukufu wangu.” Neno la Kiebrania linaweza kumaanisha heshima, utukufu, au uzito; hapa huenda linarejelea hadhi ya mtunga zaburi inayofedheheshwa hadharani.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אִישׁ
  choice: Enyi wana wa watu
  rationale: Nahau ya Kiebrania inahifadhiwa kwa namna inayoeleweka katika Kiswahili, huku wingi wa kiume na nguvu ya mwito wa moja kwa moja vikibaki wazi.
- source_word: עַד מֶה
  choice: mpaka lini
  rationale: Hii ni njia ya kawaida na ya asili ya Kiswahili ya kutoa swali la malalamiko kuhusu muda.
- source_word: כְבוֹדִי
  choice: heshima yangu
  rationale: Katika muktadha wa kuaibishwa hadharani, “heshima” huwasilisha vizuri maana ya hadhi au sifa ya msemaji bila kuondoa uwezekano wa maana ya “utukufu.”
- source_word: לִכְלִמָּה
  choice: kuwa aibu
  rationale: 'Muundo huu unaonyesha matokeo ya kitendo: heshima ya msemaji inageuzwa kuwa aibu. Kitenzi “mtageuza” kinaeleza kwa Kiswahili jambo linalodokezwa na muundo wa Kiebrania.'
- source_word: תֶּאֱהָבוּן
  choice: mtapenda
  rationale: Kauli isiyotimilika ya nafsi ya pili wingi inatafsiriwa kwa namna ya swali la kukemea linaloendelea kutoka katika “mpaka lini.”
- source_word: רִיק
  choice: ubatili
  rationale: “Ubatili” huonyesha jambo lisilo na maana, lisilo na msingi, au lisilofaa, na hudumisha uzito wa kishairi wa nomino ya Kiebrania.
- source_word: תְּבַקְשׁוּ
  choice: kutafuta
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida, inayofaa katika usambamba wa kishairi.
- source_word: כָזָב
  choice: uongo
  rationale: Nomino ya dhana “uongo” inadumisha usambamba na “ubatili” bila kuibadili kuwa wingi halisi zaidi wa “uongo mbalimbali.”
- source_word: סֶלָה
  choice: Sela
  rationale: Neno linanakiliwa kwa kuwa kazi na maana yake kamili hazijulikani kwa uhakika; hivyo alama ya kiliturujia au kimuziki inahifadhiwa bila kufasiriwa kupita ushahidi.
theological_decisions:
- issue: Kirejelewa cha “heshima yangu”
  choice: Maneno yameachwa yarejelee kwa upana heshima au hadhi ya msemaji.
  alternative: “utukufu wangu” au “heshima ambayo Mungu amenipa”
  rationale: Kiebrania hakibainishi kama ni hadhi ya kifalme ya msemaji, sifa yake mbele ya watu, au heshima aliyopewa na Mungu. Tafsiri haifungi maana katika ufafanuzi mmoja wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya “mpaka lini” yametumiwa ili kuonyesha kwamba vitendo vyote viwili viko chini ya swali lilelile la kukemea. “Enyi” huweka wazi mwito wa moja kwa moja.
