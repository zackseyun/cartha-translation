source:
  edition: WLC
  text: זִבְח֥וּ זִבְחֵי צֶ֑דֶק וּ֝/בִטְח֗וּ אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/005.yaml
  text: Offer sacrifices of righteousness[a], and trust in Yahweh.
translation:
  language: sw
  text: 'Toeni dhabihu za haki[a],

    na mtumaini Yahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Toeni dhabihu zilizo sahihi,” au “Toeni dhabihu za uadilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זִבְחוּ זִבְחֵי
  choice: Toeni dhabihu
  rationale: Kitenzi na nomino za mzizi mmoja zinatoa wito wa kufanya tendo la kutoa dhabihu. Kiswahili cha kawaida hutumia ‘toa dhabihu’; kurudia ‘dhabihuni dhabihu’ kungekuwa si kwa kawaida.
- source_word: צֶדֶק
  choice: za haki
  rationale: Muundo huu unahifadhi upana wa maana ya maadili, uadilifu wa agano, na usahihi wa ibada bila kuamua kimya-kimya ni upande upi unaosisitizwa.
- source_word: וּבִטְחוּ
  choice: na mtumaini
  rationale: Ni amri ya wingi inayotoa wito wa kumtegemea Mungu kwa imani; ‘mtumaini’ ni ya moja kwa moja, ya asili, na yenye heshima.
- source_word: אֶל
  choice: —
  rationale: 'Baada ya kitenzi ‘tumaini’, Kiswahili humtaja mlengwa moja kwa moja: ‘mtumaini Yahwe’; kuongeza kihusishi kungeifanya sentensi isiwe ya kawaida.'
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Maana ya ‘dhabihu za haki’
  choice: Dhabihu zenye sifa ya haki au zinazolingana na haki, bila kubainisha kama mkazo ni unyofu wa kimaadili, ibada iliyo sahihi, au yote mawili.
  alternative: Toeni dhabihu zilizo sahihi; au toeni dhabihu za uadilifu.
  rationale: Kirai cha Kiebrania kinaweza kuhusisha uadilifu wa kimaadili na usahihi wa ibada/agano. Tafsiri kuu na tanbihi zinahifadhi upana huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Toeni dhabihu’ ni usemi wa kawaida wa kiibada; mpangilio wa mistari unahifadhi usambamba wa kishairi.
