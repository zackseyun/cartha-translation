reference: Psalms 4:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/דְע֗וּ כִּֽי הִפְלָ֣ה יְ֭הוָה חָסִ֣יד ל֑/וֹ יְהוָ֥ה יִ֝שְׁמַ֗ע בְּ/קָרְאִ֥/י אֵלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/003.yaml
  text: And know that Yahweh has set apart the godly for himself[b][a]; Yahweh hears when I call to him.
translation:
  language: sw
  text: Jueni kwamba Yahwe amemtenga mtu mwaminifu kwa ajili yake mwenyewe[a]; Yahwe husikia ninapomwita[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amemtenga mtauwa kwa ajili yake mwenyewe.” Neno la Kiebrania linaweza kusisitiza uaminifu wa agano au uchaji.
    reason: lexical_alternative
  - marker: b
    text: Au, “Yahwe atasikia ninapomwita.” Kitenzi cha Kiebrania kinaweza kueleweka kuwa tendo la kawaida la sasa au uhakika wa wakati ujao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְעוּ
  choice: Jueni
  rationale: Kitenzi cha kuamuru katika wingi kinawaita wasikilizaji watambue ukweli fulani. Kiunganishi וּ kinaendeleza usemi, lakini si lazima kiwakilishwe kwa neno tofauti katika Kiswahili.
- source_word: כִּי
  choice: kwamba
  rationale: Hutambulisha jambo ambalo wasikilizaji wanapaswa kulijua; “kwamba” ni muundo wa kawaida baada ya “jueni.”
- source_word: הִפְלָה
  choice: amemtenga
  rationale: Hifili ya פלא hapa ina maana ya kumtofautisha au kumweka mtu kando kwa kusudi maalumu; pamoja na לוֹ, “amemtenga ... kwa ajili yake mwenyewe” ndiyo tafsiri ya asili zaidi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika maandishi ya Kiebrania limeandikwa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: חָסִיד
  choice: mtu mwaminifu
  rationale: Nomino hii ya umoja humaanisha mtu mwenye uaminifu, uchaji, na ushikamanifu wa agano. “Mtu mwaminifu” ni wazi kwa msomaji wa sasa bila kulazimisha maana moja finyu.
- source_word: לוֹ
  choice: kwa ajili yake mwenyewe
  rationale: Kihusishi chenye kiambishi cha nafsi kinaonyesha kwamba mtu huyo ametengwa hasa kwa ajili ya Yahwe; “mwenyewe” huweka wazi maana ya kurejelea mtendaji.
- source_word: יִשְׁמַע
  choice: husikia
  rationale: Kauli isiyotimilika ya Kiebrania inaweza kueleza tendo la kawaida au uhakika wa tendo la baadaye. “Husikia” huonyesha imani ya mtunga zaburi kuhusu jinsi Yahwe anavyoitikia.
- source_word: בְּקָרְאִי אֵלָיו
  choice: ninapomwita
  rationale: Muundo huu unaonyesha wakati au hali ya kumwita Yahwe. “Ninapomwita” ni Kiswahili cha kawaida na huhifadhi mwelekeo wa mwito kwake.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina la agano moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya חָסִיד
  choice: mtu mwaminifu
  alternative: mtauwa
  rationale: Neno hilo linaweza kusisitiza uaminifu wa agano au uchaji. Tafsiri kuu inadumisha maana pana, huku tanbihi ikihifadhi uwezekano wa msisitizo wa uchaji.
- issue: Wakati au namna ya יִשְׁמַע
  choice: husikia
  alternative: atasikia
  rationale: Umbo la Kiebrania linaweza kueleweka kama tendo la kawaida la sasa au uhakika wa wakati ujao; maana ya sasa imechaguliwa bila kuondoa nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi fupi na ya kishairi imedumishwa; umoja wa חָסִיד na utata wa יִשְׁמַע umehifadhiwa.
