  text: בְּ/שָׁל֣וֹם יַחְדָּו֮ אֶשְׁכְּבָ֪ה וְ/אִ֫ישָׁ֥ן כִּֽי אַתָּ֣ה יְהוָ֣ה לְ/בָדָ֑ד לָ֝/בֶ֗טַח תּוֹשִׁיבֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/008.yaml
  text: In peace I will both lie down and sleep[a], for you alone, O Yahweh[b], make me dwell in safety.
translation:
  language: sw
  text: 'Kwa amani nitajilaza na nitalala[a],

    kwa maana wewe peke yako, Ee Yahwe[b],

    ndiwe unayenifanya niishi kwa usalama.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa amani, kwa pamoja nitajilaza na nitalala.” Kielezi cha Kiebrania kinaweza kumaanisha “pamoja” au “kwa pamoja”; hapa nguvu yake imewasilishwa kiasili kwa kuvihusisha vitendo viwili.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa maana wewe, Yahwe, unanifanya niishi peke yangu kwa usalama.” Kiebrania kinaweza kueleweka kuwa “peke yangu” inaelezea jinsi mtunga zaburi anavyoishi, ingawa matini kuu inachukua neno hilo kumwelezea Yahwe.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּשָׁלוֹם
  choice: Kwa amani
  rationale: Neno שָׁלוֹם linahusu amani, hali njema na ukamilifu; “kwa amani” ni usemi wa kawaida unaofaa muktadha wa kupumzika bila hofu.
- source_word: יַחְדָּו
  choice: nitajilaza na kulala
  rationale: Kielezi hiki kwa msingi humaanisha “pamoja” au “kwa pamoja.” Hapa nguvu yake imewasilishwa kiasili kwa kuunganisha vitendo vyote viwili; uwezekano wa tafsiri ya moja kwa moja umehifadhiwa katika tanbihi.
- source_word: אֶשְׁכְּבָה
  choice: nitajilaza
  rationale: Kauli hii inaonyesha azimio au uhakika wa wakati ujao. “Nitajilaza” hutofautisha kitendo cha kujilaza na kile kinachofuata cha kulala.
- source_word: וְאִישָׁן
  choice: na kulala
  rationale: Kitenzi ישן humaanisha kulala; tafsiri hii ni rahisi na ya kawaida baada ya “nitajilaza.”
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya mtunga zaburi kuweza kupumzika kwa amani.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limeandikwa “Yahwe” badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina binafsi katika matini ya Kiebrania.
- source_word: לְבָדָד
  choice: wewe peke yako
  rationale: Kielezi humaanisha “peke yake.” Mpangilio na maana ya kifungu zinaunga mkono kukihusisha na Yahwe, huku uwezekano wa kukihusisha na makao ya mtunga zaburi ukihifadhiwa katika tanbihi.
- source_word: לָבֶטַח
  choice: kwa usalama
  rationale: בֶּטַח huonyesha hali ya kuwa salama au bila hofu; “kwa usalama” ni Kiswahili cha kawaida katika muktadha huu.
- source_word: תּוֹשִׁיבֵנִי
  choice: unayenifanya niishi
  rationale: Hifili ya ישׁב ina nguvu ya kisababishi, yaani kumfanya mtu akae au aishi. Usemi huu huhifadhi nguvu hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kirejeleo na nguvu ya לְבָדָד
  choice: “Peke yako” humwelezea Yahwe kuwa ndiye pekee anayemfanya mtunga zaburi aishi kwa usalama.
  alternative: “Peke yangu” humwelezea mtunga zaburi kuwa anaishi akiwa peke yake kwa usalama.
  rationale: Mpangilio wa maneno na muktadha vinaelekea kuhusisha kielezi na Yahwe, vikisisitiza kwamba usalama unatoka kwake pekee. Hata hivyo, sarufi inaruhusu pia kielezi kuelezea jinsi mtunga zaburi anavyoishi, kwa hiyo uwezekano huo haujafichwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi ulio wazi na wenye hadhi. “Nitajilaza na kulala” huhifadhi mfuatano wa vitenzi vya Kiebrania bila kuwa mzito, na “unayenifanya niishi” huhifadhi kisababishi kwa lugha ya sasa inayoeleweka.
