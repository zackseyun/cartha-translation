  text: 'For the choirmaster: with stringed instruments. A psalm of David[a].'
translation:
  language: sw
  text: 'Kwa kiongozi wa muziki: kwa ala za nyuzi. Zaburi ya Daudi[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “iliyoandikwa na Daudi” au “kwa ajili ya Daudi”; kauli ya Kiebrania inaweza kuonyesha utunzi, uhusiano, au wakfu.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa kiongozi wa muziki
  rationale: Katika vichwa vya Zaburi, neno hili linaeleweka kama agizo kwa msimamizi au kiongozi wa uimbaji na upigaji wa muziki. Tafsiri hii ni ya kawaida na haidokezi kwamba lazima kulikuwa na kwaya.
- source_word: בִּנְגִינוֹת
  choice: kwa ala za nyuzi
  rationale: Neno hili hapa linarejelea muziki unaopigwa kwa ala za nyuzi. Kauli hii inaeleweka katika Kiswahili cha sasa bila kubainisha isivyofaa namna hasa ya upigaji.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa aina hii ya wimbo wa ibada na linafaa kama kichwa cha zaburi.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kauli iliyozoeleka 'ya Daudi' hudumisha kwa kiasi kikubwa upana wa kihusiano wa kihusishi cha Kiebrania, huku tanbihi ikieleza kwamba kinaweza kuonyesha utunzi, uhusiano, au wakfu.
theological_decisions:
- issue: Maana ya uhusiano au utunzi katika לְדָוִד
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi; kwa ajili ya Daudi
  rationale: Kihusishi cha Kiebrania hakilazimishi maana moja pekee; kinaweza kuonyesha utunzi, uhusiano, umilikaji wa mkusanyo, au wakfu. Tafsiri kuu haipaswi kuamua dai la kihistoria ambalo maandishi yenyewe yameliacha wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kifasihi. 'Kiongozi wa muziki' ni wazi kuliko istilahi zinazoweza kumaanisha kiongozi wa waimbaji pekee, kwa kuwa maagizo yanataja pia ala za nyuzi.
