base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/007.yaml
  text: You have put joy in my heart more than when their grain and their new wine abound[a].
translation:
  language: sw
  text: Umetia furaha moyoni mwangu kuliko wakati nafaka yao na divai yao mpya zilipoongezeka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata muundo wa Kiebrania kwa ukaribu zaidi, “Tangu wakati nafaka yao na divai yao mpya zilipoongezeka.” Kwa kawaida maneno ya Kiebrania yanaeleweka kuwa ulinganisho: furaha anayotoa Mungu ni kubwa kuliko furaha ya kuwa na mazao mengi.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתָּה
  choice: Umeweka
  rationale: Ni Qal timilifu nafsi ya pili umoja wa kiume, ikimwelekea Mungu. Kiswahili cha hali timilifu kinaonyesha tendo lililotimizwa lenye matokeo ya sasa.
- source_word: שִׂמְחָה
  choice: furaha
  rationale: Neno hili humaanisha furaha au shangwe; “furaha” ni la kawaida, la sasa, na linafaa kwa hali ya ndani inayotajwa hapa.
- source_word: בְלִבִּי
  choice: moyoni mwangu
  rationale: לֵב humaanisha moyo au utu wa ndani. “Moyoni mwangu” ni usemi wa asili wa Kiswahili unaohifadhi mahali pa ndani bila kuongeza tafsiri.
- source_word: מֵעֵת
  choice: zaidi ya wakati
  rationale: מִן pamoja na עֵת inaeleweka hapa kwa kawaida kuwa inaanzisha kipimo cha ulinganisho, yaani furaha kubwa kuliko ile ya wakati wa mavuno mengi.
- source_word: דְּגָנָם
  choice: nafaka yao
  rationale: דגן ni mazao ya nafaka. “Nafaka” ni neno sahihi na linaloeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: וְתִירוֹשָׁם
  choice: na divai yao mpya
  rationale: תירוש kwa kawaida hutaja divai mpya au changa; tafsiri hii inahifadhi taswira ya mazao na mavuno.
- source_word: רָבּוּ
  choice: ilipoongezeka
  rationale: Qal timilifu nafsi ya tatu wingi ya רבה humaanisha kuwa nyingi au kuongezeka. Kwa kuwa kiima cha Kiswahili ni mkusanyo wa “nafaka ... na divai,” umoja wa ngeli ya I-ZI katika kishazi hiki ni wa asili.
theological_decisions:
- issue: Muundo wa ulinganisho katika mstari
  choice: Mwandishi anasema furaha ya ndani aliyopewa na Mungu ni kubwa kuliko furaha inayohusishwa na wingi wa nafaka na divai mpya.
  alternative: 'Kwa kufuata muundo wa Kiebrania kwa ukaribu zaidi, inaweza kuwa: “Tangu wakati nafaka yao na divai yao mpya ilipoongezeka, umeweka furaha moyoni mwangu.”'
  rationale: Kwa kawaida מֵעֵת hueleweka hapa kuwa kipimo cha ulinganisho. Hata hivyo, kwa kuwa muundo wa Kiebrania unaweza kusomwa kwa namna ya wakati, uwezekano huo umehifadhiwa katika tanbihi badala ya kuondolewa kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Moyoni mwangu” na “divai mpya” huhifadhi taswira ya asili; tanbihi huhifadhi utata halisi wa מֵעֵת.
