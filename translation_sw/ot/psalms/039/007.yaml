  text: And now[a], Lord, what do I wait for? My hope is in you.
translation:
  language: sw
  text: Na sasa[a], Bwana, ninangojea nini? Tumaini langu liko kwako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Na sasa, Bwana, nimetumainia nini?” Kitenzi cha Kiebrania קוה kinaweza kuwa na maana ya kungoja na pia ya kutumaini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Huhifadhi kiunganishi וְ pamoja na kielezi cha wakati עַתָּה, huku ikileta kwa Kiswahili cha kawaida hitimisho la sasa la mtunga zaburi.
- source_word: מַה
  choice: nini
  rationale: Kiwakilishi cha kuuliza kinachotumiwa katika swali la balagha; katika Kiswahili, mpangilio wa kawaida ni “ninangojea nini?”
- source_word: קִוִּיתִי
  choice: ninangojea
  rationale: Kitenzi קוה kinaweza kumaanisha kungoja kwa matarajio au kutumaini. Wakati uliopo wa Kiswahili unaonyesha mwelekeo wa sasa baada ya “Na sasa,” bila kufuta mwingiliano wa maana unaoelezwa katika tanbihi.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Ni cheo cha Mungu kinachotumiwa katika kumwita moja kwa moja; “Bwana” ni tafsiri ya kawaida, yenye heshima na inayoeleweka katika Kiswahili.
- source_word: תּוֹחַלְתִּי
  choice: Tumaini langu
  rationale: Nomino hii humaanisha tumaini au matarajio; “tumaini langu” ni usemi wa asili na unaofaa zaidi katika muktadha huu.
- source_word: לְךָ הִיא
  choice: liko kwako
  rationale: Kihusishi לְ kinaelekeza tumaini kwa Mungu, na kiwakilishi הִיא kinarejelea nomino ya kike תּוֹחַלְתִּי. “Liko kwako” hudumisha mwelekeo huo kwa Kiswahili cha kawaida bila kuongeza dhana isiyokuwamo wazi katika Kiebrania.
theological_decisions:
- issue: Tafsiri ya cheo cha Mungu אֲדֹנָי
  choice: Bwana
  alternative: Bwana wangu
  rationale: Katika matumizi haya אֲדֹנָי ni cheo cha kawaida cha heshima kwa Mungu. “Bwana” hutafsiri cheo hicho bila kulazimisha umilikishi ambao katika matumizi ya cheo hiki si lazima uonyeshwe kando.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Swali limewekwa kwa mpangilio wa kawaida wa Kiswahili, na tanbihi imehifadhi utata wa kimsamiati kati ya kungoja na kutumaini.
