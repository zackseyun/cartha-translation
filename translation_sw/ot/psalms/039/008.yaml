  text: Deliver me from all my transgressions[a]; do not make me the reproach of a fool.
translation:
  language: sw
  text: Uniokoe kutoka katika maasi yangu yote; usinifanye kuwa kitu cha kudharauliwa na mpumbavu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usinifanye kuwa fedheha ya mpumbavu.” Kiebrania kinaweza kumaanisha kuwa mlengwa wa dharau ya mpumbavu, au kuwa fedheha inayohusishwa na upumbavu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל
  choice: kutoka katika ... yote
  rationale: Muundo huu unaonyesha kuokolewa mbali na jumla ya makosa ya msemaji, kwa Kiswahili cha kawaida na wazi.
- source_word: פְּשָׁעַי
  choice: makosa yangu
  rationale: Katika muktadha huu neno lina maana ya makosa mazito ya kimaadili au uasi. “Makosa yangu” ni ya asili kwa Kiswahili, ingawa ni pana kuliko “maasi yangu.”
- source_word: הַצִּילֵנִי
  choice: Uniokoe
  rationale: Kauli ya ombi ya kitenzi נצל inaomba kuondolewa au kunusuriwa kutoka katika hatari au matokeo ya makosa; “uniokoe” inafaa kwa sala hii.
- source_word: חֶרְפַּת
  choice: kitu cha kudharauliwa
  rationale: Neno hili huhusu shutuma, fedheha, au dharau ya hadharani. Usemi huu unaonyesha mtu kufanywa kuwa mlengwa wa dharau.
- source_word: נָבָל
  choice: mpumbavu
  rationale: Katika Zaburi humaanisha mtu asiye na busara ya kimaadili, si mtu mwenye uwezo mdogo wa akili tu. “Mpumbavu” ni tafsiri fupi na iliyozoeleka.
- source_word: אַל תְּשִׂימֵנִי
  choice: usinifanye kuwa
  rationale: שׂים pamoja na yambwa ya mtu inaweza kumaanisha kumsababisha awe katika hali fulani; usemi huu ni wa kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya ombi kuhusu fedheha mbele ya mpumbavu
  choice: Msemaji anamwomba Mungu asimwache awe mlengwa wa dharau ya mtu mpumbavu kimaadili.
  alternative: Msemaji anaomba asifanywe kuwa fedheha inayohusishwa na mpumbavu.
  rationale: Muundo חֶרְפַּת נָבָל unaweza kuonyesha dharau inayotoka kwa mpumbavu au fedheha inayohusishwa naye. Matini kuu inatoa maana ya kwanza iliyo na uwezekano mkubwa, huku tanbihi ikihifadhi utata huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa msomaji wa kawaida. Alama ya tanbihi imewekwa mara moja baada ya kishazi husika.
