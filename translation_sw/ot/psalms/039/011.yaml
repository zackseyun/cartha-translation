id: PSA.39.11
reference: Psalms 39:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בְּֽ/תוֹכָ֘ח֤וֹת עַל עָוֺ֨ן יִסַּ֬רְתָּ אִ֗ישׁ וַ/תֶּ֣מֶס כָּ/עָ֣שׁ חֲמוּד֑/וֹ אַ֤ךְ הֶ֖בֶל כָּל אָדָ֣ם סֶֽלָה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/011.yaml
  text: With rebukes for iniquity you discipline a man[a], and like a moth you consume what is precious to him; surely every man is vapor[b]. Selah
translation:
  language: sw
  text: Kwa maonyo kwa sababu ya uovu, unamtia mtu adabu; unaharibu kama nondo kile anachokithamini[a]. Hakika, kila mwanadamu ni mvuke[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaweza pia kueleweka, “unakifanya kitu chake cha thamani kiharibike kama nondo afanyavyo.” Neno lililotafsiriwa “kile anachokithamini” linaweza kumaanisha hasa “uzuri wake,” au kwa upana zaidi, “vitu vyake vya thamani.”
    reason: lexical_alternative
  - marker: b
    text: “Mvuke” hutafsiri neno la Kiebrania hebel, linaloonyesha hali ya kupita upesi au kutokuwa na uthabiti, kama pumzi; kwa mapokeo limetafsiriwa “ubatili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹכָחוֹת
  choice: kwa maonyo
  rationale: Kiambishi בְּ kinaonyesha njia inayotumiwa, na wingi wa תּוֹכָחוֹת unamaanisha maonyo au makemeo yenye kusahihisha.
- source_word: עַל עָוֺן
  choice: kwa sababu ya uovu
  rationale: עָוֺן hapa inaeleza sababu ya kuadhibiwa na inaweza kumaanisha uovu, hatia, au dhambi; ‘uovu’ huhifadhi uzito wa kimaadili bila kuifanya iwe dhana ya kisheria pekee.
- source_word: יִסַּרְתָּ
  choice: unamtia ... adabu
  rationale: Kitenzi יסר kina maana ya kurekebisha au kuonya kwa njia ya nidhamu; msemo huu ni wa kawaida na wenye heshima katika Kiswahili.
- source_word: אִישׁ
  choice: mtu
  rationale: Ingawa nomino hii ni ya umoja wa kiume katika Kiebrania, hapa inawakilisha binadamu kwa ujumla; ‘mtu’ ni tafsiri ya kawaida ya Kiswahili isiyofuta maana hiyo.
- source_word: וַתֶּמֶס
  choice: unaharibu
  rationale: Mzizi מסס una wazo la kuyeyusha, kudhoofisha, au kufanya kitu kiharibike; ‘unaharibu’ huleta matokeo hayo kwa lugha ya asili na huendana na mfano wa nondo.
- source_word: כָּעָשׁ
  choice: kama nondo
  rationale: Huhifadhi wazi tashbihi ya uharibifu wa polepole unaofanywa na nondo.
- source_word: חֲמוּדוֹ
  choice: kile anachokithamini
  rationale: Neno linalotokana na חמד linaweza kumaanisha kitu cha kutamanika, cha thamani, au uzuri; tafsiri hii huhifadhi upana wake.
- source_word: אַךְ
  choice: hakika
  rationale: Hapa אַךְ inasisitiza hitimisho la huzuni la mtunga zaburi.
- source_word: הֶבֶל
  choice: mvuke
  rationale: הֶבֶל huleta picha ya pumzi au mvuke unaotoweka, na kwa njia ya mfano huonyesha hali ya muda mfupi na kutokuwa na uthabiti.
- source_word: כָּל אָדָם
  choice: kila mwanadamu
  rationale: אָדָם hapa inamaanisha jamii ya binadamu kwa ujumla; ‘kila mwanadamu’ huhifadhi umoja wa kila mmoja na maana yake jumuishi.
- source_word: סֶלָה
  choice: Sela
  rationale: Neno la kiliturujia au kimuziki limenukuliwa kwa sauti kwa kuwa maana yake kamili haijulikani kwa uhakika.
theological_decisions:
- issue: Maana wakilishi ya אִישׁ na אָדָם
  choice: mtu; kila mwanadamu
  alternative: mwanamume; kila mwanamume
  rationale: Katika muktadha huu nomino za Kiebrania zinaeleza hali ya binadamu kwa ujumla, si wanaume pekee. Kiswahili ‘mtu’ na ‘mwanadamu’ huonyesha maana hiyo bila kupoteza umoja wa kisarufi.
- issue: Uhusiano wa Mungu na uharibifu unaofananishwa na nondo
  choice: unaharibu kama nondo kile anachokithamini
  alternative: unakifanya kile anachokithamini kiharibike kama nondo afanyavyo
  rationale: Muundo wa Kiebrania unamtaja Mungu kuwa mtendaji huku ukihifadhi tashbihi ya nondo. Tafsiri kuu hailegezi uwakala huo wala kuamua kwa undani jinsi tashbihi inavyohusiana na kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi usambamba wa kishairi, picha ya nondo, na neno la liturujia ‘Sela’; maelezo ya chini yanahifadhi uwezekano wa maana nyingine bila kuusonga mstari mkuu.
