  text: Look away from me[a], so that I may smile again before I go and am no more.
translation:
  language: sw
  text: Uniondolee macho yako[a], nipate nafuu kabla sijaenda zangu nisikuwepo tena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ugeuze macho yako mbali nami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשַׁע
  choice: Uniondolee macho yako
  rationale: Kitenzi cha amri kinamwomba Mungu ageuze uangalifu wake kutoka kwa mtunga zaburi; usemi huu ni wa asili katika Kiswahili na unafaa katika muktadha wa maombolezo.
- source_word: מִמֶּנִּי
  choice: -ondolee ... yako
  rationale: Kiambishi na muundo wa kitenzi vinaonyesha kuondolewa kwa mtazamo kutoka kwa msemaji.
- source_word: וְאַבְלִיגָה
  choice: nipate kupata nafuu
  rationale: בלג inaweza kumaanisha kurudia uchangamfu, kupata utulivu, au kurejea nguvu. “Kupata nafuu” ni Kiswahili cha kawaida kinachohifadhi upana huu bila kulazimisha taswira ya kutabasamu.
- source_word: בְּטֶרֶם
  choice: kabla
  rationale: Kiashirio cha wakati kinatafsiriwa kwa neno la kawaida na la moja kwa moja.
- source_word: אֵלֵךְ
  choice: sijaenda
  rationale: Maana ya msingi ni “kwenda.” Ingawa hapa inadokeza kufa, tafsiri inadumisha sitiari tulivu ya Kiebrania.
- source_word: וְאֵינֶנִּי
  choice: na nisiwepo tena
  rationale: Usemi huu unaonyesha kutokuwapo tena; katika muktadha unadokeza mwisho wa maisha bila kuutaja moja kwa moja.
theological_decisions:
- issue: Iwapo kutaja kifo waziwazi katika אֵלֵךְ וְאֵינֶנִּי
  choice: kabla sijaenda na nisiwepo tena
  alternative: kabla sijafa na kutoweka
  rationale: Kiebrania kinadokeza kifo kwa lugha isiyo ya moja kwa moja. Kudumisha nahau hiyo kunahifadhi uzito wa kishairi na hakufanyi kauli iwe wazi zaidi kuliko chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo ni wazi kwa wasomaji wa kawaida huku ukihifadhi sitiari ya kwenda na kutokuwapo tena.
