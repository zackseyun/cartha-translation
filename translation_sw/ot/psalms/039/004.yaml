base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/004.yaml
  text: O Yahweh[a], make me know my end and what is the measure of my days; let me know how fleeting I am.
translation:
  language: sw
  text: Ee Yahweh, nijulishe mwisho wangu na kipimo cha siku zangu ni kipi; ili nijue jinsi nilivyo wa muda mfupi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jinsi nilivyo dhaifu” au “jinsi nilivyo wa kupita.” Usemi wa Kiebrania ni mfupi na unaweza kusisitiza udhaifu wa mwanadamu au ufupi wa maisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִיעֵנִי
  choice: nijulishe
  rationale: Kauli ya Hifili ya ידע yenye kiambishi cha nafsi ya kwanza ina maana ya kusababisha mtu ajue. “Nijulishe” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: יְהוָה
  choice: Ee Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama “Yahweh,” huku “Ee” ikionyesha mwito wa moja kwa moja.
- source_word: קִצִּי
  choice: mwisho wangu
  rationale: קֵץ humaanisha mwisho au mpaka. Katika muktadha huu, “mwisho wangu” hudokeza ukomo wa maisha bila kuongeza wazo la majaliwa.
- source_word: וּמִדַּת יָמַי מַה הִיא
  choice: na kipimo cha siku zangu ni kipi
  rationale: “Kipimo” huhifadhi taswira halisi ya מִדָּה, na “ni kipi” huuliza ukubwa au upeo wa muda huo kwa Kiswahili cha asili.
- source_word: אֵדְעָה
  choice: nijulishe
  rationale: Kohortativi hii huonyesha kusudi au matokeo yanayotamaniwa. Kurudia “nijulishe” kunatoa ombi hilo kwa uwazi na kwa mtiririko wa kawaida.
- source_word: מֶה חָדֵל אָֽנִי
  choice: jinsi nilivyo wa kupita upesi
  rationale: Usemi huu mfupi na mgumu unaweza kusisitiza ufupi na hali ya mpito ya maisha, au udhaifu wa mwanadamu. Uchaguzi huu unaendana na muktadha wa zaburi bila kuficha uwezekano mwingine.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la Mungu יהוה, si cheo. “Yahweh” hulihifadhi kama jina binafsi kwa kutoholewa badala ya kulibadilisha kuwa cheo.
- issue: Maana ya חָדֵל kuhusu hali ya mwanadamu
  choice: wa kupita upesi
  alternative: dhaifu; wa muda mfupi
  rationale: Neno linaweza kuelekeza kwenye hali ya mpito, ufupi wa maisha, au udhaifu. Matini kuu inasisitiza kupita kwa maisha, huku tanbihi ikihifadhi maana nyingine halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo unahifadhi taswira ya “kipimo cha siku” na utata wa usemi wa mwisho bila kuwa mgumu kwa msomaji wa kawaida.
