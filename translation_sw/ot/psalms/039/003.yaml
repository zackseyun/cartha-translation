lexical_decisions:
- source_word: חַם
  choice: ukawa moto
  rationale: Neno hili linaeleza moyo kuingia katika hali ya joto. “Ukawa moto” ni Kiswahili cha kawaida na linatofautisha joto la ndani na moto unaowaka katika kishazi kinachofuata.
- source_word: לִבִּי
  choice: moyo wangu
  rationale: Huhifadhi taswira ya Kiebrania ya moyo kuwa kitovu cha mawazo, hisia na utu wa ndani.
- source_word: בְּקִרְבִּי
  choice: ndani yangu
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi msisitizo wa jambo kutokea ndani ya mtu.
- source_word: בַּהֲגִיגִי
  choice: nilipokuwa nikitafakari
  rationale: הֲגִיג inaweza kumaanisha kuwaza moyoni, kutafakari au kunong’ona. Muundo huu unaeleweka kwa urahisi na unasoma kiambishi בְּ kwa maana ya wakati katika muktadha huu.
- source_word: תִבְעַר אֵשׁ
  choice: moto ukawaka
  rationale: Huhifadhi taswira ya wazi ya moto na kuonyesha kuongezeka kwa nguvu kutoka moyo kuwa moto hadi moto kuwaka. Kiswahili hakihitaji kibainishi kinacholingana na ‘the/a’ cha Kiingereza.
- source_word: דִּבַּרְתִּי
  choice: ndipo nikasema
  rationale: “Nikasema” ni ya kawaida kwa tendo la kusema; “ndipo” huonyesha mfuatano wa kutoka katika msukumo wa ndani hadi kusema kwa sauti bila kuubadili kuwa uhusiano wa kisababishi ulio wazi zaidi kuliko Kiebrania.
- source_word: בִּלְשׁוֹנִי
  choice: kwa ulimi wangu
  rationale: Tafsiri hii ya moja kwa moja huhifadhi taswira ya kiungo cha mwili na msisitizo wa Kiebrania kwamba mawazo ya ndani yalitolewa kwa maneno.
