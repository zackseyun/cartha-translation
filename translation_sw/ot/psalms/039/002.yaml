lexical_decisions:
- source_word: נֶאֱלַמְתִּי
  choice: Nilikuwa bubu
  rationale: Kitenzi cha Kiebrania kinaeleza kuwa bubu au kutoweza/kutotaka kusema; tafsiri hii haibainishi kim kimya hicho kilikuwa cha hiari au kilisababishwa na mwingine.
- source_word: דּוּמִיָּה
  choice: kimya kabisa
  rationale: Nomino hii humaanisha ukimya au utulivu. Kauli hii ya kielezi ni ya asili katika Kiswahili na inadumisha mkazo wa sambamba na ‘Nilikuwa bubu.’
- source_word: הֶחֱשֵׁיתִי
  choice: nilinyamaza
  rationale: Hiphil ya חשׁה humaanisha kukaa kimya au kunyamaza. ‘Nilinyamaza’ ni ya kawaida na inatofautiana kiasi na ‘Nilikuwa bubu.’
- source_word: מִטּוֹב
  choice: hata kuhusu mema
  rationale: Kirai cha Kiebrania ni kifupi na kina utata. Tafsiri hii inaeleweka katika muktadha wa usemi, huku tanbihi ikihifadhi uwezekano wa maana pana zaidi ya kujizuia na lililo jema.
- source_word: וּכְאֵבִי
  choice: na maumivu yangu
  rationale: כאב inaweza kumaanisha maumivu ya mwili au ya moyoni; ‘maumivu’ huhifadhi upana huo.
- source_word: נֶעְכָּר
  choice: yakachochewa
  rationale: Niphal ya עכר inaweza kueleza kuchochewa, kusumbuliwa, au kuvurugwa. ‘Yakachochewa’ huonyesha kwamba maumivu ya ndani yaliamshwa au kuongezeka bila kufafanua kupita kiasi.
