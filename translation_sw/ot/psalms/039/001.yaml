base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/001.yaml
  text: I said[a], “I will guard my ways from sinning with my tongue; I will keep a muzzle for my mouth while the wicked is before me.”
translation:
  language: sw
  text: Nilisema, “Nitazilinda njia zangu nisitende dhambi kwa ulimi wangu; nitauwekea kinywa changu lijamu wakati mwovu[a] yuko mbele yangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “mtu mwovu.” Neno la Kiebrania liko katika umbo la kiume la umoja.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Nilisema
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi cha Qal, nafsi ya kwanza umoja, kinachoanzisha azimio la awali la mtunga zaburi.
- source_word: אֶשְׁמְרָה דְרָכַי
  choice: Nitazilinda njia zangu
  rationale: Huhifadhi picha ya Kiebrania ya kulinda njia, huku ‘njia’ zikimaanisha mwenendo wa maisha.
- source_word: מֵחֲטוֹא בִלְשׁוֹנִי
  choice: nisitende dhambi kwa ulimi wangu
  rationale: Muundo wa Kiebrania unaonyesha kusudi la kujizuia, na ‘kwa ulimi wangu’ huhifadhi ulimi kama chombo kinachoweza kutenda dhambi.
- source_word: אֶשְׁמְרָה לְפִי מַחְסוֹם
  choice: nitaweka lijamu kinywani mwangu
  rationale: ‘Lijamu’ ni picha ya kawaida na inayoeleweka ya kifaa cha kuzuia kinywa; hapa inaeleza kujizuia kusema bila kugeuza picha hiyo kuwa wazo la jumla tu.
- source_word: בְּעוֹד
  choice: maadamu
  rationale: 'Huonyesha muda unaoendelea: kwa kipindi ambacho mwovu yupo mbele yake.'
- source_word: רָשָׁע
  choice: mwovu
  rationale: Ni nomino ya mtu katika umoja na huhifadhi ufupi wa kivumishi cha Kiebrania kilichotumiwa kama nomino.
- source_word: לְנֶגְדִּי
  choice: yuko mbele yangu
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kuwapo mbele ya mtunga zaburi au katika uwepo wake.
theological_decisions:
- issue: Jinsi ya kutafsiri umbo la kiume la umoja רָשָׁע
  choice: mwovu
  alternative: mtu mwovu; mwanamume mwovu
  rationale: ‘Mwovu’ huhifadhi umoja na kurejelea mtu bila kuongeza neno ‘mwanamume,’ ambalo halijaandikwa kama nomino katika Kiebrania. Tanbihi inadumisha taarifa kwamba umbo la Kiebrania ni la kiume.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Lijamu kinywani’ ni sitiari hai ya kujizuia kusema; ‘maadamu’ huonyesha hali inayoendelea bila kuongeza tafsiri ya sababu.
