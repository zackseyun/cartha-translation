lexical_decisions:
- source_word: נֶאֱלַמְתִּי
  choice: Nimenyamazishwa
  rationale: Nifali ya אלם inaweza kueleza hali iliyotokana na kunyamazishwa au kuwa kimya. Kiswahili hiki kinahifadhi maana ya kutendwa na hali ya sasa bila kumtaja wazi mtendaji.
- source_word: לֹא אֶפְתַּח פִּי
  choice: sitafungua kinywa changu
  rationale: Tafsiri ya karibu ya nahau ya Kiebrania ya kutosema. Wakati ujao wa Kiswahili unafaa kwa imperfecti inayoweza kuonyesha azimio, huku ‘kinywa’ kikidumisha taswira ya chanzo.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatanguliza sababu ya ukimya wa mtunga zaburi kwa lugha ya kawaida na wazi.
- source_word: אַתָּה
  choice: wewe ndiwe
  rationale: Kiwakilishi kimetajwa wazi na kina mkazo katika Kiebrania; ‘wewe ndiwe’ kinauwasilisha mkazo huo kwa Kiswahili cha kawaida.
- source_word: עָשִׂיתָ
  choice: uliyefanya hivyo
  rationale: Kitenzi עשה kina maana pana ya kufanya, na shamirisho halikutajwa. ‘Hivyo’ kinawezesha Kiswahili cha asili bila kubainisha tendo zaidi ya chanzo.
theological_decisions:
- issue: Shamirisho lililodokezwa la עָשִׂיתָ na utendaji wa Mungu
  choice: kwa sababu wewe ndiwe uliyefanya hivyo
  alternative: kwa sababu umetenda
  rationale: Tafsiri inakiri kwamba Mungu ametenda jambo linalohusika, lakini haibainishi jambo hilo wala kueleza sababu ya mateso. Hivyo inadumisha ufupi na mvutano wa kitheolojia wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Nimenyamazishwa’ huhifadhi hali ya matokeo na uwezekano wa maana tendwa; ‘wewe ndiwe’ huonyesha mkazo wa kiwakilishi cha Kiebrania.
