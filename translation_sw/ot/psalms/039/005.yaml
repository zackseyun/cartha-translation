  variant: Standard East African Swahili
source:
  edition: WLC
  text: הִנֵּ֤ה טְפָח֨וֹת נָ֘תַ֤תָּה יָמַ֗/י וְ/חֶלְדִּ֣/י כְ/אַ֣יִן נֶגְדֶּ֑/ךָ אַ֥ךְ כָּֽל הֶ֥בֶל כָּל אָ֝דָ֗ם נִצָּ֥ב סֶֽלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/005.yaml
  text: Behold[a], you have made my days a few handbreadths, and my lifetime is as nothing before you; surely every man, though standing firm, is altogether vapor[c][b]. Selah
translation:
  language: sw
  text: 'Tazama, umezifanya siku zangu ziwe fupi,

    zenye urefu wa viganja vichache[a];

    na muda wa maisha yangu ni kama si kitu mbele zako.

    Hakika, kila mwanadamu, hata akiwa amesimama imara[b],

    ni pumzi tupu[c]. Sela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “viganja vichache kwa upana”; hiki ni kipimo kifupi sana.
    reason: cultural_or_measurement_clarification
  - marker: b
    text: Au “akiwa amesimama” au “akiwa amethibitika”; huenda maana ni kwamba hata mtu anayeonekana kuwa salama na thabiti ni wa muda mfupi.
    reason: lexical_alternative
  - marker: c
    text: Au “mvuke mtupu” au “ubatili mtupu”; neno la Kiebrania linaonyesha kitu kisichoshikika na kinachotoweka haraka.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linaelekeza fikira kwa msisitizo na linadumisha hadhi ya kishairi bila kuwa la kizamani.
- source_word: טְפָחוֹת
  choice: upana wa viganja vichache
  rationale: Nomino hii hutaja vipimo vya upana wa kiganja; tafsiri inadumisha picha halisi ya ufupi wa maisha.
- source_word: נָתַתָּה יָמַי
  choice: umezifanya siku zangu kuwa fupi
  rationale: Katika muktadha, kitenzi kinaonyesha kwamba Mungu ameuweka muda wa siku za mtunga zaburi kuwa mfupi; neno 'fupi' linafanya maana ya kipimo ieleweke kwa Kiswahili cha kawaida.
- source_word: וְחֶלְדִּי
  choice: na muda wa maisha yangu
  rationale: Neno hili linamaanisha kipindi cha maisha ya mtu duniani na linaendana na sambamba ya 'siku zangu'.
- source_word: כְאַיִן נֶגְדֶּךָ
  choice: ni kama si kitu mbele zako
  rationale: Huhifadhi ulinganisho na wazo la udogo au kutokuwa na maana mbele za Mungu.
- source_word: אַךְ
  choice: Hakika
  rationale: Linaonyesha msisitizo wa hitimisho la jumla linalofuata.
- source_word: כָּל אָדָם
  choice: kila mwanadamu
  rationale: Kiswahili 'mwanadamu' huwasilisha umoja wa kijumla unaowahusu wanadamu wote bila kuweka jinsia isiyohitajika.
- source_word: נִצָּב
  choice: akiwa amesimama imara
  rationale: Huhifadhi maana ya msingi ya kusimama pamoja na uwezekano wa mtu kuonekana kuwa thabiti au salama.
- source_word: הֶבֶל
  choice: mvuke tu
  rationale: Neno hilo huleta picha ya pumzi au mvuke ulio dhaifu na wa muda mfupi; 'mvuke' inadumisha picha hiyo badala ya kuibadili kuwa dhana moja tu kama ubatili.
- source_word: סֶלָה
  choice: Sela
  rationale: Imenukuliwa kwa matamshi kwa sababu maana au kazi yake kamili haijulikani kwa uhakika.
theological_decisions:
- issue: Kauli ya kijumla כָּל אָדָם kuhusu wanadamu
  choice: kila mwanadamu
  alternative: kila mtu
  rationale: Chaguo hili linahifadhi umoja wa kijumla na kuonyesha wazi kuwa kauli inawahusu wanadamu wote.
- issue: Nguvu ya נִצָּב katika kueleza hali ya mwanadamu
  choice: hata akiwa amesimama imara
  alternative: akiwa amesimama / akiwa amethibitika
  rationale: 'Muundo wa concessive unaonyesha mvutano wa mstari: hata mtu anayeonekana thabiti bado ni wa muda mfupi. Tanbihi inadumisha uwezekano wa maana halisi zaidi.'
- issue: Sitiari ya הֶבֶל
  choice: mvuke tu
  alternative: pumzi tu / ubatili mtupu
  rationale: Tafsiri hii inalinda picha ya kitu kisichoshikika na kinachotoweka haraka bila kuamua kwamba neno linamaanisha tu kutokuwa na maana.
