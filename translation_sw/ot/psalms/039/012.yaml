  text: שִֽׁמְעָ֥/ה תְפִלָּתִ֨/י יְהוָ֡ה וְ/שַׁוְעָתִ֨/י הַאֲזִינָ/ה֮ אֶֽל דִּמְעָתִ֗/י אַֽל תֶּ֫חֱרַ֥שׁ כִּ֤י גֵ֣ר אָנֹכִ֣י עִמָּ֑/ךְ תּ֝וֹשָׁ֗ב כְּ/כָל אֲבוֹתָֽ/י־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/012.yaml
  text: Hear my prayer[a], O Yahweh, and give ear to my cry; do not be deaf to my tears. For I am a sojourner with you[b], a resident alien like all my fathers.
translation:
  language: sw
  text: 'Ee Yahweh, sikia sala yangu,

    na utege sikio kwa kilio changu;

    usiwe kiziwi kwa machozi yangu.[a]

    Kwa maana mimi ni mgeni pamoja nawe,

    mkaaji wa muda kama baba zangu wote.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usinyamaze mbele ya machozi yangu.” Kitenzi cha Kiebrania kinaweza kumaanisha “kunyamaza,” lakini muktadha wa kusikia na kutega sikio unaunga mkono maana ya kutokuwa kiziwi katika matini kuu.
    reason: lexical_alternative
  - marker: b
    text: Au, “kama mababu zangu wote.” Kihalisi, “kama baba zangu wote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה תְפִלָּתִי
  choice: isikie sala yangu
  rationale: Kitenzi cha amri שׁמע kinaelekeza ombi la moja kwa moja kwa Mungu; “isikie sala yangu” ni lugha ya kawaida na yenye heshima katika sala ya Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna inayolingana na matamshi na tahajia ya Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: וְשַׁוְעָתִי הַאֲזִינָה
  choice: na utege sikio kwa kilio changu
  rationale: שַׁוְעָה ni kilio, mara nyingi kilio cha kuomba msaada; “tega sikio” inadumisha taswira na usambamba wa kishairi wa Kiebrania.
- source_word: אֶל דִּמְעָתִי אַל תֶּחֱרַשׁ
  choice: usiwe kiziwi kwa machozi yangu
  rationale: Katika muktadha wa “sikia” na “tega sikio,” maana inayohusu kutosikia inafaa, huku taswira ya machozi ikihifadhiwa. Maana nyingine ya kitenzi, “kunyamaza,” imeonyeshwa katika tanbihi.
- source_word: גֵר
  choice: mgeni nikaaye
  rationale: גֵר humaanisha mtu asiye mwenyeji anayeishi miongoni mwa watu wengine. “Mgeni nikaaye” ni ya kueleweka kwa wasomaji wa sasa na haibadili hali hiyo kuwa safari fupi tu.
- source_word: עִמָּךְ
  choice: pamoja nawe
  rationale: עם maana yake ya msingi ni “pamoja na”; tafsiri hii inadumisha usemi wa moja kwa moja bila kufafanua zaidi uhusiano wa mtu huyo na Mungu.
- source_word: תּוֹשָׁב
  choice: mkazi wa muda
  rationale: Neno hili linamtaja mtu anayeishi mahali bila hadhi kamili ya mwenyeji. Chaguo hili pia linatofautisha neno hilo na גֵר.
- source_word: כְּכָל אֲבוֹתָי
  choice: kama baba zangu wote
  rationale: Hii inadumisha usemi halisi wa ukoo wa kiume katika Kiebrania. “Mababu zangu wote” limetolewa kama chaguo la Kiswahili lenye maana ya wazi zaidi.
theological_decisions:
- issue: Maana mbili za אַל תֶּחֱרַשׁ
  choice: usiwe kiziwi kwa machozi yangu
  alternative: usinyamaze mbele ya machozi yangu
  rationale: Muktadha wa kusikia unaunga mkono maana ya kutokuwa kiziwi, lakini kitenzi pia kinaweza kumaanisha kunyamaza. Tanbihi inahifadhi mvutano huo badala ya kuufuta.
- issue: Kutofautisha גֵר na תּוֹשָׁב
  choice: mgeni nikaaye ... mkazi wa muda
  alternative: mgeni ... mgeni
  rationale: Maneno hayo yanahusiana lakini si sawa kabisa. Kuyatofautisha kunadumisha hali ya mtunga zaburi ya kuishi bila umiliki au hadhi kamili mbele za Mungu.
- issue: Maana ya אֲבוֹתָי
  choice: baba zangu wote
  alternative: mababu zangu wote
  rationale: Matini ya Kiebrania inasema kihalisi “baba zangu.” Chaguo kuu linahifadhi umbo hilo, na tanbihi inatoa maana yake ya kiukoo iliyo wazi zaidi katika Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sala ulio wa kishairi, wa sasa na wenye heshima. Mistari mifupi inadumisha usambamba wa zaburi, na istilahi za hadhi ya ukaaji zimetofautishwa bila kutumia lugha nzito ya kisheria.
