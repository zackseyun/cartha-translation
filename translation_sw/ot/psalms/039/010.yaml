    kwa shambulio la mkono wako nimekwisha[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uniondolee pigo lako.” Neno la Kiebrania linalotafsiriwa “pigo” linaweza pia kumaanisha jeraha, tauni, au mateso.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa uhasama wa mkono wako nimeishiwa nguvu kabisa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵר
  choice: Ondoa
  rationale: Kauli ya kuamuru katika Hiphil ni ombi la moja kwa moja kwamba Mungu aondoe kinachomtesa mwombaji; “ondoa” ni ya kawaida na huhifadhi nguvu ya amri.
- source_word: מֵעָלַי
  choice: juu yangu
  rationale: Muundo huu huhifadhi taswira ya jambo lililo juu ya mwombaji, badala ya kuufanya useme tu “kutoka kwangu.”
- source_word: נִגְעֶךָ
  choice: pigo lako
  rationale: נגע inaweza kumaanisha pigo, jeraha, tauni, au mateso yaliyompata mtu. “Pigo” ni pana vya kutosha kutotaja ugonjwa maalumu, huku likionyesha kwamba mateso hayo yametoka kwa Mungu.
- source_word: מִתִּגְרַת
  choice: kwa shambulio la
  rationale: תגרה hudokeza ugomvi, uhasama, au shambulio. “Kwa shambulio la” huhifadhi ukali wa tendo bila kulipunguza kuwa nguvu ya kawaida tu.
- source_word: יָדְךָ
  choice: mkono wako
  rationale: Taswira ya mkono kama tendo au nguvu ya Mungu imehifadhiwa badala ya kufafanuliwa kwa neno “nguvu.”
- source_word: אֲנִי כָלִיתִי
  choice: nimeangamia
  rationale: Kitenzi כלה kinaweza kueleza kufikia mwisho, kuishiwa, au kuangamia. “Nimeangamia” huwasilisha hali kali ya mwombaji aliyemalizwa nguvu, huku uwezekano wa “nimeishiwa” ukitajwa katika tanbihi.
theological_decisions:
- issue: Asili na hali ya נִגְעֶךָ
  choice: pigo lako
  alternative: jeraha lako; mateso unayonipiga nayo; tauni yako
  rationale: Mstari unasema mateso hayo yanahusiana moja kwa moja na Mungu, lakini hautaji wazi kama ni ugonjwa, adhabu ya aina fulani, au tauni. Tafsiri haifafanui zaidi ya ushahidi wa Kiebrania.
- issue: Ukali wa kauli אֲנִי כָלִיתִי
  choice: nimeangamia
  alternative: nimeishiwa nguvu; ninadhoofika kabisa
  rationale: Kauli hiyo inaweza kuonyesha kuangamia au kuishiwa kabisa bila kumaanisha kwa lazima kwamba mwombaji tayari amekufa. Tanbihi huhifadhi upana huo wa maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa mistari miwili na taswira ya “mkono wako” vimehifadhiwa; “shambulio la mkono wako” limetumiwa kwa makusudi ili kuakisi neno adimu na kali תגרה.
