  yaml_path: translation/ot/psalms/039/006.yaml
  text: Surely a man walks about as a shadow[a]; surely they are in turmoil in vain[c][b]. He heaps up wealth and does not know who will gather it.
translation:
  language: sw
  text: Hakika, mwanadamu hutembea kama kivuli[a]; hakika, watu huangaika bure[b]. Hulundika mali, wala hajui ni nani atakayezikusanya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kama taswira,” “kama sura isiyo halisi,” au “kama mzuka.” Neno la Kiebrania kwa kawaida humaanisha “sura” au “taswira”; hapa linaonyesha maisha ya mwanadamu yasiyo na uthabiti.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “wao hufanya ghasia” au “wao huwa katika msukosuko.” Kitenzi ni cha wingi, ingawa “mwanadamu” katika kishazi kilichotangulia ni umoja; yaelekea kinawarejelea wanadamu kwa ujumla.'
    reason: lexical_alternative
  - marker: c
    text: Kiebrania hakitaji wazi “mali” katika kishazi cha kwanza, bali husema “hulundika”; kisha husema “nani atakayevikusanya,” likirejelea vitu vilivyolundikwa.
    reason: implicit_object
lexical_decisions:
- source_word: אַךְ
  choice: hakika
  rationale: Chembe hii imerudiwa mara mbili kwa msisitizo. “Hakika” huhifadhi msisitizo huo na urudiaji wa kishairi bila kuifanya iwe na maana finyu ya “tu” pekee.
- source_word: בְּצֶלֶם
  choice: kama kivuli
  rationale: צֶלֶם kwa kawaida ni “sura” au “taswira,” lakini hapa inaonyesha kuwako kwa mwanadamu kusiko na uthabiti. “Kama kivuli” ni sitiari ya kawaida na ya kueleweka katika Kiswahili, huku maana halisi zaidi ikihifadhiwa katika tanbihi.
- source_word: יִתְהַלֶּךְ אִישׁ
  choice: mwanadamu hutembea
  rationale: Kitenzi cha Kiebrania kinaonyesha kwenda au kutembea huku na huko. “Mwanadamu” humwakilisha binadamu kwa ujumla kwa njia ya asili katika Kiswahili.
- source_word: הֶבֶל
  choice: bure
  rationale: Neno hili linaweza kumaanisha pumzi, ubatili au kutokuwa na maana. Katika kishazi hiki linatumika kueleza kwamba pilikapilika hiyo haina faida.
- source_word: יֶהֱמָיוּן
  choice: watu huangaika
  rationale: Kitenzi cha wingi huonyesha msukosuko, makelele au pilikapilika. “Watu huangaika” huhifadhi wingi na kueleza shughuli ya wanadamu iliyojaa wasiwasi.
- source_word: יִצְבֹּר
  choice: hujilimbikizia mali
  rationale: Kitenzi humaanisha kukusanya au kulundika. Kitu kinachokusanywa hakijatajwa wazi katika Kiebrania; “mali” kimetolewa kutokana na muktadha wa vitu vilivyokusanywa.
- source_word: וְלֹא יֵדַע
  choice: wala hajui
  rationale: “Wala” huunganisha kwa kawaida katika Kiswahili tendo la kujilimbikizia na kutokujua kunakofuata.
- source_word: מִי אֹסְפָם
  choice: ni nani atakayezikusanya
  rationale: Kiwakilishi tamati cha Kiebrania ni cha wingi, kikirejelea vitu vilivyolimbikizwa. Upatanisho wa “-zi-” pamoja na “mali” huhifadhi wingi huo.
theological_decisions:
- issue: Lugha ya kiume inayomwakilisha binadamu katika אִישׁ
  choice: mwanadamu
  alternative: mtu; mwanamume
  rationale: אִישׁ ni nomino ya umoja ya kiume, lakini hapa inazungumzia hali ya binadamu kwa ujumla. “Mwanadamu” ni ya asili, yenye hadhi, na haiingizi dai kwamba mstari unawahusu wanaume peke yao.
- issue: Maana ya הֶבֶל katika pilikapilika za binadamu
  choice: bure
  alternative: ubatili; kama pumzi
  rationale: Tafsiri “bure” inaonyesha kutokuwa na faida kwa hangaiko bila kuondoa picha pana ya maisha yasiyo thabiti, ambayo tayari inaonekana katika “kivuli.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Urudiaji wa “hakika” umehifadhiwa, pamoja na mabadiliko ya Kiebrania kutoka umoja “mwanadamu” kwenda kitenzi cha wingi “watu huangaika.”
