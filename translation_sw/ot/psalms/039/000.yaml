lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa kiongozi wa waimbaji
  rationale: Katika vichwa vya zaburi neno hili humrejelea mwenye kusimamia uimbaji au utendaji wa muziki; tafsiri hii ni ya kawaida na inaeleweka katika Kiswahili cha sasa.
- source_word: לִידוּתוּן
  choice: kwa namna ya Yeduthuni
  rationale: Kihusishi ל kinaweza kuonyesha uhusiano au mwelekeo. Hapa kauli hii inadokeza namna, mtindo, au uhusiano wa kimuziki na Yeduthuni bila kudai maana hiyo kwa uhakika kamili.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ndilo neno la Kiswahili lililozoeleka kwa utungo wa aina ya mizmor, hasa katika kitabu cha Zaburi.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kauli 'ya Daudi' huhifadhi upana wa kihusishi ל, ambacho kinaweza kuashiria utunzi, umilikaji, uwekaji wakfu, au uhusiano, bila kulazimisha maana ya 'iliyoandikwa na Daudi'.
theological_decisions:
- issue: Uhusiano wa zaburi na Daudi
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi
  rationale: Kiebrania לְדָוִד hakiamui wazi kwamba Daudi ndiye mtunzi; tafsiri imehifadhi utata huo wa kimsingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo mfupi wa kichwa umehifadhiwa, pamoja na utata halisi wa vihusishi vya Kiebrania. Jina יְדוּתוּן limetoholewa kuwa “Yeduthuni,” kwa kufuata matamshi ya Kiebrania na maumbo yanayoeleweka katika Kiswahili.
