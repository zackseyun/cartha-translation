  footnotes:
  - marker: a
    text: Au “kwa ajili ya Yeduthuni” au “kulingana na Yeduthuni”; kihusishi cha Kiebrania kinaweza kuonyesha aina mbalimbali za uhusiano katika vichwa vya zaburi.
