  text: לַ/יהוָ֥ה הַ/יְשׁוּעָ֑ה עַֽל עַמְּ/ךָ֖ בִרְכָתֶ֣/ךָ סֶּֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/008.yaml
  text: Salvation belongs to Yahweh[a]; your blessing be on your people[b]. Selah
translation:
  language: sw
  text: 'Wokovu ni wa Yahweh;

    baraka yako iwe juu ya watu wako.[a]

    Sela.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Baraka yako iko juu ya watu wako.” Kishazi cha Kiebrania hakina kitenzi na kinaweza kueleweka kama taarifa au ombi.
    reason: alternative_reading
  - marker: b
    text: “Sela” huenda ni alama ya kiliturujia au ya muziki; maana yake kamili haijulikani.
    reason: cultural_note
lexical_decisions:
- source_word: לַיהוָה
  choice: ni wa Yahweh
  rationale: 'Kiambishi ל katika kishazi hiki kisicho na kitenzi kinaonyesha umilikaji au uhusiano: wokovu ni wa Yahweh au unatokana naye. “Ni wa Yahweh” huhifadhi muundo na maana hiyo bila kuifanya kuwa kauli pana zaidi.'
- source_word: הַיְשׁוּעָה
  choice: wokovu
  rationale: Neno hili humaanisha kuokolewa au kukombolewa. “Wokovu” ni neno la kawaida na lenye heshima linalofaa katika muktadha wa sala na linaacha wazi upeo wa ukombozi unaokusudiwa.
- source_word: עַל
  choice: juu ya
  rationale: Katika uhusiano na baraka na watu, preposisheni hii inaonyesha baraka ikikaa juu yao. “Juu ya” ni usemi wa kawaida wa Kiswahili katika muktadha huu.
- source_word: עַמְּךָ
  choice: watu wako
  rationale: עם hapa humaanisha jumuiya iliyo katika uhusiano na Mungu. “Watu wako” huhifadhi maana hiyo ya kijamii na ya uhusiano.
- source_word: בִרְכָתֶךָ
  choice: baraka yako
  rationale: ברכה humaanisha moja kwa moja “baraka.” Umoja wa kisarufi wa Kiebrania umehifadhiwa kwa “baraka yako.”
- source_word: סֶּלָה
  choice: Sela
  rationale: Maana kamili ya neno hili haijulikani, na huenda ni alama ya kiliturujia au ya muziki; kwa hiyo limetoholewa badala ya kutafsiriwa kwa kubahatisha.
theological_decisions:
- issue: Kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יהוה. “Yahweh” hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo.
- issue: Kukamilisha kishazi cha pili kisicho na kitenzi
  choice: baraka yako iwe juu ya watu wako
  alternative: baraka yako iko juu ya watu wako
  rationale: Kiebrania hakina kitenzi katika kishazi hiki, hivyo kinaweza kueleweka kama ombi au taarifa. Katika muktadha wa zaburi, “iwe” ni ombi la asili kwa Kiswahili; usomaji wa taarifa umehifadhiwa katika tanbihi ili kutofuta utata wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi, wa sasa na wenye heshima. Mistari mitatu inafuata vipashio vya maana vya Kiebrania. Alama za tanbihi zimewekwa baada ya kishazi kinachohusika na baada ya “Sela” ili zilingane moja kwa moja na maelezo yake.
