  text: ק֭וֹלִ/י אֶל יְהוָ֣ה אֶקְרָ֑א וַ/יַּֽעֲנֵ֨/נִי מֵ/הַ֖ר קָדְשׁ֣/וֹ סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/004.yaml
  text: With my voice I cry to Yahweh[a], and he answers me from his holy mountain[b]. Selah
translation:
  language: sw
  text: Kwa sauti yangu ninamwita Yahweh, naye ananijibu[a] kutoka katika mlima wake mtakatifu[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye alinijibu.” Kitenzi cha Kiebrania kinaweza kutafsiriwa kwa wakati uliopita katika muktadha huu.
    reason: alternative_reading
  - marker: b
    text: Tafsiri nyingine zinaweza kusema “kilima chake kitakatifu.” Neno la Kiebrania humaanisha hasa “mlima,” na yaelekea linarejelea Sayuni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֭וֹלִי
  choice: Kwa sauti yangu
  rationale: Huhifadhi nomino yenye kiambishi cha nafsi ya kwanza na msisitizo wake mwanzoni mwa mstari, huku ikionyesha kwamba mtunga zaburi anamwita Mungu kwa sauti.
- source_word: אֶל יְהוָה אֶקְרָא
  choice: ninamwita Yahweh
  rationale: Kitenzi קרא pamoja na אֶל katika muktadha wa sala humaanisha kumwita au kumlilia Mungu. “Ninamwita” ni Kiswahili cha kawaida na huhifadhi mwelekeo wa mwito kwa Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lenye herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: וַיַּעֲנֵנִי
  choice: naye ananijibu
  rationale: Wakati wa sasa huwasilisha uhai na imani ya mtunga zaburi kwamba Mungu humjibu. Umbo la Kiebrania pia linaweza kutafsiriwa kwa wakati uliopita, jambo lililohifadhiwa katika tanbihi.
- source_word: מֵהַר קָדְשׁוֹ
  choice: kutoka katika mlima wake mtakatifu
  rationale: הַר kimsingi ni “mlima,” na hapa yaelekea inarejelea Sayuni; “kutoka katika” huonyesha chanzo cha jibu.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana halisi ya istilahi hii ya kishairi au kimuziki haijulikani kwa hakika, hivyo imetoholewa bila kuifasiri zaidi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania hutumia jina binafsi la Mungu. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Wakati na hali ya וַיַּעֲנֵנִי katika ushairi
  choice: 'wakati wa sasa: “ananijibu”'
  alternative: 'wakati uliopita: “alinijibu”'
  rationale: Mfuatano wa vitenzi vya Kiebrania unaweza kueleweka kama tendo lililotokea, lakini katika ushairi unaweza pia kuwasilisha tendo kwa uhai au kama uzoefu wa uhakika. Matini kuu hutumia wakati wa sasa, huku uwezekano wa wakati uliopita ukitajwa katika tanbihi.
- issue: Mahali pa jibu la Mungu
  choice: “mlima wake mtakatifu”
  alternative: “kilima chake kitakatifu”
  rationale: Neno הַר humaanisha hasa mlima na yaelekea linadokeza Sayuni. Tafsiri haiongezi jina “Sayuni,” hivyo inadumisha namna ya usemi wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa urahisi. Mpangilio “Kwa sauti yangu” umewekwa mwanzoni ili kuhifadhi msisitizo wa Kiebrania. “Sela” limeachwa kama istilahi iliyotoholewa kwa sababu maana yake si hakika.
