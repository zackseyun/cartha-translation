  text: I will not fear myriads of people who have set themselves all around me[a].
translation:
  language: sw
  text: Sitaogopa makumi ya maelfu ya watu waliojipanga kunizunguka pande zote[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliojipanga dhidi yangu kila upande.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אִירָא
  choice: Sitaogopa
  rationale: Kikanushi pamoja na kitenzi cha hali isiyotimilika cha nafsi ya kwanza kinaonyesha uamuzi wenye uhakika; Kiswahili cha wakati ujao hasi kinawasilisha maana hiyo kwa kawaida.
- source_word: מֵרִבְבוֹת
  choice: makumi ya maelfu ya
  rationale: רְבָבוֹת ni wingi wa רְבָבָה, yaani makumi ya maelfu au idadi kubwa sana. Tafsiri hii inadumisha taswira ya idadi kubwa badala ya kuibadili kuwa neno la jumla kama 'wengi sana'.
- source_word: עָם
  choice: watu
  rationale: Katika muktadha huu עָם inarejelea umati wa watu wanaompinga mtunga zaburi, si taifa kama taasisi.
- source_word: אֲשֶׁר
  choice: walio-
  rationale: Kiambishi cha uhusiano 'walio-' kinaunganisha kwa kawaida watu hao na tendo linalowafafanua.
- source_word: סָבִיב
  choice: pande zote
  rationale: Neno hili linaonyesha kuzungukwa kila upande; 'pande zote' huhifadhi taswira hiyo ya anga.
- source_word: שָׁתוּ
  choice: waliojipanga
  rationale: Kitenzi kina maana ya kuweka au kupanga. Katika mazingira ya uhasama, 'kujipanga' huonyesha watu kujiweka katika nafasi bila kulazimisha maelezo ya ziada ya kijeshi.
- source_word: עָלָי
  choice: kunizunguka
  rationale: Ingawa עַל inaweza kumaanisha 'dhidi yangu,' pamoja na סָבִיב na שָׁתוּ hapa inaeleza kujipanga kumzunguka msemaji. Uadui wake umehifadhiwa kama uwezekano katika tanbihi.
