lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Lakini wewe
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha tofauti yenye mkazo dhidi ya dhiki iliyotajwa kabla; “Lakini wewe” ni ya kawaida na huhifadhi msisitizo huo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: מָגֵן בַּעֲדִי
  choice: ngao inayonizunguka
  rationale: מָגֵן ni ngao ya kujikinga, na בַּעֲדִי inaweza kumaanisha “kwa ajili yangu” au ulinzi unaomzunguka mtu; hapa taswira ya kuzungukwa na ulinzi inafaa muktadha.
- source_word: כְּבוֹדִי
  choice: utukufu wangu
  rationale: Huhifadhi usemi mfupi wa Kiebrania na maana zake za utukufu, heshima, na hadhi bila kuzipunguza kuwa maana moja tu.
- source_word: וּ/מֵרִים רֹאשִׁי
  choice: na ndiye unayeinua kichwa changu
  rationale: Kauli hii huhifadhi nguvu ya hali endelevu ya kitenzi kishirikishi na taswira halisi ya kuinuliwa kichwa.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Ee Yahweh
  alternative: Ee Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu; “Yahweh” hulihifadhi badala ya kuweka cheo mahali pake.
- issue: Maana ya nahau “anayeinua kichwa changu”
  choice: Kuhifadhi taswira halisi katika matini kuu
  alternative: anayenirudishia heshima / anayenipa moyo / anayenithibitisha kuwa mwenye haki
  rationale: Taswira ya Kiebrania inaweza kuhusisha kurudishwa kwa hadhi, ujasiri, au kuthibitishwa; matini kuu haiifungi kwa maana moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo “ndiye unayeinua” unasisitiza mhusika kama ilivyo katika kishirikishi cha Kiebrania.
