  yaml_path: translation/ot/psalms/003/003.yaml
  text: But you[a], O Yahweh, are a shield around me, my glory[b], and the one who lifts up my head.
translation:
  language: sw
  text: Lakini wewe, Ee Yahweh, ni ngao inayonizunguka[a], utukufu wangu, na wewe ndiye unayeinua kichwa changu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ngao kwa ajili yangu” au “ngao kwa niaba yangu.” Kihusishi cha Kiebrania kinaweza kuonyesha ulinzi kwa ajili ya mtu; hapa huenda taswira ni ya ulinzi unaomzunguka.
    reason: lexical_alternative
  - marker: b
    text: “Kuinua kichwa” ni nahau ya Kiebrania inayoweza kumaanisha kumrudishia mtu hadhi au ujasiri, au kumthibitisha kuwa mwenye haki.
