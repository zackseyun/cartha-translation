base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/007.yaml
  text: Rise up[a], O Yahweh; save me, my God. For you have struck all my enemies on the cheek; you have broken the teeth of the wicked.
translation:
  language: sw
  text: Inuka, ee Yahwe; uniokoe, Mungu wangu! Kwa maana umewapiga maadui wangu wote shavuni[a]; umevunja meno ya waovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “taya.” Vitenzi timilifu vya Kiebrania vinaweza kueleweka kuwa matendo yaliyokamilika; katika ushairi vinaweza pia kuonyesha tendo la hakika au la kawaida.
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: Inuka
  rationale: Ni amri ya kitenzi קום inayoelekezwa kwa Mungu; “Inuka” ni ombi la moja kwa moja na la kawaida la Mungu aingilie kati.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: הוֹשִׁיעֵנִי
  choice: uniokoe
  rationale: Hifili ya ישׁע yenye kiambishi cha nafsi ya kwanza umoja ina maana pana ya kuokoa au kukomboa; “uniokoe” huhifadhi ombi hilo moja kwa moja.
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Huhifadhi umilikishi na hali ya ombi la kibinafsi.
- source_word: כִּי
  choice: Kwa maana
  rationale: Hutambulisha msingi au sababu ya ombi lililotangulia.
- source_word: הִכִּיתָ
  choice: umewapiga
  rationale: Kauli timilifu ya Kiebrania imetafsiriwa kama tendo lililotimizwa, bila kuondoa uwezekano wa lugha ya uhakika wa kishairi.
- source_word: אֶת כָּל אֹיְבַי
  choice: maadui wangu wote
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kishazi cha yambwa.
- source_word: לֶחִי
  choice: shavuni
  rationale: Neno linaweza kumaanisha shavu au taya; “shavuni” ni Kiswahili cha kawaida kinachoendeleza picha ya kipigo na fedheha, huku maana ya “taya” ikiwekwa katika tanbihi.
- source_word: שִׁנֵּי רְשָׁעִים
  choice: meno ya waovu
  rationale: Huhifadhi taswira halisi ya meno na matumizi ya kivumishi cha wingi kama nomino ya kundi.
- source_word: שִׁבַּרְתָּ
  choice: umevunja
  rationale: Kauli timilifu imetafsiriwa kwa hali timilifu ya Kiswahili, ikihifadhi usambamba wake na “umewapiga.”
theological_decisions:
- issue: Kauli timilifu הִכִּיתָ na שִׁבַּרְתָּ katika sala ya kishairi
  choice: umewapiga … umevunja
  alternative: unawapiga … unavunja; au kauli ya uhakika kuhusu tendo lijalo
  rationale: Miundo hiyo ni timilifu kwa umbo na inaweza kueleza tendo lililokamilika, lakini katika ushairi inaweza pia kuonyesha uhakika au tendo la kawaida. Hali timilifu ya Kiswahili inafuata umbo la msingi bila kudai kwamba muktadha hauwezi kuwa na maana nyingine.
- issue: Taswira ya ukatili dhidi ya maadui
  choice: Kuhifadhi kupigwa shavuni na kuvunjwa meno
  alternative: Kufupisha kuwa kuwashinda waovu
  rationale: Kiebrania kinatumia picha halisi ya kuaibishwa na kunyang’anywa uwezo; kuifanya kuwa lugha dhahania kungepunguza nguvu ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Ee” hudumisha mwito wa sala, na “shavuni” huepuka kishazi kizito “kwenye shavu.”
