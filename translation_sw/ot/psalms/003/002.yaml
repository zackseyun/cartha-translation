lexical_decisions:
- source_word: רַבִּים
  choice: Wengi
  rationale: Kivumishi hiki kimetumiwa kama nomino na kumaanisha watu wengi bila kuwataja kwa aina maalumu.
- source_word: אֹמְרִים
  choice: wanasema
  rationale: Umbo la kitenzi linaonyesha tendo linaloendelea au kurudiwa; wakati wa sasa wa Kiswahili unawasilisha maana hiyo kwa kawaida.
- source_word: לְנַפְשִׁי
  choice: kunihusu
  rationale: Ingawa kihalisi ni ‘kwa nafsi yangu,’ neno נֶפֶשׁ hapa linawakilisha mtu mwenyewe. ‘Kunihusu’ ni Kiswahili cha kawaida kinachoeleza kwamba maneno hayo yanasemwa juu ya mtunga zaburi.
- source_word: אֵין
  choice: hakuna
  rationale: Hili ni kanusho la kuwapo, na ‘hakuna’ linadumisha muundo na nguvu yake.
- source_word: יְשׁוּעָתָה
  choice: wokovu
  rationale: Neno hili linaweza kumaanisha kuokolewa au kukombolewa kutoka hatarini. ‘Wokovu’ linahifadhi uzito wake wa kawaida katika Zaburi bila kuondoa maana ya uokozi wa hali halisi.
- source_word: לּוֹ
  choice: kwa ajili yake
  rationale: Kiwakilishi kinamrejelea mtunga zaburi katika nafsi ya tatu ndani ya maneno ya wapinzani wake.
- source_word: בֵאלֹהִים
  choice: kwa Mungu
  rationale: Hiki kinahifadhi uhusiano mpana wa kihusishi ב bila kuufanya wazi zaidi kuwa ‘kutoka kwa Mungu’ au ‘kwa njia ya Mungu.’ Katika Kiswahili, ‘kwa Mungu’ huwasilisha kwa kawaida wazo kwamba hakuna wokovu unaopatikana kwake upande wa Mungu.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana sahihi ya istilahi hii haijulikani; imenukuliwa kwa sauti badala ya kutafsiriwa kwa dhana isiyo na uhakika.
theological_decisions:
- issue: Iwapo יְשׁוּעָה itafsiriwe kwa neno pana la uokozi wa hatari au kwa ‘wokovu’
  choice: wokovu
  alternative: uokozi; ukombozi; msaada
  rationale: ‘Wokovu’ linahifadhi maana ya kuokolewa katika tukio hili pamoja na mwangwi mpana wa kitheolojia wa neno hilo katika Zaburi, bila kudai kwamba mstari unazungumzia tu wokovu wa kiroho.
- issue: Iwapo לְנַפְשִׁי itafsiriwe kihalisi kuwa ‘kwa nafsi yangu’
  choice: kunihusu
  alternative: kwa nafsi yangu; juu yangu
  rationale: Hapa ‘nafsi’ inasimama kwa mtu mzima. Tafsiri ya nahau inaepuka kuingiza wazo lisilokusudiwa kwamba maadui wanazungumza moja kwa moja na sehemu ya ndani ya mtu.
- issue: Jinsi ya kuwasilisha בֵאלֹהִים bila kuamua zaidi ya maandishi
  choice: kwa Mungu
  alternative: katika Mungu; kutoka kwa Mungu; pamoja na Mungu
  rationale: Kihusishi ב kinaweza kuhusisha kuwa ndani, pamoja na, au katika eneo la uwezo wa Mungu. ‘Kwa Mungu’ ni cha kawaida zaidi katika Kiswahili kuliko ‘katika Mungu’ katika sentensi hii, huku kikiepuka kuongeza kwa uhakika wazo la chanzo linalopatikana katika ‘kutoka kwa Mungu.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa mistari unahifadhi mwendo wa kishairi na kauli iliyonukuliwa. ‘Kwa Mungu hakuna wokovu kwa ajili yake’ ni rasmi kwa kiasi, lakini hudumisha kanusho la kuwapo na kutatua kwa kiwango kidogo tu uhusiano wenye utata wa kihusishi cha Kiebrania.
