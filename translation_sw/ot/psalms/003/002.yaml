translation:
  language: sw
  text: 'Wengi wanasema kunihusu[a],


    “Hakuna wokovu kwake katika Mungu.”


    Sela.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “kwa nafsi yangu”; hapa ni nahau inayomaanisha “kunihusu” au “juu yangu.”
    reason: lexical_alternative
