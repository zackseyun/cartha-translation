  text: מִזְמ֥וֹר לְ/דָוִ֑ד בְּ֝/בָרְח֗/וֹ מִ/פְּנֵ֤י אַבְשָׁל֬וֹם בְּנֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/000.yaml
  text: A psalm of David[a], when he fled from Absalom his son.
translation:
  language: sw
  text: Zaburi ya Daudi[a], alipomkimbia Absalomu mwanawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “iliyoandikwa na Daudi” au “kwa ajili ya Daudi”; kichwa cha Kiebrania kinaweza kuonyesha utunzi, wakfu, umiliki, au uhusiano.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Ni neno la kichwa linalotaja utungo wa kishairi na kimuziki; “Zaburi” ndilo neno lililozoeleka na sahihi katika muktadha wa kitabu hiki.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kiambishi לְ kinaweza kuonyesha utunzi, wakfu, umiliki, au uhusiano. “Ya Daudi” ni Kiswahili cha kawaida kinachohifadhi upana huo kuliko kutaja wazi “iliyoandikwa na Daudi” au “kwa ajili ya Daudi.”
- source_word: בְּבָרְחוֹ
  choice: alipomkimbia
  rationale: Muundo wa בְּ pamoja na kitenzi-jina na kiambishi cha nafsi una maana ya wakati; katika Kiswahili, “alipomkimbia” ni tafsiri ya asili na huonyesha pia kwamba Daudi alikuwa akikimbia ili kumwepuka Absalomu.
- source_word: מִפְּנֵי
  choice: -mkimbia
  rationale: Ingawa kihalisi ni “kutoka mbele ya/uweponi pa,” katika muktadha huu humaanisha kumkimbia mtu; maana hiyo imewasilishwa kwa kitenzi cha Kiswahili bila usemi mzito usio wa kawaida.
- source_word: אַבְשָׁלוֹם
  choice: Absalomu
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Huwasilisha moja kwa moja nomino yenye kiambishi cha nafsi ya tatu, huku ikidumisha msisitizo wa uhusiano wa kifamilia.
theological_decisions:
- issue: Maana ya kichwa chenye uhusiano na Daudi
  choice: Kutumia “ya Daudi” bila kuamua wazi kuwa Daudi ndiye mwandishi
  alternative: “iliyoandikwa na Daudi” au “kwa ajili ya Daudi”
  rationale: Kihusishi cha Kiebrania kinaweza kuonyesha utunzi, wakfu, umiliki, au uhusiano. Tafsiri inadumisha utata halisi badala ya kutoa dai la kihistoria lenye nguvu kuliko maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kichwa kimewekwa kwa ufupi na kwa mtindo wa kawaida wa vichwa vya zaburi; “mwanawe” hudumisha uzito wa uhusiano wa kifamilia.
