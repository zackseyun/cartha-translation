  text: יְ֭הוָה מָֽה רַבּ֣וּ צָרָ֑/י רַ֝בִּ֗ים קָמִ֥ים עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/001.yaml
  text: O Yahweh[a], how many are my adversaries! Many are rising up against me.
translation:
  language: sw
  text: Ee Yahwe[a], jinsi adui zangu walivyo wengi! Wengi wanainuka dhidi yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH,” jina maalumu la Mungu; limetolewa hapa kwa umbo la “Yahwe.”'
    reason: Ufafanuzi wa jina la Mungu katika lugha ya asili.
lexical_decisions:
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Nimetumia jina la Mungu lililo katika maandishi ya Kiebrania, huku kihisishi “Ee” kikionyesha kwamba mtunga zaburi anamwita moja kwa moja.
- source_word: מָה רַבּוּ
  choice: wamekuwa wengi namna gani
  rationale: מָה ni ya mshangao hapa, na ukamilifu wa רַבּוּ unaweza kuonyesha kwamba wapinzani wameongezeka na sasa ni wengi; usemi huu wa Kiswahili huhifadhi mshangao huo.
- source_word: צָרָי
  choice: adui zangu
  rationale: Neno hili humaanisha watu wanaompinga au kumsonga msemaji; “adui zangu” ni la kawaida, wazi, na halilazimishi muktadha wa kijeshi.
- source_word: רַבִּים
  choice: Wengi
  rationale: Kivumishi hiki kimetumiwa kama nomino kwa msisitizo mwanzoni mwa kishazi cha pili.
- source_word: קָמִים עָלָי
  choice: wanainuka dhidi yangu
  rationale: Muundo wa participle pamoja na עַל unaonyesha upinzani unaoendelea; “wanainuka dhidi yangu” huhifadhi sitiari bila kuibadili kuwa tendo mahususi kama kushambulia.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina maalumu la Mungu, si cheo. “Yahwe” hulihifadhi kwa umbo linalotumiwa kwa kawaida katika Kiswahili, bila kulibadili kuwa “BWANA” au kutumia umbo la baadaye “Yehova”.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mshangao na marudio ya “wengi” yamehifadhiwa, pamoja na taswira ya watu kuinuka dhidi ya msemaji.
