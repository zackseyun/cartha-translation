  text: אֲנִ֥י שָׁכַ֗בְתִּי וָֽ/אִ֫ישָׁ֥נָ/ה הֱקִיצ֑וֹתִי כִּ֖י יְהוָ֣ה יִסְמְכֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/005.yaml
  text: I lay down and slept[a]; I awoke[b], because Yahweh sustains me.
translation:
  language: sw
  text: Nilijilaza, nikalala; nikaamka, kwa maana Yahwe ananitegemeza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ananishikilia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכַבְתִּי
  choice: Nilijilaza
  rationale: Kitenzi שׁכב humaanisha kulala chini au kujilaza. “Nilijilaza” kinaonyesha tendo la kujiweka chini kwa ajili ya kulala na kinafaa katika mfuatano wa matendo ya mstari huu.
- source_word: וָאִישָׁנָה
  choice: nikalala
  rationale: Kitenzi ישׁן humaanisha “kulala.” Muundo wa “nika-” unaunganisha kwa ufupi na kwa kawaida tendo hili na tendo lililotangulia.
- source_word: הֱקִיצוֹתִי
  choice: nikaamka
  rationale: Kitenzi קיץ hapa ni kisichohitaji yambwa na humaanisha mwenye kusema aliamka. “Nikaamka” ni Kiswahili cha sasa, wazi na cha kishairi bila kuwa kigumu.
- source_word: כִּי
  choice: kwa maana
  rationale: כִּי inaleta sababu ya kuamka kwake salama. “Kwa maana” huhifadhi uhusiano huo wa kisababu na inafaa katika mtindo wenye hadhi wa zaburi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetolewa kama jina binafsi “Yahwe,” badala ya kubadilishwa na cheo kama “BWANA.” Tahajia hii ni ya kawaida katika Kiswahili.
- source_word: יִסְמְכֵנִי
  choice: ananitegemeza
  rationale: Kitenzi סמך kina wazo la kutegemeza, kushikilia au kuendeleza. Wakati wa sasa katika “ananitegemeza” unaonyesha msaada wa Yahwe unaoendelea na unaeleza sababu ya usalama wa msemaji.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi jina hilo wazi bila kuingiza desturi ya kulibadilisha kwa cheo.
- issue: Nguvu ya יִסְמְכֵנִי
  choice: ananitegemeza
  alternative: ananishikilia
  rationale: “Ananitegemeza” hudokeza msaada endelevu unaomwezesha msemaji kulala na kuamka salama; “ananishikilia” pia inawezekana, lakini inaweza kusikika zaidi kama tendo la kimwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko mfupi wa kishairi na lugha ya kawaida yenye hadhi. Mfuatano wa “Nilijilaza, nik睡; nikaamka” umehifadhi mpangilio wa matendo ya Kiebrania.
