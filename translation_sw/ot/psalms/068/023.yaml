lexical_decisions:
- source_word: לְמַעַן
  choice: ili
  rationale: Huonyesha kusudi au matokeo; “ili” ni ya kawaida katika Kiswahili na huhifadhi nguvu ya kishazi cha Kiebrania.
- source_word: תִּמְחַץ
  choice: uwaponde
  rationale: Kitenzi מחץ kina maana ya kupiga au kuponda. Kiambishi cha yambwa “-wa-” kinaweka wazi yambwa inayodokezwa na muktadha, yaani maadui, huku picha kali ya ushindi ikihifadhiwa.
- source_word: רַגְלְךָ
  choice: mguu wako
  rationale: Nomino ya Kiebrania iko katika umoja na ina kiambishi cha nafsi ya pili umoja; umoja umehifadhiwa.
- source_word: בְּדָם
  choice: katika damu
  rationale: Huhifadhi kwa ukaribu kihusishi ב na picha ya mguu unaoponda ukiwa katika damu bila kufafanua kupita kiasi uhusiano wa kisarufi.
- source_word: לְשׁוֹן כְּלָבֶיךָ
  choice: ulimi wa mbwa wako
  rationale: “Ulimi” umehifadhiwa katika umoja kama umoja wa kijumla, huku כְּלָבֶיךָ ikiwakilishwa na “mbwa wako,” ambayo katika muktadha huu ni wingi.
- source_word: מֵאֹיְבִים
  choice: kutoka kwa maadui
  rationale: Kihusishi מן huonyesha chanzo; tafsiri hii inaonyesha kuwa fungu la mbwa linatoka kwa maadui walioshindwa.
- source_word: מִנֵּהוּ
  choice: upate fungu lake
  rationale: Umbo hili ni gumu na kishazi ni cha mkato. Tafsiri kuu inatoa maana inayowezekana ya kupata fungu bila kurudia kwa Kiswahili maneno yasiyoeleweka ya “kutoka kwake”; hali halisi na ugumu wake vinaelezwa katika tanbihi.
theological_decisions:
- issue: Picha kali ya vita na damu
  choice: Kuhifadhi picha ya mguu unaoponda katika damu na mbwa wanaopata fungu kutoka kwa maadui
  alternative: Kulainisha mstari uwe taarifa ya jumla kuhusu ushindi
  rationale: Kiebrania kinatumia picha dhahiri na kali ya ushindi vitani. Hakuna msingi wa kiisimu au kiteolojia wa kuipunguza nguvu hiyo.
- issue: Kishazi cha mwisho kilicho na utata
  choice: Kutafsiri kwa mtiririko wa kawaida kuwa ulimi wa mbwa unapata fungu lake kutoka kwa maadui, huku tanbihi ikihifadhi ugumu huo
  alternative: Kutafsiri neno kwa neno “kutoka kwake,” jambo linaloacha uhusiano wa maneno ukiwa mgumu sana katika Kiswahili
  rationale: Kiswahili cha matini kuu kinahitaji kueleweka, lakini tafsiri haipaswi kuficha kwamba מִנֵּהוּ na uhusiano wake na maneno yaliyotangulia vina utata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Umoja wa “mguu” na “ulimi” umehifadhiwa, na picha kali ya vita haijalainishwa. “Fungu” ni neno la kawaida lakini lenye uzito unaofaa kwa ushairi wa zaburi.
