base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/002.yaml
  text: As smoke is driven away[a], so you drive them away; as wax melts before fire[c][b], so the wicked perish before God.
translation:
  language: sw
  text: Kama moshi unavyotawanywa[a], ndivyo unavyowatawanya; kama nta inavyoyeyuka mbele ya moto[b], ndivyo waovu wanavyoangamia mbele za Mungu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “unavyopeperushwa mbali”; kitenzi cha Kiebrania kinaweza kumaanisha kufukuzwa, kutawanywa, au kupeperushwa mbali.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kutoka mbele ya moto” na baadaye “kutoka mbele za Mungu”; ni nahau inayoweza kueleza sababu au kuwapo mbele ya mtu au kitu.
    reason: lexical_alternative
  - marker: c
    text: Vitenzi vya Kiebrania vinaweza pia kueleweka kwa wakati ujao (“utawatawanya ... wataangamia”) au kama ombi katika muktadha huu (“uwatawanye ... waangamie”).
    reason: alternative_reading
lexical_decisions:
- source_word: כְּ/הִנְדֹּף עָשָׁן
  choice: Kama moshi unavyotawanywa
  rationale: Muundo wa כ pamoja na kitenzi-jina unaanzisha ulinganisho. “Kama ... unavyotawanywa” ni Kiswahili cha kawaida kinachohifadhi picha ya moshi unaoondolewa na kutawanyika.
- source_word: תִּנְדֹּף
  choice: ndivyo unavyowatawanya
  rationale: Kitenzi hiki ni nafsi ya pili umoja wa kiume, hivyo kinamwelekea Mungu moja kwa moja. Kiambishi “-wa-” kinarejelea maadui/waovu wanaotajwa katika muktadha na mstari unaofuata; “kutawanya” pia huhifadhi uhusiano wa kitenzi na sehemu ya kwanza ya tashbihi.
- source_word: כְּ/הִמֵּס דּוֹנַג
  choice: kama nta inavyoyeyuka
  rationale: כ pamoja na kitenzi-jina huleta ulinganisho; muundo wenye kitenzi kamili ni wa asili katika Kiswahili. דּוֹנַג ni “nta.”
- source_word: מִ/פְּנֵי אֵשׁ
  choice: mbele ya moto
  rationale: Kirai hiki kihalisi huhusiana na kuwa mbele ya uso/uwepo wa kitu. “Mbele ya moto” huhifadhi taswira na kueleweka kwa kawaida kuwa nta huyeyuka kwa sababu ya kuwapo karibu na moto.
- source_word: יֹאבְדוּ
  choice: wanavyoangamia
  rationale: אבד hapa humaanisha kuangamia au kupotea. “Kuangamia” hudumisha uzito wa kishairi bila kubainisha njia maalumu ya maangamizi.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Neno hili linataja watu waovu kama kundi la kimaadili; “waovu” ni tafsiri fupi, ya kawaida, na yenye hadhi.
- source_word: מִ/פְּנֵי אֱלֹהִים
  choice: mbele za Mungu
  rationale: “Mbele za Mungu” ni nahau ya Kiswahili yenye hadhi inayowasilisha maana ya kuwa katika uwepo wake, huku ikihifadhi ulinganifu na “mbele ya moto.”
theological_decisions:
- issue: Nguvu ya vitenzi vya imperfecti katika tashbihi ya kishairi yenye muktadha wa ombi
  choice: 'Kauli ya wakati wa sasa yenye maana ya jumla: “unavyowatawanya ... wanavyoangamia”'
  alternative: Wakati ujao (“utawatawanya ... wataangamia”) au ombi (“uwatawanye ... waangamie”)
  rationale: Imperfecti za Kiebrania katika ushairi zinaweza kueleweka kama wakati ujao, tendo la kawaida, au hali ya kutakia. Kauli ya sasa ya jumla inadumisha picha hai na haiamui kimabavu kati ya unabii na ombi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa “kutawanywa/kuwatawanya” na “mbele ya/mbele za” umehifadhiwa ili kuonyesha ulinganifu wa Kiebrania. “Nta” limetumiwa badala ya maelezo marefu zaidi kwa kuwa ni neno la kawaida na sahihi.
