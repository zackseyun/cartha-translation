  text: נ֤וֹרָ֥א אֱלֹהִ֗ים מִֽ/מִּקְדָּ֫שֶׁ֥י/ךָ אֵ֤ל יִשְׂרָאֵ֗ל ה֤וּא נֹתֵ֨ן עֹ֖ז וְ/תַעֲצֻמ֥וֹת לָ/עָ֗ם בָּר֥וּךְ אֱלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/035.yaml
  text: Awesome is God from your sanctuaries; the God of Israel—he gives strength and mighty power to the people[a]. Blessed be God!
translation:
  language: sw
  text: Mungu ni wa kuogopwa kutoka katika mahali pako patakatifu[a]; Mungu wa Israeli—yeye huwapa watu nguvu na uwezo mkubwa. Mungu na abarikiwe!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka katika patakatifu pako” (umoja), au “ndani ya patakatifu pako.” Kiebrania kina umbo la wingi, kihalisi “kutoka katika mahali pako patakatifu”; wingi huo unaweza kurejelea makao matakatifu ya Mungu kwa maana ya ukuu au ya jumla.
    reason: alternative_reading
lexical_decisions:
- source_word: נוֹרָא
  choice: wa kuogofya
  rationale: Neno hili humweleza Mungu kuwa mwenye kuamsha hofu yenye kicho kutokana na ukuu wake. ‘Wa kuogofya’ ni Kiswahili cha sasa na chenye heshima, bila kudokeza tu ubaya au ukatili.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania ni la wingi, hapa linamtaja Mungu mmoja wa Israeli.
- source_word: מִמִּקְדָּשֶׁיךָ
  choice: kutoka mahali pako patakatifu
  rationale: Kihusishi מִן kimehifadhiwa kwa ‘kutoka.’ Kiswahili ‘mahali pako patakatifu’ ni cha asili, lakini hakionyeshi wazi tofauti ya umoja na wingi; umbo la wingi la Kiebrania na uwezekano wa maana ya umoja umeelezwa katika tanbihi.
- source_word: אֵל יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Kirai hiki kinamtambulisha Mungu aliyetajwa kuwa Mungu wa Israeli.
- source_word: הוּא
  choice: ndiye
  rationale: ‘Ndiye’ linaonyesha mkazo wa kiwakilishi cha Kiebrania kwa njia ya kawaida katika Kiswahili.
- source_word: נֹתֵן
  choice: anayewapa
  rationale: Hali ya kuendelea ya kitenzi kishirikishi inaeleza tendo la kawaida au la tabia; ‘anayewapa’ huwasilisha maana hiyo.
- source_word: עֹז
  choice: nguvu
  rationale: ‘Nguvu’ ni maana ya kawaida ya neno hili na inatofautishwa na neno linalofuata.
- source_word: וְתַעֲצֻמוֹת
  choice: na uwezo mkuu
  rationale: Tafsiri hii inahifadhi wazo la uwezo wenye nguvu nyingi bila kurudia tu ‘nguvu.’
- source_word: לָעָם
  choice: watu
  rationale: Kiebrania kinasema ‘watu’ bila kiwakilishi cha umilikaji. Kwa hiyo ‘watu wake’ hakijaongezwa.
- source_word: בָּרוּךְ
  choice: na abarikiwe
  rationale: Hii ni kauli ya sifa na baraka; ‘Mungu na abarikiwe!’ ni usemi wa asili wa Kiswahili unaohifadhi nguvu ya mshangao.
theological_decisions:
- issue: Idadi na maana ya מִמִּקְדָּשֶׁיךָ (‘mahali patakatifu’)
  choice: mahali pako patakatifu, huku wingi wa Kiebrania ukielezwa katika tanbihi
  alternative: kutoka katika mahali pako patakatifu pengi; au ndani ya mahali pako patakatifu
  rationale: Umbo la Kiebrania ni la wingi na lina kiambishi cha nafsi ya pili umoja. Hata hivyo, wingi huo unaweza kutumiwa kwa makao matakatifu ya Mungu kwa maana ya kiujumla au ya ukuu. Kiswahili cha kawaida hakina njia ya asili ya kuonyesha wingi huo bila kuongeza dhana ya ‘pengi’ au ‘mbalimbali’; kwa hiyo utata wa asili umehifadhiwa kwa tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘ndiye anayewapa’ unaakisi mkazo wa Kiebrania, na tanbihi inalinda utata wa idadi na wa kihusishi bila kufanya mstari mkuu kuwa mgumu.
