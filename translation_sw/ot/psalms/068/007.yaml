lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Nomino iliyo mwanzoni mwa usemi inaeleweka kama mwito wa moja kwa moja kwa Mungu. Kiswahili cha kawaida hutumia “Ee” kuonyesha wazi mwito huo bila kubadili mhusika.
- source_word: בְּצֵאתְךָ
  choice: ulipotoka
  rationale: Muundo wa ב pamoja na kitenzi-jina na kiambishi cha nafsi ya pili una maana ya wakati; “ulipotoka” ni ya asili na huhifadhi tukio lililopita.
- source_word: לִפְנֵי עַמֶּךָ
  choice: mbele ya watu wako
  rationale: Huhifadhi taswira ya Mungu akiwa mbele ya watu wake, akiwaongoza.
- source_word: בְּצַעְדְּךָ
  choice: ulipopiga hatua
  rationale: צעד humaanisha kupiga hatua au kuandamana. “Ulipopiga hatua” hudumisha maana ya mwendo wenye kusudi bila kulazimisha taswira ya kijeshi ambayo si lazima katika neno lenyewe.
- source_word: בִישִׁימוֹן
  choice: jangwani
  rationale: יְשִׁימוֹן hurejelea eneo kame, tupu na lisilokaliwa. “Jangwani” ni Kiswahili cha kawaida na kinaendana na kiambishi ב, ambacho hapa kinaweza kueleza mahali au eneo la mwendo.
- source_word: סֶלָה
  choice: Sela
  rationale: Neno limeandikwa kwa matamshi kwa sababu maana au kazi yake kamili haijulikani kwa hakika; huenda ni alama ya muziki au ibada.
theological_decisions:
- issue: Tendo la Mungu katika safari ya watu wake jangwani
  choice: Mstari umetafsiriwa kama mwito wa moja kwa moja kwa Mungu unaokumbuka jinsi alivyotangulia mbele ya watu wake jangwani.
  alternative: Kusoma mwanzo kama maelezo tu badala ya mwito wa moja kwa moja.
  rationale: Mpangilio wa sentensi na muktadha wa zaburi unaunga mkono usemi unaomwelekea Mungu moja kwa moja, huku tafsiri ikiacha taswira yenyewe bila kuongeza maelezo ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Urudiaji wa “ulipo-” umehifadhi usambamba wa kishairi; “Ee Mungu” huweka wazi mwito wa moja kwa moja; “Sela” limehifadhiwa kama istilahi isiyo na maana iliyothibitishwa.
