base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/031.yaml
  text: Nobles shall come from Egypt[b][a]; Cush shall quickly stretch out its hands to God.
translation:
  language: sw
  text: Watu mashuhuri[a] watakuja kutoka Misri; Kushi ataharakisha kunyoosha mikono yake kwa Mungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakuu” au “wajumbe.” Neno la Kiebrania ni adimu na huenda linamaanisha watu wenye hadhi kutoka Misri.
    reason: lexical_alternative
  - marker: b
    text: Au “Kushi ataharakisha kuelekeza mikono yake kwa Mungu.” Kiebrania humtaja Kushi, taifa lililofanywa mtu mmoja, kwa umoja wa kiume.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶאֱתָיוּ
  choice: watakuja
  rationale: Kitenzi hiki katika Qal, nafsi ya tatu wingi, kwa kawaida humaanisha kuja au kufika; tafsiri haiongezi wazo la kuleta kodi ambalo halijaelezwa moja kwa moja na kitenzi.
- source_word: חַשְׁמַנִּים
  choice: watu mashuhuri
  rationale: Nomino hii adimu inaelekea kumaanisha watu wenye hadhi kutoka Misri. ‘Watu mashuhuri’ ni Kiswahili cha kawaida kisichobainisha kupita kiasi kama walikuwa wakuu au wajumbe.
- source_word: מִנִּי מִצְרָיִם
  choice: kutoka Misri
  rationale: Kihusishi kinaonyesha chanzo au mahali walikotoka; ‘kutoka Misri’ ni usemi wa kawaida wa Kiswahili.
- source_word: כּוּשׁ
  choice: Kushi
  rationale: Jina la mahali limetoholewa moja kwa moja badala ya kubadilishwa kuwa jina la eneo la baadaye kama Ethiopia.
- source_word: תָּרִיץ
  choice: ataharakisha kunyoosha
  rationale: Hiphil ya רוץ ina wazo la kuharakisha. Pamoja na ‘mikono’ kama yambwa, maana ya kimuktadha ni kuharakisha kuinyoosha.
- source_word: יָדָיו
  choice: mikono yake
  rationale: Kiambishi cha Kiebrania ni nafsi ya tatu umoja wa kiume, kikilingana na taifa la Kushi lililowasilishwa kama mtu mmoja.
- source_word: לֵאלֹהִים
  choice: kwa Mungu
  rationale: Kihusishi kinaonyesha mwelekeo wa tendo kwa Mungu; katika Kiswahili, ‘kunyoosha mikono kwa Mungu’ ni usemi wa kawaida unaohifadhi uwezekano wa dua, kusujudu, au kujisalimisha.
theological_decisions:
- issue: Maana ya Kushi kunyoosha mikono kwa Mungu
  choice: Ishara inayoelekezwa kwa Mungu bila kubainishwa kama ni dua, ibada, au kujisalimisha.
  alternative: Tendo maalumu la kuleta kodi, au unabii unaobainisha moja kwa moja kuingizwa kikamilifu katika agano.
  rationale: Usemi wa kunyoosha mikono kwa Mungu unaweza kuashiria dua, kusihi, ibada, au kujisalimisha. Aya haibainishi kwa usahihi aina ya tendo hilo, kwa hiyo tafsiri inaacha maana hiyo wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Watu mashuhuri’ kinaeleweka kwa urahisi bila kuficha kwamba neno la asili ni adimu; ‘Kushi’ huhifadhi jina la kale. Muundo wa taifa kama mtu mmoja umehifadhiwa.
