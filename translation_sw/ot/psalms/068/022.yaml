  text: אָמַ֣ר אֲ֭דֹנָ/י מִ/בָּשָׁ֣ן אָשִׁ֑יב אָ֝שִׁ֗יב מִֽ/מְּצֻל֥וֹת יָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/022.yaml
  text: The Lord said[a], “I will bring them back from Bashan; I will bring them back from the depths of the sea,”
translation:
  language: sw
  text: Bwana alisema[a], “Nitawarudisha kutoka Bashani; nitawarudisha kutoka vilindi vya bahari.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Nitarudisha kutoka Bashani; nitarudisha kutoka vilindi vya bahari.” Kiebrania hakitaji wazi yambwa la kitenzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Jina la cheo אֲדֹנָי limetafsiriwa kwa neno la kawaida la heshima kwa Mungu, “Bwana”; hapa si jina la Mungu YHWH.
- source_word: אָמַר
  choice: alisema
  rationale: Qatal hii inatanguliza moja kwa moja maneno ya Mungu; “alisema” ni tafsiri ya kawaida na wazi.
- source_word: מִבָּשָׁן
  choice: kutoka Bashani
  rationale: מִן ni “kutoka,” na jina la mahali Bashan limeandikwa kwa umbo lililozoeleka katika Kiswahili, Bashani.
- source_word: אָשִׁיב ... אָשִׁיב
  choice: nitawarudisha ... nitawarudisha
  rationale: Hifili ya שוב ina maana ya kumrudisha au kuwaleta watu warudi. Kiambishi cha yambwa “-wa-” kimeongezwa kutokana na muktadha ili sentensi iwe ya kawaida katika Kiswahili, huku marudio yakihifadhiwa kwa ajili ya msisitizo.
- source_word: מִמְּצֻלוֹת יָם
  choice: kutoka vilindi vya bahari
  rationale: מְצֻלוֹת ni sehemu za ndani sana za maji; “vilindi vya bahari” ni usemi wa asili unaohifadhi taswira ya mahali pa mbali sana au hatari.
theological_decisions:
- issue: Yambwa lisilotajwa la kitenzi אָשִׁיב kilichorudiwa
  choice: 'Kuweka “-wa-”: “nitawarudisha”'
  alternative: 'Kuacha yambwa wazi: “nitarudisha kutoka Bashani; nitarudisha kutoka vilindi vya bahari”'
  rationale: Kiebrania hakitaji yambwa wazi, lakini Hifili ni elekezi na Kiswahili cha kawaida huhitaji kuonyesha kinachorudishwa katika muundo huu. Muktadha unaashiria watu; tanbihi inalinda uwazi wa kisarufi wa chanzo bila kuamua zaidi utambulisho wao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya kitenzi yamehifadhiwa; “Bashani” linafuata umbo la jina la mahali linalotumika kwa kawaida katika Kiswahili cha Biblia.
