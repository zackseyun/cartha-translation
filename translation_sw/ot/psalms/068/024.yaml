  text: רָא֣וּ הֲלִיכוֹתֶ֣י/ךָ אֱלֹהִ֑ים הֲלִ֘יכ֤וֹת אֵלִ֖/י מַלְכִּ֣/י בַ/קֹּֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/024.yaml
  text: They have seen your processions[a], O God— the processions of my God, my King, into the sanctuary.
translation:
  language: sw
  text: Wameyaona maandamano yako[a], Ee Mungu—maandamano ya Mungu wangu, Mfalme wangu, katika mahali patakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wameiona mienendo yako, Ee Mungu—mienendo ya Mungu wangu, Mfalme wangu, katika utakatifu.” Neno la Kiebrania linaweza kumaanisha mienendo, hatua, au maandamano; kirai cha mwisho pia kinaweza kueleweka kuwa “katika utakatifu.”
    reason: Huhifadhi maana mbadala za הֲלִיכוֹת na בַקֹּדֶשׁ, bila kufanya maana ya mwelekeo wa kuingia kuwa ya lazima katika matini kuu.
lexical_decisions:
- source_word: רָאוּ
  choice: Wameiona
  rationale: Kitenzi cha Qal timilifu, nafsi ya tatu wingi, kinaeleza jambo lililoshuhudiwa na kukamilika; wakati timilifu wa Kiswahili unafaa katika taswira hii hai ya kishairi.
- source_word: הֲלִיכוֹתֶיךָ
  choice: misafara yako
  rationale: Nomino hii ya wingi inaweza kumaanisha kwenda, hatua, au mienendo ya sherehe. Katika muktadha huu wa ibada na shangwe, “misafara” huonyesha mwendo wa hadharani wenye utaratibu bila kuufanya kuwa wazo la jumla tu.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Muktadha unaonyesha usemi wa kumwita Mungu moja kwa moja; “Ee” huwasilisha mwito huo kwa Kiswahili cha kishairi na cha heshima.
- source_word: הֲלִיכוֹת
  choice: misafara
  rationale: Kurudia nomino ileile na kuiweka katika wingi kunahifadhi msisitizo na usambamba wa kishairi wa Kiebrania.
- source_word: אֵלִי
  choice: Mungu wangu
  rationale: 'Muundo wenye kiambishi cha nafsi ya kwanza umoja una maana ya umilikaji: “Mungu wangu.”'
- source_word: מַלְכִּי
  choice: Mfalme wangu
  rationale: Hili ni jina la kifalme analopewa Mungu na mwandishi; tafsiri inalihifadhi bila kuongeza maana nyingine.
- source_word: בַקֹּדֶשׁ
  choice: ikiingia patakatifu
  rationale: Kihalisi kirai kinaweza kumaanisha “katika utakatifu/mahali patakatifu.” Katika muktadha wa msafara, Kiswahili hiki kinaonyesha kwa kawaida mwelekeo kuelekea eneo takatifu, huku uwezekano wa maana nyingine ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Kinachorejelewa na misafara
  choice: Mstari unaonyesha misafara ya sherehe ya Mungu ikiingia mahali patakatifu.
  alternative: Maneno hayo yanaweza kurejelea kwa ujumla mienendo au matendo ya Mungu yaliyoonekana, au misafara yake “katika utakatifu.”
  rationale: Kurudiwa kwa הֲלִיכוֹת, mwito kwa Mungu, na kirai cha mwisho בַקֹּדֶשׁ kwa pamoja vinaunga mkono taswira ya msafara wa ibada. Tafsiri haiongezi maelezo mahususi ya kihistoria ambayo hayapo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Misafara” imechaguliwa badala ya “maandamano,” ambalo katika matumizi ya sasa mara nyingi huhusishwa na maandamano ya kisiasa au ya kupinga jambo.
