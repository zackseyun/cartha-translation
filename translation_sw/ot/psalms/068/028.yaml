base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/028.yaml
  text: Your God has commanded your strength. Show strength[a], O God, you who have worked for us.
translation:
  language: sw
  text: Mungu wako ameamuru nguvu zako. Onyesha nguvu[a], Ee Mungu, wewe ambaye umetenda kwa ajili yetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania עוּזָה ni gumu. Linaweza pia kueleweka kuwa, “Uwe na nguvu, Ee Mungu,” au, kwa kulihusianisha na aya inayofuata, “Ee Mungu, tia nguvu kile ulichotenda kwa ajili yetu.”
    reason: alternative_reading
lexical_decisions:
- source_word: צִוָּה
  choice: ameamuru
  rationale: Kauli timilifu inaonyesha tendo lililofanyika lenye athari ya sasa; “ameamuru” huhifadhi wazo la kutoa agizo lenye mamlaka.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Ingawa אֱלֹהִים ina umbo la wingi, hapa ina maana ya umoja na inamtaja Mungu wa Israeli; kiambishi cha nafsi ya pili ya kiume umoja kinatolewa kwa “wako.”
- source_word: עֻזֶּךָ
  choice: nguvu zako
  rationale: Nomino hii humaanisha nguvu au uweza. “Nguvu zako” ni usemi wa kawaida wa Kiswahili na huhifadhi kiambishi cha nafsi ya pili.
- source_word: עוּזָה
  choice: Onyesha nguvu
  rationale: Umbo hili ni gumu kisintaksia. “Onyesha nguvu” hulitoa kama ombi kwa Mungu adhihirishe nguvu bila kuongeza kimilikishi kisichopo wazi katika kishazi hiki.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Hapa neno hilo limetumiwa kama mwito wa moja kwa moja; “Ee Mungu” ni namna ya asili na yenye heshima katika Kiswahili.
- source_word: זוּ
  choice: wewe ambaye
  rationale: Limeeleweka kama kiwakilishi cha uhusiano kinachotanguliza kishazi kinachomweleza Mungu katika mwito wa moja kwa moja.
- source_word: פָּעַלְתָּ
  choice: umetenda
  rationale: Kitenzi humaanisha kutenda au kufanya kazi kwa matokeo. “Umetenda” ni cha asili katika Kiswahili na hudumisha tendo la Mungu lililokamilika.
- source_word: לָּנוּ
  choice: kwa ajili yetu
  rationale: 'Kihusishi hapa kinaeleweka kwa maana ya kunufaisha: Mungu ametenda kwa manufaa ya watu wake.'
theological_decisions:
- issue: Utata wa umbo עוּזָה na uhusiano wake na kishazi kinachofuata
  choice: 'Ombi kwa Mungu aonyeshe nguvu: “Onyesha nguvu, Ee Mungu”'
  alternative: “Uwe na nguvu, Ee Mungu,” au “Ee Mungu, tia nguvu kile ulichotutendea”
  rationale: Kiebrania kina utata wa kisintaksia, na fasiri mbalimbali zinawezekana. Matini kuu huhifadhi nguvu ya ombi ndani ya aya bila kuingiza maneno kutoka aya inayofuata; tanbihi huhifadhi usomaji mwingine muhimu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa karibu na Kiebrania huku utata halisi wa עוּזָה ukihifadhiwa kwa tanbihi.
