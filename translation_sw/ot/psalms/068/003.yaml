  text: But the righteous will be glad[a]; they will exult before God[b], and they will rejoice with gladness.
translation:
  language: sw
  text: Lakini wenye haki watafurahi[a]; watashangilia mbele ya Mungu[b], nao watafurahi kwa shangwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na wenye haki watafurahi.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa tu kuwa “na”; “lakini” katika maandishi makuu kinaonyesha utofauti na mstari uliotangulia.
    reason: alternative_reading
  - marker: b
    text: Kiebrania “mbele ya Mungu,” yaani, katika uwepo wa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצַדִּיקִים
  choice: Lakini wenye haki
  rationale: צַדִּיקִים ni watu wenye haki. Kiunganishi וְ kinaweza kumaanisha “na,” lakini hapa “lakini” kinaonyesha kwa kawaida utofauti na hatima ya waovu katika mstari uliotangulia.
- source_word: יִשְׂמְחוּ
  choice: watafurahi
  rationale: Kitenzi שׂמח huonyesha furaha; “watafurahi” ni Kiswahili cha kawaida na kinaacha vitenzi vinavyofuata vihifadhi mikazo yake.
- source_word: יַעַלְצוּ
  choice: watashangilia
  rationale: עלץ huonyesha furaha kubwa na ya wazi; “watashangilia” hudumisha nguvu hiyo bila kutumia lugha isiyo ya kawaida.
- source_word: לִפְנֵי אֱלֹהִים
  choice: mbele za Mungu
  rationale: Kirai hiki humaanisha kihalisi kuwa mbele ya uso au katika uwepo wa Mungu; “mbele za Mungu” ni usemi wa heshima na unaoeleweka katika Kiswahili.
- source_word: וְיָשִׂישׂוּ
  choice: nao watafurahi
  rationale: שׂוש hueleza kufurahi au kushangilia. “Watafurahi” ni ya asili, huku “watashangilia” iliyotangulia ikibeba mkazo mkubwa zaidi wa עלץ.
- source_word: בְשִׂמְחָה
  choice: kwa shangwe
  rationale: Nomino שִׂמְחָה inaeleza namna na kuzidisha wazo la kufurahi; “kwa shangwe” huhifadhi mrundikano wa lugha ya furaha bila kuwa nzito.
