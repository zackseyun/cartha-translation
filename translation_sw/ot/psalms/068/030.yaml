source:
  edition: WLC
  text: גְּעַ֨ר חַיַּ֪ת קָנֶ֡ה עֲדַ֤ת אַבִּירִ֨ים בְּ/עֶגְלֵ֬י עַמִּ֗ים מִתְרַפֵּ֥ס בְּ/רַצֵּי כָ֑סֶף בִּזַּ֥ר עַ֝מִּ֗ים קְרָב֥וֹת יֶחְפָּֽצוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/030.yaml
  text: Rebuke the beast of the reeds[a], the herd of bulls among the calves of the peoples, trampling on pieces of silver[b]. Scatter the peoples who delight in wars.
translation:
  language: sw
  text: Mkemee mnyama wa matete[a], kundi la mafahali kati ya ndama wa mataifa, wanaokanyaga vipande vya fedha[b]. Watawanye mataifa wanaofurahia vita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnyama wa porini wa matete”; huenda hii ni taswira inayorejelea Misri au mamlaka nyingine yenye uhasama.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania cha kishazi hiki ni kigumu. Pia kinaweza kumaanisha “wanaojinyenyekeza kwa vipande vya fedha” au “wanaojitupa chini kwa vitalu vya fedha,” yaani wakitoa kodi.
    reason: alternative_reading
lexical_decisions:
- source_word: גְּעַר
  choice: Mkemee
  rationale: Kauli ya amri ya kitenzi גער inaonyesha karipio lenye nguvu linalodhibiti maadui; “mkemee” huhifadhi nguvu hiyo bila kuongeza wazo la kuwaangamiza.
- source_word: חַיַּת קָנֶה
  choice: mnyama wa matete
  rationale: Tafsiri hii huhifadhi taswira halisi ya mnyama wa eneo la matete bila kuamua kwamba ni kiboko, mamba, Misri, au mamlaka nyingine.
- source_word: עֲדַת אַבִּירִים
  choice: kundi la mafahali
  rationale: Katika mfululizo huu wa taswira za wanyama, אַבִּירִים yaeleweka kwa kawaida kuwa mafahali wenye nguvu, na עֲדַת kuwa kundi lao.
- source_word: בְּעֶגְלֵי עַמִּים
  choice: kati ya ndama za mataifa
  rationale: “Kati ya” huonyesha maana ya mahali au ushirika ya kihusishi ב, huku “ndama” ikiendeleza taswira ya mifugo na “mataifa” ikiwakilisha vikundi vya watu.
- source_word: מִתְרַפֵּס
  choice: anayekanyaga
  rationale: Neno hili tata limetafsiriwa hapa kama tendo la uhasama linalopatana na taswira ya mnyama na watu wanaofurahia vita; maana ya kujinyenyekeza imehifadhiwa katika tanbihi.
- source_word: בְּרַצֵּי כָסֶף
  choice: vipande vya fedha
  rationale: רַצֵּי ni neno lisilo wazi, huenda likimaanisha vipande au fito za fedha; “vipande” halibainishi umbo kwa uhakika usiokuwapo katika Kiebrania.
- source_word: בִּזַּר
  choice: Watawanye
  rationale: Ingawa umbo la Kiebrania limewekewa irabu kama wakati timilifu, katika ushairi huu linaeleweka vizuri kama ombi linaloendeleza amri ya mwanzo.
- source_word: קְרָבוֹת יֶחְפָּצוּ
  choice: wanaofurahia vita
  rationale: Maneno haya yanaonyesha watu wanaotamani au kupendezwa na mapigano; “wanaofurahia vita” ni Kiswahili cha kawaida kinachohifadhi uzito wa kimaadili.
theological_decisions:
- issue: Kama “mnyama wa matete” atambulishwe wazi kuwa Misri au mamlaka nyingine ya kihistoria
  choice: Taswira imehifadhiwa bila kumtaja taifa fulani katika matini kuu.
  alternative: Kumtambulisha hasa kuwa Misri, au kwa ujumla kuwa dola adui.
  rationale: Mazingira ya matete yanaweza kudokeza Misri, lakini mstari wenyewe hautaji Misri; kutohitimisha utambulisho huo huhifadhi uwazi na mvutano wa sitiari ya Kiebrania.
- issue: Kama מִתְרַפֵּס inaeleza kukanyaga kwa uhasama au kujinyenyekeza kwa kutoa fedha
  choice: Matini kuu inasema “anayekanyaga,” na usomaji wa kujinyenyekeza umewekwa katika tanbihi.
  alternative: “Anayejinyenyekeza kwa vipande vya fedha” au “anayejilaza kwa fito za fedha,” yaani akitoa kodi.
  rationale: Umbo hili lina utata wa kweli. Muktadha wa maadui wapenda vita unaunga mkono tendo la uhasama, lakini usomaji wa kujinyenyekeza na kutoa kodi una ushahidi wa kutosha usipuuzwe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Taswira za mnyama, mafahali na ndama zimehifadhiwa, huku sintaksia ikifanywa iwe wazi kwa msomaji wa kawaida. Alama zote za tanbihi zimewekwa katika matini kuu.
