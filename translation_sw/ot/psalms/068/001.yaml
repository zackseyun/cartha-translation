    text: 'Au, kwa tafsiri ya jadi ya kiombi: “Mungu na ainuke; adui zake na watawanyike, na wale wanaomchukia na wakimbie kutoka mbele zake.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יָקוּם
  choice: anainuka
  rationale: Qal imperfect nafsi ya tatu umoja ya קום. Katika ushairi inaweza kuwa taarifa hai au ombi lenye maana ya ‘na ainuke’; ‘anainuka’ huhifadhi taswira bila kuondoa utata huo, ambao umeelezwa katika tanbihi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo lake ni la wingi, hapa linaambatana na kitenzi cha umoja na linamtaja Mungu wa Israeli.
- source_word: יָפוּצוּ
  choice: wanatawanyika
  rationale: Qal imperfect wingi ya פוץ. ‘Wanatawanyika’ ni Kiswahili cha kawaida kinachoonyesha kuvunjika na kusambaa kwa adui.
- source_word: אֹיְבָיו
  choice: adui zake
  rationale: Ni nomino yenye kiambishi cha nafsi ya tatu umoja; tafsiri hii huhifadhi uhusiano wa umilikaji kwa uwazi.
- source_word: וְיָנוּסוּ
  choice: na ... wanakimbia
  rationale: Qal imperfect wingi ya נוס. ‘Wanakimbia’ huwasilisha mwendo wa kuondoka kwa hofu katika lugha ya sasa na yenye hadhi.
- source_word: מְשַׂנְאָיו
  choice: wale wanaomchukia
  rationale: Partisipio linalotumiwa kama nomino pamoja na kiambishi cha nafsi ya tatu umoja. Tafsiri hii huhifadhi nguvu ya kitendo cha kuchukia.
- source_word: מִפָּנָיו
  choice: mbele zake
  rationale: Kirai hiki kihalisi kina maana ya ‘kutoka mbele ya uso/uwepo wake.’ ‘Wanakimbia mbele zake’ ni tamko la kishairi linaloeleweka na kudokeza kukimbia kutoka katika uwepo wake.
theological_decisions:
- issue: Nguvu ya vitenzi vya imperfect katika muktadha wa kishairi wa Mungu kuinuka dhidi ya maadui
  choice: 'Mtindo wa taarifa hai: “Mungu anainuka; adui zake wanatawanyika...”'
  alternative: 'Mtindo wa ombi: “Mungu na ainuke; adui zake na watawanyike...”'
  rationale: Maumbo ya Kiebrania yanaweza kueleweka kama taarifa hai au kama ombi/takwa. Matini kuu inatumia taarifa ya wakati wa sasa, huku tanbihi ikihifadhi tafsiri ya jadi ya kiombi bila kutatua kimya kimya utata wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi na urudiaji sambamba umehifadhiwa; tanbihi inaonyesha kwa uwazi uwezekano wa kusoma vitenzi kama ombi.
