base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/014.yaml
  text: When the Almighty scattered kings there, it snowed on Zalmon.
translation:
  language: sw
  text: 'Mwenyezi alipowatawanya wafalme huko,

    theluji ilinyesha juu ya Salmoni.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁדַּי
  choice: Mwenyezi
  rationale: Jina hili la Mungu humtaja aliye na uwezo mkuu; “Mwenyezi” ni tafsiri ya kawaida, ya heshima, na inayoeleweka katika Kiswahili.
- source_word: בְּפָרֵשׂ
  choice: alipowatawanya
  rationale: Kitenzi פרשׂ hapa kina maana ya kutawanya au kusambaza, na kiambishi cha wakati בְּ־ kinaonyeshwa kwa “alipo-”.
- source_word: בָּהּ
  choice: huko
  rationale: Kiwakilishi hiki cha mahali ni kifupi na rejeo lake si wazi katika mstari wenyewe; “huko” huhifadhi hali hiyo bila kulazimisha rejeo maalumu.
- source_word: תַּשְׁלֵג
  choice: theluji ilianguka
  rationale: Umbo hili linamaanisha kuwa na theluji au kuanguka kwa theluji; usemi huu ni wa asili katika Kiswahili na hauongezi mtendaji asiyeelezwa.
- source_word: בְּצַלְמוֹן
  choice: juu ya Salmoni
  rationale: Salmoni ni jina la mahali; בְּ־ katika muktadha wa kuanguka kwa theluji linaweza kuwasilishwa kwa kawaida kama “juu ya.”
theological_decisions:
- issue: Rejeo la בָּהּ
  choice: huko
  alternative: ndani yake
  rationale: Rejeo la kiwakilishi cha Kiebrania haliko wazi katika mstari huu. “Huko” huhifadhi utata wa mahali na kuepuka kukitambulisha bila ushahidi kuwa nchi, eneo, au kitu kingine.
- issue: Taswira ya theluji
  choice: theluji ilianguka juu ya Salmoni
  alternative: palikuwa peupe kama theluji huko Salmoni
  rationale: Maandishi yanasema kwa namna ya moja kwa moja “ikatheluji/ikawa na theluji”; tafsiri haifanyi taswira hiyo kuwa tashbihi au sitiari kwa maiti, nyara, au tukio jingine lisilotajwa wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa mistari miwili unaakisi vipashio viwili vya kishairi vya Kiebrania.
