  text: God is a father of the fatherless and a judge of widows in his holy dwelling[a][b][c].
translation:
  language: sw
  text: Mungu ni baba wa watoto wasio na baba[a], na mwamuzi wa wajane[b], katika makao yake matakatifu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yatima.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mtetezi wa wajane”; neno la Kiebrania kihalisi zaidi humaanisha mtu anayehukumu au kusimamia haki.
    reason: lexical_alternative
  - marker: c
    text: Au, “kutoka katika makao yake matakatifu”; baadhi ya tafsiri huona kirai hiki kikionyesha mahali ambako Mungu anatenda akitokea, ingawa kihusishi cha Kiebrania kihalisi ni “katika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבִי
  choice: baba wa
  rationale: Hili ni umbo la construct la אָב. Katika kishazi kisicho na kitenzi, 'baba wa' huhifadhi uhusiano wa moja kwa moja na יְתוֹמִים na ni Kiswahili cha kawaida.
- source_word: יְתוֹמִים
  choice: watoto wasio na baba
  rationale: Neno hili hasa huonyesha watoto waliompoteza au wasio na baba. Kauli hii inahifadhi kwa uwazi udhaifu wa kijamii unaosisitizwa na Kiebrania; 'yatima' ni mbadala mfupi lakini inaweza kueleweka kwa upana zaidi.
- source_word: דַיַּן
  choice: mwamuzi wa
  rationale: Nomino hii humaanisha mtu anayehukumu au kusimamia haki. 'Mwamuzi' huhifadhi taswira ya kimahakama bila kuongeza moja kwa moja wazo la utetezi.
- source_word: אַלְמָנוֹת
  choice: wajane
  rationale: Ni nomino ya wingi inayowataja wanawake waliofiwa na waume; 'wajane' ndiyo tafsiri ya kawaida na sahihi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo lake ni la wingi, hapa maana na matumizi yake ni ya umoja, nalo ndilo somo la kishazi kisicho na kitenzi.
- source_word: בִּמְעוֹן
  choice: katika makao
  rationale: מָעוֹן ni mahali pa kukaa au makao, na kiambishi בִּ kimsingi ni 'katika.' 'Makao' ni neno la sasa, lenye hadhi, na linalofaa mtindo wa kishairi.
- source_word: קָדְשׁוֹ
  choice: yake matakatifu
  rationale: 'Muundo huu unaweza kusemwa kihalisi ''makao ya utakatifu wake,'' lakini Kiswahili cha asili hutumia kivumishi: ''makao yake matakatifu.'''
theological_decisions:
- issue: Iwapo דַיַּן itafsiriwe kwa maana ya ulinzi zaidi
  choice: mwamuzi wa wajane
  alternative: mtetezi wa wajane
  rationale: Muktadha unaonyesha kwamba Mungu huwapatia haki walio dhaifu, lakini maana ya msingi ya דַיַּן ni ya kimahakama. 'Mwamuzi' huhifadhi taswira hiyo na haifanyi maana iliyodokezwa kuwa maana ya moja kwa moja.
- issue: Iwapo בִּמְעוֹן קָדְשׁוֹ huonyesha mahali ('katika') au chanzo ('kutoka')
  choice: katika makao yake matakatifu
  alternative: kutoka katika makao yake matakatifu
  rationale: Kihusishi בִּ kwa kawaida humaanisha 'katika.' Tafsiri ya 'kutoka' inaweza kueleza mahali ambako Mungu anatenda akitokea, lakini huenda mbali zaidi ya umbo la wazi la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na kishazi kisicho na kitenzi umehifadhiwa kwa lugha inayoeleweka kwa urahisi. 'Watoto wasio na baba' imetumiwa kwa usahihi wa maana, huku 'yatima' ikiwekwa katika tanbihi kama mbadala wa kawaida.
