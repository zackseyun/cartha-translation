  text: The singers went before[a], the musicians after[b], in the midst of young women beating tambourines.
translation:
  language: sw
  text: Waimbaji walitangulia, wapiga ala wakafuata, wakiwa katikati ya wanawake vijana waliokuwa wakipiga matari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִדְּמוּ
  choice: walitangulia
  rationale: Kitenzi hiki kinaonyesha kwenda mbele ya wengine katika msafara; “walitangulia” ni cha kawaida na huhifadhi mpangilio huo.
- source_word: שָׁרִים
  choice: waimbaji
  rationale: Neno linatokana na mzizi wa kuimba, na katika muktadha huu linamaanisha waimbaji, si wakuu.
- source_word: אַחַר
  choice: wakafuata
  rationale: Hueleza nafasi au mfuatano wa walio nyuma katika msafara; umbo la kitenzi linafanya mstari uwe wa asili katika Kiswahili.
- source_word: נֹגְנִים
  choice: wapiga ala
  rationale: Linamaanisha watu wanaopiga ala za muziki; “wapiga ala” ni sahihi na linaeleweka bila kudokeza aina moja tu ya ala.
- source_word: בְּתוֹךְ
  choice: katikati yao
  rationale: Huhifadhi picha ya nafasi ya wanawake ndani ya msafara; kiwakilishi “yao” kinaweka wazi rejeo linalodokezwa na muktadha.
- source_word: עֲלָמוֹת
  choice: wanawake vijana
  rationale: Neno linaashiria wanawake walio vijana; tafsiri hii haisisitizi ubikira ambao neno lenyewe halilazimishi hapa.
- source_word: תּוֹפֵפוֹת
  choice: waliopiga matari
  rationale: Hueleza kitendo cha kupiga ala za mkono aina ya tari; “matari” ni istilahi ya kawaida ya Kiswahili kwa tambourines.
