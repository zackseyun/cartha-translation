id: PSA.68.18
reference: Psalms 68:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: עָ֘לִ֤יתָ לַ/מָּר֨וֹם שָׁ֘בִ֤יתָ שֶּׁ֗בִי לָקַ֣חְתָּ מַ֭תָּנוֹת בָּ/אָדָ֑ם וְ/אַ֥ף ס֝וֹרְרִ֗ים לִ/שְׁכֹּ֤ן יָ֬הּ אֱלֹהִֽים׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/018.yaml
  text: You ascended on high[a]; you led captivity captive; you received gifts among men, even among the rebellious[b], so that Yah God might dwell there.
translation:
  language: sw
  text: Ulipanda juu; ukateka mateka; ukapokea zawadi miongoni mwa wanadamu[a], hata miongoni mwa waasi, ili Yah Mungu akae humo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kwa wanadamu.” Kihusishi cha Kiebrania katika kirai “zawadi miongoni mwa wanadamu” kinaweza pia kueleweka kuwa kinaonyesha chanzo.
    reason: lexical_alternative
  - marker: b
    text: Au, “ili Yah Mungu akae miongoni mwao,” au “kuwa makao ya Yah Mungu.” Kishazi cha mwisho cha Kiebrania ni kifupi na kinaweza kueleweka kwa njia zaidi ya moja.
    reason: alternative_reading
lexical_decisions:
- source_word: עָלִיתָ
  choice: ulipanda
  rationale: Kitenzi hiki ni Qal timilifu, nafsi ya pili umoja wa kiume, cha עלה. “Ulipanda” kinahifadhi picha ya kwenda juu na sauti ya kishairi ya ushindi.
- source_word: לַמָּרוֹם
  choice: juu
  rationale: מָרוֹם hueleza mahali pa juu au palipoinuka. “Juu” ni Kiswahili cha kawaida na chenye uzito bila kubainisha mahali kupita kiasi.
- source_word: שָׁבִיתָ שֶּׁבִי
  choice: ukateka mateka
  rationale: Muundo wa Kiebrania unatumia kitenzi na nomino zenye mzizi mmoja kwa msisitizo. “Ukateka mateka” kinadumisha ufupi, urudiaji, na picha ya ushindi.
- source_word: לָקַחְתָּ
  choice: ukapokea
  rationale: Ingawa לקח mara nyingi humaanisha kuchukua, ikiambatana na “zawadi” hapa inaweza kutafsiriwa kwa kawaida kuwa kupokea zawadi zinazoletwa kwa mshindi.
- source_word: מַתָּנוֹת
  choice: zawadi
  rationale: Neno hili humaanisha zawadi au vitu vinavyotolewa. “Zawadi” ni tafsiri ya moja kwa moja kuliko “ushuru,” ambalo lingeongeza ufafanuzi wa kimuktadha.
- source_word: בָּאָדָם
  choice: miongoni mwa wanadamu
  rationale: אָדָם hapa inaweza kurejelea wanadamu kwa ujumla, huku ב likiruhusu maana ya eneo au mazingira. “Miongoni mwa wanadamu” limewekwa katika matini, na maana inayowezekana ya chanzo, “kutoka kwa wanadamu,” imehifadhiwa katika tanbihi.
- source_word: וְאַף סוֹרְרִים
  choice: hata miongoni mwa waasi
  rationale: וְאַף huongeza msisitizo, na סוֹרְרִים hueleza watu wakaidi au waasi. Kirai hiki kinaendeleza kwa uwazi usomaji wa “miongoni mwa” bila kuficha msisitizo wa “hata.”
- source_word: לִשְׁכֹּן
  choice: ili ... akae
  rationale: Infinitivu yenye ל inaweza kuonyesha kusudi au matokeo. “Ili ... akae” huwasilisha maana hiyo kwa Kiswahili cha asili huku ikiacha sintaksia ya mwisho ikiwa wazi katika tanbihi.
- source_word: יָהּ אֱלֹהִים
  choice: Yah Mungu
  rationale: יָהּ ni umbo fupi la jina la Mungu, hivyo “Yah” linahifadhi umbo hilo; אֱלֹהִים limetafsiriwa moja kwa moja kuwa “Mungu.”
theological_decisions:
- issue: Maana na mwelekeo wa בָּאָדָם katika kirai cha zawadi
  choice: miongoni mwa wanadamu
  alternative: kutoka kwa wanadamu
  rationale: Kihusishi ב kinaweza kuonyesha mazingira au, kwa uwezekano, chanzo. Matini kuu inafuata maana ya “miongoni mwa,” lakini tanbihi inadumisha uwezekano wa “kutoka kwa” bila kuamua suala la kitafsiri au kiteolojia kimabavu.
- issue: Sintaksia na rejeleo la לִשְׁכֹּן יָהּ אֱלֹהִים
  choice: ili Yah Mungu akae humo
  alternative: ili Yah Mungu akae miongoni mwao; kuwa makao ya Yah Mungu
  rationale: Kishazi cha Kiebrania ni kifupi na hakitaji wazi mahali au watu wanaorejelewa. “Humo” huruhusu usomaji wa mahali bila kuufanya mahsusi kupita kiasi, na tanbihi huhifadhi miundo mingine halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. Urudiaji wa “ukateka mateka” unadumisha msisitizo wa Kiebrania, huku “wanadamu” likitumika kwa maana ya jumla ya jamii ya binadamu.
