  yaml_path: translation/ot/psalms/068/034.yaml
  text: Ascribe strength to God[a]; his majesty is over Israel[b], and his strength is in the skies.
translation:
  language: sw
  text: Mpeni Mungu nguvu[a]; ukuu wake uko juu ya Israeli, na nguvu zake ziko angani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tambueni nguvu za Mungu” au “Tangazaeni nguvu za Mungu.” Kiebrania husema kihalisi “mpeni Mungu nguvu”; hapa ni mwito wa kishairi wa kukiri au kutangaza nguvu zake.
    reason: lexical_alternative
  - marker: b
    text: Au, “mawinguni” au “katika mawingu.” Neno la Kiebrania linaweza kutaja anga, mawingu, au mbingu za juu.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ
  choice: Mkubalini ... kuwa mwenye
  rationale: Kitenzi hiki humaanisha kihalisi ‘toeni,’ lakini hapa ni mwito wa kishairi wa kukiri au kutangaza kwamba nguvu ni za Mungu, si kumpa nguvu ambazo hana.
- source_word: עֹז
  choice: nguvu
  rationale: Neno hili hutaja nguvu au uweza. ‘Nguvu’ ni la kawaida na pia huhifadhi urudiaji wake katika mstari.
- source_word: לֵאלֹהִים
  choice: Mungu
  rationale: Kihusishi ל humtambulisha Mungu kama anayehusishwa na nguvu zinazokiriwa; muundo wa Kiswahili ‘Mkubalini Mungu kuwa mwenye nguvu’ huwasilisha uhusiano huo kwa kawaida.
- source_word: עַל יִשְׂרָאֵל
  choice: juu ya Israeli
  rationale: עַל hapa yaelekea kuonyesha ukuu au utawala ulio juu ya Israeli, huku ikihifadhi taswira ya kimaeneo inayolingana na kishazi kinachofuata.
- source_word: גַּאֲוָתוֹ
  choice: ukuu wake
  rationale: Katika sifa zinazomhusu Mungu, nomino hii ina maana chanya ya ukuu, fahari, au enzi; ‘ukuu’ ni ya asili na yenye heshima.
- source_word: וְעֻזּוֹ
  choice: na nguvu zake
  rationale: ‘Nguvu’ limerudiwa ili kuhifadhi kiungo cha kishairi na עֹז ya mwanzo. Kiswahili hutumia wingi wa kisarufi ‘zake’ kwa nomino ‘nguvu.’
- source_word: בַּשְּׁחָקִים
  choice: mawinguni
  rationale: Katika ushairi neno hili linaweza kutaja mawingu, anga, au mbingu za juu. ‘Mawinguni’ huhifadhi taswira hiyo bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Iwapo amri inamaanisha wanadamu wanampa Mungu nguvu kihalisi
  choice: Kutafsiri kama mwito wa kumkubali Mungu kuwa mwenye nguvu
  alternative: Mpeni Mungu nguvu
  rationale: Nahau ya kishairi inawaita waabudu wakiri nguvu za Mungu, wala si kumwongezea kitu alichokosa. Muundo uliochaguliwa unaepuka wazo hilo potovu huku ukihifadhi nguvu ya amri.
- issue: Maana ya עַל יִשְׂרָאֵל
  choice: ukuu wake uko juu ya Israeli
  alternative: ukuu wake uko katika Israeli / unaihusu Israeli
  rationale: ‘Juu ya’ ndiyo maana ya moja kwa moja na inafaa sambamba na nguvu zake zilizo mawinguni, lakini tofauti ndogo za kimuktadha zinawezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi wa kishairi; urudiaji wa ‘nguvu’ na ulinganifu wa ‘juu ya Israeli / mawinguni’ umehifadhiwa.
