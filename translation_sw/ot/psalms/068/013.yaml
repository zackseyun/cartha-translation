base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/013.yaml
  text: Though you lie down among the sheepfolds[a], the wings of a dove are covered with silver[b], and her pinions with yellow gold.
translation:
  language: sw
  text: Ingawa mnalala kati ya mazizi ya kondoo[a], mabawa ya njiwa yamefunikwa kwa fedha, na manyoya ya mabawa yake kwa dhahabu yenye mng’ao wa manjano-kijani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kati ya mifuko ya tandiko” au “kati ya mafiga”; maana ya neno la Kiebrania hapa haijulikani kwa hakika.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “katika dhahabu ya kijani-kijani”; usemi huo unaweza pia kumaanisha dhahabu yenye rangi au mng’ao wa manjano-kijani.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Ingawa
  rationale: Katika muktadha huu wa kishairi, אִם yaweza kuwa na maana ya kukubali hali inayotajwa (‘ingawa’), badala ya sharti la wazi. Uchaguzi huu unaendeleza usomaji unaowezekana bila kupanua mstari.
- source_word: תִּשְׁכְּבוּן
  choice: mnalala
  rationale: Kitenzi שׁכב humaanisha kulala au kujilaza. Umbo la nafsi ya pili wingi limehifadhiwa kwa ‘mnalala’.
- source_word: בֵּין שְׁפַתָּיִם
  choice: kati ya mazizi ya kondoo
  rationale: Neno שְׁפַתָּיִם halina maana iliyo hakika hapa. ‘Mazizi ya kondoo’ ni tafsiri ya mapokeo inayofaa picha ya mahali pa kupumzikia; uwezekano mwingine umewekwa katika tanbihi.
- source_word: כַּנְפֵי יוֹנָה
  choice: mabawa ya njiwa
  rationale: Hii ni tafsiri ya moja kwa moja ya mfuatano wa nomino na inasikika kwa kawaida katika Kiswahili.
- source_word: נֶחְפָּה בַכֶּסֶף
  choice: yamefunikwa kwa fedha
  rationale: חפה huonyesha kufunikwa au kupakwa juu; ‘yamefunikwa kwa fedha’ ni wazi na haiongezi mbinu maalumu isiyotajwa.
- source_word: אֶבְרוֹתֶיהָ
  choice: manyoya yake ya mabawa
  rationale: אברה hurejelea manyoya makubwa ya bawa. Usemi huu ni sahihi zaidi kuliko ‘manyoya’ peke yake na unaeleweka kwa wasomaji wa kawaida.
- source_word: בִּירַקְרַק חָרוּץ
  choice: kwa dhahabu yenye mng’ao wa manjano-kijani
  rationale: חָרוּץ yaweza kumaanisha dhahabu, na יְרַקְרַק huonyesha rangi yenye kuelekea kijani au manjano-kijani. Tafsiri hii inahifadhi rangi isiyo ya kawaida ya Kiebrania badala ya kuirahisisha kuwa ‘dhahabu ya manjano’.
