  text: Blessed be the Lord[a], who day by day bears us up—God is our salvation. Selah
translation:
  language: sw
  text: 'Ahimidiwe Bwana,

    ambaye siku baada ya siku hubeba kwa ajili yetu[a]—

    Mungu ndiye wokovu wetu. Sela'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hutubeba,” au, kwa tafsiri ya jadi, “hutujaza mema kila siku.” Kitenzi cha Kiebrania kinaweza kumaanisha kupakia au kubeba, lakini kitu kinachobebwa hakijatajwa wazi; “kwa ajili yetu” hutafsiri kiambishi cha Kiebrania.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Ahimidiwe
  rationale: Katika kauli ya kumbariki Mungu, Kiswahili cha kawaida na chenye staha hutumia “Ahimidiwe,” kikionyesha sifa inayotolewa kwa Mungu badala ya wazo la Mungu kupokea baraka.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Hili ni jina la cheo cha Mungu; “Bwana” ndilo neno la kawaida na la heshima katika Kiswahili cha Biblia.
- source_word: יוֹם יוֹם
  choice: siku baada ya siku
  rationale: Urudiaji wa Kiebrania una maana ya jambo linalotendeka kila siku; usemi huu unadumisha uzito wa urudiaji huku ukisomeka kwa kawaida.
- source_word: יַעֲמָס לָנוּ
  choice: hutubeba
  rationale: Kitenzi עמס huhusu kupakia au kubeba. Kauli ya Kiebrania imebanwa na haitaji wazi kitu kinachobebwa. “Hutubeba” hutoa maana ya msaada endelevu wa Mungu bila kuingiza “faida” ambazo hazipo katika matini; utata halisi umehifadhiwa katika tanbihi.
- source_word: הָאֵל
  choice: Mungu
  rationale: אֵל hapa ni jina la kawaida la Mungu. “Mungu” ni tafsiri ya moja kwa moja na ya asili katika Kiswahili.
- source_word: יְשׁוּעָתֵנוּ
  choice: wokovu wetu
  rationale: Neno hili linajumuisha kuokoa, kukomboa, na kuleta usalama; “wokovu wetu” huhifadhi upana huo.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya neno hili la liturujia au muziki haijulikani kwa hakika, kwa hiyo limenakiliwa badala ya kutafsiriwa kwa kubahatisha.
theological_decisions:
- issue: Maana ya kauli iliyobanwa יַעֲמָס לָנוּ
  choice: Mungu anasifiwa kuwa ndiye anayewabeba watu wake daima.
  alternative: Mungu hutubebea mizigo yetu; au hutujazia mema kila siku.
  rationale: Kitenzi chenyewe kinahusu kupakia au kubeba, lakini kitu kinachobebwa hakijatajwa wazi. Tafsiri “hutubeba” inafaa muktadha wa msaada wa Mungu, lakini tanbihi inahifadhi uwezekano wa kubeba mzigo kwa niaba yetu. Tafsiri ya jadi ya kutujazia mema huongeza kitu kisichotajwa katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye staha. Mpangilio wa mistari unafuata vipashio vya kishairi; “Sela” limehifadhiwa kama istilahi isiyo na maana iliyothibitishwa kwa hakika.
