  text: Your creatures settled in it; in your goodness[a], O God, you provided for the poor.
translation:
  language: sw
  text: Viumbe wako[a] walikaa humo; kwa wema wako, Ee Mungu, uliandaa kwa ajili ya maskini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania חַיָּתְךָ ni gumu hapa; linaweza pia kutafsiriwa “wanyama wako,” “kundi lako,” au “kusanyiko lako.”
    reason: alternative_reading
lexical_decisions:
- source_word: חַיָּתְךָ
  choice: Viumbe wako
  rationale: Nomino hii kwa msingi wake humaanisha kilicho hai au wanyama, lakini hapa huenda imetumiwa kwa maana ya pamoja kuhusu kundi la Mungu. “Viumbe wako” huhifadhi upana wa neno bila kulifanya moja kwa moja kuwa kundi la wanadamu; uwezekano mwingine umewekwa katika tanbihi.
- source_word: יָשְׁבוּ בָהּ
  choice: walikaa humo
  rationale: Kitenzi ישב kinaweza kumaanisha kukaa au kufanya makao. “Walikaa humo” ni Kiswahili cha kawaida na kiambishi “humo” hurejelea mahali palipotajwa katika muktadha uliotangulia.
- source_word: תָּכִין
  choice: uliwaandalia ... mahitaji yao
  rationale: Katika muundo wa Hifili, כון humaanisha kuandaa, kuweka tayari, au kuthibitisha. Hapa wazo ni Mungu kuwawekea maskini mahitaji; kirai hiki cha Kiswahili huwasilisha maana hiyo kwa ufasaha, ingawa “mahitaji yao” yamefafanua kitu kisichotajwa wazi katika Kiebrania.
- source_word: בְּטוֹבָתְךָ
  choice: kwa wema wako
  rationale: טובה hapa hueleza wema, ukarimu, au neema yenye kutoa mema. “Kwa wema wako” huhifadhi uhusiano wa kisababishi au njia unaoonyeshwa na kihusishi בְּ.
- source_word: לֶעָנִי
  choice: maskini
  rationale: עני linaweza kumaanisha maskini, mhitaji, au mtu aliyeteswa. Katika muktadha wa kuandaliwa mahitaji, “maskini” ndilo chaguo la moja kwa moja na la kawaida.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Neno hili limetumiwa kama mwito wa moja kwa moja mwishoni mwa mstari; “Ee Mungu” huonyesha wazi nguvu hiyo ya kishairi na ya sala.
theological_decisions:
- issue: Maana ya חַיָּתְךָ katika muktadha huu mgumu wa kishairi
  choice: Viumbe wako
  alternative: Kundi lako; kusanyiko lako; wanyama wako
  rationale: Neno la Kiebrania linaweza kueleweka kihalisi kuhusu viumbe hai au kwa maana ya pamoja kuhusu watu wa Mungu. Tafsiri kuu huhifadhi maana yake pana, huku tanbihi ikionyesha usomaji wa kibinadamu au wa kikundi bila kuamua utata huo kimyakimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. “Humo” huunganisha mstari na nchi au mahali palipotajwa katika muktadha uliotangulia; “Ee Mungu” huhifadhi mwito wa moja kwa moja.
