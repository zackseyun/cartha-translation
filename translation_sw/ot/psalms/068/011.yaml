  rationale: Umbo la Kiebrania ni la kike wingi. Kuliondoa kungepoteza sifa halisi ya maandishi; kulihifadhi hakulazimishi dai la kimafundisho lililo nje ya mstari.
- issue: Taswira ya צָבָא
