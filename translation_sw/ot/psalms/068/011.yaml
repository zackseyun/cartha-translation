- source_word: הַמְבַשְּׂרוֹת
  choice: wanawake wanaotangaza habari njema
  rationale: Kitenzi-jina cha Kiebrania ni cha jinsia ya kike na wingi; tafsiri hii inalihifadhi hilo wazi pamoja na maana ya kutangaza habari njema.
- source_word: צָבָא רָב
  choice: jeshi kubwa
  rationale: צָבָא kwa kawaida huonyesha jeshi au kundi kubwa lililopangwa. “Jeshi kubwa” linahifadhi taswira inayowezekana ya kijeshi na ukubwa unaoonyeshwa na רָב.
