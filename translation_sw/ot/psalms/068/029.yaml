  yaml_path: translation/ot/psalms/068/029.yaml
  text: From your temple above Jerusalem[c][b][a], kings will bring tribute to you.
translation:
  language: sw
  text: Kutoka katika hekalu lako lililo juu ya Yerusalemu[a][c], wafalme watakuletea zawadi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kwa sababu ya hekalu lako lililoko Yerusalemu, wafalme watakuletea zawadi.”'
    reason: alternative_reading
  - marker: b
    text: “Zawadi” pia inaweza kutafsiriwa “tunu” au “zawadi ya heshima.”
    reason: lexical_alternative
  - marker: c
    text: 'Au: “hekalu lako huko Yerusalemu.”'
    reason: locative_alternative
lexical_decisions:
- source_word: מֵהֵיכָלֶךָ
  choice: Kutoka katika hekalu lako
  rationale: מִן ina maana yake ya kawaida ya chanzo au mahali pa kuanzia, ‘kutoka,’ huku הֵיכָל hapa ikitafsiriwa kwa kawaida kuwa ‘hekalu.’
- source_word: עַל יְרוּשָׁלִָם
  choice: lililo juu ya Yerusalemu
  rationale: Tafsiri hii inadumisha maana ya msingi ya עַל, ‘juu ya,’ na kuihusisha kiasili na mahali hekalu lilipo, ingawa kishazi kinaweza pia kueleweka kuwa ‘huko Yerusalemu.’
- source_word: לְךָ
  choice: watakuletea
  rationale: 'Kiwakilishi cha yambwa katika kitenzi cha Kiswahili kinaonyesha kwamba Mungu ndiye mpokeaji: ‘wataleta kwako.’'
- source_word: יוֹבִילוּ
  choice: wataleta
  rationale: Hiphil ya יבל pamoja na kitu kinacholetwa humaanisha ‘kuleta’ au ‘kufikisha.’ Muundo ‘watakuletea’ ni wa kawaida na unaonyesha mpokeaji wazi.
- source_word: מְלָכִים
  choice: wafalme
  rationale: Neno hili linamaanisha wafalme na linahifadhi taswira ya watawala wa mataifa wakimheshimu Mungu.
- source_word: שַׁי
  choice: ushuru
  rationale: שַׁי ni zawadi au tunu inayotolewa kwa mwenye mamlaka; ‘ushuru’ hapa unadumisha dhana ya zawadi ya heshima inayotolewa na wafalme, si zawadi ya kawaida tu.
theological_decisions:
- issue: Uhusiano wa kisintaksia kati ya hekalu na Yerusalemu
  choice: Hekalu linaelezwa kuwa juu ya Yerusalemu, na ushuru unatoka kwa wafalme kwenda kwa Mungu.
  alternative: Kwa sababu ya hekalu lako lililo Yerusalemu, wafalme watakuletea zawadi.
  rationale: Kiebrania kinaruhusu מִן kueleweka kwa maana ya chanzo au sababu, na עַל kwa maana ya ‘juu ya’ au mahali kwa ujumla. Matini kuu inadumisha maana za msingi za viambishi bila kufuta uwezekano mwingine, ambao umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Hekalu’ ni istilahi ya kawaida ya kibiblia; ‘ushuru’ umetumiwa kwa maana ya tunu ya heshima kwa mwenye mamlaka, huku tanbihi ikitoa mbadala usio wa kisiasa sana.
