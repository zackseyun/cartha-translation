lexical_decisions:
- source_word: הַר
  choice: mlima
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa eneo la ardhi lililoinuka sana; kurudiwa kwake kunahifadhi msisitizo na muundo wa kishairi wa Kiebrania.
- source_word: אֱלֹהִים
  choice: wa Mungu
  rationale: Katika muundo הַר אֱלֹהִים, tafsiri ya moja kwa moja ni “mlima wa Mungu.” Maana inayowezekana ya kusisitiza ukubwa au fahari imewekwa katika tanbihi ili kutohitimisha utata wa kishairi.
- source_word: בָּשָׁן
  choice: Bashani
  rationale: Ni jina la mahali; umbo “Bashani” linafuata matumizi yaliyozoeleka katika Kiswahili cha Biblia.
- source_word: גַּבְנֻנִּים
  choice: wenye vilele
  rationale: Neno hili adimu linaelekea kueleza mlima wenye vilele au umbo lenye mikunjo na nundu. “Wenye vilele” ni Kiswahili cha asili kinachowasilisha maana ya kijiografia bila kuongeza wazi wingi usiotajwa kwa neno tofauti.
theological_decisions:
- issue: Iwapo הַר אֱלֹהִים itafsiriwe moja kwa moja au kama usemi wa kusisitiza ukubwa
  choice: “mlima wa Mungu” katika matini kuu
  alternative: “mlima mkubwa sana” au “mlima wa fahari”
  rationale: Muundo wa Kiebrania unasomeka moja kwa moja “mlima wa Mungu,” lakini unaweza pia kuwa usemi wa kiwango cha juu. Tafsiri kuu inahifadhi mwangwi wa kitheolojia, na tanbihi inahifadhi uwezekano wa maana ya kusisitiza.
- issue: Maana ya neno adimu גַּבְנֻנִּים
  choice: “wenye vilele”
  alternative: “wenye nundu” au “wenye miinuko mingi”
  rationale: Maana kamili ya neno hilo si hakika. Matini kuu inatoa taswira inayoeleweka ya vilele, huku tanbihi ikihifadhi uwezekano wa mlima wenye umbo korofi au la kinundu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya “mlima” na “mlima wa Bashani” yamehifadhiwa kwa sababu ni sehemu ya sambamba na msisitizo wa mstari wa Kiebrania.
