  text: Mlima wa Mungu[a] ni mlima wa Bashani; mlima wenye vilele[b] ni mlima wa Bashani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mlima mkubwa sana” au “mlima wa fahari”; usemi wa Kiebrania “mlima wa Mungu” huenda ukawa namna ya kusisitiza ukubwa au fahari kuu.
