base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/004.yaml
  text: Sing to God[a]; sing praise to his name. Lift up a song for the one who rides through the deserts; Yah is his name[b]; exult before him.
translation:
  language: sw
  text: Mwimbieni Mungu; liimbieni jina lake sifa. Mtengenezeeni njia[a] yeye asafiriye akiwa amepanda katika tambarare za nyika; jina lake ni Yah. Shangilieni mbele yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kiebrania chaweza kumaanisha kuinua au kutandika njia; kwa hiyo pia, “Mtandikieni barabara yeye asafiriye akiwa amepanda.”
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁירוּ לֵאלֹהִים
  choice: Mwimbieni Mungu
  rationale: Kauli ya amri ya wingi inahifadhi mwito wa moja kwa moja wa kumwimbia Mungu; אֱלֹהִים hapa humaanisha Mungu wa Israeli, si miungu.
- source_word: זַמְּרוּ שְׁמוֹ
  choice: liimbieni sifa jina lake
  rationale: זמר katika muktadha wa ibada humaanisha kuimba au kupiga muziki wa sifa. Kauli hii inalihifadhi ‘jina lake’ kama kitu kinachosifiwa.
- source_word: סֹלּוּ
  choice: Mtengenezeeni njia
  rationale: סלל kimsingi huonyesha kuinua, kutandika, au kutengeneza barabara. Kutaja ‘njia’ kwa uwazi katika Kiswahili kunawasilisha picha ya kumwandalia Mungu barabara bila kuibadili kimya kimya kuwa wimbo.
- source_word: לָרֹכֵב
  choice: yeye anayepita ... akiwa amepanda
  rationale: Kivumishi-tendo רכב humtaja mpandaji au mwenye kusafiri akiwa amepanda. Kiswahili kinahitaji upanuzi huu ili picha ya mwendo ibaki wazi bila kudai chombo fulani kama farasi au gari.
- source_word: בָּעֲרָבוֹת
  choice: katika tambarare za nyika
  rationale: עֲרָבוֹת kwa maana yake ya kawaida ni maeneo makavu yaliyo tambarare, nyika au stepu. ‘Tambarare za nyika’ huhifadhi vipengele vyote viwili kwa Kiswahili cha kawaida.
- source_word: בְּיָהּ שְׁמוֹ
  choice: jina lake ni Yah
  rationale: יָהּ ni umbo fupi la jina la Mungu. Limenukuliwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: וְעִלְזוּ לְפָנָיו
  choice: Shangilieni mbele zake
  rationale: עלז huonyesha furaha yenye nguvu na ya wazi; ‘shangilieni’ ni amri ya asili inayohifadhi sauti ya kishairi na ya ibada.
theological_decisions:
- issue: Uwasilishaji wa jina fupi la Mungu יָהּ
  choice: Yah
  alternative: BWANA
  rationale: Maandishi yana יָהּ, umbo fupi la jina la Mungu, wala si jina kamili יהוה. Kunukuu ‘Yah’ kunahifadhi tofauti hiyo ya kimatini na hakubadili jina kuwa cheo.
- issue: Taswira ya mpandaji katika עֲרָבוֹת
  choice: anayepita katika tambarare za nyika akiwa amepanda
  alternative: anayepanda mawinguni
  rationale: Maana ya kawaida ya עֲרָבוֹת ni tambarare kame au nyika. Hata hivyo, usomaji wa ‘mawingu’ una msingi katika taswira za kitheofania na umetajwa katika tanbihi badala ya kufutwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa amri za wingi na urudiaji wa sifa umehifadhiwa; taswira ngumu ya Kiebrania imefafanuliwa kwa kiasi kidogo bila kuondoa utata wake.
