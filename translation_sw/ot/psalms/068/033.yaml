  text: לָ֭/רֹכֵב בִּ/שְׁמֵ֣י שְׁמֵי קֶ֑דֶם הֵ֥ן יִתֵּ֥ן בְּ֝/קוֹל/וֹ ק֣וֹל עֹֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/033.yaml
  text: to him who rides in the highest heavens[a], which are from ancient times—behold, he gives forth his voice[b], a mighty voice.
translation:
  language: sw
  text: kwa yeye anayepita akiwa amepanda katika mbingu za juu, zilizokuwako tangu zamani—tazama, anatoa sauti yake, sauti yenye nguvu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָ/רֹכֵב
  choice: kwake yeye apitaye juu
  rationale: Kiambishi לָ kinaendeleza wito wa mstari uliotangulia wa kumpa Mungu nguvu; רֹכֵב ni nomino ya kitendo inayomtaja Mungu kuwa ndiye apitaye akiwa amepanda. Kiswahili hiki kinahifadhi uhusiano huo bila kuongeza chombo anachopanda.
- source_word: בִּ/שְׁמֵי שְׁמֵי
  choice: juu ya mbingu za juu
  rationale: Muundo wa Kiibrania ‘mbingu za mbingu’ una maana ya kiwango cha juu kabisa. ‘Mbingu za juu’ ni usemi wa asili wa Kiswahili, huku ‘juu ya’ ukifaa kwa taswira ya mpandaji anayepita angani.
- source_word: קֶדֶם
  choice: zilizokuwako tangu zamani
  rationale: Hapa neno linaeleza wakati, si upande wa mashariki. Kishazi hiki kinaonyesha kwamba mbingu hizo ni za tangu kale na kuepuka mkanganyiko wa ‘mbingu za zamani.’
- source_word: הֵן
  choice: tazama
  rationale: Neno hili ni chembe ya kuvuta usikivu; ‘tazama’ linahifadhi uzito wa kishairi na ni la kawaida katika mtindo wa Biblia wa Kiswahili.
- source_word: יִתֵּן
  choice: anaitoa
  rationale: Kitenzi maana yake ya msingi ni ‘kutoa,’ lakini pamoja na ‘sauti’ kinamaanisha kuitamka au kuifanya isikike. ‘Anaitoa’ kinahifadhi taswira ya Kiebrania.
- source_word: בְּ/קוֹל/וֹ
  choice: sauti yake
  rationale: Kihusishi בְּ ni sehemu ya nahau נתן קול; Kiswahili hakihitaji kukitafsiri kando katika usemi ‘anaitoa sauti yake.’
- source_word: קוֹל עֹז
  choice: sauti yenye nguvu
  rationale: Hii inawakilisha kwa uwazi muundo halisi ‘sauti ya nguvu’ na inasikika kwa kawaida katika Kiswahili sanifu.
theological_decisions:
- issue: Mhusika anayetajwa kuwa apitaye akiwa amepanda
  choice: Mstari unaendelea kumweleza Mungu wa Israeli kwa taswira ya kishairi, bila kutaja wazi chombo anachopanda.
  alternative: Usomaji wa kitipolojia unaweza kuihusisha taswira hii ya Mungu apitaye akiwa amepanda na matumizi ya baadaye ya Kimasihi.
  rationale: Muktadha wa karibu unamtaja Mungu. Tafsiri haipaswi kuingiza utambulisho mwembamba wa Kikristo au wa kimalaika ambao mstari wa Kiebrania hautamki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Apitaye’ linadumisha mtindo ulioinuliwa; tanbihi zinahifadhi muundo halisi na mbadala wa kileksika.
