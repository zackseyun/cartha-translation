lexical_decisions:
- source_word: מַמְלְכוֹת הָאָרֶץ
  choice: Enyi falme za dunia
  rationale: Kirai hiki kinaziita falme zote duniani. Neno la mwito “Enyi” linaweka wazi hali ya kuhutubia bila kubadili maana.
- source_word: שִׁירוּ לֵאלֹהִים
  choice: mwimbieni Mungu
  rationale: Kitenzi ni amri ya wingi, na kihusishi ל kinaonyesha Mungu ndiye anayeimbikiwa.
- source_word: זַמְּרוּ
  choice: mpigieni ... zaburi
  rationale: Kitenzi זמר kinamaanisha kutoa sifa kwa wimbo au muziki; “kupiga zaburi” ni usemi wa Kiswahili unaobeba wazo la sifa ya kimuziki huku tanbihi ikihifadhi uwezekano mpana zaidi.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Hiki ni cheo cha Mungu, Adonai, wala si jina יהוה; kwa hiyo kimetafsiriwa “Bwana,” si “BWANA.”
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya istilahi hii ya kiliturujia au kimuziki haijulikani kwa hakika, hivyo imenukuliwa kwa sauti badala ya kufasiriwa.
theological_decisions:
- issue: Kutafsiri cheo cha Mungu אֲדֹנָי
  choice: Bwana
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana אֲדֹנָי, si tetragramatoni יהוה. “Bwana” huhifadhi tofauti hiyo bila kuingiza tafsiri ya kimadhehebu.
- issue: Nguvu ya זַמְּרוּ
  choice: mpigieni Bwana zaburi
  alternative: mpigieni Bwana muziki
  rationale: Chaguo kuu linaonyesha sifa ya ibada, lakini tanbihi inahifadhi maana pana ya kufanya muziki kwa kuwa kitenzi kinaweza kuhusisha uimbaji au upigaji wa ala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa mwito wa kishairi; “Enyi” husaidia wasomaji kuelewa kwamba falme ndizo zinazohutubiwa. Alama ya tanbihi imewekwa baada ya kirai ambacho mbadala wake unahusu.
