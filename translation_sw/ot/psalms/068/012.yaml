base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/012.yaml
  text: Kings of armies flee[a], they flee, and the woman at home divides the spoil.
translation:
  language: sw
  text: 'Wafalme wa majeshi wanakimbia, wanakimbia;

    naye mwanamke anayekaa nyumbani[a] anagawanya nyara.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mama wa nyumba anagawanya nyara” / “mwanamke anayeishi nyumbani anagawanya nyara.” Kirai cha Kiebrania ni cha umoja wa kike na huenda kinamwonyesha mwanamke aliyebaki nyumbani akipokea na kugawa mali iliyotekwa vitani.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכֵי צְבָאוֹת
  choice: Wafalme wa majeshi
  rationale: Muundo wa Kiebrania una nomino ya wingi katika hali ya kuambatana, “wafalme wa,” ikifuatiwa na “majeshi.” Tafsiri hii inadumisha uhusiano huo na maana ya kijeshi.
- source_word: יִדֹּדוּן יִדֹּדוּן
  choice: wanakimbia, wanakimbia
  rationale: Kitenzi kutoka נדד kimerudiwa ili kusisitiza kukimbia kwao. Kurudia maneno kunahifadhi nguvu na muundo wa kishairi wa Kiebrania.
- source_word: וּנְוַת בַּיִת
  choice: naye mwanamke anayekaa nyumbani
  rationale: Kirai hiki ni cha umoja wa kike na kinamwonyesha mwanamke anayebaki au kukaa nyumbani. Kauli hii ni ya kawaida katika Kiswahili cha sasa na inahifadhi jinsia na idadi ya Kiebrania.
- source_word: תְּחַלֵּק
  choice: anagawanya
  rationale: Kitenzi cha Piel kina maana ya kugawa au kusambaza vitu kwa sehemu.
- source_word: שָׁלָל
  choice: nyara
  rationale: Neno hili humaanisha mali iliyotekwa vitani; “nyara” ni neno la kawaida na linalofaa katika muktadha wa kijeshi.
