base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/016.yaml
  text: Why do you leap about[a], O many-peaked mountains, at the mountain God desired for his dwelling? Indeed, Yahweh will dwell there forever.
translation:
  language: sw
  text: Kwa nini, enyi milima yenye vilele vingi, mnauangalia kwa kijicho mlima ambao Mungu aliutamani kuwa makao yake?[a] Naam, Yahwe atakaa humo milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa nini mnarukaruka?” Kitenzi cha Kiebrania ni adimu na maana yake si hakika; huenda kinaeleza kurukaruka au kuruka-ruka, au kuangalia kwa wivu au kijicho.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרַצְּדוּן
  choice: mnarukaruka
  rationale: Kitenzi hiki kinapatikana kwa nadra sana na maana yake si hakika. Tafsiri ya mwendo, “mnarukaruka,” inadumisha taswira ya Kiebrania bila kuamua kimya kimya kwamba kinamaanisha wivu; uwezekano huo umeelezwa katika tanbihi.
- source_word: הָרִים גַּבְנֻנִּים
  choice: milima yenye vilele vingi
  rationale: Neno גַּבְנֻנִּים linaashiria migongo, miinuko, au vilele vinavyojitokeza. Usemi huu unatoa taswira hiyo kwa Kiswahili cha kawaida bila kuifupisha kuwa milima mirefu tu.
- source_word: הָהָר
  choice: mlima
  rationale: Kiebrania kinataja mlima maalumu unaozungumziwa bila kuuita Sayuni moja kwa moja; hivyo jina Sayuni halijaongezwa.
- source_word: חָמַד
  choice: aliutamani
  rationale: Kitenzi hiki hueleza kutamani au kupendezwa sana. “Aliutamani” kinabaki karibu na maana ya msingi kuliko “aliuchagua,” ingawa uchaguzi wa Mungu unaeleweka katika muktadha.
- source_word: לְשִׁבְתּוֹ
  choice: kuwa makao yake
  rationale: 'Muundo huu unaonyesha kusudi: Mungu aliutamani mlima huo uwe mahali pake pa kukaa.'
- source_word: אַף
  choice: Naam
  rationale: Hapa neno hilo linakazia uthibitisho unaofuata, si kuongeza tu wazo jingine.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa umbo linalofaa tahajia na matamshi ya Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: יִשְׁכֹּן לָנֶצַח
  choice: atakaa humo milele
  rationale: שׁכן humaanisha kukaa au kufanya makao. “Humo” linatokana na muktadha wa mlima uliotajwa, na לָנֶצַח huonyesha muda usio na mwisho.
theological_decisions:
- issue: Kama mlima huo utajwe wazi kuwa Sayuni
  choice: Kubaki na neno “mlima” katika matini kuu
  alternative: Kutafsiri “Mlima Sayuni”
  rationale: Ingawa muktadha mpana wa zaburi unaelekeza kwa Sayuni, mstari huu wenyewe una nomino ya kawaida yenye kibainishi, si jina Sayuni. Kutolitaja jina kunahifadhi kiwango cha uwazi cha Kiebrania.
- issue: Jinsi ya kuonyesha tofauti kati ya milima mingine na mlima alioutamani Mungu
  choice: Kutumia taswira ya mwendo, “mnarukaruka,” na kueleza maana nyingine katika tanbihi
  alternative: Kutafsiri moja kwa moja “mnauonea wivu” au “mnauangalia kwa kijicho”
  rationale: Kitenzi cha Kiebrania ni adimu na hakina maana iliyothibitishwa kwa uhakika. Matini kuu inadumisha taswira inayowezekana ya kuruka, huku tanbihi ikihifadhi uwezekano wa wivu au mtazamo wa uhasama.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Yahwe” limetumiwa kama umbo la Kiswahili la jina la Mungu. Kirai “mbele ya mlima” kinaonyesha kuwa tendo la milima mingine linaelekezwa kwa mlima alioutamani Mungu bila kulazimisha maana ya wivu katika matini kuu.
