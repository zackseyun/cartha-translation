  yaml_path: translation/ot/psalms/068/009.yaml
  text: You sent abundant rain[a], O God; when your inheritance was weary[b], you established it.
translation:
  language: sw
  text: Ee Mungu, ulinyesha mvua tele[a]; urithi wako ulipokuwa umechoka[b], uliuimarisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mvua ya ukarimu”; usemi wa Kiebrania unasisitiza utoaji wa Mungu kwa wingi na ukarimu.
    reason: lexical_alternative
  - marker: b
    text: “Urithi wako” unaweza kumaanisha watu wa Mungu, nchi, au vyote viwili kwa pamoja katika usemi wa kishairi.
    reason: alternative_reading
lexical_decisions:
- source_word: גֶּשֶׁם נְדָבוֹת
  choice: mvua tele
  rationale: Muunganiko huu wa kishairi unaonyesha mvua iliyotolewa kwa ukarimu na kwa wingi. “Mvua tele” ni Kiswahili cha kawaida kinachowasilisha wingi huo bila kuingiza moja kwa moja taswira ya sadaka za hiari.
- source_word: תָּנִיף
  choice: ulinyesha
  rationale: Hifili ya נוּף kimsingi huhusisha kutikisa au kupeperusha, lakini pamoja na “mvua” hapa inaeleza Mungu kuifanya ishuke. “Ulinyesha” ni ya asili na inadumisha utendaji wa Mungu.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Huu ni usemi wa moja kwa moja kwa Mungu; “Ee Mungu” huhifadhi mwito na hadhi ya kishairi.
- source_word: נַחֲלָתְךָ
  choice: urithi wako
  rationale: Neno linaweza kumaanisha milki iliyogawiwa, nchi, au watu wa Mungu. “Urithi wako” huhifadhi upana na utata wa kishairi wa Kiebrania.
- source_word: וְנִלְאָה
  choice: ulipokuwa umechoka
  rationale: Umbo la kike la umoja linarejelea “urithi” na kueleza hali ya kuchoka, kudhoofika, au kulegea. Kishazi cha wakati ni cha asili katika Kiswahili.
- source_word: כּוֹנַנְתָּהּ
  choice: uliutia nguvu
  rationale: Kitenzi כּון kinaweza kumaanisha kufanya imara, kuimarisha, au kuweka sawa. Katika muktadha wa urithi uliodhoofika, “uliutia nguvu” huwasilisha kurejeshwa kwake bila kubainisha ikiwa ni nchi au watu.
theological_decisions:
- issue: Kinachorejelewa na “urithi wako”
  choice: Maneno “urithi wako” yamedumishwa bila kubainisha nchi au watu.
  alternative: “nchi yako” au “watu wako”
  rationale: Kiebrania kinaweza kuwajumuisha watu wa Mungu, nchi yao, au vyote viwili katika mkazo mmoja wa kishairi. Kutobainisha huhifadhi upana huo wa kitheolojia.
- issue: Maana ya כּוֹנַנְתָּהּ
  choice: uliutia nguvu
  alternative: uliuimarisha; uliuthibitisha; uliurejesha
  rationale: Chaguo hili linaendana na urithi uliochoka na linaweza kutumika kwa nchi au kwa watu, bila kuamua kimya kimya rejeo lake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Ee Mungu” hudumisha mwito wa moja kwa moja; “mvua tele” ni ya kawaida na wazi. Viwakilishi vya ngeli ya 11 katika “uliutia” vinafuata nomino “urithi” na vinaepuka kubainisha rejeo lake.
