lexical_decisions:
- source_word: הָאֵל לָנוּ אֵל
  choice: Mungu ni Mungu ... kwetu
  rationale: Inahifadhi urudiaji wenye mkazo wa אֵל na uhusiano unaoonyeshwa na לָנוּ, huku ikisomeka kwa Kiswahili cha kawaida.
- source_word: לְמוֹשָׁעוֹת
  choice: wa wokovu mbalimbali
  rationale: Nomino ya Kiebrania iko katika wingi; 'mbalimbali' inaonyesha matendo mengi au ya namna nyingi ya kuokoa bila kuifanya sentensi kuwa ngumu.
- source_word: וְלֵיהוָה אֲדֹנָי
  choice: na ... ni za Bwana YAHWEH
  rationale: Inawakilisha vipengele vyote viwili, אֲדֹנָי ('Bwana') na jina la agano יהוה ('YAHWEH'), bila kuvichanganya.
- source_word: לַמָּוֶת תּוֹצָאוֹת
  choice: njia za kutoka mautini
  rationale: תּוֹצָאוֹת kihalisi ni 'matokeo/njia za kutoka'; katika muktadha huu humaanisha njia za kuponyoka kutoka katika kifo. 'Mautini' pia linaendana na wingi na mtindo wa kishairi.
theological_decisions:
- issue: Uwasilishaji wa יהוה pamoja na אֲדֹנָי
  choice: Bwana YAHWEH
  alternative: Bwana MUNGU
  rationale: Maandishi yana jina יהוה moja kwa moja pamoja na אֲדֹנָי. 'Bwana YAHWEH' huhifadhi jina la agano na cheo tofauti, bila kuingiza msimamo wa kimadhehebu.
- issue: Maana ya תּוֹצָאוֹת לַמָּוֶת
  choice: njia za kutoka mautini
  alternative: njia za kuponyoka na mauti
  rationale: Kifungu kinaweza kueleweka kwa njia ya picha kama 'matokeo/njia za kutoka' zinazohusiana na kifo. Tafsiri kuu huhifadhi picha hiyo, huku tanbihi ikifafanua maana ya kuokolewa kutoka kifoni.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka. 'Wokovu mbalimbali' huhifadhi wingi wa Kiebrania kwa namna ya kawaida zaidi kuliko 'wokovu' katika wingi; 'mautini' linafaa katika sajili ya Zaburi. Alama zote za tanbihi zimo katika matini kuu.
