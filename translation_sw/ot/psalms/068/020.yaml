  text: Mungu ni Mungu wa maokozi kwetu,[a] na kwa Yahweh, Bwana, kuna njia za kutoka mautini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu wa wokovu.” Wingi wa Kiebrania unaweza kusisitiza matendo ya kuokoa yanayorudiwa au yaliyo ya namna nyingi.
    reason: lexical_alternative
  - marker: b
