  yaml_path: translation/ot/psalms/068/017.yaml
  text: The chariots of God are myriads[a], thousands upon thousands; the Lord is among them[c][b], Sinai in holiness.
translation:
  language: sw
  text: Magari ya vita ya Mungu ni makumi ya maelfu, maelfu kwa maelfu[a]; Bwana yumo kati yao—Sinai katika utakatifu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina kirai ‘maelfu ya shin’an.’ Neno shin’an ni adimu na maana yake si hakika; huenda likadokeza kurudiwa au wingi, hivyo ‘maelfu kwa maelfu.’
    reason: lexical_alternative
  - marker: b
    text: Kishazi cha Kiebrania kimebanwa sana na kinaweza pia kutafsiriwa, ‘Bwana yumo kati yao kama kule Sinai, katika utakatifu,’ au, ‘Bwana amekuja kutoka Sinai kuingia mahali patakatifu.’
    reason: alternative_reading
lexical_decisions:
- source_word: רֶכֶב אֱלֹהִים
  choice: magari ya vita ya Mungu
  rationale: רֶכֶב hapa ni jina la jumla linalomaanisha magari ya kale ya kivita. ‘Magari ya vita’ linaweka wazi taswira hiyo kwa msomaji wa Kiswahili cha sasa, huku muundo wa umilikaji ‘ya Mungu’ ukihifadhiwa.
- source_word: רִבֹּתַיִם
  choice: makumi ya maelfu
  rationale: Umbo hili la kishairi linaweza kumaanisha makumi elfu mawili au, kwa upana zaidi, idadi kubwa sana. ‘Makumi ya maelfu’ huhifadhi wazo la wingi bila kulazimisha hesabu kamili.
- source_word: אַלְפֵי שִׁנְאָן
  choice: maelfu kwa maelfu
  rationale: שִׁנְאָן ni neno adimu lenye maana isiyo hakika, huenda likidokeza kurudiwa au kuzidishwa. ‘Maelfu kwa maelfu’ linaeleza wingi huo kwa Kiswahili cha kawaida huku tanbihi ikihifadhi kutokuwa na uhakika kwa neno hilo.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Hili ni jina la cheo cha Mungu linalomaanisha mwenye mamlaka; ‘Bwana’ ndilo neno la kawaida, lenye heshima, katika Kiswahili.
- source_word: בָם
  choice: kati yao
  rationale: Kihusishi ב pamoja na kiambishi cha nafsi kinaweza kumaanisha ‘ndani yao,’ ‘kati yao,’ au ‘pamoja nao.’ Katika muktadha wa msafara mkubwa wa magari, ‘kati yao’ ni la asili zaidi.
- source_word: סִינַי
  choice: Sinai
  rationale: Jina la mahali limehifadhiwa kwa umbo lake lililozoeleka katika Kiswahili.
- source_word: בַּקֹּדֶשׁ
  choice: katika utakatifu
  rationale: קֹדֶשׁ linaweza kumaanisha utakatifu au mahali patakatifu. ‘Katika utakatifu’ halilazimishi maana ya mahali maalumu na linaendeleza ufupi wa kishairi wa Kiebrania.
theological_decisions:
- issue: Maana ya kishazi kilichobanwa אֲדֹנָי בָם סִינַי בַּקֹּדֶשׁ
  choice: Bwana yumo kati yao—Sinai katika utakatifu
  alternative: Bwana yumo kati yao kama alivyokuwa Sinai, katika utakatifu; au, Bwana amekuja kutoka Sinai kuingia mahali patakatifu
  rationale: Kiebrania hakina kitenzi wala kiunganishi kinachoeleza wazi uhusiano wa ‘Sinai’ na ‘katika utakatifu.’ Tafsiri kuu inadumisha ufupi na mvutano huo badala ya kuongeza wazi kulinganisha au mwendo ambao haujaandikwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Magari ya vita’ huepuka maana ya magari ya kisasa inayoweza kujitokeza kwa ‘magari’ pekee. Mstari wa mwisho umeachwa kwa ufupi wa kishairi kwa sababu sintaksia ya chanzo ni tata, na tanbihi inaonyesha tafsiri kuu mbadala.
