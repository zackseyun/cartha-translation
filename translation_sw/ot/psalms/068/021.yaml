source:
  edition: WLC
  text: אַךְ אֱלֹהִ֗ים יִמְחַץ֮ רֹ֤אשׁ אֹ֫יְבָ֥י/ו קָדְקֹ֥ד שֵׂעָ֑ר מִ֝תְהַלֵּ֗ךְ בַּ/אֲשָׁמָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/021.yaml
  text: Surely God will crush the head of his enemies[a], the hairy crown of the one who walks in his guilt.
translation:
  language: sw
  text: Hakika Mungu ataponda kichwa cha adui zake, utosi wenye nywele wa yule anayetembea katika hatia zake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utosi wenye nywele wa yule anayetembea katika hatia yake”; au, “utosi wenye nywele wa yule anayeendelea katika makosa yake.”
    reason: 'Mchanganyiko wa קָדְקֹד שֵׂעָר na בַּאֲשָׁמָיו unaweza kutafsiriwa kwa tofauti ndogo: kama utosi wenye nywele, na kama hali ya hatia au makosa yenye kuleta hatia.'
lexical_decisions:
- source_word: אַךְ
  choice: Hakika
  rationale: Hapa chembe hii inasisitiza uhakika wa kauli, si maana ya kizuizi kama ‘tu.’
- source_word: יִמְחַץ
  choice: ataponda
  rationale: Kitenzi kinaonyesha kuvunja au kuseta kwa nguvu; ‘ataponda’ huhifadhi ukali wa picha ya hukumu.
- source_word: רֹאשׁ אֹיְבָיו
  choice: kichwa cha adui zake
  rationale: Picha halisi ya kiungo cha mwili imehifadhiwa, na kiambishi cha nafsi kinarejelea Mungu kwa kawaida zaidi katika muktadha huu.
- source_word: קָדְקֹד שֵׂעָר
  choice: utosi wenye nywele
  rationale: קָדְקֹד ni sehemu ya juu ya kichwa, na שֵׂעָר inauelezea kuwa wenye nywele; tafsiri hii huhifadhi usambamba na ‘kichwa’ pamoja na picha halisi.
- source_word: מִתְהַלֵּךְ
  choice: anayetembea
  rationale: Kivumishi-tendo hiki kinaonyesha mwenendo unaoendelea; ‘anayetembea’ huhifadhi sitiari ya Kiebrania ya namna ya kuishi.
- source_word: בַּאֲשָׁמָיו
  choice: katika hatia zake
  rationale: Nomino inaweza kumaanisha hatia au makosa yanayomfanya mtu awe na hatia. Wingi wenye kiambishi umehifadhiwa, bila kuondoa uwezekano wa maana ya hali ya kuwa na hatia.
theological_decisions:
- issue: Mrejelewa wa kiambishi katika ‘adui zake’
  choice: 'Kiambishi kinarejelea Mungu: ‘adui zake.’'
  alternative: Kinaweza kueleweka kwa upana kuwa maadui wa mfalme wa kimungu au wa watu wa Mungu.
  rationale: Mungu ndiye kiima cha karibu cha kitenzi cha umoja, hivyo ndiye mrejelewa wa kawaida zaidi; tafsiri haiongezi mrejelewa mwembamba wa kimasiya au kitaifa.
- issue: Maana ya בַּאֲשָׁמָיו
  choice: katika hatia zake
  alternative: katika hatia yake; akiendelea katika makosa yake
  rationale: Muundo unaweza kuonyesha makosa yenye kuleta hatia au hali ya hatia. Tafsiri kuu huhifadhi wingi wa Kiebrania na sitiari ya kutembea, huku tanbihi ikionyesha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka. Picha kali ya kishairi na sitiari ya ‘kutembea’ zimehifadhiwa badala ya kufafanuliwa kupita kiasi.
