lexical_decisions:
- source_word: בְּמַקְהֵלוֹת
  choice: Katika makusanyiko
  rationale: Nomino ya wingi מַקְהֵלוֹת humaanisha mikutano au makundi yaliyokusanyika. “Makusanyiko” huhifadhi wingi bila kudokeza taasisi maalumu ya kidini.
- source_word: בָּרְכוּ
  choice: mbarikini
  rationale: Ni amri ya wingi kutoka ברך. Mungu anapokuwa mtendewa, neno hili humaanisha kumbariki kwa maneno ya ibada; “mbarikini” huhifadhi umbo la kileksia kuliko “msifuni.”
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu אֱלֹהִים humrejelea Mungu mmoja, na jina Yahwe linalofuata linafafanua rejeleo hilo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la konsonanti nne limetoholewa moja kwa moja kama “Yahwe” badala ya kubadilishwa kuwa cheo “BWANA.”
- source_word: מִמְּקוֹר
  choice: kutoka katika chemchemi
  rationale: מָקוֹר ni chanzo au chemchemi. “Chemchemi” huhifadhi taswira ya kishairi, huku “kutoka katika” ikiwakilisha kihusishi מִן. Uhusiano wa kirai hiki na maneno yaliyotangulia ni wa kidokezo na unabaki wazi.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Hili ndilo umbo la kawaida la jina hili maalumu katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania ya WLC yana jina יְהוָה lenyewe. Kutumia “Yahwe” huhifadhi jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa מִמְּקוֹר יִשְׂרָאֵל na amri
  choice: kutoka katika chemchemi ya Israeli
  alternative: enyi mliotoka katika chemchemi ya Israeli
  rationale: Kiebrania ni kifupi na hakina kiwakilishi wazi kinachowataja waabudu. Tafsiri kuu huhifadhi hali hiyo, huku tanbihi ikionyesha uwezekano kwamba kirai kinawaeleza wanaoamriwa kumbariki Mungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Makusanyiko” huepuka maana finyu ya kitaasisi, na “chemchemi” huhifadhi taswira ya Kiebrania. Alama zote za tanbihi zimewekwa katika matini kuu.
