  text: Katika makusanyiko, mbarikini Mungu, Yahwe,[a] kutoka chemchemi ya Israeli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “YHWH,” jina la Mungu; kwa desturi hutafsiriwa “BWANA.”
