  text: שָׁ֤ם בִּנְיָמִ֨ן צָעִ֡יר רֹדֵ֗/ם שָׂרֵ֣י יְ֭הוּדָה רִגְמָתָ֑/ם שָׂרֵ֥י זְ֝בֻל֗וּן שָׂרֵ֥י נַפְתָּלִֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/027.yaml
  text: There is little Benjamin[a], leading them; the princes of Judah in their throng; the princes of Zebulun[b]; the princes of Naphtali.
translation:
  language: sw
  text: Huko yuko Benyamini mdogo, akiwaongoza[a]; wakuu wa Yuda katika umati wao[b]; wakuu wa Zabuloni; wakuu wa Naftali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiwatawala” au “akiwa na mamlaka juu yao.” Neno la Kiebrania linaweza kuonyesha utawala au kuwa mbele; hapa limetafsiriwa kwa maana ya kuongoza msafara.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika kundi lao,” “katika mkusanyiko wao,” au “katika halaiki yao.” Neno la Kiebrania ni adimu, na maana yake kamili si hakika, lakini linaonyesha kundi lililokusanyika pamoja na Yuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Huko yuko
  rationale: Kielezi cha mahali kinaashiria waliopo katika msafara; muundo huu ni wa kawaida katika Kiswahili na unaweka wazi nguvu ya kuonyesha mahali.
- source_word: בִּנְיָמִן
  choice: Benyamini
  rationale: Jina la kabila limetolewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: צָעִיר
  choice: mdogo
  rationale: Neno linaweza kumaanisha mdogo, mchanga, au aliye mdogo zaidi; hapa linaelekea kuonyesha udogo au hadhi ya kabila la Benyamini kuliko umri.
- source_word: רֹדֵם
  choice: akiwaongoza
  rationale: Kirai ni umbo la kushiriki lenye kiambishi cha nafsi ya tatu wingi na kinaweza kuonyesha kutawala au kuwa mbele. Katika muktadha wa msafara, 'akiwaongoza' ni asilia huku maana mbadala zikihifadhiwa katika tanbihi.
- source_word: שָׂרֵי
  choice: wakuu
  rationale: Neno humaanisha viongozi, watawala, au maafisa wenye cheo. 'Wakuu' ni la heshima, la sasa, na linafaa kwa viongozi wa makabila bila kudokeza lazima kuwa wana wa mfalme.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Jina la kabila limetolewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: רִגְמָתָם
  choice: katika umati wao
  rationale: Hili ni neno adimu lenye maana isiyo hakika kabisa, lakini linaonekana kuonyesha kundi au mkusanyiko. 'Katika umati wao' huhifadhi picha ya kundi lililokusanyika.
- source_word: זְבֻלוּן
  choice: Zabuloni
  rationale: Jina la kabila limetolewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Jina la kabila limetolewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
