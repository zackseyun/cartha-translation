base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/006.yaml
  text: God settles the solitary in a home; he brings out prisoners into prosperity[a], but the rebellious dwell in a parched land.
translation:
  language: sw
  text: Mungu huwaweka walio peke yao katika makao; huwatoa wafungwa na kuwaingiza katika ustawi[a], lakini waasi hukaa katika nchi kame.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika wingi.” Neno hili adimu la Kiebrania pia hueleweka na wengine kuwa “kwa kuimba” au kwa usemi mwingine unaoonyesha kuachiliwa kwa furaha.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hapa ni jina la kawaida la Mungu wa Israeli, likiwa na maana ya umoja kama inavyoonyesha miundo ya vitenzi inayofuata.
- source_word: מוֹשִׁיב
  choice: huwapa ... makao
  rationale: Muundo wa Hifili wa ישׁב una maana ya kusababisha mtu akae au apate makao; usemi huu wa Kiswahili huhifadhi maana hiyo ya usababishaji kwa lugha ya kawaida.
- source_word: יְחִידִים
  choice: walio peke yao
  rationale: Neno hili huonyesha watu walio peke yao au waliotengwa, bila kulifanya lihusu hisia ya upweke pekee.
- source_word: בַּיְתָה
  choice: nyumbani
  rationale: בַּיִת inaweza kumaanisha nyumba au jamaa ya nyumbani; 'nyumbani' huhifadhi wazo la makao na mahali pa kuwa sehemu ya wengine bila kulibana kuwa familia ya kibaolojia.
- source_word: מוֹצִיא
  choice: huwatoa
  rationale: Hifili ya יצא humaanisha kusababisha watoke; 'huwatoa' ni ya moja kwa moja na inafaa katika ulinganifu wa kishairi.
- source_word: אֲסִירִים
  choice: wafungwa
  rationale: Huwataja waliofungwa au kutiwa kifungoni; 'wafungwa' ni neno wazi na la kawaida.
- source_word: בַּכּוֹשָׁרוֹת
  choice: na kuwaingiza katika mafanikio
  rationale: Neno hili adimu halina maana iliyo hakika. Huenda likahusiana na mafanikio, ustawi au wingi; wengine hulihusisha na kuimba kwa furaha. Tafsiri kuu inafuata uwezekano wa mafanikio huku tanbihi ikihifadhi utata.
- source_word: אַךְ
  choice: lakini
  rationale: Hapa huleta tofauti kali kati ya matendo mema ya Mungu kwa walio dhaifu na hali ya waasi.
- source_word: סוֹרֲרִים
  choice: waasi
  rationale: Kitenzi-shirikishi kutoka סרר huonyesha watu wakaidi wanaokataa kutii; 'waasi' ni wazi na fasaha.
- source_word: שָׁכְנוּ
  choice: hukaa
  rationale: Qali timilifu ya שכן imetumika kwa maana ya jumla katika ushairi; wakati wa mazoea wa Kiswahili unafaa kwa kauli hii.
- source_word: צְחִיחָה
  choice: katika nchi kame
  rationale: Nomino hii huonyesha ukavu au mahali palipokauka; 'nchi kame' hudumisha taswira ya kishairi na tofauti yake na makao na mafanikio.
theological_decisions:
- issue: Maana ya tendo la Mungu kwa walio peke yao
  choice: Mungu huwapatia watu waliotengwa makao na mahali pa kuishi.
  alternative: Mungu huwaweka wapweke katika familia.
  rationale: Kiebrania kinataja moja kwa moja 'walio peke yao' na 'nyumba/nyumbani.' Tafsiri ya 'familia' inawezekana kwa maana ya kaya, lakini 'nyumbani' huhifadhi taswira ya chanzo bila kuibana kuwa uhusiano wa kifamilia wa kibaolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo wa mazoea 'huwapa/huwatoa/hukaa' unaakisi tabia ya matendo na tofauti ya kishairi. Alama ya tanbihi [a] imewekwa mara baada ya neno linalohusika.
