  text: אֶ֤רֶץ רָעָ֨שָׁה אַף שָׁמַ֣יִם נָטְפוּ֮ מִ/פְּנֵ֪י אֱלֹ֫הִ֥ים זֶ֥ה סִינַ֑י מִ/פְּנֵ֥י אֱ֝לֹהִ֗ים אֱלֹהֵ֥י יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/008.yaml
  text: The earth quaked; even the heavens dripped before God—this Sinai—before God, the God of Israel.
translation:
  language: sw
  text: Dunia ilitetemeka; hata mbingu zilidondosha matone mbele za Mungu—Sinai hii—mbele za Mungu, Mungu wa Israeli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶרֶץ רָעָשָׁה
  choice: Dunia ilitetemeka
  rationale: Neno אֶרֶץ hapa linaweza kumaanisha nchi au dunia; katika taswira pana ya uumbaji unaotikiswa mbele za Mungu, “dunia” ni ya asili na hudumisha upana huo. Kitenzi רָעָשָׁה kinaelezwa moja kwa moja kwa “ilitetemeka.”
- source_word: שָׁמַיִם נָטְפוּ
  choice: mbingu zilidondosha mvua
  rationale: Kitenzi נָטַף humaanisha kudondoka au kudondosha matone; kwa mbingu, Kiswahili cha kawaida huhitaji kutaja mvua ili picha ieleweke bila kuondoa lugha ya kishairi.
- source_word: מִפְּנֵי אֱלֹהִים
  choice: mbele za Mungu
  rationale: Huhifadhi wazo la uwepo au uso wa Mungu, pamoja na marudio ya kishairi ya tungo hii.
- source_word: זֶה סִינַי
  choice: Sinai hii
  rationale: Hufuata kwa karibu usemi mfupi na wenye mkazo wa Kiebrania, “hii Sinai,” bila kuufafanua kimyakimya kuwa mlima wenyewe au kuubadili kuwa kauli nyingine.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida, na yenye hadhi ya muundo wa Kiebrania.
theological_decisions:
- issue: Uhusiano wa maneno זֶה סִינַי na kishazi kinachotangulia
  choice: —Sinai hii—
  alternative: —Sinai yenyewe— / hata Sinai
  rationale: Sarufi ya mstari ni fupi na inaweza kueleweka kwa namna zaidi ya moja. Tafsiri hii huhifadhi ukaribu wa maneno na utata wake badala ya kuamua wazi kwamba Sinai ndiyo iliyotikiswa au kwamba ni ufafanuzi kamili wa tukio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na mtiririko wa kishairi. Marudio ya “mbele za Mungu” yamehifadhiwa kwa sababu ni sehemu ya msisitizo wa mstari wa Kiebrania.
