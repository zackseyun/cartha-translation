base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/000.yaml
  text: A Song of Ascents. Blessed is everyone who fears Yahweh[a], who walks in his ways.
translation:
  language: sw
  text: Wimbo wa Kupanda. Heri kila anayemcha Yahwe,[a] anayetembea katika njia zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ana furaha kila anayemcha BWANA.” Neno la Kiebrania אַשְׁרֵי linaweza kumaanisha hali ya kuwa na heri, kustawi, au kubarikiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa Kupanda
  rationale: Kichwa hiki cha zaburi kinadumisha picha ya kupanda, ambayo huenda ilihusiana na safari ya kwenda Yerusalemu, bila kufafanua zaidi ya Kiebrania.
- source_word: אַשְׁרֵי
  choice: Heri
  rationale: “Heri” ni neno la kawaida na lenye hadhi katika Kiswahili kwa hali ya kubarikiwa, kufanikiwa, au kustawi inayodokezwa hapa.
- source_word: יְרֵא
  choice: anayemcha
  rationale: “Kumcha” hujumuisha hofu yenye heshima na staha kwa Mungu, bila kuipunguza kuwa woga pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetafsiriwa kwa umbo la Kiswahili “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: הַהֹלֵךְ בִּדְרָכָיו
  choice: anayetembea katika njia zake
  rationale: Usemi huu unahifadhi sitiari ya Kiebrania ya mwenendo wa maisha kama kutembea katika njia za Mungu.
theological_decisions:
- issue: Maana ya אַשְׁרֵי
  choice: Heri
  alternative: Ana furaha
  rationale: “Heri” huhifadhi upana wa hali ya baraka na ustawi, ilhali “ana furaha” inaweza kueleweka hasa kama hisia ya muda.
- issue: Uwakilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Kutumia “Yahwe” hudumisha kwamba maandishi yana jina binafsi la Mungu, si cheo tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili na unaeleweka kwa urahisi huku ukihifadhi sitiari na mfuatano wa Kiebrania.
