  yaml_path: translation/ot/psalms/128/006.yaml
  text: May you see your children's children[b][a]. Peace be upon Israel.
translation:
  language: sw
  text: Na uone watoto wa watoto wako.[a] Amani[b] iwe juu ya Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “wana kwa wana wako,” yaani, “wajukuu” au “watoto wa watoto wako.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania shalom, lililotafsiriwa “amani,” linaweza pia kujumuisha hali njema, ukamilifu na ustawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/רְאֵה
  choice: Na uwaone
  rationale: Umbo la amri katika muktadha huu lina nguvu ya ombi au baraka. Kiswahili cha baraka ‘uwaone’ huhifadhi maana hiyo, huku ‘Na’ kikidumisha kiunganishi cha Kiebrania.
- source_word: בָנִים לְ/בָנֶי/ךָ
  choice: watoto wa watoto wako
  rationale: Hii ni nahau ya Kiebrania inayomaanisha wajukuu au vizazi vya watoto wa mtu. Tafsiri hii ni ya asili katika Kiswahili na haibani maana kwa wana wa kiume pekee.
- source_word: שָׁלוֹם
  choice: Amani
  rationale: ‘Amani’ ndiyo tafsiri ya moja kwa moja na iliyozoeleka, huku neno la Kiebrania likiwa na wigo mpana unaohusisha pia hali njema, ukamilifu na ustawi.
- source_word: עַל
  choice: juu ya
  rationale: Katika tamko la baraka, ‘juu ya’ huhifadhi picha ya amani ikikaa au kushuka juu ya Israeli.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili sanifu.
theological_decisions:
- issue: Wigo wa baraka ya mwisho
  choice: Israeli imetajwa moja kwa moja kama ilivyo katika maandishi ya Kiebrania.
  alternative: Jumuiya ya waabudu kwa ujumla, au kanisa kwa maana ya kiishara.
  rationale: Maandishi yanataja Israeli waziwazi; tafsiri haipaswi kuingiza upanuzi wa kiteolojia usiotajwa katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa urahisi. Muundo wa baraka umehifadhiwa bila kuufanya kuwa utabiri wa moja kwa moja; lugha jumuishi ya kifamilia imetumiwa kwa nahau ya vizazi.
