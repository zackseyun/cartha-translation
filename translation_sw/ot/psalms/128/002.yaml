  text: For you will eat the labor of your hands[a]; blessed are you[b], and it will be well with you.
translation:
  language: sw
  text: Utakula matunda ya kazi ya mikono yako[a]; una heri[b], na itakuwa vema kwako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “taabu ya mikono yako.”
