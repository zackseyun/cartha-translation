lexical_decisions:
- source_word: יְגִיעַ כַּפֶּיךָ
  choice: matunda ya kazi ya mikono yako
  rationale: Kirai cha Kiebrania kinasema kihalisi ‘taabu/kazi ya mikono yako,’ lakini hapa kinamaanisha kile kinachopatikana kwa kazi hiyo na kuliwa. ‘Matunda ya kazi ya mikono yako’ ni Kiswahili cha kawaida kinachohifadhi wazo la kufurahia kile ambacho mtu mwenyewe amekifanyia kazi.
- source_word: כִּי
  choice: (haikutafsiriwa kwa neno tofauti)
  rationale: Katika muktadha huu kiunganishi kinaweza kuwa cha kusisitiza au kuhusisha kauli hii na baraka iliyotangulia. Kiswahili huwasilisha maana hiyo kwa kawaida bila kuongeza ‘kwa maana’ au ‘hakika,’ ambazo zingebana maana kwa upande mmoja.
- source_word: תֹאכֵל
  choice: utakula
  rationale: Kauli isiyotimilika inaeleza matokeo yanayotarajiwa; wakati ujao wa Kiswahili unafaa na unahifadhi taswira halisi ya kula riziki iliyopatikana.
- source_word: אַשְׁרֶיךָ
  choice: una heri
  rationale: ‘Heri’ hubeba maana ya hali njema, yenye kufanikiwa na kustawi, bila kuifanya iwe hisia ya furaha pekee. Muundo ‘una heri’ ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: וְטוֹב לָךְ
  choice: na mambo yatakuwa mema kwako
  rationale: Usemi huu unaeleza hali njema au ustawi wa mtu. Tafsiri hii ni ya asili katika Kiswahili na haiongezi aina maalumu ya mafanikio ambayo Kiebrania hakuitaji.
theological_decisions:
- issue: Lugha ya heri katika muktadha wa hekima
  choice: una heri
  alternative: una furaha
  rationale: Neno la Kiebrania linaweza kuonyesha furaha, bahati njema, au kustawi. ‘Una heri’ huhifadhi upana wa lugha ya heri na haipunguzi maana kuwa hali ya kihisia tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri imetumia usemi wa kawaida ‘matunda ya kazi’ huku tanbihi ikihifadhi umbo halisi zaidi la Kiebrania.
