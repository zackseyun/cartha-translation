  yaml_path: translation/ot/psalms/128/004.yaml
  text: Behold[a], thus shall the man who fears Yahweh be blessed.
translation:
  language: sw
  text: Tazama, hivyo ndivyo atakavyobarikiwa mwanaume[a] anayemcha Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mwanaume”; umbo la kiume hapa linatumika kimethali kumaanisha mtu anayejulikana kwa kumcha Yahwe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni kiashiria cha msisitizo kinachovuta usikivu; “Tazama” kinahifadhi uzito wa kishairi na wa kutangaza.
- source_word: כִי כֵן
  choice: hivyo ndivyo
  rationale: Muunganiko huu unasisitiza namna au matokeo; “hivyo ndivyo” ni Kiswahili cha kawaida kinachohifadhi msisitizo huo.
- source_word: יְבֹרַךְ
  choice: atakavyobarikiwa
  rationale: Umbo la Pual ni la kutendwa na linaonyesha kupokea baraka; uchaguzi huu unahifadhi kauli tendwa na sauti ya tamko la kimethali.
- source_word: גָּבֶר
  choice: mwanaume
  rationale: Neno la Kiebrania ni la kiume kisarufi na hapa lina nguvu ya kiwakilishi katika kauli ya kimethali; tanbihi inaeleza upana wa matumizi yake.
- source_word: יְרֵא יְהוָה
  choice: anayemcha Yahwe
  rationale: Kirai hiki kinaonyesha sifa ya kudumu ya mtu huyo. “Kumcha” huhifadhi istilahi ya moja kwa moja ya hekima na agano kuliko ufafanuzi wa “kumheshimu.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetafsiriwa moja kwa moja kama “Yahwe,” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia Tetragramatoni yenyewe; “Yahwe” huhifadhi jina la agano bila kulibadilisha kuwa cheo.
- issue: Uanaume wa kiwakilishi katika גָּבֶר
  choice: mwanaume
  alternative: mtu
  rationale: Neno la chanzo ni la kiume, lakini katika muktadha huu linafanya kazi kimethali kumwakilisha mtu mwenye sifa ya kumcha Yahwe; tanbihi huhifadhi maelezo hayo bila kusawazisha umbo la chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo “hivyo ndivyo atakavyobarikiwa” unaunganisha mstari huu na mfano wa baraka ulioelezwa katika mistari iliyotangulia.
