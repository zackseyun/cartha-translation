base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/001.yaml
  text: A Song of Ascents. Blessed is everyone who fears Yahweh[a], who walks in his ways.
translation:
  language: sw
  text: Wimbo wa Kupanda. Heri[a] kila mtu anayemcha Yahwe, anayetembea katika njia zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwenye furaha ni kila mtu anayemcha Yahwe.” Neno la Kiebrania אַשְׁרֵי linaweza kueleza hali ya heri, ustawi, au furaha.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa kwenda juu
  rationale: Huhifadhi wazo halisi la מַעֲלוֹת, yaani kwenda au kupanda juu, bila kuamua kimyakimya kwamba kichwa hiki kinamaanisha hasa wimbo wa mahujaji.
- source_word: אַשְׁרֵי
  choice: Heri
  rationale: Neno hili la kawaida katika semi za hekima hutangaza hali njema ya mtu aliyebarikiwa au anayestawi; “Heri” ni la asili, lenye hadhi, na linaacha upana huo wa maana.
- source_word: כָּל יְרֵא
  choice: kila mtu anayemcha
  rationale: “Kila mtu” huwasilisha maana jumuishi ya כָּל pamoja na kishiriki cha umoja, bila kuifanya kauli kuwa ya wanaume pekee.
- source_word: יְרֵא יְהוָה
  choice: anayemcha Yahwe
  rationale: “Kumcha” huhifadhi lugha ya hofu yenye heshima kwa Mungu iliyo ya kawaida katika fasihi ya hekima, badala ya kuipunguza kuwa heshima tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadilisha kuwa cheo kama “BWANA.”
- source_word: הַהֹלֵךְ
  choice: anayetembea
  rationale: Huhifadhi sitiari ya Kiebrania ya kutembea kama mwenendo wa maisha.
- source_word: בִּדְרָכָיו
  choice: katika njia zake
  rationale: Huhifadhi taswira ya njia kwa maana ya mwenendo; kiwakilishi “zake” humrejelea Yahwe kwa kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina la agano moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Maana ya ירא katika usemi wa hekima
  choice: kumcha Yahwe
  alternative: kumheshimu Yahwe; kumstaajabia Yahwe
  rationale: “Kumcha” huhifadhi uzito na mvutano wa neno la Kiebrania, huku muktadha ukionyesha hofu yenye heshima na utii.
- issue: Ujumuishi wa כָּל יְרֵא
  choice: kila mtu anayemcha
  alternative: kila mwanamume anayemcha; wote wanaomcha
  rationale: Kishiriki cha kiume cha umoja kina nguvu ya uwakilishi wa jumla; “kila mtu” huonyesha maana hiyo bila kuweka kikomo kisichokuwapo kwa wanaume.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi kama mstari wa hekima; “anayetembea katika njia zake” huhifadhi sitiari ya chanzo bila kuwa mgumu kueleweka.
