  variant: Standard East African Swahili
source:
  edition: WLC
  text: יְבָרֶכְ/ךָ֥ יְהוָ֗ה מִ/צִּ֫יּ֥וֹן וּ֭/רְאֵה בְּ/ט֣וּב יְרוּשָׁלִָ֑ם כֹּ֝֗ל יְמֵ֣י חַיֶּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/005.yaml
  text: May Yahweh bless you from Zion[a], and may you see the prosperity of Jerusalem all the days of your life.
translation:
  language: sw
  text: 'Yahwe akubariki kutoka Sayuni,

    na uone ustawi[a] wa Yerusalemu

    siku zote za maisha yako.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mema ya Yerusalemu” au “hali njema ya Yerusalemu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: akubariki
  rationale: Kauli ya baraka katika muktadha huu inaeleweka kama ombi au tamani. Muundo wa Kiswahili ‘Yahwe akubariki’ huwasilisha vizuri nguvu hiyo ya baraka.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limewasilishwa kwa uhamishaji wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: מִצִּיּוֹן
  choice: kutoka Sayuni
  rationale: Kihusishi מן kinaonyesha chanzo; ‘kutoka Sayuni’ kinadumisha wazi wazo la baraka inayotoka huko.
- source_word: וּרְאֵה
  choice: na uone
  rationale: Ingawa kimaumbo ni amri ya nafsi ya pili umoja, baada ya kauli ya baraka inaendeleza ombi au tamani. ‘Na uone’ ni ya asili katika Kiswahili na inadumisha umbo la karibu na chanzo.
- source_word: בְּטוּב
  choice: ustawi
  rationale: טוּב hapa inaweza kumaanisha mema, wema, hali njema, au ustawi. ‘Ustawi’ huonyesha hali njema inayoonekana ya Yerusalemu, huku tanbihi ikihifadhi uwezekano mwingine wa kileksika.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: siku zote za maisha yako
  rationale: Tafsiri hii ya moja kwa moja ni ya asili na inahifadhi nahau ya Kiebrania ya muda wote wa maisha.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lenyewe linatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Baraka kutoka Sayuni
  choice: Sayuni imehifadhiwa kama chanzo cha baraka bila ufafanuzi wa ziada
  alternative: Kupanua Sayuni kuwa hekalu au kitovu cha Kimasihi ndani ya matini
  rationale: Mstari unaunganisha baraka kutoka Sayuni na hali njema ya Yerusalemu, lakini haufafanui zaidi maana yake ya kitheolojia; tafsiri haipaswi kuingiza ufafanuzi usiotajwa.
- issue: Nguvu ya וּרְאֵה katika mfuatano wa baraka
  choice: na uone
  alternative: na ukaone; nawe utaona
  rationale: Muundo huu unahifadhi hali ya ombi au tamani bila kuugeuza kuwa ahadi ya uhakika, huku pia ukibaki karibu na amri ya Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa mistari unafuata ushairi wa mstari huu; nafsi ya pili umoja imehifadhiwa.
