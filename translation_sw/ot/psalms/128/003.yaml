base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/003.yaml
  text: Your wife will be like a fruitful vine in the recesses of your house[b][a]; your children will be like olive shoots around your table.
translation:
  language: sw
  text: Mke wako atakuwa kama mzabibu uzaao matunda katika sehemu za ndani za nyumba yako; wana wako[a] watakuwa kama miche ya mizeituni inayozunguka meza yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watoto wako,” ikiwa neno la kiume linaeleweka kuwa linawakilisha uzao kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁתְּךָ
  choice: mke wako
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mwanamke aliye katika uhusiano wa ndoa, kama muktadha unavyodai.
- source_word: כְּגֶפֶן פֹּרִיָּה
  choice: kama mzabibu wenye kuzaa matunda
  rationale: Huhifadhi ulinganisho na taswira ya kilimo ya mzabibu unaozaa, kwa lugha ya kawaida na wazi.
- source_word: בְּיַרְכְּתֵי בֵיתֶךָ
  choice: katika sehemu za ndani za nyumba yako
  rationale: יַרְכְּתֵי hudokeza sehemu za ndani au za mbali; tafsiri hii huhifadhi wazo la mahali bila kulifanya kuwa mahususi kupita ushahidi wa Kiebrania.
- source_word: בָּנֶיךָ
  choice: wana wako
  rationale: Neno la Kiebrania ni wingi wa kiume, ‘wana’; Kiswahili ‘wana’ huhifadhi alama hiyo ya kijinsia na sauti ya kishairi.
- source_word: כִּשְׁתִלֵי זֵיתִים
  choice: kama miche ya mizeituni
  rationale: שְׁתִלֵי ni mimea michanga iliyopandwa; ‘miche’ ni neno la asili na sahihi kwa taswira ya ukuaji.
- source_word: סָבִיב לְשֻׁלְחָנֶךָ
  choice: kuizunguka meza yako
  rationale: Hutoa kwa kawaida uhusiano wa mahali unaoonyeshwa na ‘kuzunguka meza yako’.
theological_decisions:
- issue: Neno la kijinsia kwa uzao
  choice: wana wako
  alternative: watoto wako
  rationale: Kiebrania kinatumia nomino ya wingi wa kiume yenye maana ya ‘wana.’ Tafsiri kuu huhifadhi umbo hilo, huku tanbihi ikitambua uwezekano wa matumizi wakilishi kwa uzao kwa ujumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. ‘Sehemu za ndani’ huhifadhi maana ya mahali ya יַרְכְּתֵי bila kutumia usemi mgumu; ‘miche ya mizeituni’ ni taswira ya kawaida ya mimea michanga.
