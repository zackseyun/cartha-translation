base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/004.yaml
  text: Keep me[a], O Yahweh, from the hands of the wicked; guard me from the violent man[b], who has planned to trip up my feet.
translation:
  language: sw
  text: Ee Yahwe, unilinde kutoka mikononi mwa mwovu; unihifadhi kutoka kwa mtu wa jeuri,[a] ambao wamepanga kunikwaza.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “mtu wa jeuri.” Kiebrania kina nomino ya umoja hapa, lakini kitenzi kinachofuata ni cha wingi; umoja unaweza kuwa wa kijumla.'
    reason: grammatical_ambiguity
  - marker: b
    text: Au, “kuzisukuma hatua zangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: unilinde
  rationale: Ombi la ulinzi kutoka katika kitenzi שׁמר; “unilinde” ni Kiswahili cha kawaida na chenye heshima.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: מִידֵי רָשָׁע
  choice: na mikono ya mwovu
  rationale: “Mikono” inadumisha taswira ya Kiebrania ya mamlaka au nguvu ya adui; umoja wa רָשָׁע umehifadhiwa kama umoja wa kijumla.
- source_word: מֵאִישׁ חֲמָסִים
  choice: na watu wenye jeuri
  rationale: Ingawa אִישׁ ni umoja, kitenzi kinachofuata ni wingi. Wingi wa Kiswahili unawasilisha kundi linalokusudiwa na kufanya upatanisho wa kisarufi uwe wa kawaida; tanbihi inadokeza umbo la umoja.
- source_word: תִּנְצְרֵנִי
  choice: unihifadhi
  rationale: Kitenzi נצר ni ombi lingine la kulindwa; “unihifadhi” hutofautisha kwa kawaida sambamba hii na “unilinde.”
- source_word: חָשְׁבוּ
  choice: wamepanga
  rationale: Katika muktadha wa njama ya adui, חשב humaanisha kupanga au kubuni, si kufikiri tu; umbo la wingi limehifadhiwa.
- source_word: לִדְחוֹת פְּעָמָי
  choice: kunifanya nijikwae
  rationale: Kauli hii inawasilisha kwa Kiswahili cha kawaida kusudi la kusukuma au kupindua hatua za msemaji hata ajikwae, huku mbadala wa karibu zaidi na taswira ya asili ukitolewa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: “Yahwe” huhifadhi jina binafsi lililo katika matini ya Kiebrania badala ya kulibadilisha kuwa cheo.
- issue: Tofauti ya idadi kati ya nomino za umoja na kitenzi חָשְׁבוּ cha wingi
  choice: watu wenye jeuri, ambao wamepanga
  alternative: mtu mwenye jeuri, ambaye amepanga
  rationale: Matini ya Kiebrania ina אִישׁ ya umoja lakini חָשְׁבוּ ya wingi. Tafsiri inafuata wingi ulio wazi katika kitenzi na kuelewa mtu wa jeuri kwa maana ya kundi, bila kuficha umbo la umoja kwa sababu limeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wa heshima. “Ee” linaonyesha mwito wa moja kwa moja; sentensi sambamba inadumisha muundo wa zaburi bila kuwa ngumu kwa msomaji wa sasa.
