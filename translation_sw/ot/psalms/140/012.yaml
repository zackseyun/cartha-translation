base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/012.yaml
  text: I know that Yahweh will uphold the cause of the afflicted[b][a], and justice for the needy.
translation:
  language: sw
  text: Unajua[a] kwamba Yahweh atatetea shauri la mnyonge[b], na kutekeleza haki kwa ajili ya wahitaji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania cha Wamasoreti kina “Unajua.” Baadhi ya matoleo ya kale na watafsiri, kwa kuzingatia muktadha, husoma “Ninajua” au “Nimejua.”
    reason: textual_variant
  - marker: b
    text: Kihalisi, “atafanya shauri la mnyonge,” yaani, atachukua hatua kulisimamia au kulitetea shauri lake la kisheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: ידעת
  choice: Najua
  rationale: Ingawa umbo la konsonanti linaweza kusomwa kama nafsi ya pili ya kiume, muktadha wa hitimisho la zaburi na mapokeo ya usomaji yanaelekeza kwenye ungamo la mtunga-zaburi, ‘Najua.’ Wakati uliopo unaonyesha hali ya kuwa na uhakika.
- source_word: כִּי
  choice: kwamba
  rationale: Neno hili linaanzisha maudhui ya kile ambacho msemaji anakijua.
- source_word: יַעֲשֶׂה
  choice: atatetea / atawatendea
  rationale: Kitenzi hiki kimsingi ni ‘kufanya,’ lakini pamoja na דין na משפט kinamaanisha kuchukua hatua ili kusimamia shauri na kutekeleza haki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa na cheo.
- source_word: דִּין
  choice: shauri
  rationale: Katika muungano huu wa maneno, דין ni shauri au dai linalohitaji kutetewa mahakamani, si hukumu ya jumla tu.
- source_word: עָנִי
  choice: anayeteswa
  rationale: Katika muktadha wa zaburi hii kuhusu ukatili na uonevu, neno hili linamtaja mtu aliye katika mateso au chini ya uonevu, si maskini wa kiuchumi pekee.
- source_word: מִשְׁפַּט
  choice: haki
  rationale: Hapa neno linamaanisha uamuzi wa haki au haki inayotekelezwa kwa ajili ya wahitaji.
- source_word: אֶבְיוֹנִים
  choice: wahitaji
  rationale: Neno linawataja watu wenye uhitaji na walio dhaifu; ‘wahitaji’ huhifadhi maana hiyo bila kuiwekea mipaka ya umaskini wa mali tu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Matini inatumia moja kwa moja jina la agano יהוה; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Nafsi ya msemaji katika ידעת
  choice: Najua
  alternative: Unajua
  rationale: Usomaji ‘Najua’ unalifanya tamko hili kuwa ungamo la uhakika la mtunga-zaburi, kama muktadha wa hitimisho unavyoelekeza; hata hivyo, umbo la konsonanti huruhusu mvutano wa kimatini unaobainishwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Atatetea shauri’ huhifadhi taswira ya kisheria kwa lugha inayoeleweka, huku ‘atawatendea wahitaji haki’ ikiwasilisha kwa ufasaha ulinganifu wa mstari wa Kiebrania.
