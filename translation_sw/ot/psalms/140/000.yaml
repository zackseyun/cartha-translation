lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza muziki
  rationale: Katika vichwa vya zaburi, neno hili humaanisha mtu anayesimamia uimbaji au utendaji wa muziki. Kauli hii ni ya kawaida na inaeleweka katika Kiswahili cha sasa; kiambishi לַ kimetafsiriwa kwa maana ya ‘kwa’ katika muktadha huu.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ni jina la aina ya utungo wa kuimbwa, na ‘zaburi’ ndilo neno la Kiswahili lililozoeleka na sahihi katika muktadha huu.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Muundo wa Kiswahili ‘ya Daudi’ unadumisha kwa kiasi kinachowezekana upana wa uhusiano unaoweza kuonyeshwa na לְ, bila kulazimisha maana ya uandishi pekee.
theological_decisions:
- issue: Uhusiano wa Daudi na zaburi katika kichwa
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi; kwa ajili ya Daudi
  rationale: Kichwa cha Kiebrania hakilazimishi hitimisho kwamba Daudi ndiye mwandishi. ‘Ya Daudi’ huhifadhi uwezekano wa uandishi, uhusiano, umilikaji, au wakfu bila kuamua zaidi ya maandishi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya ‘Daudi,’ kwa kuwa tanbihi inaeleza maana ya לְדָוִד.
