  text: אַל תִּתֵּ֣ן יְ֭הוָה מַאֲוַיֵּ֣י רָשָׁ֑ע זְמָמ֥/וֹ אַל תָּ֝פֵ֗ק יָר֥וּמוּ סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/008.yaml
  text: O Yahweh[a], do not grant the desires of the wicked; do not advance his scheme, lest they be exalted[b]. Selah
translation:
  language: sw
  text: Ee Yahweh, usimpe mwovu matamanio yake; usiendeleze hila yake, wasije wakainuliwa.[a] Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usiifanikishe hila yake.” Kitenzi cha Kiebrania katika kishazi hiki ni kigumu; kinaweza kumaanisha kutoiendeleza au kutoifanya hila yake itimie. Kitenzi “wakainuliwa” ni cha wingi, ingawa “mwovu” na “hila yake” ni vya umoja.
    reason: lexical_alternative_and_number_tension
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina la kibinafsi katika maandishi ya Kiebrania.
- source_word: מַאֲוַיֵּי רָשָׁע
  choice: matamanio yake mwovu
  rationale: מַאֲוַיֵּי hurejelea tamaa au matamanio; muundo huu unahifadhi umoja wa רָשָׁע na unasikika kwa kawaida katika Kiswahili.
- source_word: זְמָמוֹ
  choice: hila yake
  rationale: Neno hili ni mpango wenye nia mbaya; ‘hila’ huwasilisha uzito huo wa uovu kuliko ‘mpango’ lisiloegemea upande wowote.
- source_word: תָּפֵק
  choice: usiifanikishe
  rationale: Kitenzi hiki ni kigumu katika muktadha huu. Tafsiri hii inaeleza ombi kwamba Mungu asiwezeshe hila hiyo kufikia matokeo yake, bila kudai uhakika usiokuwapo kuhusu maana mahsusi.
- source_word: יָרֻמוּ
  choice: wasije wakainuliwa
  rationale: Umbo la Kimasora ni la wingi. Wingi umehifadhiwa licha ya marejeo ya awali kuwa katika umoja, ili kutosawazisha mvutano wa maandishi.
- source_word: סֶלָה
  choice: Sela
  rationale: Neno limenukuliwa kwa kuwa maana na kazi yake halisi hazina uhakika wa kutosha kutafsiriwa moja kwa moja.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: Yehova au BWANA
  rationale: Unukuzi wa jina la Mungu huhifadhi jina lililo katika chanzo badala ya kulibadilisha kuwa cheo.
- issue: Mabadiliko kutoka umoja katika ‘mwovu/hila yake’ hadi wingi katika יָרֻמוּ
  choice: 'Kuhifadhi wingi: ‘wasije wakainuliwa’'
  alternative: 'Kulainisha kuwa umoja: ‘asije akainuliwa’'
  rationale: Maandishi ya Kiebrania yana kitenzi cha wingi, ambacho huenda kinapanua rejeo kwa mwovu pamoja na washirika wake au waovu kwa ujumla. Tafsiri haipaswi kutatua kimya kimya mvutano huo.
- issue: Maana ya kitenzi kigumu תָּפֵק
  choice: usiifanikishe
  alternative: usiendeleze au usiutekeleze mpango wake
  rationale: Muktadha unaomba hila ya mwovu isipelekwe kwenye mafanikio, lakini maana mahsusi ya kitenzi ina utata; tanbihi inaonyesha uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ee’ linafaa kwa mwito wa kishairi; ‘mwovu’ huhifadhi umoja wa chanzo; na wingi usiotarajiwa katika kishazi cha mwisho umehifadhiwa. Kiashiria cha tanbihi kimewekwa baada ya kishazi kinachohitaji maelezo.
