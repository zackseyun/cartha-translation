id: PSA.140.5
reference: Psalms 140:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: טָֽמְנֽוּ גֵאִ֨ים פַּ֡ח לִ֗/י וַ/חֲבָלִ֗ים פָּ֣רְשׂוּ רֶ֭שֶׁת לְ/יַד מַעְגָּ֑ל מֹקְשִׁ֖ים שָֽׁתוּ לִ֣/י סֶֽלָה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/005.yaml
  text: The proud have hidden a trap for me[a], and with cords they have spread a net beside the path; they have set snares for me[c][b]. Selah
translation:
  language: sw
  text: Wenye kiburi wamenifichia mtego[a]; kwa kamba wametandaza wavu kando ya njia[b]; wameniwekea mitego. Sela[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wenye majivuno.”
    reason: lexical_alternative
  - marker: b
    text: Au, “karibu na njia” au “pembeni mwa kijia.”
    reason: lexical_alternative
  - marker: c
    text: “Sela” huenda ni alama ya kiliturujia au ya kimuziki; maana yake kamili haijulikani.
    reason: cultural_note
lexical_decisions:
- source_word: טָמְנוּ
  choice: wamenifichia
  rationale: Kitenzi kina maana ya kuficha au kuweka kwa siri; muundo huu wa Kiswahili unaonyesha kwamba mtego ulifichwa ili kumnasa msemaji.
- source_word: גֵאִים
  choice: wenye kiburi
  rationale: Huwataja watu wenye majivuno au kiburi bila kuongeza jinsia isiyotajwa wazi katika Kiebrania.
- source_word: פַּח
  choice: mtego
  rationale: Ni mtego wa kunasia mawindo; neno la kawaida na linaloeleweka katika Kiswahili cha sasa.
- source_word: וַחֲבָלִים
  choice: kwa kamba
  rationale: Kamba zinaeleweka hapa kama vifaa vilivyotumiwa kutandaza wavu; 'kwa' huwasilisha maana hiyo ya kifaa kwa kawaida.
- source_word: פָּרְשׂוּ רֶשֶׁת
  choice: wametandaza wavu
  rationale: Huhifadhi picha halisi ya wavu unaonyoshwa au kutandazwa ili kunasa.
- source_word: לְיַד מַעְגָּל
  choice: kando ya njia
  rationale: לְיַד ni 'kando ya/karibu na,' na מַעְגָּל ni njia au kijia; tafsiri hii huhifadhi mahali pa kuvizia bila kuufanya usemi kuwa mzito.
- source_word: מֹקְשִׁים
  choice: mitego
  rationale: Neno humaanisha vifaa vya kunasia; kurudia 'mitego' ni kwa kawaida katika Kiswahili na hudumisha uwanja wa picha ya uwindaji.
- source_word: שָׁתוּ
  choice: wameniwekea
  rationale: Kitenzi ni kuweka au kupanga; kiambishi cha yambwa huwasilisha לִי, yaani mitego imewekwa dhidi ya msemaji.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya istilahi hii haijulikani; kwa hiyo imenukuliwa kwa herufi za Kiswahili badala ya kutafsiriwa kwa kubahatisha.
theological_decisions: []
