  text: ימיטו עֲלֵי/הֶ֗ם גֶּֽחָ֫לִ֥ים בָּ/אֵ֥שׁ יַפִּלֵ֑/ם בְּ֝/מַהֲמֹר֗וֹת בַּֽל יָקֽוּמוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/010.yaml
  text: Let burning coals fall on them[a]; let him cast them into the fire, into deep pits[b], never to rise again.
translation:
  language: sw
  text: Makaa yanayowaka na yawaangukie[a]; na awaangushe motoni, katika mashimo yenye kina[b], wasiinuke tena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Makaa na yanese juu yao.” Kitenzi cha Kiebrania kinaweza kumaanisha kusababisha kitu kianguke au kinyeshe.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika vilindi” au “katika vilindi vya maji.” Neno la Kiebrania ni adimu, na maana yake kamili haina uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: ימיטו
  choice: na yawaangukie
  rationale: Hifili isiyokamilika ya nafsi ya tatu wingi ina nguvu ya ombi au laana katika muktadha. ‘Yawaangukie’ hudumisha maana ya kusababisha kuanguka bila kubainisha mtendaji.
- source_word: גֶּחָלִים
  choice: makaa yanayowaka
  rationale: Nomino hii humaanisha makaa au makaa yenye moto; kirai hiki kinaweka wazi taswira ya moto inayothibitishwa na muktadha.
- source_word: בָאֵשׁ יַפִּלֵם
  choice: na awaangushe motoni
  rationale: Kitenzi cha umoja cha Hifili kina maana ya kuwafanya waanguke. Kiswahili hiki hudumisha mtendaji wa umoja ambaye hatajwi wazi, na ‘motoni’ huwasilisha mwelekeo wa kutupwa ndani ya moto.
- source_word: בְּמַהֲמֹרוֹת
  choice: katika mashimo yenye kina
  rationale: Neno hili ni adimu na maana yake kamili haina uhakika. ‘Mashimo yenye kina’ huhifadhi picha ya mahali pa chini pa maangamizi bila kulazimisha maana ya vilindi vya maji.
- source_word: בַּל יָקוּמוּ
  choice: wasiinuke tena
  rationale: Kikanushi pamoja na קום huonyesha kutoinuka au kutosimama baada ya kuangushwa; ‘tena’ huwasilisha ukamilifu wa anguko kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Lugha ya kuomba hukumu na mtendaji asiyeelezwa wa kitenzi cha umoja
  choice: Kudumisha ombi la hukumu na kumwacha mtendaji wa umoja bila kutajwa wazi katika ‘awaangushe’.
  alternative: 'Kutaja Mungu wazi kuwa mtendaji, au kutumia ujenzi usio na mtendaji: ‘waangushwe’.'
  rationale: Kiebrania hubadilika kutoka kitenzi cha wingi hadi cha umoja, huenda kikidokeza mtendaji wa kimungu. Kutomtaja Mungu moja kwa moja huhifadhi sintaksia na mvutano wa maandishi bila kuongeza jina ambalo halipo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kutakia ‘na ...’ umechaguliwa ili kudumisha nguvu ya ombi la hukumu; msamiati umewekwa wazi kwa msomaji wa kawaida huku utata wa neno adimu ukihifadhiwa katika tanbihi.
