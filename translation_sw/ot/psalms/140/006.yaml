  text: Ninamwambia BWANA, “Wewe ndiwe Mungu wangu.” Ee BWANA, sikiliza sauti ya maombi yangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Ninamwambia
  rationale: Ingawa umbo la Kiebrania ni timilifu, katika muktadha huu linaweza kueleza tamko la sasa au la kawaida; wakati wa sasa unafuata maana ya mstari bila kulazimisha kuwa ni tukio la wakati uliopita pekee.
- source_word: אֵלִי אָתָּה
  choice: Wewe ndiwe Mungu wangu
  rationale: Muundo huu wa kawaida na wenye hadhi katika Kiswahili unasisitiza utambulisho kama ulivyo katika Kiebrania.
- source_word: הַאֲזִינָה
  choice: sikiliza
  rationale: Kitenzi kina maana ya kutega sikio au kusikiliza kwa makini; “sikiliza” ni ombi la moja kwa moja na la asili katika Kiswahili.
- source_word: ק֣וֹל תַּחֲנוּנָי
  choice: sauti ya maombi yangu
  rationale: Inahifadhi taswira ya “sauti” huku תַּחֲנוּנִים ikitafsiriwa kwa lugha ya kawaida kuwa maombi ya dhati ya kuomba fadhili.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: “BWANA” ni uwakilishi wa kawaida wa heshima katika Biblia za Kiswahili na unaendana na safu ya mashauriano; herufi kubwa zinaonyesha kuwa chanzo kina jina יהוה bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, rahisi kusomeka, na inadumisha mwito wa moja kwa moja wa zaburi.
