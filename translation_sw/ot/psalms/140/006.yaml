  source_fidelity: Tafsiri inawakilisha kwa uaminifu tamko la mwombaji kwa יהוה, ungamo “Wewe ndiwe Mungu wangu,” na ombi la kusikilizwa. “Ninamwambia” hufuata uamuzi wa audit ya Kiingereza wa wakati wa sasa (“I say”) na inawezekana katika muktadha wa tamko la sala, ingawa Kiebrania chenye qatal pia kinaweza kutafsiriwa “Nilimwambia.” “Sauti ya maombi yangu” huhifadhi קול na maana ya תחנונים kama dua/maombi ya kusihi.
