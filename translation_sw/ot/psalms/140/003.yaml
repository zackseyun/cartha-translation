translation:
  language: sw
  text: 'Wamenoa ulimi wao kama nyoka;

    sumu ya fira[a] iko chini ya midomo yao.

    Sela.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nyoka mwenye sumu” au “nyoka aina ya asp”; Kiebrania kinataja nyoka mwenye sumu, lakini spishi yake hasa haijulikani.
    reason: lexical_alternative
  - marker: b
    text: “Sela” huenda ni ishara ya kiliturujia au ya muziki; maana yake kamili haijulikani.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁנֲנוּ
  choice: wamenoa
  rationale: Kitenzi שׁנן katika muundo huu humaanisha kunoa. Tafsiri hii inadumisha sitiari ya kuufanya usemi uwe mkali na hatari.
- source_word: לְשׁוֹנָם
  choice: ulimi wao
  rationale: Kiebrania kina nomino ya umoja yenye kiambishi cha wingi. Kiswahili hiki kinahifadhi umoja wa kishairi, huku ‘wao’ ikirejelea kundi.
- source_word: כְּמוֹ נָחָשׁ
  choice: kama nyoka
  rationale: נָחָשׁ ni neno la kawaida kwa nyoka; ‘nyoka’ ni la asili na wazi katika Kiswahili cha sasa bila kuongeza maana nyingine.
- source_word: חֲמַת
  choice: sumu
  rationale: Ingawa neno hili linaweza kumaanisha ghadhabu, linapotumiwa kuhusu nyoka humaanisha sumu yake.
- source_word: עַכְשׁוּב
  choice: nyoka mwenye sumu
  rationale: Neno hilo hutaja nyoka mwenye sumu, lakini spishi hususa haijulikani. Tafsiri ya jumla huepuka uhakika usiokuwapo katika chanzo.
- source_word: תַּחַת שְׂפָתֵימוֹ
  choice: iko chini ya midomo yao
  rationale: Kishazi cha Kiebrania hakina kitenzi kilichoandikwa; ‘iko’ hukamilisha sentensi kwa Kiswahili, na ‘chini ya midomo yao’ huhifadhi picha ya usemi wenye madhara uliofichika.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya neno hili haijulikani; yaelekea ni ishara ya kiliturujia au muziki, hivyo limetoholewa badala ya kufasiriwa.
