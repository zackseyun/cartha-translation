  text: אַ֣ךְ צַ֭דִּיקִים יוֹד֣וּ לִ/שְׁמֶ֑/ךָ יֵשְׁב֥וּ יְ֝שָׁרִ֗ים אֶת פָּנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/013.yaml
  text: Surely the righteous will give thanks to your name[a]; the upright will dwell before your face.
translation:
  language: sw
  text: Hakika wenye haki watalishukuru jina lako; wanyofu watakaa mbele za uso wako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “mbele zako,” yaani, “katika uwepo wako.” Kiebrania: “mbele za uso wako.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Hakika
  rationale: Katika muktadha huu neno hili linasisitiza hitimisho la uhakika, si wazo la upekee la ‘tu’.
- source_word: צַדִּיקִים
  choice: wenye haki
  rationale: Kivumishi hiki cha wingi kimetumiwa kama nomino; ‘wenye haki’ ni Kiswahili cha kawaida kinachobeba maana ya uadilifu.
- source_word: יוֹדוּ
  choice: watalishukuru
  rationale: Hifili ya ידה katika Zaburi kwa kawaida hueleza kutoa shukrani; muundo huu pia unadumisha shukrani inayoelekezwa kwa jina la Mungu.
- source_word: לִשְׁמֶךָ
  choice: jina lako
  rationale: Kirai ‘watalishukuru jina lako’ kinahifadhi mkazo wa Kiebrania juu ya jina la Mungu, bila kukibadili kuwa sababu ya kushukuru.
- source_word: יֵשְׁבוּ
  choice: watakaa
  rationale: ‘Kukaa’ linaweza kumaanisha kuketi, kuishi, au kudumu; hivyo linahifadhi upana wa kitenzi cha Kiebrania katika muktadha wa uwepo wa Mungu.
- source_word: יְשָׁרִים
  choice: wanyofu
  rationale: Kivumishi cha wingi kimetumiwa kama nomino na kinaonyesha unyofu wa kimaadili.
- source_word: אֶת פָּנֶיךָ
  choice: mbele za uso wako
  rationale: Tafsiri hii inadumisha taswira halisi ya ‘uso’ wa Mungu na ukaribu unaoelezwa na maandishi ya Kiebrania.
theological_decisions:
- issue: Lugha ya kibinadamu kuhusu uwepo wa Mungu
  choice: mbele za uso wako
  alternative: mbele zako / katika uwepo wako
  rationale: Neno ‘uso’ limehifadhiwa ili kudumisha taswira ya kishairi na kitheolojia ya kuwa karibu na Mungu, bila kuifafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Watakaa’ ni cha kawaida na pia huhifadhi kwa kufaa uwezekano wa maana za kuketi, kuishi, au kudumu.
