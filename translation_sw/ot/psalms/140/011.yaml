base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/011.yaml
  text: A man of tongue will not be established in the land[c][b][a]; evil will hunt down a man of violence to thrustings.
translation:
  language: sw
  text: Mtu wa ulimi[a] hatathibitika katika nchi; uovu utamwinda mtu wa jeuri kwa misukumo ya mara kwa mara[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mchongezi.” Kiebrania ni “mtu wa ulimi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hadi aangushwe.” Neno la mwisho la Kiebrania ni adimu; huenda likamaanisha misukumo au maangamizi, na uhusiano wake sahihi na kitenzi si hakika.
    reason: lexical_alternative
  - marker: c
    text: Au, “mtu mwovu wa jeuri—na awindwe kwa misukumo ya mara kwa mara.”
    reason: previous_rendering
lexical_decisions:
- source_word: אִישׁ לָשׁוֹן
  choice: mtu wa ulimi
  rationale: Inahifadhi taswira fupi ya Kiebrania, huku tanbihi ikitoa maana ya kimuktadha ya mtu anayesingizia wengine.
- source_word: בַּל יִכּוֹן
  choice: hatathibitika
  rationale: Kitenzi cha Kiebrania katika Nifali kina maana ya kuwekwa imara au kudumu; umbo la wakati ujao linafaa kwa kauli hii ya kishairi.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: אֶרֶץ hapa yaelekea kutaja nchi au jamii inayokaliwa, si lazima dunia nzima.
- source_word: אִישׁ חָמָס
  choice: mtu wa jeuri
  rationale: Tafsiri hii inafuata kwa karibu muundo wa Kiebrania na kuonyesha mtu anayejulikana kwa ukatili au udhalimu.
- source_word: רָע
  choice: uovu
  rationale: 'Inachukuliwa kuwa nomino dhahania iliyofanywa kama mhusika wa kitendo: uovu wenyewe ndiye anayewinda.'
- source_word: יְצוּדֶנּוּ
  choice: utamwinda
  rationale: Mzizi צוד humaanisha kuwinda au kunasa; wakati ujao unaendeleza kauli ya mstari bila kulazimisha maana ya ombi.
- source_word: לְמַדְחֵפֹת
  choice: mpaka aangushwe
  rationale: Neno hili adimu la wingi linahusiana na kusukuma au kuangusha; tafsiri ya kawaida ya Kiswahili inaeleza mwelekeo wa kuwindwa kuelekea kuanguka, huku tanbihi ikihifadhi ugumu na uwezekano mwingine.
theological_decisions:
- issue: Je, רָע ni kivumishi cha 'mtu wa jeuri' au mhusika wa kitenzi?
  choice: uovu ni mhusika anayemwinda mtu wa jeuri
  alternative: mtu mwovu wa jeuri—na awindwe
  rationale: Mpangilio wa kishairi na kitenzi cha umoja vinaunga mkono kusoma אִישׁ חָמָס kama yule anayelengwa, na רָע kama mhusika aliyefanywa kama mtu, bila kuficha uwezekano mwingine katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. 'Mtu wa ulimi' imeachwa kwa makusudi ili kuhifadhi taswira ya asili; 'hatathibitika' na 'mtu wa jeuri' ni rasmi bila kuwa vya kizamani. Tanbihi zote zimewekewa viashirio katika matini kuu.
