  yaml_path: translation/ot/psalms/140/001.yaml
  text: Rescue me[a], O Yahweh, from the evil man; guard me from the violent man.
translation:
  language: sw
  text: 'Uniokoe[a], Ee Yahwe, kutoka kwa mtu mwovu;

    unilinde dhidi ya mtu wa jeuri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Uninasue.”
    reason: חלץ inaweza kumaanisha kunasua au kuokoa; njia zote mbili zinaonyesha ombi la kuondolewa katika hatari.
lexical_decisions:
- source_word: חַלְּצֵנִי
  choice: Uniokoe
  rationale: Kitenzi חלץ katika kauli ya Hifili hapa ni ombi la dharura la kunasuliwa au kuokolewa. “Uniokoe” ni Kiswahili cha kawaida na chenye uzito unaofaa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama “BWANA.” Umbo “Yahwe” ni la kawaida katika Kiswahili.
- source_word: מֵאָדָם רָע
  choice: kutoka kwa mtu mwovu
  rationale: אָדָם hapa ni mtu mmoja mwenye uovu, kama inavyoonyeshwa na mstari sambamba. “Mtu mwovu” ni la asili na haliongezi wazo la wanadamu wote.
- source_word: מֵאִישׁ חֲמָסִים
  choice: na mtu wa jeuri
  rationale: חֲמָסִים ni wingi wenye nguvu unaoeleza jeuri au ukatili. “Mtu wa jeuri” huhifadhi muundo na mkazo wa Kiebrania kwa Kiswahili kifupi cha kishairi.
- source_word: תִּנְצְרֵנִי
  choice: unilinde
  rationale: נצר humaanisha kulinda, kuhifadhi, au kutunza. “Unilinde” hutofautisha ulinzi unaoendelea na tendo la awali la kuokoa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nomino za umoja אָדָם na אִישׁ
  choice: mtu
  alternative: mwanadamu; mwanamume
  rationale: Katika muktadha huu nomino hizo humtaja adui mmoja. Kiswahili “mtu” huwasilisha umoja huo kwa kawaida bila kudai zaidi ya maandishi kuhusu jinsia ya kibiolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Kiingizi “Ee” kinaonyesha wito wa moja kwa moja, na mistari miwili inadumisha usambamba wa mashairi ya Kiebrania.
