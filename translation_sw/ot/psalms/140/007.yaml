base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/007.yaml
  text: O Yahweh[a], my Lord, the strength of my salvation, you have covered my head in the day of battle.
translation:
  language: sw
  text: Ee Yahweh, Bwana wangu, nguvu ya wokovu wangu, umefunika kichwa changu siku ya vita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika siku ya silaha.” Neno la Kiebrania linaweza kumaanisha silaha; hapa yaelekea linataja wakati wa mapigano yenye silaha.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוִה
  choice: Ee Yahweh
  rationale: Jina la agano limetafsiriwa kwa “Yahweh”; “Ee” linaonyesha kwamba mtunga zaburi anamwita Mungu moja kwa moja katika sala.
- source_word: אֲדֹנָי
  choice: Bwana wangu
  rationale: Umbo hili lina kiambishi cha nafsi ya kwanza umoja, hivyo “wangu”; pia limetofautishwa na jina Yahweh linalolitangulia.
- source_word: עֹז יְשׁוּעָתִי
  choice: nguvu ya wokovu wangu
  rationale: Tafsiri hii inadumisha uhusiano wa maneno ya Kiebrania na maana pana ya יְשׁוּעָה kama wokovu au ukombozi, bila kuibana iwe ushindi wa kijeshi pekee.
- source_word: סַכֹּתָה
  choice: umeufunika
  rationale: Kitenzi kinaweza kumaanisha kufunika, kukinga, au kuhifadhi. “Umeufunika” kinahifadhi taswira halisi ya kinga juu ya kichwa.
- source_word: לְרֹאשִׁי
  choice: kichwa changu
  rationale: Katika Kiswahili, baada ya “umefunika,” kauli hii inatoa maana ya moja kwa moja na ya kawaida ya kichwa kinachokingwa.
- source_word: בְּיוֹם נָשֶׁק
  choice: siku ya vita
  rationale: Ingawa נָשֶׁק inaweza kumaanisha silaha, kirai kizima kinaelekea kutaja wakati wa mapigano yenye silaha; “siku ya vita” ni wazi na ya kawaida kwa msomaji wa Kiswahili.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja. “Yahweh” linahifadhi jina hilo na pia linatofautisha יְהוָה na אֲדֹנָי (“Bwana wangu”) lililo karibu nalo.
- issue: Uhusiano wa עֹז na יְשׁוּעָתִי
  choice: nguvu ya wokovu wangu
  alternative: nguvu ya kuniokoa
  rationale: Muundo wenye nomino umehifadhiwa ili kutoamua kimyakimya kama Mungu ndiye nguvu inayosababisha wokovu au ndiye ngome ya mwombaji; tafsiri ya kitenzi ingefafanua zaidi kuliko maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Taswira ya kufunikwa kwa kichwa imehifadhiwa badala ya kubadilishwa moja kwa moja kuwa “kulindwa.” Alama ya tanbihi imewekwa baada ya “vita,” neno ambalo tanbihi inalifafanua.
