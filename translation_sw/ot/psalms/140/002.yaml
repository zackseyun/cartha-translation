  text: wanaopanga mambo maovu mioyoni mwao; kila siku huchochea vita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila siku hukusanyika kwa ajili ya vita,” au “kila siku huchochea migogoro.” Kitenzi cha Kiebrania יָגוּרוּ hapa ni kigumu, na muktadha unaruhusu tafsiri kadhaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: wanao-
  rationale: Kiambishi cha uhusiano kinaendeleza maelezo ya watu waovu waliotajwa katika muktadha uliotangulia.
- source_word: חָשְׁבוּ
  choice: wanapanga
  rationale: Kitenzi hapa kinaonyesha kukusudia na kupanga kwa makini, si kuwaza tu.
- source_word: רָעוֹת
  choice: mambo maovu
  rationale: Neno la wingi linamaanisha mambo, matendo, au mipango yenye uovu; tafsiri hii ni wazi na inadumisha wingi.
- source_word: בְּלֵב
  choice: mioyoni mwao
  rationale: ‘Moyo’ katika Kiebrania ni kitovu cha mawazo na makusudi. Wingi wa Kiswahili unapatana kwa kawaida na kundi la watu bila kugeuza neno hilo kuwa ‘akili.’
- source_word: כָּל יוֹם
  choice: kutwa nzima
  rationale: Usemi huu unaonyesha shughuli inayoendelea siku nzima; ‘kutwa nzima’ ni Kiswahili cha kawaida chenye uzito wa kishairi.
- source_word: יָגוּרוּ
  choice: huchochea
  rationale: Kitenzi hiki ni kigumu katika muktadha huu. Sambamba na kupanga maovu na kikiwa na ‘vita’ kama yambwa, maana ya kuchochea au kuanzisha mapambano inafaa vizuri, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: מִלְחָמוֹת
  choice: vita
  rationale: Neno hili linamaanisha vita au mapigano. ‘Vita’ ni la kawaida na linaweza kuwasilisha wingi wa Kiebrania kwa kawaida katika Kiswahili.
