  text: As for the head of those who surround me[b][a], let the trouble of their lips cover them.
translation:
  language: sw
  text: Kuhusu kichwa cha wale wanaonizunguka[a]—madhara ya midomo yao[b] yawafunike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Vichwa vya wale wanaonizunguka vifunikwe na ubaya wa midomo yao.” Kiebrania ni kifupi; wengine huelewa “kichwa” kuwa neno la kijumla au hulielewa kwa maana ya wingi.
    reason: alternative_reading
  - marker: b
    text: “Madhara” pia yanaweza kutafsiriwa “taabu” au “ubaya,” yaani, uovu unaotokana na maneno yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: kichwa
  rationale: Neno hili kimsingi humaanisha “kichwa.” Taswira hiyo halisi imehifadhiwa, ingawa katika sentensi hii linaweza kutumiwa kwa maana ya kijumla kuhusu kundi lote.
- source_word: מְסִבָּי
  choice: wale wanaonizunguka
  rationale: Kauli hii inatokana na mzizi סבב na ina kiambishi cha nafsi ya kwanza umoja. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha picha ya watu waliomzingira mtunga zaburi bila kuongeza wazo maalumu la kuzingirwa kijeshi.
- source_word: עֲמַל
  choice: madhara
  rationale: Neno hili linaweza kumaanisha taabu, ubaya, au madhara. Linapohusishwa na midomo yao, hapa linaelekea kutaja ubaya au madhara yanayotokana na maneno yao; “madhara” ni ya asili katika Kiswahili na inadumisha maana hiyo pana.
- source_word: שְׂפָתֵימוֹ
  choice: midomo yao
  rationale: Tafsiri halisi ni “midomo yao.” Taswira ya kiungo cha mwili imehifadhiwa badala ya kuibadili kuwa “maneno yao” au “usemi wao.”
- source_word: יכסומו
  choice: na yawafunike
  rationale: Kitenzi כסה humaanisha “funika.” Muundo wa “na yawafunike” unaonyesha ombi au laana ya sala inayolingana na muktadha, huku ukidumisha picha ya kufunikwa.
theological_decisions:
- issue: Muundo wa kishazi na ombi la hukumu lililodokezwa
  choice: 'Mstari umetafsiriwa kama ombi: “Kichwa cha wale wanaonizunguka—madhara ya midomo yao na yawafunike.”'
  alternative: 'Inawezekana kuelewa “kichwa” kwa maana ya kijumla na kutafsiri: “Vichwa vya wale wanaonizunguka na vifunikwe na ubaya wa midomo yao”; au kuelewa kitenzi kama taarifa: “Madhara ya midomo yao yatawafunika.”'
  rationale: Kiebrania ni kifupi na kina muundo wenye utata. Muktadha wa maombi ya hukumu unaunga mkono maana ya ombi, lakini umoja wa “kichwa” katika maandishi ya konsonanti umehifadhiwa badala ya kubadilishwa kimya kuwa wingi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mstari umebaki mfupi na wenye taswira halisi za “kichwa,” “midomo,” na “kufunika,” huku alama ya mkato ikisaidia kuonyesha muundo mfupi wa Kiebrania bila kuondoa utata wake.
