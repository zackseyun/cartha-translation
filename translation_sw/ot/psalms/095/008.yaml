base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/008.yaml
  text: Do not harden your hearts as at Meribah[d][c][b][a], as on the day at Massah in the wilderness.
translation:
  language: sw
  text: Msiifanye mioyo yenu migumu kama Meriba,[a] kama siku ya Masa jangwani.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Meriba maana yake ni “ugomvi” au “mabishano.”
    reason: lexical_alternative
  - marker: b
    text: Masa maana yake ni “kupima.”
    reason: lexical_alternative
  - marker: c
    text: Tazama Kutoka 17:7 na Hesabu 20:13 kuhusu matukio ya jangwani yanayodokezwa hapa.
    reason: cross_reference
lexical_decisions:
- source_word: אַל תַּקְשׁוּ
  choice: Msiifanye ... kuwa migumu
  rationale: 'Kikanushi אַל pamoja na kitenzi cha Hifili kinatoa katazo: wasifanye mioyo yao kuwa migumu. Muundo huu ni wa kawaida na wazi katika Kiswahili.'
- source_word: לְבַבְכֶם
  choice: mioyo yenu
  rationale: Ingawa nomino ya Kiebrania iko katika umoja ikiwa na kiambishi cha nafsi ya pili wingi, Kiswahili hutumia wingi kwa kawaida kwa mioyo ya kundi linalosemeshwa.
- source_word: כִּמְרִיבָה
  choice: kama kule Meriba
  rationale: Meriba limetunzwa kama jina la mahali linalorejelea tukio la jangwani; 'kule' hufanya ulinganisho wa mahali usikike kwa kawaida.
- source_word: כְּיוֹם מַסָּה
  choice: kama siku ile huko Masa
  rationale: Muundo huu unalinganisha na siku ya tukio la kihistoria la Masa. 'Siku ile huko Masa' ni Kiswahili cha kawaida na hakilazimishi uhusiano wa kimilikishi usio wazi.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: Neno hili linaonyesha eneo lisilolimwa ambako tukio la kutoka Misri lilitokea; 'jangwani' ni tafsiri ya kawaida na yenye kueleweka.
theological_decisions:
- issue: Iwapo מְרִיבָה na מַסָּה yatafsiriwe kama nomino za kawaida au majina ya kihistoria
  choice: 'Yametafsiriwa kama majina ya mahali: Meriba na Masa.'
  alternative: “kama wakati wa ugomvi, kama siku ya kujaribu jangwani”
  rationale: Muktadha unadokeza matukio maalumu ya jangwani. Kuhifadhi majina kunaendeleza uhusiano na simulizi husika bila kuficha maana zake za kileksika, ambazo zimeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa katazo ni wa moja kwa moja; majina Meriba na Masa yamehifadhiwa, huku maana zake zikielezwa katika tanbihi.
