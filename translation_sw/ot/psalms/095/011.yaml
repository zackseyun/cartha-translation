    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: Kwa hiyo
  rationale: Katika muktadha huu neno hili linaunganisha kauli na yaliyotangulia kwa kuonyesha matokeo; ‘Kwa hiyo’ ni Kiswahili cha kawaida na wazi.
- source_word: נִשְׁבַּעְתִּי
  choice: niliapa
  rationale: Nifali ya שבע hapa humaanisha kuapa au kufanya kiapo; ‘niliapa’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: בְאַפִּי
  choice: katika hasira yangu
  rationale: אַף kwa asili huhusiana na pua, lakini hapa ni nahau ya hasira; tafsiri hii inatoa maana yake wazi bila kutumia lugha nzito isiyo ya lazima.
- source_word: אִם
  choice: Hawataingia
  rationale: Baada ya kiapo, אִם ni sehemu ya kanuni ya kiapo iliyofupishwa ambayo ina maana ya kukataa kwa nguvu; Kiswahili kinahitaji ukanushi huo kusemwa wazi.
- source_word: יְבֹאוּן אֶל
  choice: wataingia katika
  rationale: Kitenzi בוא pamoja na אֶל hapa kinaeleza kuingia ndani; muundo huu ni wa asili katika Kiswahili.
- source_word: מְנוּחָתִי
  choice: pumziko langu
  rationale: מְנוּחָה linaweza kumaanisha hali ya kupumzika au mahali pa kupumzikia. ‘Pumziko langu’ huhifadhi ufupi na upana huo wa maana.
theological_decisions:
- issue: Kanuni ya kiapo iliyofupishwa yenye אִם
  choice: 'Ukanushi umewekwa wazi: ‘Hawataingia.’'
  alternative: 'Tafsiri halisi lakini isiyo wazi: ‘ikiwa wataingia.’'
  rationale: Katika Kiebrania, אִם baada ya kiapo huonyesha ukanushi mkali. Kuweka ukanushi wazi kunawasilisha nguvu ya kisarufi ya kauli bila kuongeza hitimisho la kimadhehebu.
- issue: Maana ya מְנוּחָה
  choice: pumziko langu
  alternative: mahali pangu pa kupumzikia
  rationale: Neno linaweza kuelekeza kwenye hali ya pumziko au mahali pa pumziko. ‘Pumziko langu’ halifungi maana katika upande mmoja na hivyo huhifadhi mvutano wa kimaana wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya wazi; ‘pumziko’ limechaguliwa ili kuhifadhi uwezekano wa maana ya hali na mahali.
