translation:
  language: sw
  text: Kwa hiyo niliapa katika hasira yangu, “Hawataingia[a] katika pumziko langu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “ikiwa wataingia katika pumziko langu”—usemi wa kiapo wenye maana ya “hawataingia katika pumziko langu.”
    reason: lexical_alternative
