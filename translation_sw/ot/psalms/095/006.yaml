lexical_decisions:
- source_word: בֹּאוּ
  choice: Njooni
  rationale: Amri ya wingi inayolialika kusanyiko; “Njooni” ni mwito wa kawaida na wenye hadhi katika Kiswahili.
- source_word: נִשְׁתַּחֲוֶה
  choice: tuabudu kwa kuinama
  rationale: Kitenzi kinaonyesha kusujudu au kuinama chini mbele ya aliye mkuu, hasa katika ibada; usemi huu unahifadhi tendo la mwili na maana ya ibada.
- source_word: וְנִכְרָעָה
  choice: na kupiga magoti
  rationale: Kitenzi hiki huonyesha kupiga magoti au kujikunja chini; “kupiga magoti” ni tafsiri ya asili na iliyo wazi.
- source_word: נִבְרְכָה
  choice: na tupige magoti
  rationale: Katika muktadha huu mzizi ברך unaweza kueleweka kuwa kupiga magoti, ukilingana na mfululizo wa matendo ya mwili; hilo pia huepuka Kiswahili kisicho cha kawaida cha “kumbariki Mungu.”
- source_word: לִפְנֵי
  choice: mbele za
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kuwa katika uwepo wa mtu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetoholewa moja kwa moja kwa tahajia ya Kiswahili badala ya kubadilishwa na cheo.
- source_word: עֹשֵׂנוּ
  choice: Muumba wetu
  rationale: Kirai hiki humaanisha ‘aliyetuumba’ au ‘Muumba wetu’; chaguo hili ni fupi, la kawaida, na huhifadhi mkazo wa uumbaji.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu; “Yahwe” hulihifadhi badala ya kuliwakilisha kwa cheo.
- issue: Maana ya נִבְרְכָה katika muktadha
  choice: na tupige magoti
  alternative: na tumbariki
  rationale: Ingawa mzizi ברך mara nyingi humaanisha ‘bariki,’ umbo hili katika muktadha wa kuinama na kupiga magoti linaweza kuhusishwa na kupiga magoti; tafsiri kuu imefuata mshikamano wa kimuktadha huku tanbihi ikihifadhi uwezekano wa ‘bariki.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa mwito wa pamoja wa ibada. Lugha ni ya sasa na yenye hadhi; “Yahwe” limetumiwa kwa tahajia inayofaa Kiswahili.
