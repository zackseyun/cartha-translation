  text: Njooni, tumwimbie Yahweh kwa shangwe; tumshangilie Mwamba wa wokovu wetu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכוּ
  choice: Njooni
  rationale: Amri ya wingi ya הלך imetumiwa hapa kama mwaliko au wito wa pamoja; “Njooni” ni Kiswahili cha kawaida kinachowasilisha nguvu hiyo vizuri kuliko tafsiri halisi “Nendeni.”
- source_word: נְרַנְּנָה
  choice: tumwimbie ... kwa furaha
  rationale: Kauli ya kuhimiza ya רנן inaeleza sifa ya sauti yenye shangwe; “tumwimbie ... kwa furaha” huhifadhi wazo la kuimba na la kufurahi.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Herufi nne za jina la Mungu יְהוָה zimetoholewa kama “Yahweh,” huku kiambishi cha yambwa “-mw-” katika kitenzi kikionyesha kuwa yeye ndiye anayeimbiwa.
- source_word: נָרִיעָה
  choice: tumpigie kelele
  rationale: Kauli ya kuhimiza ya רוע/ריע katika Hifili humaanisha kutoa kilio au kelele kubwa, hasa ya ushindi au ibada; “tumpigie kelele” ni ya kawaida na haiingizi neno “furaha” lisilomo wazi katika kitenzi hiki.
- source_word: לְצוּר
  choice: Mwamba
  rationale: צוּר ni “mwamba” na hapa ni sitiari ya Mungu kama mwenye uthabiti, nguvu na ulinzi; herufi kubwa inaonyesha matumizi yake kama lakabu ya kimungu.
- source_word: יִשְׁעֵנוּ
  choice: wa wokovu wetu
  rationale: Nomino יֵשַׁע yenye kiambishi cha nafsi ya kwanza wingi imehifadhiwa katika muundo wa nomino, “wokovu wetu,” bila kuibana maana kuwa tendo moja tu la kuokoa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina la agano יְהוָה; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi inayofaa zaburi. Vitenzi vya wingi “Njooni,” “tumwimbie,” na “tumpigie” vinadumisha mwaliko wa jumuiya. Hakuna tanbihi iliyohitajika.
