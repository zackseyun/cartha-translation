base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/007.yaml
  text: For he is our God[a], and we are the people of his pasture, and the sheep of his hand. Today, if you hear his voice—
translation:
  language: sw
  text: 'Kwa maana yeye ndiye Mungu wetu,

    nasi ni watu wa malisho yake,

    na kondoo wa mkono wake.

    Leo, kama mkisikia sauti yake—[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Leo, laiti mngesikia sauti yake!” Chembe ya Kiebrania inaweza kueleweka kama inaanzisha himizo lenye nguvu ya tamanio, badala ya sharti la kawaida.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Hutoa sababu ya mwito wa kuabudu uliotangulia; ni kiunganishi cha kawaida na cha heshima katika Kiswahili.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Huhifadhi kwa uwazi nafsi ya kwanza wingi na uhusiano unaoelezwa na kiambishi cha Kiebrania.
- source_word: עַם מַרְעִיתוֹ
  choice: watu wa malisho yake
  rationale: Huhifadhi taswira halisi ya uchungaji na ulinganifu wake na kondoo katika mstari unaofuata.
- source_word: צֹאן יָדוֹ
  choice: kondoo walio mkononi mwake
  rationale: Ni Kiswahili cha kawaida kinachohifadhi taswira ya mkono wa Mungu na kudokeza umiliki, uongozi na ulinzi bila kuyaongeza wazi katika matini.
- source_word: הַיּוֹם
  choice: Leo
  rationale: Huhifadhi mkazo wa wakati na hutumika kama daraja la balagha kuelekea onyo linalofuata.
- source_word: אִם
  choice: kama
  rationale: Hutoa maana ya sharti inayofungua himizo la mstari unaofuata, huku maana mbadala ya kutamani ikihifadhiwa katika tanbihi.
- source_word: בְּקֹלוֹ תִשְׁמָעוּ
  choice: mtaisikia sauti yake
  rationale: Huhifadhi maana ya msingi ya kusikia na kuacha wazo la kusikiliza kwa utiifu litokane na muktadha badala ya kuingizwa moja kwa moja.
theological_decisions:
- issue: Nguvu ya kishazi הַיּוֹם אִם בְּקֹלוֹ תִשְׁמָעוּ
  choice: 'Kimetafsiriwa kama mwanzo wa sharti lenye himizo: “Leo, kama mtaisikia sauti yake—”'
  alternative: 'Kinaweza kueleweka kama tamanio au himizo la moja kwa moja: “Leo, laiti mngeisikia sauti yake!”'
  rationale: אִם linaweza kuanzisha sharti, lakini katika ushairi wa Kiebrania linaweza pia kuwa na nguvu ya tamanio. Muundo wa sharti unaunganika kwa kawaida na onyo la mstari unaofuata; tanbihi inahifadhi uwezekano mwingine bila kuondoa mvutano wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa urahisi. Mistari imepangwa ili kuhifadhi ulinganifu wa kishairi na taswira ya mchungaji. Alama ya mkato mwishoni inaonyesha kuwa sentensi na onyo vinaendelea katika mstari unaofuata.
