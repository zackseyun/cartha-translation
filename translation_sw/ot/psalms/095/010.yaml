source:
  edition: WLC
  text: אַרְבָּ֘עִ֤ים שָׁנָ֨ה אָ֘ק֤וּט בְּ/ד֗וֹר וָ/אֹמַ֗ר עַ֤ם תֹּעֵ֣י לֵבָ֣ב הֵ֑ם וְ֝/הֵ֗ם לֹא יָדְע֥וּ דְרָכָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/010.yaml
  text: For forty years I loathed that generation[a], and said, “They are a people who go astray in heart, and they have not known my ways.”
translation:
  language: sw
  text: Kwa miaka arobaini nilichukizwa na kizazi kile[a], nikasema, “Hao ni watu wanaopotoka mioyoni mwao, nao hawajazijua njia zangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nilihuzunishwa na kizazi kile,” au “nilichoshwa na kizazi kile.” Kitenzi cha Kiebrania kinaweza kuonyesha kuchukizwa, kuchoshwa au kuhuzunishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעִים שָׁנָה
  choice: Kwa miaka arobaini
  rationale: Kirai hiki kinaonyesha muda ambao hali hiyo iliendelea; ‘kwa miaka arobaini’ ni Kiswahili cha kawaida na wazi.
- source_word: אָקוּט
  choice: nilichukizwa na
  rationale: Kitenzi קוט kinaweza kuonyesha kuchukizwa, kuchoshwa au kuhuzunishwa. ‘Nilichukizwa na’ kinahifadhi uzito wa kutopendezwa kwa Mungu bila kudai chuki kwa maana ambayo neno hilo si lazima liwe nayo.
- source_word: בְּדוֹר
  choice: kizazi kile
  rationale: בְּ pamoja na דור hapa hutaja walengwa wa hisia hiyo. ‘Kizazi kile’ kinarejelea kwa kawaida kizazi cha jangwani kinachozungumziwa katika muktadha.
- source_word: עַם
  choice: watu
  rationale: Nomino hii ya pamoja inaeleza kundi la watu. Katika Kiswahili, ‘hao ni watu’ ni ya asili kuliko ‘hao ni taifa’ katika hukumu hii.
- source_word: תֹּעֵי לֵבָב
  choice: wanaopotoka mioyoni mwao
  rationale: Kivumishi-tendo תֹּעֵי kinaonyesha hali au mwenendo unaoendelea wa kupotoka, huku לֵבָב ikitaja utu wa ndani. Wingi ‘mioyoni mwao’ unapatana kwa asili na ‘watu’ bila kuondoa maana ya Kiebrania.
- source_word: לֹא יָדְעוּ דְרָכָי
  choice: hawajazijua njia zangu
  rationale: ‘Kujua’ huhifadhi maana ya msingi ya ידע, na ‘hawajazijua’ huonyesha kushindwa kwao kulikodumu na ambako matokeo yake bado yanahusika katika hukumu hiyo.
- source_word: וָאֹמַר
  choice: nikasema
  rationale: Muundo wa ‘nika-’ unaonyesha kwa kawaida mfuatano wa tendo na kauli bila kuongeza uhusiano wa kisababishi usioelezwa wazi.
theological_decisions:
- issue: Mtazamo wa Mungu unaoelezwa na קוט
  choice: 'Usemi wenye nguvu wa kuchukizwa: ‘nilichukizwa na’'
  alternative: ‘nilihuzunishwa na’ au ‘nilichoshwa na’
  rationale: Kiebrania kinaruhusu kuchukizwa, kuchoshwa au kuhuzunishwa. Matini kuu inahifadhi nguvu ya kutopendezwa kwa Mungu katika muktadha wa uasi wa kudumu, huku tanbihi ikihifadhi maana nyingine halisi.
- issue: Hali ya לֹא יָדְעוּ דְרָכָי
  choice: 'Kushindwa kulikodumu: ‘hawajazijua njia zangu’'
  alternative: 'Wakati uliopita sahili: ‘hawakuzijua njia zangu’'
  rationale: Wakati timilifu wa Kiswahili unaonyesha kwamba kutokujua huko ni tathmini ya hali iliyojengeka, bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Hao ni watu’ na ‘mioyoni mwao’ zimetumiwa kwa mtiririko wa kawaida; taswira za ‘kupotoka’ na ‘njia’ zimehifadhiwa.
