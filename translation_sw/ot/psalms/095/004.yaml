  text: in whose hand are the depths of the earth[b][a], and the heights of the mountains are his.
translation:
  language: sw
  text: Ambaye vilindi vya dunia vimo mkononi mwake,[a] na vilele vya milima ni vyake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu za ndani kabisa za dunia.”
    reason: lexical_alternative
  - marker: b
    text: Au, “sehemu za juu za milima ni zake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: Ambaye mkononi mwake
  rationale: Muundo huu unaunganisha kishazi cha uhusiano na Bwana aliyetajwa katika mstari uliotangulia, huku ukihifadhi taswira halisi ya kuwa 'mkononi' kama ishara ya milki na mamlaka.
- source_word: מֶחְקְרֵי אָרֶץ
  choice: vilindi vya dunia
  rationale: Neno מֶחְקְרֵי linaashiria sehemu za kina, zilizofichika au zisizofikika kwa urahisi. 'Vilindi vya dunia' ni usemi wa kawaida wa kishairi na unadumisha ulinganifu na vilele vya milima.
- source_word: וְתוֹעֲפוֹת הָרִים
  choice: na vilele vya milima
  rationale: תוֹעֲפוֹת hapa linaelekea kumaanisha sehemu zilizoinuka sana au vilele. 'Vilele' ni ya asili katika Kiswahili na inaonyesha wazi ukinzani wa kishairi kati ya vilindi na sehemu za juu.
- source_word: לוֹ
  choice: ni vyake
  rationale: Tafsiri fupi ya umilikaji inadumisha mkazo na ufupi wa Kiebrania; pia inapatana kisarufi na 'vilele'.
theological_decisions:
- issue: Upeo wa umiliki wa Mungu katika taswira ya uumbaji
  choice: Kauli ya ulimwengu mzima kwamba vilindi vya dunia na vilele vya milima viko katika milki ya Bwana
  alternative: Rejeo finyu kwa nchi ya Israeli na maumbile yake
  rationale: Muktadha wa mwaliko mpana wa kumwabudu Bwana, pamoja na ulinganifu wa vilindi na vilele, unaonyesha mamlaka yake juu ya uumbaji wote bila kuingiza fundisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya mkono na ulinganifu wa vilindi na vilele zimehifadhiwa.
