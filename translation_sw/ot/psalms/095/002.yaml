  yaml_path: translation/ot/psalms/095/002.yaml
  text: Let us come before his face with thanksgiving[a]; let us shout joyfully to him with songs.
translation:
  language: sw
  text: 'Na tuje mbele ya uso wake kwa shukrani;[a]

    na tumshangilie kwa nyimbo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbele zake.” Kwa maana halisi, “uso wake.” Katika Kiebrania, “uso wake” mara nyingi ni nahau inayomaanisha uwepo wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְקַדְּמָה
  choice: Na tuje mbele za
  rationale: Kauli ya kuhimiza katika nafsi ya kwanza wingi ina maana ya kumkaribia au kuja mbele ya mtu; muundo huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: פָנָיו
  choice: uso wake
  rationale: Tafsiri halisi ni ‘uso wake,’ na kwa Kiebrania ni nahau inayoweza kumaanisha kuwapo kwake. Picha halisi imehifadhiwa huku maana ya kinahau ikielezwa katika tanbihi.
- source_word: בְּתוֹדָה
  choice: kwa shukrani
  rationale: Katika muktadha huu neno linaonyesha tendo au mtazamo wa kushukuru, sambamba na sifa za muziki, badala ya sadaka ya shukrani.
- source_word: בִּזְמִרוֹת
  choice: kwa nyimbo
  rationale: Neno linarejelea nyimbo au tenzi za muziki, mara nyingi za sifa. ‘Nyimbo’ ni pana, ya kawaida, na inafaa hapa.
- source_word: נָרִיעַ
  choice: na tumshangilie
  rationale: Kitenzi hiki ni kauli ya kuhimiza inayomaanisha kutoa sauti au kilio cha shangwe. ‘Tumshangilie’ huwasilisha kwa asili tendo la sauti na furaha yake.
- source_word: לוֹ
  choice: -m- katika ‘tumshangilie’
  rationale: Kiambishi cha yambwa ‘-m-’ kinaonyesha kwamba shangwe hiyo inaelekezwa kwake, kwa namna ya kawaida katika Kiswahili.
