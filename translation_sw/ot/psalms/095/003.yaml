  text: For Yahweh is a great God[a], and a great King above all gods.
translation:
  language: sw
  text: 'Kwa maana Yahwe ni Mungu mkuu,

    na mfalme mkuu juu ya miungu yote.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “viumbe wa kiungu.” Neno la Kiebrania אֱלֹהִים (elohim) linaweza kumaanisha miungu, viumbe wa kiungu, au viumbe wa mbinguni kulingana na muktadha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza mwito uliotangulia kwa kutoa sababu ya kumwabudu Yahwe, huku ikihifadhi nguvu ya kisababishi ya Kiebrania.
- source_word: אֵל
  choice: Mungu
  rationale: Hapa neno hili linamtaja Yahwe moja kwa moja kuwa Mungu; herufi kubwa inafaa kwa jina la cheo linalomhusu Mungu wa Israeli.
- source_word: גָּדוֹל
  choice: mkuu
  rationale: Neno hili linaonyesha ukuu na cheo kilichoinuliwa; kurudiwa kwake katika mistari yote miwili kunahifadhi usambamba wa Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye konsonanti YHWH limetafsiriwa kwa umbo la Kiswahili ‘Yahwe,’ badala ya kubadilishwa na cheo kama ‘BWANA.’
- source_word: וּמֶלֶךְ
  choice: na Mfalme
  rationale: Kiunganishi kinaongeza kauli ya pili inayomhusu Yahwe. ‘Mfalme’ linaandikwa kwa herufi kubwa kwa kuwa hapa ni cheo chake.
- source_word: עַל
  choice: juu ya
  rationale: Katika muktadha huu linaonyesha ukuu na mamlaka ya Yahwe dhidi ya wote wanaoitwa miungu.
- source_word: כָּל אֱלֹהִים
  choice: miungu yote
  rationale: Tafsiri hii inahifadhi usemi na mvutano wa Kiebrania bila kuamua kimyakimya kama wanaorejelewa ni sanamu, miungu ya uongo, au viumbe wa kiroho.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha na cheo.
- issue: Maana ya אֱלֹהִים katika usemi ‘juu ya miungu yote’
  choice: miungu yote
  alternative: viumbe wote wa kiungu; viumbe wote wa mbinguni
  rationale: ‘Miungu’ huhifadhi usemi wa Kiebrania na uzito wake wa kitheolojia bila kuamua ikiwa unamaanisha miungu ya uongo, sanamu, au viumbe halisi wa kiroho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa mistari miwili unahifadhi usambamba wa kishairi, na ‘mkuu’ limerudiwa kama katika Kiebrania.
