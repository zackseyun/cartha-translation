  yaml_path: translation/ot/psalms/095/009.yaml
  text: where your fathers tested me and tried me[b][a], though they had seen my work.
translation:
  language: sw
  text: ambapo baba zenu walinijaribu na kunipima,[a][b] ingawa walikuwa wameiona kazi yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambapo baba zenu walinijaribu; walinipima na pia wakaiona kazi yangu.” Kiebrania kinaweza kutafsiriwa kwa namna hii ya moja kwa moja zaidi, lakini tafsiri kuu inaonyesha maana inayowezekana ya kukinzana katika kishazi hiki.
    reason: lexical_alternative
  - marker: b
    text: Au, “walinijaribu; walinipima.”
    reason: previous_rendering
lexical_decisions:
- source_word: אֲשֶׁר
  choice: ambapo
  rationale: Kihusishi hiki kinarejelea mahali palipotajwa katika mstari uliotangulia, hivyo ‘ambapo’ kinaendeleza vizuri maana ya mahali.
- source_word: נִסּוּנִי
  choice: walinijaribu
  rationale: Kitenzi נסה humaanisha kujaribu au kuweka kwenye jaribio; hapa kinaonyesha kwamba mababu walimweka Mungu kwenye jaribio.
- source_word: אֲבוֹתֵיכֶם
  choice: baba zenu
  rationale: Hili ndilo neno la moja kwa moja la Kiebrania, nalo linadumisha namna ya hotuba ya agano kwa kizazi kinachoambiwa.
- source_word: בְּחָנוּנִי
  choice: kunipima
  rationale: בחן lina wazo la kuchunguza au kupima ili kuthibitisha. ‘Kunipima’ linatofautisha kitenzi hiki na נסה huku likihifadhi ulinganifu wake.
- source_word: גַּם
  choice: ingawa
  rationale: 'Ingawa גַּם kwa kawaida humaanisha ‘pia’ au ‘hata,’ muktadha unaelekea kuonyesha hali ya kukinzana: walimjaribu Mungu licha ya kuwa wameiona kazi yake.'
- source_word: רָאוּ
  choice: walikuwa wameiona
  rationale: Muundo huu unaonyesha kwamba kuona kwao kazi ya Mungu kulitangulia au tayari kulikuwa kumetokea walipomjaribu.
- source_word: פָעֳלִי
  choice: kazi yangu
  rationale: פעל ni kazi, tendo, au shughuli; umoja ‘kazi yangu’ unafuata kwa karibu neno la Kiebrania na unaweza kujumuisha matendo makuu ya Mungu.
theological_decisions:
- issue: Maana ya kukinzana katika kishazi cha mwisho
  choice: ingawa walikuwa wameiona kazi yangu
  alternative: pia waliiona kazi yangu
  rationale: Tafsiri kuu inaonyesha uwezekano mkubwa wa maana ya kukinzana katika muktadha, lakini tanbihi inadumisha tafsiri ya moja kwa moja zaidi ya גַּם bila kufuta utata wa Kiebrania.
- issue: Tafsiri ya אֲבוֹתֵיכֶם
  choice: baba zenu
  alternative: mababu zenu
  rationale: ‘Baba zenu’ inadumisha umbo la kiume na lugha ya moja kwa moja ya Kiebrania; ‘mababu zenu’ ni tafsiri ya kimuktadha inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. ‘Kunipima’ limetumiwa ili kuhifadhi tofauti ndogo kati ya vitenzi viwili vya Kiebrania bila kutumia lugha ngumu.
