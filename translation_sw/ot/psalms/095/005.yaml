  text: The sea is his[a], for he made it[b], and his hands formed the dry land.
translation:
  language: sw
  text: Bahari ni yake[a], kwa maana yeye aliifanya[b], nayo nchi kavu, mikono yake iliiunda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bahari ni mali yake.” Kiebrania kwa halisi ni muundo wa “ambaye kwake ni bahari,” yaani, “ambaye bahari ni yake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “na yeye aliifanya.” Kiunganishi cha Kiebrania kwa kawaida ni “na,” ingawa hapa yaelekea kinaonyesha sababu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר לּוֹ
  choice: ni yake
  rationale: Muundo huu unaonyesha umilikaji. “Ni yake” ni Kiswahili cha kawaida, kifupi, na hudumisha maana ya kwamba bahari ni mali yake.
- source_word: הַיָּם
  choice: bahari
  rationale: Hii ndiyo maana ya kawaida ya nomino ya Kiebrania; “bahari kuu” au “okeani” ingeongeza ufafanuzi usio lazima.
- source_word: וְהוּא
  choice: kwa maana yeye ndiye
  rationale: 'Ingawa kiunganishi chake kimsingi ni “na,” hapa uhusiano wake unaelekea kuwa wa sababu: bahari ni yake kwa sababu aliifanya. “Ndiye” pia hudumisha msisitizo wa kiwakilishi huru הוּא.'
- source_word: עָשָׂהוּ
  choice: aliyeifanya
  rationale: Kitenzi עשה hapa humaanisha kufanya au kuumba, na kiambishi cha mtendwa hurejelea bahari. “Aliyeifanya” ni cha kawaida na hudumisha tofauti na יצר katika kishazi kinachofuata.
- source_word: וְיַבֶּשֶׁת
  choice: nayo nchi kavu
  rationale: יַבֶּשֶׁת ni nchi kavu kwa kulinganisha na bahari. “Nayo” huendeleza usambamba wa kishairi.
- source_word: יָדָיו
  choice: mikono yake
  rationale: Taswira halisi ya kishairi imehifadhiwa badala ya kuibadilisha kuwa “nguvu zake” au kuiondoa.
- source_word: יָצָרוּ
  choice: iliiumba
  rationale: יצר hubeba wazo la kuunda au kufinyanga. “Iliiumba” ni ya asili katika Kiswahili na huonyesha tendo la mikono, huku ikitofautishwa na “aliyeifanya.”
theological_decisions:
- issue: Lugha ya kumwelezea Mungu kwa viungo vya kibinadamu
  choice: Kudumisha “mikono yake iliiumba” kama taswira ya kishairi
  alternative: “yeye aliiumba” au “nguvu zake ziliiumba”
  rationale: Kiebrania hutaja wazi mikono ya Mungu. Kudumisha taswira hiyo huheshimu ushairi bila kulazimisha ufafanuzi wa kimadhehebu.
- issue: Tofauti kati ya vitenzi עשה na יצר
  choice: Kutumia “alifanya” na “aliumba”
  alternative: Kutumia kitenzi kilekile katika sehemu zote mbili
  rationale: Maneno tofauti huhifadhi mabadiliko ya kileksika na usambamba wa chanzo bila kudai tofauti ya kiteolojia iliyo zaidi ya andiko.
- issue: Uhusiano wa kiunganishi וְהוּא
  choice: 'Kutafsiri kwa maana ya sababu: “kwa maana”'
  alternative: “na yeye ndiye aliyeifanya”
  rationale: Muktadha unaunga mkono kwamba tendo la kuifanya bahari ndilo msingi wa kuwa kwake mali ya Mungu, lakini uwezekano wa “na” umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Umilikaji, msisitizo wa mtendaji, usambamba wa bahari na nchi kavu, na taswira ya “mikono yake” vimehifadhiwa.
