lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza maelezo ya sababu au msingi wa kauli iliyotangulia.
- source_word: הִנֵּה
  choice: tazama
  rationale: Inadumisha mwito wa msomaji kuzingatia tukio linalofuata kwa lugha ya heshima na inayoeleweka.
- source_word: הַמְּלָכִים
  choice: wafalme
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye uhusika wa wingi.
- source_word: נוֹעֲדוּ
  choice: walikusanyika
  rationale: Kitenzi kinaonyesha kukutana au kujikusanya kwa kusudi fulani; muktadha unahusu wafalme waliokusanyika.
- source_word: עָבְרוּ
  choice: walipita
  rationale: Inahifadhi maana ya msingi ya kuvuka au kupita bila kuamua kimya kimya kama walivamia, waliandamana, au walikimbia.
- source_word: יַחְדָּו
  choice: pamoja
  rationale: Inaonyesha kwamba wafalme walitenda kwa pamoja.
theological_decisions:
- issue: Mwelekeo na kusudi la kitendo עָבְרוּ
  choice: walipita
  alternative: walisonga mbele / walivuka
  rationale: Maandishi yenyewe hayataji wazi mwelekeo wala kusudi la mwendo; tafsiri isiongeze maelezo ya kivita yasiyotamkwa moja kwa moja.
