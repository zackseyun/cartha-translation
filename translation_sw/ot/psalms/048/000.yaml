lexical_decisions:
- source_word: שִׁיר
  choice: wimbo
  rationale: Ni neno la kawaida la Kiebrania kwa wimbo; katika kichwa cha zaburi, “wimbo” ni tafsiri ya asili na haiongezi maana isiyokuwamo.
- source_word: מִזְמוֹר
  choice: zaburi
  rationale: Katika vichwa vya Zaburi, hili ndilo jina lililozoeleka la utungo wa muziki. Kutofautisha “wimbo” na “zaburi” kunahifadhi majina yote mawili ya Kiebrania.
- source_word: לִבְנֵי
  choice: ya wana wa
  rationale: Kihusishi ל katika vichwa vya zaburi kinaweza kuonyesha uhusiano, utunzi, kuwekwa wakfu, au matumizi ya kiutendaji. “Ya wana wa” hakifungii maana kwenye uwezekano mmoja.
- source_word: קֹרַח
  choice: Kora
  rationale: “Kora” ni umbo la jina hili lililozoeleka katika Kiswahili cha Biblia.
theological_decisions:
- issue: Maana ya kirai לִבְנֵי קֹרַח katika kichwa cha zaburi
  choice: ya wana wa Kora
  alternative: kwa ajili ya wana wa Kora
  rationale: Kihusishi cha Kiebrania ל kina maana pana katika vichwa vya zaburi. Tafsiri kuu inaacha wazi aina kamili ya uhusiano, huku tanbihi ikionyesha uwezekano mwingine bila kuamua kwamba wana wa Kora ndio watunzi au waimbaji.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye hadhi unaofaa kichwa cha zaburi. Mpangilio wa majina mawili ya utungo umehifadhiwa.
