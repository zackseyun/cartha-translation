  yaml_path: translation/ot/psalms/048/006.yaml
  text: Trembling seized them there[a], anguish like a woman in labor.
translation:
  language: sw
  text: Kutetemeka kuliwashika huko, uchungu[a] kama wa mwanamke anayezaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: kujikunja kwa uchungu kama mwanamke anayezaa; neno la Kiebrania חִיל linaweza kusisitiza kujikunja kwa maumivu yenyewe pamoja na uchungu unaotokana nayo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְעָדָה
  choice: Kutetemeka
  rationale: Nomino hii huonyesha kutetemeka au kutikisika. “Kutetemeka” inadumisha taswira halisi na inafaa kama kiima cha kishazi.
- source_word: אֲחָזָתַם
  choice: kuliwashika
  rationale: Kitenzi אחז humaanisha kushika au kukamata. “Kuliwashika” kinaonyesha nguvu ya ghafula iliyowapata, huku upatanisho wa kisarufi ukifuata kiima “kutetemeka.”
- source_word: שָׁם
  choice: huko
  rationale: Kielezi cha mahali kinachorejelea eneo lililotajwa katika muktadha. “Huko” ni cha kawaida na hudumisha uhai wa tukio.
- source_word: חִיל
  choice: uchungu
  rationale: Neno hili linaweza kumaanisha uchungu, maumivu ya kuzaa, au kujikunja kwa maumivu. “Uchungu” hubeba mateso ya mwili na ya ndani bila kurudia waziwazi taswira ya kuzaa.
- source_word: כַּיּוֹלֵדָה
  choice: kama wa mwanamke anayezaa
  rationale: Kirai cha ulinganisho kinamrejelea mwanamke aliye katika tendo la kuzaa. Muundo huu ni wa kawaida, wazi, na unadumisha nguvu ya tashbihi.
