  text: With an east wind you shatter the ships of Tarshish[a].
translation:
  language: sw
  text: Kwa upepo wa mashariki, unazivunja meli za Tarshishi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “meli zinazoelekea Tarshishi” au “meli za Tarshishi,” kirai ambacho kinaweza kumaanisha meli kubwa za biashara za baharini zinazojulikana kwa jina hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/רוּחַ
  choice: Kwa upepo
  rationale: 'רוּחַ katika muktadha huu ni upepo, si roho wala pumzi, kwa sababu inaambatana na קָדִים na taswira ya baharini. Kiambishi ב kimetafsiriwa kama njia au chombo cha kutenda: “kwa.”'
- source_word: קָדִים
  choice: wa mashariki
  rationale: Neno hili linaonyesha upepo wa mashariki, ambao mara nyingi huwa na nguvu ya kuharibu. Kiswahili cha kawaida huunganisha maneno haya kuwa “upepo wa mashariki.”
- source_word: תְּשַׁבֵּר
  choice: unazivunjavunja
  rationale: Kauli ya Piel ya שבר inaonyesha kuvunja kwa nguvu. “Unazivunjavunja” hudumisha nguvu ya tendo na umbo la nafsi ya pili umoja linalomwelekea Mungu.
- source_word: אֳנִיּוֹת
  choice: meli
  rationale: Nomino hii ni wingi wa “meli.” Kiswahili hakihitaji kuongeza kibainishi sawa na “the,” na upatanisho wa ngeli unaonekana katika “unazivunjavunja.”
- source_word: תַּרְשִׁישׁ
  choice: Tarshishi
  rationale: Jina hili limetoholewa kwa tahajia ya kawaida ya kibiblia ya Kiswahili. Kirai kinaweza kumaanisha meli zinazohusishwa na Tarshishi au meli kubwa za biashara za baharini; maana hiyo haijafinywa kupita kiasi katika matini kuu.
theological_decisions:
- issue: Anayesemeshwa na kitenzi cha nafsi ya pili
  choice: 'Mungu anasemeshwa moja kwa moja: “unazivunjavunja”'
  alternative: Kauli isiyoelekezwa kwa mtu fulani au kauli ya jumla
  rationale: Kitenzi cha Kiebrania kiko katika nafsi ya pili ya kiume umoja, na muktadha wa zaburi unaunga mkono kumsemesha Mungu moja kwa moja. Tafsiri hii inadumisha nguvu ya kishairi bila kuongeza fundisho la kiitikadi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. “Unazivunjavunja” ni ya sasa katika umbo lakini inaakisi kauli hai ya kishairi ya Kiebrania na nguvu ya Piel.
