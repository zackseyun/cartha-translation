  variant: Standard East African Swahili
source:
  edition: WLC
  text: כְּ/שִׁמְ/ךָ֤ אֱלֹהִ֗ים כֵּ֣ן תְּ֭הִלָּתְ/ךָ עַל קַצְוֵי אֶ֑רֶץ צֶ֝֗דֶק מָלְאָ֥ה יְמִינֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/010.yaml
  text: As your name[a], O God, so your praise reaches to the ends of the earth[b]; your right hand is full of righteousness.
translation:
  language: sw
  text: Kama jina lako, Ee Mungu, ndivyo sifa zako zinavyofika hadi miisho ya dunia[a]; mkono wako wa kuume umejaa haki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sifa zako ziko juu ya miisho ya dunia.” Kihusishi cha Kiebrania kwa kawaida humaanisha “juu ya.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza pia kusisitiza uadilifu au kutenda hukumu ya haki.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּשִׁמְךָ ... כֵּן
  choice: Kama jina lako ... ndivyo
  rationale: Muundo wa kulinganisha ‘kama ... ndivyo’ unahifadhi usambamba wa kishairi wa Kiebrania bila kufafanua ‘jina’ kuwa sifa au umaarufu.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Muktadha unaonyesha usemi wa moja kwa moja kwa Mungu; ‘Ee Mungu’ ni mwito wa asili na wenye hadhi katika Kiswahili.
- source_word: תְּהִלָּתְךָ
  choice: sifa zako
  rationale: Hili ndilo chaguo la moja kwa moja na la kawaida kwa nomino ya Kiebrania inayomaanisha sifa inayotolewa kwa Mungu au kusikika kwake.
- source_word: עַל קַצְוֵי אֶרֶץ
  choice: zinavyofika hadi miisho ya dunia
  rationale: Ingawa עַל kimsingi ni ‘juu ya,’ katika muktadha huu usemi unaonyesha kuenea kwa sifa mpaka sehemu za mbali kabisa; tafsiri hii ni ya asili katika Kiswahili, huku maana ya kimuundo ikihifadhiwa katika tanbihi.
- source_word: צֶדֶק
  choice: haki
  rationale: ‘Haki’ linaweza kujumuisha uadilifu wa kimaadili na kutenda au kuhukumu kwa haki, hivyo linahifadhi upana wa maana wa neno la Kiebrania.
- source_word: מָלְאָה יְמִינֶךָ
  choice: mkono wako wa kuume umejaa
  rationale: Tafsiri hii inahifadhi picha halisi ya mkono wa kuume kama chombo cha nguvu na utendaji, na kitenzi kinaonyesha hali iliyopo ya kujaa.
theological_decisions:
- issue: Maana ya צֶדֶק katika maelezo ya mkono wa kuume wa Mungu
  choice: haki
  alternative: uadilifu; au haki katika maana ya kutenda hukumu ya haki
  rationale: Neno la Kiebrania linaweza kuelekeza kwa uadilifu wa Mungu au haki yake ya kihukumu. ‘Haki’ linadumisha maana hizo zote bila kuamua kimadhehebu, na tanbihi inaeleza upana huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi, wa sasa na wenye hadhi. Muundo ‘kama ... ndivyo’ unahifadhi usambamba wa mstari, na ‘miisho ya dunia’ ni nahau ya kibiblia inayoeleweka kwa maeneo ya mbali kabisa.
