lexical_decisions:
- source_word: יִשְׂמַח
  choice: na ufurahi
  rationale: Kauli ya Qal isiyotimilika, nafsi ya tatu umoja wa kiume, ina nguvu ya kutakia au kuhimiza katika ushairi; “na ufurahi” ni ya asili katika Kiswahili na huhifadhi nguvu hiyo.
- source_word: הַר צִיּוֹן
  choice: Mlima Sayuni
  rationale: Huhifadhi picha ya kijiografia ya neno la Kiebrania na kutumia jina lililozoeleka katika Kiswahili cha Biblia.
- source_word: תָּגֵלְנָה
  choice: na zishangilie
  rationale: Kauli ya Qal isiyotimilika, nafsi ya tatu wingi wa kike, ya mzizi unaomaanisha kufurahi sana au kushangilia; tofauti ya kitenzi huhifadhi ulinganifu wa kishairi bila marudio yasiyo ya lazima.
- source_word: בְּנוֹת יְהוּדָה
  choice: binti za Yuda
  rationale: Tafsiri halisi huhifadhi sitiari ya Kiebrania; katika ushairi inaweza kumaanisha miji au vijiji vya Yuda vinavyoitegemea, jambo linalowekwa katika tanbihi.
- source_word: לְמַעַן
  choice: kwa sababu ya
  rationale: Katika muktadha huu huonyesha sababu ya furaha, hivyo usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: מִשְׁפָּטֶיךָ
  choice: hukumu zako
  rationale: Wingi huu unaweza kumaanisha hukumu, haki, maamuzi ya kimahakama, au maagizo; katika muktadha wa zaburi unaelekea kwa matendo ya Mungu ya kuhukumu.
theological_decisions:
- issue: Maana ya מִשְׁפָּטֶיךָ katika muktadha
  choice: hukumu zako
  alternative: haki yako; maagizo yako
  rationale: Muktadha unaadhimisha matendo madhubuti ya Mungu akiwa Mfalme na Mwamuzi, si hasa sheria zilizofunuliwa. “Hukumu zako” huhifadhi mkazo huo bila kufunga maana kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kutakia “na ufurahi ... na zishangilie” huhifadhi nguvu ya kishairi. Upatanisho wa kisarufi “binti ... zishangilie” unafuata matumizi ya kawaida ya nomino binti katika ngeli ya N/N.
