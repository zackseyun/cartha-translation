  text: Let Mount Zion rejoice[a]; let the daughters of Judah be glad because of your judgments.
translation:
  language: sw
  text: Mlima Sayuni na ufurahi; binti za Yuda[a] na zishangilie kwa sababu ya hukumu zako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miji au vijiji vya Yuda,” kwa kuwa “binti” inaweza kutumiwa kishairi kurejelea miji au makazi yanayoitegemea Yuda.
