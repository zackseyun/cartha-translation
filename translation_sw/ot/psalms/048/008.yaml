  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר שָׁמַ֨עְנוּ כֵּ֤ן רָאִ֗ינוּ בְּ/עִיר יְהוָ֣ה צְ֭בָאוֹת בְּ/עִ֣יר אֱלֹהֵ֑י/נוּ אֱלֹ֘הִ֤ים יְכוֹנְנֶ֖/הָ עַד עוֹלָ֣ם סֶֽלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/008.yaml
  text: 'Just as we have heard[a], so we have seen in the city of Yahweh of hosts, in the city of our God: God will establish her forever. Selah'
translation:
  language: sw
  text: 'Kama tulivyosikia, ndivyo tulivyoona

    katika mji wa Yahwe wa majeshi,

    katika mji wa Mungu wetu:

    Mungu atauweka[a] imara milele.

    Sela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina kiambishi cha kike kinachorejelea ‘mji,’ neno ambalo ni la kike kisarufi na linaweza kuwasilishwa kishairi kama mwanamke. Kiswahili hutumia kiambishi cha ngeli ya mji, -u-.
    reason: Ufafanuzi wa kirejelewa cha kiambishi na tofauti ya kisarufi kati ya Kiebrania na Kiswahili.
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Kama ... ndivyo
  rationale: Muundo huu wa Kiswahili unahifadhi ulinganisho wa Kiebrania kati ya yale yaliyosikiwa na yale yaliyoonekana.
- source_word: שָׁמַעְנוּ ... רָאִינוּ
  choice: tulivyosikia ... tulivyoona
  rationale: Vitenzi vya wakati uliopita vinaeleza taarifa iliyopokewa na jambo lililoshuhudiwa; muundo huu ni wa asili katika sentensi linganishi ya Kiswahili.
- source_word: בְּעִיר
  choice: katika mji wa
  rationale: Inawasilisha maana ya mahali ya kihusishi בְּ pamoja na nomino עִיר kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi YHWH limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: צְבָאוֹת
  choice: majeshi
  rationale: Neno hili lina maana ya makundi ya jeshi; ‘majeshi’ ni pana vya kutosha bila kubainisha kwamba ni majeshi ya duniani au ya mbinguni.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Inahifadhi moja kwa moja kiambishi cha nafsi ya kwanza wingi katika neno la Kiebrania.
- source_word: יְכוֹנְנֶהָ
  choice: atauweka imara
  rationale: Kitenzi כון hapa kina wazo la kuufanya mji uthabiti au uwe salama. ‘Atauweka imara’ ni wazi na ya asili, huku kiambishi -u- kikirejelea mji.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha hali ya kudumu isiyo na mwisho.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya neno hili la liturujia au muziki haijulikani kwa hakika, kwa hiyo limetoholewa badala ya kufasiriwa kwa kubahatisha.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu. Kulitoholesha kama ‘Yahwe’ kunalihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Kirejelewa cha kiambishi katika יְכוֹנְנֶהָ
  choice: 'Kiambishi kinarejelea mji: ‘atauweka imara’'
  alternative: ‘ataufanya uwe salama’ au tafsiri inayotaja mji tena
  rationale: Kiambishi cha Kiebrania ni cha kike umoja na kwa kawaida kinarejelea עִיר, ‘mji,’ ambalo ni neno la kike kisarufi. Kiswahili hakitumii jinsia ya kike kwa mji, hivyo kiambishi cha ngeli -u- kinahifadhi kirejelewa bila kuunda jinsia isiyo ya asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa mistari unafuata ulinganifu wa zaburi. ‘Yahwe wa majeshi’ huhifadhi jina la Mungu na upana wa צְבָאוֹת; ‘Sela’ limeachwa kama istilahi iliyotoholewa kwa sababu maana yake kamili haijulikani.
