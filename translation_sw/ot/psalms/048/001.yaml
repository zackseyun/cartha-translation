  yaml_path: translation/ot/psalms/048/001.yaml
  text: Great is Yahweh[a], and greatly to be praised, in the city of our God, his holy mountain.
translation:
  language: sw
  text: Yahweh ni mkuu, naye anastahili kusifiwa sana[a], katika mji wa Mungu wetu, mlima wake mtakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye anasifiwa sana.” Neno la Kiebrania linaweza kutafsiriwa moja kwa moja kuwa “anasifiwa,” au kimuktadha kuwa “anastahili kusifiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: ni mkuu
  rationale: Kivumishi hiki kinatumika kama kiarifu mwanzoni mwa mstari; “ni mkuu” huhifadhi maana ya ukuu bila kuiwekea mipaka ya nguvu pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kama “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: וּמְהֻלָּל מְאֹד
  choice: naye anastahili kusifiwa sana
  rationale: Kauli tendwa ya kitenzi הלל pamoja na kielezi מְאֹד inaweza kueleza kwamba Yahwe anasifiwa sana au anastahili sifa nyingi. Tafsiri hii ni ya kawaida katika Kiswahili na hudokeza nguvu ya kiarifu ya kirai hicho.
- source_word: בְּעִיר אֱלֹהֵינוּ
  choice: katika mji wa Mungu wetu
  rationale: Kiambishi בְּ kinaonyesha mahali, na muundo tegemezi unahifadhiwa kwa usemi wa kawaida “mji wa Mungu wetu.”
- source_word: הַר קָדְשׁוֹ
  choice: mlima wake mtakatifu
  rationale: Kirai hiki kinafuata “mji wa Mungu wetu” kama maelezo yanayouhusianisha mji huo na mlima mtakatifu wa Mungu; “mlima” ni tafsiri ya moja kwa moja ya הַר.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya מְהֻלָּל katika kauli ya sifa
  choice: anastahili kusifiwa
  alternative: anasifiwa
  rationale: Kauli tendwa ya Kiebrania inaweza kueleweka kama hali halisi ya kusifiwa au kustahili sifa. Maandishi makuu yanatumia Kiswahili cha kawaida kinachoonyesha kustahili, huku tanbihi ikihifadhi uwezekano wa tafsiri ya moja kwa moja zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa mwanzo wa Kiebrania umehifadhiwa kwa “Yahwe ni mkuu,” na kirai cha mwisho kimeachwa kuwa ufafanuzi wa “mji wa Mungu wetu” bila kuongeza kiunganishi kisichokuwapo katika chanzo.
