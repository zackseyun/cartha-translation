lexical_decisions:
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania ni la wingi, hapa ni jina la kumtaja Mungu wa Israeli katika umoja.
- source_word: בְּאַרְמְנוֹתֶיהָ
  choice: katika ngome zake
  rationale: Neno אַרְמוֹן linaweza kumaanisha jumba la kifalme au jengo lenye ulinzi. Muktadha wa usalama wa Sayuni unaunga mkono ‘ngome’; kiambishi cha kike cha umoja kinarejelea jiji.
- source_word: נוֹדַע
  choice: anajulikana
  rationale: Nifali ya ידע hapa inaweza kueleza hali ya ‘kujulikana,’ bila kuongeza wazi wazo la kujidhihirisha mwenyewe.
- source_word: לְמִשְׂגָּב
  choice: kuwa mahali salama pa kujikinga
  rationale: מִשְׂגָּב ni mahali palipoinuka na salama panapotoa ulinzi. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha picha ya usalama.
theological_decisions:
- issue: Kinachorejelewa na kiambishi cha kike katika ‘ngome zake’
  choice: Kiambishi kinarejelea Sayuni, yaani jiji linalosifiwa katika zaburi.
  alternative: Huenda kikarejelea nchi au jumuiya kwa ujumla.
  rationale: Muktadha wa karibu wa Zaburi 48 unahusu Mlima Sayuni na jiji la Mungu, ambalo linatajwa kama la kike.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi ufupi wa kishairi na hali ya ‘anajulikana,’ huku maelezo ya chini yakidumisha uwezekano wa maana nyingine za maneno ya Kiebrania.
