lexical_decisions:
- source_word: סֹבּוּ
  choice: Zungukeni
  rationale: Kitenzi cha amri kwa wingi kutoka סבב kinaagiza watu waende kuuzunguka mji; “zungukeni” ni Kiswahili cha kawaida na kinahifadhi tendo halisi la kuzunguka.
- source_word: צִיּוֹן
  choice: Sayuni
  rationale: Jina hili limetoholewa kwa namna iliyozoeleka katika Kiswahili. Kiebrania kinasema “Sayuni” tu, si “Mlima Sayuni.”
- source_word: וְהַקִּיפוּהָ
  choice: mzunguke pande zote
  rationale: Ni amri kwa wingi yenye kiambishi cha nafsi ya tatu, umoja wa kike, kinachorejelea Sayuni kama mji. Kauli hii inaonyesha kuuzunguka kikamilifu bila kutoa dhana isiyohitajika ya kuuzingira kwa uhasama.
- source_word: סִפְרוּ
  choice: hesabuni
  rationale: Katika muktadha wa minara, maana ya moja kwa moja ni kuhesabu idadi yake, si kusimulia.
- source_word: מִגְדָּלֶיהָ
  choice: minara yake
  rationale: Nomino ya wingi yenye kiambishi cha nafsi ya tatu umoja wa kike inarejelea Sayuni. Kiswahili hutumia “yake” kwa mji bila kuhitaji jinsia ya kisarufi.
