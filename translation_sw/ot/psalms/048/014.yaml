  language: sw
  text: Kwa maana huyu ndiye Mungu, Mungu wetu milele na milele; yeye atatuongoza hata ng’ambo ya kifo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kifungu cha Kiebrania kilichotafsiriwa “hata ng’ambo ya kifo” kina maana isiyo hakika; huenda pia kikamaanisha “hata kufa.”
    reason: Kuhifadhi utata halisi wa עַל־מוּת katika maandishi ya Kimasora bila kulazimisha tafsiri moja kuwa ya hakika.
lexical_decisions:
- source_word: כִּי זֶה אֱלֹהִים
  choice: Kwa maana huyu ndiye Mungu
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida msisitizo wa Kiebrania kwamba Mungu anayezungumziwa ndiye Mungu wao.
- source_word: אֱלֹהֵינוּ עוֹלָם וָעֶד
  choice: Mungu wetu milele na milele
  rationale: Inahifadhi kauli ya umiliki wa agano na jozi ya maneno inayosisitiza kudumu bila mwisho.
- source_word: יְנַהֲגֵנוּ
  choice: atatuongoza
  rationale: Kitenzi נהג katika muktadha huu kina maana ya kuongoza au kuelekeza, kama mchungaji au kiongozi.
- source_word: עַל־מוּת
  choice: hata ng’ambo ya kifo
  rationale: Inawakilisha usomaji wa maneno ya Kimasora kama ahadi kwamba uongozi wa Mungu unafika kupita kifo, huku tanbihi ikitaja kwamba kifungu hiki kigumu kinaweza kueleweka vingine.
theological_decisions:
- issue: Je, uongozi wa Mungu unaendelea hadi kufa au ng’ambo ya kifo?
  choice: hata ng’ambo ya kifo
  alternative: hata kufa
  rationale: Kifungu עַל־מוּת ni kifupi na kigumu, na matumizi ya עַל yanaweza kuruhusu wazo la kuvuka au kwenda ng’ambo. Tafsiri kuu inafuata usomaji huo bila kuficha uwezekano wa maana ya “hata kufa,” ambao umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. “Ng’ambo ya kifo” ni usemi wa kawaida wa kishairi unaofaa zaburi; tanbihi inaepusha kuficha ugumu wa Kiebrania.
