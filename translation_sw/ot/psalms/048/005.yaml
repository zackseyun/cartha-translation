  text: They saw[a], and so they were astonished; they were terrified; they fled in haste.
translation:
  language: sw
  text: Wao waliona; hivyo wakashangaa; wakafadhaika, wakaondoka kwa haraka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakaondoka upesi” au “wakakimbia kwa haraka.” Kitenzi cha Kiebrania huonyesha kuondoka kwa haraka, mara nyingi kwa hali ya kutaharuki.
