lexical_decisions:
- source_word: הֵמָּה
  choice: Wao
  rationale: Kiwakilishi huru cha nafsi ya tatu wingi kina msisitizo; “Wao” kinauhifadhi kwa Kiswahili cha kawaida.
- source_word: רָאוּ
  choice: waliona
  rationale: Kitenzi cha kawaida cha kuona; tafsiri hii ni ya moja kwa moja na inafaa katika muktadha.
- source_word: כֵּן
  choice: waka-
  rationale: Katika mfuatano huu, kiambishi simulizi “waka-” kinaonyesha kuwa mshangao ulifuata walichokiona, bila kufanya sentensi kuwa nzito kwa kutumia “hivyo.”
- source_word: תָּמָהוּ
  choice: wakashangaa
  rationale: Hueleza kushikwa na mshangao; uchaguzi huu hauamui kimbele kama mshangao huo ulikuwa wa kuvutiwa au wa kushtuka.
- source_word: נִבְהֲלוּ
  choice: wakaingiwa na hofu
  rationale: Muktadha unaonyesha hali kali ya kushtuka na kuogopa; usemi huu ni wa asili na unaendeleza kupanda kwa hisia katika mstari.
- source_word: נֶחְפָּזוּ
  choice: wakaondoka kwa haraka
  rationale: Kitenzi kinaonyesha mwendo wa haraka unaosababishwa na shinikizo au hofu. “Wakaondoka kwa haraka” huhifadhi wazo kuu la uharaka bila kulazimisha maana mahususi ya kukimbia.
