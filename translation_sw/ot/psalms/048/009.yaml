  text: דִּמִּ֣ינוּ אֱלֹהִ֣ים חַסְדֶּ֑/ךָ בְּ֝/קֶ֗רֶב הֵיכָלֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/009.yaml
  text: We have reflected on your steadfast love[a], O God, in the midst of your temple.
translation:
  language: sw
  text: Ee Mungu, tumetafakari upendo wako thabiti[a] katikati ya hekalu lako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tumeufikiria kwa kina” au “tumeuzingatia.” Kitenzi cha Kiebrania kinaweza kumaanisha kuwaza kwa kina au kutafakari.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּמִּינוּ
  choice: tumetafakari
  rationale: Katika muktadha huu, kitenzi hiki cha Kiebrania kinaeleza kufikiri kwa kina au kutafakari. “Tumetafakari” ni Kiswahili cha kawaida na chenye hadhi kinachofaa mazingira ya ibada.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Nomino hii inafanya kazi kama mwito wa moja kwa moja. “Ee Mungu” huonyesha wazi sauti ya sala au wimbo bila kuongeza maana nyingine.
- source_word: חַסְדֶּךָ
  choice: upendo wako thabiti
  rationale: חֶסֶד hapa hudokeza upendo wa Mungu ulio mwaminifu, wa kudumu, na wa uhusiano. “Upendo wako thabiti” huhifadhi upana huo kuliko “rehema,” ambayo inaweza kuufanya maana kuwa finyu.
- source_word: בְּקֶרֶב
  choice: katikati ya
  rationale: Kirai hiki kinaonyesha kuwa ndani au miongoni mwa eneo linalotajwa. “Katikati ya” huhifadhi taswira ya mahali na mtindo wa kishairi.
- source_word: הֵיכָלֶךָ
  choice: hekalu lako
  rationale: Ingawa הֵיכָל pia inaweza kumaanisha jumba la kifalme, mazingira ya ibada katika zaburi hii yanaunga mkono “hekalu lako.”
theological_decisions:
- issue: Maana ya חֶסֶד kuhusiana na tabia ya Mungu
  choice: upendo wako thabiti
  alternative: rehema; fadhili zako; upendo wako wa agano
  rationale: Uamuzi huu huhifadhi wazo la upendo wa Mungu ulio wa kudumu na mwaminifu bila kuufupisha kuwa huruma pekee wala kuingiza istilahi nzito ya kitaaluma katika matini kuu.
- issue: Nguvu ya אֱלֹהִים kama mwito au rejeo
  choice: 'Mwito wa moja kwa moja: “Ee Mungu”'
  alternative: 'Rejeo lisilo la mwito: “Mungu”'
  rationale: Muundo wa mstari unaeleweka kiasili kama maneno yanayoelekezwa kwa Mungu katika sala au wimbo. “Ee” huweka jambo hilo wazi bila kuongeza maudhui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Mpangilio wa mwito “Ee Mungu” umetangulizwa ili sentensi iwe ya asili kwa Kiswahili huku maana ya Kiebrania ikihifadhiwa.
