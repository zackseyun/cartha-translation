base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/013.yaml
  text: Set your heart on her rampart[a]; pass through her citadels[b], so that you may tell the next generation.
translation:
  language: sw
  text: Elekezeni mioyo yenu kwenye boma lake[a]; pitieni ngome zake[b], ili msimulie kizazi kijacho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukuta wake wa nje.” Neno la Kiebrania linarejelea kwa upana muundo wa ulinzi wa mji.
    reason: lexical_alternative
  - marker: b
    text: Au “majumba yake.” Neno la Kiebrania linaweza kumaanisha majumba makubwa ya kifalme au majengo yenye ulinzi; muktadha wa kukagua kinga za mji unaunga mkono “ngome.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיתוּ לִבְּכֶם
  choice: Elekezeni mioyo yenu
  rationale: Usemi huu wa Kiebrania unamaanisha kuelekeza fikira au kuzingatia kwa makini. Kutaja “mioyo” kunahifadhi taswira ya chanzo huku “elekezeni” ikiifanya iwe ya asili katika Kiswahili.
- source_word: לְחֵילָה
  choice: kwenye boma lake
  rationale: חֵיל katika maelezo ya mji hurejelea kinga ya mji, hasa ukuta au boma la nje. “Boma” ni neno la kawaida la Kiswahili linaloweza kueleza ukuta wenye kazi ya ulinzi.
- source_word: פַּסְּגוּ
  choice: pitieni
  rationale: Kitenzi hiki adimu ni agizo la wingi na katika muktadha huu kinaashiria kupita au kwenda katikati ya majengo ya mji ili kuyatazama.
- source_word: אַרְמְנוֹתֶיהָ
  choice: ngome zake
  rationale: אַרְמוֹן inaweza kumaanisha majumba ya kifalme au majengo yenye ulinzi. Muktadha wa kukagua kinga za mji unaunga mkono “ngome,” huku tanbihi ikihifadhi maana nyingine halisi.
- source_word: לְמַעַן
  choice: ili
  rationale: Kiunganishi hiki huonyesha kusudi; “ili” ni kifupi na cha kawaida katika Kiswahili sanifu.
- source_word: תְּסַפְּרוּ
  choice: mpate kukisimulia
  rationale: Piel ya ספר humaanisha kusimulia au kueleza. Kiambishi “-ki-” kinarejelea kilichoonekana kuhusu jiji bila kuongeza nomino isiyokuwapo wazi katika mstari.
- source_word: לְדוֹר אַחֲרוֹן
  choice: kizazi kijacho
  rationale: Kirai hiki ni “kizazi cha baadaye.” “Kizazi kijacho” ni usemi wa asili unaodumisha wazo la kupitisha ushuhuda kwa watakaofuata.
