    rationale: Beginning with 'Ni mzuri ... Mlima Sayuni' is possible only as highly marked inversion, but the intervening appositions make it difficult to read naturally. Placing 'Mlima Sayuni' first resolves this without changing the sense.
  - severity: low
    issue: '''kwa kuinuka kwake'' is not the most natural topographical expression.'
    rationale: '''Kwa mwinuko wake'' idiomatically expresses beauty in elevation/lofty situation.'
  - severity: low
    issue: The footnote’s literal gloss uses an unintegrated slash construction.
    rationale: Stating the alternatives as 'sehemu za mbali, au pande, za kaskazini' is clear, grammatical Swahili and preserves the lexical uncertainty.
