  text: יְפֵ֥ה נוֹף֮ מְשׂ֪וֹשׂ כָּל הָ֫/אָ֥רֶץ הַר צִ֭יּוֹן יַרְכְּתֵ֣י צָפ֑וֹן קִ֝רְיַ֗ת מֶ֣לֶךְ רָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/002.yaml
  text: Beautiful in elevation[a], the joy of all the earth, is Mount Zion, in the far north, the city of the great King.
translation:
  language: sw
  text: Mlima Sayuni ni mzuri kwa mwinuko wake, furaha ya dunia yote; uko katika sehemu za mbali za kaskazini[a], mji wa Mfalme Mkuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika miteremko ya kaskazini.” Kihalisi, “katika sehemu za mbali, au pande, za kaskazini.” Usemi huo pia huenda ukadokeza taswira ya mlima wa kimungu inayohusishwa na Zafoni.
    reason: alternative_reading
lexical_decisions:
- source_word: יְפֵה
  choice: mzuri
  rationale: Ni kivumishi kinachoeleza uzuri wa Sayuni; ‘mzuri’ ni Kiswahili cha kawaida, cha heshima, na kinaendana na ngeli ya ‘Mlima Sayuni.’
- source_word: נוֹף
  choice: kwa kuinuka kwake
  rationale: Neno hili ni gumu, lakini huenda linaeleza mwinuko au mandhari ya mahali palipoinuka. Tafsiri hii huhifadhi maana ya kijiografia bila kutumia usemi usioeleweka.
- source_word: מְשׂוֹשׂ
  choice: furaha
  rationale: Nomino hii humaanisha furaha au shangwe; ‘furaha ya dunia yote’ ni ya asili na huhifadhi dai la kishairi.
- source_word: כָּל הָאָרֶץ
  choice: dunia yote
  rationale: ‘Dunia’ inafaa kuliko ‘nchi’ kwa kuwa sifa hapa ina upeo wa ulimwengu mzima.
- source_word: הַר צִיּוֹן
  choice: Mlima Sayuni
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: יַרְכְּתֵי צָפוֹן
  choice: katika sehemu za mbali za kaskazini
  rationale: Huhifadhi wazo halisi la sehemu au pande za mbali za kaskazini bila kulazimisha tafsiri ya kijiografia pekee au dokezo la mlima wa kimungu.
- source_word: קִרְיַת מֶלֶךְ רָב
  choice: mji wa Mfalme mkuu
  rationale: Muundo huu wa Kiswahili unaakisi mnyororo wa utegemezi wa Kiebrania. Herufi kubwa katika ‘Mfalme’ inaonyesha rejeo linaloelekea kwa Mungu katika muktadha, bila kuongeza jina lisilokuwamo.
theological_decisions:
- issue: Maana ya יַרְכְּתֵי צָפוֹן kuhusiana na Mlima Sayuni
  choice: katika sehemu za mbali za kaskazini
  alternative: kwenye miteremko ya kaskazini; katika sehemu za mbali za Zafoni/Kaskazini
  rationale: Kiebrania kinaweza kueleweka kama maelezo ya mahali, lakini pia huenda kikadokeza taswira ya Zafoni kama mlima wa kimungu. Maandishi makuu yanahifadhi upana huo, na tanbihi inaweka wazi uwezekano mwingine bila kuamua kupita ushahidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa virai vya ufafanuzi umehifadhiwa kwa koma ili kuonyesha kwamba vyote vinaieleza Mlima Sayuni.
