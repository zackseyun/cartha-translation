source:
  edition: WLC
  text: כִּ֥י גָ֘בַ֤ר עָלֵ֨י/נוּ חַסְדּ֗/וֹ וֶֽ/אֱמֶת יְהוָ֥ה לְ/עוֹלָ֗ם הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/117/002.yaml
  text: For his steadfast love has prevailed over us[a], and the faithfulness of Yahweh is forever. Praise Yah!
translation:
  language: sw
  text: Kwa maana upendo wake thabiti umetushinda, na ukweli[a] wa Yahwe ni wa milele. Msifuni Yah!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uaminifu wa Yahwe ni wa milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya mwito wa mataifa kumsifu Mungu katika mstari uliotangulia, na inaunganisha vizuri mtiririko wa kishairi.
- source_word: גָבַר עָלֵינוּ
  choice: umetawala kwa nguvu juu yetu
  rationale: Kitenzi גבר huonyesha kuwa na nguvu au kushinda, nacho pamoja na עַל huhifadhi taswira ya upendo wa Mungu unaodhihirika kwa nguvu juu ya watu wake. Tafsiri hii huepuka kuufanya usemi kuwa kivumishi tu, kama ‘ni mkuu.’
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד huunganisha upendo, wema, na uaminifu wa kudumu katika uhusiano. ‘Upendo thabiti’ ni wa kawaida na wenye heshima, huku ukihifadhi wazo la upendo usiobadilika.
- source_word: וֶאֱמֶת
  choice: na ukweli
  rationale: אֱמֶת linaweza kumaanisha ukweli, uaminifu, au kutegemeka. ‘Ukweli’ huhifadhi maana yake ya moja kwa moja, huku ‘uaminifu’ ukitolewa katika tanbihi ili kutohitimisha kimya kimya utata wa neno hilo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: לְעוֹלָם
  choice: ni wa milele
  rationale: Huhifadhi muundo wa kirai nomino cha Kiebrania na kueleza wazi kudumu bila mwisho.
- source_word: הַלְלוּ יָהּ
  choice: Msifuni Yah!
  rationale: Hutafsiri amri ya wingi ‘sifuni’ na kuhifadhi jina fupi la Mungu, יָהּ, kama ‘Yah.’
theological_decisions:
- issue: Maana ya אֱמֶת linapooanishwa na חֶסֶד
  choice: ukweli
  alternative: uaminifu
  rationale: Neno linaweza kueleza ukweli wenyewe au hali ya kutegemeka kwa Mungu. Matini kuu inatumia maana ya moja kwa moja, na tanbihi inadumisha maana ya kiagano inayowezekana.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania hutumia jina binafsi la Mungu, hivyo limetoholewa badala ya kubadilishwa kuwa cheo.
- issue: Nguvu ya upendo wa Mungu katika גָבַר עָלֵינוּ
  choice: umetawala kwa nguvu juu yetu
  alternative: ni mkuu kwetu
  rationale: Chaguo kuu huhifadhi nguvu ya kitenzi na taswira ya upendo unaoshinda au kuthibitika kuwa wenye nguvu, bila kuufanya usemi kuwa maelezo tuli tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Msifuni’ huhifadhi amri ya wingi kwa mataifa na watu wote; majina ‘Yahwe’ na ‘Yah’ yanatofautishwa kama yalivyo katika Kiebrania.
