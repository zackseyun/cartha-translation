  text: הַֽלְל֣וּ אֶת יְ֭הוָה כָּל גּוֹיִ֑ם שַׁ֝בְּח֗וּ/הוּ כָּל הָ/אֻמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/117/001.yaml
  text: Praise Yahweh[a], all nations; extol him, all peoples.
translation:
  language: sw
  text: 'Msifuni Yahweh[a], enyi mataifa yote;

    mtukuzeni, enyi watu wote.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Msifuni Yahweh,” au kwa desturi nyingine, “Msifuni BWANA”; jina la Mungu ni YHWH.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: Msifuni
  rationale: Amri ya wingi ya piel kutoka הלל, inayotoa mwito wa moja kwa moja wa kusifu; “msifuni” ni Kiswahili cha kawaida, cha sasa na chenye hadhi.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: אֶת ni kiashiria cha yambwa tendwa, nayo יְהוָה ni jina la Mungu YHWH; umbo “Yahweh” linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- source_word: כָּל גּוֹיִם
  choice: enyi mataifa yote
  rationale: גּוֹיִם humaanisha mataifa au makundi ya watu. “Mataifa yote” linafaa kwa mwito huu wa ulimwengu mzima, huku “enyi” likifanya usemi wa moja kwa moja uwe wa asili katika Kiswahili.
- source_word: שַׁבְּחוּהוּ
  choice: mtukuzeni
  rationale: Amri ya wingi kutoka שבח yenye kiambishi cha nafsi ya tatu umoja wa kiume. “Mtukuzeni” huwasilisha sifa kuu na kuhifadhi tofauti ya kishairi na הלל bila kurudia tu “msifuni.”
- source_word: כָּל הָאֻמִּים
  choice: enyi watu wote
  rationale: אֻמִּים hurejelea jamii au makundi ya watu. “Watu wote” hudumisha usambamba wa kishairi na “mataifa yote” pamoja na tofauti ndogo ya msamiati wa Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandiko ya Kiebrania yanatumia moja kwa moja Tetragramatoni יְהוָה. “Yahweh” huhifadhi jina la Mungu; tanbihi inaonyesha desturi mbadala ya kulitafsiri kwa cheo “BWANA” bila kuficha ushahidi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mistari miwili unahifadhi usambamba wa kishairi; “mataifa” na “watu” yanatofautisha kwa kiasi istilahi sambamba גּוֹיִם na אֻמִּים.
