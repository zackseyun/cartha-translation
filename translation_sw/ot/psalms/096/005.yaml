  yaml_path: translation/ot/psalms/096/005.yaml
  text: For all the gods of the peoples are idols[c][b][a], but Yahweh made the heavens.
translation:
  language: sw
  text: Kwa maana miungu yote ya mataifa ni sanamu[a], lakini Yahweh[b] alizifanya mbingu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sanamu zisizo na thamani.” Neno la Kiebrania linaweza kubeba dhana ya ubatili au kutokuwa na thamani.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania YHWH; kwa kawaida hutafsiriwa “BWANA.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huanzisha sababu ya mwito uliotangulia; ni kiunganishi cha kawaida na cha heshima katika ushairi wa Kiswahili.
- source_word: כָּל
  choice: yote
  rationale: Hudumisha maana jumuishi ya neno la Kiebrania na kupatana kisarufi na 'miungu.'
- source_word: אֱלֹהֵי הָעַמִּים
  choice: miungu yote ya mataifa
  rationale: עם kwa wingi inaweza kumaanisha jamii za watu au mataifa; 'mataifa' ni ya kawaida na wazi katika muktadha huu.
- source_word: אֱלִילִים
  choice: sanamu zisizo na thamani
  rationale: Neno humaanisha sanamu na pia lina dhihaka ya ubatili au kutokuwa na thamani; tafsiri hii huwasilisha maana zote bila kulifanya kuwa 'si kitu' kabisa.
- source_word: וַיהוָה
  choice: lakini Yahwe
  rationale: ו inaonyesha ulinganisho mkali hapa, hivyo 'lakini' ni ya asili. Jina la agano YHWH limetafsiriwa kwa 'Yahwe.'
- source_word: שָׁמַיִם
  choice: mbingu
  rationale: Ni tafsiri ya kawaida ya nomino ya Kiebrania inayoweza kurejelea anga au mbingu.
- source_word: עָשָׂה
  choice: ndiye aliyezifanya
  rationale: Kitenzi kina maana pana ya kufanya au kutengeneza. 'Alizifanya' ni sahihi kuliko 'aliumba,' ambalo lingekuwa maalumu zaidi; 'ndiye' hukazia utofauti uliomo katika mstari.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, YHWH. 'Yahwe' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Hadhi ya miungu ya mataifa
  choice: sanamu zisizo na thamani
  alternative: sanamu; vitu visivyo kitu
  rationale: אֱלִילִים lina maana ya sanamu huku likibeba dhihaka ya ubatili au kutokuwa na thamani. Tafsiri haidai moja kwa moja kwamba hazipo kabisa, hivyo inadumisha upeo wa kauli ya Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Muundo wa ulinganisho kati ya miungu ya mataifa na Yahwe Muumba umehifadhiwa.
