id: PSA.96.10
reference: Psalms 96:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אִמְר֤וּ בַ/גּוֹיִ֨ם יְה֘וָ֤ה מָלָ֗ךְ אַף תִּכּ֣וֹן תֵּ֭בֵל בַּל תִּמּ֑וֹט יָדִ֥ין עַ֝מִּ֗ים בְּ/מֵישָׁרִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/010.yaml
  text: Say among the nations[a], “Yahweh reigns! Indeed, the world is established; it shall not be moved[c][b]. He will judge the peoples with equity.”
translation:
  language: sw
  text: Semeni miongoni mwa mataifa, “Yahwe anatawala![a] Naam, ulimwengu[b] umewekwa imara; hautatikisika. Atawahukumu watu kwa haki.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe ni mfalme,” au “Yahwe amekuwa mfalme.” Kiebrania kinaweza kueleweka kuwa tangazo la utawala wake wa sasa au la kutawazwa kwake.
    reason: alternative_reading
  - marker: b
    text: Au, “ulimwengu unaokaliwa na watu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa unyofu” au “kwa usawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ
  choice: Semeni
  rationale: Ni amri ya wingi ya kusema; umbo hili ni la moja kwa moja na linafaa kwa tangazo la hadharani.
- source_word: בַגּוֹיִם
  choice: miongoni mwa mataifa
  rationale: Kiambishi ב hapa kinaonyesha eneo au mazingira ya tangazo, huku גּוֹיִם ikihifadhi upeo wa mataifa yote.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa tahajia ya kawaida na inayotamkika kwa Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: מָלָךְ
  choice: anatawala
  rationale: Katika tangazo hili la kifalme, qatal inaweza kueleza utawala wa sasa; tafsiri hii hailazimishi maana kwamba ndipo ameanza kuwa mfalme.
- source_word: אַף
  choice: Naam
  rationale: Neno hili linaendeleza tangazo kwa mkazo wa uthibitisho.
- source_word: תִּכּוֹן
  choice: umewekwa imara
  rationale: Nifali ya כון inaonyesha hali ya kuimarishwa au kuthibitishwa; tafsiri hii inadumisha maana ya kutendewa na matokeo yake.
- source_word: תֵּבֵל
  choice: ulimwengu
  rationale: Neno hili mara nyingi humaanisha ulimwengu kama makao yenye utaratibu; ‘ulimwengu’ ni fasaha na ya kawaida katika Kiswahili.
- source_word: בַּל תִּמּוֹט
  choice: hautatikisika
  rationale: Kitenzi kinaonyesha kutoyumbishwa au kutosogezwa kutoka katika hali imara; ‘hautatikisika’ ni ya kishairi na ya asili.
- source_word: יָדִין
  choice: Atawahukumu
  rationale: דין hapa ina maana ya kutoa hukumu katika muktadha wa utawala wa kifalme, bila kuondoa wazo pana la kuongoza.
- source_word: עַמִּים
  choice: watu
  rationale: Wingi huu wa makundi ya wanadamu unatofautishwa na ‘mataifa’ yaliyotajwa awali; ‘watu’ ni ya kawaida katika Kiswahili na huhifadhi upeo wa makundi mengi kwa muktadha.
- source_word: בְּמֵישָׁרִים
  choice: kwa haki
  rationale: מֵישָׁרִים huonyesha unyofu, usawa, na uadilifu; ‘kwa haki’ ni usemi wa kawaida katika muktadha wa hukumu na unaeleza hukumu isiyopendelea.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Hali ya tendo katika מָלָךְ ndani ya tangazo la kifalme
  choice: anatawala
  alternative: ni mfalme au amekuwa mfalme
  rationale: Kiebrania kinaweza kueleweka kama tangazo la utawala uliopo au la kutawazwa. Maandishi makuu yanatumia tangazo la sasa, huku tanbihi ikihifadhi uwezekano mwingine bila kuamua kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. ‘Naam’ huleta mkazo wa zaburi bila kuwa chakale sana; sentensi fupi huhifadhi nguvu ya tangazo la kifalme.
