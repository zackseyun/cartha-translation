  text: הָב֣וּ לַ֭/יהוָה מִשְׁפְּח֣וֹת עַמִּ֑ים הָב֥וּ לַ֝/יהוָ֗ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/007.yaml
  text: Ascribe to Yahweh[a], families of the peoples[c][b], ascribe to Yahweh glory and strength.
translation:
  language: sw
  text: Mpeni Yahweh[a], enyi koo za mataifa[b], mpeni Yahweh utukufu na nguvu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “BWANA.” Hapa “Yahweh” linawakilisha jina la Mungu יהוה (YHWH).
    reason: alternative_reading
  - marker: b
    text: Au “jamaa za mataifa” au “familia za mataifa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: Mpeni
  rationale: Imperativi hii kimsingi ni ‘toeni/mpeni,’ lakini katika mwito huu wa ibada humaanisha kumtambulia Mungu sifa zinazomstahili. ‘Mpeni’ huhifadhi taswira ya Kiebrania na ni ya kawaida katika lugha ya ibada.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Kiambishi ל־ humtambulisha anayeelekezewa mwito, na jina la Mungu יהוה limetafsiriwa moja kwa moja kuwa ‘Yahweh.’
- source_word: מִשְׁפְּחוֹת עַמִּים
  choice: jamaa za mataifa
  rationale: מִשְׁפְּחוֹת ni vikundi vya ukoo au jamaa, na עַמִּים ni makundi ya watu au mataifa. ‘Jamaa za mataifa’ huhifadhi wazo la vikundi vya ukoo ndani ya jamii mbalimbali.
- source_word: כָּבוֹד
  choice: utukufu
  rationale: Katika muktadha wa ibada, neno hili humaanisha utukufu au heshima inayomstahili Mungu; ‘utukufu’ linafaa kwa mtindo wa kishairi wa zaburi.
- source_word: וָעֹז
  choice: na nguvu
  rationale: עֹז humaanisha nguvu, uwezo, au uweza. ‘Nguvu’ ni tafsiri ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יהוה; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya ‘mpeni’ inapohusishwa na utukufu na nguvu za Mungu
  choice: Kuhimiza watu watambue na kutangaza sifa zinazomstahili Yahweh
  alternative: Kuelewa kwamba wanadamu wanampa Mungu sifa ambazo hakuwa nazo
  rationale: Matumizi ya kishairi ya הָבוּ katika mwito wa ibada ni ya kumtambulia Mungu yaliyo yake; tafsiri haipaswi kudokeza kwamba nguvu au utukufu wa Mungu hutokana na wanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo wa marudio ‘Mpeni Yahweh ... mpeni Yahweh’ umehifadhi usambamba wa Kiebrania. Kihisishi ‘enyi’ kinaonyesha wazi kwamba ‘jamaa za mataifa’ ndizo zinazoitwa.
