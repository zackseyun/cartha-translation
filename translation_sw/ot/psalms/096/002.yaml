lexical_decisions:
- source_word: שִׁירוּ
  choice: Mwimbieni
  rationale: Kitenzi cha kuamuru kwa wingi kinatoa mwito wa moja kwa moja wa kumwimbia Yahweh; hakuna kitu kama ‘sifa’ kilichoongezwa katika Kiebrania.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Kiambishi ל־ kinaonyesha anayeimbiwa, na jina la agano יהוה limetolewa kama ‘Yahweh’.
- source_word: בָּרֲכוּ
  choice: libarikini
  rationale: Huhifadhi maana ya msingi ya ברך na utofauti wake na amri iliyotangulia ya kuimba; pia ni usemi wa kibiblia unaoeleweka katika Kiswahili.
- source_word: שְׁמוֹ
  choice: jina lake
  rationale: Ni tafsiri ya moja kwa moja ya שם pamoja na kiambishi cha nafsi ya tatu umoja, ikihifadhi usemi wa Kiebrania kuhusu utambulisho na sifa yake.
- source_word: בַּשְּׂרוּ
  choice: tangazeni
  rationale: Amri hii ina maana ya kutangaza habari, mara nyingi habari njema. ‘Tangazeni’ ni ya kawaida na yenye nguvu katika Kiswahili, huku maana mahsusi ya habari njema ikihifadhiwa katika tanbihi.
- source_word: מִיּוֹם לְיוֹם
  choice: siku baada ya siku
  rationale: Usemi huu wa Kiswahili unaonyesha mwendelezo na kurudiwa kila siku kwa njia ya kawaida na iliyo karibu na nahau ya Kiebrania.
- source_word: יְשׁוּעָתוֹ
  choice: wokovu wake
  rationale: ‘Wokovu’ huwasilisha maana pana ya ישועה, inayoweza kujumuisha kuokolewa au kukombolewa, na inafaa katika muktadha wa ibada.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano יהוה. ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya ישועה
  choice: wokovu
  alternative: ukombozi; ushindi
  rationale: Neno la Kiebrania lina wigo mpana. ‘Wokovu’ huhifadhi maana yake ya jumla bila kuibana kuwa ukombozi wa aina fulani au ushindi wa kijeshi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa amri tatu na vifungu vifupi umehifadhiwa.
