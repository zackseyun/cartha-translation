  text: Sing to Yahweh[a]; bless his name; proclaim his salvation from day to day.
translation:
  language: sw
  text: Mwimbieni Yahweh; barikini jina lake; tangazeni[a] wokovu wake siku baada ya siku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tangazeni habari njema za wokovu wake.”
