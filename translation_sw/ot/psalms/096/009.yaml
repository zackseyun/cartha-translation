  text: Worship Yahweh in the splendor of holiness; tremble before him[a], all the earth.
translation:
  language: sw
  text: Mwabuduni Yahweh katika fahari ya utakatifu[a]; tetemekeni mbele zake, enyi dunia yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkiwa katika mavazi matakatifu,” au “katika fahari takatifu.” Kauli ya Kiebrania inaweza kumaanisha fahari ya utakatifu au mapambo, yaani mavazi matakatifu, yanayotumiwa katika ibada.
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁתַּחֲווּ
  choice: Mwabuduni
  rationale: Kitenzi kina maana ya kuinama au kujisujudu kwa heshima. “Mwabuduni” ni Kiswahili cha kawaida kinachowasilisha maana yake ya kidini hapa bila kulazimisha maelezo ya mkao wa mwili.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetoholewa kuwa “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: katika fahari ya utakatifu
  rationale: “Fahari” huwasilisha uzuri, adhama, au pambo linalodokezwa na הדרת, huku “utakatifu” ikidumisha maana pana ya קֹדֶשׁ. Kauli hii haiondoi uwezekano wa maana ya mavazi au mapambo matakatifu.
- source_word: חִילוּ
  choice: tetemekeni
  rationale: Kitenzi kinaweza kueleza kutetemeka au kufadhaika kwa hofu. “Tetemekeni” kinafaa katika wito huu wa kumcha Mungu kwa kicho.
- source_word: מִפָּנָיו
  choice: mbele zake
  rationale: Hii ni tafsiri ya asili ya Kiswahili kwa wazo la kuwa mbele ya uso au uwepo wake.
- source_word: כָּל הָאָרֶץ
  choice: enyi dunia yote
  rationale: Muktadha ni mwito wa ulimwengu mzima. Kihisishi “enyi” kinafanya wazi kwamba dunia yote inaambiwa moja kwa moja, kama inavyodokezwa na amri ya wingi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina maalumu la Mungu. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya בְּהַדְרַת קֹדֶשׁ
  choice: katika fahari ya utakatifu
  alternative: mkiwa katika mavazi matakatifu
  rationale: Muundo wa Kiebrania unaweza kumaanisha fahari au uzuri unaohusishwa na utakatifu, au pambo/mavazi matakatifu ya waabudu. Maandishi makuu yanadumisha maana pana ya kishairi, na uwezekano mwingine umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Umbo “mbele zake” linadumisha hadhi ya lugha ya zaburi bila kuwa la kizamani kupita kiasi.
