  variant: Standard East African Swahili
source:
  edition: WLC
  text: לִ/פְנֵ֤י יְהוָ֨ה כִּ֬י בָ֗א כִּ֥י בָא֮ לִ/שְׁפֹּ֪ט הָ֫/אָ֥רֶץ יִשְׁפֹּֽט תֵּבֵ֥ל בְּ/צֶ֑דֶק וְ֝/עַמִּ֗ים בֶּ/אֱמוּנָתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/013.yaml
  text: before Yahweh[a], for he is coming, for he is coming to judge the earth. He will judge the world with righteousness[c][b], and the peoples with his faithfulness.
translation:
  language: sw
  text: mbele za Yahwe, kwa maana anakuja, anakuja[a] kuihukumu dunia. Ataihukumu ulimwengu kwa haki, na mataifa[b] kwa uaminifu wake.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinarudia kitenzi “anakuja” ili kusisitiza kuja kwake.
    reason: lexical_alternative
  - marker: b
    text: Au “jamii za watu.”
    reason: lexical_alternative
  - marker: c
    text: Au “kwa ukweli wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: mbele za
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha kuwa tendo linafanyika mbele ya, au katika uwepo wa, Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: כִּי בָא ... כִּי בָא
  choice: kwa maana anakuja, naam, anakuja
  rationale: Wakati uliotumika katika ushairi huu unaonyesha kuja kwa hakika na kwa karibu. Urudiaji umehifadhiwa ili kudumisha msisitizo wa Kiebrania.
- source_word: לִשְׁפֹּט
  choice: kuihukumu
  rationale: Ingawa kitenzi kinaweza pia kuhusisha kutawala, mistari inayofuata inakazia hukumu inayotolewa kwa haki na uaminifu.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: Ulinganifu wake na תֵּבֵל unaonyesha maana ya dunia yote, si nchi fulani tu.
- source_word: תֵּבֵל
  choice: ulimwengu
  rationale: Neno hili humaanisha ulimwengu unaokaliwa na wenye utaratibu; “ulimwengu” ni sawa la asili katika muktadha huu wa kishairi.
- source_word: בְּצֶדֶק
  choice: kwa haki
  rationale: Tafsiri hii inadumisha sifa ya kimaadili na ya kimahakama ya hukumu ya Mungu bila kuifafanua kupita maandishi.
- source_word: וְעַמִּים
  choice: na jamii za watu
  rationale: Wingi wa עַם unaonyesha makundi mengi ya watu. “Jamii za watu” huhifadhi tofauti hiyo, huku “mataifa” likibaki chaguo linalowezekana.
- source_word: בֶּאֱמוּנָתוֹ
  choice: kwa uaminifu wake
  rationale: אֱמוּנָה hapa huonyesha uthabiti, kutegemeka na uaminifu. Tafsiri hii inaonyesha kuwa hukumu yake inalingana na tabia yake ya kutegemeka.
theological_decisions:
- issue: Tabia ya hukumu ya Mungu katika ushairi huu
  choice: Kudumisha lugha ya “kuhukumu” bila kuipunguza iwe “kutawala” tu wala kuipanua kuwa maelezo kamili ya hukumu ya mwisho.
  alternative: Kutafsiri “kutawala,” au kuongeza wazi kuwa ni hukumu ya mwisho.
  rationale: Kifungu kinatangaza kwamba Yahwe anakuja kuihukumu dunia yote, lakini hakitoi hapa maelezo yote ya namna au wakati wa hukumu hiyo.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Unukuzi “Yahwe” huhifadhi jina binafsi lililo katika matini ya Kiebrania badala ya kulibadilisha kuwa cheo.
- issue: Maana ya אֱמוּנָה katika hukumu
  choice: uaminifu wake
  alternative: ukweli wake
  rationale: “Uaminifu” huonyesha kutegemeka kwa Mungu, huku uwezekano wa maana ya “ukweli” ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Urudiaji wa Kiebrania umehifadhiwa kwa mtiririko wa asili kwa kutumia “naam,” na istilahi za hukumu zimeachwa bila maelezo ya kimadhehebu.
