review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the universal scope of הארץ/תבל, the judicial force of לשפט, and the two standards of judgment, righteousness and God's faithfulness. It retains the emphatic repetition of בא. However, the inserted “naam” is not present in the Hebrew and slightly recasts the repetition as an affirmation; a direct repeated verb better preserves the source.
  naturalness: “Jamii za watu” is understandable but is comparatively cumbersome and less idiomatic in this poetic line. “Mataifa” is the natural Standard East African Swahili rendering in this context; its possible broader sense is suitably acknowledged in a footnote. Replacing the archaic alternative “yuaja” in the note also better serves modern usage.
  terminology: “Yahwe,” “kuhukumu,” “haki,” and “uaminifu wake” are suitable renderings. “Uaminifu wake” appropriately conveys the reliability/faithfulness sense of אֱמוּנָתוֹ without importing a doctrinal elaboration.
  issues:
  - severity: medium
    issue: The word “naam” is added between the two occurrences of “anakuja.”
    rationale: Although it attempts to express emphasis, it is not represented by a distinct Hebrew word and changes the form of the source's simple verbal repetition. Retain the repeated verb directly.
  - severity: low
    issue: “Jamii za watu” is a heavy rendering of עמים in this poetic context.
    rationale: “Mataifa” is more idiomatic and natural in Standard East African Swahili. A note can retain “jamii za watu” as an alternative where the people-group nuance is desired.
  - severity: low
    issue: The footnote's alternative “yuaja” is archaic.
    rationale: The requested target is natural modern Standard East African Swahili; “anakuja” already expresses the intended imminent/certain coming naturally.
  revised_text: mbele za Yahwe, kwa maana anakuja, anakuja[a] kuihukumu dunia. Ataihukumu ulimwengu kwa haki, na mataifa[b] kwa uaminifu wake.[c]
