  text: For Yahweh is great and greatly to be praised[c][b][a]; he is to be feared above all gods.
translation:
  language: sw
  text: Kwa maana Yahweh ni mkuu, naye anastahili kusifiwa sana; ni wa kuogopwa[a] kuliko miungu yote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anapaswa kuogopwa.” Neno la Kiebrania humweleza Yahweh kuwa mwenye kuamsha hofu yenye uchaji.
    reason: lexical_alternative
  - marker: b
    text: “Miungu” inaweza kumaanisha miungu ya mataifa; mstari unaofuata unaieleza kuwa sanamu zisizo na thamani.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya wito wa kumwabudu Yahweh katika muktadha unaozunguka mstari huu.
- source_word: גָדוֹל
  choice: ni mkuu
  rationale: Huwasilisha ukuu wa hadhi na utukufu kwa Kiswahili cha kawaida na chenye heshima.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Linahifadhi jina binafsi la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadili kuwa cheo.
- source_word: וּמְהֻלָּל מְאֹד
  choice: na anastahili kusifiwa sana
  rationale: Kirai cha Kiebrania kwa uhalisia ni ‘amesifiwa sana’; tafsiri hii ya kimuktadha huonyesha sifa inayomstahili na ni ya kawaida katika Kiswahili.
- source_word: נוֹרָא הוּא
  choice: anapaswa kuogopwa
  rationale: Huhifadhi maana ya kwamba yeye huamsha hofu yenye uchaji, bila kudhoofisha neno kuwa ‘wa kushangaza’ tu.
- source_word: עַל כָּל אֱלֹהִים
  choice: kuliko miungu yote
  rationale: עַל hapa huonyesha ulinganisho na ubora; ‘miungu’ linahifadhi neno la Kiebrania bila kulitafsiri moja kwa moja kuwa sanamu.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja; ‘Yahweh’ huhifadhi jina hilo badala ya kutumia cheo.
- issue: Maana ya אֱלֹהִים katika muktadha huu
  choice: miungu
  alternative: viumbe vya kimungu / sanamu
  rationale: Mstari wenyewe unasema ‘miungu’; mstari unaofuata ndio unaoeleza kuwa miungu ya mataifa ni sanamu zisizo na thamani, hivyo tafsiri haipaswi kutanguliza ufafanuzi huo.
- issue: Nguvu ya נוֹרָא
  choice: anapaswa kuogopwa
  alternative: ni wa kutisha / ni wa kuogofya
  rationale: Chaguo hili linahifadhi mvutano kati ya hofu na uchaji katika ibada bila kulifanya neno liwe hofu ya kitisho pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, rahisi kueleweka na chenye hadhi. Muundo ‘anastahili kusifiwa sana’ umetumiwa badala ya uhalisia mgumu ‘amesifiwa sana,’ huku ‘anapaswa kuogopwa’ kikihifadhi nguvu ya hofu yenye uchaji.
