  text: יִשְׂמְח֣וּ הַ֭/שָּׁמַיִם וְ/תָגֵ֣ל הָ/אָ֑רֶץ יִֽרְעַ֥ם הַ֝/יָּ֗ם וּ/מְלֹאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/011.yaml
  text: Let the heavens rejoice[a], and let the earth be glad; let the sea thunder, and all that fills it.
translation:
  language: sw
  text: Mbingu na zifurahi, dunia na ishangilie; bahari na ingurume[a], pamoja na vyote vinavyoijaza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bahari na ivume, pamoja na vyote vilivyomo.”
    reason: mbadala wa kimsamiati wa יִרְעַם; “ivume” huonyesha maana ya “roar,” ilhali “ingurume” huhifadhi vyema mwangwi wa radi katika neno la Kiebrania.
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: na zifurahi
  rationale: Kauli isiyokamilika ya Kiebrania ina nguvu ya kutakia au kuhimiza katika mfululizo huu wa kishairi; muundo wa “na ...” unaonyesha mwito huo kwa Kiswahili cha kawaida.
- source_word: הַשָּׁמַיִם
  choice: mbingu
  rationale: “Mbingu” huhifadhi upana wa ulimwengu na hadhi ya kishairi ya wingi wa Kiebrania.
- source_word: וְתָגֵל
  choice: na ishangilie
  rationale: Kitenzi גיל huonyesha furaha kuu au shangwe. “Ishangilie” hutofautisha kwa kiasi maana yake na שׂמח huku ikidumisha ulinganifu wa kishairi.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: Katika muktadha wa mbingu, dunia na bahari, neno hili linamaanisha dunia kwa upana, si nchi fulani.
- source_word: יִרְעַם
  choice: na ingurume
  rationale: רעם humaanisha kutoa sauti kubwa kama radi. Kwa bahari, “ingurume” ni taswira ya asili na yenye nguvu, huku ikihifadhi mwangwi wa sauti ya radi.
- source_word: הַיָּם
  choice: bahari
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa ים katika muktadha huu.
- source_word: וּמְלֹאוֹ
  choice: pamoja na vyote vinavyoijaza
  rationale: Kihalisi ni “na ujazo wake”; msemo huo unahusu kila kitu kilichomo baharini. Tafsiri hii ni ya kawaida na bado inadumisha taswira ya kuijaza.
theological_decisions:
- issue: Nguvu ya kutakia au kuhimiza ya vitenzi vya kishairi visivyokamilika
  choice: 'Kuvitafsiri kama mwito: “Mbingu na zifurahi ... bahari na ingurume.”'
  alternative: 'Kutafsiri kama wakati ujao: “Mbingu zitafurahi ... bahari itanguruma.”'
  rationale: Katika mashairi ya sifa ya Kiebrania, maumbo haya mara nyingi huwa na nguvu ya kutakia au kuhimiza. Muktadha wa zaburi unaita viumbe kushangilia, hivyo muundo wa mwito unaakisi kazi ya sentensi bila kuongeza fundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na hadhi inayofaa Zaburi. Muundo wa “na + kiima + kitenzi cha kutakia” umetumiwa ili kuonyesha mwito wa kishairi kwa njia ya asili. Hakuna tanbihi iliyowekwa kwa sababu data ya Kiingereza inaonekana kuhusisha alama [a] na mbadala usiolingana na sehemu iliyotiwa alama; mbadala “bahari na ivume, pamoja na vyote vilivyomo” tayari unaakisiwa vya kutosha na tafsiri kuu bila kuhitaji tanbihi.
