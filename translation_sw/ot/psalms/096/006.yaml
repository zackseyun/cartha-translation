  text: הוֹד וְ/הָדָ֥ר לְ/פָנָ֑י/ו עֹ֥ז וְ֝/תִפְאֶ֗רֶת בְּ/מִקְדָּשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/006.yaml
  text: Splendor and majesty are before him[a]; strength and beauty are in his sanctuary.
translation:
  language: sw
  text: Fahari na adhama ziko mbele zake; nguvu na uzuri[a] zimo katika patakatifu pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utukufu” au “fahari.” Neno la Kiebrania תִפְאֶרֶת linaweza pia kutafsiriwa kwa njia hizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד
  choice: fahari
  rationale: Neno hili linaonyesha uangavu na utukufu wenye heshima. “Fahari” ni la kishairi na la kawaida, na linatofautishwa na הָדָר.
- source_word: הָדָר
  choice: adhama
  rationale: Katika jozi hii ya kishairi, neno hili lina maana ya ukuu wenye heshima. “Adhama” linahifadhi picha ya enzi na ukuu.
- source_word: לְפָנָיו
  choice: mbele zake
  rationale: Hii inafuata moja kwa moja taswira ya Kiebrania ya kuwa mbele yake, bila kuibadili kuwa maelezo ya kufasiri zaidi kama “katika uwepo wake.”
- source_word: עֹז
  choice: nguvu
  rationale: “Nguvu” ni tafsiri ya kawaida na wazi ya עֹז na inalingana vizuri na neno linalofuata katika usambamba wa kishairi.
- source_word: תִפְאֶרֶת
  choice: uzuri
  rationale: Neno hili linaweza kumaanisha uzuri, fahari, au utukufu. “Uzuri” linaonyesha upande wa kupendeza kwa macho na huepuka kurudia “fahari” ya sehemu ya kwanza, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: בְּמִקְדָּשׁוֹ
  choice: katika patakatifu pake
  rationale: מִקְדָּשׁ ni mahali patakatifu au patakatifu pa ibada. “Patakatifu pake” ni usemi mfupi, wa heshima, na hauibani maana kuwa hekalu pekee.
theological_decisions:
- issue: Marejeo ya viambishi vya nafsi katika “mbele zake” na “patakatifu pake”
  choice: Viambishi vinamrejelea BWANA kulingana na muktadha wa zaburi.
  alternative: Kutaja “BWANA” wazi badala ya kutumia viambishi vya nafsi.
  rationale: Ingawa jina la Mungu halirudiwi katika mstari huu, muktadha wa karibu unamwelezea BWANA. Kuhifadhi viambishi vya nafsi kunadumisha mtiririko wa kishairi wa Kiebrania bila kuongeza jina lisilomo katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa heshima lakini kinachoeleweka kwa wasomaji wa kawaida. “Ziko” na “zimo” zimetumiwa kuonyesha tofauti ya kuwa mbele yake na kuwa ndani ya patakatifu pake.
