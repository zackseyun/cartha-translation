  text: הָב֣וּ לַ֭/יהוָה כְּב֣וֹד שְׁמ֑/וֹ שְׂאֽוּ מִ֝נְחָ֗ה וּ/בֹ֥אוּ לְ/חַצְרוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/008.yaml
  text: Ascribe to Yahweh the glory of his name[a]; bring an offering and come into his courts.
translation:
  language: sw
  text: Mpeni Yahweh utukufu unaostahili jina lake; leteeni sadaka[a], nanyi mje nyuani mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zawadi” au “zawadi ya heshima.” Neno la Kiebrania linaweza kumaanisha zawadi, zawadi ya heshima, au sadaka, kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: Mpeni
  rationale: Katika kauli hii ya kishairi, kitenzi hiki ni agizo la kumtambulia Yahweh utukufu unaohusishwa na jina lake, si kumpa kitu alichopungukiwa nacho. “Mpeni” huhifadhi agizo na ni usemi wa kawaida katika Kiswahili cha ibada.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetolewa kwa namna ya “Yahweh,” likihifadhi jina la agano lililo katika maandishi ya Kiebrania.
- source_word: כְּבוֹד
  choice: utukufu
  rationale: Neno hili humaanisha uzito wa heshima, fahari, au utukufu. “Utukufu” linafaa kwa muktadha wa kumwabudu Mungu na kudumisha uzito wa maana ya Kiebrania.
- source_word: שְׁמוֹ
  choice: wa jina lake
  rationale: Tafsiri hii huhifadhi usemi halisi wa Kiebrania bila kuufafanua kupita kiasi; “jina” linaweza kujumuisha sifa na jinsi Mungu anavyojifunua.
- source_word: שְׂאוּ
  choice: leteni
  rationale: Ingawa kitenzi hiki kimsingi kinaweza kumaanisha kuinua au kubeba, kinapotumiwa pamoja na מִנְחָה humaanisha kuleta zawadi au sadaka.
- source_word: מִנְחָה
  choice: sadaka
  rationale: Katika muktadha huu wa ibada, “sadaka” ni neno pana na la kawaida. Hata hivyo, neno la Kiebrania linaweza pia kumaanisha zawadi au ushuru, jambo linaloonyeshwa katika tanbihi.
- source_word: וּבֹאוּ
  choice: na mje
  rationale: Huhifadhi agizo la moja kwa moja la Kiebrania na kuunganisha kwa kawaida tendo la kuleta sadaka na kuja katika nyua.
- source_word: לְחַצְרוֹתָיו
  choice: katika nyua zake
  rationale: חֲצֵרוֹת hurejelea nyua za mahali patakatifu. “Katika nyua zake” ni usemi wa asili unaoonyesha kuingia ndani ya eneo hilo.
theological_decisions:
- issue: Namna ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu, יהוה. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kumpa Mungu utukufu
  choice: Mpeni Yahweh utukufu wa jina lake
  alternative: Mhesabieni Yahweh utukufu unaostahili jina lake
  rationale: Tafsiri iliyochaguliwa hufuata muundo wa Kiebrania bila kuongeza wazi wazo la “unaostahili,” ambalo linaeleweka katika muktadha lakini halijasemwa moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi inayofaa zaburi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi na maagizo ya wingi yamehifadhiwa.
