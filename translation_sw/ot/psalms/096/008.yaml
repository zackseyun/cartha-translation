- from: Mpeni Yahweh utukufu wa jina lake; leteni sadaka[a] na mje katika nyua zake.
  to: Mpeni Yahweh utukufu unaostahili jina lake; leteeni sadaka[a], nanyi mje nyuani mwake.
  rationale: The revision clarifies the Hebrew genitive idiom in a way that is natural in standard East African Swahili, keeps the plural imperatives, and uses idiomatic sanctuary language. The footnote preserves the lexical breadth of מִנְחָה without implying a specific sacrificial type.
