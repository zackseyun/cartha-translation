review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the two plural imperatives, the divine name יהוה as Yahweh, כָּבוֹד as utukufu, מִנְחָה broadly as sadaka, and the sanctuary courts. However, “utukufu wa jina lake” is potentially possessive (“the glory belonging to his name”) rather than the Hebrew genitive idiom for the glory owed to/appropriate to his name. “utukufu unaostahili jina lake” expresses the established sense of the psalmic formula without adding a distinct theological claim.
  naturalness: The wording is clear and suitably elevated. “Leteeni” is a natural plural imperative for bringing an offering. “Mje katika nyua zake” is grammatical, but “mje nyuani mwake” is more idiomatic for entering the temple precincts and avoids a slightly wooden locative construction.
  terminology: “Yahweh,” “utukufu,” “sadaka,” and “nyua” are appropriate Standard East African Swahili worship terminology. The footnote’s “ushuru” is a valid lexical possibility for מִנְחָה, though “zawadi ya heshima” more accurately conveys tribute in contemporary Swahili; retain “ushuru” as an alternative only with this clarification.
  issues:
  - severity: medium
    issue: Ambiguity in “utukufu wa jina lake”
    rationale: In Swahili this readily denotes glory possessed by the name, while the Hebrew construction כבוד שמו in this recurrent liturgical idiom means the glory appropriate to or owed to his name. Revision improves semantic fidelity.
  - severity: low
    issue: Footnote alternative “ushuru” can be heard as tax
    rationale: Though lexically defensible, “zawadi ya heshima” better communicates tribute/gift in this context while preserving the broad semantic range.
  revised_text: Mpeni Yahweh utukufu unaostahili jina lake; leteeni sadaka[a], nanyi mje nyuani mwake.
  revised_footnotes:
  - marker: a
    text: Au, “zawadi” au “zawadi ya heshima.” Neno la Kiebrania linaweza kumaanisha zawadi, zawadi ya heshima, au sadaka, kulingana na muktadha.
    reason: lexical_alternative
  revision_rationale: The revision clarifies the Hebrew genitive idiom in a way that is natural in standard East African Swahili, keeps the plural imperatives, and uses idiomatic sanctuary language. The footnote preserves the lexical breadth of מִנְחָה without implying a specific sacrificial type.
