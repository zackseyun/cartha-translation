base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/012.yaml
  text: Let the field exult[a], and all that is in it; then all the trees of the forest will sing for joy.
translation:
  language: sw
  text: Mashamba na yashangilie, na vyote vilivyomo; ndipo miti yote ya msituni itapaza sauti kwa furaha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “itaimba kwa furaha.” Kitenzi cha Kiebrania kinaweza kumaanisha kupaza kilio au sauti ya furaha.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלֹז
  choice: na lishangilie
  rationale: Kitenzi hiki kina nguvu ya wito au tamanio katika ushairi. Muundo wa “na lishangilie” unahifadhi nguvu hiyo na maana ya furaha kuu.
- source_word: שָׂדַי
  choice: shamba
  rationale: Nomino ya umoja inatumika kwa maana ya eneo la mashamba au uwanda kwa ujumla. “Shamba” ni neno la kawaida na linafaa katika uhuishaji wa uumbaji.
- source_word: וְכָל אֲשֶׁר בּוֹ
  choice: pamoja na vyote vilivyomo ndani yake
  rationale: Huhifadhi maana jumuishi ya kila kilichomo shambani kwa Kiswahili cha asili na kinachoeleweka.
- source_word: אָז
  choice: ndipo
  rationale: “Ndipo” huonyesha hatua inayofuata katika mwendo wa kishairi na kudumisha uhusiano wa matukio.
- source_word: יְרַנְּנוּ
  choice: itapaza sauti kwa furaha
  rationale: Kitenzi hiki kinaweza kumaanisha kutoa kilio au sauti kubwa ya furaha. Tafsiri hii inahifadhi upana huo bila kukifunga kwa kuimba pekee.
- source_word: כָּל עֲצֵי יָעַר
  choice: miti yote ya msituni
  rationale: Huhifadhi maana kamili ya כָל na taswira ya miti yote ya msitu ikishiriki katika sifa.
theological_decisions:
- issue: Uumbaji kupewa sifa za kibinadamu katika kusifu
  choice: Kudumisha moja kwa moja taswira ya shamba kushangilia na miti kupaza sauti kwa furaha.
  alternative: Kufafanua kuwa uzuri au wingi wa maumbile ndio unaowafanya wanadamu wasifu.
  rationale: Matini yenyewe huonyesha uumbaji usio wa kibinadamu ukishiriki katika mwitikio wa furaha; kuacha uhuishaji huo kunadumisha upeo wa kishairi na kiteolojia bila maelezo ya ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Upatanisho wa kisarufi wa “shamba” umetumiwa katika “lishangilie,” na uhuishaji wa uumbaji umehifadhiwa.
