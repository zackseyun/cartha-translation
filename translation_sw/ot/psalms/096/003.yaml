  yaml_path: translation/ot/psalms/096/003.yaml
  text: Declare his glory among the nations[a], his wondrous deeds among all the peoples.
translation:
  language: sw
  text: 'Tangazeni utukufu wake miongoni mwa mataifa,

    matendo yake ya ajabu[a] miongoni mwa watu wote.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maajabu yake” au “kazi zake za kustaajabisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: סַפְּרוּ
  choice: Tangazeni
  rationale: Kitenzi cha amri kwa wingi katika piel kinataka kusimulia au kutangaza hadharani. “Tangazeni” kinadumisha sauti ya mwito wa wazi na kinaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: בַגּוֹיִם
  choice: miongoni mwa mataifa
  rationale: גּוֹיִם hapa humaanisha mataifa kwa upana. “Miongoni mwa” huonyesha kuwa tangazo lifanywe katikati yao, bila kuingiza maana finyu ya kidini ya “watu wa Mataifa.”
- source_word: כְּבוֹדוֹ
  choice: utukufu wake
  rationale: כָּבוֹד hujumuisha heshima yenye uzito, fahari na utukufu. “Utukufu” linafaa katika muktadha huu wa sifa na ibada.
- source_word: בְּכָל הָעַמִּים
  choice: miongoni mwa watu wa kila jamii
  rationale: עַמִּים ni wingi wa “watu” kwa maana ya jamii mbalimbali. Usemi huu unatofautisha neno hilo na “mataifa” katika mshororo wa kwanza na kuhifadhi upeo wa wote.
- source_word: נִפְלְאוֹתָיו
  choice: matendo yake ya ajabu
  rationale: Neno hili, kutoka mzizi פלא, huelekeza kwenye matendo ya kushangaza yanayoamsha mshangao. “Matendo yake ya ajabu” huonyesha wazi kwamba yanayorejelewa ni mambo aliyotenda, si hali ya ajabu tu.
theological_decisions:
- issue: Upeo wa tangazo kwa mataifa yote
  choice: Mstari unaamuru utukufu na matendo ya Mungu yatangazwe kwa mataifa na jamii zote za watu.
  alternative: Kuyachukulia maneno hayo kuwa yanawahusu hasa majirani wa karibu wa Israeli.
  rationale: Ulinganifu wa גּוֹיִם na כָּל הָעַמִּים unasisitiza upeo mpana wa kimataifa. Tafsiri inahifadhi upeo huo bila kuingiza mfumo wa kimisioni wa baadaye ambao haujaelezwa moja kwa moja hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, ya heshima na yenye mdundo wa kishairi. Mistari miwili inadumisha ulinganifu wa Kiebrania kati ya “mataifa” na “watu wa kila jamii.”
