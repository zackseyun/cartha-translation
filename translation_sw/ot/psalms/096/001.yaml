  yaml_path: translation/ot/psalms/096/001.yaml
  text: Sing to Yahweh a new song; sing to Yahweh[a], all the earth.
translation:
  language: sw
  text: Mwimbieni Yahweh wimbo mpya; mwimbieni Yahweh[a], dunia yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: «YHWH» (jina la Mungu), ambalo kwa kawaida limetafsiriwa «BWANA».'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁירוּ
  choice: Mwimbieni
  rationale: Ni amri ya wingi kutoka kitenzi שׁיר. Muundo huu wa Kiswahili unaonyesha wazi kwamba Yahwe ndiye anayeimbiwa, bila kuongeza wazo la kumsifu ambalo halikutajwa moja kwa moja.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Kihusishi ל kinaonyesha anayeelekezewa wimbo; katika Kiswahili uhusiano huo umeonyeshwa ndani ya kitenzi «mwimbieni». Jina la Mungu יהוה limetoholewa kuwa «Yahwe».
- source_word: שִׁיר
  choice: wimbo
  rationale: Hili ndilo neno la kawaida la Kiswahili linalolingana na nomino ya Kiebrania yenye maana ya wimbo.
- source_word: חָדָשׁ
  choice: mpya
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kivumishi kinachomaanisha mpya.
- source_word: כָּל הָאָרֶץ
  choice: dunia yote
  rationale: Katika muktadha wa mwito wa ulimwengu mzima wa kumwabudu Mungu, הָאָרֶץ ina maana ya dunia badala ya eneo maalumu la nchi; «dunia yote» ni Kiswahili cha kawaida na wazi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni, jina la Mungu. «Yahwe» huhifadhi jina hilo katika matini, huku tanbihi ikieleza desturi nyingine ya kulitafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio na usambamba wa kishairi wa Kiebrania yamehifadhiwa; alama ya tanbihi imewekwa baada ya kutajwa kwa jina mara ya pili kulingana na safu ya marejeo.
