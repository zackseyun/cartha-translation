  text: Uangazishe uso wako juu ya mtumishi wako; uniokoe kwa[a] upendo wako thabiti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu ya upendo wako thabiti” au “kulingana na upendo wako thabiti.” Kihusishi b- cha Kiebrania hapa kinaweza kueleweka kwa maana kadhaa zinazokaribiana.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִירָה
  choice: Uangazishe
  rationale: Kauli ya kuamuru katika Hiphil ya אור ina maana ya kusababisha mwanga; “uangazishe” ni ombi la kawaida la Kiswahili linalohifadhi maana hiyo.
- source_word: פָנֶיךָ
  choice: uso wako
  rationale: Inahifadhi taswira halisi ya Kiebrania ya uso wa Mungu kama ishara ya kibali chake, badala ya kuibadili kuwa “uwepo wako.”
- source_word: עַל
  choice: juu ya
  rationale: Inaonyesha kibali kinachoelekezwa kwa mtumishi na inafuata kwa karibu muundo wa Kiebrania.
- source_word: עַבְדֶּךָ
  choice: mtumishi wako
  rationale: Katika sala inayomwelekea Mungu, “mtumishi” huwasilisha vizuri uhusiano wa unyenyekevu na huduma bila kuleta maana isiyokusudiwa ya utumwa wa mali.
- source_word: הוֹשִׁיעֵנִי
  choice: uniokoe
  rationale: Kauli hii ya kuamuru yenye kiambishi cha nafsi ya kwanza inaomba kuokolewa; “uniokoe” inafaa kwa hatari ya sasa na pia huhifadhi uzito mpana wa wokovu.
- source_word: בְחַסְדֶּךָ
  choice: kwa upendo wako thabiti
  rationale: “Upendo thabiti” huonyesha uaminifu na upendo wa kudumu uliomo katika חסד. “Kwa” huhifadhi kwa kawaida uwezekano wa kueleweka kama njia au msingi wa kuokoa.
theological_decisions:
- issue: Tafsiri ya חסד
  choice: upendo wako thabiti
  alternative: rehema yako; upendo wako wa agano
  rationale: “Upendo thabiti” ni lugha inayoeleweka na inayobeba dhana ya upendo mwaminifu na wa kudumu bila kuingiza istilahi nzito au ya kimadhehebu.
- issue: Maana ya kiambishi ב katika בְחַסְדֶּךָ
  choice: kwa
  alternative: kwa sababu ya; sawasawa na
  rationale: Kiebrania kinaruhusu maana zinazokaribiana za chombo, msingi, au kipimo. “Kwa” ni fupi na ya kawaida, huku tanbihi ikihifadhi uwezekano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya “uso” imehifadhiwa, na sentensi mbili za ombi zimeunganishwa kwa alama ya nuktamkato.
