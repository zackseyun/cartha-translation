  text: I am forgotten like a dead man[a], out of mind[b]; I have become like a vessel that is lost.
translation:
  language: sw
  text: Nimesahauliwa kama mtu aliyekufa; sikumbukwi tena; nimekuwa kama chombo kilichopotea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chombo kilichoharibika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁכַּחְתִּי
  choice: Nimesahauliwa
  rationale: Nifali timilifu ya nafsi ya kwanza inaonyesha hali iliyotokana na kusahauliwa; Kiswahili cha wakati timilifu kinaeleza kwa kawaida hali hiyo inayoendelea.
- source_word: כְּמֵת
  choice: kama mtu aliyekufa
  rationale: Kiambishi כְּ kinaonyesha ulinganisho, na מֵת ni umoja; tafsiri hii inadumisha picha ya mtu mmoja aliyekufa.
- source_word: מִלֵּב
  choice: wala sikumbukwi tena
  rationale: Kwa neno ni ‘kutoka moyoni,’ lakini לֵב hapa huhusu mawazo au kumbukumbu. Usemi huu wa Kiswahili unawasilisha maana ya kutokuwamo tena katika kumbukumbu bila kutafsiri nahau hiyo kwa ukakasi.
- source_word: הָיִיתִי
  choice: nimekuwa
  rationale: Qal timilifu ya היה inaeleza hali ambayo msemaji ameingia na ambayo ndiyo hali yake sasa.
- source_word: כִּכְלִי
  choice: kama chombo
  rationale: כְּלִי ni neno pana linaloweza kumaanisha chombo, kifaa, au kitu cha matumizi; ‘chombo’ kinahifadhi picha bila kubainisha aina yake kupita kiasi.
- source_word: אֹבֵד
  choice: kilichopotea
  rationale: Kirai cha participle kinaweza kumaanisha kilichopotea, kinachoangamia, au kilichoharibika. ‘Kilichopotea’ ni cha kawaida na huhifadhi maana kuu huku tanbihi ikionyesha uwezekano wa ‘kilichoharibika.’
