  text: תּוֹצִיאֵ֗/נִי מֵ/רֶ֣שֶׁת ז֭וּ טָ֣מְנוּ לִ֑/י כִּֽי אַ֝תָּה מָֽעוּזִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/004.yaml
  text: Bring me out of this net that they have hidden for me[a], for you are my stronghold.
translation:
  language: sw
  text: Unitoe kutoka katika wavu huu walionifichia[a], kwa maana wewe ndiwe ngome yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Unitoe kutoka katika wavu ambao walionifichia.” Neno la Kiebrania linaweza kueleweka kama “wavu huu” au “wavu ambao.” Taswira katika hali zote ni ya wavu uliofichwa kwa kusudi la kumnasa mwombaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹצִיאֵנִי
  choice: Unitoe
  rationale: Hifili ya יצא ina maana ya kusababisha mtu atoke. Katika muktadha wa ombi la zaburi, ‘Unitoe’ ni Kiswahili cha kawaida kinachohifadhi wazo la kumtoa mtu mahali alikonaswa.
- source_word: מֵרֶשֶׁת
  choice: katika wavu
  rationale: רֶשֶׁת ni wavu halisi, ingawa hapa umetumiwa kama picha ya mtego. ‘Wavu’ inadumisha taswira halisi ya Kiebrania badala ya kuibadili moja kwa moja kuwa ‘mtego.’
- source_word: זוּ
  choice: huu
  rationale: זוּ inaweza kuwa na nguvu ya kuonyesha kitu maalumu au ya kuunganisha kishazi. ‘Huu’ inaonyesha wavu maalumu unaozungumziwa, huku tanbihi ikihifadhi uwezekano wa maana ya ‘ambao.’
- source_word: טָמְנוּ לִי
  choice: walionifichia
  rationale: טמן humaanisha kuficha au kusitiri. ‘Walionifichia’ huhifadhi tendo la kuuficha wavu kwa nia ya kumnasa msemaji, bila kubadili kitenzi kuwa ‘tega.’
- source_word: כִּי
  choice: kwa maana
  rationale: כִּי inatoa sababu ya ombi. ‘Kwa maana’ huunganisha ombi hilo na msingi wake katika ulinzi wa Mungu.
- source_word: מָעוּזִּי
  choice: ngome yangu
  rationale: מָעוֹז humaanisha mahali au chanzo cha nguvu na ulinzi. ‘Ngome yangu’ ni taswira ya kawaida na yenye hadhi katika Kiswahili, inayohifadhi wazo la ulinzi imara.
theological_decisions:
- issue: Taswira ya Mungu kuwa ulinzi wenye nguvu
  choice: wewe ndiwe ngome yangu
  alternative: wewe ndiwe kimbilio langu; wewe ndiwe boma langu
  rationale: Kiebrania kinamtaja Mungu kwa sitiari ya mahali penye nguvu na ulinzi. ‘Ngome’ huhifadhi uzito wa taswira hiyo bila kuifanya kuwa dai finyu la kimafundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. ‘Unitoe’ inafaa kama ombi, na ‘ngome’ inadumisha sitiari ya ulinzi wenye nguvu.
