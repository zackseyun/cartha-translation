  source_fidelity: The main rendering preserves the causative plea ('Unitoe'), the concrete image of a net, the concealed/hostile action, and God as the psalmist's protective stronghold. However, 'kutoka katika' makes the Hebrew preposition ('from/out of') explicit and avoids any possible reading of 'katika wavu' as merely 'in the net.'
  naturalness: The revised wording is natural Standard East African Swahili and retains a restrained poetic register. 'Ngome yangu' is idiomatic and suitably strong.
  terminology: '''Wavu'' accurately retains רֶשֶׁת rather than prematurely interpreting it as ''mtego.'' ''Ngome yangu'' is an appropriate rendering of מָעוּזִּי. The footnote is revised so that its alternative clearly represents the demonstrative-versus-relative syntactic possibility without obscuring the sense ''out of/from.'''
  issues:
