translation:
  language: sw
  text: Kwa maana nimesikia minong’ono[a] ya wengi—hofu pande zote!—waliposhauriana pamoja dhidi yangu, wakipanga kuuchukua uhai wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shtaka la wengi” au “uvumi wa wengi.” Neno la Kiebrania linaweza kumaanisha minong’ono, uvumi, au usemi wa kashfa.
