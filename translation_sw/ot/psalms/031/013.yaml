lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya dhiki ya mtunga zaburi katika muktadha, bila kuifanya maana kuwa finyu kupita kiasi.
- source_word: שָׁמַעְתִּי
  choice: nimesikia
  rationale: Kauli timilifu ya Kiswahili inaonyesha tendo la kusikia lenye athari inayoendelea katika hali ya sasa.
- source_word: דִּבַּת רַבִּים
  choice: minong’ono ya wengi
  rationale: Nomino inaweza kumaanisha minong’ono, uvumi, habari mbaya, au masingizio; hapa 'minong’ono' inafaa mazingira ya njama huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: מָגוֹר מִסָּבִיב
  choice: hofu kuu pande zote
  rationale: Ni usemi wa hofu inayomzunguka mtu; 'hofu kuu pande zote' ni ya asili katika Kiswahili na inadumisha taswira hiyo.
- source_word: בְּהִוָּסְדָם יַחַד עָלַי
  choice: walipofanya shauri pamoja dhidi yangu
  rationale: Hutoa maana ya kushauriana kwa uratibu na kwa nia ya uadui, bila kuongeza maelezo yasiyokuwamo wazi katika maandishi.
- source_word: לָקַחַת נַפְשִׁי
  choice: kuutoa uhai wangu
  rationale: נֶפֶשׁ hapa ni uhai wa mtunga zaburi, si lazima nafsi isiyo ya kimwili; usemi huu unaonyesha tishio la kumuua.
- source_word: זָמָמוּ
  choice: wakipanga
  rationale: Inaonyesha kupanga kwa makusudi jambo la uadui na kuunganika kwa kawaida na shauri lililotajwa awali.
