  text: יְֽהוָ֗ה אַל אֵ֭בוֹשָׁה כִּ֣י קְרָאתִ֑י/ךָ יֵבֹ֥שׁוּ רְ֝שָׁעִ֗ים יִדְּמ֥וּ לִ/שְׁאֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/017.yaml
  text: O Yahweh[a], let me not be put to shame, for I call on you; let the wicked be put to shame; let them be silent in Sheol.
translation:
  language: sw
  text: 'Ee Yahweh, nisiaibike,

    kwa maana nimekuita;

    waovu waaibike;

    na wanyamaze katika Sheoli.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watulie katika Sheoli,” au, “washuke Sheoli kimya.” Kitenzi cha Kiebrania kinaweza kumaanisha kunyamaza au kutulia. “Sheoli” ni makao ya wafu, si lazima jehanamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la agano limetoholewa kuwa “Yahwe,” na “Ee” linaonyesha kwamba mtunga zaburi anamwita Mungu moja kwa moja.
- source_word: אַל אֵבוֹשָׁה
  choice: nisije nikaaibika
  rationale: Muundo huu ni ombi hasi. “Nisije nikaaibika” ni Kiswahili cha kawaida kinachoeleza ombi la kutopata aibu au fedheha.
- source_word: כִּי קְרָאתִיךָ
  choice: kwa maana nimekuita
  rationale: כִּי inatoa sababu ya ombi, na kitenzi timilifu kinaonyesha kwamba mwombaji amemwita Yahwe. “Nimekuita” pia linaweza kueleweka kama kumwomba au kumlilia Mungu.
- source_word: יֵבֹשׁוּ רְשָׁעִים
  choice: waovu na waaibike
  rationale: “Na waaibike” lina nguvu ya ombi au tamko la kutaka jambo litokee, na linarudia mzizi wa wazo lililo katika ombi la kwanza.
- source_word: יִדְּמוּ
  choice: wanyamaze
  rationale: Kitenzi kinaweza kumaanisha kuwa kimya au kutulia. “Wanyamaze” linahifadhi picha ya waovu kuingia katika ukimya bila kuifanya wazi kuwa ni kausativi.
- source_word: לִשְׁאוֹל
  choice: katika Sheoli
  rationale: “Sheoli” linahifadhi istilahi ya Kiebrania kwa makao ya wafu na kuepuka kuilinganisha moja kwa moja na jehanamu. Kiambishi ל kimetafsiriwa kimuktadha kuwa “katika,” huku uwezekano wa mwelekeo ukielezwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina la Mungu moja kwa moja; kulitohowa kama “Yahwe” kunahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya שְׁאוֹל
  choice: Sheoli
  alternative: makao ya wafu; kaburi; kuzimu
  rationale: Istilahi hii inaweza kumaanisha makao ya wafu kwa upana, si lazima kaburi moja wala mahali pa adhabu ya mwisho. Kutohowa kunahifadhi upekee na mvutano wa dhana ya asili.
- issue: Uhusiano wa יִדְּמוּ na שְׁאוֹל
  choice: wanyamaze katika Sheoli
  alternative: watulie katika Sheoli; washuke Sheoli kimya
  rationale: Kiebrania kinaruhusu wazo la kuwa kimya au kutulia, na kiambishi ל kinaweza kuhusishwa na hali au mwelekeo. Tafsiri kuu haichagui kwa nguvu kati ya ukimya uliomo Sheoli na kwenda huko kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sala ulio wa heshima lakini unaoeleweka kwa urahisi. Mistari mitatu inadumisha ulinganifu wa kishairi wa ombi la kutokuaibika, kuaibika kwa waovu, na ukimya wao Sheoli.
