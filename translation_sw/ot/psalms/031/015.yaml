  text: בְּ/יָדְ/ךָ֥ עִתֹּתָ֑/י הַצִּ֘ילֵ֤/נִי מִ/יַּד א֝וֹיְבַ֗/י וּ/מֵ/רֹדְפָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/015.yaml
  text: My times are in your hand[a]; rescue me from the hand of my enemies and from my pursuers.
translation:
  language: sw
  text: Nyakati zangu zimo mkononi mwako[a]; uniokoe kutoka mkononi mwa adui zangu na kutoka kwa wanaonifuatilia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nyakati nilizopangiwa” au “hali zangu.” Neno la Kiebrania “nyakati zangu” linaweza kurejelea kwa upana vipindi na matukio ya maisha ya mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָדְךָ
  choice: mkononi mwako
  rationale: Inahifadhi taswira ya Kiebrania ya mkono kama mamlaka au udhibiti, bila kuifafanua kupita kiasi; pia inaandaa ulinganifu na ‘kutoka mkononi mwa adui zangu.’
- source_word: עִתֹּתָי
  choice: nyakati zangu
  rationale: Wingi huu unaweza kujumuisha vipindi, majira, matukio na hali mbalimbali za maisha. ‘Nyakati zangu’ inadumisha upana wa kishairi bila kuibana maana kuwa majaliwa pekee.
- source_word: הַצִּילֵנִי
  choice: uniokoe
  rationale: Ni ombi la moja kwa moja na la kawaida la kuondolewa katika hatari halisi inayotokana na maadui na wafuatiliaji.
- source_word: מִיַּד
  choice: kutoka mkononi mwa
  rationale: Inahifadhi sitiari ya Kiebrania na utofautishaji wa kishairi kati ya kuwa mkononi mwa Mungu na kuokolewa kutoka mkononi mwa maadui.
- source_word: אֹיְבַי
  choice: adui zangu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida kwa wapinzani wenye uhasama.
- source_word: וּמֵרֹדְפָי
  choice: na kutoka kwa wanaonifuatilia
  rationale: Inawasilisha watu wanaomwandama au kumfuatia mwombaji kwa nia ya kumdhuru, huku ikiepuka kuibana maana iwe mateso ya kidini au ya kitaasisi pekee.
theological_decisions:
- issue: Upeo wa maana ya ‘nyakati zangu’
  choice: Kauli pana kuhusu vipindi, matukio na hali za maisha ya mwombaji kuwa chini ya mamlaka ya Mungu
  alternative: ‘Majaliwa yangu’ au ‘nyakati nilizopangiwa’ pekee
  rationale: Kiebrania kina upana wa kishairi. Tafsiri inadumisha upana huo na mvutano wa kiteolojia badala ya kuamua wazi fundisho maalumu kuhusu majaliwa au kuibana kwa nyakati zilizowekwa tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. ‘Zimo’ linaendana na ‘nyakati’ kama mambo yaliyo ndani ya mamlaka ya Mungu; urudiaji wa ‘mkono’ umehifadhiwa kwa sababu ni kiini cha ulinganifu wa mstari.
