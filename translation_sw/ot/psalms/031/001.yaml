base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/001.yaml
  text: In you[a], O Yahweh, I have taken refuge; let me never be put to shame. In your righteousness deliver me.
translation:
  language: sw
  text: Ee Yahwe, nimekimbilia kwako; nisiaibishwe kamwe. Kwa haki yako, niokoe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa uadilifu wako, niokoe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  choice: Kwako
  rationale: Huhifadhi picha ya kumfanya Yahwe kuwa mahali pa kukimbilia, badala ya kuibadili kuwa kauli ya jumla kuhusu kumtumaini.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: חָסִיתִי
  choice: nimekimbilia usalama
  rationale: Wakati timilifu unaonyesha tendo lililofanyika na hali iliyoanzishwa; usemi huu pia huhifadhi picha halisi ya kupata hifadhi.
- source_word: אַל אֵבוֹשָׁה לְעוֹלָם
  choice: usiruhusu kamwe niaibishwe
  rationale: Hutoa ombi hasi lenye nguvu na kuonyesha aibu ya hadharani au fedheha inayotokana na tumaini kushindwa.
- source_word: בְּצִדְקָתְךָ
  choice: Kwa haki yako
  rationale: ‘Kwa’ huonyesha haki ya Mungu kuwa msingi au njia ya wokovu; ‘haki’ huhifadhi upana wa neno la Kiebrania, likijumuisha unyofu na utendaji wa hukumu iliyo sawa.
- source_word: פַלְּטֵנִי
  choice: niokoe
  rationale: Amri hii inaomba uokozi wa moja kwa moja kutoka katika hatari; ‘niokoe’ ni ya asili, fupi, na yenye hadhi katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; kulitohowa huhifadhi jina badala ya kuliwakilisha kwa cheo.
- issue: Maana ya צְדָקָה katika tendo la Mungu la kuokoa
  choice: haki
  alternative: uadilifu
  rationale: ‘Haki’ huhifadhi maana pana ya tabia na matendo ya Mungu yaliyo sawa. ‘Uadilifu’ unawezekana, lakini unaweza kusikika zaidi kama sifa ya maadili ya mtu binafsi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ee’ hudumisha mwito wa kishairi bila kufanya sentensi kuwa nzito; ‘nimekimbilia usalama’ huhifadhi sitiari ya hifadhi kwa lugha inayoeleweka kwa urahisi.
