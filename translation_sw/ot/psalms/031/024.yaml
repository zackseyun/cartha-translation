  yaml_path: translation/ot/psalms/031/024.yaml
  text: Be strong[a], and let your heart be courageous, all you who wait for Yahweh.
translation:
  language: sw
  text: 'Iweni hodari, na mioyo yenu ipate ujasiri,

    ninyi nyote mnaomngojea Yahweh.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnaomtumaini Yahweh.” Kitenzi cha Kiebrania kinaweza kumaanisha kungojea kwa matarajio au kutumaini.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ
  choice: Iweni hodari
  rationale: Kitenzi hiki ni agizo la wingi linalowahimiza wasikilizaji wawe na nguvu na uthabiti. “Iweni hodari” ni Kiswahili cha kawaida na kinadumisha nguvu ya agizo.
- source_word: וְיַאֲמֵץ לְבַבְכֶם
  choice: na mioyo yenu ipate ujasiri
  rationale: Muundo wa Kiebrania unafuata agizo la kwanza kwa himizo kuhusu moyo, yaani utu wa ndani na nia. Tafsiri hii inadumisha namna ya kuhimiza bila kurudia tu neno “hodari.”
- source_word: לְבַבְכֶם
  choice: mioyo yenu
  rationale: Ingawa Kiebrania kinatumia nomino ya umoja pamoja na kiambishi cha wingi, maana yake ni ya kugawa kwa kila mmoja. “Mioyo yenu” ni ya asili katika Kiswahili na hapa inaashiria utu wa ndani, nia na ujasiri.
- source_word: כָּל הַמְיַחֲלִים
  choice: ninyi nyote mnaomngojea
  rationale: Partisipio ya יחל inaweza kumaanisha kungojea au kutumaini kwa matarajio. “Mnaomngojea” inadumisha picha ya kusubiri, huku maana mbadala ya kutumaini ikihifadhiwa katika tanbihi.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Kihusishi ל humtaja yule anayengojewa au kutumainiwa. Jina la agano יהוה limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina la agano יהוה. “Yahwe” linahifadhi jina hilo, ilhali “BWANA” ni cheo kinachotumiwa katika mapokeo mengi.
- issue: Mhusika na nguvu ya וְיַאֲמֵץ
  choice: na mioyo yenu ipate ujasiri
  alternative: naye autie nguvu moyo wenu
  rationale: Umbo la Kiebrania ni Hiphil imperfect ya nafsi ya tatu ya kiume umoja na linaweza kueleweka kama himizo linalofuata agizo (“moyo wenu na uwe hodari”) au kama tendo la mhusika anayedokezwa. Muktadha na mtiririko wa kishairi vinaunga mkono himizo; tafsiri haimtaji Mungu waziwazi kama mhusika wakati Kiebrania halifanyi hivyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mistari miwili inadumisha usambamba wa zaburi; “mioyo” inaeleweka kama utu wa ndani na kitovu cha nia na ujasiri.
