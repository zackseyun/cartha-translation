lexical_decisions:
- source_word: הִסְגַּרְתַּנִי
  choice: hukunikabidhi
  rationale: Hifili ya סגר hapa ina maana ya kumkabidhi mtu chini ya mamlaka ya mwingine. “Kunikabidhi” ni Kiswahili cha kawaida na hudumisha wazo la kutolewa chini ya udhibiti wa adui.
- source_word: בְּיַד
  choice: mikononi mwa
  rationale: Nahau ya Kiebrania humaanisha kuwa chini ya uwezo au mamlaka ya mtu. “Mikononi mwa” huhifadhi taswira halisi ya mikono na ni nahau ya kawaida katika Kiswahili.
- source_word: אוֹיֵב
  choice: adui
  rationale: Nomino ya umoja inatumika hapa kwa maana ya mpinzani mwenye uhasama, iwe ni mmoja au kwa uwakilishi wa maadui kwa jumla. “Adui” hudumisha umoja huo bila kuongeza ufafanuzi usiokuwamo.
- source_word: הֶעֱמַדְתָּ
  choice: umeisimamisha
  rationale: Hifili ya עמד humaanisha kusababisha isimame au kuiweka katika hali thabiti. “Umeisimamisha” hudumisha kitendo hicho pamoja na taswira ya miguu kusimama salama.
- source_word: בַמֶּרְחָב
  choice: mahali pana
  rationale: מֶרְחָב hueleza nafasi pana au wazi, kinyume cha kubanwa na dhiki. “Mahali pana” huhifadhi sitiari hiyo kwa lugha rahisi na ya kishairi.
- source_word: רַגְלָי
  choice: miguu yangu
  rationale: Tafsiri hii inaakisi moja kwa moja wingi wa neno la Kiebrania na kudumisha taswira ya kusimama na kutembea kwa uhuru.
- source_word: וְלֹא
  choice: wala ... huku-
  rationale: “Wala” huunganisha mstari huu na uliotangulia huku ikitoa ukanushi wa kawaida na wenye hadhi katika Kiswahili.
