base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/014.yaml
  text: But as for me[a], I trust in you, O Yahweh; I say, “You are my God.”
translation:
  language: sw
  text: Lakini mimi, nimekutumaini wewe, Ee Yahwe; nimesema, “Wewe ndiwe Mungu wangu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lakini mimi, ninakutumaini wewe, Ee Yahwe; nasema, ‘Wewe ndiwe Mungu wangu.’” Maumbo ya timilifu ya vitenzi vya Kiebrania yanaweza kutafsiriwa kwa wakati uliopita au timilifu; katika muktadha huu yanaweza pia kueleza tumaini na ungamo la sasa linaloendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Lakini mimi
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha utofautishaji na msisitizo; ‘Lakini mimi’ ni Kiswahili cha kawaida kinachohifadhi nguvu hiyo.
- source_word: עָלֶיךָ בָטַחְתִּי
  choice: ninakutumaini wewe
  rationale: Kitenzi בטח pamoja na על humaanisha kumtegemea au kumtumaini mtu. Wakati wa sasa unaonyesha tumaini linaloendelea, huku ‘wewe’ ikisisitiza anayelengwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa moja kwa moja kwa umbo la Kiswahili ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: אָמַרְתִּי
  choice: ninasema
  rationale: Ingawa umbo la Kiebrania ni qatal, katika muktadha huu linaweza kuwasilisha tamko la sasa na linaloendelea sambamba na ‘ninakutumaini’.
- source_word: אֱלֹהַי אָתָּה
  choice: Wewe ndiwe Mungu wangu
  rationale: Kiwakilishi אָתָּה kimetajwa wazi kwa msisitizo. ‘Wewe ndiwe’ huhifadhi mkazo huo kwa Kiswahili cha kawaida na chenye hadhi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, na ni tahajia inayolingana na matumizi ya Kiswahili.
- issue: Wakati wa vitenzi בָטַחְתִּי na אָמַרְתִּי
  choice: 'Wakati wa sasa: ‘ninakutumaini … ninasema’'
  alternative: 'Wakati uliopita au timilifu: ‘nilikutumaini … nilisema’ / ‘nimekutumaini … nimesema’'
  rationale: Maumbo ya qatal yanaweza kueleweka kama yaliyopita au timilifu, lakini katika sala hii yanaeleza tumaini na ungamo la sasa. Tanbihi inahifadhi uwezekano mwingine wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ee’ linafaa katika usemi wa moja kwa moja wa sala, na ‘Wewe ndiwe’ huhifadhi msisitizo wa kiwakilishi cha Kiebrania.
