  text: כִּ֤י כָל֪וּ בְ/יָג֡וֹן חַיַּ/י֮ וּ/שְׁנוֹתַ֪/י בַּ/אֲנָ֫חָ֥ה כָּשַׁ֣ל בַּ/עֲוֺנִ֣/י כֹחִ֑/י וַ/עֲצָמַ֥/י עָשֵֽׁשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/010.yaml
  text: For my life is spent with grief[a], and my years with sighing; my strength has failed because of my iniquity[b], and my bones waste away.
translation:
  language: sw
  text: 'Maana maisha yangu yanaisha kwa huzuni,

    na miaka yangu kwa kuugua;

    nguvu zangu zimeyumba[a] kwa sababu ya uovu wangu,[b]

    na mifupa yangu inadhoofika.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nguvu zangu zimeshindwa.” Kitenzi cha Kiebrania kwa maana halisi ni “kujikwaa” au “kuyumba,” na hapa kimetumiwa kisitiari.
    reason: lexical_alternative
  - marker: b
    text: Au “hatia yangu” au “matokeo ya hatia yangu.” Neno la Kiebrania linaweza kumaanisha uovu, hatia, au matokeo ya hatia.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Maana
  rationale: Inaonyesha sababu au maelezo yanayoendeleza maombolezo yaliyotangulia.
- source_word: כָלוּ בְיָגוֹן חַיַּי
  choice: maisha yangu yanaisha kwa huzuni
  rationale: Kitenzi כלה kina maana ya kuisha, kukamilika, au kutumika kabisa; usemi huu wa Kiswahili ni wa kawaida na unaonyesha maisha yanayotoweka chini ya huzuni.
- source_word: וּשְׁנוֹתַי בַּאֲנָחָה
  choice: na miaka yangu kwa kuugua
  rationale: אֲנָחָה ni kuugua au kupiga kite; 'kuugua' hapa hudumisha usambamba wa kishairi na huzuni.
- source_word: כָּשַׁל ... כֹחִי
  choice: nguvu zangu zimeyumba
  rationale: כשל humaanisha kujikwaa, kuyumba, au kushindwa. 'Zimeyumba' inadumisha sitiari ya Kiebrania huku ikieleweka kwa Kiswahili cha sasa.
- source_word: בַּעֲוֺנִי
  choice: kwa sababu ya uovu wangu
  rationale: עָוֹן inaweza kumaanisha uovu, hatia, au matokeo ya hatia. 'Uovu wangu' huhifadhi maana ya kimaadili bila kuamua kabisa kati ya vivuli hivyo vya maana.
- source_word: וַעֲצָמַי עָשֵׁשׁוּ
  choice: na mifupa yangu inadhoofika
  rationale: Tafsiri hii huhifadhi taswira halisi ya mifupa na maana ya kudhoofika au kunyauka.
theological_decisions:
- issue: Maana ya עָוֹן katika kujieleza kwa mtunga zaburi
  choice: uovu wangu
  alternative: hatia yangu; matokeo ya uovu wangu
  rationale: Neno la Kiebrania linaweza kutaja kosa lenyewe, hatia yake, au matokeo yake. Matini kuu inahifadhi maana ya kimaadili, na tanbihi inadumisha upana wa neno bila kudai moja kwa moja fundisho maalumu kuhusu adhabu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wa kawaida, wenye heshima na unaoeleweka. Mistari imepangwa ili kuhifadhi usambamba wa shairi la Kiebrania.
