base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/023.yaml
  text: Love Yahweh[b][a], all his faithful ones! Yahweh preserves the faithful and fully repays the one who acts proudly.
translation:
  language: sw
  text: 'Mpendeni BWANA, ninyi nyote waaminifu wake![a]


    BWANA huwalinda walio waaminifu,


    naye humlipa kwa wingi[b] yule atendaye kwa kiburi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watakatifu wake,” “wacha Mungu wake,” au “washikamanifu wake.” Neno la Kiebrania huonyesha watu wenye uaminifu na ushikamanifu kwa BWANA katika uhusiano wa agano.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa ukamilifu” au “kwa ziada.” Usemi wa Kiebrania unasisitiza malipo tele au ya ziada.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶהֱבוּ
  choice: Mpendeni
  rationale: Ni amri ya wingi kutoka kitenzi אהב. “Mpendeni” ni himizo la moja kwa moja na la kawaida kwa jamii nzima.
- source_word: יְהוָה
  choice: BWANA
  rationale: Huwakilisha kwa heshima jina la Mungu יהוה kwa desturi iliyozoeleka katika Kiswahili cha Biblia, huku herufi kubwa zikitofautisha jina hilo na cheo cha kawaida.
- source_word: כָּל חֲסִידָיו
  choice: ninyi nyote waaminifu wake
  rationale: חסידיו huwaeleza watu wenye uaminifu na ushikamanifu katika uhusiano wao na Mungu. Usemi huu ni wa asili katika Kiswahili na haubebi moja kwa moja maana finyu ya baadaye ya kidini inayoweza kuambatana na “watakatifu.”
- source_word: אֱמוּנִים
  choice: walio waaminifu
  rationale: Kivumishi hiki cha wingi kimetumika kama nomino, kikimaanisha watu wenye uaminifu au kutegemeka. “Walio waaminifu” ni wazi na hutofautishwa kidogo na mwito wa mstari wa kwanza.
- source_word: נֹצֵר
  choice: huwalinda
  rationale: Kitenzi נצר kina maana ya kulinda au kuhifadhi kwa uangalifu. “Huwalinda” kinaeleza kwa kawaida tendo la Mungu la kuwatunza watu wake.
- source_word: וּמְשַׁלֵּם עַל יֶתֶר
  choice: lakini humlipa kwa ukamilifu
  rationale: שלם katika muktadha huu ni kulipa mtu sawasawa na matendo yake, na עַל יֶתֶר huongeza wazo la malipo kamili au tele. “Lakini” huonyesha ulinganisho wa kimuktadha kati ya ulinzi wa waaminifu na hukumu ya mwenye kiburi.
- source_word: עֹשֵׂה גַאֲוָה
  choice: yule atendaye kwa kiburi
  rationale: Kihalisi ni “afanyaye kiburi.” Tafsiri hii ya Kiswahili ni ya kawaida, lakini inadumisha wazo la mwenendo wa kiburi, si hisia ya ndani pekee.
theological_decisions:
- issue: Utambulisho wa agano katika חֲסִידָיו
  choice: waaminifu wake
  alternative: watakatifu wake; wacha Mungu wake; washikamanifu wake
  rationale: Chaguo hili hudumisha wazo la watu wanaodhihirisha uaminifu na ushikamanifu kwa Mungu bila kuingiza maana maalumu ya kimadhehebu.
- issue: Ulinzi wa Mungu na malipo kwa mwenye kiburi
  choice: BWANA huwalinda walio waaminifu, lakini humlipa kwa ukamilifu yule atendaye kwa kiburi
  alternative: BWANA huwahifadhi waaminifu, naye humlipa kwa wingi atendaye kwa majivuno
  rationale: Tafsiri inadumisha mvutano wa maandiko kati ya ulinzi wa waaminifu na hukumu kamili ya mwenye kiburi, bila kupunguza upande wowote.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa mistari unadumisha ulinganisho wa kishairi kati ya waaminifu na mwenye kiburi. “Atendaye” ni rasmi kwa kiasi kinachofaa Zaburi bila kuwa cha kizamani kupita kiasi.
