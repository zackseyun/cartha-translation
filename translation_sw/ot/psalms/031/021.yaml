  text: בָּר֥וּךְ יְהוָ֑ה כִּ֥י הִפְלִ֘יא חַסְדּ֥/וֹ לִ֝֗/י בְּ/עִ֣יר מָצֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/021.yaml
  text: Blessed be Yahweh[a], for he has wonderfully shown his steadfast love to me in a fortified city.
translation:
  language: sw
  text: Yahwe na abarikiwe, kwa maana amenionyesha upendo wake thabiti kwa namna ya ajabu katika mji uliozingirwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika mji wenye ngome.” Kirai cha Kiebrania kinaweza kumaanisha mji uliozingirwa au mji wenye ngome.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרוּךְ
  choice: na abarikiwe
  rationale: Kauli ya baraka inayomwelekea Mungu; muundo huu wa Kiswahili huhifadhi nguvu ya tamko la Kiebrania bila kuifanya kuwa sifa ya kawaida tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina la agano lililoandikwa moja kwa moja katika maandishi ya Kiebrania.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha sababu ya kumbariki Yahwe na inafaa katika mtindo wa heshima wa zaburi.
- source_word: הִפְלִיא
  choice: kwa namna ya ajabu
  rationale: Huwasilisha wazo la kutenda au kudhihirisha jambo kwa njia ya kushangaza; limeunganishwa kwa kawaida na kitendo cha kuonyesha upendo.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: Huhifadhi wazo la upendo mwaminifu na wa kudumu, bila kulifupisha kuwa huruma pekee.
- source_word: לִי
  choice: amenionyesha
  rationale: Kiambishi cha nafsi katika kitenzi kinaonyesha kwa kawaida kwamba mwimbaji ndiye aliyepokea udhihirisho huo wa upendo.
- source_word: בְּעִיר מָצוֹר
  choice: katika mji uliozingirwa
  rationale: מָצוֹר mara nyingi huhusiana na kuzingirwa, na maana hii inalingana na mazingira ya hatari na ukombozi katika zaburi; hata hivyo, uwezekano wa maana ya mji wenye ngome umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja; 'Yahwe' hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya בְּעִיר מָצוֹר
  choice: katika mji uliozingirwa
  alternative: katika mji wenye ngome
  rationale: Kirai kinaweza kueleza mji unaozingirwa au mji ulioimarishwa kwa ngome. Maana ya hatari imewekwa katika matini kuu, huku maana nyingine halali ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo 'amenionyesha ... kwa namna ya ajabu' ni wa kawaida na huhifadhi msisitizo wa kitendo cha ajabu; tanbihi huweka wazi utata halisi wa kirai cha mwisho.
