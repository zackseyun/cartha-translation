base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/019.yaml
  text: How abundant is your goodness[a], which you have stored up for those who fear you, which you have worked for those who take refuge in you before the sons of man.
translation:
  language: sw
  text: 'Jinsi wema wako ulivyo mwingi,

    uliowawekea akiba wale wanaokuogopa,

    na uliowatendea wale wanaokukimbilia,

    mbele ya wanadamu[a]!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mbele ya wana wa binadamu”; usemi huu humaanisha wanadamu au watu kwa ujumla.'
    reason: Kufafanua usemi halisi wa Kiebrania unaowakilisha binadamu kwa ujumla.
lexical_decisions:
- source_word: מָה רַב
  choice: Jinsi ... ulivyo mwingi!
  rationale: Muundo huu wa mshangao unaonyesha kustaajabia ukubwa na wingi, kama ilivyo katika Kiebrania.
- source_word: טוּבְךָ
  choice: wema wako
  rationale: “Wema” huhifadhi maana pana ya sifa njema ya Mungu pamoja na mema anayowatendea watu.
- source_word: צָפַנְתָּ
  choice: Umewawekea akiba
  rationale: Kitenzi hiki kinaonyesha kuweka kitu tayari au kukihifadhi kwa matumizi ya baadaye; “kuwekea akiba” ni usemi wa kawaida na unaoeleweka.
- source_word: לִירֵאֶיךָ
  choice: wale wanaokuogopa
  rationale: Tafsiri hii huhifadhi lugha ya kibiblia ya kumcha Mungu, ambayo katika muktadha huu inahusisha heshima na uchaji, si hofu tupu.
- source_word: פָּעַלְתָּ
  choice: umeutenda
  rationale: Kiambishi “u-” kinarejelea wema na kuonyesha kwamba Mungu ameufanya au ameudhihirisha kwa vitendo.
- source_word: לַחֹסִים בָּךְ
  choice: kwa ajili ya wale wanaokukimbilia
  rationale: “Kukimbilia” huhifadhi picha halisi ya kutafuta hifadhi na usalama kwa Mungu, badala ya kuibadili kuwa dhana ya jumla ya kumtumaini.
- source_word: נֶגֶד
  choice: mbele ya
  rationale: Hutoa maana ya jambo kufanyika waziwazi mbele ya wengine; pia huhifadhi ufupi wa Kiebrania.
- source_word: בְּנֵי אָדָם
  choice: wanadamu
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaowakilisha watu kwa ujumla; maana halisi ya muundo wa Kiebrania imewekwa katika tanbihi.
theological_decisions:
- issue: Maana ya kumwogopa Mungu katika לִירֵאֶיךָ
  choice: wale wanaokuogopa
  alternative: wale wanaokucha
  rationale: “Wanaokuogopa” hufuata neno la chanzo bila kufuta mvutano kati ya hofu na uchaji; muktadha unaonyesha uhusiano wa heshima na utegemezi.
- issue: Marejeo ya jumla ya בְּנֵי אָדָם
  choice: wanadamu
  alternative: wana wa Adamu
  rationale: Kirai cha Kiebrania ni usemi mwakilishi unaomaanisha binadamu kwa ujumla. “Wanadamu” hutoa maana hiyo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi umbo halisi.
- issue: Uhusiano wa נֶגֶד בְּנֵי אָדָם na kishazi kilichotangulia
  choice: mbele ya wanadamu
  alternative: wazi machoni pa wanadamu
  rationale: Tafsiri imeacha kirai mwishoni kama katika chanzo, hivyo huhifadhi kiasi fulani uwezekano wa kukihusisha na tendo la Mungu au na wanaomkimbilia, bila kulazimisha ufafanuzi mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini wa sasa na unaoeleweka. Mistari imepangwa kuonyesha ulinganifu wa mashairi ya Kiebrania. Neno “wema” linaendelezwa kwa kiambishi cha ngeli katika “umeutenda,” na “wanaokukimbilia” huhifadhi taswira ya kutafuta hifadhi.
