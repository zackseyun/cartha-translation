base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/011.yaml
  text: Because of all my enemies I have become a reproach[a], especially to my neighbors, and a terror to my acquaintances[c][b]; those who see me in the street flee from me.
translation:
  language: sw
  text: Kwa sababu ya adui zangu wote, nimekuwa mtu wa kudharauliwa[a], hasa kwa jirani zangu, na tisho kwa watu ninaowafahamu; wale wanaoniona barabarani[b] hunikimbia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Kutokana na adui zangu wote nimekuwa mtu wa kudharauliwa”; wengine huchukulia maneno ya mwanzo kuwa ya kulinganisha: “Nimekuwa mtu wa kudharauliwa kuliko adui zangu wote.”'
    reason: alternative_reading
  - marker: b
    text: Kihalisi, “nje.” Maneno hayo yanamaanisha kuonekana mahali pa umma.
    reason: cultural_note
  - marker: c
    text: Au, “huondoka kwangu” au “hujitenga nami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל צֹרְרַי
  choice: Kwa sababu ya adui zangu wote
  rationale: מִן hapa inaeleweka kwa kawaida kuwa inaonyesha sababu au chanzo cha hali ya kudharauliwa. Tafsiri hii ni ya asili katika Kiswahili huku uwezekano wa maana nyingine ukihifadhiwa katika tanbihi.
- source_word: הָיִיתִי חֶרְפָּה
  choice: nimekuwa mtu wa kudharauliwa
  rationale: Muundo wa הָיָה pamoja na nomino unaonyesha hali iliyotokea na inayoendelea. ‘Mtu wa kudharauliwa’ huwasilisha kwa lugha ya kawaida wazo la kuwa shabaha ya fedheha, dhihaka, au shutuma.
- source_word: וְלִשֲׁכֵנַי מְאֹד
  choice: hasa na jirani zangu
  rationale: מְאֹד inasisitiza kiwango cha kudharauliwa kwake miongoni mwa jirani zake. ‘Hasa’ ni njia ya kawaida ya kuonyesha msisitizo huo katika Kiswahili.
- source_word: וּפַחַד לִמְיֻדָּעָי
  choice: na kitu cha kuwatisha watu ninaofahamiana nao
  rationale: פַחַד ni hofu au kitisho, na מְיֻדָּעַי humaanisha watu anaowajua au anaofahamiana nao, si lazima rafiki wa karibu.
- source_word: רֹאַי בַּחוּץ
  choice: wale wanaoniona barabarani
  rationale: בַחוּץ ni ‘nje’ kihalisi, lakini hapa inaelekea kurejelea mahali pa wazi pa umma. ‘Barabarani’ huwasilisha vizuri mazingira hayo ya kuonekana hadharani.
- source_word: נָדְדוּ מִמֶּנִּי
  choice: hunikimbia
  rationale: נָדַד inaweza kumaanisha kukimbia, kutangatanga, au kuondoka. Katika muktadha wa watu wanaomwona na kumwepuka, ‘hunikimbia’ huonyesha kwa ufupi mwitikio wao wa kujitenga naye.
