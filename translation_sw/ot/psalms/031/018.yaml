  yaml_path: translation/ot/psalms/031/018.yaml
  text: Let lying lips be silenced[d][c][b][a], which speak arrogantly against the righteous with pride and contempt.
translation:
  language: sw
  text: 'Midomo ya uongo inyamazishwe[a],

    inayosema kwa jeuri[b] dhidi ya mwenye haki[c],

    kwa kiburi na dharau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “inyamaze”; kitenzi cha Kiebrania kinaweza kumaanisha kunyamaza au kunyamazishwa.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa majivuno”; hapa neno la Kiebrania linaeleza usemi wa jeuri au kiburi.
    reason: lexical_alternative
  - marker: c
    text: Au “dhidi ya mtu mwenye haki”; umoja wa Kiebrania unaweza kumaanisha mtu mmoja au kumwakilisha yeyote aliye mwenye haki.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּאָלַמְנָה
  choice: inyamazishwe
  rationale: Nifali ya wakati usiotimilika yenye nguvu ya ombi au takwa inaonyesha midomo kunyamazishwa. Umbo la kutendwa ‘inyamazishwe’ linahifadhi nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: שִׂפְתֵי שָׁקֶר
  choice: midomo ya uongo
  rationale: Muundo huu wa moja kwa moja unahifadhi taswira ya Kiebrania ya midomo kama chombo cha kusema uongo, bila kuugeuza kuwa maelezo ya jumla kuhusu waongo.
- source_word: הַדֹּבְרוֹת
  choice: inayosema
  rationale: 'Kitenzi-jina cha kike kwa wingi kinakubaliana na ‘midomo’ katika Kiebrania na kinaeleza midomo hiyo. Kiswahili hutumia upatanisho wa ngeli wa ‘midomo’: ‘inayosema.’'
- source_word: עַל צַדִּיק
  choice: dhidi ya mwenye haki
  rationale: ‘Dhidi ya’ huonyesha wazi usemi wa uadui, na ‘mwenye haki’ huhifadhi umoja wa צַדִּיק bila kulazimisha jinsia ya mhusika.
- source_word: עָתָק
  choice: kwa jeuri
  rationale: Neno hili linamaanisha usemi wa kiburi, ukaidi au ufidhuli. ‘Kwa jeuri’ huonyesha namna ya kusema huku likitofautishwa kwa kiasi na ‘kiburi’ kinachofuata.
- source_word: בְּגַאֲוָה
  choice: kwa kiburi
  rationale: Kihusishi ב pamoja na nomino kinaonyesha namna au mtazamo; ‘kwa kiburi’ ni usemi wa asili na unaohifadhi msisitizo wa chanzo.
- source_word: וָבוּז
  choice: na dharau
  rationale: בּוּז humaanisha dharau au stihizai. ‘Dharau’ ni neno la kawaida, lenye hadhi, na linaendana vizuri na ‘kiburi.’
theological_decisions:
- issue: Umoja wa צַדִּיק
  choice: mwenye haki
  alternative: watu wenye haki
  rationale: Chanzo kina umoja na kinaweza kumaanisha mtu mmoja mwenye haki au mtu mwenye haki kama mwakilishi. Tafsiri inadumisha umoja huo badala ya kuamua kuwa ni kundi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishairi umehifadhiwa kwa mistari mitatu. Maneno ‘jeuri,’ ‘kiburi,’ na ‘dharau’ yanadumisha mrundikano wa msisitizo katika Kiebrania bila kuyaunganisha kuwa wazo moja.
