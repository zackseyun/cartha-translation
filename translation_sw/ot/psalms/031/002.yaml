lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: Nitegee sikio lako
  rationale: Kauli hii inadumisha taswira halisi ya kuelekeza sikio kwa mwombaji, huku ikiwa ombi la kawaida na linaloeleweka la kusikiliza kwa makini.
- source_word: מְהֵרָה
