  rationale: Kielezi hiki kinaonyesha uharaka wa ombi kwa Kiswahili cha kawaida na cha sasa.
- source_word: הַצִּילֵנִי
  choice: uniokoe
  rationale: Kitenzi נצל humaanisha kumwondoa mtu katika hatari au kumwokoa; “uniokoe” ni wazi na kinaendana na uharaka wa muktadha.
- source_word: הֱיֵה לִי
  choice: Uwe kwangu
  rationale: Huhifadhi amri ya moja kwa moja na uhusiano wa kibinafsi unaoonyeshwa na kiwakilishi cha yule anayeomba.
- source_word: לְצוּר מָעוֹז
  choice: mwamba wa hifadhi
  rationale: “Mwamba” huhifadhi צוּר, na “hifadhi” huwasilisha wazo la mahali pa ulinzi lililomo katika מָעוֹז bila kuondoa taswira ya mwamba.
- source_word: לְבֵית מְצוּדוֹת
  choice: nyumba yenye ngome
  rationale: Tafsiri hii inadumisha taswira ya “nyumba” na wakati huohuo inaonyesha ulinzi wenye nguvu wa מְצוּדוֹת.
- source_word: לְהוֹשִׁיעֵנִי
  choice: ili kuniokoa
  rationale: Muundo wa kusudi wa kitenzi ישׁע umeonyeshwa kwa “ili”; kurudiwa kwa wazo la kuokoa kunahifadhi usambamba wa Kiebrania.
