  text: שָׂנֵ֗אתִי הַ/שֹּׁמְרִ֥ים הַבְלֵי שָׁ֑וְא וַ֝/אֲנִ֗י אֶל יְהוָ֥ה בָּטָֽחְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/006.yaml
  text: I hate those who keep worthless idols[a], but as for me, I trust in Yahweh.
translation:
  language: sw
  text: Ninawachukia wale wanaoshikamana na sanamu zisizo na maana[a], lakini mimi ninamtumaini Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale wanaozingatia ubatili wa uongo,” au “wale wanaoshikilia vitu vya bure na vya udanganyifu.”
    reason: Maneno ya Kiebrania yanaweza kumaanisha sanamu zisizo na thamani au, kwa upana zaidi, mambo matupu na ya uongo; pia kitenzi kinaweza kutafsiriwa ‘kuzingatia,’ ‘kushikilia,’ au ‘kushikamana na.’
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: Ninawachukia
  rationale: Kitenzi timilifu cha nafsi ya kwanza umoja kinaeleza msimamo thabiti unaoendelea; wakati wa sasa ni wa kawaida na wazi katika Kiswahili.
- source_word: הַשֹּׁמְרִים
  choice: wale wanaoshikamana na
  rationale: Ingawa שמר kwa msingi humaanisha kulinda, kutunza au kuzingatia, hapa kinaonyesha ufuasi au ushikamanifu kwa vitu vinavyotajwa; ‘wanaoshikamana na’ huleta maana hiyo bila kudai kuwa wanavilinda tu.
- source_word: הַבְלֵי שָׁוְא
  choice: sanamu zisizo na maana
  rationale: Muungano huu una wazo la ubatili, utupu na udanganyifu. Katika muktadha wa kulinganisha vitu hivi na kumtumaini Yahwe, ‘sanamu zisizo na maana’ huonyesha rejeo linalowezekana kwa lugha ya kawaida; tanbihi huhifadhi uwezekano wa maana pana zaidi.
- source_word: וַאֲנִי
  choice: lakini mimi
  rationale: Kiwakilishi kilichotamkwa pamoja na kiunganishi kinaweka tofauti yenye mkazo kati ya watu hao na msemaji.
- source_word: אֶל יְהוָה בָּטָחְתִּי
  choice: ninamtumaini Yahwe
  rationale: Kiswahili kwa kawaida humfanya mtu anayetumainiwa kuwa yambwa wa kitenzi ‘tumaini’; usemi huu ni wa asili huku ukihifadhi Yahwe kama jina binafsi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetolewa kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Rejeo la הַבְלֵי שָׁוְא
  choice: sanamu zisizo na maana
  alternative: mambo ya ubatili wa uongo; vitu vya bure na vya udanganyifu
  rationale: Muktadha unaunga mkono kuelewa maneno haya kuwa vitu vya ibada au tegemeo la uongo, lakini Kiebrania chenyewe kinaweza kuwa kipana zaidi. Tanbihi inalinda mvutano huo badala ya kuufuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Ninamtumaini’ ni usemi wa sasa unaoonyesha tumaini thabiti, na ‘lakini mimi’ huhifadhi mkazo wa utofautishaji.
