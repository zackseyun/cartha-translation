  yaml_path: translation/ot/psalms/031/005.yaml
  text: Into your hand I commit my spirit; you have redeemed me[a], O Yahweh, God of truth.
translation:
  language: sw
  text: Mikononi mwako naiweka roho yangu; umenikomboa, Ee Yahweh, Mungu wa ukweli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu mwaminifu.” Neno la Kiebrania linaweza kumaanisha ukweli, kutegemeka, au uaminifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָדְךָ
  choice: Mikononi mwako
  rationale: Nahau ya Kiswahili ya kuweka kitu chini ya mamlaka na ulinzi wa mwingine; wingi wa kawaida ‘mikononi’ unasikika kwa asili ingawa Kiebrania kina ‘mkono’.
- source_word: אַפְקִיד
  choice: naiweka
  rationale: Hifili ya פקד hapa ina maana ya kukabidhi au kuweka chini ya uangalizi; ‘naiweka’ ni ya kawaida, yenye uzito, na inashirikiana vizuri na ‘mikononi mwako’.
- source_word: רוּחִי
  choice: roho yangu
  rationale: רוּחַ inaweza kumaanisha roho au pumzi; katika sala hii ‘roho yangu’ huonyesha uhai au nafsi ya mwombaji anayojikabidhi kwa Mungu.
- source_word: פָּדִיתָה
  choice: umenikomboa
  rationale: Kauli timilifu ya פדה inaeleza tendo lililokamilika lenye umuhimu wa sasa; ‘umenikomboa’ huhifadhi maana ya kuokoa kwa kulipia au kuachilia bila kuifanya lugha iwe ya kibiashara kupita kiasi.
- source_word: יְהוָה
  choice: Ee Yahweh
  rationale: Jina la agano יְהוָה limetoholewa kuwa ‘Yahweh’; ‘Ee’ huonyesha mwito wa moja kwa moja katika sala.
- source_word: אֵל אֱמֶת
  choice: Mungu wa kweli
  rationale: Hili ni tamko la asili la Kiswahili linaloweza kuonyesha Mungu wa ukweli na Mungu aliye wa kweli, huku maana ya uaminifu ya אֱמֶת ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Ee Yahweh
  alternative: Ee BWANA
  rationale: Maandishi yanatumia jina binafsi la Mungu, kwa hiyo limetoholewa badala ya kubadilishwa na cheo.
- issue: Upana wa maana ya אֱמֶת katika אֵל אֱמֶת
  choice: Mungu wa kweli
  alternative: Mungu mwaminifu
  rationale: אֱמֶת inaweza kumaanisha ukweli, kutegemeka, au uaminifu. Matini kuu inatumia tafsiri iliyo karibu na muundo wa chanzo, na tanbihi inadumisha maana nyingine halali.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Nahau ‘mikononi mwako naiweka’ ni ya kawaida na hudumisha picha ya kukabidhi chini ya ulinzi; ‘Ee’ huhifadhi sauti ya sala ya moja kwa moja.
