base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/020.yaml
  text: You hide them in the shelter of your presence from the schemes of man[b][a]; you conceal them in a shelter from the strife of tongues.
translation:
  language: sw
  text: Unawaficha katika maficho ya uwepo wako, mbali na hila za mwanadamu[a]; unawasitiri katika kibanda, mbali na mabishano ya ndimi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “njama za mwanadamu” au “mipango mibaya ya mwanadamu.” Neno la Kiebrania ni adimu na huenda likarejelea mipango au makundi yenye uhasama.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “mabishano ya ndimi,” yaani, maneno ya uhasama au ya kashfa.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּירֵם
  choice: unawaficha
  rationale: Hifili ya סתר inaonyesha tendo la kuwafanya wawe mafichoni; tafsiri hii ni ya kawaida na inadumisha ulinzi wa Mungu ulio hai.
- source_word: בְּסֵתֶר פָּנֶיךָ
  choice: katika maficho ya uwepo wako
  rationale: סֵתֶר ni mahali pa siri au pa kujificha, na פָּנִים hapa kwa kawaida hueleza uwepo; usemi huu unadumisha wazo la ukaribu na ulinzi.
- source_word: מֵרֻכְסֵי אִישׁ
  choice: mbali na hila za mwanadamu
  rationale: רֻכְסֵי ni neno adimu na lenye utata, huenda likimaanisha njama, mikusanyiko ya uhasama, au mipango mibaya. “Hila” ni wazi katika Kiswahili huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: תִּצְפְּנֵם
  choice: unawasitiri
  rationale: צפן inaweza kumaanisha kuficha, kuweka akiba, au kuhifadhi kwa usalama. “Unawasitiri” inaonyesha ufichaji wa kuwalinda na pia inatofautiana kidogo na kitenzi cha kwanza.
- source_word: בְּסֻכָּה
  choice: katika kibanda
  rationale: סֻכָּה ni kibanda au kivuli cha muda. “Kibanda” kinahifadhi taswira halisi ya Kiebrania badala ya kuifanya kuwa dhana ya jumla tu.
- source_word: מֵרִיב לְשֹׁנוֹת
  choice: mbali na mashindano ya ndimi
  rationale: רִיב ni ugomvi, mabishano, au mashindano; לְשֹׁנוֹת ni “ndimi.” Tafsiri inahifadhi sitiari ya kishairi, huku tanbihi ikifafanua kuwa inahusu maneno ya uhasama au kashfa.
theological_decisions:
- issue: Uwakilishi wa אִישׁ katika umoja wa kiume
  choice: mwanadamu
  alternative: mtu / watu
  rationale: אִישׁ iko katika umoja wa kiume lakini hapa inaonekana kutumiwa kiuwakilishi. “Mwanadamu” hudumisha umoja na maana ya jumla bila kuifanya iwe wingi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Maficho ya uwepo wako” huhifadhi taswira ya uso/uwepo bila usemi mgumu wa “uso wako”; “kibanda” na “ndimi” zinadumisha picha halisi za shairi.
