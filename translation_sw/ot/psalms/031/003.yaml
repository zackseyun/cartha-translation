  yaml_path: translation/ot/psalms/031/003.yaml
  text: For you are my rock and my fortress[c][b][a]; and for your name’s sake you will lead me and guide me.
translation:
  language: sw
  text: Kwa maana wewe ni mwamba wangu na ngome yangu; kwa ajili ya jina lako utaniongoza na kunielekeza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya jina lako niongoze na kunielekeza.” Vitenzi vya Kiebrania vinaweza kueleweka kama tumaini lenye uhakika au kama ombi.
    reason: grammatical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Katika muktadha huu neno linaonyesha msingi wa ombi au tumaini la mtunga zaburi. “Kwa maana” linaunganisha kauli hii kwa kawaida na sala inayozunguka mstari huu.
- source_word: סַלְעִי
  choice: mwamba wangu
  rationale: Neno hilo humaanisha mwamba au jabali na hapa linatumika kama mfano wa mahali salama pa kukimbilia. “Mwamba wangu” ni tafsiri ya kawaida na iliyo wazi katika Kiswahili.
- source_word: מְצוּדָתִי
  choice: ngome yangu
  rationale: Neno hilo humaanisha mahali palipoimarishwa kwa ulinzi. “Ngome” huhifadhi taswira ya usalama na ulinzi na linaendana kwa asili na “mwamba.”
- source_word: וּלְמַעַן שִׁמְךָ
  choice: kwa ajili ya jina lako
  rationale: Tafsiri hii huhifadhi nahau ya Kiebrania inayohusisha jina la Mungu na tabia yake iliyofunuliwa, heshima yake, na uaminifu wake, bila kuifafanua kupita maandishi.
- source_word: תַּנְחֵנִי
  choice: utaniongoza
  rationale: Hifili ya נחה humaanisha kuongoza au kuelekeza. Wakati ujao hapa unaonyesha tumaini lenye uhakika linalotokana na ungamo kwamba Mungu ndiye mwamba na ngome ya mwombaji.
- source_word: וּתְנַהֲלֵנִי
  choice: na kunielekeza
  rationale: Kitenzi hiki pia huhusu kuongoza au kusimamia njia ya mtu. “Kunielekeza” hukitofautisha na kitenzi kilichotangulia huku kikihifadhi usambamba na ukaribu wa maana wa mashairi ya Kiebrania.
theological_decisions:
- issue: Maana ya “kwa ajili ya jina lako”
  choice: Mwongozo wa Mungu unaombwa kwa msingi wa jina lake—tabia yake iliyofunuliwa, heshima yake, na uaminifu wake.
  alternative: Kulielewa jina lake kwa maana finyu ya sifa yake mbele ya watu pekee.
  rationale: Nahau ya Kiebrania huacha “jina” likiwa na maana pana. Tafsiri inaihifadhi badala ya kuifupisha kuwa sifa ya nje tu.
- issue: Nguvu ya vitenzi vya wakati usiotimilika
  choice: 'Tumaini lenye uhakika: “utaniongoza na kunielekeza.”'
  alternative: 'Ombi la moja kwa moja: “niongoze na kunielekeza”; au hali ya sasa: “unaniongoza na kunielekeza.”'
  rationale: Katika muktadha wa sala, maumbo hayo yanaweza kusikika kama ombi au matarajio. Wakati ujao unaonyesha vizuri zaidi uhakika unaotokana na ungamo la mwanzo bila kudai kwamba uwezekano mwingine haupo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. “Mwamba” na “ngome” huhifadhi taswira mbili za ulinzi; “kuongoza” na “kuelekeza” huhifadhi usambamba wa vitenzi viwili vinavyokaribiana kimaana.
