lexical_decisions:
- source_word: חָנֵּנִי
  choice: Unitendee neema
  rationale: Kauli ya amri ya חנן ni ombi la kutendewa kwa neema au kibali. Tafsiri hii inadumisha wazo hilo moja kwa moja bila kulifanya kuwa rehema pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: צַר לִי
  choice: niko katika dhiki
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili ya hali ya kusongwa au kutaabika inayosemwa na mwombaji.
- source_word: עָשְׁשָׁה
  choice: limedhoofika
  rationale: Kitenzi kinaweza kueleza kudhoofika, kufifia au kuharibika; ‘limedhoofika’ kinafaa kwa jicho na pia kwa viungo vinavyofuata katika ushairi.
- source_word: בְכַעַס
  choice: kwa huzuni
  rationale: Katika ombolezo hili neno linaeleza maumivu ya ndani au masikitiko; tanbihi inadumisha uwezekano wa maana ya mfadhaiko au ghadhabu.
- source_word: עֵינִי
  choice: jicho langu
  rationale: Umoja wa Kiebrania umehifadhiwa.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: נפש hapa inaweza kueleza nafsi, uhai au mtu mwenyewe. ‘Nafsi yangu’ inadumisha upana wa lugha ya kishairi.
- source_word: וּבִטְנִי
  choice: na tumbo langu pia
  rationale: בטן humaanisha tumbo na pia inaweza kutaja sehemu za ndani. Tafsiri ya moja kwa moja imewekwa katika matini, huku maana pana ikielezwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania inatumia jina binafsi la Mungu; ‘Yahwe’ linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya נַפְשִׁי katika lugha kuhusu mwanadamu
  choice: nafsi yangu
  alternative: uhai wangu au mimi mwenyewe
  rationale: Ubeti unaunganisha jicho, nafsi na tumbo kwa lugha ya kishairi. ‘Nafsi’ inadumisha utata wa neno bila kulifunga kwa maana ya sehemu isiyo ya mwili pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kishairi na umoja wa ‘jicho’ vimehifadhiwa; ‘naam’ inaonyesha msisitizo na mwendelezo wa orodha ya viungo vinavyodhoofika.
