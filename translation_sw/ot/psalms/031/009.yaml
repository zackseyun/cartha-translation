  - marker: b
    text: “Nafsi yangu” pia inaweza kutafsiriwa “uhai wangu” au “mimi mwenyewe.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “tumbo langu”; neno hili linaweza pia kumaanisha sehemu zangu za ndani.'
