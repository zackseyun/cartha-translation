  text: Be gracious to me[a], O Yahweh, for I am in distress[c][b]; my eye has wasted away with grief—my soul and my belly as well.
translation:
  language: sw
  text: Unifanyie neema, ee Yahwe, kwa maana niko katika dhiki. Jicho langu limedhoofika kwa masikitiko[a], nafsi yangu[b] na tumbo langu[c] pia.
