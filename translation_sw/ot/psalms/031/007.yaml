base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/007.yaml
  text: I will rejoice and be glad in your steadfast love[a], because you have seen my affliction; you have known the distresses of my soul.
translation:
  language: sw
  text: 'Nitashangilia na kufurahi katika upendo wako wa kudumu,

    kwa sababu umeona mateso yangu;

    umeijua nafsi yangu katika dhiki.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maisha yangu katika dhiki” au “mimi mwenyewe katika dhiki”; neno la Kiebrania nefesh linaweza kumaanisha “nafsi,” “maisha,” au “mtu mwenyewe,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָגִילָה
  choice: Nitashangilia
  rationale: Kitenzi hiki cha Kiebrania ni cha nafsi ya kwanza umoja chenye nguvu ya azimio au nia, na kinaeleza shangwe kubwa. “Nitashangilia” ni cha kawaida na huhifadhi mtazamo huo wa azimio.
- source_word: וְאֶשְׂמְחָה
  choice: na kufurahi
  rationale: Kimeunganishwa na גיל ili kuongeza mkazo wa kishairi. “Kushangilia na kufurahi” huhifadhi jozi hiyo bila kurudia neno lilelile.
- source_word: בְחַסְדֶּךָ
  choice: katika upendo wako wa kudumu
  rationale: חֶסֶד huonyesha upendo mwaminifu na usiokoma, mara nyingi katika uhusiano wa agano. “Upendo wa kudumu” ni Kiswahili cha sasa kinachobeba wazo la uthabiti bila kulibana kuwa rehema pekee.
- source_word: אֲשֶׁר
  choice: kwa sababu
  rationale: Ingawa kwa kawaida ni kishazi rejeshi, hapa kinaeleza sababu ya kushangilia; “kwa sababu” huwasilisha uhusiano huo kwa uwazi na kwa kawaida.
- source_word: רָאִיתָ אֶת עָנְיִי
  choice: umeona mateso yangu
  rationale: עֳנִי hapa ni hali ya kuteseka, kudhulumiwa, au kuwa katika taabu. “Mateso yangu” ni wazi, yenye hadhi, na hudumisha lugha ya maombolezo.
- source_word: יָדַעְתָּ
  choice: umejua
  rationale: ידע inaweza kumaanisha kujua, kutambua, au kufahamu kwa ukaribu. “Umejua” huhifadhi upana huo badala ya kuamua kwa siri kuwa ni kuona tu au kuingilia kati.
- source_word: בְצָרוֹת נַפְשִׁי
  choice: dhiki za nafsi yangu
  rationale: צָרוֹת ni wingi wa taabu au dhiki, na נֶפֶשׁ inaweza kuwa nafsi, maisha, au mtu mwenyewe. “Dhiki za nafsi yangu” huhifadhi wingi na kina cha usemi wa kishairi huku tanbihi ikitaja maana nyingine zinazowezekana.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika ombolezo la zaburi
  choice: nafsi
  alternative: maisha yangu; mimi mwenyewe
  rationale: “Nafsi” huhifadhi kina cha usemi wa Kiebrania bila kulazimisha mgawanyo wa kifalsafa kati ya mwili na nafsi. Kwa kuwa נֶפֶשׁ pia inaweza kumaanisha maisha au mtu mzima, uwezekano huo umehifadhiwa katika tanbihi.
- issue: Maana ya חֶסֶד
  choice: upendo wako wa kudumu
  alternative: fadhili zako; upendo wako mwaminifu; rehema zako
  rationale: Chaguo hili huunganisha upendo na uthabiti wake bila kuufanya usemi huu kuwa istilahi ya dhehebu au kuubana kwenye maana ya rehema pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mistari mitatu inafuata mwendo wa mawazo ya Kiebrania. Alama ya tanbihi imewekwa baada ya “nafsi yangu,” ambako neno נֶפֶשׁ linalofafanuliwa linatokea.
