lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa kiongozi wa muziki
  rationale: Neno hili la kichwa cha zaburi humtaja anayesimamia utekelezaji wa muziki. Tafsiri hii ni ya kawaida na inayoeleweka, huku kiambishi ל kikidokezwa kwa “Kwa”.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ni neno la kawaida la kichwa kwa wimbo wa ibada, hasa unaohusishwa na ala za muziki; “Zaburi” ndilo neno sanifu na linalotambulika zaidi katika Kiswahili.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kiambishi ל katika vichwa vya zaburi kinaweza kuonyesha uandishi, uhusiano, umiliki wa mkusanyo, au wakfu. “Ya Daudi” huhifadhi upana huo kuliko kutaja wazi “iliyoandikwa na Daudi” au “kwa ajili ya Daudi”.
theological_decisions:
- issue: Maana ya uhusiano wa kichwa na Daudi
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi; kwa ajili ya Daudi
  rationale: Kiebrania hakilazimishi maana moja tu ya uhusiano huo. Kiswahili “ya Daudi” kinahifadhi utata halisi wa maandishi bila kuamua suala la uandishi kupita ushahidi wa chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi inayofaa kichwa cha zaburi lakini kinachoeleweka kwa msomaji wa kawaida. “Kiongozi wa muziki” limetumiwa badala ya istilahi ya kale zaidi “mwimbishaji mkuu” ili kujumuisha usimamizi wa muziki bila kudhania kwaya pekee.
