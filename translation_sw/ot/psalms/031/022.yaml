  text: וַ/אֲנִ֤י אָ֘מַ֤רְתִּי בְ/חָפְזִ֗/י נִגְרַזְתִּי֮ מִ/נֶּ֪גֶד עֵ֫ינֶ֥י/ךָ אָכֵ֗ן שָׁ֭מַעְתָּ ק֥וֹל תַּחֲנוּנַ֗/י בְּ/שַׁוְּעִ֥/י אֵלֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/022.yaml
  text: As for me[a], I said in my alarm[b], “I am cut off from before your eyes.” Yet you heard the sound of my pleas when I cried to you for help.
translation:
  language: sw
  text: Nami nilisema katika taharuki yangu[a], “Nimekatiliwa mbali nisionekane machoni pako[b].” Lakini ulisikia sauti ya maombi yangu ya rehema nilipokulilia nikikuomba msaada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa haraka yangu.” Neno la Kiebrania linaweza kumaanisha haraka, mfadhaiko, au taharuki.
    reason: lexical_alternative
  - marker: b
    text: Au, “kutoka mbele ya macho yako.” Kihalisi, “kutoka mbele ya macho yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחָפְזִי
  choice: kwa hofu yangu
  rationale: Mzizi חפז unaweza kueleza haraka, mfadhaiko, au taharuki. Katika muktadha huu wa maombolezo, “kwa hofu yangu” huonyesha hali ya kushtuka na kufadhaika; maana ya kufanya jambo kwa haraka imehifadhiwa katika tanbihi.
- source_word: נִגְרַזְתִּי
  choice: Nimekatiliwa mbali
  rationale: Nifali ya גזר hapa ina maana ya kukatwa au kuondolewa. Kauli hii inadumisha taswira yenye nguvu ya msemaji kujiona ametengwa bila kuigeuza kuwa dai la wazi kwamba Mungu amemkataa.
- source_word: מִנֶּגֶד עֵינֶיךָ
  choice: na mbele ya macho yako
  rationale: Hii inahifadhi taswira halisi ya Kiebrania, “kutoka mbele ya macho yako,” kwa Kiswahili kinachoeleweka. Maana ya kawaida “machoni pako” imetolewa katika tanbihi.
- source_word: אָכֵן
  choice: Lakini
  rationale: Katika muktadha huu neno linaonyesha tofauti kali kati ya dhana ya mtunga zaburi na ukweli kwamba Mungu alimsikia.
- source_word: קוֹל תַּחֲנוּנַי
  choice: sauti ya maombi yangu
  rationale: Tafsiri hii huhifadhi קוֹל, “sauti,” na kueleza תַּחֲנוּנִים kwa neno la kawaida na lenye heshima “maombi,” yaani maombi ya kuomba rehema au fadhili.
- source_word: בְּשַׁוְּעִי אֵלֶיךָ
  choice: nilipokulilia unisaidie
  rationale: שׁוע humaanisha kulia au kuita kwa kuomba msaada. “Unisaidie” huweka wazi maana iliyomo katika kitenzi, huku אֵלֶיךָ ikihifadhiwa kwa “kukulilia.”
theological_decisions:
- issue: Dhana ya kuachwa na Mungu ikilinganishwa na ukweli kwamba Mungu alisikia
  choice: Kauli ya mtunga zaburi imehifadhiwa kama alivyohisi—“Nimekatiliwa mbali na mbele ya macho yako”—kisha ikapingwa na “Lakini ulisikia.”
  alternative: “Nilidhani kuwa umenikataa.”
  rationale: Kiebrania hakisemi wazi kwamba Mungu alimkataa; kinatumia lugha ya uzoefu na uhusiano. Tafsiri inadumisha mvutano kati ya hisia ya mwanadamu na tendo halisi la Mungu bila kuamua zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “Nami nilisema” unaendeleza msisitizo wa וַאֲנִי; “nilipokulilia unisaidie” ni usemi wa kawaida unaowasilisha kilio cha kuomba msaada.
