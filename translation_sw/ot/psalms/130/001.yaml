  text: Wimbo wa Kupanda[a]. Kutoka vilindini nimekuita, ee Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Wimbo wa Kupanda,” jina la kimapokeo la kundi hili la zaburi.'
