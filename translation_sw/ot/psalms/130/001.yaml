  - marker: b
    text: 'Au: “ninakuita kutoka vilindini.” Kitenzi cha Kiebrania kinaweza kueleweka kama tendo lililotokea, lakini katika sala ya kishairi kinaweza pia kuwasilisha mwito wa sasa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Wimbo
  rationale: Nomino hii humaanisha wimbo; haijawekwa kuwa “zaburi,” kwa kuwa Kiebrania hapa kinataja wimbo kwa ujumla.
- source_word: הַמַּעֲלוֹת
  choice: wa Kupanda
  rationale: Hifadhi jina la kimapokeo la kundi hili la zaburi bila kuamua kwa uhakika aina au mazingira ya kihistoria ya kupanda huko.
- source_word: מִמַּעֲמַקִּים
  choice: kutoka vilindini
  rationale: Wingi wa nomino unaonyesha sehemu zenye kina na hapa unatoa taswira ya dhiki kali; “vilindini” ni ya kishairi na inaeleweka katika Kiswahili sanifu.
- source_word: קְרָאתִיךָ
  choice: nimekuita
  rationale: Kauli timilifu ya Kiebrania inaweza kueleweka kuwa tendo lililotokea au kilio kinachoendelea kuwa halisi katika sala; wakati timilifu wa Kiswahili huhifadhi mtazamo huo bila kuongeza kitenzi cha nguvu kisicholazimishwa na mzizi קרא.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi badala ya kubadilishwa kuwa cheo kama “Bwana.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Matini ya Kiebrania ina jina maalumu la Mungu; “Yahweh” hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Wakati wa kitenzi קְרָאתִיךָ
  choice: nimekuita
  alternative: ninakuita
  rationale: Kauli timilifu ya Kiebrania imehifadhiwa kwa wakati timilifu wa Kiswahili, huku tanbihi ikionyesha uwezekano wa kulisoma kama ombi la sasa katika ushairi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Ee” inafaa kwa mwito wa moja kwa moja wenye hadhi; “vilindini” huhifadhi taswira ya wingi na kina.
