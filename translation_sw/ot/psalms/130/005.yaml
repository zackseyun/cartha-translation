  text: I wait for Yahweh[a]; my soul waits[b], and in his word I hope.
translation:
  language: sw
  text: Ninamngoja Yahweh[a]; nafsi yangu inangoja, na katika neno lake ninatumaini[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nimemngoja Yahweh; nafsi yangu imengoja.” Vitenzi vya Kiebrania vinaweza kuonyesha azimio lililokamilika au msimamo wa sasa katika muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: Au, “ninalingojea neno lake,” au “ninatumaini katika ahadi yake.” Neno la Kiebrania linaweza kumaanisha neno au kauli ya Mungu kwa ujumla, au, kwa kudokeza, ahadi yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִוִּיתִי
  choice: Ninamngoja
  rationale: Kitenzi קוה kinaeleza kungoja kwa matarajio. Wakati wa sasa unaonyesha msimamo unaoendelea katika muktadha, huku tanbihi ikihifadhi uwezekano wa kauli timilifu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi, si kubadilishwa kuwa cheo.
- source_word: קִוְּתָה
  choice: inangoja
  rationale: Kurudia mzizi קוה kunadumisha usambamba na msisitizo wa kishairi wa mstari.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: נפש hapa ni utu wa ndani au mtu mwenyewe; “nafsi yangu” huhifadhi taswira ya kishairi na inaeleweka katika Kiswahili sanifu.
- source_word: לִדְבָרוֹ
  choice: neno lake
  rationale: דבר inaweza kumaanisha neno, usemi, au kwa maana inayodokezwa ahadi. Muundo “nalitumainia neno lake” unaonyesha neno hilo kuwa msingi wa tumaini.
- source_word: הוֹחָלְתִּי
  choice: nalitumainia
  rationale: Kitenzi יחל huunganisha kungoja na kutumaini. “Nalitumainia” kinakipambanua na קוה huku kikihifadhi matarajio yenye tumaini.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu moja kwa moja; “Yahweh” hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya דְבָרוֹ
  choice: neno lake
  alternative: ahadi yake
  rationale: “Neno lake” ndilo chaguo pana na la moja kwa moja zaidi; “ahadi yake” ni maana inayowezekana kwa muktadha lakini inaongeza ufafanuzi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Marudio ya “ngoja” yamehifadhiwa kwa usambamba; “nafsi yangu” huhifadhi lugha ya zaburi bila kuwa ya kizamani kupita kiasi.
