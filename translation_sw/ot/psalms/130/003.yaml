  text: אִם עֲוֺנ֥וֹת תִּשְׁמָר יָ֑הּ אֲ֝דֹנָ֗/י מִ֣י יַעֲמֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/003.yaml
  text: If you[a], Yah, should keep watch over iniquities, Lord, who could stand?
translation:
  language: sw
  text: Ee Yah, kama ungeweka kumbukumbu ya maovu[a], Ee Bwana, ni nani angeweza kusimama?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ungeyaangalia maovu kwa makini,” au “ungeweka hesabu ya dhambi.” Kitenzi cha Kiebrania kwa maana halisi ni “kutunza, kuangalia, au kulinda”; hapa kinamaanisha kuyaweka makosa katika hesabu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: kama
  rationale: Huanzisha sharti; pamoja na kitenzi cha masharti ‘ungeweka’ huwasilisha kwa Kiswahili cha kawaida wazo la ‘ikiwa ungefanya hivyo.’
- source_word: עֲוֺנוֹת
  choice: maovu
  rationale: Neno עָוֹן linaweza kumaanisha makosa yenye hatia au uovu; ‘maovu’ linahifadhi uzito wa kimaadili na wingi bila kulifanya kuwa neno la jumla mno.
- source_word: תִּשְׁמָר
  choice: ungeweka kumbukumbu ya
  rationale: Kitenzi שׁמר kimsingi ni kutunza, kulinda, au kuangalia; katika muktadha huu kinamaanisha kuyahifadhi maovu katika hesabu ili yashughulikiwe. Usemi huu ni wa asili kwa Kiswahili na kidokezo kinaonyesha taswira halisi.
- source_word: יָהּ
  choice: Yah
  rationale: Hili ni umbo fupi la kishairi la jina la Mungu; limetoholewa ili kulitofautisha na cheo אֲדֹנָי kinachofuata.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Hapa ni cheo cha Mungu katika usemi wa moja kwa moja; ‘Bwana’ ni tafsiri sanifu na ya heshima.
- source_word: מִי
  choice: ni nani
  rationale: Huwasilisha kwa kawaida kiwakilishi cha kuuliza katika swali la balagha.
- source_word: יַעֲמֹד
  choice: angeweza kusimama
  rationale: Huhifadhi maana ya kusimama au kubaki imara mbele ya hukumu ya Mungu, huku ikitoa nguvu ya swali la balagha.
theological_decisions:
- issue: Kutafsiri majina יָהּ na אֲדֹנָי katika mstari mmoja
  choice: יָהּ limetoholewa kuwa ‘Yah,’ na אֲדֹנָי limetafsiriwa ‘Bwana.’
  alternative: Kutafsiri yote mawili kwa ‘Bwana,’ au kutafsiri יָהּ kuwa ‘BWANA.’
  rationale: Kutofautisha jina fupi la kishairi na cheo cha Mungu kunahifadhi mpangilio na utofauti uliomo katika Kiebrania.
- issue: Maana ya uchunguzi wa Mungu katika תִּשְׁמָר
  choice: ‘ungeweka kumbukumbu ya maovu’
  alternative: ‘ungeyaangalia maovu’ au ‘ungeyahesabu maovu’
  rationale: Muktadha unahusu Mungu kuyashikilia makosa dhidi ya watu, si kuyaona tu. Tafsiri hii inadokeza hesabu ya hukumu bila kuongeza fundisho lisilosemwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Ee’ inaonyesha kwamba ‘Yah’ na ‘Bwana’ ni miito ya moja kwa moja; muundo wa masharti ‘kama ungeweka ... angeweza’ ni wa kawaida na unaeleweka kwa urahisi.
