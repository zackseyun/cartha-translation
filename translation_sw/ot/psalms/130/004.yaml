  text: But with you there is forgiveness[a], so that you may be feared.
translation:
  language: sw
  text: Lakini kwako kuna msamaha, ili uogopwe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uheshimiwe kwa kicho”; Kiebrania kinasema “uogopwe,” mara nyingi kwa maana ya kumcha Mungu kwa hofu yenye kicho.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Lakini
  rationale: Katika muktadha huu chembe hii inaleta tofauti na hali ya kukosa tumaini chini ya hukumu katika mstari uliotangulia; “Lakini” linaonyesha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: עִמְּךָ
  choice: kwako
  rationale: Muundo huu unaeleza kwamba msamaha unapatikana kwa Mungu au uko kwake; “kwako” ni usemi wa asili wa Kiswahili unaohifadhi maana hiyo.
- source_word: הַסְּלִיחָה
  choice: msamaha
  rationale: Nomino hii humaanisha kusamehe au kuondolea hatia; “msamaha” ni neno wazi, la sasa, na lenye uzito unaofaa.
- source_word: לְמַעַן
  choice: ili
  rationale: Neno hili huonyesha kusudi au matokeo; “ili” huhifadhi kwa ufupi uhusiano huo bila kuamua kupita kiasi kati ya kusudi na matokeo.
- source_word: תִּוָּרֵא
  choice: uogopwe
  rationale: Kitenzi cha Kiebrania ירא katika Nifali kinamaanisha kuogopwa au kushikwa kwa hofu yenye kicho. “Uogopwe” kinahifadhi usemi wa moja kwa moja na mvutano wa maana wa Kiebrania.
theological_decisions:
- issue: Mwitikio unaotokana na msamaha wa Mungu
  choice: Msamaha unaelekea kwa Mungu kuogopwa, kwa kutumia usemi wa moja kwa moja “uogopwe.”
  alternative: Msamaha unaelekea kwa Mungu kuheshimiwa kwa kicho.
  rationale: Kiebrania kinatumia wazi mzizi ירא, “ogopa.” Tafsiri kuu inahifadhi neno hilo badala ya kulainisha kuwa “heshimiwa,” huku tanbihi ikifafanua kwamba hapa linaweza kujumuisha hofu yenye kicho na heshima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya kawaida lakini yenye hadhi. “Kwako kuna msamaha” ni muundo wa asili unaodumisha wazo kwamba msamaha hupatikana kwa Mungu. Alama ya tanbihi imewekwa baada ya sentensi ili kufafanua “uogopwe.”
