  text: Ee Bwana, usikie sauti yangu; masikio yako na yawe makini kuelekea sauti ya vilio vyangu vya kuomba rehema.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Ee Bwana
  rationale: Ni neno la kumwita Mungu moja kwa moja; “Ee Bwana” ni la kawaida, lenye heshima, na halichanganyi jina hili na Tetragramatoni.
- source_word: שִׁמְעָה בְקוֹלִי
  choice: isikie sauti yangu
  rationale: Muundo huu huhifadhi ombi la moja kwa moja na picha halisi ya “sauti yangu” katika Kiebrania.
- source_word: תִּהְיֶינָה אָזְנֶיךָ קַשֻּׁבוֹת
  choice: masikio yako na yaisikilize kwa makini
  rationale: Huhifadhi taswira halisi ya masikio ya Mungu huku ikitoa kwa Kiswahili cha sasa maana ya kuwa makini na kusikiliza.
- source_word: לְקוֹל תַּחֲנוּנָי
  choice: sauti ya maombi yangu ya kuomba rehema
  rationale: Huhifadhi kurudiwa kwa “sauti” na kueleza תַּחֲנוּנִים kuwa maombi ya dhati ya kuomba fadhili au rehema.
theological_decisions:
- issue: Lugha ya kibinadamu kuhusu Mungu kuwa na masikio
  choice: Kuhifadhi “masikio yako”
  alternative: “Unisikilize kwa makini”
  rationale: Kiebrania kinatumia wazi taswira ya viungo vya mwili; kuihifadhi hulinda ushairi na ukaribu wa sala bila kudai maelezo ya kimwili kuhusu Mungu.
- issue: Maana ya תַּחֲנוּנָי katika sala ya toba na dhiki
  choice: “maombi yangu ya kuomba rehema”
  alternative: “dua zangu” au “maombi yangu”
  rationale: Tafsiri hii huonyesha kwamba ni maombi ya dhati ya kutafuta fadhili au rehema, bila kuongeza fundisho lisilokuwamo katika neno lenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya “sauti” na taswira ya “masikio” yamehifadhiwa kwa uaminifu kwa ushairi wa Kiebrania.
