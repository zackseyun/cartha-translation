  text: 'Wimbo wa Kupanda.[a]


    Kutoka vilindini nimekulilia, Ee Yahwe.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Wimbo wa Kupanda,” kichwa cha jadi cha kundi hili la zaburi. Maana kamili ya “kupanda” katika kichwa hiki haijulikani kwa hakika.'
    reason: cultural_note
  - marker: b
    text: 'Au: “Kutoka vilindini nilikulilia, Ee Yahwe.” Hali timilifu ya kitenzi cha Kiebrania inaweza kutafsiriwa kama tendo la wakati uliopita; “nimekulilia” huonyesha tendo lililofanyika ambalo bado lina uzito katika ombi hili.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת (shir hamma‘alot)
  choice: Wimbo wa safari za kupanda
  rationale: Neno מַעֲלוֹת linahusiana na kupanda au miinuko. Kauli hii inadokeza safari ya kupanda bila kufafanua zaidi kuliko Kiebrania, na inafaa kama kichwa cha jadi cha kundi hili la zaburi.
- source_word: מִמַּעֲמַקִּים (mimma‘amaqim)
  choice: kutoka vilindini
  rationale: Wingi wa Kiebrania unaonyesha vina au mahali pa kina; “vilindini” huhifadhi picha hiyo huku pia ikiruhusu maana ya dhiki kuu.
- source_word: קְרָאתִיךָ (qera’tikha)
  choice: nimekuita
  rationale: Kitenzi cha Kiebrania ni hali timilifu na kina maana ya kumwita mtu au kumlilia. “Nimekuita” ni cha kawaida na huhifadhi hali timilifu bila kuongeza moja kwa moja wazo la kilio ambalo halijawekwa wazi katika kitenzi chenyewe.
- source_word: יְהוָה (YHWH)
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetafsiriwa kwa umbo la kawaida la Kiswahili “Yahwe,” badala ya kulibadilisha kuwa cheo kama “BWANA.”
theological_decisions:
- issue: Maana ya picha ya “vilindi”
  choice: Imeachwa kama picha wazi ya kishairi
  alternative: Kuifafanua moja kwa moja kuwa dhiki, kukata tamaa, au vilindi vya maji
  rationale: Kiebrania hakitaji aina ya vilindi; tafsiri inahifadhi uwezekano wa kina halisi na wa hali ya dhiki.
- issue: Uwakilishi wa jina la agano YHWH
  choice: Yahwe
  alternative: BWANA
  rationale: Kutumia jina kunatofautisha jina binafsi la Mungu na cheo cha kawaida, bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mpangilio “Ee Yahwe” unaonyesha mwito wa moja kwa moja, na “kutoka vilindini” huhifadhi taswira fupi na nzito ya Kiebrania.
