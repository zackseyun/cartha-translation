base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/007.yaml
  text: Israel[a], wait for Yahweh, for with Yahweh there is steadfast love, and with him is abundant redemption.
translation:
  language: sw
  text: Israeli, mtumaini[a] Yahwe, kwa maana kwa Yahwe kuna upendo wa kudumu, na kwake kuna ukombozi mwingi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mngojee Yahwe kwa tumaini.” Kitenzi cha Kiebrania kinajumuisha kungoja kwa matarajio na kutumaini.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֵל
  choice: mtumaini
  rationale: Kitenzi יחל kina maana zinazokaribiana za kungoja kwa tumaini na kutumaini. Katika Kiswahili, “mtumaini” huwasilisha kwa kawaida utegemezi wenye matarajio; maana ya kungoja kwa tumaini imehifadhiwa katika tanbihi.
- source_word: יִשְׂרָאֵל
  choice: Ee Israeli
  rationale: Jina la taifa limeandikwa kwa umbo la kawaida la Kiswahili; “Ee” linaonyesha wazi kuwa Israeli ndiye anayeambiwa moja kwa moja.
- source_word: אֶל יְהוָה
  choice: Yahwe
  rationale: Baada ya “mtumaini,” Kiswahili hakihitaji kihusishi; uelekeo wa אֶל umo ndani ya matumizi ya kitenzi hicho.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu יהוה limetoholewa kama “Yahwe,” badala ya kubadilishwa kwa cheo.
- source_word: כִּי
  choice: kwa maana
  rationale: Kinaanzisha sababu ya wito uliotangulia na kinafaa katika ushairi wenye hadhi.
- source_word: עִם יְהוָה
  choice: kwa Yahwe kuna
  rationale: Huhifadhi kwa kiasi kikubwa muundo wa Kiebrania wa kitu kuwapo “pamoja na/mahali pa” Yahwe, bila kuufanya wazi kuwa umiliki au chanzo pekee.
- source_word: הַחֶסֶד
  choice: upendo thabiti
  rationale: חֶסֶד huunganisha upendo, uaminifu na kudumu; “upendo thabiti” huhifadhi upana huo bila istilahi nzito ya kitaalamu.
- source_word: וְהַרְבֵּה
  choice: mwingi
  rationale: Hutoa wazo la wingi mkubwa kwa namna ya kawaida inapounganishwa na “ukombozi.”
- source_word: עִמּוֹ
  choice: naye ana
  rationale: Ni Kiswahili asilia kinachomrejelea Yahwe na kueleza kile kilicho kwake, ingawa muundo halisi wa “pamoja naye” ungekuwa mzito.
- source_word: פְדוּת
  choice: ukombozi
  rationale: Neno hili huonyesha kufunguliwa kwa gharama au kuokolewa kutoka utumwani/shidani, na “ukombozi” huhifadhi uzito wake katika zaburi hii.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina la agano moja kwa moja; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Wigo wa maana wa יחל
  choice: mtumaini Yahwe
  alternative: mngojee Yahwe kwa tumaini
  rationale: Kiebrania hubeba tumaini na kungoja kwa matarajio. Maandishi makuu yanatumia Kiswahili cha kawaida, huku tanbihi ikihifadhi maana ya kungoja bila kuamua kimya kimya kuwa maana moja pekee ndiyo inayokusudiwa.
- issue: Maana pana ya חֶסֶד
  choice: upendo thabiti
  alternative: fadhili; upendo wa agano; rehema
  rationale: Chaguo hili huhifadhi upendo wenye uaminifu na udumifu bila kulifunga neno kwenye ufafanuzi mmoja wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Sentensi ni rahisi kwa msomaji wa kawaida; “Ee Israeli” huhifadhi mwito wa moja kwa moja, na tanbihi hudumisha mwingiliano wa maana kati ya kutumaini na kungoja.
