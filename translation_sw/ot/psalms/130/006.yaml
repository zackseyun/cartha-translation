  text: My soul waits for the Lord more than watchmen for the morning[a], more than watchmen for the morning.
translation:
  language: sw
  text: Nafsi yangu inamngojea Bwana kuliko walinzi wanavyoingojea asubuhi[a], kuliko walinzi wanavyoingojea asubuhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nafsi yangu iko kwa Bwana, kuliko walinzi [walivyo] kwa asubuhi.” Kiebrania hakitaji kitenzi wazi hapa; “inamngojea” kimetolewa kutokana na muktadha wa zaburi.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשִׁי
  choice: Nafsi yangu
  rationale: Huhifadhi taswira ya kishairi ya nafsi kama utu wa ndani wenye hamu na utegemezi, bila kuirahisisha kuwa ‘mimi’.
- source_word: לַאדֹנָי
  choice: inamngojea Bwana
  rationale: Kihusishi ל kinaelekeza kwa yule anayengojewa; kitenzi ‘inamngojea’ kimetolewa katika muktadha kwa Kiswahili cha kawaida.
- source_word: מִשֹּׁמְרִים
  choice: kuliko walinzi
  rationale: מן inaonyesha ulinganisho, na participio ya wingi שֹׁמְרִים inafaa kuwa ‘walinzi’ katika taswira ya zamu ya usiku.
- source_word: לַבֹּקֶר
  choice: wanavyoingojea asubuhi
  rationale: ‘Asubuhi’ ni maana ya kawaida ya בֹּקֶר; ‘wanavyoingojea’ hufanya uhusiano wa maneno uwe wazi na wa asili katika Kiswahili.
- source_word: שֹׁמְרִים לַבֹּקֶר
  choice: walinzi wanavyoingojea asubuhi
  rationale: Kirai kimerudiwa kikamilifu ili kuhifadhi msisitizo wa Kiebrania na hamu kubwa ya msemaji.
theological_decisions:
- issue: Uwasilishaji wa אֲדֹנָי kama cheo cha Mungu
  choice: Bwana
  alternative: Bwana wangu
  rationale: Katika muktadha huu cheo hicho kinamrejelea Mungu kwa heshima; ‘Bwana’ ni tafsiri ya kawaida na iliyo wazi, huku muundo wa Kiebrania ukiruhusu pia maana ya ‘Bwana wangu’.
- issue: Kitenzi kisichotajwa wazi katika Kiebrania
  choice: inamngojea
  alternative: iko kwa
  rationale: Kiebrania hakina kitenzi cha wazi katika mstari huu. ‘Inamngojea’ kinatokana na muktadha wa Zaburi 130:5–6 na huleta Kiswahili cha kawaida, lakini tanbihi inalinda uwezekano wa muundo wa moja kwa moja zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Marudio ya nusu ya pili yamehifadhiwa kwa ajili ya msisitizo wa asili.
