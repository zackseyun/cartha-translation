  text: וְ֭/הוּא יִפְדֶּ֣ה אֶת יִשְׂרָאֵ֑ל מִ֝/כֹּ֗ל עֲוֺנֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/008.yaml
  text: And he will redeem Israel from all his iniquities[a].
translation:
  language: sw
  text: Naye ataikomboa Israeli kutoka katika maovu yake yote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kawaida zaidi, “kutoka katika maovu yao yote.” Kiebrania hutumia “Israeli” katika umoja pamoja na kiambishi cha umoja (“yake”), kikilichukulia taifa la Israeli kama jumla moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Naye
  rationale: Huendeleza wazo lililotangulia na kudumisha msisitizo wa kiwakilishi bila kuuzidisha kwa kusema ‘yeye mwenyewe.’
- source_word: יִפְדֶּה
  choice: ataikomboa
  rationale: Kitenzi פדה humaanisha kukomboa au kuweka huru kwa gharama; ‘kukomboa’ ni neno la kawaida, lenye hadhi, na linalofaa tumaini la wokovu katika zaburi hii.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israeli
  rationale: אֶת ni alama ya yambwa moja kwa moja isiyotafsiriwa kwa neno tofauti; Israeli linabaki jina la watu wa agano kama jumla moja.
- source_word: מִכֹּל
  choice: kutoka katika ... yote
  rationale: Muundo huu unaonyesha ukombozi kamili kutoka kwa jumla ya mambo yanayofuata.
- source_word: עֲוֺנֹתָיו
  choice: maovu yake
  rationale: עָוֹן hubeba maana ya uovu, hatia, au kosa. ‘Maovu’ ni ya asili na yanaeleweka katika Kiswahili; ‘yake’ huhifadhi kiambishi cha umoja wa nafsi ya tatu kinachorejelea Israeli kama jumla moja.
theological_decisions:
- issue: Kiambishi cha umoja kinachorejelea Israeli kama jumla
  choice: maovu yake
  alternative: maovu yao
  rationale: Kiebrania hutumia jina la umoja ‘Israeli’ pamoja na kiambishi cha umoja. Tafsiri kuu inadumisha taswira hiyo ya Israeli kama jumla moja, huku usemi wa kawaida zaidi wa Kiswahili ukitajwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Naye’ huunganisha mstari kwa ufasaha; ‘ataikomboa Israeli’ hutumia upatanisho wa ngeli unaolichukulia jina hilo kama jumla moja. Tanbihi hufafanua tofauti kati ya umoja wa Kiebrania na usemi wa kawaida wa wingi katika Kiswahili.
