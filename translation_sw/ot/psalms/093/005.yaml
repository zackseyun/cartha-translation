  text: עֵֽדֹתֶ֨י/ךָ נֶאֶמְנ֬וּ מְאֹ֗ד לְ/בֵיתְ/ךָ֥ נַאֲוָה קֹ֑דֶשׁ יְ֝הוָ֗ה לְ/אֹ֣רֶךְ יָמִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/005.yaml
  text: Your testimonies are very trustworthy[a]; holiness befits your house, O Yahweh[b], for length of days.
translation:
  language: sw
  text: Shuhuda zako ni za kuaminika sana; utakatifu waifaa nyumba yako, Ee Yahwe, milele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno kwa neno, “kwa urefu wa siku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵדֹתֶיךָ
  choice: Shuhuda zako
  rationale: Neno hili humaanisha shuhuda au matamko ya agano ya Mungu; “shuhuda” linahifadhi upana wake bila kulifanya kuwa sheria au amri pekee.
- source_word: נֶאֶמְנוּ מְאֹד
  choice: ni za kuaminika sana
  rationale: Muundo wa Kiebrania unaonyesha uthabiti na kutegemeka; usemi huu ni wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: לְבֵיתְךָ
  choice: nyumba yako
  rationale: “Nyumba” ndiyo maana ya moja kwa moja na hapa inaweza kueleweka kuwa mahali patakatifu au hekalu bila kuifinya maana hiyo katika tafsiri.
- source_word: נַאֲוָה קֹדֶשׁ
  choice: utakatifu waifaa
  rationale: Kitenzi kinaonyesha kufaa au kupendeza; “waifaa” kinaeleza kwamba utakatifu ndio hali inayostahili nyumba ya Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi YHWH limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: לְאֹרֶךְ יָמִים
  choice: milele
  rationale: Nahau hii, ambayo neno kwa neno ni “kwa urefu wa siku,” huonyesha muda usio na mwisho; “milele” ni Kiswahili cha asili, huku taswira halisi ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ina jina binafsi la Mungu; “Yahwe” hulihifadhi badala ya kuweka cheo mahali pake.
- issue: Maana ya לְאֹרֶךְ יָמִים
  choice: milele
  alternative: kwa urefu wa siku
  rationale: “Milele” hutoa maana ya nahau kwa Kiswahili kinachoeleweka, lakini tanbihi inaonyesha muundo halisi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ee” limetumiwa kuonyesha kwamba “Yahwe” ni mwito wa moja kwa moja; mpangilio wa maneno unafuata kwa karibu mtiririko wa Kiebrania bila kuwa mgumu kwa msomaji wa kawaida.
