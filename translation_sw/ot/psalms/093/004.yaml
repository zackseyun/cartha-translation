  text: מִ/קֹּל֨וֹת מַ֤יִם רַבִּ֗ים אַדִּירִ֣ים מִשְׁבְּרֵי יָ֑ם אַדִּ֖יר בַּ/מָּר֣וֹם יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/004.yaml
  text: More majestic than the sound of many waters[a], than the mighty breakers of the sea[b], is Yahweh on high.
translation:
  language: sw
  text: Yahwe[b] aliye juu ana nguvu kuliko sauti za maji mengi[a], kuliko mawimbi yenye nguvu yanayovunjika baharini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Sauti za maji mengi zina nguvu, mawimbi yanayovunjika baharini yana nguvu; Yahwe aliye juu ana nguvu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: YHWH; kwa desturi jina hili hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: מִקֹּלוֹת
  choice: kuliko sauti za
  rationale: מִן ina nguvu ya ulinganisho katika muktadha huu, na קוֹל hapa ni ‘sauti’ ya maji; tafsiri hii inadumisha taswira ya kusikia bila kuongeza wazo la ngurumo lisilotajwa wazi.
- source_word: מַיִם רַבִּים
  choice: maji mengi
  rationale: Hii inadumisha nahau ya Kiebrania na uzito wake wa kishairi, huku ikieleweka kwa Kiswahili cha kawaida.
- source_word: אַדִּירִים / אַדִּיר
  choice: makuu / ni mkuu
  rationale: Mzizi huu huonyesha nguvu, ukuu na fahari. ‘Mkuu’ ni neno la asili na lenye hadhi katika Kiswahili, na hapa linaonyesha kwamba Yahwe anazidi nguvu na ukuu wa bahari.
- source_word: מִשְׁבְּרֵי יָם
  choice: mawimbi makuu ya bahari
  rationale: מִשְׁבָּר ni mawimbi yanayovunjika kwa nguvu. ‘Mawimbi makuu ya bahari’ ni usemi wa kawaida unaowasilisha nguvu hiyo bila kutumia istilahi adimu.
- source_word: בַּמָּרוֹם
  choice: aliye juu
  rationale: Usemi huu unadumisha wazo la mahali palipoinuka na ukuu wa Mungu bila kuufafanua moja kwa moja kuwa ‘mbinguni.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi YHWH limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Nguvu ya ulinganisho katika vifungu vinavyoanza na מִן
  choice: Yahwe aliye juu ni mkuu kuliko sauti za maji mengi na mawimbi ya bahari.
  alternative: Maji mengi na mawimbi ya bahari yanaelezwa kwanza kuwa makuu, kisha Yahwe anatangazwa kuwa mkuu aliye juu.
  rationale: Marudio ya מִן yanaunga mkono sana ulinganisho, lakini mpangilio mfupi wa kishairi wa Kiebrania unaruhusu usomaji mwingine; huo umehifadhiwa katika tanbihi.
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la Mungu, si neno la Kiebrania linalomaanisha ‘Bwana.’ Tanbihi inataja desturi nyingine ya kulitafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini rahisi kueleweka. Mpangilio umefanywa wa asili katika Kiswahili kwa kuweka mhusika ‘Yahwe’ mwanzoni, huku ulinganisho na urudiaji wa kishairi vikidumishwa. ‘Mkuu’ hubeba kwa pamoja maana za nguvu, ukuu na fahari bila kuingiza istilahi ya kimadhehebu.
