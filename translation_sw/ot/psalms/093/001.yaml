  text: יְהוָ֣ה מָלָךְ֮ גֵּא֪וּת לָ֫בֵ֥שׁ לָבֵ֣שׁ יְ֭הוָה עֹ֣ז הִתְאַזָּ֑ר אַף תִּכּ֥וֹן תֵּ֝בֵ֗ל בַּל תִּמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/001.yaml
  text: Yahweh reigns[a]; he is clothed with majesty; Yahweh is clothed with strength; he has girded himself. Indeed, the world is established[e][d][c][b]; it will not be moved.
translation:
  language: sw
  text: Yahwe anatawala[a]; amejivika adhama[b]. Yahwe amejivika nguvu; amejifunga kiunoni[c]. Naam, ulimwengu umewekwa imara[d]; hautatetereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe amekuwa Mfalme.” Kitenzi cha Kiebrania kinaweza pia kueleweka kuwa ametwaa utawala, lakini hapa huenda kinatangaza utawala wake wa sasa.
    reason: alternative_reading
  - marker: b
    text: Au, “fahari.”
    reason: lexical_alternative
  - marker: c
    text: 'Kihalisi, “amejifunga kiunoni.” Taswira ni ya mtu anayejifunga kiunoni ili kuwa tayari, kama mpiganaji. Muundo wa Kiebrania unaweza pia kueleweka: “Yahwe amejivika; amejifunga nguvu kiunoni.”'
    reason: cultural_note_and_syntactic_alternative
  - marker: d
    text: Au, “ulimwengu unaokaliwa umeimarishwa; hautayumba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la Mungu lililo katika maandishi ya Kiebrania, kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: מָלָךְ
  choice: anatawala
  rationale: Katika zaburi hii ya kifalme, kitenzi kinatangaza utawala wa Yahwe kama hali ya sasa; pia kinaweza kueleweka kwa maana ya kuanza kutawala.
- source_word: גֵּאוּת
  choice: adhama
  rationale: Katika kumhusu Yahwe, neno hili linaonyesha ukuu na fahari ya kifalme, si kiburi chenye maana mbaya.
- source_word: לָבֵשׁ
  choice: amejivika
  rationale: Linadumisha taswira ya kuvaa vazi na urudiaji wa kishairi wa kitenzi katika mstari.
- source_word: עֹז
  choice: nguvu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya uwezo au uweza katika muktadha huu.
- source_word: הִתְאַזָּר
  choice: amejifunga tayari
  rationale: Kitenzi cha Kiebrania kinaonyesha mtu anayejifunga kiunoni ili kuwa tayari kwa tendo; usemi huu unahifadhi taswira bila kuongeza wazi kitu kisichotajwa.
- source_word: אַף
  choice: Naam
  rationale: Linaonyesha uthibitisho wenye mkazo unaounganisha utawala wa Yahwe na uthabiti wa ulimwengu.
- source_word: תִּכּוֹן
  choice: umewekwa imara
  rationale: Huwasilisha hali ya kuwa umeimarishwa au kuthibitishwa kwa lugha ya kawaida ya Kiswahili.
- source_word: תֵּבֵל
  choice: ulimwengu
  rationale: Neno hili humaanisha ulimwengu uliokaliwa na uliopangwa, na ‘ulimwengu’ ni chaguo fupi na la kawaida.
- source_word: בַּל תִּמּוֹט
  choice: hautatetereka
  rationale: Linatoa kwa kawaida wazo la kutoyumba, kutikisika, au kuanguka kutoka katika hali imara.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina maalumu la Mungu, si cheo; ‘Yahwe’ hulihifadhi badala ya kulibadili kuwa cheo.
- issue: Wakati na hali ya מָלָךְ
  choice: anatawala
  alternative: amekuwa Mfalme
  rationale: Muktadha unatilia mkazo ukweli wa sasa wa ufalme wa Yahwe, lakini tanbihi inahifadhi uwezekano wa maana ya kuanza kutawala.
- issue: Uhusiano wa עֹז na vitenzi vinavyoizunguka
  choice: ‘nguvu’ imeunganishwa na ‘amejivika’
  alternative: ‘amejifunga nguvu kiunoni’
  rationale: Mpangilio huu unafuata uhusiano unaowezekana kwa urahisi katika maandishi, huku tanbihi ikihifadhi uchanganuzi mwingine unaowezekana wa kishairi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Urudiaji na taswira za kuvaa na kujifunga zimehifadhiwa; sentensi ni fupi ili kudumisha mdundo wa zaburi.
