  yaml_path: translation/ot/psalms/093/003.yaml
  text: The rivers have lifted up[a], O Yahweh; the rivers have lifted up their voice[b]; the rivers lift up their pounding waves.
translation:
  language: sw
  text: 'Mito imejiinua[a], ee Yahwe;

    mito imeinua sauti yao;

    mito inainua mawimbi yao yenye kishindo.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mafuriko yamejiinua.” Nomino ya Kiebrania kwa kawaida humaanisha “mito,” ingawa hapa inaweza kuibua picha ya maji yenye fujo.
    reason: lexical_alternative
  - marker: b
    text: Au “kishindo chao” au “mawimbi yao yanayovunjika.” Neno la Kiebrania ni adimu na linaonyesha nguvu ya maji yanayopiga au kuvuma kwa kishindo.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשְׂאוּ / יִשְׂאוּ
  choice: imejiinua / imeinua / inainua
  rationale: Kitenzi נשׂא kina maana ya kuinua au kubeba. Katika mstari wa kwanza, “imejiinua” huonyesha maji yanayopanda bila kuongeza kitu kisichotajwa; katika mistari inayofuata, “imeinua/inainua” hudumisha muundo wa kishairi na tofauti ya aspekti kati ya vitenzi vikamilifu na kile kisichokamilifu.
- source_word: נְהָרוֹת
  choice: mito
  rationale: Maana ya kawaida ya nomino hii ni “mito.” Ingawa “mafuriko” yanawezekana katika picha ya maji yenye fujo, “mito” huhifadhi maana ya moja kwa moja ya Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe,” badala ya kubadilishwa na cheo. Kihisishi “ee” kinaonyesha kwamba hapa ni wito wa moja kwa moja.
- source_word: קוֹלָם
  choice: sauti yake
  rationale: קוֹל inaweza kumaanisha sauti au kelele. “Sauti yake” huhifadhi uhuishaji wa kishairi wa mito; katika upatanisho wa ngeli ya mito, umilikishi wa pamoja unaelezwa kwa “yake.”
- source_word: דָּכְיָם
  choice: mawimbi yake yenye kishindo
  rationale: Hii ni nomino adimu inayohusishwa na kupiga, kuvuma, au kuvunjika kwa nguvu kwa maji. Tafsiri hii inaweka wazi picha ya mawimbi huku ikidumisha nguvu na kishindo cha maji.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe, katika wito “ee Yahwe”
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” huhifadhi jina binafsi la Mungu, na “ee” huwasilisha usemi wa kumwita moja kwa moja bila kuligeuza jina hilo kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Marudio ya “mito” na “imeinua/inainua” yamehifadhiwa ili kuendeleza urari na kilele cha ushairi wa Kiebrania.
