  text: Your throne is established from of old[a]; you are from everlasting.
translation:
  language: sw
  text: Kiti chako cha enzi ni imara tangu zamani za kale[a]; wewe umekuwapo tangu milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kiti chako cha enzi kimewekwa imara tangu kale; wewe ni wa milele.”
    reason: Mbadala huu huonyesha kwamba נָכוֹן linaweza kueleweka kama hali ya kuwa kimewekwa imara, na hutoa usemi mwingine wa kishairi kwa misemo ya wakati.
lexical_decisions:
- source_word: נָכוֹן
  choice: ni imara
  rationale: Umbo hili linaeleza hali thabiti ya kiti cha enzi—kwamba kimesimama kwa uthabiti. Kiswahili “ni imara” kinawasilisha hali hiyo bila kudokeza kwa lazima mtendaji aliyekisimamisha.
- source_word: כִּסְאֲךָ
  choice: kiti chako cha enzi
  rationale: כִּסֵּא hapa ni kiti cha enzi, na kiambishi cha nafsi ya pili umoja wa kiume kinawakilishwa na “chako.”
- source_word: מֵאָז
  choice: tangu zamani za kale
  rationale: Katika muktadha huu, neno hili linaelekeza kwenye wakati wa zamani sana, si wakati fulani wa karibuni. Usemi huu ni wa kishairi lakini unaeleweka kwa urahisi.
- source_word: מֵעוֹלָם
  choice: tangu milele
  rationale: Linapotumiwa kumhusu Mungu, עוֹלָם hapa linaonyesha wakati usio na mwanzo unaoweza kuonekana; “tangu milele” huhifadhi uzito na upana wa usemi huo.
- source_word: אָתָּה
  choice: wewe umekuwapo
  rationale: Kiwakilishi huru kinatumika kama kiarifu pamoja na kishazi cha wakati kilichotangulia. Kiswahili cha kawaida huhitaji kitenzi, hivyo “umekuwapo” linaeleza kuwepo kwa Mungu tangu milele bila kuongeza istilahi za kifalsafa.
theological_decisions:
- issue: Lugha ya wakati kuhusu kuwepo kwa Mungu
  choice: wewe umekuwapo tangu milele
  alternative: wewe ni wa milele
  rationale: Chaguo hili linathibitisha kuwepo kwa Mungu kabla ya nyakati zote huku likihifadhi muundo wa Kiebrania wa “tangu milele,” bila kuingiza ufafanuzi wa kimetafizikia usiotajwa moja kwa moja katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi na chenye heshima lakini kinachoeleweka kwa wasomaji wa kawaida. “Kiti cha enzi” ni usemi wa kawaida wa kifalme, na “zamani za kale” pamoja na “tangu milele” huhifadhi ulinganifu wa kishairi wa mstari.
