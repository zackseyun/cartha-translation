  text: מַעֲשֵׂ֣י יָ֭דָי/ו אֱמֶ֣ת וּ/מִשְׁפָּ֑ט נֶ֝אֱמָנִ֗ים כָּל פִּקּוּדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/007.yaml
  text: The works of his hands are truth and justice[b][a]; all his precepts are trustworthy.
translation:
  language: sw
  text: Matendo ya mikono yake ni kweli na haki[a]; maagizo yake yote[b] ni ya kuaminika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uaminifu na haki.”
    reason: lexical_alternative
  - marker: b
    text: Au, “maelekezo yake yote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂי
  choice: Matendo
  rationale: Nomino hii inaweza kumaanisha vitu vilivyofanywa au matendo; hapa “matendo” ni ya kawaida na inafaa kwa ushairi.
- source_word: יָדָיו
  choice: ya mikono yake
  rationale: Taswira halisi ya Kiebrania imehifadhiwa; “mikono” inaonyesha utendaji na uwezo wake.
- source_word: אֱמֶת
  choice: kweli
  rationale: “Kweli” huhifadhi maana ya msingi na uwiano wa kishairi na “haki,” bila kufuta uwezekano wa maana ya uaminifu.
- source_word: וּמִשְׁפָּט
  choice: na haki
  rationale: Katika jozi hii, “haki” ni Kiswahili cha kawaida kinachoonyesha sifa ya matendo ya Mungu kuliko “hukumu.”
- source_word: נֶאֱמָנִים
  choice: ni ya kuaminika
  rationale: Kirai hiki kinaeleza uthabiti na utegemekaji wa maagizo ya Mungu kwa Kiswahili cha sasa na cha kawaida.
- source_word: כָּל
  choice: yote
  rationale: Huhifadhi upeo kamili wa kiambishi cha Kiebrania.
- source_word: פִּקּוּדָיו
  choice: maagizo yake
  rationale: “Maagizo” huonyesha maelekezo yenye mamlaka na nguvu ya kimaadili na kisheria, bila kutumia neno lisilo la kawaida kwa wasomaji wengi.
theological_decisions:
- issue: Iwapo אֱמֶת inapaswa kutafsiriwa “kweli” au “uaminifu” inapoyaeleza matendo ya Mungu
  choice: kweli
  alternative: uaminifu
  rationale: “Kweli” huhifadhi muundo wa nomino na uwiano wa “kweli na haki”; tanbihi inahifadhi maana halali ya “uaminifu,” huku sehemu ya pili tayari ikieleza utegemekaji kwa נֶאֱמָנִים.
- issue: Iwapo פִּקּוּדָיו itafsiriwe kwa neno la jumla zaidi
  choice: maagizo yake
  alternative: maelekezo yake
  rationale: “Maagizo” yanaonyesha amri au maelekezo yenye mamlaka, na hivyo kuhifadhi uzito wa kimaadili na kisheria wa neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya “mikono yake” imehifadhiwa, na sentensi imewekwa kwa mpangilio wa asili wa mistari miwili ya Kiebrania.
