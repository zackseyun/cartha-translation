  text: רֵ֘אשִׁ֤ית חָכְמָ֨ה יִרְאַ֬ת יְהוָ֗ה שֵׂ֣כֶל ט֭וֹב לְ/כָל עֹשֵׂי/הֶ֑ם תְּ֝הִלָּת֗/וֹ עֹמֶ֥דֶת לָ/עַֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/010.yaml
  text: The fear of Yahweh is the beginning of wisdom[a]; good understanding belongs to all who practice it[c][b]. His praise stands forever.
translation:
  language: sw
  text: Kumcha Yahweh ni mwanzo wa hekima; wote wanaoyatenda hayo wana ufahamu mwema.[a] Sifa yake inadumu milele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu, “ufahamu mwema ni kwa wote wanaoyatenda.” Kiebrania hakitaji wazi mambo yanayotendwa; huenda kinarejelea maagizo ya Yahweh yaliyotajwa katika zaburi hii au matendo yanayoonyesha kumcha yeye.
    reason: Utata wa kisarufi na kirejewa kisichotajwa wazi katika Kiebrania.
  - marker: b
    text: Kwa tafsiri ya karibu, “Sifa yake inasimama milele.”
    reason: Kuonyesha picha halisi ya kitenzi cha Kiebrania huku maandishi makuu yakitumia nahau ya kawaida ya Kiswahili.
lexical_decisions:
- source_word: רֵאשִׁית חָכְמָה
  choice: mwanzo wa hekima
  rationale: Hii inahifadhi maana ya jambo linaloanzisha au kuweka msingi wa hekima bila kuifanya iwe ya wakati tu wala ‘sehemu kuu’ pekee.
- source_word: יִרְאַת יְהוָה
  choice: kumcha Yahweh
  rationale: ‘Kumcha’ ni usemi wa kawaida na wenye uzito katika Kiswahili; unajumuisha hofu yenye staha na heshima, bila kuupunguza kuwa heshima tu. Jina la agano יְהוָה limetolewa kama ‘Yahweh’.
- source_word: שֵׂכֶל טוֹב
  choice: ufahamu mwema
  rationale: Kirai hiki kinaonyesha ufahamu wenye busara na matokeo mema katika mwenendo, si maarifa ya kiakili pekee.
- source_word: לְכָל עֹשֵׂיהֶם
  choice: wote wanaoyatenda hayo wana ufahamu mwema
  rationale: Muundo huu unatoa kwa Kiswahili wazo la kwamba ufahamu mwema ni wa wale wanaotenda, huku ‘hayo’ ikihifadhi kwa kiasi uwezekanavyo kiwakilishi cha wingi ambacho hakina kitangulizi wazi katika Kiebrania.
- source_word: תְּהִלָּתוֹ
  choice: sifa yake
  rationale: Kiwakilishi cha nafsi ya tatu kwa kawaida humrejelea Yahweh katika muktadha. ‘Sifa’ inaweza kumaanisha sifa anazopewa au ustahili wake wa kusifiwa, hivyo utata huo haujaondolewa.
- source_word: עֹמֶדֶת לָעַד
  choice: inadumu milele
  rationale: Hii ni tafsiri ya kawaida na ya asili ya nahau inayosema kwamba sifa hiyo itaendelea bila mwisho; picha halisi ya ‘kusimama’ imeelezwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina la agano moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya יִרְאָה katika usemi wa hekima
  choice: kumcha
  alternative: kumheshimu kwa kina
  rationale: ‘Kumcha’ huhifadhi uzito wa hofu pamoja na staha na heshima, na hailegezi maana kuwa heshima ya kawaida tu.
- issue: Kirejewa cha kiambishi cha wingi katika עֹשֵׂיהֶם
  choice: hayo, bila kutaja wazi ni mambo gani
  alternative: maagizo yake
  rationale: Kiebrania kina kiambishi cha wingi kisicho na kitangulizi wazi. Huenda kinarejelea maagizo ya Yahweh yaliyotajwa awali katika zaburi, lakini kutaja ‘maagizo’ moja kwa moja kungeondoa utata wa asili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni nyepesi kwa msomaji wa kawaida lakini inahifadhi msamiati mkuu wa fasihi ya hekima na utata halisi wa kiwakilishi cha Kiebrania.
