base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/001.yaml
  text: Praise Yah! I will give thanks to Yahweh with my whole heart[b][a], in the council of the upright and in the congregation.
translation:
  language: sw
  text: Msifuni Yah![a] Nitamshukuru Yahweh kwa moyo wangu wote, katika baraza la wanyofu[b] na katika kusanyiko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina maana ya “Msifuni Yah,” kikitumia umbo fupi la jina la Mungu; pia hutoholewa kuwa “Haleluya.”
    reason: lexical_alternative
  - marker: b
    text: Au “katika mkutano wa wanyofu.” Neno la Kiebrania linaweza kumaanisha baraza, kundi la karibu, au mkutano uliokusanyika.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ֥לְלוּ יָ֨הּ
  choice: Msifuni Yah!
  rationale: Amri ya wingi הַלְלוּ pamoja na jina fupi יָהּ ni mwito wa kuanza sifa. “Msifuni Yah!” inaonyesha wazi maana na umbo la Kiebrania, huku ikitofautisha יָהּ na יְהוָה inayofuata.
- source_word: אוֹדֶ֣ה
  choice: Nitamshukuru
  rationale: Kitenzi ידה katika Hiphil hapa kinaeleza shukrani yenye sifa na kina nguvu ya azimio la mtu binafsi; wakati ujao wa Kiswahili unafaa kwa kauli hiyo.
- source_word: יְ֭הוָה
  choice: Yahweh
  rationale: Jina la Mungu limetoholewa badala ya kubadilishwa kuwa cheo, na hivyo linatofautishwa na umbo fupi “Yah” mwanzoni mwa mstari.
- source_word: בְּ/כָל לֵבָ֑ב
  choice: kwa moyo wangu wote
  rationale: Kirai hiki kinaonyesha kujitoa kwa ndani bila kugawanyika. Kiwakilishi “wangu” kinatokana kimaana na kitenzi cha nafsi ya kwanza na hufanya Kiswahili kiwe cha kawaida.
- source_word: בְּ/ס֖וֹד
  choice: katika baraza
  rationale: סוֹד inaweza kuwa baraza, kundi la karibu, au mkutano. “Baraza” huhifadhi tofauti yake na עֵדָה na linafaa kwa kundi lililokusanyika.
- source_word: יְשָׁרִ֣ים
  choice: wanyofu
  rationale: Neno hili linawaeleza watu walio waadilifu au wenye mwenendo ulionyooka; “wanyofu” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: וְ/עֵדָֽה
  choice: na katika kusanyiko
  rationale: עֵדָה ni jumuiya iliyokusanyika. “Kusanyiko” linafaa katika mazingira ya ibada na linadumisha tofauti na “baraza.”
theological_decisions:
- issue: Kutafsiri majina ya Mungu יָהּ na יְהוָה yanapotokea pamoja
  choice: Kutumia “Yah” kwa יָהּ na “Yahweh” kwa יְהוָה
  alternative: Kutumia “BWANA” kwa yote mawili, au “Haleluya” kwa יָהּ na “BWANA” kwa יְהוָה
  rationale: Kiebrania kinatumia umbo fupi la jina na kisha Tetragramatoni kamili. Kutumia “Yah” na “Yahweh” kunahifadhi tofauti hiyo iliyo katika maandishi bila kuibadilisha kuwa tofauti ya vyeo.
- issue: Upeo wa סוֹד katika mazingira ya ibada
  choice: “baraza,” pamoja na tanbihi inayotaja “mkutano wa wanyofu”
  alternative: “kusanyiko” au “kundi la karibu”
  rationale: Neno linaweza kumaanisha baraza, duru ya karibu, au mkutano. Maandishi yanahifadhi “baraza” ili kulitofautisha na עֵדָה, lakini tanbihi inalinda upana halisi wa maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa kishairi na tofauti kati ya “baraza” na “kusanyiko” zimehifadhiwa; majina “Yah” na “Yahweh” yametoholewa.
