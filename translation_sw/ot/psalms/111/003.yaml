  text: Splendor and majesty are his work[a], and his righteousness stands forever.
translation:
  language: sw
  text: 'Kazi yake ina fahari na utukufu,

    na haki yake[a] inadumu milele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uadilifu wake unadumu milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד
  choice: fahari
  rationale: Katika ubeti huu הוֹד huonyesha uzuri wenye heshima na uangavu; “fahari” huunda jozi ya kishairi ya kawaida pamoja na “utukufu” bila kuzifanya istilahi hizi mbili kuwa kitu kimoja.
- source_word: הָדָר
  choice: utukufu
  rationale: הָדָר katika jozi hii humaanisha adhama au uzuri wa kifalme; “utukufu” hudumisha sauti iliyoinuliwa na kueleweka kwa urahisi katika Kiswahili.
- source_word: פָּעֳלוֹ
  choice: kazi yake
  rationale: Nomino ya umoja inaweza kumaanisha kazi, tendo, au shughuli; “kazi yake” huhifadhi umoja wa Kiebrania huku ikiweza kujumuisha matendo ya Mungu kwa ujumla.
- source_word: צִדְקָתוֹ
  choice: haki yake
  rationale: “Haki” katika Kiswahili inaweza kuwasilisha unyoofu wa kimaadili na pia uadilifu wa Mungu, na hivyo huhifadhi upana wa צְדָקָה vizuri kuliko chaguo linalosisitiza hukumu pekee.
- source_word: עֹמֶדֶת
  choice: inadumu
  rationale: Ingawa kitenzi kina picha halisi ya ‘kusimama,’ katika muktadha huu hali ya kuendelea ndiyo maana kuu; “inadumu” ni ya asili na wazi katika Kiswahili.
- source_word: לָעַד
  choice: milele
  rationale: “Milele” huwasilisha kwa ufupi na kwa kawaida maana ya kuendelea bila mwisho.
theological_decisions:
- issue: Maana ya צִדְקָתוֹ kuhusu sifa ya Mungu inayodumu
  choice: haki yake
  alternative: uadilifu wake
  rationale: צִדְקָה inaweza kuelekea kwenye unyoofu wa kimaadili au haki ya kiutendaji. “Haki yake” huhifadhi upana huo katika Kiswahili; “uadilifu wake” ni mbadala unaosisitiza zaidi unyoofu wa tabia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulioinuliwa lakini wa kawaida. Mpangilio umebadilishwa kidogo ili “fahari na utukufu” zieleweke wazi kuwa sifa za kazi ya Mungu. Alama ya tanbihi imewekwa baada ya kauli inayohusika.
