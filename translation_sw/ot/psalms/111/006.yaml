  yaml_path: translation/ot/psalms/111/006.yaml
  text: He has declared to his people the power of his works[a], in giving them the inheritance of the nations.
translation:
  language: sw
  text: Amewajulisha watu wake nguvu ya matendo yake[a], kwa kuwapa urithi wa mataifa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Amewajulisha watu wake nguvu ya matendo yake, ili kuwapa urithi wa mataifa.” Kitenzi-jina cha Kiebrania kinaweza kueleza kusudi badala ya njia au matokeo.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּחַ
  choice: nguvu
  rationale: Neno hili humaanisha nguvu au uwezo; “nguvu” linafaa kwa matendo makuu ya Mungu na ni la kawaida katika Kiswahili.
- source_word: מַעֲשָׂיו
  choice: matendo yake
  rationale: Hurejelea kazi au vitendo alivyofanya; “matendo yake” ni lugha ya asili na yenye hadhi katika muktadha wa sifa.
- source_word: הִגִּיד
  choice: amewajulisha
  rationale: Hifili ya נגד humaanisha kutangaza, kueleza, au kufanya jambo lijulikane. “Amewajulisha” huonyesha kwamba Mungu aliwafanya watu wake wajue nguvu hiyo.
- source_word: לְעַמּוֹ
  choice: watu wake
  rationale: Kiambishi ל kinatambulisha walengwa wa ujumbe; umilikaji wa umoja katika Kiebrania umehifadhiwa kwa “watu wake.”
- source_word: לָתֵת
  choice: kwa kuwapa
  rationale: Kitenzi-jina chenye ל kinaweza kueleza njia/matokeo au kusudi. Katika matini kuu, “kwa kuwapa” huonyesha kwamba utoaji wa urithi ulidhihirisha nguvu ya matendo yake.
- source_word: לָהֶם
  choice: kuwapa
  rationale: Kiwakilishi kinawarejelea “watu wake” na kimejumuishwa kwa kawaida katika umbo la kitenzi cha Kiswahili.
- source_word: נַחֲלַת
  choice: urithi
  rationale: Neno hili humaanisha urithi, milki, au sehemu iliyogawiwa; “urithi” huhifadhi lugha ya agano na uhusiano wa muundo na “mataifa.”
- source_word: גּוֹיִם
  choice: mataifa
  rationale: Hapa hurejelea mataifa ambayo milki yao ilipewa Israeli; “mataifa” ni tafsiri pana na isiyoingiza maana mahsusi ya Agano Jipya.
theological_decisions:
- issue: Uhusiano wa kishazi לָתֵת לָהֶם נַחֲלַת גּוֹיִם na kishazi kikuu
  choice: 'Maana ya njia/matokeo: alionyesha nguvu ya matendo yake kwa kuwapa urithi wa mataifa.'
  alternative: 'Maana ya kusudi: aliwajulisha watu wake nguvu ya matendo yake ili kuwapa urithi wa mataifa.'
  rationale: Kitenzi-jina cha Kiebrania chenye ל kinaweza kuonyesha kusudi, matokeo, au njia. Muktadha unaunga mkono utoaji wa urithi kama udhihirisho wa nguvu, lakini uwezekano wa kusudi umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa urahisi. “Amewajulisha” ni ya asili zaidi kuliko “ametangaza kwa watu wake,” huku ikihifadhi maana ya kufanya jambo lijulikane. Alama ya tanbihi [a] imewekwa mara baada ya kishazi kinachohusika.
