  text: זֵ֣כֶר עָ֭שָׂה לְ/נִפְלְאֹתָ֑י/ו חַנּ֖וּן וְ/רַח֣וּם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/004.yaml
  text: He has caused his wondrous works to be remembered[a]; Yahweh is gracious and compassionate.
translation:
  language: sw
  text: Amefanya matendo yake ya ajabu yakumbukwe[a]; Yahweh ni mwenye neema na huruma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ameweka ukumbusho wa matendo yake ya ajabu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֵכֶר
  choice: yakumbukwe
  rationale: Nomino hii inaweza kumaanisha ‘kumbukumbu’ au ‘ukumbusho.’ Pamoja na עָשָׂה na לְנִפְלְאֹתָיו, tafsiri ya kimatendo ‘amefanya ... yakumbukwe’ ni ya asili katika Kiswahili na hudumisha wazo la kumbukumbu ya kudumu.
- source_word: עָשָׂה
  choice: amefanya
  rationale: Kitenzi kimsingi humaanisha ‘amefanya/ametengeneza’; hapa muundo ‘amefanya ... yakumbukwe’ unaonyesha nguvu ya kirai cha Kiebrania bila kufafanua kupita kiasi.
- source_word: לְנִפְלְאֹתָיו
  choice: matendo yake ya ajabu
  rationale: Neno hili kwa kawaida hurejelea matendo ya Mungu yaliyo ya kushangaza; ‘matendo yake ya ajabu’ ni wazi, ya kawaida, na hudumisha maana halisi ya vitendo.
- source_word: חַנּוּן
  choice: mwenye neema
  rationale: Hueleza mwelekeo wa Mungu wa kuonyesha fadhili na neema; ‘mwenye neema’ ni usemi wa heshima na unaoeleweka kwa urahisi.
- source_word: וְרַחוּם
  choice: na huruma
  rationale: רַחוּם huonyesha rehema na moyo wa huruma. ‘Mwenye neema na huruma’ ni muunganiko wa asili unaotofautisha sifa hizi bila kuzirudia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama ‘Yahwe,’ badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kuliwakilisha kwa cheo.
- issue: Kiima cha kitenzi עָשָׂה
  choice: Kiima kimedokezwa katika ‘amefanya’ na kutambulishwa baadaye kuwa Yahwe
  alternative: Tafsiri isiyo na mtendaji dhahiri, kama ‘Ukumbusho umefanywa kwa ajili ya matendo yake ya ajabu’
  rationale: Kitenzi cha Kiebrania ni nafsi ya tatu umoja wa kiume, huku jina Yahwe likitokea mwishoni. Muundo wa Kiswahili ‘amefanya’ huhifadhi kiima kilichodokezwa bila kuongeza nomino mapema.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inatumia ulinganifu bora: ni ya asili kwa msomaji wa kawaida huku ikihifadhi uwezekano wa זֵכֶר kumaanisha kumbukumbu au ukumbusho.'
