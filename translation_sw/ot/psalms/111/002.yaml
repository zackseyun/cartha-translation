translation:
  language: sw
  text: Matendo ya BWANA ni makuu; huchunguzwa na wote wanaoyafurahia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּדֹלִים
  choice: ni makuu
  rationale: Huhifadhi maana ya ukubwa na ukuu wa matendo, huku ikipatana kisarufi na nomino ya ngeli ya ma-.
- source_word: מַעֲשֵׂי
  choice: Matendo
  rationale: Ni tafsiri ya kawaida na pana ya מעשים katika muktadha wa kazi anazotenda Mungu.
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea katika tafsiri za Biblia za Kiswahili ya kuwakilisha jina la agano YHWH kwa BWANA kwa herufi kubwa.
- source_word: דְּרוּשִׁים
  choice: huchunguzwa
  rationale: Umbo hili linaweza kumaanisha kutafutwa kwa bidii au kuchunguzwa; “huchunguzwa” linaonyesha uchunguzi wa makusudi bila kupunguza maana kuwa kusoma maandishi pekee.
- source_word: לְכָל חֶפְצֵיהֶם
  choice: na wote wanaoyafurahia
  rationale: Huwasilisha kwa Kiswahili cha kawaida wale wanaopata furaha na kupendezwa na matendo hayo; kiwakilishi “ya-” kinarejelea matendo.
theological_decisions:
- issue: Uhusiano kati ya kuchunguza na kufurahia matendo ya Mungu
  choice: huchunguzwa na wote wanaoyafurahia
  alternative: hutafutwa na wote wanaopendezwa nayo
  rationale: Uchaguzi huu hauongezi madai ya kimadhehebu; unahifadhi mvutano wa maandishi kwamba matendo hayo ni kitu cha uchunguzi wa makusudi kwa wale wanaoyafurahia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini rahisi kueleweka. Nukta mkato inahifadhi mgawanyo wa kishairi wa mistari miwili ya Kiebrania.
