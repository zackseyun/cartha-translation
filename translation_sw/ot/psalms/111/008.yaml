  yaml_path: translation/ot/psalms/111/008.yaml
  text: They are established forever and ever[b][a], done in truth and uprightness.
translation:
  language: sw
  text: Zimeimarishwa milele na milele,[a] zimefanywa kwa kweli[b] na kwa unyofu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Zimetegemezwa milele na milele”; kauli ya Kiebrania inaweza kusisitiza kutegemezwa au kufanywa imara.
    reason: lexical_alternative
  - marker: b
    text: “Kwa kweli” pia inaweza kutafsiriwa “kwa uaminifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: סְמוּכִים
  choice: zimeimarishwa
  rationale: Kauli tendwa ya סמך ina maana ya kutegemezwa au kufanywa imara. “Zimeimarishwa” inaeleza uthabiti wa kudumu wa maagizo ya Mungu kwa Kiswahili cha kawaida bila kuondoa wazo la kutegemezwa.
- source_word: לָעַד לְעוֹלָם
  choice: milele na milele
  rationale: Maneno haya mawili ya muda yanasisitiza kudumu bila mwisho; msemo wa Kiswahili “milele na milele” huhifadhi msisitizo huo kwa njia ya asili.
- source_word: עֲשׂוּיִם
  choice: zimefanywa
  rationale: Kauli tendwa ya עשה ni “kufanywa” au “kutendwa.” “Zimefanywa” huhifadhi muundo na maana pana ya Kiebrania bila kuamua kimya-kimya ikiwa kinachosisitizwa ni kutungwa au kutekelezwa.
- source_word: בֶּאֱמֶת
  choice: kwa kweli
  rationale: אֱמֶת inaweza kumaanisha kweli, uaminifu, au kutegemeka. “Kwa kweli” huhifadhi kiini cha maana, huku tanbihi ikionyesha uwezekano wa “kwa uaminifu.”
- source_word: וְיָשָׁר
  choice: na kwa unyofu
  rationale: יָשָׁר humaanisha kilicho nyofu, sawa, au adilifu. “Kwa unyofu” huunda jozi ya asili na “kwa kweli” na kueleza uadilifu bila kuingiza ufafanuzi wa kimadhehebu.
