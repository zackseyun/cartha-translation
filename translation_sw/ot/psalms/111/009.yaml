base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/009.yaml
  text: He sent redemption to his people[a]; he has commanded his covenant forever[b]. Holy and awesome is his name.
translation:
  language: sw
  text: Aliwapelekea watu wake ukombozi; aliamuru agano lake lidumu milele.[a] Jina lake ni takatifu na la kuogofya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliliweka imara agano lake milele.” Kitenzi cha Kiebrania kwa msingi humaanisha “aliamuru” au “aliagiza.”
    reason: lexical_alternative
  - marker: b
    text: Au, “la kutisha” au “lenye kuamsha hofu na mshangao.” Kiebrania hukazia hofu yenye heshima pamoja na mshangao mkuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדוּת
  choice: ukombozi
  rationale: Neno hili humaanisha kuachiliwa au kuokolewa kwa njia ya fidia au tendo la kuingilia kati; “ukombozi” huhifadhi upana na uzito wa maana hiyo katika sifa kwa Mungu.
- source_word: שָׁלַח לְעַמּוֹ
  choice: aliwapelekea watu wake
  rationale: Kitenzi kina maana ya “kutuma,” na לְ humtambulisha mpokeaji. “Aliwapelekea” ni Kiswahili cha kawaida kinachohifadhi picha ya Mungu kuanzisha ukombozi na kuufikisha kwa watu wake.
- source_word: צִוָּה
  choice: aliamuru
  rationale: Huhifadhi nguvu ya msingi ya kitenzi cha Kiebrania, yaani kuamuru au kuagiza, badala ya kukitafsiri moja kwa moja kuwa “alilithibitisha.”
- source_word: לְעוֹלָם בְּרִיתוֹ
  choice: agano lake lidumu milele
  rationale: “Agano” ni neno la kawaida la kibiblia kwa בְּרִית, na “lidumu milele” huonyesha uendelevu usio na kikomo unaokusudiwa na לְעוֹלָם katika Kiswahili cha asili.
- source_word: קָדוֹשׁ
  choice: takatifu
  rationale: Hili ndilo neno sanifu na sahihi kwa utakatifu wa jina la Mungu.
- source_word: וְנוֹרָא
  choice: la kuogofya
  rationale: Neno hili huonyesha kwamba jina la Mungu huchochea hofu yenye heshima pamoja na mshangao mkuu. “La kuogofya” huhifadhi sehemu ya hofu kuliko neno dhaifu la mshangao pekee.
- source_word: שְׁמוֹ
  choice: jina lake
  rationale: Tafsiri ya moja kwa moja huhifadhi matumizi ya kibiblia ambapo jina la Mungu huwakilisha tabia na sifa yake iliyofunuliwa.
theological_decisions:
- issue: Nguvu ya צִוָּה inapohusishwa na agano la milele
  choice: aliamuru agano lake lidumu milele
  alternative: aliliweka imara agano lake milele
  rationale: Tafsiri iliyochaguliwa huhifadhi wazo la amri yenye mamlaka katika kitenzi cha Kiebrania, huku “lidumu” ikifanya sentensi iwe wazi na ya kawaida kwa Kiswahili bila kudai kwamba kitenzi chenyewe humaanisha tu “kuweka imara.”
- issue: Maana ya וְנוֹרָא kuhusu jina la Mungu
  choice: la kuogofya
  alternative: la kutisha; lenye kuamsha hofu na mshangao
  rationale: Kiebrania huunganisha hofu ya heshima na ukuu unaostaajabisha. Tafsiri kuu huhifadhi mvutano huo, na tanbihi inaonyesha njia nyingine zinazowezekana bila kupunguza maana kuwa mshangao wa kawaida.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Aliwapelekea” ni cha asili zaidi kuliko “alituma ukombozi kwa,” na “aliamuru … lidumu” huhifadhi nguvu ya Kiebrania bila kuunda tungo ngumu isiyo ya kawaida.
