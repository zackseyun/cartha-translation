  text: טֶ֭רֶף נָתַ֣ן לִֽ/ירֵאָ֑י/ו יִזְכֹּ֖ר לְ/עוֹלָ֣ם בְּרִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/005.yaml
  text: He has given food to those who fear him[a]; he will remember his covenant forever.
translation:
  language: sw
  text: Amewapa chakula wale wanaomcha[a]; atalikumbuka agano lake milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mawindo”; neno la Kiebrania linaweza kumaanisha chakula kilichopatikana kama mawindo, lakini hapa yaelekea linamaanisha chakula kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶף
  choice: chakula
  rationale: Ingawa neno hili linaweza kumaanisha mawindo au chakula kilichopatikana kwa kuwinda, hapa muktadha wa wema wa Mungu kwa wanaomcha unaunga mkono maana ya jumla ya chakula. ‘Riziki’ ingeongeza wazo pana zaidi kuliko nomino halisi.
- source_word: נָתַן
  choice: amewapa
  rationale: Kauli timilifu ya Kiebrania inaonyesha tendo lililotimizwa; wakati timilifu wa Kiswahili unasomeka kwa kawaida na unaweza pia kudokeza utoaji wa Mungu uliothibitishwa. Kiambishi cha wingi ‘-wa-’ kinarejelea wale wanaomcha.
- source_word: לִירֵאָיו
  choice: wale wanaomcha
  rationale: Kirai hiki kinataja watu wenye sifa ya kumcha Mungu. ‘Wanaomcha’ ni Kiswahili cha kawaida na kinahifadhi uzito wa maana ya hofu yenye heshima bila kuipunguza kuwa heshima pekee.
- source_word: יִזְכֹּר
  choice: atalikumbuka
  rationale: Kauli isiyotimilika imefasiriwa kama wakati ujao, ikipatana na ‘milele.’ Kitenzi halisi ‘kukumbuka’ kimehifadhiwa badala ya kukifafanua kuwa kutunza au kuwa mwaminifu.
- source_word: לְעוֹלָם
  choice: milele
  rationale: ‘Milele’ ndiyo namna ya kawaida na yenye hadhi ya kuonyesha muda usio na mwisho katika muktadha huu wa agano.
- source_word: בְּרִיתוֹ
  choice: agano lake
  rationale: ‘Agano’ ni istilahi ya kawaida ya Kibiblia kwa ברית na inafaa kwa ahadi na uhusiano wa kudumu wa Mungu.
theological_decisions:
- issue: Maana ya Mungu ‘kukumbuka’ agano
  choice: ‘atalikumbuka agano lake,’ ikihifadhi nahau ya Kibiblia inayoweza kujumuisha kutenda kwa uaminifu kulingana na agano
  alternative: ‘analikumbuka agano lake’ kama kauli ya ukweli wa kudumu, au ‘atalishika agano lake’ kama ufafanuzi
  rationale: Kiebrania kinaweza kuelekeza wakati ujao, hasa pamoja na ‘milele.’ Tafsiri haibadili ‘kukumbuka’ kuwa ‘kushika,’ ili kutatua kimya kimya maana pana ya nahau ya agano.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kishairi; ‘wanaomcha’ huhifadhi lugha ya kawaida ya Kibiblia, na ‘atalikumbuka’ huhifadhi mvutano wa nahau ya agano.
