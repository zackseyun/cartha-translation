  yaml_path: translation/ot/psalms/066/005.yaml
  text: Come and see the works of God[a]; he is awesome in his deeds toward the children of man.
translation:
  language: sw
  text: Njooni myaone matendo ya Mungu; ni wa kuogofya katika matendo yake kwa wanadamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “wana wa mwanadamu”; yaani, wanadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ וּרְאוּ
  choice: Njooni mtazame
  rationale: Ingawa לְכוּ kimsingi inaweza kumaanisha ‘nendeni,’ katika mwaliko huu muungano wa vitenzi viwili unawasilishwa kwa Kiswahili cha kawaida kama ‘Njooni mtazame.’
- source_word: מִפְעֲלוֹת
  choice: matendo
  rationale: Neno hili linamaanisha mambo ambayo Mungu amefanya; ‘matendo’ ni la asili, lenye heshima, na linafaa katika muktadha huu.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Mrejelewa ni Mungu wa Israeli, hivyo umoja ‘Mungu’ unafaa.
- source_word: נוֹרָא
  choice: anatisha
  rationale: Neno la Kiebrania linaeleza hali ya kuamsha hofu na kicho. ‘Anatisha’ huhifadhi uzito huo kuliko tamko linalomaanisha kuvutia tu.
- source_word: עֲלִילָה
  choice: matendo yake
  rationale: Nomino hii ya umoja inaweza kueleza shughuli au mwenendo wa kutenda kwa jumla; wingi wa Kiswahili ni wa asili hapa, ingawa unarudia ‘matendo’ ya kishazi cha kwanza.
- source_word: עַל
  choice: kwa
  rationale: Kihusishi hiki kinaelekeza matendo ya Mungu kwa walengwa bila kuamua kimya kimya kama ni kwa faida yao au dhidi yao.
- source_word: בְּנֵי אָדָם
  choice: wanadamu
  rationale: Nahau hii, kihalisi ‘wana wa Adamu/mwanadamu,’ humaanisha jamii ya binadamu kwa ujumla. ‘Wanadamu’ ni sawa kimaana na ni ya kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya נוֹרָא kuhusu matendo ya Mungu
  choice: anatisha
  alternative: anastaajabisha
  rationale: ‘Anatisha’ huhifadhi mvutano wa hofu na kicho uliomo katika mzizi ירא, bila kuupunguza kuwa mshangao chanya pekee.
- issue: Nahau בְּנֵי אָדָם
  choice: wanadamu
  alternative: wana wa Adamu
  rationale: Nahau hiyo inawahusu binadamu wote. Tafsiri kuu inatoa maana yake ya kawaida, huku tanbihi ikihifadhi umbo halisi na uwezekano wa kusoma אָדָם kama Adamu au mwanadamu.
- issue: Nguvu ya kihusishi עַל
  choice: kwa
  alternative: juu ya / dhidi ya
  rationale: ‘Kwa’ haibainishi kupita kiasi kama matendo hayo ni ya neema au ya hukumu, hivyo inadumisha upana wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Njooni mtazame’ ni mwaliko wa kawaida; ‘anatisha’ limetumiwa kwa maana ya kuleta hofu na kicho, si matumizi mepesi ya mazungumzo.
