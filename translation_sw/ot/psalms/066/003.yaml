  text: אִמְר֣וּ לֵ֭/אלֹהִים מַה נּוֹרָ֣א מַעֲשֶׂ֑י/ךָ בְּ/רֹ֥ב עֻ֝זְּ/ךָ֗ יְֽכַחֲשׁ֖וּ לְ/ךָ֣ אֹיְבֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/003.yaml
  text: Say to God[a], “How awesome are your works! Because of the greatness of your strength, your enemies cringe before you.”
translation:
  language: sw
  text: Mwambieni Mungu, “Matendo yako ni ya kutisha jinsi gani! Kwa ukuu wa nguvu zako, adui zako wanajifanya kukunyenyekea[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “adui zako hujifanya kukutii,” “adui zako hulazimishwa kukunyenyekea,” au “adui zako hujisalimisha kwako bila hiari.” Kitenzi cha Kiebrania kinaweza kumaanisha kunyenyekea kwa kujifanya au kwa kulazimishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ לֵאלֹהִים
  choice: Mwambieni Mungu
  rationale: Amri ya wingi inauagiza umma unaoabudu kusema moja kwa moja na Mungu; ‘mwambieni’ ni Kiswahili cha sasa na cha kawaida.
- source_word: מַה נּוֹרָא
  choice: yanatisha jinsi gani
  rationale: Muundo huu ni mshangao, nao נוֹרָא hubeba wazo la kuogofya na kuamsha kicho. Kauli hii inadumisha uzito huo bila kutumia ‘ya ajabu,’ ambalo linaweza kupunguza upande wa hofu.
- source_word: מַעֲשֶׂיךָ
  choice: matendo yako
  rationale: מַעֲשֶׂה humaanisha tendo au kazi; ‘matendo’ ni ya asili katika sifa za kishairi na hueleweka kwa urahisi.
- source_word: בְּרֹב עֻזֶּךָ
  choice: Kwa sababu ya ukuu wa nguvu zako
  rationale: בְּ inaeleweka hapa kuwa ya sababu; רֹב ni ukuu au wingi, na עֹז ni nguvu au uweza.
- source_word: יְכַחֲשׁוּ לְךָ
  choice: wanajifanya kukunyenyekea
  rationale: Piel ya כחש pamoja na ל inaweza kuonyesha utiifu wa kujifanya au wa kulazimishwa. Tafsiri hii inadumisha wazi hali ya kutokuwa wanyofu badala ya kuifanya kuwa ibada ya dhati.
- source_word: אֹיְבֶיךָ
  choice: adui zako
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya nomino ya wingi yenye kiambishi cha nafsi ya pili umoja.
theological_decisions:
- issue: Hali ya kunyenyekea kwa maadui mbele za Mungu
  choice: Kunyenyekea kwa kujifanya, kunakosababishwa na nguvu kuu za Mungu
  alternative: Kunyenyekea kwa kulazimishwa au kusita, bila kutaja wazi udanganyifu
  rationale: כחש inaweza kudokeza uongo, kujifanya, au utiifu wa kulazimishwa. ‘Wanajifanya kukunyenyekea’ inahifadhi mvutano kwamba mwitikio wao si lazima uwe ibada ya moyo, huku tanbihi ikionyesha uwezekano wa msisitizo wa kulazimishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Yanatisha’ hapa lina maana ya kuogofya na kuamsha kicho, si ubaya wa kimaadili. Alama ya tanbihi imewekwa baada ya ‘Mungu’ ili kufuata mpangilio wa safu ya mashauriano, ingawa tanbihi inafafanua kitenzi cha mwisho.
