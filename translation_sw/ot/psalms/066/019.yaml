  text: Hakika Mungu amesikia; amesikiliza sauti ya sala yangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָכֵן
  choice: Hakika
  rationale: Huhifadhi msisitizo wa uthibitisho na uhakika kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: שָׁמַע
  choice: amenisikia
  rationale: Kauli timilifu ya Kiebrania inaonyesha tendo lililotimia; kiambishi cha mtendwa '-ni-' kinaeleza kwa njia ya asili kwamba Mungu amemsikia mwombaji.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la nomino ni la wingi, kitenzi chake ni cha umoja na hapa kinamtaja Mungu mmoja.
- source_word: הִקְשִׁיב
  choice: ameisikiliza
  rationale: Hiphil ya קשׁב humaanisha kusikiliza kwa makini; 'ameisikiliza' huhifadhi wazo la kuelekeza usikivu.
- source_word: בְּקוֹל
  choice: sauti ya
  rationale: קוֹל ni 'sauti' au 'neno linalosikika'; 'sauti ya sala yangu' ni ya karibu na muundo wa Kiebrania na inaeleweka kwa Kiswahili.
- source_word: תְּפִלָּתִי
  choice: sala yangu
  rationale: Ni nomino yenye kiambishi cha umilikaji cha nafsi ya kwanza, yaani sala ya mtunga zaburi.
