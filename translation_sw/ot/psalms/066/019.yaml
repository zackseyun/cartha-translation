  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Usambamba wa kishairi umehifadhiwa kwa 'amenisikia' na 'ameisikiliza sauti ya sala yangu' bila kuufanya mstari uwe wa kizamani.
