base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/012.yaml
  text: You made a man ride over our heads; we went through fire and through water, yet you brought us out into abundance.
translation:
  language: sw
  text: Ulimfanya mwanadamu apande juu ya vichwa vyetu; tulipita katika moto na katika maji, lakini ukatuleta mahali pa utele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִרְכַּבְתָּ
  choice: Ulimruhusu ... apite
  rationale: Kitenzi cha Kiebrania kwa msingi wake ni ‘ulimpandisha/ulimfanya aendeshe’; katika muktadha huu kinaonyesha Mungu alimfanya au alimruhusu mwanadamu awatawale kwa kupita juu yao. ‘Ulimruhusu ... apite’ ni Kiswahili cha kawaida kinachohifadhi uwakala wa Mungu bila kudokeza kwamba Mungu mwenyewe ndiye aliyepita.
- source_word: אֱנוֹשׁ
  choice: mwanadamu
  rationale: Nomino ya umoja humaanisha mwanadamu dhaifu au mtu wa kufa; umoja umehifadhiwa badala ya kuigeuza kuwa wingi.
- source_word: לְרֹאשֵׁנוּ
  choice: juu ya vichwa vyetu
  rationale: Tafsiri ya moja kwa moja inayohifadhi picha ya kunyenyekezwa na kutawaliwa.
- source_word: בָאנוּ בָאֵשׁ וּבַמַּיִם
  choice: tulipita katika moto na maji
  rationale: ‘Tulipita’ huwasilisha mwendo wa kuingia na kuvuka katika taabu; jozi ya moto na maji imehifadhiwa kama ilivyo.
- source_word: לָרְוָיָה
  choice: mpaka mahali pa utele
  rationale: Neno linaweza kuashiria hali au mahali penye utele, unafuu, au kuburudishwa. Usemi huu ni wa kawaida na unahifadhi taswira pana ya kufikishwa kwenye utele baada ya mateso.
theological_decisions:
- issue: Uwakala wa Mungu katika mateso
  choice: Ulimruhusu mwanadamu apite juu ya vichwa vyetu
  alternative: Ulimfanya mwanadamu apande juu ya vichwa vyetu
  rationale: Kiebrania kinamhusisha Mungu moja kwa moja na tukio, lakini Kiswahili cha neno kwa neno kingekuwa kigumu na kingeweza kupotosha picha. Chaguo hili haliondoi enzi ya Mungu, wala halidai kwamba yeye ndiye mtesaji wa moja kwa moja.
- issue: Maana ya mwisho ya לָרְוָיָה
  choice: mahali pa utele
  alternative: mahali pa kuburudishwa
  rationale: ‘Utele’ huhifadhi upana wa neno—ustawi, nafasi tele, na unafuu—bila kulifunga kwa tafsiri moja tu ya kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Picha za kishairi za ‘vichwa,’ ‘moto na maji,’ na ‘utele’ zimehifadhiwa.
