  text: אֵלָ֥י/ו פִּֽ/י קָרָ֑אתִי וְ֝/רוֹמַ֗ם תַּ֣חַת לְשׁוֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/017.yaml
  text: I cried out to him with my mouth[a], and praise was under my tongue.
translation:
  language: sw
  text: 'Nilimlilia kwa kinywa changu,

    na sifa[a] ilikuwa chini ya ulimi wangu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nami nilimtukuza kwa ulimi wangu.” Muundo wa neno la Kiebrania unaweza kueleweka kama “sifa” au kama kitendo cha kumtukuza.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלָיו
  choice: nilimlilia
  rationale: Kiambishi cha nafsi ya tatu ya kiume katika ‘kwake’ kinarejelea Mungu katika muktadha. Kiswahili cha sasa huunganisha maana hiyo katika kitenzi ‘nilimlilia’ bila kuingiza jina la Mungu lisilokuwapo katika mstari huu.
- source_word: פִּי
  choice: kwa kinywa changu
  rationale: Huhifadhi taswira halisi ya ‘kinywa changu’ na ni usemi unaoeleweka katika Kiswahili.
- source_word: קָרָאתִי
  choice: nilimlilia
  rationale: Katika muktadha wa sala, קרא humaanisha kuita au kulia kwa sauti kuelekea kwa Mungu. ‘Nilimlilia’ huonyesha ombi la dhati huku ikihifadhi yule anayeelekezewa kilio.
- source_word: וְרוֹמַם
  choice: na sifa
  rationale: Muundo huu unaweza kueleweka kama nomino yenye maana ya kuinua au kusifu. ‘Sifa’ ni ya kawaida na sahihi katika muktadha huu, huku tanbihi ikihifadhi uwezekano wa kuuelewa kama kitendo cha kumtukuza.
- source_word: תַּחַת
  choice: chini ya
  rationale: Hii ndiyo maana ya moja kwa moja ya kihusishi, na huhifadhi taswira ya kishairi ya Kiebrania badala ya kuifafanua kuwa sifa ilikuwa tayari kutamkwa.
- source_word: לְשׁוֹנִי
  choice: ulimi wangu
  rationale: Tafsiri halisi huhifadhi taswira ya kiungo cha mwili na sitiari ya usemi katika ushairi wa Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa mistari huhifadhi usambamba wa kishairi; ‘chini ya ulimi wangu’ imeachwa kuwa taswira yenye mvutano wa asili badala ya kufafanuliwa kimyakimya.
