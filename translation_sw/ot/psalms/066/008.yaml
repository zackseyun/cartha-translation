  text: Bless our God[a], O peoples[b], and make the sound of his praise heard.
translation:
  language: sw
  text: Enyi mataifa, mbarikini Mungu wetu, na ifanyeni sauti ya sifa yake isikike.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na ifanyeni sauti ya sifa kwake isikike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרְכוּ
  choice: mbarikini
  rationale: Kauli ya amri ya wingi kutoka ברך. ‘Mbarikini’ inadumisha maana ya moja kwa moja na nahau ya kibiblia ya kumbariki Mungu, bila kuifupisha kuwa ‘msifuni.’
- source_word: עַמִּים
  choice: Enyi mataifa
  rationale: Nomino ya wingi inatumika kama mwito kwa makundi mengi ya watu. ‘Mataifa’ ni Kiswahili cha kawaida na cha kueleweka kwa mwito huu wa kimataifa.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Kiambishi cha nafsi ya kwanza wingi kinamaanisha moja kwa moja ‘wetu,’ kikidumisha mtazamo wa jumuiya ya mtunga zaburi.
- source_word: וְהַשְׁמִיעוּ
  choice: na kuifanya ... isikike
  rationale: Hifili ya שמע ni amri yenye maana ya kusababisha kitu kisikike. Muundo huu unahifadhi nguvu ya usababishaji kwa Kiswahili cha asili.
- source_word: קוֹל
  choice: sauti
  rationale: קוֹל inaweza kumaanisha ‘sauti’ au ‘mlio’; hapa ‘sauti’ inafaa kwa usemi unaosikika wa sifa.
- source_word: תְּהִלָּתוֹ
  choice: sifa yake
  rationale: Nomino yenye kiambishi cha nafsi ya tatu umoja wa kiume inatafsiriwa moja kwa moja ‘sifa yake,’ huku uwezekano wa kueleweka kuwa sifa inayoelekezwa kwake ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Uhusiano wa kiambishi katika תְּהִלָּתוֹ
  choice: sifa yake
  alternative: sifa kwake
  rationale: ‘Sifa yake’ inahifadhi kwa karibu uhusiano wa kiambishi cha Kiebrania bila kuamua kimafundisho ikiwa ni sifa inayomhusu au inayoelekezwa kwake. Maana nyingine imetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mwito ‘Enyi mataifa’ umewekwa mwanzoni ili anayeamriwa ajulikane wazi; muundo wa usababishaji umehifadhiwa.
