  text: Sing the glory of his name[a]; make his praise glorious.
translation:
  language: sw
  text: Imbeni utukufu wa jina lake; fanyeni sifa yake iwe ya utukufu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Fanyeni utukufu wa sifa yake.” Kiebrania hutumia nomino “utukufu” katika msemo ambao unaweza kutafsiriwa kwa kufuata maneno yake kwa karibu zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Imbeni
  rationale: Ni amri ya wingi kutoka זמר, inayowaita watu watoe sifa kwa kuimba. “Imbeni” ni ya kawaida, wazi, na inafaa kwa lugha ya kishairi.
- source_word: כְבוֹד שְׁמוֹ
  choice: utukufu wa jina lake
  rationale: Muundo huu wa kumilikisha umehifadhiwa moja kwa moja ili kusisitiza utukufu unaolihusu jina lake, badala ya kuugeuza kuwa kivumishi tu, “jina lake tukufu.”
- source_word: שִׂימוּ
  choice: ifanyeni ... kuwa
  rationale: Kitenzi שׂים kimsingi humaanisha “weka,” lakini katika muundo huu “ifanyeni ... kuwa” huwasilisha agizo hilo kwa Kiswahili cha kawaida bila kulazimisha maana ya dhehebu fulani.
- source_word: כָבוֹד
  choice: ya utukufu
  rationale: Ingawa neno la Kiebrania ni nomino “utukufu,” Kiswahili cha kawaida huhitaji kirai cha kikamilisho baada ya “ifanyeni ... kuwa.” Hivyo maana ya nomino imehifadhiwa katika kirai “ya utukufu.”
- source_word: תְּהִלָּתוֹ
  choice: sifa yake
  rationale: Nomino hii ina maana ya “sifa” na kiambishi chake kinarejelea nafsi ya tatu umoja wa kiume. “Sifa yake” hudumisha uwezekano wa kumaanisha sifa anayopewa au sifa inayomhusu.
