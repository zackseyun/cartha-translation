lexical_decisions:
- source_word: אָבוֹא
  choice: Nitakuja
  rationale: Kitenzi בוא katika Qal, nafsi ya kwanza umoja, kinaeleza tendo linalokusudiwa au la wakati ujao. “Nitakuja” ndilo maana yake ya kawaida; “nitaingia” pia linawezekana kwa kuzingatia mahali panapofikiwa.
- source_word: בֵיתְךָ
  choice: nyumbani mwako
  rationale: Kiebrania kinasema kihalisi “nyumba yako.” Muundo “nyumbani mwako” ni wa kawaida katika Kiswahili kwa kueleza kwenda au kuja ndani ya nyumba, huku ukihifadhi taswira ya asili badala ya kuitafsiri moja kwa moja kuwa hekalu.
- source_word: בְעוֹלוֹת
  choice: nikiwa na sadaka za kuteketezwa
  rationale: עוֹלָה ni neno la kawaida la sadaka inayoteketezwa. Kiambishi ב hapa kinaonyesha kuandamana; “nikiwa na” ni Kiswahili cha kawaida kinachoonyesha kwamba mwabudu anakuja akileta sadaka hizo.
- source_word: אֲשַׁלֵּם
  choice: nitatimiza
  rationale: Katika Piel, שלם likitumiwa pamoja na nadhiri humaanisha kulipa au kutimiza wajibu wa nadhiri. “Nitatimiza” linaeleza maana hiyo wazi bila kutoa hisia ya shughuli ya kibiashara.
- source_word: לְךָ
  choice: kwako
  rationale: Kiambishi ל kinaonyesha anayeelekezewa utimizaji wa nadhiri. “Kwako” ni usemi wa kawaida wa Kiswahili katika muktadha huu.
- source_word: נְדָרָי
  choice: nadhiri zangu
  rationale: Ni nomino ya wingi yenye kiambishi cha nafsi ya kwanza umoja, kwa hiyo maana yake ya moja kwa moja ni “nadhiri zangu.”
theological_decisions:
- issue: Iwapo “nyumba yako” itafsiriwe katika matini kuu kama neno maalumu linalomaanisha hekalu au patakatifu
  choice: Kuhifadhi “nyumbani mwako” katika matini kuu
  alternative: hekaluni mwako; katika patakatifu pako
  rationale: Kiebrania kinasema “nyumba yako” na hakilazimishi maana hiyo ifinywe kuwa “hekalu” katika matini kuu. Kutaja sadaka za kuteketezwa kunaonyesha muktadha wa ibada, huku tanbihi ikifafanua uwezekano wa kurejelea patakatifu pa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. Muundo “nyumbani mwako” ni wa kawaida na unahifadhi taswira ya Kiebrania; “nikiwa na” huwasilisha uhusiano wa kuandamana kwa njia ya asili katika Kiswahili.
