lexical_decisions:
- source_word: הָפַךְ
  choice: aliigeuza
  rationale: Kitenzi hiki humaanisha kugeuza au kubadili. ‘Aliigeuza’ kinadumisha picha halisi ya Mungu kubadili hali ya bahari.
- source_word: יָם
  choice: bahari
  rationale: Hili ndilo neno la kawaida la Kiswahili, bila kutaja Bahari ya Shamu moja kwa moja wakati Kiebrania kinasema tu ‘bahari.’
- source_word: לְיַבָּשָׁה
  choice: kuwa nchi kavu
  rationale: Neno linamaanisha nchi au ardhi kavu; usemi huu ni wa asili katika Kiswahili na unalingana na kiambishi cha mwelekeo au matokeo.
- source_word: בַּנָּהָר
  choice: mto
  rationale: Ingawa kihusishi kinaweza kuwa ‘katika/kwenye,’ pamoja na kitenzi cha kuvuka Kiswahili cha kawaida husema ‘walivuka mto.’
- source_word: יַעַבְרוּ
  choice: walivuka
  rationale: Kitenzi humaanisha kupita au kuvuka. Muktadha wa mto hufanya ‘walivuka’ kuwa wazi na wa kawaida.
- source_word: בְרָגֶל
  choice: kwa miguu
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba walipita bila chombo cha majini.
- source_word: שָׁם
  choice: huko
  rationale: ‘Huko’ huhifadhi rejeo la mahali au tukio bila kulifafanua kupita kiasi.
- source_word: נִשְׂמְחָה
  choice: tulifurahi
  rationale: Umbo la Kiebrania linaweza kueleweka kama taarifa ya furaha ya jumuiya katika tukio lililopita, ingawa pia linaweza kuwa himizo; uwezekano huo umeonyeshwa katika tanbihi.
- source_word: בּוֹ
  choice: katika yeye
  rationale: Kiwakilishi ni cha kiume umoja na katika muktadha kinaelekea kumrejelea Mungu. ‘Katika yeye’ huhifadhi kwa ukaribu usemi wa Kiebrania na maana ya furaha inayomlenga Mungu.
theological_decisions:
- issue: Dokezo la matukio ya kihistoria na utambulisho wa jumuiya
  choice: Mstari unakumbuka matendo ya Mungu baharini na mtoni, huku waabudu wakijitambulisha na waliokombolewa kwa kusema ‘tulifurahi.’
  alternative: 'Kauli ya mwisho inaweza kueleweka kama himizo: ‘huko na tufurahi katika yeye.’'
  rationale: Muktadha unasimulia matendo makuu ya Mungu na kuongoza jumuiya katika sifa. Tafsiri ya wakati uliopita inadumisha mshikamano wa waabudu na matendo hayo bila kuficha uwezekano wa himizo.
- issue: Rejeo la kiwakilishi בּוֹ
  choice: 'Kiwakilishi kinamrejelea Mungu: ‘katika yeye.’'
  alternative: Kisarufi kinaweza kuhusishwa kwa mbali na mahali au tukio, lakini hilo halina uwezekano mkubwa kimuktadha.
  rationale: Muktadha wa sifa na kiwakilishi cha kiume umoja vinaunga mkono rejeo la Mungu, huku tanbihi ikiepuka kudai zaidi ya ushahidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo sambamba wa vifungu vitatu umehifadhiwa. ‘Katika yeye’ ni rasmi kidogo, lakini huhifadhi usemi wa kiteolojia wa chanzo bila kuufanya kuwa wa dhehebu fulani.
