  yaml_path: translation/ot/psalms/066/006.yaml
  text: He turned the sea into dry land[a]; they passed through the river on foot[b]; there we rejoiced in him.
translation:
  language: sw
  text: Aliigeuza bahari kuwa nchi kavu; walivuka mto kwa miguu[b]; huko tulimfurahia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huko na tumfurahie.” Umbo la Kiebrania linaweza kueleweka kama himizo badala ya taarifa kuhusu wakati uliopita.
    reason: alternative_reading
  - marker: b
