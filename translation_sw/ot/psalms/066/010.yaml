lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Hutambulisha sababu ya sifa katika muktadha; ‘Kwa maana’ linaonyesha kwa kawaida uhusiano huo wa ufafanuzi.
- source_word: בְחַנְתָּנוּ
  choice: umetujaribu
  rationale: Kitenzi בחן humaanisha kuchunguza au kupima ili kuthibitisha ubora au uhalisi; ‘umetujaribu’ ni wazi na linaendana na mfano wa kusafisha fedha.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Ni mwito wa moja kwa moja kwa Mungu; ‘Ee Mungu’ huhifadhi hali ya mwito katika lugha ya kishairi yenye hadhi.
- source_word: צְרַפְתָּנוּ
  choice: umetutakasa
  rationale: צרף hueleza kusafisha metali kwa moto ili kuondoa uchafu; ‘umetutakasa’ huhifadhi wazo la kuondoa uchafu, huku taswira ya kimetali ikiwekwa wazi na nusu ya pili ya mstari.
- source_word: כִּצְרָף
  choice: kama ... inavyosafishwa
  rationale: Kiambishi כְּ kinaonyesha ulinganisho, na umbo la kitenzi linaeleza tendo la kawaida la usafishaji; muundo huu ni wa asili katika Kiswahili.
- source_word: כָּסֶף
  choice: fedha
  rationale: Ni metali ya thamani inayotajwa moja kwa moja katika mfano wa usafishaji.
