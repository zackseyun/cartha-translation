base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/004.yaml
  text: All the earth will bow down to you and sing praise to you[a]; they will sing praise to your name[b]. Selah
translation:
  language: sw
  text: Dunia nzima itakusujudia[a] na kukuimbia sifa; itaimba sifa kwa jina lako. Sela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “itakuabudu.” Kitenzi cha Kiebrania kinaweza kumaanisha kuinama au kujilaza chini kama tendo la ibada.
    reason: lexical_alternative
  - marker: b
    text: “Sela” huenda ni alama ya kimuziki au ya kiliturujia; maana yake kamili haijulikani kwa hakika.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל הָאָרֶץ
  choice: Dunia nzima
  rationale: Huwasilisha maana pana ya dunia yote kwa Kiswahili cha kawaida; hapa muktadha ni wa ulimwengu mzima, si nchi fulani tu.
- source_word: יִשְׁתַּחֲווּ
  choice: itakusujudia
  rationale: Kitenzi hiki huhusu kuinama au kujilaza chini mbele ya mtu, hasa kama tendo la ibada. “Kusujudia” huhifadhi picha ya tendo la mwili pamoja na maana yake ya kumwabudu Mungu.
- source_word: לְךָ
  choice: -ku- / lako
  rationale: Viambishi hivi vinaelekeza tendo kwa anayesemeshwa na vinaendana kwa kawaida na vitenzi na nomino za Kiswahili.
- source_word: וִיזַמְּרוּ / יְזַמְּרוּ
  choice: kukuimbia sifa / kuliimbia ... sifa
  rationale: זמר katika muktadha huu ni kuimba kwa kusifu. Kurudia wazo la kuimba sifa kunahifadhi urudiaji wa kishairi wa Kiebrania.
- source_word: שִׁמְךָ
  choice: jina lako
  rationale: Tafsiri ya moja kwa moja huhifadhi usemi muhimu wa kibiblia kuhusu jina la Mungu bila kuubadili kuwa “sifa zako” au “umaarufu wako.”
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya istilahi hii haijulikani kwa hakika; kuihifadhi kwa unukuzi huepuka tafsiri ya kubahatisha.
theological_decisions:
- issue: Ikiwa יִשְׁתַּחֲווּ itafsiriwe kwa neno la jumla la ibada au kwa tendo la kuinama chini
  choice: itakusujudia
  alternative: itakuabudu
  rationale: “Itakusujudia” huhifadhi tendo halisi la mwili lililo katika kitenzi cha Kiebrania huku maana ya ibada ikiendelea kuwa wazi katika muktadha, badala ya kuifanya kuwa dhana ya jumla tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Umoja wa kisarufi katika “dunia nzima itakusujudia” ni wa kawaida katika Kiswahili na huwasilisha jumla ya wakazi wa dunia bila kubadili taswira ya chanzo.
