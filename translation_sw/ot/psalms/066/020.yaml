base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/020.yaml
  text: Blessed be God[b][a], who has not turned away my prayer or his steadfast love from me.
translation:
  language: sw
  text: Ahimidiwe Mungu[b], ambaye hakukataa sala yangu wala kuniondolea upendo wake mwaminifu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upendo wake wa kudumu,” “uaminifu wake wa agano,” au “fadhili zake.” Neno la Kiebrania חֶסֶד linajumuisha wazo la upendo wenye ushikamanifu na uaminifu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “ambaye hakuondoa sala yangu na upendo wake kutoka kwangu.” Tafsiri katika matini imetumia maneno ya kawaida ya Kiswahili ili ukanushi uhusu kwa uwazi sala na upendo wa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Ahimidiwe
  rationale: Kitenzi hiki cha sifa kinatumika hapa kama tamko la kumtukuza Mungu. “Ahimidiwe” ni Kiswahili cha kawaida, cha heshima, na chenye nguvu ya kidoksolojia.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Nomino hii inamtaja Mungu moja kwa moja katika sifa.
- source_word: אֲשֶׁר
  choice: ambaye
  rationale: Inaingiza kishazi rejeshi kinachoeleza jambo ambalo Mungu hakufanya.
- source_word: לֹא הֵסִיר
  choice: hakukataa … wala kuniondolea
  rationale: 'Kiebrania kinatumia kitenzi kimoja chenye maana ya kuondoa au kugeuza kando kwa “sala yangu” na “upendo wake.” Kiswahili cha asili kinahitaji vitenzi vinavyolingana na kila kirai: Mungu hakukataa sala, wala hakumwondolea mwombaji upendo wake.'
- source_word: תְּפִלָּתִי
  choice: sala yangu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya ombi linaloelekezwa kwa Mungu.
- source_word: וְחַסְדּוֹ
  choice: wala … upendo wake mwaminifu
  rationale: Baada ya ukanushi, וְ imetolewa kwa “wala.” חֶסֶד huunganisha upendo, uaminifu, na ushikamanifu wa kudumu; “upendo mwaminifu” huhifadhi vipengele hivyo bila kuufanya kuwa hisia tu.
- source_word: מֵאִתִּי
  choice: kuniondolea
  rationale: Kiambishi “-ni-” pamoja na “-ondolea” kinaonyesha kwa njia ya asili ya Kiswahili kuwa upendo huo haukuondolewa kutoka kwa msemaji.
theological_decisions:
- issue: Maana ya חֶסֶד
  choice: upendo wake mwaminifu
  alternative: fadhili zake; rehema zake; upendo wake wa agano
  rationale: “Upendo mwaminifu” huhifadhi kwa pamoja wema wa Mungu na uaminifu wake wa kudumu. “Rehema” inaweza kuipunguza maana iwe huruma tu, na “upendo wa agano” huweka wazi wazo la agano kuliko neno lenyewe linavyolazimisha katika mstari huu.
- issue: Uhusiano wa ukanushi na viambajengo viwili
  choice: hakukataa sala yangu wala kuniondolea upendo wake
  alternative: hakuondoa sala yangu na upendo wake kutoka kwangu
  rationale: Kiebrania kina kitenzi kimoja kinachotawala “sala yangu” na “upendo wake.” Tafsiri imehifadhi ukanushi unaohusu vyote kwa “wala,” huku ikitumia miundo ya asili ya Kiswahili bila kubadili dai la kitheolojia kwamba Mungu aliipokea sala na hakuondoa upendo wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kishairi unaofaa Zaburi. “Ahimidiwe” ni tamko la kawaida la sifa; “hakukataa … wala kuniondolea” ni la asili kwa msomaji wa sasa huku tanbihi ikihifadhi muundo halisi wa Kiebrania.
