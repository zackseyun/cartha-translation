lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza wa waimbaji
  rationale: Neno hili katika vichwa vya zaburi humwelekea mtu anayeongoza uimbaji au muziki; tafsiri hii ni ya kawaida na inayoeleweka, huku tanbihi ikihifadhi uwezekano wa ‘mwongoza muziki.’
- source_word: שִׁיר מִזְמוֹר
  choice: Wimbo, zaburi
  rationale: Yamehifadhiwa majina yote mawili ya aina ya utungo na mpangilio wake bila kuyaunganisha kana kwamba ni neno moja.
- source_word: הָרִיעוּ
  choice: Mpigieni ... kelele za shangwe
  rationale: Kitenzi kinaashiria kupaza sauti au kelele za shangwe; Kiswahili hiki kinaonyesha nguvu na hali ya furaha ya mwito huo.
- source_word: כָּל־הָאָרֶץ
  choice: enyi dunia yote
  rationale: Neno ‘dunia’ linaweza kumaanisha nchi au dunia; katika mwito huu wa jumla, ‘dunia yote’ linafikisha upeo wa kauli, na ‘enyi’ linaonyesha kwamba ndiyo inayosemeshwa.
theological_decisions:
- issue: Iwapo כָּל־הָאָרֶץ inamaanisha dunia kama uumbaji au watu wote duniani
  choice: enyi dunia yote
  alternative: nchi yote / watu wote wa dunia
  rationale: Tafsiri ya moja kwa moja inadumisha upana na taswira ya kishairi ya Kiebrania bila kuamua kimyakimya kwamba wanaoitwa ni watu pekee.
