  text: לַ֭/מְנַצֵּחַ שִׁ֣יר מִזְמ֑וֹר הָרִ֥יעוּ לֵ֝/אלֹהִים כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/001.yaml
  text: For the choir director[a]. A song, a psalm. Shout to God[b], all the earth.
translation:
  language: sw
  text: Kwa mwongoza muziki[a]. Wimbo, zaburi. Mshangilieni Mungu[b], enyi dunia yote!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa kiongozi wa waimbaji.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Mpigieni Mungu kelele za shangwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza muziki
  rationale: Neno hili la kichwa cha zaburi humtaja anayesimamia uimbaji au utendaji wa muziki. ‘Mwongoza muziki’ ni Kiswahili cha sasa na halifungi jukumu hilo kwa kwaya pekee.
- source_word: שִׁיר
  choice: Wimbo
  rationale: Ni tafsiri ya moja kwa moja ya aina hii ya utungo.
- source_word: מִזְמוֹר
  choice: zaburi
  rationale: Ni istilahi ya kawaida ya Kiswahili kwa mizmor; imehifadhiwa pamoja na ‘wimbo’ kwa sababu Kiebrania kina majina yote mawili.
- source_word: הָרִיעוּ
  choice: Mshangilieni
  rationale: Kitenzi kinaagiza sauti kubwa ya shangwe au ushindi. ‘Mshangilieni’ huwasilisha kwa ufupi mwito wa kumtolea Mungu shangwe kwa sauti.
- source_word: לֵאלֹהִים
  choice: Mungu
  rationale: Katika ‘Mshangilieni Mungu,’ Mungu ndiye anayeelekezewa shangwe; kiambishi cha Kiswahili na mpangilio wa sentensi huwasilisha kazi ya kihusishi cha Kiebrania kwa kawaida.
- source_word: כָּל הָאָרֶץ
  choice: enyi dunia yote
  rationale: Katika muktadha huu wa sifa, ‘dunia’ huhifadhi wigo wa ulimwengu mzima. ‘Enyi’ huonyesha wazi kwamba dunia yote ndiyo inayoitwa kuitikia.
theological_decisions:
- issue: Wigo wa mwito katika כָּל הָאָרֶץ
  choice: mwito kwa dunia yote
  alternative: mwito kwa nchi yote au eneo lote
  rationale: Muktadha wa sifa za zaburi unaunga mkono mwito wa ulimwengu mzima, huku tafsiri hiyo isiongeze zaidi ya maana pana inayowezekana ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Alama ya mshangao inafaa kwa amri ya shangwe. Majina mawili ya utungo, ‘wimbo’ na ‘zaburi,’ yamehifadhiwa bila kuyaunganisha.
