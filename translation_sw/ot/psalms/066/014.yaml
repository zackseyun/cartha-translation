  text: 'ambazo midomo yangu ilizinena,

    na kinywa changu kikazitamka nilipokuwa katika taabu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “ambazo midomo yangu ilifunguka.” Nahau ya Kiebrania inamaanisha kusema au kutamka maneno.
