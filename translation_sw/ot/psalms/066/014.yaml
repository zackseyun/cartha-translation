lexical_decisions:
- source_word: אֲשֶׁר
  choice: ambazo
  rationale: Kiwakilishi hiki kinaunganisha kishazi na nadhiri zilizotajwa katika mstari uliotangulia.
- source_word: פָּצוּ
  choice: ilizinena
  rationale: Kitenzi hiki humaanisha kihalisi ‘kufungua’ midomo, lakini hapa ni nahau ya kusema; ‘ilizinena’ ni ya kishairi na inaeleweka kwa urahisi.
- source_word: שְׂפָתַי
  choice: midomo yangu
  rationale: Taswira halisi ya kiungo cha mwili imehifadhiwa ili kudumisha usambamba wa kishairi.
- source_word: וְדִבֶּר
  choice: na ... kikazitamka
  rationale: ‘Kikazitamka’ huonyesha tendo la kusema na kudumisha usambamba na ‘ilizinena’ bila kufanya Kiswahili kuwa kizito.
- source_word: פִּי
  choice: kinywa changu
  rationale: Tafsiri ya moja kwa moja imehifadhiwa katika usambamba wa ‘midomo yangu / kinywa changu.’
- source_word: בַּצַּר לִי
  choice: nilipokuwa katika taabu
  rationale: Kifungu hiki kinaonyesha wakati na hali ambayo msemaji alikumbwa na dhiki; ‘taabu’ ni neno la kawaida na lenye hadhi.
