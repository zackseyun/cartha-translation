  text: לְכֽוּ שִׁמְע֣וּ וַ֭/אֲסַפְּרָה כָּל יִרְאֵ֣י אֱלֹהִ֑ים אֲשֶׁ֖ר עָשָׂ֣ה לְ/נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/016.yaml
  text: Come and hear[a], all you who fear God, and I will tell what he has done for my soul.
translation:
  language: sw
  text: Njooni msikie, ninyi nyote mnaomcha Mungu, nami nitasimulia mambo aliyofanya kwa ajili ya nafsi yangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uhai wangu.” Neno la Kiebrania נֶפֶשׁ (nefesh) linaweza kumaanisha “nafsi,” “uhai,” au “mtu mwenyewe,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Njooni
  rationale: Ingawa kitenzi hiki kimsingi kina maana ya kwenda au kutembea, hapa kinatumika kama mwaliko wa kuwasogeleza wasikilizaji; “Njooni” ni Kiswahili cha kawaida na cha asili katika muktadha huu.
- source_word: שִׁמְעוּ
  choice: msikie
  rationale: Huhifadhi amri ya kusikia kwa makini na inaungana kwa kawaida na mwaliko “Njooni.”
- source_word: וַאֲסַפְּרָה
  choice: nami nitasimulia
  rationale: Mzizi ספר hapa una maana ya kusimulia au kueleza kwa mpangilio. Umbo la Kiebrania linaonyesha kusudi la msemaji, ambalo “nitasimulia” hulitoa kwa uwazi.
- source_word: כָּל יִרְאֵי אֱלֹהִים
  choice: ninyi nyote mnaomcha Mungu
  rationale: Hutoa wito wa moja kwa moja kwa wote wenye hofu ya kumstahi Mungu, bila kuipunguza “kumcha” kuwa heshima ya kawaida tu wala kuifanya kuwa hofu tupu.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hili ni jina la jumla la Mungu, אֱלֹהִים, si jina la agano YHWH.
- source_word: אֲשֶׁר עָשָׂה
  choice: yale aliyoyatendea
  rationale: Kifungu husimulia mambo ambayo Mungu amefanya; “yale aliyoyatendea” ni cha asili katika Kiswahili na huunganika moja kwa moja na “nafsi yangu.”
- source_word: לְנַפְשִׁי
  choice: nafsi yangu
  rationale: נֶפֶשׁ inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. “Nafsi yangu” huhifadhi uzito wa kibinafsi wa ushuhuda na pia uwazi wa maana ya asili, huku maana mbadala ikiwekwa katika tanbihi.
theological_decisions:
- issue: Maana ya ‘kumcha Mungu’
  choice: hofu yenye staha na unyenyekevu mbele za Mungu
  alternative: kuogopa kwa hofu kuu; kumheshimu Mungu kwa maana ya jumla
  rationale: Tafsiri inadumisha mvutano wa kibiblia wa kumcha Mungu, unaohusisha kicho, ibada, na utiifu, bila kuufanya kuwa heshima hafifu au woga mtupu.
- issue: Maana ya נֶפֶשׁ
  choice: nafsi yangu
  alternative: uhai wangu; mimi mwenyewe
  rationale: Neno la Kiebrania lina maana pana. “Nafsi yangu” huhifadhi lugha ya maandishi na uzito wake wa kibinafsi, huku uwezekano wa “uhai wangu” ukibainishwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Njooni msikie” ni mwaliko wa moja kwa moja; “kumcha Mungu” na “nafsi yangu” zimehifadhiwa ili kutopunguza mvutano wa kiteolojia na upana wa maana ya Kiebrania.
