id: PSA.66.15
reference: Psalms 66:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: עֹ֘ל֤וֹת מֵחִ֣ים אַעֲלֶה לָּ֭/ךְ עִם קְטֹ֣רֶת אֵילִ֑ים אֶ֥עֱשֶֽׂה בָקָ֖ר עִם עַתּוּדִ֣ים סֶֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/015.yaml
  text: I will offer to you burnt offerings of fattened animals[a], with the smoke of rams; I will prepare cattle and goats[d][c][b]. Selah
translation:
  language: sw
  text: 'Nitakutolea sadaka za kuteketezwa za wanyama walionona,

    pamoja na moshi wa kondoo dume[a];

    nitatoa ng’ombe pamoja na mbuzi dume.

    Sela.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja na harufu ya kondoo dume.” Neno la Kiebrania linaweza kutaja moshi au harufu inayotokana na kuteketezwa kwa dhabihu.
    reason: lexical_alternative
  - marker: b
    text: Maana kamili ya “Sela” haijulikani. Huenda ilikuwa alama ya muziki au ibada.
    reason: cultural_note
lexical_decisions:
- source_word: עֹלוֹת
  choice: sadaka za kuteketezwa
  rationale: Ni istilahi ya kawaida ya dhabihu zilizoteketezwa kabisa madhabahuni, na inaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: מֵחִים
  choice: wanyama walionona
  rationale: Neno hili linaonyesha wanyama walionenepeshwa au wenye unono, waliofaa kuwa dhabihu ya thamani.
- source_word: אַעֲלֶה לָךְ
  choice: nitakutolea
  rationale: Katika muktadha wa dhabihu, kitenzi hiki humaanisha kutoa sadaka; umbo hili pia linahifadhi kwamba sadaka inaelekezwa kwa Mungu.
- source_word: עִם קְטֹרֶת אֵילִים
  choice: pamoja na moshi wa kondoo dume
  rationale: קְטֹרֶת hapa inaweza kutaja moshi au harufu inayopanda wakati dhabihu inateketezwa. ‘Moshi’ huepuka kuwafanya wasomaji wafikiri kuwa kondoo dume ni uvumba.
- source_word: אֶעֱשֶׂה
  choice: nitatoa
  rationale: Ingawa maana yake ya msingi ni ‘nitafanya,’ hapa linatumika kwa tendo la kutoa dhabihu; ‘nitatoa’ ni Kiswahili cha kawaida katika muktadha huu.
- source_word: בָקָר
  choice: ng’ombe
  rationale: Ni nomino ya jumla inayotaja mifugo ya jamii ya ng’ombe; tafsiri hii haiongezi jinsia ambayo haijawekwa wazi na neno lenyewe.
- source_word: עַתּוּדִים
  choice: mbuzi dume
  rationale: Neno hili hutaja hasa mbuzi wa kiume, hivyo umahususi wake umewekwa wazi katika matini.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya istilahi hii haijulikani; kwa hiyo imeandikwa kwa kunukuu sauti badala ya kutafsiriwa kwa kubahatisha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wa heshima, na unaoeleweka. Mistari imepangwa kufuata vipashio vya shairi la Kiebrania; istilahi za dhabihu zimewekwa wazi bila kuongeza umahususi usiothibitishwa.
