  variant: Standard East African Swahili
source:
  edition: WLC
  text: הֲבֵאתָ֥/נוּ בַ/מְּצוּדָ֑ה שַׂ֖מְתָּ מוּעָקָ֣ה בְ/מָתְנֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/011.yaml
  text: You brought us into the net[b][a]; you laid affliction on our loins.
translation:
  language: sw
  text: Ulituingiza mtegoni[a]; ukaweka dhiki viunoni mwetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ngomeni” au “mahali pa kunasia”; neno la Kiebrania linaweza kumaanisha mahali au kifaa cha kukamata na kufungia.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵאתָנוּ
  choice: Ulituingiza
  rationale: Hifili ya בוא pamoja na kiambishi cha nafsi ya kwanza wingi humaanisha ‘ulisababisha tuingie/ulituingiza.’ Chaguo hili ni la kawaida katika Kiswahili na linahifadhi wazi utendaji wa Mungu.
- source_word: בַמְּצוּדָה
  choice: mtegoni
  rationale: מְצוּדָה inaweza kumaanisha kifaa au mahali pa kunasia, na pia ngome. Katika muktadha wa kukamatwa na kubanwa, ‘mtego’ linafaa, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: שַׂמְתָּ
  choice: ukaweka
  rationale: שׂים humaanisha ‘kuweka/kutia.’ ‘Ukaweka’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: מוּעָקָה
  choice: dhiki
  rationale: Neno hili huonyesha shinikizo, kubanwa, taabu au mzigo unaotesa. ‘Dhiki’ linaeleza mateso yaliyowekwa juu yao bila kulazimisha picha ya kitu halisi ambacho hakitajwi wazi.
- source_word: בְמָתְנֵינוּ
  choice: viunoni mwetu
  rationale: מָתְנַיִם hurejelea viuno au sehemu ya kati ya mwili. ‘Viunoni mwetu’ ni sahihi, ya asili katika Kiswahili cha sasa, na inadumisha taswira ya mwili.
theological_decisions:
- issue: Utendaji wa Mungu katika mateso
  choice: Mungu anatajwa moja kwa moja kuwa ndiye aliyewaingiza mtegoni na kuweka dhiki viunoni mwao.
  alternative: Kulainisha kauli kwa kusema waliingia mtegoni au dhiki iliwapata bila kumtaja Mungu kama mtendaji.
  rationale: Vitenzi vya Kiebrania viko katika nafsi ya pili umoja na vinamwelekea Mungu moja kwa moja. Tafsiri inadumisha mvutano huu wa kitheolojia badala ya kuupunguza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa mistari miwili na taswira ya viuno vimedumishwa; utata wa מְצוּדָה umeonyeshwa katika tanbihi.
