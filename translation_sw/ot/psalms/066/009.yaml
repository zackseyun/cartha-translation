  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayetuweka miongoni mwa walio hai.” Kitenzi cha Kiebrania kinaweza kumaanisha “kuweka,” ingawa hapa kina maana ya kuhifadhi uhai.
    reason: lexical_alternative
  - marker: b
