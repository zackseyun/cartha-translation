lexical_decisions:
- source_word: הַשָּׂם
  choice: ambaye ametuweka
  rationale: Kitenzi שׂוּם kimsingi humaanisha ‘kuweka,’ na hapa umbo la kitenzi linaonyesha Mungu kuwa ndiye atendaye. Katika kirai hiki maana yake ya kimuktadha ni kutunza au kudumisha uhai; ‘ametuweka hai’ ni Kiswahili cha kawaida kinachohifadhi pia wazo la ‘kuweka.’
- source_word: נַפְשֵׁנוּ
  choice: -tu- (sisi) katika ‘ametuweka hai’
  rationale: נֶפֶשׁ hapa inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. Kiswahili cha kawaida husema ‘ametuweka hai’ badala ya ‘ameiweka nafsi yetu katika uhai’; maana pana ya neno la Kiebrania imebainishwa katika tanbihi.
- source_word: בַּחַיִּים
  choice: hai
  rationale: Kirai hiki kwa maana ya kimuktadha huonyesha kuwako katika hali au ulimwengu wa walio hai. ‘Hai’ kinaeleza nahau hiyo kwa Kiswahili cha asili bila kupoteza wazo la kuhifadhi uhai.
- source_word: וְלֹא נָתַן
  choice: wala hakuruhusu
  rationale: נָתַן ikifuatiwa na לַמּוֹט ina maana ya kuruhusu jambo litokee. ‘Hakuruhusu’ huwasilisha nahau hiyo wazi.
- source_word: לַמּוֹט
  choice: iteleze
  rationale: מוֹט huonyesha kutokuwa imara, kuyumba, au kuteleza. Inapotumiwa kuhusu miguu, ‘kuteleza’ ni taswira ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: רַגְלֵנוּ
  choice: miguu yetu
  rationale: Hili ni tafsiri ya moja kwa moja ya nomino ya wingi, huku taswira halisi ya miguu ikihifadhiwa.
