  text: אָ֭וֶן אִם רָאִ֣יתִי בְ/לִבִּ֑/י לֹ֖א יִשְׁמַ֣ע אֲדֹנָֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/018.yaml
  text: If I had cherished iniquity in my heart[a], the Lord would not have listened.
translation:
  language: sw
  text: Kama ningaliuendekeza uovu moyoni mwangu[a], Bwana asingalisikiliza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kama ningaliutazama uovu moyoni mwangu, Bwana asingalisikia.”
    reason: Njia nyingine iliyo karibu zaidi na maneno ya Kiebrania ya kutafsiri רָאִיתִי na יִשְׁמַע.
lexical_decisions:
- source_word: אָוֶן
  choice: uovu
  rationale: Katika muktadha huu neno linaashiria ubaya au dhambi ya kimaadili; “uovu” ni la kawaida, pana kiasi kinachofaa, na linaeleweka kwa wasomaji wa Kiswahili cha sasa.
- source_word: אִם
  choice: kama
  rationale: Kihusishi hiki kinaanzisha sharti; “kama” ni uwasilishaji wa kawaida na wa asili katika Kiswahili.
- source_word: רָאִיתִי
  choice: ningaliuendekeza
  rationale: Ingawa maana ya msingi ni “kuona,” katika msemo huu wa Kiebrania kuona uovu moyoni ni kuutazama kwa kibali au kuuhifadhi kwa makusudi. “Kuendekeza” huwasilisha mtazamo huo bila kudai kwamba ni kule kutambua dhambi tu.
- source_word: בְלִבִּי
  choice: moyoni mwangu
  rationale: Huhifadhi taswira ya moyo kama kitovu cha mawazo, nia na utashi wa ndani.
- source_word: לֹא יִשְׁמַע
  choice: asingalisikiliza
  rationale: “Kusikiliza” huonyesha kusikia kwa kuitikia au kwa kibali katika muktadha wa sala, lakini hakiongezi dai la moja kwa moja kwamba Mungu ‘asingalijibu.’ Muundo wa -ngali- unaendana na sharti lisilotimia.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Hili ni jina la heshima la kimungu; “Bwana” ndilo neno la kawaida na lenye hadhi katika Kiswahili cha Biblia.
theological_decisions:
- issue: Iwapo msemo “kuona uovu moyoni” utafsiriwe moja kwa moja au maana yake ya kimuktadha itolewe
  choice: Kutafsiri kuwa kuendekeza uovu kwa ndani
  alternative: Kama ningaliutazama uovu moyoni mwangu
  rationale: Muktadha hauzungumzii kutambua tu kuwapo kwa dhambi, bali kuikubali au kuisitiri kwa nia. “Kuendekeza” huonyesha nguvu hiyo ya msemo, huku tanbihi ikihifadhi tafsiri iliyo karibu zaidi na umbo la Kiebrania.
- issue: Iwapo שׁמע itafsiriwe “kusikia,” “kusikiliza,” au “kujibu”
  choice: kusikiliza
  alternative: kusikia
  rationale: “Kusikiliza” linaonyesha upokeaji wenye kibali wa sala bila kulifanya neno liseme wazi “kujibu,” jambo ambalo Kiebrania halisemi moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sharti wa “ningali- … asingali-” umetumiwa kuonyesha hali isiyotimia inayodokezwa na muktadha.
