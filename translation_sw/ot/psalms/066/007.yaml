id: PSA.66.7
reference: Psalms 66:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: מֹ֘שֵׁ֤ל בִּ/גְבוּרָת֨/וֹ עוֹלָ֗ם עֵ֭ינָי/ו בַּ/גּוֹיִ֣ם תִּצְפֶּ֑ינָה הַ/סּוֹרְרִ֓ים אַל ירימו לָ֣/מוֹ סֶֽלָה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/007.yaml
  text: He rules forever by his might; his eyes watch the nations[a]. Let not the rebellious exalt themselves. Selah
translation:
  language: sw
  text: 'Anatawala milele kwa uweza wake;

    macho yake huyatazama mataifa.

    Waasi wasijiinue[a].

    Sela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wasijitukuze” au “wasiinuke.” Kitenzi cha Kiebrania kinaweza kumaanisha kujiinua, kuinuka, au kujitukuza.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֵׁל
  choice: Anatawala
  rationale: Kauli ya wakati endelevu inaonyesha utawala wa Mungu unaoendelea; Kiswahili cha sasa hutumia kitenzi hiki kwa ufasaha.
- source_word: בִּגְבוּרָתוֹ
  choice: kwa uweza wake
  rationale: Kiambishi בְּ kinaeleweka hapa kama cha njia, na גְּבוּרָה ni nguvu au uweza unaotumiwa katika kutawala.
- source_word: עוֹלָם
  choice: milele
  rationale: Katika nafasi hii neno linaonyesha muda usio na mwisho wa utawala wake.
- source_word: עֵינָיו
  choice: macho yake
  rationale: Taswira halisi ya Kiebrania imehifadhiwa badala ya kuifupisha kuwa tu ‘anatazama.’
- source_word: בַּגּוֹיִם תִּצְפֶּינָה
  choice: huyatazama mataifa
  rationale: צפה humaanisha kutazama au kuangalia kwa makini. Muundo huu ni wa kawaida katika Kiswahili na hauongezi wazo la kuyalinda mataifa.
- source_word: הַסּוֹרְרִים
  choice: Waasi
  rationale: Neno linaonyesha watu wenye ukaidi na uasi; ‘waasi’ ni la kawaida, wazi, na lenye uzito unaofaa.
- source_word: אַל יָרִימוּ לָמוֹ
  choice: wasijiinue
  rationale: אַֽל pamoja na kitenzi kisichotimilika hutoa katazo. Muundo wenye לָמוֹ unaelekea kwenye tendo la waasi kujiinua wenyewe, huku uwezekano wa ‘kuinuka’ ukibainishwa katika tanbihi.
- source_word: סֶלָה
  choice: Sela
  rationale: Ni alama ya kiliturujia au kimuziki ambayo maana yake kamili haijulikani; kwa hiyo imetoholewa badala ya kutafsiriwa kwa kubahatisha.
theological_decisions:
- issue: Lugha ya kibinadamu kuhusu namna Mungu anavyoona
  choice: macho yake huyatazama mataifa
  alternative: anayatazama mataifa
  rationale: Kiebrania kinataja macho yake waziwazi. Kuhifadhi taswira hiyo kunadumisha nguvu ya kishairi bila kudokeza kwamba Mungu ana mipaka ya viumbe.
- issue: Maana ya katazo linalowahusu waasi
  choice: Waasi wasijiinue
  alternative: Waasi wasiinuke
  rationale: לָמוֹ inaunga mkono maana ya kujitukuza au kujiinua wenyewe. Hata hivyo, kwa kuwa רום pia inaweza kumaanisha kuinuka, uwezekano huo umehifadhiwa katika tanbihi badala ya kufichwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Mpangilio wa mistari unahifadhi mwendo wa kishairi, na ‘Sela’ imeachwa kama alama ya zaburi.
