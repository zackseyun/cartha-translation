base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/007.yaml
  text: Yahweh is my strength and my shield[a]; in him my heart trusts, and I am helped. Therefore my heart rejoices[c][b], and with my song I will praise him.
translation:
  language: sw
  text: Yahwe ni nguvu zangu na ngao yangu; moyo wangu ulimtumaini, nami nikasaidiwa. Kwa hiyo moyo wangu unashangilia, nami nitamsifu kwa wimbo wangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: עֻזִּי
  choice: nguvu zangu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya עֹז katika muktadha huu wa kishairi.
- source_word: מָגִנִּי
  choice: ngao yangu
  rationale: Linahifadhi sitiari halisi na inayoeleweka ya מָגֵן.
- source_word: בּוֹ בָטַח לִבִּי
  choice: moyo wangu ulimtumaini
  rationale: Kitenzi בָטַח ni cha wakati timilifu, na kiambishi בּוֹ hapa huonyesha kumtegemea yeye; Kiswahili cha kawaida hutumia 'kumtumaini'.
- source_word: וְנֶעֱזָרְתִּי
  choice: nami nikasaidiwa
  rationale: Nifali ya עזר ina maana ya kutendewa, 'nikasaidiwa,' na mfuatano unaonyesha matokeo ya kutumaini.
- source_word: וַיַּעֲלֹז לִבִּי
  choice: moyo wangu unashangilia
  rationale: עלז huonyesha furaha kuu; 'unashangilia' ni ya asili na hudumisha nguvu ya kishairi.
- source_word: וּמִשִּׁירִי
  choice: kwa wimbo wangu
  rationale: מִן hapa yaelekea kuonyesha njia au chombo ambacho sifa inatolewa.
- source_word: אֲהוֹדֶנּוּ
  choice: nitamsifu
  rationale: Hifili ya ידה inaweza kumaanisha kusifu au kushukuru; katika muktadha wa wimbo, 'nitamsifu' inafaa vizuri.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu moja kwa moja; 'Yahwe' hulihifadhi kwa umbo linalotumika kwa kawaida katika Kiswahili.
- issue: Maana ya אֲהוֹדֶנּוּ
  choice: nitamsifu
  alternative: nitamshukuru
  rationale: Kitenzi cha Kiebrania kinaweza kuwa na maana zote mbili. Kutajwa kwa wimbo kunafanya 'nitamsifu' kuwa chaguo linalofaa, bila kukataa maana mbadala ya shukrani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kishairi na sitiari ya ngao zimehifadhiwa; nyakati za vitenzi zinafuata kwa karibu mtiririko wa Kiebrania.
