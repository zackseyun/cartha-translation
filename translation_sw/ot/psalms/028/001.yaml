  text: לְ/דָוִ֡ד אֵ֘לֶ֤י/ךָ יְהוָ֨ה אֶקְרָ֗א צוּרִ/י֮ אַֽל תֶּחֱרַ֪שׁ מִ֫מֶּ֥/נִּי פֶּן תֶּֽחֱשֶׁ֥ה מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם י֥וֹרְדֵי בֽוֹר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/001.yaml
  text: Of David[a]. To you, O Yahweh, I call; my rock, do not be deaf to me[c][b], lest you be silent to me and I become like those who go down to the pit.
translation:
  language: sw
  text: 'Ya Daudi.[a]


    Ninakuita, Ee Yahwe;

    wewe mwamba wangu, usiwe kiziwi kwangu,

    usinyamaze kwangu,

    nisije nikafanana na wale wanaoshuka shimoni.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa ajili ya Daudi,” au “Iliyotungwa na Daudi.” Kihusishi cha Kiebrania hakiamui wazi uhusiano hususa wa zaburi hii na Daudi.
    reason: lexical_alternative
  - marker: c
    text: “Shimo” linaweza kumaanisha kaburi au ulimwengu wa wafu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Kichwa hiki huhifadhi ufupi na kiwango fulani cha utata wa לְ kuhusu uhusiano wa zaburi na Daudi, bila kukazia moja kwa moja kuwa aliitunga au iliandikwa kwa ajili yake.
- source_word: אֵלֶיךָ יְהוָה אֶקְרָא
  choice: Ninakuita wewe, Ee Yahwe
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unahifadhi mkazo wa אֵלֶיךָ, yaani kwamba mwito unaelekezwa kwa Yahwe. Jina la agano יְהוָה limetoholewa kuwa “Yahwe” badala ya kubadilishwa na cheo.
- source_word: צוּרִי
  choice: wewe mwamba wangu
  rationale: “Mwamba wangu” huhifadhi sitiari halisi ya Mungu kuwa mwenye uthabiti na mlinzi; “wewe” hufanya mwito wa moja kwa moja usomeke kwa kawaida katika Kiswahili.
- source_word: אַל תֶּחֱרַשׁ מִמֶּנִּי
  choice: usiwe kiziwi kwangu
  rationale: חרשׁ inaweza kumaanisha kuwa kiziwi au kukaa kimya. Hapa “usiwe kiziwi kwangu” huhifadhi upande wa kutosikia na kuutofautisha na חשה katika mstari unaofuata, inayomaanisha kunyamaza.
- source_word: פֶּן תֶּחֱשֶׁה מִמֶּנִּי וְנִמְשַׁלְתִּי
  choice: Usinyamaze mbele yangu, nisije nikawa
  rationale: “Nisije nikawa” linaonyesha matokeo yanayoogopwa yanayoletwa na פֶּן. Mgawanyo wa mistari unahifadhi uhusiano wa kunyamaza kwa Mungu na hatari ya mwombaji kufanana na wafu, huku Kiswahili kikibaki wazi na cha kishairi.
- source_word: עִם יֹרְדֵי בוֹר
  choice: kama wale wanaoshuka shimoni
  rationale: Ingawa עִם ni “pamoja na,” kitenzi cha kufanana hufanya “kama wale” kuwa Kiswahili cha kawaida. “Shimoni” huhifadhi taswira ya בור bila kuamua ikiwa inamaanisha kaburi hasa au ulimwengu wa wafu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi kama jina na kuepuka kulibadilisha na “BWANA”; “Yehova” ni matamshi ya baadaye yasiyo karibu sana na ushahidi wa jina hilo.
- issue: Taswira ya “shimo” na hali ya wafu
  choice: shimoni
  alternative: kaburini; katika ulimwengu wa wafu
  rationale: בור linaweza kuelekeza kwenye kaburi au makao ya wafu. Tafsiri halisi “shimoni” huhifadhi mvutano huo bila kuingiza ufafanuzi wa kiteolojia usiosemwa wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Mistari mifupi inadumisha muundo wa ombi na matokeo yanayoogopwa. “Ee” huonyesha mwito wa heshima; msamiati wa sitiari umehifadhiwa bila ufafanuzi wa kimadhehebu.
