source:
  edition: WLC
  text: בָּר֥וּךְ יְהוָ֑ה כִּי שָׁ֝מַע ק֣וֹל תַּחֲנוּנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/006.yaml
  text: Blessed be Yahweh[b][a], for he has heard the voice of my pleas for mercy.
translation:
  language: sw
  text: 'Yahwe na ahimidiwe,

    kwa kuwa ameisikia sauti ya maombi yangu ya kusihi rehema.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlio wa maombi yangu ya kusihi rehema.” Neno la Kiebrania linaweza kumaanisha “sauti” au “mlio.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: na ahimidiwe
  rationale: Katika kauli hii ya sifa kwa Mungu, umbo la Kiebrania lina maana ya kutangaza kuwa Yahwe anastahili baraka na sifa. Kiswahili cha sasa hutumia kwa kawaida na kwa heshima kauli “na ahimidiwe,” bila kupoteza nguvu ya tamko hilo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kuwa “Yahwe,” badala ya kubadilishwa na cheo.
- source_word: כִּי
  choice: kwa kuwa
  rationale: Kiunganishi hiki kinatoa sababu ya mtunga zaburi kumhimidi Yahwe.
- source_word: שָׁמַע
  choice: ameisikia
  rationale: Kitenzi kamilifu kinaonyesha tendo lililotimia lenye umuhimu katika hali ya sasa; wakati timilifu wa Kiswahili unafaa hapa.
- source_word: קוֹל
  choice: sauti ya
  rationale: Neno linaweza kumaanisha “sauti” au “mlio.” “Sauti” ni ya kawaida na ya kibinafsi zaidi katika muktadha wa maombi.
- source_word: תַּחֲנוּנָי
  choice: maombi yangu ya kusihi rehema
  rationale: Nomino hii inaonyesha maombi ya dhati yanayoomba fadhili au rehema. Tafsiri hii ni wazi kwa wasomaji wa sasa na inahifadhi uzito wa kusihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina binafsi la Mungu, si cheo; kwa hiyo “Yahwe” hulihifadhi wazi.
- issue: Maana ya tamko בָּרוּךְ kwa Mungu
  choice: na ahimidiwe
  alternative: na abarikiwe
  rationale: “Na abarikiwe” hufuata umbo la Kiebrania kwa ukaribu zaidi, lakini “na ahimidiwe” huwasilisha kwa Kiswahili cha kawaida maana ya tamko la sifa linaloelekezwa kwa Mungu, bila kuingiza fundisho la ziada.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa mistari unahifadhi kauli ya sifa ikifuatiwa na sababu yake.
