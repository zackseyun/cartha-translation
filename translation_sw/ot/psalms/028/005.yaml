  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֤י לֹ֤א יָבִ֡ינוּ אֶל פְּעֻלֹּ֣ת יְ֭הוָה וְ/אֶל מַעֲשֵׂ֣ה יָדָ֑י/ו יֶ֝הֶרְסֵ֗/ם וְ/לֹ֣א יִבְנֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/005.yaml
  text: Because they do not understand the works of Yahweh or the work of his hands[a], he will tear them down and not build them up.
translation:
  language: sw
  text: Kwa maana hawaelewi matendo ya Yahweh, wala kazi ya mikono yake; atawabomoa, wala hatawajenga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana hawayatii maanani matendo ya Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya ombi au hukumu iliyotangulia, kwa mtiririko wa kawaida wa Kiswahili.
- source_word: לֹא יָבִינוּ אֶל
  choice: hawaelewi
  rationale: Kitenzi בין pamoja na אֶל hapa kinaeleza kutambua au kuelewa matendo ya Mungu; tafsiri hii ni ya kawaida na bado inadumisha uwezekano wa maana ya ‘kuyatia maanani,’ unaotajwa katika tanbihi.
- source_word: פְּעֻלֹּת יְהוָה
  choice: matendo ya Yahweh
  rationale: ‘Matendo’ hueleza vitendo au kazi anazozifanya Yahweh, na wingi wake unafuata Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa moja kwa moja katika chanzo; limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: מַעֲשֵׂה יָדָיו
  choice: kazi ya mikono yake
  rationale: Inahifadhi umoja wa ‘kazi’ na taswira halisi ya mikono yake katika usemi sambamba wa Kiebrania.
- source_word: יֶהֶרְסֵם
  choice: atawabomoa
  rationale: הרס ni kubomoa; chaguo hili linahifadhi sitiari ya jengo na upinzani wake na ‘kuwajenga.’
- source_word: וְלֹא יִבְנֵם
  choice: wala hatawajenga
  rationale: Inafuata maana ya moja kwa moja ya בנה, ‘kujenga,’ bila kuongeza dhana isiyo wazi ya kuwajenga tena.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia Tetragramatoni kama jina binafsi; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Taswira ya hukumu kama kubomoa na kutojenga
  choice: atawabomoa, wala hatawajenga
  alternative: atawaangamiza wala hatawasimamisha tena
  rationale: Tafsiri iliyochaguliwa inadumisha sitiari ya Kiebrania ya kubomoa na kujenga bila kuifafanua kupita kiasi kama kuangamizwa kabisa au kutorejeshwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Wala’ inadumisha muundo sambamba wa mstari, na ‘kuwabomoa/kuwajenga’ huhifadhi taswira ya Kiebrania.
