  text: תֶּן לָ/הֶ֣ם כְּ/פָעֳלָ/ם֮ וּ/כְ/רֹ֪עַ מַֽעַלְלֵ֫י/הֶ֥ם כְּ/מַעֲשֵׂ֣ה יְ֭דֵי/הֶם תֵּ֣ן לָ/הֶ֑ם הָשֵׁ֖ב גְּמוּלָ֣/ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/004.yaml
  text: Give to them according to their work[a], and according to the evil of their deeds; according to the work of their hands give to them; repay them their due.
translation:
  language: sw
  text: Uwape sawasawa na matendo yao, na sawasawa na uovu wa matendo yao; uwape sawasawa na kazi ya mikono yao; warudishie malipo yao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּן
  choice: uwape
  rationale: Amri ya נתן inayomwelekea Mungu; ‘uwape’ ni ya moja kwa moja na inadumisha nguvu ya ombi.
- source_word: כְּפָעֳלָם
  choice: sawasawa na matendo yao
  rationale: פעל hapa ni tendo au kazi; ‘matendo yao’ ni Kiswahili cha kawaida na kinahifadhi wazo la kulipwa kwa kadiri ya walivyotenda.
- source_word: וּכְרֹעַ מַעַלְלֵיהֶם
  choice: na sawasawa na uovu wa matendo yao
  rationale: רֹעַ inaonyesha uovu, huku מַעַלְלִים ikiwa matendo yenye uzito wa kimaadili katika muktadha huu.
- source_word: כְּמַעֲשֵׂה יְדֵיהֶם
  choice: sawasawa na kazi ya mikono yao
  rationale: Inahifadhi taswira ya Kiebrania ya mikono na muundo sambamba wa mstari.
- source_word: הָשֵׁב
  choice: warudishie
  rationale: Hifili ya שוב hapa ni kusababisha malipo yawarudie, yaani kuwalipa kwa walivyotenda; ‘warudishie’ inadumisha taswira hiyo.
- source_word: גְּמוּלָם
  choice: malipo yao
  rationale: גְּמוּל ni malipo au ujira unaolingana na tendo; ‘malipo yao’ ni fupi, rasmi kwa kiasi, na haiongezi wazo lisilokuwamo.
theological_decisions:
- issue: Lugha ya laana na kisasi cha Mungu
  choice: Mstari umetafsiriwa kama ombi kwa Mungu awalipe waovu kwa uwiano wa matendo yao.
  alternative: Kulainisha kauli iwe maelezo tu badala ya ombi.
  rationale: Amri zinazorudiwa, ‘uwape ... uwape ... warudishie,’ zinaonyesha wazi ombi la haki ya Mungu, si taarifa isiyoegemea upande wowote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Urudiaji na usambamba wa Kiebrania umehifadhiwa; hakuna alama ya tanbihi kwa kuwa hakuna tanbihi inayohitajika katika rasimu hii.
