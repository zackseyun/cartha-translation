base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/008.yaml
  text: Yahweh is strength for them[b][a], and he is a stronghold of salvation for his anointed one.
translation:
  language: sw
  text: Yahwe ni nguvu yao, naye ni ngome ya wokovu[a] kwa mtiwa mafuta wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ngome ya ukombozi” au “ngome ya matendo ya kuokoa.” Kiebrania kimetumia nomino ya wingi, kihalisi “maokozi.”
    reason: lexical_alternative
  - marker: b
    text: “Mtiwa mafuta wake” pia inaweza kutafsiriwa “Masihi wake.” Katika muktadha, huenda kwanza inamhusu mfalme wa Yahwe aliyetiwa mafuta, huku pia ikiruhusu maana pana ya kimasiya.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa umbo la Kiswahili linalotambulika, badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: עֹז לָמוֹ
  choice: nguvu yao
  rationale: Neno עֹז linamaanisha nguvu au uweza, na לָמוֹ ni kiwakilishi cha wingi. “Nguvu yao” ni Kiswahili cha kawaida kinachohifadhi maana kwamba Yahwe ndiye nguvu kwao.
- source_word: מָעוֹז
  choice: ngome
  rationale: Neno hili linaonyesha mahali au chanzo cha ulinzi; “ngome” huhifadhi taswira ya mahali imara pa usalama.
- source_word: יְשׁוּעוֹת
  choice: wokovu
  rationale: Ingawa nomino ya Kiebrania iko katika wingi, Kiswahili cha kawaida hutumia “wokovu” kama nomino ya jumla. Wingi na uwezekano wa kumaanisha matendo mengi ya kuokoa umehifadhiwa katika tanbihi.
- source_word: מְשִׁיחוֹ
  choice: mtiwa-mafuta wake
  rationale: Hili ni neno la maelezo kwa mtu aliyetiwa mafuta, hasa mfalme katika muktadha huu. Tafsiri hii haikulazimishi kuwa cheo maalumu, huku ikiacha mwangwi wa kimasiya wazi.
- source_word: הוּא
  choice: naye ni
  rationale: Kiwakilishi huru cha Kiebrania kina msisitizo; “naye ni” huonyesha msisitizo huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Iwapo מְשִׁיחוֹ itafsiriwe kama cheo “Masihi wake” au kama maelezo “mtiwa-mafuta wake”
  choice: mtiwa-mafuta wake
  alternative: Masihi wake
  rationale: Katika muktadha wa zaburi, neno hilo linaweza kwanza kumaanisha mfalme wa Yahwe aliyetiwa mafuta, bila kulifanya moja kwa moja kuwa cheo maalumu. Tanbihi huhifadhi uwezekano wa maana ya kimasiya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “nguvu yao” na “ngome ya wokovu kwa” umetumiwa kwa ufasaha wa Kiswahili huku ukihifadhi picha na mvutano wa Kiebrania.
