  yaml_path: translation/ot/psalms/028/009.yaml
  text: Save your people and bless your inheritance[b][a]; shepherd them and carry them forever.
translation:
  language: sw
  text: Uwaokoe watu wako, na ubariki urithi wako; uwachunge[a] na uwabebe[b] milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uwalishe”; kitenzi cha Kiebrania kinaweza kumaanisha kutunza kundi kama mchungaji, jambo linalojumuisha kulilisha.
    reason: lexical_alternative
  - marker: b
    text: Au “uwainue.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעָה
  choice: Uwaokoe
  rationale: Ni ombi la moja kwa moja kwa Mungu. Kitenzi ‘okoa’ kinawasilisha kwa lugha ya kawaida maana ya kuokoa au kukomboa bila kupanua dhana ya Kiebrania.
- source_word: עַמֶּךָ
  choice: watu wako
  rationale: Kirai hiki kinataja watu walio wa Mungu; ‘watu wako’ ni tafsiri wazi na ya kawaida katika Kiswahili.
- source_word: בָרֵךְ
  choice: ubariki
  rationale: Ni ombi kwa Mungu la kuwabariki watu wake, na ‘bariki’ inadumisha sauti ya sala.
- source_word: נַחֲלָתֶךָ
  choice: urithi wako
  rationale: ‘Urithi wako’ inadumisha taswira ya watu kama fungu au milki ya Mungu katika uhusiano wa agano.
- source_word: רְעֵם
  choice: uwachunge
  rationale: Kitenzi cha Kiebrania kinahusu kazi pana ya mchungaji, ikiwemo kulisha na kutunza. ‘Uwachunge’ huhifadhi taswira hiyo kwa Kiswahili cha kawaida.
- source_word: נַשְּׂאֵם
  choice: uwabebe
  rationale: Kitenzi kinaweza kumaanisha kuinua, kubeba, au kuchukua. ‘Uwabebe’ kinafaa katika muktadha wa utunzaji wa mchungaji huku uwezekano wa ‘kuwainua’ ukiwekwa katika tanbihi.
- source_word: עַד הָעוֹלָם
  choice: milele
  rationale: ‘Milele’ ni usemi wa kawaida wa Kiswahili unaowasilisha muda usio na mwisho.
theological_decisions:
- issue: Taswira ya kichungaji katika רְעֵם
  choice: uwachunge
  alternative: uwalishe
  rationale: Maana ya kitenzi inajumuisha kulisha lakini ni pana zaidi, ikihusu utunzaji wote wa mchungaji. Tafsiri hii huhifadhi taswira ya Mungu kama mchungaji bila kuibana maana.
- issue: Utambulisho wa watu kama נַחֲלָתֶךָ
  choice: urithi wako
  alternative: milki yako
  rationale: ‘Urithi wako’ huhifadhi sitiari ya agano inayowaonyesha watu kuwa fungu la Mungu, badala ya kuigeuza moja kwa moja kuwa lugha ya umiliki.
- issue: Utata wa נַשְּׂאֵם
  choice: uwabebe
  alternative: uwainue
  rationale: ‘Uwabebe’ huendeleza wazo la utunzaji wa kichungaji, lakini tanbihi inadumisha maana nyingine halisi inayowezekana ya kuinua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye sauti ya sala iliyo ya heshima lakini inayoeleweka kwa wasomaji wa kawaida. Muundo wa vitenzi vya ombi umehifadhiwa, na sitiari za urithi na uchungaji hazijafafanuliwa kupita kiasi.
