  yaml_path: translation/ot/psalms/028/002.yaml
  text: Hear the voice of my pleas for mercy when I cry to you[c][b][a], when I lift up my hands toward your holy inner sanctuary.
translation:
  language: sw
  text: Sikia sauti ya maombi yangu ya rehema[b][c] ninapokulilia, ninapoinua mikono yangu kuelekea patakatifu pako pa ndani[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “patakatifu pako”; neno la Kiebrania linaweza kutaja kwa namna maalumu sehemu takatifu ya ndani au ya ndani kabisa.
    reason: lexical_alternative
  - marker: b
    text: “Maombi yangu ya rehema” yanaweza pia kutafsiriwa “dua zangu za kusihi.”
    reason: lexical_alternative
  - marker: c
    text: Kwa tafsiri nyingine, “mlio wa maombi yangu ya rehema.”
    reason: previous_rendering
lexical_decisions:
- source_word: שְׁמַע
  choice: Sikia
  rationale: Ni amri ya moja kwa moja kwa Mungu; “Sikia” ni ya kawaida, yenye uzito, na inafaa katika lugha ya sala.
- source_word: קוֹל
  choice: sauti
  rationale: Neno hili humaanisha “sauti” au mlio; “sauti ya maombi yangu” linadumisha picha halisi ya Kiebrania na ni la asili katika Kiswahili.
- source_word: תַּחֲנוּנַי
  choice: maombi yangu ya rehema
  rationale: Hueleza maombi ya dhati ya kutaka fadhili au rehema; tafsiri hii inaeleweka kwa wasomaji wa kawaida kuliko neno rasmi zaidi kama “dua zangu za kusihi.”
- source_word: בְּשַׁוְּעִי אֵלֶיךָ
  choice: ninapokulilia
  rationale: Muundo wa ב pamoja na kitenzi-jina una maana ya wakati, na שׁוע huonyesha kilio chenye nguvu kinachoelekezwa kwa Mungu.
- source_word: בְּנָשְׂאִי יָדַי
  choice: ninapoinua mikono yangu
  rationale: Huhifadhi tendo halisi la kuinua mikono katika sala na maana ya wakati ya muundo wa Kiebrania.
- source_word: אֶל דְּבִיר קָדְשֶׁךָ
  choice: kuelekea patakatifu pako pa ndani
  rationale: דְּבִיר huelekea kutaja sehemu takatifu ya ndani kabisa ya hekalu; “patakatifu pako pa ndani” huwasilisha maana hiyo ya mahali kwa lugha wazi na yenye heshima.
theological_decisions:
- issue: Mahali pa ibada panapotajwa na דְּבִיר קָדְשֶׁךָ
  choice: patakatifu pako pa ndani
  alternative: patakatifu pako; chumba chako kitakatifu cha ndani
  rationale: Tafsiri iliyochaguliwa inadumisha picha ya sehemu takatifu ya ndani inayohusishwa na uwepo wa Mungu bila kuipanua kuwa hekalu lote wala kuingiza dai la kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha urudiaji wa “ninapo-” katika Kiebrania, ishara halisi ya kuinua mikono, na umahususi wa patakatifu pa ndani.
