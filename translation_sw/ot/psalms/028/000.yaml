base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/000.yaml
  text: Of David[a]. To you, Yahweh, I call; my rock, do not be deaf to me, lest if you are silent to me[c][b], I become like those going down to the pit.
translation:
  language: sw
  text: 'Ya Daudi.[a]


    Ee Yahwe, ninakuita;


    mwamba wangu, usiwe kiziwi kwangu.


    Usije ukanyamaza kwangu,


    nami nikawa kama wale wanaoshuka shimoni.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa Daudi.”
    reason: lexical_alternative
  - marker: b
    text: “Shimo” linaweza kumaanisha kaburi au makao ya wafu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Kichwa hiki kwa kawaida huonyesha uhusiano wa zaburi na Daudi, lakini kihusishi לְ kinaweza pia kueleweka kwa njia nyingine; tanbihi inahifadhi uwezekano wa ‘Kwa Daudi.’
- source_word: צוּרִי
  choice: mwamba wangu
  rationale: Taswira halisi ya mwamba imehifadhiwa kama namna ya kumwita Mungu akiwa tegemeo na usalama wa mwombaji.
- source_word: אַל־תֶּחֱרַשׁ מִמֶּנִּי
  choice: usinizibie masikio
  rationale: Nahau hii ya Kiswahili inaonyesha kutosikia au kutomjibu mwombaji, huku ikitofautishwa na kitenzi kinachofuata cha kunyamaza.
- source_word: תֶּחֱשֶׁה מִמֶּנִּי
  choice: ukanyamaza kwangu
  rationale: Tafsiri hii inahifadhi wazo la Mungu kutotoa jibu na pia marudio yenye msisitizo katika Kiebrania.
- source_word: בּוֹר
  choice: shimoni
  rationale: ‘Shimo’ huhifadhi taswira ya kushuka chini na pia linaweza kumaanisha kaburi au makao ya wafu kulingana na muktadha.
theological_decisions:
- issue: Maana ya uhusiano wa zaburi na Daudi katika לְדָוִד
  choice: Ya Daudi
  alternative: Kwa Daudi
  rationale: ‘Ya Daudi’ ndiyo namna ya kawaida na ya asili ya kichwa hiki katika Kiswahili, lakini tanbihi inaacha wazi uwezekano wa wakfu au uhusiano mwingine bila kulazimisha hitimisho kuhusu utunzi.
- issue: Uhusiano kati ya kunyamaza kwa Mungu na kufanana na wanaoshuka shimoni
  choice: Usije ukanyamaza kwangu, nami nikawa kama wale wanaoshuka shimoni
  alternative: Ukinyamaza kwangu, nitakuwa kama wale wanaoshuka shimoni
  rationale: Muundo wa ‘usije... nami...’ unafuata פֶּן na וְ, ukiwasilisha matokeo yanayoogopwa bila kubadili ombi kuwa kauli ya masharti iliyo wazi zaidi kuliko chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi ulio wa heshima lakini unaoeleweka kwa urahisi. Jina la agano limetafsiriwa ‘Yahwe.’ Mistari imegawanywa kulingana na vitengo vya maana na usambamba wa kishairi.
