base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/003.yaml
  text: Do not drag me away with the wicked[a], with those who work evil[b], who speak peace with their neighbors while evil is in their hearts.
translation:
  language: sw
  text: Usiniburuze pamoja na waovu,[a] pamoja na watenda maovu, wanaosema amani na jirani zao,[b] ilhali mioyoni mwao mna uovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Usinivute pamoja na waovu.”
    reason: lexical_alternative
  - marker: b
    text: Au “rafiki zao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשְׁכֵנִי
  choice: usiniburuze
  rationale: Kitenzi hiki kinaonyesha kuvutwa au kuondolewa pamoja na wengine. “Usiniburuze” linadumisha uzito wa ombi la kutokuchukuliwa pamoja na waovu, bila kueleza wazi ikiwa kinachokusudiwa ni hukumu.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja kwa watu wenye mwenendo mwovu katika Zaburi.
- source_word: פֹּעֲלֵי אָוֶן
  choice: watenda maovu
  rationale: Kauli hii ya Kiswahili ni ya asili na inadumisha wazo la watu wanaofanya uovu kwa vitendo.
- source_word: דֹּבְרֵי שָׁלוֹם
  choice: huwaambia ... maneno ya amani
  rationale: Inadumisha taswira ya Kiebrania ya kusema amani na pia kuonyesha kwamba maneno hayo yanaelekezwa kwa watu wengine.
- source_word: רֵעֵיהֶם
  choice: jirani zao
  rationale: רֵעַ inaweza kumaanisha jirani, rafiki, au mwenzi. “Jirani zao” linafaa katika muktadha wa mahusiano ya kawaida bila kudokeza lazima urafiki wa karibu.
- source_word: רָעָה
  choice: uovu
  rationale: Hapa neno hilo linaashiria nia mbaya iliyofichwa ndani, kinyume na maneno ya amani yanayosemwa kwa nje.
- source_word: בִּלְבָבָם
  choice: mioyoni mwao
  rationale: Inahifadhi taswira ya moyo kama kitovu cha nia na mawazo ya ndani, huku ikisomeka kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Ombi la mtunga zaburi kuhusu waovu
  choice: Ombi la kutochukuliwa pamoja na waovu katika sehemu au hatima yao
  alternative: Ombi la kutofuata tu mfano wa waovu
  rationale: Muundo wa “usiniburuze pamoja na” unaelekea kumaanisha kutokuchukuliwa pamoja nao, huenda katika hukumu; hata hivyo, tafsiri haiongezi neno “hukumu,” kwa kuwa chanzo hakilitaji wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Ilhali” linaweka wazi tofauti kali kati ya maneno yao ya nje na uovu wa ndani bila kuongeza maelezo yasiyomo katika chanzo.
