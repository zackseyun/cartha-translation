base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/000.yaml
  text: A Song of Ascents[a]. Of David. I rejoiced when they said to me[c][b], “Let us go to the house of Yahweh.”
translation:
  language: sw
  text: 'Wimbo wa Kupanda[a]. Wa Daudi.


    Nilifurahi waliponiambia,


    “Twende katika nyumba ya Yahwe.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kichwa cha Kiebrania: “Wimbo wa Kupanda”; huenda kinaashiria wimbo wa hija au wa mkusanyo wa kiliturujia. Pia kinaweza kutafsiriwa “Wimbo wa kwenda juu.”'
    reason: cultural_note
  - marker: b
    text: Yahwe huwakilisha jina binafsi la Mungu katika Kiebrania (YHWH). Katika tafsiri nyingi za Kiswahili huandikwa “BWANA.”
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa kwenda juu
  rationale: Huhifadhi taswira ya Kiebrania ya kupanda au kwenda juu, huku tanbihi ikieleza uwezekano wa matumizi yake kwa hija au mkusanyo wa kiliturujia.
- source_word: לְדָוִד
  choice: Wa Daudi
  rationale: Muundo mfupi wa kichwa huhifadhi uhusiano mpana wa Kiebrania, ambao unaweza kumaanisha uandishi, umilikaji, kuwekwa wakfu, au kuhusishwa na Daudi.
- source_word: שָׂמַחְתִּי
  choice: Nilifurahi
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya hali ya furaha iliyo katika kitenzi cha Kiebrania.
- source_word: בְּאֹמְרִים לִי
  choice: waliponiambia
  rationale: 'Hutoa kwa Kiswahili cha kawaida maana ya wakati au mazingira: furaha ilitokea watu walipomwambia msemaji.'
- source_word: בֵּית יְהוָה
  choice: nyumbani mwa YHWH
  rationale: Katika muktadha huu בֵּית ni nyumba au hekalu la Mungu; 'nyumbani mwa' ni usemi wa asili unaoonyesha mahali pa YHWH bila kupoteza taswira ya nyumba.
- source_word: נֵלֵךְ
  choice: Twende
  rationale: Huhifadhi wito wa nafsi ya kwanza wingi wa kwenda pamoja.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יהוה
  choice: YHWH
  alternative: BWANA; Yahwe
  rationale: Herufi YHWH huhifadhi jina maalumu la Kiebrania bila kulibadilisha kuwa cheo au kulazimisha matamshi ambayo hayana uhakika kamili; tanbihi hutoa mbadala unaojulikana kwa wasomaji.
- issue: Maana ya kichwa לְדָוִד
  choice: Wa Daudi
  alternative: Ulioandikwa na Daudi
  rationale: Kihusishi cha Kiebrania hakithibitishi uandishi pekee; tafsiri pana inahifadhi utata wake halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mistari imetenganishwa ili kufaa zaburi. Kichwa kimetafsiriwa kwa ufupi, na utata wa kihistoria na wa kileksika umewekwa katika tanbihi.
