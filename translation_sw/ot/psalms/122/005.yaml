  yaml_path: translation/ot/psalms/122/005.yaml
  text: For there thrones sit for judgment[c][b][a], thrones for the house of David.
translation:
  language: sw
  text: Kwa maana huko viti vya enzi vimewekwa kwa ajili ya hukumu[a][b], viti vya enzi vya nyumba ya Daudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vimeketi kwa ajili ya hukumu”; kitenzi cha Kiebrania maana yake halisi ni “kuketi,” na hapa kinaweza kueleza viti vya enzi vilivyowekwa au kuthibitishwa kwa kazi ya kuhukumu.
    reason: lexical_alternative
  - marker: b
    text: “Hukumu” pia inaweza kutafsiriwa “haki,” kwa kukazia kazi ya viti hivyo kama mahakama.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huonyesha sababu au maelezo yanayohusiana na sifa za Yerusalemu katika muktadha.
- source_word: שָׁמָּה
  choice: huko
  rationale: Hurejelea Yerusalemu iliyotajwa kabla; ni usemi wa kawaida wa mahali katika Kiswahili.
- source_word: יָשְׁבוּ
  choice: vimewekwa
  rationale: Kitenzi maana yake ya msingi ni ‘kuketi,’ lakini kikiwa na viti vya enzi kama kiima kinaweza kueleza kwamba vimewekwa au kuthibitishwa mahali kwa kazi ya hukumu; Kiswahili ‘viti ... vinaketi’ si cha kawaida.
- source_word: כִסְאוֹת
  choice: viti vya enzi
  rationale: Huhifadhi maana ya viti vya kifalme vyenye mamlaka ya kutawala na kuhukumu, si viti vya kawaida.
- source_word: לְמִשְׁפָּט
  choice: kwa ajili ya hukumu
  rationale: Huonyesha kusudi la kimahakama; ‘hukumu’ huhifadhi upeo wa neno la Kiebrania bila kulifanya kuwa dhana ya jumla ya haki pekee.
- source_word: כִסְאוֹת לְבֵית דָּוִיד
  choice: viti vya enzi vya nyumba ya Daudi
  rationale: Huonyesha uhusiano wa viti hivyo na nasaba ya kifalme ya Daudi kwa njia ya asili na iliyo wazi katika Kiswahili.
theological_decisions:
- issue: Maana ya rejeo kwa nyumba ya Daudi
  choice: Viti vya enzi vinahusishwa na nasaba ya kifalme ya Daudi na kazi yake ya kimahakama huko Yerusalemu.
  alternative: Kuvitafsiri kama mahakama za kiraia kwa ujumla, au kuonyesha moja kwa moja maana ya Kimasihi.
  rationale: Andiko linataja wazi viti vya enzi, hukumu, na nyumba ya Daudi. Tafsiri inadumisha maana hiyo ya kihistoria bila kuingiza hitimisho la Kimasihi lisilotamkwa moja kwa moja katika mstari huu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. ‘Viti vya enzi’ ni usemi wa kawaida wa mamlaka ya kifalme; ‘vimewekwa’ huepuka Kiswahili kisicho cha kawaida cha kusema viti vinaketi huku tanbihi ikihifadhi picha halisi ya Kiebrania.
