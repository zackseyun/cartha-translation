  text: For the sake of my brothers and my companions[a], I will now say[c][b], “Peace be within you.”
translation:
  language: sw
  text: 'Kwa ajili ya ndugu zangu na rafiki zangu, nitasema sasa: “Amani iwe ndani yako.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Neno la Kiebrania נָא linaweza pia kuonyesha kusihi; sehemu hii ya mstari inaweza kueleweka: “Nitasema, tafadhali: ‘Amani iwe ndani yako.’” Neno “amani” linaweza pia kujumuisha hali njema, ukamilifu, au ustawi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: Kwa ajili ya
  rationale: Hueleza sababu au msukumo wa msemaji; usemi huu ni wa kawaida na huhifadhi maana ya kutenda kwa manufaa ya wengine.
- source_word: אַחַי
  choice: ndugu zangu
  rationale: Hutafsiri nomino ya kiume ya wingi yenye kiambishi cha nafsi ya kwanza bila kulazimisha maana finyu ya uhusiano wa damu; katika muktadha inaweza kuwahusu watu wa jamii moja.
- source_word: וְרֵעָי
  choice: na rafiki zangu
  rationale: רֵעַ inaweza kumaanisha rafiki, mwenzi, au jirani. “Rafiki” ni ya asili katika Kiswahili na inafaa sambamba na “ndugu.”
- source_word: אֲדַבְּרָה נָּא
  choice: nitasema sasa
  rationale: Kitenzi cha cohortative kinaonyesha azimio au msukumo wa msemaji, na נָא hapa inaweza kuonyesha wakati wa sasa au kusisitiza ombi. Tafsiri hii huhifadhi azimio na uharaka bila kuwa nzito.
- source_word: שָׁלוֹם
  choice: Amani
  rationale: Ni tafsiri ya msingi ya שָׁלוֹם na pia inaweza kujumuisha ustawi, ukamilifu, na hali njema.
- source_word: בָּךְ
  choice: ndani yako
  rationale: Kiambishi cha nafsi ya pili, umoja wa kike, kinarejelea Yerusalemu. “Ndani yako” huhifadhi usemi wa moja kwa moja kwa jiji na maana ya mahali.
theological_decisions:
- issue: Walengwa wa maneno ya undugu
  choice: ndugu zangu
  alternative: jamaa zangu
  rationale: Kiebrania kina neno la kiume la wingi “ndugu.” Kiswahili “ndugu” ni cha asili na kinaweza kutaja ndugu wa damu au watu wa jamii moja bila kuondoa sura ya undugu iliyomo katika chanzo.
- issue: Anayeambiwa baraka ya amani
  choice: 'Yerusalemu linaambiwa moja kwa moja: “Amani iwe ndani yako.”'
  alternative: Amani iwe ndani yake.
  rationale: Kiambishi בָּךְ ni nafsi ya pili ya kike, hivyo kinadumisha uelekezaji wa moja kwa moja kwa Yerusalemu lililotajwa katika muktadha.
- issue: Nguvu ya cohortative pamoja na נָא
  choice: nitasema sasa
  alternative: na niseme, tafadhali
  rationale: Muundo unaweza kueleweka kama azimio lenye uharaka au kama usemi wenye kusihi. Maandishi makuu yanachagua azimio la sasa, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio ni wa kishairi lakini unaeleweka kwa urahisi; usemi wa moja kwa moja kwa Yerusalemu umehifadhiwa.
