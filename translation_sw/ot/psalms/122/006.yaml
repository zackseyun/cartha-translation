  text: 'Pray for the peace of Jerusalem: may those who love you prosper[a][b].'
translation:
  language: sw
  text: 'Iombeeni Yerusalemu amani!

    Wanaokupenda na wafanikiwe[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wanaokupenda watafanikiwa,” au “Wanaokupenda na wawe na utulivu.”
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁאֲלוּ
  choice: Ombeeni
  rationale: Kitenzi cha amri kina maana ya kuomba au kutaka. Katika muktadha huu wa ibada, “ombeeni” huwasilisha kwa kawaida wito wa kumwomba Mungu kwa ajili ya Yerusalemu, huku “omba” ikibaki na upana wa maana ya chanzo.
- source_word: שְׁלוֹם
  choice: amani
  rationale: Neno hili linaweza kujumuisha amani, usalama, ustawi na hali njema kwa ujumla. “Amani” ni tafsiri ya kawaida na ya moja kwa moja katika muktadha huu.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalemu
  rationale: Jina la mahali limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: יִשְׁלָיוּ
  choice: na wafanikiwe
  rationale: Kitenzi kinaweza kumaanisha kuwa na utulivu, usalama au mafanikio. “Na wafanikiwe” kinaonyesha nguvu ya ombi au tamanio inayofaa baada ya amri ya kuombea amani, bila kukifanya kuwa ahadi ya lazima.
- source_word: אֹהֲבָיִךְ
  choice: wanaokupenda
  rationale: Kirai hiki kinawahusu wale wanaoipenda Yerusalemu na kinadumisha usemi wa moja kwa moja kwa mji kupitia kiambishi cha nafsi ya pili umoja.
theological_decisions:
- issue: Nguvu ya kishazi cha pili
  choice: 'Imetafsiriwa kama ombi au tamanio: “Wanaokupenda na wafanikiwe.”'
  alternative: 'Inaweza kueleweka kama kauli au ahadi: “Wanaokupenda watafanikiwa.”'
  rationale: Umbo la kitenzi kisichotimilika katika ushairi linaweza kuwa la kutakia au la taarifa. Baada ya amri “Ombeeni,” maana ya ombi inafaa kiasili, lakini uwezekano wa taarifa umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mgawanyo wa mistari na usemi wa moja kwa moja kwa Yerusalemu vimehifadhiwa; tanbihi inaonyesha utata wa nguvu na upana wa maana ya kitenzi cha Kiebrania.
