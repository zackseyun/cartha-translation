base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/001.yaml
  text: A Song of Ascents[a]. Of David. I rejoiced when they said to me[c][b], “Let us go to the house of Yahweh.”
translation:
  language: sw
  text: 'Wimbo wa Kupanda[a]. Wa Daudi.


    Nilifurahi waliponiambia,


    “Twende kwenye nyumba ya Yahwe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Wimbo wa Kupanda”; huenda ni kichwa cha nyimbo za hija au za ibada, hasa zinazohusiana na kupanda kwenda Yerusalemu. Pia yaweza kutafsiriwa “Wimbo wa mapando.”'
    reason: cultural_note
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa Kupanda
  rationale: Kichwa hiki kinaweza kuhusiana na safari ya kupanda kwenda Yerusalemu au na mkusanyo wa ibada. “Wimbo wa Kupanda” ni Kiswahili cha kawaida kinachohifadhi picha ya kupanda bila kuifafanua kupita kiasi.
- source_word: לְדָוִד
  choice: Wa Daudi
  rationale: Kihusishi לְ katika vichwa vya zaburi kinaweza kuonyesha utunzi, wakfu, umiliki, au uhusiano. “Wa Daudi” kinahifadhi upana huo kuliko “Ulioandikwa na Daudi.”
- source_word: שָׂמַחְתִּי
  choice: Nilifurahi
  rationale: Kitenzi kinaonyesha furaha ya msemaji. “Nilifurahi” ni tafsiri ya moja kwa moja, ya asili, na yenye hadhi katika Kiswahili cha sasa.
- source_word: בְּאֹמְרִים לִי
  choice: waliponiambia
  rationale: Muundo huu unaeleza wakati au tukio lililosababisha furaha. “Waliponiambia” huunganisha kwa kawaida maana ya “waliposema kwangu.”
- source_word: בֵּית יְהוָה
  choice: nyumbani mwa Yahwe
  rationale: Neno בַּיִת hapa ni nyumba au mahali pa ibada pa Yahwe. “Nyumbani mwa Yahwe” ni usemi wa asili wa Kiswahili na huhifadhi uhusiano wa muundo wa Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa konsonanti YHWH limetolewa kama “Yahwe,” umbo linalotumika na kueleweka katika Kiswahili.
- source_word: נֵלֵךְ
  choice: Twende
  rationale: Imperfecti ya nafsi ya kwanza wingi ina nguvu ya mwaliko au himizo hapa. “Twende” huwasilisha nguvu hiyo kwa ufupi na kwa kawaida.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina maalumu la Mungu, YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo, huku “BWANA” likiwa desturi nyingine ya tafsiri.
- issue: Maana ya לְ katika לְדָוִד
  choice: Wa Daudi
  alternative: Ulioandikwa na Daudi
  rationale: Kiebrania hakilazimishi hapa hitimisho moja kuhusu utunzi; “Wa Daudi” huacha wazi uwezekano wa utunzi, wakfu, umiliki, au uhusiano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mistari imepangwa kishairi. Tafsiri imeepuka kuamua kwa lazima maana ya kichwa cha zaburi na uhusiano wa Daudi, huku ikitumia “Yahwe” kwa jina la Mungu.
