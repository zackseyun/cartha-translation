  variant: Standard East African Swahili
source:
  edition: WLC
  text: לְ֭מַעַן בֵּית יְהוָ֣ה אֱלֹהֵ֑י/נוּ אֲבַקְשָׁ֖ה ט֣וֹב לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/009.yaml
  text: For the sake of the house of Yahweh our God[a], I will seek your good.
translation:
  language: sw
  text: Kwa ajili ya nyumba ya Yahwe, Mungu wetu, nitakutafutia mema.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitatafuta ustawi wako.” Neno la Kiebrania linalotafsiriwa “mema” hapa linamaanisha hali njema ya Yerusalemu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: Kwa ajili ya
  rationale: Kihusishi hiki kinaonyesha sababu au kusudi; ‘kwa ajili ya’ kinaeleza kwa kawaida msukumo wa mtunga zaburi.
- source_word: בֵּית
  choice: nyumba ya
  rationale: Hifadhi maana ya moja kwa moja ya ‘nyumba’; katika muktadha inarejelea hekalu bila kuondoa mwangwi mpana wa usemi wa Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uwasilishaji wa kawaida wa Kiswahili wa jina la agano YHWH, badala ya kulibadili kuwa cheo.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Huwakilisha kwa kawaida na kwa usahihi nomino yenye kiambishi cha nafsi ya kwanza wingi.
- source_word: אֲבַקְשָׁה
  choice: nitakutafutia
  rationale: Umbo hili linaonyesha azimio au nia ya msemaji. Kitenzi chenye mtendewa kinaunganisha kwa Kiswahili tendo la kutafuta na mema yanayotafutwa kwa ajili ya Yerusalemu.
- source_word: טוֹב
  choice: mema
  rationale: Neno lina wigo mpana wa mema, manufaa na ustawi; ‘mema’ huhifadhi upana huo kuliko kulibana kuwa ustawi wa mali.
- source_word: לָךְ
  choice: -ku- katika ‘nitakutafutia’
  rationale: Kiambishi cha nafsi ya pili umoja kinamrejelea Yerusalemu, ambaye anaendelea kusemeshwa moja kwa moja; Kiswahili huwasilisha maana hii kwa kiambishi cha mtendewa.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la Mungu YHWH; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Mrejelewa wa kiambishi לָךְ
  choice: Yerusalemu anayeendelea kusemeshwa
  alternative: nyumba ya Yahwe
  rationale: Kiambishi ni cha kike umoja na kwa kufuata muktadha wa Zaburi 122 kinamrejelea Yerusalemu, si ‘nyumba,’ ambayo kwa Kiebrania ni ya kiume.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Nyumba ya Yahwe’ huhifadhi taswira ya Kiebrania huku ‘nitakutafutia mema’ ikitoa azimio hilo kwa lugha ya kawaida. Alama ya tanbihi imewekwa baada ya sentensi inayohusika.
