translation:
  language: sw
  text: Miguu yetu imesimama ndani ya malango yako[a], Ee Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Miguu yetu ilikuwa imesimama katika malango yako, Yerusalemu.” Kiebrania hutumia kitenzi kishirikishi pamoja na kitenzi “kuwa” katika wakati timilifu; muundo huo unaweza kutafsiriwa pia kwa namna hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמְדוֹת הָיוּ
  choice: imesimama
  rationale: Muundo wa kitenzi kishirikishi pamoja na היה unaonyesha hali ya kusimama iliyofikiwa na inayoonekana sasa. Kiswahili cha sasa ‘imesimama’ ni cha kawaida na huhifadhi maana ya kufika na kuwa ndani ya mji; umoja unapatana na ngeli ya ‘miguu’ katika Kiswahili.
- source_word: רַגְלֵינוּ
  choice: miguu yetu
  rationale: Tafsiri ya moja kwa moja ya nomino ya wingi yenye kiambishi cha nafsi ya kwanza wingi, ikihifadhi taswira halisi ya mahujaji waliowasili.
- source_word: בִּשְׁעָרַיִךְ
  choice: ndani ya malango yako
  rationale: בְּ hapa inaeleweka kuwa wako katika eneo la malango, yaani ndani ya kiingilio cha mji, si kwamba wamefika tu mbele yake. ‘Ndani ya’ ni ya asili zaidi katika Kiswahili kuliko ‘katika malango’.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalemu
  rationale: Umbo la kawaida la jina hili la mahali katika Kiswahili.
