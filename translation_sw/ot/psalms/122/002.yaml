translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ee Yerusalemu’ huhifadhi usemi wa kumwita mji moja kwa moja; tanbihi huhifadhi uwezekano wa wakati uliopita katika muundo wa Kiebrania.
