  text: Huko makabila yalipanda, makabila ya Yah, kama ushuhuda kwa Israeli, ili kutoa shukrani kwa jina la BWANA.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָלוּ
  choice: yalipanda
  rationale: Kitenzi cha Kiebrania kiko katika wakati timilifu; hapa kinaeleza kupanda kwenda Yerusalemu, hivyo ‘yalipanda’ huhifadhi umbo na mwelekeo wa asili.
- source_word: שִׁבְטֵי יָהּ
  choice: makabila ya Yah
  rationale: ‘Yah’ ni umbo fupi la jina la Mungu katika maandishi ya Kiebrania; limehifadhiwa badala ya kulisawazisha na ‘BWANA’.
- source_word: עֵדוּת לְיִשְׂרָאֵל
  choice: kama ushuhuda kwa Israeli
  rationale: Huhifadhi maana ya msingi ya עֵדוּת na uhusiano wenye utata kiasi wa לְיִשְׂרָאֵל bila kuufanya wazi zaidi ya maandishi.
- source_word: לְהֹדוֹת
  choice: ili kulishukuru
  rationale: Katika muktadha huu kitenzi kinaeleza kusudi la kutoa shukrani au sifa; ‘kulishukuru jina’ ni Kiswahili cha asili kinachohifadhi uhusiano wake na ‘jina la BWANA’.
- source_word: יְהוָה
  choice: BWANA
  rationale: Jina la Mungu lenye konsonanti nne limetafsiriwa kwa desturi iliyoenea ya Biblia za Kiswahili, kwa herufi kubwa ili kulitofautisha na cheo cha kawaida.
theological_decisions:
- issue: Maana ya ‘ushuhuda kwa Israeli’
  choice: kama ushuhuda kwa Israeli
  alternative: kwa kufuata agizo lililopewa Israeli
  rationale: Neno עֵדוּת linaweza kurejelea ushuhuda, amri, au kanuni. Tafsiri iliyochaguliwa huhifadhi mvutano huo badala ya kuamua kwamba kifungu kinarejelea hasa amri ya hija.
- issue: Uwakilishi wa majina Yah na YHWH katika mstari mmoja
  choice: Yah ... BWANA
  alternative: BWANA ... BWANA
  rationale: Maandishi yenyewe yanatumia umbo fupi יָהּ kisha jina kamili יהוה; tofauti hiyo imehifadhiwa.
