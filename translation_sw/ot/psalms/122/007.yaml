translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kueleweka. Ulinganifu wa kishairi kati ya “kuta” na “ngome,” pamoja na “amani” na “utulivu,” umehifadhiwa.
