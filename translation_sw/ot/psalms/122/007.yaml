translation:
  language: sw
  text: Amani iwe ndani ya kuta zako[a], utulivu[b] ndani ya ngome zako[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndani ya maboma yako.” Neno la Kiebrania linaweza kurejelea ukuta, boma, au uzio wa ulinzi wa mji.
    reason: lexical_alternative
  - marker: b
    text: Au, “usalama” au “hali njema.” Neno la Kiebrania humaanisha hali tulivu na salama ya maisha.
    reason: lexical_alternative
  - marker: c
    text: Au, “ndani ya majumba yako ya kifalme.” Neno la Kiebrania linaweza kurejelea majumba ya kifalme au ngome imara.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: na iwe
  rationale: Kitenzi hiki katika hali ya jussive kinaonyesha ombi au tamanio. Muundo “na iwe” ni wa kawaida katika Kiswahili na unahifadhi nguvu hiyo ya ombi.
- source_word: שָׁלוֹם
  choice: amani
  rationale: Neno hili linaweza kumaanisha amani, hali njema, au ukamilifu. Katika ombi kwa ajili ya Yerusalemu, “amani” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: בְּחֵילֵךְ
  choice: ndani ya kuta zako
  rationale: חֵיל hapa hurejelea uzio au ujenzi wa ulinzi wa mji. “Kuta” ni wazi kwa wasomaji wa kawaida, na “ndani ya” huonyesha maana ya mahali ya בְּ.
- source_word: שַׁלְוָה
  choice: utulivu
  rationale: Neno hili huonyesha hali ya utulivu, usalama, na maisha yasiyo na fadhaa. “Utulivu” huhifadhi maana yake ya msingi bila kuibana kuwa ustawi wa mali pekee.
- source_word: בְּאַרְמְנוֹתָיִךְ
  choice: ndani ya ngome zako
  rationale: אַרְמוֹן inaweza kumaanisha jumba la kifalme au jengo imara lenye ulinzi. “Ngome” inafaa katika muktadha wa mji na usalama, huku tanbihi ikihifadhi maana nyingine halali.
