  text: נִכְסְפָ֬ה וְ/גַם כָּלְתָ֨ה נַפְשִׁ/י֮ לְ/חַצְר֪וֹת יְה֫וָ֥ה לִבִּ֥/י וּ/בְשָׂרִ֑/י יְ֝רַנְּנ֗וּ אֶ֣ל אֵֽל חָֽי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/002.yaml
  text: My soul longs—indeed[a], it even faints—for the courts of Yahweh; my heart and my flesh cry out to the living God.
translation:
  language: sw
  text: Nafsi yangu hutamani sana, naam, hata yazimia kwa kuitamani nyua za Yahwe; moyo wangu na mwili wangu vinamshangilia Mungu aliye hai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vinamlilia Mungu aliye hai.” Kitenzi cha Kiebrania kinaweza kumaanisha kupaza kilio chenye mlio wa furaha.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְסְפָה
  choice: inatamani sana
  rationale: Kitenzi kinaonyesha hamu kubwa au shauku; usemi huu ni wa kawaida na wenye uzito katika Kiswahili.
- source_word: וְגַם כָּלְתָה
  choice: naam, inazimia
  rationale: וְגַם inatilia mkazo hatua inayofuata, na כָּלְתָה hapa huonyesha kudhoofika au kuishiwa nguvu kwa sababu ya shauku.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: Huhifadhi picha ya Kiebrania ya mtu wa ndani na kuendana na jozi inayofuata ya moyo na mwili.
- source_word: לְחַצְרוֹת
  choice: kwa shauku ya nyua
  rationale: Nyua ni maeneo ya wazi katika kiwanja cha hekalu; muundo huu unaonyesha kitu kinachotamaniwa kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uwasilishaji wa kawaida wa Kiswahili wa jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania, bila kulibadili kuwa cheo.
- source_word: לִבִּי וּבְשָׂרִי
  choice: moyo wangu na mwili wangu
  rationale: Huhifadhi jozi ya mtu wa ndani na hali yake ya kimwili; 'mwili' ni ya asili zaidi kuliko 'nyama' katika muktadha huu.
- source_word: יְרַנְּנוּ
  choice: vinamlilia
  rationale: Kitenzi kinaweza kumaanisha kutoa kilio chenye mlio, mara nyingi cha furaha. Katika muktadha huu 'vinamlilia' huonyesha sauti ya shauku bila kuondoa uwezekano wa kilio cha furaha.
- source_word: אֶל אֵל חָי
  choice: Mungu aliye hai
  rationale: Kiambishi cha yambwa katika 'vinamlilia' kinawakilisha mwelekeo wa אֶל kuelekea Mungu, na kirai huhifadhi sifa ya Mungu kuwa hai.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu moja kwa moja; 'Yahwe' hulihifadhi badala ya kuweka cheo mahali pake.
- issue: Maana ya יְרַנְּנוּ
  choice: vinamlilia
  alternative: vinamshangilia
  rationale: Kitenzi mara nyingi huashiria kilio cha furaha, lakini muktadha wa kutamani na kuzimia unaruhusu kilio kikali kinachoelekezwa kwa Mungu. Uwezekano wa shangwe umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. 'Naam' huhifadhi msisitizo wa kishairi; 'nyua' hufaa kwa mazingira ya hekalu.
