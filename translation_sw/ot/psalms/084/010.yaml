  text: כִּ֤י טֽוֹב י֥וֹם בַּ/חֲצֵרֶ֗י/ךָ מֵ֫/אָ֥לֶף בָּחַ֗רְתִּי הִ֭סְתּוֹפֵף בְּ/בֵ֣ית אֱלֹהַ֑/י מִ֝/דּ֗וּר בְּ/אָהֳלֵי רֶֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/010.yaml
  text: For a day in your courts is better than a thousand[b][a]; I would rather stand at the threshold in the house of my God than dwell in the tents of wickedness.
translation:
  language: sw
  text: Kwa maana siku moja katika nyua zako ni bora kuliko elfu[a]; nimechagua kusimama kizingitini mwa nyumba ya Mungu wangu[b] kuliko kukaa katika mahema ya uovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema tu, “kuliko elfu.” Baadhi ya tafsiri huongeza “siku nyingine” au “mahali pengine,” lakini maneno hayo hayamo katika maandishi.
    reason: alternative_reading
  - marker: b
    text: Au, “nimechagua kuwa kizingitini mwa nyumba ya Mungu wangu”; kwa mapokeo, “afadhali niwe mlinzi wa mlango katika nyumba ya Mungu wangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: ni bora
  rationale: Katika muundo wa kulinganisha unaofuatiwa na מֵאָלֶף, ‘ni bora’ huwasilisha kwa Kiswahili maana ya ulinganisho ya neno ambalo kimsingi humaanisha ‘njema.’
- source_word: בַּחֲצֵרֶיךָ
  choice: katika nyua zako
  rationale: ‘Nyua’ huhifadhi wingi wa Kiebrania na picha halisi ya maeneo ya wazi ya patakatifu.
- source_word: מֵאָלֶף
  choice: kuliko elfu
  rationale: Kiebrania hakitaji wazi ‘siku’ wala ‘mahali pengine’ baada ya ‘elfu’; tafsiri inaacha upungufu huo kama ulivyo.
- source_word: בָּחַרְתִּי
  choice: nimechagua
  rationale: Huhifadhi hali timilifu ya kitenzi na uamuzi wa hiari wa msemaji, bila kuugeuza tu kuwa usemi wa kupendelea.
- source_word: הִסְתּוֹפֵף
  choice: kusimama kizingitini
  rationale: Huwasilisha kuwa mahali pa chini karibu na ingilio bila kuingiza wadhifa rasmi wa mlinzi wa mlango, ambao hautajwi wazi na kitenzi.
- source_word: בְּבֵית אֱלֹהַי
  choice: mwa nyumba ya Mungu wangu
  rationale: ‘Nyumba’ hudumisha taswira ya Kiebrania ya patakatifu bila kuifafanua kupita kiasi kuwa hekalu.
- source_word: מִדּוּר
  choice: kuliko kukaa
  rationale: Huwasilisha kwa Kiswahili cha kawaida tendo endelevu la kuishi au kukaa linalolinganishwa na kuwa katika nyumba ya Mungu.
- source_word: בְּאָהֳלֵי רֶשַׁע
  choice: katika mahema ya uovu
  rationale: Huhifadhi nomino dhahania ‘uovu’ na wingi ‘mahema,’ badala ya kuibadili kuwa rejeo la moja kwa moja kwa watu waovu.
theological_decisions:
- issue: Lugha ya patakatifu
  choice: nyua zako / nyumba ya Mungu wangu
  alternative: nyua zako / hekalu la Mungu wangu
  rationale: Tafsiri inadumisha picha halisi za maeneo ya patakatifu na ukaribu na Mungu, lakini haisemi ‘hekalu’ mahali ambapo Kiebrania kinasema ‘nyumba.’
- issue: Maana ya הִסְתּוֹפֵף
  choice: kusimama kizingitini
  alternative: kuwa mlinzi wa mlango
  rationale: Kitenzi kinaweza kueleweka kwa njia tofauti, lakini hakithibitishi wazi wadhifa rasmi. Maandishi makuu yanaonyesha mahali pa unyenyekevu, na mbadala wa mapokeo unawekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. ‘Kizingitini’ ni neno sahihi la mlango linalohifadhi taswira ya nafasi ya unyenyekevu; tanbihi husaidia pale ambapo kitenzi cha Kiebrania kina utata.
