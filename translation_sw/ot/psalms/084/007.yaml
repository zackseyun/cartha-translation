base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/007.yaml
  text: They go from strength to strength[b][a]; each one appears before God in Zion.
translation:
  language: sw
  text: Wanaenda kutoka nguvu hadi nguvu[a]; kila mmoja hujitokeza mbele za Mungu Sayuni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kikosi hadi kikosi,” au “kutoka ushindi hadi ushindi”; neno la Kiebrania lililotafsiriwa “nguvu” linaweza pia kumaanisha uwezo, ushujaa, au jeshi.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania kinaweza pia kumaanisha “huonekana.” Katika muktadha huu huenda maana yake ni kwamba kila mmoja hujitokeza mbele za Mungu kwa ajili ya ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵלְכוּ
  choice: Wanaendelea
  rationale: Kitenzi cha Kiebrania kinaonyesha mwendo unaoendelea katika muktadha wa hija. ‘Wanaendelea’ ni Kiswahili cha kawaida kinachoeleza kusonga mbele bila kulazimisha namna maalumu ya kutembea.
- source_word: מֵחַיִל אֶל חָיִל
  choice: kutoka nguvu hadi nguvu
  rationale: חַיִל lina maana mbalimbali, kama nguvu, ushujaa, jeshi au kundi. Katika muktadha wa wasafiri wanaokwenda kuabudu, usemi huu kwa kawaida unaonyesha nguvu inayoongezeka au kufanywa upya, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: יֵרָאֶה
  choice: huonekana
  rationale: Niphal ya ראה inaweza kumaanisha ‘kuonekana’ au, katika muktadha wa ibada, kujitokeza mbele ya Mungu. ‘Huonekana’ huhifadhi kwa kiasi fulani utata huo bila kufanya tafsiri kuwa nzito.
- source_word: אֶל אֱלֹהִים
  choice: mbele za Mungu
  rationale: Ingawa אֶל kwa kawaida ni ‘kwa/kuelekea,’ katika usemi wa kujitokeza kwa ajili ya ibada, ‘mbele za Mungu’ ni Kiswahili cha asili na kinafikisha maana ya muktadha.
- source_word: בְצִיּוֹן
  choice: huko Sayuni
  rationale: Jina la mahali limetoholewa kuwa ‘Sayuni.’ ‘Huko’ linaonyesha wazi kwamba Sayuni ndilo eneo ambako kila mmoja huonekana mbele za Mungu.
- source_word: יֵרָאֶה (umoja katika muktadha wa wingi)
  choice: kila mmoja huonekana
  rationale: Kitenzi ni cha umoja ingawa mstari unaanza na wahusika wa wingi. ‘Kila mmoja’ huhifadhi maana ya mgawanyo kwa kila msafiri badala ya kusawazisha kisarufi kuwa wingi.
theological_decisions:
- issue: Maana ya kujitokeza mbele za Mungu
  choice: Mstari unaeleza kila mwabudu akijitokeza mbele za Mungu huko Sayuni.
  alternative: 'Inaweza kueleweka kwa hali ya kupokea tendo: kila mmoja anaonekana na Mungu huko Sayuni.'
  rationale: Katika miktadha ya hija na ibada, Niphal ya ראה mara nyingi humaanisha kujitokeza mbele ya Mungu. Hata hivyo, neno ‘huonekana’ na tanbihi vinahifadhi uwezekano wa maana ya kupokea tendo bila kuingiza hitimisho la kiteolojia lisilolazimishwa na maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kishairi; ‘kutoka nguvu hadi nguvu’ huhifadhi uradidi wa Kiebrania, na tanbihi zinaweka wazi upana wa maana bila kulemea mstari mkuu.
