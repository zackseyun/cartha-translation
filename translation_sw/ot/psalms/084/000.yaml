lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza muziki
  rationale: Katika vichwa vya Zaburi neno hili humaanisha msimamizi wa uimbaji au utendaji wa muziki; “mwongoza muziki” ni Kiswahili cha sasa, wazi, na hakilazimishi kuwa kulikuwa na kwaya pekee.
- source_word: עַל
  choice: kwa
  rationale: Katika maelekezo ya kimuziki, kihusishi hiki kinaweza kutambulisha mtindo, ala, au wimbo maalumu. “Kwa” ni kifupi na kinaacha uhusiano huo ukiwa wazi bila kuufafanua kupita ushahidi.
- source_word: הַגִּתִּית
  choice: Githithi
  rationale: Maana kamili ya istilahi hii ya Kiebrania haijulikani; huenda ni mpangilio wa muziki, jina la wimbo, au ala. Utohozi unahifadhi hali hiyo ya kutokuwa na uhakika.
- source_word: לִבְנֵי קֹרַח
  choice: ya wana wa Kora
  rationale: Kihusishi ל kinaweza kuonyesha utunzi, uhusiano, umiliki, au wakfu. “Ya wana wa Kora” ni usemi mfupi unaohifadhi upana huo kwa kadiri inayowezekana katika Kiswahili.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ni jina la aina ya wimbo wa kidini ulioimbwa kwa kuandamana na muziki; “Zaburi” ndilo neno la kawaida na linaloeleweka katika Kiswahili.
