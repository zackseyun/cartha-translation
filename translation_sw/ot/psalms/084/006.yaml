  text: עֹבְרֵ֤י בְּ/עֵ֣מֶק הַ֭/בָּכָא מַעְיָ֣ן יְשִׁית֑וּ/הוּ גַּם בְּ֝רָכ֗וֹת יַעְטֶ֥ה מוֹרֶֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/006.yaml
  text: As they pass through the Valley of Baca[a], they make it a spring[b]; even the early rain covers it with blessings.
translation:
  language: sw
  text: Wanapopita katika Bonde la Baka[a], hulifanya kuwa chemchemi; hata mvua ya mapema[b] hulifunika kwa baraka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Baka huenda lina mwangwi wa neno la Kiebrania linalohusiana na “kulia”; hivyo pia yaweza kueleweka kuwa “Bonde la Kilio.”
    reason: alternative_reading
  - marker: b
    text: Au “mvua ya kwanza ya msimu.” Neno la Kiebrania linaweza pia kumaanisha “mwalimu,” lakini katika muktadha huu kwa kawaida hueleweka kuwa mvua ya msimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבְרֵי
  choice: Wanapopita
  rationale: Kirai hiki cha wakati kinawasilisha kwa Kiswahili cha kawaida hali endelevu ya kitenzi shiriki cha Kiebrania, huku wahusika wakieleweka kutokana na muktadha wa mahujaji.
- source_word: בְּעֵמֶק
  choice: katika Bonde
  rationale: Pamoja na kitenzi cha kupita, kihusishi kinaonyesha mwendo ndani ya bonde; muundo wa Kiswahili ‘kupita katika’ ni wa kawaida na wazi.
- source_word: הַבָּכָא
  choice: Baka
  rationale: Neno hili linaweza kuwa jina la mahali na pia kuamsha wazo la kulia. Kulitohoa kama jina kunahifadhi utata huo badala ya kuamua tafsiri moja katika matini kuu.
- source_word: מַעְיָן
  choice: chemchemi
  rationale: Neno hili humaanisha chanzo au chemchemi ya maji; ‘chemchemi’ ni neno la Kiswahili linaloeleweka na linafaa kwa taswira ya shairi.
- source_word: יְשִׁיתוּהוּ
  choice: hulifanya kuwa
  rationale: Kitenzi שׁית kina maana ya kuweka au kufanya, na kiambishi cha nafsi ya tatu umoja kinarejelea bonde. Tafsiri hii inaonyesha kuligeuza bonde kuwa chemchemi.
- source_word: גַּם
  choice: hata
  rationale: Neno hili linaongeza kauli yenye uzito katika mwendelezo wa kishairi; ‘hata’ linahifadhi msisitizo huo.
- source_word: בְּרָכוֹת
  choice: kwa baraka
  rationale: Umbo la Kiebrania kwa kawaida humaanisha ‘baraka.’ Tafsiri hii pia inadumisha mwingiliano wa kishairi kati ya baraka na maji yanayoleta uhai.
- source_word: יַעְטֶה
  choice: hulifunika
  rationale: Kitenzi kinaonyesha kufunika au kuzingira. Kiambishi ‘-li-’ kinarejelea bonde linaloeleweka kuwa kitu kinachofunikwa.
- source_word: מוֹרֶה
  choice: mvua ya mapema
  rationale: Katika muktadha wa maji na majira ya kilimo, maana ya mvua ya kwanza ya msimu ndiyo inayofaa zaidi. ‘Mvua ya mapema’ huepuka kuifungamanisha na mpangilio mahususi wa majira wa Afrika Mashariki.
theological_decisions:
- issue: Iwapo הַבָּכָא litafsiriwe kwa maana yake inayoweza kuhusishwa na kulia au litoholewe kama jina la mahali
  choice: Baka katika matini kuu
  alternative: Bonde la Kulia
  rationale: Umbo hilo linafanya kazi kwa kawaida kama jina la mahali, lakini huenda likadokeza kulia. Kulitohoa kunazuia kufuta utata wa kishairi, huku tanbihi ikihifadhi maana nyingine.
- issue: Maana ya מוֹרֶה
  choice: mvua ya mapema
  alternative: mwalimu
  rationale: Taswira ya chemchemi na baraka za maji inaunga mkono maana ya mvua ya msimu. Hata hivyo, kwa kuwa umbo hilo pia linaweza kumaanisha ‘mwalimu,’ uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi bila kuwa kigumu. Muundo ‘Wanapopita ... hulifanya’ ni wa kawaida na unaendeleza mwendo wa mahujaji; ‘Baka’ na ‘mvua ya mapema’ zinahifadhi utata halisi wa Kiebrania kwa msaada wa tanbihi.
