  text: יְה֘וָ֤ה אֱלֹהִ֣ים צְ֭בָאוֹת שִׁמְעָ֣/ה תְפִלָּתִ֑/י הַאֲזִ֨ינָ/ה אֱלֹהֵ֖י יַעֲקֹ֣ב סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/008.yaml
  text: O Yahweh God of hosts[a], hear my prayer; give ear, O God of Jacob[b]. Selah
translation:
  language: sw
  text: Ee Yahwe, Mungu wa majeshi,[a] sikia sala yangu; tega sikio, Ee Mungu wa Yakobo. Sela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania “majeshi”; huenda yakamaanisha vikosi au majeshi ya mbinguni, lakini msemo huu hauyabainishi zaidi.
    reason: lexical_alternative
  - marker: b
    text: “Sela” ni istilahi ya Kiebrania ya kiliturujia au kimuziki ambayo maana yake si hakika; huenda ikamaanisha pumziko au sehemu ya muziki.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Limenukuliwa kama jina binafsi la Mungu badala ya kubadilishwa kwa cheo; umbo “Yahwe” ni la kawaida na linalosomeka kwa Kiswahili.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hapa ni cheo cha Mungu kinachokaa sambamba na jina Yahwe.
- source_word: צְבָאוֹת
  choice: wa majeshi
  rationale: Huhifadhi upana wa maana ya neno la Kiebrania kuhusu majeshi au vikosi, bila kulifafanua kimakusudi kuwa la mbinguni au la duniani pekee.
- source_word: שִׁמְעָה
  choice: sikia
  rationale: Ni amri ya moja kwa moja katika ombi, na ni ya asili katika lugha ya sala ya Kiswahili.
- source_word: תְפִלָּתִי
  choice: sala yangu
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye kiambishi cha nafsi ya kwanza umoja.
- source_word: הַאֲזִינָה
  choice: tega sikio
  rationale: Huhifadhi taswira na ulinganifu wa kishairi, huku ikitofautisha ombi hili na “sikia.”
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: Mungu wa Yakobo
  rationale: Huhifadhi wazi muundo wa uhusiano unaomtaja Mungu kwa uhusiano wake na Yakobo.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana na kazi kamili ya istilahi hii ya Kiebrania hazijulikani kwa hakika; kuandika kwa sauti zake huepuka kuamua maana yenye utata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina la Mungu lenye herufi nne. Kulitaja kama “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Ufafanuzi wa צְבָאוֹת
  choice: majeshi
  alternative: majeshi ya mbinguni; vikosi
  rationale: “Majeshi” huhifadhi uwezekano mpana wa rejeo la Kiebrania bila kulifanya mahsusi kuliko chanzo.
- issue: Uwasilishaji wa סֶלָה
  choice: Sela
  alternative: pumziko; sehemu ya muziki
  rationale: Kwa kuwa maana yake halisi inabishaniwa, unukuzi huhifadhi istilahi ya kiliturujia au kimuziki bila kuingiza tafsiri ya kubahatisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Ee” huhifadhi mwito wa sala; “tega sikio” huhifadhi ulinganifu wa kishairi bila kuwa lugha nzito kupita kiasi.
