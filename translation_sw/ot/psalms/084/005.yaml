  yaml_path: translation/ot/psalms/084/005.yaml
  text: Blessed is the man whose strength is in you[b][a], in whose heart are the highways.
translation:
  language: sw
  text: Heri mtu ambaye nguvu yake iko kwako, na ambaye moyoni mwake mna njia kuu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mioyoni mwao mna njia kuu.” Kiambishi tamati cha umilikaji katika Kiebrania, katika “moyo wao,” ni cha wingi, ingawa mstari unaanza na “mtu” wa umoja.
    reason: lexical_alternative
  - marker: b
    text: Huenda “njia kuu” zikamaanisha njia za hija zinazoelekea kwenye maskani ya Mungu, lakini mstari huu hautaji wazi “kwenda Sayuni.”
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heri
  rationale: Hili ndilo neno la kawaida na lenye hadhi katika kauli za baraka; linaweza kuonyesha hali ya kubarikiwa na yenye ustawi bila kupunguza maana kuwa hisia ya furaha tu.
- source_word: אָדָם
  choice: mtu
  rationale: Nomino hii hapa ni ya umoja na hutumiwa kwa maana ya jumla. Kiswahili sanifu hutumia “mtu” kwa kawaida bila kulazimika kutaja jinsia.
- source_word: עֹז
  choice: nguvu
  rationale: Katika muktadha huu neno linaonyesha uwezo au nguvu inayopatikana kwa Mungu, si hasa ngome au mahali pa kujikinga.
- source_word: לוֹ
  choice: nguvu zake
  rationale: Muundo wa Kiebrania una maana halisi ya “nguvu kwake”; kiwakilishi cha umilikaji katika “nguvu zake” huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: בָךְ
  choice: ziko kwako
  rationale: Huhifadhi wazo kwamba nguvu za mtu huyo zinapatikana kwa Mungu, bila kulipanua kwa tafsiri kama “zinatoka kwako” au “kwa njia yako.”
- source_word: מְסִלּוֹת
  choice: njia kuu
  rationale: Nomino hii humaanisha barabara zilizoinuliwa au njia kuu. Tafsiri haiongezi “za kwenda Sayuni,” kwa kuwa mahali hapo hapatajwi wazi katika mstari huu.
- source_word: בִּלְבָבָם
  choice: moyoni mwake
  rationale: Kiswahili kinalainisha badiliko la Kiebrania kutoka “mtu” wa umoja hadi kiambishi cha wingi, huku kikihifadhi wazo kwamba njia hizo zimo ndani ya moyo. Umbo la wingi katika chanzo linaelezwa katika tanbihi.
theological_decisions:
- issue: Matumizi ya jumla ya אָדָם
  choice: mtu
  alternative: mwanadamu; mwanaume
  rationale: “Mtu” ni tafsiri sahihi ya nomino ya umoja inayomwakilisha yeyote mwenye sifa hiyo; haiingizi dai lisilohitajika kwamba anayelengwa ni mwanamume pekee.
- issue: Mahali zinakoelekea njia za מְסִלּוֹת
  choice: njia kuu
  alternative: njia kuu za kwenda Sayuni; njia za hija
  rationale: Muktadha wa Zaburi 84 unaashiria safari ya kwenda katika maskani ya Mungu, lakini mstari wenyewe hautaji Sayuni wala kutumia neno la moja kwa moja la “hija.” Maana hiyo imewekwa katika tanbihi badala ya kuingizwa katika matini.
- issue: Badiliko la idadi katika בִּלְבָבָם
  choice: moyoni mwake
  alternative: mioyoni mwao
  rationale: Matini inaanza na “mtu” wa umoja lakini kiambishi cha Kiebrania katika “moyo wao” ni cha wingi. Matini kuu inatumia umoja wa kawaida katika Kiswahili, huku tanbihi ikihifadhi taarifa ya kisarufi na uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mtindo wa kauli ya heri na taswira ya njia zilizo moyoni, bila kuongeza mahali zinakoelekea. “Mna” limetumiwa kwa upatanisho wa mahali ndani ya “moyo.”
