  variant: Standard East African Swahili
source:
  edition: WLC
  text: מַה יְּדִיד֥וֹת מִשְׁכְּנוֹתֶ֗י/ךָ יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/001.yaml
  text: How lovely are your dwelling places[a], O Yahweh of hosts!
translation:
  language: sw
  text: 'Jinsi makao yako yanavyopendeza,[a]

    Ee Yahweh wa majeshi!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jinsi makao yako yanavyopendwa,” au “Jinsi makao yako yalivyo mazuri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Jinsi ... yanavyo-
  rationale: Hapa מַה inaanzisha mshangao, si swali. Muundo huu wa Kiswahili unaonyesha mshangao wa kishairi kwa njia ya kawaida na yenye hadhi.
- source_word: יְּדִידוֹת
  choice: yanavyopendeza
  rationale: Neno hili linaweza kueleza kupendwa, kuwa kwa thamani, au kupendeza. ‘Yanavyopendeza’ ni la asili linapotumiwa kuhusu makao na linadumisha hisia ya kuvutiwa bila kuondoa uwezekano wa maana ‘yanavyopendwa.’
- source_word: מִשְׁכְּנוֹתֶיךָ
  choice: makao yako
  rationale: ‘Makao’ yanahifadhi wingi wa Kiebrania na wazo la mahali pa kukaa. Hayafungi maana kwenye hema la kukutania pekee, bali yanaweza kuhusisha maeneo ya patakatifu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limenukuliwa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: צְבָאוֹת
  choice: wa majeshi
  rationale: Katika cheo יְהוָה צְבָאוֹת, ‘majeshi’ ni tafsiri pana na inayoeleweka, inayoweza kurejelea majeshi ya mbinguni na nguvu zilizo chini ya amri ya Mungu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Ee Yahweh
  alternative: Ee BWANA; Ee Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uwasilishaji wa cheo יְהוָה צְבָאוֹת
  choice: Yahweh wa majeshi
  alternative: Yahweh wa vikosi
  rationale: ‘Wa majeshi’ hudumisha uzito na upana wa cheo bila kuamua kimyakimya kwamba kinarejelea majeshi ya aina moja tu.
- issue: Maana ya יְּדִידוֹת kuhusu makao
  choice: yanavyopendeza
  alternative: yanavyopendwa; yalivyo mazuri
  rationale: Chaguo hili linafaa kwa makao katika Kiswahili cha sasa, huku tanbihi ikihifadhi mvutano wa kileksika kati ya kupendeza na kupendwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mgawanyo wa mistari unadumisha mshangao na mwito wa moja kwa moja wa mstari wa Kiebrania.
