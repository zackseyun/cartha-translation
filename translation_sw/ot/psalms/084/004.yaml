  verdict: approve
  source_fidelity: “Heri” accurately conveys אַשְׁרֵי in its elevated beatitude sense. “Wale wanaokaa nyumbani mwako” preserves the participial sense of יוֹשְׁבֵי and the literal imagery of בֵיתֶךָ without prematurely narrowing it to “hekalu.” “Wataendelea kukusifu” suitably represents עוֹד plus the imperfect יְהַלְלוּךָ, retaining ongoing praise and the second-person object. “Sela” appropriately transliterates סֶּלָה.
  naturalness: The Swahili is clear, idiomatic, and appropriately dignified for a psalm. “Nyumbani mwako” naturally conveys dwelling in God’s house in this poetic context, and the semicolon gives a natural relation between the beatitude and its result.
