  yaml_path: translation/ot/psalms/084/004.yaml
  text: Blessed are those who dwell in your house[a]; they will still praise you[c][b]. Selah
translation:
  language: sw
  text: Heri wale wanaokaa nyumbani mwako; wataendelea kukusifu. Sela.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nyumbani mwako” huenda kunamaanisha patakatifu au hekalu la Mungu.
    reason: cultural_note
  - marker: b
    text: “Sela” ni istilahi ya Kiebrania ya kiliturujia au kimuziki ambayo maana yake kamili haijulikani.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heri
  rationale: Neno hili la wingi linaanzisha tamko la hali yenye baraka. “Heri” ni usemi wa kawaida, wenye hadhi, katika Kiswahili cha Biblia na haupunguzi maana kuwa hisia ya furaha pekee.
- source_word: יוֹשְׁבֵי
  choice: wale wanaokaa
  rationale: Kitenzi ישׁב hapa kina maana ya kukaa au kudumu mahali, si kuketi tu; muundo huu pia unahifadhi hali endelevu ya kirai cha Kiebrania.
- source_word: בֵיתֶךָ
  choice: nyumbani mwako
  rationale: Kiebrania kinasema kihalisi “nyumba yako.” “Nyumbani mwako” ni Kiswahili cha asili kinachoonyesha kuwamo na kukaa humo, huku marejeo yanayowezekana ya patakatifu yakiachwa wazi.
- source_word: עוֹד
  choice: wataendelea
  rationale: עוֹד huonyesha mwendelezo. Kuunganisha maana hiyo na kitenzi kuwa “wataendelea kukusifu” ni ya kawaida katika Kiswahili na huepuka tafsiri yenye nguvu zaidi ya “daima.”
- source_word: יְהַלְלוּךָ
  choice: kukusifu
  rationale: Umbo lisilotimilika linaweza kueleza tendo la wakati ujao au la mazoea. Pamoja na “wataendelea,” tafsiri hii huhifadhi hali ya mwendelezo na kiambishi cha mtendewa “-ku-.”
- source_word: סֶּלָה
  choice: Sela
  rationale: Maana kamili ya istilahi hii ya kiliturujia au kimuziki haijulikani; imeandikwa kwa herufi za Kiswahili badala ya kupewa maana ya kukisia.
theological_decisions:
- issue: Marejeo ya “nyumbani mwako”
  choice: Maneno ya picha “nyumbani mwako” yamehifadhiwa katika matini kuu.
  alternative: hekaluni mwako / katika patakatifu pako
  rationale: Muktadha huenda unaelekeza kwenye patakatifu au hekalu la Mungu, lakini בֵיתֶךָ yenyewe ni “nyumba yako.” Kutolitaja moja kwa moja kuwa hekalu kunahifadhi upana na taswira ya Kiebrania.
- issue: Wakati au hali ya tendo la kusifu
  choice: wataendelea kukusifu
  alternative: wanakusifu / watakusifu tena
  rationale: Kitenzi kisichotimilika pamoja na עוֹד kinaweza kuwa cha wakati ujao au cha mazoea. “Wataendelea” huonyesha mwendelezo bila kudai kwamba maana ni “tena” baada ya kusimama.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni rahisi kwa msomaji wa kawaida, huku taswira ya “nyumba” na kutokuwa na uhakika kwa “Sela” vikihifadhiwa.
