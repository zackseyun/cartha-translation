  text: גַּם צִפּ֨וֹר מָ֪צְאָה בַ֡יִת וּ/דְר֤וֹר קֵ֥ן לָ/הּ֮ אֲשֶׁר שָׁ֪תָה אֶפְרֹ֫חֶ֥י/הָ אֶֽת מִ֭זְבְּחוֹתֶי/ךָ יְהוָ֣ה צְבָא֑וֹת מַ֝לְכִּ֗/י וֵ/אלֹהָֽ/י־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/003.yaml
  text: Even the sparrow has found a home[a], and the swallow a nest for herself, where she may lay her young—at your altars, O Yahweh of Armies[c][b], my King and my God.
translation:
  language: sw
  text: 'Hata shomoro amepata makao,

    na mbayuwayu amepata kiota chake,

    ambamo ameweka makinda yake—

    madhabahuni pako,[a]

    ee Yahweh wa Majeshi,[b]

    Mfalme wangu na Mungu wangu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “karibu na madhabahu zako” au “kando ya madhabahu zako.” Muundo wa Kiebrania ni mfupi na unaweza kueleza ukaribu na madhabahu badala ya mahali pa moja kwa moja madhabahuni.
    reason: lexical_alternative
  - marker: b
    text: 'Tafsiri ya kimapokeo: “BWANA wa majeshi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Hata
  rationale: Huonyesha msisitizo wa kishairi kwamba hata ndege wadogo wamepata mahali katika patakatifu pa Mungu.
- source_word: צִפּוֹר
  choice: shomoro
  rationale: Neno linaweza kumaanisha ndege mdogo kwa ujumla, lakini ‘shomoro’ ni tafsiri ya kimapokeo na inayowezekana hapa, nayo inaoana na ‘mbayuwayu’.
- source_word: מָצְאָה בַיִת
  choice: amepata makao
  rationale: ‘Makao’ huwasilisha maana ya mahali pa kuishi kwa ufasaha zaidi kuliko ‘nyumba’ halisi.
- source_word: דְרוֹר
  choice: mbayuwayu
  rationale: Hili ndilo jina la ndege linalokubalika zaidi katika muktadha huu, ingawa utambulisho wake mahususi si wa hakika kabisa.
- source_word: קֵן לָהּ
  choice: kiota kwa ajili yake
  rationale: Huhifadhi wazo la manufaa au milki linaloonyeshwa na kiwakilishi cha Kiebrania.
- source_word: אֲשֶׁר שָׁתָה אֶפְרֹחֶיהָ
  choice: ambamo amewaweka makinda yake
  rationale: Kitenzi cha Kiebrania ni cha hali timilifu na kimsingi humaanisha kuweka; ‘amewaweka’ huhifadhi tendo lililokamilika bila kukifanya kitenzi kimaanishe hasa kutaga.
- source_word: אֶת מִזְבְּחוֹתֶיךָ
  choice: karibu na madhabahu zako
  rationale: Muundo wa Kiebrania ni mfupi na wenye utata. Muktadha unaelekea kuonyesha ukaribu na madhabahu, si lazima ndege kuwa juu yake moja kwa moja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa katika matini ya Kiebrania badala ya kulibadili kuwa cheo.
- source_word: צְבָאוֹת
  choice: wa Majeshi
  rationale: ‘Majeshi’ huwasilisha maana halisi na ya kifalme ya צְבָאוֹת kwa Kiswahili cha sasa.
- source_word: מַלְכִּי וֵאלֹהָי
  choice: Mfalme wangu na Mungu wangu
  rationale: Huhifadhi ungamo la kibinafsi na mwito wa moja kwa moja kwa Mungu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Matini inatumia jina la Mungu moja kwa moja; ‘Yahweh’ hulihifadhi badala ya kutumia cheo mbadala.
- issue: Maana ya צְבָאוֹת katika cheo cha Mungu
  choice: wa Majeshi
  alternative: wa majeshi ya mbinguni
  rationale: ‘Wa Majeshi’ huhifadhi upana na mvutano wa cheo cha Kiebrania bila kuamua kwamba majeshi hayo ni ya mbinguni pekee.
- issue: Mahali pa kiota kuhusiana na madhabahu
  choice: karibu na madhabahu zako
  alternative: kwenye madhabahu zako
  rationale: Muundo wa Kiebrania unaweza kuonyesha uhusiano wa mahali; tafsiri ya ukaribu huepuka picha isiyowezekana ya kiota kuwa juu ya madhabahu, huku tanbihi ikihifadhi tafsiri ya moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mistari imepangwa kuonyesha usambamba wa zaburi; ‘ee’ hutumika katika mwito wa moja kwa moja.
