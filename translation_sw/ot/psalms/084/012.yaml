id: PSA.84.12
reference: Psalms 84:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: יְהוָ֥ה צְבָא֑וֹת אַֽשְׁרֵ֥י אָ֝דָ֗ם בֹּטֵ֥חַ בָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/012.yaml
  text: O Yahweh of hosts[b][a], blessed is the man who trusts in you.
translation:
  language: sw
  text: 'Ee Yahwe wa majeshi,

    heri[a] mtu[b] anayekutumaini.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “amebarikiwa” au “ana furaha.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina umoja; “mtu” hapa humwakilisha mwanadamu yeyote anayemtumaini Yahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama “BWANA,” hivyo kuhifadhi jina binafsi katika Kiebrania.
- source_word: צְבָאוֹת
  choice: wa majeshi
  rationale: Huhifadhi taswira ya neno la Kiebrania linaloweza kurejelea majeshi ya mbinguni au ya duniani, bila kulipanua kwa tafsiri kama “Mwenyezi.”
- source_word: אַשְׁרֵי
  choice: heri
  rationale: “Heri” ni tamko la kawaida na lenye hadhi katika Kiswahili kwa fomula hii ya hekima; linaweza kuhusisha kubarikiwa, kuwa na furaha, au kuwa katika hali ya kufanikiwa.
- source_word: אָדָם
  choice: mtu
  rationale: Neno hili hapa ni umoja wenye maana ya uwakilishi, likimaanisha mwanadamu yeyote; “mtu” ni tafsiri ya kawaida na sahihi katika Kiswahili.
- source_word: בֹּטֵחַ
  choice: anayekutumaini
  rationale: 'Kitenzi kishirikishi kinaonyesha tabia ya kuendelea au sifa ya mtu: yeye anayemwekea Mungu tumaini.'
- source_word: בָּךְ
  choice: -ku-
  rationale: Kiambishi cha nafsi ya pili umoja ndani ya “anayekutumaini” huhifadhi usemi wa moja kwa moja unaomwelekea Yahwe.
theological_decisions:
- issue: Tafsiri ya jina na cheo יְהוָה צְבָאוֹת
  choice: Ee Yahwe wa majeshi
  alternative: Ee Bwana Mwenyezi
  rationale: “Ee” huonyesha wazi kwamba hii ni kauli ya kumwita Mungu moja kwa moja; “Yahwe” huhifadhi jina la Mungu, na “wa majeshi” huhifadhi taswira ya Kiebrania bila kuibadili kuwa wazo pana zaidi la uweza wote.
- issue: Maana ya אַשְׁרֵי
  choice: heri
  alternative: amebarikiwa / ana furaha
  rationale: “Heri” huhifadhi upana wa tamko la Kiebrania bila kulifunga kwa hisia ya furaha pekee au kwa tendo lililoelezwa wazi la kubariki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa mistari unafuata mapumziko ya maana ya kishairi; “anayekutumaini” ni usemi wa kawaida na wa moja kwa moja.
