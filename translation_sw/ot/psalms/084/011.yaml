  text: כִּ֤י שֶׁ֨מֶשׁ וּ/מָגֵן֮ יְהוָ֪ה אֱלֹ֫הִ֥ים חֵ֣ן וְ֭/כָבוֹד יִתֵּ֣ן יְהוָ֑ה לֹ֥א יִמְנַע ט֝֗וֹב לַֽ/הֹלְכִ֥ים בְּ/תָמִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/011.yaml
  text: For Yahweh God is a sun and shield[a]; Yahweh gives favor and honor[b]. He does not withhold good from those who walk blamelessly.
translation:
  language: sw
  text: 'Kwa maana Yahweh Mungu ni jua na ngao;

    Yahweh hutoa kibali na heshima[a].

    Yahweh hawanyimi jambo jema

    wale wanaoishi kwa unyofu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “neema na utukufu.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, kwa uadilifu au kwa moyo mzima; si lazima iwe maana ya kutokuwa na dhambi kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kishazi hiki kinatoa sababu ya uthibitisho uliotangulia; “kwa maana” ni kiunganishi cha kawaida na chenye hadhi katika Kiswahili.
- source_word: שֶׁמֶשׁ וּמָגֵן
  choice: jua na ngao
  rationale: Taswira mbili za kishairi zimehifadhiwa moja kwa moja bila kuzifafanua kuwa nuru au ulinzi.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Mungu
  rationale: Jina la agano יְהוָה limetoholewa kuwa “Yahweh,” na אֱלֹהִים limetafsiriwa “Mungu” kama nomino inayolitambulisha zaidi.
- source_word: חֵן וְכָבוֹד
  choice: fadhili na heshima
  rationale: “Fadhili” huwasilisha kibali au wema unaotolewa, huku “heshima” ikifaa kwa hadhi anayopewa mtu. Maana mbadala “neema na utukufu” imehifadhiwa katika tanbihi.
- source_word: יִתֵּן
  choice: hutoa
  rationale: Kauli ya wakati usiotimilika hapa inaeleza tendo la kawaida au ukweli wa jumla; wakati wa sasa wa mazoea unafaa katika Kiswahili.
- source_word: לֹא יִמְנַע טוֹב
  choice: Hawanyimi jambo jema
  rationale: Kitenzi kimetafsiriwa kwa maana ya kutokizuia au kutokumnyima mtu kitu. “Jambo jema” huifanya טוֹב ya kivumishi kilichotumika kinomino ieleweke kiasili katika Kiswahili.
- source_word: לַהֹלְכִים בְּתָמִים
  choice: wale wanaoishi kwa unyofu
  rationale: הלך katika muktadha wa maadili huelekeza kwa mwenendo wa maisha. “Kuishi kwa unyofu” ni Kiswahili cha asili kinachobeba wazo la uadilifu na ukamilifu wa nia bila kudai kutokuwa na dhambi kabisa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Jina la agano limehifadhiwa kama jina maalumu “Yahweh,” badala ya kubadilishwa kuwa cheo.
- issue: Maana ya בְּתָמִים katika mwenendo wa waabudu
  choice: kwa unyofu
  alternative: kwa ukamilifu; bila lawama
  rationale: Neno linaashiria moyo mzima, uadilifu, au mwenendo usiolaumika; halilazimishi maana ya ukamilifu usio na dhambi. Tafsiri hii huepuka kusuluhisha mvutano huo kwa kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi wenye hadhi lakini unaoeleweka kwa urahisi. Mistari imepangwa kudumisha ulinganifu wa kishairi. Taswira za “jua” na “ngao” zimehifadhiwa, huku nahau ya Kiebrania ya ‘kutembea’ ikitolewa kwa Kiswahili cha kawaida “kuishi” ili maana ya mwenendo wa maisha iwe wazi.
