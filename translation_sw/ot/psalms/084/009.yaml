  yaml_path: translation/ot/psalms/084/009.yaml
  text: Look on our shield[a], O God[b], and look on the face of your anointed.
translation:
  language: sw
  text: 'Ee Mungu, itazame ngao yetu[a],

    na utazame uso wa mtiwa-mafuta wako.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlinzi wetu.” Kiebrania kinasema kihalisi “ngao yetu,” sitiari ya kishairi inayoweza kumaanisha Mungu kama mlinzi au mfalme.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “mtiwa-mafuta wako.” Neno hili ndilo chanzo cha cheo “Masihi”; hapa huenda kwanza linamhusu mfalme wa ukoo wa Daudi, huku likiwezekana kuwa na mwangwi mpana wa kimasihi.
    reason: alternative_reading
lexical_decisions:
- source_word: מָגִנֵּנוּ
  choice: ngao yetu
  rationale: Neno la Kiebrania linamaanisha kihalisi ngao na hapa ni sitiari ya kishairi inayoweza kumaanisha mlinzi au mfalme; taswira halisi imehifadhiwa bila kuamua rejeo lake.
- source_word: רְאֵה
  choice: uitazame
  rationale: Amri hii ni ombi Mungu aangalie kwa makini na kwa kibali, si kuona tu; “uitazame” ni ya kawaida na huhifadhi ombi hilo.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Hapa ni usemi wa moja kwa moja kwa Mungu; “Ee” huonyesha mwito kwa njia ya asili katika Kiswahili.
- source_word: וְהַבֵּט
  choice: na uutazame
  rationale: Kitenzi kinaonyesha kuelekeza macho kwa makini. Kurudia “utazame” huhifadhi usambamba wa kishairi na ni lugha ya asili kuliko kulazimisha tofauti ya visawe.
- source_word: פְּנֵי
  choice: uso wa
  rationale: Tafsiri halisi “uso wa” huhifadhi taswira ya Kiebrania pamoja na maana yake ya kimahusiano.
- source_word: מְשִׁיחֶךָ
  choice: mtiwa-mafuta wako
  rationale: Neno humaanisha mtu aliyetiwa mafuta, na katika muktadha huu huenda linamtaja kwanza mfalme wa ukoo wa Daudi. Tafsiri hii huepuka kulifanya moja kwa moja kuwa jina maalumu “Masihi.”
theological_decisions:
- issue: Rejeo la “ngao yetu”
  choice: Sitiari “ngao yetu” imehifadhiwa bila kubainisha ikiwa ni Mungu au mfalme.
  alternative: “mlinzi wetu,” au kulifasiri wazi kuwa linamtaja Mungu au mfalme
  rationale: Kiebrania kinaruhusu utata huo, na huenda kwa makusudi kinaweka “ngao yetu” sambamba na “mtiwa-mafuta wako.”
- issue: Rejeo la “mtiwa-mafuta wako”
  choice: Imetafsiriwa kama cheo cha kawaida, si jina maalumu.
  alternative: “Masihi wako”
  rationale: Katika mazingira ya karibu ya zaburi huenda usemi huu unamhusu mfalme wa Daudi aliyetiwa mafuta. “Masihi” katika matini kuu ingeweka wazi zaidi maana ya kimasihi kuliko Kiebrania kinavyodai, ingawa uhusiano wa kileksika unaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio umebadilishwa kidogo ili mwito “Ee Mungu” usomeke kwa kawaida, huku taswira, usambamba na utata wa Kiebrania vikihifadhiwa.
