base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/008.yaml
  text: They said in their hearts[b][a], “Let us destroy them all together.” They burned all the meeting places of God in the land.
translation:
  language: sw
  text: Walisema mioyoni mwao, “Tuwakandamize wote pamoja.”[a] Wakachoma moto mahali pote pa kukusanyikia kwa ajili ya Mungu nchini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania נִינָם ni gumu kueleweka; huenda maana yake ni “Tuwatiishe,” “Tuwaangamize,” au usemi mwingine wa nia ya uharibifu.
    reason: lexical_alternative
  - marker: b
    text: Au “mahali pote palipowekwa kwa ajili ya Mungu”; baadhi ya tafsiri za jadi husema “masinagogi yote ya Mungu.”
    reason: alternative_reading
lexical_decisions:
- source_word: אָמְרוּ
  choice: Walisema
  rationale: Kauli timilifu ya Kiebrania katika simulizi la kishairi inaelezwa kwa wakati uliopita wa Kiswahili.
- source_word: בְלִבָּם
  choice: mioyoni mwao
  rationale: Inahifadhi taswira ya nahau ya Kiebrania inayomaanisha usemi au azimio la ndani.
- source_word: נִינָם
  choice: Tuwakandamize
  rationale: Umbo hili ni gumu na maana yake haina uhakika; ‘kuwakandamiza’ linaonyesha azimio la uhasama bila kulifanya mahsusi zaidi kuliko ushahidi wa asili.
- source_word: יָחַד
  choice: wote pamoja
  rationale: ‘Pamoja’ ndiyo maana ya msingi, na ‘wote’ huonyesha nguvu ya ujumla inayodokezwa katika muktadha.
- source_word: שָׂרְפוּ
  choice: Wakateketeza
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la kuharibu kwa moto.
- source_word: כָּל מוֹעֲדֵי אֵל
  choice: mahali pote pa kukutania na Mungu
  rationale: Kwa kuwa vitu hivyo vinateketezwa na viko nchini, maana ya mahali pa mikutano ya ibada inafaa zaidi kuliko nyakati au sikukuu zilizowekwa; tafsiri hii pia huepuka anakronizimu ya ‘masinagogi.’
- source_word: בָּאָרֶץ
  choice: nchini
  rationale: Katika muktadha, neno hili linaelekea kumaanisha nchi husika, si dunia yote.
theological_decisions:
- issue: Maana ya מוֹעֲדֵי אֵל katika muktadha wa kuteketezwa
  choice: mahali pa kukutania na Mungu
  alternative: nyakati au sikukuu za Mungu zilizowekwa; masinagogi ya Mungu
  rationale: Kitenzi cha kuchoma na kishazi cha mahali vinaunga mkono maana ya maeneo halisi. ‘Na Mungu’ huhifadhi uhusiano wa maeneo hayo na ibada ya Mungu bila kuyatambulisha moja kwa moja kuwa masinagogi.
- issue: Tafsiri ya umbo gumu נִינָם
  choice: Tuwakandamize
  alternative: Tuwatiishe; Tuwaangamize; usomaji wa nomino wenye sintaksia tofauti
  rationale: Neno hili halina uhakika wa kileksika. Tafsiri iliyochaguliwa huwasilisha nia ya uhasama, huku tanbihi ikihifadhi uwezekano mwingine badala ya kutatua kimya kimya utata wa asili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mioyoni mwao’ huhifadhi picha ya asili, na tanbihi zimewekwa mara tu baada ya vifungu vinavyohusika.
