base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/000.yaml
  text: A Maskil of Asaph. Why[a], God, have you rejected us forever? Why does your anger smoke against the sheep of your pasture?
translation:
  language: sw
  text: Maskili ya Asafu.[a] Ee Mungu, kwa nini umetukataa milele? Kwa nini hasira yako inafuka moshi dhidi ya kondoo wa malisho yako?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Maskili” ni neno la kiufundi katika kichwa cha zaburi; huenda likamaanisha utenzi wa kutafakari au wa kufundisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Maskili
  rationale: Neno la kiufundi katika kichwa cha zaburi limetoholewa badala ya kufasiriwa kwa uhakika usiokuwapo; maana yake kamili haijulikani.
- source_word: זָנַחְתָּ
  choice: umetukataa
  rationale: Kitenzi kina maana ya kukataa au kuacha; ‘umetukataa’ ni cha kawaida na kinahifadhi uzito wa kilio.
- source_word: יֶעְשַׁן אַפְּךָ
  choice: hasira yako inafuka moshi
  rationale: Tafsiri hii inadumisha taswira halisi ya Kiebrania ya hasira inayofuka moshi.
- source_word: צֹאן מַרְעִיתֶךָ
  choice: kondoo wa malisho yako
  rationale: Inahifadhi sitiari ya watu wa Mungu kuwa kundi analolilisha na kulitunza.
theological_decisions:
- issue: Uhusiano wa kichwa ‘ya Asafu’
  choice: ya Asafu
  alternative: iliyotungwa na Asafu
  rationale: Kihusishi לְ kinaweza kuonyesha utunzi, uhusiano, wakfu, au mkusanyo; ‘ya Asafu’ kinahifadhi utata huo.
- issue: Mhusika aliyekataliwa
  choice: umetukataa
  alternative: umewakataa kondoo wako
  rationale: Kiambishi cha nafsi ya kwanza wingi kinadokezwa na muktadha ingawa hakijaandikwa kama kiambishi cha yambwa katika kitenzi; tafsiri hii hufuata maana ya kilio bila kuwafanya ‘kondoo’ kuwa yambwa wa moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Taswira ya moshi na kondoo imehifadhiwa, na istilahi isiyo na maana hakika ‘Maskili’ imefafanuliwa katika tanbihi.
