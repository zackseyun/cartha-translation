  text: Your adversaries roared in the midst of your appointed place[c][b][a]; they set up their own signs as signs.
translation:
  language: sw
  text: Adui zako walunguruma katikati ya mahali pako pa kukutania[a]; waliweka ishara zao kuwa ishara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katikati ya mahali pako palipowekwa.” Neno la Kiebrania מוֹעֵד linaweza kumaanisha mahali pa kukutania, kusanyiko, au wakati uliowekwa; hapa huenda linarejelea mahali patakatifu pa kukutania.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kinarudia neno “ishara”: kihalisi, “waliweka ishara zao kuwa ishara.” Huenda maana yake ni kwamba waliweka alama au bendera zao kama ishara za umiliki au ushindi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאֲגוּ
  choice: wamenguruma
  rationale: Kitenzi hiki hutumiwa hasa kwa mngurumo wa simba na hapa kinaonyesha kelele kali na ya kutisha ya maadui; “wamenguruma” kinahifadhi picha hiyo.
- source_word: צֹרְרֶיךָ
  choice: watesi wako
  rationale: Neno linamaanisha wapinzani wenye uhasama. “Watesi” ni la kawaida na lenye uzito unaofaa katika muktadha wa shambulio dhidi ya mahali patakatifu.
- source_word: בְּקֶרֶב
  choice: katikati ya
  rationale: Kirai hiki kinaonyesha kuwa walikuwa ndani kabisa ya eneo hilo, si pembeni tu.
- source_word: מוֹעֲדֶךָ
  choice: mahali pako pa kukutania
  rationale: מוֹעֵד inaweza kumaanisha wakati uliowekwa, kusanyiko, au mahali pa kukutania. Muktadha wa kunajisiwa kwa patakatifu unapendelea maana ya mahali pa ibada ambapo Mungu hukutana na watu wake, huku tanbihi ikihifadhi upana wa neno.
- source_word: שָׂמוּ
  choice: wameweka
  rationale: Kitenzi שׂים humaanisha kuweka au kusimamisha. “Wameweka” ni cha asili na hakifafanui bila msingi kama ishara hizo zilisimamishwa kwa namna gani.
- source_word: אוֹתֹתָם אֹתוֹת
  choice: ishara zao kuwa ishara
  rationale: Tafsiri hii inadumisha urudiaji wa makusudi wa אֹות, ambao huenda unaonyesha kwamba maadui waliweka alama zao kama alama za umiliki au ushindi.
theological_decisions:
- issue: Maana ya מוֹעֵד katika ombolezo kuhusu kunajisiwa kwa patakatifu
  choice: 'maana ya mahali pa kidini: “mahali pako pa kukutania”'
  alternative: wakati wako uliowekwa; kusanyiko lako; mahali pako palipowekwa
  rationale: Mistari inayozunguka inaeleza maadui kuingia na kuharibu patakatifu, hivyo maana ya mahali inafaa zaidi. Hata hivyo, kwa kuwa neno la Kiebrania lina maana kadhaa, tanbihi inaonyesha uwezekano huo badala ya kuuficha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Wakati timilifu umetumiwa kuwasilisha tendo la simulizi lenye matokeo yanayoonekana katika mandhari ya ombolezo.
