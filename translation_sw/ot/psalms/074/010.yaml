  text: עַד מָתַ֣י אֱ֭לֹהִים יְחָ֣רֶף צָ֑ר יְנָ֘אֵ֤ץ אוֹיֵ֖ב שִׁמְ/ךָ֣ לָ/נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/010.yaml
  text: How long[a], O God, will the foe reproach? Will the enemy revile your name forever?
translation:
  language: sw
  text: Ee Mungu, mpinzani atakutukana mpaka lini? Je, adui atalidharau jina lako milele?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, adui atalikufuru jina lako milele?
    reason: Tofauti halali ya kimsamiati kwa יְנָאֵץ, ambayo katika muktadha wa Mungu inaweza kueleweka kuwa kukufuru.
lexical_decisions:
- source_word: עַד מָתַי
  choice: mpaka lini
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha swali la maombolezo kuhusu hali inayoendelea kwa muda mrefu.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Neno hili ni mwito wa moja kwa moja katika sala; “Ee Mungu” ni la asili na lenye heshima katika Kiswahili.
- source_word: יְחָרֶף
  choice: atakutukana
  rationale: Kitenzi hiki katika Piel huonyesha kumshutumu au kumtukana mtu kwa dharau. Kiambishi cha yambwa “-ku-” kinaonyesha kwamba Mungu ndiye anayelengwa, kama muktadha unavyodokeza.
- source_word: צָר
  choice: mpinzani
  rationale: Huwakilisha adui au hasimu. “Mpinzani” hutofautisha neno hili na אוֹיֵב katika mstari sambamba bila kupoteza uhusiano wao wa kimaana.
- source_word: יְנָאֵץ
  choice: atalidharau
  rationale: Katika Piel, kitenzi hiki huonyesha kulitendea jambo kwa dharau, hasa Mungu au jina lake. “Atalidharau” huhifadhi maana hiyo bila kulazimisha tafsiri maalumu zaidi ya kukufuru.
- source_word: אוֹיֵב
  choice: adui
  rationale: Hili ndilo neno la kawaida na la moja kwa moja la Kiswahili kwa adui, na linaendeleza usambamba na “mpinzani.”
- source_word: שִׁמְךָ
  choice: jina lako
  rationale: Tafsiri ya moja kwa moja huhifadhi maana pana ya jina la Mungu kuwa heshima, sifa na utambulisho wake uliofunuliwa.
- source_word: לָנֶצַח
  choice: milele
  rationale: Huwasilisha kwa kawaida wazo la muda usio na mwisho kama linavyoonekana katika kilio cha mtunga zaburi.
theological_decisions:
- issue: Kama kufafanua wazi kwamba kulidharau jina la Mungu ni kumkufuru Mungu mwenyewe
  choice: Kuhifadhi usemi halisi “jina lako” katika matini kuu
  alternative: Je, adui atakukufuru milele?
  rationale: Kiebrania kinataja wazi “jina lako.” Kulihifadhi hudumisha uzito wa kitheolojia wa jina la Mungu kama heshima na utambulisho wake bila kupunguza usemi huo kuwa ufafanuzi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wa heshima. Mpangilio wa swali la kwanza umefanywa wa kawaida katika Kiswahili, huku usambamba wa “mpinzani/adui” ukihifadhiwa.
