  text: אַתָּ֣ה רִ֭צַּצְתָּ רָאשֵׁ֣י לִוְיָתָ֑ן תִּתְּנֶ֥/נּוּ מַ֝אֲכָ֗ל לְ/עָ֣ם לְ/צִיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/014.yaml
  text: You crushed the heads of Leviathan[a]; you gave him as food for the creatures of the desert.
translation:
  language: sw
  text: Uliviponda vichwa vya Leviathani; ukamtoa kuwa chakula cha viumbe wa jangwani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “cha wakaaji wa jangwani” au “cha watu wa jangwani.” Neno la Kiebrania ni gumu na huenda likarejelea wakaaji au viumbe wa maeneo makavu.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִצַּצְתָּ
  choice: uliviponda
  rationale: Kitenzi רצץ kinaonyesha kuvunja au kuponda kwa nguvu. “Uliviponda” ni Kiswahili cha kawaida chenye uzito wa picha hiyo.
- source_word: רָאשֵׁי
  choice: vichwa vya
  rationale: Nomino ya Kiebrania iko katika wingi, hivyo wingi umehifadhiwa badala ya kuibadili kuwa kichwa kimoja.
- source_word: לִוְיָתָן
  choice: Leviathani
  rationale: Jina la picha ya kishairi limetoholewa badala ya kufasiriwa kuwa mnyama fulani, ili kuhifadhi uhusiano wake na matumizi mengine katika Maandiko.
- source_word: תִּתְּנֶנּוּ
  choice: ukamtoa
  rationale: Kitenzi נתן kwa kawaida humaanisha kutoa, na kiambishi chake kinamrejelea Leviathani katika umoja.
- source_word: מַאֲכָל
  choice: kuwa chakula
  rationale: מַאֲכָל humaanisha chakula; muundo “ukamtoa kuwa chakula” ni wa asili katika Kiswahili.
- source_word: לְעָם לְצִיִּים
  choice: cha watu wa jangwani
  rationale: Tafsiri hii inahifadhi neno עַם, “watu,” na kuelewa צִיִּים kuwa wakaaji wa maeneo makavu. Kwa kuwa neno la mwisho ni gumu na huenda likarejelea viumbe wa porini, uwezekano huo umewekwa katika tanbihi.
theological_decisions:
- issue: Asili ya picha ya Leviathani
  choice: Jina “Leviathani” limehifadhiwa kama picha ya kishairi ya ushindi wa Mungu bila kuamua kiumbe au mamlaka inayowakilishwa.
  alternative: Kulitafsiri moja kwa moja kuwa jitu la baharini, Misri, au nguvu za machafuko.
  rationale: Mstari wenyewe hautambulishi kwa ukamilifu kama Leviathani ni kiumbe halisi, ishara ya kimitholojia, au adui wa kihistoria; tafsiri haipaswi kuondoa utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Sentensi imehifadhi wingi wa “vichwa,” jina Leviathani, na utata wa kifungu cha mwisho kwa tanbihi.
