base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/013.yaml
  text: You split the sea by your strength[b][a]; you shattered the heads of the sea monsters on the waters.
translation:
  language: sw
  text: Wewe uliipasua bahari kwa nguvu zako[b]; uliviponda vichwa vya viumbe wakubwa wa baharini[a] juu ya maji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “majoka” au “viumbe wa kutisha wa baharini.” Neno la Kiebrania tanninim linaweza kumaanisha viumbe wakubwa wenye umbo la nyoka wanaohusishwa na maji.
    reason: lexical_alternative
  - marker: b
    text: Mstari huu huenda ukadokeza kwa pamoja ushindi wa Mungu juu ya bahari yenye machafuko katika picha ya kishairi na ukombozi wake wa kihistoria baharini wakati wa Kutoka.
    reason: cross_reference
lexical_decisions:
- source_word: פוֹרַרְתָּ
  choice: uliipasua
  rationale: Kitenzi hiki kina maana ya kuvunja vipande au kutenganisha kwa nguvu. Katika muktadha wa bahari, “uliipasua” ni Kiswahili cha kawaida chenye nguvu na kinahifadhi picha ya tendo la ghafla na la uamuzi.
- source_word: בְעָזְּךָ
  choice: kwa nguvu zako
  rationale: עֹז humaanisha nguvu au uweza, na kihusishi ב hapa kinaonyesha njia iliyotumiwa. “Kwa nguvu zako” ni usemi wa asili na ulio wazi.
- source_word: יָם
  choice: bahari
  rationale: Neno linamaanisha bahari. Kiswahili hakihitaji kibainishi kinacholingana na “the,” hivyo “bahari” linatosha na linaweza kuhusisha picha ya bahari ya machafuko pamoja na tukio la ukombozi katika historia.
- source_word: שִׁבַּרְתָּ
  choice: ulivunja-vunja
  rationale: שׁבר humaanisha kuvunja. Uradidi “vunja-vunja” unaonyesha kuvunjwa kabisa na kwa nguvu, na unafaa kwa ushairi huu.
- source_word: רָאשֵׁי
  choice: vichwa vya
  rationale: Hii ni nomino ya wingi katika hali ya muundo, na picha halisi ya “vichwa vya” inapaswa kuhifadhiwa badala ya kufasiriwa.
- source_word: תַנִּינִים
  choice: viumbe wa kutisha wa baharini
  rationale: תַנִּינִים linaweza kutaja viumbe wakubwa, wa mfano wa nyoka, wanaohusishwa na maji na machafuko. Usemi huu ni wazi kwa msomaji wa sasa na unahifadhi uzito wa picha bila kulazimisha tafsiri finyu ya “majoka” au “nyoka.”
- source_word: עַל הַמָּיִם
  choice: juu ya maji
  rationale: עַל kwa kawaida humaanisha “juu ya.” Tafsiri hii inahifadhi kihusishi na picha ya kishairi badala ya kuibadili kuwa “ndani ya maji.”
theological_decisions:
- issue: Asili ya picha ya bahari na tanninim
  choice: Kuhifadhi katika matini picha ya kishairi ya ushindi wa Mungu juu ya bahari na viumbe vya kutisha, bila kuifanya kuwa fumbo la kizushi pekee wala maelezo ya kihistoria pekee.
  alternative: Kuisoma kama dokezo la Kutoka na ushindi juu ya Misri pekee, au kama lugha ya mapambano dhidi ya machafuko ya kale pekee.
  rationale: Zaburi inaweza kutumia picha ya uumbaji na ushindi juu ya machafuko huku pia ikidokeza ukombozi wa kihistoria baharini. Tafsiri na tanbihi zinapaswa kuacha miangwi yote miwili isikike.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Uradidi “ulivunja-vunja” unaonyesha nguvu ya tendo bila kutumia lugha ya kizamani. Viashiria vya tanbihi [a] na [b] vimewekwa moja kwa moja baada ya maneno yanayohusika.
