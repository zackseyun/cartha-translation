  yaml_path: translation/ot/psalms/074/015.yaml
  text: You split open springs and wadis; you dried up ever-flowing rivers.
translation:
  language: sw
  text: Wewe ulipasua chemchemi na vijito; wewe ulikausha mito inayotiririka daima.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָקַעְתָּ
  choice: ulipasua
  rationale: Huhifadhi maana ya kupasua au kufungua kwa nguvu, huku ikipatana na taswira ya Mungu kufungua vyanzo vya maji.
- source_word: מַעְיָן
  choice: chemchemi
  rationale: Neno hili humaanisha chanzo au chemchemi ya maji.
- source_word: נָחַל
  choice: vijito
  rationale: Katika muktadha huu ni mikondo ya maji; 'vijito' ni ya kawaida na inaeleweka kuliko istilahi ya kijiografia 'wadi', huku ikiacha wazi iwapo mikondo hiyo ni ya kudumu au ya msimu.
- source_word: הוֹבַשְׁתָּ
  choice: ulikausha
  rationale: Huwasilisha moja kwa moja tendo la kusababisha maji yakauke.
- source_word: נַהֲרוֹת אֵיתָן
  choice: mito inayotiririka daima
  rationale: אֵיתָן hapa yaelekea kueleza mito yenye mtiririko wa kudumu au usiokoma; tafsiri hii hutoa maana hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uhusiano wa matendo mawili yanayoonekana kuwa kinyume—kufungua maji na kuyakausha
  choice: Yamehifadhiwa sambamba bila kuyaeleza zaidi
  alternative: Kuyahusisha wazi na matukio mahususi kama mwamba jangwani na kuvuka Bahari ya Shamu au Yordani
  rationale: Mstari wenyewe hautaji matukio hayo moja kwa moja; kuyaongeza kungeondoa uwazi wa kishairi na kuingiza ufafanuzi wa nje.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Marudio ya 'Wewe ... wewe ...' yamehifadhiwa ili kuonyesha mkazo wa Kiebrania אַתָּה katika vipande vyote viwili.
