base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/019.yaml
  text: Do not give your dove to the ravenous beast; do not forget the lives of your afflicted ones forever.
translation:
  language: sw
  text: Usimkabidhi hua wako kwa mnyama mla nyama; usisahau milele uhai wa watu wako wanaoteseka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, maskini wako.
    reason: עֲנִיֶּיךָ linaweza kumaanisha watu wanaoteseka, walioonewa, au maskini.
lexical_decisions:
- source_word: חַיַּת (ya kwanza)
  choice: mnyama mkali
  rationale: Katika kishazi cha kwanza neno hili humaanisha mnyama wa porini anayewinda; “mnyama mkali” ni Kiswahili cha kawaida kinachobeba tishio hilo bila kuongeza aina maalumu ya mnyama.
- source_word: נֶפֶשׁ
  choice: uhai
  rationale: Hapa neno linamaanisha uhai wa hua unaotishiwa, si lazima nafsi kama sehemu tofauti ya mwanadamu.
- source_word: תּוֹרֶךָ
  choice: hua wako
  rationale: Taswira ya hua, inayowakilisha watu wa Mungu katika muktadha wa zaburi, imehifadhiwa bila kuifafanua moja kwa moja katika matini.
- source_word: חַיַּת (ya pili)
  choice: uhai
  rationale: Katika kishazi cha pili umbo lilelile linaeleweka kwa maana ya uhai, likitengeneza mchezo wa maana na kutofautiana na “mnyama” katika kishazi cha kwanza.
- source_word: עֲנִיֶּיךָ
  choice: watu wako wanaoteseka
  rationale: Neno linaweza kueleza walioonewa, waliotaabishwa, au maskini; chaguo hili linafaa muktadha wa watu wanaoshambuliwa huku tanbihi ikihifadhi maana mbadala.
- source_word: לָנֶצַח
  choice: milele
  rationale: Hutoa maana ya kutosahauliwa kamwe au kwa wakati wote.
theological_decisions:
- issue: Utambulisho wa “hua wako”
  choice: Taswira imeachwa kama “hua wako” bila kuongeza kwamba ni Israeli au watu wa Mungu.
  alternative: “watu wako walio kama hua”
  rationale: Zaburi inatumia sitiari moja kwa moja; kuitambulisha wazi kungeondoa nguvu ya kishairi na kuamua jambo ambalo mstari wenyewe huliacha katika taswira.
- issue: Umoja wa “uhai” pamoja na wingi wa watu wanaoteseka
  choice: “uhai wa watu wako wanaoteseka”
  alternative: “maisha ya watu wako wanaoteseka”
  rationale: Umoja wa pamoja unaakisi neno la Kiebrania na mwangwi wa “uhai” katika kishazi cha kwanza, bila kudai kwamba ni mtu mmoja tu anayezungumziwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sala ya kishairi na lugha ya moja kwa moja. Marudio ya “uhai” yamehifadhiwa ili kuunganisha vipande viwili vya mstari.
