  text: אַל יָשֹׁ֣ב דַּ֣ךְ נִכְלָ֑ם עָנִ֥י וְ֝/אֶבְי֗וֹן יְֽהַלְל֥וּ שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/021.yaml
  text: Do not let the oppressed turn back ashamed[b][a]; let the poor and needy praise your name.
translation:
  language: sw
  text: Usimwache aliyekandamizwa[a] arudi akiwa ameaibishwa[b]; maskini na wahitaji wasifu jina lako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliyevunjwa” au “aliyeonewa.”
    reason: lexical_alternative
  - marker: b
    text: Au “akiwa amefedheheshwa.” Kiebrania kinaweza kujumuisha maana ya kuaibishwa mbele ya watu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Usimwache
  rationale: Pamoja na kitenzi kinachofuata, chembe hii ya ukanushaji huonyesha ombi la kusihi; “usimwache” ni ya kawaida katika Kiswahili na huhifadhi maana ya “usiruhusu.”
- source_word: יָשֹׁב
  choice: arudi
  rationale: Kitenzi שוב humaanisha kurudi au kugeuka na kurudi. “Arudi” ni fasiri ya moja kwa moja na ya kawaida katika muktadha huu.
- source_word: דַּךְ
  choice: aliyekandamizwa
  rationale: Neno hili humaanisha mtu aliyevunjwa, kuonewa, au kukandamizwa. “Aliyekandamizwa” huwasilisha kwa uwazi hali ya kuonewa bila kuifanya picha ya kuvunjwa iwe ya kimwili tu.
- source_word: נִכְלָם
  choice: akiwa ameaibishwa
  rationale: Umbo hili linaonyesha kutiwa aibu au kufedheheshwa. “Akiwa ameaibishwa” huhifadhi hali ya kutendewa na linaendana kiasili na kurudi.
- source_word: עָנִי
  choice: maskini
  rationale: Ingawa neno linaweza kumaanisha mwenye taabu au mnyenyekevu, kuambatana kwake na אֶבְיוֹן kunafanya maana ya umaskini na dhiki ionekane zaidi.
- source_word: אֶבְיוֹן
  choice: wahitaji
  rationale: Neno hili humaanisha wenye uhitaji au hohehahe. “Wahitaji” hulitofautisha na עָנִי huku likihifadhi jozi ya maneno ya Kiebrania.
- source_word: יְהַלְלוּ
  choice: walisifu
  rationale: Ni ombi lenye nguvu ya hali ya kutakia au kusihi. Katika mfuatano huu, “walisifu” huonyesha ombi kwamba hao watu walisifu, bila kuongeza wazi uhusiano wa sababu ambao haujasemwa moja kwa moja.
- source_word: שְׁמֶךָ
  choice: jina lako
  rationale: Usemi huu muhimu humrejelea Mungu kama alivyojifunua, tabia yake, na sifa yake. “Jina lako” ni wa kawaida na hauhitaji kufafanuliwa kwa maneno mengine.
theological_decisions:
- issue: Uhusiano wa kishazi cha mwisho na ombi la kwanza
  choice: 'Kishazi cha mwisho kimehifadhiwa kama ombi sambamba: maskini na wahitaji walisifu jina la Mungu.'
  alternative: Kukifasiri wazi kuwa wokovu wa Mungu utasababisha maskini na wahitaji walisifu jina lake.
  rationale: Mfuatano wa vitenzi vya kusihi unaunga mkono ombi hilo, lakini Kiebrania hakitamki kiunganishi cha sababu. Fasiri haiongezi “ili” au “ndipo,” hivyo inadumisha uwezekano kwamba sifa ni matokeo yanayotarajiwa bila kuufanya uhusiano huo kuwa wa lazima.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sala ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Umoja wa “aliyekandamizwa” umehifadhiwa, huku “maskini na wahitaji” ikifuata maana ya makundi ya watu iliyoonyeshwa na kitenzi cha wingi cha Kiebrania.
