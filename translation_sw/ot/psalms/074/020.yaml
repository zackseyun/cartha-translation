  text: הַבֵּ֥ט לַ/בְּרִ֑ית כִּ֥י מָלְא֥וּ מַחֲשַׁכֵּי אֶ֝֗רֶץ נְא֣וֹת חָמָֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/020.yaml
  text: Look to the covenant[c][b][a], for the dark places of the land are full of haunts of violence.
translation:
  language: sw
  text: Tazama agano[a], kwa maana maeneo yenye giza ya nchi[b] yamejaa makao ya jeuri[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “agano lako.” Kiebrania kinasema “agano,” lakini muktadha unaonyesha agano la Mungu na watu wake.
    reason: alternative_reading
  - marker: b
    text: Au “dunia.” Neno la Kiebrania linaweza kumaanisha nchi au dunia kulingana na muktadha.
    reason: lexical_alternative
  - marker: c
    text: Au “makazi ya jeuri” au “maskani za ukatili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֵּט
  choice: Liangalie
  rationale: Kitenzi cha amri kinamwomba Mungu alielekezee agano uangalifu wake; “liangalie” huhifadhi taswira ya Kiebrania na sauti ya ombi.
- source_word: לַבְּרִית
  choice: agano
  rationale: Nomino hii humaanisha agano. Kiebrania kina kibainishi lakini hakina kiambishi cha umilikaji, kwa hiyo tafsiri kuu haiongezi “lako.”
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu inayotolewa ili kuunga mkono ombi lililotangulia.
- source_word: מָלְאוּ
  choice: yamejaa
  rationale: Kauli timilifu inaeleza hali iliyopo ya kujaa; “yamejaa” ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: מַחֲשַׁכֵּי אֶרֶץ
  choice: maeneo yenye giza ya nchi
  rationale: Huhifadhi wingi na maana halisi ya maeneo ya giza; katika muktadha wa maombolezo kuhusu Sayuni, “nchi” inafaa, ingawa אֶרֶץ pia inaweza kumaanisha dunia.
- source_word: נְאוֹת
  choice: makao
  rationale: Neno linaweza kumaanisha mahali pa kukaa au makazi; hapa linaonyesha sehemu zinazohusishwa na ukatili bila kufafanua kupita kiasi ni nani anayekaa humo.
- source_word: חָמָס
  choice: ukatili
  rationale: Neno hili huonyesha jeuri au udhalimu wenye madhara. “Ukatili” linaungana kwa kawaida na “makao” na kuhifadhi wazo la uovu wa kijeuri.
theological_decisions:
- issue: Kama agano lielezwe wazi kuwa ni la Mungu
  choice: agano
  alternative: agano lako
  rationale: Kiebrania kinasema “agano” lenye kibainishi bila kiambishi cha umilikaji. Muktadha unaonyesha kuwa ni agano la Mungu na watu wake, lakini tafsiri kuu haiingizi umilikaji ambao haukutajwa wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye sauti ya sala iliyo ya heshima lakini inayoeleweka kwa urahisi. Mpangilio wa sentensi na taswira kuu za Kiebrania zimehifadhiwa, huku sintaksia ikiwa ya kawaida katika Kiswahili.
