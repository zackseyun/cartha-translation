  verdict: revise
  source_fidelity: The verse structure and causal relation are preserved. However, חָמָס is more directly ‘violence/violent injustice’ than ‘cruelty’; ‘jeuri’ is the closer ordinary Swahili equivalent in this context.
  naturalness: ‘Tazama agano’ is a more idiomatic and direct prayerful appeal in Standard East African Swahili than the object-prefixed ‘Liangalie agano.’ The remaining phrasing is clear and suitably elevated.
  terminology: ‘Agano,’ ‘nchi,’ and ‘maeneo yenye giza’ appropriately retain the Hebrew wording and its land/earth ambiguity. ‘Makao ya jeuri’ better represents נְאוֹת חָמָס without specifying the occupants or adding interpretation.
  issues:
  - severity: medium
    issue: ‘ukatili’ for חָמָס
    rationale: Ukatili primarily denotes cruelty or brutality. In this collocation, חָמָס denotes violence, violent wrongdoing, or oppression; ‘jeuri’ more closely retains the core sense.
  - severity: low
    issue: ‘Liangalie agano’ is marked word order
    rationale: It is grammatically possible, but ‘Tazama agano’ is more natural as a direct petition while conveying the imperative הַבֵּט.
