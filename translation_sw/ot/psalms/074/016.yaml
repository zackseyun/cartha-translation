  yaml_path: translation/ot/psalms/074/016.yaml
  text: The day is yours; the night also is yours[a]. You established the light and the sun.
translation:
  language: sw
  text: Mchana ni wako; usiku pia ni wako. Wewe uliweka imara nuru[a] na jua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kianga”; wengine huelewa neno hili kuwa mwezi kwa sababu ya ulinganifu wa mchana na usiku, lakini maandishi ya Kiebrania hayasemi wazi “mwezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ
  choice: ni wako
  rationale: Kiambishi cha nafsi ya pili umoja pamoja na לְ kinaonyesha umilikaji; “ni wako” ni Kiswahili cha kawaida na kinadumisha msisitizo wa kurudiwa.
- source_word: יוֹם
  choice: mchana
  rationale: Katika ulinganisho wa moja kwa moja na “usiku,” “mchana” huonyesha kipindi cha nuru kwa uwazi kuliko “siku,” ambalo pia linaweza kumaanisha muda wa saa ishirini na nne.
- source_word: אַף
  choice: pia
  rationale: 'Neno hili linaongeza kishazi cha pili kwa msisitizo: si mchana tu, bali usiku pia.'
- source_word: לָיְלָה
  choice: usiku
  rationale: Hili ndilo neno la kawaida la Kiswahili linalolingana na mchana katika ubeti huu.
- source_word: אַתָּה
  choice: Wewe
  rationale: Kiwakilishi kilicho wazi katika Kiebrania kimehifadhiwa ili kuonyesha msisitizo kabla ya kitenzi.
- source_word: הֲכִינוֹתָ
  choice: uliiweka imara
  rationale: Hifili ya כון ina maana ya kusimamisha, kuthibitisha, au kuweka kitu mahali pake; usemi huu unafaa muktadha wa Mungu kupanga ulimwengu.
- source_word: מָאוֹר
  choice: nuru
  rationale: Neno linaweza kumaanisha nuru au kitu kinachotoa nuru. “Nuru” hudumisha tofauti yake na jua linalotajwa baadaye bila kulifanya kimyakimya kuwa mwezi.
- source_word: וָשָׁמֶשׁ
  choice: na jua
  rationale: Tafsiri ya moja kwa moja ya kiunganishi na nomino, kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya מָאוֹר kuhusiana na שֶׁמֶשׁ
  choice: Kutafsiri מָאוֹר kuwa “nuru” na kuitofautisha na “jua.”
  alternative: Kutafsiri kuwa “mwezi” kwa kuhitimisha kutokana na ulinganifu wa mchana/usiku, au kuwa “kianga.”
  rationale: Kiebrania hakisemi wazi “mwezi.” “Nuru” huhifadhi wigo wa maana wa neno na taswira ya kishairi bila kutatua kimyakimya utata wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mchana” umetumiwa badala ya “siku” ili kuonyesha kwa uwazi ulinganifu wake na “usiku.”
