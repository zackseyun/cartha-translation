  text: אַתָּ֣ה הִ֭צַּבְתָּ כָּל גְּבוּל֣וֹת אָ֑רֶץ קַ֥יִץ וָ֝/חֹ֗רֶף אַתָּ֥ה יְצַרְתָּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/017.yaml
  text: You established all the boundaries of the earth[b][a]; summer and winter—you formed them.
translation:
  language: sw
  text: Wewe uliweka mipaka yote ya dunia; majira ya joto na majira ya baridi, wewe uliyaunda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uliyafinyanga.” Kiambishi “-ya-” kinarejelea majira ya joto na majira ya baridi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִצַּבְתָּ
  choice: uliweka
  rationale: Hifili ya נצב ina maana ya kusimamisha au kuweka mahali pake. “Uliweka” ni Kiswahili cha kawaida na chenye hadhi kinachoeleza tendo la Mungu la kuipangia dunia mipaka.
- source_word: כָּל גְּבוּלוֹת אָרֶץ
  choice: mipaka yote ya dunia
  rationale: גְּבוּלוֹת ni mipaka, na muktadha wa majira unaonyesha mpangilio wa ulimwengu, si mipaka ya kisiasa ya nchi.
- source_word: קַיִץ וָחֹרֶף
  choice: majira ya joto na majira ya baridi
  rationale: Haya ni majina ya kawaida ya misimu inayotajwa kwa jozi. Kurudia “majira ya” kunafanya maana iwe wazi na ya asili katika Kiswahili.
- source_word: יְצַרְתָּם
  choice: uliyaumba
  rationale: יצר humaanisha kufinyanga, kuunda, au kuumba. Kiambishi “-ya-” kinarejelea majira hayo mawili, kama kiambishi cha wingi katika Kiebrania.
- source_word: אַתָּה ... אַתָּה
  choice: Wewe ... wewe
  rationale: Kurudia kiwakilishi kunahifadhi msisitizo wa Kiebrania juu ya Mungu kuwa mtendaji katika vifungu vyote viwili.
theological_decisions:
- issue: Maana ya “mipaka ya dunia” katika lugha ya uumbaji
  choice: Kauli ya ulimwengu mzima kuhusu Mungu kuupangia dunia mipaka
  alternative: Mipaka ya maeneo, nchi, au mataifa
  rationale: Kutajwa kwa majira ya joto na baridi kunaweka mstari katika muktadha wa utaratibu wa uumbaji, badala ya jiografia ya kisiasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wewe” imerudiwa kwa kusudi ili kuhifadhi msisitizo wa maandishi ya Kiebrania; “dunia” na “majira” huonyesha muktadha wa utaratibu wa uumbaji.
