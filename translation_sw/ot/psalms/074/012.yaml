  text: וֵ֭/אלֹהִים מַלְכִּ֣/י מִ/קֶּ֑דֶם פֹּעֵ֥ל יְ֝שׁוּע֗וֹת בְּ/קֶ֣רֶב הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/012.yaml
  text: Yet God is my King from of old[a], working acts of salvation in the midst of the earth.
translation:
  language: sw
  text: Lakini Mungu ni Mfalme wangu tangu zamani; hutenda matendo ya wokovu katikati ya dunia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nchi.” Neno la Kiebrania linaweza kumaanisha dunia yote au nchi fulani.
