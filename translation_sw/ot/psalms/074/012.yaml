lexical_decisions:
- source_word: וֵאלֹהִים
  choice: Lakini Mungu
  rationale: Kiunganishi וְ kinaeleweka hapa kwa maana ya kupinga, kikilinganisha uharibifu unaoelezwa na imani ya kudumu kwa Mungu.
- source_word: מַלְכִּי
  choice: Mfalme wangu
  rationale: Nomino yenye kiambishi cha nafsi ya kwanza umoja humaanisha moja kwa moja ‘Mfalme wangu’ na hapa inamtaja Mungu.
- source_word: מִקֶּדֶם
  choice: tangu zamani
  rationale: Kirai hiki huonyesha wakati wa kale au hali iliyodumu kwa muda mrefu bila kulazimisha maana ya mwanzo kabisa.
- source_word: פֹּעֵל
  choice: atendaye
  rationale: Kauli ya hali inayoendelea humwonyesha Mungu kama mwenye kutenda kwa tabia au kwa mwendelezo; ‘atendaye’ hudumisha mtindo wa kishairi.
- source_word: יְשׁוּעוֹת
  choice: matendo ya wokovu
  rationale: Wingi wa nomino hii huonyesha matukio mengi ya kuokoa; ‘matendo ya wokovu’ ni Kiswahili cha kawaida kinachohifadhi wingi na uzito wa kiteolojia.
- source_word: בְּקֶרֶב
  choice: katikati ya
  rationale: Huhifadhi maana ya kuwa ndani au katikati ya eneo linalotajwa.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: אֶרֶץ inaweza kumaanisha dunia au nchi; ‘dunia’ inafaa kwa dai pana kuhusu matendo ya Mungu, huku maana nyingine ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Upeo wa matendo ya Mungu ya wokovu
  choice: dunia
  alternative: nchi
  rationale: Neno la Kiebrania אֶרֶץ linaweza kutaja dunia yote au nchi fulani. Muktadha mpana wa ufalme na matendo makuu ya Mungu unaunga mkono ‘dunia,’ lakini utata halisi umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki chenye mtindo wa kishairi na wenye heshima. ‘Atendaye’ na ‘tangu zamani’ ni vya kawaida lakini vinadumisha hadhi ya zaburi; alama ya tanbihi imewekwa baada ya ‘dunia’ ili ihusiane wazi na neno lenye utata.
