  text: Do not forget the voice of your enemies[a], the uproar of those who rise against you[b], which goes up continually.
translation:
  language: sw
  text: Usisahau sauti ya adui zako[a]; kelele za wanaokuinukia hupanda daima.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlio wa adui zako.” Neno la Kiebrania linaweza kumaanisha sauti au mlio kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au, “kelele za wanaokuinukia zinazopanda daima.” Kiebrania kina muundo mfupi ambao unaweza kutafsiriwa kwa namna hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁכַּח
  choice: Usiisahau
  rationale: Kauli ya ombi au katazo kwa Mungu, yenye maana ya moja kwa moja ‘usiisahau’; umoja wa ‘sauti’ unahitaji kiambishi ‘-i-’ katika Kiswahili.
- source_word: קוֹל
  choice: sauti
  rationale: ‘Sauti’ huhifadhi upana wa neno la Kiebrania qol, ambalo linaweza kumaanisha sauti ya kiumbe au mlio.
- source_word: צֹרְרֶיךָ
  choice: adui zako
  rationale: Tafsiri ya kawaida na ya moja kwa moja ya wingi unaowataja wale wenye uhasama na Mungu.
- source_word: שְׁאוֹן
  choice: makelele
  rationale: Neno hili linaeleza kelele nyingi na vurugu; ‘makelele’ ni la asili na linaloeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: קָמֶיךָ
  choice: wanaokuinukia
  rationale: Huhifadhi taswira ya kitenzi קום, yaani watu wanaoinuka dhidi ya Mungu, bila kuibadili tu kuwa jina ‘wapinzani.’
- source_word: עֹלֶה
  choice: yanazidi kupanda
  rationale: ‘Kupanda’ huhifadhi picha ya kelele zinazopaa, na ‘yanazidi’ pamoja na ‘daima’ huwasilisha mwendelezo wa tendo hilo kwa Kiswahili cha kawaida.
- source_word: תָמִיד
  choice: daima
  rationale: Huonyesha kwamba makelele hayo yanaendelea bila kukoma.
