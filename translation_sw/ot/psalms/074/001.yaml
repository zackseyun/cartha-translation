  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: מַשְׂכִּ֗יל לְ/אָ֫סָ֥ף לָ/מָ֣ה אֱ֭לֹהִים זָנַ֣חְתָּ לָ/נֶ֑צַח יֶעְשַׁ֥ן אַ֝פְּ/ךָ֗ בְּ/צֹ֣אן מַרְעִיתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/001.yaml
  text: A Maskil of Asaph. Why[a], O God, have you rejected us forever? Why does your anger smoke against the sheep of your pasture?
translation:
  language: sw
  text: Maskili ya Asafu.[a] Ee Mungu, kwa nini umetukataa milele? Kwa nini hasira yako inafuka moshi dhidi ya kondoo wa malisho yako?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Maskili” ni istilahi ya kiufundi katika kichwa cha zaburi; huenda ikamaanisha utungo wa kutafakari au wa kufundisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Maskili
  rationale: Ni istilahi ya kiufundi katika kichwa cha zaburi ambayo maana yake kamili haijulikani kwa hakika. Kuihamisha kwa sauti huepuka kuifasiri kupita kiasi; maelezo yanawekwa katika tanbihi.
- source_word: לְאָסָף
  choice: ya Asafu
  rationale: Kiambishi ל katika vichwa vya zaburi kinaweza kuonyesha uandishi, uhusiano, au wakfu. “Ya Asafu” ni ya asili katika Kiswahili na inadumisha kutobainika huko.
- source_word: לָמָה
  choice: kwa nini
  rationale: Hili ni swali la moja kwa moja linalofaa mtindo wa maombolezo.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Muktadha unaonyesha wazi kuwa Mungu anaitwa moja kwa moja katika sala.
- source_word: זָנַחְתָּ
  choice: umetukataa
  rationale: Kitenzi kina maana ya kukataa au kutupilia mbali. “Umetukataa” ni wazi, cha sasa, na kinadumisha nguvu ya ombolezo la jumuiya.
- source_word: לָנֶצַח
  choice: milele
  rationale: Katika ombolezo, neno hili huonyesha muda unaodhaniwa kuwa hauna mwisho; “milele” ni fupi na lenye nguvu.
- source_word: יֶעְשַׁן
  choice: inafuka moshi
  rationale: Kitenzi kinarejelea kufuka moshi. Usemi huu unahifadhi taswira halisi ya Kiebrania badala ya kuirahisisha kuwa kuwaka.
- source_word: אַפְּךָ
  choice: hasira yako
  rationale: Ingawa neno la msingi linaweza kumaanisha pua au tundu la pua, hapa ni nahau ya hasira. Tafsiri hii huwasilisha maana huku taswira ya moshi ikihifadhiwa.
- source_word: בְּצֹאן
  choice: dhidi ya kondoo
  rationale: “Kondoo” huhifadhi taswira halisi ya kichungaji, na “dhidi ya” huonyesha mwelekeo wa uhasama wa hasira.
- source_word: מַרְעִיתֶךָ
  choice: malisho yako
  rationale: Neno humaanisha mahali pa kulishia. “Kondoo wa malisho yako” ni usemi wa kueleweka unaohifadhi sitiari ya Mungu kama mchungaji.
theological_decisions:
- issue: Yambwa ya nafsi ya kwanza wingi katika זָנַחְתָּ
  choice: umetukataa
  alternative: umewakataa [watu wako]
  rationale: Usomaji wa kimapokeo wa maandishi na muktadha wa ombolezo la jumuiya unaonyesha yambwa “sisi.” Kutafsiri “-tu-” kunatoa maana ya chanzo bila kuongeza maelezo ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya hasira inayofuka moshi na ya kondoo wa malisho imehifadhiwa. Kichwa na mstari vimetenganishwa kwa alama ya sentensi, na alama ya tanbihi imewekwa mara moja katika matini kuu.
