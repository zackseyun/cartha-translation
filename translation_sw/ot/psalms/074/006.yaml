  text: And now they smash all its carved work together with hatchet and hammers[a][b].
translation:
  language: sw
  text: Na sasa wanazivunja nakshi zake zote kwa shoka na nyundo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa shoka na vifaa vya kupigia.” Majina ya Kiebrania yanataja vifaa maalumu vya kukatia na kupigia, lakini vifaa vya kisasa vinavyolingana navyo kwa usahihi havijulikani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַת
  choice: Na sasa
  rationale: Muunganiko huu unaendeleza simulizi huku ukihamisha mtazamo kwenye uharibifu unaotendeka sasa.
- source_word: פִּתּוּחֶיהָ
  choice: nakshi zake
  rationale: Neno hili linamaanisha kazi za mapambo zilizochongwa; wingi wa Kiswahili unaeleza vizuri mapambo hayo ya mahali patakatifu.
- source_word: יַחַד
  choice: zote
  rationale: Katika muktadha huu, kielezi hiki kinaonyesha ujumla wa nakshi zinazoharibiwa. 'Zote' ni ya kawaida na huepuka utata ambao 'pamoja' ingeweza kuleta karibu na kirai cha vifaa.
- source_word: בְּכַשִּׁיל
  choice: kwa shoka
  rationale: Neno la Kiebrania linataja kifaa cha kukatia au kuchongea mbao; 'shoka' ni neno linaloeleweka kwa urahisi, ingawa aina kamili ya kifaa haijulikani kwa hakika.
- source_word: וְכֵילַפּוֹת
  choice: na nyundo
  rationale: Neno hili linamaanisha vifaa vya kupigia. 'Nyundo' huhifadhi wingi wa maana na inafaa katika tukio la kuvunja nakshi.
- source_word: יַהֲלֹמוּן
  choice: wanazivunja
  rationale: Kitenzi humaanisha kupiga kwa nguvu; katika muktadha huu matokeo ni uharibifu, hivyo 'wanazivunja' ni ya asili na hudumisha nguvu ya tendo.
