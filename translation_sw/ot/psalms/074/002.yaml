  verdict: revise
  source_fidelity: The draft accurately renders the imperative, the covenantal acquisition/redemption language, and the likely people-group sense of שֵׁבֶט. However, “ulilolikomboa liwe kabila” introduces a purposive/resultative sense (“redeemed ... to become”) absent from the Hebrew. The demonstrative זֶה should remain explicitly connected to Mount Zion.
  naturalness: The revised wording removes the awkward and misleading “liwe,” while retaining clear, elevated Standard East African Swahili. “Ambamo ulikaa” is a natural formal rendering for Zion as the place in which God dwelt.
  terminology: “Kusanyiko,” “ulilojipatia,” “ulikomboa,” “kabila la urithi wako,” and “Mlima Sayuni” are appropriate. The lexical-alternative notes are retained, but their anchors are moved to the words they actually explain.
  issues:
