  text: זְכֹ֤ר עֲדָתְ/ךָ֨ קָ֘נִ֤יתָ קֶּ֗דֶם גָּ֭אַלְתָּ שֵׁ֣בֶט נַחֲלָתֶ֑/ךָ הַר צִ֝יּ֗וֹן זֶ֤ה שָׁכַ֬נְתָּ בּֽ/וֹ׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/002.yaml
  text: Remember your congregation[a], which you acquired long ago, which you redeemed as the tribe of your inheritance—Mount Zion[d][c][b], this mountain where you dwelled.
translation:
  language: sw
  text: Likumbuke kusanyiko lako ulilojipatia[a] zamani za kale, kabila la urithi wako ulilolikomboa—Mlima Sayuni huu, ambamo ulikaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ulilojipatia” pia inaweza kutafsiriwa “ulilolinunua” au, kwa uwezekano mdogo hapa, “uliloliumba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Likumbuke
  rationale: Kauli ya amri ya moja kwa moja kwa Mungu; umbo lenye kiambishi cha yambwa linarejelea kusanyiko kwa Kiswahili cha kawaida.
- source_word: עֲדָתְךָ
  choice: kusanyiko lako
  rationale: Huwakilisha jamii ya watu waliokusanyika bila kulifungamanisha neno hilo na dhehebu fulani.
- source_word: קָנִיתָ
  choice: ulilojipatia
  rationale: Huhifadhi wazo la Mungu kuwafanya watu hao kuwa mali yake bila kulazimisha maana ya biashara ya 'kununua' au maana ya 'kuumba'.
- source_word: קֶדֶם
  choice: zamani za kale
  rationale: Ni usemi wa asili unaoonyesha wakati wa mbali sana uliopita.
- source_word: גָּאַלְתָּ
  choice: ulilolikomboa
  rationale: Huhifadhi maana nzito ya ukombozi wa watu wa agano.
- source_word: שֵׁבֶט נַחֲלָתֶךָ
  choice: kabila la urithi wako
  rationale: Katika usambamba na kusanyiko lililokombolewa, 'kabila' linafaa kuliko 'fimbo' au 'fimbo ya kifalme', huku 'urithi wako' kikihifadhi lugha ya milki ya Mungu.
- source_word: הַר צִיּוֹן
  choice: Mlima Sayuni
  rationale: Hili ndilo umbo sanifu na linaloeleweka la jina la mahali katika Kiswahili.
- source_word: זֶה
  choice: huu
  rationale: Kiwakilishi kimehifadhiwa ili kuonyesha kwa msisitizo Mlima Sayuni kama mahali panaporejelewa.
- source_word: שָׁכַנְתָּ בוֹ
  choice: ambako ulikaa
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la Mungu kukaa mahali hapo, huku ikihifadhi rejeo la tendo lililotimia.
theological_decisions:
- issue: Ikiwa קָנִיתָ idokeze kuumba au kuwafanya Israeli kuwa milki ya Mungu
  choice: kuwafanya watu hao kuwa milki yake kwa kuwajipatia
  alternative: kuwaumba
  rationale: Usambamba wa karibu na 'ulikomboa' na yambwa 'kusanyiko lako' unaelekeza kwenye tendo la kihistoria la Mungu kuwafanya Israeli watu wake, si uumbaji wao.
- issue: Ikiwa שֵׁבֶט itafsiriwe kama kabila au kama fimbo/fimbo ya kifalme
  choice: kabila
  alternative: fimbo au fimbo ya kifalme
  rationale: Muktadha unahusu kusanyiko la watu waliokombolewa, hivyo maana ya kundi la watu ndiyo inayolingana zaidi; maana nyingine imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi unafuata mwendo wa ombi la Kiebrania na huhifadhi kiwakilishi 'huu' kinachorejelea Mlima Sayuni.
