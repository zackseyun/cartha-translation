    rationale: גָּאַלְתָּ governs “the tribe of your inheritance”; it does not express purpose or result. Removing “liwe” preserves the appositional identification of the congregation as God’s redeemed tribal possession.
  - severity: low
    issue: Footnote a is anchored after “zamani za kale,” although its content explains “ulilojipatia.”
    rationale: A footnote marker should immediately follow the lexical item whose alternatives it provides. Footnote b is likewise best placed directly after “kabila la urithi wako.”
