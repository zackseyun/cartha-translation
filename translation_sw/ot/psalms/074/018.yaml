  text: זְכָר זֹ֗את א֭וֹיֵב חֵרֵ֣ף יְהוָ֑ה וְ/עַ֥ם נָ֝בָ֗ל נִֽאֲצ֥וּ שְׁמֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/018.yaml
  text: 'Remember this: the enemy has mocked Yahweh[c][b][a], and a foolish people have despised your name.'
translation:
  language: sw
  text: 'Kumbuka hili: adui amemdhihaki[a] Yahweh, na watu wapumbavu[b] wamelidharau jina lako.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “amemtukana” au “amemkejeli.”
    reason: lexical_alternative
  - marker: b
    text: Hapa “wapumbavu” lina maana ya kimaadili, si ya kukosa akili tu; linganisha “mpumbavu” katika Zaburi 14:1.
    reason: cross_reference
  - marker: c
    text: Au “wamelitendea jina lako kwa dharau”; huenda pia, “wamelikufuru jina lako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר
  choice: Kumbuka
  rationale: Ni amri ya moja kwa moja kwa Mungu katika lugha ya sala; inadumisha ombi la mtunga zaburi bila kuongeza maelezo.
- source_word: זֹאת
  choice: hili
  rationale: Kiwakilishi hiki kinarejelea jambo linalotajwa katika sentensi; “hili” ni cha kawaida na wazi katika Kiswahili.
- source_word: אוֹיֵב
  choice: adui
  rationale: Ingawa neno la Kiebrania liko katika umoja, hapa linaweza kumwakilisha adui kwa ujumla au kwa maana ya pamoja. Kiswahili “adui” kinahifadhi umoja huo.
- source_word: חֵרֵף
  choice: amemdhihaki
  rationale: Kitenzi kinaeleza shutuma au kejeli yenye dharau. “Amemdhihaki” ni cha asili katika Kiswahili cha sasa na kinaonyesha wazi tendo la kumfedhehesha Mungu kwa maneno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano la Mungu limetafsiriwa kwa kunukuu matamshi yake badala ya kulibadilisha kuwa cheo kama “BWANA.”
- source_word: וְעַם
  choice: na watu
  rationale: Neno עם humaanisha jamii au watu kwa maana ya pamoja. “Watu” linaendana kwa kawaida na kitenzi cha wingi נִאֲצוּ.
- source_word: נָבָל
  choice: wapumbavu
  rationale: Katika mashairi na fasihi ya hekima, neno hili mara nyingi huonyesha upumbavu wa kimaadili na kiroho, si ukosefu wa akili tu. Neno la msingi limehifadhiwa, huku tanbihi ikifafanua maana hiyo.
- source_word: נִאֲצוּ
  choice: wamelidharau
  rationale: Kitenzi kina maana ya kutendea kwa dharau, kukataa kwa kejeli, au kunena kwa kufuru. “Wamelidharau” kinahifadhi upana wa maana bila kulazimisha tafsiri maalumu zaidi.
- source_word: שְׁמֶךָ
  choice: jina lako
  rationale: Tafsiri ya moja kwa moja inadumisha usemi wa kibiblia, ambao unaweza kujumuisha sifa, utambulisho, na tabia iliyofunuliwa ya Mungu.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandiko ya Kiebrania yanatumia jina la pekee la Mungu, si cheo. “Yahweh” huhifadhi jina hilo kwa uwazi.
- issue: Maana ya kimaadili ya נָבָל
  choice: wapumbavu
  alternative: waovu au wasiomcha Mungu
  rationale: “Wapumbavu” huhifadhi taswira ya Kiebrania na uzito wake wa kimaadili bila kuongeza moja kwa moja kwamba watu hao ni waovu au hawamchi Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala ya zaburi. Mpito wa Kiebrania kutoka kumtaja Mungu kwa nafsi ya tatu (“Yahweh”) hadi kumsemesha kwa nafsi ya pili (“jina lako”) umehifadhiwa. Viambishi vya ngeli katika “wamelidharau jina lako” vimetumiwa kwa ufasaha wa Kiswahili.
