base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/007.yaml
  text: They set your sanctuary on fire[c][b][a]; they profaned the dwelling place of your name to the ground.
translation:
  language: sw
  text: Waliichoma moto patakatifu pako; waliyatia unajisi makao ya jina lako, wakiyashusha mpaka chini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno zaidi, “Walituma moto katika patakatifu pako.” Usemi wa Kiebrania unamaanisha kwamba waliichoma.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁלְחוּ בָאֵשׁ
  choice: waliiteketeza ... kwa moto
  rationale: Muungano wa kitenzi 'kutuma/kupeleka' na 'kwa moto' unaeleza kuchoma. 'Waliiteketeza ... kwa moto' ni Kiswahili cha kawaida kinachoonyesha uharibifu huo bila kuiga nahau ya Kiebrania neno kwa neno.
- source_word: מִקְדָּשֶׁךָ
  choice: patakatifu pako
  rationale: Neno hili humaanisha mahali patakatifu au patakatifu pa ibada. 'Patakatifu pako' huhifadhi maana pana bila kulibana mapema kuwa hekalu pekee.
- source_word: לָאָרֶץ
  choice: hadi chini
  rationale: Katika muktadha huu kirai hicho kinaonyesha kiwango cha kudhalilishwa au kuharibiwa kabisa. 'Hadi chini' kinaunganika kiasili na tendo linaloelezwa huku kikihifadhi taswira ya Kiebrania.
- source_word: חִלְּלוּ
  choice: walipatia unajisi
  rationale: Piel ya חלל hapa ni kukifanya kilicho kitakatifu kiwe najisi au kukivunjia utakatifu. 'Walipatia unajisi' linaonyesha wazi kinyume cha utakatifu.
- source_word: מִשְׁכַּן
  choice: makao
  rationale: Neno hili humaanisha mahali pa kukaa. 'Makao' huhifadhi taswira hiyo bila kuleta kimakosa maana ya kiufundi ya hema la kukutania.
- source_word: שְׁמֶךָ
  choice: ya jina lako
  rationale: Muundo wa 'makao ya jina lako' umehifadhiwa kwa sababu ni usemi muhimu kuhusu uwepo wa Mungu unaojulikana mahali alipopachagua.
theological_decisions:
- issue: Kutofautisha מִקְדָּשׁ na מִשְׁכַּן
  choice: '''patakatifu'' na ''makao'''
  alternative: '''hekalu'' na ''patakatifu'''
  rationale: 'Kiebrania kinatumia maneno mawili tofauti lakini yanayohusiana. Maneno tofauti ya Kiswahili yanahifadhi usambamba wa kishairi: mahali hapo ni patakatifu na pia ni makao ya jina la Mungu.'
- issue: Kuhifadhi usemi wa 'jina' kuhusu uwepo wa Mungu
  choice: '''makao ya jina lako'''
  alternative: '''makao yako'' au ''mahali ambapo jina lako hukaa'''
  rationale: Tafsiri haifanyi jengo lenyewe kuwa sawa na Mungu wala kuondoa usemi wa Kiebrania. Inahifadhi mvutano wa kitheolojia wa jina la Mungu kukaa mahali palipochaguliwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Kitenzi 'teketeza' kinawasilisha uchomaji wenye uharibifu; 'makao ya jina lako' kimeachwa kama usemi wa kibiblia wenye uzito wa kitheolojia.
