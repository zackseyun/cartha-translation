  text: Kwa nini unazuia mkono wako, mkono wako wa kuume? Uutoe mkono wako wa kuume kutoka kifuani mwako; uwaangamize![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hakitaji yambwa wa kitenzi cha mwisho; kiambishi cha yambwa -wa- katika “uwaangamize” kimetolewa kutokana na muktadha, likirejelea maadui katika zaburi hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Kwa nini
  rationale: Ni kiulizi cha sababu kinachoanzisha swali la maombolezo.
- source_word: תָשִׁיב
  choice: unazuia
  rationale: Hifili ya שוב ikiwa na ‘mkono’ kama yambwa, na kwa kuzingatia picha ya mkono uliowekwa kifuani, ina maana ya kuurudisha nyuma au kuuzuia usitende.
- source_word: יָדְךָ
  choice: mkono wako
  rationale: Taswira halisi inadumishwa, sambamba na ‘mkono wako wa kuume.’
- source_word: וִימִינֶךָ
  choice: mkono wako wa kuume
  rationale: Inahifadhi taswira ya kishairi ya nguvu na hatua madhubuti bila kuifafanua kwa maneno ya ziada.
- source_word: מִקֶּרֶב חֹוקֶךָ
  choice: kifuani mwako
  rationale: Kirai kinaonyesha mkono uliomo ndani ya kifua au kunjo la vazi. ‘Kifuani mwako’ ni Kiswahili cha kawaida na kinachohifadhi picha hiyo.
- source_word: כַלֵּה
  choice: uwaangamize
  rationale: Amri ya Pieli ya כלה humaanisha kumaliza kabisa, kuangamiza, au kuteketeza. Kiambishi cha yambwa ‘wa’ kimetolewa kutokana na muktadha wa maadui, ingawa Kiebrania hakitaji yambwa waziwazi.
theological_decisions:
- issue: Yambwa iliyodokezwa katika amri ya mwisho
  choice: ‘uwaangamize,’ ikirejelea maadui
  alternative: Kuacha yambwa bila kutajwa, au kuelewa amri kuwa inarejelea tishio kwa jumla
  rationale: Kiebrania hakitaji yambwa, lakini muktadha wa zaburi ni ombi kwa Mungu achukue hatua dhidi ya maadui wanaodhihaki na kuharibu patakatifu. Rejeo kwa maadui limeonyeshwa, huku tanbihi ikihifadhi kutokutajwa kwake katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali na taswira ya mkono wa kuume na kifua vimehifadhiwa; ‘unazuia’ na ‘utoe’ huwasilisha kwa kawaida picha ya Mungu kutotenda kisha kuitwa achukue hatua.
