lexical_decisions:
- source_word: יִוָּדַע
  choice: Alijulikana
  rationale: Nifali ya ידע, nafsi ya tatu umoja wa kiume, imetafsiriwa kama kauli ya wakati uliopita katika simulizi la kishairi; inahifadhi hali ya kutendwa na umoja wa kiume.
- source_word: כְּמֵבִיא
  choice: kama mtu anayenyanyua
  rationale: כְּ inaonyesha ulinganisho, na participio ya Hifili ya בוא inaweza kumaanisha kuleta au kufanya kitu kipande; katika taswira ya ukataji miti, 'anayenyanyua' ni ya asili na inaendana na לְמָעְלָה.
- source_word: לְמָעְלָה
  choice: juu
  rationale: Kirai hiki cha kielezi kinaonyesha mwendo kuelekea juu.
- source_word: בִּסֲבָךְ
  choice: katika kichaka
  rationale: סבך ni msongamano wa vichaka au miti, na בְּ hapa inaeleweka kwa kawaida kama mahali ambapo tendo linafanyika; 'katika' huepuka kudokeza mwendo usio wazi wa kuingia ndani.
- source_word: עֵץ
  choice: cha miti
  rationale: עץ inaweza kuwa mti au mbao; ikiambatana na סבך, maana ya miti hai inafaa zaidi kuliko nyenzo ya mbao.
- source_word: קַרְדֻּמּוֹת
  choice: mashoka
  rationale: Nomino ya wingi hutaja zana za kukatia; 'mashoka' ni neno la kawaida, wazi, na linalofaa katika muktadha huu.
