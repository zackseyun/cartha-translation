  text: Alijulikana kama mtu anayenyanyua mashoka juu katika msongamano wa miti.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Alianza kujulikana kama mtu anayeleta mashoka juu katika msongamano wa miti.” Kiebrania hapa ni kifupi na maana yake si wazi kabisa.
