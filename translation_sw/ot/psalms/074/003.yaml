  text: Inua hatua zako kuelekea magofu ya kudumu[a]; adui ameharibu kila kitu katika patakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Inua miguu yako kuelekea ukiwa wa kudumu”; Kiebrania kinadumisha taswira dhahiri ya Mungu akisonga kuelekea patakatifu palipoharibiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִימָה
  choice: Inua
  rationale: Amri inayomwelekea Mungu; inahifadhi taswira halisi ya kuinua hatua badala ya kuifafanua tu kuwa ‘Njoo.’
- source_word: פְעָמֶיךָ
  choice: hatua zako
  rationale: Neno linaweza kumaanisha hatua au nyayo; ‘hatua zako’ ni Kiswahili cha kawaida na kinadumisha taswira ya Mungu akisonga.
- source_word: לְמַשֻּׁאוֹת
  choice: uelekee kwenye magofu
  rationale: Nomino hiyo huonyesha mahali au vitu vilivyoharibiwa; ‘magofu’ huwasilisha matokeo yanayoonekana ya uharibifu, huku ‘uelekee kwenye’ ikifanya mwelekeo wa לְ kuwa wazi katika Kiswahili.
- source_word: נֶצַח
  choice: ya kudumu
  rationale: Hapa inaeleza magofu kama hali inayoendelea au ya muda mrefu; ‘ya kudumu’ ni ya asili na haiamui kwamba yatadumu milele kabisa.
- source_word: כָּל
  choice: kila kitu
  rationale: Inatoa wazo la uharibifu wenye kuenea kwa kila kilichokuwamo.
- source_word: הֵרַע
  choice: ameharibu
  rationale: Hifili ya רעע katika muktadha huu humaanisha kutenda madhara au kuangamiza; ‘ameharibu’ ni wazi, nzito, na ya kawaida.
- source_word: אוֹיֵב
  choice: adui
  rationale: Umoja unaweza kumwakilisha adui kwa ujumla; Kiswahili hakihitaji kibainishi maalumu.
- source_word: בַּקֹּדֶשׁ
  choice: katika patakatifu
  rationale: קֹדֶשׁ hapa ni eneo takatifu, yaelekea patakatifu pa hekalu; ‘patakatifu’ huhifadhi maana ya kiibada.
theological_decisions:
- issue: Ombi lenye lugha ya kumwelezea Mungu kwa mfano wa kibinadamu
  choice: Kudumisha taswira halisi ‘Inua hatua zako’
  alternative: Njoo; Songa uelekee
  rationale: Lugha ya kishairi ya Kiebrania humwomba Mungu asonge kuelekea mahali palipoharibiwa. Tafsiri haiongezi dhana ya haraka wala kuondoa taswira hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Inua hatua zako’ ni taswira isiyo ya kawaida kimakusudi, iliyohifadhiwa kwa uaminifu; ‘uelekee’ husaidia kuifanya ieleweke bila kuibadili kuwa tafsiri ya kifafanuzi.
