  text: קוּמָ֣/ה אֱ֭לֹהִים רִיבָ֣/ה רִיבֶ֑/ךָ זְכֹ֥ר חֶרְפָּתְ/ךָ֥ מִנִּי נָ֝בָ֗ל כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/022.yaml
  text: Rise up[a], O God; plead your case[b]. Remember your reproach from the fool all day long.
translation:
  language: sw
  text: Inuka, Ee Mungu; tetea shauri lako.[a] Kumbuka shutuma dhidi yako kutoka kwa mpumbavu[b] siku nzima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “pigania shauri lako.” Kiebrania kinatumia lugha ya mgogoro au kesi ya kisheria.
    reason: lexical_alternative
  - marker: b
    text: Hapa “mpumbavu” ni mtu mpotovu kimaadili au asiyemcha Mungu, si mtu asiye na akili tu.
    reason: cultural_note
lexical_decisions:
- source_word: קוּמָה
  choice: Inuka
  rationale: Kitenzi cha amri kinatoa wito wa dharura kwa Mungu achukue hatua; “inuka” ni cha kawaida na chenye hadhi katika Kiswahili.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Ni mwito wa moja kwa moja kwa Mungu; “Ee” huonyesha hali ya maombi bila kufanya lugha kuwa ya kizamani kupita kiasi.
- source_word: רִיבָה רִיבֶךָ
  choice: tetea shauri lako
  rationale: Mzizi na nomino ya Kiebrania zinatumia lugha ya mgogoro au kesi ya kisheria. “Tetea shauri lako” huhifadhi taswira hiyo kwa Kiswahili cha asili.
- source_word: זְכֹר
  choice: Kumbuka
  rationale: Amri hii inaomba Mungu akumbuke kwa namna inayoelekea kwenye hatua, lakini tafsiri haipanui maana hiyo kimatamshi.
- source_word: חֶרְפָּתְךָ
  choice: shutuma dhidi yako
  rationale: Neno linaweza kumaanisha shutuma, dhihaka au fedheha. Katika muktadha huu, “shutuma dhidi yako” linaonyesha kwa kawaida maneno ya kudhalilisha yanayoelekezwa kwa Mungu.
- source_word: מִנִּי
  choice: kutoka kwa
  rationale: Kihusishi kinaonyesha chanzo cha shutuma, yaani mpumbavu.
- source_word: נָבָל
  choice: mpumbavu
  rationale: Katika Zaburi neno hili humaanisha mtu mpotovu kimaadili au asiyemcha Mungu, si mtu asiye na akili tu; tanbihi inaeleza maana hiyo pana.
- source_word: כָּל הַיּוֹם
  choice: mchana kutwa
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha jambo linaloendelea siku nzima.
theological_decisions:
- issue: Mhusika anayelengwa na חֶרְפָּתְךָ (“shutuma zako”)
  choice: Shutuma zinazoelekezwa dhidi ya Mungu
  alternative: Shutuma wanazopata watu wa Mungu kwa sababu ya uhusiano wao naye
  rationale: Kiambishi cha nafsi ya pili kwa kawaida kinamtaja Mungu, na hilo linaendana na “shauri lako.” Hata hivyo, muktadha mpana wa zaburi unaunganisha kudhalilishwa kwa watu na patakatifu pa Mungu na kudhalilishwa kwa Mungu mwenyewe; tafsiri haiongezi maelezo ya kimadhehebu kuhusu uhusiano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi wa maombi umehifadhiwa; lugha ya kisheria imewekwa wazi bila kuwa nzito, na “mchana kutwa” limetumiwa kwa mwendelezo wa shutuma.
