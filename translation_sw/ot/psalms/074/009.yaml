  text: אֽוֹתֹתֵ֗י/נוּ לֹ֥א רָ֫אִ֥ינוּ אֵֽין ע֥וֹד נָבִ֑יא וְ/לֹֽא אִ֝תָּ֗/נוּ יֹדֵ֥עַ עַד מָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/009.yaml
  text: We do not see our signs; there is no longer any prophet[a], and none among us knows how long.
translation:
  language: sw
  text: Hatuoni ishara zetu[a]; hakuna tena nabii, wala hakuna yeyote miongoni mwetu anayejua mpaka lini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bendera zetu” au “alama zetu”; neno la Kiebrania linaweza kumaanisha ishara au nembo zinazoonekana, lakini kinachorejelewa hapa hakijaelezwa wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹתֹתֵינוּ
  choice: ishara zetu
  rationale: Neno אוֹת kwa kawaida humaanisha ishara au alama. Tafsiri hii pana inahifadhi kutotajwa wazi kwa ishara zinazokusudiwa bila kuzibainisha kuwa bendera, alama za ibada, au udhihirisho wa uwepo wa Mungu.
- source_word: לֹא רָאִינוּ
  choice: hatuoni
  rationale: Kauli timilifu ya Kiebrania hapa inaeleza hali inayoendelea katika wimbo wa maombolezo; wakati wa sasa wa Kiswahili unawasilisha kwa kawaida malalamiko kuhusu kutokuwepo kwa ishara hizo.
- source_word: אֵין עוֹד
  choice: hakuna tena
  rationale: Kirai hiki huonyesha kwamba kitu kilichokuwapo sasa hakipo, au kwamba kutokuwapo kwake kunaendelea.
- source_word: נָבִיא
  choice: nabii
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa נָבִיא; umoja hapa una maana ya kijumla, yaani hakuna nabii hata mmoja.
- source_word: וְלֹא אִתָּנוּ יֹדֵעַ
  choice: wala hakuna yeyote miongoni mwetu anayejua
  rationale: Muundo wa Kiebrania ni wa mkato, lakini maana yake ya kawaida ni kwamba hakuna mtu katika jumuiya anayejua. 'Miongoni mwetu' linawakilisha אִתָּנוּ kwa Kiswahili cha kawaida.
- source_word: עַד מָה
  choice: mpaka lini
  rationale: Katika maombolezo, עַד מָה ni nahau inayouliza muda ambao hali itaendelea; 'mpaka lini' ni usemi wa kawaida na sahihi wa Kiswahili.
theological_decisions:
- issue: Kinachorejelewa na “ishara zetu”
  choice: Usemi umeachwa mpana kuwa “ishara zetu.”
  alternative: bendera zetu; alama za uwepo wa Mungu miongoni mwetu
  rationale: Kiebrania hakitambulishi ishara hizo waziwazi. Kutobainisha zaidi kunahifadhi utata wa maandishi na kuepuka kuingiza dhana maalumu kuhusu hekalu, ibada, agano, au vita.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unadumisha mfululizo wa maombolezo na urudiaji wa kutokuwapo kwa ishara, nabii, na mtu mwenye kujua. Hakuna tanbihi iliyowekwa kwa sababu ‘ishara zetu’ ni tafsiri pana na wazi; mbadala zake hazihitajiki ili kuelewa aya.
