  text: May God be gracious to us and bless us[a]; may his face shine upon us[c][b]. Selah
translation:
  language: sw
  text: Mungu atufadhili na atubariki; uso wake uangaze pamoja nasi.[a][b] Sela.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uso wake uangaze juu yetu.” Kiebrania husema moja kwa moja “pamoja nasi,” lakini katika msemo huu taswira ya uso wa Mungu unaong'aa kwa kawaida huonyesha fadhili zake zinazotuelekea.
    reason: lexical_alternative
  - marker: b
    text: Maneno haya yana mwangwi wa baraka ya kikuhani katika Hesabu 6:24–26, hasa “BWANA akuangazie uso wake.”
    reason: cross_reference
  - marker: c
    text: “Sela” huenda ni alama ya kiliturujia au muziki; maana yake kamili haijulikani.
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la neno hili linaonekana kuwa la wingi, vitenzi vinavyohusiana nalo ni vya umoja, hivyo hapa linamtaja Mungu mmoja wa Israeli.
- source_word: יְחָנֵּנוּ
  choice: na atufadhili
  rationale: Kitenzi חנן katika ombi hili kinaomba neema au fadhili. ‘Atufadhili’ ni lugha ya sasa yenye heshima na haibani maana kuwa rehema pekee.
- source_word: וִיבָרְכֵנוּ
  choice: na kutubariki
  rationale: ברך ni kitenzi cha kawaida cha ‘kubariki’; tafsiri hii ni sahihi na ya kawaida katika Kiswahili.
- source_word: יָאֵר
  choice: na auangazie
  rationale: Hifili ya אור ina maana ya kusababisha kung'aa au kuangaza. ‘Auangazie uso wake’ huhifadhi taswira halisi na mwangwi wa Hesabu 6:25.
- source_word: פָּנָיו
  choice: uso wake
  rationale: Maana ya moja kwa moja ni ‘uso wake.’ Taswira hiyo imehifadhiwa badala ya kufasiriwa kama ‘uwepo’ au ‘fadhili,’ ili kudumisha uhusiano na baraka ya kikuhani.
- source_word: אִתָּנוּ
  choice: pamoja nasi
  rationale: Kiebrania kinasema kwa kawaida ‘pamoja nasi/na sisi,’ si ‘juu yetu.’ Uchaguzi huu unatanguliza ushahidi wa matini ya WLC na kuhifadhi tofauti yake halisi, huku maana ya kawaida ya baraka ya uso unaong'aa ikielezwa katika tanbihi.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya neno hili haijulikani; huenda ni alama ya kiliturujia au muziki. Kwa hiyo limetoholewa badala ya kupewa tafsiri ya kubahatisha.
theological_decisions:
- issue: Nguvu ya ombi katika mfuatano wa vitenzi
  choice: 'Kutafsiri kama ombi au tamanio: ‘na atufadhili ... na auangazie.’'
  alternative: Kauli ya taarifa kama ‘Mungu anatufadhili na kutubariki.’
  rationale: Katika muktadha huu wa baraka ya kizaburi, maumbo ya vitenzi yanaeleweka kiasili kama maombi yenye nguvu ya jusivi, si taarifa kuhusu tendo lililokamilika au la kawaida.
- issue: Mwangwi wa baraka ya kikuhani
  choice: Kuhifadhi taswira ya uso unaoangazwa
  alternative: Kufasiri moja kwa moja kuwa ‘atuangalie kwa fadhili.’
  rationale: Mstari huu una mwangwi mkubwa wa Hesabu 6:24–26. Taswira ya ‘uso’ na ‘kuangaza’ huhifadhi uhusiano huo bila kuongeza dai la kiteolojia lisilomo katika matini.
- issue: Kihusishi אִתָּנוּ
  choice: Kuhifadhi maana ya moja kwa moja ‘pamoja nasi’ katika matini
  alternative: ‘Juu yetu’ au ‘kwetu,’ kufuatana na msemo wa baraka katika Hesabu 6:25
  rationale: WLC hapa ina אִתָּנוּ, ‘pamoja nasi,’ tofauti na אֵלֶיךָ, ‘kwako,’ katika Hesabu 6:25. Tafsiri haipaswi kusahihisha kimya kimya tofauti hiyo; tanbihi inaonyesha namna msemo unavyoeleweka kwa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa ‘na + kiima + kitenzi’ umetumiwa kuonyesha ombi la baraka. ‘Uso wake’ na ‘Sela’ zimehifadhiwa kwa sababu ya taswira ya Biblia na kutokuwa na uhakika wa istilahi. Viashiria vyote vya tanbihi vimewekwa katika matini kuu.
