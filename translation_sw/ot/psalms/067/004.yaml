  yaml_path: translation/ot/psalms/067/004.yaml
  text: Let the nations be glad and sing for joy[a], for you judge the peoples with equity and guide the nations on the earth[b]. Selah
translation:
  language: sw
  text: Mataifa na yafurahi, na waimbe kwa shangwe[a], kwa maana wewe unawahukumu watu kwa haki na kuyaongoza mataifa duniani[b]. Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mataifa na yafurahi, na yapige kelele kwa shangwe.” Kitenzi hiki kinaweza kumaanisha kuimba kwa furaha au kutoa sauti kuu za shangwe.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika nchi,” ikiwa אֶרֶץ linaeleweka kwa maana ya eneo maalumu. Hapa limetafsiriwa “duniani” kwa sababu upeo wa zaburi hii unahusu mataifa yote.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: na yafurahi
  rationale: Qal imperfect ya nafsi ya tatu wingi inaeleweka hapa kwa maana ya ombi au mwito; muundo huu wa Kiswahili unaonyesha nguvu hiyo ya hiari katika muktadha wa sifa.
- source_word: וִירַנְּנוּ
  choice: na kuimba kwa shangwe
  rationale: Piel hii huonyesha sauti kuu za furaha; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha wazo la furaha inayotolewa kwa sauti, huku uwezekano wa ‘kupiga kelele kwa shangwe’ ukihifadhiwa katika tanbihi.
- source_word: לְאֻמִּים
  choice: mataifa
  rationale: Neno linaweza kumaanisha watu au mataifa; ‘mataifa’ linafaa upeo wa kimataifa wa zaburi hii na limetafsiriwa vivyo hivyo linaporudiwa.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya mataifa kufurahi; ‘kwa maana’ ni cha asili na chenye hadhi katika ushairi wa Kiswahili.
- source_word: תִשְׁפֹּט
  choice: unahukumu
  rationale: Imperfect inaweza kueleza wakati ujao au tendo la kawaida. Wakati wa sasa hapa unaonyesha sifa ya Mungu inayoendelea bila kufuta uwezekano wa maana ya wakati ujao.
- source_word: עַמִּים
  choice: watu
  rationale: Hutofautisha עַמִּים na לְאֻמִּים kwa Kiswahili kinachoeleweka, na kuonyesha makundi ya watu yaliyo chini ya hukumu ya Mungu.
- source_word: מִישׁוֹר
  choice: kwa haki
  rationale: Nomino hii huonyesha unyofu, usawa na uadilifu. ‘Kwa haki’ ni usemi wa kawaida wa Kiswahili katika muktadha wa hukumu na unabeba maana ya kutokuwa na upendeleo.
- source_word: תַּנְחֵם
  choice: kuyaongoza
  rationale: Hiphil ya נחה humaanisha kuongoza au kuelekeza; ‘kuyaongoza’ huonyesha utawala wenye hekima bila kulazimisha wazo la mwendo wa kimwili pekee.
- source_word: בָּאָרֶץ
  choice: duniani
  rationale: Kwa sababu zaburi inawahusu watu na mataifa yote, אֶרֶץ inaeleweka kwa upeo wa ulimwengu; maana ya eneo maalumu, ‘katika nchi,’ imehifadhiwa katika tanbihi.
- source_word: סֶלָה
  choice: Sela
  rationale: Imenukuliwa kwa matamshi badala ya kutafsiriwa kwa kuwa maana yake kamili haijulikani kwa uhakika.
theological_decisions:
- issue: Upeo wa אֶרֶץ
  choice: duniani
  alternative: katika nchi
  rationale: Msisitizo wa Zaburi 67 juu ya watu na mataifa yote unaunga mkono maana ya ulimwengu mzima, lakini maana ya eneo maalumu inawezekana na imeonyeshwa katika tanbihi.
- issue: Maana ya vitenzi vya imperfect
  choice: mwito/ombi katika ‘na yafurahi,’ kisha matendo ya kawaida katika ‘unahukumu’ na ‘kuyaongoza’
  alternative: 'wakati ujao: ‘yatafurahi ... utawahukumu ... utayaongoza’'
  rationale: Muktadha wa kiliturujia unaunga mkono mwito wa sifa, huku matendo yanayofuata yakieleza tabia endelevu ya Mungu. Tafsiri haidai kuwa maana ya wakati ujao haiwezekani.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo ‘Mataifa na yafurahi’ unadumisha nguvu ya mwito au ombi, na ‘kwa haki’ ni wazi kwa wasomaji wa kawaida bila kupoteza maana ya usawa katika hukumu.
