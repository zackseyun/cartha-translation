  text: Let the peoples praise you[a], O God[b]; let all the peoples praise you.
translation:
  language: sw
  text: Mataifa na yakusifu[a][b], Ee Mungu; mataifa yote na yakusifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mataifa yatakusifu, Ee Mungu; mataifa yote yatakusifu.”
    reason: alternative_reading
  - marker: b
    text: Kitenzi cha Kiebrania kinaweza pia kumaanisha “kukushukuru,” lakini katika kiitikio hiki cha ibada, “kusifu” huwasilisha vizuri zaidi maana iliyokusudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: na yakusifu
  rationale: Hifili ya ידה katika Zaburi mara nyingi humaanisha kumsifu au kumshukuru Mungu hadharani katika ibada. Katika kiitikio hiki, “kusifu” linafaa zaidi, huku “na” likitoa maana ya ombi au tamanio.
- source_word: עַמִּים
  choice: mataifa
  rationale: Wingi huu unarejelea makundi mbalimbali ya watu. “Mataifa” ni Kiswahili cha kawaida kinachohifadhi upeo wa ulimwengu mzima katika zaburi hii.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Neno hili limetumiwa kama mwito wa moja kwa moja kwa Mungu; “Ee Mungu” huonyesha wazi mwito huo katika lugha ya sala na ushairi.
- source_word: כֻּלָּם
  choice: yote
  rationale: Neno hili linasisitiza kwamba hakuna taifa linaloachwa nje; “yote” ni la kawaida na linaendana kisarufi na “mataifa.”
theological_decisions:
- issue: Hali ya kitenzi na kazi ya kiitikio
  choice: 'Imetafsiriwa kama ombi au tamanio: “mataifa na yakusifu.”'
  alternative: “Mataifa yatakusifu.”
  rationale: Umbo la Kiebrania linaweza kueleweka kama taarifa ya wakati ujao, lakini katika muktadha wa kiitikio cha sala maana ya hiari/ombi ndiyo inayofaa zaidi. Tanbihi inahifadhi uwezekano wa tafsiri nyingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi na sala lakini kinachoeleweka kwa urahisi. Mpangilio unaweka mwito “Ee Mungu” mwanzoni kwa mtiririko wa kawaida wa Kiswahili bila kupoteza urudiaji wa Kiebrania.
