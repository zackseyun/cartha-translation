  yaml_path: translation/ot/psalms/067/007.yaml
  text: God will bless us[a], and all the ends of the earth will fear him.
translation:
  language: sw
  text: Mungu atatubariki[a], na miisho yote ya dunia itamwogopa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu atubariki.” Umbo la kitenzi cha Kiebrania linaweza kueleweka kama tangazo la uhakika au ombi.
    reason: textual_ambiguity
lexical_decisions:
- source_word: יְבָרְכֵנוּ
  choice: atatubariki
  rationale: Kauli ya Piel yenye kiambishi cha nafsi ya kwanza wingi humaanisha ‘atatubariki.’ Katika hitimisho hili la kishairi, hali isiyotimilika inaeleweka vyema kama tangazo la uhakika la wakati ujao, ingawa maana ya ombi ‘na atubariki’ inawezekana katika muktadha mpana.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la neno ni la wingi kimofolojia, kitenzi na rejeo lake ni la Mungu mmoja.
- source_word: וְיִירְאוּ
  choice: na ... itamwogopa
  rationale: Kitenzi ירא kinapotumiwa kuhusu Mungu hujumuisha hofu, kicho na mshangao wa heshima. ‘Itamwogopa’ ni tafsiri ya moja kwa moja inayohifadhi uzito na upana huo.
- source_word: אֹתוֹ
  choice: -mw-
  rationale: Kiwakilishi cha yambwa kinamrejelea Mungu kama nafsi mmoja; kwa Kiswahili kinaunganishwa ndani ya kitenzi ‘itamwogopa.’
- source_word: כָּל
  choice: yote
  rationale: 'Pamoja na kirai kinachofuata, neno hili lina maana ya ujumla: sehemu zote za mbali kabisa.'
- source_word: אַפְסֵי אָרֶץ
  choice: miisho ... ya dunia
  rationale: Hii ni nahau ya kishairi inayotaja sehemu za mbali kabisa za ulimwengu. ‘Miisho ya dunia’ huhifadhi taswira ya Kiebrania na inaeleweka katika Kiswahili.
theological_decisions:
- issue: Maana ya ירא kuhusiana na Mungu
  choice: itamwogopa
  alternative: itamheshimu kwa kicho; itastaajabu mbele zake kwa kicho
  rationale: Tafsiri ‘itamwogopa’ inadumisha mvutano wa kibiblia kati ya hofu, kicho, heshima na kujinyenyekeza, bila kupunguza maana kuwa heshima tu.
- issue: Nguvu ya hali isiyotimilika katika יְבָרְכֵנוּ
  choice: atatubariki
  alternative: na atubariki; anatubariki
  rationale: Katika hitimisho la zaburi, kauli hii inasomwa kama tangazo la tumaini lenye uhakika na inaendana na kitenzi kinachofuata; hata hivyo, muktadha mpana unaweza kuruhusu maana ya ombi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Umoja wa kisarufi wa ‘miisho yote’ umehifadhiwa kwa ‘itamwogopa,’ na nahau ya kishairi ‘miisho ya dunia’ imetumiwa badala ya ufafanuzi mrefu.
