  text: that your way may be known on the earth[b][a], your salvation among all nations.
translation:
  language: sw
  text: 'ili njia yako ijulikane duniani[a],

    wokovu wako miongoni mwa mataifa yote[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nchini,” ikiwa maana inachukuliwa kuwa ya eneo fulani; lakini ulinganifu na “miongoni mwa mataifa yote” unaunga mkono maana pana ya “duniani.”
    reason: lexical_alternative
  - marker: b
    text: Au “ukombozi wako.” Neno la Kiebrania linaweza kumaanisha ukombozi au wokovu kwa maana pana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָדַעַת
  choice: ili ... ijulikane
  rationale: Muundo wa ל pamoja na kitenzi-jina unaonyesha kusudi linaloendeleza ombi la mstari uliotangulia. Kiswahili “ili ... ijulikane” kinaeleza kusudi hilo kwa kawaida.
- source_word: בָּאָרֶץ
  choice: duniani
  rationale: אֶרֶץ linaweza kumaanisha “nchi” au “dunia.” Ulinganifu wake na “kati ya mataifa yote” unaunga mkono maana pana ya ulimwengu mzima.
- source_word: דַּרְכֶּךָ
  choice: njia yako
  rationale: “Njia” inahifadhi sitiari ya Kiebrania na inaweza kueleweka kuwa mwenendo wa Mungu au namna anavyotenda.
- source_word: בְּכָל גּוֹיִם
  choice: kati ya mataifa yote
  rationale: גּוֹיִם humaanisha mataifa kwa maana ya kimataifa; “kati ya mataifa yote” ni tafsiri ya kawaida ya kishairi na inafaa upeo wa ulimwengu mzima katika mstari huu.
- source_word: יְשׁוּעָתֶךָ
  choice: wokovu wako
  rationale: יְשׁוּעָה linaweza kumaanisha kuokolewa, ukombozi, au ushindi. “Wokovu” linahifadhi upana wa tendo la Mungu la kuokoa bila kulifunga kwa aina moja tu ya hatari.
theological_decisions:
- issue: Upeo wa אֶרֶץ katika zaburi inayoyatazama mataifa yote
  choice: “duniani,” kwa maana ya ulimwengu mzima
  alternative: “nchini,” kwa maana ya eneo fulani
  rationale: Ulinganifu na “kati ya mataifa yote” unaonyesha upeo wa ulimwengu mzima, bila kuingiza madai ya baadaye ya kimafundisho.
- issue: Kutafsiri יְשׁוּעָה huku ukihifadhi upana wake wa kiteolojia
  choice: “wokovu”
  alternative: “ukombozi” au “ushindi”
  rationale: Neno linaweza kueleza kuokolewa katika hatari halisi, lakini hapa “wokovu” linahifadhi wigo mpana wa tendo la Mungu la kuokoa miongoni mwa mataifa yote.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa mistari unahifadhi ulinganifu wa kishairi wa Kiebrania; hakuna kiunganishi kilichoongezwa kati ya vipashio viwili.
