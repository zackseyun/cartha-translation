  variant: Standard East African Swahili
source:
  edition: WLC
  text: יוֹד֖וּ/ךָ עַמִּ֥ים אֱלֹהִ֑ים י֝וֹד֗וּ/ךָ עַמִּ֥ים כֻּלָּֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/003.yaml
  text: Let the peoples praise you[a], O God[b]; let all the peoples praise you.
translation:
  language: sw
  text: Ee Mungu, mataifa na yakusifu[a]; mataifa yote na yakusifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mataifa yakusifu” au “mataifa yatakusifu.” Muundo wa kitenzi cha Kiebrania unaweza kueleweka kama ombi au tamanio, au—kwa uwezekano mdogo zaidi hapa—kama tendo la wakati ujao.
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: na yakusifu
  rationale: Kitenzi cha Kiebrania ידה katika muundo wa Hifili na katika muktadha wa zaburi humaanisha kumsifu au kumshukuru Mungu. Hapa muundo unaorudiwa una nguvu ya ombi au tamanio; Kiswahili cha 'na yakusifu' kinahifadhi sauti hiyo ya kiliturujia na kishairi.
- source_word: עַמִּים
  choice: mataifa
  rationale: Wingi huu unarejelea makundi mbalimbali ya watu. Katika Kiswahili sanifu, 'mataifa' ni ya asili na inaeleweka vizuri zaidi kuliko 'watu mbalimbali,' huku ikihifadhi wazo la jumuiya nyingi bila kulazimisha maana ya kisiasa.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Neno hili ni la kumwita Mungu moja kwa moja. 'Ee Mungu' huonyesha wazi hali hiyo ya usemi na inafaa kwa lugha ya sala ya kishairi.
- source_word: כֻּלָּם
  choice: yote
  rationale: '''Yote'' linaonyesha ujumla kamili wa mataifa yanayotajwa na kudumisha urari na ufupi wa mstari wa kishairi.'
theological_decisions:
- issue: Nguvu ya kimatamanio ya kitenzi kinachorudiwa katika kibwagizo cha sifa
  choice: 'Kutafsiri kama ombi au tamanio: ''mataifa na yakusifu'''
  alternative: Mataifa yatakusifu
  rationale: Muundo wa Kiebrania ni kitenzi kisichokamilika, Hifili nafsi ya tatu wingi, chenye kiambishi cha nafsi ya pili umoja. Katika muktadha huu kinafanya kazi kama ombi au tamanio la kiliturujia. 'Na yakusifu' huhifadhi hali hiyo bila kuifanya kauli hiyo kuwa unabii wa wakati ujao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio 'Ee Mungu' umewekwa mwanzoni kwa mtiririko wa asili wa Kiswahili; urudiaji wa 'mataifa' umehifadhiwa ili kudumisha kibwagizo cha Kiebrania.
