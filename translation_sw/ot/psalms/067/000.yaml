lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza wa waimbaji
  rationale: Katika vichwa vya zaburi, neno hili humaanisha mwenye jukumu la kuongoza uimbaji au utendaji wa muziki. Usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa; kihusishi “kwa” kinawakilisha לַ־ bila kuamua kwa nguvu zaidi ikiwa ni agizo au wakfu.
- source_word: בִּנְגִינֹת
  choice: kwa vinanda vya nyuzi
  rationale: Neno hili katika kichwa cha muziki hurejelea ala au muziki wa nyuzi. “Vinanda vya nyuzi” linaonyesha ala hizo kwa uwazi, huku “kwa” likihifadhi uwezekano wa maana ya kutumia au kuandamana nazo.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa aina hii ya utenzi wa ibada na linahifadhi jina la aina ya maandishi.
- source_word: שִׁיר
  choice: Wimbo
  rationale: Tafsiri hii ya moja kwa moja inalihifadhi kama jina tofauti la aina ya utungo badala ya kuliunganisha na מִזְמוֹר.
