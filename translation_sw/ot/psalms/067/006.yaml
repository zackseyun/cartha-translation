  text: אֶ֭רֶץ נָתְנָ֣ה יְבוּלָ֑/הּ יְ֝בָרְכֵ֗/נוּ אֱלֹהִ֥ים אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/006.yaml
  text: The earth has yielded its produce[a]; God, our God[b], blesses us.
translation:
  language: sw
  text: Dunia[a] imetoa mazao yake; Mungu, Mungu wetu, anatubariki.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Nchi.” Neno la Kiebrania אֶרֶץ linaweza kumaanisha “dunia” au “nchi.”
    reason: lexical_alternative
  - marker: b
    text: Au “Mungu, Mungu wetu, atubariki,” au “Mungu, Mungu wetu, atatubariki.” Katika muktadha huu, kitenzi cha Kiebrania kinaweza kueleweka kuwa cha wakati wa sasa, ombi, au wakati ujao.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרֶץ
  choice: Dunia
  rationale: Katika muktadha wa zaburi hii inayohusu mataifa yote na miisho ya dunia, maana pana ya “dunia” inafaa zaidi, ingawa neno la Kiebrania pia linaweza kumaanisha “nchi.”
- source_word: נָתְנָה
  choice: imetoa
  rationale: Kitenzi hicho humaanisha moja kwa moja “imetoa”; pamoja na “mazao,” usemi huu ni wa kawaida na unahifadhi hali ya tendo lililotimia.
- source_word: יְבוּלָהּ
  choice: mazao yake
  rationale: “Mazao” ni neno la kawaida la Kiswahili kwa matokeo ya uzalishaji wa ardhi bila kulibana neno hilo kuwa mavuno ya tukio fulani pekee.
- source_word: יְבָרְכֵנוּ
  choice: anatubariki
  rationale: Hii ni tafsiri ya hali ya sasa yenye maana ya uthibitisho wa baraka, huku uwezekano wa ombi au wakati ujao ukihifadhiwa katika tanbihi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hii ndiyo tafsiri sanifu ya jina hili la cheo cha Mungu katika muktadha huu.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Inatafsiri kiambishi cha nafsi ya kwanza wingi moja kwa moja na kuhifadhi msisitizo wa marudio “Mungu, Mungu wetu.”
theological_decisions:
- issue: Nguvu ya kitenzi cha Kiebrania יְבָרְכֵנוּ
  choice: 'Hali ya sasa ya uthibitisho: “anatubariki”'
  alternative: 'Ombi: “Mungu, Mungu wetu, atubariki,” au wakati ujao: “Mungu, Mungu wetu, atatubariki”'
  rationale: Kitenzi cha Kiebrania kinaweza kueleweka kama uthibitisho wa sasa, ombi, au jambo la wakati ujao. Kauli iliyotangulia kuhusu mazao yaliyopatikana inaunga mkono uthibitisho wa sasa, lakini tanbihi inadumisha utata halisi wa maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi fupi na marudio ya “Mungu, Mungu wetu” yanahifadhi muundo na msisitizo wa Kiebrania. Alama za tanbihi zimewekwa baada ya vipengele vinavyohusika.
