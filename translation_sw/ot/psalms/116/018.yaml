  text: נְ֭דָרַ/י לַ/יהוָ֣ה אֲשַׁלֵּ֑ם נֶגְדָ/ה נָּ֝֗א לְ/כָל עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/018.yaml
  text: I will fulfill my vows to Yahweh in the presence of all his people[a][b].
translation:
  language: sw
  text: Nitatimiza nadhiri zangu kwa Yahweh mbele ya watu wake wote.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nitalipa nadhiri zangu kwa Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mbele ya, katika uwepo wa”; maana yake ni kutimiza nadhiri hadharani mbele ya jumuiya ya waabudu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדָרַי
  choice: nadhiri zangu
  rationale: Nomino נֶדֶר pamoja na kiambishi cha nafsi ya kwanza umoja humaanisha nadhiri au ahadi zilizowekwa; wingi wake umehifadhiwa bila kuibana maana kuwa dhabihu za nadhiri.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Kiambishi ל huonyesha yule ambaye nadhiri zinatimizwa kwake; jina la agano יהוה limetoholewa kuwa “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: אֲשַׁלֵּם
  choice: Nitatimiza
  rationale: Katika muktadha wa nadhiri, piel ya שׁלם humaanisha kulipa au kutimiza nadhiri. “Nitatimiza” ni Kiswahili cha kawaida na huepuka dhana ya fedha pekee.
- source_word: נֶגְדָה־נָּא
  choice: mbele ya
  rationale: נֶגֶד hueleza kuwa mbele ya au katika uwepo wa wengine. Chembe נָא ni ngumu hapa na yaelekea inatia mkazo; haijapewa maana ya wakati isiyo hakika.
- source_word: לְכָל עַמּוֹ
  choice: watu wake wote
  rationale: Kirai kinaonyesha jumuiya yote ya Yahweh iliyopo kama mashahidi; kiambishi cha nafsi ya tatu katika עַמּוֹ kinamrejelea Yahweh.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kutimiza nadhiri hadharani
  choice: mbele ya watu wake wote
  alternative: katika uwepo wa watu wake wote
  rationale: Kirai cha Kiebrania kinaweka tendo hilo wazi mbele ya jumuiya, bila kuamua zaidi namna mahsusi ya ibada au sadaka iliyohusika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nadhiri” ni istilahi iliyozoeleka katika mazingira ya kidini, huku sentensi ikibaki wazi na rahisi kueleweka.
