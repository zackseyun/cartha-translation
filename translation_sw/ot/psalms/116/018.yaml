  source_fidelity: 'Tafsiri inahifadhi vipengele vya msingi vya Kiebrania: nadhiri za msemaji, kuzitimiza kwa Yahweh, na tendo kufanywa mbele ya watu wake wote. “Nitatimiza” ni tafsiri sahihi na ya kawaida ya אֲשַׁלֵּם katika muktadha wa nadhiri. “Mbele ya” huwasilisha vizuri נֶגְדָה; chembe נָא yenye utata haikulazimishi kuongezwa kwa kielezi cha wakati katika Kiswahili.'
