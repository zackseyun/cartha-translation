  text: יָ֭קָר בְּ/עֵינֵ֣י יְהוָ֑ה הַ֝/מָּ֗וְתָ/ה לַ/חֲסִידָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/015.yaml
  text: Precious in the eyes of Yahweh is the death of his faithful ones[a][b].
translation:
  language: sw
  text: Kifo cha waaminifu wake[b] ni cha thamani machoni pa Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kifo cha waaminifu wake ni jambo lenye gharama kubwa mbele za Yahwe.”
    reason: lexical_alternative
  - marker: b
    text: “Waaminifu wake” pia inaweza kutafsiriwa “watakatifu wake” au “wacha-Mungu wake”; neno la Kiebrania linamaanisha watu wenye ushikamanifu wa agano na uaminifu kwa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקָר
  choice: cha thamani
  rationale: Kivumishi hiki kinaweza kumaanisha chenye thamani, cha gharama kubwa, au chenye uzito. “Cha thamani” kinadumisha maana kuu bila kudokeza kwamba Yahwe anafurahia kifo.
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: Hii inadumisha tamathali ya Kiebrania “machoni pa” na kueleza tathmini kwa mtazamo wa Yahwe kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: הַמָּוְתָה
  choice: Kifo
  rationale: Nomino hii inarejelea kifo cha watu waliotajwa. “Kifo” ndiyo namna ya kawaida na wazi katika Kiswahili; umoja unaendana na nomino ya Kiebrania inayotumiwa kwa maana ya jumla.
- source_word: לַחֲסִידָיו
  choice: cha waaminifu wake
  rationale: חָסִיד hueleza watu wenye uaminifu na ushikamanifu wa agano kwa Mungu. “Waaminifu wake” ni wazi kwa wasomaji wa sasa na huepuka maana za baadaye za kidhehebu zinazoweza kuambatana na “watakatifu.”
theological_decisions:
- issue: Maana ya thamani au gharama ya kifo cha waaminifu mbele za Yahwe
  choice: Kifo chao ni cha thamani machoni pa Yahwe, yaani, anaona kina uzito mkubwa.
  alternative: Kifo chao kinamgharimu Yahwe sana.
  rationale: יָקָר inaruhusu wazo la thamani na pia la gharama kubwa. Maandishi makuu yanahifadhi usemi wa “thamani,” huku tanbihi ikionyesha uwezekano wa “gharama kubwa,” bila kudai kwamba Mungu anapendezwa na kifo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio wa kawaida wa Kiswahili umetumiwa badala ya kuiga moja kwa moja utangulizi wa kivumishi katika Kiebrania; tamathali “machoni pa” imehifadhiwa.
