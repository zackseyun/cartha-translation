lexical_decisions:
- source_word: אָהַבְתִּי
  choice: Ninapenda
  rationale: Kitenzi cha Kiebrania hakitaji wazi anayependwa au kinachopendwa. Tafsiri hii inadumisha uwazi huo badala ya kuongeza ‘BWANA’ kama shamirisho.
