  rationale: Kiebrania kinasema kihalisi ‘Ninapenda, kwa kuwa BWANA husikia...’ bila kutaja shamirisho. Tafsiri ya ‘Nampenda BWANA’ inawezekana, lakini ingeondoa utata halisi wa maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kishairi ‘Ninapenda’ bila shamirisho umeachwa kwa makusudi ili kuakisi Kiebrania; tanbihi inafafanua usomaji mwingine unaowezekana.
