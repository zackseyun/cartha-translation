  rationale: Neno hili humaanisha maombi ya dhati ya kutafuta neema au huruma; kirai hiki kinaeleweka kwa urahisi na kuhifadhi maana hiyo.
- source_word: יְהוָה
  choice: BWANA
  rationale: Limelitafsiri jina la agano kwa utaratibu wa kawaida wa Biblia za Kiswahili, kwa herufi kubwa ili kulitofautisha kama jina la Mungu.
theological_decisions:
- issue: Shamirisho lisilotajwa la kitenzi ‘kupenda’
