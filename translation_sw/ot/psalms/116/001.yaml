  choice: huisikia
  rationale: Umbo la Kiebrania linaweza kueleza tendo linalotazamiwa au la kawaida; katika muktadha huu, kauli ya sasa ya mazoea ni ya asili katika Kiswahili na inaonyesha kwamba BWANA humsikiliza mwombaji.
