  text: Gracious is Yahweh[a], and righteous[b]; our God is compassionate.
translation:
  language: sw
  text: Yahwe ni mwenye neema na mwenye haki; Mungu wetu ni mwenye huruma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַנּוּן
  choice: mwenye neema
  rationale: Kirai hiki kinaonyesha tabia ya Yahwe ya kutoa kibali na neema; ni cha kawaida na chenye hadhi katika Kiswahili.
- source_word: יְהֹוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetafsiriwa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Huhifadhi wazo la unyoofu wa kimaadili pamoja na kutenda kwa haki.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Huhifadhi kiambishi cha nafsi ya kwanza wingi na ungamo la uhusiano wa jumuiya.
- source_word: מְרַחֵם
  choice: ni mwenye huruma
  rationale: Huwasilisha hali ya kudumu ya kuhurumia inayoonyeshwa na umbo la kushiriki la Kiebrania, kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania inatumia jina maalumu la Mungu; “Yahwe” hulihifadhi wazi bila kulibadilisha kuwa cheo.
- issue: Maana ya צַדִּיק
  choice: mwenye haki
  alternative: mwadilifu
  rationale: “Mwenye haki” huhifadhi kwa upana mvutano kati ya unyoofu wa tabia na haki katika matendo; “mwadilifu” pia linawezekana.
- issue: Nguvu ya מְרַחֵם
  choice: ni mwenye huruma
  alternative: huonyesha rehema
  rationale: Chaguo kuu linasisitiza tabia ya Mungu, huku mbadala ukisisitiza udhihirisho wake katika matendo.
