id: PSA.116.3
reference: Psalms 116:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֲפָפ֤וּ/נִי חֶבְלֵי מָ֗וֶת וּ/מְצָרֵ֣י שְׁא֣וֹל מְצָא֑וּ/נִי צָרָ֖ה וְ/יָג֣וֹן אֶמְצָֽא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/003.yaml
  text: The cords of death encircled me[a], and the distresses of Sheol found me; I found trouble and sorrow.
translation:
  language: sw
  text: 'Kamba za mauti zilinizunguka,

    na dhiki za Sheoli[a] zilinipata;

    nikapata taabu na huzuni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “kaburi” au “makao ya wafu.” Kiebrania: Sheoli.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: zilinizunguka
  rationale: Kitenzi hiki humaanisha kuzunguka au kufungia pande zote. “Zilinizunguka” ni Kiswahili cha kawaida na kinahifadhi taswira halisi ya hatari iliyomzingira msemaji.
- source_word: חֶבְלֵי מָוֶת
  choice: kamba za mauti
  rationale: חֶבֶל ni kamba au utepe wa kufungia. “Kamba za mauti” inadumisha sitiari ya mauti kama nguvu inayomfunga mtu, bila kuibadili kiufafanuzi kuwa mitego.
- source_word: וּמְצָרֵי שְׁאוֹל
  choice: na dhiki za Sheoli
  rationale: מֵצַר huonyesha hali ya kubanwa, taabu, au dhiki. “Dhiki” huwasilisha shinikizo hilo kwa lugha ya sasa, huku wingi “za” ukidumisha umbo la Kiebrania.
- source_word: שְׁאוֹל
  choice: Sheoli
  rationale: Uhamishaji wa jina hili kwa umbo la Kiswahili unahifadhi upana wa dhana ya Kiebrania—ulimwengu au makao ya wafu—bila kuipunguza iwe kaburi la mwili pekee.
- source_word: מְצָאוּנִי
  choice: zilinipata
  rationale: Maana ya msingi ni “zilinipata.” Chaguo hili pia linaandaa urudiaji wa mzizi uleule katika אֶמְצָא.
- source_word: צָרָה
  choice: taabu
  rationale: Neno hili linaweza kumaanisha shida, taabu, au dhiki. “Taabu” ni la kawaida na linaepusha kurudia “dhiki” ya mstari uliotangulia.
- source_word: וְיָגוֹן
  choice: na huzuni
  rationale: יָגוֹן humaanisha huzuni au majonzi. “Huzuni” ni ya kawaida, yenye hadhi, na inafaa katika ushairi huu.
- source_word: אֶמְצָא
  choice: nikapata
  rationale: “Nikapata” hudumisha uhusiano wa kimatamshi na “zilinipata,” hivyo kuhifadhi urudiaji wa kimakusudi wa mzizi מצא katika Kiebrania.
theological_decisions:
- issue: Ufasiri wa שְׁאוֹל
  choice: Sheoli
  alternative: kaburi; makao ya wafu
  rationale: “Sheoli” inahifadhi dhana pana ya Kiebrania na mvutano wake wa kifalsafa na kitheolojia bila kuamua kwamba inamaanisha kaburi la mwili pekee. Tanbihi inatoa maana mbadala zinazoeleweka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mistari mifupi inadumisha usambamba wa zaburi; urudiaji “zilinipata; nikapata” unawakilisha mchezo wa mzizi מצא katika chanzo.
