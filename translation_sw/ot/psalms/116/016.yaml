  text: אָֽנָּ֣ה יְהוָה֮ כִּֽי אֲנִ֪י עַ֫בְדֶּ֥/ךָ אֲֽנִי עַ֭בְדְּ/ךָ בֶּן אֲמָתֶ֑/ךָ פִּ֝תַּ֗חְתָּ לְ/מוֹסֵרָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/016.yaml
  text: Please[a], Yahweh, for I am your servant; I am your servant, the son of your maidservant[c][b]. You have loosed my bonds.
translation:
  language: sw
  text: Tafadhali, Ee Yahwe, kwa maana mimi ni mtumishi wako; mimi ni mtumishi wako, mwana wa mjakazi wako. Umefungua vifungo vyangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָֽנָּה
  choice: Ee
  rationale: Chembe hii ya ombi la dhati inafaa kutafsiriwa kwa neno la mwito lenye hisia katika Kiswahili. Hapa “Ee” ni ya asili zaidi kuliko “tafadhali” kabla ya jina la Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa na cheo kama “BWANA”.
- source_word: כִּי
  choice: mimi ni
  rationale: Ingawa כִּי mara nyingi ni “kwa maana,” katika muktadha huu inaweza kusisitiza tamko linalofuata. Kiswahili cha moja kwa moja “mimi ni” kinaendeleza ombi kwa ufasaha bila kulazimisha uhusiano wa kisababishi usio wa lazima.
- source_word: עַבְדֶּךָ / עַבְדְּךָ
  choice: mtumishi wako
  rationale: עבד inaweza kumaanisha mtumwa au mtumishi. Katika sala hii inaonyesha unyenyekevu na kuwa mali ya Mungu; “mtumishi wako” ni ya kawaida na yenye heshima, huku maana ya utegemezi ikibaki katika muktadha.
- source_word: בֶּן אֲמָתֶךָ
  choice: mwana wa mjakazi wako
  rationale: Huhifadhi kwa karibu muundo wa Kiebrania na jinsia ya אמה. “Mjakazi” ni neno la Kiswahili linaloeleweka kwa mtumishi wa kike, bila kuongeza wazo lisilosemwa la kuzaliwa katika nyumba.
- source_word: פִּתַּחְתָּ
  choice: umefungua
  rationale: Hii ndiyo maana ya msingi ya kitenzi; ikiunganishwa na vifungo, huonyesha kuvilegeza au kuviachilia huku ikihifadhi picha ya Kiebrania.
- source_word: לְמוֹסֵרָי
  choice: vifungo vyangu
  rationale: “Vifungo” hurejelea vizuizi vinavyomfunga mtu na huambatana kwa kawaida na “umefungua,” bila kubainisha kuwa ni minyororo au pingu.
theological_decisions:
- issue: Hadhi ya mtunga zaburi mbele za Mungu
  choice: mtumishi wako
  alternative: mtumwa wako
  rationale: Neno la Kiebrania linaweza kuonyesha utumwa halisi, lakini hapa tamko ni la uaminifu, unyenyekevu, na kuwa mali ya Yahwe. “Mtumishi” huwasilisha hilo kwa Kiswahili cha kawaida bila kufuta kabisa uzito wa uhusiano huo.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko lina jina binafsi la Mungu, si cheo. Kulitaja kama “Yahwe” huhifadhi tofauti hiyo katika tafsiri.
- issue: Nguvu ya כִּי baada ya ombi
  choice: kutotafsiri kwa kiunganishi tofauti
  alternative: kwa maana
  rationale: כִּי inaweza kuwa ya kisababishi au ya kusisitiza. Hapa Kiswahili “Ee Yahwe, mimi ni…” huhifadhi uwezekano wa tamko la kusisitiza na pia uhusiano wake na ombi bila kulifanya liwe hoja ya kisababishi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Marudio ya “mimi ni mtumishi wako” yamehifadhiwa kwa sababu ni ya kimakusudi katika Kiebrania; “naam” huonyesha msisitizo wa marudio hayo.
