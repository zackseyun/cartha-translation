  yaml_path: translation/ot/psalms/116/008.yaml
  text: For you have delivered my soul from death[a], my eyes from tears[b], my feet from stumbling.
translation:
  language: sw
  text: Kwa maana umeokoa nafsi yangu[a] kutoka mauti, macho yangu kutoka machozi, na mguu wangu kutoka kujikwaa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uhai wangu.” Neno la Kiebrania nefeshi linaweza kumaanisha nafsi, uhai, au mtu mwenyewe.
    reason: lexical_alternative
  - marker: b
    text: Au, “mguu wangu kutoka kuanguka.” Neno la Kiebrania linaweza kudokeza kujikwaa au kuanguka.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu au msingi wa sifa katika muktadha, kwa Kiswahili cha kawaida na chenye uzito.
- source_word: חִלַּצְתָּ
  choice: umeokoa
  rationale: Kitenzi hiki katika piel humaanisha kuokoa au kukomboa kutoka hatarini; hapa kinaongoza mfululizo wa matendo matatu ya Mungu ya kumwepusha mwimbaji.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: נֶפֶשׁ inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. ‘Nafsi yangu’ inadumisha upana wa neno la Kiebrania na uzito wa kishairi bila kulifupisha kuwa uhai wa mwili pekee.
- source_word: מִמָּוֶת
  choice: na mauti
  rationale: Katika Kiswahili, ‘kuokoa na mauti’ hueleza kwa kawaida na kwa ufupi kuondolewa katika hatari ya kufa.
- source_word: אֶת עֵינַי מִן דִּמְעָה
  choice: umeyaepusha macho yangu na machozi
  rationale: Kurudia kitenzi kwa namna ya ‘umeyaepusha’ kunafanya kiungo kilichoachwa katika ushairi wa Kiebrania kieleweke kwa kawaida katika Kiswahili huku picha ya macho na machozi ikihifadhiwa.
- source_word: אֶת רַגְלִי מִדֶּחִי
  choice: na mguu wangu na kujikwaa
  rationale: Umoja wa Kiebrania ‘mguu wangu’ umehifadhiwa. דֶּחִי huweza kueleza kujikwaa, kuanguka, au kusukumwa chini; ‘kujikwaa’ inafaa katika picha ya hatua inayozuiwa isianguke.
theological_decisions:
- issue: Maana ya kiantropolojia ya נַפְשִׁי
  choice: nafsi yangu
  alternative: uhai wangu; mimi
  rationale: Muktadha wa ‘mauti’ unaruhusu maana ya ‘uhai wangu,’ lakini ‘nafsi yangu’ huhifadhi upana na mvutano wa kishairi wa neno la Kiebrania bila kuamua kuwa linahusu uhai wa mwili pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa vipashio vitatu umehifadhiwa; kitenzi cha pili kimewekwa wazi ili sentensi isomeke kwa kawaida, huku kitenzi hicho hicho kikieleweka kutawala kipashio cha mwisho.
