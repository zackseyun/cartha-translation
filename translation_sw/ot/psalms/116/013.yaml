  text: כּוֹס יְשׁוּע֥וֹת אֶשָּׂ֑א וּ/בְ/שֵׁ֖ם יְהוָ֣ה אֶקְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/013.yaml
  text: I will lift up the cup of salvations[a], and I will call on the name of Yahweh.
translation:
  language: sw
  text: Nitaliinua kikombe cha wokovu[a], na nitaliitia jina la Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, neno hili ni la wingi, kihalisi “wokovu” au “ukombozi” kwa wingi; huenda ni wingi wa kishairi unaosisitiza wokovu au matendo mbalimbali ya kuokoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס
  choice: kikombe
  rationale: Neno hilo humaanisha chombo cha kunywea. “Kikombe” ni neno la kawaida na la asili katika Kiswahili, nalo linahifadhi picha ya kishairi bila kuingiza maana maalumu ya kiliturujia.
- source_word: יְשׁוּעוֹת
  choice: wokovu
  rationale: Umbo la Kiebrania ni la wingi, yaani “wokovu” au “ukombozi” kwa wingi, lakini hapa huenda ni wingi wa kishairi unaosisitiza wokovu au matendo ya kuokoa. Kiswahili cha kawaida hutumia “wokovu” kama nomino dhahania isiyohesabika; tanbihi inahifadhi tofauti ya idadi katika Kiebrania.
- source_word: אֶשָּׂא
  choice: nitaliinua
  rationale: Kitenzi נשׂא kinaweza kumaanisha kuinua, kubeba, au kuchukua. Pamoja na “kikombe,” “nitaliinua” kinatoa picha ya kukiinua kikombe kwa shukrani na pia kinaonyesha kiambishi cha yambwa kinacholingana na “kikombe.”
- source_word: וּ/בְ/שֵׁם ... אֶקְרָא
  choice: na nitaliitia jina
  rationale: Muundo קרא בשם ni nahau ya kumwita au kumwomba Mungu kwa kulitaja jina lake. “Kuliitia jina” huhifadhi kwa ufupi picha ya Kiebrania ya kuliitia jina, badala ya kuibadili kuwa kutaja tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: “Yahwe” ni umbo linalofaa mfumo wa sauti na tahajia ya Kiswahili kwa jina la Mungu יהוה, na linahifadhi jina binafsi badala ya kulibadili kuwa cheo kama “BWANA.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina la Mungu יהוה. “Yahwe” huhifadhi jina hilo katika umbo la kawaida kwa Kiswahili bila kulibadili kuwa cheo; “Yehova” ni umbo jingine la mapokeo.
- issue: Wingi wa יְשׁוּעוֹת
  choice: wokovu katika matini, huku wingi wa Kiebrania ukielezwa katika tanbihi
  alternative: wokovu mwingi; matendo ya ukombozi
  rationale: Kiebrania kina umbo la wingi, ambalo linaweza kuonyesha matukio mengi ya kuokolewa au wingi wa kusisitiza. Tafsiri “wokovu” ni ya asili zaidi katika Kiswahili na haifungi maana kwa mojawapo ya maelezo hayo; tanbihi inahifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. “Nitaliinua” na “nitaliitia” zinadumisha usambamba wa vitenzi vya Kiebrania; jina “Yahwe” limetoholewa kwa tahajia inayofaa Kiswahili.
