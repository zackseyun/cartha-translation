lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: Niliamini
  rationale: Kitenzi hiki cha mzizi אמן katika Hifili kinaonyesha kuamini au kutumaini. “Niliamini” ni tafsiri ya moja kwa moja, ya kawaida, na haiongezi kitu kisichokuwamo katika Kiebrania.
- source_word: כִּי
  choice: kwa hiyo
  rationale: Chembe hii inaweza kuonyesha matokeo, sababu, au maudhui. Katika mstari huu, “kwa hiyo” inaunganisha kwa uwazi kuamini na kusema, huku uwezekano wa maana nyingine ukihifadhiwa katika tanbihi.
- source_word: אֲדַבֵּר
  choice: nikasema
  rationale: Ingawa umbo la Kiebrania ni la kitenzi kisichotimilika, katika ushairi linaweza kueleza tendo la wakati uliopita au tendo la kawaida. “Nikasema” linafuata kwa kawaida tendo la “niliamini” katika Kiswahili.
- source_word: אֲנִי
  choice: ni- katika “nimeteseka”
  rationale: Kiwakilishi huru cha Kiebrania kinakazia msemaji. Kiswahili huonyesha nafsi katika kiambishi cha kitenzi; sentensi ya moja kwa moja “Nimeteseka sana” inadumisha mkazo huo bila kurudia “mimi” kwa namna isiyo ya kawaida.
- source_word: עָנִיתִי
  choice: nimeteseka
  rationale: Neno hili linaeleza kupatwa na mateso au dhiki. “Nimeteseka” ni Kiswahili cha sasa, kinachoeleweka kwa urahisi, na kinaweza kueleza hali iliyotokana na mateso yaliyompata msemaji.
- source_word: מְאֹד
  choice: sana
  rationale: Hiki ni kielezi cha kiwango kikubwa. “Sana” ni tafsiri ya kawaida na sahihi katika Kiswahili.
theological_decisions:
- issue: Uhusiano wa kisintaksia kati ya kuamini na kusema
  choice: 'Kuamini kunaonyeshwa kuwa kuliongoza kwenye kusema: “Niliamini, kwa hiyo nikasema, ‘Nimeteseka sana.’”'
  alternative: Inaweza pia kueleweka, “Niliamini, kwa maana/n kwa sababu nasema, ‘Nimeteseka sana,’” au “Niliamini hata niliposema, ‘Nimeteseka sana.’”
  rationale: Sintaksia ya Kiebrania imebanwa, na כִּי inaweza kufasiriwa kwa njia zaidi ya moja. Tafsiri kuu inatoa mtiririko wa kawaida wa Kiswahili, lakini tanbihi zinahifadhi utata halisi bila kuamua suala la kitheolojia ambalo maandishi yenyewe hayajaamua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nimeteseka sana” ni wazi kwa wasomaji wa kawaida na hudumisha uzito wa kilio bila kutumia msamiati wa kimadhehebu.
