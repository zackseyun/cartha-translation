base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/010.yaml
  text: 'I believed[b][a], therefore I spoke: “I am greatly afflicted.”'
translation:
  language: sw
  text: Niliamini[b], kwa hiyo[a] nikasema, “Nimeteseka sana.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa maana/kwa sababu ninasema”; neno la Kiebrania כִּי linaweza kueleweka kwa njia zaidi ya moja.
    reason: lexical_alternative
  - marker: b
    text: Au “Niliamini hata niliposema, ‘Niliteseka sana.’” Sintaksia ya Kiebrania imebanwa na inaweza kuunganishwa kwa njia tofauti.
