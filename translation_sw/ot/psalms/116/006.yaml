  text: Yahweh preserves the simple[a]; I was brought low[c][b], and he saved me.
translation:
  language: sw
  text: Yahwe huwalinda watu wasio na uzoefu[a]; nilikuwa dhaifu[b], naye akaniokoa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu sahili,” “wasio na tahadhari,” au “wasio na hila.” Kiebrania kinamaanisha watu wasio na uzoefu au wasio macho kwa hila, si lazima wapumbavu kimaadili.
    reason: lexical_alternative
  - marker: b
    text: Au, “nililetwa chini” au “nilidhoofishwa.” Kiebrania kinaweza kueleza kupungukiwa nguvu, kushushwa hali, au kunyenyekezwa.
    reason: lexical_alternative
