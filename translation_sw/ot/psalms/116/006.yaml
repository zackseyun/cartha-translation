    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמֵר
  choice: huwalinda
  rationale: Kitenzi cha hali endelevu kinaonyesha tendo la kawaida au linaloendelea la kulinda na kutunza.
- source_word: פְּתָאיִם
  choice: watu wasio na uzoefu
  rationale: Neno hili humaanisha watu sahili, wasio na uzoefu, au wasio macho kwa hila; si lazima liwe hukumu kwamba wao ni wapumbavu kimaadili.
- source_word: יְהֹוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetafsiriwa kwa kulitamka moja kwa moja badala ya kulibadilisha kuwa cheo.
- source_word: דַּלּוֹתִי
  choice: nilipodhoofika
  rationale: Kauli hii ya Kiebrania inaweza kueleza kushuka hali, kupungukiwa nguvu, au kuletwa chini. Muundo wa Kiswahili unaonyesha hali ambayo mwimbaji alijikuta nayo bila kuifunga kwenye umaskini wa mali pekee.
- source_word: וְלִי
  choice: aka-
  rationale: Maana ya kutendewa kwa niaba ya msemaji imeingizwa kiasili katika kiambishi cha yambwa “-ni” ndani ya “akaniokoa.”
- source_word: יְהוֹשִׁיעַ
  choice: akaniokoa
  rationale: Hifili ya ישׁע humaanisha kuokoa au kuponya kutoka hatarini; “akaniokoa” ni ya moja kwa moja na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina maalumu la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Hali ya watu wanaoitwa פְּתָאיִם
  choice: watu wasio na uzoefu
  alternative: watu sahili / wasio na tahadhari
  rationale: Neno hilo halimaanishi kwa lazima upumbavu wa kimaadili. Tafsiri kuu na tanbihi huhifadhi uwezekano wa kutokuwa na uzoefu, kuwa sahili, au kutokuwa macho kwa hila.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya kishairi. “Huwalinda” huonyesha tendo endelevu; “nilipodhoofika, akaniokoa” huunganisha hali na wokovu kwa urahisi bila kuondoa upana wa maana ya Kiebrania.
