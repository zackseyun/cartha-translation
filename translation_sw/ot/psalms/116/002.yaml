lexical_decisions:
- source_word: כִּי
  choice: Kwa kuwa
  rationale: Inaonyesha sababu ya kauli iliyotangulia kwa Kiswahili cha sasa na chenye hadhi.
- source_word: הִטָּה אָזְנוֹ
  choice: ameelekeza sikio lake
  rationale: Inahifadhi taswira ya Kiebrania ya kulielekeza sikio kwa mtu ili kumsikiliza kwa makini; usemi huu unaeleweka kwa Kiswahili.
- source_word: לִי
  choice: kwangu
  rationale: Inaonyesha mwelekeo wa sikio kwa msemaji kwa namna ya kawaida katika Kiswahili.
- source_word: וּבְיָמַי
  choice: siku zote za maisha yangu
  rationale: Kihalisi ni ‘na katika siku zangu’; katika muktadha huu ni nahau inayoonyesha muda wote wa maisha ya mtunga zaburi.
- source_word: אֶקְרָא
  choice: nitamwita
  rationale: Kitenzi kinaweza kumaanisha kuita au kumwomba Mungu; kiwakilishi ‘-m-’ kinatokana na rejeleo la muktadha bila kufafanua zaidi namna ya mwito.
