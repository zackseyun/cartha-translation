  variant: Standard East African Swahili
source:
  edition: WLC
  text: בְּ/חַצְר֤וֹת בֵּ֤ית יְהוָ֗ה בְּֽ/ת֘וֹכֵ֤/כִי יְֽרוּשָׁלִָ֗ם הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/019.yaml
  text: in the courts of the house of Yahweh[a], in your midst, Jerusalem[b]. Praise Yah!
translation:
  language: sw
  text: katika nyua za nyumba ya Yahwe[a], katikati yako, Ee Yerusalemu. Msifuni Yah![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika nyua za hekalu la Yahwe.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “Msifuni Yah!”—usemi ambao ndio asili ya neno “Haleluya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַצְרוֹת
  choice: katika nyua
  rationale: Nomino חָצֵר katika wingi humaanisha maeneo ya ua yaliyozungushiwa, hasa nyua za eneo la hekalu. “Nyua” ni Kiswahili cha kawaida na huhifadhi taswira ya mahali.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Hii huhifadhi usemi halisi wa Kiebrania “nyumba ya YHWH”; katika muktadha unarejelea hekalu bila kubadili moja kwa moja neno “nyumba” kuwa tafsiri ya kifafanuzi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili, badala ya kubadilishwa na cheo “BWANA.”
- source_word: בְּתוֹכֵכִי
  choice: katikati yako
  rationale: Umbo hili ni nafsi ya pili, umoja wa kike, likiliambia Yerusalemu moja kwa moja. “Katikati yako” huhifadhi uhuishaji huo wa mji.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalemu
  rationale: Jina la mahali limetolewa kwa umbo lililozoeleka katika Kiswahili sanifu.
- source_word: הַלְלוּ יָהּ
  choice: Msifuni Yah!
  rationale: Kitenzi ni amri ya wingi, kwa hiyo “Msifuni” huonyesha kwamba kundi linaagizwa. “Yah” huhifadhi jina fupi la Mungu na vipashio vya usemi ambao ndio chanzo cha “Haleluya.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi kama jina bila kuingiza desturi ya kulibadili kuwa “BWANA.”
- issue: Uwasilishaji wa יָהּ katika mwito wa mwisho
  choice: Yah
  alternative: BWANA; Haleluya
  rationale: יָהּ ni umbo fupi la jina la Mungu. “Msifuni Yah!” huonyesha wazi maana ya vipashio vya Kiebrania na wakati huohuo huhifadhi tofauti yake na יְהוָה iliyotangulia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Ee Yerusalemu” huweka wazi mwito wa moja kwa moja kwa mji; “Msifuni” huhifadhi amri ya wingi.
