base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/012.yaml
  text: What shall I return to Yahweh for all his benefits to me?[a]
translation:
  language: sw
  text: Nitamrudishia Yahweh nini kwa mema yote aliyonitendea?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nitamlipa Yahweh nini kwa matendo yake yote kwangu?” Neno la Kiebrania linaweza kumaanisha matendo, malipo, au mema aliyomtendea mtu; tafsiri kuu imetumia “mema” kwa sababu muktadha ni wa shukrani.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: nini
  rationale: Kiwakilishi cha kuuliza kinachoanzisha swali; “nini” kinafuata muundo wa Kiebrania kwa uwazi.
- source_word: אָשִׁיב
  choice: nitamrudishia
  rationale: Hifili ya שוב ina wazo la kurudisha. Katika muktadha huu, “nitamrudishia” ni Kiswahili cha asili kinachodokeza kuitikia wema bila kulazimisha maana ya kulipa deni.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: ל huonyesha anayeelekezewa kitendo, naye יהוה ni jina la agano; muundo wa kitenzi cha Kiswahili “nitamrudishia” tayari unajumuisha maana ya “kwa/to.”
- source_word: כָּל
  choice: yote
  rationale: Huonyesha ujumla wa matendo mema ya Yahweh; upatanisho wa kisarufi unafuata nomino “mema.”
- source_word: תַּגְמוּלֹהִי
  choice: mema yote aliyonitendea
  rationale: Neno גמול linaweza kumaanisha matendo, malipo, au manufaa. Katika muktadha wa shukrani, kifungu hiki kinaonyesha kwa njia ya kawaida matendo ya neema yaliyomfikia mtunga zaburi.
- source_word: עָלַי
  choice: aliyonitendea
  rationale: על hapa huonyesha matendo yaliyoelekezwa kwa mtunga zaburi; umbo la Kiswahili “-nitendea” linawasilisha uhusiano huo kwa ufasaha.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Iwapo jibu la mtunga zaburi ni malipo yanayolingana na wema wa Mungu
  choice: “Nitamrudishia” bila kudai kuwa anaweza kulipa kikamilifu
  alternative: “Nitam偿/lipa” (nitamlipa)
  rationale: Kitenzi שוב katika hifili kimsingi kina maana ya kurudisha; tafsiri hii huhifadhi mvutano wa swali bila kuingiza dhana kwamba neema ya Mungu inaweza kulipwa kama deni.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nitamrudishia nini” ni usemi wa kawaida unaohifadhi picha ya kurudisha; “mema yote aliyonitendea” huepuka nomino nzito kama “manufaa” na kueleweka kwa wasomaji wa kawaida.
