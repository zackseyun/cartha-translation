  yaml_path: translation/ot/psalms/116/009.yaml
  text: I will walk before Yahweh in the lands of the living[a].
translation:
  language: sw
  text: Nitatembea mbele ya Yahwe katika nchi za walio hai[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nitaishi mbele ya Yahwe katika nchi ya walio hai.” Nahau ya Kiebrania “kutembea mbele ya” inaweza pia kueleza namna mtu anavyoishi, na “nchi” iliyo katika wingi inaweza kueleweka kwa ujumla kuwa nchi au eneo moja.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶתְהַלֵּךְ
  choice: Nitatembea
  rationale: Kitenzi hiki ni Hitpael imperfect nafsi ya kwanza umoja cha הלך. “Nitatembea” huhifadhi picha halisi ya kutembea na pia huruhusu maana pana ya kuendelea kuishi au kuenenda kwa namna fulani bila kuibana.
- source_word: לִפְנֵי
  choice: mbele za
  rationale: “Mbele za” ni usemi wa kawaida wa Kiswahili unaoweza kumaanisha kuwa mbele ya mtu au kuishi katika uwepo wake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa unukuzi “Yahwe” badala ya kulibadilisha kuwa cheo.
- source_word: בְּאַרְצוֹת
  choice: katika nchi za
  rationale: Nomino ya Kiebrania iko katika wingi. Wingi umehifadhiwa ili kuakisi umbo la matini, ingawa katika muktadha usemi huo unaweza kutaja kwa ujumla eneo au ulimwengu wa walio hai.
- source_word: הַחַיִּים
  choice: walio hai
  rationale: Neno hili ni umbo la wingi lenye maana ya watu walio hai. “Walio hai” ni Kiswahili cha kawaida na huhifadhi maana hiyo moja kwa moja.
theological_decisions:
- issue: Je, mstari ueleweke kama kuendelea kuishi baada ya kuokolewa au kama mwenendo wa maisha mbele za Mungu?
  choice: Nahau ya kutembea imehifadhiwa bila kuamua kuwa inamaanisha kuishi tu au mwenendo wa kiroho tu.
  alternative: Nitaishi mbele za Yahwe katika nchi ya walio hai.
  rationale: Kiebrania kinaweza kuonyesha kuendelea kuishi baada ya kuokolewa na pia maisha yanayoendeshwa katika uwepo wa Mungu. “Nitatembea mbele za Yahwe” huhifadhi mvutano huo wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Usemi “mbele za Yahwe” umechaguliwa ili kuhifadhi nahau ya Kiebrania kwa lugha ya heshima na ya asili.
