  text: שׁוּבִ֣י נַ֭פְשִׁ/י לִ/מְנוּחָ֑יְ/כִי כִּֽי יְ֝הוָ֗ה גָּמַ֥ל עָלָֽיְ/כִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/007.yaml
  text: Return[a], my soul, to your rest, for Yahweh has dealt bountifully with you.
translation:
  language: sw
  text: Rudi, ee nafsi yangu, katika pumziko lako, kwa maana Yahweh amekutendea mema.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “amekuwa mwema kwako” au “amekutendea kwa ukarimu.” Kitenzi cha Kiebrania kinaweza kumaanisha kumtendea au kumlipa mtu; hapa muktadha unaonyesha kuwa tendo hilo ni jema.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבִי
  choice: Rudi
  rationale: Ni amri ya nafsi ya kike umoja kutoka שוב, ikielekezwa kwa נַפְשִׁי. “Rudi” kwa kawaida huonyesha kurejea katika hali ya awali bila kuongeza ufafanuzi usiomo katika Kiebrania.
- source_word: נַפְשִׁי
  choice: ee nafsi yangu
  rationale: נפשׁ hapa ni namna ya mtunga zaburi kujisemeza mwenyewe. “Nafsi yangu” huhifadhi taswira hiyo ya kishairi, na “ee” huifanya sentensi ya kujisemeza isikike wazi na kawaida katika Kiswahili.
- source_word: לִמְנוּחָיְכִי
  choice: katika pumziko lako
  rationale: מנוחה linaweza kumaanisha pumziko au mahali pa kupumzikia. “Katika pumziko lako” ni usemi wa kawaida unaohifadhi wazo la kurudi kwenye hali ya utulivu; kiambishi cha nafsi ya pili ya kike umoja kinaakisiwa na “lako.”
- source_word: כִּי
  choice: kwa maana
  rationale: כִּי hapa hutanguliza sababu ya amri. “Kwa maana” huunganisha kauli hizo kwa lugha yenye hadhi na ya kishairi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahweh,” badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: גָּמַל עָלָיְכִי
  choice: amekutendea mema
  rationale: גמל pamoja na על hueleza jinsi mtu alivyomtendea mwingine, na tendo hilo linaweza kuwa jema au baya kulingana na muktadha. Katika zaburi hii ya shukrani maana ni njema; “amekutendea mema” ni ya asili katika Kiswahili na haiifanyi kitenzi kimaanishe tu hali ya kuwa mwema.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ina jina la agano יהוה moja kwa moja. “Yahweh” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Nguvu chanya ya גמל katika muktadha
  choice: amekutendea mema
  alternative: amekulipa au amekutendea
  rationale: Kitenzi chenyewe kinaweza kumaanisha kutenda, kulipa, au kumpa mtu anachostahili, kwa uzuri au ubaya. Muktadha wa shukrani unaonyesha tendo jema, lakini tafsiri haiongezi dai mahususi kuhusu thawabu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini kinachoeleweka kwa urahisi. Usemi “ee nafsi yangu” huhifadhi kujisemeza kwa mtunga zaburi, huku “pumziko lako” ikidumisha taswira bila kuamua kama ni hali ya utulivu au mahali pa kupumzikia.
