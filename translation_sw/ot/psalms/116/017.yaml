lexical_decisions:
- source_word: לְךָ
  choice: nitakutolea
  rationale: Kiambishi cha yambwa “-ku-” pamoja na “-tolea” kinaonyesha kwa Kiswahili cha kawaida kwamba Mungu ndiye anayepokea dhabihu.
- source_word: אֶזְבַּח
  choice: nitakutolea dhabihu
  rationale: Kitenzi זבח hapa kinahusu tendo la kutoa dhabihu; tafsiri hii ni ya kawaida na inahifadhi maana ya ibada kuliko kutumia neno linalosisitiza kuchinja pekee.
- source_word: זֶבַח תּוֹדָה
  choice: dhabihu ya shukrani
  rationale: Muundo huu unamaanisha dhabihu inayotolewa kwa shukrani; maneno haya yanahifadhi wazi dhana zote mbili za dhabihu na shukrani.
- source_word: וּבְשֵׁם ... אֶקְרָא
  choice: nami nitaliitia jina la ...
  rationale: Hii ni nahau ya kumwomba au kumwabudu Mungu kwa kulitaja jina lake; “kuliitia jina” ni usemi wa kibiblia unaoeleweka na hauongezi namna maalumu ya ibada isiyotajwa katika Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limeandikwa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.” Tahajia hii ni ya kawaida katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” huhifadhi jina binafsi lililo katika chanzo, huku tanbihi ikieleza desturi nyingine za kulitafsiri.
- issue: Maana ya זֶבַח תּוֹדָה
  choice: dhabihu ya shukrani
  alternative: sadaka ya shukrani
  rationale: “Dhabihu ya shukrani” huhifadhi istilahi ya dhabihu na kusudi la kushukuru bila kuamua zaidi ya kile kinachosemwa na maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Kiunganishi “nami” hudumisha mtiririko wa kishairi wa sentensi mbili, na alama ya tanbihi imewekwa moja kwa moja baada ya jina la Mungu linalofafanuliwa.
