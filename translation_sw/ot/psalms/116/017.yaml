  text: To you I will offer a sacrifice of thanksgiving[a], and I will call on the name of Yahweh.
translation:
  language: sw
  text: Nitakutolea dhabihu ya shukrani, nami nitaliitia jina la Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa desturi hutafsiriwa “BWANA.” Namna nyingine za kuandika jina hilo ni “Yahweh” na “Yehova.”'
