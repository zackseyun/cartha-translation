  text: 'Then I called on the name of the LORD: “Please, LORD, rescue my life!”'
translation:
  language: sw
  text: 'Ndipo nikaliitia jina la BWANA: “Tafadhali, Ee BWANA, uokoe maisha yangu!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְשֵׁם יְהוָה אֶקְרָא
  choice: Ndipo nikaliitia jina la BWANA
  rationale: Kitenzi קרא pamoja na בְּשֵׁם humaanisha kumwita au kumwomba Mungu kwa jina lake. Wakati uliopita unafaa katika muktadha wa simulizi, na kiunganishi kimetafsiriwa kwa mtiririko wa kawaida wa Kiswahili.
- source_word: אָנָּה
  choice: Tafadhali
  rationale: Chembe hii inaonyesha ombi la dhati na la kusihi; “tafadhali” ni ya kawaida na wazi katika Kiswahili cha sasa.
- source_word: מַלְּטָה
  choice: uokoe
  rationale: Imperativi ya פלט inaomba kuponywa au kuokolewa kutoka hatarini; “uokoe” ni ya moja kwa moja na ya kawaida.
- source_word: נַפְשִׁי
  choice: maisha yangu
  rationale: Katika muktadha wa kuokolewa kutoka mauti, נֶפֶשׁ humaanisha uhai au maisha ya mtu, si lazima sehemu isiyo ya kimwili inayoitwa nafsi.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: “BWANA” kwa herufi kubwa hufuata desturi iliyoenea ya tafsiri za Biblia za Kiswahili na kutofautisha jina la agano na neno la kawaida la bwana, bila kuingiza msimamo wa kimadhehebu.
- issue: Maana ya נַפְשִׁי
  choice: maisha yangu
  alternative: nafsi yangu
  rationale: Hapa mwombaji anaomba kuponywa kutoka mauti; “maisha yangu” huwasilisha maana ya kimuktadha bila kulazimisha fundisho la sehemu za binadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Ombi la moja kwa moja limehifadhiwa kwa alama za kunukuu.
