lexical_decisions:
- source_word: אֲנִי אָמַרְתִּי
  choice: Nilisema
  rationale: Kitenzi cha Kiswahili tayari hubeba nafsi ya kwanza umoja; ‘nilisema’ ni cha kawaida na hudumisha sauti ya tafakari bila kuongeza uzito usio katika chanzo.
- source_word: בְחָפְזִי
  choice: kwa hofu yangu
  rationale: Katika muktadha wa dhiki, usemi huu unaonyesha hali ya kushtuka na kufadhaika, si kufanya jambo kwa kasi tu. Tanbihi inadumisha maana mbadala ya haraka.
- source_word: כָּל הָאָדָם
  choice: Kila mtu
  rationale: אָדָם limetumiwa kwa maana ya jumla ya wanadamu. ‘Kila mtu’ ni Kiswahili asilia kinachohifadhi upeo wa כָּל bila kuufanya usemi uhusu wanaume pekee.
- source_word: כֹּזֵב
  choice: ni mwongo
  rationale: Umbo hili linaeleza mtu mwenye sifa ya kusema uongo au kutokuwa mwaminifu; ‘ni mwongo’ huhifadhi nguvu ya kauli ya Kiebrania kuliko ‘si wa kweli.’
