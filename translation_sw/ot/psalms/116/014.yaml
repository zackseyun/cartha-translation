  yaml_path: translation/ot/psalms/116/014.yaml
  text: I will fulfill my vows to Yahweh in the presence of all his people[a][b].
translation:
  language: sw
  text: Nitatimiza nadhiri zangu kwa Yahweh, naam, mbele ya watu wake wote[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nitalipa nadhiri zangu kwa Yahweh.” Kitenzi cha Kiebrania kinaweza kumaanisha “kulipa” kwa maana ya kutekeleza kikamilifu yale ambayo mtu ameweka nadhiri.
    reason: lexical_alternative
  - marker: b
    text: Chembe ya Kiebrania iliyotafsiriwa “naam” huongeza msisitizo; inaweza pia kutafsiriwa “sasa” au “hakika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדָרַי
  choice: nadhiri zangu
  rationale: Nomino נֶדֶר katika wingi ikiwa na kiambishi cha nafsi ya kwanza humaanisha ahadi rasmi ambazo msemaji ameweka; “nadhiri zangu” ni usemi wa kawaida na sahihi katika Kiswahili.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Kihusishi ל hapa humtaja Yahweh kuwa ndiye anayehusika na kutimiziwa kwa nadhiri; “kwa Yahweh” ni ya asili katika Kiswahili na huhifadhi jina la agano יְהוָה.
- source_word: אֲשַׁלֵּם
  choice: nitatimiza
  rationale: Piel ya שׁלם katika muktadha wa nadhiri humaanisha kutekeleza kikamilifu jambo lililoahidiwa. “Nitatimiza” huwasilisha maana hiyo vizuri kuliko tafsiri ya moja kwa moja “nitalipa.”
- source_word: נֶגְדָה
  choice: mbele ya
  rationale: Neno hili huonyesha kuwapo mbele ya hadhira au katika uwepo wao; hapa linaonyesha kuwa kutimizwa kwa nadhiri kutakuwa hadharani.
- source_word: נָא
  choice: imewakilishwa kwa msisitizo wa sentensi nzima
  rationale: Katika mstari huu נָא ni chembe ya msisitizo, si ombi. Kiswahili hakihitaji neno tofauti ili kuifanya sentensi iwe ya asili; uwezekano wa “sasa” au “naam” umehifadhiwa katika tanbihi.
- source_word: לְכָל עַמּוֹ
  choice: ya watu wake wote
  rationale: 'Ikiunganishwa na נֶגְדָה, fungu hili hutaja hadhira yote itakayoshuhudia kutimizwa kwa nadhiri: “mbele ya watu wake wote.”'
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni, jina la agano. “Yahweh” hulihifadhi kama jina maalumu bila kulibadilisha kuwa cheo.
- issue: Maana ya kutimiza nadhiri
  choice: nitatimiza nadhiri zangu
  alternative: nitalipa nadhiri zangu
  rationale: Kitenzi kinaweza kuelezwa kwa lugha ya malipo, lakini hapa kinamaanisha kutekeleza kile kilichoahidiwa. Tafsiri haiongezi dai kwamba nadhiri hizo ni sadaka pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Nadhiri” ni istilahi iliyozoeleka ya ahadi rasmi ya kidini; “mbele ya watu wake wote” huhifadhi hali ya kutimiza nadhiri hadharani.
