  text: וְ/הֵ֗מָּה לְ֭/שׁוֹאָה יְבַקְשׁ֣וּ נַפְשִׁ֑/י יָ֝בֹ֗אוּ בְּֽ/תַחְתִּיּ֥וֹת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/009.yaml
  text: But they[a], who seek my life, to destroy it[b], will go into the depths of the earth.
translation:
  language: sw
  text: Lakini wao, wanaoutafuta uhai wangu ili kuuangamiza[a], wataingia katika vilindi vya ardhi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “wanaoutafuta uhai wangu kwa maangamizi.”
    reason: lexical_alternative
  - marker: b
    text: Au, kwa tafsiri halisi zaidi, “sehemu za chini za ardhi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה
  choice: Lakini wao
  rationale: Kiunganishi kinaeleweka kwa maana ya upinzani katika muktadha, nacho kiwakilishi cha msisitizo kimehifadhiwa kwa ‘wao’.
- source_word: לְשׁוֹאָה
  choice: ili wauangamize
  rationale: Neno hili lina maana ya maangamizi au uharibifu. Muundo wa kusudi unatoa Kiswahili cha kawaida huku ukihifadhi nia ya adui dhidi ya uhai wa mtunga zaburi.
- source_word: יְבַקְשׁוּ נַפְשִׁי
  choice: wanaoutafuta uhai wangu
  rationale: Katika muktadha huu נֶפֶשׁ ni uhai wa mtu, si ‘roho’ kama sehemu isiyo ya mwili. Tafsiri hii pia inahifadhi kwa kiasi kikubwa mpangilio na taswira ya Kiebrania.
- source_word: יָבֹאוּ
  choice: wataingia
  rationale: Ingawa kitenzi kimsingi ni ‘watakuja,’ ‘wataingia’ ni cha asili zaidi pamoja na mahali wanakoelekea na kinaendeleza wazo la kushuka katika vilindi.
- source_word: בְּתַחְתִּיּוֹת הָאָרֶץ
  choice: katika vilindi vya ardhi
  rationale: Hii ni kauli ya kishairi kuhusu sehemu za chini au za kina za ardhi. ‘Vilindi vya ardhi’ ni ya asili, yenye hadhi, na haigeuzi taswira hiyo kuwa istilahi maalumu ya mafundisho kuhusu maisha baada ya kifo.
theological_decisions:
- issue: Maana ya kuingia katika vilindi vya ardhi
  choice: Taswira ya kishairi ya kifo, kaburi, au kushushwa katika hukumu
  alternative: Sehemu za chini za ardhi kwa maana halisi zaidi, au ulimwengu wa wafu
  rationale: Kiebrania kinaacha taswira hii ikiwa pana. Tafsiri haijaitambulisha moja kwa moja na Sheoli wala kuifafanua kuwa fundisho maalumu kuhusu ulimwengu wa wafu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Uhai wangu’ huepuka maana isiyofaa ya nafsi isiyo ya mwili, na ‘vilindi vya ardhi’ huhifadhi fumbo na mvutano wa taswira ya Kiebrania.
