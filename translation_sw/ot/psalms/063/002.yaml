base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/002.yaml
  text: So I have looked upon you in the sanctuary[a], to see your power and your glory.
translation:
  language: sw
  text: Hivyo nimekutazama katika patakatifu[a], ili nione nguvu zako na utukufu wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Hivyo, katika mahali patakatifu nilikuona.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Hivyo
  rationale: Neno hili huonyesha namna au uhusiano na hamu iliyotangulia; “Hivyo” ni kiunganishi cha kawaida kinachohifadhi maana ya “vivyo/hivi” bila kufafanua mantiki kupita kiasi.
- source_word: בַּקֹּדֶשׁ
  choice: katika patakatifu
  rationale: Katika muktadha wa ibada, קֹדֶשׁ inaelekea kumaanisha mahali patakatifu au patakatifu pa Mungu, ingawa maana ya jumla ya utakatifu inawezekana. “Katika patakatifu” ni ya asili na yenye heshima katika Kiswahili.
- source_word: חֲזִיתִיךָ
  choice: nimekutazama
  rationale: Kitenzi חזה kinaweza kueleza kuona kwa makini au kwa kutafakari, si kuona kwa muda mfupi tu. “Nimekutazama” huhifadhi uzito huo wa uzoefu.
- source_word: לִרְאוֹת
  choice: ili nione
  rationale: Infinitivu inaeleza kusudi; “ili nione” huwasilisha kusudi hilo kwa uwazi na kwa Kiswahili cha kawaida.
- source_word: עֻזְּךָ
  choice: nguvu zako
  rationale: עֹז humaanisha nguvu, uwezo, au uweza. “Nguvu zako” ni usemi wazi na wa kawaida unaofaa sambamba na “utukufu wako.”
- source_word: וּכְבוֹדֶךָ
  choice: na utukufu wako
  rationale: כָּבוֹד inapomhusu Mungu kwa kawaida humaanisha utukufu—adhama yake yenye uzito na inayodhihirika. “Utukufu” huhifadhi maana hiyo.
theological_decisions:
- issue: Maana ya kumwona Mungu katika patakatifu
  choice: Aya inasema moja kwa moja kwamba mtunga zaburi amemtazama Mungu katika patakatifu ili aone nguvu na utukufu wake, bila kueleza namna ya kuona huko.
  alternative: Kueleza kuwa alikuwa akikumbuka tu ibada ya zamani, au kwamba alipata ono la fumbo la asili ya Mungu.
  rationale: Kiebrania huacha uhusiano wa wakati na namna ya kumwona Mungu ukiwa wa kishairi. Tafsiri inadumisha kauli ya moja kwa moja bila kuifanya iwe ono halisi la asili ya Mungu wala kumbukumbu tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Patakatifu” linatunza mazingira ya ibada, huku tanbihi ikionyesha tafsiri mbadala ya חזה na קֹדֶשׁ.
