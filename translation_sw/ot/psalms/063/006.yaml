  text: When I remember you on my bed, I meditate on you in the night watches.
translation:
  language: sw
  text: 'Ninapokukumbuka kitandani mwangu,

    natafakari juu yako katika zamu za usiku.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם זְכַרְתִּיךָ
  choice: Ninapokukumbuka
  rationale: Ingawa אִם kwa kawaida humaanisha “ikiwa,” katika muktadha huu inaweza kutumiwa kwa maana ya wakati/kurudiwa; “ninapokukumbuka” huwasilisha tafakari inayotokea usiku kwa Kiswahili cha kawaida bila kuifanya kuwa sharti lisilo la lazima.
- source_word: עַל יְצוּעָי
  choice: kitandani mwangu
  rationale: Neno יְצוּעַ humaanisha mahali pa kulala au kitanda; umbo lenye kiambishi cha nafsi lina maana ya “kitanda changu.”
- source_word: בְּאַשְׁמֻרוֹת
  choice: katika zamu za usiku
  rationale: אַשְׁמֻרוֹת ni vipindi ambavyo usiku uligawanywa kwa ajili ya ulinzi; “zamu za usiku” huhifadhi taswira hiyo na wingi wake.
- source_word: אֶהְגֶּה בָּךְ
  choice: natafakari juu yako
  rationale: הגה katika muktadha huu ni kuwaza au kutafakari kwa makini; “juu yako” huonyesha kwamba Mungu ndiye anayelengwa na tafakari.
theological_decisions:
- issue: Maana ya אִם mwanzoni mwa mstari
  choice: Ninapokukumbuka
  alternative: Ikiwa ninakukumbuka
  rationale: Katika kauli hii ya kishairi, אִם inaweza kuwa ya muda au kueleza tukio linalorudiwa. Tafsiri ya “ninapokukumbuka” inafaa zaidi katika Kiswahili na muktadha, huku isiongeze wazo jipya la masharti.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini wazi na cha kawaida. Mpangilio wa mistari miwili unahifadhi usambamba wa Kiebrania.
