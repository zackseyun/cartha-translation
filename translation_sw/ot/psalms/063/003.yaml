  text: כִּי ט֣וֹב חַ֭סְדְּ/ךָ מֵֽ/חַיִּ֗ים שְׂפָתַ֥/י יְשַׁבְּחֽוּ/נְךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/003.yaml
  text: For your steadfast love is better than life[a]; my lips will praise you.
translation:
  language: sw
  text: Kwa maana upendo wako thabiti ni bora kuliko uhai[a]; midomo yangu itakusifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fadhili zako” au “upendo wako wa agano.” Neno la Kiebrania חֶסֶד linamaanisha upendo mwaminifu na wa kudumu, mara nyingi katika uhusiano wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huanzisha sababu ya sifa inayofuata na kudumisha uhusiano wa kisababishi kwa Kiswahili cha kawaida.
- source_word: טוֹב ... מֵחַיִּים
  choice: ni bora kuliko uhai
  rationale: Kivumishi pamoja na kihusishi מִן kina maana ya ulinganisho, ‘bora kuliko’; חַיִּים hapa ni dhana ya uhai, si wingi halisi wa ‘maisha.’
- source_word: חַסְדְּךָ
  choice: upendo wako thabiti
  rationale: חֶסֶד hudokeza upendo wenye uaminifu na kudumu, mara nyingi katika uhusiano wa agano; ‘upendo thabiti’ ni wazi na hauufinyi kuwa rehema pekee.
- source_word: שְׂפָתַי
  choice: midomo yangu
  rationale: Inahifadhi taswira halisi ya kishairi badala ya kuibadili kuwa ‘maneno yangu’ au ‘kinywa changu.’
- source_word: יְשַׁבְּחוּנְךָ
  choice: itakusifu
  rationale: Kitenzi cha Kiebrania kinamaanisha kusifu au kutukuza; umoja ‘itakusifu’ unafuata upatanisho wa kawaida wa Kiswahili kwa nomino ya ngeli ya I-ZI ‘midomo’ katika wingi.
theological_decisions:
- issue: Tafsiri ya חֶסֶד katika muktadha wa ibada
  choice: upendo wako thabiti
  alternative: fadhili zako; upendo wako wa agano; rehema zako
  rationale: Chaguo hili linahifadhi wazo la upendo wa Mungu wenye uaminifu na kudumu bila kulazimisha maana kuwa istilahi nyembamba ya kimadhehebu; tanbihi inaonyesha upana wa neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Uhai’ umetumiwa badala ya ‘maisha’ ili kuwasilisha dhana ya kuwa hai kwa ufupi na kudumisha nguvu ya ulinganisho.
