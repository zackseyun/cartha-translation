  text: They will be given over to the power of the sword[b][a]; they will become a portion for foxes.
translation:
  language: sw
  text: Watatiwa chini ya nguvu ya upanga[b]; watakuwa fungu la mbweha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bweha.” Neno la Kiebrania linaweza kumaanisha mbweha, ingawa wengine hulielewa kwa maana ya bweha katika muktadha huu wa vita na ukiwa.
    reason: lexical_alternative
  - marker: b
    text: 'Kwa kufuata umbo la Kiebrania kwa karibu zaidi: “Watammwaga kwa nguvu ya upanga; watakuwa fungu la mbweha.” Maandishi ya Kiebrania hubadilika kutoka “yeye” wa umoja katika kishazi cha kwanza kwenda “wao” wa wingi katika kishazi cha pili.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: יַגִּירֻהוּ
  choice: Watatiwa mikononi
  rationale: Kitenzi hiki kwa msingi wake huonyesha kusababisha kitu kimwagike au kitiririke, na kina kiambishi cha nafsi ya tatu umoja, ‘yeye.’ Hata hivyo, katika muktadha wa kifo kwa upanga na kwa kuzingatia wingi katika kishazi kinachofuata, kauli tendwa ya wingi inawasilisha maana inayokusudiwa kwa Kiswahili cha kawaida bila kuwafanya watekelezaji waonekane kuwa ndio watakaoliwa na wanyama. Tafsiri ya karibu zaidi na umbo la Kiebrania imehifadhiwa katika tanbihi [b].
- source_word: עַל יְדֵי חָרֶב
  choice: mikononi mwa upanga
  rationale: Nahau hii inaonyesha kutiwa chini ya mamlaka au nguvu ya upanga. ‘Mikononi mwa upanga’ ni picha ya kishairi inayoeleweka kwa Kiswahili na inadumisha taswira ya Kiebrania kuliko kusema tu ‘watauawa.’
- source_word: מְנָת
  choice: fungu
  rationale: Neno hili humaanisha sehemu au mgao uliotengwa. ‘Fungu’ ni neno la kawaida na lenye uzito unaofaa katika ushairi.
- source_word: שֻׁעָלִים
  choice: mbweha
  rationale: Neno la Kiebrania linaweza kutaja mbweha, ingawa katika mazingira ya maiti na ukiwa wengine hulielewa kuwa bweha. Uwezekano huo umeonyeshwa katika tanbihi [a].
- source_word: יִהְיוּ
  choice: watakuwa
  rationale: Kitenzi היה kinaweza kumaanisha ‘kuwa’ au ‘kuja kuwa.’ Hapa ‘watakuwa’ kinaonyesha hali itakayotokana na kuuawa kwao.
theological_decisions:
- issue: Mabadiliko ya kisarufi kutoka mtendwa wa umoja katika יַגִּירֻהוּ kwenda kiima cha wingi katika יִהְיוּ
  choice: 'Kauli kuu imetumia wingi wa kauli tendwa: ‘Watatiwa ...; watakuwa ...’'
  alternative: ‘Watammwaga kwa nguvu ya upanga; watakuwa fungu la mbweha.’
  rationale: 'Kiebrania kina ugumu halisi wa kisarufi: kishazi cha kwanza kina ‘yeye’ wa umoja, lakini cha pili kina ‘wao’ wa wingi. Kauli tendwa ya wingi hufanya wahasiriwa wa muktadha wawe kiima katika vifungu vyote viwili na kuzuia mkanganyiko wa kwamba wauaji ndio watakaokuwa fungu la mbweha. Umbo la karibu zaidi na maandishi limehifadhiwa katika tanbihi badala ya kufichwa.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa lakini yenye hadhi ya kishairi. ‘Mikononi mwa upanga’ inadumisha taswira ya maandishi bila kutumia Kiswahili kisicho cha kawaida; ‘fungu la mbweha’ ni kifupi, cha wazi, na kinafaa kwa zaburi.
