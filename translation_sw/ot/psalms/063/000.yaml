base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/000.yaml
  text: A psalm of David[a], when he was in the wilderness[b] of Judah.
translation:
  language: sw
  text: Zaburi ya Daudi[a], alipokuwa katika nyika[b] ya Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “iliyoandikwa na Daudi” au “kwa ajili ya Daudi.” Kichwa cha Kiebrania “ya Daudi” kinaweza kuonyesha utunzi, kuwekwa wakfu, umiliki, au uhusiano.
    reason: alternative_reading
  - marker: b
    text: Au “jangwa.” Neno la Kiebrania linaweza kumaanisha nyika, eneo la pori, au jangwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Ni istilahi ya kawaida na sahihi ya Kiswahili kwa aina hii ya utungo wa ibada katika kichwa cha zaburi.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Muundo huu wa Kiswahili unasikika kwa kawaida na, kama Kiebrania, unaweza kuonyesha utunzi, umiliki, kuwekwa wakfu, au uhusiano bila kulazimisha maana moja.
- source_word: בִּהְיוֹתוֹ
  choice: alipokuwa
  rationale: Muundo wa Kiebrania unaonyesha wakati; “alipokuwa” ni usemi wa asili na wazi wa Kiswahili.
- source_word: בְּמִדְבַּר
  choice: katika nyika
  rationale: “Nyika” huonyesha eneo lisilolimwa au lisilo na makazi mengi na huhifadhi upana wa maana ya מִדְבָּר kuliko kuifanya iwe jangwa la mchanga pekee.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Hili ndilo umbo la kawaida la jina la eneo hilo katika Kiswahili cha Biblia.
theological_decisions:
- issue: Maana ya kichwa kinachomhusisha Daudi
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi; kwa ajili ya Daudi
  rationale: Kihusishi לְ katika vichwa vya zaburi kinaweza kuonyesha utunzi, umiliki, kuwekwa wakfu, au uhusiano. “Ya Daudi” kinahifadhi utata huo badala ya kuthibitisha maana moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, ya heshima, ya sasa, na rahisi kueleweka. “Ya Daudi” imechaguliwa ili kuhifadhi utata wa kichwa cha Kiebrania, na “nyika” ili kuepuka kuifanya mandhari kuwa jangwa kwa maana finyu.
