  text: כְּמ֤וֹ חֵ֣לֶב וָ֭/דֶשֶׁן תִּשְׂבַּ֣ע נַפְשִׁ֑/י וְ/שִׂפְתֵ֥י רְ֝נָנ֗וֹת יְהַלֶּל פִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/005.yaml
  text: My soul is satisfied as with fat and richness[b][a], and my mouth praises you with lips of joyful songs.
translation:
  language: sw
  text: Nafsi yangu inashiba kama kwa mafuta na unono[a], na kinywa changu kinakusifu kwa midomo ya shangwe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nafsi yangu itashiba kama kwa mafuta na chakula kinono.”
    reason: Huhifadhi uwezekano wa wakati ujao wa kitenzi cha Kiebrania na hufafanua דֶּשֶׁן kwa maana yake ya chakula tele/kinono katika muktadha.
  - marker: b
    text: Kihalisi, “kwa midomo ya shangwe”; pia, “kwa midomo ya sauti za furaha.”
    reason: Huhifadhi muundo wa kirai cha Kiebrania שִׂפְתֵי רְנָנוֹת na huonyesha maana ya rennānôt kama shangwe au sauti za furaha.
lexical_decisions:
- source_word: כְּמוֹ
  choice: kana kwamba kwa
  rationale: Inaonyesha ulinganisho na picha ya kushibishwa kwa chakula; muundo huu ni wa asili katika Kiswahili mbele ya ‘mafuta na unono.’
- source_word: חֵלֶב
  choice: mafuta
  rationale: Neno hilo humaanisha mafuta halisi na katika ushairi huashiria chakula bora na cha kushibisha. ‘Mafuta’ inadumisha picha halisi ya Kiebrania.
- source_word: דֶּשֶׁן
  choice: unono
  rationale: Neno hili huonyesha unono, ustawi, au wingi. ‘Unono’ linadumisha ulinganifu wa kishairi na ‘mafuta’ bila kuibadili picha kuwa dhana tupu ya wingi.
- source_word: תִּשְׂבַּע
  choice: inashiba
  rationale: Kauli isiyotimilika ya Kiebrania inaweza kueleza tendo la sasa linaloendelea, la kawaida, au la wakati ujao. Wakati wa sasa unaonyesha kwa kawaida hali hai ya mtunga zaburi katika muktadha huu.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: נֶפֶשׁ inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. ‘Nafsi yangu’ ni ya asili katika zaburi hii ya kumtamani Mungu na inadumisha kina cha picha ya Kiebrania.
- source_word: שִׂפְתֵי רְנָנוֹת
  choice: kwa midomo inayopaza sauti za shangwe
  rationale: Kirai hicho ni kihalisi ‘midomo ya shangwe/vilio vya furaha.’ Tafsiri hii inaonyesha kuwa sifa inatolewa kwa sauti huku ikidumisha picha ya midomo.
- source_word: יְהַלֶּל
  choice: kinakusifu
  rationale: Kitenzi kina ‘kinywa changu’ kama kiima. Kiambishi cha yambwa ‘-ku-’ kinamweka Mungu kama mlengwa anayeeleweka kutokana na mazungumzo ya moja kwa moja ya zaburi.
- source_word: פִּי
  choice: kinywa changu
  rationale: Inadumisha picha halisi ya kiungo cha mwili na usambamba wake wa kishairi na ‘midomo.’
theological_decisions:
- issue: Kuweka wazi yambwa lisilotajwa la tendo la kusifu
  choice: kinakusifu
  alternative: kinasifu
  rationale: Kiebrania hakitaji yambwa waziwazi, lakini zaburi inamwelekea Mungu moja kwa moja. Kiambishi ‘-ku-’ kinafanya Kiswahili kiwe cha kawaida bila kuongeza fundisho jipya.
- issue: Wakati na hali ya vitenzi visivyotimilika vya kishairi
  choice: 'wakati wa sasa: ‘inashiba,’ ‘kinakusifu’'
  alternative: 'wakati ujao: ‘itashiba,’ ‘kitakusifu’'
  rationale: Vitenzi vya Kiebrania vinaweza kuonyesha tendo la kawaida, linaloendelea, au lijalo. Wakati wa sasa unafaa muktadha wa hali ya sasa ya kuridhika na kusifu, huku uwezekano wa wakati ujao ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Picha halisi za ‘nafsi,’ ‘mafuta,’ ‘unono,’ ‘kinywa,’ na ‘midomo’ zimedumishwa; usemi ‘inayopaza sauti za shangwe’ unaweka wazi tendo la sauti bila kuufanya mstari kuwa wa kigeni.
