translation:
  language: sw
  text: Nafsi yangu inashikamana nawe[a]; mkono wako wa kuume unanishikilia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nafsi yangu inakufuata kwa karibu.” Kihalisi, Kiebrania husema “baada yako”; katika muktadha huu inaweza kudokeza kufuata kwa karibu au kushikamana nawe.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּבְקָה
  choice: inashikamana
  rationale: Kitenzi דבק kinaeleza kushikamana kwa karibu au kutengana kwa shida. Wakati wa sasa unaonyesha hali inayoendelea, kama ukamilifu wa Kiebrania unavyotumika hapa.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: נפשׁ inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. Katika ushairi huu wa ibada, “nafsi yangu” huhifadhi uzito wa lugha bila kulazimisha fundisho maalumu kuhusu sehemu za mwanadamu.
- source_word: אַחֲרֶיךָ
  choice: nawe
  rationale: Neno hili kihalisi ni “nyuma yako/baada yako,” lakini pamoja na דבק linaonyesha kushikamana au kufuata kwa karibu. “Nawe” huunda Kiswahili cha kawaida huku tanbihi ikihifadhi taswira halisi ya Kiebrania.
- source_word: בִּי
  choice: unani-
  rationale: Kihusishi chenye kiambishi cha nafsi ya kwanza kinafanya kazi kama kijalizo cha kitenzi kinachofuata; kwa Kiswahili huwakilishwa kiasili na kiambishi cha yambwa “-ni-” katika “unanishikilia.”
- source_word: תָּמְכָה
  choice: unanishikilia
  rationale: תמך humaanisha kutegemeza, kushikilia, au kuhimili. “Unanishikilia” ni ya asili katika Kiswahili na hudumisha picha halisi ya mkono unaomzuia mtu asianguke.
- source_word: יְמִינֶךָ
  choice: mkono wako wa kuume
  rationale: Hii ndiyo picha halisi ya Kiebrania. Imehifadhiwa badala ya kufasiriwa kuwa “nguvu zako,” ili taswira ya kibiblia ya ulinzi na uwezo ibaki wazi.
theological_decisions:
- issue: Maana ya kibinadamu ya נַפְשִׁי
  choice: nafsi yangu
  alternative: mimi mwenyewe; uhai wangu
  rationale: “Nafsi yangu” inafaa sajili ya kishairi na kiibada na huhifadhi upana wa neno la Kiebrania bila kulifanya fundisho la kiufundi kuhusu asili ya mwanadamu.
- issue: Lugha inayomwelezea Mungu kwa mfano wa mwili
  choice: mkono wako wa kuume
  alternative: nguvu zako; uwezo wako
  rationale: Maandishi yanatumia taswira halisi ya mkono wa kuume. Tafsiri inaihifadhi badala ya kuibadili kuwa dhana isiyo na taswira.
- issue: Uhusiano wa דבק na אַחֲרֶיךָ
  choice: inashikamana nawe
  alternative: inafuata karibu nyuma yako
  rationale: Kauli kuu inaleta Kiswahili cha kawaida na kudumisha wazo la mshikamano; tanbihi huhifadhi uwezekano wa taswira ya kufuata kwa karibu iliyo katika “nyuma yako.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi, wa kishairi na wa heshima. “Mkono wa kuume” huhifadhi taswira ya chanzo; “unanishikilia” ni ya kawaida na dhahiri kuliko istilahi nzito zaidi kama “unanitegemeza.”
