base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/004.yaml
  text: So I will bless you as long as I live[a]; in your name I will lift up my hands.
translation:
  language: sw
  text: Hivyo nitakubariki muda wote nitakaoishi[a]; kwa jina lako nitainua mikono yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitakusifu.” Kiebrania kinasema kihalisi zaidi, “nitakubariki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Hivyo
  rationale: Neno hili linaunganisha kiapo hiki cha ibada na mstari uliotangulia, likionyesha matokeo au mwitikio. “Hivyo” ni la kawaida na lina heshima katika Kiswahili sanifu.
- source_word: אֲבָרֶכְךָ
  choice: nitakubariki
  rationale: Kitenzi ברך katika piel humaanisha “bariki.” Ingawa kumbariki Mungu kunaweza kueleweka kama kumsifu, tafsiri hii inadumisha uwazi wa neno la Kiebrania na maana yake ya ibada.
- source_word: בְחַיָּי
  choice: muda wote nitakaoishi
  rationale: Kihalisi ni “katika maisha yangu,” lakini hapa kina maana ya muda unaoendelea katika maisha yote ya mtunga zaburi. Usemi huu ni wa asili na wazi kwa wasomaji wa sasa.
- source_word: בְּשִׁמְךָ
  choice: kwa jina lako
  rationale: Kihusishi ב pamoja na “jina” kinaweza kuonyesha msingi, njia, au kutaja jina katika ibada. “Kwa jina lako” huhifadhi upana huo bila kulazimisha maana moja tu.
- source_word: אֶשָּׂא
  choice: nitainua
  rationale: Kitenzi נשא humaanisha kuinua au kuchukua. Pamoja na mikono, kinaeleza ishara inayotambulika ya sala au sifa.
- source_word: כַפָּי
  choice: mikono yangu
  rationale: Ingawa כף linaweza kumaanisha viganja, katika usemi huu Kiswahili cha kawaida hutumia “mikono,” nalo linafikisha ishara hiyo kwa ufasaha.
theological_decisions:
- issue: Lugha ya ברך inapoelekezwa kwa Mungu
  choice: Kudumisha “nitakubariki” katika matini kuu.
  alternative: nitakusifu
  rationale: Neno la Kiebrania ni ברך moja kwa moja. “Nitakubariki” hudumisha taswira na mvutano wa lugha ya chanzo, huku “nitakusifu” likitolewa katika tanbihi kama ufafanuzi unaowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa kishairi umehifadhiwa bila kufanya sentensi kuwa ngumu.
