base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/001.yaml
  text: God[a], you are my God; I seek you at dawn. My soul thirsts for you, my flesh longs for you[b], in a dry and weary land without water.
translation:
  language: sw
  text: Mungu, wewe ni Mungu wangu; nakutafuta wakati wa mapambazuko.[a] Nafsi yangu inakuonea kiu, mwili wangu unakutamani,[b] katika nchi kavu, iliyochoka, isiyo na maji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nakutafuta mapema,” “nakutafuta kwa bidii,” au, kwa tafsiri pana zaidi, “nakutafuta kwa hamu.” Kitenzi cha Kiebrania huleta picha ya kutafuta wakati wa mapambazuko.
    reason: lexical_alternative
  - marker: b
    text: 'Tafsiri hii pia yaweza kupangwa hivi: “Nafsi yangu inakuonea kiu; mwili wangu unakutamani katika nchi kavu, iliyochoka, isiyo na maji.” Mpangilio huu unaweza kufanya maneno kuhusu nchi yaonekane yakihusiana moja kwa moja zaidi na hamu ya mwili.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Nomino ya wingi kwa umbo inamtaja Mungu mmoja hapa. “Mungu” hudumisha usemi wa moja kwa moja bila kuongeza kihisishi kisichokuwapo katika Kiebrania.
- source_word: אֵלִי אַתָּה
  choice: wewe ni Mungu wangu
  rationale: Muundo huu unaonyesha mkazo wa kiwakilishi huru na umilikaji; Kiswahili cha kawaida huhitaji “ni” ili kutoa maana hiyo wazi.
- source_word: אֲשַׁחֲרֶךָּ
  choice: nakutafuta wakati wa mapambazuko
  rationale: Kitenzi hiki kinaibua picha ya kutafuta wakati wa alfajiri. “Wakati wa mapambazuko” huhifadhi picha hiyo badala ya kuifasiri tu kuwa kutafuta kwa bidii.
- source_word: צָמְאָה לְךָ נַפְשִׁי
  choice: Nafsi yangu inakuonea kiu
  rationale: Tafsiri hii huhifadhi sitiari ya kiu na neno “nafsi” katika ulinganifu wake wa kishairi na mwili.
- source_word: כָּמַהּ לְךָ בְשָׂרִי
  choice: mwili wangu unakutamani
  rationale: Kitenzi huonyesha hamu kubwa. Katika Kiswahili cha sasa, “mwili” huwasilisha maana ya בשר katika muktadha huu kwa kawaida zaidi kuliko “nyama,” huku ikihifadhi upande wa kimwili wa ulinganifu.
- source_word: בְּאֶרֶץ צִיָּה וְעָיֵף
  choice: katika nchi kavu na iliyochoka
  rationale: “Kavu” huonyesha ukame, na “iliyochoka” huhifadhi tashihisi ya kishairi ya nchi iliyoelemewa au kuzimia kwa ukavu.
- source_word: בְּלִי מָיִם
  choice: isiyo na maji
  rationale: Hii ni tafsiri fupi, wazi, na ya kawaida ya kishazi kinachoonyesha kutokuwapo kwa maji.
theological_decisions:
- issue: Lugha kuhusu nafsi na mwili katika jozi נפשׁ / בשר
  choice: Kudumisha “nafsi yangu” na “mwili wangu” kama pande za ndani na za kimwili za mtu mzima
  alternative: Kutafsiri “utu wangu wote” na “mwili wangu”
  rationale: Ushairi wa Kiebrania unaweka kiu ya nafsi sambamba na hamu ya mwili. Kudumisha maneno yote mawili huhifadhi kina cha kifasihi na kitheolojia bila kulazimisha fundisho kwamba nafsi na mwili ni sehemu mbili zinazojitegemea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Mapambazuko” huhifadhi picha ya asili kwa ufasaha; “mwili” huepuka maana ya kawaida ya “nyama” kama chakula. Tashihisi “nchi ... iliyochoka” imehifadhiwa kwa makusudi.
