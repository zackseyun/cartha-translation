base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/011.yaml
  text: But the king will rejoice in God[a]; everyone who swears by him will boast[c][b], for the mouths of those who speak lies will be shut.
translation:
  language: sw
  text: Lakini mfalme atamfurahia Mungu; kila anayeapa kwa jina lake[a] atajivunia[b], kwa maana vinywa vya wale wanaosema uongo vitafungwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni, “anayeapa kwa yeye.” Kiwakilishi hicho kwa kawaida zaidi kinamrejelea Mungu katika muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: Au, “atukuke.” Kitenzi cha Kiebrania hapa kinaweza kumaanisha kujivunia au kutukuka.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “kinywa cha wasemao uongo kitafungwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: Lakini mfalme
  rationale: Ingawa וְ kwa msingi ni “na,” hapa inaonyesha tofauti kati ya mwisho wa waovu katika mstari uliotangulia na furaha ya mfalme; “lakini” huonyesha mtiririko huo kwa Kiswahili cha kawaida.
- source_word: יִשְׂמַח בֵּאלֹהִים
  choice: atamfurahia Mungu
  rationale: Kitenzi שמח pamoja na ב kinaonyesha Mungu kuwa mlengwa au msingi wa furaha. Muundo huu ni wa asili zaidi katika Kiswahili kuliko tafsiri ya moja kwa moja “atafurahi katika Mungu.”
- source_word: כָּל הַנִּשְׁבָּע בּוֹ
  choice: kila anayeapa kwa jina lake
  rationale: Kirai kinaeleza kila mtu anayemwita Mungu kuwa shahidi wa kiapo. “Kwa jina lake” ni namna ya asili ya Kiswahili ya kueleza kuapa kwa mtu, huku kiwakilishi cha Kiebrania kikihifadhiwa.
- source_word: יִתְהַלֵּל
  choice: atajisisifu
  rationale: Hitpaeli ya הלל hapa ina maana ya kujisifu au kutukuka. “Atajisifu” huhifadhi maana ya msingi bila kuongeza kitu ambacho hakikutajwa wazi kuwa sababu ya kujisifu.
- source_word: כִּי
  choice: kwa maana
  rationale: Neno hili linaanzisha sababu ya uhakika uliotangulia; “kwa maana” linafaa kwa uhusiano huo wa maelezo.
- source_word: יִסָּכֵר פִּי דֹבְרֵי שָׁקֶר
  choice: vinywa vya wale wanaosema uongo vitafungwa
  rationale: סכר katika nifali humaanisha kufungwa. Wingi ni wa asili katika Kiswahili kwa kundi la watu, huku taswira ya vinywa kufungwa ikihifadhiwa.
theological_decisions:
- issue: Utambulisho wa “mfalme”
  choice: Kubaki na “mfalme” bila kumtambulisha zaidi
  alternative: Kumtaja Daudi moja kwa moja au kuifafanua kauli hii kuwa ya Mfalme Masihi
  rationale: Mstari wenyewe unasema “mfalme” bila ufafanuzi zaidi. Tafsiri haipaswi kuingiza utambulisho wa kimafundisho ambao haujasemwa wazi katika mstari.
- issue: Mrejelewa wa kiwakilishi katika “kwa jina lake”
  choice: Kiwakilishi kinaelekea kumrejelea Mungu
  alternative: Kiwakilishi kinaweza kuchukuliwa kuwa kinamrejelea mfalme
  rationale: Mungu ndiye mtajwa wa karibu zaidi, na kuapa kwa Mungu ni usemi wa kawaida wa kibiblia. Hata hivyo, tanbihi inataja umbo la Kiebrania badala ya kuficha kabisa uwezekano wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo “atamfurahia Mungu” umechaguliwa badala ya kalisi “atafurahi katika Mungu”; taswira ya vinywa kufungwa imehifadhiwa.
