  text: For you have been my help[a], and in the shadow of your wings I sing for joy.
translation:
  language: sw
  text: Kwa maana umekuwa msaada wangu, na katika uvuli wa mabawa yako ninaimba kwa furaha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ninapaza sauti kwa furaha.” Kitenzi cha Kiebrania kinaweza kurejelea kilio cha shangwe kinachopazwa kwa sauti au wimbo wa shangwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kinaonyesha sababu ya mwitikio wa mtunga zaburi katika muktadha; “Kwa maana” huhifadhi uhusiano huo wa kisababu kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: הָיִיתָ
  choice: umekuwa
  rationale: Kauli timilifu inaelekeza kwenye msaada wa Mungu uliothibitishwa zamani na wenye umuhimu unaoendelea sasa; “umekuwa” huwasilisha maana hiyo kwa kawaida.
- source_word: עֶזְרָתָה לִּי
  choice: msaada wangu
  rationale: Nomino pamoja na לִּי huonyesha msaada wenye kumhusu moja kwa moja mtunga zaburi; “msaada wangu” ni usemi wa asili na mfupi.
- source_word: וּבְצֵל
  choice: na katika uvuli
  rationale: “Uvuli” huhifadhi picha ya kishairi ya mahali pa kinga, badala ya kuibadilisha moja kwa moja kuwa dhana ya “ulinzi.” Kihusishi “katika” huakisi בְּ.
- source_word: כְּנָפֶיךָ
  choice: mabawa yako
  rationale: Huhifadhi sitiari halisi na iliyo wazi ya mabawa ya Mungu kama mahali pa kujisitiri.
- source_word: אֲרַנֵּן
  choice: ninaimba kwa furaha
  rationale: Piel ya רנן inaweza kumaanisha kuimba kwa shangwe au kutoa kilio cha furaha. Chaguo hili huhifadhi usemi wa sauti na furaha huku tanbihi ikionyesha uwezekano mwingine wa kweli.
theological_decisions:
- issue: Sitiari ya ulinzi wa Mungu
  choice: Kuhifadhi “katika uvuli wa mabawa yako” kama sitiari halisi
  alternative: “chini ya ulinzi wako”
  rationale: Matini ya Kiebrania hutumia picha thabiti ya kishairi kuhusu hifadhi ya Mungu. Kuihifadhi huepuka kuifupisha kuwa fasiri moja na hudumisha uzito wake wa kifasihi na kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Uvuli wa mabawa” umehifadhiwa kwa sababu ni picha kuu ya kishairi; “ninaimba kwa furaha” ni ya kawaida zaidi kuliko miundo mizito kama “ninapiga kelele za shangwe.”
