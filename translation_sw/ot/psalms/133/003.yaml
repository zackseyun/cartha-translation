  text: כְּ/טַל חֶרְמ֗וֹן שֶׁ/יֹּרֵד֮ עַל הַרְרֵ֪י צִ֫יּ֥וֹן כִּ֤י שָׁ֨ם צִוָּ֣ה יְ֭הוָה אֶת הַ/בְּרָכָ֑ה חַ֝יִּ֗ים עַד הָ/עוֹלָֽם־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/003.yaml
  text: like the dew of Hermon[a], which falls on the mountains of Zion. For there Yahweh commanded the blessing[b], life forever.
translation:
  language: sw
  text: kama umande wa Hermoni[a], unaoshuka juu ya milima ya Sayuni. Kwa maana huko Yahwe aliamuru baraka[b]—uzima hata milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unaoteremka juu ya milima ya Sayuni.”
    reason: lexical_alternative
  - marker: b
    text: Au, “uzima wa milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/טַל
  choice: kama umande
  rationale: Kiambishi כְּ kinaonyesha ulinganisho, na טַל ni ‘umande’; ‘kama umande’ ni Kiswahili cha kawaida kinachohifadhi tashbihi.
- source_word: חֶרְמוֹן
  choice: Hermoni
  rationale: Jina la mahali limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: שֶׁ/יֹּרֵד
  choice: unaoshuka
  rationale: Kitenzi ירד humaanisha kwenda chini au kushuka; ‘unaoshuka’ ni cha asili kinapotumiwa kuhusu umande na kinahifadhi mwendo wa kuelekea chini.
- source_word: עַל הַרְרֵי צִיּוֹן
  choice: juu ya milima ya Sayuni
  rationale: הַרְרֵי ni wingi katika hali ya muundo; ‘milima ya Sayuni’ huhifadhi wingi wa Kiebrania.
- source_word: כִּי שָׁם
  choice: Kwa maana huko
  rationale: כִּי inatoa sababu, huku שָׁם ikibaki kama kielezi cha mahali bila kufafanua rejeleo lake kupita kiasi.
- source_word: צִוָּה
  choice: aliamuru
  rationale: צוה kwa msingi humaanisha kuamuru; tafsiri hii huhifadhi mamlaka ya tendo la Yahwe bila kulainisha kuwa ‘alitoa.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa badala ya kubadilishwa na cheo.
- source_word: אֶת הַ/בְּרָכָה
  choice: baraka
  rationale: Nomino yenye kibainishi imetafsiriwa kwa kawaida kama ‘baraka’; Kiswahili hakihitaji kibainishi tofauti hapa.
- source_word: חַיִּים עַד הָ/עוֹלָם
  choice: uzima hata milele
  rationale: ‘Uzima’ huwasilisha חַיִּים, na ‘hata milele’ huhifadhi nguvu ya muda ya עַד הָעוֹלָם kwa mtindo mfupi wa kishairi.
theological_decisions:
- issue: Uhusiano wa kirai cha mwisho na ‘baraka’
  choice: Kukitumia kama kirai cha ufafanuzi kinachoonyesha baraka hiyo kuwa uzima hata milele.
  alternative: Kukitenga kama sentensi au mshangao tofauti.
  rationale: Mpangilio wa Kiebrania ‘baraka, uzima hata milele’ kwa kawaida unaweza kueleweka kama ufafanuzi wa kishairi; vistari virefu vinahifadhi uhusiano huo bila kuunda fundisho lililopanuliwa.
- issue: Rejeleo la ‘huko’
  choice: Kulihifadhi kama kielezi cha mahali bila kulifafanua zaidi.
  alternative: Kutafsiri wazi kuwa ‘huko Sayuni’ au ‘miongoni mwa ndugu wanaokaa kwa umoja.’
  rationale: Kiebrania kinasema ‘huko’ tu; kufafanua rejeleo katika matini kuu kungeondoa ufupi na utata halisi wa shairi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi wa kishairi umehifadhiwa; ‘Hermoni,’ ‘Sayuni,’ na ‘Yahwe’ yametoholewa kwa namna inayoeleweka kwa wasomaji wa Kiswahili.
