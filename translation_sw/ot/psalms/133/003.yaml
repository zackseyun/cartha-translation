  source_fidelity: 'Tafsiri inafuata Kiebrania kwa uaminifu: tashbihi ya umande, jina Hermoni, kitenzi cha kushuka, wingi wa “milima ya Sayuni,” kielezi kisichofafanuliwa “huko,” tendo la Yahwe la kuamuru, na ufafanuzi wa baraka kuwa uzima wa kudumu vimehifadhiwa. “Uzima hata milele” ni usemi wa kishairi unaokubalika kwa חַיִּים עַד־הָעוֹלָם.'
