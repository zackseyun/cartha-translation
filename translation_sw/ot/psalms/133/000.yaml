  text: A Song of Ascents[a]. Of David. Behold[c][b], how good and how pleasant it is for brothers to dwell together.
translation:
  language: sw
  text: 'Wimbo wa Kwenda Juu[a]. Wa Daudi.


    Tazama, jinsi ilivyo vema na kupendeza

    ndugu[b] wakaapo pamoja[c]!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wimbo wa Kupaa.” Kichwa hiki huenda kilihusiana na kupanda kwenda Yerusalemu, lakini maana yake kamili si hakika.
    reason: lexical_alternative
  - marker: b
    text: “Ndugu” wanaweza kuwa ndugu wa tumbo au, kwa maana pana, watu wa jamii moja.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinatia mkazo wazo la kukaa pamoja; pia linaweza kueleweka kuwa “kwa umoja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa kupandia
  rationale: Huhifadhi taswira ya kupanda iliyo katika מַעֲלוֹת; kichwa hicho huenda kilihusiana na safari ya kwenda Yerusalemu, lakini chanzo hakisemi wazi.
- source_word: אַחִים
  choice: ndugu
  rationale: Neno linaweza kumaanisha ndugu wa tumbo au, kwa upana zaidi, watu wa jamii moja; ‘ndugu’ huhifadhi upana huo katika Kiswahili.
- source_word: שֶׁבֶת
  choice: wakaapo
  rationale: Kitenzi hiki hueleza kukaa au kuishi pamoja; ‘wakaapo’ ni cha asili katika sentensi hii na hakilazimishi maana moja pekee.
- source_word: גַּם יָחַד
  choice: pamoja
  rationale: יָחַד humaanisha ‘pamoja,’ huku גַּם ikitia mkazo. Kiswahili ‘pamoja’ kinawasilisha kiini cha maana bila kuongeza moja kwa moja dhana ya ‘umoja’ ambayo ni tafsiri pana zaidi.
- source_word: נָעִים
  choice: kupendeza
  rationale: Hutoa maana ya jambo lenye kupendeza au kufurahisha kwa namna ya kawaida na yenye hadhi.
theological_decisions:
- issue: Utambulisho wa ‘ndugu’
  choice: Kuacha ‘ndugu’ ikiwa na maana pana
  alternative: Kutafsiri wazi kuwa ‘watu wa agano’ au ‘jamaa’
  rationale: Chanzo hakiamui kama מדובר ndugu wa damu pekee au jamii pana; tafsiri haipaswi kuondoa utata huo.
- issue: Maana ya גַּם יָחַד
  choice: ‘pamoja’ pamoja na tanbihi kuhusu mkazo
  alternative: ‘kwa umoja’
  rationale: ‘Kwa umoja’ huonyesha maelewano wazi zaidi kuliko neno יָחַד lenyewe; maandishi makuu yanabaki karibu na chanzo huku tanbihi ikieleza mkazo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mgawanyo wa mistari unaonyesha kichwa cha zaburi na kauli kuu; mshangao unafaa mwito wa הִנֵּה (‘Tazama’).
