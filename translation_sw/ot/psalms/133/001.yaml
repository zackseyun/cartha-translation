base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/001.yaml
  text: A Song of Ascents[a]. Of David. Behold[c][b], how good and how pleasant it is when brothers dwell together!
translation:
  language: sw
  text: Wimbo wa Kupanda[a]. Wa Daudi. Tazama, jinsi ilivyo vema na kupendeza ndugu wakaapo pamoja![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wimbo wa kwenda juu.” Hiki ni kichwa kinachotumiwa katika Zaburi 120–134; huenda kinahusiana na kupanda kwenda Yerusalemu, lakini maana yake kamili haijulikani kwa hakika.
    reason: lexical_alternative
  - marker: b
    text: “Ndugu” inaweza kumaanisha ndugu wa damu au, kwa upana zaidi, watu wa jamaa au jumuiya moja. Kiebrania kinakazia kukaa kwao pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa Kupanda
  rationale: Huhifadhi kwa kiasi kikubwa maana ya jina מַעֲלוֹת katika kichwa cha Zaburi 120–134 bila kuamua kuwa ni wimbo wa hija, ingawa usemi huo unaweza kuhusishwa na safari ya kwenda Yerusalemu.
- source_word: לְדָוִד
  choice: Wa Daudi
  rationale: Kiambishi לְ katika vichwa vya zaburi kinaweza kuonyesha uandishi, uhusiano, au wakfu; “Wa Daudi” huhifadhi upana huo kuliko “Ulioandikwa na Daudi” au “Kwa ajili ya Daudi.”
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni mwito wa kuelekeza fikira wenye sauti ya mshangao na ushairi; “Tazama” ni ya heshima na ya kawaida katika Kiswahili cha kibiblia.
- source_word: מַה טּוֹב וּמַה נָּעִים
  choice: jinsi ilivyo vema na kupendeza
  rationale: Muundo wa mshangao wenye מַה umetafsiriwa kwa Kiswahili cha asili huku ukidumisha ulinganifu wa sifa mbili, wema na hali ya kupendeza.
- source_word: שֶׁבֶת אַחִים
  choice: ndugu kukaa
  rationale: שֶׁבֶת huonyesha tendo au hali ya kukaa pamoja. “Ndugu” inaweza kumaanisha ndugu wa damu au, kwa upana zaidi, watu wa jamaa au jumuiya ya agano.
- source_word: גַּם יָחַד
  choice: pamoja
  rationale: “Pamoja” hutafsiri moja kwa moja יָחַד kwa Kiswahili cha kawaida. Nguvu ya גַּם katika usemi huu inaongeza mkazo wa kukaa kwa pamoja; jambo hilo linaelezwa katika tanbihi bila kuongeza wazo la “umoja” moja kwa moja katika matini.
theological_decisions:
- issue: Upeo wa אַחִים (“ndugu”)
  choice: Kutumia “ndugu” katika matini kuu, huku maana yake pana ikielezwa katika tanbihi.
  alternative: “Jamaa” au “watu wa jamii moja”
  rationale: Neno la Kiebrania ni la kiume katika wingi na linaweza kutaja ndugu halisi au watu wa jumuiya ya agano. “Ndugu” hudumisha picha ya msingi bila kufunga maana katika mojawapo ya uwezekano huo.
- issue: Nguvu ya גַּם יָחַד
  choice: “pamoja,” kwa tanbihi inayoonyesha mkazo
  alternative: “kwa umoja” au “pamoja kwa umoja”
  rationale: יָחַד humaanisha “pamoja,” na גַּם huutia usemi mkazo. Kutaja “umoja” katika matini kuu kungeweza kufafanua zaidi ya maneno yenyewe; tafsiri hii inadumisha mvutano kati ya ukaribu wa kileksika na wazo la maelewano linalodokezwa na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Wimbo wa Kupanda” na “Wa Daudi” zimewekwa kama kichwa cha mstari. Muundo “jinsi ilivyo vema na kupendeza” ni wa asili na huhifadhi mshangao wa Kiebrania.
