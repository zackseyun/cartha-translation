  text: כַּ/שֶּׁ֤מֶן הַ/טּ֨וֹב עַל הָ/רֹ֗אשׁ יֹרֵ֗ד עַֽל הַ/זָּקָ֥ן זְקַֽן אַהֲרֹ֑ן שֶׁ֝/יֹּרֵ֗ד עַל פִּ֥י מִדּוֹתָֽי/ו׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/002.yaml
  text: It is like the good oil on the head[a], running down on the beard, on Aaron’s beard[b], which runs down on the collar of his robes.
translation:
  language: sw
  text: Ni kama mafuta mazuri[a] juu ya kichwa, yanayotiririka kwenye ndevu, ndevu za Haruni, yanayotiririka kwenye uwazi wa mavazi yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mafuta ya thamani.” Kiebrania kinasema kwa karibu zaidi “mafuta mazuri,” ingawa maana inaweza kujumuisha ubora na thamani yake.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “kinywa cha mavazi yake.” Usemi wa Kiebrania unaweza kumaanisha uwazi, ukingo, au sehemu ya shingoni ya mavazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּשֶּׁמֶן
  choice: Ni kama mafuta
  rationale: Kiambishi כְּ kinaonyesha ulinganisho. Muundo “ni kama” unaendeleza kwa Kiswahili ulinganisho ulioanza katika mstari uliotangulia.
- source_word: הַטּוֹב
  choice: mazuri
  rationale: טוֹב kwa maana ya msingi ni “nzuri/njema.” Kwa mafuta, “mafuta mazuri” ni Kiswahili cha kawaida na kinafuata Kiebrania kwa karibu bila kuongeza wazo la thamani.
- source_word: יֹרֵד
  choice: yanayotiririka
  rationale: Kitenzi ירד humaanisha kushuka. Katika taswira ya mafuta, “kutiririka” huonyesha kwa kawaida na kwa uwazi mwendo wake wa kushuka.
- source_word: הָרֹאשׁ
  choice: kichwa
  rationale: Ni rejeo la moja kwa moja la sehemu ya mwili.
- source_word: הַזָּקָן
  choice: ndevu
  rationale: Ni tafsiri ya moja kwa moja ya זָקָן katika muktadha huu.
- source_word: זְקַן אַהֲרֹן
  choice: ndevu za Haruni
  rationale: Muundo huu ni wa kawaida katika Kiswahili na unahifadhi urudiaji wa kishairi wa neno “ndevu.”
- source_word: שֶׁיֹּרֵד
  choice: yanayotiririka
  rationale: Muundo wa uhusiano pamoja na kitenzi endelevu unarudia na kusisitiza mwendo wa mafuta; umoja wa “mafuta” katika Kiebrania unawakilishwa kwa upatanisho wa kawaida wa Kiswahili wa nomino “mafuta.”
- source_word: פִּי
  choice: uwazi
  rationale: פֶּה kwa kawaida ni “kinywa,” lakini ikihusishwa na vazi inaweza kumaanisha uwazi au ukingo wake. “Uwazi” unafaa kwa sehemu ya juu ya vazi ambako mafuta yanafika bila kulazimisha maana ya kola.
- source_word: מִדּוֹתָיו
  choice: mavazi yake
  rationale: Katika muktadha huu מִדּוֹתָיו inarejelea mavazi ya Haruni. Wingi “mavazi” unaendana na umbo la Kiebrania na mazingira ya kikuhani.
theological_decisions:
- issue: Maana ya taswira ya mafuta
  choice: Taswira imeachwa kuwa ulinganisho unaomhusisha Haruni bila kuitaja moja kwa moja kuwa mafuta ya upako wa kikuhani.
  alternative: Kusema katika maandishi yenyewe kwamba haya ni mafuta ya upako wa kikuhani.
  rationale: Kifungu kinadokeza kwa nguvu upako wa Haruni, lakini kinatoa taswira ya kishairi badala ya ufafanuzi wa moja kwa moja wa kiteolojia. Tafsiri haiongezi maelezo yasiyotamkwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi ulio wazi na wenye hadhi. Urudiaji wa “ndevu” umehifadhiwa kwa sababu ni sehemu ya msisitizo wa mstari wa Kiebrania. “Uwazi wa mavazi” huepuka neno “pindo,” ambalo kwa Kiswahili cha sasa linaweza kueleweka hasa kuwa sehemu ya chini ya vazi.
