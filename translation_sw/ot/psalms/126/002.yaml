id: PSA.126.2
reference: Psalms 126:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אָ֤ז יִמָּלֵ֪א שְׂח֡וֹק פִּי/נוּ֮ וּ/לְשׁוֹנֵ֪/נוּ רִ֫נָּ֥ה אָ֭ז יֹאמְר֣וּ בַ/גּוֹיִ֑ם הִגְדִּ֥יל יְ֝הוָ֗ה לַ/עֲשׂ֥וֹת עִם אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/002.yaml
  text: Then our mouth was filled with laughter[a], and our tongue with joyful shouting; then they said among the nations[b], “Yahweh has done great things for them.”
translation:
  language: sw
  text: 'Ndipo vinywa vyetu vikajaa kicheko,

    na ndimi zetu zikatoa kelele za furaha.[a]

    Ndipo wakasema miongoni mwa mataifa,

    “Yahwe amewatendea mambo makuu.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndimi zetu zikatoa vilio vya shangwe”; neno la Kiebrania linaweza kumaanisha kilio chenye mlio, kupaza sauti kwa furaha, au kuimba kwa shangwe.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kwa karibu zaidi: “Yahwe amefanya makuu kufanya pamoja na hawa,” nahau yenye maana ya kwamba Yahwe amewatendea mambo makuu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Inaonyesha hatua iliyofuata baada ya urejesho uliotajwa katika mstari uliotangulia, na ni ya kawaida katika usimulizi wa kishairi wa Kiswahili.
- source_word: יִמָּלֵא
  choice: vikajaa
  rationale: Ingawa umbo la Kiebrania ni imperfecti ya kutendwa, muktadha unakumbuka tukio lililotokea; Kiswahili cha usimulizi hutumia kwa kawaida kiambishi -ka- kuendeleza mfuatano huo.
- source_word: שְׂחוֹק
  choice: kicheko
  rationale: Muktadha na ulinganifu wake na רִנָּה unaonyesha kicheko cha furaha, si dhihaka.
- source_word: פִּינוּ
  choice: vinywa vyetu
  rationale: Kiebrania kina umoja wa kijumla, lakini wingi ni wa kawaida na wazi zaidi katika Kiswahili kwa kundi la watu bila kupoteza picha ya kishairi.
- source_word: וּלְשׁוֹנֵנוּ
  choice: na ndimi zetu
  rationale: Wingi wa kawaida wa Kiswahili unaendeleza ulinganifu na “vinywa vyetu” na kuhifadhi taswira ya kiungo cha usemi.
- source_word: רִנָּה
  choice: kelele za furaha
  rationale: Neno linaweza kumaanisha kilio chenye mlio cha shangwe, ambacho huenda kikaimbwa au kupazwa; tafsiri hii hailibani kuwa wimbo rasmi pekee.
- source_word: יֹאמְרוּ
  choice: wakasema
  rationale: Wingi usiotajwa mhusika wake umehifadhiwa, huku -ka- ikiendeleza mfuatano wa usimulizi.
- source_word: בַגּוֹיִם
  choice: miongoni mwa mataifa
  rationale: Hurejelea mataifa au makundi ya watu yaliyomzunguka Israeli, bila kuingiza maana ya kidini ya ziada.
- source_word: הִגְדִּיל ... לַעֲשׂוֹת
  choice: amewatendea mambo makuu
  rationale: Muungano huu ni nahau ya Kiebrania yenye maana ya kufanya mambo makuu; “amewatendea” pia huonyesha tendo lililowanufaisha.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni umbo la kawaida la Kiswahili la jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: עִם אֵלֶּה
  choice: amewatendea
  rationale: Kihalisi ni “pamoja na hawa,” lakini katika nahau hii tendo linaelekezwa kwa manufaa yao; kiwakilishi cha kitu -wa- huwasilisha maana hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: Bwana
  rationale: Chanzo kinatumia jina binafsi la Mungu; kulihifadhi kama “Yahwe” kunalitofautisha na cheo “Bwana” bila kuongeza fundisho la dhehebu.
- issue: Wakati wa kitenzi יִמָּלֵא
  choice: wakati uliopita wa kiusimulizi (“vikajaa”)
  alternative: wakati ujao (“vitajaa”)
  rationale: Muktadha wa Zaburi unakumbuka urejesho kama jambo lililokwisha kutokea, ingawa umbo la Kiebrania lenyewe linaweza katika mazingira mengine kuelekezwa kwa wakati usiokamilika au ujao.
- issue: Mhusika wa יֹאמְרוּ
  choice: ameachwa bila kutajwa wazi (“wakasema”)
  alternative: “mataifa yakasema”
  rationale: Kiebrania kina kitenzi cha wingi na kirai “miongoni mwa mataifa,” lakini hakisemi moja kwa moja kwamba “mataifa” ndiyo kiima; tafsiri haifungi utata huo kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mistari mifupi inadumisha ulinganifu wa ushairi wa Kiebrania. “Kelele za furaha” inaeleweka kwa wasomaji wa kawaida, huku tanbihi ikihifadhi upana wa maana ya רִנָּה.
