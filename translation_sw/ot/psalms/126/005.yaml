  text: Those who sow in tears will reap with joyful shouting[a].
translation:
  language: sw
  text: Wale wanaopanda kwa machozi watavuna kwa kelele za shangwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa vigelegele vya furaha.” Neno la Kiebrania רִנָּה linaweza kumaanisha kilio au kelele ya shangwe, na pia linaweza kujumuisha wimbo wa shangwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזֹּרְעִים
  choice: Wale wanaopanda
  rationale: Kivumishi-tendo chenye kibainishi kimetumiwa kama nomino na kutaja kundi la watu kwa ujumla. “Wale wanaopanda” ni Kiswahili cha kawaida na huhifadhi wingi pamoja na taswira ya kilimo.
- source_word: בְּדִמְעָה
  choice: kwa machozi
  rationale: Kiambishi בְּ kinaonyesha namna au hali ya kupanda. “Kwa machozi” ni usemi wa asili wa Kiswahili unaohifadhi taswira halisi ya machozi na maana ya huzuni.
- source_word: בְּרִנָּה
  choice: kwa vigelegele vya furaha
  rationale: רִנָּה humaanisha kilio cha shangwe kinachosikika, na wakati mwingine huweza kujumuisha wimbo wa furaha. “Vigelegele vya furaha” huonyesha wazi sauti ya shangwe bila kuibana maana iwe kuimba pekee.
- source_word: יִקְצֹרוּ
  choice: watavuna
  rationale: Kauli hii isiyotimilika inaeleza matokeo ya wakati ujao. “Watavuna” ni ya kawaida, fupi, na huhifadhi ulinganifu wa taswira ya kupanda na kuvuna.
