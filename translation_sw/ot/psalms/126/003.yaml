  yaml_path: translation/ot/psalms/126/003.yaml
  text: Yahweh has done great things for us[a]; we were glad.
translation:
  language: sw
  text: Yahweh ametufanyia mambo makuu[a]; tulifurahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri halisi zaidi, “Yahweh amefanya mambo makuu pamoja nasi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגְדִּיל ... לַעֲשׂוֹת
  choice: ametutendea mambo makuu
  rationale: Muundo huu wa Kiebrania ni nahau yenye maana ya ‘kufanya mambo makuu.’ Kiswahili ‘ametutendea mambo makuu’ ni cha asili na kinaonyesha wazi kwamba matendo hayo yalikuwa kwa manufaa yetu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahwe,’ badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: עִמָּנוּ
  choice: ametutendea
  rationale: 'Ingawa עם kwa kawaida humaanisha ‘pamoja na,’ katika nahau hii inaeleweka kwa maana ya manufaa: mambo makuu aliyotufanyia. Kiambishi ‘-tu-’ katika ‘ametutendea’ kinawasilisha maana hiyo kwa Kiswahili cha kawaida; tafsiri halisi zaidi imehifadhiwa katika tanbihi.'
- source_word: הָיִינוּ שְׂמֵחִים
  choice: tulifurahi
  rationale: Kirai hiki kinasema kwamba walikuwa na furaha kutokana na matendo ya Yahwe. ‘Tulifurahi’ ni usemi wa asili, mfupi, na wa kishairi katika Kiswahili, bila kuifanya furaha hiyo kuwa nyepesi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina binafsi la Mungu moja kwa moja. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha na cheo.
- issue: Maana ya עִמָּנוּ katika nahau
  choice: kwa ajili yetu, ikiwakilishwa na ‘ametutendea’
  alternative: pamoja nasi
  rationale: Muktadha unaunga mkono maana ya manufaa, lakini maana halisi ya kihusishi ‘pamoja nasi’ haijafichwa; imewekwa katika tanbihi ili kuhifadhi uwezekano wa kimaandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Ametutendea mambo makuu’ ni cha kawaida zaidi kuliko muundo mgumu wa kuiga nahau ya Kiebrania neno kwa neno.
