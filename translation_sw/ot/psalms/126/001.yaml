  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת בְּ/שׁ֣וּב יְ֭הוָה אֶת שִׁיבַ֣ת צִיּ֑וֹן הָ֝יִ֗ינוּ כְּ/חֹלְמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/001.yaml
  text: A Song of Ascents. When Yahweh restored the fortunes of Zion[a], we were like those who dream.
translation:
  language: sw
  text: Wimbo wa Kupanda. Yahweh alipourejesha ustawi wa Sayuni[a], tulikuwa kama waotaji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alipowarudisha mateka wa Sayuni” au “alipourejesha utekwaji wa Sayuni.” Kirai cha Kiebrania kinaweza kumaanisha hasa kurudi kutoka uhamishoni au, kwa upana zaidi, kurejeshwa kwa ustawi.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa Kupanda
  rationale: Kichwa hiki cha mkusanyo kimetafsiriwa kwa namna iliyo karibu na maana halisi ya ‘kupanda,’ bila kukifasiri moja kwa moja kuwa wimbo wa hija.
- source_word: בְּשׁוּב
  choice: aliporejesha
  rationale: ב pamoja na kitenzi-jina huanzisha kishazi cha wakati; katika Kiswahili, ‘aliporejesha’ huwasilisha kwa kawaida maana ya ‘wakati ... aliporejesha.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu katika Kiebrania limehifadhiwa kama jina maalumu badala ya kubadilishwa kuwa cheo.
- source_word: שִׁיבַת צִיּוֹן
  choice: hali njema ya Sayuni
  rationale: Kirai hiki kinaweza kumaanisha kurejeshwa kwa hali au mafanikio ya awali, na pia kinaweza kurejelea kurudishwa kwa mateka; ‘hali njema’ ni ya kawaida katika Kiswahili na haibani maana kwa uhamisho pekee.
- source_word: הָיִינוּ
  choice: tulikuwa
  rationale: Ni namna ya wakati uliopita ya kitenzi ‘kuwa,’ inayofaa kutafsiriwa ‘tulikuwa.’
- source_word: כְּחֹלְמִים
  choice: kama watu wanaoota ndoto
  rationale: Umbo la kitenzi linawaeleza watu wanaoota; tafsiri hii huhifadhi tashbihi na ni wazi katika Kiswahili cha sasa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yana jina la agano moja kwa moja; ‘Yahweh’ hulihifadhi kama jina maalumu bila kulibadili kuwa cheo.
- issue: Maana ya שִׁיבַת צִיּוֹן
  choice: alirejesha hali njema ya Sayuni
  alternative: aliwarudisha mateka wa Sayuni / aliondoa utumwa wa Sayuni
  rationale: Kirai cha Kiebrania kinaweza kueleza kwa upana kugeuzwa kwa hali kuwa njema au, kwa namna mahususi, kurudi kutoka uhamishoni. Matini kuu haibani maana, na tanbihi huhifadhi uwezekano wa mateka au uhamisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Wimbo wa Kupanda’ huhifadhi kichwa cha jadi bila kuongeza ufafanuzi wa hija ambao hauko wazi katika maneno yenyewe.
