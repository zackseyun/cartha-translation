  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת בְּ/שׁ֣וּב יְ֭הוָה אֶת שִׁיבַ֣ת צִיּ֑וֹן הָ֝יִ֗ינוּ כְּ/חֹלְמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/000.yaml
  text: A Song of Ascents. When Yahweh restored the fortunes of Zion[a], we were like those who dream.
translation:
  language: sw
  text: Wimbo wa Kupanda. BWANA aliporejesha hali njema ya Sayuni[a], tulikuwa kama watu wanaoota ndoto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alipowarudisha mateka wa Sayuni” / “aliporejesha uteka wa Sayuni.” Usemi wa Kiebrania unaweza kumaanisha hasa kurudi kutoka uhamishoni au, kwa upana zaidi, kurejeshwa kwa hali njema.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa Kupanda
  rationale: Kichwa cha mkusanyo kinatafsiriwa kwa namna fupi na ya kawaida, huku maana ya kupanda—huenda safari ya kwenda Yerusalemu—ikihifadhiwa bila kuifafanua kupita kiasi.
- source_word: יְהוָה
  choice: BWANA
  rationale: Huwakilisha jina la agano la Mungu kwa desturi ya Biblia za Kiswahili; herufi kubwa hulitofautisha na cheo cha kawaida.
- source_word: שִׁיבַת צִיּוֹן
  choice: hali njema ya Sayuni
  rationale: Kirai cha Kiebrania kinaweza kumaanisha kurejeshwa kwa hali njema kwa upana au kurudishwa kwa watu kutoka uhamishoni; chaguo hili linaweka maana pana katika matini na maana maalumu katika tanbihi.
- source_word: כְּחֹלְמִים
  choice: kama watu wanaoota ndoto
  rationale: Huhifadhi tashbihi ya Kiebrania na hali ya mshangao usioaminika bila kuongeza maelezo yasiyomo.
theological_decisions:
- issue: Jina la Mungu, tetragramatoni יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: BWANA ndiyo kaida inayotambulika sana katika Biblia za Kiswahili na haitoi matamshi ya jina la Kiebrania kana kwamba hayana mjadala.
- issue: Upeo wa שִׁיבַת צִיּוֹן
  choice: Kurejeshwa kwa hali njema ya Sayuni katika matini, huku kurudi kwa mateka/kutoka uhamishoni kukitajwa katika tanbihi
  alternative: BWANA alipowarudisha mateka wa Sayuni
  rationale: Hifadhi utata halisi wa kirai, ambacho kinaweza kuonyesha ukombozi maalumu kutoka uhamishoni au urejesho mpana wa hali ya jamii.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Kichwa na sentensi zimewekwa kwa ufupi; alama ya tanbihi [a] imo katika matini.
