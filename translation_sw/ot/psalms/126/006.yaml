  yaml_path: translation/ot/psalms/126/006.yaml
  text: He surely goes out weeping[a], carrying the seed for sowing; he will surely come in with joyful shouting[b], carrying his sheaves.
translation:
  language: sw
  text: Hakika huenda akilia,[a] akibeba mbegu za kupanda; hakika atakuja kwa vifijo vya furaha,[b] akibeba miganda yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huendelea na safari yake akilia, akiwa amebeba mfuko wa mbegu”; kirai cha Kiebrania kilichotafsiriwa “mbegu za kupanda” ni kigumu, na wengine hukielewa kwa maana halisi zaidi kuwa mfuko au akiba ya mbegu.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa kuimba” au “kwa kushangilia”; neno la Kiebrania humaanisha kilio au sauti kubwa ya furaha.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ יֵלֵךְ
  choice: Hakika huenda
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi kisichotimilika unasisitiza tendo. “Hakika huenda” huwasilisha msisitizo huo kwa Kiswahili cha kawaida bila kurudia kitenzi kwa namna isiyo ya asili.
- source_word: וּבָכֹה
  choice: akilia
  rationale: Hueleza namna anavyoenda; “akilia” ni fupi, ya asili, na huhifadhi tendo linaloendelea sambamba na kwenda.
- source_word: נֹשֵׂא
  choice: akiwa amebeba
  rationale: Hili ni umbo la kushiriki linaloonyesha tendo linaloambatana na kwenda au kurudi. “Akiwa amebeba” ni la kawaida na wazi katika Kiswahili.
- source_word: מֶשֶׁךְ הַזָּרַע
  choice: mbegu za kupanda
  rationale: Kirai cha Kiebrania ni kigumu, lakini muktadha unaonyesha mbegu zinazobebwa kwa ajili ya kupandwa. Tafsiri hii haitoi uamuzi wa kupita kiasi kuhusu maana inayobishaniwa ya מֶשֶׁךְ.
- source_word: בֹּא יָבֹא
  choice: hakika atarudi
  rationale: Muundo huu unasisitiza kuja. Katika muktadha wa mtu aliyetoka kwenda shambani, “atarudi” huonyesha kwa kawaida mwendo wa kurejea bila kupoteza msisitizo wa “hakika.”
- source_word: בְרִנָּה
  choice: kwa vifijo vya furaha
  rationale: רִנָּה huelekea kumaanisha sauti au kilio cha furaha. “Vifijo vya furaha” huhifadhi hali ya shangwe inayosikika, badala ya furaha ya moyoni tu.
- source_word: אֲלֻמֹּתָיו
  choice: miganda yake
  rationale: Nomino hii humaanisha miganda ya mazao yaliyovunwa. “Miganda yake” ni istilahi sahihi na inayoeleweka katika muktadha wa kilimo.
