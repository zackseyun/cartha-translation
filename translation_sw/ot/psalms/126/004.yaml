  yaml_path: translation/ot/psalms/126/004.yaml
  text: Restore our fortunes[a], O Yahweh[b], like streams in the Negev.
translation:
  language: sw
  text: 'Ee Yahwe, rejesha hali yetu[a],

    kama mikondo katika Negebu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uwarudishe mateka wetu” au “utuondoe utumwani.” Nahau ya Kiebrania inaweza kumaanisha hasa kuwarudisha wahamishwa, au kwa upana zaidi kurejesha hali ya watu.
    reason: alternative_reading
  - marker: b
    text: Picha hii ni ya mikondo katika Negebu ambayo kwa kawaida huwa mikavu, lakini hujaa maji ghafula mvua inaponyesha.
    reason: cultural_note
lexical_decisions:
- source_word: שׁוּבָה
  choice: uturudishie
  rationale: Ni amri/ombi linaloelekezwa kwa Yahwe. Pamoja na שבותנו, kitenzi hiki kinaomba hali ya jumuiya irejeshwe; “uturudishie” ni Kiswahili cha kawaida kinachobeba wazo la kurudisha au kurejesha bila kulazimisha maana finyu ya kurudi kwa wahamishwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: אֶת
  choice: '[alama ya yambwa, haitafsiriwi moja kwa moja]'
  rationale: Ni alama ya kisarufi ya yambwa bainifu; kazi yake imewakilishwa katika muundo wa sentensi ya Kiswahili.
- source_word: שבותנו
  choice: hali yetu njema
  rationale: Katika nahau שוב את־שבות, neno hili linaweza kumaanisha mateka/uhamisho au kurejeshwa kwa hali na mema ya watu. “Hali yetu njema” huweka ombi pana na la kawaida katika Kiswahili, huku uwezekano wa kurudishwa kwa mateka ukihifadhiwa katika tanbihi.
- source_word: כַּאֲפִיקִים
  choice: kama vijito vya maji
  rationale: אֲפִיקִים ni mikondo, mabonde, au njia za maji. “Vijito vya maji” ni picha inayoeleweka kwa urahisi; tanbihi inaeleza kuwa mikondo hiyo kwa kawaida huwa mikavu na hujaa mvua inaponyesha.
- source_word: בַּנֶּגֶב
  choice: katika Negebu
  rationale: Hapa נֶגֶב inaelekea kutaja eneo kame la kusini la Negebu, si mwelekeo wa kusini tu; jina la kijiografia linahifadhi picha mahsusi ya shairi.
theological_decisions:
- issue: Maana ya nahau שוב את־שבות
  choice: ombi la kurejeshwa kwa hali njema ya jumuiya kwa upana
  alternative: ombi mahsusi la kuwarudisha mateka au wahamishwa
  rationale: Nahau ya Kiebrania inaweza kuashiria kurudi halisi kutoka utumwani au kugeuzwa kwa hali ya watu kwa upana. Muktadha wa kurejeshwa baada ya dhiki una mwangwi wa uhamisho, lakini tafsiri kuu imeachwa pana ili kutohitimisha mvutano huo kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Ee Yahwe” huhifadhi mwito wa moja kwa moja; mpangilio wa mistari huhifadhi ulinganisho wa kishairi. “Negebu” limetumiwa kama jina la eneo la kijiografia.
