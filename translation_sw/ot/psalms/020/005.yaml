  text: נְרַנְּנָ֤ה בִּ֘/ישׁ֤וּעָתֶ֗/ךָ וּ/בְ/שֵֽׁם אֱלֹהֵ֥י/נוּ נִדְגֹּ֑ל יְמַלֵּ֥א יְ֝הוָ֗ה כָּל מִשְׁאֲלוֹתֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/005.yaml
  text: We will shout for joy in your salvation[a], and in the name of our God we will raise our banners[c][b]. May Yahweh fulfill all your requests.
translation:
  language: sw
  text: Tutapaza sauti kwa shangwe kwa wokovu wako[a], na kwa jina la Mungu wetu tutainua bendera zetu[b]. Yahwe[c] ayatimize maombi yako yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukombozi wako” au “ushindi wako.” Neno la Kiebrania linaweza kumaanisha wokovu kwa maana pana, kutia ndani kuokolewa au kupata ushindi vitani.
    reason: lexical_alternative
  - marker: b
    text: Au “tutaisimamisha bendera yetu” au “tutapeperusha bendera.” Kitenzi cha Kiebrania huenda kinaonyesha kuinua au kuonyesha bendera kwa shangwe.
    reason: lexical_alternative
  - marker: c
    text: Au “Yahwe atatimiza maombi yako yote.” Umbo la Kiebrania linaweza kueleweka kama ombi au kama taarifa ya wakati ujao, ingawa maana ya ombi inafaa vizuri katika muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: נְרַנְּנָה
  choice: Tutapaza sauti kwa shangwe
  rationale: Kitenzi רנן kinaonyesha furaha kuu inayotamkwa kwa sauti. Tafsiri hii inadumisha nguvu ya shangwe ya hadhara bila kudai kwamba ni kuimba hasa.
- source_word: בִּישׁוּעָתֶךָ
  choice: kwa ajili ya wokovu wako
  rationale: יְשׁוּעָה inaweza kumaanisha wokovu, ukombozi, au ushindi. “Wokovu” inadumisha upana wa maana huku ikiruhusu muktadha wa ushindi wa kifalme au wa kijeshi.
- source_word: וּבְשֵׁם אֱלֹהֵינוּ
  choice: na kwa jina la Mungu wetu
  rationale: Kirai hiki kinaonyesha kutenda na kushangilia chini ya mamlaka na utambulisho wa Mungu; “kwa jina la” ni nahau ya kawaida na yenye heshima katika Kiswahili.
- source_word: נִדְגֹּל
  choice: tutainua bendera zetu
  rationale: Kitenzi kinahusiana na bendera au alama ya kundi na hapa huenda kinaonyesha kuinua au kuonyesha bendera wakati wa kusherehekea. Wingi “bendera zetu” unasikika kwa kawaida na unafaa tendo la jumuiya.
- source_word: יְמַלֵּא
  choice: ayatimize
  rationale: Ingawa umbo la Kiebrania linaweza kusomwa kama wakati ujao, katika muktadha huu linaeleweka vizuri kama ombi au baraka. Kiambishi cha utegemezi “a-” katika “ayatimize” kinatoa maana ya ‘na afanye hivyo’.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna ya kulitaja moja kwa moja badala ya kulibadilisha kuwa cheo.
- source_word: כָּל מִשְׁאֲלוֹתֶיךָ
  choice: maombi yako yote
  rationale: מִשְׁאֲלוֹת ni mambo yanayoombwa. “Maombi yako yote” ni Kiswahili cha kawaida kinachofaa muktadha wa sala, bila kuyafanya kuwa matamanio yasiyotamkwa.
theological_decisions:
- issue: Maana ya יְשׁוּעָה katika zaburi ya kifalme yenye muktadha wa mapambano
  choice: wokovu
  alternative: ushindi; ukombozi
  rationale: Muktadha unaruhusu “ushindi,” lakini “wokovu” huhifadhi upana wa neno la Kiebrania na haiondoi maana ya kuokolewa au kupata ushindi.
- issue: Nguvu ya יְמַלֵּא katika kifungu cha mwisho
  choice: 'ombi au baraka: “Yahwe ayatimize”'
  alternative: 'taarifa ya wakati ujao: “Yahwe atatimiza”'
  rationale: Mtiririko wa zaburi unaunga mkono ombi la jumuiya kwa ajili ya mfalme, lakini tanbihi inadumisha uwezekano wa kusoma umbo hilo kama taarifa ya wakati ujao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi inayoweza kueleweka kwa urahisi. “Tutapaza sauti kwa shangwe” huhifadhi nguvu ya kushangilia kwa sauti; “bendera” hudumisha taswira halisi ya sherehe; “ayatimize” huonyesha ombi la baraka.
