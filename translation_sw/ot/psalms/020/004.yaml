translation:
  language: sw
  text: Akupe matamanio ya moyo wako, na ayatimize mashauri yako yote[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mipango yako yote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּן
  choice: Akupe
  rationale: 'Katika muktadha huu wa dua na baraka, umbo la yiqtol linaeleweka kama ombi au takwa: ‘akupe.’ Kitenzi ‘kupa’ kinawasilisha maana ya msingi ya נתן kwa Kiswahili cha kawaida.'
- source_word: לְךָ
  choice: -ku- katika ‘akupe’
  rationale: Yambwa tendewa ya nafsi ya pili imewasilishwa kiasili kwa kiambishi cha Kiswahili ‘-ku-’ ndani ya kitenzi.
- source_word: כִלְבָבֶךָ
  choice: sawasawa na moyo wako
  rationale: Usemi huu unahifadhi sitiari ya Kiebrania ya ‘moyo’ kama kitovu cha matamanio, nia na kusudi, bila kuibana iwe hisia pekee. ‘Sawasawa na’ linawakilisha כִּ kwa lugha inayoeleweka.
- source_word: וְכָל
  choice: na ... yote
  rationale: Muundo wa Kiswahili huweka ‘yote’ baada ya nomino, huku ‘na’ likihifadhi kiunganishi cha Kiebrania.
- source_word: עֲצָתְךָ
  choice: mashauri yako
  rationale: עֵצָה linaweza kumaanisha shauri, mpango au kusudi. ‘Mashauri’ linahifadhi wazo la jambo lililofikiriwa na kuamuliwa, huku ‘mipango’ ikitolewa katika tanbihi kama maana nyingine inayofaa katika muktadha.
- source_word: יְמַלֵּא
  choice: kuyatimiza
  rationale: Piel ya מלא hapa ina maana ya kuleta jambo kwenye utimilifu. ‘Kuyatimiza’ ni sawa ya kawaida na yenye hadhi katika ombi hili.
theological_decisions:
- issue: Nguvu ya maumbo ya vitenzi katika muktadha wa baraka au sala
  choice: 'Vitenzi vyote vimetafsiriwa kama ombi: ‘Akupe ... na kuyatimiza ...’'
  alternative: 'Kutafsiri kama taarifa ya wakati ujao: ‘Atakupa ... na atatimiza ...’'
  rationale: Ingawa maumbo ya Kiebrania ni yiqtol, mfuatano wa maombi katika Zaburi 20 unaunga mkono matumizi ya kutakia au kuomba. Tafsiri hii inadumisha sauti ya kiliturujia bila kuigeuza kuwa utabiri wa moja kwa moja.
- issue: Maana ya ‘moyo’
  choice: Kudumisha ‘moyo’ kama kitovu cha matamanio, nia na kusudi
  alternative: Kufafanua moja kwa moja kuwa ‘matamanio yako,’ ‘nia yako,’ au ‘mapenzi yako’
  rationale: Kiebrania kinatumia ‘moyo,’ neno lenye upana wa maana kuhusu utu wa ndani. Kulihifadhi huepuka kuifanya maana iwe hisia, fikra au mapenzi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Akupe’ na ‘kuyatimiza’ vinadumisha sauti ya dua. Usemi ‘sawasawa na moyo wako’ umechaguliwa ili kuhifadhi umbo la Kiebrania, huku tanbihi ikitoa tafsiri ya maana iliyo wazi zaidi na pia kuhifadhi uwezekano wa ‘mipango’ kwa עֵצָה.
