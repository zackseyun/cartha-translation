lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongozaji wa muziki
  rationale: Katika vichwa vya Zaburi, neno hili hueleweka kama maelekezo kwa mtu anayesimamia utendaji wa muziki. Tafsiri hii ni ya kawaida na haibani maana kwenye kwaya pekee.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Neno hili humaanisha wimbo wa kuimbwa kwa kuandamana na muziki; katika muktadha huu, “Zaburi” ndilo neno sanifu na sahihi.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kihusishi cha Kiebrania kinaweza kuonyesha utunzi, umilikaji au uhusiano, au kuwekwa kwa ajili ya mtu. “Ya Daudi” hudumisha upana huo kwa Kiswahili bila kuamua kwamba lazima Daudi ndiye aliyeiandika.
theological_decisions:
- issue: Maana ya kichwa kinachomhusisha Daudi
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi; kwa ajili ya Daudi
  rationale: Muundo wa Kiebrania hauamui wazi ikiwa unaonyesha mwandishi, uhusiano, au kuwekwa wakfu. Matini kuu inadumisha utata huo halisi, na maelezo ya chini yanataja maana nyingine zinazowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. “Mwongozaji wa muziki” limetumiwa badala ya neno linalodokeza kwaya pekee, kwa kuwa Kiebrania hakitaji kwaya moja kwa moja.
