  text: Kwa mwongozaji wa muziki. Zaburi ya Daudi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “iliyoandikwa na Daudi” au “kwa ajili ya Daudi”; kichwa cha Kiebrania kinaweza kuonyesha utunzi, uhusiano, au kuwekwa wakfu.
