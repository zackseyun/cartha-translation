  yaml_path: translation/ot/psalms/020/007.yaml
  text: These trust in chariots and those in horses, but we call on the name of the LORD our God.
translation:
  language: sw
  text: Hawa hutegemea magari ya vita, na wale hutegemea farasi, lakini sisi tutalitaja jina la BWANA, Mungu wetu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “lakini sisi tutalikumbuka jina la BWANA, Mungu wetu”; neno la Kiebrania linaweza pia kudokeza kulitaja au kulitangaza jina hilo.'
    reason: Kitenzi נַזְכִּיר kina uwezekano wa maana kadhaa ambao tafsiri moja haiwezi kuonyesha kikamilifu.
lexical_decisions:
- source_word: בָרֶכֶב / בַסּוּסִים
  choice: hutegemea magari ya vita / hutegemea farasi
  rationale: Kiebrania kina vifungu vifupi visivyo na kitenzi wazi; katika muktadha vinatofautisha msingi wa tumaini wa mataifa na wa watu wa Mungu. Kurudia “hutegemea” huifanya sentensi iwe wazi na ya kawaida kwa Kiswahili.
- source_word: נַזְכִּיר
  choice: tutalitaja
  rationale: Hifili ya זכר hapa inaweza kumaanisha kutaja, kukumbusha, au kulitangaza jina. “Tutalitaja” huhifadhi maana ya msingi bila kuamua kimya kimya kuwa ni “kujivunia” au “kuliitia.”
- source_word: שֵׁם יְהוָה אֱלֹהֵינוּ
  choice: jina la BWANA, Mungu wetu
  rationale: Huhifadhi muundo wa Kiebrania na desturi ya Kiswahili ya kuwakilisha tetragramatoni kwa “BWANA.”
theological_decisions:
- issue: Maana ya נַזְכִּיר katika utofautishaji na magari na farasi
  choice: tutalitaja jina
  alternative: tutaliitia jina / tutajivunia jina / tutalikumbuka jina
  rationale: Neno lina upana wa maana. “Tutalitaja” ni karibu zaidi na umbo la kisababishi na linaacha wazi iwapo tendo hilo linahusisha kumwomba, kumkiri, au kumtangaza BWANA.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ya heshima na iliyo wazi. “Magari ya vita” huepuka maana ya magari ya kisasa, na “BWANA” hutumiwa kwa jina la agano יהוה.
