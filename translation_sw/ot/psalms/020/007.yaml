  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo wa Kiebrania: utofautishaji wa “hawa ... na wale ... lakini sisi,” magari ya vita na farasi kama vitu vya kutegemewa, na tendo נַזְכִּיר linalohusishwa na jina la יהוה, Mungu wetu. “Tutalitaja jina” ni chaguo linalokubalika na lenye tahadhari kwa kitenzi hiki, ambacho kina upeo wa “kutaja/kukumbuka” katika muktadha huu. Ingawa audit ya Kiingereza ina “call on,” rasimu ya Kiswahili haipaswi kulazimishwa kufuata ufafanuzi huo kwa kuwa chanzo cha Kiebrania hakilazimishi maana hiyo pekee.'
