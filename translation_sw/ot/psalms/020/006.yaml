base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/006.yaml
  text: I know that the LORD saves his anointed; he answers him from his holy heaven with the mighty saving deeds of his right hand.
translation:
  language: sw
  text: Sasa najua kwamba BWANA amemwokoa mtiwa-mafuta wake; atamjibu kutoka mbinguni mwake mtakatifu kwa matendo makuu ya wokovu ya mkono wake wa kuume.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַתָּה
  choice: Sasa
  rationale: Ni kielezi cha wakati kilicho wazi katika Kiebrania; hapa kinaonyesha uthibitisho au utambuzi wa sasa.
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea ya tafsiri za Biblia za Kiswahili kwa jina la agano YHWH.
- source_word: מְשִׁיחוֹ
  choice: mtiwa-mafuta wake
  rationale: Huhifadhi maana ya moja kwa moja ya nomino ya Kiebrania na rejeo lake la karibu kwa mfalme, bila kulifanya moja kwa moja kuwa cheo maalumu.
- source_word: הוֹשִׁיעַ
  choice: humwokoa
  rationale: Kauli timilifu ya Kiebrania inaeleza kwa uhakika tendo la BWANA la kuokoa; wakati wa mazoea katika Kiswahili unafaa kwa ungamo hili la imani huku ukiacha wazi utekelezaji wake katika tukio husika.
- source_word: יַעֲנֵהוּ
  choice: atamjibu
  rationale: Kauli isiyotimilika inaelekea kwenye jibu linalotarajiwa, hivyo wakati ujao ni wa asili katika muktadha.
- source_word: בִּגְבֻרוֹת יֵשַׁע יְמִינוֹ
  choice: kwa matendo makuu ya wokovu ya mkono wake wa kuume
  rationale: Huwakilisha wingi wa גבורות kama matendo yenye nguvu na huhifadhi picha ya mkono wa kuume kuwa chombo cha wokovu.
theological_decisions:
- issue: Rejeo la 'mtiwa-mafuta wake'
  choice: Limedumishwa kama usemi wa kawaida wa kifalme
  alternative: Masihi wake
  rationale: Katika muktadha wa Zaburi 20, usemi unaweza kumrejelea mfalme aliyetiwa mafuta; tafsiri haipaswi kulazimisha cheo cha baadaye wala kuzuia usomaji mpana wa kimasihi.
- issue: Uhusiano kati ya uhakika wa wokovu na jibu la wakati ujao
  choice: humwokoa ... atamjibu
  alternative: amemwokoa ... anamjibu
  rationale: Mchanganyiko huu huhifadhi mvutano wa Kiebrania kati ya uhakika unaokiriwa wa wokovu na jibu linalotazamiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi umehifadhi ulinganifu wa mistari ya Kiebrania bila kuwa mgumu kupita kiasi.
