  text: May he send you help from the sanctuary and sustain you from Zion[a][b].
translation:
  language: sw
  text: Akutumie msaada kutoka patakatifu[b], na kutoka Sayuni akutegemeze[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akusaidie” au “akushikilie” kutoka Sayuni.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania pia kinaweza kumaanisha “kutoka katika utakatifu” au “kutoka mahali patakatifu”; hapa inaelekea panarejelea patakatifu pa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: Akutumie
  rationale: Kauli ya wakati usiotimilika ya Kiebrania katika muktadha huu wa sala na baraka inaeleweka kama ombi au tamanio, si taarifa rahisi ya wakati ujao.
- source_word: עֶזְרְךָ
  choice: msaada
  rationale: Nomino עֵזֶר yenye kiambishi cha nafsi ya pili umoja humaanisha msaada wako au msaada kwa ajili yako; muundo wa Kiswahili 'akutumie msaada' unaeleza mpokeaji kwa kawaida.
- source_word: מִקֹּדֶשׁ
  choice: kutoka patakatifu
  rationale: קֹדֶשׁ yaweza kumaanisha utakatifu au mahali patakatifu. Sambamba na 'kutoka Sayuni,' maana ya mahali ndiyo inayofaa zaidi, huku tanbihi ikihifadhi upana wa neno.
- source_word: וּמִצִּיּוֹן
  choice: na kutoka Sayuni
  rationale: Kiunganishi וּ kinaunganisha vipande viwili sambamba, na צִיּוֹן limetoholewa kwa namna iliyozoeleka katika Kiswahili kama Sayuni.
- source_word: יִסְעָדֶךָּ
  choice: akutegemeze
  rationale: Kitenzi סעד kina maana ya kutegemeza, kusaidia, au kuimarisha. 'Akutegemeze' huhifadhi picha ya kushikilia na kuendeleza, na muundo wake unaonyesha ombi au tamanio.
theological_decisions:
- issue: Mhusika wa vitenzi ambaye hajatajwa wazi
  choice: Kutumia kiambishi cha nafsi ya tatu umoja katika 'akutumie' na 'akutegemeze' bila kuongeza jina la Mungu.
  alternative: Kusema wazi 'BWANA akutumie ... na akutegemeze.'
  rationale: Kiebrania hakitaji mhusika kwa jina katika mstari huu; anafahamika kutokana na muktadha uliotangulia. Kutomtaja kwa jina huepuka kuongeza maneno yasiyokuwamo hapa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa vifungu unafuata usambamba wa Kiebrania; alama zote za tanbihi zimo katika maandishi makuu.
