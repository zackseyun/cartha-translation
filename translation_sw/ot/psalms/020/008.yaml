  yaml_path: translation/ot/psalms/020/008.yaml
  text: They have bowed down and fallen[a], but we have risen and stand upright.
translation:
  language: sw
  text: 'Wao wamepiga magoti na kuanguka,

    lakini sisi tumeinuka na kusimama wima.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kujiimarisha,” “kuimarika,” au “kusimama imara” kwa kitenzi cha mwisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Wao
  rationale: Kiwakilishi huru cha nafsi ya tatu wingi kinasisitiza utofauti kati ya wao na sisi; “Wao” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: כָּרְעוּ
  choice: wamepiga magoti
  rationale: Kitenzi kinaonyesha kupinda au kupiga magoti, hata kudidimia; uchaguzi huu unahifadhi taswira ya kimwili na kuandaa sambamba na “kuanguka.”
- source_word: וְנָפָלוּ
  choice: na kuanguka
  rationale: Tafsiri ya moja kwa moja huhifadhi uratibu na ulinganifu wa kishairi na kitenzi kilichotangulia.
- source_word: וַאֲנַחְנוּ
  choice: lakini sisi
  rationale: Ingawa kiunganishi kimsingi ni “na,” muktadha unaonyesha utofauti wazi kati ya “wao” na “sisi”; “lakini” huwasilisha nguvu hiyo kwa Kiswahili asilia.
- source_word: קַּמְנוּ
  choice: tumeinuka
  rationale: Mzizi קום humaanisha kuinuka au kusimama; “tumeinuka” huhifadhi utofauti wa kishairi na kuanguka kwa wale wengine.
- source_word: וַנִּתְעוֹדָד
  choice: na kusimama imara
  rationale: Umbo hili adimu linaweza kueleza kujisimamisha tena, kuimarika, au kusimama wima. “Kusimama imara” huunganisha taswira ya kurejea katika hali ya kusimama na wazo la uthabiti bila kuifafanua kupita kiasi.
