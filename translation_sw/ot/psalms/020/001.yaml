id: PSA.20.1
reference: Psalms 20:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: יַֽעַנְ/ךָ֣ יְ֭הוָה בְּ/י֣וֹם צָרָ֑ה יְ֝שַׂגֶּבְ/ךָ֗ שֵׁ֤ם אֱלֹהֵ֬י יַעֲקֹֽב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/001.yaml
  text: May Yahweh answer you in the day of trouble[a]; may the name of the God of Jacob protect you.
translation:
  language: sw
  text: 'Yahwe akujibu siku ya taabu;

    jina la Mungu wa Yakobo likuweke mahali pa juu pasipofikika.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “likulinde.” Kitenzi cha Kiebrania kinatoa picha ya kuwekwa juu, mahali salama ambapo hatari haiwezi kukufikia.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַנְךָ
  choice: akujibu
  rationale: Kitenzi ענה hapa kina maana ya kujibu au kuitikia. Hali ya utegemezi katika Kiswahili (“akujibu”) inawasilisha ombi au baraka, wala si utabiri wa moja kwa moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja kama “Yahwe” badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: בְּיוֹם צָרָה
  choice: siku ya taabu
  rationale: Tafsiri hii inadumisha picha ya Kiebrania ya “siku” na maana pana ya צָרָה, yaani taabu au dhiki.
- source_word: יְשַׂגֶּבְךָ
  choice: likuweke mahali pa juu pasipofikika
  rationale: שׂגב katika kauli hii huchora picha ya mtu kuwekwa juu, mbali na kufikiwa na hatari. Tafsiri hii inahifadhi sitiari pamoja na wazo la ulinzi.
- source_word: שֵׁם
  choice: jina
  rationale: “Jina” linahifadhi lugha halisi na umuhimu wake wa kishairi na kitheolojia, bila kuifupisha kuwa mamlaka au sifa tu.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: Mungu wa Yakobo
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya muundo wa Kiebrania, nayo inadumisha maana yake ya kihistoria na ya agano.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina binafsi יהוה; kulitohowa kama “Yahwe” kunalitofautisha na cheo na kuhifadhi jina la agano.
- issue: Nguvu ya vitenzi katika muktadha wa sala au baraka
  choice: 'Hali ya ombi: “akujibu ... likuweke”'
  alternative: 'Wakati ujao wa taarifa: “atakujibu ... litakuweka”'
  rationale: Muktadha wa zaburi ya baraka unaunga mkono maana ya matakwa au ombi. Hali ya utegemezi ya Kiswahili huwasilisha maana hiyo bila kuigeuza kuwa ahadi ya taarifa.
- issue: Sitiari ya שׂגב
  choice: Kuhifadhi picha ya kuwekwa mahali pa juu pasipofikika
  alternative: likulinde
  rationale: Kitenzi kinajumuisha ulinzi lakini kinaifanya kupitia picha ya kuinuliwa mahali ambako hatari haiwezi kufikia. Maandishi makuu yanahifadhi picha hiyo, huku tanbihi ikitoa maana iliyorahisishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa kishairi, wenye heshima na unaoeleweka kwa msomaji wa kawaida. Mistari miwili inahifadhi usambamba wa Kiebrania, na hali ya utegemezi inaonyesha ombi la baraka.
