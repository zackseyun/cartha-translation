  text: יְהוָ֥ה הוֹשִׁ֑יעָ/ה הַ֝/מֶּ֗לֶךְ יַעֲנֵ֥/נוּ בְ/יוֹם קָרְאֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/009.yaml
  text: O Yahweh[a], save! May the King answer us in the day we call.
translation:
  language: sw
  text: Ee Yahwe[a], okoa! Mfalme atujibu siku tunapoita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Ee Yahwe, mwokoe mfalme; utujibu siku tunapoita”; au huenda: “Ee Yahwe, okoa! Mfalme hutujibu siku tunapoita.” Sintaksia ya Kiebrania imebanwa na inaruhusu zaidi ya uelewa mmoja wa nafasi ya “mfalme.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi ‘Yahwe’ badala ya kubadilishwa na cheo; ‘Ee’ linaonyesha kwamba sala inamwelekea moja kwa moja.
- source_word: הוֹשִׁיעָה
  choice: okoa!
  rationale: Ni amri ya moja kwa moja katika sala. ‘Okoa!’ huhifadhi maana pana ya kukomboa au kuleta ushindi bila kutaja kitu kisichotajwa wazi katika Kiebrania.
- source_word: הַמֶּלֶךְ
  choice: Mfalme
  rationale: Nomino yenye kibainishi imetafsiriwa ‘Mfalme.’ Muundo wa sentensi unaweza kumrejelea mfalme wa kibinadamu au Mungu akiwa Mfalme; utata huo umehifadhiwa katika tanbihi.
- source_word: יַעֲנֵנוּ
  choice: atujibu
  rationale: Hali ya utegemezi katika Kiswahili huwasilisha ombi au tumaini linalofanana na nguvu ya jussive ya kitenzi cha Kiebrania.
- source_word: בְיוֹם
  choice: siku
  rationale: ‘Siku tunapoita’ huhifadhi nahau ya wakati ya Kiebrania kwa Kiswahili cha kishairi na kinachoeleweka.
- source_word: קָרְאֵנוּ
  choice: tunapoita
  rationale: ‘Kuita’ ndiyo maana ya msingi ya קרא; haijaongezewa nguvu ya kihisia ya ‘kulia kwa sauti,’ ambayo haijaelezwa wazi hapa.
theological_decisions:
- issue: Mrejelewa na nafasi ya ‘Mfalme’ katika sentensi
  choice: Katika matini kuu, ‘Mfalme’ ni mtenda wa ‘atujibu,’ huku utambulisho wake ukiachwa wazi.
  alternative: ‘Mfalme’ anaweza kuwa mtendwa wa ‘okoa,’ au anaweza kumaanisha Yahwe akiwa Mfalme na kauli inayofuata kuwa ya uhakika.
  rationale: Sintaksia ya Kiebrania imebanwa na inaruhusu miundo kadhaa. Matini kuu inafuata mgawanyo unaoungwa mkono na alama za Masora baada ya ‘okoa,’ lakini tanbihi inalinda usomaji mwingine wenye umuhimu wa kitafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sala ya kishairi lakini maneno ya kawaida. Usemi mfupi ‘okoa!’ na muundo ‘Mfalme atujibu’ huhifadhi ufupi na mvutano wa Kiebrania badala ya kuufafanua kupita kiasi.
