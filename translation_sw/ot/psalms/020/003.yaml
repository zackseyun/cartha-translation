source:
  edition: WLC
  text: יִזְכֹּ֥ר כָּל מִנְחֹתֶ֑/ךָ וְ/עוֹלָתְ/ךָ֖ יְדַשְּׁנֶ֣/ה סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/003.yaml
  text: May he remember all your offerings and accept your burnt offering[b][a]. Selah
translation:
  language: sw
  text: Ayakumbuke matoleo yako yote[a], na aikubali sadaka yako ya kuteketezwa[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka zako za nafaka”; neno la Kiebrania minḥah linaweza kumaanisha hasa sadaka ya nafaka au, kwa upana zaidi, toleo au zawadi.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “aifanye nono” au “aihesabu kuwa nono”; hii ni nahau ya kuipokea dhabihu kwa kibali.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְכֹּר
  choice: Ayakumbuke
  rationale: Kauli ya Qal imperfect nafsi ya tatu umoja imetumiwa kama ombi au tamanio katika baraka; ‘Ayakumbuke’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: כָּל
  choice: yote
  rationale: Huhifadhi maana jumuishi ya kihesabu ya neno la Kiebrania.
- source_word: מִנְחֹתֶךָ
  choice: matoleo yako
  rationale: מִנְחָה inaweza kumaanisha zawadi au toleo kwa upana, na pia sadaka ya nafaka hasa; ‘matoleo’ huepuka kubainisha zaidi ya ushahidi wa muktadha, huku maana mahususi ikiwekwa katika tanbihi.
- source_word: וְעוֹלָתְךָ
  choice: na sadaka yako ya kuteketezwa
  rationale: עוֹלָה ni istilahi ya kawaida ya sadaka iliyoteketezwa; tafsiri hii ni sahihi na inaeleweka katika Kiswahili cha sasa.
- source_word: יְדַשְּׁנֶה
  choice: aikubali
  rationale: Piel ya דשן ina picha halisi ya kunenepesha au kuhesabu kuwa nono, lakini katika muktadha wa dhabihu ni nahau ya kuipokea kwa kibali; ‘aikubali’ hutoa maana hiyo kwa uwazi.
- source_word: סֶלָה
  choice: Sela
  rationale: Neno limeandikwa kwa namna ya matamshi kwa sababu maana au kazi yake kamili haijulikani kwa hakika.
theological_decisions:
- issue: Mhusika wa vitenzi vya nafsi ya tatu umoja
  choice: Mungu anaeleweka kutokana na muktadha, na katika Kiswahili anaonyeshwa ndani ya vitenzi ‘Ayakumbuke’ na ‘aikubali’.
  alternative: Kuacha mhusika wa kimungu bila kubainika kabisa.
  rationale: Katika Zaburi 20 kusanyiko linaomba kibali cha Mungu kwa ajili ya mfalme. Kiebrania hakimtaji mhusika wazi katika mstari huu, lakini muktadha unamtambulisha; viambishi vya Kiswahili huwasilisha jambo hilo bila kuongeza dai jipya la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio unadumisha muundo sambamba wa Kiebrania na kutohakikisha maana ya ‘Sela’.
