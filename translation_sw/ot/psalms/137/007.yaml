base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/007.yaml
  text: Remember[a], O Yahweh, against the sons of Edom the day of Jerusalem, those who were saying, “Lay it bare, lay it bare[b], down to its foundation!”
translation:
  language: sw
  text: Ee Yahweh, wakumbuke[a] wana wa Edomu kwa ajili ya siku ya Yerusalemu, wale waliokuwa wakisema, “Iwekeni wazi kabisa, iwekeni wazi kabisa[b], mpaka kwenye msingi wake!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwakumbuke dhidi yao.” Ombi hili linamtaka Yahweh awakumbuke wana wa Edomu kwa hukumu kuhusiana na siku ya maafa ya Yerusalemu.
    reason: lexical_alternative
  - marker: b
    text: Au, “Ivueni kabisa, ivueni kabisa,” au, “Ibomoeni kabisa, ibomoeni kabisa.” Kitenzi cha Kiebrania kinasisitiza kuuvua au kuufunua mji kabisa, mpaka msingi wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: wakumbuke
  rationale: Amri ya umoja wa kiume inamwelekea Yahweh. Katika Kiswahili, kiambishi cha yambwa katika “wakumbuke” kinarejelea wana wa Edomu, huku kirai kinachofuata kikieleza sababu ya hukumu inayotakiwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa moja kwa moja kama jina binafsi, badala ya kubadilishwa kuwa cheo kama “BWANA”.
- source_word: לִבְנֵי אֱדוֹם
  choice: wana wa Edomu
  rationale: Huhifadhi usemi wa Kiebrania wa kifamilia na kitaifa badala ya kuufupisha kuwa “Waedomu.” Nguvu ya kimahakama ya ל inaelezwa kwa Kiswahili cha kawaida kupitia “kwa sababu ya” pamoja na muktadha wa ombi.
- source_word: אֵת יוֹם יְרוּשָׁלִָם
  choice: siku ya Yerusalemu
  rationale: Huhifadhi ufupi na utata halisi wa usemi wa Kiebrania; muktadha unaonyesha siku ya maafa ya mji bila kuingiza kitenzi “ulipoanguka” katika matini kuu.
- source_word: הָאֹמְרִים
  choice: wale waliokuwa wakisema
  rationale: Muundo huu huhifadhi nguvu ya participio inayoonyesha kilio chao kilichoendelea wakati huo.
- source_word: עָרוּ עָרוּ
  choice: Uvueni kabisa, uvueni kabisa
  rationale: Kitenzi kina wazo la kuvua, kufunua, au kuweka wazi kabisa. Kurudia amri kunahifadhi msisitizo mkali wa Kiebrania.
- source_word: עַד הַיְסוֹד בָּהּ
  choice: mpaka kwenye msingi wake
  rationale: Hueleza uharibifu au ufunuaji uliofika chini kabisa, huku “msingi” wa umoja ukifuata nomino ya Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini inatumia Tetragramatoni kama jina binafsi. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya ombi “wakumbuke” kuhusu Edomu
  choice: kwa sababu ya siku ya Yerusalemu
  alternative: wakumbuke dhidi yao; uwalipe kwa ajili ya siku ya Yerusalemu
  rationale: Muktadha ni wa kimahakama na wa kulipiza, lakini tafsiri kuu haiongezi moja kwa moja kitenzi “uwalipe,” ambacho hakipo katika Kiebrania. “Kwa sababu ya” huacha maana hiyo itokane na muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ee” linafaa kwa mwito wa maombi; marudio ya amri yamehifadhiwa kwa nguvu ya kishairi. Usemi “siku ya Yerusalemu” umeachwa kwa makusudi ili kuhifadhi ufupi na utata wa chanzo.
