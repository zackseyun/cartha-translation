base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/006.yaml
  text: May my tongue cling to the roof of my mouth if I do not remember you[b][a], if I do not exalt Jerusalem above my highest joy.
translation:
  language: sw
  text: Ulimi wangu ugandamane na kaakaa langu[a] nisipokukumbuka, nisipoiweka Yerusalemu juu kuliko furaha yangu yote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, sehemu ya juu ndani ya kinywa.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “nisipoiinua Yerusalemu juu ya kichwa cha furaha yangu”; yaani, nisipoipa Yerusalemu nafasi ya juu kuliko furaha yangu yote.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּדְבַּק
  choice: na ushikamane
  rationale: Kauli ya kujitakia adhabu inaelezwa kwa ‘na ushikamane,’ ikihifadhi maana ya דבק, ‘kushikamana/kugandamana,’ kwa lugha ya heshima na ya kawaida.
- source_word: לְשׁוֹנִי
  choice: ulimi wangu
  rationale: Ni neno la moja kwa moja la kiungo cha mwili; taswira ya kushindwa kusema ni muhimu katika kiapo hiki.
- source_word: לְחִכִּי
  choice: na kaakaa langu
  rationale: חֵךְ humaanisha kaakaa la kinywa. ‘Kaakaa langu’ ni sahihi na fupi katika Kiswahili Sanifu huku ikihifadhi taswira halisi.
- source_word: אִם לֹא
  choice: nisipo-
  rationale: Muundo wa masharti hasi wa Kiebrania umehamishwa kwa muundo wa kawaida wa Kiswahili ‘nisipo-,’ unaounganisha hali hiyo na laana ya kujitakia.
- source_word: אֶזְכְּרֵכִי
  choice: nisipokukumbuka
  rationale: זכר ni ‘kukumbuka’; kiambishi cha nafsi ya pili umoja wa kike kinaelekezwa kwa Yerusalemu anayesemeshwa moja kwa moja.
- source_word: אַעֲלֶה אֶת יְרוּשָׁלַם
  choice: nisipoiweka Yerusalemu juu
  rationale: Hifili ya עלה ina wazo la kuinua au kuweka juu. ‘Kuiweka ... juu’ huhifadhi taswira na kueleza nafasi ya kipaumbele bila kuingiza maana ya ziada.
- source_word: עַל רֹאשׁ
  choice: juu kuliko
  rationale: Ingawa kihalisi ni ‘juu ya kichwa cha,’ hapa msemo unaonyesha nafasi ya kwanza au ya juu; ‘juu kuliko’ hutoa ulinganisho wa wazi katika Kiswahili.
- source_word: שִׂמְחָתִי
  choice: furaha yangu kuu
  rationale: Neno lenyewe ni ‘furaha yangu’; pamoja na עַל רֹאשׁ, muktadha unaonyesha furaha iliyo kuu au ya kwanza. Tafsiri inabaki ya asili na inafafanuliwa katika tanbihi.
theological_decisions:
- issue: Rejeleo la kiambishi cha nafsi ya pili umoja wa kike katika אֶזְכְּרֵכִי
  choice: Yerusalemu ndiye anayesemeshwa moja kwa moja kama mji uliotajwa kwa nafsi ya kike.
  alternative: Kiambishi kinaweza kueleweka kwa upana kuwa kinarejelea Sayuni au mji huo katika ushairi.
  rationale: Yerusalemu ndiye rejeleo la karibu na la kawaida katika muktadha, na jinsia ya kisarufi ya kiambishi inalingana na mji. Usemi wa moja kwa moja unadumisha uzito wa kihisia bila kuongeza fundisho la kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kiapo cha kujitakia adhabu umehifadhiwa, na taswira ya mwili pamoja na msemo wa Kiebrania kuhusu nafasi ya kwanza zimeelezwa bila kulainisha mvutano wa kishairi.
