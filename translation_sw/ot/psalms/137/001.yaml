source:
  edition: WLC
  text: עַ֥ל נַהֲר֨וֹת בָּבֶ֗ל שָׁ֣ם יָ֭שַׁבְנוּ גַּם בָּכִ֑ינוּ בְּ֝/זָכְרֵ֗/נוּ אֶת צִיּֽוֹן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/001.yaml
  text: By the rivers of Babylon[a], there we sat down[b]; we also wept when we remembered Zion.
translation:
  language: sw
  text: Kando ya mito ya Babeli[a], huko tuliketi[b]; pia tulilia tulipoikumbuka Sayuni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kando ya vijito vya Babeli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “huko tuliketi na kulia tulipoikumbuka Sayuni.” Kiebrania pia kina chembe yenye maana ya nyongeza (“pia” au “hata”) kabla ya “tulilia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: Kando ya
  rationale: Katika kirai hiki cha mahali, neno hili linaonyesha kuwa walikuwa karibu na mito, si juu yake.
- source_word: נַהֲרוֹת
  choice: mito
  rationale: Wingi wa נָהָר kwa kawaida humaanisha mito; hili ndilo neno la kawaida na la asili katika Kiswahili.
- source_word: בָּבֶל
  choice: Babeli
  rationale: Jina la mahali limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki kimehifadhiwa ili kusisitiza kwamba wahamishwa walikuwa huko Babeli, si Sayuni.
- source_word: יָשַׁבְנוּ
  choice: tuliketi
  rationale: Kitenzi kinaweza kumaanisha kuketi au kukaa; katika picha ya kuomboleza kando ya mito, ‘tuliketi’ kinaonyesha tendo hilo kwa uwazi bila kuongeza wazo lisilokuwamo.
- source_word: גַּם
  choice: pia
  rationale: ‘Pia’ huhifadhi maana ya nyongeza ya chembe hii bila kuamua zaidi ikiwa msisitizo wake ni ‘hata’ au ‘naam.’
- source_word: בָּכִינוּ
  choice: tulilia
  rationale: Hiki ni kitenzi cha kawaida na chenye hadhi kinachoeleza kulia kwa huzuni.
- source_word: בְּזָכְרֵנוּ
  choice: tulipoikumbuka
  rationale: Muundo wa kihusishi pamoja na jina-kitenzi umetafsiriwa kwa maana ya wakati, ambayo ni ya asili katika Kiswahili na inahifadhi uhusiano wa kukumbuka na kulia.
- source_word: אֶת צִיּוֹן
  choice: Sayuni
  rationale: Kiashiria cha yambwa hakitafsiriwi; jina Sayuni limehifadhiwa badala ya kufasiriwa kuwa Yerusalemu ili kudumisha uzito wake wa kishairi na kitheolojia.
theological_decisions:
- issue: Tafsiri ya צִיּוֹן
  choice: Sayuni
  alternative: Yerusalemu
  rationale: Andiko linataja Sayuni mahsusi. Kuhifadhi jina hilo kunadumisha maana yake ya mahali pamoja na mwangwi wake wa agano na ushairi, bila kulisawazisha na jina pana zaidi la Yerusalemu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Alama ya nuktamkato inatenganisha kuketi na kulia huku ‘pia’ ikihifadhi nyongeza ya גַּם.
