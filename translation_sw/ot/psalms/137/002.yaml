  yaml_path: translation/ot/psalms/137/002.yaml
  text: On the poplars in its midst we hung our lyres[a][b].
translation:
  language: sw
  text: Juu ya mipopla iliyokuwa katikati yake tulitundika vinubi vyetu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mierebi.” Neno la Kiebrania la mti linaweza kumaanisha mierebi au miti ya jamii ya mipopla; “mierebi” ndiyo tafsiri ya jadi.
    reason: lexical_alternative
  - marker: b
    text: Au “zeze zetu.” Neno la Kiebrania kinnor humaanisha ala ya kale ya nyuzi, ambayo umbo lake halijulikani kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: Juu ya
  rationale: Huhifadhi maana ya mahali ya kuweka kitu juu ya matawi ya miti, kwa Kiswahili cha kawaida.
- source_word: עֲרָבִים
  choice: mipopla
  rationale: Neno la Kiebrania linaweza kumaanisha miti ya jamii ya mierebi au mipopla. Katika mazingira ya Mesopotamia, “mipopla” lina uwezekano mzuri wa kibotania; “mierebi” limehifadhiwa katika tanbihi kama tafsiri ya jadi na inayowezekana.
- source_word: בְּתוֹכָהּ
  choice: iliyokuwa katikati yake
  rationale: Kiambishi cha kike umoja kinaelekea kurejelea Babeli katika mstari uliotangulia. Kauli hii huhifadhi rejeo hilo bila kuongeza waziwazi jina lisilokuwapo katika mstari huu.
- source_word: תָּלִינוּ
  choice: tulitundika
  rationale: Ni tafsiri ya kawaida ya kitenzi תלה, na inaonyesha vyombo vya muziki kuwekwa pembeni wakati wa huzuni.
- source_word: כִּנֹּרוֹתֵינוּ
  choice: vinubi vyetu
  rationale: כִּנּוֹר ni ala ya kale ya nyuzi, inayokaribiana na kinubi. “Vinubi” ni neno linaloeleweka na lenye hadhi katika Kiswahili; uwezekano wa “zeze zetu” umeonyeshwa katika tanbihi ili kutambua aina ya ala bila kujifanya kuwa umbo lake linajulikana kwa uhakika.
