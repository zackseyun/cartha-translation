base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/003.yaml
  text: 'For there our captors asked us for words of song[a], and our tormentors for gladness: “Sing for us one of the songs of Zion.”'
translation:
  language: sw
  text: 'Kwa maana huko waliotuteka walituomba maneno ya wimbo, nao waliotutesa[a] walituomba furaha: “Tuimbieni wimbo mmoja wa nyimbo za Sayuni.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliotudhihaki.” Neno la Kiebrania si la kawaida na huenda likasisitiza ama mateso ya kudhalilisha ama dhihaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza sababu au maelezo yanayohusiana na mstari uliotangulia kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki cha mahali kinarejelea Babeli katika muktadha; “huko” ni cha asili katika Kiswahili.
- source_word: שְׁאֵלוּנוּ
  choice: walituomba
  rationale: Kitenzi kina maana ya kuomba au kutaka kitu kutoka kwa mtu; “walituomba” kinafaa hapa bila kulazimisha wazo la ombi la upole.
- source_word: שׁוֹבֵינוּ
  choice: waliotuteka
  rationale: Kinaonyesha watu waliowachukua mateka; umbo hili ni wazi na la kawaida kuliko nomino nzito.
- source_word: דִּבְרֵי שִׁיר
  choice: maneno ya wimbo
  rationale: Huhifadhi kwa uwazi muundo wa Kiebrania na wazo la maneno yanayoimbwa, si muziki kwa ujumla tu.
- source_word: וְתוֹלָלֵינוּ
  choice: nao waliotutesa
  rationale: Neno hili adimu linaweza kuelekeza kwenye mateso ya kudhalilisha au dhihaka; “waliotutesa” linafaa kwa maombolezo haya huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: שִׂמְחָה
  choice: wakataka furaha
  rationale: Kiebrania kina nomino “furaha”; kitenzi “wakataka” kinakamilishwa kutokana na kitenzi cha ombi katika kishazi cha kwanza, na kutoa Kiswahili cha asili bila kubadili maana.
- source_word: שִׁירוּ לָנוּ
  choice: Tuimbieni
  rationale: Amri ya wingi pamoja na kihusishi inaonyesha kuimba kwa ajili ya wasikilizaji; “tuimbieni” ni tafsiri fupi na ya kawaida.
- source_word: מִשִּׁיר צִיּוֹן
  choice: mmoja wa nyimbo za Sayuni
  rationale: 'Kihusishi מן kina nguvu ya kugawa: wanataka wimbo mmoja kutoka katika mkusanyo wa nyimbo zinazohusishwa na Sayuni.'
