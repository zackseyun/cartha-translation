base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/008.yaml
  text: Daughter Babylon[a], devastated one[b], blessed is the one who repays you with the recompense you dealt to us.
translation:
  language: sw
  text: Ee binti wa Babeli[a], uliyefanywa ukiwa[b], heri yake yule anayekulipa sawasawa na ulivyotutendea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “binti Babeli”; nahau ya Kiebrania inamfanya Babeli aelezwe kama binti, yaani mji unaozungumziwa kama mtu.
    reason: lexical_alternative
  - marker: b
    text: Au “uliyebomolewa” au “uliyeporwa”; neno la Kiebrania linaweza kusisitiza uharibifu uliotendeka au maangamizi yanayokuja yanayoonekana kuwa hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת בָּבֶל
  choice: Ee binti Babeli
  rationale: Nahau ya Kiebrania inaufanya mji na watu wake kuwa kama binti. Kiingizi “Ee” kinaonyesha mwito wa moja kwa moja kwa Babeli, huku “binti Babeli” kikihifadhi picha ya kishairi.
- source_word: הַשְּׁדוּדָה
  choice: uliyeangamizwa
  rationale: Kauli ya kutendwa kutoka שׁדד inaweza kumaanisha kuharibiwa, kuangamizwa, au kuporwa. Uchaguzi huu unabaki katika kauli ya kutendwa bila kuamua kimya kimya kama uharibifu huo tayari umetokea au unatazamwa kuwa hakika.
- source_word: אַשְׁרֵי
  choice: amebarikiwa
  rationale: Huhifadhi mtindo wa tamko la baraka unaopatikana katika Zaburi, badala ya kuupunguza kuwa furaha au bahati tu.
- source_word: שֶׁיְשַׁלֶּם לָךְ
  choice: atakayekulipa
  rationale: Kitenzi שׁלם hapa kina maana ya kulipa au kulipiza. “Atakayekulipa” ni Kiswahili cha kawaida na kinahifadhi wazo la malipo ya kulingana.
- source_word: אֶת גְּמוּלֵךְ
  choice: kwa yale
  rationale: Katika Kiswahili, muundo “kukulipa kwa yale...” unaunganisha kwa kawaida גְּמוּל na kishazi kinachofuata bila kutumia nomino nzito isiyo ya lazima.
- source_word: שֶׁגָּמַלְתְּ לָנוּ
  choice: uliyotutendea
  rationale: גמל inaweza kueleza jinsi mtu alivyomtendea mwingine. Muktadha unaonyesha kuwa matendo hayo ni mabaya, lakini tafsiri haiongezi maelezo yasiyosemwa wazi katika neno lenyewe.
theological_decisions:
- issue: Tamko la baraka juu ya mwenye kulipiza Babeli
  choice: Kudumisha tamko la moja kwa moja, “amebarikiwa yule,” bila kulainisha ukali wake.
  alternative: Kuligeuza kuwa utabiri tu, au kufafanua kwa maneno yanayopunguza wazo la kulipizwa kwa matendo.
  rationale: Kiebrania kinatoa tamko halisi la baraka kwa yule atakayemlipa Babeli sawasawa na alivyowatendea waombolezaji. Tafsiri inapaswa kuhifadhi mvutano wa haki ya kulipiza na sala ya laana badala ya kuutatua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mwito “Ee” hufanya uhusiano wa kisarufi wa mstari uwe wazi; sentensi inahifadhi ukali na mvutano wa zaburi ya laana bila kuongeza msimamo wa kimadhehebu.
