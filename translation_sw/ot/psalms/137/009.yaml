  yaml_path: translation/ot/psalms/137/009.yaml
  text: Blessed is the one who seizes and dashes your little ones against the rock[a].
translation:
  language: sw
  text: Heri yule anayewakamata watoto wako wadogo na kuwaponda dhidi ya mwamba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watoto wako wachanga.” Neno la Kiebrania linawahusu watoto walio na umri mdogo sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heri yule
  rationale: Muundo huu wa kawaida katika Kiswahili huhifadhi tamko zito la baraka au hali ya kuhesabiwa mwenye heri, badala ya kulifanya kuwa hisia ya furaha tu.
- source_word: שֶׁיֹּאחֵז
  choice: anayewakamata
  rationale: Kitenzi hiki kinaonyesha kuwashika kwa nguvu wale wanaotajwa; kiambishi cha wingi kinapatana na 'watoto wako wachanga.'
- source_word: וְנִפֵּץ
  choice: na kuwaponda
  rationale: Neno hili huhifadhi tendo la kuvunja au kuangamiza kwa nguvu bila kulainisha ukatili wa taswira ya Kiebrania.
- source_word: עֹלָלַיִךְ
  choice: watoto wako wachanga
  rationale: Nomino hiyo inawahusu watoto wadogo sana; 'watoto wachanga' ni ya asili na sahihi katika Kiswahili sanifu.
- source_word: אֶל הַסָּלַע
  choice: kwenye mwamba
  rationale: Katika muktadha wa kugongesha kwa nguvu, 'kwenye mwamba' huwasilisha mahali pa mgongano kwa Kiswahili cha kawaida; 'mwamba' ni tafsiri thabiti ya סלע.
theological_decisions:
- issue: Nguvu ya kimaadili na kiteolojia ya אַשְׁרֵי katika zaburi ya laana
  choice: Heri yule...
  alternative: Ana bahati yule... / Mwenye furaha ni yule...
  rationale: Tafsiri inahifadhi tamko la Kiebrania bila kulainisha au kuongeza maelezo ya kulihukumu. Hivyo mvutano wa kilio cha kisasi dhidi ya Babeli unabaki wazi kama ulivyo katika zaburi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha imeacha ukali wa mstari uonekane wazi bila maelezo ya ziada au ulainishaji.
