  text: אֵ֗יךְ נָשִׁ֥יר אֶת שִׁיר יְהוָ֑ה עַ֝֗ל אַדְמַ֥ת נֵכָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/004.yaml
  text: How can we sing the song of Yahweh on foreign soil?[a][b]
translation:
  language: sw
  text: Tutaimbaje wimbo wa Yahweh[a] juu ya ardhi ya kigeni?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wimbo wa YHWH”; kimapokeo hutafsiriwa “wimbo wa BWANA.”'
    reason: alternative_reading
  - marker: b
    text: Au “katika nchi ya ugenini.” Kiebrania husema kihalisi “juu ya ardhi ya kigeni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: -je (katika “Tutaimbaje”)
  rationale: Kielezi hiki cha kuuliza namna, katika muktadha huu, kina nguvu ya swali la balagha kuhusu uwezekano au kufaa kwa tendo hilo. Muundo “Tutaimbaje” ni wa kawaida na wenye uzito katika Kiswahili, bila kulazimisha maana moja tu ya “tutawezaje” au “twawezaje.”
- source_word: נָשִׁיר
  choice: tutaimba (katika “Tutaimbaje”)
  rationale: Ni kitenzi cha Qal kisichotimilika, nafsi ya kwanza wingi. Wakati ujao wa Kiswahili unafaa kwa tendo linalotafakariwa katika swali hili la balagha.
- source_word: אֶת
  choice: '[kiashiria cha yambwa, hakitafsiriwi]'
  rationale: Kiashiria hiki cha yambwa maalumu katika Kiebrania hakina neno linalolingana nacho moja kwa moja katika Kiswahili.
- source_word: שִׁיר
  choice: wimbo
  rationale: Muundo wa umilikaji pamoja na jina la Mungu huonyesha wimbo unaohusishwa naye, si wimbo wowote tu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetolewa kama jina binafsi “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: עַל
  choice: katika
  rationale: Ingawa kihalisi ni “juu ya,” Kiswahili cha kawaida hutumia “katika” pamoja na “nchi.” Taswira halisi ya ardhi imehifadhiwa katika tanbihi.
- source_word: אַדְמַת
  choice: nchi
  rationale: Neno linaweza kumaanisha ardhi, udongo, au nchi. “Nchi” ni la kawaida katika Kiswahili kwa mahali pa ugenini, huku maana halisi zaidi ya ardhi ikiwekwa katika tanbihi.
- source_word: נֵכָר
  choice: ya kigeni
  rationale: Huonyesha ardhi au nchi iliyo ya watu wengine. “Ya kigeni” ni Kiswahili cha sasa, wazi na cha kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Kiebrania kinatumia jina binafsi יְהוָה moja kwa moja. “Yahweh” hulihifadhi kama jina badala ya kuliweka kwa cheo, huku tanbihi ikitaja mapokeo ya “BWANA.”
- issue: Nguvu ya swali la balagha
  choice: Tutaimbaje
  alternative: Tutawezaje kuimba
  rationale: Kiebrania kinauliza “jinsi gani tutaimba” na katika muktadha hudokeza kutowezekana au kutofaa. “Tutaimbaje” huhifadhi udokezo huo bila kuufanya wazi kupita chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo mfupi wa swali la balagha unadumisha sauti ya maombolezo; “nchi ya kigeni” ni ya kawaida zaidi kuliko “juu ya ardhi ya kigeni,” na taswira halisi imewekwa katika tanbihi.
