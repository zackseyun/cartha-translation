  text: If I forget you[a], Jerusalem, may my right hand forget.
translation:
  language: sw
  text: Nikikusahau, Ee Yerusalemu, mkono wangu wa kulia usahau[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana iliyo wazi zaidi, “mkono wangu wa kulia usahau ustadi wake.” Kiebrania hakisemi mkono unasahau nini; maana hii kamili zaidi inadokezwa na muktadha na huonekana katika baadhi ya tafsiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Nikikusahau
  rationale: 'Kiambishi -ki- huleta sharti kwa njia ya asili katika Kiswahili na, katika muktadha huu, hudumisha nguvu ya kiapo: ‘ikiwa nitakusahau.’'
- source_word: אֶשְׁכָּחֵךְ
  choice: nikikusahau wewe
  rationale: Kitenzi ni nafsi ya kwanza umoja chenye yambwa ya nafsi ya pili kike umoja, kikielekezwa moja kwa moja kwa Yerusalemu. ‘Wewe’ huweka mkazo uliomo katika mwito huo.
- source_word: יְרוּשָׁלִָם
  choice: Ee Yerusalemu
  rationale: Jina la mahali limetoholewa kwa namna iliyozoeleka katika Kiswahili; ‘Ee’ huonyesha wazi kwamba Yerusalemu inaambiwa moja kwa moja.
- source_word: תִּשְׁכַּח
  choice: na usahau
  rationale: Kauli hii ina nguvu ya kujilaani katika kiapo. Muundo wa ‘na usahau’ huwasilisha matakwa hayo bila kuibadili kuwa taarifa ya kawaida.
- source_word: יְמִינִי
  choice: mkono wangu wa kulia
  rationale: Hii ndiyo maana ya moja kwa moja na iliyo wazi ya nomino hiyo katika muktadha, huku mkono ukieleweka kuwa chombo cha ustadi.
theological_decisions:
- issue: Kauli ya kujilaani iliyoachwa bila yambwa katika mshororo wa pili
  choice: mkono wangu wa kulia na usahau
  alternative: mkono wangu wa kulia na usahau ustadi wake
  rationale: Kiebrania kinasema kwa ufupi ‘mkono wangu wa kulia na usahau’ bila kutaja unachosahau. Maana ya ‘ustadi wake’ inaeleweka kutokana na muktadha lakini haijaandikwa wazi; kwa hiyo ufupi na mvutano wa matini umehifadhiwa katika mstari mkuu, huku ufafanuzi ukiwekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kiapo umewekwa kwa lugha ya kawaida, na ufupi wenye utata wa Kiebrania umehifadhiwa badala ya kujazwa kimya kimya.
