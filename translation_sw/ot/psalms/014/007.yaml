base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/007.yaml
  text: Oh[a], that Israel’s salvation would come from Zion! When Yahweh restores the fortunes of his people, Jacob will rejoice; Israel will be glad.
translation:
  language: sw
  text: Laiti wokovu wa Israeli ungekuja kutoka Sayuni! Yahwe atakapowapa watu wake hali njema tena[a], Yakobo atashangilia; Israeli atafurahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “atakaporejesha uteka wa watu wake.” Nahau hii ya Kiebrania mara nyingi humaanisha kurejesha hali njema ya watu au kugeuza dhiki yao.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Laiti ... ungetoka
  rationale: Ni nahau ya kutamani, si swali halisi. “Laiti” huonyesha kwa Kiswahili sanifu shauku hiyo ya kishairi.
- source_word: מִצִּיּוֹן
  choice: ungetoka Sayuni
  rationale: Kihusishi מִן huonyesha chanzo; “Sayuni” ni umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: יְשׁוּעַת יִשְׂרָאֵל
  choice: wokovu wa Israeli
  rationale: Huhifadhi maana pana ya יְשׁוּעָה, inayoweza kuhusisha kuokolewa na ukombozi, bila kuifinyanga kuwa aina moja ya msaada.
- source_word: בְּשׁוּב יְהוָה שְׁבוּת עַמּוֹ
  choice: Yahwe atakapowarejeshea watu wake hali njema
  rationale: Muundo huu ni nahau ya kugeuza dhiki ya watu na kuwarudishia ustawi wao; “atawarejeshea ... hali njema” ni Kiswahili cha kawaida na pana kuliko kurejelea uhamisho pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limewasilishwa kwa uhamishaji wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: יָגֵל יַעֲקֹב
  choice: Yakobo atashangilia
  rationale: גיל huonyesha furaha kuu; “atashangilia” huhifadhi nguvu hiyo na mpangilio wa kishairi.
- source_word: יִשְׂמַח יִשְׂרָאֵל
  choice: Israeli atafurahi
  rationale: “Atafura​hi” hutofautisha שמח na גיל iliyotangulia huku ikidumisha usambamba wa maneno ya furaha.
theological_decisions:
- issue: Maana ya nahau שׁוּב שְׁבוּת
  choice: atawarejeshea watu wake hali njema
  alternative: atakapowarudisha watu wake kutoka utumwani
  rationale: Nahau inaweza kuhusishwa na kurudishwa kutoka utekwani, lakini mara nyingi humaanisha kugeuzwa kwa hali mbaya kwa upana. Zaburi hii haitaji wazi uhamisho fulani, kwa hiyo tafsiri pana inafaa katika matini kuu huku uwezekano wa utekwani ukihifadhiwa katika tanbihi.
- issue: Yakobo na Israeli katika usambamba
  choice: Majina yote mawili yamehifadhiwa kama marejeo ya kishairi kwa watu wale wale
  alternative: Kuyafafanua yote kuwa “watu wa Israeli”
  rationale: Kuhifadhi majina hudumisha usambamba wa Kiebrania bila kuondoa utambulisho wao wa kihistoria na kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Laiti” huwasilisha tamanio la mstari; “atashangilia” na “atafurahi” hudumisha tofauti na usambamba wa vitenzi vya Kiebrania.
