lexical_decisions:
- source_word: הַכֹּל
  choice: Wote
  rationale: Neno lenye kibainishi lina maana ya wote kwa ujumla; “Wote” ni la kawaida na linadumisha upeo wa kauli.
- source_word: סָר
  choice: wamepotoka
  rationale: Kitenzi סור humaanisha kugeuka kando au kuondoka katika njia. “Wamepotoka” ni Kiswahili cha asili kinachowasilisha mkengeuko bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: יַחְדָּו
  choice: kwa pamoja
  rationale: Kielezi hiki kinaonyesha hali ya wote kushiriki jambo hilo; “kwa pamoja” ni wazi na cha sasa.
- source_word: נֶאֱלָחוּ
  choice: wameharibika
  rationale: Umbo la Nifali linaonyesha kuwa wamekuwa katika hali ya kuharibika au kuchafuliwa. “Wameharibika” huhifadhi maana pana ya kupotewa na ubora bila kuifanya kuwa uchafu wa kimwili pekee.
- source_word: אֵין
  choice: Hakuna
  rationale: Chembe ya kutokuwapo inatoa ukanushi mkali na wa kawaida katika Kiswahili.
- source_word: עֹשֵׂה טוֹב
  choice: atendaye mema
  rationale: Kitenzi kishirikishi pamoja na טוֹב kinaonyesha tendo lenye tabia ya kudumu. “Atendaye mema” ni lugha yenye heshima na inayoeleweka.
- source_word: גַּם אֶחָד
  choice: hata mmoja
  rationale: Muungano huu unasisitiza ukanushi; “hata mmoja” huwasilisha mkazo huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Upeo wa kauli ya jumla kuhusu kuharibika kwa wanadamu
  choice: 'Kauli imetafsiriwa kwa upeo wake wote: “Wote,” “Hakuna,” na “hata mmoja.”'
  alternative: Kuifanya kuwa maelezo ya jumla kuhusu watu wengi tu.
  rationale: Kiebrania kinatumia lugha jumuishi na ukanushi uliosisitizwa. Tafsiri haipunguzi nguvu hiyo wala kuingiza mfumo wa mafundisho ya baadaye usiotajwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kwa pamoja” huepuka utata wa “wote pamoja,” na “wameharibika” huhifadhi upana wa maana ya Kiebrania. Alama ya tanbihi [a] imewekwa baada ya kifungu kinachohusika.
