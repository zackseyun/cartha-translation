  text: עֲצַת עָנִ֥י תָבִ֑ישׁוּ כִּ֖י יְהוָ֣ה מַחְסֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/006.yaml
  text: You shame the counsel of the poor[a], because Yahweh is his refuge.
translation:
  language: sw
  text: Mnaaibisha shauri la maskini[a], kwa sababu Yahwe ni kimbilio lake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mnaaibisha mpango wa mtu maskini.” Neno la Kiebrania linaweza kumaanisha shauri au mpango.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  choice: shauri la
  rationale: Nomino hii katika hali ya kutegemea inaweza kumaanisha shauri, mpango, au kusudi. “Shauri” linadumisha upana huo bila kuamua kwamba ni mpango wa ndani tu au ushauri uliotolewa kwa maneno.
- source_word: עָנִי
  choice: maskini
  rationale: Neno hili linaweza kumaanisha maskini, mhitaji, au mtu anayeteswa. “Maskini” ni la kawaida na linafaa katika muktadha wa kijamii wa zaburi hii, huku mazingira yakidokeza pia hali ya kuonewa na kuwa dhaifu.
- source_word: תָבִישׁוּ
  choice: Mnalitia aibu
  rationale: Kitenzi hiki ni Hiphil nafsi ya pili wingi, kikimaanisha kusababisha aibu au kutia aibu. “Mnalitia aibu” huhifadhi wingi wa wanaosemeshwa na taswira ya Kiebrania bila kuibana iwe dhihaka tu.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa kiunganishi kinaeleweka kwa maana ya sababu, kikionyesha kwa nini jaribio la kuliaibisha shauri la maskini halina msingi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa na cheo kama “BWANA,” ili kuhifadhi jina binafsi lililo katika matini.
- source_word: מַחְסֵהוּ
  choice: ndiye kimbilio lake
  rationale: מַחְסֶה ni mahali pa usalama au hifadhi, nalo lina kiambishi cha nafsi ya tatu umoja wa kiume. “Ndiye kimbilio lake” ni Kiswahili cha kawaida na hudumisha sitiari ya ulinzi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Matini ina jina יהוה moja kwa moja. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha na cheo, bila kuingiza tafsiri ya kimadhehebu.
- issue: Uhusiano kati ya kuliaibisha shauri la maskini na Yahwe kuwa kimbilio lake
  choice: kwa sababu
  alternative: kwa maana; kwani
  rationale: כִּי imedumishwa kama kiunganishi cha sababu. Tafsiri haifafanui zaidi ikiwa sababu hiyo inaonyesha ubatili wa tendo la waovu au kosa lake la kimaadili, hivyo mvutano wa matini unabaki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Wingi wa nafsi ya pili katika תָבִישׁוּ umehifadhiwa kwa “Mnalitia,” na sentensi fupi ya kishairi imeachwa bila maelezo ya ziada.
