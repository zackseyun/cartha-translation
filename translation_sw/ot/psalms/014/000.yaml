  yaml_path: translation/ot/psalms/014/000.yaml
  text: 'For the choir director[a]. Of David.


    The fool says in his heart, “There is no God.”

    They are corrupt; they do abominable deeds[c][b].

    There is none who does good.'
translation:
  language: sw
  text: 'Kwa mwongoza muziki.[a] Ya Daudi.[b]


    Mpumbavu husema moyoni mwake, “Hakuna Mungu.”


    Wameharibika; wamefanya matendo ya kuchukiza.[c]


    Hakuna atendaye mema.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa mkuu wa waimbaji” au “Kwa kiongozi wa kwaya.”
    reason: lexical_alternative
  - marker: b
    text: “Ya Daudi” pia inaweza kumaanisha “iliyoandikwa na Daudi” au “kwa ajili ya Daudi” katika kichwa cha zaburi.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania hubadilika kutoka umoja (“mpumbavu”) kwenda wingi (“wameharibika”), kikitoka kwa mtu mmoja anayewakilisha wengine kwenda kwa kundi analoliwakilisha.
    reason: textual_feature
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza muziki
  rationale: Neno hili katika vichwa vya zaburi humtaja kiongozi au msimamizi wa uimbaji wa ibada; tafsiri hii ni ya kawaida na inaeleweka kwa Kiswahili cha sasa.
- source_word: לְדָוִד
  choice: Zaburi ya Daudi
  rationale: Kihusishi cha Kiebrania kinaweza kuonyesha utunzi, uhusiano, wakfu, au matumizi kwa ajili ya Daudi; 'ya Daudi' huhifadhi upana huo kwa kiasi kikubwa.
- source_word: נָבָל
  choice: Mpumbavu
  rationale: Katika muktadha huu ni mtu asiye na hekima ya kiadili na kiroho, si tu mwenye uwezo mdogo wa kufikiri.
- source_word: בְּלִבּוֹ
  choice: moyoni mwake
  rationale: Huhifadhi tamathali ya Kiebrania ya moyo kama kitovu cha fikra, nia, na msimamo wa ndani.
- source_word: הִשְׁחִיתוּ
  choice: Wameharibika
  rationale: Kauli hii inaeleza kupotoka au kuharibika kwa watu wanaowakilishwa na mpumbavu.
- source_word: הִתְעִיבוּ עֲלִילָה
  choice: wamefanya matendo ya kuchukiza
  rationale: Kirai hiki kinaonyesha kwamba matendo yao yamekuwa ya karaha; 'matendo' huwakilisha עֲלִילָה kwa lugha ya kawaida.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: Hakuna atendaye mema
  rationale: Huhifadhi dai la jumla na muundo mfupi wenye uzito wa kishairi.
theological_decisions:
- issue: Maana ya kauli “Hakuna Mungu”
  choice: Kauli imetafsiriwa moja kwa moja bila kuongeza maelezo kama “Mungu hajali.”
  alternative: “Mungu hayupo” au ufafanuzi kwamba mtu anaishi kana kwamba hakuna Mungu.
  rationale: Kiebrania אֵין אֱלֹהִים ni kifupi na kinaweza kuwa kukana uwepo wa Mungu au msimamo wa kiutendaji; tafsiri ya moja kwa moja huhifadhi mvutano huo.
- issue: Mabadiliko kutoka umoja kwenda wingi
  choice: “Mpumbavu” ni umoja, kisha “Wameharibika; wamefanya...” ni wingi.
  alternative: Kusawazisha sentensi zote ziwe katika umoja au wingi.
  rationale: Mabadiliko hayo yapo katika Kiebrania na yanaweza kumhamisha msomaji kutoka kwa mtu mwakilishi kwenda kwa kundi analoliwakilisha; hayapaswi kufutwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Mwongoza muziki” ni la sasa kuliko istilahi nzito za kiliturgia; “atendaye mema” huhifadhi ufupi na uzito wa mstari wa mwisho.
