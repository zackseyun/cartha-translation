lexical_decisions:
- source_word: שָׁם
  choice: Hapo
  rationale: Kielezi hiki kinaelekeza kwenye tukio au hali inayotajwa katika muktadha. “Hapo” huhifadhi ufupi na nguvu ya kishairi ya Kiebrania.
- source_word: פָּחֲדוּ פָחַד
  choice: walishikwa na hofu kuu
  rationale: Kitenzi na nomino yenye mzizi mmoja huunda msisitizo wa Kiebrania, kihalisi “waliogopa hofu.” Tafsiri hii inaonyesha hofu kali kwa Kiswahili cha kawaida bila kuiga muundo usio wa asili.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa kiunganishi kinaanzisha sababu ya hofu yao na kinafaa katika mtindo wa kishairi wenye hadhi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania ni la wingi kisarufi, katika muktadha huu linamtaja Mungu wa Israeli kwa maana ya umoja.
- source_word: בְּדוֹר
  choice: yuko pamoja na kizazi
  rationale: Kihusishi בְּ kinaweza kuonyesha kuwapo ndani, miongoni, au pamoja na kundi. “Pamoja na” huwasilisha wazi uwepo wa Mungu kwa wenye haki huku tanbihi ikihifadhi uwezekano wa “miongoni mwa.”
- source_word: צַדִּיק
  choice: wenye haki
  rationale: Ingawa kivumishi hiki ni umoja kimaumbo, hapa kinaeleweka kwa maana ya kundi pamoja na דּוֹר; “wenye haki” ni usemi wa asili wa Kiswahili unaohifadhi dhana ya kimaadili.
theological_decisions:
- issue: Maana ya uhusiano wa Mungu na wenye haki katika בְּדוֹר צַדִּיק
  choice: Mungu yuko pamoja na kizazi cha wenye haki
  alternative: Mungu yuko miongoni mwa kizazi cha wenye haki
  rationale: Kihusishi cha Kiebrania kinaruhusu maana zinazokaribiana za kuwapo pamoja na au miongoni mwa kundi. Matini kuu inaonyesha uwepo na mshikamano wa Mungu bila kuongeza dai la kimadhehebu; tanbihi inahifadhi maana nyingine halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo ni mfupi na wa moja kwa moja; “walishikwa na hofu kuu” unaeleweka kwa urahisi huku ukihifadhi msisitizo wa Kiebrania. Alama zote za tanbihi zimewekwa katika matini kuu.
