  yaml_path: translation/ot/psalms/014/002.yaml
  text: Yahweh looks down from heaven on the children of man to see whether there is one who has insight[a], one who seeks God.
translation:
  language: sw
  text: Yahwe anatazama chini kutoka mbinguni juu ya wanadamu ili aone kama kuna mwenye ufahamu, anayemtafuta Mungu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kwa cheo kama “BWANA”.
- source_word: מִשָּׁמַיִם
  choice: kutoka mbinguni
  rationale: Ingawa umbo la Kiebrania ni la wingi, “mbinguni” ni usemi wa kawaida wa Kiswahili kwa mahali pa juu anapotazama Mungu.
- source_word: הִשְׁקִיף
  choice: anatazama chini
  rationale: Huhifadhi picha ya kutazama kutoka mahali palipoinuka; wakati uliopo unafaa mtindo hai wa kishairi.
- source_word: בְּנֵי אָדָם
  choice: wanadamu
  rationale: Ni nahau ya Kiebrania, kihalisi “wana wa Adamu/binadamu,” inayowakilisha watu wote; “wanadamu” huwasilisha maana hiyo kwa Kiswahili cha asili bila kupotosha upeo wake.
- source_word: לִרְאוֹת
  choice: awaone … aone
  rationale: Infinitivu ya kusudi imetolewa kwa muundo wa kusudi wa Kiswahili; marudio yanadumisha mtiririko wa sentensi.
- source_word: הֲיֵשׁ
  choice: kama yupo
  rationale: Huanzisha uchunguzi wa kama mtu wa aina hiyo yupo.
- source_word: מַשְׂכִּיל
  choice: mwenye ufahamu
  rationale: Hudumisha wazo la kuwa na utambuzi au ufahamu bila kulifanya moja kwa moja kuwa istilahi ya kiufundi ya hekima.
- source_word: דֹּרֵשׁ
  choice: anayemtafuta
  rationale: Kauli endelevu inaeleza sifa ya mtu anayechunguzwa; kiambishi cha yambwa kinafaa kwa Mungu kama yambwa dhahiri.
- source_word: אֶת אֱלֹהִים
  choice: Mungu
  rationale: Kihisishi cha yambwa hakitafsiriwi kando; nomino inatolewa kwa neno la kawaida “Mungu”.
theological_decisions:
- issue: Maana wakilishi ya בְּנֵי אָדָם
  choice: wanadamu
  alternative: wana wa Adamu / watoto wa binadamu
  rationale: Usemi wa Kiebrania ni wa kiume kisarufi lakini unarejelea jamii yote ya binadamu. Kiswahili “wanadamu” huhifadhi uhusiano wa kileksika na אָדָם na maana jumuishi kwa njia ya kawaida, bila kuingiza tofauti ya kijinsia isiyokusudiwa.
- issue: Uhusiano kati ya מַשְׂכִּיל na דֹּרֵשׁ
  choice: mwenye ufahamu, anayemtafuta Mungu
  alternative: mwenye ufahamu au anayemtafuta Mungu
  rationale: Hakuna kiunganishi cha “au” katika Kiebrania; koma huacha wazi ikiwa vifungu hivyo vinaeleza mtu yuleyule kwa namna sambamba, kama muundo wa chanzo unavyodokeza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili na unaeleweka kwa wasomaji wa kawaida, huku taswira ya Mungu kutazama chini kutoka mbinguni na usambamba wa kishairi vikihifadhiwa.
