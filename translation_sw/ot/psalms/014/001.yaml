  text: לַ/מְנַצֵּ֗חַ לְ/דָ֫וִ֥ד אָ֘מַ֤ר נָבָ֣ל בְּ֭/לִבּ/וֹ אֵ֣ין אֱלֹהִ֑ים הִֽשְׁחִ֗יתוּ הִֽתְעִ֥יבוּ עֲלִילָ֗ה אֵ֣ין עֹֽשֵׂה טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/001.yaml
  text: For the choir director[a]. Of David. The fool says in his heart, “There is no God.” They are corrupt; they do abominable deeds[c][b]. There is no one who does good.
translation:
  language: sw
  text: 'Kwa kiongozi wa waimbaji[a]. Wa Daudi[b].


    Mpumbavu husema moyoni mwake, “Hakuna Mungu.” Wameharibika[c]; wametenda matendo ya kuchukiza. Hakuna mtu atendaye mema.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa kiongozi wa muziki” au “Kwa mkuu wa waimbaji.”
    reason: lexical_alternative
  - marker: b
    text: “Wa Daudi” linaweza pia kumaanisha “uliotungwa na Daudi,” “unaohusiana na Daudi,” au “kwa ajili ya Daudi.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania hubadilika kutoka umoja (“Mpumbavu”) hadi wingi (“Wameharibika”), yaani kutoka kwa mtu mmoja anayewakilisha kundi hadi kwa kundi lenyewe.
    reason: source_text_shift
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa kiongozi wa waimbaji
  rationale: Kirai hiki cha kichwa cha zaburi humwelekeza zaburi kwa kiongozi wa uimbaji au muziki. Tafsiri hii ni ya kawaida na inaeleweka katika Kiswahili cha sasa bila kuifanya maana iwe finyu mno.
- source_word: לְדָוִד
  choice: Wa Daudi
  rationale: Kihusishi לְ katika vichwa vya zaburi kinaweza kuonyesha utunzi, uhusiano, au kuwekwa kwa ajili ya mtu. “Wa Daudi” huhifadhi kwa kiasi kizuri wigo huo wa maana.
- source_word: נָבָל
  choice: Mpumbavu
  rationale: Hapa neno halimaanishi ukosefu wa akili tu, bali upotovu wa kimaadili na kiroho. “Mpumbavu” ni neno la kawaida la kibiblia linalobeba hukumu hiyo.
- source_word: בְּלִבּוֹ
  choice: moyoni mwake
  rationale: Katika mtazamo wa Kiebrania, moyo ni kitovu cha mawazo, nia, na maamuzi; tafsiri ya moja kwa moja ni ya asili pia katika Kiswahili.
- source_word: אֵין אֱלֹהִים
  choice: Hakuna Mungu
  rationale: Hii huhifadhi dai la moja kwa moja la Kiebrania kuhusu kutokuwapo kwa Mungu bila kuligeuza kuwa maelezo ya athari zake.
- source_word: הִשְׁחִיתוּ
  choice: Wameharibika
  rationale: Kitenzi kinaonyesha kuharibika au kupotoka kimaadili, na hali timilifu ya Kiswahili inaonyesha hali iliyotokana na tendo hilo.
- source_word: הִתְעִיבוּ עֲלִילָה
  choice: wametenda matendo ya kuchukiza
  rationale: Kirai hiki kinaeleza mwenendo au matendo yenye kuchukiza. Tafsiri hii ni ya asili na huhifadhi tathmini kali ya kimaadili ya chanzo.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: Hakuna mtu atendaye mema
  rationale: Tafsiri hii hufuata muundo na ujumla wa Kiebrania huku ikibaki kuwa Kiswahili fasaha na chenye hadhi.
theological_decisions:
- issue: Upeo wa dai אֵין אֱלֹהִים
  choice: “Hakuna Mungu,” kama kauli ya moja kwa moja ya kukana kuwapo kwa Mungu.
  alternative: “Mungu hajali,” “Mungu hayupo hapa,” au “Hakuna hukumu.”
  rationale: Ingawa muktadha unaonyesha pia maisha ya kutomjali Mungu, maneno ya Kiebrania yenyewe yanatoa dai la moja kwa moja. Tafsiri haipaswi kubadili kauli hiyo kuwa maana inayodhaniwa tu.
- issue: Umoja wa נָבָל ukifuatwa na vitenzi vya wingi
  choice: Kudumisha badiliko kutoka “Mpumbavu” katika umoja hadi “Wameharibika; wametenda” katika wingi.
  alternative: Kusawazisha sentensi yote iwe katika umoja, au kubadili mwanzo uwe “Wapumbavu.”
  rationale: Badiliko hilo limo katika Kiebrania na linaonyesha mtu mmoja anayewakilisha jamii nzima ya watu wa aina hiyo. Kulihifadhi huepuka kuondoa mvutano wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kichwa umewekwa kwa ufupi kama katika zaburi. “Atendaye mema” ni mtindo wenye hadhi lakini bado unaeleweka kwa wasomaji wa kawaida; badiliko la umoja kwenda wingi limehifadhiwa makusudi.
