base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/004.yaml
  text: Do not all the workers of wickedness know—those who eat up my people as they eat bread[a], and do not call on Yahweh?
translation:
  language: sw
  text: Je, wote watendao uovu hawajui—wanaowala watu wangu kama wanavyokula mkate[a], wala hawamwiti Yahwe?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wanaowala watu wangu; wanakula mkate”—usemi unaolinganisha kula watu wangu na kula mkate kwa kawaida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, hawa…?
  rationale: Kiulizi hiki kinatarajia jibu la kukubali. Muundo wa “Je, hawa…?” unaonyesha nguvu ya swali la balagha kwa Kiswahili cha kawaida.
- source_word: יָדְעוּ
  choice: hawajui
  rationale: Kitenzi ידע hapa kina maana ya kujua au kutambua. Wakati uliopo unafaa kwa maelezo ya jumla kuhusu watenda uovu.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: wote watendao uovu
  rationale: Huhifadhi wazo la kishiriki la wale wanaotenda, huku “uovu” likibeba uzito wa kimaadili wa אָוֶן kwa lugha ya sasa.
- source_word: אֹכְלֵי עַמִּי
  choice: wanaowala watu wangu
  rationale: Huhifadhi moja kwa moja sitiari kali ya kuwatafuna au kuwaangamiza watu wa Mungu, bila kuibadili kuwa maelezo yasiyo ya picha.
- source_word: אָכְלוּ לֶחֶם
  choice: kama walavyo mkate
  rationale: Neno “kama” linaweka wazi ulinganisho unaodokezwa na mfuatano wa Kiebrania na kufanya sentensi iwe ya kawaida kwa Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limehifadhiwa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: לֹא קָרָאוּ
  choice: wala hawamwiti
  rationale: קרא pamoja na jina la Mungu humaanisha kumwita au kumwomba katika ibada na sala. “Kumwita” huhifadhi upana huo bila kuufinya kuwa aina moja tu ya sala.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia moja kwa moja Tetragramatoni; “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya “kumwita” Yahwe
  choice: hawamwiti Yahwe
  alternative: hawamwombi Yahwe
  rationale: “Kumwita” huacha wazi wigo wa maana wa קרא, unaoweza kuhusisha sala, kuomba msaada, au ibada, badala ya kuamua kimya kimya kuwa ni ombi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali la balagha na sitiari ya kula umehifadhiwa; kistari kirefu kinatenganisha maelezo ya watenda uovu bila kuvunja mtiririko.
