translation:
  language: sw
  text: Yahwe akubariki kutoka Sayuni,[a] Muumba wa mbingu na dunia.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Yahwe atakubariki kutoka Sayuni.” Kitenzi cha Kiebrania kinaweza pia kueleweka kama taarifa ya wakati ujao, lakini katika muktadha huu wa baraka kinaeleweka vizuri zaidi kama takio: “akubariki.”'
    reason: alternative_reading
  - marker: b
    text: Kiebrania, “mfanyaji wa mbingu na dunia”; ni cheo kinachomtambulisha Yahwe kuwa Muumba wa vyote.
    reason: lexical_alternative
  - marker: c
    text: Au, “yeye afanyaye mbingu na dunia.”
    reason: alternative_rendering
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: akubariki
  rationale: 'Kauli ya kutakia mema katika muktadha huu wa baraka inaelezwa kwa kawaida kwa kiima cha utegemezi cha Kiswahili: “akubariki.” Hii huhifadhi nguvu ya ombi au takio bila kuibadili kuwa taarifa ya wakati ujao.'
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa konsonanti YHWH limetoholewa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: מִצִּיּוֹן
  choice: kutoka Sayuni
  rationale: Kihusishi מִן kinaonyesha chanzo; “kutoka Sayuni” ni Kiswahili cha kawaida na huhifadhi picha ya baraka inayotoka Sayuni.
- source_word: עֹשֵׂה
  choice: yeye aliyefanya
  rationale: Kauli-shirikishi ya Kiebrania inamtambulisha Yahwe kwa kazi yake. “Yeye aliyefanya” ni ya kawaida na yenye hadhi katika Kiswahili, huku “yeye” ikiweka wazi kuwa maelezo hayo yanamhusu Yahwe.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: mbingu na dunia
  rationale: Jozi hii ni usemi unaojumuisha uumbaji wote. “Mbingu na dunia” ni tafsiri ya kawaida ya Kiswahili na hudumisha upeo wa ulimwengu mzima.
theological_decisions:
- issue: Namna ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko lina jina binafsi la Mungu, si cheo tu; kwa hiyo “Yahwe” hulihifadhi wazi bila kuingiza mapokeo ya kulibadilisha kwa cheo.
- issue: Nguvu ya kitenzi יְבָרֶכְךָ katika baraka ya kufunga zaburi
  choice: 'takio/ombi: “Yahwe akubariki”'
  alternative: 'taarifa ya wakati ujao: “Yahwe atakubariki”'
  rationale: Muktadha wa kiliturujia na wa baraka unaunga mkono takio kuliko utabiri, lakini tanbihi inahifadhi uwezekano wa kisarufi wa usomaji mwingine.
- issue: Uhusiano wa עֹשֵׂה na Yahwe
  choice: 'maelezo ya kumtambulisha Yahwe: “yeye aliyefanya”'
  alternative: 'cheo: “Muumba wa”'
  rationale: Kauli-shirikishi inasimama kama maelezo ya ziada kuhusu Yahwe. Tafsiri iliyochaguliwa huhifadhi kitenzi cha msingi “kufanya” na kuepuka kuifanya istilahi maalumu zaidi kuliko ilivyo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni mfupi, wa heshima na wa kiliturujia, lakini unaeleweka kwa msomaji wa kawaida. “Sayuni” na “Yahwe” zimetumiwa kama maumbo ya majina yaliyozoeleka katika Kiswahili cha Biblia.
