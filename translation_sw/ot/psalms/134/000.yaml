  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הִנֵּ֤ה בָּרֲכ֣וּ אֶת יְ֭הוָה כָּל עַבְדֵ֣י יְהוָ֑ה הָ/עֹמְדִ֥ים בְּ/בֵית יְ֝הוָ֗ה בַּ/לֵּילֽוֹת׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/000.yaml
  text: A Song of Ascents. Behold, bless the LORD, all you servants of the LORD, who stand in the house of the LORD by night!
translation:
  language: sw
  text: Wimbo wa kwenda juu. Tazama,[a] mbarikini BWANA, enyi watumishi wote wa BWANA, mnaosimama katika nyumba ya BWANA[b] usiku!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Angalieni” au “Oneni.”
    reason: lexical_alternative
  - marker: b
    text: “Nyumba ya BWANA” hapa ni mahali patakatifu pa hekalu.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa kupandia
  rationale: Kichwa hiki cha mkusanyo kinaweza kuhusishwa na kupanda kwenda Yerusalemu au kupanda kwa hatua; tafsiri hii huhifadhi picha ya kupanda bila kuifafanua kupita kiasi.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili la kuvuta fikira lina uzito wa kifasihi unaofaa zaburi; maana mbadala zimewekwa katika tanbihi.
- source_word: בָּרֲכוּ אֶת־יְהוָה
  choice: mbarikini BWANA
  rationale: Imperativi ya wingi imehifadhiwa, na kitenzi 'bariki' kinaelekezwa kwa BWANA kama katika Kiebrania.
- source_word: עַבְדֵי יְהוָה
  choice: watumishi wa BWANA
  rationale: Hii ni tafsiri ya kawaida na ya asili ya עֲבָדִים katika mazingira ya huduma ya hekaluni.
- source_word: הָעֹמְדִים
  choice: mnaosimama
  rationale: Huhifadhi kitendo halisi cha kusimama, ambacho hapa pia kinaweza kudokeza kuhudumu bila kulazimisha ufafanuzi huo ndani ya matini.
- source_word: בַּלֵּילוֹת
  choice: nyakati za usiku
  rationale: Wingi wa Kiebrania umeakisiwa kwa usemi wa Kiswahili unaoeleweka kwa kawaida, ukidokeza huduma ya usiku inayojirudia.
theological_decisions:
- issue: Maana ya 'nyumba ya BWANA'
  choice: Imehifadhiwa katika matini kama 'nyumba ya BWANA' na kufafanuliwa kuwa hekalu katika tanbihi.
  alternative: Kutafsiri moja kwa moja 'hekalu la BWANA'.
  rationale: Usemi wa Kiebrania ni wa kisitiari lakini uliotambulika; kuuhifadhi huepuka kufuta taswira ya chanzo, huku tanbihi ikisaidia msomaji wa sasa.
- issue: Maana ya kusimama mbele/ndani ya nyumba ya BWANA
  choice: Imeachwa kama 'mnaosimama' bila kuongeza 'mkihudumu'.
  alternative: '''Mnaohudumu'' au ''mnaosimama mkihudumu''.'
  rationale: Kusimama kunaweza kumaanisha wajibu wa kikuhani au wa Walawi, lakini matini yenyewe hutumia kitenzi halisi cha kusimama; tafsiri huhifadhi uwezekano huo bila kuufanya kuwa tafsiri pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. 'BWANA' imetumiwa kuwakilisha jina la agano יהוה kwa desturi ya tafsiri za Biblia za Kiswahili. Alama zote za tanbihi zimewekwa mara baada ya maneno yanayohusika.
