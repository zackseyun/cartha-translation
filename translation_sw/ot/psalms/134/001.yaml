  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הִנֵּ֤ה בָּרֲכ֣וּ אֶת יְ֭הוָה כָּל עַבְדֵ֣י יְהוָ֑ה הָ/עֹמְדִ֥ים בְּ/בֵית יְ֝הוָ֗ה בַּ/לֵּילֽוֹת׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/001.yaml
  text: A Song of Ascents[a]. Behold, bless Yahweh, all you servants of Yahweh[b], who stand in the house of Yahweh by night.
translation:
  language: sw
  text: 'Wimbo wa Kupanda.[a]


    Tazama,[b] mbarikini Yahwe,

    enyi watumishi wote wa Yahwe,

    mnaosimama katika nyumba ya Yahwe[c] usiku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kichwa hiki kinaweza pia kutafsiriwa “Wimbo wa hatua za kupandia.” Huenda kikahusiana na kupanda kwenda Yerusalemu, lakini kichwa chenyewe hakisemi hilo wazi.
    reason: lexical_alternative
  - marker: b
    text: Au “Angalieni.” Hili ni neno la kuvuta fikira.
    reason: lexical_alternative
  - marker: c
    text: “Nyumba ya Yahwe” hapa ni patakatifu pa hekalu.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa Kupanda
  rationale: Huhifadhi kwa ufupi na kwa mtindo wa kishairi jina la mkusanyo lililo katika Kiebrania. Neno מַעֲלוֹת lina maana ya kupanda au hatua za kupandia; tafsiri kama “wimbo wa mahujaji” ingeeleza zaidi ya inavyosema matini moja kwa moja.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni neno la kuvuta fikira linalofaa mwito huu wa kishairi na linaeleweka katika Kiswahili sanifu.
- source_word: בָּרֲכוּ
  choice: mbarikini
  rationale: Huhifadhi maana ya msingi ya kitenzi ברך na umbo la amri kwa watu wengi; “msifuni” ingeifanya maana kuwa finyu zaidi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linawakilisha jina la Mungu lililoandikwa moja kwa moja kwa herufi nne za Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: כָּל עַבְדֵי יְהוָה
  choice: enyi watumishi wote wa Yahwe
  rationale: “Enyi” huonyesha wazi kwamba ni mwito wa moja kwa moja. Katika mazingira ya huduma ya hekalu, “watumishi” linafaa kuliko “watumwa,” ingawa עבד linaweza kuwa na maana hiyo katika miktadha mingine.
- source_word: הָעֹמְדִים
  choice: mnaosimama
  rationale: Huhifadhi picha halisi ya watu wanaosimama badala ya kuifasiri moja kwa moja kuwa “mnaohudumu.”
- source_word: בְּבֵית יְהוָה
  choice: katika nyumba ya Yahwe
  rationale: Huhifadhi nahau ya Kiebrania “nyumba ya Yahwe”; katika muktadha huu nyumba hiyo ni patakatifu pa hekalu.
- source_word: בַּלֵּילוֹת
  choice: usiku
  rationale: Ingawa Kiebrania kimetumia wingi, Kiswahili hutumia “usiku” kwa njia ya kawaida kueleza wakati wa huduma ya usiku.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania inatumia jina maalumu la Mungu, si neno la kawaida la cheo. “Yahwe” huhifadhi rejeo hilo la agano bila kulibadilisha kuwa cheo.
- issue: Maana ya kuwabariki Mungu katika בָּרֲכוּ אֶת־יְהוָה
  choice: mbarikini Yahwe
  alternative: msifuni Yahwe
  rationale: “Mbarikini” huhifadhi usemi wa kiliturujia na upana wa kitenzi ברך. “Msifuni” linaeleza sehemu ya maana lakini linaweza kuondoa mvutano wa usemi wa wanadamu kumbariki Mungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wenye heshima na unaoeleweka. Mpangilio wa mistari unaonyesha mwito na maelezo ya wanaoitikiwa. Jina “Yahwe” limetumiwa kwa uthabiti, na nahau “nyumba ya Yahwe” imehifadhiwa huku ufafanuzi wake ukiwekwa katika tanbihi.
