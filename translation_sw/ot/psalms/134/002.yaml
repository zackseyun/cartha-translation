  yaml_path: translation/ot/psalms/134/002.yaml
  text: Lift up your hands to the holy place and bless Yahweh[a].
translation:
  language: sw
  text: Inueni mikono yenu kuelekea mahali patakatifu[a], na mbariki Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika mahali patakatifu,” au “kwa utakatifu.” Neno la Kiebrania קֹדֶשׁ linaweza kumaanisha utakatifu au mahali patakatifu.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂאוּ
  choice: Inueni
  rationale: Ni amri ya wingi inayodumisha tendo halisi la kuinua mikono na inasikika kwa kawaida katika Kiswahili.
- source_word: יְדֵיכֶם
  choice: mikono yenu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya nomino pamoja na kiambishi cha nafsi ya pili wingi.
- source_word: קֹדֶשׁ
  choice: kuelekea mahali patakatifu
  rationale: Katika muktadha wa ibada ya hekalu, nomino hii inaweza kuonyesha mahali patakatifu kama mwelekeo wa kuinuliwa kwa mikono. Kwa kuwa Kiebrania hakina kihusishi hapa na pia kinaweza kumaanisha utakatifu au kuwa na maana ya mahali, uwezekano huo umehifadhiwa katika tanbihi.
- source_word: וּבָרֲכוּ
  choice: na mbariki
  rationale: Amri ya wingi ya ברך inapotumiwa kwa Mungu ina maana ya kumbariki kwa sifa na ibada; ‘mbariki’ inadumisha istilahi hiyo pana kuliko ‘msifuni.’
- source_word: אֶת
  choice: '[kiashiria cha yambwa, hakitafsiriwi]'
  rationale: Kiashiria hiki cha yambwa ya moja kwa moja katika Kiebrania hakina neno linalolingana nacho katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama ‘BWANA.’
theological_decisions:
- issue: Maana ya קֹדֶשׁ katika kishazi שְׂאוּ יְדֵיכֶם קֹדֶשׁ
  choice: 'Maana ya mwelekeo: ‘kuelekea mahali patakatifu’'
  alternative: 'Maana ya mahali: ‘katika mahali patakatifu’; au maana ya namna/sifa: ‘kwa utakatifu’'
  rationale: Muktadha wa watumishi wa hekalu unaunga mkono rejeo la patakatifu, lakini kutokuwapo kwa kihusishi katika Kiebrania kunaruhusu pia maana ya mahali au ya hali ya utakatifu. Tanbihi inalinda utata huo badala ya kuufuta.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki chenye mtindo wa heshima, ulio wazi na unaofaa kwa ibada. Muundo wa amri za wingi na jina ‘Yahwe’ umehifadhiwa.
