base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/000.yaml
  text: A psalm of Asaph. God[a], nations have come into your inheritance; they have defiled your holy temple; they have made Jerusalem into ruins.
translation:
  language: sw
  text: 'Zaburi ya Asafu.


    Ee Mungu, mataifa yameingia katika urithi wako;

    yamenajisi hekalu lako takatifu;

    yameifanya Yerusalemu kuwa magofu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwa marundo ya magofu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: Zaburi ya Asafu
  rationale: Kichwa cha kawaida na cha asili katika Kiswahili; kihusishi לְ kinaachwa na uhusiano wake mpana badala ya kufafanuliwa kuwa lazima iliandikwa na Asafu.
- source_word: גּוֹיִם
  choice: mataifa
  rationale: Huonyesha vikundi vya watu wa mataifa yaliyovamia, bila kuongeza neno la ufafanuzi lisilokuwamo katika chanzo.
- source_word: בְּנַחֲלָתֶךָ
  choice: katika urithi wako
  rationale: Huhifadhi taswira ya nchi na watu walio sehemu ya urithi wa Mungu, pamoja na upana wa maana wa neno la Kiebrania.
- source_word: הֵיכַל קָדְשֶׁךָ
  choice: hekalu lako takatifu
  rationale: Tafsiri ya kawaida na wazi ya hekalu lililowekwa wakfu kwa Mungu.
- source_word: לְעִיִּים
  choice: kuwa magofu
  rationale: Kiswahili cha asili kinachoeleza kuharibiwa kwa Yerusalemu; wingi wa Kiebrania unaweza pia kudokeza marundo ya magofu, jambo lililohifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya “urithi wako”
  choice: Neno “urithi” limehifadhiwa bila kulibana kuwa nchi pekee au watu pekee.
  alternative: “nchi yako” au “watu wako”
  rationale: Neno נַחֲלָה linaweza kuhusisha nchi, mali, na watu wa Mungu; ufafanuzi mwembamba ungeondoa mvutano na upana wa kishairi.
- issue: Uhusiano wa Asafu na zaburi
  choice: “ya Asafu”
  alternative: “iliyoandikwa na Asafu”
  rationale: Kihusishi cha Kiebrania hakilazimishi maana ya uandishi pekee; kinaweza kuonyesha uandishi, ushirika, mkusanyo, au matumizi yanayohusiana na Asafu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mistari mitatu imehifadhi mfuatano na usambamba wa kilio cha Kiebrania.
