  text: עַד מָ֣ה יְ֭הוָה תֶּאֱנַ֣ף לָ/נֶ֑צַח תִּבְעַ֥ר כְּמוֹ אֵ֝֗שׁ קִנְאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/005.yaml
  text: How long[a], O Yahweh? Will you be angry forever? Will your jealousy burn like fire?
translation:
  language: sw
  text: Hata lini, Ee Yahwe? Je, utakuwa na hasira milele? Je, wivu wako[a] utawaka kama moto?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ari yako.” Neno la Kiebrania קִנְאָה linaweza kumaanisha “wivu” au “ari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָה
  choice: Hata lini
  rationale: Ni usemi wa kawaida wa kilio unaouliza hali hii itaendelea kwa muda gani; “Hata lini” ni Kiswahili cha asili chenye uzito wa malalamiko.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi, si kubadilishwa na cheo.
- source_word: תֶּאֱנַף
  choice: utakuwa na hasira
  rationale: Kitenzi kinamaanisha kuwa na hasira; usemi huu ni wazi na wa kawaida bila kuongeza kiwango cha ghadhabu kisicholazimishwa na Kiebrania.
- source_word: לָנֶצַח
  choice: milele
  rationale: Katika kilio hiki, neno linauliza kama hasira ya Mungu itaendelea bila mwisho.
- source_word: תִּבְעַר
  choice: utawaka
  rationale: Kitenzi kinahusu kuwaka, na kinaendeleza moja kwa moja tashbihi ya moto.
- source_word: כְּמוֹ אֵשׁ
  choice: kama moto
  rationale: Tashbihi ya Kiebrania imehifadhiwa kwa Kiswahili cha kawaida.
- source_word: קִנְאָתֶךָ
  choice: wivu wako
  rationale: Neno linaweza kumaanisha “wivu” au “ari.” “Wivu” huhifadhi maana kali ya uhusiano wa agano katika muktadha wa hasira ya Mungu, huku “ari” ikihifadhiwa katika tanbihi kama tafsiri halali.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia jina binafsi la Mungu moja kwa moja; “Yahwe” hulihifadhi badala ya kulibadilisha kuwa cheo kama “BWANA.”
- issue: Maana ya קִנְאָה inaposemwa kuhusu Mungu
  choice: wivu
  alternative: ari
  rationale: Muktadha wa hasira katika uhusiano wa agano unaunga mkono “wivu,” lakini Kiebrania pia huruhusu “ari”; tanbihi inahifadhi mvutano huo wa kimaana na kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa maswali matatu huhifadhi msisitizo wa kilio cha Kiebrania; alama ya tanbihi imewekwa baada ya neno lenye utata, “wivu.”
