  text: שְׁפֹ֤ךְ חֲמָתְ/ךָ֨ אֶֽל הַ/גּוֹיִם֮ אֲשֶׁ֪ר לֹא יְדָ֫ע֥וּ/ךָ וְ/עַ֥ל מַמְלָכ֑וֹת אֲשֶׁ֥ר בְּ֝/שִׁמְ/ךָ֗ לֹ֣א קָרָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/006.yaml
  text: Pour out your wrath on the nations that do not know you[b][a], and on the kingdoms that do not call on your name.
translation:
  language: sw
  text: Mwaga ghadhabu yako juu ya mataifa yasiyokujua[a], na juu ya falme zisizoliitia jina lako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yasiyokutambua.” Neno la Kiebrania linalotafsiriwa “kujua” linaweza kumaanisha kumtambua mtu katika uhusiano, si kuwa na taarifa kumhusu tu.
    reason: lexical_alternative
  - marker: b
    text: Au, “zisizokuomba kwa kulitaja jina lako.” Nahau ya Kiebrania “kuliitia jina” inahusu kumwomba Mungu au kumwabudu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפֹךְ
  choice: Mwaga
  rationale: Kauli ya amri ya שפך inaendeleza taswira ya ghadhabu kama kitu kinachomwagwa; “mwaga” ni ya asili na yenye nguvu katika Kiswahili.
- source_word: חֲמָתְךָ
  choice: ghadhabu yako
  rationale: חֵמָה humaanisha hasira kali au ghadhabu; “ghadhabu” inafaa kwa sajili ya kishairi na kwa muktadha wa ombi la hukumu.
- source_word: אֶל ... וְעַל
  choice: juu ya ... na juu ya
  rationale: Katika muundo wa Kiswahili “mwaga ... juu ya,” maneno haya yanaonyesha walengwa wa ghadhabu na kuhifadhi usambamba wa mistari miwili.
- source_word: הַגּוֹיִם
  choice: mataifa
  rationale: Hapa גּוֹיִם ni mataifa ya kigeni yaliyo tofauti na Israeli; “mataifa” ni tafsiri ya moja kwa moja isiyoingiza dhana za baadaye za kidini.
- source_word: אֲשֶׁר לֹא יְדָעוּךָ
  choice: yasiyokujua
  rationale: יָדַע inaweza kumaanisha kumjua Mungu kwa uhusiano na kumtambua, si kuwa na taarifa tu. “Yasiyokujua” huhifadhi upana na mkazo wa Kiebrania.
- source_word: מַמְלָכוֹת
  choice: falme
  rationale: מַמְלָכוֹת ni maeneo au tawala za kifalme; “falme” ni neno wazi na hudumisha usambamba na “mataifa.”
- source_word: אֲשֶׁר בְּשִׁמְךָ לֹא קָרָאוּ
  choice: zisizoliitia jina lako
  rationale: קרא בשם ni nahau ya kuomba kwa kulitaja jina, kumwomba, au kumwabudu Mungu. “Kuliitia jina lako” huhifadhi nahau ya kibiblia bila kuifupisha kuwa ibada pekee.
theological_decisions:
- issue: Maana ya mataifa kutomjua Mungu
  choice: yasiyokujua
  alternative: yasiyokutambua
  rationale: Kiebrania יָדַע kinaweza kujumuisha utambuzi wa kiuhusiano, lakini hakipaswi kufinywa kuwa kukiri au kuabudu tu. Tafsiri kuu huhifadhi mvutano huo, huku tanbihi ikionyesha uwezekano mwingine.
- issue: Maana ya kuliitia jina la Mungu
  choice: zisizoliitia jina lako
  alternative: zisizokuomba kwa jina lako / zisizoabudu kwa jina lako
  rationale: Nahau ya Kiebrania inaweza kuhusisha maombi, kuomba msaada, au ibada. Kuihifadhi katika matini kuu huepuka kuchagua maana moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na mdundo wa kishairi. “Ghadhabu” na “falme” huhifadhi uzito wa zaburi bila kuwa maneno yasiyoeleweka. Alama zote za tanbihi zimewekwa katika matini kuu karibu na vifungu vinavyohusika.
