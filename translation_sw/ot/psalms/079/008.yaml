  text: אַֽל תִּזְכָּר לָ/נוּ֮ עֲוֺנֹ֪ת רִאשֹׁ֫נִ֥ים מַ֭הֵר יְקַדְּמ֣וּ/נוּ רַחֲמֶ֑י/ךָ כִּ֖י דַלּ֣וֹנוּ מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/008.yaml
  text: Do not remember against us the iniquities of former times; let your mercies quickly come to meet us[a], for we have been brought very low.
translation:
  language: sw
  text: Usikumbuke dhidi yetu maovu ya nyakati zilizopita; rehema zako na zituijie upesi, kwa maana tumedhoofika sana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּזְכָּר לָנוּ
  choice: Usikumbuke dhidi yetu
  rationale: Kauli ya ombi la kukataza imehifadhiwa, na ‘dhidi yetu’ inaonyesha nguvu ya kimahakama ya לָנוּ katika muktadha wa hatia.
- source_word: עֲוֺנֹת
  choice: maovu
  rationale: Neno hili linaonyesha makosa yenye hatia ya kimaadili; ‘maovu’ ni la kawaida, zito, na linaeleweka katika Kiswahili cha sasa.
- source_word: רִאשֹׁנִים
  choice: ya nyakati zilizopita
  rationale: Tafsiri hii inadumisha maana ya wakati bila kuamua ikiwa yanayokusudiwa ni maovu ya mababu au maovu ya zamani ya waombaji wenyewe.
- source_word: מַהֵר יְקַדְּמוּנוּ
  choice: na zije upesi kutulaki
  rationale: ‘Kutulaki’ huhifadhi taswira ya rehema zinazokuja mbele na kukutana na waombaji, huku ‘upesi’ ikionyesha uharaka.
- source_word: רַחֲמֶיךָ
  choice: rehema zako
  rationale: ‘Rehema’ ni usemi wa kawaida na wenye hadhi unaoweza kuwakilisha wingi wa Kiebrania katika Kiswahili.
- source_word: כִּי דַלּוֹנוּ מְאֹד
  choice: kwa maana tumedhoofika sana
  rationale: Kitenzi kinaonyesha hali ya kupungukiwa nguvu au kuletwa chini; ‘tumedhoofika sana’ huwasilisha hali ya sasa iliyotokana na maafa bila kulazimisha maana ya umaskini pekee.
theological_decisions:
- issue: Kinachorejelewa na ‘maovu ya nyakati zilizopita’
  choice: Yametafsiriwa kwa usemi wa wakati bila kutaja wenye maovu hayo.
  alternative: ‘maovu ya mababu zetu’ au ‘maovu yetu ya zamani’
  rationale: 'Kiebrania kina utata wa kweli: kinaweza kurejelea dhambi za vizazi vilivyotangulia au dhambi za awali za jamii yenyewe. Matini kuu haiamui jambo hilo, na tanbihi inahifadhi uwezekano wote.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala. Muundo ‘na zije’ unafikisha ombi lenye msisitizo; ‘kutulaki’ huhifadhi taswira ya kukutana bila kuwa wa kizamani kupita kiasi.
