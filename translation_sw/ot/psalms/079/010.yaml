base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/010.yaml
  text: Why should the nations say[b][a], “Where is their God?” Let the vengeance of your servants' shed blood be made known among the nations before our eyes.
translation:
  language: sw
  text: Kwa nini mataifa yaseme, “Mungu wao yuko wapi?” Na kisasi cha damu ya watumishi wako iliyomwagwa kijulikane kati ya mataifa mbele ya macho yetu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na kijulikane kati ya mataifa mbele ya macho yetu kisasi cha damu ya watumishi wako iliyomwagwa.”
    reason: Mpangilio wa Kiebrania unaruhusu kirai cha kisasi kuwasilishwa baada ya ombi la ‘na kijulikane.’
lexical_decisions:
- source_word: לָמָּה
  choice: Kwa nini
  rationale: Hutanguliza malalamiko ya balagha; muundo huu ni wa kawaida na wenye nguvu katika Kiswahili.
- source_word: יֹאמְרוּ
  choice: yaseme
  rationale: Hali ya utegemezi baada ya ‘Kwa nini’ inafaa kwa swali la kupinga linalodokeza, ‘Kwa nini yaruhusiwe kusema?’
- source_word: הַגּוֹיִם
  choice: mataifa
  rationale: Hurejelea mataifa ya kigeni; ‘mataifa’ ni ya kawaida na haiingizi maana maalumu ya kidini ya baadaye.
- source_word: אַיֵּה אֱלֹהֵיהֶם
  choice: Mungu wao yuko wapi?
  rationale: Huhifadhi dhihaka ya moja kwa moja kwa mpangilio wa asili wa Kiswahili.
- source_word: יִוָּדַע
  choice: na kijulikane
  rationale: Nifali ina maana ya kutendwa/kujulikana; ombi ‘na kijulikane’ huhifadhi hali hiyo bila kutaja mtendaji asiyeelezwa.
- source_word: בַגּוֹיִם
  choice: kati ya mataifa
  rationale: Kiambishi ב hapa huonyesha eneo la kijamii ambamo tendo la Mungu linapaswa kutambuliwa hadharani.
- source_word: לְעֵינֵינוּ
  choice: mbele ya macho yetu
  rationale: Huhifadhi picha halisi na maana ya kwamba waombaji wenyewe walione tendo hilo.
- source_word: נִקְמַת
  choice: Kisasi kwa ajili ya
  rationale: ‘Kisasi’ huhifadhi nguvu ya neno la Kiebrania נקמה; ‘kwa ajili ya’ huweka wazi uhusiano wa kisasi na damu iliyomwagwa bila kudai kwamba damu yenyewe ndiyo inayolipiza kisasi.
- source_word: דַּם עֲבָדֶיךָ הַשָּׁפוּךְ
  choice: damu ya watumishi wako iliyomwagwa
  rationale: Huhifadhi ‘damu,’ uhusiano na watumishi wa Mungu, na hali ya kutendwa ya kishiriki ‘iliyomwagwa’ kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Ombi la kisasi cha Mungu
  choice: Kuhifadhi neno ‘kisasi’ na ombi la kitendo hicho kuonekana wazi.
  alternative: Kutafsiri kwa upole kama ‘haki’ au ‘kuwatetea watumishi wako.’
  rationale: Neno נקמת linamaanisha kisasi/ulipizaji kisasi; kulibadili kuwa haki kwa ujumla kungepunguza nguvu ya ombi la zaburi.
- issue: Uhusiano wa ‘mbele ya macho yetu’
  choice: Kulihusisha na kujulikana na kushuhudiwa kwa kisasi kati ya mataifa.
  alternative: Kulihusisha kwa karibu zaidi na kirai nomino ‘kisasi ... mbele ya macho yetu.’
  rationale: Mpangilio wa Kiebrania unaweza kuruhusu tofauti ndogo ya uhusiano, lakini tafsiri hii inaonyesha kwa kawaida kwamba waombaji wanataka kuliona tendo la Mungu wenyewe.
- issue: Uhusiano wa נקמת na דם
  choice: ‘Kisasi kwa ajili ya damu’
  alternative: ‘Kisasi cha damu’
  rationale: Hali ya muundo tegemezi wa Kiebrania inaweza kuwakilishwa kwa njia zote mbili, lakini ‘kwa ajili ya damu’ huepuka uwezekano wa Kiswahili kueleweka kana kwamba damu ndiyo mwenye kisasi, huku ikihifadhi maana ya kulipiza damu iliyomwagwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. ‘Yaseme’ hudokeza swali la kupinga, na ‘na kijulikane’ ni muundo wa ombi unaofaa katika sala. Alama ya tanbihi [a] imewekwa baada ya sentensi inayohusika.
