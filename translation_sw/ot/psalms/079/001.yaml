  terminology: “Zaburi,” “Asafu,” “Ee Mungu,” “urithi,” “hekalu ... takatifu,” na “unajisi” ni istilahi sahihi na zinazofaa kwa Kiswahili cha Afrika Mashariki. “Marundo ya magofu” hutoa vizuri wingi na taswira ya עִיִּים. Tanbihi ina nanga sahihi na inaeleza mbadala halali bila kubadili maana.
