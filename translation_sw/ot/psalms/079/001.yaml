  source_fidelity: 'Tafsiri inafuata Kiebrania kwa uaminifu: mwito wa “Ee Mungu,” kuingia kwa mataifa katika urithi wa Mungu, kunajisiwa kwa hekalu, na Yerusalemu kufanywa marundo ya magofu vyote vimehifadhiwa. “Katika urithi wako” inadumisha upana wa נַחֲלָתֶךָ bila kubainisha isivyosemwa kama nchi au watu.'
