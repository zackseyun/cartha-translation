  variant: Standard East African Swahili
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֡ים בָּ֤אוּ גוֹיִ֨ם בְּֽ/נַחֲלָתֶ֗/ךָ טִ֭מְּאוּ אֶת הֵיכַ֣ל קָדְשֶׁ֑/ךָ שָׂ֖מוּ אֶת יְרוּשָׁלִַ֣ם לְ/עִיִּֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/001.yaml
  text: A psalm of Asaph. O God[a], the nations have come into your inheritance; they have defiled your holy temple; they have made Jerusalem a heap of ruins.
translation:
  language: sw
  text: 'Zaburi ya Asafu.


    Ee Mungu, mataifa yameingia katika urithi wako;

    yamelitia unajisi hekalu lako takatifu;

    yameufanya Yerusalemu kuwa marundo ya magofu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwa magofu.”
    reason: עִיִּים inaweza kutafsiriwa kwa uwazi kuwa “marundo ya magofu” au kwa ufupi kuwa “magofu.”
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Ni neno la kawaida na sahihi la Kiswahili kwa utungo wa aina hii na kwa kichwa cha zaburi.
- source_word: לְאָסָף
  choice: ya Asafu
  rationale: Kiambishi לְ katika vichwa vya zaburi kinaweza kuonyesha uhusiano, umiliki, au uandishi; “ya Asafu” ni ya asili kwa Kiswahili bila kuamua zaidi ya Kiebrania.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Jina limetumiwa kama mwito wa moja kwa moja; “Ee” huonyesha mwito huo kwa Kiswahili sanifu.
- source_word: בָּאוּ גוֹיִם
  choice: mataifa yameingia
  rationale: בוא inaweza kumaanisha kuja au kuingia. Katika muktadha wa uvamizi wa eneo, “yameingia” ni ya kawaida na inaonyesha kitendo kilichotimia chenye athari inayoendelea.
- source_word: בְּנַחֲלָתֶךָ
  choice: katika urithi wako
  rationale: “Urithi” huhifadhi maana pana ya milki ya agano ya Mungu bila kuibana iwe nchi pekee au watu pekee.
- source_word: טִמְּאוּ
  choice: yamelitia unajisi
  rationale: Huhifadhi maana ya kukifanya kitu kitakatifu kuwa najisi, si kuharibu kimwili tu.
- source_word: הֵיכַל קָדְשֶׁךָ
  choice: hekalu lako takatifu
  rationale: Ni Kiswahili cha asili kinachowasilisha maana ya hekalu linalohusishwa na utakatifu wa Mungu.
- source_word: שָׂמוּ אֶת יְרוּשָׁלִַם לְעִיִּים
  choice: yameufanya Yerusalemu kuwa marundo ya magofu
  rationale: Muundo wa שׂים pamoja na לְ unaonyesha matokeo, yaani ‘kufanya kuwa’; עִיִּים ni wingi unaoweza kumaanisha marundo ya magofu au magofu.
theological_decisions:
- issue: Upana wa maana ya “urithi wako”
  choice: Kudumisha “urithi wako” bila kutaja nchi au watu moja kwa moja
  alternative: “nchi yako” au “watu wako”
  rationale: Kiebrania kinaacha rejeo hilo likiwa pana na lenye mwangwi wa milki ya agano ya Mungu; kulibainisha zaidi kungepunguza mvutano wa maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Upatanisho wa kisarufi umefuata nomino “mataifa” (yameingia, yamelitia, yameufanya).
