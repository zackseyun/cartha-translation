  text: שָׁפְכ֬וּ דָמָ֨/ם כַּ/מַּ֗יִם סְֽבִ֘יב֤וֹת יְֽרוּשָׁלִָ֗ם וְ/אֵ֣ין קוֹבֵֽר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/003.yaml
  text: They have poured out their blood like water all around Jerusalem[a], and there is no one to bury them.
translation:
  language: sw
  text: Wamemwaga damu yao kama maji pande zote za Yerusalemu, wala hakuna wa kuwazika.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁפְכוּ
  choice: wamemwaga
  rationale: Kitenzi cha Qal timilifu, nafsi ya tatu wingi, kinaonyesha tendo lililokamilika la kumwaga. Kiswahili ‘wamemwaga’ kinahifadhi picha ya kumwaga na kuunganika kwa kawaida na tashbihi ‘kama maji.’
- source_word: דָמָם
  choice: damu yao
  rationale: Nomino דם yenye kiambishi cha nafsi ya tatu wingi wa kiume humaanisha moja kwa moja ‘damu yao’; tafsiri hii haiongezi ufafanuzi wa ‘uhai’ usiotajwa wazi.
- source_word: כמים
  choice: kama maji
  rationale: Kiambishi כ kinaonyesha ulinganisho; ‘kama maji’ ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: סביבות ירושלים
  choice: pande zote za Yerusalemu
  rationale: סביבות huonyesha maeneo yanayozunguka mahali. ‘Pande zote za Yerusalemu’ huwasilisha ukubwa wa tukio kwa Kiswahili cha asili bila kulazimisha maana ya ndani au nje ya mji.
- source_word: וְאֵין
  choice: wala hakuna
  rationale: Hili ni kanusho la uwepo. ‘Wala hakuna’ linaendeleza kwa kawaida maelezo ya kishairi baada ya tendo lililokamilika.
- source_word: קוֹבֵר
  choice: wa kuwazika
  rationale: Mshiriki huyu humaanisha mtu anayezika au wa kuzika. Kiambishi ‘-wa-’ kinaweka wazi wahusika waliouawa wanaorejelewa na muktadha, bila kuongeza habari mpya.
