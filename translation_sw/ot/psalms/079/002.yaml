  text: נָֽתְנ֡וּ אֶת נִבְלַ֬ת עֲבָדֶ֗י/ךָ מַ֭אֲכָל לְ/ע֣וֹף הַ/שָּׁמָ֑יִם בְּשַׂ֥ר חֲ֝סִידֶ֗י/ךָ לְ/חַיְת/וֹ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/002.yaml
  text: They have given the corpses of your servants as food to the birds of the heavens[b][a], the flesh of your faithful ones to the beasts of the earth.
translation:
  language: sw
  text: Wamewapa ndege wa angani[b] mizoga ya watumishi wako kuwa chakula, na wanyama wa nchi nyama ya waaminifu wako[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watakatifu wako” au “wacha Mungu wako.” Neno la Kiebrania linaweza kumaanisha watu waliojitoa kwa Mungu na walio waaminifu kwake katika agano.
    reason: lexical_alternative
  - marker: b
    text: Au, “ndege wa mbinguni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתְנוּ
  choice: Wameitoa
  rationale: Kauli timilifu ya Kiebrania inaeleza tendo lililokamilika ambalo bado ni halisi katika kilio hiki; wakati timilifu wa Kiswahili unafaa. Umoja wa kitenzi unapatana na 'mizoga' kama ngeli ya mi-/i-.
- source_word: נִבְלַת עֲבָדֶיךָ
  choice: mizoga ya watumishi wako
  rationale: נבלה humaanisha maiti au mzoga. 'Mizoga' inadumisha picha kali ya miili iliyoachwa bila kuzikwa, huku 'watumishi wako' ikifaa kwa uhusiano wao na Mungu katika Zaburi.
- source_word: מַאֲכָל
  choice: iwe chakula
  rationale: Huwasilisha kusudi au matokeo ya kuitoa miili hiyo kuwa chakula kwa ndege kwa Kiswahili cha kawaida na chenye uzito.
- source_word: לְעוֹף הַשָּׁמָיִם
  choice: cha ndege wa angani
  rationale: עוֹף ni jina la jumla la viumbe warukao, hapa ndege; הַשָּׁמַיִם katika muktadha huu ni anga. Muundo huu ni wa asili katika Kiswahili.
- source_word: בְּשַׂר
  choice: nyama
  rationale: Maana halisi ni nyama ya mwili; neno hili linahifadhi picha ya kimwili na ulinganifu mkali wa kishairi.
- source_word: חֲסִידֶיךָ
  choice: waaminifu wako
  rationale: Neno linataja watu wenye uaminifu na kujitoa kwa Mungu katika uhusiano wa agano. 'Waaminifu wako' linaeleweka bila kuingiza maana ya kiufundi ya baadaye.
- source_word: לְחַיְתוֹ אָרֶץ
  choice: cha wanyama wa nchi
  rationale: חיה hapa ni wanyama, hasa wanyama wa porini wanaokula mizoga. 'Wanyama wa nchi' hudumisha ulinganifu na 'ndege wa angani'.
theological_decisions:
- issue: Maana ya jina la kiagano חֲסִידֶיךָ
  choice: waaminifu wako
  alternative: watakatifu wako; wacha Mungu wako; walio waaminifu kwako
  rationale: Tafsiri hii inaonyesha uaminifu na kujitoa kwa Mungu bila kulifanya neno kuwa cheo maalumu cha kidini. Tanbihi inadumisha uwezekano wa maana ya utakatifu au uchaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi na chenye hadhi lakini kinachoeleweka kwa urahisi. Ulinganifu wa mstari umehifadhiwa kwa 'ndege wa angani' na 'wanyama wa nchi,' pamoja na picha kali za 'mizoga' na 'nyama'.
