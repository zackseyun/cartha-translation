  text: תָּ֤ב֣וֹא לְ/פָנֶי/ךָ֮ אֶנְקַ֪ת אָ֫סִ֥יר כְּ/גֹ֥דֶל זְרוֹעֲ/ךָ֑ ה֝וֹתֵ֗ר בְּנֵ֣י תְמוּתָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/011.yaml
  text: Let the groaning of the prisoner come before you; according to the greatness of your arm[a], preserve the children of death.
translation:
  language: sw
  text: Kuugua kwa mfungwa na kufike mbele zako; kwa kadiri ya ukuu wa mkono wako, wahifadhi wale waliokusudiwa kufa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “wana wa mauti,” nahau ya Kiebrania inayomaanisha watu waliokusudiwa kufa au walio karibu na kifo.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּב֣וֹא
  choice: na kifike
  rationale: Kauli ya tendo lisilokamilika ya Qal imetumiwa kwa maana ya ombi; ‘na kifike’ huwasilisha ombi hilo kwa Kiswahili cha kawaida.
- source_word: לְפָנֶיךָ
  choice: mbele zako
  rationale: Ni nahau ya Kiebrania ya kuingia katika uwepo wa Mungu; ‘mbele zako’ huhifadhi taswira ya asili na ni ya kawaida katika Kiswahili.
- source_word: אֶנְקַת
  choice: kilio
  rationale: Neno hilo humaanisha kuugua au kulia kwa uchungu. ‘Kilio’ ni cha asili katika muktadha huu wa maombolezo na kinaeleweka kwa urahisi.
- source_word: אָסִיר
  choice: mfungwa
  rationale: Humtaja mtu aliyezuiliwa au kufungwa; ‘mfungwa’ ni neno wazi na la sasa.
- source_word: כְּגֹדֶל
  choice: kwa kadiri ya ukuu wa
  rationale: Muundo huu unaonyesha kipimo au kiwango; ‘kwa kadiri ya ukuu wa’ huhifadhi ombi linalolingana na ukubwa wa nguvu za Mungu.
- source_word: זְרוֹעֲךָ
  choice: mkono wako
  rationale: ‘Mkono’ huhifadhi sitiari halisi ya Kiebrania inayowakilisha nguvu, badala ya kuibadili moja kwa moja kuwa ‘nguvu.’
- source_word: הוֹתֵר
  choice: wahifadhi
  rationale: Amri ya Hiphil ya יתר hapa ni ombi la kuwafanya wabaki hai, yaani kuwaokoa na kifo; ‘wahifadhi’ hubeba maana hiyo bila kuibana mno.
- source_word: בְּנֵי תְמוּתָה
  choice: wale waliohukumiwa kufa
  rationale: Nahau hii, kihalisi ‘wana wa mauti,’ inawataja walio chini ya hukumu ya kifo au waliokaribia kuuawa. Tafsiri hii huwasilisha maana kwa Kiswahili cha kawaida, huku usemi halisi ukitolewa katika tanbihi.
theological_decisions:
- issue: Iwapo בְּנֵי תְמוּתָה inaonyesha hukumu rasmi au hali ya kuwa karibu kufa
  choice: wale waliohukumiwa kufa
  alternative: wale walio karibu kufa
  rationale: Nahau inaweza kuhusisha waliokusudiwa au kuhukumiwa kufa, bila kulazimisha maelezo ya chanzo cha hukumu. Tanbihi huhifadhi usemi halisi na upana wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa ombi na sitiari ya ‘mkono’ vimehifadhiwa; usemi usio wa kawaida ‘wana wa mauti’ umefafanuliwa katika tanbihi.
