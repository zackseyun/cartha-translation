  text: For they have devoured Jacob and laid waste his dwelling place[a].
translation:
  language: sw
  text: 'Kwa maana wamemla Yakobo,

    na wameyafanya makao yake kuwa ukiwa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa sababu wamemteketeza Yakobo na kuyafanya maskani yake kuwa mahame.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huleta sababu ya ombi au hukumu iliyotangulia, na ni kiunganishi cha kawaida chenye hadhi katika Kiswahili.
- source_word: אָכַל
  choice: wamemla
  rationale: Huhifadhi sitiari ya Kiebrania ya ‘kula’ kwa ukatili, ambayo katika muktadha huu humaanisha kuwaangamiza au kuwateketeza watu.
- source_word: אֶת יַעֲקֹב
  choice: Yakobo
  rationale: Jina la kishairi la agano limehifadhiwa bila kulipanua kuwa ‘wazao wa Yakobo’ au kulibadili kuwa ‘Israeli.’
- source_word: נָוֵהוּ
  choice: makao yake
  rationale: Neno linaweza kumaanisha makao, maskani, au malisho; ‘makao yake’ huhifadhi maana pana ya mahali anapoishi Yakobo/Israeli bila kuifanya hekalu pekee.
- source_word: הֵשַׁמּוּ
  choice: kuyafanya ... kuwa ukiwa
  rationale: Huwasilisha kisababishi cha Hifili, yaani kuyafanya makao yawe mahame, kwa Kiswahili cha kawaida na chenye hadhi.
theological_decisions:
- issue: Kirejeo cha ‘makao yake’
  choice: Kimeachwa kikirejelea kwa upana makao ya Yakobo/Israeli.
  alternative: Hekalu au patakatifu hasa; au nchi kwa ujumla.
  rationale: Kiambishi cha umilikaji kwa kawaida humrejelea Yakobo katika mstari huu. Muktadha mpana unaweza kujumuisha hekalu, lakini kishazi hiki pekee hakilazimishi maana hiyo finyu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. ‘Wamemla’ huhifadhi picha kali ya asili; tanbihi inatoa usemi wa kufafanua zaidi.
