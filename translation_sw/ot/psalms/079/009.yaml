base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/009.yaml
  text: Help us[a], God of our salvation, for the glory of your name[b]; deliver us and atone for our sins for your name’s sake.
translation:
  language: sw
  text: Utusaidie, Ee Mungu wa wokovu wetu, kwa ajili ya utukufu wa jina lako[a]; utuokoe na ufanye upatanisho kwa dhambi zetu[b], kwa ajili ya jina lako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu ya utukufu wa jina lako.”
    reason: Kirai cha Kiebrania kinaweza kuonyesha sababu au msingi wa ombi.
  - marker: b
    text: Au, “ufanye upatanisho kuhusu dhambi zetu.” Kitenzi cha Kiebrania kina maana ya upatanisho, si msamaha tu.
    reason: Hufafanua uzito wa lugha ya upatanisho katika כפר na kutoa namna nyingine ya karibu ya kuwasilisha maana yake kwa Kiswahili.
lexical_decisions:
- source_word: עָזְרֵנוּ
  choice: Utusaidie
  rationale: Ni ombi la moja kwa moja linalotokana na amri ya kitenzi עזר pamoja na kiambishi cha nafsi ya kwanza wingi; linaonyesha dharura bila kuongeza maana.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: Mungu wa wokovu wetu
  rationale: Linahifadhi muundo wa Kiebrania unaomtaja Mungu kuwa chanzo cha wokovu, huku likibaki la kawaida na lenye hadhi katika Kiswahili.
- source_word: עַל דְּבַר כְּבוֹד שְׁמֶךָ
  choice: kwa ajili ya utukufu wa jina lako
  rationale: Kirai hiki kinaonyesha msingi au sababu ya ombi. Tafsiri hii inahifadhi kwa kutofautisha ‘utukufu’ na ‘jina’ na haibadili kirai kuwa sifa tu ya jina.
- source_word: וְהַצִּילֵנוּ
  choice: utuokoe
  rationale: Hiphil ya נצל humaanisha kuokoa au kukomboa kutoka hatarini; ‘utuokoe’ ni ya asili na inaeleweka kwa wasomaji wa kawaida.
- source_word: וְכַפֵּר עַל
  choice: ufanye upatanisho kwa ajili ya
  rationale: Kitenzi כפר pamoja na עַל kina lugha nzito ya upatanisho kuhusu dhambi. Tafsiri hii hailainishi maana yake kuwa msamaha pekee wala kuingiza utaratibu mahususi wa baadaye.
- source_word: חַטֹּאתֵינוּ
  choice: dhambi zetu
  rationale: Nomino ni ya wingi na ina kiambishi cha nafsi ya kwanza wingi; ‘dhambi zetu’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: לְמַעַן שְׁמֶךָ
  choice: kwa ajili ya jina lako
  rationale: Ni nahau inayoliweka jina, yaani heshima na sifa ya Mungu, kuwa sababu ya kutenda kwake. Kurudia ‘jina lako’ kunahifadhi msisitizo wa mstari.
theological_decisions:
- issue: Maana ya כפר katika ombi la toba
  choice: ufanye upatanisho kwa ajili ya dhambi zetu
  alternative: utusamehe dhambi zetu
  rationale: ‘Upatanisho’ huhifadhi uzito wa kitenzi cha Kiebrania, ambacho kinahusu kushughulikia dhambi na hatia, si kutamka msamaha tu. Hata hivyo, tafsiri haielezi utaratibu mahususi wa upatanisho usiotajwa katika mstari.
- issue: Sababu ya msaada wa Mungu inayohusishwa na jina lake
  choice: kwa ajili ya utukufu wa jina lako ... kwa ajili ya jina lako
  alternative: kwa sababu ya utukufu wa jina lako
  rationale: Mstari unaomba Mungu atende kwa msingi wa utukufu na heshima ya jina lake, si kwa sababu ya ustahili wa watu. Kurudiwa kwa hoja hii katika vipashio viwili kumehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. ‘Ee’ linaweka wazi mwito kwa Mungu; marudio ya ‘kwa ajili ya ... jina lako’ yamehifadhiwa kwa sababu ni sehemu ya msisitizo wa Kiebrania.
