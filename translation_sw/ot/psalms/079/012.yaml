  text: וְ/הָ֘שֵׁ֤ב לִ/שְׁכֵנֵ֣י/נוּ שִׁ֭בְעָתַיִם אֶל חֵיקָ֑/ם חֶרְפָּ֘תָ֤/ם אֲשֶׁ֖ר חֵרְפ֣וּ/ךָ אֲדֹנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/012.yaml
  text: And repay to our neighbors sevenfold into their lap the reproach with which they reproached you[b][a], O Lord.
translation:
  language: sw
  text: Na uwarudishie jirani zetu mara saba mapajani mwao[a] matusi waliyokutukana kwa hayo, Ee Bwana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mapajani mwao” ni picha ya matusi yao kuwarudia wao wenyewe; pia inaweza kutafsiriwa “kifuani mwao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָשֵׁב
  choice: Na uwarudishie
  rationale: Hifili ya שוב inaomba Mungu asababishe jambo liwarudie waliolitenda; “uwarudishie” huhifadhi picha hiyo na pia maana ya kulipiza.
- source_word: לִשְׁכֵנֵינוּ
  choice: jirani zetu
  rationale: שָׁכֵן humaanisha jirani au mtu anayekaa karibu. Katika muktadha huenda ni mataifa yanayozunguka Israeli, lakini “jirani zetu” haiongezi ufafanuzi usiotajwa wazi.
- source_word: שִׁבְעָתַיִם
  choice: mara saba
  rationale: Hii ndiyo njia ya kawaida na wazi ya Kiswahili ya kueleza kiwango cha ‘sevenfold/seven times’ huku ikihifadhi mkazo wa kishairi.
- source_word: אֶל חֵיקָם
  choice: kifuani mwao
  rationale: חֵיק hutaja kifua au mapaja na hapa ni tamathali ya kile kinachomrudia mtu mwenyewe. “Kifuani mwao” huhifadhi picha ya Kiebrania katika lugha yenye hadhi.
- source_word: חֶרְפָּתָם אֲשֶׁר חֵרְפוּךָ
  choice: matusi waliyokutukana nayo
  rationale: “Matusi” na “kutukana” hudumisha uhusiano wa mzizi kati ya nomino חֶרְפָּה na kitenzi חרף, na muundo huu ni wa asili katika Kiswahili.
- source_word: אֲדֹנָי
  choice: Ee Bwana
  rationale: אֲדֹנָי ni cheo cha Mungu, ‘Bwana’; “Ee” huonyesha wazi kwamba hapa ni mwito katika sala.
theological_decisions:
- issue: Ombi la adhabu na kiwango chake
  choice: Kuhifadhi ombi la moja kwa moja kwamba Mungu awarudishie matusi mara saba
  alternative: Kulainisha kuwa ombi la jumla la haki
  rationale: Aya inaomba wazi malipo ya Mungu dhidi ya waliomtukana. Tafsiri haipaswi kuondoa ukali au mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo umehifadhi tamathali ya Kiebrania bila kuifanya aya kuwa isiyoeleweka; “Ee Bwana” inafaa kwa lugha ya sala.
