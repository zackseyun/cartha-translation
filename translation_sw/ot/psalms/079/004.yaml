translation:
  language: sw
  text: Tumekuwa kitu cha fedheha kwa majirani zetu, dhihaka na kejeli kwa wale wanaotuzunguka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitu cha dhihaka na taabu kwa wale wanaotuzunguka.”
    reason: Mbadala wa kileksia unaowakilisha קֶלֶס kama “taabu” katika maana ya tauni/kejeli.
lexical_decisions:
- source_word: הָיִינוּ
  choice: Tumekuwa
  rationale: Kauli timilifu ya Qal, nafsi ya kwanza wingi, inaonyesha hali iliyotokana na matukio yaliyotangulia na inayoendelea sasa; “Tumekuwa” huhifadhi maana hiyo.
- source_word: חֶרְפָּה
  choice: kitu cha aibu
  rationale: Nomino hii humaanisha fedheha ya hadharani au mtu anayefanywa kitu cha dharau. “Kitu cha aibu” ni Kiswahili cha kawaida kinachoonyesha kwamba watu wenyewe wamekuwa sababu au shabaha ya kufedheheshwa.
- source_word: לִשְׁכֵנֵינוּ
  choice: kwa majirani zetu
  rationale: Kihusishi ל hapa huonyesha uhusiano au mtazamo wa watu wanaotajwa; “kwa majirani zetu” ni usemi mfupi na wa kawaida.
- source_word: לַעַג
  choice: kitu cha kudhihakiwa
  rationale: Neno hilo linahusu dhihaka au kejeli. Muundo wa “kitu cha...” unadumisha dhana ya watu kuwa shabaha ya dhihaka.
- source_word: קֶלֶס
  choice: kubezwa
  rationale: Neno hili linaingiliana kimaana na לַעַג lakini linaongeza wazo la bezo au dharau; “kubezwa” hudumisha mlundikano wa kishairi bila kurudia neno lilelile.
- source_word: לִסְבִיבוֹתֵינוּ
  choice: na wale wanaotuzunguka
  rationale: Kihalisi hurejelea walio au yaliyoko pande zote. “Wale wanaotuzunguka” ni ya asili katika Kiswahili na ina upeo mpana kuliko “majirani” wa kishazi cha kwanza.
