id: PSA.79.13
reference: Psalms 79:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/אֲנַ֤חְנוּ עַמְּ/ךָ֨ וְ/צֹ֥אן מַרְעִיתֶ/ךָ֮ נ֤וֹדֶ֥ה לְּ/ךָ֗ לְ/ע֫וֹלָ֥ם לְ/דֹ֥ר וָ/דֹ֑ר נְ֝סַפֵּ֗ר תְּהִלָּתֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/013.yaml
  text: But we[a], your people and the sheep of your pasture, will give thanks to you forever[b]; from generation to generation we will recount your praise.
translation:
  language: sw
  text: Lakini sisi, watu wako na kondoo wa malisho yako,[a] tutakushukuru milele; kutoka kizazi hadi kizazi tutasimulia sifa zako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kundi la malisho yako.”
    reason: lexical_alternative
  - marker: b
    text: Au “tutatangaza sifa zako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Lakini sisi
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha utofautishaji na mataifa na uharibifu uliotajwa awali; “Lakini sisi” huleta nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: עַמְּךָ
  choice: watu wako
  rationale: Ni usemi wa moja kwa moja unaoonyesha uhusiano wa Mungu na jumuiya yake.
- source_word: וְצֹאן מַרְעִיתֶךָ
  choice: na kondoo wa malisho yako
  rationale: 'Huhifadhi wazi taswira ya kichungaji: watu ni kondoo wanaolishwa na kutunzwa na Mungu.'
- source_word: נוֹדֶה לְּךָ
  choice: tutakushukuru
  rationale: Kitenzi ידה katika Hiphil hapa kina maana ya kutoa shukrani; uchaguzi huu pia hudumisha tofauti na תְּהִלָּתֶךָ, “sifa zako,” katika sehemu inayofuata.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Ni tafsiri ya kawaida na yenye hadhi ya muda usio na mwisho katika ahadi ya shukrani.
- source_word: לְדֹר וָדֹר
  choice: kutoka kizazi hadi kizazi
  rationale: Huhifadhi mwendelezo wa vizazi vinavyofuatana kwa Kiswahili cha sasa na cha kawaida.
- source_word: נְסַפֵּר
  choice: tutasimulia
  rationale: ספר katika Piel inaweza kumaanisha kusimulia au kueleza kwa mfululizo; “tutasimulia” linafaa kwa wazo la kuendelea kutangaza mambo yanayostahili sifa.
- source_word: תְּהִלָּתֶךָ
  choice: sifa zako
  rationale: Ingawa nomino ya Kiebrania iko katika umoja wa dhana, “sifa zako” ni usemi wa asili wa Kiswahili na huhifadhi maana ya sifa inayomhusu Mungu.
theological_decisions:
- issue: Taswira ya kichungaji kuhusu watu wa Mungu
  choice: Kuhifadhi taswira wazi kwa kusema “kondoo wa malisho yako”
  alternative: “kundi la malisho yako”
  rationale: Mstari unaitambulisha jumuiya kama watu wa Mungu na pia kama kondoo walio chini ya utunzaji wake; taswira imehifadhiwa bila kuingiza mafundisho ya baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Alama za tanbihi zimewekwa baada ya vifungu vinavyohusika, badala ya kufuata nafasi zisizolingana katika safu ya mashauriano ya Kiingereza.
