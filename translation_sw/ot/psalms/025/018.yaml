  text: Look on my affliction and my trouble[a], and forgive all my sins.
translation:
  language: sw
  text: Uangalie mateso yangu na taabu yangu, na unisamehe dhambi zangu zote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya msingi, “na uzibebe dhambi zangu zote.” Kitenzi cha Kiebrania kinaweza kumaanisha “kuinua” au “kubeba”; hapa ni nahau ya kuondoa, yaani kusamehe, dhambi.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Uangalie
  rationale: Kauli ya amri inayomwelekea Mungu ni ombi la aangalie kwa makini na kwa kujali; ‘uangalie’ ni ya kawaida na yenye hadhi katika sala.
- source_word: עָנְיִי
  choice: mateso yangu
  rationale: Neno hili linaweza kumaanisha hali ya kuonewa, taabu, au mateso; ‘mateso’ halibani maana kuwa umaskini wa kiuchumi pekee.
- source_word: וַעֲמָלִי
  choice: na taabu yangu
  rationale: עָמָל hapa ni shida au hali nzito yenye maumivu; ‘taabu’ hufanya kazi kwa kawaida katika ulinganifu na ‘mateso.’
- source_word: וְשָׂא
  choice: na unisamehe
  rationale: נשׂא maana yake ya msingi ni kuinua au kubeba, lakini inapohusishwa na dhambi ni nahau ya kuondoa hatia, yaani kusamehe.
- source_word: לְכָל
  choice: zote
  rationale: Katika muundo huu לְ ni sehemu ya utawala wa kitenzi, na Kiswahili huwasilisha kwa kawaida jumla hiyo kwa ‘dhambi zangu zote.’
- source_word: חַטֹּאותָי
  choice: dhambi zangu
  rationale: Wingi wa חטאת katika maana ya kimaadili unatafsiriwa kwa uwazi na kwa kawaida kuwa ‘dhambi.’
theological_decisions:
- issue: Ufasiri wa nahau נשׂא ikiwa na dhambi kama yambwa
  choice: unisamehe dhambi zangu zote
  alternative: uniondolee dhambi zangu zote / uzichukue dhambi zangu zote
  rationale: ‘Unisamehe’ huwasilisha wazi maana ya nahau ya Kiebrania bila kuingiza fundisho la ziada; tanbihi huhifadhi taswira halisi ya kuinua au kuchukua dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala. Ulinganifu wa ‘mateso yangu na taabu yangu’ umehifadhiwa; ‘unisamehe’ hutoa maana ya nahau kwa uwazi, huku tanbihi ikihifadhi taswira yake ya Kiebrania.
