  text: Look at my enemies[a], for they are many, and they hate me with violent hatred.
translation:
  language: sw
  text: Waangalie adui zangu, kwa maana ni wengi, nao wananichukia kwa chuki ya jeuri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “na chuki ya jeuri wananichukia.” Usemi wa Kiebrania unasisitiza tabia ya jeuri na ukatili wa chuki yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Waangalie
  rationale: Amri ya nafsi ya pili umoja inayoelekezwa kwa Mungu. “Waangalie” huhifadhi nguvu ya ombi na, pamoja na kiambishi cha kitu, hurejelea adui kwa Kiswahili cha kawaida.
- source_word: אוֹיְבַי
  choice: adui zangu
  rationale: Nomino yenye kiambishi cha nafsi ya kwanza umoja; hili ndilo neno la kawaida na wazi kwa watu wanaompinga mtunga-zaburi.
- source_word: כִּי
  choice: kwa maana
  rationale: 'Huanzisha sababu ya ombi: Mungu aone hali hiyo kwa kuwa adui ni wengi.'
- source_word: רָבּוּ
  choice: ni wengi
  rationale: Ingawa kitenzi kinaweza kumaanisha “wameongezeka,” katika muktadha huu kinaeleza wingi wao kwa njia fupi na ya asili.
- source_word: וְשִׂנְאַת חָמָס
  choice: kwa chuki ya kikatili
  rationale: Muundo wa Kiebrania, kihalisi “chuki ya ukatili/jeuri,” unasisitiza tabia ya kikatili na isiyo na huruma ya chuki yao. Kiswahili hiki ni cha asili bila kuondoa uzito wa חָמָס.
- source_word: שְׂנֵאוּנִי
  choice: wananichukia
  rationale: Wakati uliopo huwasilisha hali inayoendelea ya uadui katika ombolezo hili, huku kiambishi cha nafsi ya kwanza kikihifadhiwa katika “-ni-”.
