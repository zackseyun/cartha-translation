  yaml_path: translation/ot/psalms/025/014.yaml
  text: The counsel of the LORD is for those who fear him, and his covenant is to make it known to them.
translation:
  language: sw
  text: 'Ushauri wa BWANA ni kwa wale wanaomcha,

    naye huwajulisha agano lake.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סוֹד
  choice: Ushauri
  rationale: Neno hili linaweza kumaanisha kikao cha siri, shauri la ndani, au uhusiano wa karibu. “Ushauri” linafuata maana ya shauri la ndani katika muktadha bila kulazimisha maana ya “siri” pekee.
- source_word: יְהוָה
  choice: BWANA
  rationale: Linatolewa kwa desturi iliyoenea ya Kiswahili ya kuwakilisha jina la agano YHWH kwa “BWANA” kwa herufi kubwa.
- source_word: לִירֵאָיו
  choice: kwa wale wanaomcha
  rationale: Huhifadhi maana ya kumcha Mungu kwa heshima na unyenyekevu, bila kuibadili kuwa hofu tupu.
- source_word: וּבְרִיתוֹ
  choice: na agano lake
  rationale: “Agano” ni neno la kawaida na sahihi kwa בְּרִית katika muktadha wa uhusiano wa Mungu na watu wake.
- source_word: לְהוֹדִיעָם
  choice: ni kuwajulisha
  rationale: Infinitivi yenye לְ inaweza kueleza kusudi au matokeo. Muundo huu unahifadhi sintaksia fupi na mvutano wa asili badala ya kuongeza kiima kisichotajwa wazi.
theological_decisions:
- issue: Uhusiano wa “agano lake” na “kuwajulisha”
  choice: na agano lake ni kuwajulisha
  alternative: naye huwajulisha agano lake
  rationale: Kiebrania hakina kitenzi wazi kinachosema moja kwa moja “huwajulisha.” Tafsiri iliyochaguliwa huhifadhi muundo wa nomino pamoja na infinitivi na haiongezi kwa urahisi tendo lililoelezwa kikamilifu kuliko chanzo.
- issue: Maana ya סוֹד
  choice: Ushauri wa BWANA
  alternative: Siri ya BWANA / urafiki wa karibu wa BWANA
  rationale: Neno lina wigo unaohusisha shauri la ndani na ukaribu wa siri. “Ushauri” unafaa kwa muktadha wa Mungu kuwaelekeza wanaomcha, huku kutotatua kabisa wigo wake wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha fupi, yenye hadhi na inayoeleweka. Muundo wa mstari wa pili umeachwa kwa kiasi fulani ukiwa na msongamano wa kishairi ili kuhifadhi utata wa Kiebrania.
