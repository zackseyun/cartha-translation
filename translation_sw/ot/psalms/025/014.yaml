    issue: The second colon lacks the object of “kuwajulisha.”
    rationale: The Hebrew wording associates “his covenant” with the act of making known to “them.” The draft’s infinitive construction leaves the reader asking what they are to be informed of and therefore fails to communicate the clause naturally.
