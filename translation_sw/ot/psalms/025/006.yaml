base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/006.yaml
  text: Remember your mercies[a], O Yahweh, and your steadfast love[c][b], for they are from of old.
translation:
  language: sw
  text: Ee Yahweh, kumbuka rehema zako[a] na upendo wako thabiti[b], kwa maana rehema na upendo wako thabiti vimekuwapo tangu zamani[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huruma zako.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina umbo la wingi hapa; pia inaweza kutafsiriwa, “upendo wako thabiti.”
    reason: lexical_alternative
  - marker: c
    text: Au, “tangu milele.” Usemi wa Kiebrania unaweza kumaanisha zamani za kale sana au muda wa milele.
    reason: alternative_reading
lexical_decisions:
- source_word: זְכֹר
  choice: kumbuka
  rationale: Kitenzi cha amri katika nafsi ya pili umoja wa kiume; ni ombi la moja kwa moja kwa Mungu na linasikika kwa kawaida katika sala.
- source_word: רַחֲמֶיךָ
  choice: rehema zako
  rationale: Nomino ya Kiebrania iko katika wingi na ina kiambishi cha nafsi ya pili umoja. Kiswahili hutumia kwa kawaida ‘rehema’ kama nomino isiyohesabika, lakini ‘zako’ na upatanisho wa wingi vinaonyesha wingi au wingi wa matendo ya huruma.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: וַחֲסָדֶיךָ
  choice: na upendo wako thabiti
  rationale: חסד humaanisha upendo mwaminifu na wa kudumu. Ingawa umbo la Kiebrania ni la wingi, umoja ni wa kawaida na wazi zaidi katika Kiswahili; tofauti hiyo imeonyeshwa katika tanbihi.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha msingi wa ombi la mtunga-zaburi.
- source_word: מֵעוֹלָם
  choice: tangu zamani
  rationale: Huhifadhi maana ya wakati wa kale bila kulazimisha maana ya kiufundi ya umilele; uwezekano wa ‘tangu milele’ umeonyeshwa katika tanbihi.
- source_word: הֵמָּה
  choice: zimekuwapo
  rationale: Kiwakilishi cha wingi kinarejelea rehema na upendo thabiti; ‘zimekuwapo’ huwasilisha kuwepo kwao tangu zamani kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Matini ina jina la Mungu moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya wakati katika מֵעוֹלָם
  choice: tangu zamani
  alternative: tangu milele
  rationale: Kirai kinaweza kumaanisha nyakati za kale sana au muda wa milele. Matini kuu haitoi dai lenye nguvu kuliko muktadha, huku tanbihi ikihifadhi uwezekano mwingine.
- issue: Wingi wa חֲסָדֶיךָ
  choice: upendo wako thabiti
  alternative: matendo yako ya upendo thabiti
  rationale: Kiebrania kina umbo la wingi, lakini umoja wa dhana hii unasikika kwa kawaida zaidi katika Kiswahili. Tanbihi inahifadhi taarifa ya kimuundo bila kutokeza usemi mzito.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Ee’ huonyesha mwito wa moja kwa moja, na mpangilio umeweka pamoja vitu viwili vinavyorejelewa na kitenzi cha wingi ‘zimekuwapo’.
