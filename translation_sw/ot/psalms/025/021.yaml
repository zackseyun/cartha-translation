  text: תֹּם וָ/יֹ֥שֶׁר יִצְּר֑וּ/נִי כִּ֝֗י קִוִּיתִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/021.yaml
  text: Integrity and uprightness may preserve me[b][a], for I wait for you.
translation:
  language: sw
  text: Uadilifu na unyofu vinilinde[a], kwa maana ninakungojea[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uadilifu na unyofu vitanilinda”; kitenzi cha Kiebrania hapa kinaweza kuonyesha ama matarajio yenye uhakika ama ombi.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa maana ninakutumaini”; kitenzi cha Kiebrania kinajumuisha maana ya kungojea kwa tumaini.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּם
  choice: Uadilifu
  rationale: Neno hili linaonyesha ukamilifu wa tabia ya kimaadili au maisha yasiyo na hila; “uadilifu” ni la kawaida na halidai kutokuwa na dhambi kabisa.
- source_word: וָיֹשֶׁר
  choice: na unyofu
  rationale: יֹשֶׁר ni unyofu katika maana ya kimaadili; “unyofu” linadumisha ulinganifu wa kishairi na “uadilifu.”
- source_word: יִצְּרוּנִי
  choice: vinilinde
  rationale: Kitenzi נצר humaanisha kulinda, kutunza, au kuhifadhi. Yiqtol hapa inaweza kuwa ombi au matarajio yenye uhakika; muundo huu wa Kiswahili unasomeka kwa kawaida kama ombi katika muktadha huu.
- source_word: כִּי
  choice: kwa maana
  rationale: כִּי inatoa sababu ya ombi au tumaini lililotangulia; “kwa maana” linaonyesha uhusiano huo wazi.
- source_word: קִוִּיתִיךָ
  choice: ninakungojea
  rationale: קוה hueleza kungojea kwa tumaini na matarajio. “Ninakungojea” linatunza wazo la kusubiri, huku tanbihi ikibainisha maana ya kutumaini.
theological_decisions:
- issue: Je, sifa za kimaadili za mtunga-zaburi zinawasilishwa kama ustahili wake binafsi unaompatia wokovu, au kama sifa zinazotajwa katika ombi la ulinzi?
  choice: Mstari umetafsiriwa kama ombi kwamba uadilifu na unyofu vimlinde, bila kuongeza dai kwamba ulinzi huo ni malipo ya ustahili binafsi.
  alternative: Kutafsiri kwa maana yenye mkazo zaidi kwamba uadilifu na unyofu wake hakika vitamlinda kwa sababu ya ustahili wake.
  rationale: Kiebrania kinataja sifa hizi kama watendaji wa ulinzi, huku mtunga-zaburi akimngojea Mungu. Tafsiri inadumisha mvutano huo bila kudhoofisha lugha ya kimaadili wala kuingiza fundisho lisilosemwa.
- issue: 'Nguvu ya kitenzi יִצְּרוּנִי: ombi au matarajio yenye uhakika'
  choice: 'Ombi: “vinilinde.”'
  alternative: 'Matarajio yenye uhakika: “vitanilinda.”'
  rationale: Yiqtol inaweza kubeba maana zote mbili katika muktadha huu. Sauti ya maombi ya zaburi inaunga mkono ombi, lakini uwezekano mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Uadilifu” na “unyofu” ni maneno yanayoeleweka kwa wasomaji wa kawaida na yanadumisha jozi ya sifa za kimaadili. Mpangilio wa tanbihi unafuata alama zinapotokea katika matini.
