id: PSA.25.11
reference: Psalms 25:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לְמַֽעַן שִׁמְ/ךָ֥ יְהוָ֑ה וְֽ/סָלַחְתָּ֥ לַ֝/עֲוֺנִ֗/י כִּ֣י רַב הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/011.yaml
  text: For the sake of your name[a], O Yahweh, forgive my iniquity[b], for it is great.
translation:
  language: sw
  text: Kwa ajili ya jina lako[a], ee Yahweh, usamehe uovu wangu[b], kwa maana ni mkubwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kwa ajili ya jina lako” ni ombi linalotegemea tabia, sifa, na heshima ya Yahweh, si matamshi ya jina lake tu.
    reason: cultural_note
  - marker: b
    text: Au “hatia yangu” au “dhambi yangu.” Neno la Kiebrania עָוֹן linaweza kumaanisha tendo ovu, hatia, au mzigo na matokeo ya hatia.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: Kwa ajili ya
  rationale: Kirai hiki kinaonyesha msingi au sababu ya ombi. “Kwa ajili ya” kinadumisha wazo la mwombaji kuomba kwa kuzingatia jina na heshima ya Mungu.
- source_word: שִׁמְךָ
  choice: jina lako
  rationale: Tafsiri halisi inadumishwa. Katika muktadha huu “jina” pia linahusisha sifa, tabia, na heshima ya Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Kiebrania linatoholewa badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: וְסָלַחְתָּ
  choice: usamehe
  rationale: Ingawa umbo la Kiebrania ni la kitenzi timilifu chenye waw, hapa linafanya kazi kama ombi. “Usamehe” ni ombi la moja kwa moja na la kawaida katika Kiswahili.
- source_word: לַעֲוֺנִי
  choice: uovu wangu
  rationale: עָוֹן inaweza kumaanisha tendo ovu, hatia, au mzigo na matokeo ya hatia. “Uovu wangu” inadumisha uzito wa kimaadili bila kuifungia maana katika hisia ya kuwa na hatia pekee.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa kiunganishi kinatoa sababu ya ombi la kusamehewa.
- source_word: רַב הוּא
  choice: ni mkubwa
  rationale: 'Kivumishi kinaonyesha ukubwa au uzito wa uovu, si idadi. Kiswahili hutumia ngeli ya nomino “uovu”: “ni mkubwa.”'
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Andiko lina jina la agano יהוה, si cheo cha kawaida. Kutumia “Yahweh” kunadumisha jina hilo bila kulibadilisha kuwa cheo.
- issue: Upana wa maana ya עָוֹן
  choice: uovu wangu
  alternative: hatia yangu; dhambi yangu
  rationale: Neno la Kiebrania linaweza kuelekeza kwa tendo baya, hali ya hatia, au matokeo yake. “Uovu” linadumisha uzito wa kosa huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- issue: Sababu ya kuomba msamaha kwa kuwa uovu ni mkubwa
  choice: kwa maana ni mkubwa
  alternative: ijapokuwa ni mkubwa
  rationale: כִּי kwa kawaida ni ya kisababishi hapa. Tafsiri haibadili mvutano wa kitheolojia wa mwombaji kutaja ukubwa wa uovu wake kama sababu ya kuomba neema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sala ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Ee” limetumiwa kuonyesha mwito wa moja kwa moja, na sentensi fupi inadumisha nguvu ya ombi la Kiebrania.
