  text: מִי זֶ֣ה הָ֭/אִישׁ יְרֵ֣א יְהוָ֑ה י֝וֹרֶ֗/נּוּ בְּ/דֶ֣רֶךְ יִבְחָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/012.yaml
  text: Who is the man who fears Yahweh? He will instruct him in the way he should choose[a].
translation:
  language: sw
  text: Ni mtu gani huyo anayemcha Yahweh? Atamfundisha njia anayopaswa kuichagua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “njia anayoichagua” au “njia atakayoichagua.” Kiebrania kinaruhusu vivuli hivi tofauti vya maana katika kitenzi cha mwisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: Ni nani huyo
  rationale: Muundo wa swali pamoja na kiashiria una nguvu ya swali la balagha; “Ni nani huyo” ni wa asili katika Kiswahili na huhifadhi kiashiria bila kukitia uzito kupita kiasi.
- source_word: הָאִישׁ
  choice: anayemcha
  rationale: Ingawa nomino ya Kiebrania ni ya kiume umoja, Kiswahili kinaweza kurejelea mtu huyo kwa kishazi cha ‘anaye-’ bila kuongeza ‘mwanamume’ isiyohitajika; umoja na maana wakilishi vinabaki wazi.
- source_word: יְרֵא יְהוָה
  choice: anayemcha Yahweh
  rationale: Kitenzi ‘kumcha’ huhifadhi maana nzito ya hofu yenye heshima katika muktadha wa hekima na ibada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo, kwa kufuata ushahidi wa maandishi ya chanzo.
- source_word: יוֹרֶנּוּ
  choice: Atamfundisha
  rationale: Hifili ya ירה inaweza kumaanisha kufundisha, kuelekeza, au kuagiza. ‘Atamfundisha’ ni ya kawaida na huhifadhi wazo la kutoa mwongozo; kiambishi ‘-m-’ humrejelea mtu anayemcha Yahweh.
- source_word: בְּדֶרֶךְ
  choice: njia
  rationale: ‘Njia’ huhifadhi sitiari ya mwendo au mwenendo wa maisha. Kiswahili hakihitaji kihusishi kabla yake baada ya ‘fundisha’ katika muundo huu.
- source_word: יִבְחָר
  choice: anayopaswa kuichagua
  rationale: Kauli ya kutokamilika inaweza kueleweka kama uchaguzi unaotakiwa, wa sasa, au wa baadaye. Matini kuu inatoa maana ya wajibu inayofaa muktadha wa kufundishwa, huku tanbihi ikihifadhi uwezekano mwingine.
theological_decisions:
- issue: Mtendaji wa “Atamfundisha”
  choice: Yahweh ndiye mtendaji anaye implied na muktadha
  alternative: Mtendaji asiyeainishwa, au mtu huyo kujifundisha mwenyewe
  rationale: Kitenzi hakitaji mtendaji waziwazi, lakini Yahweh ndiye nomino inayotangulia na muktadha wa zaburi unamuonyesha akimwongoza mtu anayemcha. Tafsiri hii inafuata rejeo linalowezekana zaidi bila kulifanya kuwa tamko la ziada.
- issue: Maana ya uchaguzi katika יִבְחָר
  choice: njia anayopaswa kuichagua
  alternative: njia anayochagua, au njia atakayochagua; pia yaweza kueleweka kuwa njia ambayo Yahweh anaichagua
  rationale: Nafsi ya tatu ya kiume umoja haina kiwakilishi kilichotajwa wazi, na hali ya kitenzi inaruhusu vivuli tofauti. Matini kuu hufuata uhusiano wa karibu na mtu anayefundishwa; tanbihi inahifadhi utata halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Kumcha Yahweh” huhifadhi istilahi ya kibiblia ya hofu yenye heshima. Alama ya tanbihi imewekwa baada ya sentensi inayohusika.
