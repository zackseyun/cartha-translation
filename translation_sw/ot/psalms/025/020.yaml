  yaml_path: translation/ot/psalms/025/020.yaml
  text: Guard my life and rescue me; let me not be put to shame, for I take refuge in you.
translation:
  language: sw
  text: Ulinde maisha yangu na uniokoe; nisiaibike, kwa maana nimepata kimbilio kwako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַפְשִׁי
  choice: maisha yangu
  rationale: Katika ombi hili neno נֶפֶשׁ linamaanisha uhai au nafsi ya mtu kwa ujumla; “maisha yangu” ni ya kawaida na ya wazi katika Kiswahili cha sasa.
- source_word: וְהַצִּילֵנִי
  choice: na uniokoe
  rationale: Kitenzi נצל katika hali hii ni ombi la kuondolewa katika hatari, hivyo “uniokoe” linadumisha maana hiyo moja kwa moja.
- source_word: אַל־אֵבוֹשׁ
  choice: usiniache niaibike
  rationale: Muundo huu unaomba asipate aibu kutokana na kushindwa au kuvunjwa matumaini; kauli hii ya Kiswahili ni ya asili bila kubainisha kwa ziada namna ya kuaibishwa.
- source_word: חָסִיתִי בָךְ
  choice: nimekukimbilia wewe
  rationale: Kitenzi חסה hueleza kutafuta usalama au hifadhi kwa mtu; “nimekukimbilia” linaonyesha tendo la kutafuta hifadhi kwa Mungu, huku “wewe” likihifadhi msisitizo wa kiwakilishi.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika ombi la ulinzi
  choice: maisha yangu
  alternative: nafsi yangu
  rationale: Muktadha unahusu kuokolewa na kulindwa kwa mtu mzima, si lazima sehemu isiyo ya mwili; hivyo “maisha yangu” huepuka kuingiza mgawanyo wa kiteolojia ambao maandishi hayalazimishi.
- issue: Aibu kama matokeo ya tumaini lisilotimizwa
  choice: usiniache niaibike
  alternative: nisiaibike
  rationale: “Usiniache” huonyesha ombi linalomwelekea Mungu, lakini halifafanui zaidi ikiwa aibu hiyo inatokana na maadui, kushindwa, au kuvunjwa matumaini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sala ni ya heshima, ya sasa, na rahisi kueleweka. Mstari umehifadhi mtiririko wa maombi matatu na sababu inayofuata.
