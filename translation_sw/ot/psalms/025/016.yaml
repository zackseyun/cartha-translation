  text: פְּנֵה אֵלַ֥/י וְ/חָנֵּ֑/נִי כִּֽי יָחִ֖יד וְ/עָנִ֣י אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/016.yaml
  text: Turn to me and be gracious to me[b][a], for I am lonely and afflicted.
translation:
  language: sw
  text: Unigeukie na unifadhili, kwa maana niko peke yangu[a] na ninateseka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nina upweke.” Neno la Kiebrania יָחִיד linaweza kumaanisha kuwa peke au kuwa na upweke.
    reason: lexical_alternative
  - marker: b
    text: Au, “ni maskini” au “ninaonewa.” Neno la Kiebrania עָנִי linaweza kumaanisha umaskini, kuonewa, au mateso kwa ujumla kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנֵה אֵלַי
  choice: Unigeukie
  rationale: Kauli ya amri pamoja na kihusishi cha mwelekeo inaomba Mungu amwelekee mwombaji na kumpa uangalifu; “unigeukie” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: וְחָנֵּנִי
  choice: na unifadhili
  rationale: Kitenzi חנן kinaomba neema au fadhili isiyostahiliwa. “Unifadhili” huhifadhi wazo la kuonyeshwa fadhili bila kulifanya mahsusi kuwa huruma pekee.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya ombi lililotangulia.
- source_word: יָחִיד
  choice: peke yangu
  rationale: Katika ombolezo neno hili huonyesha hali ya kuwa peke au kutengwa. “Peke yangu” huhifadhi maana ya msingi bila kulazimisha hisia ya upweke.
- source_word: וְעָנִי
  choice: na ninateseka
  rationale: עָנִי linaweza kueleza umaskini, kuonewa, au hali pana ya mateso. Kitenzi “ninateseka” ni cha asili katika sentensi hii na hakifungi maana katika hali ya kiuchumi pekee.
- source_word: אָנִי
  choice: niko / nina-
  rationale: Kiwakilishi huru kinasisitiza hali ya msemaji mwenyewe; katika Kiswahili maana hiyo huwasilishwa kwa nafsi ya kwanza katika “niko” na “ninateseka.”
