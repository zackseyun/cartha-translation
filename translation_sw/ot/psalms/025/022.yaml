  text: Redeem Israel[a], O God, from all his troubles.
translation:
  language: sw
  text: Ee Mungu, ukomboe Israeli kutoka katika taabu zake zote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “taabu zao,” ikiwa “Israeli” hueleweka kama watu wengi badala ya kudumishwa katika umoja wake wa kisarufi.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדֵה
  choice: ukomboe
  rationale: Ni amri ya umoja inayoelekezwa kwa Mungu. Kitenzi “komboa” huhifadhi maana ya kufungua au kuokoa kwa kulipa gharama, pamoja na uzito wake wa kiagano na kitheolojia, kuliko “okoa” peke yake.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Nomino hii imetumiwa kama mwito wa moja kwa moja; “Ee Mungu” ni namna ya kawaida, yenye heshima, ya kuonyesha mwito huo katika Kiswahili.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Hapa jina hilo linamaanisha taifa au watu wa agano kwa ujumla, si babu Yakobo pekee.
- source_word: מִכֹּל
  choice: kutoka katika ... zote
  rationale: Muundo huu unaonyesha ukombozi kutoka kwenye jumla ya taabu; mpangilio huu ni wa asili katika Kiswahili.
- source_word: צָרוֹתָיו
  choice: taabu zake
  rationale: “Taabu” linaweza kujumuisha dhiki, shida na mateso. Kiwakilishi cha umoja “zake” kinahifadhi umbo la Kiebrania linaloitaja Israeli kama jamii moja.
theological_decisions:
- issue: Kiwakilishi cha umoja kwa Israeli kama jina la jamii
  choice: taabu zake
  alternative: taabu zao
  rationale: Kiebrania kina kiambishi cha nafsi ya tatu, umoja wa kiume, huku “Israeli” likiwakilisha watu kwa pamoja. Tafsiri kuu inadumisha umoja wa kisarufi; tanbihi inaonyesha tafsiri ya wingi inayoweka wazi maana ya kijamii bila kuificha tofauti hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ee Mungu” hudumisha mwito wa moja kwa moja; “ukomboe” huhifadhi uzito wa neno la chanzo. Alama ya tanbihi imewekwa mara tu baada ya “Israeli” kama katika safu ya mashauriano.
