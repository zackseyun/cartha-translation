lexical_decisions:
- source_word: גַּם
  choice: Naam
  rationale: Hapa neno hili linatilia mkazo uthibitisho, si kuongeza wazo jingine tu.
- source_word: כָּל קֹוֶיךָ לֹא יֵבֹשׁוּ
  choice: hakuna hata mmoja wa wale wanaokungoja atakayeaibishwa
  rationale: Muundo wa Kiebrania, kihalisi ‘wote wanaokungoja hawataaibishwa,’ umetolewa kwa Kiswahili cha kawaida kama kauli hasi yenye maana ya wote; ‘kungoja’ pia huhifadhi wazo la kutazamia kwa tumaini.
- source_word: יֵבֹשׁוּ / לֹא יֵבֹשׁוּ
  choice: watakaoaibishwa / atakayeaibishwa
  rationale: Kurudia mzizi uleule wa kitenzi kunahifadhi ulinganifu na utofautishaji wa kishairi kati ya mistari miwili.
- source_word: הַבּוֹגְדִים
  choice: wale wanaotenda kwa hila
  rationale: Hili linaonyesha tendo hai la kukosa uaminifu au kusaliti, kama inavyodokezwa na umbo la kishiriki katika Kiebrania.
- source_word: רֵיקָם
  choice: bila sababu
  rationale: Katika muktadha huu neno linaweza kueleza hila isiyo na sababu ya haki, ingawa pia linaweza kumaanisha ‘bure’ au ‘bila mafanikio.’
