lexical_decisions:
- source_word: צָרוֹת
  choice: Taabu
  rationale: Neno hili hutaja shida, mateso, au hali zinazosababisha huzuni; “taabu” ni Kiswahili cha kawaida na chenye hadhi, na linatofautishwa kwa kiasi na “dhiki” katika mstari wa pili.
- source_word: לְבָבִי
  choice: za moyo wangu
  rationale: “Moyo” huhifadhi taswira ya Kiebrania ya utu wa ndani, ikijumuisha hisia na mawazo.
- source_word: הִרְחִיבוּ
  choice: zimeongezeka
  rationale: Kitenzi kihalisi huhusu kupanuka au kuwa pana; taabu zikiwa kiima, “zimeongezeka” hutoa maana ya muktadha kwa Kiswahili cha kawaida bila kupoteza wazo la kuenea.
- source_word: מִמְּצוּקוֹתַי
  choice: katika dhiki zangu
  rationale: Nomino hii huonyesha hali za kubanwa au dhiki. “Katika dhiki zangu” huendana na kitenzi cha kutolewa na kuhifadhi wingi.
- source_word: הוֹצִיאֵנִי
  choice: unitoe
  rationale: Hii ni ombi la kusababishwa kutoka nje; “unitoe” huhifadhi taswira halisi ya kuokolewa kutoka hali ya kubanwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inadumisha usambamba wa “taabu” na “dhiki,” huku tanbihi ikihifadhi kwa uwazi taswira ya Kiebrania ya kupanuka na kubanwa.
