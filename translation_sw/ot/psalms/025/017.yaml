base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/017.yaml
  text: The troubles of my heart have multiplied[b][a]; bring me out of my distresses.
translation:
  language: sw
  text: Taabu za moyo wangu zimeongezeka; unitoe katika dhiki zangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Taabu za moyo wangu zimepanuka; unitoe katika mibano yangu.”
