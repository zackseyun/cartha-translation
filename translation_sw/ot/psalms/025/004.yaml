translation:
  language: sw
  text: Njia zako, Ee Yahweh, nijulishe[a]; nifundishe mapito yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “unifanye nijue”; kwa desturi, “nionyeshe.”'
