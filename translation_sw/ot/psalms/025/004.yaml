lexical_decisions:
- source_word: דְּרָכֶיךָ
  choice: njia zako
  rationale: Neno דֶּרֶךְ humaanisha njia au barabara, na kishairi linaweza kumaanisha mwenendo au namna ya kutenda. “Njia zako” inadumisha sitiari ya Kiebrania bila kuifasiri kwa upana usio lazima.
- source_word: יְהוָה
  choice: Ee Yahweh
  rationale: Jina la Mungu limewasilishwa moja kwa moja kama “Yahweh”; kihisishi “Ee” kinaonyesha mwito wa moja kwa moja kwa Kiswahili cha kawaida na chenye heshima.
- source_word: הוֹדִיעֵנִי
  choice: nijulishe
  rationale: Hifili ya ידע ina maana ya kisababishi, “nifanye nijue” au “nijulishe.” “Nijulishe” ni ya asili katika Kiswahili na inahifadhi maana hiyo vizuri kuliko tafsiri pana zaidi ya “nionyeshe.”
- source_word: אֹרְחוֹתֶיךָ
  choice: mapito yako
  rationale: אֹרַח ni njia au pito. “Mapito” yanatofautisha neno hili na דֶּרֶךְ huku yakidumisha usambamba wa kishairi.
- source_word: לַמְּדֵנִי
  choice: nifundishe
  rationale: Pieli ya kuamuru ya למד pamoja na kiambishi cha nafsi ya kwanza ina maana ya moja kwa moja “nifundishe.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Ee Yahweh
  alternative: Ee BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, si cheo. “Yahweh” hulihifadhi jina hilo, na “Ee” huwasilisha mwito wa moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Usambamba wa kishairi umehifadhiwa kwa “njia” na “mapito,” huku kauli ya kisababishi ikitafsiriwa kwa “nijulishe.”
