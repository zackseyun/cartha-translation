lexical_decisions:
- source_word: יַדְרֵךְ
  choice: Huwaongoza
  rationale: Hifili ya דרך ina maana ya kuongoza au kumfanya mtu aifuate njia. ‘Huwaongoza’ ni Kiswahili cha kawaida na hudumisha maana ya uongozi wa Mungu.
- source_word: עֲנָוִים
  choice: wanyenyekevu
  rationale: Neno hili linaweza kumaanisha wanyenyekevu, wapole, walio chini, au wanaoteseka. Katika muktadha wa kufundishwa na Mungu, ‘wanyenyekevu’ linaeleza vyema hali ya kuwa tayari kuongozwa; marudio yake yamedumishwa.
- source_word: בַּמִּשְׁפָּט
  choice: katika yaliyo ya haki
  rationale: מִשְׁפָּט inaweza kumaanisha hukumu, haki, au jambo lililo sawa. Hapa kirai kinaonyesha kiwango au eneo la uongozi wa Mungu; ‘katika yaliyo ya haki’ ni cha asili na hakifungi maana kwenye hukumu ya mahakama pekee.
- source_word: וִילַמֵּד
  choice: na huwafundisha
  rationale: Pieli ya למד humaanisha kufundisha. Kiunganishi na hali ya kauli inayolingana na mstari wa kwanza vimetolewa kwa ‘na huwafundisha.’
- source_word: דַּרְכּוֹ
  choice: njia yake
  rationale: Nomino ni umoja yenye kiambishi cha nafsi ya tatu ya kiume; ‘njia yake’ ni tafsiri ya moja kwa moja na inafaa kwa maana ya mwenendo au mapenzi ya Mungu.
theological_decisions:
- issue: Maana ya עֲנָוִים kuhusu wale wanaopokea uongozi na mafundisho ya Mungu
  choice: wanyenyekevu
  alternative: wapole; walio chini; wanaoteseka
  rationale: Muktadha wa zaburi unahusu watu wanaokubali kufundishwa na Mungu. ‘Wanyenyekevu’ hudumisha mwelekeo huo wa kiroho na kimaadili bila kukana kwamba neno la Kiebrania linaweza pia kuwahusu walio chini au wanaoteseka.
- issue: Maana ya בַּמִּשְׁפָּט kama kiwango au eneo la uongozi wa Mungu
  choice: katika yaliyo ya haki
  alternative: katika hukumu; katika lililo sawa
  rationale: Tafsiri hii inahifadhi wazo la haki na usahihi bila kuamua kwamba מדובר ni hukumu rasmi ya kisheria pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo sambamba na marudio ya ‘wanyenyekevu’ yamedumishwa. Mpangilio wa alama [b][a] umefuata maneno yanayohusika moja kwa moja katika maandishi.
