  text: כָּל אָרְח֣וֹת יְ֭הוָה חֶ֣סֶד וֶ/אֱמֶ֑ת לְ/נֹצְרֵ֥י בְ֝רִית֗/וֹ וְ/עֵדֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/010.yaml
  text: All the paths of Yahweh are steadfast love and faithfulness to those who keep his covenant and his testimonies[a][b].
translation:
  language: sw
  text: Njia zote za Yahwe ni upendo thabiti na uaminifu kwa wale wanaolishika agano lake na shuhuda zake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kweli” badala ya “uaminifu.” Katika jozi hii ya kiagano, neno la Kiebrania mara nyingi humaanisha uaminifu wa kutegemeka, si kweli ya kinadharia tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: zote
  rationale: Huonyesha ujumla wa njia za Yahwe na kwa kawaida huandamana na nomino ya wingi katika Kiswahili.
- source_word: אָרְחוֹת
  choice: njia
  rationale: Huhifadhi taswira ya njia huku ikiwa usemi wa kawaida wa Kiswahili unaoweza pia kumaanisha mwenendo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni unukuzi wa kawaida wa Kiswahili wa jina la Mungu katika tetragramatoni, badala ya kulibadili kuwa cheo.
- source_word: חֶסֶד
  choice: upendo thabiti
  rationale: Huwasilisha upendo wenye kudumu na uaminifu wa kiagano bila kuufupisha kuwa rehema pekee.
- source_word: אֱמֶת
  choice: uaminifu
  rationale: Katika jozi חֶסֶד וֶאֱמֶת, neno hilo hasa hudokeza kutegemeka na uaminifu; maana mbadala ya 'kweli' imehifadhiwa katika tanbihi.
- source_word: לְנֹצְרֵי
  choice: kwa wale wanaolishika
  rationale: Kihusishi לְ kinaonyeshwa kwa 'kwa', na kitenzi נצר kina maana ya kutunza au kushika kwa uangalifu.
- source_word: בְּרִיתוֹ
  choice: agano lake
  rationale: Hili ndilo neno la kawaida na lenye hadhi kwa בְּרִית katika muktadha wa kibiblia.
- source_word: וְעֵדֹתָיו
  choice: na mashuhuda yake
  rationale: Huhifadhi kwa ukaribu maana rasmi ya עֵדוֹת kama matamko ya Mungu yanayoshuhudia mapenzi na matakwa yake, bila kuyafasiri moja kwa moja kuwa amri au masharti.
theological_decisions:
- issue: 'Uhusiano wa kiarifu katika kishazi kisicho na kitenzi: njia zote za Yahwe ni חֶסֶד וֶאֱמֶת'
  choice: Njia za Yahwe zinaelezwa kuwa upendo thabiti na uaminifu kwa wale wanaolishika agano lake na mashuhuda yake.
  alternative: Njia za Yahwe huongoza kwenye upendo thabiti na uaminifu; au njia zake ni za rehema na kweli kwa maana ya jumla.
  rationale: Muundo wa Kiebrania unaelekea kuyafanya 'upendo thabiti na uaminifu' kuwa kiarifu cha 'njia zote za Yahwe.' Kirai kinachofuata kinataja wanaohusishwa na sifa hizo bila kueleza zaidi uhusiano kati ya tabia ya Mungu na utii wa binadamu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. 'Upendo thabiti' huhifadhi uzito wa kiagano wa חֶסֶד; 'mashuhuda' ni chaguo rasmi linalohifadhi istilahi tofauti na 'amri.'
