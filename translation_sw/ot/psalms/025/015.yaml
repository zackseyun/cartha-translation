  yaml_path: translation/ot/psalms/025/015.yaml
  text: My eyes are continually toward Yahweh[a], for he will bring my feet out of the net.
translation:
  language: sw
  text: 'Macho yangu daima yameelekezwa kwa Yahwe,

    kwa maana yeye atazitoa miguu yangu kutoka katika wavu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ataiondoa miguu yangu katika wavu.” Kitenzi cha Kiebrania kwa maana halisi ni “atazitoa,” na hivyo kinadumisha taswira ya kuokolewa kutoka katika kitu kilichoinasa miguu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַי
  choice: Macho yangu
  rationale: Inahifadhi wingi halisi na taswira ya mwili iliyo katika Kiebrania, badala ya kuitafsiri kwa maana pana kama ‘mtazamo wangu.’
- source_word: תָּמִיד אֶל
  choice: daima yanamwelekea
  rationale: ‘Daima’ linaonyesha uelekeo unaoendelea, na ‘yanamwelekea’ linaeleza kwa Kiswahili cha kawaida kwamba macho yameelekezwa kwa Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: כִּי הוּא
  choice: kwa maana yeye
  rationale: ‘Kwa maana’ linaonyesha sababu ya kumwelekea Yahwe; kiwakilishi huru ‘yeye’ kinadumisha msisitizo uliopo katika Kiebrania.
- source_word: יוֹצִיא
  choice: ataitoa
  rationale: Kitenzi hiki ni cha kisababishi na maana yake ya msingi ni ‘atasababisha itoke/ataitoa’; uchaguzi huu unahifadhi tendo halisi la kuondoa kitu kilichonaswa.
- source_word: מֵרֶשֶׁת רַגְלָי
  choice: miguu yangu kutoka wavuni
  rationale: ‘Miguu yangu’ inahifadhi taswira ya mwili, na ‘wavu’ ndiyo maana ya moja kwa moja ya רֶשֶׁת, hivyo sitiari ya kunaswa na kuokolewa inadumu.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu moja kwa moja; ‘Yahwe’ linahifadhi jina hilo bila kulibadili kuwa cheo.
- issue: Uhakika wa tendo la wakati ujao katika יוֹצִיא
  choice: ataitoa
  alternative: aiondoe au anaweza kuitoa
  rationale: Muktadha wa zaburi unaonyesha tumaini lenye uhakika kwamba Mungu atamwokoa mwandishi; hali ya kitenzi imetafsiriwa kama tendo la wakati ujao bila kuongeza masharti yasiyopo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa mistari unafuata sehemu mbili za shairi la Kiebrania, huku taswira halisi ya macho, miguu, na wavu ikihifadhiwa.
