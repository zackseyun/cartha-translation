  text: חַטֹּ֤אות נְעוּרַ֨/י וּ/פְשָׁעַ֗/י אַל תִּ֫זְכֹּ֥ר כְּ/חַסְדְּ/ךָ֥ זְכָר לִ/י אַ֑תָּה לְמַ֖עַן טוּבְ/ךָ֣ יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/007.yaml
  text: Do not remember the sins of my youth or my transgressions[a]; according to your steadfast love, remember me—for the sake of your goodness[b], O Yahweh.
translation:
  language: sw
  text: Usiyakumbuke dhambi za ujana wangu wala maasi yangu; kwa kadiri ya upendo wako wa uaminifu unikumbuke, kwa ajili ya wema wako, Ee Yahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַטֹּאות נְעוּרַי
  choice: dhambi za ujana wangu
  rationale: Kirai hiki kinaonyesha matendo mahususi ya dhambi yanayohusishwa na ujana wa mwombaji; tafsiri hii ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: וּפְשָׁעַי
  choice: wala makosa yangu
  rationale: Katika muundo hasi wa Kiswahili, “wala” huunganisha kwa kawaida kitu cha pili kisichopaswa kukumbukwa. “Makosa” hapa hubeba maana ya kuvunja au kuasi, ingawa ni neno linaloeleweka kwa urahisi.
- source_word: אַל תִּזְכֹּר
  choice: Usiyakumbuke
  rationale: Hili ni ombi hasi kwa Mungu; kiambishi “-ya-” kinarejelea kwa pamoja dhambi na makosa yaliyotajwa.
- source_word: כְּחַסְדְּךָ
  choice: kwa kadiri ya upendo wako thabiti
  rationale: כְ inaonyesha kipimo au msingi wa tendo linaloombwa, huku חסד ikijumuisha upendo wenye uaminifu na kudumu.
- source_word: זְכָר לִי אַתָּה
  choice: unikumbuke
  rationale: Amri hii chanya inatofautisha kukumbukwa kwa mwombaji na kukumbukwa kwa dhambi zake. Kiswahili huwasilisha kwa asili mhusika na mtendwa ndani ya kitenzi.
- source_word: לְמַעַן טוּבְךָ
  choice: kwa ajili ya wema wako
  rationale: Tafsiri hii inadumisha wazo kwamba wema wa Mungu mwenyewe ndio msingi au sababu ya ombi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa kwa umbo lililozoeleka katika tahajia ya Kiswahili badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Maana pana ya חסד
  choice: upendo wako thabiti
  alternative: rehema yako; upendo wako wa agano
  rationale: “Upendo thabiti” huhifadhi kwa kiasi kikubwa vipengele vya upendo, uaminifu, na kudumu bila kulifungia neno katika huruma pekee au kulifanya “agano” kuwa wazi zaidi kuliko mstari wenyewe.
- issue: Kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Nakala ya Kiebrania ina jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina na kutumia tahajia ya kawaida ya Kiswahili.
- issue: Tofauti kati ya kukumbuka dhambi na kumkumbuka mwombaji
  choice: Usiyakumbuke ... unikumbuke
  alternative: Usiyatie maanani ... unifikirie kwa fadhili
  rationale: Kurudia mzizi wa “kumbuka” kunadumisha ulinganifu wa makusudi wa Kiebrania bila kuongeza waziwazi neno “kwa fadhili,” ingawa muktadha hulidokeza.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa Kiebrania wa ombi hasi kisha ombi chanya umehifadhiwa. Hakuna tanbihi iliyohitajika, kwa kuwa “wala” ni uunganishi wa kawaida wa Kiswahili katika sentensi hasi na mbadala wa חסד umeelezwa katika maamuzi ya kileksika.
