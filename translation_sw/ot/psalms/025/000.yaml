base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/000.yaml
  text: Of David. To you[a], Yahweh, I lift up my soul.
translation:
  language: sw
  text: 'Ya Daudi.


    Ee Yahweh, kwako nainua nafsi yangu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maisha yangu” au “mimi mwenyewe.” Neno la Kiebrania linalotafsiriwa “nafsi” linaweza kumaanisha mtu mzima, si sehemu yake isiyo ya mwili tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Kichwa hiki kinaweza kuonyesha uhusiano wa zaburi na Daudi bila kulazimisha maana maalumu zaidi kama vile uandishi wake.
- source_word: יְהוָה
  choice: YAHWE
  rationale: Jina la agano la Mungu limetoholewa moja kwa moja kwa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: Huhifadhi taswira ya Kiebrania na pia upana wake wa kimaana; hapa linaweza kumaanisha mtu mwenyewe au maisha yake yote.
- source_word: אֶשָּׂא
  choice: nainua
  rationale: Huhifadhi sitiari ya Kiebrania ya kumwelekeza Mungu nafsi, maisha, au mtu mzima katika tumaini na utegemezi.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika kauli ya kumwinulia Mungu
  choice: nafsi yangu
  alternative: maisha yangu; mimi mwenyewe
  rationale: Tafsiri kuu inadumisha taswira ya asili bila kuifanya nafsi iwe tu sehemu isiyo ya mwili; tanbihi inaonyesha kwamba neno hilo linaweza kumaanisha mtu mzima au maisha yake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. “Ee” limetumiwa kuonyesha mwito wa moja kwa moja kwa YAHWE, na mpangilio “kwako nainua” unahifadhi msisitizo wa mwanzo wa Kiebrania.
