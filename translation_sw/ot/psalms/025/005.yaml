base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/005.yaml
  text: Lead me in your truth and teach me[a], for you are the God of my salvation[b]; for you I wait all day long.
translation:
  language: sw
  text: Uniongoze katika kweli yako na unifundishe,[a] kwa maana wewe ndiwe Mungu wa wokovu wangu; wewe ninakungoja mchana kutwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uniongoze kwa uaminifu wako na unifundishe,” kwa kuwa neno la Kiebrania linaweza kumaanisha “kweli” au “uaminifu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wewe ninakutumainia mchana kutwa.” Kitenzi cha Kiebrania kina maana ya kungoja kwa tumaini au matarajio.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדְרִיכֵנִי
  choice: Uniongoze
  rationale: Hifili ya דרך inaomba Mungu amwelekeze mwombaji katika njia; “uniongoze” ni ya kawaida na huhifadhi taswira ya mwendo.
- source_word: בַאֲמִתֶּךָ
  choice: katika kweli yako
  rationale: אֱמֶת inaweza kumaanisha kweli, kutegemeka, au uaminifu. Katika muktadha wa kuongozwa na kufundishwa, “katika kweli yako” hufaa kama eneo au kiwango cha mwongozo.
- source_word: וְלַמְּדֵנִי
  choice: na unifundishe
  rationale: Pieli ya למד humaanisha kufundisha; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa msingi wa ombi lililotangulia.
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: Mungu wa wokovu wangu
  rationale: Muundo huu huhifadhi kirai cha Kiebrania na kumtambulisha Mungu kuwa chanzo cha wokovu au ukombozi wa mwombaji.
- source_word: קִוִּיתִי
  choice: ninakungoja
  rationale: קוה huunganisha kungoja na tumaini au matarajio. “Ninakungoja” huhifadhi picha halisi ya kungoja, huku kidokezo kikieleza matarajio yaliyomo.
- source_word: אוֹתְךָ
  choice: wewe
  rationale: Pamoja na קוה, kiwakilishi hiki ni yule anayengojewa. Mpangilio “wewe ninakungoja” ni wa asili na pia huonyesha mkazo uliopo kwa kuwekwa kwa kiwakilishi mbele.
- source_word: כָּל הַיּוֹם
  choice: mchana kutwa
  rationale: Nahau hii ya kawaida ya Kiswahili hueleza kipindi chote cha siku na huhifadhi maana ya kudumu.
theological_decisions:
- issue: Maana ya אֱמֶת katika mwongozo wa Mungu
  choice: kweli yako
  alternative: uaminifu wako
  rationale: Kuongozwa na kufundishwa kunafanya “kweli” ifae kama maudhui au kiwango cha mwongozo. Hata hivyo, neno la Kiebrania linaweza pia kueleza uaminifu wa Mungu, kwa hiyo maana hiyo imehifadhiwa katika kidokezo.
- issue: Kidokezo cha קוה
  choice: ninakungoja
  alternative: ninakutumainia / ninakungoja kwa matarajio
  rationale: Kitenzi kina maana ya kungoja kwa tumaini. Maandishi makuu yanahifadhi taswira ya kungoja bila kuondoa maana ya matarajio, ambayo imeelezwa katika kidokezo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. Mpangilio “wewe ninakungoja” huhifadhi mkazo wa Kiebrania; “mchana kutwa” ni nahau ya kawaida yenye maana ya siku nzima.
