  yaml_path: translation/ot/psalms/025/013.yaml
  text: His soul will dwell in goodness[b][a], and his offspring will inherit the land.
translation:
  language: sw
  text: 'Nafsi yake itakaa katika hali njema[b],

    na uzao wake utairithi nchi[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dunia.” Neno la Kiebrania אֶרֶץ linaweza kumaanisha “nchi” au “dunia”; hapa “nchi” inafaa zaidi kwa maana ya agano kuhusu kuirithi.
    reason: alternative_reading
  - marker: b
    text: Au, “italala mahali” au “italaza usiku.” Kitenzi cha Kiebrania huleta picha ya kulala mahali au kulaza usiku; hapa kinaweza kuashiria kubaki au kukaa katika hali njema.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשׁוֹ
  choice: nafsi yake
  rationale: Huhifadhi usemi wa kishairi wa Kiebrania, ambapo נֶפֶשׁ inaweza kumaanisha nafsi, mtu mwenyewe, au uhai, bila kuufupisha kuwa ‘yeye’.
- source_word: בְּטוֹב
  choice: katika mema
  rationale: טוֹב ina upana wa maana unaojumuisha mema, hali njema, ustawi, na wema; ‘katika mema’ huhifadhi upana huo kuliko ‘katika mafanikio’.
- source_word: תָלִין
  choice: itakaa
  rationale: לון kimsingi huleta picha ya kulala au kukaa mahali kwa usiku, lakini hapa kwa ushairi inaashiria kuendelea kukaa katika hali njema. ‘Itakaa’ ni ya kawaida na huhifadhi wazo la kudumu.
- source_word: וְזַרְעוֹ
  choice: na uzao wake
  rationale: זֶרַע hapa humaanisha watoto au vizazi vya mtu. ‘Uzao wake’ ni usemi mfupi wa kibiblia unaoeleweka na huhifadhi umoja wa neno la chanzo.
- source_word: יִירַשׁ
  choice: utairithi
  rationale: ירשׁ inaweza kumaanisha kurithi au kumiliki; ‘utairithi’ inafaa muktadha wa lugha ya agano na kupokea nchi.
- source_word: אָרֶץ
  choice: nchi
  rationale: אֶרֶץ inaweza kumaanisha nchi au dunia. Pamoja na ירשׁ, ‘nchi’ inaendana vyema na mwangwi wa ahadi ya agano, huku maana pana ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Upeo wa אָרֶץ pamoja na יִירַשׁ
  choice: nchi
  alternative: dunia
  rationale: Usemi huu huenda una mwangwi wa lugha ya agano kuhusu kuirithi nchi, badala ya kudai moja kwa moja kumiliki dunia yote. Maana pana zaidi imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa mistari umehifadhi ulinganifu wa kishairi. ‘Nafsi’ na ‘uzao’ huhifadhi msamiati wa kibiblia bila kuwa wa kale kupita kiasi.
