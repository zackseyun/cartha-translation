id: PSA.25.8
reference: Psalms 25:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: טוֹב וְ/יָשָׁ֥ר יְהוָ֑ה עַל כֵּ֤ן יוֹרֶ֖ה חַטָּאִ֣ים בַּ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/008.yaml
  text: Good and upright is Yahweh[a]; therefore he instructs sinners in the way.
translation:
  language: sw
  text: Yahwe ni mwema na mnyofu; kwa hiyo huwafundisha[a] wenye dhambi katika njia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “huwaelekeza.” Kitenzi hiki kinaweza kumaanisha “kufundisha,” “kuelekeza,” au “kuonyesha njia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: mwema
  rationale: Katika muktadha huu neno linaonyesha wema wa kimaadili wa Yahwe; “mwema” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: וְיָשָׁר
  choice: na mnyofu
  rationale: “Mnyofu” linaonyesha unyofu wa kimaadili na linaendana vizuri na “mwema” bila kulifanya neno limaanishe tu kuwa sawa au kunyooka kimwili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa umbo linalofaa matamshi na tahajia ya Kiswahili, badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: עַל כֵּן
  choice: kwa hiyo
  rationale: 'Kirai hiki kinaonyesha matokeo ya kimantiki: kwa sababu Yahwe ni mwema na mnyofu, anawafundisha wenye dhambi.'
- source_word: יוֹרֶה
  choice: huwafundisha
  rationale: Kitenzi hiki katika Hifili kinaweza kumaanisha kufundisha, kuelekeza, au kuonyesha njia. “Huwafundisha” ni cha asili katika Kiswahili na kinadumisha maana ya kutoa maelekezo.
- source_word: חַטָּאִים
  choice: wenye dhambi
  rationale: Kirai hiki kinataja wazi watu walio na dhambi bila kupunguza uzito wa kimaadili wa neno la Kiebrania.
- source_word: בַּדָּרֶךְ
  choice: katika njia
  rationale: Tafsiri hii inadumisha sitiari ya njia bila kuongeza neno “sahihi,” ambalo halipo wazi katika Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: “Yahwe” linadumisha jina binafsi la Mungu katika umbo la kawaida kwa Kiswahili, badala ya kulibadilisha kuwa cheo.
- issue: Maana ya בַּדָּרֶךְ
  choice: katika njia
  alternative: katika njia iliyo sawa au njia wanayopaswa kuifuata
  rationale: Kiebrania hakitaji wazi kwamba ni “njia iliyo sawa,” ingawa muktadha unaashiria hivyo. Tafsiri inadumisha sitiari na kutoweka ufafanuzi usioandikwa.
- issue: Uhusiano kati ya wema wa Yahwe na kuwafundisha wenye dhambi
  choice: kwa hiyo
  alternative: kwa sababu hiyo
  rationale: 'Kiunganishi kinadumisha mvutano wa kiteolojia wa mstari: wema na unyofu wa Yahwe ndio msingi wa kuwapa wenye dhambi mafundisho, si sababu ya kuwaacha.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa kishairi umehifadhiwa kwa sentensi fupi yenye sehemu mbili; alama ya nukta mkato inaonyesha uhusiano wa wazo la pili na la kwanza.
