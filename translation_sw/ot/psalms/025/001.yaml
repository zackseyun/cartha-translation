  text: לְ/דָוִ֡ד אֵלֶ֥י/ךָ יְ֝הוָ֗ה נַפְשִׁ֥/י אֶשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/001.yaml
  text: Of David. To you[a], O Yahweh, I lift up my soul.
translation:
  language: sw
  text: 'Ya Daudi.


    Kwako, ee Yahwe, nainua nafsi yangu[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uhai wangu” au “mimi mwenyewe”; neno la Kiebrania linalotafsiriwa “nafsi” (nefesh) linaweza kumaanisha mtu mzima, si sehemu yake isiyo ya kimwili pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Kihusishi לְ katika kichwa cha zaburi kinaonyesha uhusiano na Daudi bila kubainisha kwa lazima kama yeye ndiye mwandishi, aliandikiwa, au zaburi inahusishwa naye. “Ya Daudi” ni fupi na huhifadhi uwazi huo kuliko “iliyoandikwa na Daudi.”
- source_word: אֵלֶיךָ
  choice: Kwako
  rationale: אֶל pamoja na kiambishi cha nafsi ya pili umoja humaanisha “kwako.” Kuwekwa mwanzoni kunadumisha msisitizo na mpangilio wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo kama “BWANA,” hivyo kuhifadhi jina la agano lililo katika matini ya Kiebrania.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: נֶפֶשׁ inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. “Nafsi yangu” huhifadhi sitiari na uzito wa ibada wa Kiebrania, huku tanbihi ikieleza upana wa maana.
- source_word: אֶשָּׂא
  choice: nainua
  rationale: Kitenzi נָשָׂא hapa ni Qal, nafsi ya kwanza umoja, chenye maana ya kuinua. “Nainua nafsi yangu” huhifadhi sitiari ya kuelekeza nafsi yote kwa Mungu.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini inatumia jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi kama jina na kuepuka kulibadilisha kimya kimya kuwa “BWANA.”
- issue: Maana ya נַפְשִׁי katika sala
  choice: nafsi yangu
  alternative: uhai wangu; mimi mwenyewe
  rationale: Kiebrania kinaweza kurejelea mtu mzima au uhai wake, si sehemu isiyo ya kimwili pekee. Tafsiri kuu huhifadhi nahau ya chanzo, na tanbihi huhifadhi upana wake bila kuamua maana moja kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi bila kutumia lugha ya kizamani. “Ee” hutambulisha mwito wa moja kwa moja, na mpangilio “Kwako … nainua” huhifadhi msisitizo wa chanzo.
