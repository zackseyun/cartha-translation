  source_fidelity: “Ya Daudi” appropriately preserves the deliberately broad Davidic association signaled by לְדָוִד. “Kwako, ee Yahwe” accurately renders the fronted prepositional phrase and direct address to יהוה, while “nainua nafsi yangu” faithfully retains the Hebrew idiom אֶשָּׂא נַפְשִׁי. No source ambiguity has been unnecessarily resolved.
  naturalness: The wording is clear, idiomatic Standard East African Swahili, and appropriately concise and elevated for a psalm heading and prayer. The fronting of “Kwako” naturally conveys the source emphasis. “Ee” is a suitable direct-address form in this register.
  terminology: “Yahwe” consistently represents the divine name as a name rather than substituting a title. “Nafsi yangu” is a faithful formal rendering of נַפְשִׁי, and the footnote correctly alerts readers that nefesh can refer to the whole person or life, not solely an immaterial component.
