  yaml_path: translation/ot/psalms/025/002.yaml
  text: My God[a], in you I trust; do not let me be put to shame[b]; do not let my enemies exult over me.
translation:
  language: sw
  text: Mungu wangu, ninakutumaini; usiniache nione aibu[a]; usiwaache adui zangu waninishangilie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nifedheheke.” Kitenzi cha Kiebrania kinaweza kumaanisha kuona aibu moyoni au kuaibishwa hadharani.
    reason: lexical_alternative
  - marker: b
    text: Au “wajisifu juu yangu” au “wafurahi kwa sababu yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Nomino yenye kiambishi cha nafsi ya kwanza umoja humaanisha “Mungu wangu” na hapa ni mwito wa moja kwa moja.
- source_word: בְּךָ בָטַחְתִּי
  choice: ninakutumaini
  rationale: Kitenzi katika kauli timilifu kinaweza kueleza hali thabiti ya sasa iliyojengwa juu ya tendo lililokwisha kuanza; Kiswahili cha sasa kinaonyesha utegemezi unaoendelea kwa Mungu.
- source_word: אַל אֵבוֹשָׁה
  choice: usiniache nitaaibike
  rationale: Ombi hasi linawekwa kwa Kiswahili cha kawaida; “aibike” linaweza kuhusisha hisia ya aibu na pia kufedheheshwa hadharani, hivyo utata wa Kiebrania unadumishwa.
- source_word: אַל יַעַלְצוּ אֹיְבַי לִי
  choice: usiwaache adui zangu wanifurahie kwa ushindi
  rationale: עלץ huonyesha furaha kubwa ya kujigamba; katika muktadha wa maadui, msemo huu unaonyesha kushangilia kwao kwa sababu ya kumshinda au kumwaibisha mwombaji.
theological_decisions:
- issue: Ombi la mtunga zaburi kuhusu aibu
  choice: usiniache nitaaibike
  alternative: usiniache nifedheheke
  rationale: “Nitaaibike” hudumisha uwezekano wa aibu ya ndani na fedheha ya hadharani, bila kuifanya aya ihusu hisia binafsi pekee au hukumu ya hadharani pekee.
- issue: Furaha ya maadui juu ya mwombaji
  choice: wanifurahie kwa ushindi
  alternative: washangilie juu yangu
  rationale: Chaguo hili linaonyesha furaha ya maadui inayotokana na ushindi dhidi yake, lakini tanbihi huhifadhi maana pana ya kushangilia au kujigamba juu yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini cha sasa na kinachoeleweka kwa urahisi. Muundo wa sala umehifadhiwa, pamoja na urudiaji wa maombi hasi.
