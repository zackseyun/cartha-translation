lexical_decisions:
- source_word: עַד
  choice: mpaka
  rationale: Huonyesha kikomo cha kiapo kilichoanza katika mstari uliotangulia.
- source_word: אֶמְצָא
  choice: nitakapompata ... mahali
  rationale: Kitenzi hiki ni qal imperfect nafsi ya kwanza umoja; pamoja na 'mpaka' kinaonyesha tendo la baadaye. Muundo huu wa Kiswahili huwasilisha kwa kawaida wazo la kupata mahali panapomfaa mtu.
- source_word: מָקוֹם
  choice: mahali
  rationale: Neno hili humaanisha mahali au eneo, bila kulibainisha kuwa patakatifu au aina fulani ya jengo.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Kiambishi ל kinaonyesha kwamba mahali hapo panakusudiwa Yahweh; jina la agano יהוה limetoholewa kuwa 'Yahweh' badala ya kubadilishwa kuwa cheo.
- source_word: מִשְׁכָּנוֹת
  choice: makao
  rationale: Uwingi wa nomino ya Kiebrania umehifadhiwa. 'Makao' ni neno la sasa na lenye heshima, lisilolazimisha maana maalumu ya hema takatifu.
- source_word: לַאֲבִיר
  choice: kwa Mwenye Nguvu
  rationale: אביר ni cheo kinachomaanisha mwenye nguvu au mwenye uweza; 'Mwenye Nguvu' ni wazi na cha heshima.
- source_word: יַעֲקֹב
  choice: wa Yakobo
  rationale: Muundo tegemezi wa Kiebrania umeonyeshwa kwa 'wa Yakobo'.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano יהוה. 'Yahweh' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Umoja au uwingi wa מִשְׁכָּנוֹת
  choice: makao (wingi)
  alternative: akao; mahali pa kukaa; maskani
  rationale: Nomino ya Kiebrania ina umbo la wingi. Ingawa muktadha unaweza kueleweka kuwa makao moja, tafsiri kuu inahifadhi mvutano huo wa kisarufi badala ya kuusawazisha kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo 'nitakapompata Yahweh mahali' ni wa kawaida kuliko tafsiri ya neno kwa neno 'nitakapopata mahali kwa Yahweh,' huku ukihifadhi maana ya kutafuta mahali panapokusudiwa yeye. Uwingi 'makao' umehifadhiwa na kufafanuliwa kwa tanbihi.
