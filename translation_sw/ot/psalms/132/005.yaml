  text: mpaka nipate mahali kwa ajili ya Yahweh, makao[a] kwa ajili ya Mwenye Nguvu wa Yakobo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali pa kukaa”; kwa mapokeo, “maskani.” Nomino ya Kiebrania iko katika wingi.
