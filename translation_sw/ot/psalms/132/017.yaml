base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/017.yaml
  text: There I will cause a horn to sprout for David[b][a]; I have prepared a lamp for my anointed one.
translation:
  language: sw
  text: Huko nitachipusha pembe kwa ajili ya Daudi[a]; nimeandaa taa kwa ajili ya mtiwa mafuta wangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitakuza pembe kwa ajili ya Daudi.” “Pembe” ni taswira ya Kiebrania inayomaanisha nguvu au mamlaka ya kifalme.
    reason: lexical_alternative
  - marker: b
    text: Au, “Masihi wangu.” Kiebrania kinasema “mtiwa mafuta wangu”; hapa kwanza kinamrejelea mfalme wa ukoo wa Daudi, lakini kinaweza pia kuwa na mwangwi mpana wa kimasihi.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Huko
  rationale: Kielezi hiki kinarejelea Sayuni/Yerusalemu katika muktadha wa karibu na kuhifadhi msisitizo wa mahali.
- source_word: אַצְמִיחַ
  choice: nitachipusha
  rationale: Kauli ya kusababisha ya kitenzi צמח ina maana ya kusababisha kitu kichipuke au kimee; “nitachipusha” huhifadhi taswira ya ukuaji.
- source_word: קֶרֶן
  choice: pembe
  rationale: Maana halisi ni “pembe,” taswira ya Kiebrania ya nguvu au mamlaka ya kifalme; taswira yenyewe imehifadhiwa katika matini.
- source_word: לְדָוִד
  choice: kwa ajili ya Daudi
  rationale: Huhifadhi uhusiano unaoonyeshwa na kihusishi ל bila kuongeza moja kwa moja wazo la ukoo wa Daudi.
- source_word: עָרַכְתִּי
  choice: nimemwandalia
  rationale: Kitenzi ערך hapa kina maana ya kutayarisha au kuandaa. Muundo huu ni wa kawaida katika Kiswahili pamoja na kitu kilichoandaliwa kwa ajili ya mtu.
- source_word: נֵר
  choice: taa
  rationale: Hili ndilo neno halisi, huku taswira yake ya mwendelezo wa ufalme au utawala ikiachwa isimame katika muktadha.
- source_word: לִמְשִׁיחִי
  choice: mtiwa-mafuta wangu
  rationale: Hutafsiri maana ya msingi ya מָשִׁיחַ bila kulazimisha matumizi ya cheo “Masihi” katika matini kuu.
theological_decisions:
- issue: Tafsiri ya מְשִׁיחִי katika muktadha wa kifalme wa Daudi
  choice: mtiwa-mafuta wangu
  alternative: Masihi wangu
  rationale: Katika muktadha wa karibu neno hili kwanza linamhusu mfalme wa ukoo wa Daudi aliyetiwa mafuta na Bwana. Tafsiri kuu huhifadhi maana ya kileksia, huku tanbihi ikibakiza uwezekano wa mwangwi mpana wa Kimasihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Taswira halisi za “pembe,” “kuchipusha,” na “taa” zimehifadhiwa; tanbihi zinafafanua maana bila kuondoa utata wa kiteolojia.
