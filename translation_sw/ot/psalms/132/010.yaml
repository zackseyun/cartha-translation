base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/010.yaml
  text: For the sake of David your servant[b][a], do not turn away the face of your anointed one.
translation:
  language: sw
  text: Kwa ajili ya Daudi, mtumishi wako, usiugeuze uso wa mtiwa-mafuta wako.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usimkatae mtiwa-mafuta wako”; kihalisi, “usiugeuze uso wa mtiwa-mafuta wako.”
    reason: lexical_alternative
  - marker: b
    text: “Mtiwa-mafuta wako” pia inaweza kutafsiriwa “Masihi wako,” hasa kwa kuzingatia muktadha wa ahadi kwa Daudi na muktadha mpana wa kimasihi katika Maandiko.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲבוּר
  choice: Kwa ajili ya
  rationale: Kirai hiki kinaonyesha sababu au msingi wa ombi. “Kwa ajili ya” ni Kiswahili cha kawaida kinachohifadhi wazo la kumwomba Mungu kwa kumzingatia Daudi.
- source_word: דָּוִד
  choice: Daudi
  rationale: Jina limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
- source_word: עַבְדֶּךָ
  choice: mtumishi wako
  rationale: Katika muktadha wa kifalme na wa agano, “mtumishi” huonyesha utii na utegemezi bila kusisitiza hasa hali ya utumwa.
- source_word: אַל
  choice: usi-
  rationale: Kiambishi hiki cha ukanushi katika “usiugeuze” kinatoa kwa kawaida ombi au katazo la Kiebrania.
- source_word: תָּשֵׁב
  choice: usiugeuze
  rationale: Kitenzi hiki hapa kina maana ya kugeuza au kurudisha nyuma. “Usiugeuze” huhifadhi picha halisi ya Kiebrania; maana ya kimuktadha, “usimkatae,” imewekwa katika tanbihi.
- source_word: פְּנֵי
  choice: uso wa
  rationale: Hili ndilo neno halisi la Kiebrania, ingawa katika muktadha picha hiyo inadokeza kutomkubali au kumnyima mtu kibali.
- source_word: מְשִׁיחֶךָ
  choice: mtiwa-mafuta wako
  rationale: Neno hilo humaanisha mtu aliyetiwa mafuta, na hapa linamhusu kwanza mfalme wa ukoo wa Daudi. Tafsiri hii huhifadhi maana ya kifalme pamoja na mwangwi wake wa kimasihi bila kuamua zaidi ya maandishi.
theological_decisions:
- issue: Iwapo מְשִׁיחֶךָ litafsiriwe moja kwa moja kama cheo cha “Masihi”
  choice: mtiwa-mafuta wako
  alternative: Masihi wako
  rationale: Muktadha wa karibu unamhusu Daudi na mtawala wa ukoo wake. “Mtiwa-mafuta wako” huhifadhi neno la kifalme la Kiebrania na kuacha wazi pia maana yake pana ya kimasihi; “Masihi wako” imetajwa katika tanbihi kama tafsiri inayowezekana katika muktadha mpana wa Maandiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Picha halisi ya “kuugeuza uso” imehifadhiwa katika maandishi, huku maana yake ya kimuktadha ikifafanuliwa katika tanbihi.
