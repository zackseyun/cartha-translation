  yaml_path: translation/ot/psalms/132/006.yaml
  text: Look, we heard of it in Ephrathah; we found it in the fields of Jaar.
translation:
  language: sw
  text: Tazama, tulisikia habari zake huko Efratha; tulilikuta katika mashamba ya Yaari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika mashamba ya msitu.”
    reason: Neno la Kiebrania יָעַר linaweza kueleweka kama jina la mahali au kama nomino yenye maana ya “msitu.”
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Kihisishi hiki huvuta usikivu kwa msisitizo; “Tazama” ni cha heshima na cha kawaida katika muktadha wa kishairi.
- source_word: שְׁמַעֲנוּהָ
  choice: tulisikia habari zake
  rationale: Kiwakilishi cha kike kinaweza kurejelea sanduku lililotajwa kwa kudokezwa; usemi huu wa Kiswahili huhifadhi wazo la kusikia juu yake bila kulazimisha jina lisilo katika mstari.
- source_word: בְאֶפְרָתָה
  choice: huko Efratha
  rationale: Jina la mahali limehamishwa kifonetiki kwa namna inayosomeka katika Kiswahili.
- source_word: מְצָאנוּהָ
  choice: tulilikuta
  rationale: Kiwakilishi cha ngeli ya LI-YA kinadokeza kitu cha kike kisichotajwa wazi, kwa kawaida kikieleweka kuwa sanduku, bila kukiongeza moja kwa moja.
- source_word: בִּשְׂדֵי יָעַר
  choice: katika mashamba ya Yaari
  rationale: “Mashamba ya Yaari” huhifadhi uwezekano wa יער kuwa jina la mahali; tanbihi inaonyesha maana mbadala ya kawaida, “msitu.”
theological_decisions:
- issue: Kitu kinachorejelewa na viwakilishi vya kike
  choice: 'Kukiacha bila kukitaja wazi: “habari zake … tulilikuta”'
  alternative: Kutaja “sanduku la agano” moja kwa moja
  rationale: Kiebrania kina kiwakilishi tu, si nomino katika mstari huu; tafsiri haipaswi kuondoa udokezi au kuingiza ufafanuzi wa kitheolojia katika matini.
- issue: Maana ya יָעַר
  choice: Kulichukua kama jina la mahali, “Yaari”
  alternative: “msitu”
  rationale: Katika muktadha huu neno linaweza kufanya kazi kama jina la mahali linalohusishwa na Kiriath-yearimu, lakini maana yake ya kawaida ni “msitu”; utata umehifadhiwa kwa tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi na chenye heshima lakini kinachoeleweka kwa urahisi. Mpangilio sambamba wa vishazi viwili umehifadhiwa.
