  text: I will clothe his enemies with shame[a], but on him his crown will flourish.
translation:
  language: sw
  text: Nitawavika adui zake aibu, lakini juu yake taji lake[a] litachanua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “diademu yake itachipua.” Kitenzi cha Kiebrania hudokeza kuchipua au kuchanua, na nomino inaweza kumaanisha taji au diademu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבָיו
  choice: adui zake
  rationale: Nomino ya wingi yenye kiambishi cha nafsi ya tatu umoja; “adui zake” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: אַלְבִּישׁ
  choice: Nitawavika
  rationale: Hifili ya לבשׁ ina maana ya kumvika mtu; nafsi ya kwanza umoja na watendwa wa wingi zimewasilishwa wazi.
- source_word: בֹּשֶׁת
  choice: aibu
  rationale: Inamaanisha aibu au fedheha; “kuvika aibu” huhifadhi sitiari ya Kiebrania kwa lugha fupi na yenye kueleweka.
- source_word: וְעָלָיו
  choice: lakini juu yake
  rationale: Kiunganishi kinaonyesha utofauti kati ya adui na mfalme, huku “juu yake” kikihifadhi taswira ya mahali ya Kiebrania.
- source_word: יָצִיץ
  choice: litachanua
  rationale: Kitenzi huonyesha kuchipua au kuchanua. Tafsiri hii huhifadhi taswira hai ya mmea badala ya kuifafanua tu kuwa mafanikio.
- source_word: נִזְרוֹ
  choice: taji lake
  rationale: Katika muktadha wa kifalme wa zaburi hii, נזר hurejelea kwa kawaida taji la kifalme, ingawa inaweza pia kuhusiana na kuwekwa wakfu.
theological_decisions:
- issue: Taswira ya kifalme ya נִזְרוֹ katika zaburi ya Daudi na Sayuni
  choice: taji lake
  alternative: kuwekwa kwake wakfu
  rationale: Muktadha wa ahadi kwa ukoo wa Daudi unaunga mkono maana ya kifalme. Tafsiri haiongezi wazi dai maalumu la Kimasihi lisilotajwa moja kwa moja katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sitiari sambamba za kuvika aibu na taji kuchanua zimehifadhiwa; “litachanua” ni ya kishairi lakini inaeleweka kwa urahisi.
