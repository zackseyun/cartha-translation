  yaml_path: translation/ot/psalms/132/012.yaml
  text: If your sons keep my covenant and my testimonies that I will teach them[a], then their sons also will sit on your throne forever.
translation:
  language: sw
  text: Kama wana wako watashika agano langu na shuhuda zangu nitakazowafundisha,[a] basi wana wao pia watakalia kiti chako cha enzi milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maagizo yangu” au “masharti yangu” badala ya “shuhuda zangu.”
    reason: עדות linaweza kurejelea shuhuda za Mungu na, katika muktadha wa agano, maagizo au masharti yake.
lexical_decisions:
- source_word: אִם
  choice: Kama
  rationale: Hutambulisha sharti halisi bila kudokeza kuwa lazima litimie.
- source_word: יִשְׁמְרוּ
  choice: watashika
  rationale: Katika muktadha wa agano, ‘kushika’ kwa kawaida humaanisha kulinda na kutii kwa uaminifu.
- source_word: בָנֶיךָ
  choice: wanao
  rationale: Neno la Kiebrania ni ‘wana’ kwa wingi, na muktadha unahusu warithi wa kifalme.
- source_word: בְּרִיתִי
  choice: agano langu
  rationale: Ni tafsiri ya kawaida na wazi ya ברית katika muktadha huu.
- source_word: וְעֵדֹתַי
  choice: na masharti yangu
  rationale: Katika muktadha wa agano, עדות hurejelea maagizo au masharti ya Mungu yanayopaswa kutiiwa; ‘masharti’ ni Kiswahili cha asili na kinaeleweka hapa.
- source_word: זוֹ אֲלַמְּדֵם
  choice: nitakayowafundisha
  rationale: Husawazisha kiwakilishi cha uhusiano na kitenzi cha wakati ujao, huku kikihusisha masharti hayo na yale ambayo Mungu atawafundisha.
- source_word: גַּם
  choice: pia
  rationale: 'Hudumisha maana ya nyongeza: wana wao nao watahusishwa.'
- source_word: בְּנֵיהֶם
  choice: wana wao
  rationale: Hudumisha maana mahsusi ya wana katika muktadha wa urithi wa nasaba.
- source_word: עֲדֵי עַד
  choice: milele
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kudumu bila mwisho.
- source_word: יֵשְׁבוּ לְכִסֵּא לָךְ
  choice: wataketi kwenye kiti chako cha enzi
  rationale: ‘Kuketi kwenye kiti cha enzi’ huhifadhi taswira ya Kiebrania ya kutawala kama mfalme na ni ya asili kwa Kiswahili.
theological_decisions:
- issue: Masharti ya ahadi kwa ukoo wa Daudi katika mstari huu
  choice: 'Kauli inawasilishwa kama sharti halisi: kuendelea kwa wana wa ukoo huo kuketi kwenye kiti cha enzi kunahusishwa na kushika agano na masharti ya Mungu.'
  alternative: Kuifanya ahadi ionekane isiyo na sharti na kulichukulia sharti hili kuwa la balagha tu au la muda mfupi.
  rationale: Muundo wa אִם unaweka wazi sharti. Tafsiri haiondoi mvutano huu kwa kuupatanisha kimyakimya na mafundisho mapana kuhusu agano la Daudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili na unaeleweka kwa wasomaji wa kawaida, huku ukihifadhi lugha ya agano, urithi wa kifalme, na sharti lililo katika Kiebrania.
