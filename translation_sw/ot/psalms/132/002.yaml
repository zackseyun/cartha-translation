lexical_decisions:
- source_word: אֲשֶׁר
  choice: aliye-
  rationale: Kiambishi cha uhusiano cha nafsi humrejelea Daudi katika mstari uliotangulia na kuendeleza sentensi kwa Kiswahili cha kawaida.
- source_word: נִשְׁבַּע
  choice: aliyeapa
  rationale: Niphal ya שׁבע humaanisha kuapa; kitenzi hiki kinadumisha uzito wa kiapo bila upanuzi usiohitajika.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Kihusishi ל humtaja anayelengwa na kiapo; jina la agano יְהוָה limetoholewa kuwa Yahweh.
- source_word: נָדַר
  choice: kuweka nadhiri
  rationale: נדר humaanisha kutoa au kuweka nadhiri. Usemi huu ni wa kawaida na wenye hadhi katika Kiswahili, huku ukidumisha utofauti kati ya kuapa na kuweka nadhiri.
- source_word: לַאֲבִיר
  choice: kwa Mwenye Nguvu
  rationale: אֲבִיר ni cheo chenye maana ya mwenye nguvu; tafsiri hii inahifadhi hadhi yake kama jina la heshima la Mungu.
- source_word: יַעֲקֹב
  choice: wa Yakobo
  rationale: Hukamilisha cheo cha Mungu, 'Mwenye Nguvu wa Yakobo,' na kuhifadhi jina la mtu kwa namna iliyozoeleka katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יְהוָה; kulitohowa kuwa Yahweh kulitofautisha na cheo 'Bwana' bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mstari unaendelea kisarufi kutoka Zaburi 132:1, kwa hiyo unaanza na 'aliyeapa'. Usambamba wa vitenzi umehifadhiwa kwa 'aliyeapa ... na kuweka nadhiri'.
