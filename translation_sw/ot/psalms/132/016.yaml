  text: Nami nitawavika makuhani wake wokovu, na watu wake waaminifu[a] watashangilia kwa shangwe tele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watakatifu wake” au “wacha Mungu wake.” Neno la Kiebrania linamaanisha watu wenye uaminifu na kujitoa katika uhusiano wa agano.
