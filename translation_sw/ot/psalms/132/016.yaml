lexical_decisions:
- source_word: כֹהֲנֶיהָ
  choice: makuhani wake
  rationale: Nomino ina kiambishi cha nafsi ya tatu, umoja wa kike, kinachorejelea Sayuni iliyotajwa katika muktadha. Kiswahili hutumia “wake” kwa upatanisho wa ngeli bila kulazimisha jinsia ya kisarufi.
- source_word: אַלְבִּישׁ
  choice: nitawavika
  rationale: Hifili ya לבשׁ ina maana ya kumvika mtu. Umbo la nafsi ya kwanza umoja linamhifadhi Mungu kama msemaji, na kitenzi hiki kinadumisha sitiari ya mavazi.
- source_word: יֶשַׁע
  choice: wokovu
  rationale: Neno linaweza kumaanisha wokovu, ukombozi, au ushindi. “Wokovu” ni pana na linahifadhi sitiari ya kitu ambacho makuhani wanavikwa bila kuzuia maana za kuokolewa au kushinda.
- source_word: חֲסִידֶיהָ
  choice: watu wake waaminifu
  rationale: חסיד hueleza watu wenye uaminifu, utiifu, na kujitoa katika uhusiano wa agano. “Watu wake waaminifu” ni ya kawaida katika Kiswahili cha sasa na huepuka maana finyu ambazo “watakatifu” ingeweza kuleta.
- source_word: רַנֵּן יְרַנֵּנוּ
  choice: watashangilia kwa sauti kubwa
  rationale: Muundo wa jina-kitenzi lisilo na kikomo pamoja na kitenzi kamili unasisitiza tendo la kutoa sauti ya furaha. Tafsiri hii huonyesha shangwe ya wazi na msisitizo wake kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya חֲסִידֶיהָ katika mazingira ya ibada na agano
  choice: watu wake waaminifu
  alternative: watakatifu wake; wacha Mungu wake; watu wake waaminifu kwa agano
  rationale: Chaguo hili linahifadhi wazo la uaminifu na kujitoa kwa Mungu bila kuingiza dhana maalumu za kimadhehebu. Tanbihi inaonyesha upana wa neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya kuvikwa wokovu imehifadhiwa, huku msisitizo wa kishairi wa Kiebrania ukitolewa kwa maneno ya asili ya Kiswahili.
