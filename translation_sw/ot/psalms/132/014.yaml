  text: זֹאת מְנוּחָתִ֥/י עֲדֵי עַ֑ד פֹּֽה אֵ֝שֵׁ֗ב כִּ֣י אִוִּתִֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/014.yaml
  text: This is my resting place forever; here I will dwell[a], for I have desired it.
translation:
  language: sw
  text: '“Hapa ndipo mahali pangu pa kupumzika milele;

    hapa nitakaa, kwa maana nimeitamani[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nimepatamani,” ikiwa kiambishi cha kike kinaeleweka kuwa kinarejelea mahali pa kupumzika badala ya Sayuni inayowasilishwa kama mwanamke.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Hapa ndipo
  rationale: Kiashiria cha kike katika muktadha huu kinaelekeza kwenye Sayuni, mahali palipotajwa; “Hapa ndipo” ni usemi wa kawaida wa Kiswahili unaosisitiza mahali husika.
- source_word: מְנוּחָתִי
  choice: mahali pangu pa kupumzika
  rationale: Nomino hii inaweza kumaanisha pumziko au mahali pa kupumzika. Kwa kuwa mstari unaendelea na “hapa,” maana ya mahali halisi inafaa zaidi.
- source_word: עֲדֵי עַד
  choice: milele
  rationale: Nahau hii inaonyesha kudumu bila mwisho; “milele” ni tafsiri ya kawaida na yenye hadhi katika Kiswahili.
- source_word: פֹּה
  choice: hapa
  rationale: Inahifadhi moja kwa moja msisitizo wa mahali uliomo katika kielezi cha Kiebrania.
- source_word: אֵשֵׁב
  choice: nitakaa
  rationale: Kitenzi kinaweza kumaanisha kuketi, kukaa au kuishi mahali. “Nitakaa” kinafaa kwa makao ya kudumu na pia hakifuti kabisa mwangwi wa kuketi au kutawala.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa kinaanzisha sababu ya Mungu kukaa Sayuni.
- source_word: אִוִּתִיהָ
  choice: nimeitamani
  rationale: Kitenzi kinamaanisha kutamani au kuonea shauku. Kiambishi cha yambwa cha Kiswahili kinarejelea Sayuni kwa kawaida bila kulazimisha jinsia ambayo Kiswahili haina, huku tanbihi ikihifadhi uwezekano mwingine wa kirejewa.
theological_decisions:
- issue: Kirejewa cha kiambishi cha kike cha umoja katika אִוִּתִיהָ
  choice: “Nimeitamani,” kikieleweka hasa kuwa kinarejelea Sayuni iliyotajwa katika muktadha.
  alternative: Kukielewa kuwa kinarejelea mahali pa kupumzika, na hivyo kutafsiri “nimepatamani.”
  rationale: Katika ushairi wa Kiebrania, Sayuni hutajwa kama wa kike, lakini Kiswahili hakina viwakilishi vya jinsia kwa namna hiyo. Tafsiri hii haiongezi jinsia kwa njia isiyo ya kawaida, na tanbihi inadumisha utata halisi wa kirejewa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mgawanyo wa mistari unahifadhi usambamba wa kishairi wa Kiebrania.
