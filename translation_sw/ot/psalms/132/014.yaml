  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu vipashio vya Kiebrania: mahali pa pumziko la Mungu, udumifu wa “milele,” kauli ya kukaa/dwelling mahali hapo, na sababu ya kukitamani. “Hapa ndipo” kwa זֹאת hufanya kielekezi kiwe cha kimahali kwa namna inayoeleweka vizuri katika muktadha wa Sayuni.'
