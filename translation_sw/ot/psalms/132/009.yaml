    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּהֲנֶיךָ
  choice: makuhani wako
  rationale: Neno כֹּהֵן humaanisha kuhani; wingi na kiambishi cha nafsi ya pili umoja vimehifadhiwa. Hili pia linadumisha mazingira ya ibada na hekalu.
- source_word: יִלְבְּשׁוּ
  choice: na wavikwe
  rationale: Kitenzi לבשׁ kina taswira ya kuvaa au kuvikwa. Muundo wa kutendwa unasikika kwa kawaida katika Kiswahili na kuhifadhi sitiari ya vazi pamoja na maana ya ombi.
- source_word: צֶדֶק
  choice: haki
  rationale: Katika Kiswahili, “haki” hubeba kwa upana maana za uadilifu wa kimaadili na haki ya kimahakama zinazoweza kuwamo katika צֶדֶק, hivyo hailazimishi upande mmoja wa maana.
- source_word: וַחֲסִידֶיךָ
  choice: waaminifu wako
  rationale: חָסִיד huelekeza kwa watu wenye uaminifu na kujitoa katika uhusiano wa agano. “Waaminifu wako” ni ya kisasa na wazi bila kuingiza maana za baadaye zinazoweza kuambatana na “watakatifu.”
- source_word: יְרַנֵּנוּ
  choice: na wapige vigelegele kwa furaha
  rationale: Piel ya רנן huonyesha sauti kubwa ya shangwe. “Kupiga vigelegele kwa furaha” huhifadhi nguvu ya kushangilia kwa sauti, huku mbadala wa kuimba ukiwekwa katika tanbihi.
theological_decisions:
- issue: Nguvu ya kiombi ya vitenzi vya imperfecti katika muktadha huu
  choice: Kutumia “na wavikwe ... na wapige ...” kama ombi au matakwa
  alternative: “Makuhani wako watavikwa ... na waaminifu wako watapiga ...” kama utabiri
  rationale: Katika muktadha wa Zaburi 132 mstari huu ni ombi, si taarifa ya moja kwa moja kuhusu wakati ujao. Muundo wa “na ...” huwasilisha vizuri maana hiyo katika Kiswahili.
- issue: Upeo wa maana ya צֶדֶק
  choice: Kutumia “haki” bila kuifafanua kuwa uadilifu wa kimaadili pekee au haki ya kimahakama pekee
  alternative: “uadilifu”
  rationale: Neno la Kiebrania linaweza kubeba pande zote mbili; “haki” huhifadhi mvutano huo wa maana badala ya kuutatua kimadhehebu au kifasiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa mstari unahifadhi usambamba wa Kiebrania na taswira ya makuhani kuvikwa haki. “Vigelegele” limetumiwa kwa shangwe ya sauti; tanbihi inadumisha uwezekano wa kuimba.
