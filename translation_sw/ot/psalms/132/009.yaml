  text: May your priests be clothed with righteousness[c][b][a], and may your faithful ones shout for joy.
translation:
  language: sw
  text: Makuhani wako na wavae haki[a], na waaminifu wako[b] washangilie kwa furaha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uadilifu.” Neno la Kiebrania linaweza kubeba maana ya uadilifu wa kimaadili au haki katika maana ya kimahakama.
    reason: lexical_alternative
  - marker: b
    text: Au “wacha Mungu wako” au “watakatifu wako.” Neno la Kiebrania hurejelea watu wanaotambulika kwa uaminifu na kujitoa katika uhusiano wa agano.
    reason: lexical_alternative
  - marker: c
