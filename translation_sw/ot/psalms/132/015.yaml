  text: I will surely bless her provisions[a]; I will satisfy her poor with bread.
translation:
  language: sw
  text: Hakika nitabariki sana chakula chake[a]; nitawashibisha maskini wake kwa mkate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “riziki yake” au “ugavi wake wa chakula”; neno la Kiebrania linaweza kumaanisha chakula au ugavi wa chakula wa mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֵידָהּ
  choice: akiba yake ya chakula
  rationale: Neno צֵיד hapa lina maana ya chakula au mahitaji yaliyowekwa tayari. Katika muktadha wa Sayuni, “akiba yake ya chakula” linaeleza ugavi wa chakula wa mji na kuepuka maana isiyofaa ya mawindo.
- source_word: בָּרֵךְ אֲבָרֵךְ
  choice: Hakika nitabariki
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichonyambuliwa unasisitiza uhakika na nguvu ya tendo; “Hakika nitabariki” ni Kiswahili cha kawaida kinachohifadhi msisitizo huo.
- source_word: אֶבְיוֹנֶיהָ
  choice: maskini wake
  rationale: אֶבְיוֹן humaanisha maskini au mhitaji. “Maskini wake” ni fupi, ya asili, na inahifadhi kiambishi cha kike kinachorejelea Sayuni.
- source_word: אַשְׂבִּיעַ
  choice: nitawashibisha
  rationale: Hifili ya שׂבע humaanisha kusababisha mtu ashibe au atosheke. “Nitawashibisha” linafaa hasa kwa kuwa kitu kinachotolewa ni mkate.
- source_word: לָחֶם
  choice: kwa mkate
  rationale: Kiebrania kinataja mkate moja kwa moja; kuuhifadhi kunadumisha taswira halisi badala ya kuipanua kuwa chakula kwa ujumla.
theological_decisions:
- issue: Kinachorejelewa na viambishi vya kike
  choice: Viambishi katika “akiba yake” na “maskini wake” vinamrejelea Sayuni, anayetajwa kama wa kike.
  alternative: Vinaweza kueleweka kwa upana kuwa vinarejelea makao ya BWANA.
  rationale: Viambishi vya nafsi ya tatu, umoja wa kike, vinaelekea kwa kawaida zaidi kwa Sayuni katika Zaburi 132:13–14. Tafsiri inadumisha urejeo huo bila kuongeza dai jingine la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. “Akiba yake ya chakula” ni wazi zaidi kuliko “mahitaji yake,” huku “nitawashibisha” ikihifadhi wazo la kutosheka kikamilifu.
