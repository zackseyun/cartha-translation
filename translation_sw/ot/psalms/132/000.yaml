  text: A Song of Ascents[a]. Remember, Yahweh[b], for David all his affliction.
translation:
  language: sw
  text: 'Wimbo wa kupanda.[a]


    Ee Yahwe, kwa ajili ya Daudi,

    kumbuka mateso yake yote.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wimbo wa safari za kupanda.” Huenda kichwa hiki kilihusiana na kupanda kwenda Yerusalemu, lakini maana yake kamili haijulikani kwa hakika.
    reason: lexical_alternative
  - marker: b
    text: Au, “taabu zake zote” au “kudhalilishwa kwake kote.” Neno la Kiebrania linaweza kumaanisha mateso, taabu, au kuletwa chini.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa Kupanda
  rationale: Huhifadhi taswira ya kupanda katika kichwa cha zaburi bila kuamua kimyakimya ikiwa ni kupanda kwenda Yerusalemu, hatua za ngazi, au maana nyingine ya jadi.
- source_word: זְכוֹר
  choice: kumbuka
  rationale: Amri hii inaomba Yahwe amweke Daudi na taabu zake akilini na atende ipasavyo; kitenzi cha kawaida cha Kiswahili huhifadhi usemi huo wa agano.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina binafsi la Mungu katika Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: לְדָוִד
  choice: kwa ajili ya Daudi
  rationale: Hutoa Kiswahili cha kawaida kinachoonyesha kwamba ombi linafanywa kwa habari ya Daudi au kwa manufaa yake, huku tanbihi ikihifadhi upana wa kihusishi.
- source_word: עֻנּוֹתוֹ
  choice: mateso yake
  rationale: Nomino hii inaweza kuonyesha taabu, kudhalilishwa, au hali ya kuletwa chini; ‘mateso’ ni chaguo pana na la kawaida katika muktadha huu.
theological_decisions:
- issue: Mhusika anayepaswa kukumbukwa katika לְדָוִד
  choice: kwa ajili ya Daudi
  alternative: kuhusu Daudi
  rationale: Kihusishi לְ kinaweza kueleweka kama ombi kwa manufaa ya Daudi au kwa habari yake. Matini kuu inatumia usemi wa kawaida wa Kiswahili, na tanbihi inahifadhi uwezekano mwingine.
- issue: Maana ya עֻנּוֹתוֹ
  choice: mateso yake
  alternative: taabu zake zote; kudhalilishwa kwake kote
  rationale: Neno la Kiebrania lina wigo wa mateso, taabu, na kuletwa chini. Chaguo hili halifungi matini katika tafsiri moja finyu ya kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ee’ hudumisha mwito wa moja kwa moja kwa Mungu; mpangilio wa mistari unafaa ushairi wa zaburi. Jina ‘Yahwe’ limetumiwa kwa tetragramu.
