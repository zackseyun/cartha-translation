  variant: Standard East African Swahili
source:
  edition: WLC
  text: נָב֥וֹאָה לְ/מִשְׁכְּנוֹתָ֑י/ו נִ֝שְׁתַּחֲוֶ֗ה לַ/הֲדֹ֥ם רַגְלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/007.yaml
  text: Let us go into his dwelling place[b][a]; let us bow down at his footstool.
translation:
  language: sw
  text: Na twende kwenye makao yake[a]; na tuiname mbele ya kiti cha kuwekea miguu yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali pake pa kukaa.” Kiebrania kina umbo la wingi, “makao yake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “na tuabudu penye kiti cha kuwekea miguu yake.” Kiebrania kwa maana halisi zaidi husema kuinama.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבוֹאָה
  choice: Na twende
  rationale: Kitenzi cha uhimizo katika nafsi ya kwanza wingi kinaonyesha mwaliko wa pamoja; “na twende” ni Kiswahili cha kawaida na huhifadhi maana ya mwendo.
- source_word: לְמִשְׁכְּנוֹתָיו
  choice: kwenye makao yake
  rationale: Neno la Kiebrania liko katika wingi. “Makao” huhifadhi wingi huo kwa namna ya asili na yenye staha, bila kulazimisha maana ya hema.
- source_word: נִשְׁתַּחֲוֶה
  choice: na tuiname
  rationale: Neno linaonyesha kujishusha au kuinama kwa heshima; tafsiri hii huhifadhi tendo la kimwili badala ya kulipanua moja kwa moja kuwa ibada.
- source_word: לַהֲדֹם רַגְלָיו
  choice: mbele ya kiti cha kuwekea miguu yake
  rationale: “Kiti cha kuwekea miguu” ni usemi wazi wa Kiswahili kwa הֲדֹם, huku “mbele ya” ikitoa uhusiano wa mahali unaofaa kwa tendo la kuinama.
theological_decisions:
- issue: Kirejeleo cha kiwakilishi “yake”
  choice: Kuhifadhi kiwakilishi bila kumtaja mwenye makao au kiti hicho waziwazi
  alternative: Kutaja BWANA au sanduku la agano moja kwa moja
  rationale: Kiebrania hakifafanui kirejeleo hapa, na muktadha unaunganisha makao ya BWANA, Sayuni, na sanduku. Tafsiri haipaswi kuondoa mvutano huo.
- issue: Maana ya נִשְׁתַּחֲוֶה
  choice: na tuiname
  alternative: na tuabudu
  rationale: “Tuiname” huhifadhi picha halisi ya kujishusha kwa heshima; “tuabudu” ni maana pana na ya kufasiri zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa uhimizo wa pamoja “na twende … na tuiname” unaendeleza usambamba wa kishairi. “Makao” ni neno la kawaida lenye hadhi ya kishairi na linaweza kuonyesha wingi bila kuwa gumu.
