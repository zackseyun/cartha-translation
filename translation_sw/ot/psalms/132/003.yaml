  footnotes:
  - marker: a
    text: Kiebrania kinatumia kauli ya kiapo yenye neno ‘ikiwa’ lililorudiwa; kihalisi, ‘Ikiwa nitaingia ... ikiwa nitapanda ...,’ lakini katika muktadha maana yake ni, ‘Hakika sitaingia ... hakika sitapanda ...’
