lexical_decisions:
- source_word: אִם
  choice: hakika ... si-
  rationale: Katika muktadha huu אִם ni sehemu ya kauli ya kiapo inayodokeza kujizuia kabisa, si sharti la kawaida. Kiswahili ‘hakika sita...’ kinafikisha nguvu ya kiapo huku tanbihi ikihifadhi muundo halisi wa Kiebrania.
- source_word: אָבֹא
  choice: nitaingia
  rationale: Kitenzi hiki cha nafsi ya kwanza kinaeleza tendo la baadaye ambalo msemaji ameapa kutolifanya; ‘kuingia’ kinafaa kwa hema au nyumba.
- source_word: בְּאֹהֶל בֵּיתִי
  choice: katika hema la nyumba yangu
  rationale: ‘Hema’ linahifadhi picha halisi ya אֹהֶל, na ‘nyumba yangu’ linafuata בֵּיתִי bila kuyeyusha maneno hayo mawili kuwa wazo moja la jumla.
- source_word: אֶעֱלֶה עַל
  choice: nitapanda juu ya
  rationale: ‘Kupanda juu ya’ kunahifadhi maana ya mwendo wa עלה pamoja na kihusishi עַל katika taswira ya kwenda kitandani.
- source_word: עֶרֶשׂ יְצוּעָי
  choice: kitanda cha malazi yangu
  rationale: ‘Kitanda’ ni neno la kawaida kwa עֶרֶשׂ, na ‘malazi yangu’ linaonyesha יְצוּעָי kama mahali pa kulala, huku likihifadhi urudiaji wa kishairi wa maneno yenye maana zinazokaribiana.
theological_decisions:
- issue: Nguvu ya kiapo katika אִם iliyorudiwa
  choice: 'Kutafsiri kama kauli hasi yenye msisitizo: ‘Hakika sita... hakika sita...’'
  alternative: Kutafsiri kihalisi ‘nikiingia... nikipanda...’
  rationale: Muktadha wa kiapo unaonyesha kwamba sentensi zenye אִם ni kauli za kujifunga kwa kiapo. Tafsiri iliyochaguliwa inaeleweka kwa msomaji wa Kiswahili bila kuongeza maudhui ya kiteolojia yasiyokuwamo katika chanzo; tanbihi inaweka wazi muundo halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa heshima lakini unaoeleweka kwa urahisi. ‘Hema la nyumba yangu’ na ‘kitanda cha malazi yangu’ yamehifadhi taswira na ulinganifu wa Kiebrania badala ya kuyasawazisha kuwa lugha ya kawaida zaidi.
