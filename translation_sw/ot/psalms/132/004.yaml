lexical_decisions:
- source_word: אִם
  choice: sita- / wala
  rationale: Katika kiapo hiki אִם haitangulizi sharti la kawaida, bali usemi wa kiapo wenye laana iliyoachwa kutajwa. Kiswahili cha asili huwasilisha nguvu yake kwa ukanushi wa azimio, “sitayapa … wala …”.
- source_word: אֶתֵּן
  choice: sitayapa
  rationale: נתן maana yake ya kawaida ni “kutoa/kupa.” Pamoja na nguvu ya kiapo ya אִם, kitenzi hiki kinaeleza azimio la kutofanya jambo; “kuyapa macho usingizi” pia huhifadhi taswira ya Kiebrania.
- source_word: שְׁנַת
  choice: usingizi
  rationale: Nomino hii humaanisha usingizi, na ndiyo neno la kawaida na la asili katika Kiswahili.
- source_word: לְעֵינַי
  choice: macho yangu
  rationale: לְ huonyesha mpokeaji wa tendo la נתן. Muundo “kuyapa macho yangu usingizi” unawasilisha uhusiano huo na kuhifadhi taswira ya sehemu ya mwili.
- source_word: לְעַפְעַפַּי
  choice: kope zangu
  rationale: עפעף humaanisha kope. Neno hili linahifadhi ulinganifu wa kishairi na “macho yangu.”
- source_word: תְּנוּמָה
  choice: kusinzia
  rationale: Neno hili linaweza kumaanisha usingizi mwepesi au kusinzia. “Kusinzia” hulitofautisha na שְׁנַת na kudumisha utofauti wa kishairi.
theological_decisions:
- issue: Muundo wa kiapo uliofupishwa
  choice: 'Kutafsiri nguvu yake kwa ukanushi: “sitayapa … wala …”'
  alternative: “Nikiyapa macho yangu usingizi …”
  rationale: Kiebrania kina sharti lililofupishwa ambalo maana ya laana yake haikutajwa. Tafsiri ya ukanushi huwasilisha azimio la kiapo kwa Kiswahili kinachoeleweka bila kuongeza laana isiyoandikwa; tanbihi huhifadhi umbo halisi na mvutano wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mstari wa pili umeachwa bila kurudia kitenzi ili kuhifadhi ulinganifu na ufupi wa Kiebrania; alama ya mwisho inaonyesha sentensi inaendelea katika mstari unaofuata.
