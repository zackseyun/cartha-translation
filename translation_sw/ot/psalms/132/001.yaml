  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת זְכוֹר יְהוָ֥ה לְ/דָוִ֑ד אֵ֝ת כָּל עֻנּוֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/001.yaml
  text: A Song of Ascents[a]. Remember, O Yahweh[b], for David all his affliction.
translation:
  language: sw
  text: 'Wimbo wa Kupanda.


    Ee Yahwe, kwa ajili ya Daudi,[a] kumbuka taabu zake zote.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuhusu Daudi.” Kihusishi cha Kiebrania kinaweza kumaanisha kwa manufaa ya Daudi au kwa habari yake.
    reason: lexical_alternative
  - marker: b
    text: Au “mateso yake yote,” “shida zake zote,” au “kudhalilishwa kwake kote.” Neno la Kiebrania linaweza kujumuisha mateso, shida, kujinyima, au kushushwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa Kupanda
  rationale: Huhifadhi jina la mkusanyo kwa ufupi na kwa ukaribu na Kiebrania, bila kuamua ikiwa kupanda huku ni hija, ngazi, au maana nyingine ya kihistoria.
- source_word: זְכוֹר
  choice: kumbuka
  rationale: Ni amri katika sala inayoelekezwa kwa Mungu; muktadha unadokeza kukumbuka kunakoleta tendo la fadhili bila kuliongeza wazi katika tafsiri.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina binafsi la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: לְדָוִד
  choice: kwa ajili ya Daudi
  rationale: Hutoa maana ya manufaa au rejeleo la kihusiano iliyo katika kihusishi לְ, huku tanbihi ikihifadhi uwezekano wa maana ya 'kuhusu Daudi'.
- source_word: עֻנּוֹתוֹ
  choice: taabu zake zote
  rationale: Neno 'taabu' lina upana wa maana unaoweza kujumuisha mateso, shida, au kushushwa, bila kulibana kuwa kujinyima au fedheha pekee.
theological_decisions:
- issue: Uwakilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano moja kwa moja; 'Yahwe' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya עֻנּוֹתוֹ katika uzoefu wa Daudi
  choice: taabu zake zote
  alternative: mateso yake yote; kujinyima kwake kote; kudhalilishwa kwake kote
  rationale: Kiebrania kinaweza kuhusisha mateso, shida, kujinyima, au kushushwa. 'Taabu' huhifadhi upana huo na mvutano wa kifasiri.
- issue: Uhusiano unaoonyeshwa na לְדָוִד
  choice: kwa ajili ya Daudi
  alternative: kuhusu Daudi
  rationale: Kihusishi kinaweza kuonyesha manufaa au jambo linalomhusu Daudi. Tafsiri kuu inafaa muundo wa sala, na tanbihi huhifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa 'kwa ajili ya Daudi' umewekwa karibu na ombi ili kuhifadhi kazi ya kihusishi cha Kiebrania; koma zinafanya sentensi isomeke kwa kawaida.
