  text: קוּמָ֣/ה יְ֭הוָה לִ/מְנוּחָתֶ֑/ךָ אַ֝תָּ֗ה וַ/אֲר֥וֹן עֻזֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/008.yaml
  text: Arise[a], O Yahweh, to your resting place[b], you and the ark of your strength.
translation:
  language: sw
  text: Inuka, Ee Yahwe, uende mahali pako pa pumziko[a], wewe na sanduku la nguvu zako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye pumziko lako.” Neno la Kiebrania linaweza kumaanisha pumziko lenyewe au mahali pa pumziko; hapa yaelekea linamaanisha mahali ambapo Yahwe anakaa kwa uthabiti.
    reason: lexical_alternative
  - marker: b
    text: Au, “sanduku la uweza wako,” au “sanduku linaloonyesha nguvu zako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: Inuka
  rationale: Ni amri ya kitenzi קום inayoelekezwa kwa Yahwe. “Inuka” huhifadhi mwito wa kishairi na wa kiliturujia wa Mungu kuchukua nafasi yake au kutenda, bila kuongeza maelezo yasiyomo katika Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa kunukuu matamshi yake kama “Yahwe,” badala ya kulibadilisha kuwa cheo.
- source_word: לִמְנוּחָתֶךָ
  choice: uende mahali pako pa pumziko
  rationale: מְנוּחָה inaweza kumaanisha pumziko au mahali pa pumziko. Kwa kuwa kiambishi ל־ kinaonyesha mwelekeo na muktadha unahusu sanduku na mahali patakatifu, tafsiri hii huonyesha kwenda kwenye mahali pa uwepo uliotulia wa Yahwe. Kitenzi “uende” kinafanya mwelekeo huo uwe wa asili katika Kiswahili bila kubadili maana ya msingi.
- source_word: אַתָּה
  choice: wewe
  rationale: Kiwakilishi huru cha Kiebrania kimedumishwa ili kuhifadhi msisitizo na kukiunganisha na “sanduku la nguvu zako.”
- source_word: וַאֲרוֹן
  choice: na sanduku
  rationale: Katika muktadha huu wa ibada, אֲרוֹן ni sanduku takatifu linalohusishwa na uwepo wa Yahwe. “Sanduku” ndiyo istilahi ya kawaida na inayoeleweka katika Kiswahili cha Biblia.
- source_word: עֻזֶּךָ
  choice: la nguvu zako
  rationale: עֹז humaanisha nguvu, uweza, au uwezo. “Nguvu zako” huhifadhi muundo mfupi wa kishairi “sanduku la nguvu zako” bila kuufafanua kupita kiasi.
theological_decisions:
- issue: Kutafsiri jina la Mungu YHWH
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” huhifadhi jina binafsi la Mungu badala ya kuweka cheo mahali pake.
- issue: Maana ya “sanduku la nguvu zako”
  choice: Kudumisha kirai “sanduku la nguvu zako”
  alternative: sanduku la uweza wako; sanduku linaloonyesha nguvu zako
  rationale: Kirai hiki kinaonyesha uhusiano wa sanduku na uwepo wenye nguvu wa Yahwe. Tafsiri ya moja kwa moja hudumisha ufupi, ushairi, na mvutano wa maana uliomo katika Kiebrania bila kuamua kimya kimya ikiwa sanduku lina nguvu au linaziwakilisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Ee” huhifadhi mtindo wa sala, na “mahali pako pa pumziko” ni usemi wa asili kuliko tafsiri ya dhana tupu katika muktadha huu.
