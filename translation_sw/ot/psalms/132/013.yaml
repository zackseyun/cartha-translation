  text: For Yahweh has chosen Zion[a]; he has desired it for his dwelling place.
translation:
  language: sw
  text: Kwa maana Yahweh ameichagua Sayuni; ameitamani kuwa makao yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya kauli iliyotangulia katika zaburi; “kwa maana” huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: בָחַר
  choice: ameichagua
  rationale: Kitenzi kina maana ya kuchagua. Wakati timilifu unaonyesha tendo lililokamilika lenye umuhimu unaoendelea, na kiambishi “-i-” kinarejelea Sayuni.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: בְּצִיּוֹן
  choice: Sayuni
  rationale: Baada ya kitenzi “kuchagua,” kihusishi בְּ kinaonyesha kitu au mahali palipochaguliwa; Kiswahili cha asili husema “ameichagua Sayuni,” si “amechagua katika Sayuni.”
- source_word: אִוָּהּ
  choice: ameitamani
  rationale: Kitenzi אוה kinaeleza kutamani au kuwa na shauku. Kiambishi cha yambwa kinarejelea Sayuni kwa namna ya kawaida katika Kiswahili.
- source_word: לְמוֹשָׁב
  choice: iwe makao
  rationale: מוֹשָׁב ni mahali pa kukaa au kuishi. “Iwe makao” huwasilisha kusudi la kuchaguliwa kwa Sayuni kwa lugha wazi na yenye hadhi.
- source_word: לוֹ
  choice: yake
  rationale: Kiwakilishi kinaonyesha kuwa makao hayo ni ya Yahweh; “yake” ni usemi wa kawaida wa Kiswahili katika muktadha huu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Kiwakilishi kinachorejelea Sayuni
  choice: ameitamani iwe makao yake
  alternative: ameitamani Sayuni kuwa makao yake
  rationale: Kiebrania kina kiambishi cha kike kwa sababu Sayuni ni jina la kisarufi la kike. Kiswahili hakionyeshi jinsia hiyo katika kiwakilishi hiki; upatanisho wa ngeli “-i-” unarejelea Sayuni kwa kawaida bila kulazimisha ubinafsishaji wala kuuondoa uwezekano wake wa kishairi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo sambamba wa vishazi viwili umehifadhiwa, na neno “makao” lina hadhi inayofaa kwa mazingira ya zaburi.
