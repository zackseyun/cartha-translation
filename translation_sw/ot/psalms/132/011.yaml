base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/011.yaml
  text: 'Yahweh swore to David a sure oath[b][a]; he will not turn back from it: “From the fruit of your womb I will set one on your throne.”'
translation:
  language: sw
  text: 'Yahwe alimwapia Daudi kiapo cha hakika[a]; hataghairi kiapo hicho: “Mmoja wa wazao wako[b] nitamweka juu ya kiti chako cha enzi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiapo cha kweli.” Kiebrania kinatumia neno “kweli” kusisitiza uhakika wa kiapo hicho.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “kutokana na tunda la tumbo lako,” yaani mmoja wa wazao wa Daudi. Linganisha 2 Samweli 7:12 na Matendo 2:30.
    reason: cross_reference
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: alimwapia ... kiapo
  rationale: Nifali ya שבע inaonyesha kuapa; muundo huu wa Kiswahili unaweka wazi kwamba Yahwe alimpa Daudi kiapo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa na cheo.
- source_word: אֱמֶת
  choice: cha hakika
  rationale: Neno halisi ni ‘kweli,’ lakini hapa linasisitiza kwamba kiapo ni cha kuaminika na hakitabadilishwa.
- source_word: לֹא יָשׁוּב מִמֶּנָּה
  choice: hatakiondoa
  rationale: שוב מן hapa ni kugeuka au kujiondoa katika kiapo; ‘hatakiondoa’ ni Kiswahili cha asili kinachowasilisha kutokibatilisha, bila kupanua maana.
- source_word: מִפְּרִי בִטְנְךָ
  choice: mmoja wa wazao wako
  rationale: Nahau halisi, ‘kutokana na tunda la tumbo lako,’ inamaanisha mzao wa kimwili. Kiswahili hiki ni wazi na cha kawaida huku taswira halisi ikihifadhiwa katika tanbihi.
- source_word: אָשִׁית
  choice: nitamweka
  rationale: שׁית humaanisha kuweka; kiwakilishi cha mtu kinaeleweka kutokana na mzao anayekusudiwa.
- source_word: לְכִסֵּא לָךְ
  choice: juu ya kiti chako cha enzi
  rationale: Ingawa muundo huo unaweza kufuatwa kihalisi kama ‘kwenye kiti cha enzi kwa ajili yako,’ katika muktadha unaonyesha kiti cha enzi cha Daudi; Kiswahili hiki ni sahihi na cha kawaida.
theological_decisions:
- issue: Upeo wa kimasihi na wa agano wa ahadi kwa Daudi
  choice: Andiko kuu linaitaja ahadi kuhusu mzao wa Daudi bila kutaja moja kwa moja utimilifu wa Kimasihi.
  alternative: Kutumia maneno yanayomtambulisha mzao huyo moja kwa moja kuwa Masihi.
  rationale: Zaburi yenyewe inatoa ahadi ya kifalme kwa Daudi kuhusu mzao wake. Uhusiano wake mpana wa kikanoni unaweza kuonyeshwa kwa marejeo bila kuingizwa katika maneno ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Kiti cha enzi’ limetumiwa kama istilahi ya kawaida ya ufalme. Alama zote za tanbihi [a] na [b] zimewekwa katika andiko kuu karibu na vifungu vinavyohusika.
