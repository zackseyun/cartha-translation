  text: אַל תַּשְׁלִיכֵ֥/נִי מִ/לְּ/פָנֶ֑י/ךָ וְ/ר֥וּחַ קָ֝דְשְׁ/ךָ֗ אַל תִּקַּ֥ח מִמֶּֽ/נִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/012.yaml
  text: Do not cast me away from your presence[a], and do not take your Holy Spirit from me.
translation:
  language: sw
  text: Usinitupe mbali na uwepo wako, wala usiniondolee Roho wako Mtakatifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “roho yako takatifu”; kihalisi zaidi, “roho ya utakatifu wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשְׁלִיכֵנִי
  choice: usinitupe mbali
  rationale: Kitenzi katika Hiphil kina wazo la kusababisha mtu atupwe au aondolewe; “usinitupe mbali” huhifadhi nguvu ya ombi na ni Kiswahili cha kawaida.
- source_word: מִלְּפָנֶיךָ
  choice: na uwepo wako
  rationale: Ingawa kihalisi kinahusiana na “uso wako/mbele zako,” katika nahau hii “uwepo wako” huwasilisha maana ya kuwa mbele za Mungu kwa Kiswahili cha asili.
- source_word: רוּחַ קָדְשְׁךָ
  choice: Roho wako Mtakatifu
  rationale: Muundo wa Kiebrania unaweza kumaanisha “roho yako takatifu” au kihalisi “roho ya utakatifu wako.” Tafsiri hii ya kawaida humrejelea Roho wa Mungu bila kuongeza maelezo yasiyokuwamo katika matini.
- source_word: תִּקַּח
  choice: usiondolee
  rationale: לקח kimsingi ni “chukua,” lakini pamoja na מִמֶּנִּי, “usiondolee” ni Kiswahili cha kawaida kinachohifadhi maana ya kuchukua kitu kutoka kwa mtu.
- source_word: מִמֶּנִּי
  choice: -ni- ... -ee
  rationale: Katika “usiondolee,” umbo la Kiswahili linaonyesha kwa kawaida kwamba Roho asichukuliwe kutoka kwangu, bila kulazimisha kirai kisicho cha asili.
theological_decisions:
- issue: Namna ya kutafsiri רוּחַ קָדְשְׁךָ
  choice: Roho wako Mtakatifu
  alternative: roho yako takatifu; roho ya utakatifu wako
  rationale: Kiebrania kinaweza kusomwa kwa namna hizi, na muktadha unamrejelea Roho wa Mungu. Herufi kubwa zinafuata desturi ya Kiswahili ya kumtaja Roho wa Mungu, huku tanbihi ikihifadhi uwezekano wa tafsiri ya karibu zaidi na muundo wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sala iliyo ya heshima na inayoeleweka kwa urahisi. “Wala” huunganisha maombi mawili hasi kwa mtiririko wa kishairi.
