  text: הַצִּ֘ילֵ֤/נִי מִ/דָּמִ֨ים אֱֽלֹהִ֗ים אֱלֹהֵ֥י תְּשׁוּעָתִ֑/י תְּרַנֵּ֥ן לְ֝שׁוֹנִ֗/י צִדְקָתֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/015.yaml
  text: Deliver me from bloodguilt[a], O God, God of my salvation[b], and my tongue will sing aloud of your righteousness.
translation:
  language: sw
  text: Uniokoe kutokana na hatia ya umwagaji damu[a], Ee Mungu, Mungu wa wokovu wangu; ulimi wangu utaimba kwa shangwe juu ya haki yako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutokana na umwagaji damu” au “kutokana na hatia ya damu.” Kiebrania kinasema kihalisi “kutoka katika damu,” usemi ambao mara nyingi humaanisha hatia ya kumwaga damu.
    reason: lexical_alternative
  - marker: b
    text: Au “uadilifu wako.” Neno la Kiebrania linaweza kuhusisha unyofu wa kimaadili na haki ya kihukumu.
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Uniokoe
  rationale: Kitenzi ni ombi la moja kwa moja la kuokolewa; “uniokoe” ni Kiswahili cha kawaida kinachohifadhi maana ya kupewa uokozi bila kubainisha njia.
- source_word: מִדָּמִים
  choice: na hatia ya kumwaga damu
  rationale: Wingi wa Kiebrania דמים mara nyingi ni nahau inayomaanisha damu iliyomwagwa au hatia inayotokana na kuimwaga. Katika muktadha huu wa toba, tafsiri hii inaonyesha wazi uwajibikaji kwa umwagaji damu.
- source_word: אֱלֹהֵי תְּשׁוּעָתִי
  choice: Mungu wa wokovu wangu
  rationale: Muundo huu unafuata kirai cha Kiebrania kwa karibu na kuhifadhi mtindo wa kishairi pamoja na maana ya Mungu kuwa chanzo cha wokovu wa mwombaji.
- source_word: תְּרַנֵּן
  choice: utaimba kwa sauti
  rationale: Kitenzi kinaeleza sifa yenye shangwe na inayosikika wazi; usemi huu ni wa kawaida na unaendana na “ulimi wangu” kama kiima.
- source_word: לְשׁוֹנִי
  choice: ulimi wangu
  rationale: Taswira halisi ya ulimi kama chombo cha sifa imehifadhiwa badala ya kuibadilisha kuwa “mimi” au “kinywa changu.”
- source_word: צִדְקָתֶךָ
  choice: haki yako
  rationale: “Haki” linaweza kubeba maana za unyofu wa kimaadili na uadilifu wa hukumu, hivyo linahifadhi upana wa neno la Kiebrania bila kulifafanua kupita kiasi.
theological_decisions:
- issue: Maana ya דמים (“damu” kwa wingi) katika ungamo
  choice: hatia ya kumwaga damu
  alternative: umwagaji damu; matendo ya umwagaji damu
  rationale: Muktadha wa toba unaelekeza hasa kwenye hatia inayotokana na damu iliyomwagwa, si tu kuokolewa kutoka kwa watu wenye jeuri. Tanbihi inadumisha uwezekano wa kuitafsiri kama umwagaji damu.
- issue: Upana wa maana ya צִדְקָתֶךָ
  choice: haki yako
  alternative: uadilifu wako
  rationale: Neno la Kiebrania linaweza kuhusisha unyofu wa Mungu na haki yake ya kihukumu au ya kuokoa. “Haki” linaacha vipengele hivyo pamoja; tanbihi inaonyesha tafsiri mbadala bila kuondoa mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Ee Mungu” huhifadhi mwito wa moja kwa moja; “ulimi wangu” huhifadhi taswira ya Kiebrania. Kiunganishi “ndipo” kinaonyesha matokeo ya ombi kwa njia ya asili katika Kiswahili.
