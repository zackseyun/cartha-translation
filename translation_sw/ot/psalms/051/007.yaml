  text: Hakika, unapendezwa na kweli katika vilindi vya ndani[a], na katika mahali pa siri hunijulisha hekima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika utu wa ndani”; maneno ya Kiebrania ya “vilindi vya ndani” na “mahali pa siri” ni ya kishairi na yanaweza kurejelea undani wa mtu na kilichofichika.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Hakika
  rationale: Neno hili linatanguliza kauli yenye mkazo; “Hakika” ni la kawaida na lenye hadhi katika Kiswahili cha kishairi.
- source_word: אֱמֶת
  choice: kweli
  rationale: Huhifadhi maana ya ukweli, uaminifu na unyoofu wa ndani bila kuibana kuwa fundisho maalumu.
- source_word: חָפַצְתָּ
  choice: wapendezwa na
  rationale: Kitenzi kinaweza kumaanisha kupendezwa na au kutaka. “Wapendezwa na” hudumisha wazo la kuthamini na kutamani jambo.
- source_word: בַטֻּחוֹת
  choice: ndani kabisa
  rationale: Neno la kishairi hurejelea sehemu za ndani zilizofichika, yaani utu wa ndani; tafsiri hii ni ya asili huku ikihifadhi picha hiyo.
- source_word: וּבְסָתֻם
  choice: mahali pa siri
  rationale: Huhifadhi taswira ya kile kilichofichwa au kilichositirika na ulinganifu wake na utu wa ndani.
- source_word: חָכְמָה
  choice: hekima
  rationale: Ni tafsiri ya kawaida na sahihi ya hekima ya kimaadili na kiroho.
- source_word: תוֹדִיעֵנִי
  choice: hunijulisha
  rationale: Muundo wa kusababisha wa ידע una maana ya kunifanya nijue; “hunijulisha” ni wa asili na karibu na umbo la Kiebrania kuliko “hunifundisha”.
theological_decisions:
- issue: Aina ya kweli ambayo Mungu anaitaka ndani ya mtu
  choice: Mstari unaeleza kupendezwa kwa Mungu na kweli katika utu wa ndani na kumjulisha mwombaji hekima huko.
  alternative: Kutafsiri “kweli” hasa kuwa uaminifu wa agano au kujitambua kisaikolojia.
  rationale: Ushairi wa Kiebrania unaunganisha kweli ya ndani na hekima inayojulishwa na Mungu bila kuifunga maana hiyo katika mfumo maalumu wa mafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wenye hadhi lakini unaoeleweka kwa msomaji wa kawaida. Muundo “wapendezwa” unadumisha ladha ya zaburi bila kuwa wa kizamani kupita kiasi.
