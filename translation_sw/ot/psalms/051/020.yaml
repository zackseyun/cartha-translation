base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/020.yaml
  text: Then you will delight in righteous sacrifices[a], in burnt offerings and whole burnt offerings[c][b]; then bulls will be offered on your altar.
translation:
  language: sw
  text: Ndipo utapendezwa na dhabihu za haki[a], na sadaka za kuteketezwa na sadaka zinazoteketezwa kabisa[b]; ndipo mafahali watatolewa dhabihu juu ya madhabahu yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhabihu za uadilifu.”
    reason: lexical_alternative
  - marker: b
    text: Huenda maneno ya Kiebrania yakamaanisha “sadaka ya kuteketezwa kabisa”; yanaweza pia kutaja sadaka ya kuteketezwa na sadaka nzima.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְפֹּץ
  choice: utapendezwa na
  rationale: Kitenzi חפץ hapa huonyesha kupendezwa au kufurahia kitu; ‘utapendezwa na’ ni Kiswahili cha kawaida na chenye heshima katika muktadha wa ibada inayokubalika.
- source_word: זִבְחֵי צֶדֶק
  choice: dhabihu za haki
  rationale: Muundo wa Kiebrania ni ‘dhabihu za haki’; tafsiri hii inadumisha uwezekano wa kumaanisha dhabihu zinazotolewa kwa haki au zinazopatana na haki bila kuufupisha kuwa usahihi wa taratibu pekee.
- source_word: עוֹלָה
  choice: sadaka za kuteketezwa
  rationale: Hili ni neno la kawaida la dhabihu inayoteketezwa madhabahuni; ‘sadaka za kuteketezwa’ ni wazi na linaeleweka katika Kiswahili cha Biblia.
- source_word: וְכָלִיל
  choice: na sadaka zinazoteketezwa kabisa
  rationale: כָלִיל husisitiza ukamilifu au kuteketezwa kote. Tafsiri hii inalifanya liwe tofauti kwa kiasi na עוֹלָה, huku ikiacha wazi uwezekano wa maneno hayo kueleza sadaka moja kwa msisitizo.
- source_word: יַעֲלוּ
  choice: watakapotolewa juu ya
  rationale: Hifili ya עלה katika muktadha wa dhabihu humaanisha kuzipandisha au kuzitoa madhabahuni. ‘Watakapotolewa juu ya’ ni ya asili zaidi kwa wanyama huku ikihifadhi picha ya madhabahu.
- source_word: מִזְבַּחֲךָ
  choice: madhabahu yako
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya madhabahu ya Mungu anayesemeshwa.
- source_word: פָרִים
  choice: mafahali
  rationale: פָרִים ni mafahali wanaoweza kutolewa kama dhabihu; neno hili ni sahihi na la kawaida.
- source_word: אָז ... אָז
  choice: Ndipo ... ndipo
  rationale: Kurudia ‘ndipo’ kunadumisha mpangilio na matokeo yanayoonyeshwa na kurudiwa kwa אָז katika Kiebrania.
theological_decisions:
- issue: Uhusiano wa dhabihu zinazokubalika na msisitizo wa zaburi kuhusu moyo uliovunjika na kutubu
  choice: Aya inazungumzia ibada halisi ya dhabihu ambayo Mungu ataikubali katika hali ya urejesho.
  alternative: Kuzifanya dhabihu kuwa sitiari tu, au kutafsiri aya kana kwamba ibada ya dhabihu inakataliwa kabisa.
  rationale: Maandishi yanadumisha lugha halisi ya dhabihu na mvutano wake na aya zilizotangulia. Hayalazimishi hitimisho kwamba toba inaondoa dhabihu wala kwamba ibada ya nje peke yake inatosha.
- issue: Uhusiano kati ya עוֹלָה na כָלִיל
  choice: Kutaja ‘sadaka za kuteketezwa’ na ‘sadaka zinazoteketezwa kabisa’ kwa namna inayodumisha maneno yote mawili.
  alternative: 'Kuyakusanya kuwa usemi mmoja tu: ‘sadaka ya kuteketezwa kabisa.’'
  rationale: Kiebrania kina istilahi mbili zilizounganishwa kwa וְ; zinaweza kuwa aina mbili zilizo karibu au usemi wa msisitizo. Tafsiri kuu na tanbihi vinahifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. ‘Dhabihu’ limetumiwa kwa זבח na ‘sadaka’ kwa aina maalumu za matoleo ili sentensi ibaki wazi.
