  text: I will teach transgressors your ways[a], and sinners will return to you.
translation:
  language: sw
  text: Nitawafundisha waasi njia zako, nao wenye dhambi watarudi kwako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watakugeukia” au “watarejea kwako.” Kitenzi cha Kiebrania kinaweza kumaanisha kugeuka au kurudi.
