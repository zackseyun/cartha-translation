lexical_decisions:
- source_word: אֲלַמְּדָה
  choice: Nitawafundisha
  rationale: Kitenzi cha Hifili katika nafsi ya kwanza umoja kina nguvu ya azimio au kusudi katika muktadha huu; wakati ujao wa Kiswahili unaiwasilisha kwa kawaida.
- source_word: פֹשְׁעִים
  choice: waasi
  rationale: Neno linamaanisha watu wanaovunja uaminifu au kuasi kwa makusudi. “Waasi” ni la kawaida na huhifadhi uzito wa kimaadili na wa kiagano.
- source_word: דְּרָכֶיךָ
  choice: njia zako
  rationale: Wingi wa דֶּרֶךְ hapa unaashiria njia za Mungu, yaani mwenendo, mapenzi, au maagizo yake; sitiari ya “njia” imehifadhiwa.
- source_word: חַטָּאִים
  choice: wenye dhambi
  rationale: Ni tafsiri ya kawaida na ya kueleweka ya watu wanaotenda dhambi, huku ikidumisha ulinganifu na “waasi.”
- source_word: אֵלֶיךָ
  choice: -ku-
  rationale: Kiambishi cha yambwa katika “watakurudia” kinaeleza mwelekeo wa tendo kwa Mungu kwa Kiswahili cha kawaida.
- source_word: יָשׁוּבוּ
  choice: watakurudia
  rationale: שורש שוב inaweza kumaanisha kugeuka au kurudi. “Watakurudia” inafaa katika muktadha wa toba na urejesho, bila kufuta uwezekano wa maana ya kugeukia.
theological_decisions:
- issue: Lugha ya toba katika שוב
  choice: watakurudia
  alternative: watakugeukia / watarudi kwako
  rationale: Muktadha wa Zaburi ya toba unaunga mkono maana ya kurudi kwa Mungu, lakini Kiebrania pia kinaweza kumaanisha kugeukia. Tanbihi huhifadhi upana huo bila kuingiza mfumo maalumu wa mafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo mfupi wa kishairi na ulinganifu wa mistari umehifadhiwa.
