  yaml_path: translation/ot/psalms/051/005.yaml
  text: Against you—you alone—I have sinned[a], and I have done what is evil in your eyes[b], so that you may be justified in your words and blameless in your judgment.
translation:
  language: sw
  text: Dhidi yako—wewe peke yako—nimefanya dhambi[a], nami nimefanya lililo ovu machoni pako, ili uthibitike kuwa mwenye haki katika maneno yako na uwe bila lawama unapohukumu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Dhidi yako peke yako nimefanya dhambi.” Mpangilio wa Kiebrania unasisitiza Mungu kama yule anayekosewa.
    reason: lexical_alternative
  - marker: b
    text: Au, “ili uthibitike kuwa mwenye haki unaposema, na uwe safi unapohukumu.” Kiunganishi cha Kiebrania kinaweza kueleza kusudi au matokeo; kifungu cha mwisho kina maana ya kimahakama.
    reason: alternative_reading
lexical_decisions:
- source_word: לְךָ לְבַדְּךָ
  choice: Dhidi yako—wewe peke yako—
  rationale: Katika ungamo hili, לְ inaonyesha yule aliyekosewa. Vistari virefu vinadumisha mkazo wa marudio ya Kiebrania bila kupunguza kauli ya kwamba Mungu ndiye aliyekosewa kabisa.
- source_word: חָטָאתִי
  choice: nimefanya dhambi
  rationale: Kauli hii ni ungamo la tendo lililofanyika lenye uzito wa sasa; wakati timilifu wa Kiswahili unaeleza jambo hilo kwa kawaida.
- source_word: וְהָרַע בְּעֵינֶיךָ עָשִׂיתִי
  choice: nimefanya lililo ovu machoni pako
  rationale: Kivumishi chenye kibainishi kimetumiwa kama nomino, hivyo 'lililo ovu' ni cha asili na kinahifadhi tathmini ya kimaadili. 'Machoni pako' inadumisha taswira ya nahau ya Kiebrania.
- source_word: לְמַעַן
  choice: Kwa hiyo
  rationale: Katika muktadha huu kiunganishi kinaweza kueleza kusudi au matokeo. 'Kwa hiyo' huepuka kudokeza kwamba mtenda dhambi alitenda dhambi kwa kusudi la kumthibitisha Mungu, huku kikihifadhi uhusiano wa kimantiki.
- source_word: תִּצְדַּק בְדָבְרֶךָ
  choice: utaonekana kuwa mwenye haki katika maneno yako
  rationale: צדק hapa ina maana ya kuonekana au kuthibitishwa kuwa upande wa haki. Usemi huu unahifadhi maana ya kimahakama bila kupendekeza kwamba Mungu anahitaji kusamehewa au kufanywa mwenye haki.
- source_word: תִּזְכֶּה בְשָׁפְטֶךָ
  choice: kuwa safi unapohukumu
  rationale: זכה huonyesha kuwa safi, bila hatia, au upande wa haki. 'Unapohukumu' ni tafsiri ya asili ya muundo wenye בְ na inadumisha mazingira ya kimahakama.
theological_decisions:
- issue: Kauli ya kwamba dhambi ilifanywa dhidi ya Mungu peke yake licha ya kuwapo kwa watu walioathiriwa
  choice: Kudumisha kauli kamili 'Dhidi yako—wewe peke yako—'
  alternative: '''Dhidi yako kuliko wote'' au ''hasa dhidi yako'''
  rationale: Kiebrania hakiongezi kizuizi hicho. Tafsiri inadumisha mvutano wa kiteolojia na mkazo kwamba hatimaye dhambi humkosea Mungu, bila kukana kwa maelezo ya ziada kwamba wanadamu wanaweza kudhurika.
- issue: Maana ya לְמַעַן kuhusiana na haki ya Mungu
  choice: Kwa hiyo, utaonekana kuwa mwenye haki
  alternative: ili uhesabiwe kuwa mwenye haki
  rationale: Muundo unaweza kuonyesha kusudi au matokeo. Chaguo hili halisemi kwamba dhambi ya mwungamaji ilikuwa na kusudi la kumfanya Mungu kuwa mwenye haki, bali kwamba ungamo linadhihirisha haki ya maneno na hukumu ya Mungu.
- issue: Maana ya kimahakama ya haki na usafi wa Mungu
  choice: mwenye haki ... safi unapohukumu
  alternative: umehesabiwa haki ... bila lawama katika hukumu yako
  rationale: Maneno haya yanahifadhi ulinganifu wa kimahakama na kimaadili bila kuingiza mafundisho ya ziada au kudokeza kwamba Mungu alikuwa na hatia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. 'Lililo ovu' ni cha sasa na cha kimaadili; 'machoni pako' inadumisha taswira ya Kiebrania. Vistari virefu vinaweka mkazo wa kishairi wa 'wewe peke yako'.
