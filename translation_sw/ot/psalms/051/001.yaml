lexical_decisions:
- source_word: בְּבוֹא
  choice: wakati ... alipomjia
  rationale: בְּ pamoja na kitenzi-jina cha בוא huanzisha kishazi cha wakati; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: אֵלָיו
  choice: -m- katika “alipomjia”
  rationale: Kiambishi cha yambwa -m- huonyesha kwamba Nathani alimjia mtu huyo, huku kitenzi “-jia” kikihifadhi mwelekeo wa אֶל.
- source_word: נָתָן
  choice: Nathani
  rationale: Hili ni umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: הַנָּבִיא
  choice: nabii
  rationale: “Nabii” ni neno la kawaida la Kiswahili kwa התואר הזה; muktadha humtambulisha Nathani moja kwa moja bila kuhitaji neno jingine la uanishaji.
- source_word: כַּאֲשֶׁר
  choice: baada ya
  rationale: Katika muktadha huu linaonyesha kwamba kuingia kwa Bathsheba kulitokea kabla ya ujio wa Nathani.
- source_word: בָּא אֶל
  choice: kuingia kwa
  rationale: Muundo huu unahifadhi nahau ya Kiebrania inayotumia “kuingia kwa” mwanamke kumaanisha kufanya naye ngono, bila kuondoa lugha yake ya staha; tanbihi inaeleza maana.
- source_word: בַּת שָׁבַע
  choice: Bathsheba
  rationale: Hili ni umbo la kawaida la jina hili katika Kiswahili.
