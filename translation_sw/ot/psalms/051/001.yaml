  text: when Nathan the prophet came to him[a], after he had gone in to Bathsheba.
translation:
  language: sw
  text: wakati Nathani nabii alipomjia, baada ya kuingia kwa Bathsheba[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “kuingia kwa Bathsheba,” ni nahau inayomaanisha kufanya naye ngono.
