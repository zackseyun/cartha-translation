lexical_decisions:
- source_word: לֵב טָהוֹר
  choice: moyo safi
  rationale: “Moyo” huhifadhi taswira pana ya Kiebrania ya utu wa ndani, ikijumuisha nia, mawazo na hisia; “safi” inafaa muktadha wa utakaso wa zaburi hii na pia inaweza kueleweka kuwa “usio na uchafu” au “mtakatifu kimaadili.”
- source_word: בְּרָא לִי
  choice: niumbie
  rationale: Kitenzi ברא kinahusishwa hasa na tendo la Mungu la kuumba. Muundo “niumbie” ni wa kawaida katika Kiswahili na huwasilisha kwa pamoja ombi la uumbaji na wazo la “kwa ajili yangu/ndani yangu,” huku muktadha ukionyesha mabadiliko ya ndani.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Hii ni njia ya asili na yenye heshima ya kuonyesha mwito wa moja kwa moja kwa Mungu katika sala.
- source_word: רוּחַ נָכוֹן
  choice: roho thabiti
  rationale: “Roho” huhifadhi upana wa רוּחַ na ulinganifu wake na “moyo.” “Thabiti” huonyesha kitu kilichowekwa imara, kisichoyumba, ambalo ndilo wazo kuu la נָכוֹן hapa.
- source_word: חַדֵּשׁ
  choice: ufanye upya
  rationale: Usemi huu ni wa kawaida na unaeleweka, nao huhifadhi wazo la kufanywa mpya tena bila kulibana kuwa kurejeshwa tu katika hali ya awali.
- source_word: בְּקִרְבִּי
  choice: ndani yangu
  rationale: Huwasilisha wazi mahali pa ndani pa badiliko linaloombwa, kwa lugha ya sasa na ya kawaida.
theological_decisions:
- issue: Maana ya נָכוֹן katika רוּחַ נָכוֹן
  choice: roho thabiti
  alternative: roho nyofu / roho iliyo sawa
  rationale: Katika muktadha huu neno linaelekea zaidi kwenye uimara, uthabiti au hali iliyowekwa imara kuliko unyoofu wa kimaadili pekee. Tafsiri “thabiti” huhifadhi ombi la uaminifu wa ndani usioyumba bila kuondoa kabisa uwezekano wa maana ya usahihi au unyoofu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye hadhi ya kishairi na kinachoeleweka kwa urahisi. “Ee Mungu” hudumisha sauti ya sala; “niumbie” na “ufanye upya” ni miundo ya asili isiyo ya kizamani.
