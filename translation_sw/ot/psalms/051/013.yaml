  text: Restore to me the joy of your salvation[c][b][a], and let a willing spirit sustain me.
translation:
  language: sw
  text: Unirudishie furaha ya wokovu wako,[c] na roho iliyo tayari[a] initegemeze.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “roho ya ukarimu” au “roho adhimu.”
    reason: lexical_alternative
  - marker: b
    text: Au “inishikilie.”
    reason: lexical_alternative
