    reason: lexical_alternative
lexical_decisions:
- source_word: הָשִׁיבָה
  choice: Unirudishie
  rationale: Kauli ya kuamuru katika hifili inaomba Mungu aisababishe hali iliyokuwapo irudi; “unirudishie” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: לִּי
  choice: -ni- / -ie
  rationale: Kiwakilishi cha nafsi ya kwanza umoja kimeunganishwa kiasili katika kitenzi “unirudishie,” kikimtaja mpokeaji wa kurejeshewa.
- source_word: שְׂשׂוֹן
  choice: furaha
  rationale: Neno hili humaanisha furaha au shangwe; “furaha” ni fupi, wazi, na la kawaida katika muktadha huu wa sala.
- source_word: יִשְׁעֶךָ
  choice: wokovu wako
  rationale: “Wokovu” huhifadhi upana wa maana ya ישׁע kama kuokoa, bila kuifungia katika ukombozi wa muda mfupi pekee.
- source_word: וְרוּחַ
  choice: na roho
  rationale: Katika muktadha huu wa kishairi na wa hali ya ndani ya mtu, “roho” inafaa kuliko “upepo” au “pumzi,” huku kiunganishi kikihifadhi ombi la pili.
- source_word: נְדִיבָה
  choice: iliyo tayari
  rationale: Kivumishi kinaweza kumaanisha tayari, karimu, au adhimu. “Iliyo tayari” huonyesha mwelekeo wa hiari na utayari bila kuamua ikiwa roho inayotajwa ni ya Mungu au hali ya ndani ya mwombaji.
- source_word: תִסְמְכֵנִי
  choice: initegemeze
  rationale: Mzizi סמך humaanisha kutegemeza, kushikilia, au kudumisha. “Initegemeze” ni ombi la kawaida la Kiswahili na huhifadhi wazo la msaada unaoendelea.
theological_decisions:
- issue: Maana ya “wokovu wako” katika zaburi ya toba
  choice: wokovu wako
  alternative: ukombozi wako
  rationale: Kiebrania kinaweza kumaanisha wokovu au ukombozi. “Wokovu” huhifadhi upana wa uokoaji wa Mungu katika muktadha wa dhambi, utakaso, na kufanywa upya bila kuingiza mafundisho ya baadaye yasiyotajwa moja kwa moja.
- issue: Maana na mhusika wa “roho iliyo tayari”
  choice: roho iliyo tayari
  alternative: roho ya ukarimu; roho adhimu
  rationale: Tafsiri haibainishi kimabavu ikiwa hii ni Roho wa Mungu au hali ya ndani ya mwombaji. Pia huhifadhi maana kuu ya utayari, huku maana nyingine halali zikitolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo wa ombi umehifadhiwa, na utata halisi wa “roho” haujaondolewa.
