  text: 'Unifue kabisa[a] kutokana na uovu wangu[b],

    na unitakase[c] kutokana na dhambi yangu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Unioe sana,” “Unioe kwa wingi,” au “Unioe tena na tena.” Neno la Kiebrania linaweza kuonyesha kuoshwa kwa wingi au kwa nguvu sana.'
