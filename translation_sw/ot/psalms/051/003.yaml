lexical_decisions:
- source_word: הַרְבֵּה
  choice: kabisa
  rationale: Neno hili linatilia nguvu agizo linalofuata. “Kabisa” linaonyesha kiwango kikubwa cha kuoshwa kwa Kiswahili cha kawaida bila kulazimisha maana ya kurudiarudia.
- source_word: כַּבְּסֵנִי
  choice: unioshe
  rationale: Kitenzi hiki hutumiwa hasa kwa kuosha nguo; hapa kinadumisha taswira ya mwombaji kuoshwa kabisa kutokana na uchafu wa maadili.
- source_word: מֵעֲוֺנִי
  choice: na uovu wangu
  rationale: עָוֹן inaweza kumaanisha tendo ovu, hatia yake, au matokeo yake. “Uovu wangu” huhifadhi uzito wa kimaadili na utofauti wake na “dhambi yangu,” bila kuifunga maana katika hatia peke yake.
- source_word: וּמֵחַטָּאתִי
  choice: na dhambi yangu
  rationale: חַטָּאת katika muktadha huu wa toba humaanisha dhambi. Tafsiri hii ni ya moja kwa moja na hudumisha ulinganifu wa kishairi na “uovu wangu.”
- source_word: טַהֲרֵנִי
  choice: unitakase
  rationale: טהר humaanisha kufanya safi au takatifu, ikiwa na mwangwi wa usafi wa kiibada na wa kimaadili. “Unitakase” huhifadhi upana huo kwa lugha ya kawaida ya Biblia ya Kiswahili.
theological_decisions:
- issue: Kutafsiri maneno mawili ya toba עָוֹן na חַטָּאת
  choice: Kutumia maneno tofauti, “uovu” na “dhambi,” katika matini kuu.
  alternative: Kutafsiri yote mawili kwa neno la jumla kama “dhambi,” au kutafsiri עָוֹן kama “hatia.”
  rationale: Kiebrania kinatumia maneno mawili yanayohusiana lakini yasiyofanana katika ulinganifu wa kishairi. Kuyatofautisha huhifadhi muundo na upana wa maana wa chanzo bila kuamua kwamba עָוֹן hapa ni hatia tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo “unioshe ... na uovu wangu” unadumisha taswira na kihusishi cha chanzo cha Kiebrania, huku tanbihi zikihifadhi uwezekano wa maana nyingine.
