  text: הֵיטִ֣יבָ/ה בִ֭/רְצוֹנְ/ךָ אֶת צִיּ֑וֹן תִּ֝בְנֶ֗ה חוֹמ֥וֹת יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/019.yaml
  text: In your good pleasure[a], do good to Zion[b]; build up the walls of Jerusalem.
translation:
  language: sw
  text: Kwa kibali chako[a], uitendee Sayuni mema; ujenge[b] kuta za Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa wema wako” au “kulingana na mapenzi yako.”
