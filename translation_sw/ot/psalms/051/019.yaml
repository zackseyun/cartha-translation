  - marker: b
    text: Au “ujenge upya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיבָה
  choice: uitendee mema
  rationale: Ombi hili la moja kwa moja linadumisha maana ya Hiphil ya יטב, yaani Mungu atende jambo lenye manufaa kwa Sayuni, bila kuongeza wazo maalumu zaidi la kuisitiri au kuifanikisha.
- source_word: בִּרְצוֹנְךָ
  choice: kwa wema wako
  rationale: רָצוֹן inaweza kumaanisha kibali, nia njema, au mapenzi. “Kwa wema wako” ni Kiswahili cha kawaida kinachoonyesha kibali na nia njema ya Mungu, huku tanbihi ikihifadhi uwezekano wa maana ya mapenzi.
- source_word: אֶת צִיּוֹן
  choice: Sayuni
  rationale: Sayuni ndiyo yambwa ya kitendo na mnufaika wa mema yanayoombwa; muundo wa Kiswahili “uitendee mema Sayuni” unaonyesha uhusiano huo kwa kawaida.
- source_word: תִּבְנֶה
  choice: ujenge
  rationale: Qal imperfect hapa ina nguvu ya ombi au matakwa baada ya amri. “Ujenge” haiongezi bila lazima maana mahsusi ya kujenga upya, ingawa muktadha unaweza kuiruhusu.
- source_word: חוֹמוֹת
  choice: kuta
  rationale: Neno hili linamaanisha kuta za mji; “kuta” ni tafsiri ya moja kwa moja na inayoeleweka kuliko neno pana kama “ngome.”
- source_word: יְרוּשָׁלִָם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
theological_decisions:
- issue: Uhusiano kati ya kibali/mapenzi ya Mungu na kurejeshwa kwa Sayuni
  choice: Mstari umetafsiriwa kama sala kwamba wema au kibali cha Mungu kizae tendo halisi la kuinufaisha Sayuni na kuzijenga kuta za Yerusalemu.
  alternative: “Kwa mapenzi yako, uitendee mema Sayuni,” ambayo hukazia zaidi uamuzi wa Mungu kuliko kibali au nia yake njema.
  rationale: רָצוֹן hubeba maana za kibali, nia njema, na mapenzi. Matini kuu inadumisha hali ya sala na wema wa Mungu, na tanbihi inaacha maana nyingine halali wazi bila kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ombi “uitendee mema” ni wa kawaida na wa moja kwa moja; viambishi vya hali ya utegemezi vinaonyesha maombi mawili yanayoelekezwa kwa Mungu.
