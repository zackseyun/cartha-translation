base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/006.yaml
  text: Behold[a], in iniquity I was brought forth[c][b], and in sin my mother conceived me.
translation:
  language: sw
  text: Tazama,[a] nilizaliwa katika uovu,[b][c] na katika dhambi mama yangu alinichukua mimba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Hakika” au “Naam.”
    reason: lexical_alternative
  - marker: b
    text: Au “nililetwa duniani.”
    reason: lexical_alternative
  - marker: c
    text: Mstari huu hueleweka ama kama ungamo la hali ya dhambi tangu kutungwa mimba, ama kama lugha ya kishairi yenye mkazo katika toba; Kiebrania chenyewe hakiamui mjadala huo kikamilifu.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Chembe hii inatanguliza kauli yenye mkazo. “Tazama” inadumisha uzito wa kishairi na mkazo wa Kiebrania; “Hakika” pia inawezekana.
- source_word: בְּעָוֹן
  choice: katika uovu
  rationale: עָוֹן huonyesha uovu au hatia. “Katika uovu” inadumisha kihusishi na uzito wa kimaadili bila kuamua ikiwa mkazo ni hatia, upotovu, au hali ya dhambi.
- source_word: חוֹלָלְתִּי
  choice: nilizaliwa
  rationale: Katika muktadha huu kitenzi kinaashiria kuletwa duniani kwa kuzaliwa. “Nilizaliwa” ni Kiswahili cha kawaida na wazi, bila kutumia usemi mzito usio wa lazima.
- source_word: וּבְחֵטְא
  choice: na katika dhambi
  rationale: Tafsiri hii inadumisha kihusishi na usambamba wa kishairi na “katika uovu,” bila kuongeza ufafanuzi wa kiteolojia.
- source_word: יֶחֱמַתְנִי
  choice: mama yangu alinichukua mimba
  rationale: Kitenzi hapa kinaeleweka vyema kuwa kutungwa mimba. Usemi huu ni wa kawaida katika Kiswahili cha Afrika Mashariki na unaendana na picha ya kuzaliwa katika mstari wa kwanza.
- source_word: אִמִּי
  choice: mama yangu
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya nomino yenye kiambishi cha umilikaji.
theological_decisions:
- issue: Ikiwa mstari unafundisha dhambi binafsi ya mama, hali ya ndani ya mtunga zaburi tangu kutungwa mimba, au lugha ya kishairi iliyotiwa chumvi katika toba
  choice: Kutafsiri kauli ya Kiebrania moja kwa moja, ikihusisha kutungwa mimba na kuzaliwa kwa mtunga zaburi na dhambi bila kufafanua mfumo wa kiteolojia.
  alternative: Kuieleza kuwa dhambi ya mama katika tendo la kutunga mimba; au fundisho mahususi la hali ya dhambi tangu kutungwa mimba; au chumvi ya kishairi tu.
  rationale: Kiebrania kinahusianisha kuwepo kwa mtunga zaburi tangu kutungwa mimba na kuzaliwa na עָוֹן pamoja na חֵטְא, lakini hakielezi kwa ukamilifu namna au mfumo wa mafundisho unaohusika. Tanbihi inadumisha mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Usambamba wa “katika uovu / katika dhambi” umehifadhiwa, huku “alinichukua mimba” likitoa maana kwa lugha ya kawaida na yenye staha.
