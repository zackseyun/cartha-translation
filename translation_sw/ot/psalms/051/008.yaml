base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/008.yaml
  text: Purify me with hyssop[a], and I will be clean; wash me, and I will be whiter than snow.
translation:
  language: sw
  text: Unitakase kwa hisopo[a], nami nitakuwa safi; unioshe, nami nitakuwa mweupe kuliko theluji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Unisafishe kwa hisopo.” Kitenzi cha Kiebrania kinahusiana na dhambi na utakaso, na hapa kinaibua taswira ya utakaso wa kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַטְּאֵנִי
  choice: Unitakase
  rationale: Katika kauli ya Piel, kitenzi hiki kina maana ya kuondoa dhambi au unajisi na hivyo kumtakasa mtu, si kumfanya atende dhambi. “Unitakase” ni Kiswahili cha kawaida kinachohifadhi maana ya utakaso wa kiibada na wa kimaadili.
- source_word: בְאֵזוֹב
  choice: kwa hisopo
  rationale: Hisopo ilikuwa mmea uliotumiwa katika taratibu za kunyunyiza kwa ajili ya utakaso. Kihusishi בְּ kinaonyesha chombo au njia iliyotumiwa, hivyo “kwa hisopo” ni tafsiri ya moja kwa moja na ya asili.
- source_word: וְאֶטְהָר
  choice: nami nitakuwa safi
  rationale: Kitenzi טהר humaanisha kuwa safi au kutakasika, mara nyingi katika mazingira ya kiibada au kimaadili. “Nitakuwa safi” huhifadhi matokeo yanayotarajiwa na kuendana na taswira ya kuoshwa.
- source_word: תְּכַבְּסֵנִי
  choice: unioshe
  rationale: כבס hutumiwa hasa kuhusu kufua nguo, lakini hapa imetumiwa kishairi kuhusu mwombaji mwenyewe. “Unioshe” ni ya asili na inahifadhi sitiari ya kusafishwa kabisa.
- source_word: וּמִשֶּׁלֶג
  choice: kuliko theluji
  rationale: Kihusishi מִן kina maana ya ulinganisho katika muktadha huu, yaani weupe unaozidi ule wa theluji.
- source_word: אַלְבִּין
  choice: nitakuwa mweupe
  rationale: Hiphil ya לבן hapa huonyesha matokeo ya kuwa au kufanywa mweupe. Pamoja na usemi wa ulinganisho, “nitakuwa mweupe kuliko theluji” huwasilisha maana hiyo kwa Kiswahili cha asili.
theological_decisions:
- issue: Taswira ya utakaso wa kiibada inayotumiwa kuhusu dhambi ya kimaadili
  choice: Kuhifadhi wazi maneno “Unitakase kwa hisopo”
  alternative: Kunisafisha kwa ujumla bila kutaja hisopo
  rationale: Kutaja hisopo huhifadhi rejeo la taratibu za utakaso katika Israeli na kuonyesha ombi la mwombaji la kuondolewa dhambi na unajisi. Tafsiri haibadili taswira hiyo kuwa kauli ya jumla kuhusu msamaha wala kuingiza fundisho la baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Hisopo” limehifadhiwa kwa kuwa ni jina la mmea wenye umuhimu katika taratibu za utakaso; sentensi sambamba na marudio ya “nami nitakuwa” yanadumisha muundo wa shairi la Kiebrania.
