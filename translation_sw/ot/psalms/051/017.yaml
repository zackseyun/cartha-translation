  text: For you do not delight in sacrifice[a], or I would give it; you do not take pleasure in burnt offering.
translation:
  language: sw
  text: Kwa maana hupendezwi na dhabihu[a], la sivyo ningekutolea; sadaka ya kuteketezwa haikupendezi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa sababu hutamani dhabihu, la sivyo ningetoa.” Kiunganishi na mpangilio wa kishazi katika Kiebrania huruhusu tafsiri hii iliyo rasmi zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza sababu ya kauli iliyotangulia na kudumisha mtiririko wa hoja wa zaburi.
- source_word: לֹא תַחְפֹּץ
  choice: hupendezwi na
  rationale: Huonyesha kutofurahia au kutotamani, si kukataa kwa maana ya kiibada pekee.
- source_word: זֶבַח
  choice: dhabihu
  rationale: Ni istilahi ya kawaida na yenye hadhi kwa sadaka ya kiibada inayotolewa kwa kuchinja.
- source_word: וְאֶתֵּנָה
  choice: la sivyo ningekutolea
  rationale: Waw inafasiriwa kwa maana ya matokeo/kinyume inayodokezwa na muktadha; kiwakilishi cha mpokeaji kinaeleweka kuwa Mungu, na kitu kinachotolewa ni dhabihu iliyotajwa.
- source_word: עוֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Ni istilahi inayoeleweka kwa sadaka inayoteketezwa yote, bila kufanya mstari kuwa mzito kwa maelezo ya ziada.
- source_word: לֹא תִרְצֶה
  choice: haikupendezi
  rationale: Hudumisha wazo la kutokuwa na kibali au furaha kwa sadaka, huku muundo wa Kiswahili ukibaki wa kawaida.
theological_decisions:
- issue: Maana ya mstari kuhusu dhabihu
  choice: 'Kauli imeachwa moja kwa moja: katika hali ya toba ya mtunga-zaburi, dhabihu si kile kinachompendeza Mungu.'
  alternative: Kuufanya kuwa ukatali wa jumla wa mfumo wote wa dhabihu.
  rationale: Muktadha wa Zaburi 51 unasisitiza kutotosha kwa ibada ya nje bila moyo ufaao; tafsiri haiongezi dai la kwamba dhabihu zote zimefutwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Dhabihu” na “sadaka ya kuteketezwa” huhifadhi msamiati wa kiibada, huku “la sivyo ningekutolea” ikiwasilisha uhusiano wa masharti unaodokezwa bila kuufanya kuwa kauli kali kuliko Kiebrania.
