  text: זִֽבְחֵ֣י אֱלֹהִים֮ ר֪וּחַ נִשְׁבָּ֫רָ֥ה לֵב נִשְׁבָּ֥ר וְ/נִדְכֶּ֑ה אֱ֝לֹהִ֗ים לֹ֣א תִבְזֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/018.yaml
  text: The sacrifices of God are a broken spirit[a]; a broken and crushed heart, O God[b], you will not despise.
translation:
  language: sw
  text: Dhabihu za Mungu ni roho iliyovunjika[a]; moyo uliovunjika na kupondwa[b], Ee Mungu, hutaudharau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho yenye majuto.”
    reason: lexical_alternative
  - marker: b
    text: Au, “moyo uliovunjika na wenye majuto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זִבְחֵי אֱלֹהִים
  choice: Dhabihu za Mungu
  rationale: Muundo wa umilikishi katika Kiebrania unasema moja kwa moja ‘dhabihu za Mungu.’ Tafsiri hii inadumisha usemi huo na pia inaacha muktadha uonyeshe kwamba hizi ndizo dhabihu anazozikubali Mungu.
- source_word: רוּחַ נִשְׁבָּרָה
  choice: roho iliyovunjika
  rationale: רוּחַ ni ‘roho,’ na umbo la kitenzi שבר linaonyesha hali ya kuvunjwa. Usemi huu unahifadhi sitiari halisi bila kuifasiri kimya kimya kuwa toba au majuto.
- source_word: לֵב נִשְׁבָּר
  choice: moyo uliovunjika
  rationale: Tafsiri ya moja kwa moja ya לֵב ‘moyo’ na נִשְׁבָּר ‘uliovunjika’; pia inadumisha urudiaji wa mzizi uleule uliotumiwa kuhusu roho.
- source_word: וְנִדְכֶּה
  choice: na kupondwa
  rationale: Mzizi דכה una wazo la kupondwa au kushushwa chini. ‘Kupondwa’ inadumisha picha halisi na kusawazisha ‘uliovunjika,’ huku maana ya majuto ikiwekwa katika tanbihi kama uwezekano wa kimuktadha.
- source_word: לֹא תִבְזֶה
  choice: hutaudharau
  rationale: בזה humaanisha kudharau au kuona kuwa kitu hakifai. ‘Hutaudharau’ ni ya asili katika Kiswahili na kiambishi cha yambwa kinaurejelea moyo uliotajwa.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hii ndiyo tafsiri ya kawaida hapa, katika usemi wa umilikishi na pia katika mwito wa moja kwa moja ‘Ee Mungu.’
theological_decisions:
- issue: Lugha ya kisitiari kuhusu dhabihu katika muktadha wa toba
  choice: Mstari unataja roho na moyo uliovunjika na kupondwa kuwa dhabihu za Mungu, bila kuongeza kwamba mfumo wa dhabihu umeondolewa kabisa.
  alternative: Kutafsiri kwa ufafanuzi kuwa hizi ni ‘dhabihu zinazokubalika kwa Mungu,’ au kudai kwamba dhabihu zote za nje zimebatilishwa.
  rationale: Kiebrania kinaunganisha ‘dhabihu za Mungu’ na hali ya ndani ya mtu. Tafsiri inadumisha sitiari na mvutano wa kiteolojia, huku ikiacha muktadha mpana wa Zaburi uonyeshe uhusiano wake na toba na ibada ya nje.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Ee Mungu’ ni mwito wa kawaida wa kishairi; sitiari za kuvunjika na kupondwa zimehifadhiwa badala ya kubadilishwa kuwa ufafanuzi wa kimadhehebu.
