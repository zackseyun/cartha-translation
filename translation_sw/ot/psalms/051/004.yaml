  language: sw
  text: Kwa maana mimi nayajua maasi yangu, na dhambi yangu iko mbele yangu daima.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huanzisha sababu au maelezo ya ombi lililotangulia, na ni kiunganishi cha kawaida na chenye hadhi katika Kiswahili.
- source_word: פְשָׁעַי
  choice: makosa yangu
  rationale: Neno hili humaanisha matendo ya kuvunja mipaka au uasi. “Makosa” ni la kawaida na lina uzito wa kimaadili katika muktadha huu, bila kulifanya neno hilo limaanishe tu hali ya jumla ya dhambi.
- source_word: אֲנִי אֵדָע
  choice: mimi nayajua
  rationale: Kiwakilishi huru אֲנִי kinaweka msisitizo kwa msemaji; “mimi” kinahifadhi msisitizo huo. Kitenzi kinaonyesha ufahamu wa binafsi, hivyo “nayajua” ni tafsiri ya moja kwa moja kuliko kuongeza wazo la kukiri.
- source_word: וְחַטָּאתִי
  choice: na dhambi yangu
  rationale: Katika muktadha wa maungamo, חטאת humaanisha dhambi, si sadaka ya dhambi. Umoja umehifadhiwa kama ulivyo katika Kiebrania.
- source_word: נֶגְדִּי
  choice: iko mbele yangu
  rationale: Huhifadhi taswira ya dhambi kuwa mbele ya macho au katika uwepo wa msemaji.
- source_word: תָמִיד
  choice: daima
  rationale: Huonyesha kuendelea bila kukoma; “daima” ni la asili, fupi, na lenye hadhi katika ushairi wa Kiswahili.
theological_decisions:
- issue: Uhusiano kati ya פְשָׁעַי (makosa yangu) na חַטָּאתִי (dhambi yangu)
  choice: 'Kuhifadhi istilahi mbili tofauti: “makosa yangu” na “dhambi yangu”'
  alternative: Kuyatafsiri yote kwa neno moja, kama “dhambi zangu”
  rationale: Kiebrania kinatumia maneno mawili yanayohusiana lakini yasiyofanana. Kuyatofautisha kunahifadhi undani wa maungamo na muundo wa kishairi bila kuingiza fundisho maalumu la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi ni mfupi na wazi; “mimi” limetumiwa makusudi kuhifadhi msisitizo wa kiwakilishi cha Kiebrania.
