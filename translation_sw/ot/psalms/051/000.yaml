lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza wa waimbaji
  rationale: Neno hili katika vichwa vya zaburi humaanisha kiongozi au msimamizi wa uimbaji wa ibada. Kihusishi “kwa” kinaakisi לַ bila kulazimisha kama kichwa hiki kinaelekezwa kwake au kimetengwa kwa matumizi yake.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ni jina la kawaida la utanzu wa wimbo wenye uhusiano na uimbaji au ala za muziki; “zaburi” ni neno lililozoeleka na sahihi katika Kiswahili.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Muundo wenye לְ na jina la mtu unaweza kuonyesha uandishi, uhusiano, umiliki, au kuwekwa wakfu. “Ya Daudi” huhifadhi upana huo kuliko “iliyoandikwa na Daudi.”
theological_decisions:
- issue: Maana ya kichwa cha Kidaudi
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi; kwa ajili ya Daudi
  rationale: Kiebrania hakilazimishi uhusiano mmoja tu kati ya zaburi na Daudi. Tafsiri “ya Daudi” huhifadhi uwezekano wa uandishi, uhusiano, au kuwekwa wakfu bila kuamua zaidi ya ushahidi wa matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye hadhi unaofaa kichwa cha zaburi. “Mwongoza wa waimbaji” ni wazi kwa msomaji wa kawaida, huku tanbihi ikitoa tafsiri pana zaidi ya kimuziki.
