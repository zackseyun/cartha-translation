base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/002.yaml
  text: Be gracious to me[a], God, according to your steadfast love; according to your abundant mercies[c][b], blot out my transgressions.
translation:
  language: sw
  text: Unifadhili[a], Ee Mungu, kwa kadiri ya upendo wako mwaminifu[b]; kwa wingi wa huruma zako[c], uyafute maasi yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nifanyie neema,” au “Unirehemu.” Kitenzi cha Kiebrania kinaomba kibali au neema, lakini matini kuu hukitofautisha na maneno ya “upendo mwaminifu” na “huruma” yanayofuata.
    reason: lexical_alternative
  - marker: b
    text: “Upendo mwaminifu” hutafsiri neno la Kiebrania hesed, ambalo mara nyingi humaanisha upendo wa uaminifu na wa kudumu, unaohusiana na agano.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa ukubwa wa huruma zako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Unifadhili
  rationale: Kitenzi cha ombi kinaomba kibali au neema. “Unifadhili” kinatofautisha neno hili na רחמים (“huruma”) linalotokea baadaye, ingawa katika Kiswahili cha kawaida linaweza pia kueleweka kama ombi la kutendewa kwa neema.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Ni usemi wa kumwita Mungu moja kwa moja; “Ee” huonyesha mwito kwa Kiswahili cha heshima na cha kishairi.
- source_word: כְּחַסְדֶּךָ
  choice: kwa kadiri ya upendo wako thabiti
  rationale: חסד huonyesha upendo wenye uaminifu na udumifu. “Upendo wako thabiti” linafikisha maana hiyo bila kutumia istilahi nzito ya kidini; “kwa kadiri ya” linaonyesha kwamba ombi linategemea tabia hiyo ya Mungu.
- source_word: כְּרֹב
  choice: kwa wingi wa
  rationale: רֹב inaweza kumaanisha wingi au ukubwa. “Kwa wingi wa” ni ya asili inapounganishwa na nomino ya wingi “huruma zako” na huhifadhi wazo la wingi.
- source_word: רַחֲמֶיךָ
  choice: huruma zako
  rationale: Umbo la Kiebrania ni la wingi na huonyesha matendo au maonyesho mengi ya huruma yenye kina. Kiswahili kinakubali “huruma zako” katika mtindo huu wa kishairi.
- source_word: מְחֵה
  choice: uyafute
  rationale: מחה humaanisha kufuta, kuondoa kabisa, au kupangusa. “Uyafute” huhifadhi sitiari ya kuondoa maandishi au kumbukumbu.
- source_word: פְשָׁעַי
  choice: makosa yangu
  rationale: פשע huonyesha kosa zito lenye hali ya uasi au kuvunja mamlaka. “Makosa yangu” ni wazi na ya kawaida kwa wasomaji, huku tanbihi ikihifadhi uwezekano wenye nguvu zaidi wa “maasi yangu.”
theological_decisions:
- issue: Kutafsiri maneno yanayohusiana חנן / חסד / רחמים
  choice: 'Kutumia misemo tofauti: “Unifadhili,” “upendo wako thabiti,” na “huruma zako.”'
  alternative: Kutumia “huruma” au “rehema” kwa maneno yote matatu.
  rationale: Kiebrania kinakusanya maneno yanayohusiana lakini yasiyofanana kabisa kuhusu fadhili, upendo mwaminifu, na huruma ya Mungu. Kuyatofautisha kunahifadhi utajiri wa kishairi na wa kiteolojia bila kuyafanya yote yawe dhana moja.
- issue: Nguvu ya neno פשע
  choice: “makosa yangu” katika matini, pamoja na tanbihi “maasi yangu.”
  alternative: “maasi yangu” moja kwa moja katika matini.
  rationale: “Makosa” ni ya asili na yanaeleweka kwa urahisi katika Kiswahili cha sasa, lakini yanaweza kuwa mepesi kuliko פשע. Tanbihi inahifadhi maana ya kuvunja mamlaka au kuasi iliyomo katika neno la chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Ee Mungu” hudumisha mwito wa moja kwa moja. Misemo mitatu ya fadhili na huruma imetofautishwa kwa makusudi ili kuhifadhi tabaka za msamiati wa Kiebrania.
