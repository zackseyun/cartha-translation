  text: Lord, open my lips, and my mouth will declare your praise.
translation:
  language: sw
  text: Ee Bwana, fungua midomo yangu, na kinywa changu kitatangaza sifa zako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Ee Bwana
  rationale: Ni cheo cha Mungu katika usemi wa moja kwa moja. “Ee Bwana” ni mwito wa kawaida, wenye heshima, na hauongezi neno “Mungu” ambalo halipo katika Kiebrania.
- source_word: שְׂפָתַי
  choice: midomo yangu
  rationale: Huhifadhi taswira halisi ya kiungo cha mwili na wingi wa neno la Kiebrania, huku ikiwa Kiswahili cha kawaida.
- source_word: תִּפְתָּח
  choice: fungua
  rationale: Ingawa kimuundo ni hali isiyotimilika, katika sala hii hufanya kazi kama ombi la moja kwa moja; amri “fungua” huiwasilisha kwa ufasaha.
- source_word: וּפִי
  choice: na kinywa changu
  rationale: Huhifadhi kiunganishi “na” pamoja na ulinganifu wa “midomo yangu” na “kinywa changu,” bila kuongeza wazo la matokeo lisilotajwa wazi.
- source_word: יַגִּיד
  choice: kitatangaza
  rationale: Hiphil ya נגד humaanisha kutangaza au kufanya jambo lijulikane. Wakati ujao unaonyesha jambo litakalofuata baada ya ombi la kufunguliwa midomo.
- source_word: תְּהִלָּתֶךָ
  choice: sifa zako
  rationale: Neno ni “sifa” likiwa na kiambishi cha nafsi ya pili umoja; wingi “sifa zako” ni usemi wa asili katika Kiswahili na humwelekeza Mungu kama anayesifiwa.
theological_decisions:
- issue: Kutafsiri cheo cha Mungu katika mwito wa moja kwa moja
  choice: Ee Bwana
  alternative: Ee Bwana wangu
  rationale: אֲדֹנָי ni cheo cha heshima kinachotumiwa kwa Mungu. “Ee Bwana” hutafsiri cheo hicho bila kukichanganya na jina la agano YHWH; kutotumia “wangu” pia kunafuata matumizi ya kawaida ya Kiswahili katika mwito huu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala. Ulinganifu wa kishairi kati ya “midomo yangu” na “kinywa changu” umehifadhiwa.
