base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/009.yaml
  text: Let me hear joy and gladness[c][b][a]; let the bones you have crushed rejoice.
translation:
  language: sw
  text: Unifanye nisikie shangwe na furaha; mifupa uliyoiponda ishangilie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mifupa uliyoivunja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשְׁמִיעֵנִי
  choice: Unifanye nisikie
  rationale: Hifili ya שׁמע pamoja na kiambishi cha nafsi ya kwanza umoja ina maana ya kusababisha kusikia. Kiswahili hiki kinahifadhi wazi maana ya kisababishi na ombi linaloelekezwa kwa Mungu.
- source_word: שָׂשׂוֹן
  choice: shangwe
  rationale: Neno hili huonyesha furaha yenye kufurikwa au kushangilia; “shangwe” linatofautisha kwa kawaida jozi ya kishairi na neno linalofuata.
- source_word: וְשִׂמְחָה
  choice: na furaha
  rationale: שִׂמְחָה ni furaha au kufurahi. “Furaha” ni neno la kawaida, la heshima, na linafaa pamoja na “shangwe.”
- source_word: תָּגֵלְנָה
  choice: na ishangilie
  rationale: Kauli isiyotimilifu ya nafsi ya tatu wingi wa kike inaweza kuwa na nguvu ya ombi au tamanio katika usambamba huu wa kishairi. “Na ishangilie” huiwasilisha kwa asili katika Kiswahili.
- source_word: עֲצָמוֹת
  choice: mifupa
  rationale: Kiebrania kinasema tu “mifupa,” bila kiambishi wazi cha umilikaji. Tafsiri haiongezi “yangu,” ingawa muktadha unaonyesha kuwa ni mifupa ya mtunga zaburi.
- source_word: דִּכִּיתָ
  choice: uliyoiponda
  rationale: Kitenzi דכה kinaonyesha kuponda au kuvunja kabisa. “Kuponda” kinahifadhi nguvu ya sitiari na kauli ya moja kwa moja kwamba Mungu ndiye aliyetenda hivyo.
theological_decisions:
- issue: Mateso yanahusishwa moja kwa moja na tendo la Mungu
  choice: mifupa uliyoiponda
  alternative: mifupa iliyopondwa; mifupa uliyoivunja
  rationale: Kitenzi cha nafsi ya pili umoja katika Kiebrania kinamwelekea Mungu moja kwa moja na kumhusisha na kupondwa kwa mifupa. Tafsiri inadumisha mvutano huo wa kitheolojia bila kupunguza au kuficha utendaji wa Mungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Unifanye nisikie” kinahifadhi usababishi wa Kiebrania; “shangwe na furaha” kinatunza jozi ya kishairi; na umoja wa kisarufi katika “ishangilie” unakubaliana na ngeli ya Kiswahili ya “mifupa.”
