base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/010.yaml
  text: Hide your face from my sins[b][a], and blot out all my iniquities.
translation:
  language: sw
  text: Ufiche uso wako usiziangalie dhambi zangu, na uyafute[a] maovu[b] yangu yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uyapanguse” au “uyaondoe kabisa.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “maovu” linaweza pia kumaanisha “hatia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְתֵּר
  choice: Ufiche
  rationale: Kitenzi hiki ni amri ya ombi kutoka mzizi סתר, ‘ficha.’ ‘Ufiche’ kinahifadhi taswira halisi ya Kiebrania na kinafaa katika sala ya unyenyekevu.
- source_word: פָּנֶיךָ
  choice: uso wako
  rationale: Neno פנים humaanisha kihalisi ‘uso’ na hapa linaonyesha kwa lugha ya kibinadamu jinsi Mungu anavyoelekeza uangalifu wake. Tafsiri hii inahifadhi taswira ya Kiebrania.
- source_word: מֵחֲטָאָי
  choice: mbali na dhambi zangu
  rationale: חטא humaanisha dhambi au makosa. ‘Dhambi zangu’ ni tafsiri ya moja kwa moja; ‘mbali na’ huwasilisha kihusishi מִן kwa Kiswahili cha kawaida pamoja na kitenzi ‘ficha.’
- source_word: וְכָל
  choice: na ... yote
  rationale: Muundo huu unaunganisha ombi la pili na kusisitiza kwamba hakuna ovu linaloachwa.
- source_word: עֲוֺנֹתַי
  choice: maovu yangu
  rationale: עָוֹן inaweza kumaanisha uovu, kosa, au hatia inayotokana nalo. ‘Maovu’ kinatofautisha neno hili na ‘dhambi’ katika kishazi cha kwanza bila kulipa maana ya kitaalamu isiyolazimishwa na matini.
- source_word: מְחֵה
  choice: uyafute
  rationale: Amri ya מחה ina maana ya kufuta, kupangusa, au kuondoa kabisa. ‘Uyafute’ ni ya kawaida na hudumisha taswira ya kuondoa yaliyoandikwa au alama iliyopo.
theological_decisions:
- issue: Kuhifadhi maneno mawili tofauti yanayohusu dhambi
  choice: Kutafsiri חטא kuwa ‘dhambi’ na עָוֹן kuwa ‘maovu’
  alternative: Kutafsiri maneno yote mawili kuwa ‘dhambi,’ au kutafsiri עָוֹן kuwa ‘hatia’
  rationale: Kiebrania kinatumia maneno mawili tofauti katika mistari inayolingana. Kuyatofautisha hudumisha uzito wa kishairi bila kudai kwamba yana tofauti maalumu ya kimafundisho; tanbihi inahifadhi uwezekano wa maana ‘hatia.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa urahisi. Muundo ‘ufiche uso wako mbali na’ umechaguliwa ili kuhifadhi sitiari ya Kiebrania huku ukibaki wazi kwa msomaji wa sasa.
