lexical_decisions:
- source_word: גַּם שָׁם
  choice: hata huko
  rationale: Huwasilisha msisitizo wa ‘even there’ kwa Kiswahili cha kawaida na kudumisha uhusiano na mahali palipotajwa katika muktadha.
- source_word: תַנְחֵנִי
  choice: utaniongoza
  rationale: Kitenzi נחה katika muundo huu humaanisha kuongoza; wakati ujao unafaa kwa mfuatano wa kishairi wa mstari.
- source_word: יְמִינֶךָ
  choice: mkono wako wa kuume
  rationale: Hudumisha taswira halisi ya ‘mkono wa kuume’ badala ya kuibadili kuwa wazo la nguvu pekee.
- source_word: וְתֹאחֲזֵנִי
  choice: utanishika imara
  rationale: אחז humaanisha kushika au kukamata; ‘imara’ huonyesha wazo la kushikilia kwa uthabiti bila kuongeza maana ya kuzuia isiyolazimu.
theological_decisions:
- issue: Ikiwa mkono wa Mungu unaoongoza na kushika ufasiriwe kimajazi
  choice: Taswira ya ‘mkono’ na ‘mkono wa kuume’ imehifadhiwa
  alternative: Kufafanua kama nguvu au ulinzi wa Mungu
  rationale: Maandishi ya Kiebrania hutumia lugha ya kishairi ya kimwili; kuihifadhi huepuka kuamua kimyakimya namna taswira hiyo inavyopaswa kufasiriwa.
