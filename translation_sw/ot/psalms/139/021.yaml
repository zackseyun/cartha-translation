  text: הֲ/לֽוֹא מְשַׂנְאֶ֖י/ךָ יְהוָ֥ה אֶשְׂנָ֑א וּ֝/בִ/תְקוֹמְמֶ֗י/ךָ אֶתְקוֹטָֽט־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/021.yaml
  text: Do I not hate those who hate you, O LORD, and loathe those who rise up against you?
translation:
  language: sw
  text: Ee BWANA, je, siwachukii wale wanaokuchukia, na siwakinai wale wanaokuinukia?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְשַׂנְאֶיךָ / אֶשְׂנָא
  choice: wale wanaokuchukia / siwachukii
  rationale: Mzizi שׂנא una maana ya ‘chukia’; swali la balagha lililoanzishwa na הֲלוֹא limehifadhiwa kwa ‘je, si-’.
- source_word: יְהוָה
  choice: BWANA
  rationale: Jina la agano YHWH limetafsiriwa kwa desturi ya Kiswahili ya Biblia, ‘BWANA’ kwa herufi kubwa.
- source_word: בִתְקוֹמְמֶיךָ
  choice: wale wanaokuinukia
  rationale: Muundo huu humaanisha wanaojiinua au kuasi dhidi ya Mungu; ‘wanaokuinukia’ huhifadhi taswira ya chanzo bila kuifafanua kupita kiasi.
- source_word: אֶתְקוֹטָט
  choice: kuwakinai
  rationale: Kitenzi קוט katika hitpaeli hapa huonyesha hisia kali ya kuchukizwa au kukirihishwa; ‘kuwakinai’ ni Kiswahili cha kawaida kinachotofautisha neno hili na ‘kuchukia’ la kishazi cha kwanza.
theological_decisions:
- issue: Kauli ya mtunga zaburi kuhusu kuwachukia adui za Mungu
  choice: 'Imehifadhiwa kama swali la balagha lenye maneno makali: ‘je, siwachukii ... na kuwakinai ...?’'
  alternative: Kulainisha kuwa ‘siwakatai’ au kufafanua kuwa anachukia matendo yao tu
  rationale: Maandishi ya Kiebrania yanawahusu watu wanaomchukia na kumwasi Mungu, nayo hayatenganishi wazi watu na matendo yao; tafsiri haipaswi kulainisha mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Ee BWANA’ huhifadhi usemi wa moja kwa moja, na muundo mmoja wa swali huakisi ulinganifu wa mistari ya Kiebrania.
