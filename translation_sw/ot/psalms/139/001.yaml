base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/001.yaml
  text: For the choirmaster[a]. Of David. A psalm. O Yahweh[b], you have searched me and known me.
translation:
  language: sw
  text: Kwa kiongozi wa muziki.[a] Zaburi ya Daudi.[b] Ee Yahwe, umenichunguza na kunijua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa mwongoza wa waimbaji”; kiambishi cha Kiebrania katika vichwa vya zaburi kinaweza kuonyesha kuelekezwa au kuwekwa kwa ajili ya mtu huyo.
    reason: lexical_alternative
  - marker: b
    text: Au, “Zaburi iliyoandikwa na Daudi”; usemi wa Kiebrania unaweza kuonyesha uandishi, kuwekwa wakfu, au uhusiano na Daudi.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa kiongozi wa muziki
  rationale: Neno hili katika vichwa vya zaburi humaanisha kiongozi au msimamizi wa uimbaji na muziki. Kauli hii ni ya kawaida na haidokezi bila lazima kwamba kulikuwa na kwaya pekee.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Katika kichwa cha zaburi, kiambishi לְ kinaweza kuonyesha uandishi, kuwekwa wakfu, au uhusiano. Kiswahili ‘ya Daudi’ kinahifadhi kwa kiasi kizuri upana huo kuliko ‘iliyoandikwa na Daudi’.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa wimbo wa ibada wa aina hii, hasa ule unaohusishwa na uimbaji wenye ala.
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la Mungu limetolewa kwa unukuzi ‘Yahwe’ badala ya kubadilishwa kuwa cheo; ‘Ee’ linaonyesha kwamba mtunga-zaburi anamwita Mungu moja kwa moja.
- source_word: חֲקַרְתַּנִי
  choice: umenichunguza
  rationale: Kitenzi kina maana ya kuchunguza au kupeleleza kwa kina. Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika lenye umuhimu wa sasa.
- source_word: וַתֵּדָע
  choice: na kunijua
  rationale: Kitenzi ידע humaanisha ‘kujua.’ Muundo huu unaunganisha kwa ufasaha matokeo ya uchunguzi na ufahamu kamili wa Mungu bila kuongeza kitu kisichosemwa wazi.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יְהוָה
  choice: Ee Yahwe
  alternative: Ee BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu, si cheo. Kulihifadhi kama ‘Yahwe’ kunawakilisha tofauti hiyo ya kimaandishi.
- issue: Uhusiano unaoonyeshwa na לְדָוִד
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi
  rationale: Kiebrania kinaweza kuonyesha uandishi, kuwekwa wakfu, au uhusiano mwingine na Daudi. Tafsiri haipaswi kuamua uandishi pekee mahali ambapo kichwa chenyewe kina utata.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye staha. Kichwa kimewekwa kwa ufupi kama ilivyo kawaida katika Zaburi; utata wa viambishi vya Kiebrania umehifadhiwa katika matini na kufafanuliwa katika tanbihi.
