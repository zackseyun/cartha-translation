  text: 'Kama nikichukua mabawa ya mapambazuko[a],

    Kama nikikaa katika upeo wa bahari,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika magharibi ya mbali kabisa”; katika jiografia ya kishairi ya Kiebrania, “bahari” inaweza kuashiria magharibi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשָּׂא
  choice: nikitwaa
  rationale: Kitenzi נשׂא humaanisha kuinua au kubeba; katika taswira hii ya kishairi, “kutwaa” huwasilisha kwa njia ya kawaida wazo la kuyachukua mabawa ili kusafiri.
- source_word: כַנְפֵי
  choice: mabawa ya
  rationale: כנף kwa kawaida ni “bawa,” ingawa pia laweza kumaanisha ukingo. “Mabawa” huhifadhi sitiari ya kishairi inayohusishwa na mapambazuko.
- source_word: שָׁחַר
  choice: mapambazuko
  rationale: שׁחר ni alfajiri au mwanzo wa nuru ya asubuhi. “Mapambazuko” ni neno la Kiswahili lenye hadhi ya kishairi na linaloeleweka kwa urahisi.
- source_word: אֶשְׁכְּנָה
  choice: nikikaa
  rationale: שכן humaanisha kukaa, kuishi, au kufanya makao. “Nikikaa” ni ya asili katika Kiswahili na haiongezi wazo lisilokuwapo la makazi ya kudumu.
- source_word: בְּאַחֲרִית
  choice: katika sehemu ya mbali zaidi ya
  rationale: אַחֲרִית hapa lina maana ya mwisho au ukomo wa kijiografia. Kauli hii huonyesha umbali wa mwisho bila kuifanya kuwa dhana ya wakati.
- source_word: יָם
  choice: bahari
  rationale: ים kimsingi ni “bahari,” lakini inaweza pia kuashiria magharibi katika jiografia ya kishairi ya Kiebrania. Maana halisi imewekwa katika matini, na maana ya mwelekeo imehifadhiwa katika tanbihi.
