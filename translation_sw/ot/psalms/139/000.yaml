  text: For the choirmaster[a]. Of David. A psalm. Yahweh[b], you have searched me and known me.
translation:
  language: sw
  text: Kwa kiongozi wa waimbaji.[a] Ya Daudi.[b] Zaburi. Ee Yahwe, umenichunguza na kunijua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa ajili ya kiongozi wa waimbaji”; kihusishi cha Kiebrania kinaweza kuonyesha mwelekeo au kuwekwa wakfu katika vichwa vya zaburi.
    reason: lexical_alternative
  - marker: b
    text: Au, “Iliyotungwa na Daudi”; “Ya Daudi” huhifadhi utata wa Kiebrania kuhusu uandishi, kuwekwa wakfu, au uhusiano na Daudi.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza wa waimbaji
  rationale: Kirai hiki cha kichwa cha zaburi kimetafsiriwa kwa njia ya kawaida inayoeleweka, huku kihusishi לְ kikihifadhi uwezekano wa maana ya kuelekezwa au kuwekwa wakfu kupitia tanbihi.
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Neno “Ya” ni fupi na huhifadhi utata wa Kiebrania kuhusu uandishi, kuwekwa wakfu, au uhusiano na Daudi.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa wimbo wa ibada wa aina hii.
- source_word: יְהוָה
  choice: YAHWE
  rationale: Jina binafsi la Mungu limetolewa kama Yahwe badala ya kubadilishwa kuwa cheo; herufi kubwa zinalitofautisha na vyeo kama Bwana.
- source_word: חֲקַרְתַּנִי
  choice: umenichunguza
  rationale: Kitenzi kinaonyesha uchunguzi wa kina wa mtu, si kuangalia kwa juu juu tu.
- source_word: וַתֵּדָע
  choice: na kunijua
  rationale: Kiarifu cha Kiebrania hakina kiwakilishi cha yambwa kilicho wazi katika kitenzi cha pili, lakini muktadha unaendeleza “mimi”; Kiswahili cha kawaida huhitaji kukionyesha.
theological_decisions:
- issue: Uhusiano wa Daudi na zaburi
  choice: Ya Daudi
  alternative: Iliyoandikwa na Daudi
  rationale: Tafsiri haifungi לְדָוִד katika maana ya uandishi pekee, kwa kuwa inaweza pia kuonyesha kuwekwa wakfu au uhusiano.
- issue: Utoaji wa tetragramatoni יהוה
  choice: YAHWE
  alternative: BWANA
  rationale: Kutumia jina binafsi hudumisha tofauti ya maandishi kati ya jina la agano na cheo, bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Mwongoza wa waimbaji” ni la asili zaidi kuliko istilahi nzito ya kitaalamu; “Ee” limetumiwa kuonyesha usemi wa moja kwa moja kwa Mungu.
