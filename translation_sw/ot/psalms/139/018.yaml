  yaml_path: translation/ot/psalms/139/018.yaml
  text: If I were to count them[a], they would be more than the sand. When I awake[b], I am still with you.
translation:
  language: sw
  text: Ningezihesabu[a], zingekuwa nyingi kuliko mchanga. Nikiamka[b], bado niko pamoja nawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nikizihesabu, zingezidi mchanga kwa wingi.” Kiebrania ni kifupi na kinaweza kupangwa kwa namna tofauti kidogo katika Kiswahili.
    reason: lexical_alternative
  - marker: b
    text: Pia inaweza kutafsiriwa, “Niliamka, nami bado niko pamoja nawe.” Kiebrania hakibainishi wazi kama kuamka huku ni kwa mazoea, ni tendo lililotokea, au ni kwa maana ya mfano.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶסְפְּרֵם
  choice: Nikijaribu kuzihesabu
  rationale: Kitenzi ספר katika Qal, nafsi ya kwanza umoja, pamoja na kiambishi cha nafsi ya tatu wingi, kina maana ya ‘nizihesabu.’ Katika muktadha huu muundo wa sharti ‘Nikijaribu kuzihesabu’ unaonyesha jaribio lisiloweza kukamilika bila kuufanya mstari kuwa wa uhakika zaidi kuliko Kiebrania.
- source_word: מֵחוֹל יִרְבּוּן
  choice: zingekuwa nyingi kuliko mchanga
  rationale: מִן inaonyesha ulinganisho, na רבה humaanisha kuwa nyingi au kuongezeka. Kiswahili cha kawaida hutumia ‘nyingi kuliko mchanga,’ huku hali ya ‘-nge-’ ikiendeleza muundo wa sharti wa kishazi cha kwanza.
- source_word: הֱקִיצֹתִי
  choice: Ninapoamka
  rationale: Neno hili linaeleza kuamka. ‘Ninapoamka’ linafaa katika mtiririko wa kishairi na halilazimishi maana ya tendo la wakati uliopita, la mazoea, au la mfano.
- source_word: וְעוֹדִי
  choice: bado niko
  rationale: 'עוֹד pamoja na kiambishi cha nafsi ya kwanza huonyesha hali inayoendelea: ‘bado niko.’ Huu ni usemi wa asili katika Kiswahili.'
- source_word: עִמָּךְ
  choice: pamoja nawe
  rationale: עם humaanisha ‘pamoja na.’ ‘Pamoja nawe’ ni ya kawaida, yenye heshima, na haiingizi ufafanuzi wa ziada kama ‘mbele zako.’
theological_decisions:
- issue: Kirejeleo cha kiwakilishi ‘zi-’
  choice: Kiwakilishi kinarejelea mawazo ya Mungu yaliyotajwa katika mstari uliotangulia.
  alternative: Kinaweza kueleweka kwa upana zaidi kuwa matendo ya ajabu au makusudi ya Mungu.
  rationale: Muktadha wa karibu wa Zaburi 139:17 unaelekeza kwa mawazo ya Mungu. Tafsiri inadumisha kiwakilishi badala ya kuongeza ‘mawazo yako,’ hivyo inaacha uhusiano huo ueleweke kutokana na muktadha kama katika Kiebrania.
- issue: Maana ya kishazi cha mwisho
  choice: Mtunga-zaburi anasema kwamba anapoamka bado yuko pamoja na Mungu.
  alternative: Huenda ni kuamka kutoka usingizini baada ya kutafakari; wengine huona mwangwi wa kuamka baada ya kifo, lakini jambo hilo halijasemwa wazi.
  rationale: Kiebrania kinasisitiza kuendelea kuwa pamoja na Mungu baada ya kuamka. Tafsiri haiingizi moja kwa moja wazo la ufufuo wala kufunga wakati wa kuamka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Nikijaribu’ huwasilisha hali ya kujaribu kuhesabu bila kudai kwamba neno hilo limo wazi katika Kiebrania; tanbihi inatoa mbadala ulio karibu zaidi na muundo wake. Viwakilishi vya ngeli ya 10 vinaendana na ‘mawazo’ ya mstari uliotangulia.
