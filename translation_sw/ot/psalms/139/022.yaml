  text: I hate them with complete hatred[a]; they have become enemies to me.
translation:
  language: sw
  text: Ninawachukia kwa chuki kamili[a]; wamekuwa adui zangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa chuki iliyo kuu kabisa,” au “kwa chuki timilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּכְלִית
  choice: kamili
  rationale: Nomino hii huonyesha ukamilifu, mwisho, au kiwango chote. Ikiunganishwa na שִׂנְאָה, inasisitiza chuki kuwa kamili kabisa; “kamili” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: שִׂנְאָה
  choice: chuki
  rationale: Nomino hii pamoja na תַּכְלִית huunda kirai “chuki kamili,” kinachohifadhi urudiaji na msisitizo wa Kiebrania.
- source_word: שְׂנֵאתִים
  choice: Ninawachukia
  rationale: Ni Qal timilifu, nafsi ya kwanza umoja, yenye kiambishi cha nafsi ya tatu wingi. Katika ushairi huu inaeleza msimamo wa sasa; Kiswahili cha sasa hutumia “ninawachukia” kwa ufasaha.
- source_word: לְאוֹיְבִים
  choice: adui
  rationale: Pamoja na kitenzi היה na ל, neno hili huonyesha hali au jukumu lililotokea. Katika Kiswahili, “wamekuwa adui” huwasilisha hali hiyo kwa kawaida.
- source_word: הָיוּ לִי
  choice: wamekuwa adui zangu
  rationale: Muundo היה + ל una maana ya hali yenye matokeo na uhusiano binafsi. “Wamekuwa adui zangu” ni wa asili zaidi kuliko tafsiri ya moja kwa moja “wamekuwa adui kwangu.”
theological_decisions:
- issue: Ukali wa tamko la mtunga zaburi
  choice: Kuhifadhi lugha kali ya chuki binafsi bila kuipunguza.
  alternative: Ninawapinga kabisa; ninawahesabu kuwa adui.
  rationale: Kiebrania hutumia mzizi wa “chukia/chuki” mara mbili. Tafsiri inapaswa kudumisha nguvu hiyo na kutofasiri chuki kuwa upinzani tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Urudiaji wa “ninawachukia kwa chuki” umehifadhiwa kwa sababu ni msisitizo wa kimakusudi katika Kiebrania, ingawa ni mkali katika Kiswahili.
