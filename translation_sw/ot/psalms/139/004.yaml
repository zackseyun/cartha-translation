  text: כִּ֤י אֵ֣ין מִ֭לָּה בִּ/לְשׁוֹנִ֑/י הֵ֥ן יְ֝הוָ֗ה יָדַ֥עְתָּ כֻלָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/004.yaml
  text: For there is not a word on my tongue—behold[a], O Yahweh, you know it altogether.
translation:
  language: sw
  text: Kwa maana hakuna neno ulimini mwangu—tazama[a], Ee Yahwe, wewe unalijua lote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakika, Ee Yahwe, unalijua lote.”
    reason: Neno הֵן linaweza kuwa mwito wa kuvuta fikira, “tazama,” au chembe ya kusisitiza, “hakika.”
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Katika muktadha huu neno hili linaanzisha sababu au ufafanuzi wa wazo lililotangulia, na “Kwa maana” hudumisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: אֵין
  choice: hakuna
  rationale: Huu ni ukanushi wa kuwapo; “hakuna” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: מִלָּה
  choice: neno
  rationale: “Neno” linafaa kwa usemi unaotajwa hapa na linadumisha umoja wa nomino ya Kiebrania.
- source_word: בִּלְשׁוֹנִי
  choice: ulimini mwangu
  rationale: Hii inadumisha taswira ya kiungo cha mwili inayohusishwa na kusema, bila kuibadili kuwa “midomoni mwangu.”
- source_word: הֵן
  choice: tazama
  rationale: Neno hili ni chembe ya kuvuta fikira yenye mkazo. “Tazama” inadumisha nguvu yake ya kishairi, huku tanbihi ikionyesha uwezekano wa kulielewa kama “hakika.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa moja kwa moja katika chanzo; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- source_word: יָדַעְתָּ
  choice: unalijua
  rationale: Ingawa umbo la Kiebrania ni timilifu, hapa linaeleza maarifa kamili na ya kudumu; wakati wa sasa ni wa kawaida na sahihi katika Kiswahili.
- source_word: כֻלָּהּ
  choice: lote
  rationale: Kiambishi cha kike cha umoja kinarejelea “neno”; “lote” huonyesha kwamba Yahwe analijua kwa ukamilifu.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Matini ya Kiebrania inatumia jina la agano lenyewe. “Yahwe” hulihifadhi kama jina badala ya kutumia cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo “hakuna neno ulimini mwangu” umehifadhi badala ya kuongeza waziwazi “kabla,” ili kutotatua kimyakimya udokezo wa wakati uliopo katika muktadha lakini usiosemwa moja kwa moja katika Kiebrania.
