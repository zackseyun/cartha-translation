  text: You hem me in behind and before[a], and lay your hand upon me.
translation:
  language: sw
  text: Umenizingira kwa nyuma na kwa mbele[a], na umeweka mkono wako juu yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘Umenifungia pande zote’ au ‘Umenibana’; kitenzi cha Kiebrania kinaweza kueleza kuzungukwa kwa namna ya kawaida au ya ulinzi, lakini pia kinaweza kuwa na maana yenye shinikizo katika muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחוֹר
  choice: kwa nyuma
  rationale: Katika jozi na קֶדֶם, neno hili linaeleza mahali, yaani upande wa nyuma.
- source_word: קֶדֶם
  choice: kwa mbele
  rationale: Katika utofautishaji na אָחוֹר, maana ya mahali, ‘mbele,’ inafaa kuliko maana ya wakati au upande wa mashariki.
- source_word: צַרְתָּנִי
  choice: umenizingira
  rationale: Kitenzi kinaweza kumaanisha kumzunguka au kumwekea mtu mipaka, na wakati mwingine kuhusisha shinikizo kama la kuzingirwa. ‘Umenizingira’ kinahifadhi picha hiyo bila kuifanya iwe ya ulinzi tu au ya tishio tu.
- source_word: וַתָּשֶׁת
  choice: umeweka
  rationale: Kitenzi kina maana ya kuweka; ‘umeweka’ ni cha kawaida na cha asili pamoja na ‘mkono wako juu yangu.’
- source_word: עָלַי
  choice: juu yangu
  rationale: Huhifadhi uhusiano wa mahali unaoonyeshwa na עַל na inasikika kwa kawaida katika Kiswahili.
- source_word: כַּפֶּךָ
  choice: mkono wako
  rationale: Ingawa כַּף linaweza kumaanisha hasa kiganja, katika taswira hii ‘mkono’ ni usemi wa kawaida zaidi na huhifadhi lugha ya kumwelezea Mungu kwa mfano wa kibinadamu.
theological_decisions:
- issue: Ikiwa kuzingirwa huku kusikike kama ulinzi, kizuizi, au yote mawili
  choice: Kuhifadhi taswira yenye uwezekano wa ukaribu na pia shinikizo kwa kutumia ‘umenizingira.’
  alternative: ‘Umenilinda’ (ulinzi waziwazi) au ‘umenihusuru’ (tishio waziwazi).
  rationale: Muktadha wa Zaburi 139 unaonyesha kwamba ujuzi na uwepo kamili wa Mungu ni wa karibu lakini pia unaweza kumlemea mwandishi. Kiebrania hakilazimishi hisia moja tu, hivyo tafsiri haipaswi kuondoa mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Kurudiwa kwa ‘kwa’ katika ‘kwa nyuma na kwa mbele’ kunafanya jozi ya mahali iwe wazi na ya asili.
