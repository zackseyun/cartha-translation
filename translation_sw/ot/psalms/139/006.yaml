  text: פלאיה דַ֣עַת מִמֶּ֑/נִּי נִ֝שְׂגְּבָ֗ה לֹא א֥וּכַֽל לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/006.yaml
  text: Such knowledge is too wonderful for me[a]; it is too high—I cannot attain it.
translation:
  language: sw
  text: Maarifa hayo ni ya ajabu mno kwangu[a]; ni ya juu mno—siwezi kuyafikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Maarifa hayo yako mbali na ufahamu wangu; yametukuka, siwezi kuyafikia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פלאיה
  choice: ya ajabu mno
  rationale: Neno hili huonyesha jambo la kushangaza au linalopita uwezo wa kawaida wa kulielewa. “Ya ajabu mno” ni Kiswahili cha kawaida kinachoonyesha kuwa maarifa hayo yanazidi ufahamu wa mtunga zaburi.
- source_word: דַעַת
  choice: Maarifa
  rationale: Nomino hii humaanisha “maarifa.” Katika muktadha inarejelea jinsi Mungu anavyomjua mtunga zaburi, kama ilivyoelezwa katika mistari iliyotangulia.
- source_word: מִמֶּנִּי
  choice: kwangu
  rationale: Ingawa kihalisi inaweza kuwa “kutoka kwangu” au “kuliko mimi,” hapa inaonyesha kwamba maarifa hayo yanapita uwezo wa mtunga zaburi; “kwangu” linaingia kwa kawaida pamoja na “ya ajabu mno.”
- source_word: נִשְׂגְּבָה
  choice: ni ya juu mno
  rationale: Kitenzi kinadokeza kuwa juu, kutukuka, au kutofikika. Tafsiri hii inadumisha sitiari ya kimo na kuandaa kauli inayofuata kuhusu kutoweza kuyafikia.
- source_word: לֹא אוּכַל
  choice: siwezi
  rationale: Hii ni tafsiri ya moja kwa moja ya hali ya kutokuwa na uwezo katika nafsi ya kwanza umoja.
- source_word: לָהּ
  choice: kuyafikia
  rationale: Kihalisi ni “kwake/kwayo,” huku kitendo kinachodokezwa kikikamilishwa kutokana na muktadha. “Kuyafikia” kinadumisha picha ya maarifa yaliyo juu na yasiyoweza kufikiwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na ulinganifu wa vipashio viwili umehifadhiwa; alama ya mkato mrefu inasisitiza hitimisho la kutoweza kuyafikia maarifa hayo.
