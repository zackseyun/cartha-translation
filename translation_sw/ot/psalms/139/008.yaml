base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/008.yaml
  text: If I ascend to heaven[a], you are there; if I make my bed in Sheol, behold, you are there.
translation:
  language: sw
  text: Nikipanda mbinguni, wewe uko huko; nikitandika kitanda changu katika Sheoli[a], tazama, wewe uko huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheoli ni neno la Kiebrania linaloweza kumaanisha kaburi au ulimwengu wa wafu; si lazima limaanishe jehanamu kwa maana ya baadaye ya mahali pa adhabu ya mwisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Niki-
  rationale: Kiambishi cha masharti kinaendeleza muundo wa kishairi wa hali inayodhaniwa bila kuugeuza kuwa kauli ya wakati.
- source_word: אֶסַּק
  choice: panda
  rationale: Kitenzi hiki kinahifadhi taswira ya kwenda juu kuelekea mbinguni kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: שָׁמַיִם
  choice: mbinguni
  rationale: Katika ulinganifu wake na Kuzimu, neno hili linaonyesha makao ya juu kabisa, si anga tu.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi cha mahali kimewekwa wazi ili kuhifadhi msisitizo kwamba Mungu yupo kila mahali panapotajwa.
- source_word: אָתָּה
  choice: wewe uko
  rationale: Kiwakilishi cha nafsi kimehifadhiwa kwa msisitizo wa usemi wa moja kwa moja kwa Mungu; kitenzi 'uko' kinakamilisha sentensi kwa Kiswahili cha kawaida.
- source_word: וְאַצִּיעָה
  choice: nikitandika kitanda changu
  rationale: Huhifadhi taswira halisi ya kutandika mahali pa kulala badala ya kuifupisha kuwa 'nikilala.' Neno 'changu' hufanya usemi uwe wa kawaida katika Kiswahili na linaendana na nafsi ya kwanza ya kitenzi.
- source_word: שְּׁאוֹל
  choice: Kuzimu
  rationale: Ni neno la Kiswahili linaloweza kumaanisha makao au ulimwengu wa wafu. Maelezo ya chini yanazuia lisieleweke moja kwa moja kuwa mahali pa adhabu ya mwisho.
- source_word: הִנֶּךָּ
  choice: tazama, uko huko
  rationale: Neno 'tazama' linahifadhi nguvu ya mshangao na utambuzi katika chembe ya Kiebrania; 'uko huko' linaeleza maana inayodokezwa na kuendeleza ulinganifu wa mshororo wa kwanza.
theological_decisions:
- issue: Maana ya שְּׁאוֹל katika kauli ya kishairi kuhusu uwepo wa Mungu katika vilindi
  choice: Kuzimu
  alternative: Sheoli; kaburini; ulimwenguni mwa wafu; jehanamu
  rationale: Neno la Kiebrania halimaanishi kwa lazima mahali pa mwisho pa adhabu. 'Kuzimu' pamoja na tanbihi huhifadhi dhana ya makao ya wafu bila kuingiza kimyakimya maana ya baadaye ya 'jehanamu.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masharti na ulinganifu wa juu/chini umehifadhiwa; 'tazama' inadumisha msisitizo wa kishairi.
