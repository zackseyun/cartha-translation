translation:
  language: sw
  text: Nami nikasema, “Hakika giza litanifunika[a], na usiku utakuwa nuru kunizunguka[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “litanigharikisha,” au “litaniponda.” Kitenzi cha Kiebrania ni nadra, na maana yake kamili hapa inajadiliwa.
    reason: lexical_alternative
  - marker: b
    text: Au “na usiku ni nuru kunizunguka.” Kifungu cha Kiebrania hakina kitenzi kilichoandikwa; kinaweza kutafsiriwa kwa wakati wa sasa au ujao kulingana na uhusiano wake na kauli ya mtunga zaburi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Nami nikasema
  rationale: Waw pamoja na qatal ya nafsi ya kwanza umoja kwa kawaida huonyesha kauli ya wakati uliopita. “Nami nikasema” huhifadhi muundo huo bila kuugeuza kuwa sharti.
- source_word: אַךְ
  choice: Hakika
  rationale: Hapa neno hili linatilia mkazo uhakika wa wazo, si kuweka kizuizi; “hakika” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: חֹשֶׁךְ
  choice: giza
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa dhana ya giza katika muktadha huu.
- source_word: יְשׁוּפֵנִי
  choice: litanifunika
  rationale: Kitenzi שׁוף ni nadra na maana yake hapa inajadiliwa. Giza likiwa kiima, “litanifunika” linafaa kwa taswira na ulinganifu wa mstari, huku uwezekano wa maana kama kunigharikisha au kuniponda ukihifadhiwa katika tanbihi.
- source_word: וְלַיְלָה
  choice: nao usiku
  rationale: Huhifadhi kiunganishi na muundo sambamba wa kishairi; “nao” hufanya sentensi isomeke kwa kawaida katika Kiswahili.
- source_word: אוֹר
  choice: utakuwa nuru
  rationale: Kifungu cha Kiebrania hakina kitenzi kilichoandikwa. Wakati ujao unalingana na kauli inayotazamiwa na mstari wa kwanza, huku nomino “nuru” ikihifadhi ufupi wa Kiebrania.
- source_word: בַּעֲדֵנִי
  choice: kunizunguka
  rationale: Katika muktadha huu kihusishi kinaonyesha uhusiano wa mahali unaomzunguka msemaji; “kunizunguka” ni cha asili na hudumisha taswira ya usiku unaomzingira.
