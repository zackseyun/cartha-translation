base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/019.yaml
  text: If only you would kill the wicked[a], O God, and you men of blood, depart from me.
translation:
  language: sw
  text: Laiti ungewaua waovu, Ee Mungu! Enyi watu wa damu[a], niondokeeni!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Watu wa damu” ni msemo wa Kiebrania unaomaanisha watu wenye jeuri au wauaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Laiti
  rationale: Katika muktadha huu wa tamanio, אִם haitoi sharti la kawaida bali inaonyesha ombi lenye hamu kubwa; “Laiti” ni usemi wa asili wa Kiswahili unaohifadhi maana hiyo.
- source_word: תִּקְטֹל
  choice: ungewaua
  rationale: Kitenzi hiki cha Qal imperfect, pamoja na אִם, kinaonyesha tendo linalotamaniwa na linaloelekezwa kwa Mungu. “Ungewaua” huwasilisha hali hiyo ya tamanio, huku kiambishi cha wingi kikipatana na matumizi ya jumla ya “waovu.”
- source_word: אֱלוֹהַּ
  choice: Ee Mungu
  rationale: Nomino hii inamtaja Mungu moja kwa moja. “Ee Mungu” huonyesha wito huo kwa lugha ya sala yenye hadhi bila kuwa ya kizamani kupita kiasi.
- source_word: רָשָׁע
  choice: waovu
  rationale: Ingawa neno la Kiebrania ni la umoja kimaumbo, linaweza kutumiwa kwa maana ya jumla au ya kundi. “Waovu” linaendana kwa kawaida na muktadha unaofuata wa watu wengi wenye jeuri.
- source_word: וְאַנְשֵׁי דָמִים
  choice: Enyi watu wa damu
  rationale: Huu ni msemo wa Kiebrania unaomaanisha watu wenye jeuri au wauaji. Tafsiri ya karibu “watu wa damu” inahifadhi taswira kali ya chanzo, huku tanbihi ikifafanua maana yake.
- source_word: סוּרוּ
  choice: ondokeni
  rationale: Ni amri ya wingi inayowaelekea watu wa damu. “Ondokeni” ni ya moja kwa moja, ya sasa, na inafaa kwa uzito wa zaburi.
- source_word: מֶנִּי
  choice: kwangu
  rationale: Kihusishi chenye kiambishi cha nafsi ya kwanza kina maana ya kuondoka kutoka kwa msemaji. Pamoja na “ondokeni,” “kwangu” huwasilisha kwa kawaida wazo la kuondoka kutoka kwake.
theological_decisions:
- issue: Iwapo tamanio la mtunga zaburi la hukumu lipunguzwe ukali
  choice: Kuhifadhi ombi la moja kwa moja kwamba Mungu awaue waovu
  alternative: Kulifanya kuwa utabiri tu wa hukumu, au kutumia usemi laini kama “uwashughulikie”
  rationale: Kiebrania kinaonyesha wazi tamanio kwamba Mungu awaue waovu. Tafsiri inapaswa kuhifadhi mvutano wa kiteolojia wa sala hii ya kuomba hukumu badala ya kuupunguza kwa hisia za kisasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Laiti” na “Ee Mungu” hudumisha sauti ya sala, huku amri “ondokeni” ikibaki wazi na yenye nguvu.
