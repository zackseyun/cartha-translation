  text: You sift out my path and my lying down[a], and you are acquainted with all my ways.
translation:
  language: sw
  text: Unapepeta njia yangu na kulala kwangu[a]; unazifahamu njia zangu zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Unachunguza kwa makini njia yangu na kulala kwangu.” Kitenzi cha Kiebrania kina taswira ya kupepeta nafaka, hivyo huonyesha uchunguzi wa kina.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרְחִי
  choice: njia yangu
  rationale: Neno אֹרַח humaanisha njia au mapito. “Njia yangu” inadumisha taswira halisi na pia inaweza kudokeza mwenendo wa mtu.
- source_word: רִבְעִי
  choice: kulala kwangu
  rationale: Nomino hii, inayotokana na רבע, hurejelea kitendo cha kulala au kujilaza. “Kulala kwangu” ni Kiswahili cha kawaida na hudumisha ulinganifu na “njia yangu.”
- source_word: זֵרִיתָ
  choice: unaichunguza kwa kupepeta
  rationale: Kitenzi זרה kina taswira ya kupepeta au kutawanya nafaka, na hapa huonyesha uchunguzi makini. Kauli hii inabeba taswira hiyo huku ikifafanua maana yake katika Kiswahili cha sasa.
- source_word: כָל
  choice: zote
  rationale: Huhifadhi msisitizo wa Kiebrania juu ya ujumla kamili wa njia za msemaji.
- source_word: דְּרָכַי
  choice: njia zangu
  rationale: דֶּרֶךְ inaweza kumaanisha njia halisi au mwenendo wa maisha. “Njia zangu” hudumisha maana zote mbili bila kuifafanua kupita kiasi.
- source_word: הִסְכַּנְתָּה
  choice: unazifahamu
  rationale: Katika muktadha huu kitenzi humaanisha kuwa na ufahamu wa karibu au kuzoea kabisa. “Unazifahamu” ni cha asili na huonyesha ujuzi wa ndani bila kuongeza maelezo ya kiteolojia.
theological_decisions:
- issue: Taswira ya kibinadamu kuhusu maarifa ya Mungu
  choice: Kudumisha taswira ya kupepeta na ya njia huku ikieleza uchunguzi kwa Kiswahili kinachoeleweka.
  alternative: Kutafsiri kwa maneno ya jumla tu, kama “unachunguza” na “unajua.”
  rationale: Mstari unaeleza ufahamu wa Mungu kwa taswira halisi ya shughuli za kawaida. Tafsiri haibadili taswira hiyo kuwa tamko la mafundisho lisilo katika maandishi, wala hailazimishi maana moja kwa “njia.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo “unaichunguza kwa kupepeta” umetumiwa ili taswira ya Kiebrania ibaki wazi bila kufanya “kupepeta njia” isikike kama tamathali isiyoeleweka.
