  yaml_path: translation/ot/psalms/139/023.yaml
  text: Search me[a], God, and know my heart; test me and know my anxious thoughts.
translation:
  language: sw
  text: Ee Mungu, nichunguze na ujue moyo wangu; nijaribu na ujue mawazo yangu yanayonisumbua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mawazo yangu yenye wasiwasi” au “mawazo yangu yaliyogawanyika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָקְרֵנִי
  choice: nichunguze
  rationale: Kitenzi חקר humaanisha kuchunguza kwa kina. “Nichunguze” ni ombi la kawaida na lenye hadhi katika Kiswahili, nalo linadumisha picha ya Mungu kupeleleza undani wa mtu.
- source_word: אֵל
  choice: Ee Mungu
  rationale: אֵל hapa ni jina la Mungu katika usemi wa moja kwa moja. “Ee Mungu” huonyesha wazi hali ya kumwita Mungu na inafaa kwa sajili ya sala.
- source_word: וְדַע
  choice: na kuujua / na kuyajua
  rationale: ידע inarudiwa katika mstari huu. Kutumia “kujua” mara zote mbili kunahifadhi urudiaji na usambamba wa kishairi wa Kiebrania.
- source_word: לְבָבִי
  choice: moyo wangu
  rationale: לֵבָב hurejelea utu wa ndani, ukiwemo ufahamu na nia. “Moyo wangu” ni tafsiri ya kawaida, pana, na inayofaa katika lugha ya kishairi ya Kiswahili.
- source_word: בְּחָנֵנִי
  choice: nijaribu
  rationale: בחן hubeba wazo la kupima au kujaribu ili kubaini hali halisi. “Nijaribu” ni fupi, ya asili, na inatofautisha tendo hili na “nichunguze” katika sehemu ya kwanza.
- source_word: שַׂרְעַפָּי
  choice: mawazo yangu yanayonisumbua
  rationale: שַׂרְעַפִּים inaweza kumaanisha mawazo yanayofadhaisha, yanayotia wasiwasi, au yaliyogawanyika. “Mawazo yangu yanayonisumbua” ni ya kawaida kwa wasomaji wa sasa na huhifadhi hali ya msukosuko wa ndani bila kuifunga katika maana moja tu ya kisaikolojia.
theological_decisions:
- issue: Lugha ya kibiblia kuhusu maisha ya ndani ya mwanadamu
  choice: Kudumisha maneno mawili tofauti, “moyo” na “mawazo yanayonisumbua.”
  alternative: Kutafsiri yote kwa istilahi moja kama “nia” au kutumia “moyo” na “akili.”
  rationale: Kiebrania kinatumia maneno mawili tofauti kwa maisha ya ndani katika usambamba. Kuyadumisha huepusha kuyapunguza kuwa dhana moja ya kisasa na huhifadhi kina cha kishairi.
- issue: Wigo wa maana wa שַׂרְעַפָּי
  choice: Kutumia “mawazo yangu yanayonisumbua” katika matini na kuweka maana nyingine katika tanbihi.
  alternative: “Mawazo yangu yenye wasiwasi” au “mawazo yangu yaliyogawanyika.”
  rationale: Neno la Kiebrania lina utata halisi kati ya mawazo yenye wasiwasi, yanayofadhaisha, au yaliyogawanyika. Matini kuu inatumia Kiswahili cha kawaida, huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala. “Ee Mungu” huweka wazi usemi wa moja kwa moja; urudiaji wa “kujua” na usambamba wa vitenzi umehifadhiwa.
