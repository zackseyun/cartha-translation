  text: לֹא נִכְחַ֥ד עָצְמִ֗/י מִ֫מֶּ֥/ךָּ אֲשֶׁר עֻשֵּׂ֥יתִי בַ/סֵּ֑תֶר רֻ֝קַּ֗מְתִּי בְּֽ/תַחְתִּיּ֥וֹת אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/015.yaml
  text: My frame was not hidden from you when I was made in secret[b][a], woven in the depths of the earth.
translation:
  language: sw
  text: Mifupa yangu haikufichwa kwako nilipoumbwa kwa siri,[a] nilipofumwa katika vilindi vya dunia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali pa siri.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania pia kinaweza kutafsiriwa “katika sehemu za chini kabisa za dunia.” Hii ni taswira ya kishairi ya kufanyizwa mahali palipofichika.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְחַד
  choice: halikufichwa
  rationale: Kauli ya kutendwa inadumishwa, na “kufichwa kwako” ni Kiswahili cha kawaida kinachoonyesha kwamba umbo la mtunga-zaburi halikuwa limefichika kwa Mungu.
- source_word: עָצְמִי
  choice: umbo langu
  rationale: Ingawa עֶצֶם mara nyingi humaanisha mfupa, hapa inaelekea kumaanisha muundo au umbo lote la mwili; “umbo langu” huepuka kuifanya maana iwe ya mifupa peke yake.
- source_word: מִמֶּךָּ
  choice: kwako
  rationale: Pamoja na kitenzi “kufichwa,” “kwako” huwasilisha kwa kawaida maana ya kutofichwa kutoka katika kuona au kujua kwa Mungu.
- source_word: אֲשֶׁר
  choice: nilipo-
  rationale: Kiambishi hiki cha uhusiano kinaeleweka hapa kwa maana ya wakati; “nilipoumbwa” huonyesha hali ya muda bila kulazimisha tafsiri nyingine.
- source_word: עֻשֵּׂיתִי
  choice: nilipoumbwa
  rationale: Hii inadumisha kauli ya kutendwa ya “kufanywa,” huku “kuumbwa” ikiwa ya kawaida na yenye heshima katika muktadha wa kutengenezwa kwa mwili.
- source_word: בַסֵּתֶר
  choice: kwa siri
  rationale: Usemi huu unaonyesha mahali au hali iliyofichika; “kwa siri” ni wa asili na unaendana na ushairi wa mstari.
- source_word: רֻקַּמְתִּי
  choice: niliposukwa
  rationale: “Kusukwa” huhifadhi picha ya kazi tata ya nyuzi inayodokezwa na רקם, bila kutumia istilahi ngumu isiyo ya kawaida.
- source_word: בְּתַחְתִּיּוֹת אָרֶץ
  choice: katika vilindi vya dunia
  rationale: Tafsiri hii huhifadhi taswira ya kishairi ya sehemu za chini kabisa za dunia na haisemi wazi kwamba ni tamathali pekee.
theological_decisions:
- issue: Maana ya “vilindi vya dunia”
  choice: Kuhifadhi taswira ya kishairi bila kuifafanua ndani ya mstari kuwa tumbo la uzazi
  alternative: Kuitafsiri moja kwa moja kuwa mahali pa siri pa kutungwa kwa mtoto tumboni, au kuwa rejeo halisi la chini ya dunia
  rationale: Muktadha unaunganisha usemi huu na kufanyizwa kwa siri, lakini maneno ya Kiebrania yanadumisha taswira ya dunia. Tafsiri inaihifadhi, na tanbihi inaeleza uwezekano wa maana bila kutatua mvutano kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Ulinganifu wa vishazi viwili umehifadhiwa kwa “nilipoumbwa … niliposukwa,” na taswira ya kusukwa na vilindi vya dunia haijafutwa.
