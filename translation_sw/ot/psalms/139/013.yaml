base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/013.yaml
  text: For you formed my inward parts[b][a]; you wove me together in my mother’s womb.
translation:
  language: sw
  text: Kwa maana wewe ndiye uliyeumba sehemu zangu za ndani[b]; ulinifuma katika tumbo la mama yangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya moja kwa moja zaidi, “ulinifunika.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “figo zangu,” usemi wa picha unaomaanisha sehemu za ndani kabisa za mtu.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya sifa iliyotangulia na kudumisha mtiririko wa kishairi.
- source_word: קָנִיתָ
  choice: uliyeumba
  rationale: Kitenzi kinaweza kumaanisha kupata au kumiliki, lakini katika muktadha huu wa kufanyizwa tumboni, ‘kuumba’ huwasilisha kwa kawaida tendo la Mungu bila kuleta wazo la biashara.
- source_word: כִלְיֹתָי
  choice: sehemu zangu za ndani
  rationale: Kwa neno ni ‘figo zangu,’ lakini katika Kiebrania figo huwakilisha sehemu za ndani kabisa za mtu. Tafsiri hii inaeleweka huku tanbihi ikihifadhi picha halisi.
- source_word: תְּסֻכֵּנִי
  choice: uliniunganisha kwa ustadi
  rationale: Mzizi סכך kimsingi huhusu kufunika au kukinga. Katika muktadha wa tumbo la uzazi, kauli hii inaweza kueleweka kuwa tendo la Mungu la kumfanyiza mtu kwa ustadi; tanbihi inahifadhi maana ya moja kwa moja na tafsiri nyingine inayowezekana.
- source_word: בְּבֶטֶן אִמִּי
  choice: tumboni mwa mama yangu
  rationale: Ni Kiswahili cha kawaida kinachohifadhi mahali na uhusiano wa kimama uliomo katika Kiebrania.
theological_decisions:
- issue: Lugha kuhusu kufanyizwa kabla ya kuzaliwa bila kuingiza madai ya baadaye ya kimafundisho
  choice: Mstari unasomwa kama uthibitisho wa kishairi kwamba Mungu alihusika moja kwa moja katika kufanyizwa kwa mtunga zaburi tumboni.
  alternative: 'Tafsiri ya moja kwa moja zaidi: ‘wewe ulizipata/ulizimiliki figo zangu; ulinifunika tumboni mwa mama yangu.’'
  rationale: Tafsiri inadumisha kauli thabiti ya utendaji wa Mungu na picha ya kishairi, bila kuongeza mfumo wa kimafundisho ambao mstari wenyewe hautamki.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa viashiria umewekwa karibu na maneno yanayohusika: [b] baada ya ‘sehemu zangu za ndani’ na [a] baada ya kauli ya kufanyizwa.'
