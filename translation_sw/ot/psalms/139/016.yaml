  text: גָּלְמִ֤/י רָ֘א֤וּ עֵינֶ֗י/ךָ וְ/עַֽל סִפְרְ/ךָ֮ כֻּלָּ֪/ם יִכָּ֫תֵ֥בוּ יָמִ֥ים יֻצָּ֑רוּ ו/לא אֶחָ֣ד בָּ/הֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/016.yaml
  text: Your eyes saw my unformed substance[a], and in your book they all were written—the days that were formed[c][b], when not one of them yet existed.
translation:
  language: sw
  text: Macho yako yaliona umbo langu lisilokamilika[a]; na katika kitabu chako ziliandikwa zote—siku zilizofanyizwa[c][b], kabla hata moja ya hizo haijakuwapo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umbo langu ambalo halijakamilika,” au “kiinitete changu.” Neno la Kiebrania hurejelea kitu ambacho bado hakijafanyizwa au kukamilika kabisa.
    reason: lexical_alternative
  - marker: b
    text: Au “zote ziliandikwa katika kitabu chako; siku zilifanyizwa kwa ajili yangu.” Muundo wa Kiebrania umefupishwa na ni mgumu.
    reason: alternative_reading
  - marker: c
    text: “Zilizofanyizwa” pia zinaweza kutafsiriwa “zilizoumbwa.” Wengine hutafsiri “zilizopangwa tangu awali,” lakini hiyo huongeza maana kuliko maana ya msingi ya kitenzi cha Kiebrania.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּלְמִי
  choice: nilipokuwa bado sijakamilika
  rationale: Neno גֹּלֶם humaanisha kitu ambacho bado hakijaumbika au kukamilika. Usemi huu ni wa asili katika Kiswahili na haingizii maandishi istilahi mahususi ya kisasa kama ‘kiinitete.’
- source_word: רָאוּ עֵינֶיךָ
  choice: Macho yako yaliniona
  rationale: Huhifadhi picha halisi ya macho ya Mungu kuona, huku kiambishi cha yambwa ‘-ni-’ kikirejelea hali ya mtunga zaburi ambayo bado haijakamilika.
- source_word: וְעַל סִפְרְךָ
  choice: na katika kitabu chako
  rationale: Ingawa עַל mara nyingi ni ‘juu ya,’ pamoja na kitabu maana ya kawaida ni kuandikwa ‘katika’ kitabu.
- source_word: כֻּלָּם יִכָּתֵבוּ
  choice: ziliandikwa zote
  rationale: Huhifadhi hali ya kutendwa na picha ya maandishi katika kitabu. Ngeli ya ‘zi-’ inaelekeza kwa siku zinazotajwa katika mstari unaofuata.
- source_word: יָמִים יֻצָּרוּ
  choice: siku zilizofanyizwa
  rationale: Kitenzi יצר kimsingi ni kufanyiza au kuumba. ‘Zilizofanyizwa’ huhifadhi picha hiyo bila kuimarisha maana kuwa ‘ziliamriwa’ au ‘zilipangwa tangu awali.’
- source_word: וְלֹא אֶחָד בָּהֶם
  choice: kabla hata moja ya hizo haijakuwapo
  rationale: 'Kiebrania kimefupisha kishazi hiki. Tafsiri inaweka wazi maana ya wakati: hakuna hata siku moja iliyokuwa imekuwapo bado.'
theological_decisions:
- issue: Ikiwa יֻצָּרוּ itafsiriwe kwa neno linalosisitiza kuamriwa tangu awali
  choice: siku zilizofanyizwa
  alternative: siku zilizoamriwa / siku zilizopangwa
  rationale: Mzizi wa Kiebrania unamaanisha kufanyiza au kuumba, si hasa kuamuru. Chaguo hili linaonyesha ujuzi na kusudi la Mungu bila kulazimisha hitimisho mahususi la kimafundisho.
- issue: Kiambishi ‘kwa ajili yangu’ katika kishazi cha siku
  choice: Hakikuongezwa katika matini kuu
  alternative: siku zilizofanyizwa kwa ajili yangu
  rationale: Ingawa muktadha unahusu siku za mtunga zaburi, maneno ‘kwa ajili yangu’ hayapo wazi katika maandishi ya Kiebrania; kutoyaongeza kunalinda ufupi na utata wake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. ‘Bado sijakamilika’ ni usemi wa kawaida na wenye heshima; tanbihi huhifadhi mbadala halisi zaidi. Alama zote za tanbihi zimewekwa katika matini kuu.
