base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/014.yaml
  text: I praise you[a], because I am fearfully and wonderfully made; wonderful are your works[b], and my soul knows it very well.
translation:
  language: sw
  text: Ninakusifu, kwa sababu nimeumbwa kwa namna ya ajabu yenye kutia kicho[a]; kazi zako ni za ajabu, na nafsi yangu[b] inajua hilo vizuri sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nimeumbwa kwa namna ya kustaajabisha yenye kutia kicho.” Kiebrania kinaeleza mshangao wenye heshima na kicho, si hofu ya kutishwa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania “nafsi yangu”; pia inaweza kumaanisha “mimi mwenyewe” au “utu wangu wa ndani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹדְךָ
  choice: Ninakusifu
  rationale: Kitenzi ידה katika Hiphil hapa kina nguvu ya kumsifu au kumshukuru Mungu; “ninakusifu” kinafaa kwa muktadha wa kishairi unaotukuza kazi yake ya uumbaji.
- source_word: עַל כִּי
  choice: kwa sababu
  rationale: Muungano huu unaanzisha sababu ya sifa, na “kwa sababu” unaeleza uhusiano huo wazi katika Kiswahili cha sasa.
- source_word: נוֹרָאוֹת
  choice: kwa namna ya kutia kicho
  rationale: Neno hili linaeleza hali inayozua mshangao wenye heshima na kicho, si hofu ya kutishwa. Kauli hii huepuka maana ya kawaida ya “kutisha” inayoweza kueleweka vibaya.
- source_word: נִפְלֵיתִי
  choice: nimeumbwa ... ya ajabu
  rationale: Kitenzi פלא katika Niphal hueleza kuwa wa ajabu au wa kupita kawaida. “Nimeumbwa” linafafanua kwa Kiswahili kile kinachodokezwa na muktadha wa karibu kuhusu Mungu kumfanyiza mtunga zaburi, huku “ya ajabu” likihifadhi maana kuu ya kitenzi.
- source_word: נִפְלָאִים
  choice: ni za ajabu
  rationale: Neno hili linaonyesha kwamba kazi za Mungu ni za kushangaza na kupita kawaida; “za ajabu” ni la kawaida, wazi, na linadumisha mwangwi wa kishairi wa kishazi kilichotangulia.
- source_word: מַעֲשֶׂיךָ
  choice: kazi zako
  rationale: מַעֲשֶׂה linaweza kumaanisha kazi, tendo, au kitu kilichofanywa. “Kazi zako” linabaki pana vya kutosha kujumuisha kumwumba mtunga zaburi.
- source_word: וְנַפְשִׁי
  choice: na nafsi yangu
  rationale: נֶפֶשׁ linaweza kueleza nafsi, utu mzima, au kilindi cha mtu. “Nafsi yangu” linahifadhi taswira ya kishairi, huku tanbihi ikionyesha upana wa maana yake.
- source_word: יֹדַעַת מְאֹד
  choice: inajua hilo vizuri sana
  rationale: Kitenzi kinakubaliana na נַפְשִׁי, na yambwa yake inadokezwa na muktadha. “Hilo” linaweka wazi rejeo hilo kwa Kiswahili kinachosomeka kwa urahisi.
theological_decisions:
- issue: Maana ya kianthropolojia ya נֶפֶשׁ
  choice: “Nafsi yangu” katika matini kuu, pamoja na tanbihi inayohifadhi maana za “mimi mwenyewe” na “utu wangu wa ndani.”
  alternative: “Mimi mwenyewe” au “utu wangu wa ndani.”
  rationale: Usemi wa Kiebrania ni wa kishairi na wa ndani, lakini haulazimishi mgawanyo mkali wa mwili na roho. Tanbihi inalinda upana huo wa maana bila kuondoa taswira ya matini kuu.
- issue: Kutoa wazi dhana ya kuumbwa katika נִפְלֵיתִי
  choice: “Nimeumbwa ... ya ajabu.”
  alternative: “Nimefanywa kuwa wa ajabu” au “niko wa ajabu.”
  rationale: Ingawa kitenzi chenyewe kinasisitiza hali ya kuwa wa ajabu, mistari ya karibu (Zaburi 139:13, 15–16) inazungumzia Mungu kumfanyiza mtunga zaburi. “Nimeumbwa” ni ufafanuzi wa kimuktadha, si dai la ziada la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Kutia kicho” limetumiwa badala ya “kutisha” ili kuzuia wazo la hofu ya hatari. Mpangilio “kazi zako ni za ajabu” ni wa asili katika Kiswahili, huku urudiaji wa “ajabu” ukihifadhi uhusiano wa maneno ya Kiebrania.
