base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/007.yaml
  text: Where can I go from your Spirit? Or where can I flee from your presence?[a]
translation:
  language: sw
  text: Nitaenda wapi, mbali na Roho wako? Au nitakimbilia wapi, mbali na uwepo wako?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania ruach linaweza pia kumaanisha “upepo” au “pumzi”; hapa muktadha unaunga mkono maana ya “Roho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָ֭נָ֥ה
  choice: wapi
  rationale: Kielezi cha kuuliza kuhusu mahali au mwelekeo; “wapi” ni Kiswahili cha sasa na cha kawaida.
- source_word: אֵלֵ֣ךְ
  choice: nitaenda
  rationale: Ni kitenzi cha nafsi ya kwanza umoja chenye maana ya ‘kwenda.’ Katika swali hili la balagha, “nitaenda wapi” huonyesha kutowezekana kwa kupata mahali pa kujitenga na Mungu.
- source_word: מֵ/רוּחֶ֑/ךָ
  choice: mbali na Roho wako
  rationale: Neno רוּחַ linaweza kumaanisha roho, upepo, au pumzi. Usambamba wake na “uwepo wako” pamoja na muktadha unaelekeza kwa Roho wa Mungu. “Mbali na” huwasilisha hapa wazo la kwenda na kujitenga naye.
- source_word: וְ֝/אָ֗נָה
  choice: Au ... wapi
  rationale: Kiunganishi pamoja na swali linalorudiwa kinaanzisha mstari wa pili unaolingana; “Au ... wapi” ni mtiririko wa asili katika Kiswahili.
- source_word: מִ/פָּנֶ֥י/ךָ
  choice: mbali na uwepo wako
  rationale: Ingawa פָּנִים kihalisi ni ‘uso,’ katika msemo huu humaanisha kuwapo kwa mtu mwenyewe; “uwepo wako” huwasilisha maana hiyo wazi.
- source_word: אֶבְרָֽח
  choice: nitakimbilia
  rationale: Kitenzi ברח humaanisha kukimbia ili kuondoka au kuepuka. “Nitakimbilia wapi” ni Kiswahili cha kawaida kinachodumisha swali la kutafuta mahali pa kujificha bila kuongeza neno ‘kuepuka.’
theological_decisions:
- issue: Iwapo רוּחַ litafsiriwe kwa maana isiyo ya kibinafsi (‘upepo/pumzi’) au kwa maana inayomhusu Mungu (‘Roho’)
  choice: Roho wako
  alternative: upepo wako; pumzi yako
  rationale: Zaburi 139 inasisitiza kwamba uwepo wa Mungu hauwezi kukimbiwa. Usambamba na “uwepo wako” unaunga mkono rejeo kwa Roho wa Mungu, huku tanbihi ikihifadhi upana wa maana ya neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Maswali mawili sambamba yamehifadhiwa, na “mbali na” limetumiwa kueleza kihusishi cha Kiebrania katika kauli ya kwenda au kukimbia kutoka kwa uwepo wa Mungu.
