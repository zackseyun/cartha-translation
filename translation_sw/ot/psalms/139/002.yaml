  yaml_path: translation/ot/psalms/139/002.yaml
  text: You know my sitting down and my rising up[b][a]; you understand my thought from afar.
translation:
  language: sw
  text: Unajua kuketi kwangu na kuinuka kwangu; unalifahamu wazo langu[a] kwa mbali.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nia yangu” au “kusudi langu.”
    reason: lexical_alternative
  - marker: b
    text: “Kwa mbali” huenda kukarejelea umbali wa mahali, au Mungu analifahamu wazo hilo muda mrefu kabla halijaelezwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: unajua
  rationale: Kitenzi hiki kinamwelekea Mungu moja kwa moja na hapa kinaeleza ujuzi wake kamili na unaoendelea; wakati wa sasa unasikika wa kawaida katika Kiswahili.
- source_word: שִׁבְתִּי
  choice: kuketi kwangu
  rationale: Huhifadhi tendo la kuketi pamoja na kiambishi cha nafsi ya kwanza na huunda jozi ya kishairi na “kuinuka kwangu.”
- source_word: וְקוּמִי
  choice: na kuinuka kwangu
  rationale: Huhifadhi ulinganifu wa Kiebrania na “kuketi kwangu”; matendo hayo mawili yanaweza kuwakilisha shughuli za kawaida za maisha kwa ujumla.
- source_word: בַּנְתָּה
  choice: unalitambua
  rationale: “Kutambua” hapa huonyesha ufahamu wenye kupenya ndani zaidi ya kujua tu, huku kikibaki kitenzi cha kawaida na kinachoeleweka.
- source_word: לְרֵעִי
  choice: wazo langu
  rationale: Nomino hii inaweza kumaanisha wazo, nia, au kusudi. “Wazo langu” ndiyo tafsiri ya moja kwa moja zaidi bila kufunga maana nyingine zinazowezekana.
- source_word: מֵרָחוֹק
  choice: kwa mbali
  rationale: 'Huhifadhi taswira na utata wa usemi wa Kiebrania: unaweza kueleweka kama umbali wa mahali au kama Mungu kulitambua wazo kabla halijaonyeshwa.'
theological_decisions:
- issue: Upeo wa ujuzi wa Mungu katika mstari huu
  choice: Mstari unaonyesha Mungu akijua kikamilifu matendo ya nje na wazo la ndani la mtunga zaburi bila kufafanua mfumo fulani wa kifalsafa kuhusu ujuzi wake.
  alternative: Kutafsiri kwa uwazi kuwa Mungu analijua wazo kabla halijatokea, au kuifanya maana ihusu umbali wa mahali pekee.
  rationale: Kiebrania kinaonyesha ujuzi wa Mungu wa ndani sana, lakini “kwa mbali” kinabaki na uwezekano zaidi ya mmoja. Tafsiri haiufungi mvutano huo wa kishairi kwa maelezo ya kimafundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi wa “kuketi kwangu na kuinuka kwangu” umehifadhiwa, na lugha imeepuka msamiati wa kidhehebu.
