base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/024.yaml
  text: And see whether there is any grievous way in me[b][a], and lead me in the everlasting way.
translation:
  language: sw
  text: Na uone kama kuna njia yoyote yenye kuleta maumivu ndani yangu[a], na uniongoze katika njia ya milele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “njia yoyote yenye kuumiza,” “njia yoyote yenye kuchukiza”; huenda pia, “njia yoyote ya kuabudu sanamu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “njia ya kale” au “njia ya zamani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאֵה
  choice: Na uone
  rationale: Ni ombi la moja kwa moja kwa Mungu linaloendeleza sala ya mstari uliotangulia; ‘uone’ huhifadhi maana ya msingi na ni ya kawaida katika Kiswahili.
- source_word: אִם
  choice: kama ... kuna
  rationale: Katika muktadha huu neno hilo linaanzisha swali lisilo la moja kwa moja. Muundo ‘kama ... kuna’ ni wa asili katika Kiswahili.
- source_word: דֶּרֶךְ עֹצֶב
  choice: njia yoyote iletayo huzuni
  rationale: ‘Njia’ huhifadhi sitiari ya mwenendo wa maisha, nayo ‘iletayo huzuni’ huwasilisha wazo la maumivu, madhara, au jambo linalohuzunisha bila kulibana kuwa ibada ya sanamu pekee.
- source_word: בִּי
  choice: ndani yangu
  rationale: Huwasilisha wazi uchunguzi wa hali au mwenendo uliomo ndani ya mwombaji.
- source_word: וּנְחֵנִי
  choice: na uniongoze
  rationale: Kitenzi kinamaanisha kuongoza au kuelekeza; ‘uniongoze’ kinafaa kwa ombi na kwa sitiari ya njia.
- source_word: בְּדֶרֶךְ עוֹלָם
  choice: katika njia ya milele
  rationale: ‘Katika njia’ ni muundo wa kawaida wa kuonyesha mwenendo unaofuatwa. ‘Ya milele’ huhifadhi maana ya muda usio na mwisho huku uwezekano wa maana ya kale ukielezwa katika tanbihi.
theological_decisions:
- issue: Maana ya דֶּרֶךְ עֹצֶב
  choice: njia yoyote iletayo huzuni
  alternative: njia yoyote yenye kuumiza; njia yoyote yenye kuchukiza; njia yoyote ya ibada ya sanamu
  rationale: Kirai hiki kina maana pana na yenye utata. Tafsiri kuu huhifadhi wazo la mwenendo unaosababisha huzuni au madhara bila kuamua kwamba kinazungumzia ibada ya sanamu pekee.
- issue: Maana ya דֶּרֶךְ עוֹלָם
  choice: njia ya milele
  alternative: njia ya kale; njia ya tangu zamani
  rationale: ‘Ya milele’ huonyesha kudumu kwa njia inayompendeza Mungu na kudumisha utofautishaji wake na njia iletayo huzuni, lakini maana ya ukale pia inawezekana kwa neno עוֹלָם.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa sala umehifadhiwa, pamoja na sitiari ya ‘njia’; tanbihi zinaonyesha utata halisi wa maneno ya Kiebrania bila kuingiza msimamo wa kimadhehebu.
