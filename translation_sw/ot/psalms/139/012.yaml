  text: גַּם חֹשֶׁךְ֮ לֹֽא יַחְשִׁ֪יךְ מִ֫מֶּ֥/ךָ וְ֭/לַיְלָה כַּ/יּ֣וֹם יָאִ֑יר כַּ֝/חֲשֵׁיכָ֗ה כָּ/אוֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/012.yaml
  text: Even darkness is not dark to you[a]; the night shines like the day[b]; darkness is like light to you.
translation:
  language: sw
  text: Hata giza si giza kwako; usiku huangaza kama mchana; kwako giza ni sawa na nuru.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם
  choice: Hata
  rationale: 'Huleta msisitizo wa kukubali jambo lisilotarajiwa: hata giza haliwezi kuwa kizuizi mbele za Mungu.'
- source_word: חֹשֶׁךְ
  choice: giza
  rationale: Ni neno la kawaida na lisiloegemea upande fulani kwa hali ya kutokuwapo kwa nuru, na linadumisha ulinganifu wa giza na nuru.
- source_word: לֹא יַחְשִׁיךְ מִמֶּךָ
  choice: si giza kwako
  rationale: Ingawa kitenzi cha Kiebrania kina umbo la kusababisha, katika muktadha huu Kiswahili hiki ni cha kawaida na kinadumisha wazo kwamba giza halifanyi hali kuwa yenye giza kwa Mungu, bila kuongeza tafsiri ya ‘halikufichi.’
- source_word: וְלַיְלָה
  choice: usiku
  rationale: Hutaja usiku kama kiima cha kishairi katika mstari unaofuata.
- source_word: כַּיּוֹם
  choice: kama mchana
  rationale: Kiambishi כ־ kinaonyesha ulinganisho; ‘kama mchana’ ni usemi wa kawaida wa Kiswahili.
- source_word: יָאִיר
  choice: huangaza
  rationale: Huhifadhi maana ya kitenzi אור, ‘kuangaza/kutoa nuru,’ na taswira ya kishairi ya usiku unaong'aa.
- source_word: כַּחֲשֵׁיכָה כָּאוֹרָה
  choice: kwako giza ni sawa na nuru
  rationale: 'Huwasilisha kwa Kiswahili sanifu ulinganifu mfupi wa Kiebrania: giza na nuru ni sawasawa mbele za Mungu.'
theological_decisions:
- issue: Iwapo kufafanua kwamba giza haliwezi kumfichia Mungu kitu
  choice: Taswira ya giza kutokuwa giza kwake imedumishwa.
  alternative: Hata giza haliwezi kukufichia kitu.
  rationale: Mbadala unaeleza vizuri maana inayodokezwa, lakini unaongeza ‘kitu’ na kubadili taswira ya Kiebrania kuwa maelezo ya moja kwa moja kuhusu uwezo wa Mungu kuona.
- issue: Jinsi ya kuelewa kishazi cha mwisho
  choice: kwako giza ni sawa na nuru
  alternative: kama lilivyo giza, ndivyo ilivyo nuru
  rationale: Kiebrania ni kifupi na kinaweza kueleweka kuwa giza na nuru ni sawasawa kwa Mungu. Tafsiri iliyochaguliwa hudumisha maana hiyo kwa Kiswahili cha kawaida bila kuondoa ulinganifu wa kishairi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Sentensi fupi zinazolingana zimetumiwa kuhifadhi muundo wa zaburi; hakuna istilahi ya kimadhehebu iliyoingizwa.
