lexical_decisions:
- source_word: אֲשֶׁר
  choice: wanao-
  rationale: Kiambishi cha uhusiano kinaanzisha maelezo kuhusu waovu waliotajwa katika muktadha.
- source_word: יֹאמְרֻךָ
  choice: wanaokutaja
  rationale: Kitenzi אמר chenye kiambishi cha nafsi ya pili kinaeleweka hapa kama kusema au kutaja habari za Mungu, si lazima kusema naye moja kwa moja.
- source_word: לִמְזִמָּה
  choice: kwa nia mbaya
  rationale: מְזִמָּה inaweza kumaanisha mpango au hila ovu; tafsiri hii inaonyesha kusudi la uovu kwa Kiswahili cha kawaida.
- source_word: נָשֻׂא
  choice: hulitaja
  rationale: Ingawa maana halisi ni kuinua au kubeba, pamoja na שׁוא kifungu kinaweza kuonyesha kutumia au kutaja isivyofaa; hapa kimetafsiriwa kwa mtiririko wa nahau ya Kiswahili.
- source_word: לַשָּׁוְא
  choice: kwa ubatili
  rationale: שָׁוְא hujumuisha ubatili, uongo, na matumizi yasiyofaa; 'kwa ubatili' huhifadhi upana huo.
- source_word: עָרֶיךָ
  choice: adui zako
  rationale: Katika muktadha wa Zaburi 139:19–22, umbo hili linaeleweka kuwa wapinzani wa Mungu, si 'miji yako.'
theological_decisions:
- issue: Kitu cha kitenzi na nahau katika kishazi cha mwisho
  choice: adui zako hulitaja jina lako kwa ubatili
  alternative: adui zako hukuinua kwa uongo; au, wao huinua kwa ajili ya uongo—adui zako
  rationale: Kiebrania cha kishazi cha mwisho kina ugumu wa kisintaksia. 'Jina' halipo wazi katika maandishi, lakini limeongezwa ili kuwasilisha uwezekano wa nahau נשׂא + שׁוא kwa Kiswahili cha kawaida. Tanbihi huhifadhi usomaji mwingine badala ya kuficha utata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. 'Kwa ubatili' huhifadhi uzito wa kishairi na wigo wa maana wa שָׁוְא; tanbihi inaweka wazi kuwa 'jina' limeelezwa kwa kudokezwa.
