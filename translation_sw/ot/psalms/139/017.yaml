  yaml_path: translation/ot/psalms/139/017.yaml
  text: And to me[a], how precious are your thoughts, O God[b]; how vast is the sum of them!
translation:
  language: sw
  text: Kwangu mimi, jinsi mawazo yako[a] yalivyo ya thamani, Ee Mungu! Na jumla yake[b] ni kubwa mno!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “rafiki zako” au “wapendwa wako.” Neno la Kiebrania linaweza kueleweka hivyo, lakini muktadha wa kuhesabu na wingi mkubwa katika mistari ya 17–18 unapendelea “mawazo yako.”
    reason: alternative_reading
  - marker: b
    text: Kihalisi, “vichwa vyao.” Hapa nahau hiyo yaelekea kumaanisha “jumla yake” au “idadi yake yote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִי
  choice: Kwangu mimi
  rationale: Muundo huu unaonyesha mtazamo wa binafsi wenye mkazo, ‘kwangu/as for me,’ kwa Kiswahili cha kawaida na cha kishairi.
- source_word: מַה יָּקְרוּ
  choice: jinsi ... yalivyo ya thamani
  rationale: מַה hapa ni ya mshangao, na יקר huonyesha thamani au uzito wa kitu. Tafsiri hii huhifadhi mshangao wa mshairi.
- source_word: רֵעֶיךָ
  choice: mawazo yako
  rationale: Ingawa umbo hili linaweza kueleweka kuwa ‘rafiki zako’ au ‘wapendwa wako,’ muktadha wa kuhesabu katika mstari unaofuata unaunga mkono maana ya ‘mawazo yako.’
- source_word: אֵל
  choice: Ee Mungu
  rationale: Jina hili linatumika kama mwito wa moja kwa moja kwa Mungu; ‘Ee Mungu’ huhifadhi nguvu ya kishairi ya mwito huo.
- source_word: מֶה עָצְמוּ
  choice: ni kubwa mno
  rationale: Kitenzi עצם hapa kinaonyesha ukubwa au wingi usio wa kawaida, hasa kwa kuzingatia kutoweza kuhesabika katika mstari unaofuata.
- source_word: רָאשֵׁיהֶם
  choice: Jumla yake
  rationale: Kihalisi ni ‘vichwa vyao,’ lakini hapa ni nahau inayoweza kumaanisha jumla au idadi yote; ‘jumla yake’ ni wazi na inaendana na muktadha wa kuhesabu.
theological_decisions:
- issue: Maana ya רֵעֶיךָ katika mstari huu
  choice: mawazo yako
  alternative: rafiki zako; wapendwa wako
  rationale: Muktadha wa Zaburi 139:17–18, hasa kutajwa kwa kuhesabu na wingi mkubwa, unapendelea maana dhahania ya mawazo ya Mungu. Hata hivyo, usomaji mbadala ni halisi kiisimu na umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa mshangao umehifadhiwa, na istilahi zisizo za kawaida zimefafanuliwa kwa tanbihi.
