  text: יִֽרַדֹּ֥ף אוֹיֵ֨ב נַפְשִׁ֡/י וְ/יַשֵּׂ֗ג וְ/יִרְמֹ֣ס לָ/אָ֣רֶץ חַיָּ֑/י וּ/כְבוֹדִ֓/י לֶ/עָפָ֖ר יַשְׁכֵּ֣ן סֶֽלָה׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/005.yaml
  text: let the enemy pursue my life and overtake it[a]; let him trample my life to the ground and make my glory dwell in the dust[b]. Selah
translation:
  language: sw
  text: 'Adui na afuatilie uhai wangu na kuufikia[a];

    na aukanyage uhai wangu ardhini,

    na aufanye utukufu wangu ukae mavumbini[b]. Sela'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi yangu”; neno la Kiebrania linaweza kumaanisha mtu mwenyewe, nafsi, au uhai kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au, “heshima yangu” au “hadhi yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרַדֹּף
  choice: na aufuatilie
  rationale: Muundo wa kutakia katika muktadha wa kiapo cha kujilaani umehifadhiwa kwa “na,” huku “fuatilia” ikitoa picha ya adui anayemkimbiza mtu.
- source_word: אוֹיֵב
  choice: adui
  rationale: Kiswahili hakihitaji kibainishi sawa na “a/the”; “adui” huhifadhi umoja bila kulazimisha uhakika ambao Kiebrania hakijaweka wazi.
- source_word: נַפְשִׁי
  choice: uhai wangu
  rationale: Katika muktadha wa kufuatiliwa na kukanyagwa, neno hili linamaanisha hasa uhai au mtu mwenyewe, wala si lazima nafsi isiyo ya mwili.
- source_word: וְיַשֵּׂג
  choice: na kuufikia
  rationale: Kitenzi kina maana ya kumfikia au kumpata anayefuatiliwa; kiwakilishi “u-” kinaendeleza uhai uliotajwa.
- source_word: וְיִרְמֹס
  choice: na aukanyage
  rationale: “Kukanyaga” huhifadhi picha kali ya kukanyagwa kwa miguu.
- source_word: לָאָרֶץ
  choice: ardhini
  rationale: Hutoa kwa kawaida maana ya kuelekea au kuwa chini ardhini katika picha ya kukanyagwa.
- source_word: חַיָּי
  choice: uhai wangu
  rationale: Ingawa umbo la Kiebrania ni la wingi, linatumika kama nahau kumaanisha uhai.
- source_word: וּכְבוֹדִי
  choice: utukufu wangu
  rationale: “Utukufu” huhifadhi upana na uzito wa kishairi wa כבוד, ambao pia unaweza kumaanisha heshima au hadhi.
- source_word: לֶעָפָר
  choice: mavumbini
  rationale: Huhifadhi taswira ya kunyenyekezwa na kifo inayohusishwa na mavumbi.
- source_word: יַשְׁכֵּן
  choice: aufanye ... ukae
  rationale: 'Muundo huu huhifadhi maana ya kisababishi ya kitenzi: kusababisha kitu kikae au kitulie mahali.'
- source_word: סֶלָה
  choice: Sela
  rationale: Neno limeandikwa kwa matamshi yake ya kimapokeo kwa sababu maana yake kamili haijulikani kwa hakika.
theological_decisions:
- issue: Maana ya kianthropolojia ya נַפְשִׁי
  choice: uhai wangu
  alternative: nafsi yangu
  rationale: Matendo ya kufuatilia, kufikia, na kukanyaga yanaelekeza kwa uhai au mtu mwenyewe; tafsiri hii haingizi bila sababu mgawanyo finyu wa mwili na nafsi.
- issue: Maana ya כְבוֹדִי katika kujirejelea kwa kishairi
  choice: utukufu wangu
  alternative: heshima yangu au hadhi yangu
  rationale: “Utukufu” huhifadhi utajiri wa sitiari ya Kiebrania, huku tanbihi ikionyesha maana nyingine zinazowezekana bila kuifunga picha hiyo kwa tafsiri moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka. Muundo wa “na” umetumiwa kuonyesha ombi au laana ya kujitakia inayofuatia sharti la mstari uliotangulia. Mistari na taswira za kufuatilia, kukanyaga, ardhi, na mavumbi zimehifadhiwa.
