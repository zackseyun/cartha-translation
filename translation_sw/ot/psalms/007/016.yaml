base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/016.yaml
  text: His trouble returns on his own head[b][a], and his violence descends on his own skull.
translation:
  language: sw
  text: 'Uovu wake utarudi juu ya kichwa chake[a],

    na ukatili wake utashuka juu ya utosi wake[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Taabu yake itarudi juu ya kichwa chake.” Neno la Kiebrania עָמָל linaweza kumaanisha taabu, uovu, au madhara mabaya katika muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: Au, “juu ya kilele cha kichwa chake.” Neno la Kiebrania קָדְקֹד linamaanisha utosi, yaani sehemu ya juu kabisa ya kichwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּב
  choice: yatamrudia
  rationale: Kitenzi שוב kinaonyesha kwamba madhara ya mtu mwovu yanamgeukia na kumfikia yeye mwenyewe; “yatamrudia” ni Kiswahili cha kawaida kinachohifadhi wazo la kurudi na kulipiza kwa kishairi.
- source_word: עֲמָלוֹ
  choice: madhara yake
  rationale: עָמָל inaweza kumaanisha taabu, uovu, au tendo lenye kuleta madhara. Katika muktadha huu inahusu madhara yanayotokana na njama mbaya, si kazi ya kawaida; “madhara yake” huhifadhi maana hiyo huku tanbihi ikitaja uwezekano mwingine.
- source_word: בְּרֹאשׁוֹ
  choice: kichwani pake
  rationale: Hili linawasilisha moja kwa moja picha ya matokeo ya matendo yake kumrudia juu ya kichwa chake mwenyewe.
- source_word: וְעַל
  choice: na ... utosini
  rationale: Kiunganishi na kihusishi vimewasilishwa kwa mtiririko wa kawaida wa Kiswahili huku ulinganifu wa mishororo ukihifadhiwa.
- source_word: קָדְקֳדוֹ
  choice: utosini mwake
  rationale: קָדְקֹד ni sehemu ya juu kabisa ya kichwa, yaani utosi. Neno “utosi” ni sahihi, wazi, na linadumisha uimarishaji wa picha baada ya “kichwani.”
- source_word: חֲמָסוֹ
  choice: ukatili wake
  rationale: חָמָס humaanisha ukatili, jeuri, au uovu wenye kutumia nguvu. “Ukatili” ni neno la asili na linaloeleweka kwa upana katika Kiswahili cha Afrika Mashariki.
- source_word: יֵרֵד
  choice: utamshukia
  rationale: Kitenzi ירד kina maana ya kushuka. “Utamshukia” huhifadhi picha ya kitu kinachoshuka juu ya mtu na pia huonyesha wazi kwamba yeye ndiye anayepatwa nacho.
theological_decisions:
- issue: Picha ya malipo ya haki katika ushairi
  choice: Madhara na ukatili wa mtu mwovu vinaonyeshwa vikimrudia yeye mwenyewe.
  alternative: Mstari unaweza kueleweka kwa ujumla zaidi kuwa taabu humrudia mtu, bila kusisitiza kwamba ni matokeo ya uovu wake.
  rationale: Ulinganifu kati ya madhara yanayorudi kichwani na ukatili unaoshukia utosini unaonyesha matokeo ya uovu kumwangukia mtendaji wake. Tafsiri inadumisha wazo hilo bila kuongeza dai la kimafundisho lisilosemwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Ulinganifu wa “kichwani” na “utosini” pamoja na mwendo wa “kurudi” na “kushuka” umehifadhiwa.
