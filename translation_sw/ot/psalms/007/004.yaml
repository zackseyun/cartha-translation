lexical_decisions:
- source_word: אִם
  choice: ikiwa
  rationale: Inaingiza sharti la kiapo cha kujilaani; “ikiwa” ni ya kawaida na hudumisha muundo huo.
- source_word: גָּמַלְתִּי
  choice: nimemlipa
  rationale: Huwasilisha wazo la kumtendea mtu kwa malipo au kulipiza, linalofaa pamoja na kitu kinacholipwa, yaani maovu.
- source_word: שׁוֹלְמִי
  choice: mtu aliye na amani nami
  rationale: Tafsiri hii inadumisha maana halisi ya mtu aliye katika uhusiano wa amani na msemaji bila kuibana kuwa rafiki au mshirika rasmi.
- source_word: רָע
  choice: maovu
  rationale: Hudumisha uzito wa kimaadili wa neno, si madhara ya kawaida tu.
- source_word: וָאֲחַלְּצָה
  choice: nimemnyang’anya
  rationale: Katika ulinganifu wa mistari, kitenzi kinaeleweka kwa maana hasi ya kumvua au kumnyang’anya mtu, hivyo vifungu vyote viwili vinataja makosa yanayokanushwa. Maana ya kawaida zaidi ya kuokoa imehifadhiwa katika tanbihi.
- source_word: צוֹרְרִי
  choice: adui yangu
  rationale: Ni usemi wa sasa, wazi na wa kawaida kwa mtu anayempinga msemaji.
- source_word: רֵיקָם
  choice: bila sababu
  rationale: Katika usomaji wa tendo hasi, kielezi hiki kinaonyesha kuwa tendo lingefanywa pasipo sababu ya haki.
theological_decisions:
- issue: Maana ya וָאֲחַלְּצָה צוֹרְרִי רֵיקָם
  choice: 'usambamba hasi: “nimemnyang’anya adui yangu bila sababu”'
  alternative: 'usomaji chanya wa kukubali jambo: “ingawa nilimwokoa aliyekuwa adui yangu bila sababu”'
  rationale: Kitenzi חלץ kinaweza kumaanisha kuokoa au kukomboa, lakini pia kimeeleweka hapa kuwa kumvua au kumnyang’anya. Maana hasi inadumisha usambamba wa makosa mawili yanayokanushwa katika kiapo; hata hivyo, usomaji wa kuokoa ni halisi na umewekwa wazi katika tanbihi badala ya kufichwa.
