translation:
  language: sw
  text: 'Tazama: ana uchungu wa kuzaa uovu, anapata mimba ya taabu, naye anazaa uongo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaunganisha taswira za uchungu wa kuzaa, kupata mimba, na kuzaa. Kitenzi cha kwanza kinaweza pia kutafsiriwa “anajitaabisha kwa uchungu wa kuzaa,” huku maneno yaliyotafsiriwa “uovu” na “taabu” yakiwa na maana zinazokaribiana.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira za msomaji kwenye taswira hai inayofuata; “Tazama” ni la kawaida na lenye hadhi katika Kiswahili cha Biblia.
- source_word: יְחַבֶּל
  choice: anajitaabisha kwa
  rationale: Katika muktadha wa kuzaa, kitenzi kinaweza kuashiria uchungu wa kuzaa au kujitaabisha. Chaguo hili linahifadhi wazo la juhudi yenye maumivu bila kulichanganya na kitenzi kinachofuata cha kuchukua mimba.
- source_word: אָוֶן
  choice: uovu
  rationale: Neno linaweza kumaanisha uovu, ubaya, au taabu inayosababishwa na uovu. “Uovu” linadumisha uzito wa kimaadili na kulitofautisha na עָמָל.
- source_word: הָרָה
  choice: anachukua mimba ya
  rationale: Hiki ndicho kitenzi cha wazi cha kupata au kuwa na mimba. Usemi huu wa Kiswahili unaendeleza tamathali ya uzazi na mpangilio uliobanwa wa Kiebrania.
- source_word: עָמָל
  choice: taabu
  rationale: Hapa neno linataja madhara, shida, au taabu inayotokana na uovu; “taabu” ni neno la kawaida lenye upana unaofaa.
- source_word: יָלַד שָׁקֶר
  choice: kuzaa uongo
  rationale: Usemi huu unakamilisha taswira ya uzazi kwa njia fupi na ya asili, huku שָׁקֶר ikibaki na maana yake ya uongo au udanganyifu.
