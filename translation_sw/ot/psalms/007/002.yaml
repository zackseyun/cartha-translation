lexical_decisions:
- source_word: פֶּן
  choice: asije
  rationale: Huanzisha matokeo yanayoogopwa; muundo huu wa Kiswahili unadumisha maana ya onyo na hofu.
- source_word: יִטְרֹף
  choice: akaurarua
  rationale: Kitenzi kinahusu mnyama mkali anayerarua mawindo; ‘akaurarua’ ni cha wazi na chenye nguvu katika Kiswahili.
- source_word: כְּאַרְיֵה
  choice: kama simba
  rationale: Huhifadhi tashbihi ya Kiebrania kwa lugha ya kawaida na ya moja kwa moja.
- source_word: נַפְשִׁי
  choice: uhai wangu
  rationale: Katika muktadha huu neno linamaanisha maisha au nafsi nzima ya mtunga zaburi iliyo hatarini, si lazima roho isiyo ya mwili.
- source_word: פֹּרֵק
  choice: akiuchana vipandevipande
  rationale: Hupanua picha ya simba anayeyararua mawindo na kuonyesha uharibifu mkali; kiwakilishi cha yambwa kinarejelea ‘uhai wangu.’
- source_word: וְאֵין מַצִּיל
  choice: bila mtu wa kuniokoa
  rationale: Huwasilisha kwa Kiswahili cha kawaida kutokuwapo kwa yeyote anayeweza kumwokoa mtunga zaburi.
