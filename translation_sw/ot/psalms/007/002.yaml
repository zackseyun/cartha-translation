  text: asije akaurarua uhai wangu[a] kama simba, akiuchana vipande-vipande bila mtu wa kuniokoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafsi yangu”; hapa neno la Kiebrania נַפְשִׁי linamaanisha uhai wa mtunga zaburi au yeye mwenyewe akiwa hatarini.
