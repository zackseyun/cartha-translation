  yaml_path: translation/ot/psalms/007/007.yaml
  text: And let the assembly of peoples surround you[b][a]; and over them return on high.
translation:
  language: sw
  text: Kusanyiko la mataifa[a] likuzunguke; na juu yao[b] urudi mahali pa juu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jamii za watu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kinaweza pia kueleweka kwa umoja: “na juu yake urudi mahali pa juu,” kikirejelea kusanyiko kama kundi moja.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֲדַת
  choice: kusanyiko
  rationale: Neno hili humaanisha kundi lililokusanyika. “Kusanyiko” ni la kawaida, lenye heshima, na haliongezi maana maalumu ya kidini.
- source_word: לְאֻמִּים
  choice: jamii za watu
  rationale: Wingi huu hurejelea makundi mbalimbali ya watu. “Jamii za watu” huhifadhi wazo la makundi mengi, huku “mataifa” likibaki tafsiri inayowezekana.
- source_word: תְּסוֹבְבֶךָּ
  choice: likuzunguke
  rationale: Umbo hili limetafsiriwa kama ombi au tamanio, si taarifa rahisi ya wakati ujao; kitenzi huhifadhi maana ya kuzunguka pande zote.
- source_word: וְעָלֶיהָ
  choice: na juu yao
  rationale: Ingawa kiambishi cha Kiebrania ni cha umoja wa kike na kwa sarufi hurejelea kusanyiko, Kiswahili kinaweza kurejelea kwa kawaida watu waliokusanyika kwa wingi. Tanbihi huhifadhi uwezekano wa rejeo la umoja.
- source_word: לַמָּרוֹם
  choice: mahali pa juu
  rationale: Huhifadhi maana ya kimo au mahali palipoinuka bila kuongeza wazi dhana ya mbinguni au kiti cha enzi.
- source_word: שׁוּבָה
  choice: urudi
  rationale: Ni agizo au ombi kutoka katika kitenzi chenye maana ya kurudi; tafsiri hii haiongezi wazo la kuketi tena katika kiti cha enzi.
theological_decisions:
- issue: Je, mstari unaeleza hukumu ya Mungu kutoka mahali pa juu au kupanda kwake kihalisi?
  choice: Ombi la kishairi Mungu arudi mahali pake palipoinuka juu ya watu waliokusanyika
  alternative: Ombi Mungu apande kihalisi kwenda mbinguni juu ya kusanyiko, au taarifa kwamba atarudi huko
  rationale: Umbo la שׁוּבָה linaunga mkono ombi, lakini “mahali pa juu” linaacha wazi ikiwa kimo hicho kinaeleweka kama nafasi, mamlaka, au vyote viwili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Mpangilio umehifadhi mwendo wa ombi la Kiebrania na haujaongeza lugha ya kiti cha enzi au hukumu ambayo haikutajwa wazi katika mstari.
