base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/008.yaml
  text: Yahweh judges the peoples[a]; judge me, O Yahweh[c][b], according to my righteousness and according to my integrity that is upon me.
translation:
  language: sw
  text: Yahwe huyahukumu mataifa; nihukumu[a], ee Yahwe, kulingana na haki yangu na unyofu[b] nilio nao[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitetee kwa hukumu yako.” Amri ya Kiebrania inayomaanisha “nihukumu” inaweza katika muktadha huu kumaanisha kutoa hukumu inayomthibitisha msemaji kuwa yuko sawa.
    reason: lexical_alternative
  - marker: b
    text: Au, “kutokuwa kwangu na hatia.”
    reason: lexical_alternative
  - marker: c
    text: Kwa neno halisi, “ulio juu yangu”; hapa yaelekea maana yake ni unyofu alio nao au unaomhusu.
    reason: source_idiom
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa na cheo kama “BWANA”.
- source_word: יָדִין
  choice: huwahukumu
  rationale: Kauli ya Kiebrania inaweza kueleza tendo la kawaida au linaloendelea; kiambishi “hu-” kinawasilisha vizuri maana hiyo katika Kiswahili.
- source_word: עַמִּים
  choice: watu wa mataifa
  rationale: Huhifadhi wazo la makundi mbalimbali ya wanadamu bila kulifanya neno hilo lirejelee serikali za kisiasa pekee.
- source_word: שָׁפְטֵנִי
  choice: nihukumu
  rationale: Hii ndiyo maana ya moja kwa moja ya amri hiyo na inadumisha mwangwi wa kitenzi kilichotangulia; katika muktadha inaweza pia kumaanisha kutoa hukumu ya kumtetea msemaji.
- source_word: כְּצִדְקִי
  choice: kulingana na haki yangu
  rationale: Huhifadhi dai la nafsi ya kwanza na maana ya kipimo au msingi unaoonyeshwa na kiambishi כְּ.
- source_word: וּכְתֻמִּי
  choice: na unyofu
  rationale: “Unyofu” huwasilisha ukamilifu wa mwenendo au uadilifu bila kudokeza moja kwa moja kutokuwa na dhambi kabisa.
- source_word: עָלָי
  choice: nilio nao
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kwamba unyofu huo unamhusu na ni wake, huku tanbihi ikihifadhi picha halisi ya “juu yangu” katika Kiebrania.
theological_decisions:
- issue: Iwapo dai la mtunga zaburi kuhusu haki na unyofu lielezwe kana kwamba ni kutokuwa na dhambi kabisa
  choice: Kuhifadhi dai la moja kwa moja kuhusu “haki yangu” na “unyofu” bila kulilegeza
  alternative: Kulifafanua kama kutokuwa na hatia katika jambo hili pekee
  rationale: Kiebrania chenyewe kinatoa dai hilo moja kwa moja. Tafsiri haipaswi kuondoa mvutano wake wa kiteolojia, ingawa “unyofu” haidai kwa lazima ukamilifu usio na dhambi.
- issue: Iwapo שָׁפְטֵנִי itafsiriwe moja kwa moja au kwa maana ya hukumu yenye kumpendelea msemaji
  choice: nihukumu
  alternative: nitetee kwa hukumu yako / nitangaze kuwa sina hatia
  rationale: Maana ya moja kwa moja hudumisha uhusiano na tendo la Yahwe la kuhukumu mataifa, huku tanbihi ikionyesha maana inayowezekana ya hukumu inayomthibitisha msemaji kuwa yuko sawa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Ee” huhifadhi mwito wa moja kwa moja wa kishairi; “nilio nao” huepuka Kiswahili kisicho cha kawaida cha “ulio juu yangu” katika matini kuu.
