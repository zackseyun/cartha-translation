  text: מָֽגִנִּ֥/י עַל אֱלֹהִ֑ים מ֝וֹשִׁ֗יעַ יִשְׁרֵי לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/010.yaml
  text: My shield is with God[b][a], who saves the upright in heart.
translation:
  language: sw
  text: Ngao yangu iko kwa Mungu,[a] anayewaokoa walio wanyofu moyoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu ndiye ngao yangu.” Maneno ya Kiebrania ni mafupi na hayana kitenzi kilichoandikwa, hivyo yanaweza kupangwa kwa njia hii pia.
    reason: alternative_reading
lexical_decisions:
- source_word: מָגִנִּי
  choice: Ngao yangu
  rationale: Neno hilo kwa maana ya msingi ni “ngao.” Taswira halisi imehifadhiwa badala ya kubadilishwa kuwa dhana pana kama “ulinzi wangu.”
- source_word: עַל
  choice: iko kwa
  rationale: Katika kirai hiki kifupi kisicho na kitenzi kilichoandikwa, kihusishi kinaonyesha kwamba kinga ya mtunga zaburi iko kwa Mungu au inamtegemea Mungu. “Iko kwa” hubaki karibu na muundo wa Kiebrania bila kulazimisha tafsiri moja tu.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania linaweza kuwa la wingi kisarufi, hapa linamtaja Mungu mmoja wa Israeli.
- source_word: מוֹשִׁיעַ
  choice: anayewaokoa
  rationale: Hali ya kushiriki ya Kiebrania inaeleza tendo la Mungu la kawaida; kishazi hiki ni cha kawaida katika Kiswahili na kinaendeleza maana hiyo.
- source_word: יִשְׁרֵי
  choice: walio wanyofu
  rationale: Neno linaeleza watu wenye unyofu wa kimaadili. “Wanyofu” linahifadhi maana ya msingi ya kuwa sawa bila kuhamia kwenye uga tofauti kidogo wa “wenye haki.”
- source_word: לֵב
  choice: moyoni
  rationale: “Moyo” humaanisha utu wa ndani. “Walio wanyofu moyoni” ni usemi wa asili wa Kiswahili unaohifadhi nahau ya Kiebrania.
theological_decisions:
- issue: Uhusiano wa kisintaksia katika sehemu ya kwanza ya mstari
  choice: Ngao yangu iko kwa Mungu
  alternative: Mungu ndiye ngao yangu
  rationale: Kiebrania hakina kitenzi wazi na kinaweza kueleweka kwa njia zaidi ya moja. Tafsiri kuu inafuata kwa karibu mpangilio wa maneno na kuonyesha kwamba ulinzi wa mtunga zaburi unapatikana kwa Mungu; tanbihi inahifadhi uwezekano wa kumtambulisha Mungu moja kwa moja kuwa ngao yake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye staha. Taswira ya “ngao” imehifadhiwa; tanbihi inaonyesha utata halisi wa muundo wa Kiebrania.
