  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Silaha za mauti’ huhifadhi usemi mkali wa asili; ‘huifanya mishale yake iwake moto’ ni ya kawaida na wazi kwa msomaji wa leo.
