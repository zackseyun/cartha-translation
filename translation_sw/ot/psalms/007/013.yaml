translation:
  language: sw
  text: 'Naye amemwandalia silaha za mauti;

    huifanya mishale yake iwake moto.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huifanya mishale yake kwa ajili ya watu wanaofuatilia,” au “dhidi ya watu wanaofuatilia.” Neno la Kiebrania linaweza kueleweka kutokana na kitenzi chenye maana ya “kufuatilia” badala ya “kuwaka,” ingawa tafsiri kuu inafuata taswira ya kawaida ya kivita ya mishale inayowaka moto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹו
  choice: Naye amemwandalia
  rationale: Kiambishi ל pamoja na kiwakilishi cha nafsi ya tatu umoja kinaeleweka kwa kawaida kuwa ‘kwa ajili yake’ au ‘kwa ajili ya huyo.’ Katika muktadha kinamrejelea mwovu wa mstari uliotangulia; umbo la Kiswahili ‘amemwandalia’ linaonyesha kwa asili kwamba silaha zimeandaliwa kwa ajili yake.
- source_word: הֵכִין
  choice: amemwandalia
  rationale: Hiphil ya כון humaanisha ‘kuandaa’ au ‘kuweka tayari.’ Wakati timilifu unaonyesha tendo lililokamilika lenye umuhimu wa sasa.
- source_word: כְּלֵי מָוֶת
  choice: silaha za mauti
  rationale: כְּלִי inaweza kuwa chombo au silaha; muktadha wa mishale unaunga mkono ‘silaha.’ ‘Za mauti’ huhifadhi muundo na uzito wa kishairi wa Kiebrania.
- source_word: חִצָּיו
  choice: mishale yake
  rationale: Hii ni tafsiri ya moja kwa moja ya nomino ya wingi yenye kiambishi cha nafsi ya tatu umoja.
- source_word: לְדֹלְקִים
  choice: iwake moto
  rationale: דלק inaweza kuhusishwa na kuwaka au kufuatilia. Katika taswira ya kivita ya mishale, ‘iwake moto’ huwasilisha mishale inayowaka, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: יִפְעָל
  choice: huifanya
  rationale: Qal ya פעל inaweza kumaanisha kufanya, kutengeneza, au kutenda. Hapa inaeleza kitendo kinachofanywa kwa mishale; ‘huifanya’ ni ya kawaida na inaendana na maana hiyo.
