base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/006.yaml
  text: Rise up[a], O Yahweh, in your anger; lift yourself up against the fury of my enemies; awake for me[c][b]; you have appointed judgment.
translation:
  language: sw
  text: Inuka, ee Yahweh, katika hasira yako; jiinue[a] dhidi ya ghadhabu ya adui zangu; amka kwa ajili yangu[b]; umeamuru hukumu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uinuke juu dhidi ya ghadhabu ya adui zangu.” Kitenzi cha Kiebrania kinaweza pia kumaanisha kuinuliwa au kutukuzwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “amka kwangu,” yaani, “amka kwa niaba yangu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “hukumu uliyoamuru.”
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: Inuka
  rationale: Amri ya kitenzi קום inayomwelekea Mungu; “inuka” ni ya kawaida na inadumisha taswira ya kuchukua hatua.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu katika Kiebrania limetoholewa badala ya kubadilishwa na cheo.
- source_word: בְּאַפֶּךָ
  choice: katika hasira yako
  rationale: אַף humaanisha pua kihalisi na hasira kwa maana ya kiidioma; hapa muktadha unadai maana ya hasira.
- source_word: הִנָּשֵׂא
  choice: jiinue
  rationale: Amri ya Nifali ya נשׂא inadumisha muundo wa kujirejelea na inaendeleza mwito wa Mungu achukue hatua.
- source_word: בְּעַבְרוֹת צוֹרְרָי
  choice: dhidi ya ghadhabu kali ya adui zangu
  rationale: עֶבְרָה huonyesha ghadhabu iliyofurika au kali; “dhidi ya” huwasilisha kwa Kiswahili fasaha nguvu ya ב katika muktadha huu wa uhasama.
- source_word: וְעוּרָה
  choice: amka
  rationale: Amri inadumisha lugha ya kishairi na ya kibinadamu inayomwomba Mungu aingilie kati.
- source_word: אֵלַי
  choice: kwa ajili yangu
  rationale: Ingawa maana ya msingi ni “kwangu,” muktadha wa ombi la kimahakama unaonyesha tendo kwa niaba ya mwombaji.
- source_word: מִשְׁפָּט
  choice: hukumu
  rationale: Neno linaweza kumaanisha hukumu, haki, au uamuzi wa kimahakama; “hukumu” inafaa katika ombi hili la mahakamani.
- source_word: צִוִּיתָ
  choice: umeamuru
  rationale: צוה kwa kawaida ni “amuru”; uchaguzi huu unadumisha maana ya moja kwa moja bila kuibadili kuwa “teua” au “weka.”
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano; kulitohowa kunalitofautisha na cheo.
- issue: Nguvu ya amri zenye taswira ya kibinadamu zinazomwelekea Mungu
  choice: Kudumisha “Inuka… jiinue… amka”
  alternative: Chukua hatua; ingilia kati
  rationale: Lugha hiyo ni ya kishairi na haipaswi kufafanuliwa kana kwamba inadai Mungu alikuwa amelala au hana shughuli.
- issue: Uhusiano wa kifungu מִשְׁפָּט צִוִּיתָ na “amka”
  choice: 'Kukitafsiri kama kauli huru: “umeamuru hukumu”'
  alternative: “amka kwa ajili yangu kwa hukumu uliyoamuru”
  rationale: Sintaksia ya Kiebrania inaweza kuruhusu uhusiano wa karibu na ombi lililotangulia; matini kuu inadumisha mpangilio wa kauli, huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Kiingizi “ee” kinaonyesha mwito wa moja kwa moja kwa heshima; taswira za Kiebrania zimedumishwa bila uchakavu wa lugha.
