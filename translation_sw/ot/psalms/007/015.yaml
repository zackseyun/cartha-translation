base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/015.yaml
  text: He dug a pit and hollowed it out[a], and he fell into the hole he made.
translation:
  language: sw
  text: Alichimba shimo na kulichimbua zaidi,[a] kisha akaanguka ndani ya shimo alilolitengeneza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Alichimba shimo na kulipanua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹר
  choice: shimo
  rationale: Neno hili humaanisha shimo au kisima; hapa picha ya mtego na ulinganifu wake na שַׁחַת vinaunga mkono neno la jumla “shimo.”
- source_word: כָּרָה
  choice: alichimba
  rationale: Kitenzi hiki humaanisha kuchimba; “alichimba” ni tafsiri ya moja kwa moja na ya kawaida inayohifadhi picha halisi.
- source_word: וַיַּחְפְּרֵהוּ
  choice: na kulichimbua zaidi
  rationale: חפר huingiliana kimaana na כרה, lakini mfuatano hapa unaonyesha kuendelea kulichimba au kulifanya liwe kubwa zaidi; usemi huu unahifadhi msisitizo bila marudio yasiyoeleweka.
- source_word: וַיִּפֹּל
  choice: kisha akaanguka
  rationale: Kitenzi kinaendeleza mfuatano wa matendo; “kisha akaanguka” ni Kiswahili cha kawaida kinachoweka wazi hatua inayofuata huku kikihifadhi ufupi wa kishairi.
- source_word: שַׁחַת
  choice: shimo
  rationale: Katika muktadha huu ni tundu la mtego aliloangukia mtu; maana dhahania ya “uharibifu” haifai sana kwa sababu ya picha ya kuchimba na kihusishi בְּ.
- source_word: יִפְעָל
  choice: alilolitengeneza
  rationale: פעל ni kitenzi kipana cha kufanya au kutengeneza; hapa kinarejelea shimo lililotokana na kazi yake ya kuchimba.
theological_decisions: []
