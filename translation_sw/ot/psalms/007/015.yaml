  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inadumisha picha ya mtu anayechimba mtego kisha kuanguka ndani yake; “kulichimbua zaidi” huonyesha hatua ya pili ya uchimbaji bila kulazimisha tofauti kali kati ya vitenzi viwili vya Kiebrania.
