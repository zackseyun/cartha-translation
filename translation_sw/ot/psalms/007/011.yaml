lexical_decisions:
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania linaweza kuwa la wingi, katika muktadha huu linamtaja Mungu mmoja na lina maana ya umoja.
- source_word: שׁוֹפֵט צַדִּיק
  choice: ni mwamuzi mwenye haki
  rationale: Kirai hiki kinamweleza Mungu kuwa mwamuzi anayetenda yaliyo sawa. Kiswahili hiki ni cha kawaida na kinadumisha maana ya kimaadili ya צַדִּיק; hata hivyo, muundo wa Kiebrania pia unaweza kueleweka kuwa Mungu huwahukumu wenye haki.
- source_word: וְאֵל
  choice: naye ni Mungu
  rationale: אֵל hapa inaendelea kumtaja Mungu yuleyule katika usambamba na אֱלֹהִים. 'Naye' pia linaonyesha kiunganishi וְ bila kudokeza kuwa anatajwa mungu mwingine.
- source_word: זֹעֵם
  choice: anayekasirika
  rationale: Kitenzi hiki kinaonyesha hasira au ghadhabu inayoendelea. 'Anayekasirika' ni wazi na ya sasa katika Kiswahili, bila kupunguza lugha ya hasira ya Mungu.
- source_word: בְּכָל יוֹם
  choice: kila siku
  rationale: Kirai hiki kwa kawaida humaanisha 'kila siku' au 'siku baada ya siku,' si lazima muda wote wa siku moja.
theological_decisions:
- issue: Lugha ya hasira ya Mungu
  choice: Mungu anayekasirika kila siku
  alternative: Mungu anayechukizwa kila siku
  rationale: Kiebrania kinamhusisha Mungu moja kwa moja na hasira inayoendelea. Tafsiri hailegezi mvutano huo wa kiteolojia; tanbihi inatoa namna nyingine ya kueleza ghadhabu yenye msingi wa kimaadili.
- issue: Kazi ya צַדִּיק katika sentensi
  choice: Mungu ni mwamuzi mwenye haki
  alternative: Mungu huwahukumu wenye haki
  rationale: Usomaji wa kivumishi/predikati unafaa vizuri katika usambamba unaoeleza tabia ya Mungu, lakini Kiebrania kisicho na alama za yambwa kinaacha uwezekano wa kuisoma צַדִּיק kama nomino ya umoja yenye maana ya 'mwenye haki.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. 'Mwamuzi mwenye haki' ni usemi wa kawaida kuliko muundo mzito wa kisheria, na 'anayekasirika' huhifadhi uwazi wa lugha ya Kiebrania kuhusu hasira ya Mungu.
