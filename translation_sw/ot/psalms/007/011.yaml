  yaml_path: translation/ot/psalms/007/011.yaml
  text: God is a righteous judge[b][a], and a God who is indignant every day.
translation:
  language: sw
  text: Mungu ni mwamuzi mwenye haki,[a] naye ni Mungu mwenye ghadhabu kila siku.[b]
  philosophy: optimal-equivalence
  footnotes:
