  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikiwa kuna kosa mikononi mwangu”; msemo wa Kiebrania unaweza kumaanisha kosa la kimaadili au hatia inayomhusu msemaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano limetafsiriwa moja kwa moja kama “Yahweh,” badala ya kutumia cheo, ili kuhifadhi jina la Mungu lililo katika maandishi ya Kiebrania.
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Nomino אֱלוֹהַּ yenye kiambishi cha nafsi ya kwanza umoja humaanisha “Mungu wangu”; hapa ni sehemu ya mwito wa moja kwa moja.
- source_word: אִם
  choice: ikiwa
  rationale: Neno hili linaanzisha masharti yanayoendelea katika kiapo cha kujilaani; “ikiwa” ni la kawaida na linafaa katika sajili ya kishairi yenye hadhi.
- source_word: עָשִׂיתִי זֹאת
  choice: nimefanya jambo hili
  rationale: Kitenzi cha nafsi ya kwanza umoja pamoja na kiashiria זֹאת kimetafsiriwa kwa hali timilifu; kuongeza “jambo” kunafanya kiashiria kisikike kwa kawaida katika Kiswahili bila kufafanua jambo lisilotajwa.
- source_word: יֶשׁ
  choice: kuna
  rationale: Kiashiria cha kuwapo kimetafsiriwa kwa muundo wa kawaida wa Kiswahili “kuna.”
- source_word: עָוֶל
  choice: udhalimu
  rationale: Neno hili linaweza kumaanisha uovu, kosa, au kutotenda haki; “udhalimu” huhifadhi uzito wa kimaadili na mwelekeo wa kimahakama wa muktadha.
- source_word: בְּכַפָּי
  choice: mikononi mwangu
  rationale: Tafsiri hii huhifadhi taswira ya Kiebrania ya kosa lililo “mikononi,” yaani, tendo au hatia inayomhusu msemaji.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia Tetragramatoni moja kwa moja; “Yahweh” huhifadhi jina la agano bila kulibadilisha kuwa cheo.
- issue: Dai la mtunga zaburi kuhusu kutokuwa na hatia
  choice: ikiwa kuna udhalimu mikononi mwangu
  alternative: ikiwa mikono yangu ina hatia
  rationale: Muundo mkuu huhifadhi taswira na masharti ya Kiebrania bila kuamua mapema kama עָוֶל hapa ni tendo la udhalimu, kosa la jumla, au hatia; maana ya kiidioma imeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Kurudiwa kwa “ikiwa” kunahifadhi muundo wa masharti wa Kiebrania, na mstari mrefu mwishoni unaonyesha kwamba sentensi inaendelea katika aya zinazofuata.
