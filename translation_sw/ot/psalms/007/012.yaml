lexical_decisions:
- source_word: אִם לֹא
  choice: Asipo-
  rationale: Muundo wa masharti hasi katika Kiswahili unaonyesha kwa kawaida na kwa ufupi maana ya ‘ikiwa hata…’ bila kupoteza uhusiano wa sharti.
- source_word: יָשׁוּב
  choice: geuka
  rationale: Kitenzi cha Kiebrania humaanisha kugeuka au kurudi; katika muktadha huu kinaweza kudokeza kutubu, lakini ‘geuka’ kinahifadhi upana wa maana ya asili.
- source_word: חַרְבּוֹ יִלְטוֹשׁ
  choice: ataunoa upanga wake
  rationale: ‘Kunoa’ ni neno la kawaida na sahihi kwa kutia makali upanga, na kiambishi cha umilikaji kimehifadhiwa.
- source_word: קַשְׁתּוֹ דָרַךְ
  choice: ameupinda upinde wake
  rationale: Kwa upinde, kitenzi hiki hueleza kuupinda au kuufunga tayari kwa matumizi; ‘ameupinda’ kinahifadhi taswira ya Kiebrania kwa lugha ya kawaida.
- source_word: וַיְכוֹנְנֶהָ
  choice: na kuuweka tayari
  rationale: Kitenzi kina maana ya kuandaa au kuweka tayari; kiwakilishi cha yambwa kinarejelea upinde.
theological_decisions:
- issue: Mhusika wa viwakilishi vya nafsi ya tatu
  choice: Viwakilishi vimeachwa bila kumtaja mhusika waziwazi, vikilingana na usomaji mkuu kwamba Mungu ndiye hakimu-shujaa anayeandaa silaha za hukumu.
  alternative: Mtu mwovu ndiye anayeandaa silaha zake mwenyewe.
  rationale: Muktadha wa karibu unaelekea kumtaja Mungu kama mhusika, lakini Kiebrania hakimtaji tena kwa jina katika mstari huu. Kutotaja ‘Mungu’ moja kwa moja kunahifadhi utata huo wa kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaosomeka kwa urahisi. Muundo wa kishairi na mfuatano wa picha za silaha umehifadhiwa, huku utata wa mhusika ukiachwa wazi.
