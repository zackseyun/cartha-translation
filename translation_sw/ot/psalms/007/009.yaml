  yaml_path: translation/ot/psalms/007/009.yaml
  text: Please let the evil of the wicked come to an end, but establish the righteous—O righteous God who examines hearts and kidneys.
translation:
  language: sw
  text: 'Naomba uovu wa waovu ukome,

    na umthibitishe mwenye haki—

    Ee Mungu mwenye haki,

    uchunguzaye mioyo na figo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika lugha ya kishairi ya Kiebrania, “mioyo na figo” humaanisha sehemu za ndani kabisa za mtu—mawazo, nia, na hisia zake.
    reason: Neno “figo” lina maana ya kimajazi katika mazingira haya na linaweza lisieleweke mara moja kwa msomaji wa sasa.
lexical_decisions:
- source_word: יִגְמָר נָא
  choice: Tafadhali, ukomeshe
  rationale: Neno יִגְמָר lina maana ya kufikia mwisho au kukomeshwa, na נָא ni ombi la kusisitiza kwa upole. Kiswahili hiki kinawasilisha ombi hilo kwa kawaida.
- source_word: רַע רְשָׁעִים
  choice: uovu wa waovu
  rationale: Huhifadhi uhusiano wa moja kwa moja kati ya 'uovu' na 'waovu' bila kuubadili kuwa maangamizi ya watu waovu.
- source_word: וּתְכוֹנֵן צַדִּיק
  choice: na umthibitishe mwenye haki
  rationale: Kitenzi כּוּן katika umbo hili kina wazo la kuweka imara au kuthibitisha; umoja wa צַדִּיק umehifadhiwa kama 'mwenye haki'.
- source_word: וּבֹחֵן לִבּוֹת וּכְלָיוֹת
  choice: uchunguzaye mioyo na figo
  rationale: Tafsiri hii inahifadhi taswira halisi ya Kiebrania. Katika anthropolojia ya Kiebrania, moyo na figo hurejelea maisha ya ndani, ikiwemo mawazo, nia, na hisia.
- source_word: אֱלֹהִים צַדִּיק
  choice: wewe Mungu mwenye haki
  rationale: Hueleza Mungu kuwa mwenye haki na kuunganisha kishazi hiki kwa kawaida na maelezo yanayofuata.
theological_decisions:
- issue: Kitu kinachoombewa kikomeshwe
  choice: uovu wa waovu
  alternative: waovu wakomeshwe
  rationale: Sarufi ya Kiebrania inataja 'uovu' kuwa kiima cha kufikia mwisho; tafsiri haipaswi kuhamisha ombi hilo moja kwa moja kuwa kuangamizwa kwa waovu.
- issue: Taswira ya 'mioyo na figo'
  choice: mioyo na figo, pamoja na tanbihi
  alternative: mioyo na nia
  rationale: Kuhifadhi 'figo' kunatunza taswira ya asili na upana wa dhana zake za maisha ya ndani, huku tanbihi ikisaidia msomaji wa sasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa heshima. Mpangilio wa mistari unaonyesha ulinganifu wa ushairi wa Kiebrania; 'uchunguzaye' hudumisha hadhi ya kifasihi bila kuwa wa kale kupita kiasi.
