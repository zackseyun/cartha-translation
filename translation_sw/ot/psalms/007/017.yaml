review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the two future/volitional praise actions, the divine name, God's righteousness, and the title 'Most High.' However, 'nitaliimbia sifa jina' does not correctly form the Swahili verbal construction for singing praise to a named recipient.
  naturalness: The first clause is clear and suitably elevated. The second clause is structurally unnatural; recasting it as 'nitaliimbia jina ... sifa' is grammatical, idiomatic in poetic/register-conscious Swahili, and retains the Hebrew's focus on singing to the name.
  terminology: '''Yahwe'' is an established and natural Swahili transliteration of the divine name. ''Uadilifu'' appropriately renders the broad righteousness nuance, while the footnote preserves ''haki'' as a viable justice-oriented alternative. ''Aliye Juu Zaidi'' naturally renders the divine title without adding ''Mungu.'''
  issues:
  - severity: medium
    issue: Ungrammatical/unnatural object construction in the second colon
    rationale: In 'nami nitaliimbia sifa jina la Yahwe,' the object 'sifa' and the recipient phrase 'jina la Yahwe' are ordered and connected in a way that is not natural Standard East African Swahili. 'Nitaliimbia jina la Yahwe, Aliye Juu Zaidi, sifa' supplies the recipient object of -imbia and the thing sung, while preserving the source sense.
  revised_text: Nitamshukuru Yahwe kwa kadiri ya uadilifu wake[a], nami nitaliimbia jina la Yahwe, Aliye Juu Zaidi, sifa.
  revised_footnotes:
  - marker: a
