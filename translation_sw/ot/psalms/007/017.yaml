  text: אוֹדֶ֣ה יְהוָ֣ה כְּ/צִדְק֑/וֹ וַ֝/אֲזַמְּרָ֗ה שֵֽׁם יְהוָ֥ה עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/017.yaml
  text: I will give thanks to Yahweh according to his righteousness[a], and I will sing praise to the name of Yahweh Most High.
translation:
  language: sw
  text: Nitamshukuru Yahwe kwa kadiri ya uadilifu wake[a], nami nitaliimbia jina la Yahwe, Aliye Juu Zaidi, sifa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu ya haki yake” au “kwa kadiri ya haki yake.” Neno la Kiebrania linaweza kumaanisha uadilifu au haki.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדֶה
  choice: Nitamshukuru
  rationale: Katika muktadha wa zaburi, Hifili ya ידה humaanisha kumshukuru au kumsifu Mungu. “Nitamshukuru” ni ya kawaida na inahifadhi wazo la shukrani.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja kama “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: כְּצִדְקוֹ
  choice: kwa kadiri ya uadilifu wake
  rationale: Kihusishi כְּ kinaonyesha kulingana na au kwa kadiri ya; צדק hapa inaweza kuhusisha tabia na matendo yaliyo sawa na ya haki.
- source_word: וַאֲזַמְּרָה
  choice: nami nitaliimbia sifa
  rationale: זמר katika matumizi ya kizaburi ni kuimba sifa, mara nyingi kwa maana ya kimuziki. Muundo huu ni wa asili katika Kiswahili na unalenga jina linalofuata.
- source_word: שֵׁם
  choice: jina
  rationale: “Jina” linahifadhi maana ya moja kwa moja na pia wazo la utambulisho na sifa ya Mungu.
- source_word: עֶלְיוֹן
  choice: Aliye Juu Zaidi
  rationale: Ni cheo cha Mungu kinachoeleza ukuu wake. Tafsiri hii haisemi “Mungu,” neno ambalo halipo wazi katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini inatumia jina binafsi la Mungu, hivyo limetoholewa badala ya kubadilishwa kuwa cheo.
- issue: Maana ya צדק inapomhusu Mungu
  choice: uadilifu
  alternative: haki
  rationale: “Uadilifu” huonyesha kwa upana tabia na matendo ya Mungu yaliyo sawa; “haki” ni maana halali, hasa ikisisitiza hukumu ya haki, na imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo sambamba wa mistari ya zaburi umehifadhiwa, pamoja na tofauti kati ya kushukuru na kuimba sifa.
