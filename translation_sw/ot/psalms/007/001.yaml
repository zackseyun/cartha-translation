  yaml_path: translation/ot/psalms/007/001.yaml
  text: O Yahweh my God[a], in you I have taken refuge; save me from all who pursue me, and deliver me.
translation:
  language: sw
  text: Ee Yahwe, Mungu wangu, kwako nimekimbilia[a]; uniokoe kutoka kwa wote wanaonifukuza, na uninasue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwako ninakimbilia.” Kauli timilifu ya Kiebrania inaweza kutafsiriwa kwa wakati wa sasa katika muktadha wa sala.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano YHWH limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Nomino yenye kiambishi cha nafsi ya kwanza umoja humaanisha kwa kawaida “Mungu wangu”; pamoja na Yahwe ni mwito wa moja kwa moja.
- source_word: בְּךָ חָסִיתִי
  choice: nimekukimbilia
  rationale: Kitenzi חסה hueleza kumkimbilia mtu au mahali ili kupata hifadhi. Kauli timilifu ya Kiswahili inaonyesha tendo lililofanyika lenye maana inayoendelea katika sala hii.
- source_word: הוֹשִׁיעֵנִי
  choice: uniokoe
  rationale: Amri ya Hiphil ya ישׁע ni ombi la kuokolewa; “uniokoe” ni ya kawaida na inafaa lugha ya sala.
- source_word: מִכָּל רֹדְפַי
  choice: kutoka kwa wote wanaonifuatilia
  rationale: Kirai hiki kinaonyesha kuokolewa kutoka kwa watu wote wanaomfuatia mwombaji kwa uadui, huku kitenzi cha kuendelea kikihifadhiwa.
- source_word: וְהַצִּילֵנִי
  choice: na unikomboe
  rationale: Hiphil ya נצל ina maana ya kumwondoa au kumwokoa mtu katika hatari. “Unikomboe” hapa hutofautisha kwa kiasi ombi hili na “uniokoe” lililotangulia.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina YHWH moja kwa moja. “Yahwe” hulihifadhi kama jina maalumu kwa tahajia inayosomeka kiasili katika Kiswahili.
- issue: Wakati wa חָסִיתִי katika muktadha wa sala
  choice: nimekukimbilia
  alternative: ninakukimbilia
  rationale: Kauli timilifu ya Kiebrania inaweza kueleza tendo lililokamilika lenye matokeo ya sasa, lakini katika sala inaweza pia kueleweka kwa maana ya sasa. Tafsiri kuu inahifadhi umbo timilifu, na tanbihi inaonyesha uwezekano wa maana ya sasa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa urahisi. “Ee” huonyesha mwito wa moja kwa moja; miundo ya vitenzi ni ya sasa na ya kawaida bila lugha ya kidhehebu.
