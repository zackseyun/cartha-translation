  text: A Shiggaion of David[a], which he sang to Yahweh concerning the words of Cush, a Benjaminite.
translation:
  language: sw
  text: Shiggaion[a] ya Daudi, ambayo Daudi alimwimbia Yahweh kuhusu maneno ya Kushi, Mbenyamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania “Shiggaion” ni nadra, na maana yake kamili haijulikani. Huenda ni istilahi maalumu ya muziki au ushairi, kama vile “ombolezo” au “wimbo wenye msisimko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁגָּיוֹן
  choice: Shiggaion
  rationale: Neno hili ni nadra na maana yake kamili haijulikani. Kulitohoa kunahifadhi uwezekano kwamba ni istilahi ya muziki au ushairi bila kulipa maana isiyo na uhakika; maelezo yametolewa katika tanbihi.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Katika vichwa vya zaburi, ל inaweza kuonyesha uandishi, uhusiano, umiliki, au wakfu. “Ya Daudi” ni fupi na haifungi maana katika uandishi pekee.
- source_word: אֲשֶׁר שָׁר
  choice: ambayo alimwimbia
  rationale: Hii inawakilisha kishazi cha uhusiano na kitenzi cha wakati uliopita, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetoholewa kuwa “Yahweh,” kwa kuzingatia kwamba kihusishi ל kimewakilishwa ndani ya kitenzi “alimwimbia.”
- source_word: עַל
  choice: kuhusu
  rationale: Neno hili linaweza kuonyesha mada au tukio lililosababisha wimbo. “Kuhusu” huhifadhi maana ya mada bila kulazimisha uhusiano wa kisababishi.
- source_word: דִּבְרֵי
  choice: maneno ya
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya wingi katika hali ya muunganiko. Maana mahususi zaidi kama “mashtaka” haikulazimishwi na maandishi.
- source_word: כּוּשׁ
  choice: Kushi
  rationale: Hili ni jina la mtu; umbo “Kushi” linafuata utohoaji wa kawaida wa majina ya Kiebrania katika Kiswahili.
- source_word: בֶּן יְמִינִי
  choice: Mbenyamini
  rationale: Kirai hiki ni namna ya kumtambulisha mtu wa kabila la Benyamini. “Mbenyamini” huwasilisha maana hiyo kwa ufupi na kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yanatumia jina la Mungu יהוה moja kwa moja. “Yahweh” huhifadhi jina hilo la agano badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa Daudi na zaburi katika לְדָוִד
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi
  rationale: Kihusishi cha Kiebrania kinaweza kuonyesha uandishi, uhusiano, umiliki, au wakfu. Tafsiri “ya Daudi” huhifadhi uwazi huo bila kuamua zaidi ya maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi inayofaa kichwa cha zaburi lakini kinachoeleweka kwa wasomaji wa kawaida. Istilahi adimu “Shiggaion” imehifadhiwa kwa utohoaji na kufafanuliwa katika tanbihi.
