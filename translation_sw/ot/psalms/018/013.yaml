base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/013.yaml
  text: Yahweh thundered in the heavens[b][a], and the Most High gave his voice—hailstones and coals of fire.
translation:
  language: sw
  text: Yahwe akapiga radi mbinguni, naye Aliye Juu Sana akatoa sauti yake[a]—mvua ya mawe[b] na makaa ya moto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alitamka sauti yake.” Usemi wa Kiebrania kwa neno halisi ni “akatoa sauti yake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mawe ya barafu.” Nomino ya Kiebrania inaweza kutumiwa kwa maana ya kijumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְעֵם
  choice: akapiga radi
  rationale: Kitenzi רעם katika muktadha huu wa dhoruba kinamaanisha kutoa au kusababisha ngurumo. ‘Akapiga radi’ ni usemi wa kawaida wa Kiswahili unaohifadhi picha ya radi na ulinganifu wake na sauti ya Mungu.
- source_word: בַּשָּׁמַיִם
  choice: mbinguni
  rationale: ‘Mbinguni’ ni tafsiri ya kawaida na yenye hadhi ya kishairi ya שׁמים katika muktadha huu, bila kuifanya kuwa ‘angani’ tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kama jina binafsi ‘Yahwe,’ badala ya kubadilishwa na cheo kama ‘BWANA.’
- source_word: וְעֶלְיוֹן
  choice: Aliye Juu Zaidi
  rationale: Hiki ni cheo cha Mungu kinachoeleweka kwa urahisi na kinachowakilisha maana ya עֶלְיוֹן bila kupunguza hadhi yake.
- source_word: יִתֵּן קֹלוֹ
  choice: akatoa sauti yake
  rationale: Tafsiri hii inadumisha tamathali ya Kiebrania, ambayo kwa neno moja moja ni ‘alitoa sauti yake,’ huku tanbihi ikieleza maana mbadala ya kimuktadha.
- source_word: בָּרָד
  choice: mvua ya mawe
  rationale: Nomino ya Kiebrania iko katika umoja wa kijumla. ‘Mvua ya mawe’ ni usemi wa kawaida wa Kiswahili kwa tukio hili la dhoruba.
- source_word: וְגַחֲלֵי אֵשׁ
  choice: na makaa ya moto
  rationale: Tafsiri ya karibu inadumisha picha kali ya kishairi bila kuamua kimyakimya kwamba ni umeme, vimondo, au ishara nyingine.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova au BWANA
  rationale: Andiko linatumia moja kwa moja jina יהוה; kulitafsiri ‘Yahwe’ kunalihifadhi kama jina binafsi badala ya kulibadilisha na cheo.
- issue: Uhusiano wa ‘mvua ya mawe na makaa ya moto’ na kishazi kilichotangulia
  choice: Kuyaacha kama mwendelezo wa kishairi baada ya kistari kirefu
  alternative: Kuongeza kitenzi kama ‘akatuma’ au ‘kukawa na’
  rationale: Kiebrania hakina kitenzi wazi kwa vipengele hivi vya dhoruba. Kistari kirefu kinahifadhi mfuatano wa ghafla na utata wa kishairi bila kuongeza tendo lisilotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi wenye hadhi lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa ghafla wa mwisho umehifadhiwa kwa kistari kirefu, na kila tanbihi imewekewa alama mahali panapohusika katika matini.
