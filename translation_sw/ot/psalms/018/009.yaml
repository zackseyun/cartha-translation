  text: וַ/יֵּ֣ט שָׁ֭מַיִם וַ/יֵּרַ֑ד וַ֝/עֲרָפֶ֗ל תַּ֣חַת רַגְלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/009.yaml
  text: He bent the heavens and came down[a]; thick darkness was under his feet.
translation:
  language: sw
  text: 'Aliziinamisha mbingu, akashuka;

    giza nene[a] lilikuwa chini ya miguu yake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wingu jeusi” au “giza zito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: aliziinamisha
  rationale: Kitenzi נטה hapa kinaonyesha Mungu akizipinda au kuzishusha mbingu kuelekea chini. “Aliziinamisha” ni Kiswahili cha kawaida kinachohifadhi taswira hai ya kishairi.
- source_word: שָׁמַיִם
  choice: mbingu
  rationale: “Mbingu” ni neno la kawaida la Kiswahili kwa wingi wa Kiebrania na linadumisha upeo wa ulimwengu pamoja na hadhi ya kishairi.
- source_word: וַיֵּרַד
  choice: akashuka
  rationale: “Akashuka” linaonyesha kwa njia ya kawaida na ya moja kwa moja mwendo kutoka juu kwenda chini, huku mfululizo wa matendo ukihifadhiwa kwa kiunganishi cha usimulizi.
- source_word: וַעֲרָפֶל
  choice: giza nene
  rationale: עֲרָפֶל linaweza kumaanisha giza zito, utusitusi mzito, au wingu jeusi katika mazingira ya kujidhihirisha kwa Mungu. “Giza nene” linahifadhi uzito wa taswira bila kulifanya kwa lazima kuwa wingu.
- source_word: תַּחַת
  choice: chini ya
  rationale: Hili ndilo neno la kawaida na wazi la Kiswahili kwa uhusiano wa mahali unaoonyeshwa hapa.
- source_word: רַגְלָיו
  choice: miguu yake
  rationale: Tafsiri hii inafuata maana halisi ya wingi wa Kiebrania na kuhifadhi taswira ya Mungu iliyo kama ya kibinadamu.
theological_decisions:
- issue: Taswira ya Mungu yenye sifa za kibinadamu katika kujidhihirisha kwake
  choice: Kuhifadhi taswira halisi ya Mungu akiziinamisha mbingu, akishuka, na giza likiwa chini ya miguu yake.
  alternative: Kufafanua kwa jumla kwamba Mungu aliingilia kati kutoka mbinguni.
  rationale: Aya ni ya kishairi na hutumia taswira yenye sifa za kibinadamu. Tafsiri haipaswi kuipunguza kuwa maelezo yasiyo na taswira wala kuamua kimya-kimya jinsi taswira hiyo inavyopaswa kufasiriwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa mistari na nusu koloni unadumisha uwiano wa kishairi. Alama [a] imewekwa baada ya “giza nene,” neno linalohusika moja kwa moja na maelezo ya chini.
