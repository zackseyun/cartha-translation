  yaml_path: translation/ot/psalms/018/041.yaml
  text: They cried for help, but there was no savior; to the LORD, but he did not answer them.
translation:
  language: sw
  text: Walilia wapate msaada, lakini hapakuwa na mwokozi; walimlilia BWANA, lakini hakuwajibu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְשַׁוְּעוּ
  choice: Walilia wapate msaada
  rationale: Kitenzi hiki kinaonyesha kilio cha kuomba msaada; tafsiri hii ni ya kawaida katika Kiswahili na haihitaji kutaja mlengwa ambaye maandishi ya Kiebrania hayamtaji katika kishazi cha kwanza.
- source_word: מוֹשִׁיעַ
  choice: mwokozi
  rationale: Nomino ya Kiebrania humaanisha anayeokoa; “mwokozi” huhifadhi muundo wa nomino na mwangwi wake wa kitheolojia.
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea ya Biblia za Kiswahili ya kuwakilisha jina la agano YHWH kwa herufi kubwa.
- source_word: עָנָם
  choice: hakuwajibu
  rationale: Huwakilisha moja kwa moja kitenzi ‘kujibu’ pamoja na kiambishi cha nafsi ya tatu wingi kama yambwa.
theological_decisions:
- issue: Iwapo מוֹשִׁיעַ itafsiriwe kama mtu yeyote wa kuwaokoa au kama ‘mwokozi’
  choice: mwokozi
  alternative: mtu wa kuwaokoa
  rationale: “Mwokozi” huhifadhi nomino ya chanzo na uwezekano wa mwangwi wa kitheolojia bila kudai wazi kwamba neno hilo ni jina maalumu.
- issue: Uwakilishaji wa jina יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: “BWANA” ni desturi inayotambulika sana katika Kiswahili; herufi kubwa hutofautisha jina hili na cheo cha kawaida, ingawa matamshi ya jina lenyewe hayajaonyeshwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya ‘walilia’ yanaweka wazi mfuatano wa kishazi cha Kiebrania kwa njia ya kawaida katika Kiswahili.
