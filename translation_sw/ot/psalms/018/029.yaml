  text: For by you I can run against a troop[b][a], and by my God I can leap over a wall.
translation:
  language: sw
  text: Kwa maana, kwa msaada wako ninaweza kukimbia nikikabiliana na kikosi[a], na kwa msaada wa Mungu wangu ninaweza kuruka juu ya ukuta[b].
  philosophy: optimal-equivalence
