lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu au msingi wa ushuhuda wa sifa katika muktadha.
- source_word: בְךָ
  choice: kwa msaada wako
  rationale: Herufi ב inaonyesha njia au uwezeshaji; Kiswahili hiki ni cha kawaida na kinaeleza kwamba Mungu ndiye anayemwezesha msemaji.
- source_word: אָרֻץ
  choice: ninaweza kulishambulia
  rationale: Kitenzi רוץ kimsingi ni ‘kukimbia’; katika muktadha wa kijeshi kinaonyesha kukimbia kuelekea adui ili kumshambulia. ‘Ninaweza’ huonyesha uwezo unaotokana na msaada wa Mungu.
- source_word: גְּדוּד
  choice: kundi la askari
  rationale: גדוד linaweza kumaanisha kikosi, kundi la wapiganaji, au kundi la wavamizi; uchaguzi huu ni wazi na haukuzidishi ukubwa kuwa jeshi zima.
- source_word: וּבֵאלֹהַי
  choice: na kwa msaada wa Mungu wangu
  rationale: Unadumisha ulinganifu na kishazi cha kwanza pamoja na ungamo la kibinafsi ‘Mungu wangu.’
- source_word: אֲדַלֶּג
  choice: ninaweza kuruka juu ya
  rationale: דלג humaanisha kuruka au kuvuka kwa kuruka; usemi huu unahifadhi picha hai ya kushinda kizuizi.
- source_word: שׁוּר
  choice: ukuta
  rationale: שׁוּר humaanisha ukuta, hasa kinga ya kijeshi; ‘ukuta’ ni neno la kawaida, huku ‘boma la ulinzi’ likibaki uwezekano wa kimuktadha.
theological_decisions:
- issue: Hali ya picha za kijeshi katika mstari
  choice: Kuhifadhi picha halisi ya kushambulia kundi la askari na kuruka juu ya ukuta kama ushuhuda wa kuwezeshwa na Mungu.
  alternative: Kuifanya kuwa kauli ya jumla kuhusu kushinda matatizo ya maisha.
  rationale: Kiebrania kinatumia maneno dhahiri ya kijeshi; tafsiri haipaswi kuigeuza kimya kimya kuwa sitiari ya jumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kwa msaada wako’ ni cha asili zaidi kuliko ‘kwa wewe’ na kinahifadhi maana ya uwezeshaji. Picha za kijeshi zimeachwa wazi bila kuzifanya mafundisho ya kimadhehebu.
