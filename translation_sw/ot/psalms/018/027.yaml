  text: כִּֽי אַ֭תָּה עַם עָנִ֣י תוֹשִׁ֑יעַ וְ/עֵינַ֖יִם רָמ֣וֹת תַּשְׁפִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/027.yaml
  text: For you save an afflicted people[b][a], but haughty eyes you bring low.
translation:
  language: sw
  text: Kwa maana wewe huwaokoa watu wanaoteseka[a], lakini macho yenye kiburi[b] unayashusha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu maskini” au “watu wanyenyekevu.” Neno la Kiebrania linaweza kumaanisha umaskini, mateso, au hali ya unyenyekevu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “macho yaliyo juu”—nahau ya Kiebrania inayoonyesha kiburi au majivuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huanzisha sababu au maelezo ya kauli iliyotangulia na kutunza mtiririko wa kishairi.
- source_word: אַתָּה
  choice: wewe
  rationale: Kiwakilishi hiki cha nafsi ya pili kinamrejelea Mungu; kutajwa kwake wazi kunabeba mkazo wa Kiebrania.
- source_word: עַם עָנִי
  choice: watu wanaoteseka
  rationale: עָנִי inaweza kumaanisha walio maskini, wanaoteseka, au walio wanyenyekevu. Chaguo hili linaonyesha hali ya taabu inayohitaji wokovu bila kuifunga maana katika umaskini wa kiuchumi pekee.
- source_word: תוֹשִׁיעַ
  choice: huwaokoa
  rationale: Kitenzi ישׁע katika Hiphil humaanisha kuokoa au kukomboa. Umbo la mazoea linafaa kwa kauli ya sifa kuhusu namna Mungu hutenda, huku maana ya jumla ya uokoaji ikihifadhiwa.
- source_word: וְעֵינַיִם רָמוֹת
  choice: lakini macho yenye kiburi
  rationale: Ingawa וְ kwa kawaida ni ‘na,’ ulinganifu hapa unaonyesha utofauti, hivyo ‘lakini’ ni ya asili. Taswira halisi ya ‘macho yaliyo juu’ imehifadhiwa kwa msemo unaoeleweka wa kiburi.
- source_word: תַּשְׁפִּיל
  choice: unayashusha
  rationale: Hiphil ya שׁפל ina maana ya kufanya kuwa chini au kunyenyekeza. ‘Unayashusha’ huhifadhi taswira ya juu na chini na kupatana kisarufi na ‘macho.’
theological_decisions:
- issue: Maana ya עָנִי katika mstari huu
  choice: watu wanaoteseka
  alternative: watu maskini; watu wanyenyekevu
  rationale: Neno lina upana unaoweza kujumuisha umaskini, mateso, na unyenyekevu. Tafsiri hii inatanguliza muktadha wa Mungu kuwaokoa walio taabuni bila kukataa maana nyingine zinazowezekana.
- issue: Taswira ya עֵינַיִם רָמוֹת
  choice: macho yenye kiburi
  alternative: macho yaliyo juu; watu wenye kiburi
  rationale: Kutaja ‘macho’ kunahifadhi nahau na ushairi wa Kiebrania, huku ‘yenye kiburi’ kukifanya kiini cha kimaadili kieleweke bila kubadili taswira kuwa rejeo la moja kwa moja kwa watu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Huwaokoa’ na ‘unayashusha’ zinaonyesha tabia ya Mungu inayotajwa katika zaburi; ulinganifu kati ya wanaoteseka na macho yenye kiburi umehifadhiwa.
