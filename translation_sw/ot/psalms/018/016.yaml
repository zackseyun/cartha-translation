lexical_decisions:
- source_word: יִשְׁלַח
  choice: Alituma
  rationale: Huhifadhi maana ya msingi ya kitenzi ‘kutuma/kunyoosha’ bila kuongeza yule au kitu kilichotumwa, ambacho Kiebrania hakitaji wazi.
- source_word: מִמָּרוֹם
  choice: kutoka juu
  rationale: Huhifadhi taswira ya mahali pa juu bila kufafanua moja kwa moja kuwa ni mbinguni.
- source_word: יִקָּחֵנִי
  choice: akanishika
  rationale: Katika muktadha wa kuokolewa majini, ‘kunishika’ huwasilisha tendo la kumkamata mwombaji kwa lengo la kumwokoa, huku likibaki karibu na maana ya ‘kuchukua.’
- source_word: יַמְשֵׁנִי
  choice: akanivuta
  rationale: Hiphil ya משה humaanisha kumtoa mtu majini kwa kumvuta; Kiswahili hiki ni cha kawaida na kinaeleweka wazi.
- source_word: מִמַּיִם רַבִּים
  choice: kutoka katika maji mengi
  rationale: Ni tafsiri ya karibu ya maneno ya Kiebrania na huhifadhi taswira ya maji mengi yanayowakilisha hatari kubwa.
theological_decisions:
- issue: Kama taswira ya wokovu ifafanuliwe wazi kuwa ya kutoka mbinguni
  choice: kutoka juu
  alternative: kutoka mbinguni
  rationale: Kiebrania kinataja ‘juu/mahali pa juu,’ si ‘mbinguni’ moja kwa moja; tafsiri inaacha upeo huo wa maana bila kuubana.
