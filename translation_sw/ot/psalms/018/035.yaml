  text: וַ/תִּתֶּן לִ/י֮ מָגֵ֪ן יִ֫שְׁעֶ֥/ךָ וִֽ/ימִינְ/ךָ֥ תִסְעָדֵ֑/נִי וְֽ/עַנְוַתְ/ךָ֥ תַרְבֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/035.yaml
  text: You gave me the shield of your salvation[a], and your right hand supported me, and your humility made me great.
translation:
  language: sw
  text: Ulinipa ngao ya wokovu wako; mkono wako wa kuume ulinitegemeza, na unyenyekevu wako[a] ulinifanya kuwa mkuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upole wako.” Neno la Kiebrania linaweza kumaanisha unyenyekevu, upole, au hali ya kujishusha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: Ulinipa
  rationale: Qal wayyiqtol ya נתן inaeleza tendo la wakati uliopita; “ulinipa” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: מָגֵן יִשְׁעֶךָ
  choice: ngao ya wokovu wako
  rationale: Muundo wa kutegemeana umehifadhiwa kwa karibu; “wokovu” hubeba maana pana kuliko kuokolewa katika hatari moja tu.
- source_word: וִימִינְךָ
  choice: mkono wako wa kuume
  rationale: Taswira halisi ya mkono wa kuume kama ishara ya nguvu na msaada imehifadhiwa.
- source_word: תִסְעָדֵנִי
  choice: ulinitegemeza
  rationale: Kitenzi סעד humaanisha kutegemeza au kudumisha; “ulinitegemeza” ni wazi na kinafaa katika muktadha wa msaada wa Mungu.
- source_word: וְעַנְוַתְךָ
  choice: unyenyekevu wako
  rationale: Neno linaweza kumaanisha unyenyekevu, upole, au hali ya kujishusha. “Unyenyekevu” huhifadhi nguvu ya kushangaza ya sifa hii kutumiwa kumhusu Mungu.
- source_word: תַרְבֵּנִי
  choice: ulinifanya kuwa mkuu
  rationale: Hiphil ya רבה ina maana ya kufanya kuwa mkuu au kuzidisha; tafsiri hii ni ya asili na huhifadhi maana ya kuinuliwa kwa mtunga zaburi.
theological_decisions:
- issue: Kutafsiri וְעַנְוַתְךָ kama sifa ya Mungu
  choice: unyenyekevu wako
  alternative: upole wako
  rationale: Kiebrania kinaruhusu maana za unyenyekevu, upole, au kujishusha. Matini kuu inahifadhi mvutano wa kiteolojia wa Mungu kujishusha ili kumsaidia mtunga zaburi, huku maana mbadala ya “upole” ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mpangilio wa kishairi na taswira za Kiebrania zimehifadhiwa bila kutumia lugha ya kizamani.
