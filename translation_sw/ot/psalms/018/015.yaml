  text: וַ/יֵּ֤רָא֨וּ אֲפִ֥יקֵי מַ֗יִם וַֽ/יִּגָּלוּ֮ מוֹסְד֪וֹת תֵּ֫בֵ֥ל מִ/גַּעֲרָ֣תְ/ךָ֣ יְהוָ֑ה מִ֝/נִּשְׁמַ֗ת ר֣וּחַ אַפֶּֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/015.yaml
  text: Then the channels of the waters were seen[a], and the foundations of the world were laid bare, at your rebuke, O Yahweh[c][b], at the blast of the breath of your nostrils.
translation:
  language: sw
  text: 'Ndipo mikondo ya maji[a] ikaonekana,

    na misingi ya ulimwengu[b] ikafunuliwa,

    kwa ukemeo wako, ee Yahwe,

    kwa mvumo wa pumzi ya pua yako.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “njia za maji” au “vitanda vya mito.”
    reason: lexical_alternative
  - marker: b
    text: Au, “misingi ya dunia.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kihalisi kina wazo la “pumzi ya upepo/roho ya pua yako”; hii ni taswira ya kishairi inayoonyesha nguvu ya pumzi ya Yahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָאוּ
  choice: ikaonekana
  rationale: Kauli ya kutendwa ya kitenzi ראה inaonyesha kwamba mikondo ilionekana au ikawa dhahiri; “ikaonekana” huhifadhi nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: אֲפִיקֵי מַיִם
  choice: mikondo ya maji
  rationale: אֲפִיקִים inaweza kumaanisha mikondo, njia za maji, au vitanda vya mito. “Mikondo ya maji” ni ya kishairi, inaeleweka, na inabaki karibu na wingi wa Kiebrania.
- source_word: וַיִּגָּלוּ
  choice: ikawekwa wazi
  rationale: Kauli ya kutendwa ya גלה hapa huonyesha kufunuliwa kabisa. “Ikawekwa wazi” inadumisha taswira ya misingi iliyokuwa imefichwa kufichuliwa kwa nguvu.
- source_word: מוֹסְדוֹת תֵּבֵל
  choice: misingi ya ulimwengu
  rationale: מוֹסְדוֹת ni misingi, na תֵּבֵל huashiria ulimwengu au dunia iliyo na utaratibu. “Ulimwengu” ni tafsiri pana na ya asili katika muktadha huu wa kishairi.
- source_word: מִגַּעֲרָתְךָ
  choice: kwa ukemeo wako
  rationale: מִן hapa huonyesha sababu au chanzo. “Kwa ukemeo wako” huwasilisha kwamba kufunuliwa huko kulitokana na amri kali ya Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu, יהוה, limetafsiriwa kwa unukuzi wa Kiswahili “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: מִנִּשְׁמַת רוּחַ אַפֶּךָ
  choice: kwa mvumo wa pumzi ya puani mwako
  rationale: Kirai kinaunganisha נְשָׁמָה (pumzi), רוּחַ (upepo/roho/pumzi), na אַף (pua, na pia kwa maana pana hasira). “Mvumo wa pumzi ya puani mwako” huhifadhi nguvu na taswira ya kibinadamu ya kishairi bila kuifupisha kuwa “hasira” tu.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia Tetragramatoni moja kwa moja. “Yahwe” huhifadhi jina binafsi la Mungu badala ya kulibadilisha kuwa cheo, huku “ee” ikionyesha kwamba hapa mtunga-zaburi anamwambia Mungu moja kwa moja.
- issue: Taswira ya pumzi kutoka puani mwa Mungu
  choice: kwa mvumo wa pumzi ya puani mwako
  alternative: kwa hasira yako kali
  rationale: Kiebrania kinatumia taswira halisi ya kishairi ya pumzi/upepo na pua. Tafsiri haipaswi kuondoa taswira hiyo kwa kuigeuza moja kwa moja kuwa dhana ya hasira, ingawa אַף inaweza pia kuhusishwa na hasira.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Mistari minne inahifadhi uwiano wa kishairi wa matendo mawili ya kufunuliwa na sababu zake mbili. “Ee Yahwe” ni mwito wa moja kwa moja na wa heshima.
