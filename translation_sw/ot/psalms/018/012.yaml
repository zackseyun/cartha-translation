  yaml_path: translation/ot/psalms/018/012.yaml
  text: From the brightness before him his clouds passed on—hail and coals of fire[a].
translation:
  language: sw
  text: Kutoka kwa mwangaza ulio mbele yake, mawingu yake yalipita—mvua ya mawe na makaa ya moto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mawingu yake mazito yalipita; mvua ya mawe na makaa ya moto.” Kiebrania ni kifupi na cha kishairi, hivyo taswira hii ya dhoruba inaweza kuwasilishwa kwa namna zinazotofautiana kidogo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֹּגַהּ
  choice: Kutoka katika mwangaza
  rationale: נֹגַהּ humaanisha mwangaza au mng’ao; kiambishi מִן kinaonyesha chanzo. ‘Mwangaza’ ni neno la kawaida na linalofaa katika taswira hii ya dhoruba.
- source_word: נֶגְדּוֹ
  choice: uliokuwa mbele zake
  rationale: נֶגֶד pamoja na kiambishi cha nafsi ya tatu humaanisha ‘mbele yake.’ Muundo huu wa Kiswahili unaunganisha kwa kawaida mwangaza na mahali pake bila kuufasiri kupita kiasi kuwa ‘uwepo.’
- source_word: עָבָיו
  choice: mawingu yake mazito
  rationale: עָב hurejelea wingu zito au tungamo la mawingu. ‘Mawingu yake mazito’ huhifadhi kiambishi cha umilikaji na uzito wa taswira ya Kiebrania.
- source_word: עָבְרוּ
  choice: yalipita
  rationale: Kitenzi עבר katika Qal wingi kina maana ya kupita au kwenda mbele. ‘Yalipita’ ni cha kawaida na kinakubaliana na ‘mawingu.’
- source_word: בָּרָד
  choice: mvua ya mawe
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa hali hii ya anga.
- source_word: וְגַחֲלֵי אֵשׁ
  choice: na makaa ya moto
  rationale: Kirai cha muundo tegemezi kina maana halisi ya ‘makaa ya moto’; tafsiri hii huhifadhi taswira hai na mpangilio wa Kiebrania.
theological_decisions:
- issue: Taswira ya kishairi ya Mungu kujidhihirisha katika dhoruba
  choice: Kuhifadhi taswira kama maelezo ya kujidhihirisha kwa Mungu bila kuifanya kuwa sitiari tupu wala kuipanua kuwa dai la kimafundisho.
  alternative: Kuichukulia kama lugha ya mfano tu kuhusu ushindi wa kijeshi, au kuifafanua wazi kuwa muujiza halisi wa hali ya anga.
  rationale: Mstari ni wa kishairi na unaonyesha kutokea kwa BWANA kwa taswira ya dhoruba. Tafsiri inapaswa kuhifadhi mvutano na uhai wa Kiebrania bila kuamua kama kila kipengele ni halisi kabisa au cha mfano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo umebaki mfupi na wa kishairi; ‘mawingu mazito’ huonyesha maana ya עָב kwa uwazi, huku alama ya mkato mrefu ikihifadhi mkusanyiko wa ghafla wa taswira za dhoruba.
