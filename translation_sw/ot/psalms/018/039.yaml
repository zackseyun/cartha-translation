  language: sw
  text: Ulinipa nguvu kwa ajili ya vita; uliwapigisha magoti chini yangu wale walioniinukia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi na taswira ya Kiebrania: “Ulinifunga nguvu kiunoni kwa ajili ya vita; uliwafanya wale walioniinukia wapige magoti chini yangu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּאַזְּרֵנִי
  choice: Ulinipa
  rationale: Kitenzi אזר kwa msingi humaanisha kufunga mkanda au kujifunga tayari, na hapa kinatumika kwa maana ya kumwandaa au kumjalia mtu nguvu. “Ulinipa nguvu” ni Kiswahili cha kawaida na wazi, huku taswira halisi ikihifadhiwa katika tanbihi.
- source_word: חַיִל
  choice: nguvu
  rationale: Katika muktadha huu neno hilo linamaanisha uwezo au nguvu za kivita, si jeshi wala hasa ushujaa wa kimaadili.
- source_word: לַמִּלְחָמָה
  choice: kwa ajili ya vita
  rationale: Huwasilisha kusudi la nguvu hizo kwa Kiswahili cha kawaida; “vita” linafaa kwa mapambano ya kijeshi yanayozungumziwa.
- source_word: תַּכְרִיעַ
  choice: uliwapigisha magoti
  rationale: Hifili ya כרע humaanisha kusababisha kuinama, kupiga magoti, au kuanguka. “Uliwapigisha magoti” inadumisha taswira ya kimwili ya maadui kushindwa na kutiishwa.
- source_word: קָמַי
  choice: wale walioniinukia
  rationale: Huhifadhi taswira ya kitenzi קום, yaani watu wanaoinuka kwa uhasama dhidi ya msemaji, badala ya kuifupisha kuwa “adui zangu.”
- source_word: תַּחְתָּי
  choice: chini yangu
  rationale: Ni taswira ya mahali inayoonyesha kutiishwa na kushindwa chini ya mamlaka ya msemaji.
