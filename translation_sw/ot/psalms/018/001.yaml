base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/001.yaml
  text: And he said[a], “I love you, O Yahweh, my strength.”
translation:
  language: sw
  text: Naye akasema, “Nakupenda[a], Ee Yahweh, nguvu zangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania pia kinaweza kueleweka, “Nina huruma nyororo kwako” au “Ninakuthamini sana”; kitenzi kina wazo la huruma na mapenzi ya ndani, ambalo hapa limeelezwa kwa kawaida kuwa upendo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Naye akasema
  rationale: Waw pamoja na kitenzi ‘akasema’ linaendeleza simulizi kutoka kichwa kirefu cha zaburi katika maandishi ya Kiebrania. ‘Naye akasema’ huhifadhi kiunganishi na utangulizi wa usemi bila kulazimisha maana ya wakati kama ‘kisha’.
- source_word: אֶרְחָמְךָ
  choice: Nakupenda
  rationale: Kitenzi רחם kwa kawaida huhusisha huruma au upendo mwororo. Kinapoelekezwa kwa Yahweh hapa, ‘Nakupenda’ ni Kiswahili cha kawaida kinachoonyesha upendo wa ndani bila kudokeza kwamba mtunga zaburi anamwonea Mungu huruma; kidokezo cha huruma nyororo kinahifadhiwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo, hivyo jina binafsi katika chanzo linahifadhiwa.
- source_word: חִזְקִי
  choice: nguvu zangu
  rationale: Nomino yenye kiambishi cha nafsi ya kwanza ina maana ya ‘nguvu zangu.’ Huu ni usemi wa asili wa Kiswahili unaomtaja Yahweh kuwa nguvu za mtunga zaburi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni, kwa hiyo jina linahifadhiwa kama ‘Yahweh’ badala ya kuweka cheo mahali pake.
- issue: Maana ya רחם inapoelekezwa kwa Mungu
  choice: Nakupenda
  alternative: Ninakuhurumia; ninakuthamini sana
  rationale: Ingawa mzizi huu hubeba maana ya huruma nyororo, katika usemi wa moja kwa moja kwa Mungu unaonyesha mapenzi ya ndani, si kumwonea Mungu huruma. Tafsiri kuu ni ya kawaida, huku wigo wa kimsamiati ukionyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ee’ limetumiwa kama kiashiria cha mwito wa moja kwa moja; sentensi imehifadhi ‘akasema’ kwa kuwa imo katika matini ya WLC iliyotolewa.
