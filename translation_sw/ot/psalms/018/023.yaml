  text: I was blameless before him[c][b][a], and I kept myself from my iniquity.
translation:
  language: sw
  text: Nalikuwa mkamilifu kwake[a], nikajilinda na uovu wangu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mnyofu” au “asiye na lawama.” Hapa neno “mkamilifu” linaonyesha uadilifu wa mwenendo, si lazima kutokuwa na dhambi kabisa. Kiwakilishi “kwake” kinamrejelea BWANA katika muktadha.
    reason: lexical_alternative_and_cross_reference
  - marker: b
    text: Au “hatia yangu” au “dhambi yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: Nilikuwa
  rationale: Kauli ya Qal wayyiqtol nafsi ya kwanza umoja inaeleza hali katika mfululizo wa simulizi; “Nilikuwa” ni ya kawaida na haiongezi wazo la kubadilika kuwa kitu kingine.
- source_word: תָמִים
  choice: mkamilifu
  rationale: Katika muktadha huu neno linaonyesha ukamilifu wa mwenendo au uadilifu mbele za Mungu, si lazima kutokuwa na dhambi kabisa. “Mkamilifu” huhifadhi uzito wa dai la Kiebrania, huku tanbihi ikifafanua upeo wake.
- source_word: עִמּוֹ
  choice: mbele zake
  rationale: Ingawa עִם kimsingi ni “pamoja na,” katika dai hili la uadilifu uhusiano unaolengwa unaelezwa kwa Kiswahili cha kawaida zaidi kama “mbele zake.” Kiwakilishi kinahifadhiwa; kinamrejelea BWANA katika muktadha.
- source_word: וָאֶשְׁתַּמֵּר
  choice: nami nilijilinda
  rationale: Umbo la Hitpael lina maana ya kujichunga au kujilinda; “nilijilinda” huhifadhi maana hiyo ya kujitazama kwa uangalifu.
- source_word: מֵעֲוֺנִי
  choice: na uovu wangu
  rationale: עָוֹן inaweza kumaanisha uovu, hatia, au dhambi. “Uovu wangu” huhifadhi umilikaji wa nafsi ya kwanza na uzito wa kimaadili; “na” baada ya kitenzi kujilinda ni muundo wa kawaida wa Kiswahili unaowakilisha מן ya kujitenga.
theological_decisions:
- issue: Maana ya תָמִים kuhusu hali ya maadili ya mwanadamu
  choice: “Mkamilifu” hapa ni mtu mwenye uadilifu au mwenendo usiolaumiwa mbele za Mungu, si lazima dai la kutokuwa na dhambi kabisa.
  alternative: Dai la ukamilifu usio na dhambi yoyote.
  rationale: Zaburi inatoa dai lenye nguvu kuhusu uadilifu wa mtunga zaburi na msingi wa kutetewa kwake. Tafsiri huhifadhi dai hilo bila kuingiza fundisho kwamba alikuwa hana dhambi kabisa.
- issue: Kirejeleo cha kiwakilishi katika עִמּוֹ
  choice: Kuhifadhi kiwakilishi “zake,” huku tanbihi ikitaja kuwa kinamrejelea BWANA.
  alternative: Kuweka “mbele za BWANA” moja kwa moja katika matini.
  rationale: Kiebrania kina kiwakilishi, kwa hiyo matini hailibadili kuwa jina la Mungu; muktadha hutambulisha kirejeleo chake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Mbele zake” ni asilia zaidi katika dai la uadilifu kuliko tafsiri ya moja kwa moja “pamoja naye”; “nilijilinda na” ni muundo wa sasa na wa kawaida.
