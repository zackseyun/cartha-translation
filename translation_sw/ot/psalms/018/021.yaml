base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/021.yaml
  text: For I have kept the ways of Yahweh[b][a], and have not wickedly departed from my God.
translation:
  language: sw
  text: Kwa maana nimezishika njia za Yahwe, wala sikutenda uovu kwa kumwacha Mungu wangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala sikumwacha Mungu wangu kwa uovu.” Kitenzi cha Kiebrania kina maana ya “kutenda kwa uovu,” na kirai kinachofuata kinaonyesha kutoka au kujitenga na Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au msingi wa dai lililotangulia, na “Kwa maana” kinaendeleza mtiririko wa hoja kwa Kiswahili cha kawaida.
- source_word: שָׁמַרְתִּי
  choice: nimezishika
  rationale: Kitenzi שׁמר humaanisha kushika, kutunza au kuzingatia. “Nimezishika” kinafaa kwa utii unaoelekezwa kwa “njia” na kudumisha tendo lililotimizwa lenye umuhimu wa sasa.
- source_word: דַּרְכֵי
  choice: njia
  rationale: Katika muktadha huu דֶּרֶךְ haimaanishi barabara halisi, bali mwenendo au namna ya kuishi anayoiagiza Mungu. “Njia” ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo, hivyo kutofautisha jina hilo na “Mungu” katika kishazi kinachofuata.
- source_word: וְלֹא
  choice: wala siku-
  rationale: “Wala” huunganisha kwa kawaida kishazi hasi na dai chanya lililotangulia na kuhifadhi ulinganifu wa mistari.
- source_word: רָשַׁעְתִּי
  choice: sikutenda uovu
  rationale: רשע humaanisha kutenda kwa uovu au kuwa na hatia. Tafsiri hii huhifadhi dai la tendo ovu bila kulifanya kuwa tamko pana kuhusu hali ya mtu.
- source_word: מֵאֱלֹהָי
  choice: kwa kumwacha Mungu wangu
  rationale: Kihusishi מִן kina wazo la kutoka au kujitenga. Katika Kiswahili, “kwa kumwacha Mungu wangu” kinaonyesha kwa kawaida uhusiano kati ya kutenda uovu na kuondoka kwa Mungu.
theological_decisions:
- issue: Dai la mwandishi kuhusu uadilifu bila kulipanua kuwa kutokuwa na dhambi kabisa
  choice: Nimezishika njia za Yahwe, wala sikutenda uovu kwa kumwacha Mungu wangu
  alternative: Mimi sikuwa mwovu
  rationale: Kiebrania kinazungumzia kuzishika njia za Yahwe na kutotenda uovu kwa kujitenga na Mungu. Tafsiri haidhoofishi dai hilo la uaminifu, lakini pia hailibadili kuwa dai lisilo na mipaka la kutokuwa na dhambi.
- issue: Uhusiano wa kisarufi kati ya רשע na מִן
  choice: sikutenda uovu kwa kumwacha Mungu wangu
  alternative: sikumwacha Mungu wangu kwa uovu
  rationale: Muundo wa Kiebrania unaweza kueleweka kuwa kutenda kwa uovu kunakodhihirika katika kujitenga na Mungu, au kuondoka kwake kunafanywa kwa uovu. Matini kuu ni ya asili zaidi kwa Kiswahili, huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. “Yahwe” limetumiwa kama jina binafsi; “wala” na “nimezishika njia” hudumisha ulinganifu wa kishairi bila lugha ya kizamani.
