translation:
  language: sw
  text: 'Akapanda kerubi, akaruka;

    akapita kwa kasi[a] juu ya mabawa ya upepo.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akapaa kwa kasi,” “akaruka kama mshale,” au “akashuka ghafula.” Kitenzi cha Kiebrania kilichotumika hapa ni adimu, lakini katika muktadha huu kinaonekana kueleza mwendo wa haraka angani.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania רוּחַ linaweza kumaanisha “upepo,” “pumzi,” au “roho”; hapa “upepo” linafaa zaidi katika taswira ya dhoruba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: akapanda juu ya
  rationale: Kitenzi רכב kina maana ya kupanda au kusafiri juu ya kitu; usemi huu wa Kiswahili ni wa kawaida na unadumisha taswira ya kerubi kama anayembeba.
- source_word: כְּרוּב
  choice: kerubi
  rationale: Hili ndilo neno la Kiswahili lililozoeleka kwa kiumbe huyu wa mbinguni, na linahifadhi taswira halisi ya shairi bila kuifafanua kupita maandishi.
- source_word: וַיָּעֹף
  choice: akaruka
  rationale: עוף humaanisha kuruka; tafsiri hii ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: וַיֵּדֶא
  choice: akapita kwa kasi
  rationale: Kitenzi hiki adimu kinaeleweka hapa kuwa mwendo wa haraka angani, sambamba na 'akaruka.' Tafsiri hii inaonyesha kasi bila kuamua kama mwendo huo ulikuwa kupaa, kushuka ghafula, au kuruka kama mshale.
- source_word: כַּנְפֵי
  choice: mabawa ya
  rationale: Ni wingi wa neno כָּנָף, 'bawa'; tafsiri halisi inadumisha sitiari ya kishairi.
- source_word: רוּחַ
  choice: upepo
  rationale: Katika muktadha wa Mungu kujidhihirisha kwa dhoruba, maana ya 'upepo' inafaa zaidi kuliko 'roho' au 'pumzi.'
theological_decisions:
- issue: Asili ya taswira ya kerubi
  choice: Kudumisha taswira halisi ya Mungu akipanda juu ya kerubi.
  alternative: Kufasiri kerubi kuwa sitiari ya mawingu ya dhoruba au jeshi la malaika.
  rationale: Kiebrania kinatoa taswira dhahiri ya kishairi bila kuieleza kuwa sitiari maalumu; kuidumisha huepuka kuingiza maelezo ya kiteolojia yasiyotajwa.
- issue: Maana ya רוּחַ katika kifungu cha mwisho
  choice: Kutafsiri kama 'upepo' katika matini kuu.
  alternative: '''roho'' au ''pumzi'''
  rationale: Muktadha wa dhoruba unaunga mkono 'upepo,' huku tanbihi ikihifadhi uwazi kuhusu upana wa maana ya neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. Mpangilio wa mistari na urudiaji wa vitenzi huhifadhi mwendo na usambamba wa Kiebrania; msamiati unabaki wa kawaida kwa wasomaji wa leo.
