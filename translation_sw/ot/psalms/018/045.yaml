lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: Wana wa wageni
  rationale: Muundo wa Kiebrania unasema kihalisi ‘wana wa ugeni/mgeni.’ Tafsiri hii inadumisha taswira ya kishairi bila kuirahisisha kuwa ‘wageni’ pekee.
- source_word: יִבֹּלוּ
  choice: wananyauka
  rationale: Kitenzi נבל katika Qal kwa kawaida humaanisha kunyauka, kufifia, au kudhoofika. ‘Wananyauka’ inadumisha picha ya kishairi ya maadui wanaopoteza nguvu.
- source_word: וְיַחְרְגוּ
  choice: wanatoka kwa kutetemeka
  rationale: Kitenzi חרג ni adimu na maana yake hapa si hakika. Katika muktadha huu huenda kinaonyesha kutoka kwa hofu au fadhaa; kutokuwa na uhakika kunabainishwa katika tanbihi.
- source_word: מִמִּסְגְּרוֹתֵיהֶם
  choice: katika ngome zao
  rationale: Nomino hiyo inaweza kumaanisha sehemu zilizofungwa au zenye ulinzi. Katika muktadha wa kijeshi, ‘ngome’ inafaa kwa maadui wanaolazimika kutoka mahali pao pa kujihami.
