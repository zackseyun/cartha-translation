base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/043.yaml
  text: You rescue me from the strivings of the people[a]; you set me as the head of nations[d][c][b]; a people whom I have not known serve me.
translation:
  language: sw
  text: Unaniokoa kutoka katika migogoro ya watu[a]; unaniweka kuwa mkuu wa mataifa[b]; watu ambao sijawajua wananitumikia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mabishano ya watu” au “migogoro kati ya watu.” Neno la Kiebrania linaweza kumaanisha ugomvi, mzozo au shindano.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “kichwa cha mataifa,” yaani, kiongozi au mkuu wao.
    reason: metaphor_clarification
  - marker: c
    text: Au, “watanitumikia.” Umbo la kitenzi cha Kiebrania linaweza kueleweka kuwa la wakati ujao katika muktadha huu.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: תְּפַלְּטֵנִי
  choice: Unaniokoa
  rationale: Kitenzi פלט katika Piel kinaonyesha tendo la Mungu la kumwokoa msemaji; ‘okoa’ ni Kiswahili cha kawaida, wazi na chenye uzito unaofaa.
- source_word: מֵרִיבֵי עָם
  choice: kutoka katika migogoro ya watu
  rationale: רִיב inaweza kumaanisha ugomvi, mzozo au shindano. ‘Migogoro’ inahifadhi maana pana ya hali za kupingana, huku עָם ikitafsiriwa kama nomino ya jamii kwa ‘watu’.
- source_word: תְּשִׂימֵנִי
  choice: unaniweka
  rationale: שׂים humaanisha kuweka au kufanya mtu awe katika cheo fulani; ‘unaniweka’ inafuata picha na muundo wa Kiebrania bila kuongeza wazo la uteuzi rasmi.
- source_word: לְרֹאשׁ גּוֹיִם
  choice: kuwa mkuu wa mataifa
  rationale: רֹאשׁ kwa msingi ni ‘kichwa’ lakini hapa ni sitiari ya uongozi; ‘mkuu’ ni ya asili zaidi katika Kiswahili na inaonyesha cheo juu ya mataifa. גּוֹיִם ni ‘mataifa’ katika muktadha huu wa kisiasa na kijamii.
- source_word: עַם לֹא יָדַעְתִּי
  choice: watu nisiowajua
  rationale: Kirai kinaeleza jamii ambayo msemaji hakuwa na uhusiano au ufahamu nayo. Kiswahili hutumia ‘watu’ kiasili kwa jamii moja au kundi, na ‘nisiowajua’ huhifadhi hali ya kutowajua bila kulazimisha wakati uliopita pekee.
- source_word: יַעַבְדוּנִי
  choice: wanitumikia
  rationale: עבד humaanisha kutumikia; hali ya imperfect inaweza kuonyesha tendo la sasa, la kawaida au lijalo. ‘Wanitumikia’ ni fupi na inahifadhi uwazi huo wa wakati.
theological_decisions:
- issue: Maana ya kisiasa na kijamii ya גּוֹיִם na עַם katika zaburi ya kifalme
  choice: Kutumia ‘mataifa’ na ‘watu’ bila kuongeza mgawanyo wa baadaye wa kikabila au kiteolojia.
  alternative: Kutafsiri גּוֹיִם kwa neno lenye maana mahsusi ya watu wasio Wayahudi.
  rationale: Muktadha unaeleza mamlaka ya mfalme juu ya makundi ya kigeni. ‘Mataifa’ huhifadhi maana ya Kiebrania bila kuingiza tofauti za kiteolojia ambazo mstari wenyewe hauzitaji.
- issue: Wakati wa יַעַבְדוּנִי
  choice: ‘wanitumikia,’ ambalo linaweza kueleweka kama tendo la sasa au la kawaida katika ushairi.
  alternative: ‘watanitumikia,’ kwa maana ya wakati ujao.
  rationale: Imperfect ya Kiebrania inaweza kuwa na maana ya sasa inayoendelea, tabia ya kawaida, au wakati ujao. Matini kuu haifungi uwezekano huo; tanbihi inaonyesha tafsiri ya wakati ujao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi mistari mitatu ya hoja ya Kiebrania, huku ‘mkuu’ ikitumika badala ya sitiari ngumu ya ‘kichwa’ katika matini kuu. ‘Wanitumikia’ ni mtindo wa kishairi unaoeleweka na unaofaa kwa Zaburi.
