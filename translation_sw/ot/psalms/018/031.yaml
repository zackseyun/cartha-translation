  yaml_path: translation/ot/psalms/018/031.yaml
  text: For who is God besides Yahweh? And who is a rock except our God?[a]
translation:
  language: sw
  text: Kwa maana, ni nani aliye Mungu isipokuwa Yahweh? Na ni nani aliye mwamba isipokuwa Mungu wetu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbali na Yahweh” katika sehemu ya kwanza na “mbali na Mungu wetu” katika sehemu ya pili; semi zote mbili za Kiebrania husisitiza upekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huunganisha swali la balagha na sifa iliyotangulia kwa kuonyesha msingi au maelezo yake.
- source_word: מִי
  choice: ni nani
  rationale: Ni kiwakilishi cha kuuliza katika swali la balagha; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: Nomino ya umoja hapa inamrejelea Mungu wa kweli katika kauli ya upekee.
- source_word: מִבַּלְעֲדֵי
  choice: isipokuwa
  rationale: 'Huonyesha upekee kwa kutenga wengine wote: hakuna Mungu mwingine ila Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa katika Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: וּמִי
  choice: Na ni nani
  rationale: Huhifadhi kiunganishi na usambamba wa swali la pili na la kwanza.
- source_word: צוּר
  choice: mwamba
  rationale: Huhifadhi sitiari ya Kiebrania ya uthabiti, nguvu na ulinzi bila kuifafanua kupita kiasi.
- source_word: זוּלָתִי
  choice: isipokuwa
  rationale: Ni neno la kutenga linalofanana kimaana na מִבַּלְעֲדֵי; urudiaji unafanya usambamba uwe wazi katika Kiswahili.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Huhifadhi kiambishi cha nafsi ya kwanza wingi na maana yake ya kijumuiya na ya agano.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina la Mungu lenye herufi nne; “Yahweh” hulihifadhi kama jina badala ya kuliwakilisha kwa cheo.
- issue: Uwasilishaji wa צוּר kama sitiari ya Mungu
  choice: mwamba
  alternative: ngome au kimbilio
  rationale: “Mwamba” huhifadhi taswira halisi ya Kiebrania na kuacha maana zake za uthabiti, nguvu na ulinzi zibaki pamoja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Maswali mawili ya balagha na usambamba wake yamehifadhiwa; “aliye” huweka sentensi katika mtiririko wa kawaida wa Kiswahili bila kupunguza msisitizo wa upekee.
