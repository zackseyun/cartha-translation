lexical_decisions:
- source_word: וַיּוֹצִיאֵנִי
  choice: Akanitoa
  rationale: Kitenzi cha Kiebrania katika Hifili kina maana ya kusababisha mtu atoke au kumtoa. “Akanitoa” ni Kiswahili cha kawaida na kinadumisha picha ya kuondolewa katika hatari au kifungo.
- source_word: לַמֶּרְחָב
  choice: mahali palipo pana
  rationale: מֶרְחָב huonyesha upana au nafasi iliyo wazi, mara nyingi ikitofautisha dhiki na uhuru au usalama. Kauli hii inadumisha picha hiyo kwa Kiswahili cha kawaida.
- source_word: יְחַלְּצֵנִי
  choice: akaniokoa
  rationale: Kitenzi חלץ katika Pieli kinaweza kumaanisha kumwondoa mtu hatarini, kumkomboa, au kumwokoa. “Akaniokoa” ni cha asili katika Kiswahili cha sasa na kinaendana na mstari sambamba uliotangulia.
- source_word: כִּי
  choice: kwa sababu
  rationale: כִּי hapa inatanguliza sababu ya kuokolewa; “kwa sababu” inaonyesha uhusiano huo wazi.
- source_word: חָפֵץ
  choice: alipendezwa
  rationale: חפץ huonyesha furaha, upendezwaji, au mtazamo wa kibali. “Alipendezwa” huwasilisha kibali cha binafsi bila kuongeza sababu yake.
- source_word: בִּי
  choice: nami
  rationale: Kihusishi ב pamoja na חפץ huonyesha kupendezwa na mtu au kitu. “Nami” ni muundo wa asili wa Kiswahili pamoja na “alipendezwa.”
theological_decisions:
- issue: Asili ya kibali cha Mungu katika kishazi cha mwisho
  choice: kwa sababu alipendezwa nami
  alternative: kwa sababu alikuwa amenifurahia
  rationale: Kiebrania kinataja upendezwaji wa Mungu kuwa sababu ya ukombozi, lakini hakielezi kama ulitokana na ustahili, agano, uchaguzi, au neema isiyotegemea ustahili. Tafsiri inaacha suala hilo wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa vitenzi “akanitoa … akaniokoa” unahifadhi mfuatano wa kishairi, huku “mahali palipo pana” ikidumisha taswira ya Kiebrania kwa lugha inayoeleweka kwa urahisi.
