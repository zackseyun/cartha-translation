lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  choice: Mara tu wanaposikia habari zangu
  rationale: Nahau ya Kiebrania, kihalisi ‘kwa kusikia kwa sikio,’ inaonyesha kuitikia mara tu baada ya kusikia. ‘Habari zangu’ huifanya kauli iwe ya kawaida na wazi kwa Kiswahili bila kupoteza wazo la kusikia taarifa kumhusu mfalme.
- source_word: יִשָּׁמְעוּ לִי
  choice: wananitii
  rationale: Kitenzi שׁמע kinapofuatwa na ל mara nyingi humaanisha kumsikiliza mtu kwa kumtii; katika muktadha wa ushindi wa kifalme, utii ndio maana inayofaa kuliko kusikia tu.
- source_word: בְּנֵי נֵכָר
  choice: watu wa mataifa mengine
  rationale: Kirai hicho, kihalisi ‘wana wa ugeni/nchi ya kigeni,’ ni nahau inayowataja wageni au watu wa mataifa ya kigeni. Tafsiri hii ni ya kawaida na yenye heshima katika Kiswahili cha sasa.
- source_word: יְכַחֲשׁוּ לִי
  choice: wanajifanya kunitii
  rationale: Katika muktadha wa kutiishwa, piel ya כחש inaweza kueleza utii wa kujifanya au usio wa hiari. Chaguo hili linadumisha ulinganifu na ‘wananitii’ huku likionyesha kuwa utii wao si wa kweli.
