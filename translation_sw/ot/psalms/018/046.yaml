base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/046.yaml
  text: Yahweh lives[a], and blessed be my rock, and exalted be the God of my salvation.
translation:
  language: sw
  text: 'Yahwe yu hai,

    na Mwamba wangu abarikiwe;

    Mungu wa wokovu wangu atukuzwe.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na Mungu wa wokovu wangu atukuzwe,” au, “na Mungu wa wokovu wangu ametukuka.”
    reason: alternative_reading
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Yahwe yu hai
  rationale: Kirai hiki ni tangazo la kishairi kwamba Yahwe ni Mungu aliye hai. ‘Yu hai’ ni Kiswahili fasaha chenye hadhi ya kishairi na hakiongezi maana ya kiapo isiyolazimishwa na muktadha.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: וּבָרוּךְ
  choice: na ... abarikiwe
  rationale: Umbo hili katika wimbo wa sifa lina nguvu ya tamko la kumhimidi; ‘abarikiwe’ ni la asili katika Kiswahili na linadumisha maana ya ‘blessed be’.
- source_word: צוּרִי
  choice: Mwamba wangu
  rationale: ‘Mwamba’ huhifadhi sitiari ya moja kwa moja ya צוּר kuhusu uthabiti na ulinzi wa Mungu, bila kuifafanua kwa neno kama ‘kimbilio’.
- source_word: וְיָרוּם
  choice: atukuzwe
  rationale: Imperfecti hii imeeleweka kwa nguvu ya matakwa/tamko la sifa kulingana na ulinganifu wake na ‘abarikiwe.’ ‘Atukuzwe’ ni usemi wa kawaida wa kidini na kishairi katika Kiswahili.
- source_word: אֱלוֹהֵי יִשְׁעִי
  choice: Mungu wa wokovu wangu
  rationale: Tafsiri hii huhifadhi muundo wa uhusiano wa Kiebrania na kumwonyesha Mungu kuwa chanzo cha wokovu bila kuongeza ufafanuzi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya וְיָרוּם katika muktadha wa sifa
  choice: 'Tamko la kutakia/kusifu: ‘atukuzwe’'
  alternative: 'Tamko elezi: ‘ametukuka’ au ‘anainuliwa’'
  rationale: Ulinganifu wa kishairi na ‘abarikiwe’ unaunga mkono nguvu ya kutakia au kushangilia, lakini umbo la Kiebrania linaweza pia kueleweka kama tamko elezi; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Mgawanyo wa mistari unaonyesha ulinganifu wa shairi; ‘Mwamba’ umeandikwa kwa herufi kubwa hapa kama taswira inayomrejelea Mungu.
