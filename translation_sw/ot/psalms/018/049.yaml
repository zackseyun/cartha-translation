  yaml_path: translation/ot/psalms/018/049.yaml
  text: Therefore I will give thanks to you among the nations[a], O Yahweh, and I will sing praise to your name.
translation:
  language: sw
  text: Kwa hiyo nitakushukuru kati ya mataifa,[a] Ee Yahweh, nami nitaliimbia jina lako sifa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kati ya mataifa”; pia yaweza kutafsiriwa, “kati ya watu wa mataifa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho au matokeo yanayotokana na muktadha uliotangulia, kwa Kiswahili cha kawaida na cha sasa.
- source_word: אוֹדְךָ
  choice: nitakushukuru
  rationale: Hifili ya ידה katika muktadha wa zaburi huonyesha kumshukuru au kumsifu Mungu; ‘nitakushukuru’ inadumisha maana ya shukrani na kiambishi cha nafsi ya pili.
- source_word: בַגּוֹיִם
  choice: kati ya mataifa
  rationale: גוים hapa humaanisha mataifa au makundi ya watu kwa upana; ‘kati ya mataifa’ inadumisha upeo wa kimataifa bila kuingiza mapema maana maalumu ya ‘watu wa Mataifa.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetolewa kama jina binafsi ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
- source_word: וּלְשִׁמְךָ
  choice: nami nitaimbia jina lako
  rationale: Muundo wa Kiswahili ‘kuimbia jina lako’ ni wa asili na unawakilisha לְ pamoja na kitenzi kinachofuata.
- source_word: אֲזַמֵּרָה
  choice: nitaimbia ... sifa
  rationale: Pieli ya זמר humaanisha kuimba au kufanya muziki wa sifa; ‘nitaimbia ... sifa’ huonyesha wazi tendo la ibada na kudumisha ulinganifu na kutoa shukrani.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya גוים
  choice: mataifa
  alternative: watu wa Mataifa
  rationale: ‘Mataifa’ ndiyo maana pana na ya moja kwa moja katika mazingira ya Zaburi; ‘watu wa Mataifa’ inaweza kusikika kama istilahi maalumu ya kidini na kupunguza utata wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi umehifadhiwa kwa sentensi yenye sehemu mbili zinazolingana.
