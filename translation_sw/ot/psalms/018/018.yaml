  text: יְקַדְּמ֥וּ/נִי בְ/יוֹם אֵידִ֑/י וַֽ/יְהִי יְהוָ֖ה לְ/מִשְׁעָ֣ן לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/018.yaml
  text: They confronted me in the day of my calamity[a], but Yahweh was my support.
translation:
  language: sw
  text: Walinikabili siku ya msiba wangu[a], lakini Yahweh alikuwa tegemeo langu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Walinijia” au “Walikutana nami” siku ya msiba wangu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקַדְּמוּנִי
  choice: Walinikabili
  rationale: Kitenzi קדמ katika Piel pamoja na kiambishi cha nafsi ya kwanza umoja kina maana ya kuja mbele ya mtu au kukutana naye. Katika muktadha huu wa uhasama, “walinikabili” linaonyesha kukutana kwa upinzani bila kulazimisha maana mahsusi zaidi ya mashambulizi ya kijeshi.
- source_word: בְּיוֹם
  choice: siku ya
  rationale: Kirai cha wakati בְּיוֹם kinaweza kutafsiriwa kwa Kiswahili cha kawaida na cha kishairi kuwa “siku ya,” bila kuhitaji kurudia kihusishi cha Kiebrania neno kwa neno.
- source_word: אֵידִי
  choice: msiba wangu
  rationale: אֵיד humaanisha janga, maafa, au anguko. “Msiba” ni neno la kawaida lakini lenye hadhi linalofaa muktadha wa kishairi na halibani maana kuwa hisia ya dhiki pekee.
- source_word: וַיְהִי
  choice: lakini ... alikuwa
  rationale: 'Ingawa וַיְהִי kimsingi huendeleza simulizi kwa “naye alikuwa,” uhusiano wa mishororo hapa ni wa utofautishaji: maadui walimkabili, lakini Yahweh alimshikilia. “Lakini” huonyesha tofauti hiyo kwa kawaida katika Kiswahili.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetolewa kama “Yahweh,” likihifadhi jina binafsi lililo katika maandishi ya Kiebrania badala ya kulibadili kuwa cheo.
- source_word: לְמִשְׁעָן לִי
  choice: tegemeo langu
  rationale: מִשְׁעָן ni kitu au mtu anayetegemewa kwa msaada. “Tegemeo langu” ni Kiswahili cha asili kinachohifadhi taswira ya msaada unaomshikilia mtu bila kuingiza kitu maalumu kama fimbo.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yanatumia Tetragramatoni יהוה moja kwa moja. “Yahweh” huhifadhi jina hilo la agano bila kulibadili kuwa cheo, huku “Yehova” ikiwa namna nyingine ya kimapokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Walinikabili” huhifadhi uhasama wa muktadha bila kuzidisha kuwa shambulio la kijeshi; “tegemeo langu” ni sitiari ya kawaida na wazi.
