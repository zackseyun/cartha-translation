base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/011.yaml
  text: He made darkness his hiding place[a], around him his shelter—dark waters[c][b], thick clouds of the skies.
translation:
  language: sw
  text: Aliweka giza kuwa maficho yake[a]; kumzunguka kulikuwa na banda lake[b]—giza la maji[c], mawingu mazito ya angani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali pake pa siri.”
    reason: lexical_alternative
  - marker: b
    text: Au “kifuniko chake” au “kibanda chake.”
    reason: lexical_alternative
  - marker: c
    text: Au “maji yenye giza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֶׁת
  choice: Aliweka
  rationale: Kitenzi hiki katika ushairi kina maana ya kuweka au kufanya kitu kiwe katika hali fulani; “aliweka” huhifadhi picha ya Mungu akilifanya giza kuwa mahali pa kujisitiri.
- source_word: חֹשֶׁךְ
  choice: giza
  rationale: Hili ndilo neno la kawaida na la moja kwa moja, nalo huhifadhi taswira ya anga la dhoruba bila kulipa giza maana ya kimaadili.
- source_word: סִתְרוֹ
  choice: maficho yake
  rationale: “Maficho” hueleza mahali pa kufichika au kujisitiri na linafaa katika lugha ya kishairi ya mstari huu.
- source_word: סְבִיבוֹתָיו
  choice: kilichomzunguka
  rationale: Uundaji huu wa asili katika Kiswahili huhifadhi wazi taswira ya kitu kilichokuwa pande zote za Mungu.
- source_word: סֻכָּתוֹ
  choice: kisitiri chake
  rationale: “Kisitiri” huonyesha kifuniko au mahali pa kujikinga bila kuingiza moja kwa moja wazo maalumu la hema la ibada; njia halisi zaidi kama “banda” imehifadhiwa katika tanbihi.
- source_word: חֶשְׁכַת מַיִם
  choice: giza la maji
  rationale: Tafsiri hii huhifadhi muundo na mkazo wa kishairi wa Kiebrania badala ya kuusawazisha moja kwa moja kuwa “maji yenye giza.”
- source_word: עָבֵי שְׁחָקִים
  choice: mawingu mazito ya anga
  rationale: “Mawingu mazito” huwakilisha wingu zito au lenye msongamano, na “anga” linafaa kwa msamiati wa kishairi wa dhoruba.
theological_decisions:
- issue: Giza katika kujidhihirisha kwa Mungu kupitia dhoruba linaweza kupewa maana ya kiishara isiyotajwa wazi.
  choice: Taswira imetafsiriwa moja kwa moja kama giza na mawingu yanayomzunguka Mungu na kumficha.
  alternative: Kulieleza giza kama ishara mahsusi ya hukumu au uovu.
  rationale: Kiebrania kinaonyesha kujisitiri kwa Mungu katika taswira ya dhoruba, lakini hakibainishi hapa kwamba giza lina maana ya kimaadili au kimetafizikia.
- issue: סֻכָּתוֹ linaweza kueleweka kama banda la kawaida, kifuniko, au taswira ya hema la ibada.
  choice: kisitiri chake
  alternative: hema lake
  rationale: “Kisitiri” huhifadhi kazi ya kitu kinachofunika au kukinga huku kikiepuka kuifanya taswira hii kuwa rejeo la kiibada ambalo mstari wenyewe haulazimishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wenye hadhi lakini unaoeleweka. Muundo “giza la maji” umeachwa kwa makusudi ili kuhifadhi msuko wa kishairi wa Kiebrania; tanbihi inatoa usemi laini zaidi wa Kiswahili.
