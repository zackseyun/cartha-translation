base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/034.yaml
  text: He trains my hands for battle[a], and my arms can bend a bow of bronze.
translation:
  language: sw
  text: Huizoeza mikono yangu kwa vita, na mikono yangu ya juu inaweza kupinda upinde wa shaba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata zaidi muundo wa Kiebrania, “na upinde wa shaba hupindwa kwa mikono yangu ya juu.” Kishazi hiki cha Kiebrania ni kigumu na kinaweza kutafsiriwa kwa maana ya kauli tendwa iliyo karibu zaidi na muundo wake.
    reason: alternative_reading
lexical_decisions:
- source_word: מְלַמֵּד
  choice: huizoeza
  rationale: Kitenzi hiki kinaweza kumaanisha kufundisha au kuzoeza. Katika muktadha wa vita, “huizoeza” linaonyesha maandalizi ya vitendo kwa ufasaha wa Kiswahili.
- source_word: יָדַי
  choice: mikono yangu
  rationale: Huhifadhi taswira halisi ya viungo vinavyoandaliwa kwa vita; “mikono” ndiyo neno la kawaida la Kiswahili kwa יָדַי.
- source_word: לַמִּלְחָמָה
  choice: kwa vita
  rationale: Neno מלחמה linaweza kurejelea vita au mapambano. “Kwa vita” ni la asili katika kishazi hiki na linadumisha maana ya kijeshi.
- source_word: וְנִחֲתָה
  choice: inaweza kupinda
  rationale: Muundo wa Kiebrania ni mgumu na unaonekana kueleza uwezo aliopewa mtunga zaburi. Tafsiri hii ni ya asili katika Kiswahili, huku maana ya kauli tendwa ya karibu zaidi ikiwekwa katika tanbihi.
- source_word: קֶשֶׁת
  choice: upinde
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa silaha hii, na umoja umehifadhiwa.
- source_word: נְחוּשָׁה
  choice: wa shaba
  rationale: Neno la Kiebrania linaweza kumaanisha shaba au metali ya shaba iliyochanganywa. “Shaba” ni neno la kawaida na linaloeleweka kwa urahisi katika Kiswahili.
- source_word: זְרוֹעֹתָי
  choice: mikono yangu
  rationale: Katika Kiswahili cha kawaida, “mikono” huweza kurejelea mikono yote au sehemu zake za juu; uchaguzi huu ni wa asili ingawa Kiebrania hutofautisha hapa kati ya mikono na mab腕.
theological_decisions:
- issue: Maana ya kishazi kigumu וְנִחֲתָה קֶשֶׁת נְחוּשָׁה זְרוֹעֹתָי
  choice: 'Kishazi kinaeleza uwezo aliopewa: “mikono yangu inaweza kupinda upinde wa shaba.”'
  alternative: “upinde wa shaba umepindwa kwa mikono yangu”
  rationale: 'Tafsiri iliyochaguliwa inalingana vizuri na ulinganifu wa kishairi: Mungu humwandaa mtunga zaburi kwa vita na kumpa nguvu. Tanbihi huhifadhi uwezekano wa kusoma muundo huo kama kauli tendwa bila kuondoa ugumu halisi wa Kiebrania.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Kurudiwa kwa “mikono yangu” kumehifadhiwa kwa sababu Kiswahili hakina tofauti ya kawaida na ya asili kama ile ya Kiebrania kati ya יָדַי na זְרוֹעֹתָי katika muktadha huu.
