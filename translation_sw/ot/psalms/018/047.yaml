  text: the God who gives vengeance to me and subdues peoples under me[a][b].
translation:
  language: sw
  text: Mungu anayenipa kisasi[a] na kutiisha mataifa chini yangu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “matendo ya kulipiza kisasi”; Kiebrania kinatumia umbo la wingi lenye maana ya dhana au msisitizo.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi hiki hapa kwa kawaida hueleweka kuwa na maana ya “kutiisha” au “kuweka chini ya mamlaka,” si “kusema,” ingawa kinahusiana na kitenzi cha kawaida cha Kiebrania kinachomaanisha “kusema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Mungu
  rationale: Kiswahili hakitumii kibainishi maalumu sawa na הַ; “Mungu” huwasilisha kwa kawaida na kwa heshima rejeo hili maalumu.
- source_word: הַנּוֹתֵן
  choice: anayenipa
  rationale: Kauli ya wakati wa sasa yenye uhusiano inaakisi kiambishi cha sifa kinachomtambulisha Mungu kwa tendo hili; pia inajumuisha לִי kwa Kiswahili cha kawaida.
- source_word: נְקָמוֹת
  choice: kisasi
  rationale: Umoja wa dhana katika Kiswahili huwasilisha wingi wa Kiebrania wenye maana ya dhana au msisitizo; tanbihi huhifadhi uwezekano wa “matendo ya kulipiza kisasi.”
- source_word: לִי
  choice: -nipa
  rationale: Kiambishi cha mtendewa -ni- kinaonyesha kuwa mtunga zaburi ndiye anayepokea au kunufaika na kisasi hicho.
- source_word: וַיַּדְבֵּר
  choice: na kutiisha
  rationale: Katika muktadha huu umbo hili lina maana ya kuwaleta watu chini ya mamlaka, si kusema; muundo unaendelea na maelezo ya Mungu katika mstari huu.
- source_word: עַמִּים
  choice: watu
  rationale: “Watu” linaweza kuonyesha makundi ya watu kwa jumla na ni la kawaida katika ushairi wa Kiswahili; wingi wa makundi unaeleweka kutokana na muktadha.
- source_word: תַּחְתָּי
  choice: chini yangu
  rationale: Huhifadhi sitiari ya mahali inayomaanisha kuwa chini ya mamlaka ya mtunga zaburi.
theological_decisions:
- issue: Lugha ya kisasi cha Mungu
  choice: Kuhifadhi “kisasi” kama tendo la Mungu kwa ajili ya mtunga zaburi.
  alternative: ukombozi; kumtetea na kumthibitishia haki
  rationale: נְקָמוֹת huelekeza moja kwa moja kwenye kisasi au matendo ya kulipiza kisasi. Maneno laini zaidi yangepunguza nguvu na mvutano wa maandishi.
- issue: Maana ya וַיַּדְבֵּר katika muktadha huu
  choice: kutiisha
  alternative: kusema; kuwaleta chini ya mamlaka
  rationale: Muktadha wa ushindi wa kifalme na kirai “chini yangu” unaunga mkono maana ya kutiisha, bila kuingiza madai ya ziada kuhusu namna au uhalali wa utawala huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo ni mfupi ili kuhifadhi mwendelezo wa sifa za Mungu. Alama zote za tanbihi zimewekwa katika matini kuu.
