translation:
  language: sw
  text: Niliwasaga kuwa mavumbi mbele ya upepo[a]; niliwamwaga kama matope ya barabarani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “juu ya uso wa upepo”; yaani, kama mavumbi yanayopeperushwa na kutawanywa na upepo.
    reason: lexical_alternative
  - marker: b
    text: Au, “niliwaondoa kama matope ya barabarani.” Kitenzi cha Kiebrania kinaweza kumaanisha kumwaga au kuondoa yaliyomo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶשְׁחָקֵם
  choice: Niliwasaga
  rationale: Kitenzi שׁחק kinaonyesha kusaga au kuponda hadi kuwa chembechembe; “niliwasaga” kinahifadhi picha ya kuwafanya adui kuwa kama mavumbi.
- source_word: כְּעָפָר
  choice: kuwa mavumbi
  rationale: עָפָר humaanisha mavumbi au udongo mkavu; “mavumbi” linafaa kwa picha ya kitu kilichosagwa na kutawanywa na upepo.
- source_word: עַל־פְּנֵי רוּחַ
  choice: mbele ya upepo
  rationale: Hii inafuata kwa karibu nahau ya Kiebrania, kihalisi “juu ya uso wa upepo,” huku ikieleweka kwa Kiswahili kuwa mavumbi yanapeperushwa na upepo.
- source_word: כְּטִיט חוּצוֹת
  choice: kama matope ya barabarani
  rationale: טִיט ni matope au tope, na חוּצוֹת hapa hurejelea barabara au maeneo ya nje; usemi huu ni wa kawaida na unabaki na picha ya kudhalilishwa.
- source_word: אֲרִיקֵם
  choice: niliwamwaga
  rationale: Hifili ya ריק inaweza kumaanisha kumwaga au kuondoa yaliyomo; “niliwamwaga” huhifadhi sitiari bila kuibadili kuwa kitendo tofauti.
