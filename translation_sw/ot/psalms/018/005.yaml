lexical_decisions:
- source_word: חֶבְלֵי
  choice: Kamba za
  rationale: Neno hilo linaweza kumaanisha kamba zinazofunga au kunasa; “kamba” huhifadhi taswira ya kishairi bila kuifasiri kupita kiasi.
- source_word: שְׁאוֹל
  choice: Sheoli
  rationale: Utohozi huu huhifadhi dhana pana ya Kiebrania na kuitofautisha na “mauti” katika ulinganifu wa mstari, bila kuingiza fundisho maalumu kuhusu hali ya wafu.
- source_word: סְבָבוּנִי
  choice: zilinizunguka
  rationale: Hutoa moja kwa moja maana ya kuzunguka au kuzingira na unasikika kwa kawaida katika Kiswahili.
- source_word: קִדְּמוּנִי
  choice: ilinikabili
  rationale: Katika muktadha huu wa tishio, “ilinikabili” huwasilisha kukutana uso kwa uso kwa namna ya uhasama, huku maana ya msingi ya kukutana au kujitokeza mbele ikihifadhiwa.
- source_word: מוֹקְשֵׁי
  choice: mitego ya
  rationale: “Mitego” ni tafsiri ya kawaida na wazi ya vitu vya kunasa, na inaendana na taswira ya kamba.
- source_word: מָוֶת
  choice: mauti
  rationale: “Mauti” ni neno la heshima lenye ladha ya kishairi, linalofaa hapa ambapo kifo kinaonyeshwa kama nguvu inayotisha.
theological_decisions:
- issue: Tafsiri ya שְׁאוֹל
  choice: Sheoli
  alternative: kaburi; makao ya wafu
  rationale: Kutumia jina lililotoholewa huhifadhi upana na utata wa neno la Kiebrania badala ya kulifanya limaanishe kaburi pekee au kulifunga kwa mtazamo fulani wa maisha baada ya kifo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na hadhi ya kishairi. Muundo sambamba wa kishairi umehifadhiwa; “mauti” limetumiwa badala ya “kifo” kwa uzito wa kishairi.
