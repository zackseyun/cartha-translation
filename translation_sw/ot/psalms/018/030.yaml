base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/030.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is refined[b]; he is a shield to all who take refuge in him.
translation:
  language: sw
  text: Mungu, njia yake haina dosari; neno la Yahwe limesafishwa[a]; yeye ni ngao kwa wote wanaokimbilia kwake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “limejaribiwa” au “limetakaswa.” Kiebrania kinatoa picha ya chuma kinachosafishwa kwa moto, kikisisitiza usafi uliothibitishwa wa neno la Yahwe.
    reason: lexical_alternative
  - marker: b
    text: Au “wanaomtegemea.” Kiebrania kwa maana ya moja kwa moja zaidi husema wale wanaotafuta kimbilio kwake, hivyo kikidumisha picha ya Mungu kama mahali pa usalama.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Kwa habari ya Mungu
  rationale: Kibainishi na nafasi ya mwanzo wa kishazi vinaipa nomino nguvu ya mada; kauli hii inaonyesha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: תָּמִים
  choice: haina dosari
  rationale: Neno hili linaonyesha ukamilifu na kutokuwa na kasoro. Katika muktadha wa njia ya Mungu, ‘haina dosari’ ni ya asili na hudumisha maana ya uadilifu bila kuifanya iwe dai la kinadharia lisilo katika mstari.
- source_word: דַּרְכּוֹ
  choice: njia yake
  rationale: דֶּרֶךְ ni ‘njia’ na hapa inaelekea kumaanisha namna ya Mungu ya kutenda; tafsiri hii inadumisha picha na pia ni ya kawaida katika Kiswahili.
- source_word: אִמְרַת יְהוָה
  choice: neno la Yahwe
  rationale: אִמְרָה ni tamko au neno. ‘Neno la Yahwe’ ni fasaha na hudumisha jina binafsi la Mungu lililo katika Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo, ili kudumisha jina binafsi lililo katika matini chanzo.
- source_word: צְרוּפָה
  choice: limesafishwa
  rationale: Mzizi צרף hutumiwa kuhusu kusafisha chuma kwa moto na hivyo kuthibitisha usafi wake. ‘Limesafishwa’ hudumisha kiini cha sitiari hiyo; maelezo ya tanbihi yanaonyesha maana nyingine zinazowezekana.
- source_word: מָגֵן
  choice: ngao
  rationale: Nomino hii humaanisha ngao halisi; tafsiri inadumisha sitiari ya Mungu kuwa ulinzi badala ya kuibadili kuwa neno la jumla ‘mlinzi’.
- source_word: הוּא
  choice: yeye ni
  rationale: Kiwakilishi huru ni kiima cha kishazi kisicho na kitenzi katika Kiebrania; Kiswahili huhitaji ‘ni’ ili kutoa sentensi ya kawaida.
- source_word: לְכֹל
  choice: kwa wote
  rationale: Kihusishi ל hapa huonyesha uhusiano wa manufaa au ulinzi; ‘kwa wote’ ni muundo wa kawaida pamoja na ‘ngao’.
- source_word: הַחֹסִים בּוֹ
  choice: wanaokimbilia kwake
  rationale: חסה humaanisha kutafuta au kupata kimbilio. ‘Wanaokimbilia kwake’ hudumisha picha hai ya mtu anayemwendea Mungu ili apate usalama; wazo la kumtumaini linadokezwa lakini halichukui nafasi ya sitiari.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ina Tetragramatoni yenyewe. ‘Yahwe’ hudumisha jina binafsi la agano badala ya kulibadili kuwa cheo, huku ‘Yehova’ likiwa umbo la baadaye lililochanganya konsonanti na alama za vokali.
- issue: Maana ya תָּמִים kuhusu njia ya Mungu
  choice: haina dosari
  alternative: ni kamilifu; haina lawama
  rationale: ‘Haina dosari’ huonyesha ukamilifu na kutokuwa na kasoro bila kupunguza maana kuwa maadili pekee; pia huacha wazi kwamba ‘njia’ inaweza kumaanisha mwenendo au namna ya Mungu ya kutenda.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa kwa vishazi vitatu vinavyolingana. ‘Kwa habari ya Mungu’ huweka msisitizo wa mada; ‘haina dosari,’ ‘limesafishwa,’ na ‘wanaokimbilia kwake’ ni wazi kwa msomaji wa kawaida huku zikidumisha picha za Kiebrania.
