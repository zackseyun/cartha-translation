  text: עָ֘לָ֤ה עָשָׁ֨ן בְּ/אַפּ֗/וֹ וְ/אֵשׁ מִ/פִּ֥י/ו תֹּאכֵ֑ל גֶּ֝חָלִ֗ים בָּעֲר֥וּ מִמֶּֽ/נּוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/008.yaml
  text: Smoke rose from his nostrils[a], and fire from his mouth consumed; coals blazed from him.
translation:
  language: sw
  text: 'Moshi ulipanda kutoka puani mwake[a];

    na moto wa kuteketeza kutoka kinywani mwake;

    makaa yaliwaka kutoka kwake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa hasira yake.” Neno la Kiebrania אַף linaweza kumaanisha “pua” au, kwa njia ya nahau, “hasira.” Hapa usambamba na “kutoka kinywani mwake” unaunga mkono taswira halisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: ulipanda
  rationale: Kitenzi hiki humaanisha kwenda juu au kupanda; ‘ulipanda’ ni usemi wa kawaida kwa moshi na huhifadhi mwendo unaoelezwa.
- source_word: עָשָׁן
  choice: moshi
  rationale: Hii ndiyo maana ya moja kwa moja ya nomino hiyo katika muktadha huu.
- source_word: בְּאַפּוֹ
  choice: kutoka puani mwake
  rationale: Ingawa אַף pia inaweza kumaanisha ‘hasira,’ usambamba na ‘kutoka kinywani mwake’ unaunga mkono picha halisi ya moshi unaotoka puani. ‘Puani’ ni Kiswahili cha kawaida na chenye staha kwa picha hii.
- source_word: וְאֵשׁ
  choice: na moto
  rationale: Tafsiri ya moja kwa moja inayodumisha usambamba wa kishairi.
- source_word: מִפִּיו
  choice: kutoka kinywani mwake
  rationale: Inahifadhi moja kwa moja taswira ya kimwili ya ufunuo wa Mungu katika shairi.
- source_word: תֹּאכֵל
  choice: ukateketeza
  rationale: Kitenzi kina maana ya kula, kumeza, au kuteketeza. Kuhusiana na moto, ‘ukateketeza’ ni cha asili katika Kiswahili na huhifadhi tendo hai la uharibifu.
- source_word: גֶּחָלִים
  choice: makaa
  rationale: ‘Makaa’ ni kifupi na cha moja kwa moja; kitenzi kinachofuata kinaonyesha kwamba yanawaka.
- source_word: בָּעֲרוּ
  choice: yaliwaka
  rationale: Kitenzi hiki humaanisha kuwaka au kuchomeka; ‘yaliwaka’ ni cha kawaida na kinafaa kwa makaa.
- source_word: מִמֶּנּוּ
  choice: kutoka kwake
  rationale: Inahifadhi maana ya msingi ya chanzo bila kufafanua zaidi namna makaa yalivyotoka.
theological_decisions:
- issue: Lugha inayomweleza Mungu kwa taswira ya viungo vya mwili katika ufunuo wa kishairi
  choice: Kudumisha taswira halisi ya ‘puani’ na ‘kinywani’
  alternative: Kutafsiri אַף kwa maana ya ‘hasira’ na kupunguza taswira ya kimwili
  rationale: Zaburi hii inatumia kwa makusudi taswira yenye nguvu ya ufunuo wa Mungu. Usambamba wa pua na kinywa unapendelea maana halisi hapa, huku maana mbadala ya ‘hasira’ ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mistari mitatu inadumisha usambamba na nguvu ya taswira ya Kiebrania bila kuifafanua kupita kiasi.
