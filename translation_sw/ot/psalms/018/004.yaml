  yaml_path: translation/ot/psalms/018/004.yaml
  text: The cords of death surrounded me[a], and the torrents of destruction terrified me.
translation:
  language: sw
  text: 'Kamba za mauti zilinizunguka;

    mafuriko ya uharibifu[a] yalinitia hofu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mikondo ya maji yenye nguvu ya uharibifu.” Neno la Kiebrania linaweza pia kueleweka kama jina maalumu, “Beliali,” lakini hapa yaelekea ni nomino ya kawaida yenye maana ya uharibifu au ubatili.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: zilinizunguka
  rationale: Kitenzi אפף kina maana ya kuzunguka au kuzingira. “Zilinizunguka” ni Kiswahili cha kawaida na kinahifadhi picha ya msemaji kufunikwa pande zote na hatari.
- source_word: חֶבְלֵי
  choice: kamba za
  rationale: חבל humaanisha kamba au nyuzi za kufungia, ingawa katika ushairi inaweza pia kuashiria mitego au maumivu. “Kamba” inadumisha picha halisi ya Kiebrania bila kuamua kuwa ni mitego.
- source_word: מָוֶת
  choice: mauti
  rationale: “Mauti” ni neno la Kiswahili sanifu, lenye hadhi ya kishairi, linalolingana moja kwa moja na מָוֶת.
- source_word: נַחֲלֵי
  choice: mafuriko ya
  rationale: נחל inaweza kumaanisha kijito, bonde la mto mkavu, au maji yanayotiririka kwa nguvu. Katika picha hii ya hatari, “mafuriko” yanaonyesha nguvu inayomjia msemaji kwa ghafla.
- source_word: בְלִיַּעַל
  choice: uharibifu
  rationale: Katika muktadha huu בְלִיַּעַל inaelekea kuwa nomino ya kawaida inayoashiria ubaya wenye kuleta maangamizi, si jina maalumu. “Uharibifu” huwasilisha nguvu ya mauti ya picha hii kwa Kiswahili cha asili.
- source_word: יְבַעֲתוּנִי
  choice: yalinitia hofu
  rationale: Kitenzi בעת huonyesha kushtushwa au kuingiwa na hofu kali. “Yalinitia hofu” ni usemi wa kawaida unaohifadhi maana hiyo bila kuongeza wazo la kushindwa kabisa.
theological_decisions:
- issue: Iwapo בְלִיַּעַל litafsiriwe kama jina maalumu “Beliali” au kama nomino ya kawaida
  choice: 'Nomino ya kawaida: “uharibifu”'
  alternative: “uovu,” “ufisadi,” au jina maalumu “Beliali”
  rationale: Muundo wa kishairi hapa unaeleza nguvu hatari zinazomkabili msemaji. Hakuna jambo katika mstari huu linalolazimisha kulichukua kama jina la kiumbe binafsi; hivyo tafsiri ya nomino ya kawaida huepuka kuingiza dhana ya baadaye katika maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki chenye mtindo wa kishairi na wenye hadhi. “Mauti” na mpangilio wa mistari miwili vinafaa zaburi, huku sentensi ikibaki wazi kwa msomaji wa kawaida.
