base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/000.yaml
  text: For the choirmaster[a]. Of David, the servant of Yahweh[b], who spoke to Yahweh the words of this song on the day when Yahweh rescued him from the hand of all his enemies and from the hand of Saul.
translation:
  language: sw
  text: Kwa kiongozi wa waimbaji.[a] Ya Daudi, mtumishi[b] wa Yahweh, aliyemwambia Yahweh maneno ya wimbo huu siku ambayo Yahweh alimwokoa kutoka mkononi[c] mwa maadui zake wote na kutoka mkononi mwa Sauli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, Kwa kiongozi wa muziki. Neno la Kiebrania humtaja mtu mwenye jukumu la kuongoza utendaji wa muziki.
    reason: lexical_alternative
  - marker: b
    text: Au, mtumwa. Neno la Kiebrania linaweza kumaanisha mtumishi au mtumwa; hapa limetumiwa kama jina la heshima kwa Daudi.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania, “kutoka mkono wa”; usemi huu unamaanisha kuokolewa kutoka katika nguvu au mamlaka ya mtu.
    reason: cultural_note
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa kiongozi wa waimbaji
  rationale: Hii ni fomula ya kichwa cha zaburi inayomwelekea mwenye jukumu la kuongoza uimbaji au muziki. Tafsiri hii ni wazi katika Kiswahili na inadumisha kazi ya kiliturujia bila kuibana kuwa cheo cha kisasa.
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Kihusishi לְ katika vichwa vya zaburi kinaweza kuonyesha uandishi, umiliki, au uhusiano. “Ya Daudi” ni ya asili katika Kiswahili na haibainishi zaidi ya Kiebrania.
- source_word: לְעֶבֶד יְהוָה
  choice: mtumishi wa Yahweh
  rationale: עֶבֶד inaweza kumaanisha mtumishi au mtumwa. Hapa ni jina la heshima linaloeleza uhusiano wa Daudi na Yahweh, hivyo “mtumishi” linafaa zaidi katika muktadha huu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu lililoandikwa kwa herufi יהוה limetoholewa kama “Yahweh” badala ya kubadilishwa na cheo.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: maneno ya wimbo huu
  rationale: Tafsiri hii inafuata moja kwa moja muundo wa Kiebrania na ni ya kawaida katika Kiswahili.
- source_word: הִצִּיל
  choice: alimwokoa
  rationale: Kitenzi hiki hapa kina maana ya kumtoa mtu katika hatari au mamlaka ya adui. “Alimwokoa” ni Kiswahili cha kawaida na kinachofaa katika muktadha.
- source_word: מִכַּף ... וּמִיַּד
  choice: kutoka mikononi ... na kutoka mkononi
  rationale: Kiebrania kinatumia taswira ya mkono kueleza nguvu au mamlaka. Kiswahili pia kinaweza kutumia “mkononi mwa” kwa maana hii, kwa hiyo taswira na usambamba vimehifadhiwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu, si cheo. “Yahweh” huhifadhi tofauti hiyo.
- issue: Ikiwa עֶבֶד itafsiriwe “mtumishi” au “mtumwa”
  choice: mtumishi
  alternative: mtumwa
  rationale: Neno la Kiebrania linaweza kuwa na maana zote mbili, lakini katika kichwa hiki linatumika kama jina la heshima kwa Daudi katika uhusiano wake na Yahweh. Maana mbadala imeonyeshwa katika tanbihi.
- issue: Uhusiano unaoonyeshwa na לְדָוִד
  choice: Ya Daudi
  alternative: Kwa Daudi; iliyohusishwa na Daudi
  rationale: Muundo wa Kiebrania unaweza kuhusisha zaburi na Daudi bila kuamua wazi aina kamili ya uhusiano. “Ya Daudi” huhifadhi upana huo kuliko kauli ya moja kwa moja kwamba Daudi ndiye mwandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kichwa cha zaburi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi ya Kiebrania imegawanywa baada ya utambulisho wa Daudi ili kuepuka mlolongo mzito, huku maana na uhusiano wa vipashio ukihifadhiwa.
