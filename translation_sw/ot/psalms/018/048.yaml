  text: מְפַלְּטִ֗/י מֵ/אֹ֫יְבָ֥/י אַ֣ף מִן קָ֭מַ/י תְּרוֹמְמֵ֑/נִי מֵ/אִ֥ישׁ חָ֝מָ֗ס תַּצִּילֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/048.yaml
  text: the one who rescues me from my enemies[a]; indeed, you lift me up above those who rise against me[c][b]; you deliver me from the violent man.
translation:
  language: sw
  text: Wewe unayeninusuru kutoka kwa adui zangu[a]; hakika, unaniinua juu ya wale wanaoniinukia[b]; unaniokoa kutoka kwa mtu mwenye jeuri[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mkombozi wangu kutoka kwa adui zangu.” Neno la Kiebrania ni kishiriki kinachotumiwa kama jina au sifa ya Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au, “unanitukuza juu ya wale wanaoniinukia.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “mtu wa jeuri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְפַלְּטִי
  choice: wewe unayeninusuru
  rationale: Umbo la kitenzi ni endelevu na linatumika kama jina au sifa ya Mungu. Tafsiri hii inadumisha wazo la Mungu kuwa yule anayemtendea mtunga zaburi tendo la kumnusuru, huku ikiunganika kwa kawaida na vitenzi vya nafsi ya pili vinavyofuata.
- source_word: מֵאֹיְבַי
  choice: kutoka kwa adui zangu
  rationale: Hii inawakilisha moja kwa moja kihusishi מִן pamoja na nomino yenye kiambishi cha nafsi ya kwanza umoja.
- source_word: אַף
  choice: hakika
  rationale: Neno hili linatilia mkazo hatua inayofuata, si kuunganisha sentensi kwa maana ya ‘pia’ tu.
- source_word: מִן קָמַי
  choice: juu ya wale wanaoniinukia
  rationale: Washiriki wa kitenzi קום ni wapinzani wanaoinuka dhidi ya msemaji. Pamoja na רום na מִן, usemi una maana ya kumweka juu kuliko wapinzani hao.
- source_word: תְּרוֹמְמֵנִי
  choice: unaniinua
  rationale: Tafsiri inadumisha picha ya kwenda juu iliyo katika mzizi רום na inaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: מֵאִישׁ חָמָס
  choice: kutoka kwa mtu mwenye jeuri
  rationale: אִישׁ ni nomino ya umoja, na חָמָס hapa ni jeuri au ukatili. ‘Mtu mwenye jeuri’ ni Kiswahili cha kawaida kinachodumisha umoja bila kuongeza dai lisilo la lazima kuhusu jinsia ya mhusika.
- source_word: תַּצִּילֵנִי
  choice: unaniokoa
  rationale: Mzizi נצל humaanisha kuokoa au kuponya kutoka hatarini. ‘Kuokoa’ ni neno la kawaida na la heshima, nalo linatofautishwa kwa kiasi na ‘kunusuru’ lililotumiwa kwa פלט.
theological_decisions:
- issue: Rejeo na namna ya kumsemesha Mungu katika kishiriki kinachofungua mstari
  choice: 'Mungu anasemeshwa moja kwa moja: ‘Wewe unayeninusuru ... unaniinua ... unaniokoa.’'
  alternative: Kishiriki cha kwanza kinaweza kufanywa kuwa kishazi tegemezi kinachounganishwa na mstari uliotangulia.
  rationale: Kiebrania kinaweza kusonga kwa kawaida kutoka katika kishiriki kinachomtaja Mungu kwa sifa hadi vitenzi vya nafsi ya pili. Kudumisha usemi wa moja kwa moja kunahifadhi muundo wa kishairi bila kulazimisha uhusiano mwingine wa kisintaksia.
- issue: Uwakilishi wa אִישׁ katika Kiswahili
  choice: mtu
  alternative: mwanamume
  rationale: Ingawa אִישׁ ni umoja wa kiume kisarufi, katika muktadha huu inamtaja mtenda-jeuri mmoja. ‘Mtu’ ni tafsiri ya kawaida ya Kiswahili na haibadili umoja; ‘mwanamume’ ingeweka mkazo wa jinsia ambao si lazima katika kauli hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Marudio ya ‘unaniinua/wanaoniinukia’ yamehifadhiwa kwa sababu yanaakisi mchezo wa picha ya kwenda juu katika mstari. Alama zote za tanbihi zimewekwa mara moja katika sehemu zinazohusika.
