base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/032.yaml
  text: The God who girds me with strength and makes my way blameless[a][b].
translation:
  language: sw
  text: Mungu ndiye anayenifunga mshipi wa nguvu kiunoni[a] na kuifanya njia yangu iwe kamilifu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ananipa uwezo” au “ananitia ushujaa.” Kiebrania kinatumia picha ya kufungwa mshipi wa nguvu kiunoni, yaani kuandaliwa kwa tendo.
    reason: lexical_alternative
  - marker: b
    text: Au, “iwe timilifu” au “isiwe na lawama.” Neno la Kiebrania linaweza kumaanisha ukamilifu, utimilifu, uadilifu, au kutokuwa na lawama.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Mungu ndiye
  rationale: Muundo huu unahifadhi msisitizo wa kifungu cha Kiebrania chenye kibainishi, huku ukisomeka kwa kawaida katika Kiswahili.
- source_word: הַמְאַזְּרֵנִי
  choice: anayenifunga ... kiunoni
  rationale: Kitenzi אזר kina picha halisi ya kujifunga mshipi kiunoni ili kujiandaa kwa tendo; tafsiri hii inadumisha sitiari hiyo ya maandalizi na uwezeshaji.
- source_word: חָיִל
  choice: nguvu
  rationale: חיל hapa inaweza kumaanisha nguvu, uwezo, au ushujaa; “nguvu” ni pana, ya kawaida, na inafaa katika muktadha wa Mungu kumwezesha mwimbaji.
- source_word: וַיִּתֵּן
  choice: na kuifanya
  rationale: Ingawa נתן kwa kawaida ni “kutoa,” katika muundo huu inaonyesha matokeo—kuifanya njia iwe na sifa inayotajwa.
- source_word: תָּמִים
  choice: kamilifu
  rationale: תמים huonyesha ukamilifu, utimilifu, uadilifu, au kutokuwa na lawama. “Kamilifu” huhifadhi upana na mvutano wa neno, huku tanbihi ikibainisha maana mbadala.
- source_word: דַּרְכִּי
  choice: njia yangu
  rationale: “Njia” inadumisha sitiari ya דרך, inayoweza kurejelea mwendo, mwenendo, au maisha ya mtu.
theological_decisions:
- issue: Maana ya תמים kuhusu njia ya mwimbaji
  choice: kamilifu
  alternative: isiyo na lawama / timilifu
  rationale: Tafsiri haipaswi kuamua kimya kimya kwamba mstari unadai kutokuwa na dhambi kabisa. “Kamilifu” huhifadhi wazo la ukamilifu au utimilifu, na tanbihi inaonyesha uwezekano wa maana ya uadilifu au kutokuwa na lawama.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sitiari ya kujifunga kiunoni imehifadhiwa kwa uwazi, na maana mbalimbali za תמים zimeachwa wazi katika tanbihi.
