  text: אֶ֭מְחָצֵ/ם וְ/לֹא יֻ֣כְלוּ ק֑וּם יִ֝פְּל֗וּ תַּ֣חַת רַגְלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/038.yaml
  text: I crush them[a], and they cannot rise[b]; they fall beneath my feet.
translation:
  language: sw
  text: Ninawaponda[a], nao hawawezi kuinuka[b]; wanaanguka chini ya miguu yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ninawavunja vipande-vipande” / “ninawaangusha kwa mapigo”; kitenzi cha Kiebrania kinaonyesha kuponda kwa nguvu vitani.
    reason: lexical_alternative
  - marker: b
    text: Au “hawawezi kusimama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶמְחָצֵם
  choice: Ninawaponda
  rationale: Kitenzi מחץ kinaonyesha kuponda au kuvunja kwa nguvu katika mapigano. “Ninawaponda” ni Kiswahili cha kawaida chenye nguvu na kinadumisha taswira ya vita.
- source_word: וְלֹא
  choice: nao hawawezi
  rationale: Kiunganishi pamoja na ukanushi kimewasilishwa kwa “nao” na ukanushi ulio katika “hawawezi,” kwa mtiririko wa kawaida wa Kiswahili.
- source_word: יֻכְלוּ
  choice: hawawezi
  rationale: Kitenzi יכל kinaonyesha uwezo; “hawawezi” ni tafsiri fupi na ya moja kwa moja.
- source_word: קוּם
  choice: kuinuka
  rationale: Baada ya kuangushwa au kupondwa, קום hapa kwa kawaida humaanisha kuinuka tena. “Kusimama” pia linawezekana, hivyo limehifadhiwa katika tanbihi.
- source_word: יִפְּלוּ
  choice: wanaanguka
  rationale: Kitenzi נפל humaanisha kuanguka. Wakati wa sasa wa kishairi unalingana na mfuatano wa matendo katika mstari.
- source_word: תַּחַת רַגְלָי
  choice: chini ya miguu yangu
  rationale: Hii inadumisha wazi taswira ya mahali na ya kushindwa kabisa, huku ikiwa usemi wa asili katika Kiswahili.
theological_decisions:
- issue: Taswira kali ya vita katika zaburi ya kifalme
  choice: Kudumisha lugha ya nafsi ya kwanza ya kuponda katika mapigano bila kuipunguza makali
  alternative: Kutumia lugha laini kama “ninawashinda” au “ninawaangamiza”
  rationale: Kiebrania kinatumia wazi kitenzi cha kuponda pamoja na taswira ya kuanguka chini ya miguu. Tafsiri haipaswi kuficha ukali wa lugha ya chanzo wala kutatua mvutano wake wa kiteolojia kwa kuilegeza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo ni wazi kwa msomaji wa kawaida; “nao” huunganisha vipashio kwa mtiririko wa zaburi, na taswira kali ya vita imehifadhiwa.
