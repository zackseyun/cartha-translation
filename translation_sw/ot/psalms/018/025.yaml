  yaml_path: translation/ot/psalms/018/025.yaml
  text: With the faithful you show yourself faithful[a]; with the blameless man you show yourself blameless.
translation:
  language: sw
  text: Kwa mwaminifu unajionyesha mwaminifu[a]; kwa mtu asiye na lawama unajionyesha kuwa huna lawama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa mshikamanifu unajionyesha mshikamanifu,” au “Kwa mtu mcha Mungu unajionyesha mwaminifu.” Kiebrania kimetumia maneno yenye mzizi mmoja (חסד), kikisisitiza ushikamanifu katika uhusiano wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָסִיד
  choice: mwaminifu
  rationale: Neno hili humaanisha mtu mwenye uaminifu na ushikamanifu katika uhusiano wa agano. “Mwaminifu” ni la kawaida na linaweza kurudiwa pamoja na kitenzi kinachofuata ili kuhifadhi mchezo wa maneno wa Kiebrania.
- source_word: תִּתְחַסָּד
  choice: unajionyesha mwaminifu
  rationale: Muundo wa hitpaeli una maana ya kujionyesha kuwa na sifa ya חסד kwa חָסִיד. Tafsiri hii huhifadhi ulinganifu na hisia ya mwitikio bila kudokeza kwamba tabia ya Mungu hubadilika.
- source_word: גְּבַר
  choice: mtu
  rationale: Ingawa nomino hii ni ya kiume na wakati mwingine hudokeza nguvu, katika mstari huu hutumika kwa maana ya mtu binafsi; Kiswahili “mtu” ni ya asili na halipotezi jambo muhimu la kimuktadha.
- source_word: תָּמִים
  choice: asiye na lawama
  rationale: Katika muktadha wa maadili neno hili huonyesha ukamilifu wa mwenendo au uadilifu. “Asiye na lawama” ni Kiswahili cha kawaida kinachofaa ulinganifu wa kishairi.
- source_word: תִּתַּמָּם
  choice: unajionyesha bila lawama
  rationale: Kitenzi hiki kinatokana na mzizi uleule wa תָּמִים. “Unajionyesha bila lawama” huhifadhi maana ya kujidhihirisha na mwangwi wa kileksika, huku kikiepuka neno “mkamilifu,” ambalo lingeweza kueleweka kwa maana pana ya kimetafizikia.
theological_decisions:
- issue: Maelezo ya Mungu yanayolingana na tabia ya mwanadamu
  choice: Kutafsiri vitenzi kwa “unajionyesha” ili kueleza Mungu akijidhihirisha kwa uaminifu na bila lawama kwa namna inayolingana na wale wanaotajwa.
  alternative: “Kwa mwenye rehema una rehema” au “kwa asiye na lawama wewe huna lawama.”
  rationale: Miundo ya Kiebrania inaunga mkono maana ya kujionyesha. Hii huhifadhi mvutano wa kishairi wa mwitikio bila kusema kwamba asili ya Mungu hubadilishwa na tabia ya wanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. Marudio ya “mwaminifu” na “lawama” yamehifadhiwa kwa makusudi ili kuakisi ulinganifu na mchezo wa maneno wa Kiebrania.
