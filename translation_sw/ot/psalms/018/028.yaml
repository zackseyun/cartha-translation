lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huonyesha sababu au msingi wa sifa na tumaini katika muktadha, huku ikibaki ya kawaida katika ushairi wa Kiswahili.
- source_word: תָּאִיר
  choice: huiwasha
  rationale: Hifili ya אור ina maana ya kusababisha nuru au kuangaza. Kwa taa, kitenzi cha kawaida na cha asili katika Kiswahili ni ‘kuwasha,’ nacho kinadumisha maana ya kisababishi.
- source_word: נֵרִי
  choice: taa yangu
  rationale: Neno נֵר humaanisha taa; taswira halisi imehifadhiwa badala ya kubadilishwa kuwa dhana ya jumla ya nuru.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili ili kuhifadhi jina binafsi badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Huhifadhi umilikishi wa nafsi ya kwanza na usemi wa uhusiano wa karibu uliomo katika Kiebrania.
- source_word: יַגִּיהַּ
  choice: huangaza
  rationale: Kitenzi hiki cha kisababishi hutoa wazo la kufanya kitu kiwe angavu au kukipa nuru. ‘Huangaza’ ni fasaha, wazi, na kinadumisha ulinganifu na mstari wa kwanza.
- source_word: חָשְׁכִּי
  choice: giza langu
  rationale: Nomino yenye kiambishi cha nafsi ya kwanza imetafsiriwa moja kwa moja, hivyo sitiari na upana wake wa maana—taabu, hatari, au huzuni—havijabanwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu moja kwa moja. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Maana ya ‘giza langu’
  choice: Kudumisha sitiari ‘giza langu’
  alternative: taabu yangu; huzuni yangu; hatari inayonikabili
  rationale: Kiebrania hakifafanui kama giza ni taabu ya nje, hatari, au huzuni ya ndani. Tafsiri inadumisha utata huo wa kishairi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mistari miwili na taswira za ‘taa’ na ‘giza’ zimehifadhiwa; vitenzi ‘huiwasha’ na ‘huangaza’ ni vya kawaida na vinaeleweka kwa urahisi.
