base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/017.yaml
  text: He delivered me from my strong enemy[a], and from those who hated me[b], for they were too mighty for me.
translation:
  language: sw
  text: Aliniokoa kutoka kwa adui yangu mwenye nguvu,[a] na kutoka kwa wale walionichukia,[b] kwa maana walikuwa na nguvu kunishinda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ananiokoa kutoka kwa adui yangu mwenye nguvu,” ikiwa kitenzi cha kishairi kitasomwa kama cha wakati wa sasa.
    reason: lexical_alternative
  - marker: b
    text: Katika Kiebrania, “adui yangu” ni umoja; kishazi kinachofuata ni wingi, “wale walionichukia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַצִּילֵנִי
  choice: Aliniokoa
  rationale: Kitenzi נצל katika Hifili humaanisha ‘kuokoa’ au ‘kukomboa kutoka hatarini.’ Wakati uliopita unafaa muktadha wa zaburi unaosimulia tendo la Mungu la wokovu.
- source_word: מֵאֹיְבִי עָז
  choice: kutoka kwa adui yangu mwenye nguvu
  rationale: Nomino אֹיֵב iko katika umoja ikiwa na kiambishi cha nafsi ya kwanza umoja, na עָז inaeleza nguvu za adui huyo. Tafsiri inadumisha umoja wa Kiebrania.
- source_word: וּמִשֹּׂנְאַי
  choice: na kutoka kwa wale walionichukia
  rationale: Hii ni partisipo ya wingi kutoka שׂנא ikiwa na kiambishi cha nafsi ya kwanza umoja. Kishazi hiki ni cha asili katika Kiswahili na kinahifadhi wingi wa Kiebrania.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinaanzisha sababu ya kuokolewa na kinafaa mtindo wa kishairi wenye hadhi.
- source_word: אָמְצוּ מִמֶּנִּי
  choice: walikuwa na nguvu kunishinda
  rationale: Kitenzi אָמְצוּ pamoja na מן ya ulinganisho kinaonyesha kuwa nguvu zao zilizidi za msemaji. Usemi huu ni wa kawaida katika Kiswahili na unaonyesha ubora huo wa nguvu bila kudai kwamba walimshinda kwa hakika.
theological_decisions:
- issue: Wakati/aspekti ya kitenzi cha mwanzo katika ushairi wa Kiebrania
  choice: 'Tendo la wakati uliopita: “Aliniokoa”'
  alternative: 'Wakati wa sasa wa kishairi: “Ananiokoa”'
  rationale: Sehemu hii ya zaburi inasimulia matendo ya Mungu ya zamani katika kumwokoa mtunga-zaburi. Wakati uliopita unadumisha mtiririko huo, huku tanbihi ikihifadhi uwezekano wa usomaji wa sasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kishairi lakini unaeleweka kwa wasomaji wa kawaida; unadumisha tofauti ya umoja na wingi katika maandishi ya Kiebrania.
