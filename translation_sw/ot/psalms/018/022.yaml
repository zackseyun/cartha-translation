translation:
  language: sw
  text: Kwa maana hukumu zake zote zilikuwa mbele yangu, wala sikuondoa amri zake kutoka kwangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala sikujiepusha na amri zake.” Kitenzi cha Kiebrania kinaweza kueleweka ama kuwa kuondoa amri kutoka kwa mtu mwenyewe, ama kujiepusha nazo; matini kuu inadumisha maana elekezi zaidi ya umbo la Hifili, pamoja na maneno “kutoka kwangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huonyesha sababu ya kauli iliyotangulia na kudumisha nguvu ya ufafanuzi ya kiunganishi cha Kiebrania.
- source_word: כָל
  choice: zote
  rationale: Hudumisha maana jumuishi ya neno la Kiebrania na kupatana kisarufi na “hukumu zake.”
- source_word: מִשְׁפָּטָיו
  choice: hukumu zake
  rationale: “Hukumu” hudumisha maana ya maamuzi au maagizo yenye mamlaka katika muktadha wa sheria ya agano.
- source_word: לְנֶגְדִּי
  choice: mbele yangu
  rationale: Ni tafsiri ya kawaida inayodumisha picha ya kuyaweka daima katika mtazamo na kuyazingatia.
- source_word: וְחֻקֹּתָיו
  choice: wala ... masharti yake
  rationale: “Masharti” hapa humaanisha maagizo yaliyowekwa kwa uthabiti; “wala” huunganisha kwa kawaida na ukanushi unaofuata.
- source_word: לֹא אָסִיר
  choice: sikuondoa
  rationale: Hifili ya סור ina maana ya kisababishi au elekezi, “kuondoa”; tafsiri hii inadumisha muundo ambapo masharti ndiyo yanayoondolewa.
- source_word: מֶנִּי
  choice: kutoka kwangu
  rationale: Hudumisha wazi kirai cha Kiebrania na kuunga mkono maana elekezi ya “kuondoa ... kutoka kwangu.”
