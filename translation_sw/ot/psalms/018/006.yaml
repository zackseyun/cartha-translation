base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/006.yaml
  text: In my distress I call on Yahweh[a], and to my God I cry for help. He hears my voice from his temple[b], and my cry before him comes into his ears.
translation:
  language: sw
  text: Katika dhiki yangu ninamwita Yahweh, na ninamlilia Mungu wangu anisaidie. Anaisikia sauti yangu kutoka hekaluni mwake[a], na kilio changu mbele zake kinafika masikioni mwake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hekalu” linaweza pia kutafsiriwa “jumba la kifalme” au “mahali patakatifu”; neno la Kiebrania linaweza kumaanisha makao ya mfalme au ya Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au, “Atasikia sauti yangu kutoka hekaluni mwake ... na kilio changu mbele zake kitafika masikioni mwake.” Vitenzi vya Kiebrania vinaweza kueleweka kuwa vya wakati ujao.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּצַּר לִי
  choice: Katika dhiki yangu
  rationale: Muundo huu unaeleza hali ya shida au taabu inayompata mwombaji; Kiswahili hiki ni cha kawaida na kinahifadhi maana ya kibinafsi ya לִי.
- source_word: אֶקְרָא יְהוָה
  choice: ninamwita Yahwe
  rationale: קרא pamoja na jina la Mungu humaanisha kumwita au kumwomba; “ninamwita” ni ya asili katika Kiswahili na Yahwe huhifadhi jina la pekee la Mungu.
- source_word: וְאֶל אֱלֹהַי אֲשַׁוֵּעַ
  choice: na ninamlilia Mungu wangu anisaidie
  rationale: שׁוע katika kauli hii ni kilio cha kuomba msaada; tafsiri inaweka wazi kusudi la kilio bila kupanua maana isivyofaa.
- source_word: יִשְׁמַע
  choice: Anaisikia
  rationale: Imperfecti ya Kiebrania inaweza kuwa ya sasa, ya kawaida, au ya wakati ujao. Wakati wa sasa wenye uhai unafaa katika ushuhuda huu wa kishairi, huku tanbihi ikihifadhi uwezekano wa wakati ujao.
- source_word: מֵהֵיכָלוֹ
  choice: kutoka hekaluni mwake
  rationale: הֵיכָל inaweza kumaanisha hekalu, jumba la kifalme, au mahali patakatifu. “Hekalu” ni tafsiri wazi katika muktadha wa makao ya Mungu, na tanbihi inaonyesha upana wa neno.
- source_word: קוֹלִי
  choice: sauti yangu
  rationale: קוֹל hapa ni sauti ya mwombaji; tafsiri hii ni ya moja kwa moja na ya asili.
- source_word: וְשַׁוְעָתִי לְפָנָיו
  choice: na kilio changu mbele zake
  rationale: שַׁוְעָה ni kilio cha kuomba msaada, na לְפָנָיו hudumisha taswira ya kilio kuwa katika uwepo wa Mungu.
- source_word: תָּבוֹא בְאָזְנָיו
  choice: kinafika masikioni mwake
  rationale: Tafsiri hii inahifadhi mwendo wa kitenzi “kuja/kufika” na taswira ya kibinadamu ya kilio kuingia masikioni mwa Mungu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Nguvu ya wakati katika יִשְׁמַע na תָּבוֹא
  choice: 'Wakati wa sasa: “Anaisikia ... kinafika”'
  alternative: 'Wakati ujao: “Ata(isikia) ... kitafika”'
  rationale: Imperfecti hizi katika ushairi zinaweza kueleweka kama tendo la sasa lenye uhai au kama ahadi ya wakati ujao. Maandishi makuu yanatumia sasa, na tanbihi inahifadhi uwezekano halisi wa wakati ujao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Marudio ya “sauti yangu/kilio changu” na taswira ya “masikioni mwake” yamehifadhiwa. Alama za tanbihi zimewekwa karibu na vipengele vinavyohusika.
