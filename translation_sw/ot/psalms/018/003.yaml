  text: מְ֭הֻלָּל אֶקְרָ֣א יְהוָ֑ה וּ/מִן אֹ֝יְבַ֗/י אִוָּשֵֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/003.yaml
  text: I call on Yahweh[a], who is worthy to be praised[b], and I am saved from my enemies.
translation:
  language: sw
  text: 'Ninamwita Yahwe[a], anayestahili kusifiwa,

    nami huokolewa kutoka kwa adui zangu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina “Yahwe” linawakilisha jina la Mungu YHWH katika Kiebrania.
    reason: alternative_reading
  - marker: b
    text: Au, “nitaokolewa kutoka kwa adui zangu.” Kitenzi cha Kiebrania kinaweza pia kueleweka kuwa na maana ya wakati ujao.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהֻלָּל
  choice: anayestahili kusifiwa
  rationale: Kitenzi-jina tendwa kutoka הלל kinamtaja Yahwe kuwa mwenye kustahili sifa. Kauli hii ni ya kawaida na yenye hadhi katika Kiswahili, huku ikihifadhi nguvu ya tathmini ya Kiebrania.
- source_word: אֶקְרָא
  choice: ninamwita
  rationale: קרא pamoja na jina la Mungu humaanisha kumwita au kumlilia Mungu. “Ninamwita” hukaa karibu na muundo wa Kiebrania bila kuongeza wazi wazo la maombi ambalo halikutajwa moja kwa moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kuwa “Yahwe,” badala ya kubadilishwa kwa cheo kama “BWANA.”
- source_word: וּמִן
  choice: nami ... kutoka kwa
  rationale: Muunganiko wa וּ na kihusishi מִן unaunganisha kumwita Yahwe na kuokolewa kutoka kwa adui, bila kulazimisha uhusiano wa sababu ulio wazi zaidi kuliko Kiebrania.
- source_word: אֹיְבַי
  choice: adui zangu
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya אויב pamoja na kiambishi cha nafsi ya kwanza umoja.
- source_word: אִוָּשֵׁעַ
  choice: huokolewa
  rationale: Nifali isiyotimilifu ya ישׁע inaweza kueleza jambo la kawaida au linalotarajiwa katika ungamo hili la kishairi. “Huokolewa” linaonyesha matokeo ya kawaida kwa Kiswahili, huku tanbihi ikihifadhi uwezekano wa maana ya wakati ujao.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Matini ya Kiebrania inatumia moja kwa moja Tetragramatoni יהוה. Kutumia “Yahwe” huhifadhi jina binafsi la Mungu badala ya kulibadilisha kwa cheo.
- issue: Hali ya wakati ya אִוָּשֵׁעַ
  choice: 'maana ya kawaida/ya jumla: “huokolewa”'
  alternative: 'maana ya wakati ujao: “nitaokolewa”'
  rationale: Kitenzi cha Kiebrania kisichotimilifu kinaweza kueleweka kama ungamo la jumla au kama tumaini la wakati ujao. Matini kuu inatumia maana ya kawaida, na tanbihi inahifadhi uwezekano wa wakati ujao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi, wa sasa na wenye hadhi. Mpangilio wa sentensi umefanywa wa kawaida kwa Kiswahili, huku maana na mvutano wa hali ya wakati katika Kiebrania vikihifadhiwa kwa tanbihi.
