base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/007.yaml
  text: Then the earth reeled and quaked[a], and the foundations of the mountains trembled and reeled, because he was angry.
translation:
  language: sw
  text: Ndipo dunia ikayumba na kutetemeka, na misingi ya milima ikatetemeka na kuyumba, kwa sababu alikuwa amekasirika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya asili, “kwa sababu hasira yake iliwaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגְעַשׁ
  choice: ikayumba
  rationale: Kitenzi געשׁ kinaonyesha mtikisiko mkali wenye msukosuko. ‘Ikayumba’ hudumisha taswira hai na kukitofautisha na kitenzi kinachofuata.
- source_word: וַתִּרְעַשׁ
  choice: na kutetemeka
  rationale: רעשׁ hutumiwa kwa kutetemeka au kutikisika kama wakati wa tetemeko la ardhi. ‘Kutetemeka’ ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: Katika muktadha huu wa ufunuo wa Mungu unaotikisa viumbe, ‘dunia’ inafaa zaidi kuliko ‘nchi,’ ambayo ingeweza kueleweka kuwa eneo fulani tu.
- source_word: מוֹסְדֵי הָרִים
  choice: misingi ya milima
  rationale: Tafsiri hii inadumisha taswira ya kishairi ya milima ikiwa na misingi au nguzo za chini.
- source_word: יִרְגָּזוּ
  choice: ikitetemeka
  rationale: רגז hapa huonyesha kutetemeka kwa hofu au msukosuko. Umoja wa kisarufi ‘ikitetemeka’ unapatana na ngeli ya Kiswahili ya ‘misingi.’
- source_word: וַיִּתְגָּעֲשׁוּ
  choice: na kuyumba
  rationale: Umbo hili la געשׁ linarudia na kuimarisha mwendo wa mstari wa kwanza. Kurudia ‘kuyumba’ kunahifadhi mshikamano wa kishairi wa Kiebrania.
- source_word: כִּי חָרָה לוֹ
  choice: kwa sababu alikuwa amekasirika
  rationale: Huu ni usemi wa Kiebrania unaomaanisha hasira kuwaka. Tafsiri kuu inatoa maana yake kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi taswira halisi ya moto.
theological_decisions:
- issue: Maelezo ya hasira ya Mungu kwa lugha ya kibinadamu
  choice: kwa sababu alikuwa amekasirika
  alternative: kwa sababu hasira yake iliwaka
  rationale: Tafsiri hii inathibitisha hasira halisi ya Mungu bila kufanya usemi wa Kiebrania usikike usio wa kawaida katika Kiswahili; tafsiri ya karibu zaidi na maneno ya asili imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi na chenye heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio na urudiaji wa vitenzi unadumisha mwendo wa kishairi wa Kiebrania.
