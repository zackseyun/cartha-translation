  text: אֶרְדּ֣וֹף א֭וֹיְבַ/י וְ/אַשִּׂיגֵ֑/ם וְ/לֹֽא אָ֝שׁוּב עַד כַּלּוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/037.yaml
  text: I pursued my enemies and overtook them[a], and I did not turn back until they were consumed.
translation:
  language: sw
  text: Niliwafuatilia adui zangu na kuwafikia; sikurudi nyuma mpaka walipokwisha kabisa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya asili, “mpaka kuangamia kwao kulipokamilika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרְדּוֹף
  choice: Niliwafuatilia
  rationale: Kitenzi cha Kiebrania רדף kinaonyesha kuwafuata maadui kwa nia ya kuwakamata au kuwashinda. Wakati uliopita unafaa muktadha wa kishairi unaosimulia ushindi uliopatikana.
- source_word: אֹיְבַי
  choice: adui zangu
  rationale: Hii ni tafsiri ya kawaida, wazi na ya moja kwa moja ya nomino yenye kiambishi cha nafsi ya kwanza umoja.
- source_word: וְאַשִּׂיגֵם
  choice: na kuwafikia
  rationale: נשׂג katika kausativi hapa humaanisha kuwafikia au kuwapata wale wanaofuatiliwa. 'Kuwafikia' ni ya asili katika Kiswahili na haiongezi wazo la kuwakamata ambalo halijaelezwa moja kwa moja.
- source_word: וְלֹא אָשׁוּב
  choice: sikurudi nyuma
  rationale: Katika muktadha huu שוב huonyesha kutogeuka au kutokomesha ufuatiliaji. 'Sikurudi nyuma' huwasilisha azimio hilo kwa lugha ya kawaida.
- source_word: עַד
  choice: mpaka
  rationale: Neno hili linaonyesha kikomo cha wakati cha tendo.
- source_word: כַּלּוֹתָם
  choice: walipokwisha kabisa
  rationale: Muundo huu una maana ya kufikia mwisho, kumalizika au kuangamia kabisa. Tafsiri hii hudumisha ukamilifu wa kushindwa kwao bila kumtaja wazi mtendaji ambaye Kiebrania hakumtaji.
theological_decisions:
- issue: Vurugu na mtendaji asiyeelezwa katika kishazi cha mwisho
  choice: walipokwisha kabisa
  alternative: mpaka nilipokuwa nimewaangamiza kabisa
  rationale: Zaburi inasherehekea ushindi wa kijeshi uliowezeshwa na Mungu, hivyo ukali wa kushindwa kwa maadui haupaswi kupunguzwa. Hata hivyo, infinitivi ya Kiebrania haimtaji wazi mtendaji; kwa hiyo tafsiri haiongezi dai kwamba msemaji ndiye aliyewaangamiza moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Nukta mkato hutenganisha kwa uwazi ufuatiliaji na azimio la kutorudi nyuma.
