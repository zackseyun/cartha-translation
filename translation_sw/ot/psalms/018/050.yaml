  text: מגדל יְשׁוּע֪וֹת מַ֫לְכּ֥/וֹ וְ/עֹ֤שֶׂה חֶ֨סֶד לִ/מְשִׁיח֗/וֹ לְ/דָוִ֥ד וּ/לְ/זַרְע֗/וֹ עַד עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/050.yaml
  text: He gives great victories to his king and shows steadfast love to his anointed[c][b][a], to David and to his offspring forever.
translation:
  language: sw
  text: 'Humletea mfalme wake mashindi makuu[a],

    na humwonyesha mtiwa-mafuta wake[b] upendo thabiti—

    kwa Daudi na uzao wake[c] milele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Yeye ni mnara wa wokovu kwa mfalme wake.” Umbo la Kiebrania mwanzoni mwa mstari lina ugumu wa kimatini na kisintaksia; 2 Samweli 22:51 ina usomaji unaokaribiana: “Huyafanya makuu matendo ya wokovu ya mfalme wake.”'
    reason: textual_variant
  - marker: b
    text: “Mtiwa-mafuta wake” pia inaweza kutafsiriwa “Masihi wake.” Hapa inamrejelea moja kwa moja Daudi, mfalme aliyetiwa mafuta, huku ikibeba pia mwangwi mpana wa Kimasihi.
    reason: alternative_reading
  - marker: c
    text: “Uzao” ni nomino ya umoja yenye maana ya kundi; inaweza kurejelea nasaba yote ya Daudi na, katika muktadha mpana wa Maandiko, pia kuruhusu usomaji wa Kimasihi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מגדל
  choice: Humpa ... mkuu
  rationale: Umbo la Kiebrania hapa lina ugumu wa kimatini na kisintaksia. Kwa kuzingatia kifungu sambamba katika 2 Samweli 22:51, maana inayowasilishwa ni kwamba Mungu humfanyia mfalme wake wokovu au ushindi kuwa mkuu; Kiswahili hiki ni cha asili bila kulazimisha taswira ya mnara.
- source_word: יְשׁוּעוֹת
  choice: ushindi
  rationale: Wingi huu unaweza kumaanisha matendo ya kuokoa au ukombozi. Katika muktadha wa kifalme na vita, “ushindi” huwasilisha kwa kawaida matokeo ya matendo hayo ya kuokoa.
- source_word: מַלְכּוֹ
  choice: mfalme wake
  rationale: Huhifadhi uhusiano wa moja kwa moja wa kimilikishi katika Kiebrania.
- source_word: וְעֹשֶׂה חֶסֶד
  choice: na kumwonyesha ... upendo thabiti
  rationale: חֶסֶד hubeba maana ya upendo mwaminifu na uaminifu wa agano. “Upendo thabiti” ni wazi na wenye uzito kuliko “fadhili” pekee.
- source_word: לִמְשִׁיחוֹ
  choice: mtiwa-mafuta wake
  rationale: Rejeo la karibu ni Daudi, mfalme aliyetiwa mafuta. Tafsiri hii pia haifuti mwangwi mpana wa Kimasihi.
- source_word: לְדָוִד
  choice: Daudi
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: וּלְזַרְעוֹ
  choice: uzao wake
  rationale: “Uzao” huhifadhi umoja wenye maana ya kundi katika זֶרַע, bila kuamua kimya-kimya ikiwa ni nasaba nzima au mzao mmoja wa Kimasihi.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Ni tafsiri fupi na ya kawaida ya muda usio na mwisho katika muktadha huu.
theological_decisions:
- issue: Mwangwi wa Kimasihi wa מְשִׁיחוֹ katika zaburi ya kifalme ya Daudi
  choice: mtiwa-mafuta wake
  alternative: Masihi wake
  rationale: Daudi ndiye anayerejelewa moja kwa moja, hivyo “mtiwa-mafuta” inafaa katika muktadha wa karibu. Hata hivyo, tanbihi huhifadhi uwezekano wa kuitafsiri kwa cheo “Masihi” na mwangwi wake mpana.
- issue: Upeo wa זַרְעוֹ
  choice: uzao wake
  alternative: wazao wake
  rationale: Umoja wa Kiebrania unaweza kuonyesha nasaba kwa ujumla huku ukiacha wazi pia usomaji unaomlenga mzao mmoja; “uzao” huhifadhi mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishairi umehifadhi usambamba wa mistari. “Mtiwa-mafuta” na “uzao” ni maneno yanayoeleweka na yanayohifadhi utata wa kiteolojia wa Kiebrania; alama zote za tanbihi zimewekwa katika matini kuu.
