  text: He sent out his arrows and scattered them[a]; he multiplied lightning bolts and threw them into confusion.
translation:
  language: sw
  text: Alituma mishale yake, akawatawanya[a]; alizidisha radi, akawavuruga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Alituma mishale yake na kuitawanya; kwa radi nyingi akawavuruga.” Neno la Kiebrania lililotafsiriwa “alizidisha” linaweza pia kueleweka kama “nyingi” au “kwa wingi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Alipeleka
  rationale: Kitenzi שׁלח kina maana ya kupeleka au kutuma. Katika taswira ya mpiganaji wa kimungu, “alipeleka” kinaonyesha mishale ikirushwa bila kuongeza wazo lisilo wazi katika Kiebrania.
- source_word: חִצָּיו
  choice: mishale yake
  rationale: חֵץ ni “mshale”; umbo la wingi lenye kiambishi cha nafsi ya tatu umoja wa kiume ni “mishale yake.”
- source_word: וַיְפִיצֵם
  choice: na kuwatawanya
  rationale: Kitenzi hiki humaanisha kutawanya au kusambaratisha. Kiambishi cha wingi kinaeleweka zaidi kuwa kinawarejelea maadui wanaodokezwa na muktadha.
- source_word: וּבְרָקִים
  choice: kwa radi
  rationale: בְּרָקִים ni wingi wa “radi/umeme.” Katika Kiswahili cha kawaida, “radi” ni neno la asili na lenye uzito wa kishairi kwa mwanga wa dhoruba unaotumiwa hapa kama silaha.
- source_word: רָב
  choice: nyingi
  rationale: רָב inaweza kueleweka kama “nyingi,” “kwa wingi,” au kwa matumizi ya kikitenzi kama “alizidisha.” “Kwa radi nyingi” ni tafsiri ya kawaida ya Kiswahili inayohifadhi maana ya wingi bila kulazimisha uchanganuzi wa kikitenzi usio na hakika.
- source_word: וַיְהֻמֵּם
  choice: akawavuruga
  rationale: המם humaanisha kuwatia watu katika vurugu, taharuki, au mkanganyiko, hasa vitani. “Akawavuruga” ni ya kawaida na huhifadhi maana hiyo bila kudai kwamba waliangamizwa kabisa.
theological_decisions:
- issue: Kirejelewa cha viambishi vya wingi katika “kuwatawanya” na “akawavuruga”
  choice: Vinawarejelea maadui wa Daudi wanaoeleweka kutokana na muktadha mpana.
  alternative: Vinaweza kuchukuliwa kuwa vinarejelea mishale au radi zilizotawanywa.
  rationale: Katika taswira ya YHWH kama mpiganaji, mishale na radi ni njia anazotumia kuwatawanya na kuwavuruga maadui. Hii inafaa zaidi semantiki ya המם na muktadha wa vita.
- issue: Uchanganuzi wa רָב
  choice: 'Imefasiriwa kivumishi/kielezi: “kwa radi nyingi.”'
  alternative: 'Inaweza kufasiriwa kikitenzi: “alizidisha radi.”'
  rationale: Umbo hilo lina utata wa kweli. Tafsiri ya “nyingi” inaendana kwa urahisi na בְרָקִים na ni ya asili katika Kiswahili; tanbihi inahifadhi uwezekano wa tafsiri ya kikitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi usambamba wa kishairi na mwendo wa simulizi wa vitenzi vya Kiebrania.
