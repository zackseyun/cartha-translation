  text: Unapanua hatua zangu chini yangu[a], wala vifundo vya miguu yangu havijateleza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Unaifanya hatua yangu kuwa pana chini yangu.” Nahau ya Kiebrania inaonyesha kwamba Mungu anampa mtunga zaburi nafasi ya kutosha na mahali salama pa kukanyaga.
