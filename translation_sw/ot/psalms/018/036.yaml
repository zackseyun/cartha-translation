lexical_decisions:
- source_word: תַּרְחִיב
  choice: Unazipanua
  rationale: Kauli ya kusababisha ya mzizi רחב ina maana ya kufanya kuwa pana. Wakati wa sasa unaendana na usemi wa kishairi wa kumwelekea Mungu moja kwa moja.
- source_word: צַעֲדִי
  choice: hatua zangu
  rationale: Nomino צעד humaanisha hatua au mwendo wa hatua. Ingawa umbo la Kiebrania ni la umoja, wingi ni wa asili zaidi katika Kiswahili na huhifadhi picha ya hatua bila kuibadili kuwa ‘ardhi’.
- source_word: תַחְתָּי
  choice: chini yangu
  rationale: Huhifadhi maana ya mahali ya ‘chini yangu’ na picha ya Mungu kumpa mtunga zaburi nafasi ya kutosha ya kukanyaga.
- source_word: וְלֹא מָעֲדוּ
  choice: wala ... havijateleza
  rationale: Kiunganishi na ukanushi vimetafsiriwa kwa ‘wala’; מעד huonyesha kuteleza au kupoteza uthabiti.
- source_word: קַרְסֻלָּי
  choice: vifundo vya miguu yangu
  rationale: Neno hili hutaja vifundo vya miguu hasa, hivyo tafsiri hii inahifadhi picha dhahiri ya mwili na uthabiti.
