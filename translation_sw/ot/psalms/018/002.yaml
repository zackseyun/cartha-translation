base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/002.yaml
  text: Yahweh is my crag and my fortress and my deliverer[a], my God, my rock, in whom I take refuge, my shield and the horn of my salvation[c][b], my stronghold.
translation:
  language: sw
  text: Yahweh ndiye jabali langu[a], ngome yangu, na mwokozi wangu; Mungu wangu, mwamba wangu, ninapata hifadhi kwake[b]; ngao yangu, pembe ya wokovu wangu[c], na ngome yangu iliyo juu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwamba wangu.” Kiebrania kinatumia hapa maneno mawili yanayohusiana lakini tofauti, סֶלַע na צוּר.
    reason: lexical_alternative
  - marker: b
    text: Au “kwake nakimbilia kupata hifadhi.”
    reason: lexical_alternative
  - marker: c
    text: “Pembe” ni sitiari ya nguvu na uwezo wa kuokoa kwa ushindi.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa moja kwa moja badala ya kubadilishwa na cheo kama “BWANA”.
- source_word: סַלְעִי
  choice: jabali langu
  rationale: “Jabali” linaonyesha mwamba mkubwa au mwamba wa mwinuko na kulitofautisha neno hili na צוּרִי baadaye katika mstari.
- source_word: מְצוּדָתִי
  choice: ngome yangu
  rationale: Neno hili linamaanisha mahali palipoimarishwa kwa ulinzi; “ngome” ni la kawaida na linafaa kwa taswira ya kijeshi.
- source_word: מְפַלְטִי
  choice: mwokozi wangu
  rationale: Umbo la Kiebrania humaanisha mtu anayemwezesha mwingine kuponyoka au anayemwokoa; “mwokozi wangu” ni fupi na asilia.
- source_word: אֵלִי
  choice: Mungu wangu
  rationale: Katika muktadha huu אֵל ni jina la kawaida la Mungu lenye kiambishi cha nafsi ya kwanza.
- source_word: צוּרִי
  choice: mwamba wangu
  rationale: “Mwamba” huhifadhi taswira ya uthabiti na ulinzi huku ukitofautishwa na “jabali” kwa סַלְעִי.
- source_word: אֶחֱסֶה בּוֹ
  choice: ninayemkimbilia kupata hifadhi
  rationale: Kitenzi חסה kinamaanisha kukimbilia au kutafuta hifadhi; usemi huu unahifadhi taswira ya ulinzi kuliko tafsiri ya jumla kama “ninayemtumaini”.
- source_word: מָגִנִּי
  choice: ngao yangu
  rationale: Hii ni taswira ya moja kwa moja ya silaha ya kujikinga.
- source_word: קֶרֶן יִשְׁעִי
  choice: pembe ya wokovu wangu
  rationale: Tafsiri hii inadumisha sitiari ya Kiebrania ya pembe kama nguvu na uwezo wa ushindi unaookoa.
- source_word: מִשְׂגַּבִּי
  choice: kimbilio langu lililo juu
  rationale: Neno hili huelekeza kwenye mahali pa juu pasipofikika kwa urahisi na penye usalama; tafsiri hii pia hailichanganyi na “ngome” iliyotumiwa kwa מְצוּדָתִי.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina lenye herufi nne moja kwa moja; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Kuhifadhi wingi wa sitiari za mwamba na mahali pa usalama
  choice: 'Kutumia maneno tofauti: jabali, ngome, mwamba na kimbilio lililo juu'
  alternative: Kuyasawazisha yote kuwa “mwamba” au “ngome”
  rationale: Kiebrania kinakusanya maneno kadhaa tofauti ya ulinzi. Kuyatofautisha huhifadhi utajiri wa ushairi bila kuongeza fundisho lisilokuwamo.
- issue: Sitiari ya קֶרֶן, “pembe”
  choice: Kuidumisha kama “pembe ya wokovu wangu” na kuifafanua katika tanbihi
  alternative: Kuifafanua moja kwa moja kuwa “nguvu yangu ya ushindi”
  rationale: Sitiari yenyewe ni sehemu ya lugha ya kishairi ya mstari; tanbihi humsaidia msomaji bila kuiondoa katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Msururu wa taswira za ulinzi umehifadhiwa kwa maneno tofauti; “kimbilio langu lililo juu” linaakisi wazo la mahali salama palipoinuka.
