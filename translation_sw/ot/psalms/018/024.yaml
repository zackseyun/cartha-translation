base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/024.yaml
  text: Yahweh repaid me according to my righteousness[b][a], according to the cleanness of my hands before his eyes.
translation:
  language: sw
  text: Yahwe amenilipa[a] kulingana na haki yangu, kulingana na usafi wa mikono yangu[b] mbele ya macho yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “amenirudishia” au “amenipa malipo.” Kitenzi cha Kiebrania kinaweza kumaanisha kumpa mtu malipo yanayolingana na mwenendo wake.
    reason: lexical_alternative
  - marker: b
    text: “Usafi wa mikono yangu” ni nahau ya Kiebrania inayomaanisha mwenendo usio na hatia au ulionyooka.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: amenilipa
  rationale: Hifili ya שוב pamoja na לִי hapa ina maana ya kurudisha kwa mtu au kumlipa sawasawa na mwenendo wake. “Amenilipa” ni Kiswahili cha kawaida kinachohifadhi wazo la malipo yanayolingana na matendo bila kulazimisha maana ya thawabu pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: כְצִדְקִי
  choice: kulingana na haki yangu
  rationale: כְּ inaonyesha kipimo au ulinganifu, na צִדְקִי hapa ni haki au unyoofu wa mwimbaji. Tafsiri hii inadumisha dai la moja kwa moja la Kiebrania bila kulilegeza.
- source_word: כְּבֹר יָדַי
  choice: kulingana na usafi wa mikono yangu
  rationale: בֹּר ni usafi au kutokuwa na uchafu, huku “mikono” ikitumika kiistiari kwa matendo na mwenendo. Muundo huu unahifadhi picha halisi ya Kiebrania.
- source_word: לְנֶגֶד עֵינָיו
  choice: mbele ya macho yake
  rationale: Hii inahifadhi usemi halisi wenye maana ya kuwa mbele ya macho au katika tathmini yake, pamoja na taswira ya Kiebrania inayomwelezea Mungu kwa lugha ya kibinadamu.
theological_decisions:
- issue: Iwapo dai la mwimbaji kuhusu haki yake mbele za Mungu lipunguzwe makali
  choice: Kudumisha kauli ya moja kwa moja kwamba Yahwe alimlipa kulingana na haki yake na usafi wa mikono yake
  alternative: Kutafsiri kwa ufafanuzi kama uaminifu wa agano au kutokuwa na hatia katika jambo fulani, bila kutumia neno “haki”
  rationale: Kiebrania kinasema wazi כְצִדְקִי na כְּבֹר יָדַי. Tafsiri inapaswa kuhifadhi mvutano huo wa kiteolojia badala ya kuutatua au kuupunguza kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Amenilipa” ni cha kawaida na wazi; “usafi wa mikono yangu mbele ya macho yake” huhifadhi taswira ya Kiebrania. Alama za tanbihi zimepangwa kulingana na mahali pa maelezo husika katika tafsiri.
