base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/033.yaml
  text: He makes my feet like the deer’s[b][a], and sets me on my heights.
translation:
  language: sw
  text: Hufanya miguu yangu iwe kama ya kulungu,[a] na hunisimamisha juu ya miinuko yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania hasa hurejelea kulungu wa kike; taswira inaashiria mwendo mwepesi na kukanyaga kwa uthabiti.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁוֶּה
  choice: Hufanya ... kuwa kama
  rationale: Piel ya שׁוה hapa inaonyesha kusababisha mfanano; muundo huu wa Kiswahili huunganisha kitenzi na tashbihi inayofuata kwa kawaida.
- source_word: רַגְלַי
  choice: miguu yangu
  rationale: רֶגֶל humaanisha mguu au miguu, na hapa taswira inahusu mwendo na uwezo wa kukanyaga kwa uthabiti.
- source_word: כָּאַיָּלוֹת
  choice: kama ya paa
  rationale: אַיָּלוֹת ni wingi wa kike na hurejelea paa wa kike. Kiswahili mara nyingi hutumia 'paa' bila kuonyesha jinsia; 'kama ya paa' hukamilisha kwa kawaida wazo la miguu iliyotajwa na kuhifadhi taswira ya mnyama mwenye wepesi na hatua thabiti.
- source_word: וְעַל
  choice: na ... juu ya
  rationale: Huonyesha kiunganishi pamoja na nafasi ya kuwa juu ya kitu.
- source_word: בָּמוֹתַי
  choice: miinuko yangu
  rationale: בָּמוֹתַי ni 'mahali pangu pa juu/miinuko yangu.' 'Miinuko yangu' huhifadhi kiambishi cha nafsi ya kwanza na taswira ya maeneo yaliyoinuka bila kuingiza maana ya mahali pa ibada.
- source_word: יַעֲמִידֵנִי
  choice: kuniweka
  rationale: Hifil ya עמד humaanisha kusababisha mtu asimame au kumweka mahali. 'Kuniweka' ni ya kawaida na haiongezi waziwazi wazo la usalama ambalo halijasemwa moja kwa moja.
theological_decisions:
- issue: Taswira ya wepesi na kusimama juu ya miinuko
  choice: Kuhifadhi taswira halisi ya miguu ya paa na kuwekwa juu ya miinuko, bila kuifafanua kuwa ushindi wa kijeshi au usalama wa kiroho.
  alternative: Kutafsiri kwa ufafanuzi zaidi kuwa Mungu humwezesha mtunga zaburi kukanyaga kwa uthabiti na kusimama salama juu ya vilima.
  rationale: Muktadha mpana una mambo ya vita na ukombozi, lakini mstari wenyewe hutumia taswira ya kishairi. Tafsiri haipaswi kufunga maana hiyo katika matumizi moja tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. 'Miinuko' imetumiwa badala ya 'mahali pa juu' ili kudumisha ufupi na kuepuka dokezo lisilokusudiwa la maeneo ya ibada.
