  text: 'Kwa mtu safi unajionyesha safi,

    na kwa mtu mpotovu unajionyesha mwenye hila[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “unajionyesha umepinda,” au “unamzidi mpotovu kwa ujanja.” Kiebrania kinatumia mchezo wa maneno unaoonyesha mwitikio unaolingana: Mungu humkabili mpotovu kwa namna inayolingana na kuushinda upotovu wake, si kwamba yeye huwa mpotovu kimaadili.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָר
  choice: mtu safi
  rationale: Neno hili linaonyesha usafi wa kimaadili. “Mtu safi” ni Kiswahili cha kawaida na pia huandaa urudiaji wa kishairi katika “unajionyesha safi.”
- source_word: תִּתְבָּרָר
  choice: unajionyesha safi
  rationale: Muundo wa Kiebrania una maana ya kujidhihirisha kuwa safi katika uhusiano na mtu safi; tafsiri hii inadumisha maana hiyo na mchezo wa maneno wa mzizi ברר.
- source_word: עִקֵּשׁ
  choice: mtu mpotovu
  rationale: Kivumishi hiki humaanisha mtu aliyepinda kimaadili. “Mpotovu” ni neno la asili na lenye uzito wa kimaadili bila kulazimisha maana ya kimwili.
- source_word: תִּתְפַּתָּל
  choice: unajionyesha mwenye hila
  rationale: Kitenzi hiki kina picha ya kujipinda au kutenda kwa njia yenye ujanja. “Mwenye hila” kinaeleza kwamba Mungu hukabiliana na mpotovu kwa namna inayozidi na kubatilisha upotovu wake, huku tanbihi ikihifadhi picha kali zaidi ya Kiebrania.
theological_decisions:
- issue: Maelezo ya kibinadamu kuhusu jinsi Mungu anavyomjibu mpotovu
  choice: Kudumisha ulinganifu wa kishairi kwa “unajionyesha mwenye hila,” pamoja na tanbihi ya ufafanuzi.
  alternative: unajionyesha umepinda; unamzidi kwa ujanja
  rationale: Kiebrania kinaonyesha mwitikio unaolingana na tabia ya mtu. Tafsiri haimaanishi kwamba Mungu huwa mpotovu kimaadili; inaonyesha kwamba njia yake ya kumkabili mpotovu huupindua ujanja wa huyo mtu. Tanbihi inahifadhi mvutano na picha ya matini ya asili bila kuingiza fundisho la dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Urudiaji wa “safi ... safi” umehifadhiwa, na mstari wa pili umetafsiriwa kwa lugha inayoeleweka huku tanbihi ikidumisha ukali na utata wa picha ya Kiebrania.
