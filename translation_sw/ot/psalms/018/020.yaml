  yaml_path: translation/ot/psalms/018/020.yaml
  text: Yahweh has dealt with me according to my righteousness[b][a]; according to the cleanness of my hands he has repaid me.
translation:
  language: sw
  text: Yahwe amenitendea kwa kadiri ya uadilifu wangu; kwa kadiri ya usafi wa mikono yangu amenilipa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Usafi wa mikono yangu” ni nahau ya Kiebrania inayomaanisha mwenendo usio na hatia au ulionyooka.
    reason: cultural_note
lexical_decisions:
- source_word: יִגְמְלֵנִי
  choice: amenitendea sawasawa na
  rationale: Kitenzi גמל kinaweza kumaanisha kumtendea mtu kulingana na mwenendo wake. Hapa muktadha unaonyesha malipo mema, lakini ‘amenitendea sawasawa na’ huhifadhi upana wa maana na usambamba wa kishairi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo ‘BWANA.’
- source_word: כְּצִדְקִי
  choice: sawasawa na haki yangu
  rationale: צדק hapa inaeleza uadilifu au mwenendo ulio sawa wa mtunga zaburi; tafsiri hii inadumisha dai la nafsi ya kwanza bila kulilegeza.
- source_word: כְּבֹר יָדַי
  choice: sawasawa na usafi wa mikono yangu
  rationale: Tafsiri ya moja kwa moja inahifadhi taswira ya kishairi ya mikono safi, huku tanbihi ikifafanua kuwa ni nahau ya mwenendo usio na hatia au ulionyooka.
- source_word: יָשִׁיב לִי
  choice: amenilipa
  rationale: Hifili ya שוב katika muundo huu ina maana ya kumrudishia mtu kwa kadiri ya mwenendo wake; ‘amenilipa’ huwasilisha malipo yanayolingana na matendo.
theological_decisions:
- issue: Kauli ‘haki yangu’ inaweza kueleweka kimakosa kuwa dai la kutokuwa na dhambi kabisa au kujiokoa kwa matendo.
  choice: Kudumisha kauli ya nafsi ya kwanza ‘haki yangu’ kama ilivyo katika Kiebrania.
  alternative: kutokuwa kwangu na hatia; dai langu la haki
  rationale: Andiko lenyewe linadai uadilifu wa mtunga zaburi katika muktadha huu. Tafsiri haipaswi kuondoa mvutano wa kiteolojia kwa kuifanya kauli kuwa dhaifu au kuifafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa usambamba wa kishairi umehifadhiwa, na ‘sawasawa na’ linaonyesha uwiano kati ya mwenendo na malipo.
