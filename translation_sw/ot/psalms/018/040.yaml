  text: וְֽ/אֹיְבַ֗/י נָתַ֣תָּה לִּ֣/י עֹ֑רֶף וּ֝/מְשַׂנְאַ֗/י אַצְמִיתֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/040.yaml
  text: You gave me the backs of my enemies[a]; I destroyed those who hated me.
translation:
  language: sw
  text: Uliwafanya adui zangu wanigeuzie visogo[a]; nami nikawaangamiza wale walionichukia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, neno kwa neno, “umenipa kisogo cha adui zangu”; hii ni nahau ya kuwafanya maadui wageuke na kukimbia, au ya kukupa ushindi juu yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  choice: adui zangu
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya nomino אֹיֵב yenye kiambishi cha nafsi ya kwanza umoja.
- source_word: נָתַתָּה לִּי
  choice: umenifanya ... wanigeuzie
  rationale: Ingawa kitenzi נתן kwa kawaida ni ‘kutoa/kupa,’ hapa muundo unaoungana na עֹרֶף ni nahau ya kuwafanya maadui wageuke na kukimbia. Kiswahili cha moja kwa moja ‘umenipa visogo’ kingekuwa kigumu na kisicho wazi, hivyo maana ya kisababishi imeelezwa kwa lugha ya kawaida.
- source_word: עֹרֶף
  choice: visogo vyao
  rationale: עֹרֶף ni shingo ya nyuma au kisogo. ‘Visogo’ huhifadhi picha halisi ya Kiebrania kuliko ‘migongo,’ huku usemi ‘wanigeuzie visogo vyao’ ukionyesha kushindwa na kugeuka ili kukimbia.
- source_word: וּמְשַׂנְאַי
  choice: wale walionichukia
  rationale: Huhifadhi maana ya kishiriki cha mzizi שׂנא na kukitaja kikundi cha watu wenye chuki dhidi ya msemaji.
- source_word: אַצְמִיתֵם
  choice: nikawaangamiza
  rationale: Hifili ya צמת ina maana ya kusababisha waangamie au kuwafutilia mbali. ‘Nikawaangamiza’ ni yenye nguvu inayolingana na muktadha bila kuongeza ufafanuzi usiokuwapo katika Kiebrania.
theological_decisions:
- issue: Picha ya nahau ya עֹרֶף kuhusu kushindwa kwa maadui
  choice: Kuhifadhi picha ya visogo huku muundo ukionyesha kwamba Mungu aliwafanya maadui wageuke.
  alternative: ‘Umenipa shingo za adui zangu’ au ‘umewafanya adui zangu wanikimbie.’
  rationale: Tafsiri iliyochaguliwa inabaki karibu na picha ya Kiebrania na wakati huohuo inaeleweka katika Kiswahili cha sasa. Haibadili kauli hiyo kuwa dai pana la kimafundisho kuhusu adui, bali inadumisha ushuhuda wa mtunga zaburi kuhusu ushindi aliopewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Visogo’ huhifadhi taswira ya shingo za nyuma; ‘nami nikawaangamiza’ huendeleza mtiririko wa simulizi wa ushindi.
