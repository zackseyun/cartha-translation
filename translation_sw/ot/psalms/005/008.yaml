  variant: Standard East African Swahili
source:
  edition: WLC
  text: יְהוָ֤ה נְחֵ֬/נִי בְ/צִדְקָתֶ֗/ךָ לְמַ֥עַן שׁוֹרְרָ֑/י הושר לְ/פָנַ֣/י דַּרְכֶּֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/008.yaml
  text: O Yahweh[a], lead me in your righteousness because of my enemies[b]; make your way straight before me.
translation:
  language: sw
  text: Ee Yahwe, uniongoze katika haki yako kwa sababu ya adui zangu[a]; unyooshe njia yako mbele yangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu ya wale wanaonivizia”; neno la Kiebrania linaweza kumaanisha wapinzani wanaomtazama mtu kwa uhasama, si adui kwa ujumla tu.
    reason: lexical_alternative
  - marker: b
    text: Au, “ifanye njia yako iwe tambarare mbele yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la agano limetoholewa kuwa “Yahwe”; “Ee” linaonyesha kwa kawaida kwamba mtunga-zaburi anamwita Mungu moja kwa moja.
- source_word: נְחֵנִי
  choice: uniongoze
  rationale: Kitenzi נחה kinamaanisha kuongoza au kuelekeza; “uniongoze” ni ombi la moja kwa moja na la kawaida katika Kiswahili.
- source_word: בְצִדְקָתֶךָ
  choice: katika haki yako
  rationale: Huhifadhi wazo la kuongozwa ndani ya upeo au kulingana na unyofu wa Mungu, bila kulifinya neno צדקה liwe hukumu ya kimahakama pekee.
- source_word: לְמַעַן
  choice: kwa sababu ya
  rationale: Katika muktadha huu linaonyesha hali inayosababisha ombi hilo, yaani kuwapo kwa wapinzani wa mtunga-zaburi.
- source_word: שׁוֹרְרָי
  choice: adui zangu
  rationale: Hutoa maana ya wazi ya wapinzani wenye uhasama; maana mahususi zaidi ya watu wanaomchunguza au kumvizia imehifadhiwa katika tanbihi.
- source_word: הושר
  choice: unyooshe
  rationale: Umbo la kisababishi la ישר lina maana ya kufanya iwe nyoofu au tambarare; “unyooshe” huhifadhi sitiari ya njia iliyo wazi na ya moja kwa moja.
- source_word: לְפָנַי
  choice: mbele yangu
  rationale: Ni tafsiri ya kawaida na ya asili ya kirai hiki cha Kiebrania.
- source_word: דַּרְכֶּךָ
  choice: njia yako
  rationale: “Njia” huhifadhi maana halisi ya njia na pia maana pana ya mwenendo au mwongozo wa Mungu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la Mungu lenye konsonanti YHWH; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya צדקה katika mstari huu
  choice: haki
  alternative: uadilifu
  rationale: “Haki” linaweza kueleza unyofu wa tabia na matendo ya Mungu, huku likihifadhi upana wa neno la Kiebrania na kutolifanya lihusu hukumu pekee.
- issue: Sitiari ya הושר דַּרְכֶּךָ
  choice: unyooshe njia yako
  alternative: ifanye njia yako iwe tambarare
  rationale: Maandishi yanaweza kueleza njia iliyo nyoofu au tambarare. Tafsiri kuu inahifadhi wazo la mwelekeo ulio wazi, na maana nyingine imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo wa ombi na sitiari ya njia vimehifadhiwa; tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja.
