translation:
  language: sw
  text: 'Kwa kiongozi wa waimbaji: kwa filimbi[a]. Zaburi ya Daudi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “kwa ala za kupuliza.” Neno la Kiebrania huenda ni istilahi maalumu ya muziki; mara nyingine huachwa bila kutafsiriwa kama “Nehiloth.”
    reason: lexical_alternative
  - marker: b
    text: Kichwa “ya Daudi” kinaweza kuonyesha kwamba Daudi ndiye mtunzi, kwamba zaburi iliwekwa wakfu kwake, au kwamba inahusishwa na mkusanyo wa Daudi.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza wa waimbaji
  rationale: Katika vichwa vya zaburi neno hili humtaja mwenye jukumu la kuongoza utendaji wa muziki. Usemi huu ni wa kawaida na unaeleweka, ingawa kundi lenyewe huenda halikuwa kwaya kwa maana ya kisasa.
- source_word: אֶל
  choice: kwa
  rationale: Katika kichwa hiki linaanzisha maelekezo ya muziki, huenda kuhusu ala au mtindo. 'Kwa' ni fupi na halilazimishi maana maalumu kupita ushahidi.
- source_word: הַנְּחִילוֹת
  choice: filimbi
  rationale: Huenda ni istilahi ya muziki inayorejelea filimbi au ala za kupuliza, lakini maana kamili haijulikani; jambo hilo limehifadhiwa katika tanbihi.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: '''Zaburi'' ndilo neno la Kiswahili lililozoeleka na sahihi kwa wimbo huu wa kidini wenye matumizi ya kimuziki.'
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Muundo huu unaweza kuonyesha utunzi, umilikaji, wakfu, au uhusiano na mkusanyo wa Daudi. 'Ya Daudi' huhifadhi upana huo vizuri kuliko 'iliyoandikwa na Daudi'.
theological_decisions:
- issue: Maana ya לְדָוִד katika kichwa cha zaburi
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi / kwa ajili ya Daudi
  rationale: Kihusishi cha Kiebrania kinaweza kuonyesha utunzi, wakfu, umilikaji, au uhusiano. Tafsiri haipaswi kulazimisha dai moja lisilo hakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo mfupi wa kichwa cha zaburi umehifadhiwa, na kutokuwa na uhakika kwa istilahi ya muziki na kwa uhusiano wa Daudi kumewekwa wazi katika tanbihi.
