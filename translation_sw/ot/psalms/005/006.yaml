  yaml_path: translation/ot/psalms/005/006.yaml
  text: You destroy those who speak lies[b][a]; Yahweh abhors a man of bloodshed and deceit.
translation:
  language: sw
  text: Unawaangamiza wale wanaosema uongo[a]; Yahweh humchukia mno mtu wa damu na hila[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Utawaangamiza wale wanaosema uongo.” Kitenzi cha Kiebrania kinaweza kueleweka kuwa cha wakati ujao au kuwa kauli ya jumla kuhusu tendo la Mungu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “mtu wa damu na hila,” nahau inayomaanisha mtu mwenye sifa ya umwagaji damu na udanganyifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּאַבֵּד
  choice: Unawaangamiza
  rationale: Pieli ya אבד katika nafsi ya pili umoja humwelekea Mungu moja kwa moja na kumaanisha kusababisha kuangamia. Wakati wa sasa unaonyesha tendo la Mungu kama jambo la kawaida katika muktadha, huku maana ya wakati ujao ikibaki kuwa uwezekano katika tanbihi.
- source_word: דֹּבְרֵי כָזָב
  choice: wale wanaosema uongo
  rationale: Kirai hiki ni kihalisi ‘wasemaji wa uongo.’ Tafsiri hii huhifadhi tendo la kusema badala ya kulifupisha kuwa jina ‘waongo.’
- source_word: אִישׁ דָּמִים
  choice: mtu wa umwagaji damu
  rationale: אִישׁ ni nomino ya kiume umoja, nayo דָּמִים katika nahau hii huashiria umwagaji damu, ukatili, au hatia ya damu. Kiswahili hiki huhifadhi picha bila kuibana maana iwe mauaji pekee.
- source_word: וּמִרְמָה
  choice: na hila
  rationale: מִרְמָה inaweza kumaanisha udanganyifu, hila, au usaliti. ‘Hila’ ni fupi, ya kawaida, na inafaa katika ushairi huku ikidokeza udanganyifu wa makusudi.
- source_word: יְתָעֵב
  choice: humchukia sana
  rationale: Pieli ya תעב huonyesha kuchukizwa au kuchukia kwa nguvu. ‘Humchukia sana’ ni lugha ya kawaida na yenye uzito unaofaa, bila kutumia neno lisiloeleweka kwa urahisi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahweh’ badala ya kubadilishwa na cheo, hivyo kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ina jina יהוה lenyewe. ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Wakati na hali ya kitenzi תְּאַבֵּד
  choice: Unawaangamiza
  alternative: Utawaangamiza
  rationale: Umbo la Kiebrania linaweza kusikika kama kauli ya jumla kuhusu tendo la Mungu au kama tendo la wakati ujao. Matini kuu imetumia kauli ya jumla, na uwezekano wa wakati ujao umehifadhiwa katika tanbihi.
- issue: Nahau אִישׁ דָּמִים וּמִרְמָה
  choice: mtu wa umwagaji damu na hila
  alternative: mtu mwenye hatia ya damu na udanganyifu
  rationale: Tafsiri iliyochaguliwa huhifadhi umoja wa kiume na picha pana ya umwagaji damu pamoja na tabia ya hila, bila kuamua kimya-kimya kwamba anayelengwa ni muuaji tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi ulio wazi na wenye hadhi. Kauli ‘humchukia sana’ huwasilisha nguvu ya תעב kwa lugha ya sasa, na ‘hila’ huhifadhi ufupi wa mstari wa kishairi.
