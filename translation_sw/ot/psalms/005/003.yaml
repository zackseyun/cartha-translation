  yaml_path: translation/ot/psalms/005/003.yaml
  text: Yahweh[a], in the morning you hear my voice[b]; in the morning I lay my request before you and watch expectantly.
translation:
  language: sw
  text: 'Yahwe, asubuhi unasikia sauti yangu;

    asubuhi naweka ombi langu mbele yako[a],

    nami natazamia kwa tumaini[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ninaweka kwa utaratibu mbele yako.” Kitenzi hiki kinaweza kumaanisha kupanga au kuweka kwa utaratibu; kitu kinachowekwa hakikutajwa wazi, lakini yaelekea ni sala au ombi la mwombaji mbele za Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au “nami nangoja kwa matarajio.” Kitenzi cha Kiebrania kinaweza kumaanisha kutazama, kungoja, au kuangalia mbele kwa tumaini.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili, badala ya kubadilishwa na cheo kama “BWANA”.
- source_word: בֹּקֶר
  choice: asubuhi
  rationale: Nomino hii imetumiwa kwa maana ya wakati; kurudiwa kwake mara mbili kunahifadhi msisitizo wa kishairi wa Kiebrania.
- source_word: תִּשְׁמַע
  choice: unasikia
  rationale: Kauli isiyotimilika ya Kiebrania inaweza kueleza jambo la sasa, la kawaida, au linalotarajiwa. Wakati wa sasa unaonyesha uhakika wa mwombaji bila kusisitiza mno wakati ujao.
- source_word: קוֹלִי
  choice: sauti yangu
  rationale: Hili ndilo neno la moja kwa moja; “kilio changu” lingeongeza nguvu ambayo muktadha hauilazimishi.
- source_word: אֶעֱרָךְ לְךָ
  choice: naweka ombi langu mbele yako
  rationale: Kitenzi kina maana ya kupanga au kuweka kwa utaratibu. Kwa kuwa kitu kinachowekwa hakikutajwa, “ombi langu” kinaeleza maana inayowezekana katika muktadha huku tanbihi ikihifadhi usemi wa moja kwa moja zaidi.
- source_word: וַאֲצַפֶּה
  choice: nami natazamia kwa tumaini
  rationale: Kitenzi kinaweza kumaanisha kutazama, kuangalia kwa makini, au kungoja kwa matarajio. Tafsiri hii inahifadhi mwelekeo wa kutazama mbele pamoja na tumaini.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Kitu kisichotajwa cha kitenzi אֶעֱרָךְ
  choice: ombi langu
  alternative: mambo yangu; maneno yangu
  rationale: Muktadha wa zaburi unaelekea kwenye kuwasilisha sala, lakini Kiebrania hakitaji kitu hicho waziwazi; kwa hiyo tanbihi inaonyesha upana wa usemi wa asili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya “asubuhi” yamehifadhiwa; “nami” linaunganisha tendo la kuomba na kutazamia jibu.
