  text: וְ/יִשְׂמְח֨וּ כָל ח֪וֹסֵי בָ֡/ךְ לְ/עוֹלָ֣ם יְ֭רַנֵּנוּ וְ/תָסֵ֣ךְ עָלֵ֑י/מוֹ וְֽ/יַעְלְצ֥וּ בְ֝/ךָ֗ אֹהֲבֵ֥י שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/011.yaml
  text: But let all who take refuge in you rejoice[a]; let them shout for joy forever. Spread your protection over them[b], so that those who love your name may exult in you.
translation:
  language: sw
  text: 'Lakini wote wanaokukimbilia na wafurahi;

    wapaze sauti kwa shangwe milele.[a]

    Uwafunike kwa ulinzi wako,[b]

    ili wanaolipenda jina lako

    wafurahi kwa shangwe ndani yako.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waimbe kwa furaha milele.” Kitenzi cha Kiebrania kinaweza kumaanisha kupaza sauti za furaha na kinaweza pia kujumuisha kuimba.
    reason: lexical_alternative
  - marker: b
    text: Au, “uwafunike” au “uwape hifadhi.” Picha ya Kiebrania ni ya kufunika kwa kusudi la kulinda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂמְחוּ
  choice: na wafurahi
  rationale: Kauli ya kutendwa inayotarajiwa katika muktadha huu wa sala inaeleweka kama ombi au matakwa, si utabiri wa moja kwa moja.
- source_word: חוֹסֵי בָךְ
  choice: wote wanaokukimbilia
  rationale: Kauli hii inadumisha picha halisi ya kumkimbilia Mungu ili kupata hifadhi, badala ya kuifupisha kuwa imani ya moyoni pekee.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Neno hili linaonyesha muda usio na mwisho au unaodumu, na ‘milele’ ni Kiswahili cha kawaida na cha kishairi.
- source_word: יְרַנֵּנוּ
  choice: wapaze sauti kwa shangwe
  rationale: Kitenzi hiki kinaweza kumaanisha kutoa sauti kali za furaha, wakati mwingine kwa kuimba; tafsiri hii hailazimishi maana iwe kuimba pekee.
- source_word: וְתָסֵךְ עָלֵימוֹ
  choice: Uwafunike kwa ulinzi wako
  rationale: Inahifadhi picha ya kuwafunika watu kwa kusudi la kuwalinda, huku ikifanya wazi maana ya kinga katika Kiswahili cha sasa.
- source_word: וְיַעְלְצוּ בְךָ
  choice: wafurahi sana ndani yako
  rationale: ‘Wafurahi sana’ inaonyesha furaha kubwa ya kitenzi עלץ, na ‘ndani yako’ inadumisha uhusiano wa moja kwa moja wa בְךָ bila kuugeuza kuwa Mungu ndiye tu sababu ya furaha.
- source_word: אֹהֲבֵי שְׁמֶךָ
  choice: wanaolipenda jina lako
  rationale: Tafsiri hii inadumisha ‘jina lako’ lililo wazi katika Kiebrania, likirejelea jinsi Mungu anavyojifunua na sifa yake.
theological_decisions:
- issue: Ombi au matakwa dhidi ya utabiri katika vitenzi vya mstari
  choice: 'Kutumia miundo ya matakwa na ombi: ‘na wafurahi,’ ‘wapaze,’ ‘uwafunike,’ na ‘wafurahi.’'
  alternative: 'Kutafsiri kama taarifa za wakati ujao: ‘watafurahi ... watapaza ... utawafunika ... watafurahi.’'
  rationale: Katika muktadha wa sala ya zaburi, maumbo haya yanaweza kufanya kazi kama maombi au matakwa. Tafsiri ya namna hiyo inadumisha nguvu ya kiliturujia na kishairi bila kuyafanya kuwa utabiri wa lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa mistari unafuata mwendo wa ushairi wa Kiebrania; msamiati ni wa kawaida bila kupoteza picha za hifadhi, kufunikwa, na furaha kuu.
