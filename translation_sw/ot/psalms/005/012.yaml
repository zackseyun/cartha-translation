  text: כִּֽי אַתָּה֮ תְּבָרֵ֪ךְ צַ֫דִּ֥יק יְהוָ֑ה כַּ֝/צִּנָּ֗ה רָצ֥וֹן תַּעְטְרֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/012.yaml
  text: For you bless the righteous[a], O Yahweh; like a shield, favor surrounds him.
translation:
  language: sw
  text: Kwa maana wewe humbariki mwenye haki, Ee Yahweh; unamzunguka kwa kibali kama ngao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unamvika taji kwa kibali kama kwa ngao.” Kitenzi cha Kiebrania kinaweza kumaanisha “kutia taji” au “kuzunguka”; taswira ya ngao inaunga mkono maana ya kuzungukwa kwa ulinzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Katika muktadha huu neno linaanzisha msingi wa ombi na uhakika uliotangulia; “Kwa maana” linaonyesha uhusiano huo wa sababu kwa Kiswahili cha kawaida.
- source_word: תְּבָרֵךְ
  choice: humbariki
  rationale: Kauli ya wakati usiotimilika hapa inaeleza tendo la Mungu la kawaida au lililo hakika. “Humbariki” linaonyesha tendo hilo la kawaida bila kulifanya kuwa ahadi ya wakati ujao tu.
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Kivumishi hiki cha umoja kimetumiwa kama nomino kumwakilisha mtu wa kundi la wenye haki. “Mwenye haki” huhifadhi umoja wa mfano na ni Kiswahili cha asili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetolewa kama jina, badala ya kubadilishwa kuwa cheo.
- source_word: כַּצִּנָּה
  choice: kama ngao
  rationale: Kiambishi כְּ־ kinaonyesha ulinganisho, na צִנָּה ni ngao, mara nyingi ngao kubwa. “Kama ngao” ni wazi na la kawaida bila kuongeza ukubwa ambao si lazima uwe katika matini kuu.
- source_word: רָצוֹן
  choice: kibali
  rationale: Hapa neno linaonyesha kukubaliwa na Mungu au nia yake njema kwa mwenye haki; “kibali” linafaa kwa taswira ya ulinzi.
- source_word: תַּעְטְרֶנּוּ
  choice: unamzungushia
  rationale: Kitenzi kinaweza kumaanisha kuzunguka au kutia taji. Taswira ya ngao inaunga mkono maana ya kumzunguka mtu kwa ulinzi, huku mbadala wa “kutia taji” ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Matini inatumia moja kwa moja Tetragramatoni, jina la agano la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa kibali cha Mungu na ulinzi wa mwenye haki
  choice: Mungu humzungushia mwenye haki kibali kama ngao
  alternative: Kibali humvika taji kama ngao
  rationale: Sarufi inamweka Mungu kuwa mtendaji, na taswira ya ngao inadokeza kuzungukwa kwa ulinzi. Hata hivyo, maana ya “kutia taji” katika kitenzi haijaondolewa bali imetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “humbariki” unaonyesha tendo la kawaida au lililo hakika, na “unamzungushia kibali” huhifadhi Mungu kuwa mtendaji huku ukitoa taswira ya ulinzi kwa lugha inayoeleweka.
