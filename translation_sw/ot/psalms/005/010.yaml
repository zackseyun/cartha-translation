  text: הַֽאֲשִׁימֵ֨/ם אֱֽלֹהִ֗ים יִפְּלוּ֮ מִֽ/מֹּעֲצ֪וֹתֵ֫י/הֶ֥ם בְּ/רֹ֣ב פִּ֭שְׁעֵי/הֶם הַדִּיחֵ֑/מוֹ כִּי מָ֥רוּ בָֽ/ךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/010.yaml
  text: Declare them guilty[a], O God; let them fall by their own counsels. Drive them away because of their many transgressions[b], for they have rebelled against you.
translation:
  language: sw
  text: Ee Mungu, watangaze kuwa wenye hatia; waanguke kwa mipango yao wenyewe.[a] Wafukuze kwa wingi wa maasi yao,[b] maana wamekuasi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waanguke kutoka katika mipango yao,” yaani, mipango yao ishindwe na kuwaangamiza.
    reason: lexical_alternative
  - marker: b
    text: “Wafukuze” pia inaweza kutafsiriwa “wawatoe nje” au “wawapeleke uhamishoni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲשִׁימֵם
  choice: watangaze kuwa na hatia
  rationale: Kauli ya kuamuru katika Hiphil yenye kiambishi cha nafsi ya tatu wingi ina maana ya kuwaona au kuwatangaza kuwa wenye hatia. Tafsiri hii inadumisha taswira ya hukumu bila kutaja adhabu maalumu.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Ni mwito wa moja kwa moja katika sala; “Ee Mungu” ni Kiswahili cha kawaida na chenye heshima.
- source_word: יִפְּלוּ
  choice: waanguke
  rationale: Kitenzi hiki kina nguvu ya ombi katika muktadha huu; hali ya kutakia inaendeleza sala ya mtunga zaburi badala ya kuifanya kuwa utabiri tu.
- source_word: מִמֹּעֲצוֹתֵיהֶם
  choice: kwa sababu ya mipango yao wenyewe
  rationale: Neno מוֹעֵצוֹת linahusu mashauri au mipango, na מן hapa inaweza kueleza chanzo au sababu. Tafsiri hii inaonyesha kwamba mipango yao wenyewe ndiyo inayoleta anguko lao, huku tanbihi ikihifadhi uwezekano wa maana ya kuanguka kutoka katika mipango yao.
- source_word: בְּרֹב פִּשְׁעֵיהֶם
  choice: kwa sababu ya wingi wa makosa yao
  rationale: ב pamoja na רֹב ina maana ya sababu hapa. פֶּשַׁע ni kosa zito la kuvunja uaminifu au uasi; “makosa” ni wazi kwa wasomaji wa kawaida, na “wingi” inadumisha mkazo wa Kiebrania.
- source_word: הַדִּיחֵמוֹ
  choice: Wafukuze
  rationale: Hiphil ya נדח humaanisha kusababisha watu waondolewe, watupwe nje, au wafukuzwe. “Wafukuze” ni fupi, yenye nguvu, na inafaa muktadha wa hukumu.
- source_word: כִּי
  choice: kwa maana
  rationale: Inaingiza sababu ya maombi yaliyotangulia na inaunganisha mistari kwa mtindo wa kishairi.
- source_word: מָרוּ בָךְ
  choice: wamekuasi
  rationale: מרה pamoja na ב huonyesha uasi dhidi ya Mungu. “Wamekuasi” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Lugha ya sala inayoomba hukumu
  choice: Kudumisha maombi ya moja kwa moja ya Mungu kuhukumu, bila kuyapunguza kuwa utabiri.
  alternative: Kutafsiri kauli hizi kama taarifa za kutabiri badala ya maombi.
  rationale: Kiebrania kina kauli za kuamuru na kitenzi chenye nguvu ya kutakia kikielekezwa kwa Mungu. Kudumisha maombi hayo kunaakisi maana ya wazi ya maandishi na hakufichi mvutano wake wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kishairi lakini unaeleweka kwa msomaji wa kawaida; maombi makali ya hukumu yamehifadhiwa bila kulainishwa.
