base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/004.yaml
  text: For you are not a God who delights in wickedness[a]; evil may not dwell with you.
translation:
  language: sw
  text: Kwa maana wewe si Mungu anayependezwa na uovu; uovu[a] hauwezi kukaa kwako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu mwovu hawezi kukaa kwako” / “hakuna mtenda maovu anayeweza kukaa kwako.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaeleza sababu ya ombi lililotangulia na kudumisha mtiririko wa hoja wa zaburi.
- source_word: אֵל
  choice: Mungu
  rationale: Katika usemi huu wa moja kwa moja neno hili linamtaja Mungu wa kweli; “Mungu” ndiyo tafsiri ya kawaida na ya asili.
- source_word: חָפֵץ
  choice: anayependezwa na
  rationale: Huonyesha kufurahia au kupendelea, si kutaka tu; tamko hili ni la kawaida na linaakisi uzito wa kihisia wa kitenzi.
- source_word: רֶשַׁע
  choice: uovu
  rationale: Ni nomino dhahania inayomaanisha uovu au hatia ya kimaadili; “uovu” ni wazi na hudumisha ulinganifu wa kishairi.
- source_word: יְגֻרְךָ
  choice: hauwezi kukaa kwako
  rationale: Kitenzi גור humaanisha kukaa kama mgeni au kuishi kwa muda. Hapa kinaonyesha kutokubaliana kwa uovu na uwepo wa Mungu, hivyo “hauwezi” huwasilisha kutengwa huko badala ya utabiri wa wakati ujao tu.
- source_word: רָע
  choice: uovu
  rationale: Kivumishi kilichotumiwa kama nomino kinaweza kumaanisha uovu kwa ujumla au mtu mwovu. Ulinganifu wake na רֶשַׁע unaunga mkono “uovu,” huku tanbihi ikihifadhi uwezekano wa maana ya mtu.
theological_decisions:
- issue: Ikiwa רָע itafsiriwe kwa maana dhahania (“uovu”) au ya mtu (“mtu mwovu”/“mtenda maovu”)
  choice: uovu
  alternative: mtu mwovu / mtenda maovu
  rationale: Kiebrania kinaruhusu maana zote. Ulinganifu wa karibu na “uovu” katika mstari wa kwanza unapendelea maana dhahania hapa, lakini muktadha unaofuata unazungumzia watenda maovu; kwa hiyo uwezekano wa maana ya mtu umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kukaa kwako” ni usemi wa kawaida unaobeba wazo la kukaa karibu na Mungu bila kutumia lugha ya kale kama “kupanga” au “kukaa kama mgeni.”
