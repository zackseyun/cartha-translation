base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/009.yaml
  text: For there is nothing trustworthy in their mouth[a]; their inward part is destruction. Their throat is an open grave[c][b]; with their tongue they flatter.
translation:
  language: sw
  text: Kwa maana hakuna jambo la kuaminika kinywani mwao[a]; ndani yao mna maangamizi[b]. Koo lao ni kaburi lililo wazi; kwa ulimi wao hunena kwa ulaini[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakuna jambo la kuaminika kinywani mwake,” ikiwa umoja wa umbo la Kiebrania unafuatwa kwa ukaribu zaidi mwanzoni mwa mstari.
    reason: alternative_reading
  - marker: b
    text: Au, “hali yao ya ndani ni uharibifu,” au “mioyo yao ni maangamizi.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa ulimi wao hubembeleza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... נְכוֹנָה
  choice: hakuna jambo la kuaminika
  rationale: Kirai hiki kinakanusha kabisa kuwapo kwa uaminifu au uthabiti katika usemi wao; Kiswahili hiki ni cha kawaida na kinafaa katika muktadha wa udanganyifu.
- source_word: בְּפִיהוּ
  choice: kinywani mwao
  rationale: Ingawa umbo lililoandikwa lina kiambishi cha nafsi ya tatu umoja, viambishi vinavyofuata ni vya wingi na vinarejelea waovu kama kundi; wingi unaleta mshikamano wa mstari huku umoja ukihifadhiwa katika tanbihi.
- source_word: קִרְבָּם
  choice: ndani yao
  rationale: Huhifadhi taswira pana ya sehemu ya ndani ya mtu bila kuibana kuwa moyo au uwezo fulani wa nafsi.
- source_word: הַוּוֹת
  choice: maangamizi
  rationale: Wingi wa Kiebrania unaweza kueleza mambo yenye kuleta uharibifu au hali ya uangamivu; 'maangamizi' huhifadhi uzito na wingi wa neno hilo.
- source_word: קֶבֶר פָּתוּחַ
  choice: kaburi lililo wazi
  rationale: Huhifadhi moja kwa moja taswira ya kishairi ya koo kama kaburi lililo wazi, inayodokeza usemi wenye mauti na ufisadi.
- source_word: גְּרוֹנָם
  choice: koo lao
  rationale: Katika muktadha wa viungo vya usemi, 'koo' ndilo neno la kawaida na sahihi la Kiswahili.
- source_word: לְשׁוֹנָם
  choice: kwa ulimi wao
  rationale: Huhifadhi umoja wa kijumla wa Kiebrania na taswira ya ulimi kama chombo cha usemi.
- source_word: יַחֲלִיקוּן
  choice: hujipendekeza
  rationale: Kitenzi kinatumia wazo la kufanya kuwa laini katika usemi, yaani kusema kwa namna ya kubembeleza au kujipendekeza; chaguo hili ni la asili katika Kiswahili.
- source_word: כִּי
  choice: Kwa maana
  rationale: Huonyesha kwamba mstari huu unatoa sababu ya ombi lililotangulia.
theological_decisions:
- issue: Taswira ya hali ya ndani katika קִרְבָּם
  choice: ndani yao
  alternative: mioyo yao
  rationale: Neno la Kiebrania linarejelea hali ya ndani kwa upana. 'Ndani yao' huhifadhi upana huo bila kuamua kuwa linamaanisha moyo pekee.
- issue: Idadi ya בְּפִיהוּ katika muktadha
  choice: kinywani mwao
  alternative: kinywani mwake
  rationale: Umbo lenyewe ni la umoja, lakini viambishi vingine vya mstari ni vya wingi na rejeleo ni kundi la waovu. Tafsiri ya wingi inasomeka kwa mshikamano, na umbo la umoja limeonyeshwa katika tanbihi.
- issue: Maana ya יַחֲלִיקוּן
  choice: hujipendekeza
  alternative: hunena kwa ulaini
  rationale: Kitenzi kinaweza kueleza usemi laini, hasa wa kubembeleza. Tafsiri kuu inaonyesha nguvu yake katika muktadha bila kuongeza waziwazi wazo la udanganyifu; maana halisi zaidi imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Taswira za kinywa, ndani, koo, kaburi na ulimi zimehifadhiwa; miundo isiyo ya kawaida imefanyiwa ulinganifu wa kiasi ili mstari usomeke kwa asili.
