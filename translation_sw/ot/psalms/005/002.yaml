  text: הַקְשִׁ֤יבָ/ה לְ/ק֬וֹל שַׁוְעִ֗/י מַלְכִּ֥/י וֵ/אלֹהָ֑/י כִּֽי אֵ֝לֶ֗י/ךָ אֶתְפַּלָּֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/002.yaml
  text: Pay attention to the sound of my cry for help[a], my King and my God, for to you I pray.
translation:
  language: sw
  text: Sikiliza kwa makini sauti ya kilio changu cha kuomba msaada, Mfalme wangu na Mungu wangu, kwa maana ni kwako ninaomba[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitaomba.” Umbo la kitenzi cha Kiebrania linaweza kueleza tendo la sasa, linaloendelea, au la wakati ujao kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: Sikiliza kwa makini
  rationale: Kitenzi hiki ni amri inayotaka kusikiliza kwa uangalifu. Kauli hii ni ya kawaida katika Kiswahili cha sasa na inahifadhi uzito wa ombi.
- source_word: לְקוֹל
  choice: sauti ya
  rationale: קוֹל humaanisha sauti; hapa inaunganishwa na kilio cha mwombaji. Tafsiri hii inahifadhi muundo na maana ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: שַׁוְעִי
  choice: kilio changu cha kuomba msaada
  rationale: Neno hili humaanisha kilio cha dhiki kinachoomba msaada, si kilio chochote tu.
- source_word: מַלְכִּי
  choice: Mfalme wangu
  rationale: Ni cheo cha kifalme kinachotumiwa katika kumwambia Mungu moja kwa moja. Herufi kubwa inafuata mtindo wa Kiswahili wa kuandika cheo cha Mungu.
- source_word: וֵאלֹהָי
  choice: na Mungu wangu
  rationale: Ni tafsiri ya moja kwa moja ya jina la Mungu lenye kiambishi cha nafsi ya kwanza.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya ombi lililotangulia.
- source_word: אֵלֶיךָ
  choice: ni kwako
  rationale: Muundo huu unaonyesha mwelekeo wa sala na kuhifadhi msisitizo wa Kiebrania kwamba sala inaelekezwa kwa Mungu.
- source_word: אֶתְפַּלָּל
  choice: ninaomba
  rationale: Kitenzi cha Kiebrania katika hali isiyotimilika kinaweza kuonyesha tendo la sasa, linaloendelea, la kawaida, au la wakati ujao. Katika ombi hili la moja kwa moja, “ninaomba” ni tafsiri ya asili bila kufunga maana kwa wakati ujao pekee.
theological_decisions:
- issue: Kumwita Mungu kwa cheo cha kifalme
  choice: Mfalme wangu na Mungu wangu
  alternative: mfalme wangu na Mungu wangu
  rationale: Mstari unamwambia Mungu moja kwa moja kwa cheo cha kifalme na jina la kimungu. Tafsiri inahifadhi yote mawili bila kuingiza dai jingine la kimafundisho.
- issue: Wakati na hali ya אֶתְפַּלָּל
  choice: ninaomba
  alternative: nitaomba
  rationale: Hali isiyotimilika ya Kiebrania inaweza kuelekezwa kwa sasa au wakati ujao. Muktadha wa dua ya moja kwa moja unaunga mkono tendo la sasa au linaloendelea, huku tanbihi ikihifadhi uwezekano wa wakati ujao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala. “Sikiliza kwa makini” huepuka usemi wa kizamani kama “tega sikio,” na “ni kwako ninaomba” huhifadhi msisitizo wa chanzo bila kuwa ngumu kueleweka.
