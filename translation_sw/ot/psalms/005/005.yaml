lexical_decisions:
- source_word: יִתְיַצְּבוּ
  choice: hawatasimama
  rationale: Kitenzi katika Hitpael kina maana ya kusimama au kujihudhurisha. “Hawatasimama” ni Kiswahili cha kawaida kinachohifadhi wazo la kutoweza kubaki mbele za Mungu.
- source_word: הוֹלְלִים
  choice: wenye majivuno
  rationale: Katika umbo hili neno linawaonyesha watu wenye kujisifu na kujikweza, si wapumbavu kwa upande wa akili tu. “Wenye majivuno” linafaa katika muktadha wa kimaadili.
- source_word: לְנֶגֶד עֵינֶיךָ
  choice: mbele ya macho yako
  rationale: Tafsiri hii inahifadhi taswira halisi ya Kiebrania huku ikieleweka kuwa ni mbele ya uwepo na uangalizi wa Mungu.
- source_word: שָׂנֵאתָ
  choice: unawachukia
  rationale: Kitenzi kinasema wazi “unachukia.” Tafsiri haipunguzi ukali wa kauli ya chanzo.
- source_word: פֹּעֲלֵי אָוֶן
  choice: wote watendao uovu
  rationale: Kirai kinamaanisha wale wanaofanya au kutenda uovu. “Watendao uovu” ni cha asili katika Kiswahili na kinahifadhi maana tendaji na uzito wa kimaadili.
theological_decisions:
- issue: Kauli kwamba Mungu anawachukia watendao uovu
  choice: unawachukia wote watendao uovu
  alternative: unawapinga au unawakataa wote watendao uovu
  rationale: Kiebrania שָׂנֵאתָ kina maana ya moja kwa moja ya “unachukia.” Kauli hiyo imehifadhiwa bila kulainishwa wala kufafanuliwa kwa mtazamo wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa mistari miwili unahifadhi usambamba wa kishairi; taswira ya “mbele ya macho yako” na kauli kali “unawachukia” zimehifadhiwa.
