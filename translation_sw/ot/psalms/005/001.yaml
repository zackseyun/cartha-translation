  yaml_path: translation/ot/psalms/005/001.yaml
  text: Give ear to my words[a], O Yahweh; understand my groaning.
translation:
  language: sw
  text: Ee Yahweh, sikiliza kwa makini maneno yangu; uelewe kuugua kwangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutafakari kwangu” au “manung’uniko yangu.” Neno la Kiebrania linaweza kumaanisha mawazo ya ndani au sauti ya chini; hapa limetafsiriwa “kuugua” kwa kuzingatia muktadha wa maombolezo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָרַי
  choice: maneno yangu
  rationale: Ni wingi wenye kiambishi cha nafsi ya kwanza umoja; “maneno yangu” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: הַאֲזִינָה
  choice: sikiliza kwa makini
  rationale: Kitenzi hiki ni ombi la kusikiliza kwa uangalifu. Kiswahili “sikiliza kwa makini” kinahifadhi uzito wa ombi bila kutumia nahau isiyo ya kawaida ya “tega sikio.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: בִּינָה
  choice: uelewe
  rationale: Amri hii inaomba ufahamu wenye utambuzi; “uelewe” ni ya asili na inadumisha maana ya msingi ya kitenzi.
- source_word: הֲגִיגִי
  choice: kuugua kwangu
  rationale: Nomino hii inaweza kumaanisha kutafakari kwa ndani, kunong’ona, au sauti ya chini. Katika ombi hili la maombolezo, “kuugua kwangu” linaonyesha uchungu uliomo bila kuficha upana wa maana, ambao umeelezwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina binafsi la Mungu moja kwa moja; “Yahwe” linahifadhi jina hilo badala ya kuliwakilisha kwa cheo.
- issue: Maana ya הֲגִיגִי katika sala ya maombolezo
  choice: kuugua kwangu
  alternative: kutafakari kwangu; manung’uniko yangu
  rationale: Muktadha unaunga mkono sauti ya ndani yenye uchungu, lakini neno lenyewe lina maana pana. Tafsiri kuu inafuata muktadha, huku tanbihi ikihifadhi uwezekano mwingine wa kimaana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala. “Sikiliza kwa makini” limetumiwa badala ya nahau halisi “tega sikio” ili sentensi iwe wazi kwa wasomaji wa kawaida. Kiitikio “Ee” kinadumisha sauti ya kumwita Mungu kwa unyenyekevu.
