base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/007.yaml
  text: But as for me[a], by the abundance of your steadfast love I will enter your house[b]; I will bow down toward your holy temple in fear of you.
translation:
  language: sw
  text: Lakini mimi, kwa wingi wa upendo wako thabiti[a], nitaingia nyumbani mwako; nitainama kuelekea hekalu lako takatifu kwa kumcha wewe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa wingi wa uaminifu wako wa agano.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa kicho” au “kwa heshima kuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Lakini mimi
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha tofauti kati ya mtunga zaburi na waovu waliotajwa kabla yake.
- source_word: בְּרֹב חַסְדְּךָ
  choice: kwa wingi wa upendo wako thabiti
  rationale: 'Kirai kinaonyesha msingi wa kumkaribia Mungu: wingi wa upendo wake wa kudumu na wa uaminifu. ''Upendo thabiti'' huhifadhi upana wa חֶסֶד bila kuufanya rehema pekee.'
- source_word: אָבוֹא בֵיתֶךָ
  choice: nitaingia nyumbani mwako
  rationale: Kauli ya wakati ujao huonyesha azimio au matarajio; 'nyumbani mwako' huhifadhi maana ya kawaida ya בַּיִת na kuitofautisha na 'hekalu' katika kishazi kinachofuata.
- source_word: אֶשְׁתַּחֲוֶה
  choice: nitainama
  rationale: Kitenzi kinaonyesha tendo la kuinama au kujisujudu katika ibada; 'nitainama' huhifadhi taswira ya mwili badala ya kuitafsiri kwa neno pana 'nitaabudu' pekee.
- source_word: אֶל הֵיכַל קָדְשְׁךָ
  choice: kuelekea hekalu lako takatifu
  rationale: '''Kuelekea'' huhifadhi mwelekeo wa אֶל, na ''hekalu lako takatifu'' ni Kiswahili cha kawaida kwa makao matakatifu ya Mungu.'
- source_word: בְּיִרְאָתֶךָ
  choice: nikikucha wewe
  rationale: '''Kumcha'' katika Kiswahili cha kibiblia lakini kinachoeleweka hubeba woga mtakatifu, heshima, na kicho, bila kuupunguza kuwa adabu tu.'
theological_decisions:
- issue: Maana ya חֶסֶד katika muktadha wa ibada
  choice: upendo wako thabiti
  alternative: uaminifu wako wa agano; rehema zako
  rationale: Neno hilo linaunganisha upendo, uaminifu, na kudumu kwa wema wa Mungu. Tafsiri iliyochaguliwa huhifadhi upana huo bila kuingiza ufafanuzi mwembamba.
- issue: Nuansi ya יִרְאָה mbele za Mungu
  choice: nikikucha wewe
  alternative: kwa kicho kwako; kwa heshima kuu kwako
  rationale: Tafsiri hii huhifadhi mvutano wa hofu takatifu, kicho, na heshima mbele za Mungu, bila kuifanya hofu ya kitisho pekee wala heshima nyepesi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unaweka tofauti ya 'Lakini mimi,' huhifadhi 'nyumbani' na 'hekalu' kama maneno mawili tofauti, na kutumia 'kumcha' kwa woga wenye kicho katika ibada.
