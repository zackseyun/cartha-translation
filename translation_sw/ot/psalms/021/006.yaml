  text: כִּֽי תְשִׁיתֵ֣/הוּ בְרָכ֣וֹת לָ/עַ֑ד תְּחַדֵּ֥/הוּ בְ֝/שִׂמְחָ֗ה אֶת פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/006.yaml
  text: For you make him blessings forever[b][a]; you gladden him with joy in your presence.
translation:
  language: sw
  text: 'Kwa maana unamfanya kuwa baraka tele milele[a];

    unamfurahisha kwa furaha mbele zako.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unamweka katika baraka tele milele,” au, “unamjalia baraka tele milele.” Usemi wa Kiebrania unaweza kumaanisha kwamba anapewa baraka nyingi au kwamba yeye mwenyewe anakuwa baraka kwa wengine.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu au ufafanuzi wa sifa iliyotangulia na ni usemi wa kawaida wa Kiswahili.
- source_word: תְשִׁיתֵהוּ בְרָכוֹת
  choice: unamfanya kuwa baraka tele
  rationale: Kitenzi שׁית kina maana ya kuweka au kufanya, na wingi בְרָכוֹת unaweza kuonyesha wingi au uzito wa baraka. Tafsiri hii inadumisha picha ya mfalme kuwa mfano au chemchemi ya baraka bila kuficha uwezekano kwamba anajaliwa baraka nyingi.
- source_word: לָעַד
  choice: milele
  rationale: Ni tafsiri ya kawaida na ya asili kwa muda usio na mwisho au unaodumu.
- source_word: תְּחַדֵּהוּ
  choice: unamfurahisha
  rationale: Hifadhi maana ya kusababisha mtu awe na furaha iliyo katika umbo la Piel.
- source_word: בְשִׂמְחָה
  choice: kwa furaha
  rationale: Huwakilisha matumizi ya בְ ya njia au hali na kudumisha msisitizo wa nomino 'furaha'.
- source_word: אֶת־פָּנֶיךָ
  choice: mbele zako
  rationale: Uso wa Mungu hapa ni nahau ya kuwapo kwake; 'mbele zako' ni usemi wa asili wa Kiswahili unaohifadhi pia picha ya kusimama mbele ya uso wake.
theological_decisions:
- issue: Maana ya kumfanya mfalme 'baraka' kwa wingi
  choice: unamfanya kuwa baraka tele
  alternative: unamweka katika baraka tele milele; unamjalia baraka tele milele
  rationale: Kiebrania kina usemi mfupi na usio wa kawaida ambao unaweza kumaanisha kwamba mfalme anapewa baraka nyingi au kwamba yeye mwenyewe anakuwa mfano au chemchemi ya baraka. Matini kuu inadumisha picha ya kuwa baraka, huku tanbihi ikieleza maana nyingine bila kuufungamanisha mstari na tafsiri maalumu ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio 'unamfurahisha kwa furaha' yamehifadhiwa kwa kuwa yanaakisi msisitizo wa Kiebrania; 'mbele zako' ni ya asili zaidi kuliko tafsiri sisisi 'kwa uso wako'.
