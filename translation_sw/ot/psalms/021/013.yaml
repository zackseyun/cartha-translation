  text: ר֣וּמָ/ה יְהוָ֣ה בְּ/עֻזֶּ֑/ךָ נָשִׁ֥ירָה וּֽ֝/נְזַמְּרָה גְּבוּרָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/013.yaml
  text: Be exalted[a], O Yahweh[b], in your strength! We will sing and make music to your might.
translation:
  language: sw
  text: Uinuliwe[a], ee Yahwe[b], kwa nguvu zako! Tutaimba na kuimba sifa za uweza wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Inuka, ee Yahwe, kwa nguvu zako.” Kitenzi cha Kiebrania kinaweza kueleweka kama mwito kwa Mungu ainuke au ainuliwe.
    reason: lexical_alternative
  - marker: b
    text: Yahwe ni jina la Mungu linalowakilishwa kwa herufi יהוה katika Kiebrania; kwa kawaida tafsiri nyingine hulitoa kama “BWANA.”
    reason: divine_name
lexical_decisions:
- source_word: רוּמָה
  choice: Uinuliwe
  rationale: Amri kutoka mzizi רום inaomba Yahwe awe juu au aonekane ametukuka. “Uinuliwe” linafaa katika lugha ya sifa, huku uwezekano wa maana ya “inuka” ukihifadhiwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa na cheo “BWANA”.
- source_word: בְּעֻזֶּךָ
  choice: kwa nguvu zako
  rationale: Kihusishi ב kinaweza kuonyesha njia au mazingira ambamo kuinuliwa huko kunaonekana. “Kwa nguvu zako” ni Kiswahili cha kawaida na kinadumisha uhusiano huo bila kuufafanua kupita kiasi.
- source_word: נָשִׁירָה
  choice: Tutaimba
  rationale: Umbo la cohortative la nafsi ya kwanza wingi linaonyesha azimio au mwaliko. “Tutaimba” linaeleza azimio la waabudu kwa lugha ya sasa.
- source_word: וּנְזַמְּרָה
  choice: na kupiga muziki
  rationale: זמר katika muktadha wa sifa huhusu kuimba au kufanya muziki. “Kupiga muziki” huhifadhi kipengele cha kimuziki na kutofautisha kitenzi hiki na “kuimba” kilichotangulia.
- source_word: גְּבוּרָתֶךָ
  choice: uweza wako
  rationale: גְּבוּרָה humaanisha uweza, nguvu, au matendo yenye nguvu. “Uweza” hudumisha tofauti ya kishairi na עֹז, iliyotafsiriwa “nguvu”.
theological_decisions:
- issue: Utoaji wa jina la Mungu YHWH
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina binafsi יהוה, si cheo אֲדֹנָי. Kulitoa kama “Yahwe” huhifadhi jina hilo bila kuingiza desturi ya kulibadilisha na cheo.
- issue: Maana ya ombi רוּמָה
  choice: Uinuliwe
  alternative: Inuka
  rationale: Muktadha wa sifa unaweza kuelekeza kwenye kutukuzwa kwa Yahwe, lakini kitenzi pia kinaweza kuwa mwito wa Mungu ainuke na atende. Tanbihi huhifadhi mvutano huo wa kimaana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Ee” limetumiwa kama kiingizi cha mwito; “nguvu” na “uweza” zinahifadhi utofauti wa maneno mawili yanayohusiana katika Kiebrania.
