  terminology: ‘Yahwe’ is an appropriate Swahili transliteration of the divine name. ‘Ee,’ ‘nguvu,’ and ‘uweza’ fit a dignified modern biblical register. The alternative in footnote a appropriately preserves the possible sense ‘Rise up.’
