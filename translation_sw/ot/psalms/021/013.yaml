  source_fidelity: The draft correctly represents the petition/acclamation רוּמָה, preserves the distinction between עֹז (‘nguvu’) and גְּבוּרָה (‘uweza’), and conveys the first-person plural cohortatives. ‘Kuhusu uweza wako’ is semantically possible for the final object, but it weakens the psalmic praise relationship expressed by the verbs ‘sing’ and ‘make music.’
