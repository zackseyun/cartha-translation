  text: גָּד֣וֹל כְּ֭בוֹד/וֹ בִּ/ישׁוּעָתֶ֑/ךָ ה֥וֹד וְ֝/הָדָר תְּשַׁוֶּ֥ה עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/005.yaml
  text: Great is his glory through your salvation[b][a]; you bestow splendor and majesty on him.
translation:
  language: sw
  text: Utukufu wake ni mkuu kwa wokovu wako[a][b]; unamvika fahari na adhama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa njia ya wokovu wako” au “katika wokovu wako”; kihusishi cha Kiebrania kinaweza kuonyesha njia au mazingira.
    reason: lexical_alternative
  - marker: b
    text: “Wokovu” hapa unaweza pia kueleweka kuwa “ukombozi” au, katika muktadha huu wa kifalme, “ushindi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: ni mkuu
  rationale: Ni kivumishi cha kiarifu kilichotangulizwa kwa msisitizo; mpangilio huu unadumisha mkazo wa kishairi kwa Kiswahili cha kawaida.
- source_word: כְּבוֹדוֹ
  choice: utukufu wake
  rationale: כָּבוֹד hapa hudokeza utukufu na heshima ya kifalme; “utukufu” inafaa katika muktadha wa kuinuliwa kwa mfalme.
- source_word: בִּישׁוּעָתֶךָ
  choice: kwa wokovu wako
  rationale: Kihusishi ב kinaweza kuonyesha njia, sababu, au mazingira. “Kwa” huhifadhi kwa ufupi uwezekano wa wokovu wa Mungu kuwa njia au msingi wa utukufu wa mfalme.
- source_word: הוֹד
  choice: fahari
  rationale: הוֹד ni uzuri au utukufu wenye hadhi; “fahari” huitofautisha na הָדָר huku ikihifadhi taswira ya kifalme.
- source_word: וְהָדָר
  choice: na adhama
  rationale: הָדָר katika jozi hii ni hadhi na uzuri wa kifalme; “adhama” huwasilisha ukuu wenye heshima.
- source_word: תְּשַׁוֶּה עָלָיו
  choice: unamvika
  rationale: Kitenzi pamoja na עַל kina maana ya kuweka kitu juu ya mtu. “Unamvika” ni taswira asilia ya Kiswahili ya kumtwika au kumpa mfalme fahari na adhama.
theological_decisions:
- issue: Maana ya יְשׁוּעָה katika zaburi ya kifalme
  choice: wokovu
  alternative: ukombozi au ushindi
  rationale: “Wokovu” huhifadhi upana wa neno la Kiebrania; katika mazingira ya kifalme linaweza pia kumaanisha ukombozi, hasa ushindi dhidi ya adui, bila kulifungia katika maana ya kijeshi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Unamvika” hudumisha taswira halisi ya kuweka fahari na adhama juu ya mfalme bila kuwa na ugumu wa tafsiri ya neno kwa neno.
