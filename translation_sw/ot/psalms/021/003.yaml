base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/003.yaml
  text: For you meet him with blessings of good[c][b][a]; you set a crown of fine gold on his head.
translation:
  language: sw
  text: Kwa maana unamlaki[a] kwa baraka njema[b]; unaweka taji la dhahabu safi[c] juu ya kichwa chake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unamtangulia,” au “unakuja kumlaki.” Kitenzi cha Kiebrania kinaweza kumaanisha kukutana na mtu au kumtangulia.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa neno halisi ni “baraka za mema,” yaani baraka zinazoleta mema.
    reason: lexical_alternative
  - marker: c
    text: Au, “dhahabu bora,” au “dhahabu iliyosafishwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza msingi wa furaha na mafanikio yaliyotajwa katika muktadha uliotangulia.
- source_word: תְקַדְּמֶנּוּ
  choice: unamlaki
  rationale: Kitenzi cha Kiebrania kinaweza kumaanisha kwenda mbele ya mtu au kumjia ili kukutana naye. “Unamlaki” ni Kiswahili cha kawaida kinachoonyesha kuwa Mungu ndiye anayeanzisha tendo hilo.
- source_word: בִּרְכוֹת טוֹב
  choice: kwa baraka njema
  rationale: Tafsiri hii inadumisha wingi wa “baraka” na maana pana ya mema bila kuzifafanua kuwa mali au baraka za kiroho pekee.
- source_word: תָּשִׁית
  choice: unaweka
  rationale: Kitenzi humaanisha kuweka au kuleta kitu mahali fulani; “unaweka” linafaa kwa tendo la kuweka taji kichwani.
- source_word: לְרֹאשׁוֹ
  choice: juu ya kichwa chake
  rationale: Ingawa Kiebrania kinatumia kihusishi לְ, pamoja na kitenzi cha kuweka maana ya kawaida hapa ni “juu ya kichwa chake.”
- source_word: עֲטֶרֶת
  choice: taji
  rationale: Katika zaburi ya kifalme, neno hili linaeleweka vizuri kuwa taji la mfalme.
- source_word: פָּז
  choice: dhahabu safi
  rationale: Neno hili humaanisha dhahabu yenye ubora wa juu; “dhahabu safi” ni usemi wazi na wenye hadhi katika Kiswahili.
theological_decisions:
- issue: Asili ya baraka anazopewa mfalme
  choice: Kudumisha maana pana kwa kusema “baraka njema.”
  alternative: Kuzitafsiri kuwa ustawi wa mali pekee au baraka za kiroho/agano pekee.
  rationale: Kirai cha Kiebrania hakibainishi aina moja ya baraka. Tafsiri pana inahifadhi upeo huo bila kuingiza hitimisho la kiteolojia lisilotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Unamlaki” hudumisha hadhi ya zaburi na mpango wa Mungu wa kuchukua hatua kwanza; maelezo ya chini yanahifadhi uwezekano wa maana ya kumtangulia.
