  text: 'Umempa tamanio la moyo wake,

    wala hukumzuilia ombi la midomo yake.

    Sela.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sela” limehifadhiwa kama matamshi ya neno la Kiebrania kwa sababu maana au kazi yake kamili haijulikani; huenda lilikuwa alama ya mapumziko ya kimuziki au ya kiliturujia.
    reason: cultural_note
lexical_decisions:
- source_word: תַּאֲוַת לִבּוֹ
  choice: tamanio la moyo wake
  rationale: Kirai hiki humaanisha jambo analolitamani moyoni. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha picha ya Kiebrania ya tamanio la ndani.
- source_word: נָתַתָּה לּוֹ
  choice: umempa
  rationale: Kitenzi timilifu kinaeleza tendo lililokamilika lenye umuhimu wa sasa katika zaburi hii ya shukrani; hali timilifu ya Kiswahili inafaa.
- source_word: וַאֲרֶשֶׁת
  choice: ombi
  rationale: Nomino hii adimu ya Kiebrania inaelekea kumaanisha ombi au haja iliyotamkwa, sambamba na tamanio la moyo katika mstari wa kwanza.
- source_word: שְׂפָתָיו
  choice: la midomo yake
  rationale: Hii inadumisha taswira halisi ya Kiebrania ya ombi linalotamkwa kwa midomo.
- source_word: בַּל מָנַעְתָּ
  choice: wala hukukataa
  rationale: Katika muktadha huu, kitenzi cha kuzuia au kunyima pamoja na ukanushi kinaelezwa kwa Kiswahili cha asili kama kutokataa ombi, bila kubadili maana kuu.
- source_word: סֶּלָה
  choice: Sela
  rationale: Neno hili limeandikwa kwa herufi za Kiswahili badala ya kutafsiriwa kwa sababu maana au kazi yake kamili haijulikani kwa hakika.
