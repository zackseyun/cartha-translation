  text: Your hand will find all your enemies[a]; your right hand will find those who hate you.
translation:
  language: sw
  text: Mkono wako utawafikia adui zako wote[a]; mkono wako wa kuume utawafikia wale wanaokuchukia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utawapata” au “utawakamata”; neno la Kiebrania linalomaanisha “kupata” linaweza hapa kumaanisha kuwafikia maadui na kuwatia mkononi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְצָא
  choice: utawafikia
  rationale: Kitenzi מצא kwa kawaida humaanisha ‘kupata’ au ‘kukuta,’ lakini katika muktadha huu wa kuwashinda maadui kinaashiria kuwafikia na kuwakamata. ‘Utawafikia’ ni Kiswahili cha kawaida na huhifadhi maana ya kufanikiwa kuwatia mkononi.
- source_word: יָדְךָ
  choice: mkono wako
  rationale: Tafsiri halisi inadumisha taswira ya kishairi ya mkono kama chombo cha nguvu na tendo la mfalme.
- source_word: לְכָל
  choice: adui zako wote
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na huhifadhi maana jumuishi ya כל.
- source_word: אֹיְבֶיךָ
  choice: adui zako
  rationale: Hii ni tafsiri ya kawaida ya אויב, huku kiambishi cha nafsi ya pili umoja kikihifadhiwa kwa ‘zako.’
- source_word: יְמִינְךָ
  choice: mkono wako wa kuume
  rationale: Tafsiri hii inadumisha urudiaji sambamba wa Kiebrania na taswira ya nguvu na ushindi inayohusishwa na mkono wa kuume.
- source_word: שֹׂנְאֶיךָ
  choice: wale wanaokuchukia
  rationale: Kirai hiki ni cha asili katika Kiswahili cha sasa na huhifadhi hali ya kitendo katika umbo la Kiebrania badala ya kukifanya tu nomino nyingine ya ‘maadui.’
theological_decisions:
- issue: Lugha ya kimwili kuhusu nguvu ya Mungu au ya mfalme katika zaburi ya kifalme
  choice: Taswira halisi ya ‘mkono’ na ‘mkono wa kuume’ imehifadhiwa badala ya kubadilishwa kuwa ‘nguvu’ au ‘uwezo.’
  alternative: Nguvu zako zitawashinda adui zako wote.
  rationale: Kiebrania kinatumia taswira ya mwili yenye umuhimu wa kishairi na kiteolojia. Kuihifadhi huepuka ufafanuzi wa ziada na hudumisha usambamba na uzito wa mstari bila kuamua kimya kimya ikiwa msemaji anamrejelea Mungu au mfalme.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Mkono wa kuume’ umetumiwa kudumisha taswira ya Kiebrania na usambamba wa mstari; ‘utawafikia’ hutoa maana ya kimuktadha bila kufuta uwezekano wa maana ya msingi ‘kupata,’ ambao umeonyeshwa katika tanbihi.
