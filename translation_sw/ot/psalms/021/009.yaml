  text: תְּשִׁיתֵ֤/מוֹ כְּ/תַנּ֥וּר אֵשׁ֮ לְ/עֵ֪ת פָּ֫נֶ֥י/ךָ יְ֭הוָה בְּ/אַפּ֣/וֹ יְבַלְּעֵ֑/ם וְֽ/תֹאכְלֵ֥/ם אֵֽשׁ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/009.yaml
  text: You will make them like a fiery furnace at the time of your presence; Yahweh in his anger will swallow them up[a], and fire will consume them.
translation:
  language: sw
  text: Utawafanya wawe kama tanuru la moto wakati wa kuwapo kwako[a]; Yahwe, katika hasira yake, atawameza, na moto utawateketeza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati wa kujidhihirisha kwako”; kihalisi, “wakati wa uso wako.”
    reason: Huhifadhi maana mbadala ya פָּנֶיךָ (“uso wako”), inayoweza kumaanisha kuwapo au kujidhihirisha.
lexical_decisions:
- source_word: תְּשִׁיתֵמוֹ
  choice: Utawafanya wawe
  rationale: Kitenzi שׁית kina maana ya kuweka au kufanya; pamoja na kirai cha kulinganisha kinachofuata, Kiswahili hiki kinaonyesha hali watakayofanywa kuwa nayo.
- source_word: כְּתַנּוּר אֵשׁ
  choice: kama tanuru la moto
  rationale: תנור ni tanuru au joko; muundo huu unahifadhi taswira halisi ya joto kali lenye kuangamiza.
- source_word: לְעֵת פָּנֶיךָ
  choice: wakati wa kuwapo kwako
  rationale: Kihalisi ni ‘wakati wa uso wako’; hapa פנים inaweza kumaanisha kuwapo au kujidhihirisha. ‘Kuwapo kwako’ ni ya asili katika Kiswahili bila kuondoa utata huo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: בְּאַפּוֹ
  choice: kwa hasira yake
  rationale: אַף kihalisi ni pua, lakini hapa ni nahau ya hasira; ‘kwa hasira yake’ huwasilisha maana hiyo wazi.
- source_word: יְבַלְּעֵם
  choice: atawameza
  rationale: בלע humaanisha kumeza; uchaguzi huu unahifadhi sitiari kali na kuitofautisha na tendo la moto katika kishazi kinachofuata.
- source_word: וְתֹאכְלֵם אֵשׁ
  choice: na moto utawala
  rationale: Kihalisi moto ‘utawala’; usemi huu ni wa asili katika Kiswahili na unadumisha taswira hai ya maandishi ya Kiebrania.
theological_decisions:
- issue: Usemi wa kibinadamu ‘wakati wa uso wako’
  choice: wakati wa kuwapo kwako
  alternative: wakati wa kujidhihirisha kwako
  rationale: Tafsiri hii inadumisha maana ya kuwapo kwa Mungu kunakodhihirika bila kuufanya usemi huu kuwa istilahi maalumu ya matukio ya mwisho.
- issue: Urejeo wa viwakilishi katika nusu mbili za mstari
  choice: ‘kwako’ humrejelea mfalme; kisha ‘Yahwe ... yake’ humtaja Yahwe
  alternative: Kuchukulia viwakilishi vyote kuwa vinamrejelea Yahwe
  rationale: Nafsi ya pili inaendelea na maneno yaliyoelekezwa kwa mfalme katika muktadha, huku kutajwa wazi kwa Yahwe kukianzisha kishazi kinachofuata. Tafsiri haiongezi ufafanuzi usiokuwapo katika maandishi.
- issue: Jina la Mungu
  choice: Yahwe
  alternative: BWANA
  rationale: Unukuzi wa tetragramatoni unahifadhi jina binafsi lililo katika maandishi ya Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Taswira za ‘tanuru,’ ‘kumeza,’ na moto ‘kula’ zimehifadhiwa kwa sababu ni za asili pia katika Kiswahili. Hakuna tanbihi iliyowekwa, kwa kuwa tofauti ya ‘kuwapo’ na ‘kujitokeza’ inaweza kuwakilishwa vya kutosha katika uamuzi wa tafsiri bila kuvuruga mstari.
