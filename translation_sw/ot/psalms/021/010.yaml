base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/010.yaml
  text: You will destroy their fruit from the earth[a], and their offspring from among the sons of man.
translation:
  language: sw
  text: Utayatokomeza matunda yao kutoka duniani, na uzao wao miongoni mwa wanadamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “wana wa mtu,” yaani, wanadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּרְיָמוֹ
  choice: matunda yao
  rationale: Neno פְּרִי maana yake ya msingi ni ‘tunda’ au ‘mazao,’ lakini hapa linaweza kutumiwa kwa njia ya picha kumaanisha watoto au vizazi. ‘Matunda yao’ linahifadhi picha ya kishairi na ulinganifu wake na ‘uzao wao.’
- source_word: מֵאֶרֶץ
  choice: duniani
  rationale: אֶרֶץ linaweza kumaanisha ‘dunia’ au ‘nchi.’ Muktadha mpana wa hukumu katika zaburi hii unaunga mkono ‘duniani,’ bila kuifanya iwe nchi fulani tu.
- source_word: תְּאַבֵּד
  choice: utayatokomeza
  rationale: Muundo wa Piel wa אבד una maana ya kusababisha kitu kipotee au kuangamia. ‘Utayatokomeza’ ni Kiswahili cha sasa chenye nguvu kinachoonyesha kuangamiza kabisa, huku kikihifadhi nafsi ya pili umoja.
- source_word: וְזַרְעָם
  choice: uzao wao
  rationale: זֶרַע maana yake halisi ni ‘mbegu,’ na kwa wanadamu humaanisha uzao au wazao. ‘Uzao wao’ ni wazi na wa kawaida katika Kiswahili, huku ukidumisha wazo la mwendelezo wa kizazi.
- source_word: מִבְּנֵי אָדָם
  choice: miongoni mwa wanadamu
  rationale: Kirai בְּנֵי אָדָם ni nahau ya Kiebrania inayowarejelea wanadamu kwa ujumla. ‘Miongoni mwa wanadamu’ kinatoa maana hiyo kwa Kiswahili cha kawaida na chenye hadhi; umbo halisi limeelezwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya אָדָם katika kirai בְּנֵי אָדָם
  choice: wanadamu
  alternative: wana wa Adamu
  rationale: Kirai hiki kinamaanisha jamii ya wanadamu kwa ujumla, si lazima wanaume pekee wala wazao wa mtu mmoja aitwaye Adamu. Tafsiri ya kawaida ‘wanadamu’ inaepuka kuleta maana finyu isiyokusudiwa, huku tanbihi ikihifadhi umbo halisi la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi na chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Utayatokomeza’ linabeba nguvu ya hukumu ya kitenzi cha Kiebrania; ‘matunda yao’ linahifadhi sitiari badala ya kuifafanua moja kwa moja kuwa wazao.
