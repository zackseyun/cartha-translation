  text: חַיִּ֤ים שָׁאַ֣ל מִ֭מְּ/ךָ נָתַ֣תָּה לּ֑/וֹ אֹ֥רֶךְ יָ֝מִ֗ים עוֹלָ֥ם וָ/עֶֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/004.yaml
  text: He asked life from you[b][a]; you gave it to him—length of days forever and ever.
translation:
  language: sw
  text: Aliomba uzima kwako; ukampa—maisha marefu milele na milele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno “milele na milele” yanaweza kueleweka kuwa lugha ya kifalme iliyotiwa chumvi kuhusu maisha na utawala unaodumu, au kuwa lugha inayopata utimilifu wake kamili katika Masihi. Kirai “maisha marefu” ni, kihalisi, “urefu wa siku.”
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: חַיִּים
  choice: uzima
  rationale: Nomino hii ya umbo la wingi hutumika hapa kwa maana ya dhahania ya ‘uzima.’ ‘Uzima’ huhifadhi kitu kilichoombwa bila kuingiza mapema wazo la muda mrefu, ambalo linaelezwa katika kirai kinachofuata.
- source_word: שָׁאַל מִמְּךָ
  choice: aliomba ... kwako
  rationale: Kitenzi kina maana ya kuomba, na מן huonyesha chanzo. ‘Aliomba uzima kwako’ ni Kiswahili cha kawaida na huelekeza ombi kwa Mungu.
- source_word: נָתַתָּה לּוֹ
  choice: ukampa
  rationale: Kitenzi timilifu kimetafsiriwa kwa wakati uliopita. Kiambishi ‘-m-’ huonyesha mpokeaji, na kitu kilichotolewa kinaeleweka kutoka ‘uzima’ katika kishazi kilichotangulia.
- source_word: אֹרֶךְ יָמִים
  choice: maisha marefu
  rationale: Nahau hii, kihalisi ‘urefu wa siku,’ humaanisha maisha marefu. Tafsiri ya nahau ni ya asili zaidi katika Kiswahili kuliko ‘urefu wa siku,’ huku mstari wa kistari ukihifadhi uhusiano wake wa ufafanuzi na ‘uzima.’
- source_word: עוֹלָם וָעֶד
  choice: milele na milele
  rationale: Kirai hiki kilichosisitizwa huonyesha muda usio na kikomo; ‘milele na milele’ ni usemi wa Kiswahili unaolingana na nguvu yake ya kishairi.
theological_decisions:
- issue: Upeo wa maisha yaliyoahidiwa kwa mfalme katika zaburi ya kifalme
  choice: Kutafsiri עוֹלָם וָעֶד moja kwa moja kuwa ‘milele na milele’ bila kuifupisha kuwa maisha marefu tu wala kuitaja wazi kuwa ya Kimasihi katika matini kuu.
  alternative: Kuichukulia kama lugha ya kifalme iliyotiwa chumvi kuhusu maisha na utawala wa muda mrefu, au kama lugha inayotimizwa kikamilifu katika Masihi.
  rationale: Kiebrania chenyewe kinatumia lugha ya muda usio na kikomo. Tafsiri inapaswa kudumisha mvutano kati ya mfalme wa zaburi na utimilifu unaowezekana wa Kimasihi badala ya kuutatua kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. ‘Uzima’ limetumiwa kwa חַיִּים, huku ‘maisha marefu’ likitoa maana ya nahau ya אֹרֶךְ יָמִים. Alama ya tanbihi imewekwa baada ya kirai kinachohusika.
