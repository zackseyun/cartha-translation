base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/001.yaml
  text: O Yahweh[a], in your strength the king rejoices, and in your salvation how greatly he exults!
translation:
  language: sw
  text: 'Ee Yahwe, mfalme anafurahi kwa nguvu zako;

    anashangilia sana kwa wokovu wako[a]!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania lililotafsiriwa “wokovu” linaweza pia kumaanisha “ukombozi” au “ushindi” katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la agano limetafsiriwa moja kwa moja kama “Yahwe”; “Ee” linaonyesha kwamba hapa Mungu anaitwa katika usemi wa moja kwa moja.
- source_word: בְּעָזְּךָ
  choice: kwa nguvu zako
  rationale: “Kwa” linaweza kuonyesha msingi au sababu ya furaha ya mfalme bila kulazimisha maana finyu ya chombo pekee; “nguvu zako” ni Kiswahili cha kawaida kwa עֹז pamoja na kiambishi cha nafsi ya pili.
- source_word: יִשְׂמַח
  choice: anafurahi
  rationale: Yiqtol ya kishairi inaweza kueleza hali ya sasa au ya kawaida; wakati wa sasa unafaa katika muktadha huu wa sifa.
- source_word: מֶלֶךְ
  choice: mfalme
  rationale: Ingawa Kiebrania hakina kibainishi hapa, muktadha unaonyesha mfalme maalumu anayezungumziwa.
- source_word: וּבִישׁוּעָתְךָ
  choice: kwa wokovu wako
  rationale: “Wokovu” huhifadhi upana wa יְשׁוּעָה, ambalo pia linaweza kumaanisha ukombozi au ushindi; “kwa” linadumisha ulinganifu wa kimsingi na kishazi cha kwanza kwa Kiswahili cha kawaida.
- source_word: מַה ... מְאֹד
  choice: kubwa
  rationale: Muundo huu ni mshangao wenye msisitizo mkubwa, si swali. Katika “anafanya shangwe kubwa,” ukubwa wa furaha unaelezwa kwa Kiswahili cha asili bila kuiga mpangilio wa Kiebrania kwa ugumu.
- source_word: יגיל
  choice: anafanya shangwe
  rationale: גיל huonyesha furaha iliyochangamka zaidi kuliko שמח; “anafanya shangwe” linatofautisha kwa kufaa na “anafurahi” katika mstari wa kwanza.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini inatumia Tetragramatoni moja kwa moja; “Yahwe” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Upana wa maana ya יְשׁוּעָה
  choice: wokovu
  alternative: ukombozi au ushindi
  rationale: “Wokovu” huhifadhi maana pana ya neno, huku tanbihi ikionyesha maana nyingine zinazowezekana katika muktadha wa ushindi wa kifalme.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mistari miwili inadumisha ulinganifu wa shairi, huku “anafurahi” na “anafanya shangwe kubwa” zikihifadhi ongezeko la nguvu ya hisia katika Kiebrania.
