  text: כִּי נָט֣וּ עָלֶ֣י/ךָ רָעָ֑ה חָֽשְׁב֥וּ מְ֝זִמָּ֗ה בַּל יוּכָֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/011.yaml
  text: For they intended evil against you[a]; they devised a scheme[b], but they could not carry it out.
translation:
  language: sw
  text: Kwa maana walikusudia kukutendea mabaya[a]; walipanga hila[b], lakini hawakuweza kuitimiza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “walinyoosha mabaya dhidi yako.” Nahau ya Kiebrania ina maana kwamba walielekeza au walikusudia mabaya dhidi yako.
    reason: lexical_alternative
  - marker: b
    text: Au, “walibuni njama, lakini hawakuweza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha sababu ya hukumu iliyotajwa katika mstari uliotangulia; “Kwa maana” ni cha kawaida na huhifadhi nguvu hiyo ya ufafanuzi.
- source_word: נָטוּ עָלֶיךָ רָעָה
  choice: walikusudia kukutendea mabaya
  rationale: Kitenzi נָטָה kwa maana ya msingi ni “kunyoosha/kuelekeza,” lakini pamoja na רָעָה na עַל hapa ni nahau ya kuelekeza nia mbaya dhidi ya mtu. Tafsiri hii inaonyesha kusudi la uadui kwa Kiswahili cha kawaida.
- source_word: חָשְׁבוּ
  choice: walipanga
  rationale: Katika muktadha huu חשׁב inaonyesha kupanga jambo kwa makusudi, si kuwaza tu.
- source_word: מְזִמָּה
  choice: hila
  rationale: Neno hili linaweza kumaanisha mpango au njama yenye ujanja; “hila” huhifadhi kidokezo hasi cha mpango wa adui bila kuwa na maneno mengi.
- source_word: בַּל יוּכָלוּ
  choice: lakini hawakuweza kuitimiza
  rationale: בַּל ni kanushi ya kishairi, na יוּכָלוּ humaanisha “waliweza.” “Lakini” huonyesha tofauti kati ya kupanga na kushindwa, huku “kuitimiza” ikirejelea hila iliyotangulia.
