  text: Kwa mwongoza muziki. Zaburi ya Daudi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “iliyoandikwa na Daudi” au “kwa ajili ya Daudi”; kichwa cha Kiebrania kinaweza kuonyesha uandishi, uhusiano, au kuwekwa wakfu.
