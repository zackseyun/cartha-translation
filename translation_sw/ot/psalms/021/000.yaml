lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza muziki
  rationale: Katika vichwa vya Zaburi, neno hili humrejelea kiongozi au msimamizi wa uimbaji wa ibada. “Mwongoza muziki” ni Kiswahili cha sasa kinachoeleweka na kinachohifadhi dhima hiyo bila kudhania kwamba lazima aliongoza kwaya pekee. “Kwa” huwakilisha kiambishi ל katika maana ya kuelekezwa kwake.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ndilo jina la kawaida na sahihi la utanzu huu wa wimbo wa ibada, wenye uhusiano wa kimuziki.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kiambishi ל kinaweza kuonyesha uandishi, uhusiano, umilikaji, au kuwekwa wakfu kwa mtu. “Ya Daudi” hudumisha upana huo kwa kiwango kinachowezekana katika Kiswahili bila kuamua moja kwa moja kuwa maana ni “iliyoandikwa na Daudi” au “kwa ajili ya Daudi.”
theological_decisions:
- issue: Maana ya kichwa kinachomhusisha Daudi
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi; kwa ajili ya Daudi
  rationale: Kiebrania לְדָוִד kina maana pana kuliko dai la moja kwa moja kuhusu uandishi. Tafsiri inahifadhi uwezekano wa uandishi, uhusiano, au kuwekwa wakfu badala ya kutatua utata huo kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Mwongoza muziki” limetumiwa badala ya “mkuu wa waimbaji” ili kutoifanya dhima hiyo iwe ya kwaya pekee. Alama [a] imewekwa baada ya “Daudi,” ambako utata unaofafanuliwa unatokea.
