base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/007.yaml
  text: For the king trusts in Yahweh[b][a], and through the steadfast love of the Most High he will not be shaken.
translation:
  language: sw
  text: Kwa maana mfalme anamtumaini Yahweh, na kwa upendo thabiti wa Aliye Juu Sana[a] hatatikisika[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika upendo thabiti wa Aliye Juu Sana.” Kihusishi cha Kiebrania kinaweza kueleweka kuwa kinaonyesha njia au maana ya kimahali; pia neno חֶסֶד linaweza kutafsiriwa “uaminifu wa agano.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hatasogezwa” au “hatayumba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaunganisha mstari huu na yaliyotangulia kwa kutoa msingi au maelezo, bila kubainisha zaidi ya Kiebrania.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino yenye uainisho humrejelea mhusika wa kifalme katika zaburi; Kiswahili hakihitaji kibainishi tofauti hapa.
- source_word: בֹּטֵחַ בַּיהוָה
  choice: anamtumaini Yahweh
  rationale: Kauli endelevu inaonyesha tegemeo la kawaida au linaloendelea; muundo wa Kiswahili wenye kiambishi cha yambwa ni wa asili.
- source_word: וּבְחֶסֶד
  choice: na kwa upendo thabiti
  rationale: חֶסֶד huonyesha upendo mwaminifu na wa kudumu; kwa linaacha uwezekano wa kuelewa בְּ kama chombo au msingi wa uthabiti.
- source_word: עֶלְיוֹן
  choice: Aliye Juu Zaidi
  rationale: Ni cheo cha Mungu kinachotumiwa kama nomino; tafsiri hii ni ya kawaida, yenye heshima, na inayoeleweka.
- source_word: בַּל יִמּוֹט
  choice: hatatikisika
  rationale: Kitenzi kina picha ya kutikisika, kusogezwa, au kuyumba; hatatikisika huhifadhi sitiari ya uthabiti kwa Kiswahili cha sasa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina maalumu la Mungu, יהוה; Yahweh hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Uhusiano wa בְּ katika וּבְחֶסֶד na kishazi kinachofuata
  choice: kwa upendo thabiti wa Aliye Juu Zaidi
  alternative: katika upendo thabiti wa Aliye Juu Zaidi
  rationale: Kihusishi kinaweza kuonyesha njia/msingi au mahali/eneo la kitamathali. Tafsiri kuu inatumia maana ya njia au msingi huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umewekwa wa asili kwa Kiswahili huku uhusiano wa kishazi na sitiari ya uthabiti vikihifadhiwa.
