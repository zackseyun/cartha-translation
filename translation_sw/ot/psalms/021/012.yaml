translation:
  language: sw
  text: Kwa maana utawafanya wageuze migongo yao[a]; kwa nyuzi za upinde wako utalenga nyuso zao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “utawaweka bega.” Huenda usemi huu unamaanisha kuwafanya maadui wageuze migongo yao wakikimbia, au kuwaweka kwa upande mpana kama shabaha.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa kamba zako utaweka tayari dhidi ya nyuso zao.” Taswira ya Kiebrania imefupishwa; kitu kinachowekwa tayari—huenda upinde au mishale—hakikutajwa wazi.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Hapa kiunganishi kinaonyesha msingi wa uhakika ulioelezwa kabla; “Kwa maana” kinaendeleza mtiririko huo kwa Kiswahili cha kawaida.
- source_word: תְּשִׁיתֵמוֹ שֶׁכֶם
  choice: utawafanya wageuze migongo yao
  rationale: Kitenzi שׁית humaanisha kuweka au kufanya, na שֶׁכֶם kwa msingi ni bega. Katika taswira hii ya kivita, usemi unaelekea kumaanisha kuwafanya adui wageuze mabega au migongo, ama kwa kukimbia ama kwa kuwekwa kama shabaha.
- source_word: בְּמֵיתָרֶיךָ
  choice: kwa nyuzi za upinde wako
  rationale: מֵיתָר ni kamba au uzi uliokazwa; muktadha wa kulenga katika vita unaonyesha hasa nyuzi za upinde.
- source_word: תְּכוֹנֵן
  choice: utalenga
  rationale: Katika muundo huu כון inaweza kumaanisha kuandaa au kuweka tayari. Pamoja na nyuzi za upinde na nyuso za maadui, “utalenga” huwasilisha tendo linalokusudiwa kwa lugha asilia.
- source_word: עַל־פְּנֵיהֶם
  choice: nyuso zao
  rationale: Usemi huu ni “juu ya/dhidi ya nyuso zao”; pamoja na kitenzi cha kulenga, Kiswahili cha kawaida ni “utalenga nyuso zao,” huku picha halisi ya nyuso ikihifadhiwa.
