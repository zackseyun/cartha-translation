base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/000.yaml
  text: 'A Song of Ascents[a]. Those who trust in Yahweh are like Mount Zion: it will not be shaken; it abides forever.'
translation:
  language: sw
  text: 'Wimbo wa Kupanda. Wanaomtumaini Yahwe ni kama Mlima Sayuni: hautatikisika[a]; hudumu milele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi, “hautasogezwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa kwenda juu
  rationale: Huhifadhi maana ya msingi ya wimbo unaohusishwa na kupanda au kwenda juu, huku ikibaki kichwa cha asili kinachoeleweka kwa Kiswahili.
- source_word: הַבֹּטְחִים בַּיהוָה
  choice: Wanaomtumaini Yahwe
  rationale: Kitenzi בטח kinaeleza kumtegemea Mungu kwa uhakika; jina יהוה limetoholewa kuwa “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: לֹא יִמּוֹט
  choice: hautatikisika
  rationale: Kiswahili hiki cha kawaida huwasilisha uthabiti wa mlima; tanbihi huhifadhi maana halisi zaidi ya kutosogezwa.
- source_word: לְעוֹלָם יֵשֵׁב
  choice: unakaa milele
  rationale: Hufuata taswira ya Kiebrania ya Mlima Sayuni kukaa au kudumu milele bila kuifanya kauli kuwa ya kifafanuzi kupita kiasi.
theological_decisions:
- issue: Rejeo la kitenzi cha umoja katika לֹא יִמּוֹט ... יֵשֵׁב
  choice: Vitenzi “hautatikisika” na “unakaa” vinarejelea Mlima Sayuni.
  alternative: Kuvifanya virejelee moja kwa moja watu wanaomtumaini Yahwe kwa kutumia wingi.
  rationale: Kiebrania kinahamia katika umoja wa kiume baada ya kuwalinganisha waaminio na Mlima Sayuni; uundaji huu unahifadhi mlima kama kiini cha taswira bila kuondoa matumizi yake kwa waaminio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Sentensi ni nyepesi kwa msomaji wa kawaida, huku jina la agano “Yahwe,” taswira ya Mlima Sayuni, na mfuatano wa vitenzi vya umoja vikihifadhiwa.
