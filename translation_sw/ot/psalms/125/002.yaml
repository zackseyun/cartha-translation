lexical_decisions:
- source_word: יְרוּשָׁלִַם
  choice: Yerusalemu
  rationale: Umbo la kawaida la Kiswahili la jina la mahali Jerusalem.
- source_word: הָרִים
  choice: milima
  rationale: Wingi wa הַר unaweza kumaanisha milima au vilima; “milima” inafaa mazingira ya Yerusalemu na taswira ya ulinzi.
- source_word: סָבִיב לָהּ
  choice: inavyoizunguka Yerusalemu
  rationale: סָבִיב לָהּ huonyesha kuwapo kuizunguka; kurejea jina la mji ni kwa asili zaidi katika Kiswahili kuliko kutumia kiwakilishi cha kike cha Kiebrania.
- source_word: וַיהוָה
  choice: ndivyo Yahwe
  rationale: Waw inaeleweka kwa nguvu ya ulinganisho kutokana na usambamba wa kishairi; jina la agano יְהוָה limetoholewa kuwa “Yahwe.”
- source_word: סָבִיב לְעַמּוֹ
  choice: anavyowazunguka watu wake
  rationale: Inarudia taswira ya kuzunguka katika mstari sambamba na kudokeza ulinzi bila kuutaja waziwazi.
- source_word: מֵעַתָּה וְעַד עוֹלָם
  choice: tangu sasa na hata milele
  rationale: Usemi wa wakati unaoanzia sasa na kuendelea bila mwisho; tafsiri hii ni ya kawaida na yenye hadhi katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la agano; “Yahwe” hulihifadhi kwa namna ya utamkaji wa Kiswahili bila kulibadilisha kuwa cheo.
- issue: Nguvu ya kiunganishi וַ kabla ya יְהוָה
  choice: ndivyo Yahwe
  alternative: na Yahwe
  rationale: Muundo sambamba unaunda ulinganisho kati ya milima kuizunguka Yerusalemu na Yahwe kuwazunguka watu wake; “ndivyo” huufanya uhusiano huo uwe wazi bila kubadili picha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Kama … ndivyo …” unawasilisha usambamba wa kishairi kwa uwazi, huku tanbihi ikihifadhi uwezekano wa muundo rasmi zaidi wa Kiebrania.
