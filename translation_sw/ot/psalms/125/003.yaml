source:
  edition: WLC
  text: כִּ֤י לֹ֪א יָנ֡וּחַ שֵׁ֤בֶט הָ/רֶ֗שַׁע עַל֮ גּוֹרַ֪ל הַֽ/צַּדִּ֫יקִ֥ים לְמַ֡עַן לֹא יִשְׁלְח֖וּ הַ/צַּדִּיקִ֨ים בְּ/עַוְלָ֬תָ/ה יְדֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/003.yaml
  text: For the scepter of wickedness will not rest on the lot of the righteous[c][b][a], lest the righteous stretch out their hands to wrongdoing.
translation:
  language: sw
  text: Kwa maana fimbo ya utawala wa uovu[a] haitakaa juu ya fungu la wenye haki[b], ili wenye haki wasije wakanyoosha mikono yao kutenda uovu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fimbo ya utawala ya waovu.” Muundo wa Kiebrania unaweza kumaanisha uovu kama sifa au waovu wanaoitumia fimbo hiyo.
    reason: lexical_alternative
  - marker: b
    text: “Fungu” inaweza pia kutafsiriwa “sehemu” au “urithi”—yaani, sehemu iliyogawiwa wenye haki.
    reason: lexical_alternative
  - marker: c
    text: Kwa tafsiri ya karibu zaidi na muundo wa Kiebrania, “wanyooshe mikono yao katika uovu.” Nahau hiyo humaanisha kujihusisha na kutenda uovu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza sababu ya uhakika uliotangulia katika zaburi na kuunganisha sentensi kwa Kiswahili cha kawaida.
- source_word: יָנוּחַ
  choice: haitakaa
  rationale: Inahifadhi maana ya kutulia, kukaa, au kudumu; hapa inaonyesha kwamba utawala wa uovu hautadumu juu ya wenye haki.
- source_word: שֵׁבֶט
  choice: fimbo ya utawala
  rationale: Neno linaweza kumaanisha fimbo, lakini katika muktadha huu ni mfano wa mamlaka ya kutawala. Usemi huu ni wazi kuliko 'fimbo' peke yake na haubadili picha ya Kiebrania kabisa.
- source_word: הָרֶשַׁע
  choice: ya uovu
  rationale: Inahifadhi nomino dhahania ya Kiebrania; uwezekano wa kumaanisha watawala waovu umewekwa katika tanbihi.
- source_word: גּוֹרַל
  choice: sehemu waliyopewa
  rationale: גּוֹרָל hapa ni fungu au urithi uliogawiwa, si kura yenyewe. Tafsiri hii inaeleweka kwa wasomaji wa sasa huku tanbihi ikihifadhi maana zake nyingine.
- source_word: הַצַּדִּיקִים
  choice: wenye haki
  rationale: Ni tafsiri ya kawaida na inayoeleweka ya kivumishi cha wingi kinachotumiwa kama nomino.
- source_word: לְמַעַן לֹא
  choice: ili ... wasije
  rationale: Inaeleza kusudi la kuzuia matokeo mabaya kwa Kiswahili cha kawaida bila kudai kwamba matokeo hayo tayari yametokea.
- source_word: יִשְׁלְחוּ ... יְדֵיהֶם
  choice: wakanyoosha mikono yao
  rationale: Inahifadhi picha ya nahau ya Kiebrania ya kunyoosha mikono, huku kitenzi kinachofuata kikifafanua maana yake katika muktadha.
- source_word: בְּעַוְלָתָה
  choice: kutenda uovu
  rationale: עַוְלָה huonyesha uovu, dhuluma, au jambo lisilo la haki. 'Kutenda uovu' huwasilisha kwa kawaida wazo la kujihusisha na kosa bila kulibana kuwa dhuluma pekee.
theological_decisions:
- issue: Ahadi kuhusu utawala wa uovu juu ya wenye haki
  choice: Utawala wa uovu hautakaa au kudumu juu ya sehemu ya wenye haki.
  alternative: Waovu hawatatawala wenye haki kamwe hata kwa muda.
  rationale: Kitenzi יָנוּחַ kinahusu kutulia, kukaa, au kudumu. Hivyo mstari haukatai kwamba wenye haki wanaweza kuonewa kwa muda, bali unasema mamlaka hiyo haitakaa hapo mpaka iwasukume kutenda uovu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Fimbo ya utawala' inafanya mfano wa mamlaka ueleweke; 'sehemu waliyopewa' inaepuka maana ya kwanza ya 'kura' ambayo inaweza kupotosha. Alama zote za tanbihi zimo katika matini kuu.
