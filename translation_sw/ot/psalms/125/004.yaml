source:
  edition: WLC
  text: הֵיטִ֣יבָ/ה יְ֭הוָה לַ/טּוֹבִ֑ים וְ֝/לִֽ/ישָׁרִ֗ים בְּ/לִבּוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/004.yaml
  text: Do good[a], O Yahweh, to the good[b], and to the upright in heart.
translation:
  language: sw
  text: 'Ee Yahwe, watendee mema walio wema,[a]

    na walio wanyofu mioyoni mwao.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwatendee vizuri watu wema.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “walio wanyofu katika mioyo yao,” ikisisitiza unyofu wa ndani.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיבָה
  choice: watendee mema
  rationale: Ni ombi katika hali ya kuamuru lililoelekezwa kwa Yahwe. Kauli hii ni ya kawaida katika Kiswahili na inadumisha maana ya ‘kutenda mema’ au ‘kuwatendea vizuri.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa ‘Yahwe’ badala ya kubadilishwa na cheo.
- source_word: לַטּוֹבִים
  choice: walio wema
  rationale: Kivumishi טוֹב kimetumiwa kama nomino kumaanisha watu wema. Tafsiri hii pia inadumisha mwangwi wa kishairi kati ya ‘mema’ na ‘wema.’
- source_word: וְלִישָׁרִים
  choice: na walio wanyofu
  rationale: יָשָׁר hapa inaeleza unyofu wa kimaadili; ‘wanyofu’ ni tafsiri ya asili na inayoeleweka bila kuingiza istilahi nyingine ya kiteolojia.
- source_word: בְּלִבּוֹתָם
  choice: mioyoni mwao
  rationale: Tafsiri hii inadumisha wingi wa Kiebrania, ‘mioyo yao,’ na kusisitiza unyofu wa ndani.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה; kulitohowa kunahifadhi jina badala ya kuweka cheo mahali pake.
- issue: Maelezo ya kimaadili ya wanaopokea wema
  choice: walio wema ... walio wanyofu mioyoni mwao
  alternative: wenye haki ... wenye moyo mnyofu
  rationale: Mistari sambamba ya Kiebrania ina maelezo mawili ya kimaadili na inasisitiza unyofu wa ndani. Tafsiri haifanyi mojawapo kuwa istilahi maalumu ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wa kawaida na wenye heshima. Mpangilio wa mistari unahifadhi usambamba wa zaburi; ‘mema ... wema’ unadumisha mchezo wa maneno wa Kiebrania.
