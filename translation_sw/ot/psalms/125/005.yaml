  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הַ/מַּטִּ֤ים עַֽקַלְקַלּוֹתָ֗/ם יוֹלִיכֵ֣/ם יְ֭הוָה אֶת פֹּעֲלֵ֣י הָ/אָ֑וֶן שָׁ֝ל֗וֹם עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/005.yaml
  text: But as for those who turn aside to their crooked ways[a], Yahweh will lead them away with the workers of iniquity[c][b]. Peace be upon Israel.
translation:
  language: sw
  text: Lakini wale wanaogeukia njia zao zilizopotoka[a], Yahwe atawapeleka pamoja na watenda uovu[b]. Amani iwe juu ya Israeli.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mapito yao yaliyopinda,” au “njia zao potovu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Yahwe atawaondoa pamoja na waovu.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania ni kifupi: “Amani juu ya Israeli”—huenda ni baraka au ombi la amani kwa Israeli.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהַמַּטִּים
  choice: Lakini wale wanaogeukia
  rationale: Kitenzi נטה kinaonyesha kuacha njia iliyonyooka na kuelekea kwingine. “Lakini” linaonyesha utofauti na watu wanyofu waliotajwa katika mstari uliotangulia.
- source_word: עַקַלְקַלּוֹתָם
  choice: njia zao zilizopotoka
  rationale: Neno hili linaweza kumaanisha njia au mapito yaliyopinda, na hapa taswira hiyo ina maana ya mwenendo potovu.
- source_word: יוֹלִיכֵם
  choice: atawapeleka
  rationale: Hifili ya הלך ina maana ya kusababisha waende au kuwapeleka; tafsiri hii ni ya kawaida katika Kiswahili na inadokeza kuondolewa kwa hukumu bila kuongeza mahali wanakopelekwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa umbo la Kiswahili “Yahwe” badala ya kulibadilisha kuwa cheo.
- source_word: אֶת
  choice: pamoja na
  rationale: 'Katika muktadha huu אֶת lina matumizi ya ushirika: watu hao wanapelekwa pamoja na watenda uovu.'
- source_word: פֹּעֲלֵי הָאָוֶן
  choice: watenda uovu
  rationale: Hili linahifadhi muundo wa Kiebrania, yaani watu wanaotenda uovu, kwa lugha ya asili na yenye uzito wa kimaadili.
- source_word: שָׁלוֹם
  choice: Amani
  rationale: “Amani” ni tafsiri ya kawaida na ya asili, huku ikiweza kubeba pia maana pana ya ustawi na hali njema.
- source_word: עַל יִשְׂרָאֵל
  choice: iwe juu ya Israeli
  rationale: Kirai kifupi cha Kiebrania kimekamilishwa kama baraka au ombi kwa Kiswahili, bila kudai wakati wa kitenzi ambao haujaonyeshwa wazi katika Kiebrania.
theological_decisions:
- issue: Nguvu ya maneno ya mwisho שָׁלוֹם עַל יִשְׂרָאֵל
  choice: Amani iwe juu ya Israeli.
  alternative: Amani juu ya Israeli; au Amani iko juu ya Israeli.
  rationale: Muundo usio na kitenzi katika Kiebrania unaweza kueleweka kama baraka, ombi, au tamko fupi. “Iwe” linaonyesha kwa kawaida sauti ya baraka katika hitimisho la zaburi, huku tanbihi ikihifadhi ufupi na uwezekano wa muundo wa asili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida huku taswira ya njia zilizopotoka, jina Yahwe, na ufupi wa baraka ya mwisho vikihifadhiwa.
