  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הַ/בֹּטְחִ֥ים בַּ/יהוָ֑ה כְּֽ/הַר צִיּ֥וֹן לֹא יִ֝מּ֗וֹט לְ/עוֹלָ֥ם יֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/001.yaml
  text: A Song of Ascents. Those who trust in Yahweh are like Mount Zion[a], which cannot be shaken, but remains forever.
translation:
  language: sw
  text: Wimbo wa Kupanda. Wanaomtumaini Yahweh ni kama Mlima Sayuni; hautatikisika, utakaa milele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa Kupanda
  rationale: Kichwa hiki cha Zaburi 120–134 kinahifadhi wazo la kupanda, huenda katika safari ya kwenda Yerusalemu, bila kulifafanua zaidi ya Kiebrania.
- source_word: הַבֹּטְחִים בַּיהוָה
  choice: Wanaomtumaini Yahweh
  rationale: Kitenzi-shirikishi kinataja watu wenye sifa ya kudumu ya kumtumaini Yahweh; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: כְּהַר צִיּוֹן
  choice: ni kama Mlima Sayuni
  rationale: Neno כְּ linaonyesha ulinganisho, nao jina la mahali צִיּוֹן limetolewa kwa umbo la Kiswahili lililozoeleka, Sayuni.
- source_word: לֹא יִמּוֹט
  choice: hautatikisika
  rationale: Neno מוֹט linaweza kumaanisha kusogezwa, kuyumba, au kutikisika; hapa 'hautatikisika' linaeleza uthabiti wa mlima kwa lugha ya kawaida bila kupoteza taswira.
- source_word: לְעוֹלָם יֵשֵׁב
  choice: utakaa milele
  rationale: Tafsiri hii inadumisha maana halisi ya יֵשֵׁב, 'kukaa,' pamoja na wazo la kudumu la לְעוֹלָם, huku ikibaki ya kishairi na kueleweka.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Andiko linatumia jina la agano יְהוָה; 'Yahweh' linawakilisha jina hilo moja kwa moja badala ya kulibadilisha kuwa cheo.
- issue: Kiima cha vitenzi vya umoja לֹא יִמּוֹט ... יֵשֵׁב
  choice: 'Mlima Sayuni: ''hautatikisika, utakaa milele'''
  alternative: 'Wanaomtumaini Yahweh: ''hawatatetemeshwa, watadumu milele'''
  rationale: Vitenzi vya Kiebrania ni vya umoja wa kiume na kwa kawaida vinarejelea nomino ya karibu, Mlima Sayuni. Tafsiri inadumisha ulinganisho huo bila kuhamishia vitenzi moja kwa moja kwa watu walio katika wingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini cha kawaida kwa msomaji wa leo. Alama ya nukta mkato inadumisha muundo sambamba wa Kiebrania. Hakuna tanbihi iliyohitajika; mbadala wa kileksia umeelezwa katika maamuzi.
