  text: Kando yao ndege wa angani hukaa; kutoka katikati ya matawi[a] hutoa sauti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “majani” au “matawi yenye majani.” Nomino ya Kiebrania ni adimu na huenda ikarejelea kwa ujumla matawi yenye majani.
