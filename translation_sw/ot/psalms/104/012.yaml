lexical_decisions:
- source_word: עֲלֵיהֶם
  choice: Juu yao
  rationale: Kihusishi עַל pamoja na kiambishi hapa kina maana ya juu ya vijito au chemchemi zilizotajwa katika mstari uliotangulia, na kinadumisha picha ya kishairi.
- source_word: עוֹף הַשָּׁמַיִם
  choice: ndege wa angani
  rationale: עוֹף ni jina la jumla la viumbe warukao, na katika muktadha huu ‘ndege’ ndilo chaguo la kawaida; ‘wa angani’ ni Kiswahili sanifu na cha kishairi kwa genitivi ya Kiebrania.
- source_word: יִשְׁכּוֹן
  choice: hukaa
  rationale: Kitenzi שׁכן humaanisha kukaa au kuishi mahali. ‘Hukaa’ kinaonyesha makazi ya kawaida bila kuongeza wazo maalumu la kutengeneza viota.
- source_word: מִבֵּין
  choice: kutoka katikati ya
  rationale: Kirai hiki kinaonyesha sauti inayotoka ndani ya sehemu yenye matawi; tafsiri hii ni ya kawaida katika Kiswahili huku ikihifadhi maana ya mahali na chanzo.
- source_word: עֳפָאיִם
  choice: matawi
  rationale: Nomino hii adimu huenda ikarejelea matawi, matawi yenye majani, au majani kwa ujumla. ‘Matawi’ ni wazi na inafaa kwa muktadha, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: יִתְּנוּ קוֹל
  choice: hutoa sauti zao
  rationale: Nahau hiyo kwa karibu ni ‘hutoa sauti.’ Tafsiri hii inadumisha usemi wa Kiebrania bila kuufasiri moja kwa moja kuwa kuimba.
