base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/020.yaml
  text: You set darkness[a], and it becomes night; in it all the beasts of the forest creep about.
translation:
  language: sw
  text: Wewe huweka giza, na huwa usiku; humo wanyama wote wa msituni hutambaa huku na huku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huzunguka-zunguka”; kitenzi cha Kiebrania kinaweza kumaanisha kutambaa au kusogea huku na huko, hasa kwa wanyama wa usiku.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשֶׁת
  choice: Wewe huweka
  rationale: Kitenzi cha nafsi ya pili umoja kinamwelekea Mungu moja kwa moja na kina maana ya kuweka. Muundo huu unadumisha utendaji wa Mungu bila kuongeza wazo la kuruhusu tu.
- source_word: חֹשֶׁךְ
  choice: giza
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa giza, hapa likimaanisha kuingia kwa giza katika utaratibu wa uumbaji.
- source_word: וִיהִי לָיְלָה
  choice: nayo huwa usiku
  rationale: Muundo huu unaonyesha hali inayotokea baada ya Mungu kuweka giza, kwa Kiswahili cha kawaida na cha kishairi.
- source_word: בּוֹ
  choice: ndani yake
  rationale: Kiwakilishi kinarejelea usiku na kuhifadhi maana ya kwamba wanyama hutembea katika kipindi hicho.
- source_word: תִרְמֹשׂ
  choice: hutembea huku na huku
  rationale: Kitenzi רמשׂ kinaweza kumaanisha kutambaa au kusogea huku na huku. Chaguo hili linafaa kwa wanyama wa aina mbalimbali na halilazimishi maana ya kuwinda.
- source_word: כָּל חַיְתוֹ יָעַר
  choice: wanyama wote wa msituni
  rationale: Tafsiri ya asili na wazi ya kundi zima la wanyama wa porini wanaoishi msituni.
theological_decisions:
- issue: Utendaji wa Mungu katika kupanga uumbaji
  choice: Mungu huweka giza, nalo huwa usiku.
  alternative: Mungu huruhusu giza na usiku kutokea.
  rationale: Kitenzi cha nafsi ya pili kinamhusisha Mungu moja kwa moja kama mtendaji. Tafsiri inadumisha jambo hilo bila kuongeza maelezo ya kifalsafa kuhusu namna ya usababishaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Wakati wa mazoea umetumiwa kuonyesha utaratibu wa kawaida wa uumbaji unaosimuliwa katika muktadha wa zaburi.
