  text: אֲשֶׁר שָׁ֭ם צִפֳּרִ֣ים יְקַנֵּ֑נוּ חֲ֝סִידָ֗ה בְּרוֹשִׁ֥ים בֵּיתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/017.yaml
  text: where the birds make their nests[a]; the stork has its home in the cypresses.
translation:
  language: sw
  text: Humo ndege hujenga viota vyao; makao ya korongo yako katika miberoshi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mivinje,” “mijunipa,” au aina nyingine ya mti wa jamii ya misonobari; aina hasa inayomaanishwa na neno la Kiebrania haijulikani kwa hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר שָׁם
  choice: Humo
  rationale: Kirai hiki kinarejelea miti iliyotajwa katika mstari uliotangulia na kuonyesha mahali. “Humo” ni Kiswahili cha kawaida kinachohifadhi uhusiano huo bila kurudia “mitini.”
- source_word: צִפֳּרִים
  choice: ndege
  rationale: Ni neno la jumla kwa ndege; katika Kiswahili halihitaji kibainishi kinacholingana na ‘the’ ya Kiingereza.
- source_word: יְקַנֵּנוּ
  choice: hujenga viota vyao
  rationale: Kitenzi קנן humaanisha kutengeneza kiota au kukaa kiotani. Kauli hii ni ya kawaida na inaonyesha kitendo cha kawaida cha ndege.
- source_word: חֲסִידָה
  choice: korongo
  rationale: Neno hili kwa kawaida hutambulishwa kuwa ndege aina ya stork. “Korongo” ndilo neno la kawaida la Kiswahili kwa ndege huyo katika muktadha huu.
- source_word: בְּרוֹשִׁים
  choice: miberoshi
  rationale: Ni jina la miti ya jamii ya misonobari ambalo utambulisho wake mahususi haujulikani kwa hakika. “Miberoshi” ni tafsiri iliyozoeleka, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: בֵּיתָהּ
  choice: makao ya korongo
  rationale: Kihalisi ni ‘nyumba/makao yake.’ Muundo huu wa Kiswahili ni wa kawaida kwa makao ya mnyama na unahifadhi kishazi nomino cha Kiebrania bila kuongeza kitenzi cha kujenga.
