  text: covering yourself with light as with a garment[a], stretching out the heavens like a curtain.
translation:
  language: sw
  text: 'unajivika nuru kama vazi,

    unazitandaza mbingu kama pazia.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama pazia la hema.” Neno la Kiebrania linaweza kumaanisha kipande cha pazia kilichotumiwa katika hema au Maskani.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹטֶה
  choice: unajivika
  rationale: Kitenzi hiki katika umbo la participio kinamwonyesha Mungu akijifunika au kujivika. “Unajivika” ni Kiswahili cha kawaida kinachohifadhi taswira ya mavazi bila kurudia kitenzi na nomino kwa uzito usio wa lazima.
- source_word: אוֹר
  choice: nuru
  rationale: Nomino hii humaanisha nuru; hapa ndiyo kitu ambacho Mungu anajivika kwa njia ya kishairi. “Nuru” inafaa sajili ya kishairi na yenye heshima.
- source_word: כַשַּׂלְמָה
  choice: kama vazi
  rationale: שַׂלְמָה ni vazi au joho. “Vazi” halibani taswira kuwa aina fulani ya nguo na huwasilisha wazi kiambishi cha ulinganisho כ.
- source_word: נוֹטֶה
  choice: unazitandaza
  rationale: Participio ya נטה hueleza kutandaza au kunyoosha. “Unazitandaza” ni ya asili kwa taswira ya kueneza mbingu kama kitambaa.
- source_word: שָׁמַיִם
  choice: mbingu
  rationale: Neno hili linaweza kurejelea mbingu au anga. Katika wimbo huu wa uumbaji, “mbingu” huhifadhi upana na uzito wa taswira ya ulimwengu.
- source_word: כַיְרִיעָה
  choice: kama pazia
  rationale: יְרִיעָה ni kipande cha pazia au kitambaa, hasa kinachotumiwa katika hema au Maskani. “Pazia” ni tafsiri fupi na ya kawaida; maana mahsusi ya pazia la hema imewekwa katika tanbihi.
theological_decisions:
- issue: Taswira ya Mungu kujivika nuru na kuzitandaza mbingu
  choice: Kuhifadhi moja kwa moja lugha ya kishairi inayomwelezea Mungu kwa matendo ya kibinadamu
  alternative: Kufafanua kuwa Mungu amezungukwa na nuru au anaonyesha utukufu wake
  rationale: Kiebrania kinatumia mafumbo hai kueleza ukuu na nguvu za Mungu za kuumba. Tafsiri ya moja kwa moja huhifadhi taswira hiyo bila kuingiza ufafanuzi wa kiteolojia usiotajwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na sajili yenye heshima. Mistari sambamba na participio za Kiebrania zimewasilishwa kwa vitenzi vya wakati wa sasa. Kialama cha tanbihi [a] kimewekwa baada ya “pazia,” ambako mbadala wake unahusika.
