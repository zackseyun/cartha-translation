  text: You give to them[a], and they gather it; you open your hand, and they are filled with good.
translation:
  language: sw
  text: Unawapa, nao hukusanya; unafungua mkono wako, nao hushiba mema.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּתֵּן לָהֶם
  choice: Unapowapa
  rationale: Kitenzi cha nafsi ya pili umoja pamoja na kiambishi cha yambwa -wa kinatoa maana ya moja kwa moja ya ‘unawapa.’ Muundo wa ‘unapo-’ unaonyesha uhusiano wa karibu na tendo linalofuata bila kuongeza kitu kinachotolewa.
- source_word: יִלְקֹטוּן
  choice: wao hukusanya
  rationale: Mzizi לקט humaanisha kukusanya. Kiswahili kinaweza kuacha yambwa inapofahamika kutokana na muktadha; ‘wao’ inasisitiza mhusika na kudumisha mlingano wa kishairi.
- source_word: תִּפְתַּח
  choice: unaufungua
  rationale: Tafsiri ya moja kwa moja ya Qal ya פתח ni ‘kufungua’; kiambishi -u- kinaelekeza kwa ‘mkono’ unaofuata kwa Kiswahili cha kawaida.
- source_word: יָדְךָ
  choice: mkono wako
  rationale: Taswira halisi ya mkono imehifadhiwa kwa sababu ni sehemu muhimu ya lugha ya kishairi kuhusu utoaji wa Mungu.
- source_word: יִשְׂבְּעוּן
  choice: hushiba
  rationale: Mzizi שבע unaweza kumaanisha kushiba au kuridhika. ‘Hushiba’ ni neno la kawaida na halisi linalofaa muktadha wa viumbe kupewa chakula.
- source_word: טוֹב
  choice: mema
  rationale: טוֹב imetumika kama nomino yenye maana ya yaliyo mema. ‘Mema’ huhifadhi ufupi wa Kiebrania kuliko kuongeza ‘vitu vizuri.’
theological_decisions:
- issue: Lugha inayomwelezea Mungu kwa taswira ya kibinadamu
  choice: Kuhifadhi ‘unaufungua mkono wako’
  alternative: unawapa kwa ukarimu
  rationale: Kiebrania kinatumia taswira halisi ya mkono wa Mungu kuonyesha utunzaji wake. Kuihifadhi hakufifishi ushairi wala kuingiza ufafanuzi wa ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Hushiba mema’ ni kifupi na cha kishairi, huku kikihifadhi uwezekano wa kuelewa טוֹב kuwa yaliyo mema au vitu vizuri.
