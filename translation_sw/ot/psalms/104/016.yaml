  text: יִ֭שְׂבְּעוּ עֲצֵ֣י יְהוָ֑ה אַֽרְזֵ֥י לְ֝בָנ֗וֹן אֲשֶׁ֣ר נָטָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/016.yaml
  text: The trees of Yahweh are satisfied[a], the cedars of Lebanon that he planted,
translation:
  language: sw
  text: 'Miti ya Yahwe imeshiba[a],

    mierezi ya Lebanoni aliyoipanda.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “imepata vya kutosha.” Kitenzi cha Kiebrania kina maana ya kupewa mahitaji yote hadi kushiba.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂבְּעוּ
  choice: imeshiba
  rationale: Kitenzi שבע katika Qal kinaonyesha kupewa vya kutosha hadi kushiba. Katika muktadha wa maji yanayotolewa kwa uumbaji, “imeshiba” ni tamathali ya kawaida na yenye kueleweka kwa miti iliyopata maji tele.
- source_word: עֲצֵי
  choice: Miti ya
  rationale: Ni wingi wa hali ya muundo wa עֵץ, unaounganishwa moja kwa moja na jina la Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa kuwa “Yahwe,” badala ya kubadilishwa na cheo.
- source_word: אַרְזֵי לְבָנוֹן
  choice: mierezi ya Lebanoni
  rationale: Muundo huu unataja miti hiyo kwa usahihi zaidi kuwa mierezi inayohusishwa na Lebanoni.
- source_word: אֲשֶׁר נָטָע
  choice: aliyoipanda
  rationale: Kishazi rejeshi kinamrejelea Mungu kama mtendaji anayeeleweka kutokana na muktadha; umbo hili la Kiswahili linapatana na ngeli ya “mierezi.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; kulitohowa huhifadhi tofauti kati ya jina hilo na cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. “Imeshiba” huhifadhi taswira ya Kiebrania bila kuifanya miti ionekane kuwa na hisia za kibinadamu kupita kiasi.
