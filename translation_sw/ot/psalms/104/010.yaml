  text: Huyapeleka chemchemi katika mabonde[a]; hutiririka baina ya milima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika vijito vya msimu” au “katika makorongo”; neno la Kiebrania linaweza kumaanisha mikondo inayokauka katika baadhi ya majira au mabonde yanayohusiana nayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשַׁלֵּחַ
  choice: Huyapeleka
  rationale: Kirai cha Kiebrania ni participio ya Hifili yenye kibainishi na humrejelea Mungu katika mfululizo wa maelezo kuhusu matendo yake ya kudumu. Wakati wa mazoea katika Kiswahili unaonyesha tendo hilo linaloendelea kwa njia ya kawaida.
- source_word: מַעְיָנִים
  choice: chemchemi
  rationale: Neno hili humaanisha vyanzo vya asili vya maji; “chemchemi” ni neno la kawaida, wazi na linalofaa katika mandhari hii.
- source_word: בַּנְּחָלִים
  choice: katika mabonde
  rationale: נחל linaweza kumaanisha bonde, korongo, au bonde lenye kijito cha msimu. “Katika mabonde” linafikisha vizuri mandhari pana bila kuondoa uwezekano mwingine, ambao umeelezwa katika tanbihi.
- source_word: בֵּין
  choice: katikati ya
  rationale: Hueleza mahali maji yanapopita baina ya milima; “katikati ya” ni usemi wa asili katika Kiswahili.
- source_word: הָרִים
  choice: milima
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mandhari kubwa inayotajwa na הָרִים.
- source_word: יְהַלֵּכוּן
  choice: maji yake hutiririka
  rationale: Kitenzi kwa msingi humaanisha kwenda au kutembea, lakini kinapotumiwa kuhusu maji, “hutiririka” hutoa maana ya kimuktadha kwa Kiswahili cha asili. “Maji yake” huweka wazi kwamba kinachotiririka ni maji ya chemchemi bila kubadili taswira.
theological_decisions:
- issue: Kiima kisichotajwa moja kwa moja cha participio
  choice: Kiambishi “Hu-” katika “Huyapeleka” kinamrejelea Mungu
  alternative: Yeye azipelekaye / Akipeleka
  rationale: Muktadha wa Zaburi unamweleza Mungu akipanga na kutunza uumbaji. Kiswahili huhitaji kiima katika muundo wa kitenzi; kiambishi cha nafsi ya tatu huendeleza rejeo hilo kwa njia ya asili bila kuongeza jina lisilokuwapo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi inayosomeka kwa urahisi. Tafsiri imetumia ulinganifu bora, huku tanbihi ikihifadhi upana wa maana ya נחל.
