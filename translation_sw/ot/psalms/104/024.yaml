id: PSA.104.24
reference: Psalms 104:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: מָֽה רַבּ֬וּ מַעֲשֶׂ֨י/ךָ יְֽהוָ֗ה כֻּ֭לָּ/ם בְּ/חָכְמָ֣ה עָשִׂ֑יתָ מָלְאָ֥ה הָ֝/אָ֗רֶץ קִנְיָנֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/024.yaml
  text: How many are your works[a], O Yahweh! In wisdom you have made them all; the earth is full of your creatures.
translation:
  language: sw
  text: Ee Yahwe, jinsi kazi zako zilivyo nyingi! Zote umezifanya kwa hekima; dunia imejaa viumbe vyako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mali yako” au “vitu vilivyo vyako.” Neno la Kiebrania linaweza kumaanisha vitu ambavyo mtu amevipata au anavimiliki; katika muktadha huu huenda linarejelea kwa upana vitu ambavyo Mungu ameumba.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה רַבּוּ
  choice: jinsi ... zilivyo nyingi
  rationale: Muundo huu wa mshangao unaonyesha wingi na utofauti wa kazi za Mungu kwa Kiswahili cha kawaida, huku ukihifadhi nguvu ya mshangao ya Kiebrania.
- source_word: מַעֲשֶׂיךָ
  choice: kazi zako
  rationale: Neno hili linataja mambo ambayo Yahwe ametenda au kutengeneza; katika muktadha wa uumbaji, “kazi zako” ni pana na la moja kwa moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi unaotumika kwa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: כֻּלָּם
  choice: zote
  rationale: Linarejelea kazi zote zilizotajwa na kuhifadhi maana ya ujumla kamili.
- source_word: בְּחָכְמָה
  choice: kwa hekima
  rationale: Huhifadhi nomino “hekima” na kuonyesha namna ambayo Mungu alifanya kazi zake.
- source_word: עָשִׂיתָ
  choice: umezifanya
  rationale: Kauli timilifu ya Kiswahili inaonyesha tendo la kufanya lililokamilika ambalo matokeo yake yanaonekana katika uumbaji uliopo.
- source_word: מָלְאָה הָאָרֶץ
  choice: dunia imejaa
  rationale: Katika wimbo huu wa uumbaji, הָאָרֶץ ina maana pana ya dunia, na kitenzi kinaeleza hali yake ya sasa ya kujaa.
- source_word: קִנְיָנֶךָ
  choice: viumbe vyako
  rationale: Kimsingi neno linaweza kutaja mali au vitu vilivyopatikana na kumilikiwa; katika muktadha wa kazi za uumbaji, “viumbe vyako” linaeleza rejeo linalowezekana kwa lugha asilia bila kuficha maana nyingine.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina la Mungu, si cheo; “Yahwe” hulihifadhi kama jina huku “Yehova” likiwa namna nyingine ya jadi ya kulitamka.
- issue: Maana ya קִנְיָנֶךָ katika muktadha wa uumbaji
  choice: viumbe vyako
  alternative: mali yako; vitu vilivyo vyako
  rationale: Muktadha unazungumzia kazi mbalimbali za Mungu zilizojaza dunia, hivyo “viumbe vyako” linafaa kimuktadha; tanbihi inadumisha maana ya umiliki iliyo katika neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa heshima lakini unaoeleweka kwa urahisi. “Ee” hudumisha mwito wa moja kwa moja, na mpangilio wa sentensi huhifadhi mshangao na uwiano wa kishairi wa mstari wa Kiebrania.
