  text: מַצְמִ֤יחַ חָצִ֨יר לַ/בְּהֵמָ֗ה וְ֭/עֵשֶׂב לַ/עֲבֹדַ֣ת הָ/אָדָ֑ם לְ/ה֥וֹצִיא לֶ֝֗חֶם מִן הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/014.yaml
  text: He causes grass to grow for the cattle[a], and plants for the service of man, to bring forth bread from the earth,
translation:
  language: sw
  text: Huchipusha nyasi kwa ajili ya mifugo, na mimea kwa kazi ya mwanadamu,[a] ili kutoa mkate kutoka ardhini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kazi ya wanadamu.” Neno la Kiebrania אָדָם limetumiwa hapa kwa maana ya jumla, likiwakilisha wanadamu wote.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַצְמִיחַ
  choice: Huchipusha
  rationale: Kitenzi cha Kiebrania kiko katika muundo wa kusababisha; “huchipusha” huhifadhi wazo kwamba Mungu ndiye anayefanya mimea iote, kwa lugha ya kawaida ya Kiswahili.
- source_word: חָצִיר
  choice: majani
  rationale: Katika muktadha huu ni uoto unaoliwa na wanyama; “majani” ni neno la kawaida na linalofaa kwa malisho.
- source_word: לַבְּהֵמָה
  choice: kwa ajili ya mifugo
  rationale: בְּהֵמָה hapa inaelekea kumaanisha kwa ujumla wanyama wa kufugwa wanaokula majani; “mifugo” ni wazi na ya kawaida katika Kiswahili cha Afrika Mashariki.
- source_word: וְעֵשֶׂב
  choice: na mimea
  rationale: עֵשֶׂב ina maana pana kuliko mboga au mitishamba pekee; “mimea” huhifadhi upana huo.
- source_word: לַעֲבֹדַת הָאָדָם
  choice: kwa kazi ya mwanadamu
  rationale: Kirai cha Kiebrania ni kifupi na kinaweza kuhusisha kazi, huduma, matumizi, au shughuli ya kulima. Tafsiri hii huhifadhi kwa kiasi kikubwa maana yake pana bila kuifungia kwenye kilimo pekee.
- source_word: הָאָדָם
  choice: mwanadamu
  rationale: אָדָם hapa ni umoja wa kiwakilishi unaomaanisha jamii ya wanadamu, si lazima mwanamume mmoja maalumu. “Mwanadamu” huhifadhi umoja huo na maana jumuishi.
- source_word: לְהוֹצִיא
  choice: ili kutoa
  rationale: Muundo wa kusudi au matokeo umeonyeshwa kwa “ili.” Kutotaja mtendaji wa kitenzi hiki kunahifadhi uwezekano wa Kiebrania kuhusu anayetoa mkate—Mungu kupitia uoto huo au mwanadamu kupitia kazi yake.
- source_word: לֶחֶם
  choice: mkate
  rationale: Ingawa לֶחֶם wakati mwingine humaanisha chakula kwa ujumla, maana yake ya moja kwa moja hapa ni “mkate,” nayo inafaa picha ya mazao ya ardhi.
- source_word: מִן הָאָרֶץ
  choice: kutoka ardhini
  rationale: אֶרֶץ hapa ni ardhi kama chanzo cha mazao; “kutoka ardhini” ni ya kawaida na inaendana na taswira ya shairi.
theological_decisions:
- issue: Maana ya jumla ya אָדָם
  choice: mwanadamu
  alternative: wanadamu
  rationale: Umoja wa Kiebrania unawakilisha jamii yote ya wanadamu. “Mwanadamu” huhifadhi umbo la umoja bila kuifanya maana ihusu wanaume pekee; wingi jumuishi umeonyeshwa katika tanbihi.
- issue: Mtendaji wa לְהוֹצִיא
  choice: ili kutoa
  alternative: ili mwanadamu atoe / ili Mungu atoe
  rationale: Kiebrania hakimtaji wazi mtendaji wa kitenzi-jina hiki. Muundo usio na mtendaji wazi huhifadhi mvutano huo badala ya kuamua kimyakimya ikiwa ni Mungu au mwanadamu anayetoa mkate kutoka ardhini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Huchipusha” na “kutoka ardhini” huhifadhi taswira ya Zaburi, huku muundo “ili kutoa” ukiacha utata halisi wa mtendaji bila kufanya sentensi kuwa nzito.
