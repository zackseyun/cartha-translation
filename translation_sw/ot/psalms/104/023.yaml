base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/023.yaml
  text: Man goes out to his work and to his labor until evening[a][b].
translation:
  language: sw
  text: Mwanadamu[a] hutoka ili afanye kazi yake na shughuli yake mpaka jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza kumaanisha mwanadamu mmoja kama mwakilishi wa wote, au wanadamu kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵצֵא
  choice: hutoka kwenda
  rationale: 'Kitenzi hiki kinaonyesha tendo la kawaida linalorudiwa: baada ya wanyama kufanya shughuli zao usiku, mwanadamu hutoka wakati wa mchana. Muundo “hutoka kwenda” unahifadhi wazo la kuondoka na unaeleweka kwa urahisi katika Kiswahili.'
- source_word: אָדָם
  choice: Mwanadamu
  rationale: Hapa nomino hii ni umoja wa kiwakilishi unaowahusu wanadamu kwa ujumla, kwa kulinganisha shughuli za watu za mchana na zile za wanyama za usiku. “Mwanadamu” huhifadhi umoja huo huku ikitoa maana ya kijumla.
- source_word: לְפָעֳלוֹ
  choice: kwenda kazini kwake
  rationale: פֹּעַל humaanisha kazi, tendo, au shughuli. Kiambishi לְ baada ya יצא kinaonyesha kusudi au mahali anapoelekea; “kwenda kazini kwake” ni usemi wa kawaida wa Kiswahili unaobeba maana hiyo.
- source_word: וְלַעֲבֹדָתוֹ
  choice: na kufanya shughuli zake
  rationale: עֲבֹדָה inaweza kumaanisha kazi, utumishi, au shughuli. “Kufanya shughuli zake” huepuka marudio yasiyo ya kawaida ya “kazi” huku ikihifadhi mwingiliano wa maana wa maneno mawili ya Kiebrania.
- source_word: עֲדֵי עָרֶב
  choice: mpaka jioni
  rationale: עֲדֵי ni namna ya kishairi ya kusema “mpaka,” na עָרֶב ni “jioni.” Tafsiri hii inaweka wazi mwisho wa muda wa kazi ya siku.
theological_decisions:
- issue: Maana ya kijumla ya אָדָם katika kauli kuhusu wanadamu
  choice: Mwanadamu
  alternative: Wanadamu
  rationale: Muktadha unaeleza utaratibu wa kawaida wa maisha ya binadamu katika uumbaji. Kiebrania kinatumia nomino ya umoja kama mwakilishi wa wanadamu wote; “Mwanadamu” huhifadhi umbo hilo bila kuifanya kauli imhusu mtu mmoja maalumu.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wa kawaida kwa msomaji wa leo, huku ukihifadhi mpangilio wa siku: mwanadamu hutoka kufanya kazi mpaka jioni.'
