  text: מַשְׁקֶ֣ה הָ֭רִים מֵ/עֲלִיּוֹתָ֑י/ו מִ/פְּרִ֥י מַ֝עֲשֶׂ֗י/ךָ תִּשְׂבַּ֥ע הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/013.yaml
  text: He waters the mountains from his upper chambers[a]; the earth is satisfied with the fruit of your works.
translation:
  language: sw
  text: Hunywesha milima kutoka katika vyumba vyake vya juu; dunia hushiba kutokana na matunda ya kazi zako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: dunia hushiba kwa matunda ya kazi zako. Kihusishi cha Kiebrania kinaweza kuonyesha chanzo au njia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁקֶה
  choice: Hunywesha
  rationale: Kitenzi cha Hifili kina maana ya kusababisha kunywa au kuipa maji. “Hunywesha” kinahifadhi taswira ya kishairi kwamba milima inapewa maji, huku kikifanya kazi kama kitenzi chenye mtenda anayeeleweka kutokana na muktadha kuwa Mungu.
- source_word: הָרִים
  choice: milima
  rationale: Hii ndiyo maana ya kawaida ya neno hili na inafaa katika muktadha wa uumbaji.
- source_word: מֵעֲלִיּוֹתָיו
  choice: kutoka katika vyumba vyake vya juu
  rationale: Tafsiri hii inadumisha taswira ya makao ya juu katika jengo la ulimwengu na pia kiwakilishi cha nafsi ya tatu kilichomo katika Kiebrania.
- source_word: מִפְּרִי
  choice: kutokana na matunda ya
  rationale: Kihusishi מִן kinaweza kuonyesha chanzo au njia. “Kutokana na” kinaonyesha kwamba kushiba kwa dunia kunatokana na yale yanayotokezwa na kazi za Mungu; uwezekano wa maana ya njia umetajwa katika tanbihi.
- source_word: מַעֲשֶׂיךָ
  choice: kazi zako
  rationale: Hii ni tafsiri pana inayoweza kujumuisha kazi za Mungu za kuumba na kutunza uumbaji, na inadumisha mabadiliko ya Kiebrania kwenda nafsi ya pili.
- source_word: תִּשְׂבַּע
  choice: hushiba
  rationale: “Hushiba” hueleza kufikia utoshelevu au ujazo na kuhifadhi taswira hai ya dunia inayoshiba.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: Katika zaburi hii ya uumbaji, “dunia” inafaa zaidi kuliko maana ya eneo maalumu ya “nchi”.
theological_decisions:
- issue: Mtenda wa kitendo cha kunywesha hajaelezwa wazi katika mstari huu
  choice: Hunywesha milima
  alternative: Akiinywesha milima
  rationale: Muundo wa kitenzi cha Kiswahili unaonyesha mtenda wa nafsi ya tatu ambaye muktadha unamtambulisha kuwa Mungu, bila kuongeza jina lake ndani ya mstari.
- issue: Mabadiliko kutoka nafsi ya tatu kwenda nafsi ya pili
  choice: vyumba vyake ... kazi zako
  alternative: vyumba vyako ... kazi zako
  rationale: Kiebrania chenyewe hubadilika kutoka “vyake” kwenda “zako.” Tafsiri inadumisha mabadiliko hayo ya kishairi badala ya kuyasawazisha kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka kwa urahisi. “Hunywesha milima” na “dunia hushiba” zinadumisha uhuishaji wa kishairi wa maandishi ya Kiebrania; “vyumba vya juu” kinahifadhi taswira ya usanifu wa ulimwengu.
