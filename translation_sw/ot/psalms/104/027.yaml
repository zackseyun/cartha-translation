lexical_decisions:
- source_word: כֻּלָּם
  choice: Wote
  rationale: Hurejelea viumbe wote waliotajwa katika muktadha na kuhifadhi maana ya ujumla bila uzito usio wa lazima.
- source_word: אֵלֶיךָ יְשַׂבֵּרוּן
  choice: wanakungojea kwa kutarajia
  rationale: Piel ya שׂבר pamoja na אֵלֶיךָ inaonyesha kumwelekea Mungu kwa kungoja au kutumaini kwa matarajio; usemi huu ni wa kawaida na unaonyesha utegemezi huo.
- source_word: לָתֵת
  choice: uwape
  rationale: Kiswahili hutumia kwa kawaida muundo wa kitenzi tegemezi baada ya 'kungojea' kueleza kile kinachotarajiwa; kiambishi 'wa-' kinarejelea viumbe wote.
- source_word: אָכְלָם
  choice: chakula chao
  rationale: Ni neno la jumla la chakula, linalofaa kwa aina zote za viumbe katika zaburi, si wanyama wawindaji pekee.
- source_word: בְּעִתּוֹ
  choice: kwa wakati wake
  rationale: Huhifadhi kwa ukaribu wazo la wakati wake unaofaa au uliowekwa bila kulifafanua kupita maandishi.
theological_decisions:
- issue: Utoaji wa Mungu kwa viumbe
  choice: Mstari unaonyesha viumbe wote wakimtegemea Mungu awape chakula.
  alternative: Kutafsiri kwa upanuzi kwamba viumbe wanamwabudu Mungu au wana imani ya kidini kwake.
  rationale: Kiebrania kinaonyesha kungoja kwa matarajio na utegemezi kwa Mungu, lakini hakiongezi wazi lugha ya ibada au mfumo mpana wa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mgawanyo wa mistari unaendeleza mtiririko wa kishairi, na viashiria vyote vya tanbihi vimewekwa katika maandishi.
