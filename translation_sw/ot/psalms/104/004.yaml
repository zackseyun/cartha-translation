  text: He makes his messengers winds[b][a], his ministers a flaming fire.
translation:
  language: sw
  text: Huwafanya wajumbe wake kuwa pepo[b][a], na watumishi wake kuwa moto uwakao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Huwafanya malaika wake kuwa roho, na watumishi wake kuwa mwali wa moto.” Waebrania 1:7 inafuata tafsiri hii ya jadi.
    reason: alternative_reading
  - marker: b
    text: Neno la Kiebrania רוּחוֹת linaweza kumaanisha “pepo” au “roho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  choice: Huyafanya ... kuwa
  rationale: Kauli ya wakati unaoendelea hapa inaeleza tendo la Mungu la kawaida; muundo huu wa Kiswahili ni wa asili na unadumisha maana ya ‘hufanya kuwa.’
- source_word: מַלְאָכָיו
  choice: wajumbe wake
  rationale: מַלְאָךְ inaweza kumaanisha mjumbe au malaika. ‘Wajumbe’ haifungi mapema maana kuwa viumbe wa mbinguni na inafaa kwa upepo unaotumiwa na Mungu.
- source_word: רוּחוֹת
  choice: upepo
  rationale: רוּחַ inaweza kumaanisha upepo, pumzi, au roho. Katika wimbo huu wa uumbaji na sambamba na moto, ‘upepo’ inafaa zaidi kwa muktadha, huku ‘roho’ ikihifadhiwa katika tanbihi.
- source_word: מְשָׁרְתָיו
  choice: watumishi wake
  rationale: Neno hili humaanisha wanaohudumu au watumishi. ‘Watumishi wake’ ni Kiswahili cha kawaida na chenye heshima kinachodumisha wazo la huduma.
- source_word: אֵשׁ לֹהֵט
  choice: moto uwakao
  rationale: Muungano huu unaeleza moto unaowaka kwa nguvu. ‘Moto uwakao’ ni wa kishairi lakini unaeleweka kwa urahisi.
theological_decisions:
- issue: Ikiwa mstari unazungumzia malaika/roho au upepo na moto kama wajumbe na watumishi wa Mungu
  choice: Huyafanya upepo kuwa wajumbe wake, na moto uwakao kuwa watumishi wake.
  alternative: Huwafanya malaika wake kuwa roho, na watumishi wake kuwa mwali wa moto.
  rationale: Sintaksia ya Kiebrania na maana mbalimbali za מַלְאָךְ na רוּחַ zinaruhusu zaidi ya ufasiri mmoja. Muktadha wa Zaburi 104 unaozungumzia uumbaji unapendelea nguvu za asili kuwa mawakala wa Mungu; tanbihi zinahifadhi ufasiri wa jadi unaoakisiwa katika Waebrania 1:7.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umechaguliwa kuonyesha katika usomaji mkuu kwamba Mungu hutumia upepo na moto kama mawakala wake, huku utata halisi wa Kiebrania ukihifadhiwa katika tanbihi.
