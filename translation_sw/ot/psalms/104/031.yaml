  source_fidelity: 'The translation accurately preserves the two jussive/wish clauses: “Utukufu wa Yahweh na uwe milele” reflects יְהִי ... לְעוֹלָם without unnecessarily resolving it as “udumu,” and “Yahweh na afurahie kazi zake” naturally conveys יִשְׂמַח בְּמַעֲשָׂיו. “Kazi zake” fits the broad sense of God’s works, particularly creation in this psalm.'
