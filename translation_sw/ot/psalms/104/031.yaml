  variant: Standard East African Swahili
source:
  edition: WLC
  text: יְהִ֤י כְב֣וֹד יְהוָ֣ה לְ/עוֹלָ֑ם יִשְׂמַ֖ח יְהוָ֣ה בְּ/מַעֲשָֽׂי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/031.yaml
  text: May the glory of Yahweh be forever[b][a]; may Yahweh rejoice in his works.
translation:
  language: sw
  text: Utukufu wa Yahweh na uwe milele[a]; Yahweh na afurahie kazi zake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Utukufu wa Yahweh na udumu milele.” Jina la Mungu katika Kiebrania ni YHWH, ambalo kwa desturi limetafsiriwa “BWANA.”
    reason: alternative_reading
  - marker: b
    text: Au, “Yahweh na afurahi juu ya kazi zake.” Kihusishi cha Kiebrania hapa kinaweza kueleweka kwa uhusiano huu wenye tofauti ndogo ya msisitizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: na uwe
  rationale: Hali ya amri-tamanio ya kitenzi היה inaeleza ombi au tamanio. “Na uwe” huiwakilisha moja kwa moja bila kuamua kimyakimya kuwa maana yake lazima iwe “udumu.”
- source_word: כְבוֹד
  choice: utukufu
  rationale: “Utukufu” ni neno la kawaida na lenye hadhi kwa כָּבוֹד katika muktadha wa sifa, likidokeza fahari na adhama ya Mungu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu YHWH limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: לְעוֹלָם
  choice: milele
  rationale: “Milele” huwasilisha kwa ufupi na kwa Kiswahili cha kawaida wazo la muda usio na mwisho au unaodumu daima.
- source_word: יִשְׂמַח
  choice: na afurahie
  rationale: Muundo huu wa Kiswahili unaendeleza sambamba ya tamanio katika kishazi cha kwanza na kuonyesha kwamba mwandishi anatamani Yahweh apate furaha.
- source_word: בְּמַעֲשָׂיו
  choice: kazi zake
  rationale: Katika muktadha wa Zaburi 104, מַעֲשֶׂה inahusu kazi za Yahweh, hasa alivyovifanya katika uumbaji. “Kazi zake” ni pana, ya asili, na haibani maana kuwa viumbe pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina YHWH, si cheo. “Yahweh” huhifadhi jina hilo, huku tanbihi ikitaja desturi nyingine inayojulikana.
- issue: Nguvu ya tamanio katika יְהִי na יִשְׂמַח
  choice: na uwe; na afurahie
  alternative: udumu; afurahie
  rationale: Miundo yote miwili ya Kiebrania inaeleza tamanio au ombi. Kurudia “na” kunahifadhi usambamba wa kishairi na hali hiyo ya tamanio.
- issue: Uhusiano unaoonyeshwa na בְּמַעֲשָׂיו
  choice: afurahie kazi zake
  alternative: afurahi juu ya kazi zake
  rationale: Kitenzi “kufurahia” katika Kiswahili huunganisha kitu kinachofurahikiwa moja kwa moja na kwa kawaida huwasilisha maana ya kufurahi katika au kwa sababu ya kazi hizo. Tanbihi huhifadhi uwezekano wa msisitizo wa “juu ya.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “na uwe ...; na afurahie ...” una sauti ya kishairi na ya ombi, huku sentensi ikibaki wazi kwa msomaji wa kawaida.
