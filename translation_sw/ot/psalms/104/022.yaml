  text: The sun rises[b][a]; they gather themselves and lie down in their dens.
translation:
  language: sw
  text: Jua huchomoza; wao hujiondoa[a] na kujilaza katika mapango yao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hukusanywa,” “hujikusanya,” au “hurudi mafichoni.” Kitenzi cha Kiebrania kinaweza kueleweka kwa hali ya kutendwa au kwa maana ya wao wenyewe kuondoka.
    reason: lexical_alternative
  - marker: b
    text: Au, “maficho yao” au “makao yao.” Neno la Kiebrania humaanisha mahali pa kukaa; katika muktadha huu wa wanyama, “mapango” linafaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּזְרַח
  choice: huchomoza
  rationale: Kitenzi זרח hapa, kikiwa na jua kama kiima, kinaeleza kuchomoza kwa jua. Kauli ya mazoea “huchomoza” inafaa mfululizo wa kishairi unaoeleza mwenendo wa kawaida wa viumbe.
- source_word: הַשֶּׁמֶשׁ
  choice: Jua
  rationale: Nomino hii humaanisha jua; Kiswahili hakihitaji kibainishi tofauti kuonyesha uamilifu wake.
- source_word: יֵאָסֵפוּן
  choice: wao hujiondoa
  rationale: Nifali ya אסף inaweza kumaanisha kukusanywa, kujikusanya, au kuondoka/kurudi mafichoni. “Hujiondoa” ni ya asili katika Kiswahili na inaonyesha wanyama kuacha shughuli zao za usiku bila kudokeza kwa lazima kwamba kuna anayewakusanya; tanbihi huhifadhi uwezekano mwingine.
- source_word: וְאֶל
  choice: na ... katika
  rationale: Kihalisi ni “na kuelekea.” Katika Kiswahili, mwelekeo unaeleweka kutokana na kuondoka na kufikia mahali pa kujilaza, hivyo “katika” huleta sentensi ya asili bila kupoteza lengo la mwendo.
- source_word: מְעוֹנֹתָם
  choice: mapango yao
  rationale: מָעוֹן ni makao au mahali pa kukaa. Katika muktadha wa simba wa mstari uliotangulia, “mapango yao” ni lugha wazi na ya kawaida kwa makazi yao; maana pana zaidi imeonyeshwa katika tanbihi.
- source_word: יִרְבָּצוּן
  choice: kujilaza
  rationale: רבץ hutumiwa hasa kwa mnyama anayelala chini au kujikunyata ili kupumzika. “Kujilaza” huhifadhi picha hiyo bila kulazimisha maana ya kusinzia.
