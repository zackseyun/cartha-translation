  text: יֶעֱרַ֣ב עָלָ֣י/ו שִׂיחִ֑/י אָ֝נֹכִ֗י אֶשְׂמַ֥ח בַּ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/034.yaml
  text: May my meditation be pleasing to him[a]; I will rejoice in Yahweh.
translation:
  language: sw
  text: Tafakari yangu na impendeze[a]; mimi nitafurahi katika Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tafakari yangu na iwe tamu kwake,” au “na ikubalike kwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶעֱרַב
  choice: na impendeze
  rationale: Kitenzi hiki kinaweza kumaanisha kuwa tamu, kupendeza, au kukubalika. Katika ombi hili, “na impendeze” ni Kiswahili cha kawaida kinachoonyesha tamanio kwamba tafakari ya mtunga zaburi ipokewe kwa kibali na Mungu.
- source_word: עָלָיו
  choice: impendeze
  rationale: Kiambishi cha yambwa “-m-” katika “impendeze” kinamrejelea Mungu na kwa ufasaha kinawasilisha anayependezwa na tafakari hiyo; tafsiri ya neno kwa neno ya kihusishi עַל isingekuwa ya kawaida katika Kiswahili.
- source_word: שִׂיחִי
  choice: tafakari yangu
  rationale: Nomino שִׂיחַ inaweza kuwa tafakari, mawazo yanayotamkwa, au mazungumzo. Muktadha wa ibada katika zaburi hii unaunga mkono “tafakari yangu,” bila kuifanya kuwa “malalamiko.”
- source_word: אָנֹכִי
  choice: mimi
  rationale: Kiwakilishi huru kina mkazo. Kutaja “mimi” wazi kabla ya kitenzi kunahifadhi mkazo huo kwa njia ya kawaida katika Kiswahili.
- source_word: אֶשְׂמַח
  choice: nitafurahi
  rationale: Umbo lisilotimilika linaweza kuonyesha azimio au hali inayoendelea; “nitafurahi” linahifadhi maana ya azimio la mtunga zaburi.
- source_word: בַּיהוָה
  choice: katika Yahweh
  rationale: Kihusishi בְּ kinaonyesha yule ambaye furaha inaelekezwa kwake au ambaye ndani yake furaha hupatikana. “Katika Yahweh” linahifadhi muundo na mvutano wa kishairi wa chanzo, huku jina la agano likitolewa kama Yahweh.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni. “Yahweh” linahifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Anayependezwa na tafakari
  choice: Mungu ndiye anayerejelewa na kiambishi katika “impendeze”
  alternative: Tafsiri isiyotaja wazi mrejelewa
  rationale: Kiambishi cha nafsi ya tatu umoja wa kiume katika עָלָיו kinamrejelea Mungu katika muktadha. Kiswahili kinahitaji mrejelewa huyo aonyeshwe ndani ya kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mstari umehifadhi mtindo wa sala na ushairi; “mimi” limetumika kudumisha mkazo wa אָנֹכִי, na alama [a] imewekwa mara tu baada ya kishazi kinachohusika.
