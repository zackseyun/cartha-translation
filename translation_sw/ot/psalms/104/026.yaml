  text: שָׁ֭ם אֳנִיּ֣וֹת יְהַלֵּכ֑וּ/ן לִ֝וְיָתָ֗ן זֶֽה יָצַ֥רְתָּ לְ/שַֽׂחֶק בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/026.yaml
  text: There the ships move about[a], and Leviathan, which you formed to play in it.
translation:
  language: sw
  text: Humo meli husafiri, na Lewiathani, uliyemuumba ili acheze humo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lewiathani, uliyemuumba ili ucheze naye.” Wengine huona kishazi cha mwisho kikimaanisha Mungu kucheza na Lewiathani, badala ya Lewiathani kucheza baharini.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Humo
  rationale: Kielezi hiki kinarejelea bahari iliyotajwa katika mstari uliotangulia; “humo” huonyesha mahali kwa njia ya kawaida na wazi.
- source_word: אֳנִיּוֹת
  choice: meli
  rationale: Neno la kawaida la Kiswahili kwa vyombo vikubwa vinavyosafiri baharini; halihitaji kiambishi cha uamilifu ili kuzungumzia meli kwa ujumla.
- source_word: יְהַלֵּכוּן
  choice: husafiri
  rationale: Hali ya tendo linaloendelea au la kawaida imewasilishwa kwa kiambishi “hu-”; “husafiri” ni ya asili kuliko tafsiri sisisi ya kutembea huku na huku.
- source_word: לִוְיָתָן
  choice: Lewiathani
  rationale: Jina limetoholewa ili kuhifadhi nguvu yake ya kishairi na uhusiano wake na sehemu nyingine za Maandiko, bila kulifafanua kuwa mnyama fulani.
- source_word: זֶה
  choice: uliye-
  rationale: Ingawa maana ya msingi ni “huyu,” hapa Kiswahili cha kawaida huunganisha kishazi hiki kama kishazi rejeshi kinachomfafanua Lewiathani.
- source_word: יָצַרְתָּ
  choice: uliyemuumba
  rationale: “Kuumba” ni ya asili na yenye heshima katika Kiswahili, huku ikibeba wazo la Mungu kumfanyiza kiumbe huyo.
- source_word: לְשַׂחֶק
  choice: acheze
  rationale: Huhifadhi picha hai ya shughuli ya kucheza bila kutumia neno la kizamani au lisiloeleweka kwa urahisi.
- source_word: בּוֹ
  choice: humo
  rationale: Kiwakilishi cha umoja wa kiume kinaeleweka kwa urahisi kuwa kinarejelea bahari, mahali ambapo Lewiathani anacheza; “humo” huweka rejeo hilo bila kurudia neno “bahari.”
theological_decisions:
- issue: Rejeo la בּוֹ baada ya “kucheza”
  choice: Lewiathani aliumbwa acheze baharini
  alternative: Lewiathani aliumbwa ili Mungu acheze naye
  rationale: 'Muktadha wa karibu ni bahari: meli husafiri humo, na kwa mwendelezo wa kawaida Lewiathani hucheza humo. Hata hivyo, muundo wa Kiebrania unaweza pia kueleweka kuwa Mungu hucheza na Lewiathani; uwezekano huo wa kweli umehifadhiwa katika tanbihi.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Humo” huunganisha mstari huu kwa kawaida na bahari ya mstari uliotangulia; jina “Lewiathani” limehifadhiwa badala ya kufasiriwa.
