base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/032.yaml
  text: He looks at the earth[a], and it trembles; he touches the mountains, and they smoke.
translation:
  language: sw
  text: Yeye huitazama dunia[a], nayo hutetemeka; huigusa milima, nayo hutoa moshi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Yeye anayeitazama dunia, nayo hutetemeka; huigusa milima, nayo hutoa moshi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּבִּיט
  choice: Huutazama
  rationale: Kitenzi cha wakati unaoendelea katika Kiebrania kinamwelezea Mungu kuwa ndiye anayeitazama dunia. Kiswahili cha sasa ‘huutazama’ ni cha asili, kinaendeleza wazo la tendo la kawaida au la tabia, na kuepuka kuongeza kiwakilishi kisichotajwa wazi katika kishazi hiki.
- source_word: לָאָרֶץ
  choice: dunia
  rationale: Ingawa אֶרֶץ pia inaweza kumaanisha ‘nchi,’ muktadha mpana wa uumbaji katika Zaburi 104 unaonyesha dunia yote.
- source_word: וַתִּרְעָד
  choice: nayo hutetemeka
  rationale: Mzizi רעד una maana ya kutetemeka au kutikisika. ‘Hutetemeka’ huhifadhi picha hai ya dunia ikiitikia mtazamo wa Mungu; ‘nayo’ huonyesha wazi uhusiano wa kishazi bila kufanya sentensi kuwa nzito.
- source_word: יִגַּע
  choice: huigusa
  rationale: נגע hapa ina maana ya kugusa. ‘Huigusa’ hudumisha picha ya nguvu za Mungu zisizohitaji juhudi.
- source_word: בֶּהָרִים
  choice: milima
  rationale: הָרִים kwa kawaida ni milima, si vilima; neno hili huhifadhi ukubwa wa taswira.
- source_word: וְיֶעֱשָׁנוּ
  choice: nayo hutoa moshi
  rationale: Kitenzi עשׁן kinaeleza kutoa moshi. ‘Hutoa moshi’ ni Kiswahili cha kawaida na wazi kuliko kusema milima ‘huvuta moshi,’ ambako kungeweza kueleweka kuwa inaingiza moshi.
theological_decisions:
- issue: Mtendaji wa kimungu anayedokezwa na kishirikishi הַמַּבִּיט
  choice: Kutumia vitenzi vya ngeli ya tatu ‘huutazama’ na ‘huigusa,’ huku Mungu akiwa mtendaji anayeeleweka kutokana na muktadha.
  alternative: 'Yeye huitazama dunia...; au: Yeye anayeitazama dunia...'
  rationale: Muktadha wa zaburi unamtambulisha Mungu kama mtendaji. Kiswahili kinaweza kuacha kiwakilishi cha nafsi bila kupoteza rejeleo, na hivyo kuhifadhi kwa kiasi muundo wa Kiebrania usiotaja jina katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya kishairi lakini iliyo wazi kwa wasomaji wa kawaida. Muundo sambamba wa vishazi umehifadhiwa, na hali ya ‘hu-’ imetumiwa kuonyesha maelezo hai ya tabia na nguvu za Mungu.
