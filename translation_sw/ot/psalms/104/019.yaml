lexical_decisions:
- source_word: עָשָׂה
  choice: Aliufanya
  rationale: Kitenzi עשה katika Qal kwa kawaida humaanisha ‘kufanya’ au ‘kuumba/kutengeneza.’ ‘Aliufanya’ ni tafsiri ya moja kwa moja na ya kawaida, huku Mungu akiwa mtendaji anayeeleweka kutokana na muktadha.
- source_word: יָרֵחַ
  choice: mwezi
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mwezi kama kitu cha angani.
- source_word: לְמוֹעֲדִים
  choice: kwa ajili ya nyakati zilizowekwa
  rationale: מוֹעֵד inaweza kumaanisha wakati uliowekwa, majira, au nyakati za sikukuu. Usemi huu unahifadhi maana pana kuliko ‘majira’ au ‘sikukuu’ pekee.
- source_word: שֶׁמֶשׁ
  choice: jua
  rationale: Tafsiri ya kawaida na ya moja kwa moja.
- source_word: יָדַע
  choice: linajua
  rationale: Inahifadhi maana halisi ya ידע na tashhisi ya kishairi ya jua, badala ya kuibadili kuwa maelezo ya kiutendaji.
- source_word: מְבוֹאוֹ
  choice: wakati wake wa kutua
  rationale: Ingawa מבוא kimsingi huhusu kuingia au mahali pa kuingilia, inapotumiwa kuhusu jua humaanisha kutua kwake. ‘Wakati wake wa kutua’ ni Kiswahili cha asili katika sentensi hii na kinaonyesha uhusiano na nyakati zilizowekwa katika mstari wa kwanza.
theological_decisions:
- issue: Maana ya מוֹעֲדִים katika muktadha wa uumbaji
  choice: nyakati zilizowekwa kwa maana pana
  alternative: majira; sikukuu
  rationale: Mstari unaeleza mpangilio wa Mungu wa mianga ya angani. Mwezi huashiria nyakati maalumu zinazoweza kujumuisha majira na tarehe za sikukuu; tafsiri pana huepuka kuifanya maana kuwa ya hali ya hewa au ya ibada pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Tashhisi ya jua imehifadhiwa kwa usemi ‘linajua.’
