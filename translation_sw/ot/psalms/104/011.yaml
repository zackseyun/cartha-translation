  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַשְׁקוּ
  choice: Huwanywesha
  rationale: Hifili ya שׁקה ina maana ya kuwapa viumbe maji ya kunywa. Kwa kuwa kiima kinarejelea maji yanayotiririka katika mstari uliotangulia, Kiswahili ‘huwanywesha’ huhifadhi hali ya kisababishi ya Kiebrania kwa ufasaha.
- source_word: כָּל חַיְתוֹ שָׂדָי
  choice: wanyama wote wa porini
  rationale: Kirai hiki kinamaanisha wanyama wa nchi ya wazi au wa mwituni; ‘wanyama wote wa porini’ ni cha kawaida, wazi, na kinahifadhi maana ya jumla ya כָּל.
- source_word: יִשְׁבְּרוּ ... צְמָאָם
  choice: hukata kiu yao
  rationale: Kitenzi שׁבר pamoja na ‘kiu’ ni nahau ya kutosheleza au kukomesha kiu. ‘Kukata kiu’ ni nahau ya kawaida ya Kiswahili yenye picha ileile ya nguvu.
- source_word: פְרָאִים
  choice: punda-mwitu
  rationale: Neno hili hurejelea punda wa mwituni (onager). ‘Punda-mwitu’ linaeleweka kwa urahisi kuliko istilahi ya kitaalamu.
