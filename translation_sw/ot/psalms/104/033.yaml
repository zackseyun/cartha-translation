  text: I will sing to Yahweh as long as I live[b][a]; I will make music to my God while I still live.
translation:
  language: sw
  text: 'Nitamwimbia Yahweh maadamu ninaishi;

    nitamwimbia Mungu wangu kwa muziki maadamu ningali hai.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maadamu bado nipo.” Usemi wa Kiebrania unaweza kusisitiza kuendelea kuwapo kwa maana pana zaidi ya kuwa hai tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשִׁירָה
  choice: Nitamwimbia
  rationale: Kitenzi cha Qal, nafsi ya kwanza umoja, chenye maana ya azimio au nia ya hiari; wakati ujao wa Kiswahili unaonyesha azimio hilo kwa kawaida.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Kiambishi ל kinaonyesha anayeelekezewa wimbo, na jina la agano יְהוָה limetoholewa kwa umbo la kawaida la Kiswahili, “Yahwe.”
- source_word: בְּחַיָּי
  choice: muda wote nitakaoishi
  rationale: Ingawa kihalisi ni “katika maisha yangu,” hapa kishazi kina maana ya muda wote wa uhai; tafsiri hii ni ya kawaida na wazi kwa Kiswahili.
- source_word: אֲזַמְּרָה
  choice: nitampigia ... muziki
  rationale: Piel ya זמר inaashiria kupiga au kuimba muziki wa sifa. “Kupigia muziki” huhifadhi kipengele cha kimuziki na kuitofautisha na kitenzi cha kwanza.
- source_word: לֵאלֹהַי
  choice: Mungu wangu
  rationale: Kiambishi cha nafsi ya kwanza umoja kinaonyesha uhusiano wa umilikaji, na ל huonyesha anayeelekezewa muziki.
- source_word: בְּעוֹדִי
  choice: maadamu ningali hai
  rationale: עוֹד pamoja na kiambishi cha nafsi ya kwanza huonyesha kuendelea kuwapo. “Maadamu ningali hai” ni Kiswahili cha asili, huku tanbihi ikihifadhi uwezekano mpana zaidi wa “maadamu bado nipo.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano, tetragramatoni; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mistari miwili inadumisha ulinganifu wa Kiebrania huku ikitofautisha kuimba na kupiga muziki.
