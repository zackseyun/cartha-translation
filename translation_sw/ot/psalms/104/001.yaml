  text: בָּרֲכִ֥י נַפְשִׁ֗/י אֶת יְה֫וָ֥ה יְהוָ֣ה אֱ֭לֹהַ/י גָּדַ֣לְתָּ מְּאֹ֑ד ה֭וֹד וְ/הָדָ֣ר לָבָֽשְׁתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/001.yaml
  text: Bless Yahweh[a], O my soul! Yahweh my God, you are very great; you have clothed yourself with splendor and majesty.
translation:
  language: sw
  text: 'Ee nafsi yangu, mbariki Yahweh![a]


    Ee Yahweh, Mungu wangu, wewe ni mkuu sana;

    umejivika utukufu na adhama.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH, jina la Mungu. “Yahweh” na “Yehova” ni namna za kulitaja jina hili zinazotumiwa katika mapokeo tofauti; mara nyingi pia hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרֲכִי
  choice: mhimidi
  rationale: Amri ya umoja wa kike inayoelekezwa kwa nafsi ya mtunga zaburi. Katika Kiswahili, “mhimidi” huwasilisha kwa kawaida tendo la kumbariki Mungu kwa sifa na heshima, bila kudokeza kwamba mwanadamu humpa Mungu baraka.
- source_word: נַפְשִׁי
  choice: Ee nafsi yangu
  rationale: Inadumisha usemi wa moja kwa moja kwa nafsi ya mtunga zaburi; “Ee” ni alama ya kawaida ya mwito katika ushairi wa Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano YHWH limetolewa kama jina maalumu badala ya kubadilishwa kuwa cheo.
- source_word: יְהוָה אֱלֹהַי
  choice: Ee Yahweh, Mungu wangu
  rationale: Inahifadhi jina la Mungu, neno “Mungu,” na kiambishi cha umilikaji kinachoonyesha uhusiano binafsi; “Ee” na koma zinaweka wazi kuwa ni mwito wa moja kwa moja.
- source_word: גָּדַלְתָּ מְּאֹד
  choice: wewe ni mkuu sana
  rationale: Ingawa kitenzi kina umbo la timilifu, hapa kinaeleza hali ya sasa katika sifa. Kauli hii ni ya asili na inaonyesha nguvu ya מְאֹד.
- source_word: הוֹד
  choice: fahari
  rationale: Katika jozi hii na הָדָר, “fahari” huonyesha uangavu na utukufu unaofikiriwa kama vazi.
- source_word: וְהָדָר
  choice: na adhama
  rationale: “Adhama” huwasilisha ukuu wa kifalme na kuunda jozi ya asili ya Kiswahili pamoja na “fahari.”
- source_word: לָבָשְׁתָּ
  choice: umejivika
  rationale: Inahifadhi umbo la timilifu na taswira ya Mungu kujivika fahari na adhama kama mavazi.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni kama jina maalumu. “Yahweh” hulihifadhi jina hilo badala ya kulibadilisha kuwa cheo, huku tanbihi ikieleza mapokeo mengine ya kulitaja.
- issue: Maana ya mwanadamu ‘kumbariki’ Mungu
  choice: mhimidi
  alternative: mbariki
  rationale: Kiebrania ברך limehifadhiwa kwa maana yake ya kidoksolojia, lakini Kiswahili “mhimidi” huepuka dhana isiyokusudiwa kwamba nafsi inampa Mungu baraka; maana hapa ni kumsifu na kumtukuza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa mistari unafuata mwito wa nafsi, mwito kwa Mungu, na taswira ya mavazi. Alama [a] imewekwa mara baada ya kutajwa kwa kwanza kwa Yahweh.
