    text: 'Kiebrania: YHWH, jina la Mungu. “Yahweh” na “Yehova” ni namna za kulitaja jina hili zinazotumiwa katika mapokeo tofauti; mara nyingi pia hutafsiriwa “BWANA.”'
    reason: alternative_reading
  revision_rationale: Marekebisho yanarejesha maana mahsusi ya imperative ya Kiebrania ברך kwa “mbariki,” yanatumia jozi ya Kiswahili iliyo wazi zaidi kwa הוֹד וְהָדָר, na yanaweka tanbihi ya jina la Mungu kwa namna isiyodai matamshi yasiyo na mabishano. Muundo wa kishairi, mwito wa moja kwa moja, na taswira ya kujivika vimehifadhiwa.
