  yaml_path: translation/ot/psalms/104/005.yaml
  text: He founded the earth on its foundations[a]; it will not be shaken forever and ever.
translation:
  language: sw
  text: Aliiweka dunia juu ya misingi yake[a]; haitatikisika milele na milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Aliithibitisha dunia juu ya besi zake”; Kiebrania kinatumia taswira ya usanifu kueleza uthabiti wa dunia.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַד
  choice: Aliiweka
  rationale: Kitenzi hiki humaanisha kuweka msingi au kuimarisha. Katika Kiswahili, “aliiweka ... juu ya misingi” ni ya asili na inadumisha taswira ya ujenzi bila kurudia neno “msingi” kwa namna nzito.
- source_word: אֶרֶץ
  choice: dunia
  rationale: Katika wimbo huu wa uumbaji, maana pana ya dunia inafaa kuliko maana ya eneo maalumu la nchi.
- source_word: עַל
  choice: juu ya
  rationale: Huonyesha mahali au tegemezo katika taswira ya kitu kilichowekwa juu ya msingi.
- source_word: מְכוֹנֶיהָ
  choice: misingi yake
  rationale: Nomino hii inaweza kumaanisha misingi, mahali pa kutegemeza, au nguzo za kudumu; “misingi yake” inadumisha taswira ya usanifu kwa Kiswahili cha kawaida.
- source_word: בַּל תִּמּוֹט
  choice: haitatikisika
  rationale: Muundo huu unakana kutikisika, kusogezwa, au kuyumba. “Haitatikisika” huwasilisha uthabiti kwa lugha ya kishairi iliyo wazi.
- source_word: עוֹלָם וָעֶד
  choice: milele na milele
  rationale: Jozi hii inasisitiza muda usio na mwisho; msemo wa Kiswahili “milele na milele” huhifadhi msisitizo huo.
theological_decisions:
- issue: Lugha ya kikosmolojia katika taswira ya kishairi ya uumbaji
  choice: Kudumisha picha ya dunia ikiwa juu ya misingi na kutotikiswa
  alternative: Alifanya dunia iwe imara kabisa
  rationale: Kiebrania kinatumia taswira ya usanifu kueleza uthabiti wa dunia. Tafsiri haiigeuzi kuwa maelezo ya kisayansi ya kisasa wala kuiondoa taswira yake ya kishairi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Kiambishi cha ngeli katika “misingi yake” kinarejelea dunia.
