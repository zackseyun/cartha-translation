  text: The mountains rose[a], the valleys sank down, to the place that you established for them.
translation:
  language: sw
  text: Milima iliinuka[a], mabonde yakashuka, hadi mahali ulipowapangia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata uchanganuzi mwingine unaowezekana wa ushairi wa Kiebrania: “Yalipanda juu ya milima; yakashuka ndani ya mabonde, hadi mahali ulipoyapangia,” huku maji yakieleweka kuwa kiima kilichodokezwa.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַעֲלוּ
  choice: iliinuka
  rationale: Kitenzi cha Qal, nafsi ya tatu wingi, kinaonyesha mwendo wa kwenda juu; hapa kinawasilisha milima ikiinuka katika taswira ya kishairi.
- source_word: הָרִים
  choice: Milima
  rationale: Nomino ya wingi yenye uamilifu wa dhahiri; Kiswahili hakihitaji kibainishi tofauti ili kuonyesha maana hiyo.
- source_word: יֵרְדוּ
  choice: yakashuka
  rationale: Kitenzi cha Qal, nafsi ya tatu wingi, kinaonyesha mwendo wa kwenda chini; 'yakashuka' ni Kiswahili cha kawaida na huhifadhi usambamba na 'iliinuka' bila kuongeza wazo lisilo wazi la kuzama.
- source_word: בְקָעוֹת
  choice: mabonde
  rationale: Nomino ya wingi inayomaanisha maeneo ya chini au mabonde; 'mabonde' ni neno la kawaida na linalofaa kwa mandhari hii.
- source_word: אֶל מְקוֹם
  choice: mpaka mahali
  rationale: Kirai kinaonyesha kikomo au mahali panapolengwa katika mwendo; 'mpaka mahali' huunganisha kwa kawaida mfululizo wa kishairi na mahali palipopangwa.
- source_word: זֶה
  choice: mahali uli-
  rationale: Kiwakilishi cha kuonyesha kimewasilishwa kwa muundo wa kawaida wa Kiswahili wa kishazi rejeshi, badala ya tafsiri nzito ya neno kwa neno.
- source_word: יָסַדְתָּ
  choice: ulitengenezea
  rationale: Kitenzi יסד humaanisha kuweka msingi, kuanzisha, au kuimarisha. Katika muktadha wa Mungu kuupangia uumbaji mahali, 'tengenezea' huonyesha kwamba aliwaandalia na kuwawekea mahali.
- source_word: לָהֶם
  choice: -ya-
  rationale: Kiambishi cha yambwa katika 'ulipoyatengenezea' kinarejelea kwa wingi milima na mabonde katika usomaji mkuu, huku kikiwa na urejeo unaoweza pia kueleweka kwa maji katika usomaji mbadala.
theological_decisions:
- issue: Uhusiano wa kiima katika mstari huu wa kishairi
  choice: 'Milima na mabonde zimechukuliwa kuwa viima: milima iliinuka na mabonde yakashuka.'
  alternative: 'Maji ndiyo kiima kinachodokezwa: “Yalipanda juu ya milima; yakashuka ndani ya mabonde, mpaka mahali ulipoyatengenezea.”'
  rationale: Muundo wa Kiebrania unaweza kusomwa kwa milima na mabonde kuwa viima vya vitenzi, na hivyo kutoa taswira thabiti ya Mungu akiupanga uso wa dunia. Hata hivyo, kwa kuwa muktadha unaeleza kurudi nyuma kwa maji, usomaji unaoyafanya maji kuwa kiima pia unawezekana; umehifadhiwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi isiyo nzito. Muundo mfupi umehifadhi usambamba wa vitenzi vya Kiebrania na tanbihi inalinda utata halisi kuhusu kiima.
