  text: מִן גַּעֲרָ֣תְ/ךָ֣ יְנוּס֑וּ/ן מִן ק֥וֹל רַֽ֝עַמְ/ךָ֗ יֵחָפֵזֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/007.yaml
  text: At your rebuke they fled[a]; at the sound of your thunder they hurried away.
translation:
  language: sw
  text: Kwa kemeo lako yalikimbia[a]; kwa sauti ya ngurumo yako yaliondoka kwa haraka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa kemeo lako yalitoroka; kwa sauti ya ngurumo yako yaliharakisha kuondoka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּעֲרָתְךָ
  choice: kukemea kwako
  rationale: Nomino ya Kiebrania inaashiria kemeo lenye nguvu, hasa amri ya Mungu juu ya uumbaji. Kiswahili ‘kukemea kwako’ huhifadhi tendo la usemi na nguvu yake bila kulifanya kuwa tishio tu.
- source_word: יְנוּסוּן
  choice: walikimbia
  rationale: Kitenzi נוּס humaanisha kukimbia au kutoroka. ‘Walikimbia’ ni cha kawaida na cha kishairi, huku muktadha ukionyesha kwamba maji yaliondoka mbele za Mungu.
- source_word: קוֹל
  choice: sauti ya
  rationale: קוֹל inaweza kuwa sauti au mlio. Katika muundo unaohusiana na radi, ‘sauti ya radi yako’ ni Kiswahili cha kawaida na huhifadhi taswira ya kusikia.
- source_word: רַעַמְךָ
  choice: radi yako
  rationale: רַעַם ni radi; tafsiri hii ni ya moja kwa moja na inadumisha taswira ya nguvu za Mungu katika dhoruba.
- source_word: יֵחָפֵזוּן
  choice: waliondoka kwa haraka
  rationale: חפז huonyesha mwendo wa haraka, na wakati mwingine taharuki. ‘Waliondoka kwa haraka’ huonyesha mwendo huo bila kuongeza wazi wazo la hofu ambalo linaweza tu kudokezwa.
- source_word: מִן ... מִן
  choice: Kwa ... kwa
  rationale: 'Ingawa מִן kimsingi ni ‘kutoka,’ hapa katika ulinganifu wa kishairi huonyesha sababu au kichocheo: walikimbia kwa sababu ya kemeo na sauti ya radi. ‘Kwa’ ni fupi, ya asili, na inadumisha ulinganifu.'
theological_decisions:
- issue: Kirejelewa cha vitenzi vya wingi (‘walikimbia’ / ‘waliondoka kwa haraka’)
  choice: Kiima kinabaki kudokezwa kwa viwakilishi vya nafsi vilivyomo katika vitenzi, kikirejelea maji yaliyotajwa katika muktadha uliotangulia.
  alternative: 'Kukifanya kiima kuwa wazi: ‘maji yalikimbia.’'
  rationale: Kiebrania hakitaji tena nomino katika mstari huu. Kutotaja ‘maji’ wazi kunahifadhi mtiririko wa kishairi na kutoongeza neno lisilokuwamo, huku muktadha ukibainisha kirejelewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Ulinganifu wa vipande viwili umehifadhiwa; lugha ni rahisi kueleweka bila kupunguza nguvu ya picha ya Mungu akiyaamuru maji.
