  text: הָרִ֣ים הַ֭/גְּבֹהִים לַ/יְּעֵלִ֑ים סְ֝לָעִ֗ים מַחְסֶ֥ה לַֽ/שְׁפַנִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/018.yaml
  text: The high mountains are for the wild goats[b][a]; the rocks are a refuge for the rock badgers.
translation:
  language: sw
  text: 'Milima mirefu ni makao ya mbuzi-mwitu[a];

    miamba ni kimbilio la pimbi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbuzi wa milimani aina ya ibex.”
    reason: lexical_alternative
  - marker: b
    text: Yaani wanyama wadogo wa miambani wanaoitwa pia hiraksi.
    reason: lexical_clarification
lexical_decisions:
- source_word: הָרִים הַגְּבֹהִים
  choice: milima mirefu
  rationale: Kirai hiki kinataja milima iliyo juu. “Milima mirefu” ni usemi wa kawaida na wazi katika Kiswahili cha kisasa.
- source_word: לַיְּעֵלִים
  choice: ni makao ya mbuzi-mwitu
  rationale: יְעֵלִים ni mbuzi wa porini wanaoishi milimani, yaelekea ibex. Neno “makao” limewekwa wazi ili kirai cha Kiebrania chenye maana ya mahali yaliyotengwa kwa wanyama hao kisikike kwa kawaida katika Kiswahili.
- source_word: סְלָעִים
  choice: miamba
  rationale: Neno hili linaonyesha mawe makubwa au maeneo ya miamba; “miamba” linafaa kwa mazingira wanamoishi pimbi na linadumisha taswira ya kishairi.
- source_word: מַחְסֶה
  choice: kimbilio
  rationale: Neno hili linamaanisha mahali pa kupata kinga. “Kimbilio” linahifadhi wazo la usalama na ulinzi, si kivuli au makazi tu.
- source_word: לַשְׁפַנִּים
  choice: la pimbi
  rationale: שְׁפַנִּים hutambulishwa kwa kawaida kuwa pimbi, yaani hyrax, wanyama wadogo wanaoishi miambani. Jina la Kiswahili “pimbi” ni sahihi na fupi.
