  text: תְּ֭הוֹם כַּ/לְּב֣וּשׁ כִּסִּית֑/וֹ עַל הָ֝רִ֗ים יַֽעַמְדוּ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/006.yaml
  text: You covered it with the deep as with a garment[a]; the waters stood above the mountains.
translation:
  language: sw
  text: Uliifunika kwa vilindi kama vazi[a]; maji yalisimama juu ya milima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kilindi” au “kilindi cha asili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהוֹם
  choice: kilindi
  rationale: Neno hili linaonyesha maji ya kina au vilindi vya bahari. “Kilindi” ni neno la kawaida lakini lenye hadhi, na linahifadhi taswira ya maji makuu bila kuingiza maana ya kimitholojia.
- source_word: כַּ/לְּבוּשׁ
  choice: kama kwa vazi
  rationale: Kiambishi כַּ־ kinaonyesha ulinganisho, na לְבוּשׁ ni vazi au nguo. Kauli hii inadumisha tashbihi na inafuatana kiasili na kitenzi “uliifunika.”
- source_word: כִּסִּיתוֹ
  choice: Uliifunika
  rationale: Umbo la Kiebrania ni nafsi ya pili umoja wa kiume, likiwa na kiambishi cha yambwa cha nafsi ya tatu umoja wa kiume. Hivyo tafsiri inahifadhi mazungumzo ya moja kwa moja na Mungu pamoja na yambwa “dunia” inayotokana na muktadha wa mstari uliotangulia.
- source_word: עַל
  choice: juu ya
  rationale: Katika muktadha huu neno linaonyesha kwamba maji yalikuwa juu au juu zaidi ya milima. “Juu ya” huhifadhi kwa ufupi uhusiano huo wa mahali bila kuamua zaidi ikiwa maji yaligusa milima au yaliifunika.
- source_word: הָרִים
  choice: milima
  rationale: Hii ndiyo maana ya kawaida ya הָרִים na inadumisha ukubwa wa taswira ya uumbaji.
- source_word: יַעַמְדוּ
  choice: yalisimama
  rationale: Kitenzi עמד humaanisha kusimama. Tafsiri halisi “yalisimama” inadumisha taswira hai ya kishairi ya maji yaliyokaa juu ya milima.
- source_word: מָיִם
  choice: maji
  rationale: “Maji” ni tafsiri ya kawaida na ya asili ya מָיִם katika Kiswahili; muktadha unaunganisha maji haya na kilindi kilichotajwa mwanzoni mwa mstari.
theological_decisions:
- issue: Nafsi ya kitenzi na anayezungumziwa
  choice: 'Usemi wa moja kwa moja kwa Mungu: “Uliifunika”'
  alternative: 'Masimulizi ya nafsi ya tatu: “Aliifunika”'
  rationale: Umbo la Kiebrania ni la nafsi ya pili umoja wa kiume, na muktadha wa zaburi unamwelekea BWANA moja kwa moja. Kudumisha nafsi ya pili kunahifadhi muundo wa sifa inayoelekezwa kwa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi taswira ya vazi, kilindi, na maji yanayosimama juu ya milima.
