base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/030.yaml
  text: When you send out your Spirit[a], they are created[b], and you renew the face of the ground.
translation:
  language: sw
  text: Unapoituma Roho yako[a], wanaumbwa[b], nawe unaufanya upya uso wa ardhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pumzi yako” au “upepo wako”; neno la Kiebrania רוּחַ linaweza kuwa na maana zote tatu.
    reason: lexical_alternative
  - marker: b
    text: Au, “Unaituma Roho yako, wanaumbwa.”
    reason: previous_rendering
lexical_decisions:
- source_word: תְּשַׁלַּח
  choice: unapoituma
  rationale: Kitenzi cha Kiebrania kina maana ya ‘kutuma’ au ‘kupeleka.’ Muundo wa ‘unapoituma’ unaonyesha kwa Kiswahili cha kawaida uhusiano wa tendo la Mungu na kuumbwa kwa viumbe, bila kubadili maana ya msingi.
- source_word: רוּחֲךָ
  choice: Roho yako
  rationale: רוּחַ inaweza kumaanisha roho, pumzi, au upepo. ‘Roho yako’ inafaa katika muktadha wa tendo la Mungu la kuumba na kuhuisha, huku maana nyingine zikihifadhiwa katika tanbihi.
- source_word: יִבָּרֵאוּן
  choice: wanaumbwa
  rationale: Nifali ya ברא ina maana ya ‘kuumbwa.’ ‘Wanaumbwa’ ni tafsiri ya moja kwa moja na haiongezi wazo la ‘kuumbwa upya,’ ambalo lingeingilia kishazi kinachofuata.
- source_word: וּתְחַדֵּשׁ
  choice: nawe unaufanya upya
  rationale: Pieli ya חדשׁ humaanisha ‘kufanya upya’ au ‘kuhuisha upya.’ Usemi huu ni wa asili katika Kiswahili na hudumisha tofauti kati ya kuumba katika kishazi cha kwanza na kufanya upya katika cha pili.
- source_word: פְּנֵי
  choice: uso wa
  rationale: Neno hili kihalisi ni ‘uso wa.’ Kiswahili pia hutumia taswira hii kwa ufasaha wa kishairi, hivyo hakuna haja ya kuibapa kuwa ‘sehemu ya juu.’
- source_word: אֲדָמָה
  choice: ardhi
  rationale: אֲדָמָה humaanisha udongo au ardhi. ‘Ardhi’ inaeleweka kwa urahisi katika kirai cha kishairi ‘uso wa ardhi’ na haipanui lazima maana kuwa ulimwengu mzima.
theological_decisions:
- issue: Maana ya רוּחַ katika muktadha wa uumbaji
  choice: Roho yako
  alternative: pumzi yako; upepo wako
  rationale: ‘Roho yako’ huhifadhi uzito wa tendo la Mungu la kuumba na kutoa uhai. Hata hivyo, kwa kuwa neno la Kiebrania linaweza pia kumaanisha pumzi au upepo, uwezekano huo umeonyeshwa katika tanbihi badala ya kuondolewa.
- issue: Uhusiano wa kishazi cha kutuma na kishazi cha kuumbwa
  choice: Unapoituma ... wanaumbwa
  alternative: Waituma ... wanaumbwa
  rationale: Kiebrania kinaweka vitenzi kwa mfuatano bila kiunganishi bayana cha wakati. Muundo wa ‘unapo-’ ni Kiswahili cha kawaida kinachoonyesha uhusiano unaoelekea kudokezwa na muktadha, huku tanbihi ikihifadhi uwezekano wa muundo wa uratibu wa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Uso wa ardhi’ huhifadhi taswira ya Kiebrania; ‘nawe’ huendeleza urari wa kimashairi bila kuwa cha kizamani kupita kiasi.
