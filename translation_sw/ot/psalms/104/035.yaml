source:
  edition: WLC
  text: יִתַּ֤מּוּ חַטָּאִ֨ים מִן הָ/אָ֡רֶץ וּ/רְשָׁעִ֤ים ע֤וֹד אֵינָ֗/ם בָּרֲכִ֣י נַ֭פְשִׁ/י אֶת יְהוָ֗ה הַֽלְלוּ יָֽהּ׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/035.yaml
  text: May sinners be finished from the earth[a], and may the wicked be no more. Bless Yahweh, O my soul[b]. Hallelujah!
translation:
  language: sw
  text: Wenye dhambi na watoweke kutoka duniani[a], na waovu wasiwepo tena. Ee nafsi yangu, mbariki Yahwe. Haleluya![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na Kiebrania, “Wenye dhambi na wakome kuwapo duniani.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “Msifuni Yah!” “Haleluya” ni umbo la kawaida la usemi huo katika Kiswahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתַּמּוּ
  choice: na watoweke
  rationale: Kauli ya kutakia ya kitenzi תמם inaonyesha kufikia mwisho au kutokuwapo kabisa. “Na watoweke” ni Kiswahili cha kawaida kinachohifadhi maana ya kuondolewa kabisa bila kuigeuza kuwa amri ya moja kwa moja.
- source_word: חַטָּאִים
  choice: wenye dhambi
  rationale: Nomino hii ya wingi inawataja watu wenye sifa ya kutenda dhambi, si dhambi kama jambo lisilo mtu.
- source_word: מִן הָאָרֶץ
  choice: duniani
  rationale: Katika muktadha mpana wa uumbaji wa Zaburi 104, אֶרֶץ inaelekea kumaanisha dunia nzima, si nchi fulani.
- source_word: וּרְשָׁעִים
  choice: na waovu
  rationale: “Waovu” ni tafsiri fupi na ya kawaida ya kundi la watu linalotajwa kwa tabia yake ya uovu.
- source_word: עוֹד אֵינָם
  choice: wasiwepo tena
  rationale: Usemi huu unaonyesha kukoma kwa kuwapo au kutopatikana kwao, na tafsiri hii ni ya asili katika Kiswahili.
- source_word: בָּרֲכִי נַפְשִׁי
  choice: Ee nafsi yangu, mbariki
  rationale: Muundo huu unahifadhi kujihimiza kwa mshairi na maana ya msingi ya ברך inapokuwa na Mungu kama yambwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetolewa kama jina binafsi “Yahwe,” badala ya kubadilishwa na cheo.
- source_word: הַלְלוּ יָהּ
  choice: Haleluya!
  rationale: Huu ni usemi wa ibada unaotambulika katika Kiswahili; tanbihi inaweka wazi maana yake halisi na jina fupi יָהּ.
theological_decisions:
- issue: Je, ombi linahusu kuondolewa kwa dhambi au kwa watu wenye dhambi?
  choice: Aya inatakia wenye dhambi na waovu watoweke duniani.
  alternative: Dhambi yenyewe na ikome duniani.
  rationale: Maneno ya Kiebrania חַטָּאִים na רְשָׁעִים yanawataja watu. Tafsiri haipunguzi ukali wa ombi kwa kulifanya lihusu dhambi kama dhana tu, huku “na watoweke” ikihifadhi hali ya kutakia badala ya amri ya moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi na chenye heshima lakini kinachoeleweka kwa urahisi. “Na watoweke” na “wasiwepo tena” huhifadhi usambamba wa kishairi; “Ee nafsi yangu” huhifadhi mwito wa kujisemeza wa zaburi.
