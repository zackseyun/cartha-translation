  text: who lays the beams of his upper chambers on the waters[a], who makes the clouds his chariot, who walks on the wings of the wind.
translation:
  language: sw
  text: 'anayefunga boriti za vyumba vyake vya juu juu ya maji,


    anayefanya mawingu kuwa gari lake,


    anayetembea juu ya mabawa ya upepo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayetembea juu ya mabawa ya roho,” ikiwa neno רוּחַ linaeleweka kuwa “roho”; hapa “upepo” limependelewa kwa sababu taswira zinazolizunguka zinahusu hali ya hewa.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְקָרֶה
  choice: anayepiga boriti
  rationale: Kitenzi קרה hapa kinaonyesha kuweka boriti au kuezeka jengo. Kauli “kupiga boriti” ni ya kawaida katika Kiswahili na inadumisha taswira halisi ya ujenzi.
- source_word: בַמַּיִם
  choice: juu ya maji
  rationale: Ingawa kihusishi ב kinaweza kumaanisha “katika” au “kwa,” taswira ya vyumba vya juu vilivyojengwa inaelekeza kwenye maana ya kuwa juu ya maji.
- source_word: עֲלִיּוֹתָיו
  choice: vyumba vyake vya juu
  rationale: Nomino hii humaanisha vyumba vya sehemu ya juu ya jengo; tafsiri hii ni wazi, ya sasa, na inadumisha taswira ya usanifu.
- source_word: הַשָּׂם
  choice: anayefanya
  rationale: Katika muundo unaofuata, שׂים humaanisha kuyafanya mawingu yawe gari lake; “anayefanya” ni ya asili katika Kiswahili.
- source_word: עָבִים
  choice: mawingu
  rationale: Neno hilo linataja mawingu, huenda mawingu mazito, lakini “mawingu” linatosha na haliongezi maelezo yasiyolazimishwa na mstari.
- source_word: רְכוּבוֹ
  choice: gari lake
  rationale: Neno hili linaweza kumaanisha chombo cha kupandia au gari la vita. “Gari lake” ni fupi na linaeleweka katika taswira hii ya kishairi.
- source_word: הַמְהַלֵּךְ
  choice: anayetembea
  rationale: Hii inadumisha maana halisi na taswira hai ya kishairi ya kitenzi הלך.
- source_word: כַּנְפֵי
  choice: mabawa ya
  rationale: Ingawa כנף pia linaweza kumaanisha kingo, “mabawa” ndiyo taswira yenye nguvu na inayofaa zaidi pamoja na upepo.
- source_word: רוּחַ
  choice: upepo
  rationale: רוּחַ linaweza kumaanisha upepo, pumzi, au roho. Katika muktadha wa mawingu na taswira nyingine za hali ya anga, “upepo” linafaa zaidi bila kuondoa uwezekano wa maana nyingine.
theological_decisions:
- issue: Maana ya רוּחַ katika kishororo cha mwisho
  choice: upepo
  alternative: roho
  rationale: Muktadha wa mawingu, gari, na mabawa unapendelea hali ya anga. Tanbihi inahifadhi upana wa neno la Kiebrania bila kuingiza dai maalumu la kiteolojia katika maandishi makuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Mistari mitatu yenye muundo unaofanana inadumisha mfululizo wa vihusishi vya Kiebrania. Alama ya tanbihi imewekwa baada ya “upepo,” ambako neno lenye utata רוּחַ linatokea.
