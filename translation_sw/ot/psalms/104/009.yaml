  yaml_path: translation/ot/psalms/104/009.yaml
  text: You set a boundary they may not cross[b][a]; they may not return to cover the earth.
translation:
  language: sw
  text: Uliweka mpaka wasiivuke[a]; wala wasirudi kuifunika dunia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kikomo.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, maji yasirudi tena kuifunika dunia.
    reason: cross_reference
lexical_decisions:
- source_word: גְּבוּל
  choice: mpaka
  rationale: Nomino hii humaanisha mpaka au kikomo kilichowekwa. “Mpaka” ni neno la kawaida na linafaa kwa taswira ya Mungu kuyazuia maji.
- source_word: שַׂמְתָּ
  choice: uliweka
  rationale: Kitenzi שׂוּם humaanisha kuweka; “uliweka mpaka” ni usemi wa asili na wa moja kwa moja katika Kiswahili.
- source_word: בַּל
  choice: hawawezi / hawatarudi
  rationale: Chembe hii inakanusha vitenzi vinavyofuata kwa maana ya kizuizi thabiti; Kiswahili cha muktadha kinatumia “hawawezi” na “hawatarudi” kwa mtiririko wa kawaida.
- source_word: יַעֲבֹרוּן
  choice: kuuvuka
  rationale: Kitenzi עבר ni kuvuka au kupita; kwa kuwa mpaka ndio kitu kinachowekwa, “kuuvuka” ni wazi na sahihi.
- source_word: יְשׁוּבוּן
  choice: hawatarudi
  rationale: Kitenzi שוב humaanisha kurudi. Kauli hii inadumisha maana ya maji kutorudi tena kuifunika dunia.
- source_word: לְכַסּוֹת
  choice: kuifunika
  rationale: Kitenzi כסה humaanisha kufunika. Tafsiri hii inabaki karibu na Kiebrania bila kufafanua kimyakimya kuwa ni mafuriko.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: Katika zaburi hii ya uumbaji, “dunia” linaonyesha vizuri upeo wa ulimwengu kuliko “nchi,” ambalo lingeweza kueleweka kwa maana ya eneo fulani.
theological_decisions:
- issue: Kirejeleo cha vitenzi vya wingi
  choice: Viwakilishi vya wingi vinarejelea maji yaliyotajwa katika muktadha uliotangulia, bila kuyataja moja kwa moja katika mstari.
  alternative: Kuyataja wazi kuwa “maji,” au kuelewa vitenzi kuwa vinarejelea maji ya machafuko kwa ujumla.
  rationale: Muktadha wa karibu unazungumzia maji yakikimbia na kuwekewa mpaka. Kudumisha kiwakilishi kunafuata muundo wa Kiebrania na kuhifadhi kiasi chake cha kutotaja kirejeleo moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio umewekwa wa asili kwa Kiswahili huku ukihifadhi urudiaji na nguvu ya vizuizi viwili vya Kiebrania.
