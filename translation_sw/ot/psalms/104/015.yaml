  yaml_path: translation/ot/psalms/104/015.yaml
  text: and wine gladdens the heart of man[a], making the face shine more than oil[b], and bread sustains the heart of man.
translation:
  language: sw
  text: na divai huufurahisha moyo wa mwanadamu[a], na kufanya uso ung'ae kuliko mafuta[b], na mkate huutia nguvu moyo wa mwanadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “moyo wa binadamu” au “moyo wa mtu.” Neno la Kiebrania lililotafsiriwa “mwanadamu” hapa ni umoja unaowakilisha wanadamu kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Au “na kufanya uso ung'ae kwa mafuta.” Kihusishi cha Kiebrania kinaweza kuonyesha ulinganisho (“kuliko mafuta”) au njia/chanzo (“kwa” au “kutokana na mafuta”).
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/יַיִן
  choice: na divai
  rationale: Nomino ya kawaida yenye kiunganishi; “divai” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: יְשַׂמַּח
  choice: huufurahisha
  rationale: Kauli ya Piel ina maana ya kusababisha furaha; umbo la “hu-” linafaa kwa kauli ya jumla kuhusu kazi ya divai.
- source_word: לְבַב אֱנוֹשׁ
  choice: moyo wa mwanadamu
  rationale: “Moyo” hapa ni maisha ya ndani na mahali pa furaha; “mwanadamu” huhifadhi umoja wa kiwakilishi wa Kiebrania huku ikihusu binadamu kwa ujumla.
- source_word: לְ/הַצְהִיל פָּנִים
  choice: na kuufanya uso ung'ae
  rationale: Kitenzi cha kusababisha kinaonyesha uso kuwa na mng'ao; “kung'aa” ni lugha ya sasa, ya asili na yenye hadhi.
- source_word: מִ/שָּׁמֶן
  choice: kuliko mafuta
  rationale: Kiambishi מִן kinaweza kuonyesha ulinganisho; hapa tafsiri hii huhifadhi usomaji wa kwamba divai hufanya uso ung'ae kuliko mafuta, huku usomaji mwingine ukitajwa katika tanbihi.
- source_word: וְ/לֶחֶם
  choice: na mkate
  rationale: Maana halisi ni “mkate,” chakula kikuu katika utatu huu wa kishairi; hakuna sababu ya kuipanua kuwa “chakula.”
- source_word: יִסְעָד
  choice: huutegemeza
  rationale: Kitenzi סעד humaanisha kutegemeza, kuimarisha au kudumisha; “huutegemeza” huhifadhi sitiari inayohusisha moyo.
theological_decisions:
- issue: Umoja wa kiwakilishi wa אֱנוֹשׁ
  choice: mwanadamu
  alternative: binadamu / mtu
  rationale: Neno la Kiebrania linamtaja mwanadamu mmoja kwa namna ya kuwakilisha wanadamu wote, si mwanaume mmoja pekee. “Mwanadamu” huhifadhi umoja na maana jumuishi bila kuingiza tofauti ya kimadhehebu.
- issue: Maana ya מִן katika מִשָּׁמֶן
  choice: kuliko mafuta
  alternative: kwa mafuta / kutokana na mafuta
  rationale: Kiambishi kinaweza kuwa cha ulinganisho au cha njia/chanzo. Maandishi makuu yanatumia usomaji wa ulinganisho, lakini tanbihi huhifadhi utata halisi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi wa vipashio vitatu—divai, mafuta na mkate—umehifadhiwa, pamoja na marudio ya “moyo wa mwanadamu.”
