  text: זֶ֤ה הַ/יָּ֥ם גָּדוֹל֮ וּ/רְחַ֪ב יָ֫דָ֥יִם שָֽׁם רֶ֭מֶשׂ וְ/אֵ֣ין מִסְפָּ֑ר חַיּ֥וֹת קְ֝טַנּ֗וֹת עִם גְּדֹלֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/025.yaml
  text: There is the sea[a], great and broad of hands; in it are swarming things without number[c][b], living creatures small along with great.
translation:
  language: sw
  text: Hii ndiyo bahari, kubwa na pana[a]; humo mna viumbe visivyohesabika vinavyotambaa[b], viumbe hai vidogo pamoja na vikubwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “pana kwa mikono,” nahau inayomaanisha kuwa na upana mkubwa au kuenea sana.
    reason: cultural_note
  - marker: b
    text: Au, “viumbe vinavyosongamana”; neno la Kiebrania linaweza kumaanisha viumbe wanaotambaa, wanaosonga, au walio wengi wakisongamana.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַיָּם
  choice: Hii ndiyo bahari
  rationale: Kiashiria זֶה kinaiwasilisha bahari moja kwa moja kama kitu cha kutazamwa kwa mshangao; Kiswahili cha sasa hutumia kwa kawaida “Hii ndiyo bahari.”
- source_word: גָּדוֹל וּרְחַב יָדַיִם
  choice: kubwa na pana
  rationale: “Kubwa” huhifadhi uzito wa kishairi wa גָּדוֹל, na “pana” huwasilisha maana ya nahau רְחַב יָדַיִם kwa Kiswahili cha kawaida; taswira halisi ya “mikono” inaelezwa katika tanbihi.
- source_word: שָׁם
  choice: humo
  rationale: Kielezi hiki hurejelea ndani ya bahari iliyotajwa, hivyo “humo” ni cha asili na sahihi kuliko kurudia “pale.”
- source_word: רֶמֶשׂ
  choice: viumbe ... vinavyotambaa
  rationale: Neno hili ni la jumla kwa viumbe wanaosonga au kutambaa; “vinavyotambaa” huhifadhi maana ya msingi bila kukifunga kifungu kwa wazo la kusongamana pekee.
- source_word: וְאֵין מִסְפָּר
  choice: visivyohesabika
  rationale: Hii huwasilisha nahau ya Kiebrania yenye maana ya kuwa vingi kupita hesabu kwa Kiswahili fasaha.
- source_word: חַיּוֹת קְטַנּוֹת עִם גְּדֹלוֹת
  choice: viumbe hai vidogo pamoja na vikubwa
  rationale: “Viumbe hai” huhifadhi upana wa חַיּוֹת, na “pamoja na” hufuata עִם huku ikiweka wazi ulinganisho wa vidogo na vikubwa.
