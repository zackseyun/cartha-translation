base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/029.yaml
  text: You hide your face[a], they are terrified; you take away their breath[b], they die and return to their dust.
translation:
  language: sw
  text: Unapouficha uso wako[a], wanaingiwa na hofu; unapowaondolea pumzi yao[b], wanakufa na huyarudia mavumbi yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwepo wako.” Katika Kiebrania, “uso wako” ni usemi wa kawaida unaoweza kumaanisha uwepo au fadhili zako.
    reason: lexical_alternative
  - marker: b
    text: Au, “roho yao.” Neno la Kiebrania רוּחַ linaweza kumaanisha “pumzi,” “upepo,” au “roho”; hapa muktadha wa kufa na kurudi mavumbini unapendelea “pumzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּיר
  choice: unapouficha
  rationale: Hifili ya סתר humaanisha kuficha au kusitiri. ‘Kuficha’ ni ya kawaida na inadumisha taswira ya Mungu kuondoa uwepo au fadhili zake.
- source_word: פָּנֶיךָ
  choice: uso wako
  rationale: Hii ndiyo maana halisi ya Kiebrania. Pia ni nahau inayoweza kuashiria uwepo au fadhili za Mungu; taswira halisi imehifadhiwa katika matini.
- source_word: יִבָּהֵלוּן
  choice: wanaingiwa na hofu
  rationale: Nifali ya בהל huonyesha kushtuka, kufadhaika, au kuogopa sana. Usemi huu ni wa asili katika Kiswahili na unaonyesha mwitikio mkali.
- source_word: תֹּסֵף
  choice: unapowaondolea
  rationale: Kitenzi אסף kinaweza kumaanisha kukusanya, kutwaa, au kuondoa. Katika muktadha wa kufa, ‘kuwaondolea’ huonyesha pumzi ya uhai ikitwaliwa.
- source_word: רוּחָם
  choice: pumzi yao
  rationale: רוּחַ linaweza kumaanisha pumzi, upepo, au roho. Kutajwa kwa kufa na kurudi mavumbini kunapendelea ‘pumzi’ bila kufuta uwezekano wa ‘roho,’ uliowekwa katika tanbihi.
- source_word: יִגְוָעוּן
  choice: wanakufa
  rationale: גוע humaanisha kuaga dunia au kuangamia. ‘Wanakufa’ ni wazi, ya kawaida, na inafaa muktadha.
- source_word: עֲפָרָם
  choice: mavumbini mwao
  rationale: Kiebrania kina kiambishi milikishi, yaani ‘mavumbi yao.’ ‘Mavumbini mwao’ huhifadhi umilikishi na mwangwi wa viumbe kurudi katika mavumbi walikotoka.
- source_word: יְשׁוּבוּן
  choice: kurudi
  rationale: שוב humaanisha kurudi. Hili ndilo neno la kawaida na linalofaa kwa usemi wa kurudi mavumbini.
theological_decisions:
- issue: Maana ya רוּחָם katika muktadha wa uumbaji na kifo
  choice: pumzi yao
  alternative: roho yao
  rationale: Mstari unaeleza viumbe wakipoteza kile kinachowapa uhai, wakifa, na kurudi mavumbini. ‘Pumzi’ inafaa muktadha bila kuingiza dai maalumu kuhusu asili ya roho; maana mbadala imehifadhiwa katika tanbihi.
- issue: Lugha ya kibinadamu kuhusu uso wa Mungu
  choice: uso wako
  alternative: uwepo wako
  rationale: Taswira halisi ya Kiebrania imehifadhiwa kwa sababu ni ya kishairi na inaeleweka, huku tanbihi ikieleza maana ya kinahau ya uwepo au fadhili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa sentensi unadumisha ulinganifu wa Kiebrania, na taswira za ‘uso’ na ‘mavumbi’ zimehifadhiwa.
