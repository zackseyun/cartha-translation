  text: A psalm of Asaph[a]. God stands in the divine assembly; in the midst of the gods he judges.
translation:
  language: sw
  text: Zaburi ya Asafu. Mungu amesimama katika kusanyiko la kiungu; katikati ya miungu[a] anahukumu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “viumbe vya kiungu.” Wengine huelewa “miungu” hapa kuwa waamuzi au watawala wa kibinadamu.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Ni neno la kawaida la kichwa cha aina hii ya wimbo wa ibada, na tafsiri ya kawaida na sahihi katika Kiswahili.
- source_word: לְאָסָף
  choice: ya Asafu
  rationale: Kihusishi ל katika vichwa vya zaburi huweza kuonyesha uandishi, umiliki, au uhusiano; “ya Asafu” ni ya asili na haibainishi kupita kiasi aina kamili ya uhusiano.
- source_word: אֱלֹהִים (kwanza)
  choice: Mungu
  rationale: Kitenzi kishirikishi נִצָּב na kitenzi יִשְׁפֹּט vina umoja, hivyo hapa אֱלֹהִים ni Mungu mmoja aliye mhusika wa sentensi.
- source_word: נִצָּב
  choice: amesimama
  rationale: Huonyesha Mungu akiwa amesimama katika mazingira ya hukumu; “amesimama” huhifadhi picha hiyo kwa Kiswahili cha kawaida.
- source_word: בַּעֲדַת־אֵל
  choice: katika kusanyiko la Mungu
  rationale: עֵדָה ni kundi lililokusanyika, na אֵל hapa inaweza kufasiriwa moja kwa moja kuwa “Mungu.” Kauli hii ni ya asili na huhifadhi uhusiano wa muundo wa Kiebrania bila kulazimisha tafsiri ya “baraza la viumbe vya kiungu.”
- source_word: בְּקֶרֶב
  choice: katikati ya
  rationale: Huhifadhi picha ya mahali na wazo la kuwa miongoni mwa kundi.
- source_word: אֱלֹהִים (pili)
  choice: miungu
  rationale: 'Katika sehemu hii neno lina maana ya wingi: ni kundi ambalo Mungu yuko katikati yake na analihukumu. “Miungu” ndiyo tafsiri ya moja kwa moja, huku tanbihi ikihifadhi uwezekano wa “viumbe vya kiungu” au waamuzi/watawala wa kibinadamu.'
- source_word: יִשְׁפֹּט
  choice: anahukumu
  rationale: שורש שפט ina maana ya kutoa hukumu katika mazingira ya kimahakama; “anahukumu” ni wazi, fupi, na sahihi.
theological_decisions:
- issue: Mrejelewa wa אֱלֹהִים ya pili katika Zaburi 82:1
  choice: miungu
  alternative: viumbe vya kiungu; au waamuzi/watawala wa kibinadamu
  rationale: Sarufi hutofautisha Mungu aliye mmoja katika sehemu ya kwanza na kundi la wingi ambalo yuko katikati yake. Mazingira ya kifasihi yanaunga mkono baraza la mbinguni, lakini neno lenyewe linaweza kueleweka kwa njia nyingine; kwa hiyo matini kuu inahifadhi tafsiri ya moja kwa moja na tanbihi inataja njia mbadala bila kuondoa mvutano wa kiteolojia.
- issue: Maana ya עֲדַת־אֵל
  choice: kusanyiko la Mungu
  alternative: kusanyiko la kiungu; baraza la Mungu
  rationale: Muundo wa Kiebrania unaweza kutafsiriwa “kusanyiko la Mungu/El” au kwa maana ya sifa, “kusanyiko la kiungu.” “Kusanyiko la Mungu” huhifadhi muundo na utata kwa Kiswahili cha kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Kusanyiko” limetumiwa badala ya “baraza” ili kutoingiza kwa lazima maana mahsusi zaidi ya neno la Kiebrania.
