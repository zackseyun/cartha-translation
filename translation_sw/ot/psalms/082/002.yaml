  text: עַד מָתַ֥י תִּשְׁפְּטוּ עָ֑וֶל וּ/פְנֵ֥י רְ֝שָׁעִ֗ים תִּשְׂאוּ סֶֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/002.yaml
  text: How long will you judge unjustly and show partiality to the wicked? Selah[a]
translation:
  language: sw
  text: Mpaka lini mtahukumu isivyo haki na kuwapendelea waovu? Sela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa maneno halisi, “kuinua uso wa waovu,” nahau yenye maana ya kuwaonyesha kibali au kuwapendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: Mpaka lini
  rationale: Ni swali la muda lenye nguvu ya kukemea; ‘Mpaka lini’ ni Kiswahili cha kawaida na huhifadhi hisia ya malalamiko.
- source_word: תִּשְׁפְּטוּ
  choice: mtahukumu
  rationale: Kauli ya imperfect nafsi ya pili wingi katika swali la balagha inaweza kueleza tendo linaloendelea; umbo hili linafaa katika karipio la ‘Mpaka lini ...?’ bila kulifanya tendo kuwa la wakati ujao tu.
- source_word: עָוֶל
  choice: isivyo haki
  rationale: Nomino hii imetumika kwa namna ya kielezi baada ya ‘kuhukumu’; ‘isivyo haki’ ni ya asili na hudumisha muktadha wa hukumu potovu.
- source_word: וּפְנֵי רְשָׁעִים תִּשְׂאוּ
  choice: na kuwapendelea waovu
  rationale: Kirai halisi cha ‘kuinua uso wa waovu’ ni nahau ya kuonyesha upendeleo; tafsiri hii huwasilisha wazi maana yake ya kimahakama.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Neno hili la kawaida linaonyesha watu wenye hatia ya kimaadili bila kufupisha maana kuwa hatia ya kisheria pekee.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana na kazi yake kamili hazina uhakika; kunukuu kwa sauti huhifadhi utata huo badala ya kulifasiri kama agizo fulani la muziki.
theological_decisions:
- issue: Nahau ya kimahakama kuhusu kuwapendelea waovu
  choice: kuwapendelea waovu
  alternative: kuinua nyuso za waovu; kuwafadhili waovu
  rationale: Chaguo hili linaonyesha kuwa hukumu potovu inayokemewa inahusisha upendeleo, bila kuongeza dai lolote la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mpaka lini’ na ‘isivyo haki’ vinaeleweka kwa urahisi; ‘Sela’ limehifadhiwa kwa sababu maana yake si hakika.
