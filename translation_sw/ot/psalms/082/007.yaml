  yaml_path: translation/ot/psalms/082/007.yaml
  text: Nevertheless[a], you will die like men[b], and fall like one of the princes.
translation:
  language: sw
  text: Lakini[a] mtakufa kama binadamu[b], nanyi mtaanguka kama mmoja wa watawala[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hakika.”
    reason: alternative_reading
  - marker: b
    text: Au, “kama Adamu,” ikiwa neno hilo linaeleweka kuwa linamrejelea mtu wa kwanza badala ya binadamu kwa ujumla.
    reason: alternative_reading
  - marker: c
    text: Au, “wakuu” au “maafisa wenye cheo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  choice: Lakini
  rationale: Katika muktadha huu neno linaonyesha geuko la mkazo linalotofautisha hadhi yao iliyotangazwa kabla na hukumu ya kufa; “Lakini” ni ya kawaida na wazi katika Kiswahili.
- source_word: כְּאָדָם
  choice: kama wanadamu
  rationale: אָדָם hapa kwa kawaida humaanisha binadamu kwa ujumla, kwa kulinganisha wanaosemewa na hali ya kawaida ya kufa kwa binadamu. Wingi unalingana kwa asili na kiima cha nafsi ya pili wingi, huku uwezekano wa jina Adamu ukihifadhiwa katika tanbihi.
- source_word: תְּמוּתוּן
  choice: mtakufa
  rationale: Ni Qal imperfect nafsi ya pili wingi, yenye maana ya wakati ujao au tangazo la hukumu katika muktadha.
- source_word: וּכְאַחַד
  choice: na ... kama mmoja wa
  rationale: Muundo huu unalinganisha kuanguka kwao na mtu mmoja katika kundi linalofuata; Kiswahili cha kawaida huhitaji “mmoja wa”.
- source_word: הַשָּׂרִים
  choice: watawala
  rationale: שׂרים inaweza kumaanisha wakuu, watawala, au maafisa wenye cheo. “Watawala” ni neno la sasa na pana linalofaa kwa mamlaka zinazohukumiwa katika zaburi hii.
- source_word: תִּפֹּלוּ
  choice: kuanguka
  rationale: Kitenzi נפל kinadumisha taswira ya kuanguka, hapa kikidokeza kuangamizwa au kushushwa chini kwa hukumu.
theological_decisions:
- issue: Maana ya אָדָם katika כְּאָדָם
  choice: wanadamu kwa ujumla
  alternative: Adamu, yaani mtu wa kwanza
  rationale: Muktadha unatofautisha kuitwa kwao “miungu/wana wa Aliye Juu Zaidi” na hali yao ya kufa kama binadamu. Hata hivyo, umbo la Kiebrania linaweza kueleweka kama jina Adamu, kwa hiyo uwezekano huo haujaondolewa bali umewekwa katika tanbihi.
- issue: Maana ya הַשָּׂרִים
  choice: watawala
  alternative: wakuu
  rationale: Neno linaweza kutaja viongozi au watu wenye cheo kikubwa. “Watawala” linaonyesha mamlaka yao bila kulifanya neno kuwa cheo cha kifalme pekee; “wakuu” imehifadhiwa kama mbadala wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya moja kwa moja, ikihifadhi taswira ya kufa na kuanguka. Uwezekano wa kutafsiri כְּאָדָם kuwa “kama Adamu” unapaswa pia kuhifadhiwa; kwa kuwa alama zote za tanbihi lazima zilingane na maandishi, tanbihi ya kwanza ingefaa zaidi kueleza jambo hilo badala ya mbadala wa אָכֵן.
