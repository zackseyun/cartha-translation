  text: קוּמָ֣/ה אֱ֭לֹהִים שָׁפְטָ֣/ה הָ/אָ֑רֶץ כִּֽי אַתָּ֥ה תִ֝נְחַ֗ל בְּ/כָל הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/008.yaml
  text: Rise up[a], O God; judge the earth[b], for you will inherit all the nations.
translation:
  language: sw
  text: Inuka, Ee Mungu, uihukumu dunia, kwa maana wewe utayarithi mataifa yote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utayamiliki mataifa yote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: Inuka
  rationale: Amri ya קום inayomwelekea Mungu; “Inuka” ni ya kawaida, yenye heshima, na inaonyesha ombi la haraka la Mungu kuingilia kati.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Vitenzi vya umoja na kiwakilishi cha umoja vinaonyesha wazi kuwa ni Mungu mmoja anayesemeshwa moja kwa moja; “Ee” huonyesha mwito katika sala.
- source_word: שָׁפְטָה
  choice: uihukumu
  rationale: Huhifadhi maana ya kimahakama na ya kifalme ya שׁפט bila kuibana iwe kutawala pekee au kutetea pekee.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: Kutajwa kwa “mataifa yote” kunaonyesha upeo wa ulimwengu mzima, si nchi fulani tu.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha msingi wa ombi lililotangulia kwa Kiswahili cha kawaida na chenye heshima.
- source_word: אַתָּה
  choice: wewe
  rationale: Kiwakilishi kilicho wazi katika Kiebrania kina msisitizo; “wewe” huhifadhi msisitizo huo.
- source_word: תִנְחַל
  choice: utayarithi
  rationale: Huhifadhi maana ya kupokea au kumiliki kama urithi pamoja na dokezo la kifalme na la agano lililomo katika נחל.
- source_word: בְּכָל הַגּוֹיִם
  choice: mataifa yote
  rationale: Pamoja na נחל, kishazi hiki kinaeleweka kwa ufasaha kama kitu chote kinachorithiwa au kumilikiwa na Mungu.
theological_decisions:
- issue: Maana ya uhusiano wa Mungu na mataifa katika תִנְחַל בְּכָל הַגּוֹיִם
  choice: wewe utayarithi mataifa yote
  alternative: mataifa yote yatakuwa mali yako
  rationale: Tafsiri hii inaweka ombi la Mungu kuhukumu dunia juu ya haki yake ya ulimwengu mzima juu ya mataifa, huku ikihifadhi taswira ya urithi badala ya kuifanya kauli ya umiliki tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima, na kinachoeleweka kwa urahisi. Muundo wa sala na msisitizo wa “wewe” umehifadhiwa bila kutumia lugha ya kizamani.
