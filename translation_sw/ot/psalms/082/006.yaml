  text: Mimi nilisema, “Ninyi ni miungu, na ninyi nyote ni wana wa Aliye Juu Sana.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: miungu
  rationale: Nomino ya Kiebrania iko katika umbo la wingi na hapa ni kiarifu kinachowaelekea ‘ninyi’; ‘miungu’ huhifadhi lugha ya moja kwa moja na mvutano wa kifungu bila kuifasiri kuwa ‘waamuzi’.
- source_word: בְנֵי עֶלְיוֹן
  choice: wana wa Aliye Juu Zaidi
  rationale: Huhifadhi sitiari ya uhusiano ya ‘wana wa’ na kulitafsiri jina la cheo עֶלְיוֹן kwa Kiswahili cha kawaida na chenye heshima.
- source_word: כֻּלְּכֶם
  choice: ninyi nyote
  rationale: 'Huwasilisha wazi kiwakilishi cha nafsi ya pili wingi pamoja na maana ya ujumla: wote bila kuacha yeyote.'
- source_word: אָמַרְתִּי
  choice: Nilisema
  rationale: Ni wakati timilifu wa nafsi ya kwanza umoja; ‘Nilisema’ ni tafsiri ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Utambulisho wa wanaoitwa אֱלֹהִים
  choice: miungu
  alternative: waamuzi / watawala
  rationale: Mstari wenyewe unatumia neno ‘miungu’ bila kuwataja wazi wahusika hao ni nani. Tafsiri haipaswi kuamua kimya kimya kama ni waamuzi wa kibinadamu, watawala, au viumbe wa baraza la mbinguni.
- issue: Maana ya ‘wana wa Aliye Juu Zaidi’
  choice: Kudumisha usemi wa kifamilia kama ulivyo
  alternative: watumishi wa Aliye Juu Zaidi / viumbe wa mbinguni
  rationale: Usemi wa chanzo una mvutano wa kitheolojia na unaweza kueleweka kwa njia zaidi ya moja; sitiari ya ‘wana’ imehifadhiwa bila ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima lakini kinachoeleweka kwa urahisi. Muundo wa sentensi umewekwa wa kawaida na wa moja kwa moja; hakuna tanbihi zinazohitajika kwa mstari huu.
