  text: Defend the weak and the fatherless; vindicate the afflicted and the poor.
translation:
  language: sw
  text: Wateteeni wanyonge na yatima; watendeeni haki wanaoteseka na maskini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁפְטוּ
  choice: Wateteeni
  rationale: Kitenzi kina maana ya kuhukumu au kutekeleza haki; katika muktadha huu wa kuwalinda walio dhaifu, “wateteeni” huwasilisha wajibu wa kuwapatia haki kwa Kiswahili cha kawaida.
- source_word: דַל
  choice: wanyonge
  rationale: Neno hili humaanisha walio dhaifu, duni, au wasiojiweza; “wanyonge” linahifadhi maana hiyo bila kuibana kuwa umaskini wa mali pekee.
- source_word: יָתוֹם
  choice: yatima
  rationale: Tafsiri ya moja kwa moja ya mtu aliyefiwa na mzazi au wazazi na hivyo asiye na ulinzi wa kawaida wa kifamilia.
- source_word: עָנִי
  choice: wanaoteseka
  rationale: Neno linaweza kumaanisha aliyeteswa, aliyedhulumiwa, au mwenye shida; “wanaoteseka” linaonyesha hali ya dhiki huku likitofautishwa na רָשׁ, ‘maskini.’
- source_word: רָשׁ
  choice: maskini
  rationale: Hurejelea mtu mwenye uhitaji au ukosefu wa mali; “maskini” ni neno la kawaida na sahihi katika muktadha huu.
- source_word: הַצְדִּיקוּ
  choice: watendeeni haki
  rationale: Hifili ya צדק hapa ina maana ya kuthibitisha kuwa mwenye haki au kumpatia haki; “watendeeni haki” ni ya asili kwa Kiswahili na huepuka maana finyu ya kutangaza tu kuwa hawana hatia.
theological_decisions:
- issue: Uhusiano kati ya kuhukumu na kuwatetea walio dhaifu
  choice: “Wateteeni” kwa שִׁפְטוּ na “watendeeni haki” kwa הַצְדִּיקוּ
  alternative: “Wahukumieni kwa haki ... wahesabuni kuwa wenye haki”
  rationale: Ubeti unadai utekelezaji wa haki kwa walio hatarini. Tafsiri iliyochaguliwa hudumisha wito huo bila kuingiza fundisho maalumu kuhusu kuhesabiwa haki katika muktadha wa mahakama ya kijamii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri katika wingi umehifadhiwa, pamoja na ulinganifu wa vipashio viwili vya mstari wa Kiebrania.
