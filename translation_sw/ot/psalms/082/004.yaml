base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/004.yaml
  text: Rescue the poor and needy[a]; deliver them from the hand of the wicked.
translation:
  language: sw
  text: Waokoeni maskini na wahitaji[a]; waopoeni kutoka mikononi mwa waovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waokoeni walio dhaifu na wahitaji.” Neno la Kiebrania דַּל linaweza kumaanisha “maskini” au “dhaifu,” likikazia hali ya udhaifu pamoja na umaskini.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּלְּטוּ
  choice: Waokoeni
  rationale: Amri ya wingi kutoka פלט inataka hatua ya kuwaondoa walio hatarini na kuwafikisha salama. “Waokoeni” ni ya kawaida na yenye uzito wa haraka katika Kiswahili.
- source_word: דַל
  choice: maskini
  rationale: Neno hili linaweza kumaanisha maskini, dhaifu, au mtu asiye na uwezo wa kijamii. Katika muktadha wa haki na likiwa sambamba na אֶבְיוֹן, “maskini” linaonyesha vizuri hali ya kunyimwa uwezo wa kiuchumi na kijamii, huku maana mbadala ikihifadhiwa katika tanbihi.
- source_word: אֶבְיוֹן
  choice: wahitaji
  rationale: Hurejelea watu wenye uhitaji au waliokosa mahitaji ya lazima. “Wahitaji” ni Kiswahili cha sasa na huhifadhi tofauti ya maana na “maskini” bila kuwa kizito.
- source_word: מִיַּד
  choice: kutoka mikononi mwa
  rationale: Nahau ya Kiebrania ina maana ya kuondolewa katika mamlaka au udhibiti wa mtu. “Kutoka mikononi mwa” huhifadhi taswira ya chanzo na inaeleweka vizuri kwa Kiswahili.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Nomino ya wingi inawataja watenda maovu wenye hatia ya kimaadili. “Waovu” ni fupi, ya kawaida, na haiongezi jinsia isiyotajwa katika Kiebrania.
- source_word: הַצִּילוּ
  choice: waopoe
  rationale: Amri ya wingi kutoka נצל inahusu kumtoa mtu katika hatari au mamlaka ya adui. “Waopoe” hutofautisha kitenzi hiki na “waokoeni” huku ikidumisha urudiaji wenye nguvu wa kishairi.
theological_decisions:
- issue: Kuhifadhi amri mbili sambamba bila kupunguza nguvu ya ushairi wa Kiebrania
  choice: 'Kutumia amri mbili zilizoratibiwa: “Waokoeni ...; waopoe ...”'
  alternative: Kuziunganisha kuwa amri moja, kama “Waokoeni maskini na wahitaji kutoka mikononi mwa waovu.”
  rationale: Kiebrania kina vitenzi viwili vya amri vinavyofuatana kwa usambamba na kuzidisha mwito wa kuwatetea walio hatarini. Kuvihifadhi vyote kunadumisha mkazo wa kishairi na uharaka wa wajibu wa haki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa kwa amri mbili na alama ya nukta mkato; taswira ya “mikononi mwa” imehifadhiwa kwa kuwa ni wazi na ya kawaida.
