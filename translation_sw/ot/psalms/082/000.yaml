base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/000.yaml
  text: A psalm of Asaph[a]. God stands in the assembly of God; in the midst of the gods he judges.
translation:
  language: sw
  text: Zaburi ya Asafu. Mungu amesimama katika kusanyiko la Mungu; katikati ya miungu[a] anahukumu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “viumbe wa kiungu.” Wengine huelewa “miungu” hapa kuwa waamuzi au watawala wa kibinadamu.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: Zaburi ya Asafu
  rationale: Kichwa cha kawaida na cha asili; kihusishi kinaweza kuonyesha uandishi, uhusiano, au wakfu, hivyo “ya Asafu” huhifadhi upana huo.
- source_word: אֱלֹהִים נִצָּב
  choice: Mungu amesimama
  rationale: Kitenzi cha umoja kinaonyesha kuwa אֱלֹהִים wa kwanza humrejelea Mungu; kauli ya wakati timilifu ya Kiswahili inaleta mbele picha ya kusimama kwake rasmi.
- source_word: בַּעֲדַת אֵל
  choice: katika kusanyiko la Mungu
  rationale: Hufuata muundo wa Kiebrania kwa uwazi bila kulazimisha tafsiri finyu kama baraza la mbinguni au mkutano wa wanadamu.
- source_word: בְּקֶרֶב אֱלֹהִים
  choice: katikati ya miungu
  rationale: Wingi unaendana na kihusishi cha “katikati ya” na muktadha; “miungu” huhifadhi utata wa iwapo ni viumbe wa kiungu au waamuzi/watawala wa kibinadamu.
- source_word: יִשְׁפֹּט
  choice: anahukumu
  rationale: Kauli ya sasa huwasilisha tendo la kimahakama linalotokea katika mandhari ya zaburi bila kuongeza mhusika au kitu kisichotajwa.
theological_decisions:
- issue: Utambulisho wa אֱלֹהִים katika kishazi cha mwisho
  choice: miungu
  alternative: viumbe wa kiungu; waamuzi au watawala wa kibinadamu
  rationale: Neno la Kiebrania na muktadha huruhusu mjadala huu; matini kuu inabaki karibu na usemi wa chanzo, huku tanbihi ikitaja maana nyingine bila kuamua kimadhehebu.
- issue: Maana ya “kusanyiko la Mungu”
  choice: kusanyiko la Mungu
  alternative: baraza la Mungu; kusanyiko la kiungu
  rationale: Tafsiri hii huhifadhi urudiaji na mvutano kati ya matumizi ya maneno אֵל na אֱלֹהִים bila kufafanua mapema aina ya kusanyiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kishairi na urudiaji wa “Mungu/miungu” umehifadhiwa; alama ya tanbihi [a] imewekwa mara tu baada ya neno linalohusika.
