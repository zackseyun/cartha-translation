  text: לֹ֤א יָֽדְע֨וּ וְ/לֹ֥א יָבִ֗ינוּ בַּ/חֲשֵׁכָ֥ה יִתְהַלָּ֑כוּ יִ֝מּ֗וֹטוּ כָּל מ֥וֹסְדֵי אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/005.yaml
  text: They do not know[a], and they do not understand; they walk about in darkness[b]; all the foundations of the earth are shaken.
translation:
  language: sw
  text: Hawajui wala hawaelewi; wanatembea gizani; misingi yote ya dunia[b] inatikisika[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “inayumba” au “inapoteza uthabiti.”
    reason: lexical_alternative
  - marker: b
    text: Au “nchi,” ikiwa אָרֶץ inaeleweka kwa maana ya eneo maalumu zaidi.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָדְעוּ
  choice: Hawajui
  rationale: Kitenzi ידע katika Qal kina maana ya ‘kujua.’ Ingawa umbo la Kiebrania ni timilifu, hapa linaeleza hali ya sasa ya kutokuwa na ujuzi na linasawazishwa na kishazi kinachofuata.
- source_word: וְלֹא יָבִינוּ
  choice: wala hawaelewi
  rationale: בין katika Hiphil humaanisha ‘kuelewa’ au ‘kutambua.’ ‘Wala hawaelewi’ ni Kiswahili cha kawaida na kinahifadhi usambamba wa kishairi pamoja na ‘hawajui.’
- source_word: בַּחֲשֵׁכָה
  choice: gizani
  rationale: Umbo hili linaonyesha mahali au hali ya kuwa katika giza. ‘Gizani’ ni usemi mfupi na wa asili katika Kiswahili.
- source_word: יִתְהַלָּכוּ
  choice: wanazunguka
  rationale: Hitpael ya הלך inaweza kuonyesha mwendo unaoendelea au wa kwenda huku na huku. ‘Wanazunguka’ linaonyesha mwendo huo usio na mwelekeo bila kuongeza tafsiri ya kimaadili.
- source_word: יִמּוֹטוּ
  choice: inatikisika
  rationale: Niphal ya מוט huonyesha kutikisika, kuyumba, au kuondoka katika uthabiti. ‘Inatikisika’ linaendeleza picha ya kuvurugika kwa misingi bila kudai kwamba tayari imeporomoka kabisa.
- source_word: כָּל מוֹסְדֵי אָרֶץ
  choice: misingi yote ya dunia
  rationale: מוֹסְדֵי ni ‘misingi’ au ‘vitu vya msingi,’ na אָרֶץ inaweza kuwa ‘dunia’ au ‘nchi.’ Muktadha mpana wa kishairi unapendelea ‘dunia,’ huku uwezekano wa ‘nchi’ ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Upeo wa אָרֶץ na picha ya kuvurugika kwa mpangilio wa ulimwengu
  choice: dunia
  alternative: nchi
  rationale: Zaburi inaunganisha ukosefu wa haki na kuyumba kwa utaratibu mzima. ‘Dunia’ huhifadhi ukubwa wa picha hiyo ya kishairi bila kuifanya kuwa maelezo ya moja kwa moja ya mfumo fulani wa kijiolojia au wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa urahisi. Usambamba wa kishairi umehifadhiwa kwa ‘Hawajui wala hawaelewi,’ na sentensi fupi zimetenganishwa kwa nukta mkato. Alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja, hivyo [b] hutokea kabla ya [a] katika mstari.
