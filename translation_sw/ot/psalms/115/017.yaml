  text: לֹ֣א הַ֭/מֵּתִים יְהַֽלְלוּ יָ֑הּ וְ֝/לֹ֗א כָּל יֹרְדֵ֥י דוּמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/017.yaml
  text: The dead do not praise Yah[b][a], nor do any who go down into silence.
translation:
  language: sw
  text: Wafu hawamsifu Yah, wala yeyote anayeshuka katika kimya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi kina “wote,” lakini katika tungo hii hasi maana yake ni “yeyote” au “hata mmoja.”
    reason: lexical_alternative
  - marker: b
    text: “Kimya” ni usemi wa kishairi kuhusu hali au makao ya wafu; wengine hulielewa hasa kuwa “kaburi” au “Sheoli.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֵּתִים
  choice: Wafu
  rationale: Nomino hii inarejelea watu waliokufa kwa ujumla; “wafu” ni Kiswahili cha kawaida, kifupi, na chenye hadhi.
- source_word: יְהַלְלוּ
  choice: hawamsifu
  rationale: Kitenzi הלל katika piel humaanisha “kusifu.” Muundo huu wa Kiswahili unaonyesha wazi kuwa Yah ndiye anayesifiwa na unafaa katika muktadha wa ibada.
- source_word: יָהּ
  choice: Yah
  rationale: Hili ni umbo fupi la jina la Mungu, tofauti na tetragramatoni kamili יהוה; kwa hiyo limehifadhiwa badala ya kubadilishwa kuwa “BWANA.”
- source_word: כָּל
  choice: yeyote
  rationale: 'Katika tungo hasi, כָּל ina maana ya kigawanyo: hakuna hata mmoja. “Yeyote” huwasilisha maana hiyo kwa Kiswahili cha kawaida kuliko tafsiri ya moja kwa moja “wote,” ambayo ingeweza kueleweka kuwa si wote tu.'
- source_word: יֹרְדֵי
  choice: anayeshuka
  rationale: Kishirikishi cha ירד kinawatambulisha wale wanaoshuka. Umoja baada ya “yeyote” ni muundo wa kawaida wa Kiswahili na huhifadhi maana ya jumla.
- source_word: דוּמָה
  choice: kimya
  rationale: Neno hili linamaanisha ukimya na hapa ni taswira ya kishairi ya hali au makao ya kifo. “Kimya” huhifadhi taswira hiyo bila kuifafanua moja kwa moja kuwa kaburi au Sheoli.
theological_decisions:
- issue: Ikiwa mstari ufafanuliwe kuwa unakanusha kabisa sifa baada ya kifo au uachwe kama lugha ya kishairi kuhusu ukimya wa mauti
  choice: 'Kauli ya kishairi imehifadhiwa: “Wafu hawamsifu Yah ... anayeshuka katika kimya.”'
  alternative: Kutafsiri kwa ufafanuzi kuwa “wafu kaburini hawamsifu BWANA,” au kutaja Sheoli moja kwa moja.
  rationale: Zaburi inatofautisha waabudu walio hai na wafu kwa taswira ya kawaida ya kishairi ya Kiebrania. Tafsiri haipaswi kuamua mjadala mpana kuhusu hali ya mtu baada ya kifo; “kimya” linaacha mvutano wa kiteolojia uliomo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Jina “Yah” limehifadhiwa kama umbo fupi la jina la Mungu. Taswira ya “kushuka katika kimya” imeachwa kwa namna ya kishairi bila kuingiza ufafanuzi wa kimadhehebu.
