  text: They have mouths, but they do not speak; eyes, but they do not see.
translation:
  language: sw
  text: Zina vinywa, lakini hazisemi; zina macho, lakini hazioni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּה
  choice: vinywa
  rationale: Ingawa nomino ya Kiebrania iko katika umoja, imetumiwa kwa maana ya kugawanywa kwa sanamu nyingi; Kiswahili cha kawaida hutumia wingi “vinywa” ili kuonyesha kwamba kila sanamu ina kinywa.
- source_word: לָהֶם
  choice: wana
  rationale: Kihusishi ל pamoja na kiambishi cha nafsi kinaonyesha umilikaji, yaani “wana,” ambayo ni muundo wa kawaida na wa asili katika Kiswahili.
- source_word: וְלֹא
  choice: lakini hawa-
  rationale: Muunganiko huu unaweka tofauti kali kati ya kuwa na viungo na kutoweza kuvitumia; “lakini” huwasilisha ulinganuzi huo kwa uwazi.
- source_word: יְדַבֵּרוּ
  choice: hawasemi
  rationale: Kitenzi kinamaanisha kusema au kunena; “hawasemi” ni tafsiri ya kawaida, yenye heshima, na inayofaa usambamba wa kishairi.
- source_word: עֵינַיִם
  choice: macho
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya umbo la Kiebrania linalomaanisha macho.
- source_word: יִרְאוּ
  choice: hawaoni
  rationale: Kitenzi kinamaanisha kuona; “hawaoni” kinaonyesha kutoweza kwa sanamu kutumia kiungo hicho cha hisi.
theological_decisions:
- issue: Kirejeo cha viwakilishi vya wingi
  choice: 'Viwakilishi vya ngeli ya watu vimetumiwa kwa sanamu: “wana… hawasemi… hawaoni.”'
  alternative: Kutumia muundo wa karibu zaidi na Kiebrania kama “Kinywa kiko kwao… macho yako kwao…” au ngeli ya vitu.
  rationale: Muktadha unaendelea kuzieleza sanamu na kuzidhihaki kwa kuonyesha kwamba zina viungo lakini haziwezi kutenda. Muundo wa “wana… lakini hawa…” ni wa asili katika Kiswahili na unadumisha uhuishaji wa kimakusudi wa lugha ya shairi bila kuongeza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, rahisi kueleweka na chenye hadhi. Usambamba wa kishairi na tofauti ya “wana… lakini hawa…” vimedumishwa.
