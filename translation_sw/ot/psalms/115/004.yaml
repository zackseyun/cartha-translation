  text: עֲֽ֭צַבֵּי/הֶם כֶּ֣סֶף וְ/זָהָ֑ב מַ֝עֲשֵׂ֗ה יְדֵ֣י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/004.yaml
  text: Their idols are silver and gold[a], the work of human hands.
translation:
  language: sw
  text: 'Sanamu zao ni fedha na dhahabu,

    kazi ya mikono ya mwanadamu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲצַבֵּיהֶם
  choice: sanamu zao
  rationale: Katika muktadha huu עָצָב humaanisha sanamu zinazoabudiwa; “sanamu zao” ni wazi, ya kawaida, na inadumisha sauti ya kukosoa ibada ya sanamu.
- source_word: כֶּסֶף וְזָהָב
  choice: fedha na dhahabu
  rationale: Majina haya ya vitu yametafsiriwa moja kwa moja na kuunganishwa kwa “na,” kama katika Kiebrania.
- source_word: מַעֲשֵׂה יְדֵי
  choice: kazi ya mikono ya
  rationale: Tafsiri hii inadumisha muundo wa nomino na taswira halisi ya kitu kilichofanywa kwa mikono, huku ikiwa ya asili katika Kiswahili.
- source_word: אָדָם
  choice: mwanadamu
  rationale: Hapa neno hilo limetumiwa kwa maana ya jumla kuhusu binadamu, si mwanamume fulani; “mwanadamu” inadumisha umoja wa jumla wa Kiebrania na tofauti kati ya yaliyo ya Mungu na yaliyofanywa na binadamu.
theological_decisions:
- issue: Maana ya jumla ya אָדָם katika usemi יְדֵי אָדָם
  choice: mikono ya mwanadamu
  alternative: mikono ya wanadamu
  rationale: Umoja wa “mwanadamu” unaakisi umoja wa jumla katika Kiebrania bila kudokeza mtu maalumu wa kiume. Usemi huo unasisitiza kwamba sanamu ni kazi ya binadamu, tofauti na Mungu aliye hai.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. Mpangilio wa kishairi wa mistari miwili unadumisha ulinganifu na mkazo wa mstari wa Kiebrania.
