translation:
  language: sw
  text: Mbingu, mbingu ni za Yahwe[a]; lakini Yahwe amewapa wanadamu dunia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania linarudia neno “mbingu” kwa msisitizo. Au, “Mbingu ni za Yahwe—naam, mbingu ni zake.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “wana wa mwanadamu,” yaani, wanadamu wote.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁמַיִם שָׁמַיִם
  choice: Mbingu ni mbingu
  rationale: Marudio ya neno שָׁמַיִם yanahifadhiwa ili kuonyesha msisitizo wa kishairi na muundo wa mada na maelezo katika Kiebrania, ingawa usemi huo ni wa kishairi kuliko wa kawaida katika Kiswahili.
- source_word: לַיהוָה
  choice: za Yahwe
  rationale: Kiambishi ל־ kinaonyesha umiliki hapa. Jina la agano יהוה limetolewa kama “Yahwe,” na “za” linaeleza kwamba mbingu ni mali yake.
- source_word: וְהָאָרֶץ
  choice: lakini dunia
  rationale: וְ linaweza kumaanisha “na,” lakini hapa mistari miwili inalinganishwa kwa utofautishaji; “lakini” huonyesha uhusiano huo kwa kawaida. “Dunia” linafaa kwa הָאָרֶץ katika muktadha wa ulimwengu unaotofautishwa na mbingu.
- source_word: נָתַן
  choice: amewapa
  rationale: Kitenzi kikamilifu kinaonyesha tendo lililotimizwa lenye matokeo yanayoendelea. Mtendaji anayeeleweka kutokana na muktadha ni Yahwe; umbo “amewapa” pia linaonyesha wapokeaji walio wengi.
- source_word: לִבְנֵי אָדָם
  choice: wanadamu
  rationale: Usemi wa Kiebrania “wana wa Adamu/mwanadamu” humaanisha watu kwa ujumla. “Wanadamu” ni neno la kawaida la Kiswahili linalohifadhi uhusiano wa kimsamiati na אָדָם bila kudokeza wanaume pekee.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina יהוה moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi la Mungu badala ya kulibadili kuwa cheo.
- issue: Maana ya בְנֵי אָדָם
  choice: wanadamu
  alternative: wana wa mwanadamu
  rationale: Usemi huu unawahusu binadamu wote, si wanaume au ukoo fulani pekee. “Wanadamu” ni wa asili katika Kiswahili na huhifadhi maana hiyo pana; tafsiri ya neno kwa neno imeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio yasiyo ya kawaida katika kishazi cha kwanza yamehifadhiwa kwa makusudi kwa sababu ni sehemu ya msisitizo wa kishairi wa Kiebrania; tanbihi inatoa namna nyingine ya kuyaeleza.
