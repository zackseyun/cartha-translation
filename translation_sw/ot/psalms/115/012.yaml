  variant: Standard East African Swahili
source:
  edition: WLC
  text: יְהוָה֮ זְכָרָ֪/נוּ יְבָ֫רֵ֥ךְ יְ֭בָרֵךְ אֶת בֵּ֣ית יִשְׂרָאֵ֑ל יְ֝בָרֵ֗ךְ אֶת בֵּ֥ית אַהֲרֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/012.yaml
  text: Yahweh has remembered us[a]; he will bless; he will bless the house of Israel; he will bless the house of Aaron.
translation:
  language: sw
  text: Yahwe ametukumbuka[a]; atabariki; ataibariki nyumba ya Israeli; ataibariki nyumba ya Aroni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe ametufikiria kwa wema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano YHWH limetafsiriwa moja kwa moja kwa umbo la Kiswahili lililozoeleka, badala ya cheo ‘BWANA’.
- source_word: זְכָרָנוּ
  choice: ametukumbuka
  rationale: 'Kauli timilifu Qal, nafsi ya tatu umoja pamoja na kiambishi cha nafsi ya kwanza wingi, inaonyesha tendo lililotimia lenye umuhimu wa sasa: ‘ametukumbuka.’'
- source_word: יְבָרֵךְ
  choice: atabariki
  rationale: Kauli isiyotimilifu imetafsiriwa kama wakati ujao wa uhakika katika muktadha. Urudiaji wake umehifadhiwa kwa ajili ya msisitizo wa kishairi.
- source_word: בֵּית יִשְׂרָאֵל
  choice: nyumba ya Israeli
  rationale: ‘Nyumba’ huhifadhi maana ya pamoja ya ukoo na agano, na pia muundo unaorudiwa katika mstari.
- source_word: בֵּית אַהֲרֹן
  choice: nyumba ya Aroni
  rationale: Tafsiri hii inadumisha usambamba na ‘nyumba ya Israeli’ na kutaja wazi ukoo wa kikuhani wa Aroni.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano YHWH. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Nguvu ya יְבָרֵךְ
  choice: atabariki
  alternative: na abariki
  rationale: Katika mfuatano ‘ametukumbuka ... atabariki,’ hali hii inaeleweka vizuri kama tamko la tumaini lenye uhakika kuhusu baraka ijayo, ingawa Kiebrania kinaweza pia kuruhusu maana ya ombi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Urudiaji wa ‘atabariki’ umehifadhiwa, na nusu-koloni zimetumiwa kuonyesha vipande vya kishairi.
