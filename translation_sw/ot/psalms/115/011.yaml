  yaml_path: translation/ot/psalms/115/011.yaml
  text: You who fear Yahweh[a], trust in Yahweh; he is their help and their shield.
translation:
  language: sw
  text: Enyi mnaomcha Yahweh[a], mtumainini Yahweh; yeye ni msaada wao na ngao yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wanaomcha Yahweh.” Kishirikishi cha Kiebrania kinaweza kueleweka kama wito wa moja kwa moja (“Enyi mnaomcha”) au kama jina la kundi (“Wanaomcha”).
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי
  choice: Enyi mnaomcha
  rationale: Hii ni participio ya wingi iliyotumiwa kama nomino, yaani ‘wanaomcha.’ Muundo wa wito ‘Enyi mnaomcha’ unaendana na amri ya wingi inayofuata na mtindo wa kuhimiza wa zaburi hii.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kwa umbo la Kiswahili ‘Yahwe,’ badala ya kubadilishwa kuwa cheo kama ‘BWANA.’
- source_word: בִּטְחוּ בַיהוָה
  choice: mtumainini Yahwe
  rationale: Kitenzi בטח pamoja na kihusishi ב humaanisha kumtumainia au kuweka tumaini katika mtu. ‘Mtumainini Yahwe’ ni amri ya wingi iliyo wazi na ya kawaida katika Kiswahili.
- source_word: עֶזְרָם
  choice: msaada wao
  rationale: Nomino עזר inaweza kumaanisha ‘msaada’ au ‘msaidizi.’ ‘Msaada wao’ huhifadhi muundo wa kishairi na ulinganifu wake na ‘ngao yao.’
- source_word: וּמָגִנָּם
  choice: na ngao yao
  rationale: מגן ni ngao halisi inayotumiwa hapa kama sitiari ya ulinzi; sitiari hiyo imehifadhiwa badala ya kufasiriwa kwa jumla kuwa ‘mlinzi.’
- source_word: הוּא
  choice: yeye ni
  rationale: Kiwakilishi huru kina mkazo. ‘Yeye ni’ hudhihirisha mkazo huo katika Kiswahili.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja. ‘Yahwe’ huhifadhi jina hilo kwa umbo linalotambulika katika Kiswahili bila kulibadilisha kuwa cheo.
- issue: Kubadilika kutoka kwa wito wa nafsi ya pili kwenda kwa kauli ya nafsi ya tatu
  choice: ‘Enyi mnaomcha … mtumainini’; kisha ‘msaada wao … ngao yao’
  alternative: Kufanya viwakilishi vyote viwe vya nafsi ya pili au ya tatu
  rationale: Kiebrania kina amri ya wingi inayoweza kusikika kama wito wa moja kwa moja, halafu kinatumia viambishi vya nafsi ya tatu ‘wao/yao.’ Tafsiri imehifadhi mvutano huo badala ya kusawazisha viwakilishi kimyakimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Enyi’ inafaa kwa wito wa kishairi bila kuwa ya kizamani kupita kiasi; ‘ngao’ huhifadhi taswira halisi ya Kiebrania.
