  text: יִ֭שְׂרָאֵל בְּטַ֣ח בַּ/יהוָ֑ה עֶזְרָ֖/ם וּ/מָגִנָּ֣/ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/009.yaml
  text: Israel[a], trust in Yahweh; he is their help and their shield.
translation:
  language: sw
  text: Israeli, mtumaini Yahweh[a]; yeye ni msaada wao na ngao yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina jina la Mungu YHWH.
    reason: Kufafanua kwamba ‘Yahweh’ linawakilisha jina la Mungu lililoandikwa katika matini ya Kiebrania.
lexical_decisions:
- source_word: יִשְׂרָאֵל
  choice: watu wa Israeli
  rationale: Jina hili linarejelea taifa la agano kwa ujumla. Nyongeza ya ‘watu wa’ hufanya mwito wa moja kwa moja uwe wa kawaida katika Kiswahili bila kubadili mrejelewa.
- source_word: בְּטַח
  choice: mtumainini
  rationale: Kitenzi ni amri ya kumtegemea mtu kwa uhakika. Ingawa Kiebrania kinatumia umoja kwa Israeli kama jamii moja, wingi wa Kiswahili unafaa kwa mwito ‘watu wa Israeli’.
- source_word: בַּיהוָה
  choice: Yahweh
  rationale: Kihusishi בְּ kinaonyesha anayelengwa na tumaini, naye ni Mungu anayetajwa kwa jina la agano YHWH. Katika Kiswahili, kitenzi ‘tumainini’ humchukua mlengwa moja kwa moja bila kuhitaji kihusishi ‘katika’.
- source_word: עֶזְרָם
  choice: msaada wao
  rationale: Nomino עֵזֶר pamoja na kiambishi cha nafsi ya tatu wingi imehifadhiwa kwa maana yake ya moja kwa moja, ‘msaada wao’, badala ya tafsiri ya kufasiri zaidi kama ‘msaidizi wao’.
- source_word: וּמָגִנָּם
  choice: na ngao yao
  rationale: Taswira halisi ya מָגֵן kama ‘ngao’ imehifadhiwa badala ya kufupishwa kuwa ‘mlinzi’.
- source_word: הוּא
  choice: yeye ndiye
  rationale: Kiwakilishi huru cha Kiebrania kina mkazo. ‘Yeye ndiye’ huonyesha mkazo huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania inatumia moja kwa moja jina la Mungu YHWH. ‘Yahweh’ hulihifadhi kama jina la agano badala ya kulibadili kuwa cheo.
- issue: Israeli kuitwa kwa umoja lakini kurejelewa kwa wingi
  choice: Mwito wa wingi ‘Enyi watu wa Israeli, mtumainini’, kisha ‘wao/yayo’
  alternative: Mwito wa umoja kwa Israeli kama taifa moja
  rationale: Kiebrania humwita Israeli kwa amri ya umoja wa kijamii, kisha hutumia viambishi vya wingi katika ‘msaada wao’ na ‘ngao yao’. Kiswahili cha kawaida huwasilisha mwito huo kwa wingi huku kikihifadhi mabadiliko ya nafsi yaliyomo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. ‘Enyi’ hudumisha sauti ya mwito wa kishairi; ‘ngao’ huhifadhi sitiari halisi ya zaburi.
