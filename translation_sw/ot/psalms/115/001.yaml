  text: לֹ֤א לָ֥/נוּ יְהוָ֗ה לֹ֫א לָ֥/נוּ כִּֽי לְ֭/שִׁמְ/ךָ תֵּ֣ן כָּב֑וֹד עַל חַ֝סְדְּ/ךָ֗ עַל אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/001.yaml
  text: Not to us[a], O Yahweh, not to us, but to your name give glory, because of your steadfast love, because of your faithfulness.
translation:
  language: sw
  text: 'Si kwetu, Ee Yahwe, si kwetu,


    bali jina lako lipewe utukufu,


    kwa sababu ya upendo wako thabiti,


    kwa sababu ya uaminifu wako.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kweli yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limeandikwa moja kwa moja badala ya kubadilishwa kuwa cheo; “Yahwe” ni umbo la Kiswahili linalosomeka kwa kawaida.
- source_word: לֹא לָנוּ ... לֹא לָנוּ
  choice: Si kwetu ... si kwetu
  rationale: Huhifadhi ukanushaji wenye mkazo na urudiaji wa kishairi wa Kiebrania, unaokataa kwamba utukufu ni wa wasemaji.
- source_word: תֵּן כָּבוֹד
  choice: lipe utukufu
  rationale: Huhifadhi maana halisi ya ‘toa/peana utukufu’; muundo huu unaonyesha kwamba utukufu unatambuliwa kuwa wa jina la Mungu, si kwamba Mungu anapewa sifa ambayo hakuwa nayo.
- source_word: לְשִׁמְךָ
  choice: jina lako
  rationale: Huhifadhi picha halisi ya ‘jina,’ ambayo pia hubeba maana ya sifa na tabia iliyofunuliwa ya Mungu.
- source_word: כִּי
  choice: bali
  rationale: 'Katika muktadha huu huanzisha upande chanya unaotofautiana na ukanushaji uliorudiwa: si kwetu, bali kwa jina lako.'
- source_word: עַל
  choice: kwa sababu ya
  rationale: Hueleza msingi wa ombi, yaani upendo na uaminifu wa Mungu.
- source_word: חַסְדְּךָ
  choice: upendo wako thabiti
  rationale: Huonyesha upendo wa kudumu na wa uaminifu bila kutumia istilahi ya kidhehebu au lugha ya kizamani.
- source_word: אֲמִתֶּךָ
  choice: uaminifu wako
  rationale: Katika jozi ya kishairi pamoja na חֶסֶד, neno hili linaelekea kumaanisha kutegemeka au uaminifu; maana mbadala ‘kweli’ imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; kulitafsiri kwa jina hudumisha tofauti yake na cheo kama ‘Bwana.’
- issue: Maana ya אֲמִתֶּךָ sambamba na חַסְדְּךָ
  choice: uaminifu wako
  alternative: kweli yako
  rationale: Katika jozi hii neno linaweza kusisitiza kutegemeka kwa Mungu, lakini maana ya ‘kweli’ ni halali pia na imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki chenye mtindo wa kishairi, wa heshima na unaoeleweka. Urudiaji wa Kiebrania umehifadhiwa, na mistari imepangwa kuonyesha ulinganifu wa zaburi.
