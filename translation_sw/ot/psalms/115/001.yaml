  verdict: revise
  source_fidelity: The repeated denial, the appeal to Yahwe, and the two grounds of divine steadfast love and faithfulness are accurately represented. However, “jina lako lipe utukufu” grammatically makes God’s name the giver of glory, whereas the Hebrew imperatively asks Yahweh to give glory to his name.
  naturalness: The poetic lineation and wording are clear Standard East African Swahili. Changing the central petition to the passive subjunctive makes its intended sense natural and unambiguous.
  terminology: “Yahwe,” “upendo wako thabiti,” and “uaminifu wako” are appropriate. The footnote’s “kweli yako” preserves the legitimate lexical alternative for אֱמֶת.
  issues:
  - severity: high
    issue: The verb phrase “jina lako lipe utukufu” reverses the grammatical roles in the central petition.
    rationale: Lipe is an active subjunctive with “jina lako” as subject (“may your name give glory”). Hebrew תן כבוד לשמך addresses Yahweh and requests that glory be given to his name. “Jina lako lipewe utukufu” correctly expresses the requested attribution of glory without adding interpretive content.
