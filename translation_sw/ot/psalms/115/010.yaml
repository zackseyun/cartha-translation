  text: בֵּ֣ית אַ֭הֲרֹן בִּטְח֣וּ בַ/יהוָ֑ה עֶזְרָ֖/ם וּ/מָגִנָּ֣/ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/010.yaml
  text: O house of Aaron[a], trust in Yahweh[b]; he is their help and their shield.
translation:
  language: sw
  text: Enyi nyumba ya Aroni, mtumainini Yahweh; yeye ni msaada wao na ngao yao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית אַהֲרֹן
  choice: nyumba ya Aroni
  rationale: Huhifadhi nahau ya Kiebrania na ulinganifu wake na makundi yanayotajwa katika muktadha; hapa ni mwito kwa ukoo wa kikuhani wa Aroni.
- source_word: בִּטְחוּ
  choice: mtumainini
  rationale: Ni amri ya wingi kutoka בטח. ‘Mtumainini’ ni Kiswahili cha kawaida na chenye hadhi kwa kumtegemea mtu kwa imani.
- source_word: בַיהוָה
  choice: Yahweh
  rationale: Herufi nne za jina la Mungu יְהוָה zimetafsiriwa kwa kulitamka kama ‘Yahweh,’ huku kiambishi ב kikieleweka kiasili ndani ya kitenzi cha Kiswahili ‘mtumainini.’
- source_word: עֶזְרָם
  choice: msaada wao
  rationale: Nomino עֵזֶר yenye kiambishi cha nafsi ya tatu wingi humaanisha ‘msaada wao’; tafsiri hii huhifadhi pia badiliko la nafsi kutoka amri ya pili wingi kwenda maelezo ya nafsi ya tatu.
- source_word: וּמָגִנָּם
  choice: na ngao yao
  rationale: Huhifadhi taswira halisi ya מָגֵן, ‘ngao,’ badala ya kuibadili kuwa dhana ya jumla kama ‘mlinzi.’
- source_word: הוּא
  choice: yeye ni
  rationale: Kiwakilishi huru kina mkazo katika kishazi kisicho na kitenzi; Kiswahili huwasilisha hilo kwa kawaida kwa ‘yeye ni,’ bila kuongeza wazo la ‘peke yake.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ina jina la agano moja kwa moja. ‘Yahweh’ hulihifadhi kama jina maalumu bila kulibadili kuwa cheo.
- issue: Badiliko kutoka nafsi ya pili kwenda nafsi ya tatu
  choice: msaada wao na ngao yao
  alternative: msaada wenu na ngao yenu
  rationale: Viambishi vya Kiebrania ni vya nafsi ya tatu wingi. Tafsiri inalinda badiliko hilo la kisarufi na mvutano wake badala ya kulisawazisha kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Enyi’ huonyesha mwito wa moja kwa moja kwa kundi; ‘nyumba ya Aroni’ huhifadhi nahau ya kishairi ya Kiebrania. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zilizohitajika katika rasimu hii.
