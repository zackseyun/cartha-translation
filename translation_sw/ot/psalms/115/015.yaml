lexical_decisions:
- source_word: בְּרוּכִים אַתֶּם
  choice: Mbarikiwe
  rationale: Kirai hiki kina kivumishi ambacho pia ni kauli tendwa ya wakati uliopo, pamoja na kiwakilishi cha nafsi ya pili wingi. Katika muktadha huu ni tamko la baraka; hali ya kutegemea ya Kiswahili huwasilisha kwa kawaida maana ya ombi au tamko hilo bila kupoteza wingi wa wanaosemeshwa.
- source_word: לַיהוָה
  choice: na Yahweh
  rationale: Katika fomula hii ya baraka, ל־ huonyesha chanzo au mtendaji wa baraka. Kwa kauli tendwa ya Kiswahili, “na Yahweh” humtambulisha Yahweh kuwa anayetoa baraka.
- source_word: עֹשֵׂה
  choice: Muumba wa
  rationale: Kauli tendaji hii imetumiwa kama jina la cheo cha Mungu. “Muumba” ni tafsiri fupi, ya kawaida na yenye heshima katika Kiswahili.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: mbingu na dunia
  rationale: Jozi hii ya maneno hueleza uumbaji wote. “Mbingu na dunia” ni usemi wa kawaida wa Kiswahili unaohifadhi maana hiyo ya kiujumla.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה. “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Je, kirai ni taarifa au ombi la baraka?
  choice: Mbarikiwe na Yahweh
  alternative: Ninyi mmebarikiwa na Yahweh
  rationale: Kiebrania hakina kitenzi bayana na kinaweza kusomwa kihalisi kama hali ya kuwa wenye baraka; hata hivyo, muktadha wa zaburi unaunga mkono fomula ya baraka. Hali ya kutegemea katika “Mbarikiwe” huwasilisha nguvu hiyo ya kibarakio, huku tanbihi ikihifadhi muundo na uwezekano wa tafsiri ya karibu zaidi na maneno ya Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mbarikiwe” ni wingi na inafaa kwa tamko la baraka; “Muumba” limetumiwa kama jina la cheo.
