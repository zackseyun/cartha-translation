    text: 'Kiebrania kwa karibu: “Mmebarikiwa na Yahweh.” Kifungu hiki hakina kitenzi bayana katika Kiebrania na ni fomula ya baraka; kwa hiyo kimetafsiriwa, “Mbarikiwe na Yahweh.”'
