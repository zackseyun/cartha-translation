lexical_decisions:
- source_word: כְּמוֹהֶם
  choice: kama hizo
  rationale: Kiambishi כְּ cha ulinganisho pamoja na kiwakilishi cha wingi hueleza kufanana; “kama hizo” hurejelea sanamu zilizotajwa katika mistari iliyotangulia.
- source_word: יִהְיוּ
  choice: watakuwa
  rationale: Kitenzi היה katika hali hii kinaweza kumaanisha “watakuwa” au, kwa kuzingatia matokeo, “watakuwa kama”; tafsiri kuu inahifadhi usemi wa kawaida wa Kiswahili bila kulazimisha wazo la mabadiliko.
- source_word: עֹשֵׂיהֶם
  choice: wanaozitengeneza
  rationale: Kivumishi-tendo cha עשה chenye kiwakilishi cha nafsi ya tatu wingi kinawataja watu wanaotengeneza sanamu hizo.
- source_word: כֹּל אֲשֶׁר
  choice: kila anaye
  rationale: Muundo huu una maana ya kila mtu anayefanya jambo linalofuata, na unahifadhi upeo wa wote.
- source_word: בֹּטֵחַ בָּהֶם
  choice: anayezitumaini
  rationale: בטח pamoja na ב hueleza kuweka tumaini au kutegemea kitu; “kuzitumaini” ni usemi wa kawaida na wa kidini unaofaa hapa.
theological_decisions:
- issue: Aina ya kufanana na sanamu
  choice: Aya inasema watengenezaji na wanaozitumaini sanamu watakuwa kama hizo, bila kufafanua katika matini kuu kila upande wa kufanana huko.
  alternative: Kufafanua moja kwa moja kwamba watakuwa bubu, vipofu, viziwi na wasio na nguvu kiroho.
  rationale: Kiebrania kinathibitisha kufanana, lakini hakifafanui upeo wake ndani ya aya hii; tanbihi inaonyesha muktadha bila kuingiza ufafanuzi wa ziada katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hizo” limetumiwa kwa sababu rejeo ni sanamu; “pia” linaonyesha kuwa kauli ya mwisho inawahusisha wote wanaozitumaini.
