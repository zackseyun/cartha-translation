  text: Wanaozitengeneza watakuwa kama hizo[a][b], na vivyo hivyo kila anayezitumaini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watageuka kuwa kama hizo.” Kitenzi cha Kiebrania kinaweza kumaanisha “watakuwa” au kusisitiza kufikia hali hiyo.
    reason: lexical_alternative
  - marker: b
