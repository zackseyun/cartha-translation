  text: וֵֽ/אלֹהֵ֥י/נוּ בַ/שָּׁמָ֑יִם כֹּ֭ל אֲשֶׁר חָפֵ֣ץ עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/003.yaml
  text: But our God is in the heavens[b][a]; he does all that he pleases.
translation:
  language: sw
  text: Lakini Mungu wetu yuko mbinguni; hufanya chochote anachopenda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hufanya yote anayotaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וֵאלֹהֵינוּ
  choice: Lakini Mungu wetu
  rationale: Katika muktadha, ו inaonyesha utofauti kati ya Mungu aliye hai na sanamu zisizo na uwezo; kwa hiyo “Lakini” linaonyesha vizuri nguvu hiyo ya kimuktadha.
- source_word: בַשָּׁמַיִם
  choice: yuko mbinguni
  rationale: Ingawa neno la Kiebrania lina umbo la wingi, “mbinguni” ndiyo njia ya kawaida na yenye hadhi katika Kiswahili ya kueleza makao ya juu ya Mungu bila kudokeza kuwa yuko katika mbingu moja tu.
- source_word: כֹּל אֲשֶׁר
  choice: chochote
  rationale: Muundo huu unaonyesha upeo usio na kikomo wa jambo linalofuata; “chochote” ni wa asili katika Kiswahili na huwasilisha maana ya ‘yote ambayo’.
- source_word: חָפֵץ
  choice: anachopenda
  rationale: חפץ inaweza kumaanisha kupendezwa, kutamani, au kutaka. “Anachopenda” huhifadhi wazo la mapenzi na ridhaa bila kulifanya neno hilo kuwa istilahi finyu ya kiteolojia.
- source_word: עָשָׂה
  choice: hufanya
  rationale: Ingawa kitenzi kina umbo timilifu, hapa kinaeleza ukweli wa kawaida kuhusu utendaji wenye matokeo wa Mungu; “hufanya” huwasilisha vizuri maana hiyo ya kudumu.
theological_decisions:
- issue: Maneno kuhusu enzi kuu ya Mungu
  choice: hufanya chochote anachopenda
  alternative: hufanya yote anayotaka
  rationale: Kauli hii inathibitisha uhuru na uwezo wa Mungu wa kutenda, tofauti na sanamu zisizo na nguvu. “Anachopenda” huhifadhi upana wa חפץ bila kuingiza mfumo maalumu wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. “Mbinguni” ni usemi wa kawaida wa Kiswahili unaowakilisha בַשָּׁמַיִם kwa ufasaha.
