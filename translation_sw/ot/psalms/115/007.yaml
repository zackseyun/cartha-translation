base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/007.yaml
  text: They have hands[a], but cannot feel; feet, but cannot walk[b]; they do not make a sound in their throat.
translation:
  language: sw
  text: Wana mikono, lakini hawawezi kugusa[a]; wana miguu, lakini hawawezi kutembea; hawatoi sauti kooni mwao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wana mikono, lakini hawagusi ... wana miguu, lakini hawatembei.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hawanung’uniki kooni mwao”; kitenzi cha Kiebrania kinaweza kurejelea kutoa sauti ya chini au kunung’unika.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדֵיהֶם
  choice: Wana mikono
  rationale: Kiebrania kina maana ya ‘mikono yao’ katika kishazi kisicho na kitenzi. Kiswahili cha ‘Wana mikono’ huonyesha umiliki uliodokezwa na kudumisha mlingano wa kishairi.
- source_word: יְמִישׁוּן
  choice: hawawezi kupapasa
  rationale: Kitenzi מושׁ hapa kinahusu kutumia mikono kugusa au kupapasa. ‘Kupapasa’ huhifadhi wazo la kuhisi kwa kugusa, huku ‘hawawezi’ ikionyesha udhaifu wa sanamu unaokusudiwa katika muktadha.
- source_word: רַגְלֵיהֶם
  choice: wana miguu
  rationale: Tafsiri hii ya kawaida ya ‘miguu yao’ inalingana kwa ufupi na kishazi ‘Wana mikono.’
- source_word: יְהַלֵּכוּ
  choice: hawawezi kutembea
  rationale: Kimuundo ni ‘hawatembei,’ lakini katika kejeli dhidi ya sanamu, ukanushaji unaonyesha kutokuwa na uwezo; ‘hawawezi kutembea’ hutoa maana hiyo wazi katika Kiswahili.
- source_word: יֶהְגּוּ
  choice: hawatoi sauti
  rationale: הגה inaweza kumaanisha kutoa sauti ya chini, kunong’ona, au kunung’unika. Kauli pana ‘hawatoi sauti’ inafaa kwa sanamu na haibani maana kwenye aina moja tu ya matamshi.
- source_word: בִּגְרוֹנָם
  choice: kooni mwao
  rationale: גרון ni ‘koo.’ ‘Kooni mwao’ huhifadhi taswira ya sauti inayotokea kooni na ni Kiswahili cha kawaida.
theological_decisions:
- issue: Kutokuwa na uwezo kwa sanamu
  choice: Kutumia ‘hawawezi’ kwa kupapasa na kutembea
  alternative: Kutafsiri rasmi zaidi ‘hawapapasi/hawagusi’ na ‘hawatembei’
  rationale: Muktadha unazidhihaki sanamu kuwa vitu visivyo na uwezo, si kwamba zimeamua tu kutotenda. Hata hivyo, namna rasmi zaidi imehifadhiwa katika tanbihi.
- issue: Upana wa maana ya יֶהְגּוּ
  choice: hawatoi sauti
  alternative: hawanung’uniki au hawanong’oni
  rationale: Kitenzi kinaweza kutaja sauti ya chini bila kulazimisha maana ya usemi kamili. Tafsiri kuu inadumisha upana huo, na tanbihi inaonyesha mbadala mahususi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi wa vipashio sambamba unadumisha ushairi wa mstari wa Kiebrania; ‘kooni mwao’ ni ya kawaida na huhifadhi taswira ya asili.
