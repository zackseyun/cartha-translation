  text: יְ֭בָרֵךְ יִרְאֵ֣י יְהוָ֑ה הַ֝/קְּטַנִּ֗ים עִם הַ/גְּדֹלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/013.yaml
  text: He will bless those who fear Yahweh[a], the small together with the great.
translation:
  language: sw
  text: 'Atawabariki wale wanaomcha Yahweh,

    wadogo pamoja na wakubwa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walio wa chini pamoja na walio wakuu”; Kiebrania kinatofautisha watu wadogo na wakubwa kwa maana pana, huenda ikihusisha hadhi yao katika jamii wala si ukubwa wa mwili pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרֵךְ
  choice: Atawabariki
  rationale: Kitenzi cha Piel imperfect nafsi ya tatu umoja, huku Mungu akiwa mtenda aliyedokezwa na muktadha. Wakati ujao unaonyesha hakikisho la baraka.
- source_word: יִרְאֵי יְהוָה
  choice: wale wanaomcha Yahweh
  rationale: Kirai hiki cha kishiriki katika hali ya muundo kinawataja watu. ‘Wanaomcha’ ni Kiswahili cha kawaida kinachohifadhi maana ya hofu yenye uchaji na uaminifu kwa Mungu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetoholewa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: הַקְּטַנִּים
  choice: wadogo
  rationale: Nomino-kivumishi hiki kinatofautishwa na ‘wakubwa.’ ‘Wadogo’ huhifadhi upana wa maana bila kuifunga kwa umri, ukubwa wa mwili, au hadhi pekee.
- source_word: עִם
  choice: pamoja na
  rationale: Huonyesha ujumuishaji wa makundi yote mawili kwa Kiswahili cha asili.
- source_word: הַגְּדֹלִים
  choice: wakubwa
  rationale: Huhifadhi ulinganifu na ‘wadogo’ na inaweza kuhusisha hadhi, umuhimu, au ukuu kwa maana pana.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; ‘Yahweh’ huhifadhi jina hilo badala ya kuliweka kama cheo.
- issue: Maana ya kumcha Yahweh
  choice: wanaomcha Yahweh
  alternative: wanaomheshimu Yahweh
  rationale: ‘Kumcha’ hudumisha uzito wa ירא na pia kwa kawaida katika lugha ya kibiblia hujumuisha uchaji, si hofu tupu; ‘kumheshimu’ pekee ingeweza kudhoofisha maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Mpangilio wa mistari unahifadhi ulinganifu wa kishairi; ‘wadogo pamoja na wakubwa’ ni wa asili huku ukidumisha utata mpana wa Kiebrania.
