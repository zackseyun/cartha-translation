  text: אָזְנַ֣יִם לָ֭/הֶם וְ/לֹ֣א יִשְׁמָ֑עוּ אַ֥ף לָ֝/הֶ֗ם וְ/לֹ֣א יְרִיחֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/006.yaml
  text: They have ears, but do not hear; noses, but do not smell.
translation:
  language: sw
  text: Wana masikio, lakini hawasikii; wana pua, lakini hawanusi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָזְנַיִם
  choice: masikio
  rationale: Nomino ya uwili/wingi inayotaja viungo vya kusikia; “masikio” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: לָהֶם
  choice: wana
  rationale: Ingawa muundo wa Kiebrania ni kihalisi “kwao,” hapa unaonyesha umilikaji; Kiswahili cha kawaida hutumia “wana.”
- source_word: יִשְׁמָעוּ
  choice: hawasikii
  rationale: Kitenzi שׁמע hapa kinamaanisha uwezo wa kusikia, si tendo la kutii au kusikiliza kwa makusudi.
- source_word: אַף
  choice: pua
  rationale: Katika muktadha huu אַף ni kiungo cha kunusia, si maana ya kitamathali ya hasira. Kiswahili hutumia “pua” kwa umbo lilelile katika umoja na wingi.
- source_word: יְרִיחוּן
  choice: hawanusi
  rationale: Umbo hili la kitenzi linamaanisha kunusa; “hawanusi” linaeleza kwa ufupi kutokuwepo kwa uwezo huo.
- source_word: וְלֹא
  choice: lakini hawa-
  rationale: Kihalisi ni “na si,” lakini “lakini” huwasilisha kwa kawaida zaidi tofauti ya kejeli kati ya kuwa na viungo na kutoweza kuvitumia.
theological_decisions:
- issue: Maelezo ya sanamu kwa viungo vya kibinadamu
  choice: Kuhifadhi taswira halisi ya sanamu kuwa na viungo vya hisi bila uwezo wa kuhisi
  alternative: Kufafanua moja kwa moja kuwa sanamu hazina uwezo wa kiroho
  rationale: Kiebrania chenyewe kinatumia taswira thabiti ya mwili katika hoja dhidi ya ibada ya sanamu. Tafsiri ya moja kwa moja huhifadhi nguvu ya balagha bila kuongeza ufafanuzi wa kiteolojia katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo sambamba “wana..., lakini hawa...” unahifadhi urari na kejeli ya kishairi ya Kiebrania.
