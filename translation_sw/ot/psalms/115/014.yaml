  source_fidelity: '“Yahwe na awaongeze—ninyi na watoto wenu” accurately conveys the benedictory force of יֹסֵף and retains the Hebrew’s emphatic repetition: the object prefix in awaongeze corresponds to the first “you,” while the explicit ninyi introduces “you and your children.” “Watoto wenu” appropriately renders בְּנֵיכֶם in this familial blessing context.'
