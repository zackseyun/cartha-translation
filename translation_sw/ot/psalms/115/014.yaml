id: PSA.115.14
reference: Psalms 115:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: יֹסֵ֣ף יְהוָ֣ה עֲלֵי/כֶ֑ם עֲ֝לֵי/כֶ֗ם וְ/עַל בְּנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/014.yaml
  text: May Yahweh give increase to you[b][a]—to you and to your children.
translation:
  language: sw
  text: Yahwe na awaongeze[a]—ninyi na watoto wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe na awaongezee—ninyi na watoto wenu.” Kitenzi cha Kiebrania kinaweza kumaanisha “kuongeza” au “kuzidisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹסֵף
  choice: na awaongeze
  rationale: Hifili ya יסף ina maana ya ‘kuongeza’ au ‘kuzidisha.’ Katika muktadha huu wa baraka, Kiswahili cha kutakia ‘na awaongeze’ kinawasilisha nguvu ya hiari/ombi ya umbo la kitenzi na pia hubaki karibu na maana ya Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetafsiriwa kwa umbo la Kiswahili ‘Yahwe,’ badala ya kubadilishwa kuwa cheo ‘BWANA.’
- source_word: עֲלֵיכֶם ... עֲלֵיכֶם
  choice: awaongeze—ninyi
  rationale: Kirai cha kwanza kimeunganishwa kwa kawaida na kitenzi katika ‘awaongeze,’ kisha marudio ya Kiebrania yamehifadhiwa kwa ‘ninyi’ baada ya mstari mrefu, likifafanua kwa mkazo wanaokusudiwa.
- source_word: וְעַל בְּנֵיכֶם
  choice: na watoto wenu
  rationale: בנים katika baraka ya kifamilia inaweza kumaanisha wana au watoto kwa upana. ‘Watoto wenu’ ni ya kawaida na haibani maana kwa watoto wa kiume pekee.
theological_decisions:
- issue: Nguvu ya hiari ya umbo la kitenzi katika muktadha wa baraka
  choice: 'Kutafsiri kama ombi au takio: ‘Yahwe na awaongeze’'
  alternative: ‘Yahwe atawaongeza’ au ‘Yahwe anawaongeza’
  rationale: Muktadha wa Zaburi 115:12–15 ni wa baraka; kwa hiyo ‘na awaongeze’ huonyesha takio la baraka bila kulifanya kuwa ahadi tambuzi isiyo na utata.
- issue: Uwakilishi wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: ‘Yahwe’ huhifadhi jina binafsi la Mungu katika matini ya Kiebrania badala ya kulibadilisha kwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa baraka ‘na awaongeze’ ni wa kawaida na unaeleweka; mstari mrefu huhifadhi marudio ya mkazo ya Kiebrania bila kufanya sentensi iwe nzito.
