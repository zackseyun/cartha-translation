base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/018.yaml
  text: But we will bless Yah from now and forever[b][a]. Praise Yah!
translation:
  language: sw
  text: Lakini sisi tutamhimidi Yah tangu sasa na hata milele. Msifuni Yah![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Msifuni Yah” hutafsiri usemi wa Kiebrania הַלְלוּ־יָהּ, ambao ndio chanzo cha tamko la kiliturujia “Haleluya.” Yah ni umbo fupi la kishairi la jina la Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Lakini sisi
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha utofauti na wafu waliotajwa katika mstari uliotangulia; Kiswahili hiki kinahifadhi msisitizo wa mhusika.
- source_word: נְבָרֵךְ
  choice: tutamhimidi
  rationale: Piel imperfect nafsi ya kwanza wingi inaonyesha azimio linaloendelea kuelekea wakati ujao. ‘Kumhimidi’ hapa huwasilisha tendo la kumtukuza Mungu kwa sifa bila kutumia lugha ya kumpa baraka.
- source_word: יָהּ
  choice: Yah
  rationale: Hili ni umbo fupi la kishairi la jina la Mungu, tofauti na tetragramatoni kamili; kulitunza kama ‘Yah’ huhifadhi tofauti hiyo na uhusiano wake na mwito wa mwisho.
- source_word: מֵעַתָּה וְעַד עוֹלָם
  choice: tangu sasa na hata milele
  rationale: Kirai kinaonyesha muda unaoanzia sasa na kuendelea bila mwisho; tafsiri hii ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: הַלְלוּ יָהּ
  choice: Msifuni Yah!
  rationale: Amri ya wingi הַלְלוּ inatafsiriwa wazi kwa ‘Msifuni,’ huku jina fupi יָהּ likihifadhiwa; hii pia huweka maana ya chanzo cha neno la kiliturujia ‘Haleluya.’
theological_decisions:
- issue: Uwasilishaji wa umbo fupi la kishairi la jina la Mungu יָהּ
  choice: Yah
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia יָהּ mara mbili, si יְהוָה. ‘Yah’ huhifadhi tofauti ya kimakusudi na kuonyesha wazi muundo wa mwito wa sifa.
- issue: Maana ya נְבָרֵךְ inapomhusu Mungu
  choice: tutamhimidi
  alternative: tutambariki
  rationale: Kitenzi cha Kiebrania kina maana ya msingi ‘bariki,’ lakini kinapokuwa na Mungu kama mtendewa humaanisha kumsifu au kumhimidi. ‘Tutamhimidi’ ni Kiswahili cha asili kinachoepuka wazo lisilokusudiwa kwamba wanadamu wanampa Mungu baraka, ingawa mbadala wa moja kwa moja unabaki halali.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kiliturujia; ‘Lakini sisi’ huhifadhi utofauti na mstari uliotangulia, na ‘Msifuni’ ni amri kwa watu wengi.
