  yaml_path: translation/ot/psalms/115/002.yaml
  text: Why should the nations say[a], “Where now is their God?”
translation:
  language: sw
  text: Kwa nini mataifa yaseme,[a] “Yuko wapi sasa Mungu wao?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa nini mataifa yanasema, ‘Mungu wao yuko wapi sasa?’”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Kwa nini
  rationale: Huanzisha swali la balagha linalopinga dhihaka ya mataifa; pamoja na kitenzi katika hali isiyotimilika, muundo ‘Kwa nini ... yaseme’ huwasilisha vizuri wazo la ‘kwa nini yaruhusiwe/yawe na sababu ya kusema.’
- source_word: יֹאמְרוּ
  choice: yaseme
  rationale: Ni Qal imperfect nafsi ya tatu wingi. Hali ya utegemezi baada ya ‘Kwa nini’ inatoa kwa Kiswahili nguvu ya swali la balagha bila kulifanya kuwa utabiri wa wakati ujao.
- source_word: הַגּוֹיִם
  choice: mataifa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya גּוֹיִם, ikirejelea watu wa mataifa mengine bila kuingiza maana mahususi ya baadaye ya ‘Watu wa Mataifa.’
- source_word: אַיֵּה
  choice: Yuko wapi
  rationale: Ni kiulizi cha mahali. ‘Yuko wapi’ ni muundo wa kawaida wa Kiswahili kwa kuuliza alipo mtu, hapa Mungu.
- source_word: נָא
  choice: sasa
  rationale: Katika dhihaka hii chembe נָא huongeza msisitizo au hali ya wakati wa sasa, si ombi la adabu; ‘sasa’ huhifadhi nguvu hiyo.
- source_word: אֱלֹהֵיהֶם
  choice: Mungu wao
  rationale: Ingawa umbo אֱלֹהִים linaweza kuonekana la wingi, hapa linamtaja Mungu wa Israeli kwa maana ya umoja.
theological_decisions:
- issue: Rejeo la אֱלֹהֵיהֶם
  choice: Mungu wao
  alternative: mungu wao
  rationale: Mataifa yanamdhihaki Israeli kwa kuhoji alipo au anatenda nini Mungu wa Israeli; herufi kubwa inaonyesha rejeo hilo maalumu bila kuongeza fundisho lisilokuwamo katika mstari.
- issue: Nguvu ya לָמָּה pamoja na יֹאמְרוּ
  choice: Kwa nini mataifa yaseme
  alternative: Kwa nini mataifa yanasema
  rationale: Muundo mkuu huhifadhi swali la balagha lenye maana ya kupinga uwezekano au sababu ya mataifa kusema hivyo. Mbadala wa tanbihi huhifadhi usomaji wa kauli ya sasa au inayorudiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio ‘Yuko wapi sasa Mungu wao?’ huhifadhi msisitizo wa kejeli ulio katika chanzo, huku tanbihi ikitoa muundo wa kawaida zaidi unaowezekana.
