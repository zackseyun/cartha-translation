  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu maana ya Kiebrania: kutokuwa na hofu mbele ya habari mbaya, moyo ulio imara, na tumaini linalomwelekea Yahweh. Muundo wa kishiriki “ukimtumaini Yahweh” unaweza kurejelea “moyo” (ngeli ya M-MI) na huhifadhi uhusiano usioelezwa zaidi kati ya uthabiti na tumaini.'
  naturalness: “Hataogopa habari mbaya; moyo wake ni thabiti, ukimtumaini Yahweh” ni Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na kinachofaa kwa usomaji wa hadhara. Ingawa “ukimtumaini” unaweza kusikika kwa baadhi ya wasomaji kama wenye utata wa kimofolojia, katika muktadha wake unarejelea “moyo wake” na unaeleweka.
  terminology: “Habari mbaya,” “moyo wake,” na “thabiti” ni chaguo sahihi na ya kawaida. “Yahweh” inafuata uamuzi wa mradi wa kulihifadhi jina la agano. Tanbihi zote mbili zina alama zinazolingana na mahali pake katika andiko.
