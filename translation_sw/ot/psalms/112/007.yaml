  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: מִ/שְּׁמוּעָ֣ה רָ֭עָה לֹ֣א יִירָ֑א נָכ֥וֹן לִ֝בּ֗/וֹ בָּטֻ֥חַ בַּ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/007.yaml
  text: He will not fear bad news[a]; his heart is steadfast[b], trusting in Yahweh.
translation:
  language: sw
  text: Hataogopa habari mbaya[a]; moyo wake ni thabiti[b], ukimtumaini Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “taarifa mbaya.”
    reason: lexical_alternative
  - marker: b
    text: Au, “moyo wake umeimarika” au “moyo wake umethibitishwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְּׁמוּעָה רָעָה
  choice: habari mbaya
  rationale: Kirai hiki kinamaanisha taarifa yenye maudhui mabaya au yenye kuleta taabu. “Habari mbaya” ni Kiswahili cha kawaida na cha asili, huku wazo la taarifa mbaya likihifadhiwa katika tanbihi.
- source_word: לֹא יִירָא
  choice: hataogopa
  rationale: Kauli ya kutotimia hapa huonyesha mwenendo wa kawaida au jambo la wakati ujao; “hataogopa” huhifadhi nguvu hiyo kwa lugha ya kawaida.
- source_word: נָכוֹן
  choice: thabiti
  rationale: Neno hili huonyesha hali ya kuimarishwa, kuthibitika, au kutikisika; “thabiti” linafaa kwa moyo ulio imara katika tumaini.
- source_word: לִבּוֹ
  choice: moyo wake
  rationale: “Moyo” huhifadhi taswira ya Kiebrania ya utu wa ndani, ikijumuisha nia, fikra, na mwelekeo.
- source_word: בָּטֻחַ
  choice: ukimtumaini
  rationale: Umbo hili linaeleza hali ya kuwa na uhakika au kutumaini. “Ukimtumaini” huunganisha hali ya moyo moja kwa moja na Yahweh bila kupoteza maana ya kutegemea kwa imani.
- source_word: בַּיהוָה
  choice: Yahweh
  rationale: Kihusishi בְּ huonyesha anayelengwa na tumaini, na jina la agano יְהוָה limetafsiriwa kwa kulinakili kama “Yahweh”.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la Mungu la herufi nne. “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya uthabiti wa moyo na kumtumaini Mungu
  choice: moyo wake ni thabiti, ukimtumaini Yahweh
  alternative: moyo wake ni salama kwa sababu anamtumaini Yahweh
  rationale: Tafsiri haiongezi kiunganishi cha kisababishi kama “kwa sababu,” ambacho hakijaelezwa wazi katika Kiebrania; inahifadhi uhusiano wa karibu lakini wenye uwezekano wa kueleweka kama maelezo ya hali au msingi wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa moja kwa moja na unaofaa usomaji wa hadhara; “thabiti” huhifadhi hadhi ya kishairi bila kuwa wa kizamani.
