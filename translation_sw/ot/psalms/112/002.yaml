  text: גִּבּ֣וֹר בָּ֭/אָרֶץ יִהְיֶ֣ה זַרְע֑/וֹ דּ֭וֹר יְשָׁרִ֣ים יְבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/002.yaml
  text: His offspring will be mighty in the land[b][a]; the generation of the upright will be blessed.
translation:
  language: sw
  text: Uzao wake[a] utakuwa hodari katika nchi[b]; kizazi cha wanyofu kitabarikiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wazao wake”; neno la Kiebrania limetumiwa kwa maana ya kijumla.
    reason: lexical_alternative
  - marker: b
    text: Au, “duniani”; neno la Kiebrania אֶרֶץ linaweza kumaanisha “nchi” au “dunia,” ingawa “nchi” linafaa katika muktadha wa zaburi hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבּוֹר
  choice: hodari
  rationale: Neno hili hapa linaonyesha nguvu, uwezo au umashuhuri wa uzao bila kuufanya mahsusi kuwa kundi la mashujaa wa vita. “Hodari” hudumisha upana huo na mtindo ulioinuliwa.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: אֶרֶץ linaweza kumaanisha “nchi” au “dunia.” Katika muktadha huu wa zaburi ya hekima, “katika nchi” linafaa kwa ustawi ndani ya jamii na eneo wanamoishi, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: יִהְיֶה
  choice: utakuwa
  rationale: Ni uwasilishaji wa kawaida wa hali ya wakati ujao. Upatanisho wa ngeli unafuata nomino ya Kiswahili “uzao,” ambayo ni ya umoja lakini ina maana ya kijumla.
- source_word: זַרְעוֹ
  choice: uzao wake
  rationale: זֶרַע humaanisha wazao kwa maana ya kijumla. “Uzao wake” huhifadhi umoja wa kisarufi na maana ya kizazi kinachoendelea bila kutumia tafsiri halisi isiyo ya kawaida ya “mbegu yake.”
- source_word: דּוֹר
  choice: kizazi
  rationale: “Kizazi” ni neno la kawaida na lenye hadhi kwa דּוֹר, likirejelea kundi au mstari wa watu unaotajwa.
- source_word: יְשָׁרִים
  choice: wanyofu
  rationale: יָשָׁר husisitiza unyofu wa kimaadili. “Wanyofu” huhifadhi tofauti yake na neno la Kiebrania צַדִּיק, ambalo kwa kawaida hutafsiriwa “waadilifu” au “wenye haki.”
- source_word: יְבֹרָךְ
  choice: kitabarikiwa
  rationale: Kauli ya kutendwa kutoka ברך imehifadhiwa wazi. “Kitabarikiwa” hudumisha wazo pana la kupokea baraka bila kulipunguza kuwa ustawi wa mali pekee.
theological_decisions:
- issue: Upeo wa ahadi ya baraka katika zaburi ya hekima
  choice: Kauli pana kuhusu nguvu na baraka kwa uzao na kizazi imehifadhiwa bila kuifafanua kuwa mali pekee au wokovu wa lazima wa kila mzao.
  alternative: Kuieleza kama ustawi wa mali tu, au kama hakikisho la wokovu wa kiroho kwa wazao wote.
  rationale: Kiebrania kinazungumza kwa upana wa lugha ya hekima kuhusu kuwa hodari na kubarikiwa. Tafsiri haipaswi kuingiza dai finyu la kimafundisho ambalo mstari wenyewe hautoi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. “Uzao” na “kizazi” hudumisha usambamba wa kishairi, huku “hodari” na “kitabarikiwa” vikihifadhi upana wa maana ya Kiebrania.
