  text: טֽוֹב אִ֭ישׁ חוֹנֵ֣ן וּ/מַלְוֶ֑ה יְכַלְכֵּ֖ל דְּבָרָ֣י/ו בְּ/מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/005.yaml
  text: Good is the man who is gracious and lends[a]; he conducts his affairs with justice.
translation:
  language: sw
  text: Heri mtu mwenye fadhili na anayekopesha; anaendesha mambo yake[a] kwa haki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maneno yake.” Neno la Kiebrania דְּבָרָיו linaweza kumaanisha “mambo yake” au “maneno yake,” ingawa “mambo yake” linafaa zaidi katika muktadha wa kukopesha na kutenda kwa haki.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Heri
  rationale: Neno hili linafungua mstari kwa kueleza hali njema ya mtu huyo. “Heri” ni usemi wa kawaida na wenye heshima katika Kiswahili kwa kauli ya namna hii.
- source_word: אִישׁ
  choice: mtu
  rationale: Ingawa nomino ya Kiebrania ni ya kiume katika umoja, hapa inawakilisha mtu kwa ujumla. “Mtu” huhifadhi umoja na ni ya kawaida katika Kiswahili bila kuongeza jinsia isiyohitajika katika tafsiri.
- source_word: חוֹנֵן
  choice: mwenye fadhili
  rationale: Kitenzi hiki kina maana ya kumwonyesha mwingine neema au fadhili. “Mwenye fadhili” ni cha asili katika Kiswahili na hakifungi maana kwenye utoaji wa mali pekee.
- source_word: וּמַלְוֶה
  choice: na anayekopesha
  rationale: Hiphil ya לוה humaanisha kukopesha. Tafsiri hii inaonyesha tendo la kutoa mkopo bila kuongeza wazo la riba au masharti mengine yasiyotajwa.
- source_word: יְכַלְכֵּל
  choice: anaendesha
  rationale: Katika muktadha huu kitenzi kina maana ya kusimamia au kuendesha mambo. Wakati wa sasa wa mazoea unafaa kwa tabia ya mtu inayofafanuliwa katika mstari.
- source_word: דְּבָרָיו
  choice: mambo yake
  rationale: Nomino hii inaweza kumaanisha maneno au mambo. Pamoja na “anaendesha” na muktadha wa kukopesha, “mambo yake” ndiyo maana ya kawaida zaidi, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: בְּמִשְׁפָּט
  choice: kwa haki
  rationale: Neno lina nguvu ya kimaadili na kisheria ya hukumu au haki. “Kwa haki” ni fupi, wazi, na ya kawaida katika Kiswahili.
