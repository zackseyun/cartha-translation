  yaml_path: translation/ot/psalms/112/006.yaml
  text: For he will never be shaken[a]; the righteous will be remembered forever.
translation:
  language: sw
  text: Kwa maana hatatikisika kamwe; mwenye haki atakumbukwa milele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza msingi wa kauli iliyotangulia; “kwa maana” kinahifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: לְעוֹלָם לֹא יִמּוֹט
  choice: hatatikisika kamwe
  rationale: Muundo wenye kitenzi kilichokanushwa na לְעוֹלָם unasisitiza uthabiti wa kudumu. “Hatatikisika kamwe” ni wa asili katika Kiswahili na unahifadhi taswira ya kutoyumbishwa.
- source_word: לְזֵכֶר עוֹלָם יִהְיֶה
  choice: atakumbukwa milele
  rationale: Kirai hiki kina maana ya kubaki katika kumbukumbu ya kudumu; muundo wa kutendwa unawasilisha maana hiyo wazi na kwa ufupi.
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Nomino hii ya kivumishi iko katika umoja na humwakilisha mtu wa jamii ya wenye haki. “Mwenye haki” huhifadhi umoja bila kuongeza neno lisilokuwapo kama “mwanamume,” na katika Kiswahili linaweza kumrejelea mtu wa jinsia yoyote.
theological_decisions:
- issue: Umoja wa kiume unaowakilisha watu kwa jumla katika צַדִּיק
  choice: mwenye haki
  alternative: mtu mwenye haki; mwanamume mwenye haki; wenye haki
  rationale: Kiebrania kinatumia umoja wa kiume kwa mtu wa mfano katika fasihi ya hekima. Kiswahili “mwenye haki” huhifadhi umoja na maana wakilishi bila kuufanya usemi kuwa wa wingi wala kuongeza dai kwamba anayelengwa lazima awe mwanamume.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa vipashio viwili na nusu-koloni unadumisha ulinganifu wa mstari wa Kiebrania.
