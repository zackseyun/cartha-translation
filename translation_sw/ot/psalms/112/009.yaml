source:
  edition: WLC
  text: פִּזַּ֤ר נָ֘תַ֤ן לָ/אֶבְיוֹנִ֗ים צִ֭דְקָת/וֹ עֹמֶ֣דֶת לָ/עַ֑ד קַ֝רְנ֗/וֹ תָּר֥וּם בְּ/כָבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/009.yaml
  text: He has distributed freely[a]; he has given to the poor. His righteousness stands forever[c][b]; his horn will be lifted up in honor.
translation:
  language: sw
  text: Amegawa kwa ukarimu; amewapa maskini. Uadilifu wake[a] unadumu milele. Pembe yake[b] itainuliwa kwa heshima.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Haki yake inadumu milele.” Neno la Kiebrania linaweza kumaanisha uadilifu au haki.'
    reason: lexical_alternative
  - marker: b
    text: “Pembe” ni sitiari ya Kiebrania inayoweza kuwakilisha nguvu, heshima, au hadhi ya juu.
    reason: cultural_note
  - marker: c
    text: 'Au: “itatukuzwa kwa heshima,” au “itainuliwa katika utukufu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּזַּר
  choice: amegawa kwa ukarimu
  rationale: Kitenzi hiki kimsingi huonyesha kutawanya au kusambaza. Katika muktadha wa kuwapa wahitaji, “amegawa kwa ukarimu” ni Kiswahili cha kawaida kinachowasilisha utoaji mpana bila kuifanya picha ya kutawanya isikike kana kwamba ni ovyo.
- source_word: נָתַן
  choice: amewapa
  rationale: Ni tafsiri ya moja kwa moja ya tendo la kutoa; pia inadumisha usambamba wa kishairi na kishazi kilichotangulia.
- source_word: לָאֶבְיוֹנִים
  choice: maskini
  rationale: Neno אֶבְיוֹן humaanisha maskini au mhitaji. “Maskini” ni fupi, ya kawaida, na inafaa hapa, huku wazo la uhitaji likibaki wazi.
- source_word: צִדְקָתוֹ
  choice: haki yake
  rationale: “Haki” katika Kiswahili inaweza kuonyesha uadilifu na pia kutenda kwa haki, hivyo huhifadhi upana wa צְדָקָה bila kuifunga maana kwenye hisani pekee au dai la kustahili wokovu.
- source_word: עֹמֶדֶת לָעַד
  choice: inadumu milele
  rationale: Ingawa Kiebrania kina picha ya kitu ‘kusimama’ daima, “inadumu milele” ni Kiswahili cha asili kinachoeleza uthabiti wa kudumu.
- source_word: קַרְנוֹ
  choice: pembe yake
  rationale: Picha halisi ya Kiebrania imehifadhiwa badala ya kufasiriwa moja kwa moja kuwa nguvu au hadhi; tanbihi inaeleza sitiari hiyo.
- source_word: תָּרוּם
  choice: itainuliwa
  rationale: Huwasilisha maana ya kuwa juu au kutukuzwa, na inaendana vizuri na sitiari ya pembe.
- source_word: בְּכָבוֹד
  choice: kwa heshima
  rationale: כָּבוֹד inaweza kumaanisha heshima au utukufu. Katika zaburi hii ya hekima, “kwa heshima” huonyesha hadhi ya wazi kwa lugha ya kawaida na yenye staha.
theological_decisions:
- issue: Maana ya “haki yake” kuhusiana na kuwapa maskini
  choice: Maneno haya yanarejelea uadilifu na tendo la haki la mtu mkarimu ambalo hudumu, bila kuyapunguza yawe hisani tu wala kuyafanya dai kwamba mtu anastahili wokovu kwa matendo.
  alternative: Yanaweza kueleweka hasa kuwa matendo yake ya hisani, au kuwa utekelezaji wa haki ya agano.
  rationale: Muktadha unaunganisha ukarimu na haki, lakini neno la Kiebrania lina maana pana ya kimaadili na kitheolojia. “Haki yake” huhifadhi upana huo na mvutano wa kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wa sasa, na wenye staha. Sentensi fupi zinahifadhi usambamba wa mstari wa Kiebrania; sitiari ya “pembe” imeachwa katika matini na kufafanuliwa kwa tanbihi.
