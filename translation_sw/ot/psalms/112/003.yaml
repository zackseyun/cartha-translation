  text: Wealth and riches are in his house[a], and his righteousness stands forever.
translation:
  language: sw
  text: Mali na utajiri zimo nyumbani mwake, na uadilifu wake unadumu milele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “haki yake inadumu milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: mali
  rationale: Neno hili humaanisha mali au vitu vya thamani; “mali” ni la kawaida na linabaki tofauti na עֹשֶׁר.
- source_word: וָעֹשֶׁר
  choice: na utajiri
  rationale: “Utajiri” huonyesha wingi wa mali na kuhifadhi jozi ya kishairi pamoja na הוֹן.
- source_word: בְּבֵיתוֹ
  choice: vimo nyumbani mwake
  rationale: בַּיִת inaweza kumaanisha nyumba au kaya; “nyumbani mwake” ni usemi wa asili unaohifadhi mazingira ya nyumbani na kuruhusu maana pana ya kaya.
- source_word: וְצִדְקָתוֹ
  choice: na haki yake
  rationale: צְדָקָה linaweza kumaanisha uadilifu au haki. “Haki yake” huhifadhi upana huo wa kimaana bila kuingiza fundisho la baadaye lisilotajwa wazi.
- source_word: עֹמֶדֶת
  choice: inadumu
  rationale: Ingawa kitenzi kwa msingi ni “kusimama,” hapa kinaeleza uthabiti na uendelevu; “inadumu” ni Kiswahili cha kawaida na wazi katika muktadha huu.
- source_word: לָעַד
  choice: milele
  rationale: “Milele” huwasilisha kuendelea kusikokoma kwa njia ya kawaida na yenye hadhi.
theological_decisions:
- issue: Maana ya “haki yake” katika muktadha wa baraka za mali
  choice: Kudumisha usemi mpana “haki yake,” unaoweza kueleza mwenendo wa haki na uadilifu wa mtu huyo.
  alternative: Kuufasiri moja kwa moja kuwa ukarimu wake, kuthibitishwa kwake na Mungu, au haki inayohesabiwa kwake.
  rationale: Mhusika wa Zaburi 112 ni mtu anayemcha Mungu. Kiebrania kinatumia kiambishi cha umilikaji bila kufafanua mfumo wa kiteolojia; kwa hiyo tafsiri haiingizi maana maalumu isiyo wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mali na utajiri” huhifadhi urudiaji wa kishairi; “vimo” hupatana na nomino hizo mbili za ngeli tofauti katika matumizi ya kawaida. Alama ya tanbihi imewekwa baada ya sentensi inayohusika.
