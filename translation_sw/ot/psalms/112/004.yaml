  text: זָ֘רַ֤ח בַּ/חֹ֣שֶׁךְ א֭וֹר לַ/יְשָׁרִ֑ים חַנּ֖וּן וְ/רַח֣וּם וְ/צַדִּֽיק׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/004.yaml
  text: Light dawns in the darkness for the upright[a]; he is gracious and compassionate and righteous.
translation:
  language: sw
  text: Nuru huwapambazukia gizani watu wanyofu[a]; yeye ni mwenye neema, mwenye huruma, na mwadilifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nuru huwapambazukia gizani watu wanyofu, yenye neema, yenye huruma, na yenye uadilifu,” huku vivumishi vya mwisho vikieleweka pia kuwa mwangwi wa tabia ya BWANA katika Zaburi 111:4.
    reason: alternative_reading
lexical_decisions:
- source_word: זָרַח
  choice: huwapambazukia
  rationale: Kitenzi hiki huonyesha nuru kuchomoza au kupambazuka. Kauli ya mazoea katika Kiswahili inaleta vizuri ukweli wa kishairi unaoendelea kutumika, huku kiambishi -wa- kikionyesha kuwa nuru inawajia watu wanyofu.
- source_word: בַּחֹשֶׁךְ
  choice: gizani
  rationale: “Gizani” ni Kiswahili cha kawaida na cha kishairi kinachoweza kubeba maana halisi na ya mfano.
- source_word: אוֹר
  choice: Nuru
  rationale: אוֹר ndiyo kiima cha kishazi. “Nuru” ni ya asili katika Kiswahili na haihitaji kibainishi kisichokuwapo katika Kiebrania.
- source_word: לַיְשָׁרִים
  choice: watu wanyofu
  rationale: יְשָׁרִים humaanisha watu wa uadilifu wa kimaadili. “Watu wanyofu” ni wazi kwa msomaji wa kawaida na hutofautisha neno hili na צַדִּיק mwishoni mwa mstari.
- source_word: חַנּוּן
  choice: mwenye neema
  rationale: “Mwenye neema” huonyesha tabia ya kutoa fadhili au kibali, na hutofautishwa na huruma katika kivumishi kinachofuata.
- source_word: רַחוּם
  choice: mwenye huruma
  rationale: Chaguo hili huwasilisha hisia na tendo la huruma kwa Kiswahili cha kawaida na chenye heshima.
- source_word: צַדִּיק
  choice: mwadilifu
  rationale: “Mwadilifu” huonyesha hali ya kuwa mwenye haki kimaadili na hudumisha tofauti ya maneno na “wanyofu” iliyotumika kwa יְשָׁרִים.
theological_decisions:
- issue: Mhusika anayeainishwa na vivumishi חַנּוּן וְרַחוּם וְצַדִּיק
  choice: Maneno hayo yamewasilishwa kama maelezo ya mtu mwadilifu wa Zaburi 112 kwa kuongeza kiwakilishi “yeye.”
  alternative: Vivumishi vinaweza kuieleza “nuru,” au vinaweza kumrejelea BWANA kwa mwangwi wa Zaburi 111:4.
  rationale: Vivumishi ni vya umoja ilhali “watu wanyofu” ni wingi. Mazingira ya Zaburi 112 humweleza mtu mmoja mwenye kumcha BWANA, hivyo “yeye” ni usomaji unaowezekana sana; hata hivyo, mwangwi wa sifa za BWANA katika Zaburi 111:4 ni wa kweli na umehifadhiwa katika tanbihi badala ya kuondoa utata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha kishairi na chenye heshima. “Huwapambazukia” ni msemo wa asili unaounganisha nuru na wale wanaoipokea; tanbihi inadumisha utata wa kisarufi na mwangwi wa kitheolojia.
