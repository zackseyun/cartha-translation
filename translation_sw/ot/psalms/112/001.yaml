  text: הַ֥לְלוּ יָ֨הּ אַשְׁרֵי אִ֭ישׁ יָרֵ֣א אֶת יְהוָ֑ה בְּ֝/מִצְוֺתָ֗י/ו חָפֵ֥ץ מְאֹֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/001.yaml
  text: Praise Yah! Blessed is the man who fears Yahweh[b][a], who greatly delights in his commandments.
translation:
  language: sw
  text: 'Msifuni Yah[a]!

    Heri mtu[b] anayemcha Yahwe,

    anayependezwa sana na amri zake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa jadi, “Haleluya!”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kimetumia nomino ya umoja wa kiume, lakini hapa inawakilisha mtu yeyote katika kauli hii ya hekima.
    reason: cultural_note
lexical_decisions:
- source_word: הַלְלוּ יָהּ
  choice: Msifuni Yah!
  rationale: Imperative ya wingi הַלְלוּ imetafsiriwa “Msifuni,” na jina fupi la Mungu יָהּ limehifadhiwa kama “Yah” badala ya kubadilishwa kuwa cheo. Usemi wa jadi “Haleluya” umetolewa katika tanbihi.
- source_word: אַשְׁרֵי
  choice: Heri
  rationale: “Heri” ni usemi wa kawaida na wenye hadhi katika kauli za hekima za Kiswahili; unaonyesha hali ya kustawi inayotamaniwa bila kuifanya kuwa hisia ya furaha tu.
- source_word: אִישׁ
  choice: mtu
  rationale: Ingawa nomino ya Kiebrania ni ya umoja wa kiume, hapa inatumika kiwakilishi katika kauli ya hekima. “Mtu” ni ya asili katika Kiswahili na hudumisha matumizi hayo ya kijumla; umbo la kiume la chanzo limeelezwa katika tanbihi.
- source_word: יָרֵא אֶת־יְהוָה
  choice: anayemcha Yahwe
  rationale: “Kumcha” huhifadhi maana ya hofu yenye heshima na unyenyekevu mbele za Mungu bila kuipunguza kuwa heshima ya kawaida. Jina יהוה limetoholewa kuwa “Yahwe.”
- source_word: בְּמִצְוֺתָיו
  choice: na amri zake
  rationale: Muundo “kupendezwa na” ni njia ya asili ya Kiswahili ya kueleza kitu kinacholeta furaha; “amri zake” huhifadhi uzito wa מִצְוֺתָיו na kiwakilishi kinachomrejelea Yahwe.
- source_word: חָפֵץ מְאֹד
  choice: anayependezwa sana
  rationale: “Kupendezwa sana” huwasilisha furaha au shauku ya ndani ya חָפֵץ pamoja na nguvu ya kielezi מְאֹד.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi kama jina huku likifuata tahajia inayoeleweka kwa wasomaji wa Kiswahili.
- issue: Hofu yenye heshima katika יָרֵא
  choice: anamcha
  alternative: anamheshimu
  rationale: “Anamcha” huhifadhi mvutano wa maana kati ya hofu, kicho, na heshima; “anamheshimu” ingepunguza kipengele halisi cha hofu kilichomo katika neno la Kiebrania.
- issue: Nomino ya kiume ya kijumla אִישׁ
  choice: mtu
  alternative: mwanamume
  rationale: Katika muktadha huu wa hekima, mtu mmoja anawakilisha yeyote mwenye sifa hizo. Kiswahili “mtu” hutoa maana hiyo kwa kawaida, huku tanbihi ikihifadhi taarifa kwamba Kiebrania kimetumia umbo la kiume.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi, wa kishairi na wenye hadhi. Mpangilio wa mistari unaonyesha mwito wa sifa na kisha mistari miwili inayofafanua mtu aliye na heri.
