  text: רָ֘שָׁ֤ע יִרְאֶ֨ה וְ/כָעָ֗ס שִׁנָּ֣י/ו יַחֲרֹ֣ק וְ/נָמָ֑ס תַּאֲוַ֖ת רְשָׁעִ֣ים תֹּאבֵֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/010.yaml
  text: The wicked man will see and be angry[a]; he will gnash his teeth and melt away; the desire of the wicked will perish.
translation:
  language: sw
  text: Mtu mwovu ataona na kukasirika[a]; atasaga meno yake na kuyeyuka; tamaa ya waovu itaangamia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waovu wataona na kukasirika”—neno la Kiebrania liko katika umoja, lakini linamtumia mtu mwovu kuwakilisha waovu kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשָׁע
  choice: mtu mwovu
  rationale: Nomino-kivumishi ya kiume umoja inawakilisha kundi kwa ujumla; “mtu mwovu” huhifadhi umoja bila kudokeza kwamba ni mwanaume pekee.
- source_word: יִרְאֶה
  choice: ataona
  rationale: Qal imperfect ya nafsi ya tatu umoja; katika mfuatano huu wa kishairi ina maana ya wakati ujao au matokeo.
- source_word: וְכָעָס
  choice: na kukasirika
  rationale: Kitenzi כעס kinaeleza hasira au kufadhaika; muundo huu unaendeleza kitenzi cha kwanza kwa Kiswahili cha kawaida.
- source_word: שִׁנָּיו יַחֲרֹק
  choice: atasaga meno yake
  rationale: Huhifadhi taswira halisi ya kusaga meno kwa hasira na kuvunjika moyo.
- source_word: וְנָמָס
  choice: na kuyeyuka
  rationale: Huhifadhi sitiari ya kuharibika au kutoweka kama kitu kinachoyeyuka.
- source_word: תַּאֲוַת
  choice: tamaa
  rationale: Neno linaweza kumaanisha shauku, hamu, au tamaa; hapa “tamaa” hufaa kwa matarajio mabaya ya waovu.
- source_word: רְשָׁעִים
  choice: ya waovu
  rationale: Wingi wa nomino hiyo umehifadhiwa kwa “waovu.”
- source_word: תֹּאבֵד
  choice: itaangamia
  rationale: Kitenzi אבד huonyesha kuangamia, kupotea, au kushindwa kabisa; “itaangamia” hudumisha uzito wa kishairi.
theological_decisions:
- issue: Uwakilishi wa umoja wa kiume רָשָׁע
  choice: mtu mwovu
  alternative: mwovu
  rationale: Kiebrania kina umoja wa kiume unaotumiwa kiwakilishi. “Mtu mwovu” huhifadhi umoja huku Kiswahili “mtu” kikibaki cha kijumla; tanbihi inaonyesha uwezekano wa kuitafsiri kwa namna ya kijumla zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi na chenye hadhi lakini kinachoeleweka kwa urahisi. Mfuatano wa vitenzi vya wakati ujao umehifadhiwa, pamoja na taswira za kusaga meno na kuyeyuka.
