  text: His heart is steadfast[b][a]; he will not fear until he looks on his adversaries.
translation:
  language: sw
  text: Moyo wake ni thabiti; hataogopa mpaka atakapowaona wapinzani wake[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maadui wake.” Neno la Kiebrania linaweza kumaanisha maadui au wapinzani wenye uhasama kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: 'Kwa karibu zaidi na maneno ya Kiebrania: “mpaka atakapowaona wapinzani wake.” Katika muktadha huu, usemi huo unaweza kudokeza kushuhudia matokeo ya ushindi dhidi yao, lakini matokeo hayo hayajasemwa wazi.'
    reason: source_ambiguity
lexical_decisions:
- source_word: סָמוּךְ
  choice: thabiti
  rationale: Kivumishi hiki cha hali kutokana na סמך kinaeleza kitu kilichotegemezwa na hivyo kuwa imara au kisichoyumba. Kwa moyo, “thabiti” ni Kiswahili cha kawaida na chenye hadhi kinachoonyesha uthabiti wa ndani.
- source_word: לִבּוֹ
  choice: moyo wake
  rationale: לֵב hapa ni utu wa ndani, hasa fikra, azimio na ujasiri. “Moyo wake” huhifadhi taswira ya kishairi na upana huo wa maana.
- source_word: לֹא יִירָא
  choice: hataogopa
  rationale: Kauli ya kutotimia ya ירא inaweza kueleza hali ya kudumu au ya wakati ujao. “Hataogopa” inaonyesha ujasiri unaoendelea katika muktadha huu.
- source_word: עַד אֲשֶׁר
  choice: mpaka atakapo-
  rationale: Muungano huu huanzisha kikomo cha wakati au matokeo yanayotarajiwa. “Mpaka atakapo-” ni wa asili katika Kiswahili na huhifadhi muundo wa Kiebrania.
- source_word: יִרְאֶה בְצָרָיו
  choice: atakapowaona wapinzani wake wakishindwa
  rationale: ראה pamoja na בְ na kitu kinachotajwa, katika muktadha wa ushindi dhidi ya maadui, inaweza kumaanisha kushuhudia kwa kuridhika yaliyowapata. Kuongeza “wakishindwa” huzuia maana potovu kwamba ujasiri wake unaisha mara tu anapowaona, huku tanbihi ikihifadhi usemi wa karibu zaidi na maneno ya Kiebrania.
- source_word: צָרָיו
  choice: wapinzani wake
  rationale: צַר humaanisha adui, mpinzani au mtu mwenye uhasama. “Wapinzani” ni pana na haiongezi ukali usiolazimu; “maadui” imetolewa kama uwezekano katika tanbihi.
theological_decisions:
- issue: Je, kishazi cha mwisho kinaeleza kuwaona wapinzani tu au kushuhudia kushindwa kwao?
  choice: Maandishi makuu yanafafanua matokeo kwa “wakishindwa.”
  alternative: “mpaka atakapowaona wapinzani wake”
  rationale: Tafsiri ya neno kwa neno inaweza kusikika kana kwamba mtu huyo huanza kuogopa anapowaona wapinzani. Katika matumizi haya ya kishairi, kuona juu ya wapinzani kunadokeza kushuhudia matokeo yao kwa ushindi. Tanbihi inaonyesha wazi umbo la karibu zaidi na Kiebrania bila kulifanya kuwa dai la ziada lisiloonekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Moyo wake ni thabiti” huhifadhi usambamba na picha ya Kiebrania; ufafanuzi “wakishindwa” unazuia sintofahamu ya muda katika Kiswahili.
