  text: If Yahweh had not been my help[b][a], my soul would soon have dwelt in silence.
translation:
  language: sw
  text: Kama Yahwe asingekuwa msaada wangu, muda si muda nafsi yangu[a] ingekaa katika ukimya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uhai wangu”; Kiebrania ni “nafsi yangu,” neno linaloweza kumaanisha mtu mwenyewe au uhai wake.
    reason: lexical_alternative
  - marker: b
    text: Huenda “ukimya” hapa unamaanisha ukimya wa kifo au mahali pa wafu.
    reason: alternative_reading
lexical_decisions:
- source_word: לוּלֵי
  choice: Kama ... asingekuwa
  rationale: Huanzisha hali ya masharti isiyotimia katika wakati uliopita; muundo huu ni wa asili katika Kiswahili na huhifadhi maana ya ‘kama si.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi unaotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: עֶזְרָתָה לִּי
  choice: msaada wangu
  rationale: Nomino yenye maana ya msaada pamoja na kiwakilishi cha nafsi ya kwanza inaonyesha kwamba Yahwe ndiye msaada wa mtunga zaburi.
- source_word: כמעט
  choice: muda si muda
  rationale: Katika muktadha huu huonyesha kwamba matokeo yalikuwa karibu kutokea; usemi huu wa Kiswahili ni wa asili na unaendeleza dhana ya tukio lililokaribia.
- source_word: שכנה
  choice: ingekaa
  rationale: Kitenzi שׁכן kina maana ya kukaa au kuishi mahali; ‘ingekaa’ huhifadhi taswira ya kuwa katika makao ya ukimya.
- source_word: דומה
  choice: ukimya
  rationale: Nomino hii humaanisha ukimya na mara nyingi katika Zaburi hudokeza kifo au Kuzimu, lakini tafsiri kuu inaacha dokezo hilo bila kulifanya wazi kupita chanzo.
- source_word: נפשי
  choice: nafsi yangu
  rationale: נפשׁ inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. ‘Nafsi yangu’ huhifadhi usemi wa kishairi wa Kiebrania, huku ‘uhai wangu’ ikiwekwa katika tanbihi kama uwezekano.
theological_decisions:
- issue: Iwapo maana ya kifo au Kuzimu katika דומה iwekwe wazi
  choice: Kuhifadhi ‘ukimya’ katika matini kuu
  alternative: mahali pa ukimya; kifo; Kuzimu
  rationale: Huenda neno hilo linadokeza kifo, lakini maana yake ya moja kwa moja ni ‘ukimya.’ Kulihifadhi hivyo kunaacha mvutano na taswira ya matini bila kuingiza dai maalumu zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka kwa msomaji wa kawaida. Muundo wa masharti umewekwa kwa lugha ya sasa, huku ‘nafsi’ na taswira ya ‘kukaa katika ukimya’ zikihifadhi uzito wa kishairi wa chanzo.
