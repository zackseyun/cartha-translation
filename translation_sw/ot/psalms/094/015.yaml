  yaml_path: translation/ot/psalms/094/015.yaml
  text: For judgment will return to righteousness[b][a], and all the upright in heart will follow after it.
translation:
  language: sw
  text: Kwa maana hukumu itarudi kwenye uadilifu[a], na wote wenye moyo mnyofu wataifuata[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hukumu itarudi kwenye haki.” Neno la Kiebrania מִשְׁפָּט linaweza kumaanisha “hukumu” au “haki,” na צֶדֶק linaweza kumaanisha “uadilifu” au “haki.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “na baada yake wote wenye moyo mnyofu”; maana inayodokezwa ni kwamba wote wenye moyo mnyofu wataifuata au wataambatana nayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huonyesha msingi au uhakikisho wa maneno yaliyotangulia na inafaa mtiririko wa hoja ya zaburi.
- source_word: מִשְׁפָּט
  choice: hukumu
  rationale: Neno linaweza kumaanisha hukumu, haki, au uamuzi wa kisheria. “Hukumu” linadumisha tofauti yake na צֶדֶק katika mstari huu.
- source_word: יָשׁוּב עַד צֶדֶק
  choice: itarudi kwenye uadilifu
  rationale: שוב kwa kawaida humaanisha kurudi, na עַד hapa inaelekea kuonyesha mwelekeo au matokeo. “Kwenye uadilifu” linaonyesha kiwango cha unyofu wa kimaadili ambacho hukumu itakifikia tena.
- source_word: וְאַחֲרָיו
  choice: wataifuata
  rationale: Kihalisi ni “na baada yake.” Kiswahili hiki kinaweka wazi maana inayodokezwa ya kufuata au kujipanga nyuma ya hukumu iliyorejeshwa, huku kiambishi “-i-” kikirejelea “hukumu.”
- source_word: יִשְׁרֵי לֵב
  choice: walio wanyofu moyoni
  rationale: Hueleza watu wenye unyofu wa ndani wa kimaadili. Usemi huu ni wa asili na unaeleweka katika Kiswahili cha sasa.
theological_decisions:
- issue: Uhusiano kati ya hukumu na uadilifu
  choice: Hukumu, ambayo sasa imepotoshwa, itarudi kupatana na uadilifu.
  alternative: Hukumu itaendelea mpaka uadilifu ushinde; au haki ni ya watu waadilifu.
  rationale: Muundo wa יָשׁוּב pamoja na עַד צֶדֶק unaonyesha kwa kawaida kurudi au kurejeshwa, si muda. Hii inadumisha tumaini la zaburi la kurejeshwa kwa utaratibu wa maadili bila kuongeza dai la kimafundisho.
- issue: Kirejelewa cha kiambishi katika וְאַחֲרָיו
  choice: Kiambishi kinarejelea “hukumu,” hivyo wanyofu moyoni wataifuata.
  alternative: 'Kiambishi kinarejelea kwa upana zaidi uadilifu; au kishazi kibaki kisicho na kitenzi: “na baada yake wote walio wanyofu moyoni.”'
  rationale: מִשְׁפָּט ndilo nomino ya kiume lililo karibu zaidi, lakini tanbihi inadumisha hali ya kishazi cha Kiebrania na kutambua kwamba maana yake inaweza kuwa kufuata au kujipanga pamoja nayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Lugha ya kishairi imedumishwa bila kuwa ya kizamani; “uadilifu” na “hukumu” zimetumiwa kutofautisha nomino mbili za Kiebrania.
