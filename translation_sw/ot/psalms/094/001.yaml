  yaml_path: translation/ot/psalms/094/001.yaml
  text: O God of vengeance[a], O Yahweh, God of vengeance[b], shine forth!
translation:
  language: sw
  text: 'Ee Mungu wa malipizi,[a]

    Ee Yahwe, Mungu wa malipizi,

    ng''aa![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa uhalisi zaidi, “Mungu wa malipizi.” Wingi wa Kiebrania huenda ni wa kusisitiza, ukirejelea malipizi au matendo ya Mungu ya kutoa adhabu inayostahili.
    reason: lexical_alternative
  - marker: b
    text: Au “jidhihirishe,” “jionyeshe,” au “tokea.” Kitenzi hiki kinaweza kueleza udhihirisho wa Mungu unaoonekana; “ng'aa” huleta mbele pia kidokezo cha mng'ao wa epifania hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Mungu
  rationale: Katika mwito huu, אֵל ni jina la cheo la Mungu, si rejeo la jumla kwa mungu fulani. “Mungu” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: נְקָמוֹת
  choice: mwenye kulipiza kisasi
  rationale: Neno hili la wingi linaeleza matendo ya kulipiza kisasi au adhabu inayostahili. Kiswahili cha kawaida hutumia “kulipiza kisasi”; muundo “mwenye” unamtambulisha Mungu kuwa ndiye anayetekeleza malipizi hayo bila kupunguza ukali wa Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limehifadhiwa kwa umbo la Kiswahili “Yahwe” badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: הוֹפִיעַ
  choice: jitokeze kwa mng’ao
  rationale: Amri hii inaweza kumaanisha kujionyesha au kutokea kwa mng’ao. “Jitokeze kwa mng’ao” huhifadhi wazo la Mungu kujidhihirisha kwa uangavu bila kuongeza kitu kisichotajwa katika matini.
theological_decisions:
- issue: Lugha kuhusu Mungu kulipiza kisasi
  choice: Kuhifadhi wazi usemi “Mungu mwenye kulipiza kisasi”
  alternative: Mungu wa haki
  rationale: Kiebrania kinataja kisasi au malipizi moja kwa moja. Kutafsiri “Mungu wa haki” kungepunguza mvutano wa kitheolojia na kubadili taswira ya chanzo, ingawa kisasi kinachozungumziwa ni hukumu ya Mungu.
- issue: Maana ya הוֹפִיעַ
  choice: jitokeze kwa mng’ao
  alternative: jionyeshe
  rationale: Chaguo hili linahifadhi pamoja maana ya kujidhihirisha na kidokezo cha uangavu. “Jionyeshe” pekee ni sahihi, lakini hakibebi wazi kidokezo hicho cha mng’ao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Urudiaji wa mstari wa Kiebrania umehifadhiwa, na “Yahwe” limetumiwa kama jina binafsi.
