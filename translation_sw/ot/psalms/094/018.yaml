  text: אִם אָ֭מַרְתִּי מָ֣טָה רַגְלִ֑/י חַסְדְּ/ךָ֥ יְ֝הוָ֗ה יִסְעָדֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/018.yaml
  text: When I said, “My foot is slipping,” your steadfast love, O LORD, upheld me.
translation:
  language: sw
  text: Niliposema, “Mguu wangu unateleza,” upendo wako thabiti, Ee BWANA, ulinitegemeza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם אָמַרְתִּי
  choice: Niliposema
  rationale: Ingawa אִם kwa kawaida humaanisha ‘ikiwa’, katika muktadha huu inaweza kuanzisha hali iliyotokea; ‘niliposema’ ni Kiswahili cha kawaida na huhifadhi maana ya usemi wa wakati wa hatari.
- source_word: מָטָה רַגְלִי
  choice: Mguu wangu unateleza
  rationale: Kitenzi מוֹט kinaonyesha kuyumba au kuteleza kuelekea kuanguka; wakati wa sasa katika usemi wa moja kwa moja huwasilisha hatari inayokaribia.
- source_word: חַסְדְּךָ
  choice: upendo wako thabiti
  rationale: חֶסֶד hujumuisha upendo wa kudumu, uaminifu, na kujitoa kwa agano; ‘upendo thabiti’ hubeba vipengele hivyo bila kuufupisha kuwa hisia pekee.
- source_word: יְהוָה
  choice: BWANA
  rationale: Hutumia desturi iliyoenea ya tafsiri za Biblia za Kiswahili kwa jina la Mungu YHWH, kwa herufi kubwa kulitofautisha na cheo cha kawaida.
- source_word: יִסְעָדֵנִי
  choice: ulinitegemeza
  rationale: סעד humaanisha kutegemeza au kushikilia ili mtu asianguke; ‘ulinitegemeza’ linaendana moja kwa moja na taswira ya mguu unaoteleza.
theological_decisions:
- issue: Uhusiano kati ya hali ya hatari na tendo la upendo wa Mungu
  choice: Niliposema … ulinitegemeza
  alternative: Kama ningesema … ungenitegemeza
  rationale: Muktadha na mpangilio wa kishairi vinaunga mkono ushuhuda wa tukio halisi kuliko hali ya kudhaniwa; hata hivyo, maana ya msingi ya אִם inaacha kiasi fulani cha uwezekano wa tafsiri ya masharti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. ‘Ee BWANA’ huhifadhi mwito wa moja kwa moja wa Kiebrania.
