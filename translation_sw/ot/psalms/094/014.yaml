  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au msingi wa kauli iliyo katika muktadha; “Kwa maana” kinahifadhi kazi hiyo ya ufafanuzi kwa Kiswahili cha kawaida.
- source_word: יִטֹּשׁ
  choice: hatawaacha
  rationale: Kitenzi נטשׁ kinaweza kumaanisha kuacha, kutupa mbali, au kukataa. “Hatawaacha” ni cha asili na chenye uzito unaofaa katika muktadha wa uhusiano wa agano.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kwa unukuzi wa kawaida wa Kiswahili “Yahwe,” badala ya kulibadili kuwa cheo.
- source_word: עַמּוֹ
  choice: watu wake
  rationale: עַם hapa ni watu walio katika uhusiano na Yahwe; “watu wake” kinahifadhi maana ya kijamii na ya agano.
- source_word: נַחֲלָתוֹ
  choice: urithi wake
  rationale: נַחֲלָה humaanisha urithi, milki iliyogawiwa, au mali ya kudumu. “Urithi wake” kinahifadhi taswira ya watu wa Mungu kuwa sehemu yake aliyojitwalia.
- source_word: יַעֲזֹב
  choice: hataliacha
  rationale: Kitenzi עזב humaanisha kuacha au kutelekeza. “Hataliacha” kinatunza usambamba wa kishairi na kitenzi cha mstari wa kwanza bila kuongeza maana isiyokuwapo.
theological_decisions:
- issue: Utoaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. Kulitaja kama “Yahwe” kunalihifadhi badala ya kulibadili kuwa cheo.
- issue: Taswira ya agano katika נַחֲלָתוֹ
  choice: urithi wake
  alternative: milki yake
  rationale: “Urithi wake” kinadumisha taswira pana ya Kiebrania ya watu wa Yahwe kama sehemu yake aliyojitwalia, bila kuifanya kuwa madai finyu zaidi ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usambamba wa mistari umehifadhiwa kwa “watu wake” na “urithi wake”; “wala” linaunganisha kauli hasi ya pili kwa mtiririko wa kishairi.
