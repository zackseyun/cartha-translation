  yaml_path: translation/ot/psalms/094/002.yaml
  text: Rise up[a], Judge of the earth[b]; repay the proud what they deserve.
translation:
  language: sw
  text: Inuka[a], ee Mwamuzi wa dunia; uwalipe wenye kiburi malipo yanayowastahili[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Jiinue” au “uinuliwe.” Kitenzi cha Kiebrania kinaweza kutafsiriwa kwa karibu zaidi kama mwito kwa Mungu ajiinue au ainuliwe; katika muktadha huu ni mwito kwake ainuke ili atende.
    reason: lexical_alternative
  - marker: b
    text: Au, kwa karibu zaidi na Kiebrania, “warudishie wenye kiburi malipo yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּשֵׂא
  choice: Inuka
  rationale: Amri hii inamwita Mungu ainuke na kuchukua hatua. “Inuka” ni Kiswahili cha kawaida na chenye nguvu; maana halisi zaidi ya kujiinua imehifadhiwa katika tanbihi.
- source_word: שֹׁפֵט
  choice: Mwamuzi
  rationale: Neno hili ni kauli ya tendo iliyotumiwa kama cheo cha Mungu. “Mwamuzi” huhifadhi picha ya kimahakama kwa lugha ya sasa na iliyo wazi.
- source_word: הָאָרֶץ
  choice: wa dunia
  rationale: Katika wito huu wa kishairi kwa Mungu kama Mwamuzi wa wote, “dunia” huonyesha upeo mpana kuliko “nchi,” ambalo lingeweza kueleweka kama eneo fulani tu.
- source_word: הָשֵׁב
  choice: warudishie
  rationale: Hii ni amri ya kusababisha malipo yarudi juu ya walengwa. “Warudishie” huhifadhi kwa kiasi kikubwa picha ya Kiebrania ya kurudisha malipo, huku ikibaki ya kawaida katika Kiswahili.
- source_word: גְּמוּל
  choice: malipo wanayostahili
  rationale: Neno hili humaanisha malipo, ujira, au kisasi kinacholingana na matendo. Kirai hiki kinaeleza kwa kawaida kuwa ni malipo yanayowapasa kwa matendo yao.
- source_word: עַל
  choice: -shie wenye kiburi
  rationale: Kihusishi hiki kinaonyesha walengwa ambao malipo yanawarudia. Katika Kiswahili, kiambishi cha kutendea katika “warudishie” kinaonyesha uhusiano huo kwa ufasaha.
- source_word: גֵּאִים
  choice: wenye kiburi
  rationale: Neno linarejelea watu wenye majivuno au kiburi katika maana ya kimaadili. “Wenye kiburi” ni la kawaida, wazi, na halidokezi tu hadhi ya juu kijamii.
theological_decisions:
- issue: Asili ya ombi la hukumu ya Mungu
  choice: Ombi kwa Mungu, Mwamuzi wa dunia, ainuke atende haki kwa kuwarudishia wenye kiburi malipo yanayolingana na matendo yao.
  alternative: Ombi hasa la Mungu ajitukuze au aonyeshe ukuu wake, badala ya kuingilia kati kwa hukumu.
  rationale: Amri mbili pamoja na msamiati wa kimahakama—“Mwamuzi” na “malipo”—zinaonyesha kuwa tendo la Mungu la kuhukumu ndilo wazo kuu. Tafsiri haiongezi maelezo ya kimafundisho yasiyosemwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Neno “ee” linafaa kwa wito wa moja kwa moja bila kufanya sentensi kuwa ya kizamani kupita kiasi; “warudishie” huhifadhi picha ya chanzo huku “malipo wanayostahili” kikifanya maana ieleweke kwa urahisi.
