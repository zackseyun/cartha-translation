translation:
  language: sw
  text: ili kumpa pumziko kutoka siku za taabu[a], mpaka shimo lichimbwe kwa ajili ya mwovu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ‘kutoka siku za uovu.’ Kirai cha Kiebrania kwa maana halisi ni ‘kutoka siku za uovu,’ yaani siku zilizojaa taabu au maafa.
    reason: lexical_alternative
  - marker: b
    text: Au, ‘mpaka shimo la maangamizi lichimbwe kwa ajili ya mwovu.’ Neno hili linaweza kudokeza maangamizi au kaburi, pamoja na maana ya msingi ya ‘shimo.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַשְׁקִיט
  choice: kumpa pumziko
  rationale: Kitenzi hiki katika Hiphil kina maana ya kumsababishia mtu utulivu au pumziko. Kauli hii ni ya asili katika Kiswahili na inaendeleza kusudi linalotokana na mstari uliotangulia.
- source_word: לוֹ
  choice: kumpa
  rationale: Kiambishi hiki kinamtaja anayepokea au kufaidika na pumziko; maana hiyo imejumuishwa kwa kawaida katika muundo wa Kiswahili ‘kumpa pumziko.’
- source_word: מִימֵי רָע
  choice: kutoka siku za taabu
  rationale: Kirai hiki kwa neno kwa neno ni ‘kutoka siku za uovu/ubaya,’ lakini hapa kinaelekea kumaanisha nyakati zilizojaa shida au maafa. ‘Siku za taabu’ ni wazi na cha asili bila kufafanua kupita kiasi.
- source_word: עַד
  choice: mpaka
  rationale: Ni kiunganishi cha wakati kinachoonyesha mwisho wa kipindi cha pumziko.
- source_word: יִכָּרֶה
  choice: lichimbwe
  rationale: Niphal imperfect ya כרה inaeleweka vizuri kama kauli tendwa, ‘lichimbwe,’ ikipatana na nahau ya shimo kuchimbwa kwa ajili ya mtu.
- source_word: לָרָשָׁע
  choice: kwa ajili ya mwovu
  rationale: Kivumishi cha umoja kimetumiwa kama nomino kumwakilisha mtu mwovu. ‘Mwovu’ huhifadhi umoja huo na ni cha kawaida katika Kiswahili.
- source_word: שָׁחַת
  choice: shimo
  rationale: Nomino hii humaanisha shimo, mara nyingi ikiwa na vidokezo vya uharibifu au kaburi. ‘Shimo’ ndiyo tafsiri ya moja kwa moja zaidi, huku maana pana ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Aina ya pumziko analopewa mwenye kuteseka
  choice: pumziko kutoka siku za taabu mpaka hukumu imfikie mwovu
  alternative: utulivu wa ndani wakati wa taabu, au pumziko la mwisho tu
  rationale: Muundo wa sentensi unaunganisha kufundishwa au kuadhibiwa katika mstari uliotangulia na pumziko linalotolewa ‘kutoka siku za taabu,’ mpaka shimo la mwovu lichimbwe. Tafsiri haiondoi uwezekano wa maana pana zaidi ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni rahisi kusomeka na unaendeleza sentensi kutoka mstari uliotangulia. Alama za tanbihi zimepangwa mara tu baada ya maneno yanayohusika.
