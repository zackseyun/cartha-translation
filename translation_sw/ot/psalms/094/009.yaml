base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/009.yaml
  text: He who planted the ear[a], does he not hear? He who formed the eye[b], does he not see?
translation:
  language: sw
  text: Yeye aliyepanda sikio[a], je, hasikii? Yeye aliyeumba jicho, je, haoni?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliyepandikiza sikio.” Kitenzi cha Kiebrania humaanisha kihalisi “kupanda,” kikitumia taswira hai ya Muumba.
    reason: lexical_alternative
  - marker: b
    text: “Aliyeumba jicho” pia yaweza kutafsiriwa “aliyefinyanga jicho” au “aliyeunda jicho”; na “haoni?” kwa maana ya karibu zaidi ya neno la Kiebrania ni “hatazami?” au “haangalii?” Hapa linahusu uwezo wa kuona.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטַע
  choice: aliyepanda
  rationale: Kitenzi hiki humaanisha kihalisi ‘kupanda.’ Tafsiri hii inadumisha taswira hai ya Muumba badala ya kuifanya kuwa ‘aliyetengeneza’ tu.
- source_word: אֹזֶן
  choice: sikio
  rationale: Hili ndilo neno la kawaida la kiungo cha kusikia. Umoja umehifadhiwa kulingana na Kiebrania na ulinganifu wake na ‘jicho.’
- source_word: יִשְׁמָע
  choice: hasikii
  rationale: Katika muktadha huu kitenzi kinahusu uwezo wa kusikia, si hasa kutii au kusikiliza kwa makini.
- source_word: יֹצֵר
  choice: aliyeliumba
  rationale: Kitenzi kina wazo la kuunda au kufinyanga kwa kusudi. ‘Kuliumba’ ni Kiswahili cha kawaida na chenye hadhi kinachowasilisha tendo la Muumba.
- source_word: עַיִן
  choice: jicho
  rationale: Maana ya msingi ni kiungo cha kuona. Umoja unadumisha ulinganifu wa kishairi na ‘sikio.’
- source_word: יַבִּיט
  choice: haoni
  rationale: Ingawa kitenzi kinaweza kumaanisha kutazama au kuangalia, hapa kinarejelea uwezo wa kuona unaolingana na jicho lililoumbwa.
- source_word: הֲ...הֲלֹא
  choice: je, ha... ?
  rationale: Muundo huu ni swali la balagha linalotarajia jibu la kukubali. ‘Je, ha...?’ huhifadhi nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: אִם
  choice: Au yeye
  rationale: Hapa neno linaanzisha sehemu ya pili ya ulinganifu wa maswali ya balagha. ‘Au yeye’ hudumisha uhusiano huo bila kulifanya kuwa sharti lisilokusudiwa.
theological_decisions:
- issue: Lugha inayomhusisha Mungu na uwezo wa kibinadamu wa kusikia na kuona
  choice: Kuhifadhi hoja halisi kutoka kwa Muumba hadi kwa viumbe kwa kutumia sikio, kusikia, jicho na kuona.
  alternative: Kufafanua kuwa ‘aliyetoa uwezo wa kusikia na kuona bila shaka anatambua kila kitu.’
  rationale: Zaburi yenyewe inatumia viungo na uwezo wa kibinadamu kama hoja kuhusu utambuzi wa Muumba. Tafsiri haibadili taswira hiyo kuwa kauli ya kiteolojia iliyoelezwa kwa maneno ya dhahania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni mfupi, wa kishairi na wenye hadhi. Maswali ya balagha na ulinganifu wa ‘sikio/kusikia’ na ‘jicho/kuona’ vimehifadhiwa. ‘Kupanda sikio’ ni taswira isiyo ya kawaida kwa makusudi, kama ilivyo katika Kiebrania, na imefafanuliwa katika tanbihi.
