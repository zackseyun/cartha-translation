lexical_decisions:
- source_word: אַלְמָנָה
  choice: mjane
  rationale: Nomino ya umoja imetumiwa kwa maana ya jumla kuwakilisha kundi lililo hatarini; “mjane” huhifadhi umbo hilo na ni Kiswahili cha kawaida.
- source_word: גֵר
  choice: mgeni
  rationale: Neno hili humaanisha mtu asiye mzawa anayeishi miongoni mwa jamii, si msafiri anayepita tu. “Mgeni” ni neno la kawaida na linaloeleweka; tanbihi inafafanua maana ya ukaaji.
- source_word: יַהֲרֹגוּ
  choice: wanaua
  rationale: Kitenzi hiki ni neno la kawaida la kuua; “wanaua” ni tafsiri ya moja kwa moja na ya asili.
- source_word: יְתוֹמִים
  choice: yatima
  rationale: “Yatima” ni neno la kawaida la Kiswahili kwa watoto waliopoteza mzazi au wazazi. Tanbihi inahifadhi umahususi wa Kiebrania, yaani waliokosa baba.
- source_word: יְרַצֵּחוּ
  choice: wanawaua
  rationale: Kitenzi cha Kiebrania kina nguvu ya mauaji yasiyo halali. Kiswahili hakina kitenzi kimoja cha kawaida kinachotofautisha wazi “murder” na “kill”; muktadha wa uovu unaonyesha kuwa haya ni mauaji ya jinai bila kuongeza namna ya mauaji ambayo haikutajwa.
