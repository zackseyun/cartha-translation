  text: Wanaua mjane na mgeni[a]; wanawaua yatima[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mgeni mkazi.” Neno la Kiebrania גֵר humaanisha mtu asiye mzawa anayeishi miongoni mwa watu.
