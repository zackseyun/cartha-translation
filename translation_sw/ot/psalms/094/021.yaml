base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/021.yaml
  text: They band together against the life of the righteous[b][a], and they condemn innocent blood.
translation:
  language: sw
  text: Wanajikusanya pamoja dhidi ya maisha ya mwenye haki,[a] na damu isiyo na hatia wanaihukumu kuwa na hatia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wanajikusanya kama kundi dhidi ya uhai wa mtu mwenye haki.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “na damu isiyo na hatia wanaitangaza kuwa na hatia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגוֹדּוּ
  choice: wanajikusanya pamoja
  rationale: Kitenzi kinaweza kumaanisha kukusanyika kama kundi kwa kusudi la uhasama. Kauli hii ni ya kawaida kwa Kiswahili na inaonyesha hatua yao ya pamoja bila kuongeza taswira ya kijeshi isiyo ya lazima.
- source_word: עַל
  choice: dhidi ya
  rationale: Katika muktadha huu wa uhasama, kihusishi kinaonyesha upinzani au shambulio dhidi ya mtu.
- source_word: נֶפֶשׁ
  choice: maisha
  rationale: Hapa neno linahusu uhai wa mwenye haki unaotishiwa. “Maisha” pia hudumisha uhusiano wa maana na “damu” katika kishororo kinachofuata bila kulifanya neno liwe la kiroho tu.
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Kivumishi cha umoja kimetumiwa kama nomino. “Mwenye haki” ni usemi wa asili unaodumisha umoja wa Kiebrania na unaweza kumwakilisha mtu yeyote mwenye haki bila kubainisha jinsia isiyotajwa wazi.
- source_word: דָם
  choice: damu
  rationale: Tafsiri halisi inadumisha taswira kali ya vurugu na hukumu; usemi “damu isiyo na hatia” unaeleweka katika Kiswahili cha kibiblia na cha kawaida.
- source_word: נָקִי
  choice: isiyo na hatia
  rationale: Neno lina maana ya kutokuwa na kosa au hatia. Huu ni usemi wazi na wa asili unapohusishwa na damu.
- source_word: יַרְשִׁיעוּ
  choice: wanaihukumu kuwa na hatia
  rationale: Hifili ya kitenzi hiki mara nyingi humaanisha kutangaza kuwa na hatia au kuhukumu. Kauli hii inadumisha maana ya kimahakama na mkazo wa Kiebrania kwamba damu isiyo na hatia ndiyo wanayoitendea kana kwamba ina hatia.
theological_decisions:
- issue: Umoja wenye maana ya uwakilishi katika צַדִּיק
  choice: mwenye haki
  alternative: mtu mwenye haki; wenye haki
  rationale: Kiebrania kina umoja ambao unaweza kumwakilisha kundi. “Mwenye haki” hudumisha umoja huo bila kuingiza rejeo maalumu la mwanamume wala kuubadili wazi kuwa wingi.
- issue: Maana ya kimahakama ya יַרְשִׁיעוּ inapohusishwa na damu isiyo na hatia
  choice: damu isiyo na hatia wanaihukumu kuwa na hatia
  alternative: wanamlaani asiye na hatia; wanamwaga damu isiyo na hatia
  rationale: Matini haisemi moja kwa moja “kumwaga” damu, bali hutumia kitenzi cha kutangaza au kuhukumu kuwa na hatia. Tafsiri iliyochaguliwa inalinda mvutano kati ya kutokuwa na hatia kwa mwathiriwa na hukumu potovu inayotolewa dhidi yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa kishororo cha pili umehifadhiwa kwa kiasi ili kutia mkazo “damu isiyo na hatia,” huku viwakilishi vya ngeli vikifanya sentensi ibaki wazi.
