  text: הֲ/יֹסֵ֣ר גּ֭וֹיִם הֲ/לֹ֣א יוֹכִ֑יחַ הַֽ/מְלַמֵּ֖ד אָדָ֣ם דָּֽעַת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/010.yaml
  text: He who disciplines nations[a], will he not rebuke—he who teaches man knowledge?
translation:
  language: sw
  text: Yeye anayeyaadibisha mataifa, je, hatakemea—yeye anayemfundisha mwanadamu maarifa?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹסֵר
  choice: anayeyaadibisha
  rationale: Kitenzi hiki kinaonyesha nidhamu yenye lengo la kusahihisha, si adhabu tupu; ‘kuadibisha’ huhifadhi maana ya mamlaka na marekebisho.
- source_word: גּוֹיִם
  choice: mataifa
  rationale: Katika muktadha huu neno linarejelea mataifa kwa upana, si hasa watu wasio Wayahudi.
- source_word: יוֹכִיחַ
  choice: hatakemea
  rationale: Hifili ya יכח hapa ina maana ya kukaripia au kusahihisha; ‘kukemea’ inafaa katika swali la balagha na inalingana na kuadibisha.
- source_word: הַמְלַמֵּד
  choice: yeye anayemfundisha
  rationale: Kirai hiki cha kisifa kinamtaja Mungu kwa tendo lake na kuhifadhi ulinganifu wa kishairi wa Kiebrania.
- source_word: אָדָם
  choice: mwanadamu
  rationale: Umoja wa uwakilishi unamaanisha binadamu kwa jumla. ‘Mwanadamu’ ni wa asili katika Kiswahili na huhifadhi umoja bila kuufanya usemi wa dhahania.
- source_word: דָּעַת
  choice: maarifa
  rationale: Neno hili hutaja ujuzi au ufahamu; ‘maarifa’ ni tafsiri ya moja kwa moja na ya kawaida kama kitu kinachofundishwa.
- source_word: הֲ...הֲלֹא
  choice: je, hata...
  rationale: Viambishi hivi vinaunda swali la balagha linalotarajia jibu la ndiyo; muundo ‘je, hata...?’ unawasilisha nguvu hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Matumizi ya jumla ya אָדָם
  choice: mwanadamu
  alternative: wanadamu / jamii ya binadamu
  rationale: Andiko linamweleza Mungu kuwa anayefundisha ubinadamu kwa jumla, lakini Kiebrania kinatumia umoja wa uwakilishi. ‘Mwanadamu’ huhifadhi umoja huo na maana jumuishi kwa Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo wa swali la balagha na ulinganifu wa vipashio viwili umehifadhiwa; kistari kirefu kinaonyesha mpito kwenda kwenye maelezo ya pili kuhusu Mungu.
