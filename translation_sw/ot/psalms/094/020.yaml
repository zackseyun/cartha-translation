base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/020.yaml
  text: Can a throne of destruction be allied with you[b][a], one that forms trouble by statute?
translation:
  language: sw
  text: Je, kiti cha enzi cha maangamizi[a] kinaweza kushirikiana nawe—kile kinachotunga madhara kwa njia ya sheria?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiti cha enzi cha hila ziletazo madhara” au “kiti cha enzi cha uharibifu.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kinachounda taabu juu ya sheria”; yaani, kinatumia sheria au amri kuwa njia au kisingizio cha kusababisha madhara.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיְחָבְרְךָ
  choice: kinaweza kushirikiana nawe
  rationale: Kitenzi חבר katika muktadha wa swali la balagha kinaonyesha kujiunga au kuwa na ushirika. ‘Kushirikiana nawe’ ni Kiswahili cha kawaida kinachohifadhi wazo la mamlaka hiyo kuwa katika muungano na Mungu.
- source_word: כִּסֵּא
  choice: kiti cha enzi
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa ‘throne’ na hapa linawakilisha kimajazi mamlaka au utawala.
- source_word: הַוּוֹת
  choice: maangamizi
  rationale: Wingi huu unaweza kumaanisha maafa, uharibifu, au hila ziletazo madhara. ‘Maangamizi’ huhifadhi nguvu ya uharibifu ya neno bila kulibadili kuwa neno la jumla tu la uovu.
- source_word: יֹצֵר
  choice: kinachotunga
  rationale: Kitenzi יצר kimsingi ni kuumba au kuunda. Kwa kuwa kitu kinachoundwa hapa ni madhara kwa kutumia sheria, ‘kutunga’ hudumisha picha ya kuunda na pia huendana kwa kawaida na mazingira ya kisheria.
- source_word: עָמָל
  choice: madhara
  rationale: Katika muktadha huu עמל ni taabu, dhiki, au madhara yanayosababishwa na utawala dhalimu. ‘Madhara’ huonyesha matokeo kwa waathiriwa kwa Kiswahili cha kawaida.
- source_word: עֲלֵי חֹק
  choice: kwa njia ya sheria
  rationale: Kiebrania chake kihalisi ni ‘juu ya sheria/amri.’ ‘Kwa njia ya sheria’ huhifadhi sheria kama chombo cha kutokeza madhara, huku uwezekano wa sheria kutumiwa kama kisingizio ukielezwa katika tanbihi.
theological_decisions:
- issue: Uhusiano wa Mungu na utawala dhalimu katika swali la balagha
  choice: Swali linadokeza kwamba mamlaka yenye kuleta maangamizi kwa kutumia sheria haiwezi kushirikiana na Mungu.
  alternative: Swali linaweza kueleweka kwa upana zaidi kuwa linamhusu mwamuzi yeyote dhalimu anayejidai kuwa karibu na Mungu katika hukumu.
  rationale: Muundo wa swali na picha ya ‘kiti cha enzi’ huonyesha kutopatana kwa Mungu na mamlaka potovu. Tafsiri inadumisha maana hiyo kwa swali la balagha bila kuigeuza kuwa kauli ya ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali la balagha umehifadhiwa; ‘kiti cha enzi’ hudumisha taswira ya kisiasa na kimahakama, na tanbihi zinaweka wazi mapana ya maana bila kufunga utata wa Kiebrania.
