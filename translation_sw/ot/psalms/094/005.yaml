  text: Ee Yahweh, wanawaponda[a] watu wako, na wanatesa urithi wako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanawakandamiza.” Kitenzi cha Kiebrania kinaweza kumaanisha ukandamizaji wa kuponda.
