lexical_decisions:
- source_word: עַמְּךָ
  choice: watu wako
  rationale: עַם hapa inamaanisha jamii ya watu walio wa Mungu; “watu wako” ni Kiswahili cha kawaida na kinafaa muktadha.
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe,” huku “Ee” ikionyesha kwamba mtunga zaburi anamwita moja kwa moja.
- source_word: יְדַכְּאוּ
  choice: wanawaponda
  rationale: Kauli ya Piel ya דכא ina wazo lenye nguvu la kuponda au kukandamiza; “wanawaponda” huhifadhi picha hiyo badala ya kuifanya kuwa ya jumla tu.
- source_word: וְנַחֲלָתְךָ
  choice: na urithi wako
  rationale: נַחֲלָה humaanisha urithi au milki iliyogawiwa; hapa ni jina sambamba la watu walio mali ya Mungu.
- source_word: יְעַנּוּ
  choice: na kuutesa
  rationale: Piel ya ענה inaweza kumaanisha kutesa, kudhulumu, au kunyanyasa. “Kuutesa” huonyesha ukali wa tendo huku ikitofautiana na kitenzi kilichotangulia.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandiko ya Kiebrania yanatumia jina binafsi יהוה moja kwa moja; kulitohowa kama “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya נַחֲלָה kwa habari ya watu wa Mungu
  choice: urithi wako
  alternative: milki yako
  rationale: “Urithi wako” huhifadhi sitiari ya Kiebrania kwamba watu ni fungu au milki ya Mungu, bila kufafanua zaidi ya maandishi.
