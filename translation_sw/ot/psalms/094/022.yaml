  text: Lakini Yahwe amekuwa ngome yangu[a], na Mungu wangu ni mwamba wa kimbilio langu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe akawa ngome yangu.” Kitenzi cha Kiebrania kinaweza kutafsiriwa kwa wakati uliopita sahili; “amekuwa” huonyesha kwamba matokeo yanaendelea hadi sasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: amekuwa
  rationale: Kitenzi hiki kinaonyesha tukio lililotimia ambalo matokeo yake yanaendelea kuwapo; “amekuwa” linaonyesha uzoefu wa zamani na uhakika wa sasa wa mtunga zaburi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa kulinakili kama “Yahwe,” badala ya kulibadilisha kuwa cheo.
- source_word: לִי לְמִשְׂגָּב
  choice: ngome yangu
  rationale: מִשְׂגָּב ni mahali pa juu, salama na pasipofikika kwa urahisi; “ngome yangu” ni usemi wa kawaida unaodumisha wazo la ulinzi thabiti na uhusiano binafsi.
- source_word: וֵאלֹהַי
  choice: na Mungu wangu
  rationale: Muundo huu unaunganisha kauli ya pili sambamba na ya kwanza na kudumisha ungamo binafsi la mtunga zaburi.
- source_word: לְצוּר מַחְסִי
  choice: mwamba wa kimbilio langu
  rationale: “Mwamba” unadumisha sitiari ya uthabiti na ulinzi, huku “kimbilio langu” likiwakilisha mahali pa kukimbilia ili kupata usalama.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu YHWH
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina יהוה; “Yahwe” linahifadhi jina hilo binafsi bila kulibadilisha kuwa cheo.
- issue: Nguvu ya wakati wa kitenzi וַיְהִי
  choice: amekuwa
  alternative: akawa
  rationale: “Amekuwa” linaonyesha tendo lililotimia pamoja na matokeo yake ya sasa, lakini tanbihi inadumisha uwezekano halali wa kulitafsiri kwa wakati uliopita sahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. Ulinganifu wa kishairi na sitiari za “ngome,” “mwamba,” na “kimbilio” zimehifadhiwa.
