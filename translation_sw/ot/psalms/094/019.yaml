translation:
  language: sw
  text: Mawazo yangu yanayonisumbua yanapokuwa mengi ndani yangu[a], faraja zako[b] huifurahisha nafsi yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wingi wa mawazo yangu yenye kufadhaisha ukiwa ndani yangu.” Neno la Kiebrania linaweza kudokeza mawazo yanayofadhaisha, yaliyogawanyika, au yaliyotawanyika.
    reason: lexical_alternative
  - marker: b
    text: Au “faraja zako huichangamsha nafsi yangu.” Neno la Kiebrania linatumia nomino ya wingi, ikimaanisha “faraja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב
  choice: yanapokuwa mengi
  rationale: Muundo בְּ pamoja na רֹב una maana ya ‘katika wingi wa’ au ‘kwa kuwa mengi.’ Kauli ya kimazingira ‘yanapokuwa mengi’ ni ya kawaida katika Kiswahili na inadumisha maana ya wingi.
- source_word: שַׂרְעַפַּי
  choice: mawazo yangu yanayonisumbua
  rationale: Nomino hii hudokeza mawazo yanayofadhaisha, kugawanyika, au kutawanyika. Tafsiri hii inaeleza kwa lugha ya kawaida msukosuko wa ndani bila kuyafanya kuwa mawazo ya kawaida tu.
- source_word: בְּקִרְבִּי
  choice: ndani yangu
  rationale: Kirai hiki huelekeza kwenye hali ya ndani ya mtu; ‘ndani yangu’ ni fasaha na ya moja kwa moja katika Kiswahili.
- source_word: תַּנְחוּמֶיךָ
  choice: faraja zako
  rationale: Umbo la Kiebrania ni la wingi. ‘Faraja zako’ hudumisha wingi huo na linaweza kumaanisha maneno au matendo mbalimbali ya kufariji.
- source_word: יְשַׁעַשְׁעוּ
  choice: huifurahisha
  rationale: Kitenzi kinaonyesha kufurahisha au kuchangamsha kwa namna yenye kutuliza. ‘Huifurahisha’ ni cha kishairi lakini kinaeleweka kwa urahisi.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: Katika muktadha huu נֶפֶשׁ humaanisha utu wa ndani au mtu mwenyewe. ‘Nafsi yangu’ inadumisha lugha ya kishairi na kina cha mstari.
