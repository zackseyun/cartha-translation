- from: Tambueni, enyi mlio kama wanyama miongoni mwa watu; enyi wapumbavu, mtapata akili lini?
  to: Fahamuni, enyi watu wasio na ufahamu miongoni mwa watu; nanyi wapumbavu, mtakuwa na ufahamu lini?
  rationale: The revision removes an added simile, uses a more precise imperative for intellectual and moral discernment, and maintains the Hebrew contrast between the unreasoning and the fools in natural contemporary Standard East African Swahili.
