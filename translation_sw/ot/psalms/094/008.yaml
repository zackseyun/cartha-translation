  text: בִּ֭ינוּ בֹּעֲרִ֣ים בָּ/עָ֑ם וּ֝/כְסִילִ֗ים מָתַ֥י תַּשְׂכִּֽילוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/008.yaml
  text: Understand, you brutish among the people; and you fools, when will you become wise?
translation:
  language: sw
  text: Fahamuni, enyi watu wasio na ufahamu miongoni mwa watu; nanyi wapumbavu, mtakuwa na ufahamu lini?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּינוּ
  choice: Tambueni
  rationale: Amri hii inataka wasikilizaji waelewe au watambue; “Tambueni” ni ya kawaida na yenye nguvu katika Kiswahili.
- source_word: בֹּעֲרִים
  choice: mlio kama wanyama
  rationale: Neno linaonyesha ukatili au upumbavu wa mtu asiye na ufahamu, kwa picha ya kuwa kama mnyama; tafsiri hii huhifadhi picha hiyo bila kutumia neno lisilo la kawaida.
- source_word: בָּעָם
  choice: miongoni mwa watu
  rationale: 'Huwakilisha moja kwa moja maana ya mahali au kundi: walio katikati ya watu.'
- source_word: כְסִילִים
  choice: wapumbavu
  rationale: Ni neno la kawaida la hekima ya Kiebrania kwa watu wasiokubali hekima, si tu wasio na elimu.
- source_word: תַּשְׂכִּילוּ
  choice: mtapata akili
  rationale: Katika swali hili kitenzi humaanisha kupata ufahamu au kuwa na busara; usemi huu ni wa asili na unaeleweka kwa urahisi.
theological_decisions:
- issue: Tofauti kati ya בֹּעֲרִים na כְסִילִים
  choice: Kutofautisha kwa “mlio kama wanyama” na “wapumbavu”
  alternative: Kutafsiri yote mawili kwa maneno yanayokaribiana kama “wasio na akili” na “wapumbavu”
  rationale: Huhifadhi taswira kali ya neno la kwanza na istilahi ya hekima katika neno la pili, bila kuyafanya yawe sawa kabisa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mwito na swali la kukemea umehifadhiwa.
