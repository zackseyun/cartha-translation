lexical_decisions:
- source_word: יַבִּיעוּ
  choice: wanabubujisha maneno
  rationale: Hifili ya נבע inaonyesha kutokeza kitu kwa wingi kama maji yanavyobubujika. Kwa kuwa mstari unahusu usemi, “maneno” yamewekwa wazi kama shamirisho linalodokezwa na kitenzi kinachofuata.
- source_word: יְדַבְּרוּ
  choice: wanasema
  rationale: Hili ni neno la kawaida na la moja kwa moja kwa tendo la kusema, nalo linahifadhi usambamba wa kishairi.
- source_word: עָתָק
  choice: kwa kiburi
  rationale: Neno hili linaweza kumaanisha kiburi, ufidhuli, au maneno ya majivuno. Kirai cha kielezi “kwa kiburi” ni cha asili katika Kiswahili na kinaeleza namna wanavyosema.
- source_word: יִתְאַמְּרוּ
  choice: hujisifu
  rationale: Umbo la kujirejelea linaonyesha kujikweza au kujigamba. “Hujisifu” ni fupi, la asili, na linadumisha wazo la kujitukuza kwa maneno.
- source_word: כָּל
  choice: wote
  rationale: “Wote” linaendeleza nguvu jumuishi ya Kiebrania na linapatana na kundi la watu linalofuata.
- source_word: פֹּעֲלֵי אָוֶן
  choice: watendao maovu
  rationale: Kirai hiki humaanisha kihalisi wale wanaotenda uovu au ubaya. “Watendao maovu” ni wazi, chenye uzito wa kimaadili, na cha asili zaidi kuliko tafsiri ya neno kwa neno “wafanyao uovu.”
