lexical_decisions:
- source_word: עַד מָתַי
  choice: mpaka lini
  rationale: Ni swali la muda linalotumika katika maombolezo; “mpaka lini” ni Kiswahili cha kawaida kinachohifadhi uzito na haraka ya malalamiko.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Nomino ya wingi inayowataja watu wenye uovu kama kundi; “waovu” ni fupi, wazi, na ya kawaida katika Kiswahili cha Biblia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina la Mungu lililoandikwa katika Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: יַעֲלֹזוּ
  choice: watashangilia kwa ushindi
  rationale: Kitenzi kinaeleza furaha kubwa yenye hali ya kujivuna au kushinda; kirai hiki kinaonyesha zaidi ya furaha ya kawaida katika muktadha wa waovu.
- source_word: repetition of עַד מָתַי רְשָׁעִים
  choice: mpaka lini waovu? Mpaka lini waovu
  rationale: Marudio yamehifadhiwa ili kuonyesha msisitizo wa kishairi na kilio cha dharura, huku sentensi mbili fupi zikisomeka kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Ee Yahwe
  alternative: Ee BWANA
  rationale: Matini ya Kiebrania inatumia jina binafsi la Mungu; “Yahwe” hulihifadhi bila kulibadilisha kuwa cheo.
- issue: Furaha ya waovu
  choice: watashangilia kwa ushindi
  alternative: watafurahi
  rationale: Chaguo hili halisemi kwamba ushindi wao ni wa haki au wa kudumu; linaonyesha shangwe yao kubwa, yenye hali ya kujiona wameshinda, inayolalamikiwa na mtunga zaburi.
translation_notes:
