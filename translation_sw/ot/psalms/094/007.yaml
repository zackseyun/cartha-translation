  text: And they say[a], “Yah does not see, and the God of Jacob does not understand.”
translation:
  language: sw
  text: Nao husema, “Yah[a] haoni; Mungu wa Yakobo hafahamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Yah,” umbo fupi la kishairi la jina la Mungu; linganisha na umbo kamili la jina la agano ambalo mara nyingi hutafsiriwa “BWANA.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Nao husema
  rationale: Ingawa umbo la Kiebrania linaweza kutafsiriwa kwa wakati uliopita, katika ushairi hapa linaonyesha maneno ambayo waovu huyasema kwa kawaida; ‘husema’ ni ya asili na hudumisha maana hiyo.
- source_word: לֹא יִרְאֶה
  choice: haoni
  rationale: Kitenzi ראה hapa kina maana ya kuona au kutambua kinachotendeka. ‘Haoni’ hudumisha taswira halisi na madai ya waovu kwamba Mungu haoni maovu yao.
- source_word: יָּהּ
  choice: Yah
  rationale: Hili ni umbo fupi la kishairi la jina la Mungu, tofauti na umbo kamili יהוה; limedumishwa ili kutofifisha tofauti hiyo ya maandishi ya chanzo.
- source_word: וְלֹא יָבִין
  choice: hafahamu
  rationale: בין humaanisha kuelewa, kutambua, au kufahamu. ‘Hafahamu’ ni Kiswahili cha kawaida kinachowasilisha madai kwamba Mungu hatambui maana ya matendo yao.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: Mungu wa Yakobo
  rationale: Hili ni jina la kimahusiano na la agano; ‘Mungu wa Yakobo’ ni tafsiri ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Namna ya kutafsiri umbo fupi la kishairi la jina la Mungu יָּהּ
  choice: Yah
  alternative: BWANA
  rationale: Chanzo kinatumia יָּהּ, si umbo kamili יהוה. Kutumia ‘Yah’ kunadumisha tofauti halisi ya umbo hilo la kishairi bila kulisawazisha kimya kimya na jina kamili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Wakati wa mazoea ‘husema’ umetumiwa kuonyesha kauli ya kawaida ya waovu katika muktadha wa kishairi. Alama ya tanbihi imewekwa baada ya ‘Yah,’ neno linaloelezwa.
