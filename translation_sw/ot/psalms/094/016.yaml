lexical_decisions:
- source_word: מִי
  choice: Ni nani
  rationale: Kiwakilishi cha kuuliza kinaanzisha maswali yote mawili sambamba; “Ni nani” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: יָקוּם
  choice: atakayesimama
  rationale: Kitenzi קום kina picha ya kuinuka au kusimama ili kuchukua hatua. “Atakayesimama” ni cha asili katika Kiswahili na kinafaa katika muktadha wa kumtetea msemaji.
- source_word: לִי
  choice: kwa ajili yangu
  rationale: Kiambishi ל hapa kinaonyesha manufaa au utetezi kwa niaba ya msemaji, si mwelekeo tu.
- source_word: עִם
  choice: dhidi ya
  rationale: Ingawa kwa kawaida עִם humaanisha “pamoja na,” hapa wahusika wanaotajwa ni wapinzani; “dhidi ya” huwasilisha uhusiano huo wa uadui kwa uwazi.
- source_word: מְרֵעִים
  choice: watenda maovu
  rationale: Umbo hili la kishiriki linawataja watu wanaofanya mabaya; “watenda maovu” ni fupi, wazi, na lenye hadhi.
- source_word: יִתְיַצֵּב
  choice: atakayechukua msimamo
  rationale: Hitpaeli ya יצב inadokeza kujisimamisha imara au kuchukua msimamo. Tafsiri hii huitofautisha kwa kiasi na קום huku ikihifadhi usambamba.
- source_word: פֹּעֲלֵי אָוֶן
  choice: watendao uovu
  rationale: Kirai hiki kinamaanisha watu wanaozoea kutenda uovu. “Watendao uovu” ni cha kawaida zaidi kwa wasomaji wa sasa kuliko tafsiri nzito ya neno kwa neno.
- source_word: אָוֶן
  choice: uovu
  rationale: Katika kirai hiki אָוֶן ina maana ya ubaya wa kimaadili au matendo maovu, ingawa kwa upana inaweza pia kumaanisha madhara au taabu.
