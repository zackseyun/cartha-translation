base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/012.yaml
  text: Blessed is the man whom you discipline[a], O Yah, and teach out of your law[e][d][c][b],
translation:
  language: sw
  text: Heri mwanamume[a] unayemtia nidhamu[b], Ee Yah[c], na kumfundisha kutoka katika sheria yako[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtu.” Kiebrania kinasema “mwanamume,” lakini hapa huenda neno hilo linamwakilisha mtu yeyote anayepokea nidhamu na mafundisho ya Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au “unayemrekebisha” au “unayemwadhibu.” Neno la Kiebrania linaonyesha nidhamu au adhabu yenye kusudi la kurekebisha.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kina “Yah,” umbo fupi la kishairi la jina la Mungu, tofauti na umbo kamili YHWH ambalo mara nyingi hutafsiriwa “BWANA.”
    reason: lexical_alternative
  - marker: d
    text: Au “kutoka katika mafundisho yako.” Neno la Kiebrania torah linaweza kumaanisha “sheria” au, kwa maana pana zaidi, “mafundisho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heri
  rationale: Neno “Heri” ni kauli ya kawaida ya baraka katika Kiswahili; linaweza kuonyesha hali ya kubarikiwa, kufanikiwa, au kuwa katika hali njema bila kuifanya maana kuwa hisia ya furaha pekee.
- source_word: הַגֶּבֶר
  choice: mwanamume
  rationale: Nomino ya Kiebrania ni ya kiume katika umoja. “Mwanamume” huhifadhi jinsia ya neno la chanzo, huku tanbihi ikieleza kuwa hapa anaweza kuwakilisha mtu yeyote anayepokea nidhamu na mafundisho ya Mungu.
- source_word: תְּיַסְּרֶנּוּ
  choice: unayemwadhibu
  rationale: Kitenzi יסר katika muundo huu kinaonyesha adhabu au nidhamu yenye kusudi la kurekebisha, si kufundisha kwa maneno tu. “Kumwadhibu” ni Kiswahili cha sasa kinachobeba uzito huo, huku tanbihi ikifafanua wazo la nidhamu ya kurekebisha.
- source_word: יָּהּ
  choice: Ee Yah
  rationale: Maandishi yana jina fupi la kishairi יָהּ, si umbo kamili la YHWH. “Ee” linaonyesha usemi wa kumwita moja kwa moja, na “Yah” linahifadhi tofauti ya umbo hili.
- source_word: וּמִתּוֹרָתְךָ
  choice: kutokana na sheria yako
  rationale: מן huonyesha chanzo ambacho mafundisho yanatolewa, na תּוֹרָה linaweza kumaanisha sheria au mafundisho. “Kutokana na sheria yako” ni wazi na linaendeleza matumizi yanayotambulika ya “sheria,” bila kuficha maana pana kwa kuwa imeelezwa katika tanbihi.
- source_word: תְלַמְּדֶנּוּ
  choice: na kumfundisha
  rationale: למד katika muundo wa Piel humaanisha kufundisha. Muundo wa “unayemwadhibu … na kumfundisha” unaunganisha vitendo viwili chini ya kiwakilishi kilekile cha uhusiano, kama ilivyo katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יָּהּ
  choice: Ee Yah
  alternative: Ee BWANA
  rationale: Kutumia “Yah” kunahifadhi umbo fupi la kishairi lililopo katika chanzo badala ya kulisawazisha kimya kimya na tetragramatoni kamili.
- issue: Jinsia na maana wakilishi ya הַגֶּבֶר
  choice: mwanamume
  alternative: mtu
  rationale: “Mwanamume” huhifadhi nomino ya kiume ya chanzo. Hata hivyo, maana yake katika kauli hii ya heri yaweza kuwa wakilishi; jambo hilo limewekwa wazi katika tanbihi bila kubadili maandishi yenyewe.
- issue: Maana ya תּוֹרָה
  choice: sheria
  alternative: mafundisho
  rationale: “Sheria” ni tafsiri iliyozoeleka na inayofaa katika muktadha wa Zaburi, lakini neno la Kiebrania linaweza kuwa pana zaidi na kumaanisha mafundisho; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Heri” huhifadhi mtindo wa kauli ya baraka; “Ee Yah” huhifadhi usemi wa moja kwa moja na umbo maalumu la jina la Mungu. Muundo wa sentensi umebaki karibu na ulinganifu wa Kiebrania bila kuwa mgumu katika Kiswahili.
