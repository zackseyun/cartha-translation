  text: He will bring back on them their iniquity[a], and in their evil he will wipe them out[c][b]; Yahweh our God will wipe them out.
translation:
  language: sw
  text: Atawarudishia uovu wao[a], na kwa uovu wao atawaangamiza[b]; Yahwe[c], Mungu wetu, atawaangamiza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Amewarudishia uovu wao.” Katika ushairi huu, kitenzi cha Kiebrania kinaweza kueleweka kuwa cha wakati uliopita au kuwa tamko lenye kuelekea wakati ujao; neno lililotafsiriwa “uovu” linaweza pia kumaanisha “ubaya” au “matendo maovu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “atawaangamiza kwa sababu ya uovu wao,” au “atawaangamiza kwa njia ya uovu wao.” Kiambishi cha Kiebrania kinaweza kuonyesha sababu, njia, au uhusiano.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: YHWH, jina binafsi la Mungu.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשֶׁב עֲלֵיהֶם אֶת אוֹנָם
  choice: Atawarudishia uovu wao
  rationale: Kauli hii inadumisha picha ya uovu wao kuwarudia kama hukumu, lakini inatumia Kiswahili cha kawaida. Neno אוֹן hapa lina maana ya kimaadili ya uovu au ubaya, si taabu tu.
- source_word: וּבְרָעָתָם
  choice: na kwa uovu wao
  rationale: Kiambishi ב kinaweza kuonyesha sababu, njia, au uhusiano. ‘Kwa uovu wao’ ni kifupi na huacha wazi ikiwa wataangamizwa kwa sababu ya uovu wao au kwa njia ya uovu huohuo.
- source_word: יַצְמִיתֵם
  choice: atawaangamiza
  rationale: Kitenzi צמת katika kausativi kinaonyesha kuharibu kabisa au kukomesha. ‘Atawaangamiza’ kina nguvu inayofaa na kinaweza kurudiwa kwa kawaida kama ilivyo katika Kiebrania.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahwe, Mungu wetu
  rationale: Jina la Mungu יהוה limetoholewa kwa umbo la Kiswahili ‘Yahwe,’ nalo אֱלֹהֵינוּ limetafsiriwa moja kwa moja kuwa ‘Mungu wetu.’ Koma huonyesha kwamba ‘Mungu wetu’ linafafanua jina Yahwe.
theological_decisions:
- issue: Wakati na hali ya וַיָּשֶׁב katika ushairi
  choice: 'Kauli ya wakati ujao: ‘Atawarudishia’'
  alternative: ‘Amewarudishia’ au ‘Aliwarudishia’
  rationale: Ingawa umbo hilo linaweza kusomwa kwa nguvu ya wakati uliopita, muktadha wa kishairi na vitenzi vinavyofuata vya imperfecti vinaunga mkono tamko la uhakika kuhusu hukumu itakayotekelezwa. Tanbihi inadumisha uwezekano mwingine.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi יהוה, si cheo אֲדֹנָי. ‘Yahwe’ hulihifadhi kama jina na linafuata tahajia ya kawaida ya Kiswahili bila kuingiza badala ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya ‘atawaangamiza’ yamehifadhiwa kwa kuwa ni msisitizo wa makusudi katika Kiebrania.
