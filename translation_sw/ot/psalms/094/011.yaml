lexical_decisions:
- source_word: יְהוָה (YHWH)
  choice: BWANA
  rationale: Hufuata desturi iliyoenea katika tafsiri za Biblia za Kiswahili ya kuwakilisha jina la agano kwa “BWANA,” huku herufi kubwa zikilitofautisha na cheo cha kawaida.
- source_word: מַחְשְׁבוֹת (maḥšəḇōṯ)
  choice: mawazo
  rationale: Neno hili humaanisha mawazo, fikira, au mipango; “mawazo” ni pana na la kawaida, bila kubana maana kuwa mipango pekee.
- source_word: אָדָם (ʾāḏām)
  choice: wanadamu
  rationale: Katika muktadha huu ni nomino ya kijumla inayorejelea binadamu kwa ujumla, si mwanamume mmoja wala jina Adamu.
- source_word: הָבֶל (hāḇel)
  choice: mvuke
  rationale: Maana ya picha ya msingi ni pumzi au mvuke unaotoweka; “mvuke” huhifadhi taswira ya udhaifu na kutodumu badala ya kuifafanua moja kwa moja kuwa ubatili.
theological_decisions:
- issue: Uhusiano wa kishazi כִּי הֵמָּה הָבֶל
  choice: kwamba ni mvuke
  alternative: kwa maana ni mvuke
  rationale: Kihusishi כִּי kinaweza kutambulisha jambo linalojulikana au sababu. “Kwamba” huhifadhi usomaji unaopatana na mpangilio wa Kiebrania na halisuluhishi zaidi ya lazima.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi na wa heshima. Taswira halisi ya “mvuke” imehifadhiwa ili kuonyesha hali ya muda mfupi na isiyo na uzito ya mawazo ya wanadamu.
