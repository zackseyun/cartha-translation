  text: אֱלֹהִ֣ים צְבָאוֹת֮ שֽׁ֫וּב נָ֥א הַבֵּ֣ט מִ/שָּׁמַ֣יִם וּ/רְאֵ֑ה וּ֝/פְקֹ֗ד גֶּ֣פֶן זֹֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/014.yaml
  text: God of hosts[a], please return; look down from heaven and see, and visit this vine.
translation:
  language: sw
  text: 'Ee Mungu wa majeshi, tafadhali urudi;

    tazama kutoka mbinguni, uone,

    na uzuru[a] mzabibu huu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uushughulikie,” “uutunze,” au “uukague.” Kitenzi cha Kiebrania kinaweza kumaanisha kuzuru, kushughulikia, kutunza, au kukagua; hapa ombi ni kwamba Mungu aingilie kati kwa faida ya mzabibu huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Mungu wa majeshi
  rationale: Jina hili linamwonyesha Mungu akiwa mtawala wa majeshi ya mbinguni. “Mungu wa majeshi” huhifadhi taswira hiyo ya kijeshi na ya ulimwengu wa mbinguni bila kuibadili kuwa jina lenye maana pana zaidi, kama “Mungu Mwenyezi.”
- source_word: שׁוּב נָא
  choice: tafadhali urudi
  rationale: Kitenzi שׁוּב ni ombi la Mungu arudi au ageuke tena kuelekea watu wake, na נָא huonyesha kusihi. “Tafadhali urudi” ni ombi la wazi na la kawaida katika Kiswahili cha sasa.
- source_word: הַבֵּט מִשָּׁמַיִם
  choice: tazama kutoka mbinguni
  rationale: הבט humaanisha kutazama kwa makini. Kirai hiki kinahifadhi mahali anapotazama Mungu—kutoka mbinguni—bila kuongeza neno lisilohitajika.
- source_word: וּרְאֵה
  choice: uone
  rationale: Amri rahisi “uone” imehifadhiwa na kuendeleza mfuatano wa kishairi baada ya “tazama.”
- source_word: וּפְקֹד
  choice: na uutunze
  rationale: פקד inaweza kumaanisha kujilia, kushughulikia, kukagua, au kuingilia kati. Katika ombi hili kuhusu mzabibu, “uutunze” huwasilisha hatua yenye lengo la kuufaa, huku upana wa kitenzi ukielezwa katika tanbihi.
- source_word: גֶּפֶן זֹאת
  choice: mzabibu huu
  rationale: גֶּפֶן ni mzabibu mmoja, si shamba la mizabibu. Tafsiri hii inadumisha kwa usahihi sitiari ya Israeli kama mzabibu.
theological_decisions:
- issue: Tafsiri ya jina la Mungu אֱלֹהִים צְבָאוֹת
  choice: Mungu wa majeshi
  alternative: Mungu Mwenyezi
  rationale: Kiebrania kinakazia utawala wa Mungu juu ya majeshi, hasa majeshi ya mbinguni. “Mungu wa majeshi” huhifadhi taswira hiyo, ilhali “Mungu Mwenyezi” ingeleta maana pana ambayo si maana ya moja kwa moja ya jina hili.
- issue: Maana ya hatua iliyoombwa kwa kitenzi פקד
  choice: uutunze
  alternative: uujilie
  rationale: Muktadha wa maombolezo unaomba Mungu aingilie kati kwa ajili ya ustawi wa mzabibu, lakini kitenzi chenyewe kina maana nyingi. “Uutunze” huonyesha mwelekeo chanya wa ombi bila kuondoa kabisa utata huo, ambao umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayofaa sala ya kishairi. Mistari mitatu inadumisha mfuatano wa maombi ya amri katika Kiebrania. “Mzabibu” imechaguliwa badala ya “shamba la mizabibu” ili kuhifadhi sitiari ya umoja.
