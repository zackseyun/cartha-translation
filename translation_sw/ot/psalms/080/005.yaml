translation:
  language: sw
  text: 'Umewalisha mkate wa machozi,

    na kuwanywesha machozi kwa kipimo kikubwa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa kipimo cha theluthi” au “kwa kipimo mara tatu”; neno la mwisho huenda linamaanisha kipimo kikubwa, lakini maana yake kamili haijulikani kwa uhakika.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱכַלְתָּם
  choice: Umewalisha
  rationale: Hifili ya אכל pamoja na kiambishi cha nafsi ya tatu wingi ina maana ya kusababisha wale; ‘umewalisha’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo. Wakati timilifu unaonyesha tendo lililotendwa lenye uzito katika hali ya sasa.
- source_word: לֶחֶם דִּמְעָה
  choice: mkate wa machozi
  rationale: Tafsiri hii inahifadhi taswira halisi na yenye nguvu ya Kiebrania badala ya kuipanua kuwa ‘chakula cha huzuni.’
- source_word: וַתַּשְׁקֵמוֹ
  choice: na kuwanywesha
  rationale: Hifili ya שקה humaanisha kuwapa au kuwasababisha kunywa; ‘kuwanywesha’ ni ya asili na inalingana na ‘umewalisha.’
- source_word: בִּדְמָעוֹת
  choice: machozi
  rationale: Baada ya kitenzi ‘kuwanywesha,’ machozi ndiyo kitu walichopewa kunywa; Kiswahili hakihitaji kuonyesha kihusishi cha Kiebrania moja kwa moja.
- source_word: שָׁלִישׁ
  choice: kwa kipimo kikubwa
  rationale: Neno hili ni istilahi isiyo wazi ya kipimo. Muktadha unaonyesha wingi wa machozi, huku ‘kipimo kikubwa’ kikiepuka kudai kwa uhakika thamani mahsusi ya kipimo hicho.
