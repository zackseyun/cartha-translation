  yaml_path: translation/ot/psalms/080/012.yaml
  text: Why have you broken down its walls[b][a], so that all who pass by the way pluck its fruit?
translation:
  language: sw
  text: Kwa nini umebomoa kuta zake[a], hivi kwamba wote wapitao njiani huchuma matunda yake[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ua wake” au “uzio wake”; Kiebrania hurejelea ua au uzio unaozunguka na kulinda shamba la mizabibu.
    reason: lexical_alternative
  - marker: b
    text: Au “huivuna” au “huyachuma”; kitenzi cha Kiebrania kinadokeza kuchuma au kuvuna mazao kutoka kwenye mzabibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Kwa nini
  rationale: Ni namna ya kawaida na ya moja kwa moja ya kuwasilisha kielezi cha kuuliza kinachoanzisha kilio cha malalamiko.
- source_word: פָּרַצְתָּ
  choice: umebomoa
  rationale: Kitenzi פרץ humaanisha kuvunja au kutoboa kinga; kwa kuta zinazolinda shamba la mizabibu, ‘umebomoa’ ni Kiswahili cha kawaida kinachohifadhi tendo la kuondoa ulinzi.
- source_word: גְדֵרֶיהָ
  choice: kuta zake
  rationale: גדר ni ukuta, ua, au kingo inayozunguka na kulinda shamba la mizabibu. ‘Kuta zake’ ni wazi na yenye hadhi, huku tanbihi ikihifadhi uwezekano wa ‘ua wake.’
- source_word: וְאָרוּהָ
  choice: huchuma matunda yake
  rationale: ארה hudokeza kuchuma au kukusanya mazao kutoka kwenye mzabibu. ‘Matunda’ yamewekwa wazi kwa sababu ndiyo kitu kinachodokezwa na picha ya mzabibu, bila kugeuza tendo hili kuwa uharibifu kamili.
- source_word: כָּל עֹבְרֵי דָרֶךְ
  choice: wote wapitao njiani
  rationale: Huhifadhi maana ya wote wanaopita barabarani na pia mtiririko wa kishairi unaofaa zaburi.
theological_decisions:
- issue: Kirejeleo cha viambishi vya kike
  choice: Viambishi vimetafsiriwa vikirejelea mzabibu uliotajwa katika muktadha, kwa kutumia ‘zake/yake.’
  alternative: Kulieleza moja kwa moja taifa la Israeli na kuacha mfano wa mzabibu.
  rationale: Muktadha wa karibu unaionyesha Israeli kama mzabibu uliotolewa Misri. Kudumisha viambishi na kutaja ‘matunda’ kunahifadhi mfano huo bila kuufafanua kupita kiasi.
- issue: Uhusiano wa kishazi kinachoanza na וְ
  choice: hivi kwamba
  alternative: na
  rationale: Kiunganishi kinaweza kusomwa kama matokeo ya kubomolewa kwa kinga, lakini Kiebrania pia kinaweza kuwakilishwa kwa kiunganishi rahisi ‘na’; tanbihi haijahitajika kwa kuwa ‘hivi kwamba’ huwasilisha uhusiano wa kimuktadha bila kuongeza dai la kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Umbo la kishairi ‘wapitao’ limetumiwa kwa ufupi na mdundo; ‘njiani’ ni la kawaida na linaeleweka kwa wasomaji wengi.
