base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/008.yaml
  text: You brought a vine out of Egypt[b][a]; you drove out nations and planted it.
translation:
  language: sw
  text: Uliutoa mzabibu[b] kutoka Misri[a]; ukayafukuza mataifa, ukaupanda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uliufanya mzabibu usafiri kutoka Misri,” au “uliung’oa mzabibu kutoka Misri.” Kitenzi cha Kiebrania kinaweza kumaanisha kusababisha kitu kiondoke au kukiondoa na kukihamishia mahali pengine.
    reason: lexical_alternative
  - marker: b
    text: “Mzabibu” ni sitiari inayowakilisha Israeli.
    reason: cross_reference
lexical_decisions:
- source_word: גֶּפֶן
  choice: mzabibu
  rationale: Neno hilo humaanisha mzabibu. Linadumisha sitiari ya Israeli bila kuitaja moja kwa moja katika matini.
- source_word: מִמִּצְרַיִם
  choice: Misri
  rationale: Pamoja na kitenzi “uliutoa,” jina “Misri” linaonyesha mahali ulikotolewa mzabibu kwa Kiswahili cha kawaida; maana kamili ni “kutoka Misri.”
- source_word: תַּסִּיעַ
  choice: uliutoa
  rationale: Hifili ya נסע inaweza kumaanisha kung’oa, kuondoa, au kusababisha kitu kiondoke. “Uliutoa” ni ya asili katika Kiswahili na inadumisha wazo la kuhamishwa kutoka Misri, huku tanbihi ikihifadhi upana wa maana.
- source_word: תְּגָרֵשׁ
  choice: ukayafukuza
  rationale: Pieli ya גרש ina maana ya kufukuza au kuondoa kwa nguvu. “Ukayafukuza” inafaa kwa mataifa yaliyotolewa katika nchi.
- source_word: גּוֹיִם
  choice: mataifa
  rationale: Katika muktadha huu neno hilo linarejelea mataifa au makundi ya watu, si lazima “Watu wa Mataifa” katika maana ya baadaye ya kidini.
- source_word: וַתִּטָּעֶהָ
  choice: ukaupanda
  rationale: Kitenzi kinamaanisha “na ukaupanda,” na kiambishi cha yambwa kinarejelea mzabibu. Ngeli ya Kiswahili huonyeshwa kwa “-u-” bila kuufanya mzabibu kuwa mtu.
theological_decisions:
- issue: Utambulisho wa mzabibu katika sitiari
  choice: Sitiari ya “mzabibu” imehifadhiwa katika matini, na tanbihi inaeleza kuwa unawakilisha Israeli.
  alternative: Kutafsiri moja kwa moja, “Uliitoa Israeli Misri.”
  rationale: Kiebrania kinataja mzabibu, si Israeli moja kwa moja. Kubadilisha sitiari hiyo katika matini kungegeuza ufafanuzi kuwa tafsiri.
- issue: Upana wa maana ya תַּסִּיעַ
  choice: “Uliutoa” limetumiwa katika matini, huku maana mbadala zikielezwa katika tanbihi.
  alternative: “Uliung’oa” au “uliusafirisha.”
  rationale: Kitenzi kinaweza kuonyesha kung’oa, kuondoa, au kusababisha kuondoka. “Uliutoa” kinaeleweka kwa urahisi na hakifungi maana kwenye picha ya kung’oa pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi ni mfupi na wa moja kwa moja. “Ukayafukuza” na “ukaupanda” vinaonyesha mfuatano wa matendo kwa kawaida; alama zote za tanbihi [a] na [b] zimo katika matini.
