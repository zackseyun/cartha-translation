  text: Limechomwa kwa moto, limekatwa—kwa karipio la uso wako wanaangamia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂרֻפָה
  choice: Limechomwa
  rationale: Kitenzi hiki cha hali, katika umoja wa kike, kinarejelea mzabibu wa muktadha na kuonyesha kwamba umechomwa.
- source_word: כְּסוּחָה
  choice: limekatwa
  rationale: Hudumisha picha ya mzabibu uliokatwa au kufyekwa bila kuongeza mhusika asiyetajwa.
- source_word: מִגַּעֲרַת פָּנֶיךָ
  choice: kwa kukemea kwa uso wako
  rationale: Inahifadhi taswira ya Kiebrania ya kukemea kunakotoka katika uso au uwepo wa Mungu, badala ya kuirahisisha kuwa 'kwa kukemea kwako' pekee.
- source_word: יֹאבֵדוּ
  choice: wanaangamia
  rationale: Inadumisha wingi wa kitenzi cha Kiebrania, hata baada ya maelezo ya mzabibu katika umoja, na hivyo kuhifadhi mvutano wa kisarufi wa chanzo.
theological_decisions:
- issue: Mpito kutoka mzabibu wa umoja wa kike kwenda kitenzi cha wingi
  choice: Limechomwa kwa moto, limekatwa—kwa kukemea kwa uso wako wanaangamia.
  alternative: Umechomwa kwa moto, umekatwa—kwa kukemea kwako unaangamia.
  rationale: Chanzo kina viambajengo viwili vya umoja wa kike kisha kitenzi cha wingi. Tafsiri haibadili wingi kuwa umoja wala kutaja wazi ni nani wanaoangamia, ili kutatua utata ambao maandishi yenyewe hayatatui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Kistari kirefu kinahifadhi mkato na uhusiano mkali wa kishairi kati ya uharibifu wa mzabibu na kukemea kwa Mungu.
