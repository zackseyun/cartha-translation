  text: 'For the choir director: according to “Lilies.” A testimony[b][a]. A psalm of Asaph.'
translation:
  language: sw
  text: 'Kwa kiongozi wa waimbaji: kulingana na “Mayungiyungi.” Ushuhuda.[a] Zaburi ya Asafu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “kwa ‘Mayungiyungi—Ushuhuda.’” Maneno haya ya Kiebrania yanaonekana kuwa maagizo ya kimuziki au kiliturujia, lakini maana na mgawanyo wake kamili si hakika.
    reason: alternative_reading
  - marker: b
    text: Au, “kwa Asafu.” Kihusishi cha Kiebrania kinaweza kuonyesha utunzi, umiliki, uhusiano, au matumizi, bila kuamua kwa hakika ni upi unaokusudiwa.
    reason: source_ambiguity
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa kiongozi wa waimbaji
  rationale: Kirai hiki cha vichwa vya zaburi humwelekeza anayesimamia uimbaji au utendaji wa muziki; tafsiri hii ni ya kawaida na inaeleweka bila kubainisha zaidi ya Kiebrania.
- source_word: אֶל שֹׁשַׁנִּים
  choice: kulingana na “Maua ya Yungiyungi”
  rationale: Katika kichwa hiki, אֶל huenda inatambulisha namna, mtindo, au wimbo unaotumiwa; alama za kunukuu zinaonyesha kwamba “Maua ya Yungiyungi” huenda ni jina la kimuziki, si maua yanayotajwa katika zaburi.
- source_word: עֵדוּת
  choice: Ushuhuda
  rationale: Neno limetafsiriwa kwa maana yake ya msingi huku likiachwa kama kipengele tofauti cha kichwa, kwa kuwa kazi yake kamili ya kimuziki au kiliturujia haijulikani kwa uhakika.
- source_word: לְאָסָף
  choice: ya Asafu
  rationale: Hii ndiyo namna ya kawaida ya kuonyesha uhusiano wa zaburi na Asafu, huku uhusiano huo ukiweza kuwa utunzi, umiliki, matumizi, au mkusanyo.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Ni istilahi ya kawaida ya Kiswahili kwa utungo wa kuimbwa unaoitwa מִזְמוֹר.
