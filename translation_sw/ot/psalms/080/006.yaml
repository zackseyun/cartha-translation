  text: You make us a cause of strife to our neighbors, and our enemies mock them.
translation:
  language: sw
  text: 'Umetufanya kuwa chanzo cha ugomvi kwa jirani zetu,

    na adui zetu wanawadhihaki.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: wanawadhihaki wao. Mrejeo wa “wao” si wazi; huenda ni jirani zetu, au maana ikawa kwamba adui wanatudhihaki au wanacheka wao kwa wao.'
    reason: Kiwakilishi לָמוֹ ni cha nafsi ya tatu wingi lakini kina mrejeo wenye utata katika muktadha.
lexical_decisions:
- source_word: תְּשִׂימֵנוּ מָדוֹן
  choice: Umetufanya kuwa chanzo cha ugomvi
  rationale: Kiebrania kinasema kihalisi ‘unatuweka kuwa ugomvi’; tafsiri hii ya Kiswahili inaeleza kwa kawaida kwamba watu hao wamekuwa sababu ya mabishano au migogoro.
- source_word: לִשְׁכֵנֵינוּ
  choice: kwa jirani zetu
  rationale: Inahifadhi maana ya uhusiano na wale wanaowazunguka, bila kuongeza ikiwa ugomvi ni kati yao au dhidi ya watu wa Mungu.
- source_word: יִלְעֲגוּ לָמוֹ
  choice: wanawadhihaki
  rationale: Kitenzi לָעַג humaanisha kudhihaki au kucheka kwa dharau; kiwakilishi cha Kiebrania לָמוֹ ni cha wingi, ‘wao,’ na kimedumishwa katika matini huku utata wake ukielezwa katika tanbihi.
theological_decisions:
- issue: Mrejeo wa kiwakilishi לָמוֹ (‘wao’)
  choice: ‘wanawadhihaki,’ kikirejelea kwa karibu jirani
  alternative: ‘wanatudhihaki’ au ‘wanacheka wao kwa wao’
  rationale: Matini ya Kimasora ina kiwakilishi cha nafsi ya tatu wingi, si ‘sisi.’ Mrejeo wake si wazi kabisa; matini kuu inafuata umbo hilo badala ya kulibadili kimya kimya, na tanbihi inahifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye staha. ‘Chanzo cha ugomvi’ ni ya kawaida na inaeleweka kuliko tafsiri sisisi ‘kuwa ugomvi,’ huku usambamba wa kishairi wa mistari miwili ukihifadhiwa.
