lexical_decisions:
- source_word: כַנָּה
  choice: shina
  rationale: Neno hili adimu limo katika taswira ya mzabibu. “Shina” ni neno la kawaida na lenye hadhi linalodumisha taswira ya mmea bila kulazimisha maana mahususi ya chipukizi au tawi.
- source_word: נָטְעָה
  choice: ulilolipanda
  rationale: Kitenzi kwa kawaida humaanisha kupanda, na tafsiri hii inadumisha taswira ya kilimo katika muktadha.
- source_word: יְמִינֶךָ
  choice: mkono wako wa kuume
  rationale: Tafsiri ya karibu inadumisha taswira ya mkono wa Mungu kama ishara ya tendo lake lenye nguvu badala ya kuibadili kuwa dhana ya jumla ya “nguvu.”
- source_word: וְעַל
  choice: na
  rationale: Katika muundo huu kinaunganisha sehemu ya pili inayolingana na ya kwanza; “na” ni ya asili katika Kiswahili na haifanyi sentensi kuwa nzito.
- source_word: בֵּן
  choice: mwana
  rationale: Maana ya moja kwa moja ni “mwana.” Kuihifadhi kunadumisha uhuishaji wa taswira na mvutano wa kitheolojia badala ya kuibadili kimya kuwa “tawi.”
- source_word: אִמַּצְתָּה
  choice: uliyemfanya awe na nguvu
  rationale: 'Muundo huu unaonyesha wazi maana ya kusababisha ya kitenzi: kumtia mtu nguvu au kumfanya awe imara.'
- source_word: לָּךְ
  choice: kwa ajili yako
  rationale: Kifungu hiki kinaonyesha kwamba mwana alitiwa nguvu kwa kusudi au manufaa ya Mungu; ni Kiswahili cha kawaida kisichoongeza ufafanuzi usiokuwapo.
theological_decisions:
- issue: Utambulisho wa “mwana” katika taswira ya mzabibu
  choice: Kudumisha “mwana” katika maandishi bila kumtambulisha moja kwa moja kuwa Masihi.
  alternative: “Tawi,” rejeo la pamoja kwa Israeli, au usomaji wa kimasiha.
  rationale: Muktadha unahusu mzabibu unaowakilisha Israeli, lakini Kiebrania chenyewe kinasema “mwana.” Tafsiri inalinda utata huo na kuacha uwezekano wa usomaji wa pamoja au wa kitipolojia bila kuuagiza katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unaendeleza sentensi ya aya iliyotangulia; alama ya mwisho ya mstari mrefu inadumisha mwendelezo wa wazo. Viambishi vya ngeli katika “ulilolipanda” vinarejelea “shina,” na “uliyemfanya” vinarejelea “mwana.”
