  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chipukizi,” “tawi,” au “shina la kupandikizia” badala ya “shina.” Neno la Kiebrania ni adimu na limetumiwa hapa katika taswira ya mzabibu.
