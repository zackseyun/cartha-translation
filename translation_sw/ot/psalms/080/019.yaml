id: PSA.80.19
reference: Psalms 80:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: יְה֘וָ֤ה אֱלֹהִ֣ים צְבָא֣וֹת הֲשִׁיבֵ֑/נוּ הָאֵ֥ר פָּ֝נֶ֗י/ךָ וְ/נִוָּשֵֽׁעָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/019.yaml
  text: O Yahweh God of hosts[a], restore us; make your face shine[b], that we may be saved.
translation:
  language: sw
  text: 'Ee Yahwe, Mungu wa majeshi,

    uturejeshe[a];

    ufanye uso wako uangaze,

    ili tuokolewe.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uturudishe” au “utugeuze turudi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nasi tutaokolewa.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetafsiriwa moja kwa moja kwa umbo la Kiswahili linalotambulika, badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hapa ni cheo cha kawaida cha Uungu kilichowekwa sambamba na jina Yahwe.
- source_word: צְבָאוֹת
  choice: wa majeshi
  rationale: Huhifadhi picha ya majeshi yaliyo chini ya mamlaka ya Mungu na pia ni sehemu ya cheo kinachoeleweka katika Kiswahili cha Biblia; “makundi” ingekuwa pana lakini isingeonyesha vizuri nguvu ya kijeshi ya neno hilo.
- source_word: הֲשִׁיבֵנוּ
  choice: uturejeshe
  rationale: Kitenzi cha kusababisha pamoja na kiambishi cha nafsi ya kwanza wingi kinaweza kumaanisha kuturudisha au kutugeuza turudi; “uturejeshe” kinabeba wazo pana la kurudishwa katika hali na uhusiano uliokuwa mwema bila kulifafanua kupita kiasi.
- source_word: הָאֵר
  choice: ufanye ... uangaze
  rationale: 'Muundo huu wa Kiswahili unaonyesha kwa kawaida nguvu ya kusababisha ya kauli ya Kiebrania: “sababisha uangaze.”'
- source_word: פָּנֶיךָ
  choice: uso wako
  rationale: Tafsiri halisi ya picha hiyo imehifadhiwa badala ya kuibadili kuwa fasiri kama “uwepo wako” au “kibali chako.”
- source_word: וְנִוָּשֵׁעָה
  choice: ili tuokolewe
  rationale: 'Kauli ya kutendwa yenye maana ya hiari baada ya maombi ya amri inaeleweka kwa kawaida kama kusudi au matokeo yanayotazamiwa: “ili tuokolewe.”'
theological_decisions:
- issue: Mfuatano wa jina na cheo יְהוָה אֱלֹהִים צְבָאוֹת
  choice: Ee Yahwe, Mungu wa majeshi
  alternative: Ee Yahwe Mungu wa majeshi; au, Ee Yahwe, Mungu wa makundi ya mbinguni
  rationale: Tafsiri inahifadhi jina binafsi Yahwe na cheo cha mamlaka juu ya majeshi, bila kulazimisha majeshi hayo yaeleweke kuwa ya duniani pekee.
- issue: Nguvu ya kitenzi cha mwisho וְנִוָּשֵׁעָה
  choice: ili tuokolewe
  alternative: nasi tutaokolewa
  rationale: Mfuatano wa maombi mawili na umbo la hiari unaweza kuonyesha kusudi au matokeo. Matini kuu inaonyesha utegemezi wa wokovu kwa tendo la Mungu, huku tanbihi ikihifadhi uwezekano wa kusoma matokeo hayo kama hakikisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mistari mifupi imehifadhi muundo wa ombi la kurudiwa katika Zaburi 80. “Ufanye uso wako uangaze” ni picha ya makusudi iliyo karibu na Kiebrania, ingawa katika mazungumzo ya kawaida maana yake inaweza kusemwa kwa kufasiri zaidi kama kuonyesha kibali.
