  text: תְּשַׁלַּ֣ח קְצִירֶ֣/הָ עַד יָ֑ם וְ/אֶל נָ֝הָ֗ר יֽוֹנְקוֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/011.yaml
  text: It sent out its branches as far as the sea[b][a], and its shoots to the River.
translation:
  language: sw
  text: Ulitandaza matawi yake mpaka baharini,[a] na machipukizi yake mpaka Mto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “matawi yake makubwa.” Neno la Kiebrania hapa si la kawaida, na huenda linataja kwa ujumla ukuaji wa mzabibu unaoenea.
    reason: lexical_alternative
  - marker: b
    text: “Mto” yaelekea ni Mto Frati, kwa kurejelea eneo la Israeli lililokusudiwa kuenea kutoka baharini hadi Mto huo.
    reason: cross_reference
lexical_decisions:
- source_word: תְּשַׁלַּח
  choice: Ulitandaza
  rationale: Kitenzi cha Kiebrania kinaonyesha mzabibu ukieneza ukuaji wake. “Ulitandaza” ni Kiswahili cha kawaida kinachofaa kwa matawi yanayoenea, huku kikihifadhi picha tendaji ya kishairi.
- source_word: קְצִירֶהָ
  choice: matawi yake
  rationale: Ingawa neno hili si la kawaida katika muktadha huu, linaelekea kutaja ukuaji unaoenea wa mzabibu. “Matawi” ni wazi na linaendana na ulinganifu wa “machipukizi”; uwezekano mpana zaidi unaelezwa katika tanbihi.
- source_word: עַד יָם
  choice: mpaka baharini
  rationale: עַד huonyesha kikomo cha kufika au kuenea. “Mpaka baharini” ni usemi wa asili wa Kiswahili unaobeba maana hiyo; hapa bahari yaelekea kuwa Mediterania.
- source_word: וְאֶל נָהָר
  choice: na ... mpaka Mto
  rationale: Ingawa אֶל kwa kawaida ni “kwenda/kuelekea,” katika ulinganifu na עַד mstari unaonyesha umbali wa kuenea. Herufi kubwa katika “Mto” inadokeza jina maalumu, yaani yaelekea Frati, bila kulifanya kuwa wazi ndani ya mstari.
- source_word: יוֹנְקוֹתֶיהָ
  choice: machipukizi yake
  rationale: Nomino hiyo hutaja vichipukizi au matawi mapya ya mmea. “Machipukizi” ni neno la sasa, linaloeleweka, na linafaa kwa taswira ya mzabibu.
theological_decisions:
- issue: Utambulisho wa “Mto”
  choice: Kudumisha “Mto” katika maandishi na kueleza katika tanbihi kuwa yaelekea ni Frati
  alternative: Kutafsiri moja kwa moja “Mto Frati”
  rationale: Kiebrania kinasema נָהָר, “mto,” bila kuongeza jina Frati. Kutaja uwezekano huo katika tanbihi huhifadhi utata wa maandishi na wakati huohuo hufafanua mwangwi wa mipaka ya nchi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa mistari sambamba umehifadhiwa. Kiambishi cha ngeli katika “ulitandaza” humrejelea mzabibu wa muktadha uliotangulia; “baharini” ni idiomati zaidi kuliko “mpaka bahari,” na “Mto” imeandikwa kwa herufi kubwa kuashiria rejeo la kijiografia linalowezekana.
