base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/009.yaml
  text: You cleared the ground before it[c][b][a], and it took root and filled the land.
translation:
  language: sw
  text: Uliandaa nafasi mbele yake[a]; ukatia mizizi[b] na ukaijaza nchi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uliitengenezea nafasi.” Kitenzi cha Kiebrania kinaweza kumaanisha kuondoa vizuizi au kuandaa nafasi kwa ajili ya mzabibu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “ukatia mizizi yake,” usemi wa Kiebrania unaomaanisha kwamba uliimarika.
    reason: lexical_alternative
  - marker: c
    text: Au, “dunia,” kutegemea kama neno hili linaeleweka kwa upeo wa mahali hapa au kwa maana pana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּנִּיתָ לְפָנֶיהָ
  choice: Uliandaa nafasi mbele yake
  rationale: Katika kauli hii, פנה katika Piel pamoja na לְפָנֶיהָ hueleza kuondoa vizuizi au kutengeneza nafasi kwa ajili ya mzabibu. Kiswahili hiki ni cha asili na kinadumisha taswira bila kuongeza kitendo kisichotajwa wazi.
- source_word: וַתַּשְׁרֵשׁ שָׁרָשֶׁיהָ
  choice: ikatia mizizi
  rationale: Kiebrania kinasema kwa mkazo wa kishairi, kihalisi, ‘ikatia mizizi yake.’ ‘Ikatia mizizi’ ni nahau ya kawaida ya Kiswahili inayowasilisha kuimarika kwa mzabibu bila kuongeza kielezi kama ‘kwa kina.’
- source_word: וַתְּמַלֵּא
  choice: kuijaza
  rationale: Kitenzi מלא kimsingi ni ‘kujaza.’ Umbo ‘kuijaza’ linaonyesha kwamba mzabibu ulienea na kuchukua eneo la nchi huku likihifadhi maana ya msingi.
- source_word: אֶרֶץ
  choice: nchi
  rationale: אֶרֶץ inaweza kumaanisha ‘nchi’ au ‘dunia.’ Katika taswira ya mzabibu na muktadha wa zaburi, ‘nchi’ ndiyo maana inayowezekana zaidi, lakini uwezekano mpana umewekwa katika tanbihi.
theological_decisions:
- issue: Rejeo la mzabibu na upeo wa taswira
  choice: Kudumisha mzabibu kama taswira bila kutaja Israeli moja kwa moja katika mstari huu.
  alternative: 'Kufafanua: ‘Israeli ikatia mizizi na kuijaza nchi.’'
  rationale: Muktadha mpana unautambulisha mzabibu kuwa Israeli, lakini mstari wenyewe unaendeleza sitiari. Tafsiri haipaswi kuiondoa taswira hiyo wala kuingiza ufafanuzi katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Ngeli ya mzabibu imewakilishwa kwa ‘i-’; alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
