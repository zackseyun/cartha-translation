  text: וְ/לֹא נָס֥וֹג מִמֶּ֑/ךָּ תְּ֝חַיֵּ֗/נוּ וּ/בְ/שִׁמְ/ךָ֥ נִקְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/018.yaml
  text: Then we will not turn back from you; revive us[a], and we will call on your name.
translation:
  language: sw
  text: Ndipo hatutageuka mbali nawe; utupe uhai[a], nasi tutaliitia jina lako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utuhuishe.” Kiebrania kinaweza pia kumaanisha “utuhifadhi hai” au “utufanye tuishi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Ndipo ... hatu-
  rationale: Kiunganishi pamoja na ukanushi kinaeleweka hapa kama matokeo ya ombi lililotangulia; “Ndipo hatutageuka” ni Kiswahili cha kawaida kinachohifadhi uhusiano huo bila kuufanya wa lazima kupita kiasi.
- source_word: נָסוֹג
  choice: hatutageuka mbali
  rationale: Kitenzi kina maana ya kurudi nyuma au kujiondoa. “Kugeuka mbali” kinaonyesha kujitenga na Mungu bila kuingiza dhana maalumu ya kimadhehebu kama “kurudi nyuma kiroho.”
- source_word: מִמֶּךָּ
  choice: nawe
  rationale: Baada ya “kugeuka mbali,” “nawe” huwasilisha kwa kawaida maana ya kujitenga ‘na wewe’ katika Kiswahili.
- source_word: תְּחַיֵּנוּ
  choice: utupe uhai
  rationale: Piel ya חיה inaweza kumaanisha kuhuisha, kuhifadhi hai, au kufanya waishi. “Utupe uhai” huhifadhi upana wa maana hiyo kwa lugha ya sasa na iliyo wazi.
- source_word: וּבְשִׁמְךָ נִקְרָא
  choice: nasi tutaliitia jina lako
  rationale: Muundo קרא בשם hapa una maana ya kuliitia au kul呼? jina la Mungu katika sala na ibada. “Tutaliitia jina lako” ni msemo wa kawaida wa kibiblia unaohifadhi maana ya kumwomba Mungu.
theological_decisions:
- issue: Maana ya ombi la kupewa uhai
  choice: Ombi kwamba Mungu awape au awarejeshee uhai, likiacha wazi kama ni kuhuishwa au kuhifadhiwa hai.
  alternative: “Utuhuishe,” ambalo linaweza kusisitiza zaidi kurejeshwa kutoka hali ya kudhoofika au kufa.
  rationale: חיה katika Piel ina wigo mpana wa maana. “Utupe uhai” hailazimishi kifungu kumaanisha uamsho wa kiroho pekee wala kuhifadhi maisha ya kimwili pekee.
- issue: Uhusiano wa kisharti au wa matokeo
  choice: “Ndipo” linaonyesha jibu la watu linalofuata tendo la Mungu la kuwapa uhai.
  alternative: “Wala,” ambalo lingehifadhi tu mfuatano wa sentensi bila kuonyesha wazi matokeo.
  rationale: וְ inaweza kuwa kiunganishi cha kawaida, lakini katika muktadha huu uhusiano wa matokeo unaeleweka. “Ndipo” huuwasilisha kwa kawaida huku tafsiri yote ikiendelea kuwa ombi na ahadi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mistari na mfuatano wa ombi kisha ahadi umehifadhiwa.
