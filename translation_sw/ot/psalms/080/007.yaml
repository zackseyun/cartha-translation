base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/007.yaml
  text: God of hosts[a], restore us; make your face shine[c][b], and we will be saved.
translation:
  language: sw
  text: Mungu wa majeshi, uturejeshe[a]; ufanye uso wako uangaze[b], nasi tutaokolewa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uturudishe” au “utufanye turudi.” Kitenzi cha Kiebrania kinaweza kumaanisha kuturudisha au kutufanya turudi.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “uso wako.” Nahau hii hurejelea uwepo wa Mungu wenye kibali.
    reason: lexical_alternative
  - marker: c
    text: Au “tutakombolewa.” Kiebrania kinaweza kurejelea kwa upana kuokolewa au kukombolewa.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Neno hili ni mwito wa moja kwa moja kwa Mungu wa Israeli. Kiswahili kinaweza kuonyesha mwito huo bila kuongeza kihisishi “Ee”.
- source_word: צְבָאוֹת
  choice: wa majeshi
  rationale: Katika jina la Mungu, “majeshi” huhifadhi taswira ya mamlaka yake juu ya vikosi vyote bila kuibana kwa wanajeshi wa kibinadamu pekee.
- source_word: הֲשִׁיבֵנוּ
  choice: uturejeshe
  rationale: Kauli ya kusababisha ya kitenzi שוב inaweza kumaanisha kutufanya turudi au kuturudisha katika hali njema. “Uturejeshe” ni ya asili na haibainishi kupita kiasi ikiwa kurudi huku ni kwa mahali, kiroho, au kwa agano.
- source_word: וְהָאֵר
  choice: uufanye ... uangaze
  rationale: Kauli ya kusababisha ya אור ina maana ya “kusababisha kung'aa.” Muundo huu wa Kiswahili unaonyesha wazi maana hiyo ya kisababishi.
- source_word: פָּנֶיךָ
  choice: uso wako
  rationale: Hii ndiyo maana halisi, na huhifadhi nahau ya kibiblia inayorejelea uwepo na kibali cha Mungu.
- source_word: וְנִוָּשֵׁעָה
  choice: nasi tutaokolewa
  rationale: Kauli hii huonyesha matokeo ya Mungu kuonyesha kibali chake. “Tutaokolewa” huhifadhi maana pana ya kuokolewa au kukombolewa bila kuibana kwa aina moja ya wokovu.
theological_decisions:
- issue: Tafsiri ya jina la Mungu אֱלֹהִים צְבָאוֹת
  choice: Mungu wa majeshi
  alternative: Mungu wa majeshi ya mbinguni
  rationale: “Mungu wa majeshi” huhifadhi upana wa jina hilo na mamlaka kuu ya Mungu juu ya nguvu zote, bila kulifafanua kuwa majeshi ya mbinguni pekee.
- issue: Upeo wa wokovu katika וְנִוָּשֵׁעָה
  choice: tutaokolewa
  alternative: tutakombolewa
  rationale: Kiebrania kinaweza kurejelea uokozi kwa maana pana. “Tutaokolewa” huhifadhi uzito wa kitheolojia pamoja na uwezekano wa ukombozi wa kihistoria, bila kuamua jambo ambalo mstari wenyewe haujalibana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. Taswira halisi ya “uso” imehifadhiwa, huku muundo wa kisababishi “uufanye ... uangaze” ukitoa maana ya Kiebrania kwa uwazi.
