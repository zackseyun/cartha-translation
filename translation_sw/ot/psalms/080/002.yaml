lexical_decisions:
- source_word: לִפְנֵי
  choice: Mbele ya
  rationale: Huhifadhi maana ya mahali na taswira ya Mungu kuwa au kwenda mbele ya makabila hayo kwa Kiswahili cha kawaida.
- source_word: אֶפְרַיִם וּבִנְיָמִן וּמְנַשֶּׁה
  choice: Efraimu, Benyamini na Manase
  rationale: Majina ya makabila yamenukuliwa kwa maumbo yaliyozoeleka katika Kiswahili; orodha imetolewa kwa mtiririko wa asili wa Kiswahili.
- source_word: עוֹרְרָה
  choice: amsha
  rationale: Kitenzi hiki cha ombi huleta picha ya nguvu zinazochochewa au kuamshwa ili zitende kazi.
- source_word: אֶת גְּבוּרָתֶךָ
  choice: nguvu zako
  rationale: גְּבוּרָה humaanisha nguvu, uweza au ushujaa; ‘nguvu zako’ ni wazi, ya heshima, na ya kawaida katika ombi kwa Mungu.
- source_word: וּלְכָה
  choice: uje
  rationale: Ingawa הלך kwa kawaida ni ‘kwenda/tembea,’ hapa ombi linaelekezwa kwa Mungu ili awafikie waombaji na kuingilia kati; ‘uje’ ni Kiswahili cha asili katika muktadha huu.
- source_word: לִישֻׁעָתָה לָּנוּ
  choice: kutuokoa
  rationale: Muundo huu unaonyesha kusudi la kuja kwa Mungu kwa ajili ya wokovu au ukombozi wa watu; ‘kutuokoa’ huwasilisha nguvu hiyo ya kitenzi kwa uwazi.
theological_decisions:
- issue: Namna ya kutafsiri tendo la Mungu katika ombi
  choice: ‘amsha nguvu zako, uje kutuokoa’ kama ombi la moja kwa moja la Mungu adhihirishe nguvu na kuingilia kati
  alternative: ‘amsha uweza wako, uende kwa ajili ya wokovu wetu’
  rationale: Tafsiri hii hudumisha haraka na uzito wa sala bila kugeuza mstari kuwa kauli ya kimafundisho au kuongeza wazo lisilokuwamo katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi bila kuwa kigumu. ‘Amsha nguvu zako’ huhifadhi sitiari ya Kiebrania; ‘uje kutuokoa’ ni ombi la kawaida na lenye nguvu. Alama za tanbihi zimewekwa baada ya vipashio vinavyohusika.
