source:
  edition: WLC
  text: רֹ֘עֵ֤ה יִשְׂרָאֵ֨ל הַאֲזִ֗ינָ/ה נֹהֵ֣ג כַּ/צֹּ֣אן יוֹסֵ֑ף יֹשֵׁ֖ב הַ/כְּרוּבִ֣ים הוֹפִֽיעָ/ה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/001.yaml
  text: Shepherd of Israel[a], give ear, you who lead Joseph like a flock; you who are enthroned above the cherubim[c][b], shine forth.
translation:
  language: sw
  text: 'Ee Mchungaji wa Israeli, sikiliza,

    wewe unayemwongoza Yosefu kama kundi la kondoo;[a]

    wewe uketiye juu ya makerubi,[b]

    ng''aa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yosefu” hapa huenda anawakilisha watu wa Israeli, hasa makabila ya kaskazini; hata hivyo, Kiebrania kinadumisha jina lenyewe.
    reason: cultural_note
  - marker: b
    text: Au “wewe uketiye katikati ya makerubi.” Kiebrania husema kihalisi “uketiye [juu ya/miongoni mwa] makerubi”; hakuna kihusishi kinachotajwa wazi. Huu ni usemi wa kawaida wa uwepo wa Mungu kama Mfalme.
    reason: alternative_reading
lexical_decisions:
- source_word: רֹעֵה
  choice: Mchungaji
  rationale: Ni kitenzi-jina cha Kiebrania kinachotumiwa hapa kama cheo cha Mungu. “Mchungaji” huhifadhi taswira ya uchungaji kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: הַאֲזִינָה
  choice: sikiliza
  rationale: Amri hii ina maana ya kusikiliza kwa makini. “Sikiliza” ni ya moja kwa moja na ya asili; haiongezi kiwakilishi cha yambwa ambacho hakipo wazi katika Kiebrania.
- source_word: נֹהֵג
  choice: unayemwongoza
  rationale: Katika taswira ya kichungaji, neno hili linaonyesha kuongoza kundi. Kiambishi “-m-” kinamrejelea Yosefu kama jina la umoja linalowakilisha watu.
- source_word: כַצֹּאן
  choice: kama kundi la kondoo
  rationale: צאן ni nomino ya jumla kwa kundi la mifugo midogo. Tafsiri hii huhifadhi maana ya pamoja na taswira ya kichungaji.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: Jina lenyewe limehifadhiwa badala ya kufafanuliwa kuwa Israeli au makabila ya kaskazini, kwa kuwa Kiebrania kinasema “Yosefu.”
- source_word: יֹשֵׁב הַכְּרוּבִים
  choice: wewe unayeketi kwenye kiti cha enzi juu ya makerubi
  rationale: ישב inaweza kumaanisha kuketi au kukaa, lakini katika taswira hii ya kifalme inaashiria kutawazwa kwenye kiti cha enzi. “Juu ya makerubi” haibani uhusiano wa mahali kuliko tafsiri ya “katikati ya makerubi,” huku maelezo ya chini yakihifadhi uwezekano huo.
- source_word: הוֹפִיעָה
  choice: jionyeshe kwa mng’ao
  rationale: Katika muktadha wa Mungu kujidhihirisha, amri hii huunganisha kujitokeza na kung’aa kwa utukufu. Kauli hii ya Kiswahili huhifadhi vipengele vyote viwili kwa njia ya asili.
theological_decisions:
- issue: Taswira ya Mungu kuketi juu ya makerubi
  choice: wewe unayeketi kwenye kiti cha enzi juu ya makerubi
  alternative: wewe unayeketi kwenye kiti cha enzi katikati ya makerubi
  rationale: Mstari unatumia taswira ya kifalme inayohusishwa na makerubi na uwepo wa Mungu. “Kwenye kiti cha enzi” huonyesha nguvu ya kifalme ya usemi bila kuufanya uwe maelezo ya mahali tu; tanbihi huhifadhi utata wa kihusishi ambacho hakijaelezwa wazi katika Kiebrania.
- issue: Yosefu kama jina la pamoja
  choice: Kuhifadhi jina “Yosefu” katika matini
  alternative: Kutafsiri kwa ufafanuzi kuwa “watu wa Israeli” au “makabila ya kaskazini”
  rationale: Huenda Yosefu anawakilisha Israeli, hasa makabila ya kaskazini, lakini matini yenyewe inadumisha jina hilo. Kulibadilisha kungeondoa mvutano wa kihistoria na kishairi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mistari na nusu-koloni zinaonyesha maombi mawili yanayolingana katika ushairi wa Kiebrania. “Ee” hudhihirisha mwito wa moja kwa moja bila kuongeza fundisho lisilokuwapo katika chanzo.
