  text: כָּסּ֣וּ הָרִ֣ים צִלָּ֑/הּ וַ֝/עֲנָפֶ֗י/הָ אַֽרְזֵי אֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/010.yaml
  text: The mountains were covered by its shade[a], and its branches were like the cedars of God.
translation:
  language: sw
  text: Milima ilifunikwa na kivuli chake, na mierezi ya Mungu[a] ikafunikwa na matawi yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mierezi mikubwa sana” au “mierezi yenye fahari.” Usemi wa Kiebrania “mierezi ya Mungu” unaweza kusisitiza ukubwa au fahari.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּסּוּ
  choice: ilifunikwa / ikafunikwa
  rationale: Kitenzi cha Kiebrania ni Qal timilifu, nafsi ya tatu wingi, chenye maana ya ‘funika.’ Kiswahili hutumia muundo wa kutendwa kwa ufasaha hapa. Katika sehemu ya pili, kitenzi kimerudiwa ili kuonyesha wazi kitenzi kilichoachwa kwa ufupisho katika usambamba wa Kiebrania.
- source_word: הָרִים
  choice: milima
  rationale: Nomino ya wingi yenye maana ya ‘milima’; Kiswahili hakihitaji kibainishi kinacholingana moja kwa moja na הָ־.
- source_word: צִלָּהּ
  choice: kivuli chake
  rationale: צֵל inaweza kumaanisha kivuli au uvuli. ‘Kivuli’ ni neno la kawaida na linafaa kwa picha ya mzabibu ulioenea juu ya milima.
- source_word: וַעֲנָפֶיהָ
  choice: na matawi yake
  rationale: עָנָף humaanisha tawi au matawi makubwa ya mti. ‘Matawi’ ni neno la kawaida, la sasa, na linahifadhi picha ya mmea.
- source_word: אַרְזֵי אֵל
  choice: mierezi ya Mungu
  rationale: Tafsiri hii inahifadhi wazi muundo wa Kiebrania ‘mierezi ya Mungu,’ huku tanbihi ikitaja uwezekano wa usemi huo kumaanisha mierezi mikubwa sana au yenye fahari.
theological_decisions:
- issue: Maana ya אֵל katika usemi אַרְזֵי אֵל
  choice: Kuhifadhi ‘mierezi ya Mungu’ katika matini kuu
  alternative: mierezi mikubwa sana / mierezi yenye fahari
  rationale: Usemi wa Kiebrania unaweza kuwa wa kumhusisha Mungu moja kwa moja au kuwa namna ya kusisitiza ukubwa na fahari. Tafsiri kuu haiamui kimya kimya kati ya maana hizo.
- issue: Uhusiano wa matawi na mierezi katika kishazi cha pili
  choice: ‘mierezi ... ikafunikwa na matawi yake’
  alternative: ‘matawi yake yalikuwa kama mierezi ya Mungu’
  rationale: 'Matini ya Kiebrania haina neno linalomaanisha ‘kama.’ Usambamba unaelekeza kwamba kitenzi ‘yalifunika’ kinadokezwa tena: kivuli chake kilifunika milima, na matawi yake yakafunika mierezi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa usambamba umewekwa wazi kwa kurudia kitenzi katika kishazi cha pili; alama ya tanbihi [a] imo katika matini kuu.
