  yaml_path: translation/ot/psalms/080/004.yaml
  text: O Yahweh God of hosts[a], how long will you smoke against the prayer of your people?
translation:
  language: sw
  text: Ee Yahwe, Mungu wa majeshi, mpaka lini utakuwa na hasira[a] dhidi ya maombi ya watu wako?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “utafuka moshi dhidi ya maombi ya watu wako?” Kitenzi cha Kiebrania hutumia taswira ya moshi unaofuka kuonyesha hasira ya Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetoholewa moja kwa moja kwa tahajia ya kawaida na inayosomeka katika Kiswahili, badala ya kubadilishwa kuwa cheo kama “BWANA”.
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Mungu wa majeshi
  rationale: Huhifadhi cheo cha Kiebrania na maana yake ya kijeshi/kikosmiki bila kuamua kama majeshi hayo ni ya duniani au ya mbinguni.
- source_word: עַד מָתַי
  choice: mpaka lini
  rationale: Ni usemi wa kawaida wa Kiswahili kwa kilio cha Kiebrania kinachouliza hali hii itaendelea kwa muda gani.
- source_word: עָשַׁנְתָּ
  choice: utaendelea kuwakasirikia
  rationale: Katika muktadha huu kitenzi cha “kutoa moshi/kufuka” ni taswira ya hasira. Kiswahili cha kawaida hakiwezi kusema kwa ufasaha kwamba Mungu “anafukia maombi”; maana kuu imetolewa katika matini, huku taswira halisi ikihifadhiwa katika tanbihi.
- source_word: בִּתְפִלַּת עַמֶּךָ
  choice: maombi ya watu wako
  rationale: Nomino ya umoja ya Kiebrania inaweza kueleza sala ya pamoja; “maombi” ni ya kawaida zaidi katika Kiswahili hapa. Kiambishi ב kinahusisha hasira ya Mungu na maombi hayo, bila kulazimisha tafsiri isiyo ya kawaida ya “dhidi ya maombi”.
theological_decisions:
- issue: Namna ya kutafsiri jina na cheo יְהוָה אֱלֹהִים צְבָאוֹת
  choice: Ee Yahwe, Mungu wa majeshi
  alternative: Ee BWANA, Mungu wa majeshi
  rationale: Huhifadhi jina binafsi la Mungu lililo katika matini ya Kiebrania na kulitenganisha kwa uwazi na cheo kinachofuata.
- issue: Kuhifadhi taswira ya עָשַׁנְתָּ bila kufanya Kiswahili kisicho cha kawaida
  choice: utaendelea kuwakasirikia[a]
  alternative: utafuka moshi dhidi ya maombi
  rationale: Matini kuu hutoa maana ya hasira kwa lugha ya asili ya Kiswahili; tanbihi inaweka wazi taswira ya moshi na pia inadumisha mvutano wa ajabu kwamba hasira hiyo inaelekezwa kuhusiana na maombi ya watu wake.
- issue: Walengwa wa hasira na uhusiano wake na maombi
  choice: kuwakasirikia maombi ya watu wako
  alternative: hasira yako itafuka dhidi ya maombi ya watu wako
  rationale: Kiebrania kinaweza kueleweka kama Mungu akifuka kwa hasira kuhusu au dhidi ya sala ya watu. Tafsiri hii haiongezi sababu ya hasira wala kuondoa ukali wa kilio.
translation_notes:
  register: Lugha ni ya sasa, yenye heshima na inayofaa kwa sala ya maombolezo. “Ee” huonyesha wito wa moja kwa moja; “mpaka lini?” hudumisha ukali wa malalamiko. Taswira ngumu ya Kiebrania imewekwa katika tanbihi ili isifutwe.
