  text: A boar from the forest tears it down[b][a], and the wild animals of the field feed on it.
translation:
  language: sw
  text: 'Nguruwe wa msituni huuharibu[a],

    na wanyama wa porini huula[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huutafuna na kuuharibu.” Kitenzi cha Kiebrania ni adimu na kinaeleza ulaji unaoharibu.
    reason: lexical_alternative
  - marker: b
    text: Au, “hujilisha kwa mzabibu huo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְכַרְסְמֶנָּה
  choice: huliharibu
  rationale: Kitenzi hiki adimu kinaeleza kula au kutafuna kunakosababisha uharibifu. “Huliharibu” huwasilisha matokeo makali kwa mzabibu bila kudai kwa uhakika namna hasa ya uharibifu.
- source_word: חֲזִיר
  choice: nguruwe-mwitu
  rationale: Ingawa neno lenyewe linaweza kumaanisha nguruwe, mazingira ya msituni yanaonyesha mnyama wa porini; “nguruwe-mwitu” ni wazi na ya kawaida katika Kiswahili.
- source_word: מִיָּעַר
  choice: kutoka msituni
  rationale: Kihusishi מן kinaonyesha asili au mahali anapotoka; tafsiri hii ni sahihi na ya asili.
- source_word: זִיז שָׂדַי
  choice: wanyama wa porini
  rationale: זִיז ni jina adimu la viumbe vinavyotembea, hasa wanyama, na שָׂדַי huelekeza kwenye uwanda au nyika. “Wanyama wa porini” ni ya kawaida, inaeleweka, na huhifadhi picha ya wanyama wa mwituni.
- source_word: יִרְעֶנָּה
  choice: hulila
  rationale: Kitenzi רעה kinaweza kumaanisha kula malishoni au kujilisha. Kwa kuwa kiambishi cha kike kinarejelea mzabibu, “hulila” huonyesha kwa kawaida kwamba wanyama wanajilisha kwa mzabibu huo.
