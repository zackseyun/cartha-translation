base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/017.yaml
  text: Let your hand be upon the man of your right hand[b][a], upon the son of man whom you have made strong for yourself.
translation:
  language: sw
  text: Mkono wako uwe juu ya mtu wa mkono wako wa kuume[a], juu ya mwana wa binadamu[b] uliyemtia nguvu kwa ajili yako mwenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu aliye upande wako wa kuume.” Nahau ya Kiebrania inaweza kumaanisha mtu aliyependelewa, anayetegemezwa, au aliyewekwa mahali pa heshima na mkono wa kuume wa Mungu.
    reason: lexical_alternative
  - marker: b
    text: “Mwana wa binadamu” hapa inaweza kumaanisha tu “mwanadamu,” ingawa katika muktadha wa Biblia msemo huu unaweza pia kuwa na mwangwi wa kifalme au wa Kimasihi.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּהִי
  choice: na uwe
  rationale: Huwasilisha hali ya ombi au tamanio la kitenzi hicho kwa Kiswahili cha sala kilicho cha asili na chenye hadhi.
- source_word: יָדְךָ
  choice: mkono wako
  rationale: Hudumisha picha halisi ya mkono, inayoweza kumaanisha nguvu, ulinzi, au msaada bila kuifafanua kupita kiasi.
- source_word: עַל
  choice: juu ya
  rationale: Ni tafsiri ya moja kwa moja inayofaa muundo wa kishairi na inaweza kuonyesha mkono wa Mungu ukimjia mtu kwa msaada au nguvu.
- source_word: אִישׁ יְמִינֶךָ
  choice: mtu wa mkono wako wa kuume
  rationale: Hudumisha nahau na utata wa Kiebrania kuhusu mtu anayehusishwa kwa namna ya pekee na mkono wa kuume wa Mungu; maana ya kuwa upande wa kuume imewekwa katika tanbihi.
- source_word: בֶּן אָדָם
  choice: mwana wa Adamu
  rationale: Hudumisha umoja, jinsia ya kisarufi, na mwangwi wa kifasihi wa msemo wa Kiebrania bila kuulazimisha kuwa cheo cha Kimasihi.
- source_word: אִמַּצְתָּ
  choice: uliyemtia nguvu
  rationale: Huonyesha tendo la kisababishi la kumfanya mtu awe imara au mwenye nguvu, huku kishazi rejeshi kikiiunganisha kwa kawaida na mtu aliyetajwa.
- source_word: לָּךְ
  choice: kwa ajili yako mwenyewe
  rationale: Huleta wazi uhusiano wa kusudi au uteuzi kwa Mungu, pamoja na msisitizo wa kiwakilishi unaowezekana.
theological_decisions:
- issue: Iwapo “mtu wa mkono wako wa kuume” na “mwana wa Adamu” yatafsiriwe waziwazi kuwa cheo cha Kimasihi
  choice: Yameachwa kama lugha ya kishairi kuhusu mtu bila herufi kubwa au ufafanuzi wa Kimasihi.
  alternative: Kuyatafsiri moja kwa moja kuwa yanamhusu Masihi, au kuyafanya yamaanishe Israeli kwa ujumla.
  rationale: Muktadha unaweza kueleweka kwa namna ya kifalme, kijumuiya, au ya Kimasihi, lakini Kiebrania cha mstari huu hakilazimishi tafsiri ichague mojawapo. Tafsiri inadumisha mvutano huo.
- issue: Maana ya בֶּן אָדָם
  choice: mwana wa Adamu
  alternative: mwanadamu
  rationale: “Mwanadamu” ni Kiswahili cha kawaida kwa maana ya binadamu, lakini “mwana wa Adamu” huhifadhi kwa karibu zaidi umbo la Kiebrania na mwangwi wake wa kifasihi; tanbihi inaonyesha maana ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa kurudia “juu ya” umehifadhiwa ili kuakisi usambamba wa kishairi wa Kiebrania.
