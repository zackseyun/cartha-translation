  text: אֱלֹהִ֥ים הֲשִׁיבֵ֑/נוּ וְ/הָאֵ֥ר פָּ֝נֶ֗י/ךָ וְ/נִוָּשֵֽׁעָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/003.yaml
  text: God[a], restore us, and make your face shine[c][b], that we may be saved.
translation:
  language: sw
  text: Mungu, uturejeshe[a]; ufanye uso wako uangaze[b], ili tuokolewe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uturudishe” au “utufanye turudi.” Kitenzi cha Kiebrania kinaweza kumaanisha kusababisha mtu arudi.
    reason: lexical_alternative
  - marker: b
    text: Neno kwa neno, “ufanye uso wako uangaze.” Hii ni taswira ya kibali na uwepo wa Mungu; linganisha na lugha ya baraka ya kikuhani katika Hesabu 6:25.
    reason: cross_reference
  - marker: c
    text: Au “nasi tutaokolewa.” Umbo la Kiebrania linaweza kueleweka ama kama ombi la matokeo hayo ama kama kauli yenye uhakika kwamba hayo yatatokea.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hapa neno hili linamtaja Mungu wa Israeli na linatumika katika wito wa moja kwa moja. “Mungu” ni tafsiri ya kawaida na ya asili bila kuongeza kihisishi kisichokuwapo katika Kiebrania.
- source_word: הֲשִׁיבֵנוּ
  choice: uturejeshe
  rationale: Kitenzi cha Hiphil kutoka שוב kina maana ya kusababisha kurudi. “Uturejeshe” kinahifadhi maana pana ya kuwarudisha watu kwa Mungu na kurekebisha hali yao.
- source_word: וְהָאֵר
  choice: ufanye ... uangaze
  rationale: Hiphil ya אור ina nguvu ya kisababishi, yaani kufanya kitu kiangaze. Muundo huu ni wa asili katika Kiswahili na unahifadhi maana hiyo.
- source_word: פָּנֶיךָ
  choice: uso wako
  rationale: Hii ndiyo maana halisi ya neno la Kiebrania. Ingawa taswira inaashiria uwepo na kibali cha Mungu, “uso wako” huihifadhi na pia mwangwi wake wa baraka ya kikuhani.
- source_word: וְנִוָּשֵׁעָה
  choice: ili tuokolewe
  rationale: Umbo la Niphal la nafsi ya kwanza wingi linaweza kueleza matokeo yanayotamaniwa baada ya maombi yaliyotangulia. “Ili tuokolewe” hudumisha sauti ya ombi, huku uwezekano wa kauli yenye uhakika ukielezwa katika tanbihi.
theological_decisions:
- issue: Maana ya hiari/ombi katika kitenzi cha mwisho baada ya amri zilizotangulia
  choice: “ili tuokolewe,” kama matokeo yanayoombwa
  alternative: “nasi tutaokolewa,” kama kauli ya uhakika kuhusu matokeo
  rationale: Mfuatano wa maombi kisha umbo lenye nguvu ya hiari unaunga mkono tafsiri ya kusudi au matokeo yanayotamaniwa. Hata hivyo, Kiebrania kinaweza pia kusikika kama tangazo lenye uhakika, hivyo uwezekano huo haujafichwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri inahifadhi taswira halisi ya “uso” badala ya kuibadili kuwa “uwepo” au “kibali,” na inatumia muundo wa kawaida wa Kiswahili kueleza kisababishi.
