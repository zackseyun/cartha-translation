base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/004.yaml
  text: Restore us[a], God of our salvation, and put away your anger from us.
translation:
  language: sw
  text: Uturejeshe[a], Ee Mungu wa wokovu wetu, na uondoe hasira yako mbali nasi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Utufanye turudi.” Kitenzi cha Kiebrania kina maana ya msingi ya “kusababisha kurudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבֵנוּ
  choice: uturejeshe
  rationale: Kauli ya kuamuru ya Hifili yenye kiambishi cha nafsi ya kwanza wingi ina maana ya ‘utusababishe turudi.’ ‘Uturejeshe’ ni ya asili katika Kiswahili na katika muktadha inaomba Mungu awarejeshee watu wake kibali na hali njema, bila kuifupisha maana kuwa toba ya ndani pekee.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: Mungu wa wokovu wetu
  rationale: Huhifadhi muundo wa kutegemeana wa Kiebrania na kusisitiza kwamba wokovu au ukombozi wetu unatoka kwa Mungu.
- source_word: וְהָפֵר
  choice: uiondoe
  rationale: Hifili ya פרר inaweza kumaanisha kubatilisha, kuvunja, au kukomesha. Ikiwa ‘hasira’ ndiyo yambwa, ‘uiondoe’ ni Kiswahili cha kawaida kinachoonyesha ombi la kuikomesha au kuiondoa.
- source_word: כַּעַסְךָ
  choice: hasira yako
  rationale: Hili ndilo neno la kawaida, wazi, na lenye hadhi kwa כַּעַס katika ombi linaloelekezwa kwa Mungu.
- source_word: עִמָּנוּ
  choice: kwetu
  rationale: Ingawa עִם kwa kawaida ni ‘pamoja na,’ baada ya kitenzi cha kuondoa hasira, ‘kwetu’ huwasilisha kwa njia ya asili hasira iliyoelekezwa kwa watu na kuombwa iondolewe, bila kuongeza waziwazi neno ‘dhidi’ lisilokuwamo katika Kiebrania.
theological_decisions:
- issue: Iwapo ombi la kwanza litafsiriwe kuwa wongofu wa kimaadili au urejesho wa watu katika kibali cha Mungu
  choice: uturejeshe
  alternative: uturudishe kwako
  rationale: Muktadha wa zaburi unaomba kufanywa upya kwa kibali baada ya ghadhabu. ‘Uturejeshe’ huhifadhi hatua ya Mungu na upana wa ombi, huku tanbihi ikidokeza maana halisi zaidi ya kusababisha kurudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ee’ limetumiwa kuonyesha mwito wa moja kwa moja ulio dhahiri katika muundo wa Kiebrania. Mpangilio ni wa asili kwa Kiswahili huku ukihifadhi ulinganifu wa sehemu mbili za mstari.
