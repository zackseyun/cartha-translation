review_pass:
  verdict: revise
  source_fidelity: ‘Uturejeshe’ appropriately renders the Hiphil imperative שׁוּבֵנוּ in its contextual sense of restoration, and ‘Mungu wa wokovu wetu’ accurately preserves the construct phrase. The second clause correctly treats God’s anger as the object to be removed; ‘mbali nasi’ clearly expresses its removal from the people without making ‘against us’ explicit.
  naturalness: The draft’s ‘uiondoe hasira yako kwetu’ is less idiomatic and can be syntactically awkward because the object concord precedes the overt object noun. ‘Uondoe hasira yako mbali nasi’ is clear, natural Standard East African Swahili and retains the verse’s elevated prayer register.
  terminology: ‘Wokovu,’ ‘hasira,’ and the vocative ‘Ee Mungu’ are suitable, established biblical Kiswahili. The footnote’s proposed alternative ‘uturudishe kwako’ adds ‘kwako,’ which is not expressed in the Hebrew and should not be retained.
  issues:
  - severity: medium
    issue: The footnote alternative introduces ‘kwako’ (‘to you’).
    rationale: The Hebrew Hiphil of שוב means ‘cause us to return/turn back,’ but the destination is unstated. Adding ‘kwako’ narrows and supplements the source wording.
  - severity: low
    issue: The wording ‘uiondoe hasira yako kwetu’ is stylistically awkward.
    rationale: The object marker together with the following explicit object is less smooth here, and ‘kwetu’ after ‘ondoa’ is less immediately clear than an idiomatic expression of removal.
  revised_text: Uturejeshe[a], Ee Mungu wa wokovu wetu, na uondoe hasira yako mbali nasi.
  revised_footnotes:
  - marker: a
    text: Au, “Utufanye turudi.” Kitenzi cha Kiebrania kina maana ya msingi ya “kusababisha kurudi.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the contextual rendering ‘Uturejeshe’ while giving a source-faithful alternative that does not supply an unstated destination. It also improves the naturalness and clarity of the plea for God’s anger to be removed from the people.
