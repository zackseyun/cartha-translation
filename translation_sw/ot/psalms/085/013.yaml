  text: Haki itatangulia mbele yake, na kuandaa njia kwa ajili ya hatua zake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa karibu: “na kuzifanya hatua zake kuwa njia.” Muundo wa Kiebrania unaweza pia kueleweka kwa njia hii.'
    reason: 'Kishazi וְיָשֵׂם לְדֶרֶךְ פְּעָמָיו kina sintaksia yenye utata: kinaweza kueleweka kuwa njia inaandaliwa kwa ajili ya hatua zake, au—kwa karibu zaidi—kuwa hatua zake zinawekwa kuwa njia. Tanbihi huhifadhi uwezekano huo bila kuubana.'
lexical_decisions:
- source_word: צֶדֶק (tsedeq)
  choice: Haki
  rationale: Neno hili linaonyesha uadilifu au hali ya kuwa sawa; “haki” ni neno la kawaida, lenye hadhi, na linaendeleza taswira ya sifa ya Mungu ikitangulia mbele yake.
- source_word: לְפָנָיו יְהַלֵּךְ (lefanaw yehallēkh)
  choice: itatangulia mbele yake
  rationale: Tafsiri hii inahifadhi mwendo wa kwenda mbele ya mtu unaoelezwa na Kiebrania, kwa Kiswahili cha kawaida na wazi.
- source_word: וְיָשֵׂם לְדֶרֶךְ פְּעָמָיו (weyasēm lederekh pe‘amaw)
  choice: na kuzifanya hatua zake kuwa njia
  rationale: Muundo huu unafuata kwa karibu uwezekano wa kusoma לְדֶרֶךְ kama ‘kuwa njia,’ huku פְּעָמָיו ikiwa ‘hatua zake.’ Kwa kuwa muundo wa Kiebrania unaweza pia kueleweka kuwa haki inaandaa njia kwa hatua zake, tofauti hiyo imeonyeshwa katika tanbihi.
theological_decisions:
- issue: Je, ‘haki’ ndiyo mtendaji wa vitenzi vyote viwili?
  choice: Haki inaeleweka kuwa ndiyo inayotangulia na kuzifanya hatua zake kuwa njia.
  alternative: Kishazi cha pili kinaweza kueleweka kwa namna isiyomtaji wazi mtendaji, au kama kinachoeleza kuandaliwa kwa njia ya hatua zake.
  rationale: Kiebrania hakitaji kiima kipya, kwa hiyo mwendelezo wa kawaida unaiweka צֶדֶק (‘haki’) kuwa kiima cha vitenzi vyote viwili. Tafsiri haiongezi mhusika mwingine wala kuamua kwa upana zaidi maana ya kitheolojia ya taswira hiyo.
