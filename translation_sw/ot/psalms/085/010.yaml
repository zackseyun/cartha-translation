  text: חֶֽסֶד וֶ/אֱמֶ֥ת נִפְגָּ֑שׁוּ צֶ֖דֶק וְ/שָׁל֣וֹם נָשָֽׁקוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/010.yaml
  text: Steadfast love and truth have met[b][a]; righteousness and peace have kissed.
translation:
  language: sw
  text: Upendo thabiti na kweli[a] zimekutana; haki[b] na amani zimebusiana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uaminifu” badala ya “kweli” (אֱמֶת).
    reason: lexical_alternative
  - marker: b
    text: Neno “haki” (צֶדֶק) hapa linaweza pia kusisitiza uadilifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: upendo thabiti
  rationale: Neno hili hudokeza upendo wa kudumu na wa uaminifu katika uhusiano; “upendo thabiti” ni Kiswahili cha kawaida kinachohifadhi uzito huo kuliko “rehema” pekee.
- source_word: אֱמֶת
  choice: kweli
  rationale: Neno linaweza kumaanisha kweli, uaminifu, au kutegemeka. “Kweli” huhifadhi upana wa maana bila kuamua kimya-kimya kuwa hapa ni uaminifu pekee; uwezekano huo umetajwa katika tanbihi.
- source_word: נִפְגָּשׁוּ
  choice: zimekutana
  rationale: Kitenzi kinaeleza kukutana; hali timilifu ya Kiswahili inafaa tendo la kishairi lililoelezwa kama lililotokea.
- source_word: צֶדֶק
  choice: haki
  rationale: “Haki” katika Kiswahili hubeba maana za uadilifu na haki ya kimaadili, na ni ya kawaida zaidi hapa kuliko nomino nzito kama “uhesabikaji kuwa mwadilifu.”
- source_word: שָׁלוֹם
  choice: amani
  rationale: “Amani” ndiyo tafsiri ya kawaida na inayoeleweka, huku muktadha ukiruhusu mwangwi mpana wa ustawi na ukamilifu.
- source_word: נָשָׁקוּ
  choice: zimebusiana
  rationale: Taswira halisi ya kubusu imehifadhiwa. Umbo la kutendeana linaonyesha kwa kawaida kwamba sifa hizi mbili zilizofanywa kama watu zinabusiana.
theological_decisions:
- issue: Kufanywa kama watu kwa sifa za agano na maadili
  choice: 'Kuhifadhi taswira ya kishairi moja kwa moja: “zimekutana” na “zimebusiana”'
  alternative: Kufafanua kuwa “zimeungana kwa upatano” au “zimepatanishwa”
  rationale: Kiebrania huzionyesha sifa hizi kama watendaji. Kuhifadhi taswira huepuka kuingiza hitimisho la kimafundisho ambalo mstari wenyewe halisemi wazi.
- issue: Upana wa maana ya אֱמֶת
  choice: “kweli,” huku “uaminifu” ukihifadhiwa katika tanbihi
  alternative: “uaminifu” katika matini kuu
  rationale: Muktadha pamoja na חֶסֶד unaweza kuunga mkono “uaminifu,” lakini “kweli” ni maana halali na huhifadhi utata wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa vifungu sambamba na uhuishaji wa sifa umehifadhiwa. Viambishi vya ngeli ya 10 (“zime-”) vinaafikiana na jozi za nomino zilizounganishwa.
