id: PSA.85.12
reference: Psalms 85:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: גַּם יְ֭הוָה יִתֵּ֣ן הַ/טּ֑וֹב וְ֝/אַרְצֵ֗/נוּ תִּתֵּ֥ן יְבוּלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/012.yaml
  text: Indeed[a], Yahweh will give what is good, and our land will yield its produce.
translation:
  language: sw
  text: Naam[a], Yahweh atatoa yaliyo mema, na nchi yetu itatoa mazao yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Pia,” “Hakika,” au “Ndiyo.” Neno la Kiebrania linaweza kuonyesha nyongeza au kusisitiza uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Naam
  rationale: Katika muktadha huu wa kishairi, neno hili lina nguvu ya kusisitiza uhakika wa ahadi; “Naam” ni la asili na lenye hadhi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu katika Kiebrania limetafsiriwa kwa kulinakili moja kwa moja badala ya kulibadili kuwa cheo.
- source_word: יִתֵּן
  choice: atatoa
  rationale: Kauli isiyotimilika hapa inaelekea kwa tendo linalotarajiwa wakati ujao katika muktadha wa baraka.
- source_word: הַטּוֹב
  choice: yaliyo mema
  rationale: Usemi huu mpana unaweza kumaanisha mema kwa ujumla au vitu vizuri; tafsiri hii haubanwi kwa baraka za kimwili pekee.
- source_word: וְאַרְצֵנוּ
  choice: na nchi yetu
  rationale: אֶרֶץ hapa ni ardhi au nchi ya watu inayotoa mazao; “nchi yetu” ni ya kawaida na inaendana na muktadha.
- source_word: תִּתֵּן
  choice: itatoa
  rationale: Kitenzi ni “kutoa”; pamoja na nchi na mazao, “itatoa” ni wazi, cha asili, na kinadumisha mwangwi wa kitenzi kilekile kilichotumiwa kuhusu Yahweh.
- source_word: יְבוּלָהּ
  choice: mazao yake
  rationale: Neno hili humaanisha mazao au mavuno ya nchi; “mazao yake” ni pana na la kawaida katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano, YHWH; “Yahweh” huhifadhi jina hilo badala ya kulibadili kuwa cheo.
- issue: Upana wa maana ya הַטּוֹב
  choice: yaliyo mema
  alternative: mema hayo / vitu vyema
  rationale: Tafsiri iliyochaguliwa huhifadhi uwezekano wa mema ya kimaadili na ya kimwili bila kuamua kimya-kimya kuwa ni mazao au mali pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unahifadhi usambamba wa kishairi na urudiaji wa kitenzi “kutoa” katika mistari yote miwili.
