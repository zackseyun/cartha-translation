  text: נָ֭שָׂאתָ עֲוֺ֣ן עַמֶּ֑/ךָ כִּסִּ֖יתָ כָל חַטָּאתָ֣/ם סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/002.yaml
  text: You forgave the iniquity of your people[a]; you covered all their sin[b]. Selah
translation:
  language: sw
  text: Ulisamehe uovu wa watu wako[a]; ulifunika dhambi yao yote[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “Uliubeba” au “Uliuchukua uovu wa watu wako.” Nahau ya Kiebrania huonyesha msamaha kwa taswira ya kuinua au kuondoa uovu na hatia.
    reason: lexical_alternative
  - marker: b
    text: Au, “dhambi zao zote.” Kiebrania hutumia nomino ya umoja yenye kiambishi kinachowarejelea watu wengi; inaweza kutafsiriwa kijumla kuwa “dhambi yao” au kwa wingi kuwa “dhambi zao.”
    reason: alternative_reading
lexical_decisions:
- source_word: נָשָׂאתָ
  choice: ulisamehe
  rationale: Kitenzi נָשׂא kwa msingi humaanisha kuinua, kubeba, au kuchukua; kinapotumiwa pamoja na עָוֹן ni nahau ya kuondoa hatia, yaani kusamehe. “Ulisamehe” huwasilisha maana ya nahau hiyo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi taswira ya Kiebrania.
- source_word: עֲוֺן
  choice: uovu
  rationale: עָוֹן inaweza kumaanisha uovu, hatia, au matokeo ya uovu. “Uovu” hapa huhifadhi uzito wa kimaadili na kuitofautisha kwa kiasi na חַטָּאת katika mshororo unaofuata.
- source_word: עַמֶּךָ
  choice: watu wako
  rationale: עַם humaanisha watu kama jumuiya, na kiambishi kinaonyesha uhusiano wao na Mungu. “Watu wako” ni usemi wa asili na ulio wazi katika Kiswahili.
- source_word: כִּסִּיתָ
  choice: ulifunika
  rationale: כסה humaanisha kufunika. Tafsiri hii huhifadhi sitiari ya Kiebrania na dokezo lake la msamaha bila kuibadili kuwa maelezo ya moja kwa moja.
- source_word: כָל
  choice: yote
  rationale: כָל humaanisha yote au kila. Kwa kuwa “dhambi” imetafsiriwa kama nomino ya umoja yenye maana ya kijumla, “yote” inapatana nayo kisarufi.
- source_word: חַטָּאתָם
  choice: dhambi yao
  rationale: חַטָּאת hapa humaanisha dhambi, si sadaka ya dhambi, kwa sababu ya ulinganifu wake na עָוֹן na muktadha wa msamaha. Kiebrania kina nomino ya umoja yenye kiambishi cha wingi; “dhambi yao” huhifadhi umoja huo kwa maana ya kijumla.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya סֶלָה haijulikani kwa uhakika. Neno limetoholewa badala ya kupewa maana ya kimfasiri kama “pumziko” au “kiitikio.”
theological_decisions:
- issue: Jinsi ya kutafsiri nahau נָשָׂא עָוֹן
  choice: Ulisamehe uovu wa watu wako
  alternative: Uliubeba uovu wa watu wako; Uliuchukua uovu wa watu wako; Uliiondoa hatia ya watu wako
  rationale: Katika muktadha huu nahau inaeleza kusamehe au kuondoa hatia. “Ulisamehe” hutoa maana iliyo wazi kwa msomaji wa sasa, lakini tanbihi huhifadhi taswira ya kuinua au kubeba iliyo katika Kiebrania bila kuamua zaidi ya maandishi.
- issue: Umoja au wingi wa חַטָּאתָם
  choice: dhambi yao yote
  alternative: dhambi zao zote
  rationale: Nomino ya Kiebrania iko katika umoja lakini ina kiambishi kinachowarejelea watu wengi, hivyo inaweza kueleweka kijumla au kusambazwa kwa dhambi mbalimbali. Umoja umehifadhiwa katika matini, na wingi umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Muundo wa mistari miwili, sitiari ya “kufunika,” na neno “Sela” vimehifadhiwa.
