source:
  edition: WLC
  text: אָסַ֥פְתָּ כָל עֶבְרָתֶ֑/ךָ הֱ֝שִׁיב֗וֹתָ מֵ/חֲר֥וֹן אַפֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/003.yaml
  text: You withdrew all your wrath[a]; you turned back from the burning of your anger.
translation:
  language: sw
  text: Uliiondoa ghadhabu yako yote[a]; ukageuka kutoka katika ukali wa hasira yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uliikusanya ghadhabu yako yote; ukaacha hasira yako iwakayo.”
    reason: Mbadala huu huonyesha maana halisi zaidi ya אסף, “kukusanya,” na taswira ya joto katika חָרוֹן.
lexical_decisions:
- source_word: אָסַפְתָּ
  choice: uliiondoa
  rationale: Katika muktadha huu אסף ina maana ya kukusanya na kuondoa; “uliiondoa” ni Kiswahili cha kawaida kinachoonyesha kwamba Mungu aliizuia au akaiondoa ghadhabu yake.
- source_word: כָל
  choice: yote
  rationale: 'Huhifadhi wazo la ukamilifu: ghadhabu yote.'
- source_word: עֶבְרָתֶךָ
  choice: ghadhabu yako
  rationale: עֶבְרָה ni hasira kali au ghadhabu; “ghadhabu” hudumisha uzito na hadhi ya lugha ya zaburi.
- source_word: הֱשִׁיבוֹתָ
  choice: ukageuka kutoka
  rationale: Hifili ya שוב pamoja na מן huonyesha kugeuka au kurudi kutoka katika jambo fulani; tafsiri hii huhifadhi taswira ya mwendo bila kuifasiri kuwa toba ya kihisia.
- source_word: מֵחֲרוֹן
  choice: kutoka katika ukali
  rationale: חָרוֹן hutokana na taswira ya joto linalowaka na, katika usemi huu, huonyesha nguvu au ukali wa hasira. “Ukali” ni wa asili katika Kiswahili, huku mbadala katika tanbihi ukihifadhi taswira ya kuwaka.
- source_word: אַפֶּךָ
  choice: hasira yako
  rationale: Ingawa אַף maana yake ya msingi ni pua, hapa ni nahau ya hasira; “hasira yako” ndiyo tafsiri ya kawaida na wazi.
theological_decisions:
- issue: Namna ya kutafsiri lugha ya kibinadamu kuhusu hasira ya Mungu
  choice: Kudumisha uzito na ukali wa ghadhabu ya Mungu bila kuifanya kauli kuwa ya kinadharia tu.
  alternative: Uliiondoa ghadhabu yako yote; ukaacha hasira yako iwakayo.
  rationale: Kiebrania kinatumia lugha hai ya ghadhabu na joto. Matini kuu inatumia Kiswahili cha kawaida, na tanbihi inahifadhi wazi zaidi taswira ya kuwaka bila kupunguza wazo la hukumu ya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo sambamba wa mistari miwili umehifadhiwa.
