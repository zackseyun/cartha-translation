  text: רָצִ֣יתָ יְהוָ֣ה אַרְצֶ֑/ךָ שַׁ֝֗בְתָּ שבות יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/001.yaml
  text: You have shown favor to your land[a], O Yahweh; you restored the fortunes of Jacob.
translation:
  language: sw
  text: Ee Yahwe, umeionyesha nchi yako fadhili; umeirejesha hali njema ya Yakobo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umewarejesha mateka wa Yakobo,” au “umeurudisha utekwaji wa Yakobo.” Usemi wa Kiebrania unaweza kumaanisha kurudishwa kutoka uhamishoni au kugeuzwa kwa hali kwa upana zaidi.
    reason: alternative_reading
lexical_decisions:
- source_word: רָצִיתָ
  choice: umeionyesha ... fadhili
  rationale: Kitenzi רצה katika Qal hapa kinaeleza kumridhia au kumwonyesha mtu au kitu fadhili. Muundo huu ni wa kawaida katika Kiswahili na unaonyesha tendo la Yahwe kwa nchi yake.
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe” badala ya kubadilishwa na cheo; “Ee” linaonyesha usemi wa moja kwa moja.
- source_word: אַרְצֶךָ
  choice: nchi yako
  rationale: אֶרֶץ hapa ni nchi iliyo katika uhusiano wa agano na Mungu, yaelekea nchi ya Israeli. “Nchi yako” ni ya asili na haileti dhana finyu ya kisiasa.
- source_word: שַׁבְתָּ
  choice: umeirejeshea
  rationale: Pamoja na שבות, שוב huunda usemi unaomaanisha kurejesha hali au kuwarudisha waliotekwa. “Umeirejeshea” huwasilisha kwa uwazi wazo la urejesho.
- source_word: שבות
  choice: hali yake njema
  rationale: Usemi שׁוּב שְׁבוּת unaweza kumaanisha kugeuzwa kwa hali na kurejeshwa kwa mafanikio kwa upana, si kurudi kutoka utumwani pekee. Kiswahili “hali yake njema” ni cha kawaida zaidi kuliko tafsiri ya neno kwa neno ya ‘bahati,’ huku uwezekano wa mateka au uhamisho ukihifadhiwa katika tanbihi.
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Jina limetoholewa moja kwa moja. Katika ushairi huu “Yakobo” linawakilisha kwa pamoja watu wa Israeli bila kulibadilisha kimafasiri kuwa “Israeli.”
theological_decisions:
- issue: Maana ya usemi שׁוּב שְׁבוּת יַעֲקֹב
  choice: umeirejeshea Yakobo hali yake njema
  alternative: umewaleta tena mateka wa Yakobo / umeugeuza utumwa wa Yakobo
  rationale: Usemi wa Kiebrania unaweza kueleza kugeuzwa kwa hali kwa ujumla au kurudi kutoka utekwani au uhamishoni. Tafsiri kuu inahifadhi maana pana, na tanbihi inatunza uwezekano unaohusiana na mateka bila kuamua mvutano huo kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi umeweka mwito “Ee Yahwe” mwanzoni kwa mtiririko wa asili wa Kiswahili, bila kubadili maana.
