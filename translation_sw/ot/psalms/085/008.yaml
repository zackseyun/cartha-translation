base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/008.yaml
  text: I will hear what God Yahweh will speak[a], for he will speak peace to his people and to his faithful ones[b]; but let them not turn back to folly.
translation:
  language: sw
  text: Nitasikiliza yale atakayosema Mungu Yahweh[a], kwa maana atasema amani kwa watu wake na kwa waaminifu wake; lakini wasirudie upumbavu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nitasikia yale Mungu Yahweh atakayosema.”
    reason: Kitenzi cha Kiebrania kinaweza kutafsiriwa “kusikia” au “kusikiliza,” na umbo la kitenzi cha kusema huelekea kile ambacho Mungu atakachosema.
  - marker: b
    text: Au, “wasirudi kwenye ujinga.” Tafsiri nyingine isiyo na uwezekano mkubwa huelewa neno la mwisho kuwa “kujiamini.”
    reason: Neno la Kiebrania kwa kawaida humaanisha upumbavu au ujinga, ingawa limehusishwa pia na maana ya kujiamini.
lexical_decisions:
- source_word: אֶשְׁמְעָה
  choice: Nitasikiliza
  rationale: Hali ya kohortativi huonyesha azimio la msemaji; “Nitasikiliza” ni ya asili kwa Kiswahili na huonyesha usikivu wa makusudi.
- source_word: מַה יְדַבֵּר
  choice: asemalo
  rationale: Huwasilisha jambo ambalo Mungu yuko karibu kulisema kwa Kiswahili fasaha, bila kupoteza wazo la kusikiliza ujumbe wake.
- source_word: הָאֵל יְהוָה
  choice: Mungu, Yahweh
  rationale: Huhifadhi אֵל pamoja na jina la Mungu יהוה bila kuziunganisha kana kwamba ni cheo kimoja.
- source_word: כִּי
  choice: kwa maana
  rationale: 'Huonyesha sababu ya mtunga zaburi kusikiliza: Mungu atasema amani.'
- source_word: שָׁלוֹם
  choice: amani
  rationale: Ni tafsiri ya kawaida yenye upana wa maana unaoweza kujumuisha hali njema, usalama na urejesho.
- source_word: עַמּוֹ
  choice: watu wake
  rationale: Huwakilisha kwa uwazi nomino ya pamoja pamoja na kiambishi cha umilikaji.
- source_word: חֲסִידָיו
  choice: waaminifu wake
  rationale: Hueleza watu wenye uaminifu na uchaji katika uhusiano wao wa agano, bila kuingiza maana finyu ya kitaasisi.
- source_word: וְאַל יָשׁוּבוּ
  choice: lakini wasirudie
  rationale: אַל pamoja na kitenzi kisichotimilika ina nguvu ya katazo au himizo; “wasirudie” huhifadhi nguvu hiyo.
- source_word: לְכִסְלָה
  choice: upumbavu
  rationale: Maana ya kawaida ya כִּסְלָה hapa ni mwenendo wa kipumbavu; tafsiri hii inafaa onyo la kutorudia hali ya zamani.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Huhifadhi jina la agano lililo katika maandishi ya Kiebrania badala ya kulibadili kuwa cheo.
- issue: Maana ya חֲסִידָיו
  choice: waaminifu wake
  alternative: watakatifu wake / wachamungu wake
  rationale: “Waaminifu wake” huhifadhi dhana ya uaminifu wa kiuhusiano na kimaadili bila kuingiza maana maalumu ya baadaye ya neno “watakatifu.”
- issue: Nguvu ya kishazi cha mwisho
  choice: 'katazo/himizo: “lakini wasirudie upumbavu”'
  alternative: 'taarifa: “na hawatarudia upumbavu”'
  rationale: 'אַל pamoja na umbo la kitenzi husisitiza katazo au ombi, hivyo huacha mvutano wa maandishi: Mungu anasema amani, lakini watu wake wanaonywa wasirudi nyuma.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa sasa. “Nitasikiliza” na “wasirudie” ni rahisi kueleweka; “Yahweh” huhifadhi jina la Mungu. Alama zote za tanbihi zimewekwa katika matini kuu.
