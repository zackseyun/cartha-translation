lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza muziki
  rationale: Katika vichwa vya zaburi, neno hili humtaja anayesimamia au kuongoza utekelezaji wa muziki. “Mwongoza muziki” ni Kiswahili cha sasa, wazi na chenye hadhi; “kwa” linawakilisha kiambishi ל bila kulazimisha maana moja tu.
- source_word: לִבְנֵי
  choice: Ya wana wa
  rationale: Kiambishi ל kinaweza kuonyesha umiliki, uhusiano, utunzi au kuwekwa wakfu. “Ya wana wa” ni usemi wa kawaida katika kichwa cha zaburi na hudumisha kiasi cha utata huo.
- source_word: קֹרַח
  choice: Kora
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ni neno la kawaida la Kiswahili kwa aina hii ya wimbo wa ibada unaohusishwa na muziki.
