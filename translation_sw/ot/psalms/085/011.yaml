  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֱ֭מֶת מֵ/אֶ֣רֶץ תִּצְמָ֑ח וְ֝/צֶ֗דֶק מִ/שָּׁמַ֥יִם נִשְׁקָֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/011.yaml
  text: Truth will spring up from the earth[b][a], and righteousness will look down from heaven.
translation:
  language: sw
  text: Ukweli[a] utachipuka kutoka ardhini, nayo haki[b] itatazama chini kutoka mbinguni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uaminifu utachipuka kutoka ardhini.”
    reason: lexical_alternative
  - marker: b
    text: Au, “uadilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֶת
  choice: Ukweli
  rationale: Neno hili linaweza kumaanisha ukweli, uaminifu, au hali ya kutegemeka. “Ukweli” linahifadhi sifa dhahania inayooanishwa kishairi na haki, huku “uaminifu” ukihifadhiwa katika tanbihi.
- source_word: מֵאֶרֶץ
  choice: kutoka ardhini
  rationale: אֶרֶץ linaweza kuwa “ardhi” au “nchi.” Picha ya kuchipuka na ulinganifu wa chini na juu unaoundwa na “kutoka mbinguni” unapendelea “ardhini”; pia Kiswahili hiki kinadumisha picha ya mmea unaotoka katika udongo.
- source_word: תִּצְמָח
  choice: utachipuka
  rationale: Kitenzi hiki hueleza mmea kuchipua au kuota. “Utachipuka” ni cha kawaida, hai, na kinahifadhi sitiari ya ukuaji.
- source_word: צֶדֶק
  choice: haki
  rationale: צֶדֶק linaweza kueleza uadilifu au haki katika maana ya kutenda kwa usawa. “Haki” ni neno la kawaida na lenye upana unaofaa katika Kiswahili; “uadilifu” umetajwa katika tanbihi ili kutohitimisha maana upande mmoja tu.
- source_word: מִשָּׁמַיִם
  choice: kutoka mbinguni
  rationale: “Mbinguni” ni usemi wa kawaida wa Kiswahili na unahifadhi mlingano wa kishairi kati ya ardhi na mbingu.
- source_word: נִשְׁקָף
  choice: itatazama chini
  rationale: Niphal ya שׁקף huonyesha kutazama kutoka mahali pa juu au nje. “Itatazama chini” inahifadhi mwelekeo huo pamoja na taswira ya haki kupewa sifa ya kibinadamu.
theological_decisions:
- issue: Maana ya צֶדֶק katika jozi ya kishairi yenye uzito wa kimaadili
  choice: haki
  alternative: uadilifu
  rationale: Kiebrania kinaruhusu maana za uadilifu wa kimaadili na haki inayotendwa kwa usawa. Neno “haki” linaweza kubeba pande hizo katika Kiswahili, na tanbihi inaonyesha wazi uwezekano wa “uadilifu” bila kuondoa mvutano wa kimaana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa mistari ya Kiebrania umehifadhiwa kwa ulinganifu wa “kutoka ardhini” na “kutoka mbinguni,” huku vitenzi vya picha—“utachipuka” na “itatazama chini”—vikibaki wazi kwa msomaji wa kawaida.
