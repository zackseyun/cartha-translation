base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/007.yaml
  text: Show us your steadfast love[a], O Yahweh, and grant us your salvation.
translation:
  language: sw
  text: 'Ee Yahwe, utuonyeshe upendo wako mwaminifu[a],

    na utupe wokovu wako.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: utufanye tuuone upendo wako mwaminifu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְאֵנוּ
  choice: utuonyeshe
  rationale: Hii ni kauli ya ombi ya kitenzi ראה katika muundo wa Hifili, ikiwa na kiambishi cha nafsi ya kwanza wingi. “Utuonyeshe” ni Kiswahili cha kawaida kinachohifadhi maana ya “utufanye tuone” bila kuwa kizito.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi, badala ya kubadilishwa kuwa cheo kama “BWANA.” Tahajia “Yahwe” inafaa matamshi na uandishi wa Kiswahili.
- source_word: חַסְדֶּךָ
  choice: upendo wako mwaminifu
  rationale: חסד hapa inaeleza upendo wenye uaminifu, fadhili, na mshikamano wa kudumu. “Upendo wako mwaminifu” ni usemi wa sasa na unaoeleweka unaohifadhi kipengele cha uaminifu bila kuufanya msemo huo kuwa istilahi ya kimadhehebu.
- source_word: וְיֶשְׁעֲךָ
  choice: na ... wokovu wako
  rationale: Nomino ישע inaweza kumaanisha wokovu au ukombozi. “Wokovu” inahifadhi upana wa tendo la Mungu la kuokoa katika ombi hili.
- source_word: תִּתֶּן לָנוּ
  choice: utupe
  rationale: Kifungu hiki kwa msingi ni “utupe/sisi.” “Utupe” ni ombi la heshima, la moja kwa moja, na la kawaida katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. Kulitohowa kama “Yahwe” kunahifadhi tofauti kati ya jina hilo na cheo, bila kuingiza badala ya mapokeo katika maandishi.
- issue: Upeo wa maana ya חסד
  choice: upendo wako mwaminifu
  alternative: fadhili zako; rehema zako; upendo wako wa kudumu
  rationale: Neno hili linajumuisha upendo, wema, na uaminifu wa kudumu. Uchaguzi huu haupunguzi maana yake kuwa hisia pekee wala kuifunga waziwazi kwa tafsiri maalumu ya kiteolojia.
translation_notes:
  register: Lugha ni ya sala, yenye heshima lakini ya kawaida kwa wasomaji wa Kiswahili cha Afrika Mashariki. Muundo wa mistari miwili unaakisi vifungu viwili vya Kiebrania. Kihisishi “Ee” kinaonyesha mwito wa moja kwa moja kwa Yahwe bila kuongeza wazo jipya.
