  text: אַ֤ךְ קָר֣וֹב לִ/ירֵאָ֣י/ו יִשְׁע֑/וֹ לִ/שְׁכֹּ֖ן כָּב֣וֹד בְּ/אַרְצֵֽ/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/009.yaml
  text: Surely his salvation is near to those who fear him[b][a], so that glory may dwell in our land.
translation:
  language: sw
  text: Hakika, wokovu wake uko karibu na wanaomcha, ili utukufu ukae katika nchi yetu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Utukufu” unaweza kumaanisha uwepo wa Mungu unaodhihirika, au heshima inayorejeshwa katika nchi.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Hakika
  rationale: Chembe hii inasisitiza uthibitisho; “Hakika” ni ya asili na yenye hadhi katika Kiswahili.
- source_word: קָרוֹב
  choice: uko karibu
  rationale: Hutoa maana ya ukaribu kwa njia ya moja kwa moja na ya kawaida.
- source_word: לִירֵאָיו
  choice: wanaomcha
  rationale: Huhifadhi maana ya kumcha Mungu, ambayo inajumuisha hofu yenye heshima na utii, bila kuipunguza kuwa heshima tu.
- source_word: יִשְׁעוֹ
  choice: wokovu wake
  rationale: Huhifadhi maana pana ya kuokoa au kukomboa pamoja na uhusiano wa umilikaji katika Kiebrania.
- source_word: לִשְׁכֹּן
  choice: ili ... ukae
  rationale: Muundo huu unaonyesha kusudi au matokeo yanayokusudiwa na unasikika kwa kawaida katika Kiswahili.
- source_word: כָּבוֹד
  choice: utukufu
  rationale: Huhifadhi uzito wa kishairi na kitheolojia bila kuamua ikiwa ni uwepo wa Mungu unaodhihirika au heshima inayorejeshwa.
- source_word: בְּאַרְצֵנוּ
  choice: katika nchi yetu
  rationale: Katika muktadha huu אֶרֶץ ni nchi ya watu, si dunia nzima.
theological_decisions:
- issue: Mrejeleo wa כָּבוֹד (utukufu)
  choice: Neno limetafsiriwa kwa upana kuwa “utukufu” bila kutaja mrejeleo wake kwa ufasaha zaidi.
  alternative: Uwepo wa Mungu wenye utukufu ukae nchini, au heshima irejeshwe nchini.
  rationale: Kiebrania kinaacha mrejeleo ukiwa wa kuvutia na wenye uwezekano zaidi ya mmoja; tafsiri haipaswi kuondoa mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi, lugha ya sasa, na hadhi inayofaa maandiko. Alama [a] imewekwa baada ya kishazi kinachohusiana na “utukufu” ili kuepuka kuhusishwa kimakosa na “wanaomcha.”
