  text: הֲֽ/לֹא אַ֭תָּה תָּשׁ֣וּב תְּחַיֵּ֑/נוּ וְ֝/עַמְּ/ךָ֗ יִשְׂמְחוּ בָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/006.yaml
  text: Will you not return and revive us[b][a], so that your people may rejoice in you?
translation:
  language: sw
  text: Je, hutarudi[a] na kutuhuisha[b], ili watu wako wakufurahie?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘hutageuka tena.’ Kitenzi cha Kiebrania kinaweza kumaanisha kurudi au kugeuka tena; hapa huenda kinamaanisha Mungu kuwageukia tena watu wake kwa fadhili.
    reason: lexical_alternative
  - marker: b
    text: Au ‘kutufanya tuishi tena’ au ‘kuturudishia uhai.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, huta...
  rationale: Muundo huu unahifadhi swali la balagha linalotarajia jibu la kukubali na kuonyesha ombi lenye tumaini.
- source_word: תָּשׁוּב
  choice: hutarudi
  rationale: Kitenzi שוב kwa msingi humaanisha kurudi au kugeuka tena. ‘Hutarudi’ kinahifadhi sitiari bila kuongeza wazi ‘kwetu’ au ‘kwa fadhili,’ maneno ambayo hayapo katika Kiebrania.
- source_word: תְּחַיֵּנוּ
  choice: kutuhuisha
  rationale: Hii ni hali ya kusababisha ya חיה pamoja na kiambishi cha nafsi ya kwanza wingi; ina maana ya kutufanya tuishi au kuturudishia uhai. ‘Kutuhuisha’ kinaacha maana yake ikiwa pana, si ya kiroho pekee wala ya kimwili pekee.
- source_word: וְעַמְּךָ
  choice: ili watu wako
  rationale: Katika muktadha huu kiunganishi kinaanzisha matokeo au kusudi la ombi. ‘Ili watu wako’ ni Kiswahili cha kawaida kinachohifadhi uhusiano huo na lugha ya agano ya ‘watu wako.’
- source_word: יִשְׂמְחוּ
  choice: wakufurahie
  rationale: Hali ya kitenzi hapa inaeleza matokeo au kusudi linalotamaniwa. ‘Wakufurahie’ ni usemi wa asili unaoonyesha furaha inayomlenga Mungu.
- source_word: בָךְ
  choice: -ku- katika ‘wakufurahie’
  rationale: Kihusishi ב pamoja na kitenzi cha kufurahi humtaja anayelengwa au ambaye ndani yake furaha inapatikana. Muundo ‘wakufurahie’ unawasilisha maana hiyo kwa Kiswahili cha asili kuliko ‘wafurahi katika wewe.’
theological_decisions:
- issue: Ikiwa kurudi kwa Mungu kuelezwe wazi kuwa ni kuwarudia watu wake kwa fadhili
  choice: Maandishi makuu yanasema tu ‘hutarudi.’
  alternative: hutarudi kwetu; utatugeukia tena kwa fadhili
  rationale: Ingawa muktadha unaashiria Mungu kuwageukia tena watu wake kwa fadhili, Kiebrania hakitaji wazi ‘kwetu’ wala ‘kwa fadhili.’ Tafsiri inahifadhi upana wa sitiari hiyo.
- issue: Ikiwa ‘kutuhuisha’ kunamaanisha ufufuo wa kiroho pekee au urejesho mpana
  choice: Imetumika ‘kutuhuisha’ bila kuifinya maana.
  alternative: kutufanya tuishi tena; kutufanya upya kiroho; kurejesha maisha ya taifa letu
  rationale: Muktadha unahusu urejesho wa jumuiya baada ya hukumu, lakini maneno ya Kiebrania yana maana pana. Tafsiri haiifungi kwa urejesho wa kiroho, kisiasa, au kimwili pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Wakufurahie’ kimetumiwa badala ya usemi usio wa kawaida ‘wafurahi katika wewe,’ huku Mungu akibaki ndiye anayelengwa na furaha. Muundo wa swali la balagha na upana wa maana ya urejesho vimehifadhiwa.
