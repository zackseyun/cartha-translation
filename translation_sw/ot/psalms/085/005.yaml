base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/005.yaml
  text: Will you be angry with us forever? Will you prolong your anger from generation to generation?[a][b]
translation:
  language: sw
  text: Je, utatukasirikia milele? Je, utaifanya hasira yako idumu kizazi baada ya kizazi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “utaivuta hasira yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְעוֹלָם
  choice: milele
  rationale: Kiulizi הַ pamoja na לְעוֹלָם kinauliza ikiwa hali hiyo itaendelea milele; “milele” ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: תֶּאֱנַף בָּנוּ
  choice: utatukasirikia
  rationale: Kitenzi אנף humaanisha kuwa na hasira, na בָּנוּ humtaja mlengwa wa hasira. “Kukasirikia” ni muundo wa asili wa Kiswahili unaowasilisha maana hiyo bila kupunguza uzito wake.
- source_word: תִּמְשֹׁךְ
  choice: utaendeleza
  rationale: משך kimsingi ni kuvuta au kunyoosha; pamoja na “hasira” humaanisha kuifanya idumu. “Kuendeleza” ni ya kawaida huku tanbihi ikihifadhi taswira halisi.
- source_word: אַפְּךָ
  choice: hasira yako
  rationale: אַף kimsingi ni “pua,” lakini hapa ni nahau ya hasira; tafsiri ya moja kwa moja ya maana inayokusudiwa ni “hasira yako.”
- source_word: לְדֹר וָדֹר
  choice: kizazi baada ya kizazi
  rationale: Nahau hii ya Kiebrania huonyesha mfululizo wa vizazi; usemi huu wa Kiswahili ni wa asili na huhifadhi mwendelezo huo.
theological_decisions:
- issue: Lugha inayomhusisha Mungu na hasira ya kibinadamu
  choice: Kuhifadhi wazi lugha ya Mungu kuwa na hasira
  alternative: Je, utaendelea kutufanyia ukali au kutupinga?
  rationale: Kiebrania kinataja hasira ya Mungu moja kwa moja. Kuiweka hivyo huhifadhi mvutano wa maombolezo bila kuipunguza kuwa kutopendezwa tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Maswali mawili ya balagha yamehifadhiwa; “kukasirikia” huwasilisha kwa kawaida uhusiano wa בָּנוּ bila kuhitaji tanbihi ya “dhidi yetu.”
