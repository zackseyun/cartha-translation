base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/001.yaml
  text: I will exalt you[a], O Yahweh, because you have drawn me up and have not let my enemies rejoice over me.
translation:
  language: sw
  text: 'Nitakutukuza[a], ee Yahweh,

    kwa maana umenivuta juu,

    wala hujawaacha adui zangu wanifurahie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitakuinua juu.” Kitenzi cha Kiebrania hapa kina wazo la kumwinua kwa sifa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹמִמְךָ
  choice: Nitakutukuza
  rationale: Kitenzi רום hapa kinaeleza kumwinua Mungu kwa sifa. “Nitakutukuza” ni Kiswahili cha kawaida na chenye hadhi katika ibada, huku kikidumisha wazo la kumwinua kwa heshima.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahweh” badala ya kubadilishwa na cheo, ili kuhifadhi jina la binafsi lililo katika maandishi ya Kiebrania.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya mtunga zaburi kumtukuza Yahweh. “Kwa maana” ni cha asili na chenye hadhi katika muktadha huu.
- source_word: דִלִּיתָנִי
  choice: umenivuta juu
  rationale: Kitenzi דלה huleta picha ya kuvuta kitu juu, hasa kutoka kisimani au shimoni. “Umenivuta juu” huhifadhi picha hiyo halisi bila kuifafanua kupita maandishi.
- source_word: וְלֹא שִׂמַּחְתָּ אֹיְבַי לִי
  choice: wala hukuwaacha adui zangu wanifurahie
  rationale: Ingawa שׂמח katika kausativi inaweza kuwa “kuwafurahisha,” muundo huu unaeleza kwamba Mungu hakuwapa adui nafasi ya kufurahia yaliyompata mtunga zaburi. “Wanifurahie” ni usemi wa asili wa Kiswahili unaoonyesha furaha yao juu ya kushindwa kwake.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia Tetragramatoni kama jina la binafsi. “Yahweh” huhifadhi jina hilo badala ya kulibadilisha na cheo, bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa mistari unaakisi ushairi wa zaburi. Picha halisi ya kuvutwa juu imehifadhiwa, na tanbihi inaeleza maana mbadala ya kitenzi cha kwanza.
