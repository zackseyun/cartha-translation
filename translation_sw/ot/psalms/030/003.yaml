base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/003.yaml
  text: O Yahweh[a], you brought up my soul from Sheol[c][b]; you kept me alive from among those going down to the pit.
translation:
  language: sw
  text: Ee Yahwe, uliinua nafsi yangu kutoka Sheoli[a]; uliniweka hai kwa kunitenga na wale wanaoshuka shimoni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheoli ni neno la Kiebrania linalomaanisha makao ya wafu; pia linaweza kutafsiriwa “kaburi.”
    reason: lexical_alternative
  - marker: b
    text: “Nafsi yangu” pia inaweza kumaanisha “uhai wangu.” Au, “ulinirudishia uhai kutoka miongoni mwa wale wanaoshuka shimoni”; kwa uelewa mwingine wa muundo wa Kiebrania, “uliniweka hai nisishuke shimoni.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la Mungu limetoholewa kuwa “Yahwe” badala ya kubadilishwa na cheo; “Ee” linaonyesha mwito wa moja kwa moja.
- source_word: הֶעֱלִיתָ
  choice: uliipandisha
  rationale: Huhifadhi taswira ya mwendo wa kwenda juu kutoka makao ya wafu na ulinganifu wake na kushuka shimoni.
- source_word: מִן שְׁאוֹל
  choice: kutoka Sheoli
  rationale: “Sheoli” huhifadhi istilahi ya Kiebrania kwa ulimwengu au makao ya wafu bila kuifinya iwe kaburi la kawaida tu.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: Huhifadhi usemi wa kishairi wa Kiebrania; katika muktadha huu unaweza pia kumaanisha uhai wangu au mimi mwenyewe.
- source_word: חִיִּיתַנִי
  choice: uliniweka hai
  rationale: Huwasilisha kuhifadhi au kurejesha uhai bila kulazimisha dai mahsusi la ufufuo.
- source_word: מִיּוֹרְדֵי בוֹר
  choice: miongoni mwa wale wanaoshuka shimoni
  rationale: Huhifadhi ufasiri wa מן kama kutenganishwa na kundi la wanaoshuka kwenye shimo la mauti, huku tanbihi ikitaja miundo mingine inayowezekana.
- source_word: בּוֹר
  choice: shimoni
  rationale: “Shimo” huhifadhi taswira ya kishairi inayohusishwa na kaburi au mauti.
theological_decisions:
- issue: Iwapo mstari utafsiriwe kana kwamba unafundisha wazi ufufuo au maelezo kamili ya maisha baada ya kifo
  choice: Kuhifadhi taswira za Sheoli na shimo bila kuzibadili kuwa “jehanamu” au kauli ya wazi ya kufufuliwa kutoka kwa wafu.
  alternative: Kutafsiri Sheoli kama “kaburi” pekee au kutumia lugha ya wazi ya ufufuo.
  rationale: Zaburi inaeleza kuokolewa kutoka mautini au hatari ya kifo kwa taswira ya kishairi; tafsiri haipaswi kuamua zaidi ya yale maandishi yenyewe yanayosema.
- issue: Uhusiano wa חִיִּיתַנִי na מִיּוֹרְדֵי בוֹר
  choice: “uliniweka hai miongoni mwa wale wanaoshuka shimoni”
  alternative: “ulinirudishia uhai kutoka miongoni mwa wale wanaoshuka shimoni,” au “uliniweka hai nisishuke shimoni.”
  rationale: Muundo wa Kiebrania unaruhusu tofauti za kisintaksia; tafsiri kuu hufuata wazo la kutengwa na kundi la wanaoshuka, na tanbihi huhifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira za kwenda juu na kushuka zimehifadhiwa; “Sheoli” imefafanuliwa kwa tanbihi.
