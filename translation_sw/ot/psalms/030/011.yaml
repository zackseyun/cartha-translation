  text: You turned my mourning into dancing for me; you untied my sackcloth and clothed me with joy.
translation:
  language: sw
  text: Uligeuza maombolezo yangu kuwa dansi yangu; ukanivua vazi langu la gunia na kunivika furaha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפְּדִי
  choice: maombolezo yangu
  rationale: Neno hilo linamaanisha kuomboleza au maombolezo, hasa katika muktadha wa huzuni na desturi za kuomboleza.
- source_word: לְמָחוֹל לִי
  choice: yakawa dansi kwa ajili yangu
  rationale: מָחוֹל ni dansi au kucheza kwa shangwe; לִי imehifadhiwa wazi kama “kwa ajili yangu,” bila kuimeza katika muundo wa sentensi.
- source_word: פִּתַּחְתָּ שַׂקִּי
  choice: ukanivua nguo yangu ya gunia
  rationale: Kiebrania kihalisi ni kufungua au kulegeza gunia langu. Katika picha ya mtu aliyevaa nguo ya maombolezo, “ukanivua” huwasilisha kwa Kiswahili cha kawaida tendo la kuiondoa, huku “nguo yangu ya gunia” ikihifadhi ishara ya maombolezo.
- source_word: וַתְּאַזְּרֵנִי שִׂמְחָה
  choice: na kunivika furaha
  rationale: Kitenzi kinamaanisha kunifunga au kunizungushia kama kwa mkanda; tafsiri ya “kunivika” huhifadhi sitiari ya furaha kuwa vazi linalochukua nafasi ya nguo ya gunia.
theological_decisions:
- issue: Mhusika anayebadili hali ya mwombaji
  choice: Nafsi ya pili imehifadhiwa katika “Uligeuza… ukanivua… kunivika,” ikimwelekezea Mungu matendo yote.
  alternative: Kutaja “BWANA” waziwazi.
  rationale: Aya yenyewe ina viambishi vya nafsi ya pili lakini hailitaji jina la Mungu; halikuongezwa ili kutohamisha zaidi ya maandishi.
- issue: Nguo ya furaha kama sitiari
  choice: “kunivika furaha”
  alternative: “kunifunga furaha kiunoni”
  rationale: Muundo wa chanzo una sitiari ya kuzungushiwa au kufungwa furaha. “Kunivika furaha” ni ya asili na yenye hadhi katika Kiswahili, huku ikiendeleza tofauti kati ya nguo ya gunia na furaha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Dansi” limetumiwa kwa maana ya kucheza kwa shangwe; sentensi imehifadhi ulinganifu wa maombolezo/dansi na nguo ya gunia/furaha.
