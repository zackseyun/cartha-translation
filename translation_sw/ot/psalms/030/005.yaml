source:
  edition: WLC
  text: כִּ֤י רֶ֨גַע בְּ/אַפּ/וֹ֮ חַיִּ֪ים בִּ/רְצ֫וֹנ֥/וֹ בָּ֭/עֶרֶב יָלִ֥ין בֶּ֗כִי וְ/לַ/בֹּ֥קֶר רִנָּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/005.yaml
  text: For his anger is for a moment[a]; life is in his favor. Weeping may stay for the night[b], but rejoicing comes in the morning.
translation:
  language: sw
  text: Kwa maana hasira yake ni ya muda mfupi; katika kibali chake kuna uzima. Jioni kilio hukaa usiku[a], lakini asubuhi kuna shangwe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jioni kilio hulala”; kitenzi cha Kiebrania humaanisha kulala au kukaa mahali usiku mmoja, kama mgeni au msafiri.
    reason: lexical_alternative
  - marker: b
    text: Au, “kilio cha furaha” au “uimbaji wa furaha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza sababu au maelezo yanayounga mkono maneno yaliyotangulia katika zaburi.
- source_word: רֶגַע בְּאַפּוֹ
  choice: hasira yake ni ya muda mfupi
  rationale: רֶגַע humaanisha muda mfupi sana, na אַף hapa ni nahau ya hasira; Kiswahili hiki ni cha kawaida na hudumisha ufupi wa hasira ya Mungu.
- source_word: חַיִּים בִּרְצוֹנוֹ
  choice: katika kibali chake kuna uzima
  rationale: Muundo wa Kiebrania hauna kitenzi na ni mfupi. Tafsiri hii huhifadhi uhusiano kati ya uzima na kibali chake bila kuamua kimya kimya kama kibali ndicho kisababishacho uzima au ndicho mazingira ambamo uzima hupatikana.
- source_word: בָּעֶרֶב יָלִין בֶּכִי
  choice: Huenda kilio kikakaa usiku
  rationale: יָלִין hueleza kukaa au kulala mahali usiku mmoja. Kauli hii huhifadhi tashihisi ya kilio kama mgeni wa usiku na huonyesha uwezekano unaofaa katika Kiswahili.
- source_word: וְלַבֹּקֶר רִנָּה
  choice: lakini asubuhi kuna shangwe
  rationale: וְ inaonyesha utofauti wa kishairi kati ya usiku na asubuhi, hivyo 'lakini' inafaa. רִנָּה inaweza kuwa shangwe, kilio cha furaha, au uimbaji wa furaha; 'shangwe' hudumisha maana pana.
theological_decisions:
- issue: Marejeo ya viambishi vya nafsi katika 'hasira yake' na 'kibali chake'
  choice: Viambishi vinamrejelea Bwana kulingana na muktadha wa zaburi.
  alternative: Kuongeza jina 'Mungu' au 'Bwana' moja kwa moja katika aya hii.
  rationale: Kiswahili kinahifadhi viwakilishi vya maandishi ya Kiebrania huku muktadha ukimtambulisha anayerejelewa; hakiongezi ufafanuzi wa kimadhehebu.
- issue: Uhusiano kati ya uzima na kibali cha Mungu
  choice: katika kibali chake kuna uzima
  alternative: kwa kibali chake huleta uzima
  rationale: Kiebrania ni kishazi kisicho na kitenzi na kinaweza kuonyesha mahali au njia. Tafsiri iliyochaguliwa huhifadhi mkazo na mvutano huo badala ya kuweka wazi kisababishi ambacho hakijaelezwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa usiku na asubuhi pamoja na utofauti wa kilio na shangwe umehifadhiwa. Alama za tanbihi zimewekwa baada ya maneno yanayohusika, kwa kuwa safu ya Kiingereza iliyotolewa ilikuwa na alama zisizolingana na maelezo yake.
