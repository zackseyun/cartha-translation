  yaml_path: translation/ot/psalms/030/012.yaml
  text: so that my glory may sing praise to you and not be silent. O Yahweh my God[a], I will give thanks to you forever.
translation:
  language: sw
  text: ili utukufu wangu ukuimbie sifa wala usinyamaze. Ee Yahweh, Mungu wangu, nitakushukuru milele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili nafsi yangu yote ikuimbie sifa”; kwa Kiebrania ni “utukufu wangu,” usemi wa kishairi unaoweza kumaanisha utu wa ndani wa mtunga zaburi au ulimi wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: ili
  rationale: Huonyesha kusudi au matokeo kwa Kiswahili cha kawaida na cha asili.
- source_word: יְזַמֶּרְךָ
  choice: ukuimbie sifa
  rationale: Huhifadhi maana ya kuimba kwa kusudi la kumsifu Mungu.
- source_word: כָבוֹד
  choice: utukufu wangu
  rationale: Huhifadhi sitiari halisi ya Kiebrania, ingawa katika ushairi inaweza kumaanisha nafsi ya ndani, ulimi, au utu wote wa mtunga zaburi.
- source_word: וְלֹא יִדֹּם
  choice: wala usinyamaze
  rationale: Muktadha unaweka kunyamaza kinyume na kuimba, hivyo 'kunyamaza' linafaa kuliko 'kutulia'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina binafsi la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadili kuwa cheo.
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Ni umbo la umilikaji linalotumiwa hapa kama wito wa moja kwa moja.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Hueleza muda usio na mwisho kwa lugha ya kawaida, yenye heshima.
- source_word: אוֹדֶךָּ
  choice: nitakushukuru
  rationale: Katika muktadha wa zaburi ya shukrani, kitenzi hiki huonyesha kutoa shukrani au sifa kwa Mungu.
theological_decisions:
- issue: Maana ya כָבוֹד kama mwenye kuimba sifa
  choice: Kuhifadhi sitiari 'utukufu wangu' katika maandishi makuu
  alternative: nafsi yangu yote; ulimi wangu
  rationale: Neno la Kiebrania ni 'utukufu,' lakini rejeo lake la kishairi lina utata wa kweli. Tafsiri haipaswi kuliamua kimyakimya; maana mbadala zinaelezwa katika tanbihi.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Uandishi wa jina lenyewe huhifadhi kwamba maandishi yana jina binafsi la Mungu, si cheo pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kishairi umehifadhiwa bila kuufanya kuwa mgumu kupita kiasi; 'Ee' huonyesha wito wa moja kwa moja.
