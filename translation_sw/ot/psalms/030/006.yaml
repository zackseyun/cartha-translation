lexical_decisions:
- source_word: וַאֲנִי
  choice: Nami
  rationale: Kiunganishi pamoja na kiwakilishi huru kinakazia nafsi ya msemaji. “Nami” ni Kiswahili cha kawaida kinachohifadhi mkazo huo bila kulazimisha maana ya upinzani.
- source_word: אָמַרְתִּי
  choice: nilisema
  rationale: Wakati uliopita rahisi unafaa katika kumbukumbu hii; umbo la Kiebrania lenyewe halilazimishi tafsiri ya ‘nilikuwa nimesema.’
- source_word: בְשַׁלְוִי
  choice: nilipokuwa katika hali ya utulivu
  rationale: שַׁלְוָה hueleza hali ya raha, utulivu, au usalama wenye mafanikio. Tafsiri hii ni pana kuliko ‘ustawi’ wa mali pekee na inaonyesha kuwa ilikuwa hali ya msemaji mwenyewe.
- source_word: בַּל ... לְעוֹלָם
  choice: kamwe
  rationale: Kikanushi cha kishairi pamoja na לְעוֹלָם kinatoa ukanushi wenye nguvu unaoendelea kwa wakati wote; “kamwe” huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: אֶמּוֹט
  choice: Sitayumba
  rationale: Kitenzi מוט katika Nifali kinaonyesha kutikiswa au kupoteza uthabiti. “Kuyumba” huhifadhi sitiari ya kutokuwa thabiti na ni usemi wa kawaida wa Kiswahili.
