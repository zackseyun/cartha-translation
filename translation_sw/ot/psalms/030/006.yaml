  text: Nami, katika raha yangu[a], nilisema, “Sitayumba kamwe.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika utulivu wangu” au “katika usalama wangu.” Neno la Kiebrania linaweza kumaanisha hali njema yenye utulivu na usalama, wala si ustawi wa mali pekee.
