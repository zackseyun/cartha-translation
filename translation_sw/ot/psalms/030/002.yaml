  text: 'Ee Yahweh, Mungu wangu,[a]


    nilikulilia,[b]


    nawe ukaniponya.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH,” jina la Mungu; kwa kawaida pia hutafsiriwa “BWANA.” Namna nyingine ni “Yehova.”'
    reason: alternative_reading
  - marker: b
    text: Au, “nilikulilia unisaidie.” Kitenzi cha Kiebrania huonyesha kilio cha dharura cha kuomba msaada.
    reason: lexical_alternative
  - marker: c
    text: “Ukaniponya” huenda ikamaanisha kuponywa kimwili au, katika muktadha, kurejeshwa au kuokolewa kwa maana pana zaidi.
