lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Limetafsiriwa kwa jina “Yahweh” ili kuhifadhi jina la Mungu lililo katika maandishi ya Kiebrania, badala ya kulibadili kuwa cheo.
- source_word: אֱלֹהָי
  choice: Mungu wangu
  rationale: Nomino yenye kiambishi cha nafsi ya kwanza umoja humaanisha moja kwa moja “Mungu wangu”; hapa ni sehemu ya mwito kwa Mungu.
- source_word: שִׁוַּעְתִּי
  choice: nilikulilia unisaidie
  rationale: Kitenzi שׁוע huonyesha kilio cha dharura cha kuomba msaada. Kiswahili hiki kinaweka wazi maana ya ombi la msaada bila kupunguza uzito wa kilio hicho.
- source_word: אֵלֶיךָ
  choice: nilikulilia
  rationale: Maana elekezi ya אֶל (“kwako”) imewasilishwa kwa kiambishi -ku- katika kitenzi cha Kiswahili, kwa mtiririko wa kawaida wa lugha.
- source_word: וַתִּרְפָּאֵנִי
  choice: nawe ukaniponya
  rationale: רפא humaanisha kuponya. “Ukaniponya” ni tafsiri ya moja kwa moja na ya kawaida, huku ikiweza kurejelea kupona kimwili au kurejeshwa kwa maana pana kulingana na muktadha.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la pekee la Mungu. “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Upeo wa maana ya רפא
  choice: ukaniponya
  alternative: ukanirejesha; ukanifanya niwe mzima
  rationale: “Ukaniponya” inalingana kwa karibu na maana ya msingi ya kitenzi na haifungi muktadha kwenye matibabu ya mwili pekee; uwezekano wa urejesho au ukombozi mpana umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. “Ee” hudumisha mwito wa moja kwa moja; mpangilio wa mistari mitatu unaakisi vipashio vya mstari wa Kiebrania. Viambishi vya Kiswahili vimetumika kuepuka urudiaji usio wa kawaida wa “kwako”.
