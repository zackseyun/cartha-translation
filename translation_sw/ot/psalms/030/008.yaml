- source_word: יְהוָה
  choice: Yehova
  rationale: Jina maalumu la Mungu katika Kiebrania limetafsiriwa kwa umbo la Kiswahili linalotambulika sana, badala ya kulibadilisha kuwa cheo.
- source_word: אֶקְרָא
  choice: ninakulilia
  rationale: Katika muktadha wa sala ya dhiki, ‘kulilia’ huwasilisha mwito wa dhati kwa Mungu kwa Kiswahili cha asili.
- source_word: אֲדֹנָי
  choice: Bwana wangu
  rationale: Umbo hili la Kiebrania ni cheo cha heshima kinachomrejelea Mungu; ‘Bwana wangu’ huhifadhi maana ya ubwana na kipengele cha kimahusiano kinachowezekana katika umbo hilo.
- source_word: אֶתְחַנָּן
  choice: ninamsihi … anihurumie
  rationale: Kitenzi kinamaanisha kuomba kwa unyenyekevu ili kupata fadhili au huruma; usemi huu ni wa kawaida na huonyesha yaliyomo katika ombi.
theological_decisions:
