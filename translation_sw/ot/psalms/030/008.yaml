  choice: Yehova … Bwana wangu
  alternative: BWANA … Bwana
  rationale: Tafsiri inahifadhi tofauti ya maandishi kati ya jina maalumu la Mungu na cheo ‘Bwana,’ bila kudokeza kwamba wanatajwa wahusika wawili tofauti.
- issue: Maana ya אֲדֹנָי kama ‘Bwana’ au ‘Bwana wangu’
  choice: Bwana wangu
  alternative: Bwana
  rationale: ‘Bwana wangu’ inahifadhi kwa uwazi zaidi kipengele cha umilikishi/uhusiano kinachoonekana katika umbo la neno, ingawa katika matumizi ya kimungu neno hilo pia hutumika kama cheo kilichozoeleka.
