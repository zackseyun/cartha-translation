base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/004.yaml
  text: Sing praise to Yahweh[a], you his faithful ones[c][b], and give thanks to the remembrance of his holiness.
translation:
  language: sw
  text: Mwimbieni Yahweh sifa, enyi waaminifu wake, na mshukuruni kwa kumbukumbu ya utakatifu wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnapoukumbuka utakatifu wake”; huenda pia ikarejelea kumshukuru jina lake takatifu linapotajwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Mwimbieni ... sifa
  rationale: Kitenzi hiki katika shina la Piel na hali ya amri ya wingi humaanisha kuimba au kufanya muziki wa sifa; usemi huu unahifadhi wazo la uimbaji wa ibada na sifa.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetafsiriwa kwa umbo la kawaida la Kiswahili “Yahweh,” badala ya kulibadili kuwa cheo.
- source_word: חֲסִידָיו
  choice: waaminifu wake
  rationale: Neno hili humaanisha watu wanaodhihirisha uaminifu, uchaji, na ushikamanifu wa agano. “Waaminifu wake” ni la kawaida na halina maana finyu ya kidhehebu.
- source_word: וְהוֹדוּ
  choice: na mshukuruni
  rationale: Katika muktadha wa sifa, Hiphil ya ידה humaanisha kushukuru au kusifu. “Mshukuruni” inaendana vizuri na sambamba ya mwito wa kumwimbia sifa.
- source_word: לְזֵכֶר
  choice: mnapokumbuka
  rationale: זֵכֶר inaweza kumaanisha kumbukumbu, ukumbusho, au kutajwa. Kiswahili hiki cha kawaida kinaonyesha kushukuru kunakohusishwa na kukumbuka, bila kulazimisha maana ya “jina.”
- source_word: קָדְשׁוֹ
  choice: utakatifu wake
  rationale: Tafsiri hii inafuata moja kwa moja nomino קֹדֶשׁ pamoja na kiambishi cha nafsi ya tatu; “jina lake takatifu” lingeongeza neno lisilopo wazi katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Kiebrania kinatumia Tetragramatoni moja kwa moja; “Yahweh” huhifadhi jina la agano badala ya kulibadili kuwa cheo.
- issue: Maana ya לְזֵכֶר קָדְשׁוֹ
  choice: mnapokumbuka utakatifu wake
  alternative: kwa kumbukumbu ya utakatifu wake; linapotajwa jina lake takatifu
  rationale: Kirai cha Kiebrania kinaweza kuelekeza kwenye kumbukumbu au kutajwa kwa utakatifu wake. Tafsiri kuu ni ya asili kwa Kiswahili na tanbihi inahifadhi uwezekano wa kisemantiki bila kuingiza “jina” katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Enyi” huonyesha wazi kwamba “waaminifu wake” ni watu wanaoambiwa moja kwa moja. Tanbihi imewekwa baada ya kirai kinachohusika.
