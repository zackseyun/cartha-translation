  language: sw
  text: Ee Yahwe, kwa kibali chako uliufanya mlima wangu usimame imara[a]; ulipoficha uso wako, nilifadhaika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uliupa mlima wangu nguvu.” Maneno ya Kiebrania ni mafupi na yanaweza pia kueleweka kama taswira ya ustawi salama au uthabiti.
    reason: Muundo לְהַרְרִי עֹז una uhusiano wa kisarufi ulio mgumu na unaruhusu zaidi ya namna moja ya kueleza jinsi “nguvu” inavyohusiana na “mlima wangu.”
lexical_decisions:
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la agano limetoholewa kama “Yahwe,” na “Ee” linaonyesha kwamba mtunga zaburi anamwambia Mungu moja kwa moja.
- source_word: בִּרְצוֹנְךָ
  choice: kwa kibali chako
  rationale: Neno רָצוֹן hapa linaonyesha kibali au nia njema ya Mungu; kihusishi בְּ kinaeleweka kama njia au sababu ya uthabiti huo.
- source_word: הֶעֱמַדְתָּה
  choice: uliufanya ... usimame
  rationale: Hifili ya עמד ina maana ya kusababisha kitu kisimame; muundo huu unahifadhi nguvu ya kisababishi kwa Kiswahili cha kawaida.
- source_word: לְהַרְרִי
  choice: mlima wangu
  rationale: Ingawa muundo wa Kiebrania ni mgumu, taswira halisi ya “mlima wangu” imehifadhiwa badala ya kufasiriwa moja kwa moja kuwa ustawi, usalama, au ngome.
- source_word: עֹז
  choice: imara
  rationale: עֹז humaanisha nguvu au uimara. “Usimame imara” ni Kiswahili cha asili kinachoeleza kwa ufupi matumizi yake ya kihali au kiarifu hapa.
- source_word: הִסְתַּרְתָּ פָנֶיךָ
  choice: ulipouficha uso wako
  rationale: Nahau ya Kiebrania imehifadhiwa kwa sababu inaeleweka katika ushairi wa kibiblia na huonyesha kuondolewa kwa kibali au uwepo wa Mungu bila kufafanua zaidi ya matini.
- source_word: נִבְהָל
  choice: nilifadhaika
  rationale: Nifali ya בהל huonyesha kushtuka, kuvurugika, au kuingiwa na hofu; “nilifadhaika” inafikisha mshtuko wa ndani bila kuifanya lazima iwe hofu kali kabisa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ina jina יהוה moja kwa moja. “Yahwe” huhifadhi jina hilo la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya “mlima wangu”
  choice: Kuhifadhi taswira ya “mlima wangu” katika matini kuu
  alternative: ustawi wangu, usalama wangu, au ngome yangu
  rationale: Kiebrania kinataja mlima, huenda kama taswira ya uthabiti, usalama, au hali njema. Tafsiri haiamui kimya-kimya ni maana ipi ya kitamathali iliyokusudiwa.
- issue: Uhusiano kati ya kufichwa kwa uso wa Mungu na fadhaiko
  choice: ulipouficha uso wako, nilifadhaika
  alternative: uliuficha uso wako; nilifadhaika
  rationale: Kiebrania kinaweka vitendo hivi kwa mfuatano bila kiunganishi dhahiri. Muundo wa Kiswahili unaonyesha uhusiano wa wakati unaodokezwa na muktadha, huku ukiacha wazi namna kamili ya kisababishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi ulio wa sasa na wenye heshima. Taswira ya uso kufichwa na mlima kusimama imehifadhiwa; alama [a] imewekwa mara moja katika matini kuu na inalingana na tanbihi.
