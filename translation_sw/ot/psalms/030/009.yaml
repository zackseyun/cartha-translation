  text: מַה בֶּ֥צַע בְּ/דָמִ/י֮ בְּ/רִדְתִּ֪/י אֶ֫ל שָׁ֥חַת הֲ/יוֹדְ/ךָ֥ עָפָ֑ר הֲ/יַגִּ֥יד אֲמִתֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/009.yaml
  text: What profit is there in my blood[c][b][a], in my going down to the pit? Will the dust praise you? Will it declare your faithfulness?
translation:
  language: sw
  text: Kuna faida gani katika damu yangu[a], katika kushuka kwangu shimoni[b]? Je, mavumbi yatakusifu? Je, yatatangaza uaminifu wako[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika kifo changu?” Kiebrania kinasema kihalisi, “katika damu yangu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kaburini.”
    reason: lexical_alternative
  - marker: c
    text: Au, “ukweli wako.” Neno la Kiebrania linaweza kumaanisha ukweli au uaminifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה בֶּצַע
  choice: Kuna faida gani
  rationale: Huhifadhi swali la balagha kuhusu manufaa au faida itakayopatikana.
- source_word: בְּדָמִי
  choice: katika damu yangu
  rationale: Huhifadhi taswira halisi ya Kiebrania, huku muktadha ukidokeza kifo au kumwagika kwa damu.
- source_word: בְּרִדְתִּי אֶל שָׁחַת
  choice: katika kushuka kwangu shimoni
  rationale: Huwakilisha tendo la kushuka na kudumisha taswira ya kuelekea mahali pa wafu.
- source_word: שָׁחַת
  choice: shimoni
  rationale: Neno hili huhifadhi sitiari ya shimo na kushuka; 'kaburini' lingekuwa tafsiri yenye ufafanuzi zaidi.
- source_word: הֲיוֹדְךָ עָפָר
  choice: Je, mavumbi yatakusifu?
  rationale: Katika Zaburi, ידה inapoelekezwa kwa Mungu hufaa kutafsiriwa 'kusifu'; 'mavumbi' yanahifadhi taswira ya hali ya mwanadamu baada ya kufa.
- source_word: הֲיַגִּיד
  choice: Je, yatatangaza
  rationale: '''Kutangaza'' linaendana na lugha ya kishairi na wazo la kutoa ushuhuda wazi kuhusu tabia ya Mungu.'
- source_word: אֲמִתֶּךָ
  choice: uaminifu wako
  rationale: אמת linaweza kumaanisha ukweli au uaminifu; hapa 'uaminifu' linafaa katika ombi linalotegemea tabia ya Mungu, bila kuondoa maana mbadala.
theological_decisions:
- issue: Iwapo taswira za kifo zifafanuliwe moja kwa moja au zihifadhiwe katika umbo lake la kishairi
  choice: Kuhifadhi 'damu,' 'shimo,' na 'mavumbi' katika matini kuu
  alternative: Kutafsiri kwa ufafanuzi zaidi kuwa 'kifo,' 'kaburi,' na 'wafu'
  rationale: Kiebrania kinatoa hoja kwa kutumia taswira dhahiri za hali ya kufa. Kuzihifadhi kunadumisha uzito na mvutano wa kishairi bila kuingiza ufafanuzi ndani ya matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo wa maswali ya balagha na taswira halisi za Kiebrania vimehifadhiwa; alama za tanbihi zimewekwa karibu na maneno yanayohusika.
