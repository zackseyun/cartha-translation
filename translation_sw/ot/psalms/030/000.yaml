translation:
  language: sw
  text: Zaburi. Wimbo wa kuiweka nyumba[a] wakfu. Ya Daudi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hekalu” au “jumba la kifalme”; Kiebrania kinasema tu “nyumba.”
