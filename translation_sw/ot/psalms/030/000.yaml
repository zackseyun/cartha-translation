lexical_decisions:
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Neno hili hutaja wimbo wa ibada wenye uhusiano wa kimuziki; “zaburi” ndilo neno la kawaida na linaloeleweka katika vichwa vya Zaburi.
- source_word: שִׁיר
  choice: Wimbo
  rationale: Limedumishwa tofauti na “Zaburi” ili kuhifadhi majina mawili ya aina ya utungo yaliyopo katika Kiebrania.
- source_word: חֲנֻכַּת
  choice: kuiweka ... wakfu
  rationale: Nomino ya Kiebrania ina maana ya kuweka kitu wakfu au kukizindua kwa matumizi yaliyokusudiwa. Muundo wa kitenzi ni wa kawaida zaidi katika Kiswahili huku ukihifadhi maana ya tukio hilo.
- source_word: הַבַּיִת
  choice: nyumba
  rationale: Kiebrania kinasema kwa upana “nyumba” bila kubainisha kama ni hekalu, jumba la kifalme, au nyumba nyingine; tafsiri haifungi maana hiyo.
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Muundo huu huhifadhi kwa kiasi kikubwa uhusiano mpana unaoweza kumaanisha utunzi, umiliki, uhusiano, au kuwekwa kwa ajili ya Daudi, bila kuamua moja kwa moja kuwa “iliyoandikwa na Daudi.”
theological_decisions:
- issue: Nyumba inayorejelewa katika kichwa
  choice: nyumba
  alternative: hekalu; jumba la kifalme la Daudi
  rationale: Neno בַּיִת lina maana pana, na kichwa hakimtambulishi wazi mhusika wake. “Nyumba” huhifadhi uwazi huo wa kitafsiri.
- issue: Maana ya לְדָוִד katika kichwa cha zaburi
  choice: Ya Daudi
  alternative: Kwa ajili ya Daudi; iliyotungwa na Daudi
  rationale: Kihusishi cha Kiebrania kinaweza kuonyesha utunzi, umiliki, uhusiano, au kusudi. “Ya Daudi” hakifungi maana katika uwezekano mmoja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kichwa cha ibada lakini kinachoeleweka kwa wasomaji wa kawaida. Vipashio vifupi vilivyotenganishwa kwa nukta vinaakisi mpangilio wa maelezo katika kichwa cha Kiebrania.
