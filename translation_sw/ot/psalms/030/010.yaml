  yaml_path: translation/ot/psalms/030/010.yaml
  text: Hear[a], O Yahweh, and be gracious to me; O Yahweh, be my helper.
translation:
  language: sw
  text: Ee Yahweh, nisikie na unifadhili; Ee Yahweh, uwe msaidizi wangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַע
  choice: nisikie
  rationale: Kauli ya amri ya nafsi ya pili umoja imetafsiriwa kwa ombi la kawaida la sala, “nisikie.” Ingawa yambwa la Kiebrania halijaandikwa wazi, Kiswahili hulihitaji hapa ili ombi lisikike la kawaida na maana yake ibaki wazi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limeandikwa kwa unukuzi “Yahweh,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: וְחָנֵּנִי
  choice: unirehemu
  rationale: Kitenzi חנן katika ombi kwa Mungu humaanisha kumwonyesha mtu fadhili au rehema. “Unirehemu” ni usemi wa kawaida, wenye heshima, na unaofaa katika sala ya Kiswahili.
- source_word: הֱיֵה
  choice: uwe
  rationale: Kauli ya amri ya היה hapa ni ombi la Mungu awe katika nafasi fulani kwa mwombaji; “uwe” ndiyo tafsiri ya moja kwa moja na ya kawaida.
- source_word: עֹזֵר לִי
  choice: msaidizi wangu
  rationale: Nomino-tendaji עֹזֵר pamoja na לִי humtaja anayenisaidia. “Msaidizi wangu” huhifadhi maana hiyo ya kibinafsi na inayoendelea.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יהוה mara mbili. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya חנן katika ombi kwa Mungu
  choice: unirehemu
  alternative: unionyeshe fadhili; unifadhili
  rationale: Kitenzi kinaweza kusisitiza fadhili za neema au rehema. Katika kilio hiki cha kuomba msaada, “unirehemu” ni cha kawaida na hakiondoi wazo la fadhili zinazotolewa kwa hiari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, kwa mtindo mfupi, wa heshima na wa sala. Kihisishi “Ee” kimetumiwa kuwakilisha mwito wa moja kwa moja kwa Mungu. Urudiaji wa “ee Yahweh” umehifadhiwa kwa sababu ni sehemu ya msisitizo wa mstari wa Kiebrania.
