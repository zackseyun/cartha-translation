  text: יִשָּׂ֣א בְ֭רָכָה מֵ/אֵ֣ת יְהוָ֑ה וּ֝/צְדָקָ֗ה מֵ/אֱלֹהֵ֥י יִשְׁעֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/005.yaml
  text: He will receive blessing from Yahweh[a], and righteousness from the God of his salvation.
translation:
  language: sw
  text: Atapokea baraka kutoka kwa Yahweh, na haki[a] kutoka kwa Mungu wa wokovu wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuthibitishwa kuwa na haki” au “uadilifu.” Neno la Kiebrania linaweza kumaanisha haki ya kimaadili, hukumu ya kumtetea mtu, au haki inayookoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: atapokea
  rationale: Ingawa kitenzi נָשָׂא kwa kawaida humaanisha kuinua, kubeba, au kuchukua, kinapotumiwa pamoja na kitu dhahania kama ‘baraka’ maana ya nahau ni kupokea au kupata.
- source_word: בְרָכָה
  choice: baraka
  rationale: Hili ni neno la kawaida na la asili kwa בְּרָכָה; umoja wa Kiebrania umehifadhiwa.
- source_word: מֵאֵת יְהוָה
  choice: kutoka kwa Yahweh
  rationale: Kihusishi kinaonyesha chanzo, na jina la Mungu יְהוָה limetoholewa kuwa ‘Yahweh’ ili kuhifadhi jina binafsi lililo katika matini.
- source_word: וּצְדָקָה
  choice: na haki
  rationale: ‘Haki’ huhifadhi upana wa צְדָקָה, unaoweza kuhusisha uadilifu, hukumu ya kumtetea mtu, au haki ya Mungu inayookoa; maana mbadala zimeonyeshwa katika tanbihi.
- source_word: מֵאֱלֹהֵי יִשְׁעוֹ
  choice: kutoka kwa Mungu wa wokovu wake
  rationale: Muundo huu unafuata kwa uwazi kirai cha Kiebrania ‘Mungu wa wokovu wake’ na hauamui kimya kimya ikiwa mkazo ni Mungu kuwa chanzo cha wokovu au kuwa yule anayemwokoa.
- source_word: יִשְׁעוֹ
  choice: wokovu wake
  rationale: ‘Wokovu’ unafaa rejesta ya zaburi na huhifadhi maana pana ambayo pia inaweza kuwa ukombozi au ushindi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania inatumia jina binafsi la Mungu moja kwa moja; ‘Yahweh’ hulihifadhi badala ya kulibadili kuwa cheo.
- issue: Maana ya צְדָקָה katika muktadha huu
  choice: haki
  alternative: kutetewa; uadilifu
  rationale: ‘Haki’ huacha wazi mvutano halisi kati ya uadilifu wa kimaadili, hukumu ya kumtetea mtu, na tendo la Mungu la haki linalookoa. Tanbihi inalinda uwezekano huo bila kuubana kwa tafsiri moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio sambamba wa mstari umehifadhiwa, huku ‘atapokea’ ikitumia Kiswahili cha kawaida kueleza nahau ya Kiebrania.
