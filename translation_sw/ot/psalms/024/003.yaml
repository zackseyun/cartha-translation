  text: מִֽי יַעֲלֶ֥ה בְ/הַר יְהוָ֑ה וּ/מִי יָ֝קוּם בִּ/מְק֥וֹם קָדְשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/003.yaml
  text: Who may ascend the mountain of Yahweh? And who may stand in his holy place?[a]
translation:
  language: sw
  text: Ni nani anayeweza kuupanda mlima wa Yahwe? Na ni nani anayeweza kusimama mahali pake patakatifu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kilima cha Yahwe.” Neno la Kiebrania הַר linaweza kumaanisha “mlima” au “kilima”; hapa limetafsiriwa “mlima,” kama ilivyo kawaida zaidi katika zaburi hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Ni nani
  rationale: Kiwakilishi cha kuuliza kinaanzisha swali la balagha kuhusu mtu anayestahili; “Ni nani” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: יַעֲלֶה
  choice: anayeweza kuupanda
  rationale: Kitenzi עלה humaanisha kwenda juu au kupanda. Katika muktadha huu swali linahusu ustahili au ruhusa ya kukaribia, si tendo la wakati ujao tu; “anayeweza” huhifadhi maana hiyo.
- source_word: בְהַר
  choice: mlima wa
  rationale: הַר inaweza kumaanisha mlima au kilima. “Mlima” ni fasiri ya kawaida hapa na inafaa picha ya Sayuni kama mahali pa juu pa uwepo wa Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kwa namna iliyozoeleka katika Kiswahili, badala ya kubadilishwa na cheo.
- source_word: וּמִי
  choice: Na ni nani
  rationale: Huhifadhi kiunganishi na usambamba wa kishairi kati ya mistari miwili.
- source_word: יָקוּם
  choice: anayeweza kusimama
  rationale: קום humaanisha kuinuka au kusimama. Katika muktadha wa kufika mbele za Mungu, “kusimama” huonyesha kuchukua nafasi au kudumu katika uwepo wake, huku “anayeweza” ikidokeza ustahili.
- source_word: בִּמְקוֹם
  choice: mahali
  rationale: מָקוֹם ni “mahali”; neno hili haliongezi maana maalumu ya “patakatifu” au “hekalu” ambayo haijawekwa wazi na nomino yenyewe.
- source_word: קָדְשׁוֹ
  choice: pake patakatifu
  rationale: Muundo huu una maana ya “utakatifu wake/mahali pake patakatifu.” Upatanisho wa Kiswahili “mahali pake patakatifu” huhifadhi umilikaji unaomrejelea Yahwe.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Kiebrania kinatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha na cheo, kwa tahajia ya kawaida ya Kiswahili.
- issue: Nguvu ya vitenzi vya imperfect katika maswali ya balagha
  choice: anayeweza kuupanda / anayeweza kusimama
  alternative: atakayeupanda / atakayesimama; anaweza kuupanda / anaweza kusimama
  rationale: Muktadha unauliza ni nani anayestahili au anayeruhusiwa kumkaribia Mungu na kukaa mbele zake, si kutabiri tu kitakachotokea. Muundo uliochaguliwa huhifadhi swali hilo bila kulifungamanisha na fundisho mahususi zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usambamba wa kishairi umehifadhiwa kwa “Ni nani ...? Na ni nani ...?”; “kuupanda mlima” ni usemi wa asili katika Kiswahili.
