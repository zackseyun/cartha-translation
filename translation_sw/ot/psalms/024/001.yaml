id: PSA.24.1
reference: Psalms 24:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר לַֽ֭/יהוָה הָ/אָ֣רֶץ וּ/מְלוֹאָ֑/הּ תֵּ֝בֵ֗ל וְ/יֹ֣שְׁבֵי בָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/001.yaml
  text: A psalm of David[a]. The earth and its fullness are Yahweh’s[b], the world and those who dwell in it.
translation:
  language: sw
  text: 'Zaburi ya Daudi.[a]

    Dunia na vyote vilivyomo ndani yake ni mali ya Yahwe;

    ulimwengu na wote wanaokaa ndani yake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Zaburi kwa ajili ya Daudi.”'
    reason: Kihusishi cha Kiebrania kinaweza kuonyesha uhusiano au kusudi, si lazima utunzi pekee.
lexical_decisions:
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kihusishi לְ kinaweza kuonyesha utunzi, uhusiano, au kusudi. Katika kichwa cha zaburi, “ya Daudi” ni lugha ya kawaida na haifungi maana kwa “iliyoandikwa na Daudi” pekee; uwezekano wa kusudi umeonyeshwa katika tanbihi.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa utungo wa kuimbwa unaotajwa na מִזְמוֹר.
- source_word: לַיהוָה
  choice: ni mali ya Yahwe
  rationale: Kifungu cha Kiebrania hakina kitenzi na kinaonyesha umiliki. “Ni mali ya” ni Kiswahili cha asili kinachoeleza wazi kuwa dunia ni yake.
- source_word: הָאָרֶץ
  choice: Dunia
  rationale: Ingawa אֶרֶץ pia linaweza kumaanisha nchi, ulinganifu wake na תֵּבֵל na upeo wa kauli hii unaunga mkono maana ya dunia yote.
- source_word: וּמְלוֹאָהּ
  choice: na vyote vilivyomo ndani yake
  rationale: Hii inawasilisha kwa Kiswahili cha kawaida maana ya ‘ujazo wake,’ yaani vitu vyote vilivyo ndani ya dunia, bila kutumia tamko gumu lisilo la kawaida.
- source_word: תֵּבֵל
  choice: ulimwengu
  rationale: תֵּבֵל humaanisha ulimwengu, hasa ulimwengu unaokaliwa na watu; mstari unaofuata kuhusu wakaaji wake unaendeleza wazo hilo.
- source_word: וְיֹשְׁבֵי בָהּ
  choice: na wote wanaokaa ndani yake
  rationale: Tafsiri hii inadumisha nguvu ya kitenzi katika umbo la Kiebrania na ni ya kawaida katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia moja kwa moja jina la agano יְהוָה. “Yahwe” linadumisha jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Aina ya umiliki katika לַיהוָה הָאָרֶץ וּמְלוֹאָהּ
  choice: Dunia na vyote vilivyomo ndani yake ni mali ya Yahwe
  alternative: Dunia ni ya Yahwe, pamoja na vyote vilivyomo ndani yake
  rationale: Chaguo hili linaweka “dunia na vyote vilivyomo” pamoja kama kiima ambatani, kulingana na muundo wa Kiebrania, bila kubadili madai ya umiliki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kishairi umehifadhiwa kwa mistari miwili inayolingana; “ni mali ya” limetumiwa kwa uwazi na uasili.
