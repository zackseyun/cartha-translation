  variant: Standard East African Swahili
source:
  edition: WLC
  text: שְׂא֤וּ שְׁעָרִ֨ים רָֽאשֵׁי/כֶ֗ם וְֽ֭/הִנָּשְׂאוּ פִּתְחֵ֣י עוֹלָ֑ם וְ֝/יָב֗וֹא מֶ֣לֶךְ הַ/כָּבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/007.yaml
  text: Lift up your heads[a], O gates, and be lifted up, O ancient doors, that the King of glory may come in.
translation:
  language: sw
  text: 'Inueni vichwa vyenu, enyi malango;

    inuliweni, enyi milango ya kale[a],

    ili Mfalme wa utukufu aingie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “milango ya milele.” Neno la Kiebrania linaweza kumaanisha kitu cha tangu zamani za kale au chenye kudumu milele.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: Inueni
  rationale: Ni amri ya wingi inayoyaelekea malango yaliyohuishwa kishairi. “Inueni” huhifadhi tendo la kuinua na nguvu ya amri.
- source_word: שְׁעָרִים
  choice: malango
  rationale: “Malango” ni neno la kawaida kwa maingilio makubwa kama ya mji au hekalu, na linatofautishwa hapa na “milango” katika mstari unaofuata.
- source_word: רָאשֵׁיכֶם
  choice: vichwa vyenu
  rationale: Hii ndiyo maana ya moja kwa moja na inadumisha uhuishaji wa kishairi wa malango, badala ya kuibadili kuwa maelezo ya sehemu zake za juu.
- source_word: וְהִנָּשְׂאוּ
  choice: inuliweni
  rationale: Umbo la Kiebrania lina maana ya kutendwa au kujitokeza kwa tendo. “Inuliweni” huhifadhi mwangwi wa kitenzi cha kwanza na tofauti yake ya kisarufi.
- source_word: פִּתְחֵי עוֹלָם
  choice: milango ya kale
  rationale: “Milango” inafaa kama neno sambamba na “malango.” “Ya kale” huwasilisha maana ya kudumu tangu zamani, huku uwezekano wa maana ya umilele ukihifadhiwa katika tanbihi.
- source_word: וְיָבֹא
  choice: ili ... aingie
  rationale: Katika muktadha wa amri zilizotangulia, kiunganishi pamoja na kitenzi hiki kinaeleweka kwa kawaida kuwa cha kusudi au matokeo.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: Mfalme wa utukufu
  rationale: Muundo huu wa moja kwa moja huhifadhi hadhi ya cheo na uzito wa kishairi wa kirai cha Kiebrania.
theological_decisions:
- issue: Kuhifadhi uhuishaji wa malango na taswira ya kuingia kwa mfalme bila kuifungamanisha na tafsiri maalumu
  choice: Malango na milango yanaelekezewa maneno moja kwa moja, na “vichwa vyenu” inadumishwa.
  alternative: Kutafsiri kwa ufafanuzi kuwa watu waifungue milango.
  rationale: Kiebrania kinayaambia malango na milango moja kwa moja. Kudumisha taswira hiyo huhifadhi nguvu ya kishairi na kiliturujia bila kuingiza utambulisho mahususi wa kihistoria au wa kimasiya ambao mstari wenyewe hauutaji.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa heshima lakini kinachoeleweka kwa urahisi. Tofauti ya “malango” na “milango” imetumiwa kuakisi maneno mawili yanayolingana katika Kiebrania. Alama ya tanbihi [a] imewekwa moja kwa moja baada ya kirai kinachohusika.
