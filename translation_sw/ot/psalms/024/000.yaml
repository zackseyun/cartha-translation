base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/000.yaml
  text: A psalm of David[a]. Yahweh's is the earth and its fullness[b], the world and those who dwell in it.
translation:
  language: sw
  text: 'Zaburi ya Daudi.[a]


    Dunia na vyote vilivyomo ni vya Yahwe;

    ulimwengu na wote wanaokaa ndani yake.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Zaburi kwa ajili ya Daudi.” Kiebrania kinaweza pia kumaanisha zaburi iliyoandikwa na Daudi au inayohusishwa naye.'
    reason: superscription_ambiguity
  - marker: b
    text: 'Kiebrania kwa neno: “dunia na ujazo wake.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Neno la kawaida na lenye hadhi kwa wimbo wa ibada unaoambatana na muziki.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Huhifadhi uhusiano mpana unaoonyeshwa na kihusishi לְ bila kulazimisha maana ya uandishi pekee; uwezekano mwingine umeonyeshwa katika tanbihi.
- source_word: לַיהוָה
  choice: ni vya Yahwe
  rationale: Huonyesha umiliki uliosisitizwa kwa kuwekwa mwanzoni katika Kiebrania, huku jina la agano יהוה likitolewa kama Yahwe.
- source_word: הָאָרֶץ וּמְלוֹאָהּ
  choice: Dunia na vyote vilivyomo
  rationale: Ni Kiswahili cha sasa na cha kawaida kinachoeleza maana ya dunia pamoja na ujazo wake, yaani kila kilichomo ndani yake.
- source_word: תֵּבֵל
  choice: ulimwengu
  rationale: Hutofautisha neno hili la kishairi linalomaanisha ulimwengu unaokaliwa na watu na הָאָרֶץ katika mstari wa kwanza.
- source_word: וְיֹשְׁבֵי בָהּ
  choice: na wote wanaokaa ndani yake
  rationale: Hufuata maana ya kisarufi ya washiriki wote wanaoishi katika ulimwengu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Jina binafsi limetafsiriwa kwa umbo la Kiswahili linalokaribia matamshi yake badala ya kulibadilisha kuwa cheo.
- issue: Maana ya לְ katika kichwa לְדָוִד
  choice: ya Daudi
  alternative: kwa ajili ya Daudi
  rationale: Kiebrania kinaweza kuonyesha uandishi, uhusiano, au kuwekwa wakfu; tafsiri kuu inabaki pana na tanbihi inahifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wa hadhi. Mistari miwili imehifadhi usambamba wa Kiebrania bila kufanya sentensi kuwa ngumu kwa msomaji wa kawaida.
