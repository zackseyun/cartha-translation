  text: 'Hiki ndicho kizazi cha wale wanaomtafuta,

    wanaotafuta uso wako, ee Yakobo.[a]

    Sela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ee Yakobo.” Baadhi ya tafsiri za kale husoma, “uso wa Mungu wa Yakobo.”'
    reason: Inaonyesha ugumu wa matini ya Kimasoreti na usomaji mbadala wa kale bila kuongeza “Mungu wa” katika matini kuu.
lexical_decisions:
- source_word: זֶה דּוֹר
  choice: Hiki ndicho kizazi
  rationale: Muundo huu unaonyesha sifa ya kundi linalotajwa, huku ukihifadhi taswira ya Kiebrania ya ‘kizazi’ badala ya kuibadili kuwa dhehebu au jamii maalumu.
- source_word: דֹּרְשָׁיו
  choice: wale wanaomtafuta
  rationale: Kiwakilishi cha nafsi ya tatu katika Kiebrania kimehifadhiwa; rejea yake inaeleweka kutokana na muktadha uliotangulia.
- source_word: מְבַקְשֵׁי פָנֶיךָ
  choice: wanaoutafuta uso wako
  rationale: Tafsiri hii inahifadhi nahau ya Kiebrania ‘kutafuta uso,’ yenye maana ya kutafuta uwepo au kukubaliwa na mtu, bila kuifafanua kupita kiasi ndani ya matini.
- source_word: יַעֲקֹב
  choice: ee Yakobo
  rationale: Matini ya Kiebrania ya Kimasoreti ina ‘Yakobo’ bila neno ‘Mungu’; imewasilishwa kama mwito wa moja kwa moja, ingawa muundo huo una ugumu wa kisintaksia na unaweza kueleweka kwa namna nyingine.
- source_word: סֶלָה
  choice: Sela
  rationale: Neno la kiibada au kimuziki lisilo na maana iliyothibitishwa kwa uhakika limenukuliwa kwa sauti badala ya kutafsiriwa kwa kubahatisha.
theological_decisions:
- issue: Je, ‘Yakobo’ iongezwe kuwa ‘Mungu wa Yakobo’?
  choice: ee Yakobo
  alternative: Mungu wa Yakobo
  rationale: Kiebrania cha Kimasoreti hakina neno ‘Mungu.’ Kuongeza ‘Mungu wa’ kungeondoa ugumu halisi wa matini na kufuata usomaji wa baadhi ya mapokeo ya kale badala ya matini kuu iliyotolewa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa kishairi umehifadhiwa, na nahau muhimu ya ‘kutafuta uso’ haijarahisishwa kupita kiasi.
