id: PSA.24.8
reference: Psalms 24:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: מִ֥י זֶה֮ מֶ֤לֶךְ הַ/כָּ֫ב֥וֹד יְ֭הוָה עִזּ֣וּז וְ/גִבּ֑וֹר יְ֝הוָ֗ה גִּבּ֥וֹר מִלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/008.yaml
  text: Who is this King of glory? Yahweh[a], strong and mighty; Yahweh, mighty in battle.
translation:
  language: sw
  text: Ni nani huyu Mfalme wa utukufu? Yahwe, mwenye nguvu na hodari; Yahwe, hodari vitani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shujaa wa vita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: Ni nani huyu
  rationale: Muundo huu wa Kiswahili unaendeleza swali la moja kwa moja na mtindo wa mwitiko wa kiliturujia wa zaburi.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: Mfalme wa utukufu
  rationale: Huhifadhi muundo wa Kiebrania na uzito wa usemi kama cheo, badala ya kuugeuza kuwa kivumishi tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni namna ya kawaida ya Kiswahili ya kuandika jina la Mungu YHWH, na huhifadhi jina binafsi badala ya kulibadilisha kuwa cheo.
- source_word: עִזּוּז וְגִבּוֹר
  choice: mwenye nguvu na hodari
  rationale: 'Hutofautisha maneno mawili yanayokaribiana: עִזּוּז huonyesha nguvu, na גִבּוֹר huonyesha uhodari au uwezo mkuu.'
- source_word: גִּבּוֹר מִלְחָמָה
  choice: hodari vitani
  rationale: Ni Kiswahili cha asili kinachohifadhi maana ya kuwa mwenye uwezo mkubwa katika mapambano bila kuongeza waziwazi nomino ‘shujaa’.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu lenye herufi nne, si cheo; kwa hiyo jina hilo limehifadhiwa kwa umbo la Kiswahili.
- issue: Taswira ya Mungu katika vita
  choice: hodari vitani
  alternative: shujaa wa vita
  rationale: Tafsiri kuu hudumisha maelezo ya Kiebrania bila kuyageuza moja kwa moja kuwa nomino, huku tanbihi ikionyesha uwezekano huo wa kileksika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Urudiaji wa ‘Yahwe’ na ulinganifu wa mistari umehifadhiwa.
