base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/004.yaml
  text: The one who has clean hands and a pure heart[c][b][a], who has not lifted up his soul to falsehood or sworn deceitfully.
translation:
  language: sw
  text: Ni mtu mwenye mikono safi na moyo safi, ambaye hajaiinua nafsi yangu[a] kwa ubatili[b], wala hajaapa kwa udanganyifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema “nafsi yangu.” Tafsiri nyingi hufuata usomaji mwingine, “nafsi yake,” unaolingana na maelezo ya mtu wa tatu katika mstari wote.
    reason: textual_variant
  - marker: b
    text: Au “uongo,” “kilicho cha uongo,” au “kisicho na thamani”; wengine huelewa neno hili kuwa linarejelea sanamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְקִי כַפַּיִם
  choice: mwenye mikono safi
  rationale: Huhifadhi taswira halisi ya mikono iliyo safi kama ishara ya mwenendo usio na hatia, na ni Kiswahili cha kawaida na kinachoeleweka.
- source_word: בַר לֵבָב
  choice: moyo safi
  rationale: Hueleza usafi wa ndani wa kimaadili na kudumisha ulinganifu kati ya matendo ya nje (‘mikono’) na hali ya ndani (‘moyo’).
- source_word: נָשָׂא ... נַפְשִׁי
  choice: hajainua nafsi yangu
  rationale: Hufuata kwa uwazi maandishi ya WLC yenye kiambishi cha nafsi ya kwanza, ‘yangu,’ na kuhifadhi sitiari ya Kiebrania ya kuinua nafsi bila kuondoa ugumu halisi wa maandishi.
- source_word: לַשָּׁוְא
  choice: kuelekea ubatili
  rationale: שָׁוְא inaweza kumaanisha ubatili, uongo, au kitu kisicho na thamani. ‘Ubatili’ huhifadhi upana wa maana bila kuamua kimya kimya kuwa neno hilo linamaanisha sanamu au uongo pekee.
- source_word: נִשְׁבַּע לְמִרְמָה
  choice: hajaapa kwa udanganyifu
  rationale: Hutoa maana ya kuapa kwa njia ya udanganyifu au kwa kusudi la kudanganya, kwa Kiswahili cha asili na chenye uzito unaofaa.
theological_decisions:
- issue: Kiambishi katika נַפְשִׁי (‘nafsi yangu’) dhidi ya usomaji unaolingana na muktadha, ‘nafsi yake’
  choice: Maandishi makuu yanatumia ‘nafsi yangu’ kulingana na WLC/MT iliyotolewa.
  alternative: ‘nafsi yake,’ ambayo inalingana kwa urahisi zaidi na maelezo yote ya mtu wa tatu katika mstari huu.
  rationale: Ingawa ‘nafsi yake’ ni laini zaidi kimuktadha na hutumiwa katika tafsiri nyingi, chanzo kilichotolewa kinasema ‘nafsi yangu.’ Kuhifadhi usomaji huo katika maandishi makuu na kuweka mbadala katika tanbihi kunadumisha ushahidi wa chanzo na mvutano wa kimaandishi bila kuutatua kimya kimya.
- issue: Maana ya שָׁוְא
  choice: ubatili
  alternative: uongo; kilicho cha uongo; sanamu
  rationale: Neno lina wigo unaojumuisha utupu, ubatili, uongo, na kutokuwa na thamani. Muktadha wa maadili unaweza kuunga mkono ‘uongo,’ na wengine hulihusisha na sanamu, lakini ‘ubatili’ huhifadhi utata wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘Ni mtu mwenye…’ unaendeleza jibu la mstari uliotangulia. Lugha inadumisha taswira za Kiebrania za mikono, moyo, na kuinua nafsi, huku tanbihi zikihifadhi tofauti muhimu ya maandishi na upana wa maana wa שָׁוְא.
