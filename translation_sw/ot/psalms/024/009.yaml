source:
  edition: WLC
  text: שְׂא֤וּ שְׁעָרִ֨ים רָֽאשֵׁי/כֶ֗ם וּ֭/שְׂאוּ פִּתְחֵ֣י עוֹלָ֑ם וְ֝/יָבֹא מֶ֣לֶךְ הַ/כָּבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/009.yaml
  text: Lift up your heads[a], O gates, and be lifted up, O ancient doors, that the King of glory may come in.
translation:
  language: sw
  text: Enyi malango, inueni vichwa vyenu; na jiinueni, enyi milango ya kale[a], ili Mfalme wa utukufu aingie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “milango ya milele.” Neno la Kiebrania linaweza kumaanisha milango ya zamani sana au yenye kudumu kwa muda usio na mwisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: inueni
  rationale: Kitenzi cha amri katika wingi kinachoyaelekea malango kwa njia ya tashihisi. “Inueni” kinahifadhi picha ya kuinua na marudio ya kishairi.
- source_word: שְׁעָרִים
  choice: malango
  rationale: Neno hili hutaja malango makubwa ya kuingilia, kama ya mji au hekalu. “Malango” ni Kiswahili cha kawaida bila kuongeza mahali pasipotajwa wazi.
- source_word: רָאשֵׁיכֶם
  choice: vichwa vyenu
  rationale: Hii ndiyo maana ya moja kwa moja ya Kiebrania. Tafsiri inadumisha tashihisi ya malango yenye vichwa badala ya kuibadili kuwa maelezo ya usanifu.
- source_word: וּשְׂאוּ
  choice: inuliweni
  rationale: Amri iliyorudiwa inaeleweka hapa kwa maana ya kutendwa au kujifungua juu. “Inuliweni” ni ya asili katika Kiswahili na inadumisha mwito wa kishairi.
- source_word: פִּתְחֵי עוֹלָם
  choice: milango ya kale
  rationale: עוֹלָם inaweza kuonyesha zamani za kale, muda mrefu, au umilele. Katika muktadha huu wa kishairi na wa usanifu, “milango ya kale” ni wazi na ya kawaida; uwezekano wa “milango ya milele” umehifadhiwa katika tanbihi.
- source_word: וְיָבֹא
  choice: ili ... aingie
  rationale: 'Kitenzi kinachofuata amri kinaonyesha kusudi au matokeo: malango yainuliwe ili mfalme aingie.'
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: Mfalme wa utukufu
  rationale: Muundo huu unahifadhi kirai unganishi cha Kiebrania na hadhi ya cheo hiki cha kishairi bila kukifafanua kuwa tu “Mfalme mtukufu.”
theological_decisions:
- issue: Kuhifadhi tashihisi ya malango yenye “vichwa”
  choice: “Enyi malango, inueni vichwa vyenu”
  alternative: “Fungukeni kabisa, enyi malango”
  rationale: Kiebrania kinataja “vichwa vyenu” waziwazi na kuyapa malango sifa za viumbe. Kuhifadhi picha hiyo kunadumisha nguvu ya kishairi na ya kiliturujia ya mstari.
- issue: Maana ya עוֹלָם katika פִּתְחֵי עוֹלָם
  choice: “milango ya kale” katika matini kuu
  alternative: “milango ya milele”
  rationale: Neno hilo linaweza kuelekea kwenye ukale au kudumu. “Ya kale” linafaa kwa muktadha wa milango bila kudai kwamba milango yenyewe ni ya milele, huku tafsiri nyingine halali ikihifadhiwa katika tanbihi.
- issue: Uhusiano wa וְיָבֹא na amri zinazotangulia
  choice: 'Kutafsiri kama kusudi: “ili ... aingie”'
  alternative: 'Kutafsiri kama matokeo ya moja kwa moja: “naye ... ataingia”'
  rationale: Muundo wa Kiebrania unaweza kubeba kusudi au matokeo. “Ili” unaonyesha kwa kawaida sababu ya mwito kwa malango bila kuongeza dai la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Tashihisi na urudiaji wa Kiebrania zimehifadhiwa; “malango” na “milango” zinatofautisha kwa kiasi aina mbili za maneno ya chanzo bila kulazimisha maelezo ya usanifu.
