  text: מִ֤י ה֣וּא זֶה֮ מֶ֤לֶךְ הַ/כָּ֫ב֥וֹד יְהוָ֥ה צְבָא֑וֹת ה֤וּא מֶ֖לֶךְ הַ/כָּב֣וֹד סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/010.yaml
  text: Who is this King of glory? Yahweh of hosts—he is the King of glory[b][a]. Selah
translation:
  language: sw
  text: Ni nani huyu Mfalme wa utukufu? Yahwe wa majeshi[a]—yeye ndiye Mfalme wa utukufu. Sela[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe wa majeshi ya mbinguni.” Cheo hiki cha Kiebrania kinaweza kurejelea kwa upana majeshi ya mbinguni au nguvu zilizopangwa.
    reason: lexical_alternative
  - marker: b
    text: “Sela” huenda ni alama ya kimuziki au ya kiliturujia; maana yake kamili haijulikani.
    reason: cultural_note
lexical_decisions:
- source_word: מִי הוּא זֶה
  choice: Ni nani huyu
  rationale: Muundo huu wa Kiswahili ni wa kawaida na unahifadhi nguvu ya swali la mkazo katika Kiebrania.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: Mfalme wa utukufu
  rationale: Tafsiri hii inahifadhi muundo wa Kiebrania na maana ya כָּבוֹד kama utukufu, heshima, au uzito wa hadhi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna iliyozoeleka katika Kiswahili badala ya kubadilishwa kuwa cheo kama BWANA.
- source_word: צְבָאוֹת
  choice: wa majeshi
  rationale: Neno hili ni la asili na linaloeleweka katika Kiswahili, huku likiacha wazi ikiwa majeshi yanayokusudiwa ni ya mbinguni au nguvu nyingine zilizo chini ya amri ya Mungu.
- source_word: הוּא
  choice: yeye ndiye
  rationale: Huhifadhi mkazo wa kiwakilishi cha Kiebrania na utambulisho wenye nguvu bila kuongeza wazo la ‘peke yake’ lisilotajwa wazi.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya istilahi hii haijulikani; imenukuliwa kwa herufi za Kiswahili badala ya kutafsiriwa kwa kubahatisha.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Kiebrania kinatumia jina binafsi la Mungu. Kulihifadhi kama Yahwe huepuka kulibadilisha kuwa cheo na kufuata umbo la kawaida la jina hilo katika Kiswahili.
- issue: Uwasilishaji wa cheo יְהוָה צְבָאוֹת
  choice: Yahwe wa majeshi
  alternative: Yahwe wa majeshi ya mbinguni; BWANA wa majeshi
  rationale: ‘Wa majeshi’ ni pana kama neno la Kiebrania na hailazimishi maelezo mahususi kuhusu aina ya majeshi yanayokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Alama za tanbihi zimepangwa baada ya maneno yanayohusika, na ‘Sela’ imewekwa mwishoni kulingana na mpangilio wa Kiebrania.
