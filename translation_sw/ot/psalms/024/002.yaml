  text: For he founded it upon the seas[a], and established it upon the rivers.
translation:
  language: sw
  text: 'Kwa maana yeye aliutia msingi wake juu ya bahari,

    na aliifanya imara juu ya mito.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya dai la mstari uliotangulia na inasikika kwa kawaida katika ushairi wa Kiswahili.
- source_word: הוּא
  choice: yeye
  rationale: Kiwakilishi huru cha Kiebrania kimewakilishwa ili kudumisha msisitizo wa wazi kwa mtendaji.
- source_word: עַל יַמִּים
  choice: juu ya bahari
  rationale: Neno יַמִּים ni wingi wa 'bahari'; tafsiri hii inadumisha taswira ya kishairi ya dunia kuwekwa juu ya maji bila kuifafanua kwa sayansi ya kisasa.
- source_word: יְסָדָהּ
  choice: aliiweka misingi
  rationale: Kitenzi יסד humaanisha kuweka msingi au kuasisi; kiambishi cha kike kinarejelea dunia katika mstari wa 1. Muundo huu ni wa asili katika Kiswahili na unadumisha taswira ya msingi.
- source_word: וְעַל נְהָרוֹת
  choice: na ... juu ya mito
  rationale: Inahifadhi usambamba wa kishairi; נְהָרוֹת kwa kawaida ni 'mito,' hata kama katika muktadha huu inaweza kuashiria mikondo au vilindi vya maji.
- source_word: יְכוֹנְנֶהָ
  choice: kuithibitisha
  rationale: Kitenzi כון hapa huonyesha kufanya kitu kiwe imara au kukiweka kwa uthabiti; 'kuithibitisha' kinatofautisha maana yake na tendo la kuweka misingi katika kishazi cha kwanza.
theological_decisions:
- issue: Taswira ya kikosmolojia ya dunia juu ya bahari na mito
  choice: Kudumisha moja kwa moja lugha ya kishairi kuhusu dunia kuwekwa juu ya bahari na kuthibitishwa juu ya mito.
  alternative: Kuifanya taswira hiyo kuwa lugha ya jumla kuhusu uthabiti wa dunia au kuibadili ili ilingane na maelezo ya kisayansi ya kisasa.
  rationale: Kiebrania kinatumia taswira ya kishairi ya uumbaji. Tafsiri haipaswi kuondoa taswira hiyo wala kuamua kama ni ya moja kwa moja au ya kitamathali zaidi ya ushahidi wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Usambamba wa mistari miwili umehifadhiwa; 'bahari' limetumika kama nomino ya jumla ya wingi kulingana na matumizi ya kawaida ya Kiswahili.
