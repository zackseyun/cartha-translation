  text: אִם לֹ֤א שִׁוִּ֨יתִי וְ/דוֹמַ֗מְתִּי נַ֫פְשִׁ֥/י כְּ֭/גָמֻל עֲלֵ֣י אִמּ֑/וֹ כַּ/גָּמֻ֖ל עָלַ֣/י נַפְשִֽׁ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/131/002.yaml
  text: Surely I have calmed and quieted my soul[a], like a weaned child with his mother[c][b]; like a weaned child is my soul within me.
translation:
  language: sw
  text: Hakika nimeituliza na kuinyamazisha nafsi yangu[a], kama mtoto aliyeachishwa kunyonya alivyo pamoja na mama yake[b][c]; kama mtoto aliyeachishwa kunyonya, ndivyo nafsi yangu ilivyo ndani yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ikiwa kwa kweli sijaisawazisha na kuinyamazisha nafsi yangu.” Mwanzo wa Kiebrania ni msemo wa kusisitiza, ambao hapa umetafsiriwa “Hakika.”
    reason: lexical_alternative
  - marker: b
    text: Picha ni ya mtoto ambaye hahangaiki tena kutaka kunyonya, bali ametulia pamoja na mama yake.
    reason: cultural_note
  - marker: c
    text: Au, “kama mtoto aliyeachishwa kunyonya, nafsi yangu iko juu yangu.” Usemi wa Kiebrania ni mgumu; “ndani yangu” hutoa maana inayowezekana kwa Kiswahili cha kawaida.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לֹא
  choice: Hakika
  rationale: Katika muktadha huu maneno haya yanafanya kazi kama kauli ya kusisitiza, si kama sharti la kawaida. “Hakika” huwasilisha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: שִׁוִּיתִי
  choice: nimeituliza
  rationale: Kitenzi hapa kinaeleza kuiweka nafsi katika hali tulivu na iliyotulia, badala ya maana halisi ya ‘kusawazisha.’
- source_word: וְדוֹמַמְתִּי
  choice: na kuinyamazisha
  rationale: Kitenzi kina maana ya kufanya kitu kitulie au kinyamaze. Uchaguzi huu unadumisha tendo la makusudi na ulinganifu wake na ‘nimeituliza.’
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: Hapa נֶפֶשׁ inahusu mtu wa ndani au nafsi ya mtunga zaburi. “Nafsi yangu” inadumisha lugha ya kishairi ya Zaburi bila kulazimisha mgawanyo wa kiufundi kati ya mwili na roho.
- source_word: כְּגָמֻל
  choice: kama mtoto aliyeachishwa kunyonya
  rationale: Umbo hili humaanisha mtoto ambaye tayari ameondolewa maziwa ya mama. Tafsiri inaweka wazi picha ya mtoto mdogo aliyetulia.
- source_word: עֲלֵי אִמּוֹ
  choice: akiwa kwa mama yake
  rationale: Kihusishi kinaonyesha ukaribu wa mtoto anayepumzika pamoja na mama yake; “kwa mama yake” ni cha asili katika Kiswahili na hakifungi maana kwenye kuwa juu yake kimwili.
- source_word: כַּגָּמֻל עָלַי נַפְשִׁי
  choice: kama mtoto aliyeachishwa kunyonya, ndivyo ilivyo nafsi yangu ndani yangu
  rationale: Kishazi hiki kinarudia na kukazia tashbihi. “Ndani yangu” hutoa maana inayowezekana kwa Kiswahili cha asili, huku tanbihi ikihifadhi muundo mgumu wa Kiebrania unaoweza kutafsiriwa ‘juu yangu.’
theological_decisions:
- issue: Maana ya kianthropolojia ya נַפְשִׁי
  choice: nafsi yangu
  alternative: utu wangu wa ndani; mimi mwenyewe
  rationale: Mstari unaeleza hali ya ndani ya mtunga zaburi. “Nafsi” inadumisha kina cha lugha ya Biblia bila kudai fundisho maalumu la kwamba mwanadamu amegawanyika katika sehemu mbili.
- issue: Hali ya mtoto aliyeachishwa kunyonya
  choice: Picha ya mtoto aliyetulia kwa mama yake
  alternative: Picha ya mtoto anayesumbuka kwa sababu ameondolewa maziwa
  rationale: Muktadha wa vitenzi ‘kutuliza’ na ‘kunyamazisha’ unaunga mkono picha ya mtoto ambaye sasa ametulia; hata hivyo, tafsiri haiongezi moja kwa moja maelezo ya hisia ambayo hayajasemwa katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya “mtoto aliyeachishwa kunyonya” yamehifadhiwa kwa sababu ni sehemu ya msisitizo wa kishairi wa Kiebrania.
