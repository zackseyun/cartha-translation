base_translation:
  language: en
  yaml_path: translation/ot/psalms/131/001.yaml
  text: 'A Song of Ascents[a]. Of David.

    Yahweh, my heart is not proud, and my eyes are not raised high[b]; I have not walked in things too great and too wondrous for me.'
translation:
  language: sw
  text: 'Wimbo wa Kupanda[a]. Wa Daudi.


    Yahweh, moyo wangu hauna kiburi, wala macho yangu hayajainuliwa juu; sikujihusisha na mambo makubwa, wala na mambo ya ajabu yanayonizidi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wimbo wa Mapando.” “Wa Daudi” pia inaweza kumaanisha “Ulioandikwa na Daudi” au “Kwa ajili ya Daudi.”
    reason: alternative_reading
  - marker: b
    text: Yaani mambo yanayopita upeo, nafasi, au uwezo unaomfaa msemaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa Kupanda
  rationale: Huhifadhi maana ya msingi ya kupanda na hutumika kwa kawaida kama kichwa cha mkusanyo huu wa zaburi, bila kufafanua kwa uhakika aina ya kupanda inayokusudiwa.
- source_word: לְדָוִד
  choice: Wa Daudi
  rationale: Kihusishi cha Kiebrania kinaweza kuonyesha utunzi, uhusiano, au wakfu; “Wa Daudi” huhifadhi utata huo vizuri kuliko “Ulioandikwa na Daudi” au “Kwa ajili ya Daudi.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika maandishi ya Kiebrania limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: גָבַהּ לִבִּי
  choice: moyo wangu hauna kiburi
  rationale: Kifungu hiki kwa maana halisi husema moyo kuwa juu, lakini katika muktadha ni nahau ya kiburi; tafsiri hii ni ya asili na wazi katika Kiswahili.
- source_word: רָמוּ עֵינַי
  choice: macho yangu hayajainuliwa juu
  rationale: Huhifadhi taswira ya macho yaliyoinuliwa huku ikidokeza mtazamo wa kujikweza bila kuufafanua kupita kiasi.
- source_word: הִלַּכְתִּי
  choice: sijishughulishi
  rationale: Kitenzi cha kutembea hapa kinaweza kueleza mwenendo au kujihusisha na mambo fulani. “Sijishughulishi” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: בִּגְדֹלוֹת
  choice: na mambo yaliyo makubwa mno
  rationale: Kivumishi cha wingi kilichotumiwa kama nomino hurejelea mambo makubwa yanayozidi upeo unaofaa wa msemaji.
- source_word: וּבְנִפְלָאוֹת
  choice: wala na mambo ya ajabu
  rationale: Neno hilo hurejelea mambo ya ajabu, ya kushangaza, au yaliyo nje ya uwezo wa kawaida; “mambo ya ajabu” ni fasaha na linaacha upeo wa maana wazi.
- source_word: מִמֶּנִּי
  choice: yanayonizidi
  rationale: Huonyesha kwamba mambo hayo yanapita kipimo, nafasi, au uwezo wa msemaji; “yanayonizidi” ni ya asili na huhifadhi wazo hili.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina la agano moja kwa moja; kutumia “Yahweh” huhifadhi jina hilo badala ya kulibadilisha na cheo.
- issue: Maana ya לְדָוִד katika kichwa
  choice: Wa Daudi
  alternative: Ulioandikwa na Daudi / Kwa ajili ya Daudi
  rationale: Kihusishi hakiamui kwa uhakika kama kinamaanisha utunzi, uhusiano, au wakfu, hivyo “Wa Daudi” huhifadhi utata wa maandishi.
- issue: Upeo wa mambo makubwa na ya ajabu
  choice: mambo ... yanayonizidi
  alternative: mambo yaliyo juu ya cheo changu
  rationale: Kiebrania kinaweza kuhusisha uwezo au nafasi inayomfaa msemaji. Tafsiri iliyochaguliwa haifungi maana katika uwezo wa kiakili pekee wala katika hadhi ya kijamii pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Taswira ya moyo na macho imehifadhiwa; nahau ya kutembea imewasilishwa kwa “kujishughulisha” ili iwe ya asili. Alama zote za tanbihi zimewekwa katika matini kuu.
