  yaml_path: translation/ot/psalms/131/003.yaml
  text: Israel[a], hope in Yahweh from now and forever.
translation:
  language: sw
  text: Israeli na amtumaini Yahwe tangu sasa na hata milele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Enyi Israeli, mtumainini Yahwe tangu sasa na hata milele.”
    reason: Usomaji mbadala unaowasilisha kitenzi cha Kiebrania kama mwito wa moja kwa moja kwa Israeli.
lexical_decisions:
- source_word: יַחֵל
  choice: mtumaini
  rationale: Kitenzi ni umbo la himizo (jussive/imperfect) linalotoa mwito wa kuwa na tumaini na kumtegemea Yahwe; wingi wa amri unafaa kwa Israeli kama jamii.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la watu wa agano limetoholewa kwa umbo la kawaida la Kiswahili; hapa linatumiwa kama mwito wa moja kwa moja.
- source_word: אֶל
  choice: kwa (iliyomo katika ‘mtumaini Yahwe’)
  rationale: Ingawa maana ya msingi ni ‘kuelekea/kwenda kwa,’ pamoja na יחל huonyesha yule ambaye tumaini linawekwa kwake. Kiswahili cha asili hutumia ‘mtumaini’ na yambwa moja kwa moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo kama ‘BWANA.’
- source_word: מֵעַתָּה
  choice: tangu sasa
  rationale: Huwasilisha kwa kawaida mwanzo wa kipindi kinachotajwa.
- source_word: וְעַד עוֹלָם
  choice: na hata milele
  rationale: Nahau hii huonyesha muda usio na mwisho; ‘hata milele’ huhifadhi upeo wake wa kilele.
theological_decisions:
- issue: Namna ya kuwasilisha umbo la himizo יַחֵל
  choice: 'Mwito wa moja kwa moja: ‘Ee Israeli, mtumaini Yahwe’'
  alternative: 'Himizo la nafsi ya tatu: ‘Israeli na amtumaini Yahwe’'
  rationale: Kiebrania kinaweza kueleweka kama jussive ya nafsi ya tatu au kama himizo lenye nguvu ya amri. Mwito wa moja kwa moja ni wa asili katika Kiswahili na huhifadhi nguvu ya wito wa kijamii bila kufuta uwezekano mwingine, ambao umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ee’ inaweka wazi kwamba Israeli anasemeshwa moja kwa moja; ‘mtumaini’ ni amri ya wingi inayolenga taifa kama jamii.
