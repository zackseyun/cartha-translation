  text: A Song of Ascents[b][a]. Of David.
translation:
  language: sw
  text: 'Wimbo wa Kupandia. Wa Daudi.[a]


    Ee BWANA, moyo wangu haujajikweza,

    wala macho yangu hayajainuka.

    Sijishughulishi na mambo makuu,

    wala na mambo ya ajabu yanayonizidi.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kutungwa na Daudi” au “Kwa Daudi”; kichwa cha Kiebrania kinaweza kuonyesha uandishi, uhusiano, au wakfu.
    reason: alternative_reading
  - marker: b
    text: Yaani, mambo yaliyo nje ya nafasi au uwezo wangu; pia inaweza kutafsiriwa “mambo yaliyo makubwa mno kwangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa Kupandia
  rationale: Kichwa hiki kinadumisha wazo la kupanda lililo katika Kiebrania bila kubainisha kimya kimya ikiwa ni kupanda kwenda Yerusalemu, kupanda ngazi, au matumizi mengine ya mkusanyo huu wa zaburi.
- source_word: גָבַהּ לִבִּי
  choice: moyo wangu hauna kiburi
  rationale: Kifungu hiki halisi husema moyo haujainuka; Kiswahili cha kawaida huwasilisha sitiari hiyo kwa maana ya kutokuwa na kiburi.
- source_word: רָמוּ עֵינַי
  choice: macho yangu hayajivuni
  rationale: Huhifadhi taswira ya macho yaliyoinuka huku ikitoa maana yake ya majivuno katika Kiswahili kinachoeleweka.
- source_word: הִלַּכְתִּי בִּגְדֹלוֹת
  choice: Sijishughulishi na mambo makuu
  rationale: Kitenzi cha Kiebrania, kwa halisi 'sikutembea katika,' hapa kinaonyesha kujihusisha au kujitia katika mambo makuu.
- source_word: נִפְלָאוֹת מִמֶּנִּי
  choice: mambo ya ajabu yanayonizidi
  rationale: Nִפְלָאוֹת yanaweza kumaanisha mambo ya ajabu au ya kushangaza, na מִמֶּנִּי huonyesha kuwa yako nje ya uwezo au nafasi ya msemaji.
theological_decisions:
- issue: Maana ya לְדָוִד katika kichwa
  choice: Wa Daudi
  alternative: Na Daudi; Kwa ajili ya Daudi
  rationale: Kihusishi cha Kiebrania kinaweza kuonyesha uandishi, uhusiano, au wakfu. Tafsiri kuu inatumia muundo wa jadi usioamua kabisa, na tanbihi inahifadhi uwezekano mwingine.
- issue: Upeo wa mada zinazomzidi msemaji
  choice: mambo ya ajabu yanayonizidi
  alternative: mambo yaliyo makubwa mno kwangu
  rationale: Tafsiri haibainishi kwamba mambo hayo ni mafumbo ya kiroho pekee au majukumu ya kijamii pekee; inadumisha upana na mvutano wa usemi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mistari imepangwa kufuata usambamba wa shairi la Kiebrania. Jina la agano יהוה limewakilishwa kwa desturi iliyoenea ya “BWANA.”
