source:
  edition: WLC
  text: כַּ/צֹּ֤אן לִֽ/שְׁא֣וֹל שַׁתּוּ֮ מָ֤וֶת יִ֫רְעֵ֥/ם וַ/יִּרְדּ֘וּ בָ֤/ם יְשָׁרִ֨ים לַ/בֹּ֗קֶר ו/ציר/ם לְ/בַלּ֥וֹת שְׁא֗וֹל מִ/זְּבֻ֥ל לֽ/וֹ׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/014.yaml
  text: Like sheep they are appointed for Sheol[a]; death will shepherd them, and the upright will rule over them in the morning. Their form will waste away in Sheol[d][c][b], far from its lofty dwelling.
translation:
  language: sw
  text: Kama kondoo, wamewekwa kwa ajili ya Sheoli;[a] mauti itawachunga. Wanyofu watawatawala asubuhi.[b] Sheoli itaharibu umbo lao,[c] hata lisibaki na makao ya fahari.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheoli ni makao ya wafu; maana yake ni pana kuliko “kaburi.”
    reason: cultural_note
  - marker: b
    text: Au, “Wanyofu watakuwa na mamlaka juu yao wakati wa asubuhi.”
    reason: alternative_reading
  - marker: c
    text: Kiebrania cha maneno haya ni kigumu; “umbo lao” huenda pia kikamaanisha “mwamba wao” au “nguvu yao.”
    reason: lexical_alternative
  - marker: d
    text: Kifungu cha mwisho ni kigumu katika Kiebrania. Kwa tafsiri nyingine, “umbo lao litachakaa katika Sheoli, mbali na makao yake ya fahari,” au, “Sheoli itawateketeza kutoka katika makao yao ya fahari.”
    reason: alternative_reading
lexical_decisions:
- source_word: כַּצֹּאן
  choice: Kama kondoo
  rationale: Huhifadhi tashbihi ya kundi la kondoo na hali yao ya kuongozwa bila uwezo wa kujinusuru.
- source_word: לִשְׁאוֹל שַׁתּוּ
  choice: wamewekwa kwa ajili ya Sheoli
  rationale: שַׁתּוּ ina maana ya kuwekwa au kuamuliwa mahali; kifungu hiki kinaonyesha Sheoli kuwa mwisho wanaoelekezwa bila kuifanya kuwa kaburi la kimwili tu.
- source_word: מָוֶת יִרְעֵם
  choice: mauti itawachunga
  rationale: Kitenzi רעה ni kuchunga; tafsiri hii huhifadhi taswira yenye kejeli ya mauti kuwa mchungaji wao.
- source_word: וַיִּרְדּוּ בָם יְשָׁרִים
  choice: Wanyofu watawatawala
  rationale: יְשָׁרִים ni watu wanyofu, na kitenzi hapa kwa kawaida hueleza kutawala au kuwa na mamlaka juu ya wengine.
- source_word: לַבֹּקֶר
  choice: asubuhi
  rationale: Ni usemi wa wakati; hauelezi wazi ikiwa asubuhi hii ni ya kawaida au taswira ya mabadiliko yajayo.
- source_word: וְצוּרָם
  choice: Umbo lao
  rationale: Maandishi ya Kiebrania ni magumu. Katika muktadha, 'umbo lao' huungana kwa maana na kuchakaa, huku uwezekano wa 'mwamba/nguvu yao' ukihifadhiwa katika tanbihi.
- source_word: לְבַלּוֹת
  choice: litachakaa
  rationale: Mzizi בלה hueleza kuchakaa, kuharibika au kuisha; 'litachakaa' ni Kiswahili cha kawaida kinachohifadhi picha ya kudhoofika na kuharibika.
- source_word: מִזְּבֻל לוֹ
  choice: mbali na makao yao ya fahari
  rationale: זְבֻל inaweza kumaanisha makao yaliyoinuka au ya fahari. Sintaksia ya mwisho ni tata, hivyo tafsiri kuu hutoa maana inayoeleweka na tanbihi huhifadhi njia nyingine za kuisoma.
theological_decisions:
- issue: Tafsiri ya שְׁאוֹל
  choice: Sheoli
  alternative: kaburi; makao ya wafu
  rationale: Sheoli ni eneo la wafu katika fikra za Kiebrania na maana yake ni pana kuliko kaburi la mwili; kulitaja moja kwa moja huepuka kulazimisha mfumo wa baadaye wa mafundisho.
- issue: Maana ya 'asubuhi'
  choice: kuacha 'asubuhi' bila ufafanuzi wa ziada
  alternative: kuieleza kuwa ufufuo, hukumu, au ukombozi wa mwisho
  rationale: Andiko halifafanui wazi aina ya asubuhi inayokusudiwa, hivyo tafsiri haiamui mjadala wa kitheolojia ambao Kiebrania kimeuacha wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kondoo,” “mchunga,” na “mauti” huhifadhi taswira ya kishairi; “Sheoli” imeachwa kama istilahi ya ulimwengu wa Kiebrania na kufafanuliwa kwa tanbihi. Sentensi zimegawanywa kwa urahisi wa kusoma bila kuondoa uhusiano wa kishairi.
