lexical_decisions:
- source_word: אַל תִּירָא
  choice: Usiogope
  rationale: אַל pamoja na kitenzi cha hali isiyotimilika hutoa katazo; “Usiogope” ni tafsiri fupi, ya kawaida, na inayofaa ushairi.
- source_word: כִּי
  choice: anapokuwa / unapoongezeka
  rationale: Katika sehemu zote mbili כִּי hutambulisha hali inayoweza kusababisha hofu. Muundo wa “-napo-” unaonyesha maana ya wakati au hali bila kuifanya kuwa sababu.
- source_word: יַעֲשִׁר אִישׁ
  choice: mtu anapokuwa tajiri
  rationale: יַעֲשִׁר hapa ina maana isiyoelekezwa kwa kitu, yaani kuwa tajiri. “Mtu” hutoa maana ya jumla ya אִישׁ kwa Kiswahili cha kawaida.
- source_word: יִרְבֶּה
  choice: unapoongezeka
  rationale: Kitenzi רבה humaanisha kuongezeka au kuwa kwa wingi; “kuongezeka” ni cha asili pamoja na “utukufu”.
- source_word: כְּבוֹד
  choice: utukufu
  rationale: Neno linaweza kumaanisha utukufu, heshima, hadhi, au wingi wa mali. “Utukufu” huhifadhi taswira pana ya Kiebrania bila kuibana iwe mali pekee.
- source_word: בֵּיתוֹ
  choice: nyumba yake
  rationale: בַּיִת inaweza kumaanisha jengo, jamaa ya nyumbani, au milki. “Nyumba yake” huhifadhi taswira ya chanzo na utata wake halisi.
