lexical_decisions:
- source_word: גַּם ... גַּם
  choice: '... na ...'
  rationale: Urudiaji huu unajumuisha makundi yote mawili; katika Kiswahili, uunganishaji kwa “na” unaeleza hilo kwa kawaida bila kufanya mstari kuwa mzito.
- source_word: בְּנֵי אָדָם
  choice: watu wa hali ya chini
  rationale: Ikiwa imeoanishwa na בְּנֵי אִישׁ, nahau hii inaonyesha watu wenye hadhi ya chini, si uhusiano halisi wa kifamilia.
- source_word: בְּנֵי אִישׁ
  choice: watu wa hali ya juu
  rationale: Katika jozi hii ya kishairi, usemi huu unaonyesha watu wenye hadhi ya juu; tafsiri hii inalinda utofauti wa kijamii.
- source_word: יַחַד
  choice: pamoja
  rationale: Neno hili linaonyesha kwamba makundi yote yanatajwa kwa pamoja; kuwekwa mwishoni kunasikika kwa kawaida na kunaweza kuhusishwa na orodha nzima.
- source_word: עָשִׁיר
  choice: matajiri
  rationale: Ni kisawe cha kawaida na wazi katika jozi ya hali za kiuchumi.
- source_word: וְאֶבְיוֹן
  choice: na maskini
  rationale: Katika utofauti na matajiri, “maskini” ni tafsiri ya kawaida na ya moja kwa moja, ingawa neno la Kiebrania linaweza pia kumaanisha wahitaji.
