  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: kirai cha washiriki chenye maana ya “wale wanaotumainia,” kitu cha tumaini (mali yao), na tendo la kujisifu katika/kuhusu wingi wa utajiri wao. Tofauti ya kimakusudi kati ya חֵילָם (“mali”) na עָשְׁרָם (“utajiri”) imehifadhiwa.'
