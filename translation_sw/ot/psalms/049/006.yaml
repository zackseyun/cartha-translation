  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mali’ na ‘utajiri’ huhifadhi usambamba bila kutumia neno lilelile mara mbili. Kistari cha mwisho kinadumisha kwamba mstari huu unaendelea kisintaksia katika muktadha unaofuata.
