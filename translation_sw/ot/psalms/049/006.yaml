  text: those who trust in their wealth and boast in the abundance of their riches—[a][b]
translation:
  language: sw
  text: wale wanaotumainia mali yao na kujisifia wingi wa utajiri wao—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ‘kujivunia wingi wa utajiri wao.’
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania חַיִל linaweza pia kumaanisha ‘nguvu’ au ‘rasilimali,’ lakini hapa usambamba wake na ‘utajiri’ unaonyesha mali.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֹּטְחִים
  choice: wale wanaotumainia
  rationale: Kivumishi-tendo cha Qal chenye kiambishi bainishi kinatumika kama nomino, ‘wale wanaotumaini.’ ‘Wale wanaotumainia’ ni Kiswahili cha kawaida na hudumisha maana ya sifa au mwenendo unaoendelea.
- source_word: עַל
  choice: -ia (katika ‘wanaotumainia’)
  rationale: Pamoja na בטח, kihusishi hiki huonyesha kitu kinachotegemewa. Katika Kiswahili, maana hiyo hutolewa kwa kawaida kwa kitenzi ‘tumainia’ bila kutafsiri kihusishi kando.
- source_word: חֵילָם
  choice: mali yao
  rationale: חַיִל inaweza kumaanisha nguvu, jeshi, uwezo, rasilimali, au mali. Usambamba wake na ‘wingi wa utajiri wao’ unaonyesha maana ya mali katika muktadha huu.
- source_word: וּבְרֹב
  choice: na ... wingi wa
  rationale: רֹב huonyesha wingi au kiasi kikubwa. ‘Wingi wa’ ni usemi wa asili unaohifadhi usambamba wa kishairi.
- source_word: עָשְׁרָם
  choice: utajiri wao
  rationale: עֹשֶׁר humaanisha utajiri au mali. ‘Utajiri’ huitofautisha kwa kiasi na חֵילָם iliyotafsiriwa ‘mali,’ hivyo kuhifadhi utofauti wa kishairi.
- source_word: יִתְהַלָּלוּ
  choice: kujisifia
  rationale: Hitpael ya הלל hapa humaanisha kujisifu au kujivunia kitu. ‘Kujisifia’ ni wazi na ya kawaida, na muundo ‘kujisifia wingi wa’ unafikisha kitu wanachojivunia.
