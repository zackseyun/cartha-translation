  text: Lakini mwanadamu katika heshima hadumu[a]; yeye ni kama wanyama wanaoangamia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “halali usiku.” Usemi huo unamaanisha kwamba mwanadamu haendelei wala hadumu katika hali yake ya heshima.
