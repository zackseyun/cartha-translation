  text: פִּ֭/י יְדַבֵּ֣ר חָכְמ֑וֹת וְ/הָג֖וּת לִבִּ֣/י תְבוּנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/003.yaml
  text: My mouth will speak wisdom[a], and the meditation of my heart will be understanding.
translation:
  language: sw
  text: 'Kinywa changu kitanena hekima,[a]

    na tafakari ya moyo wangu itakuwa ufahamu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kiebrania, maneno yaliyotafsiriwa “hekima” na “ufahamu” yako katika umbo la wingi, lakini huenda yanatumika hapa kama nomino dhahania.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: kinywa changu
  rationale: Inahifadhi taswira halisi ya Kiebrania ya maneno kutoka kinywani, nayo ni ya kawaida katika Kiswahili.
- source_word: יְדַבֵּר
  choice: kitanena
  rationale: Kauli ya wakati ujao inaonyesha azimio la mtunga zaburi; 'kunena' ni neno la heshima na linaloeleweka katika muktadha huu wa kishairi.
- source_word: חָכְמוֹת
  choice: hekima
  rationale: Ingawa umbo la Kiebrania ni wingi, hapa linafanya kazi kama nomino dhahania; umoja 'hekima' ni wa asili katika Kiswahili.
- source_word: הָגוּת
  choice: tafakari
  rationale: Neno hili linaweza kumaanisha kutafakari moyoni au fikira ya ndani; 'tafakari' huhifadhi maana hiyo huku ikilingana na usemi wa kinywa katika mstari sambamba.
- source_word: לִבִּי
  choice: ya moyo wangu
  rationale: Inahifadhi uhusiano wa kisarufi na dhana ya kibiblia ya moyo kama kitovu cha fikira za ndani.
- source_word: תְבוּנוֹת
  choice: ufahamu
  rationale: Ingawa ni wingi katika Kiebrania, hapa huenda ni wingi wa dhahania; 'ufahamu' ni nomino ya asili inayohifadhi ulinganifu na 'hekima'.
