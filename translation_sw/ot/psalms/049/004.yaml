- source_word: אַטֶּה
  choice: nitalitega
  rationale: Katika muundo huu wa Hifili wa נטה pamoja na ‘sikio,’ Kiswahili cha kawaida hutumia nahau ‘kutega sikio,’ inayoonyesha kusikiliza kwa makini na kwa makusudi.
- source_word: לְמָשָׁל
  choice: kwa methali
  rationale: מָשָׁל inaweza kuwa methali, mfano, au usemi wa hekima. Katika muktadha huu wa zaburi ya hekima, ‘methali’ linafaa, huku uwezekano wa ‘mfano’ ukihifadhiwa katika tanbihi.
- source_word: אָזְנִי
  choice: sikio langu
  rationale: Neno la Kiebrania liko katika umoja na lina kiambishi cha nafsi ya kwanza; umoja pia ni wa kawaida katika nahau ya Kiswahili ‘kutega sikio.’
- source_word: אֶפְתַּח
  choice: nitalifungua
  rationale: פתח maana yake ya msingi ni ‘kufungua.’ Uchaguzi huu unahifadhi sitiari ya Kiebrania badala ya kuifasiri moja kwa moja kuwa ‘kueleza’ au ‘kufafanua.’
- source_word: בְּכִנּוֹר
  choice: kwa kinubi
  rationale: כִּנּוֹר ni ala ya nyuzi inayofanana na kinubi. Kihusishi ב hapa kinaeleweka kwa maana ya kutumia ala, hivyo ‘kwa kinubi.’
- source_word: חִידָתִי
  choice: fumbo langu
  rationale: חִידָה ni fumbo, kitendawili, au usemi wenye maana iliyofichika. ‘Fumbo’ ni la kawaida, lenye hadhi, na linaacha wazi upana wa maana ya neno hilo.
