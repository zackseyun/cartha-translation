    issue: “nitalifungua fumbo langu” ina kiambishi -li- kisicho na rejeleo sahihi.
    rationale: -li- kwa kawaida hurejelea “sikio” (ngeli 5) lililotajwa awali, hivyo sentensi husomeka kana kwamba msemaji atafungua sikio lake badala ya fumbo lake. Kiebrania ina kitenzi “nitafungua” kinachotanguliwa na “fumbo langu”; Kiswahili “nitafunua fumbo langu” hutoa maana kwa uwazi bila kuongeza yambwa wa kupotosha.
  - severity: medium
    issue: Alama za tanbihi zimewekwa kinyume.
    rationale: '[a] imefungwa na “methali” lakini tanbihi b inaeleza “fumbo”; [b] imefungwa na “kinubi” lakini maelezo yake yanahusu fumbo pamoja na kinubi. Kila tanbihi inapaswa kufungwa na neno linaloelezwa.'
  - severity: low
