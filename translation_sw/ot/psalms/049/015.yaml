source:
  edition: WLC
  text: אַךְ אֱלֹהִ֗ים יִפְדֶּ֣ה נַ֭פְשִׁ/י מִֽ/יַּד שְׁא֑וֹל כִּ֖י יִקָּחֵ֣/נִי סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/015.yaml
  text: But God will redeem my life from the hand of Sheol[a], for he will take me[b]. Selah
translation:
  language: sw
  text: Lakini Mungu ataukomboa uhai wangu kutoka mkononi mwa Sheoli[a], kwa maana atanichukua[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheoli ni neno la Kiebrania linalomaanisha makao ya wafu; pia yaweza kutafsiriwa “kaburi” au “ulimwengu wa wafu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “atanipokea.”
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Lakini
  rationale: Hapa neno hili linaonyesha tofauti kati ya mwisho wa wanadamu wenye kufa uliotajwa katika muktadha na tumaini la mtunga zaburi kwa Mungu.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ni rejeo la kawaida la umoja kwa Mungu wa Israeli.
- source_word: יִפְדֶּה
  choice: ataukomboa
  rationale: Kitenzi hiki hubeba maana ya kukomboa au kuokoa kutoka chini ya mamlaka fulani; ‘ataukomboa’ kinadumisha picha hiyo bila kuifafanua kupita kiasi.
- source_word: נַפְשִׁי
  choice: uhai wangu
  rationale: Katika muktadha huu נֶפֶשׁ humaanisha uhai au mtu mwenyewe, si lazima nafsi isiyo na mwili; ‘uhai wangu’ linafaa kwa mada ya kifo na ukombozi.
- source_word: מִיַּד
  choice: kutoka mkononi mwa
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya mkono kama nguvu au mshiko, huku ikieleweka kwa Kiswahili.
- source_word: שְׁאוֹל
  choice: Sheoli
  rationale: Unukuzi huu unadumisha neno mahsusi la Kiebrania kwa makao ya wafu bila kulifanya kuwa ‘kaburi’ tu wala kulihusianisha moja kwa moja na dhana ya adhabu ya mwisho.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa msingi au maelezo ya tumaini lililotangulia.
- source_word: יִקָּחֵנִי
  choice: atanichukua
  rationale: Hii inafuata maana ya msingi ya לָקַח, ‘kuchukua,’ na kuacha wazi uwezekano wa maana ya Mungu kumpokea mtu kwake.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana au kazi sahihi ya neno hili haijulikani kwa uhakika, hivyo umbo lake la kimapokeo linadumishwa.
theological_decisions:
- issue: Maana ya נַפְשִׁי kuhusiana na kifo na ukombozi
  choice: uhai wangu
  alternative: nafsi yangu; mimi mwenyewe
  rationale: ‘Uhai wangu’ huepuka kuingiza moja kwa moja mgawanyo wa baadaye wa mwili na nafsi katika ushairi wa Kiebrania, ambako נֶפֶשׁ mara nyingi humaanisha uhai au mtu mzima.
- issue: Aina ya ukombozi kutoka Sheoli
  choice: 'Maneno yameachwa mapana: Mungu ataukomboa uhai wangu kutoka mkononi mwa Sheoli na atanichukua.'
  alternative: Kutaja wazi ufufuo; au kuifanya iwe kuokolewa tu na kifo cha mapema
  rationale: Kiebrania kinaonyesha tumaini thabiti la ukombozi wa Mungu lakini hakibainishi kama ni ufufuo, ushirika na Mungu baada ya kifo, au uthibitisho wa mwisho wa Mungu. Tafsiri haiondoi mvutano huo.
- issue: Maana ya יִקָּחֵנִי katika tendo la Mungu
  choice: atanichukua
  alternative: atanipokea
  rationale: ‘Atanichukua’ ni karibu zaidi na kitenzi cha Kiebrania na haifungi maana yake; ‘atanipokea’ ni uwezekano halali unaotolewa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. ‘Kutoka mkononi mwa’ kinadumisha taswira ya asili, na ‘Sheoli’ linafafanuliwa katika tanbihi ili kuepuka kuchanganya neno hilo na kuzimu kama mahali pa adhabu.
