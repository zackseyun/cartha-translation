  text: כִּ֤י יִרְאֶ֨ה חֲכָ֘מִ֤ים יָמ֗וּתוּ יַ֤חַד כְּסִ֣יל וָ/בַ֣עַר יֹאבֵ֑דוּ וְ/עָזְב֖וּ לַ/אֲחֵרִ֣ים חֵילָֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/010.yaml
  text: For he sees that wise men die[a]; together the fool and the brutish man perish[c][b], and they leave their wealth to others.
translation:
  language: sw
  text: Kwa maana anaona kwamba wenye hekima hufa; vivyo hivyo mpumbavu na mtu asiye na akili huangamia, nao huwaachia wengine mali yao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza sababu au maelezo ya wazo lililotangulia kwa Kiswahili cha kawaida.
- source_word: יִרְאֶה
  choice: anaona
  rationale: Nafsi ya tatu umoja imehifadhiwa, huku wakati wa sasa ukionyesha ukweli wa jumla.
- source_word: חֲכָמִים
  choice: wenye hekima
  rationale: Ni namna ya asili ya Kiswahili ya kutaja kundi la watu wenye hekima bila kulazimisha jinsia ambayo sarufi ya Kiswahili haihitaji hapa.
- source_word: יָמוּתוּ
  choice: hufa
  rationale: Wakati wa mazoea unaonyesha ukweli wa jumla kuhusu kufa.
- source_word: יַחַד
  choice: pamoja
  rationale: Inasisitiza hatima inayowafikia kwa usawa watu wa aina hizi mbili.
- source_word: כְּסִיל
  choice: mpumbavu
  rationale: Neno la kawaida la hekima kwa mtu mwenye upumbavu wa kiakili na kimaadili.
- source_word: בַעַר
  choice: mtu asiye na akili
  rationale: Linafikisha maana ya mtu asiye na ufahamu au busara kwa lugha ya sasa na inayoeleweka, bila tusi lisilo la lazima.
- source_word: יֹאבֵדוּ
  choice: huangamia
  rationale: Linahifadhi nguvu ya אבד, ambayo ni zaidi ya kutaja kufa tu.
- source_word: וְעָזְבוּ
  choice: nao huwaachia
  rationale: Kitenzi kinaonyesha kwamba mali hubaki na kupewa wengine baada yao; muundo huu ni wa asili kwa Kiswahili.
- source_word: לַאֲחֵרִים
  choice: wengine
  rationale: Inawakilisha wingi usio bainifu bila kuongeza wazo lenye nguvu zaidi la wageni.
- source_word: חֵילָם
  choice: mali yao
  rationale: Katika muktadha huu חֵיל ina maana ya mali au utajiri; “mali” ni pana, wazi, na ya kawaida.
theological_decisions:
- issue: Uwakilishi wa kijinsia katika חֲכָמִים na בַעַר
  choice: wenye hekima ... mtu asiye na akili
  alternative: wanaume wenye hekima ... mwanamume asiye na akili
  rationale: Maumbo ya Kiebrania ni ya kiume kisarufi lakini yanawakilisha aina za wanadamu. Kiswahili hakilazimishi alama ya jinsia katika maneno haya; kuongeza “wanaume” kungefanya maana ionekane kuwa ya wanaume pekee bila ulazima wa kimuktadha.
- issue: Uhusiano wa יַחַד na vishazi vinavyoizunguka
  choice: mpumbavu na mtu asiye na akili huangamia pamoja
  alternative: pamoja na hilo, mpumbavu na mtu asiye na akili huangamia
  rationale: “Pamoja” imeunganishwa na hatima ya mpumbavu na asiye na akili, huku muktadha mzima ukiendelea kusawazisha hatima yao na ya wenye hekima; mpangilio wa Kiebrania unaruhusu msisitizo huu bila kudai kwamba wote hufa kwa wakati mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi ulinganifu wa kishairi na ukweli wa jumla wa kauli, huku ikiepuka tafsiri nzito kama “mtu wa kinyama” ambayo inaweza kuficha maana kwa msomaji wa kawaida.
