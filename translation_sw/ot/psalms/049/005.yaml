translation:
  language: sw
  text: Kwa nini niogope siku za mabaya, wakati uovu wa wanaonifuatilia[a] unanizunguka?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “uovu wa visigino vyangu.” Usemi huo unaweza kumaanisha uovu unaonifuata karibu, au uovu wa wale wanaotaka kuniangusha.
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה אִירָא
  choice: Kwa nini niogope
  rationale: Swali la balagha linalowasilisha kwa kawaida nguvu ya kiambishi cha kuuliza na kitenzi cha hali isiyotimilika katika Kiswahili.
- source_word: בִּימֵי רָע
  choice: siku za mabaya
  rationale: Huhifadhi muundo na upana wa Kiebrania, ambapo רָע inaweza kumaanisha uovu, taabu, au maafa bila kuibana kwa maana moja tu.
- source_word: עָוֹן
  choice: uovu
  rationale: Neno hili hubeba uzito wa kimaadili wa עָוֹן na linaeleweka kwa urahisi; katika muktadha huu linarejelea tendo la uovu kuliko kuamua kuwa ni hatia au adhabu yake.
- source_word: עֲקֵבַי
  choice: wanaonifuatilia
  rationale: Kihalisi ni ‘visigino vyangu,’ lakini usemi huo unaweza kuashiria walio karibu nyuma yangu au wanaotaka kuniangusha. Chaguo hili ni la asili kwa Kiswahili huku tanbihi ikihifadhi utata.
- source_word: יְסוּבֵּנִי
  choice: unaponizunguka
  rationale: Hutoa maana ya סבב, ‘kuzunguka/kuzingira,’ na umoja wake unapatana na ‘uovu.’
theological_decisions:
- issue: Maana ya usemi mgumu עֲוֹן עֲקֵבַי
  choice: uovu wa wanaonifuatilia
  alternative: uovu wa visigino vyangu; uovu ulio kwenye visigino vyangu; uovu wangu unaonifuata
  rationale: Muktadha unaweza kuunga mkono watesi walio nyuma ya mtunga zaburi, lakini Kiebrania ni kifupi na chenye utata. Matini kuu inasomeka kwa kawaida, na tanbihi inalinda uwezekano wa maana halisi au ya uovu unaomfuata msemaji.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali ni wa kawaida na unaeleweka, huku tanbihi ikihifadhi utata halisi wa Kiebrania.
