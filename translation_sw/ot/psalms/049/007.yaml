base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/007.yaml
  text: Surely no man can redeem a brother[a], or give to God his ransom—
translation:
  language: sw
  text: Hakika, hakuna mtu awezaye kumkomboa ndugu yake[a], wala kumpa Mungu fidia yake—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata mpangilio wa Kiebrania kwa karibu zaidi: “Ndugu hawezi kamwe kumkomboa mtu, wala kumpa Mungu fidia yake.”'
    reason: Kishazi cha kwanza cha Kiebrania kina mpangilio mgumu; אָח (“ndugu”) kinaweza kueleweka kama sehemu ya kishazi kwa namna tofauti na tafsiri kuu.
lexical_decisions:
- source_word: אָח
  choice: ndugu yake
  rationale: Neno hili kimsingi humaanisha “ndugu.” Katika muktadha huu linaweza kumaanisha ndugu wa karibu au mwanadamu mwenzake. “Ndugu yake” ni Kiswahili cha kawaida na hudumisha umoja wa neno hilo.
- source_word: פָדֹה יִפְדֶּה
  choice: awezaye kumkomboa
  rationale: Muundo wa kitenzi-jina kisicho kikomo pamoja na kitenzi kisichotimilika unasisitiza tendo. Chini ya ukanushi, Kiswahili “hakuna mtu awezaye kumkomboa” huonyesha wazi kutowezekana kabisa bila kurudia kitenzi kwa namna isiyo ya kawaida.
- source_word: אִישׁ
  choice: mtu
  rationale: אִישׁ humaanisha mtu wa kiume au mtu binafsi kulingana na muktadha. Hapa inawakilisha mwanadamu yeyote; “mtu” ni sahihi na ya kawaida katika Kiswahili bila kuifanya kauli ihusu wanaume pekee.
- source_word: לֵאלֹהִים
  choice: kwa Mungu
  rationale: Katika muktadha wa zaburi, אֱלֹהִים humrejelea Mungu mmoja. Baada ya kitenzi “kumpa,” kihusishi cha Kiswahili “kwa” kinaonyesha mpokeaji wa malipo kwa kawaida.
- source_word: כָּפְרוֹ
  choice: fidia yake
  rationale: כֹּפֶר ni bei au malipo ya kumwachilia mtu. “Fidia” hudumisha taswira hiyo ya ukombozi bila kuingiza maana mahususi ya dhabihu ambayo kifungu hiki hakisemi wazi.
- source_word: אָח לֹא ... אִישׁ
  choice: Hakika, hakuna mtu awezaye kumkomboa ndugu yake
  rationale: 'Mpangilio wa Kiebrania ni mgumu. Tafsiri hii inafuata maana inayowezekana katika muktadha na usambamba: hakuna mtu anayeweza kumkomboa ndugu yake. “Hakika” huwakilisha nguvu ya msisitizo inayotambuliwa na mapokeo mengi ya tafsiri, huku tanbihi ikihifadhi uwezekano wa kufuata mpangilio wa maneno kwa karibu zaidi.'
theological_decisions:
- issue: Maana ya כֹּפֶר inayotolewa kwa Mungu
  choice: fidia inayotolewa kwa Mungu kwa ajili ya maisha ya mwanadamu
  alternative: malipo ya upatanisho kwa Mungu
  rationale: Mstari unasisitiza kwamba mwanadamu hawezi kununua kutoka kwa Mungu ukombozi wa mwingine dhidi ya mauti. “Fidia” hudumisha taswira ya bei ya ukombozi bila kuamua kwamba hapa lazima pawe na maana kamili ya dhabihu ya upatanisho.
- issue: Mhusika na mtendwa katika kishazi cha kwanza
  choice: mtu ndiye mtendaji, na ndugu yake ndiye anayekomolewa
  alternative: ndugu ndiye mtendaji anayejaribu kumkomboa mtu
  rationale: Sintaksia ya Kiebrania ni isiyo ya kawaida na inaweza kusomwa kwa njia zaidi ya moja. Tafsiri kuu inafuata muktadha na tafsiri inayosomeka kwa kawaida, lakini tanbihi inahifadhi uwezekano wa mpangilio mwingine bila kutatua kimya kimya utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Kumkomboa” na “fidia” ni maneno yanayoeleweka kwa wasomaji wa kawaida na yanadumisha taswira ya bei ya ukombozi. Alama ya mwisho ya mstari imehifadhiwa kama kistari kirefu kwa kuwa wazo linaendelea katika mstari unaofuata.
