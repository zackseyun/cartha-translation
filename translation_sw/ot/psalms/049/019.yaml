lexical_decisions:
- source_word: תָּבוֹא
  choice: Ataenda
  rationale: Umbo lililoandikwa ni nafsi ya pili, umoja wa kiume, lakini muktadha unaendelea kumzungumzia mtu wa mstari uliotangulia. Nafsi ya tatu katika matini kuu inafanya rejeo hilo lieleweke, huku tanbihi ikihifadhi mvutano wa umbo la Kiebrania.
- source_word: עַד דּוֹר
  choice: kwa kizazi
  rationale: עַד hapa huonyesha kikomo au mahali anapofikia. Kauli hii inaelekeza kwa kundi la waliomtangulia waliokufa, bila kuongeza kitenzi kama ‘kujiunga’ ambacho hakipo wazi katika Kiebrania.
- source_word: אֲבוֹתָיו
  choice: baba zake
  rationale: Hili linahifadhi taswira ya moja kwa moja ya Kiebrania; katika muktadha, ‘baba’ humaanisha waliotangulia katika ukoo, yaani mababu.
- source_word: עַד נֵצַח לֹא
  choice: kamwe
  rationale: Pamoja na ukanushi, msemo huu unaonyesha kwamba jambo hilo halitatokea tena wakati wowote.
- source_word: יִרְאוּ
  choice: hawatauona
  rationale: Kitenzi cha Kiebrania ni nafsi ya tatu wingi. Wingi umehifadhiwa ili kuonyesha badiliko kutoka kwa mtu mmoja kwenda kwa kundi la waliokufa analolifikia.
- source_word: אוֹר
  choice: mwanga
  rationale: Neno hili linahifadhi taswira ya Kiebrania ya kuuona mwanga, ambayo katika muktadha inahusishwa na kuishi.
theological_decisions:
- issue: Badiliko la nafsi na idadi ndani ya mstari
  choice: Kishazi cha kwanza kimetafsiriwa kwa umoja, ‘Ataenda,’ na cha pili kwa wingi, ‘hawatauona.’
  alternative: ‘Utaenda ... hawatauona,’ kufuata moja kwa moja umbo la nafsi ya pili la kitenzi cha kwanza; au kusawazisha mstari wote kuwa umoja.
  rationale: תָּבוֹא ni umbo la nafsi ya pili umoja, lakini יִרְאוּ ni nafsi ya tatu wingi. Muktadha unaruhusu kitenzi cha kwanza kumrejelea mtu anayezungumziwa, ilhali wingi wa pili unamhesabu pamoja na waliokufa. Tanbihi inaweka wazi mvutano huo badala ya kuuficha.
- issue: Maana ya ‘kuuona mwanga’
  choice: Taswira ya ‘mwanga’ imehifadhiwa katika matini kuu.
  alternative: Kutafsiri maana yake moja kwa moja kuwa ‘hawataishi tena.’
  rationale: Kiebrania kinaweza kutumia kuuona mwanga kama taswira ya kuwa hai. Kuhifadhi taswira huepuka kuingiza maelezo mahususi kuhusu hali ya baada ya kifo ambayo mstari wenyewe hauyaelezi kikamilifu.
- issue: Ketiv na qere katika אֲבוֹתָי/ו
  choice: Matini kuu inafuata usomaji wa kimapokeo, ‘baba zake.’
  alternative: Kufuata maandishi ya konsonanti kama ‘baba zangu.’
  rationale: WLC inaonyesha tofauti kati ya kilichoandikwa na kinachosomwa. ‘Baba zake’ inapatana na mhusika wa nafsi ya tatu katika muktadha, lakini tofauti ya matini imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. ‘Baba zake’ huhifadhi taswira ya Kiebrania, huku ‘mababu zake’ ikitolewa kama ufafanuzi. Mpangilio wa umoja kisha wingi umeachwa kwa makusudi ili kuhifadhi mvutano wa matini chanzo.
