lexical_decisions:
- source_word: וְיֵקַר
  choice: ni ghali
  rationale: Mzizi יקר unaonyesha kuwa kitu ni cha thamani au kina gharama kubwa. Katika muktadha wa bei ya ukombozi, “ni ghali” ni Kiswahili cha kawaida na hakiongezi wazi wazo la “ghali mno,” ingawa muktadha unalidokeza.
- source_word: פִּדְיוֹן
  choice: fidia
  rationale: Neno hili linamaanisha bei inayotolewa ili kumkomboa au kumwachilia mtu. “Fidia” ni neno fupi na la kawaida linalodumisha picha ya malipo ya ukombozi.
- source_word: נַפְשָׁם
  choice: uhai wao
  rationale: Katika muktadha huu נֶפֶשׁ humaanisha uhai au mtu aliye hai, si lazima nafsi isiyo ya mwili. “Uhai wao” linafaa kwa hoja inayohusu kutoweza kumwokoa mwanadamu na kifo.
- source_word: וְחָדַל
  choice: na mtu lazima aache kujaribu
  rationale: Kitenzi חדל humaanisha kukoma au kuacha. Kwa kuwa kishazi cha Kiebrania kimebanwa na hakitaji wazi mtendaji wala kile kinachoachwa, tafsiri hii inaeleza maana inayodokezwa na muktadha huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: לְעוֹלָם
  choice: milele
  rationale: 'Hapa לְעוֹלָם huonyesha ukomo wa kudumu: jaribio la kutoa fidia linaachwa kabisa. “Milele” hudumisha moja kwa moja nguvu ya usemi wa Kiebrania.'
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika muktadha wa fidia na kifo
  choice: uhai
  alternative: nafsi
  rationale: Zaburi inazungumzia kushindwa kuukomboa uhai wa mwanadamu kutoka katika kifo. “Uhai” linaendana na muktadha na halilazimishi mtazamo fulani kuhusu nafsi ambao neno la Kiebrania lenyewe halidai.
- issue: Maana ya kishazi kigumu וְחָדַל לְעוֹלָם
  choice: mtu lazima aache kujaribu milele
  alternative: nayo hukoma milele; haiwezi kamwe kutosha
  rationale: Kishazi hiki ni kifupi na kina utata kuhusu mtendaji na jambo linalokoma. Matini kuu inafuata maana ya mtu kuacha jaribio la kulipa fidia kwa sababu ya gharama yake, huku tanbihi ikitaja tafsiri halisi zaidi na tafsiri nyingine inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Fidia ya uhai” hudumisha taswira ya malipo, na kishazi cha pili kimewekwa kwa lugha inayoeleweka bila kuficha utata wa Kiebrania, ambao umeelezwa katika tanbihi.
