base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/011.yaml
  text: Their inward thought is that their houses will last forever[a], their dwelling places from generation to generation[b]; they have called lands by their own names.
translation:
  language: sw
  text: Moyoni mwao wanafikiri kwamba nyumba zao zitadumu milele[a], na makao yao kizazi baada ya kizazi; wameyapa mashamba majina yao wenyewe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata uelewa mwingine wa matini: “Makaburi yao ni nyumba zao milele, makao yao kizazi baada ya kizazi.”'
    reason: textual_variant
  - marker: b
    text: 'Kiebrania kwa tafsiri ya karibu: “waliita kwa majina yao juu ya ardhi.” Maana yake yaelekea kuwa waliipa maeneo au milki za ardhi majina yao wenyewe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבָּם
  choice: Mawazo yao ya ndani
  rationale: WLC imesoma neno linalotokana na קֶרֶב, yaani sehemu ya ndani; katika muktadha huu linaeleza wazo au dhana waliyo nayo moyoni. Tafsiri mbadala ya ‘makaburi yao’ imehifadhiwa katika tanbihi.
- source_word: בָּתֵּימוֹ
  choice: nyumba zao
  rationale: Maana ya kawaida ya בית ni nyumba au makao, na hapa inalingana na מִשְׁכְּנֹתָם.
- source_word: לְעוֹלָם
  choice: zitadumu milele
  rationale: Kitenzi ‘zitadumu’ kimeongezwa kwa ufasaha wa Kiswahili katika kishazi cha Kiebrania kisicho na kitenzi, huku wazo la kudumu bila mwisho likihifadhiwa.
- source_word: מִשְׁכְּנֹתָם
  choice: makao yao
  rationale: ‘Makao’ ni neno la kawaida na lenye hadhi kwa mahali wanapoishi, na linahifadhi usambamba na ‘nyumba zao.’
- source_word: לְדֹר וָדֹר
  choice: kizazi baada ya kizazi
  rationale: Hii ni nahau ya Kiswahili inayoeleza mwendelezo katika vizazi vinavyofuatana.
- source_word: קָרְאוּ בִשְׁמוֹתָם
  choice: wameyaita ... kwa majina yao wenyewe
  rationale: קרא inaweza kumaanisha kuita au kutaja jina. Muundo huu unaonyesha kwamba waliipa ardhi majina yao wenyewe.
- source_word: עֲלֵי אֲדָמוֹת
  choice: mashamba
  rationale: Wingi אֲדָמוֹת hapa unaelekea kumaanisha ardhi au milki za ardhi. ‘Mashamba’ ni Kiswahili cha kawaida kinachoeleweka kama maeneo ya ardhi yanayomilikiwa, bila kutumia neno lisilo la asili ‘estates.’
theological_decisions:
- issue: Je, קִרְבָּם irejelee mawazo yao ya ndani au makaburi yao?
  choice: Mawazo yao ya ndani
  alternative: Makaburi yao ndiyo nyumba zao za milele
  rationale: Uwekaji wa irabu katika WLC unaunga mkono maana ya ‘ndani yao’; hata hivyo, usomaji wa ‘makaburi yao’ ni wa kale na unaofaa kimuktadha, kwa hiyo umehifadhiwa wazi katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na rahisi kueleweka. Usambamba wa kishairi umehifadhiwa, na utata halisi wa קִרְבָּם umeonyeshwa katika tanbihi.
