lexical_decisions:
- source_word: וִיחִי
  choice: ili aendelee kuishi
  rationale: Katika muktadha huu, umbo hili linaendeleza kusudi au matokeo yasiyoweza kufikiwa kutoka mstari uliotangulia. “Ili aendelee kuishi” ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya kimakusudi na kimodal.
- source_word: עוֹד
  choice: aendelee
  rationale: Neno hili linaonyesha kuendelea kwa uhai. Maana yake imewasilishwa kiasili kwa kitenzi “aendelee” badala ya kuongeza “bado,” jambo ambalo lingekuwa zito katika sentensi hii.
- source_word: לָנֶצַח
  choice: milele
  rationale: Kiambishi ל pamoja na נצח huonyesha muda usio na mwisho; “milele” ni tafsiri ya moja kwa moja, ya kawaida na yenye hadhi.
- source_word: לֹא
  choice: asi-
  rationale: Ukanushi umeunganishwa kwa kawaida katika kitenzi cha Kiswahili “asilione.”
- source_word: יִרְאֶה
  choice: alione
  rationale: “Kuona” huhifadhi nahau ya Kiebrania, ingawa katika muktadha wa kifo pia inaweza kumaanisha kukumbana na au kuupata.
- source_word: הַשָּׁחַת
  choice: Shimo
  rationale: Katika ushairi unaohusu kifo, שחת linaweza kumaanisha shimo, kaburi, uharibifu au kuoza. “Shimo” huhifadhi taswira halisi na upana wa sitiari bila kuifungia katika maana moja tu.
theological_decisions:
- issue: Maana ya שחת katika muktadha wa kifo
  choice: Shimo
  alternative: kaburi; uharibifu; kuoza
  rationale: “Shimo” huhifadhi taswira pana ya kishairi inayohusishwa na kifo, kaburi na maangamizi, bila kutatua kimya kimya utata wa neno la Kiebrania. Maana nyingine halali zimeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unaendelea kiasili kutoka mstari uliotangulia; “wala” huunganisha matokeo ya pili yaliyo katika ukanushi. Herufi kubwa katika “Shimo” inaonyesha taswira maalumu ya kishairi ya makao au hali ya wafu bila kuifanya kuwa istilahi ya dhehebu.
