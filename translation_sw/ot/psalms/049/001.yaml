translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na wa kishairi. Usambamba wa amri mbili za Kiebrania umehifadhiwa kwa “Sikieni” na “tegenzeni masikio,” na mwito wa jumla umeelezwa bila kuufanya kuwa wa kisiasa.
