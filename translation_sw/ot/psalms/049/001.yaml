  yaml_path: translation/ot/psalms/049/001.yaml
  text: Hear this[a], all peoples; give ear, all inhabitants of the world,
translation:
  language: sw
  text: 'Sikieni hili, enyi watu wote;

    sikilizeni, ninyi nyote mnaoishi ulimwenguni.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “duniani.” Neno la Kiebrania חָלֶד linaweza kumaanisha ulimwengu wa maisha ya wanadamu au eneo la kidunia.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Sikieni
  rationale: Kitenzi cha amri kwa wingi kinatoa mwito wa kusikia kwa makini; “Sikieni” ni cha moja kwa moja, cha kishairi, na kinaeleweka kwa urahisi.
- source_word: זֹאת
  choice: hili
  rationale: Kiwakilishi hiki cha kuonyesha kinarejelea ujumbe au mafundisho yanayofuata katika zaburi.
- source_word: כָּל הָעַמִּים
  choice: enyi watu wa jamii zote
  rationale: עַמִּים humaanisha makundi ya watu kwa upana. Kauli hii inahifadhi wingi na mwito wa ulimwengu mzima bila kuufupisha kuwa mataifa ya kisiasa pekee.
- source_word: הַאֲזִינוּ
  choice: tegenzeni masikio
  rationale: Ni amri ya kusikiliza kwa makini. Nahau hii ya Kiswahili inadumisha usambamba wa kishairi na “Sikieni” pamoja na uzito wa mwito.
- source_word: כָּל יֹשְׁבֵי
  choice: ninyi nyote mnaoishi
  rationale: Muundo wa Kiebrania unawataja wote wanaokaa au kuishi mahali fulani; tafsiri hii ni ya asili katika Kiswahili cha sasa.
- source_word: חָלֶד
  choice: ulimwenguni
  rationale: Neno hili linaweza kutaja ulimwengu wa maisha ya wanadamu au eneo la kidunia. Katika mwito huu unaowahusu wote, “ulimwenguni” linaeleza vizuri mahali wanapoishi wanadamu huku mbadala ukibainishwa katika tanbihi.
