  text: אָדָ֣ם בִּ֭/יקָר וְ/לֹ֣א יָבִ֑ין נִמְשַׁ֖ל כַּ/בְּהֵמ֣וֹת נִדְמֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/020.yaml
  text: Man in honor[a], yet without understanding, is like the beasts that perish.
translation:
  language: sw
  text: Mtu mwenye heshima, lakini asiye na ufahamu, ni kama wanyama wanaoangamia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ni kama wanyama; amefanana nao,” kwa kufuata usomaji unaowezekana wa kitenzi cha mwisho kuwa “kufanana” badala ya “kuangamia.”
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: Mtu
  rationale: Nomino ya umoja imetumiwa kimethali kumwakilisha mwanadamu kwa ujumla; “mtu” ni ya kawaida, jumuishi, na ya asili katika Kiswahili.
- source_word: בִּיקָר
  choice: mwenye heshima
  rationale: Kirai hiki kinaonyesha hali ya hadhi au heshima; “mwenye heshima” huleta utofauti ulio wazi na ukosefu wa ufahamu.
- source_word: וְלֹא יָבִין
  choice: lakini asiye na ufahamu
  rationale: Kitenzi בין kinahusu kuelewa au kupambanua. “Lakini” linaonyesha utofauti wa kimuktadha kati ya heshima na ukosefu wa utambuzi.
- source_word: נִמְשַׁל
  choice: ni kama
  rationale: Nifali ya משל hapa ina maana ya kufananishwa; “ni kama” ni Kiswahili cha kawaida na chenye nguvu ya kishairi.
- source_word: כַּבְּהֵמוֹת
  choice: wanyama
  rationale: בְּהֵמוֹת hapa inarejelea wanyama kwa upana, si mifugo pekee; “wanyama” ni wazi na ya sasa.
- source_word: נִדְמוּ
  choice: wanaoangamia
  rationale: Katika muktadha wa zaburi na kibwagizo chake, umbo hili linaeleweka kwa kawaida kuwa linahusu kuangamia, ingawa uwezekano wa maana ya kufanana umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya kitenzi cha mwisho נִדְמוּ
  choice: Kimeeleweka kuwa “wanaoangamia,” kikieleza wanyama.
  alternative: “ni kama wanyama; amefanana nao” au “wamefanana”
  rationale: Usomaji wa kuangamia unafaa msisitizo wa zaburi kuhusu kifo ambacho heshima ya mwanadamu haiwezi kukizuia. Hata hivyo, kwa kuwa uchanganuzi wa mzizi unaweza kutoa maana ya kufanana, uwezekano huo haujafichwa bali umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Sentensi imebaki fupi na ya kimethali; tanbihi inalinda utata halisi wa Kiebrania.
