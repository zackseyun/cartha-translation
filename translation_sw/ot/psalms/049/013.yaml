base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/013.yaml
  text: This is their way—their folly[a]; yet after them, people approve their words[b]. Selah
translation:
  language: sw
  text: Hii ndiyo njia yao—upumbavu wao[a]; lakini wale wanaokuja baada yao huyakubali maneno yao[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hii ndiyo njia yao—kujiamini kwao.” Neno la Kiebrania linaweza pia kumaanisha kujiamini au tumaini.
    reason: alternative_reading
  - marker: b
    text: Kwa Kiebrania, “kinywa chao”; hapa maana yake ni yale wanayosema. “Wale wanaokuja baada yao” inaweza pia kumaanisha “wazao wao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: Hii ndiyo
  rationale: Kiwakilishi hiki kinaanzisha muhtasari wa hali iliyoelezwa kabla; “ndiyo” hukamilisha tungo kwa Kiswahili cha kawaida.
- source_word: דַרְכָּם
  choice: njia yao
  rationale: Neno דֶּרֶךְ linaweza kumaanisha njia halisi au mwenendo wa maisha; “njia yao” huhifadhi sitiari na maana ya kimaadili.
- source_word: כֵּסֶל לָמוֹ
  choice: upumbavu wao
  rationale: Tungo ya Kiebrania ni fupi na yenye mkazo wa tathmini. כֶּסֶל hapa inaeleweka vizuri kama upumbavu, na לָמוֹ imewasilishwa kwa umilikaji wa kawaida wa Kiswahili.
- source_word: וְאַחֲרֵיהֶם
  choice: lakini wale wanaokuja baada yao
  rationale: Kifungu hiki kinaweza kuwataja watu wanaofuata baadaye au wazao wao. Tafsiri hii haikifungi kwa undugu wa damu na inaonyesha mwendelezo wa kinaya.
- source_word: בְּפִיהֶם
  choice: maneno yao
  rationale: Maana ya moja kwa moja ni “kinywa chao,” lakini hapa kinywa kinawakilisha yale wanayosema; “maneno yao” ni Kiswahili cha asili huku tanbihi ikihifadhi taswira ya Kiebrania.
- source_word: יִרְצוּ
  choice: huyakubali
  rationale: Kitenzi רצה kinaweza kumaanisha kupendezwa na, kukubali, au kuridhia. “Huyakubali” kinaonyesha mwitikio wao wa kuunga mkono maneno hayo.
- source_word: סֶלָה
  choice: Sela
  rationale: Tahajia ya kimapokeo imehifadhiwa kwa kuwa maana kamili ya istilahi hii ya kiliturujia au kimuziki haijulikani kwa hakika.
theological_decisions:
- issue: Rejeo la וְאַחֲרֵיהֶם
  choice: watu wanaokuja baada yao
  alternative: wazao wao
  rationale: Kiebrania kinaweza kurejelea waandamizi kwa ujumla au wazao hasa. Tafsiri kuu huhifadhi maana pana bila kuamua undugu ambao matini hauelezi wazi.
- issue: Maana ya כֵּסֶל
  choice: upumbavu
  alternative: tumaini au kujiamini
  rationale: Neno linaweza kuwa na maana ya upumbavu au, katika miktadha mingine, tumaini/kujiamini. Muktadha wa zaburi unakosoa mwenendo wa watu hao, hivyo “upumbavu” unafaa zaidi, huku uwezekano mwingine ukitajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi wa kishairi umehifadhiwa, huku tungo iliyobanwa ya Kiebrania ikifafanuliwa kiasi ili ieleweke kwa msomaji wa kawaida.
