  yaml_path: translation/ot/psalms/049/018.yaml
  text: For his soul blesses itself during his life[a], and they praise you when you do well for yourself.
translation:
  language: sw
  text: Kwa maana hujihesabu kuwa amebarikiwa maadamu yu hai,[a] nao watu hukusifu unapofanikiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana nafsi yake hujibariki maishani mwake, nao watu hukusifu unapojitendea mema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza sababu au ufafanuzi unaoendeleza hoja ya mstari uliotangulia.
- source_word: נַפְשׁוֹ
  choice: nafsi yake
  rationale: Inahifadhi taswira ya Kiebrania, huku muktadha ukionyesha kuwa inamwakilisha mtu mwenyewe.
- source_word: בְּחַיָּיו
  choice: wakati wa maisha yake
  rationale: Inaonyesha kipindi cha uhai wake bila kuongeza maana isiyokuwamo katika chanzo.
- source_word: יְבָרֵךְ
  choice: hujiona kuwa imebarikiwa
  rationale: 'Kauli hiyo inaelekea kutumiwa kwa maana ya kujirejelea: mtu hujihesabu kuwa amebarikiwa. Muundo huu pia unapatana na kiima ‘nafsi yake’.'
- source_word: וְיוֹדֻךָ
  choice: nao watu hukusifu
  rationale: Kitenzi kinaweza kumaanisha kusifu au kushukuru; hapa sifa ya kijamii ndiyo inayofaa zaidi. Kiima cha wingi kisichotajwa kimeelezwa kwa ‘watu’ ili Kiswahili kiwe wazi na cha kawaida.
- source_word: כִּי
  choice: unapo-
  rationale: Hapa inaonyesha hali au wakati ambao mtu husifiwa.
- source_word: תֵיטִיב לָךְ
  choice: unapojifanikisha
  rationale: Katika muktadha wa mali na ustawi, kifungu kinaonyesha kujitendea mema au kufanikiwa kwa faida yako mwenyewe. ‘Kujifanikisha’ huhifadhi wazo la mafanikio yenye kujielekea bila kulifanya kuwa tendo la maadili kwa lazima.
