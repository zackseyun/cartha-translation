translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Tafsiri kuu imehifadhi ‘nafsi yake’ kama taswira ya Kiebrania; tanbihi inatoa usemi wa kawaida zaidi. Mabadiliko kutoka nafsi ya tatu katika mstari wa kwanza kwenda nafsi ya pili katika mstari wa pili yamehifadhiwa kama yalivyo katika chanzo.
