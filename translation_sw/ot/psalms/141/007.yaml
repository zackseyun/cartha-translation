  yaml_path: translation/ot/psalms/141/007.yaml
  text: As one plows and breaks up the earth[b][a], our bones have been scattered at the mouth of Sheol.
translation:
  language: sw
  text: Kama mtu anavyolima na kupasua udongo[a], mifupa yetu imetawanywa kinywani mwa Sheoli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kama mtu anavyokata na kupasua udongo.” Vitenzi vya Kiebrania vinaonyesha tendo hilo kwa uhai na vinaweza kutafsiriwa kwa vitenzi vya kazi ya shambani vilivyo tofauti kidogo.
    reason: lexical_alternative
  - marker: b
    text: Sheoli ni neno la Kiebrania linalomaanisha makao ya wafu; kwa desturi pia limetafsiriwa “kaburi,” na katika baadhi ya miktadha “jehanamu,” ingawa tafsiri hiyo si sahihi sana.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּמוֹ
  choice: Kama
  rationale: Huanzisha tashbihi kwa njia ya kawaida na wazi katika Kiswahili.
- source_word: פֹלֵחַ
  choice: anavyolima
  rationale: Katika muktadha wa udongo, kitenzi kinaonyesha kuukata au kuupasua kwa kazi ya kilimo; ‘kulima’ huwasilisha picha hiyo kwa Kiswahili cha kawaida.
- source_word: וּבֹקֵעַ
  choice: na kuupasua
  rationale: Hudumisha tendo la pili lenye nguvu la kuufungua au kuugawanya udongo, bila kulifanya kuwa marudio yasiyo na maana.
- source_word: בָּאָרֶץ
  choice: udongo
  rationale: Hapa neno linamaanisha ardhi inayolimwa; ‘udongo’ huifanya picha ya kilimo iwe dhahiri.
- source_word: נִפְזְרוּ
  choice: imetawanywa
  rationale: Kauli ya kutendwa huhifadhi maana ya Niphal na hali inayotokana na tendo hilo.
- source_word: עֲצָמֵינוּ
  choice: mifupa yetu
  rationale: Tafsiri ya moja kwa moja inayohifadhi taswira kali ya mstari.
- source_word: לְפִי
  choice: kinywani mwa
  rationale: Huhifadhi nahau halisi ya Kiebrania, ‘kwenye kinywa cha,’ na taswira ya Sheoli kama eneo lenye mdomo au mwanya.
- source_word: שְׁאוֹל
  choice: Sheoli
  rationale: Utohozi huu huhifadhi dhana ya Kiebrania ya makao ya wafu bila kuihusisha moja kwa moja na dhana ya baadaye ya jehanamu.
theological_decisions:
- issue: Tafsiri ya שְׁאוֹל
  choice: Sheoli
  alternative: kaburi; makao ya wafu; jehanamu
  rationale: ‘Sheoli’ huepuka kuingiza maana finyu ya kimafundisho isiyolazimishwa na Kiebrania. Tanbihi inafafanua dhana hiyo kwa msomaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘Kama mtu anavyolima’ ni wa kawaida na unaeleweka, huku ‘kinywani mwa Sheoli’ ikihifadhi taswira halisi na yenye nguvu ya Kiebrania.
