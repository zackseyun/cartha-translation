base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/009.yaml
  text: Keep me from the hands of the trap they have set for me[b][a], and from the snares of the workers of wickedness.
translation:
  language: sw
  text: Unilinde dhidi ya mtego walionitegea,[a] na dhidi ya mitego ya watenda maovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kutoka mikono ya mtego walionitegea.” Katika Kiebrania, “mikono” hapa huonyesha nguvu au mshiko.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: Unilinde
  rationale: Ombi la amri kutoka שׁמר, lenye maana ya kulinda au kuhifadhi; “Unilinde” ni la kawaida na linafaa katika sala.
- source_word: מִידֵי פַח
  choice: na mtego
  rationale: Kiebrania kihalisi kina “kutoka mikono/mkono wa mtego,” ambapo “mkono” huonyesha nguvu au mshiko. Kiswahili cha kawaida huwasilisha maana hiyo kwa “linda na mtego”; picha halisi imehifadhiwa katika tanbihi.
- source_word: יָקְשׁוּ לִי
  choice: walionitegea
  rationale: Kitenzi יקשׁ hapa huhusu kutega mtego kwa ajili ya mtu; “walionitegea” ni kifupi, asilia, na huhifadhi mlengwa wa kitendo.
- source_word: וּמֹקְשׁוֹת
  choice: na mitego
  rationale: Wingi wa מוֹקֵשׁ ni mitego au tanzi. “Mitego” ni wazi kwa wasomaji wa sasa, huku kihusishi “na” kikibeba maana ya kujiepusha na iliyotangulia.
- source_word: פֹּעֲלֵי אָוֶן
  choice: watenda maovu
  rationale: Muundo una maana ya watu watendao uovu. “Watenda maovu” huhifadhi kitendo na uzito wa kimaadili bila kuwa mzito kupita kiasi.
