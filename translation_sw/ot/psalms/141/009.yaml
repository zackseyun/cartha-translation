translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inalenga ulinganifu bora: ni ya asili katika Kiswahili huku ikihifadhi picha ya mitego na muundo sambamba wa ushairi.'
