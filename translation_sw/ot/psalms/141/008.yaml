base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/008.yaml
  text: For my eyes are toward you[a], O Yahweh, my Lord; in you I take refuge[b]; do not pour out my life.
translation:
  language: sw
  text: Kwa maana macho yangu yako kwako, Ee Yahwe, Bwana wangu; kwako nimekimbilia; usiumwage[a] uhai wangu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “usiniache wazi” au “usiniache bila ulinzi.” Kitenzi cha Kiebrania kinaweza kumaanisha kumwaga, kuacha tupu, au kuweka wazi.
    reason: lexical_alternative
  - marker: b
    text: Au “nafsi yangu.” Neno la Kiebrania nefesh linaweza kumaanisha uhai, mtu mwenyewe, au nafsi kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza hoja kwa kutoa msingi wa ombi lililotangulia, huku ikihifadhi nguvu ya kiunganishi cha Kiebrania.
- source_word: אֵלֶיךָ ... עֵינַי
  choice: macho yangu yanakuelekea wewe
  rationale: Inahifadhi taswira halisi ya macho yanayoelekezwa kwa Mungu, ambayo katika muktadha huonyesha kumtegemea na kumngojea.
- source_word: יְהֹוָה
  choice: Yahwe
  rationale: Inawakilisha jina binafsi la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: אֲדֹנָי
  choice: Bwana wangu
  rationale: Inatofautisha cheo hiki na jina Yahwe na pia inawakilisha kiambishi cha nafsi ya kwanza, ‘wangu.’
- source_word: בְּךָ חָסִיתִי
  choice: kwako nimekimbilia
  rationale: Ni usemi wa kawaida na wenye heshima katika Kiswahili kwa kutafuta hifadhi kwa mtu; hali timilifu ya kitenzi imehifadhiwa kwa ‘nimekimbilia.’
- source_word: תְּעַר
  choice: usiumwage
  rationale: Huhifadhi maana ya msingi ya kitenzi katika kausativi, yaani kumwaga au kuondoa kilichomo, bila kuficha uwezekano wa maana ya kumwacha mtu wazi na bila ulinzi.
- source_word: נַפְשִׁי
  choice: uhai wangu
  rationale: Katika ombi hili la kuokolewa, נֶפֶשׁ inaelekea kumaanisha uhai au nafsi ya mtu aliye hatarini, si lazima sehemu isiyo ya mwili iitwayo roho.
theological_decisions:
- issue: Kutafsiri mtajo wa pamoja יְהֹוָה אֲדֹנָי
  choice: Ee Yahwe, Bwana wangu
  alternative: Ee BWANA Mungu; Ee Bwana MUNGU
  rationale: Maandishi yana jina la agano pamoja na cheo cha ubwana chenye maana ya ‘wangu.’ Kutafsiri vipengele vyote viwili kunahifadhi mtajo huo wenye tabaka mbili bila kuvichanganya.
- issue: Maana ya נֶפֶשׁ katika ombi la kuokolewa
  choice: uhai wangu
  alternative: nafsi yangu; roho yangu
  rationale: ‘Uhai wangu’ inafaa kwa muktadha wa hatari ya kifo na haingizi kimyakimya dhana finyu ya kwamba neno hilo lazima limaanishe sehemu ya mtu isiyo ya mwili.
- issue: Maana ya ombi אַל־תְּעַר נַפְשִׁי
  choice: usiumwage uhai wangu
  alternative: usiniache wazi; usiniache bila ulinzi
  rationale: Tafsiri kuu inadumisha taswira ya kitenzi cha Kiebrania, huku tanbihi ikihifadhi uwezekano wake mpana wa kuwekwa wazi au kuachwa bila kinga.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala. Mpangilio na taswira za Kiebrania zimehifadhiwa pale zinapoeleweka, huku ‘kwako nimekimbilia’ ikitoa usemi wa asili wa kutafuta hifadhi.
