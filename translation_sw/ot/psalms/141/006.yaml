base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/006.yaml
  text: Their judges have been thrown down by the sides of the rock[a], and they have heard my words[b], for they are pleasant.
translation:
  language: sw
  text: Waamuzi wao wametupwa chini kando ya jabali[a], nao wameyasikia maneno yangu, kwa maana yanapendeza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye pande za jabali.” Kirai cha Kiebrania ni kigumu; kwa maana halisi zaidi kimetafsiriwa pia, “mikononi mwa mwamba.”
    reason: alternative_reading
  - marker: b
    text: Au, “ni matamu” au “yanapendeza sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמְטוּ
  choice: wametupwa chini
  rationale: Kauli ya kutendwa ya kitenzi שׁמט inaonyesha kuangushwa, kutupwa chini, au kutelekezwa kuteleza; hapa taswira ya kuangushwa kwa nguvu inafaa katika ushairi.
- source_word: בִידֵי סֶלַע
  choice: kando ya jabali
  rationale: Kirai hiki ni kigumu. Ingawa בידי kwa kawaida huhusiana na ‘mikono,’ pamoja na סלע kinaweza kueleweka kwa maana ya mahali, yaani kandokando au kwenye pande za jabali. Maana halisi zaidi imehifadhiwa katika tanbihi.
- source_word: שֹׁפְטֵיהֶם
  choice: waamuzi wao
  rationale: Nomino hii humaanisha wanaohukumu na inaweza pia kumaanisha watawala. ‘Waamuzi’ ni tafsiri ya moja kwa moja isiyoongeza maana ya kiutawala bila ulazima.
- source_word: וְשָׁמְעוּ
  choice: nao wameyasikia
  rationale: Umbo la qatal linaweza kuwa na nguvu ya wakati uliopita, hali iliyotimia, au mfuatano wa kishairi. Wakati timilifu wa Kiswahili unafuata muundo wa Kiebrania bila kuongeza kiunganishi cha kimfuatano kama ‘ndipo.’
- source_word: אֲמָרַי
  choice: maneno yangu
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya wingi wenye kiambishi cha nafsi ya kwanza.
- source_word: כִּי נָעֵמוּ
  choice: kwa maana yanapendeza
  rationale: כִּי inatoa sababu, na נעם hueleza uzuri, utamu, au kupendeza. ‘Yanapendeza’ ni Kiswahili cha kawaida na chenye hadhi huku ‘matamu’ kikihifadhiwa kama mbadala.
theological_decisions:
- issue: Maana ya kirai kigumu בידי סלע
  choice: 'Maana ya mahali: ‘kando ya jabali’'
  alternative: 'Maana halisi zaidi: ‘mikononi mwa mwamba,’ au ya kitopografia: ‘kwenye pande za jabali’'
  rationale: Sintaksia ya mstari huu ni tata. Tafsiri kuu inatoa taswira inayowezekana ya waamuzi kuangushwa kwenye eneo la jabali, lakini tanbihi huhifadhi uwezekano wa maana halisi zaidi badala ya kuondoa utata wa maandishi.
- issue: Wakati wa וְשָׁמְעוּ
  choice: 'Wakati timilifu: ‘wameyasikia’'
  alternative: ‘wanayasikia’ au ‘watayasikia’
  rationale: Qatal ya kishairi inaweza kueleweka kwa zaidi ya wakati mmoja kulingana na muktadha. Tafsiri hii inafuata usomaji wa tendo lililotimia bila kudai kwamba usomaji wa sasa au ujao hauwezekani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. ‘Jabali’ huhifadhi taswira ya uso mkubwa wa mwamba, na sentensi fupi hudumisha mkazo wa mstari wa Kiebrania.
