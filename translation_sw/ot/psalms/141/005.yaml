base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/005.yaml
  text: Let a righteous man strike me—it is a kindness[a]; let him rebuke me—it is oil for the head; let my head not refuse it[d][c][b]. For still my prayer is against their evils.
translation:
  language: sw
  text: Mtu mwenye haki anipige—hilo ni tendo la fadhili[a][d]; anikemee—hayo ni mafuta ya kichwa; kichwa changu kisiyakatae[b]. Kwa maana bado sala yangu ni dhidi ya maovu yao[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtu mwenye haki anipige kwa upendo mwaminifu,” ikiwa חֶסֶד linaeleweka kwa maana nzito zaidi ya uaminifu au rehema.
    reason: lexical_alternative
  - marker: d
    text: Au, “hilo ni fadhili.”
    reason: previous_rendering
  - marker: b
    text: Kiebrania ni kigumu; “kichwa changu kisiyakatae” kinaweza pia kueleweka kama “kichwa changu kisiyakatalie” au “kisiyakiepuke.”
    reason: lexical_alternative
  - marker: c
    text: Kishazi cha mwisho hakina uhakika. Kinaweza pia kumaanisha, “kwa maana bado sala yangu iko katika misiba yao,” au, “kwa maana hata wakati huo sala yangu ni kwa ajili yao katika taabu zao.”
    reason: alternative_reading
lexical_decisions:
- source_word: יֶהֶלְמֵנִי
  choice: na anipige
  rationale: Kitenzi הלם kinaonyesha pigo lenye nguvu. “Anipige” huhifadhi mfano halisi bila kutumia lugha ya kizamani; muundo wa “na” unaonyesha ruhusa au ombi.
- source_word: צַדִּיק
  choice: mtu mwenye haki
  rationale: Kivumishi cha umoja kimetumiwa kama nomino. “Mtu mwenye haki” ni Kiswahili cha kawaida na huonyesha mtu mmoja anayewakilisha wenye haki bila kudai kwamba ni mtu fulani maalumu.
- source_word: חֶסֶד
  choice: tendo la fadhili
  rationale: Katika muktadha huu neno linaeleza kwamba pigo la mwenye haki ni tendo lenye nia njema. “Tendo la fadhili” linaweka wazi kuwa ni kitendo fulani cha wema, huku maana pana ya upendo mwaminifu ikihifadhiwa katika tanbihi.
- source_word: וְיוֹכִיחֵנִי
  choice: na anikemee
  rationale: Hifili ya יכח humaanisha kukaripia au kusahihisha. “Anikemee” huhifadhi ukali wa maonyo ya kimaadili.
- source_word: שֶׁמֶן רֹאשׁ
  choice: mafuta ya kichwa
  rationale: Tafsiri hii huhifadhi picha ya mafuta yanayowekwa kichwani bila kuamua kuwa ni mafuta ya ibada rasmi ya kutiwa mafuta.
- source_word: אַל יָנִי רֹאשִׁי
  choice: kichwa changu kisiyakatae
  rationale: Kitenzi cha Kiebrania hapa ni kigumu. Tafsiri hii inafuata muktadha wa kutokataa maonyo yenye manufaa na inadumisha “kichwa changu” kama kiima cha mfano huo.
- source_word: כִּי עוֹד
  choice: kwa maana bado
  rationale: Maneno haya yanaendeleza wazo na kutoa sababu; “kwa maana bado” ni ya kawaida na huhifadhi uhusiano huo.
- source_word: וּתְפִלָּתִי
  choice: sala yangu
  rationale: Hii ni nomino yenye kiambishi cha nafsi ya kwanza umoja; kiunganishi chake kimeingizwa kwa kawaida katika mtiririko wa sentensi.
- source_word: בְּרָעוֹתֵיהֶם
  choice: dhidi ya maovu yao
  rationale: Nguvu ya kihusishi ב ni tata. Kwa kuzingatia muktadha mpana, “dhidi ya maovu yao” inaonyesha sala inayohusiana kwa upinzani na matendo maovu, huku uwezekano mwingine ukielezwa katika tanbihi.
theological_decisions:
- issue: Uwakilishi wa jinsia katika צַדִּיק
  choice: mtu mwenye haki
  alternative: mwenye haki
  rationale: Kiebrania ni umoja wa kiume unaotumiwa kiwakilishi. Kiswahili hakihitaji kuongeza “mwanamume”; “mtu mwenye haki” huhifadhi umoja na maana ya mtu bila kuingiza mkazo wa jinsia usio wa lazima.
- issue: Maana ya kishazi cha mwisho kilicho kigumu
  choice: Kwa maana bado sala yangu ni dhidi ya maovu yao
  alternative: Kwa maana hata wakati huo sala yangu ni kwa ajili yao katika taabu zao
  rationale: Kihusishi ב na kiwakilishi tamati vinaweza kufasiriwa kwa njia zaidi ya moja. Tafsiri kuu inafaa tofauti ya kimuktadha kati ya maonyo ya mwenye haki na maovu ya waovu, lakini tanbihi inahifadhi utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, kimetumiwa. Lugha ni rahisi kueleweka kwa wasomaji wa kawaida, huku picha halisi za “kupiga,” “mafuta ya kichwa,” na “kichwa” zikihifadhiwa. Utata wa kisarufi katika nusu ya pili haujafichwa bali umeonyeshwa katika tanbihi.
