  text: שִׁיתָ֣/ה יְ֭הוָה שָׁמְרָ֣ה לְ/פִ֑/י נִ֝צְּרָ֗/ה עַל דַּ֥ל שְׂפָתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/003.yaml
  text: Set a guard[a], O Yahweh, over my mouth; keep watch over the door of my lips.
translation:
  language: sw
  text: Ee Yahweh, weka mlinzi wa kinywa changu; linda mlango wa midomo yangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיתָה
  choice: weka
  rationale: Ombi la moja kwa moja linalomaanisha kuweka au kusimamisha kitu mahali; “weka” ni la kawaida na linaendana na “mlinzi.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu katika maandishi ya Kiebrania limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: שָׁמְרָה
  choice: mlinzi
  rationale: Nomino hii inaonyesha mlinzi au ulinzi unaowekwa; “mlinzi” inadumisha picha halisi ya anayezuia maneno yasiyofaa kutoka.
- source_word: לְפִי
  choice: kinywani mwangu
  rationale: Kihusishi pamoja na “kinywa changu” kinaelezwa kwa Kiswahili cha kawaida kama mahali anapowekwa mlinzi.
- source_word: נִצְּרָה
  choice: linda
  rationale: Amri ya ombi yenye maana ya kutunza au kukesha; “linda” ni ya asili na inadumisha usambamba wa kishairi.
- source_word: עַל
  choice: —
  rationale: Uhusiano wake na kitu kinacholindwa umejumuishwa kiasili katika kitenzi cha Kiswahili “linda,” ambacho hakihitaji kutafsiriwa kwa kihusishi tofauti hapa.
- source_word: דַּל שְׂפָתָי
  choice: mlango wa midomo yangu
  rationale: Inahifadhi sitiari halisi ya Kiebrania ya midomo kama mlango unaoweza kufunguliwa au kufungwa.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yanatumia Tetragramatoni kama jina binafsi; “Yahweh” huhifadhi jina hilo bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala. “Ee” huonyesha mwito wa moja kwa moja, na sitiari ya “mlango wa midomo” imehifadhiwa kwa sababu inaeleweka na ni muhimu kwa picha ya kishairi.
