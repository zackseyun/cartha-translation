  verdict: revise
  source_fidelity: The two imperative pleas, the divine name, the concrete guard image, and the metaphor of the door of the lips are retained. However, “kinywani mwangu” normally locates the guard inside the speaker’s mouth, whereas the Hebrew asks for a guard in relation to/over the mouth.
  naturalness: “Mlinzi wa kinywa changu” is natural Standard East African Swahili and conveys a guard assigned to the mouth without the unintended image of one being inside it. “Mlango wa midomo yangu” is a clear, suitably poetic preservation of the Hebrew metaphor.
  terminology: “Yahweh” consistently preserves the stipulated rendering of the Tetragrammaton. “Mlinzi,” “kinywa,” and “midomo” are appropriate, modern, and dignified prayer-language choices.
  issues:
  - severity: medium
    issue: “kinywani mwangu” gives an unintended locative sense.
    rationale: In ordinary Kiswahili it means ‘in my mouth.’ The Hebrew לְפִי marks the mouth as that for/over which a guard is appointed, not the interior location of the guard.
  revised_text: Ee Yahweh, weka mlinzi wa kinywa changu; linda mlango wa midomo yangu.
