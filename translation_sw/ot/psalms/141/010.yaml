  yaml_path: translation/ot/psalms/141/010.yaml
  text: Let the wicked fall into their own nets together[c][b][a], while I pass by.
translation:
  language: sw
  text: Waovu waanguke pamoja katika nyavu zao wenyewe,[a] mpaka mimi nipite.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “nyavu zake.” Kiambishi tamati ni cha umoja wa kiume, ingawa “waovu” ni wingi; huenda maana ikawa nyavu za kila mwovu, yaani, “nyavu zao wenyewe.”
    reason: alternative_reading
  - marker: b
    text: Au, “huku mimi nikipita.” Kihalisi zaidi, “mpaka nitakapopita” au “mpaka nitakapovuka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְּלוּ
  choice: na waanguke
  rationale: Kauli ya wakati usiotimilika ya Qal inaweza kuwa ya kutakia au kuomba katika muktadha huu. Muundo “na waanguke” unaonyesha nguvu hiyo bila kuifanya kuwa taarifa ya uhakika kuhusu wakati ujao.
- source_word: בְמַכְמֹרָיו
  choice: katika nyavu zao wenyewe
  rationale: מַכְמֹר ni wavu wa kunasia, na umbo hapa ni wingi wenye kiambishi cha nafsi ya tatu umoja wa kiume, kihalisi “nyavu zake.” Kwa sababu mhusika ni “waovu” katika wingi, maana ya kimuktadha inaweza kuwa ya kugawa kwa kila mmoja—nyavu zao wenyewe. Tanbihi inahifadhi umbo na utata wa Kiebrania.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Nomino ya wingi inayowataja watu waovu bila kulazimisha jinsia; “waovu” ni ya kawaida, fupi, na yenye hadhi katika Kiswahili.
- source_word: יַחַד
  choice: wote pamoja
  rationale: Kielezi hiki kinaweza kuonyesha pamoja au kwa wakati mmoja. “Wote pamoja” huwasilisha mkazo wa jumla kwa Kiswahili cha kawaida.
- source_word: אָנֹכִי
  choice: mimi
  rationale: Kiwakilishi huru kina mkazo. Kutaja “mimi” wazi kunahifadhi utofautishaji kati ya hatima ya waovu na ya mwombaji.
- source_word: עַד
  choice: mpaka
  rationale: Maana ya msingi ni “mpaka/hadi.” Tafsiri hii inahifadhi muundo wa mstari wa Kiebrania badala ya kuubadili kimyakimya kuwa “huku,” ingawa maana ya wakati mmoja inawezekana na imetajwa katika tanbihi.
- source_word: אֶעֱבוֹר
  choice: nitakapopita
  rationale: עבר hapa ni kupita au kuvuka. Tafsiri haiongezi “salama,” kwa kuwa usalama unaeleweka kutokana na muktadha lakini haujasemwa wazi katika Kiebrania.
theological_decisions:
- issue: Ombi la waovu kuanguka katika mitego
  choice: Kudumisha kauli ya kutakia “na waanguke”
  alternative: “Waovu wataanguka”
  rationale: Muktadha wa zaburi ni ombi, na umbo la kitenzi linaweza kuwa la kutakia. Tafsiri haibadilishi ombi hilo kuwa unabii wa lazima wala kulipunguza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. Mpangilio umefanywa kuwa wa kawaida kwa Kiswahili huku mkazo wa kishairi, ombi la kutakia, na utata wa kiwakilishi cha Kiebrania vikihifadhiwa kwa tanbihi.
