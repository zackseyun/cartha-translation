  yaml_path: translation/ot/psalms/141/001.yaml
  text: A psalm of David. O Yahweh[a], I call to you; hurry to me. Give ear to my voice when I call to you.
translation:
  language: sw
  text: Zaburi ya Daudi. Ee Yahweh[a], ninakuita; unijie upesi. Sikiliza sauti yangu ninapokuita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH, jina ambalo kwa desturi hutafsiriwa “BWANA”; pia huandikwa “Yahwe.”'
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ndilo neno la kawaida na lililozoeleka katika Kiswahili kwa utungo wa aina hii wa kuimbwa au kusomwa katika ibada.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Muundo huu wa kawaida katika vichwa vya zaburi unaacha wazi uhusiano unaoweza kumaanisha utunzi, umiliki, kuwekwa wakfu, au kuhusishwa na Daudi, bila kulazimisha maana moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa konsonanti YHWH limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: קְרָאתִיךָ
  choice: ninakuita
  rationale: Ingawa kitenzi cha Kiebrania kina umbo la timilifu, katika ombi hili kinaweza kueleza mwito wa sasa au unaoendelea; Kiswahili cha wakati wa sasa kinafaa katika muktadha.
- source_word: חוּשָׁה לִּי
  choice: unijie upesi
  rationale: Kauli hii inaomba hatua ya haraka kuelekea kwa mwombaji. Tafsiri hii ni ya asili katika Kiswahili na inadumisha dharura ya ombi.
- source_word: הַאֲזִינָה
  choice: Sikiliza
  rationale: Amri hii inaomba usikivu makini. 'Sikiliza' ni ya sasa, wazi, na yenye heshima katika sala.
- source_word: קוֹלִי
  choice: sauti yangu
  rationale: Hii inadumisha maana ya moja kwa moja ya nomino ya Kiebrania bila kuibadili kimafasiri kuwa 'kilio changu.'
- source_word: בְּקָרְאִי לָךְ
  choice: ninapokuita
  rationale: Kihusishi pamoja na jina-kitenzi kina maana ya wakati hapa; 'ninapokuita' ni Kiswahili cha kawaida na hudumisha mazingira ya sala inayoendelea.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi YHWH. 'Yahwe' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku tanbihi ikieleza desturi nyingine ya kulitafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. 'Ee' hudumisha sauti ya sala, na sentensi fupi zinaakisi dharura ya Kiebrania.
