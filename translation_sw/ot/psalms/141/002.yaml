base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/002.yaml
  text: May my prayer be established before you as incense[b][a], the lifting up of my hands as the evening offering.
translation:
  language: sw
  text: Sala yangu na iwekwe mbele zako kama uvumba[a]; kuinuliwa kwa mikono yangu kuwe kama sadaka ya jioni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na iandaliwe” au “na ithibitishwe” mbele zako; Kiebrania kinaomba sala iwekwe kwa uthabiti katika uwepo wa Mungu.
    reason: lexical_alternative
  - marker: b
    text: “Sadaka ya jioni” ni sadaka ya kawaida iliyotolewa wakati wa jioni; hasa zaidi, neno la Kiebrania linaweza kumaanisha sadaka ya nafaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכּוֹן
  choice: na iwe imara
  rationale: Kauli ya kutakia kutoka mzizi כון katika Nifali inaomba sala ithibitishwe au iwekwe kwa uthabiti mbele za Mungu. “Na iwe imara” huhifadhi maana hiyo bila kuifasiri moja kwa moja kuwa “ikubaliwe.”
- source_word: תְּפִלָּתִי
  choice: sala yangu
  rationale: Nomino yenye kiambishi cha nafsi ya kwanza umoja; huu ndio usemi wa kawaida na wa heshima katika Kiswahili.
- source_word: קְטֹרֶת
  choice: uvumba
  rationale: Neno la kawaida kwa kitu chenye harufu nzuri kinachofukizwa kama sadaka mbele za Mungu; huhifadhi taswira ya ibada.
- source_word: לְפָנֶיךָ
  choice: mbele zako
  rationale: Huwakilisha kwa karibu usemi wa Kiebrania unaomaanisha mbele ya Mungu au katika uwepo wake.
- source_word: מַשְׂאַת
  choice: kuinua
  rationale: Katika muungano na “mikono yangu,” nomino hii inaeleza tendo la kuinua mikono katika sala.
- source_word: כַּפַּי
  choice: mikono yangu
  rationale: Ingawa כף inaweza kumaanisha viganja, “mikono” ni sawa ya kawaida katika Kiswahili kwa ishara hii ya kusali.
- source_word: מִנְחַת עָרֶב
  choice: sadaka ya jioni
  rationale: Huhifadhi rejeo la ibada kwa ufupi. מִנְחָה inaweza kumaanisha sadaka ya nafaka, jambo linalofafanuliwa katika tanbihi bila kulibana neno katika matini kuu.
theological_decisions:
- issue: Taswira ya ibada ya sadaka inapotumiwa kuhusu sala
  choice: Sala na kuinuliwa kwa mikono vinalinganishwa na uvumba na sadaka ya jioni.
  alternative: Kusema kwamba sala inachukua kabisa nafasi ya sadaka.
  rationale: Kiebrania kinaweka sambamba mambo haya kwa taswira ya wazi ya ibada, lakini hakitoi hapa dai kamili kwamba mfumo wa sadaka umeondolewa au kubadilishwa na sala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mistari miwili na ulinganisho wa kiibada umehifadhiwa; “na iwe/na kuwe” huonyesha ombi bila kuongeza wazo la kukubaliwa ambalo liko tu kwa kidokezo.
