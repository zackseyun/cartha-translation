  yaml_path: translation/ot/psalms/141/000.yaml
  text: A psalm of David. Yahweh[a], I call to you; hurry to me. Give ear to my voice when I call to you.
translation:
  language: sw
  text: 'Zaburi ya Daudi.


    YAHWEH[a], ninakuita; unijie upesi. Sikiliza sauti yangu ninapokuita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH, jina la Mungu ambalo kwa desturi hutafsiriwa “BWANA”; “Yahweh” ni matamshi yanayotumiwa mara nyingi.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Neno la kawaida na lenye hadhi katika Kiswahili kwa wimbo wa ibada unaoambatana na muziki.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kiambishi לְ katika vichwa vya zaburi kinaweza kuonyesha uhusiano na Daudi, ikiwemo utunzi au wakfu; ‘ya Daudi’ huhifadhi upana huo kuliko ‘iliyoandikwa na Daudi.’
- source_word: יְהוָה
  choice: YAHWE
  rationale: Linatambulisha wazi jina la agano YHWH badala ya kulibadilisha kuwa cheo; herufi kubwa hulitofautisha na majina ya kawaida.
- source_word: חוּשָׁה לִּי
  choice: uje kwangu upesi
  rationale: Kauli ya Kiebrania inaomba hatua ya haraka kwa ajili ya mwombaji; Kiswahili hiki ni cha asili na hakiongezi aina maalumu ya msaada.
- source_word: הַאֲזִינָה קוֹלִי
  choice: Sikiliza sauti yangu
  rationale: Huwasilisha ombi la kusikilizwa kwa makini kwa lugha ya kawaida na yenye hadhi.
- source_word: בְּקָרְאִי לָךְ
  choice: ninapokuita
  rationale: Huhifadhi uhusiano wa wakati katika Kiebrania na kurudiwa kwa kitenzi ‘kuita.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu YHWH
  choice: YAHWE[a]
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi YHWH. ‘YAHWE’ hulihifadhi katika matini, huku tanbihi ikieleza desturi ya kulitafsiri ‘BWANA’ na kutokuwapo kwa uhakika kamili kuhusu matamshi ya kale.
- issue: Maana ya לְ katika kichwa לְדָוִד
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi
  rationale: ‘Ya Daudi’ haifungi kimakusudi uhusiano huo katika madai ya utunzi pekee, kwa kuwa kiambishi hicho katika vichwa kinaweza kuwa na wigo mpana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi bila kuwa kigumu. Ombi limegawanywa katika sentensi fupi ili kuhifadhi msisitizo na mwendo wa Kiebrania.
