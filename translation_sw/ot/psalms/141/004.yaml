  naturalness: The wording is generally clear and dignified Standard East African Swahili. Replacing “ili nijishughulishe” with “nisije nikatenda” is more idiomatic in this negative petition and renders the concrete verbal force of the Hebrew more directly. The footnote spelling “watenda maovu” should not use a hyphen.
  terminology: “Moyo wangu,” “matendo maovu,” “watu watendao uovu,” and “vyakula vyao teule” are appropriate, natural renderings. Footnote a should give actual lexical alternatives for דבר rather than merely replacing “baya” with its synonym “ovu.”
