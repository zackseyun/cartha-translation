base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/004.yaml
  text: Do not incline my heart to any evil thing[a], to practice wicked deeds with men who work iniquity[c][b]; and let me not eat of their delicacies.
translation:
  language: sw
  text: Usiuelekeze moyo wangu kwenye jambo lolote baya[a], nisije nikatenda matendo maovu pamoja na watu watendao uovu[b]; wala nisile vyakula vyao teule[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye neno baya” au “kwenye kitu kibaya.” Neno la Kiebrania davar linaweza kumaanisha “jambo,” “neno,” au “kitu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “pamoja na watenda maovu.” Kwa maana halisi, “pamoja na watu watendao uovu.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, vyakula vyao vizuri au vitu vyao vya kupendeza; usemi huu unaweza pia kudokeza kushiriki anasa zao za dhambi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּט
  choice: uelekeze
  rationale: Kitenzi נטה hapa kina moyo kama yambwa na humwomba Mungu asiufanye moyo uelekee upande wa uovu. ‘Uelekeze’ huhifadhi picha hiyo na nguvu ya ombi.
- source_word: לִבִּי
  choice: moyo wangu
  rationale: ‘Moyo’ hudumisha taswira ya Kiebrania inayohusu nia, matamanio na mawazo ya ndani.
- source_word: לְדָבָר רָע
  choice: kwenye jambo lolote baya
  rationale: דבר inaweza kumaanisha jambo, neno, au kitu. ‘Jambo’ linafaa katika muktadha huu bila kuibana maana iwe maneno pekee; ‘lolote’ huwasilisha kutokuwa maalumu kwa usemi huo.
- source_word: לְהִתְעוֹלֵל עֲלִילוֹת בְּרֶשַׁע
  choice: ili nijishughulishe na matendo maovu
  rationale: Muundo huu unaonyesha kujihusisha kimakusudi katika matendo. ‘Nijishughulishe’ ni Kiswahili cha kawaida kinachobeba wazo la kushiriki, huku ‘matendo maovu’ kikihifadhi maana ya עֲלִילוֹת בְּרֶשַׁע.
- source_word: אֶת אִישִׁים פֹּעֲלֵי אָוֶן
  choice: pamoja na watu watendao uovu
  rationale: Usemi huu unaonyesha ushirika na watu wanaotambulika kwa kutenda uovu. ‘Watu watendao uovu’ ni wa asili na wenye hadhi katika Kiswahili, huku ukihifadhi taswira ya kitendo katika פֹּעֲלֵי.
- source_word: וּבַל אֶלְחַם
  choice: wala nisile
  rationale: Chembe hasi inaendeleza ombi, na אֶלְחַם hapa humaanisha kula. ‘Wala nisile’ ni mwendelezo wa kawaida wa ombi hilo katika Kiswahili.
- source_word: בְּמַנְעַמֵּיהֶם
  choice: vyakula vyao teule
  rationale: Nomino hii hurejelea vitu vya kupendeza, hasa vyakula vizuri au vya kuchaguliwa. ‘Vyakula vyao teule’ hudumisha picha ya kula bila kudai kuwa lazima ni vitu vitamu kwa ladha.
theological_decisions:
- issue: Uwajibikaji wa kimaadili na tendo la Mungu katika ombi ‘Usiuelekeze moyo wangu’
  choice: Ombi limeelekezwa moja kwa moja kwa Mungu bila kupunguza usemi unaomhusisha na mwelekeo wa moyo.
  alternative: Usiache moyo wangu uelekee kwenye jambo baya.
  rationale: Kiebrania kinamwomba Mungu moja kwa moja kuhusu mwelekeo wa moyo wa mtunga zaburi. Tafsiri inahifadhi mvutano huo wa kiteolojia badala ya kuutatua kwa kugeuza ombi kuwa la ruhusa tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘Usiuelekeze moyo wangu’ umehifadhi sitiari na mvutano wa ombi la Kiebrania; ‘wala nisile’ huhifadhi picha halisi huku dokezo la ushirika wa kimaadili likielezwa katika tanbihi.
