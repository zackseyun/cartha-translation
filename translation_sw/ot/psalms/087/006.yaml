lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna iliyozoeleka katika Kiswahili, badala ya kulibadilisha kuwa cheo.
- source_word: יִסְפֹּר
  choice: atahesabu
  rationale: Kitenzi ספר katika qal humaanisha hasa ‘kuhesabu’; mazingira ya orodha yanafafanuliwa na kishazi kinachofuata.
- source_word: בִּכְתוֹב
  choice: atakapowaandika
  rationale: ב pamoja na kitenzi-jina hapa ina maana ya wakati, ‘atakapoandika’; kiambishi -wa- kinaonyesha kuwa mataifa ndiyo yanayoingizwa katika orodha.
- source_word: עַמִּים
  choice: mataifa
  rationale: Katika muktadha huu wa makundi mengi ya watu, ‘mataifa’ ni Kiswahili cha kawaida na chenye kueleweka, ingawa neno la Kiebrania linaweza pia kutafsiriwa ‘watu mbalimbali.’
- source_word: זֶה
  choice: Huyu
  rationale: Kiwakilishi cha kuonyesha cha umoja kinamtaja mtu mmoja bila kuongeza neno ‘mwanamume.’
- source_word: יֻלַּד
  choice: alizaliwa
  rationale: Kauli tendwa ya ילד inaeleza moja kwa moja kwamba mtu huyo alizaliwa.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki humaanisha ‘huko/pale’; kinarejelea Sayuni katika muktadha bila kulitaja wazi ndani ya mstari.
- source_word: סֶלָה
  choice: Sela
  rationale: Neno la kiliturujia au kimuziki limetoholewa kwa sababu maana yake kamili haijulikani kwa uhakika.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: ‘Yahwe’ huhifadhi jina binafsi la agano na ni umbo la Kiswahili la matamshi yanayokubalika zaidi kitaaluma.
- issue: Kama שָׁם ifafanuliwe kuwa ‘ndani yake’ au ‘katika Sayuni’
  choice: huko
  alternative: ndani yake, yaani Sayuni
  rationale: Kiebrania kimetumia kielezi ‘huko’; tafsiri hii inadumisha namna ya usemi na kutatua rejeleo lake katika tanbihi badala ya kulifafanua kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sentensi umehifadhi taswira ya kuhesabu na kuandika katika orodha; ‘Sela’ limeachwa kama neno la kimuziki au kiliturujia lisilo na maana hakika.
