  text: Yahweh will count[a], when he records the peoples, “This one was born there.” Selah
translation:
  language: sw
  text: 'Yahwe atahesabu atakapoyaandika mataifa katika orodha: “Huyu alizaliwa huko.”[a] Sela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kulingana zaidi na muktadha, “ndani yake,” yaani ndani ya Sayuni inayotajwa katika mistari inayozunguka.
