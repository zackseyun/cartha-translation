  text: אַזְכִּ֤יר רַ֥הַב וּ/בָבֶ֗ל לְֽ/יֹ֫דְעָ֥/י הִנֵּ֤ה פְלֶ֣שֶׁת וְ/צ֣וֹר עִם כּ֑וּשׁ זֶ֝֗ה יֻלַּד שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/004.yaml
  text: 'I will mention Rahab and Babylon among those who know me[a]; behold, Philistia and Tyre[c][b], along with Cush: this one was born there.'
translation:
  language: sw
  text: 'Nitataja Rahabu[a] na Babeli miongoni mwa wanaonijua[b]; tazama, Ufilisti na Tiro, pamoja na Kushi: huyu alizaliwa huko.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rahabu ni jina la kishairi la Misri.
    reason: alternative_reading
  - marker: b
    text: Au, “kwa wale wanaonijua.” Kirai cha Kiebrania kinaweza kumaanisha kuwa mataifa hayo yanahesabiwa miongoni mwa wale wanaomjua msemaji, au kwamba yanatajwa kwao.
    reason: lexical_alternative
  - marker: c
    text: Yaani, Sayuni, kulingana na muktadha wa zaburi hii.
    reason: cross_reference
lexical_decisions:
- source_word: אַזְכִּיר
  choice: Nitataja
  rationale: Hifili ya זכר hapa ina maana ya kutaja au kufanya ikumbukwe. “Nitataja” ni ya kawaida, yenye hadhi, na inafaa orodha hii ya kishairi.
- source_word: רַהַב
  choice: Rahabu
  rationale: Jina la kishairi limedumishwa kwa unukuzi wa Kiswahili; katika muktadha huu linaitaja Misri, jambo linaloelezwa katika tanbihi.
- source_word: וּבָבֶל
  choice: na Babeli
  rationale: Babeli ni umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: לְיֹדְעָי
  choice: miongoni mwa wanaonijua
  rationale: Kirai cha Kiebrania ni kifupi na kinaweza kuonyesha kuingizwa katika kundi la wale wanaomjua msemaji; tanbihi inadumisha uwezekano wa maana ya “kwa wale wanaonijua.”
- source_word: הִנֵּה
  choice: tazama
  rationale: Neno hili linaelekeza usikivu wa msomaji na kudumisha mtindo wa kishairi wenye hadhi.
- source_word: פְלֶשֶׁת
  choice: Ufilisti
  rationale: Kiebrania kinataja nchi au eneo, si Wafilisti kama watu moja kwa moja.
- source_word: וְצוֹר
  choice: na Tiro
  rationale: Tiro ni jina la Kiswahili linalotumiwa kwa mji huu wa kale.
- source_word: עִם כּוּשׁ
  choice: pamoja na Kushi
  rationale: “Pamoja na” linaonyesha uandamani na kuunganisha Kushi na mataifa mengine yaliyotajwa.
- source_word: זֶה
  choice: huyu
  rationale: Kiwakilishi hiki ni cha umoja na kinaelekea kwa mtu; “huyu” hudumisha umoja bila kuongeza nomino isiyokuwapo katika Kiebrania.
- source_word: יֻלַּד שָׁם
  choice: alizaliwa huko
  rationale: Hili ni tamko la moja kwa moja la kuzaliwa mahali pale; “huko” hudumisha rejeo la kimuktadha bila kulitaja wazi ndani ya mstari.
theological_decisions:
- issue: Utambulisho wa msemaji katika “wanaonijua”
  choice: Kudumisha nafsi ya kwanza bila kumtaja msemaji waziwazi.
  alternative: Kumtambulisha msemaji kuwa Bwana au Sayuni iliyofanywa kama mtu.
  rationale: Mstari wenyewe haumtambui msemaji moja kwa moja. Kudumisha “-ni-” kunaacha utambulisho huo ueleweke kutokana na muktadha wa zaburi.
- issue: Mahali panaporejelewa na “huko”
  choice: Kudumisha “huko” katika maandishi na kueleza Sayuni katika tanbihi.
  alternative: Kutafsiri moja kwa moja “alizaliwa Sayuni” au “alizaliwa katika mji wa Mungu.”
  rationale: Kiebrania kinasema tu “huko”; muktadha unaelekeza Sayuni, lakini kulitaja katika maandishi kungeondoa ufupi na mvutano wa kishairi wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na ladha ya kishairi. Majina Rahabu, Babeli, Ufilisti, Tiro na Kushi yamedumishwa kama majina ya kale. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
