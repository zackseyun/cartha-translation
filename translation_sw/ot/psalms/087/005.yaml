  text: And of Zion it will be said[a], “This one and that one were born in her,” and the Most High himself will establish her.
translation:
  language: sw
  text: Na kuhusu Sayuni itasemwa[a], “Huyu na yule walizaliwa ndani yake,” na Aliye Juu Zaidi mwenyewe ataiimarisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “mtu mmoja baada ya mwingine alizaliwa ndani yake.” Kiebrania hurudia “mtu na mtu” kuonyesha maana ya mgawanyo: mtu mmoja baada ya mwingine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלֲצִיּוֹן
  choice: Na kuhusu Sayuni
  rationale: Kiambishi ל kinaanzisha mada kuhusu Sayuni; “kuhusu” ni Kiswahili cha kawaida na wazi, huku וּ kikihifadhiwa kwa “Na” ili kuendeleza mtiririko wa kishairi.
- source_word: יֵאָמַר
  choice: itasemwa
  rationale: Nifali isiyotimilika ya אמר inafaa kutafsiriwa kwa kauli tendwa isiyo na mtendaji aliyetajwa, “itasemwa.”
- source_word: אִישׁ וְאִישׁ
  choice: Huyu na yule
  rationale: Kurudiwa kwa אִישׁ kuna maana ya kugawa kwa watu mmoja mmoja. “Huyu na yule” huhifadhi mtindo huo kwa Kiswahili cha asili bila kulazimisha neno la kijinsia.
- source_word: יֻלַּד בָּהּ
  choice: walizaliwa ndani yake
  rationale: Ingawa kitenzi cha Kiebrania ni cha umoja kwa muundo, msemo wa kugawa “huyu na yule” kwa kawaida huchukua wingi katika Kiswahili. “Ndani yake” huhifadhi taswira ya Sayuni kama mji uliotajwa kwa nafsi.
- source_word: וְהוּא
  choice: naye ... mwenyewe
  rationale: Kiwakilishi hiki kina mkazo; “naye ... mwenyewe” huonyesha mkazo huo na kukiunganisha na cheo cha Mungu kinachofuata.
- source_word: יְכוֹנְנֶהָ
  choice: ataimarisha
  rationale: Kitenzi כון hapa kina wazo la kuweka imara, kuthibitisha, au kuufanya mji uwe salama. “Ataimarisha” ni wazi na huhifadhi upana huo vizuri.
- source_word: עֶלְיוֹן
  choice: Aliye Juu Zaidi
  rationale: Hiki ni cheo cha Mungu; “Aliye Juu Zaidi” ni tafsiri ya heshima, wazi, na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Mrejeo wa kiwakilishi chenye mkazo וְהוּא pamoja na עֶלְיוֹן
  choice: “naye Aliye Juu Zaidi mwenyewe” humrejelea Mungu kwa mkazo
  alternative: “naye, Aliye Juu Zaidi, ataimarisha”
  rationale: Muundo wa Kiebrania unaweka msingi wa uthabiti wa Sayuni katika tendo la Mungu mwenyewe. Tafsiri hii huhifadhi mkazo bila kuongeza dai la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi na chenye heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya Sayuni kama mji mwenye sifa za nafsi imehifadhiwa kwa “ndani yake,” na urudiaji wa Kiebrania umetolewa kwa msemo wa kawaida “huyu na yule.”
