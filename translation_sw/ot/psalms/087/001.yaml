  text: Zaburi na wimbo wa wana wa Kora[a]. Msingi wake uko katika milima mitakatifu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya wana wa Kora”; neno la Kiebrania linaweza kuonyesha uhusiano badala ya uandishi wa moja kwa moja.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hakitaji wazi anayerejelewa na kiambishi katika “msingi wake”; kinaweza kumhusu Mungu, au kurejelea Sayuni/Yerusalemu.
