lexical_decisions:
- source_word: לִבְנֵי קֹרַח
  choice: ya wana wa Kora
  rationale: Kiambishi ל־ katika vichwa vya zaburi kinaweza kuonyesha uandishi, umiliki, au uhusiano. “Ya wana wa Kora” ni kifupi na cha kawaida, huku tanbihi ikihifadhi uwezekano wa maana “kwa ajili ya wana wa Kora.”
- source_word: מִזְמוֹר שִׁיר
  choice: Zaburi; wimbo
  rationale: Maneno yote mawili ya aina ya utungo yamehifadhiwa badala ya kuunganishwa kuwa neno moja. Nuktamkato huonyesha kuwa yote ni sehemu za kichwa kimoja.
- source_word: יְסוּדָתוֹ
  choice: Msingi wake
  rationale: Nomino ina maana ya “msingi,” na kiambishi cha nafsi ya tatu umoja wa kiume kinaonyeshwa kwa “wake.” Kiswahili hakilazimishi kutaja wazi kama mwenye msingi ni Mungu au kama msingi huo ni wa Sayuni/Yerusalemu, hivyo utata wa Kiebrania unabaki.
- source_word: בְּהַרְרֵי קֹדֶשׁ
  choice: katika milima mitakatifu
  rationale: בְּ inaweza kumaanisha “katika” au “juu ya,” na קֹדֶשׁ hapa inaeleza utakatifu wa milima. “Katika milima mitakatifu” ni ya asili katika Kiswahili na haibainishi kupita kiasi hali ya kijiografia.
theological_decisions:
- issue: Kirejeleo cha kiambishi katika יְסוּדָתוֹ
  choice: Kuhifadhi utata kwa “Msingi wake” bila kumtaja mwenye msingi katika matini kuu.
  alternative: “Msingi wake [Sayuni/Yerusalemu]” au “Ameuweka msingi wake,” kwa kumfanya Mungu kuwa mhusika wazi.
  rationale: Kiebrania kina kiambishi cha nafsi ya tatu umoja wa kiume lakini hakitaji kirejeleo chake katika mstari huu. Muktadha unaofuata unaihusu Sayuni, lakini mstari wenyewe unaweza kueleweka kwa njia zaidi ya moja; tafsiri haipaswi kuamua jambo hilo kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kichwa umehifadhi istilahi zote mbili, “zaburi” na “wimbo,” na utata wa mstari wa pili umeachwa wazi.
