  text: אֹהֵ֣ב יְ֭הוָה שַׁעֲרֵ֣י צִיּ֑וֹן מִ֝/כֹּ֗ל מִשְׁכְּנ֥וֹת יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/002.yaml
  text: Yahweh loves the gates of Zion more than all the dwellings of Jacob[a].
translation:
  language: sw
  text: Yahwe anapenda malango ya Sayuni kuliko makao yote ya Yakobo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe anapenda malango ya Sayuni zaidi ya makao yote ya Yakobo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: anapenda
  rationale: Kitenzi kishirikishi cha Qal kimetumika kama kitenzi chenye Yahwe kama mtenda. ‘Anapenda’ ni Kiswahili cha kawaida kinachohifadhi maana ya hali inayoendelea bila kuongeza kiwango cha hisia kisichotajwa wazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: שַׁעֲרֵי
  choice: malango ya
  rationale: Wingi wa neno katika hali ya muundo tegemezi. ‘Malango ya Sayuni’ huhifadhi picha halisi ya malango, ingawa yanaweza pia kuiwakilisha mji mzima.
- source_word: צִיּוֹן
  choice: Sayuni
  rationale: ‘Sayuni’ ni umbo la jina hili lililozoeleka katika Kiswahili sanifu cha Biblia.
- source_word: מִכֹּל
  choice: kuliko ... yote
  rationale: Baada ya kitenzi cha upendeleo, kihusishi מִן pamoja na כֹּל kinaonyesha ulinganisho. ‘Kuliko ... yote’ huonyesha wazi kwamba malango ya Sayuni yanapendwa zaidi.
- source_word: מִשְׁכְּנוֹת
  choice: makao
  rationale: Katika muktadha huu neno lina maana ya maeneo ya kukaa, si hema takatifu. ‘Makao’ ni la kawaida, lenye hadhi, na halileti maana ya kiibada isiyokusudiwa.
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Jina lililo katika Kiebrania limehifadhiwa badala ya kufasiriwa kuwa ‘Israeli,’ ingawa hapa linaweza kuwawakilisha watu au nchi yao.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya ulinganisho katika מִכֹּל
  choice: kuliko makao yote ya Yakobo
  alternative: zaidi ya makao yote ya Yakobo
  rationale: Miundo yote miwili inaweza kueleza ulinganisho, lakini ‘kuliko’ ni ya asili na huonyesha wazi upendeleo wa Yahwe kwa Sayuni bila kuongeza madai mengine ya kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kishairi; picha ya malango na jina Yakobo zimehifadhiwa.
