source:
  edition: WLC
  text: וְ/שָׁרִ֥ים כְּ/חֹלְלִ֑ים כָּֽל מַעְיָנַ֥/י בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/007.yaml
  text: Singers and dancers alike say[b][a], “All my springs are in you.”
translation:
  language: sw
  text: 'Nao waimbaji pamoja na wachezaji[a] husema: “Chemchemi zangu zote zimo ndani yako.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘wapiga filimbi.’ Kwa mapokeo, neno la Kiebrania limeeleweka kuwa linawahusu wanaocheza au kuzunguka katika dansi, ingawa pia limependekezwa kuwa linamaanisha wapiga ala ya muziki.
    reason: lexical_alternative
  - marker: b
    text: “Chemchemi zangu zote zimo ndani yako” ni sitiari ya kishairi ambayo huenda ikamaanisha “vyanzo vyangu vyote” au “vyanzo vyangu vyote vya uhai vimo ndani yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁרִים
  choice: Nao waimbaji
  rationale: Neno hili linaeleweka kwa kawaida kuwa umbo la kitenzi שׁיר (‘kuimba’), hivyo ‘waimbaji’ linafaa katika muktadha wa kimuziki; ‘nao’ linaendeleza kiunganishi וְ kwa Kiswahili cha kawaida.
- source_word: כְּחֹלְלִים
  choice: pamoja na wachezaji
  rationale: Huenda neno hili linatokana na maana ya kucheza au kuzunguka katika dansi. Ingawa כְּ kwa kawaida ni ‘kama,’ mstari huu wa kishairi ni mfupi na uliobanwa; ‘pamoja na’ linaonyesha kwa asili makundi yote mawili bila kudai kwamba waimbaji wanafananishwa tu na wachezaji.
- source_word: כָּל
  choice: zote
  rationale: Huwasilisha maana jumuishi ya ‘zote’ na kupatana kisarufi na ‘chemchemi zangu.’
- source_word: מַעְיָנַי
  choice: chemchemi zangu
  rationale: מַעְיָן ni chemchemi au kijito kinachobubujika kutoka ardhini. ‘Chemchemi’ linahifadhi picha halisi ya kishairi na pia uwezekano wa maana ya sitiari.
- source_word: בָּךְ
  choice: zimo ndani yako
  rationale: בְּ kwa msingi humaanisha ‘katika/ndani ya.’ Kiwakilishi ni cha kike umoja na kinamrejelea Sayuni; ‘zimo ndani yako’ ni Kiswahili cha asili kinachohifadhi picha ya mahali bila kuibadili moja kwa moja kuwa ‘zinatoka kwako.’
theological_decisions:
- issue: Maana ya kisitiari ya ‘chemchemi zangu’ katika kumwambia Sayuni
  choice: Kuhifadhi sitiari ya chemchemi bila kuifafanua kuwa baraka, uhai, au chanzo cha wokovu
  alternative: ‘Vyanzo vyangu vyote vimo ndani yako’ au ‘Baraka zangu zote zimo ndani yako’
  rationale: Kiebrania kinaacha picha hii wazi kwa maana kadhaa zinazohusiana na uhai, ustawi, au asili ya mtu. Tafsiri haipaswi kutatua mvutano huo wa kishairi na kitheolojia kwa kuingiza ufafanuzi maalumu.
- issue: Kitenzi cha kusema ambacho hakijaandikwa wazi katika Kiebrania
  choice: Kutumia ‘husema’ ili sentensi iliyobanwa ya kishairi ieleweke kwa Kiswahili
  alternative: '‘Nao waimbaji pamoja na wachezaji: “Chemchemi zangu zote zimo ndani yako”’'
  rationale: Kiebrania hakina kitenzi cha kusema hapa, lakini maneno yanayonukuliwa yanaeleweka kama kauli ya waimbaji na wachezaji. ‘Husema’ ni nyongeza ndogo ya kisarufi, si ufafanuzi wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Chemchemi’ ni neno linaloeleweka na linalohifadhi taswira ya Kiebrania. ‘Nao ... pamoja na ...’ hutoa mtiririko wa kawaida huku ikidumisha uhusiano wa makundi mawili katika mstari uliobanwa.
