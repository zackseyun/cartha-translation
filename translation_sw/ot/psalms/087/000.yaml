  text: לִ/בְנֵי קֹ֭רַח מִזְמ֣וֹר שִׁ֑יר יְ֝סוּדָת֗/וֹ בְּ/הַרְרֵי קֹֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/000.yaml
  text: A psalm of the sons of Korah[a]; a song[c][b]. Its foundation is in the holy mountains.
translation:
  language: sw
  text: Zaburi ya wana wa Kora[a]; wimbo. Msingi wake[b] umo katika milima mitakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya wana wa Kora.” Kiebrania kinaonyesha uhusiano, lakini si lazima kiseme kwamba wao ndio walioandika zaburi hii.
    reason: lexical_alternative
  - marker: b
    text: Kitu kinachorejelewa na “wake” hakijatajwa wazi katika Kiebrania; huenda ikawa Sayuni au Yerusalemu.
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנֵי קֹרַח
  choice: ya wana wa Kora
  rationale: Kiambishi ל־ kinaweza kuonyesha uhusiano, umiliki au walengwa. Katika kichwa cha zaburi, “ya wana wa Kora” ni Kiswahili cha kawaida kinachohifadhi uhusiano huo bila kudai moja kwa moja kwamba wao ndio waandishi.
- source_word: מִזְמוֹר שִׁיר
  choice: Zaburi; wimbo
  rationale: Maneno yote mawili ya aina ya utungo yamehifadhiwa. Nuktamkato inaunganisha vipashio vya kichwa bila kufanya “wimbo” kuwa sentensi iliyojitenga.
- source_word: יְסוּדָתוֹ
  choice: Msingi wake
  rationale: Tafsiri hii inahifadhi kiambishi cha nafsi ya tatu umoja cha Kiebrania na pia kutokutajwa wazi kwa kitu au mahali kinachorejelewa.
- source_word: בְּהַרְרֵי קֹדֶשׁ
  choice: umo katika milima mitakatifu
  rationale: “Katika” huwakilisha ב־, na “milima mitakatifu” huwasilisha wingi wa הַרְרֵי pamoja na wazo la utakatifu katika קֹדֶשׁ.
theological_decisions:
- issue: Kitu kinachorejelewa na kiambishi katika “msingi wake”
  choice: Kuacha kirejelewa kikiwa hakijatajwa wazi, kama katika Kiebrania
  alternative: Kutaja Sayuni au Yerusalemu moja kwa moja
  rationale: Muktadha unaweza kuashiria Sayuni/Yerusalemu, lakini mstari wenyewe haukitaji kwa jina. Kutokukitaja kunahifadhi utata halisi wa chanzo.
- issue: Uhusiano wa wana wa Kora na zaburi
  choice: “ya wana wa Kora”
  alternative: “kwa ajili ya wana wa Kora”
  rationale: Kiebrania kinaweza kumaanisha utunzi, umiliki, uhusiano au walengwa; chaguo la msingi halipaswi kulazimisha hitimisho kuhusu uandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Umo” imetumiwa kwa upatanisho na “msingi”; sintaksia fupi imehifadhi muundo wa kichwa cha zaburi na sentensi inayofuata.
