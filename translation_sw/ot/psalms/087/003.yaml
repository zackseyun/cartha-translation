  text: Glorious things are spoken of you[a], city of God. Selah
translation:
  language: sw
  text: Mambo matukufu yanasemwa kukuhusu[a], ee mji wa Mungu. Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yanasemwa juu yako” au “yanasemwa ndani yako.” Kihusishi cha Kiebrania hapa kinaweza kutafsiriwa kwa zaidi ya njia moja; “kukuhusu” linafaa zaidi na maana ya sifa zinazoelekezwa kwa Sayuni.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְבָּדוֹת
  choice: Mambo matukufu
  rationale: Nomino hii iliyotumika kivumishi inaonyesha mambo yenye heshima, fahari au uzito; “mambo matukufu” ni Kiswahili cha kawaida na cha kishairi kinachofaa katika muktadha wa sifa.
- source_word: מְדֻבָּר
  choice: yanasemwa
  rationale: Hii ni participio ya Pual kutoka דבר na ina maana ya usemi unaotolewa; “yanasemwa” hudumisha hali ya kutendwa na kupatana na wingi wa “mambo.”
- source_word: בָּךְ
  choice: kukuhusu
  rationale: Kihusishi ב pamoja na kitenzi cha kusema hapa kinaweza kumaanisha kuhusu anayesemwa, ingawa pia kinaweza kueleweka “ndani yako”; “kukuhusu” linafaa zaidi na muktadha wa sifa kwa Sayuni huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: עִיר הָאֱלֹהִים
  choice: ee mji wa Mungu
  rationale: Ni muundo wa utegemezi wenye maana “mji wa Mungu.” Kwa kuwa kiambishi cha nafsi ya pili tayari kinauelekezea mji maneno, “ee” huweka wazi mwito wa moja kwa moja kwa Kiswahili cha asili bila kubadili maana.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya neno hili haijulikani; huenda ni ishara ya kiliturujia au muziki. Limetoholewa badala ya kufasiriwa.
