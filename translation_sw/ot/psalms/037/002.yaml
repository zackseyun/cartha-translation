translation:
  language: sw
  text: Kwa maana watanyauka upesi kama majani[a], na watafifia kama mimea mibichi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watakatwa upesi kama majani … watanyauka kama uoto wa kijani.” Vitenzi vya Kiebrania hapa vina maana zinazokaribiana za kukauka, kufifia, kunyauka, au kukatwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya himizo lililotangulia; “kwa maana” ni cha kawaida na wazi katika Kiswahili sanifu.
- source_word: כֶחָצִיר
  choice: kama majani
  rationale: חָצִיר hapa ni majani au uoto wa kondeni; “majani” linafaa katika tashbihi ya kitu kinachodumu kwa muda mfupi.
- source_word: מְהֵרָה
  choice: upesi
  rationale: Neno hili linasisitiza kasi ya kutoweka kwao; “upesi” ni la asili na lenye hadhi katika muktadha huu.
- source_word: יִמָּלוּ
  choice: watanyauka
  rationale: Katika taswira ya mimea, kitenzi kinaweza kueleweka kuwa kukauka au kunyauka; “watanyauka” hudumisha taswira bila kulazimisha maana ya kukatwa.
- source_word: וּכְיֶרֶק דֶּשֶׁא
  choice: kama mimea mibichi
  rationale: Kirai hiki huonyesha uoto wa kijani ulio mchanga au wenye rutuba; “mimea mibichi” ni Kiswahili cha kawaida na huepuka kurudia “majani.”
- source_word: יִבּוֹלוּן
  choice: kusinyaa
  rationale: Kitenzi huonyesha kufifia, kunyauka, au kudhoofika kwa mimea; “kusinyaa” huunda ulinganifu wa kishairi na “kunyauka” huku kikihifadhi kupotea kwa uhai.
