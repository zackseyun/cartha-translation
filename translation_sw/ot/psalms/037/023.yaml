base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/023.yaml
  text: From Yahweh a man's steps are established[b][a], and he delights in his way.
translation:
  language: sw
  text: Hatua za mwanamume huwekwa imara na BWANA[b], naye BWANA huifurahia njia yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye huifurahia njia yake” inaweza kueleweka kuwa mwanamume ndiye anayeifurahia njia hiyo, badala ya BWANA.
    reason: alternative_reading
  - marker: b
    text: Kihalisi zaidi, “Kutoka kwa BWANA hatua za mwanamume huwekwa imara.”
    reason: source_form
lexical_decisions:
- source_word: מֵיְהוָה
  choice: na BWANA
  rationale: Kihusishi מִן kinaonyesha chanzo au mtendaji. Katika muundo wa Kiswahili wa kutendwa, “na BWANA” huwasilisha kwa kawaida kwamba BWANA ndiye anayeziweka hatua imara, bila kupoteza wazo la kwamba uthabiti huo unatoka kwake.
- source_word: מִצְעֲדֵי
  choice: hatua
  rationale: Neno hili linamaanisha hatua za kutembea na pia linaweza kuwakilisha mwenendo wa maisha; “hatua” ni la kawaida na linahifadhi taswira hiyo.
- source_word: גֶבֶר
  choice: za mwanamume
  rationale: גֶבֶר ni nomino ya kiume inayomaanisha mwanamume. “Mwanamume” huhifadhi jinsia ya neno la Kiebrania, ingawa katika muktadha huu kauli inaweza kutumiwa kwa ujumla.
- source_word: כּוֹנָנוּ
  choice: huwekwa imara
  rationale: Umbo la kutendwa la כון lina maana ya kuthibitishwa, kuimarishwa, au kuwekwa salama. “Huwekwa imara” huhifadhi hali ya kutendwa na huepuka kulifasiri kama kuongozwa tu.
- source_word: וְדַרְכּוֹ
  choice: njia yake
  rationale: “Njia” ni tafsiri ya kawaida na ya asili ya דֶּרֶךְ, ikiruhusu maana halisi pamoja na maana ya mwenendo wa maisha.
- source_word: יֶחְפָּץ
  choice: huifurahia
  rationale: חפץ humaanisha kufurahia, kupendezwa na, au kutamani. “Huifurahia” ni ya kawaida na hueleza vizuri furaha au ridhaa kwa njia inayotajwa.
theological_decisions:
- issue: Kiima cha יֶחְפָּץ (“huifurahia”)
  choice: 'Kiima kikuu kinaeleweka kuwa BWANA: “naye huifurahia njia yake.”'
  alternative: Kiima kinaweza kueleweka kuwa mwanamume, yaani yeye huifurahia njia yake mwenyewe au njia ambayo BWANA amemwekea.
  rationale: Kiebrania hakitaji kiima waziwazi. BWANA anaweza kueleweka kwa urahisi kuwa ndiye anayeziweka hatua imara na anayeifurahia njia ya mwanamume, lakini rejeo kwa mwanamume pia linawezekana. Tafsiri kuu inafuata usomaji wa kwanza, huku tanbihi ikihifadhi utata halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kutendwa umehifadhiwa, lakini “na BWANA” umetumiwa kwa ufasaha wa Kiswahili kuonyesha chanzo na utendaji wa Mungu. “Naye” linaendeleza usomaji mkuu kwamba BWANA ndiye kiima, bila kufuta kabisa utata wa Kiebrania.
