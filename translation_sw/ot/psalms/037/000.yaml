base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/000.yaml
  text: Of David[a]. Do not fret because of evildoers[b]; do not be envious of those who do wrong.
translation:
  language: sw
  text: Ya Daudi. Usifadhaike kwa sababu ya watenda maovu[a]; usiwaonee wivu watenda udhalimu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usikasirike kwa sababu ya watenda maovu.” Kitenzi cha Kiebrania kinaweza kumaanisha kuwaka kwa hasira, kufadhaika, au kujitaabisha.
    reason: lexical_alternative
  - marker: b
    text: Au, “watenda yasiyo ya haki” / “watenda uovu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Kichwa hiki kinaonyesha uhusiano wa zaburi na Daudi bila kulazimisha iwapo ni utunzi wake, ni kwa ajili yake, au inamhusu.
- source_word: אַל־תִּתְחַר
  choice: Usikasirike
  rationale: Kitenzi kina wazo la kuwaka kwa hasira au kufadhaika; 'usikasirike' ni wazi na cha kawaida katika Kiswahili, huku tanbihi ikihifadhi upana wa maana.
- source_word: בַּמְּרֵעִים
  choice: kwa sababu ya watenda maovu
  rationale: Kirai hiki kinabainisha watu wanaotenda maovu kuwa chanzo cha hisia inayokatazwa.
- source_word: אַל־תְּקַנֵּא
  choice: usiwaonee wivu
  rationale: Huwasilisha moja kwa moja katazo la kuwa na wivu kuelekea watu wanaotajwa.
- source_word: בְּעֹשֵׂי עַוְלָה
  choice: watenda udhalimu
  rationale: עַוְלָה linaweza kumaanisha udhalimu, uovu, au kutokuwa na haki; 'udhalimu' huhifadhi uzito wa ukiukaji wa haki.
theological_decisions:
- issue: Maana ya kichwa לְדָוִד
  choice: Ya Daudi
  alternative: Zaburi ya Daudi / Kwa ajili ya Daudi
  rationale: Neno la Kiebrania linaweza kueleza uandishi au uhusiano mwingine; tafsiri fupi 'Ya Daudi' inadumisha utata huo.
- issue: Uhusiano kati ya maovu na mwitikio wa msomaji
  choice: Usikasirike kwa sababu ya watenda maovu
  alternative: Usiwakasirikie watenda maovu
  rationale: Muundo wa chanzo unaweza kueleweka kama kutofadhaishwa au kutowaka kwa sababu yao, si lazima kama hasira inayoelekezwa kwao pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Ulinganifu wa kishairi wa makatazo mawili umehifadhiwa.
