translation:
  language: sw
  text: Ya Daudi. Usikasirike kwa sababu ya watenda maovu; usiwaonee wivu watendao udhalimu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watendao maovu” au “watendao yasiyo ya haki.” Neno la Kiebrania linaweza kumaanisha uovu, ukosefu wa haki, au udhalimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Kichwa hiki kinaweza kuonyesha utunzi, uhusiano, au kuwekwa wakfu kwa Daudi. “Ya Daudi” ni fupi, ya kawaida katika Kiswahili cha Biblia, na haibani maana kuwa “iliandikwa na” au “kwa ajili ya” Daudi.
- source_word: אַל
  choice: Usi-
  rationale: אַל pamoja na kitenzi cha hali isiyotimilika hutoa katazo; kiambishi cha Kiswahili “usi-” ni njia ya kawaida na ya moja kwa moja ya kulieleza.
- source_word: תִּתְחַר
  choice: kasirike
  rationale: Kitenzi חרה katika hitpaeli kina wazo la kuwaka moyoni, kuchafuka, au kukasirishwa. “Kasirike” ni lugha ya sasa na yenye hadhi, ingawa maana pana inaweza pia kuwa kufadhaika au kuwaka hasira.
- source_word: בַּמְּרֵעִים
  choice: kwa sababu ya watenda maovu
  rationale: ב hapa huonyesha chanzo au sababu ya kuchafuka. “Kwa sababu ya” huepuka dhana kwamba lazima watenda maovu ndio wanaomkasirisha mtu moja kwa moja, na “watenda maovu” huhifadhi umbo tendaji la Kiebrania.
- source_word: תְּקַנֵּא
  choice: usiwaonee wivu
  rationale: קנא inaweza kumaanisha kuwa na wivu au husuda. Katika muktadha wa zaburi hii, katazo linahusu kutamani hali ya waovu; “kuwaonea wivu” ni usemi wa kawaida wa Kiswahili.
- source_word: בְּעֹשֵׂי עַוְלָה
  choice: watendao udhalimu
  rationale: עֹשֵׂי ni “watendao,” na עַוְלָה huonyesha kosa, uovu, au ukosefu wa haki. “Udhalimu” huhifadhi uzito wa kimaadili na kipengele cha kutenda isivyo haki.
