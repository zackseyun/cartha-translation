  yaml_path: translation/ot/psalms/037/006.yaml
  text: He will bring forth your righteousness like the light[b][a], and your justice like the noonday.
translation:
  language: sw
  text: Ataudhihirisha uadilifu wako kama nuru[a], na haki ya shauri lako[b] kama adhuhuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakuthibitisha kuwa una haki, kama nuru.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hukumu yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: Ataudhihirisha
  rationale: Hifili ya יצא ina maana ya kusababisha kitu kitoke au kiwekwe wazi. Katika taswira hii, “ataudhihirisha” ni Kiswahili cha kawaida kinachoonyesha kwamba hali ya mtu kuwa na haki itaonekana wazi.
- source_word: כָאוֹר
  choice: kama nuru
  rationale: Kiambishi כ kinaonyesha ulinganisho, na אוֹר ni “nuru.” Tafsiri hii inadumisha tashbihi ya jambo linaloonekana wazi.
- source_word: צִדְקֶךָ
  choice: uadilifu wako
  rationale: צדק inaweza kumaanisha uadilifu, haki, au kuthibitishwa kuwa na haki. “Uadilifu wako” inadumisha maana ya msingi bila kuondoa kidokezo cha kuthibitishwa hadharani katika muktadha.
- source_word: וּמִשְׁפָּטֶךָ
  choice: na haki ya shauri lako
  rationale: משפט inaweza kumaanisha hukumu, haki, au shauri la kisheria. Katika usambamba huu inahusu kuonekana wazi kwamba shauri la mtu ni la haki; usemi huu ni wa asili kwa Kiswahili na unadumisha maana hiyo ya kimahakama.
- source_word: כַצָּהֳרָיִם
  choice: kama adhuhuri
  rationale: צָהֳרַיִם humaanisha adhuhuri, wakati wa mwanga mkali wa mchana. “Kama adhuhuri” inadumisha ulinganisho mfupi na wa kishairi.
theological_decisions:
- issue: Je, צִדְקֶךָ ieleweke kama tabia ya uadilifu au kuthibitishwa kuwa na haki?
  choice: uadilifu wako
  alternative: kuthibitishwa kwako kuwa una haki
  rationale: Neno la Kiebrania linaweza kubeba maana zote mbili. Maandishi makuu yanadumisha neno pana la kimaadili, huku tanbihi ikionyesha maana ya kimuktadha ya kuthibitishwa kuwa na haki.
- issue: Je, מִשְׁפָּטֶךָ ni hukumu, haki, au shauri?
  choice: haki ya shauri lako
  alternative: hukumu yako
  rationale: Muktadha unaelekea kwenye shauri la mtu kuonyeshwa kuwa la haki, lakini tanbihi inahifadhi uwezekano wa maana iliyo karibu zaidi na “hukumu.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Adhuhuri” ni neno linaloeleweka kwa wakati wa katikati ya mchana na linahifadhi taswira ya mwanga ulio wazi kabisa.
