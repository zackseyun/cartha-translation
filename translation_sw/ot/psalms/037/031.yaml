translation:
  language: sw
  text: Sheria ya Mungu wake imo moyoni mwake[a]; hatua zake hazitelezi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mafundisho ya Mungu wake yamo moyoni mwake; hatua zake hazitelezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: Sheria ya
  rationale: תּוֹרָה humaanisha mafundisho yenye mamlaka au sheria. Katika zaburi hii ya hekima, “Sheria” inadumisha uzito wa mapenzi ya Mungu yenye mamlaka, huku tanbihi ikihifadhi maana mbadala ya “mafundisho.”
- source_word: אֱלֹהָיו
  choice: Mungu wake
  rationale: 'Nomino yenye kiambishi cha nafsi ya tatu umoja wa kiume inaonyesha umilikaji na uhusiano wa kibinafsi: “Mungu wake.”'
- source_word: בְּלִבּוֹ
  choice: imo moyoni mwake
  rationale: בְּ pamoja na “moyo” huonyesha kwamba Sheria imewekwa ndani ya mtu. “Moyoni mwake” ni Kiswahili cha kawaida kinachobeba wazo la fikira, nia, na utashi wa ndani.
- source_word: לֹא תִמְעַד
  choice: hazitelezi
  rationale: Kitenzi מעד kinaweza kumaanisha kuteleza, kujikwaa, au kuyumba. Kwa kuwa kiima ni “hatua,” “hazitelezi” ni sitiari ya asili inayosisitiza uthabiti wa mwenendo.
- source_word: אֲשֻׁרָיו
  choice: hatua zake
  rationale: Nomino ya wingi inarejelea hatua au nyayo; “hatua zake” ni fupi, ya kawaida, na inadumisha sitiari ya mwendo wa maisha.
theological_decisions:
- issue: Maana ya תּוֹרָה katika muktadha wa hekima
  choice: Sheria
  alternative: mafundisho
  rationale: “Sheria” inadumisha wazo la mapenzi ya Mungu yaliyofunuliwa na yenye mamlaka, lakini “mafundisho” pia ni maana halali ya neno hilo katika muktadha huu na imeonyeshwa katika tanbihi.
- issue: Wakati na hali ya לֹא תִמְעַד
  choice: hazitelezi
  alternative: hazitajikwaa
  rationale: Kauli ya wakati wa sasa inafaa tabia ya methali ya zaburi, yaani ukweli wa jumla kuhusu mwenye haki. Mbadala wa wakati ujao pia unawezekana, lakini si lazima kuufanya kuwa ahadi kamili ya kutokupata shida yoyote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Imo moyoni mwake” ni usemi wa kawaida na unaoeleweka; umoja wa “Sheria” unaafikiana na “imo,” huku katika mbadala wa tanbihi wingi wa “mafundisho” unaafikiana na “yamo.”
