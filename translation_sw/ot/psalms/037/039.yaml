lexical_decisions:
- source_word: וּתְשׁוּעַת
  choice: Wokovu
  rationale: Neno תְּשׁוּעָה linaweza kumaanisha wokovu, ukombozi, au ushindi. “Wokovu” linafaa katika mtindo mpana wa Zaburi huku likijumuisha wazo la kuokolewa katika taabu.
- source_word: צַדִּיקִים
  choice: wenye haki
  rationale: Kivumishi hiki cha wingi kimetumiwa kama nomino; “wenye haki” ni Kiswahili cha kawaida kinachoonyesha kundi la watu wenye sifa ya haki.
- source_word: מֵיְהוָה
  choice: hutoka kwa Yahwe
  rationale: Kihusishi מִן kinaonyesha chanzo. “Hutoka kwa Yahwe” ni kauli ya asili ya Kiswahili na inaweka wazi kwamba Yahwe ndiye chanzo cha wokovu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano YHWH limetoholewa moja kwa moja kuwa “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: מָעוּזָּם
  choice: ngome yao
  rationale: מָעוֹז humaanisha mahali au chanzo cha nguvu na ulinzi. “Ngome yao” linahifadhi taswira ya ulinzi imara na kiambishi cha nafsi ya tatu wingi.
- source_word: בְּעֵת צָרָה
  choice: wakati wa taabu
  rationale: Kirai hiki kinaonyesha kipindi cha shida au dhiki; “wakati wa taabu” ni wazi, cha kawaida, na chenye hadhi katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina YHWH moja kwa moja; “Yahwe” linahifadhi rejeleo la jina la agano bila kulibadilisha kuwa cheo.
- issue: Kitenzi kinachodokezwa katika kishazi kisicho na kitenzi
  choice: yeye ni ngome yao
  alternative: ngome yao wakati wa taabu; Yahwe ni ngome yao
  rationale: Kiebrania kina kishazi cha nomino bila kitenzi kilichoandikwa. Kuongeza “yeye ni” kunatoa Kiswahili cha kawaida huku kukidumisha kiwakilishi cha kurejelea Yahwe bila kuongeza wazo jipya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi kama mstari wa kishairi wa Kiebrania; “ngome” inadumisha taswira ya ulinzi, na “taabu” ni neno linaloeleweka kwa urahisi.
