  text: Wokovu[a] wa wenye haki unatoka kwa Yahwe[b]; yeye ni ngome[c] yao wakati wa taabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Wokovu” pia unaweza kutafsiriwa “ukombozi” au “ushindi.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: YHWH; kwa mapokeo pia hutafsiriwa “BWANA.”'
