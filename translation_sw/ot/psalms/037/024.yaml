  text: כִּֽי יִפֹּ֥ל לֹֽא יוּטָ֑ל כִּֽי יְ֝הוָ֗ה סוֹמֵ֥ךְ יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/024.yaml
  text: Though he falls[a], he will not be hurled down[b], for Yahweh holds his hand.
translation:
  language: sw
  text: Ingawa ataanguka[a], hatatupwa chini, kwa maana Yahwe huushika mkono wake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kwa maana akianguka, hatatupwa chini”; au, “Akianguka, hatatupwa chini.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa “kwa maana,” “ikiwa/aki-,” au katika muktadha huu “ingawa.”'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “huutegemeza mkono wake.”'
    reason: previous_rendering
lexical_decisions:
- source_word: כִּי
  choice: Ingawa
  rationale: 'Katika muktadha huu kiunganishi kinaweza kuwa na maana ya kukubali hali inayopingana na matokeo: mtu anaanguka, lakini hatatupwa chini. Tanbihi inahifadhi maana nyingine zinazowezekana.'
- source_word: יִפֹּל
  choice: ataanguka
  rationale: Kitenzi נפל kimsingi humaanisha ‘kuanguka.’ Tafsiri haifafanui kama ni kuanguka kimwili, taabu, au kushindwa kwa namna nyingine.
- source_word: לֹא יוּטָל
  choice: hatatupwa chini
  rationale: Umbo la kutendwa la טול linaonyesha kutupwa au kuangushwa chini; uchaguzi huu pia unatofautisha kitenzi hiki na נפל, ‘kuanguka.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: סוֹמֵךְ
  choice: huushika
  rationale: Kivumishi-tendaji cha סמך kinaonyesha utegemezo unaoendelea. ‘Huushika’ ni Kiswahili cha kawaida katika taswira ya Mungu kuushika mkono wa mtu ili kumtegemeza.
- source_word: יָדוֹ
  choice: mkono wake
  rationale: Kiebrania kinataja moja kwa moja ‘mkono wake,’ hivyo taswira hiyo imehifadhiwa.
theological_decisions:
- issue: Maana ya kitamathali ya kuanguka
  choice: Kuanguka kumeachwa kuwa taswira pana ya matatizo au kushindwa kwa mtu mwadilifu.
  alternative: Kulieleza hasa kuwa dhambi, kuasi kiroho, au hatari ya kimwili pekee.
  rationale: Kiebrania hakibainishi aina ya kuanguka; tafsiri haifungi maana katika ufafanuzi mmoja wa kiteolojia.
- issue: Mhusika wa ‘mkono wake’
  choice: 'Kiwakilishi kinaelekezwa kwa mtu anayeanguka: Yahwe huushika mkono wa mtu huyo.'
  alternative: Kuelewa kuwa Yahwe humtegemeza mtu kwa mkono wake mwenyewe.
  rationale: Muundo wa Kiebrania unaweka ‘mkono wake’ kama yambwa ya kitenzi, ingawa taswira pana ya utegemezo wa Mungu inabaki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. ‘Hutatupwa chini’ huhifadhi nguvu ya kauli ya kutendwa, na ‘huushika mkono wake’ ni usemi wa asili unaodumisha taswira ya Kiebrania.
