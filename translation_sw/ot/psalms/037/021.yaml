  text: לֹוֶ֣ה רָ֭שָׁע וְ/לֹ֣א יְשַׁלֵּ֑ם וְ֝/צַדִּ֗יק חוֹנֵ֥ן וְ/נוֹתֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/021.yaml
  text: The wicked borrows and does not repay[b][a], but the righteous is gracious and gives.
translation:
  language: sw
  text: Mwovu hukopa na halipi, lakini mwenye haki huonyesha fadhili na hutoa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹוֶה
  choice: hukopa
  rationale: Kitenzi kishirikishi cha Kiebrania kinaeleza tendo la kawaida la kukopa; ‘hukopa’ linaonyesha vizuri maana hii ya kimethali.
- source_word: רָשָׁע
  choice: mwovu
  rationale: Kivumishi hiki kimetumika kama nomino kumaanisha mtu mwovu wa aina inayowakilishwa katika msemo huu.
- source_word: לֹא יְשַׁלֵּם
  choice: wala halipi
  rationale: Katika muktadha wa kukopa, kitenzi hiki humaanisha kutolipa deni. ‘Wala’ linaendeleza kwa kawaida muundo wa Kiebrania wa ‘na si’.
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Ni kivumishi kilichotumika kama nomino, kikimtofautisha mtu mwenye haki na mwovu; usemi huu ni wa kawaida na wenye heshima katika Kiswahili.
- source_word: חוֹנֵן
  choice: huwa na neema
  rationale: Kitenzi חנן humaanisha kuonyesha neema au fadhili. Chaguo hili linahifadhi wazo hilo bila kulifupisha tu kuwa ukarimu.
- source_word: וְנוֹתֵן
  choice: na hutoa
  rationale: נתן humaanisha kwa msingi ‘kutoa.’ ‘Hutoa’ linahifadhi upana wa maana bila kulibana kuwa kukopesha.
theological_decisions:
- issue: Umoja wa kiwakilishi katika utofautishaji wa hekima
  choice: Kudumisha umoja kwa ‘mwovu’ na ‘mwenye haki.’
  alternative: ‘Waovu ... wenye haki’ au ‘mtu mwovu ... mtu mwenye haki.’
  rationale: Kiebrania kinatumia umoja unaowakilisha aina ya mtu katika kauli ya kimethali. Kiswahili kinaweza kuuhifadhi kwa njia ya kawaida bila kudai kwamba rejeo linamhusu mwanamume pekee.
- issue: Uhusiano kati ya kuwa na neema na kutoa
  choice: 'Kutafsiri vitendo vyote viwili: ‘huwa na neema na hutoa.’'
  alternative: ‘Ni mkarimu na hutoa’ au ‘huwakopesha kwa fadhili.’
  rationale: Hii inadumisha tofauti na uhusiano wa חוֹנֵן na נוֹתֵן, bila kuamua kwamba utoaji ni mkopo au kwamba maana ya neema ni ukarimu pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi wa kishairi na wa kimethali. ‘Hukopa,’ ‘halipi,’ na ‘hutoa’ vinaonyesha matendo ya tabia au yaliyo ya kawaida. Hakuna tanbihi iliyohitajika kwa kuwa tafsiri kuu inaweza kuhifadhi maana pana ya Kiebrania bila ufafanuzi wa lazima.
