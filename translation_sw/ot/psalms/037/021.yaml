revisions:
- from: Mwovu hukopa wala halipi, lakini mwenye haki huwa na neema na hutoa.
  to: Mwovu hukopa na halipi, lakini mwenye haki huonyesha fadhili na hutoa.
  rationale: The revision keeps the Hebrew’s gnomic singulars and both coordinated actions on each side of the contrast. It renders חוֹנֵן as an active display of favor and leaves נוֹתֵן broad as ‘hutoa,’ without interpreting it specifically as lending.
