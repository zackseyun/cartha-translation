lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa na cheo kama “BWANA”.
- source_word: יַעַזְבֶנּוּ
  choice: hatamwacha
  rationale: Kitenzi עזב kinaweza kumaanisha kuacha, kutupa, au kutelekeza. “Hatamwacha” ni Kiswahili cha kawaida na kinadumisha maana pana ya neno la Kiebrania.
- source_word: בְיָדוֹ
  choice: mkononi mwake
  rationale: Hii inadumisha taswira halisi ya Kiebrania. Katika muktadha, mkono ni wa mtu mwovu na unaashiria mamlaka au udhibiti wake.
- source_word: יַרְשִׁיעֶנּוּ
  choice: hatamtangaza kuwa na hatia
  rationale: Hifili ya רשע ina maana ya kimahakama ya kumtangaza mtu kuwa na hatia. Usemi huu unaweka wazi maana hiyo bila kuingiza wazo la ziada.
- source_word: בְּהִשָּׁפְטוֹ
  choice: anapohukumiwa
  rationale: Muundo wa ב pamoja na kitenzi-jina hapa unaeleweka kwa maana ya wakati. Tafsiri hii inadumisha mazingira ya kimahakama bila kubainisha mahakama au utaratibu ambao haukutajwa.
theological_decisions:
- issue: Warejelewa wa viwakilishi
  choice: Viwakilishi vinavyomtaja anayelengwa vinamrejelea mtu mwenye haki katika muktadha, na “mwake” katika “mkononi mwake” anamrejelea mtu mwovu.
  alternative: Kulisema jambo hilo kwa jumla bila kuonyesha jinsia au warejelewa wa viwakilishi.
  rationale: Muktadha wa Zaburi 37 unatofautisha mtu mwovu na mwenye haki. Umoja wa kiume wa Kiebrania unaendeleza utofautishaji huo, lakini Kiswahili hakihitaji kutaja jinsia kwa viwakilishi hivi.
- issue: Maana ya kimahakama ya kishazi cha pili
  choice: Kutafsiri רשע kwa “kumtangaza kuwa na hatia” na שפט kwa “kuhukumiwa.”
  alternative: “Hatamwona kuwa mwovu” au “hatamhesabu kuwa mwovu.”
  rationale: Mchanganyiko wa maneno haya una mwelekeo wa kimahakama. Tafsiri inadumisha mwelekeo huo bila kuamua zaidi ya maandishi kuhusu namna au hatua ya hukumu hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Taswira ya “mkononi” imehifadhiwa, huku tanbihi ikifafanua nahau na mrejelewa wake.
