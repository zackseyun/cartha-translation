  footnotes:
  - marker: a
    text: Au, “Afadhali kidogo kwa mwenye haki kuliko mengi ya waovu wengi.” Kiebrania kimefupisha sentensi; maana ya umilikaji katika “alicho nacho” inadokezwa.
