lexical_decisions:
- source_word: טוֹב
  choice: Afadhali
  rationale: Katika muundo huu wa kulinganisha, neno hili lina maana ya ‘ni bora’ au ‘afadhali’; ‘Afadhali’ hudumisha mtindo mfupi wa kimethali.
- source_word: מְעַט
  choice: kidogo
  rationale: Hutaja kiasi kidogo na kukitofautisha na wingi unaotajwa katika sehemu ya pili.
- source_word: לַצַּדִּיק
  choice: alicho nacho mwenye haki
  rationale: Kiambishi ל katika sentensi hii iliyofupishwa kinaweza kuonyesha umilikaji. Kiswahili hiki kinaweka wazi maana hiyo bila kubadili ‘mwenye haki’ kuwa wingi.
- source_word: מֵהֲמוֹן
  choice: kuliko wingi wa mali
  rationale: הָמוֹן linaweza kumaanisha wingi, mali nyingi, au mkusanyiko mkubwa. Katika ulinganisho na ‘kidogo alicho nacho,’ ‘wingi wa mali’ ni Kiswahili cha kawaida, huku tanbihi ikihifadhi upana wa neno la Kiebrania.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Kivumishi hiki kimetumiwa kama nomino ya wingi, yaani watu waovu.
- source_word: רַבִּים
  choice: wengi
  rationale: Kwa kawaida zaidi kivumishi hiki kinawahusu ‘waovu,’ hivyo maana ni waovu wengi, si tu mali nyingi.
