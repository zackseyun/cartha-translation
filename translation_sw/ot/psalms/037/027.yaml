  text: Turn away from evil and do good[a], and dwell forever.
translation:
  language: sw
  text: Jiepushe na uovu, tenda mema, ukae milele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kuzingatia mada inayorudiwa katika zaburi hii, “ukae katika nchi milele” au “uishi salama milele.” Kiebrania hapa hakisemi wazi “katika nchi.”
    reason: alternative_reading
lexical_decisions:
- source_word: סוּר
  choice: Jiepushe
  rationale: Amri hii humtaka mtu ageuke au ajiondoe kwa hiari kutoka katika jambo fulani; “jiepushe” ni Kiswahili cha kawaida kinachobeba nguvu ya kimaadili ya neno hilo.
- source_word: מֵרָע
  choice: na uovu
  rationale: Kihusishi מִן pamoja na רַע kinaonyesha jambo ambalo mtu anapaswa kujitenga nalo. Katika muktadha huu wa kimaadili, “uovu” linafaa kuliko “madhara.”
- source_word: וַעֲשֵׂה טוֹב
  choice: utende mema
  rationale: Muundo huu una amri ya kufanya lililo jema. “Tenda mema” ni usemi wa asili na wenye hadhi, nao unadumisha ulinganifu na kujiepusha na uovu.
- source_word: וּשְׁכֹן
  choice: nawe ukae
  rationale: Kitenzi hiki humaanisha kukaa, kuishi, au kufanya makao. “Ukae” kinahifadhi wazo la kudumu mahali bila kulazimisha kitu kisichotajwa wazi.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Neno hili huonyesha muda unaoendelea au usio na mwisho unaoonekana; “milele” ndiyo tafsiri ya kawaida na ya moja kwa moja hapa.
theological_decisions:
- issue: Maana ya ahadi au himizo katika וּשְׁכֹן לְעוֹלָם
  choice: nawe ukae milele
  alternative: nawe ukae katika nchi milele; au uishi salama milele
  rationale: Kiebrania kinaendeleza mfululizo wa amri na hakitaji wazi mahali pa kukaa. Ingawa Zaburi 37 hurudia mada ya kukaa katika nchi, kuongeza “katika nchi” katika matini kuu kungefanya jambo linalodokezwa na muktadha lionekane kana kwamba limetamkwa katika mstari huu. Tafsiri kuu kwa hiyo inahifadhi ufupi na utata wa chanzo, huku maelezo ya chini yakitaja uwezekano wa kimuktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri umehifadhiwa, na “ukae milele” umeachwa kwa ufupi ili kutoongeza mahali au hali ambayo haikutajwa wazi katika Kiebrania.
