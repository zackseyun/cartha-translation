  yaml_path: translation/ot/psalms/037/018.yaml
  text: Yahweh knows the days of the blameless[b][a], and their inheritance will be forever.
translation:
  language: sw
  text: Yahwe anajua siku za watu wakamilifu[a], na urithi wao utakuwa wa milele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wanyofu” au “watu wenye moyo mkamilifu.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “urithi wao utakuwa milele.” Kauli hii inaweza kumaanisha kwamba wataendelea kuumiliki au kwamba urithi huo utadumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Imetafsiriwa kwa unukuzi wa jina la Mungu unaotumika kwa kawaida katika Kiswahili, badala ya kulibadili kuwa cheo kama “BWANA”.
- source_word: יוֹדֵעַ
  choice: anajua
  rationale: Kitenzi hiki kinaonyesha kujua kunakoendelea na kwa makini. “Anajua” ni tafsiri ya moja kwa moja bila kuongeza maana kama “anawalinda” au “anawakubali.”
- source_word: יְמֵי
  choice: siku za
  rationale: Huhifadhi tamathali ya Kiebrania ya “siku za,” ambayo katika muktadha inaweza kumaanisha kipindi chote cha maisha yao.
- source_word: תְמִימִם
  choice: watu wasio na lawama
  rationale: Kauli hii inaeleza watu wenye uadilifu au ukamilifu wa mwenendo, bila kudai kwamba hawana dhambi kabisa.
- source_word: נַחֲלָתָם
  choice: urithi wao
  rationale: “Urithi” huhifadhi maana ya kitu kilichorithiwa au fungu walilopewa pamoja na mwangwi wake wa agano.
- source_word: לְעוֹלָם
  choice: wa milele
  rationale: Hii ni njia ya kawaida na yenye hadhi katika Kiswahili ya kueleza kudumu bila mwisho.
- source_word: תִּהְיֶה
  choice: utakuwa
  rationale: Huhifadhi kitenzi rahisi cha wakati ujao bila kukifafanua zaidi kuwa “utabaki” au “utadumu.”
theological_decisions:
- issue: Maana ya “watu wasio na lawama” katika muktadha wa hekima
  choice: Watu wenye uadilifu wa mwenendo, si watu wanaodaiwa kutokuwa na dhambi kabisa.
  alternative: Watu wakamilifu kimaadili kabisa; au watu wanyofu.
  rationale: Zaburi inatofautisha wenye haki na waovu kwa lugha ya hekima. Tafsiri hii huhifadhi maana ya uadilifu bila kuingiza dai la ukamilifu usio na dhambi.
- issue: Nguvu ya kauli kwamba Mungu “anajua”
  choice: Kujua kwa makini na kwa uhusiano, huku neno lenyewe likitafsiriwa moja kwa moja kuwa “anajua.”
  alternative: Anawakubali; anawaangalia; anawalinda.
  rationale: Muktadha unaweza kudokeza zaidi ya ufahamu wa taarifa tu, lakini tafsiri ya moja kwa moja huepuka kuingiza ufafanuzi wa kitheolojia usiosemwa wazi.
- issue: Kudumu kwa urithi
  choice: Urithi wao utakuwa wa milele.
  alternative: Wataumiliki urithi wao milele; urithi wao utadumu milele.
  rationale: Muundo huu huhifadhi uwezekano kwamba mstari unasisitiza ama kudumu kwa urithi wenyewe ama kuendelea kwa umiliki wao, bila kuchagua moja kimyakimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “siku za” umehifadhi picha ya Kiebrania, na “utakuwa wa milele” umetumiwa ili sentensi iwe ya kawaida katika Kiswahili huku tanbihi ikihifadhi muundo wa karibu zaidi na asili.
