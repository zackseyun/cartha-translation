base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/029.yaml
  text: The righteous will inherit the land and dwell on it forever[a].
translation:
  language: sw
  text: Waadilifu watairithi nchi, nao watakaa humo milele[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dunia.” Neno la Kiebrania אֶרֶץ linaweza kumaanisha “nchi” au “dunia”; hapa “nchi” inafaa kwa sababu ya maneno yanayorudiwa katika Zaburi 37.
    reason: alternative_reading
lexical_decisions:
- source_word: צַדִּיקִים
  choice: Waadilifu
  rationale: Ni kivumishi cha wingi kilichotumiwa kama nomino, kikimaanisha watu wenye uadilifu. “Waadilifu” ni Kiswahili cha kawaida na chenye hadhi kinachohifadhi maana ya kimaadili na kitheolojia.
- source_word: יִירְשׁוּ
  choice: watairithi
  rationale: Kitenzi ירשׁ kinaweza kumaanisha kurithi au kumiliki. “Watairithi” kinahifadhi wazo la ahadi na urithi linalorudiwa katika Zaburi 37.
- source_word: אָרֶץ
  choice: nchi
  rationale: אֶרֶץ inaweza kumaanisha nchi au dunia. Katika muktadha wa Zaburi 37, “nchi” inafaa zaidi na lugha inayorudiwa ya kuirithi nchi, huku uwezekano wa “dunia” ukihifadhiwa katika tanbihi.
- source_word: וְיִשְׁכְּנוּ
  choice: na kukaa
  rationale: שׁכן humaanisha kukaa, kuishi, au kufanya makao. “Kukaa” ni ya asili katika Kiswahili na huonyesha makao ya kudumu katika muktadha huu.
- source_word: לָעַד
  choice: milele
  rationale: Neno hili huonyesha muda usio na mwisho au wa kudumu; “milele” linawasilisha nguvu hiyo kwa uwazi.
- source_word: עָלֶיהָ
  choice: humo
  rationale: Kiwakilishi kinarejelea nchi. “Humo” ni usemi wa asili wa Kiswahili kwa kukaa ndani ya nchi hiyo, ingawa Kiebrania hutumia kihusishi chenye maana ya moja kwa moja ya ‘juu yake.’
theological_decisions:
- issue: Upeo wa maana ya אָרֶץ katika ahadi
  choice: nchi
  alternative: dunia
  rationale: Muktadha wa karibu wa Zaburi 37 unarudia ahadi ya kuirithi nchi, hivyo “nchi” limewekwa katika matini kuu. Kwa kuwa neno la Kiebrania linaweza pia kumaanisha dunia, maana hiyo pana imehifadhiwa katika tanbihi bila kuamua mvutano wa kitheolojia kwa lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa moja kwa moja na wa kishairi bila kuwa wa kizamani.
