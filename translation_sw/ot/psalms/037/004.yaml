base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/004.yaml
  text: Delight yourself in Yahweh[a], and he will give you the desires of your heart.
translation:
  language: sw
  text: Jifurahishe katika Yahwe, naye atakupa matamanio ya moyo wako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maombi ya moyo wako.” Nomino ya Kiebrania inaweza kumaanisha mambo ambayo mtu anaomba, na pia mambo anayotamani moyoni.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעַנַּג
  choice: Jifurahishe
  rationale: 'Kauli ya amri katika Hitpael ina nguvu ya kujirejelea: mtu aone furaha na apate shangwe. “Jifurahishe” ni Kiswahili cha kawaida kinachohifadhi nguvu hiyo.'
- source_word: עַל
  choice: katika
  rationale: Ingawa kihalisi ni “juu ya,” hapa inaonyesha yule ambaye furaha inaelekezwa kwake; “katika” ni ya asili katika Kiswahili kwa uhusiano huu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa moja kwa moja badala ya kubadilishwa kuwa cheo, kwa kufuata Tetragramatoni ya Kiebrania.
- source_word: יִתֶּן
  choice: naye atakupa
  rationale: Kitenzi cha Qal imperfect chenye kiunganishi kinaeleweka kwa kawaida kama matokeo au ahadi ya wakati ujao katika muktadha huu wa hekima.
- source_word: מִשְׁאֲלוֹת
  choice: matamanio
  rationale: Nomino inaweza kumaanisha mambo yanayotamaniwa au maombi yanayoombwa. “Matamanio” linafaa kwa uhusiano wake na moyo huku tanbihi ikihifadhi maana nyingine.
- source_word: לִבֶּךָ
  choice: ya moyo wako
  rationale: “Moyo” huhifadhi taswira ya Kiebrania na hapa unahusu utu wa ndani, hasa matakwa na nia.
theological_decisions:
- issue: Uwezekano wa ahadi kueleweka kama dhamana ya kupata kila kitu kinachotamaniwa
  choice: Ahadi imetafsiriwa moja kwa moja bila kuongeza masharti yasiyotajwa katika mstari.
  alternative: Kuongeza “matamanio mema” au kusema Mungu atabadilisha kwanza matamanio hayo.
  rationale: Kiebrania kinatoa kauli moja kwa moja. Kuongeza sifa au maelezo hayo kungeondoa mvutano wa kiteolojia uliopo na kuingiza tafsiri katika matini.
- issue: Uwasilishaji wa jina la Mungu
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania ina jina יהוה, hivyo tafsiri inahifadhi jina hilo badala ya cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, rahisi na yenye heshima. Muundo wa kishairi ni mfupi, na kiwakilishi “naye” kinaonyesha kwa uwazi kuwa Yahwe ndiye atakayetoa.
