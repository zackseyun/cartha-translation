  text: דּ֤וֹם לַ/יהוָה֮ וְ/הִתְח֪וֹלֵ֫ל ל֥/וֹ אַל תִּ֭תְחַר בְּ/מַצְלִ֣יחַ דַּרְכּ֑/וֹ בְּ֝/אִ֗ישׁ עֹשֶׂ֥ה מְזִמּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/007.yaml
  text: Be still before Yahweh[a], and wait patiently for him; do not burn with anger because of one who prospers in his way[c][b], because of a man who carries out schemes.
translation:
  language: sw
  text: Tulia mbele za Yahwe[a], na umngojee kwa saburi[b]; usiwake kwa hasira[c] kwa sababu ya mtu anayefanikiwa katika njia yake, kwa sababu ya mwanamume anayetekeleza njama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nyamaza mbele za Yahwe.” Kitenzi cha Kiebrania kinaweza kukazia kunyamaza pamoja na kutulia.
    reason: lexical_alternative
  - marker: b
    text: Au, “umngojee kwa hamu kubwa”; tafsiri ya kimapokeo ni “upumzike ndani yake.” Kitenzi cha Kiebrania huenda kinaeleza kumngojea Mungu kwa saburi, hata kwa uchungu au mahangaiko.
    reason: lexical_alternative
  - marker: c
    text: Tafsiri ya kimapokeo ni “usifadhaike.” Kiebrania kwa maana halisi zaidi kinazungumzia kuwa moto au kuwaka kwa hasira.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹם
  choice: Tulia
  rationale: Amri hii inaweza kumaanisha kunyamaza au kutulia. “Tulia” ni ya kawaida katika Kiswahili na inaonyesha kujizuia kwa utulivu mbele za Mungu bila kuondoa maana ya ukimya.
- source_word: לַיהוָה
  choice: mbele za Yahwe
  rationale: Katika muktadha huu, kihusishi ל kinaonyesha mwelekeo wa kitendo au kuwapo mbele za YHWH. “Mbele za Yahwe” ni usemi wa asili unaohifadhi jina la agano.
- source_word: וְהִתְחוֹלֵל לוֹ
  choice: na umngojee kwa saburi
  rationale: Umbo la kitenzi חול hapa linaweza kuashiria kutetemeka au kuhangaika, lakini katika himizo hili linaelekea kueleza kumngojea Mungu kwa saburi, hata ikiwa kungoja huko kuna uchungu au hamu kubwa.
- source_word: אַל תִּתְחַר
  choice: usiwake hasira
  rationale: Kitenzi חרה hutumia taswira ya kuwaka au kuwa moto kwa hasira. Tafsiri hii inahifadhi taswira hiyo kuliko usemi mpana wa “usifadhaike.”
- source_word: בְּמַצְלִיחַ דַּרְכּוֹ
  choice: kwa sababu ya mtu anayefanikiwa katika njia yake
  rationale: Kihusishi ב kinaonyesha kisababishi cha hasira; participle מצליח ni kufanikiwa, na דרכו huhifadhi taswira ya njia, mwenendo, au mwendo wa maisha ya mtu.
- source_word: בְּאִישׁ
  choice: kwa sababu ya mwanamume
  rationale: אִישׁ ni nomino ya kiume katika umoja. “Mwanamume” huhifadhi jinsia ya kisarufi ya chanzo, ingawa mtu huyo anatumika kama mfano wa jumla.
- source_word: עֹשֶׂה מְזִמּוֹת
  choice: anayetekeleza njama
  rationale: מְזִמּוֹת inaweza kumaanisha mipango, hila, au njama. Muktadha ni hasi, na “kutekeleza njama” huonyesha kwamba mipango hiyo inawekwa katika vitendo bila kuongeza wazi neno “ovu” ambalo halipo katika kirai.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia moja kwa moja jina la agano YHWH. “Yahwe” hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo.
- issue: Jinsia ya אִישׁ
  choice: mwanamume
  alternative: mtu
  rationale: “Mwanamume” huhifadhi umbo la kiume la chanzo, huku matumizi yake katika methali hii yakiweza kuwakilisha mtu yeyote wa aina hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka. Muundo wa ushairi wa himizo umehifadhiwa kwa sentensi mbili zilizounganishwa kwa nuktamkato; taswira za “njia” na “kuwaka” zimeachwa wazi.
