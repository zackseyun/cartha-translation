lexical_decisions:
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Hili ndilo neno la kawaida na lenye heshima katika Kiswahili kwa cheo cha Mungu kama Mtawala, bila kulichanganya na jina la Mungu la herufi nne.
- source_word: יִשְׂחַק
  choice: anamcheka
  rationale: Kitenzi cha Kiebrania kimsingi humaanisha ‘kucheka.’ Katika muktadha huu kina maana ya dhihaka, lakini ‘anamcheka’ huhifadhi picha na maana ya msingi ya Kiebrania.
- source_word: לוֹ
  choice: -m- katika ‘anamcheka’
  rationale: Kihusishi cha Kiebrania humtaja mtu mwovu kuwa mlengwa wa kicheko; katika Kiswahili jambo hilo huwasilishwa kwa kawaida kupitia kiambishi cha yambwa katika ‘anamcheka.’
- source_word: כִּי
  choice: kwa maana
  rationale: כִּי ya kwanza inatoa sababu ya Bwana kumcheka mtu mwovu.
- source_word: רָאָה
  choice: anaona
  rationale: Ingawa umbo la Kiebrania ni timilifu, hapa linaonyesha utambuzi wa Mungu wenye umuhimu wa sasa. ‘Anaona’ ni ya asili katika Kiswahili na haiibadili leksimu kuwa ‘anajua.’
- source_word: כִּי
  choice: kwamba
  rationale: כִּי ya pili inaanzisha maudhui ya kile ambacho Bwana anaona.
- source_word: יָבֹא
  choice: inakuja
  rationale: Kauli hii huonyesha tukio la wakati ujao linalokaribia; ‘inakuja’ huhifadhi uhai wa picha hiyo.
- source_word: יוֹמוֹ
  choice: siku yake
  rationale: Hili ni tafsiri ya moja kwa moja ya usemi mfupi wa kishairi; muktadha unaonyesha kuwa ni siku ya kuanguka au kuhukumiwa kwa mtu mwovu.
theological_decisions:
- issue: Asili ya kicheko cha Mungu
  choice: Bwana anamcheka
  alternative: Bwana anamdhihaki
  rationale: Kitenzi cha Kiebrania kimsingi ni ‘kucheka,’ huku muktadha wa hukumu ukikifanya kicheko hicho kuwa cha dhihaka. Tafsiri kuu huhifadhi neno lenyewe bila kueleza kupita kiasi, na tanbihi hutaja maana ya kimuktadha.
- issue: Maana ya ‘siku yake’
  choice: Kudumisha usemi ‘siku yake’ katika matini
  alternative: Siku yake ya kuanguka au kuhukumiwa
  rationale: Kiebrania huacha usemi huu ukiwa mfupi na wenye uzito wa kishairi. Maelezo ya kuwa ni wakati uliowekwa wa kuanguka au hukumu yanafaa kuwekwa katika tanbihi badala ya kuongezwa katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye hadhi. Muundo mfupi wa kishairi umehifadhiwa; ‘kwa maana’ huonyesha uhusiano wa kisababishi, na ‘siku yake’ huacha uzito na kiasi cha utata wa usemi wa Kiebrania.
