  text: The Lord laughs at him[b][a], for he sees that his day is coming.
translation:
  language: sw
  text: Bwana anamcheka[a], kwa maana anaona kwamba siku yake[b] inakuja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anamdhihaki” au “anamkejeli.” Kitenzi cha Kiebrania kihalisi ni “anacheka,” lakini katika muktadha huu kicheko hicho ni cha dhihaka.
    reason: lexical_alternative
