  source_fidelity: '"Kwa maana" faithfully conveys the explanatory כִּי. "Mikono ya waovu itavunjwa" retains the concrete plural image of זְרוֹעוֹת and the future passive of תִּשָּׁבַרְנָה; in Kiswahili, plural "mikono" correctly takes the class-4 verbal form "itavunjwa." "Lakini" appropriately expresses the contextual contrast, and "Yahwe huwategemeza wenye haki" naturally renders Yahweh as the ongoing supporter of the righteous.'
