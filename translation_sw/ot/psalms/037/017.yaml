  text: כִּ֤י זְרוֹע֣וֹת רְ֭שָׁעִים תִּשָּׁבַ֑רְנָה וְ/סוֹמֵ֖ךְ צַדִּיקִ֣ים יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/017.yaml
  text: For the arms of the wicked will be broken[a], but Yahweh upholds the righteous.
translation:
  language: sw
  text: Kwa maana mikono ya waovu itavunjwa[a], lakini Yahwe huwategemeza wenye haki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mikono”; huenda taswira hii inamaanisha nguvu au uwezo wa waovu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu au maelezo yanayounga mkono wazo la muktadha, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: זְרוֹעוֹת
  choice: mikono
  rationale: Neno halisi linamaanisha mikono; katika ushairi linaweza kuwakilisha nguvu au uwezo. Taswira halisi imehifadhiwa, huku maana yake ikifafanuliwa katika tanbihi.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Ni kivumishi cha wingi kilichotumika kama nomino, kikitaja watu waovu kwa ufupi na kwa kawaida.
- source_word: תִּשָּׁבַרְנָה
  choice: itavunjwa
  rationale: Ni kitenzi cha kutendwa cha wakati ujao, chenye kupatana na 'mikono'; tafsiri hii huhifadhi maana ya moja kwa moja.
- source_word: וְ
  choice: lakini
  rationale: Ingawa kiunganishi chake cha msingi ni 'na', hapa kinaonyesha tofauti kati ya mwisho wa waovu na msaada wanaopata wenye haki.
- source_word: סוֹמֵךְ
  choice: huwategemeza
  rationale: Kauli ya kushirikisha inaonyesha tendo linaloendelea la kuwapa msaada na kuwazuia wasianguke.
- source_word: צַדִּיקִים
  choice: wenye haki
  rationale: Ni kivumishi cha wingi kilichotumika kama nomino; 'wenye haki' ni usemi wa kawaida na wazi katika Kiswahili cha kibiblia cha sasa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo; 'Yahwe' ni umbo la Kiswahili linalotambulika la YHWH.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja. Kutumia 'Yahwe' huhifadhi jina binafsi bila kulibadilisha kuwa cheo.
- issue: Taswira ya mikono ya waovu kuvunjwa
  choice: Kuhifadhi 'mikono' katika maandishi na kueleza maana yake katika tanbihi
  alternative: Kutafsiri moja kwa moja kama 'nguvu' au 'uwezo'
  rationale: Taswira halisi ya kishairi inapaswa kubaki, bila kuficha maana yake ya kimajazi ya nguvu au uwezo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo wa kishairi na tofauti kati ya waovu na wenye haki umehifadhiwa.
