  text: כִּֽי מְ֭רֵעִים יִכָּרֵת֑וּ/ן וְ/קֹוֵ֥י יְ֝הוָ֗ה הֵ֣מָּה יִֽירְשׁוּ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/009.yaml
  text: For evildoers will be cut off[a], but those who wait for Yahweh—they will inherit the land.
translation:
  language: sw
  text: Kwa maana watenda maovu watakatiliwa mbali, lakini wale wanaomngojea Yahwe—hao watairithi nchi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dunia.” Neno la Kiebrania אֶרֶץ linaweza kumaanisha “nchi” au “dunia”; hapa “nchi” linafaa zaidi katika mazingira ya agano ya zaburi hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu au msingi wa himizo lililotangulia, kwa mtiririko wa kawaida wa Kiswahili.
- source_word: מְרֵעִים
  choice: watenda maovu
  rationale: Huwataja watu wanaofanya maovu; usemi huu ni wazi, wa kawaida, na unadumisha tofauti ya kimaadili katika zaburi.
- source_word: יִכָּרֵתוּן
  choice: watakatiliwa mbali
  rationale: Kitenzi כרת katika Niphal kina maana ya kukatiliwa mbali au kuondolewa. Tafsiri hii inadumisha taswira ya kukatwa pamoja na uzito wake wa hukumu bila kuamua moja kwa moja kwamba maana pekee ni kuuawa.
- source_word: וְקֹוֵי
  choice: lakini wale wanaomngojea
  rationale: קוה huonyesha kungoja kwa tumaini na matarajio. 'Wanaomngojea' linaonyesha tumaini lenye subira, huku 'lakini' likiweka wazi utofauti wa vifungu viwili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa kwa namna iliyozoeleka katika Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: הֵמָּה
  choice: hao
  rationale: Kiwakilishi huru kinasisitiza kwamba watu hao ndio watakaorithi; 'hao' baada ya pauzo inadumisha mkazo huo kwa Kiswahili cha kawaida.
- source_word: יִירְשׁוּ
  choice: watairithi
  rationale: ירשׁ hapa linafaa kutafsiriwa kwa lugha ya urithi, inayodumisha mwelekeo wa ahadi na agano kuliko neno la jumla kama 'watamiliki.'
- source_word: אָרֶץ
  choice: nchi
  rationale: אֶרֶץ linaweza kumaanisha nchi au dunia. Katika mazingira ya Zaburi 37, 'nchi' linaendana vyema na ahadi inayorudiwa ya kuirithi nchi, huku uwezekano wa 'dunia' ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Upeo wa maana ya אָרֶץ katika ahadi
  choice: nchi
  alternative: dunia
  rationale: Muktadha wa karibu unarudia lugha ya kuirithi nchi na una mwangwi wa ahadi ya agano. Hata hivyo, kwa kuwa neno la Kiebrania linaweza pia kumaanisha dunia, tafsiri hiyo mbadala haijaondolewa bali imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa pauzo katika “Yahwe—hao” unadumisha mkazo wa kiwakilishi הֵמָּה bila kufanya sentensi kuwa nzito. Alama ya tanbihi imewekwa baada ya “nchi,” neno linalohusika na mbadala huo.
