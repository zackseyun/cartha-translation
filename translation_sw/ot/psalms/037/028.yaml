  text: כִּ֤י יְהוָ֨ה אֹ֘הֵ֤ב מִשְׁפָּ֗ט וְ/לֹא יַעֲזֹ֣ב אֶת חֲ֭סִידָי/ו לְ/עוֹלָ֣ם נִשְׁמָ֑רוּ וְ/זֶ֖רַע רְשָׁעִ֣ים נִכְרָֽת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/028.yaml
  text: For Yahweh loves justice and does not forsake his faithful ones[a]; they are kept forever[b], but the offspring of the wicked will be cut off.
translation:
  language: sw
  text: 'Kwa maana Yahwe anapenda haki,

    wala hawaachi waaminifu wake[a];

    wanalindwa milele[b],

    lakini uzao wa waovu utakatiliwa mbali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watakatifu wake,” “wacha Mungu wake,” au “walio waaminifu kwake.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kinaweza pia kueleweka kwa kuunganisha maneno hayo kwa karibu zaidi: “waaminifu wake wanalindwa milele.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la agano la Mungu kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: אֹהֵב
  choice: anapenda
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi אהב katika muktadha huu.
- source_word: מִשְׁפָּט
  choice: haki
  rationale: Hapa neno hilo linamaanisha uadilifu na utaratibu ulio sawa; “haki” ni wazi na asilia katika Kiswahili.
- source_word: יַעֲזֹב
  choice: hawaachi
  rationale: Kitenzi עזב humaanisha kuacha au kutelekeza; “hawaachi” ni cha kawaida na bado kinaonyesha uaminifu wa Yahwe kwa watu wake.
- source_word: חֲסִידָיו
  choice: waaminifu wake
  rationale: Kinarejelea watu wenye uaminifu na uchaji unaohusiana na חסד; chaguo hili huepuka kulifanya neno kuwa istilahi finyu ya kidini.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Huonyesha muda usio na mwisho au wa kudumu, na “milele” ni usemi wa kawaida wa Kiswahili.
- source_word: נִשְׁמָרוּ
  choice: wanalindwa
  rationale: Nifali ya שמר ina maana ya kuhifadhiwa au kulindwa; “wanalindwa” huwasilisha hali ya kupokea ulinzi bila kumtaja mtendaji ambaye maandishi hayamtaji wazi.
- source_word: זֶרַע
  choice: uzao
  rationale: Katika muktadha huu זרע humaanisha vizazi au watoto wa mtu; “uzao” huhifadhi pia taswira ya neno la Kiebrania.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Ni nomino ya kijumla, ya kawaida na yenye hadhi kwa watu waovu katika mlinganisho wa hekima wa zaburi.
- source_word: נִכְרָת
  choice: utakatiliwa mbali
  rationale: Huhifadhi nahau ya כרת ‘kukatiliwa mbali’ na maana yake ya hukumu badala ya kuibadilisha moja kwa moja kuwa ‘kuangamizwa.’
theological_decisions:
- issue: Maana na warejelewa wa חֲסִידָיו
  choice: waaminifu wake
  alternative: watakatifu wake; wacha Mungu wake; waaminifu kwake
  rationale: Chaguo hili linaonyesha watu wanaotambulishwa kwa uaminifu na uchaji unaohusiana na חסד bila kuingiza maana ya baadaye ya kitaasisi katika “watakatifu.”
- issue: Uhusiano wa vifungu viwili vya katikati
  choice: “wala hawaachi waaminifu wake; wanalindwa milele” kama kauli mbili zinazokamilishana
  alternative: “waaminifu wake wanalindwa milele” kama kipashio kimoja kilichounganishwa kwa karibu zaidi
  rationale: Mpangilio wa Kiebrania unaweza kuruhusu kifungu cha pili kufafanua cha kwanza. Nuktakoma huhifadhi mtiririko huo huku ikiacha kitenzi cha kutendwa kikiwa wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mistari mifupi inafaa ushairi wa zaburi; msamiati ni wa kawaida lakini unahifadhi nahau muhimu ya Kiebrania katika “utakatiliwa mbali.”
