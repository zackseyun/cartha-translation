  text: Their sword will enter their own heart[a], and their bows will be broken.
translation:
  language: sw
  text: 'Upanga wao utapenya mioyo yao wenyewe,[a]

    na pinde zao zitavunjwa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “moyo wao wenyewe”; Kiebrania kinatumia “moyo” katika umoja pamoja na kiambishi cha umilikaji cha wingi, usemi wa kawaida wa kijumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַרְבָּם
  choice: upanga wao
  rationale: Nomino iko katika umoja ikiwa na kiambishi cha wingi cha nafsi ya tatu. Kiswahili kinaweza kuhifadhi umoja huu wa kijumla kwa kusema “upanga wao,” kwa maana ya silaha ya waovu kama kundi au upanga wa kila mmoja wao.
- source_word: תָּבוֹא
  choice: utapenya
  rationale: Kitenzi hiki cha qal imperfect kinakubaliana na “upanga,” na pamoja na בְּ + “moyo” hapa kinaonyesha kuingia kwa kupenya. “Utapenya” ni ya kawaida na yenye nguvu inayofaa muktadha.
- source_word: בְלִבָּם
  choice: mioyo yao wenyewe
  rationale: Kiebrania kina “moyo” katika umoja pamoja na kiambishi cha umilikaji cha wingi, usemi wa kijumla. Kiswahili hutumia wingi “mioyo” kwa kawaida zaidi kwa kundi la watu; “yao wenyewe” huonyesha wazi kwamba silaha zao zinawarudia wao bila kubadili maana ya muktadha.
- source_word: וְקַשְּׁתוֹתָם
  choice: na pinde zao
  rationale: Nomino ni ya wingi pamoja na kiambishi cha umilikaji cha nafsi ya tatu wingi; “na pinde zao” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: תִּשָּׁבַרְנָה
  choice: zitavunjwa
  rationale: Niphal imperfect ya wingi wa kike ina maana ya kutendwa hapa. “Zitavunjwa” ni tafsiri ya moja kwa moja, ya asili, na isiyoongeza kiwango cha nguvu kama “zitavunjwavunjwa.”
