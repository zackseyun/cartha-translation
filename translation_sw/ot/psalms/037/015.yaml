translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. Mistari miwili inahifadhi usambamba wa Kiebrania. “Utapenya” huepuka usemi mzito “utaingia ndani ya,” huku “zitavunjwa” ikihifadhi hali ya kutendwa.
