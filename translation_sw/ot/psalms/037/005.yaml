base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/005.yaml
  text: Commit your way to Yahweh[a]; trust in him[b], and he will act.
translation:
  language: sw
  text: Mkabidhi Yahweh njia yako[a]; mtumaini, naye atatenda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi katika Kiebrania, “Viringisha njia yako juu ya Yahweh.” Nahau hii humaanisha kumkabidhi mwenendo au mwelekeo wako.
    reason: lexical_alternative
  - marker: b
    text: Au “atafanya hivyo” au “atalitekeleza.” Kiebrania husema tu “atafanya/atatenda” bila kutaja yambwa waziwazi.
    reason: alternative_reading
lexical_decisions:
- source_word: גּוֹל
  choice: Mkabidhi
  rationale: Kitenzi hiki kwa maana halisi ni ‘viringisha,’ lakini katika nahau hii humaanisha kumwekea Yahweh njia au mwenendo wa mtu ili autegemee. ‘Mkabidhi’ ni Kiswahili cha kawaida kinachowasilisha maana hiyo na nguvu ya amri.
- source_word: עַל יְהוָה
  choice: Yahweh
  rationale: Kihusishi עַל, ambacho kwa maana ya msingi ni ‘juu ya,’ kinawasilishwa kwa muundo wa kawaida wa Kiswahili pamoja na ‘m-kabidhi.’ Jina la Mungu יהוה limetoholewa kuwa ‘Yahweh,’ si kubadilishwa na cheo.
- source_word: דַּרְכֶּךָ
  choice: njia yako
  rationale: ‘Njia’ ni tafsiri ya moja kwa moja na pia inaweza kumaanisha mwenendo au mwelekeo wa maisha, kama ilivyo kawaida katika fasihi ya hekima.
- source_word: וּבְטַח עָלָיו
  choice: mtumaini
  rationale: Muundo huu unaamuru kumtegemea Yahweh kwa uhakika. ‘Mtumaini’ ni mfupi, wa asili, na kiwakilishi cha nafsi kinarejelea Yahweh kwa uwazi.
- source_word: וְהוּא
  choice: naye
  rationale: '‘Naye’ inadumisha muunganiko wa sentensi na mkazo wa kiwakilishi: Yahweh mwenyewe ndiye atakayetenda.'
- source_word: יַעֲשֶׂה
  choice: atatenda
  rationale: Kitenzi kina maana pana ya ‘kufanya’ au ‘kutenda,’ na hakina yambwa iliyotajwa. ‘Atatenda’ huhifadhi uwazi huo bila kuongeza jambo ambalo maandishi hayajasema.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu, יהוה. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Iwapo yambwa ya יַעֲשֶׂה itajwe
  choice: atatenda
  alternative: atafanya hivyo; atalitekeleza
  rationale: Kiebrania hakitaji yambwa. Tafsiri iliyo wazi kwa kutosema atafanya nini huhifadhi ukosefu huo wa ubainisho na haipanui ahadi kuliko maandishi yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mkabidhi’ na ‘mtumaini’ ni amri za nafsi ya pili umoja, kama katika Kiebrania. Sentensi ni fupi na ya kishairi, huku tanbihi zikihifadhi sitiari ya asili na kutobainishwa kwa tendo la mwisho.
