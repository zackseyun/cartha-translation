  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/ע֣וֹד מְ֭עַט וְ/אֵ֣ין רָשָׁ֑ע וְ/הִתְבּוֹנַ֖נְתָּ עַל מְקוֹמ֣/וֹ וְ/אֵינֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/010.yaml
  text: Yet a little while[a], and the wicked will be no more; though you look carefully at his place, he will not be there.
translation:
  language: sw
  text: Bado kitambo kidogo tu, na mwovu[a] hatakuwapo tena; hata ukiangalia kwa makini mahali pake, hatakuwapo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waovu.” Neno la Kiebrania liko katika umoja, lakini linaweza kutumiwa kumwakilisha mtu mwovu kwa ujumla au kundi la waovu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד מְעַט
  choice: Bado kitambo kidogo tu
  rationale: Kirai hiki ni usemi wa wakati unaomaanisha kuwa muda mfupi tu umebaki. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha mtazamo wa mbele.
- source_word: וְאֵין רָשָׁע
  choice: na mwovu hatakuwapo tena
  rationale: Neno רָשָׁע ni umoja unaotumiwa kama nomino na linaweza kumwakilisha mtu mwovu kwa ujumla. Kwa muktadha unaotazamia wakati ujao, וְאֵין limetafsiriwa kuwa kutokuwapo tena.
- source_word: וְהִתְבּוֹנַנְתָּ
  choice: hata ukiangalia kwa makini
  rationale: Muundo wa kitenzi unaonyesha kutazama au kuchunguza kwa makini. 'Hata ukiangalia' huwasilisha vizuri maana ya kukubali hoja katika muktadha bila kuondoa wazo la uchunguzi makini.
- source_word: עַל מְקוֹמוֹ
  choice: mahali pake
  rationale: Hurejelea eneo alikokuwapo mwovu. Kiswahili hakihitaji kiambishi kinacholingana moja kwa moja na עַל katika usemi huu.
- source_word: וְאֵינֶנּוּ
  choice: hatakuwapo
  rationale: Kifungu cha mwisho kinarudia kwa mkazo kwamba mwovu hatapatikana katika mahali pake. Wakati ujao unafaa muktadha wa ahadi ya mstari huu.
theological_decisions:
- issue: Umoja wa רָשָׁע kama mtu mmoja au uwakilishi wa jumla
  choice: mwovu
  alternative: waovu
  rationale: '''Mwovu'' inadumisha umoja wa Kiebrania huku ikiweza kueleweka kama mwakilishi wa watu waovu kwa ujumla; tanbihi inaweka wazi uwezekano wa maana ya kijumla.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Kitambo kidogo tu' ni usemi unaoeleweka kwa urahisi, na urudiaji wa 'hatakuwapo' umehifadhiwa ili kudumisha mkazo wa maandishi ya Kiebrania.
