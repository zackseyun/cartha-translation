  variant: Standard East African Swahili
source:
  edition: WLC
  text: נַ֤עַר הָיִ֗יתִי גַּם זָ֫קַ֥נְתִּי וְֽ/לֹא רָ֭אִיתִי צַדִּ֣יק נֶעֱזָ֑ב וְ֝/זַרְע֗/וֹ מְבַקֶּשׁ לָֽחֶם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/025.yaml
  text: I was young[a], and now I am old[b], yet I have not seen the righteous forsaken or his offspring begging for bread.
translation:
  language: sw
  text: Nilikuwa kijana, na sasa nimezeeka; lakini sijamwona mwenye haki akiwa ametelekezwa, wala uzao wake[a] ukiombaomba mkate.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni ‘mbegu yake,’ yaani uzao au wazao wake.
    reason: lexical_alternative
  - marker: b
    text: Au ‘ukitafuta mkate.’ Kitenzi cha Kiebrania kimsingi humaanisha ‘kutafuta’ au ‘kuomba,’ lakini hapa yaelekea kinamaanisha kuomba chakula cha msingi kwa sababu ya uhitaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר הָיִיתִי
  choice: Nilikuwa kijana
  rationale: Kirai hiki kinaeleza hali ya msemaji alipokuwa katika ujana. Kiswahili hiki ni cha kawaida na kinahifadhi tofauti kati ya ujana na uzee.
- source_word: גַּם זָקַנְתִּי
  choice: na sasa nimezeeka
  rationale: Ingawa גַּם kwa kawaida humaanisha ‘pia’ au ‘hata,’ hapa inaunganisha hatua mbili za maisha. ‘Na sasa’ huonyesha kwa kawaida mwendo kutoka ujana hadi uzee, huku ‘nimezeeka’ ikihifadhi wazo la kufikia hali ya uzee.
- source_word: וְלֹא רָאִיתִי
  choice: lakini sijamwona
  rationale: Kauli ya nafsi ya kwanza inahifadhi ushuhuda wa mambo ambayo msemaji ameyaona katika maisha yake, bila kuibadili kuwa ahadi ya jumla. ‘Lakini’ huonyesha tofauti ya kiasi katika muktadha.
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Nomino hii ya umoja inatumiwa kwa maana ya mwakilishi wa kundi. ‘Mwenye haki’ ni Kiswahili cha sasa, cha heshima, na hakiongezi jinsia ambayo si lazima itajwe wazi.
- source_word: נֶעֱזָב
  choice: akiwa ametelekezwa
  rationale: Umbo hili la kutendwa lina maana ya kuachwa au kutelekezwa. ‘Ametelekezwa’ huhifadhi uzito wa kuachwa bila msaada kuliko neno la kawaida tu ‘ameachwa.’
- source_word: וְזַרְעוֹ
  choice: wala uzao wake
  rationale: זֶרַע hapa ni ‘uzao’ au ‘wazao.’ ‘Uzao wake’ huhifadhi umoja wa kisarufi na maana pana ya watoto au vizazi. ‘Wala’ huunganisha mambo mawili ambayo msemaji anasema hajayaona.
- source_word: מְבַקֶּשׁ לָחֶם
  choice: ukiombaomba mkate
  rationale: מְבַקֶּשׁ kimsingi ni ‘kutafuta’ au ‘kuomba,’ lakini pamoja na ‘mkate’ katika muktadha huu inaelekea kueleza kuomba chakula kwa sababu ya uhitaji. ‘Kuombaomba mkate’ huwasilisha hali hiyo, huku ‘mkate’ ukihifadhi taswira halisi ya chakula cha msingi.
theological_decisions:
- issue: Ikiwa mstari ni dhamana kamili ya kitheolojia au ushuhuda wa jambo aliloona mtunga zaburi
  choice: 'Umetafsiriwa kama ushuhuda wa nafsi ya kwanza: ‘sijamwona.’'
  alternative: Kuufanya kuwa ahadi ya jumla kwamba kamwe hakuna mwenye haki wala uzao wake atakayepatwa na ufukara.
  rationale: Kiebrania kinaweka dai hili ndani ya uzoefu wa maisha ya msemaji, tangu ujana hadi uzee. Tafsiri haipanui ushuhuda huo kuwa ahadi isiyo na masharti.
- issue: Nguvu ya kiunganishi וְ kabla ya זַרְעוֹ
  choice: wala uzao wake
  alternative: na uzao wake
  rationale: '‘Wala’ ni ya kawaida katika sentensi hasi ya Kiswahili na inaonyesha kwamba msemaji hajayaona yote mawili: mwenye haki kutelekezwa, wala uzao wake kuombaomba mkate. Hailazimishi matukio hayo mawili yatokee pamoja.'
- issue: Uwakilishi wa jinsia katika צַדִּיק na kiambishi cha umoja katika זַרְעוֹ
  choice: mwenye haki ... uzao wake
  alternative: mwanaume mwenye haki ... watoto wake; au wenye haki ... uzao wao
  rationale: Kiebrania kina umoja wa kiume wenye matumizi ya kiwakilishi. ‘Mwenye haki’ huhifadhi umoja na maana ya jumla bila kuongeza ‘mwanaume,’ na ‘uzao wake’ hudumisha kiambishi cha umoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi umbo la ushuhuda binafsi na taswira ya ‘mkate.’ Alama za tanbihi zimewekwa karibu na maneno yanayohusika, kwa kuwa mpangilio wa alama katika safu ya mashauriano ya Kiingereza haukulingana na maelezo yake.
