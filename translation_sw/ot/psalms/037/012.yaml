  text: The wicked plots against the righteous and gnashes his teeth at him[a][b].
translation:
  language: sw
  text: 'Mwovu hupanga njama dhidi ya mwenye haki,

    na humsagia meno[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Usemi “kumsagia meno” unaonyesha hasira kali na uhasama.
