lexical_decisions:
- source_word: זֹמֵם
  choice: hupanga njama
  rationale: Kitenzi hiki cha hali ya kuendelea kinaonyesha kutunga mpango wenye nia mbaya; ‘hupanga njama’ ni Kiswahili cha kawaida kinachohifadhi uhasama wa muktadha.
- source_word: רָשָׁע
  choice: mwovu
  rationale: Nomino-kivumishi hii humaanisha mtu mwovu; umoja umehifadhiwa kwa kuwa vitenzi na viwakilishi vya Kiebrania viko katika umoja.
- source_word: לַצַּדִּיק
  choice: dhidi ya mwenye haki
  rationale: Kihusishi hapa humtaja mlengwa wa uhasama. ‘Mwenye haki’ ni usemi wa asili na unaoeleweka kwa mtu anayetenda yaliyo sawa.
- source_word: חֹרֵק
  choice: humsagia
  rationale: Kitenzi kinaonyesha kusaga au kusaga-saga meno kwa hasira na uhasama; ‘humsagia meno’ huhifadhi tamathali ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: עָלָיו
  choice: hum-
  rationale: Mwelekeo wa tendo kwa ‘yeye’ umeonyeshwa kiasili kwa kiambishi cha yambwa ‘-m-’ katika ‘humsagia,’ badala ya kuongeza kihusishi kisicho cha lazima.
- source_word: שִׁנָּיו
  choice: meno
  rationale: Nomino ya wingi imehifadhiwa ndani ya nahau; umilikaji wake unaeleweka kutokana na muundo ‘humsagia meno,’ yaani mwovu husaga meno yake akimwelekea mwenye haki.
