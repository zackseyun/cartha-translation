translation_notes:
  register: Lugha ni ya sasa, yenye hadhi na rahisi kueleweka. Mpangilio wa mistari miwili unaakisi usambamba wa kishairi wa Kiebrania. ‘Mwovu’ na ‘mwenye haki’ zimewekwa katika umoja kama katika maandishi ya Kiebrania.
