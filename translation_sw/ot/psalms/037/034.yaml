  text: קַוֵּ֤ה אֶל יְהוָ֨ה וּ/שְׁמֹ֬ר דַּרְכּ֗/וֹ וִֽ֭/ירוֹמִמְ/ךָ לָ/רֶ֣שֶׁת אָ֑רֶץ בְּ/הִכָּרֵ֖ת רְשָׁעִ֣ים תִּרְאֶֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/034.yaml
  text: Wait for Yahweh and keep his way[a], and he will exalt you to inherit the land; when the wicked are cut off[c][b], you will see it.
translation:
  language: sw
  text: Mngojee[b] Yahwe na ushike njia yake; naye atakuinua ili uirithi nchi[a][c]. Waovu watakapokatiliwa mbali, utaliona hilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dunia.” Neno la Kiebrania אָרֶץ linaweza kumaanisha “nchi” au “dunia.” Hapa “nchi” imetumiwa kwa sababu Zaburi 37 hurudia lugha ya agano kuhusu kurithi nchi.
    reason: alternative_reading
  - marker: b
    text: Au “Mtumaini Yahwe.” Kitenzi cha Kiebrania kinamaanisha kungoja kwa subira na tumaini lenye matarajio.
    reason: lexical_alternative
  - marker: c
    text: Linganisha Mathayo 5:5, ambapo ahadi ya kuirithi dunia au nchi inasikika tena.
    reason: cross_reference
lexical_decisions:
- source_word: קַוֵּה
  choice: Mngojee
  rationale: Kauli ya amri ya קוה inaonyesha kungoja kwa subira na tumaini linalomwelekea Yahwe. “Mngojee” ni Kiswahili cha kawaida kinachohifadhi wazo la matarajio bila kulibana kuwa tumaini pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe” badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: וּשְׁמֹר דַּרְכּוֹ
  choice: na ushike njia yake
  rationale: שׁמר inaweza kumaanisha kushika, kulinda, au kutunza. Katika usemi huu, “ushike njia yake” humaanisha kudumu kwa uaminifu katika mwenendo na maagizo yake bila kufafanua kupita kiasi.
- source_word: וִירוֹמִמְךָ
  choice: naye atakuinua
  rationale: Hifili ya רום ina maana ya kuinua au kutukuza. “Atakuinua” ni ya asili katika Kiswahili na inafaa muktadha wa kuthibitishwa na kupewa urithi.
- source_word: לָרֶשֶׁת אָרֶץ
  choice: ili uirithi nchi
  rationale: ירשׁ hubeba maana ya kurithi au kumiliki, huku אָרֶץ ikiweza kuwa nchi au dunia. “Kurithi nchi” huhifadhi lugha ya urithi wa agano inayojirudia katika Zaburi 37, huku uwezekano wa “dunia” ukihifadhiwa katika tanbihi.
- source_word: בְּהִכָּרֵת רְשָׁעִים
  choice: Waovu watakapokatiliwa mbali
  rationale: Muundo huu unaonyesha wakati ambapo waovu wanaondolewa. “Watakapokatiliwa mbali” huhifadhi taswira na uzito wa kimahakama wa כרת kuliko tafsiri pana kama “watakapoangamizwa.”
- source_word: תִּרְאֶה
  choice: utaliona hilo
  rationale: Kitenzi kinamaanisha “utaona.” Kiwakilishi “hilo” kimeongezwa kwa uwazi wa Kiswahili, kikirejelea kukatiliwa mbali kwa waovu bila kuongeza dai jipya.
theological_decisions:
- issue: Maana ya אָרֶץ katika muktadha wa hekima na agano
  choice: nchi
  alternative: dunia
  rationale: Zaburi 37 hutumia mara nyingi lugha ya agano kuhusu kurithi nchi, kwa hiyo “nchi” huhifadhi vizuri muktadha wa Agano la Kale. Hata hivyo, neno אָרֶץ linaweza pia kumaanisha “dunia”; maana hiyo haijaondolewa na imeonyeshwa katika tanbihi, hasa kwa kuzingatia mwangwi wake katika Mathayo 5:5.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Ushike njia yake” na “watakapokatiliwa mbali” huhifadhi tamathali za Kiebrania bila kufanya sentensi kuwa ngumu. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
