  text: But transgressors are destroyed together[a]; the future of the wicked is cut off.
translation:
  language: sw
  text: Lakini waasi wataangamizwa pamoja; wakati ujao wa waovu utakatiliwa mbali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwisho wa waovu utakatiliwa mbali.” Neno la Kiebrania אַחֲרִית linaweza kumaanisha “wakati ujao,” “matokeo,” au “mwisho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פֹשְׁעִים
  choice: Lakini waasi
  rationale: פֹשְׁעִים ni watu wanaoasi au kuvunja sheria. “Waasi” ni neno la kawaida na lenye nguvu katika Kiswahili, nalo huhifadhi dhana ya uasi wa makusudi. Kiunganishi waw kimetafsiriwa “Lakini” ili kuonyesha tofauti na wenye haki katika muktadha.
- source_word: נִשְׁמְדוּ
  choice: wataangamizwa
  rationale: Nifali ya שׁמד ina maana ya kuharibiwa au kuangamizwa. Wakati ujao wa Kiswahili unafaa kwa kauli ya kimethali kuhusu hatima, bila kudai maana ya kifalsafa ya kutokuwapo kabisa.
- source_word: יַחְדָּו
  choice: pamoja
  rationale: Neno hili linaweza kumaanisha “pamoja” au “kwa jumla.” “Pamoja” huhifadhi kwa ufupi wazo la waasi kufikia hatima moja.
- source_word: אַחֲרִית
  choice: wakati ujao
  rationale: אַחֲרִית inaweza kumaanisha wakati ujao, matokeo, mwisho, au uzao. “Wakati ujao” huwasilisha matarajio ya mwisho ya waovu katika muktadha huu, huku uwezekano wa “mwisho” ukihifadhiwa katika tanbihi.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: “Waovu” ni tafsiri ya kawaida na ya asili ya רְשָׁעִים katika fasihi ya hekima na Zaburi, ikihifadhi jamii ya kimaadili.
- source_word: נִכְרָתָה
  choice: utakatiliwa mbali
  rationale: Nifali ya כרת kwa kawaida humaanisha kukatiliwa mbali. Usemi huu huhifadhi taswira na uzito wa hukumu uliomo katika Kiebrania.
theological_decisions:
- issue: Maana ya אַחֲרִית katika muktadha wa hukumu
  choice: wakati ujao wa waovu utakatiliwa mbali
  alternative: mwisho wa waovu utakatiliwa mbali; uzao wa waovu utakatiliwa mbali
  rationale: Muktadha unalinganisha hatima za wenye haki na waovu, kwa hiyo “wakati ujao” huonyesha matarajio yao ya mwisho bila kuifunga maana kwa uzao pekee. “Mwisho” ni tafsiri inayowezekana na ya kawaida, hivyo imeonyeshwa katika tanbihi ili kuhifadhi utata halisi wa Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. “Waasi,” “waovu,” na “utakatiliwa mbali” ni maneno yanayoeleweka kwa wasomaji wa kawaida huku yakihifadhi uzito wa hukumu katika mstari wa Kiebrania.
