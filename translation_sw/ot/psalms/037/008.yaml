lexical_decisions:
- source_word: הֶרֶף מֵאַף
  choice: Acha hasira
  rationale: Kitenzi רפה katika amri humaanisha kuacha au kujiondoa katika jambo; אַף hapa ni hasira, si kiungo cha mwili kwa maana halisi.
- source_word: וַעֲזֹב חֵמָה
  choice: na uache ghadhabu
  rationale: עזב ni kuacha kabisa, na חֵמָה ni hasira kali au ghadhabu. ‘Ghadhabu’ inadumisha usambamba wa kishairi huku ikiitofautisha na ‘hasira’.
- source_word: אַל תִּתְחַר
  choice: usiwake hasira
  rationale: חרה hubeba taswira ya kuwaka au kuwa na joto kwa hasira. Usemi huu wa Kiswahili unahifadhi taswira na nguvu ya onyo; uwezekano wa maana ya kufadhaika umewekwa katika tanbihi.
- source_word: אַךְ לְהָרֵעַ
  choice: hilo huleta uovu tu
  rationale: אַךְ ina nguvu ya kuweka mpaka, ‘tu,’ na לְ pamoja na kitenzi רעע inaweza kueleza matokeo au kusudi. Katika muktadha, tafsiri hii inaeleza kwa Kiswahili cha kawaida kwamba hasira hiyo huishia katika uovu.
theological_decisions:
- issue: Nguvu ya kimaadili ya kishazi cha mwisho
  choice: hilo huleta uovu tu
  alternative: ila kutenda mabaya tu
  rationale: Muundo wa Kiebrania unaweza kueleweka kuwa unaonyesha matokeo au kusudi. Matini kuu inaonyesha matokeo yanayolingana na muktadha, huku tanbihi ikihifadhi tafsiri ya karibu zaidi na muundo halisi bila kuongeza fundisho la kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wa heshima. Marudio ya ‘acha/uache’ yanadumisha usambamba wa Kiebrania, na ‘usiwake hasira’ yanahifadhi taswira ya joto iliyomo katika kitenzi cha chanzo.
