base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/037.yaml
  text: Observe the blameless[a], and see the upright[c][b], for there is a future for the man of peace.
translation:
  language: sw
  text: 'Mtazame kwa makini mtu asiye na lawama[a],

    na umwone mnyofu,

    kwa maana mtu wa amani[c] ana matumaini ya baadaye[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtambue asiye na lawama,” au “Mweke maanani asiye na lawama.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania אַחֲרִית linaweza pia kumaanisha “mwisho” au “matokeo ya mwisho”; wengine hulielewa hapa kuwa “uzao.”
    reason: lexical_alternative
  - marker: c
    text: Au, “mtu anayependa amani.” Neno שָׁלוֹם linaweza pia kuwa na maana ya hali njema au ukamilifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר
  choice: Mwangalie kwa makini
  rationale: Kauli ya amri hapa ina maana ya kumtazama mtu kwa uangalifu au kumwekea fikira, si kumlinda. Usemi huu wa Kiswahili ni wa kawaida na unahifadhi nguvu ya himizo.
- source_word: תָּם
  choice: asiye na lawama
  rationale: Neno hili linaeleza uadilifu na ukamilifu wa mwenendo, si kutokuwa na dhambi kabisa. Kirai hiki kinaweza kutumika kama nomino bila kuongeza ‘mtu’ isiyopo wazi katika sehemu hii ya Kiebrania.
- source_word: וּרְאֵה
  choice: na umwone
  rationale: Kauli hii ya pili ya amri inadumisha usambamba wa kishairi na שְׁמָר, huku ikiwa ya moja kwa moja katika Kiswahili.
- source_word: יָשָׁר
  choice: mnyofu
  rationale: Neno hili humaanisha mtu mwenye unyofu wa kimaadili. ‘Mnyofu’ ni la asili na linaendana na ‘asiye na lawama.’
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya himizo lililotangulia.
- source_word: אַחֲרִית
  choice: wakati ujao
  rationale: Neno linaweza kumaanisha wakati ujao, mwisho, au matokeo ya mwisho. Katika muktadha huu linaashiria matarajio ya baadaye bila kubainisha kupita kiasi; maana nyingine zimehifadhiwa katika tanbihi.
- source_word: לְאִישׁ
  choice: mtu
  rationale: אִישׁ ni nomino ya umoja wa kiume, lakini ‘mtu’ ni tafsiri ya kawaida na sahihi katika Kiswahili kwa kauli ya hekima yenye matumizi wakilishi; haisemi kwamba mhusika ni wa jinsia nyingine.
- source_word: שָׁלוֹם
  choice: wa amani
  rationale: Kirai hiki kinamhusisha mtu na amani, huku שָׁלוֹם pia ikiweza kujumuisha hali njema na ukamilifu. Tafsiri ya moja kwa moja inadumisha utata huo kwa msaada wa tanbihi.
theological_decisions:
- issue: Maana ya אַחֲרִית kuhusu hatima ya mtu mnyofu
  choice: ana wakati ujao
  alternative: ana mwisho mwema; ana matokeo ya baadaye; ana uzao
  rationale: Muktadha unalinganisha hatima ya watu wanyofu na ya wakosaji. ‘Wakati ujao’ huonyesha tarajio chanya bila kuamua kimya kimya ikiwa neno linalenga mwisho, matokeo, au uzao.
- issue: Uhusiano wa שָׁלוֹם na אִישׁ
  choice: mtu wa amani
  alternative: mtu mwenye amani; mtu mwenye hali njema; mtu anayependa amani
  rationale: Muundo wa Kiebrania unaweza kueleza tabia ya kupenda amani au hali ya ustawi na ukamilifu. ‘Mtu wa amani’ huhifadhi upana huo kuliko tafsiri inayochagua maana moja tu.
- issue: אִישׁ ya umoja wa kiume katika kauli ya hekima
  choice: mtu
  alternative: mwanamume
  rationale: Katika Kiswahili, ‘mtu’ ndiyo tafsiri ya kawaida ya אִישׁ inapomtaja mtu binafsi bila kufanya jinsia ya kibayolojia kuwa hoja ya mstari. Hivyo umoja unadumishwa bila kuingiza mkazo wa kijinsia usiotakiwa na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mistari mitatu inadumisha usambamba wa zaburi. Lugha ni rahisi kwa msomaji wa kawaida, na tanbihi zinahifadhi uwezekano muhimu wa kileksika na kisintaksia.
