  text: כִּ֣י מְ֭בֹרָכָי/ו יִ֣ירְשׁוּ אָ֑רֶץ וּ֝/מְקֻלָּלָ֗י/ו יִכָּרֵֽתוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/022.yaml
  text: For those blessed by him will inherit the land[a], but those cursed by him will be cut off.
translation:
  language: sw
  text: Kwa maana wale waliobarikiwa naye watairithi nchi[a], lakini wale waliolaaniwa naye watakatiliwa mbali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dunia.” Neno la Kiebrania אֶרֶץ linaweza kumaanisha “nchi” au “dunia”; hapa “nchi” linafaa zaidi katika muktadha wa kiagano wa zaburi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Hutanguliza sababu au maelezo ya kauli iliyotangulia na linafaa katika mtiririko wa hoja wa zaburi.
- source_word: מְבֹרָכָיו
  choice: wale waliobarikiwa naye
  rationale: Huhifadhi hali ya kutendwa ya kishiriki na kiambishi cha nafsi ya tatu umoja, huku 'naye' ikionyesha kwa kawaida kwamba Bwana ndiye mtendaji kulingana na muktadha.
- source_word: יִירְשׁוּ
  choice: watairithi
  rationale: '''Kurithi'' huhifadhi maana ya kupokea au kumiliki nchi na mwangwi wake wa kiagano.'
- source_word: אָרֶץ
  choice: nchi
  rationale: Katika Zaburi 37, ahadi inayorudiwa ya kuirithi אֶרֶץ inafaa zaidi kueleweka kama 'nchi,' ingawa neno hilo pia linaweza kumaanisha 'dunia'.
- source_word: וּמְקֻלָּלָיו
  choice: lakini wale waliolaaniwa naye
  rationale: '''Lakini'' huonyesha ulinganifu wa kupingana kati ya mistari miwili; uundaji wa hali ya kutendwa na kiambishi chake umehifadhiwa.'
- source_word: יִכָּרֵתוּ
  choice: watakatiliwa mbali
  rationale: Huhifadhi tamathali ya Kiebrania ya 'kukatiliwa mbali' pamoja na uzito wake wa hukumu, badala ya kuirahisisha kuwa 'wataangamizwa.'
theological_decisions:
- issue: Kirejeleo cha viambishi vya nafsi ya tatu umoja katika מְבֹרָכָיו na מְקֻלָּלָיו
  choice: Kimetafsiriwa kwa 'naye,' kikimrejelea Bwana kutokana na muktadha.
  alternative: Kutafsiri kwa namna ya moja kwa moja zaidi kama 'waliobarikiwa wake' na 'waliolaaniwa wake' bila kumtaja mtendaji wazi.
  rationale: Muktadha unamtambulisha Bwana kama kirejeleo cha umoja. 'Naye' huleta uwazi wa kawaida wa Kiswahili bila kuongeza dai jipya la kitheolojia.
- issue: Upeo wa maana ya אָרֶץ
  choice: nchi
  alternative: dunia
  rationale: Ahadi ya Zaburi 37 ina muktadha wa kiagano na wa hekima kuhusu kuimiliki nchi. Hata hivyo, uwezekano halisi wa maana pana zaidi umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Ulinganifu wa mistari umehifadhiwa kwa 'wale... lakini wale...'; tamathali ya hukumu 'watakatiliwa mbali' imeachwa bila kufafanuliwa kupita kiasi.
