  text: חֶ֤רֶב פָּֽתְח֣וּ רְשָׁעִים֮ וְ/דָרְכ֪וּ קַ֫שְׁתָּ֥/ם לְ֭/הַפִּיל עָנִ֣י וְ/אֶבְי֑וֹן לִ֝/טְב֗וֹחַ יִשְׁרֵי דָֽרֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/014.yaml
  text: The wicked have drawn the sword and bent their bow[a], to bring down the poor and needy[b], to slaughter those upright in way.
translation:
  language: sw
  text: Waovu wamefuta upanga na kuupinda upinde wao, ili kuwaangusha maskini na wahitaji, ili kuwachinja walio wanyoofu katika mwenendo wao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶרֶב פָּתְחוּ
  choice: wamefuta upanga ala
  rationale: Kitenzi cha Kiebrania kwa msingi ni ‘kufungua,’ lakini pamoja na ‘upanga’ ni nahau ya kuutoa alani; ‘kufuta upanga ala’ ni Kiswahili cha kawaida na huhifadhi picha hiyo.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Huwasilisha kundi la kimaadili bila kuongeza jinsia isiyotajwa katika Kiebrania.
- source_word: וְדָרְכוּ קַשְׁתָּם
  choice: na wamepinda upinde wao
  rationale: Kitenzi hiki, kinapotumiwa na upinde, humaanisha kuupinda au kuutayarisha kwa kupiga mshale. Umoja wa ‘upinde wao’ unafuata umbo la Kiebrania.
- source_word: לְהַפִּיל
  choice: ili kuwaangusha
  rationale: Hili ni umbo la kusababisha la נפל, yaani ‘kusababisha waanguke’; muktadha unaonyesha shambulio dhidi ya watu.
- source_word: עָנִי וְאֶבְיוֹן
  choice: maskini na wahitaji
  rationale: 'Huhifadhi ulinganifu wa maneno mawili yanayokaribiana: watu walio maskini au walioteswa na wale wenye uhitaji mkubwa.'
- source_word: לִטְבֹחַ
  choice: ili kuwachinja
  rationale: Kitenzi kina nguvu kuliko ‘kuua’ kwa ujumla na huonyesha ukatili wa kuchinja.
- source_word: יִשְׁרֵי דָרֶךְ
  choice: wale waendao katika unyoofu
  rationale: Kirai halisi ni ‘walionyooka wa njia.’ Tafsiri hii ni ya asili katika Kiswahili na inaonyesha mwenendo wa maisha ulio sawa bila kuifanya ‘njia’ kuwa mahali halisi tu.
theological_decisions:
- issue: Maana ya עָנִי
  choice: maskini
  alternative: walioteswa / wanyenyekevu
  rationale: Katika ulinganifu na אֶבְיוֹן (‘wahitaji’), maana ya udhaifu wa kijamii na kiuchumi ndiyo inayojitokeza zaidi, ingawa neno linaweza pia kumaanisha mtu aliyeteswa au kunyenyekezwa.
- issue: Maana ya יִשְׁרֵי דָרֶךְ
  choice: wale waendao katika unyoofu
  alternative: walio wanyoofu katika mwenendo wao
  rationale: Chaguo kuu huhifadhi picha ya ‘njia’ kama mwendo wa maisha; mbadala hufafanua maana ya kimaadili moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya ‘ili’ yanahifadhi muundo sambamba wa makusudi mawili katika Kiebrania.
