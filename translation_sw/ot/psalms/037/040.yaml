base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/040.yaml
  text: Yahweh helps them and delivers them[a]; he delivers them from the wicked and saves them[b], because they take refuge in him.
translation:
  language: sw
  text: Yahweh huwasaidia na kuwaokoa[a]; huwaokoa kutoka kwa waovu na kuwaokoa, kwa sababu wamekimbilia kwake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwanusuru” katika sehemu zote mbili; Kiebrania kinarudia kitenzi kilekile cha kuokoa ili kusisitiza.
    reason: lexical_alternative
  - marker: b
    text: Au, “wamemtumaini”; Kiebrania husema kihalisi zaidi kwamba wamekimbilia kwake ili kupata hifadhi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa moja kwa moja kama jina binafsi, badala ya kubadilishwa kuwa cheo.
- source_word: וַיַּעְזְרֵם
  choice: huwasaidia
  rationale: Kitenzi עזר humaanisha kusaidia au kutoa msaada; hali ya mazoea inafaa kwa kauli hii ya muhtasari wa kishairi.
- source_word: וַיְפַלְּטֵם / יְפַלְּטֵם
  choice: kuwaokoa; huwaokoa
  rationale: פלט hueleza kumwokoa mtu au kumwezesha aponyoke. Marudio ya kitenzi yamehifadhiwa ili kudumisha msisitizo wa Kiebrania.
- source_word: מֵרְשָׁעִים
  choice: kutoka kwa waovu
  rationale: רְשָׁעִים ni kivumishi kilichotumika kama nomino ya wingi, yaani watu waovu, bila kutaja jinsia.
- source_word: וְיוֹשִׁיעֵם
  choice: na kuwaokoa kabisa
  rationale: Kitenzi ישׁע kina maana pana ya kuokoa. Neno 'kabisa' linasaidia kutofautisha kwa Kiswahili kitendo hiki cha mwisho na marudio ya פלט bila kuingiza wazo jipya la ushindi.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya tendo la Yahweh la kuwaokoa.
- source_word: חָסוּ בוֹ
  choice: wamekimbilia kwake
  rationale: חסה huonyesha kutafuta hifadhi au usalama kwa mtu; usemi huu unahifadhi picha ya kukimbilia mahali pa usalama kuliko neno la jumla 'kumtumaini'.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yana jina la agano la Mungu moja kwa moja; kulinakili kama Yahweh hulihifadhi kuwa jina binafsi badala ya cheo.
- issue: Kuhifadhi marudio ya kitenzi פלט
  choice: kuwaokoa; huwaokoa
  alternative: Kufupisha kuwa tendo moja la kuokoa
  rationale: Kiebrania kinarudia mzizi huo katika vishazi vinavyofuatana; marudio yana nguvu ya kishairi na msisitizo unaopaswa kuhifadhiwa.
- issue: Uhusiano wa חָסוּ בוֹ na tumaini
  choice: wamekimbilia kwake
  alternative: wamemtumaini
  rationale: Chaguo kuu linahifadhi sitiari halisi ya kutafuta hifadhi, huku maana ya kumtumaini ikitajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na marudio ya Kiebrania yamehifadhiwa, huku 'wamekimbilia kwake' ikitoa kwa lugha ya kawaida picha ya kutafuta hifadhi.
