source:
  edition: WLC
  text: כִּ֤י רְשָׁעִ֨ים יֹאבֵ֗דוּ וְ/אֹיְבֵ֣י יְ֭הוָה כִּ/יקַ֣ר כָּרִ֑ים כָּל֖וּ בֶ/עָשָׁ֣ן כָּֽלוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/020.yaml
  text: For the wicked will perish[a], and the enemies of Yahweh are like the glory of the pastures; they vanish—like smoke they vanish away.
translation:
  language: sw
  text: Kwa maana waovu wataangamia, na adui za Yahweh ni kama uzuri wa malisho[a]; wanatoweka—kama moshi wanatoweka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kufuatana na fasiri ya mapokeo: “kama mafuta ya wana-kondoo.” Kirai cha Kiebrania ni kigumu.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu au maelezo ya kauli iliyotangulia na kuhifadhi uhusiano wa kimantiki katika muktadha.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Ni neno la kawaida na linaloeleweka kwa watu wenye mwenendo mwovu katika fasihi ya hekima na Zaburi.
- source_word: יֹאבֵדוּ
  choice: wataangamia
  rationale: Linawasilisha maana ya kuharibika au kufikia mwisho, pamoja na hali ya wakati ujao.
- source_word: וְאֹיְבֵי יְהוָה
  choice: na adui za Yahweh
  rationale: Muundo huu unatafsiriwa moja kwa moja na kwa Kiswahili cha kawaida; 'adui' hapa ni nomino ya ngeli ya N-N, hivyo upatanisho ni 'za'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Linahifadhi jina binafsi la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: כִּיקַר כָּרִים
  choice: kama fahari ya malisho
  rationale: Kirai hiki kigumu kinaweza kueleweka kwa maana ya uzuri au fahari ya maeneo ya malisho, jambo linalopatana na picha ya kitu kinachotoweka upesi; tafsiri nyingine ya kale imehifadhiwa katika tanbihi.
- source_word: כָּלוּ
  choice: wanatoweka
  rationale: Kitenzi kimerudiwa katika Kiebrania kwa msisitizo; 'wanatoweka' huonyesha kufikia mwisho na kutokomea kwa lugha ya kawaida ya kishairi.
- source_word: בֶעָשָׁן
  choice: kama moshi
  rationale: Kihusishi kinaelezwa kwa ulinganisho unaofaa picha ya kishairi ya kutoweka kwa moshi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja; 'Yahweh' hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya כִּיקַר כָּרִים
  choice: kama fahari ya malisho
  alternative: kama mafuta ya wana-kondoo
  rationale: Kirai cha Kiebrania ni kigumu na kinaweza kufasiriwa kwa njia zaidi ya moja. Tafsiri kuu inafuata maana ya 'fahari/uzuri' na 'malisho,' huku tafsiri ya mapokeo ikihifadhiwa katika tanbihi ili kutoficha utata wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa kishairi wa 'wanatoweka' umehifadhiwa.
