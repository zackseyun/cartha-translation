  to: Kwa maana waovu wataangamia, na adui za Yahweh ni kama uzuri wa malisho[a]; wanatoweka—kama moshi wanatoweka.
  rationale: A single lexical adjustment improves natural modern Swahili and avoids the secondary sense of ‘fahari’ as pride or prestige. The source’s ambiguity remains explicitly preserved in the footnote, while the verse’s poetic repetition and its reference to Yahweh are retained.
