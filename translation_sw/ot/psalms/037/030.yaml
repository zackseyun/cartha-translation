  yaml_path: translation/ot/psalms/037/030.yaml
  text: The mouth of the righteous utters wisdom[b][a], and his tongue speaks justice.
translation:
  language: sw
  text: 'Kinywa cha mwenye haki hunena hekima[a],

    na ulimi wake husema yaliyo ya haki[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hutafakari hekima” au “hunong’ona hekima.” Kitenzi cha Kiebrania kinaweza kueleza kutafakari au kutamka kwa sauti ya chini; hapa huenda kinamaanisha kusema kwa sababu mstari sambamba unataja ulimi unaosema.
    reason: lexical_alternative
  - marker: b
    text: Au “hukumu.” Neno la Kiebrania linaweza kumaanisha haki, hukumu, uamuzi wa kisheria, au jambo lililo sawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: Kinywa cha
  rationale: Huhifadhi muundo wa nomino tegemezi na taswira ya kinywa kama chombo cha kusema.
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Ni tafsiri ya kawaida na ya asili ya nomino hii inayomaanisha mtu mwadilifu. Kiswahili hakilazimishi jinsia hapa, hivyo kuongeza “mwanamume” kungeingiza maana ambayo nomino ya Kiebrania haitaji waziwazi.
- source_word: יֶהְגֶּה
  choice: hunena
  rationale: Kitenzi kinaweza kumaanisha kutamka kwa sauti ya chini, kunong’ona, au kutafakari. Kwa kuwa kinywa ndicho kiima na mstari sambamba unasema ulimi “husema,” hapa kinaelekea kueleza usemi unaotamkwa. “Hunena” pia huonyesha tendo la kawaida au la mara kwa mara.
- source_word: חָכְמָה
  choice: hekima
  rationale: Ni kisawe cha kawaida cha חָכְמָה na hapa ndicho kinachotamkwa na mwenye haki.
- source_word: וּלְשׁוֹנוֹ
  choice: na ulimi wake
  rationale: Huhifadhi taswira halisi ya kiungo cha mwili na usambamba wa kishairi kati ya “kinywa” na “ulimi.”
- source_word: תְּדַבֵּר
  choice: husema
  rationale: Ni tafsiri ya moja kwa moja na ya asili katika usambamba huu wa kishairi; hali ya mazoea inaendana na muktadha.
- source_word: מִשְׁפָּט
  choice: yaliyo ya haki
  rationale: Neno linaweza kumaanisha haki, hukumu, uamuzi wa kisheria, au lililo sawa. Katika muktadha huu wa hekima, usemi huu wa Kiswahili unaeleza kwa asili mambo yaliyo sawa na ya haki bila kuufunga mstari kwenye mahakama pekee.
theological_decisions:
- issue: Umoja wa kiume katika mashairi ya hekima
  choice: mwenye haki
  alternative: mwanamume mwenye haki
  rationale: Kiebrania kina umoja wa kisarufi wa kiume wenye matumizi ya kiwakilishi. Kiswahili “mwenye haki” humrejelea mtu mmoja bila kulazimisha jinsia; kuongeza “mwanamume” kungefanya jinsia ya kiume kuwa sehemu ya maana iliyo wazi zaidi kuliko ilivyo katika chanzo.
- issue: Maana pana ya מִשְׁפָּט
  choice: yaliyo ya haki
  alternative: hukumu
  rationale: Uteuzi huu huhifadhi wazo la jambo lililo sawa na la haki katika usemi wa mwenye haki. Maana ya “hukumu” haijaondolewa bali imeonyeshwa katika tanbihi.
translation_notes:
  register: Lugha ni ya sasa, yenye heshima, na rahisi kueleweka katika Kiswahili Sanifu cha Afrika Mashariki. “Hunena” ina ladha ya kishairi bila kuwa ya kizamani kupita kiasi, huku usambamba wa “kinywa” na “ulimi” ukihifadhiwa.
