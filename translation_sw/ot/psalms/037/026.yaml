  text: All day long he is gracious and lends[a], and his offspring are a blessing.
translation:
  language: sw
  text: Siku nzima hutenda kwa fadhili na hukopesha, na wazao wake ni baraka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wazao wake wamebarikiwa.” Kiebrania husema kwa uhalisi, “wazao wake [ni] kwa baraka.”
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Mchana kutwa
  rationale: Nahau hii inaonyesha tendo la kudumu au la kawaida katika muda wote wa siku; ‘mchana kutwa’ ni Kiswahili cha kawaida kinachohifadhi nguvu ya wakati.
- source_word: חוֹנֵן
  choice: huwa mwenye neema
  rationale: Kitenzi חנן kina maana ya kumwonyesha mwingine neema au fadhili. Kauli hii inahifadhi maana hiyo pana badala ya kuifupisha kuwa ukarimu wa mali pekee.
- source_word: וּמַלְוֶה
  choice: na hukopesha
  rationale: Hifili ya לוה hapa ina maana ya kutoa mkopo, si kukopa. Kiambishi ‘hu-’ kinaonyesha tendo la kawaida kama ilivyo katika umbo la Kiebrania la kushiriki.
- source_word: וְזַרְעוֹ
  choice: na wazao wake
  rationale: זֶרַע hapa ni nomino ya mkusanyiko inayoweza kumaanisha watoto au uzao. ‘Wazao wake’ ni ya asili na pana kuliko ‘watoto wake,’ na huepuka tafsiri halisi isiyoeleweka ya ‘mbegu yake.’
- source_word: לִבְרָכָה
  choice: ni baraka
  rationale: Kirai hiki kwa uhalisi ni ‘kwa ajili ya baraka’ au ‘kuwa baraka.’ ‘Ni baraka’ huwasilisha kwa Kiswahili cha kawaida wazo kwamba wazao wenyewe ni baraka, huku tanbihi ikihifadhi uwezekano mwingine.
theological_decisions:
- issue: Maana ya kifungu cha mwisho לִבְרָכָה
  choice: wazao wake ni baraka
  alternative: wazao wake wamebarikiwa
  rationale: Kihusishi ל pamoja na בְּרָכָה kwa kawaida huonyesha kusudi, tokeo, au hali ya kuwa ‘baraka.’ Hivyo tafsiri kuu inawaonyesha wazao kuwa baraka; hata hivyo, muundo mfupi wa Kiebrania unaweza kueleweka pia kwamba wamebarikiwa, kwa hiyo uwezekano huo umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Mchana kutwa’ huonyesha mwendelezo; ‘huwa mwenye neema’ huhifadhi maana ya msingi ya חנן, ingawa ni rasmi kidogo. Alama ya tanbihi [a] imewekwa baada ya kifungu kinachohusika.
