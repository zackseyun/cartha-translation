base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/036.yaml
  text: But he passed by[a], and behold, he was no more; I sought him, but he could not be found.
translation:
  language: sw
  text: Lakini akapita[a], na tazama, hakuwapo tena; nilimtafuta, lakini hakupatikana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaondoka.” Kitenzi cha Kiebrania kinaweza kumaanisha kupita au kuondoka; hapa kinaeleza kutoweka kwa mtu mwovu machoni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: akapita
  rationale: Kitenzi עבר kwa msingi humaanisha ‘kupita’ au ‘kupita kando.’ Katika muktadha huu kinaeleza kutoweka kwa mtu mwovu; ‘akapita’ huhifadhi maana ya msingi bila kuamua wazi kwamba alikufa.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Neno הִנֵּה huvuta uangalifu kwenye hali ya kushangaza inayofuata. ‘Na tazama’ huhifadhi msisitizo na mtindo wa kishairi.
- source_word: אֵינֶנּוּ
  choice: hakuwapo tena
  rationale: Kauli hii ya Kiebrania huonyesha kutokuwapo au kutoweka. ‘Hakuwapo tena’ ni ya kawaida katika Kiswahili na haimaanishi moja kwa moja kuangamizwa kabisa.
- source_word: וָאֲבַקְשֵׁהוּ
  choice: nilimtafuta
  rationale: Kitenzi בקשׁ hapa humaanisha kumtafuta mtu. Tafsiri hii ni wazi, fupi, na ya kawaida katika Kiswahili cha sasa.
- source_word: וְלֹא נִמְצָא
  choice: lakini hakupatikana
  rationale: Nifali ya מצא ina maana ya ‘kupatikana.’ ‘Lakini’ huwasilisha kwa kawaida tofauti iliyopo kati ya kumtafuta na kutompata.
theological_decisions:
- issue: Je, kupita kwa mtu mwovu kunamaanisha kifo moja kwa moja?
  choice: akapita
  alternative: akatoweka / akafa
  rationale: Kiebrania kinaweza kueleza kupita au kuondoka na muktadha unaonyesha kutoweka kwake, lakini hakitaji kifo waziwazi. Tafsiri kuu kwa hiyo inahifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wa heshima lakini unaoeleweka kwa msomaji wa kawaida. ‘Na tazama’ limetumiwa kuhifadhi nguvu ya ghafla ya הִנֵּה.
