  text: וַ/עֲנָוִ֥ים יִֽירְשׁוּ אָ֑רֶץ וְ֝/הִתְעַנְּג֗וּ עַל רֹ֥ב שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/011.yaml
  text: But the humble will inherit the land and delight themselves in abundant peace[a][b].
translation:
  language: sw
  text: Lakini wanyenyekevu[a] watairithi nchi[b], nao watafurahia amani tele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wapole.”
    reason: lexical_alternative
  - marker: b
    text: Au, “dunia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָוִים
  choice: wanyenyekevu
  rationale: Neno hili linamaanisha watu walio wanyonge au wanyenyekevu. “Wanyenyekevu” ni Kiswahili cha sasa kinachoeleweka vizuri na kinadumisha maana ya kimaadili katika zaburi hii; “wapole” ni tafsiri nyingine halali na imehifadhiwa katika tanbihi.
- source_word: יִירְשׁוּ
  choice: watairithi
  rationale: Kitenzi hiki kinaweza kumaanisha kurithi au kumiliki. “Watairithi” kinadumisha hali ya wakati ujao pamoja na mwangwi wa agano.
- source_word: אָרֶץ
  choice: nchi
  rationale: Katika muktadha wa Zaburi 37, marejeo ya kurithi na kuondolewa kutoka katika nchi yanaunga mkono “nchi.” Maana pana ya “dunia” bado inawezekana, kwa hiyo imewekwa katika tanbihi.
- source_word: וְהִתְעַנְּגוּ
  choice: nao watafurahia
  rationale: Umbo la Kiebrania linaonyesha kujifurahisha au kupata furaha kubwa. “Watafurahia” ni Kiswahili cha asili na cha heshima, bila kuleta maana isiyokusudiwa ya kujiburudisha.
- source_word: עַל
  choice: —
  rationale: Uhusiano unaoonyeshwa na kihusishi cha Kiebrania umeelezwa kiasili katika Kiswahili kwa kitenzi “watafurahia” kikifuatiwa moja kwa moja na kitu chake.
- source_word: רֹב
  choice: tele
  rationale: Neno hili huonyesha wingi au utele. “Tele” linaeleza kwa ufupi na kwa kawaida wingi wa amani.
- source_word: שָׁלוֹם
  choice: amani
  rationale: “Amani” ndiyo tafsiri ya kawaida na inafaa kwa muktadha wa usalama na ustawi, ingawa neno la Kiebrania linaweza pia kujumuisha hali njema na ukamilifu.
theological_decisions:
- issue: Mwangwi wa Mathayo 5:5 na tafsiri ya jadi kwamba wapole watairithi dunia
  choice: Kutafsiri Kiebrania moja kwa moja kama “wanyenyekevu watairithi nchi,” huku “wapole” na “dunia” zikihifadhiwa kama tafsiri mbadala katika tanbihi.
  alternative: wapole watairithi dunia
  rationale: Chaguo kuu linafuata muktadha wa Zaburi na maana za Kiebrania bila kulazimisha maneno yaliyozoeleka kutokana na mapokeo ya baadaye. Hata hivyo, tafsiri mbadala ni halali kileksika na muhimu katika mwangwi wa kimaandiko, hivyo hazijaondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Lakini” linaendeleza utofautishaji wa muktadha; “amani tele” ni usemi wa kawaida unaodumisha wazo la רֹב שָׁלוֹם, yaani amani nyingi na hali ya ustawi.
