  yaml_path: translation/ot/psalms/037/019.yaml
  text: They will not be put to shame in a time of trouble[c][b][a], and in days of famine they will be satisfied.
translation:
  language: sw
  text: Hawataaibishwa[a] wakati wa taabu,[b] na katika siku za njaa watashiba.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawataaibika.” Kitenzi cha Kiebrania kinaweza kumaanisha kupata aibu au kuaibishwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “wakati wa msiba” au “wakati wa ubaya.” Hapa neno linaloweza kutafsiriwa “ubaya” linamaanisha hali mbaya, si uovu wa kimaadili.
    reason: lexical_alternative
  - marker: c
    text: Au, “watapata chakula cha kuwatosha.” Neno la Kiebrania linamaanisha kushiba au kuwa na cha kutosha.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: hawataaibishwa
  rationale: Kitenzi בושׁ kinaweza kumaanisha kupata aibu au kuaibishwa kwa kuvunjika kwa matarajio. Kauli hii inalinda maana ya matokeo ya fedheha huku ikibaki ya kawaida katika Kiswahili.
- source_word: בְּעֵת רָעָה
  choice: wakati wa taabu
  rationale: Katika muktadha huu רָעָה ni hali mbaya au shida, si uovu wa kimaadili. ‘Wakati wa taabu’ ni usemi wa asili na mpana.
- source_word: וּבִימֵי רְעָבוֹן
  choice: na katika siku za njaa
  rationale: Muundo huu unaonyesha kipindi cha njaa kali au upungufu mkubwa wa chakula; ‘siku za njaa’ ni tafsiri wazi na ya kawaida.
- source_word: יִשְׂבָּעוּ
  choice: watashiba
  rationale: Kitenzi שׂבע humaanisha kushiba au kupata cha kutosha. ‘Watashiba’ hudumisha taswira ya chakula inayolingana moja kwa moja na njaa.
