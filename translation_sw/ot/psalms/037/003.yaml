  text: Trust in Yahweh and do good[a]; dwell in the land and cultivate faithfulness.
translation:
  language: sw
  text: Mtumaini Yahwe na utende mema; kaa katika nchi na usitawishe uaminifu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jilishe kwa uaminifu”; vinginevyo, “ufurahie usalama.” Usemi wa Kiebrania ni mgumu na huenda ukadokeza taswira ya kula malishoni, au ya kulisha/kuchunga, pamoja na uaminifu au kutegemeka.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטַח
  choice: Mtumaini
  rationale: Kitenzi hiki cha amri humhimiza mtu aweke tumaini lake kwa mwingine; “mtumaini” ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: בַּיהוָה
  choice: Yahwe
  rationale: Kihusishi בְּ humtaja anayelengwa na tumaini, na jina la agano יהוה limetoholewa kuwa “Yahwe.”
- source_word: וַעֲשֵׂה טוֹב
  choice: na utende mema
  rationale: Huhifadhi amri fupi ya kufanya yaliyo mema kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: שְׁכָן אֶרֶץ
  choice: kaa katika nchi
  rationale: שׁכן humaanisha kukaa au kuishi mahali; “nchi” inafaa kuliko “dunia” katika muktadha wa zaburi hii, ambamo kukaa kwa uthabiti katika nchi ni wazo linalojirudia.
- source_word: וּרְעֵה
  choice: na usitawishe
  rationale: רעה kwa kawaida huhusu kulisha, kuchunga, au kula malishoni. Ikiwa na nomino dhahania אֱמוּנָה, “usitawishe” huwasilisha shughuli endelevu ya kuendeleza uaminifu bila kuuficha ugumu wa sitiari, ambao umeelezwa katika tanbihi.
- source_word: אֱמוּנָה
  choice: uaminifu
  rationale: אֱמוּנָה inaweza kumaanisha uthabiti, uaminifu, kutegemeka, au usalama. “Uaminifu” inalingana vizuri na mfululizo wa mawaidha ya kimaadili katika mstari huu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: “Yahwe” hulitambulisha wazi jina la agano lililo katika Kiebrania bila kulibadilisha kuwa cheo.
- issue: Maana ya וּרְעֵה אֱמוּנָה
  choice: usitawishe uaminifu
  alternative: jilishe kwa uaminifu; au uishi kwa usalama
  rationale: Usemi wa Kiebrania ni mgumu na una maana zinazowezekana zaidi ya moja. Tafsiri kuu hudumisha nguvu ya amri na wazo la kuendeleza uaminifu, huku tanbihi ikihifadhi taswira halisi ya malisho na uwezekano wa maana ya usalama.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi wa amri umehifadhiwa. “Usitawishe uaminifu” ni wa kimawasiliano zaidi kuliko tafsiri sisisi, lakini tanbihi inalinda sitiari na utata halisi wa Kiebrania.
