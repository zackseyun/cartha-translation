  text: צוֹפֶ֣ה רָ֭שָׁע לַ/צַּדִּ֑יק וּ֝/מְבַקֵּ֗שׁ לַ/הֲמִית/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/032.yaml
  text: The wicked watches the righteous and seeks to put him to death[a][b].
translation:
  language: sw
  text: Mwovu humtazama mwenye haki, na hutafuta kumuua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “humvizia mwenye haki.” Kitenzi cha Kiebrania kinaweza kumaanisha kutazama kwa nia ya kudhuru katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: צוֹפֶה
  choice: humvizia
  rationale: Kitenzi צפה kimsingi humaanisha kutazama au kuangalia; katika muktadha huu wa uhasama, ‘humvizia’ huwasilisha kutazama kwa nia ya kumdhuru, kwa Kiswahili cha kawaida na cha kishairi.
- source_word: רָשָׁע
  choice: mwovu
  rationale: Nomino ya kiwakilishi katika umoja inaeleza mtu mwovu kama mhusika wa kawaida; ‘mwovu’ huhifadhi umoja na mkabala wa kimaadili wa zaburi.
- source_word: לַצַּדִּיק
  choice: mwenye haki
  rationale: ‘Mwenye haki’ ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya mtu anayeonekana kuwa mwadilifu katika mkabala wa kimaadili wa zaburi.
- source_word: וּמְבַקֵּשׁ
  choice: na hutafuta
  rationale: בקש humaanisha kutafuta; hapa inaonyesha azma ya mwovu ya kusababisha kifo cha mwenye haki.
- source_word: לַהֲמִיתוֹ
  choice: kumuua
  rationale: Hiphil ya מות ina maana ya kusababisha afe. ‘Kumuua’ ni tafsiri ya moja kwa moja na ya asili katika Kiswahili; mbadala ‘kumfisha’ huhifadhi wazi zaidi muundo wa kisababishi lakini si wa kawaida sana.
- source_word: וּ
  choice: na
  rationale: 'Kiunganishi hiki kinaunganisha matendo mawili yanayoendelea: kuvizia na kutafuta kumuua.'
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa umoja wa Kiebrania umehifadhiwa. ‘Humvizia’ huonyesha uhasama unaodokezwa na muktadha, huku tanbihi ikihifadhi namna mbadala ya kueleza nguvu ya kisababishi katika לַהֲמִיתוֹ.
