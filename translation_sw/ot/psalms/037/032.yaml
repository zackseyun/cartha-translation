review_pass:
  verdict: revise
  source_fidelity: The verse correctly preserves the singular representative figures, the hostile surveillance of the wicked, and the purpose of killing the righteous. “Humvizia” is a defensible contextual rendering of צוֹפֶה, though it is stronger than the verb’s basic sense of watching and should be presented as an alternative rather than made the sole rendering.
  naturalness: “Mwovu humtazama mwenye haki, na hutafuta kumuua” is natural, clear Standard East African Swahili. The habitual forms suitably express the Hebrew participles.
  terminology: “Mwovu,” “mwenye haki,” and “kumuua” are appropriate, established terms. “Kumfisha” is grammatically possible but comparatively unnatural here and does not provide a useful alternative to the idiomatic “kumuua.”
  issues:
  - severity: low
    issue: The main rendering “humvizia” narrows the basic sense of צוֹפֶה (“watches/keeps watch on”) to lying in wait.
    rationale: The hostile context supports this nuance, but the Hebrew verb itself retains the broader watching sense. Rendering the base sense in the text and placing “humvizia” in a note better preserves both fidelity and the contextual alternative.
  - severity: low
    issue: The footnote offers “kumfisha” as an alternative for “kumuua.”
    rationale: Although it can reflect the causative form historically, it is less idiomatic in modern Swahili and adds no needed semantic distinction. A note on the hostile nuance of the first verb is more useful.
  revised_text: Mwovu humtazama mwenye haki, na hutafuta kumuua.[a]
