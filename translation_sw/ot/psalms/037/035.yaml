  yaml_path: translation/ot/psalms/037/035.yaml
  text: I have seen a wicked[a], ruthless man spreading himself out like a flourishing native tree.
translation:
  language: sw
  text: Nimemwona mtu mwovu na mkatili akijitanua kama mti wa asili unaositawi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nilimwona mtu mwovu, mwenye kutisha, akijitanua kama mti wa asili uliochanuka.” Usemi wa Kiebrania ni mgumu; “mti wa asili” huweka wazi taswira inayowezekana ya mti unaostawi katika udongo wake mwenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: Nimemwona
  rationale: Kauli timilifu ya nafsi ya kwanza umoja; wakati timilifu wa Kiswahili unafaa ushuhuda wa kutafakari wenye umuhimu wa sasa, ingawa ‘Nilimwona’ pia inawezekana.
- source_word: רָשָׁע
  choice: mtu mwovu
  rationale: Nomino kivumishi humaanisha mtu mwenye uovu wa kimaadili; kuongeza ‘mtu’ hufanya Kiswahili kiwe wazi na cha kawaida.
- source_word: עָרִיץ
  choice: mkatili
  rationale: Neno humweleza mtu mwenye nguvu anayeonea na kutisha wengine; ‘mkatili’ huwasilisha ukali wa kimaadili na kijamii bila kulifanya limaanishe vurugu za kimwili pekee.
- source_word: וּמִתְעָרֶה
  choice: akijitanua
  rationale: Umbo la Hitpael lina maana ya kujieneza au kustawi kwa upana; ‘akijitanua’ huhifadhi hali ya kujirejelea na taswira ya kujipanua katika mafanikio.
- source_word: כְּאֶזְרָח
  choice: kama mti wa asili
  rationale: אֶזְרָח kwa kawaida ni ‘mzawa’ au ‘wa asili.’ Katika tashbihi hii ya kishairi, mti unaodokezwa umewekwa wazi ili picha ieleweke kwa Kiswahili.
- source_word: רַעֲנָן
  choice: unaositawi
  rationale: Hueleza ubichi, uchanukaji na nguvu nyingi za uhai; ‘unaositawi’ huleta maana ya ukuaji wenye mafanikio huku ikidumisha taswira ya mti.
