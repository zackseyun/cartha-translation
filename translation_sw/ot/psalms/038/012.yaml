source:
  edition: WLC
  text: וַ/יְנַקְשׁ֤וּ מְבַקְשֵׁ֬י נַפְשִׁ֗/י וְ/דֹרְשֵׁ֣י רָ֭עָתִ/י דִּבְּר֣וּ הַוּ֑וֹת וּ֝/מִרְמ֗וֹת כָּל הַ/יּ֥וֹם יֶהְגּֽוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/012.yaml
  text: Those who seek my life set traps[a], and those who seek my harm speak destruction[d][c][b]; all day long they mutter deceit.
translation:
  language: sw
  text: Wanaoutafuta uhai wangu hutega mitego[a]; wanaotafuta kunidhuru hunena maneno ya maangamizi[b]; mchana kutwa hunong’ona udanganyifu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hutega tanzi.” Kitenzi cha Kiebrania kina taswira ya kunasa kwa mtego au tanzi.
    reason: lexical_alternative
  - marker: b
    text: Au, “hunena uharibifu” au “hutamka mambo yenye kuleta maangamizi.”
    reason: lexical_alternative
  - marker: c
    text: Kitenzi hiki pia kinaweza kumaanisha “hunung’unika” au “hutafakari.” Hapa kinahusu kusema udanganyifu daima kwa sauti ya chini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַקְשׁוּ
  choice: hutega mitego
  rationale: Kitenzi נקשׁ kina taswira ya kutega tanzi au mtego. Usemi huu ni wa kawaida katika Kiswahili na unahifadhi wazo la kuvizia kwa nia mbaya.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: wanaoutafuta uhai wangu
  rationale: Katika muktadha huu wa uhasama, נפשׁ pamoja na kitenzi 'kutafuta' humaanisha kuutafuta uhai wa mtu ili kumwua, si kutafuta nafsi yake kwa maana ya ndani.
- source_word: וְדֹרְשֵׁי רָעָתִי
  choice: wanaotafuta kunidhuru
  rationale: Kirai hiki kinaeleza watu wanaotamani na kufuatilia madhara ya msemaji. 'Kutafuta kunidhuru' ni Kiswahili cha asili na kinahifadhi uovu unaoelekezwa kwake binafsi.
- source_word: דִּבְּרוּ הַוּוֹת
  choice: hunena maneno ya maangamizi
  rationale: הַוּוֹת inaweza kumaanisha maangamizi, uharibifu, au mambo yenye kuleta janga. 'Maneno ya maangamizi' huhifadhi nguvu ya usemi huo bila kuufanya moja kwa moja kuwa 'hupanga njama.'
- source_word: וּמִרְמוֹת
  choice: udanganyifu
  rationale: מִרְמוֹת hurejelea udanganyifu au hila. Nomino ya jumla 'udanganyifu' inasomeka kwa kawaida na inafaa kama jambo linalonong’onwa.
- source_word: כָּל הַיּוֹם
  choice: mchana kutwa
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha tendo linaloendelea siku nzima.
- source_word: יֶהְגּוּ
  choice: hunong’ona
  rationale: הגה inaweza kumaanisha kunong’ona, kunung’unika, kutafakari, au kutamka kwa sauti ya chini. Pamoja na 'udanganyifu,' 'hunong’ona' huhifadhi wazo la usemi wa chini unaoendelea bila kuongeza moja kwa moja dhana ya kupanga njama.
