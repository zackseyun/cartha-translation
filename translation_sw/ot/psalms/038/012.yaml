  source_fidelity: 'Tafsiri inafuata vizuri muundo na maana ya Kiebrania: watu wanautafuta uhai wa msemaji hutega mitego; wanaotafuta madhara yake husema mambo ya kuharibu; na siku nzima hutamka udanganyifu kwa sauti ya chini. Taswira ya mtego, tishio dhidi ya uhai, madhara binafsi, usemi wa maangamizi, na kuendelea kwa tendo zimehifadhiwa.'
