  terminology: “Uhai wangu” hutoa kwa usahihi nahau ya Kiebrania inayomaanisha maisha katika muktadha wa tishio la kuuawa. “Maangamizi” na “udanganyifu” zinaendana na הַוּוֹת na מִרְמוֹת bila kuingiza tafsiri ya kimadhehebu au dhana ya ziada. Tanzi/mtego katika tanbihi inaonyesha ipasavyo taswira ya נקשׁ.
