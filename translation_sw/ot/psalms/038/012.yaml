  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. 'Uhai wangu' huwasilisha nahau ya Kiebrania kwa uwazi; 'hunena' hudumisha uzito wa zaburi, huku 'mchana kutwa' na 'hutega mitego' zikiwa za asili katika matumizi ya sasa.
