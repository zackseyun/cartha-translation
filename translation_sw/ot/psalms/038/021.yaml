base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/021.yaml
  text: Do not forsake me[a], O Yahweh my God; do not be far from me.
translation:
  language: sw
  text: Usiniache, Ee Yahwe, Mungu wangu; usiwe mbali nami.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל
  choice: usi-
  rationale: Kihasi אַל pamoja na kitenzi cha ombi huwasilisha dua ya moja kwa moja; kiambishi cha kukataza “usi-” ni cha kawaida na hakiongezi mkazo.
- source_word: תַּעַזְבֵנִי
  choice: usiniache
  rationale: Kitenzi עזב kina maana ya kuacha au kutupa. “Usiniache” ni Kiswahili cha sasa, cha kawaida, na katika muktadha wa maombolezo kinabeba ombi la kutoachwa bila kuongeza tafsiri isiyomo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA,” ili kuhifadhi jina la pekee lililo katika Kiebrania.
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Nomino אֱלוֹהַּ yenye kiambishi cha nafsi ya kwanza umoja humaanisha moja kwa moja “Mungu wangu.”
- source_word: תִּרְחַק
  choice: usiwe mbali
  rationale: Mzizi רחק humaanisha kuwa mbali au kwenda mbali. “Usiwe mbali” huhifadhi hali iliyo wazi katika Kiebrania bila kuifanya kwa lazima kuwa tendo la kujitenga kimakusudi.
- source_word: מִמֶּנִּי
  choice: nami
  rationale: מִן pamoja na kiambishi cha nafsi ya kwanza humaanisha “kutoka kwangu”; katika muundo wa Kiswahili “kuwa mbali nami” ni wa kawaida na hutoa uhusiano huo kwa usahihi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina la pekee יהוה. “Yahwe” huhifadhi jina hilo kwa umbo linalotumika kwa kawaida katika Kiswahili, bila kulibadilisha kuwa cheo au kufuata umbo la baadaye “Yehova.”
translation_notes:
  register: Lugha ni ya sala ya moja kwa moja, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Ee” hudumisha mwito wa kishairi wa zaburi; urudiaji wa “usi-” huhifadhi usambamba wa mistari miwili ya Kiebrania.
