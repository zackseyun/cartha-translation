  text: אֲֽדֹנָ/י נֶגְדְּ/ךָ֥ כָל תַּאֲוָתִ֑/י וְ֝/אַנְחָתִ֗/י מִמְּ/ךָ֥ לֹא נִסְתָּֽרָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/009.yaml
  text: Lord[a], all my desire is before you[b], and my groaning is not hidden from you.
translation:
  language: sw
  text: 'Ee Bwana, hamu yangu yote iko mbele zako,

    na kuugua kwangu hakujafichika kwako.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Ni cheo cha Mungu kinachotumiwa hapa kama mwito wa moja kwa moja. “Bwana” hutofautisha אֲדֹנָי na jina la Mungu יהוה.
- source_word: נֶגְדְּךָ
  choice: mbele zako
  rationale: Usemi huu wa kawaida unaonyesha kwamba hamu ya mtunga zaburi iko wazi katika uwepo na uoni wa Mungu.
- source_word: כָל תַּאֲוָתִי
  choice: hamu yangu yote
  rationale: “Hamu” huonyesha shauku kubwa katika muktadha wa maombolezo bila maana hasi ambayo “tamaa” inaweza kuwa nayo; “yote” huhifadhi wazo la ujumla wa כָל.
- source_word: וְאַנְחָתִי
  choice: na kuugua kwangu
  rationale: “Kuugua” huwasilisha sauti au hisia nzito ya mtu anayeteseka, inayofaa muktadha wa zaburi hii ya maombolezo.
- source_word: מִמְּךָ לֹא נִסְתָּרָה
  choice: hakujafichika kwako
  rationale: Kauli hii inadumisha hali ya kutofichwa mbele za Mungu na inaeleweka kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Mwito wa Mungu kwa אֲדֹנָי badala ya jina יהוה
  choice: Bwana
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana אֲדֹנָי, si יהוה; kwa hiyo tafsiri haitumii namna maalumu inayotengwa kwa jina la Mungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Muundo wa kishairi umehifadhiwa katika mistari miwili; “Ee” hufanya mwito wa moja kwa moja usikike kwa kawaida.
