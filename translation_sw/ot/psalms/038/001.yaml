base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/001.yaml
  text: O Yahweh[a], do not rebuke me in your anger[c][b], nor discipline me in your wrath.
translation:
  language: sw
  text: Ee Yahwe, usinikemee katika hasira yako, wala usiniadhibu katika ghadhabu yako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa uhamishaji-sauti kama “Yahwe”; kihisishi “Ee” kinaonyesha mwito wa moja kwa moja katika sala.
- source_word: אַל
  choice: usi- ... wala usi-
  rationale: Kikanushi hiki kinaanzisha ombi la kukataza; Kiswahili cha sasa hutumia kiambishi “usi-”, huku “wala” kikiendeleza ukanushi katika mstari wa pili.
- source_word: בְּקֶצְפְּךָ
  choice: katika hasira yako
  rationale: קֶצֶף humaanisha hasira au ukali wa kutoridhika; “katika hasira yako” huhifadhi kihusishi na ni usemi wa kawaida wa Kiswahili.
- source_word: תוֹכִיחֵנִי
  choice: usinikemee
  rationale: Hifili ya יכח hapa ina maana ya kukemea au kusahihisha kwa lawama; “kukemea” hutofautishwa vizuri na kitendo cha kuadhibu katika kipande kinachofuata.
- source_word: וּבַחֲמָתְךָ
  choice: wala ... katika ghadhabu yako
  rationale: חֵמָה ni hasira kali au ghadhabu. Kiunganishi ו kimetafsiriwa “wala” ili kuendeleza ombi hasi kwa Kiswahili cha kawaida.
- source_word: תְיַסְּרֵנִי
  choice: usiniadhibu
  rationale: Pieli ya יסר hueleza kuadibu au kutoa nidhamu ya kurekebisha. “Usiniadhibu” ni ya asili na inaeleweka kwa wasomaji wa sasa, bila kufuta wazo la marekebisho.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina maalumu la Mungu, si cheo. “Yahwe” huhifadhi jina hilo kwa namna inayotambulika katika Kiswahili.
- issue: Upeo wa ukanushi katika maombi haya
  choice: Usinikemee katika hasira yako, wala usiniadhibu katika ghadhabu yako
  alternative: Usinikemee wala kuni adhibu kabisa
  rationale: Muundo wa Kiebrania unaweza kueleweka kama ombi dhidi ya kukemewa na kuadhibiwa katika hasira na ghadhabu, si lazima ombi la kuepushwa na marekebisho yote. Tafsiri imehifadhi uhusiano huo bila kuamua zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Usambamba wa vipande viwili umehifadhiwa kwa “katika hasira yako” na “katika ghadhabu yako.”
