  text: And my enemies are alive and strong[a], and those who hate me falsely are many.
translation:
  language: sw
  text: Adui zangu wako hai na wenye nguvu, nao wanaonichukia kwa uongo[a] ni wengi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bila sababu.” Neno la Kiebrania שָׁקֶר kwa maana halisi ni “uongo” au “udanganyifu,” na linaweza kueleza ama kwamba chuki yao ni ya uongo ama kwamba haina msingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  choice: adui zangu
  rationale: Nomino hii humaanisha maadui au wapinzani binafsi; “adui zangu” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: חַיִּים
  choice: wako hai
  rationale: Kivumishi hiki kinawaelezea maadui kuwa hai, huenda kwa kulinganisha hali yao na udhaifu wa mtunga zaburi; “wako hai” ni usemi wa asili katika Kiswahili.
- source_word: עָצֵמוּ
  choice: wana nguvu
  rationale: Kitenzi kina wazo la kuwa au kuongezeka nguvu; “wana nguvu” huwasilisha hali yao ya sasa kwa uwazi.
- source_word: רַבּוּ
  choice: ni wengi
  rationale: Kitenzi humaanisha kuwa wengi au kuongezeka kwa idadi; “ni wengi” ni kifupi na cha kawaida, kikihifadhi malalamiko kuhusu wingi wao.
- source_word: שֹׂנְאַי
  choice: wanaonichukia
  rationale: Umbo la kitenzi linatumiwa kama nomino; “wanaonichukia” huhifadhi vizuri nguvu ya tendo kuliko kurudia “adui.”
- source_word: שָׁקֶר
  choice: kwa uongo
  rationale: Nomino hii, yenye maana ya “uongo/udanganyifu,” imetumiwa kwa namna ya kielezi. “Kwa uongo” huhifadhi taswira ya Kiebrania na kutokuamuliwa kama chuki yao ni ya udanganyifu au haina msingi.
