translation:
  language: sw
  text: 'Lakini mimi ni kama kiziwi, sisikii;

    na kama bubu—hafungui kinywa chake.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinabadilika kutoka nafsi ya kwanza, “sisikii,” hadi nafsi ya tatu, “hafungui kinywa chake,” ikiendelea kumweleza bubu katika tashbihi. Pia inaweza kutafsiriwa kwa kulainisha badiliko hilo: “na kama bubu, sifungui kinywa changu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Lakini mimi
  rationale: Kiunganishi pamoja na kiwakilishi kinaonyesha tofauti kati ya mtunga zaburi na wanaomsema katika muktadha; “Lakini mimi” huonyesha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: כְחֵרֵשׁ
  choice: kama kiziwi
  rationale: Kiambishi כְּ kinaonyesha ulinganisho, na חֵרֵשׁ humaanisha mtu asiyeweza kusikia. “Kama kiziwi” huhifadhi tashbihi ya umoja kwa lugha fupi na ya kawaida.
- source_word: לֹא אֶשְׁמָע
  choice: sisikii
  rationale: Kitenzi שׁמע hapa kina maana ya “kusikia.” Tafsiri hii huhifadhi taswira ya hisi bila kuongeza moja kwa moja wazo la kutotii au kutosikiliza.
- source_word: וּכְאִלֵּם
  choice: na kama bubu
  rationale: אִלֵּם humaanisha mtu asiyeweza kusema. “Bubu” ni neno la kawaida la Kiswahili linalodumisha ulinganifu na “kiziwi.”
- source_word: לֹא יִפְתַּח פִּיו
  choice: hafungui kinywa chake
  rationale: Kiebrania kina kitenzi cha nafsi ya tatu na kiambishi cha umilikaji cha nafsi ya tatu, yaani, “hafungui kinywa chake.” Tafsiri inadumisha nahau pamoja na badiliko hilo la nafsi.
