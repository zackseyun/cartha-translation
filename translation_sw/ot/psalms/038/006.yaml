lexical_decisions:
- source_word: נַעֲוֵיתִי
  choice: Nimepinda
  rationale: Kitenzi עוה kina maana ya kupinda, kupotoka, au kuwa kombo. “Nimepinda” huhifadhi picha ya hali ya kimwili na kihisia bila kufafanua chanzo kupita kiasi.
- source_word: שַׁחֹתִי
  choice: kuinama chini
  rationale: Kitenzi שחח humaanisha kuinama au kuwa chini. Muundo huu unaendeleza na kusisitiza picha iliyo katika “nimepinda.”
- source_word: עַד מְאֹד
  choice: sana
  rationale: Kirai hiki ni cha kusisitiza kiwango kikubwa; “sana” ni cha kawaida na huunganika vizuri na “kuinama chini.”
- source_word: כָּל הַיּוֹם
  choice: kutwa nzima
  rationale: Ni usemi wa Kiswahili wa kawaida unaoonyesha muda wote wa siku.
- source_word: קֹדֵר
  choice: nikiwa na huzuni
  rationale: Kivumishi hiki cha kitenzi kutoka קדר kinaweza kuonyesha kuwa katika giza, kuwa na huzuni, au kuomboleza. Katika ombolezo hili, “nikiwa na huzuni” ni ya asili na inaeleweka, huku picha mbadala zikihifadhiwa katika tanbihi.
- source_word: הִלָּכְתִּי
  choice: natembea
  rationale: הלך hapa huonyesha kwenda au kutembea katika hali fulani. Wakati uliopo unafaa kwa maelezo hai ya hali ya mwombolezaji katika muktadha huu.
