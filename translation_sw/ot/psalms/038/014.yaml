  text: And I became like a man who does not hear[a], and in whose mouth there are no reproofs.
translation:
  language: sw
  text: Nikawa kama mtu asiyesikia, asiye na majibu ya kupinga kinywani mwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hoja,” “makemeo,” au “majibu.” Neno la Kiebrania linaweza kumaanisha makemeo ya maneno au majibu ya kupinga madai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: Nikawa
  rationale: Kitenzi hiki cha nafsi ya kwanza kinaendeleza kauli kwa maana ya ‘nikawa’ au ‘nilikuwa’; ‘nikawa’ kinadumisha wazo la kujifananisha linalofuata.
- source_word: כְּאִישׁ
  choice: kama mtu
  rationale: אִישׁ ni nomino ya umoja inayomaanisha mtu au mwanamume. Katika tashbihi hii ya kiujumla, ‘mtu’ ni Kiswahili cha kawaida na cha asili bila kubadili umoja wa kirai.
- source_word: אֲשֶׁר לֹא שֹׁמֵעַ
  choice: asiyesikia
  rationale: שׁמע inaweza kumaanisha kusikia au kusikiliza. ‘Asiyesikia’ ndiyo tafsiri ya moja kwa moja, nayo haiongezi wazo la kutoweza kusikia ambalo halijaelezwa wazi.
- source_word: וְאֵין בְּפִיו
  choice: ambaye kinywani mwake hamna
  rationale: Tafsiri hii inadumisha kishazi cha uwepo אֵין, kiunganishi chake, na taswira halisi ya maneno kuwa kinywani.
- source_word: תּוֹכָחוֹת
  choice: majibu ya kupinga
  rationale: Neno hili linaweza kumaanisha makaripio, hoja, au majibu ya kupinga. Katika muktadha wa kukaa kimya mbele ya wanaomshtaki, ‘majibu ya kupinga’ yanaonyesha kwa kawaida kauli za kujibu madai bila kulifungia neno katika maana moja pekee.
