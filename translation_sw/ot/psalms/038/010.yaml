  text: My heart throbs[a]; my strength has left me[b], and the light of my eyes—even they are not with me.
translation:
  language: sw
  text: Moyo wangu unadunda; nguvu zangu zimeniacha, na nuru ya macho yangu[a]—hata hiyo haiko nami.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uwezo wa macho yangu kuona”; usemi wa Kiebrania unaweza kumaanisha uwezo wa kuona au uangavu na uhai unaoonekana machoni.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina kiwakilishi cha wingi, kihalisi “hata hayo,” ambacho huenda kinarejelea “macho.” Tafsiri “hiyo” inapatana na nomino “nuru” katika Kiswahili.
    reason: source_form
lexical_decisions:
- source_word: לִבִּי
  choice: moyo wangu
  rationale: Katika muktadha wa dhiki ya mwili, לֵב inaonyesha moyo kama kitovu cha uhai na hali ya ndani; “moyo wangu” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: סְחַרְחַר
  choice: unadunda
  rationale: Neno hili linaonyesha kuzunguka au msukosuko. Hapa, likihusishwa na moyo na kudhoofika kwa mwili, linaeleweka kwa kawaida kuwa mapigo ya moyo yaliyosumbuka; “unadunda” ni Kiswahili cha asili kisichoongeza utambuzi wa kitabibu.
- source_word: עֲזָבַנִי כֹחִי
  choice: nguvu zangu zimeniacha
  rationale: עָזַב humaanisha kuacha, na כֹּחַ hapa ni nguvu au uhai wa mwili. Kiswahili hutumia “nguvu” kwa umbo la wingi, hivyo upatanisho wa “zimeniacha” ni wa kawaida.
- source_word: וְאוֹר עֵינַי
  choice: na nuru ya macho yangu
  rationale: Tafsiri hii inadumisha taswira ya kishairi ya Kiebrania na kuacha wazi ikiwa “nuru” ni uwezo wa kuona au uangavu na uhai unaoonekana machoni.
- source_word: גַּם הֵם אֵין אִתִּי
  choice: hata hiyo haiko nami
  rationale: Kiswahili hurejelea nomino kuu ya kirai, “nuru,” kwa kiwakilishi cha umoja “hiyo.” Muundo “haiko nami” unabaki karibu na Kiebrania na kuhifadhi taswira ya kitu kilichompotea mtunga-zaburi.
