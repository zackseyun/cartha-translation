  text: My wounds stink and fester because of my foolishness[a].
translation:
  language: sw
  text: Majeraha yangu yananuka na yanaoza kwa sababu ya upumbavu wangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Michubuko yangu imenuka na imeoza kwa sababu ya upumbavu wangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבְאִישׁוּ
  choice: yananuka
  rationale: Kitenzi hiki kinaeleza kutoa au kuwa na harufu mbaya. “Yananuka” ni usemi wa kawaida na wenye nguvu unaohifadhi hali ya kuchukiza ya picha ya Kiebrania.
- source_word: נָמַקּוּ
  choice: kuoza
  rationale: Kitenzi hiki kinaweza kumaanisha kuoza, kuharibika, au kudhoofika. Kuhusu majeraha, “kuoza” kinaeleza wazi kuharibika kwa nyama bila kutumia istilahi ya kitabibu.
- source_word: חַבּוּרֹתַי
  choice: majeraha yangu
  rationale: Nomino hii inaweza kutaja michubuko, mapigo yaliyovimba, au majeraha. Muktadha wa kunuka na kuoza unapendelea “majeraha,” ambalo ni neno la kawaida na linalofaa uzito wa hali hiyo.
- source_word: מִפְּנֵי
  choice: kwa sababu ya
  rationale: Katika muktadha huu kihusishi kinaonyesha sababu. “Kwa sababu ya” kinaweka wazi uhusiano huo wa kisababishi.
- source_word: אִוַּלְתִּי
  choice: upumbavu wangu
  rationale: Nomino hii ina maana ya upumbavu au ukosefu wa hekima, mara nyingi ikiwa na uzito wa kimaadili. “Upumbavu wangu” huhifadhi kukiri kwa mtunga zaburi bila kuufanya kuwa ujinga wa kutokuwa na habari tu.
theological_decisions:
- issue: Uhusiano wa kisababishi kati ya mateso na upumbavu wa mtunga zaburi
  choice: kwa sababu ya upumbavu wangu
  alternative: kutokana na upumbavu wangu
  rationale: Mstari huu unaunganisha wazi hali ya mtunga zaburi na upumbavu wake mwenyewe. Tafsiri inadumisha uhusiano huo bila kuupanua kuwa fundisho kwamba kila mateso husababishwa moja kwa moja na dhambi ya mwenye kuteseka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya moja kwa moja, ya sasa, na yenye heshima. Muundo wa “yananuka na kuoza” ni wa asili katika Kiswahili na unaendeleza picha halisi na kali ya Kiebrania.
