lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au maelezo ya kauli iliyotangulia; “Kwa maana” kinahifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: עֲוֺנִי
  choice: uovu wangu
  rationale: עָוֹן yaweza kumaanisha tendo ovu au hatia inayotokana nalo. “Uovu wangu” lina uzito wa kimaadili bila kulazimisha maana moja pekee.
- source_word: אַגִּיד
  choice: ninakiri
  rationale: Hifili ya נגד kimsingi ni ‘kutangaza’ au ‘kufanya ijulikane’; katika muktadha huu wa toba, “ninakiri” ni ya asili na inaonyesha kwamba msemaji anaufanya uovu wake ujulikane.
- source_word: אֶדְאַג
  choice: ninafadhaika
  rationale: דאג huonyesha hangaiko au dhiki ya moyoni. “Ninafadhaika” ni lugha ya sasa na hudokeza hali ya kusumbuka bila kuongeza maelezo yasiyomo.
- source_word: מֵחַטָּאתִי
  choice: kwa sababu ya dhambi yangu
  rationale: מִן hapa yaelekea kuonyesha sababu au chanzo cha fadhaa; tafsiri hii inaweka uhusiano huo wazi na kwa njia ya kawaida.
- source_word: חַטָּאתִי
  choice: dhambi yangu
  rationale: חַטָּאת ni neno la kawaida kwa dhambi; “dhambi yangu” ni tafsiri ya moja kwa moja na inayoeleweka.
theological_decisions:
- issue: Uhusiano kati ya kukiri na fadhaa ya ndani katika zaburi ya toba
  choice: Mstari unaonyesha kukiri binafsi kwa uovu na kufadhaika kwa sababu ya dhambi, bila kuongeza maelezo mapana ya kimafundisho kuhusu toba.
  alternative: Kitenzi אַגִּיד kingeweza kutafsiriwa kwa maana isiyo mahsusi ya toba kama “ninatangaza” au “ninaeleza.”
  rationale: Maana ya msingi ya kitenzi ni kufanya jambo lijulikane, lakini kitu kinachotajwa ni uovu wa msemaji katika muktadha wa toba. “Ninakiri” linafikisha muktadha huo, huku tanbihi ikihifadhi maana ya kileksika iliyo pana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kishairi; “uovu” na “dhambi” yanahifadhi utofauti wa istilahi mbili za Kiebrania.
