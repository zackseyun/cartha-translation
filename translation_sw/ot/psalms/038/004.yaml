lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huanzisha sababu ya maombolezo kwa mtiririko wa kishairi bila kufafanua uhusiano huo kupita kiasi.
- source_word: עֲוֺנֹתַי
  choice: maovu yangu
  rationale: Neno עָוֹן linaweza kumaanisha makosa ya kimaadili, hatia, au matokeo yake. ‘Maovu yangu’ yanatanguliza makosa yenyewe huku tanbihi ikihifadhi uwezekano wa maana ya hatia.
- source_word: עָבְרוּ רֹאשִׁי
  choice: yamepita juu ya kichwa changu
  rationale: Inahifadhi taswira halisi ya kitu, huenda maji, kilichoinuka na kupita juu ya kichwa, badala ya kuifupisha kuwa ‘yamenizidi’.
- source_word: כְּמַשָּׂא כָבֵד
  choice: kama mzigo mzito
  rationale: ‘Mzigo mzito’ ni Kiswahili cha kawaida na chenye hadhi kinachohifadhi sitiari ya uzito.
- source_word: יִכְבְּדוּ מִמֶּנִּי
  choice: yamenilemea nisiyoweza kuubeba
  rationale: Huendeleza taswira ya uzito na kueleza kwa Kiswahili cha kawaida kwamba mzigo huo ni mzito kupita uwezo wa msemaji.
theological_decisions:
- issue: Wigo wa maana ya עָוֹן katika muktadha wa toba
  choice: ‘Maovu yangu’ katika matini kuu, yakielekea hasa kwenye makosa ya kimaadili ya mtunga zaburi
  alternative: ‘Hatia yangu,’ ikisisitiza hali ya kuwa na hatia au wajibu unaotokana na kosa
  rationale: Muktadha huonyesha makosa ya msemaji kama mzigo unaomlemea. Kwa kuwa עָוֹן linaweza kujumuisha kosa na hatia inayotokana nalo, matini kuu inatanguliza makosa, na tanbihi inahifadhi maana nyingine bila kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Taswira mbili za Kiebrania—kupita juu ya kichwa na mzigo mzito—zimehifadhiwa. Kiambishi cha umoja katika ‘kuubeba’ kinarejelea ‘mzigo,’ huku wingi wa ‘maovu’ ukidumishwa katika vitenzi vingine.
