  yaml_path: translation/ot/psalms/038/004.yaml
  text: For my iniquities have gone over my head; like a heavy burden[a], they are too heavy for me.
translation:
  language: sw
  text: Kwa maana maovu yangu[a] yamepita juu ya kichwa changu; kama mzigo mzito, ni mazito mno kwangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hatia yangu”; neno la Kiebrania linaweza kumaanisha maovu na pia hatia inayotokana nayo.
