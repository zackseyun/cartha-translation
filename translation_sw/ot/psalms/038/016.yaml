  language: sw
  text: Kwa maana nilisema, “Wasije wakafurahi juu yangu; mguu wangu unapoteleza, wanajikweza dhidi yangu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּן
  choice: La sivyo
  rationale: Katika muktadha huu linaonyesha jambo alilohofia msemaji lingetokea, na hivyo kuunganisha kwa kawaida kauli hii na ombi la mstari uliotangulia.
- source_word: יִשְׂמְחוּ לִי
  choice: watafurahi juu yangu
  rationale: Linaonyesha kufurahia mabaya yanayompata msemaji; ‘juu yangu’ ni Kiswahili cha kawaida na kinahifadhi mwelekeo wa usemi wa Kiebrania.
- source_word: בְּמוֹט רַגְלִי
  choice: mguu wangu unapoteleza
  rationale: Inahifadhi picha halisi ya mguu kuyumba au kuteleza, huku wakati wa Kiswahili ukieleza tukio linalowapa wapinzani nafasi ya kujigamba.
- source_word: עָלַי הִגְדִּילוּ
  choice: watajigamba dhidi yangu
  rationale: Kitenzi ‘kujifanya wakubwa’ hapa kimetumika kwa maana ya kusema au kutenda kwa majivuno dhidi ya mtu; ‘watajigamba’ ni tafsiri ya asili bila kupoteza uhasama wa עָלַי.
