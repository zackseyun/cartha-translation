lexical_decisions:
- source_word: נְפוּגוֹתִי
  choice: Nimedhoofika
  rationale: Kitenzi hiki kinaonyesha kulegea au kupoteza nguvu; ‘nimedhoofika’ ni Kiswahili cha kawaida kinachowasilisha hali hiyo bila kuongeza wazo lisilo katika chanzo.
- source_word: וְנִדְכֵּיתִי עַד־מְאֹד
  choice: na kupondwa kabisa
  rationale: Mzizi דכא una wazo la kupondwa au kukandamizwa, na עַד־מְאֹד huongeza kiwango kikubwa; tafsiri hii inadumisha picha na msisitizo wa Kiebrania.
- source_word: שָׁאַגְתִּי
  choice: ninanguruma
  rationale: שאג kwa kawaida ni kutoa ngurumo au kishindo kama cha simba. ‘Ninanguruma’ huhifadhi nguvu ya usemi badala ya kuupunguza kuwa kuugua tu.
- source_word: מִנַּהֲמַת לִבִּי
  choice: kwa sababu ya kuugua kwa moyo wangu
  rationale: מִן hapa inaeleweka kisababishi, huku נהמה ikirejelea kuugua au mvumo wa ndani. Muundo huu unahifadhi tofauti kati ya ngurumo ya msemaji na kuugua kwa moyo wake.
