lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu au msingi wa maombolezo, kwa mtindo wa kawaida na wenye hadhi katika Kiswahili.
- source_word: חִצֶּיךָ
  choice: mishale yako
  rationale: Inahifadhi taswira halisi ya silaha inayowakilisha mateso yanayotoka kwa Mungu.
- source_word: נִחֲתוּ בִי
  choice: imezama ndani yangu
  rationale: Kitenzi נחת kimsingi kina wazo la kushuka; pamoja na mishale, ‘imezama ndani yangu’ huonyesha kwa Kiswahili cha kawaida mishale iliyopenya na kubaki ndani bila kuondoa taswira hiyo.
- source_word: וַתִּנְחַת עָלַי
  choice: umenishukia
  rationale: Inadumisha wazo la kushuka na uhusiano wa kile kinachomjia au kumlemea mtu, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: יָדֶךָ
  choice: mkono wako
  rationale: Tafsiri halisi inayohifadhi taswira ya kibinadamu kuhusu tendo na nguvu ya Mungu bila kuifafanua kuwa hukumu, adhabu, au nguvu pekee.
theological_decisions:
- issue: Lugha ya kumwelezea Mungu kwa sifa za kibinadamu
  choice: Kudumisha ‘mkono wako’
  alternative: nguvu zako / hukumu yako
  rationale: Kiebrania kinatumia taswira halisi ya mkono wa Mungu. Tafsiri haibadili taswira hiyo kuwa ufafanuzi wa kimafundisho.
- issue: Maana ya mateso yanayowakilishwa na mishale na mkono
  choice: Kuacha taswira izungumze bila kutaja wazi adhabu au nidhamu
  alternative: mishale ya adhabu yako / mkono wako wa nidhamu
  rationale: Muktadha unaonyesha mateso yanayotokana na tendo la Mungu, lakini mstari wenyewe hautaji moja kwa moja kama ni adhabu, hukumu, au nidhamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mistari miwili inadumisha usambamba wa kishairi. ‘Umenishukia’ huhifadhi mwendo wa kuelekea chini unaopatikana katika mzizi wa Kiebrania, huku ‘imezama ndani yangu’ ikitoa taswira ya kawaida ya mishale iliyopenya.
