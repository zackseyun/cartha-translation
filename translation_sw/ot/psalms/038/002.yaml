  text: 'Kwa maana mishale yako imezama ndani yangu[a],

    na mkono wako umeshuka juu yangu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “imenipenya” au “imenichoma.” Kitenzi cha Kiebrania kwa maana yake ya msingi ni “imeshuka”; hapa kinatumiwa kuhusu mishale inayozama na kubaki ndani yake.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana ya moja kwa moja, “mkono wako.” Hii ni taswira ya Kiebrania ya tendo au nguvu ya Mungu; katika muktadha huu, mkono wake umeelekezwa juu ya mtunga zaburi.
