source:
  edition: WLC
  text: אֵין מְתֹ֣ם בִּ֭/בְשָׂרִ/י מִ/פְּנֵ֣י זַעְמֶ֑/ךָ אֵין שָׁל֥וֹם בַּ֝/עֲצָמַ֗/י מִ/פְּנֵ֥י חַטָּאתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/003.yaml
  text: There is no soundness in my flesh because of your indignation[b][a]; there is no peace in my bones because of my sin.
translation:
  language: sw
  text: Hakuna afya katika mwili wangu kwa sababu ya ghadhabu yako[a]; hakuna amani katika mifupa yangu kwa sababu ya dhambi yangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hasira yako kali.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hali njema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְתֹם
  choice: afya
  rationale: Neno hili humaanisha ukamilifu au hali timamu. Katika maombolezo haya kuhusu mateso ya mwili, “afya” linaeleza kwa njia ya kawaida kwamba mwili wake si timamu.
- source_word: בִּבְשָׂרִי
  choice: katika mwili wangu
  rationale: Ingawa בשר kwa msingi ni “nyama,” hapa linamaanisha mwili wa mtunga zaburi unaoteseka. “Mwili wangu” ni Kiswahili cha kawaida na huhifadhi taswira ya kimwili.
- source_word: מִפְּנֵי
  choice: kwa sababu ya
  rationale: Katika vifungu vyote viwili, kihusishi hiki kinaonyesha sababu; “kwa sababu ya” ni tafsiri ya wazi na ya kawaida.
- source_word: זַעְמֶךָ
  choice: ghadhabu yako
  rationale: זעם huonyesha hasira kali au ghadhabu. “Ghadhabu yako” huhifadhi uzito wa kutoridhika kwa Mungu bila kuongeza maelezo yasiyokuwamo katika Kiebrania.
- source_word: שָׁלוֹם
  choice: amani
  rationale: שׁלום inaweza kumaanisha amani, hali njema, au ukamilifu. “Amani” ni neno la moja kwa moja, huku tanbihi ikihifadhi maana ya kimuktadha ya “hali njema.”
- source_word: בַּעֲצָמַי
  choice: mifupa yangu
  rationale: Kiebrania kinataja mifupa moja kwa moja. Tafsiri hii huhifadhi taswira ya kishairi ya mateso yanayopenya ndani kabisa.
- source_word: חַטָּאתִי
  choice: dhambi yangu
  rationale: Neno hili linataja dhambi ya mtunga zaburi kuwa sababu ya taabu yake. “Dhambi yangu” ni tafsiri ya wazi na ya kawaida.
theological_decisions:
- issue: Uhusiano kati ya ghadhabu ya Mungu na mateso ya mtunga zaburi
  choice: Mstari unasema moja kwa moja kwamba hali mbaya ya mwili wa mtunga zaburi inatokana na ghadhabu ya Mungu na dhambi yake mwenyewe, bila kueleza zaidi jinsi sababu hizo zinavyohusiana.
  alternative: Kauli hii inaweza kueleweka kuwa maelezo ya kishairi kuhusu hali ya kutengwa anayohisi, wala si fundisho kamili kuhusu chanzo cha mateso yote.
  rationale: Tafsiri imehifadhi vifungu vyote viwili vinavyoonyesha sababu bila kupunguza uzito wa ghadhabu ya Mungu wala wa dhambi ya mtu. Hivyo mvutano wa kiteolojia wa Kiebrania unabaki bila kugeuzwa kuwa fundisho pana kuhusu mateso yote.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishairi na usambamba wa vifungu viwili umehifadhiwa; “mwili” na “mifupa” huendeleza taswira halisi ya Kiebrania.
