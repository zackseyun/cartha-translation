  yaml_path: translation/ot/psalms/038/011.yaml
  text: My loved ones and my friends stand apart from my affliction[c][b][a], and my close kin stand far away.
translation:
  language: sw
  text: Wanaonipenda na rafiki zangu husimama mbali na pigo langu[a][b], nao jamaa zangu wa karibu[c] husimama mbali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jeraha langu,” “ugonjwa wangu,” au “mateso yangu” badala ya “pigo langu.” Neno la Kiebrania linaweza kutaja pigo la mwili, ugonjwa, au jeraha.
    reason: lexical_alternative
  - marker: b
    text: Au “husimama mbele ya pigo langu” au “mkabala na pigo langu.” Usemi wa Kiebrania una picha ya mahali, lakini katika muktadha unaweza kumaanisha kwamba wanajitenga naye kwa sababu ya pigo lake.
    reason: source_ambiguity
  - marker: c
    text: Au “watu wangu wa karibu” au “ndugu zangu wa karibu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֲבַי
  choice: wanaonipenda
  rationale: Hii ni kauli ya moja kwa moja kwa umbo la Kiebrania linalomaanisha watu wanaompenda mtunga-zaburi; pia huepuka maana ya kimapenzi pekee.
- source_word: וְרֵעַי
  choice: na rafiki zangu
  rationale: Neno רֵעַ humaanisha rafiki, mwenzi, au mshirika; “rafiki” ni la kawaida na linafaa katika ulinganifu huu.
- source_word: מִנֶּגֶד
  choice: mbali na
  rationale: Katika muktadha wa watu kujitenga na mwenye mateso, usemi huu unaonyesha nafasi iliyo mbele au mkabala naye, kwa maana ya kutokaribia. “Mbali na” ni Kiswahili cha kawaida bila kuongeza wazo la uadui.
- source_word: נִגְעִי
  choice: pigo langu
  rationale: נֶגַע linaweza kumaanisha pigo, jeraha, au ugonjwa unaomsibu mtu. “Pigo” linahifadhi upana wa picha ya mateso ya mwili kuliko neno maalumu zaidi kama “jeraha” au “ugonjwa”.
- source_word: יַעֲמֹדוּ
  choice: husimama
  rationale: Kitenzi kinaonyesha kuchukua au kudumisha mahali; wakati wa mazoea/unaondelea unafaa kwa taswira ya sasa ya kishairi.
- source_word: וּקְרוֹבַי
  choice: nao jamaa zangu wa karibu
  rationale: קָרוֹב linaweza kutaja watu walio karibu, hasa ndugu au jamaa wa karibu. Tafsiri hii inahifadhi uwezekano wa uhusiano wa kifamilia.
- source_word: מֵרָחֹק
  choice: mbali
  rationale: Huu ni usemi wa wazi wa umbali wa mahali; “mbali” ni wa asili na mfupi katika Kiswahili.
- source_word: עָמָדוּ
  choice: husimama
  rationale: Ingawa umbo la Kiebrania ni timilifu, linaenda sambamba na kitenzi cha mstari wa kwanza na linaweza kuwasilisha hali inayoendelea katika taswira ya zaburi.
