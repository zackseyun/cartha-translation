  text: Kwa maana viuno vyangu vimejaa joto liunguzalo[a], wala hakuna afya katika mwili wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “joto kali” au “uvimbe wenye kuwaka.” Neno la Kiebrania ni gumu, lakini hapa linaonekana kutaja hali chungu ya mwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza maelezo ya sababu ya dhiki ya mtunga zaburi na ni ya kawaida katika Kiswahili sanifu.
- source_word: כְסָלַי
  choice: viuno vyangu
  rationale: Neno hilo hutaja eneo la viuno au mbavu za chini; “viuno” ni wazi na halielekezi isivyofaa kwenye kiungo maalumu.
- source_word: מָלְאוּ
  choice: vimejaa
  rationale: Inahifadhi maana ya hali ya kuwa kamili au kujazwa na jambo linalofuata.
- source_word: נִקְלֶה
  choice: mwako
  rationale: Neno la Kiebrania ni gumu, lakini katika muktadha wa mateso ya mwili linaelekea kutaja hali ya kuungua au kuvimba kwa joto. “Mwako” huhifadhi hali hiyo bila kuongeza vidonda ambavyo havikutajwa wazi.
- source_word: וְאֵין
  choice: wala hakuna
  rationale: Ni ukanushaji wa kuwapo; “wala hakuna” huunganisha kwa kawaida kishazi cha pili chenye huzuni na cha kwanza.
- source_word: מְתֹם
  choice: uzima
  rationale: Katika muktadha wa mwili, neno hili humaanisha hali ya kuwa mzima, bila jeraha au ugonjwa. “Uzima” ni Kiswahili cha kawaida kinachoeleweka hapa kama afya njema ya mwili.
- source_word: בִּבְשָׂרִי
  choice: katika mwili wangu
  rationale: Ingawa neno la msingi ni “nyama,” hapa linamaanisha mwili wa mtu halisi; “mwili wangu” ni tafsiri ya asili na yenye hadhi katika Kiswahili bila kuleta maana ya nyama ya kuliwa.
theological_decisions:
- issue: Maana ya בשרי katika maelezo ya mateso
  choice: mwili halisi wa mtunga zaburi
  alternative: nyama yangu; matumizi ya kitheolojia au ya mfano
  rationale: Muktadha unaeleza maumivu ya kimwili sambamba na viuno na kukosekana kwa uzima; hakuna msingi wa kuifanya kuwa sitiari ya hali ya dhambi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kishairi na hali ya kimwili vimehifadhiwa; utata wa נִקְלֶה umeonyeshwa katika tanbihi.
