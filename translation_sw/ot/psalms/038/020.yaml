  text: And those who repay evil for good oppose me[a], because I pursue what is good.
translation:
  language: sw
  text: Nao wanaolipa ubaya kwa wema hunipinga[a], kwa sababu ninafuata mema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi, “hunipinga kwa malipo ya kufuata kwangu mema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מְשַׁלְּמֵי
  choice: wanaolipa
  rationale: Kitenzi hiki katika umbo la kisifa huonyesha watu wanaorudisha jambo kama malipo; “wanaolipa” ni ya kawaida na inadumisha maana ya kurudisha lililotendwa.
- source_word: רָעָה
  choice: ubaya
  rationale: “Ubaya” hudumisha uzito wa kimaadili na ulinganifu wa moja kwa moja na “wema.”
- source_word: תַּחַת
  choice: badala ya; kwa sababu
  rationale: Katika kishazi cha kwanza, “badala ya” huonyesha kubadilisha wema kwa ubaya. Katika cha pili, uhusiano huo umeelezwa kwa Kiswahili cha kawaida kama sababu, huku tafsiri ya karibu zaidi ikiwekwa katika tanbihi.
- source_word: טוֹבָה
  choice: wema
  rationale: Nomino hii ni jambo jema lililotendwa au kupokewa; “wema” huhifadhi utofautishaji mfupi na “ubaya” bila kufafanua kupita kiasi.
- source_word: יִשְׂטְנוּ/נִי
  choice: hunipinga
  rationale: Mzizi שטן una maana ya kumpinga mtu au kuwa adui yake. “Hunipinga” huonyesha uadui huo bila kuufanya hasa kuwa shtaka la kisheria au chuki ya kihisia.
- source_word: רדופ/י
  choice: ninafuatilia
  rationale: רדף kwa msingi ni kufuatilia au kufuata kwa bidii. “Ninafuatilia” huonyesha jitihada hai za kushikamana na mema.
- source_word: טוֹב
  choice: yaliyo mema
  rationale: Kivumishi hiki kimetumiwa kama nomino. “Yaliyo mema” ni Kiswahili cha kawaida kinachoonyesha wazi jambo linalofuatiliwa.
theological_decisions:
- issue: Nguvu ya kisababishi ya kishazi cha pili chenye תַּחַת
  choice: kwa sababu ninafuatilia yaliyo mema
  alternative: hunipinga kwa kulipiza kufuatilia kwangu mema
  rationale: תַּחַת ya pili inaweza kueleweka kwa karibu kama “kwa kulipiza kufuatilia kwangu mema.” Katika Kiswahili, “kwa sababu” huwasilisha kwa uwazi kwamba upinzani wao unatokana na kufuatilia mema, huku tanbihi ikihifadhi muundo na uwezekano wa maana ya malipo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nao” huunganisha mstari huu na muktadha uliotangulia; “hunipinga” huonyesha tendo la kawaida au linaloendelea. Alama [a] imewekwa moja kwa moja baada ya kishazi kinachofafanuliwa.
