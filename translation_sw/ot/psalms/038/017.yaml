  text: For I am ready to fall, and my pain is always before me.
translation:
  language: sw
  text: Kwa maana niko karibu kuanguka, na maumivu yangu yako mbele yangu daima.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְצֶלַע
  choice: karibu kuanguka
  rationale: Katika muktadha huu, neno linaonyesha kuwa msemaji yuko katika hatari ya kuporomoka au kuanguka. Tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi taswira hiyo bila kuifanya kuwa udhaifu wa maadili tu.
- source_word: נָכוֹן
  choice: niko karibu
  rationale: Ingawa kimsingi neno linaweza kumaanisha kuwa tayari au kuwekwa tayari, pamoja na לְצֶלַע linaeleza hali inayokaribia kutokea; 'niko karibu' ni usemi wa asili wa Kiswahili.
- source_word: מַכְאוֹבִי
  choice: maumivu yangu
  rationale: Huhifadhi maana pana ya uchungu au maumivu bila kubainisha kuwa ni ya mwili au ya ndani pekee.
- source_word: נֶגְדִּי תָמִיד
  choice: yako mbele yangu daima
  rationale: Huhifadhi taswira ya Kiebrania kwamba maumivu yanamkabili msemaji kila wakati.
theological_decisions:
- issue: Iwapo צלע itafsiriwe kama kujikwaa, kuchechemea, au kuanguka
  choice: kuanguka
  alternative: kujikwaa / kuchechemea
  rationale: Muktadha wa maombolezo unaruhusu taswira ya kuanguka kunakokaribia. Chaguo hili haliongezi tafsiri maalumu ya kiroho au kimaadili, na linalingana na ushahidi wa tafsiri ya mashauriano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini rahisi kueleweka. Mpangilio 'mbele yangu daima' umehifadhiwa ili kudumisha uzito na taswira ya mstari wa Kiebrania.
