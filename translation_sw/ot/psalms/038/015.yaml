lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza sababu au msingi wa kauli katika muktadha, bila kuondoa kabisa uwezekano wa msisitizo.
- source_word: לְךָ
  choice: ninakungoja wewe
  rationale: Pamoja na kitenzi יחל, kihusishi לְ humtaja anayengojewa kwa tumaini. Kiwakilishi huru cha msisitizo kinaakisiwa kwa ‘wewe’.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: הוֹחָלְתִּי
  choice: ninakungoja
  rationale: Kitenzi kinaweza kumaanisha kungoja kwa tumaini au kutumaini. ‘Ninakungoja’ ni cha kawaida katika Kiswahili na huhifadhi hali ya matarajio; tanbihi inaonyesha upana wa maana.
- source_word: תַעֲנֶה
  choice: utajibu
  rationale: Maana ya moja kwa moja ni kujibu au kuitikia. Yambwa ‘mimi’ haijaongezwa kwa kuwa haijaelezwa wazi katika Kiebrania.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Hapa ni cheo cha Mungu katika usemi wa kumwita moja kwa moja.
- source_word: אֱלֹהָי
  choice: Mungu wangu
  rationale: Kiambishi cha nafsi ya kwanza kimehifadhiwa wazi kwa ‘wangu’.
theological_decisions:
