  rationale: Maandishi yana jina la pekee YHWH, kwa hiyo limetoholewa ili kutofautishwa na cheo אֲדֹנָי (‘Bwana’) kinachotokea baadaye katika mstari huohuo.
- issue: Uhakika wa kauli תַעֲנֶה
  choice: wewe utajibu
  alternative: wewe na ujibu
  rationale: Umbo la Kiebrania linaweza kusomwa kama kauli ya kutarajia kwa uhakika; tafsiri hii hailibadili kuwa ombi, huku ikihifadhi msisitizo wa אַתָּה.
translation_notes:
