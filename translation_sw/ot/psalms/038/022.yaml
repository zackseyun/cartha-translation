lexical_decisions:
- source_word: חוּשָׁה
  choice: Harakisha
  rationale: Amri hii inaonyesha ombi la dharura la kutenda upesi. “Harakisha” ni Kiswahili cha sasa, cha moja kwa moja, na chenye hadhi.
- source_word: לְעֶזְרָתִי
  choice: kunisaidia
  rationale: Kirai hiki kihalisi ni “kwa/kwenda kwenye msaada wangu”; “kunisaidia” kinaeleza maana hiyo kwa Kiswahili cha kawaida bila kupoteza dharura ya ombi.
- source_word: אֲדֹנָי
  choice: Ee Bwana
  rationale: Hili ni jina la cheo la Mungu, “Bwana.” “Ee” linaonyesha kwamba mtunga zaburi anamwita Mungu moja kwa moja.
- source_word: תְּשׁוּעָתִי
  choice: wokovu wangu
  rationale: Nomino hii inaweza kumaanisha wokovu au ukombozi. “Wokovu wangu” inadumisha umbo la nomino, upana wa maana, na uzito wake wa kiteolojia.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la cheo la Mungu אֲדֹנָי
  choice: Ee Bwana
  alternative: Ee Bwana wangu
  rationale: Katika matumizi haya אֲדֹנָי hufanya kazi kama jina la cheo la Mungu. Tafsiri “Bwana” haikazii kimyakimya umilikishi ambao hauko mbele katika matumizi ya kawaida ya neno hili.
- issue: Jinsi ya kutafsiri תְּשׁוּעָתִי
  choice: wokovu wangu
  alternative: ukombozi wangu
  rationale: “Wokovu wangu” huhifadhi nomino na wigo mpana wa neno la Kiebrania; “ukombozi wangu” unawezekana lakini unaweza kuelekeza zaidi kwenye kuokolewa kutoka hatarini fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mstari umewekwa kwa ufupi ili kudumisha nguvu na dharura ya ombi la Kiebrania.
