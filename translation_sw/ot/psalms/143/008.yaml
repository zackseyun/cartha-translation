  text: הַשְׁמִ֘יעֵ֤/נִי בַ/בֹּ֨קֶר חַסְדֶּ/ךָ֮ כִּֽי בְ/ךָ֪ בָ֫טָ֥חְתִּי הוֹדִיעֵ֗/נִי דֶּֽרֶךְ ז֥וּ אֵלֵ֑ךְ כִּֽי אֵ֝לֶי/ךָ נָשָׂ֥אתִי נַפְשִֽׁ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/008.yaml
  text: Let me hear your steadfast love in the morning[a], for in you I trust. Make known to me the way I should go[c][b], for to you I lift up my soul.
translation:
  language: sw
  text: Nijalie kusikia upendo wako thabiti asubuhi[a], kwa maana ninakutumaini. Nijulishe njia nitakayoiendea[b], kwa maana kwako nainua nafsi yangu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nifanye nisikie upendo wako thabiti asubuhi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Nijulishe njia ninayopaswa kuifuata”; kwa neno halisi, “njia nitakayoiendea.”
    reason: lexical_alternative
  - marker: c
    text: “Kuinua nafsi yangu” ni msemo wa Kiebrania unaoweza kumaanisha kujikabidhi kwa Mungu au kumwelekezea yeye nafsi na maisha yote ya ndani.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְׁמִיעֵנִי
  choice: Nifanye niusikie
  rationale: Hili ni agizo la Hifili lenye maana ya msingi ‘nifanye nisikie.’ Kiswahili hiki kinahifadhi ombi la kisababishi na taswira ya kusikia, huku kiwakilishi ‘u-’ kikirejelea upendo unaofuata.
- source_word: בַבֹּקֶר
  choice: asubuhi
  rationale: Kirai hiki kinaonyesha wakati. ‘Asubuhi’ ni cha kawaida na hakiongezi wazo la kikomo cha muda au kurudiwa kila siku.
- source_word: חַסְדֶּךָ
  choice: upendo wako thabiti
  rationale: חסד hapa ni upendo wa Mungu wenye uaminifu na udumifu. ‘Upendo wako thabiti’ huhifadhi upana huo kuliko ‘rehema’ pekee.
- source_word: כִּי
  choice: kwa maana
  rationale: כִּי katika vifungu vyote viwili inatoa sababu ya ombi. ‘Kwa maana’ linafaa katika sala ya kishairi na linaonyesha uhusiano huo wa kisababu.
- source_word: בְךָ בָטָחְתִּי
  choice: ninakutumaini
  rationale: Kauli timilifu ya Kiebrania inaweza kuonyesha msimamo uliowekwa wa kumtegemea Mungu. Wakati wa sasa katika Kiswahili unaeleza tumaini linaloendelea katika muktadha huu.
- source_word: הוֹדִיעֵנִי
  choice: Nijulishe
  rationale: Hifili ya ידע ina maana ya ‘fanya nijue’ au ‘nijulishe.’ ‘Nijulishe’ ni ya asili na inabaki karibu na maana ya neno la chanzo.
- source_word: דֶּרֶךְ
  choice: njia
  rationale: דרך inaweza kumaanisha barabara halisi au mwenendo wa maisha. ‘Njia’ huhifadhi uwezekano huo wa maana halisi na ya kitamathali.
- source_word: זוּ אֵלֵךְ
  choice: ninayopaswa kuifuata
  rationale: Kiebrania ni kwa karibu ‘ambayo nitaenda.’ Katika ombi la mwongozo, ‘ninayopaswa kuifuata’ ni Kiswahili cha kawaida kinachoonyesha kusudi la msemaji bila kubadili njia kuwa mafundisho tu.
- source_word: אֵלֶיךָ
  choice: kwako
  rationale: Kihusishi kinaonyesha mwelekeo kuelekea kwa Mungu; ‘kwako’ ni usemi wa kawaida wa Kiswahili.
- source_word: נָשָׂאתִי נַפְשִׁי
  choice: nainua nafsi yangu
  rationale: Tafsiri hii inahifadhi sitiari ya Kiebrania ya kumwelekezea Mungu maisha ya ndani na kujikabidhi kwake, badala ya kuifupisha kuwa ‘ninaomba’ au ‘ninajikabidhi.’
theological_decisions:
- issue: Maana ya חסד katika sala inayoelekezwa kwa Mungu
  choice: upendo wako thabiti
  alternative: rehema zako; upendo wako wa agano; fadhili zako
  rationale: Neno hilo linajumuisha upendo, uaminifu, na udumifu wa Mungu. ‘Upendo wako thabiti’ huhifadhi uzito huo bila kulifunga kwa istilahi ya dhehebu au kulipunguza kuwa huruma pekee.
- issue: Sitiari נָשָׂאתִי נַפְשִׁי
  choice: kwako nainua nafsi yangu
  alternative: kwako ninajikabidhi; kwako ninaelekeza tamaa yangu
  rationale: Sitiari yenyewe imehifadhiwa ili kutokupunguza kwa lazima kuwa sala, tamaa, au kujikabidhi pekee. Tanbihi inaeleza upeo wake bila kuondoa mvutano wake wa kishairi na kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala ya kishairi. Muundo ni wazi kwa msomaji wa kawaida, huku taswira za ‘kusikia’ upendo na ‘kuinua nafsi’ zikihifadhiwa. ‘Ninakutumaini’ na ‘Nijulishe’ ni za asili bila kuwa za kale au za kimadhehebu.
