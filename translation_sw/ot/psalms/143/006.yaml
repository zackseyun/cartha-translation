  source_fidelity: The opening gesture is accurately represented by “Nimekunyooshea mikono yangu.” The final לְךָ is an elliptical poetic expression of orientation/longing toward God; “kwa ajili yako” can instead mean “for your sake” in modern Swahili and therefore obscures the source sense.
  naturalness: The draft is generally clear and appropriately poetic. Recasting the final relation as “inayokutamani” makes the line natural Swahili while retaining the simile and its implied longing.
  terminology: “Nafsi yangu” appropriately retains the breadth and poetic register of נַפְשִׁי. “Sela” is the established Swahili transliteration. “Iliyokauka” is suitable as a clearly marked lexical alternative, not as the primary rendering of עֲיֵפָה.
