  yaml_path: translation/ot/psalms/143/006.yaml
  text: I spread out my hands to you; my soul is like a weary land for you[a]. Selah
translation:
  language: sw
  text: Nimekunyooshea mikono yangu; nafsi yangu ni kama nchi iliyochoka inayokutamani.[a] Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi yangu ni kama nchi iliyokauka inayokutamani.” Kivumishi cha Kiebrania humaanisha kihalisi “iliyochoka” au “iliyozimia”; “iliyokauka” huonyesha maana inayowezekana ya kiu kali katika tashbihi hii. Maneno ya mwisho ya Kiebrania yanaeleza kwa ufupi mwelekeo wa hamu hiyo kwako.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֵּרַשְׂתִּי
  choice: Nimekunyooshea
  rationale: Kitenzi פרשׂ kinaeleza kunyoosha au kutandaza. Katika muktadha wa sala, “nimekunyooshea” linaonyesha kwa Kiswahili cha kawaida tendo la kuelekeza mikono kwa Mungu kwa dua.
- source_word: יָדַי
  choice: mikono yangu
  rationale: Umbo la Kiebrania linarejelea mikono yote miwili; wingi huu ni wa kawaida na wazi kwa Kiswahili.
- source_word: אֵלֶיךָ
  choice: -ku- ... -ea
  rationale: Kihusishi kinaonyesha mwelekeo kwa anayesemeshwa; muundo “nimekunyooshea mikono” unawasilisha maana hiyo kwa Kiswahili asilia.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: נֶפֶשׁ linaweza kumaanisha nafsi, uhai, au mtu mwenyewe. “Nafsi yangu” linahifadhi uzito wa ndani na wa kishairi bila kufafanua kupita kiasi.
- source_word: כְּאֶרֶץ עֲיֵפָה
  choice: kama nchi iliyochoka
  rationale: Kivumishi עֲיֵפָה humaanisha kihalisi iliyochoka au iliyozimia. Taswira hii isiyo ya kawaida imehifadhiwa, huku maana inayowezekana ya nchi iliyokauka ikiwekwa katika tanbihi.
- source_word: לְךָ
  choice: kwa ajili yako
  rationale: Kihusishi לְ ni kifupi na chenye utata wa kishairi hapa. “Kwa ajili yako” kinahifadhi mwelekeo wa hamu kwa Mungu bila kuongeza wazo la “peke yako.”
- source_word: סֶלָה
  choice: Sela
  rationale: Maana sahihi ya neno hili haijulikani; limetoholewa badala ya kutafsiriwa kwa kubahatisha.
theological_decisions:
- issue: Mwelekeo wa hamu ya nafsi kwa Mungu katika לְךָ
  choice: kwa ajili yako
  alternative: kwako / ikikutamani
  rationale: Kiebrania ni kifupi na kinaweza kuonyesha uelekeo au hamu. Tafsiri kuu haiongezi kitenzi cha kutamani ambacho hakijaandikwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa sentensi unahifadhi ishara ya dua na tashbihi yenye ukakasi wa makusudi. Alama ya tanbihi [a] imewekwa katika matini kuu.
