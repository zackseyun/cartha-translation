base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/003.yaml
  text: For an enemy has pursued my soul[a]; he has crushed my life to the ground; he has made me dwell in dark places[b], like those long dead.
translation:
  language: sw
  text: Kwa maana adui amenifuatilia[a]; ameukandamiza uhai wangu mpaka chini; amenifanya nikae katika maeneo ya giza, kama waliokufa zamani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “ameifuatilia nafsi yangu”; katika ushairi wa Kiebrania, “nafsi yangu” mara nyingi humaanisha mimi mwenyewe.
    reason: lexical_alternative
  - marker: b
    text: Au “kama wafu wa kale.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya ombi lililo katika muktadha na kudumisha nguvu ya kisababishi ya neno la Kiebrania.
- source_word: רָדַף
  choice: ameifuatilia
  rationale: Kitenzi hiki humaanisha kufuatilia au kukimbiza; wakati timilifu wa Kiswahili unaonyesha tendo lililotokea na ambalo matokeo yake yanaendelea kuhisiwa.
- source_word: אוֹיֵב
  choice: adui
  rationale: Nomino ya umoja imetafsiriwa kwa kawaida; Kiswahili hakihitaji kibainishi kinacholingana moja kwa moja na kutokuwapo kwa kibainishi katika Kiebrania.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: Hudumisha taswira ya kishairi na kuitofautisha na חַיָּתִי, huku tanbihi ikieleza kwamba hapa inaweza kumaanisha mtu mwenyewe.
- source_word: דִּכָּא
  choice: ameponda
  rationale: Hutoa maana kali ya kuvunja au kuponda inayofaa taswira ya mashambulizi.
- source_word: לָאָרֶץ
  choice: ardhini
  rationale: Ni usemi wa asili unaodumisha picha ya kushushwa na kupondwa mpaka chini.
- source_word: חַיָּתִי
  choice: uhai wangu
  rationale: Hurejelea uzima au kuwako kwa mtunga zaburi akiwa hai na pia huhifadhi tofauti na 'nafsi yangu' katika kishazi kilichotangulia.
- source_word: הוֹשִׁיבַנִי
  choice: amenikalisha
  rationale: 'Hifadhi umbo la kisababishi la kitenzi: adui amemfanya akae katika hali au mahali hapo.'
- source_word: בְמַחֲשַׁכִּים
  choice: mahali penye giza
  rationale: Huwasilisha wazo la maeneo ya giza lililo katika umbo la wingi wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: כְּמֵתֵי עוֹלָם
  choice: kama watu waliokufa zamani
  rationale: Hutoa kwa lugha ya asili maana inayowezekana zaidi ya watu waliokufa muda mrefu uliopita, bila kuifanya עוֹלָם imaanishe moja kwa moja 'milele'.
