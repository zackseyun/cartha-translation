  text: מַ֘הֵ֤ר עֲנֵ֨/נִי יְהוָה֮ כָּלְתָ֪ה ר֫וּחִ֥/י אַל תַּסְתֵּ֣ר פָּנֶ֣י/ךָ מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם יֹ֥רְדֵי בֽוֹר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/007.yaml
  text: Answer me quickly[a], O Yahweh; my spirit fails. Do not hide your face from me, or I will become like those who go down to the pit.
translation:
  language: sw
  text: Unijibu upesi, ee Yahweh; roho yangu inadhoofika. Usiufiche uso wako mbali nami, la sivyo nitakuwa kama wale wanaoshuka shimoni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale wanaoshuka kaburini.” Kwa Kiebrania, “shimoni” ni taswira ya kishairi ya kifo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר עֲנֵנִי
  choice: Unijibu upesi
  rationale: Imperative urgency is expressed naturally in modern Swahili; “upesi” modifies the plea to answer without sounding archaic.
- source_word: יְהוָה
  choice: Yahweh
  rationale: The divine name is transliterated rather than replaced by a title, preserving the personal covenant name in the Hebrew text.
- source_word: כָּלְתָה רוּחִי
  choice: roho yangu inadhoofika
  rationale: The Hebrew describes the speaker’s spirit as spent or failing. “Inadhoofika” communicates ongoing depletion and desperation naturally.
- source_word: אַל תַּסְתֵּר פָּנֶיךָ מִמֶּנִּי
  choice: Usinifiche uso wako
  rationale: This retains the Hebrew image of God hiding his face, an intelligible and theologically significant metaphor for withdrawn presence or favor.
- source_word: וְנִמְשַׁלְתִּי
  choice: la sivyo nitakuwa kama
  rationale: After the negative plea, this naturally conveys the feared consequence while preserving the sense of becoming or being like others.
- source_word: יֹרְדֵי בוֹר
  choice: wale washukao shimoni
  rationale: This preserves both the participial image of descending and the poetic metaphor of the pit, rather than interpreting it directly as the grave or Sheol.
theological_decisions:
- issue: Rendering the divine name יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: The source directly uses the Tetragrammaton. “Yahweh” preserves the divine name rather than substituting a title.
- issue: Meaning of בוֹר, “the pit”
  choice: shimoni
  alternative: kaburini
  rationale: “Shimoni” retains the broad poetic image of death without specifying the grave or resolving it into a detailed claim about the state of the dead.
translation_notes:
  register: Standard East African Swahili in a dignified prayer register. The verse uses direct, accessible wording while retaining the Hebrew facial and pit imagery. The footnote marker is placed immediately after “shimoni,” the term it explains.
