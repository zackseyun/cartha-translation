    issue: The phrase “Usinifiche uso wako” does not explicitly state the spatial/relational sense “from me.”
    rationale: Although it can be understood applicatively, “Usiufiche uso wako mbali nami” is unambiguous, natural Swahili and more fully represents אַל־תַּסְתֵּר פָּנֶיךָ מִמֶּנִּי.
  - severity: low
    issue: The footnote’s alternative, “kaburini,” omits the source phrase’s descending people.
    rationale: יוֹרְדֵי בוֹר means “those who go down to the pit.” The lexical alternative should be phrased “wale wanaoshuka kaburini” to preserve both the participle and its referent.
  revised_text: Unijibu upesi, ee Yahweh; roho yangu inadhoofika. Usiufiche uso wako mbali nami, la sivyo nitakuwa kama wale wanaoshuka shimoni.[a]
