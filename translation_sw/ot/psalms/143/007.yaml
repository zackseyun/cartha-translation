review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the urgent appeal, the failing/spent spirit, the plea that Yahweh not hide his face, and the consequence of being like those descending to the pit. A small revision makes the directional force of מִמֶּנִּי (“from me”) explicit and removes ambiguity in the Swahili clause.
  naturalness: “Unijibu upesi” and “roho yangu inadhoofika” are understandable and suitably dignified. “Usiufiche uso wako mbali nami” is clearer and more idiomatic than “Usinifiche uso wako,” whose object marking can be syntactically less transparent. “Wale wanaoshuka” is natural contemporary Standard East African Swahili while retaining the participial image.
  terminology: “Yahweh” appropriately preserves the divine name. “Shimoni” preserves the Hebrew poetic image בּוֹר without prematurely identifying it as a grave or a specified afterlife realm. The footnote alternative must retain the persons who descend, not reduce the phrase to “kaburini” alone.
  issues:
