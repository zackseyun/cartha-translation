base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/010.yaml
  text: Teach me to do your will[a], for you are my God. Let your good Spirit lead me in level ground.
translation:
  language: sw
  text: Nifundishe kufanya mapenzi yako, kwa maana wewe ndiwe Mungu wangu. Roho wako mwema[a] aniongoze katika nchi tambarare.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho yako njema iniongoze.” Kiebrania hakitofautishi herufi kubwa na ndogo; kwa hiyo kirai hiki kinaweza kueleweka kuwa Roho wa Mungu au roho au mwelekeo wake mwema.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְּדֵנִי
  choice: Nifundishe
  rationale: Kauli ya ombi ya mzizi למד katika Piel pamoja na kiambishi cha nafsi ya kwanza umoja humaanisha kumfundisha mtu; “Nifundishe” ni ya kawaida na ya moja kwa moja katika sala.
- source_word: לַעֲשׂוֹת
  choice: kufanya
  rationale: Jina-kitenzi la עשה linaeleza jambo analopaswa kujifunza; “kufanya” linahifadhi maana ya moja kwa moja.
- source_word: רְצוֹנֶךָ
  choice: mapenzi yako
  rationale: רצון inaweza kumaanisha mapenzi, ridhaa, au jambo linalompendeza mtu; katika muktadha huu “mapenzi yako” hueleza anachotaka Mungu kifanywe.
- source_word: כִּי אַתָּה אֱלֹהָי
  choice: kwa maana wewe ndiwe Mungu wangu
  rationale: כִּי inatoa msingi wa ombi; “kwa maana” huhifadhi uhusiano huo wa sababu, na “ndiwe” ni msisitizo wa asili katika Kiswahili.
- source_word: רוּחֲךָ טוֹבָה
  choice: Roho wako mwema
  rationale: Kirai kina maana ya moja kwa moja ya “roho/Roho wako mwema.” Herufi kubwa inaonyesha usomaji unaorejelea Roho wa Mungu, huku tanbihi ikihifadhi uwezekano mwingine kwa sababu Kiebrania hakitofautishi herufi kubwa na ndogo.
- source_word: תַּנְחֵנִי
  choice: aniongoze
  rationale: Hiphil ya נחה humaanisha kuongoza; umbo la “aniongoze” linafaa kwa ombi la sala na linaacha Roho kuwa kiima kama katika Kiebrania.
- source_word: בְּאֶרֶץ מִישׁוֹר
  choice: katika nchi tambarare
  rationale: בְּאֶרֶץ lina maana ya “katika nchi,” na מִישׁוֹר ni sehemu tambarare au nyofu; tafsiri hii huhifadhi taswira ya mahali salama pasipo vikwazo na ukaribu wa muundo wa chanzo.
theological_decisions:
- issue: Iwapo רוּחֲךָ itafsiriwe “roho wako” au “Roho wako”
  choice: Roho wako mwema
  alternative: roho wako mwema
  rationale: Kwa kuwa mtunga zaburi anamwambia Mungu moja kwa moja na kusema “Roho wako,” usomaji wa kawaida zaidi ni Roho wa Mungu. Hata hivyo, Kiebrania hakina utofautishaji wa herufi kubwa na ndogo, hivyo tanbihi inahifadhi uwezekano wa kuelewa kirai hiki kwa ujumla zaidi kama roho au mwelekeo mwema wa Mungu.
- issue: Iwapo אֶרֶץ מִישׁוֹר ni mahali halisi au taswira ya mwenendo wa unyofu
  choice: katika nchi tambarare
  alternative: katika njia ya unyofu
  rationale: Maana ya kimsingi ya taswira ya mahali imehifadhiwa bila kuondoa uwezekano wa maana ya kitamathali ya mwendo ulio salama au mnyofu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala. “Nifundishe,” “kwa maana,” na “aniongoze” ni maneno yanayoeleweka kwa urahisi. “Nchi tambarare” huhifadhi taswira ya Kiebrania kuliko kuibadili moja kwa moja kuwa maadili au njia ya mfano.
