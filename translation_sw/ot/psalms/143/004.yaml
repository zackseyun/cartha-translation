translation:
  language: sw
  text: Na roho yangu inazimia ndani yangu; moyo wangu umepigwa na bumbuazi ndani yangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Roho yangu imelemewa ndani yangu; moyo wangu umekuwa ukiwa ndani yangu.”
