lexical_decisions:
- source_word: וַתִּתְעַטֵּף
  choice: inazimia
  rationale: Katika muktadha wa maombolezo, kitenzi hiki kinaeleza kudhoofika au kulemewa kwa utu wa ndani. “Inazimia” ni Kiswahili cha kawaida kinachohifadhi picha ya nguvu za ndani kupungua.
- source_word: עָלַי
  choice: ndani yangu
  rationale: Ingawa kihalisi ni “juu yangu,” hapa hali hiyo inaipata roho ya mtunga zaburi ndani ya nafsi yake; “ndani yangu” pia huendeleza usambamba na בְּתוֹכִי.
- source_word: רוּחִי
  choice: roho yangu
  rationale: Hapa רוּחַ ni uhai au utu wa ndani wa mtunga zaburi, si pumzi tu wala Roho Mtakatifu. “Roho yangu” huhifadhi maana hiyo na usambamba na “moyo wangu.”
- source_word: בְּתוֹכִי
  choice: ndani yangu
  rationale: Kirai hiki kinaonyesha wazi hali iliyomo katika utu wa ndani; “ndani yangu” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: יִשְׁתּוֹמֵם
  choice: umepigwa na bumbuazi
  rationale: Kitenzi kinaweza kueleza kufanywa ukiwa, kushangazwa sana, au kubaki katika hali ya kufadhaika. “Umepigwa na bumbuazi” ni usemi wa asili unaowasilisha mshtuko na kuvurugika kwa ndani bila kuufanya moyo kuwa kitu kilicho ukiwa kihalisi.
- source_word: לִבִּי
  choice: moyo wangu
  rationale: “Moyo” ni kisawe cha kawaida cha לֵב na hapa hueleza utu wa ndani, pamoja na mawazo na hisia.
