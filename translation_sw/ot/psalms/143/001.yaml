base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/001.yaml
  text: A psalm of David[a]. O Yahweh, hear my prayer; give ear to my pleas for mercy. In your faithfulness answer me[c][b], in your righteousness.
translation:
  language: sw
  text: 'Zaburi ya Daudi.[a]


    Ee Yahwe, sikia sala yangu;

    tega sikio kwa maombi yangu ya kuomba rehema.[b]


    Kwa uaminifu wako unijibu,[c]

    kwa haki yako.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihusishi cha Kiebrania kinaweza kuonyesha uandishi wa Daudi, uhusiano naye, au wakfu kwake.
    reason: lexical_alternative
  - marker: b
    text: Au “dua zangu” au “maombi yangu ya kusihi.”
    reason: lexical_alternative
  - marker: c
    text: Au “Katika uaminifu wako unijibu”; maneno ya Kiebrania yanaweza pia kueleweka kuwa ombi linalotegemea uaminifu wa Mungu.
    reason: lexical_alternative
  - marker: d
    text: Au “kwa uadilifu wako” au “katika haki yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Ni istilahi ya kawaida na iliyozoeleka kwa aina hii ya wimbo wa ibada katika kichwa cha zaburi.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Muundo huu wa Kiswahili ni wa kawaida na hauamui kabisa ikiwa Daudi ndiye mtunzi, mhusika anayehusishwa nayo, au aliyelengwa kuipewa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: שְׁמַע תְּפִלָּתִי
  choice: sikia sala yangu
  rationale: Hutoa kwa uwazi amri ya kusikia pamoja na nomino ya umoja yenye kiambishi cha nafsi ya kwanza.
- source_word: הַאֲזִינָה
  choice: tega sikio usikie
  rationale: Nahau ya Kiswahili hudumisha picha ya kishairi na mkazo wa kusikiliza kwa makini.
- source_word: תַּחֲנוּנַי
  choice: maombi yangu ya rehema
  rationale: Neno hilo linaashiria maombi ya dhati ya kuomba fadhili au rehema, si maombi ya kawaida tu.
- source_word: בֶּאֱמֻנָתְךָ
  choice: Kwa uaminifu wako
  rationale: אֱמוּנָה hapa ni kutegemeka au uaminifu wa Mungu; kihusishi kinaweza kueleza namna au msingi wa ombi.
- source_word: עֲנֵנִי
  choice: unijibu
  rationale: Hii ndiyo maana ya moja kwa moja ya kitenzi katika muktadha wa sala, bila kuongeza wazi wazo la jibu linalokubaliwa.
- source_word: בְּצִדְקָתֶךָ
  choice: kwa haki yako
  rationale: Haki hufikisha wazo la tabia nyofu na ya kiadilifu ya Mungu, huku uwezekano wa maana ya utekelezaji wa haki ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; kulitohowa kama Yahwe huhifadhi jina badala ya kuliweka cheo.
- issue: Msingi au namna ya Mungu kujibu
  choice: Kwa uaminifu wako ... kwa haki yako
  alternative: Katika uaminifu wako ... katika haki yako
  rationale: Kihusishi בְּ kinaweza kuonyesha namna, nyanja, au msingi wa ombi. Tafsiri kuu ya Kiswahili inabaki ya kishairi bila kufafanua kupita kiasi uhusiano huo.
- issue: Maana ya צְדָקָה katika ombi
  choice: haki
  alternative: utekelezaji wa haki
  rationale: Neno linaweza kueleza unyofu wa Mungu au haki yake ya kuhukumu. 'Haki' huhifadhi upana huo kuliko kulibana kuwa hukumu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sala ulio wa sasa, wenye heshima na wa kishairi. Usambamba wa vitenzi “sikia” na “tega sikio usikie,” pamoja na jozi “uaminifu” na “haki,” umehifadhiwa. Jina “Yahwe” limetumiwa moja kwa moja.
