  text: וְ/אַל תָּב֣וֹא בְ֭/מִשְׁפָּט אֶת עַבְדֶּ֑/ךָ כִּ֤י לֹֽא יִצְדַּ֖ק לְ/פָנֶ֣י/ךָ כָל חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/002.yaml
  text: And do not enter into judgment with your servant[a], for no living one is righteous before you.
translation:
  language: sw
  text: Wala usiingie katika hukumu na mtumishi wako, kwa maana hakuna aliye hai ambaye ni mwadilifu mbele zako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana hakuna aliye hai atakayehesabiwa kuwa na haki mbele zako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַל
  choice: Wala usiingie
  rationale: Kiunganishi pamoja na katazo kinaendeleza ombi la mstari uliotangulia; “wala” linaunganisha mtiririko bila kulazimisha wazo la upinzani.
- source_word: תָּב֣וֹא בְ֭/מִשְׁפָּט
  choice: usiingie katika hukumu
  rationale: Muungano huu ni usemi wa kisheria unaomaanisha kuendesha shauri au kuhukumu; tafsiri hii inadumisha taswira ya mahakama na inaeleweka kwa Kiswahili cha sasa.
- source_word: אֶת עַבְדֶּ֑/ךָ
  choice: na mtumishi wako
  rationale: Ingawa אֵת kwa kawaida ni kiashiria cha yambwa, katika usemi huu wa kisheria uhusiano unaelezwa kiasili kwa “na.” “Mtumishi” linafaa kwa sajili ya sala na halisisitizi bila sababu hali ya utumwa.
- source_word: כִּ֤י
  choice: kwa maana
  rationale: Linatambulisha sababu ya ombi kwa lugha ya kishairi iliyo wazi na yenye heshima.
- source_word: לֹֽא יִצְדַּ֖ק
  choice: hakuna ... ambaye ni mwadilifu
  rationale: Qal ya צדק inaweza kumaanisha kuwa mwadilifu au kuonekana kuwa na haki katika hukumu. “Ni mwadilifu” hudumisha dai pana, huku muktadha wa hukumu ukihifadhi maana ya kisheria.
- source_word: לְ/פָנֶ֣י/ךָ
  choice: mbele zako
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kuwapo mbele za Mungu na kupimwa naye.
- source_word: כָל חָֽי
  choice: hakuna aliye hai
  rationale: Chini ya ukanushi, maana ya “kila aliye hai” ni ukanushi wa wote. Kauli hii ni ya asili na inahifadhi upana wa Kiebrania bila kuelekezwa kwa vitu visivyo watu.
theological_decisions:
- issue: Maana ya kisheria dhidi ya maana ya kimaadili ya יִצְדַּק mbele ya hukumu ya Mungu
  choice: “hakuna aliye hai ambaye ni mwadilifu mbele zako”
  alternative: “hakuna aliye hai atakayehesabiwa kuwa na haki mbele zako”
  rationale: Matini inaunganisha taswira ya mahakama na ungamo pana kuhusu kutoweza kwa mwanadamu kusimama akiwa mwadilifu mbele za Mungu. Matini kuu inadumisha maana pana, na tanbihi inahifadhi uwezekano mkubwa wa tafsiri ya kisheria bila kuingiza mfumo wa mafundisho wa baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na mkondo wa kishairi. “Wala” linaendeleza sala, na “kuingia katika hukumu na” linadumisha taswira ya kisheria ya Kiebrania.
