base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/009.yaml
  text: Deliver me from my enemies[a], O Yahweh; in you I have taken refuge.
translation:
  language: sw
  text: Uniokoe kutoka kwa adui zangu, Ee Yahwe; kwako nimekimbilia kupata hifadhi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri ya karibu zaidi, “kwako nimejificha” au “kwako nimetafuta hifadhi.” Nahau ya Kiebrania inaeleza kutafuta hifadhi kwa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Uniokoe
  rationale: Kauli ya amri ya Hiphil yenye kiambishi cha nafsi ya kwanza umoja ni ombi la moja kwa moja la kuokolewa au kunusuriwa; “uniokoe” ni ya kawaida, yenye uzito, na inafaa katika sala ya zaburi.
- source_word: מֵאֹיְבַי
  choice: kutoka kwa adui zangu
  rationale: Kihusishi מִן kinaonyesha kuondolewa au kutenganishwa, na אֹיְבַי humaanisha moja kwa moja “adui zangu.”
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la Mungu lenye herufi nne limetoholewa kama “Yahwe,” huku “Ee” ikionyesha kuwa mtunga-zaburi anamwita Mungu moja kwa moja.
- source_word: אֵלֶיךָ כִסִּתִי
  choice: kwako nimekimbilia kupata hifadhi
  rationale: Ingawa maneno hayo yanaweza kutafsiriwa kwa karibu zaidi kuwa “kwako nimejificha,” katika muktadha huu yanaonyesha kutafuta ulinzi kwa Mungu. Tafsiri iliyochaguliwa inawasilisha maana hiyo kwa Kiswahili cha kawaida huku “kwako” ikiwekwa mbele ili kuhifadhi mkazo wa chanzo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi kama jina bila kulibadilisha kuwa cheo.
- issue: Maana ya אֵלֶיךָ כִסִּתִי
  choice: kwako nimekimbilia kupata hifadhi
  alternative: kwako nimejificha
  rationale: Kauli hiyo ina taswira ya kujificha lakini hapa huonyesha kumtegemea Mungu kwa ulinzi. Tafsiri kuu inatoa maana ya kimuktadha, na tanbihi huhifadhi tafsiri ya karibu zaidi na umbo la Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio “kwako nimekimbilia” huhifadhi mkazo wa אֵלֶיךָ mwanzoni mwa kishazi; “kupata hifadhi” hufafanua kusudi la kukimbilia bila kuondoa taswira ya kutafuta usalama.
