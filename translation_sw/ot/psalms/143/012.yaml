base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/012.yaml
  text: And in your steadfast love you will cut off my enemies[a], and you will destroy all the adversaries of my soul[b], for I am your servant.
translation:
  language: sw
  text: 'Na katika upendo wako wa kudumu utawakatilia mbali adui zangu[a],

    na utawaangamiza wote wanaoitesa nafsi yangu[b],

    kwa maana mimi ni mtumishi wako.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa upendo wako wa kudumu”; kihusishi cha Kiebrania kinaweza kuonyesha chombo cha tendo, pamoja na mazingira au msingi wake.
    reason: lexical_alternative
  - marker: b
    text: “Nafsi yangu” pia inaweza kumaanisha “maisha yangu” au, kwa urahisi, “mimi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְחַסְדְּךָ
  choice: Na katika upendo wako wa kudumu
  rationale: חֶסֶד inaonyesha upendo mwaminifu, fadhili na rehema za Mungu. “Upendo wa kudumu” ni Kiswahili cha kawaida kinachohifadhi wazo la upendo thabiti na mwaminifu; “katika” linaonyesha mazingira au msingi wa tendo, huku maana ya chombo ikiendelea kuwa uwezekano.
- source_word: תַּצְמִית
  choice: utawakatilia mbali
  rationale: Hifili ya צמת ina maana ya kusababisha kukoma au kuangamiza. “Kuwakatilia mbali” ni usemi wenye nguvu unaotofautisha kitenzi hiki na וְהַאֲבַדְתָּ bila kupunguza ukali wake.
- source_word: אֹיְבָי
  choice: adui zangu
  rationale: Tafsiri ya moja kwa moja ya nomino ya wingi yenye kiambishi cha nafsi ya kwanza umoja.
- source_word: וְהַאֲבַדְתָּ
  choice: na kuwaangamiza
  rationale: Hifili ya אבד humaanisha kusababisha kuangamia. “Kuwaangamiza” ni neno la kawaida na lenye nguvu linalohifadhi lugha ya hukumu.
- source_word: כָּל צֹרֲרֵי נַפְשִׁי
  choice: wote wanaoitesa nafsi yangu
  rationale: צרר huonyesha uadui, kubana au kutesa. Muundo wa kitenzi ni wa asili zaidi katika Kiswahili kuliko “wapinzani wa nafsi yangu,” huku “nafsi yangu” ikihifadhi nahau na upana wa נֶפֶשׁ.
- source_word: כִּי אֲנִי עַבְדֶּךָ
  choice: kwa maana mimi ni mtumishi wako
  rationale: כִּי inatoa msingi wa ombi, na עֶבֶד katika sala hii inaonyesha unyenyekevu, kumilikiwa na Mungu na kumtumikia; “mtumishi” linafaa zaidi kuliko neno linalosisitiza taasisi ya utumwa.
theological_decisions:
- issue: Lugha ya maombi ya hukumu dhidi ya adui
  choice: Kuhifadhi kauli yenye nguvu kwamba Mungu atawakatilia mbali na kuwaangamiza adui za mtunga zaburi.
  alternative: Kulainisha kuwa “kuwashinda” au “kuwanyamazisha.”
  rationale: Vitenzi vya Kiebrania ni vikali. Tafsiri haipaswi kuondoa mvutano wa sala hii ya hukumu ya Mungu katika mazingira ya mateso na uaminifu wa agano.
- issue: Maana ya נַפְשִׁי
  choice: nafsi yangu
  alternative: maisha yangu; mimi
  rationale: “Nafsi yangu” huhifadhi taswira ya kishairi na upana wa neno la Kiebrania bila kulazimisha mtazamo kwamba mwili na nafsi ni vitu viwili vinavyotenganishwa kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wenye heshima lakini unaoeleweka kwa msomaji wa kawaida. Mistari mitatu inafuata ulinganifu wa kishairi wa Kiebrania. Lugha kali ya hukumu imehifadhiwa, na vitenzi viwili tofauti vimetumiwa ili kuakisi tofauti ya צמת na אבד.
