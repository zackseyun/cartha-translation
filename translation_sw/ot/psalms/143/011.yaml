  yaml_path: translation/ot/psalms/143/011.yaml
  text: For the sake of your name[a], O Yahweh, preserve my life[d][c][b]; in your righteousness bring my soul out of distress.
translation:
  language: sw
  text: Kwa ajili ya jina lako, Ee Yahwe, unihifadhi hai[a]; kwa haki yako[b] uitoe nafsi yangu[c] katika dhiki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unihuisha” au “unipe uhai.” Kitenzi cha Kiebrania kinaweza kumaanisha kuhifadhi hai, kuhuisha, au kurejesha nguvu za uhai.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika haki yako” au “kwa uadilifu wako.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania, “nafsi yangu”; hapa inaweza kumaanisha “mimi” au “maisha yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שִׁמְךָ
  choice: Kwa ajili ya jina lako
  rationale: Inahifadhi ombi linalotegemea heshima na sifa ya Mungu, huku ikibakiza tamathali ya kibiblia ya ‘jina’.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linawasilisha jina binafsi la Mungu lililoandikwa kwa herufi יהוה, badala ya kulibadilisha kuwa cheo.
- source_word: תְּחַיֵּנִי
  choice: unihifadhi hai
  rationale: Kauli ya Piel ya חיה hapa inaweza kumaanisha kudumisha uhai au kuurudisha; katika ombi la kuokolewa kutoka hatarini, ‘unihifadhi hai’ ni ya asili na haifungi maana katika ufufuo.
- source_word: בְּצִדְקָתְךָ
  choice: kwa haki yako
  rationale: ‘Kwa’ huwasilisha kwa kawaida matumizi ya kiutendaji ya ב, na ‘haki’ linaweza kujumuisha unyoofu, uadilifu, na kutenda kwa haki kwa Mungu.
- source_word: תוֹצִיא מִצָּרָה
  choice: unitoe katika dhiki
  rationale: Inadumisha taswira halisi ya Hiphil ya יצא, ‘kutoa nje,’ na maana ya צָרָה kama dhiki au taabu.
- source_word: נַפְשִׁי
  choice: -ni katika ‘unitoe’
  rationale: נפש katika muktadha huu ni nafsi ya msemaji kwa maana ya ‘mimi’ au ‘maisha yangu’; Kiswahili cha kawaida huieleza kwa kiambishi cha yambwa ‘-ni’ bila kuingiza wazo finyu la nafsi isiyo ya mwili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ina jina la agano moja kwa moja. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kuweka cheo mahali pake.
- issue: Maana ya צדקה katika ombi la ukombozi
  choice: haki
  alternative: uadilifu
  rationale: ‘Haki’ ni neno pana na la kawaida katika Kiswahili cha Biblia, likihifadhi mvutano kati ya unyoofu wa Mungu, hukumu yake ya haki, na uaminifu wake wa kuokoa.
- issue: Maana ya נפש katika kishazi cha mwisho
  choice: mimi, ikiwakilishwa na ‘-ni’
  alternative: nafsi yangu; maisha yangu
  rationale: Katika nahau ya Kiebrania נפש mara nyingi humaanisha mtu mwenyewe au uhai wake. Tafsiri ‘unitoe’ ni ya asili na haipendekezi mgawanyo wa mwili na nafsi ambao mstari haulazimishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Muundo wa vipashio viwili na ombi la moja kwa moja umehifadhiwa; ‘ee’ linaonyesha mwito wa heshima bila lugha ya kizamani.
