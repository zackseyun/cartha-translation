  yaml_path: translation/ot/psalms/143/000.yaml
  text: A psalm of David. O LORD, hear my prayer; give ear to my pleas for mercy! In your faithfulness answer me, in your righteousness!
translation:
  language: sw
  text: 'Zaburi ya Daudi.


    Ee BWANA, usikie sala yangu;

    sikiliza maombi yangu ya rehema![a]


    Nijibu kwa uaminifu wako,[b]

    kwa haki yako.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dua zangu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika uaminifu wako”; Kiebrania pia kinaweza kueleweka kuwa ombi linategemezwa na uaminifu wa Mungu.
    reason: lexical_alternative
  - marker: c
    text: Au, “katika haki yako” au “kwa uadilifu wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Neno hili humaanisha wimbo wa ibada, hasa zaburi; “Zaburi” ni neno la kawaida na linalofaa katika muktadha huu.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kiambishi לְ katika vichwa vya zaburi kinaweza kuonyesha uhusiano na Daudi, ikiwemo utunzi au wakfu; “ya Daudi” huhifadhi ufupi na kiwango fulani cha upeo huo.
- source_word: הַאֲזִינָה
  choice: tega sikio usikie
  rationale: Nahau hii ya Kiswahili huwasilisha ombi la kusikiliza kwa makini, tofauti kidogo na שְׁמַע iliyotafsiriwa “sikia.”
- source_word: תַּחֲנוּנַי
  choice: maombi yangu ya kuomba rehema
  rationale: Nomino hiyo ni maombi ya dhati yanayoomba fadhili au rehema; tafsiri hii ni wazi kwa msomaji wa sasa.
- source_word: בֶּאֱמֻנָתְךָ
  choice: kwa uaminifu wako
  rationale: בְּ inaweza kueleza msingi au njia ya jibu; “kwa” huhifadhi uwezekano huo bila kuongeza maelezo yasiyomo.
- source_word: בְּצִדְקָתֶךָ
  choice: kwa haki yako
  rationale: צְדָקָה hapa inaweza kueleza haki au uadilifu wa Mungu kama msingi wa jibu; “haki” ni ya asili na hubakiza mvutano wa kitheolojia.
theological_decisions:
- issue: Ombi lijibiwe katika/ kwa uaminifu na haki ya Mungu
  choice: Unijibu kwa uaminifu wako, kwa haki yako
  alternative: Unijibu katika uaminifu wako, katika uadilifu wako
  rationale: Muundo wa Kiebrania unaweza kueleweka kama namna au msingi wa jibu. “Kwa” ni wa kawaida katika Kiswahili na hauamui kupita kiasi kama ni chombo, msingi, au sifa inayodhihirishwa.
- issue: Maana ya לְדָוִד katika kichwa
  choice: Zaburi ya Daudi
  alternative: Zaburi kwa ajili ya Daudi
  rationale: Uhusiano unaoonyeshwa na לְ unaweza kuwa mpana. Mapokeo ya kichwa “ya Daudi” ni mafupi na ya kawaida bila kudai kwa uwazi zaidi ya Kiebrania kuhusu utunzi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Jina la agano יהוה limewasilishwa kwa desturi kama “BWANA.” Mistari imepangwa kishairi, na mwili wote wa mstari umejumuishwa baada ya kichwa.
