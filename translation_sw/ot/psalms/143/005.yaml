base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/005.yaml
  text: I remember the days of old[a]; I meditate on all your work[b]; I muse on the work of your hands.
translation:
  language: sw
  text: Ninakumbuka siku za kale[a]; natafakari kazi zako zote; nayawaza matendo ya mikono yako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nilikumbuka siku za kale.” Hali timilifu ya kitenzi cha Kiebrania inaweza kutafsiriwa kwa wakati uliopita au kama tendo la sasa la kukumbuka katika ushairi.
    reason: lexical_alternative
  - marker: b
    text: Au, “ninayatafakari.” Kitenzi cha Kiebrania kinaweza pia kuwa na maana ya kusema au kutamka, lakini hapa muktadha unapendelea wazo la kutafakari.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַרְתִּי
  choice: Ninakumbuka
  rationale: Kitenzi cha Kiebrania katika hali timilifu kinaweza kueleza kukumbuka kulikotokea au tendo la sasa la kurudisha jambo akilini. Wakati wa sasa unasikika kwa u自然 katika ushairi huu huku tanbihi ikihifadhi uwezekano wa wakati uliopita.
- source_word: יָמִים מִקֶּדֶם
  choice: siku za kale
  rationale: Huelekeza kwenye nyakati za zamani. Usemi huu ni mfupi, wa kishairi, na unaeleweka katika Kiswahili sanifu.
- source_word: הָגִיתִי
  choice: natafakari
  rationale: הגה hapa hutoa wazo la kuwaza kwa makini au kutafakari. ‘Natafakari’ ni ya kawaida na inafaa mfuatano wa mawazo katika mstari huu.
- source_word: בְּכָל פָּעֳלֶךָ
  choice: kazi zako zote
  rationale: פֹּעַל inaweza kumaanisha kazi, tendo, au shughuli. Wingi wa Kiswahili pamoja na ‘zote’ unaeleza kwa kawaida maana ya jumla ya Kiebrania.
- source_word: בְּמַעֲשֵׂה יָדֶיךָ
  choice: matendo ya mikono yako
  rationale: Tafsiri hii huhifadhi taswira halisi ya mikono ya Mungu na haibadili usemi huo kuwa maelezo ya kufasiri zaidi.
- source_word: אֲשׂוֹחֵחַ
  choice: nayawaza
  rationale: שׂיח inaweza kueleza kutafakari, kuwaza, au kusema. Katika usambamba na הָגִיתִי, maana ya kutafakari ndiyo inayofaa zaidi; ‘nayawaza’ pia huitofautisha na ‘natafakari’ bila kuvunja usambamba.
