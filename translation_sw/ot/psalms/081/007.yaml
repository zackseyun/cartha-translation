base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/007.yaml
  text: In distress you called[a], and I rescued you; I answered you in the hiding place of thunder; I tested you at the waters of Meribah[b]. Selah
translation:
  language: sw
  text: Katika dhiki uliita, nami nikakuokoa; nilikujibu katika mahali pa siri pa ngurumo[a]; nilikujaribu kwenye maji ya Meriba[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maficho ya ngurumo,” au “kutoka katika mahali pa siri pa ngurumo.” Taswira ya Kiebrania huenda inaonyesha uwepo wa Mungu uliofichika katika dhoruba.
    reason: lexical_alternative
  - marker: b
    text: Meriba linakumbusha tukio la jangwani ambako Mungu aliwajaribu Israeli, nao wakagombana kwa sababu ya maji (Kut. 17:1–7; Hes. 20:1–13).
    reason: cross_reference
lexical_decisions:
- source_word: בַּצָּרָה
  choice: Katika taabu
  rationale: Nomino צָרָה humaanisha taabu, dhiki, au shida. “Katika taabu” ni Kiswahili cha kawaida na hudumisha hali iliyoelezwa bila kubainisha aina ya taabu.
- source_word: קָרָאתָ
  choice: uliniita
  rationale: Katika muktadha huu קרא ni kuita au kulilia msaada. Kiswahili huhitaji kirai kamili zaidi kuliko “uliita”; kiambishi “-ni-” kinaonyesha Mungu anayeitwa, jambo linaloeleweka wazi kutokana na usemi wa nafsi ya kwanza.
- source_word: וָאֲחַלְּצֶךָּ
  choice: nami nikakuokoa
  rationale: Kitenzi חלץ katika Hifili humaanisha kutoa hatarini, kukomboa, au kuokoa. “Nikakuokoa” ni cha asili katika Kiswahili cha sasa na kinafaa katika muktadha wa ukombozi wa Israeli.
- source_word: אֶעֶנְךָ
  choice: nilikujibu
  rationale: ענה hapa ni kujibu au kuitikia. “Nilikujibu” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: בְּסֵתֶר רַעַם
  choice: katika maficho ya ngurumo
  rationale: סֵתֶר ni mahali pa kujificha, maficho, au mahali pa siri. “Katika maficho ya ngurumo” huhifadhi taswira ya kishairi na maana ya kawaida ya kihusishi בְּ, bila kuamua kwamba jibu lilitoka huko badala ya kutolewa humo.
- source_word: אֶבְחָנְךָ
  choice: nilikujaribu
  rationale: בחן humaanisha kujaribu au kuchunguza ili kuthibitisha hali au ubora. “Nilikujaribu” ni wazi na hudumisha maana bila kuifanya iwe adhabu pekee.
- source_word: עַל מֵי מְרִיבָה
  choice: kwenye maji ya Meriba
  rationale: עַל inaweza kuwa na maana ya mahali katika muktadha huu. “Kwenye maji ya Meriba” ni ya kawaida katika Kiswahili na huhifadhi jina la mahali kwa unukuzi.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya alama hii ya kiliturujia au kimuziki haijulikani kwa uhakika; kwa hiyo imenukuliwa badala ya kutafsiriwa kwa kubahatisha.
theological_decisions:
- issue: Asili ya usemi wa Mungu na marejeo ya matukio ya jangwani
  choice: Aya imetafsiriwa kama Mungu akisema moja kwa moja na kukumbuka mwito wa Israeli, wokovu wake, jibu lililohusishwa na ngurumo, na kujaribiwa kwake huko Meriba.
  alternative: Kufanya “maficho ya ngurumo” kuwa rejeo la wazi na la pekee la Sinai, au kueleza jaribu hilo kama adhabu tu.
  rationale: 'Kiebrania kinaonyesha wazi usemi wa Mungu katika nafsi ya kwanza, lakini marejeo kamili ya “maficho ya ngurumo” hayana uhakika: yanaweza kukumbusha Sinai, kujidhihirisha kwa Mungu katika dhoruba, au uwepo wake uliofichika. Tafsiri hudumisha taswira na mvutano huo bila kuufungia katika ufafanuzi mmoja.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi wenye hadhi lakini unaoeleweka kwa wasomaji wa kawaida. Umoja wa nafsi ya pili umehifadhiwa kama usemi kwa Israeli kwa pamoja. “Maficho ya ngurumo” limechaguliwa ili kuhifadhi fumbo la taswira ya Kiebrania.
