  text: 'For the choir director: according to the Gittith[a]. Of Asaph.'
translation:
  language: sw
  text: 'Kwa kiongozi wa waimbaji: kwa Githithi[a]. Ya Asafu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: Githithi. Huenda neno hili linataja mpangilio wa muziki, ala, au jina la melodi, lakini maana yake kamili haijulikani; huenda pia lilihusiana na mji wa Gathi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza wa waimbaji
  rationale: Katika vichwa vya zaburi, neno hili humwelekezea anayesimamia uimbaji au utendaji wa muziki. Tafsiri hii ni ya kawaida na inaeleweka kwa Kiswahili cha sasa.
- source_word: עַל
  choice: kwa
  rationale: Hapa kihusishi kinaanzisha maelekezo ya kimuziki, huenda ala, mtindo, au jina la melodi; “kwa” huacha uhusiano huo wazi bila kuulazimisha.
- source_word: הַגִּתִּית
  choice: Githithi
  rationale: Maana kamili ya istilahi hii ya Kiebrania haijulikani. Kuinakili kwa herufi za Kiswahili huepuka kuamua bila uhakika kwamba ni ala, mtindo, au melodi.
- source_word: לְאָסָף
  choice: Zaburi ya Asafu
  rationale: Kihusishi לְ pamoja na jina kinaweza kuonyesha uandishi, uhusiano, au mkusanyo. “Zaburi ya Asafu” ni kichwa cha asili katika Kiswahili na kinadumisha upana huo kuliko “iliyoandikwa na Asafu” au “kwa ajili ya Asafu.”
