  text: But he would feed him with the finest wheat[b][a], and with honey from the rock I would satisfy you.
translation:
  language: sw
  text: Lakini angemlisha kwa ngano bora kabisa[b][a], nami ningekushibisha kwa asali itokayo mwambani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mafuta ya ngano”; nahau ya Kiebrania humaanisha ngano iliyo bora au teule zaidi.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania hubadilisha nafsi: “angemlisha ... nami ningekushibisha.” Huenda umoja hapa unamrejelea Israeli kama taifa.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּאֲכִילֵהוּ
  choice: angemlisha
  rationale: Hifili ya אכל ina maana ya ‘kumlisha’. Muundo wa masharti unaoendelea kutoka mstari uliotangulia unaelezwa kwa ‘angemlisha’; kiambishi cha nafsi ya tatu umoja kinahifadhiwa.
- source_word: מֵחֵלֶב חִטָּה
  choice: kwa ngano iliyo bora kabisa
  rationale: חֵלֶב kwa maana halisi ni ‘mafuta’, lakini inapohusishwa na mazao humaanisha sehemu bora au teule zaidi. Kiswahili hiki kinawasilisha maana ya nahau kwa njia ya kawaida.
- source_word: וּמִצּוּר
  choice: kutoka mwambani
  rationale: צוּר ni mwamba au jabali. Muundo huu unahifadhi taswira halisi ya asali inayotoka mwambani.
- source_word: דְּבַשׁ
  choice: asali
  rationale: Hili ndilo neno la kawaida na la moja kwa moja katika muktadha huu.
- source_word: אַשְׂבִּיעֶךָ
  choice: ningekushibisha
  rationale: Hifili ya שבע humaanisha kushibisha au kujaza hata kutosheka. Nafsi ya kwanza ya msemaji na nafsi ya pili ya anayeambiwa zimehifadhiwa.
theological_decisions:
- issue: Mabadiliko ya nafsi ndani ya mstari
  choice: Kuhifadhi ‘angemlisha ... nami ningekushibisha’.
  alternative: Kulainisha kuwa ‘ningekulisha ... ningekushibisha’.
  rationale: Maandiko ya Kiebrania yanabadilika kutoka nafsi ya tatu inayemtaja Israeli kwa umoja hadi nafsi ya kwanza inayesema na Israeli moja kwa moja. Kuhifadhi badiliko hilo huepuka kuoanisha maandishi bila msingi wa lazima.
- issue: Taswira ya wingi wa riziki
  choice: Kuhifadhi ngano bora na asali kutoka mwambani kama taswira halisi za kishairi.
  alternative: Kufasiri ‘mwamba’ moja kwa moja kuwa Mungu katika maandishi makuu.
  rationale: Mstari unaonyesha utoaji wa Mungu kwa taswira za kishairi; tafsiri haipaswi kuingiza ufafanuzi wa kiteolojia ndani ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Angemlisha’ na ‘ningekushibisha’ zinadumisha hali ya jambo ambalo lingetokea kwa sharti pamoja na badiliko la nafsi katika Kiebrania; ‘mwambani’ huhifadhi taswira ya kishairi kwa lugha ya kawaida.
