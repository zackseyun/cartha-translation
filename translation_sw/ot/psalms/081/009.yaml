    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִהְיֶה בְךָ
  choice: Usiwe na ... miongoni mwako
  rationale: Katika hotuba hii ya agano, kitenzi kilichokanushwa kina nguvu ya katazo, si utabiri. Israel inaelekezwa kwa umoja kama jumuiya; “miongoni mwako” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: אֵל זָר
  choice: mungu wa kigeni
  rationale: אֵל hapa ni mungu anayeabudiwa, na זָר humtaja aliye nje ya ibada iliyo halali kwa Israel.
- source_word: וְלֹא תִשְׁתַּחֲוֶה
  choice: wala usiisujudie
  rationale: Umbo lililokanushwa ni katazo. “Kusujudia” huonyesha kuinama katika tendo la ibada na linafaa na kihusishi לְ.
- source_word: אֵל נֵכָר
  choice: mungu asiye wako
  rationale: נֵכָר ni karibu kimaana na זָר lakini si neno lilelile. Kauli hii huhifadhi utofauti wa kishairi bila kudai kwamba ni aina tofauti ya mungu.
theological_decisions:
- issue: Israel inaelekezwa kwa nafsi ya pili umoja ingawa ni jumuiya
  choice: Kutumia umoja “mwako” bila kuifanya kauli ihusu mtu binafsi pekee
  alternative: Kutumia wingi “miongoni mwenu”
  rationale: Kiebrania huihutubia Israel kwa umoja kama taifa. Kiswahili cha umoja kinahifadhi sura hiyo ya agano, huku “miongoni” kikionyesha mazingira ya jumuiya.
- issue: Uhusiano wa זָר na נֵכָר katika ulinganifu wa kishairi
  choice: 'Kutafsiri kwa semi mbili zinazokaribiana: “wa kigeni” na “asiye wako”'
  alternative: Kutafsiri yote mawili “wa kigeni”
  rationale: Maneno ya Kiebrania ni visawe vya karibu. Utofauti mdogo unahifadhi ulinganifu wa kishairi bila kuunda tofauti ya kiteolojia isiyokuwamo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Usiwe na” huwasilisha katazo moja kwa moja; “kusujudia” ni neno la kawaida la muktadha wa ibada.
