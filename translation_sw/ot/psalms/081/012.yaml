translation:
  language: sw
  text: Basi nikamwacha[a] aende katika ukaidi wa moyo wao[b]; wakaenenda katika mashauri yao wenyewe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “nikamwacha,” kwa kiwakilishi cha umoja kinachomtaja Israeli kama taifa moja; tafsiri nyingine husawazisha kuwa “nikawaacha.”'
    reason: lexical_alternative
  - marker: b
    text: Au “ugumu” au “ushupavu wa moyo wao.”
    reason: lexical_alternative
  - marker: c
    text: Au “wakaenenda kulingana na mipango yao wenyewe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲשַׁלְּחֵהוּ
  choice: Basi nikamwacha
  rationale: Kitenzi שׁלח katika muundo huu, pamoja na kiambishi cha nafsi ya tatu umoja, kinaonyesha kuachilia au kumwacha mtu aende kwa njia yake, si kumtuma tu. Umoja umehifadhiwa kwa sababu Kiebrania kinamtaja Israeli kama taifa moja.
- source_word: בִּשְׁרִירוּת
  choice: katika ukaidi
  rationale: שְׁרִירוּת humaanisha ushupavu wa ndani, ukaidi, au kujitawala kwa kiburi. “Ukaidi” ni neno la kawaida na lenye uzito unaofaa katika Kiswahili cha sasa.
- source_word: לִבָּם
  choice: wa moyo wao
  rationale: Kiebrania kina “moyo” katika umoja, lakini kiambishi chake ni cha wingi. Kiswahili “moyo wao” kinahifadhi picha ya mwelekeo wa ndani wa taifa kwa pamoja.
- source_word: יֵלְכוּ
  choice: wakaenda
  rationale: הלך inaweza kumaanisha kutembea au kwenda, na mara nyingi hutumiwa kwa mwenendo wa maisha. Hapa “wakaenda” ni ya asili na inaendeleza simulizi la tendo lililofuata.
- source_word: בְּמוֹעֲצוֹתֵיהֶם
  choice: kwa mashauri yao wenyewe
  rationale: מוֹעֵצָה huonyesha shauri, mpango, au kusudi. “Mashauri yao wenyewe” huhifadhi wazo la kufuata maamuzi yao badala ya shauri la Mungu.
theological_decisions:
- issue: Kubadilika kutoka kiwakilishi cha umoja kwenda wingi
  choice: Kuhifadhi “nikamwacha” katika umoja, kisha “wao/wakaenda” katika wingi
  alternative: 'Kusawazisha sentensi yote kuwa ya wingi: “nikawaacha ... wakaenda”'
  rationale: Maandishi ya Kiebrania yana kiambishi cha umoja mwanzoni, kikimtazama Israeli kama taifa moja, halafu yanatumia wingi. Kuhifadhi mabadiliko hayo kunaonyesha mvutano halisi wa maandishi bila kuusawazisha kimyakimya.
- issue: Uzito wa tendo la Mungu katika hukumu
  choice: “nikamwacha” katika ukaidi wao
  alternative: “nikamtuma” au “nikamruhusu aende”
  rationale: Muktadha unaonyesha Mungu akiwaacha watu wake wafuate ukaidi wao kama matokeo ya kutokumsikiliza. “Nikamwacha” huonyesha kuondolewa kwa ulinzi au uzuiaji bila kuingiza mfumo wa kiteolojia usiotajwa na mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa umoja kisha wingi umehifadhiwa kimakusudi ili kuakisi Kiebrania; tanbihi inaueleza.
