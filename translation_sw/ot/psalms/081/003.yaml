  text: תִּקְע֣וּ בַ/חֹ֣דֶשׁ שׁוֹפָ֑ר בַּ֝/כֵּ֗סֶה לְ/י֣וֹם חַגֵּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/003.yaml
  text: Blow the trumpet at the new moon[a], at the full moon, on the day of our feast.
translation:
  language: sw
  text: 'Pigeni baragumu wakati wa mwezi mpya,

    wakati wa mwezi mpevu[a], siku ya sikukuu yetu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakati wa mwezi uliofunikwa,” au “wakati uliowekwa.” Maana ya neno la Kiebrania כֵּסֶה inajadiliwa; hapa “mwezi mpevu” imetumiwa kwa sababu inalingana na “mwezi mpya” katika rejea hii ya kalenda na mazingira ya sikukuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְעוּ
  choice: Pigeni
  rationale: Kitenzi hiki ni amri ya wingi; katika muktadha wa baragumu humaanisha kulipiga ili litoe sauti. “Pigeni” ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: בַחֹדֶשׁ
  choice: wakati wa mwezi mpya
  rationale: Ingawa חֹדֶשׁ pia inaweza kumaanisha “mwezi,” muktadha wa kalenda ya sikukuu na ulinganifu wake na כֵּסֶה unaunga mkono maana ya “mwezi mpya.”
- source_word: שׁוֹפָר
  choice: baragumu
  rationale: שׁוֹפָר ni pembe iliyotumiwa kutoa ishara katika ibada. “Baragumu” ni neno la Kiswahili linaloeleweka na linafaa katika agizo la kukipiga, bila kulazimisha ufafanuzi wa malighafi yake ndani ya mstari.
- source_word: בַּכֵּסֶה
  choice: wakati wa mwezi mpevu
  rationale: Maana ya כֵּסֶה inajadiliwa. “Mwezi mpevu” inafaa zaidi katika ulinganifu wa wakati wa kalenda na “mwezi mpya,” lakini uwezekano wa “mwezi uliofunikwa” au “wakati uliowekwa” umehifadhiwa katika tanbihi.
- source_word: לְיוֹם
  choice: siku ya
  rationale: Muundo huu unaonyesha uhusiano wa wakati na siku ya sikukuu. Kiswahili “siku ya” ni cha asili na hudumisha maana hiyo kwa ufupi.
- source_word: חַגֵּנוּ
  choice: sikukuu yetu
  rationale: חַג ni sikukuu au sherehe ya kidini, mara nyingi yenye hija. “Sikukuu yetu” ni ya kawaida, yenye hadhi, na huhifadhi kiambishi cha nafsi ya kwanza wingi.
theological_decisions:
- issue: Maana ya בַּכֵּסֶה katika rejea ya kalenda ya sikukuu
  choice: wakati wa mwezi mpevu
  alternative: wakati wa mwezi uliofunikwa; wakati uliowekwa
  rationale: Hili hasa ni suala la kileksika na kimuktadha, si uamuzi wa kimadhehebu. Ulinganifu na “mwezi mpya” pamoja na mazingira ya sikukuu unaunga mkono “mwezi mpevu,” huku tanbihi ikihifadhi maana nyingine zinazowezekana kwa sababu neno la Kiebrania linabishaniwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishairi umehifadhi ulinganifu wa vipindi vya kalenda. “Baragumu” limetumiwa kama neno linaloeleweka kwa chombo cha kutoa ishara katika ibada; utata halisi wa כֵּסֶה umeonyeshwa wazi katika tanbihi.
