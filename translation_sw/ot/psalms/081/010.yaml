base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/010.yaml
  text: I am Yahweh your God[a], who brought you up from the land of Egypt. Open your mouth wide[b], and I will fill it.
translation:
  language: sw
  text: Mimi ni Yahwe, Mungu wako, niliyekupandisha kutoka nchi ya Misri. Fungua kinywa chako kwa upana, nami nitakijaza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Fungua kinywa chako kwa upana ili nikijaze.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי יְהוָה אֱלֹהֶיךָ
  choice: Mimi ni Yahwe, Mungu wako
  rationale: Kirai kisicho na kitenzi kimetafsiriwa kwa kishirikishi cha kawaida cha Kiswahili; “Mimi” linahifadhi msisitizo wa אָנֹכִי, na jina binafsi יְהוָה limetoholewa kuwa “Yahwe.”
- source_word: הַמַּעַלְךָ
  choice: niliyekupandisha
  rationale: Hifili ya עלה inaonyesha Yahwe ndiye aliyesababisha Israeli kupanda au kutoka Misri. “Niliyekupandisha” linahifadhi taswira ya mwendo wa kupanda iliyo katika Kiebrania.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: kutoka nchi ya Misri
  rationale: Hii ni namna ya kawaida na ya asili ya kuwakilisha מן katika kauli inayorejelea Kutoka Misri.
- source_word: הַרְחֶב פִּיךָ
  choice: Fungua kinywa chako wazi
  rationale: Amri ya hifili הַרְחֶב ina maana ya kukifanya kinywa kiwe wazi kwa upana. Kauli hii ni ya asili kwa Kiswahili na inadumisha taswira halisi ya Kiebrania.
- source_word: וַאֲמַלְאֵהוּ
  choice: nami nitakijaza
  rationale: 'Kiambishi cha nafsi ya tatu umoja wa kiume kinarejelea “kinywa”; katika Kiswahili marejeo hayo yanafuata ngeli ya KI-VI: “nitakijaza.” Muunganisho unaweza kueleweka kama ahadi au kusudi, hivyo maana mbadala imewekwa katika tanbihi.'
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la agano, si cheo. “Yahwe” linahifadhi jina hilo bila kulibadilisha kuwa “Bwana.”
- issue: Nguvu ya וַ־ katika וַאֲמַלְאֵהוּ
  choice: nami nitakijaza
  alternative: ili nikijaze
  rationale: Katika muktadha wa amri, muundo huu unaweza kuonyesha matokeo au ahadi ya Mungu, lakini pia unaweza kusomwa kwa maana ya kusudi. Tafsiri kuu inaonyesha ahadi huku tanbihi ikihifadhi uwezekano wa kisarufi wa kusudi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Umoja wa nafsi ya pili katika Kiebrania umehifadhiwa kwa “wako,” “-ku-,” na “chako.”
