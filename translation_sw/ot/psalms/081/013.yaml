  text: Oh[a], that my people would listen to me, that Israel would walk in my ways!
translation:
  language: sw
  text: 'Laiti[a] watu wangu wangenisikiliza,

    Israeli wangeenenda katika njia zangu!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kama tu watu wangu wangenisikiliza, Israeli wangeenenda katika njia zangu!”
    reason: Usomaji mwingine unaowezekana wa לוּ kama kauli ya sharti au tamanio.
lexical_decisions:
- source_word: לוּ
  choice: Laiti
  rationale: Neno hili linaonyesha tamanio lenye huzuni, si sharti la kawaida tu; “Laiti” ni la asili katika Kiswahili na linahifadhi nguvu hiyo ya kihisia.
- source_word: עַמִּי
  choice: watu wangu
  rationale: 'Kiambishi cha nafsi ya kwanza kinaonyesha umilikaji na uhusiano wa agano: “watu wangu.”'
- source_word: שֹׁמֵעַ לִי
  choice: wangenisikiliza
  rationale: Kitenzi שׁמע pamoja na לִי humaanisha kusikiliza kwa makini na kutii, wala si kusikia sauti tu.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la taifa limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: בִּדְרָכַי
  choice: katika njia zangu
  rationale: Taswira ya “njia” inadumishwa; hapa inaashiria mwenendo au namna ya kuishi anayotaka Mungu.
- source_word: יְהַלֵּכוּ
  choice: wangetembea
  rationale: Inahifadhi sitiari ya kutembea kama mwenendo wa maisha na inaendeleza hali ya tamanio iliyoanzishwa na לוּ.
theological_decisions:
- issue: Tamanio la huzuni au kauli ya sharti
  choice: 'Mstari umetafsiriwa kama tamanio la Mungu lenye huzuni: “Laiti ... wangenisikiliza ... wangetembea.”'
  alternative: Kama watu wangu wangenisikiliza, kama Israeli wangetembea katika njia zangu.
  rationale: Katika muktadha huu לוּ linaeleweka vizuri zaidi kama tamanio au maombolezo juu ya kutotii kwa Israeli. Hata hivyo, uwezekano wa maana ya kisharti umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Laiti” huwasilisha kwa kawaida tamanio lenye huzuni; “kutembea katika njia” huhifadhi sitiari ya Kiebrania huku maana yake ya mwenendo ikibaki wazi katika muktadha.
