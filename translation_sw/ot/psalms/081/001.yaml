lexical_decisions:
- source_word: הַרְנִינוּ
  choice: Mwimbieni kwa shangwe
  rationale: Kitenzi cha wingi katika hali ya kuamuru kinamaanisha sifa ya sauti iliyojaa furaha; tafsiri hii inadumisha maana ya kuimba na kushangilia kwa Kiswahili cha kawaida.
- source_word: לֵאלֹהִים
  choice: Mungu
  rationale: Kiambishi ל kinaonyesha anayeelekezewa sifa. Katika muktadha huu אֱלֹהִים humrejelea Mungu wa Israeli kwa umoja.
- source_word: עוּזֵּנוּ
  choice: nguvu yetu
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya nomino inayomaanisha nguvu au uweza, bila kuongeza dhana ya ‘kimbilio’ isiyosemwa wazi hapa.
- source_word: הָרִיעוּ
  choice: mpigieni kelele za shangwe
  rationale: Kitenzi cha wingi katika hali ya kuamuru kinaeleza kupaza sauti kwa nguvu kama tangazo la shangwe au sifa. Usemi huu ni wa asili na unaeleweka katika Kiswahili cha kisasa.
- source_word: לֵאלֹהֵי
  choice: Mungu wa
  rationale: Muundo huu humtaja anayeelekezewa mwito kuwa ‘Mungu wa’ Yakobo; Kiswahili hakihitaji kibainishi kinacholingana na ‘the’ ya Kiingereza.
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Jina la mtu limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
theological_decisions:
- issue: Maana ya אֱלֹהִים katika mistari inayolingana
  choice: Mungu / Mungu wa Yakobo
  alternative: miungu
  rationale: Ingawa umbo la neno linaweza kuonekana la wingi, hapa linamtaja Mungu mmoja wa Israeli; kirai sambamba ‘Mungu wa Yakobo’ kinathibitisha maana ya umoja.
translation_notes:
  register: Lugha ni ya sasa, yenye heshima na inayofaa kwa wimbo wa sifa. ‘Mwimbieni’ na ‘mpigieni’ zinadumisha amri za wingi, huku ‘nguvu yetu’ ikihifadhi usemi mfupi wa Kiebrania.
