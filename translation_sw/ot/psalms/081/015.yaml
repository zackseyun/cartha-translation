  text: Those who hate Yahweh would cringe before him[b][a], and their time would be forever.
translation:
  language: sw
  text: Wale wanaomchukia Yahwe wangejifanya kumtii[a], na wakati wao ungekuwa wa milele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wangejisalimisha kwake kwa unafiki,” au “wangejikunyata mbele yake.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “wakati wao milele.” Hii inaweza kumaanisha muda wao waliopangiwa, hatima yao, au adhabu yao ingedumu bila mwisho.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְשַׂנְאֵי
  choice: wale wanaomchukia
  rationale: Kirai hiki kinatafsiri kihusishi kilichotumiwa kama nomino kwa Kiswahili cha kawaida, huku kikidumisha hali ya kuendelea ya chuki yao.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la Mungu יהוה, likihifadhi jina binafsi badala ya kulibadili kuwa cheo.
- source_word: יְכַחֲשׁוּ לוֹ
  choice: wangejifanya kumtii
  rationale: Katika piel pamoja na ל, כחשׁ inaweza kuonyesha kujisalimisha au kutii kwa unafiki. Tafsiri hii inaweka wazi kwamba utiifu huo si wa kweli, bila kuongeza wazo lisilo katika kitenzi.
- source_word: וִיהִי
  choice: ungekuwa
  rationale: Umbo hili la kimasharti linaendana na mfuatano wa kishairi na hali ya masharti katika muktadha.
- source_word: עִתָּם
  choice: wakati wao
  rationale: עת kimsingi ni ‘wakati’ au ‘majira.’ Tafsiri ya moja kwa moja inadumisha utata kuhusu kama inamaanisha muda waliopangiwa, hatima, au adhabu.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Ni tafsiri fupi, ya kawaida, na ya kishairi ya לְעוֹלָם.
theological_decisions:
- issue: Maana ya kishazi cha mwisho ויהי עתם לעולם
  choice: wakati wao ungekuwa milele
  alternative: adhabu yao ingedumu milele; au muda wao waliopangiwa ungekuwa milele
  rationale: Kiebrania ni kifupi na kina utata. Muktadha unaelekea kwenye hukumu dhidi ya maadui wa Yahwe, lakini nomino yenyewe inamaanisha ‘wakati’; kwa hiyo maandishi makuu hayafanyi dai maalumu zaidi la kiteolojia kuliko chanzo.
- issue: Maana ya יְכַחֲשׁוּ לוֹ
  choice: wangejifanya kumtii
  alternative: wangejisalimisha kwake kwa unafiki; au wangejikunyata mbele yake
  rationale: Kirai kinaweza kuonyesha utiifu wa kujifanya au kujisalimisha kwa kulazimishwa. Chaguo kuu linadumisha kutokuwa kwa kweli kwa utiifu huo, na tanbihi inaonyesha upana wa maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. ‘Wangejifanya kumtii’ ni lugha ya sasa inayoeleweka kwa urahisi; ‘wakati wao’ inadumisha ufupi na utata wa Kiebrania.
