lexical_decisions:
- source_word: שְׂאוּ
  choice: Anzisheni
  rationale: Kitenzi hiki kwa msingi humaanisha kuinua au kuchukua, lakini katika muktadha wa muziki kinatoa wito wa kuanzisha wimbo; ‘anzisheni’ ni Kiswahili cha kawaida na kinaendeleza wazo hilo.
- source_word: זִמְרָה
  choice: wimbo
  rationale: Neno hili linaweza kumaanisha wimbo au muziki, hasa wa sifa; ‘wimbo’ ni pana, wazi, na haliongezi maana ya ‘zaburi’ ambayo haijaainishwa hapa.
- source_word: וּתְנוּ
  choice: na kupiga
  rationale: Kihalisi ni ‘na toeni,’ lakini likitumiwa na ala ya kugongwa humaanisha kuitoa sauti kwa kuipiga. Muundo huu unaunganisha kwa kawaida wito wa kuimba na wa kupiga ala.
- source_word: תֹף
  choice: tari
  rationale: Ni ala ya kugongwa ya aina ya ngoma bapa inayoshikwa mkononi; ‘tari’ ni jina la Kiswahili la ala ya aina hii bila kutumia neno la kizamani.
- source_word: כִּנּוֹר
  choice: kinubi
  rationale: Ni ala ya kale ya nyuzi, kwa kawaida inayofikiriwa kuwa ya jamii ya lyre. ‘Kinubi’ ni neno la kawaida la kibiblia kwa ala hiyo, huku tanbihi ikihifadhi kutokuwa na uhakika kuhusu umbo lake kamili.
- source_word: נָעִים
  choice: chenye sauti nzuri
  rationale: Kivumishi humaanisha yenye kupendeza au kufurahisha; katika muktadha wa ala, ‘chenye sauti nzuri’ kinaonyesha kwa kawaida ubora wa sauti.
- source_word: עִם
  choice: pamoja na
  rationale: Hueleza kuandamana au kuunganishwa kwa ala hizo mbili.
- source_word: נָבֶל
  choice: zeze
  rationale: Ni ala ya nyuzi iliyo tofauti na כִּנּוֹר. ‘Zeze’ hutoa jina tofauti la ala ya nyuzi, bila kudai kwa uhakika umbo lake la kale.
