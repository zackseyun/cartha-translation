lexical_decisions:
- source_word: הֲסִירוֹתִי
  choice: Niliuondoa
  rationale: Kauli ya Hiphil timilifu, nafsi ya kwanza umoja, inaonyesha kwamba msemaji aliondoa kitu; nafsi ya kwanza inafaa na usemi wa Mungu katika zaburi hii.
- source_word: מִסֵּבֶל
  choice: mzigo
  rationale: סֵבֶל kwa kawaida ni mzigo unaobebwa; hapa inalingana kiasili na bega na picha ya kazi ya kulazimishwa.
- source_word: שִׁכְמוֹ
  choice: begani mwake
  rationale: שׁכם ni bega. Kiswahili cha kawaida hutumia umoja katika usemi ‘mzigo begani,’ kama ilivyo katika Kiebrania.
- source_word: כַּפָּיו
  choice: mikono yake
  rationale: Ingawa כף inaweza kumaanisha kiganja, katika muktadha wa kazi ‘mikono’ ndiyo tafsiri ya kawaida na ya wazi.
- source_word: מִדּוּד
  choice: na kikapu
  rationale: דּוּד ni nomino adimu ambayo yaweza kumaanisha chungu au sufuria; ‘kikapu’ kinafaa katika usambamba wa kazi nzito, lakini kutokuwa na uhakika kunahifadhiwa katika tanbihi.
- source_word: תַּעֲבֹרְנָה
  choice: ikaachana
  rationale: Qal isiyotimilifu ya nafsi ya tatu wingi wa kike kutoka עבר ina wazo la kupita au kuondoka. ‘Ikaachana na’ huonyesha kwa Kiswahili asilia kwamba mikono haikushughulika tena na chombo, bila kuingiza sitiari isiyokusudiwa ya kufa.
