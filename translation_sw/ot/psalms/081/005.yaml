  yaml_path: translation/ot/psalms/081/005.yaml
  text: 'He made it a testimony in Joseph when he went out over the land of Egypt[c][b][a]. I heard a language I had not known:'
translation:
  language: sw
  text: 'Aliuweka kuwa ushuhuda katika Yosefu[b], alipotoka dhidi ya nchi ya Misri[a]. Nilisikia[c] lugha ambayo sikuwa nimeijua:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alipotoka juu ya nchi ya Misri.” Kihusishi cha Kiebrania kinaweza pia kumaanisha “juu ya” katika muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: Huenda Yosefu hapa anawakilisha watu wa Israeli, hasa katika mazingira ya kutoka Misri; hata hivyo, jina la Kiebrania “Yosefu” limehifadhiwa.
    reason: cross_reference
  - marker: c
    text: Au, “Ninasikia.” Katika ushairi, kitenzi cha Kiebrania kinaweza kueleweka kuwa cha wakati wa sasa au uliopita.
    reason: alternative_reading
lexical_decisions:
- source_word: עֵדוּת
  choice: ushuhuda
  rationale: Neno hili kimsingi humaanisha ushahidi au ushuhuda, ingawa katika mazingira ya sheria au ibada linaweza pia kumaanisha agizo. “Ushuhuda” huhifadhi maana yake ya msingi bila kuondoa uwezekano huo mpana.
- source_word: בִּיהוֹסֵף
  choice: katika Yosefu
  rationale: Kihusishi בְּ־ kwa kawaida humaanisha “katika” au “pamoja na.” Jina Yosefu limehifadhiwa kama lilivyo katika Kiebrania, badala ya kufasiriwa moja kwa moja kuwa Israeli.
- source_word: שָׂמוֹ
  choice: aliuweka kuwa
  rationale: Kitenzi שׂים humaanisha kuweka, kusimamisha, au kuagiza. Kiambishi cha yambwa kimerejelewa kwa “-u-,” na “kuwa” kinaonyesha kwamba Mungu aliufanya uwe ushuhuda.
- source_word: בְּצֵאתוֹ
  choice: alipotoka kwenda
  rationale: Muundo huu una maana ya wakati, “alipotoka.” Kuongeza “kwenda” kunafanya mwendo unaofuatiwa na עַל usikike kwa kawaida zaidi katika Kiswahili, huku kiwakilishi cha nafsi ya tatu kikibaki bila kutajwa wazi mhusika wake.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: juu ya nchi ya Misri
  rationale: עַל inaweza kumaanisha “juu ya” au “dhidi ya.” Matini kuu inahifadhi taswira ya mwendo au tendo juu ya Misri; maana ya uhasama imewekwa katika tanbihi.
- source_word: שְׂפַת
  choice: lugha
  rationale: Maana ya moja kwa moja ni “mdomo,” lakini hapa ni nahau inayomaanisha lugha au usemi. “Lugha” ni ya kawaida na wazi katika Kiswahili.
- source_word: לֹא יָדַעְתִּי
  choice: ambayo sikuwa nimeijua
  rationale: Muundo huu unaonyesha kwamba lugha hiyo haikuwa imejulikana kabla ya kusikiwa, na hivyo unawakilisha vizuri maana ya wakati uliotangulia.
- source_word: אֶשְׁמָע
  choice: Nilisikia
  rationale: Ingawa umbo la Kiebrania ni imperfect, katika ushairi linaweza kueleweka kama tendo la wakati uliopita. Wakati wa sasa unabaki kuwa uwezekano na umetajwa katika tanbihi.
theological_decisions:
- issue: Yule anayeitwa “Yosefu”
  choice: Jina Yosefu limehifadhiwa katika matini kuu, likiwezekana kuwakilisha watu wa agano katika mazingira ya kutoka Misri.
  alternative: Yosefu anaweza kumaanisha hasa makabila ya kaskazini/Efraimu, au jina hilo linaweza kufasiriwa moja kwa moja kuwa Israeli.
  rationale: Kiebrania kinamtaja Yosefu waziwazi. Kuhifadhi jina hilo huepuka kuweka tafsiri moja ya kitheolojia ndani ya matini.
- issue: Mhusika wa “alipotoka”
  choice: Mhusika hajaelezwa kwa jina, kama ilivyo katika Kiebrania.
  alternative: Kiwakilishi kinaweza kuelekezwa kwa Mungu au kwa Yosefu/Israeli katika tukio la kutoka Misri.
  rationale: Kutomtaja mhusika waziwazi kunahifadhi utata halisi wa kiwakilishi cha Kiebrania badala ya kuutatua kimya kimya.
- issue: Mabadiliko ya msemaji katika kishazi cha mwisho
  choice: Nafsi ya kwanza imehifadhiwa bila kuongeza jina la msemaji.
  alternative: Msemaji anaweza kueleweka kuwa Mungu au mtunga zaburi; kitenzi pia kinaweza kutafsiriwa kwa wakati wa sasa.
  rationale: Matini yenyewe haimtaji msemaji katika kishazi hiki. Tafsiri inahifadhi badiliko la kishairi na mvutano wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa kishairi na utata wa viwakilishi umehifadhiwa kadiri inavyowezekana bila kufanya sentensi iwe ngumu kupita kiasi.
