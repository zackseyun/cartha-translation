  text: In a little while I would subdue their enemies[b][a], and turn my hand against their adversaries.
translation:
  language: sw
  text: Muda si mrefu ningewatiisha adui zao[a], na ningeelekeza mkono wangu dhidi ya wapinzani wao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Upesi ningewatiisha adui zao.” Neno la Kiebrania כִּמְעַט linaweza pia kumaanisha “karibu” kwa kiwango, ingawa maana hiyo haielekei hapa.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “ningeurudisha mkono wangu juu ya wapinzani wao,” nahau inayomaanisha kuelekeza nguvu katika hukumu dhidi yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְעַט
  choice: Kwa muda mfupi
  rationale: Kirai hiki hapa kinaonyesha kipindi kifupi cha wakati au tendo lililo karibu kutokea. Tafsiri hii ni ya kawaida katika Kiswahili na haichukui maana isiyowezekana lakini isiyoelekea hapa ya ‘karibu’ kwa kiwango.
- source_word: אוֹיְבֵיהֶם
  choice: adui zao
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya neno linalomaanisha maadui katika muktadha wa upinzani.
- source_word: אַכְנִיעַ
  choice: ningewatiisha
  rationale: Hifili ya כנע humaanisha kusababisha mtu kutiishwa au kushushwa. ‘Kuwatiisha’ linaonyesha kuwashinda na kuwaweka chini ya mamlaka bila kubainisha njia iliyotumiwa; kiambishi ‘-nge-’ kinahifadhi hali tegemezi inayotokana na muktadha uliotangulia.
- source_word: צָרֵיהֶם
  choice: watesi wao
  rationale: Neno hili humaanisha wapinzani wenye uhasama au wale wanaowaletea wengine dhiki. ‘Watesi’ linatofautisha neno hili na ‘adui’ katika mstari huohuo huku likihifadhi wazo la uadui wenye kudhuru.
- source_word: אָשִׁיב יָדִי
  choice: kuuelekeza mkono wangu dhidi ya
  rationale: Nahau hiyo kihalisi inahusu kuurudisha au kuugeuza mkono, na hapa inaonyesha Mungu akielekeza nguvu yake ya hukumu dhidi ya wapinzani. ‘Kuuelekeza mkono wangu dhidi ya’ huhifadhi sitiari kwa Kiswahili cha asili.
theological_decisions:
- issue: Hali ya tendo la Mungu katika muktadha
  choice: ningewatiisha ... kuuelekeza
  alternative: nitawatiisha ... nitauelekeza
  rationale: Ingawa vitenzi vya Kiebrania vinaweza kutafsiriwa kwa wakati ujao, muktadha wa mistari iliyotangulia unaeleza jambo ambalo Mungu angewafanyia Israeli kama wangemsikiliza. Hali ya ‘-nge-’ inalinda utegemezi huo bila kuugeuza kuwa ahadi isiyo na sharti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Sitiari ya mkono imehifadhiwa, huku hali tegemezi ya muktadha ikiwasilishwa kwa ‘-nge-’.
