lexical_decisions:
- source_word: שְׁמַע
  choice: Sikiliza
  rationale: Ni amri ya nafsi ya pili umoja kutoka שׁמע. “Sikiliza” ni mwito wa moja kwa moja na pia huwezesha mzizi huo kurudiwa mwishoni mwa mstari.
- source_word: עַמִּי
  choice: watu wangu
  rationale: Hifadhi uhusiano wa agano na ndiyo namna ya kawaida na ya asili ya kusema kwa Kiswahili.
- source_word: וְאָעִידָה בָּךְ
  choice: nami nitashuhudia dhidi yako
  rationale: Hifili ya עוד pamoja na בְּ inaweza kumaanisha kutoa ushahidi, kushuhudia kwa uzito, au kuonya. Katika onyo hili la kimungu, “dhidi yako” huhifadhi uwezekano wa maana ya kimahakama bila kuficha njia nyingine za kuelewa kishazi.
- source_word: יִשְׂרָאֵל
  choice: Ee Israeli
  rationale: Ni usemi wa kumwita anayezungumziwa moja kwa moja; “Ee” huhifadhi hadhi na toni ya kishairi.
- source_word: אִם תִּשְׁמַע לִי
  choice: laiti ungenisikiliza
  rationale: אִם hapa inaweza kuwa na nguvu ya tamanio au ombi lenye huzuni. “Laiti ungenisikiliza” ni Kiswahili cha asili kinachowasilisha nguvu hiyo, huku tanbihi ikihifadhi uwezekano wa muundo wa masharti.
theological_decisions:
- issue: Nguvu ya kishazi אִם תִּשְׁמַע לִי
  choice: 'Imetafsiriwa kama tamanio lenye msisitizo: “laiti ungenisikiliza!”'
  alternative: “kama ungenisikiliza” au “ikiwa utanisikiliza”
  rationale: Katika ushairi אִם inaweza kutambulisha tamanio, ingawa umbo lake pia linaweza kusikika kama sharti. Tafsiri kuu inaweka wazi hisia ya ombi, na tanbihi inahifadhi utata wa kimuundo.
- issue: Maana ya וְאָעִידָה בָּךְ
  choice: “nitashuhudia dhidi yako”
  alternative: “nitakuonya” au “nitakushuhudia”
  rationale: Muktadha wa maonyo na kihusishi בְּ vinaweza kutoa maana ya ushahidi unaomkabili mhusika. Tanbihi huhifadhi upana halisi wa kitenzi badala ya kuufunga kwa maana moja pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Umoja wa kisarufi umehifadhiwa katika “yako” na “ungenisikiliza,” kwa kuwa Israeli anazungumziwa kama nafsi moja.
