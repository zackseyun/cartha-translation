  text: Hear[a], my people, and I will testify against you; O Israel[b], if you would listen to me!
translation:
  language: sw
  text: Sikiliza[a], watu wangu, nami nitatoa ushahidi dhidi yako; Ee Israeli, laiti ungenisikiliza![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sikia”; kishazi kinachofuata kinaweza pia kutafsiriwa, “nami nitakuonya,” au “nami nitatoa ushahidi kukuhusu.”
