source:
  edition: WLC
  text: כִּ֤י חֹ֣ק לְ/יִשְׂרָאֵ֣ל ה֑וּא מִ֝שְׁפָּ֗ט לֵ/אלֹהֵ֥י יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/004.yaml
  text: For it is a statute for Israel[a], an ordinance of the God of Jacob.
translation:
  language: sw
  text: 'Kwa maana hiyo ni sheria kwa Israeli,

    agizo la Mungu wa Yakobo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “agizo kwa Mungu wa Yakobo.” Kihusishi cha Kiebrania kinaweza kutafsiriwa hivyo kwa namna ya moja kwa moja zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu ya mwito uliotangulia; “kwa maana” huonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: חֹק
  choice: sheria
  rationale: Neno hili humaanisha jambo lililowekwa au kuamriwa na mwenye mamlaka. “Sheria” ni neno la kawaida na lenye uzito unaofaa katika muktadha huu wa agano na ibada.
- source_word: לְיִשְׂרָאֵל
  choice: kwa Israeli
  rationale: Kihusishi ל hapa kinaonyesha kwamba sheria hiyo imewekwa kwa ajili ya taifa la Israeli na inawahusu.
- source_word: הוּא
  choice: hiyo ni
  rationale: Kiwakilishi kinarejelea tendo la ibada lililoamriwa katika muktadha uliotangulia; “hiyo ni” huweka rejeo hilo wazi na kwa kawaida katika Kiswahili.
- source_word: מִשְׁפָּט
  choice: agizo
  rationale: Katika usambamba huu wa kisheria, neno hili linaonyesha sharti lenye mamlaka, si hukumu ya adhabu. “Agizo” linahifadhi tofauti yake na חֹק bila kulifanya kuwa istilahi ngumu.
- source_word: לֵאלֹהֵי יַעֲקֹב
  choice: la Mungu wa Yakobo
  rationale: 'Ingawa ל inaweza kutafsiriwa “kwa,” hapa uhusiano wa chanzo au mamlaka ndio unaoeleweka zaidi: agizo hilo limetoka kwa Mungu wa Yakobo au ni lake.'
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Biblia za Kiswahili.
theological_decisions:
- issue: Uhusiano wa maneno ya kisheria חֹק na מִשְׁפָּט
  choice: Kuyatofautisha kama “sheria” na “agizo”
  alternative: Kuyatafsiri yote kwa visawe vinavyokaribiana sana au kuyakusanya kuwa wazo moja
  rationale: Kiebrania kimetumia maneno mawili yanayohusiana lakini tofauti katika usambamba wa kishairi. Kuyahifadhi yote mawili kunadumisha uzito wa kiagano na kiibada bila kulazimisha tofauti ya kitaalamu isiyothibitishwa.
- issue: Maana ya ל katika לֵאלֹהֵי יַעֲקֹב
  choice: Kuonyesha uhusiano wa umiliki au chanzo kwa “la Mungu wa Yakobo”
  alternative: “kwa Mungu wa Yakobo”
  rationale: Tafsiri ya “kwa Mungu wa Yakobo” inawezekana kisarufi, lakini inaweza kumfanya Mungu aonekane hasa kama mnufaika wa agizo. “La Mungu wa Yakobo” huonyesha kwa kawaida zaidi kwamba yeye ndiye chanzo au mamlaka ya agizo, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wa heshima na unaoeleweka kwa msomaji wa kawaida. Mpangilio wa mistari unahifadhi usambamba wa vifungu viwili vya Kiebrania.
