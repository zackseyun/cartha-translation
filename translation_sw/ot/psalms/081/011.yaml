base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/011.yaml
  text: But my people did not listen to my voice[a], and Israel was not willing to obey me.
translation:
  language: sw
  text: 'Lakini watu wangu hawakuisikiliza sauti yangu,

    na Israeli hakukubali kunitii.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Israeli hakutaka kunitii”; pia, “Israeli alinikataa.” Kitenzi cha Kiebrania huonyesha utayari au ridhaa, na katika muktadha huu hudokeza kukubali kutii.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Lakini ... hawaku-
  rationale: Kiunganishi kinaonyesha utofautishaji na mwito na ahadi ya Mungu iliyotangulia; “lakini” huleta maana hiyo kwa Kiswahili cha kawaida.
- source_word: שָׁמַע
  choice: kuisikiliza
  rationale: Kitenzi kinaweza kumaanisha kusikia, kusikiliza, au kutii. Pamoja na “sauti yangu,” “kuisikiliza” huhifadhi taswira halisi na pia wazo la kuitikia bila kulifanya moja kwa moja kuwa “kutii.”
- source_word: עַמִּי
  choice: watu wangu
  rationale: Huhifadhi lugha ya moja kwa moja ya uhusiano wa agano na kiambishi cha nafsi ya kwanza.
- source_word: לְקוֹלִי
  choice: sauti yangu
  rationale: Huhifadhi nomino halisi “sauti” na uzito wake wa kibinafsi na wa kimahusiano.
- source_word: וְיִשְׂרָאֵל
  choice: na Israeli
  rationale: Huhifadhi jina maalumu na usambamba kati ya “watu wangu” na “Israeli.”
- source_word: לֹא אָבָה
  choice: hakutaka
  rationale: אָבָה hueleza utayari au kukubali. “Hakutaka” ni ya asili katika Kiswahili na haipunguzi maana kuwa tendo la kutotii pekee.
- source_word: לִי
  choice: kunikubali
  rationale: Baada ya אָבָה, kihusishi hiki huunda usemi wa kukubali au kuwa tayari kwa mtu. “Kunikubali” huhifadhi maana ya uhusiano bila kuingiza wazi “kutii,” ambalo ni fasiri inayowezekana lakini pana zaidi ya maneno yenyewe.
theological_decisions:
- issue: Utambulisho wa Israeli kama watu wa Mungu katika usambamba wa kishairi
  choice: 'Kudumisha mistari miwili: “watu wangu” na “Israeli”'
  alternative: “Watu wangu, Israeli, hawakuisikiliza sauti yangu”
  rationale: Kiebrania kina majina mawili yanayolingana kishairi. Kuyahifadhi hutunza mkazo wa agano na muundo wa mstari bila kuyafanya kuwa kirai kimoja cha ufafanuzi.
- issue: Uhusiano kati ya kutosikiliza na kutokubali
  choice: Kutafsiri “hakutaka kunikubali”
  alternative: “hakutaka kunitii” au “alinikataa”
  rationale: Maandishi yanadumisha mvutano kati ya kusikiliza katika mstari wa kwanza na utayari/kukubali katika wa pili. “Kunikubali” huepuka kuamua kwamba maana pekee ni kutii au kukataa kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Usambamba wa mistari miwili umehifadhiwa; kiwakilishi cha “Israeli” kimetumiwa katika umoja kwa kulichukulia taifa kama kundi moja.
