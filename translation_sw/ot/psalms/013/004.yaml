lexical_decisions:
- source_word: פֶּן
  choice: asije
  rationale: Hutambulisha jambo baya ambalo mtunga zaburi anamwomba Mungu alizuie; muundo huu ni wa kawaida na wa kishairi katika Kiswahili.
- source_word: אֹיְבִי
  choice: adui yangu
  rationale: Huhifadhi nomino ya umoja pamoja na kiambishi cha nafsi ya kwanza.
- source_word: יְכָלְתִּיו
  choice: Nimemshinda
  rationale: Kitenzi יכל pamoja na yambwa wa nafsi ya tatu ya kiume huonyesha adui akijigamba kuwa amemweza au amemshinda mtunga zaburi.
- source_word: צָרַי
  choice: wapinzani wangu
  rationale: Huhifadhi wingi na kutofautisha kundi hili na ‘adui yangu’ wa umoja, huku likionyesha uhasama.
- source_word: יָגִילוּ
  choice: wakashangilia
  rationale: Hueleza furaha kubwa ya wapinzani kwa sababu ya kuyumba kwa mtunga zaburi.
- source_word: כִּי
  choice: kwa kuwa
  rationale: Huwasilisha maana ya kisababishi katika muktadha huu, bila kuongeza maelezo yasiyokuwamo katika chanzo.
- source_word: אֶמּוֹט
  choice: ninayumba
  rationale: Nifali ya מוט huonyesha kutokuwa imara, kuyumba au kuteleza; ‘ninayumba’ inafaa kwa dhiki ya kimwili au ya maisha bila kudai kwamba tayari ameanguka.
