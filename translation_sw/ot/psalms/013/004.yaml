translation:
  language: sw
  text: 'Ili adui yangu asije akasema, “Nimemshinda,”[a]

    na wapinzani wangu wasije wakashangilia kwa kuwa ninayumba.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nimemweza.”
