  text: How long must I take counsel in my soul[b][a], with sorrow in my heart all day? How long will my enemy be exalted over me?
translation:
  language: sw
  text: Mpaka lini nitaweka mashauri nafsini mwangu,[a] huku huzuni ikiwa moyoni mwangu mchana kutwa? Mpaka lini adui yangu atajiinua juu yangu?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mpaka lini niweke mipango nafsini mwangu, huku huzuni ikiwa moyoni mwangu mchana kutwa?”
