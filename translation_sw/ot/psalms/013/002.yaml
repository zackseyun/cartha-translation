    text: Au, “Mpaka lini adui yangu atanishinda?” Kiebrania husema kwa uhalisi zaidi, “atajiinua juu yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד־אָנָה
  choice: Mpaka lini
  rationale: Ni kauli ya kawaida na ya asili ya kilio cha muda katika Kiswahili, na marudio yake yamehifadhiwa.
- source_word: אָשִׁית עֵצוֹת
  choice: niweke mashauri
  rationale: Neno la kitenzi lina maana ya kuweka, na nomino ya wingi inaweza kumaanisha mashauri au mipango. Uundaji huu unahifadhi picha ya Kiebrania na hali ya mtu kujadiliana ndani yake mwenyewe.
- source_word: בְּנַפְשִׁי
  choice: ndani yangu
  rationale: Hapa נֶפֶשׁ humaanisha nafsi ya ndani au mtu mwenyewe. ‘Ndani yangu’ ni Kiswahili cha kawaida bila kulazimisha tofauti ya kimaanisho isiyokusudiwa kati ya nafsi na moyo.
- source_word: יָגוֹן בִּלְבָבִי
  choice: huzuni ikiwa moyoni mwangu
  rationale: ‘Huzuni’ huwasilisha יָגוֹן kwa uwazi, na ‘moyoni mwangu’ huhifadhi taswira ya לֵבָב.
- source_word: יוֹמָם
  choice: mchana kutwa
  rationale: Huwasilisha muda unaoendelea wa ‘siku nzima’ huku ikihifadhi maana halisi ya wakati wa mchana.
- source_word: יָרוּם ... עָלָי
  choice: atajiinua juu yangu
  rationale: Huhifadhi taswira ya wima ya adui kuwa juu ya mwombolezaji. Dhana ya kushinda imetolewa katika tanbihi kama tafsiri ya kimuktadha.
- source_word: אֹיְבִי
  choice: adui yangu
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida, ya nomino ya umoja yenye kiambishi cha nafsi ya kwanza.
