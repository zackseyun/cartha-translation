lexical_decisions:
- source_word: עַד־אָנָה
  choice: Mpaka lini
  rationale: Ni swali la muda linalotumika katika maombolezo. “Mpaka lini” ni Kiswahili cha kawaida na kinahifadhi kilio kinachorudiwa katika mstari huu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi, badala ya kubadilishwa na cheo kama “BWANA”.
- source_word: תִּשְׁכָּחֵנִי
  choice: utanisahau
  rationale: Kitenzi hiki ni katika hali ya kutokamilika, nafsi ya pili umoja, kikiwa na kiambishi cha mtendwa cha nafsi ya kwanza. “Utanisahau” kinawasilisha malalamiko yanayoendelea na yenye mtazamo wa mbele.
- source_word: נֶצַח
  choice: milele
  rationale: Katika ombolezo hili neno linazidisha uchungu wa swali. “Milele” linahifadhi mvutano wa kishairi kati ya “mpaka lini” na hisia kwamba kusahauliwa hakutakwisha.
- source_word: תַּסְתִּיר
  choice: utanificha
  rationale: Hifili ya סתר ina maana ya kuficha au kusitiri. Katika muundo wa Kiswahili, “utanificha uso wako” ni namna fupi na ya kishairi ya kusema kwamba uso wake umefichwa mbali na msemaji.
- source_word: פָּנֶיךָ
  choice: uso wako
  rationale: Tafsiri halisi inahifadhi taswira ya Kiebrania; katika muktadha huu uso unaweza pia kudokeza uwepo au kibali.
- source_word: מִמֶּנִּי
  choice: -ni- katika “utanificha”
  rationale: Wazo la “kutoka kwangu/mbali nami” limewasilishwa kwa kawaida katika Kiswahili kwa kiambishi cha mtendwa “-ni-” pamoja na kitenzi “ficha”.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni kama jina binafsi. “Yahwe” linahifadhi jina hilo badala ya kuliweka kama cheo.
- issue: Iwapo פָּנֶיךָ litafsiriwe kwa maana yake pana kama “uwepo wako”
  choice: Kuhifadhi “uso wako” katika matini kuu
  alternative: uwepo wako; kibali chako
  rationale: Taswira halisi ya “uso” ina nguvu ya kishairi na inaweza kumaanisha uwepo au kibali bila kulazimisha maana moja tu katika matini kuu.
- issue: Mvutano kati ya “mpaka lini” na “milele”
  choice: Kuhifadhi maneno yote mawili katika swali moja
  alternative: Kugawanya kuwa “Mpaka lini? Je, milele?”
  rationale: Kiebrania kinaunganisha swali la muda na “milele,” na hivyo kuonyesha ukali wa malalamiko bila kuamua kimantiki jinsi misemo hiyo miwili inavyohusiana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye sauti ya moja kwa moja na yenye heshima inayofaa ombolezo la kishairi. Urudiaji wa “Mpaka lini” umehifadhiwa, na msamiati ni wa kawaida kwa wasomaji wa leo.
