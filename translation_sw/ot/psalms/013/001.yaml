translation:
  language: sw
  text: Mpaka lini, Ee Yahwe, utanisahau milele? Mpaka lini utaificha uso wako[a] mbali nami?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwepo wako.” Kihalisi, “uso wako.” Katika Kiebrania, kuficha uso kunaweza kuashiria kujiondoa au kunyima kibali.
