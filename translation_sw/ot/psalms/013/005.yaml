  text: וַ/אֲנִ֤י בְּ/חַסְדְּ/ךָ֣ בָטַחְתִּי֮ יָ֤גֵ֥ל לִבִּ֗/י בִּֽ/ישׁוּעָ֫תֶ֥/ךָ אָשִׁ֥ירָה לַ/יהוָ֑ה כִּ֖י גָמַ֣ל עָלָֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/005.yaml
  text: But as for me[a], I have trusted in your steadfast love; my heart will rejoice in your salvation. I will sing to Yahweh, because he has dealt bountifully with me.
translation:
  language: sw
  text: Lakini mimi nimeutumainia upendo wako thabiti; moyo wangu utashangilia wokovu wako.[a] Nitamwimbia Yahweh, kwa sababu amenitendea mema kwa wingi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukombozi wako.” Neno la Kiebrania linaweza kumaanisha ukombozi kutoka dhiki ya sasa na pia wokovu kwa maana pana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Lakini mimi
  rationale: Kiunganishi pamoja na kiwakilishi cha kusisitiza kinaonyesha tofauti na maombolezo yaliyotangulia; tafsiri hii ni ya kawaida na huhifadhi mkazo huo.
- source_word: בְּחַסְדְּךָ
  choice: upendo wako thabiti
  rationale: חֶסֶד huonyesha upendo wa neema ulio mwaminifu na wa kudumu, mara nyingi katika uhusiano wa agano. ‘Upendo thabiti’ huhifadhi wazo la upendo na uimara bila kuufupisha kuwa rehema pekee.
- source_word: בָטַחְתִּי
  choice: nimeutumainia
  rationale: Kauli timilifu ya Kiebrania inaonyesha tumaini lililowekwa tayari na ambalo bado lina umuhimu sasa. Wakati timilifu wa Kiswahili huwasilisha maana hiyo kwa kawaida.
- source_word: יָגֵל לִבִּי
  choice: moyo wangu utashangilia
  rationale: Kauli isiyotimilika hapa inatazamia furaha itakayotokana na uokozi wa Mungu; ‘utashangilia’ ni ya kawaida na huhifadhi taswira ya moyo kama nafsi ya ndani.
- source_word: בִּישׁוּעָתֶךָ
  choice: wokovu wako
  rationale: יְשׁוּעָה yaweza kumaanisha kuokolewa katika dhiki ya sasa au wokovu kwa maana pana. ‘Wokovu’ huhifadhi upana huo, huku tanbihi ikitaja maana mbadala.
- source_word: אָשִׁירָה
  choice: Nitamwimbia
  rationale: Umbo la cohortative linaonyesha azimio au nia ya kuimba; wakati ujao wa Kiswahili unaeleza azimio hilo kwa lugha ya kawaida.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יְהוָה limetolewa moja kwa moja kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa כִּי inatoa sababu ya kuimba; ‘kwa sababu’ ni wazi katika Kiswahili cha sasa.
- source_word: גָמַל עָלָי
  choice: amenitendea mema kwa wingi
  rationale: Nahau hii hueleza tendo kamili lenye manufaa au ukarimu kwa mtu. Tafsiri hii ni ya asili, huonyesha wema mwingi wa Mungu, na huepuka wazo finyu la malipo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano יְהוָה. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Upana wa maana ya יְשׁוּעָה
  choice: wokovu
  alternative: ukombozi au kuokolewa
  rationale: Neno la Kiebrania linaweza kutaja kuokolewa kutoka dhiki ya sasa na pia wokovu kwa maana pana. ‘Wokovu’ huhifadhi upana wa kiteolojia bila kuondoa maana ya msaada wa sasa; tanbihi inalinda uwezekano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi bila kuwa cha kizamani. Mpangilio wa sentensi unahifadhi mwendo wa mstari kutoka tumaini, kwenda furaha, kisha azimio la kuimba.
