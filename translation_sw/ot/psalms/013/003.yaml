  yaml_path: translation/ot/psalms/013/003.yaml
  text: Look and answer me[a], O Yahweh my God; give light to my eyes[b], lest I sleep the sleep of death.
translation:
  language: sw
  text: Unitazame na unijibu, Ee Yahwe, Mungu wangu; yape macho yangu nuru[a], nisije nikalala usingizi wa mauti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yafanye macho yangu yang'ae” au “yangaza macho yangu.” Taswira ya Kiebrania inaweza kumaanisha kurudishwa kwa uhai na nguvu, kuona mambo kwa uwazi, au kupata tumaini.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi zaidi, “nisije nikalala mauti” au “nisije nikalala katika mauti.” Kauli ya jadi ni “nisije nikalala usingizi wa mauti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּיטָה
  choice: Unitazame
  rationale: Amri hii inamwomba Mungu amwelekezee mwombaji uangalifu wake. “Unitazame” ni ya moja kwa moja na ya asili katika Kiswahili.
- source_word: עֲנֵנִי
  choice: unijibu
  rationale: Katika muktadha wa sala, kitenzi ענה humaanisha kujibu. Tafsiri hii haiingizi wazo la ziada la jibu linalompendeza mwombaji.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu, tetragramatoni, limetoholewa kama “Yahwe” badala ya kubadilishwa na cheo.
- source_word: אֱלֹהָי
  choice: Mungu wangu
  rationale: Huhifadhi umilikaji na ombi la kibinafsi lililo katika Kiebrania.
- source_word: הָאִירָה
  choice: yatie nuru
  rationale: Muundo wa kisababishi wa אור una maana ya kusababisha nuru au mwangaza. “Yatie nuru” huhifadhi sitiari bila kuifafanua kuwa nguvu, ufahamu, au tumaini pekee.
- source_word: עֵינַי
  choice: macho yangu
  rationale: Tafsiri ya moja kwa moja huhifadhi taswira ya mwili iliyotumiwa katika Kiebrania.
- source_word: פֶּן
  choice: nisije
  rationale: Hutambulisha matokeo yanayoogopwa kwa njia ya kawaida na yenye uzito katika Kiswahili.
- source_word: אִישַׁן הַמָּוֶת
  choice: nikalala usingizi wa mauti
  rationale: Hii ni kauli ya kishairi na ya asili katika Kiswahili inayohifadhi taswira ya kifo kama usingizi, ingawa neno “usingizi” halijatajwa kama nomino tofauti katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina la agano lenyewe; kulitohowa kama “Yahwe” huhifadhi jina binafsi badala ya kuliweka cheo mahali pake.
- issue: Sitiari ya kuyatia macho nuru
  choice: Kuhifadhi sitiari
  alternative: kunirudishia nguvu / kunipa ufahamu / kunipa tumaini
  rationale: Taswira inaweza kudokeza uhai mpya, ufahamu, au tumaini, lakini Kiebrania hakichagui maana moja tu. Tafsiri kwa hiyo haiondoi wigo huo wa maana.
- issue: Kifo kinachoelezwa kama usingizi
  choice: nikalala usingizi wa mauti
  alternative: nikalala katika mauti
  rationale: Kauli iliyochaguliwa ni ya kishairi na inayoeleweka katika Kiswahili huku ikihifadhi uhusiano wa usingizi na kifo; tanbihi inaonyesha umbo fupi zaidi la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya sala ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Ee” huonyesha mwito wa moja kwa moja; “mauti” hudumisha uzito wa kishairi kuliko “kifo.”
