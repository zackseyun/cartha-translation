lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza muziki
  rationale: Katika vichwa vya zaburi neno hili humrejelea mwenye kusimamia uimbaji au utendaji wa muziki. “Mwongoza muziki” ni Kiswahili cha sasa, cha kawaida na chenye upana unaofaa; kiambishi לַ־ kimetafsiriwa “Kwa” kulingana na matumizi yake katika kichwa.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ni jina la aina ya wimbo unaoimbwa kwa ala; “zaburi” ndilo neno la kawaida na linalotambulika katika Kiswahili kwa aina hii ya utungo.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Muundo “ya Daudi” ni wa asili katika Kiswahili na, kama Kiebrania, unaweza kuonyesha utunzi au uhusiano mwingine na Daudi bila kulazimisha maana moja.
theological_decisions:
- issue: Maana ya לְדָוִד katika kichwa cha zaburi
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi; kwa ajili ya Daudi
  rationale: Kihusishi לְ־ katika vichwa vya zaburi kinaweza kuonyesha mtunzi, uhusiano, kuwekwa wakfu, au mkusanyo. “Ya Daudi” huhifadhi upana huo wa maana kuliko tafsiri inayodai wazi kwamba Daudi ndiye aliyeiandika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Kichwa kimewekwa kwa ufupi kama kilivyo katika Kiebrania; alama ya tanbihi imewekwa baada ya “Daudi,” ambako utata wa maana unatokea.
