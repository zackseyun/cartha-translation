  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְֽ/הָיָ֗ה כְּ/עֵץ֮ שָׁת֪וּל עַֽל פַּלְגֵ֫י מָ֥יִם אֲשֶׁ֤ר פִּרְי֨/וֹ יִתֵּ֬ן בְּ/עִתּ֗/וֹ וְ/עָלֵ֥/הוּ לֹֽא יִבּ֑וֹל וְ/כֹ֖ל אֲשֶׁר יַעֲשֶׂ֣ה יַצְלִֽיחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/003.yaml
  text: He will be like a tree planted by streams of water[a], which yields its fruit in its season, and its leaf does not wither; in all that he does, he prospers.
translation:
  language: sw
  text: Atakuwa kama mti uliopandwa kando ya mifereji ya maji, unaozaa matunda yake kwa majira yake, na majani yake hayanyauki. Katika yote anayofanya, anafanikiwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kila afanyalo hufanikiwa.” Kiebrania pia kinaweza kueleweka kuwa “kila afanyalo” ndicho kiima cha kitenzi cha mwisho.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Atakuwa
  rationale: Kauli hii inaendeleza matokeo ya maelezo ya mtu mwenye heri katika muktadha wa kishairi; wakati ujao ni wa asili katika Kiswahili.
- source_word: כְּעֵץ שָׁתוּל
  choice: kama mti uliopandwa
  rationale: Kihusishi כְּ kinaonyesha ulinganisho, na שָׁתוּל ni kauli tendwa inayoonyesha mti uliowekwa mahali kwa makusudi.
- source_word: עַל פַלְגֵי מָיִם
  choice: kando ya mifereji ya maji
  rationale: פַלְגֵי inaweza kumaanisha vijito au mifereji ya maji; 'mifereji ya maji' hudumisha wazo la mikondo iliyogawanyika inayoupatia mti maji.
- source_word: פִּרְיוֹ יִתֵּן
  choice: unaozaa matunda yake
  rationale: Ingawa kitenzi kimsingi ni 'kutoa,' 'kuzaa matunda' ni usemi wa kawaida na sahihi kwa mti katika Kiswahili.
- source_word: בְּעִתּוֹ
  choice: kwa majira yake
  rationale: Hueleza wakati au msimu ufaao wa mti kutoa matunda.
- source_word: וְעָלֵהוּ לֹא יִבּוֹל
  choice: na majani yake hayanyauki
  rationale: Kiswahili kwa kawaida hutumia wingi 'majani' kwa matawi yenye majani, ingawa Kiebrania kina nomino ya umoja yenye maana ya jumla; 'hayanyauki' hutoa maana ya moja kwa moja ya יִבּוֹל.
- source_word: וְכֹל אֲשֶׁר יַעֲשֶׂה יַצְלִיחַ
  choice: Katika yote anayofanya, anafanikiwa
  rationale: Muundo huu unamchukua mtu mwenye heri kuwa kiima kinachoeleweka cha kitenzi cha mwisho, huku maana mbadala ya matendo yake kufanikiwa ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Kiima cha kitenzi cha mwisho יַצְלִיחַ
  choice: Katika yote anayofanya, anafanikiwa.
  alternative: Kila analofanya linafanikiwa.
  rationale: Kiebrania kinaweza kueleweka kuwa mtu ndiye anayefanikiwa au kuwa 'kila analofanya' ndicho kiima cha kitenzi. Tafsiri kuu inadumisha mkazo kwa mtu mwenye heri, na maana nyingine halali imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Taswira ya kishairi imehifadhiwa bila kuifanya kuwa ya kidhehebu.
