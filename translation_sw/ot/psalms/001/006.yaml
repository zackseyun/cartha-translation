base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/006.yaml
  text: For Yahweh knows the way of the righteous[a], but the way of the wicked will perish.
translation:
  language: sw
  text: Kwa maana Yahwe anaijua njia ya wenye haki[a], lakini njia ya waovu itaangamia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huiangalia”; neno la Kiebrania linalotafsiriwa “anaijua” linaweza kudokeza kujali au kukubali, si kuwa na ufahamu tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kinaonyesha sababu au msingi wa tofauti iliyotangulia katika zaburi, kwa Kiswahili cha kawaida.
- source_word: יֹדֵעַ
  choice: anaijua
  rationale: Kinahifadhi maana ya msingi ya kitenzi ידע, huku muktadha ukiruhusu maana pana ya kujali, kukubali, au kuangalia kwa upendeleo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uwasilishaji wa jina la Mungu la Kiebrania kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: דֶּרֶךְ
  choice: njia
  rationale: Neno hili linadumisha sitiari ya mwenendo wa maisha na hatima yake, pamoja na urudiaji wa kishairi katika vifungu vyote viwili.
- source_word: צַדִּיקִים
  choice: wenye haki
  rationale: Ni usemi wa kawaida na unaoeleweka katika Kiswahili kwa kivumishi cha wingi kinachotumiwa kama nomino.
- source_word: וְ
  choice: lakini
  rationale: Ingawa kiunganishi kwa umbo lake ni ‘na’, ulinganifu wa kishairi unaonyesha tofauti, ambayo ‘lakini’ huiwasilisha wazi.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Ni tafsiri ya kawaida ya kundi hili la kimaadili katika fasihi ya hekima.
- source_word: תֹּאבֵד
  choice: itaangamia
  rationale: 'Kinadumisha hali ya kitenzi kisichohamishia tendo kwa kitu kingine: njia ya waovu yenyewe itafikia uharibifu.'
theological_decisions:
- issue: Maana ya Yahwe ‘kujua’ njia ya wenye haki
  choice: Maandishi makuu yanatumia ‘anaijua’, huku dokezo likitaja maana inayowezekana ya uangalizi wenye kujali au ukubali.
  alternative: Yahwe anaiangalia njia ya wenye haki / anaitambua kwa ukubali.
  rationale: Kitenzi cha Kiebrania kinaweza kuashiria uhusiano, kujali, au kukubali, si kuwa na taarifa tu. Hata hivyo, ‘anaijua’ huhifadhi maana ya wazi ya neno bila kufunga utata wake wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Ulinganifu wa ‘njia ... njia’ na tofauti ya ‘wenye haki ... waovu’ umehifadhiwa.
