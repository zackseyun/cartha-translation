  yaml_path: translation/ot/psalms/001/004.yaml
  text: Not so the wicked; rather[a], they are like chaff that the wind drives away.
translation:
  language: sw
  text: Sivyo walivyo waovu; bali ni kama makapi yanayopeperushwa[a] na upepo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yanayosukumwa mbali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: hawako hivyo
  rationale: Kirai hiki kinadumisha ukanushaji wa ghafla na tofauti kati ya waovu na mwenye haki aliyeelezwa katika mstari uliotangulia, bila kujaza kwa maelezo yasiyokuwamo wazi katika Kiebrania.
- source_word: הָרְשָׁעִים
  choice: waovu
  rationale: “Waovu” ni tafsiri ya kawaida na yenye kufaa katika fasihi ya hekima kwa watu wenye mwenendo mwovu, si watu waliopatikana na hatia ya kisheria tu.
- source_word: כִּי אִם
  choice: bali
  rationale: 'Kiunganishi hiki kinaonyesha tofauti yenye nguvu: waovu hawafanani na mti unaositawi, bali na makapi.'
- source_word: כַּמֹּץ
  choice: kama makapi
  rationale: מֹץ ni mabaki mepesi yanayotenganishwa na nafaka wakati wa kupura; “makapi” ni neno sahihi na la kawaida katika Kiswahili.
- source_word: אֲשֶׁר
  choice: yanayo-
  rationale: Kirejeshi cha Kiswahili kimeunganishwa kiasili na kitenzi na kinaonyesha makapi ambayo upepo huyapeperusha.
- source_word: תִּדְּפֶנּוּ
  choice: yanayopeperushwa
  rationale: Kitenzi נדף huonyesha kusukumwa au kupeperushwa na upepo. Kauli ya kutendwa inaweka upepo kuwa mtendaji kama ilivyo katika Kiebrania.
- source_word: רוּחַ
  choice: upepo
  rationale: Katika mfano huu wa kilimo maana ya wazi ni upepo, wala si pumzi au roho.
