  text: אַ֥שְֽׁרֵי הָ/אִ֗ישׁ אֲשֶׁ֤ר לֹ֥א הָלַךְ֮ בַּ/עֲצַ֪ת רְשָׁ֫עִ֥ים וּ/בְ/דֶ֣רֶךְ חַ֭טָּאִים לֹ֥א עָמָ֑ד וּ/בְ/מוֹשַׁ֥ב לֵ֝צִ֗ים לֹ֣א יָשָֽׁב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/001.yaml
  text: Blessed is the man who does not walk in the counsel of the wicked[a], nor stand in the way of sinners[c][b], nor sit in the seat of scoffers.
translation:
  language: sw
  text: Heri mtu asiyetembea katika shauri la waovu, wala hasimami katika njia ya wenye dhambi, wala haketi katika kikao cha wenye dhihaka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali wanapoketi wenye dhihaka”; neno la Kiebrania linaweza kumaanisha mahali pa kuketi, kikao, au kusanyiko.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heri
  rationale: Kauli hii ya hekima hutangaza hali njema na yenye baraka ya mtu anayeelezwa; “Heri” ni ya kawaida, yenye hadhi, na ina maana pana kuliko furaha ya kihisia tu.
- source_word: הָאִישׁ
  choice: mtu yule
  rationale: Nomino ya Kiebrania ni umoja wa kiume, lakini hapa humwakilisha mtu wa mfano kwa ujumla. Kiswahili “mtu yule” huhifadhi umoja bila kuifanya aya iwahusu wanaume pekee.
- source_word: הָלַךְ
  choice: hatembei
  rationale: Huhifadhi taswira halisi ya mwenendo na mfuatano wa kishairi wa kutembea, kusimama, na kuketi.
- source_word: בַּעֲצַת
  choice: kwa shauri la
  rationale: “Shauri” linaweza kumaanisha ushauri na mwongozo unaoongoza mwenendo; kihusishi “kwa” huleta Kiswahili cha asili.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Ni tafsiri ya moja kwa moja ya kundi la watu waovu bila kuongeza maana mahsusi ya kutomcha Mungu.
- source_word: דֶרֶךְ
  choice: njia ya
  rationale: Huhifadhi maana mbili za njia halisi na namna ya maisha, zinazofaa katika fasihi ya hekima.
- source_word: חַטָּאִים
  choice: wenye dhambi
  rationale: Ni usemi wa kawaida na unaoeleweka kwa watu wanaotambulishwa kwa dhambi zao.
- source_word: עָמָד
  choice: hasimami
  rationale: Huhifadhi taswira na hatua ya pili katika mfuatano wa kutembea, kusimama, na kuketi.
- source_word: מוֹשַׁב
  choice: kikao cha
  rationale: Nomino inaweza kumaanisha mahali pa kuketi au kusanyiko/kikao. “Kikao” ni Kiswahili cha asili na hudokeza ushirika wa kudumu bila kupoteza uhusiano na kitenzi “kuketi.”
- source_word: לֵצִים
  choice: wenye dhihaka
  rationale: Huwataja watu wanaodhihaki au kudharau; ni usemi wa sasa, wazi, na wenye hadhi.
- source_word: יָשָׁב
  choice: haketi
  rationale: Hukamilisha mfuatano wa kishairi na huhifadhi taswira halisi ya maandishi.
theological_decisions:
- issue: Umoja wa kiume wenye maana ya uwakilishi katika fasihi ya hekima
  choice: mtu yule
  alternative: mwanamume yule
  rationale: Kiebrania kimetumia nomino ya umoja wa kiume, lakini muktadha wa kauli ya hekima unamtoa kama mfano wa mtu mwadilifu kwa ujumla. “Mtu yule” huhifadhi umoja na maana ya uwakilishi bila kudai kuwa ahadi hii ni ya wanaume tu.
- issue: Maana ya מוֹשַׁב
  choice: kikao cha
  alternative: kiti cha
  rationale: Neno linaweza kutaja mahali pa kuketi, kikao, au kusanyiko. “Kikao” hutoa Kiswahili cha kawaida na huhifadhi wazo la kujiunga na kundi, huku taswira ya kuketi ikiendelea katika kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mstari umehifadhi urudiaji wa “wala” na mfuatano wa kishairi wa kutembea, kusimama, na kuketi. “Heri” limetumiwa kama tamko la hali yenye baraka, si hisia ya furaha tu.
