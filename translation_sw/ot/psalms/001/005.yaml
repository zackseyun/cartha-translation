  text: עַל כֵּ֤ן לֹא יָקֻ֣מוּ רְ֭שָׁעִים בַּ/מִּשְׁפָּ֑ט וְ֝/חַטָּאִ֗ים בַּ/עֲדַ֥ת צַדִּיקִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/005.yaml
  text: Therefore the wicked will not stand in the judgment[b][a], nor sinners in the assembly of the righteous.
translation:
  language: sw
  text: Kwa hiyo, waovu hawatasimama hukumuni,[a] wala wenye dhambi katika kusanyiko la wenye haki.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika hukumu.” Kiebrania kinaweza kumaanisha kwa upana kupimwa na kutolewa hukumu, iwe katika maisha ya sasa au katika hukumu ya mwisho.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika jumuiya ya wenye haki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na maelezo yaliyotangulia kuhusu njia ya waovu, kwa Kiswahili cha kawaida na chenye nguvu ya kimantiki.
- source_word: יָקֻמוּ
  choice: hawatasimama
  rationale: Inahifadhi taswira ya Kiebrania ya kusimama, huku katika muktadha wa hukumu ikidokeza kutoweza kustahimili au kuthibitishwa.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Ni neno la kawaida katika fasihi ya hekima linalohifadhi kundi la kimaadili, wala halilifanyi kuwa suala la hatia ya kisheria pekee.
- source_word: בַּמִּשְׁפָּט
  choice: hukumuni
  rationale: Linawasilisha mazingira ya utoaji hukumu bila kuamua kama ni hukumu ya sasa, ya mwisho, au zote mbili.
- source_word: חַטָּאִים
  choice: wenye dhambi
  rationale: Ni usemi wa asili na wenye heshima unaomaanisha watu wanaotambulishwa kwa dhambi, na unaendeleza ulinganifu na 'waovu'.
- source_word: בַּעֲדַת
  choice: katika kusanyiko la
  rationale: Linahifadhi maana ya jamii iliyokusanyika; 'kusanyiko' ni wazi na la kawaida katika Kiswahili cha sasa.
- source_word: צַדִּיקִים
  choice: wenye haki
  rationale: Ni tafsiri ya kawaida inayohifadhi maana ya kimaadili na ya uhusiano na Mungu.
theological_decisions:
- issue: Upeo wa בַּמִּשְׁפָּט ('hukumuni')
  choice: Imetafsiriwa kwa ujumla kuwa 'hukumuni' bila kubainisha wakati au aina ya hukumu.
  alternative: Katika hukumu ya sasa ya kisheria; au katika Hukumu ya Mwisho.
  rationale: Kiebrania kinaruhusu maana pana ya kupimwa na kutolewa hukumu. Zaburi inaweza kujumuisha hesabu ya sasa na ya mwisho, hivyo tafsiri haifungi maana kwa mojawapo.
- issue: Maana ya 'hawatasimama'
  choice: Taswira ya kusimama imehifadhiwa.
  alternative: Hawatastahimili; hawatathibitishwa kuwa hawana hatia.
  rationale: Tafsiri ya moja kwa moja huhifadhi sitiari ya Kiebrania na uzito wake wa kimahakama bila kuamua kwa kupita kiasi matokeo yanayokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaosomeka kwa urahisi. Muundo sambamba wa mstari wa Kiebrania umehifadhiwa, pamoja na taswira ya kimahakama ya 'kusimama'.
