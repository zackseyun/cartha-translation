base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/002.yaml
  text: But his delight is in the law of Yahweh[b][a], and on his law he meditates day and night.
translation:
  language: sw
  text: Bali, hupendezwa na sheria ya Yahwe[a], naye huitafakari[b] sheria yake mchana na usiku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mafundisho ya Yahwe.”
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania kinaweza pia kudokeza kuinong’ona au kuikariri kwa sauti ya chini wakati wa kuitafakari.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Bali
  rationale: Baada ya kauli hasi za mstari wa 1, kirai hiki kinaonyesha utofautishaji mkali; “Bali” ni cha asili na chenye hadhi katika Kiswahili.
- source_word: בְּתוֹרַת
  choice: katika sheria ya
  rationale: תּוֹרָה linaweza kuwa “mafundisho,” lakini “sheria” linadumisha uzito wa ufunuo wa agano na pia ni neno linaloeleweka kwa urahisi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa na cheo; umbo “Yahwe” linafuata tahajia ya kawaida ya Kiswahili.
- source_word: חֶפְצוֹ
  choice: furaha yake
  rationale: Kirai hiki huonyesha kitu ambacho mtu anakipenda na kukifurahia; “furaha yake iko katika” ni Kiswahili cha kawaida na huhifadhi mwelekeo wa ndani wa mwenye haki.
- source_word: וּבְתוֹרָתוֹ
  choice: naye huitafakari sheria yake
  rationale: Kiambishi cha umilikaji kinarejelea Yahwe. Kurudia “sheria” kunahifadhi usambamba wa Kiebrania, na “-tafakari” huchukua yambwa moja kwa moja kwa ufasaha wa Kiswahili.
- source_word: יֶהְגֶּה
  choice: huitafakari
  rationale: Kitenzi kinaweza kumaanisha kutafakari, kunong’ona, au kukariri kwa sauti ya chini. “Huitafakari” linaeleza tendo la kawaida na endelevu, huku kidokezo cha sauti ya chini kikihifadhiwa katika tanbihi.
- source_word: יוֹמָם וָלָיְלָה
  choice: mchana na usiku
  rationale: Hili ni jozi ya kishairi inayoashiria daima; tafsiri ya moja kwa moja inadumisha picha na mdundo.
theological_decisions:
- issue: Maana ya תּוֹרָה katika zaburi ya hekima
  choice: sheria
  alternative: mafundisho
  rationale: “Sheria” inadumisha maana ya mafundisho ya Mungu yenye uzito wa agano, bila kukataa maana pana ya “mafundisho,” ambayo imeonyeshwa katika tanbihi.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania ina jina la agano lenyewe; kulitaja kama “Yahwe” kunadumisha tofauti kati ya jina binafsi na cheo.
- issue: Wigo wa maana wa הגה
  choice: huitafakari
  alternative: huinong’ona au huikariri kwa sauti ya chini
  rationale: Muktadha wa hekima unaunga mkono kutafakari, lakini kitenzi kinaweza pia kuhusisha kutamka kwa sauti ya chini; utata huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Bali” huhifadhi utofautishaji wa kishairi; “naye huitafakari” ni ya kawaida kuliko muundo mzito wa kisintaksia. Alama zote za tanbihi zimo katika matini kuu karibu na vipengele vinavyohusika.
