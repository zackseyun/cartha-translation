    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Lakini mimi
  rationale: Kiunganishi pamoja na kiwakilishi huru huonyesha utofautishaji na msisitizo; “Lakini mimi” ni ya kawaida na huhifadhi yote mawili.
- source_word: בְּתֻמִּי
  choice: katika unyofu wangu
  rationale: תֻּם hapa hueleza ukamilifu wa mwenendo, uadilifu, au kutokuwa na lawama. “Unyofu” ni lugha ya heshima na haidai moja kwa moja kutokuwa na dhambi kabisa.
- source_word: אֵלֵךְ
  choice: nitaenenda
  rationale: Kitenzi הלך kinadumisha sitiari ya kutembea kama mwenendo wa maisha. “Nitaenenda” ni cha kibiblia lakini bado kinaeleweka katika Kiswahili sanifu.
- source_word: פְּדֵנִי
  choice: unikomboe
  rationale: פדה humaanisha kukomboa au kutoa kwa fidia; “unikomboe” huhifadhi uzito wa neno kuliko tafsiri ya jumla kama “uniokoe.”
- source_word: וְחָנֵּנִי
  choice: na unifadhili
  rationale: חנן ni kuonyesha neema au fadhili. “Unifadhili” huwasilisha ombi la kuonyeshwa fadhili bila kuligeuza kabisa kuwa rehema.
theological_decisions:
- issue: Dai la mtunga zaburi kuhusu תֻם
  choice: “Unyofu wangu” huonyesha uadilifu wa mwenendo bila kulifanya dai la kutokuwa na dhambi kabisa.
  alternative: “Kutokuwa kwangu na lawama” au “kutokuwa kwangu na hatia.”
  rationale: Muktadha unatofautisha mwenendo wa mwombaji na wa waovu, huku mwombaji bado akiomba ukombozi na fadhili. Tafsiri hii huhifadhi mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka. “Nitaenenda” hudumisha sitiari ya Kiebrania; “unifadhili” ni ombi la kuonyeshwa fadhili/neema. Alama ya tanbihi [a] imewekwa baada ya kifungu kinachohusika.
