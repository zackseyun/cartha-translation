  text: But as for me[a], I will walk in my integrity[b]; redeem me and be gracious to me.
translation:
  language: sw
  text: Lakini mimi nitaenenda katika unyofu wangu[a]; unikomboe na unionyeshe fadhili.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika kutokuwa na lawama kwangu” au “katika kutokuwa na hatia kwangu.”
