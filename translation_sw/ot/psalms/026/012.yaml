base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/012.yaml
  text: My foot stands on level ground[a]; in the assemblies I will bless Yahweh.
translation:
  language: sw
  text: Mguu wangu umesimama mahali tambarare[a]; katika makusanyiko nitambariki Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali pa usawa”; Kiebrania kinaweza pia kudokeza unyoofu.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלִי
  choice: Mguu wangu
  rationale: Nomino ya Kiebrania iko katika umoja na ina kiambishi cha nafsi ya kwanza umoja. Kiswahili kinaweza kuhifadhi umoja huu kwa njia ya kawaida.
- source_word: עָמְדָה
  choice: umesimama
  rationale: Kitenzi ni qal timilifu, nafsi ya tatu kike umoja, kikikubaliana na ‘mguu.’ ‘Umesimama’ huhifadhi hali ya sasa iliyotokana na tendo lililotimia na kudokeza uthabiti.
- source_word: בְמִישׁוֹר
  choice: mahali palipo sawa
  rationale: מִישׁוֹר humaanisha mahali tambarare au penye usawa, na huweza pia kudokeza unyoofu. Tafsiri hii huhifadhi picha halisi bila kuondoa maana ya kimaadili inayoweza kuwapo.
- source_word: בְמַקְהֵלִים
  choice: katika makusanyiko
  rationale: Nomino ya wingi hurejelea mikutano ya watu waliokusanyika. ‘Makusanyiko’ huhifadhi wingi na huepuka kuipa sentensi maana finyu ya kitaasisi.
- source_word: אֲבָרֵךְ
  choice: nitambariki
  rationale: Piel ya nafsi ya kwanza umoja ya ברך ina maana ya ‘kubariki.’ Umbo la wakati ujao linafaa kwa tangazo la dhamira katika muktadha huu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kuwa ‘Yahwe,’ badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia jina la Mungu moja kwa moja. ‘Yahwe’ hulihifadhi kama jina la pekee badala ya kulibadili kuwa cheo.
- issue: Dokezo la kimaadili katika מִישׁוֹר
  choice: Kuhifadhi picha ya mahali palipo sawa na kueleza dokezo katika tanbihi
  alternative: katika unyoofu
  rationale: Neno lina maana halisi ya mahali tambarare au penye usawa, lakini linaweza pia kudokeza unyoofu. Kutumia maana halisi katika mstari na kuweka uwezekano mwingine katika tanbihi huhifadhi utata wa kishairi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa kwa sentensi mbili zinazolingana, huku umoja wa ‘mguu’ na wingi wa ‘makusanyiko’ vikidumishwa.
