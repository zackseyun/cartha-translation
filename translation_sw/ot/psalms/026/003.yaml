base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/003.yaml
  text: For your steadfast love is before my eyes[b][a], and I have walked in your truth.
translation:
  language: sw
  text: Kwa maana upendo wako thabiti[a] uko mbele ya macho yangu, nami nimeenenda katika kweli yako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uaminifu wako kwa agano,” badala ya “upendo wako thabiti.”
    reason: lexical_alternative
  - marker: b
    text: Au, “uaminifu wako,” badala ya “kweli yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya dai la mtunga zaburi katika muktadha na ni kiunganishi cha kawaida cha Kiswahili.
- source_word: חַסְדְּךָ
  choice: upendo wako thabiti
  rationale: Neno חֶסֶד linajumuisha upendo, wema na uaminifu wa kudumu, hasa katika uhusiano wa agano. Tafsiri hii inadumisha upana huo bila kulifanya kuwa hisia tu.
- source_word: לְנֶגֶד עֵינַי
  choice: uko mbele ya macho yangu
  rationale: Inahifadhi taswira ya Kiebrania ya kuweka jambo machoni, yaani kulizingatia daima.
- source_word: וְהִתְהַלַּכְתִּי
  choice: nami nimeenenda
  rationale: Hifili ya התהלך hapa inaeleza mwenendo wa maisha. 'Nimeenenda' inadumisha sitiari ya kutembea huku ikieleweka katika sajili ya maandiko yenye hadhi.
- source_word: בַּאֲמִתֶּךָ
  choice: katika kweli yako
  rationale: אֱמֶת linaweza kumaanisha kweli, uaminifu au kutegemeka. 'Kweli yako' inadumisha upana wa maana na muundo wa chanzo.
theological_decisions:
- issue: Upana wa maana ya maneno ya kimungu חֶסֶד na אֱמֶת
  choice: חֶסֶד limetafsiriwa 'upendo wako thabiti,' na אֱמֶת 'kweli yako.'
  alternative: חֶסֶד kuwa 'uaminifu wako kwa agano,' na אֱמֶת kuwa 'uaminifu wako.'
  rationale: Chaguo kuu linahifadhi utajiri wa upendo wa kudumu na kweli yenye kutegemeka bila kufunga kila neno katika maana moja tu ya kiteolojia; njia mbadala zimewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Nimeenenda' imetumiwa ili kuhifadhi sitiari ya mwenendo wa maisha; maneno mengine ni ya kawaida na yanaeleweka kwa wasomaji wengi.
