base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/002.yaml
  text: Examine me[a], O Yahweh, and test me; refine my mind and my heart.
translation:
  language: sw
  text: Nichunguze, ee Yahweh, na unijaribu; safisha kwa moto figo zangu[a] na moyo wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “figo”; hapa ni mfano wa mawazo au hisia za ndani kabisa.
    reason: cultural_note
lexical_decisions:
- source_word: בְּחָנֵנִי
  choice: Nichunguze
  rationale: Kitenzi בחן humaanisha kuchunguza au kupima ili kuthibitisha uhalisi; “nichunguze” ni Kiswahili cha kawaida na pia hukitofautisha na נסה inayofuata.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: וְנַסֵּנִי
  choice: unijaribu
  rationale: נסה huelekeza kwenye kujaribu au kuthibitisha kwa mtihani; “unijaribu” huhifadhi ulinganifu na בחן bila kurudia kitenzi kilekile.
- source_word: צרופה
  choice: safisha kwa moto
  rationale: צרף ni neno la usafishaji wa metali kwa moto. Kauli hii huhifadhi taswira hiyo kwa Kiswahili kinachoeleweka kuliko kutumia istilahi finyu ya kiufundi.
- source_word: כִלְיוֹתַי
  choice: figo zangu
  rationale: Maana halisi ni figo, ambazo katika antropolojia ya Kiebrania huwakilisha mawazo au hisia za ndani kabisa. Taswira halisi imehifadhiwa, huku tanbihi ikieleza maana yake ya kimajazi.
- source_word: וְלִבִּי
  choice: na moyo wangu
  rationale: לֵב humaanisha moyo na, kwa upana, utu wa ndani unaojumuisha fikra na nia. “Moyo wangu” huhifadhi taswira na ulinganifu wa kishairi.
theological_decisions:
- issue: Taswira ya viungo vya mwili katika ushairi wa Kiebrania
  choice: Kuhifadhi “figo zangu” na “moyo wangu” katika matini kuu.
  alternative: Kutafsiri maana moja kwa moja kama “mawazo yangu ya ndani na moyo wangu.”
  rationale: Kiebrania hutumia viungo hivi kuzungumzia utu wa ndani. Kuhifadhi taswira halisi kunadumisha nguvu ya kishairi na hakufungi maana pana ya mfano; tanbihi husaidia msomaji wa kisasa.
- issue: Nguvu ya taswira ya צרף
  choice: “safisha kwa moto”
  alternative: “chunguza” au “takasa” bila kutaja moto.
  rationale: Neno lina asili ya uyeyushaji na usafishaji wa metali. Kutaja moto huhifadhi sitiari ya kupimwa na kusafishwa bila kuamua ikiwa ombi linahusu fikra, hisia, au nia pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Ee” inaweka sauti ya mwito wa moja kwa moja, na mpangilio wa vitenzi huhifadhi ulinganifu wa mstari wa Kiebrania.
