lexical_decisions:
- source_word: אֲשֶׁר בִּידֵיהֶם
  choice: ambao mikononi mwao
  rationale: Kiunganishi cha uhusiano kinaendeleza maelezo ya watu waovu waliotajwa katika mstari uliotangulia, huku ‘mikononi mwao’ ikihifadhi taswira ya Kiebrania.
- source_word: זִמָּה
  choice: uovu
  rationale: Katika muktadha wa ulinganifu na rushwa, neno hili linaonyesha ufisadi mpana wa kimaadili au mpango mbaya, wala si dhambi ya kingono pekee.
- source_word: וִימִינָם
  choice: na mkono wao wa kuume
  rationale: Umoja wa kijumla wa Kiebrania umehifadhiwa, pamoja na taswira ya mkono wa kuume kama chombo cha kutenda.
- source_word: מָלְאָה
  choice: umejaa
  rationale: Huwasilisha hali iliyopo kwa njia ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: שֹׁחַד
  choice: rushwa
  rationale: Nomino ya Kiswahili ‘rushwa’ hutumiwa kwa maana ya jumla na kwa kawaida huonyesha vitendo au malipo ya kifisadi.
