id: PSA.26.0
reference: Psalms 26:0
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לְ/דָוִ֨ד שָׁפְטֵ֤/נִי יְהוָ֗ה כִּֽי אֲ֭נִי בְּ/תֻמִּ֣/י הָלַ֑כְתִּי וּ/בַ/יהוָ֥ה בָּ֝טַ֗חְתִּי לֹ֣א אֶמְעָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/000.yaml
  text: Of David[a]. Judge me, Yahweh, for I have walked in my integrity, and I have trusted in Yahweh[c][b]; I will not slip.
translation:
  language: sw
  text: 'Ya Daudi.[a]


    Ee Yahwe, nihukumu,[b]

    kwa maana nimeenenda kwa uadilifu wangu;[c]

    nimemtumaini Yahwe;

    sitayumba.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Zaburi ya Daudi,” au “Kwa ajili ya Daudi.” Kiebrania kinaweza kuonyesha utunzi, uhusiano, au wakfu.
    reason: superscription_ambiguity
  - marker: b
    text: Kitenzi cha Kiebrania kinaweza pia kumaanisha “nitolee hukumu,” yaani, “unitetee” au “amuru kwa faida yangu.”
    reason: lexical_alternative
  - marker: c
    text: Au “kwa unyofu wangu” au “katika mwenendo wangu usiolaumika.” Neno la Kiebrania linaashiria ukamilifu wa tabia, unyofu, na mwenendo usiolaumika.
    reason: lexical_alternative
  - marker: d
    text: Au “sitakengeuka” au “sitateleza.” Taswira ya Kiebrania ni ya kupoteza uthabiti au mguu kuteleza.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Kiambishi לְ katika kichwa kinaweza kuonyesha utunzi, uhusiano, au wakfu; “Ya Daudi” ni kichwa kifupi na cha asili kinachodumisha upana huo kwa kiasi kikubwa.
- source_word: שָׁפְטֵנִי
  choice: nihukumu
  rationale: Huhifadhi maana ya msingi ya kitenzi ‘hukumu,’ huku tanbihi ikieleza maana inayowezekana katika muktadha ya kumpatia mwombaji hukumu ya haki.
- source_word: בְתֻמִּי
  choice: kwa uadilifu wangu
  rationale: תֹּם ina wazo la ukamilifu wa tabia, unyofu, na mwenendo usiolaumika; ‘uadilifu’ ni neno la kawaida na lenye hadhi linalobeba wazo hilo bila kudai kutokuwa na dhambi kabisa.
- source_word: בָטַחְתִּי
  choice: nimemtumaini
  rationale: Kitenzi cha Kiebrania kinaonyesha kumtegemea Yahwe kwa usalama; wakati timilifu umetafsiriwa kwa hali ya sasa inayotokana na tendo lililokwisha kuanza.
- source_word: לֹא אֶמְעָד
  choice: sitayumba
  rationale: Huhifadhi taswira ya kupoteza uthabiti au mguu kuteleza, kwa Kiswahili cha kawaida kinachoeleza kutokuwa imara.
theological_decisions:
- issue: Ombi la ‘hukumu’ kutoka kwa Mungu
  choice: nihukumu
  alternative: unitetee / nitoe kuwa mwenye haki
  rationale: Maana ya msingi imeachwa wazi badala ya kuamua kimya kimya kuwa hukumu lazima iwe ya kumpendelea mwombaji; uwezekano wa kutetewa umewekwa katika tanbihi.
- issue: Dai la uadilifu wa mwombaji
  choice: kwa uadilifu wangu
  alternative: kwa kutokuwa na lawama kwangu
  rationale: Tafsiri haijageuza dai hilo kuwa ukamilifu usio na dhambi wala kulidhoofisha kuwa nia njema tu; inadumisha mvutano wa kitheolojia wa kauli ya zaburi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa kwa mistari mifupi; jina ‘Yahwe’ limetumiwa kulingana na matini ya chanzo, na kishangao ‘Ee’ kinafanya mwito wa moja kwa moja uwe wa asili kwa Kiswahili.
