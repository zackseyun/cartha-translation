base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/008.yaml
  text: O Yahweh[a], I love the habitation of your house, the place where your glory dwells.
translation:
  language: sw
  text: Ee Yahwe, ninayapenda makao ya nyumba yako na mahali pa maskani ya utukufu wako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi ‘Yahwe’ badala ya kubadilishwa na cheo; ‘Ee’ linaonyesha mwito wa moja kwa moja.
- source_word: אָהַבְתִּי
  choice: ninayapenda
  rationale: Ingawa kitenzi cha Kiebrania kiko katika umbo timilifu, katika ungamo hili la kishairi kinaweza kueleza msimamo wa kudumu wa sasa; ‘ninayapenda’ ni Kiswahili cha kawaida na wazi.
- source_word: מְעוֹן
  choice: makao
  rationale: Neno hili humaanisha makao au maskani. ‘Makao’ ni la asili na lenye hadhi katika Kiswahili, huku likidumisha picha halisi ya mahali pa kukaa.
- source_word: בֵּיתֶךָ
  choice: nyumba yako
  rationale: Hii ndiyo maana ya moja kwa moja. Ingawa muktadha unahusu patakatifu, ‘nyumba yako’ huepuka kufafanua zaidi ya maandishi kwa kutumia ‘hekalu.’
- source_word: וּמְקוֹם
  choice: mahali ambapo
  rationale: Kirai cha pili kimewasilishwa kama ufafanuzi wa ‘makao’; ‘mahali ambapo’ huleta Kiswahili kinachosomeka vizuri bila kupoteza dhana ya mahali.
- source_word: מִשְׁכַּן
  choice: unakaa
  rationale: Nomino ya Kiebrania ‘maskani/mahali pa kukaa’ imewasilishwa kwa kishazi cha kitenzi ili kuepuka mlolongo mzito wa nomino katika Kiswahili, bila kupoteza picha ya utukufu kukaa hapo.
- source_word: כְּבוֹדֶךָ
  choice: utukufu wako
  rationale: ‘Utukufu’ ndilo neno la kawaida na linalofaa kwa כָּבוֹד inapohusu uwepo wenye fahari wa Mungu.
theological_decisions:
- issue: Lugha ya patakatifu bila kuitambulisha kwa maelezo yaliyozidi maandishi
  choice: nyumba yako ... mahali ambapo utukufu wako unakaa
  alternative: hekalu lako ... mahali ambapo utukufu wako umetawazwa
  rationale: Maandishi yenyewe yanasema ‘nyumba’ na ‘kukaa/maskani.’ Tafsiri hii inadumisha picha hizo bila kuingiza ‘hekalu’ au ‘kutawazwa,’ ambayo hayajasemwa moja kwa moja.
- issue: Jina la agano יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Kutumia ‘Yahwe’ kunahifadhi jina binafsi lililo katika maandishi ya Kiebrania badala ya kulibadilisha na cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Makao ya nyumba yako’ kinadumisha msongamano wa picha ya Kiebrania, huku ‘mahali ambapo utukufu wako unakaa’ kikifanya sehemu ya pili isomeke kwa urahisi.
