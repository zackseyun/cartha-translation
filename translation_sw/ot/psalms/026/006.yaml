  text: Ninanawa mikono yangu kwa usafi[a], nami naizunguka[b] madhabahu yako, Ee Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kutokuwa na hatia” au “kwa unadhifu.” Neno la Kiebrania linaweza kumaanisha kutokuwa na hatia kimaadili au usafi wa kiibada.
