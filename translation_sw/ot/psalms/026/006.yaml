lexical_decisions:
- source_word: אֶרְחַץ
  choice: Ninanawa
  rationale: Ni kitenzi cha Qal, nafsi ya kwanza umoja, katika hali isiyotimilika. Katika ushairi huu kinaweza kuonyesha tendo la sasa au la kawaida; “ninanawa” ni Kiswahili cha kawaida na hakilazimishi maana ya wakati ujao.
- source_word: בְּנִקָּיוֹן
  choice: kwa kutokuwa na hatia
  rationale: Neno נִקָּיוֹן linaweza kumaanisha usafi au kutokuwa na hatia. Katika muktadha huu linaeleza namna ya kunawa na pia lina uzito wa kimaadili; tafsiri hii inahifadhi maana hiyo bila kuondoa uwezekano wa usafi wa kiibada.
- source_word: כַּפָּי
  choice: mikono yangu
  rationale: Ingawa כף linaweza kutaja viganja, katika usemi wa kunawa Kiswahili cha kawaida hutumia “mikono yangu.”
- source_word: וַאֲסֹבְבָה
  choice: nami naizunguka
  rationale: Mzizi סבב humaanisha kwenda kuzunguka au kuzunguka kitu. Umbo lenye kiishio cha msisitizo linaweza kudokeza azimio, lakini hapa hali ya sasa inaendana vizuri na kitenzi cha kwanza; “nami” huhifadhi uhusiano wa sentensi kwa lugha ya asili.
- source_word: מִזְבַּחֲךָ
  choice: madhabahu yako
  rationale: Hii ndiyo tafsiri ya kawaida na wazi ya מזבח pamoja na kiambishi cha nafsi ya pili umoja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo, kwa mujibu wa umbo la jina katika maandishi ya Kiebrania.
theological_decisions:
- issue: Maana ya נִקָּיוֹן katika tendo la kunawa mikono
  choice: kwa kutokuwa na hatia
  alternative: kwa usafi
  rationale: Kauli hiyo inaweza kuhusisha usafi wa kimaadili na wa kiibada. Maandishi makuu yanaonyesha uzito wa kimaadili, huku tanbihi ikihifadhi maana pana ya usafi.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu, si cheo; kwa hiyo limetoholewa moja kwa moja.
- issue: Nguvu ya kisarufi ya וַאֲסֹבְבָה
  choice: nami naizunguka
  alternative: nami nitaizunguka
  rationale: Kiishio cha kitenzi kinaweza kuonyesha azimio, lakini pia kinaweza kuendelea na maelezo ya tendo la sasa katika ushairi. Maandishi makuu hayalazimishi wakati ujao, na tanbihi inahifadhi uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. “Madhabahu” na “Yahwe” ni istilahi zinazofaa muktadha wa ibada, huku muundo wa sentensi ukibaki wa kawaida kwa msomaji wa leo.
