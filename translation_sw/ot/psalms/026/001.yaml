id: PSA.26.1
reference: Psalms 26:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לְ/דָוִ֨ד שָׁפְטֵ֤/נִי יְהוָ֗ה כִּֽי אֲ֭נִי בְּ/תֻמִּ֣/י הָלַ֑כְתִּי וּ/בַ/יהוָ֥ה בָּ֝טַ֗חְתִּי לֹ֣א אֶמְעָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/001.yaml
  text: Of David[a]. Vindicate me, O Yahweh, for I have walked in my integrity, and I have trusted in Yahweh[c][b]; I will not slip.
translation:
  language: sw
  text: 'Ya Daudi.[a]


    Ee Yahwe, nitendee haki,[b]

    kwa maana nimetembea katika uadilifu wangu,[c]

    nami nimemtumaini Yahwe;

    sitateleza.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kwa Daudi.” Kichwa hiki kinaweza kuonyesha utunzi, uhusiano, au wakfu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “nihukumu.” Katika muktadha huu maana yaelekea kuwa “amua kwa kunitetea” au “thibitisha haki yangu.”
    reason: lexical_alternative
  - marker: c
    text: Au “katika kutokuwa kwangu na lawama.” Neno la Kiebrania linaweza kumaanisha uadilifu, unyofu, au mwenendo usio na lawama.
    reason: lexical_alternative
  - marker: d
    text: Au “sitayumba.” Taswira ya Kiebrania ni ya kuteleza au kupoteza uthabiti wa miguu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Kihusishi לְ katika vichwa vya zaburi kinaweza kuonyesha utunzi, uhusiano, au wakfu. “Ya Daudi” ni usemi mfupi wa kawaida unaobakiza kiasi cha upana huo bila kuamua kwa lazima kuwa Daudi ndiye mwandishi.
- source_word: שָׁפְטֵנִי
  choice: nitendee haki
  rationale: Kitenzi שׁפט kimsingi ni ‘hukumu,’ lakini katika ombi hili mwombaji anatafuta hukumu iliyo upande wake. “Nitendee haki” linafikisha maana ya kuthibitishwa kuwa mwenye haki katika shauri bila kufuta kabisa taswira ya hukumu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kama “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: בְּתֻמִּי
  choice: katika uadilifu wangu
  rationale: תֹּם/תֻּמָּה huonyesha ukamilifu wa mwenendo, unyofu, au kutokuwa na lawama. “Uadilifu” huhifadhi dai la kimaadili bila kulifanya dai la kutokuwa na dhambi kabisa.
- source_word: הָלַכְתִּי
  choice: nimetembea
  rationale: Tafsiri hii inadumisha sitiari ya Kiebrania ya ‘kutembea’ kama mwenendo wa maisha, ambayo pia inaeleweka kwa Kiswahili.
- source_word: בָּטַחְתִּי
  choice: nimemtumaini
  rationale: בטח hueleza kumtegemea mtu kwa imani na usalama. “Nimemtumaini” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: לֹא אֶמְעָד
  choice: sitateleza
  rationale: מעד hutoa picha halisi ya mguu kuteleza au mtu kuyumba. “Sitateleza” huhifadhi taswira hiyo pamoja na uhakika wa msemaji.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi jina hilo katika umbo linalokubalika kwa Kiswahili.
- issue: Nguvu ya dai la בְּתֻמִּי
  choice: katika uadilifu wangu
  alternative: katika kutokuwa kwangu na lawama
  rationale: Msemaji anatoa dai la uadilifu wa mwenendo katika ombi la hukumu; mstari haulazimishi maana ya ukamilifu usio na dhambi. “Uadilifu” huhifadhi mvutano huo.
- issue: Uhakika katika לֹא אֶמְעָד
  choice: sitateleza
  alternative: nisije nikateleza
  rationale: Umbo la Kiebrania linaweza kusomwa kama kauli ya uhakika unaotokana na kumtumaini Yahwe. Tafsiri kuu inahifadhi kauli hiyo badala ya kuigeuza kuwa ombi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa kishairi, wenye heshima na unaoeleweka kwa msomaji wa kawaida. Mistari imepangwa ili kudumisha mwendo wa ushairi wa Kiebrania. “Ee” huonyesha ombi la moja kwa moja bila kuleta lugha nzito ya kale.
