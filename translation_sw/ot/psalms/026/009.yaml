base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/009.yaml
  text: Do not gather my soul with sinners[b][a], nor my life with men of bloodshed.
translation:
  language: sw
  text: Usiikusanye[a] nafsi yangu pamoja na wenye dhambi, wala uhai wangu pamoja na watu wa damu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usiiondoe nafsi yangu pamoja na wenye dhambi.” Kitenzi hiki kinaweza kumaanisha kuchukuliwa pamoja na waovu katika hukumu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “watu wa damu,” nahau ya Kiebrania kwa watu wenye jeuri au wenye hatia ya kumwaga damu.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאֱסֹף
  choice: uikusanye
  rationale: Kitenzi אָסַף kimsingi humaanisha ‘kukusanya,’ lakini katika ombi kuhusu hukumu kinaweza pia kudokeza kuondolewa pamoja na waovu. ‘Uikusanye’ huhifadhi taswira ya Kiebrania na utata wake wa kimuktadha.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: נֶפֶשׁ inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. ‘Nafsi yangu’ hutofautisha neno hili na חַיָּי katika mstari unaofuatana bila kulifanya liwe istilahi kali ya kifalsafa.
- source_word: חַטָּאִים
  choice: wenye dhambi
  rationale: Hili ni kundi la watu wanaotambulishwa kwa dhambi. ‘Wenye dhambi’ ni Kiswahili cha kawaida, wazi, na chenye hadhi.
- source_word: אַנְשֵׁי דָמִים
  choice: watu wenye hatia ya damu
  rationale: Kirai hicho kihalisi ni ‘watu wa damu nyingi,’ nahau ya Kiebrania kwa watu wenye jeuri au hatia ya kumwaga damu. Tafsiri hii huhifadhi wazo la damu na hatia bila kulibana kwa wauaji pekee.
- source_word: חַיָּי
  choice: uhai wangu
  rationale: Katika ulinganifu na נַפְשִׁי, neno hili linamaanisha uhai wa mtunga zaburi. ‘Uhai wangu’ huhifadhi ulinganifu wa kishairi pamoja na tofauti ya msamiati.
- source_word: אַל
  choice: Usi-
  rationale: אַל pamoja na kitenzi kisichotimilika huonyesha ombi hasi au katazo. Muundo ‘Usiikusanye’ ni wa kawaida katika sala ya Kiswahili.
theological_decisions:
- issue: Maana ya kibinadamu ya נַפְשִׁי na חַיָּי
  choice: 'Kuhifadhi maneno mawili yanayotofautiana kishairi: ‘nafsi yangu’ na ‘uhai wangu.’'
  alternative: Kutafsiri kwa ujumla zaidi kuwa ‘mimi’ na ‘maisha yangu,’ au kutumia ‘uhai wangu’ kwa yote mawili.
  rationale: Mstari haulazimishi fundisho maalumu kuhusu mgawanyiko wa mwili na nafsi, lakini Kiebrania kimetumia maneno mawili yanayohusiana katika ulinganifu. Kuyatofautisha huhifadhi uzito wa kishairi na kitheolojia bila kuongeza ufafanuzi usiotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sala ulio wazi na wenye hadhi. ‘Nafsi’ na ‘uhai’ huhifadhi ulinganifu wa kishairi; ‘watu’ limetumiwa badala ya ‘wanaume’ kwa kuwa nahau ya Kiebrania inaeleza tabia ya kundi, si lazima jinsia pekee.
