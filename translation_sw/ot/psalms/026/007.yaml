  text: to proclaim with a voice of thanksgiving[b][a], and to recount all your wondrous deeds.
translation:
  language: sw
  text: ili kuifanya sauti ya shukrani isikike[a], na kusimulia matendo yako yote ya ajabu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili kutangaza shukrani kwa sauti.” Kitenzi cha Kiebrania kina maana ya kusababisha kitu kisikike; tafsiri kuu huhifadhi maana hiyo ya kausativi.
    reason: lexical_alternative
  - marker: b
    text: Au, “maajabu yako” au “kazi zako za ajabu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַשְׁמִעַ
  choice: kuitangaza
  rationale: Kitenzi hiki katika Hiphil ni ‘kusababisha isikike’ au ‘kuifanya isikike.’ Katika Kiswahili cha kawaida, ‘kuitangaza’ kinaonyesha kwa ufasaha tendo la kuifanya shukrani isikike hadharani.
- source_word: בְּקוֹל
  choice: kwa sauti
  rationale: Kirai hiki kina maana halisi ya ‘kwa/katika sauti.’ ‘Kwa sauti’ huhifadhi taswira ya Kiebrania na ni cha kawaida katika Kiswahili.
- source_word: תּוֹדָה
  choice: shukrani
  rationale: Neno hili humaanisha shukrani na wakati mwingine sadaka au wimbo wa shukrani; hapa muktadha wa sauti unaelekeza kwenye shukrani inayotamkwa au kuimbwa.
- source_word: וּלְסַפֵּר
  choice: na kusimulia
  rationale: Kitenzi ספר katika Piel mara nyingi humaanisha kueleza au kusimulia kwa kina. ‘Kusimulia’ kinafaa katika usambamba wa kishairi bila kurudia ‘kutangaza.’
- source_word: כָּל
  choice: yote
  rationale: 'Maana yake ya moja kwa moja ni ya ujumla na ukamilifu: ‘yote.’'
- source_word: נִפְלְאוֹתֶיךָ
  choice: matendo yako yote ya ajabu
  rationale: Nomino hii hurejelea maajabu au matendo ya ajabu, hasa kazi za Mungu zisizo za kawaida. ‘Matendo yako ya ajabu’ huweka wazi maana ya vitendo iliyomo katika neno hilo.
