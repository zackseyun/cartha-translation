  text: שָׂ֭נֵאתִי קְהַ֣ל מְרֵעִ֑ים וְ/עִם רְ֝שָׁעִ֗ים לֹ֣א אֵשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/005.yaml
  text: I hate the assembly of evildoers[a], and I will not sit with the wicked.
translation:
  language: sw
  text: 'Ninachukia kusanyiko la watenda maovu,[a]

    wala sitaketi pamoja na waovu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nimelichukia kundi la watenda maovu.” Kitenzi timilifu cha Kiebrania kinaweza kutafsiriwa kwa kuelekezwa wakati uliopita, ingawa hapa yaelekea kinaonyesha msimamo thabiti wa mtunga zaburi.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: Ninachukia
  rationale: Kitenzi timilifu cha Qal, nafsi ya kwanza umoja, kinaeleza hapa msimamo thabiti wa mtunga zaburi. Wakati wa sasa katika Kiswahili unaonyesha hali hiyo ya kudumu kwa njia ya kawaida; ‘Nimechukia’ pia inawezekana lakini inaweza kusikika kama tendo la wakati uliopita.
- source_word: קְהַל
  choice: kusanyiko
  rationale: Neno hili humaanisha kundi lililokusanyika. ‘Kusanyiko’ linahifadhi maana hiyo bila kudokeza lazima mkutano wa ibada.
- source_word: מְרֵעִים
  choice: watenda maovu
  rationale: Hiki ni kitenzi-shirikishi kinachotumiwa kama nomino kwa watu wenye sifa ya kutenda maovu. Kauli hii ni wazi na ya kawaida katika Kiswahili.
- source_word: וְעִם
  choice: wala ... pamoja na
  rationale: Muunganiko huu unaunganisha mstari wa pili na wa kwanza. Katika Kiswahili, ‘wala’ huendeleza kwa kawaida kauli hasi, huku ‘pamoja na’ likihifadhi wazo la kushirikiana nao.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Ni kivumishi kinachotumiwa kama nomino kumaanisha watu waovu; ‘waovu’ ni kifupi, cha asili, na kinaendana na ‘watenda maovu’ katika ulinganifu wa kishairi.
- source_word: לֹא אֵשֵׁב
  choice: sitaketi
  rationale: Kitenzi cha nafsi ya kwanza umoja pamoja na ukanushaji kinaweza kueleza azimio au kukataa kwa mazoea. ‘Sitaketi’ linahifadhi taswira ya kuketi na hali ya uamuzi bila kulipanua kuwa ‘sitakaa’ kwa maana ya kuishi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa mistari miwili unahifadhi ulinganifu wa kishairi; ‘wala’ huunganisha kwa asili azimio hasi la mstari wa pili na msimamo wa mstari wa kwanza.
