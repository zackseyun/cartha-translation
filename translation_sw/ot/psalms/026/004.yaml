  text: 'Sijaketi pamoja na watu wa uongo,

    wala siingii pamoja na wanaojificha.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliojificha” au “waliofichika.” Huenda Kiebrania kinarejelea watu wanaoficha tabia yao halisi, yaani wadanganyifu au wanafiki.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: Sijaketi
  rationale: Kitenzi ישׁב kimsingi ni ‘kuketi, kukaa’; pamoja na עִם kinaweza pia kumaanisha kushirikiana na watu fulani. ‘Sijaketi pamoja na’ huhifadhi taswira ya Kiebrania na kueleweka kwa kawaida.
- source_word: מְתֵי שָׁוְא
  choice: watu wa uongo
  rationale: מְתֵי ni ‘watu wa,’ na שָׁוְא hapa hubeba maana ya uongo, udanganyifu au ubatili. ‘Watu wa uongo’ ni ya moja kwa moja, ya sasa, na huhifadhi uzito wa kimaadili.
- source_word: נַעֲלָמִים
  choice: wanaojificha walivyo
  rationale: Neno hili linatokana na עלם, ‘kuficha.’ Tafsiri hii inaonyesha watu wanaoficha tabia au hali yao halisi bila kutumia neno pana na lenye tafsiri zaidi kama ‘wanafiki.’
- source_word: אָבוֹא
  choice: siingii
  rationale: בוא inaweza kumaanisha kuja, kwenda au kuingia. Hapa, ikiwa sambamba na ‘kuketi pamoja na,’ ‘siingii pamoja na’ huhifadhi picha ya kujiunga na kundi lao.
- source_word: וְעִם
  choice: wala ... pamoja na
  rationale: Muundo huu unaunganisha kishazi cha pili na ukanushaji wa kwanza; ‘wala’ huonyesha vizuri ukanushaji unaoendelea huku ‘pamoja na’ ikiwakilisha עִם.
