  text: לֹ֤א בִ/גְבוּרַ֣ת הַ/סּ֣וּס יֶחְפָּ֑ץ לֹֽא בְ/שׁוֹקֵ֖י הָ/אִ֣ישׁ יִרְצֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/010.yaml
  text: He does not delight in the strength of the horse; he takes no pleasure in the legs of the man.
translation:
  language: sw
  text: Yeye hapendezwi na nguvu za farasi; wala hafurahii mapaja ya mwanamume.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֶחְפָּץ
  choice: hapendezwi
  rationale: Kitenzi חפץ hapa kinaonyesha kile kinachompendeza au anachokithamini; kauli hii ya Kiswahili ni ya kawaida na inadumisha ukanushi.
- source_word: גְבוּרַת הַסּוּס
  choice: nguvu za farasi
  rationale: Huwakilisha moja kwa moja nguvu au uweza wa farasi, hasa katika muktadha wa uwezo wa kibinadamu wa kivita.
- source_word: שׁוֹקֵי הָאִישׁ
  choice: miguu ya mwanamume
  rationale: שׁוֹקֵי hurejelea sehemu za chini za miguu, lakini katika mstari huu 'miguu' ni ya asili zaidi na inaonyesha nguvu za mwili; הָאִישׁ imetafsiriwa kwa umoja kama 'mwanamume'.
- source_word: יִרְצֶה
  choice: hafurahishwi
  rationale: רצה inaweza kumaanisha kupendezwa, kukubali, au kufurahia. Chaguo hili huhifadhi usambamba wa kishairi bila kulazimisha maana maalumu ya kukubali dhabihu.
theological_decisions:
- issue: Kitu ambacho Mungu hakithamini
  choice: Nguvu za farasi na miguu ya mwanamume zimetajwa bila ufafanuzi wa ziada.
  alternative: Kuongeza kwamba hizi ni nguvu za kijeshi au uwezo wa kibinadamu.
  rationale: Muktadha unaweza kudokeza uwezo wa vita na nguvu za binadamu, lakini maandishi yenyewe yanatumia taswira halisi; tafsiri haipaswi kuingiza ufafanuzi huo ndani ya mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo wa sentensi mbili sambamba umehifadhiwa.
