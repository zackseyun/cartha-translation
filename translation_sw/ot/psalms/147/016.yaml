base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/016.yaml
  text: He gives snow like wool[a]; he scatters frost like ashes.
translation:
  language: sw
  text: Hutoa theluji kama sufu; hutawanya sakitu kama majivu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנֹּתֵן
  choice: Hutoa
  rationale: Kivumishi-tendo cha Qal kinaeleza tendo la Mungu linaloendelea au la kawaida; “Hutoa” ni ya asili katika mfululizo huu wa kishairi.
- source_word: שֶׁלֶג
  choice: theluji
  rationale: Hii ndiyo maana ya kawaida ya neno la Kiebrania na sawa yake sanifu katika Kiswahili.
- source_word: כַצָּמֶר
  choice: kama sufu
  rationale: Kiambishi cha ulinganisho כ־ kimehifadhiwa kwa “kama,” huku “sufu” ikidumisha picha ya kitu cheupe na laini.
- source_word: כְּפוֹר
  choice: sakitu
  rationale: Neno hili humaanisha barafu nyembamba inayotanda juu ya vitu, yaani frost/hoarfrost; “sakitu” ni istilahi ya Kiswahili sanifu iliyo mahususi kuliko “barafu” ya jumla.
- source_word: כָּאֵפֶר
  choice: kama majivu
  rationale: Ulinganisho wa kishairi umehifadhiwa moja kwa moja; “majivu” ndiyo nomino ya kawaida ya Kiswahili kwa dutu hiyo.
- source_word: יְפַזֵּר
  choice: hutawanya
  rationale: Piel imperfect inaonyesha kutapakaza kwa upana; “hutawanya” hudumisha tendo lenye nguvu na hali yake ya kawaida.
