  text: He gives food to the animals[b][a], and to the young ravens that cry out.
translation:
  language: sw
  text: Huwapa wanyama chakula chao, na makinda ya kunguru yanayolia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “yanayoita”; maandishi hayataji wazi yanamwita nani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹתֵן
  choice: Huwapa
  rationale: Kitenzi kishirikishi cha Kiebrania kinaonyesha tendo la kawaida; Kiswahili cha sasa hutumia hali ya mazoea kwa njia ya asili. Kiambishi cha yambwa kinafaa kwa wapokeaji wanaofuata.
- source_word: לִבְהֵמָה
  choice: wanyama
  rationale: Neno linaweza kumaanisha mnyama au mifugo, lakini ulinganifu wake na makinda ya kunguru unaunga mkono maana pana ya wanyama.
- source_word: לַחְמָהּ
  choice: chakula chao
  rationale: Ingawa maana ya msingi ya לֶחֶם ni mkate, hapa humaanisha chakula kwa ujumla. Kiwakilishi cha Kiebrania ni umoja wa kijumla; Kiswahili hutumia wingi kwa upatanisho wa kawaida na “wanyama.”
- source_word: לִבְנֵי עֹרֵב
  choice: makinda ya kunguru
  rationale: Muundo wa “wana wa” pamoja na jina la mnyama humaanisha watoto wake; “makinda ya kunguru” ni tafsiri ya asili na sahihi.
- source_word: אֲשֶׁר יִקְרָאוּ
  choice: yanapolia
  rationale: קרא hapa ni kuita au kulia. Tafsiri hii huhifadhi kilio cha makinda bila kuongeza anayelengwa na kilio hicho.
theological_decisions:
- issue: Ikiwa itajwe wazi kwamba makinda ya kunguru yanamlilia Mungu
  choice: 'Kuacha mlengwa bila kutajwa: “yanapolia”'
  alternative: yanapomlilia yeye
  rationale: Kiebrania hakimtaji wazi anayelengwa na kilio hicho. Kuacha yambwa hudumisha utata halisi wa maandishi bila kupunguza muktadha wa utunzaji wa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Makinda” ni neno la kawaida kwa watoto wa ndege; sentensi imeundwa kwa mtiririko wa kawaida huku ikihifadhi kutotajwa kwa mlengwa wa kilio.
