base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/001.yaml
  text: Praise Yah[a], for it is good to sing praises to our God[b]; for it is pleasant and praise is fitting.
translation:
  language: sw
  text: Msifuni Yah[a], kwa maana ni vema kumwimbia Mungu wetu sifa; kwa maana inapendeza, na sifa zinafaa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Yah,” umbo fupi la jina la Mungu; tafsiri nyingi hutumia “BWANA.”'
    reason: alternative_reading
  - marker: b
    text: Au “sifa ni nzuri” au “sifa inapendeza,” kwa kuwa neno la Kiebrania linaweza kumaanisha kilicho kizuri au kinachofaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ֥לְלוּ
  choice: Msifuni
  rationale: Kauli ya kuamuru kwa wingi kutoka הלל; “Msifuni” ni mwito wa moja kwa moja kwa jumuiya.
- source_word: יָ֨הּ
  choice: Yah
  rationale: Ni umbo fupi la jina la Mungu, tofauti na tetragramatoni kamili; kulihifadhi kunaonyesha uhusiano wake na “Haleluya.”
- source_word: כִּי טוֹב
  choice: kwa maana ni vema
  rationale: כִּי inatoa sababu ya mwito, na טוֹב hapa hutathmini tendo la kusifu kuwa jema; “ni vema” ni Kiswahili cha kawaida katika muundo huu.
- source_word: זַמְּרָה אֱלֹהֵינוּ
  choice: kumwimbia Mungu wetu sifa
  rationale: זמר huhusu sifa ya kimuziki; “kumwimbia ... sifa” huhifadhi wazo la kuimba na kusifu, pamoja na Mungu kuwa mlengwa.
- source_word: נָעִים
  choice: inapendeza
  rationale: Hueleza sifa kuwa ya kupendeza au yenye furaha; kitenzi hiki ni cha asili katika Kiswahili na hakibani maana kwenye uzuri wa kuona.
- source_word: נָאוָה תְהִלָּה
  choice: sifa inafaa
  rationale: נָאוָה inaweza kumaanisha kinachofaa, kinachopendeza, au kizuri; “inafaa” huhifadhi hasa wazo la ustahili bila kuondoa kabisa uwezekano wa uzuri.
theological_decisions:
- issue: Kutafsiri jina la Mungu יָהּ
  choice: Yah
  alternative: BWANA
  rationale: Chanzo kina umbo fupi יָהּ, si jina kamili יהוה. Kulitohoa kama “Yah” huhifadhi tofauti hiyo na mwangwi wa “Haleluya,” bila kuingiza tafsiri ya cheo.
- issue: Maana ya נָאוָה kuhusu sifa
  choice: sifa inafaa
  alternative: sifa ni nzuri / sifa inapendeza
  rationale: Neno linaweza kueleza kufaa au uzuri. Matini kuu inachagua maana ya kufaa, huku tanbihi ikihifadhi maana mbadala ya uzuri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Msifuni” huhifadhi amri ya wingi; “kumwimbia ... sifa” ni ya asili kuliko tafsiri ya neno kwa neno. Alama zote za tanbihi zimo katika matini kuu.
