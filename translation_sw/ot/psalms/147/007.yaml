  yaml_path: translation/ot/psalms/147/007.yaml
  text: Sing to Yahweh with thanksgiving[b][a]; make melody to our God with the lyre.
translation:
  language: sw
  text: Mwimbieni Yahweh kwa shukrani[a]; mpigieni Mungu wetu kinubi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwitikieni Yahweh kwa shukrani.” Kitenzi cha Kiebrania kinaweza kumaanisha “jibu” au “itikia,” lakini hapa huenda kinamaanisha kuimba kwa kuitikiana.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa zeze.” Neno la Kiebrania kinnor linataja ala ya nyuzi, ambayo kwa usahihi zaidi ni kinubi.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֱנוּ
  choice: Mwimbieni
  rationale: Katika muktadha wa muziki na ibada, kitenzi hiki chenye maana ya msingi ya ‘jibu/itikia’ kinaweza kumaanisha kuimba kwa kuitikiana. ‘Mwimbieni’ ni Kiswahili cha kawaida na kinaendana na ulinganifu wa זַמְּרוּ.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Kihusishi ל kinaonyesha anayeelekezewa wimbo, na jina la agano יהוה limetoholewa kuwa ‘Yahweh’.
- source_word: בְּתוֹדָה
  choice: kwa shukrani
  rationale: תּוֹדָה hapa linaonyesha shukrani au sifa ya kushukuru; ‘kwa shukrani’ huhifadhi msisitizo wa moyo wa kutoa asante.
- source_word: זַמְּרוּ
  choice: mwimbieni
  rationale: זמר humaanisha kuimba sifa au kufanya muziki. Kwa kuwa kinubi kimetajwa wazi, ‘mwimbieni ... kwa kinubi’ huwasilisha tendo la muziki kwa Kiswahili cha asili.
- source_word: לֵאלֹהֵינוּ
  choice: Mungu wetu
  rationale: ‘Mungu wetu’ huhifadhi kiwakilishi cha umoja wa jumuiya, huku muktadha wa kitenzi ukionyesha kwamba yeye ndiye anayeelekezewa wimbo.
- source_word: בְכִנּוֹר
  choice: kwa kinubi
  rationale: כִּנּוֹר ni ala ya nyuzi inayotambulishwa kwa usahihi zaidi kuwa kinubi; kihusishi ב kinaonyesha ala inayotumiwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la Mungu la herufi nne. ‘Yahweh’ hulihifadhi kama jina maalumu bila kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni mfupi na wa kishairi; urudiaji wa ‘mwimbieni’ huhifadhi usambamba wa mistari ya Kiebrania.
