lexical_decisions:
- source_word: בּוֹנֵה
  choice: huijenga
  rationale: Kitenzi kishirikishi cha Kiebrania kinaonyesha tendo la kawaida au linaloendelea. Muundo wa Kiswahili ‘huijenga’ unaleta maana hiyo bila kuongeza waziwazi ‘upya,’ ingawa muktadha unahusu kurejeshwa kwa Yerusalemu.
- source_word: יְרוּשָׁלִַם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili sanifu cha Biblia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama ‘BWANA.’
- source_word: נִדְחֵי
  choice: watu ... waliotawanywa
  rationale: Neno hili humaanisha watu waliofukuzwa, kutawanywa, au kupelekwa mbali. ‘Waliotawanywa’ ni la kawaida katika Kiswahili na linahifadhi upana wa maana bila kulibana kuwa uhamisho rasmi pekee.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la taifa limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: יְכַנֵּס
  choice: huwakusanya
  rationale: Piel imperfect ya כנס humaanisha kukusanya au kuwakutanisha. ‘Huwakusanya’ inalingana na hali ya kawaida/endelevu inayoonyeshwa na mstari huu.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kujengwa kwa Yerusalemu
  choice: huijenga
  alternative: huijenga upya; huirejesha
  rationale: Kiebrania kinasema moja kwa moja ‘hujenga.’ Muktadha unaweza kudokeza ujenzi wa kurejesha, lakini tafsiri haiongezi ‘upya’ na hivyo haifungi maana hiyo kupita maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha rahisi na yenye heshima. Muundo wa ‘hu-’ unaonyesha matendo ya Mungu kama ya kawaida au yanayoendelea, kulingana na maumbo ya vitenzi vya Kiebrania.
