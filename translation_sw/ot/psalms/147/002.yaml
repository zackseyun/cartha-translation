  text: Yahweh huijenga Yerusalemu; huwakusanya waliotawanywa[a] wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliofukuzwa,” “waliopelekwa mbali,” au “wahamishwa wa Israeli.”
