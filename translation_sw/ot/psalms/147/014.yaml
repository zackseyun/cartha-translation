lexical_decisions:
- source_word: הַשָּׂם
  choice: Huifanya
  rationale: Kitenzi שׂוּם kina maana ya kuweka, kufanya, au kusababisha hali fulani. Muundo wa sasa wa mazoea unaendeleza sifa kwa Mungu katika muktadha na unasikika kwa kawaida katika Kiswahili.
- source_word: גְּבוּלֵךְ
  choice: mipaka yako
  rationale: גְּבוּל inaweza kumaanisha mpaka, mipaka, au eneo. “Mipaka yako” inafaa kwa Yerusalemu anayesemeshwa kwa nafsi ya kike katika muktadha.
- source_word: שָׁלוֹם
  choice: iwe na amani
  rationale: 'שָׁלוֹם hapa inaeleza hali ya mipaka: amani, usalama, na ustawi. “Iwe na amani” ni ya kawaida katika Kiswahili na haiibani maana kuwa kutokuwapo kwa vita pekee.'
- source_word: חֵלֶב חִטִּים
  choice: ngano bora kabisa
  rationale: Kifungu hiki kihalisi ni “unono/mafuta ya ngano,” nahau ya Kiebrania inayomaanisha sehemu iliyo nono, tajiri, au bora zaidi. “Ngano bora kabisa” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: יַשְׂבִּיעֵךְ
  choice: hukushibisha
  rationale: Hiphil ya שׂבע humaanisha kushibisha au kujaza hadi kutosheka. “Hukushibisha” huhifadhi picha ya riziki tele ya Mungu.
