  text: שַׁבְּחִ֣י יְ֭רוּשָׁלִַם אֶת יְהוָ֑ה הַֽלְלִ֖י אֱלֹהַ֣יִ/ךְ צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/012.yaml
  text: Praise Yahweh[a], O Jerusalem; praise your God, O Zion.
translation:
  language: sw
  text: 'Ee Yerusalemu, msifu Yahweh;

    ee Sayuni, msifu Mungu wako.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁבְּחִי
  choice: msifu
  rationale: Kitenzi cha amri, nafsi ya pili umoja wa kike, kikielekezwa kwa Yerusalemu kama mji uliotajwa kana kwamba ni mtu. “Msifu” ni Kiswahili cha kawaida na chenye hadhi, na kinadumisha ulinganifu na הַֽלְלִי.
- source_word: יְרוּשָׁלִַם
  choice: Yerusalemu
  rationale: Jina hili limetolewa kwa tahajia iliyozoeleka katika Kiswahili sanifu.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: אֶת ni alama ya yambwa dhahiri, nayo יְהוָה ni jina la Mungu. Jina hilo limetoholewa kama “Yahweh” ili kulihifadhi kama jina binafsi lililo katika Kiebrania.
- source_word: הַֽלְלִי
  choice: msifu
  rationale: Kitenzi cha amri, nafsi ya pili umoja wa kike. Kurudia “msifu” kunawasilisha vizuri usambamba wa kishairi kati ya שׁבח na הלל bila kulazimisha tofauti kubwa ya maana.
- source_word: אֱלֹהַיִךְ
  choice: Mungu wako
  rationale: Umbo hili lina kiambishi cha nafsi ya pili umoja wa kike na hapa linamtaja Mungu wa Sayuni katika umoja. “Mungu wako” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: צִיּוֹן
  choice: Sayuni
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili. Sambamba na Yerusalemu, linataja mji au jumuiya yake kana kwamba ni mtu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina binafsi יְהוָה. “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo; “BWANA” na “Yehova” ni mapokeo mbadala, lakini hayajachaguliwa hapa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. “Ee” linaonyesha mwito wa moja kwa moja kwa miji iliyotajwa kana kwamba ni watu. Mpangilio wa mistari miwili unadumisha usambamba wa Kiebrania.
