  text: He counts the number of the stars; he calls all of them by name.
translation:
  language: sw
  text: Anahesabu idadi ya nyota; anaziita zote kwa majina.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹנֶה
  choice: Anahesabu
  rationale: Kitenzi hiki katika umbo la kushiriki kina maana ya kuhesabu au kuweka hesabu. “Anahesabu” ni Kiswahili cha kawaida na huhifadhi tendo linaloendelea katika ushairi.
- source_word: מִסְפָּר
  choice: idadi
  rationale: Neno hili humaanisha idadi au hesabu. Pamoja na מוֹנֶה, kirai “anahesabu idadi” kinahifadhi msisitizo wa Kiebrania juu ya hesabu kamili.
- source_word: לַכּוֹכָבִים
  choice: ya nyota
  rationale: Kiambishi ל hapa ni sehemu ya muundo wa nahau unaohusisha “idadi”; Kiswahili cha asili husema “idadi ya nyota.”
- source_word: לְכֻלָּם
  choice: zote
  rationale: Huhifadhi maana jumuishi kwamba hakuna nyota hata moja iliyoachwa, huku upatanisho wa ngeli ukirejelea nyota.
- source_word: שֵׁמוֹת
  choice: kwa majina
  rationale: Ingawa kihalisi ni “majina,” pamoja na קרא Kiswahili cha kawaida hutumia “kuita kwa jina.” Wingi “kwa majina” unaakisi umbo la wingi la Kiebrania na utofauti wa majina.
- source_word: יִקְרָא
  choice: anaziita
  rationale: קרא inaweza kumaanisha kuita, kutaja, au kuamuru ije. “Anaziita” pamoja na “kwa majina” huhifadhi kwa kawaida wazo la kila nyota kuitwa kwa jina bila kuamua zaidi kama tendo hilo ni kutaja jina au kuita ije.
theological_decisions:
- issue: Mtenda ametajwa kwa kudokezwa, si kwa nomino wazi
  choice: Kutumia kiambishi cha nafsi “a-” katika “Anahesabu” na “anaziita,” kikimrejelea Mungu katika muktadha.
  alternative: Kumtaja “Mungu” au “BWANA” wazi katika mstari huu.
  rationale: Kiebrania hakitaji nomino ya mtenda katika mstari huu; mtenda anaendelea kutoka muktadha. Kiswahili huhitaji kuonyesha nafsi katika kitenzi, lakini halihitaji kuongeza jina lisilokuwapo.
- issue: Maana ya קרא pamoja na שֵׁמוֹת
  choice: “anaziita zote kwa majina”
  alternative: “anazipa zote majina”
  rationale: Chaguo hili huhifadhi uwezekano wa kuita kila nyota kwa jina, badala ya kuamua kwamba mstari unazungumzia tu tendo la awali la kuzipa majina.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi bila kuwa kigumu. Ulinganifu wa vipashio viwili vya Kiebrania umehifadhiwa kwa nuktamkato.
