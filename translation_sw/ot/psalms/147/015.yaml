  text: הַ/שֹּׁלֵ֣חַ אִמְרָת֣/וֹ אָ֑רֶץ עַד מְ֝הֵרָ֗ה יָר֥וּץ דְּבָרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/015.yaml
  text: He sends his command to the earth[b][a]; his word runs swiftly.
translation:
  language: sw
  text: Hutuma agizo lake[a] duniani; neno lake hukimbia kwa kasi sana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tamko lake” (אִמְרָתוֹ).
    reason: lexical_alternative
  - marker: b
    text: Au “kwa haraka.” Usemi wa Kiebrania unasisitiza mwendo wa kasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁלֵחַ
  choice: Hutuma
  rationale: Kitenzi cha hali ya kuendelea kinaeleza tendo la Mungu linaloendelea; “hutuma” ni Kiswahili cha kawaida na cha asili katika muktadha huu.
- source_word: אִמְרָתוֹ
  choice: agizo lake
  rationale: Neno hili linaweza kumaanisha tamko au usemi, lakini hapa linaonyesha usemi wa Mungu wenye kutenda na kuamuru. “Agizo” pia linatofautishwa kwa kufaa na דְּבָרוֹ katika sehemu ya pili.
- source_word: אָרֶץ
  choice: duniani
  rationale: Muktadha wa zaburi una upeo wa uumbaji mzima; “duniani” ni ya asili zaidi kuliko tafsiri yenye maana finyu ya nchi.
- source_word: עַד מְהֵרָה
  choice: kwa kasi sana
  rationale: Usemi huu unasisitiza mwendo wa haraka. “Kwa kasi sana” huwasilisha msisitizo huo kwa Kiswahili cha kawaida huku maelezo ya chini yakihifadhi uwezekano wa tafsiri isiyo na neno “sana”.
- source_word: יָרוּץ
  choice: hukimbia
  rationale: Maana ya msingi ni kukimbia; kuitunza hulinda taswira ya kishairi inayolifanya neno la Mungu lionekane likienda kwa mwendo.
- source_word: דְּבָרוֹ
  choice: neno lake
  rationale: “Neno” linafaa katika usambamba wa kishairi na “agizo,” huku likihifadhi tofauti ya msamiati kati ya nomino mbili za Kiebrania.
theological_decisions:
- issue: Asili ya usemi wa Mungu katika usambamba wa kishairi
  choice: Usemi wa Mungu umetafsiriwa kama agizo na neno lenye nguvu ya kutenda, bila kuingiza wazi mafundisho ya baadaye kuhusu Logos binafsi.
  alternative: Kutafsiri nomino zote mbili kuwa “neno,” au kuifanya aya hiyo iwe na maana ya moja kwa moja ya Kikristo kuhusu Kristo.
  rationale: Zaburi inazungumzia usemi wa Mungu wenye nguvu katika uumbaji na majaliwa. Tafsiri inahifadhi uzito huo bila kuongeza dai ambalo maandishi ya Kiebrania hayasemi wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi na usambamba wa kishairi vimehifadhiwa; “hukimbia” inadumisha uhuishaji wa neno la Mungu.
