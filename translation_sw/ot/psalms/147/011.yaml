  yaml_path: translation/ot/psalms/147/011.yaml
  text: Yahweh delights in those who fear him[b][a], in those who hope for his steadfast love.
translation:
  language: sw
  text: 'Yahwe hupendezwa na wale wanaomcha,

    na wale wanaotumaini upendo wake wa kudumu[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanaongojea upendo wake kwa tumaini.” Kitenzi cha Kiebrania kinaweza kumaanisha kutumaini au kungojea kwa matarajio.
    reason: lexical_alternative
  - marker: b
    text: “Upendo wa kudumu” hutafsiri neno la Kiebrania hesed, ambalo mara nyingi huhusisha upendo mwaminifu, rehema, na uaminifu wa Mungu kwa watu wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוֹצֶה
  choice: hupendezwa na
  rationale: Kitenzi רצה hapa kinaonyesha kukubali kwa furaha au kupata kupendezwa na mtu, si kutaka jambo tu. “Hupendezwa na” ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya uhusiano.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa kunukuu matamshi yake badala ya kulibadilisha kuwa cheo kama “BWANA.”
- source_word: יְרֵאָיו
  choice: wale wanaomcha
  rationale: Uundaji huu unawataja watu wenye tabia ya kumcha Mungu. “Wanaomcha” huhifadhi uzito wa hofu yenye staha bila kuipunguza iwe heshima tu.
- source_word: הַמְיַחֲלִים
  choice: wale wanaoutumainia
  rationale: יחל inaweza kueleza kutumaini pamoja na kungoja kwa matarajio. “Wanaoutumainia” ni ya kawaida katika Kiswahili na inaonyesha matarajio yenye imani; maana ya kungoja imetajwa katika tanbihi.
- source_word: לְחַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חסד huunganisha upendo, rehema, uaminifu na ushikamanifu wa kudumu. “Upendo wake thabiti” ni tafsiri fupi inayohifadhi upendo na uthabiti wake bila kuifunga istilahi hiyo kwa maana moja tu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kumcha Mungu
  choice: wale wanaomcha
  alternative: wale wanaomheshimu sana
  rationale: “Kumcha” huhifadhi mvutano wa kibiblia wa hofu yenye staha na utegemezi kwa Mungu; “kumheshimu sana” peke yake ingeweza kupunguza maana hiyo.
- issue: Tumaini na kungoja katika יחל
  choice: wanaoutumainia
  alternative: wanaousubiri kwa tumaini
  rationale: Kitenzi kinaweza kuhusisha tumaini na kungoja kwa matarajio. Matini kuu inatumia “kutumainia,” huku tanbihi ikihifadhi wazi wazo la kungoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa mistari miwili unahifadhi usambamba wa kishairi. Lugha ya “kumcha” haijalainishwa, na wingi wa maana katika יחל na חסד umehifadhiwa kwa matini pamoja na tanbihi.
