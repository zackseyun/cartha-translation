  text: מְעוֹדֵ֣ד עֲנָוִ֣ים יְהוָ֑ה מַשְׁפִּ֖יל רְשָׁעִ֣ים עֲדֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/006.yaml
  text: Yahweh lifts up the humble[b][a]; he brings the wicked down to the ground.
translation:
  language: sw
  text: Yahwe huwainua wanyenyekevu[a]; huwaangusha waovu mpaka chini kabisa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “huwategemeza wanyenyekevu.” Neno la Kiebrania linaweza pia kuonyesha kuwatia nguvu au kuwasaidia walio chini.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “hadi kwenye ardhi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעוֹדֵד
  choice: huwainua
  rationale: Kitenzi hiki kina maana ya kuwatia nguvu, kuwategemeza, au kuwainua. “Huwainua” kinadumisha utofauti wa kimchoro na מַשְׁפִּיל, “huwaangusha,” huku maana ya kuwasaidia walio chini ikibaki wazi.
- source_word: עֲנָוִים
  choice: wanyenyekevu
  rationale: Neno hili linaweza kumaanisha wanyenyekevu, wapole, au watu walioteswa na kudhalilishwa. “Wanyenyekevu” linaeleweka kwa urahisi na linadumisha utofauti wa kimaadili na “waovu.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi, badala ya kubadilishwa kuwa cheo kama “BWANA.” Tahajia “Yahwe” ni ya kawaida na ya asili katika Kiswahili.
- source_word: מַשְׁפִּיל
  choice: huwaangusha
  rationale: Umbo hili la kisababishi lina maana ya kuwafanya kuwa chini au kuwashusha. “Huwaangusha” linaonyesha tendo hilo na linapingana moja kwa moja na “huwainua.”
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Hili ni neno la kawaida na lililo wazi katika Kiswahili kwa kundi la watu wanaotajwa kwa tabia yao ya uovu.
- source_word: עֲדֵי אָרֶץ
  choice: mpaka chini kabisa
  rationale: Kirai hiki kinaonyesha kushushwa hadi kwenye ardhi. “Mpaka chini kabisa” ni Kiswahili cha kawaida kinachodumisha msisitizo wa kushushwa kabisa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” linahifadhi jina hilo bila kulibadilisha kuwa cheo, wala kuchagua matamshi ya jadi “Yehova.”
- issue: Maana ya עֲנָוִים
  choice: wanyenyekevu
  alternative: waliodhulumiwa au wapole
  rationale: Neno linaweza kuhusisha hali ya unyenyekevu na pia hali ya kudhulumiwa au kuwa chini kijamii. Maandishi makuu yanatumia “wanyenyekevu,” huku tanbihi ikihifadhi upana wa maana bila kuamua kwamba ni hali ya kiroho pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Vitenzi vya mazoea “huwainua” na “huwaangusha” vinaakisi vihusishi vya Kiebrania vinavyoeleza matendo ya kawaida ya Yahwe. Alama zote za tanbihi zimewekwa baada ya maneno yanayohusika.
