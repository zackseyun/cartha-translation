  yaml_path: translation/ot/psalms/147/003.yaml
  text: He heals the brokenhearted and binds up their wounds[a].
translation:
  language: sw
  text: Huwaponya waliovunjika moyo, na kuyafunga majeraha yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maumivu yao” au “uchungu wao.” Neno la Kiebrania linaweza kumaanisha maumivu, uchungu, au majeraha; “majeraha” yametumiwa kwa sababu yanaendana na taswira ya kuyafunga.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹפֵא
  choice: Huwaponya
  rationale: Kitenzi-shirikishi cha Kiebrania kinaeleza tendo la Mungu linaloendelea au la kawaida. Kiswahili cha sasa hutumia kwa kawaida kitenzi hiki kuonyesha tabia hiyo ya kudumu.
- source_word: לִשְׁבוּרֵי לֵב
  choice: waliovunjika moyo
  rationale: Huhifadhi sitiari ya Kiebrania ya watu ‘waliovunjika moyo’ kwa usemi wa kawaida, wazi na wenye hadhi katika Kiswahili.
- source_word: וּמְחַבֵּשׁ
  choice: na kuyafunga
  rationale: Katika muktadha wa uponyaji, mzizi huu humaanisha kufunga au kuweka bandeji; ‘kuyafunga’ huhifadhi taswira halisi ya kutibu majeraha.
- source_word: לְעַצְּבוֹתָם
  choice: majeraha yao
  rationale: Nomino hii inaweza kumaanisha maumivu, majeraha, au uchungu. ‘Majeraha’ inafaa zaidi pamoja na tendo la kuyafunga, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
theological_decisions:
- issue: Upeo wa taswira ya uponyaji
  choice: Kudumisha pamoja taswira ya kuponya uchungu wa ndani na kufunga majeraha
  alternative: Kuifanya aya ihusu faraja ya kiroho pekee, au uponyaji wa mwili pekee
  rationale: Usambamba wa kishairi unaunganisha waliovunjika moyo na kufungwa kwa majeraha. Tafsiri haipaswi kuondoa mvutano huo kwa kuufanya dai finyu la kimafundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Waliovunjika moyo’ ni usemi wa kawaida unaohifadhi sitiari ya chanzo; ‘kuyafunga majeraha’ hudumisha taswira ya kitabibu bila kuzuia maana ya uchungu wa ndani.
