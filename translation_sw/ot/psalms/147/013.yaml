  source_fidelity: The draft correctly preserves the causal כִּי, the completed strengthening and blessing actions, the plural gate-bars, and the collective sense of בָּנַיִךְ as ‘watoto wako.’ The corrupted form ‘mip横’ does not represent the Hebrew בְּרִיחֵי and must be corrected to ‘mipingo.’ ‘Ndani yako’ accurately conveys the city-directed sense of בְּקִרְבֵּךְ.
