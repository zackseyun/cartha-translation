  text: כִּֽי חִ֭זַּק בְּרִיחֵ֣י שְׁעָרָ֑יִ/ךְ בֵּרַ֖ךְ בָּנַ֣יִ/ךְ בְּ/קִרְבֵּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/013.yaml
  text: For he has strengthened the bars of your gates[b][a]; he has blessed your children within you.
translation:
  language: sw
  text: Kwa maana ameiimarisha mipingo ya malango yako; amewabariki watoto wako ndani yako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wana wako.” Neno la Kiebrania linaweza kumaanisha wana wa kiume au watoto na wazao kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huleta sababu ya wito wa sifa katika mstari uliotangulia na kudumisha uhusiano wa kisababishi.
- source_word: חִזַּק
  choice: ameiimarisha
  rationale: Piel timilifu inaonyesha tendo la kufanya kitu kiwe imara; umoja wa kitenzi unapatana na nomino ya pamoja ‘mip横’.
- source_word: בְּרִיחֵי
  choice: mip横
  rationale: Humaanisha vyuma au magogo ya kufungia malango; neno hili linaeleza kifaa cha usalama bila kubainisha zaidi muundo wake.
- source_word: שְׁעָרָיִךְ
  choice: malango yako
  rationale: Huhifadhi wingi na kiambishi cha nafsi ya pili, umoja wa kike, kinachoelekezwa kwa Yerusalemu iliyofanywa kama mtu.
- source_word: בֵּרַךְ
  choice: amewabariki
  rationale: Hutoa moja kwa moja maana ya Piel timilifu ya ברך na huonyesha tendo lililotimizwa.
- source_word: בָּנַיִךְ
  choice: watoto wako
  rationale: בנים inaweza kumaanisha wana wa kiume au watoto/wazao kwa ujumla; katika hotuba kwa mji, maana pana ya raia wake inafaa.
- source_word: בְּקִרְבֵּךְ
  choice: walio katikati yako
  rationale: Huhifadhi taswira ya Kiebrania ‘katikati yako’ na kuifanya sentensi ya Kiswahili iwe wazi na ya kawaida.
theological_decisions:
- issue: Mlengwa wa kike katika umoja aliyefanywa kama mtu
  choice: Viambishi vya ‘yako’ vinadumisha hotuba ya moja kwa moja kwa mji bila kuingiza jina lake katika mstari.
  alternative: Kutaja Yerusalemu waziwazi katika mstari.
  rationale: Kiebrania kina viambishi vya nafsi ya pili, umoja wa kike, vinavyorejelea Yerusalemu/Sayuni; si lazima kuongeza jina lisilokuwamo.
- issue: Maana ya בנים katika muktadha wa mji
  choice: watoto wako
  alternative: wana wako
  rationale: Neno linaweza kuwa la kiume mahsusi au la jumla. Muktadha wa mji na wakazi wake unapendelea maana ya kijumla, huku uwezekano wa tafsiri mahsusi ukitajwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Muundo wa sababu, taswira ya usalama wa malango, na umbo la mji aliyefanywa kama mtu vimehifadhiwa.
