  text: גָּד֣וֹל אֲדוֹנֵ֣י/נוּ וְ/רַב כֹּ֑חַ לִ֝/תְבוּנָת֗/וֹ אֵ֣ין מִסְפָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/005.yaml
  text: Great is our Lord[a], and abundant in power; his understanding is beyond number.
translation:
  language: sw
  text: Bwana wetu ni mkuu na ana nguvu nyingi; ufahamu wake hauna hesabu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ufahamu wake hauna kipimo” au “hauhesabiki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: ni mkuu
  rationale: Kivumishi hiki kinatangulia katika Kiebrania kwa mkazo wa sifa; Kiswahili cha kawaida huhitaji kiunganishi “ni,” huku “mkuu” kikihifadhi maana na hadhi ya usemi.
- source_word: אֲדוֹנֵינוּ
  choice: Bwana wetu
  rationale: Hiki ni cheo אֲדוֹן chenye kiambishi cha wingi nafsi ya kwanza, si jina la Mungu YHWH; “Bwana wetu” huhifadhi cheo na umilikaji huo.
- source_word: וְרַב כֹּחַ
  choice: na ana nguvu nyingi
  rationale: רַב huonyesha wingi au ukubwa wa kiwango, na כֹּחַ ni nguvu au uwezo. “Ana nguvu nyingi” ni usemi wa asili na unaoeleweka katika Kiswahili bila kurudia “mkuu.”
- source_word: לִתְבוּנָתוֹ
  choice: ufahamu wake
  rationale: תְּבוּנָה inaweza kumaanisha ufahamu, utambuzi, au maarifa ya kina; “ufahamu” ni pana, ya kawaida, na inafaa katika sifa hii.
- source_word: אֵין מִסְפָּר
  choice: hauna kipimo
  rationale: Nahau ya Kiebrania husema kihalisi kuwa hakuna hesabu kwa ufahamu wake. “Hauna kipimo” ni Kiswahili cha asili kinachoonyesha kutokuwa na kikomo huku tanbihi ikihifadhi taswira ya kuhesabu.
theological_decisions:
- issue: Kutafsiri cheo cha Mungu אֲדוֹנֵינוּ
  choice: Bwana wetu
  alternative: Mkuu wetu
  rationale: “Bwana wetu” hutafsiri cheo אֲדוֹן bila kukichanganya na jina la agano YHWH, na huhifadhi kiambishi “wetu.”
- issue: Jinsi ya kueleza kutokuwa na mwisho kwa ufahamu wa Mungu
  choice: ufahamu wake hauna kipimo
  alternative: ufahamu wake hauna hesabu
  rationale: Chaguo kuu ni la asili katika Kiswahili na halipunguzi dai la mstari; tanbihi huhifadhi kwa uwazi zaidi nahau halisi ya hesabu na hivyo kutoondoa uwezekano wake wa kimaana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi bila kuwa kigumu. Muundo ni wazi kwa wasomaji wa kawaida; alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
