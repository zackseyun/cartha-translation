  text: מַשְׁלִ֣יךְ קַֽרְח֣/וֹ כְ/פִתִּ֑ים לִ/פְנֵ֥י קָ֝רָת֗/וֹ מִ֣י יַעֲמֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/017.yaml
  text: He throws down his ice like crumbs[b][a]; who can stand before his cold?
translation:
  language: sw
  text: Hutupa barafu yake kama vipande vidogo[a]; nani awezaye kustahimili baridi yake?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama matonge madogo” au “kama vipande.” Neno la Kiebrania linaonyesha vipande vidogo vilivyovunjika, huenda likileta picha ya vipande vya mkate.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “nani atasimama mbele ya baridi yake?”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁלִיךְ
  choice: Hutupa
  rationale: Kauli hii huhifadhi nguvu na uhai wa kitenzi cha Kiebrania kinachoonyesha kusababisha kitu kitupwe; wakati wa sasa unafaa mfululizo wa kishairi.
- source_word: קַרְחוֹ
  choice: barafu yake
  rationale: קֶרַח hapa inaeleweka vyema kama barafu, kitu halisi kinachotupwa kama vipande; pia huhifadhi kiambishi cha umilikaji.
- source_word: כְפִתִּים
  choice: kama vipande vidogo
  rationale: פִּתִּים ni vipande au matonge madogo, hasa vipande vya mkate. Tafsiri hii ni ya kawaida na haisisitizi bila lazima kwamba ni makombo madogo sana.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Hii ndiyo maana ya msingi ya kihusishi, lakini katika sentensi hii ya Kiswahili wazo hilo limewasilishwa kwa kitenzi 'kustahimili' ili usemi uwe wa kawaida.
- source_word: קָרָתוֹ
  choice: baridi yake
  rationale: קָרָה humaanisha baridi; 'baridi yake' ni fupi, ya kawaida, na huhifadhi umilikaji unaoonyesha mamlaka ya Mungu juu ya hali ya hewa.
- source_word: מִי יַעֲמֹד
  choice: nani awezaye kustahimili
  rationale: Kihalisi ni 'nani atasimama,' lakini katika swali hili la balagha maana ni kuweza kuvumilia au kustahimili nguvu ya baridi. Tanbihi huhifadhi taswira halisi ya kusimama.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. 'Vipande vidogo' ni asilia zaidi kuliko 'makombo' kwa kuwa barafu inayotupwa inaweza kueleweka kama chembe au vipande, huku tanbihi ikihifadhi uhusiano unaowezekana na vipande vya mkate.
