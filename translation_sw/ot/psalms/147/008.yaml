  text: הַֽ/מְכַסֶּ֬ה שָׁמַ֨יִם בְּ/עָבִ֗ים הַ/מֵּכִ֣ין לָ/אָ֣רֶץ מָטָ֑ר הַ/מַּצְמִ֖יחַ הָרִ֣ים חָצִֽיר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/008.yaml
  text: who covers the heavens with clouds[a], who prepares rain for the earth, who makes grass sprout on the mountains.
translation:
  language: sw
  text: Yeye anayezifunika mbingu kwa mawingu, anayeiandalia dunia mvua, na anayeotesha majani milimani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְכַסֶּה
  choice: anayezifunika
  rationale: Kitenzi hiki kinadumisha maana ya kufunika, huku umbo la wakati wa sasa lenye uhusiano likionyesha tendo la Mungu la kawaida na linaloendelea.
- source_word: שָׁמַיִם
  choice: mbingu
  rationale: “Mbingu” ni neno la kawaida la Kiswahili lenye hadhi ya kishairi na linafaa kwa wingi wa Kiebrania unaoweza kurejelea anga.
- source_word: עָבִים
  choice: mawingu
  rationale: Neno la Kiebrania humaanisha mawingu, wakati mwingine mawingu mazito; muktadha hauhitaji kuongeza sifa ya unene.
- source_word: מֵּכִין
  choice: anayeitayarishia
  rationale: Hiphil ya כון ina wazo la kutayarisha au kuweka tayari; “anayeitayarishia dunia mvua” huonyesha utoaji wa Mungu wenye kusudi bila kuongeza ufafanuzi.
- source_word: לָאָרֶץ
  choice: dunia
  rationale: Katika muktadha mpana wa mbingu, mawingu na mvua, “dunia” inafaa zaidi kuliko “nchi,” ambayo ingeweza kuashiria eneo maalumu.
- source_word: מָטָר
  choice: mvua
  rationale: Hili ndilo neno la kawaida na la asili la Kiswahili kwa מָטָר.
- source_word: מַּצְמִיחַ
  choice: anayeotesha
  rationale: '“Kuotesha” huhifadhi nguvu ya kisababishi ya Hiphil: Mungu husababisha majani yachipue au yakue.'
- source_word: הָרִים
  choice: milimani
  rationale: “Milimani” huwasilisha kwa kawaida mahali panapoonyeshwa na muundo wa Kiebrania, bila kupunguza milima kuwa vilima.
- source_word: חָצִיר
  choice: majani
  rationale: Katika Kiswahili cha Afrika Mashariki, “majani” ni namna ya kawaida na wazi ya kutaja uoto wa nyasi katika picha hii.
theological_decisions:
- issue: Utendaji wa Mungu unaoelezwa kwa mfululizo wa vihusishi-tendo
  choice: Kudumisha mfululizo “anayezifunika ... anayeitayarishia ... anayeotesha.”
  alternative: 'Kutumia vitenzi vikuu: “Huzifunika ... huitayarishia ... huotesha.”'
  rationale: Kiebrania kina mfululizo wa participles unaounganisha mstari huu na muktadha uliotangulia na kuonyesha matendo ya Mungu yaliyo tabia yake ya kudumu. Muundo wa “anaye-” unahifadhi uhusiano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Yeye” mwanzoni husaidia mstari kusomeka peke yake, huku mfululizo wa “anaye-” ukihifadhi muundo wa Kiebrania.
