  text: שָׁפְטֵ֤/נִי אֱלֹהִ֨ים וְ/רִ֘יבָ֤/ה רִיבִ֗/י מִ/גּ֥וֹי לֹא חָסִ֑יד מֵ֤/אִישׁ מִרְמָ֖ה וְ/עַוְלָ֣ה תְפַלְּטֵֽ/נִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/001.yaml
  text: Vindicate me[a], O God, and plead my cause against an unfaithful nation; deliver me from the deceitful and unjust man.
translation:
  language: sw
  text: Nipe haki[a], Ee Mungu, na ulitetee shauri langu dhidi ya taifa lisilo mwaminifu; uniokoe kutoka kwa mtu mdanganyifu na dhalimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno moja, “unihukumu.” Katika muktadha huu ni ombi la Mungu atoe hukumu inayompatia mwombaji haki; au, “unitetee.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁפְטֵנִי
  choice: unihukumu kwa haki
  rationale: Kauli ya amri katika ombi hili inamwomba Mungu atoe hukumu inayompatia mwombaji haki. Nyongeza ya “kwa haki” hufanya maana hiyo ya kimahakama ieleweke kwa Kiswahili bila kudokeza kwamba mwombaji anaomba tu achunguzwe.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Hii ni namna ya kawaida, yenye heshima, ya kuonyesha mwito wa moja kwa moja katika sala.
- source_word: וְרִיבָה רִיבִי
  choice: na unitetee katika shauri langu
  rationale: Kitenzi ריב pamoja na nomino yenye mzizi huohuo ni msemo wa kimahakama wa kuchukua na kutetea shauri la mtu.
- source_word: מִגּוֹי לֹא חָסִיד
  choice: dhidi ya taifa lisilo mwaminifu
  rationale: Katika muktadha wa shauri, מן hutambulisha upande pinzani. לֹא חָסִיד hueleza ukosefu wa uaminifu au kujitoa kwa dhati, hivyo “lisilo mwaminifu” huhifadhi maana ya kimaadili na ya kimahusiano.
- source_word: מֵאִישׁ מִרְמָה וְעַוְלָה
  choice: kutoka kwa mtu mdanganyifu na dhalimu
  rationale: Nomino dhahania zinazomfuata אִישׁ zinamtambulisha mtu mwenye sifa za udanganyifu na uovu au dhuluma. “Dhalimu” ni ya asili katika Kiswahili na inafaa katika muktadha wa haki.
- source_word: תְפַלְּטֵנִי
  choice: uniokoe
  rationale: Piel ya פלט ina maana ya kumtoa mtu hatarini na kumfikisha salama; “uniokoe” ni ombi la kawaida na lenye uzito katika Kiswahili.
theological_decisions:
- issue: Maana ya חָסִיד katika usemi uliokanushwa
  choice: lisilo mwaminifu
  alternative: taifa lisilomcha Mungu; taifa lisilo na uaminifu wa agano
  rationale: חָסִיד inahusiana na חסד na inaweza kuonyesha uaminifu, kujitoa, au uaminifu wa agano. “Lisilo mwaminifu” huhifadhi upana huo wa kimahusiano bila kuingiza kwa lazima neno “agano,” ambalo halitajwi wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Taswira ya shauri la mahakamani imehifadhiwa kwa maneno “unihukumu kwa haki” na “unitetee katika shauri langu.”
