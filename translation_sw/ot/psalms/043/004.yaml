  edition: WLC
  text: וְ/אָב֤וֹאָה אֶל מִזְבַּ֬ח אֱלֹהִ֗ים אֶל אֵל֮ שִׂמְחַ֪ת גִּ֫ילִ֥/י וְ/אוֹדְ/ךָ֥ בְ/כִנּ֗וֹר אֱלֹהִ֥ים אֱלֹהָֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/004.yaml
  text: Then I will go to the altar of God[a], to God, the joy of my rejoicing; and I will praise you with the lyre, O God[b], my God.
translation:
  language: sw
  text: Ndipo nitaenda kwenye madhabahu ya Mungu, kwa Mungu, furaha ya shangwe yangu[a]; nami nitakusifu kwa kinubi[b], Ee Mungu, Mungu wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kimapokeo zaidi, “furaha yangu kuu.” Kiebrania kinasema kihalisi “furaha ya shangwe yangu,” kikitumia maneno mawili ya furaha kwa ajili ya kusisitiza.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinnor humaanisha ala ya kale ya nyuzi, ambayo huenda ilifanana zaidi na lira kuliko kinubi cha kisasa.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָבוֹאָה
  choice: Ndipo nitaenda
  rationale: Kitenzi cha nafsi ya kwanza kina maana ya azimio au matokeo yanayotarajiwa baada ya maombi yaliyotangulia. “Ndipo nitaenda” linaonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: אֶל מִזְבַּח אֱלֹהִים
  choice: kwenye madhabahu ya Mungu
  rationale: Huhifadhi wazi uhusiano wa maneno ya Kiebrania na kutoa Kiswahili cha asili kinachoeleweka.
- source_word: אֶל אֵל
  choice: kwa Mungu
  rationale: Hapa אֵל ni cheo cha Mungu kinacholingana na אֱלֹהִים. “Kwa Mungu” huhifadhi mwendo unaoelekezwa kwake bila kuanzisha tofauti ya kimafundisho isiyodaiwa na muktadha.
- source_word: שִׂמְחַת גִּילִי
  choice: furaha ya shangwe yangu
  rationale: Kiebrania kinatumia maneno mawili yanayokaribiana kuhusu furaha ili kusisitiza. Usemi huu unahifadhi uradidi huo wa kishairi badala ya kuufupisha kuwa “furaha yangu kuu.”
- source_word: וְאוֹדְךָ
  choice: nami nitakusifu
  rationale: Katika muktadha wa ibada yenye ala ya muziki, kitenzi ידה kinaeleweka vizuri kama kusifu hadharani, ingawa pia kinaweza kumaanisha kushukuru.
- source_word: בְּכִנּוֹר
  choice: kwa kinubi
  rationale: כִּנּוֹר ni ala ya kale ya nyuzi, huenda iliyofanana zaidi na lira. “Kinubi” ni neno la Kiswahili linalofahamika kwa ala ya nyuzi, huku tanbihi ikieleza kutokuwa na ulinganifu kamili wa ala za kisasa.
- source_word: אֱלֹהִים אֱלֹהָי
  choice: Ee Mungu, Mungu wangu
  rationale: “Ee” huonyesha wazi mwito wa moja kwa moja, na urudiaji huhifadhi msisitizo pamoja na uhusiano binafsi wa mtunga zaburi na Mungu.
theological_decisions:
- issue: Utoaji wa majina ya Mungu אֱלֹהִים na אֵל yanayorudiwa
  choice: Yote yametafsiriwa “Mungu,” huku urudiaji ukihifadhiwa.
  alternative: Kutafsiri אֵל kuwa “Mungu Mwenye Nguvu” au kulinakili kama “El.”
  rationale: Mstari unatumia majina hayo kwa usambamba wa kishairi, si kwa kuweka tofauti ya kimafundisho kati yake. “Mungu” humtambulisha mhusika kwa uwazi bila kuongeza maana isiyothibitishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wa kishairi lakini unaoeleweka kwa wasomaji wa kawaida. Urudiaji wa lugha ya furaha na wa jina “Mungu” umehifadhiwa kwa sababu ni sehemu ya msisitizo wa maandishi ya Kiebrania.
