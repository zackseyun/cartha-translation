base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/005.yaml
  text: Why are you cast down[a], O my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him[b], the salvation of my countenance and my God.
translation:
  language: sw
  text: Kwa nini unainama[a], ee nafsi yangu, na kwa nini unafadhaika ndani yangu? Mtumaini Mungu, kwa maana bado nitamsifu, yeye aliye wokovu wa uso wangu[b] na Mungu wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umehuzunika” au “umevunjika moyo.” Kiebrania kina picha ya kuinama au kushushwa chini.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni kihalisi “wokovu” (katika umbo la wingi) “wa uso wangu na Mungu wangu.” Huenda usemi huu unamweleza Mungu kuwa yule anayemwokoa mtunga-zaburi na kuuinua tena uso wake ulioinama.
    reason: source_ambiguity
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: umeinama
  rationale: Kitenzi kinaonyesha kuinama au kushushwa chini. “Umeinama” huhifadhi picha halisi ya nafsi iliyoinama, huku muktadha ukionyesha huzuni au kuvunjika moyo.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: Katika zaburi neno hili mara nyingi humaanisha utu wa ndani. “Nafsi yangu” linafaa kwa mtu anayejisemea na huhifadhi mtindo wa kishairi.
- source_word: תֶּהֱמִי
  choice: unafadhaika
  rationale: Kitenzi hiki huonyesha msukosuko, mvurugo, au hali ya kutotulia. “Unafadhaika” ni Kiswahili cha sasa kinachoeleza msukosuko wa ndani bila kuongeza sababu yake.
- source_word: עָלָי
  choice: ndani yangu
  rationale: Ingawa kihalisi ni “juu yangu,” katika kujisemea huku usemi huo unaelekea kueleza fadhaa inayotokea ndani ya mtunga-zaburi. “Ndani yangu” ni usemi wa kawaida wa Kiswahili.
- source_word: הוֹחִילִי
  choice: Mtumaini
  rationale: Amri hii inaita nafsi imngojee Mungu kwa matarajio yenye tumaini. “Mtumaini Mungu” ni fupi, ya kawaida, na huhifadhi nguvu ya amri.
- source_word: עוֹד
  choice: bado
  rationale: Neno hili linaelekeza kwenye sifa itakayokuja licha ya dhiki ya sasa. “Bado” huhifadhi mvutano kati ya hali ya sasa na tumaini la baadaye.
- source_word: אוֹדֶנּוּ
  choice: nitamsifu
  rationale: Kitenzi ידה katika muktadha wa ibada humaanisha kusifu au kutoa shukrani. “Nitamsifu” linafaa kwa muktadha wa zaburi.
- source_word: יְשׁוּעוֹת
  choice: wokovu
  rationale: Nomino ya Kiebrania iko katika wingi, lakini inaweza kuwa wingi wa mkazo au wa dhana. Umoja “wokovu” ni wa kawaida zaidi katika Kiswahili huku ukimwonyesha Mungu kuwa chanzo cha kuokolewa.
- source_word: פָּנַי
  choice: uso wangu
  rationale: Hii ndiyo maana halisi ya neno la Kiebrania. “Uso wangu” huhifadhi picha thabiti na haifichi ugumu wa usemi wa chanzo.
- source_word: וֵאלֹהָי
  choice: na Mungu wangu
  rationale: Tafsiri hii huhifadhi kiunganishi na tamati ya Kiebrania bila kuigeuza kimafundisho kuwa kauli nyingine.
theological_decisions:
- issue: Maana ya יְשׁוּעוֹת פָּנַי
  choice: wokovu wa uso wangu
  alternative: anayeniokoa na kuinua uso wangu
  rationale: Maandishi ya Kiebrania yanasema kihalisi “wokovu/wokovu mbalimbali wa uso wangu.” Tafsiri kuu huhifadhi picha na mvutano wa usemi huo badala ya kuamua kimya-kimya kwamba unamaanisha hasa kuinuliwa kwa uso au kuondolewa kwa huzuni. Maelezo ya chini yanafafanua uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kujisemea umehifadhiwa. Kistari kirefu kinasaidia kuonyesha kwamba maneno ya mwisho yanamfafanua yule atakayesifiwa.
