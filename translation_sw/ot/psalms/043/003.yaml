base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/003.yaml
  text: Send out your light and your truth[a]; let them lead me[b]; let them bring me to your holy mountain and to your dwelling places.
translation:
  language: sw
  text: Tuma nuru yako na kweli yako[a]; zenyewe ziniongoze, zinifikishe kwenye mlima wako mtakatifu na kwenye maskani zako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uaminifu wako.” Neno la Kiebrania linaweza kumaanisha kweli, kutegemeka, au uaminifu.
    reason: lexical_alternative
  - marker: b
    text: “Maskani zako” hutafsiri umbo la wingi katika Kiebrania; kimapokeo, “hema zako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח
  choice: Tuma
  rationale: Kauli ya amri ya nafsi ya pili umoja. “Tuma” ni ya kawaida na yenye hadhi katika Kiswahili, na inaonyesha ombi la Mungu alete nuru na kweli yake zitende kazi.
- source_word: אוֹרְךָ
  choice: nuru yako
  rationale: אוֹר ni “nuru.” Neno halisi limehifadhiwa ili taswira ya kishairi na vidokezo vyake vya mwongozo au wokovu visifafanuliwe kupita kiasi.
- source_word: אֲמִתְּךָ
  choice: kweli yako
  rationale: אֱמֶת inaweza kumaanisha kweli, kutegemeka, au uaminifu. “Kweli yako” ni tafsiri ya moja kwa moja inayohifadhi upana wa maana; uwezekano wa “uaminifu wako” umeonyeshwa katika tanbihi.
- source_word: הֵמָּה
  choice: zenyewe
  rationale: Kiwakilishi huru cha Kiebrania kina msisitizo. “Zenyewe” huhifadhi msisitizo huo na kupatana na majina yasiyo ya viumbe “nuru” na “kweli,” yanayotazamwa kwa pamoja.
- source_word: יַנְחוּנִי
  choice: z uniongoze
  rationale: 'Hifili isiyotimilifu yenye nguvu ya ombi baada ya amri: “na z uniongoze.” Muundo huu huhifadhi uhusishaji wa kishairi wa nuru na kweli kama waongozao.'
- source_word: יְבִיאוּנִי
  choice: zinifikishe
  rationale: Hifili isiyotimilifu yenye nguvu ya ombi. “Zinifikishe” ni Kiswahili cha asili kinachoonyesha kuletwa hadi mahali palipokusudiwa.
- source_word: הַר קָדְשְׁךָ
  choice: mlima wako mtakatifu
  rationale: Tafsiri ya kawaida ya muundo “mlima wa utakatifu wako.” Haiongezi jina Sayuni, ambalo halipo wazi katika mstari.
- source_word: מִשְׁכְּנוֹתֶיךָ
  choice: maskani zako
  rationale: “Maskani” ni neno la sasa, lenye hadhi, kwa mahali pa kukaa. Wingi “zako” huhifadhi umbo la wingi la Kiebrania bila kulibadili kuwa “hekalu” au “patakatifu.”
theological_decisions:
- issue: Je, nuru na kweli zifafanuliwe kama sifa zisizo na utendaji au zihifadhiwe kama watendaji walioumbwa kishairi?
  choice: Kuhifadhi uhusishaji wa kishairi kwa kutumia “zenyewe z uniongoze, zinifikishe.”
  alternative: Kufafanua maana kuwa “niongoze kwa nuru na kweli yako.”
  rationale: Kiebrania kina kiwakilishi na vitenzi vya wingi vinavyorejelea nuru na kweli. Kuhifadhi hilo kunatunza ushairi na hakupunguzi taswira kuwa maelezo ya kifafanuzi.
- issue: Je, mlima na maskani zitambulishwe wazi kuwa Sayuni na hekalu?
  choice: “mlima wako mtakatifu” na “maskani zako”
  alternative: “Sayuni na hekalu lako”
  rationale: Ingawa huenda marejeo ni Sayuni na patakatifu pake, Kiebrania kinatumia taswira pana. Tafsiri haipaswi kuongeza utambulisho maalumu katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Taswira halisi za “nuru,” “mlima,” na “maskani” zimehifadhiwa. Vitenzi vya wingi vinaendeleza uhusishaji wa kishairi uliopo katika Kiebrania.
