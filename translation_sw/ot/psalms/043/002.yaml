  text: כִּֽי אַתָּ֤ה אֱלֹהֵ֣י מָֽעוּזִּ/י֮ לָ/מָ֪ה זְנַ֫חְתָּ֥/נִי לָֽ/מָּה קֹדֵ֥ר אֶתְהַלֵּ֗ךְ בְּ/לַ֣חַץ אוֹיֵֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/002.yaml
  text: For you are the God of my refuge[b][a]; why have you rejected me? Why do I go about mourning under the oppression of the enemy?
translation:
  language: sw
  text: Kwa maana wewe ndiwe Mungu uliye kimbilio langu[a]; kwa nini umenikataa? Kwa nini natembea kwa huzuni[b] chini ya ukandamizaji wa adui?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mungu uliye ngome yangu” au “Mungu wa nguvu zangu.” Neno la Kiebrania linaweza kumaanisha kimbilio, ngome, au nguvu kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au “ninaenda huku na huku nikiwa katika giza.” Kiebrania kinazungumzia kihalisi kwenda huku na huku mtu akiwa “ametiwa giza,” ambayo ni nahau ya huzuni au maombolezo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu inayotegemeza ombi la mtunga zaburi na kudumisha mtiririko wa hoja.
- source_word: אֱלֹהֵי מָעוּזִּי
  choice: Mungu uliye kimbilio langu
  rationale: מָעוֹז inaweza kumaanisha kimbilio, ngome, au nguvu. Muundo huu wa Kiswahili ni wa kawaida na unadumisha picha ya Mungu kuwa mahali au chanzo cha usalama.
- source_word: לָמָה
  choice: kwa nini
  rationale: Neno la swali limerudiwa mara mbili ili kuhifadhi nguvu ya kishairi ya maombolezo.
- source_word: זְנַחְתָּנִי
  choice: umenikataa
  rationale: זנח hueleza kukataa au kutupilia mbali. 'Umenikataa' ni wazi na haliongezi wazo la kuachwa kabisa lisilolazimishwa na neno lenyewe.
- source_word: קֹדֵר
  choice: nikiomboleza
  rationale: Kihalisi neno hili hueleza hali ya kutiwa giza, lakini katika muktadha huu ni nahau ya huzuni au maombolezo.
- source_word: אֶתְהַלֵּךְ
  choice: naenda huku na huku
  rationale: Muundo wa kitenzi unaonyesha mwendo au mwenendo unaoendelea; usemi huu ni wa kawaida katika Kiswahili na hauingizi wazo la kulazimika.
- source_word: בְּלַחַץ
  choice: kwa sababu ya uonevu
  rationale: לַחַץ humaanisha shinikizo au kuonewa. Hapa kihusishi kinaweza kueleza hali inayomsababishia mtunga zaburi maombolezo.
- source_word: אוֹיֵב
  choice: adui
  rationale: Umoja humtaja mpinzani anayejulikana au huwakilisha maadui kwa ujumla; 'adui' hudumisha hilo bila kulazimisha ufafanuzi.
theological_decisions:
- issue: Lugha ya kukataliwa na Mungu katika maombolezo
  choice: kwa nini umenikataa?
  alternative: kwa nini umeniacha? / kwa nini umenitupilia mbali?
  rationale: Kauli ya moja kwa moja ya mtunga zaburi imehifadhiwa bila kupunguzwa ukali wake wala kutatuliwa mvutano wa kitheolojia kuhusu umbali anaouhisi kutoka kwa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Urudiaji wa “kwa nini” na sauti ya moja kwa moja ya maombolezo vimehifadhiwa.
