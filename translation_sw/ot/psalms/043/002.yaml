review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the causal opening, direct address, repeated lament question, divine rejection language, and the idiom of mourning. However, “kwa sababu ya uonevu” shifts בְּלַחַץ from the circumstance of being under enemy pressure to a more explicitly causal relation. “Chini ya ukandamizaji wa adui” better represents the Hebrew preposition and noun.
  naturalness: The Swahili is clear and appropriately reverent. “Natembea kwa huzuni” is a natural, modern rendering of the Hebrew idiom and avoids the slightly over-specific sense of aimless wandering in “naenda huku na huku.”
  terminology: “Mungu uliye kimbilio langu” naturally communicates God as the psalmist’s refuge. “Ukandamizaji” appropriately conveys oppressive pressure; “adui” preserves the singular collective/representative enemy.
  issues:
  - severity: low
    issue: The phrase “kwa sababu ya uonevu wa adui” renders the enemy’s oppression chiefly as a cause.
    rationale: 'בְּלַחַץ is more directly the condition or setting in which the psalmist goes about mourning: under/in the oppression of the enemy. Revising to “chini ya ukandamizaji wa adui” preserves this nuance.'
  - severity: low
    issue: “Naenda huku na huku” can suggest purposeless roaming.
    rationale: אֶתְהַלֵּךְ denotes ongoing going/walking about, without necessarily implying wandering. “Natembea” retains the ongoing lament expression more neutrally.
