source:
  edition: WLC
  text: וַ/אֲנִ֤י עָנִ֣י וְ/אֶבְיוֹן֮ אֲדֹנָ֪/י יַחֲשָׁ֫ב לִ֥/י עֶזְרָתִ֣/י וּ/מְפַלְטִ֣/י אַ֑תָּה אֱ֝לֹהַ֗/י אַל תְּאַחַֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/017.yaml
  text: But I am poor and needy; the Lord thinks of me. You are my help and my deliverer; my God[a], do not delay.
translation:
  language: sw
  text: 'Lakini mimi ni maskini na mhitaji;

    Bwana ananifikiria[a].

    Wewe ndiwe msaada wangu na mwokozi wangu;

    Mungu wangu, usikawie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bwana ananijali,” au “Bwana atanifikiria.”
    reason: Tofauti hizi huhifadhi upana wa maana ya יַחֲשָׁב לִי, ambayo inaweza kueleza kumfikiria mtu, kumjali, au tendo linalotazamiwa.
lexical_decisions:
- source_word: וַאֲנִי
  choice: Lakini mimi
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha utofautishaji na muktadha uliotangulia; “Lakini mimi” ni Kiswahili cha kawaida kinachohifadhi mkazo huo.
- source_word: עָנִי וְאֶבְיוֹן
  choice: maskini na mhitaji
  rationale: Huhifadhi jozi ya maneno yanayokaribiana bila kuyafanya kuwa neno lilelile; yanaeleza hali ya udhaifu, uhitaji na dhiki.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Hili ni jina la cheo la Mungu, Adonai, wala si jina YHWH; “Bwana” ndilo neno la kawaida na lenye heshima katika Kiswahili.
- source_word: יַחֲשָׁב לִי
  choice: ananifikiria
  rationale: Kitenzi חשב pamoja na ל kinaweza kumaanisha kumfikiria au kumjali mtu. “Ananifikiria” huhifadhi maana ya msingi na kutatua kidogo iwezekanavyo utata wa wakati na namna ya kujali.
- source_word: עֶזְרָתִי
  choice: msaada wangu
  rationale: Nomino hiyo humaanisha msaada; tafsiri hii ni fupi, ya kawaida, na inadumisha usambamba wa kishairi.
- source_word: וּמְפַלְטִי
  choice: na mwokozi wangu
  rationale: Umbo hili humaanisha mtu anayemwokoa au kumpeleka mwingine salama. “Mwokozi wangu” ni la kawaida na huhifadhi nguvu ya tendo la kuokoa.
- source_word: אַתָּה
  choice: Wewe ndiwe
  rationale: Kiwakilishi kimetajwa wazi kwa ajili ya mkazo; “Wewe ndiwe” huonyesha mkazo huo kwa Kiswahili cha asili.
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Kiambishi cha Kiebrania kinaonyesha uhusiano wa nafsi ya kwanza, na muktadha unaonyesha wazi kuwa ni usemi wa moja kwa moja kwa Mungu.
- source_word: אַל תְּאַחַר
  choice: usikawie
  rationale: Katazo hili linaomba hatua ya haraka. “Usikawie” ni fupi, wazi, na hudumisha hisia ya uharaka.
theological_decisions:
- issue: Tafsiri ya jina la cheo אֲדֹנָי
  choice: Bwana
  alternative: Bwana wangu
  rationale: Chanzo kina Adonai, jina la cheo “Bwana,” si YHWH. Hakuna kiambishi cha umilikaji katika neno hili, hivyo “Bwana” ndilo chaguo la karibu zaidi.
- issue: Maana na wakati wa יַחֲשָׁב לִי
  choice: Bwana ananifikiria
  alternative: Bwana ananijali / Bwana atanifikiria
  rationale: Umbo la Kiebrania linaweza kueleza fikira au kujali, na wakati wake unaweza kueleweka kwa namna zaidi ya moja. Matini kuu huhifadhi taswira ya kufikiri, huku tanbihi ikihifadhi maana ya kujali na uwezekano wa wakati ujao bila kuingiza dai pana zaidi kuhusu mpango wa Mungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Mistari mifupi inadumisha usambamba wa zaburi; msamiati si wa kizamani wala wa dhehebu fulani.
