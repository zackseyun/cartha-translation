base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/016.yaml
  text: Let all who seek you rejoice and be glad in you[a]; let those who love your salvation say continually[b], “May Yahweh be magnified!”
translation:
  language: sw
  text: Wote wanaokutafuta na washangilie na wafurahi ndani yako; na wanaoupenda wokovu wako[a] na waseme daima, “Yahweh atukuzwe!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukombozi wako.” Neno la Kiebrania תְּשׁוּעָה linaweza kumaanisha “wokovu” au “ukombozi.”
    reason: lexical_alternative
  - marker: b
    text: 'Kwa Kiebrania, “Yahweh na awe mkuu” au “Yahweh akuzwe”: ni mwito wa sifa unaotamani ukuu wa Yahweh utambuliwe wazi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂישׂוּ וְיִשְׂמְחוּ
  choice: na washangilie na kufurahi
  rationale: Vitenzi viwili vinaonyesha ombi au tamanio na vinadumisha usambamba wa kishairi kwa maneno mawili yanayokaribiana lakini yasiyofanana kabisa.
- source_word: בְּךָ
  choice: ndani yako
  rationale: Kihusishi ב hapa kinaonyesha kitovu au msingi wa shangwe; ‘ndani yako’ kinahifadhi mwelekeo kwa Mungu na ni usemi unaoeleweka katika lugha ya ibada.
- source_word: כָּל מְבַקְשֶׁיךָ
  choice: wote wanaokutafuta
  rationale: Muundo wa kitenzi-jina unaeleza watu wenye sifa ya kumtafuta Mungu; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: יֹאמְרוּ תָמִיד
  choice: na waseme daima
  rationale: Huhifadhi hali ya ombi pamoja na wazo la usemi unaorudiwa au kuendelea.
- source_word: יִגְדַּל יְהוָה
  choice: Yahweh na atukuzwe!
  rationale: Kitenzi kina nguvu ya tamanio au mwito wa sifa, si taarifa tu kwamba Yahweh ni mkuu. ‘Na atukuzwe’ linaonyesha tamaa ya ukuu wake kutambuliwa wazi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: אֹהֲבֵי תְּשׁוּעָתֶךָ
  choice: wote wanaoupenda wokovu wako
  rationale: תְּשׁוּעָה linaweza kumaanisha wokovu au ukombozi; ‘wokovu’ huhifadhi upana wa maana katika muktadha huu wa sala na ibada.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; ‘Yahweh’ hulihifadhi badala ya kuweka cheo mahali pake.
- issue: Maana ya תְּשׁוּעָה katika sala ya zaburi
  choice: wokovu
  alternative: ukombozi
  rationale: Neno la Kiebrania linaweza kueleza kuokolewa kwa upana au kukombolewa katika hali fulani. ‘Wokovu’ linahifadhi upana huo bila kufunga maana kwa tukio moja.
- issue: Nguvu ya יִגְדַּל
  choice: 'tamanio/mwito: “na atukuzwe”'
  alternative: 'taarifa: “Yahweh ni mkuu”'
  rationale: Katika mfululizo wa maombi ya mstari huu, umbo hilo linaeleweka vizuri kama tamanio la kwamba ukuu wa Yahweh utambuliwe wazi.
