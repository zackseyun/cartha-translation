lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza muziki
  rationale: Neno hili katika vichwa vya Zaburi humaanisha mtu anayesimamia uimbaji au utendaji wa muziki. “Mwongoza muziki” ni lugha ya sasa na halibani maana kuwa kiongozi wa kwaya pekee; kiambishi לַ־ kimetafsiriwa “Kwa.”
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Kiambishi לְ־ hapa kinaweza kuonyesha utunzi, uhusiano, wakfu, au mkusanyo. “Ya Daudi” huhifadhi upana huo vizuri kuliko “Iliyoandikwa na Daudi.”
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ni jina la kawaida la utanzu wa wimbo wa ibada wenye uhusiano na muziki; “Zaburi” ni istilahi iliyo wazi, yenye heshima, na iliyozoeleka katika Kiswahili.
theological_decisions:
- issue: Maana ya kichwa kinachohusisha zaburi na Daudi
  choice: Ya Daudi
  alternative: Iliyoandikwa na Daudi; Kwa ajili ya Daudi
  rationale: Kiebrania hakilazimishi uamuzi kwamba Daudi ndiye mtunzi moja kwa moja. “Ya Daudi” huhifadhi uwezekano wa utunzi, uhusiano, wakfu, au kuwa katika mkusanyo unaohusishwa naye bila kuongeza dai la kihistoria lisilobainishwa na maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mwongoza muziki” limetumiwa badala ya neno linaloweza kuifanya kazi hii ihusu kwaya pekee. Mpangilio mfupi wa vipashio umehifadhi mtindo wa kichwa cha Zaburi.
