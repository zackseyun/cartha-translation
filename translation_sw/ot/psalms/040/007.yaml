lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Huonyesha mfuatano wa wakati na kuitambulisha itikio la msemaji kwa muktadha uliotangulia.
- source_word: אָמַרְתִּי
  choice: niliposema
  rationale: Ni tafsiri ya kawaida ya kitenzi cha nafsi ya kwanza, ikiunganika kwa ufasaha na ‘Ndipo’ na maneno yanayonukuliwa.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Hudumisha msisitizo wa chembe ya Kiebrania inayovuta fikira kwa jambo linalofuata, kwa lugha yenye hadhi na inayoeleweka.
- source_word: בָאתִי
  choice: nimekuja
  rationale: Kauli timilifu hapa inaonyesha kuwasili na kujitokeza kwa msemaji; wakati timilifu wa Kiswahili unafaa katika usemi wa moja kwa moja.
- source_word: בִּמְגִלַּת סֵפֶר
  choice: katika gombo la kitabu
  rationale: Inahifadhi taswira halisi ya hati iliyokunjwa bila kuirahisisha kuwa ‘kitabu’ pekee.
- source_word: כָּתוּב
  choice: imeandikwa
  rationale: Huwasilisha hali ya kutendwa ya participio ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: עָלַי
  choice: kunihusu
  rationale: Katika muktadha wa jambo lililoandikwa, maana ya moja kwa moja ni ‘kuhusu mimi’; uwezekano wa maana ‘kwa ajili yangu’ au ‘nilichoagizwa’ umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya עָלַי katika mstari ambao baadaye unanukuliwa katika Waebrania 10
  choice: kunihusu
  alternative: kwa ajili yangu; nilichoagizwa
  rationale: ‘Kunihusu’ inafaa zaidi kwa maana ya moja kwa moja katika zaburi, bila kuingiza kimya kimya matumizi ya baadaye kuhusu Masihi. Uwezekano mwingine wa Kiebrania umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi na chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Gombo la kitabu’ limechaguliwa ili kuhifadhi taswira ya hati ya kale, na ‘Tazama’ ili kudumisha msisitizo wa הִנֵּה.
