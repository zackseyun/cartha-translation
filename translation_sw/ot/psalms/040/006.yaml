base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/006.yaml
  text: Sacrifice and offering you did not desire[a]; ears you have opened for me[b]; burnt offering and sin offering you did not ask for.
translation:
  language: sw
  text: Dhabihu na sadaka[a] hukuzitaka; masikio umenichimbia[b]; sadaka ya kuteketezwa na sadaka ya dhambi hukuomba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, hasa zaidi, “sadaka ya nafaka.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “masikio umenichimbia,” huenda ni nahau yenye maana ya kumwezesha mtu kusikia au kutii; linganisha “umenifungua masikio.” Septuajinti, ambayo Waebrania 10:5 huifuata, inasema, “mwili uliniandalia.”'
    reason: alternative_reading
lexical_decisions:
- source_word: זֶבַח
  choice: dhabihu
  rationale: Neno la kawaida na lenye heshima kwa dhabihu inayotolewa katika ibada.
- source_word: מִנְחָה
  choice: sadaka
  rationale: Huhifadhi maana pana katika ulinganifu wa kishairi na זֶבַח; maana maalumu ya sadaka ya nafaka imewekwa katika tanbihi.
- source_word: חָפַצְתָּ
  choice: hukuzitamani
  rationale: Huonyesha kutaka au kupendezwa na kitu, huku likidumisha ulinganifu na kauli ya mwisho.
- source_word: אָזְנַיִם
  choice: masikio
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya Kiebrania iliyo katika umbo la jozi.
- source_word: כָּרִיתָ לִּי
  choice: umenichimbia
  rationale: Huhifadhi taswira halisi ya kitenzi כרה, ‘kuchimba,’ bila kufuta maana yake ya kimafumbo; ufafanuzi wa nahau umetolewa katika tanbihi.
- source_word: עוֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Ni istilahi iliyo wazi kwa dhabihu iliyoteketezwa yote.
- source_word: חֲטָאָה
  choice: sadaka ya dhambi
  rationale: Katika muktadha huu wa ibada, neno linamaanisha sadaka inayohusiana na dhambi, si dhambi kwa ujumla.
- source_word: שָׁאָלְתָּ
  choice: hukuziomba
  rationale: Hufuata maana ya msingi ya ‘kuomba/kutaka kitu kitolewe’ bila kuimarisha maana kuwa ‘kudai’ au ‘kuhitaji.’
theological_decisions:
- issue: Uhusiano kati ya maneno ya Kiebrania ‘masikio umenichimbia’ na nukuu ya Agano Jipya katika Waebrania 10:5, ‘mwili uliniandalia’
  choice: 'Maneno ya Kiebrania yamedumishwa katika matini kuu: ‘masikio umenichimbia.’'
  alternative: ‘Umenifungua masikio’ au, kwa kufuata Septuajinti na Waebrania 10:5, ‘mwili uliniandalia.’
  rationale: Zaburi inatafsiriwa kwanza kutoka matini ya Kiebrania. Tanbihi inadumisha uwazi kuhusu maana inayowezekana ya nahau na mapokeo ya Kigiriki bila kuyapatanisha kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na ulinganifu wa mistari umehifadhiwa. Kauli isiyo ya kawaida ‘masikio umenichimbia’ imetumiwa kwa makusudi ili kudumisha taswira ya Kiebrania, huku tanbihi ikieleza maana ya kinahau.
