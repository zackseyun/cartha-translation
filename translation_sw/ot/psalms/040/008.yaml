base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/008.yaml
  text: I delight to do your will[a], my God, and your law is within my inner being.
translation:
  language: sw
  text: Ee Mungu wangu, ninafurahia kufanya mapenzi yako; na sheria yako[a] imo katika undani wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mafundisho yako.” Neno la Kiebrania torah linaweza kumaanisha mafundisho ya Mungu kwa upana, wala si amri za kisheria pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: kufanya
  rationale: 'Kitenzi-jina hiki pamoja na kiambishi ל kinaeleza jambo linalofurahiwa: kufanya mapenzi ya Mungu. ‘Kufanya’ ni tafsiri ya moja kwa moja na ya kawaida.'
- source_word: רְצוֹנְךָ
  choice: mapenzi yako
  rationale: רָצוֹן huweza kumaanisha nia, ridhaa, au jambo linalopendeza. Katika muungano na ‘kufanya,’ ‘mapenzi yako’ ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya nia ya Mungu.
- source_word: אֱלֹהַי
  choice: Ee Mungu wangu
  rationale: Kiambishi cha nafsi ya kwanza umoja kinatoa ‘Mungu wangu’; ‘Ee’ huonyesha kwa kawaida kwamba ni mwito wa moja kwa moja kwa Mungu.
- source_word: חָפָצְתִּי
  choice: ninafurahia
  rationale: חפץ huonyesha kupendezwa, kutamani, au kufurahia. ‘Ninafurahia’ linaonyesha kwa lugha ya sasa furaha na utayari wa ndani, si tamaa tu.
- source_word: וְתוֹרָתְךָ
  choice: na sheria yako
  rationale: תּוֹרָה huweza kumaanisha sheria au mafundisho. ‘Sheria yako’ inadumisha uzito wa agano na Maandiko, huku tanbihi ikihifadhi maana pana zaidi ya mafundisho.
- source_word: בְּתוֹךְ
  choice: imo ndani kabisa
  rationale: Kirai hiki huonyesha kuwamo katikati au ndani. ‘Ndani kabisa’ kinaonyesha kwamba sheria hiyo imewekwa ndani, si kwamba iko karibu tu.
- source_word: מֵעָי
  choice: yangu
  rationale: מֵעֶה humaanisha kihalisi viungo vya ndani na kwa njia ya sitiari utu wa ndani kabisa. Pamoja na ‘ndani kabisa yangu,’ tafsiri inaepuka taswira ya mwili inayoweza kupotosha huku ikihifadhi wazo la nafsi ya ndani.
theological_decisions:
- issue: Tafsiri ya תּוֹרָה katika muktadha wa ibada
  choice: sheria
  alternative: mafundisho
  rationale: ‘Sheria’ inadumisha mwangwi wa agano na Maandiko ulio katika neno תּוֹרָה. Hata hivyo, kwa kuwa neno hilo ni pana kuliko amri za kisheria pekee, ‘mafundisho’ yamehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Ninafurahia kufanya’ ni cha kawaida na kinaonyesha utayari wenye furaha; ‘imo ndani kabisa yangu’ huhifadhi taswira ya ukweli uliotiwa ndani bila kutumia ‘matumbo’ au ‘viungo vya ndani,’ ambayo yangesikika ya kimwili kupita kiasi.
