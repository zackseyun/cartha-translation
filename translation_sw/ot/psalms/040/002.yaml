review_pass:
  verdict: revise
  source_fidelity: “Mshindo” normally denotes a bang, crash, or report and is too narrow for שָׁאוֹן, which denotes loud noise, roaring, or tumult. “Makelele” preserves the noisy/tumultuous sense without importing the interpretive sense “destruction.” The rescue and stability imagery is otherwise retained well. “Matope ya kinamasi” better represents the paired Hebrew terms for mud/clay and mire than “matope ya utelezi,” which foregrounds slipperiness rather than the mire itself.
  naturalness: The revised wording is fluent Standard East African Swahili and maintains a clear, poetic parallelism. “Shimo la makelele” is comprehensible as a poetic genitive, while “matope ya kinamasi” is natural and vivid.
  terminology: “Shimo,” “mwamba,” “miguu,” and “hatua” are apt and consistent with the concrete Hebrew imagery. The footnote is revised to give viable lexical alternatives and to identify “ukiwa” and “uharibifu” as more interpretive renderings.
  issues:
  - severity: medium
    issue: “Shimo la mshindo” renders שָׁאוֹן too narrowly.
    rationale: Mshindo commonly refers to a sudden bang or crashing sound. The Hebrew has a broader sense of noise, roaring, or tumult; “makelele” better preserves that range in natural Swahili.
  - severity: low
    issue: “Matope ya utelezi” shifts the image from mire to its possible effect.
    rationale: The Hebrew pairing טִיט הַיָּוֵן evokes mud/clay and mire. “Matope ya kinamasi” more directly retains the muddy, bog-like imagery without unnecessary abstraction.
  revised_text: Alinipandisha kutoka shimo la makelele[a], kutoka matope ya kinamasi; akaweka miguu yangu juu ya mwamba, akazifanya hatua zangu kuwa imara.
