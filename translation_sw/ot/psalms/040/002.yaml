source:
  edition: WLC
  text: וַ/יַּעֲלֵ֤/נִי מִ/בּ֥וֹר שָׁאוֹן֮ מִ/טִּ֪יט הַ/יָּ֫וֵ֥ן וַ/יָּ֖קֶם עַל סֶ֥לַע רַגְלַ֗/י כּוֹנֵ֥ן אֲשֻׁרָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/002.yaml
  text: He brought me up out of the pit of tumult[a], out of the miry clay; he set my feet on a rock, making my steps secure.
translation:
  language: sw
  text: Alinipandisha kutoka shimo la makelele[a], kutoka matope ya kinamasi; akaweka miguu yangu juu ya mwamba, akazifanya hatua zangu kuwa imara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “shimo la mngurumo” au “shimo la ghasia”; tafsiri nyingi hufasiri usemi huu kwa upana zaidi kuwa “shimo la ukiwa” au “shimo la uharibifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלֵנִי
  choice: Alinipandisha
  rationale: Hifili ya עלה ina maana ya kusababisha mtu apande au kumtoa juu; “alinipandisha” inadumisha picha halisi ya kuokolewa kutoka shimoni.
- source_word: מִבּוֹר
  choice: kutoka shimo
  rationale: בּוֹר inaweza kuwa shimo, kisima, au mahali kama gereza; katika ushairi huu “shimo” ni pana, wazi, na ya kawaida.
- source_word: שָׁאוֹן
  choice: la mshindo
  rationale: Neno hili kimsingi hudokeza kelele kubwa, mngurumo, au ghasia. “Mshindo” inadumisha picha ya sauti bila kuitafsiri moja kwa moja kuwa uharibifu.
- source_word: מִטִּיט הַיָּוֵן
  choice: kutoka matope ya utelezi
  rationale: טִיט na יָוֵן kwa pamoja huchora picha ya matope mazito, yanayonata na yasiyo na uthabiti. Kiswahili hiki ni cha asili na huepuka kurudia “matope” mara mbili.
- source_word: וַיָּקֶם עַל־סֶלַע רַגְלָי
  choice: akaweka miguu yangu juu ya mwamba
  rationale: Hifili ya קום hapa ni kusimamisha au kuweka imara; usemi huu wa Kiswahili unahifadhi picha ya miguu kuhamishwa kutoka matopeni hadi juu ya mwamba.
- source_word: כּוֹנֵן אֲשֻׁרָי
  choice: akazifanya hatua zangu kuwa imara
  rationale: Poleli ya כון ina maana ya kufanya imara au kuthibitisha, na אֲשֻׁרָי ni hatua zangu. Tafsiri hii inadumisha matokeo ya uthabiti kwa lugha ya kawaida.
theological_decisions:
- issue: Iwapo picha halisi za kuokolewa zitafsiriwe kwa maneno ya jumla kuhusu wokovu wa kiroho au kimaadili
  choice: Kudumisha picha halisi za shimo, matope, miguu, mwamba, na hatua
  alternative: Aliniokoa kutoka uharibifu na kunipa usalama
  rationale: Kiebrania kinatumia picha thabiti za kishairi bila kutaja wazi aina ya ukombozi. Tafsiri haipaswi kuamua kimadhehebu au kitheolojia jambo ambalo picha yenyewe imelihifadhi kwa upana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Shimo la mshindo” linahifadhi ukali na utata wa שָׁאוֹן; tanbihi inaonyesha uwezekano mwingine wa kileksia. Muundo wa vifungu viwili sambamba unafuata mwendo wa mstari wa Kiebrania.
