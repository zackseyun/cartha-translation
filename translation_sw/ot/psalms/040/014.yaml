base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/014.yaml
  text: Let those who seek to sweep away my life be put to shame and humiliated together[c][b][a]; let those who delight in my harm turn back and be disgraced.
translation:
  language: sw
  text: Waaibike na wafedheheke pamoja wale wanaotafuta kuuangamiza uhai wangu[a][b]; warudi nyuma na waaibike wale wanaofurahia mabaya yanayonipata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuufutilia mbali” au “kuukomesha”; kitenzi cha Kiebrania kinaweza kumaanisha kuuondoa kabisa uhai wa mwombaji.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “nafsi yangu”; katika muktadha huu maana yake ni “uhai wangu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ וְיַחְפְּרוּ יַחַד
  choice: Waaibishwe na kufedheheshwa pamoja
  rationale: Kauli hizi mbili zinaonyesha kupata aibu na fedheha, huku יַחַד ikionyesha kuwa yawapate wote kwa pamoja; Kiswahili hiki kinahifadhi nguvu ya ombi la mshairi na usambamba wa kishairi.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: wale wanaotafuta ... uhai wangu
  rationale: נפש katika muktadha huu ni uhai wa mwombaji unaotafutwa na maadui, si nafsi kama sehemu isiyo ya kimwili.
- source_word: לִסְפּוֹתָהּ
  choice: kuuangamiza
  rationale: Kitenzi kinaweza kumaanisha kufutilia mbali, kuharibu, au kukomesha; hapa kiambishi cha kike kinarejelea נפש, yaani uhai, na nia ni kuuondoa kabisa.
- source_word: יִסֹּגוּ אָחוֹר וְיִכָּלְמוּ
  choice: warudi nyuma na kutiwa aibu
  rationale: סוג אחור huonyesha kurudi au kuondolewa nyuma, na כלם huonyesha kupata aibu au fedheha. Tafsiri inadumisha ombi la kishairi bila kuongeza namna walivyorudishwa.
- source_word: חֲפֵצֵי רָעָתִי
  choice: wale wanaofurahia mabaya yanayonipata
  rationale: חפץ hapa ni kufurahia au kupendezwa, na רעה ni madhara au mabaya yanayompata mwombaji, si uovu wake wa kimaadili.
