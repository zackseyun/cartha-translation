  text: בִּשַּׂ֤רְתִּי צֶ֨דֶק בְּ/קָ֘הָ֤ל רָ֗ב הִנֵּ֣ה שְׂ֭פָתַ/י לֹ֣א אֶכְלָ֑א יְ֝הוָ֗ה אַתָּ֥ה יָדָֽעְתָּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/009.yaml
  text: I have proclaimed righteousness in the great assembly[a]; behold, I have not restrained my lips; O Yahweh[b], you know.
translation:
  language: sw
  text: Nimetangaza haki katika kusanyiko kubwa[a]; tazama, sikuzuia midomo yangu[b]. Ee Yahwe, wewe unajua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza kumaanisha uadilifu wa kimaadili na pia haki katika maana ya hukumu ya haki.
    reason: lexical_alternative
  - marker: b
    text: Au, “sikufunga midomo yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשַּׂרְתִּי
  choice: Nimetangaza
  rationale: Kitenzi בּשׂר katika kauli ya piel humaanisha kutangaza habari, mara nyingi habari njema. “Nimetangaza” kinadumisha wazo la tangazo la hadharani bila kuongeza maana ambayo haijaelezwa wazi katika mstari.
- source_word: צֶדֶק
  choice: haki
  rationale: “Haki” ni neno la kawaida la Kiswahili linaloweza kubeba vipengele vya uadilifu wa kimaadili na haki ya kimahakama, hivyo linaakisi upana wa maana wa צֶדֶק.
- source_word: בְּקָהָל רָב
  choice: katika kusanyiko kubwa
  rationale: “Kusanyiko” linaonyesha kundi lililokusanyika kwa pamoja, na “kubwa” linahifadhi sifa ya רָב pamoja na mazingira ya tangazo la hadharani.
- source_word: הִנֵּה
  choice: tazama
  rationale: “Tazama” ni kiashiria cha msisitizo kinacholingana na הִנֵּה na kinadumisha hadhi ya kishairi.
- source_word: שְׂפָתַי
  choice: midomo yangu
  rationale: Tafsiri hii inadumisha taswira halisi ya viungo vya mwili inayotumiwa kwa usemi katika Kiebrania.
- source_word: לֹא אֶכְלָא
  choice: sikuizuia
  rationale: Kitenzi hapa kina maana ya kuzuia au kujizuia. Kauli hii inadumisha taswira ya kutouzuia usemi, huku tafsiri mbadala ya “sikuifunga” ikitolewa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: יָדָעְתָּ
  choice: wewe unajua
  rationale: Kauli hii inawasilisha kwa Kiswahili cha kawaida hali ya sasa inayotokana na kitenzi timilifu cha Kiebrania, na kiwakilishi “wewe” kinaweka msisitizo wa אַתָּה.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Ee Yahwe
  alternative: Ee BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja. “Yahwe” linahifadhi jina hilo, nalo “Ee” linaonyesha wazi usemi wa kumwita Mungu.
- issue: Upana wa maana wa צֶדֶק
  choice: haki
  alternative: uadilifu
  rationale: “Haki” linaweza kuhusisha yaliyo sawa kimaadili na kimahakama bila kuamua kimyakimya kwamba mstari unakusudia upande mmoja tu; tanbihi inaeleza upana huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wenye heshima lakini unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi unafuata mwendo wa Kiebrania bila kuwa mgumu isivyo lazima; “tazama” na “midomo yangu” zinahifadhi msisitizo na taswira ya asili.
