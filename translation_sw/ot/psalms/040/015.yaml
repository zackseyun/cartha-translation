  yaml_path: translation/ot/psalms/040/015.yaml
  text: Let those who say to me[a], “Aha[b], aha!” be appalled because of their shame.
translation:
  language: sw
  text: 'Waduwe[a] kwa sababu ya aibu yao[b],

    hao wanaoniambia, “Aha! Aha!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wawe ukiwa” au “washangazwe.” Kitenzi cha Kiebrania kinaweza kuonyesha kuduwaa kwa hofu au kufanywa ukiwa.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “juu ya kisigino cha aibu yao”; nahau hii hapa huonyesha sababu au matokeo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁמּוּ
  choice: Waaibike
  rationale: Kitenzi cha Kiebrania kinaweza kumaanisha kufanywa ukiwa au kupigwa na bumbuwazi; katika muktadha huu wa hukumu, “waaibike” huonyesha hali ya kushindwa na kuaibishwa, ingawa hakibebi peke yake wigo wote wa maana ya ukiwa na mshangao.
- source_word: עַל עֵקֶב
  choice: kwa sababu ya
  rationale: Kirai hiki, ambacho kihalisi kinahusiana na ‘kisigino/nyayo,’ hapa hutumika kuonyesha sababu au matokeo. “Kwa sababu ya” ni Kiswahili cha kawaida na wazi.
- source_word: בָּשְׁתָּם
  choice: aibu yao
  rationale: Hili ndilo chaguo la moja kwa moja kwa neno linalomaanisha aibu, fedheha, au kuaibishwa hadharani.
- source_word: הָאֹמְרִים לִי
  choice: hao wanaoniambia
  rationale: 'Muundo wenye kibainishi na kivumishi-tendo unawataja watu hususa: ‘hao wanaoniambia.’'
- source_word: הֶאָח הֶאָח
  choice: Aha! Aha!
  rationale: Kiingizi hiki huonyesha dhihaka au furaha ya kijicho juu ya mabaya ya mwingine; “Aha! Aha!” huhifadhi sauti ya kejeli kwa Kiswahili cha sasa.
