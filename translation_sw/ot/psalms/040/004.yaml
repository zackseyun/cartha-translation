  text: אַ֥שְֽׁרֵי הַ/גֶּ֗בֶר אֲשֶׁר שָׂ֣ם יְ֭הֹוָה מִבְטַח֑/וֹ וְֽ/לֹא פָנָ֥ה אֶל רְ֝הָבִ֗ים וְ/שָׂטֵ֥י כָזָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/004.yaml
  text: Blessed is the man who has made Yahweh his trust[a], and has not turned to the proud[d][c][b], to those who turn aside to falsehood.
translation:
  language: sw
  text: Heri[a] mwanamume[b] aliyemweka Yahwe kuwa tumaini lake, wala hakuwageukia wenye kiburi[c], wala wale wanaogeukia uongo[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Heri” pia inaweza kueleweka “Ana furaha” au “Amebarikiwa.” Neno la Kiebrania linajumuisha wazo la furaha na hali inayostahili pongezi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema “mwanamume” katika umoja; hapa anawakilisha mtu wa aina hiyo katika tamko la hekima.
    reason: cultural_note
  - marker: c
    text: Au “wenye majivuno.” Neno la Kiebrania hapa linaelekea kumaanisha watu wenye kiburi, si jina maalumu Rahabu.
    reason: lexical_alternative
  - marker: d
    text: Au “wale wanaopotoka kuelekea udanganyifu.” Kiebrania kinaweza kumaanisha uongo, udanganyifu, au jambo lisilo la kweli.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heri
  rationale: Neno “Heri” ni tamko la kawaida la Kiswahili linaloweza kuonyesha furaha na hali ya kubarikiwa au kustahili pongezi, hivyo linafaa kwa mtindo wa hekima wa zaburi.
- source_word: הַגֶּבֶר
  choice: mwanamume
  rationale: Nomino ya Kiebrania ni umoja wa kiume na hapa inatumika kiwakilishi katika tamko la hekima. “Mwanamume” huhifadhi umbo hilo bila kuongeza maana ya nguvu.
- source_word: שָׂם
  choice: aliyemweka
  rationale: Kitenzi kina maana ya kuweka au kufanya. “Aliyemweka Yahwe kuwa tumaini lake” huhifadhi muundo ambamo Yahwe ndiye aliyewekwa kuwa msingi wa tumaini.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: מִבְטַחוֹ
  choice: tumaini lake
  rationale: Nomino hii humaanisha kitu au mtu anayetumainiwa. “Tumaini lake” ni fupi, wazi, na linaendana na muundo wa kitenzi “kumweka ... kuwa.”
- source_word: פָנָה אֶל
  choice: hakuwageukia
  rationale: Usemi huu una maana ya kuwageukia watu kwa kuwatazamia, kuwafuata, au kuwategemea; “kuwageukia” huhifadhi picha ya Kiebrania.
- source_word: רְהָבִים
  choice: wenye kiburi
  rationale: Katika wingi huu neno linaeleweka vyema kuwa watu wenye majivuno au kiburi, si jina maalumu Rahabu.
- source_word: שָׂטֵי
  choice: wale wanaokengeukia
  rationale: Umbo la kishirikishi linaeleza watu wanaopotoka au kuacha njia. “Wanaokengeukia” huhifadhi wazo la kwenda kando bila kulifanya kuwa istilahi nzito ya kitheolojia.
- source_word: כָזָב
  choice: uongo
  rationale: Nomino ya umoja ina maana ya uongo, udanganyifu, au jambo lisilo la kweli. “Uongo” ni ya kawaida na ya moja kwa moja katika Kiswahili.
theological_decisions:
- issue: Umoja wa kiume wenye maana ya kiwakilishi katika tamko la hekima
  choice: mwanamume
  alternative: mtu; yeye
  rationale: Maandishi yana nomino ya kiume katika umoja, ingawa kanuni inayotamkwa inaweza kuwahusu wengine pia. Tafsiri kuu inalinda umbo la chanzo, na tanbihi inaeleza matumizi yake ya kiwakilishi.
- issue: Utoaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu moja kwa moja. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Utambulisho wa רְהָבִים
  choice: wenye kiburi
  alternative: wenye majivuno; Rahabu
  rationale: Muktadha na umbo la wingi vinaelekeza kwenye watu wenye kiburi. Kulichukua kuwa jina maalumu Rahabu kungeingiza utambulisho usiohitajika katika mstari huu.
- issue: Uhusiano wa “wenye kiburi” na “wanaokengeukia uongo”
  choice: vikundi au maelezo mawili yanayoratibiwa kwa “wala”
  alternative: 'kundi moja: wenye kiburi wanaokengeukia uongo'
  rationale: Muundo wa Kiebrania unaweza kusomwa kwa ukaribu kwa zaidi ya namna moja. Kurudia “wala” hudumisha uratibu bila kudai kwamba kishazi cha pili lazima kifafanue tu kundi la kwanza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa lakini yenye hadhi ya kishairi. “Heri” na urudiaji wa “wala” vinafaa kwa sauti ya hekima na usambamba wa zaburi. Jina “Yahwe” limetumiwa wazi, na sentensi imebaki fupi ili isomeke kwa urahisi hadharani.
