translation:
  language: sw
  text: Nilimngoja Yahweh kwa saburi[a]; naye akaniinamia, akasikia kilio changu cha kuomba msaada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Nilingoja, naam, nilingoja,” usemi wa msisitizo unaoweza kumaanisha nilingoja kwa saburi au kwa hamu na tumaini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַוֺּה קִוִּיתִי
  choice: Nilimngoja ... kwa saburi
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi kamili unasisitiza tendo la kungoja. Kiswahili cha kawaida huwasilisha msisitizo huo kwa ‘kwa saburi’; tanbihi inahifadhi umbo la Kiebrania na uwezekano wa kungoja kwa hamu na tumaini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: וַיֵּט אֵלַי
  choice: akaniinamia
  rationale: נטה pamoja na אֵלַי inaeleza Yahweh akijielekeza au kuinama kumwelekea mwombaji. ‘Akaniinamia’ ni ya asili na inadumisha taswira ya kuelekea chini ili kumsikiliza.
- source_word: וַיִּשְׁמַע
  choice: akasikia
  rationale: שׁמע hapa ni kusikia kwa makini kilio cha mwombaji; ‘akasikia’ ni wazi na haiongezi kwa lazima wazo la jibu ambalo halijasemwa moja kwa moja.
- source_word: שַׁוְעָתִי
  choice: kilio changu cha kuomba msaada
  rationale: שַׁוְעָה ni kilio cha dhiki kinachoomba msaada, si kilio cha kawaida tu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko lina jina binafsi יְהוָה. ‘Yahweh’ huhifadhi jina hilo bila kulibadilisha kuwa cheo, huku likifuata matamshi yanayokubaliwa sana kitaaluma.
- issue: Nguvu ya קַוֺּה קִוִּיתִי
  choice: kwa saburi
  alternative: kwa hamu na tumaini; nilingoja, naam, nilingoja
  rationale: Muundo unasisitiza kungoja kwa kudumu, lakini unaweza pia kuwa na wazo la tumaini. Tafsiri kuu ni ya asili kwa Kiswahili, na tanbihi huhifadhi upana huo bila kuufungia katika maana moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akaniinamia’ huhifadhi taswira ya asili kwa lugha inayoeleweka; sentensi ina mtiririko wa kishairi bila kuwa ya kizamani.
