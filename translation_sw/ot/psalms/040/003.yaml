source:
  edition: WLC
  text: וַ/יִּתֵּ֬ן בְּ/פִ֨/י שִׁ֥יר חָדָשׁ֮ תְּהִלָּ֪ה לֵֽ/אלֹ֫הֵ֥י/נוּ יִרְא֣וּ רַבִּ֣ים וְ/יִירָ֑אוּ וְ֝/יִבְטְח֗וּ בַּ/יהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/003.yaml
  text: He put a new song in my mouth[a], a song of praise to our God. Many will see and fear[c][b], and will trust in Yahweh.
translation:
  language: sw
  text: 'Akaweka kinywani mwangu wimbo mpya,

    wimbo wa kumsifu Mungu wetu.

    Wengi wataona na kuogopa[a],

    nao watamtumaini Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwa na kicho.” Kitenzi cha Kiebrania kinaweza kumaanisha kuogopa, kuwa na kicho, au kustaajabu kwa heshima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Akaweka
  rationale: Ingawa נָתַן kwa kawaida ni ‘kutoa,’ pamoja na ‘kinywani mwangu’ maana ya kawaida na ya picha ni ‘kuweka.’
- source_word: בְּפִי
  choice: kinywani mwangu
  rationale: Huhifadhi taswira halisi ya Kiebrania ya wimbo kuwekwa kinywani mwa mtunga-zaburi.
- source_word: שִׁיר חָדָשׁ
  choice: wimbo mpya
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida, ikionyesha sifa mpya inayotokana na tendo la Mungu.
- source_word: תְּהִלָּה לֵאלֹהֵינוּ
  choice: wimbo wa kumsifu Mungu wetu
  rationale: תְּהִלָּה linafafanua ‘wimbo mpya’ kwa uhusiano wa ufafanuzi; Kiswahili hiki ni cha asili na kinaweka wazi kuwa ni wimbo wa sifa unaoelekezwa kwa Mungu wetu.
- source_word: יִרְאוּ רַבִּים
  choice: Wengi wataona
  rationale: 'Kauli isiyotimilika inaeleweka hapa kwa maana ya wakati ujao au matokeo: wengi wataona tendo la Mungu.'
- source_word: וְיִירָאוּ
  choice: na kuogopa
  rationale: ‘Kuogopa’ huhifadhi uzito na upana wa ירא, ambao unaweza kujumuisha hofu, kicho, na mshangao wa heshima.
- source_word: וְיִבְטְחוּ
  choice: nao watamtumaini
  rationale: בָּטַח humaanisha kutumaini au kutegemea; kiambishi ‘-m-’ kinaendana kwa asili na Yahweh kama yule anayetumainiwa.
- source_word: בַּיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetolewa kama ‘Yahweh,’ huku uhusiano wa kisarufi na kitenzi ukionyeshwa na ‘watamtumaini.’
theological_decisions:
- issue: Namna ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la Mungu la herufi nne moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya וְיִירָאוּ baada ya kuona tendo la Mungu
  choice: kuogopa
  alternative: kuwa na kicho; kustaajabu kwa heshima
  rationale: Tafsiri hii huhifadhi mvutano wa Kiebrania kati ya hofu na kicho badala ya kuupunguza na kubaki na maana laini pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. Mistari imepangwa kufuata vipashio vya kishairi vya Kiebrania. ‘Kinywani mwangu’ imechaguliwa badala ya ‘mdomoni mwangu’ ili kuhifadhi taswira pana ya פֶּה; ‘watamtumaini Yahweh’ ni mtiririko wa kawaida wa Kiswahili.
