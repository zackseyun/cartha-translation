  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַתָּ֤ה יְהוָ֗ה לֹא תִכְלָ֣א רַחֲמֶ֣י/ךָ מִמֶּ֑/נִּי חַסְדְּ/ךָ֥ וַ֝/אֲמִתְּ/ךָ֗ תָּמִ֥יד יִצְּרֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/011.yaml
  text: You[a], O Yahweh, will not withhold your compassion from me[b]; your steadfast love and your faithfulness will continually preserve me.
translation:
  language: sw
  text: Wewe, Ee Yahwe, hutaninyima huruma zako[b]; upendo wako thabiti na uaminifu wako[a] vitanilinda daima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kweli yako.”
    reason: lexical_alternative
  - marker: b
    text: Au “usininyime huruma zako,” ikiwa kitenzi kinaeleweka kuwa ombi badala ya kauli ya tumaini.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: תִכְלָא
  choice: hutaninyima
  rationale: Kitenzi כלא hapa kina maana ya kuzuia au kutompa mtu kitu. Muundo huu wa Kiswahili unaonyesha kwa kawaida kutomzuia mwombaji asipate huruma, huku wakati ujao ukihifadhiwa.
- source_word: רַחֲמֶיךָ
  choice: huruma zako
  rationale: Wingi wa Kiebrania umehifadhiwa; neno hili linaonyesha rehema yenye hisia ya ndani ya kuwahurumia wengine.
- source_word: חַסְדְּךָ
  choice: upendo wako thabiti
  rationale: Neno חֶסֶד linajumuisha upendo, fadhili, na ushikamanifu wa kudumu; tafsiri hii inaweka pamoja upendo na uthabiti bila kuingiza istilahi nzito ya kimadhehebu.
- source_word: אֲמִתְּךָ
  choice: uaminifu wako
  rationale: Katika ulinganifu wake na חֶסֶד, neno hili linaelekea kumaanisha kutegemeka na kushikamana kwa Mungu, ingawa maana ya 'kweli' pia inawezekana na imehifadhiwa katika tanbihi.
- source_word: תָּמִיד
  choice: daima
  rationale: Neno hili linaonyesha tendo la ulinzi linaloendelea bila kukoma.
- source_word: יִצְּרוּנִי
  choice: vitanilinda
  rationale: Kitenzi נצר kina maana ya kutunza, kulinda, au kuhifadhi. 'Vitanilinda' ni cha kawaida na kinaonyesha wazi nguvu ya ulinzi; upatanisho wa wingi unafuata viima viwili vilivyounganishwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina lenyewe la Mungu; kulitohowa kama 'Yahwe' kunalihifadhi bila kulibadilisha kuwa cheo.
- issue: 'Kauli ya תִכְלָא: uhakika au ombi'
  choice: hutaninyima
  alternative: usininyime
  rationale: Yiqtol ya nafsi ya pili inaweza kueleweka kama kauli ya tumaini kuhusu wakati ujao au kama ombi lenye nguvu ya amri. Maandishi makuu yanahifadhi kauli ya tumaini, na tanbihi inaonyesha ombi linalowezekana.
- issue: Maana ya אֱמֶת katika jozi חֶסֶד וֶאֱמֶת
  choice: uaminifu
  alternative: kweli
  rationale: Pamoja na upendo thabiti na tendo la kulinda, 'uaminifu' huonyesha kutegemeka kwa Mungu; lakini maana ya 'kweli' ni halisi pia na imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Wewe, Ee Yahwe” huhifadhi msisitizo wa kiwakilishi cha Kiebrania na usemi wa moja kwa moja kwa Mungu. Alama za tanbihi zimewekwa karibu na maneno au kifungu zinachofafanua.
