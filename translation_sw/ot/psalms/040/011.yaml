  source_fidelity: 'Tafsiri inafuata Kiebrania kwa uaminifu: msisitizo wa "Wewe," umehifadhiwa, תִכְלָא imetolewa kwa kauli ya uhakika ya wakati ujao "hutaninyima," na viima vya wingi "upendo ... na uaminifu" vinaafikiana vizuri na "vitanilinda." "Huruma zako" na "uaminifu wako" zinawakilisha kwa usahihi רַחֲמֶיךָ na אֲמִתְּךָ katika muktadha huu.'
