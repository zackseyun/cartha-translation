source:
  edition: WLC
  text: צִדְקָתְ/ךָ֬ לֹא כִסִּ֨יתִי בְּ/ת֬וֹךְ לִבִּ֗/י אֱמוּנָתְ/ךָ֣ וּ/תְשׁוּעָתְ/ךָ֣ אָמָ֑רְתִּי לֹא כִחַ֥דְתִּי חַסְדְּ/ךָ֥ וַ֝/אֲמִתְּ/ךָ֗ לְ/קָהָ֥ל רָֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/010.yaml
  text: I have not hidden your righteousness within my heart[a]; I have spoken of your faithfulness and your salvation[d][c][b]. I have not concealed your steadfast love and your truth from the great assembly.
translation:
  language: sw
  text: Sikuificha haki yako moyoni mwangu[a]; nimetangaza uaminifu wako na wokovu wako[b]. Sikuficha upendo wako thabiti[c] na kweli yako kutoka kwa kusanyiko kubwa[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tendo lako la haki.” Neno la Kiebrania linaweza kumaanisha uadilifu wa Mungu au tendo lake la kutenda haki na kumtetea mtu.
    reason: lexical_alternative
  - marker: b
    text: Au, “ukombozi wako.”
    reason: lexical_alternative
  - marker: c
    text: Au, “upendo wako wa agano.” Neno la Kiebrania linahusisha upendo wenye uaminifu na uthabiti.
    reason: lexical_alternative
  - marker: d
    text: Au, “mbele ya kusanyiko kubwa.” Muundo wa Kiebrania unaweza kusisitiza ama watu ambao habari hizo hazikufichwa ama mazingira ya tangazo la hadharani.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקָתְךָ
  choice: haki yako
  rationale: Katika Kiswahili, “haki” huweza kueleza uadilifu na pia tendo la kutenda kwa haki; hivyo inadumisha upana wa צדקה katika muktadha wa sifa za Mungu.
- source_word: כִסִּיתִי
  choice: sikuificha
  rationale: Ingawa maana ya msingi ni “kufunika,” hapa kitenzi kinaeleza kutunza jambo ndani bila kulisema; “kuficha” ni cha kawaida na hudumisha picha hiyo.
- source_word: בְּתוֹךְ לִבִּי
  choice: moyoni mwangu
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza kwamba jambo limehifadhiwa kwa ndani bila kutangazwa.
- source_word: אֱמוּנָתְךָ
  choice: uaminifu wako
  rationale: אֱמוּנָה hapa ni utegemekaji na uthabiti wa Mungu, si imani ya mtu; “uaminifu” huwasilisha maana hiyo vizuri.
- source_word: וּתְשׁוּעָתְךָ
  choice: na wokovu wako
  rationale: תשועה hujumuisha wokovu au ukombozi kutoka hatarini; “wokovu” ni neno pana, la kawaida, na linalofaa muktadha huu.
- source_word: אָמָרְתִּי
  choice: nimetangaza
  rationale: Maana ya msingi ni “nimesema,” lakini vitu vinavyofuata na mazingira ya kusanyiko vinaonyesha ushuhuda wa hadharani; “nimetangaza” ni ya asili bila kuongeza fundisho.
- source_word: כִחַדְתִּי
  choice: sikuficha
  rationale: Kitenzi kina maana ya kuficha au kuzuia jambo lisijulikane. Kurudia “kuficha” kunaonyesha ulinganifu wa kishairi wa Kiebrania kwa uwazi.
- source_word: חַסְדְּךָ
  choice: upendo wako thabiti
  rationale: חסד huunganisha upendo na uaminifu wa kudumu katika uhusiano; “upendo thabiti” ni wa kisasa na haubani neno hilo kwa maana moja ya kimadhehebu.
- source_word: וַאֲמִתְּךָ
  choice: na kweli yako
  rationale: “Kweli” hudumisha tofauti ya kileksia kati ya אֱמֶת na אֱמוּנָה, huku muktadha ukiendelea kuashiria kutegemeka kwa Mungu.
- source_word: לְקָהָל רָב
  choice: kwa kusanyiko kubwa
  rationale: Baada ya kitenzi cha kuficha, לְ huweza kuonyesha wale ambao hawakufichwa habari hizo; “kwa kusanyiko kubwa” ni Kiswahili cha kawaida, ingawa “mbele ya kusanyiko kubwa” pia kinawezekana.
theological_decisions:
- issue: Kutofautisha אֱמוּנָה na אֱמֶת, maneno mawili yanayokaribiana kuhusu tabia ya Mungu
  choice: Kutafsiri אֱמוּנָתְךָ kuwa “uaminifu wako” na אֲמִתְּךָ kuwa “kweli yako”
  alternative: Kutafsiri yote mawili kwa maneno yanayoingiliana, kama “uaminifu wako” na “uaminifu wako,” au kubadilisha mpangilio kuwa “ukweli” na “uaminifu.”
  rationale: Kutumia “uaminifu” na “kweli” kunahifadhi mkusanyiko wa sifa zinazofanana lakini zisizo sawa kabisa, bila kuzipunguza kuwa dhana moja.
- issue: Nguvu ya vitenzi timilifu vya Kiebrania katika ushuhuda wa mtunga zaburi
  choice: 'Kutumia wakati timilifu wa Kiswahili: “sikuificha,” “nimetangaza,” na “sikuficha”'
  alternative: Kutumia wakati uliopita wa masimulizi kwa namna isiyosisitiza matokeo ya sasa.
  rationale: Miundo hii ya Kiswahili inaeleza matendo yaliyotendeka na yenye uzito katika ushuhuda wa sasa, bila kudai zaidi ya sarufi ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio na ulinganifu wa mstari wa Kiebrania umehifadhiwa; msamiati wa kimadhehebu usio wa lazima umeepukwa.
