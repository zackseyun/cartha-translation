lexical_decisions:
- source_word: רְצֵה
  choice: uwe tayari
  rationale: Kauli ya amri ya רצה katika ombi hili inaomba utayari au kibali cha neema cha Yahweh. “Uwe tayari” ni Kiswahili cha sasa na huhifadhi maana ya hiari bila kudokeza kwamba Mungu anafurahia hatari yenyewe.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa Tetragramatoni linatolewa kama “Yahweh,” si kubadilishwa na cheo.
- source_word: לְהַצִּילֵנִי
  choice: kuniokoa
  rationale: Hifili ya נצל pamoja na kiambishi cha nafsi ya kwanza ina maana ya kumwondoa mtu hatarini au kumwokoa. “Kuniokoa” ni ya kawaida na yenye hadhi katika ombi la Kiswahili.
- source_word: לְעֶזְרָתִי
  choice: kunisaidia
  rationale: Kirai hiki, kihalisi “kwa ajili ya msaada wangu,” hutolewa kwa mtindo wa kawaida wa Kiswahili kama “kunisaidia.”
- source_word: חוּשָׁה
  choice: fanya haraka
  rationale: Amri ya חושׁ inaonyesha uharaka. “Fanya haraka” ni ya asili katika Kiswahili cha sasa na huhifadhi nguvu ya ombi.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu moja kwa moja; “Yahweh” hulihifadhi badala ya kulibadilisha kwa cheo.
- issue: Maana ya רְצֵה katika ombi
  choice: uwe tayari
  alternative: ipendeze kwako
  rationale: “Uwe tayari” huhifadhi wazo la kibali na utashi wa neema katika muktadha huu, huku tanbihi ikionyesha tafsiri ya karibu zaidi na maana ya kupendezwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala. Neno “Ee” linaonyesha mwito wa moja kwa moja, na urudiaji wa “Yahweh” umehifadhiwa. Alama zote za tanbihi zimo katika matini kuu.
