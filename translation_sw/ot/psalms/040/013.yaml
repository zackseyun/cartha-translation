  text: Ee Yahweh, uwe radhi[a] kuniokoa; Ee Yahweh, fanya haraka kunisaidia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “ipendeze kwako.” Kitenzi cha Kiebrania kinaweza kuonyesha utayari wa neema, kibali, au kupendezwa kufanya jambo.'
