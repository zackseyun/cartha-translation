  - severity: low
    issue: Second vocative begins with lower-case “ee”
    rationale: For consistent formal prayer punctuation and presentation, capitalize the repeated vocative as “Ee.”
  - severity: low
    issue: Footnote b does not offer a clearly distinct alternative
    rationale: “Harakisha kunisaidia” is very close to the main rendering. “Uwahi kunisaidia” gives a concise, natural alternative for the imperative ‘make haste.’
