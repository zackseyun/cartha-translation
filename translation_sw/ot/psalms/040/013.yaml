  source_fidelity: Rְצֵה expresses a request for Yahweh’s favorable willingness or pleasure in delivering the speaker. “Uwe tayari” can mean “be ready/prepared,” which weakens this favorable-volitional nuance. The remaining clauses faithfully retain the two invocations of the divine name, the first-person object, and the urgency of the final imperative.
  naturalness: “Uwe radhi kuniokoa” is idiomatic, dignified Standard East African Swahili for a prayer and avoids suggesting mere preparedness. “Fanya haraka kunisaidia” is natural contemporary Swahili and conveys the urgent appeal.
  terminology: “Yahweh” consistently represents יהוה. “Kuniokoa” suitably renders the rescue/deliverance sense of להצילני without imposing a narrower doctrinal sense.
