base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/012.yaml
  text: For evils beyond number have surrounded me[a]; my iniquities have overtaken me, and I am not able to see. They are more than the hairs of my head[c][b], and my heart fails me.
translation:
  language: sw
  text: Kwa maana mabaya yasiyohesabika yamenizunguka[a]; maovu yangu[b] yamenifikia, nami siwezi kuona. Yamekuwa mengi kuliko nywele za kichwa changu, na moyo wangu umeniacha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yasiyo na hesabu” au “mengi mno kuhesabika.”
    reason: lexical_alternative
  - marker: b
    text: “Maovu yangu” yaweza pia kutafsiriwa “dhambi zangu” au “hatia yangu”; neno la Kiebrania linaweza kujumuisha makosa na mzigo wa hatia yake.
    reason: lexical_alternative
  - marker: c
    text: Kwa maana halisi, “moyo wangu umeniacha”; yaweza kumaanisha kwamba nguvu au ujasiri umemwishia.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza nguvu ya kueleza sababu au msingi wa ombi katika muktadha.
- source_word: אָפְפוּ עָלַי
  choice: yamenizunguka
  rationale: Inahifadhi picha ya mtu aliyezingirwa pande zote kwa Kiswahili cha kawaida.
- source_word: רָעוֹת
  choice: mabaya
  rationale: Neno la Kiebrania linaweza kumaanisha maovu, madhara, au maafa; “mabaya” huhifadhi upana huo bila kuyafanya kuwa dhambi za msemaji pekee.
- source_word: עַד אֵין מִסְפָּר
  choice: yasiyohesabika
  rationale: Ni usemi wa idadi isiyoweza kuhesabiwa; uchaguzi huu ni wazi na wenye hadhi.
- source_word: הִשִּׂיגוּנִי
  choice: yamenifikia
  rationale: Kitenzi kinaweza kumaanisha kufikia, kukamata, au kumwandama mtu hadi kumpata; “yamenifikia” ni cha karibu na chanzo na hakiongezi maana kupita kiasi.
- source_word: עֲוֹנֹתַי
  choice: maovu yangu
  rationale: Huhifadhi wazo la makosa ya kimaadili, huku neno la Kiebrania likiweza pia kujumuisha hatia na mzigo wake.
- source_word: וְלֹא יָכֹלְתִּי לִרְאוֹת
  choice: nami siwezi kuona
  rationale: Huwasilisha moja kwa moja kutoweza kuona bila kuamua kimya-kimya kama ni upofu halisi au kulemewa na dhiki.
- source_word: עָצְמוּ מִשַּׂעֲרוֹת רֹאשִׁי
  choice: Ni mengi kuliko nywele za kichwa changu
  rationale: Muktadha unaonyesha ulinganisho wa wingi; usemi huu ni wa asili na huhifadhi taswira ya Kiebrania.
- source_word: לִבִּי עֲזָבָנִי
  choice: moyo wangu umeniacha
  rationale: Huhifadhi sitiari halisi ya Kiebrania badala ya kuifafanua kuwa kupoteza ujasiri au nguvu pekee.
theological_decisions:
- issue: Iwapo עֲוֹנֹתַי ni dhambi za mtunga zaburi, hatia yake, au matokeo ya makosa yake
  choice: maovu yangu
  alternative: hatia yangu; matokeo ya dhambi zangu
  rationale: Umilikishi unaelekea kwa makosa ya msemaji mwenyewe, lakini neno עָוֹן linaweza pia kubeba maana ya hatia na mzigo wake. Tafsiri inadumisha mvutano kati ya mabaya ya nje na uwajibikaji wa kimaadili wa msemaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kishairi lakini unaeleweka kwa msomaji wa kawaida; sitiari za chanzo zimehifadhiwa inapowezekana.
