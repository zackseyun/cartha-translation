base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/005.yaml
  text: You have done many things[a], O Yahweh my God—your wonders and your plans for us; none can be compared to you. If I would declare and speak of them, they are too many to recount.
translation:
  language: sw
  text: Ee Yahwe, Mungu wangu, umefanya mambo mengi; matendo yako ya ajabu na mipango yako kwa ajili yetu ni mingi. Hakuna yeyote anayeweza kulinganishwa nawe. Kama ningeyatangaza na kuyasimulia, ni mengi mno kuweza kuhesabiwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַבּוֹת עָשִׂיתָ
  choice: umefanya mambo mengi
  rationale: Kivumishi cha wingi kinatumika kwa namna ya kueleza wingi wa matendo; kuongeza ‘mambo’ kunafanya sentensi iwe ya kawaida katika Kiswahili bila kubadili maana.
- source_word: יְהוָה אֱלֹהַי
  choice: Ee Yahwe, Mungu wangu
  rationale: Jina la Mungu linatunzwa kama ‘Yahwe,’ na kihisishi ‘Ee’ kinaonyesha mwito wa moja kwa moja kwa Kiswahili cha kawaida na chenye heshima.
- source_word: נִפְלְאֹתֶיךָ
  choice: matendo yako ya ajabu
  rationale: Nomino hiyo inarejelea mambo au matendo ya Mungu yanayostaajabisha; ‘matendo yako ya ajabu’ ni wazi na ya asili kuliko nomino dhahania pekee.
- source_word: וּמַחְשְׁבֹתֶיךָ אֵלֵינוּ
  choice: na mipango yako kwa ajili yetu
  rationale: מחשבות inaweza kumaanisha mawazo, makusudi, au mipango. Katika muktadha wa matendo ya Mungu, ‘mipango’ huonyesha kusudi bila kuingiza mfumo maalumu wa kiteolojia; maana halisi zaidi imewekwa katika tanbihi.
- source_word: אֵין עֲרֹךְ אֵלֶיךָ
  choice: Hakuna anayeweza kulinganishwa nawe
  rationale: Hii huwasilisha kwa Kiswahili cha kawaida nahau ya Kiebrania inayosisitiza kwamba Mungu hana wa kufanana naye.
- source_word: אַגִּידָה וַאֲדַבֵּרָה
  choice: Kama ningeyatangaza na kuyasimulia
  rationale: Miundo ya kohortativi inaeleweka hapa kama mwanzo wa wazo lenye masharti, linalofuatwa na kutowezekana kuyahesabu yote.
- source_word: עָצְמוּ מִסַּפֵּר
  choice: ni mengi mno kuweza kuhesabiwa
  rationale: Katika muktadha huu, kitenzi huonyesha kuzidi kwa idadi; usemi huu wa Kiswahili unaonyesha kwamba matendo hayo yako nje ya uwezo wa kuyahesabu kikamilifu.
theological_decisions:
- issue: Maana ya מחשבות ya Mungu kuelekea watu wake
  choice: mipango yako kwa ajili yetu
  alternative: mawazo yako kutuelekea; makusudi yako kwa ajili yetu
  rationale: Tafsiri inaonyesha kusudi jema la Mungu kwa watu wake bila kulifungamanisha na fundisho maalumu kuhusu majaliwa au uteuzi.
- issue: Kutolinganishwa kwa Yahwe
  choice: Hakuna anayeweza kulinganishwa nawe
  alternative: Hakuna aliye kama wewe
  rationale: Chaguo hili linatunza picha ya kulinganisha iliyo katika nahau ya Kiebrania na kauli yake thabiti kuhusu upekee wa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa kishairi umedumishwa bila kutumia msamiati wa kale usio wa lazima.
