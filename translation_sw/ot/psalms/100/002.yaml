  yaml_path: translation/ot/psalms/100/002.yaml
  text: Serve Yahweh with gladness[a]; come before him with joyful shouting.
translation:
  language: sw
  text: Mtumikieni Yahwe kwa furaha; njooni mbele yake kwa vifijo vya shangwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kuimba kwa shangwe.” Neno la Kiebrania linaweza kumaanisha sifa ya sauti yenye furaha, iwe ni vifijo au uimbaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְדוּ
  choice: Mtumikieni
  rationale: Kitenzi cha amri kwa wingi kinamaanisha kumhudumia Yahwe kwa utii na ibada. “Mtumikieni” huhifadhi maana pana kuliko kukieleza kama tendo la ibada ya liturujia pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: בְּשִׂמְחָה
  choice: kwa furaha
  rationale: Kihusishi kinaonyesha namna ya kumtumikia; “kwa furaha” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: בֹּאוּ
  choice: njooni
  rationale: Ni amri ya wingi ya kuja au kukaribia. “Njooni” haiingizi wazo lisilotajwa wazi la kuingia ndani ya patakatifu.
- source_word: לְפָנָיו
  choice: mbele zake
  rationale: Nahau hiyo humaanisha kuwa mbele ya uso au katika uwepo wake. “Mbele zake” ni usemi wa Kiswahili wenye hadhi unaohifadhi taswira ya mahali na uhusiano.
- source_word: בִּרְנָנָה
  choice: kwa vifijo vya shangwe
  rationale: Neno רננה linaweza kutaja kilio cha furaha, vifijo, au uimbaji wa shangwe. “Vifijo vya shangwe” huonyesha sifa ya sauti yenye uchangamfu bila kuifanya kuwa uimbaji tu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri kwa wingi umehifadhiwa, na lugha imeepuka kubana רננה kuwa uimbaji pekee.
