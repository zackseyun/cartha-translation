base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/003.yaml
  text: Know that Yahweh[a], he is God. He made us, and not we ourselves; we are his people and the sheep of his pasture.
translation:
  language: sw
  text: Jueni kwamba Yahweh ndiye Mungu. Yeye alituumba, wala si sisi wenyewe;[a] sisi ni watu wake na kondoo wa malisho yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata usomaji wa kimapokeo wa pembeni: “Nasi ni wake.”'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּעוּ
  choice: Jueni
  rationale: Amri ya wingi ya ידע inawaita wasikilizaji wajue na kukiri ukweli huu; “Jueni” ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: כִּי
  choice: kwamba
  rationale: Hutambulisha maudhui yanayopaswa kujulikana, hivyo “kwamba” linafaa kiasili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Linahifadhi jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadili kuwa cheo.
- source_word: הוּא אֱלֹהִים
  choice: ndiye Mungu
  rationale: Muundo huu unaweka mkazo kwenye kiwakilishi הוּא. “Ndiye Mungu” huhifadhi mkazo huo bila kuongeza neno kama “pekee,” ambalo halipo wazi katika Kiebrania.
- source_word: הוּא עָשָׂנוּ
  choice: Yeye ndiye aliyetuumba
  rationale: עָשָׂנוּ humaanisha kwamba Mungu alitufanya au alituumba; “aliyetuumba” ni ya asili katika muktadha huu, na “Yeye ndiye” huhifadhi mkazo wa הוּא.
- source_word: וְלֹא אֲנַחְנוּ
  choice: wala si sisi wenyewe
  rationale: Hufuata maandishi ya konsonanti (ketiv), לא, yanayosema kwamba si sisi tuliojiumba. Usomaji wa mapokeo wa לו umewekwa katika tanbihi.
- source_word: עַמּוֹ
  choice: watu wake
  rationale: Ni usemi wa kawaida unaoonyesha watu walio wake Mungu.
- source_word: וְצֹאן מַרְעִיתוֹ
  choice: na kondoo wa malisho yake
  rationale: Linahifadhi taswira ya kichungaji na ulinganifu wa karibu wa צֹאן na מַרְעִית.
theological_decisions:
- issue: Usomaji wa ketiv/qere katika sehemu ya katikati
  choice: 'Maandishi makuu yanafuata ketiv: “Yeye ndiye aliyetuumba, wala si sisi wenyewe.”'
  alternative: 'Qere ya kimapokeo: “Yeye ndiye aliyetuumba, nasi ni wake.”'
  rationale: Maandishi ya konsonanti לא yana maana ya “si,” ilhali usomaji wa pembeni לו una maana ya “wake.” Kwa kuwa zote mbili ni za kale na zinaeleweka katika muktadha, ketiv imehifadhiwa katika maandishi makuu na qere katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “ndiye” umetumiwa kuhifadhi mkazo wa viwakilishi vya Kiebrania; tanbihi imewekwa mara tu baada ya kishazi husika.
