base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/005.yaml
  text: For Yahweh is good[a]; his steadfast love is forever[d][c][b], and his faithfulness endures from generation to generation.
translation:
  language: sw
  text: Kwa maana Yahweh ni mwema; upendo wake thabiti[a] ni wa milele, na uaminifu wake hudumu kizazi baada ya kizazi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania “hesed yake”—neno linaloweza kujumuisha upendo thabiti, rehema, na uaminifu wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Hutambulisha sababu ya mwito uliotangulia katika zaburi; ‘Kwa maana’ linaonyesha wazi uhusiano huo wa maelezo.
- source_word: טוֹב
  choice: ni mwema
  rationale: ‘Mwema’ huwasilisha uzuri wa kimaadili na wema unaotenda mema kwa lugha ya kawaida na yenye heshima.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kama jina, badala ya kubadilishwa kuwa cheo.
- source_word: לְעוֹלָם
  choice: ni wa milele
  rationale: Katika kishazi hiki linaonyesha muda usio na mwisho; muundo huu ni wa asili katika Kiswahili.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: Huhifadhi maana pana ya חֶסֶד—upendo, rehema, na uaminifu wenye kudumu—bila kuibana katika kipengele kimoja.
- source_word: וְעַד דֹּר וָדֹר
  choice: na ... kizazi baada ya kizazi
  rationale: Nahau hii ya Kiswahili huonyesha mwendelezo katika vizazi vinavyofuatana na kuwasilisha nguvu ya marudio ya Kiebrania.
- source_word: אֱמוּנָתוֹ
  choice: uaminifu wake
  rationale: Huwasilisha uthabiti, kutegemeka, na uaminifu wa Mungu, sambamba na upendo wake thabiti.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina maalumu la Mungu; kulihifadhi kama ‘Yahweh’ huepuka kulibadilisha kimya kimya kuwa cheo.
- issue: Upeo wa maana ya חֶסֶד
  choice: upendo wake thabiti
  alternative: rehema zake; uaminifu wake wa agano
  rationale: Chaguo hili huhifadhi kwa pamoja upendo na kudumu kwa uaminifu bila kuingiza kwa lazima istilahi finyu ya kiteolojia.
- issue: Kitenzi kisichotajwa wazi katika mstari wa pili
  choice: uaminifu wake hudumu
  alternative: uaminifu wake ni wa kizazi baada ya kizazi
  rationale: Kiebrania kina kishazi nomino chenye maana ya muda. ‘Hudumu’ kinaweka wazi maana inayodokezwa na kufanya Kiswahili kiwe cha kawaida bila kubadili dai la msingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, rahisi kueleweka na chenye hadhi. Mpangilio wa ushairi na usambamba wa mawazo umehifadhiwa kwa lugha ya kawaida.
