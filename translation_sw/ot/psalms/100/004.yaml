base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/004.yaml
  text: Enter his gates with thanksgiving[a], his courts with praise; give thanks to him; bless his name.
translation:
  language: sw
  text: Ingieni katika malango yake kwa shukrani[a], katika nyua zake kwa sifa; mshukuruni, barikini jina lake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sadaka ya shukrani”; neno la Kiebrania linaweza kumaanisha shukrani au sadaka ya shukrani kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּאוּ
  choice: Ingieni
  rationale: Amri ya wingi ya בוא; pamoja na “malango” na “nyua,” inaeleza kuingia katika eneo la ibada kwa Kiswahili cha kawaida.
- source_word: שְׁעָרָיו
  choice: malango yake
  rationale: Nomino ya wingi yenye kiambishi cha nafsi ya tatu umoja; inadumisha taswira halisi ya viingilio vya eneo takatifu.
- source_word: בְּתוֹדָה
  choice: kwa shukrani
  rationale: תּוֹדָה inaweza kumaanisha shukrani au sadaka ya shukrani. Katika ulinganifu na “sifa,” maana ya shukrani inaelekea kufaa, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: חֲצֵרֹתָיו
  choice: nyua zake
  rationale: Hurejelea nyua za hekalu; “nyua” ni tafsiri ya moja kwa moja na ya kawaida bila kuondoa mazingira ya ibada.
- source_word: בִּתְהִלָּה
  choice: kwa sifa
  rationale: תְהִלָּה humaanisha sifa; “kwa sifa” inadumisha ulinganifu wa kishairi na “kwa shukrani.”
- source_word: הוֹדוּ לוֹ
  choice: mshukuruni
  rationale: Katika muktadha wa ibada, Hifili ya ידה humaanisha kutoa shukrani. Kiswahili “mshukuruni” ni cha kawaida na kinajumuisha kiwakilishi cha yule anayeshukuriwa.
- source_word: בָּרֲכוּ
  choice: libarikini
  rationale: Amri ya wingi ya ברך; “libarikini” inadumisha tofauti ya kimsamiati na “sifa” na inaungana moja kwa moja na “jina lake.”
- source_word: שְׁמוֹ
  choice: jina lake
  rationale: Tafsiri ya moja kwa moja inayohifadhi usemi wa ibada wa Kiebrania kuhusu utambulisho na sifa ya Mungu.
theological_decisions:
- issue: Taswira ya kiibada ya malango na nyua
  choice: Kudumisha taswira halisi ya kuingia katika “malango yake” na “nyua zake.”
  alternative: Kujumlisha maana kuwa kuingia “mbele zake” au “nyumbani mwake.”
  rationale: Kiebrania kinataja wazi maeneo ya kuingilia na nyua za patakatifu; kuyahifadhi huepuka kuingiza ufafanuzi mpana usiotajwa katika mstari.
- issue: Maana ya בְּתוֹדָה
  choice: “kwa shukrani” katika matini, pamoja na tanbihi ya “kwa sadaka ya shukrani.”
  alternative: Kutafsiri moja kwa moja “kwa sadaka ya shukrani” katika matini.
  rationale: Ulinganifu na “kwa sifa” unaunga mkono maana dhahania, lakini neno la Kiebrania linaweza pia kutaja sadaka maalumu; tanbihi huhifadhi utata huo halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kiibada lakini kinachoeleweka kwa wasomaji wa kawaida. Ulinganifu wa kishairi umehifadhiwa kwa “kwa shukrani … kwa sifa,” na taswira ya hekalu haijafafanuliwa kupita matini.
