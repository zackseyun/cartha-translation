base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/001.yaml
  text: A psalm for thanksgiving[a]. Shout joyfully to Yahweh[d][c][b], all the earth.
translation:
  language: sw
  text: 'Zaburi ya shukrani.[a]


    Dunia yote, mpigieni Yahwe kelele za shangwe![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Zaburi kwa ajili ya shukrani,” au “Zaburi kwa ajili ya sadaka ya shukrani.”'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “Dunia yote, mshangilieni Yahwe!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Katika vichwa vya zaburi, neno hili kwa kawaida humaanisha wimbo wa ibada unaoitwa zaburi; “Zaburi” ni neno la kawaida na linalofaa katika Kiswahili.
- source_word: לְתוֹדָה
  choice: kwa ajili ya shukrani
  rationale: Neno תּוֹדָה linaweza kumaanisha shukrani, sifa, au sadaka ya shukrani. Tafsiri hii inaonyesha maana ya shukrani bila kulazimisha muktadha wa dhabihu ambao kichwa hakithibitishi wazi.
- source_word: הָרִיעוּ
  choice: mpigieni ... kelele za furaha
  rationale: Kitenzi hiki ni agizo la kutoa sauti kubwa ya shangwe au sifa. Usemi huu ni wa kawaida katika Kiswahili na unahifadhi nguvu pamoja na furaha ya mwito huo.
- source_word: לַיהוָה
  choice: mpigieni Yahwe
  rationale: Kihusishi ל kinaonyesha kwamba kelele hizo zinaelekezwa kwa Yahwe. Jina la Mungu יְהוָה limetoholewa kuwa “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: כָּל־הָאָרֶץ
  choice: Dunia yote
  rationale: Katika mwito huu wa watu wote, אֶרֶץ lina maana pana ya dunia, si nchi moja tu. Kuliweka mwanzoni kunatoa mwito wa moja kwa moja na wa asili katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuongeza fasiri ya kimadhehebu.
- issue: Maana ya לְתוֹדָה katika kichwa
  choice: kwa ajili ya shukrani
  alternative: ya sadaka ya shukrani
  rationale: Kiebrania kinaweza kurejelea shukrani kwa ujumla au sadaka ya shukrani. Maandishi makuu hayafungi maana kwenye ibada ya dhabihu, na tanbihi inalinda uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaofaa kwa usomaji wa hadhara. Mpangilio “Dunia yote” mwanzoni unahifadhi mwito wa ulimwengu mzima na unasomeka kwa urahisi.
