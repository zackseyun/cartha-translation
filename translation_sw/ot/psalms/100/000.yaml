  text: 'Zaburi ya shukrani.[a]


    Pigeni kelele za furaha kwa Yahwe, enyi dunia yote.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Inaweza pia kutafsiriwa, “Zaburi kwa ajili ya sadaka ya shukrani.”
