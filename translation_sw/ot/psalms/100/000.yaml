lexical_decisions:
- source_word: מִזְמוֹר לְתוֹדָה
  choice: Zaburi kwa ajili ya shukrani
  rationale: Muundo huu unaakisi לְ yenye maana ya kusudi au matumizi. תּוֹדָה inaweza kumaanisha shukrani au sadaka ya shukrani; maana hiyo mbadala imehifadhiwa katika tanbihi.
- source_word: הָרִיעוּ
  choice: Mpigieni ... kelele za furaha
  rationale: Kitenzi hiki ni agizo la kutoa sauti au mwito mkubwa wa shangwe; tafsiri hii ni ya kawaida katika Kiswahili na huhifadhi nguvu ya agizo.
- source_word: כָּל־הָאָרֶץ
  choice: enyi watu wote wa dunia
  rationale: Kiebrania husema kihalisi ‘dunia yote’; katika mwito huu dunia inawakilisha wakaaji wake, hivyo Kiswahili hiki kinaweka wazi anayesemeshwa bila kupunguza upeo wa ulimwengu mzima.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Jina la pekee limetafsiriwa kwa umbo la Kiswahili ‘Yahwe’ badala ya kubadilishwa kuwa cheo, ili kudumisha tofauti ya kimatini kati ya jina hilo na אֲדֹנָי (‘Bwana’).
