lexical_decisions:
- source_word: וַיִּלְחָצוּם
  choice: wakawaonea
  rationale: Kitenzi לחץ katika Qal hapa kina maana ya kuonea, kukandamiza, au kusonga kwa nguvu. “Wakawaonea” ni Kiswahili cha kawaida kinachoonyesha ukandamizaji wa maadui.
- source_word: אֹיְבֵיהֶם
  choice: Adui zao
  rationale: Hii ndiyo maana ya moja kwa moja ya nomino אויב pamoja na kiambishi cha umilikaji cha nafsi ya tatu wingi.
- source_word: וַיִּכָּנְעוּ
  choice: wakatiishwa
  rationale: Niphal ya כנע inaonyesha kutiishwa au kuwekwa chini ya mamlaka; umbo la kutendwa “wakatiishwa” linahifadhi nguvu ya kisarufi na matokeo ya tendo.
- source_word: תַּחַת יָדָם
  choice: chini ya mkono wao
  rationale: Tafsiri hii inahifadhi taswira halisi ya Kiebrania, huku tanbihi ikifafanua maana yake ya kuwa chini ya mamlaka au udhibiti wao.
