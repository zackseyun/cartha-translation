  text: Adui zao waliwakandamiza, nao wakatiishwa chini ya mkono wa adui zao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, chini ya mamlaka au udhibiti wa adui zao; kwa maana halisi, “chini ya mkono wa adui zao.”
