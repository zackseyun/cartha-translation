  text: Yet he saved them for the sake of his name[c][b][a], to make his might known.
translation:
  language: sw
  text: Hata hivyo, aliwaokoa[a] kwa ajili ya jina lake[b], ili kuufanya uweza wake ujulikane[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Naye aliwaokoa” au “Lakini aliwaokoa.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa kwa njia tofauti; hapa kinaonyesha tofauti na mstari uliotangulia.
    reason: lexical_alternative
  - marker: b
    text: “Kwa ajili ya jina lake” pia inaweza kueleweka kuwa “kwa ajili ya sifa yake”; hata hivyo, katika Kiebrania “jina” mara nyingi hujumuisha maana pana ya tabia ya Mungu iliyofunuliwa na heshima yake.
    reason: lexical_alternative
  - marker: c
    text: Au “nguvu yake ijulikane.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשִׁיעֵם
  choice: Hata hivyo, aliwaokoa
  rationale: Kitenzi ישׁע humaanisha kuokoa au kukomboa. Katika muktadha huu, kiunganishi וַ־ kinaonyesha tofauti kati ya uasi wao katika mstari uliotangulia na tendo la Mungu; “Hata hivyo” kinaonyesha tofauti hiyo bila kuzidisha maana.
- source_word: לְמַעַן
  choice: kwa ajili ya
  rationale: לְמַעַן huonyesha kusudi au sababu. “Kwa ajili ya” ni usemi wa kawaida wa Kiswahili unaohifadhi maana hiyo pamoja na kishazi “jina lake.”
- source_word: שְׁמוֹ
  choice: jina lake
  rationale: Neno “jina” limehifadhiwa kwa sababu katika Kiebrania linajumuisha sifa, heshima, na jinsi Mungu anavyojifunua, si sifa yake mbele ya watu pekee.
- source_word: לְהוֹדִיעַ
  choice: ili kuufanya ... ujulikane
  rationale: Hii ni hali ya kusababisha ya ידע, yaani “kufanya ujulikane.” Muundo huu ni wa asili katika Kiswahili na unaonyesha wazi kusudi la tendo la kuokoa.
- source_word: אֶת
  choice: '[halijatafsiriwa kivyake]'
  rationale: Ni kiashiria cha yambwa tendwa katika Kiebrania na hakina neno linalolingana nalo moja kwa moja katika Kiswahili.
- source_word: גְּבוּרָתוֹ
  choice: uweza wake
  rationale: גְּבוּרָה linaweza kumaanisha uweza, nguvu, au matendo makuu. “Uweza wake” linafaa hapa kama nomino ya dhana inayoeleza uwezo mkuu wa Mungu.
theological_decisions:
- issue: Maana ya “kwa ajili ya jina lake”
  choice: Tendo la Mungu la kuokoa linatokana na kujali heshima ya jina lake na kufunuliwa kwa tabia yake.
  alternative: kwa ajili ya sifa yake
  rationale: Maana ya sifa au heshima imo katika usemi wa Kiebrania, lakini kuitafsiri hivyo pekee kungeifanya maana kuwa finyu. “Jina lake” huhifadhi pia kina cha utambulisho na tabia ya Mungu iliyofunuliwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Hata hivyo” huonyesha tofauti ya kimuktadha kwa uwazi; “uweza” ni neno la kawaida katika sajili ya kibiblia bila kuwa la kizamani.
