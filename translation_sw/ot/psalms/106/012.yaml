  text: Ndipo waliamini maneno yake[a]; wakaimba sifa yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na waliamini maneno yake.” Umbo la usimulizi la Kiebrania linaweza kutafsiriwa kwa “na” au kwa “ndipo,” ambalo linaonyesha wazi zaidi mfuatano wa matukio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמִינוּ
  choice: Ndipo wakayaamini
  rationale: Kitenzi cha Kiebrania kinaonyesha kuamini au kuweka tumaini, na umbo la usimulizi linaendeleza mfuatano wa matukio. “Ndipo” linaonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: בִדְבָרָיו
  choice: maneno yake
  rationale: Nomino ya Kiebrania iko katika wingi ikiwa na kiambishi cha nafsi ya tatu umoja; “maneno yake” huhifadhi wingi huo.
- source_word: יָשִׁירוּ
  choice: wakauimba
  rationale: Katika muktadha huu umbo hilo linaendeleza simulizi na linafaa kutafsiriwa kama tendo lililotokea. “Wakauimba” linaunganisha kwa kawaida tendo hili na lile lililotangulia.
- source_word: תְּהִלָּתוֹ
  choice: sifa yake
  rationale: Nomino yenye kiambishi cha nafsi ya tatu umoja humaanisha moja kwa moja “sifa yake”; katika Kiswahili, “kuimba sifa yake” ni usemi wa kawaida na wa heshima.
