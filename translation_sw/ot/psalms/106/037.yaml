  text: וַ/יִּזְבְּח֣וּ אֶת בְּ֭נֵי/הֶם וְ/אֶת בְּנֽוֹתֵי/הֶ֗ם לַ/שֵּֽׁדִים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/037.yaml
  text: They sacrificed their sons and their daughters to demons[a].
translation:
  language: sw
  text: Waliwatoa wana wao na binti zao kuwa dhabihu kwa mashetani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa wale mashetani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  choice: Waliwatoa ... kuwa dhabihu
  rationale: Kitenzi זבח kina maana ya kuchinja au kutoa kama dhabihu. Muundo huu ni wa asili katika Kiswahili na unaweka wazi maana ya ibada ya kutoa dhabihu, badala ya kuchinja kwa ujumla.
- source_word: בְּנֵיהֶם
  choice: wana wao
  rationale: בֵּן katika wingi hapa humaanisha wana wa kiume; “wana wao” huhifadhi utofautishaji wa kijinsia unaofuatwa na “binti zao.”
- source_word: וְאֶת בְּנוֹתֵיהֶם
  choice: na binti zao
  rationale: בַּת katika wingi humaanisha binti. Tafsiri hii huhifadhi msisitizo wa Kiebrania unaotaja wana na binti.
- source_word: לַשֵּׁדִים
  choice: kwa mashetani
  rationale: שֵׁדִים hurejelea viumbe wa kiroho waovu. “Mashetani” ni neno la Kiswahili linaloeleweka kwa urahisi, nalo “kwa” linaonyesha wapokeaji wa dhabihu.
- source_word: אֶת / וְאֶת
  choice: '[alama za yambwa, hazitafsiriwi moja kwa moja]'
  rationale: Kiswahili hakina kilinganishi cha moja kwa moja cha alama ya yambwa ya Kiebrania; maana yake inaonyeshwa na mpangilio wa kawaida wa sentensi.
theological_decisions:
- issue: Tafsiri ya שֵׁדִים
  choice: mashetani
  alternative: miungu ya uongo; roho waovu
  rationale: Neno la Kiebrania linataja viumbe wa kiroho, si sanamu au miungu ya uongo kwa maana ya jumla tu. “Mashetani” huhifadhi dai la ulimwengu wa kiroho bila kuongeza maelezo ya kimafundisho yasiyomo katika mstari.
- issue: Kibainishi katika לַשֵּׁדִים
  choice: kwa mashetani
  alternative: kwa wale mashetani
  rationale: Kiebrania kina kibainishi kilichounganishwa na kihusishi, lakini Kiswahili cha kawaida hakihitaji kukionyesha hapa. Mbadala wenye “wale” umewekwa katika tanbihi ili kuhifadhi uwezekano huo bila kufanya matini kuu kuwa nzito.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Waliwatoa ... kuwa dhabihu” ni wazi kwa wasomaji wa kawaida na huhifadhi maana ya kiibada ya kitenzi; “wana wao na binti zao” hudumisha muundo wenye msisitizo wa matini ya Kiebrania.
