  variant: Standard East African Swahili
source:
  edition: WLC
  text: הוֹשִׁיעֵ֨/נוּ יְה֘וָ֤ה אֱלֹהֵ֗י/נוּ וְ/קַבְּצֵ/נוּ֮ מִֽן הַ/גּ֫וֹיִ֥ם לְ֭/הֹדוֹת לְ/שֵׁ֣ם קָדְשֶׁ֑/ךָ לְ֝/הִשְׁתַּבֵּ֗חַ בִּ/תְהִלָּתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/047.yaml
  text: Save us[a], O Yahweh our God, and gather us from among the nations[b], that we may give thanks to your holy name and glory in your praise.
translation:
  language: sw
  text: Ee Yahweh, Mungu wetu, utuokoe na utukusanye kutoka miongoni mwa mataifa, ili tupate kulishukuru jina lako takatifu na kujivunia sifa zako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kushangilia kwa sababu ya sifa zako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעֵנוּ
  choice: utuokoe
  rationale: Kauli ya amri ya Hiphil yenye kiambishi cha nafsi ya kwanza wingi ni ombi la moja kwa moja la kuokolewa; ‘utuokoe’ ni ya kawaida na yenye uzito katika lugha ya sala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lenye herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Muundo wenye kiambishi cha nafsi ya kwanza wingi humaanisha moja kwa moja ‘Mungu wetu’.
- source_word: וְקַבְּצֵנוּ
  choice: na utukusanye
  rationale: Kauli ya amri ya Piel inaomba watu waliotawanyika wakusanywe pamoja.
- source_word: מִן הַגּוֹיִם
  choice: kutoka miongoni mwa mataifa
  rationale: Hueleza kwamba waombaji wametawanyika katikati ya mataifa na wanaomba watolewe humo.
- source_word: לְהוֹדוֹת
  choice: ili tulishukuru
  rationale: Kihusishi ל pamoja na kitenzi-jina kinaonyesha kusudi; hapa ידה katika Hiphil humaanisha kutoa shukrani.
- source_word: לְשֵׁם קָדְשֶׁךָ
  choice: jina lako takatifu
  rationale: Hifadhi mkazo wa Kiebrania juu ya jina na utakatifu wa Mungu kwa Kiswahili cha kawaida.
- source_word: לְהִשְׁתַּבֵּחַ
  choice: kujivunia
  rationale: Hitpael ya שׁבח ina maana ya kujisifu, kujivunia, au kufurahia kwa fahari; ‘kujivunia’ huhifadhi nguvu ya kujirejelea bila kudokeza mafanikio ya mwanadamu.
- source_word: בִּתְהִלָּתֶךָ
  choice: sifa zako
  rationale: Nomino תְּהִלָּה inaweza kumaanisha sifa au wimbo wa sifa; wingi wa kawaida wa Kiswahili ‘sifa zako’ unasikika kwa asili huku ukihifadhi nomino.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Andiko linatumia jina la agano moja kwa moja; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Maana ya לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ
  choice: kujivunia sifa zako
  alternative: kufurahia kwa shangwe sifa zako / kujisifu katika sifa zako
  rationale: Usemi unaonyesha furaha ya kujihusisha na sifa ya Mungu. ‘Kujivunia’ huhifadhi nguvu ya kitenzi, lakini tanbihi inaweka wazi uwezekano wa maana ya kushangilia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala. ‘Ee’ imetumiwa kuonyesha mwito wa moja kwa moja; mpangilio wa sentensi umehifadhi mfululizo wa ombi na makusudi mawili.
