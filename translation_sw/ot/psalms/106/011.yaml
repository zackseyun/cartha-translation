  yaml_path: translation/ot/psalms/106/011.yaml
  text: The waters covered their adversaries[b][a]; not one of them remained.
translation:
  language: sw
  text: Maji yakawafunika adui zao; hakuna hata mmoja wao aliyebaki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְכַסּוּ
  choice: yakawafunika
  rationale: Kitenzi כסה humaanisha ‘kufunika.’ Muundo huu unaonyesha kwa uwazi tendo la maji kuwafunika adui katika muktadha wa Bahari ya Shamu bila kuongeza tafsiri ya ‘kuwaangamiza.’
- source_word: מַיִם
  choice: Maji
  rationale: Nomino ya Kiebrania iko katika umbo la wingi lakini kwa Kiswahili ‘maji’ ndiyo nomino ya kawaida ya wingi na inafaa kwa maji ya bahari yanayorejelewa katika simulizi.
- source_word: צָרֵיהֶם
  choice: adui zao
  rationale: Neno צָר linaonyesha wapinzani wenye uhasama. ‘Adui zao’ ni tafsiri ya kawaida, ya sasa, na inayoeleweka kwa urahisi katika Kiswahili sanifu.
- source_word: אֶחָד מֵהֶם
  choice: hata mmoja wao
  rationale: Chini ya ukanushi, ‘hata mmoja wao’ huwasilisha kwa Kiswahili cha kawaida maana ya ‘mmoja kutoka kwao’ na kusisitiza kwamba hakubaki yeyote.
- source_word: לֹא נוֹתָר
  choice: hakuna ... aliyebaki
  rationale: Nifali ya יתר humaanisha kuachwa au kubaki. ‘Aliyebaki’ inadumisha msisitizo wa matini kwamba hakuna hata mmoja aliyeachwa, bila kutumia ‘aliyenusurika,’ ambalo lingekuwa la kufasiri zaidi.
