translation:
  language: sw
  text: Basi hasira ya Yahweh ikawaka dhidi ya watu wake, naye akaichukia sana urithi wake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: hasira ... ikawaka
  rationale: Nahau hii ya Kiebrania inaonyesha hasira kuwa moto au kuwaka. Kiswahili hiki kinahifadhi taswira hiyo kwa njia ya kawaida na yenye uzito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: בְּעַמּוֹ
  choice: dhidi ya watu wake
  rationale: Baada ya neno la hasira, kihusishi ב kinaonyesha walengwa wa hasira; ‘dhidi ya’ huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: וַיְתָעֵב
  choice: akachukizwa sana na
  rationale: Kitenzi תעב kina maana yenye nguvu ya kuchukia au kuona kuwa kitu ni cha kuchukiza. ‘Akachukizwa sana na’ ni lugha ya sasa yenye uzito bila kuwa ngumu kwa msomaji wa kawaida.
- source_word: נַחֲלָתוֹ
  choice: urithi wake
  rationale: ‘Urithi’ huhifadhi maana ya fungu au milki aliyojichagulia na pia dokezo la agano kuhusu Israeli kuwa mali ya Yahweh.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja; kutumia ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Lugha ya kibinadamu kuhusu hasira ya Mungu
  choice: hasira ya Yahweh ikawaka
  alternative: Yahweh akawakasirikia
  rationale: Tafsiri iliyochaguliwa inadumisha taswira ya Kiebrania ya joto au kuwaka kwa hasira, bila kuifafanua au kuipunguza kitheolojia.
- issue: Israeli kama urithi wa Yahweh
  choice: urithi wake
  alternative: mali yake
  rationale: ‘Urithi’ huhifadhi lugha ya agano ya נחלה na mvutano wa kwamba Yahweh anachukizwa na watu ambao bado wanaitwa urithi wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi na taswira ya hasira inayowaka zimehifadhiwa bila lugha ya kizamani.
