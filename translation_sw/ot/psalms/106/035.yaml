lexical_decisions:
- source_word: וַיִּתְעָרְבוּ
  choice: walichangamana
  rationale: Kitenzi hiki katika hitpael kinaonyesha kuchanganyika au kushirikiana kwa karibu na watu wengine. “Walichangamana” ni Kiswahili cha kawaida kinachohifadhi wazo la mchanganyiko wa kijamii bila kuongeza dhana ya kujitia unajisi.
- source_word: בַגּוֹיִם
  choice: na mataifa
  rationale: גּוֹיִם hapa ni mataifa au jamii za watu waliowazunguka Waisraeli. “Na mataifa” linaendana kiasili na kitenzi “walichangamana”; “watu wa mataifa” lingeongeza maneno yasiyohitajika.
- source_word: וַיִּלְמְדוּ
  choice: wakajifunza
  rationale: Qal hii ina maana tendaji ya kujifunza. “Wakajifunza” linaonyesha kwamba walichukua mwenendo huo, bila kuwafanya waonekane kuwa wapokeaji tu wa mafundisho.
- source_word: מַעֲשֵׂיהֶם
  choice: matendo yao
  rationale: Maana ya msingi ni “matendo” au “kazi.” Katika muktadha huu inahusu pia desturi na mwenendo wa mataifa; tafsiri ya moja kwa moja “matendo yao” inahifadhi upana wa neno la Kiebrania, huku tanbihi ikifafanua matumizi yake hapa.
theological_decisions:
- issue: Uzito wa kimaadili na kidini wa kuchangamana kwa Israeli na mataifa
  choice: Kutaja kwamba walichangamana na mataifa na kujifunza matendo yao, huku hukumu hasi ikiachwa itokane na muktadha.
  alternative: Kutumia lugha isiyo na uzito kama “waliishi miongoni mwa mataifa,” au lugha kali zaidi kama “walijitia unajisi kwa mataifa.”
  rationale: Kiebrania kinataja kuchangamana na kujifunza; muktadha mpana wa zaburi ndio unaoonyesha ubaya wa jambo hilo. Tafsiri haipaswi kuongeza wala kupunguza hukumu iliyomo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Bali” linaendeleza utofautishaji na mstari uliotangulia, na muundo “wakajifunza” unaonyesha mfuatano wa matukio kwa ufasaha.
