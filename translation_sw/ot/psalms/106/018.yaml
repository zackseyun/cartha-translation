translation:
  language: sw
  text: Moto ukawaka[a] katika kusanyiko lao[b]; mwali ukawateketeza waovu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukalipuka”; kitenzi cha Kiebrania kinaweza kukazia kuanza au kuzuka kwa moto.
    reason: lexical_alternative
  - marker: b
    text: Au, “ndani ya jumuiya yao”; neno la Kiebrania humaanisha kundi la watu waliokusanyika.
    reason: lexical_alternative
  - marker: c
    text: Au, “ukawaunguza kabisa”; kitenzi cha Kiebrania huonyesha kuungua kwa nguvu na kwa uharibifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְעַר
  choice: ukawaka
  rationale: Kitenzi בער hapa kinaeleza moto kuwaka au kushika. “Ukawaka” ni Kiswahili cha kawaida kinachodumisha simulizi bila kuongeza kiwango cha ukali kisicholazimishwa na kitenzi chenyewe.
- source_word: אֵשׁ
  choice: Moto
  rationale: Maana ya msingi ya אֵשׁ ni moto; muktadha haudai maana ya mfano.
- source_word: בַּעֲדָתָם
  choice: katikati ya kusanyiko lao
  rationale: עֵדָה humaanisha jumuiya iliyokusanyika. “Kusanyiko lao” huhifadhi maana hiyo ya kundi, na “katikati ya” huonyesha kuwa moto ulizuka ndani ya kundi hilo.
- source_word: לֶהָבָה
  choice: mwali
  rationale: לֶהָבָה ni mwali au ulimi wa moto. “Mwali” ni neno la asili na la kishairi linalolingana na “moto” katika mstari wa kwanza.
- source_word: תְּלַהֵט
  choice: ukawateketeza
  rationale: Kitenzi להט katika muundo huu huonyesha kuunguza kwa nguvu na kwa uharibifu. “Ukawateketeza” huwasilisha matokeo hayo kwa Kiswahili cha kawaida.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Kivumishi hiki kilichotumiwa kama nomino humaanisha watu waovu. “Waovu” ni kifupi, cha kawaida, na hakiongezi jinsia isiyotajwa katika Kiebrania.
theological_decisions:
- issue: Kinachorejelewa na lugha ya hukumu
  choice: Mstari unaeleza moto halisi uliowapata waovu ndani ya kusanyiko lao, bila kupanua kauli kuwa fundisho la jumla.
  alternative: Kuichukulia picha ya moto kama sitiari ya jumla ya hukumu.
  rationale: Muktadha wa Zaburi 106 unakumbuka matukio ya kihistoria ya uasi na hukumu. Maneno ya Kiebrania yanatumia picha halisi ya moto, kwa hiyo tafsiri haiifanyi kuwa fumbo wala kuongeza maelezo ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo sambamba wa “Moto …; mwali …” umehifadhiwa.
