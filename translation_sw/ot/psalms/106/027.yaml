  - marker: b
    text: Au, “katika nchi”; kihalisi, “katika nchi mbalimbali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהַפִּיל
  choice: na kuwaangusha
  rationale: Kitenzi cha Kiebrania kiko katika kausativi na maana yake ya msingi ni ‘kusababisha waanguke.’ ‘Kuwaangusha’ huhifadhi maana hiyo bila kuibana kuwa kuwaua au kuwashinda vitani.
- source_word: זַרְעָם
  choice: wazao wao
  rationale: Ingawa maana halisi ya זֶרַע ni ‘mbegu,’ hapa neno hilo linamaanisha watu wanaotokana nao. ‘Wazao wao’ ni Kiswahili cha kawaida na chenye heshima kinachohifadhi wazo la ukoo.
- source_word: בַּגּוֹיִם
  choice: kati ya mataifa
  rationale: גּוֹיִם hapa ni mataifa ya kigeni ambako wazao wao wangetawanywa. ‘Mataifa’ huepuka kuingiza maana za baadaye zinazoweza kuambatana na ‘Mataifa’ kama istilahi ya kidini, huku ‘kati ya’ ikionyesha kuwa wangekuwa miongoni mwao.
- source_word: וּלְזָרוֹתָם
  choice: na kuwatawanya
  rationale: זרה inaweza kumaanisha kupepeta au kutawanya. Katika usambamba huu wa hukumu na kupelekwa ugenini, ‘kuwatawanya’ ndiyo maana inayolingana vizuri na mahali mbalimbali yanayotajwa.
- source_word: בָּאֲרָצוֹת
  choice: katika nchi mbalimbali
  rationale: Wingi wa אֶרֶץ unarejelea nchi kadhaa. ‘Katika nchi mbalimbali’ ni usemi wa asili wa Kiswahili unaowasilisha mtawanyiko mpana bila kudokeza maeneo mahususi.
theological_decisions:
- issue: Aina ya hukumu inayotajwa
  choice: Mstari unaeleza hukumu iliyowapata wazao wao kwa kuangushwa kati ya mataifa na kutawanywa katika nchi mbalimbali.
  alternative: Kishazi cha kwanza kinaweza kueleweka kwa maana mahususi zaidi ya kuwaua au kuwashinda wazao wao kati ya mataifa.
  rationale: Kausativi ya נפל ina maana pana kuliko kifo pekee. Kwa kuwa kishazi kinachofuata kinazungumzia kutawanywa, tafsiri imehifadhi wazo pana la kuangushwa bila kulifanya kwa lazima kuwa kuuawa au kushindwa vitani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa vitenzi vya kutenda umehifadhi uhusiano wake na kiapo kilichotajwa katika muktadha uliotangulia.
