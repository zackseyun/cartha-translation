  text: and to make their offspring fall among the nations[b][a], and to scatter them through the lands.
translation:
  language: sw
  text: na kuwaangusha wazao wao[a] miongoni mwa mataifa, na kuwatawanya katika nchi mbalimbali.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vizazi vyao”; kihalisi, “mbegu yao.”
