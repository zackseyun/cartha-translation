base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/044.yaml
  text: Yet he saw their distress when he heard their cry,[a]
translation:
  language: sw
  text: Lakini aliona dhiki yao, aliposikia kilio chao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Naye aliona dhiki iliyowapata, aliposikia kilio chao.”
