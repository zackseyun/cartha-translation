lexical_decisions:
- source_word: וַיַּרְא
  choice: aliona
  rationale: Kitenzi ראה katika mtiririko wa simulizi kimsingi ni ‘aliona’; hapa pia kinadokeza kuwa Mungu aliitambua na kuijali hali yao, bila kuacha nahau ya Kiebrania.
- source_word: בַּצַּר לָהֶם
  choice: dhiki yao
  rationale: צַר hueleza hali ya taabu au dhiki, na לָהֶם huifanya maana iwe ‘dhiki iliyowapata’ au kwa Kiswahili cha kawaida, ‘dhiki yao.’
- source_word: בְּשָׁמְעוֹ
  choice: aliposikia
  rationale: ב pamoja na jina-kitenzi huanzisha kishazi cha wakati; ‘aliposikia’ ni tafsiri ya asili na yenye kueleweka kwa urahisi.
- source_word: רִנָּתָם
  choice: kilio chao
  rationale: רִנָּה inaweza kuwa sauti kubwa ya furaha au ya kuomba msaada; katika muktadha wa dhiki, ‘kilio’ huwasilisha ombi lao la haraka bila kudokeza furaha.
- source_word: וַ
  choice: Lakini
  rationale: Ingawa וַ kwa kawaida ni ‘na,’ hapa mtiririko unatofautisha uasi na mateso yaliyotangulia na mwitikio wa Mungu wenye rehema; ‘Lakini’ huonyesha ulinganuzi huo bila kuongeza wazo jipya.
theological_decisions:
- issue: Nguvu ya kiunganishi cha mwanzo katika muktadha wa rehema baada ya hukumu
  choice: Maana ya ulinganuzi imetafsiriwa ‘Lakini’
  alternative: Kiunganishi cha kawaida ‘Naye’ au mfuatano ‘Ndipo’
  rationale: Waw ya Kiebrania inaweza kutafsiriwa ‘na,’ lakini muktadha unaonyesha mwitikio wa Mungu wenye rehema licha ya uasi na mateso yaliyotangulia. ‘Lakini’ huhifadhi mvutano kati ya hukumu na rehema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Dhiki’ ni neno la sasa lenye uzito unaofaa kwa zaburi; muundo mbadala katika tanbihi huhifadhi kwa karibu zaidi לָהֶם kama ‘iliyowapata.’
