base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/029.yaml
  text: They provoked him to anger by their deeds[a], and a plague broke out among them.
translation:
  language: sw
  text: Walimkasirisha kwa matendo yao, na tauni ikazuka miongoni mwao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכְעִיסוּ
  choice: Walimkasirisha
  rationale: Hifili ya כעס ina maana ya kumsababisha mtu akasirike au kumchokoza hadi hasira. Kiambishi cha yambwa '-m-' kinamrejelea Mungu kutokana na muktadha, ingawa yambwa huyo hajatajwa wazi katika kishazi cha Kiebrania.
- source_word: בְּמַעַלְלֵיהֶם
  choice: kwa matendo yao
  rationale: מַעֲלָלִים humaanisha matendo au vitendo, hapa yakiwa na uzito wa kimaadili; ב inaonyesha njia au sababu iliyotumiwa.
- source_word: וַתִּפְרָץ
  choice: ikazuka
  rationale: Kitenzi פרץ huonyesha kutokea kwa ghafla au kufumuka; 'ikazuka' ni Kiswahili cha kawaida kwa mwanzo wa tauni na huhifadhi wazo la kutokea kwa nguvu.
- source_word: בָּם
  choice: miongoni mwao
  rationale: בָּם hapa inaonyesha kuwa tauni ilitokea ndani ya kundi hilo; 'miongoni mwao' ni usemi wa kawaida na haiongezi maana ya 'dhidi yao' isiyolazimishwa na maandishi.
- source_word: מַגֵּפָה
  choice: tauni
  rationale: מַגֵּפָה ni pigo hatari au maradhi ya kuua katika hukumu. 'Tauni' ni neno fupi, linaloeleweka, na linalofaa katika muktadha huu wa kihistoria.
theological_decisions:
- issue: Yambwa wa kimungu ambaye hakutajwa wazi baada ya וַיַּכְעִיסוּ
  choice: Kiambishi '-m-' katika 'walimkasirisha' kinamrejelea Mungu kwa mujibu wa muktadha.
  alternative: Walichochea hasira kwa matendo yao; au Walimkasirisha Mungu kwa matendo yao.
  rationale: Kiebrania hakitaji yambwa wazi, lakini muktadha unamhusu Mungu kama aliyechokozwa. Kiambishi '-m-' kinatoa Kiswahili cha kawaida bila kuongeza jina la Mungu ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya kishairi; 'walimkasirisha' huwasilisha nguvu ya kisababishi ya kitenzi cha Kiebrania, huku 'ikazuka miongoni mwao' ikihifadhi picha ya tauni kutokea ghafla ndani ya jamii.
