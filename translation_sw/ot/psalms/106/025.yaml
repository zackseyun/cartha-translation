base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/025.yaml
  text: So they grumbled in their tents[b][a]; they did not listen to the voice of Yahweh.
translation:
  language: sw
  text: Wakanung’unika katika mahema yao[a]; hawakuisikiliza sauti ya Yahwe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wakalalamika kwa sauti ya chini.” Kitenzi cha Kiebrania huonyesha manung’uniko yanayotokana na kutoridhika.
    reason: lexical_alternative
  - marker: b
    text: Au, “hawakuitii sauti ya Yahwe.” Nahau ya Kiebrania “kusikiliza sauti” inaweza pia kumaanisha kuitikia au kutii.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרָגְנוּ
  choice: Wakanung’unika
  rationale: Kitenzi רגן kinaonyesha kunung’unika kwa kutoridhika. ‘Kunung’unika’ ni Kiswahili cha kawaida kinachohifadhi wazo la malalamiko yanayotolewa kwa sauti ya chini; kiunganishi וַ־ kimewakilishwa kwa mtiririko wa simulizi katika umbo la ‘waka-’.
- source_word: בְאָהֳלֵיהֶם
  choice: katika mahema yao
  rationale: אֹהֶל humaanisha hasa ‘hema’; picha halisi ya makao ya jangwani imehifadhiwa badala ya kutumia neno la jumla kama ‘makao’.
- source_word: לֹא שָׁמְעוּ
  choice: hawakuisikiliza
  rationale: שׁמע pamoja na בְּקוֹל inaweza kumaanisha kusikia kwa makini, kuitikia, au kutii. ‘Hawakuisikiliza’ huhifadhi taswira ya kusikiliza bila kuficha maana inayodokezwa ya kutotii.
- source_word: בְּקוֹל
  choice: sauti ya
  rationale: Tafsiri hii huhifadhi nahau na taswira ya Kiebrania ‘kusikiliza sauti ya,’ badala ya kuifafanua moja kwa moja kuwa ‘amri ya’.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kwa umbo la Kiswahili ‘Yahwe,’ badala ya kubadilishwa kuwa cheo kama ‘BWANA.’
theological_decisions:
- issue: Maana ya nahau לֹא שָׁמְעוּ בְּקוֹל
  choice: hawakuisikiliza sauti ya Yahwe
  alternative: hawakuitii sauti ya Yahwe
  rationale: Tafsiri kuu huhifadhi taswira ya Kiebrania na pia inaweza kueleweka kuwa hawakuitikia; tanbihi inaonyesha kwa uwazi maana inayowezekana ya kutotii bila kuondoa mvutano wa kileksika.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu, hivyo limetoholewa badala ya kubadilishwa kwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mahema’ huhifadhi mazingira halisi ya jangwani; ‘kunung’unika’ ni la kawaida na linafaa kwa malalamiko ya kutoridhika.
