  text: He remembered his covenant for their sake[a], and relented according to the abundance of his steadfast love.
translation:
  language: sw
  text: Akakumbuka agano lake kwa ajili yao, akaghairi[a] kwa kadiri ya wingi wa upendo wake wa kudumu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akabadili nia yake” au “akawahurumia.” Kitenzi cha Kiebrania kinaweza kumaanisha kughairi uamuzi au kusukumwa na huruma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: Akakumbuka
  rationale: Neno זכר katika muktadha wa agano humaanisha kukumbuka kwa namna inayoongoza kwenye tendo kulingana na ahadi ya awali, si kukumbuka kiakili tu. “Akakumbuka” ni tafsiri wazi na ya kawaida inayohifadhi mwangwi wa agano.
- source_word: לָהֶם
  choice: kwa ajili yao
  rationale: Kihusishi ל pamoja na kiambishi hapa kinaonyesha kuwa alilikumbuka agano kuhusiana nao na kwa manufaa yao. “Kwa ajili yao” ni Kiswahili cha kawaida kuliko tafsiri ya moja kwa moja “kwao.”
- source_word: בְּרִיתוֹ
  choice: agano lake
  rationale: בְּרִית ni neno la kawaida la kibiblia kwa ahadi au uhusiano rasmi wa agano; “agano lake” huhifadhi uzito huo kuliko “mkataba wake.”
- source_word: וַיִּנָּחֵם
  choice: akaghairi
  rationale: Nifali ya נחם inaweza kumaanisha kughairi, kubadili nia au kusukumwa na huruma. “Akaghairi” huonyesha mabadiliko halisi katika jinsi Mungu alivyowatendea bila kufafanua kupita kiasi chanzo au asili ya mabadiliko hayo.
- source_word: כְּרֹב
  choice: kwa kadiri ya wingi wa
  rationale: Muundo כ pamoja na רֹב unaonyesha kipimo au uwiano. “Kwa kadiri ya wingi wa” huhifadhi wazo hilo ingawa ni usemi wenye hadhi ya kishairi.
- source_word: חסדו
  choice: upendo wake thabiti
  rationale: חסד huunganisha upendo wa neema na uaminifu wa kudumu katika uhusiano. “Upendo wake thabiti” huhifadhi vipengele hivyo vizuri kuliko “rehema,” ambalo ni finyu zaidi.
theological_decisions:
- issue: Lugha inayomwelezea Mungu kwa hisia na tendo la kibinadamu katika וַיִּנָּחֵם
  choice: akaghairi
  alternative: akabadili nia yake; akawahurumia
  rationale: Kiebrania kinaeleza mabadiliko halisi katika matendo ya Mungu kwa watu baada ya kulikumbuka agano. “Akaghairi” huhifadhi mvutano huo bila kudokeza moja kwa moja kwamba Mungu alipata habari mpya au kwamba alikuwa amekosea. Tanbihi inaonyesha maana nyingine halali za kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo “kwa kadiri ya wingi wa” umehifadhiwa ili kuonyesha kipimo kilicho katika Kiebrania; tanbihi imewekwa baada ya “akaghairi,” ambako utata wa kimsamiati unatokea.
