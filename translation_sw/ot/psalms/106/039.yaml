  text: Hivyo wakawa najisi kwa matendo yao, nao wakafanya ukahaba[a] kwa mwenendo wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakawa wasio waaminifu kwa matendo yao.” Kiebrania kinatumia taswira ya ukahaba kueleza kutokuwa waaminifu kimaadili na kwa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטְמְאוּ
  choice: wakawa najisi
  rationale: Kitenzi טמא hapa kinaeleza kuingia katika hali ya unajisi bila kutaja mtendaji wa nje; “wakawa najisi” huhifadhi maana hiyo ya matokeo kwa Kiswahili cha kawaida.
- source_word: בְּמַעֲשֵׂיהֶם
  choice: kwa matendo yao
  rationale: מַעֲשֶׂה humaanisha tendo au kazi, na kihusishi ב hapa kinaweza kueleza njia au sababu; “kwa matendo yao” ni sahihi na ya asili.
- source_word: וַיִּזְנוּ
  choice: wakajifanya makahaba
  rationale: זנה hubeba taswira dhahiri ya ukahaba, mara nyingi ikitumika kwa njia ya sitiari kuhusu kutokuwa waaminifu kwa agano. Tafsiri hii huhifadhi taswira badala ya kuibadili moja kwa moja kuwa ufafanuzi.
- source_word: בְּמַעַלְלֵיהֶם
  choice: kwa maovu yao
  rationale: מַעֲלָל ni matendo au mienendo, mara nyingi yenye rangi hasi ya kimaadili. “Maovu yao” hutoa utofauti wa kishairi na “matendo yao” na kuwasilisha mwelekeo huo hasi, ingawa ni tafsiri yenye ufafanuzi kiasi.
theological_decisions:
- issue: Iwapo זנה ifafanuliwe moja kwa moja kuwa kutokuwa waaminifu kwa agano au taswira yake ya kingono ihifadhiwe
  choice: Kuhifadhi sitiari katika matini kuu kwa kusema “wakajifanya makahaba”
  alternative: hawakuwa waaminifu
  rationale: Katika muktadha, usemi unaelekea kwa uasi na ibada ya sanamu, lakini Kiebrania kinatumia kwa makusudi taswira ya ukahaba. Kuihifadhi huacha mvutano wa kimaana na wa kiteolojia wa chanzo, huku tanbihi ikitoa maana mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Najisi” ni neno la kawaida katika muktadha wa kidini; “wakajifanya makahaba” huhifadhi sitiari kali ya Kiebrania bila kutumia lugha ya kizamani.
