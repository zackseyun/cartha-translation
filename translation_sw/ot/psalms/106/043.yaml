  text: Many times he delivered them[b][a], but they were rebellious in their counsel, and they were brought low by their iniquity.
translation:
  language: sw
  text: Mara nyingi aliwaokoa, lakini wao waliasi katika shauri lao[a], nao wakashushwa kwa sababu ya uovu wao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliasi kwa shauri lao,” au “katika mpango wao.” Neno la Kiebrania linaweza kumaanisha shauri, mpango, au kusudi; uhusiano wake na tendo la kuasi unaweza kueleweka kwa namna tofauti.
    reason: lexical_alternative
  - marker: b
    text: Au, “wakadidimia,” au “wakadhoofika kwa sababu ya uovu wao.” Kitenzi cha Kiebrania kinaweza kuonyesha kushushwa, kudidimia, au kudhoofika; na “uovu” pia linaweza kumaanisha hatia au matokeo yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּעָמִים רַבּוֹת
  choice: Mara nyingi
  rationale: Hueleza matukio mengi yaliyotokea tena na tena; ni usemi wa kawaida wa Kiswahili unaohifadhi wazo la kurudiwa.
- source_word: יַצִּילֵם
  choice: aliwaokoa
  rationale: Kitenzi נצל katika Hifili humaanisha kuokoa au kukomboa kutoka hatarini; “aliwaokoa” ni cha asili na hakiongezi maana isiyomo katika mstari.
- source_word: וְהֵמָּה
  choice: lakini wao
  rationale: Kiwakilishi huru kinasisitiza tofauti kati ya wokovu wa Mungu na mwitikio wao wa uasi.
- source_word: יַמְרוּ
  choice: waliasi
  rationale: מרה ni kitenzi cha kuasi au kukaidi. “Waliasi” huhifadhi umbo la kitendo la Kiebrania bila kuamua kwamba ni tukio moja tu.
- source_word: בַעֲצָתָם
  choice: kwa kufuata shauri lao wenyewe
  rationale: עֵצָה inaweza kuwa shauri, mpango, au kusudi. Nyongeza ya “kufuata” hufanya uhusiano wa kisintaksia uwe wa kawaida kwa Kiswahili huku tanbihi ikihifadhi upana wa maana.
- source_word: וַיָּמֹכּוּ
  choice: wakashushwa chini
  rationale: מוך huonyesha kuwa chini, kudidimia, au kudhoofika. Kauli hii huhifadhi matokeo ya kushushwa bila kuyafafanua kupita kiasi.
- source_word: בַּעֲוֺנָם
  choice: kwa sababu ya uovu wao
  rationale: עָוֹן inaweza kumaanisha uovu, hatia, au adhabu inayotokana na hatia. “Kwa sababu ya uovu wao” huhifadhi uzito wa kimaadili na maana ya kisababishi.
theological_decisions:
- issue: Mtendaji wa kuokoa
  choice: Kiima kimeonyeshwa kwa “ali-” bila kutaja jina la Mungu katika mstari huu.
  alternative: BWANA aliwaokoa.
  rationale: Kiebrania kina kiima cha nafsi ya tatu umoja bila kurudia jina la Mungu; muktadha wa zaburi humtambulisha wazi kuwa Mungu.
- issue: Maana ya עָוֹן
  choice: uovu wao
  alternative: hatia yao
  rationale: “Uovu” huhifadhi uzito wa kimaadili, huku tanbihi ikitambua kwamba neno la Kiebrania linaweza pia kuelekeza kwenye hatia au matokeo yake.
- issue: Uhusiano kati ya uasi na shauri lao
  choice: waliasi kwa kufuata shauri lao wenyewe
  alternative: waliasi katika shauri lao
  rationale: Kiswahili cha kawaida huhitaji uhusiano huu kuwekwa wazi kiasi, lakini tanbihi inaacha wazi kama shauri lenyewe lilikuwa la uasi au kama waliasi kupitia mpango wao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi bila kuwa kigumu. Muundo unadumisha tofauti iliyosisitizwa na “lakini wao” na mfuatano wa kuokolewa, kuasi, kisha kushushwa.
