  text: Waliubadilisha utukufu wao[a] kwa mfano wa ng’ombe[b] anayekula majani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu wao mtukufu.” Kiebrania kinasema kihalisi “utukufu wao,” usemi wa heshima unaomrejelea Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au, “fahali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמִירוּ
  choice: Wakaubadilisha ... kwa
  rationale: Kitenzi מוּר kinaonyesha kubadilisha kitu kimoja na kingine. Muundo wa Kiswahili ‘kubadilisha X kwa Y’ unaonyesha kwamba waliuacha utukufu wao na badala yake wakachukua sanamu.
- source_word: כְּבוֹדָם
  choice: utukufu wao
  rationale: Hili ndilo neno halisi la Kiebrania, na katika muktadha linamrejelea Mungu kwa namna ya heshima. Kulihifadhi bila kuongeza ‘Mungu’ kunadumisha usemi na mvutano wa maandishi ya asili.
- source_word: בְּתַבְנִית
  choice: kwa sanamu yenye umbo la
  rationale: תַּבְנִית linaweza kumaanisha umbo, mfano, au sura. Katika muktadha wa ibada ya sanamu, ‘sanamu yenye umbo la’ ni Kiswahili cha kawaida kinachoeleza wazi kilichochukua nafasi ya utukufu wao.
- source_word: שׁוֹר
  choice: ng’ombe
  rationale: שׁוֹר linaweza kumaanisha ng’ombe dume au ng’ombe wa kazi. ‘Ng’ombe’ ni neno pana na la kawaida; uwezekano wa ‘fahali’ umewekwa katika tanbihi.
- source_word: אֹכֵל עֵשֶׂב
  choice: anayekula majani
  rationale: Kirai cha Kiebrania chenye kitenzi-shirikishi kimetafsiriwa kwa kishazi tegemezi cha kawaida katika Kiswahili, huku kejeli ya kumwabudu mnyama alaye majani ikihifadhiwa.
theological_decisions:
- issue: Mrejelewa wa ‘utukufu wao’
  choice: Kuhifadhi usemi halisi ‘utukufu wao’ katika maandishi makuu
  alternative: ‘Mungu wao mwenye utukufu’
  rationale: Muktadha unaonyesha kuwa Mungu ndiye anayerejelewa, lakini Kiebrania kinatumia nomino dhahania ‘utukufu wao.’ Kutomtaja Mungu moja kwa moja kunahifadhi lugha ya kishairi na uzito wa kiteolojia wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Sanamu yenye umbo la’ ni wazi na ya asili kuliko tafsiri finyu ya neno kwa neno.
