  text: וַ֭/יַּקְצִיפוּ עַל מֵ֥י מְרִיבָ֑ה וַ/יֵּ֥רַע לְ֝/מֹשֶׁ֗ה בַּ/עֲבוּרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/032.yaml
  text: They provoked anger at the waters of Meribah[b][a], and it went badly for Moses because of them.
translation:
  language: sw
  text: Walichochea hasira kwenye maji ya Meriba[b][a], na kwa sababu yao mambo yakamwendea Musa vibaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Meriba maana yake ni “kugombana” au “ugomvi.”
    reason: cultural_note
  - marker: b
    text: Au, “Walimkasirisha kwenye maji ya Meriba.” Kiebrania hakimtaji wazi aliyekasirishwa katika mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְצִיפוּ
  choice: Walichochea hasira
  rationale: Kauli ya kisababishi ya קצף inaonyesha kusababisha hasira. Tafsiri hii haiweki wazi aliyekasirishwa, kwa kuwa mstari wa Kiebrania hautaji yambwa.
- source_word: עַל מֵי מְרִיבָה
  choice: kwenye maji ya Meriba
  rationale: עַל pamoja na kirai cha mahali au tukio hapa inaeleza mahali ambapo uchokozi ulitokea; “kwenye” ni Kiswahili cha kawaida na cha asili.
- source_word: מֵי מְרִיבָה
  choice: maji ya Meriba
  rationale: Meriba imehifadhiwa kama jina la mahali, huku muundo wa Kiebrania ukitafsiriwa moja kwa moja.
- source_word: וַיֵּרַע לְמֹשֶׁה
  choice: mambo yakamwendea Musa vibaya
  rationale: Kitenzi kinatoa maana ya matokeo mabaya yaliyompata Musa bila kusema kwamba Musa mwenyewe alikuwa mwovu; msemo huu ni wa kawaida katika Kiswahili cha sasa.
- source_word: בַּעֲבוּרָם
  choice: kwa sababu yao
  rationale: 'Kirai hiki kinaonyesha sababu: matokeo mabaya kwa Musa yalihusishwa na matendo ya watu.'
theological_decisions:
- issue: Asili ya matokeo mabaya yaliyompata Musa
  choice: Mstari unasema kwamba uchokozi wa watu uliambatana na matokeo mabaya kwa Musa, bila kufafanua hapa sababu yote ya kitheolojia.
  alternative: Kufafanua moja kwa moja ama kwamba mstari unazungumzia dhambi ya Musa, ama kwamba unasisitiza hatia ya watu pekee.
  rationale: Kiebrania kinasema tu kwamba mambo yalimwendea Musa vibaya kwa sababu yao. Tafsiri inahifadhi mvutano kuhusu uwajibikaji wa Musa na uchokozi wa watu badala ya kuutatua kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Walichochea hasira” huhifadhi kauli ya kisababishi na kutotajwa kwa aliyekasirishwa; “mambo yakamwendea Musa vibaya” huwasilisha matokeo mabaya kwa lugha ya kawaida bila kuongeza ufafanuzi wa kitheolojia.
