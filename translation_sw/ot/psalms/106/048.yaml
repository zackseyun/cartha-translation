  variant: Standard East African Swahili
source:
  edition: WLC
  text: בָּר֤וּךְ יְהוָ֨ה אֱלֹהֵ֪י יִשְׂרָאֵ֡ל מִן הָ֤/עוֹלָ֨ם וְ/עַ֬ד הָ/עוֹלָ֗ם וְ/אָמַ֖ר כָּל הָ/עָ֥ם אָמֵ֗ן הַֽלְלוּ יָֽהּ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/048.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. And let all the people say[b], “Amen!” Praise Yah!
translation:
  language: sw
  text: Yahwe, Mungu wa Israeli, ahimidiwe tangu milele hata milele! Watu wote waseme, “Amina!” Msifuni Yah![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Msifuni Yah.” Usemi huu pia hutoholewa kuwa “Haleluya,” au hutafsiriwa “Msifuni BWANA.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: asifiwe
  rationale: Katika kauli hii ya kumtukuza Mungu, neno hili linaeleza kutangazwa kwa sifa na baraka zake. “Asifiwe” ni usemi wa kawaida, wa heshima na unaofaa katika ibada ya Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama “BWANA.” Tahajia “Yahwe” ni ya kawaida na inayosomeka kwa urahisi katika Kiswahili.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Muundo huu unaonyesha wazi kwamba Yahwe ndiye Mungu wa Israeli; tafsiri hii ni sahihi na ya kawaida katika Kiswahili.
- source_word: מִן הָעוֹלָם וְעַד הָעוֹלָם
  choice: tangu milele hata milele
  rationale: Huhifadhi upeo wa wakati usio na mwisho wa kauli ya Kiebrania, kwa mtindo wa Kiswahili unaoeleweka na wenye uzito wa kiibada.
- source_word: וְאָמַר כָּל הָעָם
  choice: Watu wote na waseme
  rationale: Ingawa kitenzi kina umbo la qatal, katika muktadha huu ni mwito wa kiliturujia kwa kusanyiko kuitikia. “Na waseme” huhifadhi nguvu hiyo ya kuhimiza.
- source_word: אָמֵן
  choice: Amina
  rationale: Hili ndilo umbo la kawaida la mwitikio huu wa kiibada katika Kiswahili.
- source_word: הַלְלוּ יָהּ
  choice: Msifuni Yah
  rationale: Huhifadhi amri ya wingi “sifuni” na jina fupi la Mungu, Yah, badala ya kulificha kwa cheo au kulitohowa tu kama “Haleluya.”
theological_decisions:
- issue: Kutofautisha יְהוָה na umbo fupi יָהּ katika mstari mmoja
  choice: יְהוָה limetafsiriwa “Yahwe,” na יָהּ limetafsiriwa “Yah.”
  alternative: Kutumia “BWANA” kwa yote mawili, au kutumia “Yahwe” bila kutofautisha umbo fupi.
  rationale: Maandishi ya Kiebrania yanatumia jina kamili na kisha umbo lake fupi. Kuyatofautisha huhifadhi uchaguzi wa kimakusudi wa chanzo bila kuingiza msimamo wa dhehebu.
- issue: Nguvu ya וְאָמַר katika mwitikio wa watu
  choice: 'Imetolewa kama himizo: “Watu wote na waseme.”'
  alternative: 'Kutafsiri kama taarifa ya wakati uliopita: “Watu wote wakasema.”'
  rationale: Muktadha wa hitimisho la sifa unaunga mkono mwito wa kusanyiko kuitikia, huku umbo la Kiebrania likikubali mjadala wa kisarufi. Tafsiri imefuata kazi ya kiliturujia ya kauli hiyo.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kiibada lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umewekwa wa asili na wenye mdundo: tamko la sifa, mwito wa watu kuitikia, kisha amri ya mwisho ya kumsifu Mungu.'
