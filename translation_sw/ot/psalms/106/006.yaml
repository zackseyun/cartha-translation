  text: We have sinned with our fathers[a]; we have done wrong[b]; we have acted wickedly.
translation:
  language: sw
  text: Tumetenda dhambi pamoja na baba zetu[a]; tumefanya uovu[b]; tumetenda maovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja na mababu zetu.” Kiebrania ni “baba zetu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “tumetenda upotovu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאנוּ
  choice: tumetenda dhambi
  rationale: Kitenzi cha Kiebrania ni Qal timilifu nafsi ya kwanza wingi; hapa ni ungamo la pamoja la kutenda dhambi. Kiswahili cha wakati timilifu kinaonyesha matendo yaliyotendeka yenye umuhimu wa sasa.
- source_word: עִם
  choice: pamoja na
  rationale: Kihusishi hiki huonyesha ushirika au kuhusishwa pamoja; “pamoja na” huhifadhi mshikamano wa waungamaji na vizazi vilivyotangulia, badala ya kugeuza maana kuwa ulinganisho tu.
- source_word: אֲבוֹתֵינוּ
  choice: baba zetu
  rationale: Hii ndiyo tafsiri ya karibu ya neno la Kiebrania la kiume la ukoo. Kwa maana pana linaweza kurejelea mababu au wahenga, jambo lililoonyeshwa katika tanbihi.
- source_word: הֶעֱוִינוּ
  choice: tumefanya uovu
  rationale: Hiphil timilifu nafsi ya kwanza wingi ya עוה huonyesha kufanya yaliyo mabaya au kupotoka kimaadili. “Tumefanya uovu” ni ya kawaida, yenye uzito, na inaepuka istilahi nzito isiyo ya lazima.
- source_word: הִרְשָׁעְנוּ
  choice: tumetenda kwa uovu
  rationale: Hiphil timilifu nafsi ya kwanza wingi ya רשע huonyesha kutenda kwa namna ya uovu au kuwa na hatia. Usemi huu huhifadhi nguvu ya kitendo na kilele cha ungamo la vipengele vitatu, huku ukitofautishwa kwa kiasi na kishazi kilichotangulia.
theological_decisions:
- issue: Mshikamano wa pamoja katika ungamo
  choice: “pamoja na baba zetu”
  alternative: “kama baba zetu”
  rationale: עִם kwa kawaida humaanisha kuwa pamoja au kushirikiana, si kufanana tu. Tafsiri inahifadhi ungamo la jumuiya katika mwendelezo na vizazi vilivyotangulia bila kuingiza dai maalumu la kimafundisho lisilosemwa na mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisomo cha ibada. Muundo wa vishazi vitatu na urudiaji wa “tume-” umehifadhiwa ili kuonyesha ungamo la pamoja na msisitizo unaoongezeka.
