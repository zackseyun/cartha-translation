lexical_decisions:
- source_word: לִרְאוֹת
  choice: ili niione
  rationale: Kiambishi ל kwenye kitenzi-jina kinaendeleza kusudi la ombi la mstari uliotangulia; hali tegemezi ya Kiswahili huonyesha kusudi hilo kwa kawaida.
- source_word: בְּטוֹבַת
  choice: hali njema ya
  rationale: טוֹבָה hapa ni wema au ustawi unaofurahiwa na watu. “Hali njema” huepuka kuifanya dhana hii kuwa ustawi wa kiuchumi pekee, huku ikitoa Kiswahili cha kawaida.
- source_word: בְּחִירֶיךָ
  choice: wateule wako
  rationale: Neno hili linawataja wale ambao Mungu amewachagua. “Wateule wako” huhifadhi maana ya agano bila kuongeza mfumo wa kiteolojia wa baadaye.
- source_word: לִשְׂמֹחַ בְּשִׂמְחַת
  choice: nifurahie furaha ya
  rationale: Tafsiri hii huhifadhi ukaribu wa mzizi unaorudiwa katika Kiebrania na wazo la kushiriki katika furaha ya watu wa Mungu, bila kuwa ngumu katika Kiswahili.
- source_word: גּוֹיֶךָ
  choice: taifa lako
  rationale: Maana ya msingi ya גּוֹי ni “taifa”; hapa inasisitiza utambulisho wa pamoja wa Israeli. “Watu wako” ni mbadala unaowezekana na umeonyeshwa katika tanbihi.
- source_word: לְהִתְהַלֵּל
  choice: nijivunie
  rationale: Hitpaeli ya הלל inaweza kumaanisha kujisifu, kujivunia, au kutukuza kwa shangwe. Katika muktadha huu chanya, “nijivunie” huonyesha fahari ya kushiriki baraka za watu wa Mungu bila sauti hasi kali ya “nijisifu.”
- source_word: עִם
  choice: pamoja na
  rationale: 'Huonyesha ushirika: mwombaji anatamani kujivunia akiwa pamoja na watu wa Mungu.'
- source_word: נַחֲלָתֶךָ
  choice: urithi wako
  rationale: Hili ni neno la agano linalowaonyesha Israeli kama watu walio sehemu au mali ya Mungu. “Urithi wako” huhifadhi sitiari ya Kiebrania.
theological_decisions:
- issue: Kutofautisha majina matatu ya utambulisho wa watu wa agano
  choice: wateule wako ... taifa lako ... urithi wako
  alternative: watu wako ... watu wako ... milki yako
  rationale: Kiebrania kinakusanya majina matatu tofauti ya Israeli. Kuyahifadhi kunazuia kuyasawazisha kuwa usemi mmoja na hakupachiki maana ya kimadhehebu.
- issue: Maana chanya ya לְהִתְהַלֵּל
  choice: nijivunie
  alternative: nijisifu; nishangilie
  rationale: Kitenzi kinaweza kuhusisha kujisifu au kushangilia kwa fahari. “Nijivunie” huhifadhi mvutano huo kwa Kiswahili cha asili bila kudokeza kwamba mwombaji anajisifu kwa majivuno ya dhambi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo wa vipashio vitatu na marudio ya “furaha” umehifadhiwa kwa kadiri inayowezekana.
