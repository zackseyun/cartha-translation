  yaml_path: translation/ot/psalms/106/005.yaml
  text: that I may see the good of your chosen ones[a], rejoice in the joy of your nation[b], and glory with your inheritance.
translation:
  language: sw
  text: ili niione hali njema ya wateule wako, nifurahie furaha ya taifa lako[a], na nijivunie[b] pamoja na urithi wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wako.”
    reason: lexical_alternative
  - marker: b
    text: Au “nijisifu pamoja na urithi wako.”
