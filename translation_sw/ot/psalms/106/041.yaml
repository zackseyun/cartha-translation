base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/041.yaml
  text: He gave them into the hand of the nations[b][a], and those who hated them ruled over them.
translation:
  language: sw
  text: Akawatia mikononi mwa mataifa[a], nao waliowachukia wakawatawala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, chini ya mamlaka ya mataifa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנֵם
  choice: Akawatia
  rationale: Kitenzi נתן chenye kiambishi cha nafsi ya tatu wingi kina maana ya ‘akawatoa/akawatia’; pamoja na ‘mikononi mwa’ kinaonyesha kuwakabidhi chini ya mamlaka ya wengine bila kuongeza ufafanuzi usio katika maandishi.
- source_word: בְּיַד
  choice: mikononi mwa
  rationale: Hifadhi nahau ya Kiebrania ya ‘katika mkono wa’ kwa Kiswahili cha kawaida ‘mikononi mwa,’ ambayo pia hueleweka kuwa chini ya mamlaka au udhibiti wa mwingine.
- source_word: גּוֹיִם
  choice: mataifa
  rationale: ‘Mataifa’ ni tafsiri ya kawaida na isiyo na mzigo wa kimadhehebu kwa גּוֹיִם katika muktadha huu wa mataifa ya kigeni.
- source_word: וַיִּמְשְׁלוּ
  choice: wakawatawala
  rationale: Kitenzi משל humaanisha kutawala; ‘wakawatawala’ ni cha asili katika Kiswahili na kinahifadhi uhusiano wa mamlaka juu yao.
- source_word: שֹׂנְאֵיהֶם
  choice: waliowachukia
  rationale: Huhifadhi maana ya moja kwa moja ya umbo la kisifa, ‘wale waliowachukia,’ badala ya kulipanua kuwa neno la jumla zaidi ‘maadui.’
theological_decisions:
- issue: Utendaji wa Mungu katika hukumu ya Israeli
  choice: Kitenzi ‘Akawatia’ kinamweleza Mungu, ambaye ndiye mtendaji anayeendelea kutoka katika muktadha, kuwa aliwatia Israeli mikononi mwa mataifa.
  alternative: Kutafsiri kwa namna ya kulegeza kuwa Mungu aliruhusu tu waangukie chini ya mamlaka ya mataifa.
  rationale: Kiebrania kinatumia נתן kwa tendo la moja kwa moja la mhusika aliyedokezwa. Tafsiri inadumisha mvutano huo wa kiteolojia bila kuufifisha wala kuongeza maelezo zaidi ya andiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na lugha ya heshima lakini inayoeleweka kwa wasomaji wa kawaida. Nahau ‘mikononi mwa’ imehifadhiwa kwa kuwa ni ya kawaida na hubeba wazi wazo la mamlaka.
