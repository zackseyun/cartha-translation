base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/038.yaml
  text: They poured out innocent blood—the blood of their sons and daughters[c][b][a], whom they sacrificed to the idols of Canaan—and the land was polluted with blood.
translation:
  language: sw
  text: Walimwaga damu isiyo na hatia[a]—damu ya wana wao na binti zao, ambao waliwatoa dhabihu kwa sanamu za Kanaani—na nchi ilinajisiwa kwa damu.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Walimwaga damu ya wasio na hatia.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, neno “damu” hapa liko katika wingi; linaweza kumaanisha umwagaji damu au hatia ya damu.
    reason: lexical_alternative
  - marker: c
    text: Au, “nchi ilinajisiwa kwa hatia ya damu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁפְּכוּ
  choice: Walimwaga
  rationale: Kitenzi “kumwaga” kinahifadhi taswira halisi ya שׁפך na katika muktadha wa damu kinaeleweka kwa kawaida kuwa kuua kwa kumwaga damu.
- source_word: דָם נָקִי
  choice: damu isiyo na hatia
  rationale: Hiki ni kifungu cha kawaida cha Kiebrania kinachoeleza damu iliyomwagwa isivyo haki; tafsiri hii inahifadhi hukumu yake ya kimaadili.
- source_word: דַּם בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: damu ya wana wao wa kiume na wa kike
  rationale: Kurudiwa kwa “damu” kunafafanua wazi kwamba damu isiyo na hatia ni ya watoto wao; “wana wa kiume na wa kike” hudumisha utofautishaji wa בנים na בנות.
- source_word: אֲשֶׁר זִבְּחוּ
  choice: ambao waliwatoa dhabihu
  rationale: Kitenzi זבח katika muktadha huu ni cha ibada ya kutoa dhabihu, na kiwakilishi kinawarejelea wana wao.
- source_word: לַעֲצַבֵּי כְנָעַן
  choice: kwa sanamu za Kanaani
  rationale: עֲצַבִּים humaanisha sanamu za kuabudiwa, kwa kawaida ikiwa na dharau ya kimakusudi; “Kanaani” linaonyesha eneo na utamaduni unaorejelewa.
- source_word: וַתֶּחֱנַף
  choice: ikatiwa unajisi
  rationale: Kitenzi kinaonyesha kuchafuliwa kwa nchi kwa maana ya kimaadili na kidini, si uchafu wa kawaida tu.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Muktadha unaelekeza kwa nchi ya Kanaani, wala si dunia nzima.
- source_word: בַּדָּמִים
  choice: kwa damu
  rationale: Tafsiri hii inahifadhi kurudiwa kwa neno “damu” na umbo la Kiebrania, huku tanbihi ikionyesha maana zinazowezekana za umwagaji damu au hatia ya damu.
theological_decisions:
- issue: Hali ya kimaadili ya wahanga wa dhabihu ya watoto
  choice: Damu yao inaitwa wazi “damu isiyo na hatia.”
  alternative: damu ya wasio na hatia
  rationale: Hii inadumisha hukumu ya moja kwa moja ya Zaburi kuhusu mauaji hayo bila kuongeza maelezo ya kimadhehebu.
- issue: Namna nchi ilivyoathiriwa
  choice: Nchi ilitiwa unajisi kwa damu.
  alternative: Nchi ilinajisiwa kwa umwagaji damu au kwa hatia ya damu.
  rationale: Kiebrania kinaonyesha kwamba jeuri hiyo iliichafua nchi kwa maana nzito ya kimaadili na kidini; tafsiri kuu inahifadhi neno “damu,” huku tanbihi ikihifadhi upana wa wingi דמים.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kishairi na kurudiwa kwa “damu” vimehifadhiwa; “ikatiwa unajisi” hutoa uzito wa kimaadili na kidini wa kitenzi cha Kiebrania.
