  text: They did not destroy the peoples whom Yahweh had told them to destroy[a].
translation:
  language: sw
  text: Hawakuwaangamiza watu ambao Yahwe alikuwa amewaambia wawaangamize.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania, kihalisi: “Hawakuwaangamiza watu ambao Yahwe alisema kwao.” Maneno “wawaangamize” yameongezwa kwa sababu maudhui ya kauli yamedokezwa katika Kiebrania na yanaeleweka kutokana na muktadha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: hawaku-
  rationale: Kikanushi cha wakati uliopita kinaunganishwa kwa kawaida na kitenzi katika Kiswahili.
- source_word: הִשְׁמִידוּ
  choice: kuwaangamiza
  rationale: Hifili ya שׁמד ina maana ya kusababisha uharibifu au kuondolewa kabisa; “angamiza” ni neno la kawaida, lenye nguvu inayofaa bila kuongeza maelezo yasiyomo.
- source_word: אֶת הָעַמִּים
  choice: watu
  rationale: עַמִּים ni wingi unaorejelea makundi ya watu. Katika Kiswahili, “watu” ni ya asili na inaweza kuwakilisha makundi hayo katika muktadha huu; “mataifa” lingeweza kudokeza zaidi dola za kisiasa.
- source_word: אֲשֶׁר
  choice: ambao
  rationale: Kiwakilishi cha uhusiano kinapatana na ngeli ya “watu” na kurejelea watu kama yambwa.
- source_word: אָמַר
  choice: alikuwa amewaambia
  rationale: Kitenzi cha Kiebrania ni “alisema,” lakini pamoja na לָהֶם na kijalizo kilichoachwa kueleweka, “alikuwa amewaambia” hutoa Kiswahili cha kawaida na kuonyesha kuwa kauli ilitangulia kutokutii kwao, bila kutumia kitenzi chenye nguvu zaidi cha “kuamuru.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: לָהֶם
  choice: wa- katika “amewaambia”
  rationale: Kiwakilishi cha yambwa kisicho cha moja kwa moja kinawakilishwa kwa kawaida ndani ya kitenzi cha Kiswahili.
theological_decisions:
- issue: Kijalizo kilichodokezwa baada ya “Yahwe alikuwa amewaambia”
  choice: Kuongeza “wawaangamize” katika matini na kuweka tanbihi
  alternative: “Hawakuwaangamiza watu ambao Yahwe alisema nao”; au “watu ambao Yahwe alikuwa amewaambia habari zao”
  rationale: Kiebrania kinaishia kihalisi kwa wazo la “ambao Yahwe alisema kwao,” bila kutaja maudhui ya kusema. Kitenzi kilichotangulia na muktadha vinaonyesha kwamba agizo la kuwaangamiza ndilo linalodokezwa. Kiswahili kinahitaji kijalizo ili sentensi iwe wazi na ya kawaida, huku tanbihi ikihifadhi ufupi na utata wa muundo wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; jina “Yahwe” limehifadhiwa, na kijalizo kilichodokezwa kimewekwa wazi kwa tanbihi.
