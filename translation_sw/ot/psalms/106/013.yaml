  text: מִֽ֭הֲרוּ שָׁכְח֣וּ מַעֲשָׂ֑י/ו לֹֽא חִ֝כּ֗וּ לַ/עֲצָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/013.yaml
  text: They quickly forgot his works[a]; they did not wait for his counsel.
translation:
  language: sw
  text: Haraka walisahau matendo yake; hawakungoja shauri lake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mpango wake” au “kusudi lake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִהֲרוּ
  choice: Upesi
  rationale: Neno hili linaonyesha kasi au haraka. “Upesi wakasahau” ni Kiswahili cha kawaida kinachohifadhi wazo la kutenda kwa haraka, si tu kwamba jambo lilitokea baadaye.
- source_word: שָׁכְחוּ
  choice: wakasahau
  rationale: Kitenzi hiki ni cha wakati uliopita na humaanisha moja kwa moja “walisahau”; muundo wa “wakasahau” unaingia kwa kawaida katika usimulizi wa kishairi wa muktadha huu.
- source_word: מַעֲשָׂיו
  choice: matendo yake
  rationale: “Matendo” huhifadhi maana ya mambo ambayo Mungu alikuwa amefanya na kinafaa kwa lugha ya kibiblia iliyo wazi na yenye heshima.
- source_word: לֹא חִכּוּ
  choice: hawakungojea
  rationale: Muundo huu unatoa kwa kawaida maana ya kwamba hawakusubiri, huku ukihifadhi hali ya tendo lililopita.
- source_word: לַעֲצָתוֹ
  choice: shauri lake
  rationale: “Shauri” linaweza kumaanisha mwongozo, mpango, au kusudi, hivyo linahifadhi upana wa maana ya neno la Kiebrania bila kuibana kuwa fundisho maalumu kuhusu amri au azimio la Mungu.
theological_decisions:
- issue: Maana ya עֵצָה ya Mungu katika muktadha
  choice: shauri lake
  alternative: mpango wake; kusudi lake
  rationale: “Shauri lake” linahifadhi wazo la mwongozo au nia ya Mungu pamoja na uwezekano wa maana ya mpango au kusudi. Halitatui kimya kimya mvutano wa maandishi kwa kuchagua maana nyembamba zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya kishairi. Alama ya tanbihi imewekwa baada ya “shauri lake,” neno ambalo tanbihi inalifafanua.
