  text: וַֽ֭/יִּמְאֲסוּ בְּ/אֶ֣רֶץ חֶמְדָּ֑ה לֹֽא הֶ֝אֱמִ֗ינוּ לִ/דְבָרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/024.yaml
  text: Then they despised the pleasant land[b][a]; they did not believe his word.
translation:
  language: sw
  text: Ndipo wakaidharau nchi ya kupendeza; hawakuliamini neno lake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakulitumainia neno lake”; katika muktadha huu “neno lake” pia linaweza kueleweka kuwa “ahadi yake.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְאֲסוּ
  choice: Ndipo wakaidharau
  rationale: Kitenzi מאס kina maana ya kukataa au kudharau. “Wakaidharau” kinadumisha lawama kali ya mstari huu, huku “ndipo” kikionyesha mfuatano wa simulizi.
- source_word: בְּאֶרֶץ חֶמְדָּה
  choice: nchi ya kupendeza
  rationale: אֶרֶץ hapa ni nchi iliyoahidiwa, na חֶמְדָּה huonyesha kitu chenye kutamanika au kupendeza. Usemi huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: לֹא הֶאֱמִינוּ
  choice: hawakuliamini
  rationale: Hifili ya אמן inaweza kumaanisha kuamini au kutumainia. “Hawakuliamini” inaendana moja kwa moja na kitu chake, “neno lake,” bila kufafanua zaidi ya Kiebrania.
- source_word: לִדְבָרוֹ
  choice: neno lake
  rationale: דָּבָר inaweza kuwa neno, jambo, au ahadi. “Neno lake” linahifadhi upana wa asili, ingawa katika muktadha huu linaweza kurejelea ahadi ya Mungu kuhusu nchi.
theological_decisions:
- issue: Kama kutaja wazi kwamba “neno lake” ni ahadi ya Mungu kuhusu nchi
  choice: Kudumisha “neno lake” katika matini kuu
  alternative: ahadi yake
  rationale: Kiebrania kinasema kwa upana “neno lake.” Kutumia “ahadi yake” kunafaa kimuktadha lakini kunabana maana; kwa hiyo limehifadhiwa kama uwezekano katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nchi ya kupendeza” ni ya asili zaidi kuliko “nchi yenye kutamanika,” huku ikihifadhi wazo la חֶמְדָּה. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
