source:
  edition: WLC
  text: וַ/יִּשָּׂ֣א יָד֣/וֹ לָ/הֶ֑ם לְ/הַפִּ֥יל א֝וֹתָ֗/ם בַּ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/026.yaml
  text: So he raised his hand against them[a], to make them fall in the wilderness.
translation:
  language: sw
  text: Basi akainua mkono wake dhidi yao[a], ili awaangushe nyikani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaapa dhidi yao”; nahau ya Kiebrania “kuinua mkono” inaweza kumaanisha kuapa, hasa katika muktadha wa hukumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: akainua
  rationale: Kitenzi נשׂא humaanisha kuinua au kubeba. Tafsiri hii inadumisha taswira halisi ya Kiebrania bila kuamua kimya kimya kwamba tendo hilo lilikuwa kiapo.
- source_word: יָדוֹ
  choice: mkono wake
  rationale: Tafsiri ya moja kwa moja inadumisha nahau na taswira ya Kiebrania; katika muktadha, kiwakilishi kinamhusu Mungu.
- source_word: לָהֶם
  choice: dhidi yao
  rationale: Ingawa kihusishi kinaweza kuwa ‘kwao,’ katika muktadha wa hukumu kuinua mkono kunaelekezwa dhidi yao.
- source_word: לְהַפִּיל אֹתָם
  choice: ili awaangushe
  rationale: Hifili ya נפל ina maana sababishi, ‘kusababisha waanguke’; ‘awaangushe’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: בַּמִּדְבָּר
  choice: nyikani
  rationale: ‘Nyikani’ linafaa katika muktadha wa safari na hukumu ya Israeli jangwani, bila kulazimisha wazo la eneo lenye mchanga tu.
theological_decisions:
- issue: Nguvu ya kinahau ya ‘aliinua mkono wake’
  choice: Kudumisha nahau katika matini kuu na kueleza uwezekano wa kiapo katika tanbihi.
  alternative: akaapa dhidi yao
  rationale: Kauli hiyo huenda inaashiria kiapo rasmi cha hukumu cha Mungu, lakini Kiebrania hakitumii wazi kitenzi ‘kuapa.’ Kudumisha taswira kunalinda utata wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Basi’ linaonyesha mwendelezo wa simulizi; ‘nyikani’ linahifadhi muktadha wa kibiblia kwa lugha inayoeleweka.
