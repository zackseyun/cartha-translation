  text: So he saved them from the hand of the one who hated them[b][a], and redeemed them from the hand of the enemy.
translation:
  language: sw
  text: Akawaokoa[a] kutoka mkononi mwa yule aliyewachukia, akawakomboa[b] kutoka mkononi mwa adui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawatoa salama”; kitenzi cha Kiebrania kinaweza kumaanisha kuokoa kutoka hatarini.
    reason: lexical_alternative
  - marker: b
    text: “Akawakomboa” pia laweza kutafsiriwa “akawaokoa”; Kiebrania kina wazo la ukombozi au uokoaji kwa kuingilia kati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשִׁיעֵם
  choice: akawaokoa
  rationale: Kitenzi ישׁע hapa kinaeleza kuwaokoa kutoka hatarini au katika nguvu ya mtesi. “Akawaokoa” ni Kiswahili cha kawaida kinachohifadhi uzito wa tendo la Mungu la kuleta wokovu.
- source_word: מִיַּד
  choice: kutoka mkononi mwa
  rationale: Nahau hii ya Kiebrania humaanisha kutoka katika nguvu au mamlaka ya mtu. Taswira ya mkono inaeleweka katika Kiswahili na imehifadhiwa.
- source_word: שׂוֹנֵא
  choice: yule aliyewachukia
  rationale: Umbo la Kiebrania ni umoja na limetumiwa kama nomino. Tafsiri hii inadumisha umoja huo na wakati uliopita wa simulizi bila kulainisha maana kuwa wingi.
- source_word: וַיִּגְאָלֵם
  choice: akawakomboa
  rationale: Kitenzi גאל kina wazo la kudai tena au kuokoa kwa kuingilia kati. “Akawakomboa” huhifadhi tofauti yake na “akawaokoa” pamoja na mwangwi wake wa ukombozi.
- source_word: אוֹיֵב
  choice: adui
  rationale: Neno la Kiebrania ni umoja. Kiswahili hakina kibainishi sawa na “the,” na katika muktadha huu “adui” humrejelea adui huyo anayejulikana.
theological_decisions:
- issue: Iwapo vitenzi ישׁע na גאל viunganishwe kuwa wazo moja la jumla
  choice: Vimetafsiriwa tofauti kuwa “akawaokoa” na “akawakomboa.”
  alternative: Kutafsiri vyote kwa kitenzi kilekile cha jumla, kama “akawaokoa.”
  rationale: Mistari hii inatumia maneno mawili yanayohusiana lakini yenye vivuli tofauti vya maana. Kuyatofautisha kunahifadhi usambamba wa kishairi na mvutano kati ya wokovu kutoka hatarini na ukombozi kwa kuingilia kati, bila kuongeza dai la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nahau “kutoka mkononi mwa” imehifadhiwa kwa kuwa inaeleweka na inadumisha taswira ya Kiebrania. Umoja wa “yule aliyewachukia” na “adui” umehifadhiwa.
