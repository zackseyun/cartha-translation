  verdict: revise
  source_fidelity: 'Tafsiri inafuata kwa uaminifu maana ya Kiebrania: walifanya ndama huko Horebu na wakainama kwa heshima/ibada mbele ya sanamu ya kusubu. Hata hivyo, kiambishi -i- katika “wakaisujudia” huifanya nomino ‘sanamu’ kuwa kitu bainifu, ilhali Kiebrania kina ‘kwa/ mbele ya sanamu ya kusubu’ bila kiambishi hicho; “wakaisujudia sanamu ya kusubu” ni ya karibu zaidi na chanzo.'
  naturalness: “Huko Horebu” na “ndama” ni za kawaida. “Sanamu ya kusubu” inaeleweka katika rejista ya tafsiri ya Biblia, ingawa tanbihi ifafanue kwa lugha nyepesi kuwa ni sanamu iliyofanywa kwa metali iliyoyeyushwa. “Wakaisujudia” ni Kiswahili kinachowezekana, lakini “wakaisujudia sanamu” husikika kuwa sanamu hiyo tayari imetajwa; kuondoa -i- kunasomeka kwa kawaida zaidi hapa.
  terminology: Horebu, ndama, kusujudia, na sanamu ya kusubu vinadumisha istilahi na taswira ya kifungu. Hakuna haja ya kuongeza ‘wa dhahabu.’
  issues:
  - severity: low
    issue: Kiambishi cha yambwa katika “wakaisujudia”
    rationale: Kiambishi -i- hurejelea yambwa inayojulikana/iliyotajwa. Kwa kuwa ‘sanamu ya kusubu’ inaletwa baada ya kitenzi na Kiebrania haisemi kwa kiambishi bainifu, “wakaisujudia sanamu ya kusubu” ni sahihi zaidi na laini katika Kiswahili.
