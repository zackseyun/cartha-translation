base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/019.yaml
  text: They made a calf at Horeb and bowed down to a cast image[a][b].
translation:
  language: sw
  text: 'Walitengeneza ndama huko Horebu,

    wakaisujudia sanamu ya kusubu[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sanamu iliyotengenezwa kwa metali iliyoyeyushwa.” Neno la Kiebrania humaanisha hasa sanamu iliyoundwa kwa kusubu, kwa kawaida kwa metali.
    reason: lexical_alternative
  - marker: b
    text: Jambo hili linakumbusha ndama aliyetengenezwa huko Horebu/Sinai katika Kutoka 32.
    reason: cross_reference
lexical_decisions:
- source_word: יַעֲשׂוּ
  choice: Walitengeneza
  rationale: Kitenzi עשה humaanisha kwa kawaida ‘kufanya’ au ‘kutengeneza.’ ‘Walitengeneza’ ni cha kawaida katika muktadha wa kutengeneza kitu, bila kuongeza namna mahususi ya utengenezaji.
- source_word: עֵגֶל
  choice: ndama
  rationale: עֵגֶל humaanisha ndama au ng’ombe mchanga. ‘Ndama’ ni tafsiri ya moja kwa moja na inadumisha uhusiano na simulizi la Kutoka 32 bila kuongeza neno ‘wa dhahabu,’ ambalo halipo katika mstari huu.
- source_word: בְּחֹרֵב
  choice: huko Horebu
  rationale: Kihusishi בְּ kinaonyesha mahali. ‘Huko Horebu’ ni Kiswahili cha kawaida kinachotaja eneo la tukio.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: wakaisujudia
  rationale: Kitenzi שׁחה kinaonyesha kuinama au kujitupa chini kwa heshima au ibada. ‘Kusujudia’ huhifadhi tendo la kimwili pamoja na maana yake ya kuabudu katika muktadha huu.
- source_word: לְמַסֵּכָה
  choice: sanamu ya kusubu
  rationale: מַסֵּכָה ni sanamu iliyoundwa kwa kumimina kitu kilichoyeyushwa, kwa kawaida metali, ndani ya kalibu. ‘Sanamu ya kusubu’ huhifadhi maana hiyo mahususi kwa ufupi, badala ya kutumia ‘sanamu’ pekee.
theological_decisions:
- issue: Iwapo kitu hicho kitajwe wazi kuwa ‘ndama wa dhahabu’
  choice: Kutumia ‘ndama’ bila kuongeza ‘wa dhahabu.’
  alternative: ndama wa dhahabu
  rationale: Ingawa Kutoka 32 hueleza kuwa ndama huyo alitengenezwa kwa dhahabu, Zaburi 106:19 yenyewe inasema tu ‘ndama’ na ‘sanamu ya kusubu.’ Kuongeza ‘wa dhahabu’ kungeingiza maelezo kutoka muktadha mpana badala ya kutafsiri mstari huu kama ulivyo.
- issue: Iwapo וַיִּשְׁתַּחֲווּ itafsiriwe moja kwa moja kuwa ‘wakaabudu’
  choice: wakaisujudia
  alternative: wakaiabudu
  rationale: ‘Wakaisujudia’ huhifadhi tendo la kuinama lililotajwa na Kiebrania, huku muktadha ukiweka wazi kwamba tendo hilo lilikuwa ibada ya sanamu. Hivyo maana ya ibada haifichwi wala kuongezwa badala ya picha halisi ya kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. ‘Kusujudia’ ni neno la kawaida la kidini linalohifadhi tendo la kuinama; ‘sanamu ya kusubu’ ni fupi na sahihi, huku tanbihi ikifafanua mchakato kwa wasomaji wasioufahamu istilahi hiyo.
