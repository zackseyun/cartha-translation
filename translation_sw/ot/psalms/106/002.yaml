  text: Who can recount the mighty deeds of Yahweh[b][a], or proclaim all his praise?
translation:
  language: sw
  text: Ni nani awezaye kusimulia matendo makuu[a] ya Yahweh, na kutangaza sifa zake zote?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “matendo yenye nguvu ya Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “kuifanya sifa yake yote isikike.”
