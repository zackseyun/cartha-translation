lexical_decisions:
- source_word: מִי יְמַלֵּל
  choice: Ni nani awezaye kusimulia
  rationale: Swali la balagha linauliza ni nani mwenye uwezo wa kueleza matendo hayo kikamilifu. “Kusimulia” linafaa kwa tendo la kutaja au kueleza kwa maneno matendo ya Mungu.
- source_word: גְּבוּרוֹת
  choice: matendo makuu
  rationale: Nomino hii ya wingi hurejelea maonyesho halisi ya nguvu au uwezo; “matendo makuu” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi, si kubadilishwa kuwa cheo.
- source_word: יַשְׁמִיעַ
  choice: kutangaza
  rationale: Kwa maana halisi ni “kufanya isikike”; katika muktadha wa kutamka hadharani, “kutangaza” linatoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: כָּל תְּהִלָּתוֹ
  choice: sifa zake zote
  rationale: Ingawa Kiebrania kina nomino ya umoja yenye maana ya kijumla, wingi huu ni wa asili katika Kiswahili na unabaki na msisitizo wa ukamilifu unaoletwa na כָּל.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; “Yahwe” hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Upeo wa swali la balagha
  choice: Swali moja linalohusu kusimulia na kutangaza
  alternative: Maswali mawili tofauti
  rationale: Vishazi viwili vya Kiebrania vina usambamba na kwa pamoja vinasisitiza kutowezekana kwa mwanadamu kueleza kikamilifu matendo na sifa zote za Yahwe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. Muundo wa swali la balagha na usambamba wa mstari wa Kiebrania umehifadhiwa kwa lugha ya kawaida ya kisasa.
