translation:
  language: sw
  text: 'Heri wale wanaoshika haki,

    wanaotenda uadilifu nyakati zote.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Heri wale wanaodumisha haki, wanaotenda yaliyo sawa kila wakati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heri
  rationale: Neno hili la mshangao hutanguliza tamko la hali njema yenye kibali; “Heri” ni la kawaida, lenye hadhi, na halilifanyi kuwa hisia ya furaha tu.
- source_word: שֹׁמְרֵי
  choice: wale wanaodumisha
  rationale: Kauli endelevu ya Kiebrania inaonyesha mwenendo wa kudumu. “Kudumisha” hapa hueleza kushikilia na kutekeleza haki, si kuilinda kwa maana halisi tu.
- source_word: מִשְׁפָּט
  choice: haki
  rationale: Katika muktadha huu wa maadili, neno linamaanisha utaratibu au mwenendo wa haki, wala si hukumu ya mahakama pekee.
- source_word: עֹשֵׂה
  choice: wanaotenda
  rationale: Ingawa umbo la Kiebrania ni la umoja, lina nguvu ya kijumla baada ya usemi wa wingi. Wingi ni wa asili katika Kiswahili na hudumisha maana ya tendo la mazoea.
- source_word: צְדָקָה
  choice: yaliyo sawa
  rationale: Usemi huu wa asili katika Kiswahili unaonyesha matendo manyoofu na mema huku ukitofautisha neno hili na מִשְׁפָּט lililotafsiriwa “haki.”
- source_word: בְּכָל עֵת
  choice: kila wakati
  rationale: Huhifadhi msisitizo wa uendelevu au mazoea katika usemi wazi na wa kawaida wa Kiswahili.
theological_decisions:
- issue: Uhusiano kati ya מִשְׁפָּט na צְדָקָה
  choice: Kutofautisha maneno hayo kama “haki” na “yaliyo sawa.”
  alternative: Kutafsiri yote mawili kwa lugha inayotumia “haki,” kama “haki” na “uadilifu.”
  rationale: Maneno ya Kiebrania yanahusiana lakini si sawa kabisa. Utofautishaji huu huhifadhi ulinganifu wa kishairi bila kuyafanya kuwa dhana moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Mpangilio wa mistari huhifadhi ulinganifu wa kishairi wa Kiebrania.
