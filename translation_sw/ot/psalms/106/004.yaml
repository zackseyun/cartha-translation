base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/004.yaml
  text: Remember me[a], O Yahweh, when you show favor to your people[b]; attend to me with your salvation.
translation:
  language: sw
  text: Ee Yahwe, unikumbuke wakati unapowatendea watu wako kwa fadhili[a]; unitembelee kwa wokovu wako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa fadhili ulizo nazo kwa watu wako.”
    reason: lexical_alternative
  - marker: b
    text: Au, “unijali kwa wokovu wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרֵנִי
  choice: unikumbuke
  rationale: Kitenzi cha kuamuru chenye kiambishi cha nafsi ya kwanza kinaomba Yahwe amkumbuke mwombaji; tafsiri hii ni ya moja kwa moja na inahifadhi nguvu ya ombi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi, badala ya kubadilishwa kuwa cheo.
- source_word: בִּרְצוֹן עַמֶּךָ
  choice: wakati unapowatendea watu wako kwa fadhili
  rationale: 'רָצוֹן hapa ina maana ya fadhili, kibali, au nia njema. בְּ linaeleweka kwa hali ya wakati au mazingira: mwombaji anaomba akumbukwe Mungu anapowaonyesha watu wake fadhili.'
- source_word: פָּקְדֵנִי
  choice: unijali
  rationale: Katika ombi, פקד inaweza kumaanisha kumwangalia mtu kwa makusudi na kumtendea kwa neema. “Unijali” ni Kiswahili cha sasa kinachoeleza uangalizi wenye matokeo, bila kudokeza tu ujio wa mahali.
- source_word: בִּישׁוּעָתֶךָ
  choice: kwa wokovu wako
  rationale: Tafsiri hii inahifadhi nomino “wokovu” pamoja na wazo la njia au tendo ambalo kwa hilo Mungu anamjali mwombaji.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; “Yahwe” hulihifadhi badala ya kuweka cheo mahali pake.
- issue: Maana ya בִּרְצוֹן עַמֶּךָ
  choice: wakati unapowatendea watu wako kwa fadhili
  alternative: kwa fadhili ulizo nazo kwa watu wako
  rationale: Muundo wa Kiebrania ni mfupi na unaweza kueleweka kwa namna ya wakati/mazingira au uhusiano. Maana ya wakati inafaa muktadha wa ombi, huku tanbihi ikihifadhi uwezekano mwingine.
- issue: Maana ya פָּקְדֵנִי katika ombi
  choice: unijali
  alternative: unijilie
  rationale: Kitenzi kinaweza kueleza kumtembelea au kumwangalia mtu kwa kusudi la kumtendea. “Unijali” huwasilisha uangalizi wa Mungu unaoleta msaada; “unijilie” huhifadhi sitiari ya kutembelea lakini si ya kawaida sana katika Kiswahili cha sasa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Kihisishi “Ee” kinadumisha mtindo wa sala bila kufanya sentensi kuwa ya kizamani; alama za tanbihi zimewekwa baada ya vifungu vinavyohusika.
