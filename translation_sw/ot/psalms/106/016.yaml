  yaml_path: translation/ot/psalms/106/016.yaml
  text: They became jealous of Moses in the camp[a], and of Aaron, the holy one of Yahweh.
translation:
  language: sw
  text: Walimwonea wivu Musa kambini, na Aroni, mtakatifu wa Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Aroni, aliyewekwa wakfu kwa ajili ya Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנְאוּ
  choice: Walimwonea wivu
  rationale: Kitenzi קנא hapa kinaonyesha wivu ulioelekezwa kwa Musa na Aroni katika muktadha wa uasi; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: לְמֹשֶׁה
  choice: Musa
  rationale: Kihusishi ל pamoja na קנא kinaonyesha mlengwa wa wivu; katika Kiswahili uhusiano huo umejengwa ndani ya kitenzi ‘kumwonea wivu.’
- source_word: בַּמַּחֲנֶה
  choice: kambini
  rationale: מַחֲנֶה ni kambi ya Waisraeli jangwani; ‘kambini’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: לְאַהֲרֹן
  choice: na pia Aroni
  rationale: ל ya pili inalingana na ile inayomtaja Musa. ‘Na pia’ huonyesha wazi kuwa Aroni pia alikuwa mlengwa wa wivu.
- source_word: קְדוֹשׁ יְהוָה
  choice: aliye mtakatifu wa Yahweh
  rationale: Kirai hiki kinamtambulisha Aroni kuwa mtu aliyetengwa na kuwekwa wakfu kwa Yahweh, huku kikihifadhi muundo wenye uwezekano wa kueleweka kama ‘mtakatifu wa Yahweh.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetolewa kama jina binafsi ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Maana ya designation קְדוֹשׁ יְהוָה kuhusu Aroni
  choice: Aroni anaelezwa kuwa ‘aliye mtakatifu wa Yahweh.’
  alternative: Aroni ni ‘aliyetakaswa kwa ajili ya Yahweh.’
  rationale: Tafsiri kuu inadumisha ufupi na mvutano wa kirai cha Kiebrania bila kuamua kabisa kama mkazo ni utambulisho wake kama mtakatifu wa Yahweh au kuwekwa kwake wakfu kwa ajili ya Yahweh; maana mbadala imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kumwonea wivu’ ni usemi wa kawaida; ‘kambini’ ni mfupi na wazi. Muundo wa kumfafanua Aroni umewekwa wazi bila kuondoa utata halisi wa קְדוֹשׁ יְהוָה.
