lexical_decisions:
- source_word: וַיִּתֵּן
  choice: akawapa
  rationale: Kitenzi נתן kinamaanisha moja kwa moja ‘kutoa’; muundo wa masimulizi wa Kiebrania umeonyeshwa kwa ‘aka-’.
- source_word: לָהֶם
  choice: -wapa
  rationale: Kiwakilishi cha yambwa kisicho cha moja kwa moja kimejumuishwa kwa kawaida katika kitenzi cha Kiswahili.
- source_word: שֶׁאֱלָתָם
  choice: walichoomba
  rationale: שאלה ni ‘ombi’ au ‘kitu kilichoombwa.’ ‘Walichoomba’ ni Kiswahili cha kawaida na huweka wazi kuwa walipewa kitu walichokiomba bila kuongeza wazo la tamaa.
- source_word: וַיְשַׁלַּח
  choice: lakini akapeleka
  rationale: Maana ya msingi ni ‘naye akatuma/akapeleka,’ lakini muktadha unaonyesha tofauti kati ya kuwapa walichoomba na hukumu iliyofuata; ‘lakini’ huonyesha tofauti hiyo bila kuifafanua kupita kiasi.
- source_word: רָזוֹן
  choice: ukonda
  rationale: רָזוֹן hueleza ukonda, kudhoofika, au kunyauka. ‘Ukonda’ huhifadhi taswira halisi na kutoruhusu tafsiri ya kitabibu iliyo finyu.
- source_word: בְּנַפְשָׁם
  choice: ndani ya nafsi zao
  rationale: נֶפֶשׁ linaweza kumaanisha nafsi, uhai, mtu mwenyewe, au utu wote. ‘Ndani ya nafsi zao’ huhifadhi upana na uzito wa usemi wa Kiebrania, huku tanbihi ikitaja maana nyingine.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika muktadha wa hukumu
  choice: Kudumisha ‘nafsi’ katika matini kuu
  alternative: uhai wao; wao wenyewe; utu wao wote
  rationale: Neno la Kiebrania ni pana kuliko dhana ya kisasa ya sehemu isiyo ya kimwili ya mwanadamu. ‘Nafsi’ ni tafsiri halali inayohifadhi mvutano na uzito wa kifungu, na tanbihi inazuia lisieleweke kwa maana finyu tu.
- issue: Uhusiano wa kishazi cha pili na cha kwanza
  choice: Kutumia ‘lakini’
  alternative: na
  rationale: Kiebrania hutumia kiunganishi cha kawaida, lakini muktadha unaonyesha matokeo yanayotofautiana kwa uchungu na kile walichopewa. ‘Lakini’ huwasilisha uhusiano huo bila kubadili mhusika wala asili ya hukumu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye staha. ‘Ukonda’ huhifadhi sitiari ya Kiebrania; tanbihi hufafanua uwezekano wa kudhoofika au kunyauka. Viambishi vyote vya tanbihi [a], [b], na [c] vimewekwa katika matini kuu.
