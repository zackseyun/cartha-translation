  yaml_path: translation/ot/psalms/106/015.yaml
  text: So he gave them what they asked for[c][b][a], but sent leanness into their soul.
translation:
  language: sw
  text: Akawapa walichoomba[a], lakini akatuma ukonda[b] katika nafsi[c] zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ombi lao.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kudhoofika” au “kunyauka.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania nefesh; linaweza pia kumaanisha “uhai,” “mtu mwenyewe,” au “utu wote.”
