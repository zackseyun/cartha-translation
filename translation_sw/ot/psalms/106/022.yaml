translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Marudio ya “matendo” yanadumisha ulinganifu wa mistari ya Kiebrania, huku tanbihi zikihifadhi jina la kishairi “Hamu” na utata wa יַם סוּף.
