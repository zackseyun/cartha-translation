lexical_decisions:
- source_word: נִפְלָאוֹת
  choice: matendo ya ajabu
  rationale: Neno hili la wingi kutoka mzizi פלא linaonyesha mambo au matendo yasiyo ya kawaida. Katika muktadha wa matendo ya Mungu, “matendo ya ajabu” ni ya asili katika Kiswahili na hudumisha ulinganifu wa kishairi.
- source_word: בְּאֶרֶץ
  choice: katika nchi ya
  rationale: Kihusishi ב pamoja na אֶרֶץ hapa kina maana ya mahali; “katika nchi ya” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: חָם
  choice: Hamu
  rationale: Jina maalumu la Kiebrania limehifadhiwa kwa namna iliyozoeleka katika Kiswahili. Katika muktadha huu ni jina la kishairi la Misri, jambo linalofafanuliwa katika tanbihi.
- source_word: נ֝וֹרָאוֹת
  choice: matendo ya kutisha
  rationale: Neno kutoka mzizi ירא linaeleza mambo yanayoleta hofu na kicho. “Matendo ya kutisha” hudumisha uzito huo bila kuyafanya yaonekane kuwa maovu kimaadili.
- source_word: עַל
  choice: kando ya
  rationale: Kihusishi hiki kikihusishwa na eneo la kijiografia kinaweza kuonyesha mahali karibu na au penye kitu; “kando ya” ni ya asili na inafaa tukio linalorejelewa.
- source_word: יַם סוּף
  choice: Bahari ya Shamu
  rationale: “Bahari ya Shamu” ni jina la jadi na linalotambulika katika Kiswahili kwa bahari inayorejelewa. Maana mbadala ya karibu zaidi na umbo la Kiebrania, “Bahari ya Matete,” imehifadhiwa katika tanbihi.
