base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/030.yaml
  text: Then Phinehas stood up and interceded[a], and the plague was stopped.
translation:
  language: sw
  text: Ndipo Finehasi akasimama, akaingilia kati[a], na tauni ikakomeshwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akatekeleza hukumu”; kwa tafsiri nyingine, “akaomba.” Kitenzi cha Kiebrania hapa kinaweza kuwa na maana ya kimahakama au ya kuombea.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: akasimama
  rationale: Kitenzi עמד humaanisha kusimama; katika mfululizo huu wa simulizi, “akasimama” pia huonyesha kuanza kuchukua hatua bila kuongeza maana isiyokuwamo wazi.
- source_word: פִּינְחָס
  choice: Finehasi
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
- source_word: וַיְפַלֵּל
  choice: akaingilia kati
  rationale: Katika muundo huu, פלל inaweza kuwa na maana ya kuingilia kati, kutekeleza hukumu, au kusali. “Akaingilia kati” ni pana na ya kawaida, na haiamui kimya-kimya kati ya nguvu ya kimahakama na ile ya maombezi.
- source_word: וַתֵּעָצַר
  choice: ikakomeshwa
  rationale: Nifali ya עצר hapa inaonyesha kwamba jambo lilizuiliwa au kusimamishwa. “Ikakomeshwa” huwasilisha wazi matokeo hayo.
- source_word: הַמַּגֵּפָה
  choice: tauni
  rationale: מגפה ni mlipuko wenye kuua au tauni. “Tauni” ni neno la Kiswahili linalofaa katika muktadha wa Hesabu 25.
theological_decisions:
- issue: Maana ya וַיְפַלֵּל kuhusiana na tendo la Finehasi
  choice: akaingilia kati
  alternative: akatekeleza hukumu; au, akaomba
  rationale: Zaburi inadokeza tukio la Hesabu 25, ambako hatua thabiti ya Finehasi inasimamisha tauni. Kwa kuwa kitenzi cha Kiebrania kinaweza kuwa na nguvu ya kimahakama au ya maombezi, tafsiri kuu inabaki pana, na maana mbadala zinawekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi ni rahisi kueleweka, huku tanbihi ikihifadhi utata halisi wa kitenzi cha Kiebrania.
