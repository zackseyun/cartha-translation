  text: And it was counted to him as righteousness from generation to generation forever[a][b].
translation:
  language: sw
  text: Hilo likahesabiwa kwake kuwa haki, kizazi baada ya kizazi, milele[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “likahesabiwa” au “likawekwa kwake kama haki.” Kiebrania kinatumia usemi wa kawaida wa jambo kuhesabiwa au kutambuliwa kuwa haki kwa mtu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kwa kizazi na kizazi,” yaani katika vizazi vyote vinavyofuatana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּחָשֶׁב
  choice: ikahesabiwa
  rationale: Kauli ya kutendwa ya Kiebrania ina maana ya kitu kuhesabiwa au kuchukuliwa kuwa na thamani fulani. “Ikahesabiwa” huhifadhi sitiari ya tathmini bila kuiongezea ufafanuzi wa kiteolojia.
- source_word: לוֹ
  choice: kwake
  rationale: Kiambishi cha kihusishi kinaonyesha mtu ambaye jambo hilo lilihesabiwa kwake; “kwake” ni usemi wa moja kwa moja na wa kawaida katika Kiswahili.
- source_word: לִצְדָקָה
  choice: kuwa haki
  rationale: Katika muundo חשב + ל, “kuwa haki” huwasilisha tathmini ya jambo hilo kama haki, bila kuibana maana iwe tu “tendo la haki.”
- source_word: לְדֹר וָדֹר
  choice: kizazi hata kizazi
  rationale: Usemi huu wa kishairi huhifadhi urudiaji halisi wa “kizazi na kizazi” huku ukionyesha mwendelezo katika vizazi vyote.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: “Milele” ni tafsiri ya kawaida, yenye hadhi, ya wazo la kudumu bila mwisho.
theological_decisions:
- issue: Uhusiano na Mwanzo 15:6 na maana ya haki inayohesabiwa
  choice: Kuhifadhi usemi “ikahesabiwa kwake kuwa haki” bila kuongeza maelezo ya kimafundisho.
  alternative: Ilionwa kuwa tendo lake la haki.
  rationale: Kiebrania kinatumia usemi wenye mwangwi mpana wa kibiblia kuhusu kuhesabiwa haki. Tafsiri inahifadhi mwangwi huo na utata wake bila kuamua kwamba kinachozungumziwa ni hadhi pekee au tendo moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi na chenye hadhi lakini kinachoeleweka kwa urahisi. Mpangilio “kizazi hata kizazi” umechaguliwa ili kuhifadhi urudiaji wa kishairi wa Kiebrania; alama zote za tanbihi zimewekwa katika matini kuu.
