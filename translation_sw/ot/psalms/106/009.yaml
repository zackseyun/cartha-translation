  text: He rebuked the Red Sea[a], and it dried up; he led them through the depths as through the wilderness.
translation:
  language: sw
  text: Aliikemea Bahari ya Shamu[a], nayo ikakauka; akawaongoza katika vilindi kama jangwani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Bahari ya Matete.” Kiebrania: yam suph.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְעַר
  choice: Aliikemea
  rationale: Kitenzi גער kwa kawaida humaanisha ‘kukemea.’ Tafsiri hii inadumisha taswira hai ya kishairi ya Mungu akitawala maji kana kwamba yanaweza kusikia.
- source_word: בְּיַם סוּף
  choice: Bahari ya Shamu
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa bahari inayohusishwa na tukio la kutoka Misri. Maana ya karibu zaidi na vipashio vya Kiebrania, ‘Bahari ya Matete,’ imehifadhiwa katika tanbihi.
- source_word: וַיֶּחֱרָב
  choice: ikakauka
  rationale: Umbo hili la חרב lina maana ya kuwa au kufanyika kavu. ‘Ikakauka’ ni la asili katika Kiswahili na linadumisha hali isiyo ya kutendwa ya Kiebrania.
- source_word: וַיּוֹלִיכֵם
  choice: akawaongoza
  rationale: Hiphil ya הלך hapa inaonyesha kusababisha waende, yaani kuwaongoza. ‘Akawaongoza’ ni wazi na ya kawaida.
- source_word: בַּתְּהֹמוֹת
  choice: kupitia vilindi
  rationale: Wingi תְּהֹמוֹת hurejelea vilindi vikubwa vya maji. ‘Vilindi’ huhifadhi nguvu ya kishairi, na ‘kupitia’ huonyesha mwendo katika mahali hapo.
- source_word: כַּמִּדְבָּר
  choice: kana kwamba walipitia jangwani
  rationale: Usemi huu unaonyesha kwamba Mungu aliwafanya wapite katika vilindi kwa urahisi kama wangepita katika nchi kavu ya jangwani. Muundo huu ni wa asili na unaunganisha wazi tashbihi na kitendo cha kuwaongoza.
theological_decisions:
- issue: Tafsiri ya יַם סוּף katika rejeo la kutoka Misri
  choice: Bahari ya Shamu
  alternative: Bahari ya Matete
  rationale: ‘Bahari ya Shamu’ hutambulisha kwa urahisi tukio linalojulikana la kutoka Misri katika matumizi ya kawaida ya Biblia ya Kiswahili. Hata hivyo, ‘Bahari ya Matete’ ni tafsiri halali ya kileksia, kwa hiyo imehifadhiwa katika tanbihi bila kuondoa utata wa usemi wa Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Aliikemea’ na ‘vilindi’ hudumisha taswira ya zaburi; ‘kana kwamba walipitia jangwani’ huweka wazi tashbihi kwa mtiririko wa kawaida wa Kiswahili.
