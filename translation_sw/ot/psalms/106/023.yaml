  text: וַ/יֹּ֗אמֶר לְֽ/הַשְׁמִ֫ידָ֥/ם לוּלֵ֡י מֹ֘שֶׁ֤ה בְחִיר֗/וֹ עָמַ֣ד בַּ/פֶּ֣רֶץ לְ/פָנָ֑י/ו לְ/הָשִׁ֥יב חֲ֝מָת֗/וֹ מֵֽ/הַשְׁחִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/023.yaml
  text: So he said he would destroy them—had not Moses[a], his chosen one, stood in the breach before him to turn back his wrath from destroying.
translation:
  language: sw
  text: Kwa hiyo alisema kwamba angewangamiza—kama Musa[a], mteule wake, hangesimama katika pengo mbele yake ili kuigeuza ghadhabu yake isiwangamize.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika ufa.” Taswira ya Kiebrania ni ya mtu anayechukua nafasi katika pengo la ukuta; hapa inaeleza maombezi ya Musa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kwa hiyo akasema
  rationale: Waw-consecutive inaendeleza simulizi kwa mtiririko wa kimatokeo; “Kwa hiyo akasema” ni Kiswahili cha kawaida kinachoonyesha uhusiano huo.
- source_word: לְהַשְׁמִידָם
  choice: angewangamiza
  rationale: Kitenzi hiki kinaonyesha kusudi la kuwaangamiza; umbo la masharti linaendana na sentensi ya hali isiyotokea inayofuata.
- source_word: לוּלֵי
  choice: kama ... asingalisimama
  rationale: 'לוּלֵי huanzisha hali ya kinyume na tukio halisi: maangamizi yangetokea kama Musa asingesimama.'
- source_word: בְחִירוֹ
  choice: mteule wake
  rationale: Hutaja mtu aliyechaguliwa na Mungu bila kuongeza dhana ya kimadhehebu.
- source_word: עָמַד בַּפֶּרֶץ
  choice: asingalisimama kwenye ufa
  rationale: Inahifadhi taswira halisi ya mtu anayechukua nafasi kwenye ufa wa ukuta, hapa ikiwakilisha maombezi ya Musa.
- source_word: לְפָנָיו
  choice: mbele zake
  rationale: Kiwakilishi kinamrejelea Mungu; usemi huu huhifadhi mazingira ya Musa kusimama katika uwepo wake.
- source_word: לְהָשִׁיב חֲמָתוֹ
  choice: ili kuigeuza ghadhabu yake
  rationale: Hiphil ya שוב ina maana ya kusababisha irudi au igeuke; “ghadhabu” huhifadhi uzito wa חֵמָה katika hukumu ya Mungu.
- source_word: מֵהַשְׁחִית
  choice: isiwangamize
  rationale: מִן pamoja na infinitive huonyesha kuzuiwa kwa tendo; Kiswahili hiki huonyesha kwamba ghadhabu iligeuzwa ili maangamizi yasitekelezwe.
theological_decisions:
- issue: Lugha inayohusisha ghadhabu na Mungu
  choice: ghadhabu yake
  alternative: hasira yake; hukumu yake
  rationale: Andiko lenyewe linataja ghadhabu ya Mungu ikigeuzwa kupitia maombezi ya Musa; neno hilo halijalainishwa wala kubadilishwa kuwa dhana isiyo ya kibinafsi.
- issue: Taswira ya Musa kusimama kwenye ufa
  choice: Hifadhi sitiari ya “kusimama kwenye ufa.”
  alternative: aliwaombea; alisimama pengoni
  rationale: Taswira ya ukuta uliobomoka ni sehemu muhimu ya namna mstari unavyomwonyesha Musa kama mwombezi; kuibadili kuwa “aliwaombea” pekee kungeondoa picha ya Kiebrania.
- issue: Uhusiano kati ya maombezi ya Musa na kugeuzwa kwa ghadhabu
  choice: Tafsiri uhusiano huo kama kusudi la kusimama kwake bila kufafanua utaratibu wa kitheolojia.
  alternative: Musa alimshawishi Mungu abadili uamuzi wake; Musa alizuia hukumu kwa mamlaka yake mwenyewe
  rationale: Maandishi yanasema Musa alisimama mbele za Mungu ili kuigeuza ghadhabu yake, lakini hayaelezi kwa undani namna maombezi hayo yanavyohusiana na kusudi au kutobadilika kwa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “asingalisimama” umetumiwa kudhihirisha hali ya kinyume na tukio halisi; sitiari ya ufa imehifadhiwa na kufafanuliwa katika tanbihi.
