  text: They joined themselves to Baal of Peor and ate sacrifices of the dead[a][b].
translation:
  language: sw
  text: Wakajiunga na Baali wa Peori[a], wakala dhabihu za wafu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wakajifungamanisha na Baali-Peori.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “dhabihu za wafu.” Usemi huu unaweza kumaanisha dhabihu zilizotolewa kwa sanamu zisizo na uhai, au dhabihu zinazohusiana na ibada kwa ajili ya watu waliokufa.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצָּמְדוּ
  choice: wakajiunga
  rationale: Kitenzi צמד kinaonyesha kujifungamanisha au kuambatana kwa karibu. “Wakajiunga” ni Kiswahili cha kawaida kinachohifadhi wazo la wao wenyewe kushikamana na ibada hiyo bila kulazimisha sitiari ya nira katika matini kuu.
- source_word: לְבַעַל פְּעוֹר
  choice: na Baali wa Peori
  rationale: Hili ni jina la mungu aliyehusishwa na Peori. “Baali wa Peori” linaonyesha uhusiano huo kwa Kiswahili kinachoeleweka na kuhifadhi majina yote mawili.
- source_word: וַיֹּאכְלוּ
  choice: wakala
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya tendo la kula, inayofaa mfululizo wa masimulizi.
- source_word: זִבְחֵי
  choice: dhabihu za
  rationale: זֶבַח humaanisha dhabihu au sadaka ya kuchinjwa. “Dhabihu” huhifadhi maana ya kiibada bila kuifanya moja kwa moja kuwa ‘karamu za dhabihu.’
- source_word: מֵתִים
  choice: wafu
  rationale: Neno la Kiebrania humaanisha ‘waliokufa/wafu.’ “Wafu” huhifadhi utata wa iwapo linarejelea sanamu au miungu isiyo na uhai, au ibada zinazohusiana na watu waliokufa.
theological_decisions:
- issue: Kinachorejelewa na “wafu” katika זִבְחֵי מֵתִים
  choice: Kuhifadhi usemi mpana “dhabihu za wafu”
  alternative: dhabihu zilizotolewa kwa sanamu zisizo na uhai; dhabihu zilizotolewa kwa watu waliokufa
  rationale: Kiebrania hakibainishi wazi iwapo ‘wafu’ ni miungu isiyo na uhai au waliokufa wanaohusishwa na ibada fulani. Matini kuu kwa hiyo haiamui jambo ambalo chanzo kimeliacha wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wakajiunga” ni cha kawaida na kinachoeleweka; “dhabihu za wafu” huhifadhi kwa makusudi ufupi na utata wa Kiebrania.
