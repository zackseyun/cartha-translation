  yaml_path: translation/ot/psalms/106/033.yaml
  text: For they embittered his spirit[b][a], and he spoke rashly with his lips.
translation:
  language: sw
  text: Kwa maana waliichokoza roho yake[a], naye akasema kwa pupa kwa midomo yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliifanya roho yake kuwa na uchungu”; kitenzi cha Kiebrania kinaweza kumaanisha kuchokoza au kusababisha uchungu.
    reason: lexical_alternative
  - marker: b
    text: Yaani, Musa alisema kwa pupa huko Meriba; linganisha Hesabu 20:10.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu ya jambo lililotangulia; “kwa maana” kinaendeleza mtiririko huo kwa Kiswahili cha kawaida.
- source_word: הִמְרוּ
  choice: waliitia uchungu
  rationale: Kauli ya kisababishi ya kitenzi hiki inaweza kumaanisha kusababisha uchungu au kuchokoza. Tafsiri hii inadumisha wazo la kusababisha uchungu huku ikiruhusu maana ya kuchokozwa iliyo katika muktadha.
- source_word: אֶת רוּחוֹ
  choice: roho yake
  rationale: Hapa neno רוּחַ linaelekea kumaanisha hali ya ndani ya Musa, si Roho Mtakatifu. “Roho yake” inadumisha taswira ya Kiebrania bila kuifafanua kupita kiasi.
- source_word: וַיְבַטֵּא
  choice: akanena kwa pupa
  rationale: Kitenzi kinaashiria kutoa maneno, na muktadha unayaonyesha kuwa ya haraka na yasiyopimwa. “Kunena kwa pupa” ni usemi wenye heshima unaowasilisha uzembe huo wa ghafla.
- source_word: בִּשְׂפָתָיו
  choice: kwa midomo yake
  rationale: Tafsiri hii inadumisha taswira halisi ya Kiebrania ya midomo kama chombo cha kusema.
theological_decisions:
- issue: Mrejelewa wa viwakilishi katika “roho yake” na “midomo yake”
  choice: Viwakilishi vinamrejelea Musa.
  alternative: Vinaweza kudhaniwa kuwarejelea watu kwa pamoja au mtangulizi mwingine.
  rationale: 'Katika simulizi la Meriba katika mistari 32–33, matokeo yanahusu kosa la Musa: watu walipoitia uchungu roho yake, yeye akanena kwa pupa. Hii inalingana na Hesabu 20:10 na haileti bila msingi rejeo kwa Roho Mtakatifu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Akanena” na “midomo yake” zinadumisha mtindo wa zaburi na taswira ya chanzo; “kwa pupa” linaeleza usemi wa ghafla bila kuongeza hukumu ya kimadhehebu.
