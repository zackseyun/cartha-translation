  rationale: Muundo huu unaonyesha kwamba Mungu ndiye aliyesababisha mateka waonyeshwe huruma; ni Kiswahili cha kawaida kuliko tafsiri ya moja kwa moja ya ‘akawatoa kwa huruma.’
- source_word: לִפְנֵי כָּל שׁוֹבֵיהֶם
