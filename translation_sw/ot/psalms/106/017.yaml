base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/017.yaml
  text: The earth opened and swallowed Dathan[c][b][a], and covered the company of Abiram.
translation:
  language: sw
  text: Nchi ikafunguka[a] na kummeza Dathani[c], ikalifunika kundi[b] la Abiramu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikapasuka.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kusanyiko la Abiramu.”
    reason: lexical_alternative
  - marker: c
    text: Tazama Hesabu 16:31–33 kuhusu tukio hili la hukumu.
    reason: cross_reference
lexical_decisions:
- source_word: תִּפְתַּח
  choice: ikafunguka
  rationale: Kitenzi cha Kiebrania kina nchi kama kiima na katika ushairi huu kinasimulia tukio lililopita. “Ikafunguka” ni Kiswahili cha kawaida; “ikapasuka” ni mbadala wenye picha kali zaidi kutokana na muktadha wa Hesabu 16.
- source_word: אֶרֶץ
  choice: Nchi
  rationale: Hapa neno linamaanisha ardhi iliyo chini ya waasi, si eneo la kisiasa. “Nchi” hutumiwa kwa asili katika Kiswahili kueleza ardhi inayofunguka, ingawa “ardhi” pia inawezekana.
- source_word: וַתִּבְלַע
  choice: na kummeza
  rationale: Neno בלע linamaanisha kumeza; umbo la simulizi linaendeleza hatua iliyofuata. Kiambishi cha mtendwa humrejelea Dathani kwa wazi.
- source_word: דָּתָן
  choice: Dathani
  rationale: Jina limetoholewa kwa tahajia na matamshi yaliyozoeleka katika Biblia za Kiswahili.
- source_word: וַתְּכַס עַל
  choice: ikalifunika
  rationale: Kitenzi כסה pamoja na עַל huonyesha kufunika kitu. Kiswahili hakihitaji kutafsiri kihusishi עַל kwa neno tofauti hapa; maana yake imo katika “kufunika.”
- source_word: עֲדַת
  choice: kundi la
  rationale: Neno עֵדָה hapa ni kikundi au kusanyiko linalohusishwa na Abiramu. “Kundi” ni la sasa na halileti maana ya kikanisa isiyokuwamo lazima katika muktadha.
- source_word: אֲבִירָם
  choice: Abiramu
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
theological_decisions:
- issue: Uhusiano wa mstari huu na simulizi pana la Hesabu 16
  choice: Kutafsiri muhtasari wa kishairi kama ulivyo, ukimtaja Dathani na kundi la Abiramu pekee.
  alternative: Kuongeza nyumba zao au waasi wengine wanaotajwa katika Hesabu 16.
  rationale: Maelezo hayo ya ziada hayamo katika mstari wa Kiebrania; tafsiri haipaswi kupanua muhtasari wa mtunga zaburi.
- issue: Maana ya עֲדַת אֲבִירָם
  choice: kundi la Abiramu
  alternative: kusanyiko la Abiramu
  rationale: Neno linaweza kumaanisha kundi, kusanyiko, au mkutano. “Kundi” linafaa kwa wafuasi wake bila kuamua kwa undani muundo wao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Viunganishi vya mfululizo “ika-” vinaonyesha matendo ya kihistoria yanayofuatana. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika.
