translation:
  language: sw
  text: Wakazitumikia sanamu zao,[a] nazo zikawa mtego kwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wakaziabudu sanamu zao, nazo zikawa mtego kwao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: wakazitumikia
  rationale: Kitenzi עבד katika qal hapa kinaonyesha utumishi wa kidini kwa miungu ya uongo. ‘Kuzitumikia’ kinahifadhi wazo la msingi la kutumikia huku muktadha ukionyesha kuwa ni ibada.
- source_word: עֲצַבֵּיהֶם
  choice: sanamu zao za kuabudiwa
  rationale: עֲצַבִּים hurejelea sanamu zinazotumiwa kama miungu. Usemi huu ni wazi kwa msomaji wa Kiswahili na unatofautisha sanamu za ibada na sanamu za kawaida.
- source_word: וַיִּהְיוּ
  choice: nazo zikawa
  rationale: 'היה pamoja na לְמוֹקֵשׁ hapa inaonyesha matokeo: sanamu hizo zikaja kuwa au kufanya kazi kama mtego. Kiunganishi ‘nazo’ kinaweka wazi kwa njia ya kawaida kwamba sanamu ndizo rejeleo, bila kubadili maana ya Kiebrania.'
- source_word: לָהֶם
  choice: kwao
  rationale: ל hapa huonyesha uhusiano na athari kwa watu wenyewe; ‘kwao’ ni Kiswahili cha kawaida katika muundo ‘zikawa mtego kwao.’
- source_word: לְמוֹקֵשׁ
  choice: mtego
  rationale: מוֹקֵשׁ ni mtego unaonasa, pia kwa maana ya sitiari ya hatari ya kiroho au kimaadili. ‘Mtego’ ni neno la sasa, wazi, na sahihi.
theological_decisions:
- issue: Rejeleo la kiwakilishi katika וַיִּהְיוּ לָהֶם לְמוֹקֵשׁ
  choice: Sanamu zikawa mtego kwa watu waliozitumikia.
  alternative: Tendo la kuzitumikia likawa mtego kwao.
  rationale: Nomino ya karibu עֲצַבֵּיהֶם ni ya wingi na ndiyo rejeleo la kawaida la kitenzi cha wingi וַיִּהְיוּ. ‘Nazo’ kinaonyesha usomaji huu kwa uwazi wa kawaida wa Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Sanamu za kuabudiwa’ huepuka uwezekano wa kuelewa ‘sanamu’ kama kazi ya sanaa tu; tanbihi huhifadhi tafsiri mbadala ya עבד kuwa ‘kuabudu.’
