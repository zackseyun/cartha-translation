  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֲב֘וֹתֵ֤י/נוּ בְ/מִצְרַ֨יִם לֹא הִשְׂכִּ֬ילוּ נִפְלְאוֹתֶ֗י/ךָ לֹ֣א זָ֭כְרוּ אֶת רֹ֣ב חֲסָדֶ֑י/ךָ וַ/יַּמְר֖וּ עַל יָ֣ם בְּ/יַם סֽוּף׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/007.yaml
  text: Our fathers in Egypt did not understand your wondrous deeds[a]; they did not remember the abundance of your steadfast love[b], but rebelled at the sea—the Red Sea.
translation:
  language: sw
  text: Baba zetu huko Misri hawakuelewa matendo yako ya ajabu; hawakukumbuka wingi wa upendo wako thabiti, bali waliasi kando ya bahari—Bahari ya Shamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, Yam Suf, yaweza kumaanisha “Bahari ya Mafunjo”; kwa kawaida hutafsiriwa “Bahari ya Shamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבוֹתֵינוּ
  choice: Baba zetu
  rationale: Huhifadhi maana ya moja kwa moja ya neno la Kiebrania linalotaja baba wa vizazi vilivyotangulia, badala ya kulipanua kuwa neno lisiloainisha jinsia kama “mababu zetu” au “waliotutangulia.”
- source_word: בְמִצְרַיִם
  choice: huko Misri
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha mahali walipokuwa baba hao.
- source_word: לֹא הִשְׂכִּילוּ
  choice: hawakuelewa
  rationale: Hifili ya שׂכל hapa inaonyesha kushindwa kufahamu maana ya matendo ya Mungu; “hawakuelewa” ni wazi na haisukumii tafsiri mbali kuliko chanzo.
- source_word: נִפְלְאוֹתֶיךָ
  choice: matendo yako ya ajabu
  rationale: Neno hilo linarejelea matendo ya Mungu yanayostaajabisha, si hali ya ajabu isiyo dhahiri.
- source_word: לֹא זָכְרוּ
  choice: hawakukumbuka
  rationale: Hutoa maana ya kawaida ya זכר bila kuongeza kwa wazi matokeo ya kiagano yanayodokezwa na muktadha.
- source_word: רֹב חֲסָדֶיךָ
  choice: wingi wa upendo wako thabiti
  rationale: “Wingi” huwakilisha רֹב, na “upendo wako thabiti” huhifadhi vipengele vya uaminifu, kudumu na fadhili vilivyomo katika חֶסֶד.
- source_word: וַיַּמְרוּ
  choice: bali waliasi
  rationale: Kitenzi מרה humaanisha kuasi. “Bali” huonyesha tofauti ya kimuktadha kati ya matendo ya upendo ya Mungu na mwitikio wao.
- source_word: עַל יָם בְּיַם סוּף
  choice: penye bahari—kwenye Bahari ya Shamu
  rationale: Virai viwili vya mahali vinawekwa kwa uhusiano wa ufafanuzi kama katika Kiebrania. “Bahari ya Shamu” ni jina linalotambulika sana katika Kiswahili, huku maana ya karibu ya jina la Kiebrania ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana pana ya חֶסֶד
  choice: upendo wako thabiti
  alternative: fadhili zako / upendo wako wa uaminifu
  rationale: Chaguo hili huhifadhi upendo wenye kudumu na uaminifu bila kuufinya kuwa rehema pekee wala kuongeza wazi neno “agano,” ambalo halipo katika mstari.
- issue: Jina יַם סוּף
  choice: Bahari ya Shamu
  alternative: Bahari ya Mafunjo
  rationale: Jina la kawaida la Kiswahili limetumiwa katika matini kwa utambuzi wa wasomaji, lakini maana inayowezekana ya סוּף kama “mafunjo” imeonyeshwa katika tanbihi ili ushahidi wa Kiebrania usifichwe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umebaki wa kishairi lakini unaeleweka kwa urahisi; dashibodi inaonyesha kwamba “Bahari ya Shamu” inafafanua “bahari.”
