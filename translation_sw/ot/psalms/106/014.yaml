  yaml_path: translation/ot/psalms/106/014.yaml
  text: But they craved intensely in the wilderness[b][a], and tested God in the wasteland.
translation:
  language: sw
  text: Lakini walitamani sana jangwani[a], wakamjaribu Mungu katika nchi kame.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walitamani kwa nguvu jangwani.” Kiebrania kinasisitiza tamanio hilo kwa kutumia kitenzi na nomino yenye mzizi mmoja; kihalisi, “walitamani tamanio.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַוּוּ תַאֲוָה
  choice: walitamani sana
  rationale: Kitenzi na nomino yenye mzizi mmoja huunda msisitizo wa tamanio kali. Kiswahili cha kawaida huwasilisha nguvu hiyo kwa kielezi ‘sana’ bila kuingiza maana ya kingono ambayo ‘kutamani kwa tamaa’ inaweza kudokeza.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: ‘Jangwa’ ni neno la kawaida la Kiswahili kwa eneo lisilokaliwa au lenye ukame na linafaa kwa mazingira ya safari ya Israeli.
- source_word: וַיְנַסּוּ
  choice: wakamjaribu
  rationale: Kitenzi נסה hapa kina maana ya kumtia Mungu katika jaribio au kumweka kwenye mtihani. ‘Wakamjaribu’ ni kifupi, cha kawaida, na kinahifadhi maana hasi ya muktadha.
- source_word: אֵל
  choice: Mungu
  rationale: אֵל ni jina la kawaida la Mungu katika muktadha huu; ‘Mungu’ ni tafsiri iliyo wazi na ya kawaida.
- source_word: בִּישִׁימוֹן
  choice: katika nchi kame
  rationale: יְשִׁימוֹן husisitiza ukiwa na ukame. ‘Nchi kame’ huhifadhi tofauti yake na מִדְבָּר bila kutumia neno lilelile mara mbili.
theological_decisions:
- issue: Iwapo muundo wa Kiebrania wa kitenzi na nomino ya mzizi mmoja utafasiriwe kihalisi au kwa nahau
  choice: walitamani sana
  alternative: walitamani tamaa
  rationale: Tafsiri ya kinahau inatoa msisitizo wa Kiebrania kwa Kiswahili cha asili huku ikihifadhi uzito wa tamanio lao bila kuongeza aina maalumu ya tamaa ambayo chanzo hakitaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi urari wa kishairi kati ya ‘jangwani’ na ‘katika nchi kame,’ huku tofauti ya maneno mawili ya Kiebrania ikibaki wazi.
