source:
  edition: WLC
  text: הַֽלְלוּ יָ֨הּ הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/001.yaml
  text: Praise Yah! Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: sw
  text: Sifuni Yah[a]! Mshukuruni Yahweh, kwa maana yeye ni mwema; kwa maana upendo wake thabiti[b] hudumu milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania Hallelu-Yah ni mwito wa ibada unaomaanisha “Sifuni Yah.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza pia kueleza fadhili, rehema, au upendo mwaminifu.
    reason: semantic_range
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: Sifuni
  rationale: Ni agizo la wingi kutoka kitenzi הלל, linalowaita watu kumsifu Mungu. “Sifuni” ni Kiswahili cha kawaida, cha moja kwa moja, na chenye hadhi.
- source_word: יָהּ
  choice: Yah
  rationale: Ni umbo fupi la kishairi la jina la Mungu. Kulihifadhi kama “Yah” kunatunza msemo wa kiliturujia הַלְלוּ־יָהּ na kulitofautisha na umbo kamili יְהוָה linalofuata.
- source_word: הוֹד֣וּ
  choice: Mshukuruni
  rationale: Katika muktadha wa zaburi, Hifili ya ידה humaanisha kutoa shukrani au sifa. “Mshukuruni” ni mwito wa wingi ulio wazi na wa asili kwa Kiswahili.
- source_word: לַ/יהוָ֣ה
  choice: Yahweh
  rationale: Kiambishi ל huonyesha anayeelekezewa shukrani, naye ni יְהוָה. Jina la agano limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: כִּי
  choice: kwa maana
  rationale: כִּי inatoa sababu ya mwito wa kushukuru. “Kwa maana” hudumisha uhusiano huo na mtiririko wa kishairi.
- source_word: טוֹב
  choice: yeye ni mwema
  rationale: Ni kivumishi cha kiarifu chenye kiima kinachoeleweka kuwa Yahweh. Kiswahili kinahitaji kiima na kishirikishi ili wazo liwe wazi na la asili.
- source_word: לְ/עוֹלָ֣ם
  choice: hudumu milele
  rationale: Kirai hiki maana yake ni “hata milele.” Kitenzi “hudumu” kinaweka wazi mwendelezo unaodokezwa na sentensi isiyo na kitenzi katika Kiebrania, bila kubadili maana.
- source_word: חַסְדּֽ/וֹ
  choice: upendo wake thabiti
  rationale: חסד huunganisha upendo, uaminifu, fadhili, na uthabiti wa kujitoa. “Upendo wake thabiti” huhifadhi upana huo vizuri kuliko “rehema” pekee.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yanatumia moja kwa moja jina maalumu la Mungu, si cheo. “Yahweh” hulihifadhi kama jina na pia huonyesha uhusiano wake na umbo fupi “Yah” katika mstari huo.
- issue: Maana pana ya חֶסֶד
  choice: upendo wake thabiti
  alternative: rehema zake / fadhili zake / uaminifu wake wa agano
  rationale: 'Neno hili lina maana kadhaa zinazokutana: upendo, fadhili, uaminifu, na ushikamanifu. Tafsiri iliyochaguliwa haitawali kwa kulifanya liwe fundisho moja tu, na tanbihi inataja upana wake.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Marudio ya “kwa maana” yanahifadhi ulinganifu wa Kiebrania; nukta mkato hutenganisha sababu mbili zinazolingana. Viashiria vyote vya tanbihi vimewekwa moja kwa moja baada ya maneno yanayofafanuliwa.
