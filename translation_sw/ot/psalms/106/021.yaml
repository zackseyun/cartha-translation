  text: שָׁ֭כְחוּ אֵ֣ל מוֹשִׁיעָ֑/ם עֹשֶׂ֖ה גְדֹל֣וֹת בְּ/מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/021.yaml
  text: They forgot God their Savior[a], who had done great things in Egypt.
translation:
  language: sw
  text: Walimsahau Mungu, Mwokozi wao[a], aliyefanya mambo makuu nchini Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mkombozi wao.” Participle ya Kiebrania inaweza kumkazia Mungu kuwa ndiye anayewaokoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכְחוּ
  choice: Walimsahau
  rationale: Kitenzi cha Kiebrania ni Qal timilifu, nafsi ya tatu wingi, na katika masimulizi haya kinaeleza tendo lililotokea zamani. “Walimsahau” ni Kiswahili cha kawaida na kinaonyesha kwamba aliyesahauliwa ni Mungu.
- source_word: אֵל
  choice: Mungu
  rationale: Ingawa אֵל inaweza kudokeza mwenye nguvu, hapa ni jina la kumtaja Mungu wa Israeli. “Mungu” ni tafsiri ya kawaida na sahihi bila kuongeza msisitizo usio wazi katika muktadha.
- source_word: מוֹשִׁיעָם
  choice: Mwokozi wao
  rationale: Ni participle ya Hiphil ya ישׁע pamoja na kiambishi cha nafsi ya tatu wingi, yaani “mwokozi wao” au “anayewaokoa.” “Mwokozi wao” ni fupi, ya asili, na huhifadhi wazo la Mungu katika nafasi ya kuwaokoa.
- source_word: עֹשֶׂה
  choice: aliyefanya
  rationale: Participle hii humfafanua Mungu. Kishazi rejeshi “aliyefanya” ni cha asili katika Kiswahili na kinaonyesha matendo yaliyotangulia kusahauliwa kwake.
- source_word: גְדֹלוֹת
  choice: mambo makuu
  rationale: Neno hili ni kivumishi kilichotumiwa kama nomino ya wingi, likimaanisha matendo au mambo makubwa. “Mambo makuu” ni pana, fasaha, na linafaa kwa matendo ya Mungu katika Misri.
- source_word: בְּמִצְרָיִם
  choice: nchini Misri
  rationale: Kihusishi בְּ kinaonyesha mahali. “Nchini Misri” ni usemi wa kawaida wa Kiswahili kwa matendo yaliyotendeka ndani ya nchi ya Misri.
theological_decisions:
- issue: Tafsiri ya jina la Mungu אֵל
  choice: Mungu
  alternative: Mwenye Nguvu; Mungu Mwenye Nguvu
  rationale: Katika mstari huu אֵל humtambulisha Mungu ambaye Israeli walimsahau; hakuna ulazima wa kuingiza msisitizo maalumu wa nguvu kama sehemu ya jina.
- issue: Maana ya מוֹשִׁיעָם kama jukumu au tendo
  choice: Mwokozi wao
  alternative: aliyewaokoa; Mkombozi wao
  rationale: “Mwokozi wao” huhifadhi muundo wa participle unaoweza kuonyesha Mungu kama yule anayewaokoa, bila kuufanya usemi urejelee tukio moja pekee. Maana mbadala imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka kwa wasomaji wa kawaida huku ikihifadhi jina la wajibu “Mwokozi wao” na mpangilio wa kihistoria wa mstari.
