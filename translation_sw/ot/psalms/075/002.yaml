  text: For when I choose the appointed time[b][a], I myself will judge with uprightness.
translation:
  language: sw
  text: Kwa maana nitakapochagua wakati uliowekwa[a], mimi mwenyewe nitahukumu kwa haki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitakapouchukua wakati uliowekwa”; kitenzi cha Kiebrania kwa kawaida humaanisha “kuchukua,” lakini hapa kinaweza kueleweka kuwa kuchagua wakati maalumu. “Kwa haki” pia inaweza kutafsiriwa “kwa usawa” au “kwa unyofu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaunganisha kauli hii na yaliyotangulia kwa kutoa msingi au maelezo, huku maana ya wakati ikibebwa na kishazi kinachofuata.
- source_word: אֶקַּח
  choice: nitakapochagua
  rationale: Kitenzi hiki kwa msingi humaanisha ‘chukua,’ lakini pamoja na מוֹעֵד kinaashiria kuchagua au kuamua wakati; ‘nitakapochagua’ ni Kiswahili cha kawaida na huhifadhi uhusiano wa wakati katika sentensi.
- source_word: מוֹעֵד
  choice: wakati uliowekwa
  rationale: Neno hilo humaanisha wakati maalumu, ulioteuliwa au uliowekwa; chaguo hili ni wazi kwa msomaji wa sasa.
- source_word: אֲנִי
  choice: mimi mwenyewe
  rationale: Kiwakilishi huru kinasisitiza mhusika zaidi ya alama ya nafsi iliyomo tayari katika kitenzi.
- source_word: מֵישָׁרִים
  choice: kwa unyofu
  rationale: Wingi huu wa nomino unaonyesha unyofu, haki au usawa katika hukumu; ‘kwa unyofu’ huhifadhi sura ya kinomino na maana ya kimaadili na kimahakama.
- source_word: אֶשְׁפֹּט
  choice: nitahukumu
  rationale: Katika muktadha huu kitenzi kinamaanisha kutoa hukumu, na hali yake inaeleweka kwa wakati ujao.
theological_decisions:
- issue: Msemaji na dai la kutoa hukumu
  choice: Kauli imeachwa katika nafsi ya kwanza kama ilivyo katika Kiebrania, bila kumtaja Mungu moja kwa moja ndani ya aya.
  alternative: Kusema wazi, ‘Mungu atasema...’ au kumtambua msemaji katika matini yenyewe.
  rationale: Muktadha wa zaburi humwelekeza msomaji kumwelewa msemaji kuwa Mungu, lakini aya yenyewe hutumia tu vitenzi na kiwakilishi vya nafsi ya kwanza. Tafsiri inahifadhi dai hilo la mamlaka ya kuhukumu bila kuongeza utambulisho usiotajwa wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. ‘Mimi mwenyewe’ huhifadhi msisitizo wa אֲנִי, na ‘unyofu’ hudumisha picha ya jambo lililonyooka huku tanbihi ikitoa maana mbadala ya kimahakama.
