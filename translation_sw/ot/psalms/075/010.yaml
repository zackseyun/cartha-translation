source:
  edition: WLC
  text: וְ/כָל קַרְנֵ֣י רְשָׁעִ֣ים אֲגַדֵּ֑עַ תְּ֝רוֹמַ֗מְנָה קַֽרְנ֥וֹת צַדִּֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/010.yaml
  text: And I will cut off all the horns of the wicked[a], but the horns of the righteous will be lifted up.
translation:
  language: sw
  text: Nami nitazikata pembe zote za waovu[a], lakini pembe za mwenye haki zitainuliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kiebrania, “pembe” ni sitiari ya nguvu, mamlaka, au hadhi iliyoinuliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Nami ... zote
  rationale: וְ huunganisha mstari huu na yaliyotangulia, huku כָּל ikionyesha ujumla. “Nami” ni njia ya asili ya Kiswahili ya kuendeleza kauli ya msemaji katika muktadha huu.
- source_word: קַרְנֵי / קַרְנוֹת
  choice: pembe
  rationale: Neno קֶרֶן humaanisha kihalisi “pembe” na hapa ni sitiari ya nguvu, mamlaka, au hadhi iliyoinuliwa. Kuhifadhi picha halisi kunadumisha ushairi wa Zaburi.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Nomino hii ya wingi inawataja watu waovu kama kundi; “waovu” ni ya kawaida, wazi, na yenye uzito wa kimaadili katika Kiswahili.
- source_word: אֲגַדֵּעַ
  choice: nitazikata
  rationale: Kitenzi גדע humaanisha kukata au kukatilia mbali. “Nitazikata” kinaendana moja kwa moja na picha ya pembe na kuonyesha kuondolewa kabisa kwa nguvu.
- source_word: תְּרוֹמַמְנָה
  choice: zitainuliwa
  rationale: Umbo hili la רום linaonyesha kuinuliwa au kutukuzwa; “zitainuliwa” huhifadhi hali ya kutendwa na picha ya pembe bila kuifafanua kupita kiasi.
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Ingawa ni umoja kimaumbo, צַדִּיק hapa ni mwakilishi wa kundi katika ulinganifu wa kishairi dhidi ya “waovu.” “Mwenye haki” huhifadhi umoja huo wa Kiebrania.
theological_decisions:
- issue: Pembe kama sitiari ya nguvu na hadhi
  choice: Kuhifadhi “pembe” katika maandishi makuu.
  alternative: “Nguvu” au “mamlaka.”
  rationale: Sitiari ya pembe ni picha muhimu ya kibiblia inayoweza kuhusisha nguvu, mamlaka, na hadhi iliyoinuliwa. Kuitafsiri kwa neno moja la dhahania kungepunguza wigo na nguvu ya kishairi.
- issue: Umoja wa צַדִּיק dhidi ya wingi wa רְשָׁעִים
  choice: “mwenye haki” katika umoja.
  alternative: “wenye haki” kama kundi.
  rationale: Umoja wa Kiebrania umehifadhiwa kwa kuwa unaweza kumaanisha mtu mwenye haki kwa ujumla au mwakilishi wa kundi; tafsiri haipaswi kufuta mvutano huo wa kishairi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kishairi lakini unaeleweka kwa urahisi; sitiari ya asili imehifadhiwa na kufafanuliwa katika tanbihi.
