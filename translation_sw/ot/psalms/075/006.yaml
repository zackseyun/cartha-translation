base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/006.yaml
  text: For not from the east or from the west[c][b][a], and not from the wilderness comes lifting up.
translation:
  language: sw
  text: Kwa maana kuinuliwa[a] hakutoki mashariki wala magharibi, wala jangwani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa maana iliyo wazi zaidi, “kupandishwa cheo” au “kutukuzwa.” Kishazi cha Kiebrania ni kifupi na kigumu; mstari unaofuata unafafanua kwamba Mungu humshusha mmoja na kumwinua mwingine.
    reason: lexical_alternative
  - marker: b
    text: Neno la mwisho la Kiebrania limeeleweka pia kuwa “milima,” na hivyo kutoa maana kama, “wala kutoka katika jangwa la milima.” Hata hivyo, muktadha unaunga mkono zaidi maana ya “kuinuliwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza maelezo yanayofafanua kauli iliyotangulia na kudumisha mtiririko wa hoja katika zaburi.
- source_word: מִמּוֹצָא
  choice: mashariki
  rationale: Neno hilo kimsingi huhusishwa na kuchomoza kwa jua; hapa ‘mashariki’ linatoa maana ya upande kwa Kiswahili cha kawaida.
- source_word: וּמִמַּעֲרָב
  choice: wala magharibi
  rationale: מַעֲרָב humaanisha machweo au magharibi. ‘Wala’ linaendeleza kwa ufasaha orodha ya vyanzo vinavyokanushwa.
- source_word: מִמִּדְבַּר
  choice: wala jangwani
  rationale: מִדְבָּר ni eneo la nyika au jangwa; ‘jangwani’ ni la kawaida na linafaa katika mfululizo wa maeneo.
- source_word: הָרִים
  choice: kuinuliwa
  rationale: Katika kishazi hiki kigumu na chenye udondoshaji wa maneno, umbo hilo linaeleweka kwa muktadha kutokana na mzizi רום, ‘kuinua.’ ‘Kuinuliwa’ pia hudumisha uhusiano wa kimatamshi na mstari unaofuata, ambako Mungu humshusha mmoja na kumwinua mwingine.
theological_decisions:
- issue: Maana ya הָרִים mwishoni mwa kishazi kigumu
  choice: Kuelewa kuwa mstari unakanusha kwamba kuinuliwa hutoka katika upande wowote wa kidunia.
  alternative: Kulisoma neno hilo kama ‘milima,’ na kupata maana kama ‘wala kutoka katika jangwa la milima.’
  rationale: Muktadha wa karibu unasema kwamba Mungu ndiye anayemshusha mmoja na kumwinua mwingine. Hivyo ‘kuinuliwa’ linafaa zaidi, lakini usomaji wa ‘milima’ umehifadhiwa katika tanbihi kwa kuwa umbo la Kiebrania linaweza kueleweka hivyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo umefanywa kuwa wa kawaida kwa Kiswahili kwa kuweka ‘kuinuliwa’ mwanzoni, huku urudiaji wa ukanushi kwa ‘wala’ ukihifadhi msisitizo wa Kiebrania.
