  text: אָמַ֣רְתִּי לַֽ֭/הוֹלְלִים אַל תָּהֹ֑לּוּ וְ֝/לָ/רְשָׁעִ֗ים אַל תָּרִ֥ימוּ קָֽרֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/004.yaml
  text: I said to the boastful[a], “Do not boast,” and to the wicked, “Do not lift up your horn.”
translation:
  language: sw
  text: Niliwaambia wenye kujigamba, “Msijigambe,” na waovu, “Msiinue pembe yenu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “msijikweze kwa nguvu zenu” au “msinyanyue kiburi chenu.” “Pembe” ni sitiari ya Kiebrania inayoweza kumaanisha nguvu, mamlaka, au kujikweza.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Niliwaambia
  rationale: Kitenzi cha Qal timilifu, nafsi ya kwanza umoja, kimetafsiriwa kwa wakati uliopita. Kiambishi -wa- kinaonyesha kwa njia ya kawaida ya Kiswahili kwamba maneno yaliwaelekea makundi yaliyotajwa.
- source_word: הוֹלְלִים
  choice: wenye kujigamba
  rationale: Katika muktadha huu neno linawahusu wenye kujisifu au kujikweza. ‘Wenye kujigamba’ ni lugha ya sasa na huhifadhi uhusiano wa kimatamshi na amri inayofuata.
- source_word: אַל תָּהֹלּוּ
  choice: Msijigambe
  rationale: Hii ni amri hasi kwa wingi. Tafsiri hii ni fupi, ya kawaida, na inadumisha urudiaji wa mzizi wa maana uliopo kati ya הוֹלְלִים na תָּהֹלּוּ.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: ‘Waovu’ ni tafsiri ya kawaida ya kundi hili la kimaadili katika Zaburi bila kulifanya kuwa istilahi ya kisheria pekee.
- source_word: אַל תָּרִימוּ
  choice: Msiinue
  rationale: Hii ni amri hasi kwa wingi ya mzizi רום katika Hifili. ‘Msiinue’ huhifadhi kwa karibu tendo la kuinua lililo katika Kiebrania.
- source_word: קָרֶן
  choice: pembe zenu
  rationale: ‘Pembe’ huhifadhi sitiari ya Kiebrania kuhusu nguvu, hadhi, au kujikweza. Ingawa Kiebrania hakina kimilikishi kilicho wazi, ‘zenu’ huonyesha kimilikishi kinachoeleweka katika nahau na kufanya sentensi iwe ya kawaida kwa Kiswahili.
theological_decisions:
- issue: Nguvu ya kisitiari ya קָרֶן (‘pembe’)
  choice: Sitiari imehifadhiwa katika matini kuu kama ‘pembe zenu’.
  alternative: Msijikweze kwa nguvu zenu; msinyanyue kiburi chenu.
  rationale: Pembe katika ushairi wa Kiebrania inaweza kuwakilisha nguvu, mamlaka, hadhi, au kujikweza kwa kiburi. Kuihifadhi huepuka kuchagua maana moja tu na kuondoa mvutano wa kishairi; tanbihi inafafanua upeo wake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Urudiaji ‘wenye kujigamba—msijigambe’ umehifadhiwa ili kuakisi mchezo wa maneno wa Kiebrania.
