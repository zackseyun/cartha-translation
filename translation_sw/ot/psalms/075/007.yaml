  text: Kwa maana Mungu ndiye Mwamuzi:[a] huyu humshusha, na yule humwinua.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu huhukumu.” Kishirikishi cha Kiebrania kinaweza kueleweka kama kitenzi au kama kiarifu cha jina.
    reason: alternative_reading
  - marker: b
    text: 'Kwa halisi katika Kiebrania: “huyu humshusha, na huyu humwinua”; huu ni usemi wa kugawa unaowatofautisha watu wawili.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au msingi wa kauli iliyotangulia; “Kwa maana” ni cha kawaida na chenye hadhi katika Kiswahili.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Muktadha na kiarifu cha umoja vinadai maana ya Mungu mmoja.
- source_word: שֹׁפֵט
  choice: ndiye Mwamuzi
  rationale: Kirai kishirikishi cha Kiebrania kinaweza kueleweka kama cheo au tendo. Tafsiri hii inadumisha uzito wa maana ya jina—Mungu akiwa Mwamuzi—huku tanbihi ikihifadhi uwezekano wa maana ya kitendo.
- source_word: זֶה ... וְזֶה
  choice: huyu ... na yule
  rationale: Marudio ya viashiria yana matumizi ya kugawa watu wawili kwa kulinganisha. Kiswahili “huyu ... na yule” huhifadhi picha halisi ya Kiebrania kwa njia ya asili.
- source_word: יַשְׁפִּיל
  choice: humshusha
  rationale: Hifili ya שׁפל ina maana ya kusababisha kuwa chini. “Humshusha” huhifadhi maana sababishi na sitiari ya juu/chini.
- source_word: יָרִים
  choice: humwinua
  rationale: Hifili ya רום humaanisha kuinua au kutukuza; “humwinua” huhifadhi sitiari ya wima na usambamba na “humshusha.”
theological_decisions:
- issue: Jukumu la Mungu la kuhukumu katika אֱלֹהִים שֹׁפֵט
  choice: Mungu ndiye Mwamuzi
  alternative: Mungu huhukumu
  rationale: Kishirikishi cha Kiebrania kinaruhusu maana ya kijina au ya kitenzi. Matini kuu inahifadhi maana ya jukumu la Mwamuzi bila kuongeza fundisho lisilokuwamo, na tanbihi inaonyesha maana mbadala.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Humshusha/humwinua” hudokeza tendo la kawaida au la kiutawala la Mungu na kuhifadhi usambamba wa kishairi. Alama zote za tanbihi zimewekwa katika matini kuu.
