  text: וַ֭/אֲנִי אַגִּ֣יד לְ/עֹלָ֑ם אֲ֝זַמְּרָ֗ה לֵ/אלֹהֵ֥י יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/009.yaml
  text: But as for me[a], I will declare forever; I will sing praise to the God of Jacob.
translation:
  language: sw
  text: Lakini mimi[a] nitatangaza milele; nitamwimbia Mungu wa Yakobo sifa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nami nitatangaza milele.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa “na,” au katika muktadha huu, “lakini” ili kuonyesha utofautishaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Lakini mimi
  rationale: Kiunganishi pamoja na kiwakilishi huru kinakazia msemaji na kinaweza kuonyesha utofautishaji katika muktadha. Kiswahili cha “Lakini mimi” huleta mkazo huo kwa njia ya kawaida.
- source_word: אַגִּיד
  choice: nitatangaza
  rationale: Hifili ya נגד humaanisha kueleza au kufanya jambo lijulikane. “Nitatangaza” huhifadhi maana ya tamko linalowekwa wazi bila kuongeza maelezo yasiyokuwamo.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Neno hili linaonyesha muda unaoendelea bila kikomo; “milele” ni usemi wa kawaida na wenye hadhi katika Kiswahili cha sasa.
- source_word: אֲזַמְּרָה
  choice: nitamwimbia ... sifa
  rationale: Kitenzi זמר katika piel kina maana ya kuimba au kufanya muziki wa sifa. Muundo huu wa Kiswahili unaonyesha wazi tendo la kuimba na kusudi lake la kusifu.
- source_word: לֵאלֹהֵי
  choice: Mungu wa ... (kama mpokeaji wa sifa katika “nitamwimbia”)
  rationale: ל־ humtambulisha Mungu kuwa mpokeaji wa wimbo wa sifa; kiambishi cha kitendewa “-mw-” katika “nitamwimbia” kinaiwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Jina limeandikwa kwa umbo lake la kawaida la Kiswahili, huku jina la agano “Mungu wa Yakobo” likihifadhiwa.
theological_decisions:
- issue: Mkazo na utofautishaji wa msemaji mwanzoni mwa mstari
  choice: Lakini mimi
  alternative: Nami
  rationale: Kiwakilishi huru אֲנִי kinaweka mkazo kwa msemaji, na kiunganishi kinaweza kusikika kama utofautishaji katika muktadha. Hata hivyo, kwa kuwa ו pia yaweza kuwa kiunganishi cha kawaida, uwezekano huo umehifadhiwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya kishairi; “nitamwimbia ... sifa” ni ya kawaida na inaakisi maana ya muziki wa kusifu.
