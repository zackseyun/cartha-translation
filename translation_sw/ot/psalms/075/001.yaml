base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/001.yaml
  text: We give thanks to you[a], O God; we give thanks, for your name is near[c][b]; your wondrous deeds are recounted.
translation:
  language: sw
  text: Tunakushukuru, Ee Mungu, tunakushukuru, kwa kuwa jina lako liko karibu[a]; watu husimulia matendo yako ya ajabu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Jina lako liko karibu” linaweza kumaanisha ukaribu wa Mungu, uwepo wake unaodhihirika, au tabia na sifa zake zinazojulikana; nahau ya Kiebrania imehifadhiwa bila kufafanuliwa kwa maana moja tu.
    reason: lexical_alternative
  - marker: b
    text: Au, “wanasimulia matendo yako ya ajabu,” au, “matendo yako ya ajabu husimuliwa.” Kiebrania kina kitenzi cha nafsi ya tatu wingi bila kiima kilichotajwa wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִינוּ
  choice: tunakushukuru
  rationale: Hifili ya ידה katika muktadha huu wa zaburi inaeleza kumshukuru au kumsifu Mungu. Kiswahili cha sasa hutumia kwa kawaida “tunakushukuru,” na marudio ya Kiebrania yamehifadhiwa.
- source_word: לְּךָ אֱלֹהִים
  choice: Ee Mungu
  rationale: Kiambishi cha nafsi katika “tunakushukuru” tayari kinaonyesha kwamba shukrani zinaelekezwa kwa Mungu; “Ee Mungu” huhifadhi mwito wa moja kwa moja na mtindo wenye heshima wa sala.
- source_word: וְקָרוֹב
  choice: liko karibu
  rationale: Neno וְ linaweza kuwa “na” au kuonyesha uhusiano wa maelezo. Kwa kuwa Kiswahili hakihitaji kiunganishi cha sababu hapa, alama ya mkato inaacha uhusiano huo wazi bila kuamua kupita kiasi.
- source_word: שְׁמֶךָ
  choice: jina lako
  rationale: “Jina” limehifadhiwa badala ya kufafanuliwa kuwa “uwepo” au “sifa,” ili kudumisha upana wa nahau ya Kiebrania.
- source_word: סִפְּרוּ
  choice: watu husimulia
  rationale: Kitenzi ni nafsi ya tatu wingi bila kiima kilichotajwa. “Watu” huwasilisha kiima cha jumla kisichobainishwa kwa Kiswahili cha kawaida, huku “husimulia” ikidokeza tendo linalofanyika kwa kawaida.
- source_word: נִפְלְאוֹתֶיךָ
  choice: matendo yako ya ajabu
  rationale: Nomino hiyo hurejelea hasa matendo ya Mungu yanayostaajabisha. “Matendo yako ya ajabu” ni wazi, ya asili, na inadumisha dhana ya matendo halisi.
theological_decisions:
- issue: Maana ya “jina lako liko karibu”
  choice: Kuhifadhi nahau hiyo kama “jina lako liko karibu.”
  alternative: “Uwepo wako uko karibu” au “sifa zako zimeenea karibu.”
  rationale: Katika Zaburi, “jina” linaweza kuonyesha tabia ya Mungu iliyofunuliwa, sifa yake, au uwepo wake wa agano. Kiebrania hakilazimishi maana moja tu, hivyo tafsiri inadumisha utata huo wenye maana ya kiteolojia.
- issue: Kiima cha סִפְּרוּ
  choice: Kutumia kiima cha jumla “watu.”
  alternative: “Wanasimulia” au “matendo yako ya ajabu husimuliwa.”
  rationale: Kiebrania kina nafsi ya tatu wingi bila kiima cha wazi. “Watu” hakitambulishi kundi maalumu, bali kinahifadhi hali ya kiima kisichobainishwa kwa lugha ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sala na ushairi ulio wa heshima lakini unaoeleweka kwa wasomaji wa sasa. Marudio ya mwanzo yamehifadhiwa; nahau ya “jina lako” haijafafanuliwa kupita maandishi ya chanzo.
