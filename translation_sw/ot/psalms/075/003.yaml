  yaml_path: translation/ot/psalms/075/003.yaml
  text: The earth and all who dwell in it melt away[a]; I myself have set its pillars firm[c][b]. Selah
translation:
  language: sw
  text: Dunia na wakazi wake wote wanayeyuka[a]; mimi mwenyewe nimeimarisha nguzo zake[b]. Sela[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanayumba,” “wanatoweka,” au “wanatikisika.” Taswira ya Kiebrania inaonyesha kupoteza uthabiti au kuanguka.
    reason: lexical_alternative
  - marker: b
    text: Au “nimezisimamisha nguzo zake.”
    reason: lexical_alternative
  - marker: c
    text: “Sela” limenukuliwa kwa kufuata matamshi ya jadi; maana yake kamili haijulikani.
    reason: cultural_note
lexical_decisions:
- source_word: נְמֹגִים
  choice: wanayeyuka
  rationale: Kitenzi מוג kinaonyesha kuyeyuka, kuvunjika au kupoteza uthabiti. “Wana­yeyuka” huhifadhi taswira hai ya kishairi ya kutokuwa imara.
- source_word: אֶרֶץ
  choice: Dunia
  rationale: Kutajwa kwa wakazi wake wote na nguzo zake kunaelekeza kwenye maana ya ulimwengu mzima, si eneo fulani tu.
- source_word: יֹשְׁבֶיהָ
  choice: wote wanaoishi ndani yake
  rationale: Hutoa maana ya wakazi wote kwa Kiswahili cha kawaida huku ikihifadhi nguvu ya kitenzi cha Kiebrania.
- source_word: אָנֹכִי
  choice: mimi mwenyewe
  rationale: Kiwakilishi huru cha Kiebrania kina mkazo; “mimi mwenyewe” huonyesha mkazo huo bila kudai kwamba hakuna mwingine anayehusika.
- source_word: תִכַּנְתִּי
  choice: nimeziweka imara
  rationale: Katika muktadha wa nguzo, kitenzi kina maana ya kuimarisha, kuthibitisha au kuweka sawasawa. Tafsiri hii inaonyesha tendo la kuzifanya nguzo ziwe thabiti.
- source_word: עַמּוּדֶיהָ
  choice: nguzo zake
  rationale: “Nguzo” huhifadhi moja kwa moja taswira ya kishairi na ya kikosmolojia ya maandishi ya chanzo.
- source_word: סֶּלָה
  choice: Sela
  rationale: Maana kamili ya neno hili haijulikani; limenukuliwa kwa sauti badala ya kupewa maana ya kubahatisha.
theological_decisions:
- issue: Taswira ya kikosmolojia ya nguzo za dunia
  choice: Taswira imehifadhiwa moja kwa moja kama “nguzo zake.”
  alternative: misingi yake; vitegemezo vyake
  rationale: Zaburi hutumia taswira ya kale ya kishairi kueleza uthabiti ambao Mungu huleta. Kuihifadhi huepuka kuifasiri upya kwa mtazamo wa kisayansi au kuondoa mvutano wa taswira ya chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wanaoishi ndani yake” ni wazi kwa wasomaji wa kawaida; “mimi mwenyewe” huhifadhi mkazo wa chanzo. Taswira ya kuyeyuka na ya nguzo imeachwa bila kufafanuliwa kupita kiasi.
