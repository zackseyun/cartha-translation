source:
  edition: WLC
  text: כִּ֤י כ֪וֹס בְּֽ/יַד יְהוָ֡ה וְ/יַ֤יִן חָמַ֨ר מָ֥לֵא מֶסֶךְ֮ וַ/יַּגֵּ֪ר מִ֫/זֶּ֥ה אַךְ שְׁ֭מָרֶי/הָ יִמְצ֣וּ יִשְׁתּ֑וּ כֹּ֝֗ל רִשְׁעֵי אָֽרֶץ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/008.yaml
  text: For a cup is in the hand of Yahweh[a], and the wine foams, full of mixed spices; he pours from it[c][b], and surely all the wicked of the earth will drain its dregs and drink.
translation:
  language: sw
  text: 'Kwa maana kikombe kiko mkononi mwa Yahwe;


    divai inatoa povu, imejaa mchanganyiko[a].


    Yeye humimina kutoka humo,


    na hakika waovu wote duniani


    watayafyonza mashapo yake[b] na kuyanywa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “imechanganywa.” Hii ni divai iliyotayarishwa kwa kuchanganywa, labda na vikolezo.
    reason: lexical_alternative
  - marker: b
    text: “Mashapo” ni masalio mazito yanayotulia chini ya divai. Taswira inaonyesha kwamba waovu watakunywa yaliyomo kikombeni hadi mwisho.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha kuwa picha inayofuata inatoa msingi au maelezo kwa kauli iliyotangulia.
- source_word: כּוֹס
  choice: kikombe
  rationale: Ni kisawe cha kawaida na kinahifadhi taswira ya kishairi bila kuitafsiri wazi kuwa ghadhabu au hukumu.
- source_word: בְּיַד יְהוָה
  choice: mkononi mwa Yahwe
  rationale: Inahifadhi nahau halisi ya Kiebrania inayoonyesha umiliki na mamlaka.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni umbo la kawaida la Kiswahili la jina la agano YHWH na linahifadhi jina binafsi lililo katika chanzo.
- source_word: יַיִן חָמַר
  choice: divai inatoa povu
  rationale: חָמַר hapa inaeleza divai yenye povu au inayochacha; kauli hii inahifadhi picha hai ya chanzo bila kuamua kuwa maana yake ni rangi nyekundu.
- source_word: מָלֵא מֶסֶךְ
  choice: imechanganywa kikamilifu
  rationale: מֶסֶךְ ni mchanganyiko wa divai uliotayarishwa. Tafsiri hii ni ya kawaida kwa Kiswahili na haiongezi viungo fulani ambavyo chanzo hakivitaji wazi.
- source_word: וַיַּגֵּר מִזֶּה
  choice: Yeye humimina kutoka humo
  rationale: Inawasilisha tendo la kumimina kutoka katika kikombe huku mtendaji akieleweka kuwa Yahwe.
- source_word: אַךְ
  choice: hakika
  rationale: Katika muktadha huu neno hilo linasisitiza uhakika wa hukumu, ingawa linaweza pia kuwa na maana ya ‘ila’ au ‘tu’.
- source_word: שְׁמָרֶיהָ
  choice: mashapo yake
  rationale: Ni mabaki mazito ya divai yanayotulia chini ya kikombe; ‘mashapo’ ni neno sahihi na linaloeleweka katika Kiswahili sanifu.
- source_word: יִמְצוּ יִשְׁתּוּ
  choice: watayafyonza ... na kuyanywa
  rationale: Inahifadhi vitenzi viwili vya chanzo na wazo la kumaliza yaliyomo kikombeni kabisa, hata mashapo.
- source_word: כֹּל רִשְׁעֵי אָרֶץ
  choice: waovu wote duniani
  rationale: Ni Kiswahili cha kawaida kinachowasilisha kwa usahihi upeo wa kauli ya Kiebrania.
theological_decisions:
- issue: Jina la Mungu
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kina jina binafsi YHWH. ‘Yahwe’ hulihifadhi wazi badala ya kulibadilisha kuwa cheo, na ni umbo linalotambulika katika Kiswahili.
- issue: Taswira ya kikombe
  choice: Kuacha kikombe na divai kama taswira bila kuongeza ‘ya ghadhabu’ au ‘ya hukumu’
  alternative: kikombe cha ghadhabu ya Mungu
  rationale: Muktadha unaonyesha hukumu ya Mungu, lakini maneno ‘ghadhabu’ na ‘hukumu’ hayamo wazi katika mstari huu. Taswira yenyewe imehifadhiwa ili kutoondoa mvutano wa kishairi.
- issue: Maana ya מֶסֶךְ
  choice: imechanganywa kikamilifu
  alternative: imechanganywa na vikolezo
  rationale: Neno linaonyesha divai iliyotayarishwa kwa kuchanganywa, lakini chanzo hakibainishi bila utata kilichochanganywa ndani yake. Tafsiri kuu haiongezi vikolezo; uwezekano huo unaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Mistari imepangwa kwa mtiririko wa ushairi wa zaburi. ‘Humimina’ inafaa kama kauli ya picha inayoendelea, na ‘watayafyonza ... na kuyanywa’ huhifadhi ukali na ukamilifu wa vitenzi viwili vya Kiebrania.
