lexical_decisions:
- source_word: אַל תָּרִימוּ
  choice: Msiinue
  rationale: Kikanushi אַל pamoja na kitenzi huunda katazo; “msiinue” huhifadhi tendo halisi la kuinua na wingi wa wanaoambiwa.
- source_word: לַמָּרוֹם
  choice: juu
  rationale: Neno מָרוֹם huonyesha mahali pa juu; “juu” ni Kiswahili cha kawaida kinachodumisha taswira ya kujiinua.
- source_word: קַרְנְכֶם
  choice: pembe yenu
  rationale: קֶרֶן maana yake ya moja kwa moja ni “pembe,” na hapa ni sitiari ya nguvu, mamlaka, au kujikweza. Tafsiri inadumisha taswira badala ya kuibadili moja kwa moja kuwa maana mojawapo.
- source_word: תְּדַבְּרוּ
  choice: msiseme
  rationale: דבר ni kusema au kunena; “msiseme” ni katazo la kawaida na lenye hadhi katika Kiswahili cha sasa.
- source_word: בְצַוָּאר
  choice: kwa shingo
  rationale: Kirai hiki kihalisi ni “kwa/na shingo” na kinaeleza namna ya kusema; kudumisha “shingo” kunahifadhi sitiari ya mwili.
- source_word: עָתָק
  choice: yenye kiburi
  rationale: עָתָק hapa hudokeza kiburi, ufidhuli, au ukaidi. “Yenye kiburi” huungana kiasili na “shingo” huku ikiacha taswira ya Kiebrania ionekane.
theological_decisions:
- issue: Maana ya sitiari ya pembe
  choice: Sitiari “pembe” imedumishwa katika matini kuu.
  alternative: Kutafsiri moja kwa moja kuwa “nguvu,” “mamlaka,” au “kiburi.”
  rationale: Kiebrania hakitengi kwa ukamilifu kati ya nguvu, mamlaka, na kujikweza; kudumisha sitiari huzuia kufunga maana kwa tafsiri moja tu.
- issue: Uhusiano wa “shingo” na usemi wa kiburi
  choice: Taswira ya “shingo yenye kiburi” imedumishwa.
  alternative: “Msiseme kwa ukaidi” au “msinene kwa majivuno.”
  rationale: Kiebrania kina sitiari ya kimwili inayoonyesha ukaidi wa kiburi. Tafsiri ya moja kwa moja zaidi huhifadhi mvutano na picha ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na sitiari kuu za Kiebrania—pembe na shingo—zimedumishwa; tanbihi zinafafanua maana bila kuifunga kwa tafsiri moja.
