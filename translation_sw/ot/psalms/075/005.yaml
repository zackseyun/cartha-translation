  language: sw
  text: Msiinue pembe yenu juu[a]; msiseme kwa shingo ya kiburi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pembe” ni sitiari ya nguvu, mamlaka, au kujikweza.
    reason: lexical_alternative
  - marker: b
    text: Au, “msiseme kwa shingo ya ukaidi.” Kiebrania kinadumisha taswira ya mwili inayodokeza kiburi cha ukaidi au ufidhuli.
