  text: 'For the choirmaster: “Do Not Destroy.”[a] A psalm of Asaph[b]. A song.'
translation:
  language: sw
  text: 'Kwa kiongozi wa waimbaji: “Usiharibu.”[a] Zaburi ya Asafu.[b] Wimbo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Huenda hili ni jina la melodi au maelekezo ya muziki: “Usiharibu.”'
    reason: cultural_note
  - marker: b
    text: Maneno “ya Asafu” yanaweza kumaanisha kwamba Asafu ndiye mwandishi, kwamba zaburi inahusishwa naye, au kwamba ni sehemu ya mkusanyo wa Asafu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza wa waimbaji
  rationale: Neno hili katika vichwa vya Zaburi humtaja anayesimamia uimbaji au utendaji wa muziki; tafsiri hii ni ya kawaida na inaeleweka bila kulifanya kuwa cheo maalumu kupita ushahidi wa Kiebrania.
- source_word: אַל תַּשְׁחֵת
  choice: “Usiharibu”
  rationale: Maana ya moja kwa moja ya kauli hii ni katazo la kuharibu, lakini hapa inaelekea kuwa jina la wimbo, kiitikio, au maelekezo ya muziki; alama za kunukuu zinaonyesha matumizi hayo ya kichwa.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ndilo jina la kawaida la utanzu wa מִזְמוֹר katika Kiswahili, na linatunza tofauti yake na שִׁיר inayofuata.
- source_word: לְאָסָף
  choice: ya Asafu
  rationale: Kiambishi לְ katika vichwa vya Zaburi kinaweza kuonyesha utunzi, uhusiano, matumizi, au mkusanyo; “ya Asafu” ni fupi na kinaacha upana huo wazi.
- source_word: שִׁיר
  choice: Wimbo
  rationale: Neno hili ni jina jingine la utanzu. Kulitafsiri peke yake kunahifadhi majina mawili ya Kiebrania, מִזְמוֹר na שִׁיר, badala ya kuyaunganisha.
theological_decisions:
- issue: Uhusiano wa Asafu na zaburi
  choice: ya Asafu
  alternative: iliyoandikwa na Asafu / kwa ajili ya Asafu
  rationale: Kiebrania hakilazimishi maana ya uandishi pekee; tafsiri iliyochaguliwa inadumisha uwezekano wa uandishi, uhusiano, au kuwa sehemu ya mkusanyo unaohusishwa na Asafu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye heshima unaofaa kichwa cha zaburi. “Mwongoza wa waimbaji” limetumiwa badala ya istilahi ya kitaalamu isiyoeleweka kwa urahisi; sentensi fupi tofauti zinahifadhi muundo wa kichwa cha Kiebrania.
