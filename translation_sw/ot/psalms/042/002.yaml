  yaml_path: translation/ot/psalms/042/002.yaml
  text: My soul thirsts for God[a], for the living God. When shall I come and appear before God?
translation:
  language: sw
  text: Nafsi yangu ina kiu ya Mungu, ya Mungu aliye hai. Ni lini nitakapokuja na kuonekana mbele za Mungu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “uso wa Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צָמְאָה
  choice: ina kiu
  rationale: Kitenzi hiki humaanisha kuwa na kiu. Kauli “ina kiu” inadumisha taswira halisi ya kishairi ya hamu kubwa na endelevu.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: Neno נֶפֶשׁ linaweza kumaanisha nafsi, uhai, au mtu mwenyewe. “Nafsi yangu” inadumisha nahau ya Kiebrania na mkazo juu ya utu wa ndani bila kuifupisha kuwa “mimi” tu.
- source_word: לֵאלֹהִים
  choice: ya Mungu
  rationale: Katika nahau ya Kiswahili, “kuwa na kiu ya” hutaja kwa kawaida kitu kinachotamaniwa, hivyo maana ya kihusishi ל katika taswira hii inawasilishwa kwa ufasaha.
- source_word: לְאֵל חָי
  choice: Mungu aliye hai
  rationale: Usemi אֵל חָי humtambulisha Mungu kuwa ndiye aliye hai. Muundo huu ni wa kawaida, wazi, na wenye hadhi katika Kiswahili.
- source_word: מָתַי
  choice: Ni lini
  rationale: Kiulizi hiki huuliza wakati jambo litakapotimia. “Ni lini” kinatoa maana yake ya moja kwa moja bila kuongeza wazo lisilotajwa wazi la “mpaka lini.”
- source_word: אָבוֹא
  choice: nitakapokuja
  rationale: Kauli isiyotimilika katika swali inaelekeza kwenye tendo linalotarajiwa wakati ujao. Muundo wa Kiswahili “Ni lini nitakapokuja” ni wa asili na unaonyesha matarajio hayo.
- source_word: וְאֵרָאֶה
  choice: na kuonekana
  rationale: Umbo la Nifali la ראה hapa linaeleweka kuwa “kuonekana” mbele za Mungu, hasa katika lugha ya kwenda mahali pa ibada. Tafsiri hii inadumisha umbo la maandishi ya WLC badala ya kuligeuza kuwa “kumwona.”
- source_word: פְּנֵי אֱלֹהִים
  choice: mbele za Mungu
  rationale: Kihalisi usemi huu ni “uso wa Mungu,” lakini ni nahau ya kuwa katika uwepo wa Mungu. “Mbele za Mungu” huwasilisha maana hiyo kwa Kiswahili cha kawaida huku tafsiri ya moja kwa moja ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya nahau פְּנֵי אֱלֹהִים
  choice: mbele za Mungu
  alternative: uso wa Mungu; mbele ya uso wa Mungu
  rationale: Muktadha unaonyesha hamu ya kufika katika uwepo wa Mungu, yaelekea kwa ajili ya ibada. “Mbele za Mungu” huwasilisha maana ya nahau bila kuamua kwamba mstari unadai kumwona Mungu kwa macho; maana halisi zaidi imewekwa katika tanbihi.
- issue: Maana ya וְאֵרָאֶה
  choice: na kuonekana
  alternative: na kumwona
  rationale: Uwekaji wa irabu katika WLC unaonyesha umbo la Nifali, “kuonekana.” “Kumwona” huwakilisha usomaji mwingine unaojulikana, lakini haujafuata moja kwa moja umbo la maandishi yaliyotolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi ulio wazi na wenye hadhi. Taswira ya kiu na usemi “nafsi yangu” zimehifadhiwa, huku nahau ya uwepo wa Mungu ikitafsiriwa kwa njia ya kawaida ya Kiswahili.
