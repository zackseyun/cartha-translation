  text: My God[a], my soul is cast down within me; therefore I remember you from the land of the Jordan and the Hermons[d][c][b], from Mount Mizar.
translation:
  language: sw
  text: Mungu wangu, nafsi yangu imeinama ndani yangu; kwa hiyo ninakukumbuka kutoka nchi ya Yordani na milima ya Hermoni[a], kutoka Mlima Misari[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “Hermoni” iko katika umbo la wingi; huenda ikarejelea safu ya Hermoni au vilele vyake.
    reason: lexical_alternative
  - marker: b
    text: “Mlima Misari” huenda ni jina la mahali; au, “mlima mdogo” au “kilima cha Misari.” Pia “ninakukumbuka” inaweza kutafsiriwa “nitakukumbuka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Kiambishi cha nafsi ya kwanza umoja humaanisha ‘Mungu wangu’; Kiswahili hiki pia kinaweza kueleweka kama usemi wa moja kwa moja bila kuongeza kihisishi.
- source_word: עָלַי נַפְשִׁי תִשְׁתּוֹחָח
  choice: nafsi yangu imeinama ndani yangu
  rationale: Huhifadhi taswira ya Kiebrania ya nafsi kuinama huku ‘ndani yangu’ ikitoa maana ya hali ya ndani kwa Kiswahili cha kawaida.
- source_word: עַל־כֵּן
  choice: kwa hiyo
  rationale: Huonyesha matokeo au sababu inayounganisha hali ya kuinama na tendo la kumkumbuka Mungu.
- source_word: אֶזְכָּרְךָ
  choice: ninakukumbuka
  rationale: Kitenzi kisichotimilika kinaweza kueleza tendo la sasa au azimio la wakati ujao; muktadha unaruhusu usemi wa sasa bila kuondoa uwezekano huo.
- source_word: מֵאֶרֶץ יַרְדֵּן
  choice: kutoka nchi ya Yordani
  rationale: Huhifadhi muundo na maana ya eneo linalohusishwa na Yordani.
- source_word: וְחֶרְמוֹנִים
  choice: na milima ya Hermoni
  rationale: Umbo la Kiebrania ni wingi na huenda likarejelea safu au vilele vya Hermoni; ‘milima ya Hermoni’ ni wazi na ya asili katika Kiswahili.
- source_word: מֵהַר מִצְעָר
  choice: kutoka Mlima Mizari
  rationale: Huchukulia Mizari kama jina la mahali katika mlingano na maeneo mengine, bila kuficha uwezekano wa maana ya ‘mlima mdogo.’
