source:
  edition: WLC
  text: כְּ/אַיָּ֗ל תַּעֲרֹ֥ג עַל אֲפִֽיקֵי מָ֑יִם כֵּ֤ן נַפְשִׁ֨/י תַעֲרֹ֖ג אֵלֶ֣י/ךָ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/001.yaml
  text: As a deer longs for streams of water[a], so my soul longs for you[c][b], O God.
translation:
  language: sw
  text: Kama kulungu anavyotamani[a] vijito vya maji[b], ndivyo nafsi yangu[c] inavyokutamani wewe, ee Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “anavyohangaika kwa kiu”; kitenzi cha Kiebrania huonyesha hamu kali kama ya mnyama mwenye kiu.
    reason: lexical_alternative
  - marker: b
    text: Au “mikondo ya maji” au “njia za maji.”
    reason: lexical_alternative
  - marker: c
    text: “Nafsi yangu” inaweza pia kueleweka kuwa “uhai wangu,” “utu wangu wote,” au “mimi mwenyewe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/אַיָּל
  choice: Kama kulungu
  rationale: אַיָּל humaanisha mnyama wa jamii ya kulungu, na mara nyingi kulungu dume. “Kulungu” ni neno la kawaida na linaloeleweka katika Kiswahili, huku כְּ ikiwakilishwa kwa “kama” ili kuanzisha tashbihi.
- source_word: תַּעֲרֹג
  choice: anavyotamani / inavyokutamani
  rationale: Kitenzi ערג huonyesha hamu kali inayoweza kufananishwa na mnyama mwenye kiu anayepumua kwa shida. “Kutamani” ni cha asili katika Kiswahili na kinafaa kwa kitu kinachotamaniwa na pia kwa Mungu anayetafutwa; uzito wa hamu hiyo umeelezwa katika tanbihi.
- source_word: עַל
  choice: vijito vya maji
  rationale: Katika muundo huu, עַל huonyesha kitu kinachotamaniwa. Kiswahili hakihitaji kihusishi tofauti baada ya “kutamani,” hivyo maana yake imejumuishwa moja kwa moja katika muundo wa kitenzi.
- source_word: אֲפִיקֵי מָיִם
  choice: vijito vya maji
  rationale: אֲפִיקִים inaweza kumaanisha mikondo, njia, au mabonde ambamo maji hutiririka. “Vijito vya maji” ni usemi wa kawaida unaohifadhi picha ya maji yanayotiririka na wingi wa Kiebrania.
- source_word: כֵּן
  choice: ndivyo
  rationale: “Ndivyo” linaunganisha kwa ufupi na kwa kawaida sehemu ya pili ya ulinganisho na sehemu ya kwanza.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: נֶפֶשׁ inaweza kumaanisha nafsi, uhai, mtu mwenyewe, au utu wa ndani. “Nafsi yangu” inahifadhi lugha ya kishairi na ya ibada bila kulazimisha mgawanyo mkali wa mwili na roho.
- source_word: אֵלֶיךָ
  choice: inavyokutamani wewe
  rationale: אֵלֶיךָ kwa msingi ni “kuelekea kwako.” Kwa kitenzi “kutamani,” kiambishi cha yambwa “-ku-” huleta Kiswahili cha asili, na “wewe” huhifadhi mkazo na mwelekeo wa kibinafsi wa Kiebrania.
- source_word: אֱלֹהִים
  choice: ee Mungu
  rationale: Hapa Mungu anaambiwa moja kwa moja. “Ee Mungu” huonyesha mwito huo kwa lugha ya sala iliyo ya heshima na ya kishairi.
theological_decisions:
- issue: Wigo wa maana ya נַפְשִׁי
  choice: nafsi yangu
  alternative: uhai wangu; utu wangu wote; mimi mwenyewe
  rationale: Neno la Kiebrania halidai kwa lazima fundisho la kwamba mwanadamu amegawanyika katika sehemu mbili tofauti. Tafsiri “nafsi yangu” inafaa kwa muktadha wa kishairi na wa ibada, huku tanbihi ikihifadhi uwezekano kwamba msemaji anamaanisha uhai wake au utu wake wote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa ibada lakini kinachoeleweka kwa msomaji wa kawaida. Muundo unaorudiwa “anavyotamani … inavyokutamani” unahifadhi ulinganifu wa mstari wa Kiebrania; “wewe” huleta mkazo wa moja kwa moja bila kuongeza wazo la “wewe peke yako,” ambalo halimo wazi katika chanzo.
