base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/010.yaml
  text: As with a shattering in my bones[a], my adversaries taunt me, saying to me all day long, “Where is your God?”
translation:
  language: sw
  text: Kama kuvunjwa kwa mifupa yangu[a], adui zangu wananidhihaki, wakiniambia siku nzima, “Mungu wako yuko wapi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa mauaji ndani ya mifupa yangu, adui zangu wananidhihaki.” Taswira ya Kiebrania ni ngumu; yaweza kumaanisha jeraha la mauti au maumivu makali ya kuponda na kuvunja ndani kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֶצַח
  choice: Kama kuvunjika
  rationale: Nomino רֶצַח kwa kawaida huhusu kuua au mauaji, lakini hapa, ikiunganishwa na ‘mifupani mwangu,’ inaleta taswira ya jeraha kali au maumivu yanayovunja ndani kabisa. ‘Kama kuvunjika’ huhifadhi ukali wa taswira bila kuifanya iwe mauaji halisi.
- source_word: בְּעַצְמוֹתַי
  choice: mifupani mwangu
  rationale: Huhifadhi taswira ya Kiebrania ya maumivu yanayopenya ndani kabisa ya mwili na nafsi.
- source_word: חֵרְפוּנִי
  choice: wananidhihaki
  rationale: Kitenzi חרף huonyesha kushutumu, kutukana, au kudharau kwa maneno. ‘Wananidhihaki’ kinafaa kwa swali lao la kejeli linalofuata.
- source_word: צוֹרְרָי
  choice: watesi wangu
  rationale: Neno hili humaanisha watu wanaompinga na kumfanyia uadui mtunga zaburi. ‘Watesi wangu’ ni la kawaida katika Kiswahili na linaonyesha uhasama wenye kuendelea.
- source_word: בְּאָמְרָם אֵלַי
  choice: wakiniambia
  rationale: 'Muundo huu unaonyesha mazingira na mwelekeo wa maneno yao: wanasema moja kwa moja kwa mtunga zaburi.'
- source_word: כָּל הַיּוֹם
  choice: mchana kutwa
  rationale: Nahau hii ya Kiswahili huwasilisha hali ya kurudiwa-rudiwa siku nzima kwa lugha ya kawaida na yenye hadhi.
- source_word: אַיֵּה אֱלֹהֶיךָ
  choice: Mungu wako yuko wapi?
  rationale: Huhifadhi changamoto ya moja kwa moja na ya kejeli kuhusu kuwapo au msaada wa Mungu bila kuongeza maelezo ya kitheolojia.
theological_decisions:
- issue: Changamoto ya watesi kuhusu Mungu
  choice: Mungu wako yuko wapi?
  alternative: Basi, Mungu wako yuko wapi?
  rationale: Tafsiri rahisi huhifadhi ukali wa kejeli na mvutano wa maombolezo bila kueleza au kutatua kimya cha Mungu.
- issue: Taswira tata ya בְּרֶצַח בְּעַצְמוֹתַי
  choice: Kama kuvunjika mifupani mwangu
  alternative: Kama mauaji mifupani mwangu
  rationale: Maana ya msingi ya רֶצַח na matumizi yake ya kishairi hapa yana mvutano halisi. Matini kuu inatoa taswira inayoeleweka ya maumivu makali, huku tanbihi ikihifadhi uwezekano wa tafsiri ya karibu zaidi na ‘mauaji.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa kwa lugha inayoeleweka; tanbihi inadumisha utata halisi wa kishazi cha kwanza.
