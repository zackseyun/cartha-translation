base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/007.yaml
  text: Deep calls to deep at the sound of your waterfalls[b][a]; all your breakers and your waves have passed over me.
translation:
  language: sw
  text: Kilindi hukiita kilindi kwa mlio wa maporomoko yako ya maji[a]; mawimbi yako yote yanayopasuka na mawimbi yako yote yamepita juu yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mifereji yako ya maji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהוֹם ... תְּהוֹם
  choice: Kilindi ... kilindi
  rationale: “Kilindi” huonyesha kina kikubwa cha maji na kuhifadhi urudiaji pamoja na nguvu ya kishairi ya Kiebrania bila kulazimisha maana ya kikosmolojia.
- source_word: קוֹרֵא
  choice: chakiita
  rationale: Umbo la kitenzi linatoa taswira hai ya kilindi kimoja kukiita kingine; “chakiita” ni la moja kwa moja na la sasa katika muktadha huu wa kishairi.
- source_word: לְקוֹל
  choice: kwa sauti ya
  rationale: Kauli hii inaonyesha mazingira au kichocheo cha sauti kinachohusishwa na mwito, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: צִנּוֹרֶיךָ
  choice: maporomoko yako ya maji
  rationale: Neno linaweza kumaanisha mifereji au mikondo ya maji; hapa taswira ya maji yenye kishindo na yanayofunika inaelezwa kwa urahisi zaidi kama “maporomoko ya maji.”
- source_word: כָּל
  choice: yote
  rationale: Limehifadhiwa ili kuonyesha ujumla na uzito kamili wa dhiki ya msemaji.
- source_word: מִשְׁבָּרֶיךָ
  choice: mawimbi yako yote yanayovunjika
  rationale: Neno humaanisha mawimbi yanayopasuka au kuvunjika; ufafanuzi huu ni wa kawaida zaidi katika Kiswahili kuliko nomino maalumu isiyoeleweka kwa urahisi.
- source_word: וְגַלֶּיךָ
  choice: na mawimbi yako
  rationale: “Mawimbi” ni tafsiri ya moja kwa moja na ya kawaida ya גַּל, huku urudiaji ukihifadhi uwingi wa picha ya bahari.
- source_word: עָלַי
  choice: juu yangu
  rationale: Pamoja na kitenzi “kupita,” kauli hii huhifadhi picha ya maji yakipita juu ya msemaji.
- source_word: עָבָרוּ
  choice: yamepita
  rationale: Wakati timilifu unaonyesha jambo lililotokea na kuonwa na msemaji; “yamepita” huhifadhi maana ya msingi bila kuongeza wazo la kufagiliwa.
