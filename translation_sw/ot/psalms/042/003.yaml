  yaml_path: translation/ot/psalms/042/003.yaml
  text: My tears have been my bread day and night[a], while they say to me all day long, “Where is your God?”
translation:
  language: sw
  text: Machozi[a] yangu yamekuwa mkate wangu mchana na usiku, huku wakiniambia kutwa nzima, “Yuko wapi Mungu wako?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “chozi langu”; umoja huo unaweza kutumika kwa maana ya machozi kwa jumla.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיְתָה לִּי
  choice: yamekuwa ... changu
  rationale: Muundo wa היה + ל unaonyesha kile ambacho machozi yamekuwa au yamefanya kazi kama kitu fulani kwa msemaji; Kiswahili cha sasa huwasilisha maana hiyo kwa kawaida kwa ‘yamekuwa ... changu.’
- source_word: דִמְעָתִי
  choice: machozi yangu
  rationale: Ingawa neno la Kiebrania lina umbo la umoja, hapa linaweza kutumika kwa maana ya jumla; wingi ‘machozi’ ni wa kawaida katika Kiswahili na unafaa muktadha wa maombolezo.
- source_word: לֶחֶם
  choice: chakula
  rationale: Kiebrania ‘mkate’ pia hutumiwa kwa maana ya chakula kwa ujumla. ‘Chakula’ huifanya taswira ieleweke kiasili katika Kiswahili bila kupoteza wazo kwamba machozi yamechukua nafasi ya riziki ya mwimbaji.
- source_word: יוֹמָם וָלָיְלָה
  choice: mchana na usiku
  rationale: Huu ni usemi unaoonyesha muda unaoendelea; ‘mchana na usiku’ ni wa kawaida, wazi, na mwaminifu kwa Kiebrania.
- source_word: בֶּאֱמֹר אֵלַי
  choice: huku wakiniambia
  rationale: ב pamoja na kitenzi-jina huonyesha tendo linalotokea wakati mmoja na tendo kuu. ‘Huku wakiniambia’ huhifadhi hali hiyo inayoendelea na mwelekeo wa maneno kwa msemaji.
- source_word: כָּל הַיּוֹם
  choice: kutwa nzima
  rationale: Usemi huu unasisitiza kejeli inayorudiwa au kuendelea siku yote; ‘kutwa nzima’ ni Kiswahili sanifu na chenye nguvu ya asili.
- source_word: אַיֵּה אֱלֹהֶיךָ
  choice: Yuko wapi Mungu wako?
  rationale: Swali la moja kwa moja linahoji kuwapo au msaada wa Mungu unaoonekana. ‘Yuko wapi’ ni muundo wa kawaida kwa nafsi, huku ‘Mungu wako’ ikihifadhi kiambishi cha nafsi ya pili umoja.
theological_decisions:
- issue: Asili ya swali la wanaomdhihaki
  choice: Kuhifadhi swali la moja kwa moja, “Yuko wapi Mungu wako?” kama kejeli kuhusu kutokuonekana kwa Mungu.
  alternative: Kulifafanua zaidi kuwa, “Mungu wako amepatwa na nini?”
  rationale: Kiebrania huuliza moja kwa moja mahali Mungu alipo. Tafsiri hii huhifadhi mvutano wa kitheolojia wa Mungu kuonekana kutokuwapo bila kueleza zaidi ya matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi taswira ya kishairi na kejeli ya moja kwa moja; ‘kutwa nzima’ ni ya kawaida lakini si ya mazungumzo mepesi kupita kiasi.
