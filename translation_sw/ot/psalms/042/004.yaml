  text: אֵ֤לֶּה אֶזְכְּרָ֨ה וְ/אֶשְׁפְּכָ֬ה עָלַ֨/י נַפְשִׁ֗/י כִּ֤י אֶֽעֱבֹ֨ר בַּ/סָּךְ֮ אֶדַּדֵּ֗/ם עַד בֵּ֥ית אֱלֹ֫הִ֥ים בְּ/קוֹל רִנָּ֥ה וְ/תוֹדָ֗ה הָמ֥וֹן חוֹגֵֽג׀׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/004.yaml
  text: 'These things I remember[a], and I pour out my soul within me: how I used to pass along with the throng, leading them to the house of God with the sound of joyful shouting and thanksgiving[b], a festal multitude.'
translation:
  language: sw
  text: 'Mambo haya ninayakumbuka, nami naimwaga nafsi yangu ndani yangu: jinsi nilivyokuwa nikienda pamoja na umati[a], nikiwaongoza[b] hadi kwenye nyumba ya Mungu, kwa sauti ya shangwe na shukrani—umati uliokuwa ukisherehekea sikukuu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika msafara.” Neno la Kiebrania בַּסָּךְ ni gumu kufasiri; huenda linamaanisha umati uliokusanyika kwa ajili ya sikukuu au kundi lenyewe lililokuwa likienda kwa msafara.
    reason: lexical_alternative
  - marker: b
    text: Au, “nikienda pamoja nao” au “nikiwaelekeza.” Kitenzi cha Kiebrania אֶדַּדֵּם ni adimu, na maana yake kamili haina uhakika, ingawa muktadha unaonyesha kusafiri pamoja na wengine kuelekea nyumba ya Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה אֶזְכְּרָה
  choice: Mambo haya ninayakumbuka
  rationale: Kiwakilishi cha wingi אֵלֶּה kinarejelea mambo anayoyakumbuka mtunga zaburi; wakati wa sasa unaonyesha ukumbusho unaoendelea katika maombolezo haya.
- source_word: וְאֶשְׁפְּכָה עָלַי נַפְשִׁי
  choice: nami naimwaga nafsi yangu ndani yangu
  rationale: Usemi wa kishairi wa Kiebrania umehifadhiwa kwa kiasi kikubwa ili kuonyesha kumimina huzuni ya ndani bila kuibadili kuwa maelezo ya kawaida tu ya hisia.
- source_word: כִּי אֶעֱבֹר
  choice: jinsi nilivyokuwa nikienda
  rationale: כִּי hapa inaanzisha yaliyomo katika kumbukumbu, na umbo la kitenzi linafaa kutafsiriwa kama tendo la mazoea la wakati uliopita.
- source_word: בַּסָּךְ
  choice: pamoja na umati
  rationale: Nomino hii ni ngumu kufasiri, lakini muktadha wa kwenda kwenye nyumba ya Mungu wakati wa sikukuu unaunga mkono maana ya kundi au msafara wa waabudu.
- source_word: אֶדַּדֵּם
  choice: nikiwaongoza
  rationale: Kitenzi hiki adimu kina kiambishi kinachorejelea watu wengi; huenda kinamaanisha kuwaongoza, kwenda pamoja nao, au kuwaelekeza katika msafara.
- source_word: עַד בֵּית אֱלֹהִים
  choice: hadi kwenye nyumba ya Mungu
  rationale: Tafsiri hii inahifadhi mwelekeo wa safari ya ibada na usemi wa chanzo 'nyumba ya Mungu' bila kuutaja moja kwa moja kuwa hekalu.
- source_word: בְּקוֹל רִנָּה וְתוֹדָה
  choice: kwa sauti za shangwe na shukrani
  rationale: רִנָּה ni kilio cha furaha kinachosikika, na תוֹדָה ni shukrani au sifa; wingi wa Kiswahili unasikika kwa kawaida katika taswira ya umati.
- source_word: הָמוֹן חוֹגֵג
  choice: umati uliokuwa ukisherehekea sikukuu
  rationale: חוֹגֵג inaonyesha kushika au kusherehekea sikukuu, si furaha ya jumla pekee.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka kwa msomaji wa kawaida. Muundo wa 'naimwaga nafsi yangu ndani yangu' umeachwa kwa makusudi ili kuhifadhi picha ya kishairi na mvutano wa usemi wa Kiebrania; hali ya kutokuwa na uhakika katika maneno בַּסָּךְ na אֶדַּדֵּם imeonyeshwa katika tanbihi.
