base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/011.yaml
  text: Why are you cast down[a], my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him[b], the salvation of my countenance and my God.
translation:
  language: sw
  text: Kwa nini umeinama, nafsi yangu, na kwa nini unafadhaika ndani yangu? Mngojee Mungu kwa tumaini, kwa maana bado nitamsifu—yeye ndiye wokovu wa uso wangu[a] na Mungu wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “wokovu (au maokozi) wa uso wangu.” Huenda ikimaanisha kwamba wokovu wa Mungu huuinua uso wangu uliokuwa umeinama; pia inaweza kutafsiriwa, “msaada wa uso wangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: umeinama
  rationale: Kitenzi kinaonyesha kuinamishwa au kushuka moyo. “Umeinama” huhifadhi taswira ya kishairi huku kikieleweka katika Kiswahili cha kawaida.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: Katika kujisemeza huku, נֶפֶשׁ ni utu wa ndani; “nafsi yangu” huhifadhi sauti ya kishairi na tafakari binafsi.
- source_word: תֶּהֱמִי
  choice: unafadhaika
  rationale: Kitenzi huonyesha msukosuko, kelele, au hali ya kutotulia. “Unafadhaika” huwasilisha kwa kawaida msukosuko wa ndani bila kuondoa uzito wake.
- source_word: עָלַי
  choice: ndani yangu
  rationale: Ingawa kihalisi ni “juu yangu,” hapa ni nahau ya nafsi kusumbuka ndani ya msemaji; “ndani yangu” ni ya kawaida na wazi.
- source_word: הוֹחִילִי
  choice: mngojee ... kwa tumaini
  rationale: Hiphil ya יחל inajumuisha kusubiri kwa matarajio na kutumaini. Usemi huu huhifadhi vipengele vyote viwili.
- source_word: לֵאלֹהִים
  choice: Mungu
  rationale: Mungu ndiye mlengwa wa kungoja kwa tumaini; muundo “mngojee Mungu” ni wa kawaida katika Kiswahili.
- source_word: עוֹד
  choice: bado
  rationale: Neno linaelekeza kwenye sifa ya wakati ujao licha ya dhiki ya sasa; “bado” huhifadhi uhakika huo.
- source_word: אוֹדֶנּוּ
  choice: nitamsifu
  rationale: Hiphil ya ידה katika zaburi kwa kawaida humaanisha kusifu au kushukuru; “nitamsifu” inafaa muktadha wa ibada.
- source_word: יְשׁוּעוֹת
  choice: wokovu
  rationale: Ingawa umbo la Kiebrania ni wingi, linaweza kutumika kwa maana ya dhahania au mkazo. “Wokovu” huhifadhi dhana ya ukombozi wa Mungu.
- source_word: פָּנַי
  choice: uso wangu
  rationale: Tafsiri halisi huhifadhi taswira thabiti ya uso ulioshuka moyo unaorejeshwa na wokovu wa Mungu.
- source_word: וֵאלֹהָי
  choice: na Mungu wangu
  rationale: Muundo wa kujumlisha huhifadhi kilele cha ungamo la kibinafsi katika Kiebrania.
theological_decisions:
- issue: Tafsiri ya יְשׁוּעוֹת פָּנַי
  choice: wokovu wa uso wangu
  alternative: msaada unaoniinua / wokovu unaonifanya niinue uso
  rationale: Kifungu cha Kiebrania ni kifupi na kina utata wa kishairi. Tafsiri kuu huhifadhi taswira halisi na mvutano wake badala ya kuifafanua kimadhehebu au kuamua kimya kwamba ni nahau moja tu. Tanbihi inaeleza maana inayowezekana katika Kiswahili cha kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka. “Nafsi yangu” na “umeinama” hudumisha kujisemeza na taswira ya zaburi; “mngojee Mungu kwa tumaini” hudumisha kusubiri pamoja na kutumaini.
