base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/005.yaml
  text: Why are you cast down[a], O my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him, the salvation of my countenance and my God.
translation:
  language: sw
  text: Kwa nini umeinama, ee nafsi yangu, na kwa nini unafadhaika ndani yangu? Mtumaini Mungu, kwa maana bado nitamsifu kwa wokovu wa uwepo wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “misaada ya uso wake” au “wokovu wa uso wake.” Katika Kiebrania, “uso” mara nyingi huweza kumaanisha uwepo wa mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: umeinama kwa huzuni
  rationale: Kitenzi kina picha ya kuinama au kushushwa chini na pia huonyesha hali ya kuvunjika moyo. Kauli hii inadumisha picha hiyo huku ikifanya maana ya kihisia ieleweke kwa Kiswahili cha sasa.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: Katika kujisemea kwa kishairi, נֶפֶשׁ humaanisha utu wa ndani. “Nafsi yangu” ni ya asili katika lugha ya Zaburi na haiingizi kwa lazima nadharia maalumu kuhusu muundo wa mwanadamu.
- source_word: וַתֶּהֱמִי
  choice: unafadhaika
  rationale: Mzizi huu unaweza kuonyesha kuvuma, kujaa ghasia, au kutulia vibaya. “Unafadhaika” huwasilisha msukosuko wa ndani kwa lugha ya kawaida bila kuondoa uzito wa maombolezo.
- source_word: עָלָי
  choice: ndani yangu
  rationale: Ingawa maana ya msingi ni “juu yangu,” katika usemi huu nafsi ya mshairi inamsumbua ndani yake. “Ndani yangu” huwasilisha maana ya kimuktadha kwa ufasaha.
- source_word: הוֹחִילִי לֵאלֹהִים
  choice: Mtumaini Mungu
  rationale: Amri hii inaita nafsi imngojee Mungu kwa matarajio yenye imani. “Mtumaini Mungu” ni fupi, ya kawaida, na hudumisha vipengele vya kutegemea na kutarajia.
- source_word: עוֹד אוֹדֶנּוּ
  choice: bado nitamsifu
  rationale: עוֹד hutazama mbele licha ya dhiki ya sasa, na Hifili ya ידה hapa ina maana ya kumsifu au kumshukuru Mungu. Kauli hii huhifadhi tumaini la wakati ujao.
- source_word: יְשׁוּעוֹת פָּנָיו
  choice: wokovu unaotoka katika kuwapo kwake
  rationale: Kiebrania kinasema kihalisi “wokovu mbalimbali wa uso wake.” Hapa “uso” kwa kawaida humaanisha kuwapo kwa Mungu, na wingi unaweza kuwa wa mkazo au kuonyesha matendo ya kuokoa. Tafsiri hii ni ya asili kwa Kiswahili huku taswira halisi ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya יְשׁוּעוֹת פָּנָיו katika kifungu cha mwisho
  choice: wokovu unaotoka katika kuwapo kwake
  alternative: wokovu mbalimbali wa uso wake; msaada wa uso wake
  rationale: Matini ya Kimasora iliyotolewa ina פָּנָיו, “uso wake,” si “uso wangu,” wala haina “na Mungu wangu” katika mstari huu. Tafsiri iliyochaguliwa inaeleza nahau ya uso kama kuwapo kwa Mungu bila kufuta taswira na wingi wa Kiebrania, ambazo zimeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Usemi “umeinama kwa huzuni” unadumisha sitiari ya Kiebrania; “ee nafsi yangu” hudumisha kujisemea kwa kishairi.
