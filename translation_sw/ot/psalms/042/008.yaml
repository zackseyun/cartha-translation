base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/008.yaml
  text: By day Yahweh commands his steadfast love[b][a], and at night his song is with me— a prayer to the God of my life.
translation:
  language: sw
  text: Mchana Yahweh huamuru upendo wake wa kudumu, na usiku wimbo wake huwa pamoja nami[b]—sala kwa Mungu wa uhai wangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu anayenipa uhai.” Kiebrania kinasema kwa karibu zaidi, “Mungu wa uhai wangu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wimbo kwake huwa pamoja nami,” ikiwa שירה linaeleweka kuwa “wimbo kwake” badala ya “wimbo wake.”
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹמָם
  choice: Mchana
  rationale: Ni kielezi cha wakati kinacholingana kwa ufupi na kishazi sambamba ‘na usiku.’
- source_word: יְצַוֶּה
  choice: huamuru
  rationale: Piel ya צוה ina maana ya kuamuru; kauli hii inadumisha taswira hai ya Yahweh akiuelekeza upendo wake.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חסד huonyesha upendo mwaminifu, wa kudumu, wenye rehema; ‘upendo thabiti’ ni usemi wa kawaida unaohifadhi uzito huo.
- source_word: וּבַלַּיְלָה
  choice: na usiku
  rationale: Hudumisha ulinganifu wa nyakati na kiunganishi cha kawaida, bila kuingiza utofauti wa kiuadui.
- source_word: שירה
  choice: wimbo wake
  rationale: Maandishi yanaweza kueleweka kuwa ‘wimbo wake,’ huku usomaji ‘wimbo kwake’ ukibaki uwezekano na kuwekwa katika tanbihi.
- source_word: עִמִּי
  choice: huwa pamoja nami
  rationale: Kitenzi kishirikishi kilichoongezwa ni cha lazima katika Kiswahili na kinaonyesha kuandamana au kuwapo.
- source_word: תְּפִלָּה
  choice: sala
  rationale: Neno hili linafafanua wimbo kuwa sala inayoelekezwa kwa Mungu.
- source_word: לְאֵל
  choice: kwa Mungu
  rationale: Kihusishi ל kinaonyesha anayeelekezewa sala; ‘kwa Mungu’ ni Kiswahili cha kawaida katika muktadha huu.
- source_word: חַיָּי
  choice: wa uhai wangu
  rationale: Umbo lenye kiambishi cha nafsi ya kwanza linamaanisha ‘uhai wangu,’ si kivumishi ‘aliye hai.’
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina maalumu la Mungu; kulihifadhi kama Yahweh huepuka kulibadilisha kuwa cheo.
- issue: Maana ya חַיָּי katika לְאֵל חַיָּי
  choice: Mungu wa uhai wangu
  alternative: Mungu anayenipa uhai
  rationale: Tafsiri kuu inadumisha muundo wa Kiebrania na kutoamua kimyakimya jinsi uhusiano huo wa uhai unavyopaswa kufafanuliwa.
- issue: Uhusiano wa שירה
  choice: wimbo wake
  alternative: wimbo kwake
  rationale: Usomaji mkuu hufuata uwezekano wa maana ya umilikaji unaolingana na ‘upendo wake,’ lakini utata halisi umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa mchana/usiku na utata wa kishazi cha ‘wimbo’ vimehifadhiwa.
