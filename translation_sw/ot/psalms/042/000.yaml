lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza wa waimbaji
  rationale: Katika vichwa vya zaburi, neno hili humaanisha mwenye jukumu la kuongoza uimbaji au muziki. “Kwa” huhifadhi maana inayowezekana ya kukabidhiwa au kuelekezwa kwake, bila kuifanya iwe ya uhakika kabisa.
- source_word: מַשְׂכִּיל
  choice: Maskili
  rationale: Hili ni neno la kitaalamu katika vichwa vya zaburi ambalo maana yake kamili haijulikani kwa uhakika. Kulitohoa kuwa “Maskili” huepuka kulazimisha tafsiri kama “wimbo wa mafundisho” au “utenzi wa kutafakari.”
- source_word: לִבְנֵי
  choice: ya wana wa
  rationale: Kiambishi ל־ katika vichwa vya zaburi kinaweza kuonyesha utunzi, uhusiano, kukabidhiwa, au watendaji. “Ya wana wa” ni usemi mpana unaohifadhi kiasi cha utata huo.
- source_word: קֹרַח
  choice: Kora
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
theological_decisions:
- issue: Uhusiano wa zaburi na wana wa Kora
  choice: ya wana wa Kora
  alternative: kwa ajili ya wana wa Kora
  rationale: Kiebrania hakibainishi kwa uhakika kama wana wa Kora ndio watunzi, kundi linalohusishwa nayo, au waimbaji waliokusudiwa; matini na tanbihi zinahifadhi uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa msomaji wa kawaida. Neno la kiufundi “Maskili” limehifadhiwa kwa sababu maana ya מַשְׂכִּיל haijathibitishwa; tanbihi hulifafanua. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika.
