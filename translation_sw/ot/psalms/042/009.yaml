  text: אוֹמְרָ֤ה לְ/אֵ֥ל סַלְעִ/י֮ לָ/מָ֪ה שְׁכַ֫חְתָּ֥/נִי לָֽ/מָּה קֹדֵ֥ר אֵלֵ֗ךְ בְּ/לַ֣חַץ אוֹיֵֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/009.yaml
  text: I say to God[a], my rock, “Why have you forgotten me? Why do I go about mourning under the oppression of the enemy?”
translation:
  language: sw
  text: 'Nitamwambia Mungu, mwamba wangu: “Kwa nini umenisahau? Kwa nini natembea nikiomboleza[a] huku nikionewa na adui?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nikiwa na huzuni.”
    reason: Kiebrania קֹדֵר kinaweza kueleza kuomboleza au kuwa katika hali ya giza na huzuni.
lexical_decisions:
- source_word: אוֹמְרָה
  choice: Nitamwambia
  rationale: Kitenzi hiki cha nafsi ya kwanza katika hali ya kohortativi kinaweza kuonyesha azimio au usemi unaoanza sasa. “Nitamwambia” huhifadhi wazo la azimio kwa Kiswahili cha kawaida.
- source_word: לְאֵל
  choice: Mungu
  rationale: אֵל hapa ni jina la cheo la kawaida la Mungu, si jina maalumu; kiambishi cha yambwa katika “Nitamwambia” kinawasilisha לְ kwa njia ya asili.
- source_word: סַלְעִי
  choice: mwamba wangu
  rationale: Tafsiri hii inadumisha sitiari ya Mungu kuwa mahali imara pa usalama, bila kuifafanua na hivyo kuipunguza kuwa “kimbilio langu.”
- source_word: שְׁכַחְתָּנִי
  choice: umenisahau
  rationale: Kauli ya wakati timilifu inaeleza hali ambayo matokeo yake yanaendelea; “umenisahau” ni ya asili na haiipanui maana kuwa kuachwa kabisa.
- source_word: קֹדֵר
  choice: nikiomboleza
  rationale: Kishiriki hiki kinaweza kumaanisha kuwa na giza au huzuni, na kwa upanuzi kuomboleza. Katika maombolezo haya, “nikiomboleza” hueleza kwa kawaida hali ya mtunga zaburi anapoendelea kwenda.
- source_word: אֵלֵךְ
  choice: natembea
  rationale: הלך humaanisha kwenda au kutembea. Wakati wa sasa unaonyesha hali inayoendelea bila kuingiza wazo lisilotajwa la kulazimishwa.
- source_word: בְּלַחַץ אוֹיֵב
  choice: huku nikionewa na adui
  rationale: לַחַץ ni shinikizo au uonevu; בְּ inaweza kuonyesha hali au sababu. Muundo huu wa Kiswahili unaonyesha mazingira ya uonevu kwa lugha ya kawaida huku ukihifadhi adui katika umoja wa kijumla.
theological_decisions:
- issue: Sitiari ya Mungu katika סַלְעִי
  choice: mwamba wangu
  alternative: kimbilio langu
  rationale: Sitiari ya asili imehifadhiwa ili kuonyesha uimara na ulinzi wa Mungu bila kuitafsiri kwa maelezo yanayofuta taswira ya kishairi.
- issue: Malalamiko kwamba Mungu amemsahau mtunga zaburi
  choice: Kwa nini umenisahau?
  alternative: Kwa nini inaonekana kana kwamba umenisahau?
  rationale: Kauli ya moja kwa moja ya maombolezo imehifadhiwa bila kuilainisha kwa sababu za kiteolojia; hivyo mvutano wa imani inayomlilia Mungu unabaki wazi.
- issue: Maana ya קֹדֵר
  choice: nikiomboleza
  alternative: nikiwa na huzuni
  rationale: Maana ya kuomboleza inafaa muktadha, lakini uwezekano wa kueleza hali ya giza au huzuni pia ni halisi na umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ya pili imetungwa kwa mtiririko wa kawaida wa Kiswahili, huku lugha ya maombolezo na taswira ya “mwamba” vikihifadhiwa.
