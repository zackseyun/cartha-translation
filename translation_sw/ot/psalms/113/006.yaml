translation:
  language: sw
  text: ambaye hujishusha kutazama mbinguni na duniani[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “anayejinyenyekeza ili aone mbinguni na duniani.”
    reason: Mbadala huu unaonyesha kwa uwazi zaidi maana ya kujifanya kuwa chini katika הַמַּשְׁפִּילִי, ingawa unaweza kusikika kama unyenyekevu wa kimaadili.
lexical_decisions:
- source_word: הַמַּשְׁפִּילִי
  choice: ambaye hujishusha
  rationale: Umbo la Hifili la שׁפל linaonyesha kujifanya kuwa chini au kushuka. Katika muktadha wa kuinuliwa kwa Mungu katika mstari uliotangulia, “hujishusha” linahifadhi picha hai ya Mungu aliye juu akiinama kuelekea vilivyo chini bila kulifanya kuwa kauli ya jumla tu kuhusu kujali.
- source_word: לִרְאוֹת
  choice: kutazama
  rationale: 'Kitenzi-jina cha ראה kinaonyesha kusudi: anajishusha apate kuona. “Kutazama” ni Kiswahili cha kawaida chenye maana ya kuelekeza macho au kuangalia kwa makini.'
- source_word: בַּשָּׁמַיִם
  choice: mbinguni
  rationale: שׁמים hapa lina maana ya anga za juu katika taswira ya ulimwengu mzima. “Mbinguni” ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: וּבָאָרֶץ
  choice: na duniani
  rationale: אָרֶץ ni upande wa chini unaolinganishwa na mbingu. Jozi “mbinguni na duniani” inahifadhi upana wa kishairi wa viumbe vyote na viambishi vya mahali vya Kiebrania.
theological_decisions:
- issue: Taswira ya kibinadamu kuhusu ukuu wa Mungu na kujishusha kwake
  choice: Kuhifadhi taswira kwa kusema “hujishusha”
  alternative: “hujinyenyekeza ili aone” au kauli tambarare kama “huangalia”
  rationale: Mstari unasisitiza kwamba Mungu ameinuliwa sana kiasi kwamba hata kutazama mbingu na dunia ni kujishusha kwake. Tafsiri hii inadumisha mvutano wa kishairi kati ya ukuu wake na kujishusha kwake bila kuamua kwamba neno hilo lazima lieleze unyenyekevu wa kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo mfupi, wa kishairi na wenye hadhi. “Hujishusha” ni wa kawaida na huhifadhi taswira, huku “mbinguni na duniani” ikiwa jozi asilia ya Kiswahili.
