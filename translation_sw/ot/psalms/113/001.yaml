  text: הַ֥לְלוּ יָ֨הּ הַ֭לְלוּ עַבְדֵ֣י יְהוָ֑ה הַֽ֝לְלוּ אֶת שֵׁ֥ם יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/001.yaml
  text: Praise Yah! Praise[a], servants of Yahweh[b]; praise the name of Yahweh.
translation:
  language: sw
  text: Msifuni Yah[a]! Msifuni, enyi watumishi[b] wa Yahweh; lisifuni jina la Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yah” ni umbo fupi la jina la Mungu; mwito wa Kiebrania Halelu-Yah humaanisha kihalisi “Msifuni Yah.”
    reason: lexical_alternative
  - marker: b
    text: Au “watumwa”; neno la Kiebrania linaweza kutaja walio katika utumishi au utumwa, lakini hapa “watumishi” linafaa zaidi katika mwito wa ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ
  choice: msifuni / lisifuni
  rationale: Ni agizo la wingi la kitenzi הלל katika piel. Kiswahili hutumia viambishi vya yambwa vinavyopatana na anayesifiwa au kinachosifiwa; kwa hiyo “msifuni” inafaa kwa Yah, na “lisifuni” kwa “jina,” huku nguvu ya agizo linalorudiwa ikihifadhiwa.
- source_word: יָהּ
  choice: Yah
  rationale: Hili ni umbo fupi la jina la Mungu. Kulitafsiri “Yah” kunahifadhi tofauti yake na יְהוָה inayotokea baadaye katika mstari na pia msingi wa mwito wa ibada “Halelu-Yah.”
- source_word: עַבְדֵי
  choice: watumishi
  rationale: Wingi wa עבד katika hali ya kuambatanishwa unaweza kumaanisha watumishi au watumwa. Katika mwito huu wa ibada, “watumishi” ni Kiswahili cha kawaida na chenye hadhi, bila kufuta uwezekano mpana wa neno la Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa moja kwa moja katika Kiebrania. “Yahweh” hulihifadhi kama jina maalumu na kulitofautisha na umbo fupi “Yah” mwanzoni mwa mstari.
- source_word: אֶת שֵׁם יְהוָה
  choice: jina la Yahweh
  rationale: Kirai hiki humfanya “jina la Yahweh” kuwa yambwa la sifa. Muundo wa Kiswahili ni wa kawaida na huhifadhi mkazo wa Kiebrania juu ya jina la Mungu.
theological_decisions:
- issue: Kutofautisha יָהּ na יְהוָה katika mstari mmoja
  choice: יָהּ limetafsiriwa “Yah,” na יְהוָה “Yahweh.”
  alternative: Kutafsiri yote mawili kwa cheo kama “BWANA,” au kutumia “Yahweh” kwa yote mawili.
  rationale: Maandishi ya Kiebrania yanatumia kwa makusudi umbo fupi na umbo kamili la jina. Kuyatofautisha kunahifadhi ushahidi huo wa chanzo bila kuyafanya yawe kitu kimoja.
- issue: Maana ya עַבְדֵי katika mwito wa waabudu
  choice: watumishi
  alternative: watumwa
  rationale: Neno la Kiebrania linaweza kubeba maana zote mbili. Muktadha wa sifa unatanguliza huduma na utii kwa Yahweh; tanbihi huhifadhi maana nyingine ya kileksia bila kulazimisha muktadha kuichukua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Enyi” huonyesha wazi kwamba watumishi ndio wanaoambiwa wasifu. Alama ya nusu-koloni huhifadhi mgawanyo wa kishairi na urudiaji wa maagizo matatu.
