  text: מֽוֹשִׁיבִ֨י עֲקֶ֬רֶת הַ/בַּ֗יִת אֵֽם הַ/בָּנִ֥ים שְׂמֵחָ֗ה הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/009.yaml
  text: He gives the barren woman a home[a], as a joyful mother of children[b]. Praise Yah!
translation:
  language: sw
  text: Humfanya mwanamke tasa akae nyumbani[a], akiwa mama wa watoto mwenye furaha. Msifuni Yah![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi, “Humfanya mwanamke tasa akae katika nyumba.”
    reason: lexical_alternative
  - marker: b
    text: Kwa mapokeo, “Haleluya!” Huu ni usemi wa Kiebrania unaomaanisha “Msifuni Yah!”
    reason: alternative_reading
lexical_decisions:
- source_word: מֽוֹשִׁיבִי
  choice: Humketisha
  rationale: Ni kausativi ya kitenzi ישׁב, yaani kumfanya mtu akae au kumweka mahali pa kudumu. “Humketisha” huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: עֲקֶרֶת
  choice: mwanamke tasa
  rationale: Neno hili humaanisha mwanamke asiyezaa. “Tasa” ni neno fupi, linaloeleweka na linalofaa mtindo wa kishairi kuliko maelezo ya kitabibu.
- source_word: הַבַּיִת
  choice: nyumbani
  rationale: Ingawa kwa karibu ni “katika nyumba,” hapa neno בית linaashiria makao na maisha ya nyumbani. “Nyumbani” ni tafsiri ya asili katika Kiswahili bila kusisitiza jengo pekee.
- source_word: אֵם הַבָּנִים
  choice: mama wa watoto
  rationale: בנים inaweza kumaanisha wana wa kiume au watoto kwa ujumla. Muktadha unasisitiza kuondolewa kwa hali ya kutokuwa na mtoto, si jinsia ya watoto.
- source_word: שְׂמֵחָה
  choice: mwenye furaha
  rationale: Kivumishi hiki humweleza mama kuwa mwenye kufurahi. “Mwenye furaha” ni cha kawaida, wazi na chenye hadhi.
- source_word: הַֽלְלוּ יָהּ
  choice: Msifuni Yah!
  rationale: הַלְלוּ ni amri kwa wingi, na יָהּ ni umbo fupi la jina la Mungu. Tafsiri hii huhifadhi maana na umbo hilo badala ya kutumia nakili ya sauti tu.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יָהּ katika mwito wa mwisho wa sifa
  choice: Yah
  alternative: BWANA; Haleluya
  rationale: Aya hii ina umbo fupi יָהּ, si jina kamili יהוה. “Yah” huhifadhi tofauti hiyo; “Haleluya” ni nakili ya usemi mzima wa Kiebrania badala ya tafsiri yake.
- issue: Mvutano kati ya “mwanamke tasa” na “mama wa watoto”
  choice: Kuhifadhi maelezo yote mawili kwa kumtaja akiwa mama wa watoto
  alternative: mwanamke aliyekuwa tasa, na kumfanya mama wa watoto
  rationale: Kiebrania kinaweka vifungu hivyo karibu bila kitenzi kinachosema wazi “alikuwa” au “anamfanya.” Tafsiri haiongezi kwa siri mpangilio wa wakati, bali inadumisha picha ya mabadiliko inayotokana na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka kwa wasomaji wa kawaida. “Humketisha ... nyumbani” ni ya asili na huhifadhi kausativi; “akiwa” hudumisha uhusiano wa kishairi bila kuongeza wazi kwamba mwanamke huyo ‘alikuwa’ tasa.
