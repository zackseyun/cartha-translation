  text: יְהִ֤י שֵׁ֣ם יְהוָ֣ה מְבֹרָ֑ךְ מֵֽ֝/עַתָּ֗ה וְ/עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/002.yaml
  text: May the name of Yahweh be blessed from now and forever[a].
translation:
  language: sw
  text: Jina la Yahweh libarikiwe tangu sasa na hata milele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהִי
  choice: na libarikiwe
  rationale: Hali ya amri-laini ya kitenzi היה inaonyesha ombi au himizo. Muundo wa Kiswahili ‘na libarikiwe’ unawasilisha maana hiyo kwa lugha ya kawaida na yenye heshima.
- source_word: שֵׁם
  choice: jina
  rationale: ‘Jina’ linadumisha maana ya moja kwa moja ya neno la Kiebrania, likiwakilisha pia sifa na nafsi ya mwenye jina bila kulipanua katika matini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kuwa ‘Yahweh’ badala ya kubadilishwa na cheo.
- source_word: מְבֹרָךְ
  choice: libarikiwe
  rationale: Hii ni hali ya kutendwa kutoka ברך, ‘bariki.’ ‘Libarikiwe’ linahifadhi lugha halisi ya baraka; ‘lisifiwe’ linafaa kimuktadha lakini si sawasawa kabisa kileksia.
- source_word: מֵעַתָּה
  choice: tangu sasa
  rationale: Kirai hiki kinaonyesha kipindi kinachoanzia wakati wa sasa na kuendelea.
- source_word: וְעַד עוֹלָם
  choice: na hata milele
  rationale: Muundo huu unaonyesha kuendelea bila mwisho. ‘Na hata milele’ ni wa asili katika Kiswahili na unahifadhi nguvu ya muda ya kirai cha Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Matini ya Kiebrania inatumia jina la Mungu moja kwa moja. ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha na cheo ‘BWANA’; ‘Yehova’ ni namna nyingine ya jadi ya kulitamka.
- issue: Nguvu ya יְהִי katika kauli ya baraka
  choice: na libarikiwe
  alternative: libarikiwe
  rationale: Kauli imehifadhiwa kama ombi au himizo, si kama taarifa rahisi kwamba jina tayari limebarikiwa. Kiswahili kinaweza pia kuonyesha maana hiyo kwa hali tegemezi bila ‘na.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayofaa kwa usomaji wa hadhara. Muundo ‘na libarikiwe’ unadumisha sauti ya baraka ya zaburi bila kuwa wa kizamani.
