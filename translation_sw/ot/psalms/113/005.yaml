  rationale: Chaguo kuu linaeleza kwa Kiswahili cha kawaida ukuu na picha ya kuketi; tanbihi inadumisha muundo halisi zaidi wa Kiebrania bila kuamua kama msisitizo ni makao ya juu au kutawazwa.
translation_notes:
