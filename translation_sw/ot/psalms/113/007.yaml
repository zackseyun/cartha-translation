  text: מְקִֽימִ֣י מֵ/עָפָ֣ר דָּ֑ל מֵֽ֝/אַשְׁפֹּ֗ת יָרִ֥ים אֶבְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/007.yaml
  text: He raises the poor from the dust[a]; he lifts the needy from the ash heap.
translation:
  language: sw
  text: 'Humwinua maskini kutoka mavumbini;

    humwinua mhitaji kutoka jalalani.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka katika rundo la majivu.” Neno la Kiebrania אַשְׁפֹּת humaanisha mahali pa kutupia majivu au taka, picha ya hali ya chini na ya kudharauliwa sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקִימִי
  choice: humwinua
  rationale: Ni umbo la kisababishi la קום, likimaanisha kumfanya aliye chini ainuke au asimame. “Humwinua” ni Kiswahili cha kawaida kinachohifadhi picha ya kuinuliwa kutoka hali ya chini.
- source_word: מֵעָפָר
  choice: kutoka mavumbini
  rationale: עָפָר ni vumbi au udongo laini, na מִן huonyesha mahali anapotolewa. Usemi huu unahifadhi picha halisi ya unyonge na hali ya chini.
- source_word: דָּל
  choice: maskini
  rationale: דָּל humaanisha mtu maskini, dhaifu, au asiye na hadhi kubwa katika jamii. “Maskini” ni wazi na ya kawaida, huku muktadha ukibeba pia wazo la unyonge.
- source_word: מֵאַשְׁפֹּת
  choice: kutoka jalalani
  rationale: אַשְׁפֹּת hurejelea mahali pa kutupia majivu au taka. “Jalalani” ni usemi wa sasa na unaoeleweka, unaohifadhi picha ya hali ya kudharauliwa sana; uwezekano wa “rundo la majivu” umewekwa katika tanbihi.
- source_word: יָרִים
  choice: humwinua
  rationale: Ni umbo la kisababishi la רום, yaani kuinua au kuweka juu. Kurudia “humwinua” kunatoa ulinganifu wa kishairi wa asili bila kuongeza mapema wazo la kumpa cheo au heshima.
- source_word: אֶבְיוֹן
  choice: mhitaji
  rationale: אֶבְיוֹן humaanisha mtu mwenye uhitaji mkubwa au asiye na kitu. “Mhitaji” huitofautisha na דָּל (“maskini”) huku ikidumisha ulinganifu wa maana.
theological_decisions:
- issue: Picha ya hali ya kijamii na kugeuzwa kwa hali
  choice: Kuhifadhi lugha halisi ya Mungu kuwainua maskini na wahitaji kutoka hali ya chini sana.
  alternative: Kuifanya aya izungumzie hasa unyenyekevu wa kiroho au kuinuliwa kiroho.
  rationale: Kiebrania kinatumia picha za kimwili—vumbi na jalala—pamoja na makundi halisi ya kijamii—maskini na mhitaji. Tafsiri haibadili picha hizo kuwa maana ya kiroho pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Mistari miwili na marudio ya “humwinua” yanahifadhi ulinganifu wa ushairi wa Kiebrania.
