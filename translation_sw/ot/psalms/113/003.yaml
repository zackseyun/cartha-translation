  text: מִ/מִּזְרַח שֶׁ֥מֶשׁ עַד מְבוֹא֑/וֹ מְ֝הֻלָּ֗ל שֵׁ֣ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/003.yaml
  text: From the rising of the sun to its setting[b][a], the name of Yahweh is to be praised.
translation:
  language: sw
  text: Tangu jua linapochomoza hadi linapotua[a], jina la Yahweh[b] linapaswa kusifiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tangu mashariki hadi magharibi”; kihalisi, “tangu kuchomoza kwa jua hadi kutua kwake.”
    reason: lexical_alternative
  - marker: b
    text: Jina hili kwa Kiebrania ni YHWH; kwa desturi limetafsiriwa “BWANA.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: Tangu jua linapochomoza
  rationale: Muundo huu unaweza kumaanisha mashariki au kuchomoza kwa jua. Katika ulinganifu wake na מְבוֹאוֹ, maana ya kuchomoza kwa jua inafaa zaidi na kuunda usemi wa kishairi unaojumuisha eneo lote au wakati wote.
- source_word: מְבוֹאוֹ
  choice: hadi linapotua
  rationale: Neno hili kihalisi ni kuingia kwake, likirejelea jua. Kiswahili cha sasa hueleza jambo hilo kwa kawaida kuwa jua kutua.
- source_word: מְהֻלָּל
  choice: linapaswa kusifiwa
  rationale: Kauli-tendwa ya hali endelevu inaweza kumaanisha linasifiwa au lastahili kusifiwa. Linapaswa kusifiwa huhifadhi kauli ya jumla pamoja na wito uliodokezwa bila kuibadili kuwa amri ya moja kwa moja.
- source_word: שֵׁם
  choice: jina
  rationale: Tafsiri ya moja kwa moja huhifadhi upana wa maana ya Kiebrania, ambapo jina linaweza kuhusisha sifa, utambulisho uliofunuliwa, na Mungu jinsi anavyojulikana katika ibada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika herufi nne za Kiebrania limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko lina jina la Mungu moja kwa moja; Yahweh hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya מְהֻלָּל katika muktadha
  choice: linapaswa kusifiwa
  alternative: linasifiwa; na lisifiwe
  rationale: Uchaguzi huu huhifadhi mvutano kati ya taarifa ya hali ya jumla na mwito wa ibada uliodokezwa, bila kuifanya kuwa amri ya moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya kishairi. Muundo wa kuchomoza na kutua kwa jua umehifadhi taswira na merizimu ya Kiebrania; viashiria vyote vya tanbihi vimewekwa katika matini.
