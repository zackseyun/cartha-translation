  text: Yahweh ametukuka juu ya mataifa yote; utukufu wake uko juu ya mbingu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָם
  choice: yuko juu
  rationale: Kivumishi cha kiarifu kinachoonyesha kuwa juu au kutukuka; ‘yuko juu’ huhifadhi taswira ya kimo na ni Kiswahili cha kawaida.
- source_word: עַל כָּל גּוֹיִם
  choice: juu kuliko mataifa yote
  rationale: עַל hapa huonyesha kimo na ukuu. ‘Juu kuliko’ hueleza ulinganisho kwa uwazi na kuendana na mshororo unaofuata.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa moja kwa moja kwa tahajia iliyozoeleka katika Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: עַל הַשָּׁמַיִם
  choice: juu kuliko mbingu
  rationale: ‘Mbingu’ inafaa kwa שָׁמַיִם katika ushairi; kurudia ‘juu kuliko’ kunahifadhi usambamba wa Kiebrania.
- source_word: כְּבוֹדוֹ
  choice: utukufu wake
  rationale: כָּבוֹד hapa humaanisha utukufu au adhama; ‘utukufu wake’ ni usemi wa kawaida wa ibada na hauongezi tafsiri finyu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina binafsi la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Usambamba wa vipashio viwili umehifadhiwa kwa kurudia ‘juu kuliko’.
