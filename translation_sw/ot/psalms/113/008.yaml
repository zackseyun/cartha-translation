lexical_decisions:
- source_word: לְ/הוֹשִׁיבִי
  choice: ili amketishe
  rationale: 'Kitenzi cha Hiphil chenye ל kinaonyesha kusudi au matokeo yanayoendeleza wazo la mstari uliotangulia: kumfanya maskini aketi, yaani kumketisha mahali pa heshima.'
- source_word: עִם
  choice: pamoja na
  rationale: Huwasilisha kwa kawaida maana ya kuwa katika ushirika wa watu wengine na huhifadhi picha ya kuketishwa pamoja nao.
- source_word: נְדִיבִים / נְדִיבֵי
  choice: wakuu
  rationale: Katika muktadha huu nomino נָדִיב inamaanisha watu wenye cheo au hadhi ya juu. “Wakuu” ni Kiswahili cha kawaida na hakifungi maana katika wana wa kifalme pekee.
- source_word: עַמּוֹ
  choice: watu wake
  rationale: עַם humaanisha watu kama jamii; kiambishi cha nafsi ya tatu kimehifadhiwa bila kuamua kimya kimya rejeleo lake.
theological_decisions:
- issue: Rejeleo la “wake” katika “watu wake”
  choice: Maandishi yanahifadhi kiwakilishi “wake”; katika muktadha kinaelekea zaidi kumrejelea BWANA.
  alternative: Kinaweza kumrejelea yule maskini aliyeinuliwa, yaani wakuu wa watu wa maskini huyo.
  rationale: Sarufi inaruhusu marejeleo yote mawili. Kwa kuwa BWANA ndiye mtendaji katika mistari inayozunguka, rejeleo kwake lina uwezekano mkubwa, lakini utata halisi umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Marudio ya “pamoja na wakuu” yamehifadhiwa ili kuakisi usambamba wa Kiebrania.
