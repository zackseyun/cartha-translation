translation:
  language: sw
  text: ili amketishe pamoja na wakuu[a], pamoja na wakuu wa watu wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wenye vyeo” au “wakuu wa kifalme”; neno la Kiebrania linaweza kumaanisha wakuu au watu wenye cheo cha kifalme.
    reason: lexical_alternative
  - marker: b
