base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/006.yaml
  text: He will judge among the nations[a]; he will fill them with corpses[d][c][b]; he will crush the head over a broad land.
translation:
  language: sw
  text: Atahukumu kati ya mataifa; atajaza kwa maiti[a]; ataponda kichwa juu ya nchi pana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni kifupi na hakitaji yambwa baada ya “atajaza”; yaweza pia kutafsiriwa, “atazijaza kwa maiti,” yaani mataifa, au “atajaza maiti.” “Kichwa” kinaweza kueleweka kuwa kiongozi au kwa maana ya jumla, vichwa; na “nchi” inaweza pia kuwa dunia.
    reason: Kuhifadhi utata wa yambwa lisilotajwa baada ya מָלֵא, maana ya umoja ya רֹאשׁ, na upeo wa אֶרֶץ.
lexical_decisions:
- source_word: יָדִין
  choice: atahukumu
  rationale: Kauli ya Qal imperfect mtu wa tatu umoja inaelekea kueleza tendo la wakati ujao katika muktadha huu wa kishairi; ‘atahukumu’ inadumisha maana ya kimahakama bila kuongeza wazi wazo la adhabu, ingawa muktadha ni wa vita.
- source_word: בַּגּוֹיִם
  choice: kati ya mataifa
  rationale: גּוֹיִם ni ‘mataifa,’ na בַּ hapa inaeleweka kwa kawaida kuwa hukumu inatendeka miongoni mwao.
- source_word: מָלֵא גְוִיּוֹת
  choice: atawajaza maiti
  rationale: Kiebrania ni kifupi na hakitaji wazi kitu kinachojazwa. Kiambishi ‘-wa-’ kinaelekeza kwa mataifa yaliyotajwa, huku tanbihi ikihifadhi ufupi na utata wa chanzo.
- source_word: גְוִיּוֹת
  choice: maiti
  rationale: ‘Maiti’ ni neno la kawaida, lenye hadhi, linaloonyesha wazi miili ya waliokufa vitani bila kupunguza ukali wa taswira.
- source_word: מָחַץ
  choice: atakiponda
  rationale: Kitenzi kinaonyesha kupiga kwa nguvu na kuvunja au kuponda; ‘atakiponda’ ni cha sasa, wazi, na kinafaa taswira ya vita.
- source_word: רֹאשׁ
  choice: kichwa
  rationale: Umoja halisi wa Kiebrania umehifadhiwa bila kuufasiri moja kwa moja kuwa ‘mtawala,’ ‘kiongozi,’ au wingi wa ‘vichwa.’
- source_word: עַל אֶרֶץ רַבָּה
  choice: juu ya nchi pana
  rationale: ‘Juu ya nchi pana’ huhifadhi עַל pamoja na umoja wa אֶרֶץ, na ‘pana’ huonyesha eneo lenye ukubwa bila kulazimisha maana ya dunia yote.
theological_decisions:
- issue: Rejeo na upeo wa ‘kichwa’ cha umoja katika zaburi ya kifalme yenye usomaji wa Kimasihi
  choice: Kudumisha taswira halisi ya umoja ‘kichwa’ bila kumtambulisha anayerejelewa.
  alternative: ‘kiongozi,’ ‘mtawala,’ ‘vichwa,’ au adui mkuu mmoja
  rationale: Kiebrania hakimtambulishi wazi anayerejelewa. Kutafsiri ‘kichwa’ hudumisha mvutano wa kitheolojia na kuzuia kuingiza ufafanuzi maalumu katika matini.
- issue: Upeo wa אֶרֶץ katika kishazi cha mwisho
  choice: Kutumia ‘nchi’ katika matini kuu.
  alternative: ‘dunia’
  rationale: אֶרֶץ inaweza kuwa nchi/eneo au dunia. ‘Nchi’ ni tafsiri isiyopanua maana kupita kiasi, huku uwezekano wa ‘dunia’ ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. Taswira kali ya hukumu na vita imehifadhiwa. Tanbihi moja imekusanya tofauti zinazohusiana ili matini kuu ibaki inayosomeka kwa urahisi.
