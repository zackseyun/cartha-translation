base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/002.yaml
  text: 'Yahweh sends forth from Zion the scepter of your strength: rule in the midst of your enemies[a][b][c].'
translation:
  language: sw
  text: Yahwe ataituma kutoka Sayuni fimbo yako ya enzi yenye nguvu[a][b]. Tawala katikati ya adui zako[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fimbo ya nguvu zako” au “gongo la nguvu zako.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Yahwe anaituma”; kwa tafsiri yenye ufafanuzi zaidi, “Yahwe anainyoosha.”
    reason: lexical_alternative
  - marker: c
    text: Au, “Tawala miongoni mwa adui zako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: fimbo ya enzi
  rationale: Katika muktadha huu wa kifalme, neno hili linamaanisha fimbo iliyo ishara ya mamlaka ya kutawala. “Fimbo ya enzi” ni Kiswahili cha kawaida na chenye hadhi, huku tanbihi ikihifadhi maana nyingine za neno hilo.
- source_word: עֻזְּךָ
  choice: nguvu zako
  rationale: Hii inatafsiri moja kwa moja nomino yenye kiambishi cha nafsi ya pili umoja, bila kuibadili kuwa dhana pana zaidi ya mamlaka.
- source_word: יִשְׁלַח
  choice: ataituma
  rationale: Kitenzi cha Kiebrania kina maana ya kutuma au kutoa kitu kiende. Wakati ujao wa Kiswahili unafaa kwa hali ya kitenzi hiki katika kauli ya kishairi; “kunyoosha” limeachwa kuwa chaguo la kifasiri katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limehifadhiwa kwa umbo la kawaida la Kiswahili badala ya kubadilishwa kuwa cheo “BWANA.”
- source_word: מִצִּיּוֹן
  choice: kutoka Sayuni
  rationale: Hii ni tafsiri ya moja kwa moja ya kishazi kinachoonyesha mahali chanzo.
- source_word: רְדֵה
  choice: Tawala
  rationale: Amri hii ina maana ya kutawala au kuwa na mamlaka. “Tawala” ni ya moja kwa moja, ya sasa, na ya kawaida katika Kiswahili.
- source_word: בְּקֶרֶב
  choice: katikati ya
  rationale: Tafsiri hii inadumisha picha ya mfalme akitawala akiwa amezungukwa na maadui, badala ya kutumia tu “miongoni mwa.”
- source_word: אֹיְבֶיךָ
  choice: adui zako
  rationale: Hii inahifadhi wingi na kiambishi cha nafsi ya pili umoja wa kiume kinachomrejelea anayeambiwa atawale.
theological_decisions:
- issue: Taswira ya kifalme na ya Kimasihi katika Zaburi 110
  choice: Lugha ya kifalme imehifadhiwa bila kumtambulisha wazi mtawala huyu kuwa mtu fulani katika mstari wenyewe.
  alternative: Kutafsiri kwa lugha ya jumla inayofifisha taswira ya kutawazwa, au kuongeza moja kwa moja utambulisho wa Kimasihi.
  rationale: Kiebrania kinamwonyesha mtawala wa kifalme akipewa mamlaka na Yahwe na kuamriwa atawale. Tafsiri inadumisha maana hiyo ya karibu huku ikiacha nafasi kwa umuhimu mpana wa Kimasihi unaotokana na muktadha wa Maandiko, bila kuuingiza ndani ya maneno ya mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wa sasa na wenye hadhi. Mpangilio wa sentensi umefanywa wa kawaida kwa Kiswahili huku taswira halisi ya fimbo ya enzi, chanzo chake Sayuni, na kutawala katikati ya maadui ikihifadhiwa.
