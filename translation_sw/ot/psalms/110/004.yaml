  text: נִשְׁבַּ֤ע יְהוָ֨ה וְ/לֹ֥א יִנָּחֵ֗ם אַתָּֽה כֹהֵ֥ן לְ/עוֹלָ֑ם עַל דִּ֝בְרָתִ֗י מַלְכִּי צֶֽדֶק׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/004.yaml
  text: 'Yahweh has sworn and will not change his mind: “You are a priest forever after the manner of Melchizedek.”[a]'
translation:
  language: sw
  text: 'Yahwe ameapa, wala hatabadili nia yake: “Wewe ni kuhani milele, kwa namna ya Melkizedeki.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri iliyo karibu zaidi na maneno ya Kiebrania, “kulingana na neno langu [au agizo langu], Melkizedeki.” Kirai cha Kiebrania ni kigumu, na wengine hukielewa kuwa “kwa namna ya Melkizedeki.”
    reason: alternative_reading
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: ameapa
  rationale: Kauli timilifu inaonyesha kiapo cha Mungu kilichofanywa kwa uzito; ‘ameapa’ ni Kiswahili cha kawaida na huhifadhi nguvu ya kiapo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina la agano la Mungu kama jina maalumu kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: וְלֹא יִנָּחֵם
  choice: wala hatabadili nia yake
  rationale: Katika muktadha huu kitenzi kinaonyesha kwamba Yahwe hataghairi wala kugeuza kiapo chake; usemi huu ni wazi katika Kiswahili cha sasa.
- source_word: אַתָּה כֹהֵן
  choice: Wewe ni kuhani
  rationale: Huhifadhi usemi wa moja kwa moja wa nafsi ya pili na cheo cha ukuhani bila kuongeza ufafanuzi usiomo katika Kiebrania.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Ni tafsiri fupi, ya kawaida, na inayofaa kwa muda usio na mwisho katika muktadha huu.
- source_word: עַל דִּבְרָתִי
  choice: kwa mfano wa
  rationale: Kirai hiki cha Kiebrania ni kigumu. ‘Kwa mfano wa’ hutoa maana ya kufuata namna au kielelezo kinachohusishwa na Melkizedeki bila kutumia neno ‘daraja’ ambalo linaweza kuleta dhana za ziada.
- source_word: מַלְכִּי־צֶדֶק
  choice: Melkizedeki
  rationale: Ni unukuzi wa jina maalumu unaotambulika katika mapokeo ya Biblia ya Kiswahili, badala ya kulitafsiri jina hilo.
theological_decisions:
- issue: Maana ya kirai kigumu עַל דִּבְרָתִי מַלְכִּי־צֶדֶק
  choice: kwa mfano wa Melkizedeki
  alternative: kulingana na neno/agizo langu, Melkizedeki
  rationale: Usomaji mkuu unaeleza ukuhani kwa kurejelea namna au kielelezo cha Melkizedeki na unaungwa mkono na mapokeo ya kale. Hata hivyo, muundo wa Kiebrania unaweza kueleweka kwa ukaribu zaidi kama ‘kulingana na neno/agizo langu’; uwezekano huo umehifadhiwa katika tanbihi ili kutofuta utata wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya moja kwa moja na rahisi kueleweka; jina Yahwe na neno kuhani yanahifadhi uzito wa lugha ya kibiblia.
