  yaml_path: translation/ot/psalms/110/000.yaml
  text: Of David[a]. A psalm. Yahweh says to my Lord[c][b], “Sit at my right hand until I make your enemies a footstool for your feet.”
translation:
  language: sw
  text: 'Ya Daudi. Zaburi.


    Yahwe[a] anamwambia bwana wangu, “Keti upande wangu wa kulia mpaka nitakapowafanya adui zako kuwa kiti cha kuwekea miguu yako.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaloanzisha usemi huu linaweza pia kutafsiriwa, “Tamko la Yahwe kwa bwana wangu.” Kiebrania kinatofautisha Yahwe (YHWH) na “bwana wangu” (adoni).
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד מִזְמוֹר
  choice: Ya Daudi. Zaburi.
  rationale: Kichwa hiki kinahifadhi muundo mfupi wa Kiebrania. Kihusishi לְ kinaweza kuonyesha uandishi, uhusiano, au wakfu; “Ya Daudi” hudumisha upana huo kuliko kulazimisha “iliyoandikwa na Daudi.”
- source_word: נְאֻם יְהוָה
  choice: Yahwe anamwambia
  rationale: נְאֻם huanzisha tamko lenye mamlaka, na muktadha unalitolea bwana wa msemaji. Jina la agano יהוה limetafsiriwa “Yahwe” ili kulitofautisha wazi na אֲדֹנִי.
- source_word: לַאדֹנִי
  choice: bwana wangu
  rationale: אֲדֹנִי maana yake ni “bwana wangu,” tofauti na jina יהוה; herufi ndogo katika “bwana” husaidia kutunza tofauti hiyo bila kuamua kimbele utambulisho wa mhusika.
- source_word: שֵׁב לִימִינִי
  choice: Keti mkono wangu wa kulia
  rationale: Hii ni nahau ya heshima na mamlaka. Kiswahili hiki ni cha kawaida na kinahifadhi picha ya asili.
- source_word: הֲדֹם לְרַגְלֶיךָ
  choice: kiti cha kuwekea miguu yako
  rationale: Tafsiri hii inatunza taswira halisi ya הֲדֹם, chombo cha kutegemezea au kuwekea miguu, badala ya kuifafanua tu kuwa “chini ya miguu yako.”
theological_decisions:
- issue: Utambulisho wa “bwana wangu”
  choice: Kutafsiri kwa maana ya moja kwa moja “bwana wangu” bila kumtambulisha zaidi katika mstari wenyewe.
  alternative: Kutumia cheo chenye herufi kubwa au kumtaja wazi kuwa Masihi.
  rationale: Kiebrania kinatofautisha YHWH na adoni, lakini mstari wenyewe haumtajii adoni utambulisho kwa jina. Tafsiri inadumisha tofauti na pia nafasi ya matumizi ya baadaye ya maandiko.
- issue: Nguvu ya kauli נְאֻם
  choice: “Yahwe anamwambia” katika maandishi, huku tanbihi ikitaja maana ya tamko rasmi.
  alternative: “Tamko la Yahwe kwa bwana wangu.”
  rationale: Chaguo kuu ni la asili zaidi katika Kiswahili cha sasa, lakini tanbihi huhifadhi uzito wa neno la kinabii au tamko rasmi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayosomeka kwa urahisi. Jina “Yahwe” limetumiwa kwa YHWH, na “bwana wangu” kwa adoni ili tofauti ya Kiebrania ibaki wazi. Alama ya tanbihi [a] ipo katika maandishi makuu.
