source:
  edition: WLC
  text: עַמְּ/ךָ֣ נְדָבֹת֮ בְּ/י֪וֹם חֵ֫ילֶ֥/ךָ בְּֽ/הַדְרֵי קֹ֭דֶשׁ מֵ/רֶ֣חֶם מִשְׁחָ֑ר לְ֝/ךָ֗ טַ֣ל יַלְדֻתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/003.yaml
  text: Your people will offer themselves freely on the day of your power[a], in holy splendor; from the womb of the dawn[c][b], to you belongs the dew of your youth.
translation:
  language: sw
  text: Siku ya nguvu zako, watu wako watajitoa kwa hiari[a], katika fahari ya utakatifu[b]; kutoka tumbo la mapambazuko, kwako ni umande wa ujana wako[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Watu wako ni sadaka za hiari siku ya nguvu—au jeshi—lako.” Kiebrania kinatumia nomino “sadaka za hiari” kishairi kueleza jinsi watu wanavyojileta kwa utayari.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika mapambo matakatifu,” “katika fahari za utakatifu,” au labda “katika mavazi matakatifu.”
    reason: lexical_alternative
  - marker: c
    text: Mstari huu wa mwisho ni mgumu. Huenda ukamaanisha, “vijana wako ni kama umande unaotoka katika tumbo la mapambazuko,” au ukazungumzia ubichi na nguvu za ujana wako.
    reason: alternative_reading
lexical_decisions:
- source_word: עַמְּךָ
  choice: watu wako
  rationale: עַם kwa kawaida humaanisha “watu.” Ingawa muktadha una taswira ya vita, “watu wako” huhifadhi maana pana bila kuifanya moja kwa moja kuwa “jeshi lako” au “askari wako.”
- source_word: נְדָבֹת
  choice: watajitoa kwa hiari
  rationale: Nomino hii ya wingi humaanisha kihalisi “sadaka za hiari” au “matoleo ya hiari.” Hapa inawatambulisha watu kama wanaojileta wenyewe kwa hiari; kauli ya kitenzi ni ya asili zaidi katika Kiswahili na huhifadhi wazo la utayari.
- source_word: בְּיוֹם
  choice: siku ya
  rationale: Hii ni matumizi ya kawaida ya kihusishi ב pamoja na יוֹם kuonyesha wakati. “Siku ya” ni fupi, ya asili, na inafaa katika ushairi.
- source_word: חֵילֶךָ
  choice: nguvu zako
  rationale: חַיִל inaweza kumaanisha nguvu, uwezo, jeshi, au kikosi cha vita. “Nguvu zako” huhifadhi maana pana na mwangwi wa kijeshi bila kulazimisha maana ya “jeshi.”
- source_word: בְּהַדְרֵי קֹדֶשׁ
  choice: katika fahari takatifu
  rationale: Kirai hiki kinaweza kueleza fahari yenye utakatifu, mapambo matakatifu, au mavazi matakatifu. “Katika fahari takatifu” huhifadhi uzito wa kishairi na kiasi cha utata wa asili.
- source_word: מֵרֶחֶם מִשְׁחָר
  choice: kutoka tumbo la mapambazuko
  rationale: Taswira ya “tumbo” inaonyesha chanzo au mahali pa kutokea, na מִשְׁחָר hurejelea mapambazuko. Tafsiri hii huhifadhi sitiari hai ya Kiebrania.
- source_word: לְךָ
  choice: ni wako
  rationale: Kihusishi לְ ni kifupi sana katika ushairi huu na kinaweza kuonyesha umilikaji. Kiswahili kinahitaji kiarifu; “ni wako” huonyesha uhusiano huo bila kuongeza ufafanuzi mwingi.
- source_word: טַל
  choice: umande
  rationale: “Umande” ni neno la kawaida na la kishairi linalolingana moja kwa moja na taswira ya Kiebrania.
- source_word: יַלְדֻתֶיךָ
  choice: ujana wako
  rationale: Nomino hii inaweza kueleza ujana au hali ya kuwa kijana, na huenda ikadokeza kundi la vijana. “Ujana wako” huhifadhi utata kati ya uchangamfu wa ujana na vijana wanaomfuata mfalme.
theological_decisions:
- issue: Maana ya kishororo cha mwisho, “umande wa ujana wako ni wako”
  choice: Kudumisha taswira iliyobanwa ya Kiebrania kuhusu ubichi au nguvu za ujana wa mfalme, au ubichi wa vijana wanaomfuata, bila kuamua maana moja.
  alternative: Kukitafsiri wazi kuwa vijana wa mfalme ni wengi au wabichi kama umande; au kukifanya kuwa kauli ya moja kwa moja kuhusu kuzaliwa kwa Masiya.
  rationale: Kiebrania cha sehemu hii ni kigumu na kina utata halisi. Tafsiri huhifadhi taswira na mvutano wa kitheolojia badala ya kuingiza hitimisho maalumu la baadaye, huku ikiendelea kuruhusu usomaji wa Zaburi hii kama ya Kimasihi katika muktadha wake mpana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa maneno umetengenezwa kuwa wa asili kwa Kiswahili huku taswira za “tumbo la mapambazuko” na “umande wa ujana” zikihifadhiwa kwa sababu ya uzito na utata wake katika chanzo.
