lexical_decisions:
- source_word: מִנַּחַל
  choice: kutoka kijitoni
  rationale: נחל inaweza kumaanisha kijito, bonde lenye mkondo wa maji, au mkondo wa msimu. “Kijito” ni neno la kawaida na linalofaa picha ya kishairi ya kunywa maji njiani.
- source_word: בַּדֶּרֶךְ
  choice: njiani
  rationale: דרך humaanisha njia, barabara, au safari. “Njiani” ni Kiswahili cha asili na kifupi kinachoweza kumaanisha wakati wa safari au mwendo.
- source_word: יִשְׁתֶּה
  choice: atakunywa
  rationale: Kitenzi cha Kiebrania kinaweza kueleza tendo la wakati ujao au la kawaida. Muktadha wa mfululizo wa matendo katika zaburi unaunga mkono wakati ujao.
- source_word: עַל־כֵּן
  choice: kwa hiyo
  rationale: Kirai hiki huonyesha matokeo au sababu inayofuata; “kwa hiyo” linaweka wazi uhusiano huo bila kufafanua kupita maandishi.
- source_word: יָרִים רֹאשׁ
  choice: atakiinua kichwa chake
  rationale: Tafsiri hii inahifadhi taswira ya Kiebrania na uwezekano wake wa kumaanisha kupata nguvu mpya, ujasiri, ushindi, au kuinuliwa, bila kuchagua maana moja pekee.
theological_decisions:
- issue: Mhusika wa vitenzi vya umoja wa kiume katika zaburi hii ya kifalme
  choice: Kudumisha nafsi ya tatu ya umoja bila kumtaja mhusika kwa jina.
  alternative: Kumtambulisha wazi kuwa mfalme wa ukoo wa Daudi, mfalme-kuhani anayezungumziwa, au Masihi.
  rationale: Kiebrania kina mhusika wa umoja wa kiume lakini hakimtaji katika mstari huu. Tafsiri haipaswi kuingiza utambulisho mahususi wa kikristo au mwingine ndani ya mstari, ingawa usomaji huo unaweza kuwepo katika kiwango cha ufasiri.
- issue: Maana ya kuinua kichwa
  choice: Kuhifadhi nahau halisi “atakiinua kichwa chake.”
  alternative: “Atapata nguvu mpya,” “atashinda,” au “atatukuzwa.”
  rationale: Nahau inaweza kuashiria nguvu zilizorejea, ujasiri, ushindi, au kuinuliwa. Kudumisha taswira kunahifadhi mvutano wa kishairi na kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. “Njiani” ni la kawaida na la asili; taswira ya “kuinua kichwa” imehifadhiwa ili kutoondoa utata wa maandishi.
