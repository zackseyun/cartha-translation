  yaml_path: translation/ot/psalms/110/005.yaml
  text: The Lord is at your right hand[a]; he will shatter kings on the day of his wrath.
translation:
  language: sw
  text: Bwana yuko upande wako wa kuume[a]; atawaponda wafalme siku ya ghadhabu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, maneno “bwana aliye upande wako wa kuume” yanaweza kumrejelea mfalme/Masihi anayezungumziwa katika zaburi; wengine humwelewa “Bwana” hapa kuwa Mungu anayetekeleza hukumu.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Neno limewekewa irabu kama Adonai, yaani “Bwana,” wala si jina la agano YHWH. Kiswahili hakitumii herufi kubwa kutofautisha kwa uhakika kati ya Mungu na mtawala huyu, hivyo tanbihi inahifadhi utata wa rejeleo.
- source_word: עַל
  choice: yuko
  rationale: Pamoja na “mkono wa kuume,” kihusishi hiki kinaonyesha mahali alipo. Muundo “yuko mkono wako wa kuume” ni wa kawaida na wenye kueleweka katika Kiswahili.
- source_word: יְמִינְךָ
  choice: mkono wako wa kuume
  rationale: Tafsiri hii inadumisha taswira halisi ya mkono wa kuume, ambayo inaweza kudokeza msaada, heshima, au mamlaka bila kufafanua dokezo hilo ndani ya matini.
- source_word: מָחַץ
  choice: atawaponda
  rationale: Kitenzi kina maana ya kuponda au kuvunja kwa pigo. Wakati ujao unafaa mfuatano wa kinabii wa hukumu, ingawa umbo la Kiebrania ni timilifu.
- source_word: בְּיוֹם
  choice: siku ya
  rationale: Muundo huu unahifadhi usemi wa wakati wa Kiebrania kwa Kiswahili cha kawaida na kifupi.
- source_word: אַפּוֹ
  choice: ghadhabu yake
  rationale: Ingawa msingi wa neno unahusiana na pua, hapa ni nahau ya hasira kali. “Ghadhabu” inafaa uzito wa hukumu ya kifalme.
- source_word: מְלָכִים
  choice: wafalme
  rationale: Nomino hii ya wingi inamaanisha moja kwa moja watawala wenye cheo cha kifalme, yaani “wafalme.”
theological_decisions:
- issue: Rejeleo la “Bwana” katika Zaburi 110:5
  choice: Kutafsiri cheo kwa upana kama “Bwana” bila kutaja kwa uhakika ikiwa ni Mungu au mfalme/Masihi.
  alternative: Baadhi huelewa “Bwana” kuwa Mungu anayetekeleza hukumu; wengine humwelewa kuwa bwana aliye mkono wa kuume, yaani mfalme/Masihi anayezungumziwa katika zaburi.
  rationale: Kiebrania kina אֲדֹנָי badala ya jina YHWH, na sintaksia pamoja na muktadha huruhusu mijadala kuhusu rejeleo. Matini kuu na tanbihi zinahifadhi mvutano huo badala ya kuutatua kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kuume” huhifadhi mtindo wa kibiblia uliozoeleka bila kuwa wa kizamani mno; “atawaponda” ni wazi na inadumisha nguvu ya picha ya hukumu.
