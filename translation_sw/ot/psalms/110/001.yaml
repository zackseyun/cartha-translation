  yaml_path: translation/ot/psalms/110/001.yaml
  text: Of David[a]. A psalm. Yahweh says to my lord[c][b], “Sit at my right hand until I make your enemies a footstool for your feet.”
translation:
  language: sw
  text: 'Zaburi ya Daudi.[a]


    Tamko[b] la Yahwe[c] kwa bwana wangu:


    “Keti upande wangu wa kulia,


    hadi nitakapowafanya adui zako


    kuwa kiti cha miguu yako.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Zaburi kwa Daudi.” Kiambishi cha Kiebrania kinaweza kuonyesha utunzi, umiliki, kuwekwa wakfu, au uhusiano.
    reason: lexical_alternative
  - marker: b
    text: “Tamko” hapa ni neno la Kiebrania linalotambulisha kauli nzito au rasmi; pia yaweza kutafsiriwa “Yahwe anasema.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania hutofautisha “Yahwe,” jina la Mungu, na “bwana wangu,” cheo cha heshima.
    reason: theological_clarity
lexical_decisions:
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kiambishi לְ katika vichwa vya zaburi kinaweza kuonyesha utunzi, umiliki, kuwekwa wakfu, au uhusiano. “Ya Daudi” ni Kiswahili cha kawaida kinachohifadhi kiasi cha upana huo kuliko “iliyoandikwa na Daudi.”
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa aina hii ya wimbo wa ibada.
- source_word: נְאֻם
  choice: Tamko
  rationale: Neno hili hutambulisha kauli nzito au rasmi, hasa ya Mungu. “Tamko” huhifadhi uzito huo vizuri kuliko kitenzi cha kawaida “anasema.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo, hivyo tofauti yake na אֲדֹנִי inabaki wazi.
- source_word: לַאדֹנִי
  choice: kwa bwana wangu
  rationale: אֲדֹנִי ni cheo cha heshima chenye maana ya “bwana wangu,” si jina יהוה. Herufi ndogo huepuka kuingiza moja kwa moja tafsiri ya baadaye katika maandishi ya Kiebrania.
- source_word: שֵׁב
  choice: Keti
  rationale: Ni amri ya moja kwa moja na ya kawaida; muktadha wa upande wa kulia unadokeza heshima na mamlaka.
- source_word: לִימִינִי
  choice: upande wangu wa kulia
  rationale: Hiki ni Kiswahili cha asili na kinachoeleweka kwa urahisi kwa nafasi ya heshima inayomaanishwa na msemo wa Kiebrania, ingawa neno kwa neno ni “kwenye mkono wangu wa kuume.”
- source_word: עַד
  choice: hadi
  rationale: Huonyesha muda unaoendelea mpaka tendo la Mungu lililotajwa litimie, bila kudai kwamba hali ya kuketi itakoma baada yake.
- source_word: אָשִׁית
  choice: nitakapowafanya
  rationale: Kitenzi kina maana ya kuweka au kufanya kitu kiwe katika hali fulani. Pamoja na “kiti cha miguu,” Kiswahili cha matokeo “kuwafanya ... kuwa” ni wazi na cha kawaida.
- source_word: אֹיְבֶיךָ
  choice: adui zako
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya wingi yenye kiambishi cha nafsi ya pili umoja.
- source_word: הֲדֹם לְרַגְלֶיךָ
  choice: kiti cha miguu yako
  rationale: Huhifadhi picha ya kifalme ya ushindi na kutiishwa. Kiebrania kinasema kiti “kwa ajili ya miguu yako,” si moja kwa moja “chini ya miguu yako.”
theological_decisions:
- issue: Kutofautisha יהוה na אֲדֹנִי
  choice: Yahwe ... bwana wangu
  alternative: Bwana ... Bwana wangu
  rationale: Kiebrania kinatumia jina la Mungu kwa msemaji na cheo cha heshima kwa anayesemeshwa. Kutumia maneno tofauti kunalinda utofauti huo muhimu bila kuamua mapema utambulisho wa “bwana wangu.”
- issue: Utambulisho wa “bwana wangu” katika zaburi yenye matumizi ya Kimasihi
  choice: Kubakiza cheo “bwana wangu” bila kukifanya jina maalumu
  alternative: Bwana wangu
  rationale: Andiko la Kiebrania lina cheo cha heshima, si jina maalumu. Herufi ndogo zinahifadhi mvutano wa kifasiri na kuruhusu matumizi ya baadaye ya kikanoni bila kuyapachika katika tahajia ya mstari huu.
- issue: Maana ya “hadi” kwa muda wa kuketi
  choice: hadi nitakapowafanya
  alternative: wakati ninapowafanya
  rationale: עַד kwa kawaida huweka mpaka wa muda wa tendo lililotajwa, lakini yenyewe haisemi kwamba kuketi upande wa kulia kutakoma adui wakishindwa. Tafsiri haiongezi dai hilo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mistari imepangwa kuonyesha tamko la Mungu na taswira ya kifalme bila kutumia lugha ya dhehebu fulani. “Upande wangu wa kulia” limechaguliwa badala ya “mkono wangu wa kuume” kwa ufasaha wa Kiswahili cha kawaida, huku maana ya nafasi ya heshima ikihifadhiwa.
