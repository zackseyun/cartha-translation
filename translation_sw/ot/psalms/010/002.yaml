  text: בְּ/גַאֲוַ֣ת רָ֭שָׁע יִדְלַ֣ק עָנִ֑י יִתָּפְשׂ֓וּ בִּ/מְזִמּ֖וֹת ז֣וּ חָשָֽׁבוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/002.yaml
  text: In the pride of the wicked[a], the poor man is hotly pursued[b]; let them be caught in the schemes they have devised.
translation:
  language: sw
  text: Kwa kiburi cha mwovu, maskini anafuatiliwa kwa ukali[a]; waovu wanaswe katika hila walizotunga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwovu anamfuatilia maskini kwa ukali.” Sintaksia ya Kiebrania imebanwa, na mwovu anaweza kueleweka kuwa mtendaji huku maskini akiwa mtendwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “waovu wamenaswa katika hila walizotunga.” Umbo la Kiebrania linaweza kueleweka kuwa taarifa badala ya ombi au takwa.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּגַאֲוַת
  choice: Kwa kiburi cha
  rationale: “Kwa” linaweza kuonyesha hali, sababu, au msukumo wa tendo bila kufafanua kupita kiasi uhusiano mfupi wa Kiebrania; “kiburi” ni neno la kawaida na lenye hadhi kwa majivuno ya mwovu.
- source_word: רָשָׁע
  choice: mwovu
  rationale: Nomino ya umoja inatumiwa kiwakilishi kwa mtu mwovu; “mwovu” huhifadhi umoja na ni ya kawaida katika Kiswahili.
- source_word: יִדְלַק
  choice: anafuatiliwa kwa ukali
  rationale: Mzizi דלק unaweza kumaanisha kuwaka au kufuatilia kwa karibu. Katika muktadha huu unatoa wazo la kumwandama mtu kwa uhasama; kauli ya kutendwa humweka maskini kama anayeteswa huku tanbihi ikihifadhi uchangamano wa sintaksia.
- source_word: עָנִי
  choice: maskini
  rationale: Neno linaweza kumaanisha mtu maskini, mwenye taabu, au anayeonewa. “Maskini” ni fupi, asilia, na huhifadhi umoja wa Kiebrania bila kuongeza maelezo yasiyokuwamo.
- source_word: יִתָּפְשׂוּ
  choice: wanaswe
  rationale: Kauli ya kutendwa ya hali ya kutakia/kuomba inawasilishwa kwa kiima tegemezi cha Kiswahili, kama ombi kwamba waovu wanaswe; uwezekano wa kuisoma kama taarifa umehifadhiwa katika tanbihi.
- source_word: בִּמְזִמּוֹת
  choice: katika hila
  rationale: “Hila” huonyesha mipango ya ujanja yenye nia mbaya. “Katika” hudumisha taswira ya wao kunaswa ndani ya mipango yao wenyewe.
- source_word: זוּ
  choice: wali-
  rationale: Kiwakilishi rejeshi cha Kiebrania kinawasilishwa kiasili kwa kiambishi cha urejeshi “-li-” katika “walizotunga,” bila kuhitaji neno huru.
- source_word: חָשָׁבוּ
  choice: walizotunga
  rationale: Katika muktadha huu חשב humaanisha kupanga kwa makusudi. “Kutunga hila” ni usemi wa asili unaodokeza kupanga jambo la ujanja.
theological_decisions:
- issue: Nguvu ya kisintaksia ya kishazi cha pili
  choice: 'Ombi au takwa dhidi ya waovu: “wanaswe katika hila walizotunga.”'
  alternative: 'Taarifa: “wamenaswa katika hila walizotunga”; pia inawezekana maskini wakaeleweka kuwa wanaonaswa katika mipango ya waovu.'
  rationale: Umbo la Kiebrania linaweza kuwa ombi/takwa au taarifa. Usomaji wa ombi unafaa sauti ya sala ya zaburi na wazo la waovu kuanguka katika mitego yao wenyewe, lakini utata halisi umewekwa katika tanbihi.
- issue: Uhusiano wa mwovu na maskini katika kishazi cha kwanza
  choice: Maskini ametolewa kama anayefuatiliwa kwa ukali na mwovu.
  alternative: Kishazi kinaweza kutafsiriwa moja kwa moja zaidi, “mwovu anamfuatilia maskini kwa ukali.”
  rationale: Kiebrania ni kifupi kisintaksia, na kitenzi kinaweza kueleweka kwa mwovu kama mtendaji na maskini kama mtendwa. Kauli ya kutendwa ya Kiswahili inadumisha mkazo kwa maskini, huku tanbihi ikitaja usomaji wa kauli ya kutenda.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. Sentensi ni fupi kama Kiebrania; “anafuatiliwa kwa ukali” huepuka taswira isiyo wazi ya kuwaka, na “wanaswe” hudumisha sauti ya sala bila kuondoa usomaji mwingine uliowekwa katika tanbihi.
