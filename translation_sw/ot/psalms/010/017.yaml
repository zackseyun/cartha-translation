base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/017.yaml
  text: O Yahweh[a], you have heard the desire of the humble; you will prepare their heart[b]; your ear will listen.
translation:
  language: sw
  text: Ee Yahwe, umesikia tamanio la wanyenyekevu[a]; utafanya mioyo yao iwe imara[b]; utatega sikio lako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wapole” au “walioteswa.”
    reason: lexical_alternative
  - marker: b
    text: Au “utaiandaa” au “utaimarisha mioyo yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּאֲוַת
  choice: shauku
  rationale: Nomino hii humaanisha tamanio au hamu kubwa. “Shauku” ni ya asili katika Kiswahili na inafaa katika muktadha wa sala bila kuifanya kuwa ombi lililotamkwa wazi.
- source_word: עֲנָוִים
  choice: wanyenyekevu
  rationale: Neno linaweza kumaanisha wanyenyekevu, wapole, au walioteswa. “Wanyenyekevu” huhifadhi maana ya hali ya chini/unyenyekevu, huku tanbihi ikidumisha uwezekano unaotokana na muktadha wa wanaoonewa.
- source_word: שָׁמַעְתָּ
  choice: umesikia
  rationale: Kitenzi timilifu kinachomwelekea Mungu kimetafsiriwa kwa wakati timilifu wa Kiswahili, kikionyesha tendo lililokamilika lenye umuhimu wa sasa.
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi “Yahwe” badala ya kubadilishwa na cheo; “Ee” huonyesha mwito wa moja kwa moja katika sala.
- source_word: תָּכִין
  choice: utaitia ... uthabiti
  rationale: Hifili ya כון inaweza kumaanisha kuandaa, kuthibitisha, au kufanya imara. Kirai hiki huhifadhi wazo la kuifanya mioyo yao iwe imara na ni cha asili katika Kiswahili.
- source_word: לִבָּם
  choice: mioyo yao
  rationale: Wingi wa kimuktadha umetumiwa kwa Kiswahili kwa kuwa kiwakilishi kinarejelea kundi la wanyenyekevu; taswira ya kibiblia ya moyo imehifadhiwa bila kufasiriwa kuwa akili au utu wa ndani.
- source_word: תַּקְשִׁיב
  choice: litasikiliza
  rationale: Kitenzi humaanisha kusikiliza kwa makini. “Litasikiliza” kinaendana na kiima halisi “sikio lako” na kuhifadhi taswira ya kishairi.
- source_word: אָזְנֶךָ
  choice: sikio lako
  rationale: Taswira halisi ya sikio la Mungu imehifadhiwa badala ya kufupishwa kuwa “utasikiliza,” ili kudumisha lugha ya kishairi ya Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Ee Yahwe
  alternative: Ee BWANA
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni. Unukuzi wa jina binafsi huhifadhi jina la agano badala ya kulibadilisha na cheo.
- issue: Maana ya עֲנָוִים katika muktadha
  choice: wanyenyekevu
  alternative: wanaoteswa / wapole
  rationale: Muktadha wa Zaburi 10 unawahusu wanaoonewa, lakini neno lenyewe pia hubeba dhana ya unyenyekevu au upole. Tafsiri kuu na tanbihi huhifadhi mvutano huo.
- issue: Maana ya תָּכִין pamoja na “mioyo yao”
  choice: utaitia mioyo yao uthabiti
  alternative: utaiandaa mioyo yao / utaifanya mioyo yao imara
  rationale: Kitenzi kina wigo wa kuandaa, kuthibitisha, na kufanya imara. Tafsiri kuu inatoa maana ya uthabiti bila kuondoa maana mbadala ya kuandaa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa sala na taswira ya “sikio lako” zimehifadhiwa; lugha imewekwa wazi kwa msomaji wa kawaida bila kupunguza utata halisi wa maneno ya Kiebrania.
