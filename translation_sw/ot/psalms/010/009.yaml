base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/009.yaml
  text: He lies in wait in hiding[a], like a lion in his lair; he lies in wait to seize the poor[c][b]; he seizes the poor when he drags him into his net.
translation:
  language: sw
  text: Huvizia mafichoni[a], kama simba katika kichaka chake[b]; huvizia ili amnyakue maskini; humnyakua maskini kwa kumvuta katika wavu wake.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa siri.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika maficho yake”; neno la Kiebrania linaweza kumaanisha kibanda, mahali pa kujisitiri, au kichaka cha maficho.
    reason: lexical_alternative
  - marker: c
    text: Au, “anapomvuta ndani ya wavu wake,” au “kwa wavu wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶאֱרֹב
  choice: huvizia
  rationale: Kitenzi ארב humaanisha kuvizia kwa kusubiri nafasi ya kushambulia. “Huvizia” ni Kiswahili cha kawaida na huhifadhi urudiaji wa kishairi.
- source_word: בַּמִּסְתָּר
  choice: mafichoni
  rationale: מִסְתָּר huonyesha mahali pa kujificha au hali ya usiri; “mafichoni” ni ya asili na hudokeza kujisitiri kwa nia ya kushambulia.
- source_word: כְּאַרְיֵה
  choice: kama simba
  rationale: Huhifadhi moja kwa moja tashbihi ya mnyama hatari anayewinda.
- source_word: בְסֻכֹּה
  choice: katika kichaka chake
  rationale: סֻכָּה hapa inaweza kuwa kibanda, maficho, au kichaka kinachotoa sitara. Katika mfano wa simba anayevizia, “kichaka chake” huhifadhi picha ya maficho bila kudai kwa lazima kuwa ni pango.
- source_word: לַחֲטוֹף
  choice: ili amnyakue
  rationale: חטף hueleza kukamata kwa ghafula na kwa nguvu; “amnyakue” huhifadhi kasi na ukali wa tendo.
- source_word: עָנִי
  choice: maskini
  rationale: עָנִי inaweza kumaanisha maskini, mwenye kuteseka, au mnyonge. Muktadha wa ukandamizaji wa kijamii unaunga mkono “maskini,” huku udhaifu wake ukibaki dhahiri.
- source_word: יַחְטֹף
  choice: humkamata
  rationale: Hutafsiri tendo la kukamata kwa nguvu kwa Kiswahili cha kawaida. Tofauti ndogo ya kitenzi huepusha urudiaji usio wa asili, ingawa tendo lilelile la uwindaji linabaki.
- source_word: בְּמָשְׁכוֹ
  choice: kwa kumvuta
  rationale: Muundo wenye ב unaweza kuonyesha njia au hali inayoandamana na tendo. “Kwa kumvuta” huhifadhi maana ya namna ya kumkamata bila kuamua kimyakimya kuwa ni wakati tu.
- source_word: בְרִשְׁתּוֹ
  choice: katika wavu wake
  rationale: רֶשֶׁת ni wavu. “Katika wavu wake” hufuata kwa karibu kihusishi cha Kiebrania na kuacha wazi kama wavu ni chombo au mahali anapovutwa mwathiriwa.
