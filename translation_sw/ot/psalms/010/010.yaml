  text: He crouches[a]; he bows down[c][b], and the helpless fall by his might.
translation:
  language: sw
  text: Anajikunyata; anainama, na wanyonge huanguka kwa nguvu zake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania cha mstari huu ni kigumu. “Kwa nguvu zake” kinaweza pia kueleweka kuwa “kwa watu wake wenye nguvu,” au kwa lugha ya mfano, “katika makucha yake yenye nguvu.” Baadhi ya tafsiri huelewa kitenzi kuwa “naye huanguka” badala ya “wanyonge huanguka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/דכה
  choice: Anajikunyata
  rationale: Umbo la Kiebrania ni gumu, lakini katika muktadha wa mwovu anayewinda walio dhaifu linaeleweka vyema kuwa mkao wa kujishusha na kujificha, si kupondwa.
- source_word: יָשֹׁחַ
  choice: anainama
  rationale: Kitenzi kina maana ya kuinama au kujishusha; tafsiri hii inadumisha picha ya mwili bila kuongeza ufafanuzi usio katika matini.
- source_word: וְ/נָפַ֥ל ... חלכאים
  choice: na wanyonge huanguka
  rationale: Ingawa kitenzi ni umoja wa kiume katika umbo lake, sintaksia ni iliyobanwa na ngumu. Muktadha unaunga mkono kuwa wanyonge ndio wanaoanguka mikononi mwa mwovu.
- source_word: חלכאים
  choice: wanyonge
  rationale: Neno linawaeleza walio dhaifu, wenye taabu, au wasio na uwezo wa kujilinda; “wanyonge” ni la kawaida, lenye heshima, na linafaa muktadha.
- source_word: בַּ/עֲצוּמָי/ו
  choice: kwa nguvu zake
  rationale: Ingawa umbo la wingi linaweza kutafsiriwa kihalisi “kwa wenye nguvu wake,” hapa linaweza kutumiwa kwa maana ya nguvu au uwezo wa mwovu. “Kwa nguvu zake” ni Kiswahili cha asili na hudumisha kiambishi cha umilikaji pamoja na uwezekano wa wingi wa mkazo.
theological_decisions: []
translation_notes:
