base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/007.yaml
  text: His mouth is full of cursing and deceit and oppression[b][a]; under his tongue are trouble and wickedness.
translation:
  language: sw
  text: Kinywa chake kimejaa laana[a], udanganyifu na uonevu; chini ya ulimi wake kuna taabu na uovu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kulaani”; nomino ya Kiebrania inaweza pia kumaanisha “kiapo” katika baadhi ya miktadha, lakini hapa muktadha wa maneno yenye uhasama unapendelea “laana.”
    reason: lexical_alternative
  - marker: b
    text: Au “madhara na uovu” badala ya “taabu na uovu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָלָה
  choice: laana
  rationale: Katika muktadha huu wa maneno yenye uhasama, nomino hii inaelekea kumaanisha laana badala ya kiapo kisichoegemea upande wowote.
- source_word: פִּיהוּ מָלֵא
  choice: Kinywa chake kimejaa
  rationale: Inahifadhi taswira ya Kiebrania huku ikiwa usemi wa kawaida na wa asili katika Kiswahili.
- source_word: מִרְמוֹת
  choice: udanganyifu
  rationale: Neno hili huonyesha hila au udanganyifu; umoja wa dhana unasikika kwa asili katika orodha hii ya Kiswahili.
- source_word: תֹךְ
  choice: uonevu
  rationale: Katika muunganiko huu neno linaonyesha dhuluma au kosa lenye kuwadhuru wengine; ‘uonevu’ ni la kawaida na linaonyesha madhara ya kijamii.
- source_word: תַּחַת לְשׁוֹנוֹ
  choice: chini ya ulimi wake
  rationale: Tafsiri ya karibu huhifadhi taswira hai ya jambo baya lililofichika katika usemi au kusudi.
- source_word: עָמָל
  choice: taabu
  rationale: Hapa si kazi ya kawaida, bali shida au madhara yanayosababishwa; ‘taabu’ huhifadhi upana huo bila kufafanua kupita kiasi.
- source_word: אָוֶן
  choice: uovu
  rationale: Neno hili huonyesha ubaya, kosa, au uovu; ‘uovu’ lina uzito wa kimaadili na linaeleweka kwa urahisi.
