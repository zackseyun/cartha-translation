source:
  edition: WLC
  text: יָ֘חִ֤ילוּ דרכ/ו בְּ/כָל עֵ֗ת מָר֣וֹם מִ֭שְׁפָּטֶי/ךָ מִ/נֶּגְדּ֑/וֹ כָּל צ֝וֹרְרָ֗י/ו יָפִ֥יחַ בָּ/הֶֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/005.yaml
  text: His ways prosper at all times[a]; your judgments are on high, out of his sight; as for all his adversaries[b], he snorts at them.
translation:
  language: sw
  text: Njia zake hufanikiwa nyakati zote[a]; hukumu zako ziko juu, mbali naye; naye huwapulizia wapinzani wake wote kwa dharau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Njia zake ni imara nyakati zote.” Kitenzi cha Kiebrania ni kigumu; pia kimeeleweka kwa maana inayohusiana na kujipinda au kuzaa kwa uchungu. Hata hivyo, muktadha unaunga mkono zaidi wazo la kuendelea kufanikiwa au kuwa salama.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “huwapulizia.” Hii ni picha dhahiri ya kutoa pumzi kwa dharau.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחִילוּ
  choice: hufanikiwa
  rationale: Kitenzi hiki ni kigumu katika muktadha huu. Maana ya kufanikiwa au kuendelea salama inafaa zaidi katika malalamiko ya zaburi kuhusu mafanikio yanayoonekana ya mtu mwovu, huku uwezekano mwingine ukibainishwa katika tanbihi.
- source_word: דַּרְכּוֹ
  choice: njia zake
  rationale: Hii inadumisha sitiari ya Kiebrania kuhusu mwenendo na mkondo wa maisha ya mtu, nayo ni ya kawaida katika Kiswahili cha kibiblia.
- source_word: בְּכָל עֵת
  choice: nyakati zote
  rationale: Kirai hiki kinaonyesha hali inayoendelea daima.
- source_word: מָרוֹם מִשְׁפָּטֶיךָ
  choice: hukumu zako ziko juu
  rationale: Tafsiri hii inadumisha picha ya mahali pa juu na hali ya hukumu za Mungu kuonekana kuwa mbali na mwovu bila kuifasiri kupita kiasi.
- source_word: מִנֶּגְדּוֹ
  choice: mbali na macho yake
  rationale: Pamoja na neno linalotangulia la kuwa juu, kirai hiki huonyesha kwamba hukumu za Mungu hazionekani wala hazizingatiwi na mtu huyo.
- source_word: כָּל צֹרְרָיו
  choice: wote wanaompinga
  rationale: Kauli hii ni ya asili katika Kiswahili na inajumuisha maadui au wapinzani wote wa mtu huyo.
- source_word: יָפִיחַ בָּהֶם
  choice: huwapulizia kwa dharau
  rationale: Tafsiri hii inadumisha picha halisi ya kutoa pumzi kuelekea kwa wapinzani kama ishara ya kuwadharau, badala ya kutumia tu neno la kufasiri kama ‘huwadhihaki.’
theological_decisions:
- issue: Maana ya יָחִילוּ kuhusu hali ya mtu mwovu
  choice: Njia za mtu mwovu hufanikiwa daima kwa jinsi hali inavyoonekana katika malalamiko ya mtunga-zaburi.
  alternative: Njia zake ni imara au salama daima; au kitenzi kina maana inayohusiana na kuuma kwa uchungu au kugaagaa.
  rationale: 'Muktadha unaomboleza mafanikio yanayoonekana na kiburi cha mwovu: hukumu za Mungu zinaonekana kuwa mbali naye, naye anawadharau wapinzani wake. Hata hivyo, ugumu halisi wa kitenzi umehifadhiwa katika tanbihi.'
- issue: Uhusiano wa hukumu za Mungu na mtazamo wa mwovu
  choice: Hukumu ziko juu na mbali na macho yake.
  alternative: Hukumu zimeinuliwa kwa asili yake tu, au ziko mbele yake lakini hazizingatiwi.
  rationale: Muundo wa Kiebrania unaunganisha wazo la kuwa juu na kuwa mbali naye; tafsiri haidai kwamba hukumu hizo hazipo, bali zinaonekana kuwa nje ya upeo wa mtazamo au uzingatiaji wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi ulio wazi, wa sasa na wenye hadhi. Sitiari za ‘njia,’ hukumu zilizo ‘juu,’ na kuwapulizia wapinzani zimehifadhiwa kadiri zinavyoeleweka, huku tanbihi zikieleza utata wa kitenzi cha kwanza na picha ya mwisho.
