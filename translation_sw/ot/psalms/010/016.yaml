  yaml_path: translation/ot/psalms/010/016.yaml
  text: Yahweh is King forever and ever[a]; nations have perished from his land.
translation:
  language: sw
  text: Yahwe ni Mfalme milele na milele; mataifa yameangamia, yakatoweka kutoka nchi yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dunia yake.” Nomino ya Kiebrania inaweza kumaanisha “nchi” au “dunia,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatolewa kama jina binafsi la Mungu kwa umbo la Kiswahili linalosomeka kwa urahisi, badala ya kulibadilisha kuwa cheo kama “BWANA”.
- source_word: מֶלֶךְ
  choice: ni Mfalme
  rationale: Muundo wa nomino-arifu katika Kiebrania umehifadhiwa kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: עוֹלָם וָעֶד
  choice: milele na milele
  rationale: Usemi huu wa Kiswahili unahifadhi msisitizo wa jozi ya maneno ya Kiebrania kuhusu utawala usio na mwisho.
- source_word: אָבְדוּ
  choice: yameangamia
  rationale: Kauli hii inaonyesha tukio lililotimia bila kuongeza wazo la kutendwa ambalo halijaelezwa wazi katika kitenzi cha Kiebrania.
- source_word: גּוֹיִם
  choice: mataifa
  rationale: Katika muktadha huu neno linamaanisha mataifa, si lazima “watu wa mataifa” kama kundi la kidini.
- source_word: מֵאַרְצוֹ
  choice: kutoka katika nchi yake
  rationale: “Nchi” ndiyo maana halisi na ya karibu zaidi katika muktadha, huku uwezekano wa maana pana ya “dunia” ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Andiko linatumia jina la Mungu moja kwa moja; kulitaja kama “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Upeo wa אַרְצוֹ
  choice: nchi yake
  alternative: dunia yake
  rationale: “Nchi yake” inafaa zaidi kwa mazingira ya karibu ya zaburi, lakini nomino ya Kiebrania inaweza pia kumaanisha dunia; tanbihi inahifadhi utata huo wa kweli.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
