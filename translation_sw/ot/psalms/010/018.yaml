lexical_decisions:
- source_word: לִשְׁפֹּט
  choice: kuwapatia haki
  rationale: Katika muktadha huu kitenzi kinaonyesha kusudi la Mungu kusikia kilio cha wanyonge na kutenda haki kwa ajili yao; “kuwapatia haki” ni Kiswahili cha kawaida chenye maana ya kimahakama.
- source_word: יָתוֹם
  choice: yatima
  rationale: “Yatima” ndilo neno la kawaida la Kiswahili kwa mtu aliyepoteza mzazi au wazazi na linahifadhi kundi la kijamii lililo hatarini linalotajwa na Kiebrania.
- source_word: דַּךְ
  choice: waliokandamizwa
  rationale: Neno hilo humaanisha waliopondwa, walioteswa, au walioshushwa; “waliokandamizwa” linaeleza hali yao kwa lugha ya sasa bila kupunguza uzito wa neno.
- source_word: בַּל יוֹסִיף עוֹד
  choice: asiendelee tena
  rationale: Muundo huu unakanusha kuendelea au kurudiwa kwa tendo; “asiendelee tena” unaonyesha kusudi au matokeo yanayotarajiwa.
- source_word: לַעֲרֹץ
  choice: kuwatia watu hofu
  rationale: Kitenzi kina wazo la kusababisha hofu kuu au kitisho. Kauli hii ya Kiswahili inalihifadhi bila kulichanganya na דַּךְ, ambalo tayari limetafsiriwa kwa wazo la kukandamizwa.
- source_word: אֱנוֹשׁ
  choice: mwanadamu
  rationale: “Mwanadamu” linaweza kumwakilisha mtu kwa ujumla huku likibeba wazo la udhaifu na umauti wa binadamu kuliko “mtu” peke yake.
- source_word: מִן הָאָרֶץ
  choice: wa duniani
  rationale: Kihalisi ni “kutoka katika dunia/nchi”; pamoja na אֱנוֹשׁ linaeleza mwanadamu wa kidunia, aliye wa kufa. “Wa duniani” ni la asili katika Kiswahili na linahifadhi tofauti kati ya mwanadamu na Mungu.
theological_decisions:
- issue: Umoja wa kiume wenye maana ya jumla katika אֱנוֹשׁ
  choice: mwanadamu wa duniani
  alternative: wanadamu wa duniani
  rationale: Kiebrania kina nomino ya umoja inayomwakilisha binadamu kwa ujumla. “Mwanadamu” huhifadhi umoja huo bila kudai kwamba anayelengwa lazima awe mwanamume, na “wa duniani” hudumisha msisitizo wa udhaifu wa kiumbe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Muundo wa kusudi umehifadhiwa kwa “ili,” na lugha ya haki, unyonge, na kitisho imewekwa wazi bila kuingiza msimamo wa kimadhehebu.
