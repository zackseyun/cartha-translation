  text: קוּמָ֤/ה יְהוָ֗ה אֵ֭ל נְשָׂ֣א יָדֶ֑/ךָ אַל תִּשְׁכַּ֥ח עניים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/012.yaml
  text: Rise up[a], O Yahweh; O God, lift up your hand. Do not forget the afflicted.
translation:
  language: sw
  text: Inuka, ee Yahweh; ee Mungu, inua mkono wako. Usiwasahau wanyonge.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maskini,” “wanyenyekevu,” au “wanaoonewa.” Neno la Kiebrania linaweza kumaanisha kwa upana watu waliowekwa chini na walio dhaifu au katika hali ya kudhurika.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: Inuka
  rationale: Kitenzi cha amri kinachoelekezwa kwa Mungu; “Inuka” ni Kiswahili cha kawaida kinachohifadhi uzito na uharaka wa ombi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֵל
  choice: ee Mungu
  rationale: Hapa ni mwito wa moja kwa moja unaolingana kishairi na “Yahwe”; “ee” huonyesha wazi usemi wa kumwita Mungu.
- source_word: נְשָׂא יָדֶךָ
  choice: inua mkono wako
  rationale: Tafsiri hii inadumisha taswira halisi ya Kiebrania ya Mungu kuinua mkono wake ili atende, bila kuifafanua moja kwa moja kuwa hukumu au wokovu.
- source_word: אַל תִּשְׁכַּח
  choice: Usiwasahau
  rationale: Inahifadhi maana ya kawaida ya katazo hilo na kurejelea kundi la watu kwa kiambishi cha nafsi kinachofaa.
- source_word: עניים
  choice: wanaoteseka
  rationale: Katika muktadha wa Zaburi 10, neno hili linawahusu watu waliowekwa chini na kudhulumiwa; “wanaoteseka” linawasilisha hali yao bila kuibana kwenye umaskini wa kiuchumi pekee.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; kulitohowa kunadumisha tofauti hiyo.
- issue: Maana pana ya עניים
  choice: wanaoteseka
  alternative: maskini, wanyenyekevu, au wanaokandamizwa
  rationale: Neno la Kiebrania linaweza kueleza hali ya kiuchumi, unyenyekevu, au kudhulumiwa. Muktadha unasisitiza waathiriwa walio dhaifu, hivyo tafsiri kuu inaacha upana fulani na tanbihi inaonyesha maana mbadala.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala ya kishairi. Marudio ya “ee” yanahifadhi miito miwili inayolingana katika Kiebrania, na taswira ya “mkono” haijafasiriwa kupita kiasi.
