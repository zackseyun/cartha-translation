  text: אָמַ֣ר בְּ֭/לִבּ/וֹ שָׁ֣כַֽח אֵ֑ל הִסְתִּ֥יר פָּ֝נָ֗י/ו בַּל רָאָ֥ה לָ/נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/011.yaml
  text: He says in his heart[a], “God has forgotten; he has hidden his face; he will never see.”
translation:
  language: sw
  text: Husema moyoni mwake[a], “Mungu amesahau; ameuficha uso wake; hataona kamwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Alisema moyoni mwake … Mungu husahau … huuficha uso wake … hataona milele.” Vitenzi vya Kiebrania vya hali timilifu katika ushairi vinaweza kutafsiriwa kwa maana ya wakati uliopo au wakati uliopita/timilifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
  choice: Husema
  rationale: Qal timilifu ya nafsi ya tatu umoja katika ushairi inaweza kueleza tendo la kawaida au linaloendelea. Wakati wa mazoea unafaa muktadha unaoonyesha mawazo ya ndani ya mwovu.
- source_word: בְּלִבּוֹ
  choice: moyoni mwake
  rationale: Nahau halisi ya Kiebrania imehifadhiwa kwa kuwa ni ya kawaida katika Kiswahili na inaonyesha fikira za ndani.
- source_word: שָׁכַח
  choice: amesahau
  rationale: Kitenzi kinamaanisha ‘kusahau’; hali timilifu inaonyesha dhana ya mwovu kwamba Mungu tayari amesahau.
- source_word: אֵל
  choice: Mungu
  rationale: Nomino hii ya umoja inamtaja Mungu; ‘Mungu’ ndiyo tafsiri ya kawaida na ya wazi.
- source_word: הִסְתִּיר פָּנָיו
  choice: ameuficha uso wake
  rationale: Taswira ya Kiebrania imehifadhiwa badala ya kufasiriwa kuwa kuondoa uangalifu au kibali.
- source_word: בַּל ... לָנֶצַח
  choice: kamwe
  rationale: Ukanushi pamoja na usemi wa kudumu unatoa maana ya ‘si wakati wowote,’ yaani ‘kamwe.’
- source_word: רָאָה
  choice: hataona
  rationale: Maana ya msingi ni ‘kuona.’ Ingawa katika muktadha inaweza kudokeza kutambua na kuhukumu, tafsiri hii haifungi maana hiyo kwa ufafanuzi.
theological_decisions:
- issue: Lugha ya kibinadamu kuhusu Mungu kuuficha uso wake
  choice: Kuhifadhi usemi ‘ameuficha uso wake’ katika matini kuu
  alternative: amegeuka; ameondoa uangalifu wake
  rationale: Kiebrania kinatumia taswira halisi kuhusu uso. Kuihifadhi kunadumisha uzito wa lugha ya kibiblia bila kuibana kwa fasiri moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Muundo wa kishairi na nahau ya ‘kuuficha uso’ zimehifadhiwa.
