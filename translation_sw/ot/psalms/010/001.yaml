  source_fidelity: Tafsiri inadumisha kwa usahihi maswali mawili yanayodokezwa na usambamba wa Kiebrania, jina יְהוָה kama “Yahwe,” taswira ya kusimama mbali, na kujificha katika nyakati za taabu. “Nyakati za taabu” huwakilisha vizuri לְעִתּוֹת בַּצָּרָה.
