reference: Psalms 10:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לָ/מָ֣ה יְ֭הוָה תַּעֲמֹ֣ד בְּ/רָח֑וֹק תַּ֝עְלִ֗ים לְ/עִתּ֥וֹת בַּצָּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/001.yaml
  text: Why[a], Yahweh, do you stand far away? Why do you hide yourself in times of trouble?
translation:
  language: sw
  text: Kwa nini, Yahwe, unasimama mbali? Kwa nini unajificha[a] nyakati za taabu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unajisitiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָה
  choice: Kwa nini
  rationale: Hili ni neno la kuuliza linaloanzisha kilio cha huzuni; “Kwa nini” linaonyesha kwa uwazi na kwa kawaida nguvu ya swali la Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa na cheo; “Yahwe” ni umbo linalofaa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: תַּעֲמֹד
  choice: unasimama
  rationale: Kitenzi עמד kimsingi humaanisha kusimama. Tafsiri hii inadumisha picha ya Mungu kuonekana kuwa mbali bila kuifafanua tu kuwa kutotenda.
- source_word: בְּרָחוֹק
  choice: mbali
  rationale: Neno hili linaonyesha umbali unaohisiwa, na “mbali” ni usemi wa kawaida wa Kiswahili unaohifadhi picha hiyo.
- source_word: תַּעְלִים
  choice: unajificha
  rationale: Hapa kitenzi kinaeleza kujifanya usionekane au kujisitiri; “unajificha” ni wazi, cha kawaida, na kinadumisha malalamiko kuhusu Mungu kutoonekana.
- source_word: לְעִתּוֹת
  choice: nyakati za
  rationale: Wingi wa עת unaonyesha vipindi au nyakati; “nyakati za” unadumisha wingi huo kwa Kiswahili cha kawaida.
- source_word: בַּצָּרָה
  choice: taabu
  rationale: צָרָה linaweza kumaanisha taabu, dhiki, au shida. “Taabu” ni pana na linafaa sauti ya kilio bila kubana maana.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia moja kwa moja jina la Mungu, si cheo. Kulihifadhi kama “Yahwe” kunadumisha hali yake ya kuwa jina binafsi, huku tahajia ikifuata matumizi ya Kiswahili.
- issue: Kama neno la swali lirudiwe katika mstari wa pili
  choice: Kurudia “Kwa nini”
  alternative: 'Kuacha kishazi cha pili kama taarifa: “unajificha nyakati za taabu”'
  rationale: Ingawa לָמָה halijarudiwa waziwazi katika kishazi cha pili, usambamba wa kishairi unaonyesha kuwa swali lilelile linaendelea. Kulirudia kunafanya kilio kisikike kwa kawaida katika Kiswahili bila kubadili maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa moja kwa moja, wenye heshima na unaoeleweka. Taswira za kusimama mbali na kujificha zimehifadhiwa, pamoja na muundo wa maswali mawili ya kilio.
