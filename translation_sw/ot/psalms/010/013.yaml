  text: Why does the wicked man despise God? He says in his heart, “You will not call to account.”
translation:
  language: sw
  text: Kwa nini mtu mwovu anamdharau Mungu? Amesema moyoni mwake, “Hutadai hesabu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִאֵץ
  choice: anamdharau
  rationale: Kitenzi hiki kina maana ya kumkataa au kumtendea Mungu kwa dharau; ‘anamdharau’ ni cha kawaida, chenye uzito, na kinaendana na muktadha.
- source_word: רָשָׁע
  choice: mtu mwovu
  rationale: Nomino ya Kiebrania humaanisha mtu mwovu; kuongeza ‘mtu’ kunafanya sentensi iwe ya asili katika Kiswahili bila kubadili maana.
- source_word: תִדְרֹשׁ
  choice: utadai hesabu
  rationale: Katika muktadha huu, kitenzi ‘kutafuta/kuchunguza/kudai’ kinaelekea kwenye kumwajibisha mtu; ‘kudai hesabu’ huhifadhi wazo la Mungu kutaka uwajibikaji bila kulifanya mahususi kupita kiasi.
- source_word: אָמַר בְּלִבּוֹ
  choice: Amesema moyoni mwake
  rationale: Huhifadhi taswira ya Kiebrania ya kauli ya ndani, huku ikisikika kwa heshima na kueleweka katika Kiswahili.
theological_decisions:
- issue: Anayelengwa na kitenzi cha mwisho
  choice: “Hutadai hesabu” kama maneno yanayoelekezwa kwa Mungu
  alternative: “Mungu hatadai hesabu”
  rationale: Kiebrania kina nafsi ya pili ya kiume umoja, hivyo tafsiri ya moja kwa moja inamwonyesha mwovu akimwambia Mungu moyoni mwake.
- issue: Maana ya דָּרַשׁ katika muktadha wa hukumu
  choice: kudai hesabu
  alternative: kuuliza habari / kuchunguza / kuadhibu
  rationale: Chaguo hili linaonyesha uwajibikaji wa kimungu unaodokezwa na muktadha, bila kusawazisha kitenzi moja kwa moja na adhabu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Muundo wa swali na kauli ya moyoni umehifadhiwa.
