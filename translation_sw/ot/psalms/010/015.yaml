base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/015.yaml
  text: Break the arm of the wicked and evil man[a]; seek out his wickedness until you find none.
translation:
  language: sw
  text: Uvunje mkono wa mtu mwovu na mbaya[a]; utafute uovu wake mpaka usiupate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uvunje mkono wa mwovu na mtenda maovu; utafute uovu wake mpaka usiupate.” Kiebrania kinaweza kusomwa kwa kuelewa sifa ya pili kama nomino sambamba; kitenzi pia humaanisha “kutafuta” au “kuchunguza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֹר
  choice: Uvunje
  rationale: Ni amri ya moja kwa moja iliyoelekezwa kwa Mungu. “Uvunje” huhifadhi nguvu ya ombi bila kuongeza maana isiyokuwamo.
- source_word: זְרוֹעַ
  choice: mkono
  rationale: Neno hilo humaanisha “mkono” kihalisi na hapa ni mfano wa nguvu au uwezo wa mtu mwovu. Taswira halisi imehifadhiwa.
- source_word: רָשָׁע
  choice: mtu mwovu
  rationale: Ni kivumishi kilichotumiwa kama nomino kumaanisha mtu mwenye uovu. Kiswahili cha kawaida huhitaji kutaja “mtu” ili maana ya umoja iwe wazi.
- source_word: וָרָע
  choice: mtu mbaya
  rationale: Inaweza kueleweka kama sifa ya pili ya mtu yuleyule, sambamba na רָשָׁע. “Mtu mbaya” huhifadhi urudiaji wa kishairi bila kuibadili moja kwa moja kuwa “mtenda maovu.”
- source_word: תִּדְרוֹשׁ
  choice: utafute
  rationale: Kitenzi kina maana ya kutafuta, kuchunguza, au kudai habari. “Utafute” kinafuata kwa karibu taswira ya Kiebrania na katika muktadha huu bado hudokeza uchunguzi wa hukumu.
- source_word: רִשְׁעוֹ
  choice: uovu wake
  rationale: Huhifadhi uhusiano wa kileksia na “mwovu” na kurejelea uovu au hatia ya mtu huyo.
- source_word: בַל תִּמְצָא
  choice: mpaka usiupate tena
  rationale: 'Huwasilisha matokeo yanayotamaniwa: Mungu ashughulikie uovu kikamilifu kiasi kwamba hakuna unaobaki kupatikana. “Tena” hufanya usemi uwe wa kawaida katika Kiswahili.'
theological_decisions:
- issue: Jinsi ya kutafsiri mfano wa “mkono” wa mtu mwovu
  choice: Kuhifadhi taswira halisi “mkono” katika matini kuu
  alternative: Kutafsiri kwa maana ya moja kwa moja kama “nguvu” au “uwezo”
  rationale: Ombi ni kwamba Mungu avunje uwezo wa mtesi wa kuendelea kudhuru. Kuhifadhi “mkono” kunatunza ushairi wa Kiebrania na hakumlazimishi msomaji kwenye ufafanuzi mmoja.
- issue: Jinsi ya kuelewa kishazi cha mwisho בַל תִּמְצָא
  choice: “mpaka usiupate tena”
  alternative: “ili usiupate” au “utakapotafuta, hutaupata”
  rationale: Kishazi kinaeleza matokeo yanayotamaniwa ya Mungu kuutafuta na kuushughulikia uovu. Tafsiri hii huhifadhi nguvu ya ombi bila kudai wazi zaidi ya matini kwamba mtu mwovu ameangamizwa.
- issue: Uhusiano kati ya רָשָׁע na וָרָע
  choice: 'Kuzichukulia kama sifa mbili za mtu mmoja: “mtu mwovu, mtu mbaya”'
  alternative: 'Kuzichukulia kama watu au makundi mawili: “mwovu na mtenda maovu”'
  rationale: Kiwakilishi cha umoja katika “uovu wake” kinaunga mkono kwa urahisi rejeo la mtu mmoja, lakini muundo wa Kiebrania unaweza pia kusomwa kama majina mawili sambamba; kwa hiyo uwezekano huo umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi na taswira ya Kiebrania zimehifadhiwa huku utata halisi wa “mtu mbaya/mtenda maovu” ukionyeshwa katika tanbihi.
