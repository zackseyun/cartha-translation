  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִלֵּל
  choice: hujisifu
  rationale: Katika muktadha huu kitenzi kina maana ya kujivuna au kujisifu, si kutoa sifa kwa mwingine.
- source_word: תַּאֲוַת נַפְשׁוֹ
  choice: tamaa ya nafsi yake
  rationale: 'Huhifadhi muundo na maana pana ya Kiebrania: kile ambacho nafsi yake inakitamani.'
- source_word: בֹצֵעַ
  choice: mwenye pupa
  rationale: Nomino hii inaweza kumaanisha mtu mwenye tamaa ya faida, hasa faida isiyo ya haki; 'mwenye pupa' ni ya asili na haibani maana kupita ushahidi.
- source_word: בֵּרֵךְ
  choice: hujibariki
  rationale: Huchukua kitenzi kwa maana ya kujipongeza au kujitangazia heri, kulingana na sambamba ya kujisifu na muktadha hasi.
- source_word: נִאֵץ
  choice: akimdharau
  rationale: Huwasilisha dharau au kumkataa Mungu kwa kejeli; kishirikishi 'huku' kinaonyesha matendo yanayohusiana bila kufuta mvutano wa muundo.
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea katika Biblia za Kiswahili ya kuwakilisha jina la agano YHWH kwa herufi kubwa.
theological_decisions:
- issue: Je, mwenye pupa anambariki BWANA au anajibariki?
  choice: hujibariki huku akimdharau BWANA
  alternative: humbariki mwenye pupa, lakini humdharau BWANA / mwenye pupa humbariki na kumdharau BWANA
  rationale: Sintaksia ya Kiebrania ni ngumu na inaweza kuchanganuliwa kwa njia tofauti. Muktadha wa kujisifu na dharau unaunga mkono maana ya kujibariki au kujipongeza, lakini tafsiri haiongezi fundisho la dhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. 'Nafsi' imehifadhiwa kwa sababu inafaa katika ushairi wa Zaburi; 'mwenye pupa' ni ya kisasa na ya kawaida kuliko istilahi nzito za tamaa ya faida.
