- source_word: עֵינָיו
  choice: macho yake
  rationale: Tafsiri ya moja kwa moja inadumisha picha dhahiri ya Kiebrania.
- source_word: לְחֵלְכָה
  choice: wale wasiojiweza
  rationale: Neno hili gumu humrejelea mwathiriwa dhaifu, mwenye taabu, au asiye na uwezo wa kujilinda katika muktadha huu.
- source_word: יִצְפֹּנוּ
  choice: huwatazama kwa siri
  rationale: Kitenzi huhusiana kimsingi na kujificha au kuvizia; pamoja na 'macho yake,' maana yake hapa ni kuwachunguza wahanga kwa siri.
