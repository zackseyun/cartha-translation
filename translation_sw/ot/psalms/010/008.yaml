    text: Kishazi cha mwisho ni kigumu. Kitenzi cha Kiebrania kwa maana ya karibu kinahusiana na kujificha au kuvizia; kinapotumiwa pamoja na “macho yake,” maana ni kuwachunguza kwa siri watu walio dhaifu ili awavizie.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב בְּמַאְרַב
  choice: huketi akivizia
  rationale: Inadumisha picha halisi ya kuketi huku kirai kinachofuata kikionyesha kuvizia kwa uadui.
