  text: Anasema moyoni mwake, “Sitatikiswa[a]; kizazi baada ya kizazi sitapatwa na mabaya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sitaondolewa mahali pangu,” au “Sitayumba.” Kitenzi cha Kiebrania kinaweza kumaanisha kutikiswa, kuyumba, au kuondolewa katika hali thabiti.
    reason: lexical_alternative
  - marker: b
    text: Kishazi cha mwisho ni kifupi katika Kiebrania. Pia kinaweza kutafsiriwa, “kizazi baada ya kizazi, ambaye hayuko katika taabu,” au “sitakumbana kamwe na msiba.”
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר
  choice: Anasema
  rationale: Kauli timilifu ya Kiebrania katika ushairi inaweza kueleza hali ya sasa kwa uhai; wakati wa sasa unafaa katika maelezo haya ya mtu mwovu.
- source_word: בְּלִבּוֹ
  choice: moyoni mwake
  rationale: Huhifadhi sitiari ya Kiebrania kuhusu mawazo au mazungumzo ya ndani, nayo inaeleweka vizuri katika Kiswahili.
- source_word: בַּל אֶמּוֹט
  choice: Sitatikiswa
  rationale: Kitenzi מוט katika Niphal huonyesha kutikiswa, kuyumbishwa, au kuondolewa katika hali ya uthabiti. ‘Sitatikiswa’ huhifadhi picha hiyo na majivuno ya usalama.
- source_word: לְדֹר וָדֹר
  choice: kizazi baada ya kizazi
  rationale: Hueleza mwendelezo katika vizazi vinavyofuatana; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: אֲשֶׁר לֹא בְרָע
  choice: sitapatwa na mabaya
  rationale: Kishazi hiki cha Kiebrania kimeachwa kifupi na kina utata. Tafsiri hii inaendeleza kauli ya nafsi ya kwanza na kueleza kutofikiwa na taabu, msiba, au uovu bila kubana maana kuwa aina moja tu ya shida.
theological_decisions:
- issue: Kishazi cha mwisho kilicho kifupi na mtazamo wa msemaji
  choice: 'Kimewasilishwa kama mwendelezo wa majivuno ya mtu mwovu katika nafsi ya kwanza: ‘sitapatwa na mabaya.’'
  alternative: 'Kinaweza kueleweka kama maelezo ya msemaji: ‘ambaye hayumo katika taabu,’ au kwa maana ya ‘sitakumbana kamwe na msiba.’'
  rationale: Muktadha unaunga mkono kuendeleza maneno ya ndani ya mtu mwovu, lakini Kiebrania hakitaji wazi kitenzi wala kiwakilishi katika kishazi cha mwisho. Tanbihi inalinda utata huo wa kweli.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. ‘Moyoni mwake’ huhifadhi nahau ya chanzo, na ‘mabaya’ hubakiza upana wa רָע huku tanbihi ikieleza uwezekano wa taabu au msiba.
