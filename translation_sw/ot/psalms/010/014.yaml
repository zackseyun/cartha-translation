  text: רָאִ֡תָה כִּֽי אַתָּ֤ה עָ֘מָ֤ל וָ/כַ֨עַס תַּבִּיט֮ לָ/תֵ֪ת בְּ/יָ֫דֶ֥/ךָ עָ֭לֶי/ךָ יַעֲזֹ֣ב חֵלֶ֑כָה יָ֝ת֗וֹם אַתָּ֤ה הָיִ֬יתָ עוֹזֵֽר־׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/014.yaml
  text: You have seen[a], for you look upon trouble and grief, to take it into your hand. The helpless commits himself to you[c][b]; you have been the helper of the fatherless.
translation:
  language: sw
  text: Umeona, kwa maana wewe hutazama taabu na huzuni, ili uchukue jambo hilo mkononi mwako[a]. Mnyonge hujikabidhi kwako[b]; wewe umekuwa msaidizi wa asiye na baba[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “ili uliweke mkononi mwako.” Nahau ya Kiebrania inaweza pia kueleweka kuwa Mungu analichukua jambo hilo ili kulishughulikia.'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “Mwenye taabu hukuachia shauri lake.” Kiebrania kinaweza kumaanisha kwamba mnyonge anajikabidhi mwenyewe kwa Mungu au anamwachia Mungu shauri lake.'
    reason: alternative_reading
  - marker: c
    text: 'Au: “yatima.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִתָה
  choice: Umeona
  rationale: Kitenzi cha Qal timilifu, nafsi ya pili umoja wa kiume, kinamwelekea Mungu. Wakati timilifu wa Kiswahili unaonyesha kwamba Mungu amekwisha kuona hali inayolalamikiwa.
- source_word: עָמָל
  choice: taabu
  rationale: Katika malalamiko ya Zaburi neno hili linaweza kumaanisha dhiki au madhara yanayosababishwa na uovu, si kazi tu.
- source_word: כַעַס
  choice: huzuni
  rationale: Likiwa sambamba na עָמָל, linaeleza maumivu au masikitiko yanayotokana na uonevu; ‘huzuni’ huepuka kulifanya limaanishe hasira ya Mungu bila msingi wa kutosha.
- source_word: תַּבִּיט
  choice: hutazama
  rationale: Hiphil ya נבט humaanisha kutazama kwa makini au kuangalia; hali ya mazoea katika Kiswahili inafaa kwa tabia ya Mungu ya kuona.
- source_word: לָתֵת בְּיָדֶךָ
  choice: ili uchukue jambo hilo mkononi mwako
  rationale: Nahau ya Kiebrania, kihalisi ‘kuliweka mkononi mwako,’ inaelekea kuonyesha Mungu kulichukua jambo ili alishughulikie. Kiswahili hiki kinahifadhi picha ya mkono na maana ya hatua inayofuata.
- source_word: עָלֶיךָ יַעֲזֹב
  choice: hujikabidhi kwako
  rationale: Muundo huu unaonyesha kujitia chini ya uangalizi wa Mungu au kumwachia Mungu shauri, si kuachwa kwa maana ya kutelekezwa.
- source_word: חֵלֶכָה
  choice: Mnyonge
  rationale: Neno adimu linamtaja mtu dhaifu, mwenye bahati mbaya, au asiye na uwezo wa kujitetea. ‘Mnyonge’ ni la kawaida na linafaa katika muktadha wa kumtegemea Mungu.
- source_word: יָתוֹם
  choice: asiye na baba
  rationale: Neno linamtaja hasa mtoto aliyefiwa na baba; tafsiri hii huhifadhi kundi la kijamii linalokusudiwa, huku tanbihi ikitaja ‘yatima’ kama mbadala wa kawaida.
- source_word: עוֹזֵר
  choice: msaidizi
  rationale: Kivumishi-tendo kinatumika kama nomino kumweleza Mungu binafsi kuwa yeye anayesaidia.
theological_decisions:
- issue: Iwapo kuona kwa Mungu ni kutambua tu au kunaelekea kwenye kuingilia kati
  choice: Mungu huona taabu na huzuni na kulichukua jambo hilo mkononi mwake ili alishughulikie
  alternative: Mungu huona taabu na huzuni ili viwekwe mkononi mwake
  rationale: Kirai לָתֵת בְּיָדֶךָ kinaelekea kwenye hatua ya Mungu, lakini tafsiri haibainishi zaidi namna ya hukumu au msaada.
- issue: Maana ya tendo la mnyonge kwa Mungu
  choice: Mnyonge hujikabidhi kwa Mungu
  alternative: Mnyonge humwachia Mungu shauri lake
  rationale: Kiebrania kinaweza kuelekeza kwa mtu mwenyewe au kwa shauri lake. Matini kuu inaonyesha utegemezi wa mtu kwa Mungu, na tanbihi inahifadhi uwezekano wa shauri kukabidhiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi bila kuwa kigumu. ‘Umeona … hutazama’ huhifadhi mabadiliko ya hali ya kitenzi katika Kiebrania; ‘mkono’ huhifadhi taswira ya asili huku tanbihi ikifafanua nahau.
