base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/004.yaml
  text: In the pride of his face[a], the wicked man does not seek; all his thoughts are[b], “There is no God.”
translation:
  language: sw
  text: 'Kwa kiburi chake, mtu mwovu hatafuti; mawazo yake yote ni: “Mungu hayupo.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu hayumo katika mawazo yake yoyote.” Kiebrania kinaweza pia kueleweka kuwa Mungu hayupo katika fikira zake zote, badala ya kuwa kinanukuu moja kwa moja anachofikiri.
    reason: alternative_reading
lexical_decisions:
- source_word: רָשָׁע
  choice: mtu mwovu
  rationale: Nomino ya kivumishi cha umoja imewasilishwa kwa mtu mmoja, huku ikidumisha tabia yake ya kuwa mfano wa waovu kwa ujumla.
- source_word: כְּגֹבַהּ אַפּוֹ
  choice: Kwa kiburi kinachoonekana usoni mwake
  rationale: גֹבַהּ ni kuinuka au kujikweza, na אַף hapa ina picha halisi ya pua/uso. Tafsiri hii inatoa maana ya majivuno yanayoonekana katika sura au mwenendo bila kuigeuza kuwa hasira.
- source_word: בַּל יִדְרֹשׁ
  choice: hatafuti
  rationale: Chembe ya ukanushi pamoja na kitenzi kisichotimilika inaeleza tabia au kukataa kutafuta, si wakati ujao tu. Hakuna yambwa lililotajwa wazi katika Kiebrania, hivyo tafsiri haijaongeza ‘Mungu’ au ‘yeye’ hapa.
- source_word: אֵין אֱלֹהִים
  choice: “Mungu hayupo”
  rationale: Ukanushi huu wa kuwepo kwa Mungu umetolewa kama yaliyomo katika fikira za mtu mwovu, kwa lugha ya kawaida na yenye nguvu katika Kiswahili.
- source_word: כָּל מְזִמּוֹתָיו
  choice: katika mawazo yake yote husema
  rationale: מְזִמּוֹת inaweza kumaanisha mawazo, mipango, au hila. Katika muktadha huu ‘mawazo’ yanafaa zaidi, na ‘husema’ huunganisha kwa kawaida sentensi inayofuata kama yaliyomo katika fikira zake.
theological_decisions:
- issue: Uhusiano wa kisintaksia wa kishazi cha mwisho
  choice: Kuchukua ‘Mungu hayupo’ kuwa yaliyomo katika mawazo ya mtu mwovu.
  alternative: Kuelewa kuwa Mungu hayumo katika mawazo yake yoyote.
  rationale: Mpangilio wa maneno wa Kiebrania unaruhusu mitazamo yote miwili. Matini kuu inadumisha nguvu ya kauli ya kukana kuwapo kwa Mungu, huku tanbihi ikihifadhi usomaji mwingine unaowezekana bila kuamua mvutano huo kimyakimya.
- issue: Yambwa la kitenzi יִדְרֹשׁ
  choice: 'Kutotaja yambwa wazi: ‘hatafuti.’'
  alternative: ‘Hamtafuti Mungu’ au ‘hamtafuti yeye.’
  rationale: Kiebrania hakina yambwa wazi katika kishazi hiki. Muktadha unaelekeza kwa Mungu, lakini kutoliacha likitajwa hudumisha muundo na kiasi cha kutokamilika kwa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Kiburi kinachoonekana usoni’ huweka picha ya Kiebrania kwa namna ya asili, na ‘Mungu hayupo’ ni kauli ya kawaida kuliko ‘hakuna Mungu’ katika muktadha huu wa kukana kuwapo kwake.
