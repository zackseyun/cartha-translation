lexical_decisions:
- source_word: אַשֻּׁרֵינוּ
  choice: Hatua zetu
  rationale: Neno hili humaanisha hatua au nyayo za mtu. “Hatua zetu” linadumisha taswira ya mwenendo wa kundi lililozingirwa.
- source_word: עַתָּה
  choice: sasa
  rationale: Kielezi hiki kinaonyesha kuwa hatari hiyo ni ya wakati wa sasa.
- source_word: סבבוני
  choice: wamenizunguka
  rationale: Kiambishi cha Kiebrania ni cha nafsi ya kwanza umoja, “-ni.” Tafsiri hii inahifadhi badiliko la ghafla kutoka “zetu” hadi “-ni” badala ya kulisawazisha kimya kimya.
- source_word: עֵינֵיהֶם יָשִׁיתוּ
  choice: wamekaza macho yao
  rationale: Kirai hiki huonyesha kuelekeza au kukaza macho kwa kusudi fulani; Kiswahili hiki ni cha asili na kinahifadhi taswira ya uadui wenye makusudi.
- source_word: לִנְטוֹת בָּאָרֶץ
  choice: ili watuangushe chini
  rationale: Katika muktadha huu, kitenzi cha kuinamisha au kuelekeza chini kinaonyesha nia ya kuwaangusha waombaji chini. “Chini” ni usemi wa kawaida wa Kiswahili kwa taswira ya kuangushwa ardhini.
theological_decisions:
- issue: Badiliko la rejeleo kutoka wingi kwenda umoja
  choice: Kuhifadhi “Hatua zetu … wamenizunguka” katika maandishi
  alternative: “Wamezingira hatua zetu” au “wametuzunguka”
  rationale: Maandishi ya Kimasora yana “hatua zetu” lakini kitenzi kina kiambishi cha umoja “-ni.” Kuhifadhi mvutano huo kunawakilisha ushahidi wa chanzo bila kuamua kimya kimya kwamba rejeleo lote ni la kundi.
- issue: Yambwa lisilotajwa wazi pamoja na לנטות
  choice: watuangushe
  alternative: waniangushe; wainamishe chini
  rationale: Kiebrania hakitaji yambwa la kitenzi-jina wazi. Wingi unafaa muktadha wa “hatua zetu,” lakini tanbihi inahifadhi uwezekano wa umoja na maana halisi zaidi ya kuinamisha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mstari mrefu umetenganishwa kwa alama ya mkato ili kufanya “Hatua zetu” isimame mbele kama ilivyo katika Kiebrania na kuhifadhi badiliko la nafsi.
