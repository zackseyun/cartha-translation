  text: Hatua zetu—sasa wamenizunguka[a]; wamekaza macho yao ili waniangushe chini[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi kina, “Hatua zetu—sasa wamenizunguka,” kikibadilika kutoka wingi kwenda umoja. Pia yaweza kueleweka, “Sasa wamezingira hatua zetu.”
