  text: kutoka kwa waovu wanaoniangamiza, adui zangu wanaoutaka uhai wangu wanaonizunguka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “adui zangu wananizunguka kwa nia/hamu yote.” Kirai cha Kiebrania בְּנֶפֶשׁ kinajumuisha kihalisi wazo la “nafsi/uhai”; kinaweza kumaanisha kwamba adui wanamlenga mtunga zaburi katika uhai wake, au kusisitiza nia yao kali.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי
  choice: kutoka kwa
  rationale: Katika muktadha huu kirai kinaonyesha watu wenye uhasama ambao mtunga zaburi anaomba alindwe dhidi yao; ‘kutoka kwa’ ni Kiswahili cha kawaida na sahihi.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Nomino hii ya wingi inawataja watu wenye hatia ya kimaadili bila kuongeza jinsia isiyotajwa katika Kiebrania.
- source_word: זוּ
  choice: wanao-
  rationale: Kiambishi rejeshi cha Kiswahili kinaunganisha ‘waovu’ na tendo linalofuata kwa njia ya kawaida.
- source_word: שַׁדּוּנִי
  choice: wanaoniangamiza
  rationale: Kitenzi שׁדד huonyesha uharibifu mkali au kuteketeza; ‘wanaoniangamiza’ kinaonyesha ukali huo bila kutumia lugha ya kizamani.
- source_word: אֹיְבַי
  choice: adui zangu
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya wingi yenye kiambishi cha nafsi ya kwanza.
- source_word: בְּנֶפֶשׁ
  choice: wanaoutafuta uhai wangu
  rationale: Kirai hiki kinaweza kuonyesha kuwa adui wanataka kuutoa uhai wa mtunga zaburi. Tafsiri hii inaweka wazi maana ya נֶפֶשׁ kama ‘uhai’ badala ya kuificha ndani ya kivumishi pekee.
- source_word: יַקִּיפוּ עָלָי
  choice: wanaonizunguka
  rationale: Hili linaonyesha adui kumzingira au kumweka katikati, kwa Kiswahili cha kawaida na chenye taswira wazi.
theological_decisions:
- issue: Uhusiano wa בְּנֶפֶשׁ na ‘adui zangu’
  choice: adui wanaoutafuta uhai wa mtunga zaburi
  alternative: adui wenye kiu kali au uhasama wa moyo wote
  rationale: Kiebrania ni kifupi na kina utata wa kisintaksia. Muktadha wa hatari na maana ya נֶפֶשׁ kama ‘uhai’ vinaunga mkono tishio dhidi ya maisha, lakini tanbihi inadumisha uwezekano wa maana ya hamu kali.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umebaki wa kishairi lakini unaeleweka kwa msomaji wa kawaida; utata halisi wa בְּנֶפֶשׁ umehifadhiwa kwa tanbihi.
