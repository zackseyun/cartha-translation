  text: They close up their fat hearts[a]; with their mouths they speak arrogantly.
translation:
  language: sw
  text: Wamefunga mioyo yao minono[a]; kwa vinywa vyao husema kwa kiburi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “Wamefunga mafuta yao.” Huenda “mafuta” yanatumiwa kisitiari kumaanisha moyo usiojali, uliofanywa sugu, au unaojitosheleza.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבָּמוֹ
  choice: mioyo yao iliyonona
  rationale: Kiebrania kinasema kihalisi ‘mafuta yao.’ Katika ushairi wa Kiebrania, unene au mafuta yanaweza kuashiria moyo usiojali, uliofanywa sugu, au unaojitosheleza. Kuongeza ‘mioyo’ kunafanya sitiari ieleweke bila kuondoa taswira ya kunona.
- source_word: סָּגְרוּ
  choice: wamezifunga
  rationale: Kitenzi humaanisha kufunga. Kauli hii inadumisha taswira ya mioyo iliyofungwa na isiyoguswa.
- source_word: פִּימוֹ
  choice: kwa vinywa vyao
  rationale: Ingawa neno la Kiebrania ni umoja likiwa na kiambishi cha wingi, maana yake ya kijumla inatolewa kwa wingi katika Kiswahili ili ilingane kwa kawaida na kundi linalozungumziwa.
- source_word: דִּבְּרוּ
  choice: wanasema
  rationale: Kauli timilifu ya Kiebrania katika ushairi inaweza kueleza tabia ya sasa au ya kawaida. Wakati wa sasa unaonyesha tabia inayoendelea ya watu hawa.
- source_word: בְגֵאוּת
  choice: kwa kiburi
  rationale: Nomino hiyo humaanisha kiburi, majivuno, au hali ya kujikweza. ‘Kwa kiburi’ ni Kiswahili cha kawaida kinachohifadhi maana hasi ya kimaadili.
