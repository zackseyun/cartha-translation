language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: מִֽ/מְתִ֥ים יָדְ/ךָ֨ יְהוָ֡ה מִֽ/מְתִ֬ים מֵ/חֶ֗לֶד חֶלְקָ֥/ם בַּֽ/חַיִּים֮ ו/צפינ/ך תְּמַלֵּ֪א בִ֫טְנָ֥/ם יִשְׂבְּע֥וּ בָנִ֑ים וְ/הִנִּ֥יחוּ יִ֝תְרָ֗/ם לְ/עוֹלְלֵי/הֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/014.yaml
  text: from men by your hand[a], O Yahweh, from men of the world, whose portion is in this life. You fill their belly with your stored-up treasure; they are satisfied with sons[c][b], and they leave their abundance to their children.
translation:
  language: sw
  text: 'kutoka kwa watu kwa mkono wako[a], Ee Yahweh,


    kutoka kwa watu wa ulimwengu huu,


    ambao fungu lao liko katika maisha haya.


    Unalijaza tumbo lao kwa hazina yako uliyoweka akiba;


    wanatosheka kwa kupata wana[b],


    na huwaachia watoto wao[c] ziada yao.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kwa watu, kwa mkono wako,” au “kutoka kwa watu wa mkono wako.” Muundo wa Kiebrania umebanwa na unaweza kueleweka kwa zaidi ya namna moja.
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania: “wana.” Neno hili ni wingi wa kiume na yaelekea linasisitiza wana wa kiume wengi kuwa ishara ya ustawi.'
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinataja hasa watoto wadogo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמְתִים
  choice: kutoka kwa watu
  rationale: Katika muktadha huu neno hilo linawarejelea wapinzani wa kibinadamu na linalingana na usemi ‘watu wa ulimwengu huu’; halimaanishi wafu.
- source_word: יָדְךָ
  choice: kwa mkono wako
  rationale: Usemi huu unaweza kuonyesha njia au utendaji wa Yahweh, lakini muundo wa Kiebrania umebanwa na unaweza kuhusishwa na maneno yanayozunguka kwa zaidi ya namna moja; tanbihi inahifadhi utata huo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililotajwa katika maandishi ya Kiebrania limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: מֵחֶלֶד
  choice: wa ulimwengu huu
  rationale: Hapa חֶלֶד inaelekeza kwenye maisha ya muda ya wanadamu katika ulimwengu wa sasa, si ulimwengu mzima kwa maana ya kijiografia au ya anga.
- source_word: חֶלְקָם בַּחַיִּים
  choice: ambao fungu lao liko katika maisha haya
  rationale: Tafsiri hii inaonyesha kwamba sehemu yao iko katika maisha ya sasa bila kuongeza dai kamili kuhusu hukumu au maisha yajayo.
- source_word: וּצְפוּנְךָ
  choice: hazina yako uliyoweka akiba
  rationale: Neno linatokana na wazo la kitu kilichofichwa au kuhifadhiwa; ‘hazina ... uliyoweka akiba’ linaonyesha wingi uliotunzwa bila kuufanya kuwa fedha pekee.
- source_word: תְּמַלֵּא בִטְנָם
  choice: Unalijaza tumbo lao
  rationale: ‘Tumbo’ linahifadhi picha halisi ya Kiebrania, huku umoja wa kijumla ‘tumbo lao’ ukiwa wa kawaida na kueleweka katika Kiswahili.
- source_word: יִשְׂבְּעוּ בָנִים
  choice: wanatosheka kwa kupata wana
  rationale: Usomaji huu unawachukua watu hao kuwa kiima na ‘wana’ kuwa kile kinachowatosheleza. Kwa kuwa Kiebrania kinaweza pia kusomeka ‘wana wao hushiba,’ uwezekano huo umewekwa katika tanbihi.
- source_word: וְהִנִּיחוּ יִתְרָם
  choice: huwaachia ... mali yao iliyosalia
  rationale: יֶתֶר ni ziada au kilichobaki; katika muktadha wa urithi, ‘mali yao iliyosalia’ ni ya kawaida na haidai kwamba neno lenyewe humaanisha utajiri tu.
- source_word: לְעוֹלְלֵיהֶם
  choice: watoto wao
  rationale: ‘Watoto wao’ ni usemi wa kawaida katika muktadha wa kuwaachia urithi; tanbihi inahifadhi maana mahsusi zaidi ya watoto wadogo.
theological_decisions:
- issue: Uhusiano wa wapinzani na mkono wa Mungu
  choice: ‘kwa mkono wako’ limehifadhiwa bila kufafanua kama watu hao ni vyombo vya hukumu ya Mungu au wako tu chini ya utawala wake.
  alternative: ‘kutoka kwa watu wa mkono wako’ au ‘kwa mkono wako, uniokoe kutoka kwa watu’
  rationale: Muundo wa Kiebrania umebanwa na unaruhusu mahusiano kadhaa ya kisintaksia. Tafsiri haipaswi kuingiza hitimisho la kiteolojia ambalo mstari wenyewe haulibainishi.
- issue: Ufanisi wa watu waovu katika maisha ya sasa
  choice: Fungu lao linaelezwa kuwa katika maisha haya.
  alternative: ‘fungu lao ni miongoni mwa walio hai’
  rationale: Hii inadumisha tofauti ya muda iliyomo katika zaburi bila kufanya mstari useme wazi zaidi kuhusu maisha yajayo kuliko Kiebrania kinavyosema.
- issue: Ni nani anayeshiba katika יִשְׂבְּעוּ בָנִים
  choice: Watu hao wanatosheka kwa kupata wana.
  alternative: Wana wao hushiba.
  rationale: Kiebrania kinaweza kuchukuliwa kwa namna zote mbili. Usomaji wa matini kuu unaendana na mfululizo unaoeleza ustawi wao, huku tanbihi ikihifadhi uwezekano mwingine wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Mistari imepangwa ili kudumisha ulinganifu wa zaburi. Mwanzo wa sentensi umeachwa kama mwendelezo wa ombi la mstari uliotangulia badala ya kuongeza kitenzi kisichotajwa wazi katika mstari huu.
