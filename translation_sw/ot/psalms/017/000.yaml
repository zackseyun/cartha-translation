base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/000.yaml
  text: A prayer of David. Hear righteousness[a], Yahweh; pay attention to my cry; give ear to my prayer from lips without deceit.
translation:
  language: sw
  text: Sala ya Daudi. Ee Yahweh, sikiliza shauri la haki[a]; tega sikio kwa kilio changu; isikilize sala yangu itokayo katika midomo isiyo na udanganyifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sikiliza haki.” Neno la Kiebrania צֶדֶק linaweza kumaanisha haki, uadilifu, au shauri la haki; hapa huenda linarejelea shauri la mwombaji kuwa la haki.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: Sala ya Daudi
  rationale: Kichwa hiki kinaweza kumaanisha sala iliyoandikwa na Daudi au inayomhusu; Kiswahili ‘ya Daudi’ huhifadhi ufupi na kiwango fulani cha uhusiano huo usiobainishwa.
- source_word: צֶדֶק
  choice: madai yangu ya haki
  rationale: Nomino inaweza kumaanisha haki, uadilifu, au jambo linalostahili kuhukumiwa kuwa la haki. Katika ombi la kusikilizwa, ‘madai yangu ya haki’ ni ya asili kwa Kiswahili huku tanbihi ikihifadhi maana halisi pana.
- source_word: רִנָּתִי
  choice: kilio changu
  rationale: Katika muktadha huu neno linaashiria kilio cha kuomba msaada, si lazima wimbo wa furaha.
- source_word: בְּלֹא שִׂפְתֵי מִרְמָה
  choice: itokayo katika midomo isiyo na udanganyifu
  rationale: Kirai cha Kiebrania ni kifupi na kisicho na kitenzi; tafsiri hii inaunganisha kwa kawaida sala na chanzo chake huku ikihifadhi picha ya midomo isiyo na hila.
theological_decisions:
- issue: Je, צֶדֶק humtaja mwombaji kuwa mwadilifu kabisa au humaanisha kesi yake ya haki?
  choice: madai yangu ya haki
  alternative: haki
  rationale: Muktadha wa mwombaji anayemtaka Mungu asikilize unaelekea kwenye dai au shauri la haki, lakini tanbihi inalinda uwezekano mpana wa ‘haki/uadilifu’ bila kudai ukamilifu wa kimaadili.
- issue: Uwakilishi wa jina la agano יהוה
  choice: YAHWEH
  alternative: BWANA
  rationale: Kutumia jina Yahweh hudumisha jina maalumu lililo katika chanzo badala ya kulibadili kuwa cheo; herufi kubwa zinasaidia kulitofautisha wazi kama jina la Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa msomaji wa kawaida. ‘Tega sikio’ inahifadhi tamathali ya Kiebrania bila kuwa ngumu, na sentensi sambamba zinaakisi mtindo wa kishairi wa zaburi.
