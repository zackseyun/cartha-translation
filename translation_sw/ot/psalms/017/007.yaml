base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/007.yaml
  text: Show your wondrous steadfast love[a], O Savior of those who take refuge from those who rise up against them[b], by your right hand.
translation:
  language: sw
  text: Dhihirisha kwa ajabu upendo wako wa kudumu[a], ee mwokozi wa wale wanaokimbilia kwako kutoka kwa wanaowainuka dhidi yao[b], kwa mkono wako wa kuume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ufanye upendo wako wa kudumu uwe wa ajabu.” Amri ya Kiebrania inaweza kumaanisha kuonyesha kitu kuwa cha ajabu au kukifanya kiwe cha pekee na cha ajabu.
    reason: lexical_alternative
  - marker: b
    text: 'Kirai cha mwisho kinaweza pia kuhusishwa na “wale wanaokimbilia kwako”: “wale wanaokimbilia upande wako wa kuume.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְלֵה
  choice: Dhihirisha kwa ajabu
  rationale: Kitenzi hiki cha amri katika Hifili kinaweza kumaanisha kufanya kitu kiwe cha ajabu au kukionyesha kuwa cha ajabu. Kauli hii ya Kiswahili ni ya kawaida katika sala na inadumisha wazo la Mungu kuonyesha upendo wake kwa namna isiyo ya kawaida.
- source_word: חֲסָדֶיךָ
  choice: upendo wako wa kudumu
  rationale: חסד huunganisha upendo, rehema, uaminifu na ushikamanifu. ‘Upendo wa kudumu’ ni Kiswahili cha sasa kinachoeleweka na kinadumisha uzito wa uaminifu wa Mungu bila kuufanya usemi kuwa wa kimadhehebu.
- source_word: מוֹשִׁיעַ
  choice: ee Mwokozi wa
  rationale: Kivumishi-tendo hiki kinatumika kama mwito unaomwelekea Mungu akiwa yule anayeokoa. ‘Ee Mwokozi wa’ kinaonyesha wazi hali hiyo ya mwito wa sala.
- source_word: חוֹסִים
  choice: wale wanaokimbilia kwako
  rationale: Kitenzi חסה kina picha halisi ya kutafuta au kupata hifadhi. ‘Kukimbilia kwako’ ni kauli ya asili ya Kiswahili na inadumisha picha ya kumwendea Mungu ili kupata usalama.
- source_word: מִמִּתְקוֹמְמִים
  choice: kutoka kwa wanaowainukia
  rationale: Umbo hili linaonyesha watu wanaoinuka kwa uhasama. Kiambishi ‘-wa-’ kinawaelekeza wasomaji kwa wale wanaotafuta kimbilio, ambao ndio walengwa wa uhasama katika usomaji mkuu.
- source_word: בִּימִינֶךָ
  choice: kwa mkono wako wa kuume
  rationale: Katika usomaji mkuu, kirai hiki kinaonyesha njia au chombo ambacho Mungu hutumia kuokoa. ‘Kwa mkono wako wa kuume’ ni usemi wa asili unaodumisha picha ya nguvu ya Mungu.
theological_decisions:
- issue: Uhusiano wa kisarufi wa kirai cha mwisho בִּימִינֶךָ
  choice: 'Kimeunganishwa na tendo la Mungu la kuokoa: anaokoa ‘kwa mkono wako wa kuume.’'
  alternative: 'Kinaweza kuunganishwa na wanaotafuta kimbilio: ‘wale wanaokimbilia kwenye mkono wako wa kuume.’'
  rationale: Mpangilio wa Kiebrania unaruhusu kirai cha mwisho kuhusishwa kwa zaidi ya njia moja. Matini kuu inachagua maana inayoeleweka zaidi katika muktadha, huku tanbihi ikihifadhi utata halisi badala ya kuufuta.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo wa sala ni wa heshima lakini unaeleweka kwa msomaji wa kawaida. ‘Ee’ huhifadhi mwito wa moja kwa moja, na ‘mkono wa kuume’ huhifadhi taswira ya Kiebrania.
