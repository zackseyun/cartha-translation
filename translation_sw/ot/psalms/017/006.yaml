base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/006.yaml
  text: I call on you[a], for you answer me, O God; incline your ear to me[b]; hear my words.
translation:
  language: sw
  text: Ninakuita[a], kwa maana unanijibu, Ee Mungu; nitegee sikio lako[b]; sikia nisemalo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nimekuita, kwa sababu utanijibu, Ee Mungu.” Maumbo ya vitenzi vya Kiebrania hapa yanaweza kueleweka kuwa ya wakati uliopita, wa sasa, au wa wakati ujao unaotarajiwa kwa uhakika katika sala ya kishairi.
    reason: alternative_reading
  - marker: b
    text: Kwa Kiebrania, “kutega sikio” ni nahau ya kumsikiliza mtu kwa makini.
    reason: cultural_note
lexical_decisions:
- source_word: קְרָאתִיךָ
  choice: Ninakuita
  rationale: Kitenzi timilifu cha Kiebrania katika sala ya kishairi kinaweza kueleza mwito wa sasa, tendo lililokwisha, au uhakika wa mwombaji. Wakati wa sasa unasikika kwa kawaida katika Kiswahili na kudumisha maombi ya moja kwa moja.
- source_word: כִּי
  choice: kwa maana
  rationale: Inaonyesha sababu ya mwito na kudumisha mtiririko mfupi wa kishairi.
- source_word: תַעֲנֵנִי
  choice: unanijibu
  rationale: Kitenzi hiki kinaweza kuwa na maana ya sasa au ya wakati ujao wenye uhakika. Wakati wa sasa unaonyesha imani ya mwombaji kwamba Mungu humjibu bila kufunga kabisa uwezekano wa maana ya wakati ujao.
- source_word: אֵל
  choice: Ee Mungu
  rationale: Hili ni neno la kumwita Mungu moja kwa moja; “Ee Mungu” ni Kiswahili cha kawaida na chenye heshima katika sala.
- source_word: הַט אָזְנְךָ לִי
  choice: nielekezee sikio lako
  rationale: Taswira halisi ya Kiebrania imedumishwa; ni ombi la Mungu kusikiliza kwa makini.
- source_word: שְׁמַע
  choice: sikia
  rationale: Amri ya moja kwa moja imedumishwa na inaendeleza usambamba na kuelekeza sikio.
- source_word: אִמְרָתִי
  choice: nisemalo
  rationale: Nomino ya Kiebrania iko katika umoja na humaanisha tamko au usemi wa mwombaji. “Nisemalo” ni ya asili zaidi katika Kiswahili kuliko “usemi wangu” huku ikidumisha maana ya kitu kinachosemwa.
theological_decisions:
- issue: Nyakati za vitenzi katika kauli ya mwombaji na jibu la Mungu
  choice: Ninakuita, kwa maana unanijibu
  alternative: Nimekuita, kwa sababu utanijibu
  rationale: Ushairi wa Kiebrania huruhusu maana ya tendo lililokwisha, la sasa, au la wakati ujao linalosemwa kwa uhakika. Tafsiri kuu inatumia wakati wa sasa kwa Kiswahili cha asili, na tanbihi inahifadhi usomaji mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na mtiririko wa kishairi. Taswira ya sikio imehifadhiwa, huku “nisemalo” likitumiwa kuwasilisha kwa kawaida umoja wa אִמְרָתִי.
