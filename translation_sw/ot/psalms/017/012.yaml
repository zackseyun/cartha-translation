  text: He is like a lion eager to tear[c][b][a], like a young lion sitting in hiding places.
translation:
  language: sw
  text: Yeye ni kama simba[a] mwenye hamu ya kurarua, kama mwana-simba aliyeketi mafichoni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kihalisi: “Mfano wake ni kama simba.”'
    reason: lexical_alternative
  - marker: b
    text: Au “anayevizia mafichoni.” Kiebrania kinasema kihalisi “aliyeketi,” lakini katika muktadha huu kinakusudia kusubiri ili kuvamia.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּמְיֹנוֹ
  choice: Yeye ni kama
  rationale: Ingawa Kiebrania kinaanza kwa nomino inayomaanisha ‘mfano wake,’ muundo wa moja kwa moja ‘Yeye ni kama’ unatoa ulinganisho huo kwa Kiswahili cha kawaida bila kubadili maana.
- source_word: כְּאַרְיֵה
  choice: kama simba
  rationale: Huu ni ulinganisho wa moja kwa moja na wa kawaida unaohifadhi taswira ya simba.
- source_word: יִכְסוֹף
  choice: mwenye hamu
  rationale: Kitenzi hiki huonyesha tamanio au shauku kubwa; katika taswira ya mnyama anayewinda, ‘mwenye hamu’ ni ya asili na inaonyesha msukumo huo mkali.
- source_word: לִטְרוֹף
  choice: kurarua
  rationale: Kitenzi kinahusu tendo la mnyama kulirarua windo. ‘Kurarua’ kinadumisha ukali na uhai wa taswira bila kuongeza kitu kilichotajwa wazi katika matini.
- source_word: וְכִכְפִיר
  choice: kama mwana-simba
  rationale: כפיר humaanisha simba mchanga; ‘mwana-simba’ ni neno linaloeleweka na linalohifadhi ulinganisho wa pili.
- source_word: יֹשֵׁב
  choice: aliyeketi
  rationale: Hii ndiyo maana ya msingi ya kauli hii ya Kiebrania. Muktadha unaashiria kuvizia, lakini tafsiri kuu inadumisha picha halisi ya kuketi.
- source_word: בְּמִסְתָּרִים
  choice: mafichoni
  rationale: Neno hili huonyesha mahali palipofichika. ‘Mafichoni’ ni Kiswahili cha asili kinachofaa kwa simba anayengoja kwa siri.
