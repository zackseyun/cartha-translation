  text: Mimi, katika haki nitautazama uso wako; nitakapoamka[a], nitatosheka kwa sura yako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nitakapoamka” inaweza kueleweka kuwa kuamka usingizini kwa kawaida, au kuamka katika uthibitisho wa mwisho au ufufuo.
    reason: alternative_reading
  - marker: b
    text: Au “mfano wako” au “umbo lako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Mimi
  rationale: Kiwakilishi kilichotajwa wazi katika Kiebrania kinakazia tofauti kati ya mtunga zaburi na watu waliotangulia kutajwa. Mwanzo mfupi “Mimi” unahifadhi mkazo huo kwa Kiswahili cha kawaida.
- source_word: בְּצֶדֶק
  choice: katika haki
  rationale: צֶדֶק inaweza kumaanisha haki au uadilifu. “Katika haki” inadumisha usemi mfupi wa Kiebrania bila kuamua kimya kimya ikiwa ni uadilifu wa mtunga zaburi, tendo la Mungu la kumtetea, au hadhi ya kuhukumiwa kuwa mwenye haki.
- source_word: אֶחֱזֶה
  choice: nitautazama
  rationale: Kitenzi חזה huonyesha kuona kwa makini au kutazama, si kuona kijuujuu tu. “Nitautazama” ni cha asili na kinahifadhi uzito wa kishairi.
- source_word: פָנֶיךָ
  choice: uso wako
  rationale: Hili ndilo neno halisi la Kiebrania. Ingawa linaweza kudokeza kuwapo kwa Mungu, taswira thabiti ya “uso” imehifadhiwa.
- source_word: אֶשְׂבְּעָה
  choice: nitatosheka
  rationale: שׂבע katika qal humaanisha kushiba au kutosheka. “Nitatosheka” linafaa katika muktadha huu na halifanyi taswira hiyo kuwa ya chakula pekee.
- source_word: בְּהָקִיץ
  choice: nitakapoamka
  rationale: 'ב pamoja na kitenzi-jina huonyesha wakati: “nitakapoamka.” Tafsiri hii haibainishi kama ni kuamka usingizini kwa kawaida au kuamshwa katika ukombozi wa mwisho.'
- source_word: תְּמוּנָתֶךָ
  choice: sura yako
  rationale: תְּמוּנָה inaweza kumaanisha sura, mfano, au umbo. “Sura yako” ni ya kawaida katika Kiswahili na inadumisha taswira bila kudai kwa lazima kwamba Mungu ana umbo la kimwili lililofafanuliwa.
theological_decisions:
- issue: Ikiwa בְּהָקִיץ inamaanisha kuamka usingizini kwa kawaida au kuamshwa katika ufufuo/uthibitisho wa mwisho
  choice: Matini kuu inasema tu “nitakapoamka,” bila kufafanua aina ya kuamka.
  alternative: Kuamka kila siku kutoka usingizini; au kuamshwa katika ufufuo na kuthibitishwa mwishoni.
  rationale: Kiebrania chenyewe hakisemi wazi ni aina gani ya kuamka inayokusudiwa. Kuacha usemi huo wazi kunahifadhi mvutano wa kitheolojia wa matini badala ya kuutatua kwa tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa sentensi unabaki karibu na usambamba wa Kiebrania, huku alama za tanbihi zikiwekwa kwenye maneno yanayohusika moja kwa moja.
