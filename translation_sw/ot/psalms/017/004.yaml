translation:
  language: sw
  text: Kuhusu matendo ya wanadamu, kwa neno la midomo yako nimejiepusha na njia za mtu wa jeuri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “nimejilinda na njia za mtu wa jeuri.” Kiebrania pia kinaweza kueleweka kuwa, “nimeziangalia njia za mtu wa jeuri,” lakini muktadha unaunga mkono maana ya kuziepuka.
    reason: alternative_reading
lexical_decisions:
- source_word: לִפְעֻלּוֹת אָדָם
  choice: Kuhusu matendo ya wanadamu
  rationale: לְ inatanguliza mada, na אָדָם hapa ni jina la jumla linalorejelea wanadamu. Kauli hii ni ya kawaida katika Kiswahili na haidokezi mtu mmoja maalumu.
- source_word: בִּדְבַר שְׂפָתֶיךָ
  choice: kwa neno la midomo yako
  rationale: בְּ inaonyesha chombo au msingi wa kujizuia kwa mtunga zaburi. Tafsiri hii pia inadumisha taswira ya kishairi ya usemi wa Mungu unaotoka midomoni mwake.
- source_word: שָׁמַרְתִּי
  choice: nimejiepusha na
  rationale: Ingawa kitenzi kinaweza kumaanisha kutunza, kulinda, au kuangalia, muktadha na kitu chake vinaelekeza kwenye kujizuia au kukaa mbali na mwenendo huo.
- source_word: אָרְחוֹת
  choice: njia za
  rationale: “Njia” inadumisha sitiari ya mkondo wa maisha au mwenendo na ni ya kawaida katika Kiswahili cha Biblia.
- source_word: פָּרִיץ
  choice: watu wenye jeuri
  rationale: Neno hili humaanisha mtu mkatili au mwenye kutumia nguvu kwa jeuri. Wingi unaodokezwa na “njia” umeelezwa kwa kawaida kwa kusema “watu wenye jeuri.”
theological_decisions:
- issue: Maana ya kishazi chenye שָׁמַרְתִּי
  choice: Mtunga zaburi anasema kwamba kwa neno la Mungu amejiepusha na njia za watu wenye jeuri.
  alternative: Mtunga zaburi anasema kwamba amezitazama au kuzichunguza njia za watu wenye jeuri.
  rationale: שׁמר inaweza kumaanisha kutunza, kulinda, au kuangalia, lakini dai la uadilifu katika muktadha huu linaunga mkono zaidi maana ya kujiepusha. Usomaji mwingine wa Kiebrania umehifadhiwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Neno la midomo yako” limehifadhiwa kama taswira ya Kiebrania; “nimejiepusha” huwasilisha maana inayowezekana zaidi kwa uwazi bila kuifanya sentensi kuwa nzito.
