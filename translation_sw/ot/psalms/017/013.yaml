base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/013.yaml
  text: Rise up[a], O Yahweh; confront him, bring him low[b]; deliver my life from the wicked by your sword.
translation:
  language: sw
  text: Inuka, Ee Yahwe; mkabili, umwangushe; uokoe uhai wangu[a] kutoka kwa mwovu kwa upanga wako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania nefesh; mara nyingi hutafsiriwa “nafsi,” lakini hapa yaelekea kumaanisha “uhai” au mtu mwenyewe katika hatari ya kufa.
    reason: lexical_alternative
  - marker: b
    text: Au, “uokoe uhai wangu kutoka kwa mwovu ambaye ni upanga wako.” Kiebrania pia kinaweza kumwonyesha mwovu kuwa chombo kilicho mkononi mwa Yahwe.
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: Inuka
  rationale: Ni amri ya dharura kutoka katika kitenzi קום, ikimwomba Mungu achukue hatua.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa badala ya kubadilishwa na cheo, kwa kuzingatia maandishi ya Kiebrania.
- source_word: קַדְּמָה פָנָיו
  choice: mkabili
  rationale: Nahau hii, ambayo kihalisi ni kwenda mbele ya uso wake, katika muktadha huu ina maana ya kukutana na adui na kumkabili.
- source_word: הַכְרִיעֵהוּ
  choice: umwangushe
  rationale: Hiphil ya כרע inaeleza kumsababisha adui ainame, ashuke, au aanguke; ‘umwangushe’ ni ya kawaida na inadumisha nguvu ya ombi.
- source_word: פַּלְּטָה
  choice: uokoe
  rationale: Kitenzi פלט kinaonyesha kuokoa au kuponya kutoka hatarini; ‘uokoe’ ni wazi na cha kawaida katika Kiswahili.
- source_word: נַפְשִׁי
  choice: uhai wangu
  rationale: נפש hapa inaelekea kumaanisha uhai au nafsi ya mtu anayekabiliwa na hatari ya kufa, si lazima sehemu isiyo ya kimwili.
- source_word: מֵרָשָׁע
  choice: kutoka kwa mwovu
  rationale: Nomino-kivumishi ya umoja imedumishwa bila kuongeza ‘mtu’; inaweza kumrejelea adui mahususi katika muktadha.
- source_word: חַרְבֶּךָ
  choice: kwa upanga wako
  rationale: Usomaji mkuu unaichukulia ‘upanga wako’ kuwa chombo ambacho Yahwe anatumia kumwokoa mwombaji.
theological_decisions:
- issue: Uhusiano wa ‘upanga wako’ na ‘mwovu’
  choice: Mungu anamwokoa mwombaji kwa kutumia upanga wake.
  alternative: Mwovu ndiye ‘upanga wako,’ yaani chombo kilicho mkononi mwa Mungu.
  rationale: Mpangilio mfupi wa Kiebrania מֵרָשָׁע חַרְבֶּךָ unaruhusu usomaji wa chombo au wa kirai katika uhusiano wa ufafanuzi. Matini kuu inatumia usomaji wa chombo, huku tanbihi ikihifadhi uwezekano mwingine wa maana na mvutano wake wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sala ulio wa heshima lakini unaoeleweka kwa urahisi. Vitenzi vya amri vinahifadhi uharaka wa Kiebrania; sentensi fupi zinazotenganishwa kwa nukta mkato zinadumisha mwendo wa kishairi.
