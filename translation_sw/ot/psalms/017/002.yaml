base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/002.yaml
  text: May my judgment come forth from before you[b][a]; may your eyes behold what is upright.
translation:
  language: sw
  text: Hukumu yangu na itoke kutoka mbele zako[a]; macho yako na yatazame yaliyo sawa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uamuzi wa kunitetea na utoke katika uwepo wako.”
    reason: alternative_reading
  - marker: b
    text: Au, “mambo yaliyo manyofu,” au “usawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּפָנֶיךָ
  choice: mbele zako
  rationale: Huhifadhi taswira ya hukumu inayotoka mbele za uso au uwepo wa Mungu, kwa Kiswahili cha kawaida bila kufanya usemi kuwa mzito.
- source_word: מִשְׁפָּטִי
  choice: hukumu yangu
  rationale: Neno linaweza kumaanisha hukumu, uamuzi wa kisheria, haki, au kutetewa kwa mwombaji. “Hukumu yangu” inabaki karibu na upana wa Kiebrania.
- source_word: יֵצֵא
  choice: na itoke
  rationale: Kitenzi humaanisha kutoka au kwenda nje. Muundo wa “na itoke” unaonyesha ombi katika muktadha huu wa sala.
- source_word: עֵינֶיךָ
  choice: macho yako
  rationale: Huhifadhi taswira halisi ya kishairi ya macho ya Mungu yanayochunguza, badala ya kuifupisha kuwa “wewe.”
- source_word: תֶּחֱזֶינָה
  choice: na yatazame
  rationale: “Kutazama” hubeba maana ya kuona kwa makini na inafaa kwa mtindo wa kishairi wenye heshima.
- source_word: מֵישָׁרִים
  choice: yaliyo sawa
  rationale: Huwasilisha wazo la mambo yaliyo manyofu, ya haki, au yenye usawa bila kulifunga neno katika maana moja tu ya kisheria.
theological_decisions:
- issue: Iwapo vitenzi vitafsiriwe kama taarifa ya wakati ujao au ombi
  choice: 'Ombi: “na itoke… na yatazame…”'
  alternative: 'Taarifa: “itatoka… yatatazama…”'
  rationale: Ingawa maumbo ya Kiebrania yanaweza kueleweka kama wakati ujao, muktadha wa sala unaunga mkono matumizi ya kiombi. Muundo huu haugeuzi ombi kuwa uhakikisho wa kisarufi usio wazi katika chanzo.
- issue: Maana ya מִשְׁפָּטִי katika ombi hili
  choice: hukumu yangu
  alternative: uamuzi wa kunitetea / hukumu kuhusu kesi yangu
  rationale: Tafsiri kuu inadumisha utata wa neno kati ya hukumu, kesi, na uamuzi wa kumpatia mwombaji haki; tafsiri yenye “kunitetea” ingeamua mapema kuwa hukumu hiyo lazima iwe ya upande wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa “na + kitenzi” umetumiwa kuonyesha ombi; taswira za mahakama na za macho zimehifadhiwa.
