  text: You have examined my heart; you have visited me by night; you have tested me and find nothing[a]. I have purposed that my mouth will not transgress.
translation:
  language: sw
  text: Umeuchunguza moyo wangu; umenijia usiku; umenijaribu, na hukupata chochote.[a] Nimeazimia kwamba kinywa changu hakitavuka mpaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata kwa karibu zaidi maneno ya Kiebrania: “Nimeazimia; kinywa changu hakitavuka mpaka,” yaani, mtunga zaburi anaazimia kutovuka mpaka katika usemi wake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּחַנְתָּ
  choice: umeuchunguza
  rationale: Kitenzi kina maana ya kuchunguza au kupima tabia; “umeuchunguza” kinaendana kwa kawaida na “moyo wangu” huku kikihifadhi wazo la tathmini.
- source_word: לִבִּי
  choice: moyo wangu
  rationale: “Moyo” ni tafsiri ya kawaida na hapa unawakilisha utu wa ndani, pamoja na mawazo na makusudi.
- source_word: פָּקַדְתָּ
  choice: umenijia
  rationale: Kitenzi kinaweza kumaanisha kuja, kutembelea, kuangalia, au kukagua. “Umenijia” kinahifadhi nahau ya kumjia mtu usiku bila kufanya ukaguzi kuwa wazi kupita chanzo.
- source_word: לַּיְלָה
  choice: usiku
  rationale: Nomino hii imetumiwa kwa maana ya wakati; “usiku” ni fupi na ya kawaida katika Kiswahili.
- source_word: צְרַפְתַּנִי
  choice: umenijaribu
  rationale: Kihalisi kitenzi huhusu kusafisha metali kwa moto, na kwa sitiari humaanisha kumpima mtu. “Umenijaribu” kinawasilisha maana ya muktadha kwa uwazi.
- source_word: בַל תִּמְצָא
  choice: wala hukupata chochote
  rationale: Kitu kilichotafutwa hakikutajwa katika Kiebrania. “Chochote” kinahifadhi ufupi huo bila kuongeza “uovu” au “kosa” katika sehemu hii.
- source_word: זַמֹּתִי
  choice: nimeazimia
  rationale: Umbo hili limechukuliwa kama kitenzi chenye maana ya kupanga au kuazimia, na linaanzisha azimio kuhusu usemi.
- source_word: בַל יַעֲבָר פִּי
  choice: kwamba kinywa changu hakitakosa
  rationale: Kihalisi ni kinywa kutovuka au kutopita mpaka. “Hakitakosa” kinaeleza kwa lugha ya kawaida wazo la kutovuka mipaka katika usemi.
theological_decisions:
- issue: Ufafanuzi wa kishazi cha mwisho
  choice: 'Kishazi kinaeleza azimio la mtunga zaburi kuhusu usemi wake: “Nimeazimia kwamba kinywa changu hakitakosa.”'
  alternative: 'Huenda kikatafsiriwa kwa ukaribu zaidi na muundo wa Kiebrania: “Nimeazimia; kinywa changu hakitavuka mpaka,” au kama dai la hali: “kinywa changu hakikosi.”'
  rationale: Kiebrania ni kifupi na kina ugumu wa kisarufi. Kusoma זַמֹּתִי kama kitenzi na maneno yanayofuata kama yaliyomo katika azimio kunatoa maana yenye mshikamano bila kuondoa uwezekano mwingine, ambao umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo sambamba wa vitenzi umedumishwa, na utata halisi wa kishazi cha mwisho umeonyeshwa kwa tanbihi.
