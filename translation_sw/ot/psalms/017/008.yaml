  text: שָׁ֭מְרֵ/נִי כְּ/אִישׁ֣וֹן בַּת עָ֑יִן בְּ/צֵ֥ל כְּ֝נָפֶ֗י/ךָ תַּסְתִּירֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/008.yaml
  text: Keep me like the pupil of the eye[a]; hide me in the shadow of your wings.
translation:
  language: sw
  text: Unilinde kama mboni ya jicho; unifiche katika kivuli cha mabawa yako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: Unilinde
  rationale: Kitenzi שׁמר hapa ni ombi la kulindwa au kutunzwa. “Unilinde” ni cha kawaida, cha moja kwa moja, na kinaonyesha wazi wazo la ulinzi.
- source_word: כְּאִישׁוֹן בַּת עָיִן
  choice: kama mboni ya jicho
  rationale: Nahau hii ya Kiebrania inarejelea mboni, sehemu nyeti ya jicho inayolindwa kwa uangalifu. “Mboni ya jicho” huwasilisha maana hiyo wazi katika Kiswahili cha sasa bila kufuata etimolojia ya maneno kihalisi.
- source_word: בְּצֵל
  choice: katika kivuli
  rationale: צֵל humaanisha kivuli au uvuli. “Katika kivuli” linadumisha taswira ya kinga inayotolewa na mabawa.
- source_word: כְּנָפֶיךָ
  choice: mabawa yako
  rationale: Tafsiri hii inadumisha sitiari halisi ya maandishi ya Kiebrania kuhusu ulinzi wa Mungu, bila kuibadili kuwa maelezo ya moja kwa moja.
- source_word: תַּסְתִּירֵנִי
  choice: unifiche
  rationale: Kitenzi hiki kutoka סתר katika Hifili humaanisha kuficha au kusitiri. “Unifiche” ni ombi la moja kwa moja na linahifadhi taswira hai ya ulinzi.
theological_decisions:
- issue: Tafsiri ya nahau ya ulinzi wa jicho
  choice: kama mboni ya jicho
  alternative: kama kitu cha thamani sana machoni
  rationale: Maandishi yanatumia taswira halisi ya sehemu nyeti ya jicho, si tamko la jumla tu kuhusu thamani. Kutaja mboni kunahifadhi ushairi na maana ya ulinzi wa makini.
- issue: Kudumisha taswira ya mabawa
  choice: mabawa yako
  alternative: ulinzi wako
  rationale: Kiebrania kinatumia sitiari ya mabawa kwa ulinzi wa Mungu. Kuidumisha kunahifadhi mvutano na uzito wa kishairi bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa maombi “Unilinde … unifiche” ni wa kawaida na unaakisi usambamba wa kishairi wa Kiebrania. Hakuna tanbihi iliyoongezwa kwa kuwa “mboni ya jicho” inaeleweka moja kwa moja, na mbadala wa Kiingereza “apple of the eye” hauna ulinganifu wa lazima katika Kiswahili.
