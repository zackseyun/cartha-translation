base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/001.yaml
  text: A prayer of David. Hear[a], O Yahweh, a just cause; attend to my cry; give ear to my prayer from lips without deceit.
translation:
  language: sw
  text: Sala ya Daudi. Ee Yahweh, sikia[a] jambo la haki; usikilize kilio changu; tega sikio kwa sala yangu itokayo katika midomo isiyo na hila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sikia haki”—yaani, sikia lililo sawa au la haki. Neno la Kiebrania צֶדֶק linaweza kumaanisha haki, uadilifu, au jambo lenye haki; hapa huenda linarejelea shauri la haki la mtunga zaburi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: Sala ya Daudi
  rationale: Kichwa hiki cha zaburi kinatambulisha sala inayohusishwa na Daudi; katika vichwa vya zaburi, לְ pamoja na jina la mtu kwa kawaida huwasilishwa kwa Kiswahili kwa ‘ya’.
- source_word: שִׁמְעָה
  choice: sikia
  rationale: Amri hii inadumisha ombi la moja kwa moja kwa Mungu na inaendana na mfululizo wa vitenzi vya kusikiliza.
- source_word: יְהוָה
  choice: Ee Yahweh
  rationale: Jina la Mungu limeandikwa moja kwa moja katika Kiebrania; ‘Ee’ huonyesha mwito wa moja kwa moja kwa Kiswahili cha asili.
- source_word: צֶדֶק
  choice: jambo la haki
  rationale: Katika muktadha huu neno hilo ni kitu kinachosikiwa na linaelekea kumaanisha dai au shauri lenye haki, si haki kama dhana ya jumla pekee.
- source_word: הַקְשִׁיבָה
  choice: usikilize
  rationale: Huwasilisha wito wa kusikiliza kwa makini kwa lugha ya kawaida na yenye heshima.
- source_word: רִנָּתִי
  choice: kilio changu
  rationale: Ingawa neno linaweza kumaanisha sauti kuu au shangwe katika miktadha mingine, hapa katika sala ya maombolezo linaonyesha kilio cha kuomba msaada.
- source_word: הַאֲזִינָה
  choice: tega sikio kwa
  rationale: Usemi huu unahifadhi taswira ya Kiebrania ya kuelekeza sikio ili kusikiliza kwa makini na unafaa katika ushairi wa Kiswahili.
- source_word: תְפִלָּתִי
  choice: sala yangu
  rationale: Tafsiri ya moja kwa moja inadumisha uhusiano wa kileksia na neno ‘Sala’ katika kichwa.
- source_word: בְּלֹא שִׂפְתֵי מִרְמָה
  choice: itokayo katika midomo isiyo na hila
  rationale: Kifungu hiki kinaonyesha kwamba sala inatoka katika midomo isiyo danganyifu; ‘hila’ huwasilisha udanganyifu kwa ufupi na kwa lugha ya asili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya צֶדֶק kama kitu cha kitenzi ‘sikia’
  choice: jambo la haki
  alternative: haki; shauri langu la haki
  rationale: Tafsiri hii hudumisha maana ya kisheria au ya dai lenye haki bila kuongeza kiwakilishi ‘langu,’ ambacho hakijaandikwa wazi katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mfululizo wa ‘sikia,’ ‘usikilize,’ na ‘tega sikio’ unahifadhi urudiaji wenye tofauti wa vitenzi vitatu vya Kiebrania.
