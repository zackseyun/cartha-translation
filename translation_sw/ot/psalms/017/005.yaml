lexical_decisions:
- source_word: תָּמֹךְ
  choice: Zitegemeze
  rationale: Kitenzi תמך humaanisha kushikilia au kutegemeza kwa uthabiti. Umbo la Kiebrania linaweza kusomwa kama ombi, jambo linalopatana vizuri na kishazi kinachofuata.
- source_word: אֲשֻׁרַי
  choice: hatua zangu
  rationale: Neno hili hutaja hatua au mwendo wa mtu; “hatua zangu” linahifadhi taswira halisi ya kutembea kwa Kiswahili cha kawaida.
- source_word: בְּמַעְגְּלוֹתֶיךָ
  choice: katika mapito yako
  rationale: מַעְגָּל hutaja njia au pito linalofuatwa. “Mapito yako” ni la kishairi lakini linaeleweka na linahifadhi taswira ya njia.
- source_word: בַּל
  choice: -si-
  rationale: Kikanushi hiki cha kishairi kimewakilishwa moja kwa moja katika “zisiteleze.”
- source_word: נָמֹטּוּ
  choice: zisiteleze
  rationale: מוט hapa hueleza kuyumba, kusogea au kuteleza; pamoja na nyayo, “kuteleza” ndilo neno la asili zaidi katika Kiswahili.
- source_word: פְעָמָי
  choice: nyayo zangu
  rationale: Neno linaweza kumaanisha hatua au miguu/nyayo. “Nyayo zangu” linafaa na kitenzi “kuteleza” na kudumisha usambamba bila kurudia “hatua.”
theological_decisions:
- issue: Je, תָּמֹךְ ni ombi au taarifa ya uthabiti?
  choice: 'Imetafsiriwa kama ombi: “Zitegemeze hatua zangu.”'
  alternative: “Hatua zangu zimeshikamana na mapito yako” au “Hatua zangu zimetegemezwa katika mapito yako.”
  rationale: Umbo la Kiebrania linaweza kueleweka kama amri/ombi, ingawa muktadha na uwezekano mwingine wa kisarufi huruhusu pia taarifa. Tanbihi huhifadhi utata huo bila kuuficha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo ni mfupi, wenye hadhi na wa kishairi. “Mapito” na “nyayo” huhifadhi taswira ya kutembea huku sentensi ikiendelea kueleweka kwa msomaji wa kawaida.
