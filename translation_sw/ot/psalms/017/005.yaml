  text: Uzitegemeze hatua zangu katika mapito yako; nyayo zangu zisiteleze.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Hatua zangu zimeshikamana imara katika mapito yako; nyayo zangu hazikuteleza.” Kiebrania kinaweza kueleweka kama ombi au kama taarifa ya uthabiti.
