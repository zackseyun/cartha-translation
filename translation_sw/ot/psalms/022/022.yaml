lexical_decisions:
- source_word: אֲסַפְּרָה
  choice: Nitalitangaza
  rationale: Kitenzi ספר katika piel kina maana ya kusimulia au kutangaza. “Nitalitangaza” linafaa kwa ushuhuda wa hadharani unaolingana na kifungu cha pili.
- source_word: שִׁמְךָ
  choice: jina lako
  rationale: Linadumisha nahau ya Kiebrania, ambapo “jina” linaweza kuhusisha tabia na sifa za Mungu zilizofunuliwa, si jina kama alama tu.
- source_word: לְאֶחָי
  choice: kwa ndugu zangu
  rationale: Neno la Kiebrania ni la kiume katika wingi, likiwa na kiambishi cha nafsi ya kwanza. “Ndugu zangu” ni la kawaida na linaweza kuhifadhi umbo hilo bila kupanua maana kimyakimya.
- source_word: בְּתוֹךְ
  choice: katikati ya
  rationale: Linahifadhi picha ya nafasi na mazingira ya hadharani katika kusanyiko, huku likisikika kwa kawaida katika Kiswahili cha kishairi.
- source_word: קָהָל
  choice: kusanyiko
  rationale: קהל humaanisha kundi lililokusanyika. “Kusanyiko” ni neno wazi lisiloingiza kwa lazima maana maalumu ya baadaye ya kidini.
- source_word: אֲהַלְלֶךָּ
  choice: nitakusifu
  rationale: הלל katika piel hapa ni “kusifu,” na kiambishi cha yambwa kinaonyeshwa moja kwa moja katika “-ku-.” Hakuna haja ya kuongeza wazo la kuimba ambalo halijaelezwa wazi.
theological_decisions:
- issue: Neno la undugu lenye umbo la kiume katika muktadha wa ibada ya jumuiya
  choice: kwa ndugu zangu
  alternative: kwa ndugu zangu wa kiume na wa kike
  rationale: Kiebrania kina nomino ya kiume katika wingi. Matini kuu inahifadhi umbo hilo, huku tanbihi ikitaja uwezekano wa maana jumuishi katika muktadha wa jumuiya bila kuiingiza moja kwa moja katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa vishazi na urudiaji wa nafsi ya kwanza umehifadhiwa; “kusanyiko” limechaguliwa badala ya neno lenye miungano mikali zaidi ya kimadhehebu.
