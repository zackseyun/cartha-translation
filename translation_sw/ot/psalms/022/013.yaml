  text: They open their mouth against me like a tearing and roaring lion[a].
translation:
  language: sw
  text: Wanafungua vinywa vyao dhidi yangu kama simba anayerarua na kunguruma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wamefungua vinywa vyao dhidi yangu; simba anayerarua na kunguruma.” Kiebrania kinatoa taswira ya simba kwa ufupi bila neno la wazi la “kama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצ֣וּ
  choice: Wananifungulia
  rationale: Kitenzi פצה humaanisha kufungua kwa upana. Wakati uliotimilika wa kishairi umetafsiriwa kwa wakati wa sasa ili kuhifadhi uhai wa taswira katika muktadha huu.
- source_word: עָלַי
  choice: -ni-
  rationale: Kiambishi cha yambwa “-ni-” pamoja na “kufungulia” kinaeleza kwamba kitendo kinaelekezwa kwa uhasama dhidi ya msemaji.
- source_word: פִּיהֶם
  choice: kinywa chao
  rationale: Kiebrania kina nomino ya umoja yenye kiambishi cha wingi. “Kinywa chao” kinahifadhi umoja huo wa kijumla na kinaeleweka katika Kiswahili.
- source_word: אַרְיֵה
  choice: kama simba
  rationale: Ingawa Kiebrania hakina chembe ya wazi ya ulinganisho, taswira iliyowekwa sambamba hufanya kazi kama tashbihi; “kama” huifanya iwe wazi na ya kawaida katika Kiswahili.
- source_word: טֹרֵף
  choice: anayerarua
  rationale: Kitenzi kishirikishi cha טרף kinaonyesha tendo la simba la kurarua kwa nguvu. Tafsiri hii ni ya moja kwa moja, hai, na haiongezi yambwa lisilotajwa katika Kiebrania.
- source_word: וְשֹׁאֵג
  choice: na kunguruma
  rationale: שׁאג ndicho kitenzi cha kawaida kinachoeleza sauti ya simba; “kunguruma” ni tafsiri ya asili na ya moja kwa moja.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida huku ukihifadhi taswira fupi ya kishairi, umoja wa “kinywa,” na uwezekano wa kusoma “simba” kama taswira iliyowekwa sambamba badala ya tashbihi yenye kiunganishi cha wazi.
