  text: מֵ֥/אִתְּ/ךָ֗ תְֽהִלָּ֫תִ֥/י בְּ/קָהָ֥ל רָ֑ב נְדָרַ֥/י אֲ֝שַׁלֵּ֗ם נֶ֣גֶד יְרֵאָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/025.yaml
  text: From you comes my praise in the great assembly[a]; I will pay my vows before those who fear him.
translation:
  language: sw
  text: Sifa yangu katika kusanyiko kubwa hutoka kwako; nitatimiza nadhiri zangu mbele ya wale wanaomwogopa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wale wanaomwogopa”; baadhi ya tafsiri husawazisha kiwakilishi na kusema “wale wanaokuogopa,” ili kilingane na Mungu kusemeshwa moja kwa moja mwanzoni mwa mstari.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאִתְּךָ
  choice: hutoka kwako
  rationale: 'Kihusishi chenye kiambishi cha nafsi ya pili umoja kinaonyesha chanzo: sifa ya mtunga zaburi hutoka kwa Mungu. Kitenzi “hutoka” kinakamilisha sentensi kwa Kiswahili cha kawaida bila kubadili maana.'
- source_word: תְהִלָּתִי
  choice: sifa yangu
  rationale: Nomino hii humaanisha sifa au shukrani. “Sifa yangu” ni tafsiri ya moja kwa moja isiyoongeza wazo la wimbo au dhabihu ambalo halijaelezwa wazi.
- source_word: בְּקָהָל רָב
  choice: katika kusanyiko kubwa
  rationale: קָהָל ni jumuiya iliyokusanyika, na רָב hapa inaonyesha ukubwa wake. “Kusanyiko kubwa” ni lugha ya sasa, yenye heshima, na inayofaa muktadha wa ibada.
- source_word: נְדָרַי
  choice: nadhiri zangu
  rationale: Wingi huu unataja ahadi rasmi alizomwekea Mungu. “Nadhiri zangu” ni usemi sahihi na unaoeleweka katika Kiswahili cha Biblia.
- source_word: אֲשַׁלֵּם
  choice: nitatimiza
  rationale: Katika piel, שׁלם pamoja na nadhiri humaanisha kulipa au kutekeleza kilichoahidiwa. “Nitatimiza” ni Kiswahili cha kawaida zaidi kuliko “nitalipa” kwa nadhiri na huhifadhi maana ya kutekeleza ahadi.
- source_word: נֶגֶד
  choice: mbele ya
  rationale: Kihusishi hiki kinaonyesha kuwapo mbele ya watu au jambo kufanyika huku wakiona. “Mbele ya” ni kifupi na cha asili katika muktadha huu.
- source_word: יְרֵאָיו
  choice: wale wanaomwogopa
  rationale: Umbo hili lina kiambishi cha nafsi ya tatu umoja na humaanisha wale wanaomwogopa Mungu. “Wanaomwogopa” huhifadhi lugha ya hofu yenye heshima bila kuipunguza kuwa heshima pekee.
theological_decisions:
- issue: Mabadiliko kutoka kumsemesha Mungu moja kwa moja kwa nafsi ya pili (“kwako”) hadi kumrejelea kwa nafsi ya tatu (“wanaomwogopa”)
  choice: 'Kuhifadhi mabadiliko ya Kimasora: “hutoka kwako ... wale wanaomwogopa”'
  alternative: 'Kusawazisha nafsi kuwa ya pili: “wale wanaokuogopa”'
  rationale: Maandishi ya Kiebrania hubadilika kutoka nafsi ya pili hadi kiambishi cha nafsi ya tatu. Kuhifadhi badiliko hilo kunaheshimu mvutano wa kisarufi wa chanzo badala ya kuusawazisha kimya; katika muktadha, anayerejelewa bado ni Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nitatimiza nadhiri” imetumiwa kwa uasilia wa Kiswahili, huku badiliko la nafsi katika Kiebrania likihifadhiwa na kufafanuliwa katika tanbihi.
