  yaml_path: translation/ot/psalms/022/012.yaml
  text: Many bulls surround me[a]; mighty bulls of Bashan encircle me.
translation:
  language: sw
  text: Fahali wengi wamenizunguka; fahali wenye nguvu wa Bashani[a] wamenizingira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bashani ilikuwa eneo mashariki ya Mto Yordani, lililojulikana kwa malisho mazuri na ng’ombe wenye nguvu na walionona; taswira hii inaashiria wapinzani wenye nguvu na wa kutisha.
    reason: cultural_note
lexical_decisions:
- source_word: סְבָבוּנִי
  choice: wamenizunguka
  rationale: Kitenzi סבב kina maana ya kuzunguka au kuweka katikati. Hali timilifu ya Kiebrania inaonyesha kwamba tayari mwombaji amezingirwa; Kiswahili cha wakati timilifu kinabeba maana hiyo kwa kawaida.
- source_word: פָּרִים
  choice: fahali
  rationale: Wingi wa פַּר humaanisha fahali au fahali wachanga. ‘Fahali’ ni neno la kawaida na lenye nguvu linalohifadhi taswira ya wanyama.
- source_word: רַבִּים
  choice: wengi
  rationale: Kivumishi hiki kinaonyesha idadi kubwa na hapa kinapatana moja kwa moja na ‘fahali.’
- source_word: אַבִּירֵי
  choice: wenye nguvu
  rationale: אַבִּירֵי huonyesha walio hodari au wenye nguvu. Kwa kuwa inawarejelea fahali waliotajwa, ‘fahali wenye nguvu’ hudumisha taswira bila kuigeuza kuwa maelezo ya moja kwa moja kuhusu maadui.
- source_word: בָשָׁן
  choice: Bashani
  rationale: Jina la mahali limetoholewa kwa umbo la kawaida la Kiswahili. Bashani ilijulikana kwa malisho mazuri na mifugo yenye nguvu.
- source_word: כִּתְּרוּנִי
  choice: wamenizingira
  rationale: Kitenzi כתר hapa humaanisha kuzunguka au kuzingira. ‘Wamenizingira’ huhifadhi usambamba na ‘wamenizunguka’ huku kikiongeza hisia ya tishio na kubanwa.
theological_decisions:
- issue: Taswira ya wanyama inayowakilisha wapinzani wenye kutisha
  choice: Kudumisha sitiari ya ‘fahali’ moja kwa moja katika matini
  alternative: Kutafsiri kwa ufafanuzi kuwa ‘maadui wengi’ au ‘watu wenye nguvu’
  rationale: Kiebrania kinawasilisha wapinzani kwa taswira ya fahali. Kudumisha sitiari hulinda nguvu ya kishairi na kutomlazimishia msomaji tafsiri ambayo matini yenyewe haijasema wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa mistari miwili na usambamba wa vitenzi umehifadhiwa; ‘fahali’ limetumika badala ya maelezo ya moja kwa moja kama ‘maadui.’
