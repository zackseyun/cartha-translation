  text: 'Uuokoe uhai wangu[a] kutoka kwa upanga,

    uhai wangu wa pekee[c] kutoka katika nguvu[b] za mbwa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi yangu.” Neno la Kiebrania נפש linaweza kumaanisha nafsi, mtu mwenyewe, au uhai kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “mkono.” Hapa “mkono” ni nahau inayomaanisha nguvu, mamlaka, au udhibiti.
    reason: lexical_alternative
  - marker: c
    text: Au, “kilicho changu cha pekee,” au “uhai wangu wa thamani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילָה
  choice: Uuokoe
  rationale: Kitenzi hiki ni ombi la moja kwa moja na la haraka la kuokolewa. Muundo wenye kiambishi cha yambwa unahifadhi kwamba kitu kinachoombewa kuokolewa ni uhai wa msemaji.
- source_word: מֵחֶרֶב
  choice: na upanga
  rationale: Katika Kiswahili, ‘kuokoa ... na upanga’ hueleza kwa kawaida kuondolewa katika hatari ya upanga; upanga unasalia kuwa picha halisi ya tishio la kifo.
- source_word: נַפְשִׁי
  choice: uhai wangu
  rationale: Katika muktadha huu wa hatari ya kufa, נפש linamaanisha hasa uhai au nafsi hai ya msemaji, si lazima roho isiyo ya mwili.
- source_word: מִיַּד
  choice: na nguvu
  rationale: Neno יד, ‘mkono,’ linatumika hapa kwa maana ya kimethali ya mamlaka, nguvu, au udhibiti. ‘Na nguvu’ hutoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: כֶּלֶב
  choice: mbwa
  rationale: Kiebrania kina umoja. Kutumia ‘mbwa’ kunahifadhi picha kali ya kishairi bila kuifafanua kimadhehebu kuwa adui fulani.
- source_word: יְחִידָתִי
  choice: uhai wangu wa pekee
  rationale: Neno hili humaanisha kilicho pekee au cha namna ya kipekee. Kwa kuwa linalingana kishairi na ‘uhai wangu,’ tafsiri hii inaonyesha kuwa msemaji ana uhai mmoja tu bila kupoteza maana ya thamani yake.
theological_decisions:
- issue: Maana ya נפש katika ombi la kuokolewa na kifo
  choice: uhai wangu
  alternative: nafsi yangu
  rationale: Muktadha wa upanga na nguvu za adui unaelekeza kwenye uhai wa msemaji. ‘Uhai’ huepuka kuingiza bila msingi dhana maalumu ya mgawanyiko wa mwili na roho.
- issue: Rejeo lisilo wazi la יְחִידָתִי
  choice: uhai wangu wa pekee
  alternative: kilicho changu cha pekee
  rationale: Kiebrania hakirudii nomino ‘uhai,’ lakini usambamba na נַפְשִׁי unaonyesha kuwa maisha ya msemaji ndiyo yanayorejelewa. Tanbihi huhifadhi uwezekano wa tafsiri ya karibu zaidi na muundo halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya sala ya maombolezo lakini kinachoeleweka kwa msomaji wa kawaida. Mistari miwili inadumisha usambamba wa kishairi wa Kiebrania; umoja wa ‘mbwa’ umehifadhiwa.
