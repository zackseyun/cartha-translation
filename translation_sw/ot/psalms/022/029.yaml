base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/029.yaml
  text: All the prosperous of the earth will eat and bow down[c][b][a]; before him all who go down to the dust will kneel—even he who could not keep himself alive.
translation:
  language: sw
  text: Waliofanikiwa wote wa dunia[a] watakula na kusujudu; mbele yake wote wanaoshuka mavumbini[b] watapiga magoti—hata yule ambaye hakuweza kujihifadhi hai.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “wanene wote wa dunia.” Huenda msemo huo unamaanisha watu walioshiba, wenye mali, au waliofanikiwa.
    reason: lexical_alternative
  - marker: b
    text: Au “wote wanaoteremka mavumbini.” “Mavumbi” ni taswira ya Kiebrania ya kufa na mauti.
    reason: lexical_alternative
  - marker: c
    text: Kishazi cha mwisho cha Kiebrania ni kigumu. Kihalisi kwa karibu, “na hakuihuisha nafsi yake”; mara nyingi hueleweka kuwa “hata yule ambaye hakuweza kujihifadhi hai.”
    reason: alternative_reading
lexical_decisions:
- source_word: אָכְלוּ
  choice: watakula
  rationale: Wakati timilifu wa Kiebrania unaweza kuwa na maana ya wakati ujao katika muktadha huu wa kishairi na wa matarajio, sambamba na vitenzi vinavyofuata.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: na kusujudu
  rationale: Kitenzi kinaonyesha kuinama au kujilaza chini kwa heshima, mara nyingi katika ibada; “kusujudu” huhifadhi tendo la mwili na maana ya ibada.
- source_word: כָּל דִּשְׁנֵי אֶרֶץ
  choice: waliofanikiwa wote wa dunia
  rationale: Neno hilo humaanisha kihalisi “wanene,” lakini hapa ni nahau ya watu walioshiba, wenye mali, au waliofanikiwa.
- source_word: לְפָנָיו
  choice: mbele zake
  rationale: Hii ni tafsiri fupi na ya kawaida ya kishazi hicho, ikidokeza kuwapo mbele yake.
- source_word: יִכְרְעוּ
  choice: watapiga magoti
  rationale: Kitenzi hiki hasa huonyesha kupiga au kukunja magoti, na hivyo huhifadhi tofauti yake na kusujudu.
- source_word: כָּל יוֹרְדֵי עָפָר
  choice: wote wanaoshuka mavumbini
  rationale: Tafsiri hii huhifadhi taswira ya Kiebrania ya mavumbi kama ishara ya kufa na mauti bila kuibadili moja kwa moja kuwa “kaburi.”
- source_word: וְנַפְשׁוֹ לֹא חִיָּה
  choice: hata yule asiyeweza kujihifadhi hai
  rationale: Kishazi hiki ni kigumu kisintaksia. Tafsiri hii hutoa maana inayokubalika kwamba mtu huyo hawezi kudumisha uhai wake mwenyewe, huku tanbihi ikihifadhi ugumu wa matini.
theological_decisions:
- issue: Maana ya kishazi cha mwisho וְנַפְשׁוֹ לֹא חִיָּה
  choice: Kinamhusu mtu asiyeweza kujihifadhi hai, na hivyo kupanua picha ya heshima kwa waliofanikiwa na walio karibu na mauti.
  alternative: “na uhai wake hakuuhifadhi” au “na nafsi yake haikuhifadhiwa hai.”
  rationale: Kiebrania ni kifupi na chenye utata. Muktadha unalinganisha waliofanikiwa na wanaoshuka mavumbini; tafsiri ya msingi inaleta maana inayoeleweka bila kufanya dai kali zaidi la kiteolojia, na tanbihi inaonyesha umbo halisi na utata.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kusujudu” na “kupiga magoti” huhifadhi picha mbili tofauti za mwili; “mavumbini” huhifadhi taswira ya kishairi ya Kiebrania. Alama za tanbihi zimewekwa karibu na vifungu vinavyohusika kwa mpangilio wa kawaida.
