  text: כִּ֤י לֹֽא בָזָ֨ה וְ/לֹ֪א שִׁקַּ֡ץ עֱנ֬וּת עָנִ֗י וְ/לֹא הִסְתִּ֣יר פָּנָ֣י/ו מִמֶּ֑/נּוּ וּֽ/בְ/שַׁוְּע֖/וֹ אֵלָ֣י/ו שָׁמֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/024.yaml
  text: For he has not despised or abhorred the affliction of the afflicted[a], and he has not hidden his face from him; but when he cried to him, he heard.
translation:
  language: sw
  text: Kwa maana hakuyadharau wala kuyachukia mateso ya anayeteseka[a], wala hakuficha uso wake mbali naye; bali alipomlilia, alimsikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “taabu ya maskini,” au, “hali ya kufedheheshwa kwa anayeteseka.”
    reason: Neno עֱנוּת linaweza kueleza mateso, taabu, au hali ya kufedheheshwa; na עָנִי linaweza kumaanisha mtu anayeteseka au maskini.
lexical_decisions:
- source_word: בָזָה
  choice: hakuyadharau
  rationale: Kitenzi hiki humaanisha kuyatendea mambo kwa dharau. ‘Hakuyadharau’ ni Kiswahili cha kawaida na huhifadhi maana hiyo.
- source_word: שִׁקַּץ
  choice: hakuchukizwa na
  rationale: Neno hili lina nguvu kuliko בָזָה na hudokeza kuona jambo kuwa la kuchukiza sana. Chaguo hili linahifadhi ongezeko hilo la uzito bila kutumia lugha isiyo ya kawaida.
- source_word: עֱנוּת
  choice: mateso
  rationale: Nomino hii inaweza kumaanisha hali ya taabu, kunyanyaswa, au kufedheheshwa. ‘Mateso’ inafaa katika muktadha wa zaburi na haifungi maana kwenye umaskini wa kiuchumi pekee.
- source_word: עָנִי
  choice: anayeteseka
  rationale: Neno hili linaweza kumaanisha maskini, mhitaji, mnyonge, au mtu aliyeteswa. ‘Anayeteseka’ linaendana na muktadha na kudumisha upeo mpana wa neno.
- source_word: הִסְתִּיר פָּנָיו
  choice: hakumficha uso wake
  rationale: Taswira ya Kiebrania ya kuficha uso imehifadhiwa; humaanisha kutompa mtu uangalifu au uwepo wenye fadhili.
- source_word: מִמֶּנּוּ
  choice: hakumficha
  rationale: Kiambishi cha nafsi ya tatu umoja kimerejeshwa kwa mtu anayeteseka, bila kurudia nomino isivyo lazima.
- source_word: בְשַׁוְּעוֹ
  choice: alipomlilia
  rationale: Usemi huu unaeleza kilio cha kuomba msaada. ‘Alipomlilia’ ni wa asili katika Kiswahili na hudumisha uharaka wa ombi.
- source_word: אֵלָיו
  choice: -mlilia
  rationale: Kiambishi ‘-m-’ kinadumisha kiwakilishi kinachomrejelea Mungu bila kuongeza jina au cheo cha Mungu kisichokuwapo katika mstari.
- source_word: שָׁמֵעַ
  choice: alimsikia
  rationale: Maana ya msingi ni ‘kusikia.’ ‘Alimsikia’ haiongezi dhana ya kujibu ambayo haijaelezwa moja kwa moja.
theological_decisions:
- issue: Mhusika anayeteseka anarejelea nani
  choice: Mstari unasema kwa namna inayoweza kumhusu mtu anayeteseka kwa ujumla, huku ukiendelea kufaa kwa muktadha wa karibu wa uzoefu wa mtunga-zaburi.
  alternative: Kumfanya mhusika awe Masihi pekee, au kumfanya awe maskini yeyote pekee.
  rationale: Maumbo ya umoja katika Kiebrania yanaweza kurejelea uzoefu wa mtunga-zaburi na pia kutoa kauli yenye matumizi mapana. Tafsiri haifungi mvutano huo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Taswira ya Kiebrania ya ‘kuficha uso’ imehifadhiwa kwa sababu inaeleweka katika muktadha, huku sentensi nzima ikibaki ya kawaida kwa msomaji wa leo.
