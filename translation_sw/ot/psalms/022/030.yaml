lexical_decisions:
- source_word: זֶרַע
  choice: Uzao
  rationale: Neno hili la Kiebrania kwa umoja wa kisarufi linaweza kumaanisha mbegu au wazao kwa maana ya jumla. “Uzao” huhifadhi maana ya pamoja na inafaa kwa muktadha wa watu watakaomtumikia.
- source_word: יַעַבְדֶנּוּ
  choice: utamtumikia
  rationale: Kitenzi kina maana ya kutumikia; kiambishi cha yambwa humrejelea yeye anayezungumziwa katika muktadha.
- source_word: יְסֻפַּר
  choice: zitasimuliwa
  rationale: Umbo la kutendwa la ספר lina maana ya kusimuliwa au kutangazwa. Wingi unapatana kwa kawaida na “habari za Bwana” katika Kiswahili.
- source_word: לַאדֹנָי
  choice: za Bwana
  rationale: Kirai hiki kinaweza kueleweka kuwa simulizi linalomhusu Bwana. “Habari za Bwana” huonyesha uhusiano huo bila kuongeza dai lisilokuwamo.
- source_word: לַדּוֹר
  choice: kwa kizazi kijacho
  rationale: Kwa neno halisi ni “kwa kizazi.” Muktadha unaelekeza kwa kizazi kitakachofuata, hivyo “kijacho” hufanya rejeo lieleweke kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Rejeo la “yeye” katika “utamtumikia”
  choice: Kiambishi cha nafsi “-m-” kimehifadhiwa bila kumtaja mhusika kwa jina.
  alternative: “utamtumikia Bwana”
  rationale: Kiebrania kina kiwakilishi tu katika sehemu hii; kumtaja Bwana moja kwa moja kungeondoa uwezekano wa kurejelea mhusika wa muktadha wa karibu.
- issue: Maana ya לַאדֹנָי
  choice: “habari za Bwana”
  alternative: “zitasimuliwa kwa Bwana”
  rationale: Kihusishi ל kinaweza kuruhusu zaidi ya uhusiano mmoja, lakini katika muktadha huu usomaji wa habari inayomhusu Bwana unaeleweka vizuri. Tanbihi huhifadhi mbadala halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Uzao” limechaguliwa badala ya “mbegu” ili kuwasilisha maana ya watu wa baadaye bila kupoteza umoja wa pamoja wa neno la Kiebrania.
