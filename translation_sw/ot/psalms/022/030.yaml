  text: Uzao utamtumikia; habari za Bwana zitasimuliwa kwa kizazi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno halisi: “atasimuliwa kwa Bwana kwa kizazi.” Uhusiano wa virai hivi katika Kiebrania ni wa utata; yanaweza kueleweka kuwa habari kumhusu Bwana zinazosimuliwa kwa kizazi.'
