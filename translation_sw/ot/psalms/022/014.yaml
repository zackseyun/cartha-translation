base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/014.yaml
  text: I am poured out like water[a], and all my bones are out of joint; my heart has become like wax, melted within me.
translation:
  language: sw
  text: 'Nimemwagika kama maji,

    na mifupa yangu yote imetengana;

    moyo wangu umekuwa kama nta,

    umeyeyuka ndani yangu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana halisi zaidi, “katikati ya sehemu zangu za ndani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמַּיִם
  choice: kama maji
  rationale: Kiambishi כַּ־ kinaonyesha ulinganisho; “kama maji” ni usemi wa kawaida wa Kiswahili unaohifadhi taswira hiyo.
- source_word: נִשְׁפַּכְתִּי
  choice: nimemwagwa
  rationale: Kauli ya Niphal ya שׁפך inaonyesha msemaji akiwa katika hali ya kumwagwa au kumiminwa. “Nimemwagwa” huhifadhi kauli tendwa na uzito wa taswira ya kishairi.
- source_word: וְהִתְפָּרְדוּ
  choice: imetengana
  rationale: Kitenzi cha Hitpael kutoka פרד humaanisha kutengana au kuachana. Kwa mifupa, “imetengana” huhifadhi maana ya msingi bila kuongeza kwa lazima wazo mahususi la viungo kuteguka.
- source_word: כָּל עַצְמוֹתַי
  choice: mifupa yangu yote
  rationale: Tafsiri ya moja kwa moja inayohifadhi ukamilifu wa כָּל na taswira halisi ya mwili.
- source_word: הָיָה לִבִּי
  choice: moyo wangu umekuwa
  rationale: “Umekuwa” huonyesha mabadiliko yanayoleta hali mpya, badala ya kuonyesha hali tuli tu.
- source_word: כַּדּוֹנָג
  choice: kama nta
  rationale: דּוֹנָג ni nta; tafsiri hii huhifadhi tashbihi waziwazi na kwa Kiswahili cha kawaida.
- source_word: נָמֵס
  choice: umeyeyuka
  rationale: Kitenzi מסס humaanisha kuyeyuka au kufutika; “umeyeyuka” kinaendana moja kwa moja na taswira ya nta.
- source_word: בְּתוֹךְ מֵעָי
  choice: ndani yangu
  rationale: מֵעִים humaanisha sehemu za ndani za mwili na pia hutumika kwa hisia za ndani kabisa. “Ndani yangu” ni ya asili katika Kiswahili, huku maana halisi zaidi ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Taswira ya kibinadamu ya dhiki ya ndani
  choice: ndani yangu
  alternative: katikati ya viungo vyangu vya ndani
  rationale: Kiebrania kinatumia taswira ya viungo vya ndani, si istilahi dhahania ya kiroho. Matini kuu inatumia Kiswahili cha kawaida, na tanbihi inahifadhi usemi halisi zaidi ili kuepuka kuifanya taswira hiyo kuwa ya kiroho kupita kiasi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa mistari unahifadhi ulinganifu wa kishairi wa Kiebrania; msamiati unabaki wa heshima na wa sasa.
