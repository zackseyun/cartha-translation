base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/016.yaml
  text: For dogs have surrounded me[a]; a company of evildoers has encircled me[b]; like a lion are my hands and my feet.
translation:
  language: sw
  text: Kwa maana mbwa wamenizunguka; kundi la watenda maovu limenizingira; kama simba—mikono yangu na miguu yangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya ushahidi wa kale, kutia ndani hati moja ya Bahari ya Chumvi na Septuajinti, una usomaji unaoweza kutafsiriwa, “wamepenya mikono yangu na miguu yangu,” badala ya usomaji mgumu wa Maandishi ya Kimasoreti, “kama simba—mikono yangu na miguu yangu.”
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza nguvu ya maelezo au sababu katika maombolezo bila kuifanya iwe kauli yenye mkazo kuliko ilivyo.
- source_word: סְבָבוּנִי
  choice: wamenizunguka
  rationale: Kitenzi סבב humaanisha kuzunguka au kuzingira; hali timilifu ya Kiswahili inaonyesha tendo lililotimia lenye matokeo yanayoendelea.
- source_word: כְּלָבִים
  choice: mbwa
  rationale: Taswira halisi ya Kiebrania imehifadhiwa; katika muktadha inawakilisha washambuliaji wenye uhasama.
- source_word: עֲדַת מְרֵעִים
  choice: kundi la watenda maovu
  rationale: עֲדָה ni kikundi kilichokusanyika, nao מְרֵעִים ni watu wanaotenda maovu; usemi huu ni wa kawaida na wenye heshima katika Kiswahili cha sasa.
- source_word: הִקִּיפוּנִי
  choice: limenizingira
  rationale: Huhifadhi maana ya kufunga mtu kwa kumzunguka na pia utofauti mdogo wa kitenzi dhidi ya סבב katika mstari unaotangulia.
- source_word: כָּאֲרִי
  choice: kama simba
  rationale: Maandishi ya Kimasoreti yanasoma kihalisi ‘kama simba.’ Ingawa muundo wake ni mgumu, usomaji huo umehifadhiwa katika matini kuu badala ya kuingiza kitenzi kisichokuwapo.
- source_word: יָדַי וְרַגְלָי
  choice: mikono yangu na miguu yangu
  rationale: Ni tafsiri ya moja kwa moja ya viungo vilivyotajwa, huku muundo mgumu usio na kitenzi ukihifadhiwa kwa kadiri inayowezekana.
theological_decisions:
- issue: Tofauti ya maandishi kati ya כָּאֲרִי ya Maandishi ya Kimasoreti na usomaji unaoshuhudiwa katika baadhi ya vyanzo vya kale
  choice: Matini kuu inafuata ‘kama simba’
  alternative: ‘wameitoboa mikono yangu na miguu yangu’ au ‘wameichimba mikono yangu na miguu yangu’
  rationale: Usomaji wa Kimasoreti uliopo ni mgumu lakini unapaswa kubaki katika matini kuu. Usomaji mwingine ni wa kale, muhimu kwa uhakiki wa maandishi, na wenye uzito katika tafsiri ya Kikristo; kwa hiyo umeelezwa katika tanbihi bila kuufanya matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Taswira ya ‘mbwa’ na muundo mgumu wa kishairi katika kifungu cha mwisho vimehifadhiwa; vistari virefu vinaonyesha kukatika kwa kisintaksia bila kulazimisha maana isiyo wazi katika Kiebrania.
