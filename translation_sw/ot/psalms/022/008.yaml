  yaml_path: translation/ot/psalms/022/008.yaml
  text: “Commit yourself to Yahweh; let him rescue him; let him deliver him[a], since he delights in him!”
translation:
  language: sw
  text: “Jikabidhi kwa Yahwe[a]; na amwokoe, na amkomboe, kwa kuwa anapendezwa naye!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Vingirisha kwa Yahwe.” Hii ni tamathali yenye maana ya kujikabidhi mwenyewe au kukabidhi jambo lako kwake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּל
  choice: Jikabidhi
  rationale: Kitenzi hiki kwa maana ya msingi ni ‘vingirisha,’ lakini katika tamathali hii kinamaanisha kuweka nafsi au jambo lako mikononi mwa Mungu. ‘Jikabidhi’ ni Kiswahili cha asili kinachohifadhi amri iliyoelekezwa kwa mtu anayeteseka.
- source_word: אֶל
  choice: kwa
  rationale: Kihusishi kinaonyesha uelekeo kwa Yahwe; katika Kiswahili, ‘jikabidhi kwa Yahwe’ ni usemi wa kawaida na wazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: יְפַלְּטֵהוּ
  choice: na amwokoe
  rationale: פלט katika piel humaanisha kumwezesha mtu kuponyoka au kumwokoa. ‘Na amwokoe’ hutoa vizuri changamoto ya kejeli iliyomo katika usemi.
- source_word: יַצִּילֵהוּ
  choice: na amkomboe
  rationale: נצל katika hiphil humaanisha kuokoa, kukomboa, au kunyakua kutoka hatarini. ‘Amkomboe’ hutofautisha kitenzi hiki na פלט huku ikihifadhi ulinganifu wa kishairi.
- source_word: כִּי
  choice: kwa kuwa
  rationale: Kiunganishi hiki kinatoa sababu ya changamoto ya wasemaji.
- source_word: חָפֵץ בּוֹ
  choice: anapendezwa naye
  rationale: Kirai hiki humaanisha kufurahia au kupendezwa na mtu; ‘anapendezwa naye’ ni cha kawaida na huhifadhi maana ya uhusiano.
theological_decisions:
- issue: Kejeli iliyonukuliwa na mabadiliko ya nafsi za kisarufi
  choice: Kudumisha amri ya nafsi ya pili ‘Jikabidhi’ kisha viwakilishi vya nafsi ya tatu ‘amwokoe ... amkomboe ... naye.’
  alternative: Kusawazisha sentensi yote katika nafsi ya tatu, kama ‘Alijikabidhi kwa Yahwe; na amwokoe.’
  rationale: Maandishi ya Kiebrania ya Kimasora yana amri ya nafsi ya pili katika neno la kwanza, lakini yana viambishi vya nafsi ya tatu katika vitenzi vinavyofuata. Tafsiri haifichi mvutano huo wa kisarufi, ambao unaweza kuakisi namna ya kejeli iliyonukuliwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kishairi na sauti ya kejeli vimedumishwa bila kuongeza maelezo ya kimadhehebu.
