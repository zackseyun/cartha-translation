  yaml_path: translation/ot/psalms/022/006.yaml
  text: But I am a worm and not a man[c][b][a], scorned by mankind and despised by the people.
translation:
  language: sw
  text: Lakini mimi ni mnyoo, si mtu; ninadhihakiwa na wanadamu[a] na kudharauliwa na watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa muundo wa karibu zaidi na Kiebrania: “kitu cha fedheha miongoni mwa wanadamu.” Kirai hicho kinaonyesha kwamba msemaji amefanywa kitu cha dharau na wanadamu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Lakini mimi
  rationale: Kiunganishi וְ kinaonyesha utofauti mkali na tumaini lililotangulia, huku אָנֹכִי ikikazia nafsi ya kwanza; “Lakini mimi” huwasilisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: תוֹלַעַת
  choice: funza
  rationale: Neno hili humaanisha kiumbe kama funza au mdudu wa namna ya mnyoo. “Funza” inadumisha picha ya udogo na unyonge bila kuainisha kiumbe kwa undani usiohitajika.
- source_word: וְלֹא אִישׁ
  choice: wala si mtu
  rationale: Kirai hiki kinakana hadhi ya kibinadamu ya msemaji kwa msisitizo. “Wala si mtu” ni cha asili na kinahifadhi utofauti mkali kati ya funza na mtu.
- source_word: חֶרְפַּת
  choice: ninadhihakiwa
  rationale: Nomino hii inaweza kumaanisha fedheha, shutuma au kitu kinachodhihakiwa. Muundo wa kitenzi unaeleza kwa kawaida kwamba msemaji ndiye mlengwa wa dhihaka, huku mbadala wa karibu zaidi na muundo wa Kiebrania ukiwekwa katika tanbihi.
- source_word: אָדָם
  choice: wanadamu
  rationale: Hapa אָדָם ina maana ya wanadamu kwa ujumla, si mwanamume mmoja. “Wanadamu” ni sahihi kijinsia na hutofautiana vya kutosha na עָם, “watu,” katika mshororo unaofuata.
- source_word: וּבְזוּי
  choice: na kudharauliwa
  rationale: Hii ni participio ya hali ya kutendwa inayoonyesha kuchukiwa au kuonekana kuwa mtu asiye na thamani. “Kudharauliwa” ni ya moja kwa moja na inadumisha uzito wa kihisia.
- source_word: עָם
  choice: watu
  rationale: Neno hili linarejelea jamii ya watu kwa pamoja. “Watu” ni tafsiri pana na ya kawaida inayofaa usambamba wa kishairi.
theological_decisions:
- issue: Matumizi ya Kimasihi au ya kiishara katika tafsiri ya Kikristo
  choice: Kutafsiri picha ya Kiebrania ya unyonge na fedheha bila kuongeza maneno ya Kimasihi katika mstari wenyewe.
  alternative: Kutumia tafsiri yenye maelezo yanayotanguliza wazi utimilifu wa Kikristo.
  rationale: Zaburi ya 22 ina umuhimu wa Kimasihi katika Agano Jipya na mapokeo ya Kikristo, lakini mstari huu wenyewe unasema kwa sauti ya mtunga zaburi kwamba amedhalilishwa. Tafsiri inadumisha maana hiyo na kuacha uhusiano wa kikanoni ujitokeze kutokana na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Funza” huhifadhi picha halisi ya Kiebrania; “ninadhihakiwa … na kudharauliwa” huleta usambamba wa asili unaoeleweka kwa msomaji wa kawaida.
