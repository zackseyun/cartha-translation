  text: 'For the choirmaster: according to The Doe of the Dawn[a]. A psalm of David[b].'
translation:
  language: sw
  text: 'Kwa kiongozi wa waimbaji: kwa namna ya “Kulungu Jike wa Mapambazuko”[a]. Zaburi ya Daudi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Paa Jike wa Mapambazuko.” Huenda maneno haya ni jina la wimbo au mpangilio wa muziki.
    reason: lexical_alternative
  - marker: b
    text: “Ya Daudi” yaweza kuonyesha utunzi, uhusiano, mkusanyo, au wakfu; Kiebrania hakibainishi maana moja tu.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa kiongozi wa waimbaji
  rationale: Katika vichwa vya Zaburi neno hili humtaja au humwelekezea kiongozi wa muziki; tafsiri hii ni ya kawaida, wazi, na inahifadhi kazi yake ya kimuziki.
- source_word: עַל
  choice: kwa namna ya
  rationale: Katika maelekezo ya kimuziki neno hili linaweza kutambulisha wimbo, mtindo, au mpangilio wa uimbaji. Kauli hii ni ya asili kwa Kiswahili na haifungi maana kwa ‘kwa sauti ya’ pekee.
- source_word: אַיֶּלֶת הַשַּׁחַר
  choice: “Kulungu Jike wa Mapambazuko”
  rationale: Nomino ya Kiebrania ni ya kike, na kirai huenda ni jina la wimbo au mpangilio wa muziki. Alama za kunukuu zinakitambulisha kama kichwa.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa wimbo wa aina hii katika mkusanyo wa Zaburi.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Muundo wa Kiebrania unaweza kuonyesha utunzi, uhusiano, mkusanyo, au wakfu. ‘Ya Daudi’ huhifadhi upana huo kuliko ‘iliyoandikwa na Daudi’.
theological_decisions:
- issue: Maana ya kirai אַיֶּלֶת הַשַּׁחַר
  choice: Kukitendea kama jina la wimbo au mpangilio wa kimuziki katika kichwa cha Zaburi
  alternative: Kukitafsiri kama kichwa cha mfano kinachoeleza maudhui ya Zaburi
  rationale: Sintaksia ya vichwa vya Zaburi, hasa matumizi ya עַל, inaelekea zaidi kwenye maelekezo ya utendaji wa muziki; tafsiri haipaswi kuingiza maana ya mfano bila ulazima.
- issue: Nguvu ya לְדָוִד katika kichwa
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi; kwa ajili ya Daudi
  rationale: Kihusishi cha Kiebrania kina maana pana, hivyo ‘ya Daudi’ hakidai kwa lazima kwamba Daudi ndiye mwandishi wala hakiondoi uwezekano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa msomaji wa kawaida. ‘Mapambazuko’ hutoa sajili ya kishairi inayofaa kichwa cha wimbo, huku ‘kiongozi wa waimbaji’ ikiwa wazi kuliko istilahi ya kiufundi.
