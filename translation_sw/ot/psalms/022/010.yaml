  yaml_path: translation/ot/psalms/022/010.yaml
  text: Upon you I was cast from the womb[b][a]; from my mother's belly you have been my God.
translation:
  language: sw
  text: Kwako nilitupwa tangu tumboni; tangu tumboni mwa mama yangu, wewe umekuwa Mungu wangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tangu tumboni mwa mama yangu, wewe ni Mungu wangu.” Kishazi cha Kiebrania ni, neno kwa neno, “Mungu wangu wewe,” bila kitenzi kilichotajwa wazi; kinaweza kueleweka kama kauli ya sasa au kama uhusiano unaoendelea tangu kuzaliwa.
    reason: alternative_reading
lexical_decisions:
- source_word: עָלֶיךָ
  choice: Juu yako
  rationale: Inahifadhi taswira ya kuwekwa juu ya Mungu na kumtegemea, badala ya kuifafanua moja kwa moja kuwa kukabidhiwa katika uangalizi wake.
- source_word: הָשְׁלַכְתִּי
  choice: nilitupwa
  rationale: Hali ya kutendwa ya kitenzi שלך inaleta taswira yenye nguvu ya kutupwa au kuwekwa; “nilitupwa” huihifadhi bila kuongeza ufafanuzi.
- source_word: מֵרָחֶם
  choice: tangu tumboni
  rationale: רֶחֶם humaanisha tumbo la uzazi; Kiswahili “tangu tumboni” ni cha asili na huhifadhi picha ya mwanzo wa maisha.
- source_word: מִבֶּטֶן אִמִּי
  choice: tangu ndani ya tumbo la mama yangu
  rationale: בֶּטֶן ni tumbo au sehemu ya ndani ya mwili. “Ndani ya tumbo la mama yangu” huhifadhi tofauti yake na רֶחֶם huku ikiwa wazi kwa msomaji wa kawaida.
- source_word: אֵלִי
  choice: Mungu wangu
  rationale: Nomino אֵל yenye kiambishi cha nafsi ya kwanza ina maana ya moja kwa moja ya “Mungu wangu,” ikihifadhi uhusiano wa kibinafsi.
- source_word: אָתָּה
  choice: wewe umekuwa
  rationale: Kiebrania kina kishazi kisicho na kitenzi, “wewe [ni] Mungu wangu.” Muktadha unaweza kuonyesha uhusiano unaoendelea tangu tumboni, ambao “umekuwa” huwasilisha kwa Kiswahili.
theological_decisions:
- issue: Wakati wa kishazi cha mwisho kisicho na kitenzi
  choice: wewe umekuwa Mungu wangu
  alternative: wewe ni Mungu wangu
  rationale: אֵלִי אָתָּה haina kitenzi kilichotajwa wazi, hivyo inaweza kuwa kauli ya sasa. Muktadha wa mwanzo wa maisha pia unaruhusu uhusiano unaoendelea hadi sasa; tafsiri kuu inaonyesha mwendelezo huo, na tanbihi inadumisha uwezekano wa kauli ya sasa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. “Juu yako nilitupwa” imeachwa ikiwa na ukali wa taswira ya Kiebrania; “tangu tumboni” ni usemi wa kawaida unaoonyesha tumbo la uzazi. Alama ya tanbihi [a] imo katika matini kuu.
