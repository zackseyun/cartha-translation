  text: They will come and declare his righteousness to a people yet to be born[c][b][a], that he has done it.
translation:
  language: sw
  text: Watakuja na kutangaza haki yake[a] kwa watu watakaozaliwa,[b] kwamba amefanya hivyo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uadilifu wake.” Neno la Kiebrania linaweza kumaanisha haki kwa upana, kutia ndani tendo la haki na la kuokoa.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa watu ambao bado hawajazaliwa.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa maana amefanya hivyo.” Kishazi cha mwisho katika Kiebrania ni kifupi na kinaweza kueleweka ama kuwa maudhui yanayotangazwa ama sababu ya tangazo.
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֹאוּ
  choice: Watakuja
  rationale: Kitenzi cha Qal imperfect nafsi ya tatu wingi kinaelekeza kwenye tendo la wakati ujao; “watakuja” ni Kiswahili cha kawaida na huhifadhi mwelekeo huo.
- source_word: וְיַגִּידוּ
  choice: na kutangaza
  rationale: Hiphil imperfect ya נגד humaanisha kujulisha au kutangaza. “Kutangaza” linafaa kwa sauti ya ushuhuda wa hadharani katika zaburi.
- source_word: צִדְקָתוֹ
  choice: haki yake
  rationale: צדקה linaweza kumaanisha uadilifu, haki, na pia tendo la haki linalookoa. “Haki yake” huhifadhi upana huo bila kuufanya useme wazi zaidi ya Kiebrania.
- source_word: לְעַם
  choice: kwa watu
  rationale: לְ huonyesha wapokeaji wa tangazo. Katika Kiswahili, “kwa watu” ni muundo wa kawaida; “watu” hapa ni jamii au kizazi cha baadaye, si lazima kundi lililotajwa kabla.
- source_word: נוֹלָד
  choice: watakaozaliwa
  rationale: Participio tendwa ya ילד humfafanua huyo ‘watu’ kwa mtazamo wa wakati ujao. Kishazi “watakaozaliwa” ni cha asili na huhifadhi maana ya kizazi ambacho bado hakijazaliwa.
- source_word: כִּי
  choice: kwamba
  rationale: כִּי inaweza kuanzisha maudhui yanayotangazwa; “kwamba” huonyesha usomaji huo huku uwezekano wa maana ya sababu ukihifadhiwa katika tanbihi.
- source_word: עָשָׂה
  choice: yeye amefanya hivyo
  rationale: Qal perfect ya עשה ni ‘amefanya.’ Kiebrania hakitaji yambwa; “hivyo” hutoa Kiswahili kinachoeleweka huku kikihifadhi ufupi na mkazo wa tamati.
theological_decisions:
- issue: Maana ya צִדְקָתוֹ katika zaburi hii
  choice: haki yake
  alternative: uadilifu wake; tendo lake la haki linalookoa
  rationale: Neno la Kiebrania lina upana unaoweza kuhusisha tabia ya haki na matendo ya haki au wokovu. “Haki yake” halipunguzi mvutano huo kuwa maana moja tu.
- issue: Kazi ya kishazi cha mwisho כִּי עָשָׂה
  choice: kwamba yeye amefanya hivyo
  alternative: kwa maana yeye amefanya hivyo
  rationale: Kishazi cha Kiebrania ni kifupi sana na kinaweza kuwa maudhui ya tangazo au sababu yake. Maandishi makuu yanakichukua kama maudhui, na tanbihi inahifadhi usomaji wa sababu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kutangaza” hudumisha sauti ya hadharani ya zaburi; “watakaozaliwa” ni ya kawaida zaidi kuliko tafsiri nzito ya neno kwa neno. Viwakilishi vimetumiwa kwa kiasi ili mstari ubaki wazi na wa kishairi.
