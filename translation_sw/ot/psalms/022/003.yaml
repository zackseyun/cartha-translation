  text: Yet you are holy[a], enthroned on the praises of Israel.
translation:
  language: sw
  text: 'Lakini wewe ni mtakatifu,

    umeketi juu ya sifa za Israeli.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lakini wewe ni mtakatifu, unayekaa katika sifa za Israeli.” Kitenzi kishirikishi cha Kiebrania kinaweza kumaanisha “kuketi” au “kukaa”; katika muktadha huu wa kishairi, “umeketi juu ya” hudokeza taswira ya kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Lakini wewe
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha tofauti na maombolezo yaliyotangulia; “Lakini wewe” ni ya kawaida na huhifadhi usemi wa moja kwa moja.
- source_word: קָדוֹשׁ
  choice: mtakatifu
  rationale: Hili ndilo neno la kawaida na lenye hadhi kwa utakatifu wa Mungu, bila kulipunguza kuwa tu ‘aliyetengwa.’
- source_word: יֹשֵׁב
  choice: umevikwa enzi juu ya
  rationale: Ingawa kitenzi kishirikishi kinaweza kumaanisha kuketi au kukaa, kinapotumiwa kumhusu Mungu hapa kinaweza kuleta taswira ya kifalme ya kuketi katika enzi. Kauli hii huhifadhi taswira hiyo kwa Kiswahili cha kawaida.
- source_word: תְּהִלּוֹת
  choice: sifa
  rationale: Katika Kiswahili ‘sifa’ linaweza kuwa na maana ya wingi kulingana na muktadha na linawakilisha maonyesho ya kumsifu Mungu kwa ufasaha.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili sanifu cha Biblia.
theological_decisions:
- issue: Maana ya יֹשֵׁב תְּהִלּוֹת יִשְׂרָאֵל
  choice: Mungu anaonyeshwa kwa taswira ya kifalme akiwa amevikwa enzi juu ya sifa za Israeli.
  alternative: Mungu anakaa katikati ya sifa za Israeli.
  rationale: Kiebrania huruhusu maana ya kuketi au kukaa, huku muktadha wa kishairi ukifaa taswira ya kifalme. Tafsiri kuu huhifadhi taswira hiyo, na tanbihi huhifadhi uwezekano wa maana nyingine bila kuondoa utata halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi, lugha ya sasa yenye hadhi, na taswira ya Kiebrania iliyohifadhiwa.
