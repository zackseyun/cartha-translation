base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/021.yaml
  text: Save me from the mouth of the lion[b][a], and from the horns of the wild oxen—you have answered me.
translation:
  language: sw
  text: Uniokoe kutoka kinywani mwa simba, na kutoka katika pembe za ng’ombe wa mwituni[a]—umenijibu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mafahali wa mwituni”; Kiebrania kinarejelea wanyama wa jamii ya ng’ombe wa porini wenye nguvu.
    reason: lexical_alternative
  - marker: b
    text: 'Kishazi cha mwisho kinaweza kueleweka kuwa tamko la ghafla kwamba sala imejibiwa: “umenijibu,” likionyesha badiliko kutoka ombi kwenda uhakika. Wengine hulihusisha kwa karibu zaidi na ombi lililotangulia.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹשִׁיעֵנִי
  choice: Uniokoe
  rationale: Hifili ya amri yenye kiambishi cha nafsi ya kwanza umoja ni ombi la moja kwa moja la kuokolewa; “Uniokoe” ni ya kawaida, yenye hadhi, na huhifadhi uharaka wa ombi.
- source_word: מִפִּי
  choice: kutoka kinywani mwa
  rationale: Hutafsiri picha halisi ya Kiebrania, “kutoka katika kinywa cha,” bila kuibadili kuwa “mataya.”
- source_word: אַרְיֵה
  choice: simba
  rationale: Nomino ya umoja isiyo na kibainishi inawakilisha simba kama hatari ya kishairi; Kiswahili hakihitaji makala.
- source_word: וּמִקַּרְנֵי
  choice: na kutoka katika pembe za
  rationale: Huendeleza ombi kwa hatari ya pili na kuhifadhi picha thabiti ya pembe.
- source_word: רֵמִים
  choice: ng’ombe-mwitu
  rationale: Neno hili hurejelea ng’ombe wa porini mwenye nguvu. “Ng’ombe-mwitu” linaeleweka kwa urahisi zaidi kuliko jina la kitaalamu la mnyama huyo na halifuati tafsiri ya kimapokeo ya “nyati wa pembe moja.”
- source_word: עֲנִיתָנִי
  choice: wewe umenijibu
  rationale: Kitenzi timilifu cha nafsi ya pili ya kiume umoja chenye kiambishi cha nafsi ya kwanza humaanisha “umenijibu.” Kiwakilishi “wewe” kinakazia badiliko la ghafla kutoka ombi hadi uhakika.
theological_decisions:
- issue: Iwapo עֲנִיתָנִי ni mwendelezo wa ombi au tamko kwamba sala imejibiwa
  choice: 'Tamko: “wewe umenijibu”'
  alternative: Kulihusisha na ombi lililotangulia, kwa maana ya “uniokoe/unijibu kutoka katika pembe za ng’ombe-mwitu”
  rationale: Umbo la Kiebrania ni kitenzi timilifu, si amri. Tamko la ghafla la kujibiwa linaendana na hatua ya kishairi kutoka maombi ya kuokolewa kwenda sifa, huku tanbihi ikihifadhi uwezekano wa uelewa mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na picha za “kinywa,” “simba,” na “pembe” zimehifadhiwa. Dashibodi inaonyesha badiliko la ghafla kutoka kilio cha kuokolewa hadi tamko la kujibiwa.
