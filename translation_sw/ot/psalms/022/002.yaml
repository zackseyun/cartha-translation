base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/002.yaml
  text: My God[a], I cry out by day, but you do not answer, and by night[b], but I have no rest.
translation:
  language: sw
  text: Mungu wangu, ninakulilia mchana, lakini hunijibu; na usiku sina utulivu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “na usiku sinyamazi.” Kiebrania kwa uhalisi: “na hakuna ukimya kwangu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Nomino ina kiambishi cha nafsi ya kwanza umoja na hapa ni mwito wa moja kwa moja kwa Mungu; “Mungu wangu” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: אֶקְרָא
  choice: ninakulilia
  rationale: Katika maombolezo, kitenzi קרא kina maana ya kumwita Mungu kwa kilio cha kuomba msaada. “Ninakulilia” huonyesha walengwa na uzito wa ombi bila kuongeza maneno mengi.
- source_word: יוֹמָם
  choice: mchana
  rationale: Ni kielezi cha wakati kinachomaanisha “mchana,” na kinaendana kwa usawa na “usiku” katika mstari unaofuata.
- source_word: וְלֹא תַעֲנֶה
  choice: lakini hunijibu
  rationale: 'Ingawa וְ inaweza kuwa “na,” hapa muktadha wa malalamiko unaonyesha utofautishaji: analia, lakini hapati jibu. Wakati wa sasa wa mazoea unaafiki tendo linaloendelea.'
- source_word: וְלַיְלָה
  choice: na usiku
  rationale: Huhifadhi kiunganishi na ulinganifu wa kishairi kati ya mchana na usiku.
- source_word: וְלֹא דֽוּמִיָּה לִי
  choice: sinyamazi
  rationale: דומיה humaanisha ukimya au utulivu. Muundo “sinyamazi” ni wa asili katika Kiswahili na unaweza kueleza kwamba kilio cha mwombaji hakiishi, bila kuugeuza moja kwa moja kuwa “sipati pumziko.”
theological_decisions:
- issue: Maana ya kishazi cha mwisho וְלֹא דֽוּמִיָּה לִי
  choice: Mwombaji hanyamazi usiku, yaani anaendelea kulia kwa Mungu.
  alternative: Sipati pumziko; au hakuna utulivu kwangu.
  rationale: Nomino דומיה kimsingi ni “ukimya/utulivu,” na muundo wa Kiebrania ni mfupi na wenye uwezekano zaidi ya mmoja. Matini kuu inatumia Kiswahili cha asili kinachodumisha picha ya kutokunyamaza, huku tanbihi ikihifadhi uwezekano wa maana ya kutopata utulivu au pumziko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Alama ya nusu koloni inaweka wazi ulinganifu wa kishairi kati ya mchana na usiku. Tanbihi huhifadhi utata halisi wa דומיה bila kuufanya mstari mkuu kuwa mgumu.
