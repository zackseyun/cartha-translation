  text: וְ/אַתָּ֣ה יְ֭הוָה אַל תִּרְחָ֑ק אֱ֝יָלוּתִ֗/י לְ/עֶזְרָ֥תִ/י חֽוּשָׁ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/019.yaml
  text: But you[a], O Yahweh, do not be far away; O my strength[b], hurry to help me.
translation:
  language: sw
  text: Lakini wewe, Ee Yahweh, usiwe mbali; ee nguvu zangu,[a] fanya haraka kunisaidia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “nguvu zangu.” Neno hili pia limeeleweka na baadhi kuwa “msaada wangu,” au, kwa uwezekano mdogo hapa, kwa maana halisi inayohusiana na paa jike.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Lakini wewe
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha utofautishaji wenye nguvu na dhiki iliyotangulia; “Lakini wewe” ni ya kawaida na yenye msisitizo katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa konsonanti nne limehifadhiwa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: אַל תִּרְחָק
  choice: usiwe mbali
  rationale: Kauli hii ya ombi lililokanushwa inaomba Mungu asiwe katika umbali; tafsiri hii ni ya moja kwa moja na ya kawaida.
- source_word: אֱיָלוּתִי
  choice: nguvu zangu
  rationale: Katika muktadha neno linaeleweka vizuri kama nguvu au uwezo wa mwombaji, ingawa umbo lake lina utata wa kileksika unaostahili kuhifadhiwa katika tanbihi.
- source_word: לְעֶזְרָתִי
  choice: kunisaidia
  rationale: Huwasilisha kwa Kiswahili cha kawaida mwelekeo au kusudi la kishazi, yaani kuja kwa ajili ya msaada wa mwombaji.
- source_word: חוּשָׁה
  choice: fanya haraka
  rationale: Amri hiyo inaonyesha uharaka; “fanya haraka” ni wazi, ya sasa, na yenye hadhi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; kulinakili kama “Yahweh” kunalihifadhi bila kulibadilisha kuwa cheo.
- issue: Maana ya אֱיָלוּתִי
  choice: nguvu zangu
  alternative: msaada wangu; au maana halisi inayohusiana na paa jike
  rationale: “Nguvu zangu” inafaa muktadha wa ombi la kuokolewa na inadumisha kumwita Mungu chanzo cha nguvu, huku utata halisi wa neno ukielezwa katika tanbihi badala ya kutatuliwa kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sala na uharaka wa ombi vimehifadhiwa bila kutumia lugha ya kizamani.
