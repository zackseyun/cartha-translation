lexical_decisions:
- source_word: כָּל רֹאַי
  choice: Wote wanaoniona
  rationale: Kifungu hiki humaanisha kwa ujumla ‘wote wanaoniona.’ Muundo huu ni wa kawaida katika Kiswahili na unadumisha wingi wa Kiebrania.
- source_word: יַלְעִגוּ לִי
  choice: hunidhihaki
  rationale: Kitenzi לעג hapa huonyesha kumfanyia msemaji mzaha wa kumdharau. ‘Hunidhihaki’ ni wazi, cha sasa, na chenye hadhi.
- source_word: יַפְטִירוּ בְשָׂפָה
  choice: hunikunjia midomo kwa dharau[a]
  rationale: Nahau ya Kiebrania inaeleza ishara ya mdomo inayoonyesha dharau, lakini maana halisi ya kitenzi katika nahau hii si hakika kabisa. Kiswahili hiki kinaweka picha ya uso na dharau bila kuifanya kuwa kauli ya maneno tu.
- source_word: יָנִיעוּ רֹאשׁ
  choice: hutikisa vichwa vyao[b]
  rationale: Hii ni ishara ya kichwa inayoonyesha kejeli au dharau. Wingi ‘vichwa vyao’ unasikika kwa kawaida katika Kiswahili kwa kundi la watu.
theological_decisions:
- issue: Matumizi ya Kimasihi katika tafsiri ya baadaye ya Kikristo
  choice: Kutafsiri mstari kwanza katika muktadha wa zaburi kama maneno ya mtunga-zaburi anayeteseka, bila kuongeza lugha ya Kikristo isiyomo wazi katika Kiebrania.
  alternative: Msomaji anaweza kutambua mwangwi wa mstari huu katika simulizi za mateso ya Yesu katika Injili.
  rationale: Tafsiri inapaswa kuwakilisha maandishi ya Kiebrania yenyewe huku tanbihi ikiruhusu kutambua matumizi yake ya baadaye bila kulazimisha maana hiyo ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Vitenzi vya mazoea (‘hunidhihaki,’ ‘hunikunjia,’ ‘hutikisa’) vinaonyesha vitendo vinavyofanywa na wote wanaomwona msemaji. Taswira za uso na kichwa zimehifadhiwa kwa lugha inayoeleweka kwa wasomaji wa kawaida.
