base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/023.yaml
  text: You who fear Yahweh[a], praise him! All offspring of Jacob, honor him! Stand in awe of him, all offspring of Israel!
translation:
  language: sw
  text: 'Enyi mnaomcha Yahweh, msifuni!


    Uzao wote wa Yakobo, mheshimuni!


    Mwogopeni kwa kicho[a], enyi uzao wote wa Israeli!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mcheni” au “mcheni kwa kicho.” Kitenzi cha Kiebrania kinaonyesha hofu yenye kicho.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי יְהוָה
  choice: Enyi mnaomcha Yahwe
  rationale: Kirai hiki kinawataja watu wenye sifa ya kumcha Yahwe. “Enyi” huonyesha wazi kuwa ni mwito wa moja kwa moja, na “kumcha” huweza kubeba maana ya hofu yenye heshima.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo; “Yahwe” ni umbo la kawaida na linalosomeka kwa Kiswahili.
- source_word: הַלְלוּהוּ
  choice: msifuni
  rationale: Ni amri kwa wingi yenye kiambishi cha nafsi ya tatu umoja, yaani, kumsifu yeye anayerejelewa, Yahwe.
- source_word: כָּל זֶרַע יַעֲקֹב
  choice: Uzao wote wa Yakobo
  rationale: זֶרַע ni nomino ya kijumla hapa. “Uzao wote” huhifadhi wazo la jamii nzima inayotokana na Yakobo na inasikika kwa kawaida katika ushairi wa Kiswahili.
- source_word: כַּבְּדֻהוּ
  choice: mheshimuni
  rationale: Amri hii inadai kumpa Mungu heshima inayomstahili. “Mheshimuni” ni fupi, wazi, na haiongezi ufafanuzi usiokuwamo katika neno la Kiebrania.
- source_word: וְגוּרוּ מִמֶּנּוּ
  choice: Mwogopeni kwa kicho
  rationale: Kitenzi גור pamoja na מִן hapa huonyesha hofu nzito mbele za Mungu. “Kwa kicho” huzuia kauli hiyo kueleweka kama woga wa kawaida tu, bila kuondoa uzito wake wa kutisha.
- source_word: כָּל זֶרַע יִשְׂרָאֵל
  choice: enyi uzao wote wa Israeli
  rationale: “Uzao wote” hudumisha ulinganifu na mstari unaotaja uzao wa Yakobo; “enyi” hudhihirisha nguvu ya mwito wa moja kwa moja.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ina jina la agano la Mungu moja kwa moja. Kulitaja kama “Yahwe” huhifadhi hadhi yake kama jina binafsi badala ya kuliwakilisha kwa cheo.
- issue: Maana ya hofu katika וְגוּרוּ מִמֶּנּוּ
  choice: Mwogopeni kwa kicho
  alternative: Mcheni; mheshimuni kwa kicho; tetemekeni mbele zake
  rationale: Tafsiri hii huhifadhi mvutano kati ya hofu na heshima uliomo katika amri hiyo. Pia haitawanyi maana hiyo kuwa heshima isiyo na woga wala kuifanya kuwa hofu tupu isiyo na ibada.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya “uzao wote” yamehifadhiwa ili kuonyesha ulinganifu wa Yakobo na Israeli; alama ya tanbihi imewekwa kwenye kirai inachokifafanua.
