base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/027.yaml
  text: All the ends of the earth will remember and return to Yahweh[b][a], and all the families of the nations will bow down before you.
translation:
  language: sw
  text: Miisho yote ya dunia itakumbuka na kumrudia Yahwe[b], na jamaa zote za mataifa zitainama[a] mbele zako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zitaabudu mbele zako.” Kitenzi cha Kiebrania humaanisha hasa kujishusha au kuinama, mara nyingi kama tendo la ibada.
    reason: lexical_alternative
  - marker: b
    text: “Yahwe” ni jina la Mungu linalowakilishwa kwa herufi YHWH katika Kiebrania.
    reason: alternative_reading
lexical_decisions:
- source_word: יִזְכְּרוּ
  choice: itakumbuka
  rationale: Kitenzi hiki ni Qal imperfect, nafsi ya tatu wingi, chenye maana ya kukumbuka; hapa kina nguvu ya wakati ujao katika maono ya mwitikio wa dunia nzima.
- source_word: וְיָשֻׁבוּ
  choice: na kumrudia
  rationale: שׁוב pamoja na אֶל huonyesha kurudi au kumgeukia mtu. “Kumrudia” huhifadhi wazo la kurudi kwa Yahwe bila kulifafanua kupita kiasi kuwa toba ya ndani pekee.
- source_word: אֶל יְהוָה
  choice: kwa Yahwe
  rationale: אֶל huonyesha mwelekeo wa kurudi, na jina la Mungu יְהוָה limetoholewa kuwa “Yahwe.” Katika sentensi, maana hii imewasilishwa kwa umbo la asili la Kiswahili “kumrudia Yahwe.”
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: miisho yote ya dunia
  rationale: Hii ni nahau inayotaja sehemu za mbali kabisa za dunia na hivyo kuonyesha upeo wa ulimwengu wote; tafsiri ya moja kwa moja inabaki wazi na yenye hadhi katika Kiswahili.
- source_word: וְיִשְׁתַּחֲווּ
  choice: zitainama
  rationale: Kitenzi kinamaanisha kujishusha au kuinama mbele ya mwingine kwa heshima au ibada. “Zitainama” huhifadhi tendo halisi huku muktadha ukibeba maana ya ibada.
- source_word: לְפָנֶיךָ
  choice: mbele zako
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili ya kuwasilisha maana ya “mbele ya uso wako,” na inadumisha usemi wa moja kwa moja kwa Mungu.
- source_word: כָּל מִשְׁפְּחוֹת גּוֹיִם
  choice: jamaa zote za mataifa
  rationale: מִשְׁפְּחוֹת hurejelea vikundi vya kifamilia au koo, na גּוֹיִם ni mataifa au makundi ya watu. “Jamaa” ni neno linaloeleweka kwa urahisi bila kuingiza maana maalumu ya baadaye ya “Mataifa.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יְהוָה moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Iwapo וְיִשְׁתַּחֲווּ itafsiriwe wazi kuwa kuabudu
  choice: zitainama
  alternative: zitaabudu au zitasujudu
  rationale: Neno la Kiebrania linaonyesha tendo la kimwili la kujishusha kwa heshima, ambalo katika muktadha huu ni tendo la ibada. Tafsiri iliyochaguliwa huhifadhi picha hiyo bila kuondoa maana ya ibada.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unahifadhi taswira ya Kiebrania ya “miisho ya dunia” na tendo la kuinama, huku “kumrudia” likisomeka kwa kawaida na kuonyesha mwelekeo kuelekea kwa Yahwe.
