base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/028.yaml
  text: For the kingdom belongs to Yahweh[b][a], and he rules over the nations.
translation:
  language: sw
  text: Kwa maana ufalme[a] ni wa Yahweh, naye anatawala juu ya mataifa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utawala wa kifalme ni wa Yahweh,” au “utawala ni wa Yahweh.” Neno la Kiebrania linaweza kumaanisha ufalme, mamlaka ya kifalme, au utawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha sababu au msingi wa kauli iliyotangulia; “Kwa maana” huhifadhi nguvu hiyo ya kisababishi kwa Kiswahili cha kawaida.
- source_word: לַיהוָה
  choice: ni wa Yahweh
  rationale: Kihusishi ל־ hapa kinaonyesha umiliki. Muundo “ufalme ni wa Yahweh” ni wa asili katika Kiswahili na huwasilisha kwamba mamlaka ya kifalme ni yake.
- source_word: הַמְּלוּכָה
  choice: ufalme
  rationale: Neno מְלוּכָה linaweza kumaanisha ufalme, ukuu wa kifalme, au utawala. “Ufalme” ni wazi na wa kawaida, huku tanbihi ikihifadhi maana nyingine halali.
- source_word: וּמֹשֵׁל
  choice: naye anatawala
  rationale: Kitenzi-jina cha Kiebrania kinaeleza hali inayoendelea au ukweli wa kudumu. “Anatawala” huwasilisha maana hiyo kwa Kiswahili cha asili; “naye” humrejelea Yahweh.
- source_word: בַּגּוֹיִם
  choice: juu ya mataifa
  rationale: Pamoja na משל, kihusishi ב־ huonyesha wale walio chini ya utawala. “Juu ya mataifa” huonyesha utawala wa Yahweh kwa mataifa yote bila kuingiza utofautishaji wa baadaye wa kidini.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano YHWH moja kwa moja. “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Wigo wa maana wa מְלוּכָה
  choice: ufalme
  alternative: ufalme wa kifalme; utawala; mamlaka ya kifalme
  rationale: “Ufalme” ni neno linaloeleweka kwa urahisi na linaweza kuonyesha milki au mamlaka ya kutawala. Kwa kuwa Kiebrania pia kinaweza kusisitiza ukuu au utawala wa kifalme, uwezekano huo umeonyeshwa katika tanbihi badala ya kutatuliwa kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Jina “Yahweh” limehifadhiwa, na maana mbalimbali za מְלוּכָה zimeonyeshwa kwa tanbihi.
