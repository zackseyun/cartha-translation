source:
  edition: WLC
  text: אַל תִּרְחַ֣ק מִ֭מֶּ/נִּי כִּי צָרָ֣ה קְרוֹבָ֑ה כִּי אֵ֥ין עוֹזֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/011.yaml
  text: Do not be far from me[a], for trouble is near, for there is no helper.
translation:
  language: sw
  text: 'Usiwe mbali nami,

    kwa maana dhiki[a] iko karibu,

    kwa maana hakuna wa kusaidia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “taabu” au “mateso.” Neno la Kiebrania linaweza kumaanisha dhiki, taabu, au mateso.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּרְחַק
  choice: Usiwe mbali
  rationale: 'Kikanushi אַל pamoja na kitenzi רחק kinaonyesha ombi la kusihi: mtu asiwe mbali. Tafsiri hii inadumisha taswira ya umbali bila kuongeza wazo lenye nguvu zaidi la kuachwa.'
- source_word: מִמֶּנִּי
  choice: nami
  rationale: Kiambishi מן chenye kiwakilishi cha nafsi ya kwanza umoja humaanisha ‘kutoka kwangu.’ Katika Kiswahili, ‘mbali nami’ ni usemi wa kawaida na wa kishairi unaowasilisha maana hiyo kwa ufasaha.
- source_word: כִּי
  choice: kwa maana
  rationale: Katika sehemu zote mbili, כִּי inatoa sababu ya ombi. Kurudia ‘kwa maana’ kunahifadhi muundo na msisitizo wa Kiebrania.
- source_word: צָרָה
  choice: dhiki
  rationale: Nomino hii inaweza kumaanisha taabu, dhiki, au mateso. ‘Dhiki’ ni neno la kawaida lenye uzito unaofaa kwa kilio hiki bila kubainisha aina ya hali hiyo.
- source_word: קְרוֹבָה
  choice: iko karibu
  rationale: Kivumishi hiki kinatumika kama kiarifu na kuonyesha ukaribu wa dhiki. ‘Iko karibu’ ni Kiswahili cha asili na kinahifadhi hisia ya hatari iliyo karibu.
- source_word: אֵין עוֹזֵר
  choice: hakuna wa kusaidia
  rationale: אֵין hukana kuwapo, na עוֹזֵר ni umbo la kitenzi linalotumiwa kama nomino, ‘anayesaidia.’ ‘Hakuna wa kusaidia’ ni usemi wa kawaida unaodumisha maana ya mtu wa kutoa msaada.
theological_decisions:
- issue: Lugha ya umbali wa Mungu katika kilio
  choice: Usiwe mbali nami
  alternative: Usiniache
  rationale: Kiebrania kinatumia taswira ya mahali, yaani kuwa mbali na mtu. ‘Usiniache’ lingeongeza dai lenye nguvu zaidi kuliko lililo wazi katika maandishi; tafsiri iliyochaguliwa inadumisha mvutano wa kilio hicho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini rahisi kueleweka. Mistari mitatu inadumisha vipashio vya shairi na urudiaji wa כִּי. Alama ya tanbihi imewekwa baada ya neno linalohusika, ‘dhiki.’
