  text: יֹאכְל֬וּ עֲנָוִ֨ים וְ/יִשְׂבָּ֗עוּ יְהַֽלְל֣וּ יְ֭הוָה דֹּ֣רְשָׁ֑י/ו יְחִ֖י לְבַבְ/כֶ֣ם לָ/עַֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/026.yaml
  text: The afflicted will eat and be satisfied[a]; those who seek him will praise Yahweh[c][b]. May your hearts live forever.
translation:
  language: sw
  text: Wanaoteseka[a] watakula na kushiba[b]; wanaomtafuta watamsifu Yahweh. Moyo wenu na uishi milele.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanyenyekevu,” “maskini,” “wanyonge,” au “wapole.”
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha wa zaburi hii, kula huku huenda kukarejelea karamu ya dhabihu au ya kutimiza nadhiri, ingawa mstari huu hausemi hivyo wazi.
    reason: cultural_note
  - marker: c
    text: 'Kiebrania kinasema kihalisi “moyo wenu”: “moyo” ni umoja, lakini “wenu” linawaelekezea watu wengi; huenda huu ni umoja wa kijumla unaomaanisha maisha ya ndani ya jamii nzima.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָוִים
  choice: wanaoteseka
  rationale: Neno hili linaweza kumaanisha watu walioteswa, wanyenyekevu, maskini, au wapole. Katika muktadha wa mateso na ukombozi wa zaburi hii, “wanaoteseka” linaonyesha vizuri watu walioshushwa ambao sasa wanashiriki katika riziki ya Mungu, bila kulifanya neno lihusu tabia ya unyenyekevu pekee.
- source_word: יֹאכְלוּ וְיִשְׂבָּעוּ
  choice: watakula na kushiba
  rationale: Vitenzi vya Kiebrania vinaeleza tendo la wakati ujao katika muktadha huu. “Kushiba” ni Kiswahili cha kawaida kinachoonyesha kula mpaka kutosheka.
- source_word: יְהַלְלוּ יְהוָה
  choice: watamsifu Yahwe
  rationale: “Watamsifu” linaonyesha mwitikio wa ibada, na “Yahwe” linahifadhi jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania.
- source_word: דֹּרְשָׁיו
  choice: wanaomtafuta
  rationale: Kiambishi cha Kiebrania kinamrejelea Yahwe. Tafsiri hii ni ya kawaida na inahifadhi maana ya watu wanaoendelea kumwelekea na kumtafuta Mungu.
- source_word: יְחִי לְבַבְכֶם לָעַד
  choice: Mioyo yenu na iishi milele
  rationale: Kitenzi kinatumika kama ombi au baraka, si taarifa tu. Ingawa Kiebrania kinasema kihalisi “moyo wenu” kwa umoja wa kijumla pamoja na kiambishi cha nafsi ya pili wingi, “mioyo yenu” ni Kiswahili cha asili zaidi na kinahifadhi wazi kwamba jamii nzima inaambiwa.
theological_decisions:
- issue: Maana ya kula na kushiba
  choice: Kutaja kula na kushiba bila kufafanua aina ya mlo katika matini kuu
  alternative: Kusema wazi kwamba ni karamu ya dhabihu au ya kutimiza nadhiri
  rationale: Muktadha mpana unaweza kudokeza karamu ya dhabihu au ya nadhiri, lakini mstari wenyewe hausemi hivyo wazi. Tafsiri kuu haipaswi kuongeza jambo hilo kama hakika.
- issue: Mabadiliko ya msemaji kwenda kwa nafsi ya pili katika kishazi cha mwisho
  choice: 'Kuhifadhi baraka inayoelekezwa moja kwa moja kwa jamii: “Mioyo yenu na iishi milele”'
  alternative: “Mioyo yao itaishi milele”
  rationale: Kiambishi cha Kiebrania ni cha nafsi ya pili wingi; hivyo mstari unawageukia moja kwa moja wale wanaomtafuta Yahwe na kuwabariki.
- issue: Umoja wa kijumla wa “moyo”
  choice: Kutumia wingi wa asili wa Kiswahili katika matini kuu na kueleza umbo la Kiebrania katika tanbihi
  alternative: “Moyo wenu na uishi milele”
  rationale: Kiebrania kina nomino ya umoja yenye maana ya kijumla, lakini Kiswahili sanifu hueleweka kwa urahisi zaidi kwa kutumia “mioyo yenu” kwa kundi la watu, bila kubadili maana ya baraka.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi bila kuwa kigumu. “Na iishi” linahifadhi sauti ya ombi au baraka, huku sentensi nyingine zikitumia wakati ujao kwa urahisi na uwazi.
