  text: יָ֘בֵ֤שׁ כַּ/חֶ֨רֶשׂ כֹּחִ֗/י וּ֭/לְשׁוֹנִ/י מֻדְבָּ֣ק מַלְקוֹחָ֑/י וְֽ/לַ/עֲפַר מָ֥וֶת תִּשְׁפְּתֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/015.yaml
  text: My strength is dried up like a potsherd[a], and my tongue sticks to my jaws; you lay me in the dust of death.
translation:
  language: sw
  text: Nguvu zangu zimekauka kama kipande cha chungu, na ulimi wangu umeshikamana na taya zangu;[a] nawe umeniweka katika mavumbi ya mauti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulimi wangu umeshikamana na kaakaa langu.” Maana ya neno la Kiebrania linalotaja sehemu ya kinywa haina uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֵשׁ
  choice: zimekauka
  rationale: Kitenzi kinaonyesha hali ya kukauka au kunyauka; ‘zimekauka’ ni usemi wa kawaida kwa nguvu za mwili zilizokwisha.
- source_word: כַּחֶרֶשׂ
  choice: kama kipande cha chungu
  rationale: חֶרֶשׂ hapa inaelekea kumaanisha kipande cha chombo cha udongo kilichovunjika. ‘Kipande cha chungu’ ni wazi na hudumisha picha ya kitu kikavu na kinachoweza kuvunjika kwa urahisi.
- source_word: כֹּחִי
  choice: nguvu zangu
  rationale: Neno linamaanisha nguvu au uhai wa mwili. Kiswahili cha kawaida hutumia ‘nguvu zangu’ ingawa Kiebrania kina kiambishi cha nafsi ya kwanza umoja.
- source_word: וּלְשׁוֹנִי
  choice: na ulimi wangu
  rationale: Ni rejeo la moja kwa moja kwa kiungo cha mwili, hivyo halihitaji kufafanuliwa kwa maneno mengine.
- source_word: מֻדְבָּק
  choice: umeshikamana
  rationale: Umbo la kutendwa linaeleza hali ya kitu kilichogandishwa au kushikamana; ‘umeshikamana’ hudumisha picha ya athari ya kiu kali.
- source_word: מַלְקוֹחָי
  choice: na taya zangu
  rationale: Neno la Kiebrania ni gumu na sehemu hususa ya kinywa haijulikani kwa uhakika. ‘Taya zangu’ linafuata maana inayowezekana, huku ‘kaakaa langu’ likihifadhiwa katika tanbihi kama tafsiri mbadala.
- source_word: וְלַעֲפַר
  choice: katika mavumbi
  rationale: Kihusishi ל־ kinaweza kuonyesha kuelekea mahali au kuwekwa humo. ‘Katika mavumbi’ ni Kiswahili cha kawaida pamoja na kitenzi ‘umeniweka’.
- source_word: מָוֶת
  choice: ya mauti
  rationale: Muundo ‘mavumbi ya mauti’ hudumisha uhusiano wa kishairi wa maneno hayo bila kuufasiri moja kwa moja kuwa kaburi.
- source_word: תִּשְׁפְּתֵנִי
  choice: umeniweka
  rationale: Kitenzi kinamaanisha kuweka au kupanga mahali, ni nafsi ya pili ya kiume umoja, na kina kiambishi cha mtendwa cha nafsi ya kwanza umoja. ‘Umeniweka’ hudumisha usemi wa moja kwa moja kwa Mungu na hali iliyotokea inayomkabili msemaji sasa.
theological_decisions:
- issue: Mtendaji katika kishazi cha mwisho
  choice: 'Usemi wa moja kwa moja kwa Mungu: ‘nawe umeniweka katika mavumbi ya mauti.’'
  alternative: Usemi usiotaja mtendaji, kama ‘nimewekwa katika mavumbi ya mauti.’
  rationale: 'Kitenzi cha Kiebrania ni nafsi ya pili ya kiume umoja chenye mtendwa wa nafsi ya kwanza umoja, kwa hiyo kwa kawaida kinamwelekea Mungu moja kwa moja ndani ya sala ya zaburi. Tafsiri hii inadumisha mvutano wa kiteolojia: mwenye kuteseka anahusisha hali yake mbaya sana na tendo la Mungu bila kueleza uhusiano kati ya tendo hilo na matendo ya maadui wa kibinadamu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na ya kishairi. ‘Kipande cha chungu’ kimechaguliwa badala ya istilahi adimu ili picha ya chombo cha udongo kilichovunjika ieleweke kwa msomaji wa kawaida; ‘mauti’ hudumisha uzito wa kishairi wa mstari.
