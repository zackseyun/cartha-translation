    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפֵּר
  choice: Naweza kuihesabu
  rationale: Piel ya ספר inaweza kumaanisha ‘kuhesabu’ au ‘kusimulia.’ Kwa kuwa yambwa ni ‘mifupa yangu yote,’ maana ya kuhesabu mmoja mmoja ndiyo inayofaa zaidi; ‘naweza kuihesabu’ huonyesha kwa Kiswahili hali inayomwezesha mwombolezaji kuona au kuhisi mifupa yake waziwazi.
- source_word: כָּל
  choice: yote
  rationale: Inahifadhi wazo la ujumla kamili katika Kiebrania na inapatanishwa kisarufi na ‘mifupa.’
- source_word: עַצְמוֹתָי
  choice: mifupa yangu
  rationale: Tafsiri ya moja kwa moja inadumisha taswira kali ya mateso ya mwili bila kuongeza ufafanuzi usiotajwa.
- source_word: הֵמָּה
  choice: wao
  rationale: Kiwakilishi huru chenye msisitizo kinaelekezwa kwa watazamaji wenye uhasama; ‘wao’ kinahifadhi msisitizo huo.
- source_word: יַבִּיטוּ
  choice: wananiangalia
  rationale: Kitenzi kinaonyesha kutazama kwa makini; ‘wananiangalia’ ni lugha ya kawaida na ya sasa, huku kitenzi kinachofuata kikiongeza uzito.
- source_word: יִרְאוּ
  choice: wananikazia macho
  rationale: Ingawa ראה kwa msingi ni ‘kuona,’ kuunganishwa kwake na יַבִּיטוּ kunaleta msisitizo. ‘Wananikazia macho’ huwasilisha mtazamo wa kudumu bila kuacha jozi ya vitenzi ipoteze nguvu.
- source_word: בִי
  choice: -ni- / kwangu
  rationale: Katika Kiswahili, kiambishi yambwa katika ‘wananiangalia’ na ‘wananikazia’ huwasilisha kwa kawaida maana ya ‘kunielekea mimi’ iliyomo katika בִי.
theological_decisions:
- issue: Matumizi ya Kimasihi katika mapokeo ya Kikristo
  choice: Mstari umetafsiriwa kulingana na maana yake ya kishairi ya Kiebrania, bila kuongeza maneno yanayotaja kusulubiwa.
  alternative: Tafsiri iliyoongozwa zaidi na mapokeo ingeweza kuimarisha waziwazi uhusiano wake na mateso ya Kristo.
  rationale: Zaburi 22 ina umuhimu mkubwa katika ufafanuzi wa Kikristo, lakini mstari huu wenyewe unaeleza mateso ya mwili yanayoonekana na watazamaji wenye uhasama. Tafsiri inadumisha maneno ya Kiebrania na kuacha uhusiano wa kikanoni na wa Kimasihi ujitokeze katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘wananikazia macho’ ni wa kawaida na unaeleweka, nao unadumisha msisitizo wa jozi ya vitenzi vya Kiebrania. ‘Naweza kuihesabu’ imetumiwa badala ya ‘ninaihesabu’ ili kuwasilisha nguvu ya kimuktadha bila kuifanya tafsiri kuwa maelezo marefu.
