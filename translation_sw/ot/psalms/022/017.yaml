  text: Naweza kuhesabu mifupa yangu yote[a]; wao wananiangalia, wananikazia macho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ninahesabu mifupa yangu yote.” Kitenzi cha Kiebrania kinaweza kumaanisha “kuhesabu” au “kusimulia,” lakini hapa usemi “mifupa yangu yote” unaelekeza kwenye maana ya kuhesabu mmoja mmoja.
