lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu inayounga mstari huu na ombi au sifa iliyotangulia, kwa mtiririko wa kawaida wa Kiswahili.
- source_word: אַתָּה
  choice: wewe ndiwe
  rationale: 'Inahifadhi msisitizo wa kiwakilishi kilichotajwa wazi: Mungu mwenyewe ndiye mtendaji.'
- source_word: גֹחִי
  choice: uliyenitoa
  rationale: Katika muktadha wa kuzaliwa, kitenzi kinaeleza kusababisha mtoto atoke tumboni; usemi huu ni wa asili na unadumisha taswira halisi.
- source_word: מִבָּטֶן
  choice: tumboni
  rationale: Huwasilisha kwa kawaida dhana ya kutoka katika tumbo la uzazi bila kulazimika kuongeza maneno yasiyohitajika.
- source_word: מַבְטִיחִי
  choice: ukanifanya niwe salama
  rationale: Hiphil ya בטח inaweza kumaanisha kusababisha usalama au tumaini. Kwa mtoto mchanga, usalama unafaa muktadha bila kudai wazi uwezo wa kiakili wa kuamini.
- source_word: עַל שְׁדֵי אִמִּי
  choice: kifuani mwa mama yangu
  rationale: Ni usemi wa kawaida na wenye hadhi katika Kiswahili kwa mazingira ya mtoto anayenyonya, huku ukihifadhi taswira ya ukaribu na matunzo ya mama.
theological_decisions:
- issue: Iwapo מַבְטִיחִי ielezwe kama kumfanya mtoto aamini au kumpa usalama
  choice: ukanifanya niwe salama
  alternative: ukanifanya nikutumaini
  rationale: Muktadha unahusu matunzo ya Mungu tangu kuzaliwa. Tafsiri ya usalama haingizi dai lisilo wazi kuhusu imani ya kiakili ya mtoto mchanga, lakini maana ya kusababisha kutumaini bado inawezekana kileksika na imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wewe ndiwe” hudumisha msisitizo wa Kiebrania; “kifuani mwa mama yangu” ni ya kawaida zaidi kuliko tafsiri ya moja kwa moja ya “kwenye matiti ya mama yangu,” huku tanbihi ikihifadhi uwezekano wa maana ya kutumaini.
