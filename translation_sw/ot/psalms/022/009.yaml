  text: For you are the one who brought me out from the womb[a], making me secure at my mother’s breasts.
translation:
  language: sw
  text: Kwa maana wewe ndiwe uliyenitoa tumboni,[a] ukanifanya niwe salama kwenye matiti ya mama yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukanifanya nikutumaini nilipokuwa kwenye matiti ya mama yangu.”
