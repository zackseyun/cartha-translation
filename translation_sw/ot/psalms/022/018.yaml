  text: They divide my garments among themselves[a], and for my clothing they cast lots.
translation:
  language: sw
  text: Wanagawana mavazi yangu miongoni mwao[a], na vazi langu wanalipigia kura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mstari huu una mwangwi katika simulizi za Injili kuhusu kusulubiwa kwa Yesu; tazama Mathayo 27:35; Marko 15:24; Luka 23:34; Yohana 19:24.
    reason: cross_reference
lexical_decisions:
- source_word: יְחַלְּקוּ
  choice: wanagawana
  rationale: Piel imperfect ya nafsi ya tatu wingi inaeleza kitendo cha kugawa; wakati wa sasa unahifadhi uhai wa taswira ya kishairi. Kitenzi hiki pia kinaendana kwa kawaida na ‘wao kwa wao.’
- source_word: בְגָדַי
  choice: mavazi yangu
  rationale: בגד humaanisha nguo au mavazi. ‘Mavazi’ ni lugha ya heshima na inayoeleweka, huku ikitofautishwa na umoja wa neno la pili.
- source_word: לָהֶם
  choice: wao kwa wao
  rationale: Ingawa maana ya moja kwa moja ni ‘kwao,’ katika muktadha wa kugawa vitu ndani ya kundi, ‘wao kwa wao’ huwasilisha kwa Kiswahili cha kawaida ugawaji miongoni mwao bila kuongeza wazo jipya.
- source_word: לְבוּשִׁי
  choice: vazi langu
  rationale: לבוש inaweza kumaanisha vazi au mavazi. Umoja ‘vazi langu’ unahifadhi tofauti ya kishairi na ‘mavazi yangu’ bila kulibainisha isivyohitajika kuwa joho.
- source_word: יַפִּילוּ גוֹרָל
  choice: wanapiga kura
  rationale: Muundo wa Hiphil wa נפל pamoja na גורל ni nahau ya kufanya uamuzi au mgao kwa kura. ‘Kupiga kura’ ndiyo nahau ya kawaida ya Kiswahili na ni bora kuliko tafsiri sisisi ya ‘kuangusha kura.’
- source_word: גוֹרָל
  choice: kura
  rationale: גורל ni kifaa au utaratibu wa kufanya uamuzi au mgao kwa kura. Kiswahili hutumia ‘kura’ katika nahau ‘kupiga kura.’
theological_decisions:
- issue: Mwangwi wa Kimasihi na matumizi katika Agano Jipya
  choice: Kutafsiri maelezo ya kishairi ya Kiebrania moja kwa moja, bila kuongeza lugha ya kusulubiwa
  alternative: Tafsiri iliyoongozwa zaidi na mapokeo ambayo ingetaja wazi kutimia kwake katika kusulubiwa kwa Yesu
  rationale: Mstari huu una mwangwi wa wazi katika simulizi za kusulubiwa kwa Yesu, lakini maneno ya tafsiri yanapaswa kuwakilisha Kiebrania chenyewe. Uhusiano wa kikanoni unahifadhiwa katika tanbihi badala ya kuingizwa ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Ulinganifu kati ya ‘mavazi yangu’ na ‘vazi langu’ unahifadhi utofauti wa maneno ya Kiebrania; ‘wanapiga kura’ ni nahau ya kawaida.
