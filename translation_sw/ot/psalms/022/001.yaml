- issue: Uchanganuzi wa kishazi cha mwisho kilichobanwa
  choice: Maneno ya kunguruma kwangu yako mbali na wokovu wangu
  alternative: Kwa nini uko mbali na kuniokoa, mbali na maneno ya kunguruma kwangu?
  rationale: Kiebrania hakirudii kiulizi wala hakitaji kiima ‘wewe’ katika kishazi hiki. Tafsiri iliyochaguliwa inadumisha muundo wa kishazi nomino na mvutano wake, badala ya kuongeza vipengele vya kifasiri.
