base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/005.yaml
  text: To you they cried out and were delivered[b][a]; in you they trusted and were not put to shame.
translation:
  language: sw
  text: Kwako walilia, wakaokolewa[a]; walikutumaini, wala hawakuaibishwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliponyoka” au “waliokolewa.” Kitenzi cha Kiebrania kinaweza kumaanisha kuponyoka au kuokolewa; hapa kinahusu wokovu uliopatikana baada ya kumlilia Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au, “hawakuona aibu” au “hawakukatishwa tamaa.” Usemi wa Kiebrania mara nyingi humaanisha kwamba waliomtumaini Mungu hawakufedheheshwa kwa sababu ya tumaini lao.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶיךָ
  choice: walipokulilia
  rationale: Kiambishi cha yambwa -ku- kinaelekeza kilio chao kwa Mungu; muundo huu ni wa kawaida katika Kiswahili na unaunganisha kwa asili kilio na matokeo yake.
- source_word: זָעֲקוּ
  choice: walipokulilia
  rationale: זעק ni kilio kikali cha kuomba msaada. ‘Kukulilia’ hudumisha wazo la kumlilia Mungu katika dhiki, si kulia tu kwa huzuni.
- source_word: וְנִמְלָטוּ
  choice: uliwaokoa
  rationale: Nifali ya מלט inaweza kumaanisha kuponyoka au kuokolewa. Katika muktadha wa kumlilia Mungu, ‘uliwaokoa’ huonyesha kwa kawaida wokovu uliotokana na mwitikio wake, bila kuongeza namna ya wokovu huo.
- source_word: בְּךָ
  choice: walikutumaini
  rationale: ב pamoja na בטח humtaja anayekuwa tegemeo. Kiswahili cha kawaida huweka yambwa moja kwa moja katika kitenzi ‘kutumaini.’
- source_word: בָטְחוּ
  choice: walikutumaini
  rationale: בטח humaanisha kutumaini au kutegemea. ‘Walikutumaini’ ni fupi, wazi, na ya asili.
- source_word: וְלֹא בֹשׁוּ
  choice: wala hawakuaibishwa
  rationale: בוש katika muktadha wa tumaini huweza kueleza kutotiwa aibu au kutofedheheshwa kwa sababu tumaini halikushindwa. ‘Hawakuaibishwa’ huhifadhi hali ya matokeo na kipengele cha heshima-aibu.
theological_decisions:
- issue: Aina ya wokovu unaoelezwa na נִמְלָטוּ
  choice: Mungu aliwaokoa walipomlilia
  alternative: Waliponyoka, bila kutaja wazi mtendaji wa wokovu
  rationale: Ingawa kitenzi cha Kiebrania ni cha hali ya kutendwa au kuponyoka, muundo wa mstari unaunganisha kilio kilichoelekezwa kwa Mungu na wokovu. Tafsiri hii huonyesha mantiki hiyo bila kuongeza maelezo yasiyokuwamo.
- issue: Maana ya heshima na aibu katika בֹשׁוּ
  choice: hawakuaibishwa
  alternative: hawakuona aibu; hawakukatishwa tamaa
  rationale: ‘Hawakuaibishwa’ huhifadhi wazo kwamba waliomtumaini Mungu hawakufedheheshwa na kushindwa kwa tumaini lao, badala ya kulifanya jambo hilo kuwa hisia ya ndani pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Walipokulilia’ ni usemi wa kawaida wa sala ya dhiki; ‘uliwaokoa’ ni wazi kwa msomaji wa kawaida. Alama zote za tanbihi zimewekwa baada ya maneno yanayohusika na zimepangwa kwa mpangilio wa [a], [b].
