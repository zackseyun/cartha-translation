base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/006.yaml
  text: Oh[a], that the salvation of Israel would come out of Zion! When God restores the fortunes of his people, let Jacob rejoice; let Israel be glad.
translation:
  language: sw
  text: Laiti wokovu wa Israeli ungetoka Sayuni! Mungu atakaporejesha hali njema ya watu wake[a], Yakobo ashangilie; Israeli afurahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu atakapowarudisha watu wake kutoka utekwani,” au “Mungu atakapowarejesha watu wake waliokuwa mateka.” Nahau ya Kiebrania inaweza kumaanisha kurejeshwa kutoka katika dhiki kwa ujumla, na mara nyingi huhusisha kurudi kutoka utekwani.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Laiti ... ungetoka
  rationale: Ni nahau ya Kiebrania inayoeleza tamanio kubwa, si swali halisi. “Laiti” pamoja na hali ya masharti huwasilisha tamanio hilo kwa Kiswahili cha kawaida.
- source_word: מִצִּיּוֹן
  choice: ungetoka Sayuni
  rationale: Kihusishi מִן kinaonyesha chanzo; “kutoka Sayuni” ni usemi wa asili unaodumisha picha ya wokovu ukitokea huko.
- source_word: יְשֻׁעוֹת
  choice: wokovu
  rationale: Ingawa umbo la Kiebrania ni la wingi, hapa linafanya kazi kama wingi wa dhana au wa mkazo. Umoja “wokovu” ni wa kawaida katika Kiswahili na unaeleza ukombozi unaotamaniwa.
- source_word: יִשְׂרָאֵל
  choice: wa Israeli
  rationale: Muundo huu unaonyesha kuwa wokovu huo ni wa Israeli au ni kwa ajili ya Israeli.
- source_word: בְּשׁוּב אֱלֹהִים שְׁבוּת עַמּוֹ
  choice: Mungu atakapowarejesha watu wake katika hali njema
  rationale: בְּ pamoja na kitenzi-jina huonyesha wakati, “atakapo-.” Nahau שׁוּב שְׁבוּת ina maana pana ya kugeuza dhiki na kurejesha hali njema, ingawa inaweza pia kuhusisha kurudi kutoka utekwani.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Neno la chanzo ni אֱלֹהִים, kwa hiyo limetafsiriwa “Mungu,” wala si “BWANA.”
- source_word: יָגֵל יַעֲקֹב
  choice: Yakobo ashangilie
  rationale: Hali ya kutamani iliyoanzishwa mwanzoni mwa mstari inaendelezwa kwa kauli ya kutakia; “ashangilie” ni ya asili na huhifadhi sauti ya kishairi.
- source_word: יִשְׂמַח יִשְׂרָאֵל
  choice: Israeli afurahi
  rationale: “Afurahi” hudumisha ulinganifu wa kishairi huku ikitofautisha kwa kiasi kitenzi hiki na “ashangilie.”
theological_decisions:
- issue: Maana ya nahau שׁוּב שְׁבוּת
  choice: Mungu atakapowarejesha watu wake katika hali njema
  alternative: Mungu atakapowarudisha watu wake waliotekwa; au Mungu atakaporudisha utekwaji wa watu wake
  rationale: Nahau hiyo mara nyingi inaeleza kwa upana kuondolewa kwa dhiki na kurejeshwa kwa hali njema, lakini katika mazingira fulani inaweza kurejelea kurudi kutoka utekwani. Tafsiri kuu inahifadhi maana pana, na uwezekano wa maana halisi zaidi umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wa heshima na unaoeleweka. “Laiti” huwasilisha tamanio la mstari wa kwanza, na vitenzi “ashangilie” na “afurahi” huhifadhi ulinganifu wa kishairi bila kuvifananisha kabisa.
