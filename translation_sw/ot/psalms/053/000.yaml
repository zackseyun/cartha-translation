  text: 'Kwa mwongoza muziki: kulingana na Mahalathi[a]. Maskili[b] ya Daudi[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda hili ni jina la wimbo au istilahi ya kimuziki au ya kiliturujia; maana ya “Mahalathi” haijulikani kwa uhakika.
