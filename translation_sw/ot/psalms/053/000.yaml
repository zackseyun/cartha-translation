lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza muziki
  rationale: Katika vichwa vya zaburi, neno hili humwelekezea anayesimamia uimbaji au utekelezaji wa muziki. Usemi huu ni wa Kiswahili cha sasa na hauwekewi maana finyu ya kwaya pekee.
- source_word: עַל
  choice: kulingana na
  rationale: Katika maagizo ya kimuziki, עַל yaweza kutambulisha wimbo, mtindo, au namna ya kuimba. Tafsiri hii inaacha maana yake mahsusi wazi bila kuamua kuwa Mahalathi lazima ni jina la wimbo.
- source_word: מָחֲלַת
  choice: Mahalathi
  rationale: Maana na rejeleo la istilahi hii havijulikani kwa uhakika; kuiandika kwa matamshi badala ya kuitafsiri kama ‘ugonjwa’ huepuka makisio yasiyothibitishwa.
- source_word: מַשְׂכִּיל
  choice: Maskili
  rationale: Hii ni istilahi ya kiufundi katika vichwa vya zaburi, na maana yake kamili inabishaniwa. Uandikaji wa kimatamshi huhifadhi istilahi hiyo bila kuipa ufafanuzi wa uhakika usiokuwamo wazi katika Kiebrania.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kihusishi לְ katika vichwa vya zaburi kinaweza kuonyesha utunzi, uhusiano, wakfu, au kuhusishwa na mkusanyo. ‘Ya Daudi’ huhifadhi upana huo kuliko ‘iliyoandikwa na Daudi’.
theological_decisions:
- issue: Hadhi ya kichwa cha zaburi na uhusiano wake na Daudi
  choice: Kichwa kimetafsiriwa kama sehemu ya maandishi, huku לְדָוִד ikitafsiriwa ‘ya Daudi.’
  alternative: ‘Iliyoandikwa na Daudi,’ au kukiacha kichwa kama taarifa ya mhariri isiyotafsiriwa.
  rationale: Matini ya Kiebrania inakitoa kichwa hiki pamoja na zaburi. ‘Ya Daudi’ haidai kwa nguvu zaidi ya Kiebrania kwamba Daudi ndiye mwandishi, bali huhifadhi uwezekano wa uandishi, uhusiano, wakfu, au uainishaji wa mkusanyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Istilahi zisizo na maana ya uhakika zimeandikwa kwa matamshi na kufafanuliwa katika tanbihi; sentensi fupi za kichwa zimehifadhiwa.
