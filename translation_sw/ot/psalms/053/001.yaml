base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/001.yaml
  text: The fool says in his heart[a], “There is no God.” They are corrupt; they commit abominable injustice; there is no one who does good.
translation:
  language: sw
  text: Mpumbavu husema moyoni mwake, “Hakuna Mungu.” Wameharibika, nao wamefanya uovu wa kuchukiza[a]; hakuna atendaye mema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wamefanya udhalimu wa kuchukiza,” au “wameyafanya matendo yao kuwa ya kuchukiza.” Kiebrania huunganisha kitenzi kinachohusu chukizo na nomino inayomaanisha uovu au udhalimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָל
  choice: Mpumbavu
  rationale: Neno hili humaanisha mtu aliyepungukiwa kimaadili na anayemkataa Mungu, si mtu asiye na akili tu. “Mpumbavu” hudumisha maana ya kibiblia katika Kiswahili cha kawaida.
- source_word: בְּלִבּוֹ
  choice: moyoni mwake
  rationale: Nahau ya Kiebrania hueleza fikira au msimamo wa ndani; tafsiri hii inadumisha taswira ya moyo na kiambishi cha nafsi ya kiume umoja.
- source_word: אֵין אֱלֹהִים
  choice: Hakuna Mungu
  rationale: Kauli hii ni ukanushaji wa moja kwa moja wa kuwapo kwa Mungu katika muktadha wa imani ya Israeli.
- source_word: הִשְׁחִיתוּ
  choice: Wameharibika
  rationale: Kitenzi cha wingi kinapanua maelezo kutoka kwa mpumbavu mmoja wa mfano hadi kundi analoliwakilisha, huku kikionyesha hali ya upotovu wa maadili.
- source_word: וְהִתְעִיבוּ עָוֶל
  choice: nao wametenda uovu wa kuchukiza
  rationale: Muunganiko huu una kitenzi kinachoonyesha kufanya kuwa chukizo pamoja na nomino ya uovu au udhalimu. Kauli hii ni ya asili kwa Kiswahili na inadumisha vipengele vyote viwili.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: hakuna atendaye mema
  rationale: Hii inadumisha muundo wa kishiriki na kauli ya kutokuwapo hata mmoja anayefanya yaliyo mema.
theological_decisions:
- issue: Mabadiliko kutoka kwa “mpumbavu” wa umoja hadi vitenzi vya wingi
  choice: 'Kudumisha umoja katika kishazi cha kwanza na wingi katika kinachofuata: “Mpumbavu ... Wameharibika”'
  alternative: Kusawazisha sentensi yote iwe umoja au kuifanya yote iwe wingi
  rationale: Kiebrania chenyewe hubadilika kutoka kwa mtu mmoja wa mfano hadi kwa kundi analoliwakilisha. Kudumisha badiliko hilo kunahifadhi nguvu ya usemi.
- issue: Lugha ya kijinsia katika mtu mmoja wa mfano
  choice: moyoni mwake
  alternative: mioyoni mwao au moyoni
  rationale: Kiambishi cha Kiebrania ni cha kiume umoja na kinamrejelea “mpumbavu” wa mfano; Kiswahili hakilazimishi kutaja jinsia kwa kiwakilishi tofauti, lakini umoja unadumishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Husema” linaonyesha usemi wa tabia, na mabadiliko ya umoja kwenda wingi yamehifadhiwa.
