  text: הֲ/לֹ֥א יָדְעוּ֮ פֹּ֤עֲלֵ֫י אָ֥וֶן אֹכְלֵ֣י עַ֭מִּ/י אָ֣כְלוּ לֶ֑חֶם אֱ֝לֹהִ֗ים לֹ֣א קָרָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/004.yaml
  text: Do not the workers of wickedness know—those who eat up my people as they eat bread? They do not call on God[a][b][c].
translation:
  language: sw
  text: Je, watenda maovu hawajui—hao wanaowala watu wangu kama wanavyokula mkate? Hawamwiti Mungu[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watendao uovu,” badala ya “watenda maovu.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “hao wanaowala watu wangu; wanakula mkate.” Maana yake ni kwamba wanawateketeza watu wangu kwa urahisi kama chakula cha kawaida.
    reason: lexical_alternative
  - marker: c
    text: Maneno “watu wangu” yanaweza kueleweka kuwa Mungu ndiye anayesema au kuwa mtunga zaburi ndiye anayesema; Kiebrania hakimtaji msemaji wazi hapa.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא יָדְעוּ
  choice: Je, ... hawajui
  rationale: Muundo huu unaendeleza swali la balagha linalotarajia jibu la ndiyo, huku wakati wa sasa ukifaa kwa maelezo ya tabia ya jumla.
- source_word: פֹּעֲלֵי אָוֶן
  choice: watenda maovu
  rationale: Ni Kiswahili cha kawaida na chenye nguvu ya kimaadili kwa maana ya watu wanaotenda uovu; pia huepuka usemi mzito usio wa kawaida kama ‘wafanyakazi wa uovu.’
- source_word: אֹכְלֵי עַמִּי
  choice: hao wanaowala watu wangu
  rationale: Hudumisha sitiari ya kula inayowasilisha ukandamizaji mkali na wa kinyama.
- source_word: אָכְלוּ לֶחֶם
  choice: kama wanavyokula mkate
  rationale: 'Huonyesha wazi ulinganisho unaodokezwa na mfuatano wa Kiebrania: wanawateketeza watu kwa urahisi na kawaida kama kula chakula.'
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la neno ni la wingi kisarufi, hapa humrejelea Mungu mmoja.
- source_word: לֹא קָרָאוּ
  choice: Hawamwiti
  rationale: Katika muktadha huu, kitenzi kinamaanisha kumwita au kumlilia Mungu; wakati wa sasa unaonyesha tabia yao ya jumla.
theological_decisions:
- issue: Mrejelewa wa ‘watu wangu’
  choice: Kuhifadhi ‘watu wangu’ bila kumtaja msemaji
  alternative: Kufafanua kuwa ni Mungu anayesema, au kuwa ni mtunga zaburi anayesema kwa niaba ya waadilifu
  rationale: Kiambishi cha Kiebrania ni nafsi ya kwanza umoja, lakini mstari wenyewe haumtambui wazi msemaji. Tafsiri haiondoi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Watenda maovu’ ni cha kawaida na kinachoeleweka; sitiari ya kula imehifadhiwa, huku ulinganisho na kula mkate ukiwekwa wazi kwa mtiririko wa kawaida wa Kiswahili.
