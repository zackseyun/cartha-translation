  yaml_path: translation/ot/psalms/053/005.yaml
  text: There they were in great fear[a], where there was no fear; for God scattered the bones of the one encamping against you. You put them to shame[c][b], for God rejected them.
translation:
  language: sw
  text: 'Huko waliingiwa na hofu kuu[a],

    mahali ambapo hakukuwa na hofu;

    kwa maana Mungu aliitawanya mifupa ya aliyepiga kambi dhidi yako[b].

    Uliwaaibisha[c],

    kwa maana Mungu aliwakataa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno zaidi, “waliogopa hofu.” Kiebrania hutumia kitenzi na nomino zenye mzizi mmoja ili kusisitiza.
    reason: lexical_alternative
  - marker: b
    text: Au “mzingiraji wako” au “aliyepiga kambi kukuzunguka.” Neno la Kiebrania linamaanisha kupiga kambi, na hapa muktadha unaonyesha uhasama.
    reason: lexical_alternative
  - marker: c
    text: Mstari unabadilika kutoka kumsema Mungu (“Mungu aliitawanya”) hadi kumwambia moja kwa moja (“Uliwaaibisha”), kisha unarudi kumsema tena. Mgeuko huo wa kishairi umehifadhiwa.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Huko
  rationale: Kielezi hiki cha mahali kinaanzisha tukio kwa mkato wa kishairi; “Huko” ni cha kawaida na cha moja kwa moja.
- source_word: פָּחֲדוּ פַחַד
  choice: waliingiwa na hofu kuu
  rationale: Kitenzi na nomino zenye mzizi mmoja zinasisitiza ukubwa wa hofu. Kiswahili cha kawaida kinawasilisha msisitizo huo kwa “hofu kuu” badala ya kurudia maneno kwa namna isiyo ya asili.
- source_word: לֹא הָיָה פַחַד
  choice: mahali ambapo hapakuwa na hofu
  rationale: Tafsiri hii inabaki karibu na muundo wa Kiebrania na kuhifadhi mvutano wake bila kuamua wazi kama maana ni kwamba hapakuwa na sababu ya kuogopa.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi kinaingiza sababu au maelezo ya kauli iliyotangulia.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania ni la wingi, hapa linamtaja Mungu wa Israeli kwa maana ya umoja.
- source_word: פִּזַּר
  choice: aliitawanya
  rationale: Kitenzi kinaonyesha kutawanya kwa nguvu; umoja wa kisarufi unapatana na nomino ya Kiswahili “mifupa” katika ngeli yake.
- source_word: עַצְמוֹת
  choice: mifupa
  rationale: Hili ndilo neno la kawaida na wazi kwa mabaki ya mwili yanayotawanywa baada ya kushindwa.
- source_word: חֹנָךְ
  choice: aliyepiga kambi dhidi yako
  rationale: Neno linatokana na kitenzi “kupiga kambi.” Muktadha wa mifupa iliyotawanywa unaonyesha kuwa kupiga kambi huku ni kwa uhasama; “dhidi yako” linaweka wazi jambo hilo bila kubadili picha ya kambi kuwa istilahi nyingine.
- source_word: הֱבִשֹׁתָה
  choice: Uliwaaibisha
  rationale: Hifili ya mzizi בוש ina maana ya kusababisha aibu au kumtia mtu aibu. Umbo limeeleweka kuwa nafsi ya pili umoja, hivyo mgeuko wa ghafla kwenda kwa usemi wa moja kwa moja umehifadhiwa.
- source_word: מְאָסָם
  choice: aliwakataa
  rationale: Kitenzi מאס humaanisha kukataa au kutupilia mbali kwa dharau. “Aliwakataa” huhifadhi maana kuu bila kuongeza hisia zisizo lazima.
theological_decisions:
- issue: Mgeuko wa nafsi na anayeambiwa ndani ya mstari
  choice: 'Kuhifadhi mgeuko wa Masora kutoka kumsema Mungu kwa nafsi ya tatu hadi kumwambia moja kwa moja: “Uliwaaibisha.”'
  alternative: 'Kusawazisha vifungu vyote viwe nafsi ya tatu: “Mungu aliwaaibisha,” au kuelewa kwamba Sayuni/Yerusalemu ndiye anayeambiwa.'
  rationale: Ushairi wa Kiebrania unaruhusu mgeuko huu wa ghafla. Kwa kuwa kifungu kinachofuata kinarudi kusema “Mungu aliwakataa,” tafsiri haipaswi kuondoa mvutano huo kwa kuusawazisha kimya kimya.
- issue: Maana ya חֹנָךְ katika kumweleza adui
  choice: 'Maana ya uhasama: “aliyepiga kambi dhidi yako.”'
  alternative: “Mzingiraji wako” au “aliyepiga kambi kukuzunguka.”
  rationale: Muktadha wa kutawanywa kwa mifupa na kuaibishwa kwa wapinzani unaunga mkono kambi ya adui. Tafsiri iliyochaguliwa pia huhifadhi picha halisi ya kupiga kambi.
- issue: Maana ya לֹא הָיָה פַחַד
  choice: “mahali ambapo hapakuwa na hofu,” kwa kufuata ukaribu wa maneno ya Kiebrania.
  alternative: “ingawa hapakuwa na sababu ya kuogopa” au “wakati ambapo hapakuwa na cha kuogopesha.”
  rationale: Kiebrania hakitaji wazi “sababu” au “kitu” cha kuogopesha. Muundo wa karibu zaidi huhifadhi utata na mshangao wa kishairi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Huko,” “hofu kuu,” na “kwa maana” huweka mtiririko wa zaburi; mpangilio wa mistari unahifadhi vifungu vya ushairi na mgeuko wa ghafla wa nafsi.
