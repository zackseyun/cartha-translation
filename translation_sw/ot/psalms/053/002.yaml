  text: אֱֽלֹהִ֗ים מִ/שָּׁמַיִם֮ הִשְׁקִ֪יף עַֽל בְּנֵ֫י אָדָ֥ם לִ֭/רְאוֹת הֲ/יֵ֣שׁ מַשְׂכִּ֑יל דֹּ֝רֵ֗שׁ אֶת אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/002.yaml
  text: God looks down from heaven on the children of man to see whether there is anyone who has understanding[a], who seeks God.
translation:
  language: sw
  text: Mungu alitazama kutoka mbinguni kuelekea wanadamu[a], ili aone kama yuko yeyote mwenye ufahamu, anayemtafuta Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Adamu”; huu ni usemi wa pamoja unaomaanisha wanadamu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania ni la wingi, hapa linamtaja Mungu mmoja; “Mungu” ndilo neno la kawaida na sahihi katika muktadha huu.
- source_word: מִשָּׁמַיִם
  choice: kutoka mbinguni
  rationale: Kiebrania hutumia umbo la wingi, lakini Kiswahili sanifu hutumia “mbinguni” kwa kawaida na kwa ufasaha katika muktadha huu.
- source_word: הִשְׁקִיף
  choice: alitazama chini
  rationale: Kitenzi kinaonyesha kutazama kutoka mahali pa juu kuelekea chini. Wakati uliopita unafuata umbo timilifu la Kiebrania bila kupoteza picha ya Mungu anayekagua wanadamu.
- source_word: בְּנֵי אָדָם
  choice: wanadamu[a]
  rationale: Huu ni usemi wa pamoja unaowataja watu wote. “Wanadamu” ni wa asili katika Kiswahili na unaendeleza uhusiano wa kimsamiati na “Adamu”; tanbihi inaonyesha umbo halisi la Kiebrania.
- source_word: לִרְאוֹת
  choice: aone
  rationale: Kiswahili hutumia hali ya utegemezi kwa kusudi baada ya tendo kuu; “aone” linaeleza kusudi la Mungu kutazama.
- source_word: הֲיֵשׁ
  choice: kama yupo yeyote
  rationale: Muundo huu unauliza kama mtu wa aina hiyo yupo. “Kama yupo yeyote” ni wazi na wa kawaida kwa mtu.
- source_word: מַשְׂכִּיל
  choice: mwenye ufahamu
  rationale: Neno hili linamhusu mwenye utambuzi au ufahamu, likiwa na maana ya kiakili na kimaadili; halipunguzwi kuwa akili tu.
- source_word: דֹּרֵשׁ
  choice: anayemtafuta
  rationale: Umbo la kishiriki linaonyesha tabia inayoendelea ya kumtafuta Mungu; “anayemtafuta” linaendeleza maana hiyo.
- source_word: אֶת אֱלֹהִים
  choice: Mungu
  rationale: Kiashiria cha yambwa אֶת hakihitaji kutafsiriwa kwa neno tofauti katika Kiswahili; yambwa ni “Mungu”.
theological_decisions:
- issue: Maana ya אָדָם katika usemi בְּנֵי אָדָם
  choice: wanadamu
  alternative: wana wa Adamu
  rationale: Usemi huo unawahusu binadamu wote kwa pamoja, si wanaume pekee wala watoto wa kiume wa Adamu kwa maana finyu. “Wanadamu” ni sahihi na wa kawaida, huku tanbihi ikihifadhi umbo halisi la usemi wa Kiebrania.
- issue: Nyanja ya maana ya מַשְׂכִּיל
  choice: mwenye ufahamu
  alternative: mwenye hekima / atendaye kwa busara
  rationale: Kishiriki hiki kinaweza kuhusisha kuelewa na kutenda kwa utambuzi. “Mwenye ufahamu” huhifadhi upana huo bila kuamua kwamba kinamaanisha hekima au mwenendo pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Sentensi imehifadhi picha ya Mungu akitazama kutoka juu na swali la uchunguzi lililo katika Kiebrania, huku ikiepuka lugha ya kale au istilahi za kimadhehebu.
