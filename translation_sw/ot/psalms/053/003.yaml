base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/003.yaml
  text: All of them have turned aside; together they have become corrupt; there is none who does good[a], not even one.
translation:
  language: sw
  text: 'Wote wamepotoka;

    kwa pamoja wameharibika[a];

    hakuna atendaye mema,

    hata mmoja.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wamekuwa wachafu.” Kitenzi cha Kiebrania kinaweza kumaanisha kuwa wachafu au kutiwa doa kimaadili.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלּוֹ
  choice: Wote
  rationale: Hurejelea kundi lote kwa ujumla; “Wote” ni usemi wa kawaida na wenye nguvu katika Kiswahili.
- source_word: סָג
  choice: wamepotoka
  rationale: Kitenzi kinaonyesha kuiacha au kuikengeuka njia iliyo sawa. “Wamepotoka” huhifadhi maana ya kimaadili bila kuongeza tafsiri ya kidhehebu.
- source_word: יַחְדָּו
  choice: kwa pamoja
  rationale: Kielezi hiki husisitiza kwamba jambo hilo linawahusu wote kama kundi. “Kwa pamoja” ni wazi na la asili katika mstari huu wa kishairi.
- source_word: נֶאֱלָחוּ
  choice: wameharibika
  rationale: Umbo hili linaeleza kuwa wamekuwa wafisadi au wamechafulika kimaadili. “Wameharibika” huwasilisha maana ya kimaadili kwa lugha ya sasa huku tanbihi ikihifadhi uwezekano wa taswira ya uchafu.
- source_word: אֵין
  choice: hakuna
  rationale: Kanusho hili la kuwepo linakana kabisa kuwapo kwa mtu anayestahili maelezo yanayofuata.
- source_word: עֹשֵׂה
  choice: atendaye
  rationale: Hali ya kushiriki ya Kiebrania humtaja mtu mwenye sifa ya kutenda; “atendaye” ni muundo mfupi, wa kawaida, na wenye hadhi.
- source_word: טוֹב
  choice: mema
  rationale: Neno hili hapa linatumika kama kitu kinachotendwa. “Kutenda mema” ni Kiswahili cha kawaida kinachohifadhi upana wa maana ya kimaadili.
- source_word: גַּם אֶחָד
  choice: hata mmoja
  rationale: Kirai hiki huimarisha kanusho; “hata mmoja” ni kifupi, cha asili, na chenye mkazo.
theological_decisions:
- issue: Upeo wa shutuma ya uharibifu wa kimaadili katika zaburi
  choice: 'Kuhifadhi lugha jumuishi ya mstari: “Wote ... hakuna ... hata mmoja.”'
  alternative: Kufanya shutuma hiyo iwahusu tu watenda maovu waliotajwa moja kwa moja katika muktadha.
  rationale: Kiebrania kinatumia maneno ya ujumla na ya mkazo. Tafsiri inahifadhi upeo huo kama ulivyo katika shairi bila kuuingiza katika mfumo mpana wa mafundisho ambao mstari wenyewe hautamki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. Mistari mifupi imehifadhi ulinganifu na mkazo wa maandishi ya Kiebrania.
