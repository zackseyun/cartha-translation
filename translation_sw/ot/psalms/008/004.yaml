  text: Mtu[a] ni nini hata umkumbuke, na mwanadamu[b] ni nini hata umjali?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwanadamu wa kufa”; neno la Kiebrania אֱנוֹשׁ mara nyingi hukazia udhaifu wa mwanadamu.
    reason: lexical_alternative
