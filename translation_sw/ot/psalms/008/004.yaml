lexical_decisions:
- source_word: מָה
  choice: ni nini
  rationale: Katika swali hili la balagha, muundo huu wa Kiswahili huonyesha kwa kawaida mshangao kuhusu udogo wa mwanadamu bila kuhitaji kitenzi kilicho wazi katika Kiebrania.
- source_word: אֱנוֹשׁ
  choice: mtu
  rationale: Neno hili humaanisha mwanadamu, mara nyingi likidokeza udhaifu na hali yake ya kufa. “Mtu” ni la kawaida na linaweza kutumiwa kwa mtu mmoja anayewakilisha wanadamu wote; dokezo la udhaifu limehifadhiwa katika tanbihi.
- source_word: כִּי
  choice: hata
  rationale: 'Katika swali la balagha, “hata” huunganisha kwa Kiswahili sababu ya mshangao: mtu ni nini hata Mungu amkumbuke au amjali?'
- source_word: תִזְכְּרֶנּוּ
  choice: umkumbuke
  rationale: Hili ndilo maana la moja kwa moja la זכר, na kiambishi cha umoja “-m-” huhifadhi mtu mmoja anayetumiwa kwa maana wakilishi.
- source_word: וּבֶן אָדָם
  choice: na mwanadamu
  rationale: Kirai hiki ni sambamba ya kishairi ya אֱנוֹשׁ na hapa humaanisha binadamu. “Mwanadamu” ni Kiswahili cha kawaida kinachohifadhi umoja wakilishi bila kukifanya kirai kuwa cheo cha Kimasihi moja kwa moja.
- source_word: תִפְקְדֶנּוּ
  choice: umjali
  rationale: Katika muktadha huu, פקד inaonyesha Mungu kumwangalia mtu kwa makini na kushughulika naye. “Umjali” ni cha asili katika Kiswahili na hakifanyi maana kuwa ziara halisi; upana wa maana umeonyeshwa katika tanbihi.
theological_decisions:
- issue: Lugha ya umoja inayowakilisha wanadamu
  choice: Kutumia “mtu” na “mwanadamu” pamoja na viambishi vya umoja
  alternative: Kutumia “watu,” “wanadamu,” au “jamii ya wanadamu”
  rationale: Kiebrania hutumia nomino na viwakilishi vya umoja kwa mtu anayewakilisha wanadamu wote. Kiswahili kinaweza kuhifadhi umoja huo bila kudai kwamba mstari unawahusu wanaume pekee.
- issue: Ikiwa בֶן אָדָם ni cheo cha Kimasihi hapa
  choice: 'Kutafsiri kwa maana ya kawaida ya binadamu: “mwanadamu”'
  alternative: Kutumia “Mwana wa Adamu” kama cheo kilichowekewa herufi kubwa
  rationale: Katika zaburi hii kirai hicho ni sambamba ya kishairi inayozungumzia ubinadamu. Matumizi ya baadaye ya kibiblia yanaweza kuwa na umuhimu wa Kimasihi, lakini mstari wenyewe haulazimishi kuonyesha cheo hicho katika matini kuu.
- issue: Upana wa maana ya פקד
  choice: Kutumia “umjali” huku mbadala zikitajwa katika tanbihi
  alternative: “umtembelee,” “umwangalie,” au “umwangalie kwa makini”
  rationale: Kitenzi kinaweza kuonyesha kutembelea, kuangalia, kushughulika na, au kujali. Muktadha unaelekea kwenye uangalizi wa Mungu, lakini tanbihi huhifadhi upana wa neno la asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa mistari miwili na umoja wakilishi umehifadhiwa; maneno ni ya kawaida na yanafaa kwa usomaji wa hadharani.
