  text: the birds of the heavens[a], and the fish of the sea[b], whatever passes along the paths of the seas.
translation:
  language: sw
  text: 'ndege wa angani, na samaki wa baharini,

    na kila kipitacho katika njia za bahari.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִפּוֹר
  choice: ndege
  rationale: Nomino ya Kiebrania iko katika umoja lakini ina maana ya jamii nzima; “ndege” katika Kiswahili inaweza kutumiwa kwa umoja au wingi na inafaa katika orodha hii ya viumbe.
- source_word: שָׁמַיִם
  choice: wa angani
  rationale: Katika muktadha wa ndege, “angani” ni Kiswahili cha kawaida na wazi kwa eneo la juu ambako ndege huruka, huku kikidumisha lugha ya kishairi.
- source_word: וּדְגֵי הַיָּם
  choice: na samaki wa baharini
  rationale: Hili linawasilisha moja kwa moja fungu la muundo wa utegemezi, huku “samaki” ikifanya kazi kwa maana ya jamii na “baharini” ikiwa usemi wa asili katika Kiswahili.
- source_word: עֹבֵר
  choice: na kila kipitacho
  rationale: Kitenzi-shirikishi cha umoja kinaweza kuwa cha ujumla au cha kijamii. “Kila kipitacho” huhifadhi umoja wa kisarufi na kupanua maana kwa viumbe vyote vinavyopita humo bila kukilazimisha kiwakilishe samaki pekee.
- source_word: אָרְחוֹת
  choice: njia
  rationale: “Njia” ni tafsiri ya kawaida na ya kishairi ya mapito au mikondo, na huendeleza taswira ya njia zinazopitiwa baharini.
- source_word: יַמִּים
  choice: za bahari
  rationale: Ingawa neno la Kiebrania ni wingi, Kiswahili “bahari” linaweza kuwa na maana pana au ya kijamii; muundo “njia za bahari” ni wa asili zaidi kuliko “njia za bahari mbalimbali” na bado huhifadhi upana wa taswira.
