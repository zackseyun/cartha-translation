translation_notes:
  register: Lugha ni ya sasa, yenye hadhi na ya kishairi kwa kiasi. Mstari umegawanywa katika vipande viwili ili kudumisha usambamba wa zaburi. “Kipitacho” ni umbo la kifasihi linaloeleweka na linafaa kwa sajili ya kishairi; haliongezi ufafanuzi wa kimadhehebu.
