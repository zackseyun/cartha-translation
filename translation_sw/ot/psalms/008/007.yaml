  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֹנֶה
  choice: kondoo
  rationale: Neno hili humaanisha mifugo midogo ya kufugwa, hasa kondoo na mbuzi. Katika orodha hii ya kishairi, “kondoo” ni tafsiri fupi na ya kawaida, ingawa inaweza pia kujumuisha mbuzi.
- source_word: וַאֲלָפִים
  choice: na ng’ombe
  rationale: Neno hili hurejelea ng’ombe wa kufugwa. “Ng’ombe” ni neno la kawaida la Kiswahili na linafaa kwa wanyama hao bila kuwalazimisha kuwa maksai pekee.
- source_word: כֻּלָּם
  choice: wote
  rationale: Kiambishi cha Kiebrania kinasisitiza jumla yao; “wote” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: וְגַם
  choice: pamoja na
  rationale: Kirai hiki kinaendeleza orodha kwa kuongeza kundi jingine. “Pamoja na” huwasilisha maana hiyo kwa mtiririko wa asili wa Kiswahili.
- source_word: בַּהֲמוֹת
  choice: wanyama
  rationale: Katika muktadha huu neno ni la jumla kwa wanyama, hasa wanyama wakubwa. “Wanyama” ni wazi na ya kawaida katika Kiswahili.
- source_word: שָׂדָי
  choice: wa porini
  rationale: Neno humaanisha shamba, nchi ya wazi, au maeneo yasiyokaliwa. Kwa kuwatofautisha na mifugo iliyotajwa kwanza, “wa porini” huwasilisha kwa asili wanyama wa nchi ya wazi.
