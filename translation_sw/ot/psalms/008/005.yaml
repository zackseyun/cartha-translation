base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/005.yaml
  text: Yet you made him a little lower than God[a], and crowned him with glory and honor.
translation:
  language: sw
  text: Lakini ulimfanya awe chini kidogo kuliko Mungu[a], ukamvika taji ya utukufu na heshima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuliko viumbe wa mbinguni.” Septuajinti inasema “kuliko malaika,” tafsiri inayojitokeza pia katika Waebrania 2:7.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּחַסְּרֵהוּ
  choice: umemfanya awe chini
  rationale: Hifili ya חסר pamoja na yambwa ya mtu na kirai linganishi cha מן inaeleza kumweka mtu katika hali ya chini; Kiswahili hiki ni cha kawaida na kinahifadhi ulinganisho.
- source_word: מְּעַט
  choice: kidogo
  rationale: Katika muktadha wa Kiebrania, neno hili linaonyesha kiwango kidogo cha kuwa chini, si hasa muda mfupi.
- source_word: מֵאֱלֹהִים
  choice: kuliko Mungu
  rationale: Maana ya moja kwa moja inayowezekana zaidi ya אֱלֹהִים hapa ni Mungu, huku maana ya viumbe wa mbinguni ikibaki kuwa uwezekano halisi unaowekwa katika tanbihi.
- source_word: וְכָבוֹד
  choice: utukufu
  rationale: כָבוֹד huonyesha utukufu au heshima; 'utukufu' inafaa mtindo wa juu wa kishairi na ulinganifu wa mstari.
- source_word: וְהָדָר
  choice: heshima
  rationale: הָדָר huweza kumaanisha fahari, adhama, au heshima; 'heshima' inaonyesha hadhi aliyopewa mtu bila kurudia 'utukufu'.
- source_word: תְּעַטְּרֵהוּ
  choice: umemvika taji
  rationale: Pieli ya עטר huonyesha kumvika taji au kumzungushia heshima; usemi huu unahifadhi taswira ya kifalme na unasikika kwa asili katika Kiswahili.
theological_decisions:
- issue: Mhusika na nguvu ya uwakilishi ya kiwakilishi cha umoja
  choice: Kudumisha umoja katika “umemfanya” na “umemvika”
  alternative: Kutumia wingi au kutaja “wanadamu” moja kwa moja
  rationale: Kiebrania kina viambishi vya umoja, huku muktadha ukimtaja mwanadamu kwa namna ya uwakilishi. Umoja unahifadhiwa bila kufuta uwezekano wa maana ya wanadamu kwa ujumla.
- issue: Tafsiri ya אֱלֹהִים
  choice: Mungu
  alternative: viumbe wa mbinguni; malaika
  rationale: Ushahidi wa Kiebrania unaunga mkono 'Mungu' kama maana ya moja kwa moja, lakini neno linaweza pia kurejelea viumbe wa mbinguni. Septuajinti na Waebrania 2:7 zina 'malaika'; mapokeo hayo hayajaingizwa kimya kimya katika matini kuu bali yameelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Umemvika taji” huhifadhi taswira ya kifalme; “chini kidogo” huhifadhi maana ya kiwango badala ya muda.
