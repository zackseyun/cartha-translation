base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/002.yaml
  text: From the mouths of infants and nursing babies you have established strength because of your foes[a], to silence the enemy and the avenger.
translation:
  language: sw
  text: Kutoka vinywani mwa watoto wachanga na wanyonyao umeweka imara nguvu[a] kwa sababu ya watesi wako, ili kumnyamazisha adui na mwenye kulipiza kisasi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sifa,” kufuatana na mapokeo ya Septuajinti yanayoonekana katika Mathayo 21:16; matini ya Kiebrania inasema “nguvu.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִפִּי
  choice: Kutoka vinywani mwa
  rationale: Muundo huu unaonyesha kwamba jambo hilo linatoka katika vinywa vya watoto; wingi wa Kiswahili unaendana kwa kawaida na makundi mawili yanayofuata.
- source_word: עוֹלְלִים
  choice: watoto wachanga
  rationale: Neno hili hurejelea watoto wadogo sana; tamko hili ni la sasa, wazi, na lenye heshima.
- source_word: יֹנְקִים
  choice: wanyonyao
  rationale: Huhifadhi picha halisi ya watoto wanaonyonya na kuitofautisha kwa kiasi na neno la jumla zaidi 'watoto wachanga.'
- source_word: יִסַּדְתָּ
  choice: umeweka ... imara
  rationale: Kitenzi יסד kina maana ya kuanzisha au kuweka msingi; 'umeweka ... imara' ni Kiswahili cha kawaida kinachofaa kwa kitu kisicho halisi kama nguvu.
- source_word: עֹז
  choice: nguvu
  rationale: Hii ndiyo maana ya moja kwa moja ya neno la Kiebrania. Mapokeo ya Kigiriki yenye 'sifa' yamehifadhiwa katika tanbihi.
- source_word: לְמַעַן
  choice: kwa sababu ya
  rationale: Huhifadhi uhusiano na watesi kama sababu au hali inayochochea tendo, bila kulazimisha maana ya kusudi pekee.
- source_word: צוֹרְרֶיךָ
  choice: watesi wako
  rationale: Huwasilisha wapinzani wenye uhasama na kuepuka kurudia mara moja neno 'adui.'
- source_word: לְהַשְׁבִּית
  choice: ili kumnyamazisha
  rationale: Hiphili hii humaanisha kusababisha kukoma; katika muktadha wa upinzani wa adui, 'kunyamazisha' ni tafsiri ya asili na yenye nguvu.
- source_word: אוֹיֵב
  choice: adui
  rationale: Umoja huu unamwakilisha adui kama aina ya mpinzani kwa ujumla.
- source_word: מִתְנַקֵּם
  choice: mwenye kulipiza kisasi
  rationale: Huwasilisha wazi mhusika anayetekeleza au kutafuta kisasi bila kutumia istilahi nzito isiyo ya kawaida.
theological_decisions:
- issue: עֹז ya Kiebrania dhidi ya 'sifa' katika mapokeo ya Septuajinti na Mathayo 21:16
  choice: Neno עֹז limetafsiriwa 'nguvu' katika matini kuu.
  alternative: sifa
  rationale: Matini ya Kiebrania inasomeka wazi 'nguvu/uwezo.' Kipaumbele kimetolewa kwa chanzo cha Kiebrania, huku usomaji muhimu wa Kigiriki ukihifadhiwa katika tanbihi badala ya kuingizwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Wanyonyao' ni kifupi na cha kibiblia bila kuwa cha kizamani kupita kiasi; 'umeweka nguvu imara' huhifadhi picha ya kuanzisha au kuthibitisha nguvu. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusiana na uamuzi wa 'nguvu/sifa.'
