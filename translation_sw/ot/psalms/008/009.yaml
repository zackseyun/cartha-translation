  variant: Standard East African Swahili
source:
  edition: WLC
  text: יְהוָ֥ה אֲדֹנֵ֑י/נוּ מָֽה אַדִּ֥יר שִׁ֝מְ/ךָ֗ בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/009.yaml
  text: O Yahweh[a], our Lord[b], how majestic is your name in all the earth!
translation:
  language: sw
  text: 'Ee Yahwe[a], Bwana wetu,

    jinsi jina lako lilivyo tukufu[b] katika dunia yote!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH.” Kwa desturi hutafsiriwa “BWANA”; pia huandikwa “Yahwe.”'
    reason: alternative_reading
  - marker: b
    text: Au “kuu mno” au “lenye fahari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi unaotambulika katika Kiswahili, badala ya kubadilishwa kuwa cheo; tanbihi inaeleza desturi nyingine ya kulitafsiri.
- source_word: אֲדֹנֵינוּ
  choice: Bwana wetu
  rationale: Hili ni neno la kumwita Mungu linaloonyesha mamlaka na ukuu wake. “Bwana wetu” ni la asili na lenye heshima katika Kiswahili kuliko “mtawala wetu” au “mkuu wetu.”
- source_word: מָה
  choice: jinsi ... lilivyo
  rationale: Katika kishangao hiki, muundo “jinsi ... lilivyo” unaonyesha mshangao na sifa kwa Kiswahili cha kawaida bila kuugeuza kuwa swali.
- source_word: אַדִּיר
  choice: tukufu
  rationale: Katika muktadha huu neno linaeleza ukuu wenye fahari na utukufu. “Tukufu” ni la asili katika sifa kwa Mungu, huku tanbihi ikihifadhi uwezekano wa “kuu mno” au “lenye fahari.”
- source_word: שִׁמְךָ
  choice: jina lako
  rationale: Taswira ya Kiebrania imehifadhiwa; “jina” linabeba wazo la sifa, heshima na jinsi Mungu anavyojidhihirisha bila kulipanua katika matini.
- source_word: בְּכָל־הָאָרֶץ
  choice: katika dunia yote
  rationale: Hapa הָאָרֶץ ina upeo wa ulimwengu mzima, si nchi au eneo moja tu.
theological_decisions:
- issue: Uwasilishaji wa mfuatano יְהוָה אֲדֹנֵינוּ
  choice: Ee Yahwe, Bwana wetu
  alternative: Ee BWANA, Bwana wetu
  rationale: Matini inatofautisha jina binafsi la Mungu, YHWH, na cheo אֲדֹנֵינוּ. Kutumia “Yahwe” kisha “Bwana wetu” kunadumisha tofauti hiyo na pia sauti ya kumwita Mungu moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye sauti ya kishairi na ya heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa mistari unadumisha mwito wa moja kwa moja na kishangao cha sifa.
