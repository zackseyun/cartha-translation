base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/001.yaml
  text: O Yahweh[a], our Lord[c][b], how majestic is your name in all the earth—you have set your splendor above the heavens.
translation:
  language: sw
  text: 'Ee Yahwe[a], Bwana wetu,


    jinsi jina lako lilivyo adhimu[b] duniani kote!


    Umeweka[c] utukufu wako juu ya mbingu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH, jina la Mungu ambalo kwa desturi hutafsiriwa “BWANA”; pia hunukuliwa “Yahwe.”'
    reason: alternative_reading
  - marker: b
    text: Au “jinsi jina lako lilivyo kuu.”
    reason: lexical_alternative
  - marker: c
    text: 'Umbo la Kiebrania pia linaweza kutafsiriwa kama amri: “Weka utukufu wako juu ya mbingu.”'
    reason: textual_or_grammatical_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetafsiriwa kwa unukuzi unaofaa tahajia ya Kiswahili, badala ya kubadilishwa kuwa cheo. Tanbihi inaonyesha desturi nyingine ya kulitafsiri.
- source_word: אֲדֹנֵינוּ
  choice: Bwana wetu
  rationale: Hiki ni cheo אֲדוֹן chenye kiambishi cha nafsi ya kwanza wingi; “Bwana wetu” ni usemi wa kawaida, wenye heshima, katika kumwambia Mungu moja kwa moja.
- source_word: מָה אַדִּיר
  choice: jinsi ... lilivyo adhimu
  rationale: מָה hapa ni ya mshangao, si swali la kutaka habari. Muundo huu wa Kiswahili unadumisha sifa ya kishairi na wazo la ukuu wenye kuvutia.
- source_word: שִׁמְךָ
  choice: jina lako
  rationale: Tafsiri ya moja kwa moja inadumisha nahau ya Kiebrania ambamo jina linawakilisha sifa na kujifunua kwa Mungu bila kuipanua kwa ufafanuzi.
- source_word: בְּכָל הָאָרֶץ
  choice: duniani kote
  rationale: Muktadha wa ulimwengu wote na ulinganifu wake na mbingu unaunga mkono “dunia,” si maana nyembamba ya “nchi.”
- source_word: תְּנָה
  choice: Umeweka
  rationale: Katika muktadha wa sifa, kauli hii inaeleweka kwa kawaida kuwa inathibitisha kwamba Mungu ameweka utukufu wake juu ya mbingu. Hata hivyo, umbo la Kiebrania linafanana na amri, jambo lililohifadhiwa katika tanbihi.
- source_word: הוֹדְךָ
  choice: utukufu wako
  rationale: הוֹד huonyesha fahari, adhama au utukufu. “Utukufu” ni wa kawaida na wenye hadhi katika Kiswahili, bila kurudia “adhimu.”
- source_word: עַל הַשָּׁמַיִם
  choice: juu kuliko mbingu
  rationale: Usemi huu unaonyesha wazi hali ya kutukuka inayopita mbingu, badala ya kueleweka tu kuwa kitu kiko juu ya uso wa mbingu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina maalumu YHWH pamoja na cheo tofauti “Bwana wetu.” Kulitaja “Yahwe” kunadumisha tofauti hiyo na kuepuka kufanya maneno hayo mawili yaonekane kama marudio ya cheo kimoja.
- issue: Nguvu ya kisarufi ya תְּנָה
  choice: Umeweka
  alternative: Weka
  rationale: Muktadha wa zaburi unaunga mkono kauli ya sifa, lakini umbo la Kiebrania linaweza kusomwa kama amri. Tofauti hiyo haijafichwa; imeelezwa katika tanbihi bila kugeuza mstari mkuu kuwa ombi lisilo dhahiri katika muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka kwa msomaji wa kawaida. “Ee” inadumisha mwito wa moja kwa moja; mpangilio wa mistari unaonyesha ulinganifu wa kishairi. Tahajia “Yahwe” imetumiwa kulingana na mfumo wa sauti wa Kiswahili.
