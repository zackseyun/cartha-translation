  language: en
  yaml_path: translation/ot/psalms/008/006.yaml
  text: You made him rule over the works of your hands[b][a]; you put everything under his feet.
translation:
  language: sw
  text: Umemfanya atawale kazi za mikono yako[a]; umeweka kila kitu chini ya miguu yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Umempa mamlaka juu ya kazi za mikono yako.”
    reason: lexical_alternative
  - marker: b
    text: Maumbo ya umoja wa kiume katika “umemfanya” na “yake” yanaendeleza lugha ya mstari uliotangulia, yakimrejelea mwanadamu kwa namna ya uwakilishi.
    reason: cultural_note
lexical_decisions:
- source_word: תַּמְשִׁילֵהוּ
  choice: Umemfanya atawale
  rationale: Kauli ya Hifili ya משל ina maana ya kumsababisha au kumweka mtu atawale. Tafsiri hii inahifadhi nguvu ya kisababishi na ni Kiswahili cha kawaida.
- source_word: בְּמַעֲשֵׂי יָדֶיךָ
  choice: kazi za mikono yako
  rationale: Kiambishi ב pamoja na משל huonyesha kile kinachotawaliwa. Usemi huu unahifadhi taswira halisi ya mikono ya Mungu.
- source_word: כֹּל
  choice: kila kitu
  rationale: Katika muktadha huu, כֹּל ina maana pana ya vitu vyote vilivyowekwa chini ya utawala wa mwanadamu.
- source_word: שַׁתָּה
  choice: umeweka
  rationale: Kitenzi שׁית kina maana ya kuweka au kutia; “umeweka” ni cha kawaida na sahihi katika muktadha huu.
- source_word: תַחַת רַגְלָיו
  choice: chini ya miguu yake
  rationale: Tafsiri hii inahifadhi taswira ya Kiebrania pamoja na maana yake ya kutiishwa chini ya mamlaka.
theological_decisions:
- issue: Lugha ya umoja wa kiume inayowakilisha wanadamu katika Zaburi 8
  choice: Kuhifadhi viambishi vya umoja wa kiume katika “umemfanya,” “atawale,” na “miguu yake”
  alternative: Kuwataja wanadamu kwa wingi, kama “umewafanya watawale ... miguu yao”
  rationale: Kiebrania kinatumia maumbo ya umoja wa kiume yanayorejelea mwanadamu wa mstari uliotangulia kwa namna ya uwakilishi. Muundo huo umehifadhiwa bila kuzuia maana inayohusu wanadamu.
- issue: Lugha ya utawala
  choice: “Umemfanya atawale”
  alternative: “Umempa mamlaka juu ya”
  rationale: Chaguo hili linahifadhi hali ya kisababishi ya kitenzi cha Kiebrania bila kuongeza dhana zaidi ya kuteuliwa na Mungu kutawala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja, huku taswira ya “kazi za mikono yako” na “chini ya miguu yake” ikihifadhiwa.
