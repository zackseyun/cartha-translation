base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/003.yaml
  text: When I look at your heavens[a], the work of your fingers, the moon and the stars, which you have set in place—
translation:
  language: sw
  text: Ninapozitazama mbingu zako,[a] kazi ya vidole vyako, mwezi na nyota ulizoziweka imara—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kwa maana ninaziona mbingu zako, kazi ya vidole vyako, mwezi na nyota ulizoziweka imara.”'
    reason: Njia nyingine ya kutafsiri כִּי kwa maana ya kisababishi; “ninaziona” na “ulizoziweka imara” pia ni chaguo halali kwa אֶרְאֶה na כּוֹנָנְתָּה.
lexical_decisions:
- source_word: כִּי
  choice: Ninapo-
  rationale: Katika muktadha huu wa kishairi, kiunganishi kinaeleza hali inayosababisha tafakari ya mstari unaofuata. Muundo wa “ninapo-” ni wa asili katika Kiswahili na unaendeleza vizuri wazo kuelekea swali la mstari wa 4.
- source_word: אֶרְאֶה
  choice: zitazama
  rationale: Kitenzi ראה hapa kina maana ya kuangalia kwa makusudi. “Kutazama” ni lugha ya sasa yenye hadhi na kina cha kishairi kuliko “kuona” pekee.
- source_word: שָׁמֶיךָ
  choice: mbingu zako
  rationale: “Mbingu” huhifadhi upana wa taswira ya Kiebrania na umilikaji wa nafsi ya pili, bila kuipunguza kuwa “anga” pekee.
- source_word: מַעֲשֵׂי אֶצְבְּעֹתֶיךָ
  choice: kazi ya vidole vyako
  rationale: Tafsiri hii huhifadhi taswira halisi ya kishairi ya vidole vya Mungu. “Kazi” hutumika kwa maana ya jumla na kwa kawaida katika Kiswahili.
- source_word: יָרֵחַ וְכוֹכָבִים
  choice: mwezi na nyota
  rationale: Majina haya ya kawaida yanabainisha vitu vya angani vinavyotazamwa; Kiswahili hakihitaji viambishi vya aina ya artikeli ya Kiingereza.
- source_word: אֲשֶׁר
  choice: ulizo-
  rationale: Kiambishi rejeshi huunganisha kwa ufasaha mwezi na nyota na tendo la Mungu la kuziweka.
- source_word: כּוֹנָנְתָּה
  choice: ulizoziweka mahali pake
  rationale: כון katika umbo hili huonyesha kuimarisha, kupanga, au kuweka imara. “Kuweka mahali pake” huwasilisha wazo la mpangilio na uthabiti kwa lugha inayoeleweka kwa urahisi.
theological_decisions:
- issue: Lugha ya kumwelezea Mungu kwa viungo vya kibinadamu katika tendo la uumbaji
  choice: Kuhifadhi “vidole vyako”
  alternative: “kazi ya mikono yako” au “vitu ulivyovifanya”
  rationale: Kiebrania kinatumia kwa makusudi taswira ya vidole kuonyesha ustadi na urahisi wa tendo la Mungu la kuumba. Kuihifadhi kunalinda nguvu ya ushairi bila kudai kwamba Mungu ana mwili wa kibinadamu.
- issue: Uhusiano wa כִּי na swali linalofuata
  choice: 'Kutafsiri kwa maana ya wakati: “Ninapo-”'
  alternative: “Kwa maana ninazitazama...”
  rationale: Maana zote zinaruhusiwa na כִּי, lakini usomaji wa wakati unaonyesha kwa kawaida hali inayochochea tafakari ya mtunga zaburi. Usomaji wa kisababishi umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mstari unabaki wazi kwa sababu sentensi na tafakari yake zinaendelea katika mstari unaofuata.
