  text: Kwa mwongoza muziki; kufuatana na Gitithi[a]. Zaburi ya Daudi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Gitithi” ni istilahi ya Kiebrania ambayo maana yake haijulikani kwa hakika; huenda ni jina la wimbo, namna ya uimbaji, au ala ya muziki.
    reason: cultural_note
  - marker: b
