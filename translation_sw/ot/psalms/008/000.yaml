lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza muziki
  rationale: Katika vichwa vya zaburi, neno hili humaanisha anayesimamia uimbaji au utendaji wa muziki. “Mwongoza muziki” ni Kiswahili cha sasa kilicho wazi bila kulazimisha kwamba lazima awe mwongoza kwaya pekee.
- source_word: עַל
  choice: kwa kufuata
  rationale: Katika maagizo ya kimuziki ya vichwa vya zaburi, kihusishi hiki kinaweza kuonyesha wimbo, ala, au namna ya utendaji inayopaswa kufuatwa. Tafsiri hii inaonyesha uhusiano huo bila kuamua maana kamili ya neno linalofuata.
- source_word: הַגִּתִּית
  choice: Gitithi
  rationale: Maana na rejeleo lake hazijulikani kwa hakika; huenda ni istilahi ya muziki, jina la wimbo, au ala. Kulitohoa kama jina kunahifadhi kutokuwa na uhakika kwa maandishi ya Kiebrania.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: “Zaburi” ndilo neno la kawaida na sahihi kwa aina hii ya wimbo wa ibada katika Kiswahili.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kihusishi cha Kiebrania kinaweza kuonyesha utunzi, uhusiano, wakfu, au kuwa sehemu ya mkusanyo unaohusishwa na Daudi. “Ya Daudi” huhifadhi upana huo vizuri kuliko “iliyoandikwa na Daudi.”
theological_decisions:
- issue: Uhusiano unaoonyeshwa na לְדָוִד
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi; kwa ajili ya Daudi
  rationale: Kichwa cha Kiebrania hakiamui kwa lazima kama Daudi ndiye mtunzi, mpokeaji, au mtu anayehusishwa na zaburi. “Ya Daudi” kinaacha uwezekano huo wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandishi ya ibada lakini kinachoeleweka kwa msomaji wa kawaida. Muundo mfupi wa kichwa umehifadhiwa; nukta mkato inaunganisha maagizo mawili ya kimuziki.
