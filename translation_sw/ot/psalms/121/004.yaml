  text: הִנֵּ֣ה לֹֽא יָ֭נוּם וְ/לֹ֣א יִישָׁ֑ן שׁ֝וֹמֵ֗ר יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/004.yaml
  text: Look[a], the keeper of Israel neither slumbers nor sleeps.
translation:
  language: sw
  text: Tazama,[a] mlinzi wa Israeli hasinzii wala halali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hakika, mlinzi wa Israeli hatasinzia wala hatalala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira kwa msisitizo. “Tazama” ni la kawaida, lenye hadhi, na linahifadhi nguvu ya kuelekeza usikivu.
- source_word: לֹא ... וְלֹא
  choice: hasinzii wala halali
  rationale: Muundo wa “... wala ...” unawakilisha kwa ufasaha jozi yaukanushaji ya Kiebrania.
- source_word: יָנוּם
  choice: hasinzii
  rationale: Kitenzi hiki kinamaanisha kulemewa na usingizi au kusinzia, na hivyo kinatofautishwa na usingizi kamili unaotajwa baadaye.
- source_word: יִישָׁן
  choice: halali
  rationale: Hiki ni kitenzi cha kawaida cha kulala; “halali” kinadumisha tofauti yake na “hasinzii.”
- source_word: שֹׁמֵר
  choice: mlinzi
  rationale: Kivumishi-tendaji kimetumiwa kama nomino, yaani anayelinda. “Mlinzi” ni fupi, ya asili, na inafaa msamiati unaorudiwa katika zaburi kuhusu ulinzi wa Mungu.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Hili ndilo umbo sanifu la Kiswahili la jina la taifa katika muktadha huu.
theological_decisions:
- issue: Maelezo ya Mungu kwa lugha ya kibinadamu kuhusu kukesha kwake
  choice: Kauli ya kishairi kwamba mlinzi wa Israeli hasinzii wala halali imehifadhiwa bila kuifafanua zaidi.
  alternative: Kuitafsiri kama dai la kifalsafa kuhusu kutoweza kwa Mungu kulala, au kuibadili kuwa kauli dhahania kuhusu uangalifu wake usiokoma.
  rationale: Jozi ya kishairi inaeleza uangalizi usiokoma kwa taswira ya kibinadamu. Tafsiri inadumisha taswira na mvutano wa kifungu bila kuingiza hitimisho la kiteolojia lisilotamkwa wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “hasinzii wala halali” ni wa asili na unahifadhi tofauti kati ya kusinzia na kulala; tanbihi inadokeza uwezekano wa msisitizo wa הִנֵּה na uwasilishaji wa vitenzi kama wakati ujao.
