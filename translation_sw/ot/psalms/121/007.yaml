lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la agano la Mungu lililoandikwa moja kwa moja katika Kiebrania, kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: יִשְׁמָרְךָ / יִשְׁמֹר
  choice: atakulinda / atayalinda
  rationale: Kitenzi שׁמר kina maana ya kulinda, kutunza, au kuangalia. Kurudia ‘-linda’ kunadumisha urudiaji wa Kiebrania na wazo kuu la zaburi.
- source_word: מִכָּל רָע
  choice: na mabaya yote
  rationale: Katika Kiswahili, ‘kulinda na’ hueleza kuzuia mtu asipatwe na jambo. ‘Mabaya’ yanahifadhi upana wa רָע, unaoweza kumaanisha uovu, madhara, au msiba, bila kuufinya katika maana moja tu.
- source_word: נַפְשֶׁךָ
  choice: maisha yako
  rationale: נֶפֶשׁ hapa inaweza kumaanisha uhai au mtu mwenyewe, si lazima nafsi isiyo ya mwili. ‘Maisha yako’ ni wazi na ya kawaida katika muktadha wa ulinzi, huku tanbihi ikihifadhi tafsiri mbadala.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Matini ina jina la Mungu lenye herufi nne moja kwa moja; kulitaja kama ‘Yahwe’ huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya נַפְשֶׁךָ katika muktadha huu
  choice: maisha yako
  alternative: nafsi yako
  rationale: Uchaguzi huu haudai mgawanyo maalumu wa mwanadamu kuwa mwili na nafsi ambao neno la Kiebrania lenyewe halilazimishi hapa. Tafsiri mbadala imetolewa ili kuhifadhi upana wa neno.
