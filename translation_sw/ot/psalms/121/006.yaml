  yaml_path: translation/ot/psalms/121/006.yaml
  text: By day the sun will not strike you[b][a], nor the moon by night.
translation:
  language: sw
  text: Mchana jua halitakupiga[a], wala mwezi hautakupiga usiku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “halitakudhuru.” Kitenzi cha Kiebrania humaanisha kihalisi “kupiga,” lakini katika muktadha kinaweza kumaanisha kusababisha madhara.
    reason: lexical_alternative
  - marker: b
    text: Jozi ya “mchana ... usiku” huonyesha ulinzi unaohusisha nyakati zote; jua na mwezi vinaweza kueleweka kihalisi, kitamathali, au kwa njia zote mbili.
    reason: cultural_note
lexical_decisions:
- source_word: יוֹמָם
  choice: Mchana
  rationale: Ni kielezi cha wakati kinachomaanisha wakati wa mchana; uchaguzi huu ni mfupi, wa kawaida, na unasawaziana kishairi na “usiku.”
- source_word: הַשֶּׁמֶשׁ
  choice: jua
  rationale: Ni rejeo la moja kwa moja kwa jua; Kiswahili sanifu hakihitaji kibainishi kinacholingana na kiambishi cha Kiebrania.
- source_word: לֹא
  choice: hali-
  rationale: Ukanushi umeunganishwa kwa kawaida katika kitenzi cha Kiswahili “halitakupiga,” pamoja na wakati ujao.
- source_word: יַכֶּכָּה
  choice: halitakupiga
  rationale: Kitenzi נכה kina maana halisi ya kupiga; uchaguzi huu unahifadhi picha thabiti ya Kiebrania bila kutumia neno la kizamani au kufasiri moja kwa moja kuwa kudhuru.
- source_word: וְיָרֵחַ
  choice: wala mwezi
  rationale: Kiunganishi kinaendeleza ukanushi wa kishazi cha kwanza; “wala” ni njia ya kawaida ya Kiswahili ya kuunganisha sehemu ya pili chini ya ukanushi huo.
- source_word: בַּלָּיְלָה
  choice: usiku
  rationale: Kirai cha wakati kinatofautiana na “mchana” na kuhifadhi usambamba na ufupi wa kishairi.
theological_decisions:
- issue: Aina ya ulinzi unaoahidiwa
  choice: Kudumisha taswira halisi ya jua na mwezi bila kuamua kama maana yake ni halisi, ya kitamathali, au zote mbili.
  alternative: Kuifafanua kuwa ulinzi dhidi ya madhara ya mazingira pekee, au kuibadili moja kwa moja kuwa ulinzi wakati wote.
  rationale: Ushairi unatumia mchana na usiku kuonyesha upeo mpana wa ulinzi, lakini maandishi hayalazimishi tafsiri moja tu ya jua na mwezi; tafsiri kuu inapaswa kuhifadhi mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo ni mfupi na wa kawaida, huku usambamba wa “mchana ... usiku” na taswira ya “jua ... mwezi” ukihifadhiwa.
