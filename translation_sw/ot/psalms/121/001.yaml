base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/001.yaml
  text: A Song of Ascents[a]. I lift up my eyes to the mountains— from where will my help come?
translation:
  language: sw
  text: Wimbo wa Kupanda. Nainua macho yangu kuelekea milima[a]—msaada wangu utatoka wapi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vilima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Wimbo
  rationale: Nomino hii humaanisha “wimbo”; uchaguzi huu hauongezi lebo maalumu zaidi ya aina ya utungo kama vile “zaburi.”
- source_word: לַמַּעֲלוֹת
  choice: wa Kupanda
  rationale: Huhifadhi kwa ufupi wazo la kupanda au kwenda juu bila kuamua ikiwa kichwa kinarejelea safari za mahujaji, ngazi za ibada, au maana nyingine.
- source_word: אֶשָּׂא
  choice: Nainua
  rationale: Kauli ya nafsi ya kwanza imetolewa kwa wakati wa sasa wa kishairi, ambao ni wa kawaida na wenye uhai katika Kiswahili.
- source_word: עֵינַי
  choice: macho yangu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya nomino yenye kiambishi cha nafsi ya kwanza.
- source_word: אֶל
  choice: kuelekea
  rationale: Huonyesha mwelekeo wa kutazama kwa Kiswahili cha kawaida bila kudokeza tafsiri ya mfano.
- source_word: הֶהָרִים
  choice: milima
  rationale: Neno la Kiebrania linaweza kutaja milima au vilima; “milima” huhifadhi uzito wa taswira, huku “vilima” ikiwekwa katika tanbihi kama uwezekano wa kileksika.
- source_word: מֵאַיִן
  choice: wapi
  rationale: Katika muundo “utatoka wapi,” neno hili linaonyesha kwa uwazi swali kuhusu chanzo cha msaada.
- source_word: יָבֹא
  choice: utatoka
  rationale: Ingawa kitenzi cha Kiebrania kimsingi ni “kuja,” Kiswahili kwa kawaida huuliza chanzo kwa kusema “utatoka wapi”; maana ya tendo linalotarajiwa imehifadhiwa.
- source_word: עֶזְרִי
  choice: msaada wangu
  rationale: Ni tafsiri ya moja kwa moja, rahisi, na ya kawaida ya neno lenye kiambishi cha nafsi ya kwanza.
theological_decisions:
- issue: Ikiwa kishazi cha pili ni taarifa au swali la balagha
  choice: 'Kimetafsiriwa kama swali la moja kwa moja: “msaada wangu utatoka wapi?”'
  alternative: “mahali msaada wangu unapotoka” au taarifa nyingine isiyo swali
  rationale: מֵאַיִן pamoja na יָבֹא kwa kawaida huunda swali. Hii huhifadhi mvutano wa kishairi ambao mstari unaofuata unaujibu.
- issue: Maana ya kitafsiri ya “milima”
  choice: Imeachwa bila kufafanuliwa kama ishara maalumu
  alternative: Kuieleza kama Sayuni, mahali pa hatari, au mahali pa ibada ya uongo
  rationale: Mstari wenyewe haubainishi ikiwa milima ina maana chanya au hasi; tafsiri isiyoegemea upande wowote huepuka kuingiza fundisho lisilotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Kichwa kimewekwa kwa ufupi ili kuhifadhi kutokuwa wazi kwa matumizi ya neno “kupanda”; alama ya em dash inaendeleza mkazo kati ya kutazama milima na kuuliza chanzo cha msaada.
