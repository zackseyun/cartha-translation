  yaml_path: translation/ot/psalms/121/008.yaml
  text: Yahweh will keep your going out and your coming in from now on and forever[a][b].
translation:
  language: sw
  text: Yahwe atakulinda utokapo na uingiapo, kuanzia sasa hata milele[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe atalinda kuondoka kwako na kuwasili kwako.” Usemi wa Kiebrania “kutoka na kuingia” hurejelea kwa upana mienendo au maisha yote ya mtu.
    reason: lexical_alternative
  - marker: b
    text: Au, “tangu sasa na milele.”
    reason: previous_rendering
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa namna inayolingana na matamshi na tahajia ya kawaida ya Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: יִשְׁמָר
  choice: atakulinda
  rationale: Kitenzi שׁמר humaanisha kulinda, kutunza, au kuangalia kwa uangalifu. ‘Atakulinda’ ni cha kawaida katika Kiswahili na kinadumisha wazo kuu linalorudiwa katika Zaburi 121.
- source_word: צֵאתְךָ וּבוֹאֶךָ
  choice: utokapo na uingiapo
  rationale: Usemi huu unahifadhi picha ya kutoka na kuingia, ambayo kwa pamoja inahusu kwa upana shughuli, mienendo, na maisha ya mtu.
- source_word: מֵעַתָּה
  choice: tangu sasa
  rationale: Hueleza mwanzo wa kipindi katika wakati wa sasa; ‘tangu sasa’ ni usemi wa kawaida na wazi wa Kiswahili.
- source_word: וְעַד עוֹלָם
  choice: na hata milele
  rationale: Kirai hiki kinaonyesha muda usio na mwisho. ‘Hata milele’ kinawasilisha wazi wazo la kuendelea bila kikomo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, si cheo. ‘Yahwe’ hulihifadhi jina hilo kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- issue: Upeo wa ‘kutoka na kuingia’
  choice: Kudumisha picha halisi huku dokezo likieleza maana yake pana
  alternative: Kutafsiri moja kwa moja kuwa ‘maisha yako yote’
  rationale: Jozi hii ni usemi unaoweza kurejelea mienendo au maisha yote ya mtu. Kudumisha picha ya asili huepuka kufuta ushairi na kuweka maana pana katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na ya kishairi bila kuwa ya kizamani. Muundo ‘utokapo na uingiapo’ ni wa kawaida na huhifadhi uwiano wa kishairi wa Kiebrania.
