  text: עֶ֭זְרִ/י מֵ/עִ֣ם יְהוָ֑ה עֹ֝שֵׂ֗ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/002.yaml
  text: My help comes from Yahweh[b][a], the Maker of heaven and earth.
translation:
  language: sw
  text: Msaada wangu unatoka kwa Yahwe, Muumba wa mbingu na dunia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi ya muundo wa Kiebrania: “Msaada wangu ni kutoka kwa Yahwe.” Kishazi cha kwanza hakina kitenzi bayana; “unatoka” kimetumika ili kutoa Kiswahili cha kawaida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶזְרִי
  choice: Msaada wangu
  rationale: Nomino עֵזֶר humaanisha msaada; umbo lenye kiambishi cha nafsi ya kwanza lina maana ya “msaada wangu.” Huu ni usemi wa kawaida na wenye heshima katika Kiswahili.
- source_word: מֵעִם
  choice: unatoka kwa
  rationale: Kihusishi hiki kinaonyesha chanzo kinachohusishwa na mtu. Kwa kuwa kishazi cha Kiebrania hakina kitenzi bayana, “unatoka kwa” kinakamilisha maana hiyo kwa Kiswahili cha kawaida bila kubadili wazo la msingi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu יהוה limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: עֹשֵׂה
  choice: Muumba
  rationale: Kitenzi-shirikishi עֹשֵׂה kinamtambulisha Yahwe kama yule anayefanya au kuumba. “Muumba” ni kifupi, cha asili katika Kiswahili, na huhifadhi nguvu yake kama sifa ya utambulisho.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: mbingu na dunia
  rationale: Jozi hii inajumuisha ulimwengu wote ulioumbwa. “Mbingu na dunia” ni usemi wa kawaida wa Kiswahili na huhifadhi wingi wa שָׁמַיִם.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina la Mungu. “Yahwe” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Nguvu ya עֹשֵׂה kama sifa ya Muumba
  choice: Muumba wa mbingu na dunia
  alternative: aliyezifanya mbingu na dunia; anayefanya mbingu na dunia
  rationale: Kitenzi-shirikishi cha Kiebrania kinaweza kueleza utambulisho wa kudumu, si tendo la wakati uliopita pekee. “Muumba” huhifadhi maana hiyo bila kulazimisha wakati maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, ya heshima na inayoeleweka kwa urahisi. “Yahwe” limetumika kwa jina la Mungu, na “mbingu na dunia” kwa jozi ya Kiebrania inayorejelea uumbaji wote.
