lexical_decisions:
- source_word: שִׁיר לַמַּעֲלוֹת
  choice: Wimbo wa Kupanda
  rationale: Huhifadhi maana ya wimbo unaohusishwa na kupanda, huku ikiacha wazi iwapo ni kupanda kwenda Yerusalemu, hatua, au matumizi mengine ya neno hilo.
- source_word: הֶהָרִים
  choice: milimani
  rationale: Neno la Kiebrania kwa kawaida humaanisha milima, lakini linaweza pia kutafsiriwa kuwa vilima; chaguo la msingi ni la kawaida na la asili katika Kiswahili.
- source_word: מֵאַיִן יָבֹא עֶזְרִי
  choice: msaada wangu utatoka wapi?
  rationale: Hutoa swali la moja kwa moja na kuhifadhi wakati ujao wa kitenzi pamoja na hali ya kutazamia msaada.
theological_decisions:
- issue: Je, kutazama milima kunamaanisha kwamba msaada unatoka huko?
  choice: Sentensi imeachwa kama swali bila kuongeza jibu au maelezo.
  alternative: Kufafanua kwamba msaada hautoki milimani bali kwa Bwana.
  rationale: Mstari wenyewe unauliza tu; jibu linafuata katika mstari unaofuata, hivyo kuliongeza hapa kungeondoa mvutano wa kishairi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wa heshima lakini unaoeleweka kwa urahisi. Kiashiria [a] kimewekwa baada ya neno linalohusika.
