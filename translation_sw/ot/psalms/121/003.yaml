base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/003.yaml
  text: He will not let your foot slip[b][a]; your keeper will not slumber.
translation:
  language: sw
  text: Hataruhusu mguu wako uteleze[b][a]; anayekulinda hatasinzia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Asiruhusu mguu wako uteleze; anayekulinda asisinzie.” Maumbo ya Kiebrania yanaweza kueleweka kama ombi au dua, na pia kama uhakikisho.
    reason: alternative_reading
  - marker: b
    text: Au, “uyumbe,” “utikisike,” au “usogee kutoka mahali pake,” badala ya “uteleze.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: hata-...-ruhus(u) / hata-...-sinzia
  rationale: Pamoja na vitenzi vya hali isiyotimilika, אַל inaweza kuwa ombi au tamko la uhakika. Katika muktadha wa Zaburi 121, ukanushi wa wakati ujao unaeleza kwa kawaida uhakikisho, huku tanbihi ikihifadhi uwezekano wa ombi.
- source_word: יִתֵּן
  choice: hataruhusu
  rationale: Ingawa נתן kimsingi ni ‘kutoa,’ katika muundo huu ina maana ya kuruhusu jambo litokee. ‘Hataruhusu’ ni Kiswahili cha kawaida na sahihi katika picha ya mguu kuteleza.
- source_word: לַמּוֹט
  choice: uteleze
  rationale: מוֹט huonyesha kutikisika, kuyumba, kusogezwa kutoka mahali imara, au kuteleza. Kwa kuhusishwa na mguu, ‘uteleze’ huhifadhi picha halisi na sitiari ya kupoteza uthabiti.
- source_word: רַגְלֶךָ
  choice: mguu wako
  rationale: Umoja wa Kiebrania pamoja na kiambishi cha nafsi ya pili umedumishwa; usemi huu unasikika kwa kawaida katika Kiswahili.
- source_word: יָנוּם
  choice: hatasinzia
  rationale: נוּם humaanisha kusinzia au kupata usingizi mwepesi, si lazima kulala fofofo. ‘Hatasinzia’ hutofautisha vizuri na wazo pana la kulala katika mstari unaofuata.
- source_word: שֹׁמְרֶךָ
  choice: anayekulinda
  rationale: שׁמר ni kulinda, kutunza, au kukesha kwa ajili ya mtu. ‘Anayekulinda’ ni ya asili na wazi katika Kiswahili, na inaweza kutumiwa kwa uthabiti katika mada kuu ya zaburi hii.
theological_decisions:
- issue: Nguvu ya אַל pamoja na vitenzi vya hali isiyotimilika
  choice: 'Uhakikisho wa taarifa: “Hataruhusu... hatasinzia.”'
  alternative: 'Ombi au dua: “Asiruhusu... asisinzie.”'
  rationale: Muktadha wa zaburi unasisitiza uhakika wa ulinzi wa BWANA, hivyo tamko la uhakikisho linafaa katika matini kuu. Hata hivyo, maumbo ya Kiebrania yanaweza pia kusikika kama ombi; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi bila kuwa kigumu. Mpangilio wa alama [b][a] umehifadhiwa kama katika matini ya mashauriano, na kila alama ina tanbihi inayolingana.
