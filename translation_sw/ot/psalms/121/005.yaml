lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limewasilishwa kwa unukuzi wa Kiswahili badala ya kubadilishwa na cheo kama “BWANA”.
- source_word: שֹׁמְרֶךָ
  choice: anayekulinda
  rationale: Muundo wa kitenzi-jina unaonyesha tendo la kudumu la kulinda; usemi huu ni wa kawaida katika Kiswahili na unahifadhi wazo kuu la mzizi שׁמר katika zaburi hii.
- source_word: צִלְּךָ
  choice: kivuli chako
  rationale: צל ni kivuli au uvuli; “kivuli” kinahifadhi picha halisi ya kinga dhidi ya jua bila kuigeuza moja kwa moja kuwa dhana ya “ulinzi”.
- source_word: עַל יַד יְמִינֶךָ
  choice: upande wa mkono wako wa kulia
  rationale: Kirai hiki kinawasilisha ukaribu wa Yahwe upande wa kulia, huku kikihifadhi taswira halisi ya mkono wa kulia.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha na cheo.
- issue: Maana ya sitiari צִלְּךָ
  choice: kivuli chako
  alternative: ulinzi wako; uvuli wako
  rationale: Maandishi yanadumisha sitiari ya kinga iliyo karibu badala ya kuifafanua kabisa; hivyo mvutano wa picha halisi na maana ya ulinzi unabaki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Anayekulinda” ni cha asili zaidi kuliko nomino nzito kama “mlinzi wako,” na “upande wa mkono wako wa kulia” huhifadhi ukaribu pamoja na taswira ya Kiebrania.
