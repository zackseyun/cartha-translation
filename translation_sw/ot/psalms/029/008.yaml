  text: The voice of Yahweh shakes the wilderness[a]; Yahweh shakes the wilderness of Kadesh.
translation:
  language: sw
  text: Sauti ya Yahweh huitikisa nyika[a]; Yahweh huitikisa nyika ya Kadeshi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huisababisha nyika itikisike kwa nguvu,” au “huifanya nyika itetemeke.”
    reason: Kitenzi cha Kiebrania יָחִיל kinaweza kumaanisha kusababisha kutetemeka, kutikisika kwa nguvu, au kuonekana kama kujikunja kwa maumivu; tafsiri hizi huhifadhi uwezekano huo kwa Kiswahili cha asili.
lexical_decisions:
- source_word: ק֣וֹל
  choice: Sauti
  rationale: Katika Zaburi 29, kirai kinachorudiwa קוֹל יְהוָה ni kibwagizo cha kishairi kinachoonyesha usemi na uwepo wa Mungu wenye nguvu; “sauti” huhifadhi maana hiyo ya kibinafsi kuliko “mlio”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: יָחִיל
  choice: hulitikisa / huitikisa
  rationale: Muundo wa Hiphil wa חול hapa una maana ya kusababisha kutetemeka, kutikisika, au kujikunyata. “Kutikisa” ni lugha ya kawaida na yenye nguvu, huku tanbihi ikihifadhi uwezekano mwingine wa kileksika.
- source_word: מִדְבָּר
  choice: nyika
  rationale: “Nyika” huonyesha eneo pana lisilolimwa na lenye ukiwa, bila kulibana neno hilo kwenye maana ya jangwa kavu tu.
- source_word: מִדְבַּר קָדֵשׁ
  choice: nyika ya Kadeshi
  rationale: Muundo tegemezi wa Kiebrania umehifadhiwa kwa kawaida kama “nyika ya Kadeshi,” huku jina la mahali קָדֵשׁ likitoholewa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Andiko linatumia jina la Mungu moja kwa moja. “Yahweh” huhifadhi jina hilo badala ya kuliwakilisha kwa cheo, bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nyika” imetumiwa kwa usahihi wa kijiografia na kishairi; urudiaji wa sentensi ya Kiebrania umehifadhiwa.
