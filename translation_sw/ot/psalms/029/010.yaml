base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/010.yaml
  text: Yahweh sat enthroned over the flood[a]; Yahweh sits enthroned as King forever.
translation:
  language: sw
  text: Yahwe aliketi katika enzi juu ya gharika[a]; Yahwe ameketi katika enzi kama Mfalme milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, huenda “Gharika,” ikidokeza hasa Gharika ya Nuhu.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetolewa kwa umbo la Kiswahili lililo wazi na linalotambulika, badala ya kubadilishwa kuwa cheo.
- source_word: לַמַּבּוּל
  choice: juu ya gharika
  rationale: מַבּוּל ni gharika au mafuriko makubwa, na ל pamoja na kitenzi cha kuketi hapa inaweza kueleza mamlaka juu ya maji hayo. Kauli hii pia haifungi ikiwa ni Gharika ya Nuhu pekee au taswira pana ya maji yenye fujo.
- source_word: יָשָׁב
  choice: aliketi
  rationale: Maana ya msingi ni ‘aliketi.’ Muktadha wa kifalme unaonyesha kuketi katika enzi, lakini Kiswahili kinaweza kuhifadhi picha ya Kiebrania bila kuongeza neno lisilosemwa wazi.
- source_word: וַיֵּשֶׁב
  choice: ameketi
  rationale: Umbo hili linaendeleza dai la utawala, na לְעוֹלָם linaelekeza kwenye hali inayodumu. ‘Ameketi’ linaunganisha tukio lililotajwa na utawala unaoendelea.
- source_word: מֶלֶךְ
  choice: akiwa Mfalme
  rationale: Hutoa hadhi ya kifalme kama kiarifu kwa Kiswahili cha kawaida na kuonyesha kwamba kuketi huku ni kutawala.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Ni tafsiri ya kawaida, ya asili, na yenye staha kwa muda usio na mwisho.
theological_decisions:
- issue: Iwapo מַבּוּל ni Gharika ya Nuhu hasa au gharika/maji yenye fujo kwa maana pana
  choice: gharika katika matini kuu, bila kumtaja Nuhu
  alternative: Gharika, yaani Gharika ya Nuhu
  rationale: Neno hili linaweza kudokeza Gharika ya zamani, lakini mstari haumtambui Nuhu waziwazi, na muktadha wa Zaburi 29 ni dhoruba na mamlaka ya Mungu juu ya maji. Tafsiri ya jumla pamoja na tanbihi huhifadhi uwezekano wote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imehifadhi urudiaji wa jina Yahwe na ulinganifu wa kishairi wa Kiebrania; ‘aliketi/ameketi’ hutofautisha tukio la zamani na utawala unaoendelea bila kufuta utata wa nyakati za vitenzi.
