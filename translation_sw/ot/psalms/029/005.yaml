base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/005.yaml
  text: The voice of Yahweh breaks cedars[b][a]; Yahweh shatters the cedars of Lebanon.
translation:
  language: sw
  text: 'Sauti ya Yahwe[a] huvunja mierezi[b];

    Yahwe huvunja mierezi ya Lebanoni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania qol linaweza kumaanisha “sauti” au “mlio.” Hapa “sauti” inadumisha taswira inayorudiwa katika zaburi hii ya tamko la Yahwe lenye nguvu kama radi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hurudia mzizi uleule wa kitenzi “vunja” katika vipashio vyote viwili. Kiswahili pia hurudia “vunja” ili kuhifadhi usambamba wa kishairi.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל יְהוָה
  choice: Sauti ya Yahwe
  rationale: Neno קוֹל linaweza kumaanisha sauti inayotamkwa au sauti inayosikika. “Sauti” ni ya kawaida katika Kiswahili na inadumisha taswira inayorudiwa katika zaburi ya tamko la Yahwe lenye nguvu kama radi.
- source_word: שֹׁבֵר
  choice: huivunja
  rationale: Kauli ya mazoea yenye wakati wa sasa inafaa kwa participle hii ya Kiebrania na kuonyesha tendo hai, la tabia ya sauti ya Yahwe.
- source_word: אֲרָזִים
  choice: mierezi
  rationale: Hili ndilo neno sanifu la Kiswahili kwa wingi wa mwerezi, bila kuongeza neno “miti” lisilohitajika.
- source_word: וַיְשַׁבֵּר
  choice: huivunjavunja
  rationale: Kitenzi cha pili kinatokana na mzizi uleule שבר lakini kiko katika muundo wa Piel wenye nguvu. Urudiaji wa “vunja” katika “huivunjavunja” unadumisha uhusiano wa mzizi na kuonyesha uzito wa tendo.
- source_word: אֶת אַרְזֵי הַלְּבָנוֹן
  choice: mierezi ya Lebanoni
  rationale: Muundo huu wa kawaida na wenye hadhi unatambulisha mierezi maarufu inayohusishwa na Lebanoni.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, si cheo. “Yahwe” linahifadhi jina hilo badala ya kulibadilisha kwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na hadhi ya kishairi. “Huivunja” na “huivunjavunja” vinaendeleza usambamba wa mstari huku tofauti ya nguvu kati ya miundo ya vitenzi vya Kiebrania ikihifadhiwa.
