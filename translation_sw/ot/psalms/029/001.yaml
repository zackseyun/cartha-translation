  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד הָב֣וּ לַֽ֭/יהוָה בְּנֵ֣י אֵלִ֑ים הָב֥וּ לַ֝/יהוָ֗ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/001.yaml
  text: A psalm of David. Ascribe to Yahweh[a], O sons of God, ascribe to Yahweh glory and strength.
translation:
  language: sw
  text: 'Zaburi ya Daudi.


    Mpeni Yahwe, enyi wana wa Mungu[a],

    mpeni Yahwe utukufu na nguvu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wana wa miungu” au “viumbe wa mbinguni.” Inaelekea kirai cha Kiebrania kinawahusu washiriki wa baraza la mbinguni.
    reason: Kuhifadhi tafsiri mbadala na utata wa kirai בְּנֵי אֵלִים.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa utungo wa aina hii katika maandiko ya kishairi.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kauli hii ya Kiswahili huhifadhi kwa kiasi fulani upana wa kiambishi לְ, ambacho kinaweza kuonyesha uandishi, uhusiano, umiliki, au kuwekwa wakfu, bila kulazimisha maana ya ‘iliyoandikwa na Daudi’.
- source_word: הָבוּ
  choice: Mpeni
  rationale: Ingawa kitenzi kina maana ya msingi ya ‘toeni’ au ‘peni,’ hapa kinadai kumtambua Yahwe kuwa mwenye utukufu na nguvu. ‘Mpeni’ ni ya asili katika Kiswahili na inadumisha lugha ya agizo na urudiaji wa Kiebrania.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetafsiriwa moja kwa moja kuwa ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: בְּנֵי אֵלִים
  choice: enyi wana wa Mungu[a]
  rationale: Tafsiri hii hudumisha taswira halisi ya ‘wana’ na inaeleweka kwa wasomaji wa kawaida. Tanbihi inaonyesha kuwa אֵלִים inaweza kueleweka kuwa miungu au viumbe wa mbinguni, hivyo utata wa rejeo haujafichwa.
- source_word: כָּבוֹד
  choice: utukufu
  rationale: ‘Utukufu’ ni tafsiri ya kawaida ya כָּבוֹד katika muktadha wa ukuu wa Mungu.
- source_word: וָעֹז
  choice: na nguvu
  rationale: ‘Nguvu’ huwasilisha maana ya עֹז kwa lugha ya kawaida na inalingana vizuri na ‘utukufu’ katika usambamba wa kishairi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania hutumia jina maalumu la Mungu; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya בְּנֵי אֵלִים
  choice: wana wa Mungu
  alternative: wana wa miungu; viumbe wa mbinguni
  rationale: Kirai hiki huenda kinawahusu washiriki wa baraza la mbinguni, lakini umbo na maana kamili ya אֵלִים vinajadiliwa. Matini kuu huhifadhi taswira ya ‘wana,’ na tanbihi huhifadhi maana nyingine zinazowezekana bila kuamua kimadhehebu asili yao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Urudiaji wa ‘Mpeni Yahwe’ umehifadhiwa ili kuonyesha muundo na msisitizo wa mstari wa Kiebrania.
