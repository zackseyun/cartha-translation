  text: Yahweh gives strength to his people[b][a]; Yahweh blesses his people with peace.
translation:
  language: sw
  text: Yahwe huwapa watu wake nguvu[a]; Yahwe huwabariki watu wake kwa amani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Yahwe atawapa watu wake nguvu; Yahwe atawabariki watu wake kwa amani.” Vitenzi vya Kiebrania vinaweza kueleweka kuwa vya wakati ujao. Pia vinaweza kusomeka kama ombi: “Yahwe na awape watu wake nguvu; Yahwe na awabariki watu wake kwa amani.”'
    reason: alternative_reading
  - marker: b
    text: Neno “amani” hutafsiri neno la Kiebrania shalom, ambalo linaweza pia kujumuisha ukamilifu, ustawi, na hali njema.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika herufi nne za Kiebrania limetoholewa kuwa “Yahwe,” umbo la kawaida na linalosomeka kwa urahisi katika Kiswahili, badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: עֹז
  choice: nguvu
  rationale: Neno hili humaanisha nguvu au uwezo; “nguvu” ni neno la kawaida na la moja kwa moja katika muundo wa kumpa mtu nguvu.
- source_word: לְעַמּוֹ
  choice: watu wake
  rationale: Kiambishi לְ hapa kinamtambulisha mpokeaji wa nguvu. Kitenzi cha Kiswahili “kuwapa” tayari huonyesha maana ya “kwa/to,” hivyo “watu wake” ni muundo wa asili.
- source_word: יִתֵּן
  choice: huwapa
  rationale: Kauli ya sasa ya mazoea inaonyesha tendo la Yahwe linalotambulika au la kawaida. Kiambishi cha wingi katika “-wapa” kinakubaliana kiasili na “watu wake.” Uwezekano wa maana ya wakati ujao umehifadhiwa katika tanbihi.
- source_word: יְבָרֵךְ
  choice: huwabariki
  rationale: Kauli hii inalingana na “huwapa” na kuwasilisha baraka kama tendo la Yahwe kwa watu wake. Maana ya wakati ujao au ya ombi inawezekana pia na imeelezwa katika tanbihi.
- source_word: אֶת עַמּוֹ
  choice: watu wake
  rationale: Kirai hiki ni yambwa tendwa, “watu wake.” Kurudiwa kwake kunahifadhi usambamba wa kishairi wa Kiebrania.
- source_word: בַשָּׁלוֹם
  choice: kwa amani
  rationale: “Kwa amani” ni muundo wa kawaida pamoja na “hubariki” na huhifadhi maana kuu ya שָׁלוֹם bila kuipanua kupita kiasi katika matini kuu.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Matini ina jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi jina hilo kwa umbo linalofaa mfumo wa sauti wa Kiswahili.
- issue: Nguvu ya vitenzi vya hali isiyotimilika יִתֵּן na יְבָרֵךְ
  choice: 'Kauli ya sasa ya mazoea au uhakika: “huwapa … huwabariki”'
  alternative: 'Wakati ujao: “atawapa … atawabariki”; au ombi: “na awape … na awabariki”'
  rationale: Katika hitimisho hili la kishairi, vitenzi vinaweza kutangaza kwa uhakika tendo la Yahwe kwa watu wake. Hata hivyo, umbo la Kiebrania pia linaweza kuwa na nguvu ya wakati ujao, na katika muktadha wa kishairi linaweza kusikika kama ombi; tanbihi inahifadhi uwezekano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo mfupi na urudiaji wa “Yahwe” na “watu wake” huhifadhi usambamba wa kishairi. “Huwapa” na “huwabariki” ni ya kawaida na inaeleweka kwa wasomaji wengi.
