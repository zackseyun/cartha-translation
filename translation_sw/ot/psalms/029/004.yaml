  text: קוֹל יְהוָ֥ה בַּ/כֹּ֑חַ ק֥וֹל יְ֝הוָ֗ה בֶּ/הָדָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/004.yaml
  text: The voice of Yahweh is powerful[b][a]; the voice of Yahweh is majestic.
translation:
  language: sw
  text: Sauti ya Yahwe ina nguvu[a]; sauti ya Yahwe ina adhama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sauti ya Yahwe ni kwa nguvu; sauti ya Yahwe ni kwa adhama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: sauti
  rationale: Neno hili linaweza kumaanisha sauti au mlio. Katika kibwagizo cha zaburi hii, “sauti” inadumisha tendo la binafsi la Yahwe na inaweza pia kueleweka katika muktadha wa radi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni jina la Mungu lililoandikwa kwa herufi YHWH; kulitaja kama “Yahwe” hudumisha jina binafsi badala ya kulibadilisha kuwa cheo.
- source_word: בַּכֹּחַ
  choice: ina nguvu
  rationale: Muundo wa kihusishi ב pamoja na nomino כֹּחַ unaweza kueleweka kama “kwa nguvu/ikiwa na nguvu.” “Ina nguvu” ni Kiswahili cha kawaida na chenye hadhi, huku tanbihi ikihifadhi muundo wa karibu zaidi na Kiebrania.
- source_word: הָדָר
  choice: fahari
  rationale: הָדָר huonyesha fahari, adhama, au utukufu wenye heshima. “Fahari” ni ya kishairi na inalingana vizuri na “nguvu” katika usambamba wa mstari.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi YHWH moja kwa moja. “Yahwe” hulihifadhi badala ya kutumia cheo cha mapokeo “BWANA.”
- issue: Nguvu na fahari kama sifa au namna inayoambatana na sauti
  choice: ina nguvu; ina fahari
  alternative: ni kwa nguvu; ni kwa fahari
  rationale: Kihusishi cha Kiebrania kinaweza kubeba maana ya maelezo au ya kuambatana. Matini kuu inatumia Kiswahili asilia, huku tanbihi ikihifadhi uwezekano wa muundo wa “kwa nguvu/ kwa fahari” bila kuondoa utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi, wa kishairi na wenye hadhi. Usambamba wa Kiebrania umerudiwa, na jina Yahwe limetumika kwa uwazi.
