  source_fidelity: The draft correctly renders קוֹל as “sauti,” preserves the divine name יְהוָה as “Yahwe,” and represents the two parallel prepositional phrases as descriptions of Yahweh’s voice. “Ina nguvu” faithfully conveys בַּכֹּחַ in idiomatic Swahili.
  naturalness: “Sauti ya Yahwe ina nguvu” is natural and suitably elevated. “Ina fahari” is intelligible but less idiomatic for a voice and can suggest pride or prestige. “Ina adhama” is a more natural, dignified rendering for the majesty/stately splendor denoted by הָדָר.
  terminology: Use “adhama” for הָדָר here. It more precisely communicates majesty without importing the broader theological associations that “utukufu” may carry, and avoids the possible ambiguity of “fahari.” “Yahwe” is retained consistently.
