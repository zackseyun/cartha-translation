base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/006.yaml
  text: He makes Lebanon skip like a calf[c][b][a], and Sirion like a young wild ox.
translation:
  language: sw
  text: Huifanya Lebanoni iruke-ruke kama ndama, na Sirioni[a] kama mwana wa fahali-mwitu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sirioni ni jina jingine la Mlima Hermoni.
    reason: cross_reference
  - marker: b
    text: Au, “kama fahali-mwitu mchanga.” Kiebrania husoma neno kwa neno, “kama mwana wa fahali-mwitu,” usemi unaomaanisha fahali-mwitu mchanga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְקִידֵם
  choice: Huwafanya waruke-ruke
  rationale: Kitenzi רקד katika Hifili kina maana ya kusababisha waruke au wacheze. “Waruke-ruke” linaonyesha mwendo mchangamfu wa ndama na kuhifadhi kiambishi cha wingi kinachotangulia majina ya maeneo.
- source_word: כְּמוֹ עֵגֶל
  choice: kama ndama
  rationale: עֵגֶל kwa kawaida ni ndama, na neno hilo linafaa kwa taswira ya kuruka-ruka kwa uchangamfu.
- source_word: לְבָנוֹן
  choice: Lebanoni
  rationale: Jina la mahali limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: וְשִׂרְיֹן
  choice: na Sirioni
  rationale: Maandishi ya Kiebrania yanatumia jina Sirioni; limetoholewa badala ya kubadilishwa kuwa Hermoni. Utambulisho wake unaelezwa katika tanbihi.
- source_word: כְּמוֹ בֶן רְאֵמִים
  choice: kama mwana wa fahali-mwitu
  rationale: בֶן רְאֵמִים kwa neno kwa neno ni “mwana wa fahali-mwitu/fahali-mwitu wengi,” lakini ni nahau inayoweza kumaanisha mnyama huyo akiwa mchanga. Tafsiri kuu inahifadhi umbile lisilo la kawaida la Kiebrania, huku maana ya kinahau ikitolewa katika tanbihi.
