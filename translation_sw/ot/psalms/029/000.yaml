  text: A psalm of David. Ascribe to Yahweh[a], sons of the mighty, ascribe to Yahweh glory and strength.
translation:
  language: sw
  text: 'Zaburi ya Daudi.


    Mpeni Yahwe, enyi viumbe vya mbinguni[a], mpeni Yahwe utukufu na nguvu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa maana halisi: “wana wa miungu.” Inaweza pia kutafsiriwa “wana wa Mungu” au “wana wa wenye nguvu.” Huenda kirai cha Kiebrania kinarejelea washiriki wa baraza la mbinguni.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: Zaburi ya Daudi
  rationale: Huhifadhi kichwa cha Kiebrania kwa lugha ya kawaida na yenye hadhi; muundo wa Kiebrania unaweza kuonyesha zaburi iliyoandikwa na Daudi, kwa ajili yake, au inayohusishwa naye.
- source_word: הָבוּ
  choice: Mpeni
  rationale: Kitenzi cha amri kimerudiwa kama katika chanzo. Katika muktadha huu kinamaanisha kumtambulia au kumpa Yahwe sifa inayomstahili.
- source_word: יהוה
  choice: Yahwe
  rationale: Limetolewa kama jina binafsi la Mungu badala ya kulibadilisha kuwa cheo, kwa kufuata ushahidi wa maandishi ya Kiebrania.
- source_word: בְּנֵי אֵלִים
  choice: enyi viumbe vya mbinguni[a]
  rationale: Tafsiri hii ya kimuktadha inaeleweka kwa wasomaji wa sasa na inaelekea kwa washiriki wa baraza la mbinguni; tanbihi inahifadhi tafsiri halisi na uwezekano mwingine wa maana.
- source_word: כָּבוֹד וָעֹז
  choice: utukufu na nguvu
  rationale: Huyatoa majina hayo mawili moja kwa moja na kuhifadhi mpangilio wa chanzo.
theological_decisions:
- issue: Utambulisho wa בְּנֵי אֵלִים
  choice: viumbe vya mbinguni
  alternative: wana wa miungu; wana wa Mungu; wana wa wenye nguvu
  rationale: Kirai hicho huenda kinarejelea washiriki wa baraza la mbinguni. Maandishi makuu yanaeleza rejeo hilo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi utata halisi wa muundo wa Kiebrania bila kuamua zaidi asili au hadhi yao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Urudiaji wa “Mpeni Yahwe” umehifadhiwa kwa ajili ya msisitizo na ushairi wa Kiebrania.
