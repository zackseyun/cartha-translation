base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/003.yaml
  text: The voice of Yahweh is over the waters[a]; the God of glory thunders[b], Yahweh is over many waters.
translation:
  language: sw
  text: 'Sauti ya Yahwe iko juu ya maji;

    Mungu wa utukufu hunguruma;

    Yahwe yuko juu ya maji mengi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno moja moja: “Yahwe juu ya maji mengi.” Kiebrania hakina kitenzi “yuko” katika kishazi hiki; pia kinaweza kueleweka kuwa mwendelezo wa kauli kuhusu Mungu wa utukufu anayenguruma juu ya maji mengi.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: קוֹל
  choice: sauti
  rationale: “Sauti” huhifadhi taswira ya kishairi ya ngurumo kuwa sauti yenye nguvu ya Yahwe, badala ya kuifanya kuwa kelele isiyo na uhusiano wa kibinafsi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetafsiriwa kwa umbo la kawaida la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: עַל
  choice: juu ya
  rationale: Katika taswira ya dhoruba, “juu ya” huonyesha kwa kawaida kwamba sauti ya Yahwe iko au inasikika juu ya maji.
- source_word: הַמָּיִם
  choice: maji
  rationale: Nomino ya Kiebrania iko katika umbo la wingi; “maji” ndiyo namna ya kawaida ya Kiswahili na huhifadhi taswira ya kishairi.
- source_word: אֵל הַכָּבוֹד
  choice: Mungu wa utukufu
  rationale: Hii ni tafsiri ya moja kwa moja ya muundo wa Kiebrania, bila kuubadili kwa ufafanuzi kuwa “Mungu mwenye utukufu.”
- source_word: הִרְעִים
  choice: hunguruma
  rationale: Kitenzi hiki humaanisha kutoa ngurumo. “Hunguruma” ni Kiswahili cha asili, cha sasa cha kishairi, kinachofaa kwa maelezo hai ya dhoruba, ingawa pia kinaweza kutumiwa kwa mngurumo mwingine.
- source_word: מַיִם רַבִּים
  choice: maji mengi
  rationale: “Maji mengi” huhifadhi kwa uwazi wingi na ukubwa unaodokezwa na msemo wa Kiebrania.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kuliweka kama cheo.
- issue: Ngurumo kama sauti ya Mungu katika ushairi
  choice: Kuhifadhi “sauti” na “hunguruma” kama kauli mbili sambamba
  alternative: Kufafanua kuwa radi ni sauti ya Yahwe
  rationale: Mstari unaunganisha sauti ya Yahwe na ngurumo kwa ushairi bila kueleza kwa kinathari jinsi uhusiano huo unavyofanya kazi; tafsiri haiupunguzi kuwa taarifa ya hali ya hewa wala kuufafanua kupita kiasi.
- issue: Kishazi cha mwisho kisicho na kitenzi katika Kiebrania
  choice: Kukamilisha kwa “yuko”
  alternative: “Yahwe juu ya maji mengi” au kukiunganisha na kishazi kilichotangulia
  rationale: Kiebrania hakina kitenzi kilichoandikwa katika kishazi cha mwisho. Kiswahili cha kawaida huhitaji “yuko”; alama za Masora pia zinaunga mkono kukisoma kama kauli tofauti baada ya “hunguruma.” Tanbihi huhifadhi umbo la moja kwa moja na uwezekano wa muundo mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa sasa. Mistari mitatu na semikoloni huhifadhi usambamba wa Kiebrania. “Hunguruma” ni ya asili zaidi kuliko usemi mzito kama “hutoa ngurumo,” huku ikibakiza nguvu ya taswira.
