base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/009.yaml
  text: The voice of Yahweh makes the deer give birth and strips the forests bare[a], and in his temple all say[b], “Glory!”
translation:
  language: sw
  text: Sauti ya Yahwe huwafanya paa wa kike wazae[a] na huivua misitu majani; na hekaluni mwake[b] wote husema, “Utukufu!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huwafanya paa wa kike wagaagaa,” au “huwafanya paa wa kike wagaagaa kwa uchungu wa kuzaa.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania הֵיכָל linaweza kumaanisha “hekalu” au “jumba la kifalme.”
    reason: alternative_reading
lexical_decisions:
- source_word: ק֤וֹל יְהוָ֨ה
  choice: Sauti ya Yahwe
  rationale: Muundo wa kutegemeana umetafsiriwa moja kwa moja; jina la agano יְהוָה limetoholewa kuwa “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: יְחוֹלֵ֣ל אַיָּלוֹת
  choice: huwafanya paa wazae
  rationale: חול inaweza kumaanisha kugaagaa kwa maumivu, hasa ya kuzaa; pamoja na neno la paa wa kike, maana ya kusababisha kuzaa ni ya kawaida na inafaa katika taswira ya dhoruba.
- source_word: וַֽיֶּחֱשֹׂ֪ף יְעָ֫ר֥וֹת
  choice: na huyavua misitu majani yake
  rationale: חשׂף ni kuvua au kuweka wazi. Usemi huu wa Kiswahili unaonyesha kwa uwazi dhoruba inavyoiacha misitu wazi, bila kudokeza kwamba miti yote imeondolewa.
- source_word: וּבְהֵיכָלוֹ
  choice: na hekaluni mwake
  rationale: הֵיכָל inaweza kuwa hekalu au jumba la kifalme; “hekalu” linafaa na mazingira ya sifa, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: כֻּלּוֹ אֹמֵר
  choice: wote husema
  rationale: Ingawa kitenzi kishirikishi ni cha umoja, kinatumika kwa maana ya kila mmoja katika jumla. “Wote husema” ni Kiswahili cha kawaida na kinafuata kitenzi cha Kiebrania kwa karibu.
- source_word: כָּבֽוֹד
  choice: Utukufu!
  rationale: Neno moja la mshangao linahifadhi tamko la sifa na uzito wa כָּבוֹד katika ibada.
theological_decisions:
- issue: Maana ya הֵיכָל kuhusiana na Yahwe
  choice: hekalu
  alternative: jumba la kifalme
  rationale: Mazingira ya ibada na tamko “Utukufu!” yanaunga mkono “hekalu,” lakini msisitizo wa zaburi juu ya ufalme wa Yahwe pia unaruhusu “jumba la kifalme”; hivyo maana hiyo haijaondolewa bali imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Wakati wa sasa wa mazoea umetumiwa kuonyesha nguvu ya sauti ya Yahwe inayotangazwa katika zaburi.
