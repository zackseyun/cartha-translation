base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/002.yaml
  text: Ascribe to Yahweh the glory of his name[a]; worship Yahweh in holy splendor.
translation:
  language: sw
  text: Mpeni Yahweh utukufu wa jina lake; mwabuduni Yahweh katika fahari takatifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika fahari ya utakatifu”; pia yawezekana, “mkiwa mmevaa mavazi matakatifu.”
    reason: alternative_reading
lexical_decisions:
- source_word: הָבוּ
  choice: Mpeni
  rationale: Amri ya wingi ya יהב katika kauli hii ya kishairi inamaanisha kumtambulia au kumpa Yahweh heshima; “mpeni” ni ya kawaida na yenye nguvu ya kiliturujia katika Kiswahili.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: ל humtambulisha mpokeaji wa heshima, na jina la agano יְהוָה limetafsiriwa kwa uhamishaji wa sauti kuwa “Yahweh.”
- source_word: כְּבוֹד שְׁמוֹ
  choice: utukufu wa jina lake
  rationale: Tafsiri hii inafuata kwa karibu muundo wa Kiebrania bila kuongeza wazi dhana ya ‘unaostahili,’ huku ikibaki ya asili katika Kiswahili.
- source_word: הִשְׁתַּחֲווּ
  choice: mwabuduni
  rationale: Ingawa kitenzi kimsingi huonyesha kuinama au kujilaza, katika muktadha wa kumwelekea Yahweh kinamaanisha tendo la ibada.
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: katika fahari takatifu
  rationale: Kauli hii fupi huhifadhi taswira ya uzuri au adhama yenye utakatifu bila kuamua ikiwa inahusu sifa ya ibada, mavazi matakatifu, au mazingira ya patakatifu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Uhamishaji wa sauti huhifadhi jina la agano lililotajwa moja kwa moja katika maandishi ya Kiebrania.
- issue: Maana ya בְּהַדְרַת קֹדֶשׁ
  choice: katika fahari takatifu
  alternative: katika fahari ya utakatifu; mkiwa mmevaa mavazi matakatifu
  rationale: Kiebrania kinaweza kueleweka kwa maana dhahania au kwa maana halisi ya mavazi ya ibada; tafsiri kuu imeacha mvutano huo wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi na chenye heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
