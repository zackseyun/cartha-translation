  text: The voice of Yahweh hews out flames of fire[a].
translation:
  language: sw
  text: Sauti ya Yahweh hupasua miali ya moto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mianga ya moto”; huenda ikirejelea umeme katika taswira ya dhoruba ya udhihirisho wa Mungu katika zaburi hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: Sauti
  rationale: Neno hili linaweza kumaanisha sauti au sauti inayosikika; katika Zaburi 29, “sauti” huhifadhi taswira ya radi kama tamko lenye nguvu la Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: חֹצֵב
  choice: yapasua
  rationale: Kitenzi חצב humaanisha kuchonga, kukata, au kupasua. “Yapasua” huhifadhi nguvu ya taswira huku ikisomeka kwa kawaida pamoja na miali ya moto.
- source_word: לַהֲבוֹת
  choice: miali
  rationale: Wingi huu hurejelea miali au ndimi za moto; “miali” ni tafsiri ya moja kwa moja na yenye ufasaha katika Kiswahili.
- source_word: אֵשׁ
  choice: moto
  rationale: Neno hili humaanisha moto; pamoja na לַהֲבוֹת linaunda usemi wa kishairi “miali ya moto.”
theological_decisions:
- issue: Kuhifadhi taswira ya dhoruba na utendaji wa Mungu bila kuifanya kuwa maelezo ya kisasa ya hali ya hewa
  choice: Sauti ya Yahweh yapasua miali ya moto.
  alternative: Sauti ya Yahweh yatoa mianga ya radi.
  rationale: Matini kuu huhifadhi picha halisi na ya kishairi ya Kiebrania; tanbihi inaonyesha kwamba huenda miali hiyo ni umeme wa radi bila kulazimisha ufafanuzi huo ndani ya mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa “Sauti ya Yahweh” unadumisha kiitikio cha zaburi, na “yapasua” huhifadhi nguvu ya kitenzi cha Kiebrania bila kuwa ngumu kwa msomaji wa kawaida.
