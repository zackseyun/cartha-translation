  text: אִם אָ֭מַרְתִּי אֲסַפְּרָ֥ה כְמ֑וֹ הִנֵּ֤ה ד֭וֹר בָּנֶ֣י/ךָ בָגָֽדְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/015.yaml
  text: If I had said[a], “I will speak thus,” behold, I would have betrayed the generation of your children.
translation:
  language: sw
  text: Kama ningesema, “Nitasema hivi,” tazama, ningekisaliti kizazi cha watoto wako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם אָמַרְתִּי
  choice: Kama ningesema
  rationale: Muundo huu unaonyesha sharti la kudhaniwa au lisilotimizwa katika muktadha, kwa Kiswahili cha kawaida na cha sasa.
- source_word: אֲסַפְּרָה כְמוֹ
  choice: Nitasema hivi
  rationale: Kitenzi ספר kinaweza kumaanisha kusimulia au kueleza, lakini hapa kinahusu kutamka mtazamo uliotangulia; “kusema hivi” ni ya asili na huhifadhi rejeo hilo.
- source_word: הִנֵּה
  choice: tazama
  rationale: Huhifadhi mkazo na utambuzi wa ghafla unaoletwa na neno la Kiebrania.
- source_word: דּוֹר בָּנֶיךָ
  choice: kizazi cha watoto wako
  rationale: “Kizazi” ni ulinganifu wa moja kwa moja wa דור, na “watoto wako” huonyesha kwa kawaida jumuiya ya watu wa Mungu bila kuifunga kwa wanaume pekee.
- source_word: בָגָדְתִּי
  choice: ningekisaliti
  rationale: בגד huonyesha kutenda kwa hiana au kukosa uaminifu; “ningekisaliti” ni fupi, ya asili, na inafaa muundo wa sharti.
theological_decisions:
- issue: Rejeo na maana ya “watoto wako”
  choice: Kirai kinaelekezwa kwa Mungu na kinamaanisha jumuiya ya watu wake kwa ujumla.
  alternative: “wana wako,” tafsiri iliyo karibu zaidi na umbo la kiume la neno la Kiebrania.
  rationale: Kiambishi cha nafsi ya pili umoja wa kiume kinamwelekea Mungu, ilhali “wana” katika muktadha huu hutumika kwa maana wakilishi ya watu wake; “watoto wako” huwasilisha maana hiyo bila kuongeza upekee wa wanaume.
- issue: Nguvu ya בגד kwa kizazi
  choice: “ningekisaliti kizazi”
  alternative: “ningekosa uaminifu kwa kizazi” au “ningetenda kwa hiana dhidi ya kizazi.”
  rationale: “Kusaliti” huhifadhi uzito wa kuvunja uaminifu wa kijumuiya unaodokezwa na kitenzi, bila kufafanua zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio unaweka uzito wa kishairi wa “tazama” huku ukibaki wazi kwa msomaji wa kawaida.
