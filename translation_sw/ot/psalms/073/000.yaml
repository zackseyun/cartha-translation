lexical_decisions:
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Neno hili humaanisha wimbo wa kidini unaoimbwa kwa ala; “Zaburi” ni istilahi ya kawaida, yenye heshima na inayoeleweka katika Kiswahili.
- source_word: אַךְ
  choice: Hakika
  rationale: Hapa neno hili linasisitiza ukweli wa kauli inayofuata; “Hakika” linaonyesha msisitizo huo kwa kawaida bila kuongeza maana isiyokuwapo.
- source_word: בָרֵי לֵבָב
  choice: walio safi moyoni
  rationale: Tafsiri hii inahifadhi taswira ya Kiebrania ya usafi wa moyo huku ikisomeka kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uhusiano kati ya wema wa Mungu, Israeli, na walio safi moyoni
  choice: “Mungu ni mwema kwa Israeli, kwa walio safi moyoni”
  alternative: “Mungu ni mwema kwa Israeli, yaani, kwa walio safi moyoni”
  rationale: Muundo wa Kiebrania unaweka “kwa Israeli” sambamba na “kwa walio safi moyoni” bila kiunganishi kinachoeleza wazi kama kundi la pili linafafanua Israeli yote au sehemu yake. Tafsiri imehifadhi mvutano huo bila kuongeza “yaani”.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Kichwa kimetenganishwa na mstari wa zaburi ili muundo wa chanzo uonekane wazi.
