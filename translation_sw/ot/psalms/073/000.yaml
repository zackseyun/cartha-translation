  footnotes:
  - marker: a
    text: Au “Zaburi kwa Asafu.” Kihusishi cha Kiebrania kinachotangulia jina Asafu kinaweza kuonyesha uhusiano au wakfu; “ya Asafu” hakilazimishi maana moja tu.
