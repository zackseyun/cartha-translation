  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אַ֤ךְ ט֭וֹב לְ/יִשְׂרָאֵ֥ל אֱלֹהִ֗ים לְ/בָרֵ֥י לֵבָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/001.yaml
  text: A psalm of Asaph[a]. Surely God is good to Israel[b], to those pure in heart.
translation:
  language: sw
  text: 'Zaburi ya Asafu.[a]


    Hakika Mungu ni mwema kwa Israeli, kwa walio safi moyoni.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Zaburi kwa ajili ya Asafu.”
    reason: Kiambishi cha Kiebrania לְ kinaweza kuonyesha uhusiano, uandishi, au kusudi/dhamira.
  - marker: b
    text: Au “kwa wenye moyo safi.”
    reason: Hii ni njia nyingine ya asili ya kutafsiri usemi wa Kiebrania לְבָרֵי לֵבָב.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ndilo neno la kawaida na lililozoeleka kwa utungo wa ibada wa aina hii; linatunza aina ya kifasihi ya kichwa cha zaburi.
- source_word: לְאָסָף
  choice: ya Asafu
  rationale: Kiambishi לְ katika vichwa vya zaburi kinaweza kuonyesha uandishi, uhusiano, umiliki, au kusudi. “Ya Asafu” ni usemi wa kawaida wa Kiswahili ambao hauamui kwa nguvu zaidi ya Kiebrania.
- source_word: אַךְ
  choice: Hakika
  rationale: Hapa neno hili linaanzisha dai kuu la zaburi kwa msisitizo wa uthibitisho. “Hakika” ni la asili, lenye hadhi, na linaonyesha uhakika huo.
- source_word: טוֹב
  choice: mwema
  rationale: Kivumishi hiki kinaeleza wema wa Mungu kwa tabia na kwa matendo yake ya kufadhili. “Mwema” huhifadhi upana huo bila kuubana kuwa fadhili pekee.
- source_word: לְיִשְׂרָאֵל
  choice: kwa Israeli
  rationale: Kiambishi לְ kinaonyesha uhusiano au manufaa; “kwa Israeli” ni Kiswahili cha kawaida katika sentensi “Mungu ni mwema kwa...”
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Neno hili lina maana ya umoja hapa na linamtaja Mungu wa Israeli.
- source_word: לְבָרֵי לֵבָב
  choice: kwa walio safi moyoni
  rationale: בָרֵי humaanisha walio safi, na לֵבָב huelekeza kwenye utu wa ndani—moyo, nia, na fikira. Usemi huu ni wa asili katika Kiswahili na huhifadhi maana ya usafi wa ndani.
theological_decisions:
- issue: Uhusiano kati ya “Israeli” na “walio safi moyoni”
  choice: Vishazi vyote viwili vimewekwa kwa kufuatana, vikitenganishwa kwa koma, bila kiunganishi cha kuongeza wala neno la ufafanuzi.
  alternative: Kutafsiri wazi kuwa ni makundi mawili (“Israeli na walio safi moyoni”) au kuwa kundi la pili linafafanua la kwanza (“Israeli, yaani, walio safi moyoni”).
  rationale: Vishazi viwili vya Kiebrania vinavyoanza kwa לְ vinaweza kusomwa kama ulinganifu wa kishairi unaofafanua, lakini muundo wenyewe hauondoi kabisa uwezekano wa uratibu. Koma huhifadhi mvutano huo bila kulazimisha hitimisho la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi urudiaji wa “kwa” wa Kiebrania ili kuonyesha usambamba wa kishairi na kutolazimisha uhusiano wa vikundi viwili.
