  source_fidelity: Drafting 'wanadamu wengine' adds the comparative idea 'other people,' which is not explicit in אֱנוֹשׁ and obscures its mortality/frailty nuance. 'Hawapati mapigo' can suggest receiving physical blows and is less fitting for the broader passive sense of being afflicted. The revision closely retains both cola and the contrast between אֱנוֹשׁ and אָדָם.
  naturalness: The revised wording is idiomatic, dignified Standard East African Swahili. 'Hawamo katika' directly represents the Hebrew negative-existential idiom, and 'hawateswi' naturally conveys exemption from affliction.
  terminology: Mwanadamu mwenye kufa preserves the marked frailty/mortality sense of אֱנוֹשׁ without imposing a doctrinal interpretation. Wanadamu renders generic אָדָם. Taabu and hawateswi appropriately render עָמָל and the passive of נגע.
