  yaml_path: translation/ot/psalms/073/005.yaml
  text: They are not in the trouble of mortal man[a], and they are not plagued with mankind.
translation:
  language: sw
  text: 'Hawamo katika taabu ya mwanadamu mwenye kufa,[a]

    wala hawateswi pamoja na wanadamu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hawamo katika kazi ngumu ya mwanadamu mwenye kufa, wala hawapigwi pamoja na wanadamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲמַל
  choice: hawapati taabu
  rationale: עָמָל inaweza kumaanisha taabu, dhiki, au kazi ngumu. Katika muktadha huu inahusu mateso na mizigo ambayo waovu wanaonekana kuepuka; usemi huu ni wa asili katika Kiswahili.
- source_word: אֱנוֹשׁ
  choice: wanadamu wengine
  rationale: אֱנוֹשׁ humaanisha mwanadamu dhaifu au mwenye kufa. Kiswahili hakihitaji kurudia wazi sifa ya kufa hapa; muktadha wa kulinganisha unawasilishwa kwa 'wanadamu wengine,' huku kidokezo kikihifadhi njia rasmi zaidi.
- source_word: אֵינֵמוֹ
  choice: hawapati
  rationale: Muundo wa kukanusha pamoja na kiambishi cha wingi unaonyesha kwamba taabu hiyo si yao. 'Hawapati' huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: וְעִם
  choice: pamoja na
  rationale: Kihusishi עִם kinaonyesha ushirika; 'pamoja na' huhifadhi maana ya kuwa katika hali moja na watu wengine.
- source_word: אָדָם
  choice: wanadamu
  rationale: אָדָם hapa ni jina la jumla kwa jamii ya binadamu, kwa hiyo 'wanadamu' ni tafsiri pana na ya asili.
- source_word: יְנֻגָּעוּ
  choice: hawapati mapigo
  rationale: Kitenzi cha kauli tendwa kutoka נגע humaanisha kupigwa au kuteswa. 'Kupata mapigo' huhifadhi taswira ya kupigwa na pia inaweza kueleweka kama kupatwa na mateso.
