  - severity: medium
    issue: '''hawapati mapigo'' for יְנֻגָּעוּ'
    rationale: This wording may be heard chiefly as literal beatings; the Hebrew more broadly denotes being struck or afflicted.
  - severity: low
    issue: Footnote does not supply a full corresponding alternative for the verse
    rationale: A lexical-alternative note should clearly offer the alternate rendering in context, including the alternative for the second colon where applicable.
