translation:
  language: sw
  text: Kwa maana moyo wangu ulitiwa uchungu, nami nilichomwa katika figo zangu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sehemu zangu za ndani kabisa”; katika Kiebrania figo huwakilisha hisia za ndani kabisa.
