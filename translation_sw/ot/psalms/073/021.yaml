lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza msingi wa kukiri kwa mtunga zaburi katika muktadha. “Kwa maana” kinahifadhi uhusiano huo wa maelezo bila kuufanya mstari huu kuwa sentensi ya wakati pekee.
- source_word: יִתְחַמֵּץ
  choice: ulikuwa umejaa uchungu
  rationale: Kitenzi hiki kina picha ya kitu kuwa kichachu au kichungu, na hapa kinaeleza hali ya ndani ya kuwa na uchungu. Kauli hii ni ya kawaida kwa Kiswahili huku ikihifadhi wazo la uchungu wa moyoni.
- source_word: לְבָבִי
  choice: moyo wangu
  rationale: “Moyo” hudumisha taswira ya Kiebrania ya nafsi ya ndani, mawazo na hisia, bila kuibadili kuwa ufafanuzi finyu kama “akili.”
- source_word: וְכִלְיוֹתַי
  choice: na figo zangu
  rationale: Neno la Kiebrania linamaanisha figo kihalisi na kwa sitiari hisia za ndani kabisa. Neno halisi limehifadhiwa katika matini, huku maana yake ya kisitiari ikifafanuliwa katika tanbihi.
- source_word: אֶשְׁתּוֹנָן
  choice: zilichomwa
  rationale: Kitenzi hiki adimu kinaeleza kuathiriwa kwa ukali kana kwamba kwa kuchomwa. “Zilichomwa” ni wazi, chenye nguvu, na kinaendeleza taswira ya mwili ya mstari huu.
