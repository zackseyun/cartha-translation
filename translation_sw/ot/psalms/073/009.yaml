  yaml_path: translation/ot/psalms/073/009.yaml
  text: They set their mouth against the heavens[b][a], and their tongue struts through the earth.
translation:
  language: sw
  text: Wameelekeza vinywa vyao dhidi ya mbingu[a], na ulimi wao hutembea duniani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ‘mbinguni.’ Kihusishi cha Kiebrania kwa maana ya moja kwa moja ni ‘katika,’ lakini muktadha unaashiria maneno ya ukaidi yanayoelekezwa dhidi ya mbingu.
    reason: lexical_alternative
  - marker: b
    text: Au, ‘huenda duniani.’ Kitenzi cha Kiebrania kwa maana ya moja kwa moja ni ‘hutembea/huenda’; taswira hiyo ya mwendo katika mstari huu huonyesha usemi wao usiozuiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁתּוּ
  choice: wameelekeza
  rationale: Kitenzi kina maana ya kuweka au kuelekeza. Pamoja na ‘vinywa vyao’ na muktadha wa maneno ya kiburi yanayoelekezwa mbinguni, ‘wameelekeza’ ni Kiswahili cha kawaida kinachohifadhi picha bila kuongeza kitendo kisichokuwamo.
- source_word: בַשָּׁמַיִם
  choice: dhidi ya mbingu
  rationale: Kihusishi cha Kiebrania kwa kawaida ni ‘katika,’ lakini hapa muktadha unaonyesha maneno ya ukaidi yanayoelekezwa dhidi ya mbingu. ‘Mbingu’ pia huhifadhi upana wa kishairi wa neno la Kiebrania.
- source_word: פִּיהֶם
  choice: vinywa vyao
  rationale: Kiebrania kina umoja wa kiwakilishi, lakini kwa Kiswahili ‘vinywa vyao’ ni namna ya asili ya kurejelea kundi la watu bila kubadili maana.
- source_word: וּלְשׁוֹנָם
  choice: nao ulimi wao
  rationale: Umoja wa kishairi umehifadhiwa katika ‘ulimi wao,’ na ‘nao’ huunganisha vipande viwili vya mstari kwa mtiririko wa kawaida wa Kiswahili.
- source_word: תִּהֲלַךְ
  choice: hutamba
  rationale: Kitenzi kimsingi humaanisha kutembea au kwenda. ‘Hutamba’ huhifadhi wazo la kwenda huku kikionyesha majivuno yanayotawala muktadha, bila kulazimisha ufafanuzi wa kiteolojia.
- source_word: בָּאָרֶץ
  choice: duniani
  rationale: Kwa sababu ya ulinganifu na ‘mbingu,’ ‘duniani’ linaonyesha upeo mpana kuliko ‘katika nchi’ na linaendana kwa kawaida na kitenzi cha mwendo.
