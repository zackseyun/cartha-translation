translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Wingi ‘vinywa vyao’ ni wa asili zaidi katika Kiswahili, huku umoja wa ‘ulimi wao’ ukihifadhi taswira na ulinganifu wa kishairi.
