  text: Surely in vain I have kept my heart pure[b][a], and washed my hands in innocence.
translation:
  language: sw
  text: Hakika, ni bure kwamba nimeutakasa moyo wangu[a], na nimeosha mikono yangu katika kutokuwa na hatia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bila faida.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “nimeosha mikono yangu katika usafi.” Hii ni taswira ya kutokuwa na hatia kimaadili, si kuosha uchafu wa mwili tu.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Hakika
  rationale: Hapa neno hili linasisitiza hitimisho la mtunga zaburi; “Hakika” linaonyesha mkazo huo kwa Kiswahili cha kawaida bila kulifanya liwe na maana finyu ya “tu”.
- source_word: רִיק
  choice: bure
  rationale: Neno hili linaonyesha tendo lisiloleta faida au matokeo yaliyotarajiwa. “Bure” ni usemi wa asili wa Kiswahili unaofaa katika malalamiko haya.
- source_word: זִכִּיתִי
  choice: nimeutakasa
  rationale: Kitenzi kina maana ya kufanya kitu kiwe safi au kisicho na unajisi. “Nimeutakasa” kinaendeleza maana ya kimaadili na hali ya tendo lililokamilika lenye umuhimu kwa wakati wa sasa.
- source_word: לְבָבִי
  choice: moyo wangu
  rationale: “Moyo” hapa ni kitovu cha utu wa ndani, nia na maamuzi ya kimaadili; pia huhifadhi taswira ya kishairi ya Kiebrania.
- source_word: וָאֶרְחַץ
  choice: na nimeosha
  rationale: Tafsiri hii inadumisha tendo la kuosha na usambamba wa kishairi kati ya moyo na mikono.
- source_word: בְּנִקָּיוֹן
  choice: katika kutokuwa na hatia
  rationale: Kirai hiki kinaonyesha usafi au kutokuwa na hatia, hasa kwa maana ya kimaadili katika muktadha huu, huku kikihifadhi taswira ya kuosha.
- source_word: כַּפָּי
  choice: mikono yangu
  rationale: Ingawa neno linaweza kumaanisha viganja hasa, “mikono yangu” ndiyo njia ya kawaida na ya asili ya kueleza taswira hii kwa Kiswahili.
theological_decisions:
- issue: Taswira ya usafi wa kimaadili dhidi ya usafi wa kiibada
  choice: Maneno ya kuosha yametafsiriwa kama taswira inayodokeza kutokuwa na hatia kimaadili.
  alternative: Kuyachukulia hasa kama maelezo ya usafi wa kiibada.
  rationale: Ulinganifu wa “moyo” na “mikono,” pamoja na muktadha wa malalamiko, unaelekeza kwenye usafi wa ndani na mwenendo usio na hatia. Tafsiri inadumisha taswira yenyewe bila kuongeza dai la kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo ni rahisi kueleweka, huku usambamba wa “moyo” na “mikono” na mvutano wa malalamiko ya mtunga zaburi vikihifadhiwa.
