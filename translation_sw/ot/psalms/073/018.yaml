  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַ֣ךְ בַּ֭/חֲלָקוֹת תָּשִׁ֣ית לָ֑/מוֹ הִ֝פַּלְתָּ֗/ם לְ/מַשּׁוּאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/018.yaml
  text: Surely you set them in slippery places[b][a]; you cast them down to ruin.
translation:
  language: sw
  text: Hakika, unawaweka mahali penye utelezi[a]; unawaangusha kwenye maangamizi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye ardhi yenye utelezi”; kihalisi, “mahali laini.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika uharibifu”; neno la Kiebrania liko katika wingi na linaweza pia kutafsiriwa “magofu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Hakika
  rationale: Chembe hii inasisitiza uhakika wa utambuzi wa mtunga zaburi hapa, si kizuizi cha maana ya “tu” au “ila.”
- source_word: בַּחֲלָקוֹת
  choice: mahali penye utelezi
  rationale: Neno hili kihalisi hurejelea mahali laini; katika muktadha huu picha ni ya sehemu yenye utelezi na hatari ya kuanguka.
- source_word: תָּשִׁית לָמוֹ
  choice: unawaweka
  rationale: Huhifadhi tendo la moja kwa moja la nafsi ya pili umoja, likielekezwa kwa Mungu, pamoja na kiwakilishi cha wingi kinachowarejelea waovu.
- source_word: הִפַּלְתָּם
  choice: unawaangusha
  rationale: Kauli ya Hifili ya נפל ina maana ya kusababisha waanguke; “unawaangusha” ni ya kawaida na huhifadhi usababishaji wa moja kwa moja.
- source_word: לְמַשּׁוּאוֹת
  choice: kwenye maangamizi
  rationale: Nomino ya wingi huonyesha hali au matokeo ya uharibifu mkubwa; “maangamizi” ni Kiswahili cha sasa, cha heshima, kinachobeba uzito wa picha hiyo.
theological_decisions:
- issue: Utendaji wa Mungu katika kuanguka kwa waovu
  choice: “unawaweka … unawaangusha”
  alternative: Tafsiri isiyo ya moja kwa moja inayosisitiza mazingira yao hatari au kuanguka kwao wenyewe
  rationale: Vitenzi vya Kiebrania viko katika nafsi ya pili umoja na vinamwelekea Mungu moja kwa moja. Tafsiri inadumisha kauli ya zaburi kwamba Mungu ndiye mtendaji bila kupunguza mvutano wake wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na lugha ya kawaida lakini yenye heshima. Alama ya nuktapacha inaendeleza ulinganifu wa mistari miwili, huku vitenzi vikihifadhi utendaji wa Mungu ulio wazi katika Kiebrania.
