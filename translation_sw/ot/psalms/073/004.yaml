  text: For they have no pains until death, and their body is fat.
translation:
  language: sw
  text: 'Kwa maana hawana maumivu wanapokufa,

    na miili yao ni minono.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “na miili yao ina afya.” Tafsiri ya maneno ya mwisho ya Kiebrania ina utata; yanaweza kueleza unono, afya, nguvu, au hali ya mwili.'
    reason: Huhifadhi utata halisi wa בָרִיא אוּלָם bila kudai kwamba kifungu hicho hakina maana inayoweza kutambuliwa.
lexical_decisions:
- source_word: חַרְצֻבּוֹת
  choice: maumivu
  rationale: Neno hili adimu linaweza kumaanisha vifungo au uchungu; katika muktadha wa kifo, “maumivu” huwasilisha kwa kawaida wazo la uchungu wa kimwili bila kulifanya kuwa fundisho maalumu.
- source_word: לְמוֹתָם
  choice: wanapokufa
  rationale: Kihalisi ni “kwa/katika kufa kwao.” Tafsiri hii inaonyesha uhusiano na tukio la kufa, badala ya kuamua bila shaka kwamba maana yake ni kipindi chote “mpaka kifo.”
- source_word: בָרִיא
  choice: minono
  rationale: Neno humaanisha kuwa mnene, nono, au mwenye afya. “Minono” inadumisha taswira ya unene kama ishara ya ustawi katika ulimwengu wa kale.
- source_word: אוּלָם
  choice: miili yao
  rationale: Hapa neno hili adimu linaeleweka kuwa sehemu ya mwili au mwili wenyewe; wingi wa Kiswahili unapatana kwa kawaida na kiwakilishi cha kundi.
theological_decisions:
- issue: Je, waovu hawana maumivu hadi kifo au wakati wa kufa?
  choice: wanapokufa
  alternative: mpaka wanapokufa
  rationale: Kihusishi לְ pamoja na nomino ya kifo kinaweza kueleweka kwa namna tofauti. Chaguo hili linafuata kwa karibu maana ya “katika/kwenye kifo chao,” huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Mistari miwili inatunza usambamba wa kishairi; lugha ni ya kawaida bila kupoteza utata wa Kiebrania.
