  text: וַ/אֲנִ֣י תָמִ֣יד עִמָּ֑/ךְ אָ֝חַ֗זְתָּ בְּ/יַד יְמִינִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/023.yaml
  text: Yet I am continually with you[a]; you have held my right hand.
translation:
  language: sw
  text: Lakini mimi niko pamoja nawe daima; umeushika[a] mkono wangu wa kuume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uliushika mkono wangu wa kuume.” Kitenzi cha Kiebrania kinaweza kukazia tendo la kuushika mkono na pia msaada unaoendelea kutokana na kushikwa huko.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Lakini mimi
  rationale: Kiunganishi pamoja na kiwakilishi kinaonyesha tofauti na hali ya awali ya mtunga zaburi; “Lakini mimi” huwasilisha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: תָמִיד
  choice: daima
  rationale: Neno hili linaonyesha mwendelezo usiokatika; “daima” ni la asili, lenye hadhi, na linafaa katika lugha ya kishairi.
- source_word: עִמָּךְ
  choice: niko pamoja nawe
  rationale: Muundo huu unawasilisha wazi kuwa karibu na Mungu au kuandamana naye bila kuongeza wazo lisilokuwamo katika Kiebrania.
- source_word: אָחַזְתָּ
  choice: umeushika
  rationale: Kitenzi אחז kinaweza kumaanisha kushika au kukamata. Kauli timilifu “umeushika” inadokeza tendo lililotokea ambalo matokeo yake yanaendelea.
- source_word: בְּיַד יְמִינִי
  choice: mkono wangu wa kuume
  rationale: Kiswahili hutumia moja kwa moja “kushika mkono”; “wa kuume” huhifadhi taswira halisi ya mkono wa kulia.
theological_decisions:
- issue: Hali ya tendo na maana ya msaada wa Mungu katika kitenzi timilifu
  choice: umeushika mkono wangu wa kuume
  alternative: ulishika mkono wangu wa kuume; unaushika mkono wangu wa kuume
  rationale: Kiebrania kinaweza kueleza tendo lililotimizwa lenye umuhimu unaoendelea. “Umeushika” huhifadhi uhusiano kati ya tendo la kushika na hali inayoendelea ya kutegemezwa bila kulifanya kuwa la wakati uliopita tu au la sasa tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio ni wa kishairi lakini unaeleweka kwa urahisi; taswira halisi ya mkono wa kuume imehifadhiwa.
