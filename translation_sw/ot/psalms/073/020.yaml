base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/020.yaml
  text: Like a dream when one awakes[a], Lord, when you rouse yourself, you will despise their image.
translation:
  language: sw
  text: Kama ndoto mtu aamkapo, Ee Bwana, utakapoamka[a], utaidharau taswira yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ingawa usomaji huu una uwezekano mdogo, “mjini utaidharau taswira yao.” Konsonanti za Kiebrania zinaweza kusomwa kwa namna hii, lakini muktadha unaunga mkono zaidi maana ya “utakapoamka.”
    reason: alternative_reading
lexical_decisions:
- source_word: כַּחֲלוֹם
  choice: Kama ndoto
  rationale: Kiambishi כַּ־ kinaonyesha ulinganisho, na חֲלוֹם ni “ndoto.” “Kama ndoto” ni usemi wa kawaida wa Kiswahili unaohifadhi tashbihi hiyo.
- source_word: מֵהָקִיץ
  choice: mtu anapoamka
  rationale: Kitenzi קיץ/יקץ humaanisha “kuamka,” na מֵ־ hapa kinaeleweka kwa maana ya wakati. Kauli hii inaonyesha ndoto kutoweka mtu anapoamka.
- source_word: אֲדֹנָי
  choice: Ee Bwana
  rationale: Hili ni jina la heshima la Mungu linalotumika kama mwito wa moja kwa moja. “Ee Bwana” ni mwito wa asili na wenye hadhi katika Kiswahili.
- source_word: בָּעִיר
  choice: utakapoamka
  rationale: Usomaji wa kitenzi kutoka עור, “kuamka/kuamshwa,” unafaa zaidi katika muktadha na unadumisha ulinganifu na mtu anayeamka kutoka ndotoni. Alama ya tanbihi inahifadhi usomaji mwingine unaowezekana wa konsonanti hizo.
- source_word: צַלְמָם
  choice: sura yao
  rationale: צֶלֶם inaweza kumaanisha “sura, mfano, taswira.” “Sura yao” ni Kiswahili cha kawaida na huhifadhi wazo la mwonekano wao usio na kudumu bila kulifafanua kupita kiasi.
- source_word: תִּבְזֶה
  choice: utaidharau
  rationale: Kitenzi בזה humaanisha “kudharau.” Umbo la kutotimia linaeleweka hapa kwa maana ya wakati ujao, likihusishwa na Bwana kuamka ili kutenda.
theological_decisions:
- issue: Maana ya בָּעִיר
  choice: 'Usomaji wa kitenzi: “utakapoamka”'
  alternative: 'Usomaji wa mahali: “mjini”'
  rationale: 'Mfano wa ndoto na kuamka unaunga mkono sana usomaji wa kitenzi na kuendeleza mantiki ya kishairi: kama ndoto inavyotoweka mtu anapoamka, ndivyo sura ya waovu itakavyodharauliwa Bwana atakapoamka ili kutenda. Hata hivyo, usomaji wa “mjini” umehifadhiwa katika tanbihi kwa sababu konsonanti za Kiebrania zinaweza kusomwa hivyo.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa kishairi, wa sasa na wenye hadhi. “Ee Bwana” huonyesha mwito wa moja kwa moja, huku kurudiwa kwa “kuamka” kukihifadhi ulinganifu wa mstari wa Kiebrania.
