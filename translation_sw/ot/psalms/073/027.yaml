  yaml_path: translation/ot/psalms/073/027.yaml
  text: For behold[a], those far from you will perish; you destroy all who are unfaithful to you.
translation:
  language: sw
  text: 'Kwa maana, tazama, walio mbali nawe wataangamia;

    umeangamiza wote wasiokuwa waaminifu kwako.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “wote wanaofanya ukahaba mbali nawe,” sitiari ya Kiebrania inayomaanisha kutokuwa waaminifu kwa Mungu au kwa agano lake.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha kuwa kauli hii inatoa sababu au msingi wa kauli iliyotangulia.
- source_word: הִנֵּה
  choice: tazama
  rationale: Inavuta uangalifu kwa msisitizo wa kishairi na wa heshima, huku ikiwa ya kawaida katika Kiswahili cha Biblia.
- source_word: רְחֵקֶיךָ
  choice: walio mbali nawe
  rationale: Inahifadhi wazo la watu wanaotambuliwa kwa kuwa mbali na Mungu, hasa kwa maana ya uhusiano.
- source_word: יֹאבֵדוּ
  choice: wataangamia
  rationale: Kitenzi אבד hapa kinaonyesha kuangamia au kufikia maangamizi; uchaguzi huu ni wa asili na wenye uzito unaofaa.
- source_word: הִצְמַתָּה
  choice: umeangamiza
  rationale: Hiphil ya צמת ina maana ya kusababisha kuharibiwa au kukomeshwa. Kauli timilifu ya Kiebrania imehifadhiwa kama tendo lililothibitishwa, badala ya kubadilishwa kimya kimya kuwa wakati wa sasa.
- source_word: כָּל
  choice: wote
  rationale: Inahifadhi upeo unaojumuisha kila mtu katika kundi linalotajwa.
- source_word: זוֹנֶה
  choice: wasiokuwa waaminifu
  rationale: Kitenzi hiki kimetumiwa kwa sitiari kuhusu kutokuwa mwaminifu kwa Mungu, si lazima ukahaba halisi. Tafsiri hii huwasilisha maana kuu kwa lugha wazi huku tanbihi ikihifadhi picha halisi ya Kiebrania.
- source_word: מִמֶּךָּ
  choice: kwako
  rationale: Pamoja na זנה, kihusishi kinaonyesha Mungu kuwa ndiye ambaye watu hao wamemwasi kwa kutokuwa waaminifu; Kiswahili cha kawaida husema “kutokuwa waaminifu kwako.”
theological_decisions:
- issue: Maana ya kisitiari ya זנה kuhusiana na Mungu
  choice: Kutokuwa waaminifu kwa Mungu
  alternative: Kufanya ukahaba kwa kujitenga nawe
  rationale: Katika Biblia ya Kiebrania, זנה inaweza kuonyesha uasi au kutokuwa waaminifu katika uhusiano wa agano. Muktadha huu unatofautisha kuwa karibu na Mungu na kuwa mbali naye. Maana hiyo imetolewa katika matini, huku sitiari yenyewe ikihifadhiwa katika tanbihi.
- issue: Wakati wa הִצְמַתָּה
  choice: umeangamiza
  alternative: unaangamiza
  rationale: Umbo la Kiebrania ni timilifu. Linaweza kueleweka kama jambo lililofanywa au kama uhakika wa hukumu; kutafsiri kwa wakati timilifu huhifadhi umbo hilo na mvutano wake bila kuligeuza kuwa kauli ya kawaida ya wakati wa sasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na mtiririko wa kishairi. “Tazama” imehifadhiwa kwa msisitizo, na mistari miwili inaakisi ulinganifu wa shairi la Kiebrania.
