  text: וָֽ֭/אֲחַשְּׁבָ/ה לָ/דַ֣עַת זֹ֑את עָמָ֖ל היא בְ/עֵינָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/016.yaml
  text: But when I thought to understand this[a], it was trouble in my eyes.
translation:
  language: sw
  text: Lakini nilipojaribu kulielewa hili[a], lilikuwa taabu machoni pangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lakini nilipofikiri kulijua hili, lilikuwa kazi ngumu machoni pangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲחַשְּׁבָה
  choice: nilipojaribu
  rationale: Kitenzi חשׁב kina maana ya kufikiri, kuzingatia, au kupanga; pamoja na kitenzi-jina לָדַעַת hapa kinaonyesha juhudi ya kiakili. ‘Nilipojaribu’ ni Kiswahili cha kawaida kinacholeta wazi juhudi hiyo, huku ‘lakini’ ikiwakilisha uhusiano wa kupingana katika muktadha.
- source_word: לָדַעַת
  choice: kulielewa
  rationale: Ingawa ידע kwa kawaida ni ‘kujua,’ hapa maana yake ni kulifahamu au kulielewa jambo linalomtatiza mwandishi. Kiambishi ‘-li-’ kinarejelea ‘hili.’
- source_word: זֹאת
  choice: hili
  rationale: Kiwakilishi hiki cha kuonyesha kinarejelea jambo lililotangulia bila kulitaja upya, sawa na Kiebrania.
- source_word: עָמָל
  choice: taabu
  rationale: עמל inaweza kumaanisha kazi ngumu, taabu, au uchovu. ‘Taabu’ huhifadhi uzito na ugumu wa juhudi ya kiakili kwa lugha ya kawaida na yenye hadhi.
- source_word: הִיא
  choice: lilikuwa
  rationale: 'Kiwakilishi cha kike kinarejelea זאת; Kiswahili hutumia upatanisho wa ngeli ya ‘jambo’ lililodokezwa: ‘hili ... lilikuwa.’'
- source_word: בְּעֵינַי
  choice: machoni pangu
  rationale: Hii huhifadhi taswira halisi ya Kiebrania, ‘machoni mwangu,’ kwa umbo la Kiswahili linaloeleweka, likimaanisha pia ‘kwa maoni yangu’ au ‘kwangu.’
theological_decisions: []
