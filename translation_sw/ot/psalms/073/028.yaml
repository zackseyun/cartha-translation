  text: וַ/אֲנִ֤י קִֽרֲבַ֥ת אֱלֹהִ֗ים לִ֫/י ט֥וֹב שַׁתִּ֤י בַּ/אדֹנָ֣/י יְהֹוִ֣ה מַחְסִ֑/י לְ֝/סַפֵּ֗ר כָּל מַלְאֲכוֹתֶֽי/ךָ׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/028.yaml
  text: But as for me[a], the nearness of God is good for me; I have made the Lord GOD my refuge, so that I may tell of all your works.
translation:
  language: sw
  text: Lakini kwangu mimi, ukaribu wa Mungu[a] ni jambo jema; nimemfanya Bwana Yahwe kuwa kimbilio langu, ili niyasimulie matendo yako yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumkaribia Mungu ni jambo jema kwangu.” Nomino ya Kiebrania inaweza kueleweka kuwa ukaribu wa uhusiano na Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Lakini kwangu mimi
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha mkazo na tofauti kati ya mtunga zaburi na waovu waliozungumziwa kabla yake.
- source_word: קִרֲבַת אֱלֹהִים
  choice: ukaribu wa Mungu
  rationale: Tafsiri hii inadumisha muundo wa nomino wa Kiebrania na kutatua kwa kiwango kidogo iwe maana ni ukaribu wa Mungu au kuwa karibu na Mungu; uwezekano wa pili umewekwa katika tanbihi.
- source_word: לִי טוֹב
  choice: ni jambo jema
  rationale: Katika Kiswahili, pamoja na maneno ‘kwangu mimi’ yaliyotangulia, usemi huu unaeleza kwa kawaida kwamba ukaribu huo ni mwema na wenye manufaa kwake.
- source_word: שַׁתִּי
  choice: nimemfanya
  rationale: Katika nahau inayohusisha kimbilio, kitenzi hiki kinaonyesha uamuzi wa kumtegemea Mungu kwa makusudi.
- source_word: בַּאדֹנָי יְהוִה
  choice: Bwana Yahwe
  rationale: ‘Bwana’ linawakilisha cheo אֲדֹנָי, na ‘Yahwe’ linawakilisha jina la Mungu יהוה bila kuleta urudiaji usio wa kawaida wa ‘Bwana Bwana’.
- source_word: מַחְסִי
  choice: kimbilio langu
  rationale: מַחְסֶה ni mahali pa usalama au hifadhi; ‘kimbilio’ ni neno la kawaida na linalofaa katika muktadha wa Zaburi.
- source_word: לְסַפֵּר
  choice: ili niyasimulie
  rationale: ל pamoja na kitenzi-jina hapa kinaeleza kusudi; ‘kuyasimulia’ huwasilisha maana ya kutangaza au kueleza matendo ya Mungu.
- source_word: כָּל מַלְאֲכוֹתֶיךָ
  choice: matendo yako yote
  rationale: ‘Matendo’ linaeleza kwa upana mambo ambayo Mungu amefanya, huku ‘yote’ likidumisha nguvu ya כָּל.
theological_decisions:
- issue: Maana ya קִרֲבַת אֱלֹהִים
  choice: ukaribu wa Mungu
  alternative: kumkaribia Mungu
  rationale: Muundo wa nomino wa Kiebrania unaweza kuhusisha ukaribu wa Mungu au ukaribu wa mtu na Mungu. Matini kuu inadumisha mvutano huo kadiri Kiswahili kinavyoruhusu, na maana ya kitendo cha kumkaribia Mungu imeonyeshwa katika tanbihi.
- issue: Uwasilishaji wa אֲדֹנָי יְהוִה
  choice: Bwana Yahwe
  alternative: Bwana MUNGU
  rationale: Tafsiri hii inatofautisha cheo ‘Bwana’ na jina la agano ‘Yahwe’ na hivyo kuonyesha wazi vipengele vyote viwili vya Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wa sasa na unaoeleweka kwa urahisi. Muundo wa sentensi umewekwa wa kawaida bila kuondoa utata halisi wa kishazi kuhusu ukaribu na Mungu.
