  text: Ndipo nilikuwa mjinga, wala sikujua; nilikuwa kama mnyama[a] pamoja nawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wanyama”; huenda ni usemi wa msisitizo au wa mkusanyo, wenye maana ya “kama mnyama” au “mwenye tabia kama ya mnyama.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ndipo nilikuwa
  rationale: Waw inaunganisha ungamo hili na ufahamu uliotangulia; “ndipo” huonyesha uhusiano huo wa kutafakari kwa Kiswahili cha kawaida.
- source_word: בַעַר
  choice: mjinga
  rationale: Neno hili linaonyesha ukosefu mkubwa wa akili au utambuzi, unaokaribia hali ya kinyama. “Mjinga” ni la sasa, wazi, na lenye nguvu inayofaa katika ungamo la kujishusha.
- source_word: וְלֹא אֵדָע
  choice: wala sikujua
  rationale: Huhifadhi maana ya kawaida ya ידע, “kujua,” bila kuiongezea tafsiri ya “kuelewa”; “wala” huunganisha kwa kawaida maelezo hasi yanayofuatana.
- source_word: בְּהֵמוֹת
  choice: kama mnyama
  rationale: Ingawa umbo la Kiebrania ni la wingi, hapa linaeleweka kwa nguvu ya mkusanyo au msisitizo, likieleza hali ya kuwa kama mnyama. Kiswahili cha umoja hutoa tashbihi hii kwa ufasaha.
- source_word: הָיִיתִי
  choice: nilikuwa
  rationale: Kitenzi kinaeleza hali ya mtunga-zaburi wakati huo, si lazima mchakato wa kugeuka kuwa kitu kingine.
- source_word: עִמָּךְ
  choice: mbele zako
  rationale: Maana ya msingi ni “pamoja nawe,” lakini katika muktadha huu usemi unaeleza hali yake akiwa katika uwepo wa Mungu. “Mbele zako” ni Kiswahili cha asili kinachodumisha mwelekeo wa ungamo kwa Mungu.
theological_decisions:
- issue: Nguvu ya picha ya mnyama katika kujieleza kwa mtunga-zaburi mbele za Mungu
  choice: 'Tashbihi ya kukosa akili: “nilikuwa kama mnyama mbele zako.”'
  alternative: Tafsiri iliyo karibu zaidi na umbo la neno, “nilikuwa kama wanyama pamoja nawe.”
  rationale: Mstari ni ungamo la kukosa utambuzi, si dai la kimafundisho kuhusu asili ya binadamu. Tashbihi inadumisha ukali na unyenyekevu wa picha bila kuipanua kupita ushahidi wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kiungamo; “mjinga” na “kama mnyama” huhifadhi ukali wa kujishusha uliomo katika Kiebrania.
