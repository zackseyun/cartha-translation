lexical_decisions:
- source_word: אֵיךְ
  choice: Jinsi
  rationale: Hutambulisha mshangao wa kishairi kuhusu badiliko lao la kushtua, wala si swali la kutaka habari.
- source_word: הָיוּ לְשַׁמָּה
  choice: walivyogeuka kuwa ukiwa
  rationale: 'Muundo huu unaonyesha matokeo au badiliko la hali: walifikia kuwa ukiwa. Kiswahili hiki kinahifadhi mwendo kutoka hali ya awali hadi uharibifu.'
- source_word: כְרָגַע
  choice: kwa ghafula
  rationale: Kirai hiki kinaonyesha muda mfupi sana na tukio la ghafla; 'kwa ghafula' ni usemi wa kawaida unaobeba mshtuko wa mstari.
- source_word: סָפוּ
  choice: Wameangamia
  rationale: Kitenzi kina maana ya kufikia mwisho au kuondolewa kabisa. 'Wameangamia' ni cha asili na kinafaa katika usambamba wa kishairi.
- source_word: תַמּוּ
  choice: wamekomeshwa
  rationale: Kitenzi cha pili kinakazia ukamilifu wa mwisho uliotajwa na סָפוּ bila kulazimisha taswira maalumu ya jinsi walivyoangamia.
- source_word: מִן בַּלָּהוֹת
  choice: na vitisho
  rationale: מִן hapa inaweza kueleza kisababishi au chombo cha mwisho wao; 'na vitisho' huhifadhi uhusiano huo huku בלהות ikitafsiriwa kama mambo ya kutisha.
