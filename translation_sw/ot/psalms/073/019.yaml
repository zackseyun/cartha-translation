  text: How they became a desolation in a moment! They came to an end[b][a]; they were consumed by terrors.
translation:
  language: sw
  text: Jinsi walivyogeuka kuwa ukiwa kwa ghafula! Wameangamia, wamekwisha kwa vitisho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wamekwisha kabisa kwa sababu ya mambo ya kutisha.”
