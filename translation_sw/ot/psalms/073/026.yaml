  text: כָּלָ֥ה שְׁאֵרִ֗/י וּ/לְבָ֫בִ֥/י צוּר לְבָבִ֥/י וְ/חֶלְקִ֗/י אֱלֹהִ֥ים לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/026.yaml
  text: My flesh and my heart may fail[b][a], but God is the rock of my heart and my portion forever.
translation:
  language: sw
  text: Mwili wangu na moyo wangu vinaweza kudhoofika[a], lakini Mungu ndiye mwamba wa moyo wangu[b] na fungu langu milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwili wangu na moyo wangu hudhoofika”; kitenzi cha Kiebrania kinaweza kuonyesha hali ya sasa au maana ya jumla ya kudhoofika, kuisha, au kufikia mwisho.
    reason: lexical_alternative
  - marker: b
    text: Au, “Mungu ndiye nguvu ya moyo wangu.” Kiebrania kinasema kihalisi zaidi, “Mungu ndiye mwamba wa moyo wangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלָה
  choice: vinaweza kudhoofika
  rationale: Kitenzi kinaweza kumaanisha kuisha, kudhoofika, au kufikia mwisho. Katika muktadha wa mwili na moyo, “kudhoofika” ni Kiswahili cha kawaida; “vinaweza” kinahifadhi uwezekano wa maana ya jumla bila kuifanya hali hiyo kuwa ya wakati mmoja tu.
- source_word: שְׁאֵרִי
  choice: mwili wangu
  rationale: Ingawa neno hili linaweza kumaanisha nyama ya mwili au jamaa katika miktadha mingine, hapa kuunganishwa kwake na “moyo wangu” kunaonyesha utu wa kimwili wa mtunga zaburi.
- source_word: לְבָבִי
  choice: moyo wangu
  rationale: “Moyo” ni tafsiri ya kawaida na wazi ya neno linaloweza kuhusisha utu wa ndani, mawazo, na nia. Kurudiwa kwa neno hili kunahifadhi mkazo wa kishairi.
- source_word: צוּר
  choice: mwamba
  rationale: Neno hili humaanisha mwamba na linapotumiwa kumhusu Mungu huonyesha uimara na usalama. Taswira halisi imehifadhiwa badala ya kufupishwa kuwa dhana ya “nguvu.”
- source_word: חֶלְקִי
  choice: fungu langu
  rationale: “Fungu” linaonyesha sehemu aliyogawiwa mtu na linafaa kwa taswira ya Mungu kuwa sehemu au urithi wa kudumu wa mtunga zaburi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hapa neno hili linamtaja Mungu wa Israeli katika ungamo la moja kwa moja.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Neno hili linaonyesha kudumu bila mwisho; “milele” ni usemi wa kawaida, wazi, na wenye hadhi katika Kiswahili.
theological_decisions:
- issue: Lugha kuhusu mwili na utu wa ndani katika kishazi cha kwanza
  choice: Mwili wangu na moyo wangu vinaweza kudhoofika
  alternative: Mwili wangu na moyo wangu hudhoofika / huisha
  rationale: Tafsiri inadumisha tofauti ya kishairi kati ya udhaifu wa mwili na moyo kwa upande mmoja, na Mungu aliye fungu la kudumu kwa upande mwingine. Haibadili “moyo” kuwa dhana finyu ya kisasa kama akili au hisia pekee.
- issue: Taswira ya Mungu katika צוּר
  choice: Mungu ndiye mwamba wa moyo wangu
  alternative: Mungu ndiye nguvu ya moyo wangu
  rationale: Kiebrania kinatumia taswira halisi ya mwamba. Kuihifadhi kunaacha maana zake za uimara, usalama, na kutegemewa ziendelee pamoja bila kuzipunguza kuwa “nguvu” pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na urudiaji wa “moyo wangu” umehifadhiwa; “ndiye” huweka mkazo wa ungamo kwa njia ya kawaida katika Kiswahili.
