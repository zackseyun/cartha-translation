  text: Nao husema[a], “Mungu ajuaje? Je, Aliye Juu Sana ana maarifa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Nao walisema,” ikiwa kauli timilifu ya Kiebrania inaeleweka kuwa wakati uliopita badala ya usemi wa tabia inayorudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Nao husema[a]
  rationale: Kauli timilifu ya Kiebrania inaweza kueleza usemi unaorudiwa katika taswira ya kishairi. ‘Husema’ huonyesha vizuri tabia inayoendelea; tanbihi huhifadhi uwezekano wa wakati uliopita.
- source_word: אֵיכָה
  choice: angejuaje
  rationale: Neno la kuuliza linamaanisha ‘jinsi gani?’ Katika Kiswahili, ‘angejuaje?’ ni swali la kejeli la kawaida na lenye ukali, bila kulifanya dai la moja kwa moja kwamba Mungu hajui.
- source_word: יָדַע אֵל
  choice: Mungu angejuaje?
  rationale: יָדַע ni ‘kujua,’ na אֵל hapa ni cheo cha kawaida cha Mungu. Mpangilio huu ni wa asili katika Kiswahili na huhifadhi swali la kejeli.
- source_word: וְיֵשׁ דֵּעָה
  choice: Je, ... ana ujuzi?
  rationale: Neno la uwepo יֵשׁ pamoja na דֵּעָה huuliza kama ujuzi upo kwa Aliye Juu Zaidi. Kiswahili cha umilikaji kwa ‘ana’ hutoa maana hiyo kwa kawaida huku kikidumisha swali.
- source_word: בְעֶלְיוֹן
  choice: Aliye Juu Zaidi ana ujuzi
  rationale: עֶלְיוֹן ni cheo cha Mungu. Ingawa Kiebrania kwa umbo ni ‘katika Aliye Juu Zaidi,’ hapa kihusishi בְּ huonyesha kuwapo au kumilikiwa kwa ujuzi; ‘ana ujuzi’ ni Kiswahili wazi na cha kawaida.
theological_decisions:
- issue: Tafsiri ya cheo cha Mungu עֶלְיוֹן
  choice: Aliye Juu Zaidi
  alternative: Aliye Mkuu
  rationale: ‘Aliye Juu Zaidi’ huhifadhi wazo la ukuu usio na kifani na kutambulisha wazi cheo cha Mungu bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Nguvu ya maswali kuhusu ujuzi wa Mungu
  choice: Kuyahifadhi kama maswali ya kejeli
  alternative: Kuyatafsiri kama madai kwamba Mungu hajui
  rationale: Kiebrania kina maswali mawili; kuyafanya madai ya moja kwa moja kungeondoa mvutano na umbo la usemi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nao husema’ huendeleza taswira ya tabia; ‘angejuaje?’ ni swali la kejeli linaloeleweka kwa urahisi. Alama ya tanbihi [a] imewekwa mara moja katika matini.
