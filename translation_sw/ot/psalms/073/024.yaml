base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/024.yaml
  text: With your counsel you guide me[a], and afterward you will receive me to glory.
translation:
  language: sw
  text: Kwa shauri lako unaniongoza, na baadaye utanichukua katika utukufu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na baadaye utanipokea kwa heshima.”
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲצָתְךָ
  choice: Kwa shauri lako
  rationale: Neno עֵצָה humaanisha shauri, ushauri, au mpango; kiambishi ב hapa kinaonyesha njia au chombo ambacho Mungu hutumia kumwongoza mtunga zaburi.
- source_word: תַנְחֵנִי
  choice: unaniongoza
  rationale: Hifili ya נחה humaanisha kuongoza au kuelekeza; wakati wa sasa unafaa katika Kiswahili kwa tendo linaloendelea katika muktadha huu.
- source_word: וְאַחַר
  choice: na baadaye
  rationale: אַחַר limetumika kwa maana ya wakati, likionyesha jambo litakalofuata baada ya uongozi wa sasa.
- source_word: כָּבוֹד
  choice: utukufu
  rationale: כָּבוֹד linaweza kumaanisha utukufu au heshima. 'Utukufu' huhifadhi uzito wa juu na uwezekano wa maana ya wakati ujao bila kuufafanua kupita kiasi.
- source_word: תִּקָּחֵנִי
  choice: utanichukua
  rationale: לקח humaanisha kuchukua au kumpokea mtu. 'Utanichukua' linaakisi kitenzi moja kwa moja na, pamoja na 'katika utukufu,' linatoa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya kifungu וְאַחַר כָּבוֹד תִּקָּחֵנִי
  choice: na baadaye utanichukua katika utukufu
  alternative: na baadaye utanipokea kwa heshima
  rationale: Kiebrania ni kifupi na kinaweza kueleweka kuwa kuchukuliwa katika utukufu au kupokewa kwa heshima. Matini kuu inahifadhi usomaji wa 'utukufu,' huku tanbihi ikihifadhi uwezekano wa 'heshima' bila kulazimisha ufafanuzi mmoja wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Shauri' linaeleweka kwa wasomaji wa kawaida na linafaa zaidi hapa kuliko kifungu kizito zaidi kama 'kwa mujibu wa shauri lako.'
