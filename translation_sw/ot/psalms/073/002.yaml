  text: וַ/אֲנִ֗י כִּ֭/מְעַט נטוי רַגְלָ֑/י כְּ֝/אַ֗יִן שפכה אֲשֻׁרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/002.yaml
  text: But as for me[a], my feet had almost stumbled; my steps had nearly slipped.
translation:
  language: sw
  text: 'Lakini mimi[a], miguu yangu ilikuwa karibu iteleze;

    hatua zangu zilikuwa karibu ziteleze.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miguu yangu ilikuwa karibu iache njia; hatua zangu zilikuwa karibu zipoteze mshiko.” Mistari inayolingana katika ushairi wa Kiebrania inaruhusu picha zinazotofautiana kidogo lakini zinazokutana katika wazo la kukosa uthabiti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Lakini mimi
  rationale: Kiunganishi pamoja na kiwakilishi huru huonyesha tofauti na yaliyotangulia na kumkazia msemaji; “Lakini mimi” huhifadhi yote mawili kwa Kiswahili cha kawaida.
- source_word: כִּמְעַט
  choice: ilikuwa karibu
  rationale: Kielezi hiki kinaonyesha jambo lililokaribia sana kutokea. Muundo huu ni wa kawaida na unaeleweka wazi katika Kiswahili.
- source_word: נטוי
  choice: iyumbe
  rationale: Katika muktadha wa miguu, kitenzi kinaonyesha kukosa uthabiti au kuanza kuacha mwelekeo thabiti. “Iyumbe” huhifadhi taswira ya karibu kuanguka bila kuifafanua moja kwa moja kuwa kupoteza imani au kukosea kimaadili.
- source_word: רַגְלָי
  choice: miguu yangu
  rationale: Taswira halisi ya kiungo cha mwili imehifadhiwa; katika ushairi miguu inaweza pia kudokeza uthabiti au mwenendo wa mtu.
- source_word: כְּאַיִן
  choice: ilikuwa karibu
  rationale: Katika nahau hii usemi una nguvu ya “karibu kabisa”; tafsiri hii huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: שָׁפְכָה
  choice: ziteleze
  rationale: Ingawa maana ya msingi ya kitenzi ni kumwaga au kumwagika, pamoja na “hatua” kinatoa picha ya kupoteza mshiko au kuteleza.
- source_word: אֲשֻׁרָי
  choice: hatua zangu
  rationale: Nomino hii hutaja hatua au mwendo; “hatua zangu” ni ya asili katika Kiswahili na huhifadhi sitiari ya mwenendo wa maisha.
theological_decisions:
- issue: Lugha ya kisitiari kuhusu kukosa uthabiti
  choice: Kuhifadhi taswira ya mwili na mwendo—“miguu,” “hatua,” “iyumbe,” na “ziteleze”—bila kueleza matumizi yake ya kiroho moja kwa moja.
  alternative: Kufafanua kuwa msemaji alikuwa karibu kupoteza imani au kuanguka katika dhambi.
  rationale: Mstari unadokeza hali ya kiroho au kimaadili kwa taswira halisi, lakini hautaji wazi aina ya kuanguka. Kuhifadhi sitiari huacha upana na mvutano uliomo katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa mistari miwili umehifadhi usambamba wa kishairi, huku lugha ikibaki wazi kwa msomaji wa kawaida.
