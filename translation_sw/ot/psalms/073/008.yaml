translation:
  language: sw
  text: Wanadhihaki, na husema kwa uovu; kutoka juu husema maneno ya uonevu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wanadhihaki na kusema maovu; kwa majivuno husema maneno ya uonevu.” Kitenzi cha kwanza cha Kiebrania ni kigumu, na “kutoka juu” pia kinaweza kueleza namna ya kiburi (“kwa majivuno”) badala ya mahali.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִיקוּ
  choice: Wanadhihaki
  rationale: Kitenzi hiki ni kigumu na kimeeleweka kwa njia mbalimbali. Katika muktadha wa maneno ya kiburi, “wanadhihaki” kinaonyesha dharau yao bila kukazia maana yenye uhakika mdogo kama “wamepotoka.”
- source_word: וִידַבְּרוּ
  choice: na kusema
  rationale: Kiunganishi pamoja na kitenzi kinaendeleza maelezo ya tabia yao; Kiswahili kinaweza kuacha kurudia kiima baada ya “wanadhihaki.”
- source_word: בְרָע
  choice: kwa uovu
  rationale: Muundo huu unaweza kueleza namna au yaliyomo katika maneno yao. “Kwa uovu” huhifadhi upana wa maana badala ya kuibana kuwa nia mbaya pekee.
- source_word: עֹשֶׁק
  choice: maneno ya uonevu
  rationale: Nomino hii humaanisha uonevu au unyonyaji. Kuunganisha na kitenzi “wanasema” kwa “maneno ya uonevu” ni Kiswahili cha asili na huhifadhi uzito wake wa kijamii na kimaadili.
- source_word: מִמָּרוֹם
  choice: kutoka juu
  rationale: Kwa halisi ni “kutoka mahali pa juu.” Taswira imehifadhiwa kwa sababu inaweza kuonyesha mahali au namna ya kujikweza kwa kiburi.
- source_word: יְדַבֵּרוּ
  choice: wanasema
  rationale: Kurudia kitenzi kunahifadhi msisitizo na muundo sambamba wa Kiebrania.
