  text: until I entered the sanctuaries of God[b][a]; then I understood their end.
translation:
  language: sw
  text: mpaka nilipoingia katika sehemu takatifu za Mungu[a]; ndipo nilipoelewa mwisho wao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali patakatifu pa Mungu.” Kiebrania kina umbo la wingi, “sehemu takatifu,” ambalo huenda likarejelea kwa pamoja sehemu za patakatifu pa Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au, “hatima yao” au “matokeo yao ya mwisho.” Kiebrania huelekeza kwenye hatima au matokeo yao ya mwisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: mpaka
  rationale: Huonyesha kikomo cha kipindi cha kuchanganyikiwa kwa mtunga zaburi na kuanzisha hatua ya mabadiliko.
- source_word: אָבוֹא
  choice: nilipoingia
  rationale: Ingawa umbo la Kiebrania si wakati uliopita moja kwa moja, baada ya עַד linaeleza wakati maalumu wa kuingia; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: אֶל
  choice: katika
  rationale: Pamoja na kitenzi ‘kuingia,’ ‘katika’ huonyesha mwendo wa kuingia ndani ya mahali patakatifu kwa Kiswahili cha kawaida.
- source_word: מִקְדְּשֵׁי אֵל
  choice: maeneo matakatifu ya Mungu
  rationale: Nomino ya Kiebrania iko katika wingi. ‘Maeneo matakatifu’ huhifadhi wingi huo na inaweza kueleweka kwa ujumla kuwa sehemu mbalimbali za eneo takatifu la Mungu.
- source_word: אֵל
  choice: Mungu
  rationale: Hapa אֵל ni jina la kumtaja Mungu; ‘Mungu’ ndiyo tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: אָבִינָה
  choice: ndipo nilipoelewa
  rationale: Kitenzi kinahusu kupata ufahamu au utambuzi. ‘Ndipo’ huonyesha kwa kawaida mfuatano na hatua ya mabadiliko iliyodokezwa na muundo wa Kiebrania.
- source_word: לְאַחֲרִיתָם
  choice: mwisho wao
  rationale: אַחֲרִית hapa huelekeza kwenye mwisho, hatima, au matokeo yao ya mwisho. ‘Mwisho wao’ ni fupi, nzito, na hudumisha upana wa maana.
theological_decisions:
- issue: Iwapo מִקְדְּשֵׁי itafsiriwe kwa umoja wa kimapokeo au kwa wingi wa Kiebrania
  choice: maeneo matakatifu ya Mungu
  alternative: mahali patakatifu pa Mungu
  rationale: Wingi wa maandishi ya Kiebrania umehifadhiwa bila kulazimisha ufafanuzi maalumu wa kiteolojia. Unaweza kumaanisha kwa pamoja sehemu za eneo takatifu la Mungu.
- issue: Maana ya לְאַחֲרִיתָם
  choice: mwisho wao
  alternative: hatima yao / matokeo yao ya mwisho
  rationale: Tafsiri hii inadumisha mvutano wa kifungu kwa kutobainisha kupita kiasi ikiwa kinachokusudiwa ni kifo chao, hukumu yao, au matokeo yao ya mwisho kwa upana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘mpaka … ndipo …’ unaonyesha wazi hatua ya mabadiliko katika hoja ya zaburi. Wingi wa Kiebrania umehifadhiwa katika ‘maeneo matakatifu,’ huku tanbihi ikitoa tafsiri ya kimapokeo ya umoja.
