  yaml_path: translation/ot/psalms/073/007.yaml
  text: Their eyes bulge out from fatness[a]; the imaginations of their heart overflow.
translation:
  language: sw
  text: Macho yao yamechomoza kwa sababu ya unene[a]; mawazo ya mioyo yao yamepita mipaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Macho yao yamejitokeza kutokana na mafuta; mawazo ya moyo wao yamepita kiasi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָא
  choice: yametokeza
  rationale: Kitenzi kimsingi humaanisha ‘kutoka’; pamoja na ‘macho’ kinaonyesha macho yaliyotokeza, huku picha halisi ya Kiebrania ikihifadhiwa.
- source_word: מֵחֵלֶב
  choice: kwa unene
  rationale: חֵלֶב ni ‘mafuta/unene’; hapa inaashiria hali ya kunenepa kwa wingi wa mali au starehe bila kuifanya picha hiyo iwe ‘utajiri’ pekee.
- source_word: עֵינֵימוֹ
  choice: macho yao
  rationale: Ni wingi wenye kiambishi cha nafsi ya tatu wingi; tafsiri hii ni ya moja kwa moja na ya kawaida.
- source_word: עָבְרוּ
  choice: yamevuka mipaka
  rationale: Kitenzi humaanisha ‘kupita’ au ‘kuvuka’; usemi huu unaonyesha kuzidi kiwango na kuhifadhi dhana ya kwenda nje ya mipaka.
- source_word: מַשְׂכִּיּוֹת
  choice: mawazo
  rationale: Neno linaweza kutaja picha, dhana, fikira, au hila za ndani. ‘Mawazo’ ni pana na halilazimishi maana ya mipango miovu wala sanamu.
- source_word: לֵבָב
  choice: mioyo yao
  rationale: Kiebrania kina umoja wa kijumla, lakini Kiswahili cha kawaida hupatanisha wingi wa watu kwa ‘mioyo yao’; ‘moyo’ hapa ni kitovu cha fikira na matamanio.
