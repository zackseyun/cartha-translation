  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka. ‘Yametokeza kwa unene’ huhifadhi taswira ya mwili na pia kidokezo cha maisha ya kupita kiasi; ‘yamevuka mipaka’ huhifadhi maana ya msingi ya עָבְרוּ badala ya kufafanua kupita kiasi.
