base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/010.yaml
  text: Therefore his people turn back here[c][b][a], and waters of fullness are drained by them.
translation:
  language: sw
  text: Kwa hiyo watu wake hurudi hapa[a], na maji tele[b] hukamuliwa na wao[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa hiyo huwarudisha watu wake hapa.” Kitenzi kinaweza kueleweka kuwa “kurudi” au “kurudisha.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, kwa tafsiri ya karibu, “maji ya utele” au “maji ya ujazo”; huenda maana yake ni maji mengi, ingawa taswira hii ni ngumu.
    reason: lexical_alternative
  - marker: c
    text: Au, “maji tele hukamuliwa kwa ajili yao.” Kitenzi na matumizi ya kiwakilishi cha mwisho katika muktadha huu ni magumu; mstari unaweza kueleweka kuwa maji mengi yanatolewa kwa ajili yao badala ya kukamuliwa na wao.
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha matokeo ya maelezo yaliyotangulia na ni cha kawaida katika Kiswahili cha sasa.
- source_word: ישיב
  choice: hurudi
  rationale: Hifili ya שוב inaweza kuwa na maana ya ‘kurudisha’ au, katika muktadha huu mgumu, ‘kurudi.’ ‘Hurudi’ hutoa sentensi inayoeleweka bila kuongeza yambwa ambalo halijatajwa.
- source_word: עַמּוֹ
  choice: watu wake
  rationale: Huhifadhi kiambishi cha nafsi ya tatu umoja bila kuamua ‘wake’ anamhusu nani.
- source_word: הֲלֹם
  choice: hapa
  rationale: Huwakilisha kwa kawaida kielezi cha mahali ‘hapa/kuelekea hapa.’
- source_word: וּמֵי מָלֵא
  choice: na maji tele
  rationale: ‘Maji tele’ ni Kiswahili cha asili kinachowasilisha wingi au ujazo wa maji, huku tanbihi ikihifadhi taswira halisi iliyo ngumu ya ‘maji ya utele/ujazo.’
- source_word: יִמָּצוּ
  choice: humalizwa
  rationale: Nifali ya מצה ina maana ya kukamuliwa, kufyonzwa, au kutolewa mpaka kuisha. ‘Humalizwa’ huhifadhi hali ya kutendwa na kutoa picha inayoeleweka bila kuifanya kuwa kunywa kwa hakika.
- source_word: לָמוֹ
  choice: nao
  rationale: Ikiunganishwa na kitenzi cha kutendwa, ‘nao’ hutoa maana ya ‘kwa kutendwa nao’; uwezekano wa ‘kwa ajili yao’ umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Anayerejelewa na ‘wake’ katika ‘watu wake’
  choice: Rejeleo limeachwa wazi katika matini kuu.
  alternative: Huenda ni watu wa mwovu au watu wa Mungu.
  rationale: Kiambishi cha Kiebrania hakimtambulishi wazi anayerejelewa, na muundo wa aya ni mgumu; kutokitaja kwa uhakika kunahifadhi mvutano wa kifasiri wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo mfupi wa aya na utata wa Kiebrania vimehifadhiwa; tanbihi zinaonyesha njia kuu mbadala bila kulazimisha ufafanuzi wa kimadhehebu.
