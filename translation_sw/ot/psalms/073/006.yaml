  yaml_path: translation/ot/psalms/073/006.yaml
  text: Therefore pride is their necklace[a]; violence covers them like a garment.
translation:
  language: sw
  text: Kwa hiyo kiburi huwapamba kama mkufu; ukatili huwafunika kama vazi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha matokeo yanayotokana na maelezo yaliyotangulia kuhusu waovu.
- source_word: עֲנָקַתְמוֹ
  choice: ni mkufu wao
  rationale: Neno hili linatokana na dhana ya pambo la shingoni; tafsiri hii inadumisha sitiari kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: גַאֲוָה
  choice: kiburi
  rationale: Katika muktadha huu neno lina maana hasi ya kujikweza au majivuno; “kiburi” ni neno la kawaida na lenye uzito unaofaa.
- source_word: יַעֲטָף
  choice: huwafunika
  rationale: Kitenzi kinaeleza kufunika au kuzungushia; “huwafunika” kinaendeleza picha ya vazi na kuonyesha hali yao ya kawaida.
- source_word: שִׁית
  choice: kama vazi
  rationale: Neno linamaanisha vazi au kifuniko. “Kama vazi” linaweka wazi ulinganisho wa kishairi bila kupoteza sitiari.
- source_word: חָמָס
  choice: jeuri
  rationale: Neno hili hujumuisha vurugu na uovu wa kutumia nguvu dhidi ya wengine; “jeuri” ni la asili katika Kiswahili na linafaa katika shtaka hili la kimaadili.
- source_word: לָמוֹ
  choice: wao / huwafunika
  rationale: Kiwakilishi kinawahusu watu wanaoelezwa; kimetolewa kwa “wao” katika mstari wa kwanza na kama yambwa “-wa-” katika kitenzi cha mstari wa pili.
