lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili huvuta fikira za msomaji kwa msisitizo; “Tazama” ni la kawaida, lenye hadhi, na linafaa katika ushairi wa Zaburi.
- source_word: אֵלֶּה רְשָׁעִים
  choice: hawa ndio waovu
  rationale: Kauli hii inawatambulisha kwa msisitizo watu waliotajwa katika muktadha kuwa kundi la waovu.
- source_word: וְשַׁלְוֵי עוֹלָם
  choice: wanaishi kwa raha daima
  rationale: Kirai hiki kinaunganisha hali ya kuwa na raha au usalama na wazo la kudumu. Tafsiri hii inaeleza ustawi wao unaoendelea bila kudai kwamba ni wa milele kabisa.
- source_word: הִשְׂגּוּ חָיִל
  choice: wamezidi kujipatia mali
  rationale: Kitenzi kinaweza kuonyesha kufikia, kupata, au kuongezeka, na חָיִל hapa ina maana ya mali au utajiri. Kauli hii ya Kiswahili inahifadhi wazo la mali inayopatikana na kuongezeka.
theological_decisions:
- issue: Je, עוֹלָם inamaanisha umilele kamili au hali inayoendelea?
  choice: daima
  alternative: milele / kwa muda mrefu
  rationale: Katika malalamiko haya, mtunga-zaburi anaeleza jinsi ustawi wa waovu unavyoonekana kuendelea bila kukoma. “Daima” huhifadhi mkazo huo bila kugeuza usemi wa kishairi kuwa dai la kwamba hali yao itaendelea milele kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa kisasa, wenye hadhi na unaosomeka kwa urahisi. Mpangilio wa kishairi na msisitizo wa “Tazama” umehifadhiwa.
