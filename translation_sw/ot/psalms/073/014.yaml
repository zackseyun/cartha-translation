lexical_decisions:
- source_word: וָאֱהִי
  choice: Kwa maana nili-
  rationale: Waw pamoja na kitenzi hiki kinaendeleza maelezo ya sababu kutoka mstari uliotangulia; “Kwa maana” huonyesha uhusiano huo kwa Kiswahili cha kawaida, huku nafsi ya kwanza na wakati uliopita vikibebwa na kiambishi “nili-” katika kitenzi kinachofuata.
- source_word: נָגוּעַ
  choice: nilitaabishwa
  rationale: Neno hili linaeleza hali ya kupigwa au kuteswa. “Nilitaabishwa” ni pana vya kutosha kujumuisha mateso bila kuyafanya lazima yawe ugonjwa au pigo la kimwili.
- source_word: כָּל הַיּוֹם
  choice: mchana kutwa
  rationale: Nahau hii ya Kiswahili huonyesha kuendelea kwa jambo siku nzima na kuhifadhi msisitizo wa muda katika Kiebrania.
- source_word: וְתוֹכַחְתִּי
  choice: na kuadhibiwa
  rationale: Kiebrania kina nomino yenye maana ya ‘karipio/masahihisho yangu,’ yaani masahihisho aliyoyapata mtunga zaburi. Muundo wa kitenzi “kuadhibiwa” ni wa kawaida zaidi kwa Kiswahili na unaendana na ulinganifu wa mstari bila kuufanya uwe karipio la maneno tu.
- source_word: לַבְּקָרִים
  choice: kila asubuhi
  rationale: Wingi wa ‘asubuhi’ pamoja na kihusishi una maana ya kujirudia; “kila asubuhi” huwasilisha maana hiyo wazi na kwa kawaida.
theological_decisions:
- issue: Aina ya mateso yanayoelezwa
  choice: Lugha pana ya kutaabishwa na kuadhibiwa, bila kubainisha ugonjwa wala ghadhabu ya kuadhibu kosa
  alternative: Pigo la kimwili kama tauni, au karipio la maneno pekee
  rationale: Maneno ya Kiebrania yanaweza kumaanisha kupigwa, kutaabishwa, kukaripiwa, au kusahihishwa. Tafsiri inadumisha mvutano huo bila kuamua kwamba mateso yalikuwa ugonjwa au kwamba yalikuwa maneno pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mchana kutwa” ni nahau inayoeleweka kwa urahisi, na “nilitaabishwa” huepuka kubana maana iwe ugonjwa au pigo la kimwili tu.
