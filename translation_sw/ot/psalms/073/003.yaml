  text: כִּֽי קִ֭נֵּאתִי בַּֽ/הוֹלְלִ֑ים שְׁל֖וֹם רְשָׁעִ֣ים אֶרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/003.yaml
  text: For I was envious of the arrogant when I saw the peace of the wicked[a].
translation:
  language: sw
  text: Maana niliwaonea wivu wenye majivuno nilipoona amani ya waovu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ustawi wa waovu.” Neno la Kiebrania linalotafsiriwa “amani” linaweza pia kumaanisha hali njema, usalama, au kufanikiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Maana
  rationale: Inaonyesha sababu ya kauli iliyotangulia na kuunganisha mstari huu kwa mtiririko wa hoja ya mtunga zaburi.
- source_word: קִנֵּאתִי
  choice: niliwaonea wivu
  rationale: Kitenzi hiki hapa kinaeleza kutamani hali waliyo nayo wengine; usemi huu ni wa kawaida na unaeleweka wazi katika Kiswahili.
- source_word: בַּהוֹלְלִים
  choice: wenye majivuno
  rationale: Neno hili linawahusu watu wanaojisifu na kujiona; ‘wenye majivuno’ linaonyesha msimamo huo wa kiburi kuliko upumbavu wa kiakili tu.
- source_word: שְׁלוֹם
  choice: amani
  rationale: ‘Amani’ huhifadhi maana ya msingi ya neno la Kiebrania, ambalo pia linaweza kumaanisha hali njema, usalama, na ustawi; maana hiyo pana imeelezwa katika tanbihi.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Hili ni neno la kawaida la Kiswahili kwa kundi la kimaadili linalotajwa mara nyingi katika Zaburi na fasihi ya hekima.
- source_word: אֶרְאֶה
  choice: nilipoona
  rationale: Ingawa umbo la Kiebrania si wakati uliopita kwa namna rahisi, katika muktadha linaonyesha tukio lililochochea wivu; ‘nilipoona’ huwasilisha uhusiano huo wa wakati kwa Kiswahili cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. ‘Wenye majivuno’ huepuka maana finyu ya kujisifu kwa maneno pekee, huku ‘amani’ ikihifadhi upana wa neno la Kiebrania kwa msaada wa tanbihi.
