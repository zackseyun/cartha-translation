translation:
  language: sw
  text: Nina nani mbinguni isipokuwa wewe? Na mbali na wewe[a], sitamani chochote duniani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na Kiebrania, “Na pamoja nawe sikutamani chochote duniani.” Kiebrania kina muundo mfupi wa kishairi usiotaja wazi kitu kinachotamaniwa; maana yake ni kwamba mbali na wewe, mtunga zaburi hatamani chochote duniani.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי לִי
  choice: Nina nani
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida uhusiano wa kuwa na mtu unaodokezwa na kauli ya Kiebrania, na unabaki kuwa swali la balagha.
- source_word: בַשָּׁמָיִם
  choice: mbinguni
  rationale: Hurejelea ulimwengu wa mbinguni na kudumisha ulinganifu wake na 'duniani' katika mstari wa pili.
- source_word: וְעִמְּךָ
  choice: Na zaidi yako
  rationale: Kihalisi ni 'na pamoja nawe'; katika ulinganifu huu wa kishairi, 'zaidi yako' huwasilisha wazo la kutokuwa na mwingine au kitu kingine kinachotamaniwa, huku tanbihi ikihifadhi hali ya usemi wa Kiebrania.
- source_word: לֹא חָפַצְתִּי
  choice: sitamani chochote
  rationale: Kauli hasi pamoja na kitenzi חפץ inatolewa kwa Kiswahili cha kawaida kama kukataa kabisa kutamani kitu kingine. Wakati wa sasa unaonyesha msimamo unaoendelea wa mtunga zaburi.
- source_word: בָאָרֶץ
  choice: duniani
  rationale: Hurejelea ulimwengu wa duniani kinyume na mbinguni, badala ya nchi fulani.
theological_decisions:
- issue: Maana ya kipande cha pili cha mstari
  choice: Tamaa ya kipekee kwa Mungu kuliko vitu vyote vya duniani
  alternative: Nikiwa pamoja nawe, sitamani chochote duniani
  rationale: Kiebrania ni kifupi na kina pengo la kishairi. Tafsiri kuu inaonyesha kwamba mtunga zaburi hamtamani yeyote au chochote zaidi ya Mungu, bila kudai jambo pana la kimetafizikia; tanbihi huhifadhi tafsiri ya karibu zaidi na muundo wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi, wa sasa na wenye hadhi. 'Nina nani' ni ya kawaida na ya moja kwa moja; 'mbinguni/duniani' hudumisha ulinganifu wa kishairi.
