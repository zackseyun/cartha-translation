  text: God is known in Judah[b][a]; his name is great in Israel.
translation:
  language: sw
  text: Mungu anajulikana katika Yuda[a]; jina lake[b] ni kuu katika Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu amejidhihirisha katika Yuda.” Umbo la Kiebrania linaweza kumaanisha hali ya “kujulikana” au, katika muktadha huu, maana ya kujidhihirisha.
    reason: lexical_alternative
  - marker: b
    text: “Jina lake” linaweza kumaanisha pia sifa yake au utambulisho wake uliofunuliwa, si jina linalotamkwa tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹדָע
  choice: anajulikana
  rationale: Nifali ya ידע hapa inaweza kuwa na maana ya hali au ya kutendwa, ‘anajulikana.’ Uchaguzi huu unahifadhi usemi mfupi wa kishairi bila kuongeza wazi maana ya kujidhihirisha ambayo haijaonyeshwa moja kwa moja na umbo hilo.
- source_word: בִּיהוּדָה
  choice: katika Yuda
  rationale: Kihusishi ב pamoja na jina hili kinaeleweka kwa kawaida kama ‘katika.’ ‘Yuda’ inaweza kumaanisha eneo au watu, hivyo tafsiri hii inahifadhi uwezekano huo wote.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa neno hili lina umbo la wingi, hapa lina maana ya umoja na linamtaja Mungu wa Israeli.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: ‘Katika’ inalingana na matumizi ya ב na pia inadumisha usambamba wa kishairi kati ya Yuda na Israeli.
- source_word: גָּדוֹל
  choice: kuu
  rationale: Kivumishi hiki humaanisha ‘kuu.’ Tafsiri hiyo inaendeleza muundo wa sentensi wa Kiebrania bila kuugeuza kuwa kitendo kama ‘linatukuzwa.’
- source_word: שְׁמוֹ
  choice: jina lake
  rationale: Hii ndiyo maana ya moja kwa moja. Katika ushairi wa Kiebrania, ‘jina’ linaweza pia kuwakilisha utambulisho wa Mungu uliofunuliwa, sifa yake, au umaarufu wake.
theological_decisions:
- issue: Maana ya ‘jina’ la Mungu
  choice: Kuhifadhi usemi halisi ‘jina lake ni kuu.’
  alternative: sifa yake ni kuu; anaheshimiwa sana
  rationale: Usemi ‘jina lake’ unabaki na uzito wa kibiblia wa utambulisho na sifa ya Mungu iliyofunuliwa, badala ya kuufanya umaanishe umaarufu au heshima pekee.
- issue: Maana ya נוֹדָע kuhusu kujulikana kwa Mungu
  choice: anajulikana
  alternative: amejidhihirisha; amejifanya ajulikane
  rationale: Umbo la Kiebrania linaweza kueleweka kama hali ya kujulikana au, katika muktadha, kama tukio la Mungu kujidhihirisha. Matini kuu inahifadhi maana ya hali, huku tanbihi ikitaja uwezekano mwingine bila kuamua mvutano huo kimyakimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. ‘Anajulikana’ na ‘jina lake ni kuu’ huhifadhi ufupi na usambamba wa mstari wa Kiebrania. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayofafanuliwa.
