  text: You are radiant[a], more majestic than the mountains of prey.
translation:
  language: sw
  text: Wewe unang'aa[a], ni mtukufu kuliko milima ya mawindo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “milima ya nyara.” Neno la Kiebrania linaweza kumaanisha “mawindo” au, kwa maana iliyopanuliwa, “nyara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאוֹר
  choice: unang'aa
  rationale: Neno hili linaonyesha kung'aa kwa nuru au utukufu. Kitenzi “unang'aa” ni cha kawaida, cha kishairi, na hakidokezi kwamba Mungu anapokea nuru kutoka kwingine.
- source_word: אַתָּה
  choice: wewe
  rationale: Kiwakilishi cha nafsi kimetajwa wazi katika Kiebrania kwa mkazo; “wewe” kinahifadhi mkazo huo.
- source_word: אַדִּיר
  choice: una fahari kuliko
  rationale: אַדִּיר linaweza kumaanisha mwenye fahari, adhama, au nguvu. Pamoja na מִן, hapa linaeleweka vizuri kama ulinganisho. “Una fahari kuliko” ni Kiswahili cha asili kinachohifadhi wazo pana la adhama bila kulibana kuwa nguvu pekee.
- source_word: מֵהַרְרֵי
  choice: kuliko milima ya
  rationale: Kiambishi מִן kinaweza kuonyesha ulinganisho au utengano. Baada ya אַדִּיר, maana ya ulinganisho ndiyo inayofaa zaidi, huku uhusiano wa muundo wa “milima ya” ukihifadhiwa.
- source_word: טָרֶף
  choice: mawindo
  rationale: טָרֶף kwa kawaida ni windo lililokamatwa na mnyama, na kwa upanuzi linaweza kumaanisha nyara au mateka. “Mawindo” kinahifadhi taswira hai ya kishairi; maana ya “nyara” imewekwa katika tanbihi.
theological_decisions:
- issue: Maana ya kishazi cha ulinganisho מֵהַרְרֵי טָרֶף
  choice: Mungu ana fahari kuliko “milima ya mawindo.”
  alternative: Mungu anang'aa kutoka milima ya mawindo; au “milima ya nyara.”
  rationale: Muundo wa Kiebrania unaruhusu maana ya kutoka/utengano, lakini matumizi ya מִן baada ya אַדִּיר yanaunga mkono zaidi ulinganisho. Taswira ya kishairi imeachwa bila kuhusishwa kwa lazima na tukio fulani la kihistoria au fundisho maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa “Wewe” unahifadhi mkazo wa kiwakilishi cha Kiebrania; “unang'aa” na “una fahari” ni wazi kwa msomaji wa kawaida.
