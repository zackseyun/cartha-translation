  yaml_path: translation/ot/psalms/076/008.yaml
  text: From heaven you made judgment heard[c][b][a]; the earth feared and was quiet.
translation:
  language: sw
  text: 'Kutoka mbinguni ulifanya hukumu isikike;

    dunia ikaogopa, ikatulia.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikawa kimya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁמַיִם
  choice: Kutoka mbinguni
  rationale: Kihusishi מִן kinaonyesha chanzo, na 'kutoka mbinguni' ni Kiswahili cha kawaida kinachohifadhi chanzo cha juu, cha kimungu.
- source_word: הִשְׁמַעְתָּ
  choice: ulitangaza
  rationale: Hifili ya שׁמע ina maana ya kusababisha jambo lisikiwe. 'Ulitangaza' huwasilisha maana hiyo kwa Kiswahili cha asili bila muundo mzito wa 'ulifanya ... isikiwe'.
- source_word: דִּין
  choice: hukumu yako
  rationale: דִּין hapa ni uamuzi au tendo la Mungu la kuhukumu. Kiwakilishi 'yako' kinaweka wazi kwa kawaida kwamba hukumu inayotangazwa ni ya mhusika 'wewe', ingawa umbo la Kiebrania lenyewe halina kiambishi cha umilikaji.
- source_word: אֶרֶץ
  choice: dunia
  rationale: Ingawa אֶרֶץ yaweza kumaanisha nchi, ulinganisho wa kishairi na mbingu unapendelea maana pana ya dunia.
- source_word: יָרְאָה
  choice: ikaogopa
  rationale: Kitenzi ירא kinaweza kuonyesha hofu au kicho. Katika muktadha wa hukumu, 'ikaogopa' huhifadhi nguvu fupi na ya moja kwa moja ya mstari.
- source_word: וְשָׁקָטָה
  choice: na kutulia
  rationale: שׁקט huonyesha kuwa kimya, kutulia, au kupumzika baada ya msukosuko. 'Kutulia' ni ya asili katika Kiswahili na inaweza kujumuisha ukimya na kukoma kwa vurugu.
theological_decisions:
- issue: Upeo wa אֶרֶץ katika ulinganisho wa mbingu na dunia
  choice: dunia kwa maana ya ulimwengu wa chini kwa upana
  alternative: nchi, labda eneo fulani au nchi ya Israeli
  rationale: Ulinganisho wa 'kutoka mbinguni' na 'dunia' unaonyesha fremu ya ulimwengu mzima; tafsiri pana haiingizi rejeo finyu la kitaifa lisilodaiwa na mstari.
- issue: Hofu au kicho katika יָרְאָה
  choice: ikaogopa
  alternative: ikajawa na kicho
  rationale: Muktadha wa hukumu unaunga mkono hofu halisi, huku neno la asili likibaki na uwezekano wa kicho. 'Ikaogopa' halipunguzi uzito wa mwitikio wa dunia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa mistari unahifadhi mwendo wa chanzo cha hukumu kutoka mbinguni na mwitikio wa dunia.
