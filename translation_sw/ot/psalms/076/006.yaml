  yaml_path: translation/ot/psalms/076/006.yaml
  text: At your rebuke[a], O God of Jacob[b], both chariot and horse were cast into a deep sleep.
translation:
  language: sw
  text: Kwa karipio lako[a], Ee Mungu wa Yakobo, gari la vita na farasi vilizama katika usingizi mzito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kutokana na karipio lako” au “Kwa sababu ya karipio lako.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema “gari la vita na farasi,” usemi wa kishairi unaowakilisha nguvu za kijeshi; wengine huona taswira hiyo kuwa inawahusisha pia waendeshaji au wapanda farasi.
    reason: cultural_note
lexical_decisions:
- source_word: מִגַּעֲרָתְךָ
  choice: Kwa kukemea kwako
  rationale: Kiambishi מִן kinaweza kuonyesha chanzo au sababu. ‘Kwa kukemea kwako’ ni Kiswahili cha kawaida kinachohifadhi uhusiano huo bila kuamua kwa nguvu zaidi kati ya ‘kutokana na’ na ‘kwa sababu ya.’
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: Ee Mungu wa Yakobo
  rationale: Kirai hiki ni cheo cha Mungu na katika muktadha kina nguvu ya mwito wa moja kwa moja; ‘Ee’ huonyesha hilo kwa lugha ya kishairi yenye heshima.
- source_word: נִרְדָּם
  choice: vilitiwa katika usingizi mzito
  rationale: Nifali ya רדם huonyesha kuingizwa katika usingizi mzito au hali ya kulemazwa, si kulala kwa kawaida tu. Umbo la kutendwa linahifadhi nguvu ya Kiebrania.
- source_word: וְרֶכֶב וָסוּס
  choice: gari la vita na farasi
  rationale: Kiebrania kinataja gari la vita na farasi. Tafsiri hii inahifadhi picha halisi badala ya kubadili ‘gari’ kuwa ‘mpanda farasi’ au ‘mwendeshaji.’
theological_decisions:
- issue: Hali ya kushindwa inayoelezwa
  choice: Kukemea kwa Mungu kunafanya nguvu za kijeshi za adui zisiwe na uwezo, kwa kutumia taswira ya usingizi mzito.
  alternative: Taswira inaweza kueleweka kuwa usingizi halisi, au kuwa sitiari ya kifo au maangamizi kamili.
  rationale: Neno נִרְדָּם linadumisha taswira ya usingizi mzito au hali ya kulemazwa. Muktadha wa ushindi wa Mungu unaonyesha kutoweza kwa nguvu za kijeshi, lakini mstari wenyewe haulazimishi tafsiri kuwa usingizi halisi tu wala kutaja kifo waziwazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Gari la vita’ hufafanua רֶכֶב kwa msomaji wa kawaida, na ‘vilitiwa katika usingizi mzito’ hudumisha umbo la kutendwa pamoja na taswira ya kishairi.
