  text: יִ֭בְצֹר ר֣וּחַ נְגִידִ֑ים נ֝וֹרָ֗א לְ/מַלְכֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/012.yaml
  text: He cuts off the spirit of princes[b][a]; he is feared by the kings of the earth.
translation:
  language: sw
  text: Yeye huikomesha roho ya wakuu[a]; ni wa kuogopwa na wafalme wa dunia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huizuia roho ya watawala.” Neno “roho” linaweza pia kumaanisha “pumzi,” “ujasiri,” au “hasira.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ni wa kutisha kwa wafalme wa dunia.”
    reason: alternative_reading
lexical_decisions:
- source_word: יִבְצֹר
  choice: huikomesha
  rationale: Kitenzi בצר hapa kinaonyesha hatua thabiti ya Mungu dhidi ya nguvu au kiburi cha watawala. “Huikomesha” ni Kiswahili cha kawaida kinachoweza kumaanisha kuizuia au kuikata nguvu bila kulazimisha maana kuwa kuwaua.
- source_word: רוּחַ
  choice: roho
  rationale: רוּחַ inaweza kumaanisha roho, pumzi, moyo wa ujasiri, au hasira/tabia. “Roho” inadumisha upana huo wa maana katika matini kuu.
- source_word: נְגִידִים
  choice: wakuu
  rationale: נְגִידִים ni viongozi au watawala wenye cheo. “Wakuu” ni neno la kishairi na lenye heshima, na linasawaziana vizuri na “wafalme” katika mstari unaofuata.
- source_word: נוֹרָא
  choice: ni wa kuogopwa
  rationale: נוֹרָא humweleza Mungu kuwa mwenye kutia hofu kuu. “Ni wa kuogopwa” huhifadhi nguvu ya usemi bila kutumia neno ambalo katika matumizi ya sasa linaweza kueleweka kuwa sifa nyepesi tu.
- source_word: לְמַלְכֵי אָרֶץ
  choice: na wafalme wa dunia
  rationale: 'לְ pamoja na נוֹרָא inaonyesha uhusiano: Mungu ni wa kutisha kwa wafalme, yaani anaogopwa nao. “Na wafalme wa dunia” ni usemi wa asili katika Kiswahili.'
theological_decisions:
- issue: Namna Mungu anavyowatendea watawala
  choice: Mstari unaonyesha kwamba Mungu huikomesha au huivunja nguvu ya ndani, ujasiri, au kiburi cha wakuu wa dunia.
  alternative: Huenda mstari ukamaanisha kwamba Mungu huondoa pumzi au uhai wao, au kwamba huzuia hasira na ujasiri wao.
  rationale: Muungano wa יִבְצֹר na רוּחַ una maana kadhaa zinazowezekana. Muktadha unasisitiza ukuu wa Mungu juu ya watawala, hivyo matini kuu haifungi usemi kwa kifo, hasira, au ujasiri peke yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, katika mtindo wa kishairi ulio wa heshima lakini unaoeleweka kwa msomaji wa kawaida. “Huikomesha” huepuka usemi usio wa kawaida wa “kuikata roho” huku ikihifadhi wazo la hatua thabiti; tanbihi inadumisha utata halisi wa Kiebrania.
