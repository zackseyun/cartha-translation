  language: sw
  text: 'Kwa maana ghadhabu ya binadamu itakusifu;[a]

    kwa ghadhabu iliyosalia utajifunga.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Binadamu” hapa inamaanisha wanadamu kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Au, “ghadhabu iliyosalia utaizuia.” Kiebrania cha kishazi cha mwisho ni kigumu; maandishi makuu yanafuata kwa karibu zaidi usomaji wa Kimasoreti na kuhifadhi sitiari yake.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza hoja kwa kutoa sababu au maelezo ya wito uliotangulia.
- source_word: חֲמַת אָדָם
  choice: ghadhabu ya binadamu
  rationale: “Ghadhabu” huhifadhi uzito wa kishairi wa חֵמָה, na “binadamu” humaanisha wanadamu kwa ujumla bila kuifanya אָדָם kuwa mwanaume mmoja tu.
- source_word: תּוֹדֶךָּ
  choice: itakusifu
  rationale: Hifili ya ידה hapa ina maana ya kusifu; muundo huu pia huhifadhi picha ya kwamba hata ghadhabu ya wanadamu hatimaye humletea Mungu sifa.
- source_word: שְׁאֵרִית חֵמֹת
  choice: ghadhabu iliyobaki
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kile kilichosalia. Ingawa חֵמֹת ni wingi katika Kiebrania, “ghadhabu” kwa kawaida hutumiwa kama nomino isiyohesabika katika Kiswahili.
- source_word: תַּחְגֹּר
  choice: utajifunga
  rationale: Huhifadhi sitiari ya kujifunga kitu kiunoni au mwilini bila kuamua kimabavu ikiwa maana ni kuvaa, kujihami, au kuzuia.
theological_decisions:
- issue: Maana ya kishazi שְׁאֵרִית חֵמֹת תַּחְגֹּר
  choice: 'Mungu ndiye mtendaji: “kwa ghadhabu iliyobaki utajifunga.”'
  alternative: “ghadhabu iliyobaki utaizuia.”
  rationale: Umbo la kitenzi la nafsi ya pili, umoja, jinsi ya kiume kwa kawaida humfanya Mungu kuwa mtendaji. Kwa kuwa kishazi hiki cha Kiebrania ni kigumu, tafsiri kuu hufuata kwa karibu maandishi ya Kimasoreti na kuhifadhi sitiari badala ya kuifafanua kwa namna moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki chenye mtindo wa kishairi ulio wazi na wenye hadhi. “Ghadhabu” imechaguliwa badala ya “hasira” ili kudumisha uzito wa zaburi, huku “binadamu” ikitoa maana ya ujumla kwa lugha ya sasa.
