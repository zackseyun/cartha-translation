translation:
  language: sw
  text: 'Mungu ainukapo kwa hukumu,

    ili awaokoe wanyenyekevu wote wa dunia.[a]


    Sela'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wapole wote wa dunia,” au “wote wanaoteswa duniani.” Neno “dunia” pia linaweza kutafsiriwa “nchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/קוּם
  choice: Mungu aliposimama
  rationale: ב pamoja na kitenzi-jina cha קום ina maana ya wakati. Wakati uliopita unafaa katika muktadha wa karibu, unaosimulia kitendo cha Mungu kilichowafanya maadui watulie.
- source_word: לַ/מִּשְׁפָּט
  choice: ili kuhukumu
  rationale: מִשְׁפָּט hapa ni tendo la Mungu la kutoa hukumu. Kiswahili cha kitenzi kinaunganika kwa kawaida na 'aliposimama' huku kikihifadhi maana ya kimahakama.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania ni la wingi, hapa linamtaja Mungu wa Israeli kwa maana ya umoja.
- source_word: לְ/הוֹשִׁיעַ
  choice: kuwaokoa
  rationale: Hifili ya ישׁע humaanisha kuokoa au kukomboa; 'kuwaokoa' ni ya moja kwa moja na inaeleweka kwa urahisi.
- source_word: כָּל עַנְוֵי
  choice: wanyenyekevu wote
  rationale: עָנָו inaweza kueleza wanyenyekevu, wapole, au wanaoteswa. 'Wanyenyekevu' huhifadhi wazo la hali ya moyo bila kuondoa kabisa unyonge wao; maana nyingine zimetajwa katika tanbihi.
- source_word: אֶרֶץ
  choice: dunia
  rationale: אֶרֶץ inaweza kuwa dunia au nchi. 'Dunia' inafaa kwa upeo mpana unaowezekana wa kishairi, huku 'nchi' ikibaki kuwa tafsiri halali.
- source_word: סֶלָה
  choice: Sela
  rationale: Neno hili lenye kazi isiyo na uhakika, labda ya muziki au ibada, limeandikwa kwa sauti badala ya kufasiriwa kwa kubahatisha.
theological_decisions:
- issue: Maana pana ya עַנְוֵי
  choice: wanyenyekevu
  alternative: wapole au wanaoteswa
  rationale: Neno linaweza kuonyesha unyenyekevu, upole, au hali ya kudhulumiwa. Matini kuu haitakiwi kulifungia katika maana moja ya kijamii au kiroho, kwa hiyo mbadala zimehifadhiwa katika tanbihi.
- issue: Upeo wa אֶרֶץ
  choice: dunia
  alternative: nchi
  rationale: Ushairi unaweza kumaanisha dunia yote au nchi hususa. 'Dunia' imetumiwa katika matini, lakini uwezekano wa 'nchi' umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi na chenye hadhi lakini kinachoeleweka kwa urahisi. Mpangilio wa mistari unaonyesha uhusiano kati ya Mungu kusimama kuhukumu na kusudi la kuwaokoa walio chini.
