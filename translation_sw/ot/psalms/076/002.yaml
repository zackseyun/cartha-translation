  text: Hema lake[b] lilikuwa Salemu[a], na makao yake yalikuwa Sayuni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa mapokeo, Salemu hutambulishwa kuwa Yerusalemu; mstari huu unaweka Salemu sambamba na Sayuni kama majina ya mahali pa makao ya Mungu.
    reason: cross_reference
  - marker: b
    text: Au “kibanda chake,” “mahali pake pa kujisitiri,” au “maskani yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: yalikuwa ... palikuwa
  rationale: Kitenzi היה hapa kinaonyesha kuwapo kwa makao katika maeneo yaliyotajwa. Kiswahili huhitaji upatanisho tofauti kwa “makao” na “mahali,” hivyo kimerudiwa kwa mtiririko wa kawaida.
- source_word: בְשָׁלֵם
  choice: Salemu
  rationale: Jina la mahali שָׁלֵם limehifadhiwa badala ya kufasiriwa moja kwa moja kuwa Yerusalemu, ili kudumisha majina mawili yanayolinganishwa katika ushairi.
- source_word: סֻכּוֹ
  choice: makao yake ya muda
  rationale: סֻכָּה ni kibanda au mahali pa kujisitiri. “Makao ya muda” yanafikisha maana hiyo kwa lugha ya sasa bila kuingiza dhana maalumu ya kiibada ambayo neno lenyewe halilazimishi.
- source_word: וּמְעוֹנָתוֹ
  choice: na mahali pake pa kukaa
  rationale: מְעוֹנָה humaanisha makao au mahali pa kukaa. Usemi huu ni wa kawaida na unaweka wazi maana ya mahali anapokaa.
- source_word: בְצִיּוֹן
  choice: Sayuni
  rationale: Jina צִיּוֹן limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
theological_decisions:
- issue: Uhusiano kati ya Salemu na Sayuni
  choice: Majina yote mawili yamehifadhiwa kama majina tofauti katika mstari mkuu.
  alternative: Kutafsiri Salemu kuwa Yerusalemu na hivyo kufanya utambulisho huo uwe wazi katika mstari mkuu.
  rationale: Kiebrania kinatumia Salemu na Sayuni kwa ulinganifu wa kishairi. Kuyahifadhi yote mawili huepuka kutatua kimafafanuzi uhusiano ambao mstari wenyewe unauacha katika muundo wa ushairi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Makao yake ya muda” kimetumiwa kuonyesha hali ya סֻכָּה kama kibanda au kivuli bila kutumia istilahi nzito ya kiibada; alama za tanbihi zimewekwa baada ya “Salemu” kwa kufuata mpangilio wa matini ya mashauriano.
