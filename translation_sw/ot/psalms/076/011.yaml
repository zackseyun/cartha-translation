  text: נִֽדֲר֣וּ וְ/שַׁלְּמוּ֮ לַ/יהוָ֪ה אֱֽלֹהֵ֫י/כֶ֥ם כָּל סְבִיבָ֑י/ו יוֹבִ֥ילוּ שַׁ֝֗י לַ/מּוֹרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/011.yaml
  text: Make vows to Yahweh your God and fulfill them[b][a]; let all around him bring tribute to the Fearsome One.
translation:
  language: sw
  text: Wekeni nadhiri kwa Yahweh, Mungu wenu, na mzitimize; wote wanaomzunguka wamletee ushuru[a] Mwenye Kuogopwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “zawadi” au “kipawa.” Neno la Kiebrania שַׁי linaweza kumaanisha zawadi inayotolewa kwa mkuu anayeheshimiwa; “ushuru” hudokeza pia heshima na mamlaka ya kifalme.
    reason: lexical_alternative
  - marker: b
    text: Au “Anayestahili kuogopwa” au “Mwenye Kutisha.” Jina hili la cheo la Kiebrania linasisitiza kwamba Mungu ndiye anayepaswa kuogopwa na kustahiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדֲרוּ
  choice: Wekeni nadhiri
  rationale: Kitenzi cha agizo kwa wingi kinawaita wasikilizaji kuweka nadhiri; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: וְשַׁלְּמוּ
  choice: na mzitimize
  rationale: Kitenzi kina maana ya kulipa au kukamilisha nadhiri. Kiwakilishi “-zi-” kinarejelea wazi nadhiri zilizotajwa.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: kwa Yahweh, Mungu wenu
  rationale: Jina la agano יהוה limetoholewa kuwa “Yahweh,” nalo אֱלֹהֵיכֶם linabainisha kwamba yeye ni Mungu wao.
- source_word: כָּל סְבִיבָיו
  choice: wote wanaomzunguka
  rationale: Kirai kinawahusu watu au mataifa yaliyo kumzunguka, kama inavyoonyeshwa na kitenzi cha wingi; tafsiri hii haikifungi kwa kundi moja maalumu.
- source_word: יוֹבִילוּ
  choice: na wamletee
  rationale: Katika muktadha wa kuwasilisha zawadi kwa mkuu, kitenzi kina maana ya kuleta au kupeleka; “wamletee” pia humweka mpokeaji wazi.
- source_word: שַׁי
  choice: ushuru
  rationale: Neno linaweza kumaanisha zawadi inayowasilishwa kwa mkuu anayeheshimiwa. “Ushuru” hudokeza heshima na mamlaka ya kifalme bila kuondoa uwezekano wa maana ya zawadi.
- source_word: לַמּוֹרָא
  choice: Mwenye Kuogopwa
  rationale: Nomino hii inatumiwa kama jina la cheo la Mungu na humwonyesha kuwa anayestahili kuogopwa kwa sababu ya enzi yake ya kutisha.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la agano; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Jinsi ya kueleza לַמּוֹרָא kama jina la cheo la Mungu
  choice: Mwenye Kuogopwa
  alternative: Mwenye Kutisha; Anayestahili kuogopwa
  rationale: Uteuzi huu huhifadhi wazo kwamba Mungu ndiye anayelengwa na hofu na kicho, bila kulainisha uzito wa kishairi wa mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa agizo umehifadhiwa, huku viwakilishi vikifanya uhusiano wa nadhiri na utimizaji wake uwe wazi. Herufi kubwa katika “Mwenye Kuogopwa” zinaonyesha matumizi yake kama jina la cheo.
