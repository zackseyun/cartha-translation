  text: For the choirmaster[a]; with stringed instruments. A psalm of Asaph[b], a song.
translation:
  language: sw
  text: Kwa kiongozi wa waimbaji; kwa ala za nyuzi. Zaburi ya Asafu[a], wimbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kauli “ya Asafu” inaweza kumaanisha kwamba Asafu ndiye mwandishi, kwamba zaburi hii inahusiana na kundi la waimbaji wa Asafu, au kwamba iliwekwa wakfu kwake.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongozaji wa waimbaji
  rationale: Katika vichwa vya zaburi, neno hili humaanisha mtu anayesimamia uimbaji au utendaji wa muziki. Kauli hii ni ya kawaida, inaeleweka, na haifanyi maana yake kuwa ‘kiongozi’ kwa ujumla.
- source_word: בִּנְגִינֹת
  choice: kwa vinanda
  rationale: Neno hili huelekeza kwenye muziki au vyombo vya nyuzi. ‘Kwa vinanda’ ni usemi mfupi wa kimuziki unaofaa kichwa cha zaburi na hauamui isivyo lazima kama vyombo hivyo vinaandamana na uimbaji au vinapigwa peke yake.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ndilo jina la kawaida la utungo wa aina hii, na linatofautishwa na neno linalofuata, ‘wimbo’.
- source_word: לְאָסָף
  choice: ya Asafu
  rationale: Kihusishi cha Kiebrania kinaweza kuonyesha uandishi, uhusiano, umilikaji, au kuwekwa wakfu. ‘Ya Asafu’ ni kifupi na huhifadhi upana huo wa maana.
- source_word: שִׁיר
  choice: wimbo
  rationale: Neno hili ni jina la pili la aina ya utungo. Kulitafsiri tofauti na ‘Zaburi’ huhifadhi mfuatano wa majina hayo mawili katika Kiebrania.
theological_decisions:
- issue: Uhusiano wa Asafu na zaburi
  choice: Zaburi ya Asafu
  alternative: Zaburi iliyoandikwa na Asafu
  rationale: Chanzo hakilazimishi dhana ya kwamba Asafu mwenyewe ndiye mwandishi; kinaweza pia kuhusisha kundi lake la waimbaji au wakfu kwake. Tafsiri imeacha jambo hilo wazi.
translation_notes:
  register: Lugha ni fupi na yenye hadhi kama inavyofaa kichwa cha zaburi. ‘Mwongozaji wa waimbaji’ ni Kiswahili cha sasa kinachoeleweka zaidi kuliko cheo cha kijumla kama ‘mkuu’; ‘vinanda’ huhifadhi muktadha wa vyombo vya nyuzi.
