  yaml_path: translation/ot/psalms/076/005.yaml
  text: The stouthearted were plundered; they slept their sleep[a], and none of the men of valor could find their hands.
translation:
  language: sw
  text: 'Wenye moyo thabiti waliporwa;

    walilala usingizi wao,

    wala hakuna hata mmoja wa mashujaa

    aliyeweza kutumia mikono yake.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu, “wala hakuna hata mmoja wa mashujaa aliyeipata mikono yake,” yaani, hawakuwa na uwezo wa kutenda.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁתּוֹלְלוּ
  choice: waliporwa
  rationale: Kitenzi hiki, kinachotokana na mzizi שלל, kinaonyesha kwamba watu hao wenye nguvu ndio walioporwa au kunyang'anywa. “Waliporwa” ni ya kawaida na inafaa muktadha wa kijeshi.
- source_word: אַבִּירֵי לֵב
  choice: wenye moyo thabiti
  rationale: Kirai hiki kwa karibu ni “wenye nguvu moyoni.” Uchaguzi huu unahifadhi wazo la ujasiri na uthabiti wa ndani bila kulifanya kuwa kiburi ambacho hakijasemwa wazi.
- source_word: נָמוּ שְׁנָתָם
  choice: walilala usingizi wao
  rationale: Tafsiri hii inadumisha uradidi na taswira ya kishairi ya Kiebrania, huku ikiacha wazi kama usingizi huo ni kifo au hali inayofanana na kifo.
- source_word: אַנְשֵׁי חַיִל
  choice: mashujaa
  rationale: Katika muktadha huu wa vita, neno hili linamaanisha wanaume wenye nguvu na ushujaa wa kivita. “Mashujaa” ni fupi, asilia, na wazi kwa msomaji wa Kiswahili.
- source_word: וְלֹא מָצְאוּ ... יְדֵיהֶם
  choice: hakuna hata mmoja ... aliyeweza kuitumia mikono yake
  rationale: Kwa neno ni “hawakuipata mikono yao,” lakini ni nahau inayomaanisha kushindwa kutenda au kutiwa nguvu. Kiswahili cha moja kwa moja “hawakuipata mikono yao” kingekuwa kisichoeleweka; tafsiri hii inatoa maana ya nahau huku tanbihi ikihifadhi taswira halisi.
theological_decisions:
- issue: Maana ya “usingizi wao”
  choice: Kuacha usemi huo bila kuongeza “wa mauti”
  alternative: “Walilala usingizi wa mauti”
  rationale: Muktadha unaelekeza kwa nguvu kwenye kushindwa kunakoishia katika kifo, lakini neno “mauti” halipo wazi katika Kiebrania. Tafsiri haipaswi kuondoa utata huo wa kishairi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. Mpangilio wa mistari unafuata vipande vya ushairi wa Kiebrania. Taswira ya “walilala usingizi wao” imehifadhiwa, lakini nahau ya mikono imetolewa kwa Kiswahili kinachoeleweka na maana yake halisi kuwekwa katika tanbihi.
