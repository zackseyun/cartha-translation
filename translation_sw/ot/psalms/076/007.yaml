  text: אַתָּ֤ה נ֥וֹרָא אַ֗תָּה וּ/מִֽי יַעֲמֹ֥ד לְ/פָנֶ֗י/ךָ מֵ/אָ֥ז אַפֶּֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/007.yaml
  text: You—you are to be feared[a]; and who can stand before you from the time of your anger[b]?
translation:
  language: sw
  text: Wewe—ndiwe wa kuogopwa[a]; na ni nani awezaye kusimama mbele zako tangu wakati wa hasira yako[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “wa kutisha” au “wa kustaajabisha”; Kiebrania: “wa kuogopwa.”'
    reason: lexical_alternative
  - marker: b
    text: Au “tangu hasira yako” au “hasira yako ilipoanza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹרָא
  choice: wa kuogopwa
  rationale: Kivumishi hiki huonyesha anayestahili kuogopwa na anayezua hofu au kicho. “Wa kuogopwa” huhifadhi nguvu ya kiarifu na pia mvutano kati ya hofu na kicho.
- source_word: וּמִי
  choice: na ni nani
  rationale: Kiunganishi pamoja na kiulizi kinatafsiriwa kwa kawaida kuwa “na ni nani,” bila kuongeza maana ya upinzani isiyolazimishwa na Kiebrania.
- source_word: יַעֲמֹד לְפָנֶיךָ
  choice: awezaye kusimama mbele zako
  rationale: 'Katika swali hili la balagha, kitenzi kinaonyesha uwezekano au uwezo: hakuna anayeweza kustahimili akiwa mbele za Mungu.'
- source_word: מֵאָז
  choice: tangu wakati wa
  rationale: Huhifadhi maana ya muda inayoanzia wakati fulani, bila kuibadili kimyakimya kuwa tu “wakati” au kueleza wazi kwamba hasira iliwaka.
- source_word: אַפֶּךָ
  choice: hasira yako
  rationale: Ingawa maana halisi ya neno ni “pua yako,” hapa ni sitiari ya kawaida ya Kiebrania kwa hasira. “Hasira yako” ni wazi na ya sasa.
- source_word: אַתָּה ... אַתָּה
  choice: Wewe—ndiwe
  rationale: Muundo huu wa Kiswahili huonyesha msisitizo wa kurudiwa kwa kiwakilishi bila kuongeza wazo la upekee lisilotajwa moja kwa moja.
theological_decisions:
- issue: Asili ya kumwogopa Mungu
  choice: wa kuogopwa
  alternative: wa kutisha; wa kustaajabisha
  rationale: Chaguo hili huhifadhi uzito wa hofu na kicho mbele za Mungu bila kuifanya maana kuwa ugaidi pekee au mshangao dhaifu.
- issue: Nguvu ya usemi wa wakati katika מֵאָז אַפֶּךָ
  choice: tangu wakati wa hasira yako
  alternative: tangu hasira yako; hasira yako inapowaka
  rationale: Tafsiri kuu huhifadhi sintofahamu ya muundo wa Kiebrania kuhusu mwanzo au kipindi cha hasira, badala ya kueleza wazi jambo ambalo matini haijasema moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi na chenye heshima lakini kinachoeleweka kwa msomaji wa kawaida. Alama ya mkato mrefu katika “Wewe—ndiwe” huhifadhi msisitizo wa Kiebrania; “mbele zako” ni usemi wa kawaida wa kibiblia usio wa kizamani kupita kiasi.
