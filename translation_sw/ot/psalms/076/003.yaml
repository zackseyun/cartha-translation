translation:
  language: sw
  text: Huko alivunja mishale ya upinde inayometameta[a], ngao, upanga, na vita[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mishale ya upinde inayowaka.” Kwa maana halisi, Kiebrania kina taswira ya “miali” au “mimuliko ya upinde”—yaani mishale ikielezwa kwa taswira ya kishairi yenye mng'ao.
    reason: lexical_alternative
  - marker: b
    text: Au, “pigano” au “shughuli ya kivita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמָּה
  choice: Huko
  rationale: Kielezi cha mahali kinarejelea mahali palipotajwa katika muktadha uliotangulia bila kulitaja tena.
- source_word: שִׁבַּר
  choice: alivunja
  rationale: Kitenzi cha Piel kinaonyesha kuvunja kwa nguvu na kwa uamuzi; ‘alivunja’ ni cha kawaida na chenye hadhi katika Kiswahili.
- source_word: רִשְׁפֵי קָשֶׁת
  choice: mishale ya upinde yenye miali
  rationale: Kirai kinataja mishale ya upinde huku kikihifadhi taswira ya רשף ya mwali au mmuliko; tanbihi inadumisha uwezekano wa kuelewa mishale inayowaka.
- source_word: מָגֵן
  choice: ngao
  rationale: Neno la kawaida la Kiswahili kwa kifaa hiki cha kujikinga vitani.
- source_word: וְחֶרֶב
  choice: upanga
  rationale: Tafsiri ya moja kwa moja na ya kawaida katika orodha ya silaha.
- source_word: וּמִלְחָמָה
  choice: na vita
  rationale: מִלְחָמָה inaweza kumaanisha vita, pigano, au shughuli ya kivita; ‘vita’ ni ya asili na inadumisha upeo mpana.
- source_word: סֶלָה
  choice: Sela
  rationale: Unukuzi wa jadi umehifadhiwa kwa sababu maana kamili ya alama hii ya kiliturujia au kimuziki haijulikani kwa hakika.
theological_decisions:
- issue: Mtendaji asiyeandikwa wazi wa kitenzi cha nafsi ya tatu, umoja, kiume
  choice: Kiima kimeachwa ndani ya kitenzi ‘alivunja,’ kikirejelea Mungu kutokana na muktadha.
  alternative: Kutaja wazi ‘Mungu alivunja.’
  rationale: Kiebrania hakitaji kiima wazi katika mstari huu. Kiswahili kinaweza kukiacha ndani ya kitenzi na hivyo kuhifadhi muundo wa chanzo bila kuficha kwamba muktadha unamtambulisha Mungu kuwa mtendaji.
- issue: Taswira ya רִשְׁפֵי קָשֶׁת
  choice: mishale ya upinde yenye miali
  alternative: mishale ya upinde; mishale ya upinde inayowaka
  rationale: Uamuzi huu unahifadhi kwa kiasi taswira ya mwali au mmuliko na wakati huohuo unaweka wazi kwamba kinachokusudiwa ni mishale; tanbihi inaonyesha uwezekano mwingine halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Orodha fupi ya silaha na vita imehifadhiwa, pamoja na utata wa taswira ya mishale na maana ya מִלְחָמָה.
