  text: יֵבֹ֤שׁוּ כָּל עֹ֬בְדֵי פֶ֗סֶל הַ/מִּֽתְהַלְלִ֥ים בָּ/אֱלִילִ֑ים הִשְׁתַּחֲווּ ל֝/וֹ כָּל אֱלֹהִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/007.yaml
  text: Let all who serve carved images be put to shame[a], those who boast in idols; bow down to him, all gods.
translation:
  language: sw
  text: 'Waaibike wote wanaozitumikia sanamu zilizochongwa,

    wanaojivunia sanamu zisizo na maana;

    msujudieni yeye, enyi miungu yote.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “enyi viumbe wote wa mbinguni,” au “enyi malaika wote.” Kiebrania kinasema “miungu yote”; huenda hii ni kauli ya dhihaka kuhusu miungu ya mataifa, au inarejelea viumbe wa mbinguni walio mbele za BWANA.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: Waaibishwe
  rationale: Kauli hii huhifadhi nguvu ya namna ya matakwa ya kitenzi na wazo la kuaibishwa hadharani, badala ya kueleza tu hali ya kuona aibu.
- source_word: עֹבְדֵי
  choice: wanaozitumikia
  rationale: Kitenzi עבד hapa kina maana ya kutumikia katika muktadha wa ibada; ‘kuzitumikia’ huhifadhi maana ya msingi huku muktadha ukionyesha huduma ya kidini.
- source_word: פֶסֶל
  choice: sanamu za kuchonga
  rationale: Neno hili linataja hasa sanamu iliyotengenezwa kwa kuchongwa; tafsiri hii ni sahihi zaidi kuliko ‘sanamu’ peke yake.
- source_word: הַמִּתְהַלְלִים
  choice: wanaojivunia
  rationale: Muundo wa Hitpael wa הלל hapa unaonyesha kujisifu au kujivunia; ‘wanaojivunia’ ni Kiswahili cha kawaida na huendana na kirai kinachotangulia.
- source_word: בָּאֱלִילִים
  choice: sanamu zisizo na maana
  rationale: אֱלִילִים lina dharau ya vitu visivyo na thamani au uwezo. ‘Sanamu zisizo na maana’ huwasilisha dharau hiyo na pia hutofautisha neno hili na פֶסֶל katika mstari wa kwanza.
- source_word: הִשְׁתַּחֲווּ
  choice: msujudieni
  rationale: Kitenzi kinaonyesha kuinama au kujitupa chini kwa heshima na ibada. ‘Msujudieni’ ni cha asili na huhifadhi maana ya tendo hilo.
- source_word: לוֹ
  choice: yeye
  rationale: Kiambishi hiki kinaelekeza tendo kwa mhusika wa kiume aliyetajwa katika muktadha, yaani BWANA; katika ‘msujudieni yeye’ mwelekeo huo uko wazi.
- source_word: אֱלֹהִים
  choice: miungu
  rationale: Wingi wa אֱלֹהִים umetafsiriwa moja kwa moja kuwa ‘miungu’ ili kuhifadhi lugha na mvutano wa kitheolojia wa Kiebrania bila kuamua kimya-kimya kuwa ni viumbe wa mbinguni.
theological_decisions:
- issue: Marejeo ya כָּל אֱלֹהִים
  choice: enyi miungu wote
  alternative: enyi viumbe wote wa mbinguni; enyi malaika wote
  rationale: Kiebrania kinasema moja kwa moja ‘miungu wote.’ Kauli hiyo inaweza kuwa dhihaka dhidi ya miungu ya mataifa au kurejelea viumbe wa mbinguni walio mbele za BWANA. Maandishi makuu yanahifadhi usemi halisi, na tanbihi inaonyesha uwezekano mwingine bila kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mistari mitatu inafuata usambamba wa Kiebrania. ‘Msujudieni’ linafanya agizo la wingi liwe wazi, huku ‘yeye’ likisisitiza mlengwa.
