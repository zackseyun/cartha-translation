id: PSA.97.1
reference: Psalms 97:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: יְהוָ֣ה מָ֭לָךְ תָּגֵ֣ל הָ/אָ֑רֶץ יִ֝שְׂמְח֗וּ אִיִּ֥ים רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/001.yaml
  text: Yahweh reigns[a]; let the earth rejoice; let the many coastlands be glad.
translation:
  language: sw
  text: Yahwe anatawala[a]; dunia na ishangilie; nchi nyingi za pwani[b] na zifurahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe amekuwa Mfalme.”
    reason: Kitenzi cha Kiebrania kinaweza kueleza utawala wake wa kifalme au, katika muktadha fulani, kuanza kwake kutawala kama Mfalme.
  - marker: b
    text: Au, “visiwa vingi.”
    reason: Neno la Kiebrania linaweza kumaanisha visiwa au nchi za pwani zilizo ng’ambo ya bahari.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika herufi nne limetoholewa moja kwa moja kwa umbo la kawaida la Kiswahili, badala ya kubadilishwa kuwa cheo kama “BWANA”.
- source_word: מָלָךְ
  choice: anatawala
  rationale: Katika tangazo hili la kishairi, kitenzi hiki kinaeleza utawala wa kifalme wa Yahwe unaoendelea, huku tanbihi ikihifadhi uwezekano wa maana ya kuanza kutawala au kuwa Mfalme.
- source_word: תָּגֵל
  choice: na ishangilie
  rationale: Hali ya kitenzi katika muktadha huu ina nguvu ya himizo au mwaliko; muundo wa “na…” ni wa asili katika Kiswahili na unahifadhi maana hiyo.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: Ulinganifu wake na nchi nyingi za pwani unaonyesha upeo wa ulimwengu mzima, si nchi ya Israeli peke yake.
- source_word: יִשְׂמְחוּ
  choice: na zifurahi
  rationale: Imetafsiriwa kama himizo linalolingana kishairi na “na ishangilie,” huku uchaguzi wa “zifurahi” ukiepuka urudiaji usio wa lazima.
- source_word: אִיִּים
  choice: nchi za pwani
  rationale: Neno la Kiebrania linaweza kumaanisha visiwa au maeneo ya nchi yaliyo kandokando ya bahari; “nchi za pwani” linafaa kwa upeo mpana wa zaburi, na maana mbadala imehifadhiwa katika tanbihi.
- source_word: רַבִּים
  choice: nyingi
  rationale: Hili ni neno la kawaida na la moja kwa moja linaloonyesha wingi wa nchi za pwani.
theological_decisions:
- issue: Upeo wa tangazo la ufalme wa Yahwe
  choice: Tangazo la utawala wa sasa wa Yahwe juu ya dunia yote
  alternative: 'Kauli inayohusu hasa nchi ya Israeli, au tangazo la kuanza kwa utawala: “Yahwe amekuwa Mfalme”'
  rationale: Ulinganifu wa “dunia” na “nchi nyingi za pwani” unaonyesha upeo wa ulimwengu mzima. “Anatawala” huwasilisha ufalme wa Mungu bila kulazimisha maana ya kwamba ndipo tu ameanza kuwa Mfalme; uwezekano huo umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Miundo ya “na ishangilie” na “na zifurahi” inatoa himizo la asili, na ulinganifu wa vipashio vitatu umehifadhiwa.
