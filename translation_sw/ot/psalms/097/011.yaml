  text: Light is sown for the righteous[a], and joy for the upright in heart.
translation:
  language: sw
  text: Nuru imepandwa kwa mwenye haki,[a] na furaha kwa walio wanyofu wa moyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Nuru imetawanywa kwa mwenye haki.” Kiebrania kinadumisha sitiari ya kilimo: nuru inaonyeshwa kama kitu kinachopandwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  choice: Nuru
  rationale: Neno hili linahifadhi taswira ya mwanga, ambayo katika Zaburi inaweza kuashiria baraka, wokovu, au ukombozi bila kuifungia katika maana moja.
- source_word: זָרֻעַ
  choice: imepandwa
  rationale: Hii ni kauli tendwa ya kitenzi 'kupanda mbegu.' 'Imepandwa' inahifadhi sitiari ya kilimo iliyo katika Kiebrania na inaeleweka kwa Kiswahili cha kawaida.
- source_word: לַצַּדִּיק
  choice: kwa ajili ya mwenye haki
  rationale: Kihusishi kinaonyesha anayenufaika au anayelengwa. Umoja wa uwakilishi umehifadhiwa kwa usemi wa kawaida 'mwenye haki.'
- source_word: וּלְיִשְׁרֵי לֵב
  choice: na furaha kwa ajili ya wanyofu wa moyo
  rationale: Usemi 'wanyofu wa moyo' unahifadhi wazo la uadilifu wa ndani na sambamba ya kishairi, huku mpangilio wa maneno ukiwa wa asili katika Kiswahili.
- source_word: שִׂמְחָה
  choice: furaha
  rationale: '''Furaha'' ni neno la kawaida na lenye hadhi linalolingana vizuri na ''nuru'' katika sambamba ya kishairi.'
theological_decisions:
- issue: Maana ya kisitiari ya 'nuru'
  choice: Sitiari 'Nuru imepandwa' imehifadhiwa.
  alternative: Wokovu, ustawi, au ukombozi umeandaliwa kwa ajili ya mwenye haki.
  rationale: Kiebrania hakibainishi rejeo moja tu la 'nuru.' Kuhifadhi sitiari kunadumisha upana wa maana na mvutano wa kishairi wa mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na rahisi kueleweka. Muundo wa kishairi na sitiari ya kilimo vimehifadhiwa bila kuongezwa ufafanuzi wa kimadhehebu.
