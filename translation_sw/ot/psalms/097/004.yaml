  text: His lightning lights up the world[a]; the earth sees and trembles.
translation:
  language: sw
  text: Miale yake ya umeme huangaza ulimwengu; dunia huona na kutetemeka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dunia huona na kutikisika.” Kitenzi cha Kiebrania kinaweza kumaanisha kutetemeka, kujikunja kwa uchungu, au kutikisika.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵאִירוּ
  choice: huangaza
  rationale: Kitenzi cha Kiebrania katika Hiphil kina maana ya kusababisha mwanga; “huangaza” ni Kiswahili cha kawaida kinachowasilisha maana hiyo kwa ufupi.
- source_word: בְרָקָיו
  choice: umeme wake
  rationale: Nomino ya wingi yenye kiambishi cha nafsi ya tatu ya kiume inarejelea umeme wa Mungu. Kiswahili kwa kawaida hutumia “umeme” kama nomino ya jumla bila kulazimisha wingi usio wa kawaida.
- source_word: תֵּבֵל
  choice: ulimwengu
  rationale: Neno hili humaanisha ulimwengu, hasa sehemu yake inayokaliwa; “ulimwengu” pia hulitofautisha na הָאָרֶץ katika kishazi kinachofuata.
- source_word: רָאֲתָה
  choice: huona
  rationale: Ingawa umbo la Kiebrania ni timilifu, wakati wa sasa wa mazoea katika Kiswahili unafaa kwa taswira hai ya kishairi na unaendana na “huangaza.”
- source_word: וַתָּחֵל
  choice: na kutetemeka
  rationale: Kitenzi kinaweza kueleza kutetemeka, kujinyonga kwa maumivu, au kutikisika. “Kutetemeka” huhifadhi upana wa picha bila kuifanya iwe tetemeko la ardhi pekee.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: Katika muktadha huu wa ufunuo wa Mungu unaohusu viumbe vyote, neno linarejelea dunia kwa upana, si nchi fulani.
theological_decisions:
- issue: Upeo wa ulimwengu mzima wa ufunuo wa Mungu
  choice: “Ulimwengu” na “dunia” zimetumiwa kama maneno tofauti lakini yanayokamilishana.
  alternative: Kutafsiri הָאָרֶץ kuwa “nchi” kwa maana ya eneo maalumu.
  rationale: Usambamba wa kishairi na muktadha wa zaburi unaonyesha athari kwa utaratibu wote wa uumbaji, bila kuongeza dai la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha ni wazi kwa msomaji wa kawaida huku taswira ya kishairi ya dunia kuona ikihifadhiwa.
