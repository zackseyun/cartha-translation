source:
  edition: WLC
  text: אֹהֲבֵ֥י יְהוָ֗ה שִׂנְא֫וּ רָ֥ע שֹׁ֭מֵר נַפְשׁ֣וֹת חֲסִידָ֑י/ו מִ/יַּ֥ד רְ֝שָׁעִ֗ים יַצִּילֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/010.yaml
  text: You who love Yahweh[a], hate evil. He guards the lives of his faithful ones; from the hand of the wicked he delivers them.
translation:
  language: sw
  text: Enyi mnaompenda Yahwe, chukieni uovu! Yeye hulinda maisha ya waaminifu wake[a]; huwaokoa kutoka mikononi mwa waovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafsi za watakatifu wake.” Neno la Kiebrania linaweza kumaanisha “maisha,” “watu,” au “nafsi”; neno linalotafsiriwa “waaminifu wake” linaweza pia kutafsiriwa “watauwa wake” au “watakatifu wake.”
    reason: Mbadala wa kimsamiati unaohifadhi upana wa maana za נַפְשׁוֹת na חֲסִידָיו.
lexical_decisions:
- source_word: אֹהֲבֵי יְהוָה
  choice: Enyi mnaompenda Yahwe
  rationale: Muundo huu unaonyesha wazi kuwa maneno yanaelekezwa kwa watu wanaompenda Mungu, huku ukihifadhi jina lake binafsi Yahwe.
- source_word: שִׂנְאוּ רָע
  choice: chukieni uovu
  rationale: Kitenzi ni amri ya wingi, hivyo “chukieni” huhifadhi nguvu ya agizo; “uovu” huwasilisha maana pana ya רָע bila kuibana kwa matendo fulani.
- source_word: שֹׁמֵר
  choice: hulinda
  rationale: Hali ya kitenzi katika Kiebrania inaonyesha tendo la kawaida au tabia ya Yahwe ya kuwalinda watu wake.
- source_word: נַפְשׁוֹת חֲסִידָיו
  choice: maisha ya waaminifu wake
  rationale: Katika muktadha wa kuokolewa kutoka kwa waovu, נַפְשׁוֹת inaelekea kumaanisha maisha, na חֲסִידָיו inaonyesha watu wake wenye uaminifu na uchaji.
- source_word: מִיַּד רְשָׁעִים
  choice: kutoka mikononi mwa waovu
  rationale: Usemi huu huhifadhi taswira ya Kiebrania ya mkono kama mamlaka au nguvu; wingi “mikononi” unasikika kwa kawaida katika Kiswahili kwa kundi la waovu.
- source_word: יַצִּילֵם
  choice: huwaokoa
  rationale: Kitenzi kinaonyesha tendo la kuwaondoa au kuwanusuru kutoka katika mamlaka ya waovu; “huwaokoa” pia kinaendana na tendo la kawaida linaloelezwa na “hulinda.”
theological_decisions:
- issue: Maana ya נַפְשׁוֹת katika muktadha huu
  choice: maisha
  alternative: nafsi
  rationale: Muktadha unahusu ulinzi na kuokolewa kutoka mikononi mwa waovu, hivyo maana ya maisha inafaa zaidi bila kuingiza dai maalumu kuhusu asili ya nafsi.
- issue: Jinsi ya kutafsiri חֲסִידָיו
  choice: waaminifu wake
  alternative: watakatifu wake
  rationale: “Waaminifu wake” huonyesha uaminifu na uchaji katika uhusiano na Mungu, bila kulifanya neno kuwa cheo cha kidini ambacho Kiebrania hakilazimishi hapa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Enyi” huweka wazi mwito wa moja kwa moja, na vitenzi “hulinda/huwaokoa” vinaonyesha matendo ya Yahwe yaliyo ya kawaida na tabia yake ya kudumu.
