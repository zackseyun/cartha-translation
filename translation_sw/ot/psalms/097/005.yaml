  text: הָרִ֗ים כַּ/דּוֹנַ֗ג נָ֭מַסּוּ מִ/לִּ/פְנֵ֣י יְהוָ֑ה מִ֝/לִּ/פְנֵ֗י אֲד֣וֹן כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/005.yaml
  text: The mountains melt like wax before Yahweh[b][a], before the Lord of all the earth.
translation:
  language: sw
  text: 'Milima huyeyuka kama nta mbele za Yahwe,

    mbele za Bwana wa dunia yote.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִים
  choice: Milima
  rationale: Nomino ya wingi yenye uainisho; katika Kiswahili, uainisho huo unaeleweka bila kibainishi tofauti.
- source_word: כַּדּוֹנַג
  choice: kama nta
  rationale: Kiambishi כַּ kinaonyesha ulinganisho; ‘kama nta’ ni usemi wa kawaida na huhifadhi tashbihi.
- source_word: נָמַסּוּ
  choice: huyeyuka
  rationale: Kitenzi kina maana ya kuyeyuka au kufumuka. Wakati wa mazoea katika Kiswahili unawasilisha vizuri picha hai na ya jumla ya ushairi, bila kuifunga kwa tukio moja la wakati uliopita.
- source_word: מִלִּפְנֵי
  choice: mbele za
  rationale: Nahau hiyo kihalisi huelekeza kwenye kuwa mbele ya uso au uwepo wa mtu; ‘mbele za’ ni ya asili katika Kiswahili na inadumisha maana ya uwepo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֲדוֹן
  choice: Bwana
  rationale: Cheo hiki humaanisha bwana au mtawala; ‘Bwana’ kinafaa kwa sajili ya juu ya kishairi.
- source_word: כָּל הָאָרֶץ
  choice: wa dunia yote
  rationale: Muundo huu unadumisha uhusiano wa ‘Bwana wa’ na upeo wa jumla wa dunia nzima.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; kulitohowa kunahifadhi tofauti yake na cheo אֲדוֹן kinachofuata.
- issue: Hali ya tendo katika נָמַסּוּ
  choice: huyeyuka
  alternative: iliyeyuka
  rationale: Kauli timilifu ya kishairi inaweza kutoa picha hai au ya jumla. ‘Huyeyuka’ hudumisha nguvu hiyo bila kulazimisha mfuatano mahususi wa wakati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mistari miwili inadumisha urudiaji sambamba wa מִלִּפְנֵי, na tofauti kati ya jina ‘Yahwe’ na cheo ‘Bwana’ imehifadhiwa.
