  yaml_path: translation/ot/psalms/097/008.yaml
  text: Zion heard and rejoiced[a], and the daughters of Judah exulted because of your judgments, O Yahweh.
translation:
  language: sw
  text: Sayuni alisikia, akafurahi; binti za Yuda[a] wakashangilia kwa sababu ya hukumu zako, Ee Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miji ya Yuda” au “vijiji vya Yuda.” Kiebrania kinasema kihalisi “binti za Yuda,” usemi wa kishairi unaoweza kurejelea jamii au makazi ya Yuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעָה
  choice: alisikia
  rationale: Kitenzi cha Qal timilifu, nafsi ya tatu umoja wa kike, ambacho mhusika wake ni Sayuni; wakati uliopita unafaa katika mfuatano huu wa kishairi.
- source_word: וַתִּשְׂמַח
  choice: akafurahi
  rationale: Neno שׂמח linaonyesha furaha; muundo wa mfululizo wa Kiswahili unaendeleza kwa kawaida tendo lililotangulia.
- source_word: צִיּוֹן
  choice: Sayuni
  rationale: Jina maalumu limehifadhiwa kwa umbo lake lililozoeleka katika Kiswahili, bila kulibadili kuwa Yerusalemu au watu wake.
- source_word: וַתָּגֵלְנָה
  choice: wakashangilia
  rationale: גיל huonyesha furaha kubwa au yenye kufurika; “wakashangilia” hutofautisha kwa kiasi maana hii na “akafurahi.”
- source_word: בְּנוֹת יְהוּדָה
  choice: binti za Yuda
  rationale: Huhifadhi picha halisi ya kishairi ya Kiebrania, huku uwezekano wa maana ya kijiografia ukielezwa katika tanbihi.
- source_word: לְמַעַן
  choice: kwa sababu ya
  rationale: Katika muktadha huu inaeleza sababu ya furaha na shangwe.
- source_word: מִשְׁפָּטֶיךָ
  choice: hukumu zako
  rationale: מִשְׁפָּטֶיךָ inaweza kumaanisha hukumu, haki, au matendo ya kuhukumu; “hukumu zako” huhifadhi upana huo vizuri katika muktadha huu.
- source_word: יְהוָה
  choice: Ee Yahweh
  rationale: Jina la Mungu lililoandikwa kwa Tetragramatoni limeandikwa Yahweh, na “Ee” linaonyesha usemi wa kumwita moja kwa moja.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Ee Yahweh
  alternative: Ee BWANA
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja; kulihifadhi kama Yahweh hakubadilishi jina hilo kuwa cheo.
- issue: Iwapo בְּנוֹת יְהוּדָה itafsiriwe kihalisi au kama nahau ya kijiografia
  choice: binti za Yuda
  alternative: miji ya Yuda / vijiji vya Yuda
  rationale: Matini kuu inahifadhi picha na utata wa kishairi wa Kiebrania; tanbihi inatoa maana inayowezekana ya jamii au makazi ya Yuda bila kuifanya iwe maana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “alisikia, akafurahi” unatunza mfuatano wa vitendo; “wakashangilia” unaonyesha nguvu ya גיל. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
