  text: עָנָ֣ן וַ/עֲרָפֶ֣ל סְבִיבָ֑י/ו צֶ֥דֶק וּ֝/מִשְׁפָּ֗ט מְכ֣וֹן כִּסְאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/002.yaml
  text: Clouds and thick darkness are around him[a]; righteousness and justice are the foundation of his throne.
translation:
  language: sw
  text: Wingu na giza nene vimemzunguka[a]; haki na hukumu ni msingi wa kiti chake cha enzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wingu na giza zito vimemzunguka.”
    reason: Neno עֲרָפֶל linaweza kueleweka kuwa giza nene, giza zito, au hali nzito ya mawingu yenye giza.
lexical_decisions:
- source_word: עָנָן
  choice: wingu
  rationale: Nomino ya Kiebrania iko katika umoja. Kiswahili cha kishairi kinaweza kutumia “wingu” kama taswira ya jumla bila kuibadili kuwa wingi.
- source_word: וַעֲרָפֶל
  choice: na giza nene
  rationale: עֲרָפֶל hueleza giza zito au hali ya mawingu mazito, hasa Mungu anapojidhihirisha. “Giza nene” ni ya kawaida na huhifadhi uzito wa taswira.
- source_word: סְבִיבָיו
  choice: vimemzunguka
  rationale: Maana yake ni kuwa vitu hivyo viko pande zote kumzunguka. Kitenzi hiki ni cha asili katika Kiswahili na kinaonyesha hali iliyopo.
- source_word: צֶדֶק
  choice: haki
  rationale: “Haki” hueleza unyoofu na usahihi wa kimaadili katika muktadha huu, huku neno linalofuata likibaki na maana yake ya hukumu.
- source_word: וּמִשְׁפָּט
  choice: na hukumu
  rationale: מִשְׁפָּט inaweza kumaanisha hukumu, haki ya kimahakama, au utaratibu wa kisheria. “Hukumu” huhifadhi tofauti yake na צֶדֶק katika jozi hii ya kishairi.
- source_word: מְכוֹן
  choice: msingi
  rationale: Neno hili humaanisha mahali palipowekwa imara au msingi. “Msingi” linafaa kwa taswira ya kiti cha enzi.
- source_word: כִּסְאוֹ
  choice: wa kiti chake cha enzi
  rationale: Muundo huu unaonyesha wazi uhusiano wa umilikaji katika mnyororo wa Kiebrania, yaani msingi wa kiti chake cha enzi.
theological_decisions:
- issue: Taswira ya Mungu kujidhihirisha huku akiwa amefichika
  choice: Taswira ya wingu na giza nene imedumishwa bila kufafanuliwa kuwa fumbo au ukuu.
  alternative: Kutafsiri taswira hiyo kwa maana ya ukuu, siri, au fumbo linalomzunguka Mungu.
  rationale: Mstari unaunganisha ufalme wa Mungu na taswira ya kujidhihirisha inayofanana na ile ya Sinai. Tafsiri inadumisha mvutano kati ya kufunuliwa na kufichika kwa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa kishairi, wenye hadhi, lakini unaeleweka kwa msomaji wa kawaida. Umoja wa “wingu” umehifadhiwa kulingana na umbo la Kiebrania.
