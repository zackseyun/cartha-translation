  yaml_path: translation/ot/psalms/097/012.yaml
  text: Rejoice in Yahweh[a], you righteous ones[b], and give thanks at the remembrance of his holiness.
translation:
  language: sw
  text: Furahini katika Yahwe[a], enyi wenye haki, na mtoe shukrani kwa ukumbusho wa utakatifu wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yahwe” ni jina la Mungu linalowakilishwa kwa herufi יהוה katika maandishi ya Kiebrania; wengine hulitafsiri “BWANA.”
    reason: divine_name
  - marker: b
    text: 'Au: “na mtoe shukrani kwa kutajwa kwa utakatifu wake.” Neno זֵכֶר linaweza kumaanisha kumbukumbu, ukumbusho, au kutajwa. Tafsiri nyingi husema “jina lake takatifu,” lakini Kiebrania hapa kinasema kihalisi “utakatifu wake” bila kutumia neno “jina.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחוּ
  choice: Furahini
  rationale: Kitenzi cha amri kwa wingi kinachoita watu waitikie kwa furaha; “Furahini” ni Kiswahili cha kawaida na huhifadhi nguvu ya amri.
- source_word: צַדִּיקִים
  choice: enyi wenye haki
  rationale: Kirai hiki kinawalenga moja kwa moja watu wengi wenye sifa ya haki; “enyi” huonyesha wazi usemi wa kuwaita.
- source_word: בַּיהוָה
  choice: katika Yahwe
  rationale: Herufi ב hapa humtaja Yahwe kuwa ndiye msingi na mlengwa wa furaha; “katika” hudumisha muundo huo bila kuufanya kuwa ‘kwa sababu ya’ pekee.
- source_word: יהוה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: וְהוֹדוּ
  choice: na mtolee shukrani
  rationale: Amri ya wingi ya ידה katika muktadha huu ina maana ya kutoa shukrani au sifa. Muundo “mtolee shukrani” unaonyesha kuwa Mungu ndiye anayelengwa.
- source_word: לְזֵכֶר
  choice: mnapoukumbuka
  rationale: זֵכֶר inaweza kumaanisha ukumbusho, kumbukumbu, au kutajwa. Muundo wa wakati “mnapoukumbuka” ni wa asili katika Kiswahili huku tanbihi ikihifadhi upana wa nomino ya Kiebrania.
- source_word: קָדְשׁוֹ
  choice: utakatifu wake
  rationale: Hii ndiyo maana ya moja kwa moja ya neno la Kiebrania; maandishi hayasemi ‘jina,’ kwa hiyo tafsiri haijaongeza neno hilo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la Mungu lenye herufi nne moja kwa moja. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Iwapo neno ‘jina’ liongezwe katika קָדְשׁוֹ
  choice: utakatifu wake
  alternative: jina lake takatifu
  rationale: Kiebrania kinasema kihalisi “utakatifu wake” na hakina neno שֵׁם, yaani “jina.” Tafsiri inahifadhi usemi wa chanzo, na tanbihi inataja tafsiri mbadala ya kimapokeo.
- issue: Maana ya לְזֵכֶר katika mwito wa kushukuru
  choice: mnapoukumbuka
  alternative: kwa ukumbusho wa; linapotajwa
  rationale: Nomino זֵכֶר inaweza kurejelea kukumbuka, ukumbusho, au kutaja. Tafsiri kuu inatumia Kiswahili cha asili bila kudai kwamba maana nyingine haiwezekani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Enyi wenye haki” hudumisha mwito wa moja kwa moja, na “mnapoukumbuka utakatifu wake” hufanya kifungu kisomeke kwa urahisi bila kuficha tofauti ya Kiebrania kati ya “utakatifu” na “jina takatifu.”
