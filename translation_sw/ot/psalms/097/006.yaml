base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/006.yaml
  text: The heavens declare his righteousness[a], and all the peoples see his glory.
translation:
  language: sw
  text: Mbingu zinatangaza haki yake[a], na mataifa yote yanaona utukufu wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uadilifu wake.” Neno la Kiebrania linaweza kumaanisha “haki” au “uadilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּידוּ
  choice: zinatangaza
  rationale: Hifili ya נגד ina maana ya kufanya jambo lijulikane au kulitangaza. Wakati wa sasa unafaa kwa kauli hai ya kishairi na unalingana na mstari sambamba.
- source_word: הַשָּׁמַיִם
  choice: Mbingu
  rationale: Katika muktadha huu wa kishairi na wa kujidhihirisha kwa Mungu, 'mbingu' huhifadhi hadhi ya lugha na ushuhuda wa uumbaji kuliko 'anga'.
- source_word: צִדְקוֹ
  choice: haki yake
  rationale: Neno la Kiebrania linaweza kumaanisha uadilifu wa kimaadili na haki ya hukumu. 'Haki yake' ni ya kawaida na pana katika Kiswahili, huku tanbihi ikihifadhi maana ya 'uadilifu wake'.
- source_word: וְרָאוּ
  choice: wanauona
  rationale: Ingawa kitenzi ni timilifu katika Kiebrania, hapa kinaweza kutoa kauli hai na ya jumla ya kishairi; wakati wa sasa unaonyesha ushuhuda unaoonekana wazi.
- source_word: כָל הָעַמִּים
  choice: watu wa mataifa yote
  rationale: Wingi עַמִּים humaanisha makundi ya watu au mataifa. Usemi huu ni wa asili katika Kiswahili na huhifadhi upeo wa ulimwengu mzima bila kuwalenga watu mmoja mmoja tu.
- source_word: כְּבוֹדוֹ
  choice: utukufu wake
  rationale: Kwa Mungu, כָּבוֹד huonyesha fahari na ukuu wake unaodhihirika; 'utukufu' ndilo neno la Kiswahili lililozoeleka na linalofaa hapa.
theological_decisions:
- issue: Maana ya sifa ya Mungu צִדְקוֹ
  choice: haki yake
  alternative: uadilifu wake
  rationale: Kiebrania kinajumuisha wazo la unyofu wa kimaadili pamoja na haki katika hukumu. Matini kuu inatumia 'haki yake', neno pana la Kiswahili, na tanbihi inahifadhi 'uadilifu wake' kama uwezekano halali bila kuondoa mvutano huo wa maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi, wa sasa na wenye hadhi. Uhusishaji wa mbingu kama watangazaji umehifadhiwa, na tungo imewekwa katika wakati wa sasa ili kuwasilisha nguvu hai ya ushairi wa Kiebrania.
