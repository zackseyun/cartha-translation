base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/009.yaml
  text: For you[a], O Yahweh, are Most High over all the earth; you are exalted far above all gods.
translation:
  language: sw
  text: Kwa maana wewe, Ee Yahweh, ndiwe uliye juu sana juu ya dunia yote; umetukuka sana kuliko miungu yote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “viumbe vyote vya kiungu” au “viumbe vyote vya mbinguni.” Neno la Kiebrania elohim linaweza kumaanisha miungu, viumbe vya kiungu, au mamlaka za mbinguni, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huonyesha msingi wa kauli iliyotangulia na kuendeleza mtiririko wa hoja wa zaburi kwa Kiswahili cha kawaida.
- source_word: אַתָּה
  choice: wewe
  rationale: Kiwakilishi kilicho wazi kimehifadhiwa ili kusisitiza kwamba Yahweh mwenyewe ndiye mkuu kuliko wote.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa namna ya kulitamka badala ya kubadilishwa na cheo.
- source_word: עֶלְיוֹן
  choice: Uliye Juu Zaidi
  rationale: Huhifadhi maana ya cheo na ukuu wa juu kabisa, huku kikisomeka kwa heshima katika Kiswahili.
- source_word: עַל כָּל הָאָרֶץ
  choice: juu ya dunia yote
  rationale: Hueleza ukuu na mamlaka yanayoenea juu ya dunia nzima.
- source_word: מְאֹד נַעֲלֵיתָ
  choice: umetukuzwa sana
  rationale: Muundo huu huhifadhi hali ya kutukuzwa iliyoletwa na kitenzi pamoja na nguvu ya kielezi מְאֹד.
- source_word: עַל כָּל אֱלֹהִים
  choice: kuliko miungu yote
  rationale: Katika mlinganisho huu, 'kuliko' huwasilisha ukuu wa Yahweh dhidi ya wote wanaoitwa miungu, na 'miungu' huhifadhi wingi na mvutano wa neno la Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Uandishi 'Yahweh' huhifadhi jina binafsi la Mungu katika maandishi ya Kiebrania badala ya kuliweka kama cheo.
- issue: Maana ya אֱלֹהִים katika kishororo cha mwisho
  choice: miungu
  alternative: viumbe vya kiungu; viumbe vya mbinguni
  rationale: '''Miungu'' huhifadhi maana ya wazi ya wingi na mkazo wa zaburi kuhusu ukuu wa Yahweh bila kuamua kimyakimya kama wanaorejelewa ni sanamu, miungu ya mataifa, au viumbe vya mbinguni.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wa heshima. 'Ee' hudumisha namna ya kumwita Mungu moja kwa moja; urudiaji wa 'yote' huhifadhi upeo wa miundo yote miwili ya Kiebrania.
