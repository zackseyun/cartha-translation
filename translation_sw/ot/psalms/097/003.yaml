base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/003.yaml
  text: Fire goes before him and burns his adversaries all around[a].
translation:
  language: sw
  text: Moto huenda mbele yake, na huwateketeza wanaompinga pande zote[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maadui zake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשׁ
  choice: Moto
  rationale: Nomino hii humaanisha moto; Kiswahili cha kawaida hakihitaji kibainishi cha aina ya Kiingereza.
- source_word: לְפָנָיו
  choice: mbele zake
  rationale: Usemi huu unamaanisha mbele ya uwepo wake; “mbele zake” ni wa kishairi, wa asili, na hudumisha kiwakilishi cha Kiebrania.
- source_word: תֵּלֵךְ
  choice: hutangulia
  rationale: Kitenzi הלך humaanisha kwenda au kutembea. Pamoja na “mbele zake,” “hutangulia” huwasilisha kwa kawaida picha ya moto kwenda mbele yake bila kudai mwendo wa kutembea.
- source_word: וּתְלַהֵט
  choice: na kuwateketeza
  rationale: Kitenzi להב hapa huonyesha kuwaka kwa nguvu yenye kuharibu; “kuwateketeza” kinafikisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: סָבִיב
  choice: pande zote
  rationale: Kielezi hiki huonyesha eneo linalozunguka; “pande zote” ni usemi wa kawaida unaohifadhi maana hiyo.
- source_word: צָרָיו
  choice: wanaompinga
  rationale: Neno צריו humaanisha walio katika uhasama au upinzani dhidi yake. “Wanaompinga” huhifadhi dhana ya upinzani; “maadui zake” ni tafsiri mbadala halali.
theological_decisions:
- issue: Rejeleo la viambishi vya nafsi ya tatu umoja wa kiume katika muktadha wa kujidhihirisha kwa Mungu katika Zaburi 97
  choice: Kudumisha marejeleo kama “zake” na “-mpinga,” bila kuingiza jina la Mungu katika mstari huu.
  alternative: Moto hutangulia mbele za BWANA na kuwateketeza maadui zake pande zote.
  rationale: Kiebrania kinatumia viambishi vya nafsi ya tatu, huku muktadha ukimtambulisha anayerejelewa. Kudumisha viwakilishi hulinda mtiririko wa kishairi na huepuka kuongeza nomino isiyomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Mbele zake” na “pande zote” ni miundo inayoeleweka kwa wasomaji wa kawaida; sentensi hudumisha taswira yenye nguvu bila kuingiza ufafanuzi wa kimadhehebu.
