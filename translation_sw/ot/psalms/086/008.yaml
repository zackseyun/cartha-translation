lexical_decisions:
- source_word: אֵין
  choice: Hakuna aliye
  rationale: Huwakilisha ukanushi wa kuwepo kwa yeyote anayelingana na Bwana, kwa Kiswahili cha kawaida na cha kishairi.
- source_word: כָּמוֹךָ
  choice: kama wewe
  rationale: Ni ulinganisho wa moja kwa moja unaohifadhi maana ya kufanana au kulinganishwa.
- source_word: בָאֱלֹהִים
  choice: miongoni mwa miungu
  rationale: Huhifadhi wingi wa neno la Kiebrania na nguvu ya tamko la kishairi kuhusu kutolinganishwa kwa Bwana, bila kulazimisha ufafanuzi wa kimetafizikia.
- source_word: אֲדֹנָי
  choice: Ee Bwana
  rationale: Neno hili ni cheo cha Mungu kilichotumiwa hapa kama mwito; 'Ee' huonyesha mwito huo kwa Kiswahili cha asili.
- source_word: וְאֵין
  choice: wala hakuna
  rationale: Hutoa ukanushi wa pili katika usambamba wa kishairi; 'wala' huunganisha vipande viwili vyenye ukanushi kwa ufasaha.
- source_word: כְמַעֲשֶׂיךָ
  choice: matendo kama yako
  rationale: מַעֲשֶׂה linaweza kumaanisha tendo, kazi, au kitendo; 'matendo' linafaa kwa matendo makuu ya Mungu na linahifadhi upana wa neno.
theological_decisions:
- issue: Maana ya “miongoni mwa miungu”
  choice: Kuhifadhi usemi wa wingi “miongoni mwa miungu” kama tangazo la kishairi kwamba Bwana halinganishwi na nguvu nyingine zozote zinazoitwa za kimungu.
  alternative: “miongoni mwa viumbe wa mbinguni” au kufupisha kuwa “hakuna mungu kama wewe”
  rationale: Kiebrania kina אֱלֹהִים katika wingi. Tafsiri ya moja kwa moja huhifadhi mvutano na nguvu ya matini bila kuthibitisha imani ya miungu mingi wala kubadili usemi kuwa umoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya sala na ushairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa usambamba wa Kiebrania umehifadhiwa, na “Ee Bwana” imetumiwa kuonyesha mwito wa moja kwa moja.
