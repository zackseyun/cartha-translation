  text: Hakuna aliye kama wewe miongoni mwa miungu[a], Ee Bwana, wala hakuna matendo[b] kama yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miongoni mwa viumbe wa mbinguni.” Kiebrania kinasema “miongoni mwa miungu,” usemi wa kawaida wa Biblia unaotangaza kwamba Bwana halinganishwi na nguvu yoyote inayoitwa ya kimungu.
    reason: alternative_reading
  - marker: b
