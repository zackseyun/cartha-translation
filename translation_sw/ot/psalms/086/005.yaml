  yaml_path: translation/ot/psalms/086/005.yaml
  text: For you[a], Lord, are good and forgiving, abounding in steadfast love to all who call on you.
translation:
  language: sw
  text: Kwa maana wewe, Bwana, ni mwema na mwenye kusamehe, na mwingi wa upendo wa kudumu kwa wote wanaokuita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu au msingi wa ombi lililotangulia, huku ikidumisha kiunganishi cha kishairi kwa Kiswahili cha kawaida.
- source_word: אַתָּה
  choice: wewe
  rationale: Kiwakilishi cha wazi kimehifadhiwa ili kuonyesha msisitizo wa Kiebrania katika kumwelekea Mungu moja kwa moja.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Ni cheo cha Mungu katika usemi wa moja kwa moja, si jina יהוה; “Bwana” ni tafsiri ya kawaida, yenye heshima na inayoeleweka.
- source_word: טוֹב
  choice: mwema
  rationale: Hudumisha maana pana ya wema wa Mungu bila kuibana kuwa fadhili au ukarimu pekee.
- source_word: סַלָּח
  choice: mwenye kusamehe
  rationale: Kivumishi hiki kinaeleza tabia au mwelekeo wa Mungu wa kusamehe; usemi huu ni wa asili na hauongezi wazi wazo la utayari lisilotajwa moja kwa moja.
- source_word: רַב חֶסֶד
  choice: umejaa upendo thabiti
  rationale: “Umejaa” huwasilisha wingi wa רַב, na “upendo thabiti” huhifadhi pamoja wema wa upendo na uaminifu wa kudumu uliomo katika חֶסֶד.
- source_word: לְכָל
  choice: kwa wote
  rationale: Huonyesha watu wote wanaonufaika na upendo huo, kwa muundo wa kawaida wa Kiswahili.
- source_word: קֹרְאֶיךָ
  choice: wanaokuita
  rationale: Katika muktadha wa sala, humaanisha wale wanaomwita Mungu au kumwomba; “wanaokuita” ni fupi, wazi, na ya asili.
theological_decisions:
- issue: Tafsiri ya cheo cha Mungu אֲדֹנָי katika usemi wa moja kwa moja
  choice: Bwana
  alternative: Mola; Bwana wangu
  rationale: Neno hapa ni אֲדֹנָי, si יהוה. “Bwana” hutafsiri cheo hicho kwa usahihi bila kukichanganya na namna maalumu ya kuwakilisha jina la agano.
- issue: Tafsiri ya חֶסֶד
  choice: upendo thabiti
  alternative: upendo wa kudumu; fadhili; rehema
  rationale: “Upendo thabiti” hudumisha mvutano wa kimaana kati ya upendo, wema, na uaminifu wa kudumu; “rehema” au “fadhili” pekee zingepunguza upana huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unafuata ushairi wa sala bila kuwa wa kizamani au wa kitaaluma.
