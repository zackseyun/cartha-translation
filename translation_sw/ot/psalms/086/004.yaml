  yaml_path: translation/ot/psalms/086/004.yaml
  text: Gladden the soul of your servant[a], for to you, Lord, I lift up my soul.
translation:
  language: sw
  text: Ifurahishe nafsi ya mtumishi wako[a], kwa maana kwako, Ee Bwana, nainua nafsi yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yafurahishe maisha ya mtumishi wako” au “mfurahishe mtumishi wako mwenyewe”; neno la Kiebrania nephesh linaweza kumaanisha “nafsi,” “maisha,” au “mtu mwenyewe,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמֵּחַ
  choice: Iifurahishe
  rationale: Kauli ya kuamuru ya piel inaomba Mungu aisababishe nafsi ipate furaha. “Iifurahishe” huhifadhi nguvu ya ombi la moja kwa moja na maana ya kisababishi.
- source_word: נֶפֶשׁ / נַפְשִׁי
  choice: nafsi / nafsi yangu
  rationale: Katika sala hii neno hilo humaanisha utu wa ndani au mtu mwenyewe mbele za Mungu. “Nafsi” huhifadhi uzito wa lugha ya ibada na urudiaji wa kishairi katika sehemu zote mbili.
- source_word: עַבְדֶּךָ
  choice: mtumishi wako
  rationale: Katika sala za Zaburi, neno hili huonyesha unyenyekevu na utumishi kwa Mungu. “Mtumishi” linafaa zaidi hapa kuliko “mtumwa,” kwa kuwa hali ya utumwa wa kijamii haijasisitizwa.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu ya ombi lililotangulia na kudumisha uhusiano wa kimantiki kwa mtindo unaofaa sala.
- source_word: אֵלֶיךָ
  choice: kwako
  rationale: Hueleza mwelekeo wa nafsi kuelekea kwa Mungu na huambatana kwa kawaida na sitiari ya kuiinua nafsi.
- source_word: אֲדֹנָי
  choice: Ee Bwana
  rationale: Ni jina la cheo la Mungu katika usemi wa moja kwa moja. “Ee” huonyesha mwito wa sala kwa Kiswahili cha kawaida bila kuongeza maana nyingine.
- source_word: אֶשָּׂא
  choice: naiinuwa
  rationale: Huhifadhi sitiari ya Kiebrania ya kuinua nafsi kwa Mungu, yaani kujielekeza kwake katika sala na kumtegemea.
theological_decisions:
- issue: Maana ya kiutu ya נֶפֶשׁ katika lugha ya sala
  choice: nafsi katika sehemu zote mbili
  alternative: maisha; utu wangu/mwenyewe; moyo wa ndani
  rationale: Urudiaji wa נֶפֶשׁ ni sehemu ya muundo wa kishairi. “Nafsi” huhifadhi lugha ya kiroho bila kulazimisha fundisho maalumu kuhusu vipengele vya mwanadamu; tanbihi inaonyesha upana wa maana.
- issue: Maana ya עבד katika uhusiano na Mungu
  choice: mtumishi wako
  alternative: mtumwa wako
  rationale: Muktadha unasisitiza unyenyekevu na kujitoa kwa mwombaji kwa Mungu, si hasa hali ya kisheria au kijamii ya utumwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala. Urudiaji wa “nafsi” na sitiari ya kuiinua umehifadhiwa; “Ee Bwana” huweka wazi kuwa ni usemi wa moja kwa moja kwa Mungu.
