base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/001.yaml
  text: A prayer of David. Incline your ear[a], O Yahweh, and answer me, for I am poor and needy.
translation:
  language: sw
  text: 'Sala ya Daudi.


    Ee Yahweh, utege sikio lako na unijibu,


    kwa maana mimi ni maskini na mhitaji.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwenye kuteseka na mhitaji.” Neno la Kiebrania עָנִי linaweza kumaanisha mtu aliye maskini, anayeteseka, au aliyenyenyekezwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Sala
  rationale: Nomino hii ni kichwa kinachoonyesha aina ya zaburi; “Sala” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kiambishi לְ katika vichwa vya zaburi kinaweza kuonyesha uandishi, uhusiano, au umilikaji. “ya Daudi” huhifadhi kwa kiasi fulani upana huo bila kuamua moja kwa moja kuwa maana pekee ni “iliyoandikwa na Daudi.”
- source_word: הַטֵּה ... אָזְנְךָ
  choice: tega sikio lako
  rationale: Hii huhifadhi sitiari ya Kiebrania ya kulielekeza sikio ili kusikiliza kwa makini, na pia ni msemo wa Kiswahili unaoeleweka kwa urahisi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania linatolewa kama jina binafsi “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: עֲנֵנִי
  choice: unijibu
  rationale: Katika muktadha wa sala, kitenzi ענה humaanisha kujibu mwombaji. Muundo huu unaungana kiasili na ombi lililotangulia.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha sababu ya ombi; “kwa maana” ni kiunganishi cha heshima na cha kawaida katika lugha ya sala.
- source_word: עָנִי
  choice: maskini
  rationale: Neno linaweza kumaanisha maskini, mwenye kuteseka, au aliyenyenyekezwa. “Maskini” huhifadhi maana yake halisi na kuendana na אֶבְיוֹן, huku maana mbadala ikielezwa katika tanbihi.
- source_word: וְאֶבְיוֹן
  choice: na mhitaji
  rationale: “Mhitaji” ni tafsiri ya kawaida ya mtu mwenye uhitaji mkubwa na huhifadhi usambamba wa jozi עָנִי וְאֶבְיוֹן.
- source_word: אָנִי
  choice: mimi ni
  rationale: Kiwakilishi kilichosisitizwa katika Kiebrania kinawakilishwa kwa “mimi,” na kitenzi kishirikishi “ni” huongezwa ili sentensi iwe ya kawaida katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo; “Yehova” ni umbo la kimapokeo la baadaye, na “BWANA” huficha tofauti kati ya jina na cheo.
- issue: Maana ya עָנִי katika kujitambulisha kwa mwombaji
  choice: maskini
  alternative: mwenye kuteseka; aliyenyenyekezwa
  rationale: Muktadha hauamui kwa uhakika kama hali kuu ni umaskini wa mali au mateso. Tafsiri kuu inatumia maana halisi ya kawaida, huku tanbihi ikihifadhi uwezekano wa maana ya kuteseka bila kuingiza hitimisho la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayofaa kwa sala. “Tega sikio lako” huhifadhi taswira ya Kiebrania bila kuwa ngumu, na mpangilio wa mistari huonyesha muundo wa kishairi.
