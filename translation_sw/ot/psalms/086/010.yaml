  text: כִּֽי גָד֣וֹל אַ֭תָּה וְ/עֹשֵׂ֣ה נִפְלָא֑וֹת אַתָּ֖ה אֱלֹהִ֣ים לְ/בַדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/010.yaml
  text: For you are great and do wondrous things[a]; you alone are God.
translation:
  language: sw
  text: Kwa maana wewe ni mkuu, nawe unatenda maajabu; wewe peke yako ndiwe Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wewe ni Mungu peke yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huonyesha sababu ya ombi au sifa iliyotangulia, huku ikidumisha uhusiano wa kishairi kwa Kiswahili cha kawaida.
- source_word: גָדוֹל
  choice: mkuu
  rationale: Neno hili linaonyesha ukuu wa hadhi au nguvu; “mkuu” ni la moja kwa moja na la heshima katika muktadha wa sifa kwa Mungu.
- source_word: וְעֹשֵׂה
  choice: nawe unatenda
  rationale: Hali ya kitenzi cha Kiebrania inaonyesha tendo linalomtambulisha mhusika; wakati wa sasa wa Kiswahili unaonyesha kwamba kutenda hivyo ni sifa yake ya kudumu.
- source_word: נִפְלָאוֹת
  choice: maajabu
  rationale: Hurejelea matendo ya ajabu yanayoamsha mshangao, hasa matendo ya Mungu; “maajabu” ni fupi, ya asili, na huhifadhi wingi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika usemi huu wa kumwambia mhusika mmoja na kusisitiza upekee wake, neno linamrejelea Mungu mmoja.
- source_word: לְבַדֶּךָ
  choice: wewe peke yako
  rationale: Huhifadhi msisitizo wa nafsi ya pili umoja na dai la kwamba hakuna mwingine aliye Mungu.
theological_decisions:
- issue: Dai la upekee wa Mungu katika kishazi cha mwisho
  choice: wewe peke yako ndiwe Mungu
  alternative: wewe ni Mungu peke yako
  rationale: Mpangilio uliochaguliwa unaweka wazi zaidi kwamba ni yeye tu aliye Mungu. Mbadala unawezekana kisarufi lakini katika Kiswahili unaweza kueleweka pia kana kwamba yeye ni Mungu tu wala si kitu kingine; kwa hiyo umewekwa katika tanbihi ili kuhifadhi uwezekano wa mpangilio bila kuficha maana kuu ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi, wa sasa, na wa heshima. “Ndiwe” limetumiwa kuonyesha msisitizo wa kiima na upekee kwa njia ya kawaida katika Kiswahili.
