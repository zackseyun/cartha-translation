base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/012.yaml
  text: I will praise you[a], Lord my God, with all my heart, and I will glorify your name forever.
translation:
  language: sw
  text: Nitakusifu[a], Bwana, Mungu wangu, kwa moyo wangu wote, nami nitalitukuza jina lako milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nitakushukuru”; kitenzi cha Kiebrania kinaweza kumaanisha kushukuru au kusifu katika muktadha wa ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Nitakusifu
  rationale: Kitenzi ידה katika Hifili kinaweza kumaanisha kushukuru au kusifu. Katika muktadha huu wa ibada, na kwa kuwa kinaambatana na kulitukuza jina la Mungu, “nitakusifu” kinaonyesha vizuri maana kuu. Umbo la kitenzi limetafsiriwa kama tamko la wakati ujao lenye uzito wa ahadi.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Hili ni jina la heshima la Mungu; “Bwana” ni tafsiri ya kawaida, yenye staha, na haiongezi maana isiyokuwamo katika Kiebrania.
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Kiambishi cha nafsi ya kwanza umoja kinatajwa wazi na kinahifadhiwa kwa kusema “wangu.” Pamoja na אֲדֹנָי, usemi wa moja kwa moja unakuwa “Bwana, Mungu wangu.”
- source_word: בְּכָל לְבָבִי
  choice: kwa moyo wangu wote
  rationale: Nahau hii inaonyesha kujitoa kwa ndani kikamilifu na bila kugawanyika. Tafsiri hii ni ya asili katika Kiswahili na inadumisha taswira ya moyo ya Kiebrania.
- source_word: וַאֲכַבְּדָה
  choice: nami nitalitukuza
  rationale: Kitenzi כבד katika Pieli kina maana ya kuheshimu au kutukuza. Kwa kuwa kitu kinachotendewa ni “jina lako,” “kulitukuza” kinafaa katika muktadha huu wa ibada. “Nami” linaunganisha tamko hili kwa ufasaha na tamko la kwanza.
- source_word: שִׁמְךָ
  choice: jina lako
  rationale: “Jina” linaweza kusimamia tabia na sifa za mtu zilizofunuliwa, lakini usemi halisi umehifadhiwa kwa sababu unaeleweka na una uzito wa kitheolojia.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Neno hili linaonyesha kudumu bila mwisho; “milele” ni usemi wa kawaida na ulio wazi katika Kiswahili cha sasa.
theological_decisions:
- issue: Tafsiri ya usemi wa kumwita Mungu אֲדֹנָי אֱלֹהַי
  choice: Bwana, Mungu wangu
  alternative: Ee Bwana, Mungu wangu
  rationale: Kiebrania kinatumia majina mawili ya kumwita Mungu moja kwa moja, la pili likiwa na kiambishi cha umilikaji. Koma linaonyesha namna ya kumwita, huku kutotumia “Ee” kukiepuka kuongeza kihisishi ambacho hakijaandikwa wazi.
- issue: Maana ya אוֹדְךָ katika ibada
  choice: Nitakusifu
  alternative: Nitakushukuru
  rationale: Maana zote mbili zinawezekana kwa kitenzi hiki. “Nitakusifu” inafaa zaidi kwa ulinganifu wake na kulitukuza jina la Mungu, lakini mbadala halisi umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya staha na inayofaa kwa ibada. Mpangilio wa maneno ni wa asili katika Kiswahili huku taswira na tamko la ahadi la Kiebrania vikihifadhiwa.
