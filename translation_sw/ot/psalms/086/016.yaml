base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/016.yaml
  text: Turn to me and be gracious to me[a]; give your strength to your servant[b], and save the son of your maidservant.
translation:
  language: sw
  text: Nigeukie na unifanyie neema; mpe mtumishi wako nguvu zako, na umwokoe mwana wa mjakazi wako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwana wa mtumishi wako wa kike.”
    reason: Tafsiri mbadala ya אמה, neno la Kiebrania linaloweza kumaanisha “mjakazi” au “mtumishi wa kike.”
lexical_decisions:
- source_word: פְּנֵה אֵלַי
  choice: Nigeukie
  rationale: Kauli ya amri ya פנה pamoja na אֵלַי ni ombi Mungu aelekeze uso na uangalifu wake kwa mwombaji. “Nigeukie” ni Kiswahili cha kawaida kinachohifadhi mwelekeo na maana ya kimahusiano.
- source_word: וְחָנֵּנִי
  choice: na unitendee neema
  rationale: Kitenzi חנן kinaonyesha kumpa mtu fadhili au neema. “Unitendee neema” huhifadhi wazo hilo bila kulifanya kuwa hasa huruma inayotokana na kuona taabu.
- source_word: תְּנָה עֻזְּךָ
  choice: mpe ... nguvu zako
  rationale: נתן ni “kutoa/kumpa,” na עֹז ni nguvu au uweza. Muundo huu ni wazi na wa asili katika Kiswahili.
- source_word: לְעַבְדֶּךָ
  choice: mtumishi wako
  rationale: עבד inaweza kumaanisha mtumishi au mtumwa. Katika sala hii, “mtumishi” huwasilisha unyenyekevu na utegemezi kwa Mungu bila kusisitiza isivyohitajika taasisi ya utumwa.
- source_word: וְהוֹשִׁיעָה
  choice: na umwokoe
  rationale: Kauli ya amri ya ישׁע inaomba kuokolewa au kukombolewa kutoka hatarini. Kiambishi “mw-” kinafuata nafsi ya tatu iliyotajwa kama mtumishi na mwana.
- source_word: לְבֶן אֲמָתֶךָ
  choice: mwana wa mjakazi wako
  rationale: Neno אמה humaanisha mtumishi wa kike au mjakazi. “Mwana wa mjakazi wako” huhifadhi wazi taswira ya ukoo wa upande wa mama na madai ya kuwa wa nyumba ya Mungu.
theological_decisions:
- issue: Majina ya unyenyekevu עבד na אמה
  choice: mtumishi na mjakazi
  alternative: mtumwa na mtumwa wa kike; au mtumishi na mtumishi wa kike
  rationale: Maneno yaliyochaguliwa yanahifadhi tofauti kati ya istilahi mbili za Kiebrania na sauti ya unyenyekevu wa mwombaji. Hayafuti maneno ya mama wala kuingiza mkazo wa ziada juu ya mfumo wa utumwa.
- issue: Uhusiano kati ya “mtumishi wako” na “mwana wa mjakazi wako”
  choice: Kudumisha nafsi ya tatu katika vipashio vyote viwili
  alternative: Kunifanya mimi, mtumishi wako, niwe na nguvu, na uniokoe
  rationale: Kiebrania kinamtaja mwombaji kwa nafsi ya tatu katika maombi yote mawili. Tafsiri hailazimishi maelezo ya ziada, ingawa katika muktadha marejeo hayo kwa kawaida yanaelekea kwa mtu yuleyule anayesali.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye sauti ya sala iliyo ya heshima lakini inayoeleweka kwa urahisi. “Nigeukie” na “unitendee neema” ni vya sasa na vya hadhi; “mjakazi” huhifadhi upekee wa istilahi ya kike bila maelezo mazito ndani ya mstari.
