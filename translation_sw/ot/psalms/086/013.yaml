base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/013.yaml
  text: For your steadfast love toward me is great[a], and you have delivered my soul from the lowest Sheol.
translation:
  language: sw
  text: Kwa maana upendo wako wa kudumu kwangu ni mkuu, nawe umeokoa nafsi yangu kutoka Sheoli ya chini kabisa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka ulimwengu wa wafu ulio chini kabisa,” au “kutoka kaburi lililo chini kabisa.” “Sheoli” ni neno la Kiebrania linalotaja ulimwengu wa wafu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huanzisha sababu ya sifa iliyotangulia na kudumisha mtiririko wa kishairi.
- source_word: חַסְדְּךָ
  choice: upendo wako thabiti
  rationale: Huwasilisha upendo wa kudumu, uaminifu na wema wa חֶסֶד bila kuufinya kuwa rehema peke yake.
- source_word: גָּדוֹל עָלָי
  choice: kwangu ni mkuu
  rationale: Huhifadhi maana ya ukubwa wa upendo unaoelekezwa kwa mtunga zaburi kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: וְהִצַּלְתָּ
  choice: nawe umeokoa
  rationale: Kauli ya kutendesha ya נצל ina maana ya kuokoa au kunusuru; wakati timilifu unaonyesha tendo lililokamilika lenye umuhimu wa sasa.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: Huhifadhi lugha ya kishairi ya Kiebrania, huku neno hilo likibaki na uwezekano wa kumaanisha pia uhai au mtu mwenyewe.
- source_word: מִשְּׁאוֹל תַּחְתִּיָּה
  choice: kutoka Sheoli ya chini kabisa
  rationale: Uhamishaji wa jina Sheoli huhifadhi taswira ya ulimwengu wa maandishi, na 'ya chini kabisa' huakisi moja kwa moja wazo la תַּחְתִּיָּה la sehemu ya chini mno.
theological_decisions:
- issue: Kutafsiri שְׁאוֹל bila kuingiza kwa lazima dhana za baadaye kuhusu hali ya wafu
  choice: Sheoli
  alternative: ulimwengu wa wafu; kaburi la chini
  rationale: Jina lililohamishwa huhifadhi dhana na utata wa maandishi ya kale, huku tanbihi ikifafanua maana zake zinazowezekana.
- issue: Maana ya נֶפֶשׁ katika muktadha wa kuokolewa kutoka Sheoli
  choice: nafsi yangu
  alternative: uhai wangu; mimi
  rationale: Nafsi hudumisha ushairi na upana wa neno la Kiebrania bila kulifanya dai la kiufundi kuhusu mgawanyo wa mwanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kizaburi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo 'Sheoli ya chini kabisa' umechaguliwa ili kuhifadhi taswira ya kushuka chini sana na utata wa istilahi ya kale.
