  text: A prayer of David. Incline your ear[a], Yahweh; answer me, for I am poor and needy.
translation:
  language: sw
  text: 'Sala ya Daudi.


    Ee Yahwe, unitegee sikio lako; unijibu, kwa maana mimi ni maskini[a] na mhitaji.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana mimi nimeteswa na ni mhitaji.” Neno la Kiebrania עָנִי linaweza kumaanisha mtu aliye maskini, aliyeteswa, au aliyenyenyekezwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: Sala ya Daudi
  rationale: Kichwa hiki kimetafsiriwa kwa namna ya moja kwa moja na ya kawaida katika Kiswahili, huku muundo wa Kiebrania ukiachwa na maana yake inayoweza kuwa sala iliyoandikwa na Daudi au inayohusishwa naye.
- source_word: הַטֵּה ... אָזְנְךָ
  choice: nitegee sikio lako
  rationale: Nahau ya Kiebrania imehifadhiwa kwa Kiswahili kinachoeleweka, ikionyesha ombi la Yahwe kusikiliza kwa makini.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetolewa kama Yahwe badala ya kubadilishwa kuwa cheo.
- source_word: עָנִי וְאֶבְיוֹן
  choice: maskini na mhitaji
  rationale: Hili ndilo jozi la msingi la maana hapa; tanbihi inadumisha uwezekano kwamba עָנִי humaanisha aliyeteswa au aliyenyenyekezwa.
theological_decisions:
- issue: Uhusiano unaoonyeshwa na לְ katika לְדָוִד
  choice: ya Daudi
  alternative: kwa ajili ya Daudi / inayomhusu Daudi
  rationale: Tafsiri ya jadi na ya asili ya kichwa imehifadhiwa bila kudai kwa uwazi aina kamili ya uhusiano wa Zaburi na Daudi.
- issue: Utoaji wa tetragramatoni יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Kutumia Yahwe hutofautisha jina binafsi la Mungu na cheo, kulingana na ushahidi wa maandishi na safu ya ushauri ya POB.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya sala lakini kinachoeleweka kwa wasomaji wa kawaida. Kihisishi “Ee” kimetumiwa kuonyesha mwito wa moja kwa moja, na alama ya tanbihi [a] imewekwa baada ya nahau inayohusika.
