  text: שָֽׁמְרָ֣/ה נַפְשִׁ/י֮ כִּֽי חָסִ֪יד אָ֥נִי הוֹשַׁ֣ע עַ֭בְדְּ/ךָ אַתָּ֣ה אֱלֹהַ֑/י הַ/בּוֹטֵ֥חַ אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/002.yaml
  text: Guard my life[a], for I am faithful; save your servant, my God[b], who trusts in you.
translation:
  language: sw
  text: Uyalinde maisha yangu[b], kwa maana mimi ni mwaminifu[a]; Ee Mungu wangu, mwokoe mtumishi wako anayekutumaini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mcha Mungu,” “mtauwa,” au “mwenye ushikamanifu.” Neno la Kiebrania linaonyesha uaminifu katika uhusiano na Mungu, si ukamilifu usio na dhambi.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “nafsi yangu”; hapa yaelekea kumaanisha “maisha yangu” au “mimi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרָה
  choice: Uyalinde
  rationale: Kauli ya amri inayoelekezwa kwa Mungu; kitenzi “linda” kinaonyesha kuhifadhi dhidi ya hatari kwa Kiswahili cha kawaida.
- source_word: נַפְשִׁי
  choice: maisha yangu
  rationale: Katika ombi hili נֶפֶשׁ inaelekea kumaanisha uhai au nafsi nzima ya mwombaji, si sehemu isiyo ya mwili pekee.
- source_word: כִּי
  choice: kwa maana
  rationale: Inaonyesha sababu inayotolewa kwa ombi la ulinzi.
- source_word: חָסִיד
  choice: mwaminifu
  rationale: Neno hili humweleza mtu mwenye uaminifu na ushikamanifu katika uhusiano na Mungu; “mwaminifu” ni wazi bila kudokeza ukamilifu usio na dhambi.
- source_word: הוֹשַׁע
  choice: mwokoe
  rationale: Kauli ya amri ya kuomba kuokolewa au kuponywa kutoka hatarini; “mwokoe” huhifadhi maana ya msingi na mwangwi wake mpana wa kitheolojia.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Katika sala, hili ni jina la unyenyekevu na uhusiano kwa Mungu; “mtumishi” linafaa zaidi kimuktadha kuliko “mtumwa.”
- source_word: אֱלֹהַי
  choice: Ee Mungu wangu
  rationale: Huhifadhi usemi wa nafsi ya kwanza na kuonyesha wazi kwamba ni mwito unaoelekezwa kwa Mungu.
- source_word: הַבּוֹטֵחַ אֵלֶיךָ
  choice: anayekutumaini
  rationale: Kirai cha kisifa kinachomweleza mtumishi kuwa mtu anayeendelea kumtegemea Mungu.
theological_decisions:
- issue: Maana ya חָסִיד katika maelezo ya mwombaji kujihusu
  choice: Mimi ni mwaminifu
  alternative: Mimi ni mcha Mungu; mimi ni mtauwa; mimi ni mwaminifu kwako
  rationale: Tafsiri hii inaonyesha ushikamanifu na uaminifu katika uhusiano na Mungu bila kudai utakatifu mkamilifu au haki inayostahili wokovu. Msemaji anataja uaminifu wake huku bado akimwomba Mungu amwokoe.
- issue: Uhusiano wa הַבּוֹטֵחַ אֵלֶיךָ na עַבְדְּךָ
  choice: 'Kirai kinamweleza “mtumishi wako”: anayekutumaini'
  alternative: Mimi ninayekutumaini
  rationale: Kisarufi, kirai cha participle kinaweza kusikika kama maelezo ya mtumishi au ya msemaji mwenyewe; wote ni mtu yuleyule. Muundo uliochaguliwa ni wa asili kwa Kiswahili na hauongezi mhusika mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Mwito “Ee Mungu wangu” umewekwa kabla ya ombi la pili ili sintaksia iwe wazi na ya kawaida kwa Kiswahili, bila kubadili uhusiano wa maana katika Kiebrania. Alama zote za tanbihi zinaonekana katika matini kuu.
