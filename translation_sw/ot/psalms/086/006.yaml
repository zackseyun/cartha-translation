  text: Give ear[a], O Yahweh, to my prayer, and listen to the voice of my pleas for mercy.
translation:
  language: sw
  text: 'Ee Yahwe, tega sikio lako kwa sala yangu,

    na usikilize sauti ya maombi yangu ya rehema[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “maombi yangu ya kusihi”; yaani, maombi ya dhati ya kuomba rehema.
    reason: Ufafanuzi wa maana ya neno la Kiebrania תַּחֲנוּנוֹתַי.
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: tega sikio
  rationale: Kauli ya kuamuru kutoka אזן inaomba usikivu makini. Nahau hii inadumisha taswira ya Kiebrania huku ikieleweka katika Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa na cheo, kwa kuwa maandishi ya Kiebrania yanatumia יהוה moja kwa moja.
- source_word: תְּפִלָּתִי
  choice: sala yangu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya nomino תְּפִלָּה yenye kiambishi cha nafsi ya kwanza umoja.
- source_word: וְהַקְשִׁיבָה
  choice: na usikilize
  rationale: Kitenzi קשב hapa ni ombi la kusikiliza kwa makini. 'Usikilize' ni cha asili na kinadumisha usambamba na 'tega sikio.'
- source_word: בְּקוֹל
  choice: sauti ya
  rationale: קוֹל humaanisha sauti au sauti ya mtu; kuitaja wazi kunahifadhi taswira ya kusikia iliyomo katika Kiebrania.
- source_word: תַּחֲנוּנוֹתָי
  choice: maombi yangu ya rehema
  rationale: תַּחֲנוּנִים ni maombi ya dhati ya kutaka kibali au rehema. Kauli hii inaeleza maana hiyo kwa Kiswahili cha sasa bila kutumia neno gumu kupita kiasi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Mstari unamwita Mungu wa Israeli kwa jina lake binafsi. 'Yahwe' hulihifadhi jina hilo badala ya kuliwakilisha kwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Usambamba wa mistari miwili na taswira ya kusikia vimehifadhiwa.
