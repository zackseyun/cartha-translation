  text: וְ/אַתָּ֣ה אֲ֭דֹנָ/י אֵל רַח֣וּם וְ/חַנּ֑וּן אֶ֥רֶךְ אַ֝פַּ֗יִם וְ/רַב חֶ֥סֶד וֶ/אֱמֶֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/015.yaml
  text: But you[a], Lord, are a compassionate and gracious God, slow to anger and abounding in steadfast love and faithfulness.
translation:
  language: sw
  text: Lakini wewe, Bwana, ni Mungu mwenye huruma na mwenye neema, si mwepesi wa hasira, mwingi wa upendo wa kudumu na uaminifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “na kweli.” Katika tamko hili la agano, neno la Kiebrania mara nyingi humaanisha uaminifu au kutegemeka, badala ya ukweli wa kinadharia tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Lakini wewe
  rationale: Kiunganishi pamoja na kiwakilishi cha kusisitiza kinaonyesha utofauti na maombi na upinzani uliotangulia; “Lakini wewe” ni ya kawaida na yenye nguvu katika Kiswahili.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Hili ni jina la heshima la Mungu, Adonai; “Bwana” ndilo neno la kawaida katika Kiswahili bila kulifanya kimakosa kuwa umilikishi wa moja kwa moja.
- source_word: אֵל
  choice: Mungu
  rationale: Hapa neno hili linamtambulisha Bwana kuwa Mungu katika tamko linalorejelea Kutoka 34:6; “Mungu” ni wazi na haliongezi maana ya “mwenye nguvu” isiyotajwa moja kwa moja.
- source_word: רַחוּם וְ/חַנּוּן
  choice: mwenye huruma na neema
  rationale: Usemi huu wa asili unaunganisha huruma ya ndani na tabia ya kuonyesha fadhili; tafsiri hii ni ya heshima, ya asili, na inaeleweka kwa wasomaji wa Kiswahili cha sasa.
- source_word: אֶרֶךְ אַפַּיִם
  choice: si mwepesi wa hasira
  rationale: Nahau ya Kiebrania ina maana ya kutokasirika haraka. “Si mwepesi wa hasira” huhifadhi maana hiyo kwa Kiswahili cha kawaida kuliko tafsiri ya neno kwa neno.
- source_word: וְ/רַב חֶסֶד
  choice: nawe umejaa upendo thabiti
  rationale: רַב huonyesha wingi, na חֶסֶד hapa ni upendo wa kudumu wenye uaminifu katika uhusiano wa agano. “Umejaa upendo thabiti” ni ya asili na huhifadhi uzito wa usemi.
- source_word: וֶ/אֱמֶת
  choice: na uaminifu
  rationale: Katika jozi hii ya maneno ya agano, אֱמֶת mara nyingi humaanisha kutegemeka au kuwa mwaminifu, ingawa maana ya “kweli” bado inawezekana na imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya tamko la agano linalorejelea Kutoka 34:6
  choice: mwenye huruma na neema, si mwepesi wa hasira, nawe umejaa upendo thabiti na uaminifu
  alternative: mwenye rehema na neema, si mwepesi wa hasira, mwingi wa fadhili na kweli
  rationale: Tafsiri iliyochaguliwa inadumisha mwangwi wa tamko la msingi kuhusu tabia ya Mungu huku ikitumia Kiswahili cha sasa. “Upendo thabiti na uaminifu” huonyesha vizuri zaidi upendo wa agano na kutegemeka, bila kufuta uwezekano wa kutafsiri אֱמֶת kuwa “kweli.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “si mwepesi wa hasira” ni nahau ya kawaida; “umejaa upendo thabiti” huepuka lugha ya kale huku ukihifadhi wingi wa חֶסֶד. Alama ya tanbihi imewekwa baada ya kirai kinachohusika.
