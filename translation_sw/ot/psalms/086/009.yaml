base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/009.yaml
  text: All the nations that you have made will come and bow down before you[a], Lord[b], and they will honor your name.
translation:
  language: sw
  text: Mataifa yote uliyoyafanya yatakuja na kusujudu mbele zako[a], Bwana, nayo yatalitukuza jina lako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kuabudu mbele zako”; kitenzi cha Kiebrania kinaweza kumaanisha kuinama au kusujudu kwa heshima na, kwa upanuzi, kuabudu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל גּוֹיִם
  choice: Mataifa yote
  rationale: Kifungu hiki kinajumuisha mataifa kwa upana wake wote; mpangilio huu ni wa kawaida na wazi katika Kiswahili.
- source_word: אֲשֶׁר עָשִׂיתָ
  choice: uliyoyafanya
  rationale: Kitenzi עשה kina maana ya kufanya au kutengeneza. 'Uliyoyafanya' kinadumisha maana pana ya chanzo bila kuongeza kwa lazima neno la kufasiri zaidi, 'kuumba.'
- source_word: יָבֹאוּ
  choice: yatakuja
  rationale: Hali ya kitenzi hapa inaeleza matarajio ya wakati ujao.
- source_word: וְיִשְׁתַּחֲווּ
  choice: na kusujudu
  rationale: Kitenzi kinaashiria kuinama au kujilaza kwa heshima, na kwa upanuzi kuabudu. 'Kusujudu' kinahifadhi tendo la mwili pamoja na maana ya ibada.
- source_word: לְפָנֶיךָ
  choice: mbele zako
  rationale: Ni tafsiri ya kawaida ya uwepo au uso wa mtu, na ni usemi unaoeleweka katika Kiswahili sanifu.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Hiki ni cheo cha heshima kinachotumiwa kwa Mungu; 'Bwana' ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: וִיכַבְּדוּ
  choice: yatalitukuza
  rationale: Katika muundo huu כבד humaanisha kuheshimu au kutukuza. Pamoja na 'jina,' 'kulitukuza jina' ni usemi wa asili unaoonyesha kumpa Mungu heshima na utukufu.
- source_word: לִשְׁמֶךָ
  choice: jina lako
  rationale: Kiambishi cha Kiebrania kinaonyesha jina la Mungu; Kiswahili huhitaji upatanisho wa ngeli katika 'kulitukuza jina lako.'
theological_decisions:
- issue: Upeo wa mwitikio wa mataifa
  choice: Mataifa yote ambayo Mungu ameyafanya yatakuja kumsujudia
  alternative: Lugha ya sifa iliyotiwa chumvi kuhusu mataifa mengi, si lazima kila taifa bila ubaguzi
  rationale: Mstari unasema kwa uwazi 'mataifa yote' na unayaeleza yakija mbele za Bwana. Tafsiri inadumisha upeo huo bila kuupunguza au kuufafanua zaidi ya maandishi.
- issue: Maana ya kusujudu
  choice: Tendo la kuinama kwa heshima linaloweza pia kumaanisha kuabudu
  alternative: Kutafsiri moja kwa moja kuwa 'kuabudu'
  rationale: Neno 'kusujudu' linahifadhi picha halisi ya tendo na maana yake ya ibada, huku tanbihi ikionyesha uwezekano wa kutafsiri 'kuabudu.'
- issue: Tafsiri ya אֲדֹנָי
  choice: Bwana
  alternative: Mola au Bwana wangu
  rationale: Katika matumizi yake kama cheo cha Mungu, 'Bwana' ni tafsiri ya kawaida; haihitaji kuingiza umilikishi ambao katika muktadha huu hufanya kazi kama sehemu ya umbo la cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. 'Mbele zako' na 'kulitukuza jina lako' ni misemo ya kawaida ya kibiblia isiyo ya kizamani kupita kiasi.
