  language: sw
  text: Siku ya taabu yangu ninakuita, kwa sababu utanijibu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם צָרָתִי
  choice: Siku ya taabu yangu
  rationale: Kifungu hiki kinawasilisha kwa lugha ya kawaida hali au wakati wa dhiki ya mwombaji.
- source_word: אֶקְרָאֶךָּ
  choice: ninakuita
  rationale: Kauli ya Kiebrania inaweza kueleza tendo la sasa au la kawaida; wakati wa sasa unafaa muktadha wa sala na ni wa asili katika Kiswahili.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa kiunganishi kinaeleweka zaidi kuwa kinatoa sababu ya kumwita Mungu, bila kubadili kuwa maana dhaifu ya 'kwa kuwa' ya maelezo tu.
- source_word: תַעֲנֵנִי
  choice: utanijibu
  rationale: Umbo la kitenzi linaeleza matarajio yenye uhakika kwamba Mungu atajibu; wakati ujao unahifadhi mwelekeo huo.
theological_decisions:
- issue: Je, תַעֲנֵנִי itafsiriwe kama wakati wa sasa au ujao?
  choice: utanijibu
  alternative: unanijibu
  rationale: Kitenzi cha Kiebrania ni imperfect, na katika muktadha huu kinaeleza tumaini au uhakika wa jibu linalotarajiwa. Tafsiri hii pia huepuka kudai kwamba jibu tayari linatokea.
translation_notes:
