id: PSA.86.17
reference: Psalms 86:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: עֲשֵֽׂה עִמִּ֥/י א֗וֹת לְ/ט֫וֹבָ֥ה וְ/יִרְא֣וּ שֹׂנְאַ֣/י וְ/יֵבֹ֑שׁוּ כִּֽי אַתָּ֥ה יְ֝הוָ֗ה עֲזַרְתַּ֥/נִי וְ/נִחַמְתָּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/017.yaml
  text: Show me a sign for good[a], so that those who hate me may see and be put to shame, because you, O Yahweh, have helped me and comforted me.
translation:
  language: sw
  text: Nifanyie ishara ya wema[a], ili wanaonichukia waione na waaibike, kwa sababu wewe, Ee Yahweh, umenisaidia na kunifariji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nifanyie ishara kwa ajili ya mema”; kwa Kiebrania, kihalisi ni “fanya pamoja nami ishara kwa mema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה עִמִּי
  choice: Nifanyie
  rationale: Muundo huu unahifadhi maana ya msingi ya ‘fanya pamoja nami/kwangu’ kwa Kiswahili cha kawaida, bila kuufanya moja kwa moja kuwa ‘nionyeshe,’ jambo ambalo lingeondoa utata wa nahau ya Kiebrania.
- source_word: אוֹת לְטוֹבָה
  choice: ishara ya wema
  rationale: ‘Ishara’ ni tafsiri ya kawaida ya אוֹת. ‘Ya wema’ inaonyesha ishara yenye kuashiria mema, fadhili, au kibali, huku tanbihi ikihifadhi uwezekano wa ‘kwa ajili ya mema.’
- source_word: וְיִרְאוּ
  choice: waione
  rationale: Kiunganishi ‘ili’ pamoja na hali hii ya kitenzi huwasilisha kusudi au matokeo yanayotarajiwa baada ya ombi la kwanza.
- source_word: שֹׂנְאַי
  choice: wanaonichukia
  rationale: Hii inahifadhi maana ya moja kwa moja ya umbo la Kiebrania, yaani watu wanaomchukia mwombaji, badala ya neno pana zaidi ‘adui.’
- source_word: וְיֵבֹשׁוּ
  choice: waaibike
  rationale: Kitenzi hiki kinaweza kueleza kuaibishwa, kufedheheka, au kuvunjika moyo hadharani; ‘waaibike’ ni cha kawaida na kinafaa katika muktadha.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: עֲזַרְתַּנִי
  choice: umenisaidia
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililotimia lenye umuhimu wa sasa.
- source_word: וְנִחַמְתָּנִי
  choice: kunifariji
  rationale: ‘Kufariji’ ni neno la sasa, la heshima, na linaloeleweka kwa maana ya נחם katika muktadha huu.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni kama jina binafsi; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Asili ya ‘ishara ya wema’
  choice: Kuacha ishara yenyewe bila kufafanuliwa zaidi
  alternative: Ishara ya kibali cha Mungu
  rationale: Kiebrania hakisemi ishara hiyo itakuwa nini hasa. Tafsiri haipaswi kuamua kama ni muujiza, ukombozi unaoonekana, au uthibitisho mwingine wa kibali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sala ulio wa heshima lakini unaoeleweka kwa urahisi. ‘Ee Yahweh’ hudumisha mwito wa moja kwa moja; ‘Nifanyie’ huhifadhi kwa kiasi kikubwa nahau na utata wa Kiebrania.
