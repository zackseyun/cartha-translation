  text: אֱלֹהִ֤ים זֵ֘דִ֤ים קָֽמוּ עָלַ֗/י וַ/עֲדַ֣ת עָ֭רִיצִים בִּקְשׁ֣וּ נַפְשִׁ֑/י וְ/לֹ֖א שָׂמ֣וּ/ךָ לְ/נֶגְדָּֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/014.yaml
  text: God[a], arrogant men have risen against me, and a band of ruthless men has sought my life[c][b]; they have not set you before them.
translation:
  language: sw
  text: Mungu, watu wenye kiburi wameinuka dhidi yangu; kundi la watu wakatili limetafuta uhai wangu[a]. Hawajakukuweka mbele yao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kutafuta uhai wangu” ni usemi wa Kiebrania unaomaanisha kutaka kuniua.
    reason: cultural_note
  - marker: b
    text: Au, “Hawakukuweka mbele ya macho yao,” yaani, hawakukujali.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hapa neno hili linatumika kama mwito wa moja kwa moja kwa Mungu wa Israeli. Kiswahili hakihitaji kuongeza kihisishi kama “Ee” ili kuonyesha mwito huo.
- source_word: זֵדִים
  choice: watu wenye kiburi
  rationale: Neno hili linamaanisha watu wenye kiburi, jeuri, au majivuno. “Watu wenye kiburi” ni la kawaida na linaonyesha wazi kuwa kivumishi cha Kiebrania kinawarejelea watu.
- source_word: קָמוּ עָלַי
  choice: wameinuka dhidi yangu
  rationale: Huu ni usemi unaoonyesha kuinuka kwa uhasama dhidi ya mtu. Kauli timilifu ya Kiswahili inafaa katika ombolezo hili.
- source_word: וַעֲדַת
  choice: kundi la
  rationale: Nomino hii ni mkusanyiko au jumuiya ya watu; “kundi” ni ya asili katika muktadha huu wa watu wenye uhasama.
- source_word: עָרִיצִים
  choice: watu wakatili
  rationale: Neno hili humaanisha watu wakatili, wenye nguvu za kuonea, au wenye jeuri. “Watu wakatili” linafikisha tishio bila kulifanya hasa kuwa suala la utawala wa kisiasa.
- source_word: בִּקְשׁוּ נַפְשִׁי
  choice: limetafuta uhai wangu
  rationale: Usemi wa Kiebrania una maana ya kutafuta kuondoa uhai wa mtu, mara nyingi kwa nia ya kumuua. Taswira ya chanzo imehifadhiwa, huku tanbihi ikifafanua maana yake.
- source_word: וְלֹא שָׂמוּךָ לְנֶגְדָּם
  choice: Hawakuweki mbele yao
  rationale: Kwa maana halisi, hawajamweka Mungu mbele yao. Kiswahili cha wakati wa sasa kinaonyesha hali yao ya kudumu ya kutomjali Mungu huku kikihifadhi sitiari ya chanzo.
theological_decisions:
- issue: Iwapo mwito kwa Mungu uongezwe “Ee”
  choice: Mungu
  alternative: Ee Mungu
  rationale: Muktadha unaonyesha wazi kuwa Mungu anaambiwa moja kwa moja, lakini Kiebrania hakina kihisishi tofauti kinacholingana na “Ee.” Tafsiri haiongezi kihisishi hicho.
- issue: Iwapo nia ya kuua katika “kutafuta uhai wangu” ielezwe moja kwa moja
  choice: limetafuta uhai wangu
  alternative: limetafuta kuniua
  rationale: Usemi wa Kiebrania mara nyingi unaashiria nia ya kuua, lakini kuhifadhi “uhai wangu” kunadumisha taswira ya chanzo bila kufuta mvutano wa usemi huo. Maana inafafanuliwa katika tanbihi.
- issue: Iwapo sitiari ya kutomweka Mungu mbele yao ihifadhiwe
  choice: Hawakuweki mbele yao
  alternative: Hawakujali
  rationale: Sitiari ya chanzo inafaa kueleweka kwa Kiswahili na inaonyesha kwamba hawamwangalii wala kumjali Mungu; kwa hiyo imehifadhiwa badala ya kubadilishwa kabisa kuwa ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa kwa vifungu vifupi; msamiati ni wa kawaida lakini si wa mazungumzo mepesi.
