base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/011.yaml
  text: Teach me your way[a], O Yahweh, that I may walk in your truth[b]; unite my heart to fear your name.
translation:
  language: sw
  text: Ee Yahwe, nifundishe njia yako, ili nitembee katika kweli yako[a]; uunganishe moyo wangu[b], ili niogope jina lako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika uaminifu wako.” Neno la Kiebrania linaweza kumaanisha “kweli” au “uaminifu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ufanye moyo wangu usiogawanyika.” Kitenzi cha Kiebrania humaanisha “kuunganisha” au “kufanya kuwa mmoja,” kikionyesha moyo usiogawanyika katika uaminifu wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרֵנִי
  choice: nifundishe
  rationale: Amri ya Hifili ya ירה pamoja na kiambishi cha nafsi ya kwanza ina maana ya “nifundishe” au “nielekeze.” “Nifundishe” ni ya kawaida na hudumisha ombi la kupata mafundisho kutoka kwa Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kuwa “Yahwe,” badala ya kubadilishwa na cheo kama “Bwana.” Tahajia hii ni ya kawaida katika Kiswahili.
- source_word: דַּרְכֶּךָ
  choice: njia yako
  rationale: דֶּרֶךְ humaanisha njia, na kwa sitiari mwenendo au mapenzi ya Mungu kuhusu maisha. “Njia yako” hudumisha umoja wa nomino na lugha ya kishairi ya Kiebrania.
- source_word: אֲהַלֵּךְ
  choice: ili nitembee
  rationale: Kauli hii isiyotimilika baada ya amri inaeleza kusudi au tokeo. “Ili nitembee” huonyesha uhusiano wa ombi hili na “nifundishe” bila kufafanua kupita kiasi.
- source_word: בַּאֲמִתֶּךָ
  choice: katika kweli yako
  rationale: אֱמֶת inaweza kumaanisha kweli, uaminifu, au kutegemeka. “Katika kweli yako” ni tafsiri ya moja kwa moja, huku maana ya “uaminifu wako” ikihifadhiwa katika tanbihi.
- source_word: יַחֵד
  choice: uufanye ... kuwa mmoja
  rationale: Amri ya Pieli ya יחד humaanisha kuunganisha au kufanya kuwa mmoja. Muundo huu wa Kiswahili unaeleweka kuliko tafsiri ya neno kwa neno na bado huhifadhi taswira ya moyo kufanywa mmoja.
- source_word: לְבָבִי
  choice: moyo wangu
  rationale: לֵבָב hurejelea utu wa ndani, kutia ndani nia, akili, na hisia. “Moyo wangu” ni sawa la kawaida katika lugha ya Biblia na sala.
- source_word: לְיִרְאָה
  choice: ili niliogope
  rationale: Kitenzi-jina cha ירא chenye ל kinaonyesha kusudi. “Niliogope” hudumisha uzito wa hofu ya kumcha Mungu badala ya kuipunguza iwe heshima pekee.
- source_word: שְׁמֶךָ
  choice: jina lako
  rationale: “Jina” katika Kiebrania linaweza kusimamia mtu mwenyewe na sifa yake. Tafsiri ya moja kwa moja hudumisha umuhimu wake wa kitheolojia na wa ibada.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Bwana; Yehova
  rationale: Andiko linatumia jina la agano יהוה. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha na cheo; pia huepuka umbo la baadaye “Yehova.”
- issue: Maana ya ירא kuhusiana na jina la Mungu
  choice: niliogope jina lako
  alternative: niliheshimu jina lako; niliche jina lako
  rationale: ירא hubeba maana za hofu, kicho, na heshima. “Kuogopa” hudumisha uzito na mvutano wa neno la Kiebrania, bila kulipunguza kuwa heshima tu.
- issue: Umoja wa moyo
  choice: uufanye moyo wangu kuwa mmoja
  alternative: unipe moyo usiogawanyika
  rationale: Tafsiri iliyochaguliwa hudumisha taswira ya kitenzi יחד, huku maana ya uaminifu usiogawanyika ikielezwa katika tanbihi bila kuingizwa kama ufafanuzi pekee katika maandiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sala ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Ee” hudumisha mwito wa kishairi; “Yahwe” hutumiwa kama jina binafsi. Muundo “uufanye moyo wangu kuwa mmoja” umechaguliwa ili kuhifadhi taswira ya Kiebrania kwa lugha ya asili ya Kiswahili.
