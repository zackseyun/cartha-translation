lexical_decisions:
- source_word: חָנֵּנִי
  choice: Unirehemu
  rationale: Kauli ya amri ya חנן yenye kiambishi cha nafsi ya kwanza umoja ni ombi la kuonyeshwa neema au rehema. Katika sala ya Kiswahili, “Unirehemu” ni ya kawaida, yenye heshima, na inabeba ombi hilo bila kuliongezea maana.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Hili ni jina la cheo la Mungu אֲדֹנָי; “Bwana” ndilo neno la kawaida na sahihi katika Kiswahili cha sala.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי linaanzisha sababu ya ombi; “kwa maana” linaonyesha uhusiano huo wa kisababu kwa uwazi.
- source_word: אֵלֶיךָ
  choice: ninakuita
  rationale: Maana ya “kwako” imeunganishwa kwa kawaida katika kitenzi cha Kiswahili “ninakuita,” ambacho humtaja anayeelekezewa mwito.
- source_word: אֶקְרָא
  choice: ninakuita
  rationale: קרא hapa ni kumwita Mungu katika sala. “Ninakuita” huhifadhi maana ya msingi bila kuongeza kwa lazima nguvu ya “ninakulilia.”
- source_word: כָּל הַיּוֹם
  choice: mchana kutwa
  rationale: Kirai hiki humaanisha siku nzima; “mchana kutwa” ni usemi wa kawaida wa Kiswahili unaoonyesha kuendelea siku nzima.
theological_decisions:
- issue: Tafsiri ya jina la cheo la Mungu אֲדֹנָי
  choice: Bwana
  alternative: Bwana wangu
  rationale: “Bwana” hutafsiri jina la cheo la Mungu kwa kawaida bila kusisitiza umilikaji ambao muundo huu wa jina la kiungu hauhitaji kutolewa kando katika Kiswahili.
- issue: Wigo wa maana wa חנן
  choice: Unirehemu
  alternative: Unionyeshe neema
  rationale: Kitenzi kinaweza kuomba fadhili za neema au rehema. “Unirehemu” ni ombi la kawaida katika muktadha huu, huku tanbihi ikihifadhi maana mbadala ya kuonyeshwa neema.
