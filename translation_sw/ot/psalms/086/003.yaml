  text: Unirehemu, Bwana,[a] kwa maana ninakuita siku nzima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Unionyeshe neema.” Kitenzi cha Kiebrania kinaweza kueleza ombi la kupewa neema au rehema.
