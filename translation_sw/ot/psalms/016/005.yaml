lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi unaotumika katika Kiswahili, badala ya kulibadilisha kuwa cheo kama “BWANA”.
- source_word: מְנָת חֶלְקִי
  choice: fungu la urithi wangu
  rationale: Muundo huu unahifadhi picha ya sehemu iliyogawiwa kama urithi, huku ukitofautisha maneno mawili ya Kiebrania yanayohusiana.
- source_word: וְכוֹסִי
  choice: na kikombe changu
  rationale: Picha halisi ya kikombe imehifadhiwa bila kufasiri moja kwa moja kuwa hali au majaliwa ya mtu.
- source_word: אַתָּה
  choice: wewe
  rationale: Kiwakilishi cha wazi kinaendeleza msisitizo uliopo katika Kiebrania.
- source_word: תּוֹמִיךְ
  choice: unalilinda
  rationale: Kitenzi kina maana ya kushikilia, kudumisha, au kuweka salama; “unalilinda” ni cha kawaida na kinaonyesha kuwa fungu hilo linawekwa salama.
- source_word: גּוֹרָלִי
  choice: fungu langu
  rationale: Katika muktadha huu neno linamaanisha sehemu iliyompata mtu kwa kura au mgao; “fungu langu” ni la asili zaidi katika Kiswahili kuliko “kura yangu” na linahifadhi taswira ya mgao.
theological_decisions:
- issue: Yahwe mwenyewe kuwa sehemu ya urithi aliogawiwa mtunga-zaburi
  choice: Yahwe ndiye fungu la urithi wangu ... unalilinda fungu langu
  alternative: Yahwe ndiye fungu langu na kikombe changu ... unaishikilia kura yangu
  rationale: Tafsiri inahifadhi mfululizo wa picha za mgao—fungu, urithi, kikombe, na fungu lililowekwa salama—bila kuziweka zote chini ya maana moja au kufafanua kimadhehebu jinsi Yahwe alivyo urithi wa mtunga-zaburi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa “ndiye” unaonyesha kuwa Yahwe mwenyewe ndiye urithi; msisitizo wa “wewe” umehifadhiwa. Alama ya tanbihi [a] imo katika matini kuu.
