lexical_decisions:
- source_word: לִקְדוֹשִׁים
  choice: Nao watakatifu
  rationale: Kiambishi לִ־ kinaeleweka hapa kama kiashiria cha mada, ‘nao/ama kuhusu’; ‘watakatifu’ ni namna ya kawaida na yenye heshima ya kutaja watu waliowekwa wakfu bila kulazimisha utambulisho wa kimadhehebu.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: walio katika nchi
  rationale: אֶרֶץ inaweza kumaanisha ‘nchi’ au ‘dunia’; ‘katika nchi’ inafaa kwa watu waliopo katika eneo la wanadamu, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: הֵמָּה
  choice: hao ndio
  rationale: Kiwakilishi huru kimeonyeshwa kwa msisitizo wa Kiswahili unaotambulisha kundi hilo.
- source_word: וְאַדִּירֵי
  choice: wenye heshima
  rationale: אַדִּירֵי hapa huonyesha hadhi, ukuu, au ubora, si lazima nguvu za kijeshi; ‘wenye heshima’ ni Kiswahili cha asili na chenye hadhi.
- source_word: כָּל חֶפְצִי
  choice: ninapendezwa nao kabisa
  rationale: חֵפֶץ hueleza furaha, mapendezi, au shauku; muundo huu wa Kiswahili unaonyesha ukamilifu wa mapendezi ya mtunga zaburi bila kuwa mgumu.
- source_word: בָם
  choice: nao
  rationale: בָם inaelekeza mapendezi kwa watu hao; katika Kiswahili ‘kupendezwa nao’ ni muundo wa kawaida unaowasilisha uhusiano huo.
theological_decisions:
- issue: Utambulisho wa ‘watakatifu’
  choice: watu watakatifu walio katika nchi
  alternative: viumbe watakatifu wa mbinguni, au watu waliowekwa wakfu kwa ujumla
  rationale: Kirai ‘walio katika nchi’ kinaelekea kwa watu wa duniani, lakini tafsiri haitaji kundi maalumu la kidini wala kufunga kabisa uwezekano wa maana pana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia muundo wa mada ‘Nao…’ ili kuonyesha לִ־ isiyo ya kawaida, na ‘hao ndio’ kuhifadhi msisitizo wa הֵמָּה.
