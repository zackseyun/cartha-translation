  yaml_path: translation/ot/psalms/016/003.yaml
  text: As for the holy ones who are in the land[c][b][a], they are the noble ones in whom is all my delight.
translation:
  language: sw
  text: Nao watakatifu walio katika nchi[a]—hao ndio wenye hadhi[b]; furaha yangu yote iko kwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walio duniani.”
    reason: lexical_alternative
  - marker: b
    text: Au, “walio bora,” “wenye fahari,” au “wenye ukuu.”
