  yaml_path: translation/ot/psalms/016/001.yaml
  text: A miktam of David. Preserve me[a], O God, for I take refuge in you.
translation:
  language: sw
  text: 'Miktamu ya Daudi.[a]


    Ee Mungu, unilinde,

    kwa maana nimekimbilia kwako.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania “miktam,” kichwa cha zaburi chenye maana isiyojulikana kwa hakika; huenda kinataja aina fulani ya utungo. Wengine hutafsiri “zaburi” au “wimbo wa dhahabu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּם
  choice: Miktamu
  rationale: Neno hili ni kichwa cha zaburi chenye maana isiyojulikana kwa hakika. Kulitohoa kwa Kiswahili kunahifadhi umbo la Kiebrania bila kulipachika maana yenye utata.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kiambishi לְ katika vichwa vya zaburi kinaweza kuonyesha uandishi, uhusiano, umiliki, au kuwekwa wakfu. ‘Ya Daudi’ ni ya kawaida na inaepuka kuamua bila msingi kuwa lazima maana yake ni ‘iliyoandikwa na Daudi.’
- source_word: שָׁמְרֵנִי
  choice: unilinde
  rationale: Amri hii inaomba Mungu amhifadhi na kumkinga mwombaji. ‘Unilinde’ ni Kiswahili cha kawaida, cha sala, na hakifungi maana kwenye hatari ya kimwili pekee.
- source_word: אֵל
  choice: Ee Mungu
  rationale: אֵל ni jina la kawaida la Mungu; ‘Ee Mungu’ linaonyesha kwa kawaida kwamba anaitwa moja kwa moja katika sala.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa neno hili linaanzisha sababu ya ombi, hivyo ‘kwa maana’ linahifadhi uhusiano wa kisababishi.
- source_word: חָסִיתִי
  choice: nimekukimbilia
  rationale: Kitenzi חָסָה kinaonyesha kukimbilia mahali au kwa mtu ili kupata hifadhi. ‘Nimekukimbilia’ huhifadhi picha hiyo na hali ya tendo lililofanywa lenye matokeo ya sasa, badala ya kulifanya tu kuwa ‘nimekutumaini.’
- source_word: בָךְ
  choice: wewe
  rationale: Kiambishi בְּ pamoja na חָסָה humtaja yule ambaye kwake hifadhi inatafutwa. Katika Kiswahili, ‘nimekukimbilia wewe’ ni muundo wa asili unaoweka mkazo unaopatikana katika kiwakilishi cha Kiebrania.
theological_decisions:
- issue: Maana ya kichwa מִכְתָּם
  choice: Kutumia neno lililotoholewa ‘Miktamu’ bila kulipa maana ya kubuniwa
  alternative: Kulitafsiri kama ‘zaburi,’ ‘wimbo wa dhahabu,’ au ‘maandishi’
  rationale: Maana kamili ya מִכְתָּם haijulikani. Kulitohoa kunahifadhi kutokuwa na uhakika kwa ushahidi wa lugha ya asili, badala ya kuamua tafsiri mojawapo yenye mjadala.
- issue: Uhusiano unaoonyeshwa na לְדָוִד
  choice: ‘ya Daudi’
  alternative: ‘iliyoandikwa na Daudi,’ ‘kwa ajili ya Daudi,’ au ‘iliyowekwa wakfu kwa Daudi’
  rationale: Kiambishi cha Kiebrania kinaweza kuonyesha aina kadhaa za uhusiano. ‘Ya Daudi’ kinaacha upeo huo wazi na hakifanyi dai la moja kwa moja kuhusu uandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala. Mistari imepangwa kishairi. ‘Miktamu’ limetoholewa kwa kufuata muundo wa matamshi wa Kiswahili, huku tanbihi ikieleza kutokuwa na uhakika wa neno la Kiebrania.
