  text: I have set Yahweh before me continually[a]; because he is at my right hand[b], I will not be shaken.
translation:
  language: sw
  text: Nimemweka Yahwe mbele yangu daima; kwa kuwa yuko upande wangu wa kuume, sitayumba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sitatikisika” au “sitaondolewa mahali pangu.” Kitenzi cha Kiebrania kinaweza kueleza kuyumba, kutikisika, au kuondolewa katika nafasi thabiti.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁוִּיתִי
  choice: Nimemweka
  rationale: Kauli ya Piel ya שׁוה hapa ina maana ya kuweka; wakati timilifu unaonyesha msimamo ulioamuliwa ambao matokeo yake yanaendelea.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatolewa kama jina la Mungu kwa unukuzi wa Kiswahili, badala ya kulibadilisha kuwa cheo.
- source_word: לְנֶגְדִּי תָמִיד
  choice: mbele yangu daima
  rationale: Huhifadhi wazo la kuwa mbele ya macho au katika uwepo wa mtu kwa mwendelezo.
- source_word: כִּי
  choice: kwa kuwa
  rationale: Huonyesha wazi uhusiano wa sababu kati ya uwepo wa Yahwe na uthabiti wa mwimba-zaburi.
- source_word: מִימִינִי
  choice: mkono wangu wa kuume
  rationale: Huhifadhi taswira ya Kiebrania ya uwepo wa karibu unaotoa ulinzi na msaada.
- source_word: בַּל אֶמּוֹט
  choice: sitatikisika
  rationale: Kitenzi מוט kinaweza kumaanisha kuyumba, kutikisika, au kuondolewa katika nafasi thabiti; ‘sitatikisika’ ni cha kawaida na huhifadhi maana ya kimwili na ya kitamathali.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni; ‘Yahwe’ huhifadhi jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya uwepo upande wa kuume
  choice: Taswira imehifadhiwa bila kufafanuliwa ndani ya mstari
  alternative: Mlinzi au msaidizi wangu
  rationale: Kirai cha Kiebrania kinaweza kudokeza msaada na ulinzi, lakini tafsiri haipaswi kufuta taswira halisi wala kuifungia katika ufafanuzi mmoja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. ‘Daima’ ni ya kawaida na fasaha; ‘mkono wangu wa kuume’ huhifadhi taswira ya Kiebrania. Alama ya tanbihi imewekwa baada ya kishazi inachofafanua.
