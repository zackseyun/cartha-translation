source:
  edition: WLC
  text: מִכְתָּ֥ם לְ/דָוִ֑ד שָֽׁמְרֵ֥/נִי אֵ֝֗ל כִּֽי חָסִ֥יתִי בָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/000.yaml
  text: A miktam of David. Preserve me[a], God, for I take refuge in you.
translation:
  language: sw
  text: 'Miktamu ya Daudi.[a]


    Unilinde, Ee Mungu, kwa maana nimekukimbilia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania miktam, kichwa cha zaburi ambacho maana yake haijulikani kwa hakika; huenda kinamaanisha aina fulani ya utungo. Wengine hutafsiri “zaburi” au “wimbo wa dhahabu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּם (miktam)
  choice: Miktamu
  rationale: Neno hili la kichwa cha zaburi lina maana isiyo hakika. Limetoholewa badala ya kutafsiriwa kwa neno lenye maana mahususi isiyothibitishwa.
- source_word: שָׁמְרֵנִי (shomreni)
  choice: Unilinde
  rationale: Amri hii inaomba Mungu amhifadhi au amlinde mwombaji; ‘unilinde’ ni ya kawaida na inadumisha maana hiyo.
- source_word: חָסִיתִי בָךְ (chasiti vak)
  choice: nimekukimbilia
  rationale: Nahau hii inaeleza kutafuta usalama na hifadhi kwa Mungu. ‘Nimekukimbilia’ ni Kiswahili cha asili kinachohifadhi picha ya kumwendea Mungu ili kupata ulinzi.
theological_decisions:
- issue: Msingi wa ombi la ulinzi katika כִּי חָסִיתִי בָךְ
  choice: kwa maana nimekukimbilia
  alternative: kwa kuwa ninakutumaini
  rationale: Chaguo hili linahifadhi picha ya kukimbilia kwa Mungu kupata hifadhi, bila kuipunguza kuwa hali ya ndani ya kutumaini pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. ‘Ee Mungu’ hudumisha mwito wa moja kwa moja; ‘miktamu’ imeendelezwa kama istilahi ya kichwa kisicho na maana ya hakika.
