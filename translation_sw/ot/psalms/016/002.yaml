  yaml_path: translation/ot/psalms/016/002.yaml
  text: I said to Yahweh[a], “You are my Lord; I have no good apart from you.”
translation:
  language: sw
  text: Nimemwambia Yahwe, “Wewe ni Bwana wangu; sina mema yoyote mbali nawe.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Wema wangu hauendi zaidi yako,” yaani, mema ya mtunga zaburi hayaenei nje ya Yahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתְּ
  choice: Nimemwambia
  rationale: Ingawa umbo la konsonanti linaweza kusomeka kama nafsi ya pili ya kike, muktadha wa ungamo la mtunga zaburi na ushahidi wa tafsiri za kale huunga mkono maana ya nafsi ya kwanza, ‘nimesema.’ Katika Kiswahili, ‘nimemwambia’ huonyesha kwa kawaida kwamba maneno yanaelekezwa kwa Yahwe.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kuwa ‘Yahwe’; kiambishi ל kinajumuishwa katika kitenzi ‘nimemwambia,’ kinachoonyesha anayeelekezewa maneno.
- source_word: אֲדֹנָי אָתָּה
  choice: Wewe ni Bwana wangu
  rationale: Kiwakilishi cha wazi אָתָּה kimehifadhiwa kwa msisitizo, na אֲדֹנָי pamoja na kiambishi cha nafsi ya kwanza limetafsiriwa ‘Bwana wangu.’
- source_word: טוֹבָתִי
  choice: mema yoyote
  rationale: Neno lina maana pana ya wema, manufaa, au hali njema. ‘Mema’ huhifadhi upana huo bila kudokeza kwamba msemaji anajisifu kwa wema wa maadili.
- source_word: בַּל עָלֶיךָ
  choice: sina ... mbali nawe
  rationale: Kauli hii fupi ya kishairi inaeleza kwamba mema ya msemaji hayapo nje ya Yahwe. ‘Mbali nawe’ ni Kiswahili cha asili kinachoeleza maana hiyo huku tanbihi ikihifadhi tafsiri rasmi zaidi.
theological_decisions:
- issue: Kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania inatumia jina la agano moja kwa moja. ‘Yahwe’ hulihifadhi kama jina, na ‘Bwana wangu’ hutofautisha kwa uwazi cheo אֲדֹנָי kinachofuata.
- issue: Maana ya kishazi cha mwisho
  choice: sina mema yoyote mbali nawe
  alternative: Wema wangu hauko zaidi yako; sina jema lolote isipokuwa wewe
  rationale: Kiebrania ni kifupi na kinaweza kueleweka kwa zaidi ya njia moja. Tafsiri kuu inaonyesha utegemezi wa msemaji kwa Mungu bila kuifanya kauli iwe dai pana zaidi ya matini; tanbihi inahifadhi muundo wa karibu zaidi na Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala. ‘Nimemwambia’ ni cha kawaida zaidi kuliko ‘nilisema kwa,’ na ‘mbali nawe’ ni cha kueleweka kwa urahisi huku tanbihi ikihifadhi ukakamavu wa kishairi wa Kiebrania.
