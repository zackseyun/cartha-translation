  text: Therefore my heart is glad[a], and my glory rejoices[b]; even my flesh will dwell securely.
translation:
  language: sw
  text: Kwa hiyo moyo wangu unafurahi, na utukufu wangu[a] unashangilia; hata mwili wangu utakaa[b] kwa usalama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “heshima yangu” au “nafsi yangu yote.” Baadhi hulielewa neno hili hapa kuwa nahau inayomaanisha nafsi ya mtu, na baadhi ya wafasiri wa kale walilihusianisha na ulimi.
    reason: lexical_alternative
  - marker: b
    text: Au, “mwili wangu utapumzika salama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na imani iliyoelezwa katika mistari iliyotangulia, na ni Kiswahili cha kawaida na wazi.
- source_word: שָׂמַח לִבִּי
  choice: moyo wangu unafurahi
  rationale: Huhifadhi taswira ya moyo kama kitovu cha hisia na mawazo. Wakati wa sasa unaonyesha hali ya furaha inayotokana na uhakika uliotangulia.
- source_word: וַיָּגֶל
  choice: unashangilia
  rationale: Kitenzi hiki huonyesha furaha kubwa; ‘unashangilia’ ni cha asili na hudumisha usambamba wa kishairi.
- source_word: כְּבוֹדִי
  choice: utukufu wangu
  rationale: Hili ndilo chaguo la karibu zaidi na neno la Kiebrania, huku tanbihi ikihifadhi maana nyingine zinazowezekana bila kuifafanua nahau hiyo kupita kiasi.
- source_word: אַף
  choice: hata
  rationale: Huonyesha msisitizo unaopanua furaha ya ndani hadi usalama wa mwili.
- source_word: בְּשָׂרִי
  choice: mwili wangu
  rationale: Katika muktadha huu בשר humaanisha nafsi ya kimwili. ‘Mwili’ ni Kiswahili cha kawaida na chenye heshima kuliko ‘nyama,’ ambacho mara nyingi hueleweka kama nyama ya kuliwa.
- source_word: יִשְׁכֹּן
  choice: utakaa
  rationale: Huwakilisha maana ya kukaa au kuishi mahali, na huacha wazi iwapo wazo hilo linaweza pia kuelezwa kama kupumzika.
- source_word: לָבֶטַח
  choice: kwa usalama
  rationale: Hutoa kwa uwazi maana ya kuwa salama bila hofu au hatari.
theological_decisions:
- issue: Maana ya כְּבוֹדִי katika mstari unaonukuliwa baadaye katika Matendo 2
  choice: utukufu wangu
  alternative: heshima yangu; nafsi yangu yote; ulimi wangu
  rationale: Tafsiri ya karibu ‘utukufu wangu’ huhifadhi uwazi kwa matini ya Kiebrania na uhusiano wake na nukuu ya baadaye, bila kulazimisha mapema mojawapo ya tafsiri za kinahau.
- issue: Tafsiri ya בְּשָׂרִי
  choice: mwili wangu
  alternative: nyama yangu
  rationale: Neno hilo hapa linarejelea sehemu ya kimwili ya mtu, si tabia ya dhambi. ‘Mwili wangu’ huwasilisha maana hiyo kwa Kiswahili cha asili bila kuingiza maana ya kitheolojia isiyokuwamo katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na usambamba kati ya moyo, utukufu na mwili umehifadhiwa. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
