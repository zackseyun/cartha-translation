source:
  edition: WLC
  text: יִרְבּ֥וּ עַצְּבוֹתָ/ם֮ אַחֵ֪ר מָ֫הָ֥רוּ בַּל אַסִּ֣יךְ נִסְכֵּי/הֶ֣ם מִ/דָּ֑ם וּֽ/בַל אֶשָּׂ֥א אֶת שְׁ֝מוֹתָ֗/ם עַל שְׂפָתָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/004.yaml
  text: The sorrows of those who hurry after another god will multiply[a]; I will not pour out their drink offerings of blood[b], nor will I lift up their names on my lips.
translation:
  language: sw
  text: Huzuni za wale wanaoharakia kumfuata mungu mwingine zitaongezeka[a]; sitazimimina sadaka zao za kinywaji za damu[b], wala sitayataja majina yao kwa midomo yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sanamu zao zitaongezeka”; neno la Kiebrania linaweza kuhusishwa na sanamu katika baadhi ya miktadha, ingawa hapa “huzuni” inafaa zaidi katika mfuatano wa mawazo.
    reason: alternative_reading
  - marker: b
    text: Au, “sadaka zao za kinywaji kwa damu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְבּוּ
  choice: zitaongezeka
  rationale: Kauli ya Qal imperfect ya רבה inaeleza kuongezeka; umbo la wakati ujao linafaa kwa matokeo yanayotangazwa katika mstari huu wa kishairi.
- source_word: עַצְּבוֹתָם
  choice: Huzuni za wale
  rationale: Neno hili linaweza kumaanisha huzuni au maumivu, huku likihusishwa pia na sanamu katika baadhi ya miktadha. Hapa 'huzuni' inaeleweka vizuri kama matokeo yanayowapata wanaofuata mungu mwingine.
- source_word: אַחֵר
  choice: mungu mwingine
  rationale: Maana ya msingi ni 'mwingine.' Muktadha wa sadaka za kinywaji na majina unaonyesha kuwa kinachodokezwa ni mungu mwingine; nomino imeongezwa kwa uwazi wa Kiswahili.
- source_word: מָהָרוּ
  choice: wanaokimbilia
  rationale: מהר kwa kawaida humaanisha kufanya haraka. 'Kukimbilia' ni Kiswahili cha kawaida kinachoonyesha ufuatiliaji wa haraka na wenye hamu bila kupanua maana kupita kiasi.
- source_word: בַּל
  choice: si- / wala si-
  rationale: Kikanushi hiki cha kishairi kimetafsiriwa kwa ukanushi wa moja kwa moja katika vipashio vyote viwili.
- source_word: אַסִּיךְ
  choice: sitamimina
  rationale: Hiphil ya נסך humaanisha kumimina sadaka ya kinywaji; 'sitamimina' huhifadhi picha halisi ya ibada.
- source_word: נִסְכֵּיהֶם
  choice: sadaka zao za kinywaji
  rationale: Ni istilahi ya kiibada kwa vimiminwa vinavyotolewa kama sadaka. Kauli hii ni wazi na inaeleweka kwa wasomaji wa kawaida.
- source_word: מִדָּם
  choice: za damu
  rationale: Kiambishi מן kinaweza kuonyesha kitu ambacho sadaka imetengenezwa nacho au chanzo chake. 'Za damu' huhifadhi taswira kali ya Kiebrania; 'kwa damu' imehifadhiwa katika tanbihi.
- source_word: אֶשָּׂא
  choice: sitamaja
  rationale: Ingawa נשא kihalisi ni 'kuinua/kuchukua,' pamoja na 'majina' na 'midomo' maana ya nahau ni kuyatamka au kuyataja. Kiswahili cha moja kwa moja ni cha asili zaidi hapa.
- source_word: שְׁמוֹתָם
  choice: majina yao
  rationale: Kiwakilishi kinaachwa bila kufafanuliwa zaidi, kwa kuwa kinaweza kurejelea miungu mingine inayohusika, huku Kiebrania kikihifadhi kiwango fulani cha utata.
- source_word: עַל שְׂפָתָי
  choice: kwa midomo yangu
  rationale: Nahau hii inahusu kutamka. 'Kwa midomo yangu' ni ya asili katika Kiswahili na huhifadhi taswira ya midomo.
theological_decisions:
- issue: Nomino inayodokezwa baada ya אַחֵר
  choice: mungu mwingine
  alternative: mwingine
  rationale: Muktadha wa ibada, sadaka za kinywaji, na majina unaonyesha mungu mwingine. Kuitaja wazi hufanya Kiswahili kieleweke bila kuongeza dai la kimadhehebu.
- issue: Maana ya עַצְּבוֹתָם
  choice: huzuni
  alternative: sanamu
  rationale: Mstari unaeleweka kwa kawaida kama tangazo kwamba huzuni za wanaokimbilia mungu mwingine zitaongezeka. Kwa kuwa umbo hilo linaweza kuhusishwa na sanamu katika miktadha mingine, uwezekano huo umewekwa katika tanbihi.
- issue: Marejeo ya 'majina yao'
  choice: kuhifadhi kiwakilishi kisichoelezwa
  alternative: majina ya miungu hiyo
  rationale: Muktadha unaelekeza hasa kwa miungu mingine, lakini Kiebrania kinasema tu 'majina yao.' Tafsiri haifungi kabisa utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Wanaokimbilia' ni usemi wa kawaida unaowasilisha mwendo wa haraka kuelekea ibada nyingine; 'sadaka za kinywaji' ni wazi zaidi kwa wasomaji wengi kuliko istilahi ya kitaalamu 'tambiko za kimiminwa.'
