  text: The boundary lines have fallen for me in pleasant places[a]; indeed[b], my inheritance is beautiful to me.
translation:
  language: sw
  text: Kamba za kupimia zimeniangukia mahali pa kupendeza[a]; naam, urithi wangu umenipendeza.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mistari ya mipaka imeniangukia mahali pa kupendeza.” Kiebrania kina picha ya kamba au mistari iliyotumiwa kupima na kuweka mipaka ya urithi uliogawiwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “urithi wangu ni mzuri kwangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבָלִים
  choice: kamba za kupimia
  rationale: Neno hilo linaweza kumaanisha kamba zilizotumiwa kupima na kuweka mipaka ya sehemu iliyogawiwa. Tafsiri hii inadumisha picha halisi ya ugawaji wa ardhi na inaendana na kutajwa kwa urithi katika kishazi cha pili.
- source_word: נָפְלוּ לִי
  choice: zimeniangukia
  rationale: Kitenzi kwa maana ya msingi ni ‘zimeanguka,’ nacho hapa kinadokeza sehemu iliyoangukia mtu katika ugawaji. ‘Zimeniangukia’ huhifadhi picha hiyo na pia huonyesha kwamba sehemu hiyo imekuwa yake.
- source_word: בַּנְּעִמִים
  choice: mahali pa kupendeza
  rationale: Umbo la wingi linalotokana na neno lenye maana ya kupendeza au kuvutia linaeleweka hapa kwa uhusiano na eneo lililogawiwa. Kauli hii ni ya asili katika Kiswahili na huhifadhi taswira ya mahali.
- source_word: אַף
  choice: naam
  rationale: Hapa neno hilo linaongeza mkazo na kuthibitisha kishazi cha kwanza. ‘Naam’ huwasilisha nguvu hiyo ya uthibitisho kwa lugha yenye hadhi.
- source_word: נַחֲלָת
  choice: urithi wangu
  rationale: Katika muktadha wa fungu lililogawiwa na uhusiano wa msemaji nalo, umilikaji wa nafsi ya kwanza unaeleweka. ‘Urithi’ huhifadhi lugha thabiti ya urithi na ugawaji.
- source_word: שָׁפְרָה עָלָי
  choice: ni mzuri kwangu
  rationale: Kitenzi kinaeleza uzuri, kuvutia, au kupendeza, na עָלָי hapa huonyesha tathmini ya msemaji. Tafsiri hii ni ya moja kwa moja huku ikiacha uwezekano wa maana ya ‘unanipendeza.’
theological_decisions:
- issue: Taswira ya ugawaji wa ardhi kama sitiari ya fungu alilopewa mtunga zaburi
  choice: Kudumisha kamba za kupimia na urithi badala ya kubadili mstari uwe kauli ya jumla kuhusu baraka.
  alternative: Baraka nilizogawiwa zinapendeza; naam, fungu langu linanifurahisha.
  rationale: Maneno ya mstari yanaibua ugawaji wa ardhi na yanaungana na muktadha wa karibu ambamo Bwana ndiye fungu la mtunga zaburi. Kudumisha taswira hiyo huhifadhi uzito wake wa kiteolojia bila kuifafanua kupita kiasi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kamba za kupimia’ inadumisha taswira ya Kiebrania; tanbihi inasaidia msomaji kuielewa bila kuifanya matini kuu kuwa maelezo marefu.
