base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/011.yaml
  text: You make known to me the path of life[a]; in your presence is fullness of joy[b]; at your right hand are pleasures forever.
translation:
  language: sw
  text: Unanijulisha njia ya uzima; mbele za uso wako kuna furaha tele[a]; katika mkono wako wa kuume kuna raha milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mbele zako au katika uwepo wako.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹדִיעֵנִי
  choice: Unanijulisha
  rationale: Hifili ya ידע pamoja na kiambishi cha nafsi ya kwanza ina maana ya ‘kunifanya nijue’ au ‘kunijulisha.’ Wakati wa sasa unaonyesha uhakika wa kishairi, ingawa kitenzi kinaweza pia kueleweka kuwa cha wakati ujao.
- source_word: אֹרַח חַיִּים
  choice: njia ya uzima
  rationale: אֹרַח ni njia au mwendo, na חַיִּים hapa ni nomino dhahania yenye maana ya uzima. ‘Njia ya uzima’ ni ya asili katika Kiswahili na huhifadhi sitiari ya mwendo unaoelekea kwenye uzima.
- source_word: שֹׂבַע שְׂמָחוֹת
  choice: furaha tele
  rationale: שֹׂבַע huonyesha utimilifu, wingi au kushiba, huku שְׂמָחוֹת ikiwa wingi wa ‘furaha.’ ‘Furaha tele’ huwasilisha wingi mkuu kwa Kiswahili cha kawaida bila usemi mgumu wa ‘utimilifu wa furaha nyingi.’
- source_word: אֶת־פָּנֶיךָ
  choice: mbele za uso wako
  rationale: Usemi huu una maana halisi ya kuwa mbele ya uso wa Mungu na kimatumizi humaanisha kuwapo kwake. Tafsiri hii hudumisha taswira ya Kiebrania; maana ya kawaida imefafanuliwa katika tanbihi.
- source_word: נְעִמוֹת
  choice: raha
  rationale: Nomino hii huashiria mambo yenye kupendeza, furaha au anasa njema. ‘Raha’ ni neno la kawaida linalofaa muktadha wa baraka na wingi.
- source_word: בִּימִינְךָ
  choice: mkono wako wa kuume una
  rationale: Kiebrania kinaweza kumaanisha ‘katika’ au ‘kwenye mkono wako wa kuume.’ Muundo huu wa Kiswahili unaeleza kwamba raha hizo zinapatikana katika au kwa mkono wa kuume wa Mungu bila kulazimisha maana ya mahali pekee.
- source_word: נֶצַח
  choice: milele
  rationale: Katika muktadha huu neno linaonyesha mwendelezo usio na mwisho; ‘milele’ ndilo neno la kawaida na lenye hadhi katika Kiswahili.
theological_decisions:
- issue: Iwapo אֶת־פָּנֶיךָ itafsiriwe kwa taswira halisi au kwa maana ya kimatumizi ya kuwapo kwa Mungu
  choice: mbele za uso wako
  alternative: mbele zako / katika uwepo wako
  rationale: Taswira ya ‘uso’ imehifadhiwa ili kubaki karibu na Kiebrania na kudumisha maana ya ukaribu wa kibinafsi; tanbihi inaonyesha maana ya kimatumizi bila kuifanya kuwa tafsiri pekee.
- issue: Mahali au chanzo cha raha katika בִּימִינְךָ
  choice: mkono wako wa kuume una raha
  alternative: kwenye mkono wako wa kuume kuna raha
  rationale: Kihusishi בְּ kinaweza kuonyesha mahali au kile kilicho katika uwezo wa mkono. Muundo uliochaguliwa huhifadhi kwa kiasi fulani uwezekano wa raha kuwa katika milki na utoaji wa Mungu, si nafasi kando yake tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. ‘Uzima,’ ‘mbele za uso wako,’ na ‘mkono wa kuume’ huhifadhi hadhi na taswira za zaburi; ‘furaha tele’ huepuka muundo usio wa kawaida wa tafsiri ya neno kwa neno.
