base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/010.yaml
  text: For you will not abandon my soul to Sheol[b][a], nor will you let your faithful one see the pit.
translation:
  language: sw
  text: Kwa maana hutaniacha katika Sheoli[a], wala hutamruhusu mwaminifu wako[b] aone shimo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheoli ni makao au ulimwengu wa wafu katika fikra za Kiebrania; si kaburi moja tu.
    reason: cultural_term
  - marker: b
    text: Au, “mtakatifu wako,” “mcha Mungu wako,” au “mwaminifu wako kwa agano.” Neno la Kiebrania linaweza kumaanisha mtu mwaminifu, mtiifu, mcha Mungu, au mtakatifu.
    reason: lexical_alternative
  - marker: c
    text: Au, “kuoza” au “uharibifu.” Septuajinti na nukuu za mstari huu katika Agano Jipya hutumia maneno yanayokazia kuoza.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huonyesha sababu ya tumaini lililoelezwa katika mstari uliotangulia na inasikika kwa kawaida katika ushairi wa Kiswahili.
- source_word: תַעֲזֹב
  choice: hutaiacha
  rationale: Kitenzi kina maana ya kuacha au kutelekeza; hapa “kuiacha” kinadumisha uhusiano wa moja kwa moja na “nafsi yangu” bila kuongeza wazo lisilokuwamo.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: נפש inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. “Nafsi yangu” inadumisha taswira ya Kiebrania huku maana pana ya uhai au mtu mzima ikibaki wazi.
- source_word: לִשְׁאוֹל
  choice: katika Sheoli
  rationale: Sheoli ni jina la Kiebrania la makao au ulimwengu wa wafu, si kaburi moja tu. Muundo “katika Sheoli” ni wa kawaida na unaeleza mahali anapoachwa mtu.
- source_word: תִתֵּן
  choice: hutamruhusu
  rationale: Ingawa נתן kwa kawaida ni “kutoa,” inapofuatwa na kitenzi-jina hapa ina maana ya kuruhusu.
- source_word: חֲסִידְךָ
  choice: mwaminifu wako
  rationale: חסיד humaanisha mtu mwenye uaminifu, utiifu, au uchaji katika uhusiano na Mungu. “Mwaminifu wako” inaonyesha wazo hilo bila kulazimisha maana ya kiufundi ya utakatifu.
- source_word: לִרְאוֹת
  choice: aone
  rationale: Hii ndiyo maana ya moja kwa moja ya ראה na inadumisha nahau ya Kiebrania, ambayo katika muktadha inaweza pia kumaanisha kupitia au kupatwa na jambo.
- source_word: שָׁחַת
  choice: shimo
  rationale: Katika ulinganifu na Sheoli, “shimo” ndiyo maana ya moja kwa moja inayofaa zaidi; hata hivyo neno linaweza pia kueleweka kuwa uharibifu au kuoza.
theological_decisions:
- issue: Umuhimu wa Kimasihi wa mstari huu katika matumizi ya baadaye ya Agano Jipya
  choice: 'Kutafsiri maana ya moja kwa moja ya maandishi ya Kiebrania katika mstari mkuu: “mwaminifu wako” na “shimo.”'
  alternative: Kutumia “mtakatifu wako” na “kuoza” ili kufanana zaidi na Septuajinti na nukuu za Agano Jipya.
  rationale: Mstari mkuu unapaswa kuwakilisha ushahidi wa Kiebrania bila kuingiza mapema matumizi yake ya baadaye ya Kimasihi. Tafsiri zenye mwangwi huo wa kikristolojia zimehifadhiwa katika tanbihi ili mvutano wa kitheolojia na wa kimapokeo usifutwe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Sheoli” limehifadhiwa kama istilahi ya ulimwengu wa maandishi ya Kiebrania na kufafanuliwa katika tanbihi. Muundo wa mistari miwili na nahau “aone shimo” vinadumisha ushairi na utata wa chanzo.
