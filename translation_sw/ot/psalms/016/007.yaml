  text: I will bless Yahweh[a], who counsels me; even at night my inner being instructs me.
translation:
  language: sw
  text: Nitambariki Yahweh, anayenishauri; hata usiku nafsi yangu ya ndani hunifunza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “figo zangu hunifunza.” Katika Kiebrania, figo zinaweza kuwakilisha undani kabisa wa mtu, pamoja na dhamiri na hisia za ndani.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָרֵךְ
  choice: Nitambariki
  rationale: Kauli ya Piel ya ברך hapa ina maana ya kumbariki Mungu kwa kusema mema juu yake au kumsifu. Wakati ujao wa Kiswahili unaonyesha azimio la mtunga zaburi bila kuibadili kuwa kitenzi cha jumla cha 'kusifu'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limeandikwa kwa unukuzi kama jina binafsi, badala ya kubadilishwa kuwa cheo kama 'BWANA'.
- source_word: יְעָצָנִי
  choice: anayenishauri
  rationale: Kitenzi יעץ humaanisha kutoa shauri. Muundo huu unaonyesha tendo la Yahweh linaloendelea au la kawaida na unaungana kwa kawaida na kishazi cha uhusiano.
- source_word: אַף לֵילוֹת
  choice: hata usiku
  rationale: אַף ina nguvu ya kuongeza na kusisitiza, nayo לֵילוֹת ni wingi wa muda unaoweza kutafsiriwa kwa usemi wa kawaida wa Kiswahili 'usiku'.
- source_word: יִסְּרוּנִי
  choice: hunifunza
  rationale: יסר inaweza kumaanisha kuadibu, kuonya, kurekebisha, au kufundisha. Katika muktadha huu wa tafakari ya ndani ya usiku, 'hunifunza' huhifadhi maana ya malezi na maelekezo bila kulazimisha wazo la adhabu.
- source_word: כִלְיוֹתָי
  choice: nafsi yangu ya ndani
  rationale: Neno hilo kihalisi ni 'figo zangu,' lakini katika antropolojia ya Kiebrania figo huwakilisha undani wa mtu, ikiwemo dhamiri na hisia za ndani. 'Nafsi yangu ya ndani' hutoa maana hiyo kwa Kiswahili cha sasa bila kuibadili kuwa 'moyo' au 'akili'.
theological_decisions:
- issue: Sitiari ya kiantropolojia katika כִלְיוֹתָי
  choice: nafsi yangu ya ndani
  alternative: figo zangu; moyo wangu; akili yangu
  rationale: Tafsiri tendaji inawasilisha mahali pa ndani pa tafakari, hisia, na dhamiri. 'Figo zangu' ingeeleweka hasa kama kiungo cha mwili kwa wasomaji wengi, ilhali 'moyo' au 'akili' ingehamisha picha hiyo kwenda katika istilahi nyingine na kuipunguza maana yake.
- issue: Nguvu ya יסר
  choice: hunifunza
  alternative: huniadibu; hunionya; hunirekebisha
  rationale: Kitenzi kina wigo unaojumuisha mafunzo na nidhamu. Muktadha hauamui wazi kuwa kuna adhabu au kukemewa, hivyo 'hunifunza' huhifadhi wazo la malezi ya ndani bila kuondoa kabisa uwezekano wa kujisahihisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. 'Nafsi yangu ya ndani' imechaguliwa kwa uelewekevu wa sasa, huku tanbihi ikihifadhi picha halisi ya Kiebrania. Kiashiria [a] kimewekwa mara tu baada ya kishazi kinachofafanuliwa.
