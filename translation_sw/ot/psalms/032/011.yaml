  text: שִׂמְח֬וּ בַֽ/יהוָ֣ה וְ֭/גִילוּ צַדִּיקִ֑ים וְ֝/הַרְנִ֗ינוּ כָּל יִשְׁרֵי לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/011.yaml
  text: Be glad in Yahweh and rejoice[a], you righteous; shout for joy[b], all you upright in heart.
translation:
  language: sw
  text: Furahini katika Yahweh na mshangilie, enyi wenye haki; pazeni sauti za shangwe[a], ninyi nyote mlio wanyofu wa moyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “imbeni kwa furaha.” Kitenzi cha Kiebrania kinaweza kumaanisha kutoa sauti kubwa ya shangwe, iwe kwa kupaza sauti au kwa kuimba.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחוּ
  choice: Furahini
  rationale: Kauli ya kuamuru kwa wingi inatoa mwito wa kuwa na furaha; “Furahini” ni ya kawaida na inaeleweka vizuri katika Kiswahili.
- source_word: בַיהוָה
  choice: katika Yahwe
  rationale: Kihusishi ב hapa kinaonyesha msingi au mahali pa furaha, hivyo “katika Yahwe” huhifadhi muundo na maana ya Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: וְגִילוּ
  choice: na mshangilie
  rationale: Kitenzi גיל kinaonyesha furaha kubwa inayodhihirishwa wazi; “mshangilie” hukitofautisha kwa kawaida na שׂמח.
- source_word: צַדִּיקִים
  choice: enyi wenye haki
  rationale: Nomino hii imetumiwa kama mwito wa moja kwa moja kwa kundi linaloagizwa.
- source_word: וְהַרְנִינוּ
  choice: pigeni vigelegele vya furaha
  rationale: רנן katika Hifili huonyesha kutoa sauti kubwa ya furaha, ambayo inaweza kuwa kilio au wimbo; usemi huu unadokeza sauti ya shangwe bila kuifanya lazima iwe uimbaji.
- source_word: כָּל
  choice: ninyi nyote
  rationale: Huhusisha kundi lote linaloitwa kuitikia kwa furaha.
- source_word: יִשְׁרֵי לֵב
  choice: mlio wanyofu wa moyo
  rationale: Huhifadhi sitiari ya Kiebrania inayohusu unyofu wa ndani na uadilifu wa moyo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku “Yehova” likiwa umbo la kimapokeo lenye msingi tofauti wa matamshi.
- issue: Maana ya wenye haki na wanyofu wa moyo
  choice: Kudumisha maelezo yote mawili bila kuyafanya madai ya ukamilifu usio na dhambi
  alternative: Watu wakamilifu; watu waaminifu tu
  rationale: צַדִּיקִים na יִשְׁרֵי לֵב yanaeleza uadilifu na unyofu, lakini mstari wenyewe haufafanui kiwango chake wala msingi wa kitheolojia; tafsiri haipaswi kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Enyi” inafaa kwa mwito wa kishairi, na “mlio wanyofu wa moyo” huhifadhi picha ya asili bila kuwa ngumu.
