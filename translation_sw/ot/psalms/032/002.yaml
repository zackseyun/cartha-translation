  text: אַ֥שְֽׁרֵי אָדָ֗ם לֹ֤א יַחְשֹׁ֬ב יְהוָ֣ה ל֣/וֹ עָוֺ֑ן וְ/אֵ֖ין בְּ/רוּח֣/וֹ רְמִיָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/002.yaml
  text: Blessed is the man to whom Yahweh does not count iniquity[b][a], and in whose spirit there is no deceit.
translation:
  language: sw
  text: Heri mtu ambaye Yahwe hamhesabii uovu[a], na ambaye rohoni mwake hamna udanganyifu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hatia” au “dhambi.” Neno la Kiebrania linaweza kumaanisha kosa lenyewe, hatia inayotokana nalo, au matokeo yake.
    reason: lexical_alternative
  - marker: b
    text: Au, “hila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heri
  rationale: Kauli hii ya baraka inaelezwa kwa Kiswahili cha kawaida na chenye hadhi kwa neno “Heri,” ambalo linafaa katika muktadha wa mashairi ya hekima.
- source_word: אָדָם
  choice: mtu
  rationale: Neno hili ni la umoja na hapa lina maana ya jumla kwa mwanadamu mmoja anayewakilisha wengine. “Mtu” huhifadhi umoja na maana hiyo ya jumla kwa Kiswahili bila kuifanya aya iwahusu wanaume pekee.
- source_word: יַחְשֹׁב ... לּוֹ
  choice: hamhesabii
  rationale: Kitenzi hiki pamoja na kiwakilishi cha yule anayehusika kina picha ya kuhesabu au kuweka jambo katika hesabu ya mtu. “Hamhesabii” ni cha kawaida na kinadumisha picha hiyo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: עָוֹן
  choice: hatia
  rationale: Katika muktadha wa kutohesabiwa, “hatia” huonyesha uzito wa kosa na pia hulingana vizuri na lugha ya kuhesabu. Neno la Kiebrania linaweza pia kueleza uovu au dhambi, hivyo tofauti hiyo imehifadhiwa katika tanbihi.
- source_word: בְּרוּחוֹ
  choice: rohoni mwake
  rationale: Hii huhifadhi rejeo la hali ya ndani ya mtu na ni muundo wa kawaida wa Kiswahili.
- source_word: רְמִיָּה
  choice: udanganyifu
  rationale: Neno hili linaeleza udanganyifu au hila. “Udanganyifu” ni wazi na la sasa, na linafaa kwa wazo la kutokuwa mkweli mbele za Mungu.
theological_decisions:
- issue: Maana ya jumla ya אָדָם
  choice: mtu
  alternative: mwanadamu
  rationale: Ingawa nomino ya Kiebrania ni ya umoja, hapa haimweki mwanamume tofauti na mwanamke. “Mtu” huhifadhi umoja na maana ya jumla kwa njia ya kawaida katika Kiswahili.
- issue: Picha ya Mungu kutomhesabia mtu hatia
  choice: Yahwe hamhesabii hatia
  alternative: Yahwe hamwekei kosa dhidi yake
  rationale: “Hamhesabii” hudumisha lugha ya kihesabu iliyomo katika kitenzi cha Kiebrania bila kuifanya aya kuwa kauli ya kiteolojia iliyoelezwa kwa mfumo wa baadaye.
- issue: Upeo wa maana ya עָוֹן
  choice: hatia
  alternative: uovu au dhambi
  rationale: Neno linaweza kumaanisha tendo potovu, hatia inayotokana nalo, au matokeo yake. Muktadha wa kuhesabu unapendelea “hatia,” lakini tanbihi huhifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa kishairi, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. Sentensi inadumisha umoja wa mtu anayetajwa, picha ya kuhesabu, na hali ya ndani inayomaanishwa na “rohoni mwake.”
