source:
  edition: WLC
  text: אַתָּ֤ה סֵ֥תֶר לִ/י֮ מִ/צַּ֪ר תִּ֫צְּרֵ֥/נִי רָנֵּ֥י פַלֵּ֑ט תְּס֖וֹבְבֵ֣/נִי סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/007.yaml
  text: You are a hiding place for me[a]; from distress you preserve me; you surround me with shouts of deliverance[b]. Selah
translation:
  language: sw
  text: 'Wewe ndiwe maficho yangu;

    utanilinda dhidi ya dhiki;

    utanizunguka kwa shangwe za ukombozi.[a]

    Sela.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nyimbo za ukombozi” au “vilio vya ukombozi.”
    reason: lexical_alternative
  - marker: b
    text: “Sela” yaelekea ni alama ya kimuziki au ya kiliturujia; maana yake kamili haijulikani.
    reason: cultural_note
lexical_decisions:
- source_word: סֵתֶר
  choice: mahali pa kujificha
  rationale: Nomino hii humaanisha mahali pa kufichika au pa kupata ulinzi. Kauli hii ni ya kawaida katika Kiswahili na inadumisha taswira ya Mungu kama mahali pa kukimbilia.
- source_word: מִצַּר
  choice: na dhiki
  rationale: צַר hapa inaweza kumaanisha dhiki, taabu, au hali ya kubanwa. Katika muundo wa Kiswahili, ‘kulinda na dhiki’ huonyesha kuondolewa au kuhifadhiwa mbali na dhiki bila kudhania kwamba מדובר kuhusu adui fulani.
- source_word: תִּצְּרֵנִי
  choice: utanilinda
  rationale: Kitenzi נצר humaanisha kutunza, kulinda, au kuhifadhi. ‘Utanilinda’ ni cha asili na wazi, huku kikihifadhi wazo la ulinzi wa Mungu.
- source_word: רָנֵּי
  choice: shangwe
  rationale: Wingi huu wa רנה hurejelea vilio au sauti zenye mlio wa furaha. ‘Shangwe’ huwasilisha furaha na nguvu ya sauti hizo bila kuzifunga kwa lazima kuwa nyimbo.
- source_word: פַלֵּט
  choice: ukombozi
  rationale: Umbo hili kutoka פלט linaonyesha kuokolewa, kuponywa, au kupata njia ya kutoroka. ‘Ukombozi’ linafaa katika kishazi cha kishairi na halibani maana kwa aina moja maalumu ya hatari.
- source_word: תְּסוֹבְבֵנִי
  choice: utanizunguka
  rationale: Kitenzi סבב humaanisha kuzunguka au kuzingira. Tafsiri hii inadumisha taswira ya msemaji kuzungukwa pande zote.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya neno hili haijulikani. Limetoholewa badala ya kupewa maana isiyo na uhakika kama ‘pumziko’ au ‘kiingilio cha muziki.’
theological_decisions:
- issue: Asili ya ‘shangwe za ukombozi’ zinazomzunguka msemaji
  choice: Kishazi kimetafsiriwa kuwa sauti za furaha zinazohusiana na ukombozi, bila kutaja anayezitoa.
  alternative: nyimbo za ukombozi; vilio vya kuokolewa; kelele za ushindi
  rationale: Kishazi cha Kiebrania רָנֵּי פַלֵּט ni kifupi na kinaweza kueleweka kwa njia kadhaa zinazokaribiana. ‘Shangwe za ukombozi’ kinadumisha hali yake ya kishairi na hakiamui kama sauti hizo zinatoka kwa Mungu, kwa waabudu, au kwa mtunga zaburi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini rahisi kueleweka. Mistari mitatu inadumisha urari wa mashairi ya Kiebrania; wakati ujao katika ‘utanilinda’ na ‘utanizunguka’ unaonyesha tumaini la msemaji bila kuongeza maelezo yasiyomo katika chanzo.
