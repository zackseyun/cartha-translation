  text: Nitakupa ufahamu, na nitakufundisha njia unayopaswa kuiendea[a][c]; nitakushauri huku jicho langu likiwa juu yako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “njia utakayoiendea,” au “njia hii utakayoiendea.” Maneno ya Kiebrania yanaruhusu maana halisi zaidi ya wakati ujao, lakini muktadha wa mafundisho unaunga mkono “njia unayopaswa kuiendea.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “jicho langu juu yako.” Hii inaweza kueleza uongozi wenye uangalifu au utunzaji makini.
    reason: lexical_alternative
  - marker: c
    text: Msemaji anaweza kueleweka kuwa BWANA au mtunga zaburi; Kiebrania cha mstari huu hakimtambulishi waziwazi.
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׂכִּילְךָ
  choice: Nitakupa ufahamu
  rationale: Hifili ya שׂכל ina maana ya kumsababisha mtu aelewe au awe na ufahamu. Kauli hii huhifadhi dhana hiyo ya kisababishi na inaendana na muktadha wa mafundisho.
- source_word: וְאוֹרְךָ
  choice: na kukufundisha
  rationale: Hifili ya ירה inaweza kumaanisha kufundisha, kuelekeza, au kuonyesha. Hapa inalingana na tendo la kutoa ufahamu, huku wazo la mwelekeo likibebwa na kirai kinachofuata kuhusu njia.
- source_word: בְּדֶרֶךְ זוּ תֵלֵךְ
  choice: njia unayopaswa kuiendea
  rationale: Muundo wa Kiebrania unaweza kueleweka kwa maana ya wakati ujao, 'njia utakayoiendea,' lakini muktadha wa kufundisha na kuelekeza unaunga mkono maana ya njia inayofaa kufuatwa. Kiswahili hiki ni cha kawaida na hakibadili njia kuwa amri ya moja kwa moja.
- source_word: אִיעֲצָה
  choice: nitakushauri
  rationale: Kitenzi יעץ humaanisha kutoa shauri. 'Nitakushauri' ni Kiswahili cha kawaida, chenye hadhi, na huhifadhi sauti ya hekima ya mstari.
- source_word: עָלֶיךָ עֵינִי
  choice: jicho langu likiwa juu yako
  rationale: Tafsiri hii huhifadhi sitiari halisi ya jicho lililo juu ya mtu, ambayo inaweza kudokeza uongozi wenye uangalifu au utunzaji makini bila kulazimisha maana moja.
theological_decisions:
- issue: Utambulisho wa msemaji katika Zaburi 32:8
  choice: Mstari umetafsiriwa katika nafsi ya kwanza bila kumtaja msemaji kuwa BWANA au mtunga zaburi.
  alternative: Kumtambulisha msemaji waziwazi kuwa BWANA, au kuwa mtunga zaburi anayemwelekeza msikilizaji.
  rationale: Kiebrania cha mstari wenyewe kina ahadi za nafsi ya kwanza za kutoa ufahamu, kufundisha, na kushauri, lakini hakimtambulishi msemaji waziwazi. Tafsiri inadumisha uwazi huo wa kifasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida, huku sitiari ya Kiebrania ya 'jicho langu juu yako' na kutotambulishwa kwa msemaji vikihifadhiwa.
