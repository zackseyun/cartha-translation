  yaml_path: translation/ot/psalms/032/004.yaml
  text: For day and night your hand was heavy upon me[a]; my vitality was dried up as by the heat of summer[b]. Selah
translation:
  language: sw
  text: Kwa maana mchana na usiku mkono wako ulinilemea; uhai wangu ulikauka[a] kama kwa joto la kiangazi.[b] Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “majimaji ya mwili wangu yaligeuka.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika ukame wa kiangazi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaunganisha mstari huu na uliotangulia kwa kutoa sababu, bila kufafanua uhusiano huo kupita kiasi.
- source_word: יוֹמָם וָלַיְלָה
  choice: mchana na usiku
  rationale: Ni usemi wa kawaida unaoonyesha hali iliyoendelea wakati wote.
- source_word: תִּכְבַּד ... יָדֶךָ עָלַי
  choice: mkono wako ulinilemea
  rationale: Inahifadhi picha halisi ya mkono wa Mungu wenye uzito huku ikitumia Kiswahili cha kawaida na chenye hadhi.
- source_word: נֶהְפַּךְ
  choice: ulikauka
  rationale: Kitenzi chenyewe humaanisha kugeuka au kubadilika, lakini muktadha wa ukavu wa kiangazi unaonyesha kuishiwa na uhai; maana halisi zaidi imehifadhiwa katika tanbihi.
- source_word: לְשַׁדִּי
  choice: uhai wangu
  rationale: Neno hili linaweza kumaanisha majimaji au utomvu wa mwili, na kwa njia ya picha nguvu ya uhai. 'Uhai wangu' linaeleweka kwa urahisi bila kuondoa picha ya kudhoofika.
- source_word: בְּחַרְבֹנֵי קַיִץ
  choice: kama kwa joto la kiangazi
  rationale: Inawasilisha kwa lugha ya kawaida hali ya joto linalokausha; maana mbadala ya 'ukame wa kiangazi' imehifadhiwa katika tanbihi.
- source_word: סֶלָה
  choice: Sela
  rationale: Neno la Kiebrania limeachwa bila kutafsiriwa kwa sababu maana yake kamili kama alama ya muziki au liturujia haijulikani kwa uhakika.
theological_decisions:
- issue: Utendaji wa Mungu katika mateso ya mtunga zaburi
  choice: Mkono wa Mungu unatajwa wazi kuwa ulimlemea mtunga zaburi.
  alternative: Kueleza hali hiyo kama mateso ya jumla yasiyohusishwa moja kwa moja na Mungu, au kama adhabu ya Mungu iliyofafanuliwa kidogma.
  rationale: Kiebrania kinataja wazi 'mkono wako,' lakini mstari huu haufafanui kwa undani namna au kusudi la tendo hilo. Tafsiri inadumisha dai hilo na mvutano wake bila kuingiza mfumo wa mafundisho usiotajwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kishairi lakini unaeleweka kwa msomaji wa kawaida; picha ya mkono unaolemea na uhai unaokauka imehifadhiwa.
