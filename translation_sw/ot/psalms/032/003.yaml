  text: For when I kept silent[a], my bones wasted away through my groaning all day long.
translation:
  language: sw
  text: Kwa maana niliponyamaza, mifupa yangu ilichakaa kwa kuugua kwangu[a] mchana kutwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kunguruma kwangu.” Neno la Kiebrania linaweza kumaanisha kilio kikubwa kama mngurumo, lakini hapa huenda linarejelea kuugua kwa uchungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana nilipo-
  rationale: כִּי hapa inaanzisha maelezo ya hali iliyotangulia; muundo “Kwa maana niliponyamaza” ni wa kawaida katika Kiswahili na unaunganisha sababu na wakati bila kulazimisha maana moja pekee.
- source_word: הֶחֱרַשְׁתִּי
  choice: niliponyamaza
  rationale: Kitenzi חרשׁ kinamaanisha kuwa kimya au kunyamaza. Tafsiri hii inadokeza hali iliyoendelea bila kuongeza wazi kwamba ukimya huo ulihusu dhambi, jambo ambalo muktadha unaonyesha lakini mstari wenyewe hausemi.
- source_word: בָּלוּ
  choice: ilidhoofika
  rationale: בלה huonyesha kuchakaa, kuharibika, au kudhoofika. Kwa “mifupa,” “ilidhoofika” huhifadhi picha ya kuzorota kwa mwili na nafsi kwa Kiswahili cha kawaida.
- source_word: עֲצָמַי
  choice: mifupa yangu
  rationale: Tafsiri halisi inahifadhi taswira ya Kiebrania inayotumia mifupa kueleza hali ya ndani ya mtu mzima.
- source_word: בְּשַׁאֲגָתִי
  choice: kwa kuugua kwangu
  rationale: שׁאגה inaweza kumaanisha kunguruma au kutoa kilio kikubwa. Katika muktadha huu wa maumivu, “kuugua” ni ya asili zaidi, huku kihusishi “kwa” kikionyesha hali au njia iliyoambatana na kudhoofika.
- source_word: כָּל הַיּוֹם
  choice: mchana kutwa
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha muda wote wa siku.
theological_decisions:
- issue: Iwapo kutaja wazi kwamba ukimya ulihusu dhambi isiyoungamwa
  choice: Kuacha jambo hilo likidokezwa tu
  alternative: niliponyamaza kuhusu dhambi yangu
  rationale: Muktadha wa Zaburi unaonyesha kuwa mwandishi alikuwa kimya kuhusu dhambi yake, lakini mstari huu wa Kiebrania hautaji kitu alichokinyamazia. Kuacha maana hiyo ikiwa fiche kunahifadhi ufupi na mvutano wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa kishairi umehifadhiwa kwa lugha rahisi; taswira ya “mifupa” haijafafanuliwa kwa paraphrase.
