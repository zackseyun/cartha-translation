  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Umoja wa mnyama wa mfano umetumiwa baada ya kutaja farasi na nyumbu ili kuendana na viambishi vya umoja katika Kiebrania. Alama ya tanbihi imewekwa kwenye kishazi kinachohusika moja kwa moja.
