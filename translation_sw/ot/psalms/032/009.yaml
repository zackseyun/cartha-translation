base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/009.yaml
  text: Do not be like a horse or like a mule[a], without understanding, whose trappings are bit and bridle to restrain it, or else it will not come near you.
translation:
  language: sw
  text: Msiwe kama farasi wala nyumbu, wanyama wasio na ufahamu, ambao hufungwa lijamu na hatamu ili wazuiwe; la sivyo hawatakukaribia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili wasikukaribie.” Kishazi cha mwisho ni kigumu katika Kiebrania. Kinaweza kumaanisha kwamba wanyama hao hukataa kukaribia wasipodhibitiwa, au kwamba wanahitaji kuzuiwa ili wasikukaribie.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּהְיוּ
  choice: Msiwe
  rationale: Muundo wa אַל pamoja na kitenzi cha hali isiyotimilika unaonyesha katazo. “Msiwe” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: כְּסוּס כְּפֶרֶד
  choice: kama farasi au kama nyumbu
  rationale: Majina ya wanyama yamehifadhiwa katika umoja wa mfano. Kiunganishi “au” kinaonyesha mifano miwili inayolinganishwa na wasikilizaji.
- source_word: אֵין הָבִין
  choice: asiye na ufahamu
  rationale: Kirai kinaeleza kukosa uwezo wa kuelewa au kutambua. “Ufahamu” huhifadhi maana ya kiakili na kimaadili bila kuongeza ufafanuzi.
- source_word: בְּמֶתֶג וָרֶסֶן
  choice: lijamu na hatamu
  rationale: Maneno haya yanataja vifaa vya kudhibitia mnyama. “Lijamu na hatamu” ni jozi inayoeleweka katika Kiswahili na inahifadhi picha ya kumwelekeza na kumzuia mnyama.
- source_word: עֶדְיוֹ לִבְלֹם
  choice: ambaye hufungwa lijamu na hatamu ili azuiwe
  rationale: עֶדְיוֹ kwa kawaida ni pambo au kifaa kinachovaliwa, lakini hapa muktadha unaonyesha vifaa vinavyowekwa juu ya mnyama. Muundo huu wa Kiswahili unaeleza uhusiano huo kwa kawaida huku לִבְלֹם ikitafsiriwa “ili azuiwe.”
- source_word: בַּל קְרֹב אֵלֶיךָ
  choice: vinginevyo hatakukaribia
  rationale: 'Hii ni njia moja inayowezekana ya kuelewa kishazi kigumu cha Kiebrania: mnyama hatamkaribia anayemshughulikia isipokuwa adhibitiwe. Umoja wa mnyama wa mfano umehifadhiwa.'
