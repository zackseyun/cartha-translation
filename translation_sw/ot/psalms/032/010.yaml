  text: רַבִּ֥ים מַכְאוֹבִ֗ים לָ/רָ֫שָׁ֥ע וְ/הַ/בּוֹטֵ֥חַ בַּ/יהוָ֑ה חֶ֝֗סֶד יְסוֹבְבֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/010.yaml
  text: Many pains belong to the wicked[b][a], but steadfast love surrounds the one who trusts in Yahweh.
translation:
  language: sw
  text: 'Maumivu ya mtu mwovu ni mengi[a],

    lakini anayemtumaini Yahwe huzungukwa na upendo thabiti[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Huzuni za mtu mwovu ni nyingi.” Neno la Kiebrania linaweza kumaanisha maumivu, huzuni, au mateso.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania חֶסֶד linaweza pia kutafsiriwa “rehema,” “fadhili,” au “upendo wa agano,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: ni mengi
  rationale: Hutoa maana ya wingi kwa Kiswahili cha kawaida na kudumisha mkazo wa kishairi kwamba maumivu ni mengi.
- source_word: מַכְאוֹבִים
  choice: maumivu
  rationale: Neno hili la Kiebrania linaweza kumaanisha maumivu, huzuni, au mateso; “maumivu” hudumisha upana wake wa kimwili na kihisia.
- source_word: לָרָשָׁע
  choice: ya mtu mwovu
  rationale: Kiambishi ל kinaonyesha uhusiano wa maumivu na mwovu bila kulazimisha wazo lisilotajwa wazi la jinsi yanavyompata. Umoja umetafsiriwa kwa namna ya jumla, si kama mwanamume mmoja maalumu.
- source_word: וְהַבּוֹטֵחַ
  choice: lakini anayemtumaini
  rationale: Kitenzi-shirikishi kimetolewa kama mtu asiyeainishwa, “anaye…,” na וְ imetafsiriwa “lakini” kwa sababu ya ulinganisho ulio wazi na mtu mwovu.
- source_word: בַּיהוָה
  choice: Yahwe
  rationale: Jina la agano יְהוָה limetolewa moja kwa moja kama “Yahwe”; muundo wa Kiswahili “kumtumaini Yahwe” unawakilisha kwa kawaida ב pamoja na בטח.
- source_word: חֶסֶד
  choice: upendo thabiti
  rationale: Huwasilisha upendo mwaminifu na wa kudumu unaodokezwa na חֶסֶד bila kuupunguza kuwa huruma pekee.
- source_word: יְסוֹבְבֶנּוּ
  choice: huzungukwa
  rationale: Kauli ya kutendwa ya Kiswahili inaonyesha kwamba upendo thabiti humzunguka mtu anayemtumaini Yahwe na kutoa sentensi ya kawaida, iliyo wazi.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania inatumia moja kwa moja Tetragramatoni; “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Umoja wa jumla katika רָשָׁע
  choice: mtu mwovu
  alternative: mwovu; waovu
  rationale: Umoja wa Kiebrania unamwakilisha mtu wa aina fulani kwa ujumla. “Mtu mwovu” ni wa kawaida katika Kiswahili na hauashirii kwamba mstari unamhusu mwanamume mmoja maalumu.
- issue: Maana pana ya חֶסֶד
  choice: upendo thabiti
  alternative: rehema; fadhili; upendo wa agano
  rationale: “Upendo thabiti” huhifadhi wazo la upendo mwaminifu na wa kudumu bila kuamua kimadhehebu kwamba kila matumizi lazima litajwe wazi kuwa “upendo wa agano.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa mistari unaonyesha ulinganisho kati ya mtu mwovu na anayemtumaini Yahwe. Alama za tanbihi zimewekwa baada ya maneno yanayohusika.
