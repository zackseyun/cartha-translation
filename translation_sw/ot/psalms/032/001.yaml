  text: לְ/דָוִ֗ד מַ֫שְׂכִּ֥יל אַשְׁרֵ֥י נְֽשׂוּי פֶּ֗שַׁע כְּס֣וּי חֲטָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/001.yaml
  text: Of David[a]. A Maskil. Blessed is the one whose transgression is forgiven[b], whose sin is covered.
translation:
  language: sw
  text: 'Ya Daudi. Maskili.[a]


    Heri yule ambaye uasi wake umesamehewa,[b]

    ambaye dhambi yake imefunikwa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania Maskil, istilahi katika kichwa cha zaburi ambayo maana yake kamili haijulikani kwa uhakika; huenda ikawa utenzi wa kufundisha au wa kutafakari.
    reason: cultural_note
  - marker: b
    text: Kihalisi, “umeinuliwa” au “umeondolewa,” hapa ikiwa na maana ya “umesamehewa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Kihusishi ל katika vichwa vya zaburi kinaweza kuonyesha uandishi, uhusiano, wakfu, au matumizi kwa ajili ya mtu. “Ya Daudi” ni ya kawaida katika Kiswahili na haibainishi kupita kiasi aina ya uhusiano huo.
- source_word: מַשְׂכִּיל
  choice: Maskili
  rationale: Maana na kazi kamili ya istilahi hii ya kichwa cha zaburi hazijulikani kwa uhakika. Kuiandika kwa matamshi ya Kiswahili huepuka kuingiza tafsiri yenye uhakika wa bandia; maelezo yanawekwa katika tanbihi.
- source_word: אַשְׁרֵי
  choice: Heri
  rationale: Neno hili ni tamko la hali njema au kubarikiwa. “Heri” ni usemi wa kawaida, wenye hadhi, na unaofaa kwa mtindo wa mashairi ya hekima katika Kiswahili.
- source_word: נְשׂוּי
  choice: umesamehewa
  rationale: Kitenzi נשׂא kimsingi humaanisha kuinua, kubeba, au kuondoa. Kinapotumiwa kuhusu uasi, maana ya kimuktadha ni kusamehewa; taswira halisi ya kuinuliwa au kuondolewa imehifadhiwa katika tanbihi.
- source_word: פֶּשַׁע
  choice: uasi
  rationale: Neno hili huonyesha kuvunja uaminifu au kuasi kwa makusudi. “Uasi” huhifadhi uzito huo kuliko neno la jumla zaidi la kosa na linaendana na mlingano wake na “dhambi.”
- source_word: כְּסוּי
  choice: imefunikwa
  rationale: Hii ni hali ya kutendwa kutoka כסה, “kufunika.” Tafsiri hii huhifadhi sitiari ya Kiebrania na mlingano wa kishairi.
- source_word: חֲטָאָה
  choice: dhambi
  rationale: Katika muktadha huu neno linamaanisha kosa la kimaadili linalolingana na “uasi,” wala si dhabihu ya dhambi.
theological_decisions:
- issue: Kuwakilisha mhusika mmoja wa jumla katika tamko la heri
  choice: Heri yule ambaye...
  alternative: Heri watu ambao... / Heri mtu ambaye...
  rationale: Kiebrania hutumia mhusika mmoja kama mwakilishi wa kila mtu. “Yule ambaye” huhifadhi umoja huo bila kuongeza jinsia ambayo haikusudiwi na maandishi.
- issue: Jinsi ya kushughulikia istilahi ya kichwa מַשְׂכִּיל
  choice: Kuhifadhi istilahi kama “Maskili” katika maandishi makuu
  alternative: Zaburi ya mafundisho / utenzi wa kutafakari
  rationale: Kwa kuwa maana na matumizi yake sahihi vina utata, kuitafsiri kwa maelezo mahususi kungeondoa utata halisi wa chanzo.
- issue: Uhusiano kati ya msamaha na sitiari ya kufunika dhambi
  choice: Kuhifadhi “imesamehewa” katika mstari wa kwanza na “imefunikwa” katika mstari wa pili
  alternative: Kuifanya mistari yote miwili kuwa maelezo ya moja kwa moja ya msamaha
  rationale: Uamuzi huu huwasilisha maana ya kimuktadha ya נשׂא huku ukihifadhi sitiari tofauti ya כסה na mvutano wa kishairi wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo mfupi, wa kishairi na wenye hadhi. “Heri” na urudiaji wa “ambaye” huhifadhi muundo wa tamko la heri na mlingano wa Kiebrania. Kichwa kimetengwa na mstari wa zaburi ili kisomwe kama kichwa cha utunzi.
