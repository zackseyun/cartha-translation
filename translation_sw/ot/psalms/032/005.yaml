  text: חַטָּאתִ֨/י אוֹדִ֪יעֲ/ךָ֡ וַ/עֲוֺ֘נִ֤/י לֹֽא כִסִּ֗יתִי אָמַ֗רְתִּי אוֹדֶ֤ה עֲלֵ֣י פְ֭שָׁעַ/י לַ/יהוָ֑ה וְ/אַתָּ֨ה נָ֘שָׂ֤אתָ עֲוֺ֖ן חַטָּאתִ֣/י סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/005.yaml
  text: I made my sin known to you[a], and I did not cover my iniquity. I said, “I will confess my transgressions to Yahweh,” and you forgave the iniquity of my sin. Selah
translation:
  language: sw
  text: 'Dhambi yangu nilikujulisha,

    wala sikuufunika uovu wangu.

    Nilisema, “Nitayakiri maasi yangu kwa Yahwe,”

    nawe ukasamehe[a] uovu wa dhambi yangu.

    Sela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ulibeba” au “uliinua” uovu wa dhambi yangu. Kitenzi hiki kina taswira ya kubeba au kuondoa mzigo; katika muktadha huu humaanisha “ukasamehe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטָּאתִי
  choice: dhambi yangu
  rationale: Neno חַטָּאת humaanisha dhambi au kosa la dhambi. “Dhambi yangu” ni tafsiri ya moja kwa moja na huhifadhi utofauti wake na עָוֹן na פֶּשַׁע.
- source_word: אוֹדִיעֲךָ
  choice: nilikujulisha
  rationale: Hifili ya ידע ina maana ya kufanya jambo lijulikane. “Nilikujulisha” huhifadhi maana hiyo ya kisababishi kwa Kiswahili cha kawaida.
- source_word: עֲוֺנִי
  choice: uovu wangu
  rationale: עָוֹן inaweza kutaja uovu, hatia, au mzigo wa kosa. “Uovu wangu” huhifadhi uzito wa neno na kulitofautisha na “dhambi” na “maasi” katika utatu wa maneno ya mstari huu.
- source_word: כִסִּיתִי
  choice: sikuficha
  rationale: Ingawa כסה kihalisi ni “kufunika,” katika muktadha huu “kuficha” huwasilisha kwa kawaida kitendo cha kutokiri kosa, bila kubadili maana.
- source_word: אוֹדֶה
  choice: nitayakiri
  rationale: Katika hifili, ידה inaweza kumaanisha kukiri au kushukuru. Kwa kuwa kitu kinachotajwa ni maasi, hapa maana ni kukiri.
- source_word: עֲלֵי פְשָׁעַי
  choice: maasi yangu
  rationale: פֶּשַׁע hueleza uasi au uvunjaji wa makusudi. “Maasi yangu” huhifadhi utofauti wake na “dhambi” na “uovu”; kihusishi עַל kinaeleweka ndani ya muundo wa kawaida wa Kiswahili wa “kukiri maasi.”
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Jina la agano יהוה limetoholewa kuwa “Yahwe,” badala ya kubadilishwa na cheo. “Kwa” huonyesha anayeelekezewa ungamo.
- source_word: נָשָׂאתָ
  choice: ukasamehe
  rationale: נשא kihalisi ni kuinua au kubeba, lakini inapokuwa na uovu au dhambi kama kitu chake humaanisha kusamehe. Tafsiri ya maana hiyo inasomeka kwa kawaida, huku taswira ya Kiebrania ikihifadhiwa katika tanbihi.
- source_word: עֲוֺן חַטָּאתִי
  choice: uovu wa dhambi yangu
  rationale: Muundo huu huhifadhi uhusiano wa maneno mawili ya Kiebrania badala ya kuyafanya kuwa neno moja kama “hatia,” hivyo unaacha uzito wake wa kimakusudi.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya neno hili haijulikani kwa uhakika; limetoholewa badala ya kupewa fasiri isiyo na uhakika kama “pumziko” au “kiitikio.”
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina יהוה. “Yahwe” hulihifadhi kama jina maalumu la agano bila kulibadili kuwa cheo.
- issue: Iwapo נשאת עון itafsiriwe kihalisi au kwa maana yake ya kimuktadha
  choice: ukasamehe
  alternative: ukaondoa; ukabeba uovu wa dhambi yangu
  rationale: Katika muktadha huu kirai kinataja msamaha wa Mungu. “Ukasamehe” huwasilisha maana yake wazi kwa Kiswahili, na tanbihi huhifadhi uwezekano wa taswira ya kuinua au kubeba mzigo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa mistari unafuata mwendo wa ushairi wa Kiebrania. Maneno “dhambi,” “uovu,” na “maasi” yametumiwa kwa makusudi kuhifadhi maneno matatu tofauti ya chanzo.
