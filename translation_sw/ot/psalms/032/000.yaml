  terminology: “Maskili” ni unukuzi unaofaa kwa istilahi yenye maana isiyo hakika, na tanbihi yake iko wazi. “Uasi,” “dhambi,” “kusamehewa,” na “kufunikwa” zinahifadhi tofauti za istilahi na taswira za Kiebrania bila kuweka tafsiri ya kimafundisho.
