  text: לְ/דָוִ֗ד מַ֫שְׂכִּ֥יל אַשְׁרֵ֥י נְֽשׂוּי פֶּ֗שַׁע כְּס֣וּי חֲטָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/000.yaml
  text: Of David[a]. A Maskil. Blessed is the one whose transgression is forgiven[b], whose sin is covered.
translation:
  language: sw
  text: 'Ya Daudi. Maskili[a].


    Heri mtu ambaye uasi wake umesamehewa[b],

    ambaye dhambi yake imefunikwa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania Maskili, kichwa cha zaburi ambacho maana yake kamili haijulikani; huenda ni utungo wa kufundisha au wa kutafakari.
    reason: cultural_note
  - marker: b
    text: Kwa halisi, “umeinuliwa” au “umeondolewa,” yaani, umesamehewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Maskili
  rationale: Neno hili la kichwa cha zaburi limenukuliwa kwa sauti kwa sababu maana yake kamili haijulikani; maelezo yametolewa katika tanbihi.
- source_word: אַשְׁרֵי
  choice: Heri mtu ambaye
  rationale: Huwasilisha tamko la hali yenye baraka au kustawi kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: נְשׂוּי פֶּשַׁע
  choice: uasi wake umesamehewa
  rationale: Kitenzi kwa halisi kina wazo la kuinuliwa au kuondolewa; katika muktadha huu ni nahau ya kusamehe, huku taswira ya asili ikihifadhiwa katika tanbihi.
- source_word: כְּסוּי חֲטָאָה
  choice: dhambi yake imefunikwa
  rationale: Tafsiri hii huhifadhi taswira ya Kiebrania ya dhambi kufunikwa bila kuibadili kuwa maelezo ya kimafundisho.
theological_decisions:
- issue: Uhusiano kati ya kusamehewa kwa uasi na kufunikwa kwa dhambi
  choice: Misemo yote miwili imehifadhiwa sambamba kama ilivyo katika Kiebrania.
  alternative: Kuitafsiri mistari yote miwili kwa neno moja, kama 'dhambi zake zimesamehewa.'
  rationale: Usambamba wa kishairi na taswira tofauti za maandishi ya chanzo zinapaswa kuhifadhiwa bila kuamua kwamba zina maana moja kabisa au kufafanua utaratibu wa msamaha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Mpangilio wa kishairi umehifadhiwa, na neno la kiufundi la kichwa cha zaburi limefafanuliwa katika tanbihi.
