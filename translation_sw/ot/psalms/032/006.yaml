base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/006.yaml
  text: Therefore let every godly one pray to you at a time when you may be found[a]; surely when the great floodwaters come[b], they will not reach him.
translation:
  language: sw
  text: Kwa hiyo, kila mcha Mungu akuombe wakati unapoweza kupatikana[a]; hakika, wakati maji mengi yanapofurika[b], hayatamfikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa sababu ya hili, kila mwaminifu akuombe maadamu unaweza kupatikana.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “katika mafuriko ya maji mengi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל זֹאת
  choice: Kwa hiyo
  rationale: Inaunganisha mstari huu na ungamo na msamaha uliotajwa kabla yake, huku ikitoa maana ya hitimisho kwa Kiswahili cha kawaida.
- source_word: יִתְפַּלֵּל
  choice: akuombe
  rationale: Kauli ya Kiebrania ina nguvu ya himizo; umbo hili linaonyesha wito wa kila mwaminifu kumwomba Mungu.
- source_word: כָּל חָסִיד
  choice: kila mwaminifu
  rationale: חָסִיד humaanisha mtu mwenye uaminifu na uchaji katika uhusiano wa agano; ‘mwaminifu’ ni ya asili na huepuka maana finyu ya kimadhehebu.
- source_word: אֵלֶיךָ
  choice: akuombe
  rationale: Kiambishi -ku- kinaonyesha wazi kwamba sala inaelekezwa kwa Mungu anayesemeshwa, bila kuongeza jina lisilokuwapo katika Kiebrania.
- source_word: לְעֵת מְצֹא
  choice: wakati unapoweza kupatikana
  rationale: Huhifadhi ufafanuzi wa kawaida wa infinitivu kwa maana ya kutendwa, yaani wakati Mungu anapoweza kupatikana, bila kuufanya usemi kuwa mahususi kuliko chanzo.
- source_word: רַק
  choice: hakika
  rationale: Hapa neno hilo lina nguvu ya kusisitiza uhakika, si maana ya kuweka mpaka ya ‘tu’.
- source_word: לְשֵׁטֶף מַיִם רַבִּים
  choice: wakati maji mengi yanapofurika
  rationale: Huwasilisha kwa Kiswahili cha asili picha ya maji mengi yenye kufunika na kushinda nguvu, huku tanbihi ikihifadhi muundo wa karibu zaidi na Kiebrania.
- source_word: אֵלָיו
  choice: -mfikia
  rationale: Kiambishi cha nafsi ya tatu umoja kinamrejelea mwaminifu anayesali, kama inavyofanya אֵלָיו.
- source_word: לֹא יַגִּיעוּ
  choice: hayatamfikia
  rationale: Huhifadhi maana ya maji kutomfikia au kutogusana naye bila kuongeza dai kwamba hayatakaribia hata kidogo.
theological_decisions:
- issue: Mhusika anayelindwa na maji yanayofurika
  choice: Kiambishi cha umoja kinamrejelea mwaminifu anayemwomba Mungu.
  alternative: Maji yanamfikia Mungu, au usemi unahusu ahadi ya kinga dhidi ya mafuriko halisi pekee.
  rationale: Sarufi ya אֵלָיו inaelekeza kwa mtu mwaminifu wa mwanzo wa mstari. Tafsiri inadumisha picha ya kishairi ya maji mengi bila kuitafsiri wazi kuwa hukumu, shida, au mafuriko halisi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Mwaminifu’ huhifadhi wazo la uaminifu na uchaji bila istilahi ya kimadhehebu; taswira ya maji mengi imeachwa wazi ili kuhifadhi mvutano wa kishairi na kiteolojia.
