base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/010.yaml
  text: Do not trust in oppression[a], and do not put vain hope in robbery; if wealth increases, do not set your heart on it.
translation:
  language: sw
  text: Msiutumainie uonevu, wala msitie tumaini la bure katika unyang’anyi[a]; mali ikiongezeka, msiweke mioyo yenu juu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msiwe wa batili katika unyang’anyi,” au “msijisifu kwa unyang’anyi.” Kitenzi cha Kiebrania ni kigumu na kinaweza kudokeza kutenda kwa ubatili au kutumainia kitu kisicho na maana.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּבְטְחוּ
  choice: msiutumainie
  rationale: Kitenzi בטח humaanisha kutumaini au kuweka tegemeo; ‘kutumainia’ ni Kiswahili cha kawaida kinachofaa kwa onyo hili.
- source_word: בְעֹשֶׁק
  choice: uonevu
  rationale: עֹשֶׁק huhusu kuwaonea na kuwanyonya wengine, wakati mwingine kwa kujipatia faida; ‘uonevu’ huhifadhi maana pana kuliko ‘utozaji wa nguvu’.
- source_word: בְגָזֵל
  choice: unyang’anyi
  rationale: גָזֵל ni kunyakua au kuchukua kwa nguvu; ‘unyang’anyi’ ni neno la moja kwa moja na linaendana na ‘uonevu’.
- source_word: תֶּהְבָּלוּ
  choice: msitumainie bure
  rationale: Kitenzi kinachotokana na הבל kinaweza kumaanisha kutenda kwa ubatili, kujisifu, au kuweka tumaini katika kilicho batili. ‘Msitumainie bure’ huonyesha tegemeo lisilo na msingi huku muktadha ukibaki wazi.
- source_word: חַיִל
  choice: mali
  rationale: Ingawa חַיִל pia inaweza kumaanisha nguvu au uwezo, pamoja na יָנוּב hapa inaelekea kumaanisha mali inayoongezeka.
- source_word: כִּי יָנוּב
  choice: ikiongezeka
  rationale: נוב kihalisi huhusu kuchipua au kustawi. Katika kauli kuhusu mali, ‘ikiongezeka’ ni ya asili na huhifadhi hali ya sharti.
- source_word: תָּשִׁיתוּ לֵב
  choice: msiiwekee moyo
  rationale: Nahau שׁית לב ni kuelekeza au kufungamanisha moyo na kitu; ‘kuwekea moyo’ huhifadhi taswira ya Kiebrania kwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Maana ya onyo katika kipashio cha kati
  choice: Onyo linakataza kutumainia unyang’anyi kwa tumaini batili, kisha linapanuka hata kwa mali inayoongezeka kwa ujumla.
  alternative: Kipashio kinaweza kutafsiriwa kwa ukaribu zaidi kuwa ‘msiwe batili katika unyang’anyi’ au ‘msijisifu kwa unyang’anyi.’
  rationale: Muundo wa vipashio vitatu unaunganisha uonevu, unyang’anyi, na mali inayoongezeka bila kudai kwamba mali yote imetokana na udhalimu. Tafsiri huhifadhi onyo la kimaadili na utata wa תֶּהְבָּלוּ.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Uwingi wa amri za kukataza umehifadhiwa. Hakuna tanbihi iliyowekwa kwa sababu utata wa תֶּהְבָּלוּ umeelezwa katika maamuzi ya tafsiri lakini toleo kuu ‘msitumainie bure’ linaeleweka bila alama ya lazima.
