  text: אַ֣ךְ אֶל אֱ֭לֹהִים דּֽוּמִיָּ֣ה נַפְשִׁ֑/י מִ֝מֶּ֗/נּוּ יְשׁוּעָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/001.yaml
  text: Only for God is my soul silent[b][a]; from him comes my salvation.
translation:
  language: sw
  text: Ni kwa Mungu tu nafsi yangu hukaa kimya[a]; wokovu wangu hutoka kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ni Mungu tu ambaye nafsi yangu humngojea kwa ukimya,” au “Ni katika Mungu tu nafsi yangu hupumzika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: tu
  rationale: Kihusishi hiki kinaonyesha ukomo au mkazo; “tu” kinahifadhi mwelekeo wa kipekee kwa Mungu kwa ufupi wa kishairi.
- source_word: אֶל
  choice: kwa
  rationale: Katika muundo huu kinaonyesha kwamba ukimya wa nafsi umeelekezwa kwa Mungu. “Kwa Mungu” ni Kiswahili cha kawaida na kinaweza pia kubeba wazo la kumngojea.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu wa umoja, neno hilo linamtaja Mungu wa Israeli.
- source_word: דּוּמִיָּה
  choice: hukaa kimya
  rationale: Nomino hiyo humaanisha ukimya, utulivu, au hali ya kutulia. “Hukaa kimya” inadumisha taswira ya msingi bila kulazimisha maana ya kungoja au kupumzika.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: Neno linaweza kumaanisha nafsi, uhai, au mtu mwenyewe; “nafsi yangu” linafaa kwa lugha ya kishairi ya tumaini la ndani.
- source_word: מִמֶּנּוּ
  choice: hutoka kwake
  rationale: 'Kihusishi kinaonyesha chanzo: wokovu unatoka kwa Mungu.'
- source_word: יְשׁוּעָתִי
  choice: wokovu wangu
  rationale: Neno linaweza kumaanisha wokovu au ukombozi; “wokovu wangu” linaendana na sajili ya Zaburi bila kuondoa wazo la kuokolewa katika hali halisi.
theological_decisions:
- issue: Maana ya kishazi דּוּמִיָּה נַפְשִׁי
  choice: Kauli ya nafsi kukaa kimya kwa Mungu kwa tumaini
  alternative: Nafsi yangu humngojea Mungu kwa ukimya; au nafsi yangu hupumzika katika Mungu
  rationale: Kiebrania kinaweza kuonyesha ukimya, utulivu, au kungoja kwa utulivu. Tafsiri kuu inadumisha taswira ya ukimya, huku tanbihi ikihifadhi uwezekano wa kungoja au kupumzika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio “Ni kwa Mungu tu” unahifadhi mkazo wa mwanzo wa Kiebrania; “hukaa kimya” ni wa asili zaidi kuliko “iko kimya” katika muktadha huu.
