base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/002.yaml
  text: He alone is my rock and my salvation[a], my stronghold; I will not be greatly shaken.
translation:
  language: sw
  text: Yeye peke yake ndiye mwamba wangu na wokovu wangu, ngome yangu; sitatikisika sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sitatikisika.” Kiebrania kina kielezi kinachomaanisha “sana” au “kwa kiasi kikubwa”; kwa hiyo, kauli hii si ya absoluti kama ile inayofanana katika Zaburi 62:6.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: peke yake
  rationale: 'Katika muktadha huu neno hilo linasisitiza upekee: Mungu ndiye chanzo pekee cha usalama. “Peke yake” ni usemi wa kawaida na wazi katika Kiswahili.'
- source_word: הוּא
  choice: Yeye ndiye
  rationale: Kiwakilishi hiki kinamrejelea Mungu; muundo “Yeye ... ndiye” unaonyesha mkazo uliopo katika Kiebrania na unasikika kwa kawaida katika Kiswahili.
- source_word: צוּרִי
  choice: mwamba wangu
  rationale: Neno hili humaanisha mwamba au jabali na hapa ni sitiari ya uthabiti na ulinzi. “Mwamba wangu” huhifadhi picha hiyo kwa lugha inayoeleweka.
- source_word: וִישׁוּעָתִי
  choice: wokovu wangu
  rationale: Neno linaweza kumaanisha wokovu au ukombozi. “Wokovu wangu” huhifadhi upana wa maana yake, ikiwemo kuokolewa katika hatari.
- source_word: מִשְׂגַּבִּי
  choice: ngome yangu
  rationale: Neno hili huonyesha mahali pa juu na salama pa kujilinda. “Ngome yangu” huhifadhi picha ya ulinzi imara bila kufanya sentensi kuwa nzito.
- source_word: לֹא אֶמּוֹט
  choice: sitatikisika
  rationale: Kitenzi kinaeleza kuyumba, kuteleza, au kutikiswa. “Sitatikisika” ni Kiswahili cha sasa na huhifadhi sitiari ya kutokuwa thabiti.
- source_word: רַבָּה
  choice: sana
  rationale: Kivumishi hiki kimetumiwa kama kielezi cha kiwango. “Sana” huonyesha kwamba kauli si ya kutotikiswa kabisa, bali ya kutotikiswa kwa kiasi kikubwa.
theological_decisions:
- issue: Kiwango cha usalama kinachoelezwa katika kishazi cha mwisho
  choice: sitatikisika sana
  alternative: sitatikisika
  rationale: Kiebrania kina neno רַבָּה linaloonyesha kiwango. Kulitafsiri huhifadhi tofauti halisi na kauli nyingine inayofanana katika zaburi hii, badala ya kuzifanya zifanane kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kishairi; sitiari za “mwamba” na “ngome” zimehifadhiwa. Alama ya tanbihi imewekwa baada ya kishazi inachokifafanua.
