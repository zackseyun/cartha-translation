  yaml_path: translation/ot/psalms/062/000.yaml
  text: 'For the choir director: according to Jeduthun[a]. A psalm of David[b].'
translation:
  language: sw
  text: 'Kwa kiongozi wa waimbaji: kulingana na Yeduthuni[a]. Zaburi ya Daudi[b].


    [a] Au huenda, “juu ya Yeduthuni” au “kwa ajili ya Yeduthuni.” Maneno hayo yanaweza kutaja mtindo wa muziki, mahadhi, au maelekezo ya uimbaji yanayohusiana na Yeduthuni.

    [b] Kichwa “ya Daudi” kinaweza kuonyesha kwamba Daudi ndiye aliyeitunga, kwamba iliwekwa wakfu kwake, au kwamba inahusiana naye.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “juu ya Yeduthuni” au “kwa ajili ya Yeduthuni.” Maneno hayo yanaweza kutaja mtindo wa muziki, mahadhi, au maelekezo ya uimbaji yanayohusiana na Yeduthuni.
    reason: alternative_reading
  - marker: b
    text: Kichwa “ya Daudi” kinaweza kuonyesha kwamba Daudi ndiye aliyeitunga, kwamba iliwekwa wakfu kwake, au kwamba inahusiana naye.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa kiongozi wa waimbaji
  rationale: Katika vichwa vya zaburi, neno hili kwa kawaida humtaja msimamizi wa utendaji wa muziki. Tafsiri hii ni ya sasa, inaeleweka, na inafaa mazingira ya ibada.
- source_word: עַל
  choice: kulingana na
  rationale: Katika kichwa hiki, kihusishi hiki kinaweza kuelekeza kwenye mahadhi, mtindo, au maelekezo ya utendaji. “Kulingana na” huhifadhi kutokuwa dhahiri kuliko tafsiri yenye maana mahususi zaidi.
- source_word: יְדוּתוּן
  choice: Yeduthuni
  rationale: Ni jina la mtu, hivyo limetoholewa kwa kufuata mfumo wa sauti wa Kiswahili. Linaweza kumrejelea mwanamuziki Mlawi Yeduthuni au mahadhi/mtindo uliohusishwa naye.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa aina hii ya utenzi wa kidini na wa muziki katika vichwa vya Zaburi.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kihusishi לְ kina maana pana katika vichwa vya zaburi na kinaweza kuonyesha utunzi, umilikaji, kuwekwa wakfu, au uhusiano. “Ya Daudi” hudumisha upana huo bila kulazimisha maana ya “iliyoandikwa na Daudi.”
theological_decisions:
- issue: Maana ya לְדָוִד katika kichwa cha zaburi
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi; kwa ajili ya Daudi
  rationale: Muundo wa Kiebrania haulazimishi uchaguzi kati ya Daudi kuwa mtunzi na uhusiano mpana zaidi na Daudi. “Ya Daudi” huhifadhi utata halisi wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kiongozi wa waimbaji” ni wazi kwa msomaji wa kawaida; “kulingana na” pamoja na tanbihi huhifadhi utata wa maelekezo ya kimuziki; majina yametoholewa kwa mtindo wa kawaida wa Kiswahili.
