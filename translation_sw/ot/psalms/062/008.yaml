  yaml_path: translation/ot/psalms/062/008.yaml
  text: Trust in him at all times[a], O people; pour out your hearts before him. God is a refuge for us[d][c][b]. Selah
translation:
  language: sw
  text: Mtumainini nyakati zote,[a] enyi watu; mimineni mioyo yenu mbele yake.[b] Mungu ni kimbilio letu. Sela.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila wakati” au “daima”; kihalisi, “katika kila wakati.”
    reason: lexical_alternative
  - marker: b
    text: “Kumimina mioyo yenu” ni tamathali ya Kiebrania inayomaanisha kumweleza Mungu kwa uwazi mawazo, hisia, na matamanio ya ndani.
    reason: lexical_alternative
  - marker: c
    text: “Sela” huenda ni neno la liturujia au muziki; maana yake kamili haijulikani.
    reason: cultural_note
lexical_decisions:
- source_word: בִּטְחוּ בּוֹ
  choice: Mtumainini yeye
  rationale: Kitenzi בטח katika kauli ya amri ya wingi humaanisha kuweka tumaini au kuwa na uhakika katika mtu. “Mtumainini yeye” ni Kiswahili cha kawaida na huhifadhi mwito wa moja kwa moja kwa jumuiya.
- source_word: בְכָל עֵת
  choice: nyakati zote
  rationale: Kirai hiki, kihalisi “kila wakati,” humaanisha daima au katika kila hali; “nyakati zote” ni cha asili katika Kiswahili na huhifadhi wingi wa mazingira unaodokezwa.
- source_word: עָם
  choice: enyi watu
  rationale: Nomino hii inatumika kama mwito wa moja kwa moja kwa jumuiya. “Enyi watu” huonyesha wazi hali hiyo bila kuibana kuwa taifa fulani.
- source_word: שִׁפְכוּ ... לְבַבְכֶם
  choice: mimimineni mioyo yenu
  rationale: Taswira ya Kiebrania ni ya kumimina yaliyomo moyoni. Wingi “mioyo yenu” unaakisi kiambishi cha nafsi ya pili wingi na mwito kwa jumuiya.
- source_word: לְפָנָיו
  choice: mbele zake
  rationale: Huhifadhi maana ya kuwa mbele ya uso au katika uwepo wake, kwa usemi mfupi na wa kawaida wa Kiswahili.
- source_word: אֱלֹהִים מַחֲסֶה לָנוּ
  choice: Mungu ni kimbilio letu
  rationale: מַחֲסֶה ni mahali pa usalama au ulinzi. “Kimbilio letu” ni usemi wa asili unaowasilisha dative לָנוּ kama uhusiano wa jumuiya na Mungu.
- source_word: סֶלָה
  choice: Sela
  rationale: Neno limeandikwa kwa unukuzi kwa sababu maana yake ya kiibada au kimuziki haijulikani kwa uhakika.
theological_decisions:
- issue: Mwito wa kijumuiya katika עָם
  choice: “enyi watu” kama mwito wa moja kwa moja kwa jumuiya
  alternative: “watu” bila kuonyesha wazi mwito, au “taifa”
  rationale: Mahali pa nomino baada ya amri huonyesha kwa kawaida kwamba ni mwito. Tafsiri hii huhifadhi upande wa kijumuiya bila kuingiza maana finyu ya kisiasa au kikabila.
- issue: Maana ya fumbo la “kumimina moyo”
  choice: Kuhifadhi taswira kama “mimimineni mioyo yenu” na kuifafanua katika tanbihi
  alternative: Kuitafsiri moja kwa moja kama “mwelezeni Mungu mawazo na matamanio yenu yote”
  rationale: Taswira ya chanzo inaeleweka katika Kiswahili na ina uzito wa kishairi; tanbihi huzuia kutoeleweka bila kuondoa sitiari.
- issue: Tafsiri ya סֶלָה
  choice: Kulihifadhi kama “Sela”
  alternative: “pumziko la kimuziki” au “kipindi cha kati”
  rationale: Maana sahihi ya neno hilo haijulikani. Unukuzi huhifadhi hali hiyo ya kutokuwa na uhakika na kuepuka kulazimisha fasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Amri za wingi “Mtumainini” na “mimimineni” pamoja na “mioyo yenu” zinahifadhi mwito kwa jumuiya. “Sela” limehifadhiwa kwa unukuzi ili kutodai uhakika usiopo.
