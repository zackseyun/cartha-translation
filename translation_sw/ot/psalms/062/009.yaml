  text: אַ֤ךְ הֶ֥בֶל בְּנֵֽי אָדָם֮ כָּזָ֪ב בְּנֵ֫י אִ֥ישׁ בְּ/מֹאזְנַ֥יִם לַ/עֲל֑וֹת הֵ֝֗מָּה מֵ/הֶ֥בֶל יָֽחַד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/009.yaml
  text: Surely the sons of man are a breath; the sons of men are a lie[a]. In the balances they go up; together they are lighter than a breath.
translation:
  language: sw
  text: 'Hakika, wanadamu ni pumzi tu;

    watu ni uongo[a].


    Katika mizani hupaa;

    wote kwa pamoja ni wepesi kuliko pumzi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, Kiebrania kina “wana wa adam” na “wana wa ish”—istilahi mbili tofauti za mtu/mwanadamu. Jozi hii pia inaweza kufasiriwa kuwa “watu wa hali ya chini” na “watu wa hali ya juu.”
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Hakika
  rationale: Neno hili linasisitiza uthibitisho wa kauli. “Hakika” ni la asili na lenye hadhi katika Kiswahili cha sasa.
- source_word: הֶבֶל
  choice: pumzi
  rationale: Neno hili huonyesha kitu cha muda mfupi, kisicho na uzito au kisicho na msingi. “Pumzi” huhifadhi taswira halisi na pia huunganisha mistari miwili ya aya.
- source_word: בְּנֵי אָדָם
  choice: wanadamu
  rationale: Kirai hiki kihalisi ni “wana wa adam/mwanadamu.” “Wanadamu” ni Kiswahili cha kawaida kinachohifadhi maana ya jumla bila kuingiza moja kwa moja tafsiri ya tabaka la chini.
- source_word: כָּזָב
  choice: uongo
  rationale: Nomino hii humaanisha uongo, udanganyifu au kutotegemeka. “Uongo” huhifadhi kauli fupi na kali ya Kiebrania.
- source_word: בְּנֵי אִישׁ
  choice: binadamu
  rationale: Kirai hiki kihalisi ni “wana wa ish/mwanamume.” “Binadamu” huunda usambamba na “wanadamu” huku tanbihi ikihifadhi tofauti ya maneno ya Kiebrania na uwezekano wa maana ya kijamii.
- source_word: בְּמֹאזְנַיִם
  choice: Kwenye mizani
  rationale: Nomino ya Kiebrania inarejelea mizani ya kupimia uzito. “Kwenye mizani” ni usemi wa kawaida na huweka wazi mahali pa taswira hiyo.
- source_word: לַעֲלוֹת
  choice: wao hupaa
  rationale: Kitenzi kinamaanisha kupanda au kwenda juu. Katika taswira ya mizani, kupaa huonyesha kuwa hawana uzito; tafsiri hii haibadilishi kitenzi kuwa “kupimwa.”
- source_word: מֵהֶבֶל
  choice: wepesi kuliko pumzi
  rationale: Katika muktadha huu kiambishi kina maana ya ulinganisho. “Wepesi kuliko pumzi” huifanya taswira ya mizani ieleweke huku ikihifadhi picha ya pumzi.
- source_word: יָחַד
  choice: wote pamoja
  rationale: Neno hili linaonyesha ujumla wa kundi. “Wote pamoja” hueleza kwamba hukumu hiyo inawahusu kwa pamoja.
theological_decisions:
- issue: Ufasiri wa jozi בְּנֵי אָדָם / בְּנֵי אִישׁ
  choice: Kutumia maneno yanayolingana, “wanadamu” na “binadamu,” bila kuyatafsiri moja kwa moja kuwa matabaka mawili ya kijamii.
  alternative: “Watu wa hali ya chini” na “watu wa hali ya juu.”
  rationale: Maneno ya Kiebrania yanatumia istilahi mbili tofauti kwa mwanadamu, na huenda yakadokeza watu wa vyeo vya chini na vya juu. Kwa kuwa tofauti ya kitabaka si wazi moja kwa moja katika maneno yenyewe, matini kuu haifungi maana hiyo; tanbihi huihifadhi kama uwezekano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi, wa sasa na wenye hadhi. Mpangilio wa mistari umehifadhi usambamba na taswira ya mizani; msamiati wa kawaida umetumiwa bila kufifisha ukali wa kauli ya Kiebrania.
