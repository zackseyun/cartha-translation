  yaml_path: translation/ot/psalms/062/007.yaml
  text: On God rest my salvation and my glory[a]; the rock of my strength, my refuge[b], is in God.
translation:
  language: sw
  text: Wokovu wangu na heshima yangu[a] humtegemea Mungu; yeye ni mwamba wa nguvu zangu, na kimbilio langu limo kwa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utukufu wangu.” Kiebrania kinaweza kumaanisha heshima, hadhi, au utukufu wa mtunga zaburi.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: humtegemea
  rationale: Katika kishazi kisicho na kitenzi, עַל huonyesha kwamba wokovu na heshima ya mtunga zaburi vina msingi na tegemeo lake kwa Mungu. Kiswahili cha kawaida huhitaji kitenzi ili kueleza utegemezi huo kwa uwazi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa Mungu wa Israeli katika muktadha huu.
- source_word: יִשְׁעִי
  choice: wokovu wangu
  rationale: Neno linamaanisha kuokolewa au ukombozi; “wokovu wangu” huhifadhi upana wa maana ya kimwili na ya kitheolojia.
- source_word: וּכְבוֹדִי
  choice: na heshima yangu
  rationale: כָּבוֹד hapa inaweza kumaanisha utukufu, heshima, hadhi, au kuthibitishwa kuwa mwenye haki. “Heshima yangu” ni ya asili zaidi kwa mtu anayesema kuhusu hadhi yake, bila kuondoa maana ya “utukufu wangu.”
- source_word: צוּר
  choice: mwamba
  rationale: Huhifadhi sitiari ya uthabiti na ulinzi.
- source_word: עֻזִּי
  choice: nguvu zangu
  rationale: Ni tafsiri ya moja kwa moja ya עֹז, bila kuingiza picha mahususi zaidi ya ngome.
- source_word: מַחְסִי
  choice: kimbilio langu
  rationale: Hueleza mahali pa kukimbilia ili kupata usalama na ulinzi, kwa lugha ya kawaida ya zaburi.
- source_word: בֵּאלֹהִים
  choice: limo kwa Mungu
  rationale: Kiambishi בְּ huonyesha mahali au msingi ambamo kimbilio linapatikana. “Limo kwa Mungu” huhifadhi usemi huo bila kulazimisha kwamba Mungu ndiye kimbilio moja kwa moja, ingawa maana hiyo inadokezwa.
theological_decisions:
- issue: Uhusiano wa kishazi cha mwanzo chenye עַל na vishazi visivyo na kitenzi
  choice: Kutafsiri kama ungamo kwamba wokovu na heshima ya mtunga zaburi humtegemea Mungu.
  alternative: “Juu ya Mungu ndipo ulipo wokovu wangu na utukufu wangu.”
  rationale: Kiebrania hakina kitenzi hapa. “Humtegemea Mungu” huwasilisha kwa Kiswahili cha asili wazo la msingi au tegemeo bila kuamua zaidi ya maandishi.
- issue: Maana ya וּכְבוֹדִי
  choice: “heshima yangu” katika matini, huku “utukufu wangu” ukihifadhiwa katika tanbihi.
  alternative: “utukufu wangu”
  rationale: Neno linaweza kumaanisha utukufu au heshima/hadhi. Matini ya Kiswahili hutumia maana ya kawaida zaidi kwa heshima ya mtu, lakini tanbihi huhifadhi utata wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa vishazi vifupi na sitiari ya “mwamba” umehifadhiwa. Alama ya tanbihi [a] imewekwa baada ya mstari mzima kwa kuwa inafafanua neno lililo ndani ya mstari.
