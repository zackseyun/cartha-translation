review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly retains the direct address, divine loyal love, and universal principle of recompense. However, “kuna upendo thabiti” most naturally means that steadfast love exists/is found with the Lord, whereas the Hebrew fronted prepositional phrase in this clause is best represented here as possession or attribution: steadfast love is the Lord’s. The imperfect תְשַׁלֵּם is better represented by a future form, “utamlipa,” than by the habitual “humlipa.”'
  naturalness: “Upendo wa kudumu” is more idiomatic Standard East African Swahili than the somewhat calqued “upendo thabiti.” The possessive inversion “Na upendo wa kudumu ni wako, Ee Bwana” is clear, dignified, and suitable for biblical poetry.
  terminology: “Ee Bwana” appropriately renders the divine address אֲדֹנָי. “Upendo wa kudumu” conveys חסד without reducing it to mercy alone. “Kila mtu” naturally expresses the representative generic אִישׁ in Swahili, and “tendo lake” preserves the singular correspondence of the Hebrew.
  issues:
  - severity: medium
    issue: “Kuna upendo thabiti” does not clearly express possession.
    rationale: In ordinary Swahili, this construction says that love exists with/at the Lord. The Hebrew clause and English audit trail foreground that steadfast love belongs to the Lord; “upendo wa kudumu ni wako” expresses this directly.
  - severity: low
    issue: “Humlipa” changes the verbal force to habitual present.
    rationale: 'The Hebrew imperfect is suitably rendered in this context as a future assurance: “utamlipa.”'
  - severity: low
    issue: “Upendo thabiti” is less natural collocation than “upendo wa kudumu.”
    rationale: The revised phrase is idiomatic, modern, and retains the enduring/steadfast dimension of חסד.
  revised_text: Na upendo wa kudumu[a] ni wako, Ee Bwana, kwa maana utamlipa kila mtu kulingana na tendo lake.
