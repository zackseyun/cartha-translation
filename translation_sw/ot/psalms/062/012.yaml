  text: וּ/לְ/ךָֽ אֲדֹנָ֥/י חָ֑סֶד כִּֽי אַתָּ֨ה תְשַׁלֵּ֖ם לְ/אִ֣ישׁ כְּֽ/מַעֲשֵֽׂ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/012.yaml
  text: And to you[a], O Lord, belongs steadfast love[b], for you repay each man according to his work.
translation:
  language: sw
  text: Na upendo wa kudumu[a] ni wako, Ee Bwana, kwa maana utamlipa kila mtu kulingana na tendo lake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na kwako wewe, Ee Bwana, kuna upendo wa kudumu.” Kiebrania hakina kitenzi katika kishazi hiki, na kirai “kwako wewe” kimetangulizwa ili kukazia kwamba upendo wa kudumu ni wa Bwana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְךָ
  choice: Na kwako wewe ... kuna
  rationale: Kirai cha Kiebrania kilichotangulizwa kinaonyesha umilikaji au sifa inayomhusu Mungu na kinakazia ‘kwako wewe.’ Kiswahili huhitaji kitenzi katika sentensi hii, hivyo ‘kuna’ huwasilisha maana ya kishazi kisicho na kitenzi bila kuondoa mkazo.
- source_word: אֲדֹנָי
  choice: Ee Bwana
  rationale: Hili ni jina la cheo la Mungu, Adonai. ‘Ee Bwana’ ni namna ya kawaida, yenye heshima, ya kumwita Mungu moja kwa moja katika sala na ushairi.
- source_word: חָסֶד
  choice: upendo thabiti
  rationale: Neno hili linajumuisha upendo, fadhili, uaminifu na mshikamano wa agano. ‘Upendo thabiti’ ni kifupi, cha sasa, na huhifadhi upendo pamoja na kudumu kwake.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa neno hili linaanzisha msingi au maelezo ya kauli iliyotangulia.
- source_word: תְשַׁלֵּם
  choice: humlipa
  rationale: Kitenzi kina maana ya kumpa mtu kinachomstahili, kiwe chema au kibaya. ‘Humlipa’ hakifungi maana katika thawabu chanya pekee.
- source_word: לְאִישׁ
  choice: kila mtu
  rationale: Ingawa אִישׁ ni nomino ya umoja yenye umbo la kiume, hapa imetumiwa kwa maana wakilishi na ya mgawanyo. ‘Kila mtu’ ni Kiswahili cha kawaida kinachoonyesha wazi kwamba kanuni hiyo inamhusu kila mmoja bila kupotosha maana.
- source_word: כְּמַעֲשֵׂהוּ
  choice: kulingana na tendo lake
  rationale: Kirai hiki kinaonyesha kwamba malipo yanalingana na alichotenda mtu. Umoja wa ‘tendo lake’ unafuata kwa karibu umbo la Kiebrania na unabaki wa asili katika Kiswahili.
theological_decisions:
- issue: Uhusiano kati ya upendo thabiti wa Mungu na malipo yake ya haki
  choice: Kuhifadhi pamoja upendo thabiti wa Mungu na ukweli kwamba humlipa kila mtu kulingana na tendo lake.
  alternative: Kutafsiri חָסֶד kuwa rehema pekee, au תְשַׁלֵּם kuwa kutoa thawabu chanya pekee.
  rationale: Mstari wenyewe unaweka pamoja upendo mwaminifu wa Mungu na hukumu yake ya haki. Tafsiri haipaswi kuondoa mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. ‘Kwako wewe’ huhifadhi mkazo wa mpangilio wa Kiebrania; ‘kila mtu’ hutumiwa katika maana yake ya kawaida ya kila mmoja.
