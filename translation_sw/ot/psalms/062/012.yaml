revisions:
- from: Na kwako wewe, Ee Bwana, kuna upendo thabiti[a], kwa maana wewe humlipa kila mtu kulingana na tendo lake.
  to: Na upendo wa kudumu[a] ni wako, Ee Bwana, kwa maana utamlipa kila mtu kulingana na tendo lake.
  rationale: The revision makes the possessive force of the Hebrew clause explicit in natural poetic Swahili, improves the rendering of חסד, and reflects the imperfect verb as future recompense. It preserves the verse’s tension between the Lord’s enduring love and his just repayment according to each person’s deed.
