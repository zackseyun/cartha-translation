  yaml_path: translation/ot/psalms/062/003.yaml
  text: How long will you assail a man? Will you all break him down[a], like a leaning wall[c][b], a tottering fence?
translation:
  language: sw
  text: Hadi lini mtamshambulia mtu? Je, ninyi nyote mtamwangusha[a], kama ukuta ulioinama, uzio uliosukumwa kuelekea kuanguka?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtamuua.” Kitenzi cha Kiebrania kwa kawaida humaanisha kuua, hasa kuua kwa dhuluma; hapa kinaweza kutumiwa kwa njia ya sitiari kwa sababu ya picha inayofuata ya ukuta na uzio unaoanguka.
    reason: lexical_alternative
  - marker: b
    text: Huenda picha hii inamfafanua mtu anayeshambuliwa kuwa dhaifu na karibu kuanguka. Wengine huona kwamba inawafafanua washambuliaji wakimsonga, kama ukuta unaoinama kuelekea kwake.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּהֽוֹתְת֣וּ
  choice: mtamshambulia
  rationale: Kitenzi hiki adimu kinaonyesha shambulio la nguvu dhidi ya mtu. “Mtamshambulia” ni Kiswahili cha kawaida kinachohifadhi uhasama bila kubainisha mno namna ya shambulio.
- source_word: עַל אִישׁ
  choice: mtu
  rationale: אִישׁ hapa humaanisha mtu mmoja anayelengwa. Katika Kiswahili, “mtu” ni ya asili na haifuti umoja wa mlengwa.
- source_word: תְּרָצְּחוּ
  choice: mtamwangusha
  rationale: Ingawa רצח kwa kawaida huhusu kuua au kuua kwa dhuluma, muktadha unaunganisha kitendo hiki na picha ya ukuta na uzio unaokaribia kuanguka. “Mtamwangusha” huhifadhi wazo la kumfikisha mlengwa kwenye kuanguka bila kuficha maana ya moja kwa moja, ambayo imewekwa katika tanbihi.
- source_word: כֻלְּכֶם
  choice: ninyi nyote
  rationale: Kauli hii inadhihirisha msisitizo wa wingi na ushiriki wa kundi lote.
- source_word: כְּקִיר נָטוּי
  choice: kama ukuta ulioinama
  rationale: Tafsiri hii inahifadhi taswira halisi ya jengo lisilo imara na lililo karibu kuanguka.
- source_word: גָּדֵר הַדְּחוּיָה
  choice: kama uzio unaokaribia kuanguka
  rationale: Neno דחה linaweza kuonyesha kitu kilichosukumwa au kuondolewa mahali pake. Kauli hii inawasilisha kwa Kiswahili cha kawaida hali ya uzio usio imara, huku tanbihi ikihifadhi uwezekano wa maana halisi zaidi.
theological_decisions:
- issue: Kitu kinachofananishwa na ukuta na uzio
  choice: Mtu anayeshambuliwa ndiye anayelinganishwa na ukuta ulioinama na uzio unaokaribia kuanguka.
  alternative: Washambuliaji wanaweza kufananishwa na ukuta unaoinama au kujitokeza dhidi ya mtu huyo.
  rationale: Mpangilio na mfululizo wa taswira unaunga mkono kwa urahisi zaidi mlengwa aliye dhaifu na karibu kuanguka, lakini muundo wa Kiebrania unaacha kiasi fulani cha utata; kwa hiyo uwezekano mwingine umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Uzio” umetumiwa badala ya “ua” ili kuepuka utata na maua; maswali mawili yanahifadhi msukumo wa lawama katika mstari wa Kiebrania.
