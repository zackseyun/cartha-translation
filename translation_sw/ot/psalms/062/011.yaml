  text: אַחַ֤ת דִּבֶּ֬ר אֱלֹהִ֗ים שְׁתַּֽיִם ז֥וּ שָׁמָ֑עְתִּי כִּ֥י עֹ֝֗ז לֵ/אלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/011.yaml
  text: 'One thing God has spoken[a]; two things I have heard: that strength belongs to God.'
translation:
  language: sw
  text: 'Jambo moja Mungu amesema[a]; mambo mawili nimeyasikia: kwamba nguvu ni za Mungu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mara moja Mungu amesema; mara mbili nimesikia hili.” Nahau ya Kiebrania inaweza kueleweka kwa maana ya mara (“mara moja/mara mbili”) au kama mtindo wa usemi wa kihesabu (“jambo moja/mambo mawili”).
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַת
  choice: Jambo moja
  rationale: Namba ya umoja ‘moja’ inaeleweka hapa kama mwanzo wa mtindo wa usemi wa kihesabu ‘jambo moja ... mambo mawili’; kuongeza ‘jambo’ kunafanya Kiswahili kiwe cha kawaida.
- source_word: דִּבֶּר
  choice: amesema
  rationale: Wakati timilifu wa Kiswahili unaonyesha kauli iliyotolewa na ambayo bado ina umuhimu; ‘amesema’ ni ya kawaida na yenye hadhi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania ni la wingi, hapa maana na sarufi ni ya umoja, ikimtaja Mungu.
- source_word: שְׁתַּיִם זוּ
  choice: mambo mawili
  rationale: Katika muundo huu wa kihesabu, ‘mawili’ huhitaji nomino inayopatana nayo; ‘mambo’ huwasilisha yaliyosikiwa bila kulazimisha tafsiri ya kiwakati.
- source_word: שָׁמָעְתִּי
  choice: nimeyasikia
  rationale: Wakati timilifu unaafikiana na ‘amesema’ na kuonyesha yale ambayo mtunga zaburi amesikia na ambayo yanaendelea kuwa na uzito.
- source_word: כִּי
  choice: kwamba
  rationale: Kiunganishi hiki kinatambulisha maudhui ya yale yaliyosikiwa.
- source_word: עֹז
  choice: nguvu
  rationale: ‘Nguvu’ ni neno la kawaida la Kiswahili kwa uwezo au uweza, na linafaa katika muktadha huu.
- source_word: לֵאלֹהִים
  choice: ni za Mungu
  rationale: Kihusishi ל hapa huonyesha umilikaji au sifa; ‘ni za Mungu’ ni Kiswahili cha asili kinachohifadhi maana hiyo.
theological_decisions:
- issue: Nahau ya usemi wa kihesabu ‘moja ... mawili’
  choice: Jambo moja Mungu amesema; mambo mawili nimeyasikia
  alternative: Mara moja Mungu amesema; mara mbili nimesikia hili
  rationale: Kiebrania kinaweza kueleweka kama hesabu ya mambo au kama vielezi vya mara. Matini kuu inatumia usemi wa kihesabu kwa sababu unaendana vizuri na muundo wa sentensi, huku tanbihi ikihifadhi usomaji mwingine wa kweli bila kuufuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa kwa ufupi, na utata halisi wa nahau ya Kiebrania umewekwa katika tanbihi.
