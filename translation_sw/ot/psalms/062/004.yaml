source:
  edition: WLC
  text: אַ֤ךְ מִ/שְּׂאֵת֨/וֹ יָעֲצ֣וּ לְ/הַדִּיחַ֮ יִרְצ֪וּ כָ֫זָ֥ב בְּ/פִ֥י/ו יְבָרֵ֑כוּ וּ֝/בְ/קִרְבָּ֗/ם יְקַלְלוּ סֶֽלָה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/004.yaml
  text: They only plan to cast him down from his high position[a]; they delight in falsehood. With their mouth they bless, but inwardly they curse[b]. Selah
translation:
  language: sw
  text: Wanapanga tu kumwangusha kutoka cheo chake cha juu[a]; wanafurahia uongo. Kwa vinywa vyao wanabariki, lakini ndani yao wanalaani[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka katika heshima yake,” “kutoka katika kuinuliwa kwake,” au “kutoka katika ukuu wake.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kihalisi, “kwa kinywa chake wanabariki”; huenda maana yake ni ya pamoja: kwa nje wanabariki, lakini ndani yao wanalaani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: tu
  rationale: Kihusishi hiki kinaweka mpaka kwenye kusudi la maadui; “tu” huonyesha kwamba hilo ndilo lengo lao pekee.
- source_word: מִשְּׂאֵתוֹ
  choice: kutoka cheo chake cha juu
  rationale: שְׂאֵת inaweza kumaanisha kuinuliwa, ukuu, au heshima. Katika muktadha wa kumwangusha mtu, “cheo chake cha juu” huwasilisha hadhi na wazo la kuinuliwa bila kubainisha kupita kiasi.
- source_word: יָעֲצוּ
  choice: wanapanga
  rationale: Kitenzi hiki hueleza kushauriana au kupanga kwa makusudi; muktadha unaonyesha kwamba mpango huo ni wa uadui.
- source_word: לְהַדִּיחַ
  choice: kumwangusha
  rationale: Hifili ya נדח ina maana ya kusababisha mtu aondolewe au aangushwe; hapa inaendana na kumtoa katika hali yake iliyoinuliwa.
- source_word: יִרְצוּ כָזָב
  choice: wanafurahia uongo
  rationale: רצה pamoja na כזב hueleza kupendezwa na udanganyifu au kuukubali kwa furaha. “Uongo” ni usemi wa kawaida na mpana katika Kiswahili.
- source_word: בְּפִיו יְבָרֵכוּ
  choice: Kwa vinywa vyao wanabariki
  rationale: Kiebrania kwa umbo halisi kina “kwa kinywa chake,” lakini ulinganifu na nusu ya pili unaunga mkono maana ya pamoja inayowarejelea maadui. Wingi wa Kiswahili unaifanya maana hiyo iwe wazi.
- source_word: וּבְקִרְבָּם
  choice: ndani yao
  rationale: Kirai hiki kihalisi hurejelea sehemu yao ya ndani; hapa kinaonyesha nia yao ya ndani, kinyume na maneno ya nje.
- source_word: יְקַלְלוּ
  choice: wanalaani
  rationale: Kitenzi hiki humaanisha kulaani na kinadumisha ukinzani wa moja kwa moja na “wanabariki.”
- source_word: סֶלָה
  choice: Sela
  rationale: Neno hili la kiliturujia au kimuziki lina maana isiyo na uhakika; limetoholewa badala ya kupewa fasiri ya kubahatisha.
theological_decisions:
- issue: Mrejelewa wa kiambishi cha umoja katika “kutoka cheo chake cha juu” na mtendwa wa “kumwangusha”
  choice: Mstari unawaeleza wapinzani wanaotaka kumwangusha mtu mmoja—mtunga zaburi au mwenye haki—kutoka katika hadhi yake iliyoinuliwa.
  alternative: Inawezekana kutumia rejeleo la jumla kama “mtu,” au kuelewa שְׂאֵת kuwa heshima/utu zaidi kuliko cheo.
  rationale: Kiebrania kina kiambishi cha nafsi ya tatu, umoja, kiume. “Kumwangusha” na “cheo chake” vinahifadhi rejeleo hilo bila kuingiza utambulisho mpana wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umehifadhi ukinzani wa kishairi kati ya baraka za kinywa na laana ya ndani; “Sela” limetoholewa kwa kuwa maana yake kamili haijulikani.
