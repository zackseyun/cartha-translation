  yaml_path: translation/ot/psalms/062/006.yaml
  text: He alone is my rock and my salvation[a], my stronghold; I will not be shaken.
translation:
  language: sw
  text: Yeye peke yake ndiye mwamba wangu na wokovu wangu, ngome yangu; sitatikisika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sitaondoshwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ הוּא
  choice: Yeye peke yake ndiye
  rationale: Muundo huu unaonyesha msisitizo na upekee wa Mungu kwa Kiswahili cha kawaida, huku kiwakilishi הוּא kikirejelea Mungu katika muktadha.
- source_word: צוּרִי
  choice: mwamba wangu
  rationale: Neno hili linadumisha sitiari ya Mungu kuwa msingi imara na ulinzi salama; “mwamba” ni la asili na lenye hadhi katika Kiswahili.
- source_word: וִישׁוּעָתִי
  choice: wokovu wangu
  rationale: “Wokovu” linahifadhi maana pana ya kuokoa au kukomboa, bila kuifinya iwe tukio moja tu la kuokolewa.
- source_word: מִשְׂגַּבִּי
  choice: ngome yangu
  rationale: “Ngome” huwasilisha mahali imara pa kujilinda, ingawa wazo la mahali palipoinuka katika neno la Kiebrania halitamkwi moja kwa moja.
- source_word: לֹא אֶמּוֹט
  choice: sitatikisika
  rationale: Kitenzi hiki kinawasilisha kwa ufupi hali ya kutoyumbishwa au kutohamishwa, na ni cha kawaida katika Kiswahili cha kisasa.
theological_decisions:
- issue: Kiwango cha uhakika katika kishazi cha mwisho
  choice: sitatikisika
  alternative: sitaondoshwa mahali pangu
  rationale: Tafsiri hii inadumisha ujasiri wa mtunga zaburi unaotokana na Mungu kuwa ulinzi wake, bila kuugeuza kuwa dai pana la kutoweza kudhurika kwa namna yoyote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya “wangu” yamehifadhiwa ili kutunza mdundo na msisitizo wa kishairi wa Kiebrania.
