  text: כִּ֣י מַ֭לְאָכָי/ו יְצַוֶּה לָּ֑/ךְ לִ֝/שְׁמָרְ/ךָ֗ בְּ/כָל דְּרָכֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/011.yaml
  text: For he will command his angels concerning you[b][a], to guard you in all your ways.
translation:
  language: sw
  text: Kwa maana atawaamuru malaika wake kwa ajili yako[a], wakulinde[b] katika njia zako zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuhusu wewe.” Muundo wa Kiebrania unaweza kuonyesha manufaa au jambo linalomhusu mtu.
    reason: lexical_alternative
  - marker: b
    text: Au, “wakuhifadhi” au “wakutunze.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kinaanzisha sababu ya uhakikisho uliotangulia na kudumisha mtiririko wa kishairi.
- source_word: מַלְאָכָיו
  choice: malaika wake
  rationale: Katika muktadha huu neno hilo linawarejelea viumbe wa mbinguni wanaotumwa kulinda, hivyo ‘malaika’ ni chaguo la kawaida na linalofaa.
- source_word: יְצַוֶּה
  choice: atawaamuru
  rationale: Kitenzi cha Kiebrania kina maana ya kutoa amri; umbo la Kiswahili linaonyesha kuwa malaika ndio wanaoamriwa.
- source_word: לָּךְ
  choice: kwa ajili yako
  rationale: Kihusishi hapa kinaonyesha mtu ambaye amri inatolewa kwa manufaa au habari yake, si kwamba yeye ndiye anayepewa amri.
- source_word: לִשְׁמָרְךָ
  choice: wakulinde
  rationale: Kinawasilisha moja kwa moja tendo la kumhifadhi mtu dhidi ya hatari, linalofaa muktadha wa zaburi.
- source_word: בְּכָל
  choice: katika ... zote
  rationale: Kinaendeleza upeo kamili unaoonyeshwa na kihusishi pamoja na kiashiria cha ujumla.
- source_word: דְּרָכֶיךָ
  choice: njia zako
  rationale: Kinahifadhi sitiari ya Kiebrania ambayo inaweza kuhusisha njia halisi na mwenendo au safari ya maisha.
theological_decisions:
- issue: Mhusika wa kitenzi cha nafsi ya tatu umoja wa kiume
  choice: Mungu ndiye atakayewaamuru malaika wake.
  alternative: Mhusika aachwe bila kutambulishwa wazi kwa kutegemea muktadha.
  rationale: Muktadha wa zaburi unamtaja BWANA kama mlinzi, na maumbo ya vitenzi yanaelekea kumrejelea yeye kama mtoa amri.
- issue: Upeo wa ‘njia zako zote’
  choice: Kudumisha usemi mpana wa kishairi bila kuufafanua kuwa ahadi isiyo na masharti kuhusu kila tendo.
  alternative: Kutafsiri ‘katika safari zako zote’ na kuufanya uwe kuhusu kusafiri tu.
  rationale: ‘Njia’ huhifadhi upana na mvutano wa sitiari ya Kiebrania bila kuamua kimadhehebu mipaka ya ahadi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio ni wa kawaida kwa Kiswahili huku sambamba ya kishairi na maana pana ya ‘njia’ zikihifadhiwa.
