  text: רַ֭ק בְּ/עֵינֶ֣י/ךָ תַבִּ֑יט וְ/שִׁלֻּמַ֖ת רְשָׁעִ֣ים תִּרְאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/008.yaml
  text: You will only look with your eyes and see the repayment of the wicked[a].
translation:
  language: sw
  text: Utaangalia tu kwa macho yako, na utaona malipo ya waovu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “malipo wanayostahili waovu” au “adhabu ya waovu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: tu
  rationale: 'Neno hili linaonyesha ukomo: anayesemeshwa atatazama tu, wala hatapatwa na yale yanayowapata waovu.'
- source_word: בְּעֵינֶיךָ
  choice: kwa macho yako
  rationale: Huhifadhi taswira ya Kiebrania ya kushuhudia jambo moja kwa moja kwa macho.
- source_word: תַבִּיט
  choice: utaangalia
  rationale: Ni kitenzi cha kawaida na cha sasa kinachowasilisha tendo la kuelekeza macho au kutazama.
- source_word: וְשִׁלֻּמַת
  choice: malipo
  rationale: Huwasilisha wazo la kulipwa kwa kadiri ya matendo bila kulifafanua kwa lazima kuwa adhabu pekee.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Ni neno la kawaida katika Kiswahili kwa kundi la watu wenye uovu, na linahifadhi uzito wa kimaadili wa neno la Kiebrania.
- source_word: תִּרְאֶה
  choice: utaona
  rationale: Huwasilisha maana ya moja kwa moja ya kuona na kudumisha utofauti mdogo kati ya kuangalia na kuona.
theological_decisions:
- issue: Asili ya yatakayowapata waovu
  choice: malipo ya waovu
  alternative: adhabu ya waovu; malipo wanayostahili waovu
  rationale: Nomino ya Kiebrania ina wazo pana la malipo au tendo kurudishwa kwa mtu kulingana na matendo yake. “Malipo” huhifadhi maana hiyo ya kimaadili na kihukumu bila kuifanya iwe adhabu kwa ufafanuzi wa moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kawaida lakini chenye heshima. Mpangilio ni wa asili katika Kiswahili huku ukihifadhi urudiaji wa vitenzi viwili vya Kiebrania, “kuangalia” na “kuona.”
