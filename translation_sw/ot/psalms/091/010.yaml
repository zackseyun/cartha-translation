id: PSA.91.10
reference: Psalms 91:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לֹֽא תְאֻנֶּ֣ה אֵלֶ֣י/ךָ רָעָ֑ה וְ֝/נֶ֗גַע לֹא יִקְרַ֥ב בְּ/אָהֳלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/010.yaml
  text: No harm will happen to you[b][a], and no plague will come near your tent.
translation:
  language: sw
  text: Hakuna madhara yatakayokupata[a], wala tauni itakayokaribia hema lako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hakuna jambo baya litakalokupata.”
    reason: lexical_alternative
  - marker: b
    text: Au, “makao yako”; neno “hema” linaweza kutumiwa kwa maana pana ya nyumba au familia ya mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְאֻנֶּה
  choice: yatakayokupata
  rationale: Kitenzi אנה hapa kina maana ya jambo kutokea au kumpata mtu. “Yatakayokupata” ni Kiswahili cha kawaida na kinacholingana vizuri na “madhara.”
- source_word: רָעָה
  choice: madhara
  rationale: Katika muktadha huu wa ulinzi, neno hilo linaashiria ubaya unaodhuru au msiba, si lazima uovu wa kimaadili. “Madhara” huwasilisha wazi wazo la jambo lenye kuumiza.
- source_word: נֶגַע
  choice: tauni
  rationale: Neno hili linaweza kumaanisha pigo au ugonjwa unaowapata watu. Katika muktadha wa Zaburi 91, unaozungumzia maradhi hatari na ulinzi, “tauni” linafaa huku maana pana ya “pigo” ikibaki kuwa uwezekano wa kileksika.
- source_word: יִקְרַב
  choice: itakayokaribia
  rationale: Huhifadhi taswira ya nafasi katika kitenzi קרב, yaani kuja karibu, kwa Kiswahili cha asili.
- source_word: אָהֳלֶךָ
  choice: hema lako
  rationale: Maana halisi ni “hema lako.” Taswira hiyo halisi imehifadhiwa, ingawa neno linaweza kurejelea makao au nyumba ya mtu kwa upana zaidi.
- source_word: אֵלֶיךָ
  choice: -ku- katika “yatakayokupata”
  rationale: Kiambishi cha yambwa “-ku-” huonyesha kwamba madhara yanaelekezwa kwa mtu anayesemeshwa, kwa njia ya asili katika Kiswahili.
theological_decisions:
- issue: Asili ya ahadi ya ulinzi
  choice: Kauli imetafsiriwa moja kwa moja kama ahadi ya kishairi ya ulinzi wa Mungu, bila kuongeza ufafanuzi kuhusu hali zote ambamo ahadi hiyo hutimizwa.
  alternative: Kuitafsiri waziwazi kuwa dhamana isiyo na masharti kwamba mwaminifu hatapata kamwe mateso yoyote ya kimwili.
  rationale: Kiebrania kinatoa ahadi hiyo kwa nguvu na kwa mtindo wa kishairi. Tafsiri inadumisha nguvu hiyo bila kuamua mjadala mpana wa kitheolojia kuhusu mateso na majaliwa ya Mungu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kishairi umehifadhiwa kwa vipashio viwili vinavyolingana: madhara hayatampata msomaji, wala tauni haitakaribia hema lake.'
