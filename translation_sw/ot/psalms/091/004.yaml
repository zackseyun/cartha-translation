base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/004.yaml
  text: With his pinions he will cover you[a], and under his wings you will find refuge[b]; his faithfulness is a shield and a bulwark.
translation:
  language: sw
  text: Kwa manyoya yake atakufunika[a], na chini ya mabawa yake utapata kimbilio; uaminifu wake ni ngao kubwa na ngao ndogo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa sehemu zenye manyoya za mabawa yake atakufunika.”
    reason: lexical_alternative
  - marker: b
    text: Maana ya neno la Kiebrania lililotafsiriwa “ngao ndogo” haijulikani kwa uhakika; linaweza pia kumaanisha “boma la ulinzi.” “Uaminifu wake” linaweza pia kutafsiriwa “ukweli wake.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֶבְרָתוֹ
  choice: Kwa manyoya yake
  rationale: אֶבְרָה hurejelea manyoya au sehemu yenye manyoya ya bawa la ndege. “Manyoya” ni neno la kawaida na linaloeleweka, huku likihifadhi taswira ya ndege.
- source_word: יָסֶךְ
  choice: atakufunika
  rationale: Hiphil ya סכך ina maana ya kufunika kwa kusudi la kulinda; “atakufunika” ni tafsiri ya moja kwa moja inayolingana na taswira ya mabawa.
- source_word: לָךְ
  choice: -ku-
  rationale: Kiambishi cha yambwa katika “atakufunika” kinawakilisha nafsi ya pili umoja bila kulazimisha jinsia katika Kiswahili.
- source_word: וְתַחַת כְּנָפָיו
  choice: na chini ya mabawa yake
  rationale: Tafsiri hii ya kawaida ya nafasi inaendeleza kwa uwazi taswira ya ulinzi wa ndege.
- source_word: תֶּחְסֶה
  choice: utapata kimbilio
  rationale: חסה humaanisha kukimbilia au kutafuta hifadhi. “Utapata kimbilio” ni Kiswahili cha asili na kinaonyesha usalama unaopatikana bila kuacha wazo la hifadhi.
- source_word: צִנָּה
  choice: ngao kubwa
  rationale: צִנָּה mara nyingi ni ngao kubwa inayolinda sehemu kubwa ya mwili; kutaja ukubwa kunasaidia kuitofautisha na neno linalofuata.
- source_word: וְסֹחֵרָה
  choice: na ngao ndogo
  rationale: סֹחֵרָה ni neno adimu na lenye maana isiyo hakika, lakini katika muktadha huu limeeleweka kimapokeo kuwa kinga ya pili kama ngao ndogo. Tafsiri hiyo huhifadhi sitiari ya kivita, huku tanbihi ikitaja uwezekano mwingine.
- source_word: אֲמִתּוֹ
  choice: uaminifu wake
  rationale: אֱמֶת linaweza kumaanisha ukweli, uaminifu, au kutegemeka. Hapa “uaminifu” hufaa katika muktadha wa ulinzi na huonyesha kwamba Mungu anategemeka.
theological_decisions:
- issue: Maana ya אֲמִתּוֹ katika sitiari ya ulinzi
  choice: uaminifu wake
  alternative: ukweli wake
  rationale: Maana zote mbili zinawezekana kileksika. “Uaminifu wake” inafaa zaidi kwa wazo la Mungu kuwa kinga ya kutegemeka bila kuongeza dai la kimadhehebu; “ukweli wake” umehifadhiwa katika tanbihi.
- issue: Maana ya סֹחֵרָה kama kinga
  choice: ngao ndogo
  alternative: boma la ulinzi
  rationale: Neno la Kiebrania ni adimu na maana yake si hakika. “Ngao ndogo” hufuata uelewa wa kimapokeo na kuunda jozi ya kinga na צִנָּה, lakini uwezekano wa kinga inayozunguka kama boma umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira za ndege na za kivita zimehifadhiwa. “Ngao kubwa na ngao ndogo” hutofautisha aina mbili za kinga bila kutumia msamiati wa kale usioeleweka.
