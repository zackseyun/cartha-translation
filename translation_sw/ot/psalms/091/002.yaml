base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/002.yaml
  text: I say to Yahweh[a], “My refuge and my fortress, my God, in whom I trust.”
translation:
  language: sw
  text: Ninamwambia Yahweh[a], “Wewe ni kimbilio langu na ngome yangu, Mungu wangu; ninamtumaini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH; kwa desturi hutafsiriwa “BWANA.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: Ninamwambia
  rationale: Qal imperfect nafsi ya kwanza umoja inaweza kueleza tendo la sasa au la wakati ujao. Katika ungamo hili la kishairi, wakati wa sasa unafaa na, pamoja na לַיהוָה, unaonyesha kwamba maneno yanaelekezwa kwa Yahweh.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Kihusishi ל־ hapa kinaeleweka kuwa kinaonyesha anayeambiwa; katika Kiswahili maana hiyo imejumuishwa kiasili katika kitenzi “ninamwambia.”
- source_word: יהוה
  choice: Yahweh
  rationale: Jina la agano YHWH limetolewa kwa umbo “Yahweh,” huku tanbihi ikitaja desturi ya kulitafsiri “BWANA.”
- source_word: מַחְסִי
  choice: kimbilio langu
  rationale: מַחְסֶה ni mahali pa kukimbilia ili kupata usalama; “kimbilio langu” ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: וּמְצוּדָתִי
  choice: na ngome yangu
  rationale: מְצוּדָה ni ngome au mahali imara pa ulinzi; “ngome” huhifadhi taswira ya kijeshi na kuambatana vizuri na “kimbilio.”
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: 'Kiambishi cha nafsi ya kwanza umoja kinaonyesha wazi ungamo binafsi: “Mungu wangu.”'
- source_word: אֶבְטַח
  choice: ninayemtumaini
  rationale: Qal imperfect ya בטח huonyesha kumtumainia au kumtegemea mtu kwa usalama. Umbo la sasa linaonyesha tumaini la kudumu bila kulazimisha maana ya wakati ujao.
- source_word: בּוֹ
  choice: ninayemtumaini
  rationale: Kihusishi ב־ pamoja na kiambishi cha nafsi ya tatu hueleza kumtumaini yeye; Kiswahili hutumia kitenzi “tumaini” kwa yambwa moja kwa moja, hivyo maana ya kiuhusiano imejumuishwa kiasili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja. “Yahweh” huhifadhi jina la agano, na tafsiri ya kimapokeo “BWANA” inaonyeshwa katika tanbihi bila kuficha ushahidi wa chanzo.
- issue: Uhusiano wa “kimbilio langu na ngome yangu” na Yahweh
  choice: Wewe ni kimbilio langu na ngome yangu
  alternative: Kimbilio langu na ngome yangu
  rationale: Kiebrania kina virai nomino visivyo na kitenzi wazi. Kuongeza “Wewe ni” ni ujazo wa kawaida unaohitajika katika Kiswahili na huhifadhi maana kwamba sifa hizo zinamhusu Yahweh, bila kuongeza dai jipya la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ninamwambia” na “Wewe ni” hufanya muundo wa Kiebrania uwe wa kawaida kwa msomaji bila kuondoa sauti ya ungamo la kishairi.
