  yaml_path: translation/ot/psalms/091/007.yaml
  text: A thousand may fall at your side[a], and ten thousand at your right hand[b], but it will not come near you.
translation:
  language: sw
  text: 'Elfu moja inaweza kuanguka kando yako,[a]

    na elfu kumi upande wako wa kulia,

    lakini hilo halitakukaribia.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Elfu moja itaanguka kando yako, na elfu kumi upande wako wa kulia.” Katika ushairi huu, vitenzi vya Kiebrania vinaweza kueleweka kwa maana ya wakati ujao au ya uwezekano.
    reason: lexical_alternative
  - marker: b
    text: 'Tafsiri ya moja kwa moja: “halitakusogelea.” Kiima hakitajwi katika Kiebrania; muktadha unadokeza tishio au janga linalozungumziwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפֹּל
  choice: wanaweza kuanguka
  rationale: Kitenzi cha Kiebrania katika hali ya imperfect kinaweza kueleweka kwa maana ya wakati ujao au uwezekano katika ushairi huu. “Wanaweza kuanguka” huhifadhi uwezekano huo bila kulazimisha maana ya wakati ujao.
- source_word: מִצִּדְּךָ
  choice: kando yako
  rationale: Ingawa kihusishi מִן kwa kawaida humaanisha “kutoka,” hapa pamoja na “kuanguka” kinaonyesha mahali karibu na mtu. “Kando yako” ni Kiswahili cha kawaida na huhifadhi taswira ya mahali.
- source_word: אֶלֶף
  choice: watu elfu
  rationale: Nambari “elfu” imetafsiriwa moja kwa moja; “watu” imeongezwa ili kuweka wazi wale wanaoanguka, kama inavyodokezwa na wingi wa kishairi.
- source_word: וּרְבָבָה
  choice: na watu elfu kumi
  rationale: רְבָבָה mara nyingi humaanisha elfu kumi na huongeza uzito kutoka “elfu” katika ulinganifu wa kishairi.
- source_word: מִימִינֶךָ
  choice: upande wako wa kulia
  rationale: Kirai hiki kinaonyesha eneo lililo upande wa kulia wa anayeambiwa na huhifadhi ulinganifu wa mstari uliotangulia.
- source_word: אֵלֶיךָ לֹא יִגָּשׁ
  choice: hilo halitakukaribia
  rationale: נגשׁ pamoja na אֶל huonyesha kusogea kuelekea mtu. “Halitakukaribia” ni usemi wa kawaida wa Kiswahili; “hilo” hurejelea kwa upana tishio au janga la muktadha bila kulitaja kwa namna finyu.
theological_decisions:
- issue: Kiima kisichotajwa katika kishazi cha mwisho
  choice: Kutumia “hilo” likirejelea tishio au janga linalodokezwa na muktadha
  alternative: Kutaja wazi “janga” au “tauni”
  rationale: Kiebrania hakitaji kiima cha kitenzi cha mwisho. Kiswahili huhitaji rejeleo linaloeleweka; “hilo” huhifadhi kutotajwa wazi kwa kiima na huepuka kuifanya maana kuwa finyu kuliko maandishi yenyewe.
- issue: Maana ya imperfect יִפֹּל
  choice: “wanaweza kuanguka”
  alternative: “wataanguka”
  rationale: Muundo unaweza kuwa wa wakati ujao au wa uwezekano katika muktadha huu wa kishairi. Tafsiri kuu huhifadhi uwezekano, huku maana ya wakati ujao ikionyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mistari mitatu huhifadhi ulinganifu na ongezeko la nguvu kutoka elfu moja hadi elfu kumi.
