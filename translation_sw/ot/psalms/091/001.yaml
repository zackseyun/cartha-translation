  yaml_path: translation/ot/psalms/091/001.yaml
  text: He who dwells in the shelter of the Most High will lodge in the shadow of the Almighty[a][b][c].
translation:
  language: sw
  text: Anayekaa mahali pa maficho[a] ya Aliye Juu Zaidi atakaa usiku[b] katika uvuli wa Mwenyezi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali pa siri pa Aliye Juu Zaidi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “atalala” au “atadumu.” Kitenzi cha Kiebrania huonyesha kulala au kukaa mahali usiku, na kwa maana iliyopanuliwa, kubaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֵׁב
  choice: Anayekaa
  rationale: Kitenzi kishirikishi kimetumiwa kama nomino kumtaja mtu ambaye sifa yake ni kukaa mahali hapo. “Anayekaa” ni cha asili katika Kiswahili na kinaweza kumwakilisha mtu yeyote bila kulazimisha jinsia ambayo sarufi ya Kiswahili haihitaji hapa.
- source_word: בְּסֵתֶר
  choice: katika maficho
  rationale: סֵתֶר ni mahali palipofichika na salama. “Maficho” huhifadhi wazo la kufichwa na pia la kupata hifadhi, ingawa “mahali pa siri” linawezekana.
- source_word: עֶלְיוֹן
  choice: Aliye Juu Zaidi
  rationale: Ni cheo cha Mungu kinachoonyesha ukuu wake usio na kifani. Umbo hili ni wazi, la heshima, na la kawaida katika Kiswahili cha Biblia.
- source_word: בְּצֵל
  choice: katika uvuli
  rationale: Kiebrania kinasema kwa msingi “katika kivuli/uvuli.” “Uvuli” hudumisha taswira ya kinga na ukaribu na pia inafaa kwa lugha ya kishairi.
- source_word: שַׁדַּי
  choice: Mwenyezi
  rationale: Cheo kimetafsiriwa badala ya kuandikwa kwa matamshi kama Shaddai. “Mwenyezi” ni tafsiri iliyokita mizizi inayowasilisha uwezo mkuu wa Mungu.
- source_word: יִתְלוֹנָן
  choice: atalala
  rationale: Kitenzi לון kwa kawaida huhusu kulala au kukaa usiku, na kwa upanuzi kudumu. “Atalala” huhifadhi taswira halisi ya kukaa usiku kuliko neno la jumla kama “atadumu.”
theological_decisions:
- issue: Jinsia ya mshiriki wa sentensi
  choice: Anayekaa
  alternative: Mtu akaaye; Yeye akaaye
  rationale: Kiebrania kina umoja wa kiume wenye matumizi wakilishi. Kiswahili hakionyeshi jinsia katika “anayekaa”; hivyo tafsiri inabaki ya kawaida kimaumbile bila kupunguza upeo wa maana ya Kiebrania.
- issue: Tafsiri ya cheo שַׁדַּי
  choice: Mwenyezi
  alternative: Shaddai; Mwenyezi Mungu
  rationale: “Mwenyezi” hutafsiri cheo bila kuongeza nomino “Mungu,” ambayo haipo wazi katika mstari huu. “Shaddai” lingeacha maana ya cheo bila kutafsiriwa.
- issue: Nguvu ya wakati na hali katika יִתְלוֹנָן
  choice: atalala
  alternative: hukaa; atadumu; atakaa usiku
  rationale: Umbo la Kiebrania linaweza kusomwa kwa mwelekeo wa wakati ujao au kama kauli ya jumla ya kishairi. “Atalala” linafuata umbo la wakati ujao na kuhifadhi picha ya kulala usiku; tanbihi inaonyesha upana wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Maficho,” “uvuli,” na “atalala” vinadumisha picha za usalama, ukaribu, na kukaa usiku katika ushairi wa Kiebrania.
