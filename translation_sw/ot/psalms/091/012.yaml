  text: On their hands they will carry you[b][a], lest you strike your foot against a stone.
translation:
  language: sw
  text: Watakubeba mikononi mwao,[a] ili usije ukagonga mguu wako kwenye jiwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “juu ya viganja vyao.” Pia inaweza kutafsiriwa, “watakuinua” au “watabeba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כַּפַּיִם
  choice: mikononi mwao
  rationale: Kirai hiki kihalisi ni ‘juu ya viganja/mikono.’ Katika Kiswahili, ‘mikononi mwao’ ni usemi wa kawaida unaohifadhi picha ya kubebwa kwa mikono.
- source_word: יִשָּׂאוּנְךָ
  choice: Watakubeba
  rationale: Kitenzi נָשָׂא kinaweza kumaanisha kuinua, kubeba, au kuchukua. ‘Watakubeba’ ni cha asili katika muktadha huu wa ulinzi bila kuongeza wazo lisilo lazima la kuinuliwa juu.
- source_word: פֶּן
  choice: ili ... usi-
  rationale: פֶּן huanzisha kusudi au matokeo hasi ya kuzuiwa. Muundo ‘ili ... usi-’ ni wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: תִּגֹּף
  choice: usigonge
  rationale: Mzizi נָגַף hapa unaeleza mguu kugonga jiwe. ‘Kugonga’ huhifadhi tendo la kugusana kwa nguvu bila kulitafsiri zaidi kuwa kujikwaa au kuanguka.
- source_word: בָּאֶבֶן
  choice: jiwe
  rationale: Baada ya kitenzi ‘kugonga,’ Kiswahili sanifu hutumia yambwa moja kwa moja; nomino hii ina maana isiyobainishwa, ‘jiwe,’ si lazima ‘lile jiwe.’
- source_word: רַגְלֶךָ
  choice: mguu wako
  rationale: Nomino ya Kiebrania iko katika umoja na kiambishi cha nafsi ya pili umoja; ‘mguu wako’ hudumisha umoja huo na ni usemi wa kawaida.
theological_decisions:
- issue: Usemi wa kimapokeo dhidi ya lugha ya sasa inayofuata chanzo
  choice: Watakubeba mikononi mwao
  alternative: Watakuinua juu kwa mikono yao
  rationale: Chaguo lililopitishwa linahifadhi picha ya ulinzi katika Kiebrania na maana pana ya kubeba, bila kuongeza kwa lazima mwelekeo wa kwenda juu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka, huku taswira ya mikono na tahadhari ya mguu kugonga jiwe vikihifadhiwa.
