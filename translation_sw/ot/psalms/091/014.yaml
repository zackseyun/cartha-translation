lexical_decisions:
- source_word: כִּי
  choice: Kwa kuwa
  rationale: Katika sehemu zote mbili, neno hili linaonyesha sababu ya tendo la Mungu; “kwa kuwa” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: בִי
  choice: nami
  rationale: Pamoja na חָשַׁק, kiambishi hiki kinaonyesha kwamba mshikamano unaelekezwa kwa Mungu. “Ameshikamana nami” ni usemi wa kawaida wa Kiswahili.
- source_word: חָשַׁק
  choice: ameshikamana
  rationale: Kitenzi hiki huonyesha kushikamana sana au kuwa na upendo wenye nguvu. “Ameshikamana” huhifadhi wazo la uhusiano thabiti bila kulipunguza kuwa hisia pekee.
- source_word: וַאֲפַלְּטֵהוּ
  choice: nitamwokoa
  rationale: Hili ni ahadi ya Mungu ya kumtoa mtu katika hatari; “nitamwokoa” ni wazi na la kawaida katika Kiswahili cha sasa.
- source_word: אֲשַׂגְּבֵהוּ
  choice: nitamweka salama mahali pa juu
  rationale: Kitenzi kinabeba picha ya kumweka mtu juu pasipofikika, na hivyo akiwa salama. Tafsiri hii huhifadhi picha ya kuinuliwa pamoja na maana yake ya ulinzi.
- source_word: יָדַע
  choice: analijua
  rationale: Kitenzi kinaeleza sababu ya ulinzi wa Mungu na kinaweza kuhusisha kumjua Mungu kwa uhusiano. “Analijua” huhifadhi usemi wa Kiebrania bila kuufafanua kupita kiasi.
- source_word: שְׁמִי
  choice: jina langu
  rationale: “Jina” linaweza kudokeza nafsi na tabia ya Mungu iliyofunuliwa, lakini usemi halisi umehifadhiwa ili maana hiyo pana ibaki wazi bila kufasiriwa kupita kiasi.
theological_decisions:
