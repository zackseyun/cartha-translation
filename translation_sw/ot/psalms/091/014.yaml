  text: Kwa kuwa ameshikamana nami[a], nitamwokoa; nitamweka mahali pa juu salama[b], kwa kuwa analijua jina langu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ananipenda” au “ameweka upendo wake kwangu.” Kitenzi cha Kiebrania huonyesha kushikamana sana au kuwa na upendo wenye nguvu.
