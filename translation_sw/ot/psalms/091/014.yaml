  choice: “Ameshikamana nami”
  alternative: “Ananipenda” au “ameweka upendo wake kwangu”
  rationale: Uteuzi huu huhifadhi picha ya Kiebrania ya mshikamano wenye nguvu na hauifanyi maana kuwa hisia tu.
- issue: Picha ya ulinzi katika אֲשַׂגְּבֵהוּ
  choice: “Nitamweka salama mahali pa juu”
  alternative: “Nitamlinda” au “nitamweka juu”
  rationale: Tafsiri iliyochaguliwa huhifadhi usalama unaotokana na kuwa mahali pa juu pasipofikika, bila kugeuza kitenzi kuwa wazo la kutukuzwa tu.
