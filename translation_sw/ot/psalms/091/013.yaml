  yaml_path: translation/ot/psalms/091/013.yaml
  text: You will tread on the lion and the cobra[b][a]; you will trample the young lion and the serpent.
translation:
  language: sw
  text: Utakanyaga simba na nyoka mwenye sumu; utakanyaga chini simba mchanga na nyoka mkubwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “joka.” Neno la Kiebrania linaweza pia kumaanisha joka au kiumbe mkubwa wa majini katika miktadha mingine.
    reason: alternative_reading
lexical_decisions:
- source_word: עַל
  choice: juu ya / -kanyaga (kiambishi cha yambwa)
  rationale: Kihusishi kinaonyesha vitu vinavyokanyagwa; katika Kiswahili asili yake inaelezwa vizuri ndani ya kitenzi ‘kukanyaga’ bila kutafsiriwa kwa neno tofauti.
- source_word: שַׁחַל
  choice: simba
  rationale: Ni neno la kishairi linalomaanisha simba; ‘simba’ ni sahihi, wazi, na linafaa katika sajili ya zaburi.
- source_word: פֶתֶן
  choice: nyoka mwenye sumu
  rationale: Neno hilo hutaja nyoka hatari mwenye sumu, lakini utambulisho wa spishi kama kobra si wa hakika vya kutosha; tafsiri hii huhifadhi maana kuu bila kubainisha kupita ushahidi.
- source_word: תִּדְרֹךְ
  choice: utawakanyaga
  rationale: Kitenzi cha Qal imperfect nafsi ya pili umoja wa kiume kina maana ya kukanyaga; umbo lenye kiambishi cha yambwa linaunganisha vitu viwili kwa Kiswahili cha kawaida.
- source_word: תִּרְמֹס
  choice: utawakanyaga kwa nguvu
  rationale: Kitenzi hiki kina nguvu kuliko cha mstari wa kwanza na huonyesha kukanyaga chini au kutiisha; ‘kwa nguvu’ huhifadhi ongezeko hilo la mkazo.
- source_word: כְּפִיר
  choice: mwana-simba
  rationale: Humaanisha simba mchanga mwenye nguvu, si lazima kitoto kidogo; ‘mwana-simba’ ni neno la Kiswahili linalofaa kwa ushairi.
- source_word: תַנִּין
  choice: joka
  rationale: Neno pana linaweza kumaanisha nyoka mkubwa, joka, au kiumbe mkubwa wa majini. ‘Joka’ huhifadhi upana na uzito wa picha ya Kiebrania kuliko kulifanya tu ‘nyoka,’ huku tanbihi ikieleza uwezekano wa maana.
theological_decisions:
- issue: Iwapo תַנִּין litafsiriwe kama joka au nyoka
  choice: joka
  alternative: nyoka mkubwa
  rationale: Muktadha wa wanyama hatari wa nchi kavu unaunga mkono ‘nyoka mkubwa,’ lakini neno la Kiebrania lina wigo mpana na linaweza kuwa na taswira ya joka au kiumbe mkubwa. ‘Joka’ katika matini, pamoja na tanbihi, huhifadhi utata huo bila kuingiza kiumbe wa baharini katika muktadha kwa lazima.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Ulinganifu wa jozi za wanyama na ongezeko la nguvu kutoka ‘kukanyaga’ hadi ‘kukanyaga kwa nguvu’ umehifadhiwa; lugha ya kikale au utambulisho wa spishi usio na hakika umeepukwa.
