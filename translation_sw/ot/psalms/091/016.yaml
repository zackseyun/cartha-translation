  language: en
  yaml_path: translation/ot/psalms/091/016.yaml
  text: I will satisfy him with length of days[a], and I will show him my salvation.
translation:
  language: sw
  text: Nitamshibisha kwa maisha marefu, nami nitamwonyesha wokovu wangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukombozi wangu.” Neno la Kiebrania linaweza kumaanisha kuokolewa kutoka hatarini, na pia wokovu kwa maana pana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ יָמִים
  choice: maisha marefu
  rationale: Kirai hiki humaanisha kihalisi ‘urefu wa siku.’ ‘Maisha marefu’ ni usemi wa kawaida na wazi wa Kiswahili unaowasilisha maana hiyo bila kufanya mstari usikike wa kigeni.
- source_word: אַשְׂבִּיעֵהוּ
  choice: Nitamshibisha
  rationale: Kauli ya Hiphil ya שׂבע humaanisha kumsababisha mtu ashibe au aridhike. ‘Nitamshibisha kwa maisha marefu’ inadumisha taswira ya Kiebrania kwamba Mungu atamjaza mtu huyo kwa wingi wa siku.
- source_word: וְאַרְאֵהוּ
  choice: nami nitamwonyesha
  rationale: Hiphil ya ראה hapa ni ‘kusababisha aone,’ yaani ‘kumwonyesha.’ Tafsiri hii inadumisha wazi utendaji wa Mungu.
- source_word: בִּישׁוּעָתִי
  choice: wokovu wangu
  rationale: יְשׁוּעָה inaweza kumaanisha wokovu au ukombozi kutoka hatarini. ‘Wokovu wangu’ inadumisha upana wa maana, huku tanbihi ikitaja uwezekano wa ‘ukombozi wangu.’
theological_decisions:
- issue: Upeo wa maana ya יְשׁוּעָה katika zaburi ya ulinzi wa Mungu
  choice: wokovu wangu
  alternative: ukombozi wangu
  rationale: Katika mstari huu wa kilele, neno la Kiebrania linaweza kumaanisha kuokolewa kutoka hatarini kwa namna halisi na pia wokovu kwa maana pana. ‘Wokovu’ huhifadhi upana huo bila kuondoa maana ya ukombozi wa sasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Nitamshibisha’ huhifadhi taswira ya chanzo huku ‘maisha marefu’ ikiwa ya kawaida zaidi kuliko ‘urefu wa siku.’
