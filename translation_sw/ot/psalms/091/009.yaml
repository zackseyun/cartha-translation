  text: כִּֽי אַתָּ֣ה יְהוָ֣ה מַחְסִ֑/י עֶ֝לְי֗וֹן שַׂ֣מְתָּ מְעוֹנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/009.yaml
  text: Because you[a], O Yahweh, are my refuge, you have made the Most High your dwelling place.
translation:
  language: sw
  text: Kwa kuwa wewe, Ee Yahwe, ndiwe kimbilio langu; umemfanya Aliye Juu Zaidi kuwa makao yako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa uelewaji mwingine uliozoeleka wa Kiebrania hiki kigumu: “Kwa kuwa umesema, ‘Yahwe ni kimbilio langu,’ na umemfanya Aliye Juu Zaidi kuwa makao yako.”'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa sababu
  rationale: Huleta msingi au sababu ya ulinzi unaotajwa katika muktadha, huku ikihifadhi maana ya kisababishi.
- source_word: אַתָּה
  choice: wewe
  rationale: Kiwakilishi cha nafsi ya pili umoja wa kiume kimewekwa wazi ili kuhifadhi msisitizo wa Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna inayokaribia matamshi ya Tetragramatoni badala ya kubadilishwa kuwa cheo.
- source_word: מַחְסִי
  choice: kimbilio langu
  rationale: Neno מַחְסֶה humaanisha mahali pa kukimbilia au pa kupata hifadhi; “kimbilio” ni la kawaida na linafaa katika lugha ya ulinzi ya Zaburi.
- source_word: עֶלְיוֹן
  choice: Aliye Juu Zaidi
  rationale: Ni cheo cha Mungu kinachoonyesha ukuu wake kuliko wote; muundo huu ni wa asili na wenye heshima katika Kiswahili.
- source_word: שַׂמְתָּ
  choice: umemfanya ... kuwa
  rationale: Kitenzi cha nafsi ya pili umoja kina maana ya kuweka au kufanya kitu kiwe katika nafasi fulani; muundo huu unaendana kawaida na “makao yako.”
- source_word: מְעוֹנֶךָ
  choice: makao yako
  rationale: מָעוֹן ni mahali pa kukaa; “makao” ni Kiswahili cha sasa, wazi, na kinatofautisha neno hili na “kimbilio.”
theological_decisions:
- issue: Sintaksia ya msemaji na anayeambiwa katika Zaburi 91:9
  choice: 'Mstari umetafsiriwa kama usemi wa moja kwa moja kwa mtu mwaminifu: “Kwa sababu wewe, ee Yahwe, ni kimbilio langu, umemfanya Aliye Juu Zaidi kuwa makao yako.”'
  alternative: “Kwa sababu umesema, ‘Yahwe ni kimbilio langu,’ na umemfanya Aliye Juu Zaidi kuwa makao yako.”
  rationale: Maandishi ya Kimasora hayana kitenzi cha wazi kinachomaanisha “umesema,” na yana badiliko gumu kutoka “kimbilio langu” hadi “makao yako.” Tafsiri kuu huhifadhi maneno yaliyopo bila kuongeza kitenzi, huku tafsiri nyingine iliyozoeleka ikiwekwa katika tanbihi ili kutatua ugumu huo bila kuuficha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ee” huonyesha mwito wa moja kwa moja; “kimbilio” na “makao” huhifadhi tofauti ya maneno mawili ya Kiebrania. Alama ya tanbihi imewekwa baada ya sentensi nzima kwa kuwa inahusu uelewaji mbadala wa mstari mzima.
