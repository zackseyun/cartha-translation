  yaml_path: translation/ot/psalms/091/015.yaml
  text: He will call on me[a], and I will answer him; I am with him in trouble[b]; I will rescue him and honor him.
translation:
  language: sw
  text: Ataniita, nami nitamjibu; niko pamoja naye katika taabu; nitamwokoa[a] na kumpa heshima[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nitamtoa katika hatari.”
    reason: lexical_alternative
  - marker: b
    text: Au “nitamtukuza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרָאֵנִי
  choice: Ataniita
  rationale: Kitenzi קרא pamoja na yambwa ya nafsi katika muktadha wa sala humaanisha kumwita au kumlilia Mungu. “Ataniita” ni wazi na ya kawaida katika Kiswahili, huku muktadha ukionyesha kuwa ni mwito wa kumwomba Mungu.
- source_word: וְאֶעֱנֵהוּ
  choice: nami nitamjibu
  rationale: ענה hapa humaanisha kujibu. “Nami nitamjibu” huhifadhi ulinganifu wa moja kwa moja kati ya kumwita Mungu na Mungu kujibu.
- source_word: עִמּוֹ אָנֹכִי
  choice: niko pamoja naye
  rationale: Mpangilio wa Kiebrania unasisitiza kuwa Mungu yuko pamoja naye. Kiswahili hiki ni cha asili na hudumisha kauli ya uwepo wa Mungu bila kuongeza kielezi kisichokuwamo katika chanzo.
- source_word: בְצָרָה
  choice: katika taabu
  rationale: צָרָה inaweza kumaanisha taabu, dhiki, au shida. “Katika taabu” ni lugha inayoeleweka na yenye hadhi, na inaonyesha hali ya mateso au hatari.
- source_word: אֲחַלְּצֵהוּ
  choice: nitamwokoa
  rationale: חלץ katika Piel humaanisha kumtoa mtu hatarini, kumponya, au kumwokoa. “Nitamwokoa” huonyesha kwa uwazi tendo la Mungu la kumtoa mtu katika hatari.
- source_word: וַאֲכַבְּדֵהוּ
  choice: na kumpa heshima
  rationale: כבד katika Piel inaweza kumaanisha kuheshimu au kutukuza. Kwa kuwa anayepokea tendo hilo ni mwabudu anayelindwa, “kumpa heshima” ni Kiswahili cha asili na huepuka utata usio wa lazima.
theological_decisions:
- issue: Kutoa ahadi za usemi wa Mungu bila kuongeza masharti au maelezo ya sababu yasiyomo katika mstari
  choice: 'Mfululizo wa moja kwa moja wa matendo ya Mungu: kujibu, kuwapo pamoja naye, kuokoa, na kumpa heshima'
  alternative: Kutafsiri kwa kuongeza wazi kwamba ahadi hizi zinategemea uaminifu wa awali wa mtu
  rationale: Kiebrania kinaeleza majibu ya Mungu kwa mtu anayemwita bila kutaja masharti mengine katika mstari huu. Tafsiri inahifadhi ahadi kama zilivyotolewa na haiongezi masharti ya kimafundisho yasiyomo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Wakati wa sasa katika “niko pamoja naye” umehifadhi kauli ya Kiebrania badala ya kuifanya ahadi ya wakati ujao.
