  text: nor the plague that walks in darkness[a], nor the destruction that devastates at noon.
translation:
  language: sw
  text: wala tauni inayotembea gizani,[a] wala maangamizi yanayoharibu adhuhuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ugonjwa wa kuambukiza” badala ya “tauni,” na huenda “pigo lenye kuua” badala ya “maangamizi”; Kiebrania kinatumia maneno mawili ya kishairi yanayofanana kueleza tishio lenye kuharibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּבֶר
  choice: tauni
  rationale: Neno hili kwa kawaida humaanisha ugonjwa hatari wa kuambukiza au pigo la maradhi. “Tauni” ni neno la kawaida katika Kiswahili cha Biblia na linafaa katika usambamba wa kishairi.
- source_word: בָּאֹפֶל
  choice: gizani
  rationale: אֹפֶל humaanisha giza zito au hali ya utusitusi. “Gizani” ni ya asili na inadumisha picha ya kishairi pamoja na utofauti wake na adhuhuri.
- source_word: יַהֲלֹךְ
  choice: inayotembea
  rationale: Kitenzi הלך humaanisha kutembea au kwenda. Tafsiri hii inadumisha uhuishaji wa kishairi unaoionyesha tauni kana kwamba inatembea.
- source_word: קֶּטֶב
  choice: maangamizi
  rationale: קֶטֶב huonyesha uharibifu au pigo lenye kuua. “Maangamizi” huhifadhi upana wa maana bila kulazimisha kwamba tishio hilo ni ugonjwa pekee.
- source_word: יָשׁוּד
  choice: yanayoharibu
  rationale: Kitenzi hiki huonyesha kuharibu, kuangamiza, au kufanya ukiwa. “Yanayoharibu” ni wazi, cha sasa, na kinaendana na nguvu ya kishairi ya mstari.
- source_word: צָהֳרָיִם
  choice: adhuhuri
  rationale: Neno hili humaanisha wakati wa katikati ya mchana. “Adhuhuri” ni fasaha na fupi, na linadumisha utofauti na “gizani.”
- source_word: מִן
  choice: wala
  rationale: Ingawa kihalisi ni “kutoka,” hapa linaendeleza orodha ya mambo ambayo mtu anayelindwa hataogopa. “Wala” huunganisha kishazi hiki kwa kawaida na muktadha wa Zaburi 91:5–6.
