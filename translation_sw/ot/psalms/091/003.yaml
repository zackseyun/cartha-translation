id: PSA.91.3
reference: Psalms 91:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֤י ה֣וּא יַ֭צִּֽילְ/ךָ מִ/פַּ֥ח יָק֗וּשׁ מִ/דֶּ֥בֶר הַוּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/003.yaml
  text: For he will deliver you from the snare of the fowler[b][a], from the deadly pestilence.
translation:
  language: sw
  text: Kwa maana yeye atakuokoa na mtego wa mwindaji wa ndege, na tauni yenye kuangamiza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tauni ya maangamizi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Katika muktadha huu neno hili linaanzisha sababu au msingi wa uhakikisho uliotangulia; “Kwa maana” linaendeleza uhusiano huo kwa Kiswahili cha kawaida.
- source_word: הוּא
  choice: yeye
  rationale: Kiwakilishi huru cha Kiebrania kinakazia mtendaji. Kutaja “yeye” wazi kunahifadhi mkazo huo bila kuongeza maana isiyokuwamo.
- source_word: יַצִּילְךָ
  choice: atakuokoa
  rationale: Kitenzi hiki katika muundo wa Hiphil humaanisha kumwokoa au kumponya mtu kutoka hatarini. “Atakuokoa” ni cha asili na kina uzito unaofaa hapa.
- source_word: מִפַּח
  choice: na mtego
  rationale: פַּח ni kifaa cha kunasia, yaani mtego au tanzi. Baada ya kitenzi “kuokoa,” Kiswahili hutumia “na” kuonyesha jambo ambalo mtu anaokolewa kutoka kwalo.
- source_word: יָקוּשׁ
  choice: wa mwindaji wa ndege
  rationale: Neno hili humaanisha mtu anayetega viumbe, hasa ndege. Tafsiri hii inaeleweka mara moja kuliko istilahi adimu kama “mtegaji,” huku ikihifadhi picha halisi.
- source_word: מִדֶּבֶר
  choice: na tauni
  rationale: דֶּבֶר hurejelea tauni au ugonjwa wa mlipuko unaosababisha vifo vingi. “Tauni” ni neno fupi, lenye uzito, na linalofaa katika ushairi huu.
- source_word: הַוּוֹת
  choice: yenye kuangamiza
  rationale: Nomino ya wingi ina wazo la maangamizi, uharibifu, au madhara makubwa. Kauli ya sifa “yenye kuangamiza” ni ya asili kwa Kiswahili na haibani maana kuwa kifo pekee.
theological_decisions:
- issue: Asili ya hatari zinazotajwa
  choice: Kudumisha picha halisi za mtego na tauni bila kuamua kwamba zinahusu hatari za kimwili pekee au kwamba ni mafumbo pekee.
  alternative: Kuzitafsiri kuwa hatari za kimwili tu, au kuwa hatari za kiroho tu.
  rationale: Kiebrania kinataja hatari halisi, lakini ushairi unaweza kuzitumia kama mifano ya ulinzi wa Mungu kwa upana zaidi. Tafsiri inaacha mvutano huo wazi.
- issue: Uhusiano wa הַוּוֹת na דֶּבֶר
  choice: “tauni yenye kuangamiza”
  alternative: “tauni ya maangamizi”
  rationale: Muundo wa Kiebrania unaweza kueleweka kama tauni yenye tabia ya kuharibu au kama tauni inayohusishwa na maangamizi. Tafsiri kuu ni ya asili zaidi kwa Kiswahili, huku tanbihi ikihifadhi muundo mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Mwindaji wa ndege” limetumiwa badala ya istilahi adimu ili picha ya mtegaji ibaki wazi. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
