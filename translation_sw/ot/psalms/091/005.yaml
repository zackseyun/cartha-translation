  text: לֹא תִ֭ירָא מִ/פַּ֣חַד לָ֑יְלָה מֵ֝/חֵ֗ץ יָע֥וּף יוֹמָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/005.yaml
  text: You will not fear the terror of the night[b][a], nor the arrow that flies by day.
translation:
  language: sw
  text: Hutaogopa hofu ya usiku,[a][b] wala mshale urukao mchana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitisho cha usiku.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Huna haja ya kuogopa,” ili kusisitiza maana ya uhakikisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִירָא
  choice: hutaogopa
  rationale: Qal imperfect nafsi ya pili umoja pamoja na לֹא hapa inaeleweka kwa kawaida kama uhakikisho wa wakati ujao, si lazima kama amri. ‘Hutaogopa’ huhifadhi sauti ya ahadi.
- source_word: פַּחַד
  choice: hofu kuu
  rationale: Nomino hii humaanisha hofu kali au kitisho. ‘Hofu kuu’ ni Kiswahili cha sasa kinachoeleweka na hudumisha uzito wa tishio bila kuifanya kuwa tendo la kuogopa tu.
- source_word: לָיְלָה
  choice: ya usiku
  rationale: Huonyesha uhusiano wa hofu hiyo na usiku na huhifadhi ulinganifu wa kishairi na ‘mchana’ katika mstari wa pili.
- source_word: חֵץ
  choice: mshale
  rationale: Maana ya kawaida ni mshale halisi. Taswira hiyo thabiti imehifadhiwa badala ya kuifasiri moja kwa moja kuwa hatari kwa ujumla.
- source_word: יָעוּף
  choice: urukao
  rationale: Kitenzi עוּף humaanisha kuruka; umbo la ‘urukao’ linaunganisha kwa ufasaha mshale na tendo lake katika lugha ya kishairi.
- source_word: יוֹמָם
  choice: mchana
  rationale: Kielezi hiki humaanisha wakati wa mchana; ‘mchana’ ni usemi wa kawaida na huunda tofauti wazi na ‘usiku.’
- source_word: מִן ... מִן
  choice: — ... wala
  rationale: Baada ya kitenzi ‘kuogopa,’ Kiswahili hakihitaji kutafsiri מִן kwa kihusishi tofauti. Kiunganishi ‘wala’ huonyesha kwa kawaida uratibu hasi wa vitisho viwili.
theological_decisions:
- issue: Kutafsiri mstari kama amri au ahadi
  choice: 'Uhakikisho/ahadi: ‘Hutaogopa’'
  alternative: 'Amri: ‘Usiogope’'
  rationale: לֹא pamoja na imperfect katika muktadha huu wa kishairi inaelekea kutoa uhakikisho kuhusu mtu anayelindwa. Tafsiri hii haibadili kimya kimya umbo hilo kuwa katazo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Urukao’ ni umbo la kifasihi linaloeleweka; ‘hofu kuu’ huepuka neno lisilo la kawaida huku ikihifadhi nguvu ya פַּחַד. Alama zote za tanbihi zimo katika maandishi makuu.
