  terminology: “Hofu ya usiku” renders פַּחַד without adding intensity, while the footnote “kitisho cha usiku” supplies a legitimate alternative emphasizing the threatening sense. The assurance footnote correctly distinguishes “Huna haja ya kuogopa” from the main future-like promise.
