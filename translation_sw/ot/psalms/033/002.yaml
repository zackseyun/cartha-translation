  text: Mshukuruni Yahwe kwa kinubi; mpigieni muziki kwa zeze la nyuzi kumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa nebel ya nyuzi kumi.” Utambulisho kamili wa ala hii ya kale haujulikani; hutafsiriwa kwa namna mbalimbali kuwa kinubi, zeze, au ala nyingine yenye nyuzi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Mshukuruni
  rationale: Amri ya wingi ya ידה katika muktadha wa ibada humaanisha kumshukuru au kumsifu Mungu; “Mshukuruni” huhifadhi maana yake ya kawaida ya kiliturujia.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa moja kwa moja kuwa “Yahwe,” badala ya kubadilishwa na cheo.
- source_word: בְּכִנּוֹר
  choice: kwa kinubi
  rationale: כִּנּוֹר ni ala ya kale yenye nyuzi, kwa kawaida ikitambuliwa kuwa aina ya kinubi; neno hili linatoa tafsiri fupi na inayoeleweka.
- source_word: בְּנֵבֶל עָשׂוֹר
  choice: kwa kinanda cha nyuzi kumi
  rationale: נֵבֶל ni ala nyingine ya nyuzi ambayo utambulisho wake kamili haujulikani, na עָשׂוֹר huonyesha kuwa ilikuwa na nyuzi kumi. “Kinanda” hapa ni jina pana la ala ya muziki, huku tanbihi ikihifadhi kutokuwa na uhakika kwa aina yake.
- source_word: זַמְּרוּ לוֹ
  choice: mpigieni muziki
  rationale: Katika muktadha wa ala zilizotajwa, זמר inaeleweka vizuri kuwa kupiga au kufanya muziki wa sifa kwa ajili yake; “mpigieni muziki” ni ya kawaida na inahifadhi mwelekeo wa tendo kwa Mungu.
theological_decisions:
- issue: Uwakilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יהוה moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
