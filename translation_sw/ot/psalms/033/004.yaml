  yaml_path: translation/ot/psalms/033/004.yaml
  text: For the word of Yahweh is upright[b][a], and all his work is done in faithfulness.
translation:
  language: sw
  text: 'Kwa maana neno la Yahwe ni la adili,

    na kazi yake yote ni ya uaminifu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kazi yake yote hufanywa kwa uaminifu.” Kiebrania kina kishazi kisicho na kitenzi; kinaweza kueleza kwamba kazi yake yote ina sifa ya uaminifu au hutendwa kwa uaminifu.
    reason: Kuhifadhi uwezekano wa kutafsiri kishazi cha nomino cha Kiebrania kwa kitenzi kinachoeleweka kwa Kiswahili, bila kufanya utoaji huo uwe maana pekee.
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya mwito wa kumsifu Mungu katika mstari uliotangulia, huku ikitiririka kwa kawaida katika ushairi wa Kiswahili.
- source_word: יָשָׁר
  choice: nyofu
  rationale: Neno hili lina maana ya kuwa sawa, adilifu, au bila upotovu. “Nyofu” linadumisha taswira ya unyoofu na uzito wa kimaadili wa Kiebrania.
- source_word: דְּבַר יְהוָה
  choice: neno la Yahwe
  rationale: “Neno” ni tafsiri ya kawaida na wazi ya דָּבָר hapa, likimaanisha tamko au usemi wa Mungu; jina la agano יְהוָה limetoholewa kuwa “Yahwe.”
- source_word: וְכָל מַעֲשֵׂהוּ
  choice: na kazi yake yote
  rationale: Inahifadhi nomino ya umoja yenye maana ya kijumla, ikijumuisha utendaji wote wa Yahwe.
- source_word: בֶּאֱמוּנָה
  choice: kwa uaminifu
  rationale: אֱמוּנָה hapa huonyesha uthabiti, kutegemeka, na uaminifu. “Kwa uaminifu” ni Kiswahili cha kawaida na hudumisha hali inayoandamana na kazi yake.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina la Mungu mwenyewe, YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Muundo wa kishazi וְכָל־מַעֲשֵׂהוּ בֶּאֱמוּנָה
  choice: kazi yake yote hufanywa kwa uaminifu
  alternative: kazi yake yote ni katika uaminifu
  rationale: Kiebrania hakina kitenzi kilichoandikwa katika kishazi hiki. Kitenzi “hufanywa” kimeongezwa kwa ulaini wa Kiswahili, bila kubadili wazo kwamba utendaji wote wa Yahwe una sifa ya uaminifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa kishairi, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Nyofu” limetumiwa kwa maana ya kimaadili, na mpangilio wa mistari unadumisha usambamba wa ushairi wa Kiebrania.
