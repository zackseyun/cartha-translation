base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/007.yaml
  text: He gathers the waters of the sea like a heap[b][a]; he puts the depths in storehouses.
translation:
  language: sw
  text: Huyakusanya maji ya bahari kama rundo[a]; huweka vilindi[b] katika maghala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama tuta”; wengine huelewa “kama ukuta” kwa kuzingatia taswira nyingine zinazofanana za maji.
    reason: lexical_alternative
  - marker: b
    text: Au, “maji ya kina.” Wingi wa Kiebrania unaweza kurejelea vilindi vikuu vya bahari au maji ya vilindi vya awali.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּנֵס
  choice: Huyakusanya
  rationale: Kitenzi cha Kiebrania kinaeleza kukusanya pamoja; umbo la wakati usiotimilika katika Kiswahili linadumisha nguvu ya kishairi na ya maelezo ya kitendo.
- source_word: כַּנֵּד
  choice: kama rundo
  rationale: נֵד kwa kawaida ni kitu kilichokusanywa au kurundikwa. 'Rundo' linahifadhi taswira halisi bila kuibadili kuwa maelezo ya jumla ya udhibiti.
- source_word: מֵי הַיָּם
  choice: maji ya bahari
  rationale: Huu ni uhamisho wa moja kwa moja na wa kawaida wa muundo wa Kiebrania, unaofaa katika Kiswahili sanifu.
- source_word: נֹתֵן
  choice: huyaweka
  rationale: נתן hapa ina maana pana ya kuweka au kutia. Kiambishi 'ya' kinaelekeza kwa maji ya vilindi na kufanya sentensi iwe ya kawaida kwa Kiswahili.
- source_word: בְּאֹצָרוֹת
  choice: katika ghala
  rationale: אֹצָר ni ghala, hazina, au mahali pa kuhifadhia. 'Ghala' linafikisha wazi taswira ya mahali pa kuhifadhi; umoja wa kijumla wa Kiswahili unaweza kuwakilisha wingi wa Kiebrania bila uzito usio wa lazima.
- source_word: תְּהוֹמוֹת
  choice: maji ya vilindi
  rationale: Wingi wa תְּהוֹם unaweza kumaanisha vilindi vikuu vya bahari au maji ya kina ya mwanzo. 'Maji ya vilindi' ni ya asili na yanaweka wazi kuwa kinachozungumziwa ni maji, huku yakidumisha taswira ya kina.
theological_decisions:
- issue: Taswira ya ulimwengu kuhusu enzi ya Mungu juu ya bahari
  choice: Kudumisha taswira halisi ya kishairi ya rundo na ghala
  alternative: Kutafsiri kwa ujumla kuwa Mungu huitawala bahari au huyahifadhi maji ya bahari
  rationale: Kiebrania kinaonyesha mamlaka ya Mungu kwa picha thabiti za kuyakusanya maji na kuyaweka ghalani. Kuzifanya kauli za kidhahania kungepunguza nguvu ya shairi na kuingiza ufafanuzi usio katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Ulinganifu wa 'Huyakusanya... huyaweka' unadumisha muundo wa kishairi wa vitenzi viwili vya Kiebrania.
