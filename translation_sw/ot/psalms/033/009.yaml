  yaml_path: translation/ot/psalms/033/009.yaml
  text: For he spoke[a], and it came to be; he commanded[b], and it stood firm.
translation:
  language: sw
  text: Kwa maana yeye alisema[a], ikawa; yeye aliamuru[b], ikasimama imara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “ikapata kuwako”; Kiebrania ni kifupi sana: “nayo ikawa/ikapata kuwako.”'
    reason: lexical_alternative
  - marker: b
    text: Au “ikasimama” au “ikathibitishwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza nguvu ya kisababishi ya mstari huu kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: הוּא
  choice: yeye
  rationale: Kiwakilishi huru cha Kiebrania kina mkazo; kurudia “yeye” katika mistari sambamba kunauhifadhi bila kufanya sentensi kuwa nzito.
- source_word: אָמַר
  choice: alisema
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya kitenzi, na inafaa katika usambamba na kuamuru.
- source_word: וַיְהִי
  choice: ikawa
  rationale: Kauli fupi inahifadhi ufupi wa Kiebrania na inaweza kumaanisha kwamba kitu kilikuwako au kilitokea kwa sababu ya neno lake.
- source_word: צִוָּה
  choice: aliamuru
  rationale: Inawakilisha moja kwa moja tendo la kutoa amri.
- source_word: וַיַּעֲמֹד
  choice: ikasimama imara
  rationale: Inahifadhi picha halisi ya kusimama huku ikionyesha uthabiti wa matokeo ya amri.
theological_decisions:
- issue: Lugha ya uumbaji au matokeo baada ya Mungu kusema
  choice: “ikawa” na “ikasimama imara”
  alternative: “ikapata kuwako” na “ikathibitishwa,” au kwa uhalisi zaidi “ikawa” na “ikasimama”
  rationale: Tafsiri hii inaonyesha ufanisi wa papo hapo na wa kudumu wa neno na amri ya Mungu bila kuongeza maelezo ya kimafundisho yasiyosemwa wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Usambamba na ufupi wa Kiebrania umehifadhiwa; “ikasimama imara” ni ya kawaida zaidi kuliko tafsiri ya neno kwa neno pekee.
