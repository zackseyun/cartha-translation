base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/012.yaml
  text: Blessed is the nation whose God is Yahweh[b][a], the people he has chosen for his inheritance.
translation:
  language: sw
  text: Heri taifa ambalo Yahwe ni Mungu wake[a], watu[b] aliowachagua kuwa urithi wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “BWANA.” Hapa Kiebrania kinatumia jina la Mungu, יהוה (YHWH); tafsiri hii hutumia umbo “Yahwe.”
    reason: divine_name
  - marker: b
    text: Mstari wa pili unaelekea hasa kwa Israeli, watu ambao Yahwe aliwachagua kuwa urithi wake; hata hivyo, Kiebrania kinadumisha usemi wa kishairi “watu.”
    reason: referent_clarification
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heri
  rationale: Katika kauli za baraka za Kiebrania, neno hili huonyesha hali njema ya mtu au kundi lililopata kibali, si hisia ya furaha tu. “Heri” ni usemi wa kawaida, wenye hadhi, katika Kiswahili cha kibiblia na cha sasa.
- source_word: הַגּוֹי
  choice: taifa
  rationale: Neno גּוֹי hapa linamaanisha jamii ya kitaifa au kikabila, likiwa sambamba kishairi na “watu.”
- source_word: אֲשֶׁר יְהוָה אֱלֹהָיו
  choice: ambalo Mungu wake ni Yahwe
  rationale: Muundo huu wa Kiswahili unaonyesha wazi kwamba Yahwe ndiye Mungu wa taifa hilo, huku ukihifadhi jina la Mungu lililo katika maandishi ya Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: הָעָם
  choice: watu
  rationale: “Watu” huhifadhi maana ya jamii yenye utambulisho wa pamoja na usambamba wa kishairi na “taifa.”
- source_word: בָּחַר
  choice: aliowachagua
  rationale: Kitenzi timilifu kinaeleza tendo la Mungu la kuchagua; muundo wa Kiswahili unaunganisha kwa kawaida “watu” na kitendo hicho bila kuondoa matokeo yake yanayoendelea.
- source_word: לְנַחֲלָה לוֹ
  choice: wawe urithi wake
  rationale: Tafsiri hii inaonyesha kwamba watu waliochaguliwa ni urithi au milki ya pekee ya Mungu. Ni ya asili katika Kiswahili na inadumisha taswira ya agano ya נַחֲלָה.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Wanaorejelewa na “taifa” na “watu”
  choice: Kudumisha maneno ya kishairi bila kuingiza “Israeli” katika mstari mkuu
  alternative: Kutaja Israeli waziwazi; kuufanya mstari useme kwa ujumla juu ya kila taifa
  rationale: Muktadha unaelekea hasa kwa Israeli, hususani katika kauli ya watu waliochaguliwa kuwa urithi wa Mungu, lakini Kiebrania chenyewe kinasema “taifa” na “watu.” Tafsiri inadumisha upeo na mkazo huo bila kuufafanua kupita kiasi.
- issue: Maana ya נַחֲלָה kuhusu uhusiano wa Mungu na watu
  choice: urithi wake
  alternative: milki yake; sehemu yake
  rationale: “Urithi” huhifadhi taswira ya kibiblia ya watu waliotengwa kuwa sehemu ya pekee ya Mungu, bila kueleza kwa namna inayofuta mvutano wa sitiari kwamba Mungu ndiye anayepokea urithi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. “Heri” hudumisha namna ya kauli ya baraka, na “wawe urithi wake” ni ya asili bila kupoteza taswira ya agano.
