lexical_decisions:
- source_word: חֶסֶד (ḥesed)
  choice: upendo wako thabiti
  rationale: Neno hili linaonyesha upendo wenye uaminifu na kudumu katika uhusiano wa agano; “upendo thabiti” ni wazi na wa asili bila kulibana kuwa rehema pekee.
- source_word: יְהוָה (YHWH)
  choice: BWANA
  rationale: Matumizi ya herufi kubwa yanadumisha desturi ya Kiswahili ya kuwakilisha jina la Mungu lililoandikwa kwa herufi nne za Kiebrania.
- source_word: יִחַלְנוּ לָךְ (yiḥalnu lakh)
  choice: tunakavyokutumaini
  rationale: Kitenzi kina maana ya kungoja kwa tumaini; katika muktadha huu “kukutumaini” huwasilisha mwelekeo wa tumaini kwa Mungu kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uhusiano wa כַּאֲשֶׁר kati ya upendo wa Mungu na tumaini la waabudu
  choice: kama tunavyokutumaini
  alternative: kwa kadiri tulivyokutumaini
  rationale: “Kama” huhifadhi ulinganisho wa maandishi bila kudai wazi kwamba upendo wa Mungu hupimwa au kustahiliwa kwa kiwango cha tumaini la binadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Ombi la “na uwe” linaakisi hali ya ombi katika יְהִי; mpangilio wa mistari unadumisha usambamba wa kishairi.
