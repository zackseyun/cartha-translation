id: PSA.33.1
reference: Psalms 33:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: רַנְּנ֣וּ צַ֭דִּיקִים בַּֽ/יהוָ֑ה לַ֝/יְשָׁרִ֗ים נָאוָ֥ה תְהִלָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/001.yaml
  text: Shout for joy in Yahweh[a], you righteous[b]; praise is fitting for the upright.
translation:
  language: sw
  text: Shangilieni[a] katika Yahwe, enyi wenye haki; sifa inawapasa wanyofu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwimbieni Yahwe kwa furaha.”
    reason: lexical_alternative
  - marker: b
    text: Au, “sifa ni nzuri kwa wanyofu,” au “sifa inawafaa wanyofu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַנְּנוּ
  choice: Shangilieni
  rationale: Kitenzi cha amri katika wingi kinaeleza furaha inayotolewa kwa sauti. “Shangilieni” ni cha asili katika Kiswahili cha sasa na kinahifadhi nguvu ya mwito wa furaha bila kuifanya lazima iwe wimbo.
- source_word: צַדִּיקִים
  choice: enyi wenye haki
  rationale: Neno hili linatumika kama mwito kwa watu wanaotambuliwa kwa haki. “Enyi wenye haki” huonyesha wazi kuwa wao ndio wanaoambiwa.
- source_word: בַּיהוָה
  choice: katika Yahwe
  rationale: Kihusishi ב kinaweza kuonyesha mazingira au msingi wa shangwe. “Katika Yahwe” kinahifadhi uhusiano huo badala ya kuufanya tu kuwa shangwe inayoelekezwa kwake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa namna ya kulitamka kama “Yahwe,” badala ya kulibadilisha kuwa cheo kama “BWANA.”
- source_word: לַיְשָׁרִים
  choice: wanyofu
  rationale: Neno linawataja watu wa unyofu, na kihusishi ל hapa kinaonyesha wale ambao sifa inawafaa au kuwapasa.
- source_word: נָאוָה
  choice: inawapasa
  rationale: Kivumishi hiki huonyesha jambo linalofaa, linalopendeza, au linalostahili. “Inawapasa” hutoa maana ya kufaa kwa lugha ya kawaida na yenye hadhi.
- source_word: תְהִלָּה
  choice: sifa
  rationale: Nomino hii inaweza kumaanisha sifa yenyewe au usemi wa kumsifu Mungu. “Sifa” haibani maana iwe wimbo pekee.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo; “Yehova” ni namna nyingine ya jadi ya kulitamka.
- issue: Maana ya ב katika בַּיהוָה
  choice: katika Yahwe
  alternative: kwa Yahwe; mbele za Yahwe
  rationale: “Katika Yahwe” huhifadhi wazo kwamba Yahwe ndiye mazingira au msingi wa shangwe. Hata hivyo, Kiebrania pia kinaweza kueleweka kuwa shangwe hiyo inaelekezwa kwa Yahwe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki chenye mtindo wa kishairi ulio wazi na wenye hadhi. “Shangilieni” linaeleweka kwa urahisi na linadumisha furaha ya sauti iliyomo katika Kiebrania; “wanyofu” linaepuka kuongeza maneno yasiyokuwamo kama “wa moyo.”
