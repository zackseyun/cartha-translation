  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye hadhi unaofaa ushairi wa Zaburi. Ulinganifu wa mistari umehifadhiwa kwa kurudia ‘haokolewi,’ huku ‘jeshi kubwa’ na ‘nguvu nyingi’ zikionyesha tofauti ya maneno ya Kiebrania.
