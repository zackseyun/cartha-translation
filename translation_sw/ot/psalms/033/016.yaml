  text: אֵֽין הַ֭/מֶּלֶךְ נוֹשָׁ֣ע בְּ/רָב חָ֑יִל גִּ֝בּ֗וֹר לֹֽא יִנָּצֵ֥ל בְּ/רָב כֹּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/016.yaml
  text: The king is not saved by a great army[b][a]; a warrior is not delivered by great strength.
translation:
  language: sw
  text: Mfalme haokolewi kwa jeshi kubwa[a]; shujaa haokolewi kwa nguvu nyingi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa wingi wa nguvu za kijeshi”; neno la Kiebrania linalotafsiriwa “jeshi” linaweza pia kumaanisha uwezo, nguvu, au rasilimali za kijeshi kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: haokolewi
  rationale: Pamoja na nomino na kitenzi-shirikishi kinachofuata, neno hili linakanusha dai kwamba mfalme huokolewa kwa njia hiyo.
- source_word: הַמֶּלֶךְ
  choice: Mfalme
  rationale: Kiarifu cha Kiebrania kipo; umoja wenye uarifu unatumiwa kutamka ukweli wa jumla.
- source_word: נוֹשָׁע
  choice: haokolewi
  rationale: Kauli ya kutendwa ya ישׁע humaanisha kuokolewa au kukombolewa; ‘haokolewi’ ni ya kawaida na huhifadhi msamiati mpana wa kibiblia.
- source_word: בְּרָב חָיִל
  choice: kwa jeshi kubwa
  rationale: בְּ hapa huonyesha njia au chombo, na חָיִל katika muktadha wa mfalme, shujaa, na nguvu inaeleweka vizuri kuwa jeshi au nguvu za kijeshi.
- source_word: גִּבּוֹר
  choice: shujaa
  rationale: Humaanisha mtu hodari au mpiganaji mwenye nguvu; ‘shujaa’ ni neno la sasa, lenye heshima, na linalofaa muktadha wa kivita.
- source_word: לֹא יִנָּצֵל
  choice: haokolewi
  rationale: Nifali ya נצל humaanisha kuokolewa, kuponyoka, au kukombolewa. Kurudia ‘haokolewi’ kunaleta ulinganifu wa kishairi ulio wazi kwa Kiswahili.
- source_word: בְּרָב כֹּחַ
  choice: kwa nguvu nyingi
  rationale: Kirai hiki huonyesha wingi wa nguvu kama njia inayodhaniwa ya kuleta wokovu; ‘nguvu nyingi’ huhifadhi muundo na maana ya Kiebrania.
