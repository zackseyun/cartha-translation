translation:
  language: sw
  text: Yeye anayefinyanga mioyo yao yote[a], anayeelewa matendo yao yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayefinyanga mioyo yao pamoja.” Neno la Kiebrania יַחַד linaweza kutafsiriwa “pamoja”; hapa linaweza pia kueleweka kuwa yeye hufinyanga mioyo ya watu wote kwa namna inayofanana.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּצֵר
  choice: anayeiumba
  rationale: Kitenzi cha wakati endelevu kinamh وصف Mungu kwa kazi yake ya kuumba; ‘anayeiumba’ ni cha asili na huhifadhi maana ya uundaji.
- source_word: יַחַד
  choice: yao wote
  rationale: Katika muktadha huu neno linaonyesha kwamba Mungu huumba moyo wa kila mmoja wao; tafsiri hii huepuka kudokeza kwamba mioyo iliumbwa kwa wakati mmoja.
- source_word: לִבָּם
  choice: mioyo yao
  rationale: Ingawa nomino ya Kiebrania iko katika umoja wenye kiambishi cha wingi, Kiswahili hutumia wingi kwa maana ya kugawanya kwa kila mtu.
- source_word: הַמֵּבִין
  choice: anayeelewa
  rationale: Huhifadhi maana ya kufahamu au kutambua kwa kina kwa lugha ya kawaida ya kisasa.
- source_word: אֶל
  choice: —
  rationale: Hufanya matendo kuwa kitu kinachoelekezewa uelewa; uhusiano huu unaonyeshwa moja kwa moja na kitenzi ‘anaelewa’ katika Kiswahili bila kutafsiri kihusishi kando.
- source_word: כָּל מַעֲשֵׂיהֶם
  choice: matendo yao yote
  rationale: ‘Matendo’ huhifadhi maana halisi ya mambo wanayofanya na inafaa kwa wazo la Mungu kuyachunguza matendo ya wanadamu.
theological_decisions:
- issue: Upeo wa wanaorejelewa katika mstari
  choice: Mungu ndiye anayeumba moyo wa kila mwanadamu na kuelewa matendo yote ya wanadamu.
  alternative: Maneno haya yanaweza kueleweka kwa upeo mwembamba zaidi kuwa yanarejelea mioyo ya wafalme au mataifa katika muktadha wa karibu.
  rationale: Mistari 13–15 hupanua upeo kwa ‘wanadamu wote’ na ‘wakazi wote wa dunia’; tafsiri haibani urejeleo kuliko maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kishairi na usambamba wa vishazi viwili umehifadhiwa.
