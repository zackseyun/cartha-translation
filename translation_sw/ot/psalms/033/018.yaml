  text: הִנֵּ֤ה עֵ֣ין יְ֭הוָה אֶל יְרֵאָ֑י/ו לַֽ/מְיַחֲלִ֥ים לְ/חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/018.yaml
  text: Behold[a], the eye of Yahweh is on those who fear him, on those who wait for his steadfast love,
translation:
  language: sw
  text: 'Tazama, jicho la Yahweh liko juu ya wale wanaomcha,

    juu ya wale wanaotumaini fadhili zake.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Kihisishi hiki huvuta fikira na kutia mkazo; “Tazama” kinahifadhi nguvu yake ya kishairi kwa Kiswahili cha sasa.
- source_word: עֵין
  choice: jicho
  rationale: Neno halisi “jicho” linahifadhi sitiari ya kibinadamu inayoonyesha uangalizi makini wa Mungu bila kuifafanua kupita kiasi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo, na tahajia “Yahwe” inafaa matamshi na uandishi wa Kiswahili.
- source_word: אֶל
  choice: liko juu ya
  rationale: Pamoja na “jicho,” kihusishi hiki kinaonyesha kwamba uangalizi wa Yahwe umeelekezwa kwa watu hawa; “liko juu ya” hudumisha taswira ya asili na ni msemo unaoeleweka.
- source_word: יְרֵאָיו
  choice: wale wanaomcha
  rationale: Huhifadhi maana ya watu wenye sifa ya kumcha Yahwe, ikijumuisha hofu yenye heshima bila kuipunguza kuwa heshima pekee.
- source_word: לַמְיַחֲלִים
  choice: wale wanaoitumainia
  rationale: Kitenzi יחל kina wazo la kutumaini na kungoja kwa matarajio. “Kuitumainia” ni cha asili pamoja na fadhili kama kiambajengo chake, huku tanbihi ikihifadhi maana ya kungoja.
- source_word: לְחַסְדּוֹ
  choice: fadhili zake
  rationale: “Fadhili” linaweza kubeba wema, rehema, na upendo mwaminifu wa חֶסֶד bila kulifinya kuwa huruma peke yake; kiambishi ל kimeeleweka pamoja na kitenzi kama kitu kinachotumainiwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha na cheo.
- issue: Uwasilishaji wa חֶסֶד
  choice: fadhili zake
  alternative: rehema zake; upendo wake mwaminifu
  rationale: “Fadhili” ni neno la kawaida na lenye hadhi linalojumuisha wema wa Mungu wenye uaminifu. “Rehema” peke yake ingesisitiza huruma kwa namna finyu, na “upendo mwaminifu” ingefafanua zaidi ya neno moja la Kiebrania.
- issue: Maana ya יחל
  choice: wanaoitumainia
  alternative: wanaozingoja; wanaozitumainia huku wakingoja
  rationale: Kiebrania kinaweza kumaanisha kutumaini au kungoja kwa matarajio. Matini kuu imetumia “kutumainia,” na tanbihi inadumisha uwezekano wa “kungoja” bila kuondoa mvutano huo wa kimaana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini wazi kwa msomaji wa kawaida. Mpangilio sambamba wa mistari ya Kiebrania umehifadhiwa; “jicho” na “kumcha” zimeachwa kama taswira na msamiati wa kibiblia unaoeleweka.
