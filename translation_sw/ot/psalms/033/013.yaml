  text: From heaven Yahweh looks[a]; he sees all the sons of man.
translation:
  language: sw
  text: Kutoka mbinguni Yahwe hutazama; huwaona wanadamu wote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “wana wa binadamu”; usemi wa kishairi unaomaanisha wanadamu wote.
    reason: Nahau ya Kiebrania imetafsiriwa kwa maana yake ya kawaida, huku muundo wake halisi ukionyeshwa hapa.
lexical_decisions:
- source_word: מִשָּׁמַיִם
  choice: Kutoka mbinguni
  rationale: Kiambishi מִן kinaonyesha mahali mtazamo unakotoka, na “kutoka mbinguni” ni usemi wa kawaida wa Kiswahili unaohifadhi taswira ya mahali pa juu.
- source_word: הִבִּיט
  choice: hutazama
  rationale: Hifili ya נבט ina maana ya kuelekeza macho au kutazama kwa makusudi. Wakati wa mazoea wenye hu- unaonyesha ukweli wa jumla unaoelezwa katika ushairi huu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo; tahajia “Yahwe” ni ya kawaida na inayosomeka kwa Kiswahili.
- source_word: רָאָה
  choice: huwaona
  rationale: ראה ni kitenzi cha kawaida cha kuona. Umbo hili linaendeleza kauli ya ukweli wa jumla na pia linaonyesha kwamba kiambishi -wa- kinawarejelea wanadamu.
- source_word: כָּל בְּנֵי הָאָדָם
  choice: wanadamu wote
  rationale: “Wanadamu” ni tafsiri ya asili na jumuishi ya nahau ya Kiebrania inayomaanisha jamii yote ya binadamu; “wote” inahifadhi maana ya כָּל. Muundo wa karibu zaidi na maneno ya Kiebrania umeelezwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia Tetragramatoni kama jina binafsi la Mungu. “Yahwe” hulihifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Maana ya בְּנֵי הָאָדָם
  choice: wanadamu
  alternative: wana wa binadamu
  rationale: Katika Kiebrania huu ni usemi wa kishairi unaowarejelea watu wote, si wanaume pekee wala ukoo maalumu. “Wanadamu” huwasilisha maana hiyo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi umbo halisi la nahau.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko mfupi wa kishairi. Vitenzi vya hu- vinaonyesha tendo la kawaida na ukweli unaodumu; “wanadamu” ni neno la kawaida, lenye heshima, na jumuishi.
