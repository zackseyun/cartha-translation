  text: Farasi ni tumaini la uongo kwa ajili ya ukombozi[a], na kwa wingi wa nguvu zake hawezi kuokoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “wokovu” au “ushindi.” Kwa karibu zaidi: “Farasi ni udanganyifu kwa ajili ya ukombozi”; yaani, farasi huthibitika kuwa tegemeo la udanganyifu kama njia ya kuokoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: tumaini la uongo
  rationale: Nomino hii humaanisha uongo au udanganyifu. Katika muundo huu, usemi unaonyesha kwamba kutegemea farasi kama njia ya kuokoka ni tumaini linalodanganya.
- source_word: הַסּוּס
  choice: farasi
  rationale: Ingawa Kiebrania kina kibainishi, hapa farasi mmoja anawakilisha kundi lote kwa namna ya methali; Kiswahili hutumia nomino bila kibainishi kwa maana hii ya jumla.
- source_word: לִתְשׁוּעָה
  choice: la kupata wokovu
  rationale: תְּשׁוּעָה inaweza kumaanisha wokovu, ukombozi, au ushindi. Katika mazingira ya kijeshi hapa ni kuokolewa kutoka hatarini; neno 'wokovu' linahifadhi upana wa neno la Kiebrania, huku tanbihi ikieleza mbadala.
- source_word: וּבְרֹב חֵילוֹ
  choice: wala kwa nguvu zake nyingi
  rationale: רֹב hueleza wingi au ukubwa, na חַיִל hapa hufaa kueleweka kuwa nguvu za farasi. 'Kwa nguvu zake nyingi' huhifadhi muundo na maana ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: לֹא יְמַלֵּט
  choice: haiwezi kuokoa
  rationale: Piel ya מלט humaanisha kuokoa au kuponya kutoka hatarini. Ingawa לֹא ni ukanushi wa moja kwa moja, katika kauli hii ya hekima unaonyesha kutoweza kwa farasi kuwaokoa wanaoitegemea.
theological_decisions:
- issue: Maana ya תְּשׁוּעָה katika muktadha wa kijeshi
  choice: wokovu
  alternative: ukombozi au ushindi
  rationale: Neno la Kiebrania lina wigo huu wote. 'Wokovu' huhifadhi neno pana bila kulifanya liwe ushindi wa kijeshi pekee, na tanbihi inalinda uwezekano wa tafsiri nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Muundo wa kimethali umehifadhiwa, na 'wala' huunganisha vipashio sambamba kwa ulaini.
