lexical_decisions:
- source_word: לְהַצִּיל
  choice: kuokoa
  rationale: Kitenzi hiki katika hali ya Hifili kina maana ya kumwezesha mtu aepuke hatari au kumwokoa. “Kuokoa” ni cha kawaida na kinafaa pamoja na “na kifo.”
- source_word: מִמָּוֶת
  choice: na kifo
  rationale: Kihusishi מִן kinaonyesha kutenganishwa au kuondolewa katika hatari; Kiswahili cha kawaida hutumia “kuokoa ... na kifo.”
- source_word: נַפְשָׁם
  choice: nafsi zao
  rationale: נֶפֶשׁ inaweza kumaanisha nafsi, mtu mwenyewe, au uhai. “Nafsi zao” inadumisha upana huo wa maana, huku wingi wa Kiswahili ukipatana kwa kawaida na watu wengi wanaorejelewa.
- source_word: וּלְחַיּוֹתָם
  choice: na kuwahifadhi hai
  rationale: Kitenzi חיה hapa kina maana ya kudumisha au kuhifadhi uhai. “Kuwahifadhi hai” kinaeleza wazi ulinzi unaoendelea bila kuongeza namna ambavyo unafanywa.
- source_word: בָּרָעָב
  choice: wakati wa njaa
  rationale: רָעָב hapa inaelekea kumaanisha hali ya njaa kubwa au ukosefu wa chakula, si hisia ya kuwa na njaa tu. “Wakati wa njaa” ni Kiswahili cha asili kinachoonyesha mazingira hayo.
theological_decisions:
- issue: Upana wa maana ya נֶפֶשׁ
  choice: nafsi zao
  alternative: uhai wao / maisha yao
  rationale: Maandishi yanaweza kurejelea nafsi, watu wenyewe, au uhai wao. Tafsiri kuu inahifadhi neno lenye upana wa maana, na tanbihi inaonyesha maana mbadala inayofaa katika muktadha wa kuokolewa na kifo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Kauli “wakati wa njaa” imetumiwa badala ya tafsiri ngumu zaidi ya kihalisi, na “kuwahifadhi hai” inadumisha maana ya kuendeleza uhai.
