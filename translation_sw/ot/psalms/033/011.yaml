base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/011.yaml
  text: The counsel of Yahweh stands forever[a], the plans of his heart from generation to generation.
translation:
  language: sw
  text: Shauri la Yahwe litasimama milele[a]; mawazo ya moyo wake yatadumu kizazi baada ya kizazi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kusudi” badala ya “shauri”; “mawazo” yanaweza pia kumaanisha “mipango” au “makusudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  choice: shauri
  rationale: Neno hili linaweza kumaanisha shauri, mpango, au kusudi. “Shauri” linadumisha maana ya uamuzi uliokusudiwa na pia linalingana vizuri na “mawazo” katika mstari wa pili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limewasilishwa kwa unukuzi wa Kiswahili “Yahwe,” badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: לְעוֹלָם
  choice: milele
  rationale: Linaonyesha kudumu bila mwisho; “milele” ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: תַּעֲמֹד
  choice: litasimama
  rationale: Kauli isiyotimilika ya Kiebrania inaeleza ukweli wa kudumu. Wakati ujao wa Kiswahili unaonyesha kwamba shauri hilo litaendelea kuwa imara.
- source_word: מַחְשְׁבוֹת
  choice: mawazo
  rationale: Neno hili linaweza kumaanisha mawazo, mipango, au makusudi. “Mawazo” huhifadhi sitiari ya Kiebrania ya moyo kama kitovu cha fikira na nia bila kuibana maana kuwa mipango pekee.
- source_word: לִבּוֹ
  choice: moyo wake
  rationale: Tafsiri ya moja kwa moja huhifadhi namna ya Kiebrania ya kuueleza moyo kama kitovu cha fikira, mapenzi, na nia.
- source_word: לְדֹר וָדֹר
  choice: kizazi baada ya kizazi
  rationale: Usemi huu wa asili unaonyesha mwendelezo kupitia vizazi vinavyofuatana; tungo ya Kiswahili ni ya asili na wazi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova au BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu. “Yahwe” hulihifadhi jina hilo kwa umbo linalofaa tahajia ya Kiswahili, badala ya kulibadilisha na cheo.
- issue: Uhusiano kati ya shauri na mawazo ya moyo
  choice: Kudumisha ulinganifu bila kuyafanya maneno yote mawili kuwa “mipango”
  alternative: “Kusudi ... mipango”
  rationale: Kiebrania kinatumia maneno mawili yenye nyanja za maana zinazokaribiana lakini si sawa kabisa. “Shauri” na “mawazo” huhifadhi tofauti hiyo na mvutano wa kishairi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Ulinganifu wa kishairi umehifadhiwa, na alama ya tanbihi [a] imewekwa mara baada ya “milele.”
