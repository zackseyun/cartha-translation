base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/006.yaml
  text: By the word of Yahweh the heavens were made[a], and by the breath of his mouth all their host.
translation:
  language: sw
  text: Kwa neno la Yahwe mbingu zilifanywa, na kwa pumzi[a] ya kinywa chake jeshi lote la mbingu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kwa roho ya kinywa chake jeshi lote la mbingu.” Neno la Kiebrania linaweza kumaanisha “pumzi,” “upepo,” au “roho.”
    reason: alternative_reading
lexical_decisions:
- source_word: בִּ/דְבַר
  choice: Kwa neno la
  rationale: Kiambishi ב kinaonyesha njia au chombo; “kwa neno la” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: שָׁמַיִם
  choice: mbingu
  rationale: Huhifadhi maana ya wingi na muktadha mpana wa uumbaji, si anga linaloonekana pekee.
- source_word: נַעֲשׂוּ
  choice: zilifanywa
  rationale: Ni tafsiri ya moja kwa moja ya עשה; haiongezi maana mahsusi zaidi ya “kuumba” inayohusishwa na kitenzi kingine cha Kiebrania.
- source_word: וּ/בְ/ר֥וּחַ
  choice: na kwa pumzi ya
  rationale: Katika usambamba na “kinywa chake,” “pumzi” inafaa zaidi kwa picha ya kishairi, huku uwezekano wa “roho” ukihifadhiwa katika tanbihi.
- source_word: פִּי/ו
  choice: kinywa chake
  rationale: Huhifadhi taswira ya kishairi na usambamba kati ya neno na pumzi.
- source_word: כָּל
  choice: lote
  rationale: Huonyesha ujumla wa jeshi lote linalotajwa.
- source_word: צְבָאָ/ם
  choice: jeshi lake
  rationale: צָבָא hapa ni mkusanyiko wa vitu vya mbinguni. Kiwakilishi cha umilikaji cha umoja kinakubaliana kimaumbile na nomino ya Kiswahili “mbingu,” ingawa chanzo cha Kiebrania kina kiambishi kinachorejelea mbingu.
theological_decisions:
- issue: Maana ya רוּחַ katika uumbaji na uwezekano wa mwangwi wa Utatu
  choice: pumzi
  alternative: roho
  rationale: Usambamba wa karibu kati ya “neno la Yahwe” na “pumzi ya kinywa chake” unapendelea “pumzi.” Hata hivyo, kwa kuwa רוּחַ pia inaweza kumaanisha “roho,” maana hiyo haijaondolewa bali imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. “Jeshi lake lote” huhifadhi sitiari ya Kiebrania ya jeshi la mbinguni; tanbihi imewekwa baada ya sentensi kwa sababu inahusu kishazi cha pili.
