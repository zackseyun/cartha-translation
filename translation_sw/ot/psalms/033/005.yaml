id: PSA.33.5
reference: Psalms 33:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֹ֭הֵב צְדָקָ֣ה וּ/מִשְׁפָּ֑ט חֶ֥סֶד יְ֝הוָ֗ה מָלְאָ֥ה הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/005.yaml
  text: He loves righteousness and justice[a]; the earth is full of the steadfast love of Yahweh.
translation:
  language: sw
  text: 'Anapenda uadilifu na haki;

    dunia imejaa upendo thabiti wa Yahwe.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upendo mwaminifu.” Neno la Kiebrania חֶסֶד linahusisha upendo wenye uaminifu na udumifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: Anapenda
  rationale: Kivumishi-tendo cha Qal, umoja wa kiume, kinaeleza tabia ya kudumu ya Yahwe; kitenzi cha wakati wa sasa ni cha kawaida na cha asili katika Kiswahili.
- source_word: צְדָקָה
  choice: uadilifu
  rationale: Katika jozi na מִשְׁפָּט, neno hili linaashiria unyoofu au hali ya kuwa sawa, bila kurudia maana ya haki ya hukumu.
- source_word: מִשְׁפָּט
  choice: haki
  rationale: Hapa linaeleza haki na utaratibu wa haki kwa maana pana ya kimaadili; ‘haki’ ni neno la kawaida na linaendana vizuri na ‘uadilifu’.
- source_word: חֶסֶד
  choice: upendo thabiti
  rationale: Tafsiri hii inabeba wazo la upendo wenye kudumu na uaminifu, bila kutumia istilahi nzito ya kidini.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo; umbo ‘Yahwe’ linafuata tahajia ya kawaida ya Kiswahili.
- source_word: מָלְאָה
  choice: imejaa
  rationale: Ingawa kimaumbo ni kauli timilifu ya nafsi ya tatu, umoja wa kike, hapa ina maana ya hali ya sasa inayotokana na kujazwa; ‘imejaa’ ni ya asili katika Kiswahili.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: Muktadha wa ulimwengu mzima katika zaburi unaunga mkono ‘dunia’ kuliko ‘nchi’.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; kulitaja kama ‘Yahwe’ huhifadhi jina hilo badala ya kuliweka kwa cheo.
- issue: Maana ya חֶסֶד
  choice: upendo thabiti
  alternative: upendo mwaminifu
  rationale: ‘Upendo thabiti’ huhifadhi vipengele vya upendo na udumifu; tanbihi inatoa ‘upendo mwaminifu’ ili kuonyesha pia uaminifu wa uhusiano unaobebwa na neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mistari miwili inadumisha usambamba wa kishairi wa Kiebrania; msamiati ni rahisi kueleweka huku tofauti kati ya ‘uadilifu’ na ‘haki’ ikihifadhiwa.
