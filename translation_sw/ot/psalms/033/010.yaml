lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Limedumisha jina la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadili kuwa cheo; umbo hili linafuata matamshi ya kawaida ya Kiswahili.
- source_word: הֵפִיר
  choice: huyabatilisha
  rationale: Hifili ya פרר hapa ina maana ya kufanya mashauri yakose nguvu au yasifanikiwe; ‘huyabatilisha’ ni ya asili na yenye uzito katika Kiswahili.
- source_word: עֲצַת
  choice: mashauri
  rationale: Neno linaweza kumaanisha shauri, mpango, au kusudi. Wingi ‘mashauri’ unafaa kwa maamuzi ya mataifa na unadumisha tofauti na ‘makusudi’ katika mstari sambamba.
- source_word: גּוֹיִם
  choice: mataifa
  rationale: Katika muktadha huu neno linarejelea mataifa kwa upana, si lazima watu wasio Wayahudi pekee.
- source_word: הֵנִיא
  choice: huyazuia yasitimie
  rationale: Kitenzi kinaonyesha kuzuia au kugeuza jambo lisifikie lengo lake; kirai hiki kinaeleza nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: מַחְשְׁבוֹת
  choice: makusudi
  rationale: Ingawa linaweza kumaanisha mawazo, hapa usambamba wake na עֲצַת unaonyesha mipango au nia zilizokusudiwa kutekelezwa.
- source_word: עַמִּים
  choice: jamii za watu
  rationale: Uchaguzi huu unatofautisha עַמִּים na גּוֹיִם (‘mataifa’) na kuonyesha vikundi vya watu katika wingi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. ‘Yahwe’ hulihifadhi kwa umbo linalosomeka kwa Kiswahili, bila kutatua kwa uhakika zaidi suala la matamshi ya kale.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usambamba wa kishairi umehifadhiwa kwa ‘mashauri ya mataifa’ na ‘makusudi ya jamii za watu’; vitenzi vya mazoea ‘huyabatilisha/huyazuia’ vinaakisi maumbo ya Kiebrania.
