  text: Yahwe[a] huyabatilisha mashauri ya mataifa; huyazuia makusudi ya jamii za watu yasitimie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania YHWH; jina hili pia huandikwa “Yehova.”
