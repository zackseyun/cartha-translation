lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi cha kwanza kinatoa sababu ya kauli iliyotangulia na kudumisha mtiririko wa kishairi.
- source_word: בּוֹ
  choice: ndani yake
  rationale: Kiwakilishi cha kiume umoja kinamrejelea BWANA katika muktadha; usemi huu pia unaendana kiasili na kitenzi ‘kushangilia’ katika Kiswahili.
- source_word: יִשְׂמַח
  choice: unashangilia
  rationale: Kauli isiyotimilika ya Kiebrania inaweza kueleza hali ya sasa yenye kuendelea au wakati ujao wenye uhakika; tafsiri ya sasa inafaa ungamo la zaburi huku mbadala ukiwekwa katika tanbihi.
- source_word: לִבֵּנוּ
  choice: moyo wetu
  rationale: Umoja wa Kiebrania wenye kiambishi cha wingi umehifadhiwa kama usemi wa pamoja kuhusu maisha ya ndani ya watu.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi cha pili kinaonyesha wazi msingi wa kushangilia.
- source_word: בְשֵׁם
  choice: jina ... tumelitumainia
  rationale: Pamoja na בטח, kihusishi kinaonyesha kitu ambacho tumaini linawekwa kwake; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: קָדְשׁוֹ
  choice: lake takatifu
  rationale: ‘Takatifu’ linaonyesha utakatifu wa jina bila kuongeza maana isiyokuwamo katika chanzo.
- source_word: בָטָחְנוּ
  choice: tumelitumainia
  rationale: Wakati timilifu unaonyesha tendo lililofanywa lenye athari inayoendelea sasa; kauli timilifu ya Kiswahili inahifadhi nguvu hiyo.
theological_decisions:
- issue: Mrejelewa wa viwakilishi vya kiume umoja katika בּוֹ na קָדְשׁוֹ
  choice: Vinamrejelea BWANA anayetajwa katika muktadha wa karibu.
  alternative: Vichukuliwe kuwa vinamrejelea Mungu kwa ujumla bila uhusiano dhahiri na jina la agano.
  rationale: Muktadha unaozunguka unamtaja BWANA mara kwa mara. Hata hivyo, kwa kuwa mstari wenyewe hautaji jina la Mungu waziwazi, tafsiri haijaingiza ‘BWANA’ bali imedumisha ‘yake’ na ‘lake.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Umoja ‘moyo wetu’ umehifadhiwa kwa uaminifu kwa usemi wa Kiebrania; ‘unashangilia’ ni rahisi kueleweka na linafaa lugha ya zaburi.
