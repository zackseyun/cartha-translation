  text: For our heart rejoices in him[b][a], because we have trusted in his holy name.
translation:
  language: sw
  text: Kwa maana moyo wetu hufurahi katika yeye[b][a], kwa sababu tumelitumainia jina lake takatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana moyo wetu utafurahi katika yeye,” ikiwa kauli ya Kiebrania inachukuliwa kuwa ya wakati ujao badala ya hali ya sasa yenye kuendelea.
    reason: lexical_alternative
