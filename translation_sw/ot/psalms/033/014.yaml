base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/014.yaml
  text: From the place of his dwelling he looks out on all the inhabitants of the earth[a][b].
translation:
  language: sw
  text: Kutoka mahali pa makao yake, anawatazama kwa makini wakazi wote wa dunia[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anawaangalia” au “anawatazama.” Kitenzi cha Kiebrania kina wazo la kutazama kwa makini.
    reason: lexical_alternative
  - marker: b
    text: Au, “nchi,” ikiwa neno hili linaeleweka kwa maana ya eneo fulani; hapa “dunia” imependekezwa kwa sababu muktadha unahusu watu wote.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמְּכוֹן
  choice: Kutoka mahali
  rationale: מָכוֹן humaanisha mahali palipowekwa au makao thabiti; “mahali” ni ya asili katika Kiswahili na inaungana vizuri na “anapoishi.”
- source_word: שִׁבְתּוֹ
  choice: anapoishi
  rationale: Neno hili, lenye kiambishi cha nafsi ya tatu, lina maana ya makao yake au mahali anapokaa; kishazi hiki kinatoa maana ya mahali kwa Kiswahili cha kawaida.
- source_word: הִשְׁגִּיחַ
  choice: huwatazama kwa makini
  rationale: Hifili ya שׁגח ina wazo la kutazama, kuangalia kwa makini, au kuangalia kutoka juu. Tafsiri hii inadokeza uangalizi wenye makusudi bila kuongeza maana ya kimadhehebu.
- source_word: אֶל
  choice: -wa-
  rationale: Kihusishi cha Kiebrania kinachoelekeza tendo kwa kitu kinachotazamwa kimewakilishwa kiasili katika kitenzi cha Kiswahili “huwatazama.”
- source_word: כָּל
  choice: wote
  rationale: כָּל ina maana jumuishi hapa na inapatana kisarufi na “wakazi.”
- source_word: יֹשְׁבֵי
  choice: wakazi
  rationale: Kivumishi-tendo hiki kilichotumiwa kama nomino humaanisha wale wanaokaa; “wakazi” ni tafsiri fupi na ya kawaida.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: Katika muktadha huu wa watu wote, הָאָרֶץ inaeleweka kwa upana kuwa dunia, ingawa inaweza pia kumaanisha nchi.
theological_decisions:
- issue: Upeo wa uangalizi wa Mungu
  choice: wakazi wote wa dunia
  alternative: wakazi wote wa nchi
  rationale: Muktadha wa zaburi unaonyesha upeo wa ulimwengu mzima. Hata hivyo, maana ya kimsingi ya הָאָרֶץ inayoweza kuwa “nchi” imehifadhiwa katika tanbihi badala ya kufutwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Huwatazama” limetumiwa kama kauli ya jumla katika ushairi, huku “kwa makini” kikihifadhi uzito wa kitenzi cha Kiebrania.
