  text: יִֽירְא֣וּ מֵ֭/יְהוָה כָּל הָ/אָ֑רֶץ מִמֶּ֥/נּוּ יָ֝ג֗וּרוּ כָּל יֹשְׁבֵ֥י תֵבֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/008.yaml
  text: Let all the earth fear Yahweh[a]; let all the inhabitants of the world stand in awe of him.
translation:
  language: sw
  text: 'Dunia yote na imche Yahweh;

    wakaaji wote wa ulimwengu na wamtetemekee.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na wamwogope.” Kitenzi cha Kiebrania kinaweza kumaanisha kuwa na hofu yenye kicho, au kutetemeka kwa hofu mbele yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִירְאוּ
  choice: na imche
  rationale: Kitenzi ירא katika muktadha huu kina nguvu ya himizo. Muundo wa Kiswahili ‘na imche’ unawasilisha hofu yenye kicho bila kuipunguza kuwa heshima tu.
- source_word: מֵיְהוָה
  choice: Yahwe
  rationale: Baada ya ירא, kihusishi מן kinaonyesha anayekuwa sababu au mlengwa wa hofu; kwa Kiswahili uhusiano huo huwasilishwa moja kwa moja kwa ‘imche Yahwe’. Jina la agano יְהוָה limetoholewa kuwa ‘Yahwe’.
- source_word: כָּל הָאָרֶץ
  choice: dunia yote
  rationale: Ulinganifu na ‘wakaaji wote wa ulimwengu’ unaonyesha kuwa אֶרֶץ hapa ni dunia nzima, si nchi fulani.
- source_word: יָגוּרוּ
  choice: na wamwogope sana
  rationale: Kitenzi גור hapa huonyesha hofu kuu au kutetemeka kwa hofu. ‘Wamwogope sana’ ni Kiswahili cha kawaida na huhifadhi uzito wa neno bila kurudia tu ‘wamche’.
- source_word: מִמֶּנּוּ
  choice: -mw-
  rationale: Kiambishi cha yambwa katika ‘wamwogope’ kinamrejelea Yahwe na kuwasilisha maana ya nahau ya מן pamoja na גור, yaani kuwa na hofu kuu kwa sababu yake.
- source_word: כָּל יֹשְׁבֵי תֵבֵל
  choice: wakaaji wote wa ulimwengu
  rationale: יֹשְׁבֵי ni wakaaji, na תֵבֵל ni ulimwengu unaokaliwa; tafsiri hii ni ya kawaida na inadumisha upeo wa watu wote.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la pekee la Mungu, kwa hiyo limetoholewa badala ya kubadilishwa kuwa cheo.
- issue: Aina ya hofu inayodaiwa katika mstari
  choice: kumcha na kumwogopa sana
  alternative: kumheshimu tu
  rationale: Vitenzi ירא na גור vina maana pana inayojumuisha kicho pamoja na hofu halisi. Tafsiri haipunguzi mvutano huo kuwa heshima isiyo na hofu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo wa himizo ‘na imche … na wamwogope’ umehifadhi ulinganifu wa mistari miwili.
