  text: נַ֭פְשֵׁ/נוּ חִכְּתָ֣ה לַֽ/יהוָ֑ה עֶזְרֵ֖/נוּ וּ/מָגִנֵּ֣/נוּ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/020.yaml
  text: Our soul waits for Yahweh[a]; he is our help and our shield.
translation:
  language: sw
  text: Nafsi yetu inamngojea Yahweh[a]; yeye ndiye msaada wetu na ngao yetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “Nafsi yetu inamngojea Yahweh.” Hapa “nafsi yetu” inaonyesha utu wote wa ndani wa jumuiya, si sehemu isiyo ya mwili tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשֵׁנוּ
  choice: Nafsi yetu
  rationale: Umoja wenye kiambishi cha nafsi ya kwanza wingi unaonyesha nafsi au utu wa ndani wa jumuiya kwa pamoja. “Nafsi yetu” huhifadhi taswira ya Kiebrania bila kuifanya nafsi kuwa sehemu isiyo ya mwili tu.
- source_word: חִכְּתָה
  choice: inamngojea
  rationale: Kitenzi חכה kina maana ya kungojea kwa matarajio. Wakati wa sasa unafaa katika ushairi huu, na kiambishi cha yambwa hum- kinaonyesha kwamba Yahweh ndiye anayengojewa.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Herufi ל inaonyesha anayelengwa na kungojea; katika Kiswahili hilo huwasilishwa kwa muundo “kumngojea Yahweh.” Jina la agano יהוה limetafsiriwa “Yahweh.”
- source_word: עֶזְרֵנוּ
  choice: msaada wetu
  rationale: עֵזֶר ni “msaada” au “auni.” Nomino dhahania “msaada wetu” huhifadhi muundo wa Kiebrania badala ya kuibadili kuwa “msaidizi wetu.”
- source_word: וּמָגִנֵּנוּ
  choice: na ngao yetu
  rationale: מָגֵן ni ngao halisi inayotumiwa hapa kama sitiari ya ulinzi; taswira hiyo inaeleweka na imehifadhiwa.
- source_word: הוּא
  choice: yeye ndiye
  rationale: Kiwakilishi huru kina mkazo katika kishazi kisicho na kitenzi. “Yeye ndiye” huonyesha mkazo huo kwa Kiswahili cha kawaida bila kuongeza wazo lisilotajwa wazi la “peke yake.”
theological_decisions:
- issue: Kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יהוה. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Umoja “nafsi yetu” umehifadhiwa kwa sababu ni taswira ya pamoja katika Kiebrania; “yeye ndiye” hutoa mkazo wa kiwakilishi הוּא.
