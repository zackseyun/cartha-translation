  yaml_path: translation/ot/psalms/033/003.yaml
  text: Sing to him a new song[a]; play skillfully with a joyful shout.
translation:
  language: sw
  text: Mwimbieni wimbo mpya; pigeni kwa ustadi kwa sauti ya shangwe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa shangwe kuu” au “kwa mlio wa tarumbeta.” Neno la Kiebrania תְּרוּעָה linaweza kumaanisha kilio cha furaha, mwangwi wa shangwe kubwa, au, katika miktadha mingine, mlio wa tarumbeta.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Mwimbieni
  rationale: Ni amri ya wingi ya kitenzi cha kawaida cha kuimba; kiambishi -ni kinaonyesha wingi, na -m- kinaelekeza wimbo kwake.
- source_word: לוֹ
  choice: -m- katika “Mwimbieni”
  rationale: Kihusishi chenye kiwakilishi cha nafsi ya tatu ya kiume kinaonyesha anayeelekezewa wimbo. Kiswahili cha kawaida huwasilisha maana hiyo kwa kiambishi cha mtendewa ndani ya kitenzi.
- source_word: שִׁיר חָדָשׁ
  choice: wimbo mpya
  rationale: Tafsiri ya moja kwa moja inayohifadhi usemi wa kawaida wa kishairi na kiliturujia katika Zaburi.
- source_word: הֵיטִיבוּ
  choice: kwa ustadi
  rationale: Katika muundo huu, kitenzi hicho kinaeleza namna nzuri au stadi ya kupiga ala; “kwa ustadi” huwasilisha nguvu yake ya kielezi kwa Kiswahili cha asili.
- source_word: נַגֵּן
  choice: pigeni
  rationale: Kitenzi hiki hutumiwa hasa kwa kupiga ala za muziki, hususan za nyuzi. Katika muktadha wa muziki, “pigeni” ni fupi na ya kawaida.
- source_word: בִּתְרוּעָה
  choice: huku mkipaza sauti ya shangwe
  rationale: Neno linaweza kumaanisha kilio kikubwa cha furaha, shangwe ya sauti, au mlio unaofanana na wa tarumbeta. Chaguo hili linafaa muktadha wa sifa na kuhifadhi hali yake ya kusikika na kusherehekea.
theological_decisions:
- issue: Anayerejelewa na kiwakilishi katika לוֹ
  choice: Kiwakilishi kinamrejelea Mungu kama anayeelekezewa sifa.
  alternative: Kutaja jina “BWANA” moja kwa moja katika mstari huu.
  rationale: Muktadha wa karibu unaonyesha kwamba Mungu ndiye anayesifiwa, lakini maandishi ya mstari huu yana kiwakilishi tu; kwa hiyo tafsiri inahifadhi kiwakilishi badala ya kuongeza jina.
- issue: Uhusiano wa בִּתְרוּעָה na upigaji wa muziki
  choice: “huku mkipaza sauti ya shangwe” linaonyesha shangwe inayoandamana na upigaji.
  alternative: “kwa mlio wa tarumbeta,” ambalo lingeifanya iwe sauti ya ala maalumu.
  rationale: Kiebrania hakibainishi kwa lazima ala maalumu. Tafsiri kuu inadumisha maana pana ya shangwe ya sauti, huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mwimbieni” ni la kawaida na linaunganisha kwa ufasaha tendo la kuimba na anayeelekezewa wimbo. “Pigeni” linaeleweka kimuziki kutokana na muktadha, huku “kwa ustadi” likiepuka usemi mzito wa neno kwa neno.
