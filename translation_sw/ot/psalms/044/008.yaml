id: PSA.44.8
reference: Psalms 44:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בֵּֽ֭/אלֹהִים הִלַּלְ֣נוּ כָל הַ/יּ֑וֹם וְ/שִׁמְ/ךָ֓ לְ/עוֹלָ֖ם נוֹדֶ֣ה סֶֽלָה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/008.yaml
  text: In God we boast all day long[a], and we will give thanks to your name forever[b]. Selah
translation:
  language: sw
  text: Katika Mungu tunajisifu mchana kutwa[a], na tutalishukuru jina lako milele[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tunamsifu Mungu mchana kutwa” au “tunajivunia Mungu mchana kutwa.” Kitenzi cha Kiebrania kinaweza kumaanisha kusifu au kujisifu kwa furaha, kutegemea muktadha.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “jina lako,” usemi wa kibiblia unaorejelea tabia na sifa za Mungu zilizofunuliwa.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Katika Mungu
  rationale: Kihusishi ב hapa kinaonyesha msingi au anayelengwa na kujisifu; “katika Mungu” kinahifadhi muundo na maana ya kumfanya Mungu kuwa sababu ya fahari.
- source_word: הִלַּלְנוּ
  choice: tunajisifu
  rationale: Katika muundo huu pamoja na בֵּאלֹהִים, piel ya הלל inaweza kumaanisha kujisifu au kufurahia kwa fahari, ingawa maana ya “kusifu” pia inawezekana.
- source_word: כָל הַיּוֹם
  choice: mchana kutwa
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha muda wote wa siku bila kuugeuza kuwa dhana pana zaidi ya “daima.”
- source_word: וְשִׁמְךָ
  choice: na ... jina lako
  rationale: Jina la Mungu ndilo linalolengwa na tendo la kushukuru; mpangilio wa Kiswahili unahitaji kiambishi-yambwa katika kitenzi.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Neno hili linaonyesha muda usio na mwisho na “milele” ni tafsiri ya kawaida, wazi, na yenye hadhi.
- source_word: נוֹדֶה
  choice: tutalishukuru
  rationale: Hiphil ya ידה hapa ina maana ya kutoa shukrani au sifa. Wakati ujao unahifadhi tamko la Kiebrania, na “kushukuru” hutofautisha wazo hili na kishazi cha kwanza.
- source_word: סֶלָה
  choice: Sela
  rationale: Maana kamili ya alama hii ya kiliturujia haijulikani; imetoholewa badala ya kutafsiriwa kwa kukisia.
theological_decisions:
- issue: Maana ya kujisifu katika Mungu
  choice: Katika Mungu tunajisifu
  alternative: Tunamsifu Mungu
  rationale: 'Tafsiri iliyochaguliwa inahifadhi mvutano wa maana wa הלל pamoja na ב: inaweza kuwa kujivunia/kufurahia Mungu kwa fahari, huku uwezekano wa “kusifu” ukielezwa katika tanbihi bila kuufuta.'
- issue: “Jina” la Mungu
  choice: tutalishukuru jina lako
  alternative: tutakushukuru
  rationale: Kutaja “jina lako” kunadumisha lugha halisi ya mstari na wazo la kibiblia la tabia na sifa za Mungu zilizofunuliwa, badala ya kulirahisisha kimya kimya kuwa kiwakilishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mchana kutwa” ni usemi unaoeleweka kwa urahisi; “Sela” imehifadhiwa kama alama ya kiliturujia isiyo na maana hakika.
