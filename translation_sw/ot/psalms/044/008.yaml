  source_fidelity: 'Tafsiri inadumisha muundo na maana kuu ya Kiebrania: בֵּאלֹהִים inaonyeshwa kwa “Katika Mungu,” הִלַּלְנוּ kwa “tunajisifu,” כָל־הַיּוֹם kwa “mchana kutwa,” na נוֹדֶה kwa “tutalishukuru.” Wakati wa sasa katika kishazi cha kwanza ni wa kawaida kwa tamko la Zaburi na haupotoshi ukamilifu wa Kiebrania. “Sela” imehifadhi kwa usahihi.'
  naturalness: Kiswahili ni sanifu, cha sasa, na chenye hadhi ya kishairi. “Katika Mungu tunajisifu” ni muundo wa kibiblia unaoeleweka na, katika muktadha huu, haumaanishi majivuno binafsi bali kujivunia Mungu. “Tunalishukuru jina lako” ni matumizi yanayokubalika na yanahifadhi yambwa halisi ya Kiebrania.
