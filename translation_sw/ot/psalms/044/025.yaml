source:
  edition: WLC
  text: כִּ֤י שָׁ֣חָה לֶ/עָפָ֣ר נַפְשֵׁ֑/נוּ דָּבְקָ֖ה לָ/אָ֣רֶץ בִּטְנֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/025.yaml
  text: For our soul has sunk down to the dust[b][a]; our belly clings to the earth.
translation:
  language: sw
  text: Kwa maana nafsi yetu imeinama hadi mavumbini[a]; tumbo letu limeng’ang’ania ardhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “imezama hadi mavumbini” au “imeshushwa chini hadi mavumbini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya ombi linalofuata katika muktadha na ni kauli ya kawaida, yenye hadhi katika Kiswahili.
- source_word: שָׁחָה
  choice: imeinama
  rationale: Kitenzi kinaweza kueleza kuinama au kushushwa chini. ‘Imeinama’ huhifadhi picha ya mkao wa kudhalilishwa bila kuifanya iwe kuzama halisi.
- source_word: לֶעָפָר
  choice: hadi mavumbini
  rationale: Huhifadhi picha ya kufikishwa chini kabisa kwenye mavumbi; ‘hadi’ huonyesha kiwango au mwelekeo wa kushuka.
- source_word: נַפְשֵׁנוּ
  choice: nafsi yetu
  rationale: נֶפֶשׁ inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. ‘Nafsi yetu’ huhifadhi upana na mvutano wa kishairi wa neno hilo.
- source_word: דָּבְקָה
  choice: limeng’ang’ania
  rationale: Hutoa picha ya kushikamana sana au kuganda kwenye kitu, na ni ya asili katika Kiswahili cha sasa.
- source_word: לָאָרֶץ
  choice: ardhi
  rationale: ‘Ardhi’ huhifadhi sajili ya kishairi na usambamba wake na mavumbi, bila kuibana maana kuwa udongo pekee.
- source_word: בִּטְנֵנוּ
  choice: tumbo letu
  rationale: Ni tafsiri ya moja kwa moja inayofaa picha ya mwili uliolala kifudifudi na kushikamana na ardhi.
theological_decisions:
- issue: Maana ya kiantropolojia ya נַפְשֵׁנוּ
  choice: nafsi yetu
  alternative: uhai wetu; sisi wenyewe
  rationale: Neno la Kiebrania linaweza kuashiria nafsi, uhai, au mtu mwenyewe. ‘Nafsi yetu’ huhifadhi lugha ya kishairi na kutolazimisha ufafanuzi mmoja wa asili ya mwanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na hadhi ya kishairi. Muundo wa usambamba na picha halisi za ‘mavumbi,’ ‘tumbo,’ na ‘ardhi’ zimehifadhiwa.
