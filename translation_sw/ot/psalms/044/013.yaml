translation:
  language: sw
  text: Umetufanya kuwa fedheha kwa majirani zetu, dhihaka na kejeli[a] kwa wale wanaotuzunguka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitu cha kuchekwa na cha kubezwa.” Nomino hizi mbili kwa pamoja zinasisitiza jinsi watu wanaowazunguka walivyowadhihaki hadharani.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: Umetufanya kuwa
  rationale: Kitenzi שׂים kina maana ya ‘kuweka’ au ‘kufanya.’ Hapa kauli ‘umetufanya kuwa’ inaonyesha kwa kawaida matokeo ya tendo lililofanywa na Mungu, anayesemeshwa moja kwa moja.
- source_word: חֶרְפָּה
  choice: fedheha
  rationale: Neno hili huonyesha aibu, shutuma, au hali ya kudharauliwa mbele ya wengine. ‘Fedheha’ ni neno la kawaida na lenye hadhi linalofaa muktadha wa maombolezo.
- source_word: לִשְׁכֵנֵינוּ
  choice: kwa majirani zetu
  rationale: 'Kiambishi ל hapa kinaonyesha uhusiano: watu wa Israeli wamekuwa fedheha machoni pa watu jirani. ‘Kwa majirani zetu’ hudumisha muundo huo kwa Kiswahili cha kawaida.'
- source_word: לַעַג
  choice: dhihaka
  rationale: לַעַג hurejelea tendo au maneno ya kumcheka mtu kwa kumdharau. ‘Dhihaka’ huwasilisha maana hiyo moja kwa moja.
- source_word: קֶלֶס
  choice: kejeli
  rationale: קֶלֶס huonyesha mzaha au maneno ya kudharau. ‘Kejeli’ linatofautisha neno hili na ‘dhihaka’ huku likidumisha usambamba na mkazo wa kishairi.
- source_word: לִסְבִיבוֹתֵינוּ
  choice: kwa wale wanaotuzunguka
  rationale: Kirai hiki kinaweza kumaanisha walio pande zote au watu wa mataifa yanayowazunguka. Tafsiri hii ni ya asili na inaacha rejeo hilo likiwa pana kama lilivyo katika Kiebrania.
