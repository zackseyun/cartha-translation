  text: Kwa nini unaficha uso wako na kusahau mateso yetu na kuonewa kwetu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwepo wako.” Kiebrania kinasema kihalisi “uso wako,” usemi wa kawaida unaomaanisha uangalifu wenye fadhili au ukaribu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Kwa nini
  rationale: Ni swali la moja kwa moja kuhusu sababu, nalo linadumisha sauti ya maombolezo.
- source_word: פָנֶיךָ
  choice: uso wako
  rationale: Tafsiri halisi inayohifadhi taswira ya kishairi ya Kiebrania; hapa uso wa Mungu unaashiria uwepo au uangalifu wake wenye fadhili.
- source_word: תַסְתִּיר
  choice: unauficha
  rationale: Kitenzi hiki humaanisha kuficha; muundo huu unasikika kwa kawaida pamoja na ‘uso wako’.
- source_word: תִּשְׁכַּח
  choice: kusahau
  rationale: Inahifadhi maana ya moja kwa moja na ujasiri wa maombolezo, badala ya kuilegeza kuwa ‘kupuuza.’
- source_word: עָנְיֵנוּ
  choice: mateso yetu
  rationale: Neno hili linaweza kumaanisha taabu, dhiki, au mateso; ‘mateso yetu’ ni la kawaida na linafaa kwa muktadha huu.
- source_word: וְלַחֲצֵנוּ
  choice: kuonewa kwetu
  rationale: לַחַץ hueleza shinikizo au dhuluma inayosababishwa na wengine; ‘kuonewa’ linaonyesha hali hiyo ya ukandamizaji wa nje.
theological_decisions:
- issue: Lugha ya kumweleza Mungu kwa taswira ya kibinadamu katika ‘uso wako’
  choice: Kudumisha usemi halisi ‘uso wako.’
  alternative: uwepo wako
  rationale: Kiebrania kinatumia lugha ya kimahusiano na ya kishairi kuonyesha fadhili, ukaribu, au uangalifu wa Mungu. Kuihifadhi huepuka kuondoa mvutano wa taswira hiyo kwa kuibadili kuwa dhana ya moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kwa nini’ hudumisha swali la moja kwa moja; ‘uso wako’ huhifadhi taswira ya kishairi, huku tanbihi ikifafanua maana yake ya kiidioma.
