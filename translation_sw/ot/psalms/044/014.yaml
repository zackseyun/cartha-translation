  text: 'Unatufanya kuwa mithali[a] miongoni mwa mataifa;

    watu wanatikisa vichwa vyao[b] kutudhihaki miongoni mwa makundi ya watu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “msemo wa dhihaka.” Neno la Kiebrania linaweza kumaanisha mithali au msemo unaotumiwa kumdharau mtu.
