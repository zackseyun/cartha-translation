lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: Unatufanya kuwa
  rationale: Kitenzi שׂים kina maana ya kuweka au kufanya. Hapa kinamwelekea Mungu moja kwa moja na kueleza hali ambayo amewafanya waombolezaji waingie.
- source_word: מָשָׁל
  choice: mithali
  rationale: מָשָׁל inaweza kuwa mithali, msemo unaotumiwa kwa dhihaka, au jina la kudharaulia. “Mithali” huhifadhi picha ya msingi, huku muktadha na tanbihi zikionyesha dhihaka iliyokusudiwa.
- source_word: בַּגּוֹיִם
  choice: miongoni mwa mataifa
  rationale: גּוֹיִם hapa ni mataifa au jamii za kigeni kwa ujumla, si istilahi maalumu ya kidini.
- source_word: מְנוֹד רֹאשׁ
  choice: wanatutikisia vichwa
  rationale: Kirai hiki kinaonyesha kitendo cha kutikisa kichwa kwa dhihaka au dharau. Muundo wa kitenzi ni wa kawaida zaidi katika Kiswahili kuliko tafsiri nomino kwa nomino, na bado huhifadhi picha halisi.
- source_word: בַּל אֻמִּים
  choice: watu wa makabila mbalimbali
  rationale: אֻמִּים inalingana kishairi na גּוֹיִם na humaanisha makundi ya watu. Tafsiri hii inaepuka kurudia “mataifa” na kuwasilisha upana wa jamii zinazowadhihaki.
