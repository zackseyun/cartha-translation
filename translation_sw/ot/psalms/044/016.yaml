translation:
  language: sw
  text: 'kwa sababu ya sauti ya anayekashifu na kukufuru[a],

    kwa sababu ya adui na mwenye kulipiza kisasi.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutokana na sauti ya anayekashifu na kutukana.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, neno kwa neno, “kutoka mbele ya adui na mwenye kulipiza kisasi,” nahau yenye maana ya “kwa sababu ya” au “kwa ajili ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  choice: kwa sababu ya sauti ya
  rationale: Kirai hiki kinaonyesha sababu au chanzo katika muktadha huu. Tafsiri hii inadumisha taswira halisi ya ‘sauti’ huku ikionyesha wazi uhusiano wa kisababishi.
- source_word: מְחָרֵף
  choice: anayekashifu
  rationale: Kitenzi hiki humaanisha kumvunjia mwingine heshima kwa maneno ya dharau au lawama. ‘Anayekashifu’ ni Kiswahili cha sasa kinachohifadhi nguvu ya usemi huo na hali ya mtendaji inayoendelea.
- source_word: וּמְגַדֵּף
  choice: na kukufuru
  rationale: Neno hili linaweza kumaanisha kutukana au kunena kwa dharau, na mara nyingi lina uzito wa kumvunjia Mungu heshima. ‘Kukufuru’ huhifadhi uzito huo bila kutaja wazi mhusika ambaye Kiebrania hakumtaji.
- source_word: מִפְּנֵי
  choice: kwa sababu ya
  rationale: Ingawa maana yake halisi ni ‘kutoka mbele ya’ au ‘kutoka usoni pa,’ hapa ni nahau inayoonyesha sababu. Tafsiri hii pia inalingana na mstari sambamba unaotangulia.
- source_word: אֹיֵב
  choice: adui
  rationale: Umoja wa Kiebrania umehifadhiwa kwa neno la kawaida na la heshima ‘adui.’
- source_word: וּמִתְנַקֵּם
  choice: na mwenye kulipiza kisasi
  rationale: Umbo la kitenzi linamwelezea mtu anayejilipizia au anayechukua kisasi. ‘Mwenye kulipiza kisasi’ ni wazi na huhifadhi nguvu ya kimtendaji kuliko nomino fupi isiyo ya kawaida.
theological_decisions:
- issue: Kuhifadhi uwezekano kwamba maneno ya uadui ni matusi kwa watu na pia kumvunjia Mungu heshima
  choice: kukufuru
  alternative: kutukana / kunena kwa dharau
  rationale: גדף inaweza kumaanisha usemi wa matusi kwa ujumla, lakini katika matumizi ya kibiblia mara nyingi huwa na uzito wa kidini. ‘Kukufuru’ huhifadhi uwezekano huo bila kuongeza kiambishi cha kitu kama ‘kumkufuru Mungu,’ ambacho hakipo wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio sambamba wa mistari na taswira ya ‘sauti’ vimehifadhiwa, huku nahau ya Kiebrania ikitafsiriwa kwa maana yake ya kisababishi.
