  text: For the choirmaster[a]. Of the sons of Korah[b]. A Maskil[c].
translation:
  language: sw
  text: Kwa mkuu wa waimbaji[a]. Ya wana wa Kora[b]. Maskili[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa kiongozi wa muziki.”
    reason: alternative_reading
  - marker: b
    text: Au, “Kwa ajili ya wana wa Kora” au “Na wana wa Kora”; kihusishi cha Kiebrania kinaweza kuonyesha aina mbalimbali za uhusiano katika vichwa vya Zaburi.
    reason: alternative_reading
  - marker: c
    text: Maskili ni istilahi ya Kiebrania inayotumiwa katika vichwa kadhaa vya Zaburi; huenda inaonyesha utungo wa kufundisha au wa kutafakari.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mkuu wa waimbaji
  rationale: Katika vichwa vya Zaburi, neno hili humrejelea kiongozi wa uimbaji au muziki. Tafsiri hii ni ya kawaida na yenye heshima, huku kihusishi kikibaki na uwezekano wa maana ya kuelekezwa au kukabidhiwa kwake.
- source_word: לִבְנֵי
  choice: Ya wana wa
  rationale: Kihusishi ל־ katika vichwa vya Zaburi kinaweza kuonyesha uhusiano, utunzi, matumizi, au kukabidhiwa. “Ya” ni fupi na haibainishi kupita kiasi aina ya uhusiano.
- source_word: קֹרַח
  choice: Kora
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: מַשְׂכִּיל
  choice: Maskili
  rationale: Maana mahususi ya istilahi hii katika vichwa vya Zaburi haijulikani kwa uhakika; kuitohhoa huhifadhi istilahi ya Kiebrania bila kuamua kwamba ni zaburi ya kufundisha au ya kutafakari.
