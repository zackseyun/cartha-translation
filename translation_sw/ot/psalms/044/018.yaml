  text: לֹא נָס֣וֹג אָח֣וֹר לִבֵּ֑/נוּ וַ/תֵּ֥ט אֲשֻׁרֵ֗י/נוּ מִנִּ֥י אָרְחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/018.yaml
  text: Our heart has not turned back[a], nor have our steps turned aside from your path.
translation:
  language: sw
  text: Moyo wetu haujarudi nyuma,[a] wala hatua zetu hazijapotoka kutoka katika njia yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Moyo wetu haujarudi nyuma, wala nyayo zetu hazijakengeuka kutoka katika njia yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסוֹג אָחוֹר
  choice: haujarudi nyuma
  rationale: Kirai hiki huhifadhi picha ya kugeuka au kurudi nyuma, huku kikisomeka kwa kawaida katika Kiswahili.
- source_word: לִבֵּנוּ
  choice: Moyo wetu
  rationale: Umoja wa Kiebrania una maana ya pamoja na unadumisha picha ya kibiblia ya moyo kama utu wa ndani, ikiwemo nia na uaminifu.
- source_word: וַתֵּט
  choice: hazijapotoka
  rationale: Katika picha ya njia, kitenzi kina maana ya kugeuka kando au kupotoka; 'hazijapotoka' ni cha kawaida na hakiongezi ufafanuzi usiotajwa.
- source_word: אֲשֻׁרֵינוּ
  choice: hatua zetu
  rationale: Neno hili hurejelea hatua au miendo, si miguu yenyewe, na linaendeleza sitiari ya kutembea katika njia.
- source_word: מִנִּי אָרְחֶךָ
  choice: kutoka katika njia yako
  rationale: Huwakilisha utengano unaoonyeshwa na kihusishi na kudumisha picha halisi ya njia kama mwenendo uliowekwa na Mungu.
theological_decisions:
- issue: Sitiari ya kibinadamu ya 'moyo'
  choice: Kudumisha 'moyo' badala ya kuifasiri kuwa 'akili' au 'uaminifu'.
  alternative: Uaminifu wetu haujarudi nyuma; nia yetu haijarudi nyuma.
  rationale: Kiebrania kinatumia 'moyo' kwa utu wa ndani kwa upana. Tafsiri ya moja kwa moja huhifadhi uzito wa kifasihi na kitheolojia bila kupunguza maana iwe akili, hisia, au uaminifu pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa pamoja 'moyo wetu' umehifadhiwa; 'hatua zetu' na 'njia yako' zinadumisha picha ya mwendo bila kuingiza msimamo wa kimadhehebu.
