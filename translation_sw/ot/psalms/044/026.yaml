  yaml_path: translation/ot/psalms/044/026.yaml
  text: Rise up as our help[c][b][a], and redeem us for the sake of your steadfast love.
translation:
  language: sw
  text: Inuka uwe msaada wetu,[a] na utukomboe[b] kwa ajili ya upendo wako thabiti.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Inuka utusaidie.” Kiebrania kwa namna halisi kina “Inuka, msaada kwa ajili yetu,” kikitumia nomino “msaada” badala ya kitenzi.
    reason: lexical_alternative
  - marker: b
    text: Au “utuokoe” au “utukomboe kwa fidia.” Kitenzi cha Kiebrania kinaweza kumaanisha ukombozi unaohusishwa na fidia au uokozi kwa kuingilia kati kwa nguvu.
    reason: lexical_alternative
  - marker: c
    text: “Upendo thabiti” hutafsiri neno la Kiebrania hesed, ambalo mara nyingi humaanisha upendo mwaminifu na wa kudumu wa Mungu katika uhusiano wake na watu wake.
    reason: cultural_note
lexical_decisions:
- source_word: ק֭וּמָֽה
  choice: Inuka
  rationale: Amri ya nafsi ya pili umoja kutoka קום ni mwito wa dharura kwa Mungu achukue hatua. “Inuka” ni Kiswahili cha kawaida na chenye hadhi kinachohifadhi taswira ya Kiebrania.
- source_word: עֶזְרָ֣תָה לָּ֑נוּ
  choice: uwe msaada wetu
  rationale: עֶזְרָה ni nomino “msaada.” Muundo huu unahifadhi hali ya unomino na wazo la Mungu mwenyewe kuwa msaada kwao, huku ukiwa wa asili katika Kiswahili.
- source_word: וּ֝פְדֵ֗נוּ
  choice: na utukomboe
  rationale: Amri ya פדה yenye kiambishi cha nafsi ya kwanza wingi inaweza kumaanisha kukomboa, kufidia, au kuokoa kwa kuingilia kati. “Utukomboe” huhifadhi upana wa ukombozi bila kulazimisha wazo la malipo katika muktadha huu.
- source_word: לְמַ֣עַן
  choice: kwa ajili ya
  rationale: Kirai hiki huonyesha msingi au sababu inayotolewa katika ombi. “Kwa ajili ya” kinahifadhi muundo wa ombi linalotegemea sifa ya Mungu.
- source_word: חַסְדֶּֽךָ
  choice: upendo wako thabiti
  rationale: חסד huunganisha upendo, uaminifu, na ushikamanifu wa kudumu. “Upendo wako thabiti” ni wazi kwa msomaji wa sasa na haupunguzi neno hilo kuwa rehema pekee.
theological_decisions:
- issue: Iwapo פדה litafsiriwe kwa maana maalumu ya kiteolojia
  choice: utukomboe
  alternative: utuokoe; utufidie
  rationale: “Utukomboe” huhifadhi maana ya kuachiliwa au kuokolewa na Mungu, lakini haiingizi kwa lazima mafundisho ya baadaye au njia maalumu ya ukombozi ambayo mstari hautaji.
- issue: Jinsi ya kuhifadhi wigo wa maana wa חסד
  choice: upendo wako thabiti
  alternative: upendo wako mwaminifu; rehema zako; upendo wako wa agano
  rationale: Chaguo hili linabeba upendo na udumifu wa uaminifu wa Mungu bila kufanya neno “agano” kuwa wazi pale ambapo halipo katika mstari wenyewe.
- issue: Uhusiano wa עֶזְרָה na amri קוּמָה
  choice: Inuka uwe msaada wetu
  alternative: Inuka utusaidie
  rationale: Kiebrania kinatumia nomino “msaada,” si kitenzi “saidia.” Tafsiri kuu inahifadhi hilo na pia maana ya Mungu kuwa msaada wao; tanbihi inatoa tafsiri ya kimatendo iliyo ya asili zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “uwe msaada wetu” umechaguliwa ili kuhifadhi nomino ya Kiebrania bila kuleta Kiswahili kigumu; alama za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
