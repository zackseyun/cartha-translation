  text: ע֤וּרָ/ה לָ֖/מָּה תִישַׁ֥ן אֲדֹנָ֑/י הָ֝קִ֗יצָ/ה אַל תִּזְנַ֥ח לָ/נֶֽצַח׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/023.yaml
  text: Awake! Why do you sleep[a], Lord? Rouse yourself; do not reject us forever.
translation:
  language: sw
  text: Amka! Kwa nini unalala, Ee Bwana? Zinduka! Usitukatae milele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usitutupilie mbali milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרָה
  choice: Amka!
  rationale: Kitenzi cha amri kinachotoa mwito wa moja kwa moja wa kuamka; “Amka!” ni cha kawaida, chenye nguvu, na kinahifadhi ujasiri wa sala hii.
- source_word: לָמָּה
  choice: Kwa nini
  rationale: Hili ndilo umbo la kawaida la Kiswahili la kuuliza sababu katika kilio cha malalamiko.
- source_word: תִישַׁן
  choice: unalala
  rationale: Hali ya sasa katika swali la balagha inahifadhi taswira ya usingizi na inasikika kwa kawaida katika Kiswahili.
- source_word: אֲדֹנָי
  choice: Ee Bwana
  rationale: Ni cheo cha Mungu katika usemi wa moja kwa moja; “Ee” huonyesha wazi kwamba ni wito, huku “Bwana” likihifadhi maana ya cheo hicho.
- source_word: הָקִיצָה
  choice: Zinduka!
  rationale: Ni amri nyingine ya kuamka. “Zinduka!” inatofautisha kitenzi hiki na עוּרָה huku ikihifadhi ulinganifu na msisitizo wa kishairi.
- source_word: אַל
  choice: Usi-
  rationale: Kiambishi cha kukataza katika “usitukatae” kinawakilisha katazo la Kiebrania kwa njia ya kawaida ya Kiswahili.
- source_word: תִזְנַח
  choice: tukatae
  rationale: Mzizi huu humaanisha kukataa, kutupilia mbali, au kuachilia mbali. “Tukatae” ni wazi na wa sasa; taswira ya “kututupa mbali” imehifadhiwa katika tanbihi.
- source_word: לָנֶצַח
  choice: milele
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kudumu bila mwisho.
theological_decisions:
- issue: Lugha ya kibinadamu inayomwonyesha Mungu amelala na kuamka
  choice: Kuhifadhi moja kwa moja taswira ya kulala, kuamka, na kuzinduka
  alternative: Kuilainisha kuwa, “Kwa nini unaonekana kutotenda, Ee Bwana?”
  rationale: Kiebrania kinamwomba Mungu kwa ujasiri kwa kutumia taswira ya usingizi na kuamka. Tafsiri inapaswa kuhifadhi mvutano huo wa kilio cha huzuni badala ya kuufafanua au kuupunguza katika matini kuu; mstari ni ombi la maombolezo, si dai kwamba Mungu hulala kihalisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Sentensi fupi za amri zinadumisha nguvu ya kilio cha zaburi. Alama [a] imewekwa baada ya kishazi kinachohusika, tofauti na nafasi yake isiyolingana na maelezo katika safu ya ushauri ya Kiingereza.
