  yaml_path: translation/ot/psalms/044/011.yaml
  text: You give us over like sheep for food[b][a], and among the nations you have scattered us.
translation:
  language: sw
  text: Umetukabidhi kama kondoo wa kuliwa, na kututawanya miongoni mwa mataifa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mataifa” hapa ni watu wa kigeni ambao Waisraeli wametawanywa miongoni mwao.
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְּנֵנוּ
  choice: Umetutoa
  rationale: Kitenzi נתן kimsingi ni ‘kutoa’; katika ombolezo hili ‘umetutoa’ kwa kawaida hudokeza kuwa Mungu amewaacha mikononi mwa adui bila kulazimisha maana maalumu zaidi.
- source_word: כְּצֹאן
  choice: kama kondoo
  rationale: Huhifadhi tashbihi ya Kiebrania kwa Kiswahili cha kawaida na kinachoeleweka.
- source_word: מַאֲכָל
  choice: wa kuliwa
  rationale: Nomino hii humaanisha chakula au kitu cha kuliwa. ‘Wa kuliwa’ ni ya asili katika muundo ‘kondoo wa kuliwa’ na haiongezi wazo maalumu la kuchinjwa ambalo halijasemwa wazi.
- source_word: וּבַגּוֹיִם
  choice: miongoni mwa mataifa
  rationale: גוים humaanisha mataifa au watu wa kigeni; hapa ‘miongoni mwa mataifa’ huonyesha mahali walipotawanywa kwa uwazi.
- source_word: זֵרִיתָנוּ
  choice: kututawanya
  rationale: זרה ni kutawanya, na yaweza pia kutumiwa kwa kupepeta. Katika muktadha wa watu waliotawanyika miongoni mwa mataifa, ‘kututawanya’ ndiyo maana iliyo wazi na ya kawaida.
theological_decisions:
- issue: Taswira ya watu kama kondoo
  choice: Taswira ‘kama kondoo wa kuliwa’ imehifadhiwa bila kupunguza ukali wake.
  alternative: kama kondoo wa kuchinjwa
  rationale: מַאֲכָל husema chakula au kuliwa, si kuchinjwa moja kwa moja; hivyo tafsiri huhifadhi ombolezo kali bila kuongeza maelezo yasiyokuwamo katika Kiebrania.
- issue: Mungu kama mtendaji wa kutawanya
  choice: Mungu anaendelea kusemwa moja kwa moja kuwa ndiye aliyewatoa na kuwatawanya.
  alternative: Tulitolewa na kutawanywa
  rationale: Vitenzi vya Kiebrania viko katika nafsi ya pili ya umoja na vinamwelekea Mungu; kubadili kuwa hali ya kutendwa kungepunguza mvutano wa kiteolojia wa ombolezo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo umeunganisha vitenzi kwa ‘na’ ili kuonyesha kuwa Mungu ndiye mtendaji wa vitendo vyote viwili. Alama [a] imewekwa mara moja katika maandishi na inalingana na tanbihi.
