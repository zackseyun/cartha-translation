  text: כָּל זֹ֣את בָּ֭אַתְ/נוּ וְ/לֹ֣א שְׁכַחֲנ֑וּ/ךָ וְ/לֹֽא שִׁ֝קַּ֗רְנוּ בִּ/בְרִיתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/017.yaml
  text: All this has come upon us[a], yet we have not forgotten you, and we have not been false to your covenant.
translation:
  language: sw
  text: Haya yote yametupata, lakini hatujakusahau, wala hatujakosa uaminifu kwa agano lako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, wala hatujatenda kwa udanganyifu dhidi ya agano lako.
    reason: Kitenzi שקר kinaweza kutafsiriwa kwa ukaribu zaidi kuwa ‘kutenda kwa uongo’ au ‘kwa udanganyifu’; tafsiri kuu inaeleza kwa Kiswahili cha kawaida maana yake katika muktadha wa agano.
lexical_decisions:
- source_word: כָּל זֹאת
  choice: Haya yote
  rationale: Ni rejeleo la ujumla kwa mateso yote yaliyotajwa kabla; Kiswahili hutumia wingi kwa kawaida katika muundo huu.
- source_word: בָּאַתְנוּ
  choice: yametupata
  rationale: Kitenzi בוא kwa maana halisi ni ‘kuja,’ lakini katika muktadha wa taabu, ‘yametupata’ ni Kiswahili cha kawaida kinachohifadhi wazo la mambo yaliyowafikia.
- source_word: וְלֹא
  choice: lakini ... hatuja- / wala hatuja-
  rationale: Kiunganishi cha kwanza kinaonyesha tofauti kati ya mateso na uaminifu unaodaiwa; cha pili kinaunganisha kwa usawa kauli mbili hasi.
- source_word: שְׁכַחֲנוּךָ
  choice: hatujakusahau
  rationale: Huhifadhi maana ya moja kwa moja ya kitenzi na kiambishi cha nafsi ya pili umoja kinachomrejelea Mungu.
- source_word: שִׁקַּרְנוּ בִּבְרִיתֶךָ
  choice: hatujakosa uaminifu kwa agano lako
  rationale: Katika muktadha wa agano, שקר inaonyesha kutenda kwa uongo au kutokuwa mwaminifu. Muundo huu ni wa asili katika Kiswahili na unaonyesha uvunjifu wa uaminifu bila kuufanya kuwa dai pana la kutokuwa na dhambi.
theological_decisions:
- issue: Dai la Israeli la kutokuwa na hatia katikati ya mateso
  choice: Kauli imewekewa mipaka katika kutomsahau Mungu na kutokosa uaminifu kwa agano lake.
  alternative: Kulipanua kuwa dai la kutokuwa na dhambi yoyote mbele za Mungu.
  rationale: Kiebrania kinataja hasa kutomsahau Mungu na kutotenda kwa uongo kuhusiana na agano; hakitoi dai la wazi la kutokuwa na dhambi kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa urahisi. ‘Yametupata’ na ‘kukosa uaminifu kwa’ ni miundo ya sasa na ya kawaida; ‘agano’ huhifadhi istilahi muhimu ya kibiblia.
