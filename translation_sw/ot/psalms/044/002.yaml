  text: אַתָּ֤ה יָדְ/ךָ֡ גּוֹיִ֣ם ה֭וֹרַשְׁתָּ וַ/תִּטָּעֵ֑/ם תָּרַ֥ע לְ֝אֻמִּ֗ים וַֽ/תְּשַׁלְּחֵֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/002.yaml
  text: You[a], by your hand, drove out nations and planted them; you afflicted peoples and sent them out.
translation:
  language: sw
  text: Wewe, kwa mkono wako, uliwafukuza mataifa, ukawapanda; uliwadhuru watu, ukawaondoa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uliwadhuru watu na kuwafanya waenee,” ikiwa kiambishi cha mwisho kinaeleweka kuwa kinawarejelea mababu wa Israeli badala ya watu.
    reason: alternative_reading
lexical_decisions:
- source_word: יָדְךָ
  choice: kwa mkono wako
  rationale: Kirai hiki kinaonyesha mkono kama chombo cha utendaji na nguvu za Mungu, huku kikihifadhi taswira halisi ya Kiebrania.
- source_word: גּוֹיִם
  choice: mataifa
  rationale: Katika muktadha huu neno hilo linamaanisha vikundi vya kitaifa vilivyokuwa katika nchi, si hasa ‘Watu wa Mataifa’ katika maana ya baadaye ya kidini.
- source_word: הוֹרַשְׁתָּ
  choice: uliwafukuza
  rationale: Hifili ya ירשׁ hapa ina maana ya kuwanyang’anya watu milki yao na kuwaondoa; ‘uliwafukuza’ ni wazi na ya kawaida katika Kiswahili.
- source_word: וַתִּטָּעֵם
  choice: na kuwapanda
  rationale: ‘Kuwapanda’ huhifadhi sitiari ya kilimo kuhusu kuwaimarisha mababu wa Israeli katika nchi, bila kutaja wazi rejeleo ambalo Kiebrania kimeliacha lieleweke kutokana na muktadha.
- source_word: תָּרַע
  choice: uliwadhuru
  rationale: Hifili ya רעע inaweza kumaanisha kutenda mabaya, kuumiza, au kudhuru. ‘Uliwadhuru’ huonyesha madhara ya hukumu bila kubainisha namna yake kupita kiasi.
- source_word: לְאֻמִּים
  choice: watu wa mataifa
  rationale: Kauli hii hudumisha utofauti wa kishairi na גּוֹיִם huku ikieleza wazi kuwa מדובר kwa jumuiya za watu, si watu binafsi tu.
- source_word: וַתְּשַׁלְּחֵם
  choice: na kuwaondoa
  rationale: שלח kimsingi ni ‘kutuma’ au ‘kuondoa.’ Katika muktadha wa kuyafukuza mataifa, ‘kuwaondoa’ ni ya kawaida na haiongezi kwa lazima wazo maalumu la kuwatawanya.
theological_decisions:
- issue: Rejeleo la viambishi katika ‘kuwapanda’ na ‘kuwaondoa’
  choice: Kiambishi cha kwanza kinarejelea mababu wa Israeli; cha mwisho kinarejelea watu wa mataifa.
  alternative: Viambishi vyote viwili vinaweza kurejelea mababu wa Israeli, hivyo mstari wa mwisho ukamaanisha kwamba Mungu aliwadhuru watu wa mataifa na kuwafanya mababu wa Israeli waenee.
  rationale: Ubeti umebanwa kishairi, na Kiebrania hakitaji wazi marejeleo ya viambishi. Muktadha unaunga mkono Mungu kuyafukuza mataifa na kuwaimarisha mababu wa Israeli; sambamba ya mwisho inaweza kueleweka kuwa kuondolewa kwa watu wa mataifa. Usomaji mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa kwa vishazi viwili sambamba; sitiari ya ‘kupanda’ haijafafanuliwa kupita kiasi.
