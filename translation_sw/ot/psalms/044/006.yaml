lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha kuwa mstari huu unatoa msingi au sababu ya kauli inayozunguka; “Kwa maana” huhifadhi uhusiano huo katika mtiririko wa kishairi.
- source_word: בְקַשְׁתִּי
  choice: upinde wangu
  rationale: קֶשֶׁת ni upinde wa vita. Kihusishi ב pamoja na kitenzi בטח huwasilishwa kwa Kiswahili cha kawaida kwa muundo “kutegemea upinde wangu.”
- source_word: אֶבְטָח
  choice: siutegemei
  rationale: בטח katika Qal humaanisha kutumaini au kutegemea. “Siutegemei” ni ya kawaida na ya asili kwa kitu kinachotumiwa kama msingi wa usalama, bila kupoteza maana ya kutoweka tumaini katika silaha.
- source_word: וְחַרְבִּי
  choice: wala upanga wangu
  rationale: חֶרֶב ni “upanga,” na kiunganishi kimetafsiriwa “wala” ili kuendeleza ukanushaji na usambamba wa upinde na upanga kwa Kiswahili cha asili.
- source_word: תוֹשִׁיעֵנִי
  choice: hauniokoi
  rationale: Hiphil ya ישׁע inaweza kumaanisha kuokoa, kukomboa, au kumpa mtu ushindi. “Hauniokoi” huhifadhi upana wa maana, huku muktadha wa kijeshi ukiruhusu pia wazo la ushindi.
theological_decisions:
- issue: Maana ya lugha ya wokovu katika muktadha wa vita
  choice: hauniokoi
  alternative: haunipi ushindi; haunikomboi
  rationale: Muktadha wa vita unafanya “kunipa ushindi” iwe tafsiri inayowezekana, lakini “hauniokoi” huhifadhi wigo mpana wa ישׁע na msisitizo wa kwamba silaha si chanzo cha wokovu, bila kuifanya kauli ihusu mafanikio ya vitani pekee.
- issue: Wakati au hali ya vitenzi vya Kiebrania vya imperfect
  choice: 'Kauli ya jumla katika wakati wa sasa: “siutegemei … hauniokoi”'
  alternative: 'Kauli yenye mwelekeo wa wakati ujao: “sitautegemea … hautaniokoa”'
  rationale: Katika ushairi huu imperfect inaweza kueleza mwenendo wa kawaida au mtazamo wa sasa, lakini maana ya wakati ujao pia inawezekana; jambo hilo limehifadhiwa katika tanbihi badala ya kuamuliwa kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Kutegemea” ni cha asili zaidi kuliko muundo usio wa kawaida wa “kutumainia” inapozungumziwa silaha. “Wala” hudumisha ukanushaji na usambamba wa mistari miwili.
