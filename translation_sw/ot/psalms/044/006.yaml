  language: sw
  text: Kwa maana sitegemei[a] upinde wangu, wala upanga wangu hauniokoi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana sitautegemea upinde wangu, wala upanga wangu hautaniokoa.” Vitenzi vya Kiebrania vinaweza pia kueleweka kuwa na maana inayoelekea wakati ujao.
    reason: lexical_alternative
  - marker: b
    text: “Hauniokoi” inaweza pia kutafsiriwa “haunipi ushindi” au “haunikomboi” katika muktadha huu wa vita.
