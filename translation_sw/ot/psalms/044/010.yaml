lexical_decisions:
- source_word: תְּשִׁיבֵנוּ אָחוֹר
  choice: Unatufanya turudi nyuma
  rationale: Hifili ya שׁוב ina maana ya kusababisha kurudi; katika muktadha wa vita, kauli hii huonyesha kwamba Mungu anawasababisha warudi nyuma.
- source_word: מִנִּי צָר
  choice: kutoka mbele ya adui
  rationale: Kirai hiki kinaonyesha kurudi kutoka au mbele ya mpinzani vitani. ‘Kutoka mbele ya adui’ huwasilisha mwendo wa kujiondoa bila kufuta uwezekano wa maana ‘mbele ya adui.’
- source_word: מְשַׂנְאֵינוּ
  choice: wanaotuchukia
  rationale: Umbo la kitenzi-jina linaonyesha watu wanaoendeleza tendo la kuwachukia; tafsiri ya kitenzi huhifadhi maana hiyo kuliko kutumia tu ‘adui zetu.’
- source_word: שָׁסוּ לָמוֹ
  choice: wamejipatia nyara
  rationale: Kitenzi שׁסס humaanisha kutwaa nyara, na לָמוֹ huonyesha manufaa yao wenyewe. Kiswahili hiki ni cha kawaida na huhifadhi wazo la kujinufaisha kwa nyara.
theological_decisions:
- issue: Mungu ndiye anayesababisha kurudi nyuma
  choice: Unatufanya turudi nyuma
  alternative: Tunarudi nyuma
  rationale: Muundo wa kisababishi katika Kiebrania unamtaja Mungu kuwa mtendaji; tafsiri haipunguzi mvutano wa kilio hicho kwa kuifanya hali itokee bila mtendaji.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Nyara’ linafaa kwa muktadha wa vita na ni neno la sasa lenye hadhi.
