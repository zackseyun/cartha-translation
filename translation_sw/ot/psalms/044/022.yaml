  text: כִּֽי עָ֭לֶי/ךָ הֹרַ֣גְנוּ כָל הַ/יּ֑וֹם נֶ֝חְשַׁ֗בְנוּ כְּ/צֹ֣אן טִבְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/022.yaml
  text: For your sake we are killed all day long[b][a]; we are regarded as sheep for slaughter.
translation:
  language: sw
  text: Kwa maana, kwa ajili yako tunauawa mchana kutwa; tunahesabiwa kama kondoo wa kuchinjwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tunachukuliwa kama kondoo wa kuchinjwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu ya malalamiko yaliyotangulia; katika aya inayosimama peke yake, maana hiyo inabebwa kwa urahisi na mtiririko wa sentensi, lakini ‘Kwa maana’ ni chaguo la wazi la kisarufi.
- source_word: עָלֶיךָ
  choice: kwa ajili yako
  rationale: Hueleza mateso yanayovumiliwa kwa sababu ya uhusiano au uaminifu kwa Mungu, bila kumtaja Mungu moja kwa moja kuwa ndiye anayewaua.
- source_word: הֹרַגְנוּ
  choice: tunauawa
  rationale: Ingawa kitenzi cha Kiebrania kina umbo timilifu, katika ombolezo hili kinaonyesha hali inayoendelea au inayorudiwa, jambo linalopatana na ‘mchana kutwa.’
- source_word: כָל הַיּוֹם
  choice: mchana kutwa
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha muda wote wa siku na, katika muktadha huu, mateso yasiyokoma.
- source_word: נֶחְשַׁבְנוּ
  choice: tunahesabiwa kuwa
  rationale: Huhifadhi maana ya kutathminiwa au kuchukuliwa kuwa kitu fulani, bila kuifanya iwe hesabu ya namba.
- source_word: כְּצֹאן
  choice: kama kondoo
  rationale: Hutoa tashbihi ya Kiebrania kwa Kiswahili cha kawaida na wazi.
- source_word: טִבְחָה
  choice: wa kuchinjwa
  rationale: Hutoa kwa lugha ya heshima na ya kawaida kusudi linalowakabili kondoo, yaani kuchinjwa.
theological_decisions:
- issue: Iwapo mateso yanasababishwa moja kwa moja na Mungu au yanavumiliwa kwa sababu ya uaminifu kwake
  choice: kwa ajili yako
  alternative: kwa sababu yako; kwa habari yako
  rationale: 'Chaguo hili linadumisha mvutano wa maandiko: watu wanateseka katika uhusiano wao na Mungu na kwa sababu ya kuwa wake, bila kufafanua kupita kiasi kwamba Mungu ndiye chanzo cha moja kwa moja cha mauaji.'
- issue: Iwapo נֶחְשַׁבְנוּ inaeleza sifa waliyopewa au hatima waliyoamuliwa
  choice: tunahesabiwa kuwa kama kondoo wa kuchinjwa
  alternative: tunachukuliwa kama kondoo wa kuchinjwa
  rationale: ‘Tunahesabiwa kuwa’ huhifadhi wazo la kutazamwa au kuamuliwa kuwa katika hali hiyo, bila kulazimisha tafsiri maalumu ya nani anayefanya tathmini hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Mchana kutwa’ ni usemi unaoeleweka kwa urahisi; ‘tunauawa’ na ‘tunahesabiwa kuwa’ huhifadhi sambamba ya vitenzi vya hali ya kuendelea. Kiunganishi ‘Kwa maana’ kimeachwa nje ya matini kuu ili kuepuka mwanzo mzito, ingawa uhusiano wa sababu ni dhahiri katika muktadha mpana wa zaburi.
