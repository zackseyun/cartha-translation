  text: כִּ֤י לֹ֪א בְ/חַרְבָּ֡/ם יָ֥רְשׁוּ אָ֗רֶץ וּ/זְרוֹעָ/ם֮ לֹא הוֹשִׁ֪יעָ֫ה לָּ֥/מוֹ כִּֽי יְמִֽינְ/ךָ֣ וּ֭/זְרוֹעֲ/ךָ וְ/א֥וֹר פָּנֶ֗י/ךָ כִּ֣י רְצִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/003.yaml
  text: For they did not possess the land by their sword[a], and their arm did not save them; but your right hand, your arm, and the light of your face did[b], because you delighted in them.
translation:
  language: sw
  text: Kwa maana hawakuimiliki nchi kwa upanga wao, wala mkono wao haukuwaokoa; bali mkono wako wa kuume, mkono wako, na nuru ya uso wako[a], kwa kuwa uliwaridhia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nuru ya uwepo wako”; kwa Kiebrania, “nuru ya uso wako,” ni taswira ya kibali cha Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרְשׁוּ
  choice: walivyoimiliki
  rationale: Kitenzi hiki katika muktadha wa kuitwaa nchi kinaonyesha kuipata na kuimiliki, si kupokea urithi kwa hali ya kutenda tu.
- source_word: אָרֶץ
  choice: nchi
  rationale: Muktadha unahusu nchi waliyoitwaa, si dunia kwa ujumla.
- source_word: זְרוֹעָם
  choice: mkono wao
  rationale: Taswira ya mkono imehifadhiwa ili kudumisha ulinganifu wa kishairi na mkono wa Mungu.
- source_word: הוֹשִׁיעָה לָּמוֹ
  choice: uliwaokoa
  rationale: Huhifadhi maana ya msingi ya kuokoa au kukomboa huku ikifaa katika muktadha wa vita.
- source_word: יְמִינְךָ
  choice: mkono wako wa kuume
  rationale: Huhifadhi taswira ya Kiebrania ya tendo lenye nguvu la Mungu na mtindo unaotambulika wa kibiblia.
- source_word: זְרוֹעֲךָ
  choice: mkono wako
  rationale: Taswira halisi imehifadhiwa ili kuakisi tofauti kati ya mkono wao na mkono wa Mungu.
- source_word: אוֹר פָּנֶיךָ
  choice: nuru ya uso wako
  rationale: Tafsiri hii huhifadhi taswira tajiri ya Kiebrania; maana ya kibali au uwepo wa Mungu imeelezwa katika tanbihi bila kuibadilisha taswira katika matini.
- source_word: רְצִיתָם
  choice: uliwapendelea
  rationale: Katika muktadha huu kitenzi kinaonyesha kibali na kupendezwa kwa Mungu; 'uliwapendelea' ni wazi na cha kawaida katika Kiswahili.
- source_word: כִּי ... כִּי
  choice: Kwa maana ... kwa kuwa
  rationale: Kiunganishi cha kwanza kinaeleza dai lililotangulia, na cha mwisho kinatoa sababu ya tendo la Mungu; utofautishaji huu ni wa asili katika Kiswahili.
theological_decisions:
- issue: Tendo la Mungu dhidi ya nguvu za kijeshi za wanadamu
  choice: Muundo wa sentensi unatofautisha upanga na mkono wao na mkono wa kuume, mkono, na nuru ya uso wa Mungu.
  alternative: Kauli ya jumla kwamba wanadamu wanapaswa kumtegemea Mungu
  rationale: Matini yenyewe inahusisha wazi kuitwaa nchi na kuokolewa na tendo la Mungu, bila kupanua mstari kuwa fundisho la jumla lisilotajwa.
- issue: אוֹר פָּנֶיךָ kama taswira ya kibali au uwepo
  choice: nuru ya uso wako
  alternative: nuru ya uwepo wako; kibali chako
  rationale: Taswira ya uso imehifadhiwa katika matini kwa sababu ina uzito wa kishairi na kiteolojia, huku tanbihi ikifafanua maana yake bila kuifungia katika tafsiri moja tu.
- issue: Kitenzi kilichoachwa katika kishazi chanya
  choice: Muundo wa 'si ... wala si ... bali ni ...' umetumiwa bila kuongeza kitenzi kipya baada ya orodha.
  alternative: Kuongeza 'ndivyo vilivyofanya hivyo' au kurudia 'vilivyowaokoa na kuwapa nchi'
  rationale: Kiebrania kina ellipsis. Muundo huu wa Kiswahili ni wa kawaida, huhifadhi tofauti kuu, na huepuka kuongeza kwa wazi tendo moja tu kati ya matendo mawili yaliyotangulia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na ulinganifu wa ‘upanga/mkono wao’ dhidi ya ‘mkono wako wa kuume/mkono wako’ umehifadhiwa; ‘kuume’ limetumiwa kwa ladha ya kibiblia inayofahamika.
