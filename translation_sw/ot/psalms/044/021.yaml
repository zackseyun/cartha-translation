  text: הֲ/לֹ֣א אֱ֭לֹהִים יַֽחֲקָר זֹ֑את כִּֽי ה֥וּא יֹ֝דֵ֗עַ תַּעֲלֻמ֥וֹת לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/021.yaml
  text: Would not God search this out? For he knows the hidden things of the heart[a].
translation:
  language: sw
  text: Je, Mungu hangelichunguza jambo hili? Kwa maana yeye anajua mambo yaliyofichika ya moyo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “siri za moyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, ... hangelichunguza?
  rationale: Muundo wa swali la balagha unatarajia jibu la kukubali; ‘Je’ pamoja na hali ya masharti huhifadhi nguvu ya swali bila kuligeuza kuwa kauli.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania ni la wingi, hapa linatumika kama jina la umoja linalomtaja Mungu wa Israeli.
- source_word: יַחֲקָר
  choice: angelichunguza
  rationale: Kitenzi kina maana ya kutafuta kwa kina au kuchunguza; ‘kuchunguza’ ni cha kawaida katika Kiswahili na huhifadhi wazo la uchunguzi wa ndani.
- source_word: זֹאת
  choice: jambo hili
  rationale: Kionyeshi kinarejelea jambo lililotangulia; kuongeza ‘jambo’ hufanya Kiswahili kiwe wazi na cha asili bila kubainisha zaidi rejeleo lake.
- source_word: כִּי
  choice: Kwa maana
  rationale: Hapa neno hili linatoa sababu inayounga mkono swali la balagha.
- source_word: יֹדֵעַ
  choice: anajua
  rationale: Umbo la participle linaonyesha ujuzi wa Mungu ulio wa kudumu; wakati uliopo wa Kiswahili huwasilisha maana hiyo vizuri.
- source_word: תַּעֲלֻמוֹת
  choice: mambo yaliyofichika
  rationale: Nomino hiyo humaanisha mambo yaliyositirika au siri; tafsiri hii inabaki karibu na picha ya chanzo huku ‘siri’ ikihifadhiwa kama uwezekano katika tanbihi.
- source_word: לֵב
  choice: moyo
  rationale: ‘Moyo’ huhifadhi nahau ya kibiblia ya utu wa ndani, ikijumuisha mawazo, makusudi na hisia, bila kuibana kuwa akili au hisia pekee.
theological_decisions:
- issue: Maana ya kiantropolojia ya לֵב
  choice: moyo
  alternative: akili; utu wa ndani
  rationale: Neno la Kiebrania linahusisha fikra, nia na hisia. ‘Moyo’ huhifadhi picha ya chanzo na upana wake wa kiteolojia bila kuamua kwa niaba ya maana moja nyembamba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Swali la balagha na muundo mfupi wa hoja ya Kiebrania vimehifadhiwa; ‘jambo hili’ limetumiwa kwa ufasaha wa kawaida wa Kiswahili.
