  text: You sell your people for no gain[a], and you have not increased by their price.
translation:
  language: sw
  text: Unawauza watu wako bila kupata mali[a], wala huongezi faida yako kwa bei yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uliwauza watu wako bure, wala hukuzidisha faida yako kwa bei yao.”
    reason: Huu ni uwezekano wa wakati uliopita wa תִּמְכֹּר; “bure” na “kuzidisha faida” huonyesha kwa muktadha kutopata mali na kutoongeza faida kutokana na bei ya mauzo.
lexical_decisions:
- source_word: תִּמְכֹּר
  choice: Unawauza
  rationale: Kitenzi cha Qal kisichotimilika, nafsi ya pili umoja, kinamwelekea Mungu. Wakati wa sasa unadumisha uhai wa kilio; wakati uliopita pia unawezekana kutokana na muktadha.
- source_word: עַמְּךָ
  choice: watu wako
  rationale: Huhifadhi maana ya watu walio katika uhusiano wa agano na Mungu, bila kuifanya kauli iwe ya kisiasa zaidi kama ‘taifa lako’.
- source_word: בְלֹא הוֹן
  choice: bila kupata mali
  rationale: הוֹן ni mali au utajiri. Tafsiri hii huhifadhi wazo halisi la kutopata mali, huku ikisikika kwa kawaida katika Kiswahili.
- source_word: רִבִּיתָ
  choice: mali yako haijaongezeka
  rationale: Piel ya רבה hapa ina wazo la kuongeza au kuzidisha. Muundo huu huhifadhi taswira ya ongezeko badala ya kuibadili moja kwa moja kuwa ‘kupata faida’.
- source_word: בִּמְחִירֵיהֶם
  choice: kwa bei yao
  rationale: מְחִיר ni bei ya kununulia au kuuzia; kihusishi ב kimetafsiriwa kwa ‘kwa’ ili kuonyesha njia au msingi wa ongezeko hilo.
