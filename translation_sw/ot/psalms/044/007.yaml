  text: For you have saved us from our adversaries[a], and you have put those who hate us to shame.
translation:
  language: sw
  text: Kwa maana wewe umetuokoa kutoka kwa adui zetu, na umewaaibisha wale wanaotuchukia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Katika muktadha huu wa kishairi, neno hili linaeleza msingi wa kujisifu katika Mungu uliotajwa kabla yake; “Kwa maana” linahifadhi uhusiano huo wa sababu kwa Kiswahili cha kawaida.
- source_word: הוֹשַׁעְתָּנוּ
  choice: wewe umetuokoa
  rationale: Hifili ya יָשַׁע humaanisha kuokoa au kukomboa. “Umetuokoa” linaonyesha tendo la Mungu lililotimizwa, huku kiwakilishi “wewe” kikihifadhi msisitizo wa mtenda uliopo katika kitenzi cha Kiebrania.
- source_word: מִצָּרֵינוּ
  choice: kutoka kwa watesi wetu
  rationale: צַר humaanisha adui au mpinzani anayesababisha dhiki. “Watesi wetu” ni la asili na lenye hadhi katika Kiswahili, na linaendeleza wazo la upinzani wenye kuleta dhiki bila kulibana kuwa mateso ya aina moja tu.
- source_word: וּמְשַׂנְאֵינוּ
  choice: na ... wale wanaotuchukia
  rationale: Umbo la kishirikishi la שָׂנֵא humaanisha watu wanaotuchukia. “Wale wanaotuchukia” ni la kawaida zaidi kuliko nomino kama “wachukiao wetu” na linahifadhi uadui wa kibinafsi uliomo katika chanzo.
- source_word: הֱבִישׁוֹתָ
  choice: umewaaibisha
  rationale: Hifili ya בּוֹשׁ ina maana ya kusababisha aibu au fedheha. “Umewaaibisha” linahifadhi maana ya kisababishi kwa Kiswahili kifupi na cha asili.
