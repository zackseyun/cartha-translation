  text: Siku nzima fedheha yangu iko mbele yangu, na aibu ya uso wangu imenifunika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aibu iliyo usoni mwangu imenifunika.” Kiebrania kwa maana ya karibu zaidi kinasema, “aibu ya uso wangu imenifunika.”
