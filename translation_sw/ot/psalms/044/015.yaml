lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Mchana kutwa
  rationale: Ni msemo wa kawaida wa Kiswahili unaoonyesha muda wote wa siku na kuhifadhi nguvu ya usemi wa Kiebrania.
- source_word: כְּלִמָּתִי
  choice: fedheha yangu
  rationale: ‘Fedheha’ huonyesha kuvunjiwa heshima hadharani na kuitofautisha kwa kiasi na בֹשֶׁת, iliyotafsiriwa ‘aibu.’
- source_word: נֶגְדִּי
  choice: iko mbele yangu
  rationale: Huhifadhi picha ya jambo lililo mbele ya macho au katika uwepo wa msemaji.
- source_word: וּבֹשֶׁת
  choice: na aibu
  rationale: ‘Aibu’ ndiyo tafsiri ya moja kwa moja na ya asili, huku ikidumisha usambamba na ‘fedheha.’
- source_word: פָּנַי
  choice: ya uso wangu
  rationale: Hufuata kwa karibu muundo wa Kiebrania ‘aibu ya uso wangu’ bila kufuta utata wake wa kimaana.
- source_word: כִּסָּתְנִי
  choice: imenifunika
  rationale: Huhifadhi sitiari ya kufunikwa na aibu na kuonyesha hali iliyotokana na tendo hilo.
