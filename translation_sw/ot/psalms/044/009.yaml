  text: Lakini umetukataa na kutuaibisha, wala hutoki pamoja na majeshi yetu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַף
  choice: Lakini sasa
  rationale: Chembe hii inaleta tofauti kali kati ya msaada wa Mungu wa zamani na hali ya sasa. “Lakini sasa” ni ya asili katika Kiswahili na huonyesha wazi mgeuko wa maombolezo.
- source_word: זָנַחְתָּ
  choice: umetukataa
  rationale: Kitenzi kina maana ya kukataa au kutupilia mbali. “Umetukataa” huhifadhi uzito wa kimahusiano na hali yenye matokeo hadi sasa.
- source_word: וַתַּכְלִימֵנוּ
  choice: na kututia aibu
  rationale: Hifili ya כלם ina maana ya kusababisha aibu au fedheha. “Kututia aibu” ni usemi wa kawaida unaohifadhi maana hiyo ya kisababishi.
- source_word: וְלֹא
  choice: wala ... huendi
  rationale: “Wala” huunganisha lalamiko hili hasi na yaliyotangulia kwa Kiswahili sanifu na cha asili.
- source_word: תֵצֵא
  choice: huendi
  rationale: יצא kimsingi ni ‘kwenda nje’; katika muktadha wa kijeshi humaanisha kwenda vitani. “Huendi” pamoja na kirai kinachofuata hutoa maana kwa kawaida bila kuongeza ufafanuzi usio wa lazima.
- source_word: בְּצִבְאוֹתֵינוּ
  choice: pamoja na majeshi yetu
  rationale: צָבָא hapa ni vikosi vya kijeshi. Kihusishi ב kinaeleweka kwa uhusiano wa kuandamana; “pamoja na majeshi yetu” ni wazi na cha asili.
theological_decisions:
- issue: Kuonyeshwa kwa Mungu kujiondoa katika vita
  choice: Mstari umetafsiriwa kama lalamiko kwamba Mungu haendi tena pamoja na majeshi ya Israeli.
  alternative: 'Tafsiri ya karibu zaidi na muundo wa Kiebrania: “huendi katika majeshi yetu.”'
  rationale: Tafsiri inadumisha mvutano wa maombolezo kuhusu kukataliwa na kutokuwapo kwa msaada wa Mungu vitani, bila kutoa dai pana la kimafundisho kuhusu sababu ya hali hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida huku ukihifadhi sauti kali ya maombolezo.
