  text: כִּ֣י דִ֭כִּיתָ/נוּ בִּ/מְק֣וֹם תַּנִּ֑ים וַ/תְּכַ֖ס עָלֵ֣י/נוּ בְ/צַלְמָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/019.yaml
  text: For you crushed us in a place of jackals and covered us with deep darkness[a][b].
translation:
  language: sw
  text: Kwa maana ulituponda mahali pa mbweha[a], ukatufunika kwa giza kuu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mbweha” ndiyo maana inayowezekana zaidi katika picha hii ya ukiwa; tafsiri za zamani wakati mwingine hutumia “majoka.”
    reason: lexical_alternative
  - marker: b
    text: Au “ukatufunika kwa kivuli cha mauti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Hapa neno hili linaeleza msingi au sababu ya kauli iliyotangulia; “Kwa maana” linaunganisha mtiririko wa hoja kwa Kiswahili cha kawaida.
- source_word: דִכִּיתָנוּ
  choice: ulituponda
  rationale: Kitenzi hiki kina maana ya kuponda, kuvunja, au kudhalilisha. “Ulituponda” kinadumisha nguvu ya picha ya mateso bila kuibana kuwa ukandamizaji wa kijamii pekee.
- source_word: בִּמְקוֹם
  choice: mahali pa
  rationale: Muundo huu unaeleza mahali penye sifa inayotajwa na nomino inayofuata; “mahali pa” ni wa kawaida na wazi kwa Kiswahili.
- source_word: תַּנִּים
  choice: mbweha
  rationale: Katika picha hii ya mahali palipo ukiwa, neno hili yaelekea kumaanisha mbweha, wanyama wanaohusishwa na maeneo yaliyoachwa. Maana nyingine za kale hazifai sana katika muktadha huu.
- source_word: וַתְּכַס עָלֵינוּ
  choice: ukatufunika
  rationale: Muundo unaendeleza usemi wa moja kwa moja kwa Mungu na picha halisi ya kufunika; kiambishi “-tu-” kinawakilisha “juu yetu/sisi” kwa Kiswahili cha asili.
- source_word: בְצַלְמָוֶת
  choice: kwa giza kuu
  rationale: Neno linaweza kumaanisha giza zito sana au, kwa uchanganuzi wa kimapokeo, kivuli cha mauti. “Giza kuu” ni fasiri wazi ya maana ya kimuktadha huku mbadala ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya בְצַלְמָוֶת
  choice: giza kuu
  alternative: kivuli cha mauti
  rationale: Neno hilo mara nyingi hutumiwa kwa maana ya giza kali sana, lakini linaweza pia kueleweka kwa muundo wake wa kimapokeo kama “kivuli cha mauti.” Maandishi makuu hayalazimishi rejeo la moja kwa moja kwa mauti, na tanbihi inadumisha utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Ulituponda” na “ukatufunika” zinadumisha picha halisi na uzito wa mstari wa Kiebrania.
