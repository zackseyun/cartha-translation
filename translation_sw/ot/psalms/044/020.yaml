  text: If we had forgotten the name of our God and spread out our hands to a foreign god—[a]
translation:
  language: sw
  text: Kama tungalisahau jina la Mungu wetu, na tungenyoosha mikono yetu kwa mungu mgeni—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mungu wa kigeni.” Neno la Kiebrania linaweza kumaanisha “mgeni,” “wa kigeni,” au “wa nje”; hapa linamaanisha mungu asiyehusiana na ibada ya agano la Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kama
  rationale: Huanzisha sharti la kudhaniwa katika tamko la kujitetea; “Kama” ni ya kawaida na inaendana na sintaksia ya Kiebrania.
- source_word: שָׁכַחְנוּ
  choice: tungelisahau
  rationale: Kauli timilifu katika sharti la kudhaniwa inaelezwa kwa hali ya masharti ya wakati uliopita, ikidokeza jambo ambalo halikutokea.
- source_word: שֵׁם אֱלֹהֵינוּ
  choice: jina la Mungu wetu
  rationale: Hudumisha usemi halisi wa Kiebrania, ambapo “jina” linawakilisha utambulisho wa Mungu unaotambuliwa na kuitiwa.
- source_word: וַנִּפְרֹשׂ כַּפֵּינוּ
  choice: na kuinyoosha mikono yetu
  rationale: Kitenzi pamoja na “viganja/mikono” kinaeleza ishara ya kuomba au kusujudu. “Kunyoosha mikono” ni usemi wa asili wa Kiswahili na huhifadhi picha bila kuifasiri moja kwa moja kuwa kuabudu.
- source_word: לְאֵל
  choice: kwa mungu
  rationale: Kihusishi kinaonyesha yule ambaye ishara ya sala inaelekezwa kwake; herufi ndogo inafafanua kuwa ni mungu mwingine, si Mungu wa Israeli.
- source_word: זָר
  choice: mgeni
  rationale: Neno linaweza kumaanisha wa kigeni, mgeni, au asiye wa jamii hiyo. “Mungu mgeni” ni usemi wa kawaida wa kibiblia unaoonyesha mungu asiye wa ibada ya agano la Israeli huku ukihifadhi upeo wa maana.
theological_decisions:
- issue: Ishara ya mikono katika ibada ya sanamu
  choice: kuinyoosha mikono yetu kwa mungu mgeni
  alternative: kuabudu mungu mgeni
  rationale: Tafsiri inahifadhi ishara halisi ya Kiebrania ya sala au dua bila kuibadili kuwa maelezo ya moja kwa moja ya tendo hilo, hivyo haiondoi utata halisi wa picha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “tungelisahau” unaendeleza sharti la kudhaniwa; “kunyoosha mikono” huhifadhi taswira ya sala.
