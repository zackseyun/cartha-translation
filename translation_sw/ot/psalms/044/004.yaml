base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/004.yaml
  text: You are my King[a], O God; command victories for Jacob.
translation:
  language: sw
  text: 'Wewe ndiwe Mfalme wangu, ee Mungu;

    amuru wokovu kwa Yakobo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amuru maokozi kwa Yakobo”; au, “amuru ushindi kwa Yakobo.” Neno la Kiebrania lililotafsiriwa “wokovu” ni la wingi na linaweza kumaanisha maokozi au ushindi.
    reason: Huhifadhi umbo la wingi na wigo wa maana wa יְשׁוּעוֹת, huku ikionyesha maana ya ushindi katika muktadha wa vita.
lexical_decisions:
- source_word: אַתָּה הוּא
  choice: Wewe ndiwe
  rationale: Muundo huu unadumisha msisitizo wa viwakilishi viwili vya Kiebrania kwa Kiswahili cha kawaida na chenye nguvu.
- source_word: מַלְכִּי
  choice: Mfalme wangu
  rationale: Nomino yenye kiambishi cha nafsi ya kwanza umoja humaanisha ‘Mfalme wangu’; herufi kubwa inaonyesha cheo kinachotumiwa katika kumwambia Mungu moja kwa moja.
- source_word: אֱלֹהִים
  choice: ee Mungu
  rationale: Hapa neno hili ni la kumwita Mungu moja kwa moja katika sala, si sehemu ya taarifa kwamba mfalme ni Mungu.
- source_word: צַוֵּה
  choice: amuru
  rationale: Kitenzi cha piel katika hali ya kuamuru kina maana ya kutoa amri; ‘amuru’ ni tafsiri ya moja kwa moja inayofaa kwa mamlaka ya Mfalme.
- source_word: יְשׁוּעוֹת
  choice: ushindi
  rationale: Ingawa umbo la Kiebrania ni wingi na linaweza kumaanisha matendo ya wokovu au ukombozi, katika muktadha wa vita wa zaburi hii ‘ushindi’ unaeleza matokeo halisi ya kuokolewa kutoka kwa maadui.
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Jina la kishairi la watu wa agano limehifadhiwa kama lilivyo badala ya kubadilishwa kwa tafsiri fafanuzi ‘Israeli’.
theological_decisions:
- issue: Maana ya יְשׁוּעוֹת katika zaburi yenye muktadha wa vita
  choice: ushindi
  alternative: matendo ya ukombozi; wokovu
  rationale: Muktadha unaohusu maadui na mapambano unaelekeza kwa ukombozi wa kihistoria wa taifa. ‘Ushindi’ unaweka wazi maana hiyo bila kuondoa wazo la msingi la kuokoa; tanbihi inahifadhi uwezekano mpana wa neno la Kiebrania.
- issue: Muundo wa kumwita Mungu moja kwa moja
  choice: Mfalme wangu, ee Mungu
  alternative: Mfalme wangu Mungu; Mfalme wangu ni Mungu
  rationale: Sintaksia inasomeka kwa kawaida zaidi kama sala inayomwambia Mungu moja kwa moja. Hivyo tafsiri inahifadhi nguvu ya ibada na ushairi bila kuifanya kuwa taarifa tofauti ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. ‘Wewe ndiwe’ huhifadhi msisitizo wa Kiebrania; ‘amuru Yakobo apate ushindi’ ni mpangilio wa kawaida wa Kiswahili kuliko ‘amuru ushindi kwa Yakobo’ huku ukiendeleza picha ya Mungu anayetoa amri.
