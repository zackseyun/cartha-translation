id: PSA.44.1
reference: Psalms 44:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֱלֹהִ֤ים בְּ/אָזְנֵ֬י/נוּ שָׁמַ֗עְנוּ אֲבוֹתֵ֥י/נוּ סִפְּרוּ לָ֑/נוּ פֹּ֥עַל פָּעַ֥לְתָּ בִֽ֝/ימֵי/הֶ֗ם בִּ֣/ימֵי קֶֽדֶם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/001.yaml
  text: God[a], we have heard with our ears; our fathers have told us the deed you did in their days[c][b], in days of old.
translation:
  language: sw
  text: Ee Mungu, tumesikia kwa masikio yetu; baba zetu wametusimulia tendo ulilolitenda katika siku zao, siku za kale.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Nomino hii ni wito wa moja kwa moja mwanzoni mwa mstari; katika Kiswahili sanifu, “Ee Mungu” huonyesha wito huo kwa wazi na kwa hadhi.
- source_word: בְּאָזְנֵינוּ
  choice: kwa masikio yetu
  rationale: Huhifadhi msisitizo halisi wa kusikia kwa masikio na ni nahau ya kawaida ya Kiswahili.
- source_word: שָׁמַעְנוּ
  choice: tumesikia
  rationale: Wakati timilifu wa Kiswahili unaonyesha jambo lililopokewa zamani ambalo bado lina umuhimu kwa wasemaji.
- source_word: אֲבוֹתֵינוּ
  choice: baba zetu
  rationale: Huhifadhi neno la kifamilia la kiume lililo katika Kiebrania; katika muktadha huu linarejelea vizazi vya baba waliotangulia.
- source_word: סִפְּרוּ לָנוּ
  choice: wametusimulia
  rationale: Kitenzi hiki huonyesha kusimulia au kukariri matendo yaliyopitishwa kutoka kizazi kilichotangulia.
- source_word: פֹּעַל פָּעַלְתָּ
  choice: tendo ulilolitenda
  rationale: Huhifadhi uhusiano wa mzizi unaorudiwa kati ya nomino na kitenzi katika Kiebrania, huku Kiswahili kikiwa cha kawaida na cha kishairi.
- source_word: בִּימֵיהֶם
  choice: katika siku zao
  rationale: Ni ulinganifu wa moja kwa moja wa usemi wa wakati na huonyesha kipindi walichoishi baba hao.
- source_word: בִּימֵי קֶדֶם
  choice: siku za kale
  rationale: Hueleza zamani za mbali kwa lugha fupi, ya kawaida na yenye hadhi ya kishairi.
theological_decisions:
- issue: Namna ya kutafsiri wito wa mwanzo
  choice: Ee Mungu
  alternative: Mungu
  rationale: Kiebrania humweka Mungu katika wito wa moja kwa moja bila chembe maalumu ya wito. Kiswahili “Ee Mungu” huonyesha kazi hiyo kwa asili; “Mungu” pekee pia ingewezekana lakini wito ungekuwa dhaifu kidogo.
- issue: Upeo wa אֲבוֹתֵינוּ
  choice: baba zetu
  alternative: mababu zetu / wazee wetu wa zamani
  rationale: Tafsiri kuu huhifadhi umbo la kiume la Kiebrania bila kulifanya kwa lazima neno lisilo na jinsia; katika muktadha linaweza kujumuisha vizazi vya mababu waliotangulia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mstari huhifadhi urudiaji wa Kiebrania katika “tendo ulilolitenda” na mfuatano wa ushuhuda uliosikiwa na kurithishwa.
