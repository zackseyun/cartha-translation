  text: בְּ֭/ךָ צָרֵ֣י/נוּ נְנַגֵּ֑חַ בְּ֝/שִׁמְ/ךָ֗ נָב֥וּס קָמֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/005.yaml
  text: Through you we push back our foes[b][a]; through your name we trample those who rise against us.
translation:
  language: sw
  text: Kwa wewe tunawasukuma nyuma adui zetu[a]; kwa jina lako[b] tunawakanyaga wanaotupinga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi kina taswira ya “kuwapiga kwa pembe” adui zetu; hapa ni sitiari ya kuwasukuma nyuma kwa nguvu.
    reason: lexical_alternative
  - marker: b
    text: Au “katika jina lako.” Hapa “jina” linamaanisha utambulisho wa Mungu uliofunuliwa, mamlaka yake, na nguvu zake.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  choice: Kwa msaada wako
  rationale: בְּ pamoja na kiambishi cha nafsi hapa huonyesha njia au wakala wa ushindi. “Kwa msaada wako” ni Kiswahili cha kawaida kinachoonyesha wazi kuwa Mungu ndiye chanzo cha uwezo wa kushinda.
- source_word: צָרֵינוּ
  choice: adui zetu
  rationale: Neno hili humaanisha wapinzani wenye uhasama. “Adui zetu” ni la kawaida, wazi, na linafaa katika lugha ya kishairi na ya vita.
- source_word: נְנַגֵּחַ
  choice: tunawasukuma nyuma
  rationale: Kitenzi hiki kihalisi hueleza kupiga au kuchoma kwa pembe, lakini hapa kimetumiwa kisitiari kwa kuwafukuza au kuwarudisha nyuma adui kwa nguvu. Tafsiri hii ni ya asili huku tanbihi ikihifadhi taswira halisi.
- source_word: בְּשִׁמְךָ
  choice: kwa jina lako
  rationale: Kirai hiki kinaweza kueleza njia au mamlaka ambayo kwayo tendo linafanyika. “Jina” linawakilisha utambulisho, mamlaka, na nguvu za Mungu, si matamshi ya jina tu.
- source_word: נָבוּס
  choice: tunawakanyaga
  rationale: בוס humaanisha kukanyaga au kukanyaga chini. “Tunawakanyaga” huhifadhi taswira kali na ya moja kwa moja ya ushindi wa vita.
- source_word: קָמֵינוּ
  choice: wanaotuinukia
  rationale: Umbo hili kutoka קום humaanisha wale wanaoinuka dhidi yetu. Kirai hiki huhifadhi dhana ya kitendo cha kuinuka kupinga badala ya kuifanya kuwa “washambuliaji” kwa ujumla.
theological_decisions:
- issue: Wakala wa ushindi katika taswira ya vita
  choice: Mungu anaonyeshwa kuwa chanzo na njia ya ushindi, huku watu wake wakionyeshwa wakitenda vitani.
  alternative: Kusisitiza uwezo wa kijeshi wa watu pekee, au kulichukulia “jina lako” kama tamko la kifomula lenye nguvu yenyewe.
  rationale: Virai sambamba בְּךָ na בְּשִׁמְךָ vinaweka utegemezi kwa Mungu mbele, lakini vitenzi vya wingi vinaacha wazi ushiriki wa watu. Tafsiri inadumisha mvutano huo bila kuufuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo sambamba wa mishororo umehifadhiwa; lugha ni wazi kwa msomaji wa kawaida bila kupunguza ukali wa taswira ya vita.
