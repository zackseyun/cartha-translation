  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Yanafanya ghasia” na “wanapanga njama bure” ni misemo inayoeleweka kwa urahisi, huku tanbihi ikihifadhi utata halisi wa maneno ya Kiebrania.
