  text: Why do the nations rage[a], and the peoples plot in vain?
translation:
  language: sw
  text: Kwa nini mataifa yanafanya ghasia, na watu wanapanga njama bure?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanatafakari ubatili” au “wananong’ona mambo matupu.” Kitenzi cha Kiebrania kinaweza kumaanisha kunong’ona au kutafakari, na pia kubuni au kupanga; nomino humaanisha utupu, ubatili, au jambo lisilo na maana.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Kwa nini
  rationale: Ni njia ya kawaida na ya moja kwa moja ya kuuliza sababu katika Kiswahili, na inadumisha nguvu ya swali la balagha.
- source_word: רָגְשׁוּ
  choice: yanafanya ghasia
  rationale: Kitenzi hiki kinaeleza msukosuko au vurugu ya makundi. Kauli hii ni ya asili katika Kiswahili na inaonyesha uasi wenye taharuki bila kuingiza moja kwa moja wazo la kupanga njama.
- source_word: גוֹיִם
  choice: mataifa
  rationale: Hurejelea makundi ya kisiasa au mataifa; tafsiri hii haileti kwa lazima tofauti ya baadaye kati ya Wayahudi na watu wa mataifa mengine.
- source_word: לְאֻמִּים
  choice: watu
  rationale: Hifadhi ulinganifu wa kishairi na “mataifa” kwa neno la kawaida linalomaanisha jamii au makundi ya watu.
- source_word: יֶהְגּוּ
  choice: wanapanga njama
  rationale: Katika muktadha wa uasi wa kisiasa, kitenzi chenye maana pana ya kunong’ona, kutafakari, au kubuni kinaeleweka kwa kawaida kuwa kupanga njama. Upeo wake mpana wa maana umehifadhiwa katika tanbihi.
- source_word: רִיק
  choice: bure
  rationale: Huonyesha ubatili, utupu, au jambo lisilo na matokeo. “Bure” ni ya asili pamoja na “wanapanga njama,” ingawa inawasilisha nomino ya Kiebrania kwa namna ya kielezi katika Kiswahili.
