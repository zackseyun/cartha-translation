  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: נַשְּׁקוּ בַ֡ר פֶּן יֶאֱנַ֤ף וְ/תֹ֬אבְדוּ דֶ֗רֶךְ כִּֽי יִבְעַ֣ר כִּ/מְעַ֣ט אַפּ֑/וֹ אַ֝שְׁרֵ֗י כָּל ח֥וֹסֵי בֽ/וֹ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/012.yaml
  text: Kiss the son[a], lest he be angry and you perish in the way, for his anger burns quickly[c][b]. Blessed are all who take refuge in him.
translation:
  language: sw
  text: Mbusuni mwana[a][b], asije akakasirika nanyi mkaangamia njiani, kwa maana hasira yake huwaka upesi[c]. Heri wote wanaokimbilia kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtoleeni mwana heshima ya utii.” Kitenzi hiki humaanisha kihalisi “busu,” lakini katika mazingira ya kifalme busu linaweza kuwa tendo la kuonyesha heshima au kujisalimisha.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania bar si la kawaida hapa. Mara nyingi hueleweka kuwa “mwana,” jambo linaloendana na Zaburi 2:7, lakini wengine wamependekeza maana kama “usafi” au “kwa usafi.”
    reason: alternative_reading
  - marker: c
    text: Au, “kwa maana hasira yake itawaka baada ya muda mfupi,” au “kwa maana hasira yake huwaka kidogo tu.” Usemi wa Kiebrania ni mfupi na unaweza kukazia ama kasi ya kuwaka kwa hasira ama ufupi au udogo wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַשְּׁקוּ
  choice: Mbusuni
  rationale: Ni amri ya wingi kutoka kitenzi chenye maana ya msingi ‘busu.’ Taswira halisi imehifadhiwa, huku maana ya kutoa heshima na kujisalimisha kwa mfalme ikielezwa katika tanbihi.
- source_word: בַר
  choice: mwana
  rationale: Ingawa neno hili si la kawaida katika muktadha wa Kiebrania, ‘mwana’ linaendana vizuri na lugha ya kifalme ya Zaburi 2:7. Usomaji mwingine umehifadhiwa katika tanbihi kwa sababu neno hili lina utata wa kweli.
- source_word: פֶּן יֶאֱנַף
  choice: asije akakasirika
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida onyo la kusudi au tokeo hasi baada ya amri, huku ukidumisha mhusika wa kiume katika kitenzi.
- source_word: וְתֹאבְדוּ דֶרֶךְ
  choice: nanyi mkaangamia njiani
  rationale: ‘Mkaangamia’ hudumisha nguvu ya אבד bila kufafanua namna ya maangamizi. ‘Njiani’ huakisi usemi mfupi wa kishairi ambao hauna kihusishi wazi katika Kiebrania.
- source_word: כִּי יִבְעַר כִּמְעַט אַפּוֹ
  choice: kwa maana hasira yake huwaka upesi
  rationale: Tafsiri hii inadumisha sitiari ya kuwaka na kuwasilisha uwezekano wa hasira kuzuka ghafula. Usemi wa Kiebrania ni mfupi na unaweza pia kueleweka kwa kuonyesha muda mfupi au kiwango kidogo; hilo limeonyeshwa katika tanbihi.
- source_word: אַשְׁרֵי
  choice: Heri
  rationale: ‘Heri’ ni usemi wa kawaida na wenye hadhi katika baraka za kishairi za Kiswahili, nao hubeba maana pana kuliko furaha ya kihisia pekee.
- source_word: כָּל חֹסֵי בוֹ
  choice: wote wanaotafuta kimbilio kwake
  rationale: חסה hueleza kutafuta usalama au ulinzi. ‘Kutafuta kimbilio kwake’ ni Kiswahili cha sasa na cha kawaida kinachohifadhi taswira ya kumtegemea mtu kama mahali pa usalama.
theological_decisions:
- issue: Utambulisho wa בַר katika Zaburi 2:12
  choice: Imetafsiriwa ‘mwana,’ kwa kuzingatia lugha ya mwana wa kifalme katika Zaburi 2:7.
  alternative: Neno hilo linaweza kupendekezwa kuwa ‘usafi’ au kueleweka kielezi, kama ‘kwa usafi’; wengine huliona kuwa tatizo la kimatini au kilugha lisilo na suluhisho la hakika.
  rationale: Muktadha wa karibu wa zaburi unaunga mkono zaidi rejeo la mwana wa kifalme, bila kulazimisha madai ya baadaye ya kimafundisho ndani ya mstari huu. Utata wa neno lenyewe haujafichwa bali umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo ni wazi kwa msomaji wa kawaida, lakini taswira za Kiebrania za busu, njia, kuwaka kwa hasira, na kimbilio zimehifadhiwa. Tanbihi zinatunza utata wa בַר na כִּמְעַט bila kuufumbua kimadhehebu.
