base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/005.yaml
  text: Then he will speak to them in his anger[a], and in his burning wrath he will terrify them.
translation:
  language: sw
  text: Ndipo atasema nao katika hasira yake[a], na katika ghadhabu yake inayowaka atawatisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na katika joto la hasira yake atawafadhaisha.”
    reason: Njia mbadala ya kileksia inayohifadhi taswira ya joto katika חָרוֹן na maana ya “kuwatia hofu/kuwafadhaisha” ya יְבַהֲלֵמוֹ.
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Kielezi hiki kinaonyesha hatua inayofuata katika mfuatano wa zaburi; “Ndipo” ni Kiswahili cha kawaida kinachohifadhi mwendelezo huo.
- source_word: יְדַבֵּר
  choice: atasema
  rationale: Kauli ya Piel isiyotimilika hapa inaeleza jibu la Mungu linalofuata; wakati ujao unafaa katika muktadha huu.
- source_word: אֵלֵימוֹ
  choice: nao
  rationale: Kiambishi cha nafsi ya tatu wingi kinawarejelea wafalme na watawala wa aya zilizotangulia; “kusema nao” ni usemi wa asili katika Kiswahili.
- source_word: בְאַפּוֹ
  choice: kwa hasira yake
  rationale: אַף kwa maana halisi huhusishwa na pua, lakini hapa ni nahau ya hasira; tafsiri hii inawasilisha maana bila ugumu usio wa lazima.
- source_word: וּבַחֲרוֹנוֹ
  choice: na kwa ghadhabu yake kali
  rationale: חָרוֹן huonyesha hasira kali yenye taswira ya kuwaka. “Ghadhabu yake kali” inatofautisha kishazi hiki na “hasira yake” huku ikibaki ya kawaida na yenye uzito katika Kiswahili.
- source_word: יְבַהֲלֵמוֹ
  choice: atawatisha
  rationale: Piel ya בהל humaanisha kusababisha hofu ya ghafla, fazaa, au mfadhaiko; “atawatisha” ni ya moja kwa moja na inahifadhi nguvu ya hukumu katika muktadha.
theological_decisions:
- issue: Lugha inayomwelezea Mungu kwa hisia ya hasira
  choice: Kudumisha maneno “hasira yake” na “ghadhabu yake kali” bila kuyapunguza.
  alternative: “kutofurahishwa kwake” au “hukumu yake”
  rationale: Kiebrania kinaonyesha upinzani binafsi na mkali wa Mungu dhidi ya uasi. Tafsiri inahifadhi uzito na mvutano huo bila kuongeza fundisho lisilokuwamo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida, huku urudiaji uliosisitizwa wa hasira na ghadhabu katika Kiebrania ukihifadhiwa.
