lexical_decisions:
- source_word: נְנַתְּקָה
  choice: Tuzikate
  rationale: Kitenzi hiki cha nafsi ya kwanza wingi kinaonyesha azimio au kuhimizana, na humaanisha kukata, kuvunja, au kutenganisha kitu kinachofunga. “Tuzikate” ni cha kawaida na chenye nguvu katika Kiswahili, na kinaendana na taswira ya kujiondoa katika vizuizi.
- source_word: מֹוסְרוֹתֵימוֹ
  choice: pingu zao
  rationale: Nomino hii ya wingi humaanisha vifungo au vyombo vya kuzuia. “Pingu” inatoa taswira halisi na wazi ya kufungwa bila kueleza ikiwa utawala unaokataliwa ni wa ukandamizaji au la.
- source_word: וְנַשְׁלִיכָה
  choice: na tuzitupilie mbali
  rationale: Hiki pia ni kitenzi cha nafsi ya kwanza wingi kinachoonyesha azimio. “Tuzitupilie mbali” huwasilisha kwa Kiswahili cha kawaida tendo la kuviondoa kwa nguvu na kuvikataa.
- source_word: מִמֶּנּוּ
  choice: mbali
  rationale: Kiambishi hiki kinaonyesha kuondoa vitu hivyo kutoka kwa wasemaji. Katika muundo “tuzitupilie mbali,” wazo la kuviondoa kutoka kwao linawasilishwa kwa Kiswahili cha kawaida; tanbihi [c] inatoa muundo unaosema “kutoka kwetu” waziwazi.
- source_word: עֲבֹתֵימוֹ
  choice: kamba zao
  rationale: Nomino hii humaanisha kamba, hasa kamba imara au nene. “Kamba” ni neno la kawaida linalohifadhi taswira halisi na usambamba wake na “pingu.”
theological_decisions:
- issue: Taswira ya vizuizi vya Mungu na mfalme wake
  choice: Taswira imetafsiriwa kwa vitu halisi vya kufungia, yaani “pingu” na “kamba,” bila kuitafsiri wazi kuwa ukandamizaji au ukombozi.
  alternative: Kutumia maneno ya jumla zaidi kama “vifungo” na “minyororo.”
  rationale: Katika muktadha, mataifa yanamkataa BWANA na Mtiwa-Mafuta wake, lakini mstari huu unanukuu mtazamo wao kwa lugha ya kishairi. Tafsiri halisi ya taswira inadumisha nguvu na mvutano wa kifungu bila kuongeza hukumu ya kimafundisho ndani ya maneno yao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Wingi wa nafsi ya kwanza umehifadhiwa katika “tuzikate” na “tuzitupilie,” huku mistari miwili ikidumisha usambamba wa ushairi wa Kiebrania.
