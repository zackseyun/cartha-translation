lexical_decisions:
- source_word: עִבְדוּ
  choice: Mtumikieni
  rationale: Amri ya wingi ya עבד. Kuhusiana na Yahweh, inahusu kumtumikia kwa utii na uaminifu, bila kuifupisha maana yake kuwa ibada ya kidini pekee.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama ‘BWANA’.
- source_word: בְּיִרְאָה
  choice: kwa hofu
  rationale: יִרְאָה inaweza kumaanisha hofu, kicho, au uchaji. ‘Kwa hofu’ ni tafsiri ya moja kwa moja na inadumisha uzito wa kunyenyekea mbele ya mamlaka ya Mungu.
- source_word: וְגִילוּ
  choice: na mshangilie
  rationale: גיל huonyesha shangwe au kufurahi kwa nguvu. ‘Mshangilie’ linaakisi nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: בִּרְעָדָה
  choice: kwa kutetemeka
  rationale: רְעָדָה ni kutetemeka au kutikisika kunakotokana na hofu au kicho. Tafsiri hii inadumisha mvutano wake na amri ya kushangilia.
theological_decisions:
- issue: Kuonyesha kwa pamoja shangwe na kunyenyekea kwa hofu
  choice: 'Amri zote mbili zimedumishwa: ‘Mtumikieni Yahweh kwa hofu, na mshangilie kwa kutetemeka.’'
  alternative: Kulainisha kuwa ‘Mwabuduni Yahweh kwa uchaji, na kufurahi kwa kicho.’
  rationale: Kiebrania kinaweka shangwe na kutetemeka pamoja bila kuondoa mvutano huo; tafsiri haipaswi kuuelekeza upande mmoja tu.
- issue: Tafsiri ya יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: ‘Yahweh’ huhifadhi jina binafsi la Mungu lililo katika matini ya Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. Muundo wa amri za wingi umehifadhiwa, na mvutano wa kishairi kati ya hofu, shangwe, na kutetemeka haujalainishwa.
