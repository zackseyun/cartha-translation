  text: Yeye anayeketi mbinguni anacheka; Bwana anawadhihaki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: anayetawala akiwa ameketi
  rationale: Kitenzi-shirikishi hiki kimsingi humaanisha ‘anayeketi’ au ‘anayekaa.’ Katika muktadha wa kifalme wa Zaburi hii, kuketi kunaashiria utawala; tafsiri hii inadumisha picha halisi ya kuketi huku ikionyesha wazo la enzi bila kutumia neno lisilo la kawaida.
- source_word: בַּשָּׁמַיִם
  choice: mbinguni
  rationale: Ingawa umbo la Kiebrania ni la wingi, ‘mbinguni’ ndilo neno la kawaida na lenye hadhi katika Kiswahili kwa makao ya Mungu; halipunguzi maana kuwa anga la kimwili tu.
- source_word: יִשְׂחָק
  choice: anacheka
  rationale: Kauli ya wakati uliopo inaleta uhai wa kishairi na kuhifadhi maana ya msingi ya kitenzi. Dharau yake inaonekana wazi kutokana na muktadha na kitenzi kinachofuata.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Hili ni jina la cheo אֲדֹנָי, wala si jina la Mungu YHWH. ‘Bwana’ ni tafsiri ya kawaida, ya heshima, na inayofaa katika mtindo wa Zaburi.
- source_word: יִלְעַג
  choice: anawadhihaki
  rationale: ‘Kudhihaki’ huwasilisha wazi maana ya kufanya kejeli au kuonyesha dharau, na inafaa katika lugha ya sasa yenye hadhi.
- source_word: לָמוֹ
  choice: wa- katika ‘anawadhihaki’
  rationale: Kiwakilishi kinawarejelea waasi waliotajwa katika mistari iliyotangulia. Kiswahili hukitia kwa kawaida ndani ya kitenzi kama kiambishi cha yambwa.
theological_decisions:
- issue: Taswira ya Mungu kama mfalme na lugha inayomwelezea kwa matendo ya kibinadamu
  choice: Kuhifadhi picha ya Mungu akiwa ameketi na kutawala, pamoja na vitenzi ‘anacheka’ na ‘anawadhihaki.’
  alternative: Yeye aketiye mbinguni anacheka; Bwana anawafanyia kejeli.
  rationale: Mstari unasisitiza mamlaka kuu ya Mungu mbele ya watawala waasi. Tafsiri haipaswi kuondoa taswira ya kuketi wala kueleza upya kucheka na kudhihaki kwa lugha dhahania; pia haipaswi kulazimisha maana ya kifalme kiasi cha kufuta picha halisi ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Yeye’ huweka mkazo unaolingana na kishazi cha Kiebrania; ‘aketiye’ limehifadhiwa katika tanbihi kama mbadala mfupi na rasmi zaidi.
