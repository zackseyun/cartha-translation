  text: וְ֭/עַתָּה מְלָכִ֣ים הַשְׂכִּ֑ילוּ הִ֝וָּסְר֗וּ שֹׁ֣פְטֵי אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/010.yaml
  text: So now[a], O kings, be wise; be warned, O judges of the earth.
translation:
  language: sw
  text: Kwa hiyo sasa, enyi wafalme, tendeni kwa hekima; kubalini kuonywa,[a] enyi waamuzi wa dunia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kubalini kufundishwa” au “kubalini kurekebishwa.” Kitenzi cha Kiebrania kinaweza kumaanisha kupokea nidhamu, mafundisho, au maonyo, wala si kuonywa tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huonyesha hitimisho linalotokana na mistari iliyotangulia huku likihifadhi maana ya wakati ya ‘sasa’; ni mpito wa kawaida na wenye uzito katika Kiswahili.
- source_word: מְלָכִים
  choice: enyi wafalme
  rationale: Nomino hii ni wito wa moja kwa moja. ‘Enyi’ huonyesha wazi wingi na sauti ya kishairi yenye heshima bila kuwa ya kizamani kupita kiasi.
- source_word: הַשְׂכִּילוּ
  choice: fanyeni kwa hekima
  rationale: Amri ya Hifili kutoka שכל inaweza kuhusisha kupata ufahamu na kutenda kwa busara. ‘Fanyeni kwa hekima’ huwasilisha hekima inayodhihirika katika mwenendo bila kupunguza wito huu kuwa hali ya akili pekee.
- source_word: הִוָּסְרוּ
  choice: kubalini kuonywa
  rationale: Amri ya Nifali kutoka יסר humaanisha kupokea maonyo, mafundisho, nidhamu, au marekebisho. ‘Kubalini kuonywa’ huhifadhi wazo la kupokea onyo na nguvu ya nasaha katika muktadha huu.
- source_word: שֹׁפְטֵי אָרֶץ
  choice: enyi waamuzi wa dunia
  rationale: ‘Waamuzi’ huhifadhi kazi mahususi ya שפט badala ya kuipanua kuwa ‘watawala.’ ‘Dunia’ inafaa upeo wa kimataifa wa Zaburi ya 2 kuliko ‘nchi.’
