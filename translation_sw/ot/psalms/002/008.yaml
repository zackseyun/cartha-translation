source:
  edition: WLC
  text: שְׁאַ֤ל מִמֶּ֗/נִּי וְ/אֶתְּנָ֣ה ג֭וֹיִם נַחֲלָתֶ֑/ךָ וַ֝/אֲחֻזָּתְ/ךָ֗ אַפְסֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/008.yaml
  text: Ask of me[a], and I will give the nations as your inheritance, and the ends of the earth as your possession.
translation:
  language: sw
  text: Niombe, nami nitakupa mataifa kuwa urithi wako, na miisho ya dunia[a] kuwa milki yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu za mbali zaidi za dunia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאַל מִמֶּנִּי
  choice: Niombe
  rationale: Kauli ya kuamuru kwa nafsi ya pili umoja pamoja na מִמֶּנִּי humwelekeza anayeambiwa aombe kwa msemaji. “Niombe” ni fupi, ya kawaida, na inahifadhi wito wa moja kwa moja.
- source_word: וְאֶתְּנָה
  choice: nami nitakupa
  rationale: Umbo la hiari/cohortative baada ya amri linaeleza jibu la ahadi. “Nami nitakupa” linaonyesha ahadi hiyo bila kulazimisha maana ya kusudi.
- source_word: גּוֹיִם
  choice: mataifa
  rationale: Neno hili humaanisha mataifa au makundi ya watu; “mataifa” linafaa kwa upeo wa kimataifa bila kuingiza tofauti ya baadaye ya Wayahudi na watu wa mataifa.
- source_word: נַחֲלָתֶךָ
  choice: kuwa urithi wako
  rationale: נַחֲלָה ni urithi au sehemu iliyogawiwa kuwa mali. “Kuwa urithi wako” linaweka wazi uhusiano wa mataifa na urithi katika Kiswahili asilia.
- source_word: וַאֲחֻזָּתְךָ
  choice: kuwa milki yako
  rationale: אֲחֻזָּה ni kitu kinachomilikiwa au eneo la milki. “Milki” linatofautisha neno hili na “urithi” huku likihifadhi usambamba wa kishairi.
- source_word: אַפְסֵי אָרֶץ
  choice: miisho ya dunia
  rationale: Kirai hiki ni nahau ya mipaka au sehemu za mbali kabisa za dunia. “Miisho ya dunia” ni sahihi, ya kifasihi, na inaeleweka katika Kiswahili cha kawaida.
theological_decisions:
- issue: Upeo wa kifalme au wa Kimasihi wa ahadi
  choice: Kutafsiri moja kwa moja kama ahadi kwa mfalme/mwana anayeambiwa bila kutaja wazi tafsiri ya Kimasihi.
  alternative: Kutumia maneno yanayomtambulisha anayeambiwa waziwazi kuwa Masiya.
  rationale: Kiebrania chenyewe kinatoa ahadi ya utawala mpana kwa mwana/mfalme anayeambiwa. Tafsiri hii inadumisha uwezekano wa usomaji wa kifalme na wa Kimasihi bila kuamua jambo hilo ndani ya mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Nami” huhifadhi muunganiko wa amri na ahadi; “urithi” na “milki” huhifadhi usambamba wa nomino mbili tofauti za Kiebrania.
