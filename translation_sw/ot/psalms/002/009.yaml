  text: Utawavunja kwa fimbo ya enzi ya chuma[a][b]; utawavunja vipandevipande kama chombo cha mfinyanzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata usomaji mwingine wa maandishi unaoonekana katika baadhi ya tafsiri za kale na unaoakisiwa katika Ufunuo: “Utawachunga kwa fimbo ya enzi ya chuma” au “Utawatawala kwa fimbo ya enzi ya chuma.”'
