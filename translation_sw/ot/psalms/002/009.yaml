lexical_decisions:
- source_word: תְּרֹעֵם
  choice: utawavunja
  rationale: Uwekaji wa irabu katika Mapokeo ya Kimasoreti na ulinganifu na תְּנַפְּצֵם vinaunga mkono maana ya kuvunja katika hukumu. Mapokeo mengine ya kale yanayodokeza kuchunga au kutawala yamehifadhiwa katika tanbihi.
- source_word: בְּשֵׁבֶט
  choice: kwa fimbo ya enzi
  rationale: שֵׁבֶט inaweza kuwa fimbo, gongo, au alama ya mamlaka ya kifalme. Katika muktadha huu wa kifalme, “fimbo ya enzi” huonyesha mamlaka ya mfalme huku ikibaki chombo cha hukumu.
- source_word: בַּרְזֶל
  choice: ya chuma
  rationale: Ni jina la kawaida la metali linalosisitiza uimara na ukali wa fimbo hiyo.
- source_word: כִּכְלִי יוֹצֵר
  choice: kama chombo cha mfinyanzi
  rationale: כְּלִי ni chombo kwa maana pana, na pamoja na יוֹצֵר humaanisha kwa kawaida chombo kilichotengenezwa na mfinyanzi.
- source_word: תְּנַפְּצֵם
  choice: utawavunjavunja
  rationale: Kitenzi hiki huonyesha kuvunja kwa nguvu vipandevipande. “Utawavunjavunja” ni Kiswahili cha kawaida, chenye uzito, na kinafaa kwa mfano wa chombo cha udongo.
theological_decisions:
- issue: Je, kitenzi cha kwanza kinaonyesha utawala wa kifalme au hukumu ya kuangamiza?
  choice: 'Hukumu: “Utawavunja”'
  alternative: Utawachunga au utawatawala
  rationale: Uwekaji wa irabu wa Maandiko ya Kimasoreti na mstari sambamba wa “utawavunjavunja” vinaelekeza kwenye hukumu ya kuangamiza. Hata hivyo, usomaji wa kuchunga au kutawala una ushahidi katika baadhi ya mapokeo ya kale na unanukuliwa katika Ufunuo, kwa hiyo umewekwa katika tanbihi bila kuondoa mvutano wa kimaandiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Fimbo ya enzi” imetumiwa badala ya neno lisilo la kawaida zaidi ili kuunganisha wazi mamlaka ya kifalme na taswira ya hukumu.
