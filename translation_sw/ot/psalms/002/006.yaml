source:
  edition: WLC
  text: וַ֭/אֲנִי נָסַ֣כְתִּי מַלְכִּ֑/י עַל צִ֝יּ֗וֹן הַר קָדְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/006.yaml
  text: But as for me[a], I have installed my king on Zion, my holy mountain.
translation:
  language: sw
  text: Lakini mimi nimemweka rasmi[a] mfalme wangu juu ya Sayuni, mlima wangu mtakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nimemweka” au “nimemsimika”; wengine huelewa kitenzi hiki kuwa “nimemtia mafuta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Lakini mimi
  rationale: Kiunganishi pamoja na kiwakilishi huru kinasisitiza tofauti kati ya uasi wa mataifa na hatua ya Bwana; “Lakini mimi” ni Kiswahili cha kawaida kinachohifadhi tofauti na msisitizo huo.
- source_word: נָסַכְתִּי
  choice: nimemweka rasmi
  rationale: Katika muktadha huu kitenzi kinaelekea kumaanisha kumweka au kumsimika mfalme katika nafasi yake. “Nimemweka rasmi” linaeleweka kwa urahisi na linaonyesha uteuzi wa kifalme bila kulifanya tendo hilo kuwa lazima ni ibada ya kutia mafuta.
- source_word: מַלְכִּי
  choice: mfalme wangu
  rationale: 'Nomino yenye kiambishi cha nafsi ya kwanza umoja ina maana ya moja kwa moja ya umilikaji: “mfalme wangu.”'
- source_word: עַל
  choice: juu ya
  rationale: Hapa kihusishi kinaonyesha mahali alipo mfalme, yaani juu ya Mlima Sayuni, si hasa mamlaka yake juu ya Sayuni.
- source_word: צִיּוֹן
  choice: Sayuni
  rationale: Hili ndilo umbo la kawaida la jina hili la mahali katika Kiswahili cha Biblia.
- source_word: הַר קָדְשִׁי
  choice: mlima wangu mtakatifu
  rationale: Hili ni tafsiri ya kawaida na ya asili ya kirai cha Kiebrania, huku “mlima” likiakisi הַר moja kwa moja.
theological_decisions:
- issue: Iwapo נָסַכְתִּי litafsiriwe kwa maana ya ibada ya kutia mafuta au ya kumweka mfalme rasmi
  choice: Kumweka mfalme rasmi
  alternative: Kumtia mafuta mfalme; au kumweka tu
  rationale: Muktadha unahusu jibu la Bwana kwa wafalme waasi kwa kumweka mtawala wake Sayuni. Tafsiri hii huhifadhi maana ya uteuzi au usimikaji wa kifalme bila kuchanganya kitenzi hiki na kitenzi cha kawaida cha Kiebrania cha kutia mafuta. Pia hailazimishi mapema ufasiri mwembamba wa kimasiya au wa kiibada.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nimemweka rasmi” ni wazi kwa wasomaji wa kawaida; “Sayuni” na “mlima wangu mtakatifu” vinafuata matumizi ya kawaida ya Biblia ya Kiswahili.
