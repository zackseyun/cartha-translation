  yaml_path: translation/ot/psalms/002/002.yaml
  text: The kings of the earth take their stand[b][a], and rulers gather together against Yahweh and against his Anointed.
translation:
  language: sw
  text: Wafalme wa dunia wanajipanga, na watawala wanaungana pamoja dhidi ya Yahwe na dhidi ya mtiwa mafuta wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Masihi wake.” Kauli “wanaungana pamoja” inaweza pia kutafsiriwa “wanakusanyika pamoja” au “wanafanya shauri pamoja”; inaonyesha hatua ya pamoja iliyoratibiwa katika upinzani.
    reason: lexical_and_theological_alternatives
lexical_decisions:
- source_word: יִתְיַצְּבוּ
  choice: wanajipanga
  rationale: Hitpaeli ya יצב inaonyesha kujiweka katika msimamo kwa makusudi; katika muktadha huu ni msimamo wa upinzani. “Wanajipanga” ni ya kawaida na huhifadhi wazo la hatua ya kujielekeza kwa kusudi.
- source_word: מַלְכֵי אֶרֶץ
  choice: wafalme wa dunia
  rationale: Muundo huu una upeo mpana wa kisiasa katika Zaburi 2, hivyo “dunia” inafaa zaidi kuliko “nchi” au “ardhi” hapa.
- source_word: רוֹזְנִים
  choice: watawala
  rationale: Neno hili humaanisha viongozi au maafisa wakuu wa kisiasa; “watawala” ni wazi, la kisasa, na pana bila kulifanya kuwa “wakuu” au “wana wa kifalme” pekee.
- source_word: נוֹסְדוּ יָחַד
  choice: wanaungana pamoja
  rationale: Kauli hii inaonyesha hatua iliyoratibiwa na ya pamoja. “Wanaungana pamoja” huhifadhi ushirika wao katika upinzani bila kulazimisha maana kali zaidi ya “wanafanya njama.”
- source_word: עַל
  choice: dhidi ya
  rationale: Katika muktadha huu wa uasi, kihusishi kina maana ya upinzani, kwa hiyo “dhidi ya” huwasilisha nguvu yake vizuri.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limewasilishwa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: מְשִׁיחוֹ
  choice: Mtiwa-Mafuta wake
  rationale: Kiebrania humaanisha moja kwa moja “mtiwa-mafuta wake.” Hii huhifadhi maana ya kifalme ya karibu pamoja na uwezekano wake mpana wa Kimasihi bila kuamua kimya kimya kwamba hapa lazima litafsiriwe kwa cheo “Masihi.”
theological_decisions:
- issue: Jinsi ya kutafsiri מְשִׁיחוֹ katika zaburi yenye rejeo la karibu kwa mfalme wa Daudi na mwelekeo mpana wa Kimasihi
  choice: Mtiwa-Mafuta wake
  alternative: Masihi wake
  rationale: “Mtiwa-Mafuta wake” ndiyo maana ya moja kwa moja ya Kiebrania na huhifadhi mvutano kati ya mfalme aliyetiwa mafuta katika mazingira ya zaburi na usomaji mpana wa Kimasihi. Mbadala “Masihi wake” unawezekana, lakini unaelekeza tafsiri zaidi kwenye cheo cha Kimasihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Wanajipanga” na “wanaungana pamoja” ni misemo ya sasa inayohifadhi hatua ya makusudi na ya pamoja. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusiana na maelezo hayo.
