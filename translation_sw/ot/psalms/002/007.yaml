base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/007.yaml
  text: 'I will declare the decree of Yahweh: He said to me[a], “You are my Son[b]; today I have begotten you.”'
translation:
  language: sw
  text: 'Nitatangaza agizo la Yahwe: Aliniambia, “Wewe ni Mwanangu[a]; leo nimekuzaa[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wewe ni mwanangu.” Kiebrania hakitofautishi herufi kubwa na ndogo; maandishi makuu yanatumia “Mwanangu” ili kuonyesha umuhimu wa kifalme na wa Kimasihi wa mstari huu katika muktadha wake na katika matumizi ya baadaye ya kikanoni.
    reason: alternative_reading
  - marker: b
    text: Au “leo nimekuwa baba yako.” Kiebrania kinatumia lugha ya kuzaa moja kwa moja, ambayo inaweza kuibua taswira ya kutawazwa kifalme au kufanywa mwana; lugha hiyo imehifadhiwa katika maandishi makuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפְּרָה
  choice: Nitatangaza
  rationale: Kitenzi hiki kinaanzisha tangazo rasmi na lenye mamlaka; “nitatangaza” kinafaa kwa muktadha wa kifalme kuliko “nitasimulia” au “nitasema.”
- source_word: אֶל חֹק
  choice: agizo
  rationale: Katika muktadha wa kutawazwa kwa mfalme, חֹק ni tamko lililowekwa na lenye mamlaka. Kiswahili cha “agizo” ni cha kawaida na huhifadhi nguvu hiyo bila kufanya mstari usikike kama sheria ya jumla.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: אָמַר אֵלַי
  choice: Aliniambia
  rationale: Hii ni tafsiri ya asili na fasaha ya “alisema kwangu”; kiima kinarejelea Yahwe aliyetajwa mara moja kabla.
- source_word: בְּנִי אַתָּה
  choice: Wewe ni Mwanangu
  rationale: Muundo huu huhifadhi kauli ya uhusiano wa mwana wa kifalme. Herufi kubwa katika “Mwanangu” huonyesha uzito wa kifalme na wa Kimasihi katika muktadha wa kikanoni, huku tanbihi ikihifadhi uwezekano wa herufi ndogo kwa kuwa Kiebrania hakitofautishi herufi kubwa na ndogo.
- source_word: הַיּוֹם
  choice: leo
  rationale: Ni tafsiri ya moja kwa moja, ya sasa na ya kawaida inayohifadhi msisitizo wa wakati.
- source_word: יְלִדְתִּיךָ
  choice: nimekuzaa
  rationale: Kitenzi ילד hutumia taswira halisi ya kuzaa. “Nimekuzaa” huhifadhi taswira hiyo na mvutano wake wa kiteolojia bila kuifafanua kuwa kutawazwa, kufanywa mwana, au kutimizwa kwa unabii pekee.
theological_decisions:
- issue: Uwana wa kifalme na maana ya Kimasihi ya בְּנִי
  choice: Wewe ni Mwanangu
  alternative: Wewe ni mwanangu
  rationale: Muktadha wa karibu unamhusu mfalme wa Daudi, na matumizi ya baadaye ya kikanoni yanaona maana ya Kimasihi. Herufi kubwa huashiria uzito huo bila kubadili maana ya neno; tanbihi inaweka wazi kwamba maandishi ya Kiebrania yenyewe hayaamui matumizi ya herufi kubwa.
- issue: Maana ya “leo nimekuzaa”
  choice: leo nimekuzaa
  alternative: leo nimekuwa baba yako
  rationale: Tafsiri kuu huhifadhi lugha ya kuzaa iliyomo katika Kiebrania na haichagui kimya kimya kati ya taswira za kutawazwa kifalme, kufanywa mwana katika agano, au utimilifu wa Kimasihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Yahwe” huhifadhi jina la Mungu. Sentensi ni fupi na rasmi kulingana na tangazo la kifalme. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
