  yaml_path: translation/ot/psalms/072/001.yaml
  text: Of Solomon[a]. O God, give your judgments to the king[b], and your righteousness to the king’s son.
translation:
  language: sw
  text: 'Ya Sulemani[a].


    Ee Mungu, mpe mfalme hukumu zako,

    na mwana wa mfalme haki yako[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kwa ajili ya Sulemani” au “Kwa Sulemani” katika kichwa cha zaburi.
    reason: alternative_reading
  - marker: b
    text: “Haki yako” inaweza pia kutafsiriwa “uadilifu wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹמֹה
  choice: Ya Sulemani
  rationale: Kiambishi ל־ katika kichwa cha zaburi kinaweza kuonyesha uandishi, kuwekwa wakfu, au uhusiano. “Ya Sulemani” ni kichwa cha kawaida na kifupi kinachohifadhi kiasi cha utata huo; maana nyingine zinawekwa katika tanbihi.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Nomino hii imetumiwa kama mwito wa moja kwa moja katika sala; “Ee Mungu” huonyesha hali hiyo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: מִשְׁפָּטֶיךָ
  choice: hukumu zako
  rationale: מִשְׁפָּטֶיךָ ni wingi na inaweza kumaanisha hukumu, maamuzi ya kisheria, au haki ya kuhukumu. “Hukumu zako” huhifadhi umbo la wingi na wazo la uwezo wa kifalme wa kuamua kwa haki.
- source_word: לְמֶלֶךְ
  choice: mfalme
  rationale: Katika muundo wa Kiswahili, kitenzi “mpe” tayari kinaonyesha kwamba mfalme ndiye mpokeaji, hivyo hakuna haja ya kuongeza kihusishi.
- source_word: תֵּן
  choice: mpe
  rationale: Amri hii inamwomba Mungu amkabidhi mfalme kitu. “Mpe” ni tafsiri ya moja kwa moja na ya kawaida, huku ikionyesha mpokeaji kwa usahihi.
- source_word: וְצִדְקָתְךָ
  choice: na ... haki yako
  rationale: צְדָקָה linaweza kueleza haki ya kimaadili au uadilifu wa kutoa hukumu. “Haki yako” huhifadhi upana huo bila kuifungia maana katika eneo la sheria pekee.
- source_word: לְבֶן־מֶלֶךְ
  choice: mwana wa mfalme
  rationale: Hii ni tafsiri ya moja kwa moja ya muundo wa nomino unaoweza kumaanisha mrithi wa kifalme au kuwa usemi sambamba unaomhusu mfalme katika ukoo wake.
theological_decisions:
- issue: Utambulisho wa “mfalme” na “mwana wa mfalme”
  choice: Kuhifadhi lugha halisi ya sala ya kifalme bila kumtambulisha wazi mhusika kuwa Masihi katika matini kuu.
  alternative: Kuiona kuwa sala mahsusi kwa ajili ya Sulemani, au sala ya nasaba yenye utimilifu wa Kimasihi unaozidi Sulemani.
  rationale: Mstari wenyewe hauamui ikiwa anayelengwa ni Sulemani peke yake, mfalme wa ukoo wa Daudi kwa ujumla, au Masihi kwa maana ya kiishara. Lugha ya kifalme imehifadhiwa ili kutoondoa mvutano huo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sala ulio wa kawaida, wenye hadhi, na unaoeleweka kwa wasomaji wa leo. Usambamba wa kishairi na mpangilio wa vipashio vya Kiebrania umehifadhiwa kadiri Kiswahili cha asili kinavyoruhusu.
