  text: May he judge your people with righteousness[b][a], and your afflicted ones with justice.
translation:
  language: sw
  text: Na awahukumu[a] watu wako kwa uadilifu, na wanyonge wako kwa haki.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Atawahukumu watu wako kwa uadilifu.” Kitenzi cha Kiebrania hapa kinaweza kueleweka kama ombi au kama taarifa kuhusu wakati ujao.
    reason: alternative_reading
  - marker: b
    text: Au, “maskini wako,” “wenye shida wako,” “walioteswa wako,” au “walioonewa wako.” Neno la Kiebrania linaweza kumaanisha maskini, wenye shida, walioteswa, au walioonewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדִין
  choice: Na awahukumu
  rationale: Qal imperfect ya nafsi ya tatu umoja inaweza kuwa ombi/takio au taarifa ya wakati ujao. Katika muktadha wa sala ya kifalme, ‘Na awahukumu’ huwasilisha nguvu ya ombi kwa Kiswahili cha kawaida.
- source_word: עַמְּךָ
  choice: watu wako
  rationale: עם pamoja na kiambishi cha nafsi ya pili umoja humaanisha moja kwa moja ‘watu wako’ na huhifadhi maana ya jamii ya agano.
- source_word: בְצֶדֶק
  choice: kwa uadilifu
  rationale: צדק hapa inaeleza unyoofu wa kimaadili katika kuhukumu. ‘Kwa uadilifu’ ni lugha ya asili na yenye heshima, huku ikitofautishwa na משפט katika kishazi kinachofuata.
- source_word: וַעֲנִיֶּיךָ
  choice: na walioonewa wako
  rationale: עני inaweza kumaanisha maskini, wenye shida, walioteswa au walioonewa. ‘Walioonewa’ huonyesha udhaifu na mateso ya kijamii bila kuifunga maana kwenye umaskini wa kiuchumi pekee.
- source_word: בְמִשְׁפָּט
  choice: kwa haki
  rationale: משפט hapa ni hukumu ya haki au utekelezaji wa haki. ‘Kwa haki’ ni wazi na ya kawaida katika Kiswahili, na huepuka urudiaji mzito wa neno ‘hukumu’.
theological_decisions:
- issue: 'Nguvu ya kitenzi cha mwanzo: ombi/takio au unabii wa wakati ujao'
  choice: 'Imetafsiriwa kama ombi: ‘Na awahukumu’'
  alternative: ‘Atawahukumu watu wako kwa uadilifu’
  rationale: Zaburi inaanza kama sala kwa ajili ya mfalme, hivyo usomaji wa ombi unafaa vizuri. Tanbihi huhifadhi uwezekano halisi wa Kiebrania kusomwa kama taarifa ya wakati ujao.
