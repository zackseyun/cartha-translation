base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/008.yaml
  text: May he rule from sea to sea[b][a], and from the River to the ends of the earth.
translation:
  language: sw
  text: Na atawale kutoka bahari hadi bahari, na kutoka Mto ule[a] hadi miisho ya dunia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mto ule” yaelekea ni Mto Frati, uliotumiwa mara nyingi katika Biblia kama mpaka wa kijiografia.
    reason: cultural_note
  - marker: b
    text: Au, “Atatawala kutoka bahari hadi bahari, na kutoka Mto ule hadi miisho ya dunia.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֵרְדְּ
  choice: Na atawale
  rationale: Kitenzi רדה kina maana ya ‘kutawala’ au ‘kuwa na mamlaka’. Katika muktadha huu wa sala kwa ajili ya mfalme, ‘atawale’ linaonyesha kwa kawaida nguvu ya ombi au matakwa ya hali ya utegemezi bila kulazimisha maana ya unabii wa wakati ujao.
- source_word: מִיָּם ... עַד יָם
  choice: kutoka bahari hadi bahari
  rationale: Usemi huu wa kishairi unaonyesha upana wa utawala. Tafsiri hii ni ya asili katika Kiswahili, inadumisha urari wa kishairi, na haitaji bahari mahususi ambazo Kiebrania hakizitaji.
- source_word: וּמִנָּהָר
  choice: na kutoka ule Mto
  rationale: נהר hapa limetumiwa kwa maana ya mto unaojulikana katika jiografia ya Biblia, yaelekea Frati. ‘Ule Mto’ huhifadhi namna ya Kiebrania badala ya kuingiza jina Frati katika matini kuu; herufi kubwa inaashiria kuwa ni jina la mpaka wa kijiografia unaotambulika.
- source_word: עַד אַפְסֵי אָרֶץ
  choice: hadi miisho ya dunia
  rationale: אַפְסֵי humaanisha ncha au sehemu za mwisho. ‘Miisho ya dunia’ ni usemi wa Kiswahili ulio wazi unaohifadhi upeo mpana wa kijiografia na kishairi wa Kiebrania.
theological_decisions:
- issue: Nguvu ya kitenzi cha imperfect/jussive katika zaburi ya kifalme
  choice: 'Imetafsiriwa kama ombi au matakwa: ‘Na atawale’'
  alternative: 'Inaweza kutafsiriwa kama wakati ujao wa uhakika: ‘Atatawala’'
  rationale: Muundo wa kitenzi unaweza kuwa na nguvu ya jussive katika sala inayomwombea mfalme. ‘Na atawale’ huhifadhi sauti ya maombi ya zaburi bila kufunga uwezekano wa mwangwi mpana wa Kimasihi. Tafsiri ya kiutabiri imehifadhiwa katika tanbihi kwa sababu muundo huo pia umeeleweka hivyo katika mapokeo mengi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na urari wa vifungu viwili umehifadhiwa. ‘Ule Mto’ ni wa kawaida zaidi katika Kiswahili kuliko ‘Mto’ peke yake kama jina maalumu, huku tanbihi ikifafanua rejeo linalowezekana.
