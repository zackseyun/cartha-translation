base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/000.yaml
  text: Of Solomon.[a] O God, give your justice to the king, and your righteousness[b] to the king's son.
translation:
  language: sw
  text: 'Ya Sulemani.[a]


    Ee Mungu, mpe mfalme hukumu zako,

    na mwana wa mfalme haki yako.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kwa ajili ya Sulemani” au “Kwa Sulemani” katika kichwa cha zaburi.
    reason: alternative_reading
  - marker: b
    text: “Haki yako” pia inaweza kutafsiriwa “uadilifu wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹמֹה
  choice: Ya Sulemani
  rationale: Kiambishi לְ katika kichwa cha zaburi kinaweza kuonyesha uandishi, uhusiano, wakfu, au kwamba zaburi ni kwa ajili ya Sulemani; 'Ya Sulemani' ni fupi na ya kawaida huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: מִשְׁפָּטֶיךָ
  choice: hukumu zako
  rationale: Wingi wa neno hili unamaanisha hukumu, maamuzi, au kanuni za haki za Mungu. 'Hukumu zako' huhifadhi wingi wa Kiebrania na kutofautisha neno hili na צִדְקָתְךָ.
- source_word: צִדְקָתְךָ
  choice: haki yako
  rationale: Neno linaweza kuhusisha uadilifu na utekelezaji wa haki; 'haki yako' ni lugha ya asili na yenye hadhi, na tanbihi inaonyesha uwezekano wa 'uadilifu wako'.
- source_word: בֶן־מֶלֶךְ
  choice: mwana wa mfalme
  rationale: Tafsiri ya moja kwa moja huhifadhi namna ambavyo mstari wa pili unamtaja mrithi au mwana wa kifalme bila kumtambulisha zaidi.
theological_decisions:
- issue: Uhusiano wa Sulemani na zaburi
  choice: Ya Sulemani
  alternative: Kwa ajili ya Sulemani / Kwa Sulemani
  rationale: Kiebrania hakilazimishi maana moja ya לְ; tafsiri kuu haidai kwa uhakika kwamba Sulemani ndiye mwandishi, na tanbihi huhifadhi maana nyingine.
- issue: Tofauti kati ya hukumu na haki katika mistari inayolingana
  choice: hukumu zako ... haki yako
  alternative: haki yako ... uadilifu wako
  rationale: Chaguo hili huhifadhi tofauti ya msamiati wa Kiebrania na mvutano wa kishairi bila kuyafanya maneno yote mawili kuwa sawa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kishairi na ulinganifu wa Kiebrania umehifadhiwa; 'Ee Mungu' huonyesha mwito wa moja kwa moja.
