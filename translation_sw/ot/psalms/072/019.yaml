base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/019.yaml
  text: And blessed be his glorious name forever[a], and may his glory fill the whole earth[b]. Amen and amen.
translation:
  language: sw
  text: Na jina lake tukufu libarikiwe milele[a], na utukufu wake uijaze dunia nzima[b]. Amina, na Amina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi, “jina la utukufu wake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “dunia yote.” Neno la Kiebrania linaweza pia kumaanisha “nchi yote,” lakini hapa muktadha unaonyesha dunia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: Na ... libarikiwe
  rationale: Kauli ya baraka katika hitimisho hili ina nguvu ya ombi au tamko la ibada. Hivyo, “libarikiwe” ni ya asili katika Kiswahili na huhifadhi maana hiyo kuliko kauli tambarare ya taarifa.
- source_word: שֵׁם כְּבוֹדוֹ
  choice: jina lake lenye utukufu
  rationale: Muundo wa Kiebrania ni, kwa karibu zaidi, “jina la utukufu wake.” Tafsiri hii ya Kiswahili ni ya asili na inaonyesha kwamba jina lake lina sifa ya utukufu, huku tafsiri ya karibu zaidi ikiwekwa katika tanbihi.
- source_word: לְעוֹלָם
  choice: milele
  rationale: “Milele” ni usemi wa kawaida, wenye heshima, unaowasilisha kudumu bila mwisho katika muktadha huu wa sifa.
- source_word: וְיִמָּלֵא
  choice: na ... uijaze
  rationale: 'Katika muktadha wa dua ya sifa, kitenzi kimewasilishwa kama ombi: utukufu wake na uijaze dunia. Muundo huu pia hufuata mpangilio wa maneno unaoweka “utukufu wake” kabla ya “dunia nzima.”'
- source_word: כְבוֹדוֹ
  choice: utukufu wake
  rationale: “Utukufu” linafaa zaidi kwa כבוד katika muktadha wa ibada na hudumisha uzito wa ukuu na heshima ya Mungu.
- source_word: אֶת כֹּל הָאָרֶץ
  choice: dunia nzima
  rationale: Katika kilele hiki chenye upeo wa ulimwengu wote, הָאָרֶץ linaeleweka kama dunia, na כֹּל huonyesha ukamilifu wake. “Dunia nzima” ni Kiswahili cha kawaida na chenye uwazi.
- source_word: אָמֵן וְאָמֵן
  choice: Amina na amina
  rationale: Urudiaji wa tamko la kiliturujia umehifadhiwa ili kudumisha mkazo na mwangwi wa ibada wa Kiebrania.
theological_decisions:
- issue: Upeo wa הָאָרֶץ
  choice: dunia nzima, kwa maana ya upeo wa ulimwengu wote
  alternative: nchi yote, kwa maana ya eneo fulani
  rationale: Muktadha wa zaburi na hitimisho lake la sifa unaelekeza kwenye utukufu wa Mungu unaoenea ulimwenguni kote. Hata hivyo, maana ya msingi ya הָאָרֶץ inaweza pia kuwa “nchi”; uwezekano huo unatambuliwa bila kuufanya kuwa tafsiri kuu.
- issue: Nguvu ya וּבָרוּךְ na וְיִמָּלֵא
  choice: 'ombi/tamko la ibada: “libarikiwe” na “uijaze”'
  alternative: 'taarifa: “limebarikiwa” na “utukufu wake unaijaza”'
  rationale: Muundo wa doksolojia na “Amina na amina” unaunga mkono usomaji wa maneno haya kama baraka na ombi, si maelezo tambarare tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, ya heshima na yenye mwangwi wa ibada. Mpangilio wa sentensi umefanywa wa asili bila kuondoa muundo wa baraka, ombi na tamko la mwisho.
