  yaml_path: translation/ot/psalms/072/020.yaml
  text: The prayers of David son of Jesse are ended[a].
translation:
  language: sw
  text: Maombi ya Daudi mwana wa Yese yamekwisha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yamekamilika” au “yamefikia mwisho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלּוּ
  choice: yamekwisha
  rationale: Kitenzi hiki katika kauli ya Pual, timilifu, wingi, kina maana ya kukamilika au kufikia mwisho. “Yamekwisha” ni Kiswahili cha kawaida na chenye hadhi, na kinapatana na kiima cha ngeli ya ma- “maombi.”
- source_word: תְפִלּוֹת
  choice: maombi
  rationale: Hii ndiyo maana ya moja kwa moja ya wingi wa תְּפִלָּה na ndiyo istilahi ya kawaida ya Kiswahili kwa sala au dua zinazotolewa kwa Mungu.
- source_word: דָּוִד
  choice: Daudi
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Biblia za Kiswahili.
- source_word: בֶּן יִשָׁי
  choice: mwana wa Yese
  rationale: Muundo wa Kiebrania unatambulisha ukoo wa Daudi. “Mwana wa Yese” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili cha Biblia.
theological_decisions:
- issue: Kazi ya mstari huu kama tamati ya mkusanyo au kama sehemu ya moja kwa moja ya zaburi
  choice: Kutafsiri kama taarifa rahisi kwamba maombi ya Daudi yamefikia mwisho
  alternative: Kuueleza wazi kuwa ni maelezo ya mhariri yaliyoongezwa baadaye
  rationale: Kiebrania chenyewe kinatoa taarifa fupi ya tamati bila kueleza historia ya uhariri. Tafsiri haipaswi kuingiza uamuzi wa kihistoria usiotajwa wazi katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo mfupi, wa kawaida na wenye hadhi. Alama ya tanbihi imewekwa baada ya sentensi inayohusika.
