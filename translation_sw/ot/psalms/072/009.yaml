  text: לְ֭/פָנָי/ו יִכְרְע֣וּ צִיִּ֑ים וְ֝/אֹיְבָ֗י/ו עָפָ֥ר יְלַחֵֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/009.yaml
  text: Before him the desert dwellers will bow down[a], and his enemies will lick the dust.
translation:
  language: sw
  text: Wakaao jangwani watainama mbele yake[a], na adui zake wataramba mavumbi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “makabila ya jangwani”; neno la Kiebrania צִיִּים linaweza kumaanisha wakazi wa maeneo ya jangwa, ingawa katika baadhi ya miktadha hutumiwa kwa viumbe wa nyikani.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו
  choice: mbele yake
  rationale: Kirai hiki humaanisha kuwa mbele ya mtu au katika uwepo wake; “mbele yake” ni cha kawaida na huhifadhi maana ya kimahali na kimahusiano.
- source_word: יִכְרְעוּ
  choice: watainama
  rationale: Kitenzi כרע huonyesha kupiga magoti au kuinama. Katika muktadha wa mfalme, “watainama” huwasilisha ishara ya kujisalimisha au kutoa heshima bila kuwa lugha ngumu.
- source_word: צִיִּים
  choice: wakaao jangwani
  rationale: Neno hili linaweza kurejelea watu wa maeneo ya jangwa, na katika miktadha mingine viumbe wa nyikani. Sambamba na “adui zake” hapa, rejeo la watu linafaa zaidi, huku tafsiri hii ikiepuka kuwabainisha kama kabila fulani.
- source_word: וְאֹיְבָיו
  choice: na adui zake
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya nomino אויב yenye kiambishi cha nafsi ya tatu umoja wa kiume.
- source_word: עָפָר
  choice: mavumbi
  rationale: “Mavumbi” huhifadhi picha halisi ya kudhalilishwa na kushindwa kabisa inayotolewa na msemo wa kishairi.
- source_word: יְלַחֵכוּ
  choice: wataramba
  rationale: Kitenzi לחך humaanisha “kuramba”; picha thabiti ya kishairi imehifadhiwa badala ya kufafanuliwa kwa lugha dhahania.
theological_decisions:
- issue: Asili ya picha ya kujisalimisha
  choice: Mstari unaonyesha ushindi na kujisalimisha mbele ya mfalme kwa picha ya kishairi.
  alternative: Kuona kuinama na kuramba mavumbi kuwa matendo ya lazima yaliyo halisi katika kila tukio.
  rationale: Lugha hii ni picha ya kawaida ya kale ya kudhalilishwa mbele ya mfalme. Tafsiri inaihifadhi moja kwa moja bila kuigeuza kuwa maelezo ya kisiasa yasiyo na picha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. “Wakaao” limetumiwa kwa ufupi wa kishairi, na “wataramba mavumbi” huhifadhi taswira kali ya Kiebrania.
