  text: מַלְכֵ֬י תַרְשִׁ֣ישׁ וְ֭/אִיִּים מִנְחָ֣ה יָשִׁ֑יבוּ מַלְכֵ֥י שְׁבָ֥א וּ֝/סְבָ֗א אֶשְׁכָּ֥ר יַקְרִֽיבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/010.yaml
  text: May the kings of Tarshish and of the coastlands bring tribute; may the kings of Sheba and Seba present gifts.
translation:
  language: sw
  text: Wafalme wa Tarsisi na wa nchi za pwani walete ushuru; wafalme wa Sheba na Seba watoe zawadi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִיִּים
  choice: nchi za pwani
  rationale: Neno hili linaweza kumaanisha visiwa au maeneo ya pwani; katika muktadha huu linarejelea nchi za mbali zinazofikiwa kwa bahari, hivyo “nchi za pwani” ni tafsiri ya kawaida na yenye upeo unaofaa.
- source_word: מִנְחָה
  choice: ushuru
  rationale: Ingawa neno hili mara nyingi humaanisha sadaka au zawadi, hapa linatolewa na wafalme kwa mfalme, hivyo lina maana ya ushuru wa kutambua mamlaka yake.
- source_word: אֶשְׁכָּר
  choice: zawadi
  rationale: Neno adimu linalomaanisha zawadi au malipo; “zawadi” hudumisha ulinganifu wa kishairi bila kulifanya kuwa neno lilelile na “ushuru” katika mstari wa kwanza.
- source_word: יַקְרִיבוּ
  choice: watoe
  rationale: Kitenzi humaanisha kuleta karibu au kuwasilisha; “watoe” ni Kiswahili cha kawaida kinachoeleza kuwasilisha zawadi kwa mfalme.
theological_decisions:
- issue: Nguvu ya vitenzi vya wakati usiotimilika katika ombi la kifalme
  choice: na walete … na watoe
  alternative: wataleta … watatoa
  rationale: Muktadha wa Zaburi 72 una mfululizo wa maombi kwa ajili ya mfalme. Muundo wa “na” pamoja na kitenzi tegemezi unahifadhi maana ya ombi au tamanio badala ya kuigeuza kimya kimya kuwa utabiri wa hakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Majina Tarshishi, Sheba, na Seba yamehifadhiwa kama majina tofauti ya mahali.
