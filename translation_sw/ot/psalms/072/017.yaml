  text: יְהִ֤י שְׁמ֨/וֹ לְֽ/עוֹלָ֗ם לִ/פְנֵי שֶׁמֶשׁ֮ ינין שְׁ֫מ֥/וֹ וְ/יִתְבָּ֥רְכוּ ב֑/וֹ כָּל גּוֹיִ֥ם יְאַשְּׁרֽוּ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/017.yaml
  text: May his name endure forever[a]; before the sun, may his name continue. May all nations be blessed in him[c][b]; may they call him blessed.
translation:
  language: sw
  text: 'Jina lake na lidumu milele;


    mbele ya jua[a], jina lake na liendelee[b].


    Mataifa yote na yabarikiwe kupitia kwake[c];


    na yamwite mwenye heri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maadamu jua linadumu.” Kiebrania kinasema kihalisi, “mbele ya jua.”
    reason: lexical_alternative
  - marker: b
    text: Kitenzi kilichotafsiriwa “liendelee” ni nadra; huenda pia kikadokeza “lichipuke,” “liongezeke,” au “lienezwe.”
    reason: lexical_alternative
  - marker: c
    text: Au, “mataifa yote na yajibariki kwa yeye.” Umbo la Kiebrania linaweza kueleweka kwa maana ya kujirejelea.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי שְׁמוֹ לְעוֹלָם
  choice: Jina lake na lidumu milele
  rationale: Muundo wa kusihi יְהִי unaonyesha ombi au tamanio. “Na lidumu” ni Kiswahili cha sasa kinachohifadhi maana hiyo pamoja na wazo la kuendelea kwa jina, yaani sifa na utambulisho wa mfalme.
- source_word: לִפְנֵי שֶׁמֶשׁ
  choice: mbele ya jua
  rationale: Hili ndilo taswira halisi ya Kiebrania. Ingawa maana ya kimuktadha huenda ni “maadamu jua linadumu,” taswira ya kishairi imehifadhiwa katika matini na maana ya muda imeelezwa katika tanbihi.
- source_word: ינין
  choice: na liendelee
  rationale: Kitenzi hiki ni nadra na maana yake kamili haijulikani kwa hakika. “Liendelee” kinaendana na ulinganifu wa “lidumu milele” bila kulazimisha maana mahsusi ya kuchipuka, kuongezeka, au kuenezwa.
- source_word: וְיִתְבָּרְכוּ בוֹ
  choice: na yabarikiwe kupitia kwake
  rationale: Hitpaeli ya ברך inaweza kueleweka kwa maana ya kupokea baraka au ya kujibariki. “Yabarikiwe kupitia kwake” ni ya kawaida katika Kiswahili, huhifadhi uhusiano wa baraka na mfalme, na haifungi kabisa mwangwi wa ahadi kwa mababu.
- source_word: כָּל גּוֹיִם
  choice: Mataifa yote
  rationale: Katika muktadha huu wa ufalme wa ulimwengu mzima, גּוֹיִם hurejelea mataifa yote, si kundi maalumu la kidini.
- source_word: יְאַשְּׁרוּהוּ
  choice: na yamwite mwenye heri
  rationale: Pieli ya אשר humaanisha kumtangaza au kumhesabu mtu kuwa mwenye heri. “Kumwita mwenye heri” ni usemi wenye hadhi, unaoeleweka, na unaohifadhi maana hiyo.
theological_decisions:
- issue: Upeo wa kifalme na wa Kimasihi wa mstari
  choice: Kiwakilishi cha nafsi ya tatu na lugha ya baraka kwa mataifa yote vimehifadhiwa bila kumtaja mhusika kuwa Kristo moja kwa moja.
  alternative: Kuufanya mstari uhusu mfalme wa kihistoria peke yake, au kuutafsiri kama unabii wa moja kwa moja na wa kipekee kuhusu Masihi.
  rationale: Zaburi hii ni ya kifalme, lakini lugha yake pana inaweza pia kuwa na mwangwi wa Kimasihi. Tafsiri inapaswa kuacha pande zote mbili zisikike bila kuamua jambo hilo ndani ya matini.
- issue: Maana ya וְיִתְבָּרְכוּ בוֹ
  choice: Mataifa “yabarikiwe kupitia kwake.”
  alternative: Mataifa “yajibariki kwa kumtaja yeye.”
  rationale: Umbo la Kiebrania linaweza kusomwa kwa maana ya kati/tendwa au ya kujirejelea. Matini kuu imetumia maana ya kupokea baraka, huku uwezekano wa kujirejelea ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi wenye hadhi lakini unaoeleweka. Muundo “na lidumu / na liendelee / na yabarikiwe / na yamwite” unahifadhi mfululizo wa matamanio na maombi ya Kiebrania. Mistari imepangwa ili kudumisha ulinganifu wa kishairi.
