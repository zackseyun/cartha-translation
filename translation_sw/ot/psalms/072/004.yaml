  text: יִשְׁפֹּ֤ט עֲֽנִיֵּי עָ֗ם י֭וֹשִׁיעַ לִ/בְנֵ֣י אֶבְי֑וֹן וִֽ/ידַכֵּ֣א עוֹשֵֽׁק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/004.yaml
  text: May he judge the poor of the people[a], save the children of the needy, and crush the oppressor.
translation:
  language: sw
  text: Na awahukumu maskini wa watu[a], awaokoe watoto wa wahitaji, na amponde mkandamizaji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Atawahukumu maskini wa watu, atawaokoa watoto wa wahitaji, na atamponda mkandamizaji.” Vitenzi vya Kiebrania vinaweza kueleweka kama wakati ujao au kama ombi/takwa katika muktadha huu.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁפֹּט
  choice: awahukumu kwa haki
  rationale: Qal imperfect ya שׁפט inaweza kueleza wakati ujao au ombi/takwa. Katika muktadha wa ombi kwa ajili ya mfalme, umbo la kutakia ‘awahukumu’ linafaa; ‘kwa haki’ huonyesha maana ya kutoa hukumu ya haki kwa maskini bila kupunguza kitenzi kuwa ‘awatetee’ pekee.
- source_word: עֲנִיֵּי עָם
  choice: maskini wa watu
  rationale: עֲנִיִּים inaweza kumaanisha maskini, wenye taabu, au wanaoonewa. Ulinganifu na ‘watoto wa wahitaji’ unaifanya maana ya umaskini/uhitaji kuwa ya msingi, huku ‘wa watu’ ikihifadhi uhusiano wa maneno ya Kiebrania.
- source_word: יוֹשִׁיעַ
  choice: awaokoe
  rationale: Hiphil ya ישׁע humaanisha kuokoa au kukomboa kutoka hatarini. ‘Awaokoe’ ni ya kawaida na huhifadhi nguvu ya tendo la kuwaokoa.
- source_word: לִבְנֵי אֶבְיוֹן
  choice: watoto wa wahitaji
  rationale: בני ni ‘wana/watoto wa’; hapa ni kundi lisilowahusu wanaume pekee, hivyo ‘watoto’ linafaa. ‘Wahitaji’ hutofautisha אֶבְיוֹן na עֲנִיִּים huku ikihifadhi ulinganifu.
- source_word: וִידַכֵּא
  choice: na amponde
  rationale: דכא hapa hutoa picha kali ya kuponda au kuvunja. ‘Amponde’ huhifadhi ukali wa hukumu dhidi ya anayewakandamiza wengine.
- source_word: עוֹשֵׁק
  choice: mkandamizaji
  rationale: Partisipio la עשׁק humaanisha mtu anayekandamiza au kunyonya wengine. ‘Mkandamizaji’ ni neno la kawaida, fupi, na linaloonyesha tabia endelevu.
theological_decisions:
- issue: Hali ya vitenzi katika mstari mzima
  choice: 'Ombi/takwa: ‘awahukumu… awaokoe… amponde’'
  alternative: 'Wakati ujao: ‘atawahukumu… atawaokoa… atamponda’'
  rationale: Zaburi 72 ina muktadha wa sala kwa ajili ya mfalme, kwa hiyo imperfecti za Kiebrania zinaweza kusikika kama matakwa au maombi. Tanbihi huhifadhi uwezekano halisi wa kuzisoma kama wakati ujao bila kuufanya mstari uwe unabii kwa lazima.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sala ulio wa heshima lakini unaoeleweka kwa urahisi. ‘Kwa haki’ husaidia kuzuia ‘kuwahukumu maskini’ kueleweka kama kuwapatia adhabu, huku maana ya kimahakama ya שׁפט ikihifadhiwa.
