  yaml_path: translation/ot/psalms/072/006.yaml
  text: May he come down like rain on mown grass[c][b][a], like showers that water the earth.
translation:
  language: sw
  text: 'Ashuke kama mvua juu ya nyasi zilizokatwa,[a][b]

    kama manyunyu yanayoilowesha ardhi.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Atashuka kama mvua juu ya nyasi zilizokatwa.” Kitenzi cha Kiebrania kinaweza kueleweka hapa ama kama ombi au tamanio, ama kama maelezo ya wakati ujao.
    reason: alternative_reading
  - marker: b
    text: “Nyasi zilizokatwa” zinaweza pia kueleweka kama “majani yaliyokatwa.” Wengine hulielewa neno la Kiebrania kuwa “manyoya yaliyonyolewa,” lakini taswira ya kilimo inafaa zaidi katika muktadha huu.
    reason: lexical_alternative
  - marker: c
    text: Badala ya “ardhi,” neno la Kiebrania linaweza pia kutafsiriwa “nchi” au “dunia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרֵד
  choice: Na ashuke
  rationale: Kitenzi ירד humaanisha kushuka. Katika muktadha wa sala na baraka kwa mfalme, hali ya kitenzi inaeleweka kwa kawaida kama ombi au tamanio; “Na ashuke” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: כְּמָטָר
  choice: kama mvua
  rationale: Kiambishi כ pamoja na מָטָר huunda tashbihi ya moja kwa moja, “kama mvua.”
- source_word: עַל
  choice: juu ya
  rationale: Hili ndilo tamko la kawaida la Kiswahili kwa mvua inayonyesha juu ya kitu.
- source_word: גֵּז
  choice: nyasi zilizokatwa
  rationale: Nomino hii hurejelea kitu kilichokatwa au kunyolewa. Pamoja na mvua na ardhi, nyasi zilizokatwa zinafaa zaidi katika taswira ya kilimo, huku maana ya manyoya yaliyonyolewa ikibaki uwezekano wa kileksika.
- source_word: כִּרְבִיבִים
  choice: kama manyunyu
  rationale: רְבִיבִים hurejelea manyunyu au mvua tele. “Manyunyu” huhifadhi usambamba wa kishairi bila kuongeza nguvu isiyotajwa wazi.
- source_word: זַרְזִיף
  choice: yanayolowanisha
  rationale: Neno hili adimu linaonyesha kutiririka au kudondoka kwa mvua. Kitenzi “yanayolowanisha” kinatoa Kiswahili cha asili na kuonyesha athari ya manyunyu bila kudai lazima kwamba ni mvua kubwa.
- source_word: אָרֶץ
  choice: ardhi
  rationale: אָרֶץ yaweza kumaanisha dunia, nchi, au ardhi. Katika taswira hii ya mvua, “ardhi” ni ya kawaida na inaendana vizuri na maana ya sehemu ya chini inayoloweshwa.
theological_decisions:
- issue: Nguvu ya kitenzi kisichotimilika katika muktadha wa sala ya kifalme
  choice: 'Tamanio au ombi: “Na ashuke”'
  alternative: 'Maelezo ya wakati ujao: “Atashuka”'
  rationale: Zaburi ya 72 ina lugha ya sala na baraka kwa mfalme, hivyo kitenzi hiki kinaweza kusikika kiasili kama tamanio. Tanbihi huhifadhi uwezekano halisi wa kukisoma kama kauli ya wakati ujao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Mistari miwili inahifadhi usambamba wa Kiebrania; lugha ni ya sasa na inaeleweka kwa wasomaji wa kawaida.
