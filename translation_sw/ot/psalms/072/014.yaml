  yaml_path: translation/ot/psalms/072/014.yaml
  text: From oppression and violence he will redeem their life[b][a], and their blood will be precious in his eyes.
translation:
  language: sw
  text: Ataukomboa uhai wao[a] kutoka katika ukandamizaji na jeuri, na damu yao itakuwa ya thamani machoni pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi zao” au “maisha yao.” Neno la Kiebrania nefesh linaweza kumaanisha uhai, nafsi, mtu mwenyewe, au mtu, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתּוֹךְ
  choice: kutoka katika
  rationale: Muundo huu unaonyesha kuondolewa kutoka katikati ya hali au mamlaka ya dhiki, huku ukiwa wa kawaida katika Kiswahili.
- source_word: וּמֵחָמָס
  choice: na ukatili
  rationale: חָמָס inaweza kumaanisha jeuri, ukatili, au udhalimu. Katika jozi hii, “ukatili” inaeleza wazi dhuluma kali inayowapata walio dhaifu bila kuifanya iwe tu shambulio la kimwili.
- source_word: יִגְאַל
  choice: atawakomboa
  rationale: Kitenzi גאל kina maana ya kukomboa au kudai tena kwa tendo la mkombozi; “atawakomboa” kinahifadhi uzito huo kuliko “atawaokoa” pekee.
- source_word: נַפְשָׁם
  choice: wao (katika atawakomboa)
  rationale: נֶפֶשׁ hapa humaanisha uhai au nafsi yao, yaani wao wenyewe. Kiswahili cha kawaida huwasilisha maana hiyo kwa kiambishi cha mtendwa katika “atawakomboa,” bila kuongeza nomino isiyo ya lazima; tanbihi huhifadhi wigo wa neno la Kiebrania.
- source_word: וְיֵיקַר
  choice: itakuwa ya thamani
  rationale: Huwasilisha kwamba damu yao si kitu cha bei rahisi au cha kupuuzwa, bali inathaminiwa sana.
- source_word: דָּמָם
  choice: damu yao
  rationale: Tafsiri halisi inadumisha taswira thabiti ya Kiebrania na wazo la maisha yao yaliyomwagika au kutishiwa.
- source_word: בְּעֵינָיו
  choice: machoni pake
  rationale: Nahau hii ya kawaida na yenye kueleweka huhifadhi taswira ya Kiebrania na maana ya kuthaminiwa kwake.
theological_decisions:
- issue: Mhusika wa vitenzi na kiwakilishi cha umoja
  choice: Umoja katika “atawakomboa” na “pake” umehifadhiwa, ukirejelea kwa kawaida mfalme katika muktadha wa zaburi.
  alternative: Kumwelewa Mungu moja kwa moja kuwa ndiye anayekomboa na kuithamini damu yao.
  rationale: Maumbo ya umoja ya Kiebrania yanaendeleza mhusika wa kifalme katika muktadha wa karibu, lakini matendo hayo pia yanaakisi utunzaji wa Mungu kwa wanaodhulumiwa. Tafsiri haisuluhishi mvutano huo kimakusudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ukandamizaji” na “ukatili” ni maneno yanayoeleweka kwa kawaida na yanadumisha jozi ya dhiki na חָמָס. Alama ya tanbihi imewekwa mara moja baada ya kishazi kinachohusika.
