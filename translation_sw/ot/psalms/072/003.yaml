  text: May the mountains bring peace to the people[a], and the hills[c][b], in righteousness.
translation:
  language: sw
  text: Milima na iwaletee watu amani[a], na vilima viwaletee amani kwa haki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “amani kwa ajili ya watu.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa njia ya uadilifu”; neno la Kiebrania linaweza pia kumaanisha “uadilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: na iwaletee
  rationale: Kitenzi נָשָׂא kwa msingi humaanisha ‘kuinua, kubeba,’ lakini hapa milima na vilima vinatajwa kishairi kuwa vinaleta amani. Muundo wa ‘na ...’ unaonyesha ombi au takwa la baraka, si taarifa ya wakati ujao tu.
- source_word: הָרִים
  choice: Milima
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya wingi; Kiswahili hakihitaji kuonyesha kibainishi cha Kiebrania kwa neno tofauti.
- source_word: שָׁלוֹם
  choice: amani
  rationale: ‘Amani’ ni tafsiri ya kawaida na ya asili, huku muktadha ukiruhusu pia wazo pana la hali njema na ustawi.
- source_word: לָעָם
  choice: watu
  rationale: 'Kiambishi tamati katika ‘iwaletee’ kinawakilisha ל ya mwelekeo au manufaa: amani inaletwa kwa watu.'
- source_word: וּגְבָעוֹת
  choice: na vilima pia
  rationale: Huhifadhi ulinganifu wa kishairi kati ya milima na vilima. ‘Pia’ hufanya udondoshaji wa kitenzi katika kipande cha pili ueleweke kwa Kiswahili.
- source_word: בִּצְדָקָה
  choice: kwa haki
  rationale: ‘Kwa’ huhifadhi uwezekano wa ב kuonyesha namna au njia. ‘Haki’ inaweza kujumuisha uadilifu na utekelezaji wa haki bila kulazimisha maana moja pekee.
theological_decisions:
- issue: Nguvu ya kitenzi cha hali isiyotimilika katika zaburi ya maombi kwa mfalme
  choice: 'Ombi au takwa la baraka: ‘na iwaletee’'
  alternative: 'Utabiri: ‘italeta’'
  rationale: Katika muktadha wa Zaburi 72, mstari huu unaendelea kama ombi la utawala wa mfalme; kwa hiyo muundo wa kutakia unaafiki muktadha kuliko wakati ujao wa taarifa.
- issue: Uhusiano wa בִּצְדָקָה na kipande cha pili
  choice: ‘kwa haki,’ ikieleza namna au njia ambayo amani huletwa
  alternative: ‘vilima vilete haki,’ kwa kulichukulia צְדָקָה kuwa kitu cha pili kinacholetwa
  rationale: Herufi ב imeandikwa wazi katika Kiebrania na kwa kawaida huonyesha namna au njia. Tafsiri kuu haiiondoi, ingawa ufupi wa kishairi wa mstari unabaki na mvutano wa kisintaksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi wa kishairi na udondoshaji wa kitenzi katika kipande cha pili umehifadhiwa, huku ‘pia’ ikisaidia sentensi kueleweka kwa msomaji wa kawaida.
