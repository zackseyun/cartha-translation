  yaml_path: translation/ot/psalms/072/013.yaml
  text: He will have compassion on the poor and needy[a], and he will save the lives of the needy.
translation:
  language: sw
  text: Atawahurumia maskini na wahitaji, naye ataokoa maisha ya wahitaji.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi za wahitaji.” Neno la Kiebrania linaweza kumaanisha “uhai,” “nafsi,” “mtu,” au “mtu mwenyewe,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחֹס
  choice: atawahurumia
  rationale: Kitenzi hiki kinaonyesha huruma kwa watu walio dhaifu au katika shida. ‘Atawahurumia’ ni Kiswahili cha kawaida na chenye hadhi, na kinaendana na tendo la kuwaokoa katika mstari unaofuata.
- source_word: עַל
  choice: imejumuishwa katika ‘atawahurumia’
  rationale: Kihusishi hiki huonyesha walengwa wa huruma; katika Kiswahili maana yake inaelezwa kiasili kwa kiambishi cha yambwa katika ‘atawahurumia.’
- source_word: דַּל
  choice: maskini
  rationale: Neno linaweza kumaanisha maskini, dhaifu, au mtu asiye na uwezo wa kijamii. ‘Maskini’ linaonyesha vizuri hali ya kiuchumi na unyonge unaokusudiwa hapa.
- source_word: אֶבְיוֹן
  choice: wahitaji
  rationale: ‘Wahitaji’ linatofautisha neno hili na דַּל huku likihifadhi ulinganifu wa kishairi na wazo la watu wenye uhitaji mkubwa.
- source_word: נַפְשׁוֹת
  choice: maisha
  rationale: Katika muktadha huu נֶפֶשׁ inaelekea kumaanisha uhai au maisha ya watu, si lazima nafsi isiyo ya kimwili. ‘Maisha’ linafaa na kitenzi ‘ataokoa’ bila kuingiza maana finyu ya kiantropolojia.
- source_word: אֶבְיוֹנִים
  choice: wahitaji
  rationale: Umoja wa neno hili umetafsiriwa vivyo hivyo katika kipande cha kwanza; umbo la wingi linaonyeshwa kwa ‘wahitaji.’
- source_word: יוֹשִׁיעַ
  choice: ataokoa
  rationale: Hifili ya ישׁע humaanisha kuokoa au kukomboa. ‘Ataokoa’ ni tafsiri ya moja kwa moja inayofaa kwa ukombozi halisi unaozungumziwa hapa.
theological_decisions:
- issue: Maana ya נַפְשׁוֹת kuhusu asili ya mwanadamu
  choice: Imetafsiriwa ‘maisha’
  alternative: ‘nafsi’ au ‘watu wenyewe’
  rationale: Muktadha wa ulinzi na ukombozi wa kifalme unaelekeza kwenye uhai wa wahitaji. ‘Nafsi’ linawezekana kileksika, lakini linaweza kueleweka kuwa linathibitisha mgawanyo maalumu wa mwili na nafsi ambao mstari wenyewe haulazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Ulinganifu wa kishairi umehifadhiwa kwa ‘maskini na wahitaji’; maana ya נֶפֶשׁ imewekwa wazi katika maandishi huku uwezekano wa ‘nafsi’ ukihifadhiwa katika tanbihi.
