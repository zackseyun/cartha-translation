  text: וִ/יחִ֗י וְ/יִתֶּן ל/וֹ֮ מִ/זְּהַ֪ב שְׁ֫בָ֥א וְ/יִתְפַּלֵּ֣ל בַּעֲד֣/וֹ תָמִ֑יד כָּל הַ֝/יּ֗וֹם יְבָרֲכֶֽ/נְהֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/015.yaml
  text: May he live[a], and may gold from Sheba be given to him. May prayer be made for him continually[b]; all day long may they bless him.
translation:
  language: sw
  text: Aishi, naye apewe dhahabu kutoka Sheba.[a] Aombewe daima[b]; mchana kutwa wambariki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata kauli tendaji ya Kiebrania: “naye ampe dhahabu kutoka Sheba.” Mtendaji hakutajwa.'
    reason: lexical_alternative
  - marker: b
    text: 'Au, kwa karibu: “mtu amwombee daima.” Kiebrania hakimtaji wazi mtendaji.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיחִי
  choice: Aishi kwa muda mrefu!
  rationale: Qal ya kusihi ya nafsi ya tatu umoja inaeleza tamanio au baraka. Kiswahili hiki cha kawaida kinadumisha nguvu ya ombi bila kuifanya kuwa taarifa ya wakati ujao.
- source_word: וְיִתֶּן לוֹ
  choice: Apewe
  rationale: Kitenzi cha Kiebrania ni tendaji, ‘na ampe,’ lakini mtendaji hajatajwa. Kauli tendwa ya Kiswahili inaeleza maana kwa kawaida bila kuongeza mtendaji mahususi.
- source_word: מִזְּהַב שְׁבָא
  choice: dhahabu kutoka Sheba
  rationale: Muundo wenye מִן unaonyesha chanzo katika muktadha huu wa zawadi au ushuru; ‘kutoka Sheba’ ni wazi na wa kawaida.
- source_word: וְיִתְפַּלֵּל בַּעֲדוֹ
  choice: Watu wamwombee
  rationale: Hitpael ya פלל pamoja na בעד humaanisha kumwombea mtu. ‘Watu’ inaacha kundi likiwa lisilobainishwa, kama ilivyo katika Kiebrania, huku ikitoa Kiswahili cha asili.
- source_word: תָמִיד
  choice: daima
  rationale: Neno linaonyesha mwendelezo au ukawaida usiokoma; ‘daima’ linafaa katika ushairi wenye hadhi.
- source_word: כָּל הַיּוֹם
  choice: mchana kutwa
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kipindi chote cha siku katika mtindo wa kishairi.
- source_word: יְבָרֲכֶנְהוּ
  choice: wambariki
  rationale: Piel ya kusihi pamoja na kiambishi cha mtendewa wa kiume umoja inaeleza tamanio kwamba watu wasiotajwa wambariki; wingi usiobainishwa ni wa kawaida katika Kiswahili.
theological_decisions:
- issue: Mhusika anayelengwa na maombi ya kifalme katika Zaburi 72
  choice: Aya inabaki kuwa tamanio au sala kwa ajili ya mfalme wa ukoo wa Daudi, bila kutaja wazi tafsiri ya Kimasihi ndani ya matini.
  alternative: Kuitafsiri moja kwa moja kama unabii unaomhusu Masihi.
  rationale: Maana ya karibu ya Kiebrania ni maombi kwa ajili ya mfalme. Tafsiri hiyo haizuii usomaji mpana wa kikanoni au wa Kimasihi, lakini haiulazimishi katika maneno ya aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Aishi kwa muda mrefu’ na ‘mchana kutwa’ ni misemo inayoeleweka kwa urahisi. Kauli tendwa na nomino ya jumla ‘watu’ zimetumiwa kuhifadhi kutotajwa kwa mtendaji katika Kiebrania.
