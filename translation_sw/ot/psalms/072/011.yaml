  yaml_path: translation/ot/psalms/072/011.yaml
  text: May all kings bow down before him[a]; may all nations serve him.
translation:
  language: sw
  text: Wafalme wote na wamsujudie[a]; mataifa yote na yamtumikie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wamwabudu”; vitenzi vya Kiebrania vilivyotafsiriwa “wamsujudie” na “yamtumikie” vinaweza kumaanisha ibada ya kidini na pia heshima na utumishi kwa mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׁתַּחֲווּ
  choice: na wamsujudie
  rationale: Kitenzi שׁחה kinaonyesha kuinama au kujisujudu kwa heshima. Katika zaburi hii ya kifalme, “wamsujudie” kinahifadhi tendo la nje na maana ya kumpa mfalme heshima bila kulazimisha kwamba ni ibada ya kidini pekee. Muundo wa kitenzi umetafsiriwa kama ombi au tamanio.
- source_word: לוֹ
  choice: -m- katika “wamsujudie”
  rationale: Kihusishi ל kinaelekeza tendo kwa mhusika; katika Kiswahili, yambwa “-m-” ndani ya kitenzi hutoa maana hiyo kwa njia ya kawaida na fasaha.
- source_word: כָל מְלָכִים
  choice: wafalme wote
  rationale: Tafsiri ya moja kwa moja inayohifadhi wigo wa ujumla wa wafalme wote.
- source_word: כָל גּוֹיִם
  choice: mataifa yote
  rationale: גּוֹיִם hapa ni mataifa kwa upana, sambamba na “wafalme wote”; “mataifa yote” ni Kiswahili cha kawaida kisichoingiza maana finyu ya kikabila.
- source_word: יַעַבְדוּהוּ
  choice: na yamtumikie
  rationale: עבד kimsingi ni kutumikia, ingawa inaweza pia kumaanisha huduma ya kidini au kuabudu. “Yamtumikie” kinahifadhi upana huo katika muktadha wa utiifu wa kifalme.
theological_decisions:
- issue: Iwapo mstari utumie waziwazi lugha ya kumwabudu mfalme
  choice: Kutumia “wamsujudie” na “yamtumikie,” ambazo zinahifadhi maana pana ya heshima na utumishi.
  alternative: Kutafsiri kitenzi kimoja au vyote kwa “wamwabudu.”
  rationale: Zaburi 72 ni zaburi ya kifalme. Vitenzi vya Kiebrania vinaweza kuwa na vidokezo vya kidini pamoja na heshima kwa mfalme, lakini havilazimishi maana ya ibada pekee. Tafsiri hii haiondoi wala haisuluhishi mapema mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “na ...” umetumiwa kuonyesha ombi au tamanio la kishairi. “Kusujudia” linaeleweka kama kuinama kwa heshima na pia linaweza kuwa na maana ya ibada, hivyo linahifadhi utata wa chanzo.
