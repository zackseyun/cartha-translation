  text: בָּר֤וּךְ יְהוָ֣ה אֱ֭לֹהִים אֱלֹהֵ֣י יִשְׂרָאֵ֑ל עֹשֵׂ֖ה נִפְלָא֣וֹת לְ/בַדּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/018.yaml
  text: Blessed be Yahweh God[a], the God of Israel, who alone does wondrous things.
translation:
  language: sw
  text: 'Ahimidiwe Yahweh Mungu,

    Mungu wa Israeli,

    yeye peke yake atendaye maajabu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Ahimidiwe
  rationale: Kirai hiki ni tamko la liturujia la kumsifu Mungu. “Ahimidiwe” ni Kiswahili cha sasa, cha heshima na cha kawaida katika tamko la sifa, huku kikihifadhi nguvu ya kimatendo ya fomula ya Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi “Yahweh,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hapa neno hili linaeleza utambulisho wa Yahweh kwa uhusiano wa karibu wa kisarufi; “Yahweh Mungu” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Muundo huu wa umilikaji unaonyesha utambulisho na uhusiano maalumu; tafsiri ya moja kwa moja inahifadhi upekee wa Israeli katika mstari.
- source_word: עֹשֵׂה
  choice: atendaye
  rationale: Kitenzi kishirikishi kinamweleza Mungu kwa tendo linalomtambulisha. “Atendaye” ni cha heshima, kifupi, na kinafaa kwa ushairi wa zaburi.
- source_word: נִפְלָאוֹת
  choice: mambo ya ajabu
  rationale: Wingi huu unamaanisha matendo yasiyo ya kawaida na ya kustaajabisha. “Mambo ya ajabu” ni wazi kwa wasomaji wa sasa na huhifadhi wazo la matendo halisi.
- source_word: לְבַדּוֹ
  choice: yeye peke yake
  rationale: Usemi huu unasisitiza upekee wa mtendaji. “Yeye peke yake” huweka mkazo huo wazi bila kuongeza dai jingine lisilotajwa moja kwa moja.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya לְבַדּוֹ kuhusu tendo la Mungu
  choice: yeye peke yake atendaye mambo ya ajabu
  alternative: afanyaye maajabu kwa uwezo wake mwenyewe
  rationale: Chaguo kuu huhifadhi dai la upekee lililo katika Kiebrania, bila kulifasiri kimya kimya kuwa hasa uhuru wa kutopokea msaada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa heshima unaofaa kwa doksolojia. Mpangilio wa mistari unadhihirisha vifungu vitatu vya Kiebrania; “atendaye” ni rasmi kidogo lakini inaeleweka kwa urahisi na inafaa katika Zaburi.
