base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/005.yaml
  text: May they fear you as long as the sun endures[a], and before the moon[c][b], through all generations.
translation:
  language: sw
  text: Wakuogope[a] maadamu jua linadumu, na maadamu mwezi upo[b], kizazi baada ya kizazi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Watakuogopa.” Umbo la Kiebrania linaweza kueleweka kama taarifa ya wakati ujao badala ya ombi au tamanio.
    reason: alternative_reading
  - marker: b
    text: Kihalisi, “pamoja na jua na mbele ya mwezi”; huu ni usemi wa kishairi unaoonyesha kudumu kwa muda mrefu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִירָאוּךָ
  choice: Wakuogope
  rationale: Kitenzi ירא kina maana ya kuogopa au kuwa na hofu yenye heshima. Katika muktadha huu wa zaburi ya kifalme, “wakuogope” kinahifadhi uzito wa neno hilo na pia kinaweza kutumika kama ombi au tamanio.
- source_word: עִם־שָׁמֶשׁ
  choice: maadamu jua linadumu
  rationale: Ingawa עִם kwa kawaida ni “pamoja na,” hapa pamoja na “jua” ni usemi wa kudumu kwa muda wote ambao jua lipo. Tafsiri hii inatoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: וְלִפְנֵי יָרֵחַ
  choice: na maadamu mwezi upo
  rationale: לִפְנֵי humaanisha kihalisi “mbele ya,” lakini katika ulinganifu huu wa kishairi na jua inaeleza muda unaoendelea. Kiswahili hiki kinaweka wazi maana ya usemi bila kuifanya sentensi kuwa ngumu.
- source_word: דּוֹר דּוֹרִים
  choice: kizazi baada ya kizazi
  rationale: Muundo wa umoja ukifuatwa na wingi unasisitiza mfululizo wa vizazi. “Kizazi baada ya kizazi” ni wa asili na huhifadhi nguvu ya urudiaji.
theological_decisions:
- issue: Mhusika anayepaswa kuogopwa katika zaburi ya kifalme
  choice: Kiwakilishi “-ku-” katika “wakuogope” kimeachwa bila kumtaja mhusika kwa jina.
  alternative: Kufafanua kuwa watu wanamwogopa mfalme, mtawala wa ukoo wa Daudi, au Mungu.
  rationale: Kiebrania kinamwelekea moja kwa moja “wewe,” huku muktadha wa kifalme ukiruhusu viwango tofauti vya uelewa. Tafsiri haiongezi ufafanuzi ambao matini yenyewe haitoi.
- issue: Nguvu ya kisarufi ya יִירָאוּךָ
  choice: Wakuogope
  alternative: Watakuogopa
  rationale: Umbo la Kiebrania linaweza kueleweka kama ombi au tamanio, au kama taarifa yenye maana ya wakati ujao. Muundo wa Kiswahili wa kutakia umechaguliwa kwa kufuata mtiririko wa ombi katika muktadha, huku uwezekano mwingine ukitajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na mtiririko wa kishairi. Usemi wa muda umetafsiriwa kimaanani, huku maumbo halisi ya Kiebrania yakihifadhiwa katika tanbihi.
