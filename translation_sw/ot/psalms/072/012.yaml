base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/012.yaml
  text: For he delivers the needy when he cries out[a], and the poor who has no helper.
translation:
  language: sw
  text: Kwa maana yeye humwokoa mhitaji anapolia kuomba msaada, na maskini[a] asiye na mtu wa kumsaidia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “anayeteswa” badala ya “maskini” (עָנִי), ikikazia kuonewa au kuteseka pamoja na umaskini.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya sifa iliyotangulia kwa mfalme, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: יַצִּיל
  choice: humwokoa
  rationale: Hifili ya נצל ina maana ya kumtoa mtu katika hatari au taabu; “humwokoa” ni ya kawaida na haifanyi wokovu hapa kuwa wa kiroho pekee.
- source_word: אֶבְיוֹן
  choice: mhitaji
  rationale: Humaanisha mtu mwenye uhitaji au anayewategemea wengine; “mhitaji” pia huitofautisha na עָנִי katika kipashio kinachofuata.
- source_word: מְשַׁוֵּעַ
  choice: anapolia kuomba msaada
  rationale: Kitenzi kishirikishi cha שׁוע kinaonyesha kilio cha kuomba msaada; muundo wa wakati unasomeka kwa kawaida na unaweka wazi maana ya ombi hilo.
- source_word: וְעָנִי
  choice: na maskini
  rationale: עָנִי inaweza kumaanisha maskini, aliyeteswa, au aliyenyenyekezwa. Katika usambamba na אֶבְיוֹן, hali ya uhitaji wa kijamii na mali ndiyo inayojitokeza zaidi.
- source_word: וְאֵין עֹזֵר לוֹ
  choice: asiye na mtu wa kumsaidia
  rationale: Hueleza kuwa maskini huyo ameachwa bila msaidizi; usemi huu ni wazi na wa kawaida katika Kiswahili.
theological_decisions:
- issue: Mrejelewa wa “yeye”
  choice: Kiwakilishi cha umoja “yeye” kimehifadhiwa bila kumtaja wazi, na katika muktadha kinamrejelea mfalme anayesifiwa katika zaburi.
  alternative: Mfalme mwadilifu kwa ujumla; au mfalme wa Kimasihi kwa maana ya kielelezo au unabii.
  rationale: Kiebrania kina kitenzi cha nafsi ya tatu, umoja, kiume bila kumtaja mhusika. Aya yenyewe haimtambulishi zaidi ya muktadha wa kifalme, hivyo tafsiri haiondoi utata huo wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Anapolia kuomba msaada” ni wazi kwa msomaji wa kawaida; “asiye na mtu wa kumsaidia” ni ya asili kuliko tafsiri ya neno kwa neno ya ‘asiye na msaidizi’.
