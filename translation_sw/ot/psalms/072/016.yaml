    rationale: “Konzi” kwa kawaida ni fungu/bunch, si kiasi kinachoshikwa mkononi. “Kiganja kimoja cha nafaka” huwasilisha kwa usahihi zaidi usomaji wa jadi bila kudai uhakika wa kileksia.
  - severity: low
