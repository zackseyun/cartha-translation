  text: יְהִ֤י פִסַּת בַּ֨ר בָּ/אָרֶץ֮ בְּ/רֹ֪אשׁ הָ֫רִ֥ים יִרְעַ֣שׁ כַּ/לְּבָנ֣וֹן פִּרְי֑/וֹ וְ/יָצִ֥יצוּ מֵ֝/עִ֗יר כְּ/עֵ֣שֶׂב הָ/אָֽרֶץ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/016.yaml
  text: May there be an abundance of grain in the land[a]; on the tops of the mountains may its fruit wave like Lebanon; and may people blossom from the city like the grass of the earth.
translation:
  language: sw
  text: Iwepo wingi wa nafaka nchini[a]; juu ya vilele vya milima, mazao yake yayumbe kama Lebanoni; na watu wachanue kutoka katika mji kama nyasi za nchi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiganja kimoja cha nafaka nchini.” Kirai cha Kiebrania ni adimu, na huenda kikasisitiza ama kiasi kidogo kinachozalishwa kwa wingi wa ajabu, ama wingi wa nafaka tu.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי
  choice: Na kuwe na
  rationale: Hali ya amri-ombi ya kitenzi היה inaonyesha ombi au takwa; “na kuwe na” ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: פִסַּת
  choice: wingi wa
  rationale: Nomino hii ni adimu na maana yake inajadiliwa. “Wingi wa” inafaa muktadha wa ustawi mkubwa, huku maana inayowezekana ya “konzi moja ya” ikihifadhiwa katika tanbihi.
- source_word: בַּר
  choice: nafaka
  rationale: Hapa neno hili linamaanisha mazao ya jamii ya nafaka kwa ujumla, si aina moja maalumu.
- source_word: בָּאָרֶץ
  choice: nchini
  rationale: Katika ombi hili kwa ajili ya utawala wa mfalme, neno linarejelea nchi yenye mashamba na watu wake kuliko dunia nzima.
- source_word: בְּרֹאשׁ הָרִים
  choice: juu ya vilele vya milima
  rationale: Hii inawasilisha taswira ya mavuno mengi hata mahali pa juu pasipotazamiwa kuwa na rutuba.
- source_word: יִרְעַשׁ
  choice: na yayumbe
  rationale: Kitenzi kina maana ya kutikisika au kuyumba. Katika taswira ya nafaka nyingi, “yayumbe” huonyesha mwendo wa mazao yanapopigwa na upepo bila kupoteza picha ya Kiebrania.
- source_word: כַּלְּבָנוֹן
  choice: kama Lebanoni
  rationale: Ulinganisho wa moja kwa moja na Lebanoni umehifadhiwa bila kufafanua kama unalenga misitu, fahari, au ustawi wake.
- source_word: פִּרְיוֹ
  choice: mazao yake
  rationale: Kiambishi cha umoja kinarejelea kwa kawaida nafaka kwa maana ya jumla. “Mazao yake” ni ya asili zaidi kwa nafaka kuliko “matunda yake.”
- source_word: וְיָצִיצוּ
  choice: na watu wachanue
  rationale: Kitenzi humaanisha kuchanua au kuchipua. “Watu” wameelezwa wazi kama wahusika wanaodokezwa na kutokea mjini, huku sitiari ya mimea ikihifadhiwa.
- source_word: מֵעִיר
  choice: kutoka mjini
  rationale: Tafsiri hii inadumisha kihusishi “kutoka” na umoja wa “mji,” ambao huenda umetumiwa kiwakilishi au kijumla.
- source_word: כְּעֵשֶׂב הָאָרֶץ
  choice: kama majani ya nchi
  rationale: Ulinganisho huu unaonyesha ukuaji na kuongezeka kwa wingi. “Majani” hapa yanawakilisha mimea inayoota kwa wingi.
theological_decisions:
- issue: Maana ya kirai adimu פִסַּת בַּר
  choice: wingi wa nafaka
  alternative: konzi moja ya nafaka
  rationale: Muktadha unaomba baraka na ustawi mkubwa chini ya mfalme, na unaendelea na taswira ya mazao yanayoyumba kama Lebanoni na watu wanaochanua. Hata hivyo, maana ya jadi ya “konzi moja” inawezekana kiisimu, kwa hiyo imehifadhiwa katika tanbihi.
- issue: Mhusika wa וְיָצִיצוּ
  choice: watu wachanue
  alternative: nao wachanue
  rationale: Kiebrania hakitaji nomino ya mhusika waziwazi, lakini wingi wa kitenzi na kirai “kutoka mjini” vinaelekea kwa wakazi. Kutaja “watu” kunafanya Kiswahili kiwe wazi bila kuondoa sitiari ya kuchanua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa ombi la kishairi na lugha ya sasa yenye hadhi. Sitiari za mazao kuyumba na watu kuchanua zimehifadhiwa, na utata halisi wa kirai cha mwanzo umeelezwa katika tanbihi.
