  yaml_path: translation/ot/psalms/072/007.yaml
  text: In his days the righteous will flourish[d][c][b][a], and there will be an abundance of peace until the moon is no more.
translation:
  language: sw
  text: Katika siku zake, wenye haki watasitawi,[a] na kutakuwa na amani tele[b] mpaka mwezi usiwepo tena.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwenye haki atasitawi,” labda ikimaanisha mfalme mwenyewe badala ya wenye haki kwa ujumla.
    reason: alternative_reading
  - marker: b
    text: Neno la Kiebrania linalotafsiriwa “amani” linaweza pia kumaanisha hali njema, ukamilifu, au ustawi.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “mpaka hakuna mwezi”—usemi wa kishairi unaoonyesha kudumu kwa muda mrefu sana.
    reason: cultural_note
lexical_decisions:
- source_word: יִפְרַח
  choice: watasitawi
  rationale: Kitenzi פרח humaanisha kuchipua, kuchanua, au kustawi. ‘Watasitawi’ kinawasilisha sitiari ya mafanikio na ustawi wa wenye haki kwa Kiswahili cha kawaida.
- source_word: בְּיָמָיו
  choice: Katika siku zake
  rationale: Huhifadhi nahau ya Kiebrania inayorejelea kipindi cha utawala wa mfalme bila kuongeza ufafanuzi usio katika mstari.
- source_word: צַדִּיק
  choice: wenye haki
  rationale: Ingawa umbo la Kiebrania ni umoja, kivumishi kilichotumiwa kama nomino kinaweza kuwa na maana ya kijumla. ‘Wenye haki’ ni ya kawaida na inafaa muktadha, huku uwezekano wa umoja ukihifadhiwa katika tanbihi.
- source_word: וְרֹב שָׁלוֹם
  choice: na kutakuwa na amani tele
  rationale: ‘Amani tele’ huonyesha wingi unaomaanishwa na רֹב; ‘kutakuwa na’ huweka wazi kishirikishi kilichodokezwa katika kishazi cha Kiebrania na kufanya Kiswahili kitiririke vizuri.
- source_word: שָׁלוֹם
  choice: amani
  rationale: ‘Amani’ ndiyo maana ya msingi iliyo wazi katika muktadha huu, ingawa shalom pia hujumuisha ustawi, hali njema, na ukamilifu; upana huo umeelezwa katika tanbihi.
- source_word: עַד בְּלִי יָרֵחַ
  choice: mpaka mwezi usiwepo tena
  rationale: Tafsiri hii inabaki karibu na taswira ya Kiebrania ya ‘mpaka hakuna mwezi’ huku ikisikika kwa kawaida na kuwasilisha muda unaodumu sana.
theological_decisions:
- issue: Upeo wa צַדִּיק katika zaburi ya kifalme
  choice: 'Maana ya kijumla: ‘wenye haki’'
  alternative: 'Umoja: ‘mwenye haki,’ labda akimrejelea mfalme mwenyewe'
  rationale: Umoja wa kisarufi unaweza kutumiwa kijumla, na ulinganifu na wingi wa amani katika utawala wa mfalme unaunga mkono maana ya watu wenye haki kwa ujumla. Tanbihi inahifadhi uwezekano wa kumrejelea mtu mmoja bila kuingiza dai finyu la kimasiya katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wenye heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘Katika siku zake’ huhifadhi mwangwi wa kifalme wa chanzo; ‘watasitawi’ ni wa asili kuliko tafsiri halisi ya kibotania katika muktadha huu.
