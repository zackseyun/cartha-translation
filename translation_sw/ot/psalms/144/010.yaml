base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/010.yaml
  text: the one who gives salvation to kings[b][a], who rescues David his servant from the evil sword.
translation:
  language: sw
  text: yeye awapaye wafalme wokovu[a], anayemwokoa Daudi mtumishi wake kutoka kwa upanga mwovu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukombozi” au “ushindi” badala ya “wokovu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “upanga wenye kuua.” Kiebrania husema kihalisi “upanga mwovu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתֵן
  choice: yeye awapaye
  rationale: Kitenzi kishirikishi chenye kibainishi kimetumika kama nomino, kikimtaja Mungu kuwa ‘yeye awapaye’; muundo huu unahifadhi mtindo wa Kiebrania huku ukisikika kwa heshima katika Kiswahili.
- source_word: תְּשׁוּעָה
  choice: wokovu
  rationale: Neno hili linaweza kumaanisha wokovu, ukombozi, au ushindi. ‘Wokovu’ huhifadhi upana wa tendo la Mungu la kuokoa bila kuondoa muktadha wa kifalme na wa vita.
- source_word: לַמְּלָכִים
  choice: wafalme
  rationale: Katika muundo ‘awapaye wafalme wokovu,’ wafalme ndio wapokeaji wa tendo hilo, hivyo maana ya kihusishi ל imewasilishwa kwa kawaida katika sarufi ya Kiswahili.
- source_word: הַפּוֹצֶה
  choice: anayemwokoa
  rationale: Kitenzi kishirikishi kinaonyesha kumtoa mtu katika hatari. ‘Anayemwokoa’ ni cha kawaida na kinaendana na wazo la wokovu katika kipashio cha kwanza.
- source_word: אֶת דָּוִד
  choice: Daudi
  rationale: Jina limewasilishwa kwa umbo lake la kawaida katika Kiswahili cha Biblia.
- source_word: עַבְדּוֹ
  choice: mtumishi wake
  rationale: Katika kumtaja Daudi mbele za Mungu, neno hili ni cheo cha kifalme na cha agano; ‘mtumishi’ linafaa kuliko ‘mtumwa,’ ambalo lingeingiza mkazo usiolengwa hapa.
- source_word: מֵחֶרֶב רָעָה
  choice: kutoka kwa upanga mwovu
  rationale: Kihusishi מן kinaonyesha kuokolewa kutoka katika hatari, na ‘upanga mwovu’ huhifadhi kwa karibu usemi wa Kiebrania huku tanbihi ikieleza maana inayowezekana ya upanga wenye kuua.
theological_decisions:
- issue: Upana wa maana ya תְּשׁוּעָה katika muktadha wa kifalme na wa kijeshi
  choice: wokovu
  alternative: ukombozi; ushindi
  rationale: Muktadha unahusu wafalme na kuokolewa kwa Daudi kutoka kwa upanga, kwa hiyo maana ya kijeshi ipo. Hata hivyo, ‘wokovu’ huhifadhi pia uzito mpana wa kitheolojia wa neno la Kiebrania.
- issue: Jinsi ya kutafsiri עַבְדּוֹ kuhusu Daudi
  choice: mtumishi wake
  alternative: mtumwa wake
  rationale: Hapa neno linamtambulisha Daudi kwa uhusiano wake wa kifalme na wa agano kwa Mungu; ‘mtumishi’ huwasilisha maana hiyo bila kusisitiza isivyofaa hali ya utumwa.
- issue: Maana ya רָעָה inapouelezea upanga
  choice: mwovu
  alternative: wenye kuua; hatari
  rationale: ‘Mwovu’ huhifadhi usemi halisi na mvutano wa Kiebrania, badala ya kuamua kimya kwamba maana yake ni ‘wenye kuua’ tu. Maana hiyo ya kimuktadha imetolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo ‘yeye awapaye’ unahifadhi tabia ya kishirikishi ya Kiebrania; ‘anayemwokoa’ huendeleza ulinganifu bila kufanya sentensi kuwa nzito. Alama zote za tanbihi zimewekwa mara moja katika matini kuu.
