id: PSA.144.7
reference: Psalms 144:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: שְׁלַ֥ח יָדֶ֗י/ךָ מִ/מָּ֫ר֥וֹם פְּצֵ֣/נִי וְ֭/הַצִּילֵ/נִי מִ/מַּ֣יִם רַבִּ֑ים מִ֝/יַּ֗ד בְּנֵ֣י נֵכָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/007.yaml
  text: Stretch out your hand from on high[a]; rescue me and deliver me from many waters[b], from the hand of foreign sons.
translation:
  language: sw
  text: Nyosha mkono wako kutoka juu; uniokoe na kuninusuru kutoka katika maji mengi[a], kutoka mkononi mwa wana wa kigeni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maji makuu.” Usemi wa Kiebrania ni taswira ya kishairi ya hatari inayomlemea mtu.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “wana wa ugeni”; ni nahau inayomaanisha wageni.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח יָדֶיךָ
  choice: Nyosha mkono wako
  rationale: Amri pamoja na ‘mkono wako’ inaeleza kunyoosha mkono ili kutenda; tafsiri hii inadumisha taswira halisi ya Mungu kuingilia kati.
- source_word: מִמָּרוֹם
  choice: kutoka juu
  rationale: Neno linamaanisha mahali pa juu au palipoinuka; ‘kutoka juu’ huhifadhi taswira ya mahali bila kulibainisha zaidi kuwa mbinguni.
- source_word: פְּצֵנִי
  choice: uniokoe
  rationale: Katika muktadha huu kitenzi kina maana ya kumtoa mtu katika hatari au kumwokoa.
- source_word: וְהַצִּילֵנִי
  choice: na kuninusuru
  rationale: Kitenzi hiki humaanisha kumponya au kumtoa mtu katika hatari; ‘kuninusuru’ hudumisha usambamba na ‘uniokoe’ bila marudio yasiyo ya lazima.
- source_word: מִמַּיִם רַבִּים
  choice: kutoka katika maji mengi
  rationale: Hii ndiyo maana ya karibu ya maneno ya Kiebrania, huku taswira ya kishairi ya hatari inayozidi nguvu ikidumishwa.
- source_word: מִיַּד
  choice: kutoka mkononi mwa
  rationale: Tafsiri halisi ya nahau hii inadumisha usambamba wa kishairi na ‘mkono wako’ mwanzoni mwa mstari na inaeleweka kama kuokolewa kutoka katika mamlaka ya mtu.
- source_word: בְּנֵי נֵכָר
  choice: wana wa kigeni
  rationale: Tafsiri hii inadumisha usemi wa kifamilia ulio katika Kiebrania na umbo lake la kiume; tanbihi inaeleza maana yake ya kinahau.
theological_decisions:
- issue: Lugha inayomweleza Mungu kwa taswira ya mwili
  choice: Kudumisha ‘Nyosha mkono wako kutoka juu’
  alternative: ‘Uingilie kati kutoka mbinguni’
  rationale: Chanzo kinatumia taswira halisi ya mkono wa Mungu kuonyesha tendo lake la kuokoa; haipaswi kubadilishwa kimya kuwa wazo dhahania.
- issue: Usemi wa kiume בְּנֵי נֵכָר
  choice: wana wa kigeni
  alternative: wageni
  rationale: Chanzo kinatumia nomino ya kiume ya kifamilia. Tafsiri kuu inadumisha umbo hilo, na tanbihi inaeleza maana pana ya kinahau.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa mstari na taswira za ‘mkono’ na ‘maji mengi’ zimedumishwa, huku msamiati ukiwa wazi kwa msomaji wa kawaida.
