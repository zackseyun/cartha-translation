  yaml_path: translation/ot/psalms/144/009.yaml
  text: O God[a], I will sing a new song to you; on a ten-stringed harp I will make music to you.
translation:
  language: sw
  text: Ee Mungu, nitakuimbia wimbo mpya; kwa kinubi chenye nyuzi kumi[a] nitakupigia muziki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa zeze lenye nyuzi kumi,” au, kwa ujumla zaidi, “kwa ala yenye nyuzi kumi”; haijulikani kwa uhakika ni ala gani ya kale inayomaanishwa na נֵבֶל.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Nomino hii imetumiwa kama mwito wa moja kwa moja; “Ee Mungu” ni usemi wa kawaida na wenye hadhi katika sala ya kishairi.
- source_word: שִׁיר חָדָשׁ
  choice: wimbo mpya
  rationale: Tafsiri ya moja kwa moja na ya asili inayohifadhi dhamira ya zaburi ya kuimba wimbo mpya.
- source_word: אָשִׁירָה
  choice: nitakuimbia
  rationale: Umbo la kohotativi linaonyesha azimio au nia; “nitakuimbia” pia huunganisha kwa kawaida kitendo cha kuimba na Mungu anayeelekezewa sifa.
- source_word: לָּךְ
  choice: -ku- / kwako
  rationale: Kihusishi kinaonyesha anayeelekezewa wimbo na muziki; katika Kiswahili kiambishi cha yambwa “-ku-” hutoa maana hiyo kwa ufasaha.
- source_word: בְּנֵבֶל עָשׂוֹר
  choice: kwa kinubi chenye nyuzi kumi
  rationale: נֵבֶל ni ala ya nyuzi ambayo utambulisho wake kamili wa kale hauna uhakika. “Kinubi” ni istilahi ya kawaida ya kibiblia, na “kwa” inaonyesha ala inayotumiwa.
- source_word: אֲזַמְּרָה
  choice: nitakupigia muziki
  rationale: Kitenzi kinaweza kumaanisha kupiga muziki au kuimba sifa. Kwa kuwa ala imetajwa wazi, usemi huu unaonyesha utendaji wa muziki bila kurudia tu wazo la kuimba.
