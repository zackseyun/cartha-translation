translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi, wa sala, na unaoeleweka kwa wasomaji wa kawaida. Kurudiwa kwa “nitaku-” kunahifadhi uelekeo wa moja kwa moja kwa Mungu katika mistari yote miwili.
