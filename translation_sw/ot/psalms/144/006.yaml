  text: Flash forth lightning and scatter them[a]; send out your arrows and throw them into confusion.
translation:
  language: sw
  text: Rusha radi na uwatawanye; tuma mishale yako na uwatie katika fadhaa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwavuruge” au “uwashinde vitani.” Kitenzi cha mwisho kinaweza kumaanisha kusababisha hofu, fadhaa, mkanganyiko, au kushindwa vitani.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוֹק בָּרָק
  choice: Mulika kwa umeme
  rationale: Kitenzi cha amri na nomino inayohusiana vinatoa picha ya Mungu akitoa umeme. Kiswahili hiki ni cha asili na kinahifadhi urudiaji wa maana bila kulazimisha idadi ya radi.
- source_word: וּתְפִיצֵם
  choice: na uwatawanye
  rationale: Hifili ya פוץ ina maana ya kuwasababisha maadui watawanyike; “uwatawanye” ni ya moja kwa moja na inafaa muktadha wa vita.
- source_word: שְׁלַח חִצֶּיךָ
  choice: tuma mishale yako
  rationale: Inahifadhi amri na picha halisi ya mishale ya Mungu kwa lugha ya kawaida na yenye hadhi.
- source_word: וּתְהֻמֵּם
  choice: na uwavuruge
  rationale: המה/המם hapa inaweza kumaanisha kusababisha fadhaa, mkanganyiko, au kushindwa vitani. “Uwavuruge” huhifadhi upana huo kuliko neno linaloelekea kwenye mkanganyiko wa akili pekee.
theological_decisions:
- issue: Taswira ya Mungu kama shujaa
  choice: Kuhifadhi ombi la moja kwa moja kwa Mungu atumie umeme na mishale katika taswira ya vita.
  alternative: Kulainisha mstari uwe ombi la jumla la msaada au hukumu.
  rationale: Kiebrania kinatumia amri za kishairi zinazoelekezwa kwa Mungu na taswira wazi ya vita; tafsiri haipaswi kuifuta wala kuifanya kuwa maelezo yasiyo ya kishairi.
- issue: Upana wa maana ya וּתְהֻמֵּם
  choice: uwavuruge
  alternative: uwatie katika mkanganyiko; uwashinde kabisa
  rationale: Neno la chanzo linaweza kuhusisha fadhaa, vurugu, au kushindwa vitani. Chaguo hili linaacha mvutano huo wa kimaana wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa amri sambamba na taswira ya vita vimehifadhiwa.
