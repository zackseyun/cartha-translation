base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/002.yaml
  text: My steadfast love and my fortress[a], my stronghold and my deliverer, my shield, and in him I take refuge[b], the one who subdues peoples under me.
translation:
  language: sw
  text: Upendo wangu wa kudumu na ngome yangu, kimbilio langu salama na mkombozi wangu[a], ngao yangu; kwake mimi hukimbilia kupata hifadhi—yeye anayewatiisha watu wangu[b] chini yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaongeza kihalisi “kwangu.”
    reason: literal_rendering
  - marker: b
    text: Au “mataifa.” Baadhi ya tafsiri za kale zinaunga mkono maana ya wingi hapa; maandishi ya Kimasora yana “watu wangu.”
    reason: alternative_reading
lexical_decisions:
- source_word: חַסְדִּי
  choice: upendo wangu wa kudumu
  rationale: חֶסֶד huonyesha upendo mwaminifu na wa kudumu, mara nyingi ukiwa na maana ya uaminifu wa agano. Hapa ni jina la kishairi linalomtaja Mungu.
- source_word: מְצוּדָתִי
  choice: ngome yangu
  rationale: Neno hili linaonyesha mahali penye nguvu pa kujilinda; “ngome” ni tafsiri ya kawaida na yenye kueleweka katika Kiswahili.
- source_word: מִשְׂגַּבִּי
  choice: kimbilio langu salama
  rationale: Neno la Kiebrania humaanisha mahali pa juu na salama pa ulinzi. Tafsiri hii inasisitiza usalama bila kutumia usemi usio wa kawaida katika Kiswahili.
- source_word: מְפַלְטִי לִי
  choice: mkombozi wangu
  rationale: מְפַלְטִי humaanisha anayeokoa au kuwezesha mtu aponyoke. לִי huongeza mkazo wa manufaa binafsi, lakini kuitafsiri moja kwa moja kuwa “mkombozi wangu kwa ajili yangu” kungekuwa na uradidi usio wa kawaida; maana hiyo imeelezwa katika tanbihi.
- source_word: מָגִנִּי
  choice: ngao yangu
  rationale: Ni sitiari ya moja kwa moja ya kijeshi inayomaanisha ulinzi.
- source_word: וּבוֹ חָסִיתִי
  choice: ambaye kwake ninakimbilia kupata hifadhi
  rationale: Kitenzi חסה humaanisha kukimbilia au kutafuta hifadhi. Wakati timilifu wa Kiebrania unaweza kueleweka kama tendo la wakati uliopita au hali endelevu; wakati wa sasa unafaa kwa ungamo hili la kishairi.
- source_word: הָרוֹדֵד
  choice: anayewatiisha
  rationale: Kitenzi רדה hapa kina maana ya kuleta chini ya mamlaka au utawala, kulingana na muktadha wa kifalme na kijeshi.
- source_word: עַמִּי
  choice: watu wangu
  rationale: Maandishi ya Kimasora yanasomeka katika umoja wenye kiambishi cha nafsi ya kwanza, yaani “watu wangu.” Baadhi ya mashahidi wa kale huunga mkono maana ya wingi, “mataifa” au “watu mbalimbali,” ambayo imehifadhiwa katika tanbihi.
- source_word: תַחְתָּי
  choice: chini yangu
  rationale: Hii ni sitiari ya nafasi inayoonyesha kuwa chini ya mamlaka ya mfalme; tafsiri ya moja kwa moja ni wazi katika Kiswahili.
theological_decisions:
- issue: Iwapo עַמִּי itafsiriwe “watu wangu” au ifuatwe maana ya wingi inayopatikana katika baadhi ya mapokeo ya kale.
  choice: watu wangu
  alternative: mataifa chini yangu / watu mbalimbali chini yangu
  rationale: Maandishi ya Kimasora yana “watu wangu,” hivyo yamepewa nafasi katika matini kuu. Usemi unaweza kumaanisha kwamba Mungu anawaweka watu wa mfalme chini ya utawala wake, bila kulazimisha maana ya ukandamizaji. Maana ya wingi imehifadhiwa katika tanbihi kwa sababu ya ushahidi wa kale na ulinganifu na Zaburi 18:47.
- issue: Jinsi ya kuwasilisha לִי baada ya “mkombozi wangu.”
  choice: kutoiweka kama kirai tofauti katika matini kuu
  alternative: mkombozi wangu kwa ajili yangu
  rationale: Kiebrania kina mkazo wa uhusiano au manufaa binafsi, lakini Kiswahili cha moja kwa moja kingekuwa na uradidi. Kiambishi “wangu” kinawasilisha kiini cha maana, huku tanbihi ikihifadhi muundo wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa kishairi, wenye heshima na unaoeleweka kwa msomaji wa kawaida. Taswira za kijeshi na za hifadhi zimehifadhiwa, na uradidi usio wa kawaida umeepukwa bila kuficha tofauti za maandishi.
