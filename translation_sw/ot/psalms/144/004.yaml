  yaml_path: translation/ot/psalms/144/004.yaml
  text: Man is like a breath[b][a]; his days are like a passing shadow.
translation:
  language: sw
  text: Mwanadamu ni kama pumzi[a]; siku zake ni kama kivuli kinachopita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mvuke,” “ubatili,” au “utupu.” Neno la Kiebrania הֶבֶל linasisitiza kwamba maisha ya mwanadamu ni mafupi na hayana uthabiti.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: Mwanadamu
  rationale: Neno hili linaweza kumaanisha binadamu mmoja kwa namna ya jumla au wanadamu kwa ujumla. “Mwanadamu” ni la asili katika Kiswahili na linahifadhi kauli ya jumla kuhusu udhaifu wa maisha ya kibinadamu bila kuweka jinsia isiyokusudiwa.
- source_word: לַהֶבֶל
  choice: ni kama pumzi
  rationale: הֶבֶל kimsingi huleta picha ya pumzi au mvuke, na hivyo kuonyesha ufupi na kutodumu kwa maisha. “Pumzi” linahifadhi picha halisi ya kishairi kuliko tafsiri dhahania kama “ubatili” au “utupu.”
- source_word: דָּמָה
  choice: ni kama
  rationale: Kitenzi hiki humaanisha kufanana na kitu. “Ni kama” ni usemi wa kawaida na wa moja kwa moja wa kulinganisha katika Kiswahili.
- source_word: יָמָיו
  choice: siku zake
  rationale: Hii ni tafsiri ya moja kwa moja ya umbo la wingi lenye kiwakilishi milikishi, likimaanisha muda wa maisha ya mwanadamu huyo.
- source_word: כְּצֵל
  choice: ni kama kivuli
  rationale: Kiambishi כְּ huanzisha tashbihi, na “kama kivuli” kinahifadhi picha ya kishairi ya kitu kisicho na uthabiti na kisichodumu.
- source_word: עוֹבֵר
  choice: kinachopita
  rationale: Hali ya kushiriki ya עבר inaonyesha kitu kinachoendelea kupita. “Kinachopita” huhifadhi mwendo wa picha hiyo na ni cha asili katika Kiswahili.
