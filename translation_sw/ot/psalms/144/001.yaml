  yaml_path: translation/ot/psalms/144/001.yaml
  text: Of David. Blessed be Yahweh[a], my rock, who trains my hands for battle, my fingers for war.
translation:
  language: sw
  text: 'Ya Daudi.[a]


    Ahimidiwe Yahweh, mwamba wangu,

    Anayezizoeza mikono yangu kwa vita,

    Na vidole vyangu kwa mapigano.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kwa Daudi” au “Na Daudi.” Kihusishi cha Kiebrania katika kichwa cha zaburi kinaweza kuonyesha uandishi, uhusiano, au kuwekwa wakfu.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Kihusishi לְ katika kichwa cha zaburi kinaweza kuonyesha uandishi, uhusiano, au kuwekwa wakfu. “Ya Daudi” ni usemi wa kawaida wa Kiswahili ambao hauamui kwa lazima maana moja tu.
- source_word: בָּרוּךְ
  choice: Abarikiwe
  rationale: Kauli hii ya kiliturujia inahifadhi muundo wa Kiebrania wa kumtangaza Mungu kuwa mwenye kubarikiwa, badala ya kuibadili moja kwa moja kuwa “asifiwe.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama “Yahweh,” si kubadilishwa kuwa cheo.
- source_word: צוּרִי
  choice: mwamba wangu
  rationale: Neno צוּר linamaanisha mwamba na hapa ni sitiari ya uthabiti na ulinzi wa Mungu; picha halisi imehifadhiwa.
- source_word: הַמְלַמֵּד
  choice: anayefundisha
  rationale: Umbo la kitenzi linaonyesha tendo la kawaida au linaloendelea. “Anayefundisha” ni la asili na linafaa katika muktadha wa maandalizi ya mapigano.
- source_word: יָדַי
  choice: mikono yangu
  rationale: Lugha halisi ya kiungo cha mwili imehifadhiwa, pamoja na picha yake ya kishairi.
- source_word: לַקְרָב
  choice: kupigana
  rationale: קְרָב huhusu mapambano au vita. Katika Kiswahili, “kufundisha mikono ... kupigana” huwasilisha kwa uwazi kusudi la mafunzo.
- source_word: אֶצְבְּעוֹתַי
  choice: vidole vyangu
  rationale: Neno mahususi “vidole” limehifadhiwa ili kudumisha usambamba wa kishairi na “mikono yangu.”
- source_word: לַמִּלְחָמָה
  choice: kufanya vita
  rationale: מִלְחָמָה humaanisha vita. “Kufanya vita” hudumisha tofauti ndogo kati ya kishazi hiki na “kupigana,” huku kikiwasilisha lugha ya kijeshi waziwazi.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova au BWANA
  rationale: Andiko la Kiebrania linatumia jina la Mungu moja kwa moja. Kulitohowa kama “Yahweh” huhifadhi jina hilo badala ya kuliwakilisha kwa cheo.
- issue: Lugha ya kijeshi inayohusishwa na Mungu
  choice: Kuhifadhi picha ya Mungu anayefundisha mikono kupigana na vidole kufanya vita
  alternative: Kuifanya kuwa lugha ya jumla kuhusu kutiwa nguvu au kuvumilia
  rationale: Kiebrania kinazungumzia wazi maandalizi ya mapigano ya silaha. Tafsiri haipaswi kuondoa uzito huo wa kihistoria na kiteolojia kwa kuifanya kuwa ya kiroho tu.
- issue: Maana ya kichwa לְדָוִד
  choice: Ya Daudi
  alternative: Kwa Daudi au Iliyoandikwa na Daudi
  rationale: Kihusishi cha Kiebrania kinaweza kuonyesha uandishi, uhusiano, au kuwekwa wakfu. Tafsiri kuu na tanbihi zimehifadhi uwezekano huo bila kuamua zaidi ya ushahidi wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Usambamba wa “mikono yangu ... vidole vyangu” na lugha halisi ya kijeshi umehifadhiwa.
