base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/000.yaml
  text: Of David. Blessed is Yahweh[a], my rock, who trains my hands for battle, my fingers for war.
translation:
  language: sw
  text: Ya Daudi.[a] Ahimidiwe Yahwe, mwamba wangu, anayefundisha mikono yangu kwa mapigano, na vidole vyangu kwa vita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kwa Daudi” au “Na Daudi” katika kichwa cha zaburi; kihusishi cha Kiebrania kinaweza kuonyesha uandishi, uhusiano, au wakfu.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Ya Daudi
  rationale: Kichwa kifupi na cha kawaida cha zaburi; kihusishi לְ kinaweza kuonyesha uandishi, uhusiano, au wakfu, hivyo uwezekano mwingine umewekwa katika tanbihi.
- source_word: בָּרוּךְ יְהוָה
  choice: Ahimidiwe Yahwe
  rationale: Hutoa kwa Kiswahili cha asili maana ya tamko la sifa la Kiebrania huku jina la agano likitafsiriwa kwa umbo 'Yahwe'.
- source_word: צוּרִי
  choice: mwamba wangu
  rationale: Hudumisha sitiari halisi ya Kiebrania ya uimara, ulinzi, na usalama.
- source_word: הַמְלַמֵּד
  choice: anayefundisha
  rationale: Huwakilisha moja kwa moja kitenzi cha Kiebrania kinachomaanisha kufundisha au kuzoeza; katika muktadha huu kufundisha kupigana ni Kiswahili cha kawaida.
- source_word: יָדַי לַקְרָב ... אֶצְבְּעוֹתַי לַמִּלְחָמָה
  choice: mikono yangu kupigana, vidole vyangu kufanya vita
  rationale: Huhifadhi usambamba wa kishairi wa 'mikono/vidole' na 'mapigano/vita' bila kuufanya mstari uwe mzito.
theological_decisions:
- issue: Maana ya לְ katika kichwa cha zaburi
  choice: Ya Daudi
  alternative: Kwa Daudi; Na Daudi
  rationale: Kiebrania hakilazimishi uandishi pekee; tafsiri kuu inatumia kichwa cha kawaida huku tanbihi ikihifadhi uwezekano wa uhusiano, wakfu, au uandishi.
- issue: Uwakilishi wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Jina binafsi la Mungu limehifadhiwa kwa unukuzi badala ya kubadilishwa kuwa cheo, bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Usambamba wa Kiebrania na sitiari ya “mwamba” zimehifadhiwa.
