  text: אַלּוּפֵ֗י/נוּ מְֽסֻבָּ֫לִ֥ים אֵֽין פֶּ֭רֶץ וְ/אֵ֣ין יוֹצֵ֑את וְ/אֵ֥ין צְ֝וָחָ֗ה בִּ/רְחֹבֹתֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/014.yaml
  text: Our cattle are heavy with young[a]; there is no breach and no going out[c][b], and no cry in our streets.
translation:
  language: sw
  text: Ng’ombe wetu wamebeba mizigo[a]; hakuna uvunjaji, wala hakuna kutoka[b][c], wala hakuna kilio katika mitaa yetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mifugo yetu ina mimba nzito.” Neno la Kiebrania linaweza kumaanisha ng’ombe au mifugo; katika matumizi mengine linaweza pia kumaanisha wakuu au viongozi wa koo. Neno linalotafsiriwa “wamebeba mizigo” kimsingi humaanisha kubebeshwa mzigo au kulemewa. Katika muktadha huu wengine hulielewa kuwa ishara ya mifugo kuzaana kwa wingi.
    reason: lexical_alternative
  - marker: b
    text: Au, “wala hakuna uhamisho” au “wala hakuna mtu anayetoka.” Kiebrania ni kifupi na huenda kinamaanisha kwamba hakuna watu wanaolazimishwa kuondoka mjini.
    reason: alternative_reading
  - marker: c
    text: Au, “wala hakuna kuondoka.”
    reason: previous_rendering
lexical_decisions:
- source_word: אַלּוּפֵינוּ
  choice: mifugo yetu
  rationale: Ingawa neno hili linaweza kumaanisha viongozi au wakuu wa koo, katika muktadha wa wingi na ustawi linaeleweka vizuri zaidi kuwa wanyama wa kufugwa. “Mifugo” ni neno la kawaida linalobeba maana pana ya ng’ombe au wanyama hao bila kuibana kupita ushahidi wa Kiebrania.
- source_word: מְסֻבָּלִים
  choice: ina mimba nzito
  rationale: Kitenzi hiki kimsingi hudokeza kulemewa au kubeba mzigo. Kikihusishwa na mifugo katika muktadha wa ustawi, msemo huu wa Kiswahili unaeleza kwa kawaida wanyama walio karibu kuzaa, huku maana halisi ya kubeba uzito ikielezwa katika tanbihi.
- source_word: אֵין פֶּרֶץ
  choice: hakuna ufa
  rationale: פֶּרֶץ ni mwanya, ufa, au sehemu iliyovunjwa. “Ufa” huhifadhi usemi mfupi wa Kiebrania na unaweza kueleweka kuwa ufa katika ulinzi au ukuta wa mji bila kuongeza maelezo yasiyotajwa wazi.
- source_word: וְאֵין יוֹצֵאת
  choice: wala hakuna kuondoka
  rationale: Kifungu cha Kiebrania ni kifupi na kisicho kamili, kikimaanisha kwa msingi kutoka au kuondoka. Tafsiri hii huhifadhi utata wake badala ya kuamua kama ni kupelekwa uhamishoni, kutoka kwa watu, au tukio jingine.
- source_word: וְאֵין צְוָחָה
  choice: wala hakuna kilio
  rationale: צְוָחָה ni kilio au kelele ya dhiki. “Kilio” ni cha kawaida, kifupi, na kinafaa katika mfululizo wa baraka za usalama.
- source_word: בִּרְחֹבֹתֵינוּ
  choice: katika mitaa yetu
  rationale: Neno hili humaanisha maeneo mapana ya hadhara, mitaa, au viwanja. “Mitaa” ni Kiswahili cha kawaida kinachohifadhi mazingira ya maisha ya umma katika mji.
theological_decisions:
- issue: Je, אַלּוּפֵינוּ inarejelea mifugo au viongozi?
  choice: Imetafsiriwa “mifugo yetu” kwa sababu muktadha unaeleza ustawi wa kilimo na usalama wa jamii.
  alternative: “Wakuu wetu” au “viongozi wetu.”
  rationale: Muunganiko wake na מְסֻבָּלִים na baraka za uzazi katika mistari inayozunguka unaunga mkono maana ya wanyama wa kufugwa, lakini tanbihi inadumisha maana nyingine ya kileksika.
- issue: Maana ya וְאֵין יוֹצֵאת
  choice: Utata umehifadhiwa kwa “hakuna kuondoka.”
  alternative: “Hakuna uhamisho,” “hakuna anayetoka,” au tafsiri nyingine kulingana na muktadha wa vita au mifugo.
  rationale: Kiebrania hakitaji wazi ni nani au nini kinachotoka; hivyo si salama kuamua kimafundisho au kihistoria kuwa ni uhamisho pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo mfupi, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. Muundo unaorudia “hakuna/wala hakuna” unaiga mfululizo wa Kiebrania. “Hakuna kuondoka” umeachwa kwa makusudi ukiwa mpana kidogo ili kutohitimisha utata wa maandishi ya asili.
