  text: יְ֭הוָה הַט שָׁמֶ֣י/ךָ וְ/תֵרֵ֑ד גַּ֖ע בֶּ/הָרִ֣ים וְֽ/יֶעֱשָֽׁנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/005.yaml
  text: O Yahweh[a], bend your heavens and come down[b]; touch the mountains so that they smoke.
translation:
  language: sw
  text: Ee Yahwe, ziinamishe mbingu zako, ushuke[a]; gusa milima ili ifuke moshi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uteremke.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nayo itafuka moshi”; Kiebrania kinaweza kueleweka kuwa moshi ndio matokeo ya Mungu kuigusa milima.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la Mungu limehifadhiwa kwa unukuzi wa kawaida wa Kiswahili, ‘Yahwe’; ‘Ee’ linaonyesha usemi wa moja kwa moja.
- source_word: הַט
  choice: ziinamishe
  rationale: Amri hii ina maana ya kuinamisha au kuelekeza chini; ‘ziinamishe’ inadumisha picha ya mbingu kuinamishwa ili Mungu ashuke.
- source_word: שָׁמֶיךָ
  choice: mbingu zako
  rationale: Wingi pamoja na kiambishi cha nafsi ya pili umehifadhiwa, na usemi huu una hadhi inayofaa ushairi.
- source_word: וְתֵרֵד
  choice: ushuke
  rationale: ‘Ushuke’ ni usemi wa kawaida na wa moja kwa moja kwa mwendo kutoka juu kwenda chini.
- source_word: גַּע
  choice: gusa
  rationale: Kitenzi נגע kwa msingi wake ni ‘gusa’; tafsiri kali zaidi kama ‘piga’ ingeongeza maana isiyotajwa wazi.
- source_word: בֶּהָרִים
  choice: milima
  rationale: Nomino yenye kiarifu katika Kiebrania imetafsiriwa kwa maana yake ya kawaida, ‘milima.’
- source_word: וְיֶעֱשָׁנוּ
  choice: ili ifuke moshi
  rationale: Muundo unaofuata amri unaweza kueleza matokeo ya mguso wa Mungu; ‘ili ifuke moshi’ huwasilisha uhusiano huo bila kupoteza picha ya kishairi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia jina la Mungu moja kwa moja, si cheo; ‘Yahwe’ huhifadhi jina hilo kwa namna inayotambulika katika Kiswahili.
- issue: Uhusiano kati ya kuguswa kwa milima na kufuka kwake moshi
  choice: ili ifuke moshi
  alternative: nayo itafuka moshi
  rationale: Muundo wa Kiebrania unaweza kueleweka kama matokeo yanayokusudiwa au yatakayotokea baada ya amri; matini kuu inaonyesha matokeo, huku tanbihi ikihifadhi uwezekano wa kauli ya wakati ujao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wenye heshima na unaoeleweka. Picha halisi za mbingu kuinamishwa, Mungu kushuka, na milima kufuka moshi zimehifadhiwa.
