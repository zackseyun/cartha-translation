lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heri
  rationale: Neno hili la baraka linaeleza hali ya kustawi na kustahili kupongezwa; “heri” ni la kawaida katika kauli za baraka za Kiswahili na lina hadhi ya kishairi.
- source_word: הָעָם
  choice: watu
  rationale: עָם hapa humaanisha jamii ya watu; “watu” ni la asili zaidi kuliko “taifa” katika muktadha huu wa kishairi.
- source_word: שֶׁכָּכָה לּוֹ
  choice: ambao hali yao iko hivyo
  rationale: Kirai hiki kinarejelea hali iliyoelezwa katika mistari iliyotangulia. Tafsiri hii huhifadhi maana ya “ambao kwao ni hivyo” kwa Kiswahili cha kawaida bila kubainisha zaidi hali hiyo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika Kiebrania limetoholewa moja kwa moja kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהָיו
  choice: Mungu wao
  rationale: Kiambishi cha umilikaji cha umoja katika Kiebrania kinarejelea watu kwa jumla; Kiswahili hutumia kwa kawaida wingi “wao” kwa “watu.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu. “Yahwe” hulihifadhi wazi bila kulibadilisha kuwa cheo, huku “BWANA” ikiwa desturi nyingine ya tafsiri.
- issue: Rejeo la שֶׁכָּכָה לּוֹ
  choice: ambao hali yao iko hivyo
  alternative: ambao wana mambo hayo
  rationale: Kauli ya Kiebrania ni ya jumla na inarejelea maelezo yaliyotangulia; “hali yao iko hivyo” huhifadhi kutokuwa mahsusi badala ya kuifunga kwa mali au baraka fulani pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi, wa kishairi na wenye hadhi. Muundo unaorudiwa wa “Heri watu” umehifadhiwa.
