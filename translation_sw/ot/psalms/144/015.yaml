  text: Blessed are the people for whom it is so[b][a]; blessed are the people whose God is Yahweh.
translation:
  language: sw
  text: Heri watu ambao hali yao iko hivyo;[a] heri watu ambao Mungu wao ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Heri watu ambao kwao ni hivyo.”
