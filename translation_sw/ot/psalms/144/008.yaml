translation:
  language: sw
  text: ambao vinywa vyao hunena ubatili[a], na mkono wao wa kuume ni mkono wa udanganyifu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uongo.” Neno la Kiebrania linaweza kumaanisha utupu, ubatili, jambo lisilo na maana, au udanganyifu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinarudia neno “mkono” kwa msisitizo. Mkono wa kuume unaweza kuashiria kuapa, nguvu, au uaminifu ulioahidiwa; kwa hiyo “mkono wa udanganyifu” unaweza kudokeza hadaa au usaliti.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: ambao
  rationale: Kiwakilishi hiki cha uhusiano kinaendeleza maelezo ya watu waliotajwa katika mstari uliotangulia.
- source_word: פִּיהֶם
  choice: vinywa vyao
  rationale: Ingawa Kiebrania kina nomino ya umoja yenye kiambishi cha wingi, Kiswahili hutumia wingi kwa kawaida inapozungumzia vinywa vya watu wengi.
- source_word: דִּבֶּר
  choice: hunena
  rationale: Kauli hapa inaeleza tabia yao ya kawaida; 'hunena' ni ya sasa ya mazoea na ina hadhi inayofaa zaburi.
- source_word: שָׁוְא
  choice: maneno yasiyo na maana
  rationale: Neno hili linaweza kumaanisha ubatili, utupu, kutokuwa na maana, au uongo; tafsiri hii inadumisha upana wake bila kulifanya sawa kabisa na שָׁקֶר katika sehemu inayofuata.
- source_word: וִימִינָם
  choice: na mikono yao ya kuume
  rationale: Huanza mshororo wa pili sambamba na wa kwanza na kudumisha umilikaji wa wingi kwa Kiswahili cha kawaida.
- source_word: יְמִין
  choice: ni mikono
  rationale: Kurudia 'mikono' kunahifadhi msisitizo wa Kiebrania, huku wingi ukipatana kwa kawaida na kundi la watu.
- source_word: שָׁקֶר
  choice: udanganyifu
  rationale: Huonyesha uongo au hadaa; hapa 'udanganyifu' linaeleza kwa ufasaha mkono unaohusishwa na ahadi isiyo ya kweli au usaliti.
theological_decisions:
- issue: Maana ya mfano wa mkono wa kuume
  choice: Kurudia usemi huo katika maandishi na kueleza uwezekano wake katika tanbihi
  alternative: Kutafsiri moja kwa moja kuwa kiapo cha uongo au usaliti
  rationale: Kiebrania hakitaji wazi kiapo, nguvu, wala ahadi; hivyo picha halisi imehifadhiwa bila kufungiwa katika fasiri moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wa sasa na wenye hadhi. 'Hunena' limetumiwa badala ya 'husema' ili kudumisha sauti ya zaburi bila kuwa ya kale kupita kiasi. Alama zote za tanbihi zimewekwa katika maandishi.
