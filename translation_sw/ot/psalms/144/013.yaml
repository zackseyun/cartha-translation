base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/013.yaml
  text: May our storehouses be full[a], supplying every kind of produce; may our flocks multiply by thousands, by tens of thousands[b], in our open fields.
translation:
  language: sw
  text: Maghala yetu na yajae, yakitoa mazao ya kila aina[a]; makundi yetu ya mifugo na yaongezeke kwa maelfu, kwa makumi ya maelfu, katika maeneo yetu ya wazi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “kutoka aina hadi aina.” Kifungu hiki kinaeleza wingi wa mazao ya namna mbalimbali.
    reason: lexical_alternative
  - marker: b
    text: Au “katika barabara zetu.” Neno la Kiebrania linaweza kumaanisha sehemu za wazi nje au ndani ya makazi; katika muktadha huu wa mifugo, huenda linamaanisha maeneo ya wazi au viunga.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזָוֵינוּ
  choice: maghala yetu
  rationale: Nomino hii adimu inaashiria mahali pa kuhifadhia akiba au mazao. “Maghala” ni neno la kawaida na linalofaa katika muktadha wa baraka za kilimo.
- source_word: מְלֵאִים
  choice: na yajae
  rationale: Kivumishi hiki cha kiarifu kinamaanisha “yamejaa.” Muktadha unaendeleza matakwa ya baraka, kwa hiyo “na yajae” ni Kiswahili cha asili kinacholingana na mtindo huo.
- source_word: מְפִיקִים
  choice: yakitoa
  rationale: Kitenzi hiki katika umbo la endelevu kina wazo la kutoa au kuleta nje. “Yakitoa” huhifadhi taswira ya mazao yanayotolewa kutoka maghalani bila kuongeza wazo lisilokuwamo.
- source_word: מִזַּן אֶל זַן
  choice: mazao ya kila aina
  rationale: Kifungu hiki kwa karibu ni “kutoka aina hadi aina,” yaani wingi wenye namna mbalimbali. “Mazao ya kila aina” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: צֹאנֵנוּ
  choice: makundi yetu ya mifugo
  rationale: Nomino ya jumla inahusu mifugo midogo, hasa kondoo na mbuzi. “Makundi yetu ya mifugo” huhifadhi maana ya kundi bila kuibana iwe kondoo pekee.
- source_word: מַאֲלִיפוֹת
  choice: yaongezeke kwa maelfu
  rationale: Umbo hili linatokana na neno linalohusiana na “elfu” na kueleza ongezeko kubwa. “Yaongezeke kwa maelfu” ni wazi na linaendeleza ombi la baraka.
- source_word: מְרֻבָּבוֹת
  choice: kwa makumi ya maelfu
  rationale: Neno hili linatokana na “elfu kumi” na huendeleza ongezeko la kiwango kutoka maelfu hadi makumi ya maelfu.
- source_word: בְּחוּצוֹתֵינוּ
  choice: katika maeneo yetu ya wazi
  rationale: חוּץ inaweza kumaanisha sehemu za nje, maeneo ya wazi, au barabara za makazi. “Maeneo yetu ya wazi” huhifadhi upana huo na kufaa kwa muktadha wa mifugo bila kulazimisha maana ya mashamba.
