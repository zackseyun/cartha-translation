translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. Muundo wa “na ...” umetumiwa kuonyesha matakwa ya baraka. “Maeneo ya wazi” huepuka neno la mijini kupita kiasi na wakati huohuo huhifadhi utata halisi wa Kiebrania.
