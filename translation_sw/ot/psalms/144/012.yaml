  text: אֲשֶׁ֤ר בָּנֵ֨י/נוּ כִּ/נְטִעִים֮ מְגֻדָּלִ֪ים בִּֽ/נְעוּרֵ֫י/הֶ֥ם בְּנוֹתֵ֥י/נוּ כְ/זָוִיֹּ֑ת מְ֝חֻטָּב֗וֹת תַּבְנִ֥ית הֵיכָֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/012.yaml
  text: May our sons be like well-grown plants in their youth[c][b][a], and our daughters like corner pillars carved in the pattern of a palace.
translation:
  language: sw
  text: 'Wana wetu wawe kama mimea iliyostawi katika ujana wao,

    na binti zetu kama nguzo za pembe zilizochongwa kwa muundo wa jumba la kifalme.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hekalu.” Neno la Kiebrania linaweza kumaanisha jumba la kifalme, hekalu, au ukumbi mkubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: na wawe
  rationale: Ingawa kwa kawaida ni kiwakilishi cha uhusiano, hapa inaanzisha hali inayotamaniwa inayohusiana na ombi lililotangulia; ‘na wawe’ huonyesha maana hiyo kwa Kiswahili cha kawaida bila kuifanya kuwa kauli ya uhakika.
- source_word: בָּנֵינוּ
  choice: wana wetu
  rationale: Neno la Kiebrania linamaanisha wana wa kiume hasa na linadumisha ulinganifu na ‘binti zetu’ katika mstari unaofuata.
- source_word: כִּנְטִעִים מְגֻדָּלִים
  choice: kama mimea iliyostawi
  rationale: Taswira ni ya mimea iliyopandwa na kukuzwa hadi ikakua vizuri; ‘iliyostawi’ huwasilisha ukuaji wenye afya kwa lugha ya asili na yenye hadhi.
- source_word: בִּנְעוּרֵיהֶם
  choice: wakati wa ujana wao
  rationale: Kirai hiki kinaonyesha kipindi ambacho wana hao wanastawi, bila kulazimisha maana ya ‘tangu ujana wao’.
- source_word: בְּנוֹתֵינוּ
  choice: binti zetu
  rationale: Hili ndilo neno mahususi na la heshima kwa watoto wa kike, sambamba na ‘wana wetu’.
- source_word: כְזָוִיּוֹת
  choice: kama nguzo za pembeni
  rationale: Neno linahusiana na pembe ya jengo; katika taswira hii ya usanifu linaeleweka vizuri kama sehemu mashuhuri za kutegemeza au kupamba pembe, bila kulifanya kuwa ‘mawe ya pembeni’.
- source_word: מְחֻטָּבוֹת
  choice: zilizochongwa
  rationale: Umbo tendwa linaonyesha kitu kilichokatwa na kuumbwa kwa ustadi; ‘zilizochongwa’ linafaa kwa mapambo ya usanifu.
- source_word: תַּבְנִית
  choice: kwa muundo wa
  rationale: Neno linaweza kumaanisha umbo, kielelezo, au mpango; ‘kwa muundo wa’ ni la kawaida na linahifadhi wazo la kitu kilichotengenezwa kwa kufuata sura fulani.
- source_word: הֵיכָל
  choice: jumba la kifalme
  rationale: Katika muktadha wa ustawi wa nyumbani na taifa, maana isiyo ya kiibada ya jumba la fahari inafaa vizuri. Maana nyingine halali ya ‘hekalu’ imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Mahali panaporejelewa na הֵיכָל katika tashbihi ya binti
  choice: jumba la kifalme
  alternative: hekalu au ukumbi mkubwa
  rationale: Muktadha unaeleza ustawi wa familia na jamii kwa taswira mbili zinazolingana. ‘Jumba la kifalme’ linaonyesha fahari ya usanifu bila kuingiza rejeo la ibada ambalo muktadha haulazimishi; hata hivyo, uwezekano wa ‘hekalu’ umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na lugha ya sasa yenye hadhi. Mistari miwili inadumisha ulinganifu wa wana na binti pamoja na taswira za ukuaji na usanifu.
