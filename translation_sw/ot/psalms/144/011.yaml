base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/011.yaml
  text: Rescue me and deliver me from the hand of foreigners[c][b][a], whose mouth speaks falsehood and whose right hand is a right hand of deceit.
translation:
  language: sw
  text: Uniokoe na unikomboe kutoka mkononi mwa watu wa kigeni,[a] ambao kinywa chao hunena uongo,[b] na mkono wao wa kuume ni mkono wa udanganyifu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa ugeni,” nahau inayomaanisha “watu wa kigeni.”'
    reason: lexical_alternative
  - marker: b
    text: Au “ubatili” au “utupu” badala ya “uongo.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania hurudia “mkono wa kuume”: “mkono wao wa kuume ni mkono wa udanganyifu.” Mkono wa kuume mara nyingi huwakilisha nguvu, ahadi, au tendo.'
    reason: cultural_note
lexical_decisions:
- source_word: פְּצֵנִי
  choice: Uniokoe
  rationale: Kitenzi פצה katika amri chenye kiambishi cha nafsi ya kwanza kinaomba kuachiliwa au kuokolewa; “uniokoe” ni ombi la asili na la dharura katika Kiswahili.
- source_word: וְהַצִּילֵנִי
  choice: na unikomboe
  rationale: Hifili ya נצל humaanisha kunyakua kutoka hatarini au kukomboa. “Unikomboe” huhifadhi kitenzi cha pili bila kukifuta katika usambamba na “uniokoe.”
- source_word: מִיַּד
  choice: kutoka mkononi mwa
  rationale: Nahau ya Kiebrania hutaja mkono kwa maana ya mamlaka au udhibiti. Kiswahili “kutoka mkononi mwa” huhifadhi taswira hiyo na kinaeleweka kwa urahisi.
- source_word: בְּנֵי נֵכָר
  choice: wageni
  rationale: Kihalisi ni “wana wa ugeni/nchi ya kigeni,” lakini ni nahau inayomaanisha watu wa kigeni. “Wageni” ni tafsiri ya kawaida bila ukakasi wa kihalisi.
- source_word: פִּיהֶם דִּבֶּר שָׁוְא
  choice: ambao vinywa vyao hunena uongo
  rationale: שָׁוְא inaweza kumaanisha ubatili, utupu, au uongo. Katika usambamba na שָׁקֶר, “uongo” huwasilisha maana ya kimaadili, huku wingi wa “vinywa vyao” ukifanya sentensi iwe ya asili kwa Kiswahili.
- source_word: וִימִינָם יְמִין שָׁקֶר
  choice: na mikono yao ya kuume ni mikono ya udanganyifu
  rationale: Marudio ya “mkono wa kuume” katika Kiebrania yamehifadhiwa kwa wingi unaopatana na kundi la watu; “udanganyifu” huonyesha maana ya שָׁקֶר bila kulazimisha iwe usemi pekee.
