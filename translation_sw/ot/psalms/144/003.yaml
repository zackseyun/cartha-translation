  yaml_path: translation/ot/psalms/144/003.yaml
  text: O Yahweh[a], what is man that you know him[c][b], the son of man that you think of him?
translation:
  language: sw
  text: 'Ee Yahwe, mwanadamu[a] ni nini hata umjue?[c]

    Mwana wa binadamu[b] ni nini hata umzingatie?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “binadamu.” Kiebrania kinatumia nomino ya umoja inayowakilisha wanadamu kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “mwana wa binadamu”; huu ni usemi wa kishairi unaomaanisha mwanadamu, hasa akiwa dhaifu na mwenye kufa. Hapa si cheo cha Kimasihi.
    reason: lexical_alternative
  - marker: c
    text: Mstari huu unafanana sana na Zaburi 8:4.
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la Mungu limetafsiriwa moja kwa moja kuwa “Yahwe”; “Ee” linaonyesha kwamba mtunga zaburi anamwambia Mungu moja kwa moja.
- source_word: מָה אָדָם
  choice: mwanadamu ni nini
  rationale: Huhifadhi swali la balagha kuhusu udogo na kutokuwa na umuhimu mkubwa kwa mwanadamu mbele za Mungu, huku likisomeka kwa Kiswahili cha kawaida.
- source_word: וַתֵּדָעֵהוּ
  choice: hata umjue
  rationale: Kitenzi ידע kimsingi ni “kujua”; hapa kinaweza pia kudokeza kumtambua au kumjali. Tafsiri hii huhifadhi maana yake ya msingi bila kuifafanua kupita kiasi.
- source_word: בֶּן אֱנוֹשׁ
  choice: mwana wa mtu
  rationale: Huhifadhi muundo wa kishairi wa Kiebrania na kumaanisha mwanadamu, hasa katika hali yake ya udhaifu na kufa, bila kukifanya kifungu hiki kuwa cheo cha Kimasihi.
- source_word: וַתְּחַשְּׁבֵהוּ
  choice: hata umzingatie
  rationale: Kitenzi חשב kina maana ya kufikiri, kuhesabu au kumwona mtu kuwa wa maana. “Umzingatie” huwasilisha hali ya Mungu kumweka mwanadamu katika fikira na kumjali, huku kikitofautishwa na “umjue” katika mstari wa kwanza.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania ina jina la agano lenyewe. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya uwakilishi katika אָדָם na בֶּן אֱנוֹשׁ
  choice: mwanadamu ... mwana wa mtu
  alternative: wanadamu ... binadamu
  rationale: Kiebrania kinatumia umoja wa kishairi kwa maana ya jumla. Tafsiri hii huhifadhi umoja na usambamba bila kudai kwamba anayelengwa ni mwanamume mmoja maalumu.
- issue: Maana ya בֶּן אֱנוֹשׁ katika muktadha huu
  choice: usemi wa jumla kuhusu mwanadamu dhaifu
  alternative: cheo cha Kimasihi, “Mwana wa Adamu”
  rationale: Katika usambamba wa mstari huu, usemi huo unalingana na אָדָם na unaeleza mwanadamu kwa ujumla; hauonyeshwi hapa kama cheo maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na cha kishairi lakini kinachoeleweka kwa urahisi. Mistari miwili inadumisha usambamba wa Kiebrania. “Umjue” na “umzingatie” zimeachwa zikiwa tofauti ili kuhifadhi vitenzi viwili vya chanzo na mvutano wake wa maana.
