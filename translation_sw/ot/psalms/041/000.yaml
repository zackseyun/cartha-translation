lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Kwa mwongoza muziki
  rationale: Katika vichwa vya Zaburi, neno hili humwelekezea anayesimamia uimbaji au utendaji wa muziki. “Mwongoza muziki” ni Kiswahili cha sasa, cha kawaida, na hakidokezi bila lazima kwamba kulikuwa na kwaya pekee.
- source_word: מִזְמוֹר
  choice: Zaburi
  rationale: Hili ndilo neno la kawaida na linalofaa kwa aina hii ya wimbo wa ibada katika muktadha wa kitabu cha Zaburi.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: Kiambishi לְ katika vichwa vya Zaburi kinaweza kuonyesha uandishi, uhusiano, umiliki wa mkusanyo, au kuwekwa wakfu. “Ya Daudi” huhifadhi upana huo kuliko tafsiri inayosisitiza maana moja tu.
theological_decisions:
- issue: Maana ya kichwa kinachomhusisha Daudi
  choice: ya Daudi
  alternative: iliyoandikwa na Daudi; kwa ajili ya Daudi
  rationale: Kiebrania hakilazimishi maana moja kati ya uandishi, uhusiano, au kuwekwa wakfu. Tafsiri kuu inahifadhi utata huo wa kweli, huku maana nyingine zikitajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo mfupi wa kichwa umehifadhiwa, na “mwongoza muziki” limetumiwa badala ya lugha ya kizamani au inayofungamanisha jukumu hilo na kwaya pekee.
