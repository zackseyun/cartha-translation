  text: Kwa pamoja, wote wanaonichukia hunong’ona dhidi yangu[a]; dhidi yangu wananipangia mabaya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “juu yangu” au “kunihusu.” Kihusishi cha Kiebrania hapa kinaweza kuonyesha uhasama au jambo linalozungumziwa; katika muktadha huu maana ya uhasama inafaa zaidi.
    reason: lexical_alternative
