    text: Au “wanapanga kunidhuru” au “wanapanga mabaya dhidi yangu.” Kiebrania kinaunganisha kitenzi cha kufikiri au kupanga na neno “mabaya,” na hivyo kueleza nia ya uhasama.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: Kwa pamoja
  rationale: Kielezi hiki kinaonyesha kwamba maadui wanatenda kwa kushirikiana; “kwa pamoja” ni Kiswahili cha kawaida na chenye maana hiyo wazi.
- source_word: עָלַי
  choice: dhidi yangu
  rationale: Katika muktadha wa chuki, kunong’ona na kupanga mabaya, kihusishi hiki kinaeleweka zaidi kwa maana ya uhasama, ingawa kinaweza pia kumaanisha “juu yangu” au “kunihusu.”
- source_word: יִתְלַחֲשׁוּ
  choice: hunong’ona
  rationale: Umbo la kitenzi linaonyesha kunong’ona wao kwa wao. Tafsiri hii inadumisha picha halisi bila kuongeza moja kwa moja wazo la njama rasmi.
- source_word: כָּל שֹׂנְאַי
  choice: wote wanaonichukia
  rationale: Kirai hiki kinadumisha nguvu ya kitenzi cha Kiebrania, yaani watu wanaomchukia msemaji, badala ya kukipanua tu kuwa “maadui.”
- source_word: יַחְשְׁבוּ
  choice: wananipangia
  rationale: Katika muktadha huu kitenzi cha kufikiri au kukusudia kinaeleza kupanga kwa nia ya uhasama. Kiambishi cha kutendea kinawasilisha pia wazo la kwamba mabaya hayo yamekusudiwa kumpata msemaji.
- source_word: רָעָה
  choice: mabaya
  rationale: Neno hili linaweza kumaanisha uovu, madhara au msiba. “Mabaya” linahifadhi upana wake wa kimaadili na wa madhara bila kuubana kwa maana moja tu.
- source_word: לִי
  choice: -ni-…-ia katika “wananipangia”
  rationale: Kihusishi cha Kiebrania kina maana ya “kwa ajili yangu/kwangu.” Kiswahili cha asili huwasilisha uhusiano huu kwa kiambishi cha mtendewa na kauli ya kutendea.
