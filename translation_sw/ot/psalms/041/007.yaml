  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Hunong’ona” linaonyesha tendo lao la kawaida katika muktadha huu, huku marudio ya “dhidi yangu” yakihifadhi msisitizo wa maandishi ya Kiebrania. “Wananipangia mabaya” ni usemi wa asili unaohifadhi wazo la kupanga mabaya yanayomlenga msemaji.
