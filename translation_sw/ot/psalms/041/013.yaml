  text: Yahwe, Mungu wa Israeli, abarikiwe tangu milele hata milele[a]. Amina na Amina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tangu umilele hata umilele.” Usemi wa Kiebrania unaonyesha muda usio na kikomo.
