lexical_decisions:
- source_word: בָּרוּךְ
  choice: na abarikiwe
  rationale: Kauli hii ya baraka katika sifa kwa Mungu imetafsiriwa kwa namna ya kawaida na yenye hadhi katika Kiswahili; kiunganishi “na” huleta maana ya ombi/tamko la kiliturujia bila kuifanya kuwa maelezo tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe,” badala ya kubadilishwa na cheo, ili kuhifadhi jina la binafsi lililo katika Kiebrania.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Muundo huu wa utegemezi humaanisha moja kwa moja “Mungu wa Israeli,” na kauli hiyo ni ya kawaida katika Kiswahili.
- source_word: מֵהָעוֹלָם וְעַד הָעוֹלָם
  choice: tangu milele hata milele
  rationale: Huhifadhi wigo wa muda usio na mipaka katika fomula ya sifa, kwa Kiswahili cha asili na chenye hadhi.
- source_word: אָמֵן וְאָמֵן
  choice: Amina na Amina
  rationale: Tamko la kukubali limetoholewa na kurudiwa kama lilivyo katika chanzo ili kuhifadhi msisitizo na nguvu yake ya kiliturujia.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia Tetragramatoni kama jina la Mungu; kulitaja “Yahwe” huhifadhi jina hilo bila kulibadilisha kuwa cheo.
translation_notes:
