  text: יְהוָ֤ה יִשְׁמְרֵ֣/הוּ וִֽ֭/יחַיֵּ/הוּ יאשר בָּ/אָ֑רֶץ וְ/אַֽל תִּ֝תְּנֵ֗/הוּ בְּ/נֶ֣פֶשׁ אֹיְבָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/002.yaml
  text: Yahweh will keep him and preserve his life[a]; he will be blessed in the land[d][c][b], and may you not give him over to the desire of his enemies.
translation:
  language: sw
  text: Yahwe atamlinda na kumhifadhi hai[a]; ataitwa mwenye baraka katika nchi[b], wala usimkabidhi kwa matakwa ya adui zake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kumweka hai.”
    reason: lexical_alternative
  - marker: b
    text: Au, “atabarikiwa katika nchi.” Kitenzi cha Kiebrania kinaweza kumaanisha kuitwa mwenye baraka au, kwa maana pana zaidi, kubarikiwa.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “kwa tamaa ya adui zake”; pia inaweza kutafsiriwa “kwa matakwa ya adui zake.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo; umbo “Yahwe” ni la kawaida na linalosomeka kwa Kiswahili.
- source_word: יִשְׁמְרֵהוּ
  choice: atamlinda
  rationale: Kitenzi שׁמר hapa kina maana ya kumlinda au kumtunza mtu; “atamlinda” ni cha kawaida na kinaacha kitenzi kinachofuata kieleze kuhifadhi uhai.
- source_word: וִיחַיֵּהוּ
  choice: na kumhifadhi hai
  rationale: Piel ya חיה hapa ina maana ya kumweka au kumhifadhi mtu hai, si lazima kumfufua baada ya kufa.
- source_word: יאשר
  choice: ataitwa mwenye baraka
  rationale: Huhifadhi uwezekano wa maana ya kutangazwa au kuitwa mwenye baraka, badala ya kuifanya iwe hali tu bila wazo la kutambuliwa na wengine.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: אֶרֶץ inaweza kumaanisha nchi, ardhi, au dunia; “katika nchi” inafaa katika muktadha huu bila kuipanua kuwa dunia nzima.
- source_word: וְאַל תִּתְּנֵהוּ
  choice: wala usimtie mikononi mwa
  rationale: אַֽל pamoja na umbo la nafsi ya pili ni ombi hasi linalomwelekea Yahwe; nahau “kumtia mikononi mwa” huwasilisha wazo la kumkabidhi chini ya nguvu ya mwingine.
- source_word: בְּנֶפֶשׁ אֹיְבָיו
  choice: tamaa ya adui zake
  rationale: נֶפֶשׁ katika nahau hii ni tamaa au matakwa, si “nafsi” kwa maana ya sehemu isiyo ya mwili.
theological_decisions:
- issue: Mabadiliko kutoka kauli ya nafsi ya tatu kwenda ombi la nafsi ya pili
  choice: Kauli mbili za kwanza zimetolewa kama tamko kuhusu Yahwe, kisha “wala usimtie” kama ombi linaloelekezwa kwake.
  alternative: 'Kutafsiri mstari wote kwa nafsi ya tatu: “wala hatamtia...”'
  rationale: תִּתְּנֵהוּ ni nafsi ya pili ya kiume umoja; kuhifadhi mabadiliko hayo kunafuata Kiebrania na hakusawazishi mvutano wa kisarufi kimyakimya.
- issue: Maana ya יאשר
  choice: ataitwa mwenye baraka
  alternative: atabarikiwa
  rationale: Kitenzi kinaweza kueleza kuitwa au kutangazwa mwenye baraka, na pia kwa upana zaidi kuwa mwenye baraka; maandishi makuu yanahifadhi maana ya kutambuliwa, huku mbadala ukitajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Jina “Yahwe” limehifadhiwa. Mabadiliko ya ghafla kwenda nafsi ya pili yameachwa wazi kwa “wala usimtie,” kama yalivyo katika Kiebrania.
