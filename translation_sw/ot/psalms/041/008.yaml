base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/008.yaml
  text: A wicked thing is poured out upon him; now that he lies down[a], he will rise no more.
translation:
  language: sw
  text: Jambo ovu limemwagwa juu yake; sasa kwa kuwa amelala[a], hatainuka tena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jambo ovu limewekwa juu yake kwa uthabiti,” au, “Shtaka ovu limewekwa dhidi yake.” Usemi wa Kiebrania ni mgumu na unaweza kumaanisha ama hali mbaya yenye kuangamiza ama shtaka lenye kuharibu.
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר
  choice: jambo
  rationale: Katika muundo huu wa Kiebrania, neno hili lina maana pana ya jambo au hali, si lazima neno lililonenwa; “jambo” linaacha uwezekano wa maradhi au shtaka.
- source_word: בְּלִיַּעַל
  choice: ovu
  rationale: Hapa neno linaonyesha ubaya, uharibifu, au upotovu; si wazi kuwa ni jina maalumu, kwa hiyo limetafsiriwa kama kivumishi.
- source_word: דְּבַר בְּלִיַּעַל
  choice: jambo ovu
  rationale: Usemi huu mfupi na mgumu unaweza kumaanisha tatizo baya linalomtesa mtu au shtaka lenye kuharibu. “Jambo ovu” huhifadhi utata huo.
- source_word: יָצוּק
  choice: limemwagwa
  rationale: Hii huhifadhi taswira ya msingi ya kitu kumwagwa au kuwekwa juu ya mtu, bila kuamua kwamba kinamshikilia au kimethibitishwa dhidi yake.
- source_word: בּוֹ
  choice: juu yake
  rationale: Pamoja na kitenzi hiki, “juu yake” huwasilisha kwa kawaida kitu kilichomjia au kilichowekwa kwake.
- source_word: וַאֲשֶׁר
  choice: sasa kwa kuwa
  rationale: Kiunganishi hiki kinaunganisha hali ya kulala na matokeo yanayotarajiwa; tafsiri hii ni ya asili katika Kiswahili, huku tanbihi ikieleza utata wa mstari mzima.
- source_word: שָׁכַב
  choice: amelala
  rationale: Kitenzi kimsingi humaanisha kulala chini. “Amelala” huhifadhi taswira bila kufafanua moja kwa moja kuwa ni ugonjwa, kushindwa, au kifo.
- source_word: לֹא יוֹסִיף לָקוּם
  choice: hatainuka tena
  rationale: Huu ni usemi wa kutoinuka au kutopona tena; tafsiri hii ni fupi, nzito, na mwaminifu kwa taswira ya Kiebrania.
theological_decisions:
- issue: Maana ya taswira katika mstari
  choice: Kuhifadhi utata kati ya jambo baya linalompata mwenye kuteseka na shtaka ovu lililowekwa dhidi yake.
  alternative: “Ugonjwa mbaya umemshika” au “shtaka ovu limewekwa dhidi yake.”
  rationale: Kiebrania ni kifupi na kinaweza kueleweka kwa njia zaidi ya moja. Matini kuu haipaswi kuamua bila msingi wa kutosha ikiwa kinachokusudiwa ni maradhi yenye kuangamiza au tuhuma yenye madhara.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na uzito wa kishairi. “Jambo ovu” na “amelala” zimechaguliwa ili kuhifadhi ufupi na utata wa Kiebrania.
