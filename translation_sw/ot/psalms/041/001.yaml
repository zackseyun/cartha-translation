  text: אַ֭שְׁרֵי מַשְׂכִּ֣יל אֶל דָּ֑ל בְּ/י֥וֹם רָ֝עָ֗ה יְֽמַלְּטֵ֥/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/001.yaml
  text: Blessed is the one who considers the poor[c][b][a]; in the day of trouble Yahweh will deliver him.
translation:
  language: sw
  text: Heri mtu anayemjali maskini[a][b]; siku ya taabu[c] Yahwe atamwokoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “anayemtendea maskini kwa busara.” Kitenzi cha Kiebrania kinaweza kumaanisha kumwangalia mtu kwa ufahamu na uangalifu wa busara.
    reason: lexical_alternative
  - marker: b
    text: Au “dhaifu” au “mhitaji.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania ni “siku ya mabaya”; hapa “mabaya” yanamaanisha janga au shida, si uovu wa kimaadili.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heri mtu
  rationale: Kauli ya Kiebrania ni tamko la heri katika mtindo wa hekima. “Heri mtu” ni Kiswahili cha kawaida na chenye hadhi, na haiishii kueleza hisia ya furaha tu.
- source_word: מַשְׂכִּיל אֶל
  choice: anayemjali
  rationale: Kitenzi katika Hifili pamoja na kihusishi kinaonyesha kumwelekea mtu kwa ufahamu na uangalifu wa busara. “Anayemjali” ni ya asili katika Kiswahili na inaonyesha kuzingatia hali yake kwa namna inayoweza kuongoza kwenye tendo.
- source_word: דָּל
  choice: maskini
  rationale: Neno linaweza kumaanisha maskini, dhaifu, au mhitaji. “Maskini” ndilo chaguo la moja kwa moja hapa, huku tanbihi ikihifadhi upana wa maana.
- source_word: בְּיוֹם רָעָה
  choice: siku ya taabu
  rationale: Katika muktadha huu רָעָה linaeleza janga, shida, au hali mbaya, si uovu wa kimaadili. “Siku ya taabu” huhifadhi taswira ya Kiebrania na ni wazi kwa msomaji wa Kiswahili.
- source_word: יְמַלְּטֵהוּ
  choice: atamwokoa
  rationale: Kitenzi kinaonyesha kumponya au kumtoa mtu hatarini. “Atamwokoa” ni cha kawaida, chenye uzito, na kinafuata kiambishi cha nafsi ya tatu umoja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetafsiriwa kwa unukuzi “Yahwe” badala ya kubadilishwa kuwa cheo kama “BWANA,” hivyo kuhifadhi jina binafsi katika matini.
theological_decisions:
- issue: Rejeleo la umoja katika tamko la heri na ahadi
  choice: Kuhifadhi umoja kwa “mtu … atamwokoa”
  alternative: 'Kutumia wingi: “watu … atawaokoa”'
  rationale: Kiebrania kinamwonyesha mtu mmoja wa mfano na kinatumia kiambishi cha umoja. Kiswahili “mtu” kinahifadhi umoja bila kulazimisha jinsia, na “atamwokoa” kinafuata sarufi hiyo.
- issue: Ahadi ya wokovu kama kauli ya hekima
  choice: Kutoa kauli moja kwa moja bila kuipunguza wala kuipanua
  alternative: Kuifafanua kuwa kanuni ya jumla tu au dhamana isiyo na masharti ya mafanikio
  rationale: Aya inasema kwa nguvu kwamba Yahwe atamwokoa mtu huyo. Tafsiri inahifadhi nguvu na mvutano wa kauli hiyo bila kuongeza fundisho la mafanikio wala maelezo yanayoilegeza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi wa kishairi umehifadhiwa; “Heri mtu” na “siku ya taabu” ni misemo inayoeleweka kwa wasomaji wa kawaida bila kuwa ya kizamani.
