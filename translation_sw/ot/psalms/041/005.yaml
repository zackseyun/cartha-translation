lexical_decisions:
- source_word: אוֹיְבַי
  choice: Adui zangu
  rationale: Nomino ya wingi yenye kiambishi cha nafsi ya kwanza umoja humaanisha moja kwa moja ‘adui zangu’; usemi huu ni wa kawaida na huhifadhi nguvu ya uhasama.
- source_word: יֹאמְרוּ
  choice: hunisema
  rationale: Kauli ya imperfecti katika muktadha huu wa kishairi inaweza kueleza tendo la kawaida au linaloendelea. ‘Hunisema’ huwasilisha kwa Kiswahili cha kawaida kwamba adui hao husema mambo juu ya mtunga zaburi.
- source_word: רַע לִי
  choice: vibaya
  rationale: רַע pamoja na לִי hueleza usemi mwovu au wenye madhara unaoelekezwa dhidi ya mtunga zaburi. ‘Hুনisema vibaya’ ni usemi wa asili wa Kiswahili, huku tanbihi ikihifadhi maana halisi ya ‘uovu’.
- source_word: מָתַי
  choice: lini
  rationale: Kielezi cha kuuliza מָתַי humaanisha ‘lini’ bila kulazimu upanuzi wa ‘mpaka lini.’
- source_word: יָמוּת
  choice: atakufa
  rationale: Imperfecti ya nafsi ya tatu umoja baada ya ‘lini’ kwa kawaida huonyesha wakati ujao. Tafsiri hii huacha nia yao ya kikatili ionekane katika muktadha bila kuibadili waziwazi kuwa amri au ombi.
- source_word: וְאָבַד שְׁמוֹ
  choice: na jina lake litoweke
  rationale: Kitenzi אבד huleta wazo la kupotea au kutoweka. ‘Jina lake litoweke’ huhifadhi neno ‘jina’ na muunganiko wake na swali la wakati ujao, bila kufafanua kimya kimya kuwa ni sifa au kumbukumbu.
