  text: וְ/אַתָּ֤ה יְהוָ֗ה חָנֵּ֥/נִי וַ/הֲקִימֵ֑/נִי וַֽ/אֲשַׁלְּמָ֥ה לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/010.yaml
  text: But you[a], O Yahweh, be gracious to me and raise me up, that I may repay them.
translation:
  language: sw
  text: Lakini wewe, Ee Yahweh, unirehemu na uniinue, ili niwalipe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nami nitawalipa.” Muundo wa kitenzi cha Kiebrania unaweza kueleweka kuwa kusudi au matokeo (“ili niwalipe”), au kuwa azimio linalofuata maombi hayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Lakini wewe
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha utofautishaji na maadui na rafiki waliotajwa kabla; ‘Lakini wewe’ ni ya kawaida na wazi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeendelezwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: חָנֵּנִי
  choice: unirehemu
  rationale: Kitenzi חנן ni ombi la kutendewa kwa neema au fadhili; ‘unirehemu’ ni ombi la kawaida, lenye heshima, bila kulifanya kuwa huruma ya kihisia pekee.
- source_word: וַהֲקִימֵנִי
  choice: na uniinue
  rationale: Hifili ya קום humaanisha kusababisha mtu ainuke au asimame; ‘uniinue’ huhifadhi picha halisi huku ikiruhusu maana ya kurejeshwa kutoka ugonjwa au kudhoofishwa.
- source_word: וַאֲשַׁלְּמָה
  choice: ili niwalipe
  rationale: Pieli ya שלם hapa ni kulipa au kulipiza. Muundo wa cohortative baada ya maombi unaweza kueleza kusudi au matokeo, jambo linalowasilishwa kwa ‘ili niwalipe’.
- source_word: לָהֶם
  choice: wa- katika ‘niwalipe’
  rationale: Kiswahili huonyesha watendewa hawa kwa kiambishi cha yambwa ndani ya kitenzi, hivyo ‘niwalipe’ huwasilisha kwa kawaida maana ya ‘niwalipe wao’.
theological_decisions:
- issue: Iwapo wazo la mtunga zaburi la kuwalipa wapinzani lipunguzwe ili kuondoa ukali wa ombi la hukumu
  choice: kuhifadhi ‘niwalipe’
  alternative: ‘unitetee dhidi yao’ au ‘uwatendee wanavyostahili’
  rationale: שלם humaanisha moja kwa moja kulipa au kulipiza. Kuilegeza kungeingiza tafsiri isiyoelezwa na kuficha mvutano wa kimaadili na kitheolojia wa mstari, ambao hauelezi namna hasa ya malipo hayo.
- issue: Uhusiano wa cohortative וַאֲשַׁלְּמָה na maombi yaliyotangulia
  choice: 'kusudi/matokeo: ‘ili niwalipe’'
  alternative: 'azimio linalofuata: ‘nami nitawalipa’'
  rationale: Muundo wa Kiebrania unaweza kueleweka kwa njia zote mbili. Matini kuu inatumia uhusiano wa kusudi/matokeo, huku tanbihi ikihifadhi uwezekano wa azimio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ee’ hutambulisha mwito wa moja kwa moja; sentensi huhifadhi utofautishaji, picha ya kuinuliwa, na ukali wa ‘kuwalipa’ bila kuongeza maelezo yasiyokuwapo katika Kiebrania.
