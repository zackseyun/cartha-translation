  yaml_path: translation/ot/psalms/041/011.yaml
  text: 'By this I know that you delight in me: because my enemy does not triumph over me[a][b].'
translation:
  language: sw
  text: 'Kwa hili ninajua kwamba unapendezwa nami: kwa kuwa adui yangu hapigi kelele za ushindi juu yangu[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “adui yangu hashangilii ushindi juu yangu.” Kitenzi cha Kiebrania, kwa maana ya karibu zaidi, hurejelea kupiga kelele; hapa yaelekea ni kelele ya ushindi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֹאת
  choice: Kwa hili
  rationale: Kiambishi ב pamoja na זֹאת kinaonyesha msingi au ushahidi wa kujua; “Kwa hili” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: יָדַעְתִּי
  choice: ninajua
  rationale: Ingawa kitenzi ni timilifu kiumbo, hapa kinaeleza ujuzi wa sasa unaotokana na ushahidi unaotajwa.
- source_word: כִּי חָפַצְתָּ בִּי
  choice: kwamba unapendezwa nami
  rationale: כִּי ya kwanza inaanzisha jambo linalojulikana, na חפץ ב ina maana ya kupendezwa au kufurahia mtu; tafsiri hii haiongezi dai pana la kitheolojia.
- source_word: כִּי
  choice: ':'
  rationale: כִּי ya pili inaeleza ushahidi au sababu. Alama ya nukta mbili huonyesha uhusiano huo kwa Kiswahili cha asili bila kurudia “kwa sababu” baada ya “Kwa hili.”
- source_word: לֹא יָרִיעַ
  choice: hapigi kelele ya ushindi
  rationale: Hifili ya רוע ina taswira ya kutoa mwaliko au kelele ya shangwe, hapa kelele ya ushindi; usemi huu huhifadhi taswira ya kusikika kuliko “hashindi” peke yake.
- source_word: אֹיְבִי עָלָי
  choice: adui yangu ... juu yangu
  rationale: Umoja wa אֹיְבִי umehifadhiwa, na עָלַי inaonyesha adui akishangilia ushindi juu ya mtunga zaburi.
theological_decisions:
- issue: Ikiwa kutoshinda kwa adui kunamaanisha kibali cha Mungu kwa mtunga zaburi
  choice: Mshairi analiona kutokuwepo kwa kelele ya ushindi ya adui kuwa ushahidi kwamba Mungu anapendezwa naye.
  alternative: Mstari unaweza kueleweka kwa nguvu zaidi kama tangazo la kuthibitishwa kuwa mwenye haki mbele za Mungu.
  rationale: Kiebrania kinaunganisha kupendezwa kwa Mungu na kushindwa kwa adui kushangilia, lakini hakielezi msingi wa kupendezwa huko; tafsiri haiongezi fundisho la kustahili au kuhesabiwa haki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Unapendezwa nami” ni cha kawaida na huhifadhi upana wa חפץ; “kelele ya ushindi” huhifadhi taswira halisi ya kitenzi cha Kiebrania.
