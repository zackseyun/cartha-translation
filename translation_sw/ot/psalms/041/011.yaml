  text: בְּ/זֹ֣את יָ֭דַעְתִּי כִּֽי חָפַ֣צְתָּ בִּ֑/י כִּ֤י לֹֽא יָרִ֖יעַ אֹיְבִ֣/י עָלָֽ/י־־׃
base_translation:
