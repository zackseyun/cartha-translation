review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the contrastive opening, divine support, placement before God, and enduring duration. However, “kwa uadilifu wangu” most naturally reads causally (“because of my righteousness/integrity”), whereas the Hebrew בְּתֻמִּי can express the psalmist’s condition or manner (“in my integrity”) as well as allow a causal nuance. “Katika” better retains the primary non-causal sense without excluding contextual association.
  naturalness: The revised wording is fluent, dignified Standard East African Swahili and suitably psalmic. Commas clarify the parenthetical phrase, and the semicolon cleanly joins the parallel divine actions.
  terminology: “Unyofu wangu” naturally conveys personal integrity, uprightness, or blamelessness without suggesting absolute sinlessness. “Mbele zako” is an idiomatic, faithful rendering of the Hebrew expression for being before God/in God’s presence; “milele” appropriately renders the enduring temporal sense.
  issues:
  - severity: low
    issue: The phrase “kwa uadilifu wangu” favors a causal interpretation.
    rationale: Although a causal reading is lexically possible, it can sound as though God’s support is grounded on earned moral merit. “Katika unyofu wangu” more directly reflects the Hebrew preposition and preserves the verse’s description of the psalmist’s integrity without forcing the causal sense.
  revised_text: Lakini mimi, katika unyofu wangu, umenitegemeza; nawe umeniweka mbele zako milele.
