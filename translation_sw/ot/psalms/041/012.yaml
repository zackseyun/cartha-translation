  text: וַ/אֲנִ֗י בְּ֭/תֻמִּ/י תָּמַ֣כְתָּ בִּ֑/י וַ/תַּצִּיבֵ֖/נִי לְ/פָנֶ֣י/ךָ לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/012.yaml
  text: But as for me[a], in my integrity you have upheld me[b], and you have set me before your face forever.
translation:
  language: sw
  text: Lakini mimi, katika unyofu wangu, umenitegemeza; nawe umeniweka mbele zako milele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי
  choice: Lakini mimi
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha tofauti na yaliyotangulia; “Lakini mimi” ni ya kawaida na wazi katika Kiswahili.
- source_word: בְּתֻמִּי
  choice: kwa uadilifu wangu
  rationale: תֻּם humaanisha ukamilifu wa mwenendo, unyofu, au kutokuwa na lawama. “Uadilifu” hudumisha dai la maadili bila kudokeza kutokuwa na dhambi kabisa; “kwa” pia huhifadhi uwezekano wa ב kueleza hali au msingi.
- source_word: תָּמַכְתָּ בִּי
  choice: umenitegemeza
  rationale: תמך ב hubeba maana ya kumshikilia, kumsaidia, au kumdumisha mtu. “Umenitegemeza” ni usemi wa asili unaoonyesha msaada unaomweka imara.
- source_word: וַתַּצִּיבֵנִי
  choice: nawe umeniweka
  rationale: Hifili ya נצב humaanisha kuweka au kusimamisha. “Umeniweka” ni tafsiri ya moja kwa moja isiyoongeza wazo la kuthibitisha au kuimarisha lisilolazimishwa na muktadha.
- source_word: לְפָנֶיךָ
  choice: mbele zako
  rationale: Nahau ya Kiebrania kwa halisi ni “mbele ya uso wako” na humaanisha kuwa katika uwepo wa mtu. “Mbele zako” huhifadhi taswira na ni Kiswahili cha kawaida.
- source_word: לְעוֹלָם
  choice: milele
  rationale: עוֹלָם hapa huonyesha muda usio na mwisho au unaodumu; “milele” ndiyo sawia ya kawaida katika lugha ya zaburi.
theological_decisions:
- issue: Maana ya dai la mtunga zaburi kuhusu תֻּם
  choice: Mstari unasema juu ya uadilifu au unyofu wa mtunga zaburi, si kutokuwa na dhambi kabisa wala kujipatia kibali cha Mungu kwa ukamilifu wa maadili.
  alternative: Kuuchukulia mstari kuwa dai la kutokuwa na hatia kabisa au fundisho kwamba kibali cha Mungu hulipwa kwa ukamilifu wa maadili.
  rationale: Neno la Kiebrania linaweza kueleza unyofu na mwenendo usio na lawama. “Uadilifu” huhifadhi dai halisi la kimaadili na mvutano wa kiteolojia bila kuliingiza fundisho la ukamilifu usio na dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi umehifadhiwa bila kufanya usemi kuwa mgumu au wa kizamani.
