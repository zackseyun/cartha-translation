  text: Yahweh will sustain him on his sickbed[a]; in his illness you restore his whole bed.
translation:
  language: sw
  text: Yahwe atamtegemeza katika kitanda chake cha ugonjwa; katika ugonjwa wake, unakibadili kitanda chake chote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unakigeuza kitanda chake chote katika ugonjwa wake.” Kitenzi cha Kiebrania kihalisi humaanisha “kugeuza” au “kupindua”; hapa huenda ni msemo unaorejelea kumtunza au kumrejesha mgonjwa aliye kitandani.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna iliyozoeleka katika Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: יִסְעָדֶנּוּ
  choice: atamtegemeza
  rationale: Kitenzi סעד kina maana ya kumshikilia au kumpa nguvu mtu aliye dhaifu; “atamtegemeza” ni cha asili na kinafaa katika muktadha wa ugonjwa.
- source_word: עַל עֶרֶשׂ דְּוָי
  choice: kitandani anapokuwa mgonjwa
  rationale: Kirai hiki kwa halisi ni kitanda cha ugonjwa. Tafsiri hii ya Kiswahili inaeleza hali hiyo kwa uwazi bila kupoteza taswira ya kitanda.
- source_word: כָּל מִשְׁכָּבוֹ
  choice: kitanda chake chote
  rationale: Huhifadhi nguvu ya כָּל, “chote,” na marudio ya taswira ya kitanda katika usambamba wa Kiebrania.
- source_word: הָפַכְתָּ
  choice: unakitengeneza upya
  rationale: הפך kimsingi humaanisha kugeuza au kubadilisha. Katika muktadha huu wa kumtunza mgonjwa, “unakitengeneza upya” huwasilisha kitendo cha manufaa huku tanbihi ikihifadhi maana halisi yenye utata.
- source_word: בְחָלְיוֹ
  choice: katika ugonjwa wake
  rationale: Huhifadhi muundo wa kimazingira wa בְּ pamoja na חֳלִי na sajili yenye hadhi.
theological_decisions:
- issue: Kubadilika kwa nafsi anayesemeshwa ndani ya mstari
  choice: Kuhifadhi badiliko kutoka nafsi ya tatu, “Yahwe atamtegemeza,” kwenda kumsemesha Mungu moja kwa moja, “unakitengeneza.”
  alternative: 'Kusawazisha mstari wote uwe katika nafsi ya tatu: “Yahwe atamtegemeza ... atakitengeneza.”'
  rationale: Kiebrania hubadilika kutoka kusema kuhusu Yahwe kwenda kusema naye moja kwa moja. Kulihifadhi badiliko hili kunadumisha tabia ya kishairi na ya sala bila kulainisha mvutano wa maandishi.
- issue: Maana ya הָפַכְתָּ katika muktadha wa ugonjwa
  choice: Kutafsiri katika matini “unakitengeneza upya,” huku maana halisi ya kugeuza ikihifadhiwa katika tanbihi.
  alternative: “Unakigeuza kitanda chake chote katika ugonjwa wake.”
  rationale: Maana kamili ya msemo huu haijulikani kwa uhakika. Chaguo la matini linaonyesha uwezekano wa kumhudumia au kumrejesha mgonjwa, na tanbihi inazuia tafsiri hiyo isionekane kuwa ya hakika kuliko Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na badiliko la nafsi vimehifadhiwa; tanbihi inaonyesha utata wa kitenzi bila kuuficha.
