  yaml_path: translation/ot/psalms/041/006.yaml
  text: And if he comes to see me[a], he speaks falsehood; his heart gathers wickedness to itself; when he goes out to the street[c][b], he speaks it.
translation:
  language: sw
  text: Na kama akija kuniona[a], husema uongo[b]; moyo wake hujikusanyia uovu. Akitoka nje[c], husema hayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kuona”; kiambishi cha yambwa “-ni” kimeeleweka kutokana na muktadha.'
    reason: lexical_alternative
  - marker: b
    text: Au “ubatili” au “udanganyifu.” Neno la Kiebrania linaweza kumaanisha uongo, udanganyifu, au utupu.
    reason: lexical_alternative
