    text: 'Kiebrania: “nje.” Hii inaweza kudokeza kutoka nyumbani na kwenda kusema hayo hadharani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Na akija
  rationale: Kiunganishi na hali ya masharti zimehifadhiwa kwa Kiswahili cha kawaida; katika muktadha huu hali hiyo inaeleza jambo linalotokea anapokuja.
- source_word: לִרְאוֹת
  choice: kuniona
  rationale: Kiebrania ni ‘kuona’; yambwa ‘-ni’ linaeleweka kutokana na muktadha na hufanya Kiswahili kiwe cha kawaida bila kuongeza wazo jipya.
- source_word: שָׁוְא יְדַבֵּר
  choice: husema maneno ya uongo
  rationale: שָׁוְא inaweza kumaanisha ubatili, uongo, au udanganyifu; katika usemi wa mgeni mwenye nia mbaya, ‘maneno ya uongo’ huwasilisha vizuri udanganyifu huo.
- source_word: לִבּוֹ יִקְבָּץ אָוֶן לוֹ
  choice: moyo wake hujikusanyia uovu
  rationale: Huhifadhi taswira ya moyo kama nafsi ya ndani inayokusanya uovu kwa ajili yake yenyewe; ‘uovu’ hapa huonyesha nia yenye madhara na ubaya wa kimaadili.
- source_word: יֵצֵא לַחוּץ
  choice: akitoka nje
  rationale: Tafsiri ya moja kwa moja ya kutoka kwenda nje, bila kubainisha ‘barabarani’ zaidi ya Kiebrania.
- source_word: יְדַבֵּר
  choice: huyaeneza
  rationale: Kitenzi cha pili kwa msingi ni ‘husema’; katika Kiswahili, ‘huyaeneza’ huweka wazi kwa kawaida kwamba anayasema hadharani yale aliyokusanya moyoni, huku rejeo likibaki na kiasi cha udokezi.
