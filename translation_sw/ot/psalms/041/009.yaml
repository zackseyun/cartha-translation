source:
  edition: WLC
  text: גַּם אִ֤ישׁ שְׁלוֹמִ֨/י אֲשֶׁר בָּטַ֣חְתִּי ב֭/וֹ אוֹכֵ֣ל לַחְמִ֑/י הִגְדִּ֖יל עָלַ֣/י עָקֵֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/009.yaml
  text: Even my close friend[a], in whom I trusted, who ate my bread[d][c][b], has lifted up his heel against me.
translation:
  language: sw
  text: Hata rafiki yangu wa karibu[a], niliyemtumaini, aliyekula mkate wangu[b], ameniinulia kisigino[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa uhalisi, “mtu wa amani yangu,” yaani mtu aliyekuwa na amani nami—rafiki wa karibu au mshirika wa kutumainiwa.
    reason: lexical_alternative
  - marker: b
    text: Au “aliyeshiriki mkate wangu.” Kiebrania kinasema kwa uhalisi “aliyekula mkate wangu,” picha ya ushirika wa mezani na uaminifu.
    reason: lexical_alternative
  - marker: c
    text: Kwa uhalisi, “amefanya kisigino kuwa kikubwa dhidi yangu.” Ni nahau ya Kiebrania inayoonyesha tendo la usaliti au uhasama. Mstari huu unanukuliwa katika Yohana 13:18 kuhusiana na kusalitiwa kwa Yesu na Yuda.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: גַּם
  choice: Hata
  rationale: 'Hutoa msisitizo wa nyongeza: si maadui tu, bali hata mtu wa karibu.'
- source_word: אִישׁ שְׁלוֹמִי
  choice: rafiki yangu wa karibu
  rationale: Kirai hiki kwa uhalisi ni ‘mtu wa amani yangu’; hapa ni nahau ya mtu aliyekuwa na uhusiano wa amani na mwimbaji, yaani rafiki au mshirika wa kutumainiwa.
- source_word: אֲשֶׁר בָּטַחְתִּי בוֹ
  choice: niliyemtumaini
  rationale: Kitenzi בטח pamoja na ב huonyesha kumtegemea mtu au kuweka imani kwake; Kiswahili hiki ni cha kawaida na huhifadhi maana hiyo.
- source_word: אוֹכֵל לַחְמִי
  choice: aliyekula mkate wangu
  rationale: Huhifadhi picha halisi ya kula chakula cha mwimbaji, yenye kudokeza ushirika wa mezani, ukarimu na uaminifu.
- source_word: הִגְדִּיל עָלַי עָקֵב
  choice: ameniinulia kisigino
  rationale: Huhifadhi picha ya nahau ya Kiebrania huku kiambishi ‘-ni-’ kikitoa nguvu ya עָלַי, ‘dhidi yangu’; tendo hilo linaashiria usaliti au uhasama.
theological_decisions:
- issue: Mwangwi wa kimasihi au wa kiishara wa lugha ya usaliti katika Yohana 13:18
  choice: Kutafsiri mstari kulingana na maana yake ya kwanza ndani ya zaburi, huku picha halisi ikihifadhiwa.
  alternative: Kuchagua maneno yaliyoundwa moja kwa moja kufuata mapokeo ya nukuu ya Agano Jipya.
  rationale: Andiko la Kiebrania linazungumzia kwanza kusalitiwa kwa mwimbaji na rafiki aliyemtumaini. Matumizi yake ya baadaye katika Yohana ni muhimu, lakini hayapaswi kuingizwa kimya kimya katika maana kuu ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ameniinulia kisigino’ huhifadhi picha yenye nguvu ya Kiebrania; tanbihi inaeleza nahau ili mstari ubaki wazi bila kuipunguza kuwa maelezo ya jumla.
