base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/004.yaml
  text: As for me[a], I said, “O Yahweh, be gracious to me; heal my soul, for I have sinned against you.”
translation:
  language: sw
  text: Mimi nilisema, “Ee Yahweh, unirehemu; ponya nafsi yangu[a], kwa maana nimefanya dhambi dhidi yako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uhai wangu” au “mimi”; Kiebrania “nafsi” (nephesh) pia inaweza kumaanisha “uhai” au “mtu mwenyewe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Mimi
  rationale: Kiwakilishi huru kimetajwa wazi na kina mkazo kiasi; “Mimi” huhifadhi mkazo huo kwa Kiswahili cha kawaida.
- source_word: אָמַרְתִּי
  choice: nilisema
  rationale: Qal timilifu nafsi ya kwanza umoja hapa inasimulia jambo alilosema mtunga zaburi, hivyo wakati uliopita unafaa.
- source_word: יְהוָה
  choice: Ee Yahweh
  rationale: Jina la Mungu limeandikwa moja kwa moja; “Ee” huonyesha kwamba ni wito katika sala.
- source_word: חָנֵּנִי
  choice: unirehemu
  rationale: Amri hii inaomba fadhili na rehema. “Unirehemu” ni ombi la kawaida, lenye heshima, lisilofunga maana katika huruma ya hisia pekee.
- source_word: רְפָאָה
  choice: ponya
  rationale: Kitenzi kina maana ya kuponya; uchaguzi huu unahifadhi taswira bila kuamua kama uponyaji ni wa mwili, wa ndani, au wa mtu mzima.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: נפש inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. “Nafsi yangu” huhifadhi usemi wa Kiebrania na upana wake bila kuufanya uponyaji kuwa wa mwili au wa kiroho pekee.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa kiunganishi kinatoa sababu ya ombi; “kwa maana” kinafaa katika lugha ya sala yenye hadhi.
- source_word: חָטָאתִי
  choice: nimekutenda dhambi
  rationale: Wakati timilifu unaonyesha tendo la dhambi lenye uzito katika hali ya sasa ya ungamo.
- source_word: לָךְ
  choice: -ku- katika “nimekutenda dhambi”
  rationale: Kiambishi cha yambwa huonyesha kwamba Mungu ndiye aliyekosewa; muundo huu ni wa asili katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Ee Yahweh
  alternative: Ee BWANA
  rationale: Maandishi yana jina maalumu la Mungu, si cheo; kulitaja “Yahweh” huhifadhi jina hilo, na “Ee” huonyesha wito.
- issue: Upeo wa נַפְשִׁי katika ombi la kuponywa
  choice: ponya nafsi yangu
  alternative: niponye / ponya uhai wangu
  rationale: Kiebrania kinaweza kurejelea nafsi, uhai, au mtu mwenyewe. Tafsiri kuu huhifadhi usemi na mvutano wake bila kuamua kwamba uponyaji ni wa kiroho pekee au wa kimwili pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya lugha ya sala. Muundo ni wazi kwa msomaji wa kawaida huku ukihifadhi mkazo wa “Mimi,” jina Yahweh, na upana wa maana ya “nafsi.”
