  text: יוֹד֣וּ/ךָ יְ֭הוָה כָּל מַעֲשֶׂ֑י/ךָ וַ֝/חֲסִידֶ֗י/ךָ יְבָרֲכֽוּ/כָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/010.yaml
  text: All your works will give thanks to you[a], O Yahweh[b], and your faithful ones will bless you.
translation:
  language: sw
  text: 'Matendo yako yote yatakushukuru, ee Yahwe[b],

    na waaminifu wako[a] watakubariki.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watakatifu wako” au “wachamungu wako.” Neno la Kiebrania linamaanisha watu wenye uaminifu na kujitoa katika uhusiano wa agano.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: YHWH; kwa mapokeo hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: zitakushukuru
  rationale: Hifili ya ידה hapa ina maana ya kutoa shukrani au sifa. “Zitakushukuru” huhifadhi maana ya shukrani, kiambishi cha nafsi ya pili, na hali ya wakati ujao ya ushairi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe” badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: כָּל מַעֲשֶׂיךָ
  choice: kazi zako zote
  rationale: Hufikisha kwa njia ya moja kwa moja wazo la jumla la matendo au vitu vyote alivyovifanya Mungu; katika muktadha linaweza kujumuisha uumbaji wake.
- source_word: וַחֲסִידֶיךָ
  choice: na waaminifu wako
  rationale: חסיד hueleza watu wenye uaminifu, uchaji, na kujitoa katika uhusiano wa agano. “Waaminifu wako” ni lugha ya sasa isiyoingiza maana maalumu ya kimadhehebu.
- source_word: יְבָרֲכוּכָה
  choice: watakubariki
  rationale: Pieli ya ברך hapa ni “kubariki”; tafsiri hii huhifadhi kiambishi cha “wewe” na usambamba na kitenzi cha kwanza.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. Kulitohowa hudumisha jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya חֲסִידֶיךָ
  choice: waaminifu wako
  alternative: watakatifu wako; wachamungu wako; watiifu wako
  rationale: “Waaminifu wako” huhifadhi wazo la uaminifu na kujitoa kwa Mungu bila kulazimisha maana ya baadaye ya kikanisa au kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Mpangilio wa kishairi na usambamba wa mistari miwili umehifadhiwa; “ee” hutambulisha mwito wa moja kwa moja kwa njia ya kawaida ya Kiswahili.
