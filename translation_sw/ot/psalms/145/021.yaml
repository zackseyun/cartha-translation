  text: תְּהִלַּ֥ת יְהוָ֗ה יְֽדַבֶּ֫ר פִּ֥/י וִ/יבָרֵ֣ךְ כָּל בָּ֭שָׂר שֵׁ֥ם קָדְשׁ֗/וֹ לְ/עוֹלָ֥ם וָ/עֶֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/021.yaml
  text: My mouth will speak the praise of Yahweh[a], and all flesh will bless his holy name forever and ever.
translation:
  language: sw
  text: 'Kinywa changu kitanena sifa za Yahwe,

    na wenye mwili wote watalibariki jina lake takatifu

    milele na milele.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּהִלַּת
  choice: sifa za
  rationale: Nomino hii iko katika hali ya kuambatanishwa na jina Yahwe. Kiswahili cha asili hutumia “sifa za Yahwe” kuonyesha sifa zinazoelekezwa kwake, huku kikihifadhi uzito wa kishairi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni jina la Mungu lenye herufi nne katika Kiebrania; “Yahwe” huhifadhi jina binafsi badala ya kulibadilisha kuwa cheo.
- source_word: יְדַבֶּר
  choice: kitanena
  rationale: Kitenzi cha hali isiyotimilika hapa kinaeleza azimio linaloendelea au la wakati ujao. “Kitanena” kinaendana na kiima halisi “kinywa changu” na kina sajili ya kishairi yenye kueleweka.
- source_word: פִּי
  choice: Kinywa changu
  rationale: Tafsiri halisi ya nomino yenye kiambishi cha nafsi ya kwanza; inahifadhi taswira thabiti ya Kiebrania badala ya kuibadili kuwa “mimi” tu.
- source_word: וִיבָרֵךְ
  choice: watalibariki
  rationale: Hali isiyotimilika iliyounganishwa na kitenzi kilichotangulia inaeleweka kama tamko la wakati ujao. Kiambishi “-li-” kinaelekeza tendo hilo kwa “jina”.
- source_word: כָּל בָּשָׂר
  choice: wote wenye mwili
  rationale: Huhifadhi nahau ya kishairi “mwili wote” kwa maana ya viumbe wenye kufa, bila kuamua kimya kimya ikiwa inawahusu wanadamu pekee au viumbe hai kwa upana zaidi.
- source_word: שֵׁם קָדְשׁוֹ
  choice: jina lake takatifu
  rationale: Ni Kiswahili cha kawaida kinachohifadhi maana ya utakatifu wa jina la Mungu, yaani utambulisho na sifa yake iliyofunuliwa.
- source_word: לְעוֹלָם וָעֶד
  choice: milele na milele
  rationale: Usemi huu wa kawaida wa Kiswahili huhifadhi msisitizo wa Kiebrania kuhusu muda usio na mwisho.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Upeo wa כָּל בָּשָׂר
  choice: wote wenye mwili
  alternative: watu wote au kila kiumbe hai
  rationale: Nahau ya Kiebrania inaweza kumaanisha wanadamu wote au viumbe wenye kufa kwa upana zaidi. Tafsiri halisi ya kishairi na tanbihi huhifadhi uwezekano huo badala ya kuufunga.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Kitanena” na mpangilio wa mistari huhifadhi ladha ya zaburi bila kutumia lugha ya kizamani kupita kiasi.
