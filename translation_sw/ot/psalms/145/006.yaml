base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/006.yaml
  text: They will speak of the might of your awesome deeds[b][a], and I will recount your greatness.
translation:
  language: sw
  text: Watasema juu ya nguvu za matendo yako ya kuleta hofu na staha[a], nami nitasimulia ukuu wako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “matendo yako ya kuogofya” au “matendo yako ya kustaajabisha.” Neno la Kiebrania hurejelea matendo yanayoamsha hofu yenye staha na mshangao.
    reason: lexical_alternative
  - marker: b
    text: Au, “matendo yako makuu.” Neno la Kiebrania linaweza kumaanisha ukuu wenyewe au mambo makuu ambayo Mungu ametenda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶ/עֱז֣וּז
  choice: nguvu za
  rationale: Nomino עֱזוּז humaanisha nguvu au uwezo; muundo wa ‘nguvu za’ unahifadhi uhusiano wake na matendo yanayofuata na unafaa katika ushairi wa Kiswahili.
- source_word: נוֹרְאֹתֶ֣י/ךָ
  choice: matendo yako ya kutisha
  rationale: Neno hili hurejelea matendo yanayoamsha hofu yenye staha na mshangao. ‘Ya kutisha’ huhifadhi uzito wa hofu uliomo katika Kiebrania, huku tanbihi ikifafanua maana chanya ya kustaajabisha.
- source_word: יֹאמֵ֑רוּ
  choice: watasema juu ya
  rationale: Kauli ya wakati usiotimilika inaweza kueleza wakati ujao au tendo la kawaida. ‘Watasema juu ya’ ni ya kawaida katika Kiswahili na inafaa kwa kutangaza matendo ya Mungu.
- source_word: ו/גדולתי/ך
  choice: ukuu wako
  rationale: גדלות inaweza kumaanisha ukuu kama sifa au matendo makuu. ‘Ukuu wako’ huhifadhi maana ya msingi iliyo dhahania bila kuondoa uwezekano wa kurejelea matendo makuu.
- source_word: אֲסַפְּרֶֽ/נָּה
  choice: nitasimulia
  rationale: Kitenzi ספר katika piel humaanisha kusimulia, kueleza, au kutangaza kwa mpangilio. ‘Nitasimulia’ ni cha asili na hudumisha ulinganifu na ‘watasema.’
theological_decisions:
- issue: Ikiwa נוראותיך yatafsiriwe kama matendo ya kuogofya au ya kustaajabisha
  choice: matendo yako ya kutisha
  alternative: matendo yako ya kustaajabisha
  rationale: Kiebrania hubeba kwa pamoja wazo la hofu, staha, na mshangao. Tafsiri kuu huhifadhi ukali wa hofu, na tanbihi huhifadhi upana wa maana bila kuufungamanisha na msimamo fulani wa kiteolojia.
- issue: Ikiwa גדלותיך ni ukuu kama sifa au matendo makuu
  choice: ukuu wako
  alternative: matendo yako makuu
  rationale: Muktadha unaruhusu maana zote mbili. ‘Ukuu wako’ huhifadhi maana ya dhahania na usambamba wa kishairi, huku tanbihi ikitaja maana mbadala ya matendo makuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mistari miwili na nafsi ya tatu kisha ya kwanza umehifadhiwa.
