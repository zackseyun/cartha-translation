  yaml_path: translation/ot/psalms/145/019.yaml
  text: He fulfills the desire of those who fear him[b][a]; he hears their cry for help and saves them.
translation:
  language: sw
  text: Huyatimiza matamanio ya wale wanaomcha; husikia kilio chao cha kuomba msaada na huwaokoa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְצוֹן
  choice: matakwa
  rationale: Katika muktadha huu neno linamaanisha yale ambayo watu wanaomcha Mungu wanataka au wanatamani. “Matakwa” yanaendana kwa kawaida na kitenzi “kutimiza” bila kuyafanya kuwa mapenzi ya Mungu.
- source_word: יְרֵאָיו
  choice: wale wanaomcha
  rationale: Huhifadhi lugha halisi ya kumcha Mungu inayowatambulisha waaminifu, bila kuipunguza kuwa heshima pekee.
- source_word: יַעֲשֶׂה
  choice: huwatimizia
  rationale: Kitenzi kwa msingi ni “hufanya,” lakini pamoja na רְצוֹן maana ya asili katika Kiswahili ni kutimiza matakwa. Kiambishi -wa- kinaonyesha wazi kwamba matakwa ni ya wale wanaomcha.
- source_word: שַׁוְעָתָם
  choice: kilio chao cha kuomba msaada
  rationale: Neno hili ni kilio kinachotokana na dhiki na kinachoomba uokozi; tafsiri hii inaweka maana hiyo wazi kwa Kiswahili cha kawaida.
- source_word: יִשְׁמַע
  choice: husikia
  rationale: Huhifadhi maana ya msingi ya kusikia, huku muktadha wa uokozi ukionyesha kwamba Mungu anaitikia kilio hicho.
- source_word: וְיוֹשִׁיעֵם
  choice: na kuwaokoa
  rationale: Hiphil ya יָשַׁע humaanisha kuokoa au kukomboa kutoka hatarini. “Kuwaokoa” ni pana na ya kawaida, bila kuzuia maana iwe wokovu wa kiroho pekee.
theological_decisions:
- issue: Tafsiri ya lugha ya ירא kuhusu waaminifu
  choice: wale wanaomcha
  alternative: wale wanaomheshimu sana
  rationale: “Kumcha” huhifadhi kwa uwazi lugha ya Kiebrania na maana yake ya uchaji wa Mungu katika agano na hekima, badala ya kuilegeza kuwa heshima tu.
- issue: Upeo wa mwitikio wa Mungu katika וְיוֹשִׁיעֵם
  choice: na kuwaokoa
  alternative: na kuwakomboa
  rationale: Kitenzi kinaweza kumaanisha kuwaokoa kutoka katika dhiki kwa upana. “Kuwaokoa” huhifadhi upana huo na mwangwi wa kiteolojia bila kudai kwamba mstari unazungumzia wokovu wa kiroho pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mazoea “huwatimizia … husikia” unaakisi hali ya vitenzi vya Kiebrania katika kauli ya jumla. Hakuna tanbihi iliyowekwa kwa kuwa tofauti za “kilio/ombi la msaada” na “kuokoa/kukomboa” zinaweza kuelezwa katika maamuzi ya kileksika bila kulemea mstari.
