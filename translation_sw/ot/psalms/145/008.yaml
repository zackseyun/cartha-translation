  text: חַנּ֣וּן וְ/רַח֣וּם יְהוָ֑ה אֶ֥רֶךְ אַ֝פַּ֗יִם וּ/גְדָל חָֽסֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/008.yaml
  text: Yahweh is gracious and compassionate[a], slow to anger and great in steadfast love.
translation:
  language: sw
  text: 'Yahwe ni mwenye neema na huruma,

    si mwepesi wa kukasirika,

    naye ni mkuu katika upendo mwaminifu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye ana upendo mwaminifu tele.” Usemi wa Kiebrania unaweza kusisitiza ukubwa au wingi wa upendo huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַנּוּן
  choice: mwenye neema
  rationale: Usemi huu unaonyesha tabia ya kuonyesha fadhili au neema. ‘Mwenye neema’ ni wa kawaida, wenye heshima, na hautangamani kimaana na neno linalofuata.
- source_word: רַחוּם
  choice: mwenye huruma
  rationale: Neno hili linaonyesha huruma ya ndani. ‘Mwenye huruma’ ni Kiswahili cha kawaida na linadumisha tofauti yake na חַנּוּן.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama ‘Bwana.’ Umbo ‘Yahwe’ linafuata tahajia ya kawaida ya Kiswahili.
- source_word: אֶרֶךְ אַפַּיִם
  choice: si mwepesi wa hasira
  rationale: Nahau ya Kiebrania, kwa maana halisi ‘mrefu wa pua,’ humaanisha kutokasirika upesi. ‘Si mwepesi wa hasira’ ni usemi wa asili na wazi kwa wasomaji wa Kiswahili.
- source_word: גְדָל
  choice: amejaa
  rationale: Katika muungano גְדָל חָסֶד, neno hili linaweza kuonyesha ukubwa au wingi. ‘Amejaa’ huwasilisha wingi kwa Kiswahili cha kawaida; uwezekano wa ‘mkuu katika’ umewekwa katika tanbihi.
- source_word: חָסֶד
  choice: upendo mwaminifu
  rationale: חָסֶד huunganisha upendo, wema, na uaminifu wa kudumu, hasa ndani ya uhusiano wa agano. ‘Upendo mwaminifu’ ni kifupi, cha asili, na huhifadhi vipengele vya upendo na uaminifu bila kulazimisha maana moja finyu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Bwana; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha na cheo, bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Maana pana ya חָסֶד
  choice: upendo mwaminifu
  alternative: fadhili; rehema; upendo thabiti
  rationale: ‘Upendo mwaminifu’ hudumisha mvutano wa neno kati ya upendo, wema, na uaminifu wa kudumu. Halifungwi kwa ‘rehema’ pekee wala haliongezi waziwazi neno ‘agano’ ambalo halipo katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mistari mitatu inadumisha mpangilio wa kishairi na ulinganifu wa sifa za Mungu. ‘Si mwepesi wa hasira’ ni ya asili zaidi kuliko tafsiri halisi ya nahau ya Kiebrania.
