  text: מַֽלְכוּתְ/ךָ֗ מַלְכ֥וּת כָּל עֹֽלָמִ֑ים וּ֝/מֶֽמְשֶׁלְתְּ/ךָ֗ בְּ/כָל דּ֥וֹר וָ/דֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/013.yaml
  text: Your kingdom is a kingdom of all ages[b][a], and your dominion is through every generation.
translation:
  language: sw
  text: 'Ufalme wako ni ufalme wa nyakati zote[a],

    na utawala wako katika kila kizazi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ufalme wako ni ufalme wa milele.” Kiebrania kinasema kwa karibu, “Ufalme wako ni ufalme wa nyakati zote.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kutoka kizazi hadi kizazi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכוּתְךָ
  choice: Ufalme wako
  rationale: Neno מַלְכוּת linaweza kumaanisha ufalme, ukuu wa kifalme, au kutawala. “Ufalme wako” ni Kiswahili cha kawaida na chenye hadhi, na kinahifadhi maana ya eneo pamoja na utawala wa Mungu.
- source_word: מַלְכוּת
  choice: ni ufalme
  rationale: Kurudia nomino kama katika Kiebrania—“Ufalme wako ni ufalme”—kunahifadhi msisitizo na muundo wa kishairi badala ya kuufupisha kuwa “Ufalme wako ni wa milele.”
- source_word: כָּל עֹלָמִים
  choice: wa nyakati zote
  rationale: Wingi עֹלָמִים hapa unaonyesha muda usio na kikomo unaovuka nyakati zote. “Wa nyakati zote” huhifadhi taswira hiyo kwa Kiswahili cha asili bila kuifasiri moja kwa moja kuwa “wa milele.”
- source_word: וּמֶמְשֶׁלְתְּךָ
  choice: na utawala wako
  rationale: מֶמְשָׁלָה ni mamlaka au tendo la kutawala. “Utawala” ni neno la kawaida, lenye hadhi, linaloendana na “ufalme” bila kudokeza tu mfumo wa kiutawala wa kibinadamu.
- source_word: בְּכָל דּוֹר וָדֹר
  choice: katika kila kizazi
  rationale: Kifungu hicho kwa karibu ni “katika kila kizazi na kizazi,” nahau inayoonyesha mwendelezo katika vizazi vinavyofuatana. “Katika kila kizazi” ni cha asili na kinahifadhi kiambishi בְּ pamoja na wazo la kila kizazi.
theological_decisions:
- issue: Muda wa ufalme na utawala wa Mungu
  choice: Maneno yanasisitiza kwamba ufalme na utawala wa Mungu unahusu nyakati na vizazi vyote, huku yakihifadhi urudiaji na ulinganifu wa kishairi wa Kiebrania.
  alternative: Ufalme wako ni ufalme wa milele, na utawala wako hudumu katika vizazi vyote.
  rationale: Kiebrania kinathibitisha wazi kudumu kwa ufalme wa Mungu, lakini hakitumii hapa kivumishi rahisi tu cha “milele” wala kitenzi wazi “hudumu.” Tafsiri kuu inadumisha sentensi nomino na mvutano wa kishairi bila kuingiza tamko la kimafundisho lililo pana kuliko mstari wenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na ya kishairi. Mstari wa pili umehifadhi muundo usio na kitenzi wazi wa Kiebrania; kitenzi “ni” kinaeleweka kutokana na mstari wa kwanza. Alama za tanbihi [a] na [b] zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
