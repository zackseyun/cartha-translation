  text: Generation to generation will praise your works[b][a], and will declare your mighty acts.
translation:
  language: sw
  text: Kizazi kimoja kitasifu matendo yako kwa kizazi kingine,[a] nao watatangaza matendo yako ya nguvu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kizazi baada ya kizazi kitasifu matendo yako.”
    reason: lexical_alternative
  - marker: b
    text: Au, “matendo yako makuu” au “matendo ya nguvu zako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר לְדוֹר
  choice: Kizazi kimoja kitakisifu kizazi kingine
  rationale: Muundo huu unaonyesha kwa kawaida katika Kiswahili kwamba kizazi kimoja kinakisimulia na kukisifia kizazi kinachofuata, huku ukihifadhi uhusiano wa דּוֹר לְדוֹר.
- source_word: יְשַׁבַּח
  choice: kitakisifu
  rationale: Kitenzi cha Kiebrania katika Piel huonyesha kusifu kwa wazi; ‘kitakisifu’ ni cha kawaida, cha kishairi, na kinaafikiana na mtendaji ‘kizazi kimoja’.
- source_word: מַעֲשֶׂיךָ
  choice: matendo yako
  rationale: ‘Matendo’ huhifadhi umbo la nomino na maana pana ya mambo ambayo Mungu ametenda.
- source_word: וּגְבוּרֹתֶיךָ
  choice: matendo yako yenye nguvu
  rationale: גְבוּרוֹת humaanisha maonyesho ya nguvu au matendo makuu; tafsiri hii inaweka pamoja wazo la tendo na la nguvu bila kuongeza maelezo ya kidhehebu.
- source_word: יַגִּידוּ
  choice: kitatangaza
  rationale: Hiphil ya נגד ina maana ya kueleza au kufanya yajulikane; ‘kitatangaza’ ina hadhi ya kishairi na inaendeleza ‘kizazi kimoja’ kama kiima cha pamoja.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na hadhi inayofaa zaburi. Tafsiri imetumia umoja ‘kizazi kimoja’ kama kiima; kitenzi cha pili pia kiko katika umoja kwa upatanisho wa kawaida wa Kiswahili, ingawa Kiebrania hubadili kwenda wingi katika יַגִּידוּ.
