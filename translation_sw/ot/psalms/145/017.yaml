  yaml_path: translation/ot/psalms/145/017.yaml
  text: Yahweh is righteous in all his ways and faithful in all his works[a].
translation:
  language: sw
  text: 'Yahwe ni mwenye haki katika njia zake zote,

    na ni mwaminifu katika matendo yake yote.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwenye fadhili,” “mwenye neema,” au “mwenye upendo thabiti.” Baadhi ya tafsiri zina “mtakatifu” hapa.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa umbo la Kiswahili linalotumika kwa kawaida, “Yahwe,” badala ya kulibadilisha kuwa cheo kama “BWANA.”
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Kirai hiki kinaeleza unyoofu na usahihi wa kimaadili wa Yahwe kwa Kiswahili cha kawaida na chenye heshima.
- source_word: בְּכָל דְּרָכָיו
  choice: katika njia zake zote
  rationale: “Njia” inadumisha sitiari ya Kiebrania kuhusu namna Yahwe anavyotenda, huku “katika ... zote” ikionyesha upeo kamili.
- source_word: חָסִיד
  choice: mwaminifu
  rationale: Katika ulinganifu huu wa kishairi, neno linaonyesha tabia inayotokana na חסד—uaminifu thabiti na wema wa agano—bila kulifanya kuwa hisia ya fadhili pekee.
- source_word: בְּכָל מַעֲשָׂיו
  choice: katika matendo yake yote
  rationale: “Matendo” ni Kiswahili cha asili kwa matendo au kazi anazofanya, na kinadumisha ulinganifu na “njia zake zote.”
theological_decisions:
- issue: Maana ya חָסִיד inaposemwa kuhusu tabia ya Mungu
  choice: mwaminifu
  alternative: mwenye fadhili / mwenye neema / mtakatifu
  rationale: Maandishi ya Kimasora yana חָסִיד, linaloweza kuonyesha uaminifu thabiti, fadhili, au neema. “Mwaminifu” linafaa katika muktadha huu bila kuondoa uwezekano wa maana za fadhili. “Mtakatifu” linatokana na mapokeo tofauti ya maandishi, kwa hiyo limewekwa katika tanbihi badala ya matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mistari miwili inadumisha ulinganifu wa shairi la Kiebrania.
