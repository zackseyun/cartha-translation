  text: קָר֣וֹב יְ֭הוָה לְ/כָל קֹרְאָ֑י/ו לְ/כֹ֤ל אֲשֶׁ֖ר יִקְרָאֻ֣/הוּ בֶ/אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/018.yaml
  text: Yahweh is near to all who call on him[a], to all who call on him in truth.
translation:
  language: sw
  text: 'Yahweh yuko karibu na wote wanaomwita,

    na wote wanaomwita kwa kweli.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa unyofu,” “kwa uaminifu,” au “kwa dhati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב
  choice: yuko karibu
  rationale: Kivumishi hiki cha kiarifu humaanisha kuwa karibu. Kiswahili cha kawaida huhitaji kitenzi kishirikishi hapa; “yuko karibu” huhifadhi maana ya ukaribu bila kuamua kama ni wa kimahali au wa kimahusiano.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetafsiriwa kwa unukuzi “Yahweh,” badala ya kubadilishwa na cheo.
- source_word: לְכָל
  choice: na wote
  rationale: Baada ya “yuko karibu,” kihusishi cha Kiswahili “na” huonyesha uhusiano wa ukaribu kwa njia ya kawaida. “Wote” huhifadhi wigo wa כָל katika mistari yote miwili.
- source_word: קֹרְאָיו
  choice: wanaomwita
  rationale: Katika muktadha huu קרא humaanisha kumwita Mungu, hasa katika sala au kuomba msaada. Muundo huu ni wa asili katika Kiswahili na unawakilisha kiambishi cha yambwa kinachomrejelea Mungu.
- source_word: אֲשֶׁר יִקְרָאֻהוּ
  choice: wanaomwita
  rationale: Kurudia tafsiri ileile huhifadhi usambamba na msisitizo wa kishairi wa Kiebrania.
- source_word: בֶאֱמֶת
  choice: kwa kweli
  rationale: אֱמֶת inaweza kuonyesha ukweli, unyofu, au uaminifu. “Kwa kweli” hufuata muundo wa chanzo na kuacha upana huo wa maana wazi; tanbihi inaonyesha uwezekano mwingine.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Chanzo kinatumia jina la Mungu moja kwa moja. “Yahweh” hulihifadhi kama jina binafsi badala ya kuliwakilisha kwa cheo.
- issue: Wigo wa ukaribu wa Mungu
  choice: Kudumisha “wote wanaomwita,” pamoja na sifa ya “kwa kweli”
  alternative: Kuwabana wawe washiriki wa agano pekee, au kupanua kauli iwahusu watu wote bila sharti la kumwita
  rationale: Mstari wenyewe unaeleza wigo kwa kusema “wote wanaomwita” na kisha kuufafanua kwa “kwa kweli.” Tafsiri haiingizi mfumo wa kiteolojia unaobana au kupanua kauli kuliko Kiebrania.
- issue: Maana ya בֶאֱמֶת katika kumwita Mungu
  choice: kwa kweli
  alternative: kwa unyofu; kwa uaminifu; kwa dhati
  rationale: Kauli ya Kiebrania inaweza kugusa ukweli, uhalisi wa moyo, na uaminifu. Tafsiri kuu huhifadhi utata huo badala ya kuufungia katika maana moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mgawanyo wa mistari na marudio ya “wote wanaomwita” huhifadhi usambamba wa kishairi wa Kiebrania.
