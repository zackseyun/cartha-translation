  text: בְּ/כָל י֥וֹם אֲבָרֲכֶ֑/ךָּ וַ/אֲהַלְלָ֥ה שִׁ֝מְ/ךָ֗ לְ/עוֹלָ֥ם וָ/עֶֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/002.yaml
  text: Every day I will bless you[b][a], and I will praise your name forever and ever.
translation:
  language: sw
  text: Kila siku nitakubariki, nami nitalisifu jina lako[a] milele na milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika lugha ya Biblia, “jina” la Mungu humaanisha pia jinsi alivyojifunua na sifa yake.
    reason: cultural_note
lexical_decisions:
- source_word: בְּכָל יוֹם
  choice: Kila siku
  rationale: Kirai hiki humaanisha tendo linalorudiwa siku zote. “Kila siku” ni Kiswahili cha kawaida na hudumisha maana hiyo bila ufafanuzi wa ziada.
- source_word: אֲבָרֲכֶךָ
  choice: nitakubariki
  rationale: Kitenzi ברך katika Piel humaanisha “bariki.” Hapa kinamwelekea Mungu moja kwa moja na kina nguvu ya azimio katika ushairi; wakati ujao wa Kiswahili unaonyesha azimio hilo.
- source_word: וַאֲהַלְלָה
  choice: nami nitalisifu
  rationale: Kitenzi הלל katika Piel ni “sifu.” Kiambishi cha yambwa katika “nitalisifu” kinarejelea “jina lako,” na “nami” huunganisha mstari wa pili kwa mtiririko wa asili wa Kiswahili.
- source_word: שִׁמְךָ
  choice: jina lako
  rationale: Tafsiri halisi huhifadhi lugha pana ya kibiblia ambayo “jina” humwakilisha Mungu jinsi alivyojifunua na sifa yake.
- source_word: לְעוֹלָם וָעֶד
  choice: milele na milele
  rationale: Usemi huu maradufu unasisitiza muda usio na mwisho. “Milele na milele” ni sawa ya kawaida na yenye hadhi katika Kiswahili.
theological_decisions:
- issue: Kumwambia Mungu moja kwa moja bila kuongeza cheo
  choice: nitakubariki
  alternative: nitakubariki, Ee Mungu / nitakubariki, Mungu wangu Mfalme
  rationale: Kiwakilishi tamati cha Kiebrania kinamwelekea Mungu moja kwa moja, lakini mstari huu haurudii cheo cha mstari uliotangulia. Tafsiri haiongezi maneno yasiyomo hapa.
- issue: Lugha ya “jina” kuhusu Mungu
  choice: jina lako
  alternative: wewe / sifa yako
  rationale: Maandishi yanasema wazi “jina lako.” Kulihifadhi neno “jina” kunatunza upana wake wa kitheolojia na kishairi badala ya kulibadili kuwa tafsiri moja tu ya maana yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kishairi; marudio ya “milele na milele” yamehifadhiwa kwa ajili ya msisitizo wa Kiebrania.
