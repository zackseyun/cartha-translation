  text: סוֹמֵ֣ךְ יְ֭הוָה לְ/כָל הַ/נֹּפְלִ֑ים וְ֝/זוֹקֵ֗ף לְ/כָל הַ/כְּפוּפִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/014.yaml
  text: Yahweh supports all who are falling and raises up all who are bowed down[a].
translation:
  language: sw
  text: Yahwe huwategemeza wote wanaoanguka[a], na huwainua wote walioinama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Huwategemeza wote waangukao.” Participle ya Kiebrania inaweza kueleweka kwa ujumla au kama tendo linaloendelea.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa umbo la Kiswahili ‘Yahwe,’ badala ya kulibadilisha kuwa cheo kama ‘BWANA.’
- source_word: סוֹמֵךְ
  choice: huwategemeza
  rationale: Kitenzi katika umbo la participle kinaonyesha tendo la kawaida au linaloendelea la kuwapa msaada na kuwazuia wasianguke kabisa; ‘huwategemeza’ ni Kiswahili cha asili kinachodumisha picha hiyo.
- source_word: לְכָל
  choice: wote
  rationale: Kihusishi לְ pamoja na כָל kinaonyesha upeo wa watendewa; katika Kiswahili, yambwa ‘wote’ hutoa maana hiyo kwa ufasaha bila tafsiri ya neno kwa neno.
- source_word: הַנֹּפְלִים
  choice: wanaoanguka
  rationale: Participle ya Kiebrania inaweza kuonyesha tendo linaloendelea au hali ya kawaida. ‘Wanaoanguka’ inadumisha wazo hilo bila kudai kwamba tayari wameanguka kabisa.
- source_word: זוֹקֵף
  choice: huwainua
  rationale: Kitenzi humaanisha kuwafanya wasimame wima au kuwainua. ‘Huwainua’ ni cha kawaida na kinaeleza urejesho katika ulinganifu na walioinama.
- source_word: הַכְּפוּפִים
  choice: walioinama
  rationale: Neno linaonyesha watu waliopindika au kuinamishwa, kihalisi au kimfano. ‘Walioinama’ huhifadhi picha hiyo bila kuamua kwamba sababu ni ukandamizaji.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi ya Kiebrania yana jina la Mungu lenye herufi nne moja kwa moja. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Hali ya watu wanaotajwa kwa הַנֹּפְלִים
  choice: wanaoanguka
  alternative: walioanguka; waangukao
  rationale: Participle haikulazimishi tafsiri kwamba kuanguka kumekamilika. Tafsiri hii inadumisha uwezekano wa tendo linaloendelea au hali inayojirudia, bila kupunguza ahadi ya msaada wa Mungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mistari miwili na picha za kuanguka na kuinama zimehifadhiwa; ‘chini’ haijaongezwa kwa kuwa haipo wazi katika maandishi ya Kiebrania.
