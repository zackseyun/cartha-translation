  text: זֵ֣כֶר רַב טוּבְ/ךָ֣ יַבִּ֑יעוּ וְ/צִדְקָתְ/ךָ֥ יְרַנֵּֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/007.yaml
  text: They will pour forth the memory of your abundant goodness[b][a], and they will sing for joy of your righteousness.
translation:
  language: sw
  text: 'Watataja kwa wingi wema wako mwingi[a],

    nao wataimba kwa shangwe juu ya haki yako[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Watatamka kumbukumbu ya wema wako mkuu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “uadilifu wako.”
    reason: alternative_reading
lexical_decisions:
- source_word: זֵכֶר
  choice: habari
  rationale: Katika muundo huu, זֵכֶר ni jambo linalokumbukwa na kutajwa kwa maneno. “Habari” linaonyesha simulizi au tangazo la wema wa Mungu kwa Kiswahili cha kawaida, huku maana halisi zaidi ya “kumbukumbu” ikihifadhiwa katika tanbihi.
- source_word: רַב
  choice: mwingi
  rationale: רַב inaonyesha wingi au ukubwa wa wema wa Mungu. “Mwingi” linaendana kiasili na “wema” na kudumisha wazo la wingi.
- source_word: טוּבְךָ
  choice: wema wako
  rationale: טוּבְךָ inaweza kumaanisha wema kwa upana, pamoja na ukarimu unaotokana nao. “Wema wako” haifungi maana kwenye baraka za mali pekee.
- source_word: יַבִּיעוּ
  choice: watabubujisha
  rationale: Hifili ya נבע inaleta taswira ya kitu kinachobubujika au kumiminika. “Watabubujisha” inadumisha picha ya maneno mengi yanayotoka kwa wingi kuliko tafsiri tambarare kama “watatamka.”
- source_word: וְצִדְקָתְךָ
  choice: uadilifu wako
  rationale: צדקה inaweza kuonyesha uadilifu wa kimaadili au haki katika matendo. “Uadilifu wako” inadumisha maana pana ya tabia na matendo yaliyo sawa ya Mungu; “haki yako” imetolewa kama mbadala.
- source_word: יְרַנֵּנוּ
  choice: wataimba kwa shangwe
  rationale: Pieli ya רנן huonyesha sauti kuu ya furaha, iwe kuimba au kupaza sauti. “Wataimba kwa shangwe” ni ya asili katika lugha ya zaburi na inafaa sambamba na tangazo la mstari wa kwanza.
theological_decisions:
- issue: Maana ya צדקה katika muktadha wa sifa
  choice: uadilifu wako
  alternative: haki yako
  rationale: Neno la Kiebrania linajumuisha uadilifu wa Mungu na haki yake. Matini kuu inatumia “uadilifu” ili kutopunguza maana kuwa hukumu ya kimahakama tu, huku “haki” ikihifadhiwa katika tanbihi kama tafsiri halali.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi unaoeleweka. “Watabubujisha” inadumisha sitiari hai ya Kiebrania, na mistari miwili inadumisha usambamba wa kishairi.
