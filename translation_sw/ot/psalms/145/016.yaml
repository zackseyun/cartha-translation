  yaml_path: translation/ot/psalms/145/016.yaml
  text: You open your hand and satisfy the desire of every living thing[a].
translation:
  language: sw
  text: Wewe hufungua mkono wako na hukidhi matamanio ya kila kiumbe hai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kukitosheleza kila kiumbe hai kwa kibali,” au “kwa mapenzi mema.” Nomino ya Kiebrania inaweza kumaanisha “matamanio,” “kibali,” au “mapenzi mema”; hapa “matamanio” yanafaa zaidi katika muktadha wa Mungu kuwapa viumbe wote mahitaji yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: פּוֹתֵחַ
  choice: hufumbua
  rationale: Kitenzi cha Kiebrania katika umbo la participle kinaeleza tendo la Mungu linaloendelea au la kawaida. ‘Hufumbua’ ni Kiswahili cha asili katika taswira ya kufumbua mkono.
- source_word: יָדֶךָ
  choice: mkono wako
  rationale: Taswira halisi ya kiungo cha mwili iko wazi na ina nguvu ya kishairi; haijafafanuliwa kuwa utoaji tu.
- source_word: וּמַשְׂבִּיעַ
  choice: na kukidhi
  rationale: Hiphil ya שׂבע ina maana ya kusababisha kutosheka au kushiba. Pamoja na ‘tamaa,’ ‘kukidhi’ ni ya kawaida na huhifadhi maana ya kutosheleza.
- source_word: לְכָל
  choice: ya kila
  rationale: Baada ya ‘kukidhi tamaa,’ muundo wa kawaida wa Kiswahili ni ‘tamaa ya kila...’ bila kubadili uhusiano wa kisarufi.
- source_word: חַי
  choice: kiumbe hai
  rationale: Kivumishi hiki kimetumika kama nomino kwa viumbe vyote vyenye uhai. ‘Kiumbe hai’ ni pana, wazi, na ya kawaida.
- source_word: רָצוֹן
  choice: tamaa
  rationale: Katika muktadha wa Mungu kuwalisha viumbe, neno linaelekea kumaanisha kile ambacho kila kiumbe hukitamani au kukihitaji. ‘Tamaa’ huhifadhi maana hii bila kuamua kimya kimya kuwa ni ‘kibali’ cha Mungu.
theological_decisions:
- issue: Taswira ya Mungu kwa sifa za kibinadamu
  choice: Kuhifadhi taswira halisi ‘mkono wako.’
  alternative: Wewe huwapa kwa ukarimu
  rationale: Kiebrania kinatumia taswira thabiti ya mkono kueleza utunzaji wa Mungu. Kuihifadhi hudumisha nguvu ya kishairi bila kuongeza dai la kimafundisho kuhusu mwili wa Mungu.
- issue: Maana ya רָצוֹן
  choice: tamaa ya kila kiumbe
  alternative: kibali au mapenzi mema
  rationale: Muktadha wa kuwapa chakula viumbe wote unaunga mkono kile ambacho viumbe wanakitamani; hata hivyo, maana nyingine halali zimehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. ‘Hufumbua mkono’ huhifadhi ushairi wa asili; ‘kukidhi tamaa’ ni fasaha na inaeleweka kwa wasomaji wa kawaida.
