base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/003.yaml
  text: Great is Yahweh[a], and greatly to be praised, and his greatness is unsearchable.
translation:
  language: sw
  text: Yahweh ni mkuu na wa kusifiwa sana; ukuu wake hauwezi kuchunguzwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na muundo wa Kiebrania, “kwa ukuu wake hakuna uchunguzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: ni mkuu
  rationale: Kivumishi hiki ni kiarifu mwanzoni mwa mstari. ‘Ni mkuu’ ni usemi wa kawaida unaohifadhi maana za ukubwa na utukufu bila kuongeza ufafanuzi usio katika Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lenye herufi nne limetoholewa kama ‘Yahweh’ badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: מְהֻלָּל מְאֹד
  choice: wa kusifiwa sana
  rationale: Muundo huu unaonyesha kwamba Yahweh anapaswa kusifiwa kwa kiwango kikubwa. ‘Wa kusifiwa sana’ ni wa asili katika Kiswahili na unadumisha nguvu ya מְאֹד.
- source_word: לִגְדֻלָּתוֹ
  choice: ukuu wake
  rationale: Nomino ‘ukuu’ inalingana moja kwa moja na גְּדֻלָּה na kiambishi ‘wake’ kinahifadhi nafsi ya tatu ya kiume katika muktadha.
- source_word: אֵין חֵקֶר
  choice: hauchunguziki
  rationale: Usemi huu unamaanisha kwamba ukuu wa Yahweh hauwezi kuchunguzwa au kufahamika kikamilifu. Tafsiri hii ni fupi na ya asili huku tanbihi ikihifadhi umbo halisi zaidi la Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Matini inatumia jina la agano moja kwa moja. ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Kiwango cha kutofahamika kwa ukuu wa Mungu
  choice: ukuu wake hauchunguziki
  alternative: ukuu wake hauna mwisho
  rationale: חֵקֶר huzungumzia kuchunguza au kutafuta ufahamu, si kutokuwa na mwisho moja kwa moja. Kwa hiyo tafsiri haibadilishi wazo la kutoweza kuuchunguza kuwa dai tofauti kuhusu ukomo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Muundo wa sentensi unafuata usambamba wa Kiebrania bila kuwa mgumu kwa msomaji wa kawaida.
