source:
  edition: WLC
  text: תְּהִלָּ֗ה לְ/דָ֫וִ֥ד אֲרוֹמִמְ/ךָ֣ אֱלוֹהַ֣/י הַ/מֶּ֑לֶךְ וַ/אֲבָרֲכָ֥ה שִׁ֝מְ/ךָ֗ לְ/עוֹלָ֥ם וָ/עֶֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/001.yaml
  text: A praise of David[a]. I will exalt you, my God the King[d][c][b], and I will bless your name forever and ever.
translation:
  language: sw
  text: 'Sifa ya Daudi.[a]


    Nitakukweza, Mungu wangu, Mfalme,[b]

    nami nitalibariki jina lako milele na milele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: Sifa iliyoandikwa na Daudi. Katika vichwa vya zaburi, neno la Kiebrania lililotafsiriwa “ya Daudi” linaweza kuonyesha uandishi au uhusiano.'
    reason: alternative_reading
  - marker: b
    text: 'Au: Mungu wangu na Mfalme wangu. Kiebrania kinasema kwa karibu zaidi, “Mungu wangu, Mfalme.”'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּהִלָּה
  choice: Sifa
  rationale: Nomino hii ni kichwa cha zaburi; “Sifa” huhifadhi umbo la nomino na ni Kiswahili cha kawaida na chenye hadhi.
- source_word: לְדָוִד
  choice: ya Daudi
  rationale: “Ya Daudi” huhifadhi kwa kiasi kikubwa unyumbufu wa kiambishi לְ katika vichwa vya zaburi, ambacho kinaweza kuonyesha uandishi au uhusiano, bila kukiamua kuwa “iliyoandikwa na Daudi.”
- source_word: אֲרוֹמִמְךָ
  choice: Nitakukweza
  rationale: Kitenzi רומם kina wazo la kuinua juu au kutukuza. “Nitakukweza” ni cha asili katika lugha ya ibada na huhifadhi taswira hiyo.
- source_word: אֱלוֹהַי
  choice: Mungu wangu
  rationale: Kiambishi cha nafsi ya kwanza umoja kimeonyeshwa wazi kwa “wangu.”
- source_word: הַמֶּלֶךְ
  choice: Mfalme
  rationale: Limetafsiriwa kama jina la cheo linalofafanua “Mungu wangu,” bila kuongeza kiunganishi “na” wala kimilikishi kingine kisichokuwamo katika Kiebrania.
- source_word: וַאֲבָרֲכָה
  choice: nami nitalibariki
  rationale: “Bariki” huhifadhi maana ya msingi ya ברך katika muktadha wa kumsifu Mungu; “nami” huunganisha kauli hii kwa njia ya asili na mstari uliotangulia.
- source_word: שִׁמְךָ
  choice: jina lako
  rationale: Huhifadhi nahau muhimu ya Biblia ya “jina,” inayojumuisha utambulisho na sifa ya Mungu bila kuifafanua kupita kiasi.
- source_word: לְעוֹלָם וָעֶד
  choice: milele na milele
  rationale: Usemi huu wa Kiswahili huhifadhi msisitizo wa Kiebrania kuhusu hali isiyo na mwisho.
theological_decisions:
- issue: Uhusiano kati ya “Mungu wangu” na “Mfalme” katika namna ya kumwita Mungu
  choice: Mungu wangu, Mfalme
  alternative: Mungu wangu na Mfalme wangu
  rationale: Kiebrania אֱלוֹהַי הַמֶּלֶךְ kinaweka “Mfalme” kama maelezo ya “Mungu wangu.” Tafsiri iliyochaguliwa haitii kiunganishi wala kimilikishi cha pili ambacho hakijaandikwa, huku alama ya mkato ikisaidia kuonyesha uhusiano wa ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya ibada. Mpangilio wa kishairi umehifadhiwa, na lugha imeepuka misamiati ya kimadhehebu. “Nitakukweza” na “nitalibariki jina lako” hudumisha taswira na nahau za chanzo huku zikibaki wazi kwa msomaji wa kawaida.
