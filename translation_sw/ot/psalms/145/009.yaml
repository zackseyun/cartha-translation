  text: טוֹב יְהוָ֥ה לַ/כֹּ֑ל וְ֝/רַחֲמָ֗י/ו עַל כָּל מַעֲשָֽׂי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/009.yaml
  text: Yahweh is good to all[a], and his mercies are over all his works.
translation:
  language: sw
  text: 'Yahweh ni mwema kwa wote,

    na rehema[a] zake ziko juu ya kazi zake zote.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huruma zake” au “rehema zake nyingi.” Kiebrania hutumia umbo la wingi, likisisitiza wingi wa matendo yake ya huruma.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: mwema
  rationale: Katika kishazi hiki cha kiarifu, kivumishi hiki kinaonyesha wema wa kimaadili na wema unaowafaidi wengine. “Mwema” ni tafsiri ya moja kwa moja na ya kawaida bila kuibana maana kuwa fadhili pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika herufi nne limetoholewa kuwa “Yahwe,” badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: לַכֹּל
  choice: kwa wote
  rationale: Kihusishi ל pamoja na כֹּל kinaonyesha wale ambao wema wa Yahwe unawaelekea. “Kwa wote” ni Kiswahili cha kawaida na huhifadhi upeo wa wote.
- source_word: רַחֲמָיו
  choice: rehema zake
  rationale: Nomino ya wingi kutoka רחם inaweza kumaanisha hisia na matendo mengi ya huruma. “Rehema zake” huhifadhi wingi huo kwa usemi wa Kiswahili unaoeleweka na wenye hadhi.
- source_word: עַל
  choice: juu ya
  rationale: Hapa עַל huonyesha kwamba rehema za Mungu zinaenea juu ya kazi zake zote. “Juu ya” huhifadhi taswira ya kishairi bila kufafanua zaidi ya maandishi.
- source_word: כָּל
  choice: zote
  rationale: “Zote” hutoa maana ya ujumla na hukubaliana kisarufi na “kazi,” huku ikihifadhi urudiaji wa kishairi wa כֹּל.
- source_word: מַעֲשָׂיו
  choice: kazi zake
  rationale: Katika muktadha huu, מַעֲשִׂים inaelekea kumaanisha jumla ya kazi za Mungu, hasa vitu alivyovifanya. “Kazi zake” ni fupi, ya kishairi, na haifungi maana kwa uumbaji pekee.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Mstari unatumia jina la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Upeo wa wema na rehema za Mungu
  choice: kwa wote ... kazi zake zote
  alternative: kwa watu wote ... kila kitu alichoumba
  rationale: Maneno ya Kiebrania כֹּל na מַעֲשָׂיו yana upeo mpana. Tafsiri haubani “wote” kwa wanadamu pekee, wala haisuluhishi kimya kimya ikiwa “kazi” zinamaanisha uumbaji pekee au matendo yote ya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Mpangilio wa mistari miwili huhifadhi usambamba wa kishairi; hakuna tanbihi iliyohitajika kwa kuwa “rehema zake” tayari huhifadhi wingi wa Kiebrania.
