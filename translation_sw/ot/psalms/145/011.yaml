base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/011.yaml
  text: They will speak of the glory of your kingdom[b][a], and talk of your might.
translation:
  language: sw
  text: Watasema kuhusu utukufu wa ufalme wako,[a] na watazungumza kuhusu uweza wako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utawala wako” au “enzi yako.”
    reason: lexical_alternative
  - marker: b
    text: Au “nguvu yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבוֹד
  choice: utukufu
  rationale: Neno hili huonyesha utukufu, heshima, au fahari; “utukufu” linafaa katika muktadha wa sifa na linaonyesha adhama ya kifalme.
- source_word: מַלְכוּתְךָ
  choice: ufalme wako
  rationale: מַלְכוּת linaweza kumaanisha ufalme, utawala, au mamlaka ya kifalme. “Ufalme wako” ni la kawaida na la asili katika Kiswahili, huku likiacha wazi wazo la enzi na utawala.
- source_word: יֹאמֵרוּ
  choice: watasema juu ya
  rationale: Kitenzi אָמַר kimsingi ni “kusema.” Muundo huu unaendeleza hali ya wakati ujao ya kitenzi na unafaa kwa habari inayotajwa katika mstari.
- source_word: גְבוּרָתְךָ
  choice: uweza wako
  rationale: גְּבוּרָה huonyesha nguvu au uweza, na wakati mwingine matendo makuu. “Uweza wako” huhifadhi nomino dhahania ya umoja bila kuongeza wazo la matendo ambalo halijaelezwa wazi.
- source_word: יְדַבֵּרוּ
  choice: kunena juu ya
  rationale: דָּבַר ni kusema au kunena. “Kunena” hutofautisha kitenzi hiki na “watasema” huku kikihifadhi usambamba wa kishairi bila kuongeza nguvu ya maana kama “kutangaza.”
theological_decisions:
- issue: Maana ya מַלְכוּת inapomhusu Mungu
  choice: ufalme wako
  alternative: utawala wako; enzi yako
  rationale: Neno la Kiebrania linaweza kurejelea eneo la kifalme, hali ya kuwa mfalme, au tendo la kutawala. “Ufalme wako” huhifadhi usemi wa kawaida wa kifalme bila kuondoa uwezekano wa maana ya utawala au enzi; maana hizo mbadala zimeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Usambamba wa vishazi viwili umehifadhiwa kwa “watasema” na “kunena,” huku msamiati ukiwa wa kawaida kwa wasomaji wa leo.
