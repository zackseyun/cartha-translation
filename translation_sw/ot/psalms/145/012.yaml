lexical_decisions:
- source_word: לְהוֹדִיעַ
  choice: kuwajulisha
  rationale: Kitenzi hiki katika kausativi humaanisha ‘kusababisha wajue’ au ‘kujulisha.’ ‘Kuwajulisha’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya kusababisha kujua.
- source_word: לִבְנֵי הָאָדָם
  choice: wanadamu
  rationale: Kihalisi ni ‘wana wa Adamu,’ lakini ni usemi wa Kiebrania unaowarejelea watu kwa ujumla. ‘Wanadamu’ ni tafsiri ya asili na jumuishi katika Kiswahili; umbo la Kiebrania limehifadhiwa katika tanbihi.
- source_word: גְּבוּרֹתָיו
  choice: matendo yake makuu
  rationale: Nomino hii humaanisha matendo yenye nguvu au maonyesho ya uwezo. ‘Matendo yake makuu’ ni wazi, ya kishairi, na inafaa katika muktadha wa sifa.
- source_word: וּכְבוֹד הֲדַר
  choice: na fahari tukufu
  rationale: Maneno כבוד na הדר yanaeleza utukufu, fahari, na adhama. ‘Fahari tukufu’ huyawasilisha yote mawili kwa Kiswahili cha asili bila kuunda mfuatano mzito wa nomino.
- source_word: מַלְכוּתוֹ
  choice: ya ufalme wake
  rationale: מַלְכוּת inaweza kumaanisha ufalme, utawala, au mamlaka ya kifalme. ‘Ufalme wake’ ni chaguo la kawaida na linafaa katika sifa za kifalme za zaburi hii.
theological_decisions:
- issue: Usemi wa jumla kuhusu binadamu katika לִבְנֵי הָאָדָם
  choice: Kutumia ‘wanadamu’ katika matini kuu na kueleza umbo halisi katika tanbihi
  alternative: wana wa Adamu
  rationale: Usemi huo unawahusu binadamu wote, si wanaume pekee. ‘Wanadamu’ huwasilisha maana hiyo kwa usahihi na kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi taswira halisi ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na heshima. Mstari umeachwa kama kishazi cha kusudi (‘ili...’) kwa sababu ndivyo unavyoungana kisarufi na mstari uliotangulia.
