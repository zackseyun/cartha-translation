  text: ili kuwajulisha wanadamu[a] matendo yake makuu na utukufu wa fahari ya ufalme wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wote.” Kihalisi, “wana wa mtu,” usemi wa Kiebrania unaowarejelea wanadamu kwa ujumla.
