  text: שׁוֹמֵ֣ר יְ֭הוָה אֶת כָּל אֹהֲבָ֑י/ו וְ/אֵ֖ת כָּל הָ/רְשָׁעִ֣ים יַשְׁמִֽיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/020.yaml
  text: Yahweh preserves all who love him[a], but all the wicked he will destroy.
translation:
  language: sw
  text: Yahweh huwalinda wote wanaompenda, lakini[a] atawaangamiza waovu wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na waovu wote”; kiunganishi cha Kiebrania kwa msingi ni “na,” lakini hapa kinatumika kuonyesha ukinzani.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹמֵר
  choice: huwalinda
  rationale: Kitenzi-jina cha Kiebrania kinaonyesha tendo la kuendelea la kulinda au kutunza. “Huwalinda” ni Kiswahili cha kawaida kinachoeleza ulinzi wenye kujali, na kinatofautiana wazi na hukumu katika kishazi kinachofuata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: אֶת כָּל אֹהֲבָיו
  choice: wote wanaompenda
  rationale: Muundo huu unamaanisha watu wote wanaompenda Yahweh. Kishazi rejeshi ni cha kawaida na wazi katika Kiswahili kuliko tafsiri ya nomino kama “wapenzi wake,” ambayo inaweza kuleta maana nyingine.
- source_word: וְאֵת כָּל הָרְשָׁעִים
  choice: lakini waovu wote
  rationale: 'Ingawa kiunganishi cha Kiebrania kwa msingi ni “na,” hapa uhusiano wa mishororo ni wa kulinganisha kwa ukinzani: wanaompenda wanalindwa, lakini waovu wanaangamizwa.'
- source_word: יַשְׁמִיד
  choice: atawaangamiza
  rationale: Hifili ya שׁמד ina maana ya kusababisha uharibifu. “Atawaangamiza” inadumisha uzito na mwelekeo wa wakati ujao bila kubainisha namna ya uharibifu zaidi ya maandishi ya Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia jina la Mungu moja kwa moja; kulitohowa kama “Yahweh” huhifadhi jina hilo badala ya kuliweka kama cheo.
- issue: Nguvu ya kiunganishi kabla ya kishazi cha pili
  choice: ukinzani (“lakini”)
  alternative: uunganishaji wa kawaida (“na”)
  rationale: Kiunganishi cha Kiebrania kinaweza kutafsiriwa “na,” lakini ulinganifu wa kishairi hapa unaonyesha ukinzani kati ya kuwalinda wanaompenda Yahweh na kuwaangamiza waovu. Tanbihi huhifadhi uwezekano wa tafsiri ya kimofolojia ya moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na ulio wazi kwa msomaji wa kawaida. “Huwalinda” hudokeza tendo la kawaida au linaloendelea, huku “atawaangamiza” ikihifadhi nguvu ya hukumu ya kishazi cha pili.
