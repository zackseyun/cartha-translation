id: PSA.145.15
reference: Psalms 145:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: עֵֽינֵי כֹ֭ל אֵלֶ֣י/ךָ יְשַׂבֵּ֑רוּ וְ/אַתָּ֤ה נֽוֹתֵן לָ/הֶ֖ם אֶת אָכְלָ֣/ם בְּ/עִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/015.yaml
  text: The eyes of all look to you[b][a], and you give them their food in its time.
translation:
  language: sw
  text: 'Macho ya wote yanakutazamia[a],

    nawe unawapa chakula chao kwa wakati wake[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yanakungoja,” “yanakutazama kwa matarajio,” au “yanakutumainia.” Kitenzi cha Kiebrania kina maana ya kungoja kwa matarajio.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa wakati unaofaa” au “kwa majira yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי כֹל
  choice: Macho ya wote
  rationale: Huhifadhi taswira hai ya Kiebrania na kuacha neno ‘wote’ likiwa pana, bila kulifanya limaanishe watu pekee au viumbe vyote kwa kuongeza maneno yasiyokuwamo katika mstari huu.
- source_word: אֵלֶיךָ יְשַׂבֵּרוּ
  choice: yanakutazamia
  rationale: ‘Kukutazamia’ ni usemi wa kawaida wa Kiswahili unaodumisha taswira ya macho kuelekezwa kwa Mungu pamoja na maana ya kungoja kwa matarajio iliyo katika kitenzi יְשַׂבֵּרוּ.
- source_word: וְאַתָּה
  choice: nawe
  rationale: 'Kiunganishi waw hapa kinaendeleza uwiano wa kishairi: wote wanamtazamia Mungu, naye huwapa. Hakuna ulazima wa kukitafsiri kwa maana ya upinzani kama ‘lakini wewe.’'
- source_word: נֹתֵן
  choice: unawapa
  rationale: Umbo la participle linaonyesha tendo la kawaida au linaloendelea. Wakati wa sasa katika ‘unawapa’ unawasilisha maana hiyo kwa Kiswahili cha kawaida huku ukihifadhi wazo la kutoa.
- source_word: אָכְלָם
  choice: chakula chao
  rationale: Neno hili linamaanisha chakula kwa ujumla, si mkate pekee.
- source_word: בְּעִתּוֹ
  choice: kwa wakati wake
  rationale: Tafsiri hii inafuata kwa karibu nomino ya umoja yenye kiambishi cha umilikaji, na haiingizi wazi wazo la ‘wakati unaofaa,’ ingawa maana hiyo inawezekana katika muktadha.
theological_decisions:
- issue: Wigo wa ‘wote’ katika utoaji wa Mungu
  choice: ‘Wote’ limeachwa bila kubainisha kundi linalorejelewa.
  alternative: ‘watu wote’ au ‘viumbe vyote vilivyo hai’
  rationale: Kiebrania hakitaji wazi wanaorejelewa. Muktadha unaonyesha upana wa utunzaji wa Mungu, lakini mstari wenyewe haupaswi kufinywa wala kupanuliwa kwa kuongeza kundi maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na rahisi kueleweka. Mpangilio wa mistari unahifadhi uwiano wa kishairi wa Kiebrania, na ‘yanakutazamia’ huunganisha taswira ya macho na matarajio bila maelezo mazito.
