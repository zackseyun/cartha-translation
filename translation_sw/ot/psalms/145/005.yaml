  text: On the glorious splendor of your majesty[a], and on your wondrous works, I will meditate.
translation:
  language: sw
  text: Nitautafakari[a] uzuri wa utukufu wa adhama yako, na nitayatafakari matendo yako ya ajabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitasema kuhusu uzuri wa utukufu wa adhama yako, na matendo yako ya ajabu.” Kitenzi cha Kiebrania kinaweza kumaanisha kutafakari, kuwaza, au kusema.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲדַר
  choice: uzuri
  rationale: Neno hili huonyesha uzuri wenye fahari au adhama; “uzuri” linahifadhi upande wa kuvutia na kung'aa katika mlolongo huu wa maneno ya utukufu.
- source_word: כְּבוֹד
  choice: utukufu
  rationale: Hapa ni sehemu ya mlolongo wa nomino unaosisitiza adhama ya kifalme ya Mungu; “utukufu” ni neno la kawaida na lenye uzito unaofaa.
- source_word: הוֹדֶךָ
  choice: fahari yako
  rationale: הוד huashiria fahari, adhama, au utukufu wa kifalme. “Fahari yako” huepuka kurudia “utukufu” huku ikihifadhi maana ya hadhi yenye kung'aa.
- source_word: וְדִבְרֵי נִפְלְאוֹתֶיךָ
  choice: na matendo yako ya ajabu
  rationale: Ingawa דִבְרֵי kwa umbo ni “maneno/mambo ya,” muungano huu unaweza kuelekeza kwa mambo ya ajabu yanayosimuliwa. Kiswahili cha moja kwa moja “matendo yako ya ajabu” kinaeleza vizuri miujiza au kazi kuu za Mungu bila kuwa kizito.
- source_word: אָשִׂיחָה
  choice: nitautafakari
  rationale: Kitenzi שיח kinaweza kumaanisha kutafakari, kuwaza kwa kina, au kusema. “Nitautafakari” kinafaa kwa mwelekeo wa fikira, huku kidokezo kikihifadhi uwezekano wa usemi.
