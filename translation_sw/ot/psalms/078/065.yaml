  yaml_path: translation/ot/psalms/078/065.yaml
  text: Then the Lord awoke as from sleep[a], like a warrior shouting because of wine.
translation:
  language: sw
  text: Ndipo Bwana akaamka kama kutoka usingizini, kama shujaa apigaye kelele kwa sababu ya divai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama shujaa anayeshangilia kwa sababu ya divai”; au, “kama mtu mwenye nguvu apigaye kelele kutokana na divai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַץ
  choice: akaamka
  rationale: Kitenzi יקץ humaanisha kuamka au kuzinduka kutoka usingizini; “akaamka” ni cha kawaida na hudumisha picha ya kishairi.
- source_word: כְּיָשֵׁן
  choice: kama mtu kutoka usingizini
  rationale: Kiambishi כְּ kinaonyesha ulinganisho. Tafsiri hii inasikika kwa kawaida katika Kiswahili na kudokeza kuwa huu ni mfano wa kishairi, si dai kwamba Bwana alilala kihalisi.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Hili ni jina la cheo אֲדֹנָי, si Tetragramatoni; “Bwana” ndilo neno la kawaida la Kiswahili.
- source_word: כְגִבּוֹר
  choice: kama shujaa
  rationale: גִּבּוֹר humaanisha mtu mwenye nguvu, hasa mpiganaji; “shujaa” huhifadhi picha ya vita kwa lugha inayoeleweka.
- source_word: מִתְרוֹנֵן
  choice: anayepiga kelele
  rationale: Umbo hili linaweza kueleza kutoa sauti kubwa au kushangilia kwa sauti. “Anayepiga kelele” huhifadhi tendo la sauti bila kuamua kwamba ni shangwe pekee.
- source_word: מִיָּיִן
  choice: kwa sababu ya divai
  rationale: מִן inaweza kuonyesha chanzo au sababu; hapa inaonyesha kwamba divai ndiyo inayochochea kelele ya shujaa, huku tanbihi ikihifadhi uwezekano wa tafsiri iliyo karibu zaidi na muundo wa Kiebrania.
theological_decisions:
- issue: Taswira ya kibinadamu ya Bwana kuamka na kufananishwa na shujaa aliyechochewa na divai
  choice: Kudumisha ulinganisho huo kama taswira ya kishairi bila kuupunguza makali.
  alternative: Kuondoa taswira ya kulala au kutafsiri divai kwa njia ya sitiari iliyoelezwa.
  rationale: Mstari unaeleza kuingilia kati kwa Bwana baada ya kipindi kilichoonekana kama kutotenda. Tafsiri inapaswa kuhifadhi mvutano na nguvu ya ushairi badala ya kuufafanua mbali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili kwa wasomaji wa kawaida, huku taswira kali ya Kiebrania na uwezekano wa maana ya מִתְרוֹנֵן vikihifadhiwa.
