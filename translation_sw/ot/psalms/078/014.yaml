base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/014.yaml
  text: He led them with a cloud by day[a], and all the night with the light of fire.
translation:
  language: sw
  text: Aliwaongoza kwa wingu wakati wa mchana,[a] na usiku kucha kwa nuru ya moto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Aliwaelekeza kwa wingu mchana, na usiku kucha kwa nuru ya moto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: Aliwaongoza
  rationale: Kitenzi נחה katika Hiphil pamoja na kiambishi cha nafsi ya tatu wingi humaanisha kuwaongoza au kuwaelekeza. “Aliwaongoza” ni cha kawaida, wazi, na kinadumisha wazo la Mungu kuwaelekeza jangwani.
- source_word: בֶּעָנָן
  choice: kwa wingu
  rationale: 'Kihusishi ב hapa kinaonyesha njia au chombo: Mungu aliwaongoza kwa kutumia wingu. “Kwa wingu” ni kifupi na kinahifadhi taswira ya Kiebrania bila kuifafanua kupita kiasi.'
- source_word: יוֹמָם
  choice: wakati wa mchana
  rationale: Ni usemi wa kielezi wenye maana ya “mchana” au “wakati wa mchana.” Chaguo hili ni la kawaida katika Kiswahili na linatofautisha wazi mchana na usiku unaotajwa baadaye.
- source_word: וְכָל הַלַּיְלָה
  choice: na usiku kucha
  rationale: Maana halisi ni “na usiku wote.” “Usiku kucha” ni usemi wa asili wa Kiswahili unaohifadhi maana ya kipindi chote cha usiku.
- source_word: בְּאוֹר אֵשׁ
  choice: kwa nuru ya moto
  rationale: Kirai kinamaanisha kwa au katika nuru ya moto. “Kwa nuru ya moto” kinahifadhi nomino zote mbili na kuonyesha kwamba moto ulitoa mwanga wa kuwaongoza.
theological_decisions:
- issue: Asili ya taswira ya kuongozwa jangwani
  choice: Mstari umetafsiriwa kama simulizi la kihistoria la Mungu kuwaongoza Waisraeli kwa wingu na nuru ya moto, bila kuongeza ufafanuzi wa kiteolojia.
  alternative: Kufasiri wingu na moto kiishara au kama vielelezo vya mambo mengine ndani ya matini kuu.
  rationale: Mstari wenyewe unakumbusha namna Mungu alivyowaongoza wakati wa kutoka Misri. Tafsiri haipaswi kuingiza maana ya kiishara ambayo haijasemwa moja kwa moja katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Usiku kucha” imetumiwa kwa uasilia badala ya tafsiri ngumu ya neno kwa neno, huku muundo na taswira za Kiebrania zikihifadhiwa.
