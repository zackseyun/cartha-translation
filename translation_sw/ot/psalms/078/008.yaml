base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/008.yaml
  text: and that they should not be like their fathers[a], a stubborn and rebellious generation[b], a generation that did not set its heart aright and whose spirit was not faithful to God.
translation:
  language: sw
  text: 'ili wasiwe kama baba zao,


    kizazi cha ukaidi na uasi,


    kizazi ambacho hakikuufanya moyo wake uwe imara[a],


    na ambacho roho yake haikuwa mwaminifu kwa Mungu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakikuutayarisha moyo wake” au “hakikuuthibitisha moyo wake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “roho yake haikuwa thabiti kwa Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יִהְיוּ
  choice: ili wasiwe
  rationale: 'Huendeleza kusudi la mstari uliotangulia kwa Kiswahili cha kawaida: kizazi kijacho kijifunze ili kisiige waliotangulia.'
- source_word: כַאֲבוֹתָם
  choice: kama baba zao
  rationale: Huhifadhi maana ya moja kwa moja ya 'baba' na mlingano wa vizazi katika zaburi.
- source_word: דּוֹר
  choice: kizazi
  rationale: Ni neno la kawaida kwa kundi la watu wa kipindi au ukoo mmoja, na hurudia kwa ufasaha katika ushairi huu.
- source_word: סוֹרֵר וּמֹרֶה
  choice: kikaidi na chenye kuasi
  rationale: '''Kikaidi'' huonyesha ukaidi wa kutotaka kuongozwa, na ''chenye kuasi'' huonyesha upinzani wa makusudi; yote mawili yanahifadhi msisitizo wa jozi ya Kiebrania.'
- source_word: הֵכִין לִבּוֹ
  choice: hakikuufanya moyo wake kuwa thabiti
  rationale: Huhifadhi sitiari ya kuuthibitisha au kuuweka imara moyo bila kuifasiri kuwa tendo la kiakili tu.
- source_word: לִבּוֹ
  choice: moyo wake
  rationale: Huhifadhi lugha ya kibiblia kuhusu nia, mapenzi, na hali ya ndani ya kizazi kama jumla.
- source_word: נֶאֶמְנָה
  choice: haikuwa aminifu
  rationale: Huonyesha uaminifu au uthabiti wa ndani katika uhusiano na Mungu.
- source_word: אֶת אֵל
  choice: kwa Mungu
  rationale: Ni uhusiano wa kawaida na wa asili katika Kiswahili kwa kusema kuwa mtu ni aminifu kwa Mungu.
- source_word: רוּחוֹ
  choice: roho yake
  rationale: Huhifadhi neno tofauti na 'moyo' na kudokeza mwelekeo wa ndani wa kizazi.
theological_decisions:
- issue: Jozi ya kibinadamu ya 'moyo' na 'roho'
  choice: 'Kuhifadhi maneno yote mawili tofauti: ''moyo'' na ''roho''.'
  alternative: Kuyajumlisha kuwa wazo moja kama 'hali yao ya ndani'.
  rationale: Kiebrania hutumia maneno mawili yanayohusiana lakini tofauti; kuyahifadhi kunalinda muundo wa kishairi na mvutano wa kiteolojia.
- issue: Umoja wa kisarufi katika nomino ya jumla 'kizazi'
  choice: 'Kutumia viambishi vya umoja: ''moyo wake'' na ''roho yake''.'
  alternative: 'Kutumia wingi: ''mioyo yao'' na ''roho zao''.'
  rationale: Kiebrania hurejelea kizazi kama umoja wa kijumla, na Kiswahili pia huruhusu upatanisho huu kwa njia ya kawaida.
- issue: Maana pana ya הֵכִין לִבּוֹ
  choice: hakikuufanya moyo wake kuwa thabiti
  alternative: hakikuutayarisha moyo wake; hakikuuthibitisha moyo wake
  rationale: Chaguo hili huhifadhi wazo la uthabiti wa ndani bila kulazimisha iwapo kitenzi kinamaanisha hasa kutayarisha, kuthibitisha, au kuelekeza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mistari imepangwa ili kudumisha ulinganifu wa ushairi wa Kiebrania; 'kikaidi' na 'chenye kuasi' huepuka lugha ya kizamani huku zikihifadhi uzito wa maadili.
