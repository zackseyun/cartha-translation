  text: But they turned back and acted treacherously like their fathers[a]; they turned aside like a deceitful bow.
translation:
  language: sw
  text: Lakini walirudi nyuma na kutenda kwa hiana kama baba zao; wakapotoka kama upinde usiotegemewa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kama upinde mlegevu” au “kama upinde wenye kasoro”—yaani, upinde usioweza kutegemewa kutupa mshale kwa usahihi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּגוּ
  choice: walirudi nyuma
  rationale: Kitenzi סוּג kinaonyesha kurudi nyuma au kuacha njia iliyofuatwa; usemi huu ni wa kawaida na haingizi istilahi ya kitheolojia isiyomo wazi katika mstari.
- source_word: וַיִּבְגְּדוּ
  choice: kutenda kwa hiana
  rationale: בגד hubeba maana ya kutokuwa mwaminifu kwa njia ya usaliti; ‘kutenda kwa hiana’ huhifadhi uzito wa kimaadili bila kuongeza yule aliyetendewa.
- source_word: כַּאֲבוֹתָם
  choice: kama baba zao
  rationale: Tafsiri hii huhifadhi neno la Kiebrania אָבוֹת, ‘baba,’ badala ya kulipanua kimuktadha kuwa ‘mababu’ au ‘wahenga.’
- source_word: נֶהְפְּכוּ
  choice: wakageuka
  rationale: Katika mfano wa upinde, הפך huonyesha kugeuka au kupotoka kutoka mwelekeo uliokusudiwa; ‘wakageuka’ ni ya asili na huacha mfano wenyewe utoe wazo la kupotoka.
- source_word: כְּקֶשֶׁת רְמִיָּה
  choice: kama upinde usioaminika
  rationale: רְמִיָּה inaweza kuashiria udanganyifu, ulegevu, au hitilafu. ‘Upinde usioaminika’ hueleza kwa kawaida chombo kisichoweza kutegemewa kulenga sawa huku ikihifadhi upana wa maana.
theological_decisions:
- issue: Dokezo la kutokuwa waaminifu katika agano
  choice: Kutumia lugha yenye uzito wa kimaadili, ‘kutenda kwa hiana,’ bila kutaja wazi agano au mhusika aliyetendewa.
  alternative: ‘Wakakosa uaminifu’ au ‘wakavunja uaminifu wao kwa Mungu.’
  rationale: Muktadha mpana unahusu kutokuwa waaminifu kwa Mungu, lakini mstari huu hautaji wazi ‘agano’ wala yule aliyetendewa. Tafsiri haiingizi ufafanuzi wa kiteolojia usiotamkwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kwa hiana’ huhifadhi uzito wa usaliti; ‘upinde usioaminika’ ni wazi kwa msomaji wa kawaida. Alama ya tanbihi imewekwa baada ya mfano unaofafanuliwa.
