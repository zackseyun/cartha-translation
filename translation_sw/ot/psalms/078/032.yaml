  variant: Standard East African Swahili
source:
  edition: WLC
  text: בְּ/כָל זֹ֭את חָֽטְאוּ ע֑וֹד וְ/לֹֽא הֶ֝אֱמִ֗ינוּ בְּ/נִפְלְאוֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/032.yaml
  text: In spite of all this[a], they still sinned and did not believe in his wondrous works.
translation:
  language: sw
  text: Licha ya hayo yote, waliendelea kutenda dhambi, wala hawakuamini matendo yake ya ajabu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakuyatumainia matendo yake ya ajabu.” Kitenzi cha Kiebrania kinaweza kumaanisha kuamini au kutumaini.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/כָל זֹאת
  choice: Licha ya hayo yote
  rationale: 'Kirai hiki kina maana ya kukubali hali inayopingana na tendo linalofuata: pamoja na hukumu na riziki zilizotangulia, watu waliendelea kutenda dhambi.'
- source_word: חָטְאוּ עוֹד
  choice: waliendelea kutenda dhambi
  rationale: עוֹד huonyesha kuendelea kwa tendo baada ya matukio yaliyotangulia. Kiswahili hiki huonyesha ukaidi wao unaoendelea kwa njia ya kawaida na wazi.
- source_word: וְ/לֹא
  choice: wala hawakuamini
  rationale: ‘Wala’ huunganisha kwa kawaida katika Kiswahili kishazi hasi na wazo lililotangulia bila kuongeza ufafanuzi usiokuwamo katika Kiebrania.
- source_word: הֶאֱמִינוּ
  choice: hawakuamini
  rationale: Hifili ya אמן inaweza kumaanisha kuamini au kutumaini. ‘Kuamini’ linafaa hapa kwa kuwa matendo ya Mungu yaliyodhihirishwa ndiyo yanayotajwa, huku uwezekano wa maana ya kutumaini ukihifadhiwa katika tanbihi.
- source_word: בְּ/נִפְלְאוֹתָיו
  choice: matendo yake ya ajabu
  rationale: נפלאות humaanisha matendo ya Mungu yaliyo ya kushangaza au ya ajabu. ‘Matendo yake ya ajabu’ ni Kiswahili cha kawaida, chenye heshima, na huweka wazi kuwa yanayorejelewa ni matendo halisi, si hisia ya mshangao pekee.
theological_decisions:
- issue: Hali ya kushindwa kwa Israeli kuitikia matendo ya Mungu
  choice: hawakuamini matendo yake ya ajabu
  alternative: hawakuyatumainia matendo yake ya ajabu
  rationale: Kiebrania kinaweza kuonyesha kuamini au kutumaini. Matini kuu inatumia ‘kuamini’ ili kusisitiza kutokuitikia ushahidi wa matendo ya Mungu, bila kuingiza maelezo mapana ya kiitikadi; tanbihi huhifadhi maana mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Licha ya hayo yote’ ni usemi wa kawaida wa kuonyesha hali ya kupingana; ‘waliendelea kutenda dhambi’ huwasilisha nguvu ya עוֹד kwa uwazi. Alama ya tanbihi imewekwa baada ya sentensi inayohusika.
