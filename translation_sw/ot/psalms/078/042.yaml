base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/042.yaml
  text: They did not remember his hand[b][a], the day when he redeemed them from the foe.
translation:
  language: sw
  text: Hawakukumbuka mkono wake[a], siku ile alipowakomboa kutoka kwa adui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘nguvu yake’ au ‘matendo ya mkono wake.’ Kiebrania kinasema kihalisi ‘mkono wake.’
    reason: lexical_alternative
  - marker: b
    text: Au ‘mtesi’ au ‘mpinzani.’
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרוּ
  choice: hawakukumbuka
  rationale: Kitenzi זכר katika Qal humaanisha ‘kukumbuka’ au ‘kukumbuka tena.’ Pamoja na לֹא, ‘hawakukumbuka’ huhifadhi muundo wa Kiebrania na ni Kiswahili cha kawaida kuliko tafsiri ya kifafanuzi zaidi kama ‘walisahau.’
- source_word: יָדוֹ
  choice: mkono wake
  rationale: ‘Mkono’ ni sitiari ya kawaida ya Kiebrania kwa nguvu au tendo. Kuihifadhi hudumisha taswira halisi ya matini badala ya kuibadili moja kwa moja kuwa dhana ya ‘nguvu.’
- source_word: יוֹם אֲשֶׁר
  choice: siku alipo-
  rationale: Muundo huu una nguvu ya wakati. ‘Siku alipowakomboa’ ni wa asili katika Kiswahili na huhifadhi rejeo la siku au tukio maalumu.
- source_word: פָּדָם
  choice: alipowakomboa
  rationale: פדה humaanisha kukomboa au kuokoa kwa kuwaondoa watu katika utumwa au hatari. ‘Kukomboa’ huhifadhi uzito wa neno katika muktadha wa kutoka Misri bila kuongeza dai la kiteolojia lisilosemwa na mstari.
- source_word: מִנִּי צָר
  choice: kutoka kwa adui
  rationale: צָר humaanisha adui, mtesi, au mpinzani. ‘Adui’ ni neno la kawaida, fupi, na linalofaa lugha ya kishairi ya Zaburi; matini yenyewe haibainishi hapa kama ni mtu mmoja, kundi, au hali ya uadui.
theological_decisions:
- issue: Nguvu ya kisitiari ya ‘mkono wake’
  choice: Kuhifadhi sitiari katika matini kuu kama ‘mkono wake.’
  alternative: ‘nguvu zake’ au ‘matendo ya mkono wake’
  rationale: Kiebrania kinatumia taswira halisi ya mkono kama ishara ya nguvu na utendaji. Sitiari hiyo inaeleweka kwa Kiswahili na kuibakiza huepuka kufafanua matini kupita kiasi.
- issue: Maana ya פדה katika muktadha wa kutoka Misri
  choice: Kutafsiri ‘alipowakomboa.’
  alternative: ‘alipowaokoa’ au ‘alipowatoa kwa fidia’
  rationale: ‘Kukomboa’ huhifadhi maana ya kuwaondoa kutoka katika mamlaka, ukandamizaji, au hatari, pamoja na mwangwi wa tendo la Mungu la kuwaokoa Israeli, bila kulazimisha maelezo kuhusu fidia ambayo mstari huu hautaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio ni wa asili kwa Kiswahili huku taswira ya Kiebrania ya ‘mkono’ na nguvu ya ukombozi ya פדה zikihifadhiwa.
