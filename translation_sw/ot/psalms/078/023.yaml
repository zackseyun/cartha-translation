base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/023.yaml
  text: Yet he commanded the clouds above[b][a], and opened the doors of heaven.
translation:
  language: sw
  text: 'Lakini aliyaamuru mawingu yaliyo juu[a],

    na akafungua milango ya mbinguni[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anga zilizo juu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “malango ya mbinguni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: aliyaamuru
  rationale: Kitenzi צוה humaanisha kuamuru au kutoa agizo. Umbo la wakati uliopita linaendeleza simulizi, na kiambishi cha yambwa kinaonyesha kwamba mawingu ndiyo yaliyoamriwa.
- source_word: שְׁחָקִים
  choice: mawingu
  rationale: שׁחקים inaweza kumaanisha mawingu au anga. Katika muktadha wa kufunguliwa kwa mbingu na kutolewa kwa mana, “mawingu” ni taswira halisi na ya kawaida katika Kiswahili.
- source_word: מִמָּעַל
  choice: yaliyo juu
  rationale: Neno hili huonyesha mahali pa juu. “Mawingu yaliyo juu” ni Kiswahili cha kawaida na huhifadhi maana ya mahali bila kudokeza kwamba Mungu ndiye aliyekuwa juu alipotoa amri.
- source_word: דַלְתֵי
  choice: milango ya
  rationale: דלת kwa kawaida ni mlango. Wingi wa muundo tegemezi umetafsiriwa “milango ya,” huku taswira ya sehemu zinazofunguliwa ikihifadhiwa.
- source_word: שָׁמַיִם
  choice: mbinguni
  rationale: שמים inaweza kumaanisha mbingu au anga. Katika usemi huu wa kishairi, “milango ya mbinguni” ni wa asili na wenye hadhi katika Kiswahili.
- source_word: פָּתָח
  choice: akafungua
  rationale: פתח humaanisha kufungua. “Akafungua” huhifadhi maana rahisi ya kitenzi na mwendelezo wa tukio bila kuongeza nguvu isiyokuwamo katika Kiebrania.
- source_word: וַ
  choice: Lakini … na
  rationale: Kiunganishi cha kwanza kimeonyeshwa kwa “Lakini” ili kuleta tofauti ya kimuktadha kati ya kutokuamini kwa Israeli na tendo la Mungu. Kiunganishi cha pili ni “na,” kinachoendeleza tendo sambamba.
theological_decisions:
- issue: Nguvu ya kiunganishi cha kwanza katika muktadha wa kutokuamini kwa Israeli na utoaji wa Mungu
  choice: Lakini
  alternative: Na; Kisha
  rationale: Kiunganishi cha Kiebrania kina matumizi mapana, lakini muktadha unalinganisha kutokuamini kwa watu na tendo la Mungu la kuwapa chakula. “Lakini” huonyesha mvutano huo wa kifungu bila kuongeza fundisho lisilosemwa wazi.
- issue: Taswira ya milango ya mbinguni
  choice: Kuhifadhi taswira halisi ya “milango”
  alternative: Malango ya mbinguni; njia za mbinguni
  rationale: Kiebrania kinatumia taswira ya sehemu za mbingu zinazofunguliwa. Tafsiri haifanyi taswira hiyo kuwa maelezo ya kisayansi wala kuibadili kuwa kauli isiyo ya mfano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa mistari miwili unaakisi usambamba wa kishairi wa Kiebrania. “Mbinguni” limetumiwa katika usemi wa kawaida “milango ya mbinguni,” na mbadala wa “malango” umewekwa katika tanbihi.
