base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/072.yaml
  text: So he shepherded them with integrity of heart[b][a], and guided them with the skill of his hands.
translation:
  language: sw
  text: Basi akawachunga kwa unyofu wa moyo wake,[a] na akawaongoza kwa ustadi wa mikono yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na unyofu wa moyo wake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa ufahamu wa mikono yake,” yaani, kwa utambuzi wenye ustadi katika uongozi wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְעֵם
  choice: akawachunga
  rationale: Kitenzi רעה kinadumisha picha ya Daudi kama mchungaji-mfalme; “kuwachunga” ni cha kawaida na kinaeleweka katika Kiswahili.
- source_word: כְּתֹם לְבָבוֹ
  choice: kwa unyofu wa moyo wake
  rationale: תֹם hubeba maana ya ukamilifu wa kimaadili, uadilifu, au kutokuwa na hila. “Unyofu wa moyo” ni usemi wa asili unaohifadhi maana ya tabia ya ndani, huku “kwa” ikiweza kueleweka kama namna au kipimo.
- source_word: לְבָבוֹ
  choice: moyo wake
  rationale: “Moyo” huhifadhi sitiari ya Kiebrania ya utu wa ndani, ikijumuisha nia na uamuzi.
- source_word: וּבִתְבוּנוֹת
  choice: kwa ustadi
  rationale: תְּבוּנוֹת ni wingi unaoweza kumaanisha ufahamu au utambuzi. Ikiunganishwa na mikono, inaelekea kuonyesha uwezo wa vitendo; “ustadi” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: כַּפָּיו
  choice: wa mikono yake
  rationale: Tafsiri hii inadumisha picha halisi ya mikono kama ishara ya uwezo wa kutenda.
- source_word: יַנְחֵם
  choice: akawaongoza
  rationale: Hifili ya נחה humaanisha kuongoza au kuelekeza; “akawaongoza” inafaa muktadha wa uongozi wa kichungaji.
theological_decisions:
- issue: Picha ya kifalme ya Daudi kama mchungaji
  choice: Kudumisha wazi lugha ya kuchunga
  alternative: Kutumia usemi wa jumla kama “akawatunza” au “akawaongoza” pekee
  rationale: Aya inahitimisha maelezo ya Daudi aliyechaguliwa kuwa mchungaji wa watu. “Akawachunga” huhifadhi picha ya kifalme na kichungaji bila kuingiza madai ya baadaye yasiyotajwa wazi hapa.
- issue: Uhusiano wa כְּ na תֹם לְבָבוֹ
  choice: Kutafsiri “kwa unyofu wa moyo wake”
  alternative: “Kulingana na unyofu wa moyo wake”
  rationale: Kihusishi kinaweza kuonyesha namna au kipimo. Tafsiri kuu ni ya asili katika Kiswahili, na tanbihi huhifadhi uwezekano wa maana ya “kulingana na.”
- issue: Maana ya תְּבוּנוֹת pamoja na “mikono”
  choice: “ustadi wa mikono yake”
  alternative: “ufahamu wa mikono yake” au “utambuzi wa mikono yake”
  rationale: Neno lenyewe linahusu ufahamu au utambuzi, lakini muungano wake na mikono unaashiria uwezo wenye utambuzi katika utendaji. Tanbihi inadumisha usemi ulio karibu zaidi na muundo wa chanzo.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi ni mfupi na sawia: “akawachunga … akawaongoza.” “Basi” linaonyesha hitimisho la simulizi la zaburi bila kufanya sentensi kuwa nzito.'
