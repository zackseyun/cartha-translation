  yaml_path: translation/ot/psalms/078/037.yaml
  text: Their heart was not steadfast with him[b][a], and they were not faithful to his covenant.
translation:
  language: sw
  text: Mioyo yao haikuwa thabiti kwake, wala hawakuwa waaminifu kwa agano lake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבָּם
  choice: Mioyo yao
  rationale: Ingawa Kiebrania kina nomino ya umoja yenye kiambishi cha wingi, Kiswahili cha kawaida hutumia wingi “mioyo yao” kwa hali ya ndani ya watu wengi; maana ya pamoja ya Israeli bado inabaki.
- source_word: נָכוֹן
  choice: thabiti
  rationale: Katika muktadha huu neno linaonyesha uthabiti na kutoyumba kwa nia yao kwa Mungu, si usahihi wa kiakili tu.
- source_word: עִמּוֹ
  choice: kwake
  rationale: “Kwake” ni usemi wa Kiswahili unaoeleweka kwa kawaida kwa mwelekeo na uhusiano wao na Mungu, huku ukihifadhi nguvu ya Kiebrania “pamoja naye/kwake.”
- source_word: נֶאֶמְנוּ
  choice: hawakuwa waaminifu
  rationale: Nifali ya אמן hapa ina maana ya kuwa wenye kutegemeka au waaminifu; sambamba na agano, “waaminifu” huonyesha wazi uaminifu wa kiagano.
- source_word: בִּבְרִיתוֹ
  choice: kwa agano lake
  rationale: Ingawa kihusishi cha Kiebrania kwa umbo ni “katika,” Kiswahili cha kawaida husema mtu ni mwaminifu “kwa” agano; hivyo maana ya uaminifu wa kiagano inawasilishwa bila tafsiri ngumu.
theological_decisions:
- issue: Lugha ya uaminifu kwa agano
  choice: Mstari unaeleza kukosekana kwa uthabiti wa ndani na uaminifu wa Israeli kwa agano la Mungu.
  alternative: 'Inawezekana kutafsiri kwa namna ya karibu zaidi na umbo la maneno: “hawakuthibitika katika agano lake.”'
  rationale: Usambamba kati ya moyo usio thabiti na kushindwa kuhusu agano unaelekeza kwenye uaminifu wa kimahusiano na kimaadili, bila kuingiza wazo finyu la kukosa imani ya kiakili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Wala” inadumisha usambamba wa kishairi wa vipashio viwili hasi.
