translation:
  language: sw
  text: Aliwakabidhi wanyama wao kwa mvua ya mawe, na mifugo yao kwa miale ya moto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “radi”; neno la Kiebrania linaweza kumaanisha miale ya umeme, mishale ya moto, au miali ya moto na nguvu nyingine zenye kuwaka na kuangamiza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסְגֵּר
  choice: Aliwaacha ... wakakumbwa na
  rationale: Kitenzi סגר hapa kina maana ya kuwakabidhi au kuwaacha chini ya nguvu yenye kuangamiza. Muundo huu ni wa kawaida katika Kiswahili na unahifadhi wazo la Mungu kuwaweka wanyama chini ya mapigo hayo.
- source_word: לַבָּרָד
  choice: mvua ya mawe
  rationale: בָּרָד humaanisha mvua ya mawe; hiki ndicho kirai cha kawaida na kinachoeleweka wazi katika Kiswahili.
- source_word: בְּעִירָם
  choice: wanyama wao
  rationale: בְּעִיר inaweza kumaanisha wanyama wa kufugwa, hasa wale wa kazi. 'Wanyama wao' huhifadhi upana wake na kuitofautisha kwa kiasi na מִקְנֶה katika mstari sambamba.
- source_word: וּמִקְנֵיהֶם
  choice: na mifugo yao
  rationale: מִקְנֶה ni mifugo inayomilikiwa. 'Mifugo' ni neno la asili la Kiswahili na linadumisha usambamba wenye mwingiliano na 'wanyama wao.'
- source_word: לָרְשָׁפִים
  choice: miale ya moto
  rationale: רְשָׁפִים inaweza kurejelea miale au mishale iwakayo, miali ya moto, au nguvu zenye kuwaka na kuangamiza. 'Miale ya moto' huhifadhi taswira ya kitu kinachowaka au kumulika bila kufunga maana kwa umeme pekee.
