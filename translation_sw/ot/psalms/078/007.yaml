  text: וְ/יָשִׂ֥ימוּ בֵֽ/אלֹהִ֗ים כִּ֫סְלָ֥/ם וְ/לֹ֣א יִ֭שְׁכְּחוּ מַֽעַלְלֵי אֵ֑ל וּ/מִצְוֺתָ֥י/ו יִנְצֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/007.yaml
  text: so that they might set their hope in God and not forget the deeds of God[b][a], but keep his commandments.
translation:
  language: sw
  text: ili waweke tumaini lao katika Mungu[a], wasiyasahau matendo ya Mungu[b], bali wazishike amri zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tegemeo lao” au “uhakika wao.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kazi za Mungu” au “mambo aliyotenda Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשִׂימוּ
  choice: ili waweke
  rationale: Kitenzi שׂים ni ‘kuweka.’ Kwa kuwa mstari unaendeleza kusudi la yaliyotangulia, ‘ili waweke’ huonyesha kwa kawaida mtiririko huo wa kusudi.
- source_word: בֵאלֹהִים
  choice: kwa Mungu
  rationale: Kihusishi ב hapa kinaonyesha yule ambaye tumaini linaelekezwa kwake; katika Kiswahili cha kawaida husemwa ‘kuweka tumaini kwa Mungu.’
- source_word: כִּסְלָם
  choice: tumaini lao
  rationale: כֶּסֶל inaweza kumaanisha tumaini, imani, au tegemeo lenye uhakika. ‘Tumaini lao’ ni la asili katika muktadha huu huku tanbihi ikihifadhi maana mbadala.
- source_word: וְלֹא יִשְׁכְּחוּ
  choice: wasiyasahau
  rationale: 'Ni kauli hasi inayoendeleza kusudi: kwamba wasisahau. Kiambishi ‘-ya-’ kinarejelea matendo.'
- source_word: מַעַלְלֵי אֵל
  choice: matendo ya Mungu
  rationale: מַעֲלָלִים ni matendo au kazi. ‘Matendo’ ni neno wazi na la sasa; אֵל limetafsiriwa ‘Mungu’ bila kuongeza sifa isiyotajwa.
- source_word: וּמִצְוֺתָיו
  choice: bali ... amri zake
  rationale: מִצְוֹתָיו ni ‘amri zake.’ ‘Bali’ linaonyesha vizuri utofautishaji kati ya kutosahau na kuzishika, ambao umebebwa na ו katika muktadha.
- source_word: יִנְצֹרוּ
  choice: wazishike
  rationale: נצר ni kulinda, kutunza, au kushika. Inapotumiwa kuhusu amri, ‘kuzishika’ humaanisha kuzitii kwa uangalifu na ni Kiswahili cha kawaida cha kibiblia.
theological_decisions:
- issue: Kutafsiri majina ya Mungu אֱלֹהִים na אֵל katika mishororo inayolingana
  choice: Yote yametafsiriwa ‘Mungu.’
  alternative: Kutafsiri אֵל kuwa ‘Mwenye Nguvu’ au ‘Mungu Mwenyezi.’
  rationale: Haya ni majina ya kawaida ya Mungu yaliyotumiwa katika usambamba wa kishairi. Kutafsiri yote ‘Mungu’ kunadumisha maana bila kuingiza tofauti au sifa ambayo mstari hauisisitizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo wa kusudi umehifadhiwa kwa ‘ili,’ na usambamba wa sentensi umeonyeshwa kwa vipashio vitatu vilivyounganishwa kwa uwazi.
