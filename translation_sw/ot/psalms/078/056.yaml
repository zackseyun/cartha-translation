  text: Yet they tested God Most High and rebelled[c][b][a], and they did not keep his testimonies.
translation:
  language: sw
  text: Lakini walimjaribu Mungu Aliye Juu Sana, wakamwasi, wala hawakuzishika shuhuda zake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maagizo yake” au “amri zake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַסּוּ
  choice: walimjaribu
  rationale: Kitenzi נסה humaanisha kumjaribu au kumweka mtu katika jaribu. ‘Walimjaribu’ ni Kiswahili cha kawaida na kinadumisha nguvu ya shtaka katika muktadha huu.
- source_word: וַיַּמְרוּ
  choice: wakamwasi
  rationale: Mzizi מרה unaonyesha uasi au ukaidi dhidi ya Mungu. ‘Wakamwasi’ huonyesha tendo la wazi na pia humtaja Mungu kwa kawaida kama mlengwa.
- source_word: אֱלֹהִים עֶלְיוֹן
  choice: Mungu Aliye Juu Zaidi
  rationale: Hili ni jina la cheo linalosisitiza ukuu wa Mungu; tafsiri hii ni ya asili katika Kiswahili na inadumisha vipengele vyote viwili vya Kiebrania.
- source_word: וְעֵדוֹתָיו
  choice: shuhuda zake
  rationale: עֵדוֹת hurejelea masharti ya Mungu yenye tabia ya ushuhuda katika agano. ‘Shuhuda zake’ inadumisha kwa karibu taswira ya ushuhuda, ingawa ‘maagizo yake’ pia inawezekana.
- source_word: לֹא שָׁמָרוּ
  choice: hawakuzishika
  rationale: שׁמר pamoja na maagizo au shuhuda humaanisha kuzitii au kuzifuata. ‘Kushika’ ni usemi wa kawaida wa kibiblia katika Kiswahili na unahifadhi sitiari ya Kiebrania.
- source_word: וַ
  choice: Lakini
  rationale: Ingawa waw inaendeleza simulizi, katika muktadha huu inatofautisha matendo ya Mungu yaliyotangulia na mwitikio wa watu.
theological_decisions:
- issue: Jina la cheo אֱלֹהִים עֶלְיוֹן
  choice: Mungu Aliye Juu Zaidi
  alternative: Mungu Mkuu; Mungu, Aliye Juu Zaidi
  rationale: Tafsiri iliyochaguliwa inasisitiza ukuu wa Mungu bila kuongeza wazo la kimadhehebu lisilokuwamo katika Kiebrania.
- issue: Maana ya kisheria na ya kiagano ya עֵדוֹתָיו
  choice: shuhuda zake
  alternative: maagizo yake; sheria zake
  rationale: ‘Shuhuda’ inadumisha uhusiano wa neno la Kiebrania na ushuhuda wa agano; tanbihi inatoa neno la kawaida zaidi bila kufuta mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo ‘walimjaribu ... wakamwasi’ huepuka kulazimisha kihusishi kimoja kutawala vitenzi vyote viwili.
