  text: He rained meat on them like dust[b][a], and winged birds like the sand of the seas.
translation:
  language: sw
  text: 'Akawanyeshea nyama kama mavumbi,

    na ndege wenye mabawa, kama mchanga wa bahari.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mchanga wa bahari”; neno “bahari” ni katika wingi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְטֵר
  choice: Akawanyeshea
  rationale: Hifili ya מטר ina maana ya kusababisha kitu kinyeshe au kukimwaga kama mvua. ‘Akawanyeshea’ ni Kiswahili cha asili kinachohifadhi picha ya mvua na pia kinajumuisha עֲלֵיהֶם, ‘juu yao.’
- source_word: כֶּעָפָר
  choice: kama mavumbi
  rationale: Kiambishi כְּ kinaonyesha ulinganisho. ‘Mavumbi’ ni usemi wa kawaida wa Kiswahili na hapa yanaonyesha wingi mkubwa.
- source_word: שְׁאֵר
  choice: nyama
  rationale: Neno hili la Kiebrania linaweza kumaanisha mwili au nyama ya kuliwa. Katika muktadha wa chakula walichopewa jangwani, ‘nyama’ ndiyo maana ya kawaida na iliyo wazi zaidi kwa msomaji wa Kiswahili.
- source_word: וּכְחוֹל יַמִּים
  choice: kama mchanga wa bahari
  rationale: Kirai cha Kiebrania kina wingi ‘bahari,’ lakini Kiswahili cha kawaida hutumia ‘mchanga wa bahari’ kama taswira ya wingi usiohesabika. Tanbihi inadumisha umbo halisi la chanzo.
- source_word: עוֹף כָּנָף
  choice: ndege wenye mabawa
  rationale: Kirai hiki kihalisi ni ‘ndege wa bawa.’ ‘Ndege wenye mabawa’ huhifadhi msisitizo wa mabawa kwa lugha ya sasa na inayoeleweka.
theological_decisions: []
translation_notes:
  register: Lugha ni ya sasa, yenye heshima na rahisi kueleweka katika Kiswahili Sanifu cha Afrika Mashariki. Mpangilio wa mistari miwili unahifadhi usambamba wa kishairi. ‘Akawanyeshea’ huleta kwa ufupi maana ya kitendo na walengwa wake; ‘nyama’ huepuka utata usio wa lazima katika muktadha huu, huku umbo la wingi katika יַמִּים likielezwa kwa tanbihi.
