  yaml_path: translation/ot/psalms/078/071.yaml
  text: from following the nursing ewes he brought him[a], to shepherd Jacob his people[b], and Israel his inheritance.
translation:
  language: sw
  text: kutoka kuwafuata kondoo-jike wanaonyonyesha,[a] alimleta ili awachunge Yakobo, watu wake, na Israeli, urithi wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka nyuma ya kondoo-jike wenye watoto.”
    reason: lexical_alternative
  - marker: b
    text: “Urithi” pia inaweza kutafsiriwa “milki” au “mali yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַחַר
  choice: kutoka nyuma ya
  rationale: Kirai hiki hudokeza mahali pa mchungaji nyuma ya kundi na pia tendo la kulifuata; Kiswahili hiki kinahifadhi picha hiyo ya kichungaji bila kuibadili kuwa ‘kutunza.’
- source_word: עָלוֹת
  choice: kondoo-jike wanaonyonyesha
  rationale: Neno hili linawarejelea kondoo-jike wanaonyonyesha watoto wao. Tafsiri hii ni wazi kwa msomaji wa sasa na huhifadhi umahususi wa mazingira ya ufugaji.
- source_word: הֱבִיאוֹ
  choice: alimleta
  rationale: Hifili ya בוא humaanisha kwa kawaida ‘kuleta.’ Mungu ndiye mtendaji anayeendelea kudokezwa kutoka muktadha uliotangulia, na Daudi ndiye anayeletwa.
- source_word: לִרְעוֹת
  choice: ili amchunge
  rationale: רעה inaweza kumaanisha kulisha, kuchunga, au kufanya kazi ya mchungaji. ‘Amchunge’ huhifadhi sitiari inayounganisha kazi ya Daudi kwa kondoo na jukumu lake kwa watu.
- source_word: בְּיַעֲקֹב עַמּוֹ
  choice: Yakobo, watu wake
  rationale: 'Muundo huu unaonyesha uhusiano wa ufafanuzi: Yakobo ndiye watu wa Mungu. Koma huufanya uhusiano huo uwe wazi katika Kiswahili cha kawaida.'
- source_word: וּבְיִשְׂרָאֵל נַחֲלָתוֹ
  choice: na Israeli, urithi wake
  rationale: נחלה huweza kuwa urithi, milki, au mali ya kurithi. ‘Urithi’ ni linganishi rasmi na huhifadhi mwangwi wa agano bila kuufafanua kupita kiasi.
theological_decisions:
- issue: Sitiari ya kifalme na kichungaji kuhusu wito wa Daudi
  choice: 'Kuhifadhi wazi lugha ya kuchunga: ‘ili amchunge Yakobo.’'
  alternative: ‘ili amwongoze Yakobo’ au ‘ili awatunze watu wake.’
  rationale: Mstari huu unaunganisha kwa makusudi kazi halisi ya Daudi miongoni mwa kondoo na jukumu lake baadaye kwa Israeli. ‘Kuchunga’ huhifadhi uhusiano huo wa kifasihi na kiteolojia bila kuingiza fundisho la ziada.
- issue: Umoja wa kisarufi katika לִרְעוֹת בְּיַעֲקֹב
  choice: ‘amchunge Yakobo, watu wake’
  alternative: ‘awachunge watu wake, Yakobo’
  rationale: Yakobo ni jina la pamoja linalowakilisha taifa, kwa hiyo umbo la umoja linaweza kuhifadhiwa kwa njia ya asili katika Kiswahili huku kirai ‘watu wake’ kikibainisha maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa vifungu unahifadhi usambamba wa Kiebrania; ‘kondoo-jike wanaonyonyesha’ ni sahihi kimuktadha, na ‘amchunge’ huhifadhi sitiari kuu.
