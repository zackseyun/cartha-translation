  text: How often they rebelled against him in the wilderness and grieved him in the wasteland![a][b]
translation:
  language: sw
  text: 'Ni mara ngapi walimwasi jangwani[a],

    na kumhuzunisha nyikani![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Walimmwasi mara ngapi jangwani!” Usemi wa mwanzo unaweza kusisitiza matendo ya uasi yaliyorudiwa-rudiwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “na kumuumiza” au “na kumtia uchungu” nyikani.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: Ni mara ngapi
  rationale: Katika usemi huu wa mshangao au swali la balagha, neno linaonyesha kurudiwa mara nyingi kwa uasi, si kuuliza hesabu halisi.
- source_word: יַמְרוּהוּ
  choice: walimwasi
  rationale: Kitenzi מרה hapa kina maana ya kumwasi au kumkaidi Mungu; “walimwasi” ni wazi, fasaha, na huhifadhi kiambishi cha yambwa kinachomrejelea Mungu.
- source_word: בַמִּדְבָּר
  choice: jangwani
  rationale: “Jangwani” ni neno la kawaida la Kiswahili kwa eneo la nyika ambako Israeli walizunguka, bila kulifanya lazima liwe jangwa la mchanga.
- source_word: יַעֲצִיבוּהוּ
  choice: kumhuzunisha
  rationale: Kitenzi עצב katika kausativi kinaweza kumaanisha kusababisha huzuni, maumivu, au masumbuko; “kumhuzunisha” huhifadhi nguvu yake ya kihusiano na kihisia.
- source_word: בִּישִׁימוֹן
  choice: nyikani
  rationale: יְשִׁימוֹן hueleza eneo kame na ukiwa. “Nyikani” hutofautisha neno hili na מִדְבָּר huku ikihifadhi usambamba wa kishairi.
theological_decisions:
- issue: Lugha inayomhusisha Mungu na huzuni katika יַעֲצִיבוּהוּ
  choice: Kuhifadhi usemi binafsi wa kihisia “kumhuzunisha” katika matini kuu.
  alternative: “kumuumiza” au “kumsumbua”
  rationale: Kiebrania kinaonyesha kwamba matendo ya Israeli yalimletea Mungu huzuni ya kweli ya kihusiano. Tafsiri haipaswi kuondoa mvutano huo kwa kutumia usemi usio wa kihisia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa mistari unahifadhi usambamba wa kishairi; “jangwani” na “nyikani” zinawakilisha maneno mawili yanayohusiana lakini tofauti katika Kiebrania.
