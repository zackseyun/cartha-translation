  terminology: “Mito yao,” “damu,” na “maji yao yanayotiririka” ni chaguo zinazofaa. Tanbihi ya Nile ni yenye msaada; tanbihi ya pili irejeleze mbadala wa kweli badala ya kurudia kimsingi maneno ya tafsiri.
