  text: He turned their rivers to blood[a], and their flowing streams[c][b], so that they could not drink.
translation:
  language: sw
  text: 'Aliigeuza mito yao[a] kuwa damu,

    na hawakuweza kunywa maji yao yanayotiririka[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mifereji yao ya Nile.” Neno la Kiebrania mara nyingi humaanisha Mto Nile au mifereji yake linapotumiwa kuhusu Misri.
    reason: lexical_alternative
  - marker: b
    text: Au “vijito vyao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: Aliigeuza
  rationale: Kitenzi הפך kinaeleza kugeuza au kubadili kitu kiwe katika hali nyingine. “Aliigeuza” ni ya kawaida katika Kiswahili na inaendana na nomino ya umoja ya mkusanyiko “mito.”
- source_word: לְדָם
  choice: kuwa damu
  rationale: Herufi ל hapa inaonyesha hali iliyotokea baada ya mabadiliko; Kiswahili cha kawaida husema “kugeuza ... kuwa damu.”
- source_word: יְאֹרֵיהֶם
  choice: mito yao
  rationale: Katika mazingira ya Misri, יְאֹר mara nyingi humaanisha Nile au mifereji yake. “Mito yao” ni wazi kwa msomaji wa kawaida, huku tanbihi ikihifadhi maana mahususi inayowezekana.
- source_word: וְנֹזְלֵיהֶם
  choice: na maji yao yanayotiririka
  rationale: Neno hili linatokana na mzizi נזל, “kutiririka,” na linaweza kumaanisha maji au vijito vinavyotiririka. Tafsiri hii inahifadhi picha ya mtiririko bila kudai aina moja tu ya mkondo wa maji.
- source_word: בַּל יִשְׁתָּיוּן
  choice: wasiweze kuyanywa
  rationale: Chembe ya kishairi בַּל inakanusha tendo, na katika muktadha huu kauli inaonyesha matokeo au kutowezekana kwa kunywa maji hayo. Kiwakilishi “-ya-” kinarejelea “maji” yaliyotangulizwa kama shamirisho.
