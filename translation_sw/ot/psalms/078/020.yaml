base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/020.yaml
  text: Look[a], he struck the rock, and waters gushed out, and streams overflowed. Can he also give bread, or provide meat for his people?
translation:
  language: sw
  text: Tazama, aliupiga mwamba, maji yakabubujika, na mito ikafurika. Je, anaweza pia kutoa mkate, au kuwaandalia watu wake nyama[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwili”; neno la Kiebrania humaanisha mwili kihalisi, lakini hapa yaelekea linamaanisha nyama ya kuliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Linahifadhi wito wa kusisitiza jambo lililo wazi kwa lugha ya sasa yenye hadhi.
- source_word: הִכָּה צוּר
  choice: aliupiga mwamba
  rationale: Kitenzi kinaonyesha tendo la nguvu, na mwamba unarejelea tukio mahususi la jangwani.
- source_word: וַיָּז֣וּבוּ מַיִם
  choice: maji yakabubujika
  rationale: ‘Kububujika’ linaonyesha maji kutoka kwa wingi na kwa nguvu bila kuongeza maelezo yasiyomo.
- source_word: וּנְחָלִים יִשְׁטֹפוּ
  choice: na vijito vikafurika
  rationale: Linadumisha picha ya mikondo mingi ya maji inayofurika; ‘vijito’ ni neno la kawaida na la kueleweka.
- source_word: הֲגַם לֶחֶם יוּכַל תֵּת
  choice: Je, anaweza pia kutoa mkate
  rationale: Muundo wa swali na ‘pia’ vinahifadhi kejeli ya mashaka ya watu pamoja na neno halisi ‘mkate.’
- source_word: אִם יָכִין
  choice: au kuwaandalia
  rationale: אִם hapa inaunganisha sehemu ya pili ya swali kwa maana ya ‘au’; Hifili ya כון katika muktadha huu ni kuandaa au kutoa mahitaji.
- source_word: שְׁאֵר
  choice: nyama
  rationale: Neno humaanisha kihalisi mwili, lakini hapa linarejelea nyama ya kuliwa; ‘nyama’ ni Kiswahili cha kawaida na kisichopotosha.
- source_word: לְעַמּוֹ
  choice: watu wake
  rationale: Linarejelea Israeli kama watu wa Mungu katika simulizi la agano na historia.
theological_decisions:
- issue: Nguvu ya maswali ya mashaka ya Israeli
  choice: Kutafsiri vifungu vya mwisho kama swali la mashaka kuhusu uwezo wa Mungu kutoa chakula baada ya kutoa maji
  alternative: Kuvitafsiri kama kauli tambarare au kupunguza nguvu ya swali
  rationale: Kiambishi cha kuuliza הֲ pamoja na muktadha wa kutomwamini Mungu kinaunga mkono swali la balagha; tafsiri hii inadumisha mvutano bila kueleza jibu ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa msomaji wa leo huku picha za kishairi, msisitizo, na maswali ya balagha ya Kiebrania vikihifadhiwa.
