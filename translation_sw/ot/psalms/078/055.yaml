  text: וַ/יְגָ֤רֶשׁ מִ/פְּנֵי/הֶ֨ם גּוֹיִ֗ם וַֽ֭/יַּפִּילֵ/ם בְּ/חֶ֣בֶל נַחֲלָ֑ה וַ/יַּשְׁכֵּ֥ן בְּ֝/אָהֳלֵי/הֶ֗ם שִׁבְטֵ֥י יִשְׂרָאֵֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/055.yaml
  text: He drove out nations before them and allotted them an inheritance by measuring line[b][a]; he settled the tribes of Israel in their tents.
translation:
  language: sw
  text: Akafukuza mataifa kutoka mbele yao, akawagawia urithi kwa kamba ya kupimia[a]; akayakalisha makabila ya Israeli katika mahema yao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawapangia urithi kwa kamba ya kupimia.” Nahau ya Kiebrania inaunganisha wazo la kugawa urithi na la kupima sehemu za ardhi.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika makao yao”; kwa neno halisi, “katika mahema yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: aliyafukuza
  rationale: Kitenzi גרש kina maana ya kufukuza au kuondoa kwa nguvu; “aliyafukuza” ni Kiswahili cha kawaida kinachohifadhi nguvu ya tendo hilo.
- source_word: מִפְּנֵיהֶם
  choice: mbele yao
  rationale: Huhifadhi taswira ya mataifa kuondolewa mbele ya Waisraeli bila kuongeza maelezo yasiyokuwamo katika maandishi.
- source_word: גּוֹיִם
  choice: mataifa
  rationale: Katika muktadha huu neno hilo linamaanisha mataifa yasiyo ya Israeli yaliyokaa Kanaani.
- source_word: וַיַּפִּילֵם
  choice: akawagawia
  rationale: Ingawa נפל kwa kawaida ni “kuanguka,” katika muktadha wa kugawa urithi hueleza sehemu inayomwangukia mtu kwa mgao; “akawagawia” huwasilisha nahau hiyo kwa Kiswahili cha asili.
- source_word: בְּחֶבֶל
  choice: kwa kamba ya kupimia
  rationale: חבל ni kamba, hasa kamba inayoweza kutumiwa kupima na kugawa ardhi; tafsiri hii inadumisha taswira halisi.
- source_word: נַחֲלָה
  choice: urithi
  rationale: נחלה ni milki ya kurithi, hasa sehemu ya ardhi; “urithi” ni neno fupi na la kawaida, huku muktadha wa kamba ya kupimia ukionyesha kuwa ardhi inahusika.
- source_word: וַיַּשְׁכֵּן
  choice: akayakalisha
  rationale: Hifili ya שכן ni ya kusababisha kukaa; “akayakalisha” huhifadhi maana hiyo ya Mungu kuyaweka makabila mahali pa kuishi.
- source_word: בְּאָהֳלֵיהֶם
  choice: katika mahema ya mataifa hayo
  rationale: אהל ni “hema.” Kutaja mataifa hayo kunabainisha rejeo la kiwakilishi cha Kiebrania na kuzuia Kiswahili kisieleweke kimakosa kuwa mahema yalikuwa tayari ya makabila ya Israeli.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: makabila ya Israeli
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida, na yenye hadhi ya muundo huu wa Kiebrania.
theological_decisions:
- issue: Mtendaji katika kufukuzwa kwa mataifa na kugawiwa kwa nchi
  choice: Mungu ndiye mtendaji wa vitenzi vyote katika aya.
  alternative: Kuacha mtendaji bila kutambulika au kuyahusisha matendo hayo moja kwa moja na Israeli.
  rationale: Muktadha wa Zaburi unahesabu matendo ya Mungu kwa ajili ya Israeli; umbo la umoja la vitenzi linaendeleza mtendaji huyo bila kuongeza dai jingine la kitheolojia.
- issue: Rejeo la “mahema yao”
  choice: Mahema yanaelezwa kuwa ya mataifa yaliyofukuzwa.
  alternative: 'Kudumisha kiwakilishi kisichobainishwa: “katika mahema yao.”'
  rationale: Katika Kiebrania, kiwakilishi kinatangulia “makabila ya Israeli” na rejeo lake la kawaida ni mataifa yaliyotajwa; Kiswahili chenye “yao” baada ya “makabila ya Israeli” kingeelekea kutoa maana tofauti. Tanbihi inahifadhi muundo halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa kwa mfululizo wa vitenzi “aliyafukuza … akawagawia … akayakalisha,” huku istilahi ya kugawa ardhi kwa kamba ikibaki wazi kwa msomaji wa kawaida.
