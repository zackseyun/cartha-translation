lexical_decisions:
- source_word: יַסַּע
  choice: Aliiamsha
  rationale: Hifili ya נסע kimsingi ni ‘kusababisha iondoke/safiri’; inapohusu upepo, ‘aliiamsha’ huonyesha kwamba Mungu aliuanzisha na kuuweka katika mwendo bila kupanua maana kupita kiasi.
- source_word: קָדִים
  choice: upepo wa mashariki
  rationale: Katika muktadha huu קָדִים humaanisha upepo utokao mashariki, si mwelekeo wa mashariki tu, na inalingana kishairi na תֵימָן.
- source_word: בַּשָּׁמָיִם
  choice: mbinguni
  rationale: שָׁמַיִם ni umbo la wingi lenye kurejelea anga ambako pepo husonga; ‘mbinguni’ ni tafsiri ya Kiswahili iliyo ya kawaida, yenye hadhi na inayodumisha mtindo wa kishairi.
- source_word: וַיְנַהֵג
  choice: akauongoza
  rationale: נהג inaweza kumaanisha kuongoza au kuendesha. ‘Akauongoza’ huonyesha mwelekeo wa upepo chini ya tendo la Mungu na inadumisha ulinganifu wa vitenzi.
- source_word: בְּעֻזּוֹ
  choice: kwa nguvu zake
  rationale: עֹז humaanisha nguvu, uwezo au uweza; ‘kwa nguvu zake’ huwasilisha kwa uwazi njia ambayo tendo hilo lilitekelezwa.
- source_word: תֵימָן
  choice: upepo wa kusini
  rationale: Neno hili kimsingi ni ‘kusini’ au eneo la kusini, lakini ulinganifu wake na ‘upepo wa mashariki’ na muktadha wa pepo unaunga mkono kukamilisha maana kuwa ‘upepo wa kusini.’
theological_decisions:
- issue: Utendaji wa Mungu juu ya nguvu za asili
  choice: Vitenzi vimetafsiriwa vikimwonyesha Mungu akiuamsha na kuuongoza upepo.
  alternative: Kutumia usemi usioonyesha mtendaji moja kwa moja, kana kwamba pepo zilitokea zenyewe.
  rationale: Katika Kiebrania Mungu ndiye kiima cha vitenzi vyote viwili. Tafsiri inadumisha utendaji huo bila kuongeza dai la kitheolojia lisilokuwamo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na ya kishairi kwa kiasi. Viambishi vya ngeli katika ‘aliiamsha’ na ‘akauongoza’ vinarejelea ‘upepo.’ Alama zote za tanbihi zimewekwa katika matini kuu.
