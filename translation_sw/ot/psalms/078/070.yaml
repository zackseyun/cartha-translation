  yaml_path: translation/ot/psalms/078/070.yaml
  text: He chose David his servant and took him from the sheepfolds[a].
translation:
  language: sw
  text: 'Alimchagua Daudi, mtumishi wake,

    na akamchukua kutoka mazizi ya kondoo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka katika mazizi ya mifugo” au “kutoka katika maeneo yaliyofungwa kwa ajili ya mifugo.”
    reason: Neno צֹאן linaweza kumaanisha mifugo midogo, yaani kondoo na mbuzi, na מִכְלְאֹת ni sehemu zilizofungwa za kuwahifadhi.
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: Alimchagua
  rationale: Kitenzi cha Kiebrania בחר kinamaanisha ‘kuchagua.’ Umbo la wakati wa masimulizi limetafsiriwa kwa wakati uliopita bila kulazimisha kiunganishi ‘na’ mwanzoni mwa aya.
- source_word: בְּדָוִד
  choice: Daudi
  rationale: Jina la mtu limetolewa kwa umbo lake lililozoeleka katika Kiswahili cha Biblia.
- source_word: עַבְדּוֹ
  choice: mtumishi wake
  rationale: עבד inaweza kumaanisha mtumishi au mtumwa. Hapa ni cheo cha heshima kinachoeleza uhusiano na huduma ya Daudi kwa Mungu, si msisitizo wa hali ya utumwa.
- source_word: וַיִּקָּחֵהוּ
  choice: na akamtoa
  rationale: לקח kimsingi ni ‘kuchukua.’ Katika muktadha wa kumwondoa Daudi mahali alipokuwa akichunga ili apewe jukumu jingine, ‘akamtoa’ ni Kiswahili cha asili kinachohifadhi wazo la kumchukua kutoka huko.
- source_word: מִמִּכְלְאֹת צֹאן
  choice: katika mazizi ya kondoo
  rationale: מִכְלְאֹת ni maeneo yaliyofungwa kwa ajili ya wanyama, na צאן ni mifugo midogo, hasa kondoo na mbuzi. ‘Mazizi ya kondoo’ ni usemi wa kawaida wa Kiswahili katika mazingira haya, huku tanbihi ikihifadhi upana wa maana.
theological_decisions:
- issue: Hadhi ya Daudi kama עבד wa Mungu
  choice: mtumishi wake
  alternative: mtumwa wake
  rationale: Muktadha unamtaja Daudi kwa heshima kama mtu anayemilikiwa na kumtumikia Mungu, bila kuweka mbele hali ya utumwa wa kulazimishwa. ‘Mtumishi’ huhifadhi maana hiyo bila kuingiza fundisho la dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa wasomaji wa kawaida. Mpangilio wa mistari unafuata usambamba wa kishairi wa aya.
