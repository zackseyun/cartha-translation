  text: Kisha akawatoa watu wake kama kondoo, akawaongoza kama kundi jangwani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסַּע
  choice: akawaongoza
  rationale: Kitenzi cha Kiebrania katika muundo wa kusababisha kinaonyesha Mungu aliwafanya watu wake waondoke na kusafiri. “Akawaongoza” ni Kiswahili cha kawaida kinachohifadhi wazo la kuwaongoza waende bila ukali wa “akawafukuza.”
- source_word: כַּצֹּאן
  choice: kama kondoo
  rationale: צאן humaanisha mifugo midogo, hasa kondoo na mbuzi; katika taswira hii ya kichungaji, “kondoo” ni chaguo la kawaida na linalopatana na mstari unaofuata.
- source_word: עַמּוֹ
  choice: watu wake
  rationale: עם hapa ni watu wa Mungu kama jamii au taifa; “watu wake” ni tafsiri ya moja kwa moja na ya asili.
- source_word: וַיְנַהֲגֵם
  choice: akawaelekeza
  rationale: נהג inaweza kumaanisha kuongoza, kuelekeza, au kuswaga. “Akawaelekeza” hudumisha wazo la mwongozo wa mchungaji huku ikiepuka kurudia “akawaongoza.”
- source_word: כָּעֵדֶר
  choice: kama kundi
  rationale: עדר ni kundi la mifugo. Kwa kuwa kondoo wametajwa tayari, “kundi” hudumisha taswira hiyo kwa Kiswahili cha kawaida.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: מִדְבָּר ni eneo lisilokaliwa au nyika, si lazima jangwa la mchanga pekee. “Jangwani” ni usemi wa kibiblia unaoeleweka vizuri katika muktadha wa safari kutoka Misri.
theological_decisions:
- issue: Taswira ya Mungu kama mchungaji wa Israeli wakati wa kutoka Misri
  choice: 'Taswira imehifadhiwa moja kwa moja: Mungu anawaongoza watu wake kama kondoo na kuwaelekeza kama kundi.'
  alternative: Kufafanua wazi kuwa Mungu ndiye mchungaji wao.
  rationale: Maandishi yanatumia tashbihi za kichungaji bila kumwita Mungu “mchungaji” moja kwa moja katika mstari huu; tafsiri inahifadhi taswira bila kuongeza ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa vishazi viwili na urudiaji wa taswira ya kondoo/kundi umehifadhiwa. Hakuna tanbihi zinazohitajika.
