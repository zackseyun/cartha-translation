  yaml_path: translation/ot/psalms/078/025.yaml
  text: Man ate the bread of the mighty[a]; he sent them provisions to the full.
translation:
  language: sw
  text: Mwanadamu alikula mkate wa wenye nguvu[a]; aliwapelekea chakula cha kutosha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkate wa malaika.” Kiebrania, kwa maana ya moja kwa moja zaidi, husema “mkate wa wenye nguvu” au “wa watu wenye nguvu.”
    reason: alternative_reading
lexical_decisions:
- source_word: לֶחֶם
  choice: mkate
  rationale: Huhifadhi taswira halisi ya neno la Kiebrania na inafaa kwa mtindo wa kishairi.
- source_word: אַבִּירִים
  choice: wenye nguvu
  rationale: Maana ya moja kwa moja ni wenye nguvu au mashujaa; tafsiri ya ‘malaika’ ni ufafanuzi wa kimapokeo unaofaa kuwekwa katika tanbihi.
- source_word: אָכַל
  choice: alikula
  rationale: Kauli timilifu inawasilishwa kwa wakati uliopita kulingana na simulizi la zaburi.
- source_word: אִישׁ
  choice: mwanadamu
  rationale: Umoja huu una maana wakilishi ya binadamu; ‘mwanadamu’ ni Kiswahili cha kawaida na huhifadhi tofauti kati ya binadamu na ‘wenye nguvu.’
- source_word: צֵידָה
  choice: chakula
  rationale: Katika muktadha huu neno linamaanisha chakula kilichotolewa kama mahitaji; ‘chakula’ ni cha kawaida na wazi kuliko ‘masurufu,’ ambalo mara nyingi hudokeza safari.
- source_word: שָׁלַח
  choice: aliwapelekea
  rationale: Huwasilisha kitendo cha kutuma pamoja na walengwa wake kwa Kiswahili cha kawaida.
- source_word: לָהֶם
  choice: -wa-
  rationale: Kiwakilishi cha yambwa katika ‘aliwapelekea’ kinawakilisha ‘kwao’ kwa ufasaha wa Kiswahili.
- source_word: לָשֹׂבַע
  choice: cha kuwashibisha
  rationale: Huwasilisha wazo la kutosheka au kushiba kikamilifu kwa lugha ya kawaida bila kulifanya kuwa wingi tu.
theological_decisions:
- issue: Maana ya אַבִּירִים katika kishazi ‘mkate wa wenye nguvu’
  choice: Kutafsiri kwa maana ya moja kwa moja ‘wenye nguvu’ katika matini kuu
  alternative: malaika
  rationale: Neno la Kiebrania halimaanishi ‘malaika’ bila utata. Tafsiri kuu inadumisha maana yake ya moja kwa moja, huku ufafanuzi wa kimapokeo unaohusisha mana na malaika ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mwanadamu’ lina nguvu ya uwakilishi, na sentensi ya pili imetafsiriwa kwa mtiririko wa kawaida huku ikihifadhi wazo la chakula kilichotumwa hadi wakashiba.
