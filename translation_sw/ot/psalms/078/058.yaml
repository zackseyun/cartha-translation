  text: They provoked him to anger with their high places[c][b][a], and with their carved images they made him jealous.
translation:
  language: sw
  text: Walimkasirisha kwa mahali pao pa juu[a], na kwa sanamu zao za kuchongwa wakamtia wivu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mahali pa juu” ni maeneo ya ibada ya mahali mbalimbali, ambayo mara nyingi yalihusishwa na ibada isiyo halali na kuabudu sanamu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכְעִיסוּהוּ
  choice: Walimkasirisha
  rationale: Kitenzi cha Kiebrania katika Hifili kina maana ya kusababisha hasira. “Walimkasirisha” ni Kiswahili cha kawaida kinachohifadhi nguvu hiyo ya kisababishi bila kuongeza maneno yasiyo ya lazima.
- source_word: בְּבָמוֹתָם
  choice: kwa mahali pao pa juu
  rationale: בָּמוֹת ni maeneo ya ibada yaliyoitwa “mahali pa juu,” mara nyingi yakihusishwa na ibada haramu na sanamu. “Kwa” linaonyesha njia iliyotumiwa kumkasirisha.
- source_word: וּבִפְסִילֵיהֶם
  choice: na kwa sanamu zao za kuchongwa
  rationale: פְּסִילִים ni sanamu zilizotengenezwa kwa kuchongwa. Tafsiri hii inahifadhi maana halisi ya vitu vya ibada vilivyotengenezwa, badala ya kutumia neno pana “sanamu” peke yake.
- source_word: יַקְנִיאוּהוּ
  choice: wakamfanya awe na wivu
  rationale: Hifili ya קנא hapa ina maana ya kumfanya mtu awe na wivu au kumchochea kuwa na wivu. Usemi huu unahifadhi lugha ya uhusiano wa agano na mvutano wake inapomhusu Mungu.
theological_decisions:
- issue: Lugha ya wivu wa Mungu
  choice: wakamfanya awe na wivu
  alternative: wakamchochea kuwa na wivu; wakaamsha ari yake
  rationale: Kiebrania kinatumia wazi קנא katika muktadha wa ibada ya sanamu na uaminifu wa pekee wa agano. “Wivu” umehifadhiwa badala ya kulainishwa kuwa hasira au ari pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi ni mfupi na sambamba na Kiebrania. Neno “wivu” limeachwa kwa makusudi ili kuhifadhi lugha ya agano; tanbihi moja tu imewekwa kwa istilahi ya kitamaduni ambayo huenda isiwe wazi kwa msomaji wa kawaida.
