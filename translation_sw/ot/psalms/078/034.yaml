base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/034.yaml
  text: When he killed them[a], they sought him[b]; they returned and sought God earnestly.
translation:
  language: sw
  text: Alipowaua, walimtafuta; walirudi[a] na kumtafuta Mungu kwa bidii[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waligeuka.” Katika muktadha, kitenzi hiki kinaweza kudokeza toba, lakini maana yake ya moja kwa moja ni “kurudi.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana ya moja kwa moja, “walimtafuta mapema”; hii ni nahau yenye maana ya kumtafuta kwa hamu au kwa bidii.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: alipo-
  rationale: Katika muktadha huu wa kishairi na kihistoria, אִם inaonyesha hali iliyotokea, si sharti la kudhaniwa; kiambishi cha wakati “alipo-” kinawasilisha maana ya “wakati alipowaua.”
- source_word: הֲרָגָם
  choice: aliwaua
  rationale: Kitenzi הרג humaanisha kuua. Umbo la nafsi ya tatu umoja wa kiume linamrejelea Mungu katika muktadha.
- source_word: וּדְרָשׁוּהוּ
  choice: walimtafuta
  rationale: דרש ikiwa na yambwa ya mtu humaanisha kumtafuta au kumwelekea; kiambishi “-m-” kinahifadhi yambwa ya Kiebrania.
- source_word: וְשָׁבוּ
  choice: walirudi
  rationale: שוב kimsingi humaanisha kurudi au kugeuka. “Walirudi” huhifadhi maana hiyo bila kutaja moja kwa moja toba, ingawa muktadha unaweza kuidokeza.
- source_word: וְשִׁחֲרוּ
  choice: kumtafuta ... kwa bidii
  rationale: Katika Piel, שחר inaweza kuwa nahau ya kutafuta mapema na hivyo kutafuta kwa hamu, juhudi, au bidii. Kiswahili “kwa bidii” huwasilisha nguvu ya nahau hiyo kwa uwazi.
- source_word: אֵל
  choice: Mungu
  rationale: אֵל hapa ni jina la kawaida la Mungu; “Mungu” ni tafsiri ya kawaida na ya asili bila kupanua maana.
theological_decisions:
- issue: Iwapo וְשָׁבוּ itafsiriwe kwa lugha inayotaja toba waziwazi
  choice: walirudi
  alternative: walitubu; waligeuka
  rationale: Ingawa שוב inaweza kuhusisha toba katika muktadha, maana yake ya msingi ni kurudi au kugeuka. “Walirudi” huhifadhi mvutano huo bila kuongeza dai la kitheolojia lisilotajwa wazi.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja: [a] baada ya “walirudi” na [b] baada ya “kwa bidii.”'
