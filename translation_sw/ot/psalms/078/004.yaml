base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/004.yaml
  text: We will not hide them from their children[a], telling the coming generation the praiseworthy deeds of Yahweh, and his strength[c][b], and his wonders that he has done.
translation:
  language: sw
  text: Hatutayaficha mambo haya watoto wao; tutakisimulia kizazi kijacho kuhusu matendo ya Yahwe yanayostahili sifa[a], nguvu zake, na maajabu aliyoyatenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sifa za Yahwe.” Neno la Kiebrania linaweza kumaanisha sifa anazopewa Yahwe au mambo yake yanayostahili kusifiwa; muktadha hapa unapendelea maana ya pili.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְכַחֵד
  choice: hatutawaficha
  rationale: Kitenzi cha Kiebrania katika Piel kina maana ya kuficha au kuzuia jambo lisijulikane. ‘Hatutawaficha’ ni usemi wa kawaida unaodumisha msisitizo wa kutoficha kwa makusudi.
- source_word: מִבְּנֵיהֶם
  choice: watoto wao
  rationale: בנים inaweza kumaanisha wana au watoto kwa ujumla. Katika muktadha wa kupokeza habari kutoka kizazi kimoja hadi kingine, ‘watoto’ haizuii maana kwa wanaume pekee.
- source_word: לְדוֹר אַחֲרוֹן
  choice: kizazi kijacho
  rationale: Kirai hiki kinaelekeza kwa kizazi kitakachofuata. ‘Kizazi kijacho’ ni Kiswahili cha asili na kinahifadhi mtazamo wa mbele.
- source_word: מְסַפְּרִים
  choice: tutakisimulia
  rationale: Neno hili linaonyesha kusimulia au kutangaza kwa kueleza. Muundo wa kitenzi kikuu baada ya nuktamkato ni wa asili katika Kiswahili na unaonyesha kwamba kutosita kuwaeleza wengine kunatekelezwa kwa kusimulia.
- source_word: תְּהִלּוֹת יְהוָה
  choice: matendo ya Yahwe yanayostahili sifa
  rationale: תהלות inaweza kutaja sifa zinazotolewa kwa Yahwe au mambo yake yanayostahili kusifiwa. Ulinganifu wake na nguvu na maajabu aliyoyatenda unaunga mkono maana ya matendo yanayostahili sifa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa moja kwa moja katika maandishi ya Kiebrania. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- source_word: עֱזוּזוֹ
  choice: nguvu zake
  rationale: Nomino hii humaanisha nguvu au uwezo mkubwa. ‘Nguvu zake’ ni wazi, ya kawaida, na inafaa katika orodha hii.
- source_word: נִפְלְאוֹתָיו
  choice: maajabu
  rationale: Neno hili linataja matendo ya ajabu yanayoamsha mshangao. ‘Maajabu’ ni tafsiri fupi, ya kawaida, na yenye hadhi.
- source_word: אֲשֶׁר עָשָׂה
  choice: aliyoyatenda
  rationale: Kirai hiki kinarejelea maajabu na kumtaja Yahwe kuwa mtendaji. ‘Aliyoyatenda’ hudumisha uhusiano huo kwa Kiswahili cha asili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: Yehova au BWANA
  rationale: Maandishi yana jina la agano יְהוָה, si cheo. ‘Yahwe’ huhifadhi jina hilo bila kuingiza badala ya kimapokeo.
- issue: Maana ya תְּהִלּוֹת יְהוָה
  choice: matendo ya Yahwe yanayostahili sifa
  alternative: sifa za Yahwe
  rationale: Neno lenyewe linaweza kutaja sifa zinazotolewa kwa Mungu au mambo yake yanayostahili kusifiwa. Muktadha wa ‘nguvu zake’ na ‘maajabu aliyoyatenda’ unapendelea matendo yanayosimuliwa, huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mambo hayo’ limewekwa wazi kwa sababu Kiswahili huhitaji rejeo linaloeleweka kwa yale ambayo hayatafichwa; maana hiyo inadokezwa na muktadha na kitenzi cha Kiebrania. Nuktamkato huunganisha kutoficha na tendo chanya la kusimulia bila kufanya sentensi kuwa nzito.
