  language: en
  yaml_path: translation/ot/psalms/078/010.yaml
  text: They did not keep the covenant of God[a], and they refused to walk in his law.
translation:
  language: sw
  text: 'Hawakushika agano la Mungu,

    na wakakataa kuenenda katika sheria yake.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “mafundisho yake” au “maagizo yake”: neno la Kiebrania torah linaweza kumaanisha sheria, mafundisho, au maagizo ya Mungu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרוּ
  choice: kulishika
  rationale: Katika muktadha wa agano, kitenzi שׁמר kina maana ya kushika au kutii masharti yake. “Kulishika agano” ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: בְּרִית אֱלֹהִים
  choice: agano la Mungu
  rationale: Muundo huu unaonyesha agano linalotokana na Mungu au lililo lake; “agano la Mungu” ni wa moja kwa moja na huhifadhi mtindo rasmi wa zaburi.
- source_word: וּבְתוֹרָתוֹ
  choice: katika sheria yake
  rationale: תּוֹרָה linaweza kumaanisha sheria, mafundisho, au maagizo. Hapa linahusishwa na wajibu wa agano, hivyo “sheria” huhifadhi nguvu yake ya kimamlaka; kihusishi בְּ kimetafsiriwa “katika” ili kudumisha sitiari ya mwenendo.
- source_word: מֵאֲנוּ
  choice: wakakataa
  rationale: מאן huonyesha kukataa kwa makusudi au kutokuwa tayari; “wakakataa” ni wazi, thabiti, na ya kawaida katika Kiswahili.
- source_word: לָלֶכֶת
  choice: kuenenda
  rationale: הלך maana yake ya msingi ni kutembea, lakini hapa ni sitiari ya mwenendo wa maisha. “Kuenenda” huhifadhi sitiari hiyo katika lugha ya kibiblia yenye hadhi bila kuwa nzito kupita kiasi.
- source_word: לֹא
  choice: hawa-
  rationale: Ukanushi wa Kiebrania umeonyeshwa kwa kiambishi cha wakati uliopita “hawa-” katika “hawakulishika,” kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Tafsiri ya תּוֹרָה katika muktadha wa agano
  choice: sheria
  alternative: mafundisho; maagizo
  rationale: “Sheria” huhifadhi nguvu ya wajibu wa agano katika mstari huu. Tanbihi inadumisha upana halisi wa תּוֹרָה, ambalo halihusu sheria za kikanuni pekee bali pia mafundisho au maagizo ya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na hadhi. Mpangilio wa mistari miwili unaonyesha ulinganifu wa Kiebrania. “Kuenenda katika” imetumiwa kuhifadhi sitiari ya mwenendo wa maisha, huku tanbihi ikihifadhi upana wa maana ya torah.
