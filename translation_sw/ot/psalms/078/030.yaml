  text: They had not yet turned away from their craving[a]; their food was still in their mouths.
translation:
  language: sw
  text: Walikuwa bado hawajaachana na tamaa yao[a]; chakula chao kilikuwa bado vinywani mwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Walikuwa bado hawajatengana na tamaa yao.” Kitenzi cha Kiebrania kinaweza kutafsiriwa hivyo kwa namna iliyo rasmi zaidi, lakini maandishi makuu yanaonyesha maana inayowezekana zaidi katika muktadha: walikuwa bado hawajaiacha tamaa hiyo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָרוּ
  choice: hawajaachana
  rationale: Kitenzi זור pamoja na מן hapa kinaelekea kumaanisha kujitenga na kitu au kukiacha. Katika muktadha huu, “hawajaachana” ni Kiswahili cha kawaida kinachoonyesha kwamba tamaa yao ilikuwa bado inaendelea.
- source_word: מִתַּאֲוָתָם
  choice: na tamaa yao
  rationale: תַּאֲוָה humaanisha hamu kali au tamaa. Katika muktadha wa kudai chakula kwa pupa, “tamaa” huonyesha hamu iliyopitiliza bila kuipa maana ya kingono.
- source_word: עוֹד
  choice: bado
  rationale: Neno hili huonyesha hali iliyoendelea mpaka wakati huo; “bado” ni usemi wa kawaida na unaofaa katika mistari yote miwili.
- source_word: אָכְלָם
  choice: chakula chao
  rationale: אֹכֶל ni chakula; tafsiri hii ni ya moja kwa moja na ya kawaida.
- source_word: בְּפִיהֶם
  choice: vinywani mwao
  rationale: Kiambishi cha Kiebrania ni cha wingi. “Vinywani mwao” huhifadhi wingi huo na ni usemi wa Kiswahili unaoeleweka.
