  text: He brought streams out of the rock and made water flow down like rivers[a].
translation:
  language: sw
  text: 'Aliyatokeza vijito kutoka mwambani,

    akayafanya maji yashuke kama mito.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Aliyatokeza maji yanayotiririka kutoka mwambani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: Aliyatokeza
  rationale: Hifili ya יצא ina maana ya kusababisha kitu kitoke; “aliyatokeza” ni ya kawaida na huhifadhi maana hiyo ya kisababishi.
- source_word: נוֹזְלִים
  choice: vijito
  rationale: Neno hili la hali ya kutiririka linaonyesha vitu vinavyotiririka; katika muktadha wa maji kutoka mwambani, “vijito” ni wazi na ya kishairi.
- source_word: מִסָּלַע
  choice: kutoka mwambani
  rationale: סלע humaanisha mwamba au jabali; “mwambani” hudokeza mwamba unaojulikana katika simulizi la maji jangwani.
- source_word: וַיּוֹרֶד
  choice: kuyateremsha
  rationale: Hifili ya ירד ni ya kisababishi, yaani alisababisha maji yashuke; “kuyateremsha” huhifadhi maana hiyo bila kuongeza wazo lisilokuwamo wazi katika Kiebrania.
- source_word: כַּנְּהָרוֹת
  choice: kama mito
  rationale: כ ni kiambishi cha ulinganisho, na נהרות ni mito; hivyo “kama mito” huhifadhi tashbihi moja kwa moja.
- source_word: מָיִם
  choice: maji
  rationale: Ingawa umbo la Kiebrania ni la wingi, neno hili hutumiwa kama nomino ya wingi isiyohesabika; “maji” ndilo chaguo la kawaida la Kiswahili.
