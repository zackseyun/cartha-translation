  text: וַ֭/יְבִיאֵ/ם אֶל גְּב֣וּל קָדְשׁ֑/וֹ הַר זֶ֝֗ה קָנְתָ֥ה יְמִינֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/054.yaml
  text: So he brought them to his holy border[d][c][b][a], this mountain that his right hand acquired.
translation:
  language: sw
  text: Basi akawaleta katika eneo lake takatifu[a], mlima huu[b] ambao mkono wake wa kuume uliupata[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka wake mtakatifu,” “eneo la utakatifu wake,” au “nchi yake takatifu.” Neno la Kiebrania linaweza kumaanisha mpaka, mipaka, au eneo lililo ndani ya mipaka hiyo.
    reason: lexical_alternative
  - marker: b
    text: Au, “kilima hiki.” Huenda maneno haya yakarejelea eneo la milima ambalo Mungu aliwapa Israeli, na katika muktadha mpana yanaweza pia kukumbusha Sayuni.
    reason: alternative_reading
  - marker: c
    text: Au, “ulijipatia,” “uliimiliki,” au “uliununua.” Kitenzi cha Kiebrania kina maana kadhaa zinazohusiana; hapa kinaeleza kile ambacho mkono wa kuume wa Mungu ulipata na kukifanya kuwa chake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵם
  choice: Basi akawaleta
  rationale: Kitenzi cha Hifili cha בוא humaanisha ‘kuleta’; ‘Basi’ linaendeleza simulizi la matendo ya Mungu kwa ufasaha wa kishairi.
- source_word: אֶל גְּבוּל קָדְשׁוֹ
  choice: katika eneo lake takatifu
  rationale: גְּבוּל linaweza kumaanisha mpaka, eneo lenye mipaka, au nchi. Katika muktadha wa kuwaleta watu mahali walipopewa, ‘eneo’ linaonyesha mahali walipoingia bila kulibana neno hilo kuwa mstari wa mpaka pekee. קָדְשׁוֹ limehifadhiwa kwa ‘lake takatifu.’
- source_word: הַר זֶה
  choice: mlima huu
  rationale: Tafsiri hii inahifadhi kiashiria na umahususi wa Kiebrania bila kuutambulisha moja kwa moja kuwa Sayuni au nchi ya milima ya Kanaani.
- source_word: קָנְתָה
  choice: uliutwaa
  rationale: קנה lina maana zinazohusiana na kupata, kujipatia, kumiliki, au kununua. ‘Uliutwaa’ linafaa hapa kwa tendo la mkono wa kuume wa Mungu kupata na kushikilia eneo kwa nguvu, bila kudokeza ununuzi wa kibiashara.
- source_word: יְמִינוֹ
  choice: mkono wake wa kuume
  rationale: Taswira ya Kiebrania ya mkono wa kuume, inayowakilisha nguvu na ushindi wa Mungu, imehifadhiwa wazi.
theological_decisions:
- issue: Mlima unaorejelewa na maneno ‘mlima huu’
  choice: Maneno halisi ‘mlima huu’ yamehifadhiwa bila kutaja Sayuni au Kanaani katika andiko kuu.
  alternative: Sayuni; nchi ya milima ya Kanaani; eneo la milima ambalo Mungu aliwapa Israeli
  rationale: Mstari wenyewe hautaji mlima huo kwa jina. Muktadha mpana unaweza kuhusishwa na nchi na pia na Sayuni, kwa hiyo tafsiri haiondoi mvutano huo wa kiufafanuzi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo wa vipashio viwili umehifadhiwa kwa kuweka ‘mlima huu’ kama ufafanuzi wa ‘eneo lake takatifu,’ bila kurudia kihusishi.
