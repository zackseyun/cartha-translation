  yaml_path: translation/ot/psalms/078/059.yaml
  text: God heard and was furious[b][a], and he utterly rejected Israel.
translation:
  language: sw
  text: Mungu alisikia, akaghadhibika,[a] akawakataa kabisa Waisraeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliwaka kwa hasira.” Kitenzi cha Kiebrania kinaweza kumaanisha kukasirika au kuwaka kwa ghadhabu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: alisikia
  rationale: Qal timilifu humaanisha kwa kawaida ‘kusikia’; hapa inaanzisha mwitikio wa Mungu kwa mwenendo wa Israeli.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania ni la wingi kimofolojia, matumizi yake hapa ni ya umoja na yanamtaja Mungu wa Israeli.
- source_word: וַיִּתְעַבָּר
  choice: akaghadhibika sana
  rationale: Hitpaeli ya עבר hapa huonyesha kuwaka hasira au kughadhibika. ‘Akaghadhibika sana’ ni Kiswahili cha sasa chenye hadhi na huhifadhi nguvu ya usemi.
- source_word: וַיִּמְאַס
  choice: akawakataa
  rationale: מאס inaweza kumaanisha kukataa, kutupilia mbali, au kudharau. ‘Akawakataa’ huhifadhi tendo la kuwakataa katika muktadha wa hukumu na pia huonyesha kwamba Israeli hapa ni watu.
- source_word: מְאֹד
  choice: kabisa
  rationale: Kielezi hiki kinatilia nguvu kukataa; ‘akawakataa kabisa’ ni usemi wa kawaida na wenye nguvu katika Kiswahili.
- source_word: בְּיִשְׂרָאֵל
  choice: Israeli
  rationale: Baada ya מאס, kihusishi ב־ huonyesha walengwa wa kukataliwa. Kiswahili cha asili hutumia yambwa moja kwa moja.
theological_decisions:
- issue: Lugha ya kibinadamu kuhusu hasira na kukataa kwa Mungu
  choice: 'Kuhifadhi lugha kali: ‘akaghadhibika sana’ na ‘akawakataa kabisa.’'
  alternative: Kulainisha kuwa ‘hakupendezwa’ au ‘hakuwaunga mkono.’
  rationale: Kiebrania kina lugha nzito ya hasira na hukumu ya agano. Tafsiri haipaswi kupunguza mvutano wa kiteolojia uliomo katika zaburi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi mfululizo unaakisi mtiririko wa simulizi wa Kiebrania. Alama ya tanbihi [a] imewekwa mara moja baada ya kishazi kinachohusika.
