base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/021.yaml
  text: Therefore Yahweh heard and was enraged[a]; and a fire was kindled against Jacob[c][b], and anger also rose against Israel.
translation:
  language: sw
  text: Kwa hiyo Yahwe alisikia, akaghadhabika[a]; na moto uliwashwa dhidi ya Yakobo[b], na hasira pia ikapanda dhidi ya Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akakasirika sana.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “katika Yakobo” na, baadaye katika mstari huu, “katika Israeli.” Hapa imetafsiriwa “dhidi ya” kwa kuwa muktadha unaeleza hukumu iliyowaelekea.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kwa hiyo
  rationale: Inaonyesha matokeo ya maneno na malalamiko yaliyotangulia kwa Kiswahili cha kawaida na cha wazi.
- source_word: שָׁמַע
  choice: alisikia
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi cha kusikia; muktadha unaonyesha kwamba Yahwe aliyatambua maneno ya watu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Inahifadhi jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania badala ya kulibadili kuwa cheo.
- source_word: וַיִּתְעַבָּר
  choice: akaghadhabika
  rationale: Kitenzi hiki kinaonyesha hasira kali. 'Akaghadhabika' ni neno la Kiswahili lenye heshima na uzito unaolingana na nguvu ya Kiebrania.
- source_word: אֵשׁ נִשְּׂקָה
  choice: moto ukawashwa
  rationale: Inahifadhi taswira ya moto na hali tendwa ya kitenzi bila kuamua kama moto huo ni halisi, wa kitamathali, au vyote viwili.
- source_word: בְיַעֲקֹב
  choice: dhidi ya Yakobo
  rationale: Ingawa kihusishi בְּ kwa kawaida kinaweza kumaanisha 'katika' au 'ndani ya,' hapa muktadha wa hukumu yenye uhasama unafanya 'dhidi ya' kuwa tafsiri ya asili zaidi.
- source_word: וְגַם אַף
  choice: na hasira pia
  rationale: Inahifadhi nguvu ya nyongeza ya וְגַם na maana ya kawaida ya kimajazi ya אַף kama hasira.
- source_word: עָלָה
  choice: ikapanda
  rationale: Inahifadhi taswira ya Kiebrania ya hasira kupanda huku ikibaki inaeleweka kwa Kiswahili.
- source_word: בְיִשְׂרָאֵל
  choice: dhidi ya Israeli
  rationale: Kama ilivyo katika kishazi kinachomhusu Yakobo, 'dhidi ya' huwasilisha mwelekeo wa hukumu na kudumisha usambamba.
theological_decisions:
- issue: Uzito wa lugha inayoeleza hasira ya Mungu
  choice: akaghadhabika; ... hasira pia ikapanda
  alternative: alichukizwa au hakupendezwa
  rationale: Kiebrania kinaonyesha ghadhabu kali, si kutopendezwa kwa kiasi. Tafsiri inadumisha uzito huo bila kuupunguza.
- issue: Maana ya taswira ya moto
  choice: moto ukawashwa dhidi ya Yakobo
  alternative: kueleza wazi kuwa ni moto halisi au mfano wa hukumu
  rationale: Andiko lenyewe haliondoi uwezekano wa moto kuwa halisi, wa kitamathali, au vyote viwili; hivyo taswira imehifadhiwa bila kufafanuliwa kupita kiasi.
- issue: Uhusiano wa Yakobo na Israeli katika usambamba
  choice: Majina yote mawili yamehifadhiwa kama yanavyotokea
  alternative: kuyabadilisha yote kuwa 'watu wa Israeli'
  rationale: Yakobo na Israeli ni majina sambamba ya agano yanayowataja watu wale wale, lakini ushairi unatumia yote mawili na tafsiri inapaswa kuhifadhi usambamba huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa kishairi, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa vifungu sambamba na taswira ya Kiebrania umehifadhiwa bila kufanya sentensi iwe ngumu isivyo lazima.
