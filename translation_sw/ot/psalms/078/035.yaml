  yaml_path: translation/ot/psalms/078/035.yaml
  text: Then they remembered that God was their rock[a], and God Most High was their redeemer.
translation:
  language: sw
  text: Ndipo wakakumbuka kwamba Mungu alikuwa mwamba wao, na Mungu Aliye Juu Sana alikuwa mkombozi wao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kihalisi, mpangilio wa Kiebrania ni: “na Mungu Aliye Juu Sana, mkombozi wao.”'
    reason: Kishazi cha pili cha Kiebrania hakina kitenzi kinacholingana na “alikuwa”; kitenzi hicho kimeongezwa katika Kiswahili ili sentensi ikamilike kwa kawaida.
lexical_decisions:
- source_word: וַיִּזְכְּרוּ
  choice: Ndipo wakakumbuka
  rationale: Umbo la wayyiqtol linaendeleza simulizi; “ndipo” linaonyesha mfuatano wa matukio kwa Kiswahili cha kawaida, huku “wakakumbuka” likihifadhi maana ya זכר.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי linaanzisha yaliyokuwa maudhui ya kumbukumbu yao, si sababu.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania ni la wingi kimofolojia, hapa linamtaja Mungu mmoja wa Israeli.
- source_word: צוּרָם
  choice: mwamba wao
  rationale: Tafsiri hii inadumisha sitiari ya צוּר kuhusu uthabiti, ulinzi na nguvu za Mungu bila kuifafanua kupita kiasi.
- source_word: וְאֵל
  choice: na Mungu
  rationale: אֵל hapa ni cheo cha Mungu kinacholingana kishairi na אֱלֹהִים; kukitafsiri “Mungu” kunazuia dhana ya viumbe wawili tofauti.
- source_word: עֶלְיוֹן
  choice: Aliye Juu Zaidi
  rationale: Hiki ni cheo cha kimungu kinachoeleza ukuu wa Mungu juu ya wote; muundo huu ni wa kawaida na wenye heshima katika Kiswahili.
- source_word: גֹּאֲלָם
  choice: mkombozi wao
  rationale: Nomino hii inayotokana na גאל inamtaja anayekomboa au kutenda kama mkombozi. “Mkombozi wao” huhifadhi nguvu ya jina bila kuingiza kwa lazima maana maalumu ya kisheria ya jamaa-mkombozi.
theological_decisions:
- issue: Jinsi ya kutafsiri vyeo viwili vinavyolingana, אֱלֹהִים ... וְאֵל עֶלְיוֹן
  choice: Mungu ... na Mungu Aliye Juu Zaidi
  alternative: Mungu ... na El Elyoni
  rationale: Vishazi viwili vinamtaja Mungu yuleyule kwa usambamba wa kishairi. Kutafsiri אֵל badala ya kuitamka kama jina la kigeni kunatoa Kiswahili wazi na hakudokezi miungu wawili.
- issue: Kuongeza kitenzi “alikuwa” katika kishazi cha pili
  choice: Mungu Aliye Juu Zaidi alikuwa mkombozi wao
  alternative: Mungu Aliye Juu Zaidi, mkombozi wao
  rationale: Kiebrania hakirudii kitenzi katika kishazi cha pili, lakini Kiswahili cha kawaida hunufaika kwa kukirudia. Nyongeza hiyo haibadili usambamba wala uhusiano wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mwamba” na “mkombozi” huhifadhi taswira na uzito wa kishairi wa Kiebrania; herufi kubwa katika cheo “Aliye Juu Zaidi” zinaonyesha matumizi yake kama cheo cha Mungu.
