  yaml_path: translation/ot/psalms/078/000.yaml
  text: A Maskil of Asaph. Give ear[a], my people, to my instruction; incline your ears to the words of my mouth.
translation:
  language: sw
  text: Maskili[a] ya Asafu. Sikilizeni mafundisho yangu, enyi watu wangu; tegeeni masikio yenu kwa maneno ya kinywa changu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Maskili” ni istilahi ya kiufundi inayopatikana katika vichwa vya baadhi ya zaburi; huenda ikamaanisha tungo ya kufundisha au ya kutafakari.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל (maskil)
  choice: Maskili
  rationale: Neno la kiufundi katika vichwa vya zaburi limehifadhiwa kwa kutohakikisha maana ambayo haijulikani kikamilifu; limeandikwa kwa namna inayoweza kutamkwa kwa Kiswahili na kufafanuliwa katika tanbihi.
- source_word: תּוֹרָתִי (torati)
  choice: mafundisho yangu
  rationale: Katika muktadha huu neno lina maana pana ya maelekezo au mafundisho ya mtunga-zaburi, si lazima Sheria ya Musa kama jumla maalumu.
- source_word: הַאֲזִינָה ... הַטּוּ אָזְנְכֶם
  choice: Sikilizeni ... tegeni masikio yenu
  rationale: 'Jozi ya amri imehifadhiwa: ya kwanza ni mwito wa kusikiliza kwa makini, na ya pili inadumisha taswira ya kuelekeza sikio.'
- source_word: עַמִּי
  choice: enyi watu wangu
  rationale: Kiitikio cha moja kwa moja kimetolewa kwa Kiswahili cha kawaida na chenye hadhi.
theological_decisions:
- issue: Maana ya מַשְׂכִּיל katika kichwa cha zaburi
  choice: Kuhifadhi kama jina la kiufundi “Maskili” na kutoa tanbihi
  alternative: “Wimbo wa mafundisho” au “utenzi wa kutafakari”
  rationale: Maana sahihi ya istilahi hii ya kichwa cha zaburi haijathibitishwa; kuitafsiri kwa maana moja kungeondoa utata halisi wa chanzo.
- issue: Uhusiano unaoonyeshwa na לְאָסָף
  choice: “ya Asafu”
  alternative: “kwa ajili ya Asafu” au “ya mtindo wa Asafu”
  rationale: Kihusishi kinaweza kuonyesha uandishi, uhusiano, au wakfu; usemi “ya Asafu” huhifadhi uhusiano huo bila kuamua kwa lazima kwamba Asafu mwenyewe ndiye mwandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Wingi wa amri katika Kiebrania umehifadhiwa; taswira ya “kutega masikio” imedumishwa kwa uaminifu na kwa usemi wa kawaida wa Kiswahili.
