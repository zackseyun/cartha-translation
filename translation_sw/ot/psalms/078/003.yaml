  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: mambo ... ambayo
  rationale: Kiwakilishi hiki kinaendeleza ‘mafumbo/maneno’ ya mstari uliotangulia; ‘mambo ... ambayo’ ni Kiswahili cha kawaida na huhifadhi uhusiano huo bila kulazimisha jinsia ya nomino.
- source_word: שָׁמַעְנוּ וַנֵּדָעֵם
  choice: tuliyoyasikia na kuyajua
  rationale: Huhifadhi vitenzi viwili vya Kiebrania, ‘kusikia’ na ‘kujua,’ pamoja na kiambishi cha yambwa cha wingi.
- source_word: אֲבוֹתֵינוּ
  choice: baba zetu
  rationale: Hapa humaanisha mababu/wazazi wa vizazi vilivyotangulia; ‘baba zetu’ huhifadhi taswira ya moja kwa moja ya Kiebrania na inafaa katika mtindo wa zaburi.
- source_word: סִפְּרוּ־לָנוּ
  choice: walitusimulia
  rationale: Kitenzi ספר katika muktadha huu ni kusimulia au kueleza; ‘walitusimulia’ ni cha asili na hudokeza mapokeo yaliyopokezwa kwa mdomo.
