  text: A Maskil of Asaph. Give ear[a], my people, to my instruction; incline your ears to the words of my mouth.
translation:
  language: sw
  text: 'Maskili[a] ya Asafu.


    Enyi watu wangu, sikilizeni mafundisho yangu;

    tegeeni masikio yenu kwa maneno ya kinywa changu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Maskili” ni istilahi ya kitaalamu katika vichwa vya zaburi; huenda ikamaanisha utungo wa kufundisha au wa kutafakari.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Maskili
  rationale: Neno hili ni istilahi ya kitaalamu katika vichwa vya zaburi, na maana yake kamili haina uhakika. Kulitohoa kunahifadhi utata huo bila kulifasiri kupita ushahidi.
- source_word: לְאָסָף
  choice: ya Asafu
  rationale: Katika vichwa vya zaburi, לְ inaweza kuonyesha utunzi, uhusiano, umiliki, au kuwekwa wakfu. “Ya Asafu” ni ya kawaida na haibainishi zaidi ya chanzo.
- source_word: הַאֲזִינָה
  choice: Sikilizeni
  rationale: Kitenzi kinataka usikivu wa makini. Ingawa Kiebrania kina amri ya umoja inayolenga watu kama jumuiya, wingi ni wa asili katika Kiswahili kwa kumwambia moja kwa moja “watu wangu.”
- source_word: עַמִּי
  choice: enyi watu wangu
  rationale: “Watu wangu” huhifadhi kiwakilishi-milikishi kilicho wazi; “enyi” huonyesha mwito wa moja kwa moja kwa njia ya asili katika Kiswahili.
- source_word: תּוֹרָתִי
  choice: mafundisho yangu
  rationale: תּוֹרָה hapa ni maelekezo au mafundisho, si lazima sheria ya kisheria pekee. “Mafundisho” inafaa mwito huu wa hekima na historia.
- source_word: הַטּוּ אָזְנְכֶם
  choice: tegeni masikio yenu
  rationale: Kauli hii huhifadhi taswira ya kuelekeza masikio ili kusikiliza kwa makini na pia wingi wa “masikio yenu.”
- source_word: לְאִמְרֵי פִי
  choice: kwa maneno ya kinywa changu
  rationale: Tafsiri hii huhifadhi usemi halisi na wa kishairi wa chanzo pamoja na ulinganifu wa “masikio” na “kinywa.”
