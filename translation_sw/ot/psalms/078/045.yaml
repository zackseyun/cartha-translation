  source_fidelity: 'Matini inafuata Kiebrania kwa uaminifu: Mungu alituma tauni hizo kati yao; עָרֹב imetafsiriwa kwa upana unaofaa kama “makundi ya wadudu,” bila kufunga maana kwenye nzi; na vitenzi vinaonyesha athari ya kuwala na kuwaangamiza. Wingi wa Kiswahili katika “makundi” na “vyura” ni wa kawaida kwa nomino za kijamii za Kiebrania.'
  naturalness: “Alipeleka kati yao makundi ya wadudu, yakawala, na vyura, wakawaangamiza” ni Kiswahili Sanifu kinachoeleweka na kina mtiririko wa kishairi unaofaa kwa Zaburi. Upatanisho wa “yakawala” na “makundi,” na wa “wakawaangamiza” na “vyura,” unasomeka kwa kawaida katika muktadha huu.
  terminology: “Makundi ya wadudu” huhifadhi kutokuwa mahususi kwa עָרֹב, na tanbihi inaweka wazi uelewa wa jadi wa “nzi.” “Vyura” na “kuwaangamiza” ni istilahi sahihi, za kisasa, na zenye uzito unaolingana na muktadha wa tauni.
