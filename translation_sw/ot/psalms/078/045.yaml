base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/045.yaml
  text: He sent among them swarms of flies[a], which devoured them, and frogs[b], which destroyed them.
translation:
  language: sw
  text: Alipeleka kati yao makundi ya wadudu[a], yakawala, na vyura, wakawaangamiza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makundi ya nzi.” Neno la Kiebrania linaweza kumaanisha makundi ya wadudu kwa ujumla; kwa kawaida limeeleweka kuwa nzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלַּח
  choice: Alipeleka
  rationale: Piel ya שׁלח inaeleza Mungu akiwapeleka viumbe hao dhidi ya Wamisri; “alipeleka” ni ya kawaida na inadumisha tendo la moja kwa moja.
- source_word: בָּהֶם
  choice: kati yao
  rationale: ב hapa ina maana ya mahali, yaani tauni iliingia katikati yao; “kati yao” ni Kiswahili cha asili.
- source_word: עָרֹב
  choice: makundi ya wadudu
  rationale: Neno hilo linamaanisha kundi au makundi ya viumbe vinavyosongamana, lakini aina kamili ya wadudu haijulikani. Tafsiri hii inadumisha kutokuwa na uhakika bila kulazimisha maana ya nzi.
- source_word: וַיֹּאכְלֵם
  choice: yakawala
  rationale: אכל kwa kawaida ni “kula” na hapa ina nguvu ya kuangamiza. Kiambishi cha ngeli “ya-” kinaafikiana na “makundi,” huku “-wa-” kikirejelea watu.
- source_word: וּצְפַרְדֵּעַ
  choice: na vyura
  rationale: Nomino ya Kiebrania iko katika umoja lakini ina maana ya jamii kwa ujumla; wingi “vyura” ni wa kawaida katika Kiswahili.
- source_word: וַתַּשְׁחִיתֵם
  choice: wakawaangamiza
  rationale: שׁחת hapa huonyesha uharibifu mkubwa. “Wakawaangamiza” inadumisha uzito wa kitenzi na inapatana na wingi “vyura.”
theological_decisions: []
