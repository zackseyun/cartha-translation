  text: וַ/יַּךְ צָרָ֥י/ו אָח֑וֹר חֶרְפַּ֥ת ע֝וֹלָ֗ם נָ֣תַן לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/066.yaml
  text: He struck his foes backward[a]; he put everlasting disgrace on them.
translation:
  language: sw
  text: Akawapiga adui zake mgongoni[a]; akawatia fedheha ya kudumu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Akawapiga adui zake nyuma.” Neno la Kiebrania אָחוֹר linaweza kueleweka kama kielezi, “nyuma,” au kama mahali walipopigwa, yaani “mgongoni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: Akawapiga
  rationale: Kitenzi נכה hapa kinasimulia tendo lililopita. ‘Akawapiga’ ni Kiswahili cha kawaida chenye nguvu inayofaa, bila kuongeza kwamba waliuawa.
- source_word: צָרָיו
  choice: adui zake
  rationale: ‘Adui zake’ ni usemi wa kawaida na wazi kwa wapinzani au mahasimu katika muktadha huu wa kishairi.
- source_word: אָחוֹר
  choice: wakarudi nyuma
  rationale: Neno linaweza kutumika kielezi kwa maana ya kuelekea nyuma. Kiswahili hiki kinaonyesha matokeo ya pigo kwa njia ya asili, huku uwezekano wa maana ya kupigwa mgongoni ukiwekwa katika tanbihi.
- source_word: חֶרְפַּת עוֹלָם
  choice: aibu ya kudumu
  rationale: Kirai hiki kinaonyesha fedheha au aibu inayoendelea. ‘Ya kudumu’ huhifadhi maana ya עוֹלָם katika muktadha bila kulazimisha dhana ya umilele usio na mwisho kabisa.
- source_word: נָתַן לָמוֹ
  choice: akawavika
  rationale: נתן + ל ina maana ya kuweka au kuleta jambo juu ya watu. ‘Akawavika aibu’ ni usemi wa Kiswahili unaoeleweka na unaohifadhi picha ya kuwatia fedheha.
