  text: He split rocks in the wilderness and gave them drink abundantly[a], as from the great depths.
translation:
  language: sw
  text: Alipasua miamba jangwani, akawanywesha kama kutoka katika vilindi vikuu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawanywesha kutoka katika vilindi vikuu.”
