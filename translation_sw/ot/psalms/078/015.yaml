lexical_decisions:
- source_word: יְבַקַּע
  choice: Alipasua
  rationale: Piel ya בקע inaonyesha tendo la nguvu la kupasua au kufungua; “alipasua” ni Kiswahili cha kawaida na chenye picha wazi.
- source_word: צֻרִים
  choice: miamba
  rationale: Wingi wa צוּר unarejelea miamba au majabali makubwa; “miamba” huhifadhi wingi na ukubwa unaodokezwa.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: מִדְבָּר inaweza kumaanisha nyika au jangwa; “jangwani” ni ya asili katika muktadha wa safari ya Israeli bila kuongeza maelezo yasiyokuwapo.
- source_word: וַיַּשְׁקְ
  choice: akawanywesha
  rationale: Hiphil ya שׁקה humaanisha kuwapa watu kinywaji au kuwafanya wanywe. Kiambishi “-wa-” kinawakilisha watu wanaotajwa katika muktadha.
- source_word: כִּתְהֹמוֹת
  choice: kana kwamba maji hayo yalitoka katika vilindi
  rationale: Kiambishi כ־ kinaonyesha ulinganisho, na תְּהֹמוֹת ni vilindi vya maji. Kauli hii hudumisha picha ya kishairi ya maji yanayotoka vilindini bila kudai moja kwa moja maelezo fulani ya kijiolojia au kikosmolojia.
- source_word: רַבָּה
  choice: kwa wingi; vikuu
  rationale: Neno hili linasisitiza ukubwa au wingi. Maandishi makuu yanaonyesha wingi wa maji na ukubwa wa vilindi, huku tanbihi ikihifadhi uwezekano wa kulihusisha moja kwa moja na kilindi kikuu.
theological_decisions:
- issue: Asili ya picha ya maji
  choice: 'Kuhifadhi ulinganisho: “kana kwamba maji hayo yalitoka katika vilindi vikuu.”'
  alternative: “akawanywesha kutoka katika kilindi kikuu”
  rationale: Kiebrania kina כ־ ya ulinganisho, hivyo tafsiri kuu haigeuzi picha ya kishairi kuwa dai dhahiri kuhusu hifadhi za maji chini ya ardhi. Tanbihi huhifadhi uchanganuzi mwingine unaowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Miamba” na “vilindi vikuu” huhifadhi taswira kuu za Kiebrania, huku “akawanywesha” ikiwa wazi na ya kawaida kwa wasomaji wa leo.
