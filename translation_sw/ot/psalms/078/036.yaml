lexical_decisions:
- source_word: וַיְפַתּוּהוּ
  choice: walimbembeleza
  rationale: Katika piel, פתה inaweza kumaanisha kushawishi, kudanganya, au kubembeleza. Hapa inasawazishwa na kauli ya kwamba walimdanganya kwa ndimi zao, hivyo “walimbembeleza” inaonyesha maneno matamu yasiyo ya kweli yaliyoelekezwa kwa Mungu bila kudai kwamba walifanikiwa kumhadaa.
- source_word: בְּפִיהֶם
  choice: kwa vinywa vyao
  rationale: ב inaonyesha chombo au njia. Kiswahili hutumia wingi “vinywa vyao” kwa kawaida inapozungumzia watu wengi, huku picha halisi ya Kiebrania ikihifadhiwa.
- source_word: וּבִלְשׁוֹנָם
  choice: na kwa ndimi zao
  rationale: “Ndimi” huhifadhi picha ya kishairi na usambamba wa Kiebrania kati ya kinywa na ulimi.
- source_word: יְכַזְּבוּ
  choice: walimdanganya
  rationale: Piel ya כזב ina maana ya kusema uongo au kutenda kwa udanganyifu. “Walimdanganya” ni usemi wa kawaida wa Kiswahili unaohifadhi uhusiano wa moja kwa moja na kiwakilishi לוֹ.
- source_word: לוֹ
  choice: walimdanganya
  rationale: Kiwakilishi chenye ל kinamtaja Mungu kama mlengwa wa maneno yao ya uongo; katika Kiswahili, mtendewa huwakilishwa kiasili na kiambishi -m- ndani ya kitenzi.
theological_decisions:
- issue: Ikiwa mstari unamaanisha kwamba wanadamu walifanikiwa kumdanganya Mungu au kwamba walimweleza maneno ya udanganyifu.
  choice: Maneno yao yalikuwa ya kujipendekeza na ya udanganyifu yakielekezwa kwa Mungu, bila kusema wazi kwamba Mungu alidanganyika.
  alternative: “Walimdanganya” pia inaweza kutumiwa katika kishazi cha kwanza ili kudumisha maana ya moja kwa moja ya kujaribu kumhadaa.
  rationale: Muktadha unaonyesha mwitikio usio wa kweli wa Israeli kwa Mungu. “Walimbembeleza” huhifadhi wazo la maneno matamu yenye hila, huku tanbihi ikihifadhi uwezekano mpana wa kitenzi cha Kiebrania bila kufuta mvutano wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usambamba wa kishairi wa “vinywa” na “ndimi” umehifadhiwa; “kubembeleza” ni neno linaloeleweka kwa urahisi na linaonyesha usemi wa kujipendekeza usio wa kweli.
