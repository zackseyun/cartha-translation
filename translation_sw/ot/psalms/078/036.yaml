  text: Lakini walimbembeleza kwa midomo yao[a], na kwa ndimi zao wakamwambia uongo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walimdanganya” au “walimshawishi.” Kitenzi cha Kiebrania kinaweza kuwa na maana hizo, lakini hapa huenda kinamaanisha maneno matamu yasiyo ya kweli.
