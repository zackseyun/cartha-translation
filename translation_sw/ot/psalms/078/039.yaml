base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/039.yaml
  text: He remembered that they were flesh[a], a wind that passes and does not return.
translation:
  language: sw
  text: Alikumbuka kwamba walikuwa mwili, upepo[a] unaopita na usiorudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “pumzi inayopita na isiyorudi.” Neno la Kiebrania רוּחַ linaweza kumaanisha “upepo,” “pumzi,” au “roho”; hapa yaelekea maana ni hali ya kupita na udhaifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: Alikumbuka
  rationale: Ni Qal wayyiqtol ya זכר, na kutokana na muktadha mtendaji anayeeleweka ni Mungu. Wakati uliopita wa kisimulizi umehifadhiwa kwa Kiswahili cha kawaida.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa neno hili linaanzisha jambo alilolikumbuka, si lazima sababu; kwa hiyo “kwamba” linaakisi sintaksia vizuri.
- source_word: בָשָׂר הֵמָּה
  choice: wao ni mwili
  rationale: “Mwili” huhifadhi taswira halisi ya Kiebrania kuhusu udhaifu na hali ya kufa ya wanadamu. Wakati wa sasa “ni” ni wa asili katika Kiswahili kwa maelezo ya hali yao ya kudumu ndani ya kumbukumbu ya wakati uliopita.
- source_word: רוּחַ
  choice: upepo
  rationale: Katika ushairi huu neno linaonyesha kitu kinachopita na kisicho imara. “Upepo” linaendana kwa asili na kwenda/kupita na kutorudi, huku uwezekano wa “pumzi” ukihifadhiwa katika tanbihi.
- source_word: הוֹלֵךְ
  choice: unaopita
  rationale: Kitenzi-shirikishi kinaonyesha mwendo unaoendelea; “unaopita” ni cha asili na huwasilisha hali ya muda mfupi.
- source_word: וְלֹא יָשׁוּב
  choice: wala haurudi
  rationale: Kauli hii ina nguvu ya jumla ya kishairi. “Wala haurudi” huhifadhi ukanushi na muunganiko wa sentensi bila kuufanya wakati ujao kuwa dhahiri kupita kiasi.
theological_decisions:
- issue: Taswira ya kibinadamu kuhusu udhaifu wa wanadamu
  choice: Mstari unawaeleza wanadamu kuwa dhaifu na wa muda mfupi—“mwili ... upepo unaopita wala haurudi”—bila kutoa fundisho la kitaalamu kuhusu nafsi au roho isiyo ya kimwili.
  alternative: Kutafsiri רוּחַ kuwa “roho” na kuuchukua mstari kama kauli kuhusu roho ya mwanadamu inapoondoka.
  rationale: Usambamba wa kishairi wa karibu unasisitiza hali ya kufa na ya kupita. “Upepo” huepuka kuingiza fundisho la kiantropolojia ambalo mstari wenyewe haulazimishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo mfupi wa kishairi umehifadhiwa; “wao ni mwili” ni halisi kimakusudi ili kutopunguza taswira ya Kiebrania.
