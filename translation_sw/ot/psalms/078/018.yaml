  text: They tested God in their heart by asking for food for themselves[a][b].
translation:
  language: sw
  text: Wakamjaribu Mungu mioyoni mwao kwa kuomba chakula ili kutosheleza tamaa yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kuomba chakula kwa ajili yao wenyewe.” Kiebrania kinasema kihalisi “kwa ajili ya nefeshi yao”; neno hilo linaweza kumaanisha nafsi, mtu mwenyewe, hamu, au tamaa ya kula. Hapa muktadha unaelekea kwenye tamaa ya chakula.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַסּוּ
  choice: Wakamjaribu
  rationale: Kitenzi נסה katika piel humaanisha kumjaribu au kumweka mtu kwenye jaribu. Katika muktadha huu, “kumjaribu Mungu” ni usemi wa kawaida na wa asili wa Kiswahili, unaoonyesha kwamba walipinga uaminifu na uwezo wake.
- source_word: אֵל
  choice: Mungu
  rationale: אֵל hapa ni jina la kawaida la Mungu; “Mungu” ndilo neno wazi na la kawaida katika Kiswahili.
- source_word: בִּלְבָבָם
  choice: mioyoni mwao
  rationale: Ingawa Kiebrania kina nomino ya umoja yenye kiambishi cha wingi, Kiswahili hutumia kwa kawaida wingi wa kugawa, “mioyoni mwao,” kuonyesha hali yao ya ndani.
- source_word: לִשְׁאָל
  choice: kwa kuomba
  rationale: Infinitivu yenye ל inaeleza njia waliyotumia kumjaribu Mungu; “kwa kuomba” huonyesha uhusiano huo kwa Kiswahili cha asili.
- source_word: אֹכֶל
  choice: chakula
  rationale: אֹכֶל ni neno la jumla linalomaanisha chakula, si lazima mkate.
- source_word: לְנַפְשָׁם
  choice: ili kutosheleza tamaa yao
  rationale: נֶפֶשׁ inaweza kumaanisha nafsi, mtu mwenyewe, hamu, au tamaa ya kula. Kwa kuwa inaambatana na kuomba chakula, hapa inaelekea kwenye hamu au tamaa; tafsiri hii inaeleza maana hiyo kwa Kiswahili cha kawaida bila kuihusisha na dhana ya nafsi isiyo ya mwili.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika muktadha wa kutamani chakula
  choice: ili kutosheleza tamaa yao
  alternative: kwa ajili yao wenyewe; kwa ajili ya nafsi yao; kwa ajili ya hamu yao
  rationale: Muktadha wa jangwa na ombi la chakula unaelekeza kwenye hamu au tamaa ya kula. Hata hivyo, kwa kuwa נֶפֶשׁ pia inaweza kumaanisha mtu mwenyewe, uwezekano huo umehifadhiwa katika tanbihi badala ya kuufuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mioyoni mwao” ni ya asili kuliko umoja wa kijumla wa Kiebrania. “Tamaa” huhifadhi uzito wa kimaadili wa muktadha, huku tanbihi ikihifadhi uwezekano mpana wa נֶפֶשׁ.
