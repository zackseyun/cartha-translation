lexical_decisions:
- source_word: אֲשֶׁר
  choice: alipoweka
  rationale: Katika muktadha wa kukumbuka matendo ya Mungu (mistari 42–43), kiunganishi hiki kinaeleweka kwa maana ya wakati. Muundo wa ‘alipo-’ ni wa asili katika Kiswahili na unaunganisha neno hilo na kitenzi.
- source_word: שָׂם
  choice: weka
  rationale: Kitenzi שׂוּם kwa kawaida humaanisha kuweka. ‘Weka’ huhifadhi taswira halisi bila kuongeza tafsiri ya ‘kufanya’ ishara.
- source_word: בְּמִצְרַיִם
  choice: nchini Misri
  rationale: Herufi ב hapa inaonyesha mahali, si uadui. ‘Nchini Misri’ ni usemi wa kawaida wa Kiswahili kwa eneo la nchi.
- source_word: אֹתוֹתָיו
  choice: ishara zake
  rationale: ‘Ishara’ huhifadhi maana ya אוֹת na kuitofautisha na מוֹפֵת katika mstari huohuo.
- source_word: וּמוֹפְתָיו
  choice: na maajabu yake
  rationale: ‘Maajabu’ ni neno la kawaida na lenye hadhi kwa mambo ya kushangaza yenye nguvu za Mungu, huku likibaki tofauti na ‘ishara’.
- source_word: בִּשְׂדֵה
  choice: katika mashamba ya
  rationale: Ingawa שָׂדֶה ni umbo la umoja, pamoja na jina la mahali hurejelea uwanda au maeneo ya mashamba yanayolizunguka; wingi ni wa asili katika Kiswahili.
- source_word: צֹעַן
  choice: Soani
  rationale: Jina la mahali limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili badala ya kubadilishwa kuwa jina la Kigiriki Tanis.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa mistari miwili unahifadhi usambamba wa kishairi. Alama ya tanbihi imewekwa baada ya jina Soani, ambalo ndilo tanbihi inalofafanua.
