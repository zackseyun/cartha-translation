  text: when he set his signs in Egypt[a], and his wonders in the fields of Zoan.
translation:
  language: sw
  text: 'alipoweka ishara zake nchini Misri,

    na maajabu yake katika mashamba ya Soani.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Soani ni mji wa Misri, ambao mara nyingi hutambulishwa kuwa Tanis.
