  yaml_path: translation/ot/psalms/078/060.yaml
  text: So he abandoned the tabernacle of Shiloh[b][a], the tent where he dwelt among mankind.
translation:
  language: sw
  text: 'Basi akaiacha maskani ya Shilo,

    hema aliloliweka miongoni mwa wanadamu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hema ambamo alikaa miongoni mwa wanadamu.”
    reason: Usomaji wa kimuktadha huchukua hema kuwa mahali pa kukaa kwa Mungu; kitenzi cha Kiebrania pia kinaweza kumaanisha kwamba aliliweka au alilifanya likae miongoni mwa wanadamu.
lexical_decisions:
- source_word: וַיִּטֹּשׁ
  choice: akaiacha
  rationale: Kitenzi נטשׁ kina maana ya kuacha au kutupa. “Akaiacha” ni Kiswahili cha kawaida chenye uzito unaofaa bila kuongeza wazo la uharibifu.
- source_word: מִשְׁכַּן
  choice: maskani
  rationale: “Maskani” huhifadhi maana ya mahali pa kukaa kwa Mungu na pia istilahi ya ibada, huku ikitofautishwa na אֹהֶל, “hema,” katika mstari sambamba.
- source_word: שִׁלֹה
  choice: Shilo
  rationale: Jina la mahali limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: אֹהֶל
  choice: hema
  rationale: “Hema” ni tafsiri ya moja kwa moja na ya kawaida, na inadumisha utofauti wa kishairi na “maskani.”
- source_word: שִׁכֵּן
  choice: alilolisimamisha
  rationale: Muundo wa Piel hapa unaweza kueleza kulifanya hema likae au kuliweka mahali; “alilolisimamisha” ni njia ya asili ya Kiswahili ya kusema kwamba aliliweka hema humo, bila kupoteza picha ya hema.
- source_word: בָּאָדָם
  choice: miongoni mwa wanadamu
  rationale: אָדָם limetumiwa kwa maana ya kijumla kuhusu jamii ya binadamu, si mwanamume mmoja. “Wanadamu” ni sahihi na ya kawaida katika Kiswahili cha kisasa.
theological_decisions:
- issue: Kinachorejelewa na lugha ya kukaa au kuweka
  choice: Hema ndilo kitu ambacho Mungu alikisimamisha miongoni mwa wanadamu.
  alternative: Hema linaweza kuelezwa kuwa mahali ambapo Mungu alikaa miongoni mwa wanadamu.
  rationale: 'שִׁכֵּן ni umbo la kisababishi na אֹהֶל linaweza kueleweka kuwa yambwa lililotangulizwa: “hema alilolifanya likae/alilolisimamisha.” Hata hivyo, tafsiri ya kitheolojia ya Mungu kukaa katika hema hilo ina historia ndefu na inahifadhiwa katika tanbihi.'
- issue: Maana ya אָדָם
  choice: wanadamu
  alternative: binadamu
  rationale: Neno la Kiebrania hapa ni la kijumla kwa watu wote. Wingi wa Kiswahili “wanadamu” huwasilisha maana hiyo bila kulifanya lihusu jinsia ya kiume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa mistari umehifadhi usambamba wa “maskani” na “hema.”
