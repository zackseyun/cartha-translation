  text: He gave his people over to the sword[b][a], and was enraged with his inheritance.
translation:
  language: sw
  text: Akawatia watu wake mikononi mwa upanga[a], akaughadhibikia urithi wake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, aliwakabidhi waangamizwe kwa upanga.
    reason: idiomatic_explanation
  - marker: b
    text: Au, “akawa na ghadhabu kali dhidi ya urithi wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסְגֵּר
  choice: akawakabidhi
  rationale: Hifili ya סגר hapa ina maana ya kuwatia watu chini ya mamlaka ya mwingine au ya kitu fulani. “Akawakabidhi” inadumisha nguvu ya kisababishi na inaeleweka kwa Kiswahili cha sasa.
- source_word: לַחֶרֶב
  choice: wauawe kwa upanga
  rationale: חֶרֶב ni “upanga” na hapa inawakilisha kifo cha jeuri vitani. Kuongeza “wauawe” kunaweka wazi maana ya kishairi ya kukabidhiwa kwa upanga bila kuondoa taswira ya Kiebrania.
- source_word: עַמּוֹ
  choice: watu wake
  rationale: עַם pamoja na kiambishi cha nafsi ya tatu umoja wa kiume humaanisha moja kwa moja “watu wake,” yaani watu wa Mungu katika simulizi la kihistoria la zaburi.
- source_word: וּבְנַחֲלָתוֹ
  choice: urithi wake
  rationale: נַחֲלָה humaanisha “urithi” na hapa ni jina la agano kwa Israeli. Neno “urithi” linahifadhi taswira ya watu walio mali ya pekee ya Mungu.
- source_word: הִתְעַבָּר
  choice: akaughadhibikia
  rationale: Hitpaeli ya עבר katika nahau hii huonyesha hasira kali. “Akaughadhibikia” ni neno lenye hadhi linaloeleza ukali wa hasira bila kufifisha wala kupanua maana.
theological_decisions:
- issue: Majina ya agano yanayotumiwa kwa Israeli
  choice: watu wake ... urithi wake
  alternative: taifa lake ... mali yake
  rationale: 'Maneno hayo mawili yanadumisha mvutano wa kitheolojia: hukumu ya Mungu inawapata wale ambao bado wanaitwa watu wake na urithi wake.'
- issue: Nguvu ya hasira ya Mungu
  choice: akaughadhibikia
  alternative: akawakasirikia sana
  rationale: Chaguo hili linahifadhi nguvu ya הִתְעַבָּר huku likiepuka maelezo yanayopunguza hasira hiyo au kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Wauawe kwa upanga” linafafanua matumizi ya upanga kama ishara ya kifo vitani; tanbihi inahifadhi tafsiri iliyo karibu zaidi na muundo wa Kiebrania.
