  text: לְמַ֤עַן יֵדְע֨וּ דּ֣וֹר אַ֭חֲרוֹן בָּנִ֣ים יִוָּלֵ֑דוּ יָ֝קֻ֗מוּ וִֽ/יסַפְּר֥וּ לִ/בְנֵי/הֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/006.yaml
  text: so that a later generation might know[a], children yet to be born, and might arise and tell their children,
translation:
  language: sw
  text: ili kizazi cha baadaye kijue—watoto watakaozaliwa—nao wainuke na kuwasimulia watoto wao,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן
  choice: ili
  rationale: Kiunganishi hiki kinaonyesha kusudi au matokeo yaliyokusudiwa; “ili” ni cha kawaida na huhifadhi nguvu hiyo.
- source_word: יֵדְעוּ
  choice: kijue
  rationale: Hali ya utegemezi baada ya “ili” huwasilisha kwa kawaida kusudi linaloonyeshwa na kitenzi cha Kiebrania.
- source_word: דּוֹר אַחֲרוֹן
  choice: kizazi cha baadaye
  rationale: Kirai hiki kinamaanisha kizazi kitakachofuata au cha wakati ujao, si lazima kizazi cha mwisho kwa maana ya kieskatolojia.
- source_word: בָּנִים יִוָּלֵדוּ
  choice: watoto watakaozaliwa
  rationale: Nomino ya Kiebrania yenye umbo la kiume inarejelea wazao kwa ujumla katika muktadha huu, na kitenzi cha kutendwa chenye maana ya wakati ujao kimehifadhiwa kwa “watakaozaliwa.”
- source_word: יָקֻמוּ
  choice: wainuke
  rationale: Kitenzi kinaonyesha kuinuka na kuchukua hatua kama kizazi kinachofuata, wala si kusimama kimwili tu.
- source_word: וִיסַפְּרוּ
  choice: na kuwaeleza
  rationale: Katika muktadha huu, kitenzi kinahusu kuwasimulia au kuwaeleza kizazi kinachofuata; “kuwaeleza” ni Kiswahili cha kawaida na kinahitaji mtendewa anayetajwa.
- source_word: לִבְנֵיהֶם
  choice: watoto wao
  rationale: Kama ilivyo kwa בָּנִים, neno hili linamaanisha watoto au wazao kwa ujumla, si wana wa kiume pekee.
theological_decisions:
- issue: Lugha ya wazao yenye umbo la kiume (בָּנִים / לִבְנֵיהֶם)
  choice: Kutafsiri kwa maana jumuishi kama “watoto” na “watoto wao”
  alternative: “wana” na “wana wao”
  rationale: Maumbo ya kiume ya Kiebrania yanaweza kuwakilisha watoto wote. Hoja ya mstari ni kuendeleza maarifa kutoka kizazi kimoja hadi kingine, si kuwahusu watoto wa kiume pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Yaani” linaweka wazi kwamba “watoto watakaozaliwa” linafafanua “kizazi cha baadaye,” huku “nao” likihifadhi mabadiliko kutoka kizazi kama kundi moja kwenda kwa watoto hao kama watu wengi.
