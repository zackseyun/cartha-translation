  text: 'Aliyatoa mazao yao kwa nzige waharibuo,

    na matunda ya kazi yao kwa nzige.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “taabu yao.” Neno la Kiebrania linaweza kumaanisha taabu yenyewe au kile kilichopatikana kwa taabu.
