lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Aliwapa
  rationale: Kitenzi נתן kimefasiriwa kwa maana yake ya moja kwa moja, ‘alitoa/aliwapa’; katika muktadha huu kitu kilichomilikiwa na watu kinatolewa kwa wadudu kama hukumu.
- source_word: לֶחָסִיל
  choice: nzige walao
  rationale: חָסִיל ni mdudu anayeteketeza mazao, na katika masimulizi ya mapigo mara nyingi hueleweka kuwa aina ya nzige. ‘Nzige walao’ huonyesha kazi yake ya uharibifu bila kudai utambulisho wa kisayansi ulio hakika.
- source_word: יְבוּלָם
  choice: mazao yao
  rationale: יְבוּלָם humaanisha mavuno au mazao ya ardhi; ‘mazao yao’ ni Kiswahili cha kawaida na kinafaa katika muktadha wa kilimo.
- source_word: וִיגִיעָם
  choice: matunda ya taabu yao
  rationale: יְגִיעַ inaweza kumaanisha taabu yenyewe au kile kilichopatikana kwa taabu. Kwa kuwa kitu hicho kinapewa nzige na kinakwenda sambamba na ‘mazao,’ maana ya matokeo ya kazi ndiyo ya asili zaidi hapa, huku ‘taabu’ ikidumisha picha ya juhudi.
- source_word: לָאַרְבֶּה
  choice: nzige warukao kwa makundi
  rationale: אַרְבֶּה ni neno la kawaida kwa nzige. Ufafanuzi ‘warukao kwa makundi’ unatofautisha istilahi hii na חָסִיל na kuonyesha tabia ya nzige bila kudai kuwa Kiebrania kinataja aina mahususi ya kisayansi.
