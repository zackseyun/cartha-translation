  text: וְ/ה֤וּא רַח֨וּם יְכַפֵּ֥ר עָוֺן֮ וְֽ/לֹא יַ֫שְׁחִ֥ית וְ֭/הִרְבָּה לְ/הָשִׁ֣יב אַפּ֑/וֹ וְ/לֹֽא יָ֝עִיר כָּל חֲמָתֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/038.yaml
  text: But he[a], being compassionate, made atonement for iniquity and did not destroy; he often turned back his anger and did not stir up all his wrath.
translation:
  language: sw
  text: Lakini yeye[a], kwa kuwa ni mwenye huruma, alifanya upatanisho kwa ajili ya uovu, wala hakuwaangamiza; mara nyingi aliizuia hasira yake, wala hakuiamsha ghadhabu yake yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliusamehe uovu.” Kitenzi cha Kiebrania hutumiwa kwa kawaida kumaanisha kufanya upatanisho; kwa hiyo tafsiri kuu huhifadhi uzito huo wa maana.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחוּם
  choice: mwenye huruma
  rationale: Hueleza tabia ya rehema yenye huruma; usemi huu ni wa kawaida, wa heshima, na unaeleweka katika Kiswahili cha sasa.
- source_word: יְכַפֵּר
  choice: alifunika
  rationale: Kitenzi כפר katika Piel kinaweza kumaanisha kufanya upatanisho au kufunika/kuondoa hatia. ‘Alifunika’ hudumisha taswira ya Kiebrania na uzito wa kitheolojia bila kutaja utaratibu ambao mstari hauuelezi.
- source_word: עָוֺן
  choice: uovu wao
  rationale: עָוֹן inaweza kumaanisha uovu, dhambi, au hatia. ‘Uovu wao’ ni Kiswahili cha kawaida na muktadha unaonyesha kuwa kinachorejelewa ni uovu wa watu waliotajwa katika mistari iliyotangulia.
- source_word: יַשְׁחִית
  choice: hakuwaangamiza
  rationale: Hiphil ya שחת hapa inaeleza hukumu ya kuharibu kabisa; ‘kuwaangamiza’ ni wazi na huweka watu waliokusudiwa kuwa yambwa.
- source_word: וְהִרְבָּה
  choice: mara nyingi
  rationale: הִרְבָּה pamoja na kitenzi-jina huonyesha tendo linalorudiwa au kufanywa mara nyingi.
- source_word: לְהָשִׁיב אַפּוֹ
  choice: aliizuia hasira yake
  rationale: Kwa neno ni ‘kuirudisha hasira yake.’ Kiswahili ‘aliizuia’ huwasilisha kwa kawaida tendo la kuirudisha nyuma au kutoiacha itekeleze hukumu.
- source_word: יָעִיר
  choice: kuiamsha
  rationale: Hiphil ya עור ni kuamsha au kuchochea; ‘kuiamsha’ huhifadhi sitiari ya asili.
- source_word: כָּל חֲמָתוֹ
  choice: ghadhabu yake yote
  rationale: Tafsiri hii hufuata kwa karibu כָּל ‘yote’ na חֵמָה ‘ghadhabu kali.’
theological_decisions:
- issue: Maana ya כפר katika zaburi ya kihistoria isiyoeleza ibada ya dhabihu
  choice: alifunika uovu wao
  alternative: aliwasamehe uovu wao; alifanya upatanisho kwa ajili ya uovu wao
  rationale: ‘Alifunika’ huhifadhi uhusiano wa כפר na kufunika au kuondoa hatia na haipunguzi maana kuwa msamaha tu. Tanbihi inaonyesha tafsiri mbadala zinazowezekana bila kulazimisha utaratibu maalumu wa upatanisho ambao mstari wenyewe hautaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa kwa vifungu viwili vinavyolingana; maneno mazito ya kibiblia yametumiwa pale yanapohitajika bila kufanya sentensi kuwa ya kizamani.
