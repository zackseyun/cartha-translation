- from: Lakini yeye, kwa kuwa ni mwenye huruma, alifunika[a] uovu wao wala hakuwaangamiza; mara nyingi aliizuia hasira yake, wala hakuiamsha ghadhabu yake yote.
  to: Lakini yeye[a], kwa kuwa ni mwenye huruma, alifanya upatanisho kwa ajili ya uovu, wala hakuwaangamiza; mara nyingi aliizuia hasira yake, wala hakuiamsha ghadhabu yake yote.
  rationale: Replaced the misleadingly literal “alifunika uovu wao” with an idiomatic formal rendering that preserves the atonement sense of כפר. The possessive was omitted because it is not explicit in the Hebrew. The remaining parallel clauses and the distinction between hasira and ghadhabu are retained.
