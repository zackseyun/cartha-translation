  text: וַ/יִּשְׁכְּח֥וּ עֲלִילוֹתָ֑י/ו וְ֝/נִפְלְאוֹתָ֗י/ו אֲשֶׁ֣ר הֶרְאָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/011.yaml
  text: They forgot his deeds[b][a], and his wonders that he had shown them.
translation:
  language: sw
  text: Walisahau matendo yake[a], na maajabu yake[b] aliyowaonyesha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vitendo vyake.”
    reason: lexical_alternative
  - marker: b
    text: Au “matendo yake ya ajabu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכְּחוּ
  choice: Walisahau
  rationale: Qal wayyiqtol, nafsi ya tatu wingi, inaendeleza simulizi la wakati uliopita. “Walisahau” ni tafsiri ya moja kwa moja na ya kawaida; “walipuuza” ingeongeza wazo lisilosemwa wazi.
- source_word: עֲלִילוֹתָיו
  choice: matendo yake
  rationale: עֲלִילוֹת hurejelea matendo au mambo yaliyofanywa. “Matendo” ni neno pana, la asili katika Kiswahili, linalofaa kwa matendo ya Mungu katika historia.
- source_word: וְנִפְלְאוֹתָיו
  choice: na maajabu yake
  rationale: Neno hili, linalotokana na פלא, humaanisha matendo ya ajabu au ya kustaajabisha. “Maajabu” huhifadhi upana wake bila kulibana kuwa miujiza pekee.
- source_word: אֲשֶׁר
  choice: aliyo-
  rationale: Kirejeshi cha Kiswahili kimeunganishwa kwa kawaida na kitenzi “aliyowaonyesha,” kikianzisha kishazi kinachorejelea maajabu.
- source_word: הֶרְאָם
  choice: aliyowaonyesha
  rationale: Hiphil perfect, nafsi ya tatu umoja pamoja na kiambishi cha nafsi ya tatu wingi, maana yake halisi ni “aliwafanya waone,” na kwa Kiswahili cha kawaida ni “aliwaonyesha.” Muundo wa kirejeshi unaonyesha kuwa ni maajabu ambayo tayari alikuwa amewaonyesha.
theological_decisions:
- issue: Kirejelewa cha viambishi vya umilikaji
  choice: 'Viambishi vinamrejelea Mungu: “matendo yake ... maajabu yake.”'
  alternative: Kutaja wazi “matendo ya Mungu ... maajabu ya Mungu.”
  rationale: Katika muktadha wa zaburi, Israeli inakumbushwa matendo ya BWANA na kushindwa kwake kuyakumbuka. Kuhifadhi viwakilishi vya Kiebrania huendeleza utofautishaji huo bila kuongeza ufafanuzi ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Matendo” na “maajabu” ni maneno yanayoeleweka kwa urahisi na yanahifadhi tofauti ya msamiati wa Kiebrania. Alama zote za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
