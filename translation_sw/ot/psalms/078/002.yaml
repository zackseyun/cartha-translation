lexical_decisions:
- source_word: אֶפְתְּחָה
  choice: Nitafungua
  rationale: Umbo la nafsi ya kwanza katika ushairi lina maana ya hiari au wakati ujao; “Nitafungua” ni la kawaida na linadumisha taswira ya Kiebrania.
- source_word: בְמָשָׁל
  choice: kwa mfano
  rationale: מָשָׁל inaweza kumaanisha methali, mfano, au usemi wa kitamathali. “Kwa mfano” ni Kiswahili cha kawaida kinachofaa hapa sambamba na “mafumbo,” huku tofauti za maana zikihifadhiwa katika tanbihi.
- source_word: פִּי
  choice: kinywa changu
  rationale: Tafsiri halisi ya taswira hiyo ni ya kawaida katika Kiswahili na haibadilishi neno kuwa dhana pana ya hotuba.
- source_word: אַבִּיעָה
  choice: nitatamka
  rationale: Hifili ya נבע ina wazo la kububujisha na, kwa njia ya kitamathali, kutoa maneno. “Nitatamka” ni wazi na yenye hadhi katika muktadha huu.
- source_word: חִידוֹת
  choice: mafumbo
  rationale: חִידָה ni fumbo au usemi wenye maana isiyo wazi mara moja. “Mafumbo” linafaa kwa Kiswahili cha sasa na linahifadhi hali ya usemi wa kifumbo.
- source_word: מִנִּי קֶדֶם
  choice: ya tangu zamani
  rationale: Kirai hiki hurejelea nyakati za kale bila kulazimisha maana ya mwanzo kabisa; “ya tangu zamani” ni ya asili na sahihi.
theological_decisions:
- issue: Uhusiano wa mstari huu na Mathayo 13:35 na maana ya מָשָׁל / חִידוֹת
  choice: Kutafsiri Kiebrania kwa “mfano” na “mafumbo” bila kukipatanisha kimakusudi na namna ya nukuu ya Kigiriki.
  alternative: “Nitafungua kinywa changu kwa methali; nitatamka maneno ya siri ya zamani” au “Nitasema kwa mifano; nitatangaza mambo yaliyofichwa tangu zamani.”
  rationale: Kiebrania chenyewe kinazungumzia mafundisho ya kitamathali na ya kifumbo kutoka nyakati za kale. Tanbihi inaonyesha uhusiano na Mathayo, lakini matini kuu hailazimishwi kufuata tafsiri ya baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo sambamba wa vipande viwili na taswira halisi ya “kufungua kinywa” vimehifadhiwa; alama za tanbihi zimewekwa karibu na maneno yanayohusika.
