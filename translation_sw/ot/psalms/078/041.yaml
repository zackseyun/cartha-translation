  text: Walirudi nyuma tena na kumjaribu Mungu; wakamchokoza[a] Mtakatifu wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamwekea mipaka Mtakatifu wa Israeli.” Kitenzi cha Kiebrania ni nadra na maana yake si hakika; huenda pia kikamaanisha “wakaweka alama juu yake.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: Walirudi nyuma tena
  rationale: Kitenzi שׁוב hapa kinaonyesha kurudia mwenendo wao wa awali wa kutokuwa waaminifu. ‘Walirudi nyuma tena’ ni lugha ya kawaida inayohifadhi wazo la kurudia kosa.
- source_word: וַיְנַסּוּ
  choice: na kumjaribu
  rationale: נסה kwa kawaida humaanisha kumjaribu au kumtia katika jaribu. ‘Kumjaribu Mungu’ ni usemi wa asili na unaoeleweka katika Kiswahili cha Biblia.
- source_word: אֵל
  choice: Mungu
  rationale: אֵל hapa ni jina la Mungu wa Israeli; ‘Mungu’ ni tafsiri wazi bila kuongeza maana ya ‘mwenye nguvu’ ambayo haijalazimishwa na muktadha.
- source_word: וּקְדוֹשׁ יִשְׂרָאֵל
  choice: Mtakatifu wa Israeli
  rationale: Hili ni jina maalumu la kibiblia linalosisitiza utakatifu wa Mungu na uhusiano wake na Israeli.
- source_word: הִתְווּ
  choice: wakamchokoza
  rationale: Kitenzi hiki ni nadra na maana yake si hakika. Katika usambamba na ‘kumjaribu Mungu,’ ‘wakamchokoza’ huonyesha tendo la uasi na uchokozi dhidi ya Mungu bila kudai kwamba uwezo wake uliwekewa mipaka.
theological_decisions:
- issue: Maana ya kitenzi kigumu הִתְווּ
  choice: wakamchokoza
  alternative: wakamwekea mipaka; wakaweka alama juu yake
  rationale: ‘Wakamchokoza’ inafaa usambamba wa kishairi na tendo la kumjaribu Mungu. Hata hivyo, kwa kuwa kitenzi cha Kiebrania ni nadra na kimefasiriwa kwa njia tofauti, maana mbadala muhimu zimehifadhiwa katika tanbihi badala ya kuondoa utata wake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nuktamkato umetumiwa kuonyesha usambamba wa kishairi kati ya kumjaribu Mungu na kumchokoza Mtakatifu wa Israeli.
