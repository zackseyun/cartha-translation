translation:
  language: sw
  text: Aliutia nguvu zake utumwani,[a] na fahari yake[b] mkononi mwa adui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Aliikabidhi nguvu zake utumwani.” Huenda usemi huu unadokeza sanduku la agano kama ishara ya nguvu za Mungu kati ya Israeli.
    reason: lexical_alternative
  - marker: b
    text: Au, “utukufu wake.” Neno la Kiebrania linaweza kumaanisha fahari, utukufu, au uzuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Aliutia
  rationale: Kitenzi נתן katika mfululizo wa masimulizi kina maana ya kutoa au kukabidhi. Pamoja na ‘utumwani,’ muundo ‘aliutia’ ni wa asili katika Kiswahili na hauongezi ufafanuzi usio katika Kiebrania.
- source_word: לַשְּׁבִי
  choice: utumwani
  rationale: שְׁבִי hapa inaelekea kumaanisha hali au mamlaka ya utekwaji. ‘Utumwani’ ni Kiswahili cha kawaida kinachowasilisha kutiwa katika hali ya kutekwa.
- source_word: עֻזּוֹ
  choice: nguvu zake
  rationale: עֹז humaanisha nguvu au uweza. ‘Nguvu zake’ huhifadhi usemi wa kishairi bila kuutambulisha moja kwa moja kuwa sanduku la agano au patakatifu.
- source_word: וְתִפְאַרְתּוֹ
  choice: na fahari yake
  rationale: תִּפְאֶרֶת inaweza kumaanisha fahari, utukufu, au uzuri. ‘Fahari’ huonyesha ukuu na heshima, na kuhifadhi uwezekano mpana wa neno hilo.
- source_word: בְיַד
  choice: mkononi mwa
  rationale: בְיַד ni nahau ya kuwa chini ya mamlaka ya mtu. ‘Mkononi mwa’ huhifadhi picha halisi ya Kiebrania na inaeleweka vizuri katika Kiswahili.
- source_word: צָר
  choice: adui
  rationale: צַר humaanisha adui, mpinzani, au mtesi. ‘Adui’ ni neno la kawaida, wazi, na lenye kufaa katika ushairi huu.
theological_decisions:
- issue: Ikiwa ‘nguvu zake’ na ‘fahari yake’ zitambuliwe wazi kuwa sanduku la agano, patakatifu, au uwepo wa Mungu uliofunuliwa
  choice: Misemo ya kishairi ‘nguvu zake’ na ‘fahari yake’ imehifadhiwa bila kuitambulisha wazi katika matini kuu.
  alternative: Kutafsiri ‘nguvu zake’ kuwa sanduku la agano, au misemo yote miwili kuwa patakatifu au uwepo wa utukufu wa Mungu.
  rationale: Muktadha huenda ukadokeza sanduku la agano lililotekwa, lakini Kiebrania halitaji kitu hicho moja kwa moja. Tafsiri inahifadhi dokezo na mvutano wa kitheolojia badala ya kuamua maana kwa niaba ya msomaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na mwangwi wa kishairi. Nahau ‘mkononi mwa adui’ imehifadhi picha ya Kiebrania huku ikieleweka kama kuwa chini ya mamlaka ya adui.
