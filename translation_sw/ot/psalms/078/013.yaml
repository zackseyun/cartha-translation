  text: Aliipasua bahari na kuwavusha; aliyasimamisha maji kama rundo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּקַע
  choice: alipasua
  rationale: Kitenzi hiki humaanisha kupasua au kugawanya kwa kufungua. “Alipasua” ni neno la sasa, lenye nguvu, na linalohifadhi taswira ya Kiebrania.
- source_word: יָם
  choice: bahari
  rationale: Nomino hii inarejelea bahari iliyovukwa katika simulizi la kutoka Misri, lakini mstari wenyewe hauitaji kuitaja kwa jina maalumu.
- source_word: וַיַּעֲבִירֵם
  choice: kuwavusha
  rationale: Muundo wa Hifili una maana ya kusababisha wapite. “Kuwavusha” ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya kisababishi.
- source_word: וַיַּצֶּב
  choice: aliyasimamisha
  rationale: Kitenzi kinaonyesha kusababisha kitu kisimame au kikae imara. “Aliyasimamisha” huhifadhi nguvu ya kisababishi na kuendeleza taswira halisi ya shairi.
- source_word: מַיִם
  choice: maji
  rationale: “Maji” ndiyo umbo la kawaida la Kiswahili na linafaa kwa taswira ya maji ya bahari yaliyokusanywa.
- source_word: כְּמוֹ
  choice: kama
  rationale: Hiki ndicho kiunganishi cha kawaida cha ulinganisho katika Kiswahili.
- source_word: נֵד
  choice: rundo
  rationale: Nomino hii humaanisha mkusanyiko au kitu kilicholundikwa. “Rundo” huhifadhi picha ya maji yaliyolundikana bila kuingiza tafsiri ya “ukuta” kutoka mahali pengine.
theological_decisions:
- issue: Taswira ya muujiza wa bahari
  choice: Kudumisha taswira dhahiri ya maji kusimama kama rundo bila kueleza utaratibu wake.
  alternative: Kutafsiri kwa ufafanuzi kuwa Mungu aliyazuia maji, au kuifanya taswira kuwa “kama ukuta.”
  rationale: Mstari unaeleza tendo la Mungu kwa taswira hai ya kutoka Misri. Tafsiri inahifadhi uzito wa kiteolojia na lugha halisi ya shairi bila kuamua mjadala kuhusu namna muujiza ulivyotokea.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kuwavusha” ni cha asili zaidi kuliko “kuwafanya wapite,” huku “rundo” likihifadhi taswira ya Kiebrania. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
