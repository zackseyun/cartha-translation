base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/050.yaml
  text: He leveled a path for his anger[a]; he did not spare their soul from death[c][b], but gave over their life to the plague.
translation:
  language: sw
  text: Aliisawazisha njia kwa ajili ya hasira yake[a]; hakuyaepusha maisha yao[b] na mauti, bali aliyakabidhi maisha yao kwa tauni[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliitengeneza njia kwa ajili ya ghadhabu yake.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “nafsi yao”; hapa maana yake ni “maisha yao.”
    reason: lexical_alternative
  - marker: c
    text: Au, “ugonjwa wa kuambukiza wenye kuua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְפַלֵּס
  choice: aliitengeneza
  rationale: Piel ya פלס huonyesha kutengeneza au kusawazisha njia. Katika Kiswahili, “aliitengeneza njia” huhifadhi taswira ya kuandaa njia bila kuwa isiyo ya kawaida.
- source_word: נָתִיב
  choice: njia
  rationale: נָתִיב ni njia au kijia. “Njia” ni ya kawaida na inafaa katika sitiari hii.
- source_word: לְאַפּוֹ
  choice: kwa ajili ya hasira yake
  rationale: אַף hapa ni hasira, si pua kwa maana halisi. Kirai hiki kinahifadhi wazo la njia iliyoandaliwa kwa hasira yake.
- source_word: לֹא חָשַׂךְ
  choice: hakuyahifadhi
  rationale: חשׂך katika muktadha huu ni kutohifadhi au kutonusuru. “Hakuyahifadhi” huambatana kwa asili na “maisha yao.”
- source_word: מִמָּוֶת
  choice: na kifo
  rationale: מן baada ya kitenzi chenye maana ya kuhifadhi huonyesha jambo ambalo mtu anaokolewa nalo; Kiswahili cha kawaida husema “kuhifadhi na kifo.”
- source_word: נַפְשָׁם
  choice: maisha yao
  rationale: נֶפֶשׁ hapa humaanisha uhai au maisha yao, si lazima nafsi isiyo ya kimwili.
- source_word: וְחַיָּתָם
  choice: maisha yao
  rationale: חַיָּה hapa ni uhai wao katika usambamba na נַפְשָׁם. “Maisha yao” ni wazi na huhifadhi maana hiyo.
- source_word: לַדֶּבֶר
  choice: kwa tauni
  rationale: דֶּבֶר ni ugonjwa wa kuambukiza wenye kuleta vifo, yaani tauni. Neno hili ni mahsusi na linafaa katika muktadha wa hukumu.
- source_word: הִסְגִּיר
  choice: aliyakabidhi
  rationale: Hiphil ya סגר inaweza kumaanisha kutoa au kukabidhi kitu chini ya mamlaka ya kingine. “Aliyakabidhi” huonyesha tendo la kuyaacha maisha yao mikononi mwa tauni.
theological_decisions:
- issue: Lugha ya kisitiari kuhusu hasira ya Mungu
  choice: Kuhifadhi taswira ya kutengeneza njia kwa ajili ya hasira yake.
  alternative: Aliiacha hasira yake iende bila kizuizi.
  rationale: Kiebrania kinatumia sitiari halisi ya njia. Tafsiri haiififishi wala kuongeza dai la kiteolojia lisilokuwamo katika maandishi.
- issue: Maana ya נֶפֶשׁ
  choice: maisha yao
  alternative: nafsi yao
  rationale: Katika muktadha wa kifo na tauni, neno hili hurejelea uhai wa kufa; “nafsi” lingeweza kueleweka kama sehemu isiyo ya kimwili na hivyo kuingiza maana isiyolazimishwa na Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya njia imehifadhiwa; “hasira” ni ya sasa na wazi, huku “tauni” ikitoa maana mahsusi ya דֶּבֶר.
