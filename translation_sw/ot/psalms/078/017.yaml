  yaml_path: translation/ot/psalms/078/017.yaml
  text: Yet they continued to sin against him[a], rebelling against the Most High in the dry land.
translation:
  language: sw
  text: Lakini walizidi kumtendea dhambi, wakimwasi Aliye Juu Zaidi katika nchi kame.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹסִיפוּ עוֹד
  choice: Lakini walizidi
  rationale: Muunganiko huu unaonyesha kwamba waliendelea au wakaongeza kutenda dhambi licha ya matendo ya Mungu yaliyotangulia. “Lakini walizidi” ni Kiswahili cha kawaida kinachobeba mwendelezo na uzito wa uasi katika muktadha.
- source_word: לַחֲטֹא לוֹ
  choice: kumtendea dhambi
  rationale: Kihusishi ל pamoja na kiwakilishi humwelekeza Mungu kama yule aliyetendewa dhambi. “Kumtendea dhambi” ni usemi wa asili wa Kiswahili unaohifadhi maana hiyo.
- source_word: לַמְרוֹת
  choice: wakimwasi
  rationale: Kitenzi מרה humaanisha kuasi au kukaidi. Umbo la “wakimwasi” linaonyesha namna walivyoendelea kumtendea dhambi bila kuligeuza kuwa tendo lisilohusiana.
- source_word: עֶלְיוֹן
  choice: Aliye Juu Zaidi
  rationale: Ni cheo cha Mungu kinachoonyesha ukuu wake kuliko wote. Tafsiri hii ni wazi, yenye heshima, na hudumisha uzito wa cheo hicho.
- source_word: בַּצִּיָּה
  choice: katika nchi kame
  rationale: Neno צִיָּה hutaja mahali pakavu au penye ukame. “Nchi kame” hudumisha maana mahususi ya ukavu badala ya kutumia tu neno la jumla “jangwa.”
theological_decisions:
- issue: Tafsiri ya cheo cha Mungu עֶלְיוֹן
  choice: Aliye Juu Zaidi
  alternative: Mungu Mkuu
  rationale: “Aliye Juu Zaidi” huhifadhi kwa karibu wazo la cheo hiki kuwa Mungu ndiye aliye juu kuliko wote, bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili kwa msomaji wa kawaida huku ukihifadhi mwendelezo wa dhambi, uasi wa makusudi, cheo cha Mungu, na taswira ya eneo kame.
