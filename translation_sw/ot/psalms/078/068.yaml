  text: But he chose the tribe of Judah[b][a], Mount Zion which he loved.
translation:
  language: sw
  text: Lakini alichagua kabila la Yuda na Mlima Sayuni alioupenda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina kitenzi kimoja chenye yambwa mbili bila kiunganishi kati yake; pia yaweza kutafsiriwa, “Lakini alichagua kabila la Yuda, Mlima Sayuni alioupenda.”
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: Lakini alichagua
  rationale: Kitenzi בחר humaanisha ‘chagua’. Katika muktadha wa kukataliwa kwa kabila la Yusufu na Efraimu katika mstari uliotangulia, ‘Lakini’ huonyesha kwa kawaida utofauti unaoletwa na waw ya usimulizi.
- source_word: שֵׁבֶט יְהוּדָה
  choice: kabila la Yuda
  rationale: שֵׁבֶט katika muktadha wa makabila ya Israeli ni ‘kabila’; muundo wa Kiebrania unaonyesha kabila linalohusishwa na Yuda.
- source_word: הַר צִיּוֹן
  choice: Mlima Sayuni
  rationale: Hili ndilo jina la mahali linalotumika kwa kawaida katika Kiswahili cha Biblia, huku maana ya הַר, ‘mlima’, ikihifadhiwa.
- source_word: אֲשֶׁר אָהֵב
  choice: alioupenda
  rationale: Kishazi hiki cha uhusiano kinafuata mara moja ‘Mlima Sayuni’ na kwa kawaida kinaufafanua mlima huo.
- source_word: אֶת ... אֶת
  choice: na
  rationale: Kiebrania kinaweka alama ya yambwa tendwa mbele ya ‘kabila la Yuda’ na pia mbele ya ‘Mlima Sayuni’. Kiunganishi ‘na’ kinaonyesha kwa Kiswahili cha kawaida kwamba vyote viwili vinatawaliwa na kitenzi kimoja, bila kurudia ‘alichagua’.
theological_decisions:
- issue: Uhusiano kati ya kuchaguliwa kwa Yuda na Sayuni
  choice: Yuda na Mlima Sayuni zimewasilishwa kama yambwa mbili za kitendo kimoja cha Mungu cha kuchagua.
  alternative: Kuchukulia ‘Mlima Sayuni’ kama maelezo yanayowekwa sambamba na ‘kabila la Yuda’.
  rationale: Kurudiwa kwa אֶת kunaunga mkono yambwa mbili, lakini kutokuwapo kwa kiunganishi kati yake kunaruhusu muundo wa karibu sana. Tafsiri kuu ni ya kawaida na wazi, huku tanbihi ikihifadhi namna fupi ya Kiebrania bila kuipanua kuwa fundisho la kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Lakini’ huleta tofauti na mstari uliotangulia; ‘na’ huondoa uwezekano wa msomaji kudhani kwamba Mlima Sayuni ni jina jingine la kabila la Yuda. Jina ‘Mlima Sayuni’ limeandikwa kwa herufi kubwa kama jina maalumu.
