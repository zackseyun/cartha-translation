  text: Then he rejected the tent of Joseph[b][a], and he did not choose the tribe of Ephraim.
translation:
  language: sw
  text: Ndipo akaikataa hema ya Yosefu[a][b], wala hakulichagua kabila la Efraimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaidharau hema ya Yosefu.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, Efraimu, kabila lililoongoza miongoni mwa makabila yaliyotokana na Yosefu; muktadha unaofuata unaelekea kwenye kuchaguliwa kwa Yuda na Sayuni.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּמְאַס
  choice: Ndipo akaikataa
  rationale: Kitenzi מָאַס humaanisha kukataa, kudharau, au kutupilia mbali. “Akaikataa” ni Kiswahili cha kawaida kinachowasilisha maana ya msingi bila kuzidisha hisia za dharau; “ndipo” linaendeleza mtiririko wa simulizi wa wayyiqtol.
- source_word: בְּאֹהֶל יוֹסֵף
  choice: hema ya Yosefu
  rationale: אֹהֶל ni “hema” kihalisi. Kudumisha taswira hii kunahifadhi ushairi wa Kiebrania bila kuifasiri moja kwa moja kuwa nyumba, ukoo, au eneo la kaskazini.
- source_word: וּבְשֵׁבֶט אֶפְרַיִם
  choice: kabila la Efraimu
  rationale: Ingawa שֵׁבֶט pia inaweza kumaanisha fimbo au fimbo ya kifalme, pamoja na jina la Efraimu na sambamba na “hema ya Yosefu,” maana ya “kabila” ndiyo inayofaa zaidi.
- source_word: לֹא בָחָר
  choice: wala hakulichagua
  rationale: בָּחַר ni kuchagua au kuteua. “Hakulichagua” ni tafsiri ya moja kwa moja, na “wala” linaunganisha kishazi hiki kwa ufasaha na kukataliwa kwa hema ya Yosefu.
theological_decisions:
- issue: Maana ya kihistoria na kiteolojia ya kukataliwa kwa Yosefu/Efraimu
  choice: Kudumisha lugha halisi ya kikabila kuhusu hema ya Yosefu na kabila la Efraimu, huku muktadha unaofuata ukionyesha kuchaguliwa kwa Yuda na Sayuni.
  alternative: Kuitafsiri Yosefu na Efraimu waziwazi kuwa ufalme wote wa kaskazini au kituo chake cha ibada.
  rationale: Zaburi inasimulia historia ya Israeli na, katika mistari inayofuata, inalinganisha Efraimu na kuchaguliwa kwa Yuda/Sayuni. Tafsiri kuu haipaswi kuondoa taswira na majina halisi ya Kiebrania kwa kuingiza ufafanuzi mpana moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Hema,” “kabila,” na majina ya Yosefu na Efraimu huhifadhi taswira na upekee wa chanzo; alama zote za tanbihi zimewekwa katika matini kuu.
