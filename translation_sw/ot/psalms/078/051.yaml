base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/051.yaml
  text: He struck down every firstborn in Egypt[a], the firstfruits of their vigor in the tents of Ham.
translation:
  language: sw
  text: 'Aliwaua wazaliwa wa kwanza wote nchini Misri,

    malimbuko ya nguvu zao[a] katika mahema ya Hamu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, zao la kwanza la nguvu zao za uzazi; hii ni nahau ya Kiebrania inayowarejelea wazaliwa wa kwanza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: Aliwaua
  rationale: Katika muktadha wa pigo la wazaliwa wa kwanza, kitenzi נכה kinaeleza kipigo kilichosababisha kifo. “Aliwaua” huwasilisha wazi nguvu hiyo ya kuangamiza kwa Kiswahili cha kawaida.
- source_word: כָּל בְּכוֹר
  choice: wazaliwa wote wa kwanza
  rationale: Huhifadhi ujumla wa כָּל bila kuongeza jinsia, kwa kuwa neno “wa kiume” halipo wazi katika mstari huu.
- source_word: בְּמִצְרַיִם
  choice: nchini Misri
  rationale: Kiambishi בְּ kinaonyesha mahali; “nchini Misri” ni usemi wa kawaida wa Kiswahili unaolingana na rejeo la kijiografia.
- source_word: רֵאשִׁית אֹנִים
  choice: mwanzo wa nguvu zao
  rationale: Tafsiri hii inahifadhi taswira ya “mwanzo” na “nguvu” katika nahau ya Kiebrania, ambayo humaanisha zao la kwanza la nguvu za kuzaa. Tanbihi inaeleza maana hiyo bila kuibana katika matini kuu.
- source_word: בְּאָהֳלֵי חָם
  choice: katika mahema ya Hamu
  rationale: Huhifadhi taswira ya kishairi na jina la ukoo linalotumiwa kumaanisha Misri, badala ya kulibadilisha kimafafanuzi kuwa “Wamisri.”
theological_decisions:
- issue: Jina la kishairi “Hamu” kwa Misri
  choice: Kuhifadhi “Hamu” katika matini kuu
  alternative: katika makao ya Wamisri; katika makao ya Misri
  rationale: Mstari tayari unaitaja Misri, kisha unatumia “mahema ya Hamu” kama sambamba ya kishairi yenye muktadha wa ukoo. Kulihifadhi jina hilo kunatunza muundo wa zaburi bila kuingiza dai la ziada la kimafundisho.
- issue: Maana ya רֵאשִׁית אֹנִים
  choice: mwanzo wa nguvu zao, pamoja na tanbihi
  alternative: zao la kwanza la nguvu zao; wazaliwa wa kwanza wa nguvu zao
  rationale: Nahau inaunganisha uzaliwa wa kwanza na nguvu za uzazi. Matini kuu inatunza mvutano wa sitiari, huku tanbihi ikieleza maana yake ya kizazi bila kuifanya tafsiri kuwa pana kuliko Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mgawanyo wa mistari unafuata usambamba wa Kiebrania. “Mahema ya Hamu” limehifadhiwa kama taswira ya kishairi, na alama ya tanbihi [a] imewekwa katika matini kuu.
