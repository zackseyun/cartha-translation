  yaml_path: translation/ot/psalms/078/063.yaml
  text: Fire consumed his young men[a], and his virgins were not praised in song.
translation:
  language: sw
  text: Moto uliwateketeza vijana wake wa kiume, na mabikira wake hawakusifiwa kwa nyimbo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakusherehekewa.” Huenda maana yake ni kwamba, kwa sababu ya maangamizi hayo, hapakuwa na nyimbo za harusi kwa wanawake hao vijana.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּרָיו
  choice: vijana wake
  rationale: Neno בָּחוּר humaanisha kwa kawaida vijana wa kiume walio katika nguvu zao; “vijana wake” ni la asili katika Kiswahili na linadumisha ulinganifu na mabikira.
- source_word: אָכְלָה אֵשׁ
  choice: Moto uliwala
  rationale: Kitenzi אָכַל kwa maana ya msingi ni “kula”; moto unapokuwa kiima, humaanisha kuteketeza. “Moto uliwala” kinahifadhi taswira kali ya Kiebrania badala ya kuibadili kuwa maelezo yasiyo ya kitamathali.
- source_word: וּבְתוּלֹתָיו
  choice: na mabikira wake
  rationale: בְּתוּלָה humtaja mwanamke kijana bikira. “Mabikira” kinawakilisha maana hiyo wazi na kinadumisha tofauti na vijana wa kiume.
- source_word: לֹא הוּלָּלוּ
  choice: hawakuimbiwa nyimbo za harusi
  rationale: Pual ya הלל hapa ina wazo la kusifiwa au kusherehekewa; katika muktadha wa mabikira na maangamizi, inaelekea kumaanisha kutokuwapo kwa nyimbo za ndoa. Tafsiri hii ni ya asili na wazi, huku tanbihi ikihifadhi maana pana zaidi.
