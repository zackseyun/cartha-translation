base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/064.yaml
  text: His priests fell by the sword[a], and his widows could not weep.
translation:
  language: sw
  text: 'Makuhani wake walianguka kwa upanga,

    na wajane wake hawakulia.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakuweza kulia.” Kiebrania ni “hawakulia,” jambo ambalo linaweza kuwa taarifa ya moja kwa moja au kumaanisha kwamba maafa hayakuacha nafasi ya maombolezo ya kawaida.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּהֲנָיו
  choice: Makuhani wake
  rationale: כֹּהֵן humaanisha kwa kawaida kuhani; umbo la wingi lenye kiambishi cha nafsi ya tatu umoja limehifadhiwa kwa 'wake'.
- source_word: בַּחֶרֶב
  choice: kwa upanga
  rationale: ב hapa huonyesha chombo au njia ya kifo; 'kwa upanga' ni Kiswahili cha kawaida kinachohifadhi taswira ya Kiebrania.
- source_word: נָפָלוּ
  choice: walianguka
  rationale: נפל kimsingi ni 'kuanguka'; katika muktadha wa vita inaashiria kuuawa, lakini tafsiri hii inahifadhi taswira ya kishairi.
- source_word: וְאַלְמְנֹתָיו
  choice: na wajane wake
  rationale: Kiambishi cha Kiebrania ni cha nafsi ya tatu umoja. 'Wake' kinahifadhi umoja huo badala ya kuugeuza kuwa 'wao'.
- source_word: לֹא תִבְכֶּינָה
  choice: hawakulia
  rationale: Kifungu hiki kwa muundo wake wa moja kwa moja ni 'hawakulia.' Tafsiri hii inalinda utata wa kama ni taarifa ya tukio au dalili ya kwamba maafa yalizuia maombolezo ya kawaida.
theological_decisions:
- issue: Maana ya wajane kutolia
  choice: hawakulia
  alternative: hawakuweza kulia
  rationale: Kiebrania hakitaji wazi kutoweza; kinaweka tu kitenzi katika hali ya ukanushi. Maelezo ya uwezekano kwamba hawakuwa na nafasi ya kuomboleza yamewekwa katika tanbihi ili kutosuluhisha kimya kimya utata wa kishairi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Mpangilio wa mistari unahifadhi usambamba wa kishairi.
