  text: And he built his sanctuary like the heights[b][a], like the earth that he established forever.
translation:
  language: sw
  text: Naye akaijenga patakatifu pake kama vilivyo juu[a], kama dunia aliyoiweka imara milele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kama mbingu za juu” au “kama miinuko mirefu.” Usemi wa Kiebrania ni wa kishairi na unaweza kuibua taswira ya mbingu za juu au miinuko ya milima.
    reason: lexical_alternative
  - marker: b
    text: Au “aliyoiasisi milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Naye akaijenga
  rationale: Umbo la wayyiqtol la בנה linaendeleza mfululizo wa masimulizi; “naye akaijenga” linadumisha mtiririko huo na maana ya moja kwa moja.
- source_word: כְּמוֹ
  choice: kama
  rationale: Kihusishi hiki kinaonyesha ulinganisho, na “kama” ni usemi wa kawaida na wa asili katika Kiswahili.
- source_word: רָמִים
  choice: vilele vya juu
  rationale: Neno hili la kishairi linamaanisha vilivyo juu au miinuko iliyotukuka. “Vilele vya juu” kinahifadhi taswira bila kuamua kwamba ni mbingu au milima hasa.
- source_word: מִקְדָּשׁוֹ
  choice: patakatifu pake
  rationale: מקדש ni mahali patakatifu au patakatifu pa Mungu. “Patakatifu pake” ni pana kuliko “hekalu” na hakufungi rejeo kwenye jengo pekee.
- source_word: כְּאֶרֶץ
  choice: kama dunia
  rationale: Ulinganisho ni na dunia kama kitu chenye uthabiti; “dunia” inafaa zaidi kuliko “nchi” katika usambamba huu wa taswira ya ulimwengu.
- source_word: יְסָדָהּ
  choice: aliyoiweka imara
  rationale: Kitenzi יסד humaanisha kuweka msingi au kuimarisha. Tafsiri hii ni ya asili katika Kiswahili na inaonyesha uthabiti wa dunia; kiambishi cha kike katika Kiebrania kinarejelea dunia.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Neno hili linaeleza kudumu bila mwisho; “milele” linahifadhi nguvu ya kishairi kwa Kiswahili cha sasa.
theological_decisions:
- issue: Rejeo na taswira ya ulinganisho wa patakatifu
  choice: Patakatifu pa Mungu panalinganishwa na vilele vya juu na dunia iliyowekwa imara na kudumu.
  alternative: Patakatifu panalinganishwa hasa na mbingu za juu, au hasa na vilele vya milima.
  rationale: רָמִים ni usemi wa kishairi wenye uwezekano wa kuibua mbingu za juu au miinuko mikubwa. Tafsiri kuu haichagui kwa lazima mojawapo, hivyo inadumisha utata na mvutano wa taswira ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. “Patakatifu pake” huepuka kulibana neno kuwa “hekalu,” na “vilele vya juu” huhifadhi taswira pana ya Kiebrania.
