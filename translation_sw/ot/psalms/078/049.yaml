base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/049.yaml
  text: He sent against them his burning anger[a], fury, indignation, and distress, a band of destructive messengers.
translation:
  language: sw
  text: Aliwapelekea hasira yake kali, ghadhabu, hasira kali, na dhiki—kundi la wajumbe wenye kuleta maafa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kikosi cha malaika wa maafa”; tafsiri ya jadi ni “malaika waovu.” Kiebrania kinaweza kumaanisha wajumbe wanaoainishwa kwa maafa wanayoleta, wala si lazima viumbe waovu kimaadili.
    reason: alternative_reading
lexical_decisions:
- source_word: יְשַׁלַּח
  choice: Aliwaachilia
  rationale: Piel ya שלח inaeleza tendo la Mungu la kutuma au kuachilia hukumu dhidi yao; “aliwaachilia” linafaa kwa vitu vilivyotajwa kama hasira na dhiki na linadumisha nguvu ya kishairi.
- source_word: בָּם
  choice: dhidi yao (imedokezwa na kiambishi -wa-)
  rationale: Katika muktadha huu wa uhasama, בָּם inaonyesha hukumu iliyoelekezwa dhidi yao; Kiswahili hulieleza hilo kwa kawaida kupitia kiambishi cha mtendewa katika “aliwaachilia.”
- source_word: חֲרוֹן אַפּוֹ
  choice: hasira yake kali
  rationale: Nahau ya Kiebrania ina maana ya joto au kuwaka kwa hasira. “Hasira yake kali” ni ya kawaida na yenye nguvu katika Kiswahili cha sasa.
- source_word: עֶבְרָה
  choice: ghadhabu
  rationale: Neno hili huonyesha hasira kali inayofurika; “ghadhabu” hulitofautisha na “hasira” iliyotangulia.
- source_word: וָזַעַם
  choice: ukali
  rationale: זעם huonyesha hasira ya kulaani au ukali wa hukumu. “Ukali” huhifadhi mlundikano wa visawe bila kurudia tu “hasira” au “ghadhabu.”
- source_word: וְצָרָה
  choice: na dhiki
  rationale: צרה ni taabu au dhiki inayowapata walengwa; “dhiki” ni fupi, ya heshima, na inafaa muktadha wa hukumu.
- source_word: מִשְׁלַחַת
  choice: kundi
  rationale: Nomino hii ina maana ya kitu au kikosi kilichotumwa. “Kundi” ni Kiswahili cha kawaida na hudokeza jumuiya iliyotumwa kutekeleza kusudi.
- source_word: מַלְאֲכֵי
  choice: wajumbe
  rationale: מלאך linaweza kumaanisha wajumbe wa kibinadamu au wa kimbinguni. “Wajumbe” huhifadhi upana huo bila kuamua asili yao katika matini kuu.
- source_word: רָעִים
  choice: wenye kuleta maafa
  rationale: Katika muktadha wa hukumu ya Mungu, kivumishi kinaweza kueleza madhara au maafa yanayoletwa, si lazima uovu wa kimaadili. Kauli hii huhifadhi maana ya uharibifu bila kutatua utata kupita kiasi.
theological_decisions:
- issue: Iwapo מַלְאֲכֵי רָעִים humaanisha malaika waovu kimaadili au wajumbe wanaoleta hukumu yenye maafa
  choice: kundi la wajumbe wenye kuleta maafa
  alternative: kundi la malaika waovu; kundi la malaika wa maafa
  rationale: מלאך linaweza kuwa “mjumbe” au “malaika,” na רָעִים linaweza kueleza uovu, ubaya, madhara, au maafa. Matini kuu haidai kwamba Mungu aliwatuma viumbe waovu kimaadili, huku tanbihi ikihifadhi tafsiri mbadala halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wa heshima. Mstari huhifadhi mlundikano wa maneno ya hukumu na utata wa מַלְאֲכֵי רָעִים; alama ya mkwaju huonyesha kuwa kifungu cha mwisho kinafafanua njia au chombo cha hukumu.
