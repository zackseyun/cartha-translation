  text: Wana wa Efraimu[a], wenye silaha, wapiga upinde, walirudi nyuma siku ya vita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waefraimu, wenye silaha na wenye kupiga upinde, walirudi nyuma siku ya vita.” Kiebrania hutumia vifungu viwili vifupi vya kivumishi-tendo, vinavyoweza kutolewa kwa zaidi ya muundo mmoja wa asili katika Kiswahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אֶפְרַיִם
  choice: Wana wa Efraimu
  rationale: Muundo huu unahifadhi nahau ya Kiebrania ya ukoo na kabila, badala ya kuibadili moja kwa moja kuwa jina la watu wa kabila.
- source_word: נוֹשְׁקֵי
  choice: wakiwa wamejihami
  rationale: Kitenzi hiki hapa kinaeleza watu waliojiandaa au kujipatia silaha kwa ajili ya mapigano.
- source_word: רוֹמֵי קָשֶׁת
  choice: wapiga upinde
  rationale: Kwa maana halisi ni watu wanaorusha kwa upinde; usemi huu wa Kiswahili ni mfupi na unaeleweka kama wapiganaji wanaotumia upinde.
- source_word: הָפְכוּ
  choice: walirudi nyuma
  rationale: Huhifadhi picha ya kugeuka au kurudi nyuma vitani bila kutaja wazi zaidi ya Kiebrania sababu au namna ya kushindwa kwao.
- source_word: בְּיוֹם קְרָב
  choice: siku ya vita
  rationale: Ni usemi wa kawaida na wenye hadhi unaowasilisha moja kwa moja wakati wa mapambano.
