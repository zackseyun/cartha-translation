  text: He destroyed their vines with hail[a], and their sycamore trees with frost.
translation:
  language: sw
  text: 'Aliharibu mizabibu yao kwa mvua ya mawe,

    na mikuyu yao kwa baridi kali.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa nzige,” “kwa mawe ya mvua,” au “kwa mvua iliyoganda”; maana ya neno hili adimu la Kiebrania haijulikani kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַהֲרֹג
  choice: Aliharibu
  rationale: Kitenzi kwa msingi humaanisha kuua, lakini kwa kuwa vitu vinavyotendewa ni mizabibu na miti, ‘alihabibu’—yaani ‘aliharibu’—hutoa maana ya kawaida na ya asili bila kuondoa nguvu ya uharibifu.
- source_word: בַּבָּרָד
  choice: kwa mvua ya mawe
  rationale: Kiambishi ב kimetumiwa kuonyesha chombo au njia; ‘kwa mvua ya mawe’ ni Kiswahili cha kawaida na huonyesha kilichosababisha uharibifu.
- source_word: גַּפְנָם
  choice: mizabibu yao
  rationale: Nomino ya pamoja yenye kiambishi cha nafsi ya tatu wingi inarejelea mimea ya mizabibu yao, si lazima mashamba ya mizabibu.
- source_word: וְשִׁקְמוֹתָם
  choice: na mikuyu yao
  rationale: שִׁקְמָה ni aina ya mkuyu (sycamore fig). ‘Mikuyu’ ni neno la kawaida na linaloeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: בַּחֲנָמַל
  choice: kwa baridi kali
  rationale: Neno hili la Kiebrania ni adimu na maana yake haijulikani kwa uhakika. ‘Baridi kali’ linafaa katika usambamba wa kishairi na mvua ya mawe bila kudai uhakika usiokuwapo.
