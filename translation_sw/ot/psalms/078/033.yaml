id: PSA.78.33
reference: Psalms 78:33
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְכַל בַּ/הֶ֥בֶל יְמֵי/הֶ֑ם וּ֝/שְׁנוֹתָ֗/ם בַּ/בֶּהָלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/033.yaml
  text: So he consumed their days in futility[a], and their years in terror.
translation:
  language: sw
  text: Kwa hiyo akazimaliza siku zao katika ubatili[a], na miaka yao katika hofu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa hiyo akazimaliza siku zao kama pumzi, na miaka yao katika hofu ya ghafula.”
    reason: הֶבֶל inaweza kudokeza pumzi au mvuke, na בֶּהָלָה inaweza kujumuisha hofu au taharuki inayokuja ghafula.
lexical_decisions:
- source_word: וַיְכַל
  choice: akazimaliza
  rationale: Kitenzi כלה hapa kina Mungu kama mtendaji anayeeleweka kutokana na muktadha, na humaanisha kumaliza au kufikisha mwisho. “Akazimaliza” ni Kiswahili cha kawaida kinachohifadhi tendo la Mungu bila kudai zaidi ya mstari.
- source_word: בַּהֶבֶל
  choice: katika ubatili
  rationale: הֶבֶל kimsingi ni pumzi au mvuke, na kwa maana ya kitamathali huonyesha hali isiyo na maana, tupu, au ya bure. “Katika ubatili” linaeleza jinsi siku zao zilivyopita bila manufaa, huku uwezekano wa taswira ya pumzi ukihifadhiwa katika tanbihi.
- source_word: יְמֵיהֶם
  choice: siku zao
  rationale: Tafsiri ya moja kwa moja inayohifadhi taswira ya Kiebrania ya muda wa maisha na usambamba wa kishairi.
- source_word: וּשְׁנוֹתָם
  choice: na miaka yao
  rationale: Huhifadhi usambamba wa kishairi kati ya “siku zao” na “miaka yao.”
- source_word: בַּבֶּהָלָה
  choice: katika hofu
  rationale: בֶּהָלָה inaweza kumaanisha hofu, taharuki, fadhaa, au jambo la ghafula. Katika muktadha wa hukumu, “katika hofu” huwasilisha vizuri hali ya kutisha bila kufunga kabisa wazo la ghafula.
theological_decisions:
- issue: Mtendaji anayeeleweka wa kitenzi
  choice: 'Mungu ndiye mtendaji: “akazimaliza siku zao”'
  alternative: Usemi usiotaja mtendaji, kama “siku zao zikaisha”
  rationale: Muktadha unaotangulia unaonyesha kwamba Mungu ndiye anayetekeleza hukumu. Kiambishi cha nafsi ya tatu umoja katika “akazimaliza” kinahifadhi uwakala huo wa Mungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Siku zao” na “miaka yao” zimehifadhiwa ili kudumisha usambamba wa zaburi; “ubatili” ni neno linaloeleweka na linalofaa kwa sajili ya Maandiko.
