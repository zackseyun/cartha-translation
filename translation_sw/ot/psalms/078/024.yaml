  text: He rained down manna on them to eat[a], and gave them the grain of heaven.
translation:
  language: sw
  text: Akawanyeshea mana ili wale, akawapa nafaka ya mbinguni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafaka ya mbingu.” Kirai hiki ni maelezo ya kishairi kuhusu mana; katika tafsiri zinazofafanua zaidi kinaweza kusemwa “chakula kutoka mbinguni” au “mkate kutoka mbinguni” kulingana na vifungu vinavyohusiana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְטֵר
  choice: Akawanyeshea
  rationale: Hifili ya מטר ina maana ya kusababisha mvua inyeshe. “Akawanyeshea” ni Kiswahili cha kawaida kinachohifadhi picha ya kitu kushuka kama mvua.
- source_word: עֲלֵיהֶם
  choice: -wa- katika “akawanyeshea”
  rationale: Kihusishi עַל pamoja na kiambishi cha nafsi kinaingizwa kwa njia ya kawaida katika kitenzi cha Kiswahili, kikionyesha kuwa mana iliwanyeshea wao.
- source_word: מָן
  choice: mana
  rationale: “Mana” ndilo umbo lililozoeleka katika Kiswahili kwa chakula cha jangwani kinachotajwa hapa.
- source_word: לֶאֱכֹל
  choice: ili wale
  rationale: Muundo huu wa kitenzi-jina pamoja na ל unaonyesha kusudi. “Ili wale” huweka wazi kuwa mana ilitolewa kwa ajili ya kuliwa bila kuongeza wazo jingine.
- source_word: דְגַן
  choice: nafaka
  rationale: דגן humaanisha mazao ya nafaka. “Nafaka” ni neno la sasa na linaloeleweka, na linahifadhi sitiari ya Kiebrania.
- source_word: שָׁמַיִם
  choice: mbinguni
  rationale: Katika kirai cha kishairi דְגַן שָׁמַיִם, “ya mbinguni” ni usemi wa asili wa Kiswahili unaodumisha maana iliyoinuliwa kuliko “ya angani.”
- source_word: נָתַן
  choice: akawapa
  rationale: נתן ni kitenzi cha kawaida chenye maana ya kutoa. “Akawapa” pia hujumuisha kwa kawaida yule anayepokea.
- source_word: לָמוֹ
  choice: -wa- katika “akawapa”
  rationale: Umbo hili la kishairi linamaanisha “kwao.” Kiswahili hulieleza kwa kiambishi cha watendewa katika “akawapa.”
theological_decisions:
- issue: Maelezo ya kisitiari ya mana kuwa “nafaka ya mbinguni”
  choice: Kuhifadhi sitiari ya “nafaka ya mbinguni”
  alternative: chakula kutoka mbinguni; mkate kutoka mbinguni
  rationale: Kiebrania kinatumia דגן, “nafaka,” sambamba na mana. Kuhifadhi sitiari hiyo kunatunza ushairi na huepuka kuingiza tafsiri pana kutoka vifungu vinavyohusiana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Vitenzi “akawanyeshea” na “akawapa” vinahifadhi mfululizo wa simulizi wa Kiebrania.
