  text: They spoke against God; they said[a], “Can God prepare a table in the wilderness?”
translation:
  language: sw
  text: Walisema dhidi ya Mungu[a]; wakasema, “Je, Mungu anaweza kuandaa meza jangwani?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walisema juu ya Mungu.” Muundo wa Kiebrania unaweza kutafsiriwa kwa maana isiyoegemea upande, lakini hapa muktadha unaunga mkono maana ya upinzani, ukikazia malalamiko ya Israeli dhidi yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: Walisema
  rationale: Ni kitenzi cha kawaida cha kusimulia tendo la kusema; ‘walisema’ ni cha moja kwa moja na cha asili katika Kiswahili.
- source_word: בֵּאלֹהִים
  choice: dhidi ya Mungu
  rationale: Ingawa kihusishi kinaweza kuruhusu maana isiyoegemea upande ya ‘juu ya Mungu,’ muktadha wa malalamiko na uasi unaunga mkono maana ya kupinga.
- source_word: אָמְרוּ
  choice: wakasema
  rationale: Kitenzi cha kuripoti kinachotanguliza maneno ya moja kwa moja; kukitaja huhifadhi muundo wa Kiebrania wenye vitenzi viwili vya kusema.
- source_word: הֲיוּכַל
  choice: Je, ... anaweza
  rationale: Kiambishi cha swali pamoja na יכל huuliza kuhusu uwezo; muundo huu ni wa kawaida na huhifadhi changamoto kuhusu uwezo wa Mungu.
- source_word: אֵל
  choice: Mungu
  rationale: Hapa ni jina la Mungu linalolingana na אֱלֹהִים; ‘Mungu’ ni tafsiri wazi bila kuongeza ufafanuzi wa ‘Mwenye nguvu.’
- source_word: לַעֲרֹךְ
  choice: kuandaa
  rationale: ערך pamoja na שֻׁלְחָן humaanisha kupanga au kuandaa meza, kwa maana ya kutoa chakula.
- source_word: שֻׁלְחָן
  choice: meza
  rationale: Huhifadhi picha halisi ya meza, badala ya kuifafanua moja kwa moja kuwa chakula.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: Neno hili huonyesha eneo la nyika ambako Israeli walizunguka; ‘jangwani’ ni usemi wa kawaida wa kibiblia katika Kiswahili bila kulazimisha maana ya jangwa la mchanga pekee.
theological_decisions:
- issue: Toni ya maneno ya Israeli kumhusu Mungu
  choice: ‘dhidi ya Mungu,’ kuonyesha maneno ya uasi na upinzani
  alternative: ‘juu ya Mungu’ au ‘kumhusu Mungu’
  rationale: Muktadha wa zaburi unasimulia kutokuamini na kumchokoza Mungu. Tafsiri isiyoegemea upande ingedhoofisha nguvu ya malalamiko, lakini tanbihi huhifadhi uwezekano wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo halisi wa ‘meza jangwani’ umehifadhiwa, na alama ya tanbihi imewekwa baada ya kitenzi cha pili cha kusema kulingana na safu ya mashauriano.
