  text: kwa maana hawakumwamini Mungu, wala hawakuutumainia wokovu wake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶאֱמִינוּ בֵּאלֹהִים
  choice: hawakumwamini Mungu
  rationale: Muundo wa Kiebrania una kitenzi אָמַן pamoja na בְּ, ukionyesha kumwamini au kuweka imani katika Mungu; Kiswahili cha kawaida na cha heshima husema ‘kumwamini Mungu’.
- source_word: בָטְחוּ
  choice: hawakuutumainia
  rationale: בָּטַח hubeba maana ya kutegemea kwa uhakika au kuweka tumaini; ‘kutumainia’ hudumisha ulinganifu na ‘kuamini’ bila kuifanya sentensi kuwa nzito.
- source_word: בִישׁוּעָתוֹ
  choice: wokovu wake
  rationale: יְשׁוּעָה hapa ni tendo au hali ya kuokoa linalotoka kwa Mungu; ‘wokovu wake’ ni tafsiri ya moja kwa moja na iliyozoeleka.
theological_decisions:
- issue: Je, הֶאֱמִינוּ בֵאלֹהִים itafsiriwe ‘hawakumwamini Mungu’ au ‘hawakuamini katika Mungu’?
  choice: hawakumwamini Mungu
  alternative: hawakuamini katika Mungu
  rationale: Kiswahili hutumia ‘kumwamini mtu’ kwa maana ya kuweka imani au tegemeo kwake. Hii inadumisha nguvu ya בְּ ya Kiebrania bila kudokeza tu kukubali kwamba Mungu yupo.
- issue: Maana ya ‘wokovu wake’
  choice: wokovu wake
  alternative: uwezo wake wa kuokoa
  rationale: Nomino ya Kiebrania imehifadhiwa badala ya kufafanuliwa, ili kutosuluhisha kimya kimya kama inarejelea tendo maalumu la ukombozi, msaada wa Mungu, au wokovu kwa maana pana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo sambamba wa Kiebrania umehifadhiwa kwa ‘hawakumwamini ... wala hawakuutumainia ...’.
