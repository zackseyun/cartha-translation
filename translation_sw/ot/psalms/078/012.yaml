  text: Before their fathers he did wonders in the land of Egypt[b][a], in the fields of Zoan.
translation:
  language: sw
  text: Machoni pa baba zao alifanya maajabu katika nchi ya Misri, katika mashamba ya Soani.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mbele ya baba zao.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “shamba la Soani”; yaelekea humaanisha mashamba au eneo linaloizunguka Soani.
