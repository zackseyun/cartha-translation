lexical_decisions:
- source_word: נֶגֶד
  choice: Mbele ya
  rationale: Kirai hiki huhifadhi maana ya kutenda jambo mbele ya watu, yaani katika uwepo wao na huku wakiona.
- source_word: אֲבוֹתָם
  choice: baba zao
  rationale: Hii ndiyo maana ya moja kwa moja ya Kiebrania na inadumisha lugha ya kifamilia; katika muktadha inawahusu mababu wa Waisraeli.
- source_word: עָשָׂה פֶלֶא
  choice: alifanya maajabu
  rationale: Ingawa פֶלֶא iko katika umoja wa kisarufi, inaweza kuwa na maana ya kijumla hapa; wingi 'maajabu' ni wa asili katika Kiswahili na unafaa matendo ya Misri yanayozungumziwa.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Huhifadhi neno אֶרֶץ, 'nchi,' na uwazi wa kijiografia wa maandishi ya Kiebrania.
- source_word: שְׂדֵה צֹעַן
  choice: katika mashamba ya Soani
  rationale: Kisarufi ni 'shamba la Soani,' lakini neno la umoja linaweza kueleza eneo; wingi 'mashamba' huwasilisha kwa Kiswahili eneo la mashambani linalozunguka Soani.
