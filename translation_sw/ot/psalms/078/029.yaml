  text: וַ/יֹּאכְל֣וּ וַ/יִּשְׂבְּע֣וּ מְאֹ֑ד וְ֝/תַֽאֲוָתָ֗/ם יָבִ֥א לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/029.yaml
  text: So they ate and were very full[a], and he brought them what they craved.
translation:
  language: sw
  text: Basi wakala, wakashiba sana, naye akawaletea kile walichokitamani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tamaa yao” au “hamu yao.” Nomino ya Kiebrania inaweza kumaanisha tamaa yenyewe au kitu kinachotamaniwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: wakala
  rationale: Kitenzi cha kawaida cha kula; umbo la masimulizi linaendelezwa kwa mfuatano wa vitenzi vya 'waka-'.
- source_word: וַיִּשְׂבְּעוּ מְאֹד
  choice: wakashiba sana
  rationale: שׂבע humaanisha kushiba au kutosheka baada ya kula, na מְאֹד huongeza kiwango. 'Wakashiba sana' ni Kiswahili cha kawaida na huhifadhi picha halisi ya kula kwa wingi.
- source_word: תַאֲוָתָם
  choice: kile walichokitamani
  rationale: Nomino תַּאֲוָה inaweza kumaanisha tamaa yenyewe au kitu kinachotamaniwa. Katika muktadha huu, usemi huu wa Kiswahili unaonyesha kwa kawaida kitu walichotamani bila kuongeza hukumu ya kimaadili isiyosemwa wazi katika neno lenyewe.
- source_word: יָבִא לָהֶם
  choice: akawaletea
  rationale: Hifili ya בוא pamoja na לָהֶם ina maana ya kuwaletea au kufanya kitu kiwafikie. 'Akawaletea' ni fupi, ya kawaida, na huonyesha Mungu kuwa mtendaji anayeonekana katika muktadha.
theological_decisions:
- issue: Mtendaji asiyeelezwa wazi wa יָבִא
  choice: naye akawaletea
  alternative: tamaa yao ikawajia
  rationale: Mtiririko wa simulizi humwonyesha Mungu kuwa mtendaji anayetoa chakula, na umbo la Hifili la בוא linaunga mkono maana ya kusababisha kifike au kuleta. Kiwakilishi 'naye' huhifadhi mtendaji aliyedokezwa bila kulitaja jina lake ndani ya mstari.
- issue: Maana ya תַאֲוָתָם
  choice: kile walichokitamani
  alternative: tamaa yao / hamu yao
  rationale: Kiebrania kinaweza kutaja tamaa kwa dhana au kitu kilichotamaniwa. Matini kuu inatumia kitu kilichotamaniwa kwa ufasaha wa Kiswahili, huku tanbihi ikihifadhi uwezekano wa maana ya dhana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kawaida lakini chenye hadhi. 'Wakala, wakashiba' hudumisha mwendo wa ushairi wa kisimulizi; 'kile walichokitamani' huepuka neno 'tamaa' katika matini kuu, ambalo katika matumizi ya sasa linaweza kusikika kama hukumu kali zaidi ya kimaadili kuliko inavyolazimu hapa.
