  text: וְ/אַ֤ף אֱלֹהִ֨ים עָ֘לָ֤ה בָ/הֶ֗ם וַֽ֭/יַּהֲרֹג בְּ/מִשְׁמַנֵּי/הֶ֑ם וּ/בַחוּרֵ֖י יִשְׂרָאֵ֣ל הִכְרִֽיעַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/031.yaml
  text: Then the anger of God rose against them[a], and he killed the stoutest among them; he struck down the young men of Israel.
translation:
  language: sw
  text: Ndipo hasira ya Mungu ikawaka dhidi yao, naye akawaua walionona miongoni mwao; akawaangusha vijana wa Israeli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַף אֱלֹהִים
  choice: Ndipo hasira ya Mungu
  rationale: אַף ni nahau ya hasira, ingawa maana yake ya msingi ni ‘pua’. ‘Ndipo’ linaonyesha maendeleo ya simulizi yanayoletwa na וְ.
- source_word: עָלָה בָהֶם
  choice: ikawaka dhidi yao
  rationale: Kwa hasira, kitenzi cha ‘kupanda’ kinaelezwa kwa Kiswahili cha kawaida kuwa hasira ‘iliwaka’; ‘dhidi yao’ huhifadhi mwelekeo wa uadui wa בָהֶם.
- source_word: וַיַּהֲרֹג
  choice: akawaua
  rationale: Ni tafsiri ya moja kwa moja na ya sasa ya הרג, huku kiambishi cha yambwa kikiwarejelea watu waliotajwa.
- source_word: בְּמִשְׁמַנֵּיהֶם
  choice: walionona miongoni mwao
  rationale: שׁמן hapa kwa halisi huelekea kwa ‘walionona’ au ‘wanono’; huenda ikamaanisha watu wao hodari au walio bora. Tafsiri hii huhifadhi taswira ya Kiebrania bila kuamua kimya kimya kuwa nguvu ndiyo maana pekee.
- source_word: וּבַחוּרֵי יִשְׂרָאֵל
  choice: vijana wa Israeli
  rationale: בָּחוּר humaanisha kijana aliye katika upeo wa nguvu zake, mara nyingi akiwa na dokezo la uwezo wa kijeshi.
- source_word: הִכְרִיעַ
  choice: akawaangusha
  rationale: Hiphil ya כרע ni kusababisha mtu kuinama au kuanguka; ‘akawaangusha’ huhifadhi taswira hiyo na ulinganifu na kuua.
theological_decisions:
- issue: Usemi wa kibinadamu kuhusu hasira ya Mungu
  choice: hasira ya Mungu ikawaka dhidi yao
  alternative: Mungu akawakasirikia
  rationale: Tafsiri iliyochaguliwa hudumisha hasira ya Mungu kama kiima cha kishairi badala ya kuifupisha kuwa taarifa tambarare kwamba Mungu alikasirika, huku ikitoa nahau inayoeleweka kiasili kwa Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishairi na ulinganifu wa vishazi umehifadhiwa. ‘Walionona’ limetumiwa kwa makusudi kuhifadhi taswira na utata halisi wa בְּמִשְׁמַנֵּיהֶם, badala ya kuibadili moja kwa moja kuwa ‘wenye nguvu zaidi’.
