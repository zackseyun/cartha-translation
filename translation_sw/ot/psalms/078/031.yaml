  source_fidelity: 'Tafsiri inaakisi kwa uaminifu muundo na maana ya Kiebrania: hasira ya Mungu ‘ikawaka dhidi yao’ hutafsiri idiomu ya אַף ... עָלָה בָהֶם kwa Kiswahili cha kawaida, na vitenzi ‘akawaua’ na ‘akawaangusha’ hudumisha ukali na ulinganifu wa matendo ya hukumu. ‘Walionona miongoni mwao’ huhifadhi maana ya msingi ya בְּמִשְׁמַנֵּיהֶם na utata wake wa kimuktadha, bila kuilazimisha kuwa ‘wenye nguvu.’'
