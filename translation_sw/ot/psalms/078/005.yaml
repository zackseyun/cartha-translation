  yaml_path: translation/ot/psalms/078/005.yaml
  text: For he established a testimony in Jacob and set a law in Israel[c][b][a], which he commanded our fathers to make known to their children.
translation:
  language: sw
  text: Kwa maana aliweka ushuhuda katika Yakobo, akaweka sheria[a] katika Israeli. Aliwaamuru baba zetu[b] kuwajulisha watoto wao[c] mambo hayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “mafundisho” badala ya “sheria” (Kiebrania: torah).'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “baba zetu”; neno hili ni la jinsia ya kiume.'
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania kihalisi: “wana wao”; katika muktadha huu neno hilo huenda linamaanisha watoto kwa ujumla katika urithishaji kutoka kizazi kimoja hadi kingine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: aliweka
  rationale: Hifili ya קום hapa ina maana ya kusimamisha au kuthibitisha jambo liwepo. Katika Kiswahili, “aliweka” ni ya kawaida na inaendana na mstari sambamba wenye שָׂם, bila kuleta picha ya kuinua kitu kimwili.
- source_word: עֵדוּת
  choice: ushuhuda
  rationale: Neno hili linaweza kumaanisha ushuhuda au agizo la agano. “Ushuhuda” huhifadhi maana yake ya msingi bila kulifafanua kupita kiasi kuwa amri ya kisheria tu.
- source_word: בְּיַעֲקֹב
  choice: katika Yakobo
  rationale: Huhifadhi kihusishi ב na usambamba wa kishairi na “katika Israeli”; Yakobo hapa anawakilisha watu wa agano.
- source_word: וְתוֹרָה
  choice: na sheria
  rationale: תורה humaanisha mafundisho au sheria. Katika muktadha huu wa ushuhuda wa agano na wajibu wa kuupitisha kwa kizazi kingine, “sheria” huhifadhi uzito wake wa lazima, huku mbadala “mafundisho” ukitajwa katika tanbihi.
- source_word: שָׂם
  choice: kuweka
  rationale: שׂים kwa kawaida ni kuweka au kuainisha. Muundo huu unaendeleza usambamba na kitenzi cha kwanza kwa Kiswahili cha asili.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: Huhifadhi kihusishi cha Kiebrania na usambamba wa kishairi na “katika Yakobo.”
- source_word: אֲשֶׁר צִוָּה
  choice: ambayo aliwaamuru
  rationale: Kiambishi cha uhusiano kinaelekezwa kwa yaliyotangulia, yaani ushuhuda na sheria; muundo wa Kiswahili “aliwaamuru ... wawajulishe” unaonyesha wazi kwamba baba ndio waliopewa amri.
- source_word: אֶת אֲבוֹתֵינוּ
  choice: baba zetu
  rationale: Kiebrania kinasema wazi “baba zetu.” Tafsiri hii huhifadhi lugha mahususi ya kiume badala ya kuibadili kuwa “mababu” au “wazee wetu.”
- source_word: לְהוֹדִיעָם
  choice: wawajulishe
  rationale: Hifili ya ידע ni kusababisha wajue, yaani kujulisha. Kiambishi cha wingi kinarejelea ushuhuda na sheria kwa pamoja, ambavyo katika Kiswahili vinaweza kurejelewa kwa ngeli ya U-I kwa “wa-.”
- source_word: לִבְנֵיהֶם
  choice: watoto wao
  rationale: Ingawa בנים kimsingi ni “wana,” hapa inahusu uzao katika uenezaji wa maarifa kutoka kizazi hadi kizazi, hivyo “watoto” huwasilisha maana jumuishi ya kimuktadha bila kudai kuwa ni wavulana pekee.
theological_decisions:
- issue: Maana ya תּוֹרָה katika zaburi ya agano
  choice: sheria
  alternative: mafundisho
  rationale: Kuunganishwa kwake na “ushuhuda” na amri ya kuipitisha kwa kizazi kingine kunasisitiza mamlaka yake ya kawaida na ya agano. Hata hivyo, maana pana ya “mafundisho” imehifadhiwa katika tanbihi.
- issue: Lugha ya ukoo yenye jinsia katika אֲבוֹתֵינוּ na לִבְנֵיהֶם
  choice: baba zetu ... watoto wao
  alternative: mababu zetu ... wana wao
  rationale: “Baba zetu” huhifadhi jinsia iliyo wazi katika אבותינו. Kwa upande wa בנים, muktadha wa vizazi unaonyesha uzao kwa ujumla, hivyo “watoto wao” ni sahihi na ya asili.
- issue: Kirejeleo cha kiambishi katika לְהוֹדִיעָם
  choice: wawajulishe, kikirejelea ushuhuda na sheria
  alternative: waijulishe, kikichukulia yaliyotangulia kama ujumbe mmoja
  rationale: Kiambishi cha Kiebrania ni wingi wa kiume na kwa kawaida kinarejelea vitu viwili vilivyotajwa. Kiswahili “wawajulishe” huhifadhi urejeleo huo wa wingi bila kutatua mvutano wa istilahi mbili kuwa kitu kimoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Usambamba wa “katika Yakobo ... katika Israeli” umehifadhiwa. Muundo “aliwaamuru baba zetu wawajulishe” ni wa asili na unaweka wazi uhusiano wa amri bila kuongeza ufafanuzi wa kiteolojia.
