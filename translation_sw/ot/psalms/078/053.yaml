base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/053.yaml
  text: He led them securely[a], and they were not afraid; and the sea covered their enemies.
translation:
  language: sw
  text: Akawaongoza kwa usalama[a], nao hawakuogopa; na bahari ikawafunika adui zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: «bahari». Mstari huu unadokeza kuvuka kwa Israeli katika kutoka Misri. Ufafanuzi unaowezekana ni pamoja na «Bahari ya Shamu» au «Bahari ya Matete», lakini matini ya Kiebrania hapa haitaji bayana bahari hiyo.'
    reason: rejeo la kihistoria na ufafanuzi wa matini
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: Akawaongoza
  rationale: Kitenzi נחה katika muundo wa hiphili chenye kiambishi cha nafsi ya tatu wingi humaanisha kuwaongoza watu. “Akawaongoza” ni Kiswahili cha kawaida na kinahifadhi picha ya mwendo katika simulizi la kutoka Misri.
- source_word: לָבֶטַח
  choice: kwa usalama
  rationale: בֶּטַח huonyesha hali ya usalama au kutokuwa hatarini; ל hapa inaeleza namna walivyoongozwa. “Kwa usalama” ni ya asili na wazi katika Kiswahili.
- source_word: וְלֹא פָחָדוּ
  choice: nao hawakuogopa
  rationale: פחד humaanisha kuogopa. Kiunganishi ו kimetafsiriwa moja kwa moja kwa uratibu, bila kulazimisha uhusiano mahususi wa sababu na matokeo usioelezwa wazi katika Kiebrania.
- source_word: אֹיְבֵיהֶם
  choice: adui zao
  rationale: “Adui zao” ni tafsiri ya kawaida na inayoeleweka ya אֹיְבֵיהֶם.
- source_word: כִּסָּה
  choice: ikawafunika
  rationale: כסה kimsingi ni “kufunika.” Kiambishi “-wa-” kinabainisha kwamba waliofunikwa ni adui zao, na maana halisi ya picha ya bahari imehifadhiwa.
- source_word: הַיָּם
  choice: bahari
  rationale: Nomino hii ni “bahari” yenye uainisho katika Kiebrania. Kiswahili kwa kawaida hakihitaji neno tofauti la uainisho hapa; haijapanuliwa kuwa “Bahari ya Shamu” au jina jingine kwa kuwa mstari wenyewe hautaji jina mahususi.
theological_decisions:
- issue: Dokezo la kihistoria kuhusu kuvuka bahari wakati wa kutoka Misri
  choice: Kutumia “bahari” bila kuitaja kwa jina mahususi
  alternative: Bahari ya Shamu; Bahari ya Matete
  rationale: Muktadha unadokeza tukio la kutoka Misri, lakini Kiebrania cha mstari huu kinasema tu “bahari.” Tafsiri haiongezi utambulisho mahususi usiotajwa katika matini.
- issue: Uhusiano kati ya kuongozwa kwa usalama na kutokuogopa
  choice: 'Kutumia uratibu: “nao hawakuogopa”'
  alternative: “hata hawakuogopa”; “ili wasiogope”
  rationale: Kiebrania kina kiunganishi rahisi ו. Ingawa muktadha unaweza kudokeza matokeo, uratibu huhifadhi uwezekano huo bila kuufanya kuwa uhusiano wa kisarufi ulio wazi zaidi kuliko chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye staha na inayoeleweka kwa wasomaji wa kawaida. Muundo wa masimulizi wenye “aka-” unaunganisha vitendo kwa ufasaha na muktadha wa zaburi.
