  text: הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/001.yaml
  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: sw
  text: Mshukuruni Yahwe[a], kwa maana yeye ni mwema, kwa maana upendo wake thabiti hudumu milele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH; kwa desturi hutafsiriwa “BWANA.”'
    reason: alternative_reading
  - marker: b
    text: Au “uaminifu wake wa agano hudumu milele.” Neno la Kiebrania חֶסֶד linamaanisha upendo na wema wenye uaminifu, hasa katika uhusiano wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Mshukuruni
  rationale: Kitenzi hiki ni amri ya wingi ya ידה katika Hifili, na hapa kinamaanisha kumtolea Mungu shukrani au sifa. “Mshukuruni” ni usemi wa kawaida na unaofaa katika mwito huu wa ibada.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa moja kwa moja kama “Yahwe,” badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina la agano lililo katika maandishi ya Kiebrania.
- source_word: כִּי
  choice: kwa maana
  rationale: Katika sehemu zote mbili, כִּי inatoa sababu ya mwito wa kushukuru. Kurudia “kwa maana” kunahifadhi muundo na mdundo wa Kiebrania.
- source_word: טוֹב
  choice: mwema
  rationale: Kwa kuwa kivumishi hiki kinamhusu Yahwe binafsi, “mwema” ni tafsiri ya moja kwa moja na ya asili zaidi kuliko “mzuri.”
- source_word: לְעוֹלָם
  choice: hudumu milele
  rationale: Kirai hiki humaanisha “kwa milele.” Kuunganisha maana yake na kitenzi “hudumu” kunatoa sentensi ya kawaida ya Kiswahili bila kupoteza wazo la kudumu daima.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד hujumuisha upendo, wema, na uaminifu wa kudumu, mara nyingi katika uhusiano wa agano. “Upendo wake thabiti” huhifadhi upana huo bila kuufupisha kuwa rehema pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja. “Yahwe” huhifadhi jina hilo, huku tanbihi ikitaja desturi ya kulitafsiri kwa cheo “BWANA.”
- issue: Maana ya חֶסֶד katika muktadha wa agano
  choice: upendo wake thabiti
  alternative: uaminifu wake wa agano
  rationale: “Upendo wake thabiti” huonyesha upendo wenye uaminifu na kudumu bila kufanya wazo la agano, ambalo limo katika upeo wa neno, kuwa wazi zaidi kuliko mstari wenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kiibada lakini kinachoeleweka kwa urahisi. Marudio ya “kwa maana” yamehifadhiwa ili kuendeleza muundo wa kishairi wa Kiebrania.
