  text: Yahweh is among my helpers[b][a]; I myself will look on my haters.
translation:
  language: sw
  text: Yahwe yuko kwa ajili yangu miongoni mwa wanaonisaidia[a]; nami nitawatazama wale wanaonichukia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe yuko upande wangu pamoja na wanaonisaidia.” Muundo wa Kiebrania unaweza kusisitiza kwamba Yahwe yuko pamoja na wale wanaomsaidia mtunga zaburi, wala si kwamba yeye peke yake ndiye msaidizi wake.
    reason: lexical_alternative
  - marker: b
    text: Au, “nitaona,” au “nitawatazama kwa ushindi wale wanaonichukia.” Usemi wa Kiebrania unaweza kudokeza kuona anguko lao bila kulitaja waziwazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: לִי
  choice: yu pamoja nami
  rationale: Muundo לִי una maana ya kuwa upande wa mtunga zaburi; Kiswahili kinahitaji kirai cha kitenzi ili sentensi iwe ya kawaida.
- source_word: בְּעֹזְרָי
  choice: miongoni mwa wanaonisaidia
  rationale: Huhifadhi kihusishi בְּ pamoja na wingi wa עֹזְרָי, badala ya kuufanya usemi huu kuwa umoja, ‘msaidizi wangu.’
- source_word: וַאֲנִי
  choice: nami
  rationale: Kiwakilishi huru cha nafsi ya kwanza kina uzito wa msisitizo; ‘nami’ huonyesha ugeuzi huo kwa Kiswahili cha kawaida bila kuongeza ‘mwenyewe’ isivyohitajika.
- source_word: אֶרְאֶה
  choice: nitawatazama
  rationale: ראה ikiwa na בְּ inaweza kumaanisha kuwatazama au kuona yatakayowapata; tafsiri hii huhifadhi usemi huo bila kutaja ushindi au anguko moja kwa moja.
- source_word: בְשֹׂנְאָי
  choice: wale wanaonichukia
  rationale: Hutafsiri kisahihi umbo la kisifa ‘wanaonichukia’ na ni la asili zaidi katika Kiswahili kuliko nomino isiyo ya kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu; kulitohowa kama ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa Yahwe na wanaomsaidia mtunga zaburi
  choice: yu pamoja nami miongoni mwa wanaonisaidia
  alternative: Yahwe ndiye msaidizi wangu
  rationale: Wingi wa עֹזְרָי na kihusishi בְּ umehifadhiwa, hivyo tafsiri haisuluhishi kimyakimya iwapo Yahwe anaelezwa kama mmoja miongoni mwa wasaidizi au akiwa upande wa mtunga zaburi pamoja nao.
- issue: Kinachotazamwa kuhusu wanaomchukia
  choice: nitawatazama
  alternative: nitaona kuanguka kwao / nitawatazama kwa ushindi
  rationale: Muktadha unaweza kudokeza kuona kushindwa kwao, lakini andiko halitaji wazi kuanguka wala ushindi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Yu’ limetumiwa kwa ufupi katika usemi wa kishairi; ‘wale wanaonichukia’ ni la kawaida na sahihi kuliko tafsiri ya moja kwa moja isiyo ya asili. Alama zote za tanbihi zimewekwa katika matini.
