  text: אֵ֤ל יְהוָה֮ וַ/יָּ֪אֶר לָ֥/נוּ אִסְרוּ חַ֥ג בַּ/עֲבֹתִ֑ים עַד קַ֝רְנ֗וֹת הַ/מִּזְבֵּֽחַ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/027.yaml
  text: Yahweh is God[a], and he has given light to us. Bind the festal sacrifice with cords[d][c][b], up to the horns of the altar.
translation:
  language: sw
  text: BWANA ni Mungu, naye ametupa nuru.[a] Ifungeni sadaka ya sikukuu[b] kwa kamba,[c] hadi kwenye pembe za madhabahu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ametuangazia.” Kitenzi cha Kiebrania kinaweza kumaanisha kwamba BWANA aliwapa watu wake nuru au kwamba aliwaangazia kwa fadhili.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “Ifungeni sikukuu.” Nomino hiyo kwa kawaida humaanisha “sikukuu” au “karamu,” lakini hapa wengi huielewa kuwa sadaka ya sikukuu; wengine huona kuwa mstari unazungumzia msafara wa sherehe.
    reason: alternative_reading
  - marker: c
    text: Au, “kwa kamba nene.” Wengine hulitafsiri neno hili kuwa “matawi,” lakini maana ya “kamba” inaungwa mkono zaidi na matumizi yake ya kawaida.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל יְהוָה
  choice: BWANA ni Mungu
  rationale: Kishazi kisicho na kitenzi kinamtambulisha YHWH kuwa Mungu. Jina la agano יְהוָה limetafsiriwa kwa desturi ya Kiswahili kuwa “BWANA,” bila kuongeza wazo la “Mwenyezi” ambalo halijaelezwa hapa.
- source_word: וַיָּאֶר לָנוּ
  choice: naye ametupa nuru
  rationale: Hifili ya אור kwa kawaida humaanisha kutoa au kuangaza nuru. Tafsiri hii inadumisha maana ya kisababishi na ni ya kawaida katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa maana ya Mungu kutuangazia kwa fadhili.
- source_word: אִסְרוּ
  choice: Ifungeni
  rationale: Amri ya wingi kutoka אסר humaanisha kufunga au kuunganisha kwa kufunga. “Ifungeni” inaafikiana na nomino iliyotafsiriwa kuwa sadaka.
- source_word: חַג
  choice: sadaka ya sikukuu
  rationale: Ingawa חַג kwa kawaida ni “sikukuu,” kutajwa kwa kufunga na kwa madhabahu kunaunga mkono matumizi ya kimajazi yanayoirejelea sadaka ya sikukuu. Tanbihi inaacha wazi uwezekano wa sikukuu au msafara wa sherehe.
- source_word: בַּעֲבֹתִים
  choice: kwa kamba
  rationale: עֲבֹתִים kwa kawaida ni kamba, mara nyingi kamba nene. Maana iliyopendekezwa ya “matawi” ina ushahidi mdogo zaidi wa kileksika lakini imehifadhiwa katika tanbihi.
- source_word: עַד קַרְנוֹת הַמִּזְבֵּחַ
  choice: hadi kwenye pembe za madhabahu
  rationale: “Hadi” huwakilisha עַד bila kuamua kwa lazima ikiwa sadaka ilifungwa moja kwa moja kwenye pembe. “Pembe” ni neno la ibada kwa sehemu zilizochomoza kwenye kona za madhabahu.
theological_decisions:
- issue: Kirejelewa cha kiibada cha חַג katika amri ya kufunga
  choice: sadaka ya sikukuu
  alternative: sikukuu yenyewe au msafara wa sherehe
  rationale: Muktadha wa madhabahu na kitenzi “funga” unaifanya sadaka kuwa maana inayowezekana zaidi. Hata hivyo, kwa kuwa חַג yenyewe kwa kawaida humaanisha sikukuu na mstari huu ni mgumu, tafsiri nyingine haijaondolewa bali imeelezwa katika tanbihi.
- issue: Ikiwa nuru imetolewa au Mungu mwenyewe amewaangazia waabudu
  choice: ametupa nuru
  alternative: ametuangazia
  rationale: Muundo wa kisababishi unaunga mkono “ametupa nuru,” lakini kauli hiyo inaweza pia kueleza kuangaza kwa fadhili za Mungu. Tanbihi inadumisha mvutano huo bila kuufanya fundisho maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya ibada lakini kinachoeleweka kwa msomaji wa kawaida. “BWANA” limeandikwa kwa herufi kubwa kama uwakilishi wa jina יהוה. Sentensi fupi na amri ya wingi zimedumisha muundo na nguvu ya mstari wa Kiebrania.
