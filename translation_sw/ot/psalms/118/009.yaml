translation:
  language: sw
  text: Ni afadhali kutafuta hifadhi kwa Yahweh kuliko kuwatumaini wakuu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu mashuhuri.” Neno la Kiebrania נְדִיבִים linaweza kumaanisha wakuu, waheshimiwa, au watawala; “wakuu” ni tafsiri ya kawaida katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Ni afadhali
  rationale: Kivumishi hiki kinatumika kwa ulinganisho wa jambo lililo bora au lenye faida zaidi; Kiswahili cha kawaida hutumia ‘Ni afadhali’.
- source_word: לַחֲסוֹת
  choice: kukimbilia
  rationale: Kitenzi חסה humaanisha kutafuta au kupata hifadhi na usalama kwa mtu; ‘kukimbilia kwa’ ni usemi wa asili unaodumisha wazo la kumtegemea mlinzi.
- source_word: בַּיהוָה
  choice: kwa Yahweh
  rationale: Kiambishi ב kinaonyesha yule ambaye mtu anamkimbilia ili kupata hifadhi; jina la agano יהוה limetoholewa kuwa ‘Yahweh’.
- source_word: מִבְּטֹחַ
  choice: kuliko kuwatumaini
  rationale: מן inaonyesha ulinganisho (‘kuliko’), na בטח humaanisha kutumaini au kutegemea.
- source_word: בִּנְדִיבִים
  choice: wakuu
  rationale: Katika muktadha huu נְדִיבִים ni watu wa cheo, wenye mamlaka, au watawala mashuhuri; ‘wakuu’ ni pana na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina יהוה; ‘Yahweh’ hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo.
- issue: Walengwa wa נְדִיבִים
  choice: wakuu
  alternative: wana wa kifalme; viongozi
  rationale: Neno linaweza kumaanisha watu mashuhuri au watawala wenye cheo. ‘Wakuu’ huhifadhi upana huo bila kulifanya limaanishe wana wa mfalme pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo sambamba wa ‘kukimbilia ... kuliko kuwatumaini ...’ unadumisha ulinganisho wa mstari wa Kiebrania.
