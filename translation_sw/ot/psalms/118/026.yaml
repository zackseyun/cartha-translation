base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/026.yaml
  text: Blessed is the one who comes in the name of Yahweh[c][b][a]; we bless you from the house of Yahweh.
translation:
  language: sw
  text: Amebarikiwa anayekuja[a] kwa jina la Yahweh[b][c]; tunawabariki kutoka katika nyumba ya Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Amebarikiwa yeye ajaye.” Neno la Kiebrania ni kivumishi-tendo cha umoja wa kiume, na linaweza kutafsiriwa kihalisi “ajaye” au “yeye ajaye.”
    reason: lexical_alternative
  - marker: b
    text: “Kwa jina la” pia inaweza kumaanisha “kwa mamlaka ya” au “akiwa mwakilishi wa Yahweh.”
    reason: lexical_alternative
  - marker: c
    text: Mstari huu unanukuliwa baadaye katika Agano Jipya kuhusiana na Yesu kuingia Yerusalemu (kwa mfano, Mathayo 21:9; Marko 11:9; Luka 19:38; Yohana 12:13). Hata hivyo, maneno ya Zaburi yenyewe yametafsiriwa bila kuingiza matumizi hayo ya baadaye katika matini kuu.
    reason: cross_reference
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Amebarikiwa
  rationale: Ni umbo la baraka lenye maana ya hali ya kubarikiwa. “Amebarikiwa” ni la kawaida na lenye hadhi, bila kuligeuza kimya kimya kuwa ombi kama “na abarikiwe.”
- source_word: הַבָּא
  choice: anayekuja
  rationale: 'Kivumishi-tendo chenye kibainishi, umoja wa kiume, kinachotumika kama nomino: “anayekuja.” Tafsiri hii ni ya asili katika Kiswahili na inadumisha tendo linaloendelea bila kuamua kwamba ni cheo maalumu.'
- source_word: בְּשֵׁם
  choice: kwa jina la
  rationale: Hifadhi usemi wa Kiebrania ambao unaweza kudokeza kuja kwa mamlaka, uwakilishi, au kwa kulitaja jina la mtu. “Kwa jina la” ni wazi na ya kawaida, huku maana pana ikielezwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi, badala ya kubadilishwa kuwa cheo kama “Bwana.”
- source_word: בֵּרַכְנוּכֶם
  choice: tunawabariki
  rationale: Kitenzi ni nafsi ya kwanza wingi chenye yambwa ya nafsi ya pili wingi. Ingawa umbo la Kiebrania ni timilifu, katika muktadha huu wa ibada linafanya kazi kama tamko la sasa la baraka; kiambishi “-wa-” kinaonyesha kwamba wanaobarikiwa ni wengi.
- source_word: מִבֵּית
  choice: kutoka katika nyumba ya
  rationale: Inadumisha picha ya mahali baraka inakotoka. “Nyumba” inaacha maana ya hekalu idokezwe na muktadha bila kuipanua moja kwa moja katika matini.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: Bwana; Yehova
  rationale: Matini ya Kiebrania inatumia jina binafsi la Mungu. Kulitaja kama “Yahwe” kunadumisha tofauti kati ya jina hilo na cheo cha “Bwana.”
- issue: Ikiwa “anayekuja” ni rejeo la moja kwa moja la Kimasihi au baraka ya kiliturujia
  choice: Kudumisha usemi wa jumla wa baraka katika matini kuu bila kuongeza utambulisho wa Kimasihi
  alternative: Kutafsiri kwa maneno yanayomtambulisha moja kwa moja Masihi
  rationale: Katika Zaburi yenyewe usemi unaweza kumhusu mtu anayewasili kwa jina la Yahwe. Agano Jipya baadaye linautumia kumhusu Yesu, lakini tafsiri ya Zaburi haipaswi kuingiza matumizi hayo ya baadaye ndani ya maneno ya awali.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Anayekuja” ni rahisi kueleweka kuliko “ajaye,” huku tanbihi ikihifadhi mbadala rasmi zaidi. Muundo “tunawabariki” unaweka wazi wingi wa waandikiwa ambao hauonekani katika neno la Kiingereza “you.”
