  variant: Standard East African Swahili
source:
  edition: WLC
  text: ק֤וֹל רִנָּ֬ה וִֽ/ישׁוּעָ֗ה בְּ/אָהֳלֵ֥י צַדִּיקִ֑ים יְמִ֥ין יְ֝הוָה עֹ֣שָׂה חָֽיִל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/015.yaml
  text: 'The sound of joyful shouting and salvation is in the tents of the righteous: “The right hand of Yahweh does valiantly!”[a][b]'
translation:
  language: sw
  text: 'Sauti ya shangwe na wokovu[a] imo katika mahema ya wenye haki: “Mkono wa kuume wa Yahwe unatenda kwa uweza!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ushindi” au “ukombozi.”
    reason: lexical_alternative
  - marker: b
    text: Nahau ya Kiebrania inaweza pia kutafsiriwa “unatenda kwa ushujaa” au “unafanya mambo makuu kwa nguvu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֤וֹל
  choice: Sauti ya
  rationale: Neno קוֹל humaanisha sauti au mlio; hapa linatambulisha kile kinachosikika katika mahema.
- source_word: רִנָּה
  choice: shangwe
  rationale: רִנָּה ni kilio au sauti ya furaha. Katika Kiswahili, “shangwe” kwa kawaida hudokeza furaha inayodhihirishwa kwa sauti.
- source_word: וִישׁוּעָה
  choice: na wokovu
  rationale: יְשׁוּעָה linaweza kumaanisha wokovu, ukombozi, au ushindi. “Wokovu” huhifadhi maana pana ya tendo la Mungu la kuokoa, huku footnote ikitaja maana nyingine zinazowezekana.
- source_word: בְּאָהֳלֵי
  choice: katika mahema ya
  rationale: Tafsiri hii huhifadhi picha halisi ya mahema katika wingi badala ya kuibadili kuwa “makao” au “nyumba.”
- source_word: צַדִּיקִים
  choice: wenye haki
  rationale: צַדִּיקִים ni watu wanaoitwa waadilifu au wenye haki; “wenye haki” ni usemi wa kawaida na wenye hadhi katika Kiswahili cha Biblia.
- source_word: יְמִין יְהוָה
  choice: Mkono wa kuume wa Yahwe
  rationale: Usemi huu huhifadhi taswira ya mkono wa kuume kama ishara ya nguvu na tendo la Mungu la kuokoa, na kulitaja jina la agano Yahwe.
- source_word: עֹשָׂה חָיִל
  choice: unatenda kwa uweza
  rationale: Huu ni usemi wa Kiebrania unaomaanisha kutenda kwa nguvu au kwa ushujaa. “Unatenda kwa uweza” ni wa asili katika Kiswahili na hauibani maana katika ushindi wa kijeshi pekee.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יְהוָה moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya יְשׁוּעָה katika zaburi ya ushindi
  choice: wokovu
  alternative: ushindi au ukombozi
  rationale: “Wokovu” huhifadhi kwa pamoja wazo la kuokolewa kwa vitendo na uzito mpana wa kitheolojia. Maana nyembamba zaidi zinazowezekana zimehifadhiwa katika footnote.
- issue: Nguvu ya nahau עֹשָׂה חָיִל
  choice: unatenda kwa uweza
  alternative: unatenda kwa ushujaa au unafanya mambo makuu
  rationale: Chaguo hili huhifadhi wazo la tendo lenye nguvu bila kulifanya lazima liwe la kijeshi wala kuongeza kitu kisichotajwa wazi katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima, na unaosomeka kwa urahisi. “Shangwe” huhifadhi hali ya sauti ya furaha, “mahema” huhifadhi taswira ya Kiebrania, na “imo” huunganisha kwa ufupi sauti hiyo na mahali inaposikika.
