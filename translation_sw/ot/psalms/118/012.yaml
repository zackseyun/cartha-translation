  yaml_path: translation/ot/psalms/118/012.yaml
  text: They surrounded me like bees[a]; they went out like a fire among thorns. In the name of Yahweh[b], I surely cut them down.
translation:
  language: sw
  text: Walinizingira kama nyuki; walizimika kama moto wa miiba.[a] Kwa jina la Yahwe, hakika niliwakatilia mbali.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walififia kama moto katika vichaka vya miiba.” Kiebrania kina taswira fupi ya moto wa miiba, ambao huwaka kwa ghafla na kuzimika upesi.
    reason: lexical_alternative
  - marker: b
    text: Au, “niliwakata.” Kitenzi cha Kiebrania kinaweza kumaanisha kukata au kukatilia mbali; hakisemi lazima kuwaangamiza kabisa.
    reason: alternative_reading
lexical_decisions:
- source_word: סַבּוּנִי
  choice: Walinizunguka
  rationale: Kitenzi סבב kina maana ya kuzunguka au kuzingira. “Walinizunguka” ni Kiswahili cha kawaida na kinadumisha taswira ya maadui kumzingira msemaji.
- source_word: כִדְבוֹרִים
  choice: kama nyuki
  rationale: Kiambishi כ kinaonyesha ulinganisho; “kama nyuki” kinahifadhi taswira hai ya kundi linalosonga kwa wingi.
- source_word: דֹּעֲכוּ
  choice: walizimika
  rationale: Kitenzi hiki humaanisha kuzimika au kufifia, hasa kuhusu moto. “Walizimika” kinaihusisha sentensi moja kwa moja na taswira ya moto inayofuata.
- source_word: כְּאֵשׁ קוֹצִים
  choice: kama moto wa miiba
  rationale: Muundo wa Kiebrania ni mfupi, kihalisi ‘kama moto wa miiba.’ Tafsiri hii inadumisha picha ya moto mkali lakini wa muda mfupi unaotokana na miiba mikavu.
- source_word: בְּשֵׁם יְהוָה
  choice: Kwa jina la Yahwe
  rationale: Kirai hiki huonyesha kutenda kwa kumwita au kwa mamlaka ya Yahwe. “Kwa jina la” ni usemi wa kawaida na wa asili katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe,” badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: כִּי
  choice: hakika
  rationale: Katika muktadha huu כִּי ina nguvu ya kusisitiza uhakika kuliko kutoa sababu; “hakika” linaendana na sauti ya ushindi ya zaburi.
- source_word: אֲמִילַם
  choice: niliwaangamiza
  rationale: Hiphil ya מול hapa ina wazo la kuwakatilia mbali au kuwaondoa kabisa. “Niliwaangamiza” ni ya asili katika muktadha wa ushindi, huku tanbihi ikihifadhi taswira halisi zaidi ya kukata.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina la agano יהוה lenyewe. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha na cheo.
- issue: Nguvu ya msemaji kwa kutaja jina la Yahwe
  choice: Kwa jina la Yahwe
  alternative: Kwa mamlaka ya Yahwe
  rationale: Tafsiri ya moja kwa moja inadumisha uwezekano wa kirai kumaanisha kumwita Yahwe na pia kutenda kwa mamlaka yake, bila kuchagua maana moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo sambamba wa mstari umehifadhiwa; jina Yahwe limetumiwa wazi, na tanbihi zimewekwa baada ya vifungu vinavyohusika.
