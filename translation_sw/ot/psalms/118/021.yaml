  text: I will give thanks to you[a], for you answered me and became my salvation.
translation:
  language: sw
  text: Nitakushukuru, kwa maana ulinitikia, ukawa wokovu wangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אודך
  choice: Nitakushukuru
  rationale: Hifili ya ידה hapa ina maana ya kutoa shukrani au kusifu. Wakati ujao wa Kiswahili unahifadhi vizuri hali ya azimio au tendo linalotazamiwa katika kitenzi cha Kiebrania.
- source_word: כי
  choice: kwa maana
  rationale: Hapa כי inatanguliza sababu ya kutoa shukrani; “kwa maana” ni kiunganishi cha kawaida na chenye hadhi katika Kiswahili.
- source_word: עניתני
  choice: ulinitikia
  rationale: Neno linatokana na ענה II, “jibu/itikia,” si ענה I, “tesa/nyenyekeza.” “Ulinitikia” linafaa kwa muktadha wa sala iliyojibiwa.
- source_word: ותהי
  choice: ukawa
  rationale: Wayyiqtol ya היה inaendeleza mfuatano wa matukio na ina maana ya “ukawa,” badala ya hali tuli ya “ulikuwa.”
- source_word: לי
  choice: wangu
  rationale: Ingawa לִי ni kihalisi “kwangu,” muundo wa asili wa Kiswahili ni “ukawa wokovu wangu,” unaohifadhi uhusiano uleule.
- source_word: לישועה
  choice: wokovu
  rationale: יְשׁוּעָה linaweza kumaanisha wokovu au ukombozi. “Wokovu” huhifadhi uzito mpana wa neno katika zaburi hii huku likijumuisha kuokolewa katika hali halisi.
theological_decisions:
- issue: Maana ya ישועה katika zaburi ya kuokolewa yenye uzito mpana wa kitheolojia
  choice: wokovu
  alternative: ukombozi
  rationale: “Wokovu” huhifadhi uwezekano wa kurejelea kuokolewa katika hatari ya wakati huo pamoja na maana pana zaidi, bila kuingiza mafundisho ya baadaye ndani ya mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya kishairi; “ulinitikia” ni ya kawaida katika lugha ya sala na “ukawa” huhifadhi mwendo wa simulizi wa Kiebrania.
