  text: יֹֽאמְרוּ נָ֭א יִרְאֵ֣י יְהוָ֑ה כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/004.yaml
  text: Let those who fear Yahweh now say[a], “His steadfast love endures forever.”
translation:
  language: sw
  text: Wanaomcha Yahweh na waseme sasa, “Upendo wake thabiti[a] ni wa milele.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uaminifu wake wa agano ni wa milele.” Neno la Kiebrania חֶסֶד linajumuisha wazo la upendo mwaminifu na ushikamanifu katika agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמְרוּ
  choice: na waseme
  rationale: Kauli hii ya wingi ina nguvu ya himizo au mwaliko katika muktadha wa ibada; “na waseme” ni ya asili katika Kiswahili na inadumisha nguvu hiyo.
- source_word: נָא
  choice: sasa
  rationale: Neno hili linaonyesha msisitizo au mwito wa haraka; “sasa” linafaa katika mfuatano wa miito ya zaburi hii kuliko “tafadhali.”
- source_word: יִרְאֵי יְהוָה
  choice: wanaomcha Yahweh
  rationale: “Kumcha” hapa kunajumuisha hofu yenye heshima na uchaji; usemi huu ni wa kawaida na unaeleweka katika lugha ya kibiblia ya Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Kiebrania limeandikwa moja kwa moja badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: כִּי
  choice: (halijatafsiriwa kwa kiunganishi tofauti)
  rationale: Katika muktadha huu כִּי hutambulisha maudhui ya kauli wanayoitwa kusema. Kiswahili cha asili hakihitaji “kwa maana” mwanzoni mwa nukuu.
- source_word: לְעוֹלָם
  choice: ni wa milele
  rationale: Kifungu cha Kiebrania kina maana ya kudumu daima. “Ni wa milele” ni kifupi, cha asili, na hakiongezi kitenzi kisichotajwa wazi.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד huunganisha upendo, uaminifu, rehema, na ushikamanifu wa agano; “upendo thabiti” huhifadhi upana huo vizuri kuliko “rehema” peke yake.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la Mungu יהוה, hivyo “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kwa cheo.
- issue: Maana ya חֶסֶד
  choice: upendo thabiti
  alternative: uaminifu wa agano; fadhili; rehema
  rationale: “Upendo thabiti” huhifadhi kwa pamoja wazo la upendo unaodumu na uaminifu, bila kulifungia neno katika maana moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo “na waseme sasa” unadumisha mwito wa kiliturujia, huku “wanaomcha” ikibeba maana ya uchaji bila kuondoa kabisa wazo la hofu.
