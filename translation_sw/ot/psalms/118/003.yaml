  text: Nyumba ya Haruni na iseme sasa, “Kwa maana fadhili zake[a] zadumu milele.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upendo wake mwaminifu.” Neno la Kiebrania חֶסֶד (hesedi) linaweza pia kumaanisha rehema au uaminifu wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמְרוּ
  choice: na iseme
  rationale: Kauli ya Qal isiyokamilika, nafsi ya tatu wingi, imetumiwa kwa maana ya himizo. Kwa kuwa ‘nyumba ya Aroni’ ni kundi linalotajwa kwa umoja katika Kiswahili, ‘na iseme’ ni himizo la kawaida na la wazi.
- source_word: נָא
  choice: sasa
  rationale: Chembe hii huongeza msisitizo au uharaka katika mwito; ‘sasa’ inaonyesha nguvu ya himizo bila kuifanya iwe ombi la adabu.
- source_word: בֵית אַהֲרֹן
  choice: Nyumba ya Aroni
  rationale: Inahifadhi nahau ya kibiblia ya ukoo au jamaa ya Aroni, hapa ikiwakilisha kwa pamoja makuhani wa kizazi chake.
- source_word: כִּי
  choice: imeachwa bila neno tofauti
  rationale: Hapa כִּי inatanguliza yaliyomo katika kauli ya liturujia. Kiswahili cha kawaida hakihitaji ‘kwa maana’ au ‘kwamba’ ndani ya nukuu hii; maana yake inaeleweka moja kwa moja.
- source_word: לְעוֹלָם
  choice: ni wa milele
  rationale: Kirai hicho humaanisha ‘hata milele.’ Muundo ‘ni wa milele’ ni wa asili katika Kiswahili na unaonyesha kudumu bila mwisho.
- source_word: חַסְדּוֹ
  choice: Upendo wake wa kudumu
  rationale: חֶסֶד huunganisha wazo la upendo mwaminifu, rehema, na uaminifu wa agano. ‘Upendo wa kudumu’ huhifadhi upana huo kwa lugha rahisi bila kuufupisha kuwa rehema pekee au uaminifu pekee.
theological_decisions:
- issue: Tafsiri ya חֶסֶד katika kauli ya sifa inayohusu agano
  choice: upendo wake wa kudumu
  alternative: uaminifu wake kwa agano; rehema zake; fadhili zake
  rationale: Neno hili linasifu upendo wa Mungu ulio thabiti na mwaminifu. ‘Upendo wa kudumu’ huhifadhi pande za upendo na uthabiti bila kulazimisha maana finyu ya kihisia au ya kisheria pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi na mwangwi wa liturujia lakini kinachoeleweka kwa msomaji wa kawaida. Nahau ‘Nyumba ya Aroni’ imehifadhiwa kwa sababu ni ya msingi katika muundo wa marudio wa zaburi.
