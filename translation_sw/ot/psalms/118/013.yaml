lexical_decisions:
- source_word: דַּחֹה דְחִיתַנִי
  choice: Ulinisukuma kwa nguvu
  rationale: Kitenzi-jina kisicho na kikomo kikifuatiwa na kitenzi cha mzizi huohuo ni muundo wa Kiebrania wa kusisitiza. Kiswahili cha kawaida huwasilisha msisitizo huo kwa ‘kwa nguvu’ badala ya kurudia kitenzi.
- source_word: לִנְפֹּל
  choice: ili nianguke
  rationale: Muundo wa ל pamoja na kitenzi-jina unaweza kuonyesha kusudi au matokeo. ‘Ili nianguke’ huhifadhi uwezekano huo na ni wa kawaida katika Kiswahili.
- source_word: וַיהוָה
  choice: lakini Yahwe
  rationale: Ingawa ו inaweza kumaanisha ‘na,’ muktadha unaonyesha tofauti kati ya shambulio na msaada wa Yahwe; kwa hiyo ‘lakini’ linafaa katika matini, huku maana nyingine ikitajwa katika tanbihi.
- source_word: עֲזָרָנִי
  choice: alinisaidia
  rationale: Ni kitenzi cha moja kwa moja chenye kiambishi cha yambwa cha nafsi ya kwanza umoja; ‘alinisaidia’ ni tafsiri sahihi na ya kawaida.
- source_word: יהוה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania linawakilishwa kama jina binafsi, si kubadilishwa na cheo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania ina jina la agano יהוה. ‘Yahwe’ hulihifadhi kama jina binafsi bila kuingiza badala ya kimapokeo iliyo cheo.
- issue: Uhusiano wa kishazi cha pili
  choice: lakini
  alternative: na
  rationale: Kiunganishi cha Kiebrania kinaweza kutafsiriwa ‘na,’ lakini hapa muktadha unaonyesha tofauti dhahiri kati ya kusukumwa na kuokolewa kwa msaada; uwezekano wa ‘na’ umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Kwa nguvu’ huwasilisha msisitizo wa Kiebrania kwa njia ya kawaida; ‘ili nianguke’ huhifadhi mvutano kati ya kusudi na matokeo.
