lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa moja kwa moja kama “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: לִי
  choice: yuko upande wangu
  rationale: Katika kishazi hiki, לִי huonyesha kuwa Yahwe anamuunga mkono msemaji; “yuko upande wangu” ni Kiswahili cha kawaida kinacholeta maana hiyo ya msaada na ulinzi.
- source_word: לֹא אִירָא
  choice: sitaogopa
  rationale: Kauli hii inaweza kueleza azimio au uhakika unaohusu wakati ujao. “Sitaogopa” huhifadhi ufupi na nguvu ya tamko la Kiebrania.
- source_word: מַה יַעֲשֶׂה לִי
  choice: anaweza kunitenda nini?
  rationale: Ingawa muundo wa Kiebrania ni karibu na “atanitenda nini?”, swali ni la balagha na huonyesha udhaifu wa uwezo wa mwanadamu; “anaweza” huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: אָדָם
  choice: mwanadamu
  rationale: Umoja wa אָדָם umetumiwa kwa maana ya jumla kumaanisha binadamu yeyote. “Mwanadamu” huhifadhi umoja huo na tofauti kati ya Yahwe na binadamu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Chanzo kinatumia jina la Mungu moja kwa moja. “Yahwe” huhifadhi jina hilo badala ya kuliwakilisha kwa cheo.
- issue: Maana ya לִי katika “Yahwe ... kwangu”
  choice: yuko upande wangu
  alternative: yuko pamoja nami
  rationale: Muktadha wa kuamini na kutokuogopa unaunga mkono maana ya Yahwe kuwa mtetezi wa msemaji. Tanbihi inadumisha uwezekano wa tafsiri ya ukaribu, “pamoja nami.”
- issue: Nguvu ya swali מַה יַעֲשֶׂה לִי אָדָם
  choice: Mwanadamu anaweza kunitenda nini?
  alternative: Mwanadamu atanifanyia nini?
  rationale: “Anaweza” huonyesha wazi nguvu ya swali la balagha kuhusu mipaka ya mwanadamu, huku tanbihi ikihifadhi muundo wa karibu zaidi na Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. “Yuko upande wangu” ni usemi wa kawaida wa msaada; “mwanadamu” hudumisha umoja wa jumla wa Kiebrania bila kuufanya usemi kuwa wa jinsia moja tu.
