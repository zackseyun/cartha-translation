  text: Open to me the gates of righteousness[c][b][a]; I will enter through them and give thanks to Yah.
translation:
  language: sw
  text: Nifungulieni malango ya haki[a]; nitaingia kupitia malango hayo, nami nitamshukuru Yah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “malango ya uadilifu.” Neno la Kiebrania linaweza kumaanisha haki au uadilifu.
    reason: lexical_alternative
  - marker: b
    text: “Yah” ni umbo fupi la jina la Mungu. Kitenzi “nitamshukuru” kinaweza pia kutafsiriwa “nitamsifu” katika muktadha huu.
    reason: alternative_reading
lexical_decisions:
- source_word: פִּתְחוּ לִי
  choice: Nifungulieni
  rationale: Kauli ya amri ya wingi pamoja na kiwakilishi cha nafsi ya kwanza inaelezwa kwa kawaida na kwa ufupi katika Kiswahili kama “Nifungulieni,” yaani “fungua kwa ajili yangu/ili niingie.”
- source_word: שַׁעֲרֵי
  choice: malango ya
  rationale: Ni wingi wa neno linalomaanisha lango, katika hali ya uambatanisho. “Malango” linafaa kwa milango mikubwa ya mahali pa ibada au mji.
- source_word: צֶדֶק
  choice: haki
  rationale: Neno hili linaweza kumaanisha uadilifu, hali ya kuwa sawa, au haki. “Haki” huhifadhi upana huo na linafaa katika muktadha huu wa ibada.
- source_word: אָבֹא בָם
  choice: nitaingia kupitia humo
  rationale: Kitenzi kinaonyesha hatua anayokusudia msemaji baada ya malango kufunguliwa; kiambishi בָם hapa huonyesha kupita katika malango hayo. “Humo” huepuka kurudia nomino bila kupoteza maana.
- source_word: אוֹדֶה
  choice: na kumshukuru
  rationale: Katika muktadha wa zaburi, ידה katika kauli ya Hiphil mara nyingi humaanisha kutoa shukrani au kusifu. “Kumshukuru” linaonyesha kwa uwazi maana inayofaa hapa huku tanbihi ikihifadhi uwezekano wa “kumsifu.”
- source_word: יָהּ
  choice: Yah
  rationale: Hili ni umbo fupi la jina la Mungu, si tetragramatoni kamili. Kutamka kwa uhamishaji kama “Yah” huhifadhi tofauti hiyo.
theological_decisions:
- issue: Maana ya צֶדֶק katika “malango ya haki”
  choice: haki
  alternative: uadilifu
  rationale: “Haki” huhifadhi maana pana ya kile kilicho sawa na cha adili bila kulazimisha kwamba malango yenyewe huwapa waingiaji hadhi fulani ya kitheolojia.
- issue: Tafsiri ya אוֹדֶה
  choice: kumshukuru
  alternative: kumsifu
  rationale: Katika usemi huu wa ibada, kitenzi kinaweza kujumuisha shukrani na sifa. “Kumshukuru” ni tafsiri ya moja kwa moja inayofaa, huku maana nyingine ikitajwa katika tanbihi.
- issue: Uwasilishaji wa jina יָהּ
  choice: Yah
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana umbo fupi la jina la Mungu; “Yah” hulihifadhi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa heshima lakini kinachoeleweka kwa wasomaji wa kawaida. “Nifungulieni” ni amri ya asili kwa kundi, na “malango” yanaendana na mazingira ya kuingia mahali patakatifu.
