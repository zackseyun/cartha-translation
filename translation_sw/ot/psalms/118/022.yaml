    reason: cross_reference
lexical_decisions:
- source_word: אֶבֶן
  choice: jiwe
  rationale: Nomino hii ya kawaida humaanisha jiwe; “jiwe” ni tafsiri ya asili inayohifadhi sitiari bila kubainisha ukubwa au matumizi yake kupita kiasi.
- source_word: מָאֲסוּ
  choice: walilikataa
  rationale: Kitenzi מאס hapa kinaonyesha kukataa kwa makusudi. “Walilikataa” kinafaa katika taswira ya ujenzi na kinaonyesha kwamba waashi hawakuliona kuwa linafaa.
- source_word: הַבּוֹנִים
  choice: waashi
  rationale: Kishiriki hiki humaanisha watu wanaojenga. “Waashi” ni neno la kawaida na fasaha kwa wajenzi wanaofanya kazi kwa mawe, hivyo linaendana vyema na sitiari hii.
- source_word: הָיְתָה
  choice: limekuwa
  rationale: Kauli timilifu ya Kiebrania inaonyesha hali iliyotokea na matokeo yanayoendelea; “limekuwa” huwasilisha kwa asili mgeuko kutoka kukataliwa hadi kuwa na nafasi kuu.
- source_word: לְרֹאשׁ פִּנָּה
  choice: jiwe kuu la pembeni
  rationale: Kirai hiki kihalisi ni “kichwa cha pembe.” “Jiwe kuu la pembeni” kinahifadhi taswira ya usanifu na wazo la cheo au umuhimu mkuu bila kulazimisha maana isiyo hakika ya jiwe la kileleni.
theological_decisions:
- issue: Matumizi ya Kimasihi ya mstari huu katika tafsiri ya baadaye ya Biblia
  choice: Taswira ya ujenzi imehifadhiwa katika maana yake ya moja kwa moja bila kumtaja Masihi au Kristo katika matini kuu.
  alternative: Kutafsiri mstari kwa namna inayobainisha moja kwa moja kuwa jiwe ni Masihi/Kristo.
  rationale: Matini ya Kiebrania yenyewe inaonyesha mgeuko wa kukataliwa na baadaye kuinuliwa, lakini haitaji wazi Masihi. Tanbihi inaonyesha matumizi ya Agano Jipya bila kuingiza hitimisho hilo ndani ya matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Waashi” ni fupi na ya asili katika muktadha wa jiwe; “jiwe kuu la pembeni” linaeleweka huku likihifadhi utata wa kiasi kuhusu nafasi mahsusi ya jiwe katika jengo.
