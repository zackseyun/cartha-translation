  text: Yah is my strength and song[a], and he has become my salvation.
translation:
  language: sw
  text: Yah[a] ni nguvu zangu na wimbo wangu, naye amekuwa wokovu wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kimetumia jina fupi la Mungu, “Yah,” si umbo kamili linalowakilishwa mahali pengine kama “BWANA.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזִּי
  choice: nguvu zangu
  rationale: Nomino עֹז humaanisha nguvu au uwezo; “nguvu zangu” ni usemi wa kawaida wa Kiswahili na unafaa katika ungamo hili la kishairi.
- source_word: וְזִמְרָת
  choice: na wimbo wangu
  rationale: Katika msemo huu wa kibiblia, זִמְרָה ina maana ya “wimbo.” Kiambishi cha nafsi kutoka עָזִּי kinaeleweka kuwa kinatawala pia nomino hii katika muundo wa kishairi.
- source_word: יָהּ
  choice: Yah
  rationale: Hili ni umbo fupi la jina la Mungu, tofauti na jina kamili יהוה; kulinakili kama “Yah” kunahifadhi tofauti iliyomo katika Kiebrania.
- source_word: וַיְהִי
  choice: amekuwa
  rationale: Kitenzi היה hapa kinaonyesha hali iliyotokea na ambayo matokeo yake yanaendelea; “amekuwa” huhifadhi nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: לִי
  choice: wangu
  rationale: 'Ingawa maana ya moja kwa moja ni “kwangu,” katika muundo huu wa Kiswahili uhusiano huo unaelezwa kwa kawaida kwa kimilikishi: “wokovu wangu.”'
- source_word: לִישׁוּעָה
  choice: wokovu
  rationale: יְשׁוּעָה inaweza kumaanisha wokovu, ukombozi, au ushindi; “wokovu” ni pana na inafaa katika muktadha wa kuokolewa na kumsifu Mungu.
theological_decisions:
- issue: Uwakilishi wa umbo fupi la jina la Mungu יָהּ
  choice: Yah
  alternative: BWANA
  rationale: Andiko la Kiebrania limetumia umbo fupi la kishairi יָהּ, si יהוה. “Yah” huhifadhi umbo hilo mahususi badala ya kulisawazisha na jina kamili linalowakilishwa kwa kawaida kama “BWANA.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishairi “nguvu zangu na wimbo wangu” umehifadhiwa, huku sentensi ikibaki wazi na ya kawaida kwa wasomaji wengi.
