  text: Out of my distress I called on Yah[a]; Yah answered me with spaciousness.
translation:
  language: sw
  text: Kutoka katika dhiki nilimwita Yah; Yah alinijibu kwa nafasi pana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kutoka mahali pa kubanwa nilimwita Yah; Yah alinijibu katika mahali pana.” Kiebrania kinatumia taswira ya mahali pa kubanwa kwa dhiki na mahali pana kwa nafuu au uhuru.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַמֵּצַר
  choice: Katika dhiki yangu
  rationale: Kirai hiki kwa maana halisi kinaonyesha kutoka mahali pembamba au pa kubanwa, na kwa njia ya sitiari kinamaanisha hali ya dhiki. Kiswahili hiki ni cha kawaida na kinaeleza hali ya msemaji; taswira halisi imefafanuliwa katika tanbihi.
- source_word: קָרָאתִי
  choice: nilimwita
  rationale: Katika muktadha wa sala, kitenzi hiki humaanisha kumwita au kumlilia Mungu. ‘Nilimwita’ ni cha moja kwa moja na kinaendana na jina la Mungu linalofuata.
- source_word: יָהּ
  choice: Yah
  rationale: Hili ni umbo fupi la kishairi la jina la Mungu. Kulihamisha kama ‘Yah’ kunahifadhi tofauti yake na umbo kamili יהוה pamoja na urudiaji wa kishairi.
- source_word: עָנָנִי
  choice: akanijibu
  rationale: Kitenzi na kiambishi chake vina maana ya ‘alinijibu.’ Kiunganishi cha usimulizi ‘aka-’ kinaonyesha mwitikio unaofuata mwito kwa Kiswahili cha kawaida.
- source_word: בַמֶּרְחָב
  choice: kwa kunipa nafasi pana
  rationale: Neno מֶרְחָב huonyesha mahali pana au hali ya uhuru baada ya kubanwa. Tafsiri hii inadumisha taswira ya upana na pia maana ya kupata nafuu, bila kuamua kwa uthabiti kwamba kihusishi ב ni cha mahali tu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יָהּ
  choice: Yah
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia umbo fupi la kishairi יָהּ, si tetragramatoni kamili יהוה. ‘Yah’ huhifadhi umbo hilo maalumu na urudiaji wake bila kuingiza tafsiri ya cheo.
- issue: Maana ya בַמֶּרְחָב
  choice: kwa kunipa nafasi pana
  alternative: mahali pana / katika nafasi pana
  rationale: Kihusishi ב kinaweza kueleweka kwa maana ya njia, hali, au mahali. Tafsiri kuu inaonyesha msaada ulioletwa na jibu la Mungu, huku tanbihi ikihifadhi usomaji halisi zaidi wa mahali na mvutano wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Dhiki yangu’ ni usemi wa kawaida, ilhali ‘nafasi pana’ inadumisha kwa kiasi taswira ya kubanwa na kufunguliwa; tanbihi inatoa muundo halisi zaidi wa kijiografia.
