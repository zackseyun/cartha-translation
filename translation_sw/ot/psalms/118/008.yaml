  text: Ni afadhali kutafuta kimbilio kwa Yahweh kuliko kumtumaini mwanadamu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “binadamu” au “watu”; neno la Kiebrania lililotafsiriwa “mwanadamu” liko katika umoja lakini linamaanisha wanadamu kwa ujumla.
