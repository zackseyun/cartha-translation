lexical_decisions:
- source_word: טוֹב
  choice: Ni afadhali
  rationale: Kivumishi hiki kinatoa ulinganisho wa ubora. “Ni afadhali” ni Kiswahili cha kawaida na kamili kinachowasilisha maana ya “ni bora zaidi.”
- source_word: לַחֲסוֹת
  choice: kumkimbilia
  rationale: Kitenzi חסה humaanisha kutafuta au kupata hifadhi kwa mtu. “Kumkimbilia” kinadumisha picha ya kwenda kwa mlinzi ili kupata usalama, badala ya kukifanya kuwa dhana ya jumla ya kuamini.
- source_word: בַּיהוָה
  choice: Yahwe
  rationale: Kihusishi kinaonyesha yule ambaye mtu anamkimbilia ili kupata hifadhi; muundo wa Kiswahili “kumkimbilia Yahwe” unawasilisha uhusiano huo kwa kawaida.
- source_word: מִבְּטֹחַ
  choice: kuliko kumtumaini
  rationale: 'מן pamoja na kitenzi-jina huonyesha ulinganisho: “afadhali ... kuliko.” “Kumtumaini” linawasilisha maana ya kuweka imani au tegemeo kwa mtu.'
- source_word: בָּאָדָם
  choice: mwanadamu
  rationale: אָדָם ni umoja wenye maana ya kijumla hapa, ukilinganisha kumtegemea Mungu na kumtegemea binadamu. “Mwanadamu” huhifadhi umoja huo na pia hueleweka kuwa mwakilishi wa wanadamu kwa ujumla.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano יְהוָה. “Yahwe” hulihifadhi kama jina maalumu badala ya kulibadilisha kuwa cheo.
- issue: Uwasilishaji wa אָדָם kama umoja wenye maana ya kijumla
  choice: mwanadamu
  alternative: binadamu; watu
  rationale: “Mwanadamu” huhifadhi umbo la umoja katika Kiebrania bila kuzuia maana yake ya kuwajumuisha wanadamu kwa ujumla. Tanbihi inaonyesha tafsiri nyingine zinazowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kumkimbilia” ni tamathali ya kutafuta hifadhi na ulinzi; sentensi fupi inadumisha usambamba na utofautishaji wa Kiebrania.
