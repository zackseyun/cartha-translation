  text: יַסֹּ֣ר יִסְּרַ֣/נִּי יָּ֑הּ וְ֝/לַ/מָּ֗וֶת לֹ֣א נְתָנָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/018.yaml
  text: Yah has surely disciplined me[a], but he has not given me over to death.
translation:
  language: sw
  text: Yah ameniadhibu kwa hakika,[a] lakini hakunikabidhi kwa mauti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “BWANA ameniadhibu kwa hakika.” Kiebrania kinatumia jina fupi la Mungu la kishairi, “Yah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסֹּר יִסְּרַנִּי
  choice: ameniadhibu kwa hakika
  rationale: Muundo wa kitenzi-jina kisicho na kikomo ukifuatwa na kitenzi cha mzizi huohuo unatilia tendo mkazo. “Kwa hakika” huhifadhi msisitizo huo kwa Kiswahili cha kawaida, na “kuadhibu” hapa linaweza kumaanisha adhabu yenye kusahihisha au kufundisha.
- source_word: יָּהּ
  choice: Yah
  rationale: Hili ni umbo fupi la kishairi la jina la Mungu. Kulihamisha kama “Yah” kunahifadhi tofauti yake na jina kamili יהוה.
- source_word: וְלַמָּוֶת לֹא נְתָנָנִי
  choice: lakini hakuniacha nife
  rationale: Kiunganishi kinaonyesha tofauti kati ya kuadhibiwa na kutokufa. Ingawa maana ya karibu ni “hakunitia mikononi mwa kifo,” “hakuniacha nife” ni Kiswahili cha asili kinachowasilisha kwamba adhabu haikuishia katika kifo.
theological_decisions:
- issue: Uwasilishaji wa umbo fupi la kishairi la jina la Mungu יָהּ
  choice: Yah
  alternative: BWANA
  rationale: “Yah” huhifadhi umbo maalumu lililotumiwa katika Kiebrania bila kulichanganya na jina kamili יהוה. Huu ni uamuzi wa kileksika na kishairi, si msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa wazi na rahisi kwa msomaji wa kawaida huku ikihifadhi msisitizo wa Kiebrania na jina la kishairi “Yah.”
