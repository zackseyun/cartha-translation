  text: Mshukuruni Yahweh, kwa maana ni mwema; kwa maana upendo wake wa kudumu ni wa milele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹדוּ
  choice: Mshukuruni
  rationale: Ni amri ya wingi kutoka ידה katika Hifili, yenye maana ya kumshukuru au kumsifu. “Mshukuruni” linafaa katika kiitikio hiki cha liturujia na hudumisha wazo la kutoa shukrani.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: ל humtambulisha anayeelekezewa shukrani, na jina la agano יהוה limetafsiriwa kwa unukuzi wa kawaida “Yahweh.”
- source_word: כִּי טוֹב
  choice: kwa maana yeye ni mwema
  rationale: כִּי hutoa sababu ya kushukuru. Kitenzi kishirikishi na kiwakilishi vimeongezwa kwa Kiswahili cha asili bila kubadili maana.
- source_word: לְעוֹלָם
  choice: ni wa milele
  rationale: Kirai hiki humaanisha “milele.” Muundo “ni wa milele” unabaki karibu na sentensi ya Kiebrania, ambayo haina kitenzi cha wazi cha ‘kudumu.’
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד huunganisha upendo, wema, na uaminifu wa kudumu. “Upendo thabiti” huhifadhi vipengele hivyo bila kuufungamanisha neno hilo na tafsiri finyu ya kimadhehebu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina יהוה. “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Iwapo לְעוֹלָם חַסְדּוֹ litafsiriwe kwa kitenzi cha kudumu
  choice: upendo wake thabiti ni wa milele
  alternative: upendo wake thabiti hudumu milele
  rationale: Kiebrania husema kwa karibu zaidi “kwa maana milele [ni] upendo wake thabiti.” Tafsiri iliyochaguliwa huhifadhi hali hiyo bila kuingiza kitenzi kisichotajwa, huku mbadala ukiwa wa kawaida na sahihi kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi na liturujia lakini kinachoeleweka kwa wasomaji wa kawaida. Wingi wa amri umehifadhiwa katika “Mshukuruni,” na urudiaji wa “kwa maana” unaakisi ulinganifu wa mistari ya Kiebrania.
