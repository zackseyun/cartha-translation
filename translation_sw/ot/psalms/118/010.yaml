lexical_decisions:
- source_word: כָּל גּוֹיִם
  choice: Mataifa yote
  rationale: Huwakilisha kwa uwazi na kwa mpangilio wa kawaida wa Kiswahili maana ya ‘mataifa yote.’
- source_word: סְבָבוּנִי
  choice: yalinizunguka
  rationale: Kitenzi hiki kina maana ya kumzunguka au kumzingira msemaji; ‘yalinizunguka’ huhifadhi taswira bila kuongeza maelezo.
- source_word: בְּשֵׁם יְהוָה
  choice: kwa jina la BWANA
  rationale: Huhifadhi nahau ya Kiebrania ya kutenda kwa kutegemea mamlaka na msaada wa YHWH; ‘BWANA’ ni uwakilishi wa heshima uliozoeleka wa jina la Mungu katika tafsiri za Kiswahili.
- source_word: כִּי אֲמִילַם
  choice: hakika niliwaangamiza
  rationale: כִּי hapa ina nguvu ya kusisitiza, hivyo ‘hakika.’ אֲמִילַם linatokana na מול katika muundo unaomaanisha kukata au kuondoa kabisa; ‘niliwaangamiza’ ni Kiswahili cha kawaida kinachowasilisha ushindi kamili katika muktadha huu.
theological_decisions:
- issue: Jina la agano יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ huhifadhi desturi pana ya kutamka jina la Mungu kwa heshima bila kuingiza msimamo wa kimadhehebu; herufi kubwa zinaonyesha kuwa linawakilisha tetragramatoni.
- issue: Nguvu ya כִּי katika kishazi cha pili
  choice: hakika
  alternative: kwa maana
  rationale: Katika muundo huu unaorudiwa wa zaburi, כִּי inaeleweka vizuri kama msisitizo wa uhakika wa tendo kuliko kiunganishi cha sababu.
- issue: Maana ya אֲמִילַם
  choice: niliwaangamiza
  alternative: nitawaangamiza
  rationale: Umbo la Kiebrania linaweza kuonekana la wakati usiotimilika, lakini katika usemi huu wa ushindi linaweza kueleza tendo lililohakikishwa au simulizi la kishairi. Wakati uliopita unalingana na ‘yalinizunguka’ na muktadha wa ushuhuda, bila kufuta nguvu ya uhakika inayobebwa na ‘hakika.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa mistari miwili na marudio ya dhamira umehifadhiwa kwa usemi mfupi na wenye nguvu.
