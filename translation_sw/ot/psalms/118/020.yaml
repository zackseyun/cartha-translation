  text: זֶֽה הַ/שַּׁ֥עַר לַ/יהוָ֑ה צַ֝דִּיקִ֗ים יָבֹ֥אוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/020.yaml
  text: This is the gate of Yahweh[a]; the righteous will enter through it.
translation:
  language: sw
  text: Hili ndilo lango la Yahwe[a]; wenye haki wataingia kupitia humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lango kwa ajili ya Yahwe,” au “lango linaloelekea kwa Yahwe.” Kihusishi cha Kiebrania kinaweza kuonyesha uhusiano au milki, manufaa, au mwelekeo; “la Yahwe” linafaa zaidi katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: Hili ndilo
  rationale: Kiwakilishi cha kuonyesha kinatambulisha lango linaloonyeshwa; muundo wa Kiswahili “Hili ndilo” ni wa kawaida na wenye mkazo unaofaa.
- source_word: הַשַּׁעַר
  choice: lango
  rationale: Neno שַׁעַר humaanisha lango au njia ya kuingilia; “lango” linadumisha picha halisi na linafaa katika muktadha wa ibada na maandamano.
- source_word: לַיהוָה
  choice: la Yahwe
  rationale: Kihusishi ל־ kinaweza kuonyesha uhusiano, milki, manufaa, au mwelekeo. “La Yahwe” linafaa vizuri katika muktadha huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: צַדִּיקִים
  choice: wenye haki
  rationale: Kivumishi hiki kilichotumiwa kama nomino ya wingi kinawataja watu wenye sifa ya haki; “wenye haki” ni Kiswahili cha kawaida na hudumisha maana ya kimaadili na kiteolojia.
- source_word: יָבֹאוּ
  choice: wataingia
  rationale: Kauli ya wakati usiotimilika ya בוא hapa inaeleza tendo la baadaye au lenye uhakika; pamoja na “lango,” “wataingia” ni sahihi na ya kawaida.
- source_word: בוֹ
  choice: kupitia humo
  rationale: Kihusishi ב־ kikihusishwa na lango huonyesha njia ya kupita; “kupitia humo” hudumisha rejeo kwa lango bila kutumia muundo usio wa kawaida wa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה; “Yahwe” hulitofautisha na cheo “Bwana” na kudumisha jina hilo katika maandishi makuu.
- issue: Maana ya kihusishi ל־ katika לַיהוָה
  choice: la Yahwe
  alternative: kwa ajili ya Yahwe; linaloelekea kwa Yahwe
  rationale: Kihusishi kinaweza kuonyesha uhusiano au milki, manufaa, au mwelekeo. Muktadha wa lango linalotambuliwa unaunga mkono “la Yahwe,” lakini tanbihi inaacha maana nyingine halali wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kishairi; “kupitia humo” ni wa asili zaidi kuliko “kupitia ndani yake” kwa kurejelea lango.
