  text: מֵ/אֵ֣ת יְ֭הוָה הָ֣יְתָה זֹּ֑את הִ֖יא נִפְלָ֣את בְּ/עֵינֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/023.yaml
  text: This has come from Yahweh[b][a]; it is marvelous in our eyes.
translation:
  language: sw
  text: Jambo hili limetoka kwa Yahweh[a]; nalo ni la ajabu machoni petu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Jambo hili limetendwa na Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Au “ni la kustaajabisha machoni petu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵת
  choice: limetoka kwa
  rationale: Kirai hiki huonyesha chanzo au asili. “Limetoka kwa” ni Kiswahili cha kawaida kinachoonyesha kwamba jambo hili lina asili yake kwa Yahweh bila kuongeza taswira ya “mkono” isiyosemwa wazi katika Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetafsiriwa kwa kulitamka kama “Yahweh,” badala ya kulibadilisha kuwa cheo, ili kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: הָיְתָה זֹּאת
  choice: Jambo hili limetoka
  rationale: Kwa neno kwa neno kirai hiki ni “hili limekuwa/likawa.” Katika muktadha kinaeleza jambo lililotokea na lenye asili kwa Yahweh. “Jambo hili limetoka” ni la kawaida kwa Kiswahili na linaungana vizuri na מֵאֵת.
- source_word: הִיא
  choice: nalo
  rationale: Kiwakilishi huru kinasisitiza jambo lililotajwa. “Nalo” hudumisha msisitizo na muunganiko wa kishairi bila kurudia “jambo hili” kwa uzito usio wa lazima.
- source_word: נִפְלָאת
  choice: la ajabu
  rationale: Neno hili humaanisha kitu cha kushangaza, cha kustaajabisha, au cha ajabu. “La ajabu” ni la asili, lenye hadhi, na linafaa katika lugha ya sifa.
- source_word: בְּעֵינֵינוּ
  choice: machoni petu
  rationale: Hii inadumisha nahau halisi ya Kiebrania, “machoni petu,” ambayo pia inaeleweka vizuri katika Kiswahili na kuonyesha mtazamo wa wale wanaozungumza.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ina jina binafsi יהוה. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa kimadhehebu.
- issue: Je, jambo limetoka kwa Yahweh au limetendwa naye?
  choice: limetoka kwa Yahweh
  alternative: limetendwa na Yahweh
  rationale: מֵאֵת huonyesha hasa chanzo, lakini katika muktadha inaweza pia kudokeza utendaji wa Yahweh. Matini kuu inahifadhi wazo la chanzo, huku tanbihi ikitoa uwezekano wa utendaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa kwa “nalo,” na nahau “machoni petu” imeachwa kwa sababu ni wazi na inaakisi Kiebrania.
