  text: זֶה הַ֭/יּוֹם עָשָׂ֣ה יְהוָ֑ה נָגִ֖ילָה וְ/נִשְׂמְחָ֣ה בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/024.yaml
  text: This is the day that Yahweh has made; let us rejoice and be glad in it.
translation:
  language: sw
  text: Hii ndiyo siku ambayo Yahweh ameifanya; tushangilie na tufurahi ndani yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה הַיּוֹם
  choice: Hii ndiyo siku
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida na kwa mkazo kiwakilishi זֶה pamoja na nomino yenye uamilifu wa kuelekeza kwenye siku maalumu.
- source_word: עָשָׂה
  choice: ameifanya
  rationale: Kitenzi cha wakati timilifu kinaonyesha tendo la Yahweh lililokamilika lenye umuhimu wa sasa; kiambishi cha yambwa -i- kinarejelea siku.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu katika maandishi ya Kiebrania limewasilishwa kama jina maalumu badala ya kubadilishwa kuwa cheo.
- source_word: נָגִילָה
  choice: tushangilie
  rationale: Umbo la cohortative la nafsi ya kwanza wingi linatoa mwito au azimio la pamoja; 'tushangilie' linaakisi nguvu hiyo ya kuhimiza.
- source_word: וְנִשְׂמְחָה
  choice: na kufurahi
  rationale: Kitenzi cha pili, pia cohortative, kinaunganishwa na cha kwanza; 'kufurahi' kinahifadhi tofauti ya maana bila kurudia neno lilelile.
- source_word: בּוֹ
  choice: ndani yake
  rationale: Kiwakilishi cha nafsi ya tatu umoja kinarejelea kwa kawaida siku iliyotajwa; tafsiri hii inadumisha usemi wa Kiebrania bila kuuhamishia kwa mtu.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina maalumu la Mungu. 'Yahweh' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Kirejeo cha בּוֹ
  choice: ndani yake, yaani siku
  alternative: ndani yake, yaani Yahweh
  rationale: Kisintaksia kiambishi kinaweza kuwa cha kiume umoja, lakini katika muktadha kirejeo cha karibu na cha kawaida ni 'siku.' Tafsiri haifanyi kirejeo hiki kuwa kauli ya ziada ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. 'Hii ndiyo siku' ni ya kawaida na yenye mkazo; 'tushangilie na kufurahi' huhifadhi mwito wa pamoja na usambamba wa kishairi.
