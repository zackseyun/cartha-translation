  yaml_path: translation/ot/psalms/118/025.yaml
  text: Please, LORD, save us! Please, LORD, grant us success[a]!
translation:
  language: sw
  text: Ee BWANA, tafadhali utuokoe! Ee BWANA, tafadhali utupe mafanikio[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hakitaji wazi walengwa wa amri hizi; kiambishi ‘tu-’ kimetolewa katika muktadha wa sala ya jumuiya.
    reason: implicit_object
lexical_decisions:
- source_word: אָנָּא ... נָּא (ʾannāʾ ... nāʾ)
  choice: tafadhali
  rationale: Chembe hizi zinaonyesha ombi la kusihi kwa nguvu, si wakati unaomaanisha ‘sasa’. ‘Tafadhali’ ni ombi la kawaida, la heshima, na linaloeleweka katika Kiswahili cha sasa.
- source_word: יְהוָה (YHWH)
  choice: BWANA
  rationale: Jina la agano limetafsiriwa kwa desturi iliyoenea ya Kiswahili ya kutumia ‘BWANA’ kwa herufi kubwa.
- source_word: הוֹשִׁיעָה (hôšîʿâ)
  choice: utuokoe
  rationale: Kitenzi hiki ni ombi la kuokoa au kukomboa. Kiambishi ‘tu-’ kinaweka wazi mlengwa wa kijumuiya anayodokezwa na muktadha.
- source_word: הַצְלִיחָה (haṣlîḥâ)
  choice: utupe mafanikio
  rationale: Kitenzi hiki kinaomba kufanikiwa au kupewa mafanikio. Kauli hii ni ya asili katika Kiswahili na haibani aina ya mafanikio yanayoombwa.
theological_decisions:
- issue: Walengwa wa vitenzi vya maombi hawakutajwa wazi katika Kiebrania.
  choice: Kutumia ‘utuokoe’ na ‘utupe mafanikio’, huku maelezo ya chini yakibainisha kuwa ‘tu-’ limetolewa katika muktadha wa sala ya jumuiya.
  alternative: 'Kutafsiri bila mlengwa: ‘okoa’ na ‘leta mafanikio’.'
  rationale: Muktadha wa zaburi ni maombi ya jumuiya, na Kiswahili cha kawaida huhitaji au hunufaika na mlengwa aliye wazi. Maelezo ya chini yanahifadhi uwazi kuhusu hali ya matini ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya heshima, ya moja kwa moja, na inafaa kwa sala ya hadhara. Urudiaji sambamba wa ‘Ee BWANA, tafadhali’ umehifadhiwa ili kuonyesha msisitizo wa mstari wa Kiebrania.
