  text: 'Israeli na aseme sasa[a]: “Upendo wake thabiti ni wa milele.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania נָא linaongeza msisitizo au uharaka wa himizo; kulingana na muktadha linaweza pia kutafsiriwa “tafadhali” au “hakika.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Kwa maana upendo wake thabiti ni wa milele.” Neno la Kiebrania כִּי linaweza kutafsiriwa “kwa maana” au “kwamba,” au kueleweka kuwa linaanzisha maudhui ya ungamo. “Upendo thabiti” hutafsiri חֶסֶד, yaani upendo mwaminifu na wenye kudumu; pia linaweza kutafsiriwa “rehema,” “fadhili,” au “upendo wa agano,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמַר נָא
  choice: na aseme sasa
  rationale: Kitenzi cha namna ya himizo pamoja na נָא kinatoa mwito wenye msisitizo; ‘na aseme sasa’ ni Kiswahili cha kawaida kinachofaa mwito wa kiliturujia.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la taifa na jumuiya ya agano limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: כִּי
  choice: Kwa maana
  rationale: Chembe hii inaweza kuanzisha sababu au maudhui ya tamko. ‘Kwa maana’ inahifadhi uhusiano wake wa wazi na mstari wa kwanza bila kuondoa uwezekano wa kuisoma kama sehemu ya ungamo.
- source_word: לְעוֹלָם
  choice: ni wa milele
  rationale: Kirai hiki huonyesha muda usio na mwisho; muundo ‘ni wa milele’ unafuata kwa karibu sentensi nomino ya Kiebrania na unasikika kiasili kwa Kiswahili.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד hapa ni upendo wenye uaminifu na kudumu, hasa katika uhusiano wa agano. ‘Upendo thabiti’ huhifadhi upana huo kuliko ‘rehema’ peke yake.
theological_decisions:
- issue: Tafsiri ya חֶסֶד katika kiitikio cha sifa kinachohusu agano
  choice: upendo wake thabiti
  alternative: rehema zake; upendo wake wa agano; fadhili zake
  rationale: Chaguo hili linaonyesha upendo wa Mungu wenye uaminifu na kudumu bila kuufupisha kuwa huruma pekee wala kuingiza ufafanuzi wa kimadhehebu.
- issue: Kazi ya כִּי
  choice: Kwa maana
  alternative: kwamba; kuiacha bila neno maalumu na kutumia nukuu ya moja kwa moja
  rationale: Kiebrania kinaweza kueleweka kama sababu au kama utangulizi wa maudhui ya tamko. Tafsiri kuu inahifadhi ‘kwa maana,’ huku tanbihi ikitaja uwezekano mwingine.
