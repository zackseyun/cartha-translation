  yaml_path: translation/ot/psalms/118/028.yaml
  text: You are my God[a], and I will give thanks to you; my God[b], I will exalt you.
translation:
  language: sw
  text: Wewe ni Mungu wangu, nami nitakushukuru; Mungu wangu, nitakutukuza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלִי
  choice: Mungu wangu
  rationale: Nomino אֵל yenye kiambishi cha nafsi ya kwanza umoja ni mwito wa moja kwa moja, ‘Mungu wangu.’ Hili ni tamko la kawaida, la heshima, na la asili katika Kiswahili.
- source_word: אַתָּה
  choice: Wewe ni
  rationale: 'Kiwakilishi huru kinasisitiza mhusika katika kishazi kisicho na kitenzi: kihalisi, ‘Mungu wangu, wewe.’ Kiswahili huhitaji ‘ni’ ili kutoa sentensi ya asili huku ‘Wewe’ kikihifadhi msisitizo.'
- source_word: וְאוֹדֶךָ
  choice: nami nitakushukuru
  rationale: Hifili ya ידה katika muktadha wa zaburi humaanisha kumshukuru Mungu, ikiwa pia na kivuli cha kumsifu. ‘Nitakushukuru’ huhifadhi shukrani na yambwa ya nafsi ya pili.
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Ni mwito wa pili wa Mungu unaolingana na אֵלִי. Kurudia ‘Mungu wangu’ kunahifadhi usambamba na ibada binafsi ya Kiebrania.
- source_word: אֲרוֹמְמֶךָ
  choice: nitakutukuza
  rationale: Kitenzi רום hapa kina maana ya kuinua au kumweka juu katika sifa. ‘Nitakutukuza’ ni lugha ya kawaida ya ibada na huhifadhi maana ya kumwinua kwa heshima.
theological_decisions:
- issue: Uwasilishaji wa majina ya Mungu אֵלִי na אֱלֹהַי
  choice: Mungu wangu ... Mungu wangu
  alternative: Mwenye nguvu wangu ... Mungu wangu
  rationale: Miundo yote miwili ni miito ya moja kwa moja kwa Mungu katika ibada. Tafsiri ileile huhifadhi usambamba wa kishairi na tamko la uhusiano binafsi bila kuingiza tofauti ya kimafundisho isiyodaiwa na mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi na marudio ya Kiebrania yamehifadhiwa bila kufanya sentensi kuwa nzito.
