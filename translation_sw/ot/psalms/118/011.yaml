lexical_decisions:
- source_word: סַבּוּנִי / סְבָבוּנִי
  choice: walinizingira
  rationale: Vitenzi vyote viwili vinatokana na סבב na vinaonyesha kuzungukwa kabisa. Kurudia maneno kunahifadhi msisitizo wa kishairi na hali ya shinikizo.
- source_word: גַם
  choice: naam
  rationale: Katika mstari huu neno hilo linatilia mkazo kauli inayorudiwa, badala ya kuongeza jambo jingine tu. “Naam” ni la heshima na la kawaida katika ushairi wa Kiswahili.
- source_word: בְּשֵׁם יְהוָה
  choice: kwa jina la Yahwe
  rationale: Kihusishi בְּ hapa kinaonyesha kutenda kwa kutegemea au kuomba mamlaka na nguvu zinazohusishwa na jina la Mungu.
- source_word: אֲמִילַם
  choice: nitawakatilia mbali
  rationale: Umbo la kitenzi ni la nafsi ya kwanza katika hali isiyotimilika, hivyo wakati ujao unafaa katika muktadha huu. “Kuwakatilia mbali” huhifadhi wazo la hatua madhubuti dhidi ya maadui bila kulazimisha picha moja tu ya kuwaua.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina maalumu la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo, huku “BWANA” likiwa badala ya jadi inayotumiwa katika tafsiri nyingi za Kiswahili.
- issue: Nguvu na matokeo ya אֲמִילַם
  choice: nitawakatilia mbali
  alternative: nitawaangamiza / nitawafukuza
  rationale: Kitenzi kinaonyesha hatua madhubuti ya kuwaondoa au kuwakatilia mbali maadui, lakini kiwango chake kamili kinaweza kueleweka kwa namna tofauti. Tafsiri kuu haifanyi uamuzi wa lazima kwamba wote waliuawa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki chenye mtindo wa kishairi ulio wazi na wa heshima. “Naam” huhifadhi msisitizo bila kuwa nzito mno; marudio ya “walinizingira” yameachwa makusudi. Wakati ujao katika “nitawakatilia mbali” unaakisi umbo la kitenzi cha Kiebrania na ujasiri wa msemaji.
