base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/011.yaml
  text: They surrounded me[a], yes, they surrounded me[c][b]; in the name of Yahweh I cut them down.
translation:
  language: sw
  text: Walinizingira[a], naam, walinizingira; kwa jina la Yahwe[b] nitawakatilia mbali[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Walinizunguka.” Ndivyo pia katika kauli inayorudiwa.'
    reason: lexical_alternative
  - marker: b
    text: Kwa kawaida jina la Kiebrania יהוה hutamkwa “Yahwe”; tafsiri nyingi hulitoa kama “BWANA.”
    reason: alternative_reading
  - marker: c
    text: 'Au: “nitawaangamiza” au “nitawakata.” Kitenzi cha Kiebrania kinaonyesha hatua madhubuti ya kuwaondoa maadui.'
