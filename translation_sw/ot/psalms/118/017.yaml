  text: לֹֽא אָמ֥וּת כִּי אֶֽחְיֶ֑ה וַ֝/אֲסַפֵּ֗ר מַֽעֲשֵׂ֥י יָֽהּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/017.yaml
  text: I will not die[a], but I will live and recount the deeds of Yah.
translation:
  language: sw
  text: Sitakufa, bali nitaishi, nami nitasimulia matendo ya Yah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yah” ni umbo fupi la kishairi la jina la Mungu; tafsiri nyingi hulitafsiri kwa ujumla zaidi kuwa “BWANA.”
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא אָמוּת
  choice: Sitakufa
  rationale: 'Kikanushi לֹא pamoja na kitenzi cha nafsi ya kwanza אָמוּת kinatoa tamko la uhakika linaloelekea wakati ujao: “Sitakufa.”'
- source_word: כִּי
  choice: bali
  rationale: 'Katika ulinganifu huu wa kishairi, כִּי inaonyesha tofauti yenye kusahihisha wazo lililotangulia: si kufa, bali kuishi. “Bali” ni ya asili na huhifadhi mkazo huo.'
- source_word: אֶחְיֶה
  choice: nitaishi
  rationale: Kitenzi hiki cha nafsi ya kwanza kinaendana moja kwa moja na “sitakufa” na kuendeleza tamko la uhakika kuhusu wakati ujao.
- source_word: וַאֲסַפֵּר
  choice: nami nitasimulia
  rationale: Piel ya ספר hapa ina maana ya kusimulia au kutangaza matendo yaliyofanywa. “Nitasimulia” ni ya kawaida, wazi, na inafaa kwa ushuhuda wa kishairi; “nami” huhifadhi kiunganishi וַ־ na mwendelezo wa nafsi.
- source_word: מַעֲשֵׂי
  choice: matendo ya
  rationale: Wingi wa מַעֲשֶׂה katika hali ya kuunganishwa unarejelea mambo aliyoyafanya Mungu. “Matendo” ni neno la sasa, lenye hadhi, na lisilo la kinadharia kupita kiasi.
- source_word: יָהּ
  choice: Yah
  rationale: Hili ni umbo fupi la kishairi la jina la Mungu, si cheo. Kulitohoa kama “Yah” kunahifadhi tofauti yake na jina kamili יְהוָה.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יָהּ
  choice: Yah
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia umbo fupi la kishairi la jina la Mungu. “Yah” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku tanbihi ikitaja tafsiri mbadala iliyozoeleka.
- issue: Uhusiano wa כִּי na vifungu vinavyoizunguka
  choice: bali
  alternative: kwa maana
  rationale: Ingawa כִּי inaweza kuwa ya kisababishi, hapa ulinganifu wa “sitakufa / nitaishi” unaunga mkono maana ya kiadversativi. “Bali” huhifadhi mvutano wa kishairi bila kuongeza maelezo ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi unahifadhi ulinganifu wa kishairi kati ya “sitakufa” na “nitaishi”; “nami nitasimulia” unasikika kwa kawaida bila kupunguza uzito wa tamko.
