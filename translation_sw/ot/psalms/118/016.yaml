  text: יְמִ֣ין יְ֭הוָה רוֹמֵמָ֑ה יְמִ֥ין יְ֝הוָה עֹ֣שָׂה חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/016.yaml
  text: The right hand of Yahweh is exalted[b][a]; the right hand of Yahweh does valiantly.
translation:
  language: sw
  text: 'Mkono wa kuume wa Yahwe umeinuliwa juu[a];

    mkono wa kuume wa Yahwe unatenda kwa nguvu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umetukuka” au “unashinda.” Kitenzi cha Kiebrania kinaweza kumaanisha kuinuliwa au kuwa juu, na katika muktadha huu kinaweza kudokeza ushindi.
    reason: lexical_alternative
  - marker: b
    text: Au “unaonyesha uwezo,” “unatenda kwa ushujaa,” au “unapata ushindi.” Nahau ya Kiebrania inaeleza tendo lenye nguvu au lenye kuleta ushindi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמִין
  choice: mkono wa kuume
  rationale: Inahifadhi taswira halisi ya Kiebrania ya mkono wa kuume, ambayo katika ushairi huwakilisha nguvu na ushindi, badala ya kuibadili moja kwa moja kuwa dhana ya ‘nguvu.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Inawakilisha jina binafsi la Mungu katika Tetragramatoni badala ya kulibadilisha kuwa cheo.
- source_word: רוֹמֵמָה
  choice: umeinuliwa juu
  rationale: Umbo hili linakubaliana na יְמִין na linaweza kueleza kuwa juu au kuinuliwa; tafsiri hii huhifadhi taswira na hali ya kishairi bila kuamua kimya kimya kuwa maana yake ni ‘unashinda.’
- source_word: עֹשָׂה
  choice: unatenda
  rationale: Kitenzi עשה kina maana pana ya kufanya au kutenda. ‘Unatenda’ ni cha asili katika muundo huu wa Kiswahili.
- source_word: חָיִל
  choice: kwa nguvu
  rationale: Katika nahau עשה חיל, neno hili huonyesha tendo lenye uwezo, ushujaa, au ushindi. ‘Kwa nguvu’ ni wazi na la kawaida huku maelezo ya chini yakihifadhi uwezekano wa maana ya ushindi.
theological_decisions:
- issue: Lugha ya kibinadamu kuhusu tendo la Mungu
  choice: Kuhifadhi ‘mkono wa kuume’ kama ilivyo katika taswira ya Kiebrania.
  alternative: ‘Nguvu za Yahwe zimeinuliwa juu; Yahwe anatenda kwa uwezo.’
  rationale: Taswira hii ni muhimu katika ushairi wa Biblia na huonyesha nguvu na uingiliaji wa ushindi wa Yahwe bila kuiondoa anthropomofizimu ya maandishi.
- issue: Maana ya kishairi ya רוֹמֵמָה na עֹשָׂה חָיִל
  choice: Kutumia ‘umeinuliwa juu’ na ‘unatenda kwa nguvu,’ huku maana mbadala zikitolewa katika tanbihi.
  alternative: ‘Unashinda; ... unapata ushindi.’
  rationale: Kiebrania kinaweza kuonyesha kuinuliwa, ukuu, uwezo, au ushindi. Tafsiri kuu haipaswi kulazimisha maana ya ushindi pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Mistari miwili inadumisha urudiaji na ulinganifu wa Kiebrania; ‘mkono wa kuume’ huhifadhi taswira halisi. Viashiria vya tanbihi vimewekwa mara baada ya vifungu vinavyohusika.
