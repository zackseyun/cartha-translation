lexical_decisions:
- source_word: רַבַּת שָׂבְעָה
  choice: imejaa kupita kiasi
  rationale: Muungano huu unaonyesha kushibishwa au kujazwa kwa kiwango kilichozidi, hasa kwa jambo lisilopendeza. Kiswahili hiki kinahifadhi nguvu ya kielezi רַבַּת pamoja na kitenzi שָׂבְעָה.
- source_word: נַפְשֵׁנוּ
  choice: Nafsi yetu
  rationale: Umoja wenye kiambishi cha wingi unahifadhi taswira ya kishairi ya Kiebrania kuhusu utu au maisha ya ndani ya jamii nzima.
- source_word: הַלַּעַג
  choice: dhihaka
  rationale: Neno hili hueleza kejeli na maneno ya kudhalilisha; “dhihaka” ni la kawaida, lenye hadhi, na linafaa katika usambamba wa kishairi.
- source_word: הַשַּׁאֲנַנִּים
  choice: wale wanaostarehe
  rationale: Huwataja walio salama na wasiosumbuliwa, huenda kwa hali ya kujiridhisha. Chaguo hili linahifadhi maana ya msingi bila kulazimisha hukumu ya “wazembe” au “waliojikinai.”
- source_word: הַבּוּז
  choice: dharau
  rationale: Hueleza mtazamo au tendo la kudunisha; “dharau” linatofautiana kwa uwazi na “dhihaka” huku likihifadhi usambamba.
- source_word: לִגְאֵיוֹנִים
  choice: wenye kiburi
  rationale: Nomino hii ya wingi inawarejelea watu wenye majivuno au kiburi. “Wenye kiburi” ni ya asili na inaeleweka kwa urahisi katika Kiswahili cha sasa.
