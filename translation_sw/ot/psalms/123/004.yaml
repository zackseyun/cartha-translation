  text: Nafsi yetu imeshiba kupita kiasi kwa dhihaka za wale wanaostarehe[a], na dharau za wenye kiburi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nafsi yetu imeshiba kwa kejeli za waliojitosheleza, na dharau za wenye majivuno.”
