  yaml_path: translation/ot/psalms/123/001.yaml
  text: A Song of Ascents[a]. To you I lift up my eyes[b], O you who are enthroned in the heavens.
translation:
  language: sw
  text: 'Wimbo wa Kupanda.


    Kwako nainua macho yangu,

    wewe uketiye mbinguni.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa Kupanda
  rationale: Huhifadhi taswira ya Kiebrania ya kupanda bila kuamua ikiwa kichwa hiki kinahusu hija, ngazi za ibada, au matumizi ya kimuziki.
- source_word: אֵלֶיךָ
  choice: Ee wewe
  rationale: Katika Kiswahili, muundo huu huleta kwa kawaida mwito wa moja kwa moja unaoendelea katika kifungu kizima; maana ya kuelekeza tendo kwa mhusika huyo inaonekana wazi katika kitenzi ‘ninakuinulia.’
- source_word: נָשָׂאתִי אֶת עֵינַי
  choice: ninakuinulia macho yangu
  rationale: Kauli ya wakati uliopo inaonyesha tendo la sasa la sala, huku ‘kuinulia macho’ ikihifadhi taswira halisi na maana ya kuelekeza tumaini au ombi.
- source_word: הַיֹּשְׁבִי
  choice: uketiye
  rationale: Hili ni neno la kawaida, lenye heshima, linalohifadhi maana ya msingi ya kuketi bila kuongeza wazi wazo la kiti cha enzi ambalo halikutajwa moja kwa moja.
- source_word: בַּשָּׁמָיִם
  choice: mbinguni
  rationale: ‘Mbinguni’ ni usemi wa kawaida wa Kiswahili unaolingana na mahali pa kimbingu; umbo la Kiebrania halihitaji kulazimishwa kuwa wingi wa Kiswahili.
theological_decisions:
- issue: Maana ya הַיֹּשְׁבִי kuhusu Mungu
  choice: uketiye
  alternative: utawalaye kutoka kwenye kiti cha enzi
  rationale: Tafsiri inahifadhi maana ya moja kwa moja ya ‘kuketi/kukaa’ na haitamki wazi ufalme au kiti cha enzi, ingawa muktadha unaweza kuwa na mwangwi huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa mwito umetangulizwa ili sentensi isikike kwa ufasaha bila kupoteza uhusiano wa kisarufi wa Kiebrania.
