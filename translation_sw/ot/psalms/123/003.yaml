  text: Uturehemu[a], ee Yahweh, uturehemu; kwa maana tumeshiba sana dharau.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Utufadhili.” Kitenzi cha Kiebrania kinaweza kumaanisha kuonyesha fadhili, neema, au rehema.
