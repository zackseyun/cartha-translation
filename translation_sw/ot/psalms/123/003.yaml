lexical_decisions:
- source_word: חָנֵּנוּ
  choice: Utufadhili
  rationale: Amri ya kitenzi חנן pamoja na kiambishi cha nafsi ya kwanza wingi ni ombi la kuonyeshwa fadhili au neema. “Utufadhili” ni ya asili katika Kiswahili na huhifadhi wazo la msingi bila kulazimisha maana ya toba.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetafsiriwa kwa unukuzi “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu ya ombi lililotangulia na inafaa katika mtindo wa kishairi wenye heshima.
- source_word: רַב
  choice: kabisa
  rationale: Limetumika kuimarisha kitenzi שָׂבַעְנוּ na kuonyesha kiwango kilichozidi; pamoja na “tumeshashiba” linawasilisha wazo la kuwa wamepata dharau kupita kiasi.
- source_word: שָׂבַעְנוּ
  choice: tumeshashiba
  rationale: Kitenzi hiki humaanisha kushiba au kujazwa kikamilifu. Taswira halisi imehifadhiwa kwa Kiswahili cha kawaida, huku kiambishi “-sha-” kikionyesha kuwa kiwango cha kutosha kimepitwa.
- source_word: בּוּז
  choice: dharau
  rationale: Neno hili linamaanisha hali au matendo ya kuwadharau wengine; “dharau” linaendana moja kwa moja na toni ya zaburi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja. “Yahweh” huhifadhi jina hilo badala ya kuliweka kama cheo.
- issue: Maana ya חנן katika ombi
  choice: Utufadhili
  alternative: Uturehemu
  rationale: Kitenzi kinaweza kumaanisha kuonyesha fadhili, neema, au rehema. “Utufadhili” huhifadhi upana wa msingi wa fadhili/neema bila kuifanya aya iwe hasa ombi la msamaha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na mtiririko wa kishairi. Marudio ya ombi yamehifadhiwa. Taswira ya Kiebrania ya “kushiba dharau” imehifadhiwa kwa kuwa inaeleweka katika Kiswahili na ina uzito wa kishairi.
