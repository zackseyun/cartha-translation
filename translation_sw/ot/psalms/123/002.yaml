source:
  edition: WLC
  text: הִנֵּ֨ה כְ/עֵינֵ֪י עֲבָדִ֡ים אֶל יַ֤ד אֲֽדוֹנֵי/הֶ֗ם כְּ/עֵינֵ֣י שִׁפְחָה֮ אֶל יַ֪ד גְּבִ֫רְתָּ֥/הּ כֵּ֣ן עֵ֭ינֵי/נוּ אֶל יְהוָ֣ה אֱלֹהֵ֑י/נוּ עַ֝֗ד שֶׁ/יְּחָנֵּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/002.yaml
  text: Look[a], as the eyes of servants are toward the hand of their masters, as the eyes of a female servant are toward the hand of her mistress, so our eyes are toward Yahweh our God[b], until he shows us favor.
translation:
  language: sw
  text: Tazama, kama macho ya watumishi[a] yanavyoelekea mkono wa mabwana wao, kama macho ya mjakazi yanavyoelekea mkono wa bibi yake, ndivyo macho yetu yanavyoelekea Yahweh Mungu wetu, mpaka atakapotufadhili.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumwa”; taswira ni ya watu wanaowategemea wenye mamlaka, wakielekea mkono wao kwa ishara au riziki.
    reason: lexical_alternative
  - marker: b
    text: Au “mpaka atakapokuwa na neema kwetu” au “mpaka atakapotuhurumia.”
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Kiashiria hiki kinavuta fikira na kuanzisha ulinganisho; “Tazama” ni Kiswahili cha sasa chenye hadhi.
- source_word: כְעֵינֵי
  choice: kama macho ya
  rationale: Kiambishi כְּ kinaonyesha ulinganisho, na muundo huu unahifadhi usambamba wa kishairi.
- source_word: עֲבָדִים
  choice: watumishi
  rationale: Neno linaweza kumaanisha watumishi au watumwa; hapa taswira inasisitiza utegemezi na uangalifu wao kwa mwenye mamlaka. Mbadala umewekwa katika tanbihi.
- source_word: יַד
  choice: mkono
  rationale: Tafsiri halisi inadumisha taswira ya mkono unaoweza kutoa ishara, msaada, au riziki.
- source_word: אֲדֹנֵיהֶם
  choice: mabwana wao
  rationale: Wingi wenye kiambishi cha nafsi ya tatu wingi; “mabwana wao” unafaa mazingira ya kaya na mamlaka.
- source_word: שִׁפְחָה
  choice: mjakazi
  rationale: Hutaja mtumishi au mtumwa wa kike; “mjakazi” ni neno fasaha na linaloeleweka linalohifadhi jinsia iliyotajwa.
- source_word: גְּבִרְתָּהּ
  choice: bibi yake
  rationale: Humaanisha mwanamke mwenye mamlaka juu ya mjakazi; katika Kiswahili sanifu “bibi yake” ni usemi wa kawaida katika muktadha huu.
- source_word: כֵּן
  choice: ndivyo
  rationale: Huanzisha upande wa pili wa ulinganisho na kuunganisha mistari kwa kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina maalumu la Mungu limehifadhiwa badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Tafsiri ya moja kwa moja inayohifadhi kiambishi cha nafsi ya kwanza wingi.
- source_word: עַד שֶׁיְחָנֵּנוּ
  choice: mpaka atakapotufadhili
  rationale: Kitenzi חנן kina maana ya kuonyesha neema au fadhili; “kutufadhili” ni cha asili na kinahifadhi wazo la tendo la neema.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja; “Yahweh” huhifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Nuansi ya חנן katika ombi la mwisho
  choice: mpaka atakapotufadhili
  alternative: mpaka atakapotuneemesha; mpaka atakapotuhurumia
  rationale: Mzizi חנן unalenga neema au fadhili. Tafsiri kuu inatumia “kutufadhili,” huku tanbihi ikihifadhi tafsiri nyingine halali bila kuifanya dhana ya huruma kuwa maana pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usambamba wa kishairi na taswira ya macho kuelekea mkono vimehifadhiwa; “yanavyoutazama” na “yanavyomtazama” hutofautisha kwa kawaida mkono usio mtu na Yahweh aliye mtu wa kutazamwa.
