translation:
  language: sw
  text: 'Wimbo wa Kupanda.


    Nimekuinulia macho yangu,


    wewe uketiye[a] mbinguni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wewe uliyetiwa kwenye kiti cha enzi mbinguni.” Kiebrania kwa kawaida husema “uketiye/ukaaye,” lakini hapa huenda kukawa na dokezo la kutawala kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wimbo wa kupandia
  rationale: Kichwa cha zaburi kinamaanisha wimbo unaohusishwa na kupanda; tafsiri hii ni ya kawaida, fupi, na haiamui kwa lazima ikiwa ni kupanda Yerusalemu au kupanda ngazi.
- source_word: נָשָׂאתִי אֶת־עֵינַי
  choice: Nimekuinulia macho yangu
  rationale: Muundo huu wa Kiswahili unaonyesha tendo lililoelekezwa kwa Mungu na kudumisha taswira halisi ya kuinua macho.
- source_word: הַיֹּשְׁבִי
  choice: uketiye
  rationale: Kitenzi cha Kiebrania kimsingi ni ‘kuketi/kukaa’; ‘uketiye’ huhifadhi maana ya moja kwa moja bila kulazimisha dokezo la kifalme la ‘aliyetawazwa’.
- source_word: בַּשָּׁמָיִם
  choice: mbinguni
  rationale: ‘Mbinguni’ ni usemi wa kawaida wa Kiswahili unaowakilisha wingi wa kimuundo wa neno la Kiebrania bila kuleta Kiswahili kisicho cha kawaida.
theological_decisions:
- issue: Iwapo kuketi mbinguni kutafsiriwe wazi kama kutawala kifalme
  choice: wewe uketiye mbinguni
  alternative: wewe uliyetiwa kwenye kiti cha enzi mbinguni
  rationale: Maana ya kifalme inaweza kudokezwa na muktadha, lakini haijaelezwa wazi katika kitenzi; tafsiri kuu inahifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Uketiye’ limetumiwa kwa mtiririko wa kishairi; ‘ukaaye’ pia linawezekana.
