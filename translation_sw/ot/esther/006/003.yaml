base_translation:
  language: en
  yaml_path: translation/ot/esther/006/003.yaml
  text: Then the king said[a], “What honor and greatness has been bestowed on Mordecai for this?” The king’s young men who attended him said, “Nothing has been done for him.”
translation:
  language: sw
  text: Kisha mfalme akauliza[a], “Mordekai amefanyiwa heshima na ukuu gani kwa sababu ya jambo hili?” Vijana wa mfalme waliomhudumia wakasema, “Hakuna lolote alilofanyiwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mordekai amepewa heshima na ukuu gani kwa ajili ya jambo hili?”
    reason: Mbadala wa kimtindo unaotumia ‘amepewa’ kwa kauli tendwa ya swali na ‘kwa ajili ya’ kwa maana ya kisababishi ya עַל זֶה.
lexical_decisions:
- source_word: מַה נַּעֲשָׂה
  choice: Ni ... gani ambao ... amepewa
  rationale: Kauli tendwa ya עשה inauliza ni tendo gani lililofanywa. Kwa kuwa vitu vinavyofuata ni heshima na ukuu, ‘amepewa’ ni Kiswahili cha kawaida kinachodumisha maana ya kutendewa.
- source_word: יְקָר
  choice: heshima
  rationale: Katika mazingira ya kifalme, neno hili humaanisha heshima anayoonyeshwa mtu, si thamani ya kitu.
- source_word: וּגְדוּלָּה
  choice: na ukuu
  rationale: ‘Ukuu’ hudumisha maana ya msingi ya hadhi au utukufu mkubwa wa hadharani, sambamba na ‘heshima,’ bila kuifanya kwa lazima iwe cheo au kupandishwa cheo.
- source_word: לְמָרְדֳּכַי
  choice: Mordekai amepewa
  rationale: Kiambishi לְ humtaja Mordekai kuwa mpokeaji; muundo huu ni wa kawaida katika Kiswahili.
- source_word: עַל זֶה
  choice: kwa ajili ya jambo hili
  rationale: Maneno haya yanarejelea tendo la Mordekai lililosomwa katika kumbukumbu na yanaonyesha sababu ya kumpa heshima.
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: Vijana wa mfalme
  rationale: Tafsiri hii inadumisha maana halisi ya נַעֲרֵי kama vijana, huku kishazi kinachofuata kikifafanua huduma yao ikulu.
- source_word: מְשָׁרְתָיו
  choice: waliomhudumia
  rationale: Kitenzi שרת hueleza huduma ya binafsi kwa mfalme; ‘waliomhudumia’ ni wazi na cha kawaida.
- source_word: לֹא נַעֲשָׂה עִמּוֹ דָּבָר
  choice: Hakuna lolote alilofanyiwa
  rationale: Muundo huu unadumisha ukanushi na kauli tendwa ya Kiebrania huku ukisikika kwa kawaida katika Kiswahili.
