  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ מִ֣י בֶ/חָצֵ֑ר וְ/הָמָ֣ן בָּ֗א לַ/חֲצַ֤ר בֵּית הַ/מֶּ֨לֶךְ֙ הַ/חִ֣יצוֹנָ֔ה לֵ/אמֹ֣ר לַ/מֶּ֔לֶךְ לִ/תְלוֹת֙ אֶֽת מָרְדֳּכַ֔י עַל הָ/עֵ֖ץ אֲשֶׁר הֵכִ֥ין לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/004.yaml
  text: And the king said[a], “Who is in the court?” Now Haman had come into the outer court of the king’s palace to speak to the king about hanging Mordecai on the gallows that he had prepared for him.
translation:
  language: sw
  text: Mfalme akauliza, “Ni nani aliye uani?” Wakati huo Hamani alikuwa ameingia katika ua wa nje wa jumba la mfalme ili kuzungumza na mfalme kuhusu kumtundika Mordekai kwenye mti[a] aliokuwa amemwandalia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania עֵץ lina maana halisi ya “mti” au “kitu cha mbao.” Hapa linamaanisha mti, nguzo, au kifaa cha mbao kilichoandaliwa kwa ajili ya kumwua Mordekai; namna yake kamili haijaelezwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶחָצֵר / לַחֲצַר
  choice: uani / katika ua
  rationale: חָצֵר ni ua uliozungushiwa, hapa ukiwa sehemu ya jumba la mfalme. Kiswahili hutumia ‘uani’ kwa swali la mahali na ‘katika ua’ katika kishazi kinachofuata.
- source_word: וְהָמָן בָּא
  choice: Wakati huo Hamani alikuwa ameingia
  rationale: Kishazi hiki kinatoa taarifa ya mazingira inayofafanua swali la mfalme. ‘Alikuwa ameingia’ huonyesha kwa Kiswahili cha kawaida kwamba kuingia kwake kulitangulia swali hilo, bila kulazimisha mfuatano mpya wa matukio.
- source_word: בֵּית הַמֶּלֶךְ
  choice: jumba la mfalme
  rationale: Ingawa maana ya moja kwa moja ni ‘nyumba ya mfalme,’ katika mazingira ya kifalme ‘jumba la mfalme’ ni tafsiri ya kawaida na iliyo wazi.
- source_word: הַחִיצוֹנָה
  choice: wa nje
  rationale: Kivumishi hiki kinautofautisha ua huo na ua wa ndani.
- source_word: לֵאמֹר לַמֶּלֶךְ
  choice: ili kuzungumza na mfalme
  rationale: Kauli hii inaonyesha kusudi la Hamani kuingia uani ili kupata nafasi ya kusema na mfalme; tafsiri hii ni ya asili na haiongezi yaliyomo katika ombi lake.
- source_word: לִתְלוֹת
  choice: kuhusu kumtundika
  rationale: Kitenzi תלה kinaweza kueleza kutundika au kuangika mtu kwenye kifaa cha kunyolea au cha kuua. ‘Kumtundika’ huhifadhi upana huo vizuri kuliko ‘kumnyonga,’ ambalo linaweza kudokeza kifo kwa kamba pekee.
- source_word: הָעֵץ
  choice: mti
  rationale: עֵץ humaanisha ‘mti’ au ‘kitu cha mbao.’ ‘Mti’ huhifadhi taswira na kutokuwa mahususi kwa neno la Kiebrania, huku tanbihi ikifafanua matumizi yake hapa.
- source_word: אֲשֶׁר הֵכִין לוֹ
  choice: aliokuwa amemwandalia
  rationale: Kiwakilishi cha Kiebrania kwa kawaida kinamrejelea Mordekai katika muktadha huu. Muundo huu unaonyesha kwamba Hamani alikuwa tayari ameandaa mti huo kwa ajili yake.
theological_decisions:
- issue: Namna halisi ya kuuawa inayodokezwa na תלה ... עַל הָעֵץ
  choice: kumtundika ... kwenye mti
  alternative: kumnyonga kwenye mti wa kunyongea / kumchoma juu ya nguzo
  rationale: Kiebrania hakibainishi hapa kwa uhakika kama tendo hilo lilikuwa kunyongwa kwa kamba, kuangikwa, au kuchomwa kwenye nguzo. Tafsiri iliyochaguliwa inalinda utata huo wa kihistoria na wa kileksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kawaida na hadhi inayofaa maandiko. ‘Ua,’ ‘jumba la mfalme,’ na ‘kumtundika’ ni maneno yanayoeleweka kwa wasomaji wa kawaida bila kuingiza maelezo yasiyokuwapo katika Kiebrania.
