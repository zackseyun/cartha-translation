base_translation:
  language: en
  yaml_path: translation/ot/esther/006/002.yaml
  text: And it was found written that Mordecai had reported concerning Bigthana and Teresh[a], two of the king’s eunuchs, among those who guarded the threshold[b], who had sought to lay a hand on King Ahasuerus.
translation:
  language: sw
  text: Ikakutwa imeandikwa kwamba Mordekai alikuwa ametoa taarifa kuhusu Bigtana na Tereshi[a], matowashi[b] wawili wa mfalme, waliokuwa miongoni mwa walinzi wa lango. Hao walikuwa wametaka kumshambulia Mfalme Ahasuero.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika mstari huu Kiebrania kina umbo la jina Bigtana; mahali pengine jina hilo linaonekana katika umbo Bigtan.
    reason: alternative_reading
  - marker: b
    text: Au “maofisa wawili wa ikulu ya mfalme”; neno la Kiebrania linaweza kumaanisha matowashi hasa au maofisa wa kifalme kwa maana pana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּצֵא כָתוּב
  choice: Ikakutwa imeandikwa
  rationale: Inahifadhi muundo wa kutendwa na wazo la jambo kugunduliwa katika kumbukumbu zilizoandikwa, huku ikisomeka kwa kawaida katika simulizi la Kiswahili.
- source_word: הִגִּיד
  choice: alikuwa ametoa taarifa
  rationale: Katika muktadha wa kumbukumbu rasmi za ikulu, usemi huu unaonyesha kuwa Mordekai alitoa habari kwa mamlaka, si kwamba alisema tu.
- source_word: עַל
  choice: kuhusu
  rationale: Kihusishi hiki hapa kinatambulisha jambo na watu waliohusu taarifa ya Mordekai; hakilazimishi maana ya moja kwa moja ya 'dhidi ya'.
- source_word: בִּגְתָנָא וָתֶרֶשׁ
  choice: Bigtana na Tereshi
  rationale: Majina yametoholewa kwa tahajia inayosomeka kwa Kiswahili, huku umbo la jina Bigtana katika mstari huu likihifadhiwa.
- source_word: שְׁנֵי סָרִיסֵי הַמֶּלֶךְ
  choice: matowashi wawili wa mfalme
  rationale: Maana mahsusi ya סָרִיס katika mazingira ya ikulu imepewa nafasi katika matini; maana pana ya maofisa wa ikulu imeonyeshwa katika tanbihi.
- source_word: מִשֹּׁמְרֵי הַסַּף
  choice: waliokuwa miongoni mwa walinzi wa lango
  rationale: Hii inaonyesha kwamba watu hao wawili walikuwa sehemu ya kundi la walinzi wa sehemu ya kuingilia, na 'lango' ni neno la kawaida na wazi zaidi kuliko tafsiri halisi ya kizingiti.
- source_word: בִּקְשׁוּ
  choice: walikuwa wametaka
  rationale: Inahifadhi maana ya kutaka au kusudia bila kudai kwamba shambulio lilitekelezwa.
- source_word: לִשְׁלֹחַ יָד
  choice: kumshambulia
  rationale: Nahau ya Kiebrania inaonyesha tendo la uhasama dhidi ya mfalme. 'Kumshambulia' ni Kiswahili cha kawaida kinachohifadhi uhasama bila kuamua kimyakimya kwamba walikusudia hasa kumuua.
- source_word: בַּמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Mfalme Ahasuero
  rationale: Jina la cheo na jina la mfalme yametolewa kwa mtindo wa kawaida wa majina ya kibiblia katika Kiswahili.
