base_translation:
  language: en
  yaml_path: translation/ot/esther/006/013.yaml
  text: Then Haman told Zeresh his wife and all his friends everything that had happened to him. Then his wise men and Zeresh his wife said to him[a], “If Mordecai, before whom you have begun to fall, is from the seed of the Jews, you will not prevail against him, for you will surely fall before him.”
translation:
  language: sw
  text: Ndipo Hamani akamsimulia Zereshi, mke wake, na rafiki zake wote kila jambo lililompata. Watu wake wenye hekima na Zereshi, mke wake, wakamwambia, “Ikiwa Mordekai, ambaye umeanza kuanguka mbele yake, anatokana na uzao wa Wayahudi[a], hutaweza kumshinda, kwa maana hakika utaanguka mbele yake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ni mwenye asili ya Kiyahudi.”
    reason: Njia mbadala ya kutafsiri usemi wa nasaba מִזֶּרַע הַיְּהוּדִים kwa Kiswahili laini zaidi.
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: akamsimulia
  rationale: Kitenzi ספר hapa kinaonyesha Hamani akieleza kwa mpangilio mambo yaliyompata; ‘akamsimulia’ ni Kiswahili cha kawaida na huhifadhi maana ya kusimulia yaliyotokea.
- source_word: אֹהֲבָיו
  choice: rafiki zake
  rationale: Ingawa neno hilo linaweza kumaanisha kihalisi ‘wampendao,’ katika muktadha huu linarejelea watu wa karibu au waandamani wa Hamani, hivyo ‘rafiki zake’ ni ya asili zaidi.
- source_word: כָּל אֲשֶׁר קָרָהוּ
  choice: kila jambo lililompata
  rationale: Muundo huu unamaanisha mambo yote yaliyomtokea Hamani; tafsiri hii ni ya kawaida na inaonyesha kuwa yalikuwa yametokea kabla ya simulizi lake.
- source_word: חֲכָמָיו
  choice: watu wake wenye hekima
  rationale: Huhifadhi maana ya msingi ya ‘watu wake wenye hekima’ bila kuamua kimya kimya kwamba walikuwa washauri rasmi.
- source_word: אִם מִזֶּרַע הַיְּהוּדִים
  choice: ikiwa ... anatokana na uzao wa Wayahudi
  rationale: ‘Uzao’ huhifadhi taswira ya זֶרַע huku ikieleza wazi nasaba; namna laini zaidi imewekwa katika tanbihi.
- source_word: הַחִלּוֹתָ לִנְפֹּל לְפָנָיו
  choice: ambaye umeanza kuanguka mbele yake
  rationale: Huhifadhi wazo la mwanzo wa anguko la Hamani na kurudia kwa ‘kuanguka mbele yake,’ ambako ni muhimu katika usemi huu.
- source_word: לֹא תוּכַל לוֹ
  choice: hutaweza kumshinda
  rationale: Muundo יכל + ל katika muktadha wa uhasama una maana ya kutoweza kumzidi au kumshinda mtu; chaguo hili ni la asili katika Kiswahili.
- source_word: נָפוֹל תִּפּוֹל
  choice: hakika utaanguka
  rationale: Kitenzi-jina kamili kinachofuatwa na kitenzi kilichotumika huongeza msisitizo wa uhakika; ‘hakika’ hubeba msisitizo huo.
- source_word: לְפָנָיו
  choice: mbele yake
  rationale: Huhifadhi marudio ya Kiebrania na wazo la kushindwa au kushushwa mbele ya Mordekai.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisimulizi ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Marudio ya ‘kuanguka mbele yake’ yamehifadhiwa kwa sababu yana nguvu ya balagha katika Kiebrania.
