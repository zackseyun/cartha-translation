  variant: Standard East African Swahili
source:
  edition: WLC
  text: יָבִ֨יאוּ֙ לְב֣וּשׁ מַלְכ֔וּת אֲשֶׁ֥ר לָֽבַשׁ בּ֖/וֹ הַ/מֶּ֑לֶךְ וְ/ס֗וּס אֲשֶׁ֨ר רָכַ֤ב עָלָי/ו֙ הַ/מֶּ֔לֶךְ וַ/אֲשֶׁ֥ר נִתַּ֛ן כֶּ֥תֶר מַלְכ֖וּת בְּ/רֹאשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/008.yaml
  text: Let them bring a royal robe that the king has worn[a], and a horse on which the king has ridden, and on whose head a royal crown has been placed.
translation:
  language: sw
  text: Walete vazi la kifalme ambalo mfalme amevaa, na farasi ambaye mfalme amempanda, na ambaye taji la kifalme limewekwa kichwani mwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “mwake” kwa kawaida zaidi linamrejelea farasi, ingawa baadhi ya wasomaji wamelielewa kuwa linamrejelea mfalme.
    reason: alternative_reading
lexical_decisions:
- source_word: יָבִיאוּ
  choice: Walete
  rationale: Hifili isiyotimilifu ya nafsi ya tatu wingi ina nguvu ya agizo au pendekezo katika usemi wa moja kwa moja; “Walete” ni ya kawaida na huhifadhi maana hiyo.
- source_word: לְבוּשׁ מַלְכוּת
  choice: vazi la kifalme
  rationale: Muundo huu unamaanisha vazi linalohusishwa na ufalme. “Vazi la kifalme” ni la asili, lenye heshima, na linafaa kwa vazi maalumu la kumtukuza mtu.
- source_word: אֲשֶׁר לָבַשׁ בּוֹ הַמֶּלֶךְ
  choice: ambalo mfalme amevaa
  rationale: Kishazi kinabainisha kuwa mfalme mwenyewe amelitumia vazi hilo; Kiswahili hakihitaji kuiga kihusishi cha Kiebrania “ndani yake.”
- source_word: וְסוּס
  choice: na farasi
  rationale: Nomino isiyo na kibainishi inaanzisha kitu cha pili kinachoombwa; “na farasi” ni tafsiri ya kawaida na sahihi.
- source_word: אֲשֶׁר רָכַב עָלָיו הַמֶּלֶךְ
  choice: ambaye mfalme amempanda
  rationale: Kishazi kinaonyesha kuwa huyo ni farasi ambaye mfalme mwenyewe amepanda. Kiambishi “-m-” kinawasilisha yambwa kwa njia ya kawaida katika Kiswahili.
- source_word: וַאֲשֶׁר נִתַּן כֶּתֶר מַלְכוּת בְּרֹאשׁוֹ
  choice: na ambaye taji la kifalme limewekwa kichwani mwake
  rationale: Muundo wa kutendwa umehifadhiwa, na kiwakilishi “mwake” kinaacha uwezekano wa kisarufi wa kumrejelea farasi au mfalme, ingawa farasi ndiye rejeleo la karibu na la kawaida zaidi.
- source_word: כֶּתֶר מַלְכוּת
  choice: taji la kifalme
  rationale: Kirai hiki kinataja taji linalohusiana na ufalme; “taji la kifalme” ni kifupi na cha kawaida.
theological_decisions:
- issue: Rejeleo la kiwakilishi katika בְּרֹאשׁוֹ
  choice: 'Kiwakilishi kimeachwa katika umbo lisilofunga kabisa maana: “kichwani mwake,” huku muundo ukimwelekeza msomaji kwa farasi.'
  alternative: Kukifanya kimrejelee mfalme waziwazi, kwa mfano “kichwani mwa mfalme.”
  rationale: Kisarufi, nomino ya karibu ni farasi, na hiyo ndiyo maana ya kawaida; hata hivyo, kiwakilishi cha Kiebrania kinaweza kueleweka vingine, kwa hiyo tafsiri haipaswi kufuta kabisa utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mtiririko wa orodha ya Kiebrania bila kuwa nzito kupita kiasi; “Walete” linafaa kwa pendekezo la Hamani katika usemi wa moja kwa moja.
