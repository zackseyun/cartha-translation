  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Muundo umewekwa wazi kwa wasomaji wa kawaida, huku taswira ya Kiebrania na utata wa נִדְחַף vikihifadhiwa.
