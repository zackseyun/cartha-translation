  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּ֥שָׁב מָרְדֳּכַ֖י אֶל שַׁ֣עַר הַ/מֶּ֑לֶךְ וְ/הָמָן֙ נִדְחַ֣ף אֶל בֵּית֔/וֹ אָבֵ֖ל וַ/חֲפ֥וּי רֹֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/012.yaml
  text: Then Mordecai returned to the king’s gate[a], but Haman hurried to his house[b], mourning and with his head covered.
translation:
  language: sw
  text: Kisha Mordekai akarudi kwenye lango la mfalme, lakini Hamani akaenda nyumbani kwake kwa haraka[a], akiwa katika maombolezo na kichwa chake kimefunikwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akasukumwa kwenda nyumbani kwake,” kwa kuhifadhi maana ya kutendwa iliyo katika kitenzi cha Kiebrania.
    reason: lexical_alternative
  - marker: b
    text: Kufunika kichwa kulikuwa ishara ya kitamaduni ya huzuni, fedheha, au maombolezo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: akarudi
  rationale: Kitenzi שׁוּב katika mfululizo wa kisimulizi kinaonyesha kurudi mahali au kwenye wajibu wa awali; “akarudi” ni Kiswahili cha kawaida na sahihi.
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: lango la mfalme
  rationale: Muundo huu wa nomino una maana ya lango linalohusishwa na mfalme au jumba lake; tafsiri ya moja kwa moja inadumisha picha ya Kiebrania.
- source_word: נִדְחַף
  choice: akaenda ... kwa haraka
  rationale: Nifali ya דחף inaweza kuonyesha kusukumwa au kuendeshwa kwa nguvu. Katika muktadha inaonyesha kuondoka kwa haraka baada ya kudhalilishwa, huku uwezekano wa maana ya kutendwa ukihifadhiwa katika tanbihi.
- source_word: בֵּיתוֹ
  choice: nyumbani kwake
  rationale: Ingawa neno halisi ni “nyumba yake,” katika Kiswahili “nyumbani kwake” ni usemi wa asili zaidi baada ya kitenzi cha kwenda.
- source_word: אָבֵל
  choice: akiwa katika maombolezo
  rationale: Kivumishi hiki kinaeleza hali ya kuomboleza au kuhuzunika; usemi huu ni wa heshima na unaendana na mtindo wa simulizi.
- source_word: חֲפוּי רֹאשׁ
  choice: kichwa chake kimefunikwa
  rationale: Tafsiri inadumisha ishara halisi ya kufunika kichwa badala ya kuibadili kuwa ufafanuzi kama “akiwa amefedheheka.”
theological_decisions: []
