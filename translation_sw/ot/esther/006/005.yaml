base_translation:
  language: en
  yaml_path: translation/ot/esther/006/005.yaml
  text: The king’s attendants said to him[a], “Look, Haman is standing in the court.” And the king said, “Let him come in.”
translation:
  language: sw
  text: Wahudumu wa mfalme wakamwambia, “Tazama, Hamani amesimama katika ua[a].” Mfalme akasema, “Aingie.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika uwanja wa ikulu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: wahudumu wa mfalme
  rationale: Katika mazingira ya kifalme, נַעַר inaweza kumaanisha vijana, watumishi, au wahudumu. “Wahudumu” inaonyesha kazi yao katika jumba la mfalme bila kudokeza lazima umri wao.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira kwa jambo lililo mbele yao. “Tazama” linahifadhi msisitizo huo kwa Kiswahili cha heshima na kinachoeleweka.
- source_word: עֹמֵד
  choice: amesimama
  rationale: Kauli ya kushiriki inaonyesha hali inayoendelea wakati huo; “amesimama” ni ya moja kwa moja kuliko tafsiri ya kimuktadha kama “anangoja.”
- source_word: בֶּחָצֵר
  choice: katika ua
  rationale: חָצֵר humaanisha ua au uwanja uliozungukwa. “Katika ua” ni usemi wa kawaida wa Kiswahili, huku mbadala unaoeleza mazingira ya ikulu ukihifadhiwa katika tanbihi.
- source_word: יָבֹא
  choice: Aingie
  rationale: Umbo hili lina nguvu ya amri au ruhusa. “Aingie” ni agizo fupi na la kawaida linaloonyesha kuingia kwake mbele ya mfalme.
- source_word: הָמָן
  choice: Hamani
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili.
