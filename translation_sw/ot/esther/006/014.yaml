translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. Viunganishi vya ‘waka-’ vinadumisha mfuatano wa haraka wa matukio. Alama zote za tanbihi zimewekwa katika matini kuu karibu na maneno yanayohusika.
