  yaml_path: translation/ot/esther/006/014.yaml
  text: While they were still speaking with him[b][a], the king’s eunuchs arrived and hurried to bring Haman to the banquet that Esther had prepared.
translation:
  language: sw
  text: Walipokuwa bado wakizungumza naye, matowashi wa mfalme[a] wakafika, wakaharakisha[b] kumpeleka Hamani kwenye karamu ambayo Esta alikuwa ameiandaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maofisa wa mfalme,” kwa kuwa neno la Kiebrania linaweza kumaanisha watumishi wa ikulu na pia matowashi.
    reason: lexical_alternative
  - marker: b
    text: Au, “walimchukua Hamani kwa haraka”; kitenzi cha Kiebrania hapa husisitiza haraka ya dharura.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדָם מְדַבְּרִים עִמּוֹ
  choice: Walipokuwa bado wakizungumza naye
  rationale: Muundo huu unaonyesha kwamba mazungumzo yalikuwa yakiendelea wakati tukio jingine lilipotokea. ‘Naye’ huhifadhi maana ya עִמּוֹ, ‘pamoja naye/na yeye,’ kwa Kiswahili cha kawaida.
- source_word: סָרִיסֵי הַמֶּלֶךְ
  choice: matowashi wa mfalme
  rationale: סָרִיס inaweza kumaanisha towashi au mtumishi wa ikulu. ‘Matowashi’ huhifadhi maana ya msingi na inafaa katika mazingira ya ikulu ya Uajemi; maana pana zaidi imeonyeshwa katika tanbihi.
- source_word: הִגִּיעוּ
  choice: wakafika
  rationale: Kitenzi kinaonyesha kuwasili kwao mahali alipokuwa Hamani; ‘wakafika’ ni cha kawaida na wazi katika simulizi.
- source_word: וַיַּבְהִלוּ לְהָבִיא
  choice: wakaharakisha kumpeleka
  rationale: Hiphili ya בהל hapa inaonyesha hatua ya haraka yenye kusudi la kumfikisha Hamani karamuni. ‘Wakaharakisha’ huhifadhi dharura bila kulazimisha wazo la hofu, na ‘kumpeleka’ ni ya asili kwa mtazamo wa kumtoa alipokuwa hadi karamuni.
- source_word: הַמִּשְׁתֶּה
  choice: karamu
  rationale: מִשְׁתֶּה ni karamu au sherehe ya chakula na vinywaji; ‘karamu’ ni neno la kawaida, lenye heshima, na linalofaa mazingira ya kifalme.
- source_word: אֲשֶׁר עָשְׂתָה אֶסְתֵּר
  choice: ambayo Esta alikuwa ameiandaa
  rationale: Ingawa עשה kimsingi ni ‘kufanya,’ kwa karamu Kiswahili cha asili hutumia ‘kuandaa.’ ‘Alikuwa ameiandaa’ huonyesha kwamba maandalizi yalitangulia kuwasili kwa wajumbe.
