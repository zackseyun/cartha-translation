  text: בַּ/לַּ֣יְלָה הַ/ה֔וּא נָדְדָ֖ה שְׁנַ֣ת הַ/מֶּ֑לֶךְ וַ/יֹּ֗אמֶר לְ/הָבִ֞יא אֶת סֵ֤פֶר הַ/זִּכְרֹנוֹת֙ דִּבְרֵ֣י הַ/יָּמִ֔ים וַ/יִּהְי֥וּ נִקְרָאִ֖ים לִ/פְנֵ֥י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/001.yaml
  text: On that night the king could not sleep[a], so he ordered the book of records, the chronicles, to be brought[b], and they were read before the king.
translation:
  language: sw
  text: Usiku huo mfalme hakuweza kulala[a], kwa hiyo akaamuru kitabu cha kumbukumbu, yaani, maandishi ya matukio ya nyakati, kiletwe[b], nayo yakasomwa mbele ya mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri halisi, “usingizi wa mfalme ukamtoroka.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kitabu cha ukumbusho, yaani, kumbukumbu za matukio.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  choice: Usiku huo
  rationale: Kirai hiki hutaja usiku maalumu katika simulizi. Kiswahili cha kawaida husema kwa ufupi na kwa ufasaha, “Usiku huo.”
- source_word: נָדְדָה שְׁנַת הַמֶּלֶךְ
  choice: mfalme hakuweza kulala
  rationale: Maana halisi ina taswira ya usingizi wa mfalme kutoweka au kutangatanga. “Hakuweza kulala” ni Kiswahili cha asili kinachowasilisha maana katika muktadha, huku tanbihi ikihifadhi taswira ya Kiebrania.
- source_word: וַיֹּאמֶר
  choice: akaamuru
  rationale: Ingawa kimsingi ni “akasema,” hapa kitenzi kinaanzisha agizo la kifalme; “akaamuru” huwasilisha tendo hilo la usemi kwa usahihi.
- source_word: לְהָבִיא
  choice: walete
  rationale: Infinitivu inaeleza yaliyomo katika agizo. Kiswahili hutumia kwa kawaida kiima kisichotajwa cha wingi kwa watumishi walioagizwa kuleta kitabu.
- source_word: סֵפֶר הַזִּכְרֹנוֹת
  choice: kitabu cha kumbukumbu
  rationale: Kirai hiki kinamaanisha kitabu cha mambo yaliyowekwa katika maandishi ili yakumbukwe; tafsiri hii ni wazi na inafaa mazingira ya nyaraka za kifalme.
- source_word: דִּבְרֵי הַיָּמִים
  choice: kumbukumbu za matukio ya kila siku
  rationale: Kirai hiki hurejelea kumbukumbu rasmi za matukio kwa mpangilio wa siku. Kimewekwa kama ufafanuzi wa “kitabu cha kumbukumbu,” kulingana na uhusiano wa viambajengo katika Kiebrania.
- source_word: וַיִּהְיוּ נִקְרָאִים
  choice: nazo zikasomwa
  rationale: Muundo wa wingi na wa kutendwa unaonyesha kuwa kumbukumbu au nyaraka hizo zilisomwa; “nazo zikasomwa” huhifadhi umbo hilo kwa Kiswahili fasaha.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: mbele ya mfalme
  rationale: Huhifadhi maana ya moja kwa moja ya “mbele ya/katika uwepo wa mfalme,” ikidokeza kwamba zilisomwa akiwa anasikiliza.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Muundo wa mfululizo wa vitenzi “akaamuru … zikasomwa” unafuata mwendo wa simulizi la Kiebrania bila kuwa mzito. Alama zote za tanbihi zimewekwa katika matini kuu.
