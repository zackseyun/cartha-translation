base_translation:
  language: en
  yaml_path: translation/ot/esther/006/009.yaml
  text: And let the robe and the horse be entrusted to the hand of one of the king’s noble officials, and let them clothe the man whom the king delights to honor, and let them mount him on the horse through the open square of the city, and proclaim before him, ‘Thus shall it be done for the man whom the king delights to honor.’
translation:
  language: sw
  text: Na vazi hilo na farasi huyo wakabidhiwe kwa mmojawapo wa maafisa mashuhuri wa mfalme. Wamvishe mtu ambaye mfalme anapenda kumheshimu, wampandishe farasi huyo katika uwanja wa mji, na watangaze mbele yake, ‘Hivi ndivyo atakavyotendewa mtu ambaye mfalme anapenda kumheshimu.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתוֹן ... עַל־יַד
  choice: wakabidhiwe kwa
  rationale: Muundo huu una maana ya kuweka vazi na farasi chini ya mamlaka au uangalizi wa afisa; ‘wakabidhiwe kwa’ ni Kiswahili cha kawaida kinachohifadhi wazo hilo.
- source_word: מִשָּׂרֵי הַמֶּלֶךְ הַפַּרְתְּמִים
  choice: mmoja wa wakuu wa heshima wa mfalme
  rationale: שָׂרֵי ni wakuu/maafisa, na הַפַּרְתְּמִים huonyesha hadhi ya juu ya kifalme. Tafsiri hii ni ya heshima bila kudai cheo mahususi kisichobainishwa na maandishi.
- source_word: חָפֵץ בִּיקָרוֹ
  choice: anapenda kumheshimu
  rationale: Kirai hiki huonyesha furaha au mapenzi ya mfalme katika kumpa mtu heshima; muundo huu ni wa asili katika Kiswahili na unarudiwa sawasawa mara zote mbili.
- source_word: וְהִרְכִּיבֻהוּ עַל־הַסּוּס
  choice: wampandishe juu ya farasi huyo
  rationale: 'Kitenzi cha Kiebrania ni cha kisababishi: wamfanye apande au wampandishe, si kumwongoza tu akiwa juu ya farasi.'
- source_word: בִּרְחוֹב הָעִיר
  choice: katika uwanja wa mji
  rationale: רְחוֹב katika muktadha wa mji wa kale ni eneo pana la wazi la umma, si lazima barabara ya kisasa.
- source_word: וְקָרְאוּ לְפָנָיו
  choice: na kutangaza mbele yake
  rationale: Inahifadhi tendo la kutangaza kwa sauti mbele ya mtu wakati wa maandamano.
