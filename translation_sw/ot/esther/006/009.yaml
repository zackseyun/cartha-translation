translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kifalme lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya ‘mtu ambaye mfalme anapenda kumheshimu’ yamehifadhiwa kwa sababu ni ya kimakusudi katika chanzo.
