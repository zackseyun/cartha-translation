base_translation:
  language: en
  yaml_path: translation/ot/esther/006/006.yaml
  text: So Haman came in[a], and the king said to him, “What should be done for the man whom the king delights to honor?” And Haman said in his heart, “Whom would the king delight to honor more than me?”
translation:
  language: sw
  text: Basi Hamani akaingia, naye mfalme akamwambia, “Mtu ambaye mfalme anataka kumtunuku heshima afanyiwe nini?” Hamani akasema moyoni mwake[a], “Ni nani ambaye mfalme angependa kumtunuku heshima zaidi kuliko mimi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “akajiambia.” Kihalisi, Kiebrania: “akasema moyoni mwake.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבוֹא הָמָן
  choice: Basi Hamani akaingia
  rationale: Kitenzi cha masimulizi kinaendeleza tukio. “Basi” na “akaingia” ni Kiswahili cha kawaida kinachoonyesha mwendelezo na kuingia kwake mbele ya mfalme.
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  choice: naye mfalme akamwambia
  rationale: אָמַר kimsingi ni “sema”; kwa kuwa maneno yanamwelekea Hamani, “akamwambia” ni ya asili na sahihi katika Kiswahili.
- source_word: מַה לַעֲשׂוֹת בָּאִישׁ
  choice: Afanyiwe nini mtu
  rationale: Muundo huu wa Kiswahili unahifadhi wazo la kitendo kufanyiwa mtu na unaeleza kwa kawaida kile kinachopaswa kufanywa kwa ajili yake.
- source_word: אֲשֶׁר הַמֶּלֶךְ חָפֵץ בִּיקָרוֹ
  choice: ambaye mfalme anapendezwa kumpa heshima
  rationale: חָפֵץ huonyesha kupendezwa au kufurahia, na יְקָר hapa ni heshima inayotolewa na mfalme. “Kumpa heshima” ni wazi zaidi kuliko tafsiri yenye uwezekano wa kumaanisha tu kumheshimu moyoni.
- source_word: וַיֹּאמֶר הָמָן בְּלִבּוֹ
  choice: Hamani akasema moyoni mwake
  rationale: Tafsiri hii inadumisha taswira halisi ya Kiebrania ya maneno ya ndani, huku ikiwa bado inaeleweka kwa wasomaji wa Kiswahili.
- source_word: לְמִי יַחְפֹּץ הַמֶּלֶךְ לַעֲשׂוֹת יְקָר
  choice: Mfalme angependa kumpa heshima nani
  rationale: “Angependa” linafaa kwa hitimisho la Hamani la kujiona kuwa ndiye anayelengwa, na “kumpa heshima” linaonyesha kitendo cha kumtunuku mtu heshima.
- source_word: יוֹתֵר מִמֶּנִּי
  choice: zaidi yangu
  rationale: Huu ni usemi wa kawaida wa kulinganisha katika Kiswahili na unaonyesha wazi majivuno ya Hamani bila kuongeza ufafanuzi.
