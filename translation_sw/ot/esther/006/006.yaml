translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Mtindo wa masimulizi umetumia mfuatano wa vitenzi vya -ka-; lugha ya ikulu imebaki wazi bila kuwa nzito. Alama ya tanbihi imewekwa kwenye usemi unaohusika moja kwa moja.
