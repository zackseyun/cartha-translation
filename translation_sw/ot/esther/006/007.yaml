  text: And Haman said to the king[a], “For the man whom the king delights to honor—”
translation:
  language: sw
  text: Hamani akamwambia mfalme, “Kwa habari ya mtu ambaye mfalme anafurahia kumheshimu—”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Umbo la simulizi lenye waw-consecutive linaendeleza tukio; “akamwambia” ni la kawaida na lenye hadhi katika masimulizi ya Kiswahili.
- source_word: הָמָן
  choice: Hamani
  rationale: Jina la mtu limetoholewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: אֶל הַמֶּלֶךְ
  choice: mfalme
  rationale: Kitenzi “kumwambia” tayari huonyesha anayeelekezewa maneno, hivyo kiambishi -mw- na nomino “mfalme” vinawasilisha maana ya “kwa mfalme” kwa Kiswahili asilia.
- source_word: אִישׁ
  choice: mtu
  rationale: Hapa nomino ya Kiebrania inamtaja mtu mmoja bila kumtaja jina. “Mtu” ni ya kawaida katika Kiswahili na haihitaji utofautishaji wa makala dhahiri au isiyo dhahiri, ambao Kiswahili halina.
- source_word: אֲשֶׁר
  choice: ambaye
  rationale: Kiwakilishi rejeshi cha ngeli ya mtu kinaonyesha kwa usahihi kuwa kishazi kinamfafanua huyo mtu.
- source_word: חָפֵץ
  choice: anapendezwa
  rationale: Huhifadhi wazo la furaha au kupendezwa, si nia au kutaka tu.
- source_word: בִּיקָרוֹ
  choice: kumpa heshima
  rationale: Nomino יְקָר ina maana ya heshima au hadhi. Usemi wa Kiswahili “kumpa heshima” unawasilisha kwa kawaida tendo la kumtukuza mtu katika mazingira ya kifalme bila kutumia neno lenye uzito kupita kiasi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kawaida na hadhi. Mstari umeachwa ukiwa haujakamilika kwa alama ya em dash kwa sababu kauli ya Hamani inaendelea katika mstari unaofuata. Usemi “Kwa habari ya” unaanzisha pendekezo lake kwa mfalme kwa njia ya asili.
