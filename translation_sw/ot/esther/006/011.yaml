base_translation:
  language: en
  yaml_path: translation/ot/esther/006/011.yaml
  text: So Haman took the robe and the horse[a], clothed Mordecai, led him on horseback through the city square, and proclaimed before him, “Thus shall it be done for the man whom the king delights to honor.”
translation:
  language: sw
  text: Basi Hamani akachukua vazi na farasi, akamvika Mordekai, akampandisha juu ya farasi[a] na kumpitisha katika uwanja wa mji, akatangaza mbele yake, “Ndivyo anavyofanyiwa mtu ambaye mfalme hupenda kumheshimu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “akamfanya Mordekai apande farasi katika uwanja wa mji.” Kitenzi cha Kiebrania ni cha kisababishi: Hamani alisababisha Mordekai apande farasi katika msafara huo wa hadhara.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְּבוּשׁ
  choice: vazi
  rationale: Nomino hii ya umoja yenye uainishaji inarejelea vazi maalumu lililotajwa katika muktadha uliotangulia; “vazi” ni ya kawaida, yenye hadhi, na haiongezi aina isiyotajwa.
- source_word: הַסּוּס
  choice: farasi
  rationale: Kiebrania kinasema tu “farasi” kwa uainishaji; uhusiano wake na mfalme umewekwa wazi katika muktadha, hivyo neno “wa kifalme” halijaongezwa hapa.
- source_word: וַיַּלְבֵּשׁ אֶת מָרְדֳּכָי
  choice: akamvika Mordekai
  rationale: Hiphil ya לבש humaanisha kumvika mtu; “akamvika” ni tafsiri ya moja kwa moja na ya asili katika Kiswahili.
- source_word: וַיַּרְכִּיבֵהוּ
  choice: akampandisha farasi na kumpitisha
  rationale: Kitenzi cha kisababishi kutoka רכב kinaonyesha kwamba Hamani alimsababisha Mordekai apande. Kauli hii inaonyesha wazi safari ya hadhara bila kudai kwamba Hamani mwenyewe alikuwa amempanda farasi.
- source_word: בִּרְחוֹב הָעִיר
  choice: katika uwanja wa mji
  rationale: רְחוֹב hapa ni eneo pana la umma, yaani uwanja wa mjini, wala si lazima barabara ya kawaida.
- source_word: וַיִּקְרָא לְפָנָיו
  choice: huku akitangaza mbele yake
  rationale: קרא katika muktadha huu ni kutangaza kwa sauti hadharani; “mbele yake” huhifadhi maelezo ya mahali bila kuamua kupita kiasi namna halisi ya msafara.
- source_word: כָּכָה יֵעָשֶׂה
  choice: Hivi ndivyo anavyofanyiwa
  rationale: Kauli hii huhifadhi nguvu ya kuonyesha namna na hali ya kutendwa ya Kiebrania, kwa Kiswahili cha sasa na cha kawaida.
- source_word: לָאִישׁ
  choice: mtu
  rationale: Nomino ya Kiebrania ni umoja wa kiume, lakini katika fomula hii ya jumla “mtu” ni ya asili katika Kiswahili na haibadili rejeleo la Mordekai.
- source_word: חָפֵץ בִּיקָרוֹ
  choice: ambaye mfalme anapendezwa kumheshimu
  rationale: חפץ huonyesha kupendezwa au kufurahia, na יקר hapa ni heshima anayopewa mtu; tafsiri hii huhifadhi vipengele vyote viwili.
