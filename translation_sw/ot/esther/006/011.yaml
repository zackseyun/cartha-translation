  to: Basi Hamani akachukua vazi na farasi, akamvika Mordekai, akampandisha juu ya farasi[a] na kumpitisha katika uwanja wa mji, akatangaza mbele yake, “Ndivyo anavyofanyiwa mtu ambaye mfalme hupenda kumheshimu.”
