base_translation:
  language: en
  yaml_path: translation/ot/esther/006/010.yaml
  text: Then the king said to Haman[a], “Hurry, take the robe and the horse, just as you have said, and do so for Mordecai the Jew, who sits at the king’s gate[b]. Leave out nothing from all that you have said.”
translation:
  language: sw
  text: Ndipo mfalme akamwambia Hamani, “Fanya haraka! Chukua vazi na farasi kama ulivyosema, ukamtendee hivyo Mordekai, yule Myahudi[a], anayeketi kwenye lango la mfalme. Usiache lolote katika yote uliyosema[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno hili linaweza pia kutafsiriwa “mtu wa Yudea,” lakini hapa linaelekea kutaja utambulisho wa Mordekai wa kikabila na kidini.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya karibu zaidi na maneno yenyewe, “Usiache jambo lolote lianguke kutoka katika yote uliyosema”; hii ni nahau inayomaanisha kutoacha jambo lolote.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  choice: Fanya haraka
  rationale: Ni amri ya kutenda mara moja; usemi huu ni wa kawaida katika Kiswahili cha sasa na unadumisha uzito wa agizo.
- source_word: קַח
  choice: Chukua
  rationale: Hii ndiyo maana ya moja kwa moja ya kitenzi katika mfululizo huu wa maagizo.
- source_word: הַלְּבוּשׁ
  choice: vazi
  rationale: Katika muktadha huu ni vazi la kifalme lililotajwa katika aya iliyotangulia; ‘vazi’ ni neno la asili na lenye hadhi bila kuongeza kivumishi kisichokuwapo hapa.
- source_word: הַסּוּס
  choice: farasi
  rationale: Chanzo kinasema tu ‘farasi’; sifa ya kifalme inaeleweka kutokana na muktadha lakini haijaongezwa katika aya hii.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: kama ulivyosema
  rationale: Inahusianisha agizo la mfalme moja kwa moja na pendekezo la Hamani kwa Kiswahili cha kawaida.
- source_word: וַעֲשֵׂה כֵן לְמָרְדֳּכַי
  choice: ukamfanyie hivyo Mordekai
  rationale: Muundo huu unatoa kwa kawaida maana ya kutekeleza jambo hilo kwa faida ya Mordekai.
- source_word: הַיְּהוּדִי
  choice: Myahudi
  rationale: Katika simulizi la Esta neno hili kwa kawaida hutambulisha asili na utambulisho wa Kiyahudi wa Mordekai, si mahali anakoishi tu.
- source_word: הַיּוֹשֵׁב בְּשַׁעַר הַמֶּלֶךְ
  choice: anayeketi kwenye lango la mfalme
  rationale: Kirai cha wakati unaoendelea kinamtambulisha Mordekai kwa nafasi yake inayojulikana katika lango la mfalme.
- source_word: אַל תַּפֵּל דָּבָר מִכֹּל אֲשֶׁר דִּבַּרְתָּ
  choice: Usiache lolote katika yote uliyosema
  rationale: 'Hutoa maana ya nahau ya Kiebrania kwa uwazi: Hamani hapaswi kuacha sehemu yoyote ya pendekezo lake.'
