  text: Siku hiyo, hesabu ya watu waliouawa katika ngome ya Susa ilifika mbele ya mfalme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Siku hiyo
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kishazi cha wakati.
- source_word: מִסְפַּר הַהֲרוּגִים
  choice: hesabu ya watu waliouawa
  rationale: ‘Hesabu’ huhifadhi wazo la idadi iliyohesabiwa, na ‘watu waliouawa’ huonyesha wazi maana ya nomino tendwa.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: ngome ya Susa
  rationale: הַבִּירָה hapa hueleweka kuwa eneo la ngome au mji wa kifalme; ‘ngome ya Susa’ ni fupi, ya asili, na inaitofautisha na eneo pana la Susa.
- source_word: בָּא ... לִפְנֵי הַמֶּלֶךְ
  choice: ilifika mbele ya mfalme
  rationale: Huhifadhi kitenzi cha Kiebrania ‘ilikuja/ilifika’ bila kukibadili kuwa kauli tendwa ‘ililetwa,’ huku Kiswahili ‘ilifika mbele ya’ kikieleweka kwa taarifa iliyomfikia mfalme.
