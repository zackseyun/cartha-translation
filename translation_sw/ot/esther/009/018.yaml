base_translation:
  language: en
  yaml_path: translation/ot/esther/009/018.yaml
  text: But the Jews who were in Susa assembled on the thirteenth day of it and on the fourteenth day of it[a], and rested on the fifteenth day of it[b], and made it a day of feasting and gladness.
translation:
  language: sw
  text: Lakini Wayahudi waliokuwa Shushani walikusanyika siku ya kumi na tatu ya mwezi huo na siku ya kumi na nne ya mwezi huo. Wakapumzika siku ya kumi na tano ya mwezi huo[a], wakaifanya kuwa siku ya karamu na furaha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “siku ya kumi na tatu yake ... siku ya kumi na nne yake ... siku ya kumi na tano yake”; neno “yake” linarejelea mwezi unaoeleweka kutokana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au, “siku ya karamu na shangwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיְּהוּדִים אֲשֶׁר בְּשׁוּשָׁן
  choice: Lakini Wayahudi waliokuwa Shushani
  rationale: Waw inaonyesha utofautishaji na Wayahudi wa majimbo katika mstari uliotangulia; “Lakini” huleta tofauti hiyo kwa Kiswahili cha kawaida. “Shushani” huhifadhi umbo la jina la Kiebrania linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: נִקְהֲלוּ
  choice: walikusanyika
  rationale: Nifali ya קהל ina maana ya kukusanyika; tafsiri hii haiongezi kusudi ambalo halijasemwa wazi hapa.
- source_word: בִּשְׁלֹשָׁה עָשָׂר בּוֹ וּבְאַרְבָּעָה עָשָׂר בּוֹ
  choice: siku ya kumi na tatu na siku ya kumi na nne ya mwezi huo
  rationale: Kiambishi cha בּוֹ kinarejelea mwezi unaoeleweka kutokana na muktadha. Kiswahili kinahitaji kurejelea huko kuwe wazi; “ya mwezi huo” mwishoni inahusu tarehe zote mbili bila urudiaji mzito.
- source_word: וְנוֹחַ
  choice: Wakapumzika
  rationale: Kitenzi נוח kinaonyesha kuacha mapigano na kupata pumziko; “wakapumzika” ni cha asili katika mfuatano huu.
- source_word: בַּחֲמִשָּׁה עָשָׂר בּוֹ
  choice: siku ya kumi na tano
  rationale: Mwezi uleule umewekwa wazi katika sentensi iliyotangulia, hivyo si lazima kuurudia, ingawa dokezo linaonyesha muundo halisi wa Kiebrania.
- source_word: וְעָשֹׂה אֹתוֹ
  choice: wakaifanya kuwa
  rationale: Kirai hiki kinaonyesha kwamba waliitumia au kuiadhimisha siku hiyo kwa namna iliyotajwa; tafsiri hii huhifadhi muundo wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: יוֹם מִשְׁתֶּה וְשִׂמְחָה
  choice: siku ya karamu na furaha
  rationale: מִשְׁתֶּה ni karamu yenye kula na kunywa, na שִׂמְחָה ni furaha; maneno haya ni ya kawaida, yenye heshima, na yanafaa kwa sherehe.
