  source_fidelity: 'Maana kuu imetafsiriwa kwa uaminifu: utofautishaji na mstari uliotangulia, kukusanyika kwa Wayahudi wa Shushani, pumziko la siku ya kumi na tano, na sherehe vinaonekana. Hata hivyo, Kiebrania hurudia rejeleo la mwezi kwa tarehe zote tatu; ni salama kulihifadhi wazi katika Kiswahili.'
  naturalness: Kiswahili cha rasimu ni cha kawaida na chenye hadhi. Marekebisho yanadumisha mtiririko wa asili huku yakifanya mpangilio wa tarehe na rejeleo la mwezi uwe wazi zaidi.
  terminology: “Wayahudi,” “Shushani,” “karamu,” na “furaha” zinafaa katika Kiswahili Sanifu cha Afrika Mashariki na katika rejista ya kifasihi ya Biblia. “Shangwe” katika tanbihi ni mbadala wa asili wa “furaha.”
  issues:
