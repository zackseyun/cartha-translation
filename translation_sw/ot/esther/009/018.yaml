  - severity: low
    issue: Matini ya tanbihi [a] hutumia “tarehe,” ilhali matini kuu na Kiebrania hueleweka vizuri zaidi kwa “siku.”
    rationale: “Siku ya kumi na tatu” hufuata usemi wa aya na huepuka kubadilisha kiwango cha usemi bila sababu.
