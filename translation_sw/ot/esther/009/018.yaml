  to: Lakini Wayahudi waliokuwa Shushani walikusanyika siku ya kumi na tatu ya mwezi huo na siku ya kumi na nne ya mwezi huo. Wakapumzika siku ya kumi na tano ya mwezi huo[a], wakaifanya kuwa siku ya karamu na furaha[b].
  rationale: Marekebisho yanahifadhi urudiaji wa rejeleo la mwezi katika tarehe zote tatu kama ulivyo katika Kiebrania, na yanaweka alama ya tanbihi [a] mahali panapofunika mifano yote inayofafanuliwa. Maana, rejista, na jina la mahali vimehifadhiwa.
