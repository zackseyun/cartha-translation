    issue: Rejeleo la “mwezi huo” limetajwa wazi kwa tarehe ya kumi na nne pekee katika matini kuu.
    rationale: Ingawa linaweza kueleweka kuwa linahusu tarehe zote mbili, Kiebrania hurudia kiambishi kinachorejelea mwezi katika tarehe ya kumi na tatu, ya kumi na nne, na ya kumi na tano. Kulirudia huongeza uwazi na huakisi muundo wa chanzo bila kufanya Kiswahili kuwa kigumu.
