translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa baada ya tarehe ili isomeke kwa urahisi bila kupoteza mwendelezo wa simulizi. Kiambishi cha mfululizo “waka-” kimetumika kuonyesha matukio yanayofuatana.
