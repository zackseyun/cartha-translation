base_translation:
  language: en
  yaml_path: translation/ot/esther/009/015.yaml
  text: The Jews who were in Susa also assembled on the fourteenth day of the month of Adar[a], and they killed three hundred men in Susa; but they did not lay a hand on the plunder.
translation:
  language: sw
  text: Wayahudi waliokuwa Susa wakakusanyika pia siku ya kumi na nne ya mwezi wa Adari. Wakawaua wanaume mia tatu huko Susa, lakini hawakujitwalia nyara[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi na muundo wa Kiebrania: “hawakupeleka mikono yao kuchukua nyara.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: wakakusanyika
  rationale: Kitenzi hiki kinaonyesha kuja pamoja kama kundi kwa kusudi fulani; “wakakusanyika” ni Kiswahili cha kawaida na sahihi.
- source_word: הַיְּהוּדִים
  choice: Wayahudi
  rationale: Katika Esta neno hili linataja watu wa Kiyahudi waliokuwa katika uhamisho wa Uajemi, si wakazi wa eneo la Yuda pekee.
- source_word: אֲשֶׁר בְּשׁוּשָׁן
  choice: waliokuwa Susa
  rationale: Kirai hiki kinabainisha Wayahudi waliokuwa katika mji wa Susa; “Susa” ni umbo la kisasa na linalotambulika la jina la mahali.
- source_word: גַּם
  choice: pia
  rationale: Neno hili linaunganisha tukio hili na matukio ya siku iliyotangulia kwa maana ya nyongeza.
- source_word: בְּיוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: siku ya kumi na nne ya mwezi wa Adari
  rationale: Tafsiri hii inadumisha muundo kamili wa tarehe katika Kiebrania huku ikitumia Kiswahili cha kawaida.
- source_word: וַיַּהַרְגוּ
  choice: wakawaua
  rationale: הרג ni kitenzi cha moja kwa moja cha kuua; “wakawaua” hakipunguzi wala kuzidisha nguvu ya kauli.
- source_word: שְׁלֹשׁ מֵאוֹת אִישׁ
  choice: wanaume mia tatu
  rationale: אִישׁ hapa ni nomino ya kiume inayofuata idadi; “wanaume” inadumisha taarifa hiyo ya kijinsia badala ya kuitia katika neno la jumla.
- source_word: וּבַבִּזָּה
  choice: lakini ... nyara
  rationale: בִּזָּה ni mali inayochukuliwa baada ya mapigano. Kiunganishi kimetafsiriwa kwa maana ya upinzani kwa sababu kauli hii inalinganisha kuua na kutokuchukua mali.
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: hawakujitwalia
  rationale: Kirai cha Kiebrania kwa herufi ni kutokunyoosha mkono; katika muktadha huu maana yake ni kutokuchukua nyara. “Hawakujitwalia” ni ya asili na inaonyesha wazi kutokujipatia mali hiyo.
