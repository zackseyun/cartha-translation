base_translation:
  language: en
  yaml_path: translation/ot/esther/009/002.yaml
  text: The Jews assembled in their cities throughout all the provinces of King Ahasuerus to lay hands on those seeking their harm[a], and no one could stand before them[c][b], because the fear of them had fallen on all the peoples.
translation:
  language: sw
  text: Wayahudi wakakusanyika katika miji yao katika majimbo yote ya Mfalme Ahasuero ili kuwashambulia wale waliotaka kuwadhuru[a]. Hakuna mtu aliyeweza kusimama mbele yao[b], kwa sababu hofu yao ilikuwa imewaangukia mataifa yote[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kunyoosha mkono dhidi ya”; yaani, kuwashambulia.
    reason: lexical_alternative
  - marker: b
    text: Au, “Hakuna mtu aliyeweza kuwapinga.”
    reason: lexical_alternative
  - marker: c
    text: Usemi wa Kiebrania unamaanisha makundi mbalimbali ya watu katika milki, si taifa moja tu.
    reason: cultural_note
lexical_decisions:
- source_word: נִקְהֲלוּ
  choice: wakakusanyika
  rationale: Nifali ya קהל inaonyesha kukusanyika pamoja; umbo la masimulizi “wakakusanyika” ni la kawaida katika Kiswahili na linahifadhi tendo la pamoja.
- source_word: בְּעָרֵיהֶם
  choice: katika miji yao
  rationale: עִיר kwa kawaida ni “mji,” na kiambishi cha umilikaji kimehifadhiwa kwa “yao.”
- source_word: בְּכָל מְדִינוֹת הַמֶּלֶךְ אֳחַשְׁוֵרוֹשׁ
  choice: katika majimbo yote ya Mfalme Ahasuero
  rationale: מְדִינוֹת ni maeneo ya kiutawala ya milki ya Uajemi; “majimbo” ni neno la kawaida na linaloeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: לִשְׁלֹחַ יָד
  choice: ili kuwashambulia
  rationale: Nahau ya Kiebrania, kihalisi “kunyoosha/kupeleka mkono dhidi ya,” hapa ina maana ya kutumia nguvu dhidi ya adui. “Kuwashambulia” huwasilisha maana hiyo kwa uwazi bila kudokeza kugusa tu.
- source_word: בִּמְבַקְשֵׁי רָעָתָם
  choice: wale waliotaka kuwadhuru
  rationale: Kirai kinaeleza watu waliotafuta madhara yao. “Waliotaka kuwadhuru” ni Kiswahili cha kawaida na kinahifadhi nia yao ya uadui.
- source_word: וְאִישׁ לֹא עָמַד לִפְנֵיהֶם
  choice: Hakuna mtu aliyeweza kusimama mbele yao
  rationale: Kihalisi ni kwamba hakuna mtu aliyesimama mbele yao; katika muktadha, usemi huo una maana ya kutoweza kuwapinga. Tafsiri inadumisha taswira ya chanzo huku “aliyeweza” ikionyesha maana ya kimuktadha.
- source_word: כִּי נָפַל פַּחְדָּם
  choice: kwa sababu hofu yao ilikuwa imewaangukia
  rationale: “Hofu yao” inadumisha uwezekano wa maana ya kuwaogopa, na “imewaangukia” inahifadhi taswira ya kitenzi נפל.
- source_word: עַל כָּל הָעַמִּים
  choice: watu wa makabila yote
  rationale: Wingi עַמִּים hapa unaelekea kutaja makundi mbalimbali ya watu ndani ya milki. Usemi huu unaeleweka kuliko “watu wote” na huepuka kuufanya kuwa taifa moja.
- source_word: אֳחַשְׁוֵרוֹשׁ
  choice: Ahasuero
  rationale: Hili ndilo umbo la jina linalotumiwa kwa kawaida katika mapokeo ya Biblia ya Kiswahili.
