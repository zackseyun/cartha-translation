base_translation:
  language: en
  yaml_path: translation/ot/esther/009/025.yaml
  text: But when she came before the king[a], he commanded by letter that his evil scheme which he had devised against the Jews should return on his own head[b], and they hanged him and his sons on the gallows.
translation:
  language: sw
  text: Lakini Esta alipofika mbele ya mfalme, mfalme aliamuru kwa hati[a] kwamba mpango mwovu ambao Hamani alikuwa amepanga dhidi ya Wayahudi urudi juu ya kichwa chake mwenyewe; nao wakamtundika Hamani pamoja na wanawe kwenye mti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi zaidi, Kiebrania husema, “alipofika mbele ya mfalme, alisema pamoja na hati.” Muundo huo ni mfupi na wenye utata; katika muktadha unaeleweka kuwa mfalme alitoa amri kwa maandishi.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania kinaweza kumaanisha kutundika au kuning'iniza, na “mti” unaweza kurejelea nguzo au kipande cha mbao badala ya mti halisi; namna kamili ya adhabu haijaelezwa wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְבֹאָהּ
  choice: alipofika
  rationale: Kiambishi cha kike katika Kiebrania kinamrejelea Esta katika muktadha. Kiswahili kinaweza kuacha jina lisitajwe huku kitenzi kikidokeza mhusika aliyekwisha tajwa.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: mbele ya mfalme
  rationale: Ni usemi wa kawaida wa kuingia au kufika katika uwepo wa mfalme, na unaakisi muundo wa Kiebrania kwa Kiswahili cha asili.
- source_word: אָמַר עִם הַסֵּפֶר
  choice: mfalme aliamuru kwa hati
  rationale: Kiebrania ni kifupi na kina utata wa kisarufi, kihalisi ‘alisema pamoja na/kwa hati.’ Muktadha unaelekeza kwenye agizo la mfalme lililotolewa kwa maandishi; ‘kwa hati’ huhifadhi rejeo la hati bila kutoa Kiswahili kisichoeleweka.
- source_word: מַחֲשַׁבְתּוֹ הָרָעָה אֲשֶׁר חָשַׁב
  choice: mpango mwovu ambao Hamani alikuwa amepanga
  rationale: Nomino na kitenzi vyenye mzizi mmoja vinahusu mpango uliokusudiwa, si wazo la ndani tu. Kutaja Hamani huondoa utata usio wa maana katika Kiswahili kuhusu mwenye mpango.
- source_word: יָשׁוּב ... עַל רֹאשׁוֹ
  choice: umrudie juu ya kichwa chake mwenyewe
  rationale: Huhifadhi taswira ya Kiebrania ya mpango kumrudia mwenye kuupanga na maana ya malipo yanayomwangukia yeye mwenyewe.
- source_word: וְתָלוּ אֹתוֹ וְאֶת־בָּנָיו עַל הָעֵץ
  choice: wakamtundika yeye na wanawe kwenye mti
  rationale: תלה humaanisha kutundika au kuangika, na עֵץ ni mti, mbao, au nguzo ya mbao. ‘Kumtundika kwenye mti’ huhifadhi upana wa ushahidi wa chanzo kuliko ‘kumnyonga kwenye mti wa kunyongea,’ ambalo lingeamua namna ya kifo kwa uhakika usiokuwamo katika neno lenyewe.
