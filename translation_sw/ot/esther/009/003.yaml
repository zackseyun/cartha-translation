base_translation:
  language: en
  yaml_path: translation/ot/esther/009/003.yaml
  text: And all the officials of the provinces[a], the satraps, the governors, and those doing the king’s work were supporting the Jews, because the fear of Mordecai had fallen on them.
translation:
  language: sw
  text: Nao maafisa wote wa majimbo, masatrapi, magavana, na watendaji wa kazi za mfalme waliwaunga mkono[a] Wayahudi, kwa sababu hofu ya Mordekai ilikuwa imewaangukia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliwasaidia Wayahudi”; kitenzi cha Kiebrania kinaweza pia kuwa na maana ya “kuwainua” au “kuwapendelea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: wakuu wa majimbo
  rationale: Neno שָׂרִים humaanisha viongozi au maofisa wenye mamlaka. “Wakuu wa majimbo” ni lugha ya kawaida na linafaa katika orodha hii ya utawala.
- source_word: אֲחַשְׁדַּרְפְּנִים
  choice: maliwali
  rationale: Ni cheo cha utawala cha Kiajemi. “Maliwali” kinatoa cheo cha juu cha kimajimbo kwa Kiswahili kinachoeleweka na kukitofautisha na magavana wanaotajwa baadaye.
- source_word: פַּחוֹת
  choice: magavana
  rationale: Ni cheo tofauti cha utawala wa maeneo. “Magavana” ni neno la sasa na linaloeleweka wazi.
- source_word: עֹשֵׂי הַמְּלָאכָה אֲשֶׁר לַמֶּלֶךְ
  choice: wale walioshughulikia kazi ya mfalme
  rationale: Tafsiri hii inabaki karibu na maana halisi ya ‘watendaji wa kazi iliyokuwa ya mfalme’ huku ikionyesha kwa lugha ya kawaida kuwa walikuwa watumishi waliotekeleza shughuli za kifalme.
- source_word: מְנַשְּׂאִים אֶת־הַיְּהוּדִים
  choice: waliwaunga mkono
  rationale: Hifili ya נָשָׂא inaweza kumaanisha kuinua, kusaidia, au kupendelea. Katika muktadha huu, “waliwaunga mkono” huonyesha msaada wa vitendo bila kudai kwa lazima kuwa waliwakweza hadhi.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya maofisa kuwaunga mkono Wayahudi.
- source_word: נָפַל פַּחַד מָרְדֳּכַי עֲלֵיהֶם
  choice: hofu ya Mordekai ilikuwa imewaangukia
  rationale: Hii huhifadhi sitiari dhahiri ya Kiebrania ya hofu kuwaangukia watu na pia hali ya tendo lililokuwa tayari limetokea katika muktadha.
- source_word: מָרְדֳּכַי
  choice: Mordekai
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
