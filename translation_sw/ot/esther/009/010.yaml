base_translation:
  language: en
  yaml_path: translation/ot/esther/009/010.yaml
  text: the ten sons of Haman son of Hammedatha[a], the enemy of the Jews, they killed; but they did not lay a hand on the plunder.
translation:
  language: sw
  text: Waliwaua wana kumi wa Hamani, mwana wa Hamedatha, adui wa Wayahudi; lakini hawakutia mikono yao juu ya nyara[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mali ya kupora.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֶׂרֶת בְּנֵי
  choice: wana kumi
  rationale: Muundo huu unaonyesha wana wa kiume wa Hamani waliotajwa katika muktadha; Kiswahili huweka namba baada ya nomino.
- source_word: הָמָן
  choice: Hamani
  rationale: Jina la mtu limetoholewa kwa umbo linalotumiwa kwa kawaida katika Kiswahili.
- source_word: בֶּן הַמְּדָתָא
  choice: mwana wa Hamedatha
  rationale: Kirai hiki kinamtambulisha Hamani kwa nasaba yake, huku jina la mtu likitoholewa.
- source_word: צֹרֵר הַיְּהוּדִים
  choice: adui wa Wayahudi
  rationale: צֹרֵר humaanisha mtu mwenye uhasama au anayesababisha dhiki; “adui” ni wazi, ya kawaida, na inafaa katika kirai hiki cha utambulisho.
- source_word: הָרָגוּ
  choice: waliwaua
  rationale: Kitenzi הרג hapa kina maana ya kuua; kiambishi cha yambwa kinaonyesha kwa kawaida kwamba waliouawa ni hao wana kumi waliotangulia kutajwa.
- source_word: וּבַבִּזָּה
  choice: lakini ... nyara
  rationale: בִּזָּה ni mali iliyoporwa au inayoweza kuporwa. Kiunganishi kimetafsiriwa kwa maana ya utofautishaji kwa sababu walitumia nguvu dhidi ya maadui lakini hawakuchukua mali.
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: hawakuzitia mkono
  rationale: Hii ni nahau ya kunyakua au kujitwalia kitu. “Kuzitia mkono” huhifadhi taswira ya mkono na kueleza kwamba hawakujitwalia nyara.
