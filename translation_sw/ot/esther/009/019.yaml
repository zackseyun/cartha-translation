source:
  edition: WLC
  text: עַל כֵּ֞ן הַ/יְּהוּדִ֣ים ה/פרוזים הַ/יֹּשְׁבִים֮ בְּ/עָרֵ֣י הַ/פְּרָזוֹת֒ עֹשִׂ֗ים אֵ֠ת י֣וֹם אַרְבָּעָ֤ה עָשָׂר֙ לְ/חֹ֣דֶשׁ אֲדָ֔ר שִׂמְחָ֥ה וּ/מִשְׁתֶּ֖ה וְ/י֣וֹם ט֑וֹב וּ/מִשְׁל֥וֹחַ מָנ֖וֹת אִ֥ישׁ לְ/רֵעֵֽ/הוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/019.yaml
  text: Therefore the Jews of the villages[a], who live in the rural towns, make the fourteenth day of the month of Adar a day of gladness and feasting and a holiday, and of sending portions[b], each man to his neighbor.
translation:
  language: sw
  text: Kwa hiyo Wayahudi wa vijijini[a], wanaoishi katika miji isiyozungushiwa kuta, huifanya siku ya kumi na nne ya mwezi wa Adari kuwa siku ya furaha na karamu, siku ya sherehe, na siku ya kupeleka mafungu[b], kila mtu kwa mwenzake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wayahudi wa miji isiyozungushiwa kuta, wanaoishi katika makazi ya wazi.”
    reason: lexical_alternative
  - marker: b
    text: Huenda “mafungu” yakamaanisha mafungu ya chakula au zawadi.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Kiunganishi cha matokeo kinahifadhi uhusiano wa sababu na hitimisho na simulizi lililotangulia.
- source_word: הַיְּהוּדִים
  choice: Wayahudi
  rationale: Katika Esta neno hili linamaanisha jamii ya Kiyahudi katika Milki ya Uajemi, si wakazi wa Yuda pekee.
- source_word: הפרוזים
  choice: wa vijijini
  rationale: Neno hilo linawatofautisha wakaaji wa makazi ya wazi na wale wa mji wenye ngome; tafsiri hii ni ya kawaida katika Kiswahili huku ufafanuzi unaofuata na tanbihi vikihifadhi maana ya kutokuwa na kuta.
- source_word: הַיֹּשְׁבִים בְּעָרֵי הַפְּרָזוֹת
  choice: wanaoishi katika miji isiyozungushiwa kuta
  rationale: Hutoa wazi tofauti ya kijiografia kati ya makazi ya wazi na mji wa ngome unaotajwa katika muktadha.
- source_word: עֹשִׂים אֵת יוֹם אַרְבָּעָה עָשָׂר
  choice: huiadhimisha siku ya kumi na nne ... kuwa siku
  rationale: Kitenzi עשה kinapotumiwa kuhusu siku humaanisha kuitunza au kuiadhimisha; muundo huu ni wa asili katika Kiswahili.
- source_word: לְחֹדֶשׁ אֲדָר
  choice: ya mwezi wa Adari
  rationale: Ni muundo wa kawaida wa kutaja tarehe na unahifadhi uhusiano wa siku na mwezi.
- source_word: שִׂמְחָה
  choice: furaha
  rationale: Neno la kawaida na lenye hadhi linalowasilisha hali ya kushangilia katika sikukuu.
- source_word: וּמִשְׁתֶּה
  choice: karamu
  rationale: Linamaanisha dhifa ya sherehe, ambayo mara nyingi ilihusisha kunywa, bila kulazimisha kipengele cha kileo kisichotajwa wazi hapa.
- source_word: וְיוֹם טוֹב
  choice: sherehe
  rationale: Katika muktadha huu nahau hiyo inaashiria siku ya kusherehekea; 'sherehe' huepuka maana ya mapumziko ya kiserikali inayoweza kudokezwa na 'sikukuu' au 'likizo'.
- source_word: וּמִשְׁלוֹחַ מָנוֹת
  choice: hutumiana mafungu
  rationale: Inahifadhi kutokubainishwa kikamilifu kwa מָנוֹת; uwezekano wa kuwa mafungu ya chakula umeelezwa katika tanbihi.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: kila mtu na mwenzake
  rationale: Muundo huu wa Kiswahili unawasilisha maana ya ugawanyaji na kurudishiana ya nahau ya Kiebrania bila kudai kwamba tendo hilo lilihusu wanaume pekee.
theological_decisions:
- issue: Usemi wa ugawanyaji wa kiume אִישׁ לְרֵעֵהוּ
  choice: kila mtu na mwenzake
  alternative: kila mwanamume kwa jirani yake
  rationale: Ingawa Kiebrania kina nomino za umoja wa kiume, huu ni usemi wa kawaida wa ugawanyaji unaowakilisha wanajamii kwa ujumla. Kiswahili 'kila mtu na mwenzake' huhifadhi maana hiyo bila kuingiza dai kwamba wapokeaji au watumaji walikuwa wanaume tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Adari' limetumika kama umbo la kawaida la Kiswahili la jina la mwezi. Sentensi imeweka wazi tofauti kati ya makazi yasiyo na kuta na mji wenye ngome, huku ikihifadhi kutokubainishwa kwa aina ya mafungu.
