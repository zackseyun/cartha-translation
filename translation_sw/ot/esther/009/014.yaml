translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtiririko wa simulizi umehifadhiwa kwa viambishi vya mfululizo ‘aka-/ika-.’ Neno ‘wakatundikwa’ limechaguliwa ili kutoamua kimyakimya njia halisi ya kuwaua au kuonyesha miili.
