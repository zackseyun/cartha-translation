  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ לְ/הֵֽעָשׂ֣וֹת כֵּ֔ן וַ/תִּנָּתֵ֥ן דָּ֖ת בְּ/שׁוּשָׁ֑ן וְ/אֵ֛ת עֲשֶׂ֥רֶת בְּנֵֽי הָמָ֖ן תָּלֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/014.yaml
  text: So the king said that it should be done so. A decree was issued in Susa[a], and the ten sons of Haman were hanged.
translation:
  language: sw
  text: Basi mfalme akasema kwamba ifanyike hivyo. Amri ikatolewa huko Shushani, nao wana kumi wa Hamani wakatundikwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakatundikwa juu ya nguzo”; kitenzi cha Kiebrania kinaweza kumaanisha kutundika miili juu ya mti au nguzo, si lazima kuwanyonga shingoni kama inavyoeleweka kwa kawaida leo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Kitenzi אמר kwa kawaida humaanisha ‘kusema’; hapa kinaonyesha idhini ya mfalme bila kukifanya chenyewe kuwa amri rasmi.
- source_word: לְהֵעָשׂוֹת כֵּן
  choice: kwamba ifanyike hivyo
  rationale: Muundo huu unaeleza kwamba ombi la Esta litekelezwe; tafsiri hii huhifadhi maana ya kutendwa na rejeo la כֵּן, ‘hivyo.’
- source_word: וַתִּנָּתֵן דָּת
  choice: Amri ikatolewa
  rationale: Hii ni nahau ya kiutawala ya kipindi cha Uajemi; ‘amri ikatolewa’ ni Kiswahili cha kawaida na sahihi kuliko tafsiri sisisi ya ‘sheria ikapewa.’
- source_word: בְּשׁוּשָׁן
  choice: huko Shushani
  rationale: ‘Shushani’ ni umbo lililozoeleka katika Biblia za Kiswahili kwa jina la mahali שׁוּשָׁן; ‘huko’ linafaa kwa mahali palipotajwa katika simulizi.
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: wana kumi wa Hamani
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa Kiebrania.
- source_word: תָּלוּ
  choice: wakatundikwa
  rationale: תלה inaweza kumaanisha kuning’iniza miili juu ya mti, nguzo, au mti wa kunyongolea. ‘Wakatundikwa’ huhifadhi upana huo kuliko ‘wakanyongwa,’ ambalo kwa Kiswahili cha sasa mara nyingi hudokeza kunyongwa shingoni.
