  yaml_path: translation/ot/esther/009/006.yaml
  text: And in Susa the citadel[a], the Jews killed and destroyed five hundred men.
translation:
  language: sw
  text: Na katika ngome ya Shushani[a], Wayahudi waliwaua na kuwaangamiza wanaume mia tano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “boma.” Neno la Kiebrania linaweza kumaanisha ngome au eneo la jumba la kifalme lililoimarishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/שׁוּשַׁן
  choice: Na katika ... Shushani
  rationale: Kiunganishi na kihusishi vinadumisha mwendelezo wa simulizi pamoja na maana ya mahali; “Shushani” ni umbo la jina linalotumika katika Biblia za Kiswahili.
- source_word: הַ/בִּירָה
  choice: ngome
  rationale: Neno בִּירָה linaweza kumaanisha eneo la jiji lenye ulinzi, ikiwemo ngome au makao ya kifalme yaliyoimarishwa; “ngome” ni la kawaida na halifungii maana kwenye jumba la mfalme pekee.
- source_word: הָרְגוּ
  choice: waliwaua
  rationale: Kitenzi הרג kinamaanisha moja kwa moja kuua; umbo lenye kiambishi cha yambwa linasomeka kwa kawaida katika Kiswahili.
- source_word: הַ/יְּהוּדִים
  choice: Wayahudi
  rationale: Katika Esta, jina hili linarejelea kundi la watu wa Kiyahudi; “Wayahudi” ndilo neno la kawaida na linaloeleweka katika Kiswahili.
- source_word: וְ/אַבֵּד
  choice: na kuwaangamiza
  rationale: Piel ya אבד ina maana ya kusababisha maangamizi. Kuitafsiri kando na “waliwaua” kunahifadhi matumizi ya vitenzi viwili katika Kiebrania.
- source_word: חֲמֵשׁ מֵאוֹת אִישׁ
  choice: wanaume mia tano
  rationale: Kirai cha Kiebrania ni hesabu ya “wanaume mia tano”; “wanaume” huhifadhi maana ya nomino אִישׁ katika muktadha huu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio “ngome ya Shushani” umetumiwa ili kutoa maana ya eneo la Shushani lenye ulinzi kwa mtindo wa kawaida wa Kiswahili; urudiaji wa vitenzi viwili umehifadhiwa kwa sababu umo katika chanzo.
