id: EST.9.29
reference: Esther 9:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ֠/תִּכְתֹּב אֶסְתֵּ֨ר הַ/מַּלְכָּ֧ה בַת אֲבִיחַ֛יִל וּ/מָרְדֳּכַ֥י הַ/יְּהוּדִ֖י אֶת כָּל תֹּ֑קֶף לְ/קַיֵּ֗ם אֵ֣ת אִגֶּ֧רֶת הַ/פּוּרִ֛ים הַ/זֹּ֖את הַ/שֵּׁנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/029.yaml
  text: Then Esther the queen[a], daughter of Abihail, and Mordecai the Jew wrote with full authority to confirm this second letter of Purim.
translation:
  language: sw
  text: Ndipo Esta malkia, binti wa Abihaili, pamoja na Mordekai Myahudi, akaandika kwa mamlaka kamili[a] ili kuthibitisha barua hii ya pili ya Purimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa mamlaka yote” au “kwa nguvu kamili.” Usemi wa Kiebrania unasisitiza nguvu rasmi na uhalali wa barua hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: Ndipo ... akaandika
  rationale: Waw-consecutive inaendeleza simulizi. Kitenzi cha Kiebrania kiko katika umoja wa kike, hivyo muundo huu unamweka Esta kuwa mhusika mkuu wa kuandika huku Mordekai akitajwa kuwa pamoja naye.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: Esta malkia
  rationale: Huhifadhi utambulisho rasmi wa Esta kwa lugha ya kawaida na yenye heshima ya Kiswahili.
- source_word: בַת אֲבִיחַיִל
  choice: binti Abihaili
  rationale: Ni usemi wa moja kwa moja wa ukoo unaomtambulisha Esta.
- source_word: וּמָרְדֳּכַי הַיְּהוּדִי
  choice: pamoja na Mordekai Myahudi
  rationale: ‘Pamoja na’ linaendana na kitenzi cha umoja wa kike, na ‘Myahudi’ hapa ni utambulisho wa kikabila unaofaa katika mazingira ya Uajemi.
- source_word: אֶת כָּל תֹּקֶף
  choice: kwa mamlaka kamili
  rationale: Katika muktadha wa barua rasmi, תֹּקֶף inaonyesha nguvu au mamlaka halali ya waraka, si nguvu za mwili.
- source_word: לְקַיֵּם
  choice: ili kuthibitisha
  rationale: Infinitivu inaonyesha kusudi la kuandika, yaani kuipa uthabiti na uhalali barua kuhusu maadhimisho yaliyowekwa.
- source_word: אִגֶּרֶת הַפּוּרִים הַזֹּאת הַשֵּׁנִית
  choice: barua hii ya pili ya Purimu
  rationale: Muundo huu unafuata kwa karibu kirai cha Kiebrania na kuonyesha wazi kwamba hii ni barua ya pili inayohusu Purimu.
theological_decisions:
- issue: Uhusiano wa kisarufi kati ya Esta, Mordekai, na kitenzi cha umoja wa kike
  choice: Esta ... pamoja na Mordekai ... akaandika
  alternative: Esta ... na Mordekai ... wakaandika
  rationale: Kiebrania kinatumia kitenzi cha umoja wa kike וַתִּכְתֹּב. Tafsiri iliyochaguliwa hailazimishi wingi, bali inadumisha uwezekano kwamba Esta ndiye mwandishi mkuu na Mordekai alishiriki naye.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida, huku ukihifadhi umoja wa kitenzi cha Kiebrania na uzito rasmi wa barua.
