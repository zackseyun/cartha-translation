  text: וַ/יַּכּ֤וּ הַ/יְּהוּדִים֙ בְּ/כָל אֹ֣יְבֵי/הֶ֔ם מַכַּת חֶ֥רֶב וְ/הֶ֖רֶג וְ/אַבְדָ֑ן וַ/יַּֽעֲשׂ֥וּ בְ/שֹׂנְאֵי/הֶ֖ם כִּ/רְצוֹנָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/005.yaml
  text: So the Jews struck all their enemies with the stroke of the sword[a], and with slaughter and destruction[b], and they did to those who hated them as they pleased.
translation:
  language: sw
  text: Basi Wayahudi wakawapiga adui zao wote kwa pigo la upanga, na kwa mauaji na maangamizi. Wakawatendea wale waliowachukia walivyotaka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kadiri ya mapenzi yao.”
    reason: Hii ni tafsiri ya karibu zaidi ya kirai כִּרְצוֹנָם; “walivyotaka” ni usemi wa kawaida wa Kiswahili unaohifadhi maana yake.
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: wakawapiga
  rationale: Kitenzi נכה kina maana pana ya kupiga au kushambulia. “Wakawapiga” huhifadhi upana huo, huku maneno yanayofuata yakionyesha wazi matokeo ya kuua.
- source_word: הַיְּהוּדִים
  choice: Wayahudi
  rationale: Katika Esta, יְהוּדִים linamaanisha Wayahudi kama jamii ya kikabila na kidini katika mazingira ya Uajemi.
- source_word: בְּכָל אֹיְבֵיהֶם
  choice: adui zao wote
  rationale: Huhifadhi maana ya jumla ya כָל na ni Kiswahili cha kawaida na wazi.
- source_word: מַכַּת חֶרֶב
  choice: kwa upanga
  rationale: Kirai hiki kwa neno kwa neno ni “pigo la upanga.” Katika Kiswahili, “kwa upanga” ni cha asili zaidi; uzito wa mfululizo mzima umehifadhiwa kwa vitenzi vinavyofuata, na maana halisi zaidi imeonyeshwa katika tanbihi.
- source_word: וְהֶרֶג וְאַבְדָן
  choice: wakawaua na kuwaangamiza
  rationale: Majina “mauaji na maangamizi” yamewasilishwa kama vitenzi ili kupata Kiswahili cha kawaida bila kupunguza ukali wa matendo hayo.
- source_word: בְשֹׂנְאֵיהֶם
  choice: wale waliowachukia
  rationale: Huhifadhi tofauti ya kileksia kati ya “adui” katika sehemu ya kwanza na kishiriki kinachomaanisha watu waliowachukia.
- source_word: כִּרְצוֹנָם
  choice: walivyotaka
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha maana ya kutenda kwa kadiri ya matakwa au mapenzi yao.
theological_decisions:
- issue: Kuwasilisha maelezo ya ukatili wa kivita bila kuyapunguza au kuyazidisha
  choice: Kuhifadhi wazi kupigwa kwa upanga, kuuawa, na kuangamizwa
  alternative: Kutumia neno la jumla kama “kuwashinda,” au kuongeza maana kwa kusema “kuwaangamiza kabisa”
  rationale: Kiebrania kinakusanya maneno yenye nguvu kuhusu pigo la upanga, mauaji, na maangamizi. Tafsiri inapaswa kuhifadhi ukali huo bila kuongeza wazo la maangamizi kamili lisilolazimishwa na matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi fupi zimetumiwa kwa uwazi. Lugha ya ukatili haijalainishwa, lakini pia haijaongezewa uzito usio katika chanzo.
