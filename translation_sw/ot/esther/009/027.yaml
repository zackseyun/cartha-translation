  terminology: “Wazao wao,” “waliojiunga nao,” na “kuzishika siku hizi mbili” ni sahihi na za asili. “Wajibu huu” hufanya dhana iliyodokezwa ya kujitwika wajibu iwe wazi bila kubadili maana. Neno “kuzishika” linafaa kwa utunzaji wa siku za maadhimisho bila kuongeza tafsiri ya kidini au ya kimadhehebu.
