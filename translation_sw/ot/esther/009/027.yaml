  source_fidelity: 'Rasimu inafikisha kwa ujumla maana ya Kiebrania: Wayahudi waliweka/kukubali wajibu huo kwao, wazao wao, na waliojiunga nao, ili maadhimisho ya siku mbili yasikose kufanywa kila mwaka. Hata hivyo, sentensi ya pili, “Waliazimia,” inaongeza tendo jingine lisilo wazi katika chanzo na hubadilisha uhusiano wa kishazi cha וְלֹא יַעֲבוֹר. Tafsiri iliyorekebishwa huiweka kama yaliyomo katika wajibu walioukubali.'
