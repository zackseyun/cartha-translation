revisions:
- from: 'Wayahudi walithibitisha na kukubali wajibu huo kwa ajili yao wenyewe, kwa wazao wao, na kwa wote waliojiunga nao[a]. Waliazimia kwamba desturi hiyo isikome[b]: wataadhimisha siku hizi mbili kwa mujibu wa yale yaliyoandikwa kuzihusu, kwa wakati wake uliowekwa, mwaka baada ya mwaka.'
  to: Wayahudi waliweka na kukubali wajibu huu juu yao wenyewe, juu ya wazao wao, na juu ya wote waliojiunga nao[a], kwamba wasikose kuzishika siku hizi mbili kama ilivyoandikwa kwa ajili ya siku hizo na kwa wakati uliowekwa[b], mwaka baada ya mwaka.
