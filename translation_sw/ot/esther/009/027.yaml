  text: קִיְּמ֣וּ ו/קבל הַ/יְּהוּדִים֩ עֲלֵי/הֶ֨ם וְ/עַל זַרְעָ֜/ם וְ/עַ֨ל כָּל הַ/נִּלְוִ֤ים עֲלֵי/הֶם֙ וְ/לֹ֣א יַעֲב֔וֹר לִ/הְי֣וֹת עֹשִׂ֗ים אֵ֣ת שְׁנֵ֤י הַ/יָּמִים֙ הָ/אֵ֔לֶּה כִּ/כְתָבָ֖/ם וְ/כִ/זְמַנָּ֑/ם בְּ/כָל שָׁנָ֖ה וְ/שָׁנָֽה׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/027.yaml
  text: 'the Jews established and accepted for themselves[a], for their offspring, and for all who joined them, that it should not fail: to observe these two days according to what was written for them and at their appointed time[b], year after year.'
translation:
  language: sw
  text: Wayahudi waliweka na kukubali wajibu huu juu yao wenyewe, juu ya wazao wao, na juu ya wote waliojiunga nao[a], kwamba wasikose kuzishika siku hizi mbili kama ilivyoandikwa kwa ajili ya siku hizo na kwa wakati uliowekwa[b], mwaka baada ya mwaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wote walioambatana nao.” Kiebrania kinarejelea watu waliojiunga au kujihusisha na Wayahudi.
    reason: lexical_alternative
  - marker: b
    text: Kwa karibu zaidi, “kwamba jambo hilo lisipite.” Maana yake ni kwamba ushikaji wa siku hizo haukupaswa kuachwa au kukoma.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִיְּמוּ
  choice: walithibitisha
  rationale: Kitenzi hiki katika muktadha wa agizo la kudumu kina maana ya kufanya jambo lisimame imara au kulithibitisha. “Walithibitisha” ni cha kawaida na kinafaa kwa uamuzi huu wa jumuiya.
- source_word: וְקִבֵּל
  choice: na kukubali wajibu huo
  rationale: Maana ya muktadha ni kuukubali au kuutwaa wajibu. Neno “wajibu” linaweka wazi nguvu ya עֲלֵיהֶם bila kuifanya sentensi ya Kiswahili kuwa ngumu.
- source_word: עֲלֵיהֶם
  choice: kwa ajili yao wenyewe
  rationale: Hueleza kwamba Wayahudi waliweka wajibu huo juu yao wenyewe; muundo huu ni wa asili zaidi katika Kiswahili kuliko tafsiri sisisi ya “juu yao.”
- source_word: זַרְעָם
  choice: wazao wao
  rationale: “Wazao” huhifadhi maana ya vizazi vinavyotokana nao bila kutumia lugha ya kale ya “mbegu.”
- source_word: כָּל הַנִּלְוִים עֲלֵיהֶם
  choice: wote waliojiunga nao
  rationale: Kitenzi לוה hapa hurejelea watu walioambatana au kujiunga na Wayahudi. “Waliojiunga nao” ni wazi na hakiongezi aina maalumu ya uhusiano.
- source_word: וְלֹא יַעֲבוֹר
  choice: desturi hiyo isikome
  rationale: Nahau hii inaonyesha kwamba uadhimishaji haukupaswa kupita, kuachwa, au kufifia. “Isikome” huwasilisha kutodidimia kwa desturi kwa Kiswahili cha kawaida.
- source_word: לִהְיוֹת עֹשִׂים
  choice: wataadhimisha
  rationale: Ingawa kwa karibu ni “kuwa wakifanya,” katika muktadha wa siku za sikukuu maana yake ni kuziadhimisha au kuzishika. “Kuadhimisha” ni ya asili na yenye heshima.
- source_word: שְׁנֵי הַיָּמִים הָאֵלֶּה
  choice: siku hizi mbili
  rationale: Hii ni tafsiri ya moja kwa moja ya kirai cha Kiebrania.
- source_word: כִּכְתָבָם
  choice: kwa mujibu wa yale yaliyoandikwa kuzihusu
  rationale: Huhifadhi rejeo la kiwango kilichoandikwa bila kubainisha kupita kiasi hati au aina ya maagizo.
- source_word: וְכִזְמַנָּם
  choice: kwa wakati wake uliowekwa
  rationale: זמן ni wakati uliowekwa. Umoja wa Kiswahili unasomeka kwa kawaida kama wakati uliopangwa wa maadhimisho ya siku hizo mbili.
- source_word: בְּכָל שָׁנָה וְשָׁנָה
  choice: mwaka baada ya mwaka
  rationale: Usemi huu huhifadhi msisitizo wa kurudiwa kwa maadhimisho kila mwaka.
theological_decisions:
- issue: Upeo wa “wote waliojiunga nao”
  choice: Kuacha aina ya kujiunga bila kubainishwa
  alternative: Kusema walioongoka au walioingia rasmi katika dini ya Kiyahudi
  rationale: Kiebrania kinaonyesha kuambatana au kujiunga, lakini mstari wenyewe hauelezi kwa uhakika hadhi ya kidini au ya kisheria ya watu hao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa ili kuonyesha wazi uamuzi wa Wayahudi na wajibu wa kila mwaka, huku mkazo wa Kiebrania kwamba desturi hiyo isikome ukihifadhiwa.
