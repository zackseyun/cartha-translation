    rationale: Kiebrania kina mfululizo mmoja wa ‘walithibitisha na kukubali juu yao ... kwamba/isije ikapita, ili waendelee kuzifanya.’ Kuanzisha ‘waliazimia’ kunarudia na kwa kiasi fulani huongeza tendo lisilotajwa.
  - severity: low
    issue: “kwa wakati wake uliowekwa” ina rejeleo lisilo wazi la kiambishi cha umoja -ke.
    rationale: Kwa kuwa kiambishi kinafuata ‘siku hizi mbili,’ usemi wa moja kwa moja “kwa wakati uliowekwa” huepuka utata huku ukihifadhi maana ya וְכִזְמַנָּם.
  - severity: low
    issue: Alama ya tanbihi a imeambatanishwa na “nao” badala ya kirai kamili “wote waliojiunga nao.”
    rationale: Kuhamisha alama hadi mwisho wa kirai kamili huonyesha kwa uwazi kuwa tanbihi inafafanua participle הַנִּלְוִים.
