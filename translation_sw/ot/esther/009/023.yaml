  yaml_path: translation/ot/esther/009/023.yaml
  text: So the Jews accepted what they had begun to do[a], and what Mordecai had written to them.
translation:
  language: sw
  text: Basi Wayahudi wakakubali yale waliyokuwa wameanza kufanya,[a] na yale ambayo Mordekai alikuwa amewaandikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakajitwika yale waliyokuwa wameanza kufanya.” Kitenzi cha Kiebrania kinaweza kumaanisha kukubali jambo au kujitwika wajibu wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִבֵּל
  choice: wakakubali
  rationale: Katika muktadha huu קבל ina maana ya kukubali au kujitwika wajibu wa desturi fulani. “Wakakubali” ni ya asili katika Kiswahili na haifanyi tendo hilo lionekane kuwa kupokea tu bila kuchukua wajibu.
- source_word: הַיְּהוּדִים
  choice: Wayahudi
  rationale: Ni jina la kawaida na sahihi la kundi hili la kikabila na kidini katika Kiswahili.
- source_word: אֵת אֲשֶׁר הֵחֵלּוּ לַעֲשׂוֹת
  choice: kuendelea kufanya yale waliyokuwa wameanza kufanya
  rationale: Kitenzi הראשי cha ‘kukubali’ hapa kinahusu kuendeleza desturi ambayo tayari walikuwa wameianza. Neno “kuendelea” linaweka wazi maana inayodokezwa na muktadha, huku “waliyokuwa wameanza kufanya” likihifadhi muundo wa chanzo.
- source_word: וְאֵת אֲשֶׁר
  choice: na yale ambayo
  rationale: Huhifadhi ulinganifu wa vitu viwili vinavyotawaliwa na kitenzi ‘wakakubali,’ kwa Kiswahili cha kawaida.
- source_word: כָּתַב
  choice: alikuwa amewaandikia
  rationale: Wakati uliotangulia unaonyesha kwamba kuandika kwa Mordekai kulitokea kabla ya kukubali kwa Wayahudi katika mtiririko wa simulizi.
- source_word: מָרְדֳּכַי
  choice: Mordekai
  rationale: Umbo hili la jina limetumika kwa kawaida katika tafsiri za Biblia za Kiswahili na ni rahisi kutambulika.
- source_word: אֲלֵיהֶם
  choice: amewaandikia
  rationale: Kiambishi -wa- pamoja na kitenzi ‘andika’ huwasilisha kwa Kiswahili cha asili kwamba maandishi yalielekezwa kwao.
