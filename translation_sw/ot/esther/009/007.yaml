- source_word: פַּרְשַׁנְדָּתָא
  choice: Parshandatha
  rationale: Ni jina la mtu lenye asili inayodhaniwa kuwa ya Kiajemi; limenukuliwa kwa herufi za Kiswahili badala ya kutafsiriwa.
- source_word: דַּלְפוֹן
  choice: Dalfoni
  rationale: Ni jina la mtu. Umbo “Dalfoni” linafuata namna iliyozoeleka ya kuandika jina hili katika Biblia za Kiswahili na linaakisi matamshi ya Kiebrania.
- source_word: אַסְפָּתָא
  choice: Aspatha
  rationale: Ni jina la mtu, hivyo limenukuliwa badala ya kutafsiriwa.
