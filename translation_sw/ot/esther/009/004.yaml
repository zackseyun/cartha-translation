base_translation:
  language: en
  yaml_path: translation/ot/esther/009/004.yaml
  text: For Mordecai was great in the king’s house[a], and the report about him was spreading through all the provinces[b], for the man Mordecai was becoming greater and greater.
translation:
  language: sw
  text: Kwa maana Mordekai alikuwa mkuu katika nyumba ya mfalme, na habari zake zilikuwa zikienea katika majimbo yote, kwa maana Mordekai alikuwa akizidi kuwa mkuu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “Mordekai alikuwa akienda na kuwa mkuu,” usemi wa Kiebrania unaoonyesha kwamba aliendelea kuwa mkuu zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu ya jambo lililotangulia; ‘Kwa maana’ huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: גָדוֹל
  choice: mtu mkuu
  rationale: Katika muktadha huu neno linaonyesha cheo, umaarufu, au ushawishi mkubwa, si ukubwa wa mwili.
- source_word: בְּבֵית הַמֶּלֶךְ
  choice: katika nyumba ya mfalme
  rationale: Huhifadhi taswira halisi ya Kiebrania huku ikiruhusu maana ya mazingira ya ikulu au utawala wa kifalme.
- source_word: שָׁמְעוֹ
  choice: habari zake
  rationale: Neno linaweza kumaanisha habari, taarifa, sifa, au umaarufu wake; ‘habari zake’ huhifadhi upana huo bila kuufanya umaarufu kuwa maana pekee.
- source_word: הוֹלֵךְ
  choice: zilikuwa zikienea
  rationale: Habari zinapokuwa kiima, mwendo unaoendelea unaelezwa kwa Kiswahili cha kawaida kama kuenea.
- source_word: בְּכָל הַמְּדִינוֹת
  choice: katika majimbo yote
  rationale: ‘Majimbo’ linafaa kwa vitengo vya utawala vya milki ya Uajemi; kirai kinaonyesha kuenea kote katika maeneo hayo.
- source_word: הָאִישׁ מָרְדֳּכַי
  choice: Mordekai
  rationale: Kiebrania kinasema kihalisi ‘mtu Mordekai,’ lakini katika Kiswahili usemi huo ungekuwa mzito na usio wa kawaida; jina pekee linabeba msisitizo unaotosha katika marudio haya.
- source_word: הוֹלֵךְ וְגָדוֹל
  choice: alikuwa akizidi kuwa mkuu zaidi na zaidi
  rationale: Huu ni usemi wa Kiebrania unaoonyesha ongezeko la kudumu katika ukuu, hadhi, au ushawishi.
