base_translation:
  language: en
  yaml_path: translation/ot/esther/009/013.yaml
  text: Esther said[a], “If it pleases the king, let it be granted to the Jews who are in Susa to do tomorrow also according to today’s decree, and let Haman’s ten sons be hanged on the gallows.”
translation:
  language: sw
  text: Esta akasema, “Ikiwa mfalme akiona vema, Wayahudi walioko Shushani wapewe ruhusa kesho pia kufanya kulingana na amri ya leo, na wana kumi wa Hamani watundikwe kwenye mti.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watundikwe kwenye mti wa kunyongea,” au “wachomekwe kwenye nguzo.” Kiebrania husema kihalisi “kwenye mti/kitu cha mbao”; katika muktadha huu kinaweza kurejelea kifaa cha kunyonga au nguzo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Ikiwa mfalme anaona vema
  rationale: Ni namna ya heshima ya kuomba kibali cha kifalme; tafsiri hii ni ya kawaida katika Kiswahili na haifanyi neno 'vema' kuwa hukumu ya kimaadili.
- source_word: יִנָּתֵן
  choice: na waruhusiwe
  rationale: Kauli ya kutendwa yenye maana ya ombi inaeleza kupewa kibali rasmi; katika Kiswahili, 'waruhusiwe' huunganika kwa kawaida na walengwa, yaani Wayahudi.
- source_word: גַּם מָחָר
  choice: kesho pia
  rationale: Inadumisha wazo la kuendeleza kibali cha siku ya leo hadi siku inayofuata.
- source_word: לַיְּהוּדִים אֲשֶׁר בְּשׁוּשָׁן
  choice: Wayahudi walioko Shushani
  rationale: Huwatambulisha walengwa wa kibali na kuhifadhi kishazi cha mahali kwa Kiswahili cha asili.
- source_word: לַעֲשׂוֹת כְּדָת הַיּוֹם
  choice: kufanya kulingana na amri ya leo
  rationale: Kitenzi kinaachwa kuwa kipana kama katika Kiebrania, huku דָּת ikionyesha amri rasmi ya kifalme katika muktadha wa Esta.
- source_word: דָּת
  choice: amri
  rationale: '''Amri'' ni neno la Kiswahili linaloeleweka kwa urahisi kwa agizo rasmi la kifalme bila kulifanya lazima kuwa sheria ya kudumu.'
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: wana kumi wa Hamani
  rationale: Hii ni namna ya kawaida na iliyo wazi ya kuwasilisha muundo wa umilikaji katika Kiswahili.
- source_word: יִתְלוּ עַל־הָעֵץ
  choice: watundikwe kwenye mti
  rationale: Huhifadhi maana ya msingi ya תלה na עֵץ bila kuamua kimya kimya ikiwa kifaa hicho kilikuwa mti, nguzo ya kuchomekea, au mahali pa kunyongea; utata huo unaelezwa katika tanbihi.
