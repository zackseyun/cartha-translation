  text: לְ/קַיֵּם֮ עֲלֵי/הֶם֒ לִ/הְי֣וֹת עֹשִׂ֗ים אֵ֠ת י֣וֹם אַרְבָּעָ֤ה עָשָׂר֙ לְ/חֹ֣דֶשׁ אֲדָ֔ר וְ/אֵ֛ת יוֹם חֲמִשָּׁ֥ה עָשָׂ֖ר בּ֑/וֹ בְּ/כָל שָׁנָ֖ה וְ/שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/021.yaml
  text: to establish among them that they should observe the fourteenth day of the month Adar[a], and the fifteenth day of it, year after year,
translation:
  language: sw
  text: ili kuwawekea wajibu wa kuadhimisha siku ya kumi na nne ya mwezi wa Adari na siku ya kumi na tano ya mwezi huo, mwaka baada ya mwaka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְקַיֵּם עֲלֵיהֶם
  choice: kuwawekea wajibu
  rationale: Katika muktadha wa barua ya Mordekai, kauli hii ina maana ya kuthibitisha au kuweka rasmi wajibu juu yao. Kiswahili hiki ni cha kawaida na kinadumisha nguvu ya עֲלֵיהֶם, ‘juu yao,’ kuliko kusema tu ‘miongoni mwao.’
- source_word: לִהְיוֹת עֹשִׂים
  choice: kuadhimisha
  rationale: Ingawa kihalisi ni ‘kuwa wakifanya,’ inapohusu siku za sikukuu humaanisha kuzishika au kuziadhimisha; ‘kuadhimisha’ ni wazi na ya asili katika Kiswahili.
- source_word: אֵת יוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: siku ya kumi na nne ya mwezi wa Adari
  rationale: Hii inafuata namna ya kawaida ya Kiswahili ya kutaja tarehe na kulihifadhi jina la mwezi wa kalenda ya Kiyahudi.
- source_word: וְאֵת יוֹם חֲמִשָּׁה עָשָׂר בּוֹ
  choice: na siku ya kumi na tano ya mwezi huo
  rationale: Kiwakilishi בּוֹ kinarejelea mwezi uliotajwa; kurudia ‘mwezi huo’ huondoa utata kwa Kiswahili cha kawaida bila kuongeza maana mpya.
- source_word: בְּכָל שָׁנָה וְשָׁנָה
  choice: mwaka baada ya mwaka
  rationale: Usemi wa Kiebrania unarudia ‘mwaka’ ili kuonyesha urudiaji wa kila mwaka. ‘Mwaka baada ya mwaka’ ni wa asili na unahifadhi msisitizo huo.
theological_decisions: []
