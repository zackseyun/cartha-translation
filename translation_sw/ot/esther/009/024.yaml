id: EST.9.24
reference: Esther 9:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּי֩ הָמָ֨ן בֶּֽן הַמְּדָ֜תָא הָֽ/אֲגָגִ֗י צֹרֵר֙ כָּל הַ/יְּהוּדִ֔ים חָשַׁ֥ב עַל הַ/יְּהוּדִ֖ים לְ/אַבְּדָ֑/ם וְ/הִפִּ֥יל פּוּר֙ ה֣וּא הַ/גּוֹרָ֔ל לְ/הֻמָּ֖/ם וּֽ/לְ/אַבְּדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/024.yaml
  text: For Haman son of Hammedatha the Agagite[a], the enemy of all the Jews, had plotted against the Jews to destroy them, and had cast Pur—that is[b], the lot—to crush them and to destroy them.
translation:
  language: sw
  text: Kwa maana Hamani mwana wa Hamedatha, Mwagagi, adui wa Wayahudi wote, alikuwa amepanga njama dhidi ya Wayahudi ili kuwaangamiza. Alipiga Puri[a], yaani kura, ili kuwavuruga[b] na kuwaangamiza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Puri ni neno la mkopo linalofafanuliwa hapa kuwa “kura”; kulihifadhi kunaonyesha uhusiano wake na jina Purimu katika aya zinazozunguka.
    reason: cultural_note
  - marker: b
    text: Au, “kuwatia hofu” au “kuwafanya wafadhaike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Katika muktadha huu neno hilo linatanguliza sababu ya maadhimisho yaliyotajwa katika aya zinazozunguka.
- source_word: הָמָן בֶּן הַמְּדָתָא הָאֲגָגִי
  choice: Hamani mwana wa Hamedatha, Mwagagi
  rationale: Majina yametoholewa kwa namna ya kawaida katika Kiswahili, na ‘Mwagagi’ limehifadhi utambulisho wa ukoo au nasaba uliomo katika Kiebrania.
- source_word: צֹרֵר כָּל הַיְּהוּדִים
  choice: adui wa Wayahudi wote
  rationale: ‘Adui’ ni neno la kawaida na lenye nguvu linaloonyesha uhasama wa mhusika dhidi ya Wayahudi wote.
- source_word: חָשַׁב עַל הַיְּהוּדִים
  choice: alikuwa amepanga njama dhidi ya Wayahudi
  rationale: Muundo huu katika muktadha unaonyesha kupanga kwa nia mbaya, si kufikiri tu; wakati uliotangulia unaonyesha kuwa mpango huo ndio msingi wa maelezo haya.
- source_word: לְאַבְּדָם
  choice: ili kuwaangamiza
  rationale: Kitenzi hapa kinamaanisha kusababisha maangamizi; ‘kuwaangamiza’ kinaonyesha wazi uzito na kusudi la mpango huo.
- source_word: וְהִפִּיל פּוּר
  choice: Alipiga Puri
  rationale: ‘Puri’ limehifadhiwa kama neno la mkopo linaloelezwa na maandishi yenyewe na linalounganisha aya hii na jina la sikukuu ya Purimu. ‘Kupiga kura’ ni usemi wa kawaida wa Kiswahili.
- source_word: הוּא הַגּוֹרָל
  choice: yaani kura
  rationale: Haya ni maelezo ya neno geni ‘Puri’; ‘yaani’ huwasilisha kwa kawaida ufafanuzi huo katika Kiswahili.
- source_word: לְהֻמָּם
  choice: ili kuwavuruga
  rationale: Kitenzi kinaweza kumaanisha kusababisha vurugu, fadhaa, hofu, au kushindwa. ‘Kuwavuruga’ huhifadhi upana huo bila kulazimisha maana moja pekee.
- source_word: וּלְאַבְּדָם
  choice: na kuwaangamiza
  rationale: Kurudia ‘kuwaangamiza’ kunahifadhi marudio na msisitizo wa maandishi ya Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Sentensi imegawanywa mara mbili ili kuepuka msongamano bila kupoteza uhusiano wa kisababishi; marudio ya ‘kuwaangamiza’ yamehifadhiwa kwa ajili ya msisitizo wa chanzo.
