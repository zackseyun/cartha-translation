source:
  edition: WLC
  text: וּ/שְׁאָ֣ר הַ/יְּהוּדִ֡ים אֲשֶׁר֩ בִּ/מְדִינ֨וֹת הַ/מֶּ֜לֶךְ נִקְהֲל֣וּ וְ/עָמֹ֣ד עַל נַפְשָׁ֗/ם וְ/נ֨וֹחַ֙ מֵ/אֹ֣יְבֵי/הֶ֔ם וְ/הָרֹג֙ בְּ/שֹׂ֣נְאֵי/הֶ֔ם חֲמִשָּׁ֥ה וְ/שִׁבְעִ֖ים אָ֑לֶף וּ/בַ֨/בִּזָּ֔ה לֹ֥א שָֽׁלְח֖וּ אֶת יָדָֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/016.yaml
  text: And the rest of the Jews who were in the king’s provinces gathered themselves together and stood for their lives[a], and had relief from their enemies, and killed seventy-five thousand of those who hated them[b]; but they did not lay a hand on the plunder.
translation:
  language: sw
  text: Nao Wayahudi waliosalia waliokuwa katika majimbo ya mfalme wakakusanyika na kusimama kutetea maisha yao[a]. Wakapata pumziko kutoka kwa adui zao, wakawaua watu elfu sabini na tano miongoni mwa wale waliowachukia; lakini hawakunyosha mikono yao kuchukua nyara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kusimama kwa ajili ya maisha yao.”
    reason: lexical_alternative
  - marker: b
    text: “Nyara” ni mali inayotwaliwa katika vita.
    reason: clarification
lexical_decisions:
- source_word: וּשְׁאָר הַיְּהוּדִים
  choice: Nao Wayahudi wengine
  rationale: Kifungu hiki kinawatofautisha Wayahudi waliobaki katika majimbo na wale wa Shushani waliotajwa katika muktadha uliotangulia; ‘wengine’ ni ya kawaida na wazi katika Kiswahili.
- source_word: בִּמְדִינוֹת הַמֶּלֶךְ
  choice: waliokuwa katika majimbo ya mfalme
  rationale: מְדִינוֹת ni maeneo ya kiutawala ya milki; ‘majimbo ya mfalme’ ni tafsiri ya asili na inayoeleweka.
- source_word: נִקְהֲלוּ
  choice: walikusanyika
  rationale: Kitenzi hiki kinaonyesha kukusanyika kwa pamoja kwa Wayahudi kwa kuitikia amri ya kifalme; ‘walikusanyika’ ni sahihi na ya kawaida.
- source_word: וְעָמֹד עַל נַפְשָׁם
  choice: na kusimama kutetea maisha yao
  rationale: Nahau hiyo kwa neno moja moja ni kusimama kwa ajili ya uhai wao, lakini katika muktadha inaonyesha kujihami ili kuokoa maisha; tafsiri hii huhifadhi picha ya ‘kusimama’ na kusudi la kujilinda.
- source_word: וְנוֹחַ מֵאֹיְבֵיהֶם
  choice: Wakapata pumziko kutokana na adui zao
  rationale: נוּחַ hapa huonyesha kupata utulivu au nafuu baada ya tishio; ‘pumziko kutokana na adui zao’ huhifadhi mtindo wa simulizi bila kudokeza kwamba adui waliwapa pumziko kwa hiari.
- source_word: וְהָרֹג בְּשֹׂנְאֵיהֶם
  choice: wakawaua ... miongoni mwa wale waliowachukia
  rationale: בְּשֹׂנְאֵיהֶם hutaja kundi ambamo waliouawa walitoka. ‘Miongoni mwa’ huhifadhi kazi ya kihusishi ב bila kudai kwamba kila aliyewachukia aliuawa.
- source_word: חֲמִשָּׁה וְשִׁבְעִים אָלֶף
  choice: watu sabini na tano elfu
  rationale: Mpangilio wa namba umewekwa katika Kiswahili cha kawaida; ‘watu’ huweka wazi kwamba idadi inawahusu waliouawa.
- source_word: וּבַבִּזָּה לֹא שָׁלְחוּ אֶת יָדָם
  choice: lakini hawakunyosha mikono yao kuchukua nyara
  rationale: Nahau ya Kiebrania ni ‘hawakupeleka/kunyosha mkono wao juu ya nyara,’ yaani hawakuzitwaa. Tafsiri hii huhifadhi picha ya mkono huku ikifanya maana iwe wazi.
theological_decisions:
- issue: Mtazamo wa kimaadili kuhusu hatua ya Wayahudi
  choice: kusimama kutetea maisha yao
  alternative: kusimama kwa ajili ya maisha yao; kujilinda
  rationale: Kiebrania kinaunganisha kusimama kwao na kuhifadhi uhai. Tafsiri haifichi mauaji yaliyofuata wala kuyaonyesha kama uchokozi usio na muktadha wa kujilinda.
- issue: Upeo wa waliouawa
  choice: miongoni mwa wale waliowachukia
  alternative: wale waliowachukia
  rationale: Kihusishi ב kinaweza kuwasilisha waliouawa kama waliotoka katika kundi la wenye chuki. ‘Miongoni mwa’ huhifadhi uwezekano huo na kuepuka kudokeza kwamba wote katika kundi hilo waliuawa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Viunganishi vya mfululizo ‘waka-’ vinatunza mwendo wa simulizi. ‘Nyara’ ni istilahi ya kawaida ya mali iliyotekwa vitani; tanbihi inaifafanua.
