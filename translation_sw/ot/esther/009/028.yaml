base_translation:
  language: en
  yaml_path: translation/ot/esther/009/028.yaml
  text: And these days are remembered and observed in every generation[a], every family, every province, and every city; and these days of Purim shall not pass away from among the Jews[c][b], and their remembrance shall not cease from their offspring.
translation:
  language: sw
  text: Siku hizi hukumbukwa na kuadhimishwa katika kila kizazi, kila jamaa, kila jimbo na kila mji; siku hizi za Purimu hazitaondoka miongoni mwa Wayahudi, wala kumbukumbu yao haitakoma miongoni mwa wazao wao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִזְכָּרִים
  choice: zitakumbukwa
  rationale: Nifali ya זכר inaonyesha kwamba siku hizi zitaendelea kuwekwa katika kumbukumbu; ‘zitakumbukwa’ ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: וְנַעֲשִׂים
  choice: na kuadhimishwa
  rationale: Ingawa kitenzi kimsingi humaanisha ‘kufanywa,’ hapa kinahusu kutekeleza kwa vitendo maadhimisho ya sikukuu; ‘kuadhimishwa’ ni Kiswahili cha asili katika muktadha huu.
- source_word: בְּכָל דּוֹר וָדוֹר
  choice: katika kila kizazi
  rationale: Urudiaji wa nomino katika Kiebrania una nguvu ya ugawaji, yaani kila kizazi kwa mfululizo.
- source_word: מִשְׁפָּחָה וּמִשְׁפָּחָה
  choice: kila jamaa
  rationale: ‘Kila jamaa’ huwasilisha nguvu ya ugawaji ya urudiaji wa Kiebrania na inafaa kwa kundi la kifamilia lenye upana kuliko familia ya nyuklia.
- source_word: מְדִינָה וּמְדִינָה
  choice: kila jimbo
  rationale: Katika Esta neno hili hurejelea jimbo la kiutawala katika milki ya Uajemi; ‘jimbo’ huhifadhi maana hiyo.
- source_word: וְעִיר וָעִיר
  choice: na kila mji
  rationale: Tafsiri hii huonyesha maana ya ugawaji ya muundo wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: יְמֵי הַפּוּרִים
  choice: siku hizi za Purimu
  rationale: ‘Purimu’ ni umbo la Kiswahili la jina la sikukuu, na muundo huu huhifadhi uhusiano wa Kiebrania kati ya siku na sikukuu.
- source_word: לֹא יַעַבְרוּ מִתּוֹךְ הַיְּהוּדִים
  choice: hazitakoma miongoni mwa Wayahudi
  rationale: Katika muktadha huu עבר pamoja na מן/מתוך huonyesha kutoweka au kukoma katika maisha ya jumuiya; ‘hazitakoma miongoni mwa’ ni wazi na ya asili.
- source_word: וְזִכְרָם
  choice: wala kumbukumbu yake
  rationale: Kiwakilishi cha Kiebrania kinarudi kwa wingi wa ‘siku,’ lakini Kiswahili kwa kawaida hutumia ‘kumbukumbu yake’ kurejelea tukio au maadhimisho hayo kwa pamoja.
- source_word: לֹא יָסוּף מִזַּרְעָם
  choice: haitakoma miongoni mwa wazao wao
  rationale: יסוף humaanisha kukoma au kufikia mwisho, na זרע hapa ni uzao wa vizazi vijavyo; ‘wazao wao’ ni wazi na ya kawaida.
