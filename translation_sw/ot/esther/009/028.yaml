translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha umefanywa kuwa wa asili huku nguvu ya ugawaji ya Kiebrania ikihifadhiwa kwa ‘kila.’ Hakuna tanbihi iliyohitajika kwa kuwa tofauti za kileksika zinaweza kuwasilishwa kwa uwazi ndani ya matini.
