base_translation:
  language: en
  yaml_path: translation/ot/esther/009/030.yaml
  text: And he sent letters to all the Jews in the one hundred twenty-seven provinces of the kingdom of Ahasuerus[a], words of peace and truth[c][b],
translation:
  language: sw
  text: Naye akatuma barua kwa Wayahudi wote katika majimbo mia moja ishirini na saba ya ufalme wa Ahasuero[a], maneno ya amani na kweli[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ahasuero ni umbo la Kiebrania la jina la kifalme; baadhi humtambua kihistoria kuwa Kserkse wa Kwanza.
    reason: cultural_note
  - marker: b
    text: Au, “ujumbe wa amani na kweli.” Kiebrania kinasema kihalisi, “maneno ya amani na kweli.”
    reason: lexical_alternative
  - marker: c
    text: Neno “kweli” hapa linaweza pia kueleweka kuwa “uaminifu” au “kutegemewa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Naye akatuma
  rationale: Muundo wa kisimulizi unaendeleza matukio; “Naye akatuma” ni wa kawaida katika Kiswahili na hauongezi maana mahsusi ya wakati.
- source_word: סְפָרִים
  choice: barua
  rationale: Katika mazingira ya utawala wa Uajemi, neno hili linamaanisha nyaraka za mawasiliano zilizotumwa katika milki; “barua” ni tafsiri ya kawaida na wazi.
- source_word: אֶל כָּל הַיְּהוּדִים
  choice: kwa Wayahudi wote
  rationale: Kirai hiki kinawahusu kwa ujumla Wayahudi waliotawanyika katika milki yote.
- source_word: אֶל שֶׁבַע וְעֶשְׂרִים וּמֵאָה מְדִינָה
  choice: katika majimbo mia moja ishirini na saba
  rationale: Kihusishi cha pili kinaonyesha maeneo walimokuwako wapokeaji; “katika” huepuka kudokeza kwamba majimbo yenyewe ndiyo yaliyoandikiwa.
- source_word: מְדִינָה
  choice: majimbo
  rationale: Katika kitabu cha Esta, neno hili linataja maeneo ya kiutawala ndani ya Milki ya Uajemi.
- source_word: מַלְכוּת אֲחַשְׁוֵרוֹשׁ
  choice: ufalme wa Ahasuero
  rationale: Hii inafuata kwa karibu muundo wa Kiebrania bila kuongeza cheo cha “Mfalme,” ambacho hakipo wazi katika kirai hiki.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasuero
  rationale: Jina limeandikwa kwa umbo la Kiswahili linalowakilisha jina la Kiebrania, badala ya kulibadilisha kuwa utambulisho wa kihistoria unaopendekezwa.
- source_word: דִּבְרֵי שָׁלוֹם וֶאֱמֶת
  choice: maneno ya amani na kweli
  rationale: Tafsiri hii huhifadhi usemi halisi na rasmi wa Kiebrania. “Kweli” ni kisawe cha moja kwa moja, huku maana ya uaminifu au kutegemeka ikibaki kuwa uwezekano.
