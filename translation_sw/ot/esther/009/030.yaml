translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye hadhi na unaoeleweka kwa urahisi. “Zikiwa na” linaunganisha kwa kawaida barua na yaliyomo, huku tanbihi ikihifadhi umbo halisi la Kiebrania. Alama za tanbihi zimepangwa upya ili kila moja ifuate neno au kirai inachofafanua.
