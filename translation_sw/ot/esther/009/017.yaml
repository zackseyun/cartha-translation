  text: on the thirteenth day of the month of Adar[a], and resting on the fourteenth day of it[b], and making it a day of feasting and gladness.
translation:
  language: sw
  text: Siku ya kumi na tatu ya mwezi wa Adari, nao wakapumzika siku ya kumi na nne ya mwezi huo[a] na kuifanya kuwa siku ya karamu na furaha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, siku ya kumi na nne ya mwezi wa Adari.
    reason: cultural_note
lexical_decisions:
- source_word: בְּיוֹם שְׁלֹשָׁה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: Siku ya kumi na tatu ya mwezi wa Adari
  rationale: Muundo huu wa kawaida wa Kiswahili unawakilisha fomula ya tarehe ya Kiebrania; namba kuu ya Kiebrania ina kazi ya namba ya mpangilio katika muktadha huu.
- source_word: וְנוֹחַ
  choice: wakapumzika
  rationale: Kitenzi נוח hapa kinaonyesha kuacha mapigano na kupata pumziko. Wingi unaeleweka kutokana na watu waliotajwa katika muktadha uliotangulia.
- source_word: בְּאַרְבָּעָה עָשָׂר בּוֹ
  choice: siku ya kumi na nne ya mwezi huo
  rationale: Kiwakilishi בּוֹ kinarejelea mwezi wa Adari; kulitaja wazi kama ‘mwezi huo’ ni Kiswahili cha asili na huondoa utata wa kisarufi bila kuongeza taarifa mpya.
- source_word: וְעָשֹׂה אֹתוֹ
  choice: na kuifanya kuwa
  rationale: Infinitivu kamili ya Kiebrania inaendeleza mfululizo wa vitendo; Kiswahili hutumia kwa kawaida ‘na kuifanya’ baada ya kitenzi kikuu. Maana ya kuitenga au kuiadhimisha siku inadokezwa bila kuongeza neno la kimadhehebu.
- source_word: יוֹם מִשְׁתֶּה
  choice: siku ya karamu
  rationale: מִשְׁתֶּה ni karamu au sherehe yenye chakula na vinywaji; ‘karamu’ ni neno la sasa, lenye hadhi, na linaloeleweka kwa upana.
- source_word: וְשִׂמְחָה
  choice: na furaha
  rationale: ‘Furaha’ ni tafsiri ya kawaida na ya asili ya שִׂמְחָה, ikihifadhi hali ya shangwe ya siku hiyo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri imeunganisha vipashio vya Kiebrania kuwa sentensi kamili ya Kiswahili huku ikihifadhi mfuatano wa tarehe, pumziko, karamu na furaha.
