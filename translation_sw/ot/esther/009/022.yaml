source:
  edition: WLC
  text: כַּ/יָּמִ֗ים אֲשֶׁר נָ֨חוּ בָ/הֶ֤ם הַ/יְּהוּדִים֙ מֵ/א֣וֹיְבֵי/הֶ֔ם וְ/הַ/חֹ֗דֶשׁ אֲשֶׁר֩ נֶהְפַּ֨ךְ לָ/הֶ֤ם מִ/יָּגוֹן֙ לְ/שִׂמְחָ֔ה וּ/מֵ/אֵ֖בֶל לְ/י֣וֹם ט֑וֹב לַ/עֲשׂ֣וֹת אוֹתָ֗/ם יְמֵי֙ מִשְׁתֶּ֣ה וְ/שִׂמְחָ֔ה וּ/מִשְׁל֤וֹחַ מָנוֹת֙ אִ֣ישׁ לְ/רֵעֵ֔/הוּ וּ/מַתָּנ֖וֹת לָֽ/אֶבְיוֹנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/022.yaml
  text: as the days on which the Jews had rest from their enemies[a], and as the month that had been turned for them from sorrow to gladness and from mourning to a good day, to make them days of feasting and gladness, and of sending portions, each man to his neighbor[c][b], and gifts to the poor.
translation:
  language: sw
  text: kama siku ambazo Wayahudi walipata pumziko kutoka kwa adui zao, na kama mwezi ambao uligeuzwa kwao kutoka huzuni kuwa furaha, na kutoka maombolezo kuwa siku ya sherehe,[a] ili wazifanye kuwa siku za karamu na furaha, za kupelekeana mafungu,[b] kila mtu kwa mwenzake,[c] na za kuwapa maskini zawadi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno kwa neno, “siku njema”; pia yaweza kutafsiriwa “siku ya furaha.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania husema “kutuma mafungu”; yaelekea ni mafungu ya chakula yaliyotolewa kama zawadi za sherehe.
    reason: cultural_note
  - marker: c
    text: Neno kwa neno, “mtu kwa mwenzake”; huu ni usemi wa kumaanisha kila mtu kumtumia au kumpa mwenzake.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחוּ מֵאֹיְבֵיהֶם
  choice: walipata pumziko kutoka kwa adui zao
  rationale: Kitenzi נוח kinaonyesha kupata pumziko au nafuu baada ya tishio; usemi huu wa Kiswahili ni wa kawaida na huhifadhi wazo la kutenganishwa na mashambulizi ya adui.
- source_word: נֶהְפַּךְ
  choice: uligeuzwa
  rationale: Huhifadhi hali tendwa ya Niphal na wazo la mabadiliko makubwa ya hali.
- source_word: מִיָּגוֹן לְשִׂמְחָה
  choice: kutoka huzuni kuwa furaha
  rationale: Jozi hii ni ya asili katika Kiswahili na huhifadhi utofautishaji wa kihisia wa Kiebrania.
- source_word: וּמֵאֵבֶל לְיוֹם טוֹב
  choice: na kutoka maombolezo kuwa siku ya sherehe
  rationale: Maombolezo hutofautisha אֵבֶל na huzuni ya יָגוֹן; 'siku ya sherehe' huwasilisha maana ya kimuktadha ya יום טוב kwa Kiswahili cha sasa.
- source_word: לַעֲשׂוֹת אוֹתָם
  choice: ili wazifanye kuwa
  rationale: Muundo wa kusudi unaendeleza maana ya infinitivu ya Kiebrania huku ukibainisha rejeo la siku hizo.
- source_word: יְמֵי מִשְׁתֶּה וְשִׂמְחָה
  choice: siku za karamu na furaha
  rationale: '''Karamu'' huonyesha sherehe yenye chakula bila kusisitiza kupita kiasi unywaji.'
- source_word: וּמִשְׁלוֹחַ מָנוֹת
  choice: za kutumiana mafungu ya chakula
  rationale: מָנוֹת ni mafungu, na katika desturi hii yanaeleweka kuwa mafungu ya chakula; 'kutumiana' huwasilisha utoaji wa pande mbalimbali.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: kila mtu na mwenzake
  rationale: Huu ni usemi wa mgawanyo unaomaanisha watu kupeana wao kwa wao. Kiswahili 'kila mtu na mwenzake' ni cha kawaida na hakiongezi kizuizi cha kijinsia kisicholengwa na nahau.
- source_word: וּמַתָּנוֹת לָאֶבְיוֹנִים
  choice: na za kuwapa maskini zawadi
  rationale: Huhifadhi mkazo wa kijamii wa kutoa zawadi kwa watu maskini au wenye uhitaji.
theological_decisions:
- issue: Usemi wa kiume wa mgawanyo אִישׁ לְרֵעֵהוּ
  choice: kila mtu na mwenzake
  alternative: kila mwanamume na jirani yake
  rationale: Katika muktadha huu אִישׁ...רֵעֵהוּ hufanya kazi kama nahau ya ugawaji wa pamoja, si amri inayowahusu wanaume pekee. Tafsiri iliyochaguliwa huhifadhi upeo huo bila kufuta maana ya mtu mmoja mmoja.
- issue: Maana ya יום טוב
  choice: siku ya sherehe
  alternative: siku njema
  rationale: Ingawa maana ya neno kwa neno ni 'siku njema,' muktadha wa karamu na furaha unaonyesha siku ya kusherehekea. Tanbihi huhifadhi tafsiri halisi kama uwezekano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mrefu wa mstari umehifadhiwa kwa mtiririko unaosomeka; istilahi za sherehe na utoaji zimewekwa wazi bila kuingiza desturi au fundisho la dhehebu.
