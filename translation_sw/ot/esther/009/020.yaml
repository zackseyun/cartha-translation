translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Tanbihi imewekwa baada ya “mambo haya,” ambako utata wa Kiebrania unatokea.
