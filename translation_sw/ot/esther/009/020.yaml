base_translation:
  language: en
  yaml_path: translation/ot/esther/009/020.yaml
  text: Then Mordecai wrote these things and sent letters to all the Jews who were in all the provinces of King Ahasuerus[a], both near and far.
translation:
  language: sw
  text: Kisha Mordekai akaandika mambo haya[a] akatuma barua kwa Wayahudi wote waliokuwa katika majimbo yote ya Mfalme Ahasuero, waliokuwa karibu na waliokuwa mbali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maneno haya.” Neno hili la Kiebrania linaweza kurejelea mambo au matukio yaliyosimuliwa, au maneno ambayo Mordekai aliandika kuyahusu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: akaandika
  rationale: Kitenzi כתב kinamaanisha kuandika; muundo wa “aka-” unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: mambo haya
  rationale: דְּבָרִים inaweza kumaanisha maneno, mambo, au matukio. “Mambo haya” inadumisha upana wa maana na inaweza kurejelea yaliyosimuliwa pamoja na yale Mordekai aliyoandika.
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: na kutuma barua
  rationale: Katika muktadha huu wa kiutawala, סְפָרִים ni mawasiliano yaliyoandikwa; “barua” ni neno la kawaida na linalofaa kwa mazingira hayo.
- source_word: כָּל הַיְּהוּדִים
  choice: Wayahudi wote
  rationale: Hii ni tafsiri ya moja kwa moja ya jumuiya yote ya Wayahudi inayotajwa.
- source_word: בְּכָל מְדִינוֹת
  choice: katika majimbo yote
  rationale: מְדִינוֹת hurejelea maeneo ya kiutawala ya dola; “majimbo” ni sawia ya wazi katika Kiswahili.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: ya Mfalme Ahasuero
  rationale: Mpangilio huu ni wa asili katika Kiswahili, na jina la mfalme limetoholewa kwa namna iliyozoeleka.
- source_word: הַקְּרוֹבִים וְהָרְחוֹקִים
  choice: waliokuwa karibu na waliokuwa mbali
  rationale: Vivumishi hivi vinawataja Wayahudi wa maeneo ya karibu na ya mbali, na hivyo kuonyesha kuenea kwao katika dola yote.
- source_word: וַ
  choice: Kisha
  rationale: Kiunganishi cha simulizi kinaonyesha hatua inayofuata; “Kisha” huwasilisha mfuatano huo kwa Kiswahili cha kisasa.
