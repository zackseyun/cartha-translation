base_translation:
  language: en
  yaml_path: translation/ot/esther/009/031.yaml
  text: to establish these days of Purim at their appointed times[a], just as Mordecai the Jew and Esther the queen had established for them[b], and just as they had established for themselves and for their offspring the matters of the fasts and their cry.
translation:
  language: sw
  text: ili kuthibitisha siku hizi za Purimu katika nyakati zake zilizowekwa[a], kama vile Mordekai Myahudi na Esta malkia walivyoweka wajibu huo juu yao, na kama wao wenyewe walivyojiwekea wenyewe na wazao wao mambo yahusuyo mifungo na kilio chao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuziweka imara.” Kitenzi cha Kiebrania kinaonyesha kuzirasimisha au kuzifanya siku hizo ziwe desturi ya kudumu.
    reason: lexical_alternative
  - marker: b
    text: “Kilio chao” kinaweza pia kutafsiriwa “kilio chao cha kuomba msaada” au “maombolezo yao.” Huenda ni vilio vya jumuiya vilivyohusiana na mifungo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקַיֵּם
  choice: kuthibitisha
  rationale: Katika piel, קים hapa ina wazo la kufanya jambo lisimame kwa uthabiti au kulirasimisha. “Kuthibitisha” linafaa kwa kuwekwa rasmi kwa siku za Purimu bila kulitafsiri mapema kuwa tu kuzishika.
- source_word: יְמֵי הַפֻּרִים הָאֵלֶּה
  choice: siku hizi za Purimu
  rationale: Muundo huu wa kawaida unahifadhi kiashiria “hizi” na kutaja sikukuu inayozungumziwa.
- source_word: בִּזְמַנֵּיהֶם
  choice: katika nyakati zake zilizowekwa
  rationale: זְמָן ni wakati uliowekwa au uliopangwa. Kiswahili hiki kinaonyesha kuwa siku hizo zilipaswa kuadhimishwa kwa ratiba maalumu.
- source_word: כַּאֲשֶׁר קִיַּם עֲלֵיהֶם
  choice: kama vile ... walivyowawekea
  rationale: Kitenzi pamoja na עַל kinaonyesha kuwa utaratibu uliwekwa juu ya jumuiya. “Walivyowawekea” ni cha asili na hakiongezi wazo la kulazimisha kwa nguvu.
- source_word: מָרְדֳּכַי הַיְּהוּדִי
  choice: Mordekai Myahudi
  rationale: “Myahudi” ndilo jina la kawaida la kikabila katika Kiswahili na linafaa katika muktadha wa Esta.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: Esta malkia
  rationale: Huhifadhi mpangilio wa kiambatisho katika Kiebrania huku likibaki wazi na lenye hadhi kwa Kiswahili.
- source_word: וְכַאֲשֶׁר קִיְּמוּ עַל נַפְשָׁם וְעַל זַרְעָם
  choice: na kama wao wenyewe walivyojifungamanisha pamoja na wazao wao
  rationale: Muundo wa קים pamoja na עַל־נפשם unaonyesha kujitwika wajibu. “Walivyojifungamanisha” huwasilisha maana hiyo ya hiari na wajibu bila kulazimisha urudiaji usio wa asili wa “kuthibitisha.”
- source_word: זַרְעָם
  choice: wazao wao
  rationale: Katika muktadha huu זֶרַע humaanisha vizazi vinavyotokana nao; “wazao wao” ni wazi na ya kawaida.
- source_word: דִּבְרֵי הַצֹּמוֹת וְזַעֲקָתָם
  choice: mambo ya mifungo na kilio chao
  rationale: דִּבְרֵי inaweza kumaanisha mambo yanayohusu jambo fulani; צֹמוֹת ni mifungo, na זַעֲקָה ni kilio cha nguvu. Tafsiri haikifanyi kilio hicho kuwa sala au maombolezo pekee.
