  text: וּ/מַאֲמַ֣ר אֶסְתֵּ֔ר קִיַּ֕ם דִּבְרֵ֥י הַ/פֻּרִ֖ים הָ/אֵ֑לֶּה וְ/נִכְתָּ֖ב בַּ/סֵּֽפֶר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/032.yaml
  text: And Esther’s command confirmed these matters of Purim[b][a], and it was written in the book.
translation:
  language: sw
  text: Amri ya Esta ilithibitisha mambo haya ya Purimu[a], nayo ikaandikwa katika kitabu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maneno kuhusu maadhimisho haya ya Purimu.” Neno la Kiebrania linalotafsiriwa “mambo” linaweza pia kumaanisha “maneno” au “shughuli” katika muktadha wa kiutawala.
    reason: lexical_alternative
  - marker: b
    text: Au, “nayo ikawekwa katika kumbukumbu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲמַר
  choice: amri
  rationale: Katika muktadha huu neno hilo linaonyesha agizo rasmi lenye mamlaka la Esta, si kauli ya kawaida tu.
- source_word: אֶסְתֵּר
  choice: Esta
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: קִיַּם
  choice: ilithibitisha
  rationale: Kitenzi kina maana ya kufanya jambo lisimame au liwe imara; ‘ilithibitisha’ kinafaa katika muktadha wa kuidhinisha rasmi maadhimisho ya Purimu.
- source_word: דִּבְרֵי
  choice: mambo
  rationale: Neno la Kiebrania linaweza kumaanisha maneno, mambo, au shughuli; hapa ‘mambo’ linaeleza kwa kawaida masharti na taratibu zinazohusu Purimu bila kuyafungia kwenye kauli zilizotamkwa.
- source_word: הַפֻּרִים
  choice: Purimu
  rationale: Jina la sikukuu limehifadhiwa kwa umbo la Kiswahili linalotambulika.
- source_word: הָאֵלֶּה
  choice: haya
  rationale: Kionyeshi kimehifadhiwa ili kubainisha mambo ya Purimu yaliyotajwa.
- source_word: וְנִכְתָּב
  choice: nayo ikaandikwa
  rationale: Kauli tendwa ya Kiebrania imetafsiriwa moja kwa moja; ‘ikaandikwa’ haiongezi maelezo kuhusu mwandishi au aina ya kumbukumbu.
- source_word: בַּסֵּפֶר
  choice: katika kitabu
  rationale: סֵפֶר linaweza kuwa kitabu, hati-kunjo, au kumbukumbu iliyoandikwa. ‘Katika kitabu’ ni tafsiri ya moja kwa moja isiyobainisha kitabu ambacho mstari wenyewe haukitaji.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya kawaida lakini yenye hadhi. Muundo umehifadhi ufupi na mtindo rasmi wa taarifa ya Kiebrania, bila kubainisha zaidi rejeleo la kiwakilishi ‘nayo’ au utambulisho wa kitabu.
