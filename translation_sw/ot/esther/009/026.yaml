base_translation:
  language: en
  yaml_path: translation/ot/esther/009/026.yaml
  text: Therefore they called these days Purim[a], after the name of Pur. Therefore, because of all the words of this letter, and what they had seen concerning this matter, and what had happened to them[b],
translation:
  language: sw
  text: Kwa hiyo wakaziita siku hizo Purimu[a], kwa jina la Puri. Kwa hiyo, kwa sababu ya maneno yote ya barua hii, na yale waliyoyaona kuhusu jambo hilo, na yale yaliyowapata[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “baada ya Puri.” Kiebrania kihalisi ni “kwa jina la Puri.”
    reason: lexical_alternative
  - marker: b
    text: Au “na yale yaliyowajia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ לַיָּמִים הָאֵלֶּה
  choice: wakaziita siku hizo
  rationale: Kitenzi קרא katika muktadha wa kutoa jina kimetafsiriwa kwa Kiswahili asilia kama ‘kuita’; ‘siku hizo’ hurejelea siku maalumu za sikukuu zilizotajwa katika muktadha.
- source_word: פוּרִים
  choice: Purimu
  rationale: Jina la sikukuu limetoholewa kwa mwandiko na matamshi yanayofaa Kiswahili huku likibaki jina maalumu.
- source_word: עַל שֵׁם הַפּוּר
  choice: kutokana na jina Puri
  rationale: Huhifadhi kiunganishi cha wazi kati ya jina la sikukuu na neno la msingi פּוּר, sambamba na usemi wa Kiebrania ‘kwa jina la’.
- source_word: הַפּוּר
  choice: Puri
  rationale: Neno la mkopo limehifadhiwa hapa kwa kuwa kifungu kinaeleza chimbuko la jina Purimu; maana yake ya ‘kura’ hutolewa katika muktadha uliotangulia.
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Huwakilisha nguvu ya kisababishi na hitimisho, na marudio yake mara mbili katika Kiebrania yamehifadhiwa.
- source_word: עַל כָּל דִּבְרֵי הָאִגֶּרֶת הַזֹּאת
  choice: kwa sababu ya maneno yote ya barua hii
  rationale: ‘Maneno yote’ hubaki karibu na דִּבְרֵי, huku ‘kwa sababu ya’ ikionyesha matumizi ya kisababishi ya עַל.
- source_word: וּמָה רָאוּ עַל כָּכָה
  choice: na yale waliyoyaona kuhusu jambo hilo
  rationale: Huhifadhi maana halisi ya ‘kuona’ bila kuzuia maana pana ya kushuhudia au kutambua, na hutafsiri עַל כָּכָה kwa Kiswahili cha kawaida.
- source_word: וּמָה הִגִּיעַ אֲלֵיהֶם
  choice: na yale yaliyowapata
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha maana ya jambo kuwajia au kuwapata, bila kuongeza maelezo yasiyomo katika Kiebrania.
