base_translation:
  language: en
  yaml_path: translation/ot/esther/009/012.yaml
  text: Then the king said to Esther the queen[a], “In Susa the citadel the Jews have killed and destroyed five hundred men, along with the ten sons of Haman. What then have they done in the rest of the king’s provinces? Now what is your petition? It will be granted to you. And what is your further request? It will be done.”
translation:
  language: sw
  text: Kisha mfalme akamwambia Malkia Esta, “Katika ngome ya Shushani, Wayahudi wameua na kuangamiza wanaume mia tano, pamoja na wana kumi wa Hamani. Basi wamefanya nini katika majimbo yaliyobaki ya mfalme?[a] Sasa ombi lako ni nini? Utapewa. Na ombi lako lingine ni nini? Litatekelezwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wamefanya nini katika majimbo yaliyobaki ya mfalme?” Swali la Kiebrania linaweza kusomwa kwa namna hii iliyo ya moja kwa moja zaidi; “Basi” katika matini kuu linaonyesha hitimisho la mfalme kutokana na taarifa ya mambo yaliyotokea Shushani.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: Katika ngome ya Shushani
  rationale: בִּירָה humaanisha kituo cha kifalme chenye ulinzi au ngome; “ngome ya Shushani” ni ya asili katika Kiswahili na inaweka wazi mazingira ya kifalme.
- source_word: הָרְגוּ ... וְאַבֵּד
  choice: wameua na kuangamiza
  rationale: Vitenzi vyote viwili vimetafsiriwa ili kuhifadhi msisitizo wa mkusanyiko uliomo katika Kiebrania.
- source_word: חֲמֵשׁ מֵאוֹת אִישׁ
  choice: wanaume mia tano
  rationale: אִישׁ baada ya namba imetumiwa kwa maana ya kila mmoja; “wanaume” ni tafsiri ya moja kwa moja na inafaa katika muktadha huu wa mapambano.
- source_word: וְאֵת עֲשֶׂרֶת בְּנֵי הָמָן
  choice: pamoja na wana kumi wa Hamani
  rationale: “Pamoja na” inaonyesha wazi kuwa wana wa Hamani ni kitu kingine kilichoongezwa katika taarifa ya waliouawa.
- source_word: בִּשְׁאָר מְדִינוֹת הַמֶּלֶךְ
  choice: katika majimbo mengine ya mfalme
  rationale: “Majimbo” linafaa kwa vitengo vya utawala katika milki ya Uajemi, na “mengine” linawasilisha maana ya sehemu iliyobaki.
- source_word: מֶה עָשׂוּ
  choice: Basi wamefanya nini
  rationale: “Basi” linadokeza hitimisho la mfalme kutokana na habari za Shushani bila kulifanya hitimisho hilo kuwa dhahiri kupita kiasi; uwezekano wa kusoma swali moja kwa moja umewekwa katika tanbihi.
- source_word: שְּׁאֵלָתֵךְ
  choice: ombi lako
  rationale: Katika mazingira ya ikulu, שְׁאֵלָה ni ombi rasmi linalowasilishwa kwa mfalme; “ombi” ni la kawaida, lenye heshima, na halina maana ya lazima ya kidini hapa.
- source_word: וְיִנָּתֵן לָךְ
  choice: Utapewa
  rationale: Kauli hii fupi huhifadhi muundo wa kutendwa wa Kiebrania na maana ya kwamba Esta atapewa analoomba.
- source_word: בַּקָּשָׁתֵךְ עוֹד
  choice: jambo gani zaidi unaloomba
  rationale: Muundo huu wa asili katika Kiswahili unatofautisha kwa kiasi usemi huu na “ombi lako,” huku “zaidi” ikiwakilisha עוֹד kama ombi la nyongeza.
- source_word: וְתֵעָשׂ
  choice: Litatekelezwa
  rationale: “Litatekelezwa” linaonyesha kwamba jambo atakaloomba Esta litafanywa, huku likihifadhi maana ya kutendwa.
