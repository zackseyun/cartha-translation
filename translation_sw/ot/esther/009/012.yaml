translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wenye heshima, na unaoeleweka kwa wasomaji wa kawaida. Majina “Esta,” “Shushani,” na “Hamani” yanafuata maumbo yaliyozoeleka katika Biblia za Kiswahili. Marudio ya kauli za mfalme yamehifadhiwa, lakini kisawe cha pili kimewasilishwa kwa muundo wa kawaida wa Kiswahili ili kuepuka uradidi mgumu.
