base_translation:
  language: en
  yaml_path: translation/ot/esther/009/001.yaml
  text: 'In the twelfth month[a], that is, the month Adar, on the thirteenth day of it, when the king’s word and his decree were to be carried out, on the day when the enemies of the Jews had hoped to rule over them, the opposite happened: the Jews themselves ruled over those who hated them.'
translation:
  language: sw
  text: 'Katika mwezi wa kumi na mbili, yaani mwezi wa Adari, siku yake ya kumi na tatu, wakati wa neno la mfalme na amri yake kutekelezwa ulipowadia, siku ambayo maadui wa Wayahudi walikuwa wametumaini kuwatawala, hali ikageuka[a]: Wayahudi wenyewe wakawatawala wale waliowachukia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hali iligeuzwa” au “hali ikabadilishwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנֵים עָשָׂר חֹדֶשׁ
  choice: Katika mwezi wa kumi na mbili
  rationale: Hutoa wakati wa tukio kwa Kiswahili cha kawaida; kiunganishi ו hakihitaji kutafsiriwa kwa neno la ziada mwanzoni.
- source_word: הוּא חֹדֶשׁ אֲדָר
  choice: yaani mwezi wa Adari
  rationale: Neno “yaani” linatoa ufafanuzi wa kiambatisho unaoutambulisha mwezi wa kumi na mbili.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר יוֹם בּוֹ
  choice: siku yake ya kumi na tatu
  rationale: Kiwakilishi “yake” kinadumisha rejeo la wazi kwa mwezi.
- source_word: אֲשֶׁר הִגִּיעַ דְּבַר הַמֶּלֶךְ וְדָתוֹ לְהֵעָשׂוֹת
  choice: wakati wa kutekeleza neno la mfalme na amri yake ulipowadia
  rationale: “Ulipowadia” huonyesha kufika kwa wakati uliowekwa, huku “neno” na “amri” zikidumisha utofauti wa דָּבָר na דָּת.
- source_word: שִׂבְּרוּ
  choice: walikuwa wametumaini
  rationale: Huonyesha tumaini au matarajio ya awali ya maadui kabla ya hali kugeuka.
- source_word: לִשְׁלֹט בָּהֶם
  choice: kuwatawala
  rationale: Hutoa moja kwa moja wazo la kutumia mamlaka juu yao.
- source_word: וְנַהֲפוֹךְ הוּא
  choice: mambo yakageuka
  rationale: Ni usemi wa asili unaoonyesha mgeuko mkubwa wa hali bila kuufanya kuwa maelezo ya ziada.
- source_word: אֲשֶׁר יִשְׁלְטוּ הַיְּהוּדִים הֵמָּה
  choice: Wayahudi wenyewe wakawatawala
  rationale: “Wenyewe” inadumisha msisitizo wa הֵמָּה na tofauti kati ya matarajio ya maadui na yaliyotokea.
- source_word: בְּשֹׂנְאֵיהֶם
  choice: wale waliowachukia
  rationale: Inadumisha nguvu ya kitenzi katika umbo la Kiebrania badala ya kulifanya tu jina “maadui.”
