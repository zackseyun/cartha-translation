  text: Then the king said[a], "Hurry, bring Haman, so that Esther's word may be done." So the king and Haman came to the banquet that Esther had prepared.
translation:
  language: sw
  text: Ndipo mfalme akasema, “Fanyeni haraka, mleteni Hamani ili ombi la Esta litekelezwe.” Basi mfalme na Hamani wakaenda kwenye karamu ambayo Esta alikuwa ameiandaa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַהֲרוּ אֶת הָמָן
  choice: Fanyeni haraka, mleteni Hamani
  rationale: Kitenzi ni amri ya wingi inayoelekezwa kwa wahudumu na kudai hatua ya haraka kumhusu Hamani. Kiswahili hiki kinaweka wazi tendo linalodokezwa na muktadha bila kupoteza uzito wa amri.
- source_word: לַעֲשׂוֹת אֶת דְּבַר אֶסְתֵּר
  choice: ili ombi la Esta litekelezwe
  rationale: Neno דָּבָר linaweza kumaanisha neno, jambo, au kauli; katika mazingira haya linarejelea alichotaka Esta kifanyike. “Ombi” ni la kawaida na wazi kwa Kiswahili, huku “litekelezwe” likihifadhi maana ya kufanya alilolisema.
- source_word: וַיָּבֹא
  choice: wakaenda
  rationale: Kitenzi בוא kinaweza kutafsiriwa ‘kuja’ au ‘kwenda’ kulingana na mtazamo wa simulizi. Kwa kuwa mahali walipokuwa wanaelekea pametajwa, “wakaenda kwenye karamu” ni usemi wa kawaida wa Kiswahili.
- source_word: הַמִּשְׁתֶּה
  choice: karamu
  rationale: מִשְׁתֶּה ni sherehe ya chakula na vinywaji. “Karamu” ni neno la kawaida, lenye heshima, na linalofaa mazingira ya kifalme.
- source_word: אֲשֶׁר עָשְׂתָה אֶסְתֵּר
  choice: aliyokuwa ameiandaa Esta
  rationale: עשה ikitumiwa kuhusu karamu humaanisha kuiandaa. Muundo huu wa wakati unaonyesha wazi kwamba Esta alikuwa ameiandaa kabla hawajafika.
