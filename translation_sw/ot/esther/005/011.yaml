  yaml_path: translation/ot/esther/005/011.yaml
  text: And Haman told them of the glory of his wealth[a], and the multitude of his sons, and all that the king had done to make him great[d][c][b], and how he had exalted him above the officials and servants of the king.
translation:
  language: sw
  text: Hamani akawaambia juu ya utukufu wa utajiri wake[a], wanawe wa kiume wengi[b], mambo yote ambayo mfalme alikuwa amefanya ili kumfanya mkuu[c], na jinsi alivyomwinua juu ya maafisa na watumishi wa mfalme[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utukufu wa mali zake.” Kifungu cha Kiebrania hukazia fahari au utukufu unaohusishwa na utajiri wa Hamani.
    reason: lexical_alternative
  - marker: b
    text: Au, “wanawe wa kiume wengi.” Kiebrania kinasema hasa “wana wa kiume,” si watoto kwa ujumla.
    reason: lexical_alternative
  - marker: c
    text: Au, “ili kumpandisha cheo.”
    reason: lexical_alternative
  - marker: d
    text: Au, “alivyompandisha juu ya” maafisa na watumishi wa mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: akawaeleza
  rationale: Kitenzi hiki cha usimulizi kinaonyesha kwamba Hamani aliwasimulia waliokuwapo mambo hayo; “akawaeleza” ni Kiswahili cha kawaida na huhifadhi maana ya kutoa maelezo.
- source_word: כְּבוֹד עָשְׁרוֹ
  choice: fahari ya utajiri wake
  rationale: כָּבוֹד pamoja na עֹשֶׁר huonyesha fahari, utukufu, au mvuto wa utajiri wake. “Fahari ya utajiri wake” ni ya asili katika Kiswahili na hudokeza kujivunia na kuonyesha utajiri huo.
- source_word: רֹב בָּנָיו
  choice: wanawe wengi wa kiume
  rationale: רֹב huonyesha wingi, na בָּנָיו humaanisha wana wa kiume hasa. Ufafanuzi “wa kiume” unaondoa utata unaoweza kuwapo katika neno la Kiswahili “wanawe.”
- source_word: גִּדְּלוֹ
  choice: kumfanya mkuu
  rationale: Piel ya גדל hapa ina maana ya kumkuza, kumpa ukuu, au kumpandisha cheo. “Kumfanya mkuu” huhifadhi muundo wa kisababishi na tendo la mfalme bila kupunguza maana kuwa kupandishwa cheo pekee.
- source_word: נִשְּׂאוֹ עַל
  choice: alivyomwinua juu ya
  rationale: נשא pamoja na עַל hapa hueleza kuinuliwa kwa hadhi kuliko wengine. “Kumwinua juu ya” huhifadhi taswira ya Kiebrania na ulinganisho wa cheo.
- source_word: הַשָּׂרִים
  choice: maafisa
  rationale: Katika mazingira ya ikulu ya Uajemi, שָׂרִים ni wenye mamlaka au maafisa; “maafisa” ni wazi kwa msomaji wa sasa bila kudokeza lazima kwamba walikuwa wakuu wa kifalme kwa urithi.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: watumishi wa mfalme
  rationale: Katika muktadha huu, עֲבָדִים ni watu waliokuwa katika utumishi wa mfalme au ikulu. “Watumishi wa mfalme” ni wazi na haibani maana kwa wahudumu wa karibu pekee.
