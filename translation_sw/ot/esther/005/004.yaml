lexical_decisions:
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  choice: Kama mfalme akiona ni vema
  rationale: Hii ni nahau ya heshima inayotanguliza ombi kwa mfalme. Tafsiri hii ni ya kawaida katika Kiswahili, inadumisha mtindo wa heshima wa ikulu, na kubakiza maana ya טוֹב, ‘vema.’
- source_word: יָבֹוא
  choice: na waje
  rationale: Ingawa kimaumbo ni kitenzi cha nafsi ya tatu umoja, katika muktadha huu kina nguvu ya ombi au mwaliko. ‘Na waje’ huwasilisha ombi hilo la heshima kwa namna ya asili.
- source_word: הַמֶּלֶךְ וְהָמָן
  choice: mfalme na Hamani
  rationale: Kama Kiebrania, tafsiri inarudia cheo ‘mfalme’ na haitaji jina lake lisilokuwamo katika mstari huu.
- source_word: הַיּוֹם
  choice: leo
  rationale: ‘Leo’ ni tafsiri ya moja kwa moja na ya kawaida, inayodumisha uharaka wa mwaliko.
- source_word: הַמִּשְׁתֶּה
  choice: karamu
  rationale: מִשְׁתֶּה ni karamu au sherehe yenye chakula na vinywaji. ‘Karamu’ inafaa mazingira ya kifalme bila kusisitiza unywaji kuliko chanzo.
- source_word: אֲשֶׁר עָשִׂיתִי לוֹ
  choice: niliyomwandalia mfalme
  rationale: Katika muktadha wa karamu, עָשָׂה hutafsiriwa kwa kawaida ‘andaa.’ Kiwakilishi cha Kiebrania ni umoja wa kiume; kurudia ‘mfalme’ katika Kiswahili kunaondoa utata wa kisarufi usiokuwamo katika Kiebrania na kuhifadhi rejeo lake la kawaida kwa mfalme.
