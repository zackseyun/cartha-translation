translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ombi unaakisi adabu ya kifalme bila kutumia lugha ya kizamani. ‘Na waje’ inamtaja mfalme pamoja na Hamani kwa wingi, huku ‘niliyomwandalia mfalme’ ikihifadhi walengwa wa kiwakilishi cha umoja cha Kiebrania.
