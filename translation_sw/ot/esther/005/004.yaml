  text: Esta akasema, “Kama mfalme akiona kuwa ni vema, mfalme na Hamani waje leo kwenye karamu niliyomwandalia[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa ajili yake,” kwa umoja. Huenda ikimrejelea hasa mfalme, ingawa Hamani pia anaalikwa.'
