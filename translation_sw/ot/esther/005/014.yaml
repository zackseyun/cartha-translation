base_translation:
  language: en
  yaml_path: translation/ot/esther/005/014.yaml
  text: Then Zeresh his wife and all his friends said to him[a], “Let a gallows fifty cubits high be made, and in the morning tell the king to have Mordecai hanged on it. Then go with the king to the banquet rejoicing.” The matter pleased Haman[c][b], and he made the gallows.
translation:
  language: sw
  text: Ndipo Zereshi, mke wa Hamani, na marafiki zake wote wakamwambia, “Itengenezwe nguzo ya mbao[a] yenye kimo cha dhiraa hamsini.[b] Asubuhi umwambie mfalme wamning'inize Mordekai juu yake.[c] Kisha uende pamoja na mfalme kwenye karamu ukiwa na furaha.” Shauri hilo likampendeza Hamani, naye akaitengeneza nguzo hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mti” au “fito.” Neno la Kiebrania עֵץ linaweza kumaanisha mti, mbao, au kifaa cha mbao cha kuuawa; umbo lake kamili halijulikani kwa hakika.
    reason: lexical_alternative
  - marker: b
    text: Dhiraa hamsini ni takriban mita 23.
    reason: cultural_note
  - marker: c
    text: Au “wamdoboe Mordekai kwa nguzo hiyo.” Maneno ya Kiebrania yanaweza kurejelea kuning'inizwa au kutobolewa kwenye kifaa cha mbao; njia kamili ya kuuawa haijulikani kwa hakika.
    reason: alternative_reading
lexical_decisions:
- source_word: אֹהֲבָיו
  choice: marafiki zake
  rationale: Ingawa neno hilo kwa maana halisi ni ‘wale waliompenda,’ katika mazingira haya ya kifalme linamaanisha washirika au rafiki zake Hamani; ‘marafiki zake’ ni Kiswahili cha kawaida na cha asili.
- source_word: יַעֲשׂוּ
  choice: Itengenezwe
  rationale: Kitenzi cha wingi chenye mhusika asiyetajwa kinatoa pendekezo. Kauli tendwa ya Kiswahili inadumisha kutotajwa kwa watengenezaji na kusikika kwa kawaida.
- source_word: עֵץ
  choice: nguzo ya mbao
  rationale: Neno la Kiebrania linaweza kumaanisha mti, mbao, au kifaa cha mbao cha kuadhibia na kuonyesha mwili. ‘Nguzo ya mbao’ huepuka kudai bila hakika kwamba ilikuwa jukwaa la kunyongea lenye boriti.
- source_word: גָּבֹהַּ חֲמִשִּׁים אַמָּה
  choice: yenye kimo cha dhiraa hamsini
  rationale: Kipimo cha kale kimehifadhiwa katika matini, huku kadirio la kisasa likitolewa katika tanbihi.
- source_word: וּבַבֹּקֶר
  choice: Asubuhi
  rationale: Hili ni tamko la wakati lisilosema wazi ‘kesho,’ ingawa muktadha unaashiria asubuhi inayofuata.
- source_word: אֱמֹר לַמֶּלֶךְ
  choice: umwambie mfalme
  rationale: Huhifadhi maana ya moja kwa moja ya amri ‘mwambie mfalme’ bila kuingiza kitenzi cha kufasiri zaidi kama ‘mwombe.’
- source_word: וְיִתְלוּ אֶת־מָרְדֳּכַי עָלָיו
  choice: wamwangike Mordekai juu yake
  rationale: ‘Angika’ linaweza kueleza kuwekwa na kuachwa juu ya kifaa hicho bila kuamua kwa lazima kama njia ilikuwa kunyongwa kwa kamba au kuchomwa kwenye nguzo; tanbihi inaeleza uwezekano huo.
- source_word: מִשְׁתֶּה
  choice: karamu
  rationale: Neno hili linafaa kwa karamu ya kifalme na ni la kawaida katika Kiswahili sanifu.
- source_word: שָׂמֵחַ
  choice: ukiwa na furaha
  rationale: Kivumishi hiki kinatumika kueleza hali ya Hamani anapoenda karamuni.
- source_word: וַיִּיטַב הַדָּבָר לִפְנֵי הָמָן
  choice: Shauri hilo likampendeza Hamani
  rationale: Hii ni tafsiri ya kawaida ya nahau inayosema kwamba pendekezo hilo lilionekana jema au la kukubalika kwake.
- source_word: וַיַּעַשׂ הָעֵץ
  choice: naye akaitengeneza nguzo hiyo
  rationale: Inafuata kauli rahisi ya Kiebrania kwamba Hamani aliitengeneza, bila kuamua kama aliifanya mwenyewe au alisimamia itengenezwe.
theological_decisions:
- issue: Namna halisi ya kuuawa kwa Mordekai iliyopendekezwa
  choice: wamwangike Mordekai juu yake
  alternative: wamchome Mordekai kwenye nguzo hiyo / wamnyonge Mordekai juu yake
  rationale: Kiebrania אינהamui wazi kama tendo lilikuwa kunyongwa kwa kamba, kuchomwa kwenye nguzo, au kuangika kwa ajili ya kuonyesha mwili. Tafsiri kuu inadumisha hali hiyo ya kutokuwa na uhakika, na tanbihi inataja uwezekano muhimu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima lakini unaoeleweka kwa msomaji wa kawaida. ‘Itengenezwe’ hudumisha mhusika asiyeainishwa, na ‘nguzo ya mbao’ pamoja na ‘wamwangike’ hulinda utata halisi wa matini kuhusu umbo la kifaa na namna ya mauaji.
