  - severity: medium
    issue: 'Tanbihi c: “wamchome Mordekai kwenye nguzo hiyo”'
    rationale: Kwa Kiswahili, “kuchoma” kwa kawaida hueleweka kama kuchoma kwa moto. Uwezekano unaokusudiwa wa impalement unapaswa kusemwa kama “wamtoboe kwa nguzo hiyo” au kuelezwa kwa maneno wazi.
