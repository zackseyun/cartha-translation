  text: Then the king said to her[a], “What is it[c][b], Queen Esther? And what is your request? Up to half the kingdom—it will be given to you.”
translation:
  language: sw
  text: Ndipo mfalme akamwambia, “Ni nini, Malkia Esta?[a] Na ombi lako ni nini?[b] Utapewa hata nusu ya ufalme.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Una nini, Malkia Esta?” Nahau ya Kiebrania kwa tafsiri ya neno kwa neno ni, “Ni nini kwako?”
    reason: lexical_alternative
  - marker: b
    text: Au, “Na unachokiomba ni nini?”
    reason: lexical_alternative
  - marker: c
    text: Huu ulikuwa usemi wa kawaida wa kifalme wa kuonyesha ukarimu mkubwa; si lazima uwe ahadi halisi ya kugawanya ufalme.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר לָהּ הַמֶּלֶךְ
  choice: Ndipo mfalme akamwambia
  rationale: Muundo wa usimulizi unaendeleza tukio; ‘Ndipo’ na ‘akamwambia’ ni Kiswahili cha kawaida kinachohifadhi mfuatano na mlengwa wa maneno.
- source_word: מַה לָּךְ
  choice: Una shida gani
  rationale: Nahau ya Kiebrania, kihalisi ‘una nini/ni nini kwako,’ huuliza jambo linalomhusu au kumsumbua mtu. Tafsiri hii ni ya asili katika Kiswahili bila kudai kwamba alikuwa katika dhiki kali.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: Malkia Esta
  rationale: Kiswahili kwa kawaida huweka cheo kabla ya jina; maana na hadhi ya kifalme zimehifadhiwa.
- source_word: וּמַה בַּקָּשָׁתֵךְ
  choice: Na ombi lako ni nini?
  rationale: בַּקָּשָׁה ni ombi au dua rasmi. ‘Ombi’ ni wazi, la kisasa, na linafaa katika mazingira ya hadhara ya kifalme.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: Hata nusu ya ufalme
  rationale: ‘Hata’ huonyesha upeo wa ahadi ya mfalme na kuhifadhi mtindo wa usemi wa kifalme bila kuufanya kuwa mgawanyo halisi.
- source_word: וְיִנָּתֵן לָךְ
  choice: utapewa
  rationale: Kauli tendwa ya ahadi imetolewa kwa Kiswahili kifupi na cha kawaida. Kitu kitakachotolewa kinaeleweka kutokana na ombi lililotajwa.
