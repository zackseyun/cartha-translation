  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi inayofaa mazungumzo ya kifalme. Muundo ni wa asili kwa wasomaji wa kawaida, huku nahau ya Kiebrania na uzito wa ahadi vikihifadhiwa kupitia maelezo ya chini.
