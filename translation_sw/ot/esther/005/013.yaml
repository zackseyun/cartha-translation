lexical_decisions:
- source_word: וְ/כָל זֶה
  choice: Lakini hayo yote
  rationale: Kiunganishi וְ kinaweza kuwa ‘na,’ lakini hapa kina nguvu ya ulinganisho dhidi ya majivuno yaliyotangulia ya Hamani; ‘Lakini’ huonyesha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: אֵינֶנּוּ שֹׁוֶה לִי
  choice: hayana thamani yoyote kwangu
  rationale: Nahau hii inasema kuwa heshima hizo zote hazina maana au faida machoni pa Hamani. Usemi huu ni wa asili na unabaki karibu na maana ya kutokuwa na thamani.
- source_word: בְּ/כָל עֵת אֲשֶׁר
  choice: kila ninapomwona
  rationale: Kirai hiki kina maana ya tukio linalojirudia, ‘kila wakati ambapo’; muundo huu wa Kiswahili unawasilisha kwa ufupi nguvu hiyo ya kurudiwa.
- source_word: רֹאֶה
  choice: ninapomwona
  rationale: Kitenzi kishirikishi pamoja na אֲנִי kinaonyesha tendo la kuendelea au kujirudia; ‘ninapomwona’ linafaa ndani ya kishazi cha wakati.
- source_word: מָרְדֳּכַי
  choice: Mordekai
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: הַיְּהוּדִי
  choice: Myahudi
  rationale: Katika mazingira ya Uajemi ya kitabu cha Esta, neno hili hasa linatambulisha asili ya kikabila ya Mordekai; ‘Myahudi’ ni neno la kawaida na wazi katika Kiswahili.
- source_word: יוֹשֵׁב
  choice: ameketi
  rationale: Neno linaeleza mkao na mahali pa Mordekai. ‘Ameketi’ huhifadhi picha dhahiri ya Hamani kumwona akiwa hapo.
- source_word: בְּ/שַׁעַר הַמֶּלֶךְ
  choice: kwenye lango la mfalme
  rationale: Kirai kinarejelea eneo la lango la kifalme lililohusishwa na shughuli za utawala; ‘kwenye lango la mfalme’ ni cha asili na hakifafanui kupita chanzo.
