  text: וַ/יֹּ֨אמֶר הַ/מֶּ֤לֶךְ לְ/אֶסְתֵּר֙ בְּ/מִשְׁתֵּ֣ה הַ/יַּ֔יִן מַה שְּׁאֵלָתֵ֖/ךְ וְ/יִנָּ֣תֵֽן לָ֑/ךְ וּ/מַה בַּקָּשָׁתֵ֛/ךְ עַד חֲצִ֥י הַ/מַּלְכ֖וּת וְ/תֵעָֽשׂ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/006.yaml
  text: And the king said to Esther at the wine banquet[a], “What is your petition? It will be granted to you. And what is your request? Even up to half the kingdom[b], it will be done.”
translation:
  language: sw
  text: Mfalme akamwambia Esta wakati wa karamu ya divai, “Ombi lako ni nini? Utapewa. Na unataka nini? Hata kufikia nusu ya ufalme[a], litafanyika.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “nusu ya ufalme”; matini haisemi wazi “ufalme wangu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִשְׁתֵּה הַיַּיִן
  choice: wakati wa karamu ya divai
  rationale: מִשְׁתֶּה ni karamu yenye kunywa, na הַיַּיִן hutaja divai waziwazi; usemi huu ni wa kawaida na huhifadhi mazingira ya tukio.
- source_word: שְּׁאֵלָתֵךְ
  choice: ombi lako
  rationale: Hapa nomino hiyo ni jambo linaloombwa, si swali la kutaka habari. “Ombi” linafaa katika mazungumzo ya kifalme.
- source_word: וְיִנָּתֵן לָךְ
  choice: Utapewa
  rationale: Muundo wa Kiebrania una maana halisi ya ‘nalo utapewa’; Kiswahili hiki kifupi huhifadhi uhakikisho wa mfalme bila kulazimisha kitu kisichotajwa kuwa kiima.
- source_word: בַּקָּשָׁתֵךְ
  choice: unataka nini
  rationale: בַּקָּשָׁה hueleza jambo analolitafuta au kulitaka mtu. Muundo huu wa asili unatofautisha kwa kiasi na “ombi lako” bila kupotosha urudiaji wa kisanaa.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: Hata kufikia nusu ya ufalme
  rationale: Huhifadhi msisitizo wa kauli ya kifalme na pia kibainishi cha Kiebrania ‘ufalme,’ ambacho hakisemi wazi ‘ufalme wangu.’
- source_word: וְתֵעָשׂ
  choice: litafanyika
  rationale: Kitenzi hiki kinaeleza kuwa jambo analotaka Esta litatekelezwa; “litafanyika” huhifadhi usemi wa kutendwa na ahadi ya kifalme.
theological_decisions:
- issue: Uhusiano wa ‘nusu ya ufalme’ na mfalme
  choice: nusu ya ufalme
  alternative: nusu ya ufalme wangu
  rationale: Kiebrania hakina kiwakilishi cha umilikaji ‘wangu’; tafsiri haikiongezi, hivyo inadumisha namna halisi na uwezekano wa maana wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Karamu ya divai’ huhifadhi mazingira ya kifalme; kauli fupi ‘Utapewa’ na ‘litafanyika’ zinaakisi uhakikisho wa moja kwa moja wa mfalme.
