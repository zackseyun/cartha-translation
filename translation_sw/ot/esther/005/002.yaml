base_translation:
  language: en
  yaml_path: translation/ot/esther/005/002.yaml
  text: And when the king saw Esther the queen standing in the court[a], she found favor in his sight, and the king extended to Esther the golden scepter that was in his hand[c][b]. Then Esther came near and touched the top of the scepter.
translation:
  language: sw
  text: Ikawa, mfalme alipomwona Esta malkia amesimama uani[a], Esta akapata kibali machoni pa mfalme[b]. Mfalme akamnyoshea Esta fimbo ya kifalme ya dhahabu iliyokuwa mkononi mwake. Ndipo Esta akakaribia na kugusa ncha ya fimbo hiyo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika ua.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “alibeba kibali machoni pake”; ni nahau inayomaanisha kuwa mfalme alimwangalia kwa fadhili.
    reason: lexical_alternative
  - marker: c
    text: Kwa maana halisi, “kichwa cha fimbo ya kifalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִרְאוֹת
  choice: Ikawa, ... alipomwona
  rationale: Muundo huu unatambulisha kishazi cha wakati katika mwendelezo wa simulizi. “Ikawa” huhifadhi ladha ya kisimulizi bila kufanya sentensi iwe nzito.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: Esta malkia
  rationale: Hufuata mpangilio wa Kiebrania wa jina kisha cheo, huku ukiendelea kuwa wa kawaida katika Kiswahili.
- source_word: עֹמֶדֶת בֶּחָצֵר
  choice: amesimama uani
  rationale: Kitenzi kishirikishi kinaeleza hali ya Esta wakati alipoonekana. חָצֵר hapa ni ua wa jengo la kifalme; “uani” ni tafsiri ya kawaida na wazi.
- source_word: נָשְׂאָה חֵן בְּעֵינָיו
  choice: Esta akapata kibali machoni pake
  rationale: Huhifadhi sitiari ya Kiebrania ya “machoni” na kuwasilisha maana ya kupokelewa kwa mtazamo mwema. Jina limerudiwa ili kuondoa utata wa viwakilishi katika Kiswahili.
- source_word: וַיּוֹשֶׁט
  choice: akamnyoshea
  rationale: Huonyesha kwa kawaida tendo la mfalme la kunyoosha kitu kuelekea kwa Esta.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: fimbo ya kifalme ya dhahabu
  rationale: שַׁרְבִיט ni fimbo inayowakilisha mamlaka ya mfalme. Ufafanuzi “ya kifalme” huzuia isieleweke kuwa fimbo ya kawaida.
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: iliyokuwa mkononi mwake
  rationale: Hutafsiri kishazi husishi kwa Kiswahili cha kawaida na kubainisha fimbo aliyokuwa ameishika mfalme.
- source_word: וַתִּקְרַב
  choice: Ndipo Esta akakaribia
  rationale: “Ndipo” huonyesha mwitikio uliofuata ishara ya mfalme, na “akakaribia” huwasilisha mwendo wa Esta kuelekea kwake.
- source_word: וַתִּגַּע בְּרֹאשׁ הַשַּׁרְבִיט
  choice: na kugusa ncha ya fimbo hiyo
  rationale: רֹאשׁ maana yake halisi ni “kichwa,” lakini kwa fimbo Kiswahili cha kawaida hutumia “ncha.” Hilo halilazimishi wazo la ncha kali.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Istilahi “fimbo ya kifalme” imetumiwa kwa alama ya mamlaka ya mfalme, na sitiari ya “machoni pake” imehifadhiwa.
