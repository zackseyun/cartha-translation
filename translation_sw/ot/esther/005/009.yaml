translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili: Hamani na Mordekai. Muundo wa sentensi umefanywa kuwa wa kawaida kwa Kiswahili huku marudio ya jina Hamani na nguvu ya hisia za maandishi ya Kiebrania vikihifadhiwa.'
