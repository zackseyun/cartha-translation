base_translation:
  language: en
  yaml_path: translation/ot/esther/005/009.yaml
  text: Haman went out that day joyful and glad of heart. But when Haman saw Mordecai in the king’s gate[a], and that he did not rise or tremble before him, Haman was filled with rage against Mordecai.
translation:
  language: sw
  text: Hamani alitoka siku hiyo akiwa na furaha na moyo mkunjufu. Lakini Hamani alipomwona Mordekai katika lango la mfalme, ambaye hakuinuka wala kutetemeka mbele yake[a], Hamani alijawa na ghadhabu dhidi ya Mordekai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala kuonyesha hofu mbele yake.”
    reason: Kitenzi זוע kinaweza kumaanisha kutetemeka au kuonyesha hofu; tanbihi huhifadhi maana mbadala inayofaa muktadha.
lexical_decisions:
- source_word: שָׂמֵחַ וְטוֹב לֵב
  choice: akiwa na furaha na moyo mkunjufu
  rationale: Kauli hii ya jozi inaeleza hali ya shangwe na uchangamfu. Tafsiri hii inadumisha taswira ya moyo na inasikika kwa kawaida katika Kiswahili cha sasa.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja inayohifadhi urejeo mahsusi wa wakati.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: katika lango la mfalme
  rationale: Kihusishi ב kinaweza kumaanisha ‘katika’ au ‘kwenye.’ ‘Katika lango’ kinafaa kwa lango kama eneo la jengo na shughuli za kifalme.
- source_word: וְלֹא קָם
  choice: hakuinuka
  rationale: Kitenzi קום hapa kinaonyesha kuinuka kama ishara ya heshima. ‘Hakuinuka’ kinaweka tendo hilo wazi bila kuongeza maelezo yasiyokuwamo.
- source_word: וְלֹא זָע מִמֶּנּוּ
  choice: wala kutetemeka mbele yake
  rationale: זוע linaweza kuonyesha kutetemeka, kushtuka, au kuonyesha hofu. ‘Kutetemeka mbele yake’ huhifadhi picha halisi pamoja na maana ya woga inayodokezwa na muktadha; uwezekano mwingine umetajwa katika tanbihi.
- source_word: וַיִּמָּלֵא ... חֵמָה
  choice: alijawa na ghadhabu
  rationale: Muundo wa Kiebrania unaeleza kujazwa na hasira kali. ‘Alijawa na ghadhabu’ ni wa asili, wenye nguvu, na wenye hadhi katika Kiswahili.
- source_word: עַל מָרְדֳּכַי
  choice: dhidi ya Mordekai
  rationale: Pamoja na neno la hasira, עַל humtaja anayelengwa na uhasama. ‘Dhidi ya Mordekai’ huonyesha wazi mwelekeo wa ghadhabu hiyo.
