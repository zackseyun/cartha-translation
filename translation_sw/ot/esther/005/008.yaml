  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima inayofaa mazungumzo ya kifalme lakini kinachoeleweka kwa msomaji wa kawaida. Taswira ya Kiebrania ‘machoni pa’ na udokezo wa sentensi ya mwisho vimehifadhiwa.
