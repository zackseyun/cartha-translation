  text: אִם מָצָ֨אתִי חֵ֜ן בְּ/עֵינֵ֣י הַ/מֶּ֗לֶךְ וְ/אִם עַל הַ/מֶּ֨לֶךְ֙ ט֔וֹב לָ/תֵת֙ אֶת שְׁאֵ֣לָתִ֔/י וְ/לַ/עֲשׂ֖וֹת אֶת בַּקָּשָׁתִ֑/י יָב֧וֹא הַ/מֶּ֣לֶךְ וְ/הָמָ֗ן אֶל הַ/מִּשְׁתֶּה֙ אֲשֶׁ֣ר אֶֽעֱשֶׂ֣ה לָ/הֶ֔ם וּ/מָחָ֥ר אֶֽעֱשֶׂ֖ה כִּ/דְבַ֥ר הַ/מֶּֽלֶךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/008.yaml
  text: If I have found favor in the eyes of the king[a], and if it pleases the king to grant my petition and fulfill my request, let the king and Haman come to the banquet that I will prepare for them[b], and tomorrow I will do according to the king’s word.
translation:
  language: sw
  text: Ikiwa nimepata kibali machoni pa mfalme[a], na ikiwa mfalme anaona inafaa kunijalia ombi langu na kutekeleza haja yangu, basi mfalme na Hamani waje kwenye karamu nitakayowaandalia. Kesho nitafanya kulingana na neno la mfalme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa lugha ya kawaida zaidi, “Ikiwa nimekubaliwa na mfalme.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “nitafanya kulingana na neno la mfalme.” Huenda maana yake ni kwamba Esta atajibu ombi la mfalme na kueleza haja yake siku inayofuata.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֵי
  choice: nimepata kibali machoni pa
  rationale: Nahau hii ya Kiebrania inaeleza kukubaliwa au kutazamwa kwa fadhili. Tafsiri hii inahifadhi taswira ya ‘machoni pa’ na inafaa kwa lugha rasmi ya mbele ya mfalme.
- source_word: עַל הַמֶּלֶךְ טוֹב
  choice: mfalme anaona inafaa
  rationale: Hii ni namna ya heshima ya kusema jambo linampendeza au linakubalika kwa mfalme. Kiswahili hiki ni cha kawaida na kinadumisha unyenyekevu wa hotuba ya Esta.
- source_word: לָתֵת אֶת שְׁאֵלָתִי
  choice: kukubali ombi langu
  rationale: Ingawa kitenzi cha Kiebrania ni ‘kutoa,’ katika muktadha wa ombi kwa mfalme maana yake ni kulikubali au kulijalia ombi.
- source_word: וְלַעֲשׂוֹת אֶת בַּקָּשָׁתִי
  choice: na kutekeleza haja yangu
  rationale: Kiebrania hutumia ‘kufanya’ pamoja na neno la ombi. ‘Kutekeleza’ ni ya asili katika Kiswahili, huku ‘haja’ ikihifadhi kwa kiasi tofauti ya maneno mawili yanayokaribiana katika chanzo.
- source_word: יָבֹא
  choice: na waje
  rationale: Umbo hili lina nguvu ya ombi au mwaliko wa heshima katika muktadha huu, si taarifa tu kuhusu wakati ujao.
- source_word: הַמִּשְׁתֶּה
  choice: karamu
  rationale: Neno hili hurejelea sherehe ya chakula na vinywaji; ‘karamu’ linafaa kwa mazingira ya kifalme bila kusisitiza unywaji kupita kiasi.
- source_word: אֲשֶׁר אֶעֱשֶׂה לָהֶם
  choice: nitakayowaandalia
  rationale: Kwa Kiswahili, karamu huandaliwa. Hii ni tafsiri ya kawaida ya kitenzi ‘kufanya’ kinapotumiwa kuhusu karamu.
- source_word: וּמָחָר אֶעֱשֶׂה כִּדְבַר הַמֶּלֶךְ
  choice: Kesho nitafanya kulingana na neno la mfalme
  rationale: Kauli ya Kiebrania ni ya kidokezo na haielezi moja kwa moja kitendo gani Esta atafanya. Tafsiri hii inahifadhi uwazi huo badala ya kuongeza kwamba atasema ombi lake.
