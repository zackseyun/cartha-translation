base_translation:
  language: en
  yaml_path: translation/ot/esther/005/001.yaml
  text: On the third day[a], Esther put on her royal robes and stood in the inner court of the king’s palace, opposite the king’s house, while the king was sitting on his royal throne in the royal house[b], opposite the entrance of the house.
translation:
  language: sw
  text: Siku ya tatu, Esta akavaa mavazi yake ya kifalme[a], akasimama katika ua wa ndani wa jumba la mfalme, mkabala na jumba la mfalme. Wakati huo, mfalme alikuwa ameketi kwenye kiti chake cha enzi katika jumba la kifalme[b], mkabala na mlango wa jumba hilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “akavaa ufalme,” yaani, mavazi au mapambo ya kifalme.'
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linalotafsiriwa “jumba” linaweza pia kumaanisha “nyumba”; katika mazingira haya linarejelea makao ya kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: Siku ya tatu
  rationale: Kiunganishi cha masimulizi katika וַיְהִי hakihitaji kutafsiriwa kwa neno la ziada kama “basi” hapa; usemi wa wakati unaanzisha tukio kwa Kiswahili cha asili.
- source_word: וַתִּלְבַּשׁ אֶסְתֵּר מַלְכוּת
  choice: Esta akavaa mavazi yake ya kifalme
  rationale: Kihalisi מַלְכוּת ni “ufalme/hadhi ya kifalme,” lakini katika muundo huu linaelekea kumaanisha mavazi au mapambo ya kifalme. Tafsiri hii inaeleweka kwa urahisi huku tanbihi ikihifadhi usemi halisi.
- source_word: בַּחֲצַר בֵּית־הַמֶּלֶךְ הַפְּנִימִית
  choice: katika ua wa ndani wa jumba la mfalme
  rationale: בֵּית katika mazingira haya ni jengo au makao ya kifalme; “jumba la mfalme” ni la asili na linaweka wazi mazingira ya ikulu.
- source_word: נֹכַח בֵּית הַמֶּלֶךְ
  choice: mkabala na jumba la mfalme
  rationale: נֹכַח huonyesha mahali panapokabiliana au kuelekeana na kitu kingine; “mkabala na” huhifadhi uhusiano huo wa mahali bila kuongeza maelezo.
- source_word: וְהַמֶּלֶךְ יוֹשֵׁב
  choice: Wakati huo, mfalme alikuwa ameketi
  rationale: Kishazi hiki hutoa hali iliyokuwa ikiendelea wakati Esta aliposimama uani; “wakati huo” huwasilisha uambatano huo kwa Kiswahili fasaha.
- source_word: עַל כִּסֵּא מַלְכוּתוֹ
  choice: kwenye kiti chake cha enzi
  rationale: Usemi huu unamaanisha kiti cha enzi cha mfalme; “kiti chake cha enzi” ni sawia ya kawaida na yenye hadhi katika Kiswahili.
- source_word: בְּבֵית הַמַּלְכוּת
  choice: katika jumba la kifalme
  rationale: Tafsiri hii huhifadhi wazo la makao ya kifalme na uhusiano wa neno מַלְכוּת na hadhi ya kifalme, bila kutumia usemi usio wa kawaida “nyumba ya ufalme.”
- source_word: נֹכַח פֶּתַח הַבָּיִת
  choice: mkabala na mlango wa jumba hilo
  rationale: “Mkabala na” huhifadhi mwelekeo wa mahali, na “jumba hilo” hutambulisha wazi jengo lililotajwa katika muktadha.
