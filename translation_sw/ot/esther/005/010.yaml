  yaml_path: translation/ot/esther/005/010.yaml
  text: But Haman restrained himself and went to his house[b][a]. Then he sent and brought in his friends and Zeresh his wife.
translation:
  language: sw
  text: Lakini Hamani akajizuia[a] akaenda nyumbani kwake.[b] Kisha akatuma kuwaleta rafiki zake na Zereshi, mkewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akajidhibiti” au “akajizuia.”
    reason: lexical_alternative
  - marker: b
    text: Au “akaenda nyumbani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַפַּק
  choice: akajizuia
  rationale: Kauli ya kujirejelea ya kitenzi hiki inaonyesha kwamba Hamani alidhibiti mwitikio wake licha ya hasira iliyotajwa katika muktadha. “Akajizuia” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: וַיָּבֹא אֶל־בֵּיתוֹ
  choice: akaenda nyumbani kwake
  rationale: Kirai hiki kinaeleza mwendo kuelekea nyumba yake. “Nyumbani kwake” ni cha asili katika Kiswahili na hakimaanishi tu jengo bali mahali pake pa kuishi.
- source_word: וַיִּשְׁלַח
  choice: akatuma watu wawaite
  rationale: Kiebrania kinasema kwa ufupi “akatuma,” huku kilichotumwa kikidokezwa. Kiswahili huhitaji kukamilisha wazo kwa asili zaidi; “watu wawaite” huonyesha kwamba aliwatuma wajumbe ili wale waliotajwa waje.
- source_word: וַיָּבֵא
  choice: wawaite
  rationale: Hiphil ya בוא ina maana ya kusababisha waje. Katika muktadha huu, kuwaita baada ya kutuma wajumbe ndio njia ya asili ya kueleza kitendo hicho kwa Kiswahili.
- source_word: אֹהֲבָיו
  choice: rafiki zake
  rationale: Ingawa neno linatokana na mzizi wa “kupenda,” hapa linamaanisha watu wa karibu naye kijamii, yaani rafiki zake.
- source_word: זֶרֶשׁ אִשְׁתּוֹ
  choice: Zereshi mkewe
  rationale: Mpangilio huu unafuata msisitizo wa Kiebrania unaotaja jina kwanza, na ni wazi na wa kawaida katika Kiswahili.
- source_word: וַ
  choice: Lakini
  rationale: 'Waw ya simulizi hapa ina tofauti ndogo ya kimuktadha: licha ya hasira yake katika mstari uliotangulia, Hamani alijizuia. “Lakini” huleta tofauti hiyo bila kuzuia mtiririko wa simulizi.'
