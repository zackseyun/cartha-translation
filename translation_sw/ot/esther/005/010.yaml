translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mfululizo wa haraka wa vitendo vya Kiebrania kwa kutumia viambishi vya masimulizi “aka-”. Jina זֶרֶשׁ limetoholewa kuwa “Zereshi” ili kutamkika kwa kawaida katika Kiswahili.
