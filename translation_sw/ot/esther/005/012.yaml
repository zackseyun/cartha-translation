base_translation:
  language: en
  yaml_path: translation/ot/esther/005/012.yaml
  text: Then Haman said[a], “Indeed, Queen Esther brought no one with the king to the banquet she prepared except me[b]; and tomorrow also I am invited by her together with the king.”
translation:
  language: sw
  text: Kisha Hamani akasema, “Kwa kweli, Malkia Esta hakumleta mtu mwingine yeyote pamoja na mfalme kwenye karamu[a] aliyoiandaa, ila mimi tu; na kesho pia nimealikwa naye[b] pamoja na mfalme.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhifa.” Neno la Kiebrania מִשְׁתֶּה linaweza kumaanisha karamu au dhifa, mara nyingi ikihusisha unywaji.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya neno kwa neno, “nimeitwa naye.” Katika muktadha huu maana yake ni “nimealikwa naye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akasema
  rationale: Muundo huu unaendeleza mfululizo wa simulizi; ‘Kisha’ ni wa kawaida na unaonyesha hatua inayofuata.
- source_word: אַף לֹא
  choice: Naam, ... hakumleta mtu mwingine yeyote
  rationale: ‘Naam’ pamoja na ukanushaji wenye ‘yeyote’ kunawasilisha msisitizo wa majivuno ya Hamani kwa Kiswahili cha kawaida.
- source_word: הֵבִיאָה
  choice: hakumleta
  rationale: Kitenzi kimehifadhiwa kwa maana yake ya msingi, ‘kuleta,’ badala ya kubadilishwa moja kwa moja kuwa ‘kualika.’
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: Malkia Esta
  rationale: Mpangilio huu wa cheo na jina ni wa kawaida katika Kiswahili.
- source_word: עִם הַמֶּלֶךְ
  choice: pamoja na mfalme
  rationale: Huwasilisha wazi kuwapo kwa Hamani katika kundi moja na mfalme.
- source_word: אֶל הַמִּשְׁתֶּה
  choice: kwenye karamu
  rationale: ‘Karamu’ ni neno la kawaida linalofaa mlo mkubwa wa kifalme, ingawa neno la Kiebrania linaweza pia kutafsiriwa ‘dhifa.’
- source_word: אֲשֶׁר עָשָׂתָה
  choice: aliyoiandaa
  rationale: Kwa habari ya karamu, ‘kuandaa’ ni Kiswahili cha kawaida kinachoonyesha jukumu la Esta kama mwenyeji.
- source_word: כִּי אִם אוֹתִי
  choice: ila mimi tu
  rationale: Huhifadhi maana ya kumtenga Hamani peke yake miongoni mwa watu wengine, pamoja na msisitizo wake wa kujisifu.
- source_word: וְגַם לְמָחָר
  choice: tena kesho pia
  rationale: ‘Tena’ na ‘pia’ zinahifadhi nguvu ya nyongeza na rejeo la wakati.
- source_word: קָרוּא לָהּ
  choice: amenialika
  rationale: Ingawa kwa umbo la moja kwa moja ni ‘nimeitwa naye,’ katika muktadha wa karamu maana ya kawaida ni kwamba Esta amemwalika Hamani.
