  text: Then Esther answered and said[a], “My petition and my request are:”
translation:
  language: sw
  text: Ndipo Esta akajibu na kusema, “Ombi langu na dua yangu ni hii:”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעַן
  choice: Ndipo ... akajibu
  rationale: Kitenzi hiki pamoja na kiunganishi cha usimulizi kinaendeleza mfululizo wa matukio; ‘Ndipo’ huonyesha hatua inayofuata, na ‘akajibu’ huhifadhi maana ya kuitikia kwa maneno.
- source_word: אֶסְתֵּר
  choice: Esta
  rationale: Jina limetolewa kwa tahajia iliyozoeleka katika Kiswahili cha Biblia.
- source_word: וַתֹּאמַר
  choice: na kusema
  rationale: Huhifadhi jozi rasmi ya vitenzi vya Kiebrania ‘akajibu na kusema’ badala ya kuvifanya kitenzi kimoja.
- source_word: שְׁאֵלָתִי
  choice: Ombi langu
  rationale: Katika muktadha wa Esta kuwasilisha jambo rasmi mbele ya mfalme, nomino hii ina maana ya ombi analoliomba, si swali la kutaka habari.
- source_word: וּבַקָּשָׁתִי
  choice: na haja yangu
  rationale: ‘Haja’ huonyesha jambo analotaka apewe au kutimiziwa na pia hutofautisha kwa kiasi nomino hii na ‘ombi,’ huku jozi ya visawe vya karibu ikibaki ya asili na yenye heshima.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘akajibu na kusema’ umehifadhiwa kwa sababu ni jozi dhahiri katika chanzo, ingawa katika mazungumzo ya kawaida ungeweza kufupishwa. ‘Ombi langu na haja yangu’ huhifadhi jozi ya nomino zinazokaribiana bila kuongeza ufafanuzi wa kimadhehebu.
