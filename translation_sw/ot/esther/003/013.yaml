base_translation:
  language: en
  yaml_path: translation/ot/esther/003/013.yaml
  text: Letters were sent by the hand of the couriers to all the provinces of the king[a], to destroy, to kill, and to annihilate all the Jews, from young man to old man, children and women, in one day, on the thirteenth day of the twelfth month, that is, the month Adar[d][c][b], and to plunder their spoil.
translation:
  language: sw
  text: Barua zilipelekwa kwa mkono wa wajumbe[a] kwa majimbo yote ya mfalme, ili kuwaangamiza, kuwaua, na kuwaondoa kabisa Wayahudi wote[b]—kuanzia kijana hadi mzee, watoto na wanawake[c]—katika siku moja, siku ya kumi na tatu ya mwezi wa kumi na mbili, yaani mwezi wa Adari, na kupora mali zao[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa njia ya wajumbe”; kwa tafsiri halisi, “kwa mkono wa wakimbiaji.”
    reason: lexical_alternative
  - marker: b
    text: Vitenzi vitatu, “kuwaangamiza,” “kuwaua,” na “kuwaondoa kabisa,” ni msisitizo wa makusudi katika amri ya Kiebrania.
    reason: lexical_alternative
  - marker: c
    text: Au, “kuanzia wadogo hadi wazee.” Kiebrania kwa tafsiri halisi kinasema “kuanzia kijana hadi mzee,” maneno yanayotumiwa hapa kuwajumuisha watu wa kila umri.
    reason: lexical_alternative
  - marker: d
    text: Au, “na kuteka mali zao kama nyara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁלוֹחַ סְפָרִים
  choice: Barua zilipelekwa
  rationale: Muundo wa Kiebrania ni wa kutendwa, huku סְפָרִים ikitaja nyaraka rasmi zilizotumwa. “Barua” ni neno la kawaida na linalofaa katika muktadha wa utawala.
- source_word: בְּיַד הָרָצִים
  choice: kwa mikono ya wajumbe
  rationale: Inahifadhi nahau ya Kiebrania “kwa mkono wa” kwa namna ya asili katika Kiswahili; הָרָצִים ni wakimbiaji waliotumika kama wajumbe wa kifalme.
- source_word: אֶל כָּל מְדִינוֹת הַמֶּלֶךְ
  choice: katika majimbo yote ya mfalme
  rationale: “Majimbo” huwasilisha maeneo ya kiutawala ya milki; “katika” ni ya asili kwa barua zinazosambazwa kwenye maeneo hayo.
- source_word: לְהַשְׁמִיד לַהֲרֹג וּלְאַבֵּד
  choice: kuangamiza, kuua na kuwaondolea mbali
  rationale: Inadumisha mfululizo wa vitenzi vitatu na ongezeko lake la msisitizo. “Kuwaondolea mbali” huepuka kurudia tu “kuangamiza” huku ikionyesha kusudi la kuwaondoa kabisa.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: kuanzia kijana hadi mzee
  rationale: Inafuata nomino za umoja zenye jinsia ya kiume katika Kiebrania, zinazotumiwa kwa maana ya kugawa watu wote kwa umri.
- source_word: טַף וְנָשִׁים
  choice: watoto na wanawake
  rationale: טַף humaanisha watoto au wadogo; tafsiri hii inaonyesha wazi kuwa amri hiyo iliwahusu pia wasiokuwa wapiganaji.
- source_word: בְּיוֹם אֶחָד
  choice: kwa siku moja
  rationale: Huwasilisha msisitizo wa tukio lote kutekelezwa ndani ya siku moja.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר לְחֹדֶשׁ שְׁנֵים עָשָׂר הוּא חֹדֶשׁ אֲדָר
  choice: yaani siku ya kumi na tatu ya mwezi wa kumi na mbili, ndio mwezi wa Adari
  rationale: Hutoa tarehe na ufafanuzi wa jina la mwezi kwa Kiswahili cha kawaida bila kupoteza apposition ya Kiebrania.
- source_word: וּשְׁלָלָם לָבוֹז
  choice: na kuteka mali yao kuwa nyara
  rationale: Hufanya maana ya mali inayoporwa iwe wazi na pia huhifadhi wazo la kuichukua kama nyara.
