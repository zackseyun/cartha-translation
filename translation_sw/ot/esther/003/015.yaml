base_translation:
  language: en
  yaml_path: translation/ot/esther/003/015.yaml
  text: The couriers went out[a], hurried by the king’s command, and the decree was issued in Susa the citadel. And the king and Haman sat down to drink[b], but the city of Susa was thrown into confusion.
translation:
  language: sw
  text: Wajumbe walitoka, wakiharakishwa kwa agizo la mfalme. Amri ikatolewa katika ngome ya Shushani.[a] Mfalme na Hamani wakaketi kunywa, lakini mji wa Shushani ulikuwa umechanganyikiwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sheria ikatolewa katika ngome ya Shushani.” Neno la Kiebrania דָּת linaweza kutafsiriwa “sheria” au “amri” katika mazingira haya ya kiutawala ya Uajemi.
    reason: lexical_alternative
  - marker: b
    text: Au, “mji wa Shushani ulikuwa umefadhaika,” au “ulikuwa katika taharuki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: wajumbe
  rationale: Katika mazingira ya utawala wa Uajemi, neno hili linamaanisha wajumbe rasmi waliobeba nyaraka za kifalme. ‘Wajumbe’ ni la kawaida na linaeleza kazi yao vizuri kuliko tafsiri halisi ‘wakimbiaji.’
- source_word: דְחוּפִים
  choice: kwa haraka, wakihimizwa
  rationale: Uundaji huu unaonyesha kwamba wajumbe waliharakishwa au kusukumwa waende upesi; ‘wakihimizwa’ huhifadhi wazo la msukumo wa nje.
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: na amri ya mfalme
  rationale: דבר hapa ni agizo lenye mamlaka, si neno au kauli ya kawaida.
- source_word: הַדָּת
  choice: amri hiyo
  rationale: Katika mazingira ya kiutawala ya kitabu cha Esta, דָּת ni tangazo au agizo rasmi lenye nguvu ya kisheria. ‘Amri’ ni ya wazi kwa wasomaji wa kawaida.
- source_word: נִתְּנָה
  choice: ikatolewa
  rationale: Ingawa maana yake ya msingi ni ‘ilitolewa/ilipewa,’ katika muktadha huu neno hilo linahusu kutolewa rasmi kwa amri.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: ngome ya Shushani
  rationale: בִּירָה hapa huelekea kumaanisha eneo la ngome au jumba lenye ulinzi la Shushani; uundaji huu ni wa asili katika Kiswahili.
- source_word: יָשְׁבוּ לִשְׁתּוֹת
  choice: wakaketi kunywa
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida inayohifadhi tofauti ya kushtua kati ya kunywa kwao na hali ya mji.
- source_word: נָבוֹכָה
  choice: ulikuwa umechanganyikiwa
  rationale: Neno hili linaweza kueleza hali ya kufadhaika, kutatanika, au kuvurugika. ‘Ulikuwa umechanganyikiwa’ huhifadhi upana huo bila kuamua ikiwa mkazo ni hisia au vurugu za kijamii.
- source_word: וְ
  choice: lakini
  rationale: Kiunganishi cha Kiebrania ni ‘na,’ lakini hapa kinaonyesha tofauti kati ya mfalme na Hamani walioketi kunywa na hali ya mji. ‘Lakini’ huwasilisha nguvu hiyo ya simulizi kwa Kiswahili cha kawaida.
