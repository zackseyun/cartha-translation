  text: Then the king said to Haman[a], “The silver is given to you, and the people also[b], to do with them as seems good in your eyes.”
translation:
  language: sw
  text: Ndipo mfalme akamwambia Hamani, “Umepewa fedha,[a] na watu pia, ili uwafanyie lolote linaloonekana kuwa jema machoni pako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Umepewa fedha ya silver.” Neno la Kiebrania כֶּסֶף humaanisha “silver” hasa, lakini pia linaweza kumaanisha fedha au pesa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “Ndipo” huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino yenye uainisho imetafsiriwa moja kwa moja bila kuweka jina mahali ambapo Kiebrania kinatumia cheo.
- source_word: לְהָמָן
  choice: akamwambia Hamani
  rationale: Kiambishi cha yambwa katika kitenzi pamoja na jina “Hamani” huwasilisha kwa kawaida mhusika anayeambiwa.
- source_word: הַכֶּסֶף
  choice: Fedha
  rationale: כֶּסֶף inaweza kumaanisha ‘silver’ halisi au fedha/mali ya malipo; “fedha” huhifadhi upeo huo wa maana kwa Kiswahili.
- source_word: נָתוּן לָךְ
  choice: umepewa wewe
  rationale: Muundo wa hali ya kutendwa unaonyesha kuwa fedha zimekabidhiwa au kuwekwa chini ya mamlaka ya Hamani; “wewe” husisitiza mpokeaji.
- source_word: וְהָעָם
  choice: pamoja na watu hao
  rationale: Kiunganishi kinaongeza watu kama kitu kingine kilichowekwa chini ya mamlaka ya Hamani. “Watu hao” hurejelea kundi lililotajwa katika muktadha.
- source_word: לַעֲשׂוֹת בּוֹ
  choice: ili uwatendee
  rationale: Kitenzi-jina kinaonyesha kusudi, na kiwakilishi cha umoja kinarejelea nomino ya mkusanyiko הָעָם; Kiswahili hutumia kiambishi cha wingi kwa watu kwa ufasaha.
- source_word: כַּטּוֹב בְּעֵינֶיךָ
  choice: kama inavyoonekana kuwa vyema machoni pako
  rationale: Tafsiri hii huhifadhi sitiari ya Kiebrania ya ‘machoni pako’ na maana ya kile kinachoonekana kuwa chema au kinachompendeza mtu.
