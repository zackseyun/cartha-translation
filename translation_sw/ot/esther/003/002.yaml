base_translation:
  language: en
  yaml_path: translation/ot/esther/003/002.yaml
  text: And all the king’s servants who were at the king’s gate were bowing down and paying homage to Haman[a], for the king had so commanded concerning him[b]. But Mordecai would not bow down or pay homage.
translation:
  language: sw
  text: Nao watumishi wote wa mfalme waliokuwa katika lango la mfalme walikuwa wakipiga magoti na kumsujudia Hamani[a], kwa maana mfalme alikuwa ameamuru hivyo kuhusu Hamani[b]. Lakini Mordekai hakutaka kupiga magoti wala kumsujudia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kujilaza kifudifudi mbele ya Hamani”; kitenzi cha Kiebrania kinaweza pia kutafsiriwa “kuabudu” Mungu ndiye anayelengwa.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa maana mfalme alikuwa amemwamuru hivyo.” Hata hivyo, yaelekea zaidi kiwakilishi kinamrejelea Hamani, yaani, amri hiyo ilihusu heshima aliyopaswa kupewa.
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  choice: watumishi
  rationale: Katika mazingira ya ikulu, neno hili linamaanisha watu wanaomtumikia mfalme; “watumishi” ni pana na ya kawaida kuliko “maofisa,” bila kudokeza kwa lazima hali ya utumwa.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: katika lango la mfalme
  rationale: Huhifadhi mahali halisi palipohusishwa na shughuli za utawala wa kifalme; Kiswahili “katika lango” pia kinaweza kumaanisha eneo la lango, si ndani ya mlango tu.
- source_word: כֹּרְעִים
  choice: walikuwa wakipiga magoti
  rationale: Hali ya kushiriki inaonyesha tendo la kawaida au lililorudiwa. “Kupiga magoti” huwasilisha ishara ya kujinyenyekeza, ingawa kitenzi kinaweza pia kumaanisha kuinama.
- source_word: וּמִשְׁתַּחֲוִים
  choice: kumsujudia
  rationale: “Kusujudia” huonyesha kuinama sana au kujilaza mbele ya mtu kwa heshima. Katika Kiswahili linaweza pia kutumiwa katika ibada, hivyo linahifadhi upana wa kitenzi cha Kiebrania bila kutafsiri moja kwa moja kuwa “kumwabudu.”
- source_word: לְהָמָן
  choice: Hamani
  rationale: Kiambishi cha yambwa katika “kumsujudia Hamani” huonyesha wazi kwamba Hamani ndiye anayepokea tendo hilo.
- source_word: כִּי כֵן צִוָּה לוֹ הַמֶּלֶךְ
  choice: kwa maana mfalme alikuwa ameamuru hivyo kumhusu yeye
  rationale: Huhifadhi rejeo la kiwakilishi kwa Hamani kama mtu ambaye amri ya heshima ilimhusu, badala ya kudai kwamba Hamani ndiye aliyepewa amri.
- source_word: וּמָרְדֳּכַי
  choice: Lakini Mordekai
  rationale: Ingawa kiunganishi cha Kiebrania kwa msingi ni “na,” hapa kinaonyesha tofauti dhahiri kati ya tabia ya watumishi wengine na kukataa kwa Mordekai.
- source_word: לֹא יִכְרַע וְלֹא יִשְׁתַּחֲוֶה
  choice: hakutaka kupiga magoti wala kumsujudia
  rationale: Kauli hii huonyesha kukataa kwa hiari na kwa kudumu, si tukio moja tu; “wala” huhifadhi ulinganifu wa vikanushi viwili.
theological_decisions:
- issue: Iwapo הִשְׁתַּחֲוָה itafsiriwe kwa lugha iliyo wazi kuwa ya ibada
  choice: kumsujudia
  alternative: kumwabudu; kujilaza kifudifudi mbele ya
  rationale: Kitenzi cha Kiebrania kinaweza kumaanisha kumwabudu Mungu au kutoa heshima kwa mwanadamu. Kwa kuwa Hamani ndiye anayelengwa hapa, “kumsujudia” huhifadhi uwezekano wa tendo la heshima kuu na umbo lake la kimwili bila kuamua kwamba simulizi linaita tendo hilo ibada ya kidini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “walikuwa waki-” unaonyesha desturi iliyorudiwa, na “hakutaka” unaonyesha kukataa kwa makusudi. Majina yametolewa kama Hamani na Mordekai kwa mazoea mapana ya Biblia za Kiswahili.
