base_translation:
  language: en
  yaml_path: translation/ot/esther/003/003.yaml
  text: Then the king’s servants who were at the king’s gate said to Mordecai[a], “Why are you transgressing the king’s command?”
translation:
  language: sw
  text: Ndipo watumishi wa mfalme waliokuwa kwenye lango la mfalme wakamwambia Mordekai, “Kwa nini unaivunja amri ya mfalme?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ndipo ... wakamwambia
  rationale: Muundo wa wayyiqtol unaendeleza simulizi. ‘Ndipo’ pamoja na kitenzi cha -ka- huonyesha mfuatano wa matukio kwa Kiswahili cha kawaida.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: watumishi wa mfalme
  rationale: עֶבֶד inaweza kumaanisha mtumishi au mtumwa; hapa inawahusu watu waliomhudumia mfalme katika mazingira ya ikulu, hivyo ‘watumishi’ huhifadhi maana bila kudai wazi kuwa walikuwa watumwa.
- source_word: אֲשֶׁר בְּשַׁעַר הַמֶּלֶךְ
  choice: waliokuwa kwenye lango la mfalme
  rationale: Kirai hiki kinawatambulisha watumishi kwa mahali walipokuwa. ‘Kwenye lango’ ni usemi wa asili unaoweza pia kuhusisha eneo la lango la ikulu, si mlango wenyewe tu.
- source_word: לְמָרְדֳּכָי
  choice: wakamwambia Mordekai
  rationale: Kihusishi לְ huonyesha anayeelekezewa maneno; katika Kiswahili maana hiyo huwasilishwa kwa kiambishi cha yambwa -mw- katika ‘wakamwambia’.
- source_word: מַדּוּעַ
  choice: Kwa nini
  rationale: Hili ni swali la moja kwa moja linalotaka sababu; ‘Kwa nini’ ndilo tumizi la kawaida na wazi.
- source_word: אַתָּה
  choice: una-
  rationale: Nafsi ya pili umoja wa kiume inaonyeshwa kiasili na kiambishi cha kiima u- katika kitenzi cha Kiswahili; si lazima kuongeza kiwakilishi ‘wewe’.
- source_word: עוֹבֵר
  choice: unaivunja
  rationale: Katika muundo huu עבר pamoja na amri humaanisha kwenda kinyume na au kukiuka amri. ‘Unaivunja’ ni ya sasa, inaeleweka kwa urahisi, na huhifadhi taswira ya kuvuka mpaka wa amri kuliko ‘huitii’.
- source_word: אֵת מִצְוַת הַמֶּלֶךְ
  choice: amri ya mfalme
  rationale: מִצְוָה hapa ni agizo la kifalme. ‘Amri’ inafaa mazingira ya utawala na haileti kwa lazima dhana ya amri ya kidini.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. Jina limetolewa kama ‘Mordekai,’ tahajia iliyozoeleka katika tafsiri za Kiswahili. Hakuna tanbihi iliyohitajika; tanbihi ya Kiingereza iliyotolewa inaonekana kurudia sentensi yenyewe na haibebi tofauti ya maana inayopaswa kuhamishwa.
