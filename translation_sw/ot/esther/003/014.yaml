base_translation:
  language: en
  yaml_path: translation/ot/esther/003/014.yaml
  text: A copy of the written decree was to be issued as law in every province and province[a], being made known to all the peoples[b], so that they would be ready for this day.
translation:
  language: sw
  text: Nakala ya waraka huo ilipaswa kutolewa kama sheria katika kila jimbo[a] na kutangazwa kwa watu wa mataifa yote, ili wawe tayari kwa siku hii.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinarudia neno “jimbo”: “katika kila jimbo na jimbo,” yaani, katika kila jimbo bila kuacha hata moja.'
    reason: lexical_alternative
  - marker: b
    text: Au “kwa siku hiyo,” yaani, siku maalumu iliyowekwa katika amri.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְשֶׁגֶן
  choice: nakala
  rationale: Neno hili la mkopo kutoka Kiajemi humaanisha nakala au hati iliyonakiliwa ya waraka rasmi; “nakala” ni ya kawaida na sahihi katika muktadha wa kiutawala.
- source_word: הַכְּתָב
  choice: waraka huo
  rationale: Kimsingi ni “maandishi/waraka.” “Waraka huo” hurejelea kwa uwazi agizo rasmi lililoandikwa bila kurudia maana ya sheria inayofuata.
- source_word: לְהִנָּתֵן
  choice: ilipaswa kutolewa
  rationale: Kauli tendwa ya נתן hapa inaeleza kutolewa au kusambazwa rasmi kwa waraka; “ilipaswa kutolewa” huhifadhi hali hiyo na maana ya kusudi.
- source_word: דָּת
  choice: sheria
  rationale: Katika Esta, neno hili la kiutawala la asili ya Kiajemi huonyesha amri yenye nguvu ya kisheria; “sheria” huonyesha nguvu hiyo.
- source_word: בְּכָל מְדִינָה וּמְדִינָה
  choice: katika kila jimbo
  rationale: Kurudiwa kwa “jimbo” katika Kiebrania kuna maana ya ugawanyaji na msisitizo. Kiswahili cha kawaida huwasilisha maana hiyo kwa “kila jimbo”; muundo halisi umeelezwa katika tanbihi.
- source_word: גָּלוּי
  choice: kutangazwa
  rationale: Neno hili huonyesha kuwekwa wazi au kujulishwa hadharani. “Kutangazwa” linafaa kwa uchapishaji wa amri kwa umma.
- source_word: לְכָל הָעַמִּים
  choice: kwa watu wa mataifa yote
  rationale: Wingi wa “watu” hapa unarejelea makundi mbalimbali ya kikabila ndani ya himaya. Kauli hii ni ya kawaida kwa Kiswahili na hailazimishi maana ya nchi huru.
- source_word: לִהְיוֹת עֲתִדִים
  choice: ili wawe tayari
  rationale: 'Muundo huu unaonyesha kusudi au matokeo: watu walitakiwa kujiandaa. “Ili wawe tayari” ni wazi na wa kawaida.'
- source_word: לַיּוֹם הַזֶּה
  choice: kwa siku hii
  rationale: Hivi ndivyo Kiebrania kinavyosema moja kwa moja, ingawa kimuktadha ni siku iliyotajwa katika amri; utata huo umehifadhiwa kwa tanbihi.
