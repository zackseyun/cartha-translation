  text: So the king took his signet ring from his hand and gave it to Haman son of Hammedatha the Agagite[a], the enemy of the Jews.
translation:
  language: sw
  text: Basi mfalme akaivua pete yake ya muhuri mkononi mwake, akampa Hamani mwana wa Hamedatha, Mwagagi, adui wa Wayahudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wayudea.” Neno la Kiebrania יְהוּדִים linaweza kumaanisha Wayahudi kwa ujumla au, katika baadhi ya miktadha, watu wa Yuda au Yudea.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: akaivua
  rationale: Kitenzi kina maana ya kuondoa au kuvua; kwa pete iliyokuwa mkononi, “akaivua” ni Kiswahili cha kawaida na huonyesha tendo hilo wazi.
- source_word: טַבַּעְתּוֹ
  choice: pete yake ya muhuri
  rationale: Katika mazingira ya kifalme, pete hii ilibeba muhuri wa mamlaka, si pambo tu.
- source_word: מֵעַל יָדוֹ
  choice: kutoka mkononi mwake
  rationale: Huhifadhi taswira ya Kiebrania kwa Kiswahili cha asili.
- source_word: וַיִּתְּנָהּ
  choice: akampa
  rationale: Ni tafsiri fupi na ya kawaida ya tendo la kumpa Hamani pete hiyo; kitu kinachotolewa kinaeleweka kutokana na kishazi kilichotangulia.
- source_word: לְהָמָן
  choice: Hamani
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: בֶּן הַמְּדָתָא
  choice: mwana wa Hamedatha
  rationale: Muundo wa nasaba umetafsiriwa moja kwa moja, huku jina likitoholewa.
- source_word: הָאֲגָגִי
  choice: Mwagagi
  rationale: Huhifadhi jina la ukoo au asili linalohusishwa na Agagi bila kulipanua kwa tafsiri ya ziada.
- source_word: צֹרֵר
  choice: adui
  rationale: Kishirikishi hiki humaanisha mtu mwenye uhasama au anayepinga; “adui” ni neno la kawaida na lenye nguvu inayofaa hapa.
- source_word: הַיְּהוּדִים
  choice: Wayahudi
  rationale: Katika muktadha wa Esta, neno linataja jamii ya watu inayolengwa, si wakaaji wa eneo la Yuda pekee.
- source_word: וַ
  choice: Basi
  rationale: Huendeleza simulizi na kuonyesha kwamba tendo hili linafuata uamuzi wa mstari uliotangulia.
