base_translation:
  language: en
  yaml_path: translation/ot/esther/003/006.yaml
  text: But it seemed contemptible in his eyes to lay a hand on Mordecai alone[a], because they had told him what people Mordecai belonged to. So Haman sought to destroy all the Jews throughout the whole kingdom of Ahasuerus—the people of Mordecai.
translation:
  language: sw
  text: Lakini aliona kuwa kumshambulia Mordekai peke yake ni jambo la kudharaulika[a], kwa kuwa walikuwa wamemwambia Hamani Mordekai alikuwa wa watu gani. Kwa hiyo Hamani akatafuta kuwaangamiza Wayahudi wote kote katika ufalme wa Ahasuero—watu wa Mordekai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “kunyoosha mkono dhidi ya Mordekai peke yake.” Yaani, Hamani aliona kumlenga Mordekai tu kuwa jambo dogo mno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶז בְּעֵינָיו
  choice: aliona kuwa ... hakukutosha
  rationale: Nahau ya Kiebrania inaonyesha kwamba Hamani alidharau hatua ya kumlenga Mordekai peke yake kuwa ndogo mno. Kiswahili hiki cha kawaida kinawasilisha tathmini yake ya dharau bila kudokeza kwamba hakumchukia Mordekai.
- source_word: לִשְׁלֹחַ יָד בְּ
  choice: kumdhuru
  rationale: Nahau ya kunyoosha au kutuma mkono dhidi ya mtu humaanisha kumshambulia kwa madhara, na katika muktadha huu inaelekea kwenye kumuua. “Kumdhuru” huhifadhi upana wa nahau bila kuamua wazi zaidi ya maandishi.
- source_word: לְבַדּוֹ
  choice: peke yake
  rationale: Inaonyesha kwamba Mordekai akiwa shabaha pekee alionekana kuwa adhabu ndogo mno kwa Hamani, kinyume na mpango wake wa kuwalenga watu wote.
- source_word: כִּי הִגִּידוּ לוֹ
  choice: kwa sababu walikuwa wamemwambia
  rationale: Kishazi hiki kinatoa sababu ya Hamani kupanua shabaha yake; wakati timilifu wa Kiswahili unaonyesha taarifa hiyo ilitangulia mpango wake.
- source_word: אֶת עַם מָרְדֳּכָי
  choice: Mordekai alikuwa wa watu gani
  rationale: Hufafanua kwa Kiswahili cha kawaida maana ya “watu wa Mordekai,” yaani jamii ya kikabila au kitaifa aliyokuwa sehemu yake.
- source_word: וַיְבַקֵּשׁ
  choice: akatafuta
  rationale: Kitenzi kinaonyesha kusudi na juhudi za makusudi bila kudai kwamba mpango ulifanikiwa.
- source_word: לְהַשְׁמִיד
  choice: kuwaangamiza
  rationale: “Kuangamiza” huonyesha uzito wa שׁמד, yaani kuharibu kabisa, na ni neno la kawaida na lenye hadhi katika Kiswahili.
- source_word: כָּל הַיְּהוּדִים
  choice: Wayahudi wote
  rationale: Katika Esta neno hili linarejelea watu wa Kiyahudi katika milki ya Uajemi, si wakazi wa Yuda pekee.
- source_word: אֲשֶׁר בְּכָל מַלְכוּת אֲחַשְׁוֵרוֹשׁ
  choice: katika ufalme wote wa Ahasuero
  rationale: Huwasilisha kwa kawaida upeo wa kijiografia wa mpango huo katika milki nzima.
- source_word: עַם מָרְדֳּכָי
  choice: watu wa Mordekai
  rationale: Marudio ya karibu na muundo wa Kiebrania yamehifadhiwa kama ufafanuzi wa “Wayahudi wote,” yakisisitiza kwamba walilengwa kwa sababu ya uhusiano wao wa kijamii na Mordekai.
