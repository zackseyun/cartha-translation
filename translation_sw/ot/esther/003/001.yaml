base_translation:
  language: en
  yaml_path: translation/ot/esther/003/001.yaml
  text: After these things[a], King Ahasuerus promoted Haman son of Hammedatha the Agagite, exalted him[c][b], and set his throne above all the officials who were with him.
translation:
  language: sw
  text: Baada ya mambo hayo[a], Mfalme Ahasuero alimpandisha cheo Hamani, mwana wa Hamedatha, Mwagagi[b]; akamwinua, na akaweka kiti chake[c] juu ya wakuu wote waliokuwa pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Baada ya matukio hayo.”
    reason: lexical_alternative
  - marker: b
    text: “Mwagagi” huhifadhi designation ya Kiebrania ambayo huenda inaonyesha ukoo, nasaba, au uhusiano na Agagi.
    reason: cultural_note
  - marker: c
    text: Yaani, kiti chake cha mamlaka; au, “akaweka nafasi yake juu ya wakuu wote waliokuwa pamoja naye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Baada ya mambo hayo
  rationale: Huhifadhi kwa njia ya kawaida ya Kiswahili fomula ya Kiebrania inayotambulisha hatua inayofuata katika simulizi; inaweza pia kumaanisha ‘baada ya matukio hayo.’
- source_word: גִּדַּל
  choice: alimpandisha cheo
  rationale: Katika muktadha wa utawala wa kifalme, kitenzi kinaonyesha kuinuliwa kwa hadhi au madaraka, si kufanywa mkubwa kimwili.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Mfalme Ahasuero
  rationale: Mpangilio wa cheo kabla ya jina ni wa kawaida katika Kiswahili, na jina limetoholewa kwa umbo linalotambulika katika matumizi ya Kiswahili.
- source_word: הָמָן
  choice: Hamani
  rationale: Jina limetoholewa kwa umbo la kawaida na linalotambulika katika Kiswahili.
- source_word: בֶּן הַמְּדָתָא
  choice: mwana wa Hamedatha
  rationale: Uhusiano wa mwana na baba umeonyeshwa wazi kama ulivyo katika Kiebrania.
- source_word: הָאֲגָגִי
  choice: Mwagagi
  rationale: Huhifadhi neno la Kiebrania linaloweza kuonyesha ukoo, nasaba, au uhusiano na Agagi bila kulifafanua kupita ushahidi.
- source_word: וַיְנַשְּׂאֵהוּ
  choice: Alimwinua
  rationale: Huhifadhi tendo la pili la kumtukuza au kumweka katika hadhi ya juu bila kulichanganya kabisa na kupandishwa cheo.
- source_word: וַיָּשֶׂם אֶת כִּסְאוֹ
  choice: kukiweka kiti chake
  rationale: ‘Kiti’ kinaweza kumaanisha kiti cha mamlaka na huepuka kudokeza kwamba Hamani alikuwa mfalme; tanbihi inaeleza maana yake ya hadhi rasmi.
- source_word: מֵעַל כָּל הַשָּׂרִים
  choice: juu ya wakuu wote
  rationale: Hueleza hadhi yake iliyozidi ile ya maafisa wengine wa ngazi ya juu katika ikulu.
- source_word: אֲשֶׁר אִתּוֹ
  choice: waliokuwa pamoja naye
  rationale: Huhifadhi rejeleo la kiwakilishi lililo katika Kiebrania; katika muktadha, huenda ‘naye’ anamrejelea mfalme.
