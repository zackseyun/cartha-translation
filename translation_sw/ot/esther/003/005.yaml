  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּ֣רְא הָמָ֔ן כִּי אֵ֣ין מָרְדֳּכַ֔י כֹּרֵ֥עַ וּ/מִֽשְׁתַּחֲוֶ֖ה ל֑/וֹ וַ/יִּמָּלֵ֥א הָמָ֖ן חֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/005.yaml
  text: When Haman saw that Mordecai was neither bowing down nor prostrating himself before him[a], Haman was filled with rage.
translation:
  language: sw
  text: Hamani alipoona kwamba Mordekai hakuwa akipiga magoti wala kujisujudu mbele yake[a], Hamani alijawa na ghadhabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakuwa akiinama wala kumpa heshima.” Kiebrania kinatumia vitenzi viwili vinavyohusiana lakini vilivyo tofauti kwa matendo ya kujishusha kwa heshima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: alipoona
  rationale: Muundo wa masimulizi unaendeleza tukio na hapa unaonyesha wakati; “alipoona” ni wa kawaida na wa asili katika Kiswahili.
- source_word: כִּי אֵין מָרְדֳּכַי
  choice: kwamba Mordekai hakuwa aki-
  rationale: אֵין pamoja na vivumishi-tendaji inaonyesha tendo linaloendelea kukataliwa; “hakuwa aki-” hudumisha hali hiyo.
- source_word: כֹּרֵעַ
  choice: akipiga magoti
  rationale: כרע humaanisha kupinda magoti au kuinama; “kupiga magoti” hapa hutofautisha tendo hili na kujisujudu huku ikifaa muktadha wa heshima ya kifalme.
- source_word: וּמִשְׁתַּחֲוֶה
  choice: wala kujisujudu
  rationale: השתחוה huonyesha kujishusha chini kwa mwili katika tendo la heshima; “kujisujudu” huhifadhi nguvu ya tendo la kimwili bila kulifanya moja tu na kupiga magoti.
- source_word: לוֹ
  choice: mbele yake
  rationale: Ingawa maana ya msingi ni “kwake,” katika Kiswahili matendo haya ya heshima hufanywa kwa kawaida “mbele yake.”
- source_word: וַיִּמָּלֵא ... חֵמָה
  choice: alijawa na ghadhabu
  rationale: Huhifadhi tamathali ya Kiebrania ya kujazwa na hasira kali na ni Kiswahili cha sasa, cha heshima na kinachoeleweka.
- source_word: חֵמָה
  choice: ghadhabu
  rationale: Neno hili huwasilisha hasira kali ya Hamani kwa uzito unaofaa masimulizi bila kuongeza wazo lisilokuwapo katika chanzo.
