  source_fidelity: Tafsiri inawakilisha kwa uaminifu muundo wa simulizi wa וַיַּרְא kwa “alipoona,” hali endelevu iliyokanushwa kwa “hakuwa akipiga magoti wala kujisujudu,” uelekezaji wa tendo kwa Hamani kwa “mbele yake,” na nahau ya וַיִּמָּלֵא ... חֵמָה kwa “alijawa na ghadhabu.” Tofauti kati ya כֹּרֵעַ (kupiga magoti) na מִשְׁתַּחֲוֶה (kujisujudu) imehifadhiwa.
