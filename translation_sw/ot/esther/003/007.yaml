base_translation:
  language: en
  yaml_path: translation/ot/esther/003/007.yaml
  text: In the first month[a], that is, the month of Nisan, in the twelfth year of King Ahasuerus, Pur—that is, the lot—was cast before Haman, from day to day and from month to month, until the twelfth month, that is, the month of Adar.
translation:
  language: sw
  text: Katika mwezi wa kwanza, yaani mwezi wa Nisani, katika mwaka wa kumi na mbili wa Mfalme Ahasuero, Puri—yaani kura—ilipigwa mbele ya Hamani, kutoka siku hadi siku na kutoka mwezi hadi mwezi, mpaka mwezi wa kumi na mbili, yaani mwezi wa Adari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au kwa tafsiri ya karibu zaidi na maneno ya Kiebrania: “kutoka siku hadi siku na kutoka mwezi hadi mwezi, kumi na mbili, yaani mwezi wa Adari.” Maana inaonekana kuwa upigaji kura uliendelea katika kalenda hadi mwezi wa kumi na mbili.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: Katika mwezi wa kwanza
  rationale: Kirai hiki ni usemi wa kawaida wa wakati; tafsiri hii ni ya asili katika Kiswahili na inadumisha mpangilio wa kalenda.
- source_word: הוּא חֹדֶשׁ נִיסָן
  choice: yaani mwezi wa Nisani
  rationale: Kiwakilishi pamoja na nomino kinafafanua jina la mwezi; “yaani” huonyesha wazi ufafanuzi huo.
- source_word: בִּשְׁנַת שְׁתֵּים עֶשְׂרֵה לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: katika mwaka wa kumi na mbili wa Mfalme Ahasuero
  rationale: Hii ni tafsiri ya kawaida na wazi ya mfumo wa kutaja mwaka wa utawala, huku jina la mfalme likinakiliwa kwa umbo linalotumika katika Kiswahili.
- source_word: הִפִּיל פּוּר
  choice: Puri ... ilipigwa
  rationale: Kitenzi hiki ni nahau ya kupiga kura. Kauli tendwa huepuka kuongeza mtendaji ambaye Kiebrania hakumtaji wazi.
- source_word: פּוּר הוּא הַגּוֹרָל
  choice: Puri—yaani kura
  rationale: Neno la mkopo la Kiajemi linahifadhiwa na kisha kufafanuliwa kwa neno la kawaida “kura,” kama ilivyo katika chanzo; pia linadumisha uhusiano na jina Purimu.
- source_word: לִפְנֵי הָמָן
  choice: mbele ya Hamani
  rationale: Hii hudumisha maana ya kufanyika mbele au katika uwepo wa Hamani bila kudai kwamba yeye ndiye aliyeipiga.
- source_word: מִיּוֹם לְיוֹם וּמֵחֹדֶשׁ לְחֹדֶשׁ
  choice: kutoka siku hadi siku na kutoka mwezi hadi mwezi
  rationale: Muundo sambamba wa chanzo umehifadhiwa na unaonyesha mfululizo wa siku na miezi.
- source_word: שְׁנֵים עָשָׂר הוּא חֹדֶשׁ אֲדָר
  choice: mpaka mwezi wa kumi na mbili, yaani mwezi wa Adari
  rationale: “Mpaka” huweka wazi maana inayodokezwa na mwendo wa kalenda, huku tanbihi ikihifadhi muundo wa neno kwa neno na utata wake.
