  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina ya miezi yametolewa kama Nisani na Adari; neno Puri limehifadhiwa na kufafanuliwa mara moja. Alama ya tanbihi imewekwa baada ya dai linalohusika kuhusu kufikia mwezi wa kumi na mbili.
