  text: וַ/יְהִ֗י ב/אמר/ם אֵלָי/ו֙ י֣וֹם וָ/י֔וֹם וְ/לֹ֥א שָׁמַ֖ע אֲלֵי/הֶ֑ם וַ/יַּגִּ֣ידוּ לְ/הָמָ֗ן לִ/רְאוֹת֙ הֲ/יַֽעַמְדוּ֙ דִּבְרֵ֣י מָרְדֳּכַ֔י כִּֽי הִגִּ֥יד לָ/הֶ֖ם אֲשֶׁר ה֥וּא יְהוּדִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/004.yaml
  text: And when they spoke to him day after day and he would not listen to them[a], they told Haman, to see whether Mordecai’s words would stand, for he had told them that he was a Jew.
translation:
  language: sw
  text: Ikawa waliposema naye siku baada ya siku, naye akakataa kuwasikiliza, wakamwambia Hamani ili waone kama maneno ya Mordekai yangesimama[a], kwa maana alikuwa amewaambia kwamba yeye ni Myahudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri nyingine, “kama maelezo ya Mordekai yangethibitika.” Kiebrania kinasema kihalisi, “kama maneno ya Mordekai yangesimama.” Hii inaweza kumaanisha kama sababu aliyotoa ya kukataa kuinama ingekubalika, au kama msimamo wake ungedumu chini ya shinikizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְאָמְרָם אֵלָיו
  choice: Ikawa waliposema naye
  rationale: Muundo huu unaonyesha mpito wa wakati katika simulizi. “Waliposema naye” ni Kiswahili cha kawaida kinachoonyesha kuwa walikuwa wakimweleza au kumsihi Mordekai bila kuongeza jambo lisilotajwa.
- source_word: יוֹם וָיוֹם
  choice: siku baada ya siku
  rationale: Nahau hii inaonyesha kitendo kilichorudiwa kila siku na kusisitiza kuendelea kwao.
- source_word: וְלֹא שָׁמַע אֲלֵיהֶם
  choice: naye akakataa kuwasikiliza
  rationale: Katika muktadha huu שׁמע אֶל humaanisha kusikiliza kwa kuitikia au kutii. “Akakataa kuwasikiliza” huonyesha kwamba kutosikiliza kwake kulikuwa kukataa kwa makusudi na kwa kuendelea.
- source_word: וַיַּגִּידוּ לְהָמָן
  choice: wakamwambia Hamani
  rationale: Kitenzi cha Kiebrania humaanisha kusema, kutoa habari, au kuripoti. “Wakamwambia” ni wazi na cha kawaida katika Kiswahili.
- source_word: לִרְאוֹת
  choice: ili waone
  rationale: Infinitivu hii inaonyesha kusudi la kumwambia Hamani.
- source_word: הֲיַעַמְדוּ דִּבְרֵי מָרְדֳּכַי
  choice: kama maneno ya Mordekai yangesimama
  rationale: Tafsiri hii inadumisha sitiari ya Kiebrania ya maneno ‘kusimama’ na kuacha wazi kama kinachojaribiwa ni uhalali wa maelezo yake au kudumu kwa msimamo wake chini ya shinikizo.
- source_word: כִּי הִגִּיד לָהֶם
  choice: kwa maana alikuwa amewaambia
  rationale: כִּי inatoa sababu ya wao kutoa habari kwa Hamani, na “alikuwa amewaambia” huonyesha kwamba Mordekai alikuwa tayari amefunua jambo hilo.
- source_word: אֲשֶׁר הוּא יְהוּדִי
  choice: kwamba yeye ni Myahudi
  rationale: יְהוּדִי ni jina la utambulisho wa kikabila na kidini. Wakati uliopo “ni” unafaa kwa utambulisho unaoendelea, ingawa taarifa hiyo ilitolewa kabla.
theological_decisions:
- issue: Sababu ya Mordekai kukataa kuinama
  choice: Kudumisha tu taarifa kwamba alikuwa Myahudi bila kueleza kwa nini utambulisho huo ulimfanya akatae
  alternative: Kusema wazi kwamba kuinama kungemaanisha ibada ya sanamu au kuvunja sheria ya Mungu
  rationale: Aya yenyewe haitoi maelezo hayo ya kitheolojia; kuyaongeza kungesuluhisha kimyakimya jambo ambalo simulizi huliacha wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi ya simulizi la Maandiko. Sitiari ya “maneno ... kusimama” imehifadhiwa kwa makusudi, huku tanbihi ikifafanua uwezekano wake bila kuondoa utata wa Kiebrania.
