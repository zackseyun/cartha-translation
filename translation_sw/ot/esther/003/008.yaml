  text: וַ/יֹּ֤אמֶר הָמָן֙ לַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ יֶשְׁנ֣/וֹ עַם אֶחָ֗ד מְפֻזָּ֤ר וּ/מְפֹרָד֙ בֵּ֣ין הָֽ/עַמִּ֔ים בְּ/כֹ֖ל מְדִינ֣וֹת מַלְכוּתֶ֑/ךָ וְ/דָתֵי/הֶ֞ם שֹׁנ֣וֹת מִ/כָּל עָ֗ם וְ/אֶת דָּתֵ֤י הַ/מֶּ֨לֶךְ֙ אֵינָ֣/ם עֹשִׂ֔ים וְ/לַ/מֶּ֥לֶךְ אֵין שֹׁוֶ֖ה לְ/הַנִּיחָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/008.yaml
  text: Then Haman said to King Ahasuerus[a], “There is a certain people, scattered and separated among the peoples in all the provinces of your kingdom. Their laws are different from those of every other people, and they do not keep the king’s laws, so it is not in the king’s interest to let them remain.”
translation:
  language: sw
  text: Kisha Hamani akamwambia Mfalme Ahasuero, “Kuna taifa fulani lililotawanyika na kutengwa kati ya mataifa katika majimbo yote ya ufalme wako. Sheria zao ni tofauti na za mataifa mengine yote, nao hawatii sheria za mfalme. Kwa hiyo, si kwa faida ya mfalme kuwaacha waendelee kuwepo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuwaacha bila kuwasumbua” au “kuwavumilia.” Kitenzi cha Kiebrania kinaweza kumaanisha kumwacha mtu alivyo au kumruhusu aendelee bila kusumbuliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶשְׁנוֹ עַם אֶחָד
  choice: Kuna taifa fulani
  rationale: Kirai hiki kinamtambulisha kwa makusudi bila kumtaja moja kwa moja kundi analolenga Hamani. “Taifa fulani” ni Kiswahili cha kawaida kinachohifadhi sauti yake ya kudokeza.
- source_word: מְפֻזָּר וּמְפֹרָד
  choice: lililotawanyika na kujitenga
  rationale: Maneno yote mawili yamewakilishwa. “Kujitenga” hapa huonyesha kuwa watu hao ni tofauti au wametengwa kati ya wengine, bila kulazimisha maana ya kugawanyika wao kwa wao.
- source_word: בֵּין הָעַמִּים
  choice: kati ya mataifa
  rationale: Katika mazingira ya dola yenye makundi mengi ya kikabila, “mataifa” linaeleweka kwa kawaida kama jamii mbalimbali za watu, si lazima nchi huru.
- source_word: בְּכֹל מְדִינוֹת מַלְכוּתֶךָ
  choice: katika majimbo yote ya ufalme wako
  rationale: מְדִינוֹת katika Esta ni majimbo ya kiutawala; tafsiri hii ni sahihi na ya kawaida.
- source_word: דָתֵיהֶם
  choice: Sheria zao
  rationale: דָּת linaweza kumaanisha sheria, amri au desturi, lakini hapa linalinganishwa moja kwa moja na sheria za mfalme, hivyo “sheria” huhifadhi uzito wa shtaka.
- source_word: שֹׁנוֹת מִכָּל עָם
  choice: ni tofauti na za mataifa mengine yote
  rationale: “Za” linaweka wazi kwa Kiswahili kwamba sheria ndizo zinazolinganishwa, huku “mengine” kikionyesha kwamba taifa hili halihesabiwi tena katika makundi yanayolinganishwa nalo.
- source_word: וְאֶת דָּתֵי הַמֶּלֶךְ אֵינָם עֹשִׂים
  choice: nao hawazishiki sheria za mfalme
  rationale: עָשָׂה pamoja na sheria humaanisha kuzitekeleza au kuzitii. “Kuzishika sheria” ni usemi wa asili na unaoeleweka.
- source_word: וְלַמֶּלֶךְ אֵין שֹׁוֶה
  choice: si kwa faida ya mfalme
  rationale: Kirai hiki hueleza kutokuwa na manufaa au kutofaa kwa mfalme. “Si kwa faida” huhifadhi hoja ya Hamani ya masilahi ya kifalme.
- source_word: לְהַנִּיחָם
  choice: kuwaacha waendelee kuwepo
  rationale: Hifili ya נוח hapa inaweza kumaanisha kuwaacha, kuwaruhusu wabaki, au kutowasumbua. Chaguo hili linaonyesha kuwaruhusu waendelee bila kuamua kimya kimya kati ya maana hizo.
