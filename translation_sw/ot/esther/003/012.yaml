translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kifalme lakini kinachoeleweka kwa wasomaji wa sasa. Muundo wa kutendwa usio na kiima wazi umehifadhiwa pale ulipo katika Kiebrania. Neno la kiutawala “masatrapi” limefafanuliwa kwa tanbihi ili kutofautisha cheo hicho na “magavana”.
