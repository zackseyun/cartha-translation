  text: וַ/יִּקָּרְאוּ֩ סֹפְרֵ֨י הַ/מֶּ֜לֶךְ בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בִּ/שְׁלוֹשָׁ֨ה עָשָׂ֣ר יוֹם֮ בּ/וֹ֒ וַ/יִּכָּתֵ֣ב כְּֽ/כָל אֲשֶׁר צִוָּ֣ה הָמָ֡ן אֶ֣ל אֲחַשְׁדַּרְפְּנֵֽי הַ֠/מֶּלֶךְ וְֽ/אֶל הַ/פַּח֞וֹת אֲשֶׁ֣ר עַל מְדִינָ֣ה וּ/מְדִינָ֗ה וְ/אֶל שָׂ֤רֵי עַם֙ וָ/עָ֔ם מְדִינָ֤ה וּ/מְדִינָה֙ כִּ/כְתָבָ֔/הּ וְ/עַ֥ם וָ/עָ֖ם כִּ/לְשׁוֹנ֑/וֹ בְּ/שֵׁ֨ם הַ/מֶּ֤לֶךְ אֲחַשְׁוֵרֹשׁ֙ נִכְתָּ֔ב וְ/נֶחְתָּ֖ם בְּ/טַבַּ֥עַת הַ/מֶּֽלֶךְ־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/012.yaml
  text: Then the king’s scribes were summoned in the first month[a], on the thirteenth day of it, and it was written exactly as Haman commanded to the king’s satraps, to the governors who were over each province, and to the officials of each people, to every province in its own script and to every people in its own language[b]. It was written in the name of King Ahasuerus and sealed with the king’s signet ring.
translation:
  language: sw
  text: Kisha waandishi wa mfalme waliitwa katika mwezi wa kwanza, siku ya kumi na tatu ya mwezi huo. Ikaandikwa sawasawa na yote ambayo Hamani alikuwa ameamuru, kwa masatrapi[a] wa mfalme, kwa magavana waliokuwa juu ya kila jimbo, na kwa wakuu wa kila taifa—kwa kila jimbo kwa mwandiko wake, na kwa kila taifa kwa lugha yake[b]. Ikaandikwa kwa jina la Mfalme Ahasuero na kutiwa muhuri kwa pete ya muhuri ya mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Masatrapi walikuwa maafisa wakuu wa utawala wa Uajemi waliotawala maeneo makubwa ya milki.
    reason: cultural_note
  - marker: b
    text: “Mwandiko” hapa ni mfumo wa alama za kuandikia uliotumiwa katika kila jimbo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקָּרְאוּ
  choice: waliitwa
  rationale: Niphal inaonyesha hali ya kutendwa; “waliitwa” ni ya kawaida na inafaa katika mazingira rasmi ya utawala.
- source_word: סֹפְרֵי הַמֶּלֶךְ
  choice: waandishi wa mfalme
  rationale: Hawa ni maafisa waliotayarisha nyaraka za kifalme; “waandishi” ni wazi na haiongezi wazo lisilokuwamo la makatibu wa kisasa.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן בִּשְׁלוֹשָׁה עָשָׂר יוֹם בּוֹ
  choice: katika mwezi wa kwanza, siku yake ya kumi na tatu
  rationale: Inahifadhi marejeo ya moja kwa moja ya Kiebrania kwa mwezi huo bila kuongeza jina la mwezi lisilotajwa katika mstari huu.
- source_word: וַיִּכָּתֵב
  choice: ikaandikwa
  rationale: Muundo usio na mtendaji wala nomino wazi umehifadhiwa, badala ya kuongeza “amri” au “hati” kama kiima.
- source_word: כְּכָל אֲשֶׁר צִוָּה הָמָן
  choice: sawasawa na yote ambayo Hamani alikuwa ameamuru
  rationale: “Sawasawa na yote” huonyesha ulinganifu kamili unaosisitizwa na כְּכָל.
- source_word: אֲחַשְׁדַּרְפְּנֵי הַמֶּלֶךְ
  choice: masatrapi wa mfalme
  rationale: Jina maalumu la cheo cha utawala wa Uajemi linadumisha tofauti kati ya maafisa hawa na magavana wanaotajwa baadaye.
- source_word: הַפַּחוֹת
  choice: magavana
  rationale: Ni cheo cha utawala kilicho tofauti na masatrapi; “magavana” kinaeleweka katika Kiswahili cha sasa.
- source_word: שָׂרֵי עַם וָעָם
  choice: wakuu wa kila taifa
  rationale: Katika orodha hii שָׂרִים ni viongozi au maafisa; “wakuu” ni asilia na haibani maana kwa cheo kimoja maalumu.
- source_word: מְדִינָה וּמְדִינָה כִּכְתָבָהּ
  choice: kwa kila jimbo kwa mwandiko wake
  rationale: כְּתָב hapa ni mfumo wa maandishi unaotumiwa na jimbo, si lugha yenyewe.
- source_word: וְעַם וָעַם כִּלְשׁוֹנוֹ
  choice: kwa kila taifa kwa lugha yake
  rationale: Inawakilisha mgawanyo wa mataifa na lugha zao kwa lugha ya kawaida ya Kiswahili.
- source_word: וְנֶחְתָּם בְּטַבַּעַת הַמֶּלֶךְ
  choice: na kutiwa muhuri kwa pete ya muhuri ya mfalme
  rationale: Inabainisha pete ya kifalme iliyotumiwa kuthibitisha waraka bila kuibadili kuwa muhuri wa kawaida.
