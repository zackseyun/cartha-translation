base_translation:
  language: en
  yaml_path: translation/ot/esther/003/009.yaml
  text: If it seems good to the king[a], let it be written that they be destroyed, and I will weigh out ten thousand talents of silver into the hands of those who do the work[c][b], to bring it into the king’s treasuries.
translation:
  language: sw
  text: Kama mfalme akiona inafaa[a], na iandikwe kwamba waangamizwe; nami nitapima talanta elfu kumi za fedha[b] na kuzikabidhi mikononi mwa wale wanaofanya kazi hiyo[c], ili wazilete katika hazina za mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kama ikimpendeza mfalme.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “talanta elfu kumi za fedha,” kiasi kikubwa sana cha fedha kilichopimwa kwa uzito, si dhehebu la sarafu.'
    reason: cultural_note
  - marker: c
    text: Au, “kwa mikono ya wale wanaofanya kazi hiyo,” yaani, kupitia kwa wale waliokuwa wakitekeleza jambo hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  choice: Kama mfalme akiona inafaa
  rationale: Ni usemi wa heshima unaoomba kibali au ridhaa ya mfalme. Kiswahili hiki ni cha kawaida na kinadumisha wazo la jambo kuonekana jema au kufaa machoni pake.
- source_word: יִכָּתֵב
  choice: na iandikwe
  rationale: Nifali ya כתב ina maana halisi ya jambo kuandikwa. Katika muktadha wa kifalme maandishi hayo yana nguvu ya amri, lakini tafsiri haiongezi waziwazi neno lisilokuwamo katika Kiebrania.
- source_word: לְאַבְּדָם
  choice: kwamba waangamizwe
  rationale: Infinitivu yenye kiambishi cha nafsi inaeleza yaliyomo katika maandishi yanayopendekezwa. Kauli ya kutendwa inadumisha muundo na dhamira ya kuwaua kabisa bila mapambo ya ziada.
- source_word: כִּכַּר כֶּסֶף
  choice: talanta ... za fedha
  rationale: כִּכָּר ni kipimo kikubwa cha uzito. Neno la kimapokeo 'talanta' linahifadhi kipimo cha kale bila kukibadili kuwa makadirio ya kisasa yasiyo na uhakika.
- source_word: אֶשְׁקוֹל
  choice: nitapima
  rationale: Kitenzi שקל kimsingi ni kupima kwa uzito. Hapa kinaonyesha utoaji wa fedha iliyopimwa kwa uzito.
- source_word: עַל יְדֵי
  choice: na kuzikabidhi mikononi mwa
  rationale: Usemi huu unaweza kumaanisha 'kwa mkono wa' au kupitia kwa wakala fulani. Hapa Kiswahili hiki kinahifadhi picha ya mikono huku kikionyesha fedha kuwekwa chini ya usimamizi wao.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: wale wanaofanya kazi hiyo
  rationale: Tafsiri hii inaacha utambulisho wao ukiwa mpana kama ulivyo katika Kiebrania, badala ya kuwataja kwa uhakika kuwa maofisa.
- source_word: לְהָבִיא
  choice: ili wazilete
  rationale: Infinitivu ya בוא humaanisha kuleta. Kiambishi 'zi' kinarejelea talanta za fedha kwa namna ya kawaida katika Kiswahili.
- source_word: גִּנְזֵי הַמֶּלֶךְ
  choice: hazina za mfalme
  rationale: Nomino iko katika wingi katika Kiebrania; 'hazina za mfalme' inadumisha wingi huo na ni Kiswahili cha asili.
