  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/יַפְקֵ֨ד הַ/מֶּ֣לֶךְ פְּקִידִים֮ בְּ/כָל מְדִינ֣וֹת מַלְכוּת/וֹ֒ וְ/יִקְבְּצ֣וּ אֶת כָּל נַעֲרָֽה בְ֠תוּלָה טוֹבַ֨ת מַרְאֶ֜ה אֶל שׁוּשַׁ֤ן הַ/בִּירָה֙ אֶל בֵּ֣ית הַ/נָּשִׁ֔ים אֶל יַ֥ד הֵגֶ֛א סְרִ֥יס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/נָּשִׁ֑ים וְ/נָת֖וֹן תַּמְרוּקֵי/הֶֽן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/003.yaml
  text: Let the king appoint officers in all the provinces of his kingdom[a], and let them gather every young virgin of beautiful appearance to Susa the citadel, to the house of the women, into the custody of Hegai the king’s eunuch, keeper of the women[b]; and let their cosmetics be given to them.
translation:
  language: sw
  text: Mfalme na ateue maafisa katika majimbo yote ya ufalme wake, nao wakusanye kila msichana bikira mwenye sura nzuri, na wamlete Shushani, ngome, katika nyumba ya wanawake[a], chini ya uangalizi wa Hegai, towashi wa mfalme na msimamizi wa wanawake; nao wapewe vipodozi vyao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika nyumba ya wanawake wa mfalme.” Kiebrania kinasema kihalisi, “nyumba ya wanawake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nao waandaliwe kwa matibabu ya urembo.” Neno la Kiebrania linaweza kumaanisha vipodozi au maandalizi mapana ya urembo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַפְקֵד
  choice: na ateue
  rationale: Hifili ya פקד hapa ni pendekezo la kumweka mtu rasmi katika kazi; muundo wa 'na ateue' unaendeleza maana ya amri au pendekezo katika muktadha.
- source_word: פְּקִידִים
  choice: maafisa
  rationale: Neno hili linaonyesha watendaji wa kifalme waliopewa jukumu maalumu, bila lazima kuwa maafisa wa kijeshi.
- source_word: מְדִינוֹת מַלְכוּתוֹ
  choice: majimbo yote ya ufalme wake
  rationale: '''Majimbo'' ni istilahi ya kawaida na inayoeleweka kwa maeneo ya utawala wa dola katika kitabu cha Esta.'
- source_word: וְיִקְבְּצוּ
  choice: nao wakusanye
  rationale: Huhifadhi mwendelezo wa pendekezo la kiuamuzi na tendo la kuwaleta watu pamoja kwa agizo la kifalme.
- source_word: כָּל נַעֲרָה בְתוּלָה
  choice: kila msichana bikira
  rationale: '''Msichana'' huhifadhi wazo la ujana, na ''bikira'' hutaja wazi hali iliyoonyeshwa na בתולה.'
- source_word: טוֹבַת מַרְאֶה
  choice: mwenye sura nzuri
  rationale: Hutoa kwa Kiswahili cha kawaida maana halisi ya kuwa mzuri kwa kuonekana.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: Shushani, ngome ya mfalme
  rationale: הבירה hapa ni eneo la kifalme lenye ulinzi au ngome, si mji mkuu kwa lazima; nyongeza 'ya mfalme' hufafanua kwa kawaida bila kupoteza maana ya msingi.
- source_word: בֵּית הַנָּשִׁים
  choice: nyumba ya wanawake
  rationale: Hii ni tafsiri ya karibu ya kirai cha Kiebrania na huepuka kuingiza moja kwa moja istilahi yenye maana pana zaidi ya kitamaduni.
- source_word: אֶל יַד הֵגֶא
  choice: chini ya uangalizi wa Hegai
  rationale: Nahau ya Kiebrania 'katika mkono wa' hapa humaanisha kuwa chini ya mamlaka au uangalizi wa mtu.
- source_word: סְרִיס
  choice: towashi
  rationale: Hii ndiyo maana ya msingi inayofaa hasa kwa mtumishi mwenye jukumu katika nyumba ya wanawake, ingawa katika mazingira fulani neno hilo laweza kumaanisha afisa wa ikulu.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: msimamizi wa wanawake
  rationale: Cheo hiki kinaeleza jukumu la Hegai la kuwaangalia na kuwasimamia wanawake; 'msimamizi' ni wazi na cha kawaida katika Kiswahili.
- source_word: וְנָתוֹן תַּמְרוּקֵיהֶן
  choice: nao wapewe vipodozi vyao
  rationale: Muundo huo unaonyesha kuandaliwa au kutolewa kwa vitu vya kujipamba; 'vipodozi' ni fupi na wazi, huku tanbihi ikihifadhi uwezekano wa matibabu au maandalizi mapana ya urembo.
