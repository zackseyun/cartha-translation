  naturalness: Kiswahili kwa jumla ni sanifu na kinaeleweka. Muundo 'wakusanye ... na kumleta' una mchanganyiko usio laini wa hali ya kitenzi; 'na wamlete' hudumisha mwendelezo wa pendekezo. 'Shushani, ngome' ni apposisheni fupi na ya kawaida.
