  register: Kiswahili Sanifu cha Afrika Mashariki, kwa mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. Maneno ya kiufundi au ya kizamani yameepukwa; “harimu” limewekwa katika tanbihi kwa kuwa ni ufafanuzi wa mazingira badala ya neno la moja kwa moja katika maandishi ya Kiebrania.
