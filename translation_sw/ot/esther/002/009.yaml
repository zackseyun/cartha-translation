base_translation:
  language: en
  yaml_path: translation/ot/esther/002/009.yaml
  text: The young woman pleased him and found favor before him[a], and he quickly provided her with her beauty treatments and her portions, and with seven young women suitable to be given to her from the king’s palace; and he transferred her and her young women to the best place in the women’s house.
translation:
  language: sw
  text: Msichana huyo akampendeza, akapata kibali mbele yake. Akaharakisha kumpa maandalizi yake ya urembo na migawo yake ya chakula, pamoja na wasichana saba waliofaa kupewa kwake kutoka katika jumba la mfalme. Kisha akamhamisha yeye na wasichana wake kwenye sehemu bora ya nyumba ya wanawake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye vyumba bora vya nyumba ya wanawake.” Usemi huu unamaanisha mahali bora ndani ya makao ya wanawake wa kifalme, ambayo mara nyingi hueleweka kuwa harimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: msichana huyo
  rationale: Neno hili humaanisha mtu wa kike aliye kijana. “Msichana” ni la kawaida katika Kiswahili cha sasa na linafaa katika muktadha huu bila kutumia lugha ya kizamani.
- source_word: וַתִּיטַב ... בְעֵינָיו
  choice: akampendeza
  rationale: Nahau ya Kiebrania, kwa maana halisi “akawa mwema machoni pake,” inaeleza kwamba alimridhisha. “Akampendeza” ni ya asili katika Kiswahili na haiongezi maana ya kimapenzi au kingono.
- source_word: וַתִּשָּׂא חֶסֶד לְפָנָיו
  choice: na kupata kibali mbele yake
  rationale: Katika mazingira haya ya ikulu, חֶסֶד inaonyesha kukubaliwa na kutendewa kwa upendeleo mwema. “Kupata kibali mbele yake” huhifadhi namna ya usemi wa chanzo na mazingira ya mahakama ya kifalme.
- source_word: וַיְבַהֵל
  choice: akaharakisha kumpa
  rationale: Kitenzi kinaonyesha kwamba hatua ilichukuliwa kwa haraka; tafsiri hii huhifadhi dhana ya haraka na kuiunganisha kwa kawaida na vitu alivyompa.
- source_word: תַּמְרוּקֶיהָ
  choice: maandalizi yake ya urembo
  rationale: Neno linahusu vitu au matibabu yaliyotumiwa katika maandalizi ya wanawake. “Maandalizi ya urembo” ni pana kuliko “vipodozi” na halipunguzi maana kuwa vitu vya kupaka pekee.
- source_word: מָנוֹתֶיהָ
  choice: mgao wake wa chakula
  rationale: מָנוֹת ni mafungu yaliyotengewa mtu, na katika muktadha huu yanaeleweka hasa kuwa chakula au mahitaji ya kila siku. “Mgao wake wa chakula” ni wazi kwa msomaji wa sasa.
- source_word: שֶׁבַע הַנְּעָרוֹת הָרְאֻיוֹת לָתֶת לָהּ
  choice: wasichana saba waliofaa apewe
  rationale: Tafsiri hii huhifadhi idadi, jinsia na wazo la kufaa kwao, pamoja na hali ya wao kukabidhiwa kwake, bila kuongeza wazi cheo kisichotajwa cha “wahudumu.”
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: kutoka katika jumba la mfalme
  rationale: Ingawa בַּיִת kwa msingi ni “nyumba,” katika mazingira ya kifalme “jumba la mfalme” huwasilisha kwa kawaida makao na utawala wa kifalme.
- source_word: וַיְשַׁנֶּהָ
  choice: akamhamishia
  rationale: Katika muktadha kitenzi kinaonyesha kubadilishwa kwa mahali alikowekwa. “Akamhamishia” huonyesha uhamisho bila kudai wazi cheo au kupandishwa hadhi.
- source_word: לְטוֹב בֵּית הַנָּשִׁים
  choice: sehemu bora ya nyumba ya wanawake
  rationale: Muundo unaonyesha mahali pazuri zaidi ndani ya makao ya wanawake. Tafsiri hii hukaa karibu na Kiebrania, huku tanbihi ikieleza uwezekano wa kuelewa “vyumba bora.”
