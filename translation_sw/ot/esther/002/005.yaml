base_translation:
  language: en
  yaml_path: translation/ot/esther/002/005.yaml
  text: There was a Jewish man in Susa the citadel[a], and his name was Mordecai son of Jair, son of Shimei, son of Kish[c][b], a Benjaminite.
translation:
  language: sw
  text: Kulikuwa na mtu Myahudi[a] katika Shushani, ngome[b], na jina lake lilikuwa Mordekai, mwana wa Yairi, mwana wa Shimei, mwana wa Kishi[c], mtu wa kabila la Benyamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtu wa Yuda.”
    reason: lexical_alternative
  - marker: b
    text: Au “katika ngome ya Shushani.”
    reason: lexical_alternative
  - marker: c
    text: Katika Kiebrania, usemi “mwana wa” unaweza pia kumaanisha mzao wa vizazi vya baadaye katika orodha za nasaba.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ יְהוּדִי
  choice: mtu Myahudi
  rationale: יְהוּדִי inaweza kumaanisha Myahudi au mtu wa Yuda. Katika mazingira ya Wayahudi waliokuwa uhamishoni Uajemi, “Myahudi” huwasilisha kwa kawaida utambulisho wa watu wake bila kudokeza kwamba alikuwa akiishi Yuda.
- source_word: הָיָה
  choice: Kulikuwa na
  rationale: Hapa kitenzi kinamtambulisha mhusika mpya katika simulizi; “Kulikuwa na” ni muundo wa kawaida wa Kiswahili unaolingana na matumizi hayo.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: katika ngome ya Shushani
  rationale: שׁוּשַׁן ni jina la mahali, na הַבִּירָה hurejelea mji wenye ngome au eneo la kifalme lililoimarishwa. “Ngome ya Shushani” ni fupi, ya kawaida, na huhifadhi wazo la eneo lenye ulinzi.
- source_word: וּשְׁמוֹ
  choice: jina lake
  rationale: Muundo huu wa Kiswahili unaendeleza kwa kawaida utambulisho wa mhusika bila kulazimika kurudia kitenzi “lilikuwa.”
- source_word: מָרְדֳּכַי
  choice: Mordekai
  rationale: Jina limetoholewa kwa tahajia inayotambulika katika Kiswahili.
- source_word: בֶּן יָאִיר בֶּן שִׁמְעִי בֶּן קִישׁ
  choice: mwana wa Yairi, mwana wa Shimei, mwana wa Kishi
  rationale: בֶּן kimsingi ni “mwana wa,” lakini katika nasaba inaweza pia kumaanisha mzao wa baadaye. Tafsiri ya moja kwa moja imehifadhiwa, huku tanbihi ikieleza upana wake.
- source_word: אִישׁ יְמִינִי
  choice: mtu wa kabila la Benyamini
  rationale: Kirai hiki kinaonyesha uhusiano wa kikabila na Benyamini. Usemi huu ni wazi na wa kawaida zaidi kwa wasomaji wa sasa kuliko jina la kimakundi lisilozoeleka.
