  text: When the matter became known to Mordecai[a], he told Queen Esther[c][b], and Esther told the king in Mordecai's name.
translation:
  language: sw
  text: Jambo hilo lilipojulikana kwa Mordekai[a], akamwambia Malkia Esta[b], naye Esta akamwambia mfalme kwa jina la Mordekai[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alijulishwa jambo hilo.” Kauli ya Kiebrania inaweza kusisitiza ama kwamba jambo hilo lilimfikia akalijua, ama kwamba mtu fulani alimjulisha.
    reason: lexical_alternative
  - marker: b
    text: Au, “Esta, malkia.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, Esta alisema kwamba taarifa hiyo ilitoka kwa Mordekai. Pia inaweza kutafsiriwa, “kwa niaba ya Mordekai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּדַע
  choice: lilipojulikana
  rationale: Kauli ya kutendwa ya kitenzi ידע inaonyesha kwamba jambo hilo lilifikia kujulikana na Mordekai bila kutaja aliyemjulisha.
- source_word: הַדָּבָר
  choice: jambo hilo
  rationale: דבר ni neno pana, lakini hapa hurejelea jambo lililotajwa katika muktadha wa karibu; 'jambo hilo' ni la kawaida na haliongezi ufafanuzi usiotajwa wazi.
- source_word: לְמָרְדֳּכַי
  choice: kwa Mordekai
  rationale: Kihusishi ל pamoja na kitenzi cha kauli ya kutendwa humtaja mtu ambaye jambo lilijulikana kwake; Kiswahili cha kawaida hutumia 'likajulikana kwa Mordekai'.
- source_word: וַיַּגֵּד
  choice: akamwambia
  rationale: Hifili ya נגד hapa ina maana ya kumweleza au kumpasha mtu habari; 'akamwambia' ni ya asili katika mtiririko huu wa simulizi.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: Esta malkia
  rationale: Huhifadhi mpangilio wa kihusishi wa Kiebrania, 'Esta, malkia,' kwa Kiswahili kinachoeleweka na chenye hadhi.
- source_word: וַתֹּאמֶר ... לַמֶּלֶךְ
  choice: akamwambia mfalme
  rationale: אמר pamoja na ל inaeleza kumwambia mtu jambo; tafsiri hii ni ya kawaida na hudumisha ulinganifu wa tendo la kuripoti.
- source_word: בְּשֵׁם מָרְדֳּכָי
  choice: kwa jina la Mordekai
  rationale: Tafsiri ya karibu ya kifungu hiki huhifadhi wazo la kumtaja Mordekai kuwa chanzo cha taarifa bila kulifasiri kupita kiasi kuwa tu 'kwa niaba yake'.
