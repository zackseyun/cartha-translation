  text: וַ/יֶּאֱהַ֨ב הַ/מֶּ֤לֶךְ אֶת אֶסְתֵּר֙ מִ/כָּל הַ/נָּשִׁ֔ים וַ/תִּשָּׂא חֵ֥ן וָ/חֶ֛סֶד לְ/פָנָ֖י/ו מִ/כָּל הַ/בְּתוּלֹ֑ת וַ/יָּ֤שֶׂם כֶּֽתֶר מַלְכוּת֙ בְּ/רֹאשָׁ֔/הּ וַ/יַּמְלִיכֶ֖/הָ תַּ֥חַת וַשְׁתִּֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/017.yaml
  text: The king loved Esther more than all the women[a], and she found favor and kindness before him more than all the virgins[b]. So he placed the royal crown on her head and made her queen instead of Vashti.
translation:
  language: sw
  text: Mfalme akampenda Esta kuliko wanawake wote, naye akapata kibali na fadhili mbele yake kuliko mabikira wote.[a] Basi akaweka taji la kifalme kichwani mwake, akamfanya kuwa malkia badala ya Vashti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania lililotafsiriwa “mabikira” ni maalumu zaidi kuliko “wanawake” lililotumiwa mapema katika mstari huu; tofauti hiyo imehifadhiwa katika tafsiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: akampenda
  rationale: Kitenzi אהב kinaonyesha upendo au hisia za mapenzi; ‘akampenda’ ni tafsiri ya moja kwa moja na ya kawaida katika muktadha huu.
- source_word: מִכָּל הַנָּשִׁים
  choice: kuliko wanawake wote
  rationale: Muundo wa kulinganisha מן + כל unaelezwa kwa kawaida kwa ‘kuliko ... wote’; ‘wanawake’ huhifadhi maana pana ya נָשִׁים.
- source_word: וַתִּשָּׂא חֵן וָחֶסֶד
  choice: akapata kibali na fadhili
  rationale: Nahau ya Kiebrania, kihalisi ‘akabeba kibali na fadhili,’ huwasilishwa kwa Kiswahili cha kawaida kama ‘akapata’; nomino zote mbili zimehifadhiwa bila kuzifanya kuwa wazo moja.
- source_word: לְפָנָיו
  choice: mbele yake
  rationale: Hii huhifadhi picha ya Kiebrania ya kuwa mbele ya uso au uwepo wake, na ni usemi wa kawaida wa Kiswahili.
- source_word: מִכָּל הַבְּתוּלֹת
  choice: kuliko mabikira wote
  rationale: בְּתוּלֹת ni neno maalumu zaidi kuliko ‘wanawake’ katika kishazi cha kwanza; ‘mabikira’ huhifadhi tofauti hiyo ya kileksika.
- source_word: וַיָּשֶׂם כֶּתֶר מַלְכוּת
  choice: akaweka taji la kifalme
  rationale: ‘Taji la kifalme’ ni Kiswahili cha kawaida kinachohifadhi maana ya taji la ufalme au mamlaka ya kifalme.
- source_word: וַיַּמְלִיכֶהָ
  choice: akamfanya kuwa malkia
  rationale: Hifili ya מלך hapa ina maana ya kumweka mtu katika cheo cha kutawala; kwa muktadha, ‘akamfanya kuwa malkia’ ni wazi na sahihi.
- source_word: תַּחַת וַשְׁתִּי
  choice: badala ya Vashti
  rationale: Katika muktadha wa mrithi au mbadala, תַּחַת humaanisha ‘mahali pa’ au ‘badala ya.’
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi ya kifasihi. Muundo wa simulizi wa ‘aka-’ umetumiwa kuunganisha matendo. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohitaji ufafanuzi.
