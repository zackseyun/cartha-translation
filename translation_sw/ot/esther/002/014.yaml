id: EST.2.14
reference: Esther 2:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בָּ/עֶ֣רֶב הִ֣יא בָאָ֗ה וּ֠/בַ/בֹּקֶר הִ֣יא שָׁבָ֞ה אֶל בֵּ֤ית הַ/נָּשִׁים֙ שֵׁנִ֔י אֶל יַ֧ד שַֽׁעֲשְׁגַ֛ז סְרִ֥יס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/פִּֽילַגְשִׁ֑ים לֹא תָב֥וֹא עוֹד֙ אֶל הַ/מֶּ֔לֶךְ כִּ֣י אִם חָפֵ֥ץ בָּ֛/הּ הַ/מֶּ֖לֶךְ וְ/נִקְרְאָ֥ה בְ/שֵֽׁם׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/014.yaml
  text: In the evening she would go in[a], and in the morning she would return to the second house of the women, into the care of Shaashgaz, the king’s eunuch, keeper of the concubines[b]. She would not go in again to the king unless the king delighted in her and she was summoned by name.
translation:
  language: sw
  text: Jioni angeingia kwa mfalme[a], na asubuhi angerudi katika nyumba ya pili ya wanawake[b], chini ya uangalizi wa Shaashgazi, towashi wa mfalme na msimamizi wa masuria. Hangeingia tena kwa mfalme isipokuwa mfalme alipendezwa naye na akaitwa kwa jina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kuingia kwa mfalme” ni nahau ya Kiebrania kuhusu kuingia katika chumba au mahali alipokuwa mfalme; muktadha unadokeza mahusiano ya kingono bila kuyataja waziwazi.
    reason: cultural_note
  - marker: b
    text: Au, kwa tafsiri yenye kufafanua zaidi, “haremu ya pili.” Kiebrania kinasema kihalisi “nyumba ya pili ya wanawake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֶרֶב הִיא בָאָה
  choice: Jioni angeingia kwa mfalme
  rationale: Kirai cha wakati na muktadha vinaeleza utaratibu uliorudiwa kwa kila mwanamke. Kitenzi בוא ni ‘kuja/kuingia’; ‘angeingia’ ni Kiswahili cha kawaida kinachohifadhi usemi wa Kiebrania bila kueleza wazi zaidi kile kilichodokezwa na muktadha.
- source_word: וּבַבֹּקֶר הִיא שָׁבָה
  choice: na asubuhi angerudi
  rationale: וּ ni kiunganishi sahili, na שׁוב humaanisha kurudi. Hali ya mazoea imewasilishwa kwa ‘angerudi.’
- source_word: בֵּית הַנָּשִׁים שֵׁנִי
  choice: nyumba ya pili ya wanawake
  rationale: Hii inafuata kwa karibu muundo wa Kiebrania, ‘nyumba ya wanawake, ya pili,’ na haibadili usemi huo moja kwa moja kuwa neno la kufasiri ‘haremu.’
- source_word: אֶל יַד שַׁעֲשְׁגַז
  choice: chini ya uangalizi wa Shaashgazi
  rationale: אֶל יַד, kihalisi ‘kwenye mkono wa,’ hapa ina maana ya kuwekwa chini ya usimamizi au uangalizi wa mtu. Jina limetoholewa kwa matamshi yanayofaa Kiswahili.
- source_word: סְרִיס הַמֶּלֶךְ
  choice: towashi wa mfalme
  rationale: Katika mazingira haya ya ikulu ya Uajemi, סריס yaelekea kumaanisha towashi, si afisa kwa ujumla tu.
- source_word: שֹׁמֵר הַפִּילַגְשִׁים
  choice: msimamizi wa masuria
  rationale: שֹׁמֵר ni mwenye kulinda au kusimamia, na פִּילַגְשִׁים ni masuria. ‘Msimamizi’ huonyesha wajibu wake kwa lugha ya sasa na ya kawaida.
- source_word: לֹא תָבוֹא עוֹד אֶל הַמֶּלֶךְ
  choice: Hangeingia tena kwa mfalme
  rationale: ‘Kuingia kwa mfalme’ huhifadhi nahau ya Kiebrania kuhusu kuingia alikokuwa mfalme bila kufanya maana ya kimuktadha iwe wazi zaidi kuliko chanzo.
- source_word: כִּי אִם חָפֵץ בָּהּ הַמֶּלֶךְ
  choice: isipokuwa mfalme alipendezwa naye
  rationale: כִּי אִם huanzisha sharti la pekee, na חפץ ב ina wigo wa kupendezwa, kufurahia, au kutamani. ‘Alipendezwa naye’ huhifadhi wigo huo bila kuufanya uwe tamaa ya kingono tu.
- source_word: וְנִקְרְאָה בְשֵׁם
  choice: na akaitwa kwa jina
  rationale: Kauli tendwa na usemi ‘kwa jina’ zimehifadhiwa; mwanamke angerudi tu baada ya kuitwa yeye binafsi.
