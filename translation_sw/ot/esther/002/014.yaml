translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi wenye heshima na unaoeleweka. Miundo ya ‘angeingia/angerudi/hangeingia’ inaonyesha utaratibu wa kawaida uliomhusu kila mwanamke. Nahau na madokezo ya chanzo yamehifadhiwa bila kuongeza maelezo ya kingono katika matini kuu.
