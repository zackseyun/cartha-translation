base_translation:
  language: en
  yaml_path: translation/ot/esther/002/013.yaml
  text: 'And in this way the young woman went to the king: whatever she said would be given to her to take with her from the house of the women to the king’s house[a][b].'
translation:
  language: sw
  text: 'Kwa namna hii msichana huyo alikwenda kwa mfalme: chochote alichosema[a] angepewa ili aende nacho kutoka katika nyumba ya wanawake[b] hadi nyumba ya mfalme.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chochote alichoomba” au “kila kitu alichoomba.” Kiebrania kwa halisi kinasema “chochote alichosema,” lakini katika muktadha kinamaanisha kile alichoomba aende nacho.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba ya wanawake” ni tafsiri ya karibu ya usemi wa Kiebrania; inarejelea makao ya wanawake.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָזֶה
  choice: Basi, hivi ndivyo
  rationale: Kirai hiki kinatanguliza utaratibu uliokuwa umeelezwa; tafsiri hii ni ya asili katika Kiswahili na huhifadhi maana ya ‘kwa njia hii.’
- source_word: הַנַּעֲרָה
  choice: yule mwanamke kijana
  rationale: Neno נַעֲרָה humaanisha mtu wa kike mwenye umri mdogo. ‘Mwanamke kijana’ ni lugha ya sasa yenye heshima na haidokezi kwa lazima kwamba alikuwa mtoto.
- source_word: בָּאָה אֶל־הַמֶּלֶךְ
  choice: alivyokwenda kwa mfalme
  rationale: Kitenzi בוא pamoja na אֶל hapa kinaeleza kwenda kwa mfalme; ‘kwenda kwa’ ni Kiswahili cha kawaida katika muktadha huu.
- source_word: אֵת כָּל אֲשֶׁר תֹּאמַר
  choice: chochote alichosema
  rationale: Huhifadhi kwa karibu usemi wa Kiebrania, ‘yote ambayo angesema,’ huku muktadha ukionyesha kwamba ni vitu alivyoomba.
- source_word: יִנָּתֵן לָהּ
  choice: angepewa
  rationale: Muundo wa kutendwa wa נתן una maana ya ‘kupewa’; hali ya kitenzi hapa inaonyesha desturi au utaratibu uliokuwa ukifuatwa.
- source_word: לָבוֹא עִמָּהּ
  choice: ili aende nacho
  rationale: Kirai hiki kwa halisi kinaonyesha kitu kilichoandamana naye alipokwenda; ‘aende nacho’ ni wazi na cha kawaida bila kupanua maana kupita kiasi.
- source_word: מִבֵּית הַנָּשִׁים
  choice: kutoka nyumba ya wanawake
  rationale: Tafsiri rasmi huhifadhi picha ya Kiebrania na kuepuka kuingiza neno la kitamaduni ‘harimu’ ambalo halipo wazi katika matini.
- source_word: עַד בֵּית הַמֶּלֶךְ
  choice: mpaka nyumba ya mfalme
  rationale: עַד hudokeza mpaka au hadi, na בֵּית הַמֶּלֶךְ kwa halisi ni ‘nyumba ya mfalme’; tafsiri hii huhifadhi vyote.
