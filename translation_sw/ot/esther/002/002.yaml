translation:
  language: sw
  text: Ndipo vijana wa mfalme waliomhudumia wakasema, “Wamtafutie mfalme wanawake vijana mabikira wenye sura nzuri.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ndipo ... wakasema
  rationale: Waw ya usimulizi inaendeleza mfuatano wa matukio; ‘Ndipo’ ni ya asili katika simulizi la Kiswahili.
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: vijana wa mfalme
  rationale: ‘Vijana’ huhifadhi maana ya umri na kuitofautisha na מְשָׁרְתָיו, ambalo linaeleza wazi kazi yao ya kuhudumu.
- source_word: מְשָׁרְתָיו
  choice: waliomhudumia
  rationale: Kirai rejeshi kinaonyesha kuwa vijana hao walikuwa wakimhudumia mfalme binafsi, kwa lugha ya kawaida na iliyo wazi.
- source_word: יְבַקְשׁוּ לַמֶּלֶךְ
  choice: Mfalme na atafutiwe
  rationale: Kiebrania kina umbo tendaji lisilo na mtendaji aliyetajwa, ‘na watafute kwa ajili ya mfalme’; Kiswahili cha kutendwa kinaacha mtendaji huyo bila kutajwa na kuhifadhi nguvu ya pendekezo/agizo.
- source_word: נְעָרוֹת
  choice: wanawake vijana
  rationale: Hurejelea wanawake wa umri mdogo, si lazima watoto; ‘wanawake vijana’ ni wazi na yenye heshima katika Kiswahili cha sasa.
- source_word: בְּתוּלוֹת
  choice: mabikira
  rationale: Neno hili hutaja wazi wanawake ambao hawajafanya ngono; ‘mabikira’ huhifadhi umahususi wake.
- source_word: טוֹבוֹת מַרְאֶה
  choice: wenye sura nzuri
  rationale: Hii ni tafsiri ya karibu na nahau ya Kiebrania ‘wazuri kwa mwonekano,’ huku ikibaki ya kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘Mfalme na atafutiwe’ unaweka dative לַמֶּלֶךְ wazi na kudumisha kutotajwa kwa wale watakaofanya utafutaji. Hakuna tanbihi iliyohitajika kwa kuwa tofauti za kileksika zinaweza kuwakilishwa wazi katika matini.
