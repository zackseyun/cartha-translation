base_translation:
  language: en
  yaml_path: translation/ot/esther/002/006.yaml
  text: who had been taken into exile from Jerusalem with the exiles who had been taken into exile with Jeconiah king of Judah[a], whom Nebuchadnezzar king of Babylon had taken into exile.
translation:
  language: sw
  text: ambaye alikuwa amepelekwa uhamishoni kutoka Yerusalemu pamoja na wahamishwa waliopelekwa uhamishoni pamoja na Yekonia, mfalme wa Yuda[a], ambaye Nebukadneza, mfalme wa Babeli, alikuwa amempeleka uhamishoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kiwakilishi “ambaye” kinaweza kumrejelea Kishi, mmoja wa mababu wa Mordekai, badala ya Mordekai mwenyewe, kwa kuwa uhamisho wa Yekonia ulitokea vizazi kadhaa mapema.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: ambaye
  rationale: Kiwakilishi rejeshi cha mtu; katika mtiririko wa karibu kinarejelea Mordekai, huku uwezekano wa kurejelea Kishi ukihifadhiwa katika tanbihi.
- source_word: הָגְלָה
  choice: alikuwa amepelekwa uhamishoni
  rationale: Muundo huu unaonyesha tendo la kulazimishwa na pia hali ya wakati uliotangulia simulizi.
- source_word: מִירוּשָׁלַיִם
  choice: kutoka Yerusalemu
  rationale: Tafsiri ya moja kwa moja ya kihusishi na jina la mahali.
- source_word: עִם הַגֹּלָה
  choice: pamoja na wahamishwa
  rationale: Nomino ya pamoja inarejelea watu waliohamishwa, si dhana ya uhamisho pekee.
- source_word: אֲשֶׁר הָגְלְתָה
  choice: waliopelekwa uhamishoni
  rationale: Ingawa kitenzi cha Kiebrania ni umoja wa kike kwa kupatana na nomino ya pamoja, wingi ni wa kawaida na wazi katika Kiswahili.
- source_word: יְכָנְיָה
  choice: Yekonia
  rationale: Unukuzi wa kawaida wa Kiswahili unaofuata umbo la jina lililo katika mstari huu.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Muundo wa kawaida wa uhusiano wa nomino katika Kiswahili.
- source_word: אֲשֶׁר הֶגְלָה
  choice: ambao ... alikuwa amewapeleka uhamishoni
  rationale: Kiwakilishi kinarejelea wahamishwa kama kundi, na Nebukadneza ametajwa wazi kuwa mtendaji; urudiaji wa 'kupeleka uhamishoni' unaakisi mzizi unaorudiwa katika chanzo.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nebukadneza
  rationale: Umbo la jina linalotambulika sana katika matumizi ya Biblia ya Kiswahili.
- source_word: מֶלֶךְ בָּבֶל
  choice: mfalme wa Babeli
  rationale: Tafsiri ya kawaida na wazi ya muundo wa Kiebrania.
theological_decisions:
- issue: Kirejelewa cha kishazi rejeshi katika Esta 2:6
  choice: 'Katika matini kuu, kishazi kinaeleweka kumrejelea Mordekai: “ambaye alikuwa amepelekwa uhamishoni.”'
  alternative: Kishazi kinaweza kumrejelea Kishi, babu wa Mordekai, kwa sababu uhamisho wa Yekonia ulitokea vizazi kadhaa mapema.
  rationale: Mtiririko wa kisarufi unaruhusu usomaji wa karibu unaomrejelea Mordekai, lakini suala la mpangilio wa kihistoria linafanya usomaji unaomrejelea Kishi uwe wa maana. Tanbihi inalinda utata huu badala ya kuutatua kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka. Urudiaji wa “kupelekwa uhamishoni” umehifadhiwa kwa kiasi kikubwa ili kuakisi msisitizo wa mzizi גלה katika Kiebrania.
