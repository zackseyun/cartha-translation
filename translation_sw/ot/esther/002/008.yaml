translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi urudiaji wa Hegai uliomo katika Kiebrania. Tanbihi zimewekwa kwenye vifungu vinavyohusika moja kwa moja; mpangilio wa tanbihi katika safu ya mashauriano ya Kiingereza haukufuatwa kwa kuwa alama zake hazikulingana na maelezo yake.
