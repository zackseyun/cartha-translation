base_translation:
  language: en
  yaml_path: translation/ot/esther/002/008.yaml
  text: And when the king’s command and his decree were heard[a], and when many young women were gathered to Susa the citadel into the custody of Hegai, Esther also was taken into the king’s house, into the custody of Hegai[b], keeper of the women.
translation:
  language: sw
  text: 'Ikawa, amri ya mfalme na agizo lake ziliposikiwa, na wanawake vijana wengi walipokusanywa katika ngome ya Shushani chini ya usimamizi wa Hegai[a], Esta naye akachukuliwa hadi nyumba ya mfalme[b], chini ya usimamizi wa Hegai, msimamizi wa wanawake.


    [a] Au, “mkononi mwa Hegai.”


    [b] Au, “ikulu ya mfalme.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkononi mwa Hegai.”
    reason: Hutoa uwasilishaji wa karibu wa nahau אֶל יַד, huku matini kuu ikieleza maana yake ya kuwekwa chini ya mamlaka au uangalizi wa Hegai.
  - marker: b
    text: Au, “ikulu ya mfalme.”
    reason: בֵּית הַמֶּלֶךְ kwa neno halisi ni “nyumba ya mfalme,” lakini katika muktadha inaweza kurejelea ikulu au makao ya kifalme.
lexical_decisions:
- source_word: דְּבַר
  choice: amri
  rationale: Katika muktadha wa kifalme, neno hili linamaanisha tamko au amri rasmi ya mfalme; “amri” ni wazi na ya kawaida katika Kiswahili.
- source_word: דָת
  choice: agizo
  rationale: Katika mazingira ya ikulu ya Uajemi, neno hili hurejelea agizo rasmi au dekri. “Agizo” ni la asili katika Kiswahili na halidokezi lazima sheria ya kudumu.
- source_word: נְעָרוֹת רַבּוֹת
  choice: wanawake wengi vijana
  rationale: Huwataja wanawake wa umri mdogo unaofaa kuolewa. Tafsiri hii huepuka “wasichana,” ambalo linaweza kudokeza watoto, na haiingizi ubikira ambao haujatajwa na neno hili katika aya hii.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: ngome ya Susa
  rationale: “Ngome” huonyesha eneo la kifalme lililoimarishwa, badala ya kuutaja mji kwa ujumla tu.
- source_word: אֶל יַד
  choice: chini ya usimamizi wa
  rationale: Nahau ya Kiebrania ni “katika/kwenye mkono wa” na hapa humaanisha kuwekwa chini ya mamlaka na uangalizi wa mtu. Tanbihi huhifadhi taswira halisi ya Kiebrania.
- source_word: וַתִּלָּקַח
  choice: akachukuliwa na kupelekwa
  rationale: Umbo tendwa linaonyesha kwamba Esta hakuanzisha kitendo. “Akachukuliwa na kupelekwa” ni la kawaida katika Kiswahili na huhifadhi uwezekano wa kulazimishwa bila kudai wazi kwamba alikamatwa kwa nguvu.
- source_word: בֵּית הַמֶּלֶךְ
  choice: nyumba ya mfalme
  rationale: Hii inafuata kwa karibu maana halisi ya Kiebrania huku ikibaki wazi; katika muktadha inaweza kumaanisha ikulu, kama tanbihi inavyoonyesha.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: msimamizi wa wanawake
  rationale: Hueleza jukumu la Hegai la kuwasimamia na kuwaweka wanawake chini ya mamlaka yake bila kudokeza kwa lazima ulinzi wa fadhili.
- source_word: וַיְהִי בְּהִשָּׁמַע ... וּבְהִקָּבֵץ
  choice: Ikawa ... ziliposikiwa, na ... walipokusanywa
  rationale: Muundo huu huhifadhi mazingira mawili ya wakati na mtiririko wa simulizi ya Kiebrania.
