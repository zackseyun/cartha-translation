translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi mbili zinatumika kwa usomaji wa kawaida huku uhusiano wa vifungu vya Kiebrania ukihifadhiwa. Jina 'Mordekai' linafuata umbo linaloeleweka kwa wasomaji wa Biblia ya Kiswahili.
