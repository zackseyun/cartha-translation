base_translation:
  language: en
  yaml_path: translation/ot/esther/002/020.yaml
  text: Esther had not made known her family line or her people[a], just as Mordecai had commanded her; and Esther kept doing what Mordecai said[b], as when she was under his care.
translation:
  language: sw
  text: Esta hakuwa amefunua ukoo wake wala watu wake[a], kama Mordekai alivyomwamuru; naye Esta aliendelea kufanya yale aliyosema Mordekai[b], kama alivyofanya alipokuwa akilelewa na Mordekai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “asili yake.” Neno la Kiebrania linaweza kumaanisha asili ya kuzaliwa, nasaba, au jamaa.
    reason: lexical_alternative
  - marker: b
    text: Au “kama alipokuwa chini ya ulezi wa Mordekai.” Kiebrania kinakumbusha maisha ya awali ya Esta alipokuwa akilelewa na Mordekai.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין מַגֶּדֶת
  choice: alikuwa hajafunua
  rationale: Muundo wa kukanusha pamoja na kirai cha kitenzi unaonyesha kwamba hadi wakati huo Esta hakuwa amefichua habari hiyo; wakati timilifu uliopita unafaa katika simulizi la Kiswahili.
- source_word: מוֹלַדְתָּהּ
  choice: ukoo wake
  rationale: Neno linaweza kumaanisha asili ya kuzaliwa, nasaba, au jamaa. 'Ukoo wake' ni la kawaida na linaweka maana ya nasaba au kundi la kifamilia bila kuibana mno.
- source_word: עַמָּהּ
  choice: watu wake
  rationale: עם humaanisha watu au taifa; hapa ni utambulisho wa kikabila au kitaifa wa Esta. 'Watu wake' ni pana na ya asili.
- source_word: כַּאֲשֶׁר צִוָּה עָלֶיהָ
  choice: kama Mordekai alivyomwamuru
  rationale: צוה ina nguvu ya amri kuliko ushauri tu; 'alivyomwamuru' inadumisha nguvu hiyo.
- source_word: מַאֲמַר מָרְדֳּכַי
  choice: Mordekai alivyosema
  rationale: מַאֲמַר inaweza kuwa neno, kauli, au amri. Tafsiri hii huepuka kurudia 'amri' huku ikihifadhi utii wa Esta kwa kauli ya Mordekai.
- source_word: עֹשָׂה
  choice: aliendelea kufanya
  rationale: Kirai hiki cha kitenzi kinaweza kuonyesha tendo linaloendelea au desturi; 'aliendelea kufanya' hudhihirisha mwenendo endelevu.
- source_word: בְאָמְנָה אִתּוֹ
  choice: alipokuwa chini ya uangalizi wake
  rationale: Kutokana na אמן kwa maana ya kulelewa au kutunzwa, kifungu kinakumbusha maisha ya awali ya Esta akiwa chini ya ulezi wa Mordekai. 'Chini ya uangalizi wake' ni Kiswahili cha kawaida kisichobana maana kuwa malezi pekee.
