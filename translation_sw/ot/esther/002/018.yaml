review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the banquet, its guests, Esther association, provincial relief, and royal gifts. However, “kwa ukarimu unaomstahili mfalme” means generosity that a king deserves, rather than generosity measured by or appropriate to the king’s capacity; it should be corrected.
  naturalness: The Swahili is generally clear and suitably formal. “Kwa ukarimu wa kifalme” is idiomatic and avoids the grammatical and semantic awkwardness of “unaomstahili mfalme.”
  terminology: “Karamu,” “wakuu,” “watumishi,” “majimbo,” “nafuu,” and “zawadi” are appropriate Standard East African Swahili choices. “Esta” is the conventional Swahili biblical name.
  issues:
  - severity: medium
    issue: The phrase “kwa ukarimu unaomstahili mfalme” misstates the sense of כְּיַד הַמֶּלֶךְ.
    rationale: Unaomstahili means ‘which befits/is deserved by the king,’ potentially making the king the recipient or object of deserving. The Hebrew idiom denotes royal measure, capacity, or bounty in the giving.
  - severity: low
    issue: Footnote b’s “kipimo kinachomfaa mfalme” is less precise than the source idiom’s reference to royal capacity or generosity.
    rationale: The explanation should clarify that the measure of the gifts corresponds to the king’s means or bounty, while retaining the literal image.
  revised_text: Kisha mfalme akawaandalia wakuu wake wote na watumishi wake karamu kubwa—karamu ya Esta. Pia aliyapa majimbo nafuu[a] na kutoa zawadi kwa ukarimu wa kifalme[b].
  revised_footnotes:
