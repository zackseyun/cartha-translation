base_translation:
  language: en
  yaml_path: translation/ot/esther/002/018.yaml
  text: Then the king gave a great banquet for all his officials and servants—the banquet of Esther—and he granted relief to the provinces and gave gifts according to the king’s bounty[a][b].
translation:
  language: sw
  text: Kisha mfalme akawaandalia wakuu wake wote na watumishi wake karamu kubwa—karamu ya Esta. Pia aliyapa majimbo nafuu[a] na kutoa zawadi kwa ukarimu wa kifalme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akayapumzisha majimbo,” “akafanya iwe sikukuu kwa majimbo,” au “akayapa majimbo msamaha.” Neno la Kiebrania linaweza kumaanisha kwa upana nafuu, pumziko, au msamaha.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kulingana na mkono wa mfalme,” nahau inayomaanisha ukarimu wa mfalme au kipimo kinacholingana na uwezo wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁתֶּה גָדוֹל
  choice: karamu kubwa
  rationale: מִשְׁתֶּה ni karamu inayohusisha kunywa; “karamu” ni neno la kawaida na lenye hadhi katika mazingira ya kifalme, na גָדוֹל ni “kubwa.”
- source_word: לְכָל שָׂרָיו וַעֲבָדָיו
  choice: wakuu wake wote na watumishi wake
  rationale: שָׂרִים hapa ni maafisa wenye vyeo vya juu; “wakuu” ni ya asili katika Kiswahili na haibani maana kuwa wana wa kifalme. עֲבָדִים limetafsiriwa “watumishi,” likihifadhi maana pana ya wahudumu wa mfalme.
- source_word: אֵת מִשְׁתֵּה אֶסְתֵּר
  choice: karamu ya Esta
  rationale: Muundo wa hali ya umilikaji umehifadhiwa bila kuamua wazi kama karamu hiyo ilikuwa kwa heshima yake, ili kudumisha uhusiano mpana wa Kiebrania.
- source_word: וַהֲנָחָה לַמְּדִינוֹת עָשָׂה
  choice: aliyapa majimbo nafuu
  rationale: הֲנָחָה linaweza kumaanisha pumziko, nafuu, au msamaha. “Nafuu” huhifadhi upana huo bila kuamua kwamba ulikuwa msamaha wa kodi au sikukuu.
- source_word: מַשְׂאֵת
  choice: zawadi
  rationale: Katika muktadha huu neno linaonyesha vitu vilivyotolewa na mfalme; “zawadi” ni wazi na halibani aina ya vitu hivyo.
- source_word: כְּיַד הַמֶּלֶךְ
  choice: kwa ukarimu unaomstahili mfalme
  rationale: Nahau halisi “kama/kulingana na mkono wa mfalme” inaeleza kipimo cha utoaji kinacholingana na uwezo au ukarimu wa kifalme. Tafsiri hii ni ya asili kwa Kiswahili, huku tanbihi ikihifadhi picha halisi.
- source_word: וַיַּעַשׂ
  choice: akawaandalia
  rationale: Ingawa kitenzi kwa msingi ni “akafanya,” “akawaandalia ... karamu” huwasilisha kwa Kiswahili cha kawaida tendo la mfalme la kuandaa karamu kwa ajili yao.
