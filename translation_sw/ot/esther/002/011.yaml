  text: וּ/בְ/כָל י֣וֹם וָ/י֔וֹם מָרְדֳּכַי֙ מִתְהַלֵּ֔ךְ לִ/פְנֵ֖י חֲצַ֣ר בֵּית הַ/נָּשִׁ֑ים לָ/דַ֨עַת֙ אֶת שְׁל֣וֹם אֶסְתֵּ֔ר וּ/מַה יֵּעָשֶׂ֖ה בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/011.yaml
  text: And every single day Mordecai would walk back and forth in front of the courtyard of the women’s house, to learn how Esther was doing and what would be done with her.
translation:
  language: sw
  text: Kila siku Mordekai alikuwa akitembea huku na huku mbele ya ua wa nyumba ya wanawake, ili kujua hali ya Esta na kile ambacho kingefanywa kwake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְכָל־יוֹם וָיוֹם
  choice: Kila siku
  rationale: Kirai cha Kiebrania kinasisitiza mwendelezo wa kila siku; Kiswahili cha kawaida huwasilisha maana hiyo kwa uwazi bila kurudia neno “siku”.
- source_word: מִתְהַלֵּךְ
  choice: alikuwa akitembea huku na huku
  rationale: Umbo la kitenzi katika muktadha linaonyesha tendo la kurudiwa la kutembea-tembea, si kupita mara moja tu.
- source_word: חֲצַר בֵּית הַנָּשִׁים
  choice: ua wa nyumba ya wanawake
  rationale: Tafsiri ya moja kwa moja inayohifadhi mazingira ya jumba la kifalme na eneo lililotengwa kwa wanawake.
- source_word: אֶת־שְׁלוֹם אֶסְתֵּר
  choice: hali ya Esta
  rationale: Neno שָׁלוֹם hapa linahusu ustawi au hali yake kwa ujumla; “hali ya Esta” ni ya asili na wazi katika Kiswahili.
- source_word: וּמַה־יֵּעָשֶׂה בָּהּ
  choice: na yale ambayo yangempata
  rationale: Kishazi halisi kinaweza kumaanisha kile ambacho kingefanywa kwake au kile ambacho kingetokea kwake; “yangempata” hudumisha upana huo kwa Kiswahili cha kawaida.
