base_translation:
  language: en
  yaml_path: translation/ot/esther/002/007.yaml
  text: He was bringing up Hadassah—that is[a], Esther—the daughter of his uncle, because she had neither father nor mother. The young woman was beautiful in form and attractive in appearance, and when her father and her mother died[b], Mordecai took her as his own daughter.
translation:
  language: sw
  text: Naye alikuwa akimlea Hadasa—yaani, Esta—binti wa ami yake,[a] kwa sababu hakuwa na baba wala mama. Msichana huyo alikuwa na umbo zuri na sura ya kupendeza. Wakati baba na mama yake walipokufa, Mordekai alimchukua awe binti yake mwenyewe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, binamu yake. Kiebrania kinasema moja kwa moja, “binti wa ami yake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Mordekai alimchukua kwake kuwa binti.” Kiebrania kinasema moja kwa moja kwamba alimchukua kwake kuwa binti.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמֵן
  choice: alikuwa akimlea
  rationale: Kitenzi katika hali ya participle kinaonyesha jukumu la Mordekai lililoendelea la kumtunza na kumkuza Hadasa; ‘alikuwa akimlea’ ni Kiswahili cha kawaida na hakiongezi wazo la uangalizi wa kisheria.
- source_word: הֲדַסָּה הִיא אֶסְתֵּר
  choice: Hadasa—yaani, Esta
  rationale: Kiwakilishi הִיא kinatambulisha majina mawili ya mtu yuleyule; ‘yaani’ linaonyesha uhusiano huo wazi na kwa kawaida.
- source_word: בַּת דֹּדוֹ
  choice: binti ya ami yake
  rationale: Neno דּוֹד hapa linamtaja ami wa Mordekai. Tafsiri hii inahifadhi maelezo ya moja kwa moja ya undugu badala ya kutumia tu neno la uhusiano unaotokana, ‘binamu’.
- source_word: כִּי אֵין לָהּ אָב וָאֵם
  choice: kwa sababu hakuwa na baba wala mama
  rationale: Inatafsiri kauli ya Kiebrania moja kwa moja na kudumisha kutajwa wazi kwa wazazi wote wawili badala ya kufupisha kwa kusema tu ‘alikuwa yatima’.
- source_word: הַנַּעֲרָה
  choice: Msichana huyo
  rationale: נַעֲרָה humaanisha msichana au mwanamke kijana. ‘Msichana huyo’ ni ya kawaida katika muktadha huu na inaendeleza rejeleo kwa Esta.
- source_word: יְפַת תֹּאַר
  choice: alikuwa na umbo zuri
  rationale: Kirai hiki kinaeleza uzuri wa umbo la mwili. Tafsiri hii ni ya wazi, ya staha, na inatofautishwa na maelezo yanayofuata kuhusu sura.
- source_word: טוֹבַת מַרְאֶה
  choice: na sura ya kupendeza
  rationale: Kirai kinaeleza mwonekano wenye kuvutia. ‘Sura ya kupendeza’ ni Kiswahili cha asili na hakirudii tu ‘umbo zuri’.
- source_word: וּבְמוֹת אָבִיהָ וְאִמָּהּ
  choice: Baada ya baba na mama yake kufa
  rationale: Muundo wa Kiebrania unaonyesha hali ya wakati inayohusiana na kifo cha wazazi wake. ‘Baada ya ... kufa’ ni ya asili na inafaa mfuatano wa simulizi.
- source_word: לְקָחָהּ מָרְדֳּכַי לוֹ לְבַת
  choice: Mordekai alimchukua awe binti yake mwenyewe
  rationale: Hii inawasilisha maana ya kumchukua kwake kuwa binti bila kuingiza moja kwa moja taratibu rasmi za kisheria zinazoweza kudokezwa na ‘alimwasili’.
