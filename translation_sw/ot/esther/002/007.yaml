translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wa heshima, na unaoeleweka kwa urahisi. Majina yameandikwa Hadasa, Esta, na Mordekai kwa maumbo yanayofaa matamshi ya Kiswahili. Tofauti kati ya uzuri wa umbo na uzuri wa sura imehifadhiwa.
