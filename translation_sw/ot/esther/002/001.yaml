  text: אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה כְּ/שֹׁ֕ךְ חֲמַ֖ת הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֑וֹשׁ זָכַ֤ר אֶת וַשְׁתִּי֙ וְ/אֵ֣ת אֲשֶׁר עָשָׂ֔תָה וְ/אֵ֥ת אֲשֶׁר נִגְזַ֖ר עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/001.yaml
  text: After these things[a], when the anger of King Ahasuerus had subsided, he remembered Vashti, what she had done[b], and what had been decreed against her.
translation:
  language: sw
  text: Baada ya mambo hayo, hasira ya Mfalme Ahasuero ilipotulia, alimkumbuka Vashti, yale aliyokuwa amefanya, na yale yaliyoamuliwa dhidi yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Baada ya mambo hayo
  rationale: Ni fomula ya wakati inayoanzisha tukio linalofuata; tafsiri hii inahifadhi nahau ya Kiebrania na ni ya kawaida katika Kiswahili.
- source_word: כְּשֹׁךְ חֲמַת
  choice: hasira ... ilipotulia
  rationale: Kitenzi שכך kinaonyesha kupungua au kutulia kwa hasira; kishazi cha wakati kinafaa kiasili katika Kiswahili.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Mfalme Ahasuero
  rationale: Cheo kinawekwa kabla ya jina kwa mtindo wa kawaida wa Kiswahili, huku jina likinakiliwa kwa umbo linalotumika katika Biblia za Kiswahili.
- source_word: זָכַר אֶת וַשְׁתִּי
  choice: alimkumbuka Vashti
  rationale: Hii ni tafsiri ya moja kwa moja na ya asili ya tendo la kumleta mtu akilini.
- source_word: וְאֵת אֲשֶׁר עָשָׂתָה
  choice: yale aliyokuwa amefanya
  rationale: Muundo huu unaonyesha mambo aliyoyafanya kabla ya wakati wa mfalme kuyakumbuka.
- source_word: וְאֵת אֲשֶׁר נִגְזַר עָלֶיהָ
  choice: yale yaliyoamuliwa dhidi yake
  rationale: Nifali נִגְזַר inaonyesha uamuzi rasmi uliotolewa, na עָלֶיהָ hapa ina maana ya kumwathiri vibaya.
