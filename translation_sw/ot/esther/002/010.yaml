  yaml_path: translation/ot/esther/002/010.yaml
  text: Esther had not disclosed her people or her kindred[a], because Mordecai had commanded her not to disclose it.
translation:
  language: sw
  text: Esta hakuwa amefunua watu wake wala ukoo wake[a], kwa sababu Mordekai alikuwa amemwamuru asifunue jambo hilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “asili yake.” Neno la Kiebrania linaweza kumaanisha ukoo, jamaa, au asili ya mtu; hapa huenda zaidi linarejelea nasaba ya kifamilia ya Esta.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּידָה
  choice: hakuwa amefunua
  rationale: Hifili ya נגד humaanisha kujulisha au kufichua. Katika muktadha wa kuficha utambulisho, “kufunua” ni ya kawaida na huhifadhi wazo la kutoweka jambo wazi; wakati uliotangulia unafaa kwa maelezo haya ya usuli wa simulizi.
- source_word: עַמָּהּ
  choice: watu wake
  rationale: עַם humaanisha jumuiya ya kikabila au kitaifa. “Watu wake” huhifadhi upana huo bila kuibana maana kuwa uraia pekee.
- source_word: מוֹלַדְתָּהּ
  choice: ukoo wake
  rationale: מוֹלֶדֶת inaweza kuonyesha jamaa, nasaba, au asili ya kuzaliwa. “Ukoo wake” ni Kiswahili cha asili kinachotofautisha nasaba ya kifamilia na “watu wake,” huku kikiweka uwezekano wa maana ya jamaa au asili.
- source_word: צִוָּה עָלֶיהָ
  choice: alikuwa amemwamuru
  rationale: צוה ni kitenzi chenye nguvu cha kutoa amri. “Kumwamuru” huhifadhi nguvu hiyo, na umbo la wakati uliotangulia huonyesha kuwa amri ilitolewa kabla.
- source_word: אֲשֶׁר לֹא תַגִּיד
  choice: asifunue jambo hilo
  rationale: Kishazi hiki kinaeleza maudhui ya amri. “Jambo hilo” hurejelea taarifa kuhusu watu na ukoo wake, na kurudia “funua” hudumisha mshikamano wa kitenzi cha Kiebrania kilichorudiwa.
- source_word: אֶסְתֵּר
  choice: Esta
  rationale: Jina limeandikwa kwa umbo la kawaida la Kiswahili cha Biblia.
