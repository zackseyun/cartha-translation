  text: וּ/בְ/הִקָּבֵ֥ץ בְּתוּל֖וֹת שֵׁנִ֑ית וּ/מָרְדֳּכַ֖י יֹשֵׁ֥ב בְּ/שַֽׁעַר הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/019.yaml
  text: When the virgins were gathered a second time[b][a], Mordecai was sitting at the king's gate.
translation:
  language: sw
  text: Mabikira walipokusanywa mara ya pili[a], Mordekai alikuwa ameketi langoni mwa mfalme.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tena.” Kiebrania kinasema kihalisi “mara ya pili.”
    reason: lexical_alternative
  - marker: b
    text: Huenda “lango la mfalme” linamaanisha eneo la lango la jumba la kifalme, mahali palipohusishwa na utumishi rasmi na shughuli za utawala.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְהִקָּבֵץ
  choice: walipokusanywa
  rationale: Muundo wa kihusishi pamoja na kitenzi-jina unatambulisha kishazi cha wakati, na umbo la kutendwa la Kiebrania limehifadhiwa kwa ‘walipokusanywa’.
- source_word: בְּתוּלוֹת
  choice: mabikira
  rationale: Neno hili linataja kwa wazi wanawake ambao hawajafanya ngono; ‘mabikira’ ni tafsiri ya moja kwa moja na ya kawaida katika muktadha huu.
- source_word: שֵׁנִית
  choice: mara ya pili
  rationale: Huhifadhi wazi maana ya Kiebrania ya tukio kutokea kwa mara ya pili, badala ya kutumia tu ‘tena’.
- source_word: וּמָרְדֳּכַי
  choice: Mordekai
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: יֹשֵׁב
  choice: alikuwa ameketi
  rationale: Kivumishi-tendaji cha Kiebrania kinaonyesha hali inayoendelea; ‘alikuwa ameketi’ huonyesha kwamba Mordekai alikuwa katika hali hiyo wakati huo.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: langoni mwa mfalme
  rationale: Hii ni Kiswahili cha asili kinachoonyesha mahali katika eneo la lango la jumba la kifalme bila kulifanya lango lenyewe kuwa mali ya mtu binafsi tu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi ulio wazi na wenye hadhi. ‘Mabikira’ huhifadhi umahususi wa neno la Kiebrania, na ‘alikuwa ameketi’ huhifadhi hali endelevu ya kitenzi.
