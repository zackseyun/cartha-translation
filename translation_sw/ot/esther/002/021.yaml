  to: Siku hizo, Mordekai alipokuwa ameketi kwenye lango la mfalme, Bigtani na Tereshi, matowashi wawili wa mfalme[a] waliokuwa miongoni mwa walinzi wa kizingiti, walikasirika na kutafuta kunyoosha mkono dhidi ya Mfalme Ahasuero[b].
