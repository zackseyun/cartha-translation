base_translation:
  language: en
  yaml_path: translation/ot/esther/002/021.yaml
  text: In those days[a], while Mordecai was sitting at the king’s gate, Bigthan and Teresh, two of the king’s eunuchs from those who guarded the threshold[b], became angry and sought to lay hands on King Ahasuerus.
translation:
  language: sw
  text: Siku hizo, Mordekai alipokuwa ameketi kwenye lango la mfalme, Bigtani na Tereshi, matowashi wawili wa mfalme[a] waliokuwa miongoni mwa walinzi wa kizingiti, walikasirika na kutafuta kunyoosha mkono dhidi ya Mfalme Ahasuero[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maafisa wa ikulu ya mfalme”; neno la Kiebrania linaweza kutaja maafisa wa kifalme kwa maana pana zaidi, ingawa “matowashi” linaelekea kufaa katika mazingira haya ya ikulu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kunyoosha mkono dhidi ya”; yaani, kumshambulia au kumuua mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Siku hizo
  rationale: Ni fomula ya kawaida ya Kiebrania ya kutaja wakati katika simulizi; tafsiri hii ni ya asili na haibainishi muda kupita kiasi.
- source_word: יֹשֵׁב
  choice: alipokuwa ameketi
  rationale: Kauli shirikishi inaonyesha hali iliyokuwa ikiendelea wakati wa tukio; 'ameketi' inafaa kwa mandhari ya lango kuliko maana pana ya kukaa mahali.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: kwenye lango la mfalme
  rationale: Inahifadhi taswira ya eneo rasmi la lango lililohusishwa na utawala wa kifalme kwa Kiswahili cha kawaida.
- source_word: קָצַף
  choice: walikasirika
  rationale: Ingawa kitenzi cha Kiebrania kina umbo la umoja kabla ya kiima ambatani, kinawahusu Bigthani na Tereshi wote; tafsiri haiongezi kiwango cha hasira kisichotajwa.
- source_word: סָרִיסֵי הַמֶּלֶךְ
  choice: matowashi wawili wa mfalme
  rationale: Katika mazingira ya ikulu ya Uajemi, neno hilo linaelekea kumaanisha matowashi, ingawa pia linaweza kutaja maafisa wa kifalme; maana pana imehifadhiwa katika tanbihi.
- source_word: מִשֹּׁמְרֵי הַסַּף
  choice: waliokuwa miongoni mwa walinzi wa kizingiti
  rationale: Inabainisha wajibu wao katika ikulu na kuhifadhi taswira halisi ya סַף, 'kizingiti,' huku ikionyesha kuwa walikuwa sehemu ya kundi la walinzi.
- source_word: וַיְבַקְשׁוּ
  choice: kutafuta
  rationale: Hufuata kwa karibu maana ya 'kutaka/kutafuta' na kuonyesha nia yao bila kuongeza wazi wazo la njama ambalo halimo moja kwa moja katika kitenzi.
- source_word: לִשְׁלֹחַ יָד
  choice: kumnyooshea mkono
  rationale: Inahifadhi nahau halisi ya Kiebrania kuhusu tendo la uhasama bila kuifungia mapema katika aina moja tu ya shambulio; maana yake imefafanuliwa katika tanbihi.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasuero
  rationale: Jina limetoholewa kutokana na umbo la Kiebrania kwa namna iliyozoeleka katika Kiswahili, badala ya kubadilishwa na utambulisho wa kihistoria 'Xerxes'.
