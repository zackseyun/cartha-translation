    issue: Nahau «kumnyooshea mkono» si sahihi vya kutosha kwa לִשְׁלֹחַ יָד בְּ.
    rationale: Usemi huo unaweza kueleweka kuwa kuashiria mtu kwa mkono. «Kunyoosha mkono dhidi ya» huhifadhi idiomu ya chanzo na mwelekeo wake wa uhasama bila kuibainisha kupita kiasi.
  - severity: low
    issue: Tahajia «Bigthani» imeingiza th ambayo haionekani katika jina la Kiebrania.
    rationale: «Bigtani» ni tahajia ya Kiswahili inayofaa zaidi kwa בִּגְתָן na inayopatana na matumizi ya kawaida ya Biblia ya Kiswahili.
  - severity: low
    issue: Tafsiri ya kihalisi katika tanbihi b, «kupeleka mkono dhidi ya», si mwafaka zaidi kwa nahau ya Kiebrania.
    rationale: Kitenzi לִשְׁלֹחַ ni “kutuma/kunyoosha”; katika Kiswahili «kunyoosha mkono dhidi ya» ni wazi na hufuata matini.
