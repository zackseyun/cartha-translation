  verdict: revise
  source_fidelity: 'Maana kuu imehifadhiwa: Mordekai yuko langoni mwa mfalme, Bigthani na Tereshi ni watumishi wawili wa mfalme waliolinda kizingiti, wakakasirika na wakatafuta kumdhuru mfalme. Hata hivyo, «kumnyooshea mkono» katika Kiswahili kwa kawaida humaanisha kumwelekezea/kuashiria kwa mkono, wala haitoi kwa uwazi nahau ya Kiebrania ya kunyoosha au kupeleka mkono dhidi ya mtu kwa kusudi la uhasama.'
  naturalness: Sentensi kwa ujumla ni ya asili na yenye hadhi inayofaa simulizi. «Kutafuta kunyoosha mkono dhidi ya» ni usemi wa karibu zaidi na nahau ya kibiblia na unaeleweka vizuri zaidi katika muktadha huu.
  terminology: «Matowashi» ni chaguo linalokubalika kwa סָרִיסֵי, huku tanbihi ikihifadhi uwezekano wa maana pana ya maafisa wa ikulu. «Walinzi wa kizingiti» huhifadhi maana ya מִשֹּׁמְרֵי הַסַּף. Tahajia ya jina iwe «Bigtani», inayolingana na umbo lililozoeleka katika Kiswahili na bila kuongeza herufi h isiyopo katika Kiebrania.
  issues:
