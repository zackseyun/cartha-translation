base_translation:
  language: en
  yaml_path: translation/ot/esther/002/023.yaml
  text: When the matter was investigated and found to be so[a], both of them were hanged on a tree, and it was written in the book of the chronicles in the presence of the king.
translation:
  language: sw
  text: Jambo hilo lilipochunguzwa na kubainika kuwa ni kweli, wote wawili wakatundikwa kwenye mti[a]. Hayo yakaandikwa katika kitabu cha kumbukumbu za matukio mbele ya mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakapigiliwa kwenye mti/nguzo.” Kiebrania husema kwa maana ya moja kwa moja “wakatundikwa kwenye mti,” lakini njia kamili ya Kiajemi ya kutekeleza hukumu haijulikani kwa uhakika; huenda ilihusisha kupigiliwa au kutundikwa hadharani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבֻקַּשׁ הַדָּבָר
  choice: Jambo hilo lilipochunguzwa
  rationale: Kauli hii inaonyesha uchunguzi rasmi wa taarifa kuhusu njama. “Lilipochunguzwa” ni Kiswahili cha kawaida kinachohifadhi hali ya kutendwa na muktadha wa kisheria.
- source_word: וַיִּמָּצֵא
  choice: ikagundulika kuwa ni kweli
  rationale: Katika muktadha huu, matokeo ya uchunguzi ni kwamba taarifa hiyo ilithibitishwa. Tafsiri hii inaweka wazi maana iliyodokezwa na Kiebrania bila kuongeza maelezo mapya.
- source_word: וַיִּתָּלוּ
  choice: wakatundikwa
  rationale: Kitenzi תלה kimsingi humaanisha kutundika au kuangika, na hakibainishi kwa uhakika kama waliuawa kwa kunyongwa kwa kamba au kwa kuchomwa mtini. “Wakatundikwa” huhifadhi upana huo wa maana.
- source_word: שְׁנֵיהֶם
  choice: wote wawili
  rationale: Usemi huu unaonyesha wazi kwamba wale watu wawili walipatwa na adhabu hiyo pamoja.
- source_word: עַל עֵץ
  choice: juu ya mti
  rationale: עֵץ humaanisha “mti” au kitu cha mbao. Tafsiri ya moja kwa moja “juu ya mti” inadumisha taswira ya chanzo, huku tanbihi ikieleza uwezekano wa mti kuwa nguzo ya mbao.
- source_word: וַיִּכָּתֵב
  choice: likaandikwa
  rationale: Hii inahifadhi hali ya kutendwa ya kitenzi כתב na inafaa kwa taarifa iliyowekwa katika kumbukumbu rasmi.
- source_word: בְּסֵפֶר דִּבְרֵי הַיָּמִים
  choice: katika kitabu cha kumbukumbu za matukio
  rationale: Kirai hiki kinarejelea kumbukumbu rasmi za matukio ya utawala. “Kitabu cha kumbukumbu za matukio” ni wazi na cha asili katika Kiswahili cha kisasa.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: mbele ya mfalme
  rationale: Tafsiri hii inafuata maana ya msingi ya לִפְנֵי na kuhifadhi uwezekano kwamba rekodi hiyo iliandikwa mbele ya mfalme au chini ya uangalizi wake.
