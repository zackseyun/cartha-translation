base_translation:
  language: en
  yaml_path: translation/ot/esther/002/016.yaml
  text: So Esther was taken to King Ahasuerus[a], into his royal palace, in the tenth month, which is the month Tebeth[b], in the seventh year of his reign.
translation:
  language: sw
  text: Basi Esta akapelekwa kwa Mfalme Ahasuero[a], ndani ya jumba lake la kifalme, katika mwezi wa kumi, yaani mwezi wa Tebethi[b], katika mwaka wa saba wa utawala wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaletwa kwa Mfalme Ahasuero.” Kitenzi cha Kiebrania kiko katika kauli ya kutendwa, kikisisitiza kwamba Esta ndiye aliyefanyiwa tendo hilo.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “mwezi wa Tebethi,” jina la Kibabeli la mwezi wa kumi.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּלָּקַח
  choice: akapelekwa
  rationale: Kitenzi cha Kiebrania kiko katika kauli ya kutendwa; “akapelekwa” kinahifadhi msisitizo kwamba Esta alitendewa tendo hilo, huku kikiwa cha kawaida katika Kiswahili.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Mfalme Ahasuero
  rationale: Mpangilio huu wa cheo na jina ni wa kawaida katika Kiswahili na unahifadhi vipengele vyote vya Kiebrania.
- source_word: אֶל בֵּית מַלְכוּתוֹ
  choice: ndani ya jumba lake la kifalme
  rationale: Kirai hicho kihalisi kinahusu nyumba ya ufalme wake; katika muktadha kinamaanisha makao ya kifalme, na “ndani ya” linaonyesha kuingia humo.
- source_word: בַּחֹדֶשׁ הָעֲשִׂירִי
  choice: katika mwezi wa kumi
  rationale: Hii ni tafsiri ya moja kwa moja na ya asili ya usemi wa wakati.
- source_word: הוּא חֹדֶשׁ טֵבֵת
  choice: yaani mwezi wa Tebethi
  rationale: “Yaani” linaonyesha wazi kwamba jina linalofuata linaitambulisha mwezi wa kumi.
- source_word: טֵבֵת
  choice: Tebethi
  rationale: Ni unukuzi unaolingana na muundo wa sauti na tahajia ya Kiswahili kwa jina la mwezi wa Kiebrania.
- source_word: בִּשְׁנַת שֶׁבַע לְמַלְכוּתוֹ
  choice: mwaka wa saba wa utawala wake
  rationale: Huu ni usemi wa kawaida wa Kiswahili kwa kutaja mwaka wa utawala wa mfalme.
