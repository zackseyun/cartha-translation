base_translation:
  language: en
  yaml_path: translation/ot/esther/002/004.yaml
  text: And let the young woman who pleases the king become queen instead of Vashti[a]. The proposal pleased the king[c][b], and he did so.
translation:
  language: sw
  text: Na msichana atakayempendeza mfalme awe malkia badala ya Vashti.[a] Shauri hilo likampendeza mfalme,[b] naye akafanya hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kwa maana halisi: “atawale badala ya Vashti.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “Jambo hilo likaonekana jema machoni pa mfalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: msichana
  rationale: Neno נַעֲרָה humaanisha mwanamke kijana. Katika Kiswahili cha sasa, “msichana” ni neno la kawaida na linaloeleweka katika muktadha huu.
- source_word: אֲשֶׁר תִּיטַב בְּעֵינֵי הַמֶּלֶךְ
  choice: atakayempendeza mfalme
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kuwa mzuri au wa kupendeza kwa uamuzi wa mfalme. “Atakayempendeza mfalme” ni ya asili katika Kiswahili na huhifadhi maana bila kutafsiri nahau neno kwa neno.
- source_word: תִּמְלֹךְ
  choice: awe malkia
  rationale: Kitenzi מלך kimsingi ni “kutawala,” lakini hapa kinamhusu msichana atakayechukua nafasi ya Vashti. “Awe malkia” huwasilisha kwa uwazi nafasi inayokusudiwa, huku tafsiri halisi zaidi ikiwekwa katika tanbihi.
- source_word: תַּחַת וַשְׁתִּי
  choice: badala ya Vashti
  rationale: תַּחַת hapa huonyesha ubadilishaji wa mtu mmoja na mwingine, si mahali pa chini yake.
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי הַמֶּלֶךְ
  choice: Shauri hilo likampendeza mfalme
  rationale: דָּבָר katika muktadha huu ni jambo au shauri lililotolewa katika mstari uliotangulia. “Shauri hilo” linaunganisha sentensi kwa kawaida, na “likampendeza” huakisi kurudiwa kwa nahau ya Kiebrania.
- source_word: וַיַּעַשׂ כֵּן
  choice: naye akafanya hivyo
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kauli ya kisimulizi kwamba mfalme alitekeleza shauri hilo.
