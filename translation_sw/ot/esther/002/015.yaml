base_translation:
  language: en
  yaml_path: translation/ot/esther/002/015.yaml
  text: When Esther’s turn came—the daughter of Abihail[a], the uncle of Mordecai, who had taken her as his own daughter—to go in to the king, she asked for nothing except what Hegai, the king’s eunuch, keeper of the women, advised[b]. And Esther was gaining favor in the eyes of all who saw her.
translation:
  language: sw
  text: Ilipofika zamu ya Esta—binti wa Abihaili, mjomba wa Mordekai, ambaye alikuwa amemchukua kuwa binti yake[a]—ya kwenda kwa mfalme, hakuomba kitu chochote isipokuwa kile alichosema Hegai, towashi wa mfalme, msimamizi wa wanawake.[b] Naye Esta akapata kibali machoni pa wote waliomwona.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa amemlea kama binti yake.” Nahau ya Kiebrania inaonyesha kwamba Mordekai alimchukua Esta chini ya malezi yake kama binti.
    reason: lexical_alternative
  - marker: b
    text: Neno “towashi” linaweza katika baadhi ya miktadha kutafsiriwa kwa maana pana kuwa “afisa wa ikulu,” lakini mazingira ya makao ya wanawake hapa yanaunga mkono maana hii mahususi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַגִּיעַ תֹּר
  choice: Ilipofika zamu
  rationale: Muundo wa kihusishi pamoja na kitenzi-jina unaanzisha kishazi cha wakati, na תֹּר ni zamu iliyopangwa ya kila mwanamke kwenda kwa mfalme.
- source_word: דֹּד מָרְדֳּכַי
  choice: mjomba wa Mordekai
  rationale: Katika muktadha wa uhusiano wa kifamilia uliotajwa katika Esta 2:7, דֹּד humtaja Abihaili kuwa mjomba wa Mordekai.
- source_word: לָקַח לוֹ לְבַת
  choice: alikuwa amemchukua kuwa binti yake
  rationale: Hifadhi nahau ya Kiebrania inayoonyesha kwamba Mordekai alimlea Esta kama binti, bila kudai kwa lazima mchakato rasmi wa kisheria wa kuasili.
- source_word: לָבוֹא אֶל־הַמֶּלֶךְ
  choice: kwenda kwa mfalme
  rationale: Hueleza kuingia mbele ya mfalme kwa lugha ya staha na kuacha dokezo la muktadha bila kulifanya wazi zaidi ya chanzo.
- source_word: לֹא בִקְשָׁה דָּבָר כִּי אִם
  choice: hakuomba kitu chochote isipokuwa
  rationale: Huonyesha kwa wazi kwamba Esta hakuomba vitu vya ziada, bali kile tu kilichotajwa na Hegai.
- source_word: אֲשֶׁר יֹאמַר
  choice: kile alichoshauri
  rationale: Kitenzi kwa msingi ni ‘alichosema,’ lakini katika muktadha wa Hegai kuelekeza maandalizi, ‘alichoshauri’ huwasilisha maana inayodokezwa kwa Kiswahili cha kawaida.
- source_word: סְרִיס
  choice: towashi
  rationale: Hili ndilo neno mahususi linalofaa mazingira ya makao ya wanawake wa kifalme, ingawa katika miktadha mingine linaweza kumaanisha afisa wa ikulu kwa upana.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: msimamizi wa wanawake
  rationale: Hueleza kwa Kiswahili cha sasa wajibu wa Hegai juu ya wanawake katika makao ya kifalme.
- source_word: וַתְּהִי אֶסְתֵּר נֹשֵׂאת חֵן
  choice: Naye Esta akapata kibali
  rationale: Nahau ya Kiebrania ya ‘kubeba kibali’ humaanisha kupata au kufurahia kibali; kauli hii ni ya asili na yenye heshima katika simulizi la Kiswahili.
- source_word: בְּעֵינֵי כָּל רֹאֶיהָ
  choice: machoni pa wote waliomwona
  rationale: Hifadhi nahau ya chanzo ‘machoni pa’ huku ikibaki wazi na ya kawaida kwa wasomaji wa Kiswahili.
