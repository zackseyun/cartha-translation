base_translation:
  language: en
  yaml_path: translation/ot/esther/002/012.yaml
  text: 'When the turn of each young woman came to go in to King Ahasuerus, after she had been under the regulation for the women for twelve months—for in this way the days of their beauty treatments were completed: six months with oil of myrrh, and six months with spices and with the cosmetics for women—'
translation:
  language: sw
  text: 'Zamu ya kila msichana ilipofika ya kuingia kwa Mfalme Ahasuero, baada ya kukaa miezi kumi na miwili chini ya utaratibu uliowekwa kwa wanawake—kwa maana hivyo ndivyo siku za maandalizi yao ya urembo zilivyokamilishwa: miezi sita kwa mafuta ya manemane, na miezi sita kwa manukato na vipodozi vya wanawake—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֹּר
  choice: zamu
  rationale: Neno hili hapa linamaanisha wakati au nafasi ya kila msichana kufuata kwa mpangilio; “zamu” ni ya kawaida na sahihi katika Kiswahili.
- source_word: נַעֲרָה וְנַעֲרָה
  choice: kila msichana
  rationale: Urudiaji wa nomino katika Kiebrania una maana ya ugawaji, yaani mmoja baada ya mwingine; “kila msichana” huwasilisha maana hiyo kwa Kiswahili asilia.
- source_word: לָבוֹא אֶל־הַמֶּלֶךְ
  choice: kuingia kwa Mfalme
  rationale: Huhifadhi usemi wa simulizi na kidokezo chake bila kuongeza maelezo kuhusu kilichotokea katika kukutana huko.
- source_word: כְּדָת הַנָּשִׁים
  choice: kulingana na utaratibu uliowekwa kwa ajili ya wanawake
  rationale: דָּת linaweza kumaanisha sheria, amri, au kanuni; katika muktadha wa maandalizi ya ikulu, “utaratibu uliowekwa” ni wazi bila kuwa finyu kupita kiasi.
- source_word: מְרוּקֵיהֶן
  choice: maandalizi yao ya urembo
  rationale: Neno linahusu mchakato wa kusafisha au kujipamba; tafsiri hii inafaa muktadha wa matunzo ya miezi kumi na miwili bila kuyapunguza kuwa vipodozi pekee.
- source_word: שֶׁמֶן הַמֹּר
  choice: mafuta ya manemane
  rationale: Ni tafsiri ya moja kwa moja ya mafuta yaliyotengenezwa au kutiwa manemane.
- source_word: בַּבְּשָׂמִים
  choice: manukato
  rationale: Neno hurejelea vitu vyenye harufu nzuri au viungo vya kunukia; “manukato” ni la kawaida na linafaa matumizi ya urembo hapa.
- source_word: תַמְרוּקֵי הַנָּשִׁים
  choice: vipodozi vya wanawake
  rationale: Hutofautisha vifaa au dawa za urembo katika sehemu ya mwisho na mchakato mpana wa maandalizi uliotajwa awali.
