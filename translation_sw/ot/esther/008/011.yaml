language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֲשֶׁר֩ נָתַ֨ן הַ/מֶּ֜לֶךְ לַ/יְּהוּדִ֣ים אֲשֶׁ֣ר בְּ/כָל עִיר וָ/עִ֗יר לְ/הִקָּהֵל֮ וְ/לַ/עֲמֹ֣ד עַל נַפְשָׁ/ם֒ לְ/הַשְׁמִיד֩ וְ/לַ/הֲרֹ֨ג וּ/לְ/אַבֵּ֜ד אֶת כָּל חֵ֨יל עַ֧ם וּ/מְדִינָ֛ה הַ/צָּרִ֥ים אֹתָ֖/ם טַ֣ף וְ/נָשִׁ֑ים וּ/שְׁלָלָ֖/ם לָ/בֽוֹז׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/011.yaml
  text: that the king granted the Jews in every single city to assemble and to stand for their lives[a], to destroy, to kill, and to annihilate every armed force of any people or province that might attack them, including children and women[b], and to plunder their spoil.
translation:
  language: sw
  text: ambayo mfalme aliwapa Wayahudi katika kila mji ruhusa ya kukusanyika na kusimama kutetea maisha yao[a], kuangamiza, kuua, na kufutilia mbali kila kikosi cha watu au cha jimbo lolote kinachowashambulia, pamoja na watoto na wanawake[b], na kuteka nyara mali zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kusimama kwa ajili ya maisha yao.” Kiebrania huhifadhi taswira halisi ya kusimama kwa ajili ya uhai; katika muktadha huu maana yake ni kujitetea.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “watoto na wanawake.” Maneno haya yamo katika tamko la amri pamoja na kundi linalolengwa.'
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר נָתַן
  choice: ambayo mfalme aliwaruhusu
  rationale: Katika muktadha wa amri ya kifalme, נָתַן ina maana ya kutoa ruhusa au mamlaka; “aliwaruhusu” ni ya asili na inaendeleza kishazi kutoka mstari uliotangulia.
- source_word: בְּכָל עִיר וָעִיר
  choice: katika kila mji
  rationale: Urudiaji wa Kiebrania una nguvu ya ugawaji na ujumuishaji; Kiswahili cha kawaida huwasilisha maana hiyo kwa “kila mji” bila urudiaji usio wa asili.
- source_word: לְהִקָּהֵל
  choice: kukusanyika
  rationale: Huwakilisha hali ya kujikusanya pamoja kwa lugha ya kawaida na yenye hadhi.
- source_word: וְלַעֲמֹד עַל נַפְשָׁם
  choice: na kusimama kutetea maisha yao
  rationale: “Kusimama” huhifadhi taswira ya kitenzi עמד, huku “kutetea maisha yao” ikifafanua kwa kawaida nguvu ya עַל נַפְשָׁם katika mazingira ya kujilinda.
- source_word: לְהַשְׁמִיד וְלַהֲרֹג וּלְאַבֵּד
  choice: kuangamiza, kuua, na kufutilia mbali
  rationale: Vitenzi vyote vitatu vimehifadhiwa ili kuonyesha mkusanyo wa makusudi wa maneno makali ya amri.
- source_word: כָּל חֵיל עַם וּמְדִינָה
  choice: kila kikosi cha watu au jimbo lolote
  rationale: חֵיל hapa ni nguvu au kikosi cha kupigana, si mali; muundo huu unaonyesha upeo wa makundi ya watu na majimbo ya milki.
- source_word: הַצָּרִים אֹתָם
  choice: ambacho kingewashambulia
  rationale: Kauli-shirikishi ya צרר inaweza kumaanisha wanaowafanyia uadui; katika muktadha huu, shambulio linalotarajiwa linaonyesha mazingira ya kujilinda bila kuondoa kabisa kipengele cha uwezekano.
- source_word: טַף וְנָשִׁים
  choice: pamoja na watoto na wanawake
  rationale: Maneno haya yanawasilishwa wazi kama yaliyo ndani ya kundi lengwa, bila kuficha ukali wa amri; “pamoja na” huonyesha uhusiano wa kisintaksia kwa Kiswahili cha asili.
- source_word: וּשְׁלָלָם לָבוֹז
  choice: na kuteka nyara mali zao
  rationale: Hutoa maana ya kuchukua mali ya waliolengwa kama nyara kwa usemi wa kawaida wa Kiswahili.
theological_decisions:
- issue: Lugha ya ukatili katika amri ya kifalme
  choice: Kutoa moja kwa moja ruhusa ya kuangamiza, kuua, na kufutilia mbali, huku mazingira ya kujilinda yakionyeshwa.
  alternative: Kulainisha kuwa “kuwashinda” au kufupisha kuwa “kujilinda dhidi ya washambuliaji.”
  rationale: Kiebrania kina vitenzi vitatu vikali na ruhusa ya kuteka nyara; tafsiri haipaswi kupunguza ukali huo. Wakati huohuo, “kutetea maisha yao” na kauli ya uadui huonyesha muktadha wa kujilinda.
- issue: Upeo wa “watoto na wanawake”
  choice: Kuyataja wazi maneno hayo kama sehemu ya kundi la adui linalolengwa na amri.
  alternative: Kuyaficha, kuyaacha, au kuyatafsiri kwa namna inayotatua mvutano wa kimaadili.
  rationale: Muundo wa Kiebrania unaunganisha watoto na wanawake na kundi linalolengwa. Tafsiri inahifadhi mvutano wa kimaadili badala ya kuusafisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo unaendelea kisintaksia kutoka mstari uliotangulia; lugha kali na mvutano wa kimaadili wa chanzo vimehifadhiwa.
