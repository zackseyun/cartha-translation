  text: כִּ֠י אֵיכָכָ֤ה אוּכַל֙ וְֽ/רָאִ֔יתִי בָּ/רָעָ֖ה אֲשֶׁר יִמְצָ֣א אֶת עַמִּ֑/י וְ/אֵֽיכָכָ֤ה אוּכַל֙ וְֽ/רָאִ֔יתִי בְּ/אָבְדַ֖ן מוֹלַדְתִּֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/006.yaml
  text: For how could I bear to see the disaster that will come upon my people? And how could I bear to see the destruction of my kindred?[a]
translation:
  language: sw
  text: Kwa maana, nitawezaje kustahimili kuona maafa yatakayowapata watu wangu? Nami nitawezaje kustahimili kuona maangamizi ya jamaa zangu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maangamizi ya watu wa asili yangu” / “ndugu zangu.” Neno la Kiebrania linaweza kumaanisha watu ambao mtu anahusiana nao kwa kuzaliwa au ukoo, wala si mahali pa kuzaliwa tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha kuwa maneno haya yanatoa sababu ya ombi la Esta katika muktadha uliotangulia.
- source_word: אֵיכָכָה אוּכַל
  choice: nitawezaje kustahimili
  rationale: Swali hili la balagha halihusu uwezo wa kawaida tu, bali uchungu wa kulazimika kushuhudia maafa; “kustahimili” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: וְרָאִיתִי
  choice: kuona
  rationale: Ingawa muundo wa Kiebrania ni wa kiunganishi, baada ya “nitawezaje kustahimili” Kiswahili hutumia kitenzi-jina “kuona” kwa ufasaha.
- source_word: בָּרָעָה
  choice: maafa
  rationale: Katika muktadha huu neno hilo linamaanisha msiba au madhara yatakayowapata watu, wala si uovu wa kimaadili.
- source_word: אֲשֶׁר יִמְצָא
  choice: yatakayowapata
  rationale: Nahau ya Kiebrania ya jambo ‘kumpata’ mtu ina maana ya jambo hilo kumfikia au kumpata; Kiswahili kina nahau inayolingana moja kwa moja.
- source_word: עַמִּי
  choice: watu wangu
  rationale: Huhifadhi utambulisho wa Esta na taifa lake kwa lugha ya kawaida na iliyo wazi.
- source_word: בְּאָבְדַן
  choice: maangamizi
  rationale: Nomino hii inaashiria kuangamia au kuharibiwa; “maangamizi” inafaa kwa tishio la kuangamizwa linalozungumziwa.
- source_word: מוֹלַדְתִּי
  choice: jamaa zangu
  rationale: Hapa inaelekea kurejelea watu ambao Esta anahusiana nao kwa kuzaliwa—ndugu, ukoo, au watu wa asili yake—si mahali pa kuzaliwa tu.
