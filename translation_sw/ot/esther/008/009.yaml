  text: וַ/יִּקָּרְא֣וּ סֹפְרֵֽי הַ/מֶּ֣לֶךְ בָּֽ/עֵת הַ֠/הִיא בַּ/חֹ֨דֶשׁ הַ/שְּׁלִישִׁ֜י הוּא חֹ֣דֶשׁ סִיוָ֗ן בִּ/שְׁלוֹשָׁ֣ה וְ/עֶשְׂרִים֮ בּ/וֹ֒ וַ/יִּכָּתֵ֣ב כְּֽ/כָל אֲשֶׁר צִוָּ֣ה מָרְדֳּכַ֣י אֶל הַ/יְּהוּדִ֡ים וְ/אֶ֣ל הָ/אֲחַשְׁדַּרְפְּנִֽים וְ/הַ/פַּחוֹת֩ וְ/שָׂרֵ֨י הַ/מְּדִינ֜וֹת אֲשֶׁ֣ר מֵ/הֹ֣דּוּ וְ/עַד כּ֗וּשׁ שֶׁ֣בַע וְ/עֶשְׂרִ֤ים וּ/מֵאָה֙ מְדִינָ֔ה מְדִינָ֤ה וּ/מְדִינָה֙ כִּ/כְתָבָ֔/הּ וְ/עַ֥ם וָ/עָ֖ם כִּ/לְשֹׁנ֑/וֹ וְ/אֶ֨ל הַ/יְּהוּדִ֔ים כִּ/כְתָבָ֖/ם וְ/כִ/לְשׁוֹנָֽ/ם־־־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/009.yaml
  text: Then the king’s scribes were summoned at that time[a], in the third month, that is, the month of Sivan, on its twenty-third day; and it was written exactly as Mordecai commanded, to the Jews and to the satraps, the governors, and the officials of the provinces from India to Cush, one hundred and twenty-seven provinces, to each province in its own script, to each people in its own language[b], and also to the Jews in their own script and their own language.
translation:
  language: sw
  text: 'Wakati huo waandishi wa mfalme waliitwa, katika mwezi wa tatu, yaani mwezi wa Sivani, siku ya ishirini na tatu ya mwezi huo; ikaandikwa sawasawa na yote aliyoyaamuru Mordekai: kwa Wayahudi, kwa masatrapu, watawala, na maofisa wa majimbo kuanzia India hadi Kushi—majimbo 127—kila jimbo kwa maandishi yake, kila taifa kwa lugha yake, na kwa Wayahudi kwa maandishi yao na kwa lugha yao.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּרְאוּ סֹפְרֵי הַמֶּלֶךְ
  choice: waandishi wa mfalme waliitwa
  rationale: Nifali ya וַיִּקָּרְאוּ ina maana ya kutendwa; “waliitwa” ni ya kawaida na inadumisha mazingira ya utawala. “Waandishi” huwakilisha makatibu wa kifalme bila kuwalazimisha wasomaji kukopa istilahi ya kigeni.
- source_word: בָּעֵת הַהִיא
  choice: Wakati huo
  rationale: Hutafsiri wazi kishazi cha wakati bila kukirudia kwa kiunganishi kingine kisichohitajika.
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי הוּא חֹדֶשׁ סִיוָן
  choice: katika mwezi wa tatu, yaani mwezi wa Sivani
  rationale: “Yaani” huonyesha ufafanuzi wa jina la mwezi; “Sivani” ni umbo la Kiswahili linalosomeka kwa urahisi.
- source_word: בִּשְׁלוֹשָׁה וְעֶשְׂרִים בּוֹ
  choice: siku ya ishirini na tatu ya mwezi huo
  rationale: Hufanya rejeo la kiwakilishi kwa mwezi liwe wazi na la asili katika Kiswahili.
- source_word: וַיִּכָּתֵב
  choice: ikaandikwa
  rationale: Hudumisha hali ya kutendwa na kutomtaja mtendaji ambaye Kiebrania hakumtaji.
- source_word: כְּכָל אֲשֶׁר צִוָּה מָרְדֳּכַי
  choice: sawasawa na yote aliyoamuru Mordekai
  rationale: Huhifadhi wazo la kufuata kikamilifu yote aliyoyaagiza Mordekai.
- source_word: הָאֲחַשְׁדַּרְפְּנִים
  choice: maamiri wa majimbo
  rationale: Hutoa kwa Kiswahili cheo cha watawala wakuu wa maeneo katika utawala wa Uajemi, huku likitofautishwa na vyeo vinavyofuata.
- source_word: הַפַּחוֹת
  choice: watawala
  rationale: Ni neno linaloeleweka kwa viongozi wa kiutawala na linabaki tofauti na maamiri na maofisa.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: maofisa wa majimbo
  rationale: Muktadha ni wa urasimu wa dola; “maofisa” huepuka maana ya kifalme inayoweza kudokezwa na “wakuu” au “wakuu wa kifalme.”
- source_word: מֵהֹדּוּ וְעַד כּוּשׁ
  choice: yaliyoanzia India hadi Kushi
  rationale: India ni utambulisho wa kawaida wa Hodu; Kushi huhifadhi jina la eneo la kale badala ya kulilinganisha moja kwa moja na Ethiopia ya kisasa.
- source_word: מְדִינָה וּמְדִינָה כִּכְתָבָהּ וְעַם וָעָם כִּלְשֹׁנוֹ
  choice: Kila jimbo liliandikiwa kwa mwandiko wake, na kila taifa kwa lugha yake
  rationale: Hurudisha marudio distributivu ya Kiebrania kwa Kiswahili cha asili na kutofautisha mfumo wa maandishi na lugha.
