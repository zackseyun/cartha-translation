translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi ndefu ya Kiebrania imegawanywa kwa uangalifu ili kuboresha usomaji bila kupoteza mfuatano wa taarifa. Hakuna tanbihi iliyohitajika; Kushi limehifadhiwa moja kwa moja katika matini.
