- from: Wakati huo, waandishi wa mfalme waliitwa, katika mwezi wa tatu, yaani mwezi wa Sivani, siku ya ishirini na tatu ya mwezi huo. Kisha ikaandikwa sawasawa na yote aliyoamuru Mordekai, kwa Wayahudi, maamiri wa majimbo, watawala na maofisa wa majimbo yaliyoanzia India hadi Kushi—jumla ya majimbo 127. Kila jimbo liliandikiwa kwa mwandiko wake, na kila taifa kwa lugha yake; Wayahudi nao waliandikiwa kwa mwandiko wao na kwa lugha yao.
  to: 'Wakati huo waandishi wa mfalme waliitwa, katika mwezi wa tatu, yaani mwezi wa Sivani, siku ya ishirini na tatu ya mwezi huo; ikaandikwa sawasawa na yote aliyoyaamuru Mordekai: kwa Wayahudi, kwa masatrapu, watawala, na maofisa wa majimbo kuanzia India hadi Kushi—majimbo 127—kila jimbo kwa maandishi yake, kila taifa kwa lugha yake, na kwa Wayahudi kwa maandishi yao na kwa lugha yao.'
  rationale: The revision replaces an administratively misleading title with “masatrapu” and renders “script” with “maandishi.” It otherwise retains the draft’s faithful handling of the passive verbs, date, distributive repetition, ancient geographical name Kushi, and the additive final reference to the Jews. The English audit trail’s footnote anchors appear internally mismatched, but the Swahili draft has no footnotes and no footnote is required for a faithful, readable rendering here.
