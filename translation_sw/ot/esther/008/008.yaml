translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifalme lakini kinachoeleweka kwa msomaji wa kawaida. “Waandikieni” na “mtie muhuri” ni miundo ya sasa na ya asili; “hati” huhifadhi upana wa כְתָב.
