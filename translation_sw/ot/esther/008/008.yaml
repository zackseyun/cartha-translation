base_translation:
  language: en
  yaml_path: translation/ot/esther/008/008.yaml
  text: But you may write concerning the Jews as seems good in your eyes[a], in the king’s name, and seal it with the king’s signet ring[b], for a document that is written in the king’s name and sealed with the king’s signet ring cannot be revoked.
translation:
  language: sw
  text: Lakini ninyi, andikeni kuhusu Wayahudi kama mnavyoona inafaa[a], kwa jina la mfalme, na mtie muhuri kwa pete ya mfalme; kwa maana hati iliyoandikwa kwa jina la mfalme na kutiwa muhuri kwa pete ya mfalme haiwezi kubatilishwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kama ilivyo njema machoni penu.” Yaani, kama mnavyoona inafaa.
    reason: lexical_alternative
  - marker: b
    text: Au “haiwezi kutenguliwa.” Usemi wa Kiebrania una maana ya kwamba hati hiyo ya kifalme haiwezi kufutwa wala kuondolewa nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Lakini ninyi
  rationale: Kiunganishi pamoja na kiwakilishi cha wingi kinaonyesha utofautishaji na amri ya awali isiyoweza kubatilishwa; “Lakini ninyi” ni ya asili katika Kiswahili na huhifadhi mkazo wa mhusika.
- source_word: כִּתְבוּ עַל הַיְּהוּדִים
  choice: waandikieni Wayahudi
  rationale: Amri ya wingi inatoa ruhusa yenye nguvu ya kifalme. Muundo wa Kiswahili “waandikieni” unaonyesha kwa kawaida kwamba waraka huo unawahusu na unakusudiwa kwa manufaa ya Wayahudi, bila kulazimisha neno la ziada.
- source_word: כַּטּוֹב בְּעֵינֵיכֶם
  choice: kama mnavyoona inafaa
  rationale: Nahau ya Kiebrania ni kihalisi “kama ilivyo njema machoni penu”; tafsiri hii huwasilisha maana ya kufanya kwa kadiri ya uamuzi wao kwa Kiswahili cha sasa, huku tanbihi ikihifadhi taswira ya asili.
- source_word: בְּשֵׁם הַמֶּלֶךְ
  choice: kwa jina la mfalme
  rationale: Huhifadhi neno “jina” na pia hueleweka katika muktadha kuwa ni kutumia mamlaka ya kifalme.
- source_word: וְחִתְמוּ בְּטַבַּעַת הַמֶּלֶךְ
  choice: kisha mtie muhuri kwa pete ya mfalme
  rationale: Kitenzi kinamaanisha kutia muhuri, na טַבַּעַת ni pete iliyotumika kuweka muhuri rasmi. Kiswahili hiki ni wazi bila kuongeza maelezo marefu ndani ya mstari.
- source_word: כְתָב
  choice: hati
  rationale: Neno hilo linamaanisha maandishi au waraka kwa ujumla. “Hati” linafaa kwa mazingira ya kiutawala bila kulifanya mahsusi zaidi kuwa “amri” au “tangazo.”
- source_word: אֵין לְהָשִׁיב
  choice: haiwezi kubatilishwa
  rationale: Usemi huo ni kihalisi kutokuwepo kwa njia ya kuirudisha; katika mazingira ya kisheria una maana ya kutoweza kufutwa au kuondolewa nguvu.
