translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi kwa viambishi vya mfululizo '-ka-' umehifadhi mwendo wa tukio. Maneno ya rangi na mavazi yamewekwa wazi kwa msomaji wa kawaida bila kuondoa hali ya kifalme.
