base_translation:
  language: en
  yaml_path: translation/ot/esther/008/015.yaml
  text: And Mordecai went out from the presence of the king in royal clothing of blue and white[a], with a large crown of gold and a robe of fine linen and purple[e][d][c][b]; and the city of Susa shouted and rejoiced.
translation:
  language: sw
  text: Mordekai akatoka mbele ya mfalme, akiwa amevaa mavazi ya kifalme ya buluu[a] na nyeupe, na taji kubwa la dhahabu, pamoja na joho la kitani bora na zambarau[b]. Mji wa Susa ukapiga kelele kwa shangwe na kufurahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “buluu-zambarau.” Neno la Kiebrania linaweza kurejelea rangi ya buluu-zambarau ya kifalme.
    reason: lexical_alternative
  - marker: b
    text: Neno lililotafsiriwa “joho” linaweza pia kumaanisha vazi la nje la kujifunika.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָא מִלִּפְנֵי הַמֶּלֶךְ
  choice: akatoka mbele ya mfalme
  rationale: Huhifadhi picha ya Kiebrania ya kuondoka mbele ya mfalme, huku ikiwa kauli ya kawaida na yenye hadhi katika Kiswahili.
- source_word: לְבוּשׁ מַלְכוּת
  choice: mavazi ya kifalme
  rationale: Ni tafsiri ya asili na wazi ya mavazi yanayohusishwa na ufalme.
- source_word: תְּכֵלֶת
  choice: rangi ya buluu
  rationale: Neno linaweza kutaja buluu au buluu-zambarau ya thamani; 'buluu' ni wazi, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: חוּר
  choice: nyeupe
  rationale: Huwakilisha rangi au kitambaa cheupe kinachooanishwa na תְּכֵלֶת.
- source_word: עֲטֶרֶת זָהָב גְּדוֹלָה
  choice: taji kubwa la dhahabu
  rationale: Huhifadhi aina ya pambo la kichwani, ukubwa wake, na nyenzo yake bila kuongeza ufafanuzi.
- source_word: תַכְרִיךְ
  choice: joho
  rationale: Neno la Kiebrania hutaja vazi la nje la kujifunika; 'joho' ni la kawaida, lenye hadhi, na linafaa katika mazingira ya kifalme.
- source_word: בּוּץ
  choice: kitani safi
  rationale: Hutaja kitani bora cha thamani; 'kitani safi' ni usemi unaoeleweka katika Kiswahili cha Biblia.
- source_word: אַרְגָּמָן
  choice: rangi ya zambarau
  rationale: Hutaja rangi au kitambaa cha zambarau kilichohusishwa na hadhi.
- source_word: צָהֲלָה וְשָׂמֵחָה
  choice: ukapiga kelele kwa shangwe na kufurahi
  rationale: Hutofautisha mwitikio wa sauti wa kitenzi cha kwanza na hali ya furaha ya kitenzi cha pili, bila kuyafanya kuwa wazo moja.
