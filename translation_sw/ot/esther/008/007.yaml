base_translation:
  language: en
  yaml_path: translation/ot/esther/008/007.yaml
  text: Then King Ahasuerus said to Queen Esther and to Mordecai the Jew[a], “Look, I have given Haman’s house to Esther, and they have hanged him on the gallows because he stretched out his hand against the Jews.”
translation:
  language: sw
  text: Ndipo Mfalme Ahasuero akawaambia Malkia Esta na Mordekai, Myahudi, “Tazama, nimempa Esta nyumba ya Hamani, na Hamani wamemtundika juu ya mti[a] kwa sababu alinyoosha mkono wake dhidi ya Wayahudi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “juu ya mti.” Neno la Kiebrania linaweza pia kurejelea kitu cha mbao, kama nguzo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida, huku umoja wa kitenzi ukipatana na mfululizo wa watu wanaoambiwa.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ
  choice: Mfalme Ahasuero
  rationale: Kiswahili huweka cheo kabla ya jina; Ahasuero ni umbo la jina lililozoeleka katika tafsiri za Kiswahili.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: Malkia Esta
  rationale: Hili ni umbo la asili na fasaha katika Kiswahili, nalo linahifadhi cheo cha kifalme.
- source_word: וּלְמָרְדֳּכַי הַיְּהוּדִי
  choice: na Mordekai, Myahudi
  rationale: Neno 'Myahudi' linahifadhi utambulisho wa kikabila wa Mordekai; koma inaonyesha kuwa ni maelezo ya jina.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Linahifadhi nguvu ya neno la kuelekeza fikira bila kutumia lugha isiyoeleweka.
- source_word: בֵית הָמָן
  choice: mali ya Hamani
  rationale: Ingawa בית humaanisha kihalisi 'nyumba,' katika muktadha huu inahusu milki au mali ya nyumba ya Hamani ambayo imekabidhiwa Esta; 'mali' huwasilisha maana hiyo kwa uwazi.
- source_word: נָתַתִּי
  choice: nimempa
  rationale: Kauli ya wakati timilifu inaonyesha tendo lililokamilika ambalo matokeo yake yanaendelea kuwapo.
- source_word: וְאֹתוֹ תָּלוּ
  choice: naye Hamani wamemtundika
  rationale: Kumrudia Hamani kunaondoa utata wa kiwakilishi katika Kiswahili. Nafsi ya tatu wingi yenye mtendaji asiyetajwa imehifadhiwa kwa 'wamemtundika.'
- source_word: עַל הָעֵץ
  choice: juu ya mti
  rationale: Hili linahifadhi neno la Kiebrania עֵץ ('mti/kipande cha mbao') na kuepuka kubainisha bila lazima aina halisi ya kifaa cha kuulia.
- source_word: עַל אֲשֶׁר
  choice: kwa sababu
  rationale: Kirai hiki kinatoa sababu ya adhabu, na 'kwa sababu' ni Kiswahili wazi na cha kawaida.
- source_word: שָׁלַח יָדוֹ
  choice: alinyoosha mkono wake dhidi ya
  rationale: Tafsiri hii inadumisha taswira ya nahau ya Kiebrania, huku 'dhidi ya' ikionyesha tendo au nia ya uhasama.
- source_word: בַיהודיים
  choice: Wayahudi
  rationale: Hili ni neno la kawaida la Kiswahili kwa utambulisho wa watu unaokusudiwa katika kitabu cha Esta.
