base_translation:
  language: en
  yaml_path: translation/ot/esther/008/005.yaml
  text: And she said[a], “If it seems good to the king, and if I have found favor before him, and if the matter is proper before the king, and if I am pleasing in his eyes, let it be written to revoke the letters devised by Haman son of Hammedatha the Agagite[b], which he wrote to destroy the Jews who are in all the provinces of the king.”
translation:
  language: sw
  text: Akasema, “Ikiwa mfalme anaona ni vema, ikiwa nimepata kibali mbele yake, ikiwa jambo linafaa mbele ya mfalme, na ikiwa ninapendeza machoni pake, iandikwe ili kubatilisha barua[a], hila ya Hamani mwana wa Hamedatha, Mwagagi[b], alizoandika ili kuwaangamiza Wayahudi walio katika majimbo yote ya mfalme.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuzirejesha barua.” Kitenzi cha Kiebrania kinaweza kumaanisha kurejesha au kubatilisha katika muktadha huu wa kiutawala.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “barua, hila ya Hamani.” Tafsiri inaonyesha kwamba barua hizo zilikuwa utekelezaji wa hila au mpango wa Hamani.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Ikiwa mfalme anaona ni vema
  rationale: Ni kauli ya heshima ya kifalme; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha unyenyekevu wa ombi.
- source_word: מָצָאתִי חֵן לְפָנָיו
  choice: ikiwa nimepata kibali mbele yake
  rationale: “Kibali” huwasilisha חֵן katika muktadha wa ombi kwa mfalme, huku “mbele yake” ikifuatilia nahau ya Kiebrania.
- source_word: וְכָשֵׁר הַדָּבָר לִפְנֵי הַמֶּלֶךְ
  choice: ikiwa jambo hili linafaa mbele ya mfalme
  rationale: כָשֵׁר hapa ni kufaa au kustahili; “jambo hili” hudumisha דָּבָר bila kulifasiri moja kwa moja kuwa pendekezo.
- source_word: וְטוֹבָה אֲנִי בְּעֵינָיו
  choice: na ikiwa ninapendeza machoni pake
  rationale: Inahifadhi taswira ya “machoni pake” na tofauti kati ya kibali kilichotajwa awali na kukubalika kwa Esta binafsi.
- source_word: יִכָּתֵב
  choice: iandikwe amri
  rationale: Umbo la kutendwa na nguvu ya ombi vinadumishwa. “Amri” imeongezwa kwa uwazi wa Kiswahili kwa sababu kitakachoandikwa ni hatua rasmi ya kifalme.
- source_word: לְהָשִׁיב אֶת־הַסְּפָרִים
  choice: ya kuyabatilisha barua
  rationale: Katika muktadha wa kiutawala, הֵשִׁיב inaweza kumaanisha kurudisha nyuma au kubatilisha. “Kuyabatilisha” linaeleza kwa kawaida kusudi la ombi kuhusu nyaraka rasmi.
- source_word: מַחֲשֶׁבֶת הָמָן
  choice: zilizotokana na hila ya Hamani
  rationale: Muundo halisi ni “barua, hila/mpango wa Hamani.” Tafsiri hii inaonyesha kwamba barua hizo zilikuwa utekelezaji wa hila yake bila kuzifanya barua zenyewe kuwa “hila.”
- source_word: הָאֲגָגִי
  choice: Mwagagi
  rationale: Jina la nasaba/kundi linatolewa kwa umbo la Kiswahili linalotambulika na linalolingana na “Agagi.”
- source_word: לְאַבֵּד
  choice: kuwaangamiza
  rationale: Kitenzi kinaonyesha kusababisha maangamizi; “kuwaangamiza” kinafaa kwa kusudi la kuwaua Wayahudi kama kundi.
- source_word: הַיְּהוּדִים אֲשֶׁר בְּכָל מְדִינוֹת הַמֶּלֶךְ
  choice: Wayahudi walio katika majimbo yote ya mfalme
  rationale: Inahifadhi kishazi rejeshi na upeo wa majimbo yote yaliyo chini ya mfalme.
