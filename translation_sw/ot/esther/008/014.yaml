base_translation:
  language: en
  yaml_path: translation/ot/esther/008/014.yaml
  text: The couriers[a], mounted on the royal steeds, went out hastened and pressed on by the king’s command, and the decree was issued in Susa the citadel.
translation:
  language: sw
  text: Wajumbe[a], wakiwa wamepanda farasi wa kifalme, waliondoka kwa haraka, wakiharakishwa na kusukumwa na amri ya mfalme; na amri ikatolewa katika ngome ya Shushani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakimbiaji.” Maneno ya Kiebrania yanayotaja wanyama waliowapanda ni nadra, na utambulisho wao kamili haujulikani; huenda yalirejelea farasi maalumu wa mazizi ya kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: Wajumbe wa mbio
  rationale: Katika mazingira ya utawala wa Uajemi, neno hilo linamaanisha wajumbe rasmi waliobeba taarifa kwa haraka; usemi huu unaonyesha kazi yao na dhana ya kasi.
- source_word: רֹכְבֵי הָרֶכֶשׁ הָאֲחַשְׁתְּרָנִים
  choice: wakiwa wamepanda farasi wa kifalme
  rationale: Maneno ya Kiebrania kuhusu wanyama hawa ni nadra, na utambulisho wao kamili haujulikani. Tafsiri hii inaonyesha kuwa walikuwa wanyama maalumu wa usafiri wa kifalme bila kudai kwa uhakika aina yao mahususi.
- source_word: יָצְאוּ
  choice: waliondoka
  rationale: Hii ni njia ya kawaida na ya asili ya kueleza kuwa wajumbe walianza safari yao.
- source_word: מְבֹהָלִים וּדְחוּפִים
  choice: kwa haraka, wakihimizwa
  rationale: Maneno yote mawili yanaonyesha uharaka na msukumo kutoka nje; tafsiri hii huhifadhi mkazo huo kwa Kiswahili cha kawaida.
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: na amri ya mfalme
  rationale: דבר hapa ni neno lenye mamlaka, yaani agizo la mfalme, si kauli ya kawaida tu.
- source_word: וְהַדָּת נִתְּנָה
  choice: Nayo amri hiyo ikatangazwa
  rationale: Katika muktadha wa kiutawala, דת ni amri rasmi, na נתן hapa humaanisha kuitoa au kuitangaza rasmi.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: katika ngome ya Shushani
  rationale: הבירה humaanisha ngome au sehemu yenye ulinzi ya mji; mpangilio huu ni wa asili katika Kiswahili.
