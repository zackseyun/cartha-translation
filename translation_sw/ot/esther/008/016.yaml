  yaml_path: translation/ot/esther/008/016.yaml
  text: For the Jews there was light and gladness and joy and honor[a].
translation:
  language: sw
  text: Kwa Wayahudi kulikuwa na nuru, furaha, shangwe na heshima.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wayahudi walikuwa na nuru, furaha, shangwe na heshima.” Muundo wa Kiebrania unaweza kutafsiriwa kama hali ya kuwapo (“kulikuwa na”) au ya kumiliki (“walikuwa na”).
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְּהוּדִים
  choice: Kwa Wayahudi
  rationale: Kiambishi ל hapa huonyesha wale ambao hali hii iliwahusu au waliokuwa nayo. “Kwa Wayahudi” huhifadhi muundo huo na ni Kiswahili cha kawaida.
- source_word: הָיְתָה
  choice: kulikuwa na
  rationale: Pamoja na kishazi kilichotangulizwa “Kwa Wayahudi,” kitenzi היה kinaweza kutafsiriwa kidhati kwa muundo wa kuwapo, “kulikuwa na.”
- source_word: אוֹרָה
  choice: nuru
  rationale: “Nuru” huhifadhi taswira ya Kiebrania, ambayo katika muktadha inadokeza wokovu, ustawi na hali njema bila kuzifafanua kupita kiasi.
- source_word: שִׂמְחָה
  choice: furaha
  rationale: “Furaha” ni neno la kawaida na la asili; linatofautishwa na שָׂשׂוֹן kwa kuitafsiri hiyo kuwa “shangwe.”
- source_word: שָׂשׂוֹן
  choice: shangwe
  rationale: Neno hili huonyesha furaha yenye kusherehekewa au kufurahi kwa nguvu. “Shangwe” huhifadhi mkusanyiko wa maneno mawili yanayokaribiana bila kuyafanya yote kuwa “furaha.”
- source_word: יְקָר
  choice: heshima
  rationale: Katika muktadha huu neno linahusu hadhi na kuheshimiwa kwa Wayahudi baada ya mabadiliko ya hali yao; “heshima” linafaa kuliko neno linalosisitiza fahari ya kuonekana.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nuru” imehifadhiwa kama sitiari, na “furaha” pamoja na “shangwe” zinawakilisha maneno mawili ya Kiebrania yanayokaribiana.
