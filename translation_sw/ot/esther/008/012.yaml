  yaml_path: translation/ot/esther/008/012.yaml
  text: on one day in all the provinces of King Ahasuerus, on the thirteenth day of the twelfth month, that is, the month Adar.
translation:
  language: sw
  text: siku moja katika majimbo yote ya Mfalme Ahasuero, siku ya kumi na tatu ya mwezi wa kumi na mbili, yaani mwezi wa Adari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם אֶחָד
  choice: kwa siku moja
  rationale: Kirai hiki ni cha wakati; “kwa siku moja” kinahifadhi namba אֶחָד na kueleza kwamba tukio lilipangwa litendeke siku moja maalumu bila kuongeza wazo lisilokuwamo katika Kiebrania.
- source_word: בְּכָל מְדִינוֹת
  choice: katika majimbo yote
  rationale: מְדִינוֹת ni maeneo ya kiutawala ya himaya; “majimbo” ni neno la kawaida na linalofaa katika muktadha huu.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: ya Mfalme Ahasuero
  rationale: Muundo huu unaonyesha kuwa majimbo hayo ni ya mfalme anayeitwa Ahasuero; tahajia “Ahasuero” imezoeleka katika Kiswahili cha Biblia.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר
  choice: siku ya kumi na tatu
  rationale: Ingawa Kiebrania kinatumia namba ya kawaida, katika fomula ya tarehe maana yake ya asili kwa Kiswahili ni ordinali, “siku ya kumi na tatu.”
- source_word: לְחֹדֶשׁ שְׁנֵים עָשָׂר
  choice: ya mwezi wa kumi na mbili
  rationale: Hiki ni kipengele kinachokamilisha tarehe; Kiswahili hutumia kwa kawaida “siku ya ... ya mwezi wa ...”.
- source_word: הוּא חֹדֶשׁ אֲדָר
  choice: yaani mwezi wa Adari
  rationale: הוּא ina nguvu ya ufafanuzi hapa, na “yaani” hutambulisha kwa uwazi jina la mwezi wa kumi na mbili.
