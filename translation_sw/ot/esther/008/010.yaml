base_translation:
  language: en
  yaml_path: translation/ot/esther/008/010.yaml
  text: He wrote in the name of King Ahasuerus[a], sealed it with the king’s signet ring, and sent letters by couriers on horses, riding the royal steeds bred from swift stock.
translation:
  language: sw
  text: Akaandika kwa jina la Mfalme Ahasuero, akautia muhuri waraka huo kwa pete ya muhuri ya mfalme, kisha akatuma barua kupitia wajumbe waliopanda farasi, farasi teule wa kifalme, uzao wa farasi majike.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno ya Kiebrania yanayoeleza farasi hawa ni nadra na maana yake si hakika. Sehemu hii inaweza kutafsiriwa kwa maana halisi zaidi, “farasi, wapandaji wa rekeshi, akhashterani, wana wa ramakimu.” Huenda istilahi hizi zikimaanisha wanyama kutoka mazizi ya kifalme au waliotumiwa katika huduma ya wajumbe wa mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: Akaandika
  rationale: Kitenzi cha usimulizi kinaendeleza mfululizo wa matukio; kiambishi “aka-” ni cha kawaida na cha asili katika usimulizi wa Kiswahili.
- source_word: בְּשֵׁם הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ
  choice: kwa jina la Mfalme Ahasuero
  rationale: Nahau hii inaonyesha kutenda kwa mamlaka rasmi ya mfalme; “kwa jina la” huhifadhi pia umbo la Kiebrania bila kupoteza maana hiyo.
- source_word: וַיַּחְתֹּם בְּטַבַּעַת הַמֶּלֶךְ
  choice: akazitia barua hizo muhuri kwa pete ya muhuri ya mfalme
  rationale: Kiswahili hutaja barua kwa wingi kulingana na סְפָרִים inayofuata. “Pete ya muhuri” inaonyesha kuwa pete hiyo ilikuwa chombo cha kuthibitisha waraka rasmi.
- source_word: וַיִּשְׁלַח סְפָרִים בְּיַד הָרָצִים
  choice: akazituma kwa wajumbe
  rationale: סְפָרִים ni barua au nyaraka rasmi, na בְּיַד ni nahau ya wakala. הָרָצִים hapa ni wajumbe wa kifalme, si wakimbiaji kwa miguu kwa kuwa walikuwa wamepanda farasi.
- source_word: רֹכְבֵי הָרֶכֶשׁ
  choice: waliopanda farasi teule
  rationale: רֶכֶשׁ ni neno la kipindi cha Uajemi linaloelekea kumaanisha farasi maalumu wa kupandwa; “teule” huonyesha hadhi yao bila kudai maana ya kasi ambayo si hakika.
- source_word: הָאֲחַשְׁתְּרָנִים בְּנֵי הָרַמָּכִים
  choice: wa kifalme, uzao wa farasi-majike
  rationale: Maneno haya mawili ni nadra na maana yake si hakika. Tafsiri hii huwasilisha mazingira ya huduma ya mfalme na maana ya msingi ya “uzao,” huku tanbihi ikihifadhi kutokuwa na uhakika kwa istilahi hizo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. “Aka-” hudumisha mwendelezo wa simulizi; istilahi za farasi zimetafsiriwa kwa tahadhari na kutokuwa na uhakika kwa Kiebrania kumewekwa wazi katika tanbihi.
