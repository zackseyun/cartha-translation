  text: פַּתְשֶׁ֣גֶן הַ/כְּתָ֗ב לְ/הִנָּ֤תֵֽן דָּת֙ בְּ/כָל מְדִינָ֣ה וּ/מְדִינָ֔ה גָּל֖וּי לְ/כָל הָ/עַמִּ֑ים וְ/לִ/הְי֨וֹת ה/יהודיים עתודים לַ/יּ֣וֹם הַ/זֶּ֔ה לְ/הִנָּקֵ֖ם מֵ/אֹיְבֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/013.yaml
  text: A copy of the written decree was to be issued as law in every province and province[a], being made public to all the peoples[d][c][b], and so that the Jews would be ready on that day to avenge themselves on their enemies.
translation:
  language: sw
  text: Nakala ya waraka huo itolewe kama sheria katika kila jimbo[a], itangazwe wazi kwa watu wa mataifa yote[b], ili Wayahudi wawe tayari siku hiyo kujilipiza kisasi dhidi ya adui zao.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hurudia kihalisi, “katika kila jimbo na jimbo,” yaani, katika kila jimbo moja moja.
    reason: lexical_alternative
  - marker: b
    text: Au “na kuwekwa wazi kwa watu wa mataifa yote.”
    reason: lexical_alternative
  - marker: c
    text: Au “kulipiza kisasi dhidi ya adui zao.” Baadhi ya tafsiri husema “kujilinda dhidi ya adui zao,” lakini kitenzi cha Kiebrania kinamaanisha hasa kujilipizia au kulipiza kisasi.
    reason: alternative_reading
lexical_decisions:
- source_word: פַּתְשֶׁגֶן הַכְּתָב
  choice: Nakala ya waraka huo
  rationale: Neno la mkopo la Kiajemi פַּתְשֶׁגֶן humaanisha nakala ya hati rasmi, huku הַכְּתָב ikirejelea waraka ulioandikwa. ‘Waraka’ linafaa kwa mazingira rasmi ya utawala bila kurudia wazo la kuandikwa.
- source_word: לְהִנָּתֵן דָּת
  choice: ilipaswa kutolewa kuwa sheria
  rationale: Muundo huu unaonyesha kutangazwa au kutolewa kwa agizo lenye nguvu ya kisheria; tafsiri hii inadumisha uzito wa דָּת na ni ya kawaida katika Kiswahili.
- source_word: בְּכָל מְדִינָה וּמְדִינָה
  choice: katika kila jimbo
  rationale: Kurudiwa kwa neno ‘jimbo’ ni nahau ya Kiebrania ya mgawanyo, yenye maana ya kila jimbo moja moja. Kiswahili cha kawaida hutoa maana hiyo kwa ‘kila jimbo.’
- source_word: גָּלוּי לְכָל הָעַמִּים
  choice: kutangazwa kwa watu wa mataifa yote
  rationale: גָּלוּי hapa huonyesha kuwekwa wazi au kuchapishwa hadharani. עַמִּים ni makundi mbalimbali ya kikabila katika milki; ‘watu wa mataifa yote’ hudumisha wingi huo kwa lugha iliyo wazi.
- source_word: וְלִהְיוֹת הַיְּהוּדִים עֲתוּדִים
  choice: ili Wayahudi wawe tayari
  rationale: Kitenzi-jina kinaendeleza kusudi la waraka, na עֲתוּדִים humaanisha kuwa tayari au kujiandaa.
- source_word: לַיּוֹם הַזֶּה
  choice: siku hiyo
  rationale: Kihalisi ni ‘kwa siku hii,’ lakini katika simulizi kinarejelea tarehe iliyowekwa katika waraka; ‘siku hiyo’ ni Kiswahili cha kawaida kinachofikisha rejeo hilo.
- source_word: לְהִנָּקֵם מֵאֹיְבֵיהֶם
  choice: kujilipizia kisasi juu ya adui zao
  rationale: Nifali ya נקם ina maana ya kujilipizia kisasi au kulipiza kisasi, si kujilinda tu. ‘Juu ya adui zao’ huonyesha walengwa wa kisasi kwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Uwezekano wa kulainisha lugha ya kisasi na kuifanya kuwa kujilinda tu
  choice: kujilipizia kisasi juu ya adui zao
  alternative: kujilinda dhidi ya adui zao
  rationale: Ingawa muktadha mpana unahusu pia kujikinga, kitenzi נקם katika mstari huu hutaja wazi kujilipizia kisasi. Tafsiri haipaswi kupunguza mvutano wa kimaadili na kitheolojia uliomo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa waraka wa kifalme lakini kinachoeleweka kwa msomaji wa kawaida. Nahau ya Kiebrania inayorudia ‘jimbo’ imetafsiriwa kwa Kiswahili asilia na ufafanuzi wake umewekwa katika tanbihi. Alama zote za tanbihi [a]–[c] zimetumiwa katika matini kuu.
