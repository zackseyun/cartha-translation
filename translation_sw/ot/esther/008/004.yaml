  text: Then the king held out the golden scepter to Esther[a], and Esther rose and stood before the king.
translation:
  language: sw
  text: Ndipo mfalme akamnyoshea Esta fimbo ya dhahabu,[a] naye Esta akainuka, akasimama mbele ya mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaielekeza fimbo ya dhahabu kuelekea Esta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשֶׁט
  choice: akamnyoshea
  rationale: Kitenzi kina maana ya kunyoosha au kuelekeza kitu kwa mtu. “Akamnyoshea” ni Kiswahili cha kawaida na kinafaa kwa tendo la mfalme la kuelekeza fimbo kwa Esta.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: fimbo ya dhahabu
  rationale: Kirai hiki kinataja fimbo ya kifalme iliyotengenezwa kwa dhahabu au yenye sura ya dhahabu. “Fimbo ya dhahabu” ni tafsiri ya kawaida na inayoeleweka katika Kiswahili.
- source_word: וַתָּקָם
  choice: akainuka
  rationale: Kitenzi kinamaanisha kuinuka. Chaguo hili ni la heshima na linadumisha tofauti na tendo linalofuata la kusimama.
- source_word: וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  choice: akasimama mbele ya mfalme
  rationale: Kirai לִפְנֵי humaanisha “mbele ya” au “katika uwepo wa.” Tafsiri hii ni ya moja kwa moja, ya asili, na inadumisha mazingira rasmi ya ikulu.
- source_word: וַ
  choice: Ndipo
  rationale: Waw ya masimulizi inaendeleza mfuatano wa matukio. “Ndipo” huonyesha kwamba tendo hili lilifuata lililotangulia kwa mtindo wa asili wa Kiswahili.
- source_word: לְאֶסְתֵּר
  choice: -m- ... Esta
  rationale: Kihusishi kinaonyesha mlengwa wa tendo. Katika Kiswahili, kiambishi cha yambwa katika “akamnyoshea Esta” huwasilisha kwa kawaida maana ya “kwa/kuelekea Esta.”
