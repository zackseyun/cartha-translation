base_translation:
  language: en
  yaml_path: translation/ot/esther/008/001.yaml
  text: On that day King Ahasuerus gave Queen Esther the house of Haman, the enemy of the Jews, and Mordecai came before the king, because Esther had told what he was to her.
translation:
  language: sw
  text: Siku hiyo Mfalme Ahasuero alimpa Malkia Esta nyumba ya Hamani, adui wa Wayahudi. Mordekai akaja mbele ya mfalme, kwa sababu Esta alikuwa amemwambia mfalme Mordekai alikuwa nani kwake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הָמָן
  choice: mali yote ya Hamani
  rationale: Neno בַּיִת (‘nyumba’) katika muktadha huu linaweza kumaanisha nyumba na mali yote ya mtu; ‘mali yote’ huwasilisha maana ya milki ya Hamani iliyotwaliwa na kupewa Esta kwa Kiswahili cha kawaida.
- source_word: צֹרֵר הַיְּהוּדִים
  choice: adui wa Wayahudi
  rationale: צֹרֵר humtaja mwenye uadui au anayewatesa wengine; ‘adui’ ni tafsiri ya moja kwa moja na ya asili katika muktadha.
- source_word: בָּא לִפְנֵי הַמֶּלֶךְ
  choice: akaja mbele ya mfalme
  rationale: Muundo huu umehifadhiwa kwa ukaribu bila kufafanua zaidi kama kupewa cheo au ruhusa ya kuhudumu mbele ya mfalme.
- source_word: מַה הוּא לָהּ
  choice: jinsi Mordekai alivyokuwa wa uhusiano naye
  rationale: Kirai cha Kiebrania ni kifupi na kwa neno halisi ni ‘alivyokuwa kwake’; chaguo hili linaonyesha uhusiano wao bila kuutaja hapa kwa namna maalumu kuliko chanzo.
theological_decisions:
- issue: Sababu ya Mordekai kuja mbele ya mfalme
  choice: kwa sababu Esta alikuwa amemweleza
  alternative: kwa maana Esta alikuwa amemweleza
  rationale: כִּי hapa inaeleza sababu ya Mordekai kuruhusiwa kufika mbele ya mfalme. ‘Kwa sababu’ huiweka wazi bila kuongeza dai la kitheolojia.
- issue: Aina mahususi ya uhusiano wa Mordekai na Esta
  choice: jinsi Mordekai alivyokuwa wa uhusiano naye
  alternative: kwamba Mordekai alikuwa jamaa yake
  rationale: Chanzo katika mstari huu hakitajii aina ya uhusiano moja kwa moja; tafsiri inadumisha kiwango hicho cha kutobainisha, ingawa simulizi la awali limeueleza.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametolewa kwa maumbo yaliyozoeleka ya Kiswahili: Ahasuero, Esta, Hamani, na Mordekai.'
