base_translation:
  language: en
  yaml_path: translation/ot/esther/008/002.yaml
  text: Then the king removed his signet ring[a], which he had taken away from Haman, and gave it to Mordecai. And Esther appointed Mordecai over the house of Haman.
translation:
  language: sw
  text: Kisha mfalme akaivua pete yake ya muhuri, ambayo alikuwa ameichukua kutoka kwa Hamani, akampa Mordekai. Naye Esta akamweka Mordekai kusimamia nyumba ya Hamani[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wa nyumba ya Hamani” au “mali ya Hamani.”
    reason: Neno la Kiebrania בַּיִת linaweza kumaanisha nyumba, watu wa nyumbani, au mali/milki ya mtu katika muktadha huu.
lexical_decisions:
- source_word: וַיָּסַר
  choice: akaivua
  rationale: Katika muktadha wa pete, kitenzi hiki kinaeleza kuiondoa kutoka kidoleni; “akaivua” ni Kiswahili cha kawaida na sahihi.
- source_word: טַבַּעְתּוֹ
  choice: pete yake ya muhuri
  rationale: Ingawa neno la Kiebrania linaweza kumaanisha pete kwa ujumla, katika ikulu ya Esta pete hii ilitumika kuthibitisha mamlaka ya kifalme.
- source_word: אֲשֶׁר הֶעֱבִיר מֵהָמָן
  choice: aliyokuwa amemwondolea Hamani
  rationale: Hiphil ya עבר hapa ina maana ya kuondoa au kuchukua kutoka kwa mtu. Tafsiri hii inaonyesha kwamba pete ilikuwa imeondolewa kwa Hamani bila kufafanua zaidi namna ilivyochukuliwa.
- source_word: וַיִּתְּנָהּ לְמָרְדֳּכָי
  choice: akampa Mordekai
  rationale: Kiwakilishi cha yambwa kinarejelea pete; muundo huu ni mfupi na wa kawaida katika Kiswahili.
- source_word: וַתָּשֶׂם אֶסְתֵּר אֶת מָרְדֳּכַי עַל
  choice: Esta akamweka Mordekai kusimamia
  rationale: שׂוּם pamoja na עַל huonyesha kumweka mtu juu ya eneo la wajibu; “kumweka ... kusimamia” huwasilisha maana ya uteuzi wa kiutawala kwa Kiswahili cha kawaida.
- source_word: בֵּית הָמָן
  choice: nyumba ya Hamani
  rationale: “Nyumba” huhifadhi upana wa neno la Kiebrania בַּיִת, ambalo hapa linaweza kujumuisha watu wa nyumbani au mali yote ya Hamani.
