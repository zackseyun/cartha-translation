base_translation:
  language: en
  yaml_path: translation/ot/esther/008/017.yaml
  text: And in every province and province, and in every city and city, wherever the king’s word and his decree reached, there was joy and gladness for the Jews, a feast and a good day. And many from the peoples of the land were becoming Jews, because the fear of the Jews had fallen on them.
translation:
  language: sw
  text: Katika kila jimbo na kila mji, popote neno la mfalme na amri yake vilipofika, Wayahudi walikuwa na furaha na shangwe, karamu na siku ya sherehe. Watu wengi miongoni mwa mataifa ya nchi walikuwa wakigeuka kuwa Wayahudi[a], kwa sababu waliingiwa na hofu ya Wayahudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: walikuwa wakichukua utambulisho na desturi za Kiyahudi.'
    reason: Kitenzi cha Kiebrania ni adimu na kinaweza kumaanisha kuwa Myahudi au kujitambulisha na Wayahudi; hakielezi utaratibu kamili.
lexical_decisions:
- source_word: מְדִינָה וּמְדִינָה / עִיר וָעִיר
  choice: kila jimbo na kila mji
  rationale: Urudiaji wa Kiebrania una maana ya kugawa kwa ujumla, yaani kila jimbo na kila mji; Kiswahili cha kawaida huwasilisha maana hiyo bila kurudia nomino.
- source_word: דְּבַר הַמֶּלֶךְ וְדָתוֹ
  choice: neno la mfalme na amri yake
  rationale: דבר ni neno au tangazo la mfalme, na דת hapa ni amri rasmi yenye nguvu ya kisheria.
- source_word: מִשְׁתֶּה וְיוֹם טוֹב
  choice: karamu na siku ya kusherehekea
  rationale: מִשְׁתֶּה ni karamu, hasa yenye kunywa; יוֹם טוֹב hapa ni siku ya sherehe, si tu siku nzuri kwa maana ya kawaida.
- source_word: מִתְיַהֲדִים
  choice: walikuwa wakigeuka kuwa Wayahudi
  rationale: Umbo endelevu la kitenzi adimu linaonyesha watu wakichukua utambulisho wa Kiyahudi au kuwa Wayahudi, bila kulazimisha maelezo mahususi ya utaratibu huo.
- source_word: נָפַל פַּחַד הַיְּהוּדִים עֲלֵיהֶם
  choice: waliingiwa na hofu ya Wayahudi
  rationale: Hii ni Kiswahili cha asili kinachohifadhi maana ya sitiari ya Kiebrania kwamba hofu iliwapata au kuwashika.
theological_decisions:
- issue: Maana ya watu wa mataifa ‘kuwa Wayahudi’
  choice: walikuwa wakigeuka kuwa Wayahudi
  alternative: walijiunga na Wayahudi / walijifanya Wayahudi
  rationale: Kitenzi kinaweza kueleza kuchukua utambulisho na desturi za Kiyahudi, lakini mstari hautaji utaratibu kamili wala kusema wazi kwamba walifanya hivyo kwa unafiki. Tafsiri iliyochaguliwa huhifadhi dai la msingi na tanbihi hutaja upana wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. Muundo wa Kiebrania unaorudia ‘jimbo na jimbo’ na ‘mji na mji’ umetolewa kwa njia ya kawaida ya Kiswahili, ‘kila jimbo na kila mji,’ bila kupoteza maana ya ujumla.
