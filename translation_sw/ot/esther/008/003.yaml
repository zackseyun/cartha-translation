base_translation:
  language: en
  yaml_path: translation/ot/esther/008/003.yaml
  text: Then Esther spoke again before the king. She fell before his feet[a], wept, and pleaded with him to avert the evil of Haman the Agagite and his scheme that he had devised against the Jews.
translation:
  language: sw
  text: Kisha Esta akasema tena mbele ya mfalme. Akaanguka miguuni pake, akalia na kumsihi aondoe[a] uovu wa Hamani Mwagagi na mpango aliokuwa amepanga dhidi ya Wayahudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “avifutilie mbali” au “avifanye vipite”; kitenzi cha Kiebrania kinaonyesha kufanya uovu na mpango wa Hamani vipite au viondolewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף ... וַתְּדַבֵּר
  choice: akasema tena
  rationale: Muundo wa יסף ukifuatwa na kitenzi kingine huonyesha kurudiwa au kuendelea kwa tendo. “Akasema tena” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: mbele ya mfalme
  rationale: Kirai hiki kinaonyesha kuwa Esta alisema akiwa mbele ya mfalme katika mazingira rasmi ya kifalme.
- source_word: וַתִּפֹּל לִפְנֵי רַגְלָיו
  choice: Akaanguka miguuni pake
  rationale: Maneno haya yanaonyesha tendo halisi la kujitupa chini katika mkao wa kuomba kwa unyenyekevu; “miguuni pake” ni usemi wa asili katika Kiswahili.
- source_word: וַתֵּבְךְּ
  choice: akalia
  rationale: בכה humaanisha kulia au kutoa machozi; “akalia” inafaa kwa usimulizi wa Kiswahili wa sasa.
- source_word: וַתִּתְחַנֶּן לוֹ
  choice: kumsihi
  rationale: Kitenzi hiki katika hitpaeli kinaonyesha kuomba kwa bidii rehema au kibali. “Kumsihi” huhifadhi uzito wa ombi bila kuongeza maana isiyokuwamo.
- source_word: לְהַעֲבִיר
  choice: aondoe
  rationale: Hifili ya עבר hapa ina maana ya kufanya jambo lipite, kuliondoa, au kulibatilisha. “Aondoe” ni wazi na ya kawaida huku tanbihi ikihifadhi upana wa maana.
- source_word: אֶת רָעַת הָמָן
  choice: uovu wa Hamani
  rationale: רָעָה inaweza kumaanisha uovu, madhara, au maafa. “Uovu” huhifadhi kipengele cha kimaadili na kulitofautisha neno hili na “mpango” unaofuata.
- source_word: הָאֲגָגִי
  choice: Mwagagi
  rationale: Ni jina la ukoo au nasaba linalomtambulisha Hamani; umbo la Kiswahili “Mwagagi” linafaa kwa jina hilo.
- source_word: וְאֵת מַחֲשַׁבְתּוֹ אֲשֶׁר חָשַׁב
  choice: na mpango aliokuwa amepanga
  rationale: Jozi ya nomino na kitenzi kutoka mzizi חשב inasisitiza kupanga kwa makusudi. Kurudia “mpango ... amepanga” kunahifadhi mwangwi wa Kiebrania na bado kunaeleweka kwa urahisi.
- source_word: עַל הַיְּהוּדִים
  choice: dhidi ya Wayahudi
  rationale: Katika muktadha huu wa njama yenye uhasama, עַל ina maana ya kuelekezwa dhidi ya watu fulani.
