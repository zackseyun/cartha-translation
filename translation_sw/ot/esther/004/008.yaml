revisions:
- from: Pia akampa nakala[a] ya hati ya amri iliyotolewa huko Susa ili kuwaangamiza, ili amwonyeshe Esta na kumweleza, na amwagize aende kwa mfalme, amsihi amfadhili, na atoe ombi mbele yake kwa ajili ya watu wake.
  to: Pia akampa nakala[a] ya hati ya amri iliyotolewa Susa ili kuwaangamiza, ili amwonyeshe Esta nakala hiyo na kumjulisha yaliyomo, na kumwagiza aende kwa mfalme, amsihi na kutoa ombi mbele yake kwa ajili ya watu wake.
  rationale: The revision explicitly makes the copy the object shown to Esther. It replaces the non-idiomatic “amsihi amfadhili” with “amsihi na kutoa ombi mbele yake,” which naturally represents the two related Hebrew verbs for earnest supplication and petition in the king’s presence. “Kumjulisha yaliyomo” clarifies that Hathaki is to make the decree known to Esther while remaining within the contextual force of the source.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:17:10Z'
review_pass:
  verdict: revise
  source_fidelity: Draft accurately conveys the official decree, its issuance in Susa, its purpose of destroying Mordekai's people, and the instructions for Esther to approach and petition the king. However, “amwonyeshe Esta” lacks an explicit object and can be read as ‘introduce/show Esther’; the decree should be stated as the thing shown. “Amsihi amfadhili” is not idiomatic for Esther’s supplication to the king and risks shifting the sense toward material support rather than earnest appeal for favor.
  naturalness: The overall register is clear Standard East African Swahili. Adding “nakala hiyo” after “amwonyeshe Esta” and using a natural paired expression for earnest supplication and petition produces a smoother, unambiguous sentence.
  terminology: “Nakala ya hati ya amri,” “amri,” “Susa,” “kuwaangamiza,” and “kwa ajili ya watu wake” are suitable. The footnote faithfully preserves the documented lexical range of the Persian loanword.
  issues:
  - severity: medium
    issue: “ili amwonyeshe Esta” does not explicitly identify the document as what is shown.
    rationale: The Hebrew has the written decree as the object of ‘show,’ with Esther as the recipient. In Swahili, this wording may be misread as showing Esther herself rather than showing the copy to Esther.
  - severity: medium
    issue: “amsihi amfadhili” is awkward and imprecise.
    rationale: It can suggest asking the king to provide support or favor Esther personally. The Hebrew expresses earnest supplication to the king, followed by a petition before him on behalf of her people. A repeated but natural petition expression retains both actions without adding a different object.
  revised_text: Pia akampa nakala[a] ya hati ya amri iliyotolewa Susa ili kuwaangamiza, ili amwonyeshe Esta nakala hiyo na kumjulisha yaliyomo, na kumwagiza aende kwa mfalme, amsihi na kutoa ombi mbele yake kwa ajili ya watu wake.
  revised_footnotes:
  - marker: a
    text: Neno la Kiajemi lililotafsiriwa “nakala” linaweza pia kumaanisha maandishi ya hati rasmi.
    reason: lexical_alternative
  revision_rationale: The revision explicitly makes the copy the object shown to Esther. It replaces the non-idiomatic “amsihi amfadhili” with “amsihi na kutoa ombi mbele yake,” which naturally represents the two related Hebrew verbs for earnest supplication and petition in the king’s presence. “Kumjulisha yaliyomo” clarifies that Hathaki is to make the decree known to Esther while remaining within the contextual force of the source.
