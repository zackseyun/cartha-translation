translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi inadumisha mfuatano wa maagizo ya Kiebrania huku ikiepuka tafsiri sisisi zisizo za kawaida, hasa katika nahau ya kuomba mbele ya mfalme.
