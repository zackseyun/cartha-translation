  text: וְ/אֶת פַּתְשֶׁ֣גֶן כְּתָֽב הַ֠/דָּת אֲשֶׁר נִתַּ֨ן בְּ/שׁוּשָׁ֤ן לְ/הַשְׁמִידָ/ם֙ נָ֣תַן ל֔/וֹ לְ/הַרְא֥וֹת אֶת אֶסְתֵּ֖ר וּ/לְ/הַגִּ֣יד לָ֑/הּ וּ/לְ/צַוּ֣וֹת עָלֶ֗י/הָ לָ/ב֨וֹא אֶל הַ/מֶּ֧לֶךְ לְ/הִֽתְחַנֶּן ל֛/וֹ וּ/לְ/בַקֵּ֥שׁ מִ/לְּ/פָנָ֖י/ו עַל עַמָּֽ/הּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/008.yaml
  text: He also gave him a copy[a] of the written decree issued in Susa for their destruction, to show it to Esther and explain it to her, and to charge her to go to the king, implore his favor, and plead before him on behalf of her people.
translation:
  language: sw
  text: Pia akampa nakala[a] ya hati ya amri iliyotolewa Susa ili kuwaangamiza, ili amwonyeshe Esta nakala hiyo na kumjulisha yaliyomo, na kumwagiza aende kwa mfalme, amsihi na kutoa ombi mbele yake kwa ajili ya watu wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiajemi lililotafsiriwa “nakala” linaweza pia kumaanisha maandishi ya hati rasmi.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְשֶׁגֶן כְּתָב
  choice: nakala ya hati ya amri
  rationale: Neno la mkopo kutoka Kiajemi linaweza kumaanisha nakala au maandishi ya hati rasmi; tafsiri hii inaonyesha hati yenyewe na hadhi yake rasmi.
- source_word: הַדָּת
  choice: amri
  rationale: Katika mazingira ya utawala wa Uajemi katika Esta, neno hili linamaanisha agizo rasmi la kifalme; “amri” ni la kawaida na wazi katika Kiswahili.
- source_word: נִתַּן
  choice: iliyotolewa
  rationale: Katika muktadha wa kiutawala, kitenzi hiki kinaonyesha kwamba amri ilitangazwa au kuwekwa rasmi.
- source_word: בְּשׁוּשָׁן
  choice: huko Susa
  rationale: Hii ni namna ya asili ya kuonyesha mahali ambapo amri ilitolewa.
- source_word: לְהַשְׁמִידָם
  choice: ili kuwaangamiza
  rationale: Inaweka wazi kusudi la amri na kuhifadhi kiambishi cha nafsi cha wingi bila kubainisha zaidi kundi ambalo muktadha tayari umelitaja.
- source_word: נָתַן לוֹ
  choice: Pia akampa
  rationale: “Pia” huunganisha tendo hili na yaliyotangulia, na kiwakilishi kinabaki cha kawaida kwa sababu wahusika wanajulikana katika muktadha.
- source_word: לְהַרְאוֹת אֶת אֶסְתֵּר
  choice: ili amwonyeshe Esta
  rationale: Kitenzi cha Kiswahili chenye kiambishi cha mtendewa ni cha kawaida; kitu kinachoonyeshwa kinaeleweka kuwa nakala iliyotajwa.
- source_word: וּלְהַגִּיד לָהּ
  choice: na kumweleza
  rationale: “Kumweleza” huonyesha kumjulisha Esta yaliyomo au maana ya hati bila kuongeza jambo jipya.
- source_word: וּלְצַוּוֹת עָלֶיהָ
  choice: na amwagize
  rationale: “Amwagize” huhifadhi nguvu ya maelekezo ya dharura bila kumfanya Mordekai aonekane kama mwenye mamlaka ya kifalme.
- source_word: לָבוֹא אֶל הַמֶּלֶךְ
  choice: aende kwa mfalme
  rationale: Ni usemi wa sasa na wa kawaida wa Kiswahili; muktadha wa ikulu unaonyesha hatari ya kumkaribia mfalme.
- source_word: לְהִתְחַנֶּן לוֹ
  choice: amsihi amfadhili
  rationale: Huhifadhi maana ya kusihi kwa bidii ili kupata fadhili, badala ya kurudia tu wazo la kutoa ombi.
- source_word: וּלְבַקֵּשׁ מִלְּפָנָיו
  choice: na atoe ombi mbele yake
  rationale: Huwasilisha kwa Kiswahili cha kawaida nahau ya kiikulu ya kuomba katika uwepo wa mfalme.
- source_word: עַל עַמָּהּ
  choice: kwa ajili ya watu wake
  rationale: Hueleza wazi kwamba ombi lingetolewa kwa manufaa ya watu wa Esta.
