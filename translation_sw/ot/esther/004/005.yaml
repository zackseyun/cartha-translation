source:
  edition: WLC
  text: וַ/תִּקְרָא֩ אֶסְתֵּ֨ר לַ/הֲתָ֜ךְ מִ/סָּרִיסֵ֤י הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר הֶעֱמִ֣יד לְ/פָנֶ֔י/הָ וַ/תְּצַוֵּ֖/הוּ עַֽל מָרְדֳּכָ֑י לָ/דַ֥עַת מַה זֶּ֖ה וְ/עַל מַה זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/005.yaml
  text: Then Esther called for Hathach[a], one of the king’s eunuchs, whom he had appointed to attend her, and commanded him concerning Mordecai, to learn what this was and why it was.
translation:
  language: sw
  text: Ndipo Esta akamwita Hathaki[a], mmoja wa matowashi wa mfalme, ambaye mfalme alikuwa amemweka amhudumie, kisha akamwagiza kuhusu Mordekai ili ajue jambo hilo lilikuwa nini na kwa nini lilikuwa hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mmoja wa maafisa wa ikulu ya mfalme.” Neno la Kiebrania linaweza kumaanisha towashi hasa au, katika baadhi ya miktadha, afisa wa kifalme kwa maana pana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא
  choice: Ndipo Esta akamwita
  rationale: Wayyiqtol inaendeleza mfululizo wa simulizi; “Ndipo” na “akamwita” ni Kiswahili cha kawaida kinachoonyesha kwamba Esta alimwagiza aitwe aje kwake.
- source_word: לַהֲתָךְ
  choice: Hathaki
  rationale: Jina la Kiebrania limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: מִסָּרִיסֵי הַמֶּלֶךְ
  choice: mmoja wa matowashi wa mfalme
  rationale: סָרִיס kwa kawaida humaanisha towashi katika mazingira ya jumba la kifalme, ingawa wakati mwingine inaweza kumaanisha afisa wa kifalme kwa upana zaidi; maana hiyo mbadala imehifadhiwa katika tanbihi.
- source_word: אֲשֶׁר הֶעֱמִיד לְפָנֶיהָ
  choice: ambaye mfalme alikuwa amemweka amhudumie
  rationale: Mfalme ndiye mtendaji anayeeleweka kutokana na kishazi kilichotangulia. Usemi huu unaonyesha uteuzi rasmi wa kuhudumu mbele ya Esta bila kulazimisha tafsiri ya neno kwa neno isiyo ya kawaida.
- source_word: וַתְּצַוֵּהוּ עַל מָרְדֳּכָי
  choice: Akamwagiza aende kwa Mordekai
  rationale: צוה huhifadhiwa kwa “akamwagiza”; עַל מָרְדֳּכָי hapa inaeleweka katika muktadha kama agizo linalomhusu Mordekai, na “aende kwa Mordekai” hufanya kusudi la ujumbe lieleweke kwa kawaida katika Kiswahili.
- source_word: לָדַעַת
  choice: ili ajue
  rationale: Infinitivo hii inaonyesha kusudi la uchunguzi au ujumbe.
- source_word: מַה זֶּה וְעַל מַה זֶּה
  choice: jambo hilo lilikuwa nini na kwa nini lilikuwa hivyo
  rationale: Tafsiri inatofautisha swali kuhusu hali yenyewe na swali kuhusu sababu yake, huku ikihifadhi uwazi wa maneno ya Kiebrania bila kubainisha jambo hilo zaidi ya maandishi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye staha. Muundo wa simulizi umetiririshwa kwa vitenzi vya mfululizo, huku uradidi na tofauti ya maswali mawili ya mwisho ikihifadhiwa kwa lugha ya kawaida.
