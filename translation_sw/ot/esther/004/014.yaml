  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֣י אִם הַחֲרֵ֣שׁ תַּחֲרִישִׁי֮ בָּ/עֵ֣ת הַ/זֹּאת֒ רֶ֣וַח וְ/הַצָּלָ֞ה יַעֲמ֤וֹד לַ/יְּהוּדִים֙ מִ/מָּק֣וֹם אַחֵ֔ר וְ/אַ֥תְּ וּ/בֵית אָבִ֖י/ךְ תֹּאבֵ֑דוּ וּ/מִ֣י יוֹדֵ֔עַ אִם לְ/עֵ֣ת כָּ/זֹ֔את הִגַּ֖עַתְּ לַ/מַּלְכֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/014.yaml
  text: For if you remain silent at this time, relief and deliverance will arise for the Jews from another place, but you and your father's house will perish. And who knows whether you have come to your royal position for a time like this?
translation:
  language: sw
  text: Kwa maana ukiendelea kukaa kimya wakati huu, nafuu na ukombozi vitawatokea Wayahudi kutoka mahali pengine, lakini wewe na nyumba ya baba yako mtaangamia. Nani ajuaye kama umefikia cheo cha malkia kwa ajili ya wakati kama huu?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: Kwa maana uki-
  rationale: Muundo huu unadumisha uhusiano wa maelezo na sharti linalounganisha aya hii na onyo la aya iliyotangulia.
- source_word: הַחֲרֵשׁ תַּחֲרִישִׁי
  choice: ukiendelea kukaa kimya
  rationale: Kitenzi pamoja na kitenzi-jina cha kusisitiza huonyesha kunyamaza kwa makusudi na kwa kuendelea; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: בָּעֵת הַזֹּאת
  choice: wakati huu
  rationale: Hurejelea kipindi hiki cha hatari kilichopo sasa bila kuongeza maana isiyomo katika Kiebrania.
- source_word: רֶוַח
  choice: nafuu
  rationale: Katika muktadha huu neno humaanisha kupata nafasi ya kupumua au afueni kutokana na hatari; “nafuu” ni neno la kawaida na fupi.
- source_word: וְהַצָּלָה
  choice: na ukombozi
  rationale: Hapa ni kuokolewa kutoka katika maangamizi yaliyotishwa. “Ukombozi” huhifadhi uzito wa uokoaji huo bila kulazimisha maelezo ya chanzo chake.
- source_word: יַעֲמֹד
  choice: vitawatokea
  rationale: Ingawa maana ya msingi ni ‘kusimama,’ katika muktadha huu kitenzi hueleza nafuu na ukombozi kujitokeza au kutokea kwa ajili ya Wayahudi.
- source_word: לַיְּהוּדִים
  choice: Wayahudi
  rationale: Katika Esta neno hili linawahusu watu wa Kiyahudi waliokuwa katika milki ya Uajemi; “Wayahudi” ndilo neno la kawaida katika Kiswahili.
- source_word: מִמָּקוֹם אַחֵר
  choice: kutoka mahali pengine
  rationale: Tafsiri hii inadumisha kutotajwa kwa wazi kwa chanzo cha msaada.
- source_word: וְאַתְּ וּבֵית אָבִיךְ
  choice: lakini wewe na nyumba ya baba yako
  rationale: “Nyumba ya baba” huhifadhi usemi wa ukoo na jamaa wa Kiebrania, nao unaeleweka katika mtindo wa kibiblia wa Kiswahili.
- source_word: תֹּאבֵדוּ
  choice: mtaangamia
  rationale: Neno hili linaweza kuhusisha kufa au kuharibiwa; “mtaangamia” hudumisha upana na uzito wa onyo.
- source_word: וּמִי יוֹדֵעַ
  choice: Nani ajuaye
  rationale: Ni swali la balagha linalowasilisha uwezekano bila kuugeuza kuwa uhakika; muundo huu ni wa heshima na wa kawaida katika Kiswahili cha maandiko.
- source_word: הִגַּעַתְּ לַמַּלְכוּת
  choice: umefikia cheo cha malkia
  rationale: Katika muktadha wa Esta, usemi huu unaeleza kufika katika hadhi ya kifalme. “Cheo cha malkia” ni wazi kuliko “ufalme,” ambalo lingeweza kueleweka kuwa eneo linalotawaliwa.
- source_word: אִם לְעֵת כָּזֹאת
  choice: kama ... kwa ajili ya wakati kama huu
  rationale: Muundo huu hudumisha uwezekano wa kusudi au majaliwa bila kuthibitisha moja kwa moja kuwa hayo ndiyo makusudi ya Mungu.
theological_decisions:
- issue: Maongozi ya Mungu yanayodokezwa katika “kutoka mahali pengine” na “kwa ajili ya wakati kama huu”
  choice: Kutodumisha jina la Mungu katika matini, na kuhifadhi maneno yasiyo ya moja kwa moja
  alternative: Kutaja wazi kwamba nafuu na ukombozi vitatoka kwa Mungu au kwamba Mungu alimfikisha Esta katika cheo hicho
  rationale: Aya inadokeza kwa nguvu maongozi ya Mungu, lakini Kiebrania hakimtaji Mungu wazi. Kutomtaja katika tafsiri kunahifadhi mvutano na utata wa kimakusudi wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Nani ajuaye” na “nyumba ya baba yako” vina ladha ya maandiko bila kuwa vya kizamani kupita kiasi.
