lexical_decisions:
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: Kitenzi hiki katika mfululizo wa simulizi kinaeleza tendo lililokamilika la kutoka; “akatoka” huhifadhi maana ya kuondoka mahali alipokuwa Esta.
- source_word: הֲתָךְ
  choice: Hathaki
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: אֶל מָרְדֳּכָי
  choice: kwenda kwa Mordekai
  rationale: Kirai hiki kinaonyesha uelekeo na mahali aliko mtu; “kwenda kwa Mordekai” ni Kiswahili cha kawaida na wazi.
- source_word: אֶל רְחוֹב הָעִיר
  choice: katika uwanja wa wazi wa mji
  rationale: רְחוֹב hapa ni eneo pana la wazi la umma mjini, si lazima barabara kwa maana ya kisasa.
- source_word: אֲשֶׁר לִפְנֵי
  choice: uliokuwa mbele ya
  rationale: Huhifadhi uhusiano wa mahali wa kishazi tegemezi kwa lugha ya asili na ya kawaida.
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: lango la mfalme
  rationale: Hili ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa umilikaji, pia hudumisha mahali panaporudiwa katika simulizi la Esta.
