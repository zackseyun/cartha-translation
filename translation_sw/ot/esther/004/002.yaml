  text: He came as far as the front of the king’s gate[b][a], because no one could enter the king’s gate clothed in sackcloth.
translation:
  language: sw
  text: Akafika hadi mbele ya lango la mfalme[a], kwa maana haikuruhusiwa kuingia katika lango la mfalme ukiwa umevaa vazi la gunia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akafika hadi mahali palipokuwa mbele ya lango la mfalme.” Kiebrania kinakazia kwamba alikaribia tu mpaka eneo lililokuwa mbele ya lango.
    reason: lexical_alternative
  - marker: b
    text: 'Kwa tafsiri ya karibu zaidi na muundo wa Kiebrania: “kwa maana hakukuwa na kuingia katika lango la mfalme ukiwa umevaa vazi la gunia.” Katika muktadha, maana yake ni kwamba kuingia kwa vazi la maombolezo hakukuruhusiwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Akafika
  rationale: Kitenzi בוא katika mfululizo wa simulizi kinaonyesha Mordekai kufika mahali hapo; “akafika” ni Kiswahili cha kawaida na hudumisha mtazamo wa kulikaribia lango.
- source_word: עַד לִפְנֵי
  choice: mpaka mbele ya
  rationale: 'Muungano huu unaonyesha kikomo cha mwendo: alifika eneo lililokuwa mbele ya lango bila kuingia ndani. “Mpaka mbele ya” huhifadhi wazo la kikomo na mahali.'
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: lango la mfalme
  rationale: Hili ni fumbo la uhusiano linalotafsiriwa kwa kawaida katika Kiswahili; linadumisha mazingira ya makao ya kifalme bila kuongeza maelezo yasiyomo.
- source_word: כִּי אֵין לָבוֹא
  choice: kwa sababu hakuna mtu aliyeruhusiwa kuingia
  rationale: אֵין pamoja na kitenzi-jina hapa huonyesha kutowezekana kwa sababu ya marufuku katika muktadha. Usemi huu unaeleza kwa Kiswahili cha kawaida sababu ya Mordekai kusimama nje.
- source_word: אֶל שַׁעַר הַמֶּלֶךְ
  choice: katika lango la mfalme
  rationale: אֶל inaweza kumaanisha kuelekea au kuingia ndani; katika muktadha huu inahusu kuingia kwenye eneo la lango. “Katika” ni usemi wa kawaida baada ya “kuingia.”
- source_word: בִּלְבוּשׁ שָׂק
  choice: akiwa amevaa nguo ya gunia
  rationale: Kirai hicho ni “katika vazi la gunia.” “Nguo ya gunia” ni lugha inayoeleweka kwa wasomaji wa kisasa na huhifadhi maana ya vazi la maombolezo bila kudai kuwa lilikuwa vazi zaidi ya moja.
