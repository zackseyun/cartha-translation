translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Mfuatano wa vitenzi “wakaja wakamweleza” huhifadhi mwendo wa simulizi la Kiebrania. Alama zote za tanbihi zimewekwa baada ya maneno yanayohusika; tanbihi [b] imewekwa mwishoni mwa sentensi ili kutokatiza sana mtiririko, huku ikirejelea “matowashi.”
