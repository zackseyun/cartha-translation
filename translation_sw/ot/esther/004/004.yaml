base_translation:
  language: en
  yaml_path: translation/ot/esther/004/004.yaml
  text: Esther’s young women and her eunuchs came and told her[a], and the queen was greatly distressed. She sent garments to clothe Mordecai and to remove his sackcloth from him[c][b], but he did not accept them.
translation:
  language: sw
  text: Wasichana wa Esta na matowashi wake[b] wakaja wakamweleza[a], naye malkia akafadhaika sana. Akatuma mavazi ili wamvike Mordekai na wamvue nguo yake ya gunia[c], lakini hakuyakubali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wahudumu wa kike wa Esta” badala ya “wasichana wa Esta.”
    reason: lexical_alternative
  - marker: b
    text: Neno “matowashi” wakati mwingine linaweza kumaanisha maafisa wa ikulu kwa upana zaidi, lakini katika mazingira ya ikulu ya Esta maana mahususi ya matowashi inaelekea kufaa.
    reason: cultural_note
  - marker: c
    text: Nguo ya gunia ilikuwa vazi lenye kukwaruza lililovaliwa kuonyesha maombolezo, huzuni au kudhalilika.
    reason: cultural_note
lexical_decisions:
- source_word: נַעֲרוֹת
  choice: wasichana
  rationale: Neno hilo humaanisha wanawake vijana, na katika mazingira haya ni wahudumu wa kike wa Esta. “Wasichana” ni tafsiri ya moja kwa moja na ya kawaida; tanbihi inaeleza kazi yao katika ikulu.
- source_word: וְסָרִיסֶיהָ
  choice: na matowashi wake
  rationale: סָרִיס kwa kawaida humaanisha towashi katika ikulu ya kifalme, ingawa wakati mwingine huweza kumaanisha afisa wa ikulu kwa upana zaidi. “Matowashi” huhifadhi maana mahususi inayofaa mazingira ya ikulu ya Uajemi.
- source_word: וַיַּגִּידוּ לָהּ
  choice: wakaja wakamweleza
  rationale: 'Muundo huu huhifadhi mfuatano wa simulizi: walifika kwa Esta kisha wakampa habari.'
- source_word: וַתִּתְחַלְחַל
  choice: akafadhaika sana
  rationale: Kitenzi kinaonyesha mshtuko na mfadhaiko mkubwa. Usemi huu ni wa asili katika Kiswahili na hauondoi uzito wa hisia.
- source_word: הַמַּלְכָּה
  choice: malkia
  rationale: Ni cheo maalumu kinachomtaja Esta katika nafasi yake ya kifalme.
- source_word: בְּגָדִים
  choice: mavazi
  rationale: “Mavazi” ni neno la heshima na linaloeleweka, linalofaa mazingira rasmi ya ikulu.
- source_word: לְהַלְבִּישׁ אֶת מָרְדֳּכַי
  choice: ili wamvike Mordekai
  rationale: Hueleza kusudi la kutumwa kwa mavazi. Wingi usiotajwa wazi katika Kiswahili unaeleweka kuwa ni wajumbe waliotumwa kuyapeleka.
- source_word: וּלְהָסִיר שַׂקּוֹ מֵעָלָיו
  choice: na kumvua nguo yake ya gunia
  rationale: Huhifadhi tendo halisi la kuondoa vazi hilo kutoka mwilini mwa Mordekai, kwa Kiswahili cha kawaida.
- source_word: שַׂקּוֹ
  choice: nguo yake ya gunia
  rationale: “Nguo ya gunia” hutaja vazi maalumu la kuombolezea badala ya kulifafanua kwa jumla tu kuwa nguo za maombolezo.
- source_word: וְלֹא קִבֵּל
  choice: lakini hakuyakubali
  rationale: Kiwakilishi cha ngeli ya mavazi kinaweka wazi kuwa Mordekai alikataa mavazi yaliyotumwa, bila kuongeza sababu ambayo maandiko hayasemi.
