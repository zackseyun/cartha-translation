    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Ndipo Esta akamwambia
  rationale: Waw-consecutive inaendeleza simulizi. Kitenzi אמר pamoja na kiambishi ל kinatolewa kwa Kiswahili cha kawaida kama “akamwambia,” bila kupoteza maana ya kusema.
- source_word: אֶסְתֵּר
  choice: Esta
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: לַהֲתָךְ
  choice: Hathaki
  rationale: Kiambishi ל kinaonyesha anayeelekezewa maneno; jina limetoholewa kwa kufuata matamshi ya Kiebrania kwa umbo linalosomeka katika Kiswahili.
- source_word: וַתְּצַוֵּהוּ
  choice: akamwagiza
  rationale: Piel ya צוה ina maana ya kutoa agizo au amri. “Akamwagiza” ni ya asili katika muktadha wa mjumbe na bado inadumisha uzito wa maelekezo; kiambishi cha nafsi kinamrejelea Hathaki.
- source_word: אֶל
  choice: aende kwa
  rationale: אֶל inaonyesha mwelekeo, “kwa/kuelekea.” Kwa kuwa Kiebrania hakitaji wazi kitenzi cha kwenda, “aende” linaongezwa ili sentensi iwe kamili na ya kawaida katika Kiswahili, huku maana iliyodokezwa ikibainishwa katika tanbihi.
- source_word: מָרְדֳּכָי
  choice: Mordekai
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
