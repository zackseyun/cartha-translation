  text: וּ/מָרְדֳּכַ֗י יָדַע֙ אֶת כָּל אֲשֶׁ֣ר נַעֲשָׂ֔ה וַ/יִּקְרַ֤ע מָרְדֳּכַי֙ אֶת בְּגָדָ֔י/ו וַ/יִּלְבַּ֥שׁ שַׂ֖ק וָ/אֵ֑פֶר וַ/יֵּצֵא֙ בְּ/ת֣וֹךְ הָ/עִ֔יר וַ/יִּזְעַ֛ק זְעָקָ֥ה גְדֹלָ֖ה וּ/מָרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/001.yaml
  text: When Mordecai learned all that had been done[a], Mordecai tore his clothes and put on sackcloth and ashes. Then he went out into the midst of the city and cried out with a great and bitter cry.
translation:
  language: sw
  text: Mordekai alipojua yote yaliyokuwa yamefanyika, alirarua mavazi yake, akavaa nguo ya gunia na kujipaka majivu. Kisha akaenda katikati ya mji, akapaza kilio kikubwa na cha uchungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kwa mkazo, “alilia kilio kikubwa na cha uchungu,” kwa kutumia kitenzi na nomino zenye mzizi mmoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַע
  choice: alipojua
  rationale: Katika muktadha huu kitenzi kinaonyesha Mordekai kupata habari na kutambua yaliyofanyika; “alipojua” ni Kiswahili cha kawaida na hakiongezi namna ambayo habari zilimfikia.
- source_word: כָּל אֲשֶׁר נַעֲשָׂה
  choice: yote yaliyokuwa yamefanyika
  rationale: Huhifadhi maana ya jumla na hali ya kutendwa katika simulizi, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: וַיִּקְרַע ... אֶת בְּגָדָיו
  choice: alirarua mavazi yake
  rationale: Ni maelezo ya moja kwa moja ya ishara ya maombolezo; “mavazi” ni ya heshima na ya sasa.
- source_word: שַׂק וָאֵפֶר
  choice: nguo ya gunia na kujipaka majivu
  rationale: “Nguo ya gunia” huwasilisha vazi la maombolezo, na kitenzi “kujipaka” kinafanya uhusiano na majivu uwe wazi kwa msomaji wa Kiswahili bila kubadili tendo la msingi.
- source_word: בְּתוֹךְ הָעִיר
  choice: katikati ya mji
  rationale: Huhifadhi maana ya mahali ya בְּתוֹךְ bila kuibana kuwa lazima kituo rasmi cha mji.
- source_word: וַיִּזְעַק זְעָקָה גְדֹלָה וּמָרָה
  choice: akapaza kilio kikubwa na cha uchungu
  rationale: “Akapaza kilio” huwasilisha kitenzi pamoja na nomino yenye mzizi mmoja kwa Kiswahili cha asili; “kikubwa” na “cha uchungu” huhifadhi nguvu na hisia za Kiebrania.
