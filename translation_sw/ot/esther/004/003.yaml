  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/בְ/כָל מְדִינָ֣ה וּ/מְדִינָ֗ה מְקוֹם֙ אֲשֶׁ֨ר דְּבַר הַ/מֶּ֤לֶךְ וְ/דָת/וֹ֙ מַגִּ֔יעַ אֵ֤בֶל גָּדוֹל֙ לַ/יְּהוּדִ֔ים וְ/צ֥וֹם וּ/בְכִ֖י וּ/מִסְפֵּ֑ד שַׂ֣ק וָ/אֵ֔פֶר יֻצַּ֖ע לָֽ/רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/003.yaml
  text: And in every province[a], wherever the king’s word and his decree reached, there was great mourning among the Jews, with fasting and weeping and lamentation; sackcloth and ashes were spread out for many.
translation:
  language: sw
  text: Na katika kila jimbo, popote ambapo neno la mfalme na amri yake vilifika, kulikuwa na maombolezo makubwa miongoni mwa Wayahudi, pamoja na kufunga, kulia na kuomboleza. Nguo za magunia na majivu vilitandazwa kwa ajili ya wengi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wengi walitumia nguo za magunia na majivu.” Maneno ya Kiebrania yaliyotafsiriwa “kwa ajili ya wengi” ni mafupi na yanaweza kumaanisha kwamba vitu hivyo vya maombolezo vilitandazwa kwa ajili ya watu wengi au kwamba vilitumiwa na wengi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל מְדִינָה וּמְדִינָה
  choice: katika kila jimbo
  rationale: Urudiaji wa Kiebrania una maana ya mgawanyo na ujumla; Kiswahili cha kawaida ‘katika kila jimbo’ huwasilisha maana hiyo kwa uwazi.
- source_word: מְקוֹם אֲשֶׁר
  choice: popote ambapo
  rationale: Huhifadhi maana ya kila mahali ambapo hali iliyotajwa ilitokea.
- source_word: דְּבַר הַמֶּלֶךְ וְדָתוֹ
  choice: neno la mfalme na amri yake
  rationale: ‘Neno’ huhifadhi upana wa דָּבָר, huku ‘amri’ ikionyesha nguvu rasmi ya kisheria ya דָּת katika mazingira ya kifalme.
- source_word: מַגִּיעַ
  choice: vilifika
  rationale: Kitenzi hiki kinaeleza tangazo na amri ya kifalme kufikishwa katika majimbo mbalimbali; wingi unafuata viima viwili katika Kiswahili.
- source_word: אֵבֶל גָּדוֹל לַיְּהוּדִים
  choice: kulikuwa na maombolezo makubwa miongoni mwa Wayahudi
  rationale: ‘Maombolezo’ yanafaa kwa huzuni ya pamoja iliyoonyeshwa kwa desturi za kuomboleza; ‘miongoni mwa’ huonyesha waliopatwa nayo.
- source_word: וְצוֹם וּבְכִי וּמִסְפֵּד
  choice: pamoja na kufunga, kulia na kuomboleza
  rationale: 'Orodha inadumisha matendo tofauti ya huzuni: kujinyima chakula, kutoa machozi, na maombolezo ya wazi.'
- source_word: שַׂק וָאֵפֶר
  choice: nguo za magunia na majivu
  rationale: ‘Nguo za magunia’ ni usemi wa Kiswahili unaoeleweka kwa kitambaa kigumu cha maombolezo, na ‘majivu’ huhifadhi ishara ya pili bila kuifafanua kupita kiasi.
- source_word: יֻצַּע לָרַבִּים
  choice: vilitandazwa kwa ajili ya wengi
  rationale: ‘Vilitandazwa’ huhifadhi taswira halisi ya Hophal ya יצע. לָרַבִּים ni fupi na inaweza kumaanisha kwa ajili ya wengi au, kimuktadha, kwamba wengi walivitumia; utata umehifadhiwa kwa tanbihi.
