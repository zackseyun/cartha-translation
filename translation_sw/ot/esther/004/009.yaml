translation:
  language: sw
  text: Basi Hathaki akaja, akamwambia Esta maneno ya Mordekai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ujumbe wa Mordekai,” au “yale aliyosema Mordekai.” Kiebrania kinasema kihalisi “maneno ya Mordekai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּב֖וֹא
  choice: akaenda kwa Esta
  rationale: Kitenzi בוא kinaweza kumaanisha ‘kuja’ au ‘kwenda’ kulingana na mtazamo. Katika Kiswahili, kwa kuwa Hathaki alikuwa ametoka kwa Esta kwenda kwa Mordekai (mst. 6), ‘akaenda kwa Esta’ huonyesha kwa kawaida kurejea kwake bila kudokeza kwamba msimulizi yuko pamoja na Esta.
- source_word: הֲתָ֑ךְ
  choice: Hathaki
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa Kiswahili.
- source_word: וַיַּגֵּ֣ד
  choice: akamwambia
  rationale: Hifili ya נגד humaanisha kufanya jambo lijulikane, kusema, au kutoa taarifa. ‘Akamwambia’ ni usemi wa kawaida wa simulizi na unaonyesha kwa usahihi mpokeaji wa taarifa.
- source_word: לְאֶסְתֵּ֔ר
  choice: kwa Esta / -mw-
  rationale: לְ huonyesha anayelengwa au anayepokea; katika Kiswahili maana hii imewakilishwa katika ‘kwa Esta’ na kiambishi cha yambwa ‘-mw-’ katika ‘akamwambia.’
- source_word: אֵ֖ת
  choice: '[hakijatafsiriwa kivyake]'
  rationale: Ni kiashiria cha yambwa tendwa katika Kiebrania, kisicho na maana huru ya kileksika; kazi yake inaonyeshwa na sarufi ya Kiswahili.
- source_word: דִּבְרֵ֥י
  choice: maneno ya
  rationale: Huu ni wingi wa hali ya muunganiko wa דָּבָר. ‘Maneno ya’ huhifadhi muundo halisi na pia ni Kiswahili cha kawaida; katika muktadha inaweza kumaanisha ujumbe au yale aliyosema.
- source_word: מָרְדֳּכָֽי
  choice: Mordekai
  rationale: Jina la mtu limetoholewa kwa tahajia ya Kiswahili iliyozoeleka.
