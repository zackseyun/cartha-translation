translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha masimulizi na chenye heshima. Muundo ni wa kawaida na unaeleweka, huku ukihifadhi taswira ya kale ya kupima fedha kwa uzito na wingi wa hazina za mfalme.
