base_translation:
  language: en
  yaml_path: translation/ot/esther/004/007.yaml
  text: Mordecai told him everything that had happened to him[a], and the exact amount of money that Haman had said he would weigh out into the king’s treasuries for the destruction of the Jews.
translation:
  language: sw
  text: Mordekai akamweleza kila jambo lililompata, na kiasi mahususi cha fedha ambacho Hamani alisema angekipima na kukiweka katika hazina za mfalme ili kuwaangamiza Wayahudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, "maelezo kamili kuhusu fedha" au "jumla ya fedha." Kifungu cha Kiebrania kinarejelea kiasi kilichobainishwa ambacho Hamani alipendekeza kulipa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד לוֹ
  choice: akamweleza
  rationale: Kitenzi hiki humaanisha kumjulisha au kumweleza mtu jambo; kiambishi cha yambwa humrejelea Hathaki katika muktadha.
- source_word: אֵת כָּל אֲשֶׁר קָרָהוּ
  choice: kila jambo lililompata
  rationale: Huhifadhi maana ya mambo yote yaliyompata Mordekai pamoja na kiambishi cha Kiebrania kinachomaanisha ‘yeye.’
- source_word: פָּרָשַׁת הַכֶּסֶף
  choice: kiasi kamili cha fedha
  rationale: Katika muktadha huu neno פָּרָשָׁה linaonyesha kiasi kilichobainishwa au taarifa kamili ya fedha, si fedha kwa ujumla tu.
- source_word: אָמַר ... לִשְׁקוֹל
  choice: alikuwa amesema angekipima
  rationale: Huhifadhi tendo la kusema na taswira halisi ya fedha kupimwa kwa uzito.
- source_word: עַל גִּנְזֵי הַמֶּלֶךְ
  choice: na kukiweka katika hazina za mfalme
  rationale: Huonyesha kuwa fedha hiyo ingeingizwa katika mfumo wa hazina za kifalme na huhifadhi wingi wa ‘hazina.’
- source_word: ביהודיים לְאַבְּדָם
  choice: ili kuwaangamiza Wayahudi
  rationale: Huonyesha wazi kusudi la malipo na walengwa wa tendo la kuharibu; ‘kuwaangamiza’ linafaa kwa Piel ya אבד katika muktadha wa amri ya kuwaua kabisa.
