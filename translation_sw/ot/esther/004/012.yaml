  text: And they told Mordecai Esther’s words[a].
translation:
  language: sw
  text: Nao wakamwambia Mordekai maneno ya Esta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ujumbe wa Esta” au “jibu la Esta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּידוּ
  choice: Nao wakamwambia
  rationale: Hifili ya נגד katika mfululizo wa simulizi inaeleza hatua inayofuata, huku wahusika wa wingi wakiwa hawakutajwa. “Wakamwambia” ni ya asili katika Kiswahili na inaonyesha kwamba ujumbe ulipelekwa kwa Mordekai.
- source_word: לְמָרְדֳּכָי
  choice: Mordekai
  rationale: Kiambishi לְ kinaonyesha mlengwa wa taarifa; katika Kiswahili uhusiano huo tayari unaonyeshwa na muundo wa kitenzi “wakamwambia.” Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: אֵת
  choice: '[hakikutafsiriwa kando]'
  rationale: Hiki ni kiashiria cha yambwa tendwa katika Kiebrania, kisicho na neno linalolingana nacho moja kwa moja katika Kiswahili; kazi yake inaonekana katika mpangilio wa sentensi.
- source_word: דִּבְרֵי
  choice: maneno
  rationale: Wingi tegemezi wa דָּבָר unaweza kumaanisha “maneno,” “ujumbe,” au, kulingana na muktadha, “jibu.” “Maneno” linafuata maandishi kwa uwazi zaidi bila kuamua kimyakimya kama yaliyosemwa yalikuwa ujumbe au jibu.
- source_word: אֶסְתֵּר
  choice: ya Esta
  rationale: Muundo tegemezi wa Kiebrania umeonyeshwa kwa kihusishi cha umilikaji “ya,” nacho jina limetoholewa kwa namna ya kawaida ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi unaoeleweka na lugha yenye heshima. “Nao” hudumisha uhusiano na tukio lililotangulia, na “wakamwambia” huhifadhi mhusika wa wingi ambaye hakutajwa wazi katika chanzo.
