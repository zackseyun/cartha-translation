  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Akawaagiza wamjibu’ huepuka tafsiri ngumu ya neno kwa neno huku ikibainisha maana ya usemi wa Kiebrania katika muktadha.
