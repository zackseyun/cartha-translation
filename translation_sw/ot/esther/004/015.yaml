  text: Then Esther told them to reply to Mordecai:[a]
translation:
  language: sw
  text: Ndipo Esta akamwagiza amjibu Mordekai:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kwa neno kwa neno, “Esta akasema kujibu kwa Mordekai.” Maana katika muktadha ni kwamba alimwagiza Hataki ampelekee Mordekai jibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Ndipo ... akawaagiza
  rationale: Kitenzi hiki kinaendeleza mfululizo wa simulizi. Katika muundo huu pamoja na לְהָשִׁיב, ‘akawaagiza’ kinaeleza kwa Kiswahili cha kawaida kwamba Esta alitoa maagizo ya ujumbe wa jibu kupelekwa.
- source_word: אֶסְתֵּר
  choice: Esta
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Biblia za Kiswahili.
- source_word: לְהָשִׁיב
  choice: wamjibu
  rationale: Hiphil ya שוב hapa ina maana ya kusababisha jibu lirudi, yaani kutuma jibu. ‘Wamjibu’ ni ya asili katika Kiswahili na huhifadhi maana ya kuitikia ujumbe uliotangulia; wingi usiotajwa wazi unaeleweka kutokana na wajumbe katika muktadha.
- source_word: אֶל
  choice: -m- ... Mordekai
  rationale: Kihusishi cha kuelekea kinawakilishwa kiasili na kiambishi cha yambwa katika ‘wamjibu Mordekai’.
- source_word: מָרְדֳּכָי
  choice: Mordekai
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili.
