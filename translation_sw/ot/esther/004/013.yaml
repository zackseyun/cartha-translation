  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהָשִׁיב אֶל־אֶסְתֵּר
  choice: wamjibu Esta
  rationale: Muundo wa Kiebrania una maana ya kupeleka jibu kwa Esta; wingi unaoeleweka katika Kiswahili unawahusu wajumbe waliokuwa wakipitisha ujumbe.
- source_word: אַל־תְּדַמִּי בְנַפְשֵׁךְ
  choice: Usifikiri
  rationale: Huwasilisha katazo la kujidhania au kuamini moyoni kwa lugha ya sasa iliyo wazi bila kuongeza ufafanuzi usiotajwa.
- source_word: לְהִמָּלֵט
  choice: utaokoka
  rationale: Kitenzi hiki hapa kinaeleza kuponyoka au kuachwa salama kutokana na maangamizi yaliyowakabili Wayahudi.
- source_word: בֵּית הַמֶּלֶךְ
  choice: kwa kuwa umo katika nyumba ya mfalme
  rationale: ‘Nyumba ya mfalme’ imehifadhiwa, huku uhusiano unaodokezwa na mahali hapo ukielezwa kwa Kiswahili cha kawaida.
- source_word: מִכָּל הַיְּהוּדִים
  choice: wewe peke yako kati ya Wayahudi wote
  rationale: Katika muktadha, מִן inaonyesha Esta kujitenga na hatima ya Wayahudi wengine; tafsiri hii huwasilisha maana hiyo ya kulinganisha kwa uwazi.
