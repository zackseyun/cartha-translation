  text: So Mordecai went away and did according to all that Esther had commanded him[a].
translation:
  language: sw
  text: Basi Mordekai akaondoka, akafanya yote kama Esta alivyomwamuru.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akapita” au “akaendelea”; kitenzi cha Kiebrania humaanisha kihalisi “kupita” au “kuvuka,” lakini hapa huenda kinamaanisha kwamba Mordekai aliondoka kwenda kutekeleza maagizo ya Esta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: akaondoka
  rationale: Kitenzi עבר kimsingi humaanisha kupita au kuvuka, lakini katika muktadha huu kinaelekea kuonyesha kwamba Mordekai aliondoka kwenda kutekeleza maagizo ya Esta. ‘Akaondoka’ ni Kiswahili cha kawaida na hakiongezi mahali ambapo hakutajwa.
- source_word: וַיַּעַשׂ
  choice: akafanya
  rationale: עשה ni kitenzi cha kawaida chenye maana ya ‘kufanya.’ ‘Akafanya’ huhifadhi usahili wa usimulizi wa Kiebrania.
- source_word: כְּכֹל אֲשֶׁר
  choice: yote kama
  rationale: Muundo huu unaonyesha kwamba kitendo cha Mordekai kililingana kikamilifu na maagizo ya Esta; ‘yote kama’ huhifadhi nguvu ya כֹּל kwa Kiswahili cha asili.
- source_word: צִוְּתָה
  choice: alivyomwamuru
  rationale: צוה humaanisha kuamuru. Muundo ‘alivyomwamuru’ unaunganika kwa kawaida na ‘akafanya yote kama’ na kuweka wazi kwamba maagizo yalitangulia utekelezaji.
- source_word: עָלָיו
  choice: -m- katika ‘alivyomwamuru’
  rationale: Pamoja na צוה, עָלָיו humtaja mtu aliyepewa amri. Kiswahili huonyesha mhusika huyo kwa kiambishi cha yambwa ‘-m-’.
- source_word: אֶסְתֵּר
  choice: Esta
  rationale: Jina limetolewa kwa umbo la Kiswahili linalotumika kwa kawaida.
