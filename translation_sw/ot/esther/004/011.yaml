  text: כָּל עַבְדֵ֣י הַ/מֶּ֡לֶךְ וְ/עַם מְדִינ֨וֹת הַ/מֶּ֜לֶךְ יֽוֹדְעִ֗ים אֲשֶׁ֣ר כָּל אִ֣ישׁ וְ/אִשָּׁ֡ה אֲשֶׁ֣ר יָבֽוֹא אֶל הַ/מֶּלֶךְ֩ אֶל הֶ/חָצֵ֨ר הַ/פְּנִימִ֜ית אֲשֶׁ֣ר לֹֽא יִקָּרֵ֗א אַחַ֤ת דָּת/וֹ֙ לְ/הָמִ֔ית לְ֠/בַד מֵ/אֲשֶׁ֨ר יֽוֹשִׁיט ל֥/וֹ הַ/מֶּ֛לֶךְ אֶת שַׁרְבִ֥יט הַ/זָּהָ֖ב וְ/חָיָ֑ה וַ/אֲנִ֗י לֹ֤א נִקְרֵ֨אתי֙ לָ/ב֣וֹא אֶל הַ/מֶּ֔לֶךְ זֶ֖ה שְׁלוֹשִׁ֥ים יֽוֹם־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/011.yaml
  text: 'All the king’s servants and the people of the king’s provinces know that for any man or woman who goes to the king in the inner court without being summoned[a], there is one law for him: to be put to death, except for the one to whom the king extends the golden scepter, so that he may live. But as for me[b], I have not been summoned to go in to the king these thirty days.'
translation:
  language: sw
  text: 'Watumishi wote wa mfalme na watu wa majimbo ya mfalme wanajua kwamba mwanamume au mwanamke yeyote anayemwendea mfalme katika ua wa ndani bila kuitwa[a], sheria ni moja: auawe. Isipokuwa yule ambaye mfalme anamnyoshea fimbo ya enzi ya dhahabu, ataishi. Lakini mimi sijaitwa kuingia kwa mfalme kwa siku hizi thelathini.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bila kuitwa rasmi.” Kitenzi cha Kiebrania kinaweza kumaanisha kuitwa mbele ya mfalme kulingana na utaratibu wa ikulu.
    reason: lexical_alternative
  - marker: b
    text: Yaani, katika kipindi cha siku thelathini zilizopita.
    reason: clarification
lexical_decisions:
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: watumishi wa mfalme
  rationale: Katika muktadha wa ikulu ya Uajemi, neno hili linawahusu kwa upana walio katika utumishi wa mfalme; “watumishi” ni la kawaida na halidokezi bila sababu kwamba wote walikuwa watumwa.
- source_word: וְעַם מְדִינוֹת הַמֶּלֶךְ
  choice: na watu wa majimbo ya mfalme
  rationale: Hupanua wigo kutoka kwa watumishi wa ikulu hadi kwa wakazi wa maeneo ya utawala; “majimbo” linafaa kwa מְדִינוֹת katika kitabu cha Esta.
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: mwanamume au mwanamke yeyote
  rationale: Huhifadhi kutajwa wazi kwa jinsia zote na maana ya kila mtu binafsi anayehusika.
- source_word: יָבוֹא אֶל הַמֶּלֶךְ אֶל הֶחָצֵר הַפְּנִימִית
  choice: anayemwendea mfalme katika ua wa ndani
  rationale: Huonyesha kumkaribia mfalme ndani ya eneo la ndani la ikulu bila kufanya Kiswahili kuwa kizito.
- source_word: אֲשֶׁר לֹא יִקָּרֵא
  choice: bila kuitwa
  rationale: Kitenzi cha kutendwa kinaonyesha mtu ambaye hajaitwa rasmi mbele ya mfalme; “bila kuitwa” ni cha asili na huhifadhi umbo la Kiebrania.
- source_word: אַחַת דָּתוֹ
  choice: sheria moja humhusu
  rationale: Huhifadhi nahau ya Kiebrania ya “sheria moja” huku ikieleza kwa Kiswahili sanifu kwamba matokeo yalikuwa yale yale kwa kila mhusika.
- source_word: לְהָמִית
  choice: auawe
  rationale: Ni adhabu ya kisheria inayotekelezwa juu ya mtu, si maelezo ya kufa tu.
- source_word: לְבַד מֵאֲשֶׁר
  choice: isipokuwa tu yule ambaye
  rationale: Huonyesha wazi kuwa kuna hali moja pekee ya kuondolewa katika hukumu hiyo.
- source_word: יוֹשִׁיט לוֹ
  choice: anamnyoshea
  rationale: Huwasilisha kitendo cha mfalme kunyoosha fimbo kuelekea kwa mtu kama ishara ya kibali.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: fimbo ya enzi ya dhahabu
  rationale: “Fimbo ya enzi” hutambulisha kwa usahihi alama ya mamlaka ya kifalme, na “ya dhahabu” huhifadhi nyenzo iliyotajwa.
- source_word: וְחָיָה
  choice: huyo ataishi
  rationale: 'Huhifadhi matokeo yaliyoelezwa moja kwa moja katika Kiebrania: mtu huyo hatatekelezewa hukumu ya kifo.'
- source_word: זֶה שְׁלוֹשִׁים יוֹם
  choice: kwa siku hizi thelathini
  rationale: Huhifadhi msisitizo wa kipindi cha siku thelathini kilichofika hadi wakati Esta aliposema.
