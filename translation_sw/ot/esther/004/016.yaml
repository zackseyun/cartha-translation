source:
  edition: WLC
  text: לֵךְ֩ כְּנ֨וֹס אֶת כָּל הַ/יְּהוּדִ֜ים הַֽ/נִּמְצְאִ֣ים בְּ/שׁוּשָׁ֗ן וְ/צ֣וּמוּ עָ֠לַ/י וְ/אַל תֹּאכְל֨וּ וְ/אַל תִּשְׁתּ֜וּ שְׁלֹ֤שֶׁת יָמִים֙ לַ֣יְלָה וָ/י֔וֹם גַּם אֲנִ֥י וְ/נַעֲרֹתַ֖/י אָצ֣וּם כֵּ֑ן וּ/בְ/כֵ֞ן אָב֤וֹא אֶל הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר לֹֽא כַ/דָּ֔ת וְ/כַ/אֲשֶׁ֥ר אָבַ֖דְתִּי אָבָֽדְתִּי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/016.yaml
  text: Go[a], gather all the Jews who are found in Susa, and fast for me. Do not eat or drink for three days[b], night and day. I and my young women also will fast in the same way. Then I will go to the king, though it is not according to the law; and if I perish[e][d][c], I perish.
translation:
  language: sw
  text: “Nenda ukawakusanye Wayahudi wote waliopo[a] Susa, mkafunge kwa ajili yangu[b]. Msile wala msinywe kwa siku tatu, usiku na mchana. Mimi pia na wajakazi wangu[c] tutafunga vivyo hivyo. Kisha nitakwenda kwa mfalme, ingawa ni kinyume cha sheria[d]. Nami nikiangamia, na niangamie[e].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanaopatikana Susa.” Neno la Kiebrania lina maana ya “waliopo” au “wanaopatikana.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa niaba yangu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “wasichana wangu” au “wahudumu wangu wa kike.”
    reason: lexical_alternative
  - marker: d
    text: 'Tafsiri nyingine: “ingawa si kwa mujibu wa sheria.”'
    reason: lexical_alternative
  - marker: e
    text: Au, “na nitakapoangamia, nitaangamia.” Maneno ya Kiebrania ni mafupi na yenye mkazo, yakionyesha kuwa Esta ameikubali hatari hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ כְּנוֹס
  choice: Nenda ukawakusanye
  rationale: Amri mbili zinaunganishwa kwa muundo wa kawaida wa Kiswahili unaohifadhi nguvu ya agizo kwa Mordekai.
- source_word: כָּל הַיְּהוּדִים הַנִּמְצְאִים בְּשׁוּשָׁן
  choice: Wayahudi wote waliopo Susa
  rationale: ‘Waliopo’ ni Kiswahili cha asili kinachowasilisha maana ya kitenzi-partisipio ‘wanaopatikana/waliopo’ bila mtindo mgumu.
- source_word: וְצוּמוּ עָלַי
  choice: mkafunge kwa ajili yangu
  rationale: Kirai hiki kinaonyesha kufunga kunakohusiana na hali na ombi la Esta; ‘kwa ajili yangu’ ni wazi bila kuongeza kusudi lisilotajwa.
- source_word: וְאַל תֹּאכְלוּ וְאַל תִּשְׁתּוּ
  choice: Msile wala msinywe
  rationale: ‘Wala’ huhifadhi makatazo yote mawili kwa Kiswahili fasaha na chenye mkazo.
- source_word: שְׁלֹשֶׁת יָמִים לַיְלָה וָיוֹם
  choice: kwa siku tatu, usiku na mchana
  rationale: Huhifadhi mpangilio wa Kiebrania na wazo la mfungo unaoendelea wakati wa usiku na mchana.
- source_word: גַּם אֲנִי וְנַעֲרֹתַי
  choice: Mimi pia na wajakazi wangu
  rationale: Katika mazingira ya ikulu, נַעֲרוֹתַי inawahusu wanawake wanaomhudumia Esta; ‘wajakazi’ ni neno linaloeleweka na haliongezi cheo rasmi.
- source_word: אָצוּם כֵּן
  choice: tutafunga vivyo hivyo
  rationale: Ingawa kitenzi cha Kiebrania ni umoja kwa mhusika wa kwanza, Kiswahili hutumia wingi kwa mhusika ambatani ‘mimi na wajakazi wangu’; ‘vivyo hivyo’ hurejelea namna iliyotajwa.
- source_word: וּבְכֵן אָבוֹא אֶל הַמֶּלֶךְ
  choice: Kisha nitakwenda kwa mfalme
  rationale: ‘Kisha’ huonyesha hatua inayofuata baada ya mfungo, na ‘nitakwenda kwa mfalme’ ni usemi wa kawaida wa kumkaribia.
- source_word: אֲשֶׁר לֹא כַדָּת
  choice: ingawa ni kinyume cha sheria
  rationale: Muktadha huipa sentensi nguvu ya kukubali hatari; ‘kinyume cha sheria’ ni wazi na huhifadhi ukiukaji unaotajwa.
- source_word: וְכַאֲשֶׁר אָבַדְתִּי אָבָדְתִּי
  choice: Nami nikiangamia, na niangamie
  rationale: Huhifadhi urudiaji, ufupi, na azimio la Esta huku ikiacha wazi iwapo maana ni uwezekano au kukubali matokeo.
theological_decisions:
- issue: Mfungo bila kutajwa kwa sala au Mungu
  choice: Kutaja kufunga pekee
  alternative: Kuongeza ‘mkaniombee’ au kumtaja Mungu
  rationale: Chanzo kinataja mfungo kwa ajili ya Esta lakini hakitaji sala wala Mungu katika mstari huu; tafsiri haiongezi maelezo ya kitheolojia.
- issue: Maana ya kauli ya mwisho kuhusu kuangamia
  choice: Nami nikiangamia, na niangamie
  alternative: Nami nitakapoangamia, nitaangamia
  rationale: Muundo uliochaguliwa huhifadhi mvutano kati ya hatari inayowezekana na kukubali kwa dhati matokeo, bila kuifanya kifo kuwa hakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi lakini unahifadhi urudiaji na mkazo wa kauli ya mwisho. ‘Susa’ limetumiwa kama umbo la kawaida la jina la mahali; ‘mfalme’ limeachwa kwa herufi ndogo kwa kuwa ni cheo.
