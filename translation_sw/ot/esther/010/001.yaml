translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo “akatoza ushuru” ni wa asili, huku tanbihi zikihifadhi upana wa maana wa maneno ya Kiebrania.
