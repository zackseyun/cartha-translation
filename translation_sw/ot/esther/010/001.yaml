  text: King Ahasuerus imposed tribute on the land and the islands of the sea[a][b].
translation:
  language: sw
  text: Mfalme Ahasuero akaweka ushuru juu ya nchi na visiwa vya bahari[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maeneo ya pwani” badala ya “visiwa vya bahari.” Neno la Kiebrania linaweza kumaanisha visiwa au maeneo ya pwani.
    reason: lexical_alternative
  - marker: b
    text: Au “kodi” au “tozo.” Katika miktadha mingine, neno la Kiebrania linaweza pia kumaanisha kazi ya kulazimishwa kwa ajili ya serikali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: akatoza
  rationale: Katika muundo שׂוּם מַס עַל, kitenzi kinaonyesha kitendo cha kuweka au kutoza ushuru. “Akatoza” ni Kiswahili cha kawaida na huwasilisha tendo hilo la kiutawala.
- source_word: הַמֶּלֶךְ
  choice: Mfalme
  rationale: Kabla ya jina la mtu, “Mfalme Ahasuero” ni muundo wa kawaida wa Kiswahili na unawakilisha vizuri cheo hicho.
- source_word: אחשרש
  choice: Ahasuero
  rationale: Hili ndilo umbo la jina hili lililozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: מַס
  choice: ushuru
  rationale: Neno מַס linaweza kumaanisha ushuru, kodi, tozo, au katika miktadha mingine kazi ya kulazimishwa. Hapa, kwa kuwa unawekwa juu ya eneo pana la himaya, “ushuru” linafaa na linadumisha maana ya kifedha na kisiasa.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha huu neno linarejelea eneo lililo chini ya utawala, si dunia yote. “Nchi” ni la asili na halibainishi zaidi ya Kiebrania.
- source_word: וְאִיֵּי הַיָּם
  choice: na visiwa vya bahari
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania na upana wa kijiografia; neno אִיֵּי linaweza pia kurejelea maeneo ya pwani, jambo linalowekwa katika tanbihi.
