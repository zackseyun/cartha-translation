base_translation:
  language: en
  yaml_path: translation/ot/esther/010/002.yaml
  text: And all the acts of his power and might[a], and the full account of the greatness of Mordecai, to which the king raised him—are they not written in the Book of the Chronicles of the Kings of Media and Persia?
translation:
  language: sw
  text: Na matendo yote ya nguvu na uweza wa mfalme, na maelezo kamili ya ukuu wa Mordekai, jinsi mfalme alivyomkuza—je, hayakuandikwa katika Kitabu cha Mambo ya Nyakati za Wafalme wa Umedi na Uajemi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kitabu cha Kumbukumbu za Matukio ya Wafalme wa Umedi na Uajemi.”
    reason: Msemo סֵפֶר דִּבְרֵי הַיָּמִים unaweza kutafsiriwa kuwa kitabu rasmi cha kumbukumbu au annali za wafalme.
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: matendo
  rationale: Neno hili pana linamaanisha mambo yaliyofanywa; “matendo” linafaa kwa muhtasari wa kihistoria wa kifalme.
- source_word: תָקְפּוֹ
  choice: nguvu ya mfalme
  rationale: Katika muktadha huu neno linaelekeza kwenye nguvu au uwezo halisi wa kifalme. Kutaja “mfalme” badala ya kiwakilishi kunazuia utata usio wa lazima katika Kiswahili.
- source_word: גְבוּרָתוֹ
  choice: uweza wa mfalme
  rationale: Likiwa sambamba na תָקְפּוֹ, neno hili linaongeza wazo la uwezo mkuu; “uweza” linadumisha mtindo wa juu bila kulifanya kuwa nguvu za mwili pekee.
- source_word: וּפָרָשַׁת
  choice: maelezo kamili
  rationale: Neno linamaanisha taarifa au maelezo yaliyotolewa kwa ukamilifu.
- source_word: גְּדֻלַּת מָרְדֳּכַי
  choice: ukuu wa Mordekai
  rationale: Tafsiri hii inadumisha maana ya hadhi kubwa au kuinuliwa kwa Mordekai na pia sauti rasmi ya kifungu.
- source_word: אֲשֶׁר גִּדְּלוֹ הַמֶּלֶךְ
  choice: jinsi mfalme alivyomkuza
  rationale: Kitenzi cha Kiebrania hapa humaanisha kumfanya mtu awe mkuu au kumpandisha cheo. Muundo huu ni wa kawaida katika Kiswahili na unaunganisha wazi ukuu wa Mordekai na tendo la mfalme.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: je, hayakuandikwa
  rationale: Hii inadumisha swali la balagha linalotumiwa kama kaida katika hitimisho la taarifa za kihistoria za Biblia.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: Kitabu cha Mambo ya Nyakati
  rationale: Ni usemi rasmi wa kumbukumbu za utawala; tafsiri hii inafuata kwa karibu muundo wa Kiebrania huku mbadala wa “kumbukumbu za matukio” ukihifadhiwa katika tanbihi.
- source_word: לְמַלְכֵי מָדַי וּפָרָס
  choice: za Wafalme wa Umedi na Uajemi
  rationale: Katika jina hili la hati, “za” linaonyesha kumbukumbu zinazowahusu au zilizo chini ya wafalme wa Umedi na Uajemi.
