base_translation:
  language: en
  yaml_path: translation/ot/esther/010/003.yaml
  text: For Mordecai the Jew was second to King Ahasuerus[a], great among the Jews, and favored by the multitude of his brothers[c][b], seeking good for his people and speaking peace to all his offspring.
translation:
  language: sw
  text: Kwa maana Mordekai Myahudi alikuwa wa pili baada ya Mfalme Ahasuero, mtu mashuhuri miongoni mwa Wayahudi, na alikubalika na wengi wa ndugu zake[a][b], akiwatafutia watu wake mema na kuzungumza amani kwa uzao wake wote.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na umati wa ndugu zake.” Neno la Kiebrania linaweza kumaanisha umati au walio wengi katika kundi.
    reason: lexical_alternative
  - marker: b
    text: Hapa “ndugu zake” inaelekea kumaanisha Wayahudi wenzake au jamaa zake, si ndugu zake wa kiume tu.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa wazao wake wote.” Neno la Kiebrania “uzao” ni jina la kijumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha kuwa mstari huu unatoa msingi au ufafanuzi wa hitimisho lililotangulia.
- source_word: מָרְדֳּכַי הַיְּהוּדִי
  choice: Mordekai Myahudi
  rationale: Huhifadhi jina na utambulisho wa kikabila na kidini wa Mordekai katika mazingira ya Uajemi.
- source_word: מִשְׁנֶה לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: wa pili baada ya Mfalme Ahasuero
  rationale: Hueleza kwa Kiswahili cha kawaida kwamba cheo chake kilikuwa cha pili kwa kile cha mfalme bila kuingiza jina maalumu la wadhifa ambalo halipo katika Kiebrania.
- source_word: וְגָדוֹל לַיְּהוּדִים
  choice: mtu mashuhuri miongoni mwa Wayahudi
  rationale: Neno 'mashuhuri' linawasilisha ukuu au hadhi yake ya kijamii miongoni mwa Wayahudi kwa njia ya asili katika Kiswahili.
- source_word: וְרָצוּי
  choice: aliyekubalika
  rationale: Huwasilisha hali ya kupokelewa kwa kibali au kukubaliwa na jamii bila kuongeza wazo la wadhifa.
- source_word: לְרֹב אֶחָיו
  choice: kwa ndugu zake walio wengi
  rationale: Huhifadhi maana ya kiasi iliyo katika רֹב huku tanbihi ikionyesha kwamba inaweza kumaanisha walio wengi kwa idadi au umati wao.
- source_word: אֶחָיו
  choice: ndugu zake
  rationale: Huhifadhi taswira ya kifamilia ya Kiebrania; katika muktadha huu neno hilo linawahusu Wayahudi wenzake au jamaa zake kwa maana pana.
- source_word: דֹּרֵשׁ טוֹב לְעַמּוֹ
  choice: Alitafuta mema kwa ajili ya watu wake
  rationale: Huwasilisha juhudi endelevu za kutafuta manufaa ya watu wake kwa Kiswahili wazi na cha heshima.
- source_word: וְדֹבֵר שָׁלוֹם
  choice: na kunena amani
  rationale: Huhifadhi nahau na upana wa neno שָׁלוֹם, linaloweza kujumuisha amani, ustawi na hali njema.
- source_word: לְכָל זַרְעוֹ
  choice: kwa uzao wake wote
  rationale: Neno 'uzao' linahifadhi umoja wa kijumla wa זֶרַע na halilazimishi maana finyu kuliko ilivyo katika chanzo.
