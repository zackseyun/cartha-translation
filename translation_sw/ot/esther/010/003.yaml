translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unabaki karibu na Kiebrania lakini umetenganishwa katika sentensi mbili ili usomeke kwa urahisi. Nahau “kunena amani” imehifadhiwa kwa sababu inaeleweka na pia inalinda upana wa maana ya shalom.
