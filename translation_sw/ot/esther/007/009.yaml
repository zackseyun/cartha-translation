  terminology: “Matowashi,” “mti,” “dhiraa,” na “Mtundikeni” ni chaguo zinazofaa. “Mti” huhifadhi upana wa עֵץ, huku tanbihi ikifafanua kuwa muktadha ni muundo wa mbao wa kuuawa. Uwezekano wa “kupigilia” unafaa zaidi kuliko “kuchomeka,” ambalo linaweza kueleweka kwa namna nyingine katika Kiswahili cha sasa.
