base_translation:
  language: en
  yaml_path: translation/ot/esther/007/009.yaml
  text: Then Harbonah[a], one of the eunuchs before the king, said, “Also, behold, the gallows that Haman made for Mordecai, who spoke good for the king, is standing at Haman’s house, fifty cubits high.” And the king said[c][b], “Hang him on it.”
translation:
  language: sw
  text: Ndipo Harbona, mmoja wa matowashi waliokuwa mbele ya mfalme, akasema, “Tena, tazama—ule mti[a] ambao Hamani alimtengenezea Mordekai, aliyesema jambo jema kwa ajili ya mfalme[b], umesimama nyumbani kwa Hamani, ukiwa na kimo cha dhiraa hamsini.” Mfalme akasema, “Mtundikeni juu yake.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mti” au “mbao.” Hapa neno hilo linamaanisha kifaa cha mbao cha kuulia, ambacho huenda kilikuwa nguzo ya kutundikia au ya kupigilia mtu.'
    reason: lexical_alternative
  - marker: b
    text: Au, “aliyemsemea mfalme mema,” au “aliyesema jambo lililomnufaisha mfalme.”
    reason: lexical_alternative
  - marker: c
    text: Au huenda, “Mmpigilieni juu yake.” Maneno ya Kiebrania yanaweza kumaanisha kwa upana zaidi kumtundika au kumpigilia mtu kwenye kifaa cha mbao, si lazima kitanzi cha kunyongea cha nyakati za baadaye.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַרְבוֹנָה
  choice: Harbona
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: הַסָּרִיסִים
  choice: matowashi
  rationale: Katika mazingira ya ikulu ya Uajemi, neno hili kwa kawaida humaanisha matowashi wanaohudumu katika ikulu, ingawa wakati mwingine linaweza kumaanisha maofisa wa ikulu kwa upana zaidi.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: waliokuwa mbele ya mfalme
  rationale: Inahifadhi nahau ya Kiebrania ya kuhudumu au kuwepo katika uwepo wa mfalme bila kuifanya kuwa maelezo marefu.
- source_word: גַּם הִנֵּה
  choice: Tena, tazama!
  rationale: “Tena” linaonyesha nyongeza, na “tazama” linavuta fikira kwa nguvu kama ilivyo katika chanzo.
- source_word: הָעֵץ
  choice: mti
  rationale: Hili ndilo maana ya moja kwa moja ya neno la Kiebrania, ambalo linaweza pia kumaanisha mbao au kifaa cha mbao. Muktadha unaonyesha kuwa ni kifaa cha kuulia, lakini “mti” huhifadhi upana wa neno la chanzo.
- source_word: דִּבֶּר טוֹב עַל הַמֶּלֶךְ
  choice: aliyesema jambo jema kwa ajili ya mfalme
  rationale: 'Huhifadhi kwa kiasi kikubwa muundo na mvutano wa nahau ya Kiebrania: Mordekai alisema jambo lililokuwa jema au lenye manufaa kwa mfalme.'
- source_word: עֹמֵד בְּבֵית הָמָן
  choice: umesimama nyumbani kwa Hamani
  rationale: Huhifadhi hali ya sasa inayoonyeshwa na umbo la kitenzi huku ikitoa mahali kwa Kiswahili cha kawaida.
- source_word: גָּבֹהַּ חֲמִשִּׁים אַמָּה
  choice: ukiwa na kimo cha dhiraa hamsini
  rationale: Kitengo cha kale kimehifadhiwa badala ya kubadilishwa kwa kipimo cha kisasa chenye makadirio.
- source_word: תְּלֻהוּ עָלָיו
  choice: Mtundikeni juu yake
  rationale: Ni tafsiri ya karibu na ya kawaida ya amri hiyo, huku tanbihi ikihifadhi uwezekano wa kuchomwa au kuwekwa juu ya nguzo ya mbao.
