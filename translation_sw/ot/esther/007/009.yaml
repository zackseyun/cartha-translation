  verdict: revise
  source_fidelity: 'Rasimu inafuata Kiebrania kwa uaminifu: Harbona ni mmoja wa matowashi, mti/kifaa hicho kilitengenezwa kwa ajili ya Mordekai, kimesimama kwenye makazi ya Hamani, kina dhiraa hamsini, na mfalme aamuru auawe juu yake. Hata hivyo, alama ya mshangao baada ya “Tazama” inabadilisha mkazo wa simulizi kuwa wa ghafla kupita kiasi; kistari kirefu kinawakilisha vyema kiunganishi cha msisitizo גַּם הִנֵּה. Tanbihi ya (c) pia inahitaji lugha sahihi zaidi kwa uwezekano wa kupigiliwa kwenye muundo wa mbao.'
