  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kifalme lakini kinachoeleweka kwa msomaji wa kawaida. Majina yametoholewa kama Harbona, Hamani, na Mordekai. Vipimo vya kale vimehifadhiwa, na utata wa namna ya hukumu ya kifo umeelezwa katika tanbihi.
