base_translation:
  language: en
  yaml_path: translation/ot/esther/007/004.yaml
  text: For we have been sold[a], I and my people, to be destroyed, to be killed, and to perish. But if we had been sold as male servants and female servants, I would have kept silent, for the adversary is not worth the damage to the king.
translation:
  language: sw
  text: Kwa maana tumeuzwa, mimi na watu wangu, ili tuangamizwe, tuuawe na tufutiliwe mbali. Lakini kama tungeuzwa kuwa watumwa wa kiume na wa kike, ningekaa kimya, kwa maana adui huyo si wa thamani inayolingana na hasara ya mfalme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hasara kwa mfalme.” Neno la Kiebrania linaweza kumaanisha hasara, madhara, au uharibifu kwa mfalme.
    reason: Hufafanua upeo wa neno נזק na huacha wazi aina ya hasara inayokusudiwa, bila kusuluhisha kishazi kigumu cha Kiebrania kwa tafsiri ya kiutendaji.
lexical_decisions:
- source_word: נִמְכַּרְנוּ
  choice: tumeuzwa
  rationale: Huhifadhi sitiari ya biashara iliyo katika kauli ya Kiebrania na huandaa tofauti inayofuata kuhusu kuuzwa utumwani.
- source_word: עַמִּי
  choice: watu wangu
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kujitambulisha kwa Esta na jamii yake ya kikabila.
- source_word: לְהַשְׁמִיד לַהֲרֹג וּלְאַבֵּד
  choice: ili tuangamizwe, tuuawe na tufutiliwe mbali
  rationale: Huhifadhi mlolongo wa vitenzi vitatu vya Kiebrania na nguvu yake ya balagha, huku kauli tendwa ikionyesha wazi kwamba Esta na watu wake ndio walengwa.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: kuwa watumwa wa kiume na wa kike
  rationale: Hutaja wazi jinsia zote mbili na kudumisha maana ya utumwa badala ya kuipunguza kuwa utumishi wa kawaida.
- source_word: הֶחֱרַשְׁתִּי
  choice: ningekaa kimya
  rationale: Huonyesha kwa Kiswahili cha kawaida matokeo ya hali ya kudhaniwa isiyotokea.
- source_word: הַצָּר
  choice: adui huyo
  rationale: Nomino hiyo inaweza kumaanisha adui au mtu anayeleta dhiki; katika muktadha wa simulizi inamrejelea Hamani bila kumtaja moja kwa moja.
- source_word: שֹׁוֶה בְּנֵזֶק הַמֶּלֶךְ
  choice: hana thamani inayolingana na hasara ya mfalme
  rationale: Hufuata wazo la usawa au thamani lililo katika שׁוה na kuacha wazi kama נזק ni hasara ya fedha, madhara ya kisiasa, au uharibifu mwingine kwa mfalme.
theological_decisions:
- issue: Maana ya kishazi kigumu cha mwisho
  choice: adui huyo hana thamani inayolingana na hasara ya mfalme
  alternative: dhiki hiyo isingestahili kumsumbua mfalme
  rationale: Kiebrania cha MT kinaweza kueleweka kwa njia zaidi ya moja. Rasimu inahifadhi maneno yaliyo dhahiri zaidi kuhusu adui na hasara, huku tanbihi ikitaja tafsiri ya kiutendaji bila kuamua kimya kimya kati yake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mlolongo wa vitenzi vitatu umehifadhiwa kwa nguvu ya balagha, na neno “watumwa” limetumiwa wazi kwa sababu muktadha unahusu kuuzwa katika hali ya utumwa.
