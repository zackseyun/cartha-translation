  yaml_path: translation/ot/esther/007/006.yaml
  text: And Esther said, “A hostile and enemy man—this evil Haman!” Then Haman was terrified before the king and the queen.
translation:
  language: sw
  text: Esta akasema, “Mtu ambaye ni mpinzani na adui ni Hamani huyu mwovu!” Ndipo Hamani akaingiwa na hofu kuu mbele ya mfalme na malkia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ צַר וְאוֹיֵב
  choice: mtu huyo aliye mtesi na adui
  rationale: 'Neno אִישׁ limewakilishwa kwa ‘mtu’, huku צַר וְאוֹיֵב yakihifadhiwa kama maelezo mawili yanayokaribiana lakini yasiyofanana kabisa: mwenye kutesa/kupinga na adui.'
- source_word: הָמָן הָרָע הַזֶּה
  choice: huyu Hamani mwovu
  rationale: Mpangilio huu ni wa asili katika Kiswahili na unadumisha nguvu ya kiashiria הַזֶּה pamoja na hukumu ya kimaadili הָרָע.
- source_word: נִבְעַת
  choice: akaingiwa na hofu kuu
  rationale: Kitenzi hiki kinaonyesha kushtushwa na kutishwa sana, si hofu ya kawaida tu; ‘hofu kuu’ huwasilisha uzito huo kwa Kiswahili cha sasa.
- source_word: מִלִּפְנֵי הַמֶּלֶךְ וְהַמַּלְכָּה
  choice: mbele ya mfalme na malkia
  rationale: Tafsiri ya moja kwa moja inayohifadhi mazingira ya Hamani kukabiliwa na watawala hao wawili.
