- from: Mfalme aliporudi kutoka bustani ya ikulu na kuingia katika ukumbi wa karamu ya divai, Hamani alikuwa amejiangusha juu ya kiti cha kulalia ambacho Esta alikuwa ameketi. Mfalme akasema, “Je, anataka hata kumshambulia malkia nikiwa humu ndani?” Mara tu maneno hayo yalipotoka kinywani mwa mfalme, wakamfunika Hamani uso.
  to: Mfalme aliporudi kutoka bustani ya ikulu na kuingia katika ukumbi wa karamu ya divai, Hamani alikuwa akijitupa juu ya kitanda ambacho Esta alikuwa amelalia. Mfalme akasema, “Je, hata atamshambulia malkia nami nikiwa ndani ya nyumba?” Mara tu maneno hayo yalipotoka kinywani mwa mfalme, wakaufunika uso wa Hamani.
  rationale: Marekebisho yanarejesha mkao wa Esta kama ulivyoelezwa na chanzo, yanahifadhi hali endelevu ya Hamani, na yanafanya shutumu la mfalme liwe swali la kitendo badala ya taarifa kuhusu nia. Neno ‘kumshambulia’ linaendelea kuhifadhi utata wa לכבוש bila kudai shtaka mahususi la kingono.
