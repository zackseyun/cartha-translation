base_translation:
  language: en
  yaml_path: translation/ot/esther/007/008.yaml
  text: The king returned from the palace garden to the house of the wine feast, and Haman was falling on the couch where Esther was. Then the king said, “Will he even assault the queen while I am in the house?” As the word went out from the king’s mouth, they covered Haman’s face.
translation:
  language: sw
  text: Mfalme aliporudi kutoka bustani ya ikulu na kuingia katika ukumbi wa karamu ya divai, Hamani alikuwa akijitupa juu ya kitanda ambacho Esta alikuwa amelalia. Mfalme akasema, “Je, hata atamshambulia malkia nami nikiwa ndani ya nyumba?” Mara tu maneno hayo yalipotoka kinywani mwa mfalme, wakaufunika uso wa Hamani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית מִשְׁתֵּה הַיַּיִן
  choice: ukumbi wa karamu ya divai
  rationale: Kirai hiki kwa kawaida kinamaanisha sehemu au ukumbi ambako karamu ya divai ilifanyika; tafsiri hii ni ya asili kwa Kiswahili kuliko ‘nyumba ya karamu ya divai’.
- source_word: נֹפֵל עַל־הַמִּטָּה
  choice: alikuwa amejiangusha juu ya kiti cha kulalia
  rationale: Kitenzi ni umbo la participle linaloonyesha Hamani akiwa katika hali ya kuanguka au kujitupa mbele ya Esta ili kusihi; ‘amejiangusha’ huepuka kudokeza kwa lazima kwamba alianguka kwa bahati. הַמִּטָּה hapa ni kochi au kiti cha kulalia cha karamu.
- source_word: לִכְבּוֹשׁ
  choice: kumshambulia
  rationale: Katika muktadha huu neno lina maana ya kumtawala kwa nguvu au kumtendea ukatili, likiwa na dokezo la shambulio la kingono; ‘kumshambulia’ huhifadhi upana na ukali bila kulifanya dai liwe mahususi kuliko Kiebrania.
- source_word: הַדָּבָר יָצָא מִפִּי הַמֶּלֶךְ
  choice: Mara tu maneno hayo yalipotoka kinywani mwa mfalme
  rationale: Nahau inaonyesha kauli ya mfalme ilipotamkwa na hatua ikafuata mara moja; ‘maneno hayo’ ni ya kawaida katika Kiswahili na huhifadhi taswira ya kutoka kinywani.
- source_word: וּפְנֵי הָמָן חָפוּ
  choice: wakamfunika Hamani uso
  rationale: Ingawa kitenzi hakimtaji mtendaji wazi, muktadha unaelekea kwa watumishi waliokuwepo; ujenzi wa Kiswahili wenye ‘waka-’ huonyesha mtendaji asiyeainishwa.
theological_decisions:
- issue: Kiwango cha dai la mfalme katika לִכְבּוֹשׁ
  choice: kumshambulia malkia
  alternative: kumbaka/kumnajisi malkia
  rationale: Chanzo kinaweza kuwa na dokezo la kingono, lakini maana yake ya msingi ni kumshinda au kumtawala kwa nguvu. ‘Kumshambulia’ huhifadhi mvutano huo bila kuamua kwamba mfalme alitamka shtaka mahususi la ubakaji.
- issue: Hali ya Hamani juu ya kiti cha kulalia
  choice: alikuwa amejiangusha
  alternative: alikuwa akianguka
  rationale: Muktadha wa aya iliyotangulia unaonyesha alikuwa akimsihi Esta aokoe maisha yake. Tafsiri iliyochaguliwa inaeleza mkao wa kusihi bila kuugeuza kuwa tendo la kingono, huku mshangao au tafsiri ya mfalme ikibaki katika usemi wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ikulu,’ ‘ukumbi wa karamu,’ na ‘kiti cha kulalia’ vinaweka wazi mazingira ya kifalme na desturi ya kula kwa kuegemea bila kutumia lugha ngumu au ya kidhehebu.
