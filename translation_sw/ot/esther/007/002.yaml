  to: Siku ya pili pia, wakati wa karamu ya divai, mfalme akamwambia Esta, “Ombi lako ni nini, Malkia Esta? Litapewa. Na ombi lako ni nini? Hata kufikia nusu ya ufalme[a], litatimizwa.”
  rationale: The revision preserves the source’s courtly parallelism and its conventional royal offer while correcting the unclear pronoun/subject reference in “Utapewa.” It also replaces “haja” with the more semantically direct modern term “ombi,” without imposing an exaggerated distinction between the closely related Hebrew terms.
