base_translation:
  language: en
  yaml_path: translation/ot/esther/007/002.yaml
  text: And the king said to Esther on the second day also[a], at the banquet of wine, “What is your petition, Queen Esther? It will be granted to you. And what is your request? Even to half the kingdom[b], it shall be done.”
translation:
  language: sw
  text: Siku ya pili pia, wakati wa karamu ya divai, mfalme akamwambia Esta, “Ombi lako ni nini, Malkia Esta? Litapewa. Na ombi lako ni nini? Hata kufikia nusu ya ufalme[a], litatimizwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kauli “hata kufikia nusu ya ufalme” ni njia ya kifalme ya kuonyesha upendeleo mkubwa na utayari wa kutoa kwa ukarimu; si lazima iwe ahadi halisi ya kugawa ufalme.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם בַּיּוֹם הַשֵּׁנִי
  choice: Siku ya pili pia
  rationale: “Pia” linaonyesha mwendelezo wa tukio la siku iliyotangulia, huku “siku ya pili” likihifadhi moja kwa moja usemi wa Kiebrania.
- source_word: בְּמִשְׁתֵּה הַיַּיִן
  choice: wakati wa karamu ya divai
  rationale: Huhifadhi kutajwa wazi kwa divai na kutoa kwa Kiswahili cha kawaida mazingira ya karamu ambako mfalme alisema maneno haya.
- source_word: מַה שְּׁאֵלָתֵךְ
  choice: Ombi lako ni nini?
  rationale: “Ombi” linafaa kwa jambo linalowasilishwa rasmi mbele ya mfalme na kudumisha hadhi ya mazungumzo ya kifalme.
- source_word: וְתִנָּתֵן לָךְ
  choice: Utapewa
  rationale: Huu ni uwasilishaji mfupi na wa kawaida wa maana halisi, “litapewa kwako,” bila kuongeza kitu ambacho hakikutajwa.
- source_word: בַּקָּשָׁתֵךְ
  choice: haja yako
  rationale: “Haja” inadumisha tofauti ndogo ya msamiati kati ya שְׁאֵלָה na בַּקָּשָׁה bila kudai kuwa maana zake zinatofautiana sana.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: Hata kufikia nusu ya ufalme
  rationale: Huhifadhi kikomo kinachoonyeshwa na עַד na neno “ufalme” bila kuongeza kimilikishi “wangu,” ambacho hakipo wazi katika Kiebrania.
- source_word: וְתֵעָשׂ
  choice: itatimizwa
  rationale: Kwa Kiswahili, “itatimizwa” huonyesha kwa kawaida kuwa haja hiyo itafanyiwa kazi na kutekelezwa; ni sawa kimuktadha na “itafanywa.”
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: Malkia Esta
  rationale: Mpangilio huu wa cheo kabla ya jina ni wa kawaida na wenye heshima katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya mazungumzo ya kifalme lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa Kiebrania umehifadhiwa inapowezekana, huku sentensi zikisawazishwa ili zisikike za kawaida kwa Kiswahili.
