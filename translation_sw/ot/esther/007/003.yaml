base_translation:
  language: en
  yaml_path: translation/ot/esther/007/003.yaml
  text: Then Queen Esther answered and said[a], “If I have found favor in your eyes, O king, and if it pleases the king, let my life be given me at my petition, and my people at my request.”
translation:
  language: sw
  text: Ndipo Malkia Esta akajibu na kusema[a], “Ikiwa nimepata kibali machoni pako, Ee mfalme, na ikiwa inampendeza mfalme, nipewe uhai wangu kwa ombi langu, na watu wangu kwa maombi yangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa lugha ya kawaida zaidi, “naomba unipe uhai wangu kwa ombi langu, na watu wangu kwa maombi yangu.” Kiebrania kinasema kihalisi zaidi, “uhai wangu upewe kwangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן ... וַתֹּאמַר
  choice: akajibu na kusema
  rationale: Inahifadhi mtindo wa simulizi wa Kiebrania wenye vitenzi viwili, huku ikisikika kwa kawaida katika Kiswahili sanifu.
- source_word: הַמַּלְכָּה
  choice: Malkia
  rationale: Imetumiwa kama cheo kinachoambatana na jina Esta; mpangilio “Malkia Esta” ni wa kawaida na wenye heshima katika Kiswahili.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: Ikiwa nimepata kibali machoni pako
  rationale: Inahifadhi taswira ya nahau ya Kiebrania na maana yake ya kupata upendeleo katika mazingira ya kifalme.
- source_word: הַמֶּלֶךְ
  choice: Ee mfalme
  rationale: Ni mwito wa moja kwa moja wenye heshima unaofaa lugha rasmi ya mbele ya mfalme.
- source_word: וְאִם עַל הַמֶּלֶךְ טוֹב
  choice: na ikiwa inampendeza mfalme
  rationale: Hutoa maana ya nahau ya kifalme, yaani jambo kukubaliwa au kupendeza kwa mfalme, kwa Kiswahili cha kawaida.
- source_word: תִּנָּתֶן לִי נַפְשִׁי
  choice: na nipewe uhai wangu
  rationale: “Uhai” ndiyo maana ya נֶפֶשׁ katika muktadha wa tishio la kuuawa. Muundo wa kutendwa “nipewe” unadumisha kwa kadiri inayowezekana hali ya kutendwa ya Kiebrania.
- source_word: בִּשְׁאֵלָתִי
  choice: kwa ombi langu
  rationale: “Ombi” linaonyesha maombi rasmi ya Esta, na “kwa” linaonyesha msingi au jambo analoliomba.
- source_word: וְעַמִּי בְּבַקָּשָׁתִי
  choice: na watu wangu kwa rai yangu
  rationale: “Watu wangu” ni tafsiri ya moja kwa moja; “rai” huhifadhi kwa kiasi tofauti ya msamiati kati ya שְׁאֵלָה na בַּקָּשָׁה bila kuongeza hisia zisizokuwapo katika chanzo.
