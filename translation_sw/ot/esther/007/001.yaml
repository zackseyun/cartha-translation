  text: So the king and Haman came to drink with Queen Esther[a].
translation:
  language: sw
  text: Basi mfalme na Hamani wakaja kunywa pamoja na Malkia Esta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata mpangilio wa maneno ya Kiebrania kwa karibu zaidi, “pamoja na Esta malkia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: wakaja
  rationale: Kitenzi cha Kiebrania kinaendeleza simulizi kwa tendo lililopita. “Wakaja” ni Kiswahili cha kawaida na hakiongezi wazo mahususi la kuingia ambalo halijaelezwa wazi.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa מֶלֶךְ; muktadha tayari umemtambulisha mfalme.
- source_word: וְהָמָן
  choice: na Hamani
  rationale: Kiunganishi kimetafsiriwa moja kwa moja, na jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: לִשְׁתּוֹת
  choice: kunywa
  rationale: Maana ya msingi ni “kunywa.” Ingawa muktadha ni karamu, chanzo hakitaji divai wala hakitumii kitenzi cha jumla cha kufanya karamu.
- source_word: עִם
  choice: pamoja na
  rationale: Kauli hii inaonyesha ushirika au kuandamana na inasikika kwa kawaida katika sentensi hii.
- source_word: אֶסְתֵּר
  choice: Esta
  rationale: Hili ndilo umbo la jina linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: הַמַּלְכָּה
  choice: Malkia Esta
  rationale: Kiebrania kinasema kihalisi “Esta malkia,” lakini Kiswahili cha kawaida huweka cheo kabla ya jina.
- source_word: וַ
  choice: Basi
  rationale: Waw ya kisimulizi inaendeleza mfuatano wa matukio; “Basi” huleta mtiririko wa kawaida wa simulizi bila kubadili maana.
