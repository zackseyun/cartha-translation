lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida, huku ukihifadhi wazo la tendo linalofuata.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Mfalme Ahasuero
  rationale: Kiswahili kwa kawaida huweka cheo kabla ya jina; jina la Kiebrania limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: Esta malkia
  rationale: Inahifadhi uambatanisho wa Kiebrania, yaani jina likifuatiwa na cheo, kwa lugha inayoeleweka.
- source_word: מִי הוּא זֶה
  choice: Ni nani huyo
  rationale: Hili ni swali lenye msisitizo kuhusu utambulisho wa mtu bila kuongeza neno ‘mwanamume,’ ambalo halipo wazi katika Kiebrania.
- source_word: וְאֵי זֶה הוּא
  choice: naye yuko wapi
  rationale: אֵי kwa kawaida huuliza mahali. Katika muktadha huu mfalme anauliza utambulisho wa mtu huyo na aliko; usomaji mwingine umewekwa katika tanbihi.
- source_word: אֲשֶׁר מְלָאוֹ לִבּוֹ
  choice: aliyethubutu
  rationale: Nahau ya Kiebrania inayohusisha moyo humaanisha kujipa ujasiri au kuthubutu kufanya jambo. Kiswahili cha moja kwa moja kama ‘moyo wake ulimjaza’ kingekuwa kigumu na kisicho cha kawaida, hivyo maana ya nahau imetolewa katika matini na taswira halisi imeelezwa katika tanbihi.
- source_word: לַעֲשׂוֹת כֵּן
  choice: kufanya hivyo
  rationale: כֵּן hurejelea kitendo kilichotajwa kabla; ‘kufanya hivyo’ ni ya asili na inahifadhi rejeo hilo.
