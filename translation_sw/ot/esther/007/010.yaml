base_translation:
  language: en
  yaml_path: translation/ot/esther/007/010.yaml
  text: So they hanged Haman on the gallows that he had prepared for Mordecai[a], and the king’s wrath subsided.
translation:
  language: sw
  text: Basi wakamtundika Hamani kwenye nguzo ya mbao ambayo alikuwa amemwandalia Mordekai[a], nayo ghadhabu ya mfalme ikatulia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamtundika Hamani kwenye mti au nguzo aliyokuwa amemwandalia Mordekai.” Neno la Kiebrania עֵץ linaweza kumaanisha “mti,” “mbao,” au “nguzo,” na kitenzi kinaweza kumaanisha kutundika au kuning’iniza mwili. Inawezekana pia kifaa hicho kilikuwa nguzo ambayo mtu alipigiliwa juu yake; njia kamili ya kuuawa kwake haijulikani kwa hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְלוּ
  choice: wakamtundika
  rationale: Kitenzi תלה humaanisha kutundika au kuning’iniza. “Wakamtundika” kinahifadhi upana huo bila kuamua kimya-kimya kama Hamani alinyongwa kwa kamba au alichomwa kwenye nguzo.
- source_word: הָמָן
  choice: Hamani
  rationale: Jina limetoholewa kwa namna inayotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: עַל הָעֵץ
  choice: kwenye nguzo ya mbao
  rationale: עֵץ inaweza kumaanisha mti, mbao, au nguzo ya mbao. Katika muktadha huu ni kifaa kilichoandaliwa kwa ajili ya kumuua Mordekai; “nguzo ya mbao” ni ya asili katika Kiswahili na haibani maana kwenye tanzi pekee.
- source_word: אֲשֶׁר הֵכִין לְמָרְדֳּכָי
  choice: ambayo alikuwa amemwandalia Mordekai
  rationale: הכין humaanisha kuandaa au kufanya tayari. Kauli hii pia inadumisha kejeli ya kisimulizi kwamba Hamani alipata adhabu aliyomwandalia Mordekai.
- source_word: וַחֲמַת הַמֶּלֶךְ
  choice: nayo ghadhabu ya mfalme
  rationale: חֵמָה ni hasira kali au ghadhabu. “Ghadhabu” inadumisha uzito wa hisia za mfalme kwa lugha ya heshima inayoeleweka.
- source_word: שָׁכָכָה
  choice: ikatulia
  rationale: שׁכך humaanisha kupungua au kutulia. “Ikatulia” ni Kiswahili cha kawaida na kinaendana vizuri na “ghadhabu” kama kiima.
theological_decisions:
- issue: Njia halisi ya kuuawa kwa Hamani
  choice: Maandishi makuu yanatumia “wakamtundika ... kwenye nguzo ya mbao,” bila kutaja moja kwa moja kunyongwa kwa kamba au kuchomwa kwenye nguzo.
  alternative: “Wakamnyonga Hamani kwenye mti wa kunyongolea” au “wakamchoma Hamani kwenye nguzo.”
  rationale: Kiebrania hakielezi kwa uhakika namna kamili ya utekelezaji wa hukumu. Tafsiri inahifadhi utata huo badala ya kuchagua desturi moja ya kihistoria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Basi” linaendeleza matokeo ya simulizi, na “nayo” linaunganisha kwa urahisi kutulia kwa ghadhabu na tukio lililotangulia. Msamiati umechaguliwa ili ueleweke kwa wasomaji wa kawaida huku ukihifadhi utata wa Kiebrania.
