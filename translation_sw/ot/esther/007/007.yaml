base_translation:
  language: en
  yaml_path: translation/ot/esther/007/007.yaml
  text: Then the king rose in his wrath from the wine banquet and went into the palace garden[a], but Haman remained to beg Queen Esther for his life[c][b], for he saw that the evil against him had been determined by the king.
translation:
  language: sw
  text: Ndipo mfalme akainuka kwa ghadhabu kutoka kwenye karamu ya divai, akaenda katika bustani ya jumba la kifalme[a]. Lakini Hamani akabaki kumsihi Malkia Esta kwa ajili ya maisha yake, kwa maana aliona kwamba maafa dhidi yake yalikuwa yameamuliwa na mfalme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bustani ya paviliy​oni ya kifalme” au “bustani ya eneo la jumba la kifalme.” Neno la Kiebrania linaweza kurejelea paviliy​oni au sehemu ya makao ya kifalme.
    reason: cultural_note
  - marker: b
    text: Kiebrania kinaweza kutafsiriwa kwa karibu zaidi, “maafa dhidi yake yalikuwa yamekamilika/yameamuliwa kutoka kwa mfalme.” Usemi huo unaonyesha kwamba hukumu ya mfalme dhidi ya Hamani sasa ilikuwa imekwisha thibitishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲמָתוֹ
  choice: kwa ghadhabu
  rationale: Neno חֵמָה linaonyesha hasira kali; “ghadhabu” huhifadhi uzito huo katika Kiswahili cha heshima na cha kawaida.
- source_word: מִמִּשְׁתֵּה הַיַּיִן
  choice: kutoka kwenye karamu ya divai
  rationale: Huhifadhi wazo la מִשְׁתֶּה kama karamu na kutaja divai waziwazi, kwa mtindo wa Kiswahili unaoeleweka.
- source_word: גִּנַּת הַבִּיתָן
  choice: bustani ya jumba la kifalme
  rationale: גִּנָּה ni bustani, huku בִּיתָן hapa ikiweza kumaanisha jumba au sehemu ya majengo ya kifalme; tafsiri hii ni wazi katika mazingira ya ikulu ya Uajemi.
- source_word: עָמַד
  choice: akabaki
  rationale: Ingawa maana ya msingi ni “akasimama,” katika muktadha huu kitenzi kinatofautisha kuondoka kwa mfalme na kubaki kwa Hamani.
- source_word: לְבַקֵּשׁ עַל נַפְשׁוֹ
  choice: ili amsihi ... aokoe maisha yake
  rationale: Nahau hiyo humaanisha kuomba au kusihi ili uhai wa mtu usiathiriwe; kauli hii ni ya asili katika Kiswahili na inaonyesha hali ya kukata tamaa.
- source_word: מֵאֶסְתֵּר הַמַּלְכָּה
  choice: Malkia Esta
  rationale: Kiswahili kwa kawaida huweka cheo kabla ya jina, bila kubadili maana ya Kiebrania.
- source_word: כִּי רָאָה
  choice: kwa maana aliona
  rationale: כִּי hapa inatoa sababu ya Hamani kusihi, na “kwa maana” hudumisha mtiririko wa kisimulizi.
- source_word: כִּי כָלְתָה
  choice: yalikuwa yameamuliwa
  rationale: Muundo wa כלה hapa unaonyesha kuwa jambo lilikuwa limefikia uamuzi wa mwisho; “yameamuliwa” huwasilisha uhakika huo wa hukumu.
- source_word: הָרָעָה
  choice: maafa
  rationale: רָעָה katika muktadha huu ni balaa au hukumu mbaya inayomkabili Hamani. “Maafa” huepuka kueleweka kana kwamba ni uovu wa kimaadili uliotendwa dhidi yake.
- source_word: מֵאֵת הַמֶּלֶךְ
  choice: na mfalme
  rationale: מֵאֵת huonyesha chanzo au mtendaji; pamoja na kitenzi cha kutendwa, “na mfalme” ni Kiswahili cha asili.
