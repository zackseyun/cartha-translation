base_translation:
  language: en
  yaml_path: translation/ot/esther/001/011.yaml
  text: to bring Queen Vashti before the king with the royal crown[a], to show the peoples and the officials her beauty[c][b], for she was beautiful in appearance.
translation:
  language: sw
  text: ili wamlete Malkia Vashti mbele ya mfalme akiwa na taji la kifalme[a], ili kuwaonyesha watu wa mataifa na maofisa uzuri wake, kwa maana alikuwa mzuri wa sura.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiwa amevaa taji la kifalme.” Kihusishi cha Kiebrania kinaweza kuonyesha kuwa taji lilikuwa pamoja naye au kwamba alikuwa amelivaa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa neno kwa neno ni “alikuwa mwema wa kuonekana,” yaani, alikuwa mzuri kwa sura.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִיא
  choice: ili wamlete
  rationale: Kitenzi cha Hiphil kinaonyesha kusababisha Vashti aje; muktadha wa amri kwa matowashi unafanya wingi wa 'wamlete' kuwa wa kawaida katika Kiswahili.
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: Malkia Vashti
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unahifadhi jina pamoja na cheo chake.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: mbele ya mfalme
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kuwapo mbele au katika uwepo wa mfalme.
- source_word: בְּכֶתֶר מַלְכוּת
  choice: akiwa na taji la kifalme
  rationale: Inahifadhi upana wa kihusishi cha Kiebrania bila kulazimisha wazi kwamba alikuwa amelivaa, ingawa hilo linawezekana katika muktadha.
- source_word: לְהַרְאוֹת
  choice: ili kuwaonyesha
  rationale: Hiphil ya ראה ina maana ya kusababisha waone; 'kuwaonyesha' ni Kiswahili cha asili katika kishazi cha kusudi.
- source_word: הָעַמִּים
  choice: watu wa mataifa mbalimbali
  rationale: Inaonyesha umbo la wingi na mazingira ya dola yenye makundi mengi ya watu kwa lugha inayoeleweka kuliko 'watu mbalimbali' peke yake.
- source_word: וְהַשָּׂרִים
  choice: na maofisa
  rationale: שׂרים hapa ni viongozi au maafisa wa ngazi ya juu; 'maofisa' huepuka dhana finyu ya wana wa kifalme.
- source_word: יָפְיָהּ
  choice: uzuri wake
  rationale: Hii ni tafsiri wazi ya nomino yenye kiambishi cha nafsi ya tatu ya kike.
- source_word: כִּי
  choice: kwa maana
  rationale: Inaendeleza nguvu ya kueleza sababu kwa mtindo wa heshima na wa kifasihi.
- source_word: טוֹבַת מַרְאֶה
  choice: mzuri wa sura
  rationale: Ni nahau ya asili ya Kiswahili inayowasilisha uzuri unaoonekana bila tafsiri ngumu ya neno kwa neno.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Tafsiri imehifadhi wingi wa הָעַמִּים kwa usemi wa kawaida 'watu wa mataifa mbalimbali' na imeacha utata wa בְּכֶתֶר מַלְכוּת katika matini kuu, huku uwezekano wa 'akiwa amevaa' ukielezwa katika tanbihi.
