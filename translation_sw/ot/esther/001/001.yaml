base_translation:
  language: en
  yaml_path: translation/ot/esther/001/001.yaml
  text: It happened in the days of Ahasuerus—the Ahasuerus who reigned from India to Cush[b][a], over one hundred twenty-seven provinces—
translation:
  language: sw
  text: Ikawa katika siku za Ahasuero—Ahasuero huyo aliyekuwa akitawala kutoka India mpaka Kushi[a] juu ya majimbo mia moja na ishirini na saba—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kushi” ni jina la kale la eneo; tafsiri nyingine husema “Ethiopia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni mwanzo wa kawaida wa simulizi la Kiebrania; “Ikawa” huhifadhi mtindo wa masimulizi kwa Kiswahili fasaha bila kuongeza neno la wakati lisilokuwamo wazi katika chanzo.
- source_word: בִּימֵי
  choice: katika siku za
  rationale: Huhifadhi nahau ya wakati ya Kiebrania na inaeleweka kwa maana ya kipindi cha utawala wa mtu huyo.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasuero
  rationale: Jina limetoholewa moja kwa moja kutoka umbo la Kiebrania badala ya kubadilishwa kuwa utambulisho wa kihistoria wenye tafsiri zaidi, yaani Xerxes.
- source_word: הוּא אֲחַשְׁוֵרוֹשׁ
  choice: Ahasuero yule
  rationale: “Yule” huwasilisha kazi ya kiwakilishi inayomtambulisha Ahasuero anayekusudiwa, huku kurudiwa kwa jina kukihifadhiwa.
- source_word: הַמֹּלֵךְ
  choice: aliyetawala
  rationale: Kitenzi cha uhusiano ni sawa la asili la Kiswahili kwa kitenzi-shirikishi kinachomtambulisha kwa utawala wake.
- source_word: מֵהֹדּוּ וְעַד כּוּשׁ
  choice: kutoka India mpaka Kushi
  rationale: Hodu inaeleweka kwa kawaida kuwa India; Kushi huhifadhi jina la kale la eneo bila kulichanganya moja kwa moja na taifa la kisasa la Ethiopia.
- source_word: שֶׁבַע וְעֶשְׂרִים וּמֵאָה
  choice: mia moja ishirini na saba
  rationale: Mpangilio umewekwa katika namna ya kawaida ya kutaja namba kwa Kiswahili.
- source_word: מְדִינָה
  choice: majimbo
  rationale: Katika muktadha wa Milki ya Uajemi, “majimbo” ni neno wazi na la kawaida kwa maeneo ya kiutawala.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa msomaji wa kawaida. Jina Ahasuero limetoholewa kutoka Kiebrania; utambulisho mbadala wa Xerxes haujawekwa katika maandishi kwa kuwa ni uamuzi wa kihistoria, si uhamishaji wa moja kwa moja wa jina. Mstari umeachwa na kistari mwishoni kwa sababu sentensi inaendelea katika mstari unaofuata.
