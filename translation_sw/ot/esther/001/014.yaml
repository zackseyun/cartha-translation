  text: וְ/הַ/קָּרֹ֣ב אֵלָ֗י/ו כַּרְשְׁנָ֤א שֵׁתָר֙ אַדְמָ֣תָא תַרְשִׁ֔ישׁ מֶ֥רֶס מַרְסְנָ֖א מְמוּכָ֑ן שִׁבְעַ֞ת שָׂרֵ֣י פָּרַ֣ס וּ/מָדַ֗י רֹאֵי֙ פְּנֵ֣י הַ/מֶּ֔לֶךְ הַ/יֹּשְׁבִ֥ים רִאשֹׁנָ֖ה בַּ/מַּלְכֽוּת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/014.yaml
  text: And those closest to him were Carshena[a], Shethar, Admatha, Tarshish, Meres, Marsena, and Memucan[b], the seven officials of Persia and Media who saw the king’s face and sat first in the kingdom.
translation:
  language: sw
  text: Nao waliokuwa karibu naye walikuwa Karshena, Shethari, Admatha, Tarshishi, Meresi, Marsena na Memukani—maafisa saba wa Uajemi na Umedi waliouona uso wa mfalme[a] na walioketi katika nafasi za kwanza katika ufalme.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “waliouona uso wa mfalme”; hii ilikuwa nahau ya ikulu ya Uajemi iliyomaanisha watu waliokuwa na ruhusa ya kufika moja kwa moja mbele ya mfalme.
    reason: cultural_note
  - marker: b
    text: Au, “na kushika nyadhifa za juu zaidi katika ufalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקָּרֹב אֵלָיו
  choice: Nao waliokuwa karibu naye walikuwa
  rationale: Ingawa קָרוֹב iko katika umoja kisarufi, hapa inaanzisha orodha ya watu saba na ina dhima ya pamoja; wingi ni wa asili zaidi katika Kiswahili.
- source_word: כַּרְשְׁנָא שֵׁתָר אַדְמָתָא תַרְשִׁישׁ מֶרֶס מַרְסְנָא מְמוּכָן
  choice: Karshena, Shethari, Admatha, Tarshishi, Meresi, Marsena na Memukani
  rationale: Majina ya watu yamenukuliwa kwa tahajia inayosomeka kwa urahisi katika Kiswahili bila kuyatafsiri maana zake.
- source_word: שִׁבְעַת שָׂרֵי
  choice: maafisa saba
  rationale: שָׂרֵי humaanisha watawala au maafisa wa cheo cha juu; “maafisa” ni wazi kwa msomaji wa sasa na haidokezi lazima ukoo wa kifalme.
- source_word: פָּרַס וּמָדַי
  choice: wa Uajemi na Umedi
  rationale: Huyataja maeneo mawili ya milki; Uajemi na Umedi ni maumbo ya kawaida ya majina haya katika Kiswahili cha Biblia.
- source_word: רֹאֵי פְּנֵי הַמֶּלֶךְ
  choice: waliouona uso wa mfalme
  rationale: Tafsiri hii inadumisha picha halisi ya Kiebrania na nahau ya ikulu; tanbihi inaeleza kuwa ilimaanisha ruhusa ya kufika mbele ya mfalme.
- source_word: הַיֹּשְׁבִים רִאשֹׁנָה בַּמַּלְכוּת
  choice: na kukalia viti vya kwanza katika ufalme
  rationale: Huhifadhi sitiari ya kuketi huku ikionyesha utangulizi wa cheo; tanbihi inatoa maana ya kiutendaji ya kushika nyadhifa za juu zaidi.
