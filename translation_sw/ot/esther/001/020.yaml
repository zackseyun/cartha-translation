  text: וְ/נִשְׁמַע֩ פִּתְגָ֨ם הַ/מֶּ֤לֶךְ אֲשֶֽׁר יַעֲשֶׂה֙ בְּ/כָל מַלְכוּת֔/וֹ כִּ֥י רַבָּ֖ה הִ֑יא וְ/כָל הַ/נָּשִׁ֗ים יִתְּנ֤וּ יְקָר֙ לְ/בַעְלֵי/הֶ֔ן לְ/מִ/גָּד֖וֹל וְ/עַד קָטָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/020.yaml
  text: And when the king’s decree that he makes is heard throughout all his kingdom—for it is vast—all the women will give honor to their husbands[b][a], from great to small.
translation:
  language: sw
  text: Na amri[a] atakayotoa mfalme itakaposikika katika ufalme wake wote—kwa kuwa ufalme huo ni mkubwa—wanawake wote watawapa waume zao heshima[b], kuanzia wakubwa hadi wadogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “agizo rasmi.” Neno la Kiebrania linamaanisha tamko rasmi la kifalme.
    reason: lexical_alternative
  - marker: b
    text: Au “wataonyesha heshima kwa waume zao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַע
  choice: itakaposikika
  rationale: Kauli ya kutendwa ya kitenzi שׁמע inaonyesha kusikika kwa amri; muundo wa “itakaposikika” unaunganisha hali hiyo kwa kawaida na matokeo yanayofuata.
- source_word: פִּתְגָם
  choice: amri
  rationale: Katika mazingira ya jumba la kifalme la Uajemi, neno hili linamaanisha tamko rasmi la mfalme. “Amri” ni neno la kawaida, lenye hadhi inayofaa, na linaeleweka kwa urahisi.
- source_word: אֲשֶׁר יַעֲשֶׂה
  choice: atakayotoa
  rationale: Ingawa עשה kwa msingi humaanisha “kufanya,” likitumiwa pamoja na tamko rasmi humaanisha kulitoa au kuliweka rasmi. “Atakayotoa” ni Kiswahili cha kawaida katika muktadha wa amri.
- source_word: בְּכָל מַלְכוּתוֹ
  choice: katika ufalme wake wote
  rationale: Usemi huu unaonyesha eneo lote ambamo amri itasikika, bila kubadili “ufalme” kuwa istilahi pana zaidi kama “himaya.”
- source_word: כִּי רַבָּה הִיא
  choice: kwa kuwa ufalme huo ni mkubwa
  rationale: Kutaja “ufalme huo” wazi kunaondoa utata wa kisarufi usio wa lazima katika Kiswahili, huku kukihifadhi sababu inayotolewa na kifungu cha Kiebrania.
- source_word: וְכָל הַנָּשִׁים
  choice: wanawake wote
  rationale: Hili linadumisha nomino ya jumla ya Kiebrania “wanawake”; maneno yanayofuata kuhusu waume zao yanaonyesha kuwa wanawake walioolewa ndio wanaozungumziwa.
- source_word: יִתְּנוּ יְקָר
  choice: watawapa ... heshima
  rationale: Hii inadumisha taswira ya Kiebrania ya “kutoa heshima” na ni usemi wa asili katika Kiswahili sanifu.
- source_word: לְבַעְלֵיהֶן
  choice: waume zao
  rationale: Ingawa בעל linaweza kumaanisha bwana au mwenye kitu, katika muktadha huu wa nyumbani linamaanisha waume, bila kulazimisha maana kali zaidi ya kimamlaka.
- source_word: לְמִגָּדוֹל וְעַד קָטָן
  choice: tangu mkubwa hadi mdogo
  rationale: Usemi huu mfupi unahifadhi nahau ya Kiebrania inayojumuisha ngazi zote za kijamii bila kuifafanua zaidi kuliko maandishi chanzi.
