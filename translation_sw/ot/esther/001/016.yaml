base_translation:
  language: en
  yaml_path: translation/ot/esther/001/016.yaml
  text: Then Memucan said before the king and the officials[a], “Queen Vashti has done wrong not against the king alone, but against all the officials and all the peoples who are in all the provinces of King Ahasuerus.”
translation:
  language: sw
  text: Ndipo Memukani akasema mbele ya mfalme na maofisa, “Malkia Vashti hakumkosea mfalme peke yake, bali pia maofisa wote na watu wa mataifa yote walio katika majimbo yote ya Mfalme Ahasuero.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Muundo wa masimulizi unaendeleza tukio; ‘Ndipo’ huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: מומכן
  choice: Memukani
  rationale: Jina limetoholewa kwa matamshi na tahajia inayofaa Kiswahili.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Hueleza kwamba alisema katika uwepo wa mfalme na maofisa.
- source_word: הַשָּׂרִים
  choice: maofisa
  rationale: Neno linamaanisha watawala au maofisa wa ngazi ya juu; ‘maofisa’ ni la kisasa na linafaa mazingira ya ikulu ya Uajemi.
- source_word: לֹא עַל הַמֶּלֶךְ לְבַדּוֹ עָוְתָה
  choice: hakumkosea mfalme peke yake
  rationale: ‘Kumkosea’ huonyesha tendo baya lililoelekezwa kwa mtu bila kulipunguza kuwa tusi tu.
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: Malkia Vashti
  rationale: Kiswahili huweka cheo kabla ya jina kwa kawaida.
- source_word: כִּי
  choice: bali pia
  rationale: Hapa linaendeleza muundo wa ‘si ... peke yake, bali pia ...’ na kuonyesha upanuzi wa dai.
- source_word: עַל כָּל הַשָּׂרִים וְעַל כָּל הָעַמִּים
  choice: maofisa wote na watu wa mataifa yote
  rationale: ‘Watu wa mataifa yote’ huhifadhi wingi wa עַמִּים na kuonyesha muundo wa himaya yenye makabila na mataifa mbalimbali.
- source_word: מְדִינוֹת
  choice: majimbo
  rationale: Ni neno la kawaida kwa maeneo ya kiutawala ya himaya katika kitabu cha Esta.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasuero
  rationale: Umbo la jina linalotambulika katika matumizi ya Biblia ya Kiswahili.
