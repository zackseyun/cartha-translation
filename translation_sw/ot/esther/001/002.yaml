base_translation:
  language: en
  yaml_path: translation/ot/esther/001/002.yaml
  text: In those days[a], when King Ahasuerus sat on his royal throne, which was in Susa the citadel,
translation:
  language: sw
  text: Siku hizo, Mfalme Ahasuero alipokuwa ameketi juu ya kiti chake cha enzi, kilichokuwa katika ngome ya Susa,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Siku hizo
  rationale: Ni fomula ya kawaida ya kusimulia wakati, na tafsiri hii huhifadhi nguvu ya kiashirio cha Kiebrania kwa Kiswahili cha kawaida.
- source_word: כְּשֶׁבֶת
  choice: alipokuwa ameketi
  rationale: Muundo wa כ pamoja na jina-jinsi la kitenzi ישב unaanzisha kishazi cha wakati; Kiswahili hiki ni cha asili na kinaonyesha hali iliyokuwa ikiendelea katika simulizi.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: mfalme Ahasuero
  rationale: Cheo kinawekwa kabla ya jina kama ilivyo kawaida katika Kiswahili; Ahasuero ni umbo lililozoeleka la jina hili katika mapokeo ya Biblia ya Kiswahili.
- source_word: עַל כִּסֵּא מַלְכוּתוֹ
  choice: kwenye kiti chake cha kifalme
  rationale: Kihalisi ni ‘juu ya kiti cha ufalme wake’; ‘kiti chake cha kifalme’ ni cha asili na huhifadhi maana ya mamlaka ya kifalme pamoja na kiambishi cha umilikaji.
- source_word: אֲשֶׁר
  choice: huko
  rationale: Ingawa אֲשֶׁר huanzisha kishazi rejeshi kinachohusishwa na kiti, katika Kiswahili cha asili mahali pa kiti hicho huwasilishwa vizuri kwa ‘huko’ bila kubadili rejeleo lake.
- source_word: בְּשׁוּשַׁן
  choice: Susa
  rationale: Susa ni umbo la kisasa na linalotambulika la jina la mahali שׁוּשַׁן katika Kiswahili.
- source_word: הַבִּירָה
  choice: ngome ya mji
  rationale: Neno בִּירָה hapa linaashiria eneo la jumba la kifalme lenye ulinzi au mji wenye ngome; ‘ngome ya mji’ huepuka kulifanya kuwa ‘mji mkuu’ tu na ni wazi kwa msomaji wa kawaida.
