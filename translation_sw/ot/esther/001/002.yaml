translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio unaendeleza kishazi cha mstari wa 1 na kuishia kwa koma. Hakuna tanbihi iliyowekwa kwa kuwa tofauti ya ‘Shushani’ ni tofauti ya uhawilishaji wa jina, si maana nyingine ya lazima katika tafsiri ya Kiswahili.
