language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/תְּמָאֵ֞ן הַ/מַּלְכָּ֣ה וַשְׁתִּ֗י לָ/בוֹא֙ בִּ/דְבַ֣ר הַ/מֶּ֔לֶךְ אֲשֶׁ֖ר בְּ/יַ֣ד הַ/סָּרִיסִ֑ים וַ/יִּקְצֹ֤ף הַ/מֶּ֨לֶךְ֙ מְאֹ֔ד וַ/חֲמָת֖/וֹ בָּעֲרָ֥ה בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/012.yaml
  text: But Queen Vashti refused to come at the king’s command by the hand of the eunuchs[a], and the king became very angry[b], and his wrath burned within him.
translation:
  language: sw
  text: Lakini Malkia Vashti akakataa kuja kwa amri ya mfalme iliyowasilishwa kupitia matowashi[a]. Mfalme akakasirika sana, na ghadhabu yake ikawaka ndani yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni, “kwa mkono wa matowashi,” nahau inayomaanisha kuwa amri hiyo ilifikishwa kupitia kwao.
    reason: lexical_alternative
  - marker: b
    text: Au, “hasira yake kali ikawaka ndani yake.” Kiebrania kinadumisha taswira ya hasira kama moto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמָאֵן
  choice: akakataa
  rationale: Kitenzi מאן kinaonyesha kukataa au kutokuwa tayari kufanya jambo; “akakataa” ni tafsiri ya moja kwa moja na ya kawaida inayodumisha uzito wa uamuzi wa Vashti.
- source_word: הַמַּלְכָּה וַשְׁתִּי
  choice: Malkia Vashti
  rationale: Muundo huu wa kawaida wa Kiswahili unadumisha cheo chake na jina lake bila kufanya sentensi kuwa nzito.
- source_word: לָבוֹא
  choice: kuja
  rationale: בוא hapa ina maana ya kuitikia mwito kwa kuja mbele ya mfalme; “kuja” ndiyo tafsiri ya kawaida katika muktadha huu.
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: kwa amri ya mfalme
  rationale: דבר inaweza kumaanisha neno, jambo, au amri. Katika muktadha huu inarejelea agizo la mfalme, hivyo “amri” huwasilisha maana kwa uwazi.
- source_word: אֲשֶׁר בְּיַד הַסָּרִיסִים
  choice: iliyowasilishwa kupitia matowashi
  rationale: Nahau ya Kiebrania “kwa mkono wa” huonyesha uwakala au njia iliyotumiwa. “Kupitia” ni Kiswahili cha asili kinachoonyesha kuwa matowashi ndio waliofikisha amri; סריסים imetafsiriwa wazi kuwa “matowashi” kwa kuzingatia mazingira ya ikulu ya Uajemi.
- source_word: וַיִּקְצֹף מְאֹד
  choice: akakasirika sana
  rationale: קצף huonyesha hasira kali, na מְאֹד huiongeza nguvu. “Akakasirika sana” ni lugha ya sasa, wazi, na inayofuata maendeleo ya simulizi.
- source_word: וַחֲמָתוֹ בָּעֲרָה בוֹ
  choice: ghadhabu yake ikawaka ndani yake
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya hasira kama moto. בו inaeleweka hapa kuwa “ndani yake,” kwa kuwa hakuna mhusika mwingine wa kiume anayelengwa na kiwakilishi hicho.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye hadhi. “Matowashi” limedumishwa kwa usahihi wa mazingira ya ikulu, huku nahau ya Kiebrania “kwa mkono wa” ikielezwa katika tanbihi badala ya kuingizwa kwa namna isiyo ya kawaida katika sentensi.
