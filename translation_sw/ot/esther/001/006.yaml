translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. 'Palikuwa' limetumiwa kwa mpangilio wa mahali, na sentensi imegawanywa mara mbili ili orodha ndefu ibaki wazi. Alama zote za tanbihi zimewekwa baada ya maneno yanayohusika.
