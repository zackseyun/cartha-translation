base_translation:
  language: en
  yaml_path: translation/ot/esther/001/006.yaml
  text: There were hangings of white cotton and blue[a], fastened with cords of fine linen and purple to silver rings and marble pillars, and couches of gold and silver on a pavement of alabaster, marble, mother-of-pearl[c][b], and precious stones.
translation:
  language: sw
  text: Palikuwa na mapazia meupe, ya pamba, na ya samawati, yaliyofungwa kwa kamba za kitani safi na za rangi ya zambarau kwenye pete za fedha[a] na nguzo za marumaru. Palikuwa pia na vitanda vya karamu[b] vya dhahabu na fedha juu ya sakafu iliyotengenezwa kwa alabasta, marumaru, lulumizi na mawe ya thamani.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vifaa vya fedha vilivyoviringishwa.” Neno la Kiebrania linaweza kutaja pete, fito, au vifaa vingine vya fedha vyenye umbo la duara.
    reason: lexical_alternative
  - marker: b
    text: Hivi vilikuwa vitanda au makochi ya karamu ambavyo wageni walivilalia au kuviegemea walipokula, si vitanda vya kawaida vya kulala.
    reason: cultural_note
  - marker: c
    text: Utambulisho sahihi wa vifaa vilivyotajwa katika orodha ya sakafu hauna uhakika. Maneno yaliyotafsiriwa “alabasta,” “marumaru,” “lulumizi,” na “mawe ya thamani” pia yametafsiriwa kwa majina mengine ya mawe, kama vile porfiri, marumaru nyeupe, au jiwe jeusi.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוּר כַּרְפַּס וּתְכֵלֶת
  choice: mapazia ya pamba nyeupe na ya samawati
  rationale: Muktadha unaonyesha vitambaa vya mapambo; חוּר inaeleweka hapa kama rangi nyeupe, כַּרְפַּס kama pamba, na תְכֵלֶת kama samawati au samawati yenye kuelekea zambarau.
- source_word: חַבְלֵי בּוּץ וְאַרְגָּמָן
  choice: kamba za kitani safi na za rangi ya zambarau
  rationale: בּוּץ ni kitani bora au safi, na אַרְגָּמָן ni rangi ya kifahari ya zambarau; muundo wa Kiswahili unaonyesha kwamba kamba hizo zilikuwa za aina hizo mbili.
- source_word: גְּלִילֵי כֶסֶף
  choice: pete za fedha
  rationale: Neno linaashiria vitu vya fedha vilivyo duara au vilivyoviringishwa; pete zinafaa kama sehemu za kufungia mapazia, ingawa maana kamili haijulikani.
- source_word: עַמּוּדֵי שֵׁשׁ
  choice: nguzo za marumaru
  rationale: שֵׁשׁ hapa inaelekea kutaja jiwe jeupe, si kitani; marumaru ni tafsiri ya kawaida katika muktadha wa ujenzi.
- source_word: מִטּוֹת
  choice: viti vya kulalia
  rationale: Katika karamu za kale wageni waliegemea au kulalia kwenye viti maalumu; hii si kawaida ya vitanda vya kulala usiku.
- source_word: רִצְפַת
  choice: sakafu
  rationale: Neno linataja uso wa sakafu uliotengenezwa kwa mawe; 'sakafu' ni ya asili na wazi katika Kiswahili.
- source_word: בַּהַט וָשֵׁשׁ וְדַר וְסֹחָרֶת
  choice: alabasta, marumaru, lulumizi na mawe ya thamani
  rationale: Majina kadhaa ya mawe au vifaa hivi ni nadra na utambulisho wake hauna uhakika. Tafsiri hizi zinawakilisha utambuzi wa kawaida huku tanbihi ikihifadhi kutokuwa na uhakika.
