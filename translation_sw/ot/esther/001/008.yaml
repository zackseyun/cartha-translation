  language: en
  yaml_path: translation/ot/esther/001/008.yaml
  text: 'And the drinking was according to the law: there was no compulsion[c][b][a], for so the king had instructed every official of his household to do according to the desire of each man.'
translation:
  language: sw
  text: Kunywa kulikuwa kwa kufuata kanuni[a]; hakuna aliyelazimishwa[b], kwa maana mfalme alikuwa amemwagiza kila msimamizi wa nyumba yake ili wafanye kulingana na matakwa ya kila mtu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kufuata sheria”; neno la Kiebrania linaweza kumaanisha sheria, amri, au kanuni rasmi.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “hakukuwa na kulazimisha,” yaani, hakuna mtu aliyelazimishwa kunywa.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinasema, “mtu na mtu,” usemi unaomaanisha kila mmoja binafsi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁתִיָּה
  choice: Kunywa
  rationale: Nomino hii inaeleza tendo la kunywa katika karamu, si karamu yote kwa ujumla.
- source_word: כַדָּת
  choice: kwa kufuata kanuni
  rationale: דָּת inaweza kumaanisha sheria, amri, au kanuni rasmi; katika muktadha huu ni utaratibu uliowekwa kwa ajili ya unywaji.
- source_word: אֵין אֹנֵס
  choice: hakuna aliyelazimishwa
  rationale: Hueleza kwa Kiswahili cha kawaida kwamba mtu yeyote hakushurutishwa kunywa.
- source_word: כִּי כֵן
  choice: kwa maana
  rationale: Kiunganishi hiki kinaonyesha sababu ya kutokuwapo kwa kulazimisha.
- source_word: יִסַּד
  choice: alikuwa amewaagiza
  rationale: Ingawa maana ya msingi ni kuweka au kuanzisha, hapa kitenzi kina nguvu ya kuweka agizo la kiutawala.
- source_word: עַל כָּל רַב בֵּיתוֹ
  choice: wasimamizi wote wa nyumba yake
  rationale: רַב hapa ni wakuu au maafisa wenye wajibu katika nyumba ya kifalme; 'wasimamizi' huwasilisha kazi yao kwa uwazi.
- source_word: לַעֲשׂוֹת כִּרְצוֹן
  choice: wamruhusu ... atende kama alivyotaka
  rationale: Kiswahili hiki kinaonyesha kwamba wasimamizi walipaswa kutekeleza mapenzi ya kila mgeni bila kumlazimisha, huku kikihifadhi wazo la kufanya kulingana na matakwa yake.
- source_word: אִישׁ וָאִישׁ
  choice: kila mtu
  rationale: Urudiaji wa Kiebrania ni tamko la ugawaji linalomaanisha kila mmoja binafsi; 'kila mtu' ni la asili na jumuishi katika Kiswahili.
