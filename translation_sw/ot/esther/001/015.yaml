  source_fidelity: 'Tafsiri inawakilisha kwa usahihi vipengele vya msingi vya Kiebrania: כְּדָת kama “Kwa mujibu wa sheria,” swali lisilo na mtendaji bayana katika מַה לַּעֲשׂוֹת, sababu katika עַל אֲשֶׁר, na uwakala wa בְּיַד הַסָּרִיסִים. “Afanyiwe nini” huhifadhi vyema hali ya kisheria bila kuamulia mapema aina ya hatua.'
