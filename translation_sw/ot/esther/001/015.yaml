  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kifalme lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa swali umewekwa wa kisheria na usio na mhusika maalumu, huku nahau ya Kiebrania ikitafsiriwa kwa lugha ya asili na maana yake halisi kuhifadhiwa katika tanbihi.
