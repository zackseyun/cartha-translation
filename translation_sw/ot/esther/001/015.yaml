  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כְּ/דָת֙ מַֽה לַּ/עֲשׂ֔וֹת בַּ/מַּלְכָּ֖ה וַשְׁתִּ֑י עַ֣ל אֲשֶׁ֣ר לֹֽא עָשְׂתָ֗ה אֶֽת מַאֲמַר֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ בְּ/יַ֖ד הַ/סָּרִיסִֽים־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/015.yaml
  text: According to the law[c][b][a], what is to be done with Queen Vashti because she did not carry out the command of King Ahasuerus delivered by the eunuchs?
translation:
  language: sw
  text: Kwa mujibu wa sheria, Malkia Vashti afanyiwe nini, kwa kuwa hakutekeleza[a] agizo la Mfalme Ahasuero lililowasilishwa kupitia kwa matowashi?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kuwa hakutii agizo la Mfalme Ahasuero.”
    reason: lexical_alternative
  - marker: b
    text: Neno kwa neno, “kwa mkono wa matowashi.”
    reason: lexical_alternative
  - marker: c
    text: Neno la Kiebrania linaweza pia kumaanisha kwa upana zaidi maofisa wa ikulu, ingawa “matowashi” ndiyo tafsiri ya moja kwa moja zaidi.
    reason: cultural_note
lexical_decisions:
- source_word: כְּדָת
  choice: Kwa mujibu wa sheria
  rationale: Katika mazingira ya ikulu ya Uajemi kwenye kitabu cha Esta, דָּת kwa kawaida humaanisha sheria au amri rasmi. Tafsiri hii inadumisha uzito wa kisheria wa swali.
- source_word: מַה לַּעֲשׂוֹת
  choice: afanyiwe nini
  rationale: Muundo huu wa Kiswahili ni wa kawaida na unadumisha swali lisilomtaja moja kwa moja mhusika atakayetekeleza hatua hiyo.
- source_word: בַּמַּלְכָּה וַשְׁתִּי
  choice: Malkia Vashti afanyiwe
  rationale: Kihusishi cha Kiebrania hapa kinahusu hatua itakayochukuliwa kumwelekea Vashti. Kauli hii ni ya kisheria lakini haiongezi wazo la uhasama ambalo halijasemwa wazi.
- source_word: עַל אֲשֶׁר לֹא עָשְׂתָה
  choice: kwa kuwa hakutekeleza
  rationale: Kifungu hiki kinatoa sababu ya hatua inayozungumziwa. ‘Hakutekeleza’ huendana kwa kawaida na agizo bila kubadilisha kitenzi kuwa neno lenye maana pana zaidi ya kutotii.
- source_word: מַאֲמַר
  choice: agizo
  rationale: Katika muktadha wa kifalme, neno hili linamaanisha tamko lenye mamlaka; ‘agizo’ ni la asili na lenye uzito ufaao katika Kiswahili.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Mfalme Ahasuero
  rationale: Cheo kimetafsiriwa na jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: בְּיַד הַסָּרִיסִים
  choice: lililowasilishwa kupitia kwa matowashi
  rationale: Neno kwa neno ni ‘kwa mkono wa matowashi,’ nahau inayoonyesha chombo au uwakala. Tafsiri hii inaeleza kwa Kiswahili cha kawaida jinsi agizo lilivyofikishwa.
