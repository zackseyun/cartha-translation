base_translation:
  language: en
  yaml_path: translation/ot/esther/001/019.yaml
  text: 'If it seems good to the king[a], let a royal decree go out from before him and be written among the laws of Persia and Media, so that it may not be revoked: that Vashti is not to come before King Ahasuerus[c][b], and let the king give her royal position to another woman better than she.'
translation:
  language: sw
  text: 'Kama mfalme akiona vema[a], amri ya kifalme itolewe kutoka kwake na kuandikwa katika sheria za Uajemi na Umedi, wala isibatilishwe[b]: kwamba Vashti asije mbele ya Mfalme Ahasuero, naye mfalme ampe mwanamke mwingine aliye bora kuliko Vashti cheo cha Vashti cha malkia[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kama ikimpendeza mfalme.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wala isibadilishwe” au “wala isivunjwe.” Nahau ya Kiebrania inaonyesha kuwa amri hiyo ina nguvu ya kudumu kisheria.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kwa neno moja ni “ufalme wake” au “umalkia wake”; hapa maana ni hadhi au cheo chake kama malkia.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Kama mfalme akiona vema
  rationale: Ni namna ya heshima ya kuwasilisha pendekezo kwa mfalme; Kiswahili hiki ni cha kawaida na kinahifadhi wazo la kibali chake.
- source_word: יֵצֵא דְבַר מַלְכוּת מִלְּפָנָיו
  choice: amri ya kifalme itolewe kutoka kwake
  rationale: דְבַר מַלְכוּת ni tamko rasmi lenye nguvu ya kisheria, si neno la kawaida tu; מִלְּפָנָיו inaonyesha kuwa linatoka kwa mamlaka ya mfalme.
- source_word: וְיִכָּתֵב בְּדָתֵי פָרַס וּמָדַי
  choice: na kuandikwa katika sheria za Uajemi na Umedi
  rationale: Inawasilisha kuingizwa rasmi kwa amri hiyo katika mkusanyo wa sheria, huku ikidumisha mpangilio wa majina katika Kiebrania.
- source_word: וְלֹא יַעֲבוֹר
  choice: wala isibatilishwe
  rationale: Katika muktadha wa kisheria, nahau hii inaonyesha kuwa amri haipaswi kuondolewa nguvu au kufutwa; tanbihi inahifadhi uwezekano mwingine wa maana.
- source_word: אֲשֶׁר לֹא תָבוֹא וַשְׁתִּי
  choice: kwamba Vashti asije
  rationale: Kishazi hiki kinataja yaliyomo katika amri na kinadumisha nguvu ya katazo bila kuongeza neno kama ‘tena,’ ambalo halipo wazi katika chanzo.
- source_word: וּמַלְכוּתָהּ
  choice: cheo chake cha malkia
  rationale: Katika muktadha huu neno linamaanisha hadhi au wadhifa wa Vashti kama malkia, wala si nchi anayoitawala.
- source_word: לִרְעוּתָהּ הַטּוֹבָה מִמֶּנָּה
  choice: mwanamke mwingine aliye bora kuliko yeye
  rationale: רְעוּתָהּ humrejelea mwanamke mwingine anayechukua nafasi yake; ‘aliye bora kuliko yeye’ huhifadhi ulinganisho bila kueleza ubora huo ni wa aina gani.
