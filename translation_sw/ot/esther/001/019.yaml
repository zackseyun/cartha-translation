  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa mazingira ya kifalme lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi unafuata mantiki ya pendekezo la kisheria katika chanzo bila kuwa mgumu kupita kiasi.
