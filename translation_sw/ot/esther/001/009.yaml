  text: Malkia Vashti pia aliwaandalia wanawake karamu katika jumba la kifalme la Mfalme Ahasuero.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “karamu”; neno la Kiebrania linaweza kumaanisha karamu ambayo mara nyingi ilihusisha unywaji.
