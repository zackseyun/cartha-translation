lexical_decisions:
- source_word: גַּם
  choice: pia
  rationale: Inaunganisha tendo la Vashti na karamu ya mfalme iliyotajwa kabla, kwa Kiswahili cha kawaida na kifupi.
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: Malkia Vashti
  rationale: Mpangilio huu wa cheo na jina ni wa asili katika Kiswahili; jina limetoholewa kwa umbo linalotumika sana katika Biblia za Kiswahili.
- source_word: עָשְׂתָה מִשְׁתֵּה
  choice: aliwaandalia ... karamu
  rationale: Kitenzi עשה ni ‘kufanya/kuandaa,’ na pamoja na מִשְׁתֶּה maana ya kawaida ni kuandaa karamu; umbo hili pia linaonyesha wazi kuwa wanawake ndio walioandaliwa karamu.
- source_word: מִשְׁתֵּה
  choice: karamu
  rationale: Neno hilo humaanisha karamu, mara nyingi yenye kunywa; ‘karamu’ ni la kawaida, lenye heshima, na halifanyi unywaji kuwa maana pekee.
- source_word: נָשִׁים
  choice: wanawake
  rationale: Huwataja washiriki wa karamu moja kwa moja bila kuongeza hadhi au maelezo yasiyomo katika Kiebrania.
- source_word: בֵּית הַמַּלְכוּת
  choice: jumba la kifalme
  rationale: Kirai hicho kihalisi ni ‘nyumba ya ufalme/kifalme’; ‘jumba la kifalme’ huhifadhi taswira ya nyumba huku kikieleweka kwa kawaida kama mazingira ya ikulu.
- source_word: אֲשֶׁר לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: la Mfalme Ahasuero
  rationale: Muundo wa ‘la’ huwasilisha kwa ufupi na kwa asili uhusiano wa jumba hilo na mfalme.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasuero
  rationale: Hili ni toleo la jina lililozoeleka katika mapokeo ya Biblia ya Kiswahili.
