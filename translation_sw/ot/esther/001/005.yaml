base_translation:
  language: en
  yaml_path: translation/ot/esther/001/005.yaml
  text: And when these days were completed[a], the king gave a banquet for all the people who were present in Susa the citadel, from great to small, for seven days[d][c][b], in the court of the garden of the king’s palace.
translation:
  language: sw
  text: Baada ya siku hizi kuisha, mfalme aliwaandalia watu wote waliokuwapo katika ngome ya Shushani[b], kuanzia wakubwa hadi wadogo[c], karamu[a] ya siku saba katika ua wa bustani ya jumba[d] la mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tafrija ya kunywa”; neno la Kiebrania mara nyingi hutaja karamu inayohusisha kunywa.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza kumaanisha “ngome,” “ngome ya kifalme,” au “makao yenye ngome.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, watu wa kila cheo, kuanzia wenye vyeo vya juu hadi wenye vyeo vya chini.
    reason: idiom_explanation
  - marker: d
    text: Au “banda” au “nyumba”; maana kamili ya neno hili la mkopo la Kiajemi si hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִמְלֹאות הַיָּמִים הָאֵלֶּה
  choice: Siku hizo zilipokwisha
  rationale: 'Kirai chenye ב pamoja na kitenzi-jina cha מלא kinaonyesha wakati: siku zilizotajwa hapo awali zilipofikia mwisho. Usemi huu ni wa kawaida katika Kiswahili na unabaki karibu na maana ya Kiebrania.'
- source_word: עָשָׂה ... מִשְׁתֶּה
  choice: aliwaandalia karamu
  rationale: עָשָׂה pamoja na מִשְׁתֶּה humaanisha kuandaa au kufanya karamu. Kiambishi cha yambwa katika “aliwaandalia” kinaonyesha wazi kwamba karamu ilikuwa kwa ajili ya watu waliotajwa.
- source_word: מִשְׁתֶּה
  choice: karamu
  rationale: Neno hili humaanisha tafrija au karamu ambayo mara nyingi huhusisha kunywa. “Karamu” linafaa mazingira ya kifalme bila kusisitiza kupita kiasi upande wa vinywaji.
- source_word: לְכָל הָעָם הַנִּמְצְאִים
  choice: watu wote waliokuwapo
  rationale: Hapa עָם linawahusu kwa upana watu waliokuwa mahali hapo, si lazima taifa au kabila moja; participle ya Niphal הַנִּמְצְאִים ina maana ya waliopatikana au waliokuwapo.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: Shushani, mji wa ngome
  rationale: בִּירָה ni makao ya mjini yenye ulinzi au ngome. Uundaji huu unahifadhi uhusiano wa kiambatano katika Kiebrania na ni wazi kwa msomaji wa Kiswahili.
- source_word: לְמִגָּדוֹל וְעַד קָטָן
  choice: wakubwa kwa wadogo
  rationale: Huu ni msemo jumuishi unaowahusu watu wa kila cheo au hadhi. “Wakubwa kwa wadogo” ni msemo wa asili wa Kiswahili unaohifadhi taswira ya Kiebrania.
- source_word: שִׁבְעַת יָמִים
  choice: ilidumu kwa siku saba
  rationale: Kiebrania kinatoa muda wa karamu. Kutaja kwamba karamu “ilidumu” huwasilisha uhusiano huo kwa Kiswahili cha kawaida bila kuongeza wazo jipya.
- source_word: בַּחֲצַר גִּנַּת
  choice: katika ua wa bustani
  rationale: חָצֵר ni ua au eneo la wazi lililozungukwa, na umbo la construct linaunganisha ua huo na bustani.
- source_word: בִּיתַן הַמֶּלֶךְ
  choice: jumba la mfalme
  rationale: בִּיתַן ni neno la mkopo la Kiajemi linaloweza kumaanisha jumba, nyumba, au banda la kifalme. “Jumba” linafaa mazingira haya huku tanbihi ikihifadhi kutokuwa na uhakika kamili.
