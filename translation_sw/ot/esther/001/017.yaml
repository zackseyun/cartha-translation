  text: כִּֽי יֵצֵ֤א דְבַר הַ/מַּלְכָּה֙ עַל כָּל הַ/נָּשִׁ֔ים לְ/הַבְז֥וֹת בַּעְלֵי/הֶ֖ן בְּ/עֵינֵי/הֶ֑ן בְּ/אָמְרָ֗/ם הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֡וֹשׁ אָמַ֞ר לְ/הָבִ֨יא אֶת וַשְׁתִּ֧י הַ/מַּלְכָּ֛ה לְ/פָנָ֖י/ו וְ/לֹא בָֽאָה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/017.yaml
  text: For the queen’s matter will go out to all women, causing them to despise their husbands in their eyes, when they say, ‘King Ahasuerus said to bring Queen Vashti before him, but she did not come.’
translation:
  language: sw
  text: Kwa maana habari ya malkia itaenea kwa wanawake wote na kuwafanya wawadharau waume zao machoni pao, watakaposema, ‘Mfalme Ahasuero alisema kwamba Malkia Vashti aletwe mbele yake, lakini hakuja.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְבַר הַמַּלְכָּה
  choice: habari ya malkia
  rationale: Nomino דָּבָר inaweza kumaanisha neno, jambo, au habari. Katika muktadha huu ni taarifa kuhusu jambo lililomhusu malkia ambayo ingeenea; “habari ya malkia” ni ya asili kwa Kiswahili bila kuifasiri moja kwa moja kuwa mwenendo wake.
- source_word: יֵצֵא ... עַל כָּל הַנָּשִׁים
  choice: itaenea kwa wanawake wote
  rationale: Kwa maana ya habari kufika na kujulikana miongoni mwa wanawake wote, “itaenea kwa” huwasilisha nahau ya Kiebrania kwa uwazi.
- source_word: לְהַבְזוֹת בַּעְלֵיהֶן בְּעֵינֵיהֶן
  choice: kuwafanya wawadharau waume zao machoni pao
  rationale: Huhifadhi uhusiano wa kusababisha na nahau “machoni pao,” ambayo inaonyesha mtazamo wao wenyewe.
- source_word: אָמַר לְהָבִיא
  choice: alisema ... aletwe
  rationale: Huhifadhi kitenzi cha kawaida אָמַר, “alisema,” badala ya kukifanya kiwe “aliamuru,” huku muundo wa Kiswahili wa kutenda-kutendwa ukiwasilisha kwamba Vashti angeletwa.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasuero
  rationale: Umbo la jina lililozoeleka katika Biblia za Kiswahili na linalolingana kwa karibu na jina la Kiebrania.
theological_decisions:
- issue: Je, דְבַר הַמַּלְכָּה ifafanuliwe kuwa mwenendo au kutotii kwa malkia?
  choice: habari ya malkia
  alternative: mwenendo wa malkia / jambo alilofanya malkia
  rationale: Chanzo kinasema kwa upana “neno/jambo/habari ya malkia”; tafsiri haipaswi kuongeza hukumu ya kimaadili ambayo haijasemwa wazi katika kifungu hiki.
- issue: Nguvu ya אָמַר katika kauli ya mfalme
  choice: alisema ... aletwe
  alternative: aliamuru ... aletwe
  rationale: “Alisema” hufuata kitenzi cha Kiebrania bila kuongeza kiwango cha mamlaka kilichofasiriwa, ingawa muktadha wa kifalme unaweza kudokeza agizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa wazi kwa wasomaji wa kawaida, huku nahau “machoni pao” ikihifadhiwa kwa sababu inaeleweka na inaakisi msisitizo wa chanzo. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zinazohitajika.
