  yaml_path: translation/ot/esther/001/021.yaml
  text: The matter pleased the king and the officials[b][a], and the king did according to the word of Memucan.
translation:
  language: sw
  text: Jambo hilo likawapendeza mfalme na maafisa[a], naye mfalme akafanya kulingana na neno la Memukani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Pendekezo hilo likaonekana kuwa jema kwa mfalme na maafisa.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “kulingana na neno la Memukani”; yaani, kulingana na shauri lake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב ... בְּעֵינֵי
  choice: likampendeza
  rationale: Nahau ya Kiebrania yenye maana ya kuwa jambo jema machoni pa mtu imetafsiriwa kwa Kiswahili cha kawaida kama ‘likampendeza,’ huku maana yake ya tathmini ikihifadhiwa.
- source_word: הַדָּבָר
  choice: Jambo hilo
  rationale: דָּבָר hapa hurejelea shauri lililotolewa na Memukani; ‘jambo hilo’ ni pana vya kutosha bila kulifasiri moja kwa moja kuwa ‘pendekezo.’
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya מֶלֶךְ.
- source_word: וְהַשָּׂרִים
  choice: na maafisa
  rationale: שָׂרִים hapa ni viongozi wa cheo cha juu katika ikulu. ‘Maafisa’ ni neno la sasa na linaloeleweka, lisilodokeza lazima kwamba walikuwa wana wa kifalme.
- source_word: וַיַּעַשׂ
  choice: akafanya
  rationale: Huhifadhi kitenzi cha kawaida עָשָׂה, ‘kufanya,’ na kishazi kinachofuata kinaeleza msingi wa tendo hilo.
- source_word: כִּדְבַר
  choice: kulingana na neno la
  rationale: Hufuata kwa ukaribu muundo wa Kiebrania ‘kulingana na neno la,’ huku tanbihi ikifafanua kuwa katika muktadha maana yake ni kufuata shauri la Memukani.
- source_word: מְמוּכָן
  choice: Memukani
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
