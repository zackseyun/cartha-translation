  text: Then the king said to the wise men who knew the times—for this was the king’s procedure before all who knew law and judgment—
translation:
  language: sw
  text: Ndipo mfalme akasema na watu wenye hekima waliozijua nyakati[a]—kwa maana ndivyo ilivyokuwa kawaida ya mfalme mbele ya wote walioijua sheria na hukumu—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walioelewa nyakati.” Huenda usemi huu unamaanisha wataalamu waliofahamu hali na hatua iliyofaa kuchukuliwa wakati huo.
    reason: Maana ya יֹדְעֵי הָעִתִּים inaweza kuwa pana kuliko ujuzi wa kalenda au majira pekee.
lexical_decisions:
- source_word: יֹדְעֵי הָעִתִּים
  choice: waliozijua nyakati
  rationale: Huhifadhi usemi wa Kiebrania na uwezekano wake wa kumaanisha wenye ujuzi wa nyakati, mazingira, au mambo yaliyofaa kufanywa wakati huo.
- source_word: כִּי כֵן דְּבַר הַמֶּלֶךְ לִפְנֵי
  choice: kwa maana ndivyo shauri la mfalme lilivyowasilishwa mbele ya
  rationale: Katika muktadha huu דְּבַר inaelekea kumaanisha jambo au shauri lililoletwa rasmi mbele ya wataalamu, si desturi kwa maana pana tu.
- source_word: דָּת וָדִין
  choice: sheria na hukumu
  rationale: Hutofautisha sheria au amri (דָּת) na uamuzi wa kisheria au hukumu (דִּין), bila kuziunganisha kuwa dhana moja.
