base_translation:
  language: en
  yaml_path: translation/ot/esther/001/018.yaml
  text: And today the noblewomen of Persia and Media who have heard the queen’s word will say the same to all the king’s officials[c][b][a], and there will be enough contempt and wrath.
translation:
  language: sw
  text: Na leo hii, wanawake wenye vyeo[a] wa Uajemi na Umedi ambao wamesikia jambo la malkia[b] watawaambia wakuu wote wa mfalme; kutakuwa na dharau na hasira tele.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanawake wakuu wa Uajemi na Umedi.” Neno la Kiebrania linamaanisha wanawake wenye cheo cha juu; si lazima wawe binti za kifalme.
    reason: lexical_alternative
  - marker: b
    text: Au, “maneno ya malkia” au “jambo lililomhusu malkia.” Neno la Kiebrania linaweza kumaanisha aliyosema malkia au jambo lililoripotiwa kumhusu.
    reason: lexical_alternative
  - marker: c
    text: Kishazi cha mwisho kimeachwa bila kitenzi katika Kiebrania; tafsiri ya moja kwa moja ni kama, “na dharau na hasira za kutosha.” Maneno “kutakuwa na” yameongezwa ili kukamilisha maana katika Kiswahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיּוֹם הַזֶּה
  choice: Na leo hii
  rationale: Muundo huu unaonyesha kuwa jambo hilo lingetokea mara moja, siku hiyo hiyo, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: תֹּאמַרְנָה
  choice: watawaambia hayo
  rationale: Kitenzi ni kauli ya wakati ujao, nafsi ya tatu wingi wa kike. Neno “hayo” linaonyesha kwa njia ya asili yaliyosemwa katika muktadha, ingawa Kiebrania hakitaji wazi maudhui baada ya kitenzi.
- source_word: שָׂרוֹת
  choice: wanawake wenye vyeo
  rationale: Neno hilo linamaanisha wanawake wa tabaka la juu au wenye mamlaka; tafsiri hii haidokezi bila msingi kwamba wote walikuwa binti za kifalme.
- source_word: פָּרַס וּמָדַי
  choice: wa Uajemi na Umedi
  rationale: Haya ndiyo majina ya kawaida ya maeneo na watu hao katika Kiswahili cha Biblia na yanaonyesha uhusiano wao na wanawake waliotajwa.
- source_word: אֲשֶׁר שָׁמְעוּ
  choice: ambao wamesikia
  rationale: Kauli timilifu inaonyesha tendo lililokamilika lenye umuhimu kwa hali inayotabiriwa.
- source_word: אֶת דְּבַר הַמַּלְכָּה
  choice: jambo la malkia
  rationale: דָּבָר linaweza kumaanisha neno, kauli, jambo, au tukio. “Jambo la malkia” huhifadhi upana huo vizuri katika Kiswahili.
- source_word: לְכֹל שָׂרֵי הַמֶּלֶךְ
  choice: wakuu wote wa mfalme
  rationale: שָׂרִים ni viongozi au maafisa wenye cheo. “Wakuu” ni neno la kawaida lenye hadhi na halimaanishi lazima wana wa kifalme.
- source_word: וּכְדַי
  choice: basi kutakuwa na ... nyingi
  rationale: Kifungu cha Kiebrania kinaonyesha kiasi cha kutosha au kingi. Kiswahili kinakamilisha kishazi kwa “kutakuwa na” ili maana isikike wazi.
- source_word: בִּזָּיוֹן
  choice: dharau
  rationale: Neno hili linaonyesha kuwadharau au kuwatendea wengine kwa hali ya kuwabeza.
- source_word: וָקָצֶף
  choice: na hasira
  rationale: קֶצֶף humaanisha hasira kali. “Hasira” ni ya kawaida, wazi, na inafaa katika muktadha huu wa mahusiano ya kijamii.
