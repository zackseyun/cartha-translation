  text: וְ/הַשְׁקוֹת֙ בִּ/כְלֵ֣י זָהָ֔ב וְ/כֵלִ֖ים מִ/כֵּלִ֣ים שׁוֹנִ֑ים וְ/יֵ֥ין מַלְכ֛וּת רָ֖ב כְּ/יַ֥ד הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/007.yaml
  text: Drinks were served in vessels of gold, with vessels differing from vessel to vessel, and royal wine in abundance, according to the king’s bounty.
translation:
  language: sw
  text: Vinywaji vilitolewa katika vyombo vya dhahabu, kila chombo kikiwa tofauti na kingine, na divai ya kifalme ilikuwa tele, kwa kadiri ya ukarimu wa mfalme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַשְׁקוֹת
  choice: Vinywaji vilitolewa
  rationale: Nomino ya kitendo kutoka mzizi שׁקה hapa inaeleza utoaji wa vinywaji katika karamu; kauli hii ni ya kawaida na wazi katika Kiswahili.
- source_word: בִּכְלֵי זָהָב
  choice: katika vyombo vya dhahabu
  rationale: Inahifadhi maana halisi ya vyombo vilivyotumiwa kutolea vinywaji.
- source_word: וְכֵלִים מִכֵּלִים שׁוֹנִים
  choice: kila chombo kikiwa tofauti na kingine
  rationale: Inawakilisha usemi wa Kiebrania unaosisitiza kuwa vyombo havikufanana, kwa Kiswahili cha asili bila kupoteza mgawanyo wa chombo kwa chombo.
- source_word: וְיֵין מַלְכוּת
  choice: na divai ya kifalme
  rationale: מַלְכוּת hapa huashiria divai ya mfalme au ya hadhi ya kifalme; tafsiri hii huhifadhi ufupi na uwezekano huo wa maana.
- source_word: רָב
  choice: ilikuwa tele
  rationale: Huonyesha wingi mkubwa wa divai kwa lugha ya kawaida na yenye hadhi.
- source_word: כְּיַד הַמֶּלֶךְ
  choice: kwa kadiri ya ukarimu wa mfalme
  rationale: Nahau ya Kiebrania ya 'kulingana na mkono wa mfalme' hapa hueleza ukubwa wa utoaji au ukarimu wake, si kiungo cha mwili.
theological_decisions: []
