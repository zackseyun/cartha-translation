base_translation:
  language: en
  yaml_path: translation/ot/esther/001/022.yaml
  text: And he sent letters to all the provinces of the king[a], to each province in its own script and to each people in its own language[d][c][b], that every man should be master in his own house and speak the language of his own people.
translation:
  language: sw
  text: Kisha akatuma barua kwa majimbo yote ya mfalme[a], kwa kila jimbo kwa maandishi yake, na kwa kila jamii kwa lugha yake[b], kwamba kila mwanamume[c] atawale nyumbani mwake na azungumze kwa lugha ya watu wake.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “majimbo yote ya mfalme.” Usemi huo unayataja majimbo yaliyo katika milki yake.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasisitiza kwamba barua zilipelekwa kwa kila jimbo kwa maandishi yake na kwa kila jamii kwa lugha yake.
    reason: cultural_note
  - marker: c
    text: Au, “kila mume.” Kiebrania kinasema “kila mwanamume,” lakini katika muktadha agizo linahusu mamlaka ya nyumbani katika ndoa.
    reason: lexical_alternative
  - marker: d
    text: Kiebrania cha kishazi hiki ni kigumu kidogo kisintaksia. Kwa kawaida hueleweka kwamba kila mwanamume alipaswa kuzungumza kwa lugha ya watu wake; uhusiano kamili wa sharti hili na agizo la kutawala nyumbani haujaelezwa wazi.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Kisha akatuma
  rationale: Kitenzi cha masimulizi kinaendeleza tukio kuu; “Kisha akatuma” ni Kiswahili cha kawaida kinachoonyesha mwendelezo bila kuongeza maelezo yasiyokuwamo.
- source_word: סְפָרִים
  choice: barua
  rationale: Katika muktadha huu wa utawala wa kifalme, neno hilo linamaanisha maandishi rasmi yaliyotumwa katika milki; “barua” ni wazi na ya kawaida.
- source_word: כָּל מְדִינוֹת הַמֶּלֶךְ
  choice: majimbo yote ya mfalme
  rationale: Muundo wa Kiebrania unaonyesha majimbo yaliyo chini ya milki ya mfalme. Tafsiri hii inabaki karibu na chanzo na ni ya asili katika Kiswahili.
- source_word: אֶל מְדִינָה וּמְדִינָה
  choice: kwa kila jimbo
  rationale: Kurudiwa kwa nomino ya umoja kuna maana ya ugawaji, yaani kila jimbo moja moja.
- source_word: כִּכְתָבָהּ
  choice: kwa mwandiko wake
  rationale: Hurejelea mfumo wa maandishi uliotumiwa katika kila jimbo. “Mwandiko” huhifadhi wazo la hati au mfumo wa kuandika bila kulifanya kuwa tafsiri ya lugha yenyewe.
- source_word: וְאֶל עַם וָעָם
  choice: na kwa kila jamii ya watu
  rationale: Kurudiwa huko ni kwa maana ya ugawaji. “Jamii ya watu” huepuka kuifanya עַם kuwa lazima taifa la kisiasa, kwa kuwa mkazo hapa ni utambulisho wa watu na lugha yao.
- source_word: כִּלְשׁוֹנוֹ
  choice: kwa lugha yake
  rationale: לָשׁוֹן hapa humaanisha lugha; kiwakilishi cha umoja kinaafikiana na kila jamii ya watu iliyotajwa.
- source_word: לִהְיוֹת כָּל אִישׁ שֹׂרֵר
  choice: kwamba kila mwanamume atawale
  rationale: Infinitivu inaeleza yaliyomo au kusudi la agizo, na participle שֹׂרֵר inaonyesha kutumia mamlaka. Kitenzi “atawale” ni cha moja kwa moja na cha kawaida kuliko nomino nzito ya cheo.
- source_word: בְּבֵיתוֹ
  choice: nyumbani mwake
  rationale: Kihusishi בְּ kinaonyesha eneo au nyanja ambamo utawala huo ungetumika; “nyumbani mwake” huhifadhi maana hiyo.
- source_word: וּמְדַבֵּר כִּלְשׁוֹן עַמּוֹ
  choice: na aseme lugha ya watu wake
  rationale: Participle ya pili inaendeleza yaliyomo katika agizo. Tafsiri ya moja kwa moja huhifadhi hali isiyo wazi ya uhusiano wa sharti hili na mamlaka ya nyumbani.
theological_decisions:
- issue: Je, כָּל אִישׁ inamaanisha kila mwanamume au kila mume?
  choice: kila mwanamume
  alternative: kila mume
  rationale: Maana ya msingi ya אִישׁ ni mwanamume, ingawa katika muktadha wa ndoa na nyumba inaweza kumaanisha mume. Matini kuu inadumisha upana wa neno la chanzo, huku tanbihi ikieleza maana inayowezekana katika muktadha.
- issue: Aina ya mamlaka inayodaiwa nyumbani
  choice: atawale nyumbani mwake
  alternative: awe na mamlaka juu ya nyumba yake
  rationale: שֹׂרֵר ina nguvu ya kutawala au kuwa na mamlaka. Tafsiri haipunguzi wala kuhalalisha dai la agizo, bali inawasilisha kwa uwazi kama sehemu ya simulizi la amri ya kifalme.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi ulio wazi, wa heshima na unaoeleweka. “Jamii ya watu” imetumiwa badala ya “taifa” ili kuepuka maana ya lazima ya dola ya kisasa. Alama za tanbihi zimewekwa mara tu baada ya maneno au vishazi vinavyofafanuliwa.
