source:
  edition: WLC
  text: בַּ/יּוֹם֙ הַ/שְּׁבִיעִ֔י כְּ/ט֥וֹב לֵב הַ/מֶּ֖לֶךְ בַּ/יָּ֑יִן אָמַ֡ר לִ֠/מְהוּמָן בִּזְּתָ֨א חַרְבוֹנָ֜א בִּגְתָ֤א וַ/אֲבַגְתָא֙ זֵתַ֣ר וְ/כַרְכַּ֔ס שִׁבְעַת֙ הַ/סָּ֣רִיסִ֔ים הַ/מְשָׁ֣רְתִ֔ים אֶת פְּנֵ֖י הַ/מֶּ֥לֶךְ אֲחַשְׁוֵרֽוֹשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/010.yaml
  text: On the seventh day[a], when the king’s heart was merry with wine, he told Mehuman, Biztha, Harbona, Bigtha, Abagtha, Zethar[b], and Karkas—the seven eunuchs who attended King Ahasuerus—
translation:
  language: sw
  text: Siku ya saba, moyo wa mfalme ulipofurahi kwa divai,[a] aliwaambia Mehumani, Biztha, Harbona, Bigtha, Abagtha, Zethari na Karkasi—wale matowashi saba[b] waliokuwa wakihudumu mbele ya Mfalme Ahasuero—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mfalme alipokuwa na furaha kwa sababu ya divai.” Nahau ya Kiebrania inasema kwamba moyo wa mfalme ulifurahi kwa divai, lakini haisemi wazi kwamba alikuwa amelewa.
    reason: lexical_alternative
  - marker: b
    text: Katika baadhi ya miktadha, neno linalotafsiriwa “matowashi” linaweza kumaanisha kwa upana zaidi maafisa wa ikulu; hapa maana yake ya moja kwa moja zaidi imetumiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Siku ya saba
  rationale: Hii ni kauli ya wakati. Tafsiri hii ni ya kawaida katika Kiswahili na haiongezi maneno yasiyokuwamo katika aya, kama vile “ya karamu.”
- source_word: כְּטוֹב לֵב הַמֶּלֶךְ בַּיָּיִן
  choice: moyo wa mfalme ulipofurahi kwa divai
  rationale: Inahifadhi taswira ya Kiebrania ya moyo kufurahi kwa sababu ya divai bila kudai wazi kwamba mfalme alikuwa amelewa.
- source_word: אָמַר לִ
  choice: aliwaambia
  rationale: Kitenzi cha kawaida ni “kusema,” na kihusishi kinataja walioambiwa. “Aliwaambia” ni Kiswahili cha asili na kinaacha yaliyosemwa yaendelee katika aya inayofuata.
- source_word: לִמְהוּמָן בִּזְּתָא חַרְבוֹנָא בִּגְתָא וַאֲבַגְתָא זֵתַר וְכַרְכַּס
  choice: Mehumani, Biztha, Harbona, Bigtha, Abagtha, Zethari na Karkasi
  rationale: Majina yametoholewa kwa maumbo yanayosomeka kwa urahisi katika Kiswahili huku yakibaki karibu na matamshi ya Kiebrania.
- source_word: שִׁבְעַת הַסָּרִיסִים
  choice: wale matowashi saba
  rationale: “Matowashi” ndilo maana ya moja kwa moja zaidi ya neno hili katika mazingira ya ikulu, ingawa katika baadhi ya miktadha neno hilo linaweza kumaanisha maafisa wa ikulu kwa upana zaidi.
- source_word: הַמְשָׁרְתִים אֶת פְּנֵי
  choice: waliokuwa wakihudumu mbele ya
  rationale: Tafsiri hii inadumisha nahau ya kuhudumu mbele ya uso wa mfalme, yaani kuwa wahudumu waliohudhuria katika uwepo wake.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Mfalme Ahasuero
  rationale: Cheo na jina vimewekwa katika mpangilio wa kawaida wa Kiswahili; “Ahasuero” ni umbo lililotoholewa na linalotambulika.
