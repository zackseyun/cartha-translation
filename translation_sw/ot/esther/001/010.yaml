translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umeachwa wazi kwa mwendelezo wa aya ya 11, kwa kuwa aya hii inaishia baada ya kuwatambulisha watumishi saba.
