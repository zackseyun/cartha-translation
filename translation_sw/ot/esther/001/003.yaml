base_translation:
  language: en
  yaml_path: translation/ot/esther/001/003.yaml
  text: In the third year of his reign[a], he gave a banquet for all his officials and servants—the army of Persia and Media, the nobles[c][b], and the officials of the provinces before him.
translation:
  language: sw
  text: Katika mwaka wa tatu wa utawala wake, aliwaandalia karamu[a] maafisa wake wote na watumishi wake—jeshi[b] la Uajemi na Umedi, wakuu[c], na maafisa wa majimbo—wakiwa mbele yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sherehe.” Neno la Kiebrania linaweza kumaanisha karamu iliyohusisha kunywa na kusherehekea.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza pia kumaanisha “nguvu za kijeshi.”
    reason: lexical_alternative
  - marker: c
    text: Neno hili la mkopo kutoka Kiajemi linamaanisha watu mashuhuri wa cheo cha juu.
    reason: lexical_clarification
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלוֹשׁ לְמָלְכוֹ
  choice: Katika mwaka wa tatu wa utawala wake
  rationale: Muundo huu unaonyesha mwaka wa tatu katika kipindi cha kutawala kwake, si mwaka wa kutawazwa kwake tu.
- source_word: עָשָׂה מִשְׁתֶּה
  choice: aliwaandalia karamu
  rationale: Kitenzi עשה pamoja na מִשְׁתֶּה kinaeleza kuandaa au kufanya karamu; ‘aliwaandalia karamu’ ni Kiswahili cha kawaida na kinaonyesha kuwa wageni ndio walioandaliwa.
- source_word: לְכָל שָׂרָיו וַעֲבָדָיו
  choice: maafisa wake wote na watumishi wake
  rationale: Katika muktadha wa ikulu, שׂרים ni wenye mamlaka au maafisa, na עבדים ni watumishi wa mfalme; tafsiri hii haidokezi bila msingi kwamba wote walikuwa watumwa.
- source_word: חֵיל פָּרַס וּמָדַי
  choice: jeshi la Uajemi na Umedi
  rationale: חֵיל inaweza kumaanisha nguvu au jeshi; katika orodha hii ya kifalme, ‘jeshi’ huhifadhi maana ya kijeshi kwa lugha iliyo wazi na ya kawaida.
- source_word: הַפַּרְתְּמִים
  choice: wakuu wenye vyeo vya juu
  rationale: Neno hili la mkopo kutoka Kiajemi linarejelea watu mashuhuri wa cheo cha juu; uchaguzi huu unaeleweka bila kulazimisha cheo mahususi kisichotajwa.
- source_word: וְשָׂרֵי הַמְּדִינוֹת
  choice: na maafisa wa majimbo
  rationale: שָׂרֵי hapa ni viongozi au maafisa wa maeneo ya utawala; ‘maafisa wa majimbo’ huepuka kuwafanya wote kuwa magavana bila ushahidi wa kutosha.
- source_word: לְפָנָיו
  choice: wakiwa mbele yake
  rationale: Kirai hicho kina maana ya kuwapo mbele ya mfalme; muundo huu wa Kiswahili unaweka wazi kuwa waliokusanyika walikuwa katika uwepo wake.
