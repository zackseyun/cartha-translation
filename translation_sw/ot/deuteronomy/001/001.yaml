  text: אֵ֣לֶּה הַ/דְּבָרִ֗ים אֲשֶׁ֨ר דִּבֶּ֤ר מֹשֶׁה֙ אֶל כָּל יִשְׂרָאֵ֔ל בְּ/עֵ֖בֶר הַ/יַּרְדֵּ֑ן בַּ/מִּדְבָּ֡ר בָּֽ/עֲרָבָה֩ מ֨וֹל ס֜וּף בֵּֽין פָּארָ֧ן וּ/בֵֽין תֹּ֛פֶל וְ/לָבָ֥ן וַ/חֲצֵרֹ֖ת וְ/דִ֥י זָהָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/001.yaml
  text: These are the words that Moses spoke to all Israel beyond the Jordan[a], in the wilderness, in the Arabah opposite Suph, between Paran, Tophel, Laban, Hazeroth[d][c][b], and Dizahab.
translation:
  language: sw
  text: Haya ndiyo maneno ambayo Musa aliwaambia Israeli wote ng’ambo ya Yordani[a], nyikani, katika Araba[b], mkabala na Sufu[c], kati ya Parani, Tofeli, Labani, Haserothi na Dizahabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upande mwingine wa Yordani.” Usemi wa Kiebrania unaweza kueleweka kutoka mitazamo tofauti ya kijiografia.
    reason: lexical_alternative
  - marker: b
    text: “Araba” ni neno la kijiografia linalotaja eneo la ufa au uwanda; pia linaweza kutafsiriwa “uwandani.”
    reason: cultural_note
  - marker: c
    text: Kiebrania ni “Sufu.” Wengine hulielewa kuwa jina la mahali, na wengine hulihusianisha na “Bahari ya Matete”; lakini neno “bahari” halipo hapa.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Haya ndiyo maneno
  rationale: Muundo huu unaendeleza nguvu ya utangulizi ya wingi אֵלֶּה na kutafsiri דְּבָרִים kama “maneno,” kwa kuwa muktadha unahusu hotuba ya Musa.
- source_word: אֲשֶׁר דִּבֶּר מֹשֶׁה אֶל כָּל יִשְׂרָאֵל
  choice: ambayo Musa aliwaambia Israeli wote
  rationale: Kitenzi דִּבֶּר pamoja na אֶל kinaonyesha kusema kwa watu fulani. “Aliwaambia” ni Kiswahili cha kawaida na chenye hadhi, huku “Israeli wote” kikihifadhi maana ya jamii nzima.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: ng’ambo ya Yordani
  rationale: “Ng’ambo ya” huhifadhi maana ya upande mwingine wa mto bila kulazimisha mtazamo maalumu wa kijiografia.
- source_word: בַּמִּדְבָּר
  choice: nyikani
  rationale: מִדְבָּר ni eneo lisilokaliwa sana, si lazima jangwa la mchanga; “nyikani” linafaa kwa mazingira haya ya kibiblia.
- source_word: בָּעֲרָבָה
  choice: katika Araba
  rationale: עֲרָבָה hapa linaweza kuwa jina la eneo la ufa au uwanda; kulihamisha kama “Araba” kunahifadhi thamani yake ya kijiografia.
- source_word: מוֹל סוּף
  choice: mkabala na Sufu
  rationale: מוֹל humaanisha “mbele ya” au “mkabala na.” סוּף limehifadhiwa kama jina la mahali kwa sababu neno “bahari” halipo katika Kiebrania hapa.
- source_word: בֵּין פָּארָן וּבֵין תֹּפֶל וְלָבָן וַחֲצֵרֹת וְדִי זָהָב
  choice: kati ya Parani, Tofeli, Labani, Haserothi na Dizahabu
  rationale: Orodha yenye koma na kiunganishi cha mwisho ni ya asili katika Kiswahili, na majina yote ya maeneo yamehifadhiwa.
