id: DEU.1.25
reference: Deuteronomy 1:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקְח֤וּ בְ/יָדָ/ם֙ מִ/פְּרִ֣י הָ/אָ֔רֶץ וַ/יּוֹרִ֖דוּ אֵלֵ֑י/נוּ וַ/יָּשִׁ֨בוּ אֹתָ֤/נוּ דָבָר֙ וַ/יֹּ֣אמְר֔וּ טוֹבָ֣ה הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/025.yaml
  text: And they took in their hands some of the fruit of the land and brought it down to us[a], and they brought us back word and said, “The land that Yahweh our God is giving to us is good.”
translation:
  language: sw
  text: Nao wakachukua mikononi mwao baadhi ya matunda ya nchi, wakayaleta chini kwetu, wakatuletea habari[a], wakasema, “Nchi ambayo Yahwe, Mungu wetu, anatupa ni nzuri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakaturudishia taarifa”; kihalisi, “wakaturudishia neno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: wakachukua
  rationale: Ni kitenzi cha kawaida cha masimulizi kinachoonyesha walichukua sampuli ya mazao.
- source_word: בְיָדָם
  choice: mikononi mwao
  rationale: Inahifadhi taswira halisi ya Kiebrania kwamba walibeba matunda hayo kwa mikono yao.
- source_word: מִפְּרִי הָאָרֶץ
  choice: baadhi ya matunda ya nchi
  rationale: 'Neno מִן lina maana ya sehemu hapa: walichukua sampuli, si matunda yote.'
- source_word: וַיּוֹרִדוּ אֵלֵינוּ
  choice: wakayaleta chini kwetu
  rationale: Inahifadhi maana ya kisababishi ya ירד, ‘kuleta chini,’ pamoja na mwelekeo wa safari.
- source_word: וַיָּשִׁבוּ אֹתָנוּ דָבָר
  choice: wakatuletea habari
  rationale: Ni Kiswahili cha kawaida kwa nahau inayomaanisha kurudisha taarifa, bila kulazimisha muundo usio wa kawaida wa Kiebrania.
- source_word: טוֹבָה הָאָרֶץ
  choice: Nchi ... ni nzuri
  rationale: ‘Nzuri’ linawasilisha tathmini pana na chanya ya nchi kwa lugha ya kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Inahifadhi jina la agano lililo katika matini ya Kiebrania, kwa tahajia ya kawaida ya Kiswahili.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya usemi huu.
- source_word: נֹתֵן לָנוּ
  choice: anatupa
  rationale: Wakati wa sasa unaonyesha tendo linaloendelea au lililo karibu la Mungu kuwapa nchi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini inatumia jina maalumu la Mungu; kulitamka ‘Yahwe’ kunalihifadhi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi umetumia vitenzi vya mfululizo vya ‘waka-’; taswira ya kubeba mikononi na kuleta chini imehifadhiwa, huku nahau ya kurudisha habari ikitafsiriwa kwa Kiswahili cha kawaida.
