id: DEU.1.15
reference: Deuteronomy 1:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וָ/אֶקַּ֞ח אֶת רָאשֵׁ֣י שִׁבְטֵי/כֶ֗ם אֲנָשִׁ֤ים חֲכָמִים֙ וִֽ/ידֻעִ֔ים וָ/אֶתֵּ֥ן אֹתָ֛/ם רָאשִׁ֖ים עֲלֵי/כֶ֑ם שָׂרֵ֨י אֲלָפִ֜ים וְ/שָׂרֵ֣י מֵא֗וֹת וְ/שָׂרֵ֤י חֲמִשִּׁים֙ וְ/שָׂרֵ֣י עֲשָׂרֹ֔ת וְ/שֹׁטְרִ֖ים לְ/שִׁבְטֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/015.yaml
  text: 'So I took the heads of your tribes[a], wise and knowledgeable men, and appointed them as heads over you: commanders of thousands, commanders of hundreds, commanders of fifties, commanders of tens, and officers for your tribes.'
translation:
  language: sw
  text: 'Basi nikawachukua wakuu wa makabila yenu—wanaume wenye hekima na maarifa[a]—nikawaweka kuwa wakuu juu yenu: wakuu wa maelfu, wakuu wa mamia, wakuu wa hamsini, wakuu wa makumi, na maafisa kwa ajili ya makabila yenu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanaume wanaojulikana.” Neno la Kiebrania linaweza kumaanisha watu wenye maarifa au watu wanaojulikana na kutambuliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Basi nikawachukua
  rationale: Muundo wa simulizi unaendeleza hatua inayofuata; “Basi” huonyesha mwendelezo huo kwa Kiswahili cha kawaida, huku “nikawachukua” ikihifadhi nafsi ya kwanza na tendo la לקח.
- source_word: רָאשֵׁי שִׁבְטֵיכֶם ... רָאשִׁים עֲלֵיכֶם
  choice: wakuu wa makabila yenu ... wakuu juu yenu
  rationale: “Wakuu” linaonyesha watu walio katika nafasi ya uongozi na pia linadumisha kurudiwa kwa רֹאשׁ katika sehemu zote mbili za mstari.
- source_word: אֲנָשִׁים
  choice: wanaume
  rationale: Neno la Kiebrania hapa linawataja wanaume waziwazi; tafsiri hailibadilishi kuwa neno lisiloonyesha jinsia.
- source_word: חֲכָמִים
  choice: wenye hekima
  rationale: Hekima inayokusudiwa ni hasa busara ya vitendo inayofaa kwa uongozi na kutoa hukumu.
- source_word: וִידֻעִים
  choice: na maarifa
  rationale: Katika muktadha wa kuchagua viongozi, neno hili linaweza kueleza watu wenye ujuzi au utambuzi. Kiswahili “wenye hekima na maarifa” ni cha asili, huku maana mbadala ya watu wanaojulikana ikihifadhiwa katika tanbihi.
- source_word: וָאֶתֵּן אֹתָם רָאשִׁים עֲלֵיכֶם
  choice: nikawaweka kuwa wakuu juu yenu
  rationale: נתן pamoja na kijalizo cha cheo huonyesha kuwaweka katika wadhifa. Kauli hii ni wazi na inahifadhi taswira ya kuwa “juu” ya watu katika mamlaka.
- source_word: שָׂרֵי
  choice: wakuu wa
  rationale: שַׂר ni mwenye mamlaka juu ya kikundi. “Wakuu” linafaa kwa mpangilio huu wa kijeshi na kiutawala bila kuufanya kuwa wa kijeshi tu kuliko Kiebrania kinavyolazimisha.
- source_word: אֲלָפִים ... מֵאוֹת ... חֲמִשִּׁים ... עֲשָׂרֹת
  choice: maelfu ... mamia ... hamsini ... makumi
  rationale: Tafsiri ya moja kwa moja inadumisha ngazi za vikundi vya utawala zilizo katika maandishi ya Kiebrania.
- source_word: וְשֹׁטְרִים
  choice: na maafisa
  rationale: שֹׁטֵר humaanisha maafisa wa chini wenye kazi za kiutawala au utekelezaji; “maafisa” ni pana, wazi, na haliongezi kazi maalumu isiyotajwa.
- source_word: לְשִׁבְטֵיכֶם
  choice: kwa ajili ya makabila yenu
  rationale: Kihusishi ל kinaonyesha kuwa maafisa hao walipewa majukumu yanayohusiana na makabila hayo; usemi huu ni wa kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Kurudiwa kwa “wakuu” kunahifadhi muundo wa Kiebrania na kuonyesha ngazi za uongozi bila kuamua bila lazima kwamba kila cheo kilikuwa cha kijeshi pekee.
