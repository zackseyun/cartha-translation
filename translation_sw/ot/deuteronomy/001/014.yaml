translation:
  language: sw
  text: Mkanijibu na kusema[a], “Jambo ulilosema ni jema kulifanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Pendekezo ulilosema ni jema kulitekeleza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנוּ
  choice: mkanijibu
  rationale: Kitenzi ענה katika muktadha huu ni kujibu. Kiambishi -ni- pia kinawakilisha אֹתִי, ‘mimi,’ kwa Kiswahili cha asili.
- source_word: אֹתִי
  choice: -ni- katika “mkanijibu”
  rationale: Kiwakilishi cha nafsi ya kwanza kama yambwa kinaonyeshwa kiasili kwa kiambishi cha yambwa -ni- ndani ya kitenzi.
- source_word: וַתֹּאמְרוּ
  choice: na kusema
  rationale: Neno אמר linatanguliza yaliyomo katika jibu. Kutafsiri kitenzi hiki pamoja na ‘mkanijibu’ kunahifadhi uratibu wa vitenzi viwili vya Kiebrania.
- source_word: טוֹב
  choice: ni jema
  rationale: טוֹב linatoa tathmini chanya ya jambo lililopendekezwa; ‘jema’ ni tafsiri ya moja kwa moja isiyoongeza ufafanuzi wa kimadhehebu.
- source_word: הַדָּבָר
  choice: Jambo
  rationale: דבר hapa linarejelea pendekezo lililotangulia. ‘Jambo’ linahifadhi upana wa neno hilo na ni la kawaida katika Kiswahili sanifu.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: ulilosema
  rationale: Muundo wa uhusiano unaunganisha jambo na maneno ya Musa yaliyotangulia; ‘ulilosema’ ni wa asili na mwaminifu kwa maana.
- source_word: לַעֲשׂוֹת
  choice: tulifanye
  rationale: Kitenzi-jina cha עשה kinaonyesha kutekeleza jambo lililopendekezwa. ‘Tulifanye’ huonyesha kwa kawaida kwamba wasemaji ndio watakaolitekeleza, bila kupanua maana.
