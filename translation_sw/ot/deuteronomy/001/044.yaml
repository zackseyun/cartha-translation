base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/044.yaml
  text: Then the Amorites who lived in that hill country came out to meet you and pursued you as bees do[b][a], and they struck you down in Seir as far as Hormah.
translation:
  language: sw
  text: Ndipo Waamori[a] waliokaa katika nchi ile ya milima[b] wakatoka kuwakabili, wakawafukuza kama nyuki wafanyavyo, wakawaponda katika Seiri mpaka Horma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwamori”—neno la Kiebrania liko katika umoja lakini limetumiwa kwa maana ya jamii yote ya Waamori; vitenzi vinavyofuata viko katika wingi.
    reason: lexical_alternative
  - marker: b
    text: Au, “mlima ule”; hapa “nchi ile ya milima” inaonyesha maana ya neno la Kiebrania inayorejelea eneo zima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: wakatoka
  rationale: Kitenzi hiki katika simulizi humaanisha kutoka; hapa Waamori wanatoka mahali walipokaa ili kuwakabili Waisraeli.
- source_word: הָאֱמֹרִי
  choice: Waamori
  rationale: Ingawa nomino ya Kiebrania iko katika umoja wa kimofolojia, imetumiwa kwa maana ya kundi, kama inavyoonyeshwa na vitenzi vya wingi vinavyoifuata.
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: waliokaa katika eneo lile la milima
  rationale: Kirai kinaeleza makazi yao. Katika muktadha huu הַר inaweza kutaja eneo la milima, si lazima mlima mmoja tu.
- source_word: לִקְרַאתְכֶם
  choice: kuwakabili
  rationale: Neno hili kimsingi ni kwenda kukutana na mtu; muktadha wa mapigano unaonyesha kukutana kwa uhasama, jambo linaloelezwa kwa kawaida na 'kuwakabili'.
- source_word: וַיִּרְדְּפוּ אֶתְכֶם
  choice: wakawafukuza
  rationale: רדף ni kitenzi cha kawaida cha kuwafuatilia au kuwafukuza watu, hasa vitani.
- source_word: כַּאֲשֶׁר תַּעֲשֶׂינָה הַדְּבֹרִים
  choice: kama nyuki wafanyavyo
  rationale: Hifadhi tashbihi hai ya chanzo bila kuongeza maelezo kuhusu namna nyuki wanavyofukuza.
- source_word: וַיַּכְּתוּ אֶתְכֶם
  choice: wakawaponda
  rationale: Katika muundo huu כתת huonyesha kupiga kwa nguvu na kuangamiza au kuvunja upinzani; 'wakawaponda' huhifadhi ukali wa kushindwa kwao.
- source_word: בְּשֵׂעִיר
  choice: huko Seiri
  rationale: Kiambishi ב kinaonyesha eneo ambamo kipigo kilitokea; 'huko Seiri' ni usemi wa kawaida wa Kiswahili katika simulizi.
- source_word: עַד חָרְמָה
  choice: mpaka Horma
  rationale: עד huonyesha mpaka wa kijiografia ambao kufukuzwa na kupigwa kulifikia.
theological_decisions: []
