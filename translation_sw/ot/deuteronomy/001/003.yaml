base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/003.yaml
  text: And it happened in the fortieth year[a], in the eleventh month, on the first day of the month[b], that Moses spoke to the sons of Israel according to all that Yahweh had commanded him to them.
translation:
  language: sw
  text: Ikawa katika mwaka wa arobaini, mwezi wa kumi na moja, siku ya kwanza ya mwezi huo, Musa akasema na wana wa Israeli[a] kulingana na yote ambayo Yahwe alikuwa amemwagiza awaambie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli.” Kiebrania kinasema “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Kwa ukaribu zaidi, Kiebrania husema, “yote ambayo Yahwe alimwamuru yeye kwao.” Muundo huo mfupi unaweza kumaanisha yale ambayo Yahwe alimwagiza Musa kwa ajili yao au kuhusu wao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni mwanzo wa kisimulizi unaoweka wakati wa tukio; “Ikawa” huhifadhi kazi hiyo kwa lugha fupi na yenye hadhi.
- source_word: בְּאַרְבָּעִים שָׁנָה
  choice: katika mwaka wa arobaini
  rationale: Muundo huu wa Kiebrania unaonyesha namba ya mwaka, si muda wa miaka arobaini.
- source_word: בְּעַשְׁתֵּי עָשָׂר חֹדֶשׁ
  choice: mwezi wa kumi na moja
  rationale: Namba ya Kiebrania inafanya kazi kama namba ya mpangilio katika tarehe.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: siku ya kwanza ya mwezi huo
  rationale: Hii ni fomula ya tarehe; “mwezi huo” huunganisha kwa kawaida na mwezi wa kumi na moja uliotajwa.
- source_word: דִּבֶּר
  choice: akasema na
  rationale: Huhifadhi maana pana ya kusema au kuzungumza bila kuifanya iwe tangazo rasmi zaidi kuliko chanzo.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: na wana wa Israeli
  rationale: Huhifadhi taswira ya kifamilia ya Kiebrania; tanbihi inatoa Kiswahili cha kawaida zaidi, “Waisraeli.”
- source_word: כְּכֹל אֲשֶׁר
  choice: kulingana na yote ambayo
  rationale: Neno “kulingana” huhifadhi wazo la kufuata kikamilifu maagizo yaliyotangulia.
- source_word: צִוָּה
  choice: alikuwa amemwagiza
  rationale: Wakati timilifu uliopita unaonyesha kwamba agizo la Yahwe lilitangulia kusema kwa Musa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina la Mungu lililoandikwa kwa herufi nne za Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: אֹתוֹ אֲלֵהֶם
  choice: amemwagiza awaambie
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya muundo uliofinyangwa wa Kiebrania, huku tanbihi ikihifadhi uwezekano wa kuuelewa kihalisi zaidi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina binafsi la agano; “Yahwe” hulihifadhi kama jina badala ya cheo.
- issue: Mhusika anayelengwa na agizo katika אֹתוֹ אֲלֵהֶם
  choice: Yahwe alimwagiza Musa awaambie Israeli
  alternative: Yahwe alimwagiza Musa kwa ajili yao au kuhusu wao
  rationale: Muktadha unaonyesha kwamba Musa alisema yale aliyoagizwa ayafikishe kwa Israeli, lakini tanbihi inakiri ufupisho na upana wa muundo wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Ikawa” huhifadhi mtindo wa kisimulizi bila kutumia lugha ya kizamani kupita kiasi; tarehe imetolewa kwa mpangilio wa kawaida wa Kiswahili.
