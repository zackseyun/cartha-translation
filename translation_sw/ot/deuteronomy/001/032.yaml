translation:
  language: sw
  text: Lakini katika jambo hili hamkumwamini BWANA, Mungu wenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hamkumtumaini BWANA, Mungu wenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/דָּבָר הַ/זֶּה
  choice: Lakini katika jambo hili
  rationale: דָּבָר hapa ni jambo lililosimuliwa, si neno lililotamkwa. וּ katika muktadha wa kukemea ina nguvu ndogo ya upinzani, hivyo “Lakini” ni ya asili na wazi.
- source_word: אֵינְ/כֶם מַאֲמִינִם
  choice: hamkumwamini
  rationale: Muundo hasi pamoja na participle ya Hiphil ya אמן unaonyesha msimamo wa kutokuamini au kutotumaini katika hali inayosimuliwa. Wakati uliopita unafaa simulizi la Musa, na kiambishi -mw- kinaonyesha kuwa BWANA ndiye anayelengwa.
- source_word: בַּ/יהוָה
  choice: BWANA
  rationale: Jina la agano יהוה limetafsiriwa kwa desturi kuwa “BWANA.” Preposisheni ב pamoja na אמן humtambulisha mtu anayeaminiwa au kutumainiwa; Kiswahili cha asili hutumia kiambishi cha yambwa katika “kumwamini.”
- source_word: אֱלֹהֵי/כֶם
  choice: Mungu wenu
  rationale: Muundo wa tegemezi wenye kiambishi cha nafsi ya pili wingi umetafsiriwa moja kwa moja, ukihifadhi uhusiano wa agano.
theological_decisions:
- issue: Maana ya אמן + ב inapomhusu BWANA
  choice: hamkumwamini BWANA, Mungu wenu
  alternative: hamkumtumaini BWANA, Mungu wenu
  rationale: Kitenzi kinaweza kueleza kuamini ukweli au ahadi ya BWANA na pia kumtegemea kwa imani. “Kumwamini” huhifadhi upana huo bila kulazimisha maana moja; “kumtumaini” limetolewa katika tanbihi kama tafsiri halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “BWANA” kwa herufi kubwa hutambulisha יהוה, na alama ya tanbihi imewekwa katika matini kuu.
