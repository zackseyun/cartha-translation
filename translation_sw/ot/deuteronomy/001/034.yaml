base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/034.yaml
  text: And Yahweh heard the sound of your words[a], and he was angry and swore, saying,
translation:
  language: sw
  text: 'Yahwe alisikia maneno yenu[a], akaghadhibika, akaapa akisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “sauti ya maneno yenu.”'
    reason: Msemo halisi wa Kiebrania umeelezwa kwa sababu tafsiri kuu imetumia Kiswahili cha kawaida zaidi.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi wa Kiswahili kama “Yahwe,” badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: וַיִּשְׁמַע
  choice: alisikia
  rationale: Katika mfululizo huu wa simulizi, שׁמע humaanisha moja kwa moja kusikia; “alisikiliza” lingeweza kudokeza kukubali au kutii.
- source_word: אֶת קוֹל דִּבְרֵיכֶם
  choice: maneno yenu
  rationale: Hii ni Kiswahili cha kawaida na fasaha kwa maana ya msemo wa Kiebrania “sauti ya maneno yenu”; umbo halisi limehifadhiwa katika tanbihi.
- source_word: וַיִּקְצֹף
  choice: akaghadhibika
  rationale: Kitenzi קצף huonyesha hasira kali; “akaghadhibika” ni neno lenye uzito unaofaa lakini linaloeleweka katika Kiswahili sanifu.
- source_word: וַיִּשָּׁבַע
  choice: akaapa
  rationale: Nifali ya שׁבע hapa humaanisha kuapa; yaliyomo katika kiapo yanafuata katika mstari unaofuata.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Neno hili linatanguliza usemi wa moja kwa moja, hivyo “akisema” linahifadhi muundo wa Kiebrania kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi kwa unukuzi wa kawaida wa Kiswahili bila kulibadilisha kuwa “BWANA.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfululizo wa vitenzi vyenye “aka-” umehifadhi mwendo wa simulizi la Kiebrania, na nukta mbili zinaonyesha kuwa kiapo chenyewe kinafuata.
