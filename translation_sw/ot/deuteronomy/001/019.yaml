source:
  edition: WLC
  text: וַ/נִּסַּ֣ע מֵ/חֹרֵ֗ב וַ/נֵּ֡לֶךְ אֵ֣ת כָּל הַ/מִּדְבָּ֣ר הַ/גָּדוֹל֩ וְ/הַ/נּוֹרָ֨א הַ/ה֜וּא אֲשֶׁ֣ר רְאִיתֶ֗ם דֶּ֚רֶךְ הַ֣ר הָֽ/אֱמֹרִ֔י כַּ/אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵ֖י/נוּ אֹתָ֑/נוּ וַ/נָּבֹ֕א עַ֖ד קָדֵ֥שׁ בַּרְנֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/019.yaml
  text: Then we set out from Horeb and went through all that great and fearsome wilderness that you saw on the way to the hill country of the Amorites[a], just as Yahweh our God commanded us, and we came as far as Kadesh-barnea.
translation:
  language: sw
  text: Kisha tuliondoka kutoka Horebu, tukapita katika jangwa lote lile kubwa na la kutisha[a] mliloliona, njiani kuelekea nchi ya vilima ya Waamori, kama vile Yahweh Mungu wetu alivyotuamuru; tukafika Kadeshi-barnea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kubwa na la kuogofya.” Kivumishi cha Kiebrania kinaweza kueleza kitu kinachoamsha hofu, kicho, au woga mkubwa.
    reason: Kuhifadhi upana wa maana ya נוֹרָא, ambayo inaweza kuonyesha hofu, kicho, au woga mkubwa.
lexical_decisions:
- source_word: וַנִּסַּע מֵחֹרֵב
  choice: tukaondoka Horebu
  rationale: Kitenzi נסע katika muktadha wa safari humaanisha kuvunja kambi na kuanza safari. ‘Tukaondoka’ ni usemi wa kawaida wa Kiswahili unaowasilisha hatua hiyo kwa ufupi.
- source_word: וַנֵּלֶךְ אֵת כָּל הַמִּדְבָּר
  choice: tukapita katika jangwa lile lote
  rationale: Muundo wa Kiebrania unaonyesha kulivuka au kulipitia eneo lote la jangwani. ‘Tukapita katika’ ni wa asili zaidi katika Kiswahili kuliko tafsiri ya neno kwa neno ya kiashiria cha yambwa אֵת.
- source_word: הַמִּדְבָּר הַגָּדוֹל וְהַנּוֹרָא הַהוּא
  choice: jangwa lile lote kubwa na la kutisha
  rationale: ‘Jangwa’ linafaa kwa מִדְבָּר katika simulizi la safari ya Israeli. גָּדוֹל ni ‘kubwa,’ na נוֹרָא hueleza kitu kinachotia hofu, hivyo ‘la kutisha’ huhifadhi uzito wake.
- source_word: אֲשֶׁר רְאִיתֶם
  choice: mliloliona
  rationale: Hii inatafsiri moja kwa moja kishazi rejeshi na kuhifadhi rejeo la Musa kwa jambo ambalo wasikilizaji walikuwa wameliona.
- source_word: דֶּרֶךְ הַר הָאֱמֹרִי
  choice: njiani kuelekea nchi ya vilima ya Waamori
  rationale: דֶּרֶךְ hapa huonyesha njia au mwelekeo, huku הַר ikimaanisha eneo la milima au vilima kwa ujumla, si lazima mlima mmoja.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: kama vile ... alivyotuamuru
  rationale: Usemi huu unaonyesha kwamba safari ilifanywa sawasawa na amri iliyotolewa; ‘kama vile’ huwasilisha ulinganifu huo kwa Kiswahili cha kawaida.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahwe Mungu wetu
  rationale: Jina binafsi la Mungu יהוה limetoholewa kama ‘Yahwe,’ na אֱלֹהֵינוּ limetafsiriwa moja kwa moja kuwa ‘Mungu wetu.’
- source_word: וַנָּבֹא עַד קָדֵשׁ בַּרְנֵעַ
  choice: tukafika Kadeshi-barnea
  rationale: הגיע עד katika muktadha huu hueleza kufika mahali. Jina la mahali limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la Mungu יהוה. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Mfuatano wa vitenzi ‘tukaondoka … tukapita … tukafika’ huhifadhi mwendo wa simulizi la Kiebrania. Alama ya tanbihi imewekwa baada ya ‘la kutisha,’ neno ambalo tanbihi inalifafanua.
