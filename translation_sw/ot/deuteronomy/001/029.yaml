lexical_decisions:
- source_word: תַעַרְצוּן
  choice: msiwaogope
  rationale: Kitenzi ערץ hapa kinaonyesha kutishwa au kuingiwa na hofu mbele ya watu hao; ‘msiwaogope’ ni Kiswahili cha kawaida na chenye nguvu katika muktadha huu.
- source_word: תִירְאוּן
  choice: msiwahofu
  rationale: Kitenzi ירא humaanisha kuogopa; ‘msiwahofu’ huhifadhi marudio ya kishairi huku kikitofautisha kidogo kauli hii na ile ya kwanza.
- source_word: מֵהֶם
  choice: -wa- katika ‘msiwaogope’ na ‘msiwahofu’
  rationale: Kihusishi na kiwakilishi vinarejelea watu waliotajwa; Kiswahili huonyesha uhusiano huo kwa kiambishi cha yambwa. Ingawa Kiebrania kina מֵהֶם mara moja baada ya vitenzi viwili, kukirudia kiidadi katika kila kitenzi ni kawaida na wazi kwa Kiswahili.
