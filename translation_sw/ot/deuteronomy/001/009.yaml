lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: Wakati huo
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kirai cha wakati.
- source_word: לֵאמֹר
  choice: haijatafsiriwa kwa neno tofauti
