- source_word: שְׂאֵת אֶתְכֶם
  choice: kuwabeba
  rationale: Inahifadhi sitiari ya Kiebrania ya kubeba watu, ambayo katika muktadha humaanisha kuchukua mzigo wa kuwaongoza na kuwahukumu, bila kuifafanua kupita kiasi.
- source_word: לְבַדִּי
  choice: peke yangu
  rationale: Hutoa mkazo wa asili kwamba Musa hakuweza kuubeba wajibu huo akiwa yeye tu.
