  text: בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן בְּ/אֶ֣רֶץ מוֹאָ֑ב הוֹאִ֣יל מֹשֶׁ֔ה בֵּאֵ֛ר אֶת הַ/תּוֹרָ֥ה הַ/זֹּ֖את לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/005.yaml
  text: 'Beyond the Jordan[a], in the land of Moab, Moses began to explain this law[b], saying:'
translation:
  language: sw
  text: 'Ng’ambo ya Yordani[a], katika nchi ya Moabu, Musa alianza kuifafanua sheria hii[b], akisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Upande wa pili wa Yordani.” Usemi wa Kiebrania hutegemea mahali anapotazama msemaji au mwandishi.
    reason: lexical_alternative
  - marker: b
    text: Au “mafundisho haya.” Neno la Kiebrania torah linaweza kumaanisha “sheria” au, kwa upana zaidi, “mafundisho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: Ng’ambo ya Yordani
  rationale: Kirai hiki huonyesha eneo lililo upande mwingine wa Yordani kulingana na mahali pa mtazamaji. “Ng’ambo ya Yordani” ni usemi wa kawaida wa Kiswahili na unahifadhi uhusiano huo wa kijiografia.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: katika nchi ya Moabu
  rationale: אֶרֶץ katika muktadha huu wa kijiografia na kisiasa humaanisha “nchi”; tafsiri hii ni wazi na ya kawaida.
- source_word: הוֹאִיל
  choice: alianza
  rationale: Katika muundo huu neno hilo huonyesha kuanza au kujitwika tendo linalofuata. “Alianza” ni la asili katika Kiswahili na linafaa kwa utangulizi wa ufafanuzi wa Musa.
- source_word: בֵּאֵר
  choice: kuifafanua
  rationale: Kitenzi hiki humaanisha kufanya jambo lieleweke wazi au kulieleza kwa upana. “Kuifafanua” kinawasilisha maana hiyo kwa lugha ya sasa yenye hadhi.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: sheria hii
  rationale: תּוֹרָה linaweza kumaanisha sheria au mafundisho. Katika muktadha wa agano na masharti yake, “sheria hii” inadumisha uzito wa kisheria huku maana pana ikiwekwa katika tanbihi.
- source_word: לֵאמֹר
  choice: 'akisema:'
  rationale: Hiki ni kiashiria cha kawaida kinachoanzisha maneno yanayofuata. “Akisema:” kinaunganisha kwa kawaida sentensi hii na hotuba inayofuata.
theological_decisions:
- issue: Tafsiri ya תּוֹרָה katika muktadha wa agano
  choice: sheria hii
  alternative: mafundisho haya
  rationale: “Sheria” huhifadhi nguvu ya kisheria na kiagano ya muktadha wa Kumbukumbu la Torati, lakini tanbihi inadumisha uwezekano halisi wa maana pana ya mafundisho bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, ya kawaida na yenye hadhi. Muundo “alianza kuifafanua” unaonyesha kwa ufasaha mfuatano wa vitenzi vya Kiebrania, na tanbihi zinahifadhi utata halisi wa mahali na maana ya torah.
