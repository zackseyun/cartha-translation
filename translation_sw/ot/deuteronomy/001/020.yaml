  yaml_path: translation/ot/deuteronomy/001/020.yaml
  text: And I said to you[a], “You have come to the hill country of the Amorites, which Yahweh our God is giving us.”
translation:
  language: sw
  text: Nami nikawaambia, “Mmefika katika nchi ya vilima ya Waamori[a], ambayo Yahweh Mungu wetu anatupa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlima wa Waamori.” Neno la Kiebrania linaweza kumaanisha eneo la vilima kwa ujumla au mlima mmoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר אֲלֵיכֶם
  choice: Nami nikawaambia
  rationale: Muundo huu unaendeleza mfululizo wa simulizi na unaonyesha wazi kwamba Musa aliwaambia watu wengi.
- source_word: בָּאתֶם עַד
  choice: Mmefika katika
  rationale: Kitenzi timilifu pamoja na עַד kinaonyesha kuwa walikuwa wamefikia mahali palipotajwa; Kiswahili hiki ni cha kawaida na huhifadhi umuhimu wa hali yao ya sasa.
- source_word: הַר הָאֱמֹרִי
  choice: nchi ya milima ya Waamori
  rationale: הַר hapa yaweza kutaja eneo la milima kwa upana, na jina la jamii likiwa la pamoja linarejelea Waamori. Uwezekano wa mlima mmoja umehifadhiwa katika tanbihi.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh Mungu wetu
  rationale: Jina la Mungu limeandikwa kwa unukuzi wa jina la Kiebrania, na kiambishi cha wingi nafsi ya kwanza katika אֱלֹהֵינוּ kimetafsiriwa ‘wetu.’
- source_word: נֹתֵן לָנוּ
  choice: anatupa
  rationale: Kitenzi kishirikishi נֹתֵן kinaonyesha tendo linaloendelea au lililo karibu kutimizwa; ‘anatupa’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko la Kiebrania linatumia jina maalumu la Mungu moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Nami nikawaambia’ linafaa kwa simulizi la hotuba, huku ‘anatupa’ likiwa la kawaida na wazi.
