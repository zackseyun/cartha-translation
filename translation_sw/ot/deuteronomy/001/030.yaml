base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/030.yaml
  text: Yahweh your God[a], who goes before you, will himself fight for you, just as he did for you in Egypt before your eyes.
translation:
  language: sw
  text: Yahwe, Mungu wenu, anayekwenda mbele yenu, yeye mwenyewe atawapigania, kama vile alivyotenda kwa ajili yenu[a] huko Misri mbele ya macho yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “alivyofanya pamoja nanyi.” Katika muktadha, maneno hayo yanarejelea mambo ambayo Yahwe aliwatendea Waisraeli kwa niaba yao huko Misri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa na cheo; tahajia “Yahwe” ni ya kawaida na inasomeka kwa urahisi katika Kiswahili.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Ingawa umbo la Kiebrania linaonekana kuwa la wingi, hapa linamtaja kwa umoja Mungu wa Israeli, likiwa na kiambishi cha nafsi ya pili wingi.
- source_word: הַהֹלֵךְ לִפְנֵיכֶם
  choice: anayekwenda mbele yenu
  rationale: Kauli ya kushiriki inaonyesha tendo linaloendelea la Yahwe kuwaongoza watu wake.
- source_word: הוּא
  choice: yeye mwenyewe
  rationale: 'Kiwakilishi huru kina mkazo: Yahwe binafsi ndiye atakayewapigania.'
- source_word: יִלָּחֵם לָכֶם
  choice: atawapigania
  rationale: Kitenzi hiki katika muktadha kina maana ya kupigana kwa niaba ya mtu; “atawapigania” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: כְּכֹל אֲשֶׁר
  choice: kama vile
  rationale: Kifungu kinaanzisha ulinganisho kati ya tendo lijalo la Mungu na matendo yake ya awali.
- source_word: עָשָׂה אִתְּכֶם
  choice: alivyotenda kwa ajili yenu
  rationale: Kiebrania halisi kinaweza kusemwa “alivyofanya pamoja nanyi,” lakini katika muktadha kinamaanisha matendo ya Mungu kwa niaba ya Israeli; tafsiri hii ni wazi na ya kawaida huku tanbihi ikihifadhi muundo wa asili.
- source_word: בְּמִצְרַיִם
  choice: huko Misri
  rationale: Hii ni tafsiri ya kawaida ya mahali, huku “huko” ikirejelea tukio la zamani lililotokea Misri.
- source_word: לְעֵינֵיכֶם
  choice: mbele ya macho yenu
  rationale: Nahau hii inasisitiza kwamba Waisraeli wenyewe walishuhudia matendo ya Mungu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ina jina binafsi la Mungu, hivyo limedumishwa badala ya kubadilishwa na cheo. “Yahwe” huakisi kwa karibu matamshi yanayokubaliwa kwa kawaida.
- issue: Maana ya עָשָׂה אִתְּכֶם
  choice: alivyotenda kwa ajili yenu
  alternative: alivyofanya pamoja nanyi
  rationale: Muundo wa Kiebrania una mvutano wa kileksika, lakini muktadha unarejelea matendo ya ukombozi ambayo Mungu alitenda kwa niaba ya Israeli. Tanbihi inadumisha usemi wa karibu zaidi na muundo wa asili bila kufanya mstari mkuu usikike usio wa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida; “yeye mwenyewe” huhifadhi mkazo wa Kiebrania, na “mbele ya macho yenu” huhifadhi nahau ya ushuhuda wa moja kwa moja.
