source:
  edition: WLC
  text: וּ/בַ/מִּדְבָּר֙ אֲשֶׁ֣ר רָאִ֔יתָ אֲשֶׁ֤ר נְשָׂאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כַּ/אֲשֶׁ֥ר יִשָּׂא אִ֖ישׁ אֶת בְּנ֑/וֹ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הֲלַכְתֶּ֔ם עַד בֹּאֲ/כֶ֖ם עַד הַ/מָּק֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/031.yaml
  text: and in the wilderness[a], where you saw that Yahweh your God carried you, just as a man carries his son[b], all along the way that you traveled until you came to this place.
translation:
  language: sw
  text: na nyikani[a], ambako uliona kwamba Yahwe Mungu wako alikubeba, kama vile mwanamume anavyombeba mwanawe[b], katika njia yote mliyosafiri mpaka mlipofika mahali hapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jangwani.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “kama vile mwanamume anavyombeba mwanawe”; tafsiri nyingine husema kwa ujumla zaidi, “kama mtu anavyombeba mtoto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמִּדְבָּר
  choice: na kule nyikani
  rationale: מִדְבָּר ni eneo la nyika au jangwa. “Nyikani” ni neno la kawaida na lenye hadhi katika simulizi la safari ya Israeli, huku “kule” likiunganisha kifungu hiki kwa kawaida na muktadha uliotangulia.
- source_word: אֲשֶׁר רָאִיתָ
  choice: ambako uliona kwamba
  rationale: Muundo huu unaunganisha mahali pa jangwani na jambo ambalo msikilizaji mmoja alishuhudia; “kwamba” huhifadhi uhusiano wa moja kwa moja wa kishazi bila kuufasiri kuwa namna pekee.
- source_word: נְשָׂאֲךָ
  choice: alikubeba
  rationale: נשא hapa ni “kubeba,” maana inayothibitishwa na tashbihi inayofuata ya mtu anayembeba mwanawe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Hili ni tamko la moja kwa moja la uhusiano wa agano, likiwa na kiambishi cha nafsi ya pili umoja.
- source_word: כַּאֲשֶׁר יִשָּׂא אִישׁ אֶת־בְּנוֹ
  choice: kama vile mwanamume anavyombeba mwanawe
  rationale: Tafsiri inahifadhi taswira ya kiume ya אִישׁ na uhusiano wa mwana katika בְּנוֹ bila kuimarisha neno “mwanamume” kuwa “baba,” ingawa uhusiano huo unaeleweka kutokana na “mwanawe.”
- source_word: בְּכָל־הַדֶּרֶךְ
  choice: katika njia yote
  rationale: Kifungu kinaonyesha kwamba kubebwa kulidumu katika safari nzima.
- source_word: אֲשֶׁר הֲלַכְתֶּם
  choice: mliyosafiri
  rationale: הלך hapa hueleza mwendo wa jumuiya katika safari ya jangwani; “kusafiri” ni Kiswahili cha kawaida kinachofikisha maana hiyo.
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: mpaka mlipofika mahali hapa
  rationale: Muundo wa Kiebrania unaonyesha kikomo cha safari na unadumisha nafsi ya pili wingi ya jumuiya.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Taswira ya kijinsia katika tashbihi
  choice: mwanamume anavyombeba mwanawe
  alternative: mtu anavyombeba mtoto wake; baba anavyombeba mwanawe
  rationale: Kiebrania kina אִישׁ, “mwanamume,” na בְּנוֹ, “mwanawe.” Tafsiri iliyochaguliwa haifanyi taswira kuwa isiyo na jinsia wala kuimarisha אִישׁ moja kwa moja kuwa “baba.”
- issue: Mabadiliko ya idadi ya wasikilizaji
  choice: uliona/aliku­beba kwa umoja, kisha mliyosafiri/mlipofika kwa wingi
  alternative: kutumia wingi katika sentensi yote
  rationale: Kiebrania hubadilika kwa makusudi kutoka nafsi ya pili umoja, inayoiangalia Israeli kama mmoja, kwenda wingi, inayowatazama watu kama jumuiya; tofauti hiyo imehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mwendelezo wake na mstari uliotangulia kwa kuanza na “na.” Tofauti ya umoja na wingi katika viambishi vya nafsi imehifadhiwa kulingana na Kiebrania.
