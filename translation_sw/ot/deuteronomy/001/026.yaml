  text: But you were not willing to go up[a], and you rebelled against the command of Yahweh your God.
translation:
  language: sw
  text: Lakini hamkutaka kupanda, mkaiasi amri[a] ya Yahweh Mungu wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maneno halisi, Kiebrania kinasema, “kinywa cha Yahweh Mungu wenu”; hii ni nahau yenye maana ya kupinga au kukaidi amri yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אֲבִיתֶם
  choice: Lakini hamkuwa tayari
  rationale: Muundo hasi wa אבה unaonyesha kutotaka au kutokuwa tayari kwa hiari; “hamkuwa tayari” huhifadhi maana hiyo, huku “Lakini” ikionyesha utofauti na wito uliotangulia.
- source_word: לַעֲלֹת
  choice: kupanda
  rationale: עלה hapa ina maana ya kwenda juu kuelekea nchi; “kupanda” ni Kiswahili cha kawaida kinachohifadhi mwelekeo huo.
- source_word: וַתַּמְרוּ
  choice: mkaiasi
  rationale: מרה huonyesha uasi au ukaidi dhidi ya mamlaka; “mkaiasi” ni wazi na huunganisha tendo hili kwa kawaida na kukataa kupanda.
- source_word: אֶת־פִּי
  choice: amri
  rationale: Kwa neno ni “kinywa,” lakini katika nahau hii humaanisha agizo lililotamkwa; “amri” huwasilisha maana ya nahau bila kupoteza mamlaka ya msemaji.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetoholewa kuwa “Yahweh” badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Kiambishi cha nafsi ya pili wingi na muktadha wa Yahweh vinadai maana ya umoja, “Mungu wenu.”
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la Mungu la herufi nne; “Yahweh” huhifadhi jina hilo la agano badala ya kuliweka kama cheo.
- issue: Nahau אֶת־פִּי יהוה
  choice: amri ya Yahweh
  alternative: kinywa cha Yahweh
  rationale: Tafsiri ya maana ya nahau ni ya kawaida na inayoeleweka katika Kiswahili; tanbihi huhifadhi umbo halisi la Kiebrania na uhusiano wake na usemi wa Mungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na ya moja kwa moja; “hamkuwa tayari” huhifadhi msisitizo wa hiari, na “mkaiasi” huendeleza simulizi kwa ufasaha.
