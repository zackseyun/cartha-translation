base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/035.yaml
  text: Not one man among these men of this evil generation shall see the good land that I swore to give to your fathers—[a]
translation:
  language: sw
  text: Hakuna hata mtu mmoja miongoni mwa wanaume hawa wa kizazi hiki kiovu atakayeiona nchi nzuri niliyoapa kuwapa baba zenu—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “mababu zenu.” Kiebrania: “baba zenu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Hakuna hata ... atakaye-
  rationale: Hapa אִם ni sehemu ya kauli ya kiapo yenye ukanushaji mkali, si sharti la kawaida. Muundo huu wa Kiswahili unaonyesha kwamba hakuna hata mmoja atakayeruhusiwa kuiona nchi.
- source_word: יִרְאֶה
  choice: atakayeiona
  rationale: ראה kwa kawaida humaanisha ‘kuona.’ Katika hukumu hii, neno hilo linaonyesha kutofika wala kushiriki katika nchi, huku tafsiri ikibaki karibu na taswira ya Kiebrania.
- source_word: אִישׁ בָּאֲנָשִׁים הָאֵלֶּה
  choice: hata mtu mmoja miongoni mwa watu hawa
  rationale: 'Umoja אִישׁ una maana ya kila mmoja peke yake chini ya ukanushaji, na בָּאֲנָשִׁים ni ya sehemu: mmoja miongoni mwa kundi hilo.'
- source_word: הַדּוֹר הָרָע הַזֶּה
  choice: wa kizazi hiki kiovu
  rationale: דור ni ‘kizazi,’ na רע hapa ina uzito wa kimaadili, kwa hiyo ‘kiovu’ inafaa kuliko ‘kibaya.’ Kihusishi ‘wa’ kinaunganisha watu hao na kizazi kinachoelezwa.
- source_word: אֶת הָאָרֶץ הַטּוֹבָה
  choice: nchi nzuri
  rationale: Hii ni tafsiri ya moja kwa moja inayoonyesha uzuri na kufaa kwa nchi bila kuongeza maelezo yasiyokuwapo katika chanzo.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי לָתֵת
  choice: niliyoapa kuwapa
  rationale: נשבע ni kuapa, na נתן ni kutoa/kupa. Muundo huu wa Kiswahili ni wa kawaida na huhifadhi uzito wa ahadi ya kiapo.
- source_word: לַאֲבֹתֵיכֶם
  choice: baba zenu
  rationale: Kiebrania kinasema wazi ‘baba zenu.’ Hapa linawahusu mababu wa Israeli; maana pana zaidi imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya לַאֲבֹתֵיכֶם
  choice: baba zenu
  alternative: mababu zenu
  rationale: Neno la Kiebrania ni wingi wa kiume, ‘baba.’ Tafsiri kuu inalihifadhi, huku tanbihi ikieleza maana yake pana ya mababu wa Israeli bila kubadili kimya kimya maelezo ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Hakuna hata mtu mmoja’ huhifadhi msisitizo wa kauli ya kiapo; ‘atakayeiona’ huhifadhi lugha halisi ya kuona bila kufafanua kupita kiasi kuwa ni kuingia au kumiliki.
