base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/042.yaml
  text: 'And Yahweh said to me[a], ‘Tell them: Do not go up or fight, for I am not among you[b], lest you be struck down before your enemies.’'
translation:
  language: sw
  text: 'Yahwe akaniambia, “Waambie: ‘Msipande wala msipigane, kwa maana mimi simo miongoni mwenu,[a] msije mkashindwa mbele ya adui zenu.’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “katikati yenu.”
    reason: lexical_alternative
  - marker: b
    text: Au “msije mkapigwa na adui zenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina la agano lililo katika maandishi ya Kiebrania kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: וַיֹּאמֶר ... אֵלַי
  choice: akaniambia
  rationale: Muundo huu wa Kiswahili unaunganisha kwa kawaida kitenzi cha kusema na mpokeaji wa maneno bila kubadili maana.
- source_word: אֱמֹר לָהֶם
  choice: Waambie
  rationale: Ni amri ya kawaida na ya moja kwa moja inayowasilisha ‘sema kwao’ kwa Kiswahili cha sasa.
- source_word: לֹא תַעֲלוּ
  choice: Msipande
  rationale: Kitenzi עלה kina maana ya kupanda au kwenda juu; ‘msipande’ kinafaa katika muktadha wa kusonga kuelekea eneo la milimani.
- source_word: וְלֹא תִלָּחֲמוּ
  choice: wala msipigane
  rationale: ‘Kupigana’ ni tafsiri ya kawaida ya לחם katika muktadha wa vita; ‘wala’ huunganisha makatazo mawili kwa ufasaha.
- source_word: כִּי אֵינֶנִּי בְּקִרְבְּכֶם
  choice: kwa maana mimi simo miongoni mwenu
  rationale: Inahifadhi sababu iliyotolewa na Yahwe na maana ya kutokuwapo kwake katikati ya watu.
- source_word: וְלֹא תִּנָּגְפוּ
  choice: msije mkashindwa
  rationale: Katika muktadha, kishazi hiki kinaonya kuhusu matokeo ya kutotii. Muundo ‘msije’ huepuka maana potovu kwamba hawatashindwa.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: mbele ya adui zenu
  rationale: Inahifadhi nahau ya Kiebrania kuhusu kushindwa mbele ya maadui, huku ikiwa wazi katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la Mungu la herufi nne; ‘Yahwe’ hulitunza kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya kishazi וְלֹא תִּנָּגְפוּ
  choice: 'Onyo la matokeo: ‘msije mkashindwa’'
  alternative: ‘nanyi hamtashindwa’ au ‘msije mkapigwa’
  rationale: Muktadha unaonyesha kuwa kutokuwapo kwa Yahwe kutaleta kushindwa wakipanda kupigana. Tafsiri ya wakati ujao hasi ingedokeza ulinzi na kugeuza maana ya onyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Simo’ ni muundo wa kawaida wa ukanushi wa mahali kwa nafsi ya kwanza. Alama za nukuu zinaonyesha kwamba Musa anasimulia maneno ya Yahwe, ambayo ndani yake kuna ujumbe wa kuwaambia watu.
