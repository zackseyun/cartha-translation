  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/תָּשֻׁ֥בוּ וַ/תִּבְכּ֖וּ לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹֽא שָׁמַ֤ע יְהוָה֙ בְּ/קֹ֣לְ/כֶ֔ם וְ/לֹ֥א הֶאֱזִ֖ין אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/045.yaml
  text: Then you returned and wept before Yahweh[a], but Yahweh did not listen to your voice or pay attention to you.
translation:
  language: sw
  text: Ndipo mkarudi na kulia mbele za Yahwe, lakini Yahwe hakuisikiliza sauti yenu wala kuwategea sikio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakuisikia sauti yenu wala kuwasikiliza.” Kiebrania kinatumia vitenzi viwili vya maana zinazokaribiana vya kusikia au kusikiliza, vikisisitiza kwamba Yahwe hakuitikia kilio chao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: Ndipo mkarudi
  rationale: Kitenzi שׁוּב humaanisha kurudi au kugeuka kurudi. Katika mfululizo huu wa simulizi, “mkarudi” huonyesha kurudi kwao baada ya shambulio lililoshindwa, na “ndipo” huakisi mwendelezo wa simulizi.
- source_word: וַתִּבְכּוּ
  choice: na kulia
  rationale: בכה humaanisha kulia au kutoa machozi. “Kulia” ni Kiswahili cha kawaida chenye uzito unaofaa bila kuongeza kiwango cha huzuni ambacho hakikutajwa wazi.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: לִפְנֵי humaanisha “mbele ya” au “katika uwepo wa.” Usemi “mbele za Yahwe” ni wa kawaida na huhifadhi wazo la kuwa katika uwepo wake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: וְלֹא שָׁמַע יְהוָה בְּקֹלְכֶם
  choice: lakini Yahwe hakuisikiliza sauti yenu
  rationale: שׁמע pamoja na בְּקוֹל huweza kumaanisha kuisikia, kuisikiliza, au kuitii sauti. “Hakuisikiliza sauti yenu” huhifadhi taswira ya Kiebrania na hapa hudokeza kwamba hakuitikia kilio chao.
- source_word: וְלֹא הֶאֱזִין אֲלֵיכֶם
  choice: wala kuwategea sikio
  rationale: האזין humaanisha kutega sikio au kusikiliza kwa makini. “Kuwategea sikio” huhifadhi ulinganifu wa karibu wa vitenzi viwili vya kusikia bila kuvifanya viwe sawa kabisa.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia moja kwa moja jina la agano יהוה. “Yahwe” huhifadhi jina hilo badala ya kuweka cheo mahali pake.
- issue: Maana ya Yahwe kutosikia
  choice: hakuisikiliza sauti yenu wala kuwategea sikio
  alternative: hakuwaitikia
  rationale: Tafsiri huhifadhi vitenzi viwili vya Kiebrania vinavyohusiana na kusikia na kusikiliza. Ingawa muktadha unadokeza kutokuitikia, haibadilishi usemi huo kuwa hitimisho la kitafsiri pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi ni rahisi kueleweka, huku ulinganifu wa Kiebrania katika vifungu viwili vya kusikia ukihifadhiwa.
