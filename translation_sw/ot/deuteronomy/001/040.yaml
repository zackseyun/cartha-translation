lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Lakini ninyi
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha utofautishaji na msisitizo baada ya hukumu iliyotangulia.
- source_word: פְּנוּ לָכֶם
  choice: geukeni
  rationale: Amri hii inataka wabadili mwelekeo; katika Kiswahili, umbo la amri la wingi tayari linawaelekeza wahusika wenyewe, hivyo tafsiri ya ziada ya לָכֶם ingekuwa nzito na isiyo ya kawaida.
- source_word: וּ/סְעוּ
  choice: kisha mwondoke
  rationale: Kitenzi נסע hapa kina maana ya kuanza safari au kuondoka; “mwondoke” ni Kiswahili cha kawaida, huku “kisha” ikiweka wazi mwendelezo wa amri.
- source_word: הַמִּדְבָּרָה
  choice: kuelekea nyikani
  rationale: Herufi ya mwelekeo inaonyesha mwendo kuelekea nyikani bila kulazimisha maana ya kuwa tayari wameingia ndani yake.
- source_word: דֶּרֶךְ
  choice: kwa njia ya
  rationale: Neno hili linaonyesha njia au mkondo wa safari.
- source_word: יַם סוּף
  choice: Bahari ya Shamu
  rationale: Hili ni jina la kijiografia lililozoeleka katika Kiswahili cha Biblia; maana ya karibu zaidi na muundo wa Kiebrania imehifadhiwa katika tanbihi.
