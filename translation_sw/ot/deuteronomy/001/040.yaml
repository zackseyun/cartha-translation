  text: But as for you[a], turn yourselves around and set out for the wilderness by the way of the Red Sea.
translation:
  language: sw
  text: Lakini ninyi, geukeni na ondokeni kuelekea nyikani kwa njia ya Bahari ya Shamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana ya karibu zaidi ya Kiebrania, “Bahari ya Matete.”
