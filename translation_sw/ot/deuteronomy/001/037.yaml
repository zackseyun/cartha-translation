translation:
  language: sw
  text: Yahwe pia alinikasirikia kwa sababu yenu[a], akisema[b], “Wewe pia hutaingia huko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe pia alinighadhibikia kwa sababu yenu.”
    reason: lexical_alternative
  - marker: b
    text: Linganisha Hesabu 20:12, ambapo Musa kuzuiwa kuingia katika nchi kunahusianishwa na kosa lake mwenyewe huko Meriba; hapa Kumbukumbu la Torati linakazia nafasi ya watu katika jambo hilo.
    reason: cross_reference
lexical_decisions:
- source_word: גַּם
  choice: pia
  rationale: Chembe hii huonyesha nyongeza au mkazo. “Pia” linafaa katika sehemu zote mbili na kuhifadhi wazo la kwamba Musa naye alihusishwa.
- source_word: בִּי
  choice: alinikasirikia
  rationale: Pamoja na kitenzi הִתְאַנַּף, kihusishi ב huonyesha mtu ambaye hasira inamwelekea. Kiswahili cha kitenzi “kumkasirikia” huwasilisha maana hiyo kwa kawaida.
- source_word: הִתְאַנַּף
  choice: alinikasirikia
  rationale: Kitenzi hiki humaanisha kuwa au kuwaka hasira. “Alinikasirikia” ni cha asili, wazi, na kina uzito unaofaa bila kutia chumvi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: בִּגְלַלְכֶם
  choice: kwa sababu yenu
  rationale: Kirai hiki kinaonyesha sababu au chanzo cha jambo. “Kwa sababu yenu” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Kis infinitivu hiki hutanguliza yaliyosemwa. “Akisema” ni njia ya kawaida ya kuunganisha kauli hiyo na sentensi iliyotangulia.
- source_word: אַתָּה
  choice: wewe
  rationale: Kiwakilishi hiki ni nafsi ya pili, umoja, kikimrejelea Musa. Kutaja “wewe” wazi kunahifadhi mkazo wa Kiebrania.
- source_word: לֹא תָבֹא
  choice: hutaingia
  rationale: Katika muktadha huu בוא hurejelea kuingia katika nchi inayozungumziwa. “Hutaingia” ni wazi na ya kawaida kuliko tafsiri halisi ya “hutakuja.”
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki kinaelekeza kwenye nchi iliyotajwa katika muktadha. “Huko” huhifadhi rejeo hilo la mahali.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina יהוה moja kwa moja. “Yahwe” huhifadhi jina hilo la agano badala ya kulibadilisha na cheo.
- issue: Sababu ya Musa kuzuiwa kuingia nchini
  choice: Mstari unasema Yahwe alimkasirikia Musa kwa sababu ya watu, bila kusuluhisha hapa uhusiano wa kauli hiyo na kosa la Musa mwenyewe.
  alternative: Kuwalaumu watu peke yao, au kuingiza moja kwa moja maelezo ya Hesabu 20 katika matini kuu.
  rationale: Tafsiri inafuata msisitizo wa Kumbukumbu la Torati 1:37 na kuhifadhi mvutano wake na Hesabu 20:12 badala ya kuutatua kimyakimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili kwa msomaji wa kawaida, huku marudio ya “pia” yakihifadhi nguvu ya גַּם katika sehemu zote mbili.
