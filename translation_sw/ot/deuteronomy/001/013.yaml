base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/013.yaml
  text: Choose for yourselves wise[a], discerning, and well-known men from your tribes[b], and I will appoint them as your heads.
translation:
  language: sw
  text: Jichagulieni wanaume wenye hekima, wenye ufahamu, na wanaojulikana[a] kwa makabila yenu, nami nitawaweka kuwa wakuu[b] wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanaotambuliwa”; Kiebrania kinaweza kusisitiza wanaume wanaojulikana na wenye sifa iliyotambuliwa na makabila yao.
    reason: lexical_alternative
  - marker: b
    text: Au, “viongozi.” Kihalisi, “vichwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ לָכֶם
  choice: Jichagulieni
  rationale: Amri hii katika muktadha inawataka watu wawateue wanaume kwa ajili yao wenyewe; ‘Jichagulieni’ huunganisha kwa Kiswahili asili tendo la kuchagua na maana ya לָכֶם.
- source_word: אֲנָשִׁים
  choice: wanaume
  rationale: Nomino hii ni wingi wa kiume na hapa inawahusu wanaume watakaowekwa katika uongozi wa makabila.
- source_word: חֲכָמִים
  choice: wenye hekima
  rationale: Katika muktadha wa kuchagua viongozi na waamuzi, neno hili linaonyesha hekima na uamuzi mzuri, si ustadi wa kiufundi tu.
- source_word: וּנְבֹנִים
  choice: wenye ufahamu
  rationale: Neno kutoka mzizi בין linaonyesha uwezo wa kuelewa na kupambanua mambo; ‘wenye ufahamu’ ni Kiswahili cha kawaida na chenye heshima.
- source_word: וִידֻעִים
  choice: wanaojulikana
  rationale: Umbo hili la kutendwa kutoka ידע linaelekea kumaanisha watu wanaojulikana au kutambuliwa na jamii, yaani wenye sifa iliyothibitishwa.
- source_word: לְשִׁבְטֵיכֶם
  choice: miongoni mwa makabila yenu
  rationale: Katika muundo huu, kirai kinaunganika kwa kawaida na watu wanaojulikana katika makabila yao, huku pia kikidokeza mazingira ambamo uchaguzi unafanywa.
- source_word: וַאֲשִׂימֵם
  choice: nami nitawaweka
  rationale: Katika hotuba hii tendo la Musa linafuata uchaguzi wa watu; ‘nitawaweka’ huhifadhi kitenzi cha kawaida cha Kiebrania bila kupoteza maana ya uteuzi rasmi.
- source_word: בְּרָאשֵׁיכֶם
  choice: wawe wakuu wenu
  rationale: ראשׁ imetumiwa kwa maana ya uongozi. ‘Wakuu’ huhifadhi kwa kiasi kikubwa taswira ya ‘vichwa’ huku ikiwa ya kawaida na wazi katika Kiswahili.
theological_decisions:
- issue: Neno la kiume אֲנָשִׁים katika uteuzi wa viongozi
  choice: wanaume
  alternative: watu
  rationale: Kiebrania kinatumia nomino ya wingi wa kiume katika muktadha wa viongozi wa makabila; tafsiri haibadilishi umahususi huo kuwa lugha isiyoonyesha jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Urudiaji wa ‘wenye’ huweka sifa tatu wazi, na ‘wakuu’ huepuka taswira isiyo ya kawaida ya kuwaita viongozi ‘vichwa’ moja kwa moja.
