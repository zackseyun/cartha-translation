  text: וַֽ/תַּעֲנ֣וּ וַ/תֹּאמְר֣וּ אֵלַ֗/י חָטָאנוּ֮ לַֽ/יהוָה֒ אֲנַ֤חְנוּ נַעֲלֶה֙ וְ/נִלְחַ֔מְנוּ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/נוּ יְהוָ֣ה אֱלֹהֵ֑י/נוּ וַֽ/תַּחְגְּר֗וּ אִ֚ישׁ אֶת כְּלֵ֣י מִלְחַמְתּ֔/וֹ וַ/תָּהִ֖ינוּ לַ/עֲלֹ֥ת הָ/הָֽרָ/ה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/041.yaml
  text: Then you answered and said to me[a], ‘We have sinned against Yahweh. We ourselves will go up and fight, according to all that Yahweh our God commanded us.’ Then each man strapped on his weapons of war[b], and you presumptuously set out to go up into the hill country.
translation:
  language: sw
  text: Ndipo mkajibu na kuniambia, “Tumetenda dhambi dhidi ya Yahweh. Sisi wenyewe tutapanda na kupigana, kulingana na yote ambayo Yahweh Mungu wetu alituamuru.” Kisha kila mtu akajifunga silaha zake za vita, nanyi mkathubutu kupanda kwa kujitumainia kupita kiasi[a] kuelekea nchi ya vilima[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkafanya kwa pupa.” Kitenzi cha Kiebrania ni adimu na kinaonyesha tendo la kujitumainia kupita kiasi au la pupa.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “mlima.” Katika muktadha huu huenda neno hilo linamaanisha kwa upana zaidi nchi ya vilima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנוּ וַתֹּאמְרוּ אֵלַי
  choice: Ndipo mkajibu, mkaniambia
  rationale: Muundo huu unahifadhi vitenzi viwili vya Kiebrania—kujibu na kusema—kwa Kiswahili cha kawaida katika simulizi.
- source_word: חָטָאנוּ לַיהוָה
  choice: Tumemtenda Yahweh dhambi
  rationale: Kitenzi חטא pamoja na ל kinamtaja aliyekosewa; usemi huu wa Kiswahili unaonyesha kwamba dhambi hiyo ilitendwa dhidi ya Yahweh.
- source_word: נַעֲלֶה וְנִלְחַמְנוּ
  choice: tutapanda na kupigana
  rationale: ‘Tutapanda’ huhifadhi wazo la kuelekea juu, na ‘kupigana’ ni tafsiri ya kawaida ya kuingia vitani.
- source_word: כְּכֹל אֲשֶׁר צִוָּנוּ
  choice: kulingana na yote ambayo ... alituamuru
  rationale: Tafsiri hii huhifadhi maana ya kutenda sawasawa na amri yote, bila kupunguza wazo la ukamilifu wake.
- source_word: וַתַּחְגְּרוּ אִישׁ אֶת כְּלֵי מִלְחַמְתּוֹ
  choice: Kisha kila mtu akajifunga silaha zake za vita
  rationale: ‘Kila mtu’ huonyesha matumizi ya umoja yenye maana ya kugawa kwa kila mmoja, na ‘akajifunga’ huwasilisha kitendo cha kufunga vifaa vya vita mwilini.
- source_word: וַתָּהִינוּ
  choice: mkathubutu kwa kujiamini kupita kiasi
  rationale: Kitenzi hiki adimu kinaelekea kueleza hatua ya ujasiri wa haraka au wa kujitumainia kupita kiasi; tafsiri inaonyesha mwelekeo hasi wa muktadha huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: לַעֲלֹת הָהָרָה
  choice: kupanda kwenda nchi ya vilima
  rationale: הָהָרָה inaonyesha mwendo kuelekea eneo la milima; katika muktadha huu inaweza kumaanisha nchi ya vilima kwa upana, si lazima mlima mmoja tu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa kutoholewa badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja; ‘Yahweh’ huhifadhi jina hilo la agano badala ya kuliwakilisha kwa cheo.
- issue: Maana ya וַתָּהִינוּ katika jaribio la Israeli kupanda
  choice: mkathubutu kwa kujiamini kupita kiasi
  alternative: mkafanya kwa pupa; mkaazimia kupanda
  rationale: Muktadha unaonyesha kwamba tendo lao lilikuwa la kujitumainia na la kutotii baada ya hukumu ya Mungu. Tafsiri kuu inaonyesha maana hiyo hasi, na tanbihi inakiri kwamba kitenzi hicho ni adimu na kinaweza kueleweka kwa namna inayokaribiana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Silaha zake za vita’ huhifadhi uzito wa usemi wa Kiebrania, na ‘nchi ya vilima’ hutoa maana ya kijiografia ya muktadha. Alama zote za tanbihi zimewekwa moja kwa moja kwenye maneno yanayohusika.
