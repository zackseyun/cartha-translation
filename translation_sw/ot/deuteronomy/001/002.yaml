lexical_decisions:
- source_word: אַחַד עָשָׂר יוֹם
  choice: mwendo wa siku kumi na moja
  rationale: Kirai cha Kiebrania kisicho na kitenzi hutaja muda wa safari, na Kiswahili cha kawaida hueleza maana hiyo kwa uwazi kwa kusema “mwendo wa siku kumi na moja.”
- source_word: מֵחֹרֵב
  choice: kutoka Horebu
  rationale: חֹרֵב ni jina la mahali, Horebu; halibadilishwi kuwa Sinai kwa sababu maandishi ya Kiebrania hapa yanataja Horebu.
- source_word: דֶּרֶךְ
  choice: kwa njia ya
  rationale: דֶּרֶךְ hapa inaonyesha njia au mkondo wa safari; “kwa njia ya” ni Kiswahili cha asili kinachohifadhi maana hiyo.
- source_word: הַר שֵׂעִיר
  choice: Mlima Seiri
  rationale: הַר inaweza kumaanisha mlima au eneo la milima; “Mlima Seiri” ni tafsiri fupi na iliyozoeleka kwa jina hili la njia.
- source_word: עַד
  choice: hadi
  rationale: Katika muktadha wa kijiografia, עַד huonyesha mwisho wa safari; “hadi” ni sawa na ya kawaida katika Kiswahili.
- source_word: קָדֵשׁ בַּרְנֵעַ
  choice: Kadeshi-barnea
  rationale: Hili ni jina la mahali, kwa hiyo limetoholewa badala ya kutafsiriwa; kistari kinaonyesha jina ambatani.
