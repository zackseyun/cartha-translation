  language: sw
  text: Ni safari ya siku kumi na moja kutoka Horebu, kwa njia ya Mlima Seiri, hadi Kadeshi-barnea[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “siku kumi na moja.” Nahau ya Kiebrania inaeleza muda wa kusafiri kati ya Horebu na Kadeshi-barnea kwa njia hii.
    reason: lexical_alternative
