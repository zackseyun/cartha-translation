base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/043.yaml
  text: So I spoke to you[a], but you did not listen; you rebelled against the mouth of Yahweh, acted presumptuously, and went up into the hill country.
translation:
  language: sw
  text: Basi nikawaambia, lakini hamkusikiliza; mkaliasi neno la Yahwe[a], mkatenda kwa kiburi, na mkakwea kuelekea nchi ya milima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi, “kinywa cha Yahwe”; yaani, yale Yahwe aliyokuwa amesema au kuamuru.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲדַבֵּר אֲלֵיכֶם
  choice: Basi nikasema nanyi
  rationale: Kitenzi דבר katika piel humaanisha ‘kusema’ au ‘kunena.’ ‘Basi’ linaendeleza kwa kawaida mtiririko wa matokeo kutoka mstari uliotangulia, na ‘nanyi’ linaonyesha walengwa wa wingi.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: lakini hamkusikiliza
  rationale: שׁמע linaweza kumaanisha kusikia, kusikiliza, au kutii. Hapa tofauti kati ya Musa kusema na watu kukataa kuitikia inapendelea ‘kusikiliza’; wazo la uasi linaelezwa wazi katika kishazi kinachofuata.
- source_word: וַתַּמְרוּ אֶת־פִּי יְהוָה
  choice: mliasi neno la Yahwe[a]
  rationale: מרה ni kuasi au kukaidi mamlaka. Usemi wa Kiebrania ‘kinywa cha Yahwe’ humaanisha yale aliyosema au kuamuru; ‘neno la Yahwe’ ni Kiswahili cha kawaida na chenye hadhi, huku tanbihi ikihifadhi taswira halisi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: וַתָּזִדוּ
  choice: mkatenda kwa kiburi
  rationale: זיד linaonyesha kutenda kwa kiburi, majivuno, au ukaidi wa kujiaminisha kupita kiasi. ‘Mkatenda kwa kiburi’ ni la asili na huhifadhi hukumu ya kimaadili bila kulichanganya na tendo la kupanda linalofuata.
- source_word: וַתַּעֲלוּ הָהָרָה
  choice: mkakwea nchi ya milima
  rationale: עלה ni kwenda juu au kukwea, na kiishio cha mahali katika הָהָרָה kinaonyesha mwendo kuelekea eneo la juu. ‘Nchi ya milima’ hapa inaonyesha eneo la milimani, si lazima mlima mmoja.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ina jina la Mungu moja kwa moja. ‘Yahwe’ huhifadhi jina hilo bila kulibadilisha kuwa cheo au kutumia matamshi mbadala.
- issue: Maana ya אֶת־פִּי יְהוָה
  choice: mliasi neno la Yahwe[a]
  alternative: mliasi amri ya Yahwe; mliasi kinywa cha Yahwe
  rationale: ‘Neno’ huhifadhi uhusiano na usemi wa Mungu na ni wazi kwa msomaji wa Kiswahili. ‘Amri’ ingefafanua zaidi kuliko neno lenyewe linavyosema, ilhali ‘kinywa’ katika matini kuu kingekuwa fumbo lisilo la kawaida; maana halisi imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mfuatano wa vitenzi umehifadhi mwendo wa simulizi, na taswira ya Kiebrania iliyo ngumu imeelezwa kwa tanbihi badala ya kufutwa.
