  text: יְהוֹשֻׁ֤עַ בִּן נוּן֙ הָ/עֹמֵ֣ד לְ/פָנֶ֔י/ךָ ה֖וּא יָ֣בֹא שָׁ֑מָּ/ה אֹת֣/וֹ חַזֵּ֔ק כִּי ה֖וּא יַנְחִלֶ֥/נָּה אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/038.yaml
  text: Joshua son of Nun[a], who stands before you—he will go in there. Strengthen him, for he will cause Israel to inherit it.
translation:
  language: sw
  text: Yoshua mwana wa Nuni, anayesimama mbele yako, ndiye atakayeingia humo. Mtie nguvu, kwa maana yeye ndiye atakayeirithisha Israeli nchi hiyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “atakayeipa Israeli nchi hiyo kuwa urithi,” au “atakayeigawia Israeli nchi hiyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Yoshua mwana wa Nuni
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia; patronimu בִּן נוּן imetafsiriwa kwa kawaida kuwa “mwana wa Nuni.”
- source_word: הָעֹמֵד לְפָנֶיךָ
  choice: anayesimama mbele yako
  rationale: Tafsiri hii inahifadhi taswira na upana wa nahau ya Kiebrania bila kuifasiri moja kwa moja kuwa “anayekutumikia.”
- source_word: הוּא יָבֹא שָׁמָּה
  choice: ndiye atakayeingia humo
  rationale: Kitenzi בוא pamoja na שָׁמָּה kinaonyesha kuingia katika nchi iliyotajwa; “kuingia humo” ni Kiswahili cha kawaida kinachohifadhi mwelekeo huo.
- source_word: אֹתוֹ חַזֵּק
  choice: Mtie nguvu
  rationale: Kauli hii huhifadhi maana pana ya חזק, ambayo inaweza kujumuisha kumwimarisha, kumtia moyo, na kumpa msaada wa kutekeleza wajibu wake.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa kiunganishi kinaanzisha sababu ya agizo la kumtia Yoshua nguvu.
- source_word: הוּא יַנְחִלֶנָּה אֶת יִשְׂרָאֵל
  choice: yeye ndiye atakayeirithisha Israeli nchi hiyo
  rationale: Hifili ya נחל ina maana ya kusababisha mtu arithi au kumpa kitu kuwa urithi. “Atakayeirithisha Israeli nchi hiyo” inadumisha muundo wa kisababishi huku ikitaja wazi rejeleo la kiambishi cha kike, yaani nchi.
theological_decisions:
- issue: Rejeleo la kiambishi cha kike katika יַנְחִלֶנָּה
  choice: Kiambishi kinarejelea nchi iliyoahidiwa kwa Israeli, iliyowasilishwa wazi kama “nchi hiyo.”
  alternative: 'Tafsiri ingeweza kuacha kitu hicho bila kutajwa wazi: “ataifanya Israeli irithi.”'
  rationale: Muktadha wa karibu unahusu kuingia na kuimiliki nchi. Kutaja “nchi hiyo” kunafafanua rejeleo la kisarufi bila kuongeza dai jipya la kiteolojia.
- issue: Nguvu ya kisababishi katika יַנְחִלֶנָּה
  choice: “Atakayeirithisha Israeli nchi hiyo” inahifadhi wazo kwamba Yoshua atasababisha au ataongoza Israeli kuipokea kama urithi.
  alternative: “Atakayeipa Israeli nchi hiyo kuwa urithi” au “atakayeigawia Israeli nchi hiyo.”
  rationale: Kiebrania kinaweza kueleweka kwa namna hizi zinazokaribiana. Maandishi makuu yanahifadhi kisababishi, na tanbihi inaonyesha njia nyingine halali za kueleza tendo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa msomaji wa kawaida. Muundo “ndiye atakaye…” unaakisi msisitizo wa kiwakilishi הוּא. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika na tofauti ya kimsamiati.
