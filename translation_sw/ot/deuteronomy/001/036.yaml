  text: זֽוּלָתִ֞י כָּלֵ֤ב בֶּן יְפֻנֶּה֙ ה֣וּא יִרְאֶ֔/נָּה וְ/לֽ/וֹ אֶתֵּ֧ן אֶת הָ/אָ֛רֶץ אֲשֶׁ֥ר דָּֽרַךְ בָּ֖/הּ וּ/לְ/בָנָ֑י/ו יַ֕עַן אֲשֶׁ֥ר מִלֵּ֖א אַחֲרֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/036.yaml
  text: except Caleb son of Jephunneh; he shall see it[a], and to him I will give the land on which he has walked, and to his sons, because he has fully followed Yahweh.
translation:
  language: sw
  text: isipokuwa Kalebu mwana wa Yefune. Yeye ataiona, nami nitampa yeye nchi ambayo ameikanyaga, na wanawe[a] pia, kwa sababu alimfuata Yahwe kikamilifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watoto wake” au “wazao wake”; Kiebrania, “wanawe.”
    reason: Neno la Kiebrania ni la kiume wingi; katika muktadha wa urithi linaweza kueleweka kwa upana kuwa watoto au wazao.
lexical_decisions:
- source_word: זֽוּלָתִ֞י
  choice: isipokuwa
  rationale: Neno hili linaonyesha kwamba Kalebu ndiye anayeondolewa katika hukumu iliyotangulia; “isipokuwa” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: כָּלֵ֤ב בֶּן יְפֻנֶּה֙
  choice: Kalebu mwana wa Yefune
  rationale: Majina yametoholewa kwa tahajia zilizozoeleka katika Kiswahili cha Biblia.
- source_word: ה֣וּא יִרְאֶ֔נָּה
  choice: Yeye ataiona
  rationale: Kiwakilishi cha kike katika Kiebrania kinarejelea “nchi.” Kutaja “yeye” kunahifadhi mkazo uliopo katika maandishi ya chanzo.
- source_word: וְלֽוֹ אֶתֵּ֧ן
  choice: nami nitampa yeye
  rationale: Muundo huu unahifadhi mkazo wa Kiebrania kwamba nchi atapewa Kalebu mwenyewe, huku ukiendelea kuwa wazi katika Kiswahili.
- source_word: אֶת הָאָ֛רֶץ
  choice: nchi
  rationale: “Nchi” ndilo neno la kawaida katika Kiswahili kwa eneo la ahadi linalozungumziwa hapa.
- source_word: אֲשֶׁ֥ר דָּֽרַךְ בָּ֖הּ
  choice: aliyokanyaga
  rationale: Kitenzi hiki kinahifadhi picha halisi ya kuweka mguu au kutembea juu ya nchi, kwa usemi mfupi na wa asili.
- source_word: וּלְבָנָ֑יו
  choice: na wanawe[a]
  rationale: “Wanawe” ni usemi wa asili unaoweza kumaanisha wana au watoto wake. Tanbihi inaweka wazi kwamba Kiebrania kimetumia neno la kiume “wana,” ambalo katika muktadha wa urithi linaweza pia kueleweka kwa upana kuwa wazao.
- source_word: יַ֕עַן אֲשֶׁ֥ר
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya ahadi kwa Kalebu; “kwa sababu” ni tafsiri wazi na ya kawaida.
- source_word: מִלֵּ֖א אַחֲרֵ֥י
  choice: alimfuata ... kikamilifu
  rationale: Nahau ya Kiebrania ina maana ya kumfuata mtu kabisa au kwa uaminifu kamili. “Kikamilifu” huhifadhi nguvu hiyo bila kuongeza picha ya “moyo” ambayo haijatajwa moja kwa moja.
- source_word: יְהוָֽה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetolewa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia Tetragramatoni moja kwa moja; “Yahwe” hulihifadhi kama jina binafsi la Mungu bila kulibadilisha kuwa cheo.
- issue: Upeo wa בָנָיו
  choice: wanawe, pamoja na tanbihi
  alternative: watoto wake au wazao wake
  rationale: Nomino ya Kiebrania ni ya kiume wingi, “wana wake,” lakini katika muktadha wa urithi inaweza kurejelea kizazi chake kwa upana. “Wanawe” huhifadhi usemi mfupi wa chanzo, huku tanbihi ikionyesha maana mbadala bila kuamua kimya kimya.
- issue: Maana ya מִלֵּא אַחֲרֵי יהוה
  choice: alimfuata Yahwe kikamilifu
  alternative: alimfuata Yahwe kwa moyo wote
  rationale: “Kikamilifu” huwasilisha uaminifu kamili unaodokezwa na nahau, bila kuingiza neno “moyo,” ambalo halipo katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo umehifadhi mkazo wa “yeye” na picha halisi ya kuikanyaga nchi, huku nahau ya mwisho ikitolewa kwa Kiswahili cha kawaida.
