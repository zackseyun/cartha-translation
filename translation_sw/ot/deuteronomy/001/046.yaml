  text: So you remained at Kadesh many days[a], according to the days that you remained there.
translation:
  language: sw
  text: Basi mkakaa Kadeshi siku nyingi[a], kama siku mlizokaa huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “siku nyingi, kama siku mlizokaa.” Kishazi cha mwisho kina maneno yaliyoachwa kueleweka, na huenda maana yake ni “kwa muda mrefu, muda sawa na ule mliokaa huko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּשְׁבוּ
  choice: Basi mkakaa
  rationale: Kitenzi ישׁב hapa kinaeleza kuendelea kukaa mahali. “Mkakaa” ni Kiswahili cha kawaida katika simulizi, na “Basi” linaonyesha mwendelezo unaotokana na yaliyotangulia.
- source_word: בְקָדֵשׁ
  choice: Kadeshi
  rationale: Jina la mahali קָדֵשׁ limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili; kiambishi cha mahali katika “Kadeshi” kinatosha bila kuongeza “katika.”
- source_word: יָמִים רַבִּים
  choice: siku nyingi
  rationale: Hili ni tafsiri ya moja kwa moja inayohifadhi namna ya usemi wa Kiebrania badala ya kuifasiri tu kuwa “muda mrefu.”
- source_word: כַּיָּמִים
  choice: kama siku
  rationale: Kiambishi כ־ kinaonyesha ulinganisho. “Kama siku” kinahifadhi muundo na hali ya kishazi kisicho kamili kabisa katika Kiebrania.
- source_word: אֲשֶׁר יְשַׁבְתֶּם
  choice: mlizokaa huko
  rationale: “Mlizokaa” linatafsiri kishazi rejeshi kwa kawaida. “Huko” limeongezwa kwa uwazi ili kurejelea Kadeshi, mahali panapoeleweka kutokana na muktadha.
