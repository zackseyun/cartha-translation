  yaml_path: translation/ot/deuteronomy/001/010.yaml
  text: Yahweh your God has multiplied you[a], and behold, today you are as numerous as the stars of the heavens.
translation:
  language: sw
  text: Yahwe, Mungu wenu, amewafanya kuwa wengi; na tazama, leo ninyi ni kama nyota za angani kwa wingi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama nyota za mbinguni kwa wingi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa na cheo kama “BWANA”.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Katika muktadha huu אֱלֹהִים inamtaja Mungu mmoja, na kiambishi cha nafsi ya pili wingi kinaonyeshwa kwa “wenu”.
- source_word: הִרְבָּה אֶתְכֶם
  choice: amewafanya kuwa wengi
  rationale: Hifili ya רבה ina maana ya kusababisha watu waongezeke au kuwa wengi; usemi huu ni wa asili katika Kiswahili na huhifadhi nguvu ya kisababishi.
- source_word: וְהִנְכֶם
  choice: na tazama, ... ninyi
  rationale: “Tazama” huhifadhi msisitizo wa kiashiria cha Kiebrania, huku “ninyi” ikionyesha wazi watu wanaoelekezewa fikira.
- source_word: הַיּוֹם
  choice: leo hii
  rationale: Huwasilisha wakati wa sasa na msisitizo wa usemi wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: kama nyota za angani
  rationale: Huhifadhi ulinganisho wa moja kwa moja; “angani” ni usemi wa kawaida wa Kiswahili kwa eneo ambamo nyota zinaonekana.
- source_word: לָרֹב
  choice: ni wengi
  rationale: Kirai hiki huonyesha wingi au idadi kubwa; katika Kiswahili maana hiyo imeunganishwa kwa kawaida na ulinganisho “ni wengi kama”.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova au BWANA
  rationale: Andiko linatumia jina binafsi la agano; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Tazama” limedumishwa kwa ajili ya nguvu ya balagha, na sentensi imepangwa kwa mtiririko wa asili bila kuondoa marudio ya wazo la wingi yaliyomo katika Kiebrania.
