base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/027.yaml
  text: And you grumbled in your tents and said[a], ‘Because Yahweh hates us, he brought us out of the land of Egypt to give us into the hand of the Amorites[b], to destroy us.’
translation:
  language: sw
  text: Nanyi mlinung'unika katika hema zenu na kusema, “Kwa sababu Yahwe anatuchukia,[a] alitutoa katika nchi ya Misri ili atutie mikononi mwa Waamori[b] na kutuangamiza.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kwa karibu zaidi: “katika chuki ya Yahwe kwetu”; hapa maana yake ni “Kwa sababu Yahwe anatuchukia.”'
    reason: lexical_alternative
  - marker: b
    text: 'Au, “ili atukabidhi kwa Waamori.” Kiebrania kwa karibu zaidi: “ili kututia katika mkono wa Mwamori”; umoja “Mwamori” umetumiwa kwa maana ya pamoja ya taifa lote.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרָגְנוּ
  choice: mlinung’unika
  rationale: Kitenzi רגן kinaonyesha kulalamika kwa sauti ya chini kwa kutoridhika. “Kunung’unika” ni Kiswahili cha kawaida kinachohifadhi maana hiyo hasi.
- source_word: בְאָהֳלֵיכֶם
  choice: hemani mwenu
  rationale: Hii ni tafsiri ya moja kwa moja ya mahali, inayohifadhi mazingira halisi ya makao ya mahema.
- source_word: בְּשִׂנְאַת יְהוָה אֹתָנוּ
  choice: Kwa sababu Yahwe anatuchukia
  rationale: Kihusishi בְּ pamoja na nomino dhahania “chuki” kina maana ya sababu hapa. Muundo wa kitenzi ni wa asili zaidi katika Kiswahili na unaweka wazi shtaka la Waisraeli bila kulithibitisha kuwa la kweli.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa konsonanti YHWH limetoholewa kuwa “Yahwe,” badala ya kubadilishwa na cheo.
- source_word: הוֹצִיאָנוּ מֵאֶרֶץ מִצְרָיִם
  choice: alitutoa katika nchi ya Misri
  rationale: Muundo huu unaakisi wazi tendo la kutoka Misri na unahifadhi neno “nchi” lililopo katika Kiebrania.
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: ili atutie mikononi mwa Waamori
  rationale: “Kuweka/kutoa mikononi mwa” ni nahau inayoeleweka ya kumkabidhi mtu chini ya mamlaka ya mwingine. Wingi “Waamori” unaonyesha matumizi ya nomino ya umoja kama jina la pamoja la taifa.
- source_word: לְהַשְׁמִידֵנוּ
  choice: wapate kutuangamiza
  rationale: Hiphil ya שׁמד ina maana ya kuharibu kabisa au kuangamiza. Mhusika anayetarajiwa kutekeleza uharibifu ni Waamori, hivyo “wapate” inaweka uhusiano huo wazi kwa Kiswahili cha asili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi la agano, YHWH. “Yahwe” linahifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Shtaka kwamba Yahwe anawachukia Waisraeli
  choice: Limehifadhiwa kama maneno yaliyonukuliwa ya watu
  alternative: Kulilegeza kuwa ‘Yahwe ametukataa’
  rationale: Kiebrania kinasema “chuki” kwa nguvu. Muktadha unatambulisha kauli hii kuwa shtaka la watu waliponung’unika, si tamko la msimuliaji kuhusu nia halisi ya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaosomeka kwa urahisi. “Hema,” “nchi ya Misri,” na nahau ya “mikononi mwa” zinahifadhi taswira za maandishi ya Kiebrania bila kufanya sentensi kuwa ngumu.
