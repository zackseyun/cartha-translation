  text: וְ/טַפְּ/כֶם֩ אֲשֶׁ֨ר אֲמַרְתֶּ֜ם לָ/בַ֣ז יִהְיֶ֗ה וּ֠/בְנֵי/כֶם אֲשֶׁ֨ר לֹא יָדְע֤וּ הַ/יּוֹם֙ ט֣וֹב וָ/רָ֔ע הֵ֖מָּה יָבֹ֣אוּ שָׁ֑מָּ/ה וְ/לָ/הֶ֣ם אֶתְּנֶ֔/נָּה וְ/הֵ֖ם יִירָשֽׁוּ/הָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/039.yaml
  text: And your little ones[a], whom you said would become plunder, and your children, who today do not know good or evil—they shall go in there, and I will give it to them[c][b], and they shall possess it.
translation:
  language: sw
  text: Na watoto wenu wadogo, ambao mlisema watakuwa nyara[a], na watoto wenu ambao leo hawajui mema wala mabaya[b]—hao wataingia humo. Nitawapa nchi hiyo, nao wataimiliki[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watakuwa mawindo” au “watakuwa mateka.”
    reason: lexical_alternative
  - marker: b
    text: Kauli “hawajui mema wala mabaya” ni nahau ya Kiebrania inayoonyesha kutokuwa na utambuzi uliokomaa.
    reason: cultural_note
  - marker: c
    text: Au, “watairithi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: watoto wenu wadogo
  rationale: Neno טַף humaanisha hasa watoto wadogo au wategemezi. Tafsiri hii inaonyesha udogo na hali yao ya kutoweza kujilinda katika muktadha huu.
- source_word: לָבַז יִהְיֶה
  choice: watakuwa nyara
  rationale: בַּז ni mali au watu wanaotekwa na adui kama nyara. Kauli hii ya Kiswahili ni ya asili na inahifadhi jambo ambalo Waisraeli waliogopa lingewapata watoto wao.
- source_word: בְנֵיכֶם
  choice: watoto wenu
  rationale: Ingawa בָּנִים inaweza kutafsiriwa kihalisi kuwa ‘wana,’ hapa inarejelea kizazi cha watoto kilichotofautishwa na kizazi cha watu wazima waliohukumiwa. ‘Watoto wenu’ ni Kiswahili cha kawaida na hakibadili upeo wa rejeleo katika muktadha.
- source_word: לֹא יָדְעוּ הַיּוֹם טוֹב וָרָע
  choice: ambao leo hawajui mema wala mabaya
  rationale: Tafsiri hii inadumisha nahau ya Kiebrania bila kuigeuza kuwa hitimisho la mafundisho kuhusu kutokuwa na hatia au kuwajibika.
- source_word: שָׁמָּה
  choice: wataingia humo
  rationale: שָׁמָּה huonyesha mwendo kuelekea mahali palipotajwa, yaani nchi. ‘Kuingia humo’ ni usemi wa asili wa Kiswahili unaoleta wazi mwendo huo.
- source_word: אֶתְּנֶנָּה
  choice: Nitawapa nchi hiyo
  rationale: Kiambishi cha Kiebrania kinarejelea nchi. Kutaja ‘nchi hiyo’ kwa wazi huepuka utata usio wa lazima katika Kiswahili.
- source_word: יִירָשׁוּהָ
  choice: wataimiliki
  rationale: ירשׁ inaweza kumaanisha kurithi, kumiliki, au kutwaa milki kulingana na muktadha. ‘Wataimiliki’ inaonyesha kupokea na kuikalia nchi bila kulazimisha maana moja finyu.
theological_decisions:
- issue: Hali ya watoto katika kauli ‘hawajui mema wala mabaya’
  choice: Kudumisha nahau kama maelezo ya kutokuwa na utambuzi uliokomaa
  alternative: Kuitafsiri kama tamko la kutowajibika kiagano au fundisho maalumu kuhusu umri wa kuwajibika
  rationale: Kiebrania kinatofautisha kizazi hiki na watu wazima waliohukumiwa, lakini hakisuluhishi moja kwa moja mijadala ya baadaye kuhusu kutokuwa na hatia au umri wa kuwajibika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. Muundo umegawanywa katika sentensi mbili ili kuepuka sentensi ndefu isiyo ya asili, huku uhusiano wa hoja za Kiebrania ukihifadhiwa.
