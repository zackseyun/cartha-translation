  yaml_path: translation/ot/deuteronomy/001/024.yaml
  text: So they turned and went up into the hill country[a], and came as far as the Valley of Eshcol, and spied it out.
translation:
  language: sw
  text: Basi wakageuka, wakapanda kuelekea nchi ya vilima, wakafika hadi Bonde la Eshkoli[a], wakaipeleleza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Korongo la Eshkoli” au “Mkondo wa maji wa Eshkoli”; neno la Kiebrania linaweza kumaanisha bonde lenye mkondo wa maji wa msimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: wakageuka
  rationale: Kitenzi פנה katika mfululizo huu wa masimulizi kina maana ya kugeuka au kuelekea upande fulani; “wakageuka” ni tafsiri ya moja kwa moja inayohifadhi mwendo unaosimuliwa.
- source_word: וַיַּעֲלוּ
  choice: wakapanda
  rationale: עלה huonyesha mwendo wa kwenda juu. “Wakapanda” ni Kiswahili cha kawaida na huhifadhi maana ya kupanda katika eneo lenye miinuko.
- source_word: הָהָרָה
  choice: hadi nchi ya vilima
  rationale: Kiishio cha mwelekeo -ה huonyesha kuelekea eneo hilo. “Nchi ya vilima” linafaa kwa eneo la miinuko bila kulifanya lazima kuwa safu ya milima mikubwa.
- source_word: וַיָּבֹאוּ עַד
  choice: wakafika mpaka
  rationale: Muunganiko wa בוא na עַד huonyesha kufika hadi mahali fulani; “wakafika mpaka” huhifadhi wazi wazo hilo la kikomo cha safari.
- source_word: נַחַל אֶשְׁכֹּל
  choice: Bonde la Eshkoli
  rationale: נחל inaweza kumaanisha bonde au korongo lenye kijito, mara nyingi cha msimu. “Bonde la Eshkoli” ni la kawaida na linaeleweka, huku maana nyingine ikiwekwa katika tanbihi.
- source_word: וַיְרַגְּלוּ
  choice: kuipeleleza
  rationale: Katika piel, רגל humaanisha kupeleleza au kufanya upelelezi wa eneo, si kulitembelea tu. “Kuipeleleza” huhifadhi dhana ya upelelezi.
- source_word: אֹתָהּ
  choice: kui-
  rationale: Kiwakilishi cha kitu cha kike katika Kiebrania hurejelea nchi au eneo linalozungumziwa. Katika Kiswahili, kiambishi “-i-” katika “kuipeleleza” hurejelea nchi hiyo kwa kawaida bila kurudia nomino.
