base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/011.yaml
  text: May Yahweh[a], the God of your fathers, make you a thousand times as many as you are, and bless you[b], just as he has promised you.
translation:
  language: sw
  text: Yahwe, Mungu wa baba zenu[a], aifanye idadi yenu kuwa mara elfu ya ilivyo sasa, na awabariki kama alivyowaambia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu wa mababu zenu.” Kiebrania kinasema kihalisi “Mungu wa baba zenu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kama alivyowaahidi.” Kiebrania kinasema kihalisi “kama alivyosema nanyi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetafsiriwa kwa unukuzi wa Kiswahili badala ya kubadilishwa na cheo kama “BWANA”.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Mungu wa baba zenu
  rationale: Huhifadhi maana halisi ya mnyororo wa maneno ya Kiebrania na uhusiano wa kihistoria wa agano na mababu wa Israeli.
- source_word: יֹסֵף עֲלֵיכֶם כָּכֶם אֶלֶף פְּעָמִים
  choice: na aifanye idadi yenu kuwa mara elfu ya ilivyo sasa
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida ombi la kuongezeka kwa watu hadi mara elfu ya idadi yao ya sasa, bila kutumia tafsiri ngumu ya neno kwa neno “awaongeze juu yenu kama ninyi.”
- source_word: וִיבָרֵךְ אֶתְכֶם
  choice: na awabariki
  rationale: Kitenzi kinaendeleza ombi au baraka iliyoanza katika sehemu ya kwanza ya sentensi.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: kama alivyowaambia
  rationale: Huhifadhi maana ya msingi ya דבר, “kusema/kusema na,” huku “aliwaahidi” ikibaki kuwa tafsiri ya kimuktadha iliyo katika tanbihi.
theological_decisions:
- issue: Kutafsiri jina la agano יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; “Yahwe” hulihifadhi badala ya kuliweka kama cheo.
- issue: Lugha ya ukoo katika אֲבֹתֵיכֶם
  choice: baba zenu
  alternative: mababu zenu
  rationale: “Baba zenu” hufuata umbo la Kiebrania na hudumisha rejeo la kihistoria la agano; “mababu zenu” ni ufafanuzi halali wa maana yake pana.
- issue: Nguvu ya דבר katika muktadha wa baraka
  choice: kama alivyowaambia
  alternative: kama alivyowaahidi
  rationale: Kitenzi chenyewe ni kipana zaidi kuliko “kuahidi.” Tafsiri kuu haifungi maana kwa ahadi pekee, lakini tanbihi inaonyesha uwezekano huo wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo “aifanye idadi yenu kuwa mara elfu” umechaguliwa kwa uwazi wa hesabu na ufasaha, huku ombi la baraka likihifadhiwa kwa viambishi vya hali ya kutakia.
