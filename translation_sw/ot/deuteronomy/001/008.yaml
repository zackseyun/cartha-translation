id: DEU.1.8
reference: Deuteronomy 1:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: רְאֵ֛ה נָתַ֥תִּי לִ/פְנֵי/כֶ֖ם אֶת הָ/אָ֑רֶץ בֹּ֚אוּ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֣ר נִשְׁבַּ֣ע יְ֠הוָה לַ/אֲבֹ֨תֵי/כֶ֜ם לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לָ/תֵ֣ת לָ/הֶ֔ם וּ/לְ/זַרְעָ֖/ם אַחֲרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/008.yaml
  text: See[a], I have set the land before you. Go in and take possession of the land that Yahweh swore to your fathers—to Abraham, to Isaac[d][c][b], and to Jacob—to give to them and to their offspring after them.
translation:
  language: sw
  text: Tazama,[a] nimeiweka nchi mbele yenu. Ingieni mkaimiliki[b] nchi ambayo Yahwe aliwaapia baba zenu[c]—Abrahamu, Isaka na Yakobo—kwamba angewapa wao na uzao wao baada yao.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Angalia.”
    reason: lexical_alternative
  - marker: b
    text: Au “mkaitwae nchi kuwa mali yenu”; kitenzi cha Kiebrania kinaweza pia kumaanisha kurithi au kutwaa umiliki.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “baba zenu,” yaani Abrahamu, Isaka na Yakobo waliotajwa hapa.'
    reason: alternative_reading
  - marker: d
    text: 'Kiebrania: “mbegu yao baada yao”; hapa maana yake ni uzao au wazao wao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Tazama
  rationale: Kauli ya amri ya umoja inayovuta usikivu kwa msisitizo; “Tazama” ni ya kawaida, yenye heshima, na huhifadhi nguvu ya moja kwa moja ya Kiebrania.
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: nimeiweka ... mbele yenu
  rationale: Katika muundo huu, נָתַן pamoja na לִפְנֵי huonyesha kuweka kitu mbele ya watu, yaani kimewekwa tayari wakiingie kukimiliki.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha huu אֶרֶץ ni nchi iliyoahidiwa; “nchi” ni tafsiri ya kawaida na ya asili kwa Kiswahili.
- source_word: בֹּאוּ
  choice: Ingieni
  rationale: Amri ya wingi inaelekeza watu waingie ndani ya nchi; “Ingieni” huonyesha wazi mwendo huo.
- source_word: וּרְשׁוּ
  choice: mkaimiliki
  rationale: ירשׁ hapa ina maana ya kuingia na kutwaa umiliki wa nchi; “mkaimiliki” huunganisha tendo hili kwa kawaida na amri iliyotangulia.
- source_word: נִשְׁבַּע יְהוָה
  choice: Yahwe aliwaapia
  rationale: Huhifadhi jina la agano יְהוָה na maana ya kufanya kiapo kwa wale waliotajwa.
- source_word: לַאֲבֹתֵיכֶם
  choice: baba zenu
  rationale: Neno la Kiebrania ni la kiume na hapa linafafanuliwa mara moja kuwa linawahusu Abrahamu, Isaka na Yakobo.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Abrahamu, Isaka na Yakobo
  rationale: Majina ya mababu yanatolewa wazi kwa mpangilio wa Kiebrania kwa lugha ya kawaida ya Kiswahili.
- source_word: לָתֵת לָהֶם וּלְזַרְעָם אַחֲרֵיהֶם
  choice: kwamba angewapa wao na uzao wao baada yao
  rationale: “Uzao” huhifadhi hali ya jina זֶרַע la umoja lenye maana ya pamoja, huku “angewapa” ikiwasilisha kwa kawaida yaliyomo katika kiapo cha zamani.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la agano יְהוָה; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya אֲבֹתֵיכֶם
  choice: baba zenu
  alternative: mababu zenu
  rationale: “Baba zenu” hudumisha jinsia iliyo wazi katika chanzo, na mstari wenyewe unawatambulisha kuwa Abrahamu, Isaka na Yakobo.
- issue: Wapokeaji wa nchi iliyoahidiwa
  choice: angewapa wao na uzao wao baada yao
  alternative: angewapa wazao wao baada yao
  rationale: Kiebrania kinataja kwa uwazi kuwapa “wao” na pia uzao wao; tafsiri imehifadhi mvutano huo badala ya kuwafanya wazao peke yao kuwa wapokeaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa amri umewekwa wazi na wa kawaida kwa wasomaji (“Ingieni mkaimiliki”), huku jina Yahwe, rejeo la “baba zenu,” na usemi wa pamoja “uzao wao” vikihifadhi maelezo muhimu ya chanzo.
