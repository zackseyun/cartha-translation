translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Taswira ya Kiebrania ya ‘kuyeyusha mioyo’ na usemi wa miji iliyolindwa ‘mbinguni’ imehifadhiwa, huku tanbihi zikifafanua maana. Usemi wa moja kwa moja umeundwa kwa mtiririko wa kawaida wa Kiswahili.
