base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/028.yaml
  text: Where are we going up? Our brothers have melted our hearts[a], saying, ‘The people are greater and taller than we are; the cities are great and fortified up to the heavens; and besides[c][b], we saw the sons of the Anakim there.’
translation:
  language: sw
  text: Tunapanda kwenda wapi? Ndugu zetu wameyeyusha mioyo yetu[a], wakisema, ‘Watu ni wakubwa na warefu kuliko sisi; miji ni mikubwa na ina maboma yanayofika mbinguni[b]; tena, tuliwaona huko wana wa Anaki[c].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wameifanya mioyo yetu iyeyuke”; yaani, “wametukatisha tamaa.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “miji iliyotiwa ngome mbinguni,” usemi wa kutia chumvi unaomaanisha miji yenye maboma ya juu sana.
    reason: cultural_note
  - marker: c
    text: Au, “wazao wa Anaki” au “Waanaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָה אֲנַחְנוּ עֹלִים
  choice: Tunapanda kwenda wapi?
  rationale: אָנָה huuliza mahali panapolengwa, na עֹלִים ni hali ya kuendelea ya ‘kupanda.’ Mpangilio huu ni wa kawaida katika Kiswahili na unahifadhi wazo la kupanda kuelekea nchi ya milimani.
- source_word: אַחֵינוּ
  choice: Ndugu zetu
  rationale: ‘Ndugu’ ni neno la kawaida na lenye heshima kwa watu wa ukoo au taifa moja; hapa linarejelea Waisraeli wenzao waliokuwa wameipeleleza nchi.
- source_word: הֵמַסּוּ אֶת לְבָבֵנוּ
  choice: wameyeyusha mioyo yetu
  rationale: Tafsiri hii inahifadhi taswira hai ya Kiebrania ya mioyo kuyeyuka kwa sababu ya hofu, huku tanbihi ikieleza maana yake ya kuvunjwa moyo.
- source_word: עַם גָּדוֹל וָרָם מִמֶּנּוּ
  choice: Watu hao ni wakubwa na warefu kuliko sisi
  rationale: גָּדוֹל hapa hudokeza ukubwa na רָם kimo; tafsiri inahifadhi vipengele vyote viwili vya ulinganisho.
- source_word: עָרִים גְּדֹלֹת וּבְצוּרֹת בַּשָּׁמָיִם
  choice: miji yao ni mikubwa na imezungushiwa ngome zinazofika mbinguni
  rationale: Kifungu kinaeleza miji mikubwa yenye ulinzi imara; ‘zinazofika mbinguni’ kinahifadhi chumvi ya usemi na taswira ya Kiebrania bila kuififisha kuwa ‘ndefu sana.’
- source_word: וְגַם
  choice: tena
  rationale: ‘Tena’ huongeza jambo jingine la kutisha kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: בְּנֵי עֲנָקִים
  choice: wazao wa Anaki
  rationale: Kiebrania kwa kawaida humaanisha wana au wazao wa Anaki. ‘Wazao wa Anaki’ ni wazi kuliko kuazima moja kwa moja jina la kikundi kisilojulikana kwa wasomaji wengi.
- source_word: רָאִינוּ שָׁם
  choice: tuliwaona huko
  rationale: Wakati uliopita unafaa kwa taarifa ya wapelelezi kuhusu watu waliowaona nchini.
