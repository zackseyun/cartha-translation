  to: Tunapanda kwenda wapi? Ndugu zetu wameyeyusha mioyo yetu[a], wakisema, ‘Watu ni wakubwa na warefu kuliko sisi; miji ni mikubwa na ina maboma yanayofika mbinguni[b]; tena, tuliwaona huko wana wa Anaki[c].’
  rationale: 'Marekebisho yanarejesha uhusiano wa kisarufi na wa maana wa Kiebrania: miji ndiyo yenye ulinzi wa maboma, na taswira ya maboma yanayofika mbinguni imehifadhiwa. Uondoaji wa “hao” na “yao” huepuka maelezo yasiyosemwa na chanzo, bila kufanya Kiswahili kiwe kigumu.'
