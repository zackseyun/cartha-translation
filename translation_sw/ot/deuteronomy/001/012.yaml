  yaml_path: translation/ot/deuteronomy/001/012.yaml
  text: How can I alone bear your trouble[a], your burden, and your disputes?
translation:
  language: sw
  text: Nitawezaje mimi peke yangu kubeba taabu yenu, mzigo wenu, na migogoro yenu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ugomvi wenu” au “kesi zenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: Nitawezaje
  rationale: Katika muktadha huu neno linaanzisha swali la balagha linaloonyesha ugumu au kutowezekana; “Nitawezaje” huwasilisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: אֶשָּׂא
  choice: kubeba
  rationale: Kitenzi נשׂא hapa kina maana ya kubeba au kuchukua jukumu; “kubeba” kinafaa kwa vitu vya kidhahania vinavyofuata.
- source_word: לְבַדִּי
  choice: mimi peke yangu
  rationale: Kauli hii inasisitiza kwamba Musa hangeweza kushughulikia mambo hayo bila msaada.
- source_word: טָרְחֲכֶם
  choice: taabu yenu
  rationale: טֹרַח humaanisha taabu, usumbufu, au kazi inayochosha. “Taabu” hutofautisha neno hili na מַשָּׂא huku likionyesha uzito uliomwelemea Musa.
- source_word: מַשַּׂאֲכֶם
  choice: mzigo wenu
  rationale: מַשָּׂא ni mzigo au kitu kinachobebwa; “mzigo” ni tafsiri ya moja kwa moja na ya kawaida, hata kwa maana ya kidhahania.
- source_word: רִיבְכֶם
  choice: migogoro yenu
  rationale: רִיב inaweza kumaanisha ugomvi, mgogoro, au kesi ya kisheria. “Migogoro” inaeleweka kwa urahisi na inaweza kujumuisha mabishano ya watu pamoja na mambo yanayohitaji kuamuliwa.
