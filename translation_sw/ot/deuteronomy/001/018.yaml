translation:
  language: sw
  text: Wakati huo niliwaamuru mambo yote mliyopaswa kufanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maneno yote” au “masuala yote”; neno la Kiebrania דְּבָרִים linaweza kumaanisha maagizo yaliyosemwa au mambo ya kutekelezwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: niliwaamuru
  rationale: Kitenzi צוה kina nguvu ya kutoa amri au maagizo yenye mamlaka; “niliwaamuru” kinahifadhi nguvu hiyo na pia kinaonyesha kuwa walengwa ni wengi.
- source_word: אֶתְכֶם
  choice: -wa-
  rationale: Kiambishi cha yambwa katika “niliwaamuru” kinaonyesha nafsi ya pili wingi kwa njia ya kawaida katika Kiswahili.
- source_word: בָּעֵת הַהִוא
  choice: Wakati huo
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili unaolingana na rejeo la wakati katika simulizi.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: mambo yote
  rationale: דְּבָרִים inaweza kumaanisha maneno, mambo, au mashauri. Katika muktadha huu inahusu maagizo ya kutekelezwa; “mambo yote” huhifadhi upana huo bila kuifanya iwe “maneno” pekee.
- source_word: אֲשֶׁר תַּעֲשׂוּן
  choice: mliyopaswa kufanya
  rationale: Kifungu hiki kinaeleza yale ambayo, kwa sababu ya amri, Waisraeli waliwajibika kuyafanya. “Mliyopaswa kufanya” ni cha asili na hudumisha nguvu ya wajibu bila kuongeza ukali usio lazima.
