base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/033.yaml
  text: who went before you on the way to search out a place for you to camp[a], in fire by night to show you the way in which you should go[b], and in the cloud by day.
translation:
  language: sw
  text: aliyekuwa akiwatangulia njiani ili kuwatafutia mahali pa kupiga kambi[a], katika moto usiku ili kuwaonyesha njia mtakayopita[b], na katika wingu mchana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali pa kuweka kambi.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “kuwaonyesha katika njia mtakayokwenda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהֹלֵךְ
  choice: aliyekuwa akiwatangulia
  rationale: Kitenzi-shirikishi cha Qal kinaendeleza maelezo ya Bwana katika mstari uliotangulia; umbo hili linaonyesha tendo la kuendelea wakati wa safari bila kumtaja tena mhusika.
- source_word: לִפְנֵיכֶם
  choice: akiwatangulia
  rationale: Nahau ya mahali ina maana ya kwenda mbele ya watu akiwaongoza; ‘akiwatangulia’ ni Kiswahili cha kawaida na wazi.
- source_word: בַּדֶּרֶךְ
  choice: njiani
  rationale: דרך hapa ni njia au safari; ‘njiani’ ni fupi, ya kawaida, na inafaa muktadha wa kusafiri jangwani.
- source_word: לָתוּר
  choice: ili kuwatafutia
  rationale: תור humaanisha kuchunguza au kutafuta kwa kusudi la kupata mahali panapofaa; ‘kuwatafutia’ huwasilisha kusudi hilo kwa Kiswahili cha asili.
- source_word: מָקוֹם
  choice: mahali
  rationale: Ni nomino ya kawaida ya eneo; ‘mahali’ ndiyo sawia ya moja kwa moja na ya kawaida.
- source_word: לַחֲנֹתְכֶם
  choice: pa kupiga kambi
  rationale: Kiswahili cha sasa hutumia ‘kupiga kambi’ kwa maana ya kukaa kwa muda katika kambi; kiambishi cha kusudi kinaunganishwa kwa kawaida na ‘mahali pa’.
- source_word: בָּאֵשׁ לַיְלָה
  choice: usiku katika moto
  rationale: Mpangilio huu huhifadhi wazo kwamba Mungu alidhihirika au kuongoza katika moto wakati wa usiku, sambamba na wingu wakati wa mchana.
- source_word: לַרְאֹתְכֶם
  choice: ili kuwaonyesha
  rationale: Hiphil ya ראה ni ya kusababisha kuona; katika muktadha wa uongozi, ‘kuwaonyesha’ ndiyo tafsiri ya kawaida.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: njia ambayo mngeifuata
  rationale: Kauli hii inataja njia waliyoonyeshwa waifuate. ‘Mngeifuata’ huhifadhi hali ya kitenzi cha Kiebrania bila kuifanya hasa kuwa amri ya kimaadili.
- source_word: וּבֶעָנָן יוֹמָם
  choice: na mchana katika wingu
  rationale: ‘Wingu’ linarejelea wingu linalojulikana la uongozi wa Mungu; mpangilio huu ni wa kawaida na unasawazisha ‘usiku katika moto’.
theological_decisions:
- issue: Mhusika ni Bwana anayetajwa katika mstari uliotangulia
  choice: Kudumisha kishazi tegemezi ‘aliyekuwa akiwatangulia...’ bila kurudia ‘Bwana’
  alternative: Kuongeza ‘Bwana, aliyekuwa akiwatangulia...’ ili kuweka wazi mhusika
  rationale: Kiebrania kinaunganisha mstari huu kisarufi na kutajwa kwa Bwana Mungu wenu katika mstari uliotangulia. Kutomwongeza tena mhusika huhifadhi utegemezi huo na huepuka kuongeza maneno yasiyopo hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kupiga kambi’ na ‘njiani’ vinaeleweka kwa wasomaji wa kawaida; muundo wa sentensi unahifadhi utegemezi wa mstari huu kwa mstari uliotangulia na usambamba wa moto usiku na wingu mchana.
