source:
  edition: WLC
  text: רְ֠אֵה נָתַ֨ן יְהוָ֧ה אֱלֹהֶ֛י/ךָ לְ/פָנֶ֖י/ךָ אֶת הָ/אָ֑רֶץ עֲלֵ֣ה רֵ֗שׁ כַּ/אֲשֶׁר֩ דִּבֶּ֨ר יְהוָ֜ה אֱלֹהֵ֤י אֲבֹתֶ֨י/ךָ֙ לָ֔/ךְ אַל תִּירָ֖א וְ/אַל תֵּחָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/021.yaml
  text: See[a], Yahweh your God has set the land before you. Go up, take possession, just as Yahweh, the God of your fathers, has spoken to you. Do not fear or be dismayed.
translation:
  language: sw
  text: Tazama, Yahwe Mungu wako ameiweka nchi mbele yako. Panda ukaimiliki, kama Yahwe, Mungu wa baba zako, alivyokuambia. Usiogope wala usifadhaike.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאֵה
  choice: Tazama
  rationale: Ni amri inayovuta usikivu; “Tazama” ni ya heshima, inaeleweka, na inadumisha nguvu ya moja kwa moja ya Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linawakilisha moja kwa moja jina la agano יהוה kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Ni muundo wenye kiambishi cha nafsi ya pili umoja, ukimwelekea Israeli kwa usemi wa umoja.
- source_word: נָתַן ... לְפָנֶיךָ
  choice: ameiweka ... mbele yako
  rationale: Unadumisha taswira ya nchi kuwekwa mbele ya Israeli ili iingie na kuimiliki, bila kuunda Kiswahili kisicho cha kawaida cha “ametoa mbele yako.”
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha huu inarejelea nchi iliyoahidiwa; “nchi” ni pana na ya kawaida katika Kiswahili.
- source_word: עֲלֵה
  choice: Panda
  rationale: Inadumisha maana ya kupanda kuelekea eneo la vilima na pia mwito wa kusonga kuingia nchini.
- source_word: רֵשׁ
  choice: ukaimiliki
  rationale: Kitenzi ירשׁ hapa kinaonyesha kuingia na kutwaa umiliki wa nchi ambayo Mungu amewapa; muundo huu unaunganika kwa kawaida na “Panda.”
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: kama ... alivyokuambia
  rationale: “Alivyokuambia” ni Kiswahili cha kawaida kwa tendo la kusema lililoelekezwa kwa mtu, bila kuongeza wazi dhana ya kuahidi ambayo imebaki katika muktadha.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: Mungu wa baba zako
  rationale: Unahifadhi usemi wa agano ulio wa kiume katika Kiebrania badala ya kuupanua kimya kimya kuwa “mababu.”
- source_word: לָךְ
  choice: -ku- katika “alivyokuambia”
  rationale: Kiambishi cha mtendewa kinaonyesha kwa kawaida kwamba maneno hayo yalisemwa kwako.
- source_word: אַל תִּירָא
  choice: Usiogope
  rationale: Ni katazo la moja kwa moja, fupi, na la kawaida.
- source_word: וְאַל תֵּחָת
  choice: wala usifadhaike
  rationale: “Usifadhaike” huonyesha kuvunjika moyo au kutishwa ndani kwa ndani, huku “wala” ikiunganisha makatazo mawili kwa Kiswahili asilia.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Chanzo kinatumia jina la agano moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Usemi wa agano אֱלֹהֵי אֲבֹתֶיךָ
  choice: Mungu wa baba zako
  alternative: Mungu wa mababu zako
  rationale: Kiebrania kinasema kihalisi “baba zako.” Tafsiri kuu inadumisha umbo hilo lenye umuhimu wa kifamilia na kiagano bila kulifanya lisilo na jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Umoja wa nafsi ya pili umehifadhiwa katika “wako,” “yako,” na vitenzi, kama ilivyo katika hotuba ya Kiebrania kwa Israeli kama jumuiya moja.
