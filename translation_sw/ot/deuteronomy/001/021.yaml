  source_fidelity: 'Tafsiri inafuata kwa uaminifu mpangilio na maana ya Kiebrania: mwito wa usikivu, nchi iliyowekwa mbele ya msikilizaji, amri mbili za kwenda juu na kuimiliki, rejeo la Mungu wa baba, na makatazo mawili ya hofu na kufadhaika. Umoja wa nafsi ya pili umehifadhiwa sawasawa.'
  naturalness: Kiswahili ni sanifu, cha kawaida, na kina hadhi inayofaa kwa hotuba ya kibiblia. “Panda ukaimiliki” ni muunganiko wa kawaida unaotoa vizuri amri mbili zinazofuatana. “Usiogope wala usifadhaike” ni wa asili na huhifadhi tofauti ya makatazo hayo mawili.
  terminology: “Yahwe” ni uwakilishaji thabiti wa יהוה; “Mungu wako” na “Mungu wa baba zako” ni sahihi na za kawaida. “Nchi” na “kuimiliki” zinafaa kwa הארץ na ירשׁ katika muktadha huu. Hakuna tanbihi inayohitajika katika Kiswahili, kwa kuwa “baba zako” tayari huhifadhi istilahi ya chanzo bila utata wa kimuundo.
