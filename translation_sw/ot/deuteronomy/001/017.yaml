source:
  edition: WLC
  text: לֹֽא תַכִּ֨ירוּ פָנִ֜ים בַּ/מִּשְׁפָּ֗ט כַּ/קָּטֹ֤ן כַּ/גָּדֹל֙ תִּשְׁמָע֔וּ/ן לֹ֤א תָג֨וּרוּ֙ מִ/פְּנֵי אִ֔ישׁ כִּ֥י הַ/מִּשְׁפָּ֖ט לֵ/אלֹהִ֣ים ה֑וּא וְ/הַ/דָּבָר֙ אֲשֶׁ֣ר יִקְשֶׁ֣ה מִ/כֶּ֔ם תַּקְרִב֥וּ/ן אֵלַ֖/י וּ/שְׁמַעְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/017.yaml
  text: You shall not show partiality in judgment[a]; you shall hear the small and the great alike. You shall not be intimidated by any man, for the judgment belongs to God. And the matter that is too difficult for you, you shall bring to me[b], and I will hear it.
translation:
  language: sw
  text: Msionyeshe upendeleo katika hukumu[a]. Muwasikilize mdogo na mkubwa sawa. Msiogope mtu yeyote[b], kwa maana hukumu ni ya Mungu. Jambo litakalokuwa gumu kwenu, lileteni kwangu, nami nitalisikiliza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kwa maana ya neno halisi, “msitambue nyuso katika hukumu”; hii ni nahau yenye maana ya kuonyesha upendeleo.
    reason: lexical_alternative
  - marker: b
    text: Au “msitishwe na mtu yeyote”; kwa maana ya neno halisi, “msiogope mbele ya mtu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכִּירוּ פָנִים
  choice: msipendelee mtu
  rationale: Nahau hiyo, ambayo kwa neno halisi ni ‘kutambua nyuso,’ katika muktadha wa mahakama humaanisha kuonyesha upendeleo. Kiswahili hiki ni cha kawaida na kinahifadhi nguvu ya amri dhidi ya upendeleo.
- source_word: בַּמִּשְׁפָּט
  choice: wakati wa kuhukumu
  rationale: Hapa מִשְׁפָּט inahusu utoaji wa hukumu katika kesi, si haki kama dhana ya jumla tu. Kauli hii ni ya asili katika Kiswahili.
- source_word: כַּקָּטֹן כַּגָּדֹל
  choice: mdogo kama mkubwa
  rationale: Jozi hii inatofautisha watu wa hadhi ya chini na ya juu. Tafsiri inahifadhi picha fupi ya Kiebrania bila kuifafanua kupita kiasi.
- source_word: תִּשְׁמָעוּן
  choice: msikilize
  rationale: Katika muktadha wa kimahakama, kitenzi hiki kinamaanisha kumsikiliza mhusika au kusikiliza kesi yake. ‘Msikilize’ ni wazi na pia kinahifadhi lugha ya kusikia iliyojirudia mwishoni mwa aya.
- source_word: תָגוּרוּ
  choice: msimwogope
  rationale: Kitenzi kinaeleza kurudi nyuma kwa hofu mbele ya mtu. ‘Msimwogope’ kinahifadhi maana ya moja kwa moja; uwezekano wa maana ya kutishwa unaelezwa kwa muktadha.
- source_word: מִפְּנֵי אִישׁ
  choice: mtu yeyote
  rationale: Kauli ya Kiebrania ni ‘mbele ya mtu.’ Katika Kiswahili, ‘mtu yeyote’ huonyesha kwa kawaida nguvu yake ya jumla bila kupunguza maana.
- source_word: כִּי הַמִּשְׁפָּט לֵאלֹהִים הוּא
  choice: kwa maana hukumu ni ya Mungu
  rationale: Hii inadumisha dai la moja kwa moja kwamba hukumu ni mali au mamlaka ya Mungu bila kulipanua kuwa fundisho lisilotajwa wazi.
- source_word: הַדָּבָר אֲשֶׁר יִקְשֶׁה מִכֶּם
  choice: jambo litakalokuwa gumu mno kwenu
  rationale: Katika muktadha huu דָּבָר ni jambo au kesi, na kauli nzima inaonyesha jambo lililo nje ya uwezo wa waamuzi kulitatua.
- source_word: תַּקְרִבוּן אֵלַי
  choice: lileteni kwangu
  rationale: Hiphil ya קרב humaanisha kuleta karibu au kuwasilisha. ‘Lileteni kwangu’ ni ya asili na inafaa muktadha wa kuwasilisha kesi.
- source_word: וּשְׁמַעְתִּיו
  choice: nami nitalisikiliza
  rationale: Kiambishi cha yambwa kinaelekea kurejelea ‘jambo.’ Tafsiri inahifadhi kitenzi cha kusikia badala ya kuongeza wazo la ‘kuamua,’ ambalo halijasemwa moja kwa moja.
theological_decisions:
- issue: Msingi wa mamlaka ya hukumu katika kauli ‘hukumu ni ya Mungu’
  choice: Kauli imeachwa ikiwa dai la moja kwa moja kwamba hukumu ni ya Mungu, na hivyo kuwa msingi wa kutopendelea na kutoogopa watu.
  alternative: Inaweza kueleweka kwamba Mungu atawahukumu waamuzi, au kwamba hukumu lazima itokane na sheria ya Mungu.
  rationale: Kiebrania hakifafanui ni kwa maana ipi hasa hukumu ni ya Mungu. Tafsiri inadumisha mvutano huo badala ya kuamua fundisho pana lisilotajwa.
- issue: Nguvu ya jumla ya אִישׁ katika katazo
  choice: mtu yeyote
  alternative: mwanamume yeyote
  rationale: Ingawa nomino ya Kiebrania iko katika umoja wa kiume, hapa ina nguvu ya jumla. ‘Mtu yeyote’ ni tafsiri sahihi na ya asili katika Kiswahili bila kudokeza kwamba waamuzi wanakatazwa kuwaogopa wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa wasomaji wa kawaida. Maumbo ya amri yametumiwa kwa ulinganifu. ‘Mdogo kama mkubwa’ huhifadhi picha ya Kiebrania na tofauti ya hadhi za kijamii; muktadha unaonyesha kwamba wote wanapaswa kusikilizwa kwa usawa.
