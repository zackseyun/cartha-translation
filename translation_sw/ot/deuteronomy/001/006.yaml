  text: Yahweh our God spoke to us at Horeb[a], saying[b], “You have stayed at this mountain long enough.”
translation:
  language: sw
  text: Yahwe Mungu wetu alituambia Horebu[a], akisema[b], “Mmekaa kwenye mlima huu kwa muda wa kutosha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: Horebu, jina linalotumiwa hapa kwa mlima unaohusishwa pia na Sinai.'
    reason: cross_reference
  - marker: b
    text: Au, “Imewatosha kukaa kwenye mlima huu.” Katika muktadha, maneno haya yanafuatiwa na agizo la kuondoka.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limehifadhiwa kama jina binafsi; umbo “Yahwe” linafuata tahajia ya kawaida ya Kiswahili badala ya kulibadilisha kuwa cheo kama “BWANA.”
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Ingawa אֱלֹהִים lina umbo la wingi, hapa linamtaja Mungu wa Israeli kwa maana ya umoja na lina kiambishi cha nafsi ya kwanza wingi.
- source_word: דִּבֶּר אֵלֵינוּ
  choice: alisema nasi
  rationale: דבר ni kusema au kunena; אֶל huelekeza usemi kwa wasikilizaji. “Alisema nasi” ni Kiswahili cha kawaida kinachoonyesha kwamba Mungu aliwahutubia.
- source_word: בְּחֹרֵב
  choice: huko Horebu
  rationale: ב ni ya mahali hapa. “Huko” linafaa kwa mahali panapotajwa katika simulizi, na “Horebu” linahifadhi jina lililo katika Kiebrania bila kulinganisha kimyakimya na Sinai.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hili ni fomula ya Kiebrania inayoingiza maneno yaliyonukuliwa. “Akisema” huiwakilisha wazi, ingawa mara nyingi Kiswahili kinaweza kuiacha bila kupoteza maana.
- source_word: רַב לָכֶם שֶׁבֶת
  choice: Mmekaa ... muda wa kutosha
  rationale: Muundo huu unaonyesha kwamba muda wa kukaa umekuwa wa kutosha au umezidi. Tafsiri hii ni ya kawaida na inaunganisha רַב לָכֶם na kitenzi-jina שֶׁבֶת.
- source_word: בָּהָר הַזֶּה
  choice: kwenye mlima huu
  rationale: הַר ni “mlima,” na ב inaonyesha mahali. “Kwenye mlima huu” ni usemi wa kawaida kwa eneo walilokuwa wamekaa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi yanatumia jina la agano moja kwa moja. “Yahwe” huhifadhi jina hilo katika tahajia inayofaa Kiswahili badala ya kuweka cheo mahali pake.
- issue: Maana ya רַב לָכֶם שֶׁבֶת
  choice: Mmekaa kwenye mlima huu muda wa kutosha
  alternative: Imewatosha kukaa kwenye mlima huu; Msikae tena kwenye mlima huu
  rationale: Kiebrania kina wazo la kutosha au kuzidi bila kuweka wazi kama ni taarifa tu au amri ya kuondoka. Tafsiri kuu ni ya kawaida na haiongezi amri ya moja kwa moja, huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa wazi kwa msomaji wa kawaida, huku “akisema” ikihifadhi fomula ya Kiebrania na tanbihi zikihifadhi jina Horebu pamoja na utata wa רַב לָכֶם.
