base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/004.yaml
  text: after he had struck down Sihon king of the Amorites[a], who lived in Heshbon, and Og king of Bashan, who lived in Ashtaroth at Edrei.
translation:
  language: sw
  text: baada ya kuwapiga Sihoni, mfalme wa Waamori, aliyeishi Heshboni, na Ogu, mfalme wa Bashani, aliyeishi katika Ashtarothi, katika Edrei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au yawezekana, “aliyeishi katika Ashtarothi na Edrei.” Kiebrania hutaja maeneo yote mawili kwa kurudia neno “katika,” na uhusiano kamili kati ya maeneo hayo hauelezwi wazi kabisa.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי
  choice: baada ya
  rationale: Ni kihusishi cha wakati kinachoonyesha kuwa tendo hili lilitangulia tukio kuu la mstari wa 3; “baada ya” ni Kiswahili cha kawaida na wazi.
- source_word: הַכֹּתוֹ
  choice: yeye kumpiga
  rationale: Kitenzi נכה kina nguvu ya kumpiga au kumwangusha adui. Muundo “baada ya yeye kumpiga” unaonyesha mhusika wa nafsi ya tatu na tendo lililotangulia bila kulidhoofisha kuwa “kumshinda” tu.
- source_word: סִיחֹן
  choice: Sihoni
  rationale: Jina la mtu limeandikwa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: mfalme wa Waamori
  rationale: Muundo huu unaweka wazi cheo na kundi la watu linalotajwa na neno la Kiebrania.
- source_word: אֲשֶׁר יוֹשֵׁב
  choice: aliyekuwa akiishi
  rationale: יָשַׁב hapa ina maana ya kukaa au kuishi mahali; umbo hili la Kiswahili linafaa kwa makazi ya wakati huo.
- source_word: בְּחֶשְׁבּוֹן
  choice: Heshboni
  rationale: Kiambishi cha mahali -ni kinaonyesha maana ya בְּ kwa njia ya kawaida katika Kiswahili.
- source_word: וְאֵת
  choice: na
  rationale: וְ inaunganisha yambwa la pili, huku אֵת ikiwa alama ya yambwa maalumu isiyohitaji kutafsiriwa moja kwa moja.
- source_word: עוֹג
  choice: Ogu
  rationale: Jina la mtu limeandikwa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: מֶלֶךְ הַבָּשָׁן
  choice: mfalme wa Bashani
  rationale: Tafsiri hii inaonyesha kwa uwazi kwamba Ogu alikuwa mfalme wa eneo la Bashani.
- source_word: אֲשֶׁר יוֹשֵׁב בְּעַשְׁתָּרֹת בְּאֶדְרֶעִי
  choice: aliyekuwa akiishi Ashtarothi huko Edrei
  rationale: Kiebrania hurudia kihusishi בְּ mbele ya majina yote mawili. “Ashtarothi huko Edrei” huhifadhi majina yote bila kudai kwa uhakika kuwa kiunganishi kati yake ni “na”; tanbihi inaonyesha uwezekano huo.
