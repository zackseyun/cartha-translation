  text: And the matter seemed good in my eyes[a], so I took from among you twelve men, one man for each tribe.
translation:
  language: sw
  text: Jambo hilo lilikuwa jema machoni pangu[a], nami nikachukua kutoka miongoni mwenu wanaume kumi na wawili, mwanamume mmoja kwa kila kabila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jambo hilo lilinipendeza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב בְּעֵינַי
  choice: likawa jema machoni pangu
  rationale: Huhifadhi tathmini ya Musa na nahau ya Kiebrania “machoni pangu” kwa Kiswahili kinachoeleweka, bila kuifanya sentensi kuwa tafsiri huru kupita kiasi.
- source_word: הַדָּבָר
  choice: Jambo hilo
  rationale: Katika muktadha, neno hili linaelekeza kwenye pendekezo lililotangulia. “Jambo hilo” ni pana na la kawaida kuliko “pendekezo,” hivyo haliongezi ufafanuzi usio lazima.
- source_word: וָאֶקַּח
  choice: nikawachukua
  rationale: Hufuata maana ya msingi ya לקח, huku kiambishi cha yambwa kikiwataja wazi wale wanaume waliotwaliwa kutoka kwa watu.
- source_word: מִכֶּם
  choice: kutoka miongoni mwenu
  rationale: Huweka wazi kwamba wanaume hao walitoka ndani ya kundi la Waisraeli waliokuwa wakihutubiwa.
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: wanaume kumi na wawili
  rationale: Huwakilisha kwa usahihi wanaume watu wazima kumi na wawili waliotajwa katika Kiebrania.
- source_word: אִישׁ אֶחָד לַשָּׁבֶט
  choice: mwanamume mmoja kutoka kila kabila
  rationale: 'Hutoa wazi maana ya mgawanyo: kila kabila lilitoa mwanamume mmoja.'
