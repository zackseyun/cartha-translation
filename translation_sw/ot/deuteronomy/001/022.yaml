source:
  edition: WLC
  text: וַ/תִּקְרְב֣וּ/ן אֵלַ/י֮ כֻּלְּ/כֶם֒ וַ/תֹּאמְר֗וּ נִשְׁלְחָ֤ה אֲנָשִׁים֙ לְ/פָנֵ֔י/נוּ וְ/יַחְפְּרוּ לָ֖/נוּ אֶת הָ/אָ֑רֶץ וְ/יָשִׁ֤בוּ אֹתָ֨/נוּ֙ דָּבָ֔ר אֶת הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר נַעֲלֶה בָּ֔/הּ וְ/אֵת֙ הֶֽ/עָרִ֔ים אֲשֶׁ֥ר נָבֹ֖א אֲלֵי/הֶֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/022.yaml
  text: Then all of you came near to me and said[a], ‘Let us send men ahead of us, so that they may explore the land for us and bring us back word of the way by which we should go up into it[b], and of the cities into which we shall come.’
translation:
  language: sw
  text: Ndipo ninyi nyote mkanikaribia na kusema, “Na tutume wanaume watutangulie, ili waichunguze nchi kwa ajili yetu[a] na watuletee habari kuhusu njia tutakayopandia kwenda nchini humo[b], na kuhusu miji tutakayoingia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waipeleleze nchi kwa ajili yetu.” Kitenzi cha Kiebrania kinaweza kumaanisha kutafuta kwa makini au kuchunguza; “waichunguze” hakilazimishi maana ya ujasusi wa siri.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “njia tutakayopandia.” Neno “kupanda” linahifadhi msemo wa kawaida wa Biblia kuhusu kwenda juu kuingia katika nchi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן אֵלַי כֻּלְּכֶם
  choice: ninyi nyote mkanikaribia
  rationale: ‘Mkanikaribia’ hutoa maana halisi ya kuja karibu au kumwendea msemaji, na ‘ninyi nyote’ huhifadhi msisitizo wa כֻּלְּכֶם.
- source_word: נִשְׁלְחָה אֲנָשִׁים
  choice: Na tutume wanaume
  rationale: Muundo wa Kiebrania ni wa pendekezo au himizo la pamoja, unaotolewa kiasili kwa ‘Na tutume’; אֲנָשִׁים hapa ni wanaume walioteuliwa.
- source_word: לְפָנֵינוּ
  choice: watutangulie
  rationale: Kiswahili hiki cha kawaida huwasilisha kwa ufupi wazo la kuwatuma waende mbele ya kundi.
- source_word: וְיַחְפְּרוּ לָנוּ אֶת הָאָרֶץ
  choice: ili waichunguze nchi kwa ajili yetu
  rationale: Kitenzi חפר katika muktadha huu humaanisha kuitafuta au kuichunguza nchi. ‘Waichunguze’ hakiongezi lazima wazo la ujasusi wa siri.
- source_word: וְיָשִׁבוּ אֹתָנוּ דָּבָר
  choice: na kutuletea habari
  rationale: Hii ni njia ya asili ya Kiswahili ya kusema warudishe taarifa kwa waliowatuma, huku ikihifadhi dhana ya habari inayorejeshwa.
- source_word: אֶת הַדֶּרֶךְ אֲשֶׁר נַעֲלֶה בָּהּ
  choice: kuhusu njia tutakayopandia kwenda nchini humo
  rationale: ‘Njia’ hutoa דֶּרֶךְ, na ‘tutakayopandia’ huhifadhi kitenzi עָלָה, ‘kupanda/kwenda juu.’ ‘Nchini humo’ huweka wazi kirejeo cha kiwakilishi bila kubadili maana.
- source_word: וְאֵת הֶעָרִים אֲשֶׁר נָבֹא אֲלֵיהֶן
  choice: na kuhusu miji tutakayoingia
  rationale: Hiki ni Kiswahili cha kawaida kinachoonyesha kuwa taarifa inahitajika pia juu ya miji ambayo watu wataingia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini cha kawaida na kinachoeleweka. Muundo wa simulizi ‘Ndipo ... mkanikaribia na kusema’ unaendeleza mtiririko wa hotuba ya Musa; ‘Na tutume’ ni pendekezo la pamoja la kawaida. Alama za tanbihi [a] na [b] zimewekwa mara tu baada ya vifungu vinavyofafanuliwa.
