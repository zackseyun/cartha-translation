  naturalness: The wording is generally clear Standard East African Swahili. However, “nchi ya milima” is the more idiomatic and established expression for a mountainous/hill-country region than “nchi ya vilima,” while retaining the intended regional rather than singular-mountain sense.
  terminology: Waamori, Wakanaani, Araba, Negevu, Lebanoni, and Mto Frati are appropriate Swahili forms. “Shefela” is appropriately retained as a footnoted alternative to “nyanda za chini.”
