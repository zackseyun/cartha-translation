source:
  edition: WLC
  text: פְּנ֣וּ וּ/סְע֣וּ לָ/כֶ֗ם וּ/בֹ֨אוּ הַ֥ר הָֽ/אֱמֹרִי֮ וְ/אֶל כָּל שְׁכֵנָי/ו֒ בָּ/עֲרָבָ֥ה בָ/הָ֛ר וּ/בַ/שְּׁפֵלָ֥ה וּ/בַ/נֶּ֖גֶב וּ/בְ/ח֣וֹף הַ/יָּ֑ם אֶ֤רֶץ הַֽ/כְּנַעֲנִי֙ וְ/הַ/לְּבָנ֔וֹן עַד הַ/נָּהָ֥ר הַ/גָּדֹ֖ל נְהַר פְּרָֽת׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/007.yaml
  text: Turn and set out for yourselves[a], and go to the hill country of the Amorites and to all their neighbors in the Arabah, in the hill country, in the lowland, in the Negev, and on the coast of the sea—the land of the Canaanites—and Lebanon, as far as the great river, the Euphrates River.
translation:
  language: sw
  text: 'Geukeni, mwondoke, mwende katika nchi ya milima ya Waamori na maeneo yote yaliyo jirani nayo: katika Araba, nchi ya milima, nyanda za chini[a], Negevu, na pwani ya bahari—yaani, nchi ya Wakanaani—na Lebanoni, mpaka kwenye mto mkubwa, Mto Frati.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Shefela,” jina la eneo la nyanda za chini na vilima vya chini upande wa magharibi.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ
  choice: Geukeni
  rationale: Amri hii inaonyesha kubadili mwelekeo kabla ya kuanza safari; “Geukeni” ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: וּסְעוּ לָכֶם
  choice: mwondoke
  rationale: נסע katika muktadha wa safari humaanisha kung’oa kambi na kuanza safari. “Mwondoke” huwasilisha tendo hilo kwa lugha ya kawaida; לָכֶם ni ya kiidioma hapa, hivyo haijatafsiriwa kama “kwa ajili yenu,” jambo ambalo lingeongeza mkazo usiokusudiwa.
- source_word: וּבֹאוּ
  choice: mwende
  rationale: בוא inaweza kumaanisha kuja, kwenda, au kuingia kulingana na mtazamo. Katika mfululizo huu wa maagizo unaowaelekeza Waisraeli kwenye eneo fulani, “mwende” ni ya asili zaidi.
- source_word: הַר הָאֱמֹרִי
  choice: nchi ya vilima ya Waamori
  rationale: הַר hapa ni eneo la miinuko, si mlima mmoja; jina la kikabila limetafsiriwa kwa maana ya pamoja kuwa “Waamori.”
- source_word: שְׁכֵנָיו
  choice: maeneo yote yaliyo jirani nayo
  rationale: Neno hilo kihalisi ni “majirani zake,” lakini rejeo lake ni nchi ya vilima ya Waamori. Tafsiri hii ya kijiografia ni ya asili kwa Kiswahili bila kulazimisha dhana kwamba kinachokusudiwa ni watu pekee.
- source_word: בָּעֲרָבָה
  choice: katika Araba
  rationale: עֲרָבָה hapa ni jina la eneo la bonde la ufa wa Yordani; kulihifadhi kama “Araba” huepuka kulifanya kuwa uwanda wowote wa kawaida.
- source_word: בָהָר
  choice: nchi ya vilima
  rationale: Katika orodha ya maeneo, הַר hurejelea ukanda wa miinuko kwa ujumla.
- source_word: וּבַשְּׁפֵלָה
  choice: nyanda za chini
  rationale: שְׁפֵלָה ni ukanda wa chini, hasa vilima vya chini vya upande wa magharibi. Tafsiri inayoeleweka imetumiwa katika matini, huku jina maalumu “Shefela” likihifadhiwa katika tanbihi.
- source_word: וּבַנֶּגֶב
  choice: Negevu
  rationale: Katika orodha hii ya kijiografia, נֶגֶב ni jina la eneo la kusini, si mwelekeo wa “kusini” tu.
- source_word: וּבְחוֹף הַיָּם
  choice: na pwani ya bahari
  rationale: חוֹף humaanisha ufuo au pwani; “pwani ya bahari” huhifadhi usemi wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: אֶרֶץ הַכְּנַעֲנִי
  choice: nchi ya Wakanaani
  rationale: Jina la kikabila la umoja limetumiwa kwa maana ya pamoja, hivyo “Wakanaani” ni wazi na ya kawaida.
- source_word: וְהַלְּבָנוֹן
  choice: na Lebanoni
  rationale: Jina la mahali limetolewa katika umbo lake la kawaida la Kiswahili.
- source_word: הַנָּהָר הַגָּדֹל נְהַר פְּרָת
  choice: mto mkubwa, Mto Frati
  rationale: Huhifadhi urudiaji wa maelezo na jina la mto katika Kiebrania huku ikitumia jina la kawaida la Kiswahili, “Frati.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima lakini unaoeleweka kwa urahisi. Orodha ya maeneo imewekewa alama za uakifishaji ili mahusiano yake yawe wazi bila kuondoa msongamano wa kijiografia wa Kiebrania. Alama ya tanbihi imewekwa baada ya “nyanda za chini,” ambako mbadala wa “Shefela” unahusika.
