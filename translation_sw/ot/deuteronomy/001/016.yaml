source:
  edition: WLC
  text: וָ/אֲצַוֶּה֙ אֶת שֹׁ֣פְטֵי/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר שָׁמֹ֤עַ בֵּין אֲחֵי/כֶם֙ וּ/שְׁפַטְתֶּ֣ם צֶ֔דֶק בֵּֽין אִ֥ישׁ וּ/בֵין אָחִ֖י/ו וּ/בֵ֥ין גֵּרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/016.yaml
  text: And at that time I commanded your judges[a], saying, ‘Hear the cases between your brothers[c][b], and judge righteously between a man and his brother or the resident foreigner with him.’
translation:
  language: sw
  text: 'Wakati huo niliwaamuru waamuzi wenu hivi: “Sikilizeni mashauri kati ya ndugu zenu[a], na hukumuni kwa haki[b] kati ya mtu na ndugu yake na mgeni mkazi wake[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Sikilizeni migogoro miongoni mwa ndugu zenu.” Neno “ndugu” hapa linawataja washiriki wenzao wa jamii ya Israeli.
    reason: lexical_alternative
  - marker: b
    text: Au “hukumuni kwa uadilifu.” Neno la Kiebrania צֶדֶק (tsedeq) linaweza kuonyesha haki ya kisheria pamoja na unyofu wa kimaadili.
    reason: lexical_alternative
  - marker: c
    text: Au “mgeni wake aliye mkazi.” Neno la Kiebrania גֵּר (ger) linamaanisha mtu asiye mzawa aliyeishi miongoni mwa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: niliwaamuru
  rationale: Kitenzi צוה kinaonyesha kutoa amri yenye mamlaka; “niliwaamuru” ni tafsiri ya moja kwa moja na ya kawaida katika muktadha huu.
- source_word: שֹׁפְטֵיכֶם
  choice: waamuzi wenu
  rationale: Nomino hii inawataja watu waliowekwa kuamua mashauri ya kisheria. “Waamuzi” ni neno la kawaida na linaloeleweka katika Kiswahili cha sasa.
- source_word: בָּעֵת הַהִוא
  choice: Wakati huo
  rationale: Hii ni tafsiri ya kawaida ya kirai cha wakati kinachorejelea kipindi kilichotajwa katika simulizi.
- source_word: לֵאמֹר
  choice: 'hivi:'
  rationale: Infinitivu hii inaanzisha maneno ya amri. Katika Kiswahili, “hivi:” huleta usemi unaofuata kwa ufasaha kuliko kuiga muundo wa Kiebrania kwa “akisema.”
- source_word: שָׁמֹעַ בֵּין אֲחֵיכֶם
  choice: Sikilizeni mashauri kati ya ndugu zenu
  rationale: שׁמע hapa ni amri ya kusikiliza katika mazingira ya kimahakama. Kuongeza “mashauri” kunafafanua maana inayodokezwa na muktadha bila kubadili tendo lenyewe. “Ndugu zenu” huhifadhi lugha ya kindugu ya jumuiya ya agano.
- source_word: וּשְׁפַטְתֶּם צֶדֶק
  choice: na mhukumu kwa haki
  rationale: צֶדֶק inaeleza hukumu iliyo sawa na ya uadilifu. “Mhukumu kwa haki” ni usemi wa asili wa Kiswahili unaohifadhi uzito wa kimaadili na wa kisheria.
- source_word: בֵּין אִישׁ וּבֵין אָחִיו
  choice: kati ya mtu na ndugu yake
  rationale: Tafsiri hii huhifadhi muundo halisi na lugha ya kindugu ya Kiebrania badala ya kuipanua kuwa “mtu na mwenzake.”
- source_word: גֵּרוֹ
  choice: mgeni anayeishi pamoja naye
  rationale: גֵּר ni mtu asiye mzawa lakini mwenye makazi miongoni mwa jamii. Kirai hiki kinaonyesha ugeni wake na pia ukaaji wake wa kudumu kiasi, huku “pamoja naye” kikihifadhi kiambishi cha umilikaji katika Kiebrania.
theological_decisions:
- issue: Lugha ya kindugu katika אֲחֵיכֶם na אָחִיו
  choice: ndugu zenu / ndugu yake
  alternative: Waisraeli wenzenu / mwenzake
  rationale: Kiebrania hutumia maneno ya kindugu yenye nguvu ya uwakilishi katika jumuiya ya agano. Kuyahifadhi huzuia kufuta taswira hiyo bila kuyawekea matumizi ya wanaume pekee.
- issue: Maana ya צֶדֶק katika mazingira ya kimahakama
  choice: kwa haki
  alternative: kwa uadilifu
  rationale: Neno hilo linaweza kuhusisha haki ya kisheria na unyofu wa kimaadili. “Kwa haki” ni la kawaida katika Kiswahili cha kimahakama na haliondoi kabisa uzito wa kimaadili.
- issue: Utambulisho wa גֵּר
  choice: mgeni anayeishi pamoja naye
  alternative: mgeni mkazi wake / mgeni anayekaa kwake
  rationale: Tafsiri iliyochaguliwa inaonyesha kwamba huyu si msafiri wa muda mfupi, bali asiye mzawa anayeishi katika mazingira ya jamii na aliye chini ya ulinzi wa sheria, bila kuingiza hadhi ya kisasa ya uraia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa Kiebrania umehifadhiwa pale unaposomeka kwa kawaida; “mashauri” na “hivi:” zimetumiwa kwa ulinganifu mwafaka ili kutoa wazi mazingira ya kimahakama na kuleta usemi kwa ufasaha.
