source:
  edition: WLC
  text: שָׁל֣וֹשׁ פְּעָמִ֣ים בַּ/שָּׁנָ֡ה יֵרָאֶ֨ה כָל זְכוּרְ/ךָ֜ אֶת פְּנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּקוֹם֙ אֲשֶׁ֣ר יִבְחָ֔ר בְּ/חַ֧ג הַ/מַּצּ֛וֹת וּ/בְ/חַ֥ג הַ/שָּׁבֻע֖וֹת וּ/בְ/חַ֣ג הַ/סֻּכּ֑וֹת וְ/לֹ֧א יֵרָאֶ֛ה אֶת פְּנֵ֥י יְהוָ֖ה רֵיקָֽם׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/016.yaml
  text: 'Three times a year all your males shall appear before Yahweh your God in the place that he will choose: at the Feast of Unleavened Bread[a], at the Feast of Weeks, and at the Feast of Booths[c][b]. No one shall appear before Yahweh empty-handed.'
translation:
  language: sw
  text: 'Mara tatu kwa mwaka, wanaume wote walio miongoni mwenu watajionyesha[a] mbele za Yahwe Mungu wenu, mahali atakapochagua: katika Sikukuu ya Mikate Isiyotiwa Chachu, Sikukuu ya Majuma, na Sikukuu ya Vibanda[b]. Wala mtu yeyote asijionyeshe mbele za Yahwe mikono mitupu.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wataonekana mbele za Yahwe.” Kitenzi cha Kiebrania kina umbo la kauli tendwa au kujirejelea, lakini hapa ni nahau ya kufika na kujihudhurisha mbele za Mungu.
    reason: lexical_alternative
  - marker: b
    text: “Sikukuu ya Vibanda” pia hujulikana kimapokeo kama “Sikukuu ya Maskani.”
    reason: alternative_reading
  - marker: c
    text: “Mikono mitupu” humaanisha kufika bila zawadi au sadaka iliyotakiwa.
    reason: cultural_note
lexical_decisions:
- source_word: יֵרָאֶה
  choice: watatokea
  rationale: Nifali ya ראה hapa ni nahau ya kuhudhuria au kujionyesha mbele za Mungu katika sikukuu za hija. “Watatokea” ni Kiswahili cha kawaida kinachohifadhi wazo la kufika mbele zake bila kulazimisha maana ya kauli tendwa.
- source_word: כָל זְכוּרְךָ
  choice: wanaume wote walio miongoni mwenu
  rationale: Kirai cha Kiebrania kinawataja wazi wanaume wanaowajibika kuhudhuria; tafsiri hii inalinda upeo wa kisheria wa asili huku ikiwa ya kawaida katika Kiswahili.
- source_word: פְּנֵי יְהוָה אֱלֹהֶיךָ
  choice: mbele za Yahwe Mungu wenu
  rationale: “Mbele za” huwasilisha nahau ya Kiebrania inayomaanisha kuwa katika uwepo wa Mungu; Yahwe huhifadhi jina binafsi la agano.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחָר
  choice: mahali atakapochagua
  rationale: Muundo huu wa Kiswahili huhifadhi tendo la Mungu la kuchagua mahali, lenye uzito mkubwa katika Kumbukumbu la Torati.
- source_word: חַג הַמַּצּוֹת
  choice: Sikukuu ya Mikate Isiyotiwa Chachu
  rationale: Hili ni jina wazi na lililozoeleka la sikukuu, linaloonyesha kwamba mikate hiyo haikuchachushwa.
- source_word: חַג הַשָּׁבֻעוֹת
  choice: Sikukuu ya Majuma
  rationale: Tafsiri ya moja kwa moja ya jina la Kiebrania, bila kuingiza jina la baadaye “Pentekoste” katika muktadha huu.
- source_word: חַג הַסֻּכּוֹת
  choice: Sikukuu ya Vibanda
  rationale: “Vibanda” huakisi סֻכּוֹת moja kwa moja na ni neno linaloeleweka kwa wasomaji wa sasa.
- source_word: רֵיקָם
  choice: mikono mitupu
  rationale: Katika muktadha wa ibada, neno hili linakataza kufika bila zawadi au sadaka inayotakiwa; nahau ya Kiswahili “mikono mitupu” huwasilisha maana hiyo kwa kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la Mungu יהוה, si cheo tu. “Yahwe” hulihifadhi kama jina binafsi la agano bila kulibadilisha kuwa cheo.
- issue: Wajibu wa kijinsia katika כָל זְכוּרְךָ
  choice: wanaume wote walio miongoni mwenu
  alternative: watu wote walio miongoni mwenu
  rationale: Chanzo kinawataja wanaume waziwazi. Kutumia “watu wote” kungepanua wajibu wa kisheria kuliko usemi wa maandishi.
- issue: Kauli ya יֵרָאֶה
  choice: watatokea mbele za Yahwe
  alternative: wataonekana mbele za Yahwe
  rationale: Umbo la Kiebrania linaweza kutafsiriwa kihalisi kwa kauli tendwa au kujirejelea, lakini katika sheria hii hutenda kama nahau ya kufika na kujihudhurisha mbele za Mungu. Tanbihi inalinda uwezekano wa umbo la kihalisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Majina ya sikukuu yametafsiriwa kwa uwazi; muundo wa sentensi umefanywa wa kawaida bila kuondoa marudio na msisitizo wa sheria ya Kiebrania.
