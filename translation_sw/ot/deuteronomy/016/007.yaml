  text: And you shall cook it and eat it in the place that the LORD your God will choose for it, and in the morning you shall turn and go to your tents.
translation:
  language: sw
  text: Nawe utaipika na kuila mahali BWANA Mungu wako atakapochagua[a]; asubuhi utarejea kwenye mahema yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kiambishi kinachofuata "atachagua" kinaweza pia kueleweka kwa maana ya mahali, yaani "humo" au "katika mahali hapo."
    reason: Huhifadhi utata wa בּוֹ bila kuingiza maana ya "kwa ajili yake" katika matini kuu.
lexical_decisions:
- source_word: וּבִשַּׁלְתָּ
  choice: utaipika
  rationale: Kitenzi בשׁל kinaweza kumaanisha kupika au kuchemsha; hapa ‘kupika’ ni neno la kawaida na pana linalofaa kwa maandalizi ya mnyama wa Pasaka.
- source_word: בַּמָּקוֹם
  choice: mahali
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya neno linalomaanisha eneo au mahali.
- source_word: בּוֹ
  choice: kwa ajili yake
  rationale: Kiambishi hiki kwa umbo lake kinaweza kueleweka kuwa ‘humo’ au ‘kwa ajili yake.’ Muktadha wa kuchagua mahali unaruhusu ‘kwa ajili yake,’ sambamba na ushahidi wa maandishi ya Kiingereza yaliyokaguliwa, bila kuongeza maelezo ya kiibada.
- source_word: וּפָנִיתָ
  choice: utageuka
  rationale: Huhifadhi maana halisi ya kugeuka, ambayo katika muktadha inaongoza kwenye kuondoka kwenda nyumbani.
- source_word: לְאֹהָלֶיךָ
  choice: kwenye mahema yako
  rationale: Huhifadhi taswira halisi ya ‘mahema yako’; neno hilo linaweza pia kuelekeza kwa makao ya msikilizaji.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ ni uwakilishi wa kawaida katika Biblia za Kiswahili na unadumisha desturi ya kulisoma jina la agano kwa cheo hicho bila kuingiza msimamo wa dhehebu.
- issue: Rejeo la בּוֹ baada ya mahali palipochaguliwa
  choice: kwa ajili yake
  alternative: humo
  rationale: Kisarufi rejeo hilo lina mvutano wa maana. Tafsiri kuu inafuata ‘kwa ajili yake’ kama ilivyo katika safu ya Kiingereza iliyokaguliwa, huku uwezekano wa ‘humo’ ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi inadumisha mtiririko wa maagizo ya Kiebrania na taswira ya ‘mahema.’
