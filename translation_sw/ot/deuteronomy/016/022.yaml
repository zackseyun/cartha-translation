  yaml_path: translation/ot/deuteronomy/016/022.yaml
  text: And you shall not set up for yourself a pillar[a], which Yahweh your God hates.
translation:
  language: sw
  text: Wala usijisimamishie nguzo[a], ambayo Yahwe Mungu wako anaichukia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jiwe lililosimamishwa” au “nguzo ya ibada.” Neno la Kiebrania linamaanisha jiwe lililosimamishwa, ambalo katika muktadha huu linahusishwa na ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקִים לְךָ
  choice: usijisimamishie
  rationale: Muundo huu unaonyesha kusimamisha kitu kwa ajili yako mwenyewe, huku ukitoa katazo hilo kwa Kiswahili cha kawaida na kwa ufupi.
- source_word: מַצֵּבָה
  choice: nguzo
  rationale: Neno hilo linamaanisha jiwe lililosimamishwa kama nguzo au kumbukumbu, mara nyingi likihusishwa na ibada. “Nguzo” ni neno linaloeleweka kwa urahisi, huku maelezo ya chini yakihifadhi maana mahsusi ya kitu hicho bila kuipanua kimyakimya katika matini kuu.
- source_word: שָׂנֵא
  choice: anaichukia
  rationale: Kitenzi hiki kinaonyesha chuki au kukataa kwa nguvu; “anaichukia” kinadumisha uzito wake bila kuupunguza.
- source_word: יְהוָה
  choice: Yahwe
  rationale: “Yahwe” ni umbo la Kiswahili la jina la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Tafsiri hii inahifadhi kiwakilishi cha nafsi ya pili na lugha ya uhusiano wa agano.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania inatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kidini ya מַצֵּבָה
  choice: nguzo, pamoja na tanbihi inayofafanua jiwe lililosimamishwa kwa matumizi ya ibada
  alternative: nguzo takatifu
  rationale: Muktadha unaonyesha uhusiano na ibada, lakini neno lenyewe linaweza kutaja jiwe au nguzo iliyosimamishwa. Tafsiri kuu ya “nguzo” huepuka kuongeza kivumishi kisichotajwa wazi, na tanbihi huhifadhi maana ya muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wa moja kwa moja, na unaoeleweka kwa wasomaji wa kawaida. “Wala” linaunganisha katazo hili na muktadha uliotangulia.
