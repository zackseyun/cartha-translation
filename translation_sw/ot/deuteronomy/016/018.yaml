source:
  edition: WLC
  text: שֹׁפְטִ֣ים וְ/שֹֽׁטְרִ֗ים תִּֽתֶּן לְ/ךָ֙ בְּ/כָל שְׁעָרֶ֔י/ךָ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לְ/ךָ֖ לִ/שְׁבָטֶ֑י/ךָ וְ/שָׁפְט֥וּ אֶת הָ/עָ֖ם מִשְׁפַּט צֶֽדֶק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/018.yaml
  text: You shall appoint judges and officers for yourself in all your gates that Yahweh your God is giving you[a], according to your tribes[b], and they shall judge the people with righteous judgment.
translation:
  language: sw
  text: Jiteulie waamuzi na maofisa katika malango yako yote[a] ambayo Yahwe, Mungu wako, anakupa, kwa kadiri ya makabila yako; nao watawahukumu watu kwa hukumu ya haki.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika miji yako yote.” Kwa neno halisi, “katika malango yako yote”; maeneo ya malangoni yalitumika kama vituo vya shughuli za kiraia na za kimahakama.
    reason: cultural_note
  - marker: b
    text: Au, “kwa hukumu yenye uadilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטִים
  choice: waamuzi
  rationale: Neno hili linamaanisha watu wenye mamlaka ya kutoa maamuzi ya kisheria. “Waamuzi” ni neno la kawaida na linaendeleza uhusiano wake na kitenzi “watawahukumu” katika sehemu ya mwisho ya aya.
- source_word: שֹׁטְרִים
  choice: maofisa
  rationale: Neno hili linataja maofisa wa utawala waliohusika katika utekelezaji wa utaratibu wa kisheria. “Maofisa” huhifadhi maana pana bila kubainisha kazi yao kuliko chanzo kinavyofanya.
- source_word: תִּתֶּן לְךָ
  choice: jiwekee
  rationale: Ingawa kitenzi kimsingi ni “weka/toa,” katika muktadha huu kina maana ya kuwateua watu kushika madaraka. “Jiwekee” pia huhifadhi wazo la לְךָ, yaani “kwa ajili yako.”
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: katika malango yako yote
  rationale: Tafsiri hii huhifadhi taswira halisi ya malango, ambayo katika miji ya kale yalikuwa maeneo ya shughuli za kiraia na utoaji wa hukumu. Tanbihi inaeleza maana yake ya kimuktadha.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi YHWH limetolewa kama jina binafsi, si kubadilishwa na cheo. Umbo “Yahwe” linafuata tahajia ya kawaida ya Kiswahili.
- source_word: לִשְׁבָטֶיךָ
  choice: kwa kufuata makabila yako
  rationale: Kirai hiki kinaweza kueleza mpangilio au mgawanyo wa uteuzi kwa misingi ya makabila. Tafsiri hii hudokeza muundo huo bila kudai kwamba maofisa walikuwa mali ya makabila.
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: nao watawahukumu watu
  rationale: Kitenzi kina maana ya kimahakama katika muktadha huu; “watawahukumu” kinaonyesha wazi kazi ya waamuzi waliotajwa.
- source_word: מִשְׁפַּט צֶדֶק
  choice: kwa hukumu ya haki
  rationale: Kirai hiki huunganisha uamuzi wa kisheria na unyoofu wa kimaadili. “Hukumu ya haki” huhifadhi pande zote mbili kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu, YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha na cheo, huku tahajia ikilingana na matumizi ya Kiswahili.
- issue: Maana ya מִשְׁפַּט צֶדֶק
  choice: hukumu ya haki
  alternative: hukumu ya uadilifu
  rationale: “Haki” hapa inaweza kuonyesha uamuzi ulio sawa kisheria na ulionyooka kimaadili, bila kuufanya usemi kuwa fundisho maalumu la kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya “malango” imehifadhiwa katika matini na kufafanuliwa katika tanbihi. Alama za tanbihi zimewekwa baada ya maneno yanayohusika; alama [b] imeunganishwa na “hukumu ya haki,” si na “makabila yako.”
