base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/010.yaml
  text: Then you shall celebrate the Feast of Weeks to Yahweh your God with a tribute of a freewill offering from your hand[a], which you shall give according to how Yahweh your God blesses you.
translation:
  language: sw
  text: Kisha utaadhimisha Sikukuu ya Majuma kwa Yahwe, Mungu wako, kwa kipimo cha sadaka ya hiari ya mkono wako utakayotoa, kulingana na jinsi Yahwe, Mungu wako, atakavyokubariki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Kisha utaadhimisha
  rationale: Katika muktadha wa sikukuu, עשה pamoja na חג humaanisha kuadhimisha sikukuu; “Kisha” linaonyesha mwendelezo wa maagizo katika muktadha.
- source_word: חַג שָׁבֻעוֹת
  choice: Sikukuu ya Majuma
  rationale: Hili ni jina la sikukuu linalohusiana na kuhesabiwa kwa majuma saba katika muktadha.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: kwa ajili ya Yahwe Mungu wako
  rationale: Kihusishi ל huonyesha kuwa sikukuu inaelekezwa au kuwekwa wakfu kwa Yahwe; “kwa ajili ya” ni Kiswahili cha kawaida na chenye heshima.
- source_word: מִסַּת
  choice: kwa kadiri ya
  rationale: Neno hili linaweza kuonyesha kipimo, kiasi, au uwiano; “kwa kadiri ya” linahifadhi wazo la kiasi kinacholingana bila kulifanya kuwa ushuru wa lazima.
- source_word: נִדְבַת יָדְךָ
  choice: sadaka ya hiari kutoka mkononi mwako
  rationale: נִדְבָה ni toleo la hiari, na taswira ya “mkono wako” imehifadhiwa ili kuonyesha utoaji wa mtu mwenyewe.
- source_word: אֲשֶׁר תִּתֵּן
  choice: utakayotoa
  rationale: Kishazi hiki kinarejelea sadaka na kinafaa kwa mtindo wa agizo la kisheria.
- source_word: כַּאֲשֶׁר יְבָרֶכְךָ
  choice: kulingana na jinsi ... atakavyokubariki
  rationale: Kifungu hiki kinaonyesha kwamba kiasi cha sadaka kilingane na baraka ambazo Mungu atampa mtoaji.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahwe Mungu wako
  rationale: Jina la agano יהוה limetafsiriwa moja kwa moja kuwa “Yahwe,” huku tamko lote la uhusiano wa agano likihifadhiwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina יהוה moja kwa moja. “Yahwe” hulihifadhi kama jina la agano badala ya kulibadili kuwa cheo.
- issue: Uhusiano kati ya hiari ya sadaka na uwiano wake kwa baraka
  choice: Sadaka imeelezwa kuwa ya hiari, lakini kiasi chake kinalinganishwa na baraka za Mungu
  alternative: Kuitafsiri kama ushuru wa kiwango kilichowekwa
  rationale: נִדְבָה husisitiza hiari, ilhali מִסַּת na כַּאֲשֶׁר יְבָרֶכְךָ huonyesha kipimo au uwiano; tafsiri haipaswi kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. “Sikukuu ya Majuma” ni jina wazi la sikukuu, na nahau ya Kiebrania kuhusu mkono imehifadhiwa katika matini huku ufafanuzi wake ukiwekwa katika tanbihi.
