  edition: WLC
  text: לֹא תֹאכַ֤ל עָלָי/ו֙ חָמֵ֔ץ שִׁבְעַ֥ת יָמִ֛ים תֹּֽאכַל עָלָ֥י/ו מַצּ֖וֹת לֶ֣חֶם עֹ֑נִי כִּ֣י בְ/חִפָּז֗וֹן יָצָ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לְמַ֣עַן תִּזְכֹּר֔ אֶת י֤וֹם צֵֽאתְ/ךָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/003.yaml
  text: You shall not eat leavened bread with it. Seven days you shall eat with it unleavened bread[a], the bread of affliction, because you came out from the land of Egypt in haste, so that you may remember the day of your coming out from the land of Egypt all the days of your life.
translation:
  language: sw
  text: Usile pamoja nayo mkate wenye chachu. Siku saba utakula pamoja nayo mikate isiyotiwa chachu, mkate wa mateso[a], kwa sababu ulitoka katika nchi ya Misri kwa haraka, ili ukumbuke siku uliyotoka katika nchi ya Misri siku zote za maisha yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkate wa umaskini” au “mkate wa taabu.” Usemi wa Kiebrania unaweza kusisitiza mateso, ukosefu, au taabu zinazohusiana na kutoka Misri.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: pamoja nayo
  rationale: Katika muktadha wa mlo wa Pasaka, kihusishi hiki kinaonyesha chakula kinacholiwa pamoja na dhabihu; “pamoja nayo” ni Kiswahili cha kawaida na hudumisha rejeo lake bila kulitaja upya.
- source_word: חָמֵץ
  choice: mkate wenye chachu
  rationale: Katika muktadha huu neno linamaanisha chakula kilichochachushwa, hasa mkate, si chachu kama kiambato pekee.
- source_word: מַצּוֹת
  choice: mikate isiyotiwa chachu
  rationale: Hii inaeleza wazi chakula cha sikukuu kinachokusudiwa na wingi wa nomino ya Kiebrania.
- source_word: לֶחֶם עֹנִי
  choice: mkate wa mateso
  rationale: “Mateso” huhifadhi uzito wa taabu na dhiki zinazohusishwa na kutoka Misri bila kufupisha maana kuwa umaskini wa kiuchumi pekee; tanbihi inadumisha uwezekano mwingine wa kileksika.
- source_word: בְחִפָּזוֹן
  choice: kwa haraka
  rationale: Usemi huu wa kawaida unaonyesha kuondoka kwa hima bila kuongeza wazo lisilotajwa wazi, kama hofu au kukimbia.
- source_word: לְמַעַן תִּזְכֹּר
  choice: ili ukumbuke
  rationale: Muundo huu huonyesha kusudi la agizo kwa Kiswahili cha kawaida na sahihi.
- source_word: יוֹם צֵאתְךָ
  choice: siku uliyotoka
  rationale: Hii ni njia ya asili ya Kiswahili ya kuwasilisha usemi wa Kiebrania kuhusu siku ya kutoka, huku ikidumisha mwangwi wa kitenzi “ulitoka” kilichotangulia.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: siku zote za maisha yako
  rationale: Usemi huu hudumisha wazo la kukumbuka daima katika muda wote wa maisha.
theological_decisions:
- issue: Maana ya לֶחֶם עֹנִי katika ukumbusho wa kutoka Misri
  choice: mkate wa mateso
  alternative: mkate wa umaskini; mkate wa taabu
  rationale: Tafsiri kuu inadumisha uhusiano wa mkate huu na dhiki ya Israeli na ukombozi wake, lakini tanbihi inaonyesha kwamba neno la Kiebrania linaweza pia kusisitiza umaskini au hali ya taabu; hivyo utata halisi hauondolewi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zinabaki karibu na mpangilio wa Kiebrania, lakini “siku uliyotoka” na “pamoja nayo” zimetumiwa kwa ufasaha wa kawaida. Umoja “mkate wa mateso” umehifadhiwa baada ya wingi “mikate isiyotiwa chachu” kwa kuwa ni maelezo ya aina au tabia ya mikate hiyo.
