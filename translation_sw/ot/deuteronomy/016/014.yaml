  source_fidelity: 'Tafsiri inafuata kwa uaminifu orodha na muundo wa Kiebrania: agizo la kufurahi, sikukuu, washiriki wote waliotajwa, na kirai cha mwisho kinachowahusu walio “ndani ya malango yako.” “Ufurahi” huwasilisha vizuri nguvu ya maagizo katika muktadha huu.'
