id: DEU.16.14
reference: Deuteronomy 16:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/שָׂמַחְתָּ֖ בְּ/חַגֶּ֑/ךָ אַתָּ֨ה וּ/בִנְ/ךָ֤ וּ/בִתֶּ֨/ךָ֙ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ֔/ךָ וְ/הַ/לֵּוִ֗י וְ/הַ/גֵּ֛ר וְ/הַ/יָּת֥וֹם וְ/הָ/אַלְמָנָ֖ה אֲשֶׁ֥ר בִּ/שְׁעָרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/014.yaml
  text: And you shall rejoice in your festival—you and your son and your daughter[a], and your male servant and your female servant, and the Levite, and the sojourner, and the fatherless, and the widow[d][c][b], who are within your gates.
translation:
  language: sw
  text: Ufurahi katika sikukuu yako[a]—wewe, mwanao na binti yako, mtumwa wako wa kiume na mtumwa wako wa kike, Mlawi, mgeni mkazi[b], yatima[c], na mjane walio ndani ya malango yako.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakati wa sikukuu yako.” Neno la Kiebrania חַג linaweza kumaanisha sikukuu au sherehe yake.
    reason: lexical_alternative
  - marker: b
    text: “Mgeni mkazi” ni mtu asiye Mwisraeli aliyeishi miongoni mwa Israeli.
    reason: cultural_note
  - marker: c
    text: Au “asiye na baba.” Katika sheria ya Torati, neno la Kiebrania linasisitiza hali ya mtu aliyekosa ulinzi wa baba na hivyo kuwa katika mazingira hatarishi.
    reason: lexical_alternative
  - marker: d
    text: “Ndani ya malango yako” ni nahau ya Kiebrania inayomaanisha ndani ya miji au jumuiya zako.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: Ufurahi
  rationale: Katika muktadha huu wa maagizo, umbo hili lina nguvu ya amri; hali ya kutaka katika Kiswahili huwasilisha agizo hilo kwa lugha ya kawaida na yenye heshima.
- source_word: בְּחַגֶּךָ
  choice: katika sikukuu yako
  rationale: חַג ni sikukuu ya kidini yenye sherehe; “sikukuu” ni neno la kawaida la Kiswahili linalohifadhi maana hiyo.
- source_word: אַתָּה
  choice: wewe
  rationale: Kiwakilishi huru cha Kiebrania kinasisitiza anayehutubiwa; “wewe” baada ya kistari huhifadhi msisitizo huo.
- source_word: וּבִנְךָ וּבִתֶּךָ
  choice: mwanao na binti yako
  rationale: Hutafsiri mahusiano ya kifamilia kwa Kiswahili cha kawaida; umoja wa Kiebrania umetumiwa kwa maana ya kila mmoja katika agizo la jumla.
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: mtumwa wako wa kiume na mtumwa wako wa kike
  rationale: Maneno hayo yanaweza kumaanisha watumishi au watumwa, lakini katika orodha hii ya kijamii yanaonyesha hadhi ya utegemezi na utumwa; kutaja jinsia huhifadhi utofautishaji wa Kiebrania.
- source_word: וְהַלֵּוִי
  choice: Mlawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa mtu wa kabila la Lawi.
- source_word: וְהַגֵּר
  choice: mgeni mkazi
  rationale: גֵּר humaanisha mtu asiye mwenyeji aliyeishi miongoni mwa Israeli; “mgeni mkazi” huhifadhi hali yake ya kuwa mgeni na pia makazi yake ya kudumu kiasi.
- source_word: וְהַיָּתוֹם
  choice: yatima
  rationale: “Yatima” ni neno la kawaida linaloweza kuonyesha mtu aliyepoteza mzazi au wazazi na kuhifadhi hali ya udhaifu wa kijamii inayolengwa na sheria.
- source_word: וְהָאַלְמָנָה
  choice: mjane
  rationale: Hili ni neno la kawaida na sahihi la Kiswahili kwa אַלְמָנָה.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: walio ndani ya malango yako
  rationale: Tafsiri hii huhifadhi taswira ya Kiebrania, ambamo “malango” huwakilisha miji au jumuiya zilizo chini ya mamlaka ya anayehutubiwa.
theological_decisions:
- issue: Hadhi ya kijamii katika עֶבֶד na אָמָה
  choice: mtumwa wako wa kiume na mtumwa wako wa kike
  alternative: mtumishi wako wa kiume na mtumishi wako wa kike
  rationale: “Mtumwa” huepuka kuficha hadhi ya utegemezi iliyomo katika orodha hii, huku maandiko yenyewe yakisisitiza kwamba watu hao pia washiriki katika furaha ya sikukuu.
- issue: Utambulisho wa גֵּר
  choice: mgeni mkazi
  alternative: mgeni; mhamiaji
  rationale: Chaguo hili halimfanyi kuwa mgeni wa muda tu wala kuingiza makundi ya kisasa ya uhamiaji; linaonyesha asiye Mwisraeli anayeishi katika jumuiya.
- issue: Maana ya יָתוֹם
  choice: yatima
  alternative: asiye na baba
  rationale: “Yatima” ni ya kawaida na huacha wazi upeo wa neno, huku tanbihi ikieleza kwamba katika sheria ya Torati msisitizo unaweza kuwa kupoteza ulinzi wa baba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaosomeka kwa urahisi. Kistari kinahifadhi msisitizo wa orodha baada ya “wewe,” na nahau ya “malango” imehifadhiwa katika andiko huku ikifafanuliwa katika tanbihi.
