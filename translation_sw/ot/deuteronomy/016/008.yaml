base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/008.yaml
  text: For six days you shall eat unleavened bread[a], and on the seventh day there shall be a solemn assembly to Yahweh your God; you shall do no work.
translation:
  language: sw
  text: Kwa siku sita utakula mikate isiyotiwa chachu, na siku ya saba kutakuwa na kusanyiko la ibada[a] kwa ajili ya Yahwe, Mungu wako; usifanye kazi yoyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kusanyiko takatifu” au “kusanyiko la kuhitimisha.” Neno la Kiebrania linamaanisha mkusanyiko rasmi wa sikukuu, huenda likiwa pia na wazo la mkusanyiko unaohitimisha sikukuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Kwa siku sita
  rationale: Kirai hiki kinaonyesha muda; ‘kwa siku sita’ ni Kiswahili cha kawaida kinachowasilisha maana hiyo wazi.
- source_word: תֹּאכַל
  choice: utakula
  rationale: Wakati ujao katika muktadha huu wa sheria una nguvu ya agizo, na ‘utakula’ huiwasilisha kwa lugha ya kawaida bila kuifanya ruhusa.
- source_word: מַצּוֹת
  choice: mikate isiyotiwa chachu
  rationale: Hii ndiyo maana ya kawaida katika muktadha wa Pasaka; wingi ‘mikate’ unaakisi umbo la Kiebrania na usemi unaeleweka kwa wasomaji wa Kiswahili.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: na siku ya saba
  rationale: Kiunganishi וּ kimetafsiriwa kwa maana yake ya moja kwa moja ‘na’; hakuna ulazima wa kukifanya kiwe cha upinzani.
- source_word: עֲצֶרֶת
  choice: kusanyiko maalumu
  rationale: Neno hili huelekeza kwenye mkusanyiko rasmi wa sikukuu na huenda pia likawa na wazo la kuhitimisha sikukuu. ‘Kusanyiko maalumu’ linahifadhi upana huo bila kuongeza moja kwa moja dhana ya utakatifu au kuhitimisha.
- source_word: לַיהוָה
  choice: kwa ajili ya Yahwe
  rationale: Kihusishi ל kinaonyesha kuwa kusanyiko limewekwa kwa Yahwe au linafanywa kwa ajili yake; usemi huu ni wa asili katika Kiswahili.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huu ni usemi wa kawaida wa agano unaofuata jina la Mungu na unahifadhi nafsi ya pili umoja.
- source_word: לֹא תַעֲשֶׂה מְלָאכָה
  choice: usifanye kazi yoyote
  rationale: Katazo hili linahusu kufanya kazi; ‘yoyote’ huwasilisha upeo wa nomino isiyo na kibainishi kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano יהוה. ‘Yahwe’ linawakilisha jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Maana ya עֲצֶרֶת katika sikukuu
  choice: kusanyiko maalumu
  alternative: kusanyiko takatifu; kusanyiko la kuhitimisha
  rationale: Neno linaweza kusisitiza mkusanyiko rasmi na huenda likadokeza hitimisho la sikukuu. Tafsiri kuu haifungi maana kwenye mojawapo ya dhana hizo, na tanbihi inahifadhi uwezekano wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida huku ukidumisha sauti ya agizo la kisheria. Alama ya tanbihi imewekwa baada ya ‘kusanyiko maalumu,’ ambako neno linalofafanuliwa linatokea.
