base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/002.yaml
  text: And you shall sacrifice the Passover to Yahweh your God[a], from the flock and the herd, at the place that Yahweh will choose to make his name dwell there.
translation:
  language: sw
  text: Nawe utamtolea Yahweh Mungu wako dhabihu ya Pasaka[a], kutoka katika mifugo midogo na ng’ombe, mahali ambapo Yahweh atachagua ili kulifanya jina lake likae huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa “dhabihu ya Pasaka” imeunganishwa na maneno “kutoka katika mifugo midogo na ng’ombe.” Baadhi wanaelewa kwamba hii haimaanishi mnyama wa Pasaka peke yake, bali pia dhabihu za sikukuu zinazohusiana na Pasaka na Sikukuu ya Mikate Isiyotiwa Chachu.
    reason: alternative_reading
lexical_decisions:
- source_word: וְזָבַחְתָּ
  choice: Nawe utamtolea ... dhabihu
  rationale: Kitenzi זבח kinamaanisha kuchinja au kutoa kama dhabihu. Muundo huu unaonyesha tendo la ibada pamoja na nguvu ya agizo katika muktadha.
- source_word: פֶּסַח
  choice: dhabihu ya Pasaka
  rationale: Neno linaweza kutaja sikukuu, ibada, au mnyama wa Pasaka. Kwa kuwa ni yambwa ya זבח, ‘dhabihu ya Pasaka’ ni Kiswahili cha asili kinachoweka wazi maana ya kutoa dhabihu bila kuamua iwapo hapa linahusisha pia dhabihu nyingine za sikukuu.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: kwa Yahweh Mungu wako
  rationale: Kihusishi ל kinaonyesha kwamba dhabihu imeelekezwa au kuwekwa wakfu kwa Yahweh. Jina la agano יהוה limetoholewa kuwa ‘Yahweh’.
- source_word: צֹאן וּבָקָר
  choice: kutoka katika makundi ya kondoo na mbuzi, na ya ng’ombe
  rationale: צֹאן ni kundi la mifugo midogo linaloweza kujumuisha kondoo na mbuzi, na בָּקָר ni ng’ombe. ‘Makundi’ huhifadhi dhana ya majina ya mkusanyiko huku spishi zinazokusudiwa zikieleweka kwa msomaji wa Kiswahili.
- source_word: בַּמָּקוֹם
  choice: mahali
  rationale: Hurejelea eneo maalumu la ibada litakalochaguliwa na Mungu; ‘mahali’ ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: ambapo Yahweh atachagua
  rationale: Kauli ya wakati ujao inadumisha mtazamo wa hotuba ya Musa kuhusu uteuzi wa baadaye wa mahali hapo.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: kulikalisha jina lake
  rationale: 'Hifili ya שכן ni ya kusababisha: kulifanya jina likae. ‘Kulikalisha jina lake’ huhifadhi nahau ya kiteolojia ya uwepo na umiliki wa Mungu badala ya kuirahisisha kuwa ‘kuweka jina’.'
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni. ‘Yahweh’ huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Upeo wa ‘Pasaka’ kuhusiana na צֹאן וּבָקָר
  choice: Kudumisha marejeo mapana ya mifugo katika maandishi na kueleza utata katika tanbihi
  alternative: Kutafsiri kiufafanuzi kuwa ‘dhabihu ya Pasaka na dhabihu nyingine za sikukuu’
  rationale: Kutajwa kwa mifugo midogo na ng’ombe ni kupana kuliko mnyama wa kawaida wa Pasaka. Tafsiri haipaswi kulazimisha upatanisho mmoja; tanbihi inaonyesha uwezekano wa kwamba dhabihu za sikukuu zinajumuishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Muundo wa kisheria wa agizo umehifadhiwa kwa wakati ujao; nahau ya ‘kulikalisha jina lake’ imeachwa kwa makusudi ili kudumisha taswira ya Kiebrania.
