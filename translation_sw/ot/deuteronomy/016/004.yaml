base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/004.yaml
  text: No leaven is to be seen with you within all your territory for seven days[b][a], and none of the flesh that you sacrifice in the evening on the first day shall remain overnight until morning.
translation:
  language: sw
  text: Chachu isionekane kwako katika eneo lako lote kwa siku saba, wala nyama yoyote[a] utakayotoa dhabihu jioni ya siku ya kwanza[b] isibaki hadi asubuhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwili.” Neno la Kiebrania ni “mwili” kihalisi, lakini katika muktadha wa dhabihu kwa kawaida humaanisha “nyama.”
    reason: lexical_alternative
  - marker: b
    text: Maneno “siku ya kwanza” yanaweza kurejelea hasa dhabihu ya Pasaka mwanzoni mwa sikukuu, ingawa Kiebrania hapa hakisemi wazi “mwana-kondoo wa Pasaka.”
    reason: alternative_reading
lexical_decisions:
- source_word: יֵרָאֶה
  choice: isionekane
  rationale: 'Kauli ya kutendwa ya kitenzi ראה inaeleza katazo: chachu hairuhusiwi kuonekana. ‘Isionekane’ ni ya kawaida na inadumisha nguvu ya katazo.'
- source_word: שְׂאֹר
  choice: chachu
  rationale: ‘Chachu’ ni neno la kawaida la Kiswahili kwa kitu kinachochachusha unga na linafaa katika muktadha wa sheria ya Pasaka.
- source_word: בְּכָל גְּבֻלְךָ
  choice: katika eneo lako lote
  rationale: גְּבוּל hapa ina maana ya eneo lililo ndani ya mipaka, si mstari wa mpaka pekee. Tafsiri hii inaeleza upeo wa katazo kwa Kiswahili cha kawaida.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: ‘Kwa’ hutambulisha muda kwa njia ya kawaida katika Kiswahili bila kuongeza maana.
- source_word: יָלִין
  choice: isiachwe usiku kucha
  rationale: Kitenzi לין hapa kinakataa kuiacha nyama ibaki usiku hadi asubuhi. Usemi huu ni wazi na wa kawaida.
- source_word: מִן הַבָּשָׂר
  choice: wala nyama yoyote
  rationale: בָּשָׂר kihalisi ni ‘mwili’ au ‘nyama’; katika muktadha wa dhabihu, ‘nyama’ ndiyo tafsiri ya asili zaidi. ‘Yoyote’ huwasilisha maana ya sehemu ya מִן katika sentensi ya kukanusha.
- source_word: אֲשֶׁר תִּזְבַּח
  choice: utakayotoa dhabihu
  rationale: זבח katika muktadha huu ni kuchinja au kutoa dhabihu. ‘Kutoa dhabihu’ linaonyesha wazi tendo la ibada bila kulifanya kuwa dhabihu ya aina fulani.
- source_word: בָּעֶרֶב
  choice: jioni
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha wakati.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: ya siku ya kwanza
  rationale: Kiebrania kinasema tu ‘siku ya kwanza’; tafsiri haiongezi ‘ya sikukuu’ wala haitaji Pasaka moja kwa moja.
- source_word: לַבֹּקֶר
  choice: mpaka asubuhi
  rationale: Katika katazo hili, לַבֹּקֶר huonyesha kikomo cha muda. ‘Mpaka asubuhi’ ni wazi na sahihi.
theological_decisions:
- issue: Kinachorejelewa na nyama inayotolewa dhabihu ‘siku ya kwanza’
  choice: Kutaja nyama ya dhabihu kwa ujumla bila kusema ‘mwana-kondoo wa Pasaka’ katika matini kuu.
  alternative: Kufasiri maneno hayo hasa kuwa dhabihu au mwana-kondoo wa Pasaka; au kwa upana zaidi kuwa dhabihu za sikukuu zinazohusiana na siku ya kufungua sikukuu.
  rationale: Matini ya Kiebrania haisemi wazi ‘mwana-kondoo wa Pasaka,’ bali inasema nyama inayotolewa dhabihu jioni ya siku ya kwanza. Tafsiri inadumisha uwazi huo bila kuamua mjadala wa kifasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa katazo umehifadhiwa kwa ‘isionekane’ na ‘isiachwe,’ huku maneno ya kiibada yakitolewa kwa lugha ya kawaida isiyoegemea mapokeo ya dhehebu fulani.
