source:
  edition: WLC
  text: כִּ֠י אִֽם אֶל הַ/מָּק֞וֹם אֲשֶׁר יִבְחַ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/שַׁכֵּ֣ן שְׁמ֔/וֹ שָׁ֛ם תִּזְבַּ֥ח אֶת הַ/פֶּ֖סַח בָּ/עָ֑רֶב כְּ/ב֣וֹא הַ/שֶּׁ֔מֶשׁ מוֹעֵ֖ד צֵֽאתְ/ךָ֥ מִ/מִּצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/006.yaml
  text: but only at the place that Yahweh your God will choose for his name to dwell—there you shall sacrifice the Passover in the evening[a], at sunset[c][b], at the appointed time of your departure from Egypt.
translation:
  language: sw
  text: bali mahali tu atakapochagua Yahweh, Mungu wako, ili alifanye jina lake likae huko[a]; huko utatoa dhabihu ya Pasaka[b] jioni, wakati jua linapotua, katika wakati uliowekwa wa kutoka kwako Misri[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili jina lake likae huko,” au “ili aliweke jina lake huko.”
    reason: lexical_alternative
  - marker: b
    text: Au, “utaichinja sadaka ya Pasaka.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “wakati uliowekwa wa kutoka kwako Misri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: bali katika ... tu
  rationale: 'Muundo huu unaonyesha kizuizi chenye msisitizo kwa kulinganisha na katazo la mstari uliotangulia: si mahali pengine, bali mahali patakaochaguliwa pekee.'
- source_word: הַמָּקוֹם
  choice: mahali
  rationale: Hili ndilo neno la kawaida na la asili katika Kiswahili kwa eneo linalochaguliwa; hapa linadokeza mahali pa ibada ya pamoja bila kuongeza jina la mahali lisilokuwamo katika maandishi.
- source_word: יִבְחַר
  choice: atakapochagua
  rationale: Kitenzi hiki kinaeleza uchaguzi wa wakati ujao katika muktadha huu wa sheria, na umbo la Kiswahili linaunganisha uchaguzi huo kwa kawaida na 'mahali.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa kulihamisha kwa herufi za Kiswahili badala ya kulibadilisha kuwa cheo.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: ili alikalishe jina lake huko
  rationale: Hii inahifadhi umbo la kisababishi la kitenzi pamoja na nahau ya jina la Mungu kukaa mahali palipochaguliwa, bila kufafanua kupita kiasi maana ya uwepo wake.
- source_word: תִּזְבַּח
  choice: utaitoa dhabihu
  rationale: Kitenzi kinahusu kuchinja kwa ibada. 'Kuitoa dhabihu' huwasilisha wazi tendo la kidini katika Kiswahili cha kawaida; uwezekano wa 'kuichinja' umehifadhiwa katika tanbihi.
- source_word: הַפֶּסַח
  choice: Pasaka
  rationale: Nomino inaweza kumaanisha sikukuu au sadaka yake. Ikiwa kitu cha kitenzi cha kutoa dhabihu, hapa inarejelea sadaka ya Pasaka, huku tafsiri fupi ikihifadhi nahau ya chanzo.
- source_word: בָּעָרֶב
  choice: jioni
  rationale: Tafsiri fupi na ya kawaida ya kirai hiki cha wakati.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: wakati jua linapotua
  rationale: Nahau ya Kiebrania inaeleza kuingia au kutua kwa jua; usemi huu ni wa asili na sahihi katika Kiswahili.
- source_word: מוֹעֵד
  choice: wakati uliowekwa
  rationale: Neno hili linamaanisha wakati maalumu au ulioteuliwa, hivyo tafsiri inadumisha wazo la muda mahususi wa maadhimisho.
- source_word: צֵאתְךָ מִמִּצְרָיִם
  choice: wa kutoka kwako Misri
  rationale: Tafsiri hii inabaki karibu na muundo wa nomino wa Kiebrania na kuhusianisha wakati wa Pasaka na kutoka kwa Israeli Misri.
theological_decisions:
- issue: Nahau ya jina la Mungu kukaa mahali alipochagua
  choice: ili alikalishe jina lake huko
  alternative: ili jina lake likae huko; ili aliweke jina lake huko
  rationale: Chaguo hili linahifadhi kisababishi cha Kiebrania na mvutano kati ya Mungu asiyewekewa mipaka na uwepo wake wa agano mahali palipochaguliwa. Halidai kwamba nafsi ya Mungu imefungwa katika eneo hilo.
- issue: Maana ya Pasaka kama kitu kinachotolewa dhabihu
  choice: utaitoa dhabihu ya Pasaka
  alternative: utaichinja Pasaka; utatoa sadaka ya Pasaka
  rationale: Muktadha wa ibada unaonyesha kuwa 'Pasaka' hapa ni sadaka ya Pasaka, lakini maandishi makuu hayaiwekea kikomo kuwa 'mwana-kondoo' kwa sababu nomino ya Kiebrania yenyewe haimtaji mnyama huyo katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wa sasa na unaoeleweka kwa wasomaji wa kawaida. Muundo wa kisheria na msisitizo wa mahali pekee umehifadhiwa. Nahau muhimu za Kiebrania zimebakizwa pale zinapoeleweka, huku mbadala halali zikiwekwa katika tanbihi.
