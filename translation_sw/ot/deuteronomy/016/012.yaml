  yaml_path: translation/ot/deuteronomy/016/012.yaml
  text: Remember that you were a servant in Egypt[a], and keep and do these statutes.
translation:
  language: sw
  text: Kumbuka kwamba ulikuwa mtumwa nchini Misri,[a] nawe uzishike na uzitekeleze sheria hizi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumishi.” Neno la Kiebrania עֶבֶד linaweza kumaanisha mtumishi au mtumwa, lakini hapa “mtumwa” linaonyesha vizuri zaidi hali ya Israeli ya kuwa utumwani nchini Misri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Kumbuka
  rationale: Katika muktadha huu wa maagizo, kitenzi hiki kina nguvu ya amri. “Kumbuka” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa neno hili linaanzisha jambo linalopaswa kukumbukwa, si sababu.
- source_word: עֶבֶד
  choice: mtumwa
  rationale: Ingawa neno la Kiebrania linaweza kumaanisha mtumishi au mtumwa, katika kumbukumbu ya utumwa wa kulazimishwa huko Misri, “mtumwa” linaonyesha hali hiyo kwa usahihi zaidi.
- source_word: הָיִיתָ
  choice: ulikuwa
  rationale: Ni usemi wa hali iliyokuwapo wakati uliopita.
- source_word: בְּמִצְרָיִם
  choice: nchini Misri
  rationale: Huu ni usemi wa asili katika Kiswahili kwa kurejelea kuwapo ndani ya nchi ya Misri; neno “nchi” limeingizwa kisarufi bila kuongeza wazo jipya.
- source_word: וְשָׁמַרְתָּ
  choice: uzishike
  rationale: Katika muktadha wa sheria na agano, שׁמר humaanisha kutunza au kufuata maagizo. “Kushika sheria” ni usemi unaoeleweka na kuhifadhi maana ya utii.
- source_word: וְעָשִׂיתָ
  choice: kuzitekeleza
  rationale: Kitenzi hiki kinasisitiza kuzifanya sheria kwa vitendo. “Kuzitekeleza” ni cha asili zaidi kuliko “kuzifanya” huku kikihifadhi tofauti na “kuzishika.”
- source_word: הַחֻקִּים
  choice: sheria
  rationale: חֻקִּים ni masharti au sheria zilizowekwa. “Sheria” ni neno la sasa, linaloeleweka kwa urahisi, na linafaa katika muktadha huu.
- source_word: הָאֵלֶּה
  choice: hizi
  rationale: Ni kiashiria cha moja kwa moja kinachopatana na nomino “sheria.”
theological_decisions:
- issue: Maana ya עֶבֶד katika utumwa wa Israeli nchini Misri
  choice: mtumwa
  alternative: mtumishi
  rationale: Muktadha unahusu hali ya kulazimishwa na kufungwa ya Israeli huko Misri. “Mtumwa” linaonyesha uhalisi huo bila kupunguza ukali wake; tanbihi inahifadhi maana nyingine ya neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “uzishike na kuzitekeleza” unahifadhi jozi ya vitenzi vya Kiebrania kwa lugha ya sasa na ya asili.
