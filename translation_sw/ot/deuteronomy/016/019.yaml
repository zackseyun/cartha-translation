  text: לֹא תַטֶּ֣ה מִשְׁפָּ֔ט לֹ֥א תַכִּ֖יר פָּנִ֑ים וְ/לֹא תִקַּ֣ח שֹׁ֔חַד כִּ֣י הַ/שֹּׁ֗חַד יְעַוֵּר֙ עֵינֵ֣י חֲכָמִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/019.yaml
  text: You shall not pervert justice[a]; you shall not show partiality; and you shall not take a bribe[b], for the bribe blinds the eyes of the wise and twists the words of the righteous.
translation:
  language: sw
  text: Usipotoshe haki; usipendelee mtu[a]; wala usipokee rushwa, kwa maana rushwa hupofusha macho ya wenye hekima na hupotosha maneno ya wenye haki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, neno kwa neno, “usitambue nyuso,” msemo unaomaanisha kuonyesha upendeleo.
    reason: lexical_alternative
  - marker: b
    text: Au “hupotosha shauri la wenye haki.” Neno la Kiebrania linaweza kumaanisha maneno au, katika muktadha wa kisheria, shauri lao.
    reason: alternative_reading
lexical_decisions:
- source_word: תַטֶּה מִשְׁפָּט
  choice: usipotoshe haki
  rationale: Kitenzi katika muundo wa Hifili pamoja na מִשְׁפָּט kinaeleza kugeuza au kupinda haki katika utoaji wa hukumu. “Kupotosha haki” ni Kiswahili cha kawaida chenye uzito wa kisheria na kimaadili.
- source_word: תַכִּיר פָּנִים
  choice: usipendelee mtu
  rationale: Ingawa maana ya neno kwa neno ni “kutambua nyuso,” huu ni msemo wa Kiebrania unaomaanisha kumwonyesha mtu upendeleo katika hukumu. “Usipendelee mtu” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: שֹׁחַד
  choice: rushwa
  rationale: Katika muktadha huu wa kisheria, neno hili ni malipo yanayotolewa ili kuathiri hukumu. “Rushwa” ndilo neno sahihi na la kawaida katika Kiswahili.
- source_word: יְעַוֵּר עֵינֵי חֲכָמִים
  choice: hupofusha macho ya wenye hekima
  rationale: Tafsiri hii inahifadhi taswira wazi ya Kiebrania kuhusu rushwa kuharibu uwezo wa watu wenye hekima wa kuona na kuamua sawasawa.
- source_word: חֲכָמִים
  choice: wenye hekima
  rationale: Wingi wa kiume umetumika kwa maana ya jumla, hivyo “wenye hekima” ni ya asili na haiwekewi wanaume pekee.
- source_word: וִיסַלֵּף דִּבְרֵי צַדִּיקִם
  choice: na kupotosha maneno ya wenye haki
  rationale: סלף ni kupinda au kupotosha. דִּבְרֵי inaweza kumaanisha maneno, kauli, au katika mazingira ya mahakama, shauri. Matini kuu inabaki karibu na “maneno,” huku tanbihi ikihifadhi uwezekano wa maana ya kisheria.
- source_word: צַדִּיקִם
  choice: wenye haki
  rationale: Katika muktadha huu neno linaweza kutaja watu walio sawa kimaadili au walio na haki katika shauri. “Wenye haki” huhifadhi upana huo kuliko “wasio na hatia.”
theological_decisions:
- issue: Maana ya דִּבְרֵי צַדִּיקִם katika mazingira ya mahakama
  choice: maneno ya wenye haki
  alternative: shauri la wenye haki
  rationale: Kiebrania kinaruhusu maana ya “maneno/kauli” na pia maana pana ya “shauri” katika muktadha wa kisheria. Tafsiri kuu inahifadhi neno la moja kwa moja, na tanbihi inaonyesha maana nyingine bila kuondoa utata wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Amri za umoja zimehifadhiwa; sentensi ni wazi kwa msomaji wa kawaida, huku taswira ya “kupofusha macho” na utata wa mwisho wa Kiebrania vikidumishwa.
