  yaml_path: translation/ot/deuteronomy/016/017.yaml
  text: Each man shall give according to the gift of his hand[a], according to the blessing of Yahweh your God that he has given you.
translation:
  language: sw
  text: Kila mwanamume atatoa kadiri ya uwezo wake[a], kulingana na baraka ambayo Yahwe, Mungu wako, amekupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “zawadi ya mkono wake,” nahau inayorejelea kile alicho nacho cha kutoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Kila mwanamume
  rationale: Nomino ya umoja imetumiwa kwa maana ya kugawa wajibu kwa kila mwanamume mmoja mmoja; tafsiri hii pia inadumisha jinsia ya neno la Kiebrania katika muktadha huu.
- source_word: כְּמַתְּנַת יָדוֹ
  choice: kadiri ya uwezo wake
  rationale: Kiswahili cha moja kwa moja ‘kadiri ya zawadi ya mkono wake’ hakitoi maana ya nahau kwa uwazi. Hapa ‘mkono’ unawakilisha kile alicho nacho au anachoweza kutoa; ‘kadiri ya uwezo wake’ ni ya asili na hudumisha wazo la uwiano.
- source_word: כְּבִרְכַּת
  choice: kulingana na baraka
  rationale: Kiambishi כְּ kinaonyesha uwiano au kipimo, na בְּרָכָה ni baraka aliyompa Mungu, ikihusisha hasa alichomjalia katika muktadha.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa umbo la Kiswahili ‘Yahwe’ badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Hii ni kauli ya agano inayomtaja Yahwe kuwa Mungu wa msikilizaji wa umoja.
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: ambayo ... amekupa
  rationale: Kishazi rejeshi kinafafanua ‘baraka’; wakati timilifu wa Kiswahili unaonyesha baraka iliyotolewa na ambayo matokeo yake yanaendelea.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la agano יהוה. ‘Yahwe’ hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo, huku likifuata umbo linalotumika kwa kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Atatoa’ huweka wajibu wa kutoa wazi kutokana na muktadha wa mstari uliotangulia. Nahau ya Kiebrania imewasilishwa kwa maana yake katika maandishi, huku taswira yake halisi ikihifadhiwa katika tanbihi.
