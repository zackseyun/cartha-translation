base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/020.yaml
  text: Justice[a], justice you shall pursue[b], so that you may live and possess the land that Yahweh your God is giving you.
translation:
  language: sw
  text: Haki[a], haki uifuatilie, ili uishi na kuimiliki[b] nchi ambayo Yahwe Mungu wako anakupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza kumaanisha haki au uadilifu; hapa muktadha wa sheria na mahakama unatanguliza maana ya haki.
    reason: lexical_alternative
  - marker: b
    text: Au “kuirithi.” Kitenzi cha Kiebrania kinaweza kumaanisha kurithi na pia kumiliki.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶדֶק צֶדֶק
  choice: Haki, haki
  rationale: Nomino iliyorudiwa inasisitiza wajibu huo. Katika muktadha wa waamuzi, kutopendelea, na rushwa, “haki” lina maana ya kisheria na kijamii inayotakiwa, huku pia likibaki na upana wa uadilifu wa kimaadili.
- source_word: תִּרְדֹּף
  choice: uifuatilie
  rationale: Kitenzi רדף kina maana halisi ya kufuata au kuandama. “Uifuatilie” kinaonyesha jitihada endelevu na makusudi bila kupunguza nguvu ya agizo.
- source_word: לְמַעַן
  choice: ili
  rationale: “Ili” linaonyesha kusudi au matokeo kwa Kiswahili cha kawaida na fasaha.
- source_word: תִּחְיֶה
  choice: uishi
  rationale: Ni tafsiri ya moja kwa moja inayoweza kujumuisha kuendelea kuishi chini ya baraka za agano bila kuongeza wazo lisilotajwa wazi.
- source_word: וְיָרַשְׁתָּ
  choice: na kuimiliki
  rationale: ירשׁ inaweza kumaanisha kumiliki au kurithi. Katika kauli kuhusu nchi anayoitoa Mungu, “kuimiliki” linaeleza kuipokea na kuwa nayo; maana ya “kurithi” imehifadhiwa katika tanbihi.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: “Nchi” ni neno la kawaida la Kiswahili kwa eneo la ahadi katika muktadha huu na linadumisha uzito wa wazo la nchi aliyopewa Israeli.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo. Umbo “Yahwe” linafuata tahajia ya kawaida ya Kiswahili.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Linahifadhi usemi wa agano na kiambishi cha nafsi ya pili umoja.
- source_word: נֹתֵן לָךְ
  choice: anakupa
  rationale: Wakati wa sasa unaonyesha tendo la Mungu linaloendelea au lililo karibu kutimizwa, kama ilivyo katika umbo la Kiebrania.
theological_decisions:
- issue: Maana ya צֶדֶק katika muktadha wa mahakama
  choice: haki
  alternative: uadilifu
  rationale: Muktadha wa karibu unahusu waamuzi, upendeleo, na rushwa, hivyo maana ya haki ya kijamii na kisheria ndiyo inayotawala. Neno la Kiswahili “haki” pia linaweza kubeba maana pana ya kuwa sawa au adilifu, kwa hiyo halifuti mvutano wa Kiebrania.
- issue: Uwasilishaji wa יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Kutumia “Yahwe” kunahifadhi jina binafsi la agano lililo katika maandishi ya Kiebrania badala ya kulibadilisha kwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Marudio “Haki, haki” yamehifadhiwa kwa ajili ya msisitizo wa Kiebrania. Umoja wa nafsi ya pili umehifadhiwa katika “uifuatilie,” “uishi,” “Mungu wako,” na “anakupa.”
