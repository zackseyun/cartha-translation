lexical_decisions:
- source_word: שִׁבְעָה שָׁבֻעֹת
  choice: majuma saba
  rationale: Katika muktadha huu wa kalenda, kirai hiki cha Kiebrania humaanisha majuma saba. ‘Majuma saba’ ni Kiswahili cha kawaida na kinadumisha muundo wa kuhesabu.
- source_word: תִּסְפָּר לָךְ
  choice: utajihesabia
  rationale: Kitenzi hiki kinatoa agizo, na kiambishi cha kujirejelea katika ‘utajihesabia’ kinaakisi לָךְ bila kufanya sentensi kuwa nzito.
- source_word: מֵהָחֵל
  choice: tangu wakati utakapoanza
  rationale: Muundo huu unaonyesha mahali pa kuanzia katika wakati; tafsiri hii ni ya asili katika Kiswahili na inahifadhi wazo la mwanzo.
- source_word: חֶרְמֵשׁ
  choice: mundu
  rationale: חֶרְמֵשׁ ni chombo cha kuvunia nafaka; ‘mundu’ ndilo neno sanifu na linaloeleweka katika muktadha huu.
- source_word: בַּקָּמָה
  choice: katika nafaka iliyosimama
  rationale: קָמָה hurejelea nafaka au mazao ambayo bado yamesimama shambani. Tafsiri hii inahifadhi picha ya mavuno bila kuongeza maelezo yasiyomo katika matini.
- source_word: תָּחֵל לִסְפֹּר
  choice: utaanza kuhesabu
  rationale: Muundo wa Kiebrania unaeleza kuanza kwa tendo la kuhesabu; ‘utaanza kuhesabu’ ni sahihi na ya kawaida.
- source_word: שִׁבְעָה שָׁבֻעוֹת
  choice: majuma saba
  rationale: Kirai kilichorudiwa kimetafsiriwa kwa namna ileile ili kudumisha msisitizo na uwiano wa mstari.
