translation:
  language: sw
  text: Utajihesabia majuma saba[a]; tangu mwanzo wa kutia mundu katika nafaka iliyosimama, utaanza kuhesabu majuma saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “saba saba.” Hapa msemo wa Kiebrania unamaanisha majuma saba.
