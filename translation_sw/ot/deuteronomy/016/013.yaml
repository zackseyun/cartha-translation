  yaml_path: translation/ot/deuteronomy/016/013.yaml
  text: You shall keep the Feast of Booths for seven days[a], when you gather in from your threshing floor and from your winepress.
translation:
  language: sw
  text: Utaadhimisha Sikukuu ya Vibanda[a] kwa siku saba, utakapokusanya mazao kutoka katika uwanja wako wa kupuria nafaka na kutoka katika kikamulio chako cha divai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sikukuu ya Makazi ya Muda.” Kwa maana halisi, neno la Kiebrania linataja vibanda au makazi ya muda.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג הַסֻּכֹּת
  choice: Sikukuu ya Vibanda
  rationale: חַג ni sikukuu ya kidini, na סֻכּוֹת ni vibanda au makazi ya muda. Tafsiri hii ni ya moja kwa moja na inaeleweka kwa wasomaji wa sasa.
- source_word: תַּעֲשֶׂה לְךָ
  choice: Utaadhimisha
  rationale: Katika muktadha wa sheria kuhusu sikukuu, עשה ina maana ya kuiadhimisha au kuitunza sikukuu; umbo la wakati ujao linadumisha nguvu ya agizo la Kiebrania kwa Kiswahili cha heshima.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Hiki ni kirai cha muda kinachoonyesha kipindi ambacho sikukuu itaadhimishwa.
- source_word: בְּאָסְפְּךָ
  choice: utakapokusanya mazao
  rationale: 'ב pamoja na kitenzi-jina cha אסף ina maana ya wakati: ‘utakapokusanya.’ Neno ‘mazao’ limeongezwa kwa uwazi wa kawaida wa Kiswahili kutokana na vitu vinavyotajwa baada yake.'
- source_word: מִגָּרְנְךָ
  choice: kutoka katika uwanja wako wa kupuria nafaka
  rationale: גֹּרֶן ni uwanja wa kupuria nafaka. Taswira halisi ya eneo la mavuno imehifadhiwa.
- source_word: וּמִיִּקְבֶךָ
  choice: na kutoka katika shinikizo lako la divai
  rationale: יֶקֶב ni shinikizo au pipa linalohusiana na utengenezaji wa divai. ‘Shinikizo la divai’ huhifadhi taswira halisi ya maandishi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Utaadhimisha’ limetumiwa kama agizo la kisheria; taswira za uwanja wa kupuria nafaka na shinikizo la divai zimehifadhiwa.
