  text: שִׁבְעַ֣ת יָמִ֗ים תָּחֹג֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ בַּ/מָּק֖וֹם אֲשֶׁר יִבְחַ֣ר יְהוָ֑ה כִּ֣י יְבָרֶכְ/ךָ֞ יְהוָ֣ה אֱלֹהֶ֗י/ךָ בְּ/כֹ֤ל תְּבוּאָֽתְ/ךָ֙ וּ/בְ/כֹל֙ מַעֲשֵׂ֣ה יָדֶ֔י/ךָ וְ/הָיִ֖יתָ אַ֥ךְ שָׂמֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/015.yaml
  text: For seven days you shall celebrate a feast to Yahweh your God in the place that Yahweh will choose[a], because Yahweh your God will bless you in all your produce and in all the work of your hands, and you shall be altogether joyful.
translation:
  language: sw
  text: Kwa siku saba utaadhimisha sikukuu kwa Yahweh Mungu wako mahali atakapochagua Yahweh, kwa sababu Yahweh Mungu wako atakubariki katika mazao yako yote na katika kazi yote ya mikono yako; nawe utakuwa na furaha tele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nawe utakuwa na furaha tu,” au, “nawe hakika utafurahi.” Usemi wa Kiebrania unasisitiza furaha kamili isiyochanganyika.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּחֹג
  choice: utaadhimisha sikukuu
  rationale: Kitenzi חָגַג humaanisha kuadhimisha sikukuu ya hija, si kufurahi kwa ujumla tu. Kauli hii ni ya asili na inahifadhi tendo la sherehe.
- source_word: לַיהוָה
  choice: kwa ajili ya Yahweh
  rationale: Kihusishi ל kinaonyesha kwamba sikukuu imeelekezwa na kuwekwa wakfu kwa Yahweh. 'Kwa ajili ya' huwasilisha uelekeo huo kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limeandikwa kama jina binafsi 'Yahweh' badala ya kubadilishwa na cheo.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: mahali ambapo Yahweh atachagua
  rationale: Kauli hii inarejelea mahali pa ibada patakapochaguliwa na Mungu; tafsiri inafuata maana na muundo wa Kiebrania kwa Kiswahili cha asili.
- source_word: כִּי
  choice: kwa sababu
  rationale: כִּי hapa inaanzisha sababu ya kuadhimisha sikukuu na kuwa na furaha.
- source_word: יְבָרֶכְךָ
  choice: atakubariki
  rationale: Hii inadumisha lugha ya kawaida ya agano kuhusu baraka za Mungu bila kuifupisha kuwa mafanikio ya mali pekee.
- source_word: תְּבוּאָתְךָ
  choice: mazao yako
  rationale: תְּבוּאָה hurejelea kwa upana mazao au mavuno ya kilimo; 'mazao' haifungii maana kwenye nafaka tu.
- source_word: מַעֲשֵׂה יָדֶיךָ
  choice: kazi yote ya mikono yako
  rationale: Tafsiri inahifadhi nahau ya Kiebrania inayomaanisha kazi ya mtu na matokeo yake, huku ikieleweka kwa urahisi katika Kiswahili.
- source_word: וְהָיִיתָ
  choice: nawe utakuwa
  rationale: Muundo huu unaendeleza matokeo yanayohusishwa na baraka za Mungu, bila kufanya uhusiano huo kuwa wazi zaidi kuliko ulivyo katika chanzo.
- source_word: אַךְ שָׂמֵחַ
  choice: na furaha tele
  rationale: אַךְ inasisitiza ukamilifu au wingi wa furaha katika muktadha huu. 'Furaha tele' ni kauli ya asili, lakini tanbihi huhifadhi uwezekano mwingine wa tafsiri.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia Tetragramatoni kama jina binafsi la Mungu. 'Yahweh' hulihifadhi badala ya kulibadilisha na cheo.
- issue: Nguvu ya kishazi וְהָיִיתָ אַךְ שָׂמֵחַ
  choice: nawe utakuwa na furaha tele
  alternative: nawe utakuwa na furaha tu; nawe hakika utafurahi
  rationale: אַךְ linaweza kusikika kuwa la kuzuia ('tu') au la kusisitiza ('hakika/kabisa'). Muktadha wa baraka na sikukuu unaunga mkono msisitizo wa furaha kamili, lakini tanbihi inadumisha utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Kuadhimisha sikukuu' ni wazi kwa wasomaji wa kawaida; 'mazao' huhifadhi upana wa kilimo; na jina 'Yahweh' limetumika kwa uthabiti.
