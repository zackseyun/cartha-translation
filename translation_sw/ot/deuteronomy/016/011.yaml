  text: וְ/שָׂמַחְתָּ֞ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אַתָּ֨ה וּ/בִנְ/ךָ֣ וּ/בִתֶּ/ךָ֮ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ/ךָ֒ וְ/הַ/לֵּוִי֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ וְ/הַ/גֵּ֛ר וְ/הַ/יָּת֥וֹם וְ/הָ/אַלְמָנָ֖ה אֲשֶׁ֣ר בְּ/קִרְבֶּ֑/ךָ בַּ/מָּק֗וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/011.yaml
  text: And you shall rejoice before Yahweh your God—you[a], your son, your daughter, your male servant, your female servant, the Levite who is within your gates, and the sojourner, the fatherless[c][b], and the widow who are among you—at the place that Yahweh your God will choose for his name to dwell there.
translation:
  language: sw
  text: Utafurahi mbele za Yahwe, Mungu wako—wewe, mwanao, binti yako, mtumwa wako wa kiume, mtumwa wako wa kike, Mlawi aliye katika miji yako,[a] mgeni mkazi,[b] yatima,[c] na mjane walio kati yako—mahali ambapo Yahwe, Mungu wako, atachagua ili kulifanya jina lake likae huko.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “aliye ndani ya malango yako.” Katika Kumbukumbu la Torati, “malango” mara nyingi humaanisha miji au jumuiya za mahali.
    reason: literal_idiom
  - marker: b
    text: Yaani, mtu asiye Mwisraeli ambaye anaishi miongoni mwa Israeli chini ya utaratibu wao wa kijamii.
    reason: lexical_clarification
  - marker: c
    text: Au, “asiye na baba.”
    reason: lexical_alternative
  - marker: d
    text: Kihalisi, “kulifanya jina lake likae huko.”
    reason: literal_causative
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: Nawe utafurahi
  rationale: Kitenzi שׂמח kinaonyesha kufurahi au kushangilia. “Utafurahi” ni cha asili katika Kiswahili na kinadumisha sauti ya agizo la sherehe ya ibada.
- source_word: לִפְנֵי
  choice: mbele za
  rationale: Hii ni nahau ya kawaida ya Kiswahili inayomaanisha kuwa mbele au katika uwepo wa mtu, na inafaa katika muktadha wa ibada.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano YHWH limetafsiriwa kwa umbo la Kiswahili “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: עַבְדְּךָ / אֲמָתֶךָ
  choice: mtumwa wako wa kiume / mtumwa wako wa kike
  rationale: Maneno haya yanaweza kumaanisha watumishi au watumwa; katika orodha hii ya watu wa nyumba, tafsiri hii inaweka wazi hali yao ya kijamii na tofauti ya jinsia bila kuificha.
- source_word: בִּשְׁעָרֶיךָ
  choice: katika miji yako
  rationale: Kihalisi ni “ndani ya malango yako,” lakini katika matumizi ya Kumbukumbu la Torati malango yanawakilisha miji au jumuiya za mahali. “Katika miji yako” huwasilisha maana hiyo kwa Kiswahili cha sasa.
- source_word: הַגֵּר
  choice: mgeni mkazi
  rationale: גֵּר ni mtu asiye mzawa anayeishi kwa kudumu miongoni mwa Israeli chini ya utaratibu wake wa kijamii; si mgeni wa kupita tu.
- source_word: הַיָּתוֹם
  choice: yatima
  rationale: “Yatima” ni neno la kawaida na lenye heshima katika Kiswahili. Kiebrania kinaweza kusisitiza hasa mtu asiye na baba, jambo linaloonyeshwa katika tanbihi.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: kulikalisha jina lake
  rationale: “Kulikalisha” linadumisha nguvu ya kisababishi ya kitenzi שׁכן na wazo la Kumbukumbu la Torati kwamba Mungu analifanya jina lake likae mahali alipochagua.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi jina hilo kwa umbo linalotumika kwa kawaida katika Kiswahili.
- issue: Hali ya kijamii ya עבד na אמה
  choice: mtumwa wa kiume / mtumwa wa kike
  alternative: mtumishi wa kiume / mtumishi wa kike
  rationale: Maneno ya Kiebrania yana wigo wa maana, lakini katika sheria hii ya kaya hali ya utegemezi na utumwa ni muhimu. Tafsiri haipaswi kuipunguza kimya kimya.
- issue: Kauli ya patakatifu לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: kulikalisha jina lake
  alternative: jina lake likae huko; kuweka jina lake huko
  rationale: Tafsiri iliyochaguliwa inadumisha kisababishi cha Kiebrania na mvutano wa kitheolojia kati ya Mungu mwenyewe na kuwapo kwa jina lake mahali alipochagua, bila kueleza zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye sauti ya heshima na ya kisheria lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha na msisitizo wa kiwakilishi “wewe” umehifadhiwa. Nahau ya “malango” imewasilishwa kwa maana yake ya kimuktadha katika maandishi na kuwekwa kihalisi katika tanbihi.
