lexical_decisions:
- source_word: לֹא תוּכַל
  choice: Huruhusiwi
  rationale: Muundo wa יכל pamoja na kitenzi-jina katika sheria hii una nguvu ya katazo, si kutoweza tu; “Huruhusiwi” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: לִזְבֹּחַ
  choice: kutoa dhabihu
  rationale: Katika muktadha wa ibada, זבח humaanisha kuchinja au kutoa kitu kama dhabihu; usemi huu ni wazi na wa kawaida katika Kiswahili cha Biblia.
- source_word: הַפָּסַח
  choice: dhabihu ya Pasaka
  rationale: פסח hapa ni kile kinachotolewa dhabihu, si sikukuu kwa ujumla tu. Tafsiri hii huweka wazi maana inayodokezwa na kitenzi bila kuibana kuwa mwana-kondoo pekee.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: katika mji wowote
  rationale: Neno שער, kihalisi “lango,” hutumiwa hapa kimajazi kumaanisha mji au makazi yaliyo chini ya mamlaka ya lango; “mji wowote” huwasilisha rejeo na wigo wa katazo kwa Kiswahili asilia.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: ambao Yahwe Mungu wako anakupa
  rationale: Kishiriki נֹתֵן kinaonyesha utoaji unaoendelea au wa kawaida. “Anakupa” huhifadhi hali hiyo pamoja na umoja wa nafsi ya pili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la agano, YHWH. “Yahwe” hulitaja moja kwa moja badala ya kulibadilisha kuwa cheo.
- issue: Maana ya הַפָּסַח baada ya זבח
  choice: dhabihu ya Pasaka
  alternative: Pasaka
  rationale: Kirai kinaweza kurejelea mnyama au sadaka ya Pasaka. “Dhabihu ya Pasaka” hudhihirisha maana ya kiibada inayotakiwa na kitenzi huku ikiepuka kuamua kwamba ni mwana-kondoo pekee.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri imetumia ulinganifu mwafaka: imewasilisha maana ya kimajazi ya “malango” katika matini kuu na kuhifadhi picha halisi ya Kiebrania katika tanbihi.'
