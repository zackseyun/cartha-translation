  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לֹֽא תִטַּ֥ע לְ/ךָ֛ אֲשֵׁרָ֖ה כָּל עֵ֑ץ אֵ֗צֶל מִזְבַּ֛ח יְהוָ֥ה אֱלֹהֶ֖י/ךָ אֲשֶׁ֥ר תַּעֲשֶׂה לָּֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/021.yaml
  text: You shall not plant for yourself an Asherah of any kind of tree beside the altar of Yahweh your God that you make for yourself[a].
translation:
  language: sw
  text: Usijipandie Ashera ya mti wa aina yoyote kando ya madhabahu ya Yahwe Mungu wako utakayojitengenezea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguzo ya Ashera.” Neno la Kiebrania אֲשֵׁרָה linaweza kumaanisha kitu cha ibada kilichohusishwa na mungu wa kike Ashera, wala si mungu huyo peke yake.
    reason: alternative_reading
lexical_decisions:
- source_word: תִטַּע
  choice: usijipandie
  rationale: Kitenzi נטע kwa kawaida humaanisha ‘panda’. Muundo wa kujirejelea katika ‘usijipandie’ pia unawakilisha לְךָ (‘kwa ajili yako mwenyewe’) kwa Kiswahili cha kawaida.
- source_word: אֲשֵׁרָה
  choice: Ashera
  rationale: Jina limeandikwa kwa herufi za Kiswahili ili kuhifadhi utata wa neno la Kiebrania, ambalo linaweza kumaanisha mungu wa kike Ashera au kitu cha ibada kinachohusishwa naye.
- source_word: כָּל עֵץ
  choice: mti wa aina yoyote
  rationale: Huwakilisha maana halisi ya ‘mti wowote’ na kuonyesha kwamba katazo halihusu aina moja tu ya mti, bila kulazimisha tafsiri ya ‘nguzo’ katika matini kuu.
- source_word: אֵצֶל
  choice: kando ya
  rationale: Ni usemi wa kawaida na ulio wazi wa kuonyesha ukaribu wa mahali.
- source_word: מִזְבַּח
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa מזבח katika muktadha wa ibada.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina binafsi la Mungu badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Linahifadhi umoja na usemi wa agano unaomwelekea msomaji mmoja.
- source_word: אֲשֶׁר תַּעֲשֶׂה לָּךְ
  choice: utakayojitengenezea
  rationale: ‘Tengeneza’ inabaki karibu na maana pana ya עשה, huku kiambishi ‘ji-’ kikihifadhi wazo la ‘kwa ajili yako mwenyewe’ kwa njia ya asili katika Kiswahili.
theological_decisions:
- issue: Iwapo אֲשֵׁרָה litafsiriwe kama jina la mungu wa kike au kama kitu cha ibada
  choice: Kutumia ‘Ashera’ katika matini kuu, huku tanbihi ikieleza uwezekano wa kitu cha ibada.
  alternative: nguzo ya Ashera; sanamu ya mbao ya Ashera
  rationale: Neno la Kiebrania linaweza kurejelea Ashera mwenyewe au mti, nguzo, au kitu kingine cha ibada kinachohusishwa naye. Kulihifadhi kama ‘Ashera’ hakumalizi kimya kimya utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa wasomaji wa kawaida. ‘Usijipandie’ na ‘utakayojitengenezea’ huhifadhi miundo ya kujirejelea bila kufanya sentensi iwe nzito. Alama ya tanbihi [a] imewekwa katika matini kuu.
