  text: שָׁמוֹר֙ אֶת חֹ֣דֶשׁ הָ/אָבִ֔יב וְ/עָשִׂ֣יתָ פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּ֞י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֗יב הוֹצִ֨יאֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ מִ/מִּצְרַ֖יִם לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/001.yaml
  text: Observe the month of Abib[a], and keep the Passover to Yahweh your God, because in the month of Abib Yahweh your God brought you out from Egypt by night.
translation:
  language: sw
  text: “Uzingatie mwezi wa Abibu[a], nawe uadhimishe Pasaka kwa Yahwe, Mungu wako; kwa maana katika mwezi wa Abibu Yahwe, Mungu wako, alikutoa katika Misri usiku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abibu ni jina la mwezi uliohusishwa na nafaka changa zinazoanza kuiva; pia inaweza kutafsiriwa, “mwezi wa majira ya kuchipua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר
  choice: Shika
  rationale: Amri hii inataka kuzingatia na kutunza kwa makini sharti la kalenda. ‘Shika’ ni ya kawaida katika muktadha wa kushika sikukuu na inadumisha nguvu ya amri.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: mwezi wa Abibu
  rationale: Katika sheria hii, אָבִיב inatumika kama jina la mwezi wa kalenda unaohusishwa na nafaka zinazoanza kuiva; kulitunza kama ‘Abibu’ kunadumisha umahususi wa kalenda.
- source_word: וְעָשִׂיתָ פֶּסַח
  choice: nawe umwadhimishie ... Pasaka
  rationale: Ingawa kitenzi kwa msingi ni ‘fanya,’ usemi huu unamaanisha kutekeleza maadhimisho ya Pasaka. ‘Umwadhimishie ... Pasaka’ ni Kiswahili cha asili kinachoonyesha tendo la ibada linaloelekezwa kwa Yahwe.
- source_word: לַיהוָה
  choice: umwadhimishie Yahwe
  rationale: Kiambishi ל kinaonyesha kwamba maadhimisho yanaelekezwa au kuwekwa wakfu kwa Yahwe; muundo wa Kiswahili ‘umwadhimishie’ unadumisha mwelekeo huo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kuwa ‘Yahwe’ badala ya kubadilishwa na cheo.
- source_word: הוֹצִיאֲךָ
  choice: alikutoa
  rationale: Hii ni kausativi ya יצא, ikimaanisha kusababisha mtu atoke. ‘Alikutoa’ ni fupi, wazi, na hudumisha usemi wa Kutoka.
- source_word: מִמִּצְרַיִם
  choice: Misri
  rationale: Kiambishi cha mahali ‘kutoka’ tayari kimo katika kitenzi ‘alikutoa,’ hivyo ‘alikutoa Misri’ ni muundo wa kawaida na usiojirudia katika Kiswahili.
- source_word: לָיְלָה
  choice: usiku
  rationale: Nomino hii imetumiwa kwa maana ya wakati au hali ya tukio. ‘Usiku’ ni tafsiri ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina binafsi la Mungu, יהוה. ‘Yahwe’ hulidumisha kama jina badala ya kulibadilisha kuwa cheo.
- issue: Kama אָבִיב itafsiriwe kuwa majira au jina la mwezi
  choice: Abibu kama jina la kalenda
  alternative: mwezi wa majira ya kuchipua au mwezi wa nafaka changa
  rationale: Katika muktadha huu wa sheria ya Pasaka, usemi huo unatambulisha mwezi mahsusi wa kalenda. Tanbihi inaeleza maana yake ya kilimo bila kufuta umahususi huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Umoja wa nafsi ya pili katika Kiebrania umedumishwa. Muundo ‘umwadhimishie Yahwe Mungu wako Pasaka’ huepuka tafsiri ngumu ya neno kwa neno ya ‘fanya Pasaka’ huku ukidumisha kwamba ibada hiyo inaelekezwa kwa Yahwe.
