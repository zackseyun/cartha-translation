  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לֹֽא תְתַעֵ֣ב אֲדֹמִ֔י כִּ֥י אָחִ֖י/ךָ ה֑וּא לֹא תְתַעֵ֣ב מִצְרִ֔י כִּי גֵ֖ר הָיִ֥יתָ בְ/אַרְצֽ/וֹ־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/008.yaml
  text: You shall not abhor an Edomite[a], for he is your brother. You shall not abhor an Egyptian[c][b], for you were a sojourner in his land.
translation:
  language: sw
  text: Usimchukie Mwedomu[a], kwa kuwa yeye ni ndugu yako.[b] Usimchukie Mmisri, kwa kuwa ulikuwa mgeni[c] katika nchi yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usimkirihi” au “usimwone kuwa chukizo.”
    reason: lexical_alternative
  - marker: b
    text: “Ndugu yako” inadokeza uhusiano wa kifamilia wa Israeli na Edomu kupitia Esau.
    reason: cross_reference
  - marker: c
    text: Yaani, mtu wa kutoka nchi nyingine anayeishi kwa muda au kwa kudumu miongoni mwa watu wa nchi hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְתַעֵב
  choice: usimchukie
  rationale: Kitenzi hiki katika kauli ya Piel kina maana ya kumwona au kumtendea mtu kama mwenye kuchukiza. “Usimchukie” ni Kiswahili cha sasa, cha kawaida na chenye nguvu ya kutosha; kurudiwa kwake kunadumisha ulinganifu wa makatazo hayo mawili.
- source_word: אֲדֹמִי
  choice: Mwedomu
  rationale: Hili ni jina la kawaida la Kiswahili kwa mtu wa taifa la Edomu, likidumisha umoja wa uwakilishi uliopo katika Kiebrania.
- source_word: אָחִיךָ
  choice: ndugu yako
  rationale: Tafsiri ya moja kwa moja ya neno la kifamilia inadumisha uhusiano wa kihistoria kati ya Israeli na Edomu bila kulifafanua ndani ya matini.
- source_word: מִצְרִי
  choice: Mmisri
  rationale: Hili ni jina la kawaida la Kiswahili kwa mtu wa Misri na linadumisha umoja wa uwakilishi wa Kiebrania.
- source_word: גֵר
  choice: mgeni
  rationale: Katika muktadha huu neno humaanisha mtu aliyeishi nje ya nchi au ukoo wake chini ya ulinzi wa watu wengine. “Mgeni” ni neno la asili na linaloeleweka kwa urahisi; tanbihi inaonyesha maana mahususi zaidi ya ukaaji.
- source_word: בְאַרְצוֹ
  choice: katika nchi yake
  rationale: Tafsiri hii inadumisha kiambishi cha umoja katika Kiebrania, ambapo “Mmisri” anawakilisha Misri na watu wake.
- source_word: כִּי
  choice: kwa kuwa
  rationale: Kirai hiki kinaingiza sababu ya kila katazo kwa Kiswahili cha kawaida na chenye heshima.
theological_decisions:
- issue: Umoja wa uwakilishi kwa makundi ya kitaifa
  choice: 'Kudumisha umoja: “Mwedomu,” “Mmisri,” “yeye,” na “nchi yake”'
  alternative: 'Kutumia wingi: “Waedomu,” “Wamisri,” na “nchi yao”'
  rationale: Kiebrania hutumia majina ya umoja katika mtindo wa kisheria kumaanisha mtu yeyote wa kundi husika. Umoja unadumisha muundo wa chanzo na uzito binafsi wa amri.
- issue: Lugha ya undugu kuhusu Edomu
  choice: “ndugu yako”
  alternative: “jamaa yako”
  rationale: Neno la moja kwa moja linahifadhi msingi wa kifamilia wa katazo na uhusiano wa kihistoria wa Israeli na Edomu kupitia Esau, bila kuufanya ufafanuzi huo kuwa sehemu ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi mbili sambamba na marudio ya “Usimchukie” yanadumisha muundo wa sheria ya Kiebrania. Majina ya umoja yametumiwa kwa maana ya uwakilishi, kama katika chanzo.
