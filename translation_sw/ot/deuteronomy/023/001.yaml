  text: A man shall not take his father’s wife[b][a], nor uncover his father’s skirt.
translation:
  language: sw
  text: Mwanamume asimchukue mke wa baba yake[a], wala asiufunue upindo wa vazi la baba yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “asimwoe mke wa baba yake.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “asiufunue ukingo wa vazi la baba yake.” Huu ni usemi wa staha unaohusu tendo la ngono na mke wa baba yake; unaweza kueleweka kuwa kufunua uchi wa baba yake au kuingilia ndoa ya baba yake.
    reason: alternative_reading
lexical_decisions:
- source_word: יִקַּח
  choice: asimchukue
  rationale: Kitenzi לָקַח kikiwa na neno ‘mke’ kinaweza kumaanisha kumchukua awe mke, yaani kumwoa. ‘Asimchukue’ kinahifadhi namna ya usemi wa Kiebrania, huku ‘asimwoe’ ikiwekwa katika tanbihi kama maana mbadala iliyo wazi zaidi.
- source_word: אִישׁ
  choice: Mwanamume
  rationale: Nomino hii ya umoja wa kiume inataja mwanamume katika sheria hii; ‘mwanamume’ ni Kiswahili cha kawaida na sahihi.
- source_word: אֵשֶׁת אָבִיו
  choice: mke wa baba yake
  rationale: Tafsiri hii inahifadhi uhusiano unaotajwa moja kwa moja bila kuufupisha kuwa ‘mama yake wa kambo,’ ambalo lingeweza kupunguza upana wa usemi wa chanzo.
- source_word: יְגַלֶּה
  choice: asiufunue
  rationale: Kitenzi גלה humaanisha kufunua au kuweka wazi na hapa ni sehemu ya usemi wa staha wenye maana ya kingono. ‘Asiufunue’ kinadumisha sitiari ya chanzo.
- source_word: כְּנַף
  choice: upindo wa vazi
  rationale: כָּנָף linaweza kumaanisha bawa, ukingo, au upindo wa vazi. ‘Upindo wa vazi’ ni usemi wa asili katika Kiswahili unaowasilisha taswira ya vazi bila kuibadili moja kwa moja kuwa ‘uchi’ au ‘kitanda cha ndoa.’
theological_decisions:
- issue: Iwapo maana ya usemi wa staha wa kingono iwekwe wazi katika matini kuu
  choice: Kudumisha sitiari ‘asiufunue upindo wa vazi la baba yake’ katika matini kuu
  alternative: ‘asiufunue uchi wa baba yake’ au ‘asiingilie ndoa ya baba yake’
  rationale: Kiebrania kimetumia usemi wa kisitiari badala ya kauli ya kawaida ya ‘kufunua uchi.’ Kudumisha sitiari kunahifadhi mvutano na upekee wa chanzo; maana yake ya kingono inaelezwa katika tanbihi bila kuamuliwa kwa namna finyu katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya heshima, ya kisheria, na inayoeleweka kwa wasomaji wa kawaida. Muundo wa katazo umetolewa kwa viambishi vya hali ya kutendwa ‘asi- ... wala asi-’, na sitiari ya chanzo imehifadhiwa huku ikifafanuliwa katika tanbihi.
