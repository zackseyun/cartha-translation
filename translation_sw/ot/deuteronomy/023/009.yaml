  yaml_path: translation/ot/deuteronomy/023/009.yaml
  text: Children born to them in the third generation may enter the assembly of Yahweh[a][b].
translation:
  language: sw
  text: Watoto watakaozaliwa kwao katika kizazi cha tatu wanaweza kuingia katika kusanyiko la Yahweh[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “wana”; katika muktadha huu wa sheria na ukoo, neno hilo linawahusu watoto au wazao kwa upana.
    reason: lexical_alternative
  - marker: b
    text: Au, “kizazi cha tatu kitaingia.” Kiebrania kinaweza kutafsiriwa hivyo kwa kufuata muundo wake kwa karibu zaidi, lakini maana katika muktadha huu ni kwamba kuingia kunaruhusiwa kuanzia kizazi cha tatu.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּנִים
  choice: Watoto
  rationale: Ingawa neno la Kiebrania kwa umbo ni wingi wa kiume, katika muktadha huu wa ukoo na sheria linawahusu watoto au wazao kwa upana; “watoto” huhifadhi picha ya kifamilia kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר יִוָּלְדוּ לָהֶם
  choice: watakaozaliwa kwao
  rationale: Kauli tendwa ya ילד pamoja na ל ina maana ya kuzaliwa kwao; tafsiri hii ni ya asili na huhifadhi uhusiano wa sentensi.
- source_word: דּוֹר שְׁלִישִׁי
  choice: katika kizazi cha tatu
  rationale: Kirai hiki kinaonyesha hatua ya kizazi ambacho kuingia kunaruhusiwa, na muundo huu unaeleweka kwa urahisi katika Kiswahili.
- source_word: יָבֹא
  choice: wanaweza kuingia
  rationale: Kitenzi humaanisha kuja au kuingia; katika sheria hii, “wanaweza kuingia” huwasilisha ruhusa ya kukubaliwa badala ya kutabiri tu jambo litakalotokea.
- source_word: בִּקְהַל יְהוָה
  choice: katika kusanyiko la Yahwe
  rationale: קהל ni jamii iliyokusanyika, hasa katika mazingira ya agano na sheria; “kusanyiko” ni neno la sasa na lenye heshima. Jina יהוה limeandikwa “Yahwe” kama jina binafsi la Mungu.
theological_decisions:
- issue: Uandishi wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni, hivyo jina binafsi linahifadhiwa badala ya kubadilishwa kuwa cheo.
- issue: Upana wa maana ya בָּנִים katika sheria ya ukoo
  choice: Watoto
  alternative: Wana au wazao
  rationale: Umbo la Kiebrania ni la kiume, lakini katika muktadha huu linawakilisha watoto au wazao wa ukoo kwa upana; tanbihi huhifadhi maana halisi ya “wana.”
- issue: Nguvu ya יָבֹא katika sheria hii
  choice: wanaweza kuingia
  alternative: wataingia
  rationale: Tafsiri iliyochaguliwa inaonyesha kuwa kukubaliwa kunaruhusiwa kuanzia kizazi cha tatu, huku tanbihi ikihifadhi uwezekano wa tafsiri rasmi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa msomaji wa kawaida bila kuondoa hali ya kisheria ya kifungu; “kusanyiko” huhifadhi dhana ya jamii iliyokusanyika, na tanbihi zinatunza maana halisi ya “wana” pamoja na utata wa namna ya kutafsiri kitenzi.
