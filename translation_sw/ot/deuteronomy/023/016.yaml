  text: You shall not hand over to his master a servant who has escaped from his master to you[a].
translation:
  language: sw
  text: Usimkabidhi bwana wake mtumwa[a] aliyetoroka kutoka kwa bwana wake na kukujia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtumishi.” Neno la Kiebrania linaweza kumaanisha mtumishi au mtumwa; hapa “mtumwa” limetumiwa kwa sababu hali yake ya kuwa chini ya mamlaka ya bwana ni jambo kuu katika sheria hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַסְגִּיר
  choice: usimkabidhi
  rationale: Hifili ya סגר hapa ina maana ya kumtia mtu mikononi au chini ya mamlaka ya mwingine. “Kumkabidhi” ni Kiswahili cha kawaida chenye uzito wa kisheria unaofaa muktadha.
- source_word: עֶבֶד
  choice: mtumwa
  rationale: Ingawa neno hili linaweza kumaanisha mtumishi au mtumwa, hapa mtu huyo yuko chini ya mamlaka ya bwana na amemkimbia; kwa hiyo “mtumwa” huonyesha wazi hali yake ya utegemezi na kutiishwa.
- source_word: אֶל אֲדֹנָיו
  choice: kwa bwana wake
  rationale: Katika muktadha huu wa kijamii na kisheria, אָדוֹן humaanisha bwana mwenye mamlaka juu ya mtumwa, wala si cheo cha Mungu.
- source_word: אֲשֶׁר יִנָּצֵל
  choice: ambaye amemkimbia
  rationale: Nifali ya נצל inaweza kuonyesha kuokolewa au kuponyoka. Katika muktadha wa mtumwa anayeondoka kwa bwana wake, “amemkimbia” hutoa maana ya kuponyoka bila kudokeza kwa lazima kwamba mtu mwingine alimwokoa.
- source_word: אֵלֶיךָ
  choice: na kukujia
  rationale: אֶל huonyesha mwendo kuelekea kwa anayeambiwa. “Kukujia” ni usemi wa asili unaohifadhi mwelekeo huo.
- source_word: מֵעִם אֲדֹנָיו
  choice: bwana wake
  rationale: מֵעִם huonyesha kujitenga na mtu ambaye alikuwa pamoja naye au chini ya mamlaka yake. Muundo “amemkimbia bwana wake” huwasilisha kwa kawaida kujitenga huko katika Kiswahili.
theological_decisions:
- issue: Hadhi ya kijamii inayoonyeshwa na עֶבֶד
  choice: mtumwa
  alternative: mtumishi
  rationale: Sheria hii inamhusu mtu aliye chini ya mamlaka ya bwana ambaye amemkimbia na ambaye hapaswi kurejeshwa kwake. Kwa kuwa hali ya utumwa ni kiini cha amri, “mtumwa” ni wazi zaidi kuliko “mtumishi,” huku uwezekano mpana wa neno la Kiebrania ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Muundo umegawanya wazo la kuponyoka kuelekea kwa anayeambiwa kuwa “amemkimbia ... na kukujia,” ili sentensi iwe ya asili bila kupoteza mwendo wa מֵעִם ... אֵלֶיךָ.
