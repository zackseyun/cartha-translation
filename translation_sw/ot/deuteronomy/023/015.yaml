base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/015.yaml
  text: For Yahweh your God walks in the midst of your camp to deliver you and to give your enemies before you[a]. Therefore your camp must be holy[c][b], so that he may not see in you anything indecent and turn away from you.
translation:
  language: sw
  text: Kwa maana Yahwe Mungu wako hutembea katikati ya kambi yako ili kukuokoa na kuwatia adui zako mikononi mwako.[a] Kwa hiyo, kambi yako lazima iwe takatifu, ili asione miongoni mwako jambo lolote la aibu[b] akageuka na kukuacha.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “na kuwaweka adui zako mbele yako.” Nahau hiyo inamaanisha kuwakabidhi chini ya mamlaka yako.
    reason: lexical_alternative
  - marker: b
    text: Au “jambo fulani la aibu.” Usemi wa Kiebrania ni mpana na unaweza kumaanisha jambo la aibu, lisilo la heshima, au lenye kunajisi kambi.
    reason: lexical_alternative
  - marker: c
    text: Kwa tafsiri ya moja kwa moja zaidi, “akageuka kutoka nyuma yako,” ikionyesha kwamba hataendelea kuandamana nawe.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la agano la Mungu kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: מִתְהַלֵּךְ
  choice: hutembea
  rationale: Linadumisha taswira halisi ya uwepo wa Mungu akitembea kambini, badala ya kuibadili kuwa kauli dhahania ya kuwapo tu.
- source_word: בְּקֶרֶב מַחֲנֶךָ
  choice: katikati ya kambi yako
  rationale: Linaakisi wazo la kuwa ndani au katikati ya kambi kwa Kiswahili cha kawaida.
- source_word: לְהַצִּילְךָ
  choice: ili kukuokoa
  rationale: Katika muktadha wa kijeshi, neno hili linaeleza kumwondoa mtu katika hatari au mikononi mwa adui.
- source_word: וְלָתֵת אֹיְבֶיךָ לְפָנֶיךָ
  choice: na kuwatia adui zako mikononi mwako
  rationale: Hii ni tafsiri ya kawaida ya nahau ya Kiebrania inayomaanisha kuwakabidhi adui chini ya mamlaka yako; tafsiri ya moja kwa moja imewekwa katika tanbihi.
- source_word: וְהָיָה מַחֲנֶיךָ קָדוֹשׁ
  choice: Kwa hiyo, kambi yako lazima iwe takatifu
  rationale: 'Muktadha unaonyesha matokeo na wajibu: kwa sababu Yahwe yuko kambini, kambi inapaswa kudumishwa kuwa takatifu.'
- source_word: עֶרְוַת דָּבָר
  choice: jambo lolote lisilofaa
  rationale: Usemi huu mpana unaweza kumaanisha jambo la aibu, lisilo la heshima, au lenye kunajisi; hauishii tu kwenye uchi wa mwili.
- source_word: וְשָׁב מֵאַחֲרֶיךָ
  choice: akageuka na kukuacha
  rationale: Kiswahili hiki kinaeleza matokeo kwa kawaida, huku tanbihi ikihifadhi taswira halisi ya Yahwe kugeuka kutoka nyuma ya watu na kutofuatana nao tena.
theological_decisions:
- issue: Maelezo ya Yahwe kwa lugha ya kibinadamu kuwa anatembea kambini
  choice: Kudumisha kitenzi halisi “hutembea”
  alternative: “yupo katika kambi yako”
  rationale: Kiebrania kinatumia kwa makusudi taswira ya mwendo ili kusisitiza ukaribu wa uwepo wa Mungu na ulazima wa utakatifu, bila kudai kwamba Mungu ana mwili.
- issue: Nguvu ya kauli kuhusu utakatifu wa kambi
  choice: “kambi yako lazima iwe takatifu”
  alternative: “kambi yako itakuwa takatifu”
  rationale: Katika muktadha, kauli hiyo ni agizo linalotokana na uwepo wa Yahwe, si utabiri tu.
- issue: Maana pana ya עֶרְוַת דָּבָר
  choice: Kutotaja dhambi au unajisi wa aina moja pekee
  alternative: Kufasiri kuwa uchi wa mwili tu
  rationale: Usemi wa Kiebrania unabaki mpana; tafsiri haipaswi kuufungia katika jambo moja la kiibada, kimaadili, au kimwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa nafsi ya pili umoja umehifadhiwa kwa sababu Kiebrania linaiambia Israeli kwa umoja wa kijumuiya. Taswira ya Mungu kutembea imeachwa wazi, huku nahau ngumu zikielezwa kwa Kiswahili asilia na kufafanuliwa katika tanbihi.
