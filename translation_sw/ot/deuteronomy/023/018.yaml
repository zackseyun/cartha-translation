base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/018.yaml
  text: There shall not be a cult prostitute from the daughters of Israel[a], and there shall not be a cult prostitute from the sons of Israel.
translation:
  language: sw
  text: Kusiwe na kahaba wa kike wa ibada miongoni mwa binti za Israeli[a], wala kusiwe na kahaba wa kiume wa ibada miongoni mwa wana wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kahaba wa hekaluni.” Maneno ya Kiebrania kwa mwanamke na mwanamume kwa maana halisi yanahusiana na mtu “aliyewekwa wakfu,” lakini hapa yanatumiwa kwa maana mbaya kuhusu ukahaba uliohusishwa na ibada potovu. Kutaja “hekalu” kunaweza kubainisha mahali kupita kiasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵשָׁה
  choice: kahaba wa kike wa ibada
  rationale: Neno la kike linaeleweka hapa kama istilahi ya mtu wa kike aliyehusishwa na ukahaba katika ibada potovu. Tafsiri hii inaonyesha jinsia na uhusiano wa kidini bila kudokeza kwamba tendo hilo lilikubalika.
- source_word: קָדֵשׁ
  choice: kahaba wa kiume wa ibada
  rationale: Neno hili ni sambamba la kiume la קְדֵשָׁה. Kutumia muundo unaofanana kunahifadhi usambamba wa Kiebrania na kubainisha kwamba anayelengwa hapa ni mwanamume.
- source_word: לֹא תִהְיֶה / וְלֹא יִהְיֶה
  choice: Kusiwe na / wala kusiwe na
  rationale: Muundo huu wa Kiswahili unatoa katazo la kisheria kwa lugha ya kawaida na yenye hadhi, huku “wala” ikihifadhi usambamba wa vipashio viwili.
- source_word: מִבְּנוֹת יִשְׂרָאֵל / מִבְּנֵי יִשְׂרָאֵל
  choice: miongoni mwa binti za Israeli / miongoni mwa wana wa Israeli
  rationale: Katika sentensi hii, מִן ina maana ya mtu kutoka ndani ya kundi, ambayo Kiswahili cha kawaida huiwasilisha kwa “miongoni mwa.” “Binti” na “wana” zinahifadhi usambamba wa kifamilia na wa kitaifa wa matini ya Kiebrania.
theological_decisions:
- issue: Maana ya קְדֵשָׁה na קָדֵשׁ katika katazo hili
  choice: Istilahi hizi zinarejelea mwanamke na mwanamume wanaohusika na ukahaba unaohusiana na ibada potovu.
  alternative: Zinaweza kutafsiriwa kijuujuu kuwa “mwanamke/mwanamume aliyewekwa wakfu,” au kwa ujumla kuwa watu wenye uasherati.
  rationale: Ingawa maneno haya yanatokana na mzizi unaohusiana na kuwa mtakatifu au kuwekwa wakfu, katika muktadha huu ni istilahi zenye maana mbaya ya shughuli ya kingono ya kiibada. Tafsiri inaonyesha maana hiyo bila kuipanua kuwa katazo la kila aina ya uasherati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sheria ni mfupi, wenye hadhi, na unaoeleweka kwa msomaji wa kawaida. “Kahaba wa kike/wa kiume wa ibada” huepuka kudhani kwamba “kahaba” ni mwanamke pekee na huhifadhi tofauti ya jinsia iliyo wazi katika Kiebrania.
