  text: כִּֽי יִהְיֶ֤ה בְ/ךָ֙ אִ֔ישׁ אֲשֶׁ֛ר לֹא יִהְיֶ֥ה טָה֖וֹר מִ/קְּרֵה לָ֑יְלָה וְ/יָצָא֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה לֹ֥א יָבֹ֖א אֶל תּ֥וֹךְ הַֽ/מַּחֲנֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/011.yaml
  text: If there is among you a man who is not clean because of a nocturnal emission[a], he shall go outside the camp; he shall not come into the midst of the camp.
translation:
  language: sw
  text: Ikiwa kuna mwanamume miongoni mwenu ambaye si safi kwa sababu ya kutokwa na shahawa usiku[a], atoke nje ya kambi; asiingie katikati ya kambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “tukio la usiku,” nahau inayomaanisha kutokwa na shahawa usiku.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ikiwa
  rationale: Katika sheria hii neno hilo linaanzisha hali ya masharti; “ikiwa” linaonyesha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: יִהְיֶה בְךָ אִישׁ
  choice: kuna mwanamume miongoni mwenu
  rationale: Kauli hii inahifadhi maana ya kuwapo kwa mtu ndani ya jumuiya, huku “mwanamume” ikilingana na hali mahususi ya mwili inayotajwa.
- source_word: אֲשֶׁר לֹא יִהְיֶה טָהוֹר
  choice: ambaye si safi
  rationale: “Si safi” linaonyesha hali ya kutokuwa safi kiibada bila kudokeza kosa la kimaadili.
- source_word: מִקְּרֵה לָיְלָה
  choice: kwa sababu ya kutokwa na shahawa usiku
  rationale: Nahau ya Kiebrania, kihalisi “tukio la usiku,” inarejelea utoaji wa shahawa usiku; tafsiri hii ni wazi, ya asili, na sahihi.
- source_word: וְיָצָא אֶל מִחוּץ לַמַּחֲנֶה
  choice: atoke nje ya kambi
  rationale: Umbo la Kiswahili la amri linaendeleza agizo la kisheria na kuhifadhi mwendo wa kutoka mipakani mwa kambi.
- source_word: לֹא יָבֹא אֶל תּוֹךְ הַמַּחֲנֶה
  choice: asiingie katikati ya kambi
  rationale: “Katikati” linahifadhi wazo la sehemu ya ndani ya kambi lililomo katika תּוֹךְ, badala ya kulifanya kuwa katazo la kuvuka mpaka tu.
theological_decisions:
- issue: Asili ya hali ya kutokuwa safi katika mstari
  choice: Kutafsiri kuwa hali ya kutokuwa safi kiibada, si uchafu wa kimaadili.
  alternative: Kutafsiri hali hiyo kana kwamba inadokeza kosa au dhambi ya kimaadili.
  rationale: Muktadha unahusu utakatifu wa kambi na hali ya mwili iliyodhibitiwa kiibada; mstari haumlaumu mwanamume kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka. “Shahawa” hutoa uwazi unaohitajika bila kuwa lugha chafu, na “si safi” huepuka kuchanganya hali ya kiibada na hatia ya kimaadili.
