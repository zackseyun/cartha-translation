  terminology: “Yahweh,” “kahaba,” “nadhiri,” na “chukizo” zinafaa kwa rejista na kwa istilahi. Tanbihi ihifadhi uwezekano unaobishaniwa wa “mbwa” bila kuufanya kuwa maana ya andiko kuu; “bei ya kahaba wa kiume” hulingana kwa karibu zaidi na “price of a male prostitute.”
