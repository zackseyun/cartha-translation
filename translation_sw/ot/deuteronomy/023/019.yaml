  text: לֹא תָבִיא֩ אֶתְנַ֨ן זוֹנָ֜ה וּ/מְחִ֣יר כֶּ֗לֶב בֵּ֛ית יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/כָל נֶ֑דֶר כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ גַּם שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/019.yaml
  text: You shall not bring the wages of a prostitute or the price of a dog into the house of Yahweh your God for any vow[a], because both of them are an abomination to Yahweh your God.
translation:
  language: sw
  text: Usilete malipo ya kahaba wala bei ya mbwa katika nyumba ya Yahweh Mungu wako kwa nadhiri yoyote,[a] kwa maana vyote viwili ni chukizo kwa Yahweh Mungu wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “bei ya kahaba wa kiume,” ikiwa neno “mbwa” linaeleweka hapa kuwa jina la dharau kwa kahaba wa kiume wa ibada.
    reason: alternative_reading
lexical_decisions:
- source_word: תָבִיא
  choice: usilete
  rationale: Hifili ya בוא hapa ina maana ya kuingiza au kuleta kitu mahali; “usilete” ni ya kawaida na huhifadhi nguvu ya katazo.
- source_word: אֶתְנַן זוֹנָה
  choice: malipo ya kahaba
  rationale: אֶתְנַן ni malipo yanayotolewa kwa huduma, na זוֹנָה ni kahaba. Usemi huu ni wazi na wa moja kwa moja katika Kiswahili cha sasa.
- source_word: מְחִיר כֶּלֶב
  choice: bei ya mbwa
  rationale: מְחִיר kwa kawaida ni bei au thamani ya kubadilishia, na כֶּלֶב kwa maana ya msingi ni mbwa. Tafsiri kuu huhifadhi maneno ya Kiebrania bila kuamua kimyakimya maana inayobishaniwa.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: nyumba ya Yahweh Mungu wako
  rationale: בֵּית ni “nyumba,” nalo jina la agano יְהוָה limetolewa kama “Yahweh.” “Nyumba” huepuka kuingiza mapema zaidi dhana mahsusi ya hekalu.
- source_word: לְכָל נֶדֶר
  choice: kwa ajili ya kutimiza nadhiri yoyote
  rationale: Kirai kinaonyesha kusudi la kuleta malipo hayo, yaani kwa uhusiano na nadhiri. “Kutimiza” huweka wazi maana ya kimuktadha bila kubadili katazo.
- source_word: תוֹעֲבַת
  choice: chukizo
  rationale: Neno hili huonyesha kitu kinachochukiza sana mbele za Mungu; “chukizo” ni neno lenye uzito, la asili na linaloeleweka katika Kiswahili.
- source_word: גַּם שְׁנֵיהֶם
  choice: vitu hivyo viwili
  rationale: Kiwakilishi kinarejelea malipo na bei zilizotajwa. “Vitu hivyo viwili” huonyesha kwa kawaida kwamba vyote vimejumuishwa.
theological_decisions:
- issue: Maana ya כֶּלֶב katika מְחִיר כֶּלֶב
  choice: Kutafsiri neno lenyewe kama “mbwa” katika andiko kuu.
  alternative: Kahaba wa kiume, au jina la dharau kwa kahaba wa kiume wa ibada.
  rationale: Maana ya msingi ya כֶּלֶב ni “mbwa,” huku maana ya kahaba wa kiume ikiwa tafsiri inayobishaniwa. Andiko kuu huhifadhi maana ya kileksia, na uwezekano mwingine unaelezwa katika tanbihi.
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina la agano יְהוָה; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umewekwa wazi bila kuondoa utata halisi wa “mbwa.” Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika.
