base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/022.yaml
  text: But if you make a vow to Yahweh your God[a], you shall not delay in paying it, for Yahweh your God will surely require it from you, and it will be sin in you.
translation:
  language: sw
  text: Lakini ukimwekea Yahwe Mungu wako nadhiri, usikawie kuitimiza, kwa maana Yahwe Mungu wako hakika atakutaka uitimize, nawe utakuwa na hatia ya dhambi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa maneno ya moja kwa moja: “na dhambi itakuwa ndani yako.”'
    reason: Muundo wa Kiebrania ni wa kimafumbo na unaweza pia kutafsiriwa kwa maana ya kuwa na hatia ya dhambi.
lexical_decisions:
- source_word: כִּי
  choice: Lakini uki-
  rationale: Katika muktadha wa mstari uliotangulia, neno hili linaanzisha sharti lenye utofautishaji mdogo; “Lakini uki-” linaonyesha yote mawili kwa Kiswahili cha kawaida.
- source_word: תִדֹּר נֶדֶר
  choice: ukimwekea ... nadhiri
  rationale: Muundo wa Kiebrania wa kitenzi pamoja na nomino yenye mzizi mmoja una maana ya kuweka au kufanya nadhiri; “kumwekea ... nadhiri” ni wa asili na pia humtaja wazi mpokeaji.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: Yahwe Mungu wako
  rationale: Kihusishi kinaonyesha nadhiri inaelekezwa kwa Yahwe; jina la agano יהוה limetoholewa kuwa “Yahwe.”
- source_word: לֹא תְאַחֵר
  choice: usikawie
  rationale: Hii ni marufuku ya kisheria dhidi ya kuchelewesha kutekeleza wajibu; “usikawie” ni fupi, wazi, na ya kawaida.
- source_word: לְשַׁלְּמוֹ
  choice: kuitimiza
  rationale: Katika muktadha wa nadhiri, שלם humaanisha kulipa au kutimiza kilichoahidiwa. “Kuitimiza” inafaa kwa aina mbalimbali za nadhiri bila kuifanya lazima kuwa malipo ya fedha.
- source_word: דָּרֹשׁ יִדְרְשֶׁנּוּ
  choice: hakika atakudai uitimize
  rationale: Umoja wa infinitivu kamili na kitenzi huongeza msisitizo. “Hakika” huhifadhi msisitizo huo, na kirai chote huonyesha kwamba Yahwe atamtaka aliyeweka nadhiri aitimize.
- source_word: מֵעִמָּךְ
  choice: atakudai
  rationale: Kirai hiki huonyesha kwamba wajibu utatakiwa kutoka kwa mtu aliyeweka nadhiri; kiambishi cha yambwa katika “atakudai” kinawasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: nawe utakuwa na hatia ya dhambi
  rationale: Hili ni tamko la kawaida la Kiebrania linaloweza kueleza dhambi au hatia inayomhusu mtu. Tafsiri hii ni wazi kwa msomaji wa Kiswahili, huku tanbihi ikihifadhi umbo halisi zaidi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la agano יהוה moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Maana ya וְהָיָה בְךָ חֵטְא
  choice: nawe utakuwa na hatia ya dhambi
  alternative: na dhambi itakuwa ndani yako
  rationale: Muundo wa Kiebrania ni mfupi na wenye uwezekano wa kueleweka kama kupata hatia. Maandishi makuu yanatoa Kiswahili kinachoeleweka bila kuficha umbo la asili, ambalo limetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Umoja wa nafsi ya pili umehifadhiwa. “Nadhiri” limetumiwa kama neno la kawaida la kibiblia, na sentensi imeepuka mtindo mgumu wa neno kwa neno.
