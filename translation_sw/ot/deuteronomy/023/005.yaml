  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: עַל דְּבַ֞ר אֲשֶׁ֨ר לֹא קִדְּמ֤וּ אֶתְ/כֶם֙ בַּ/לֶּ֣חֶם וּ/בַ/מַּ֔יִם בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֣ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁר֩ שָׂכַ֨ר עָלֶ֜י/ךָ אֶת בִּלְעָ֣ם בֶּן בְּע֗וֹר מִ/פְּת֛וֹר אֲרַ֥ם נַהֲרַ֖יִם לְ/קַֽלְלֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/005.yaml
  text: because they did not meet you with bread and water on the way when you came out from Egypt[a], and because he hired Balaam son of Beor from Pethor of Aram-naharaim against you to curse you.
translation:
  language: sw
  text: kwa sababu hawakuwalaki kwa mkate na maji njiani mlipotoka Misri, na kwa sababu alimwajiri Balaamu mwana wa Beori kutoka Pethori, katika Aramu-Naharaimu[a], dhidi yako ili akulaani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aramu-Naharaimu hutambulishwa kimapokeo kuwa Mesopotamia; jina hilo humaanisha kihalisi “Aramu ya Mito Miwili.”
    reason: cultural_note
lexical_decisions:
- source_word: עַל דְּבַר
  choice: kwa sababu
  rationale: Kirai hiki kinatoa sababu ya katazo lililotangulia; “kwa sababu” ni cha asili katika Kiswahili na kinahifadhi maana ya kisababishi.
- source_word: קִדְּמוּ אֶתְכֶם
  choice: hawakuwajia
  rationale: Katika muktadha huu kitenzi kina maana ya kwenda kuwalaki watu kwa mahitaji. “Hawakuwajia” kinahifadhi tendo la kwenda kukutana nao bila kuongeza kwa lazima wazo pana zaidi la kuwakaribisha.
- source_word: בַּלֶּחֶם וּבַמַּיִם
  choice: na mkate na maji
  rationale: Nomino halisi “mkate” na “maji” zimehifadhiwa badala ya kuzifanya kwa ujumla kuwa “chakula na maji.”
- source_word: בַּדֶּרֶךְ
  choice: njiani
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya mahali walipokuwa wakisafiri.
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: mlipotoka Misri
  rationale: Muundo huu wa Kiswahili unaonyesha vizuri wakati wa tendo na unahifadhi rejeo la kutoka Misri.
- source_word: וַאֲשֶׁר
  choice: na kwa sababu
  rationale: Maneno haya yanaanzisha sababu ya pili iliyo sambamba na ya kwanza.
- source_word: שָׂכַר עָלֶיךָ
  choice: alimwajiri ... dhidi yako
  rationale: “Alimwajiri” huhifadhi maana ya kulipa mtu afanye kazi, na “dhidi yako” huonyesha mwelekeo wa uhasama wa kihusishi עַל katika muktadha huu.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Balaamu mwana wa Beori
  rationale: Majina yameandikwa kwa maumbo yanayotumika kwa kawaida katika Biblia za Kiswahili, huku uhusiano wa nasaba ukihifadhiwa.
- source_word: מִפְּתֹר אֲרַם נַהֲרַיִם
  choice: kutoka Pethori katika Aram-Naharaimu
  rationale: Majina ya mahali yametoholewa kwa Kiswahili. “Katika” linaonyesha kwa uwazi kwamba Pethori iko katika eneo la Aram-Naharaimu bila kubadili jina hilo kuwa tafsiri ya kimapokeo “Mesopotamia.”
- source_word: לְקַלְלֶךָּ
  choice: ili akulaani
  rationale: “Ili” huonyesha kusudi la kumwajiri Balaamu, na “akulaani” ni tafsiri ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Kubadilika kwa nafsi kutoka wingi kwenda umoja katika Kiebrania
  choice: “hawakuwajia ... mlipotoka” kisha “dhidi yako ili akulaani”
  alternative: 'Kutumia wingi katika sentensi yote: “dhidi yenu ili awalaani”'
  rationale: Kiebrania hubadilika kutoka kiwakilishi cha wingi katika sehemu ya kwanza kwenda umoja katika sehemu ya pili. Tafsiri imehifadhi badiliko hilo badala ya kulisawazisha kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Aya imeachwa kama kishazi cha sababu kwa kuwa inaendeleza katazo la aya iliyotangulia. Alama ya tanbihi imewekwa baada ya “Aram-Naharaimu,” ambako maelezo yake yanahusika moja kwa moja.
