  yaml_path: translation/ot/deuteronomy/023/025.yaml
  text: When you enter your neighbor’s vineyard[a], you may eat grapes as your appetite desires, until you are satisfied[c][b], but you shall not put any into your container.
translation:
  language: sw
  text: Ukiingia katika shamba la mizabibu la jirani yako,[a] unaweza kula zabibu kadiri unavyotamani, mpaka ushibe,[b] lakini usitie zabibu katika chombo chako.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ikiwa utaingia katika shamba la mizabibu la jirani yako.” Neno la Kiebrania linaweza kuanzisha hali ya wakati au ya sharti.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kulingana na hamu yako, kushiba kwako”; ni nahau yenye maana ya kula kadiri unavyotamani mpaka ushibe.
    reason: lexical_alternative
  - marker: c
    text: Au, “kifaa chako.” Neno la Kiebrania ni la jumla na halitaji aina maalumu ya chombo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: Ukiingia
  rationale: כִּי hapa linaanzisha hali ya kisheria, na תָבֹא kutoka בוא lina maana ya kuingia mahali. Kiswahili cha masharti kwa ki- kinawasilisha hali hiyo kwa kawaida huku kikihifadhi uwezekano wa kuelewa ‘ikiwa/wakati.’
- source_word: בְּכֶרֶם רֵעֶךָ
  choice: katika shamba la mizabibu la jirani yako
  rationale: כֶּרֶם ni shamba la mizabibu, na רֵעַ hapa humaanisha jirani au mtu mwenzako; ‘jirani yako’ ni usemi wa kawaida na unaofaa katika sheria hii.
- source_word: וְאָכַלְתָּ עֲנָבִים
  choice: unaweza kula zabibu
  rationale: Katika muktadha huu wa sheria, umbo la kitenzi linaonyesha ruhusa, si amri ya lazima; ‘unaweza kula’ linaweka hilo wazi.
- source_word: כְּנַפְשְׁךָ שָׂבְעֶךָ
  choice: kadiri unavyotamani, mpaka ushibe
  rationale: נֶפֶשׁ hapa hurejelea hamu ya mtu, si ‘nafsi’ kwa maana ya kiteolojia, na שָׂבַע huonyesha kushiba. Tafsiri hii inawasilisha ruhusa ya kula kwa matumizi ya papo hapo hadi kushiba.
- source_word: וְאֶל כֶּלְיְךָ לֹא תִתֵּן
  choice: lakini usitie hata moja katika chombo chako
  rationale: כְּלִי ni neno la jumla kwa chombo au kifaa cha kubebea; ‘chombo’ hakibainishi kikapu au mfuko. ‘Hata moja’ linaweka wazi kitu kinachodokezwa, yaani zabibu.
