  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לַ/נָּכְרִ֣י תַשִּׁ֔יךְ וּ/לְ/אָחִ֖י/ךָ לֹ֣א תַשִּׁ֑יךְ לְמַ֨עַן יְבָרֶכְ/ךָ֜ יְהוָ֣ה אֱלֹהֶ֗י/ךָ בְּ/כֹל֙ מִשְׁלַ֣ח יָדֶ֔/ךָ עַל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/021.yaml
  text: You may charge interest to a foreigner[a], but to your brother you shall not charge interest[b], so that Yahweh your God may bless you in all the work of your hand in the land that you are entering to possess.
translation:
  language: sw
  text: Unaweza kumtoza mgeni riba[a], lakini usimtoze ndugu yako[b] riba, ili Yahwe Mungu wako akubariki katika kila kazi ya mikono yako, katika nchi unayoingia kuimiliki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kumkopesha mgeni kwa riba” au “kudai riba kutoka kwa mgeni.”
    reason: lexical_alternative
  - marker: b
    text: Hapa “ndugu yako” humaanisha mwanajumuiya mwenzako wa Israeli; Kiebrania kinadumisha neno la kifamilia.
    reason: cultural_note
lexical_decisions:
- source_word: לַנָּכְרִי
  choice: mgeni
  rationale: Neno נָכְרִי humaanisha mtu wa taifa jingine au aliye nje ya jumuiya ya Israeli. “Mgeni” ni neno la kawaida la Kiswahili na linadumisha utofauti wake na “ndugu yako.”
- source_word: תַשִּׁיךְ / לֹא תַשִּׁיךְ
  choice: kumtoza ... riba / usimtoze ... riba
  rationale: Katika sheria hii, Hifili ya נשׁך inahusu kutoza riba kwa mkopo. Usemi “kutoza riba” ni wa kawaida na haudokezi moja kwa moja kwamba kiwango hicho ni cha unyonyaji.
- source_word: אָחִיךָ
  choice: ndugu yako
  rationale: Tafsiri hii inadumisha lugha halisi ya kifamilia ya Kiebrania; katika muktadha wa sheria ya agano, inamaanisha mwanajumuiya mwenzao wa Israeli.
- source_word: לְמַעַן
  choice: ili
  rationale: “Ili” linaonyesha kusudi au matokeo yanayokusudiwa kwa njia ya asili katika Kiswahili.
- source_word: יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: Yahwe Mungu wako akubariki
  rationale: Jina la agano יְהוָה limetoholewa kuwa “Yahwe,” na umbo la kitenzi katika kishazi cha kusudi limewasilishwa kwa “akubariki.”
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: katika kila kazi ya mikono yako
  rationale: Huu ni usemi wa Kiebrania kuhusu shughuli au jitihada za mtu. Tafsiri inadumisha taswira ya mikono huku ikieleweka kwa urahisi.
- source_word: עַל הָאָרֶץ
  choice: katika nchi
  rationale: Ingawa עַל kwa kawaida ni “juu ya,” hapa Kiswahili cha kawaida hutumia “katika nchi” kuonyesha mahali.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: unayoingia kuimiliki
  rationale: Tafsiri hii inaonyesha kuingia kunakokaribia na kusudi la kuitwaa nchi kuwa milki, bila kuongeza jina la nchi ambalo halimo katika mstari.
theological_decisions:
- issue: Tafsiri ya jina la agano יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Andiko linatumia jina la Mungu יְהוָה moja kwa moja. “Yahwe” linadumisha jina hilo la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya “ndugu yako” katika sheria hii
  choice: Kudumisha “ndugu yako” na kufafanua muktadha katika tanbihi
  alternative: Mwisraeli mwenzako
  rationale: Kiebrania kinatumia neno la kifamilia אָחִיךָ. Kulidumisha huhifadhi taswira ya udugu wa agano, huku tanbihi ikieleza rejeo lake la kijamii bila kulipanua au kulipunguza kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa ruhusa na katazo, taswira ya udugu, jina Yahwe, na taswira ya kazi ya mikono vimedumishwa bila kuifanya sentensi kuwa ngumu.
