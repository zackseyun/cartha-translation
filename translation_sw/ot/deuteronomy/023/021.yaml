  source_fidelity: Tafsiri inahifadhi kwa usahihi ruhusa kwa נָכְרִי na katazo kwa אָחִיךָ, pamoja na kusudi la baraka za Yahwe katika shughuli za mtu na nchi anayoingia kuimiliki. “Mgeni” katika muktadha huu inaweza kumaanisha mgeni/mtu wa nje, na tanbihi inaelekeza tofauti ya kijamii inayokusudiwa.
