base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/026.yaml
  text: When you come into your neighbor’s standing grain[a], you may pluck heads with your hand[b], but you shall not put a sickle to your neighbor’s standing grain.
translation:
  language: sw
  text: Uingiapo katika nafaka ya jirani yako ambayo bado haijavunwa, unaweza kuchuma masuke[a] kwa mkono wako, lakini usitumie mundu[b] juu ya nafaka ya jirani yako ambayo bado haijavunwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mashuke ya nafaka.” Neno la Kiebrania linamaanisha sehemu za juu za nafaka zenye punje, ambazo zinaweza kuchumwa kwa mkono.
    reason: lexical_alternative
  - marker: b
    text: 'Kwa tafsiri iliyo karibu zaidi na muundo wa Kiebrania: “usiinue mundu juu ya nafaka ya jirani yako ambayo bado haijavunwa.” Kitenzi cha Kiebrania kinaweza kumaanisha kuinua, kupunga, au kutumia mundu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: Uingiapo
  rationale: כִּי introduces the circumstance in which the law applies, and בוא denotes coming or entering. The Swahili temporal form naturally conveys “when you enter” without weakening the legal force.
- source_word: בְּקָמַת
  choice: katika mimea ya nafaka
  rationale: קָמָה denotes grain still standing in the field. “Mimea ya nafaka” identifies the unharvested crop more naturally in current Swahili than a wooden equivalent of “standing grain.”
- source_word: רֵעֶךָ
  choice: ya jirani yako
  rationale: In this legal context רֵעַ refers to another member of the community. “Jirani yako” is the established, natural Swahili equivalent.
- source_word: וְקָטַפְתָּ
  choice: unaweza kuchuma
  rationale: The form expresses permitted action in this law rather than a command. “Unaweza” makes that permission clear, while “kuchuma” appropriately describes plucking by hand.
- source_word: מְלִילֹת
  choice: mashuke
  rationale: The noun refers to the grain-bearing ears or heads. “Mashuke” is precise, concise, and familiar in East African Swahili.
- source_word: בְּיָדֶךָ
  choice: kwa mkono wako
  rationale: 'This phrase marks the permitted means: manual plucking only. The wording closely and naturally reflects the Hebrew.'
- source_word: וְחֶרְמֵשׁ לֹא תָנִיף עַל
  choice: lakini usitumie mundu kuvuna
  rationale: The conjunction establishes a contrast, and the Hiphil of נוּף with a sickle indicates raising, swinging, or applying the harvesting tool. This rendering states the intended prohibited action naturally, while the footnote preserves the more literal imagery.
- source_word: קָמַת רֵעֶךָ
  choice: mimea ya nafaka ya jirani yako
  rationale: The phrase is repeated to preserve the Hebrew emphasis that the prohibition concerns the neighbor’s unharvested crop.
