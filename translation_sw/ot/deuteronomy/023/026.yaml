translation_notes:
  register: Standard East African Swahili; natural, current, and dignified legal language. The temporal construction “Uingiapo” is compact and scripturally appropriate without being archaic. “Mimea ya nafaka” avoids the unnatural literal phrase “nafaka iliyosimama,” while retaining the distinction between an unharvested crop and harvested grain.
