  text: לֹֽא יָבֹ֧א עַמּוֹנִ֛י וּ/מוֹאָבִ֖י בִּ/קְהַ֣ל יְהוָ֑ה גַּ֚ם דּ֣וֹר עֲשִׂירִ֔י לֹא יָבֹ֥א לָ/הֶ֛ם בִּ/קְהַ֥ל יְהוָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/004.yaml
  text: No Ammonite or Moabite may enter the assembly of Yahweh[a]; even to the tenth generation[b], none of them may enter the assembly of Yahweh forever.
translation:
  language: sw
  text: Mwamoni wala Mmoabu asiingie katika kusanyiko la Yahwe[a]. Hata kufikia kizazi cha kumi[b], hakuna yeyote wa kwao atakayeingia katika kusanyiko la Yahwe milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkutano wa Yahwe.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema “kufikia kizazi cha kumi” na pia “milele”; tafsiri imehifadhi misemo yote miwili.
    reason: cultural_note
lexical_decisions:
- source_word: יָבֹא
  choice: asiingie / atakayeingia
  rationale: Katika sheria, לֹא pamoja na kitenzi hiki huonyesha katazo au kutokubalika kuingia. Miundo hii ya Kiswahili huwasilisha maana hiyo kwa kawaida.
- source_word: עַמּוֹנִי וּמוֹאָבִי
  choice: Mwamoni wala Mmoabu
  rationale: Haya ni majina ya kawaida ya Kiswahili kwa watu wa Amoni na Moabu; “wala” linafaa katika kauli hasi inayowahusu wote wawili.
- source_word: קְהַל יְהוָה
  choice: kusanyiko la Yahwe
  rationale: “Kusanyiko” linaonyesha jumuiya iliyokusanyika kwa maana rasmi bila kuingiza maana ya dhehebu la kisasa, na “Yahwe” linahifadhi jina la Mungu katika maandishi ya Kiebrania.
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: Hata kufikia kizazi cha kumi
  rationale: Tafsiri hii inahifadhi mkazo wa kirai cha Kiebrania na ni ya asili katika Kiswahili cha sasa.
- source_word: לָהֶם
  choice: yeyote wa kwao
  rationale: Kirai hiki kinarejelea mtu aliye wa watu hao. “Wa kwao” ni cha kawaida zaidi kuliko tafsiri sisisi isiyoeleweka ya kiwakilishi hicho.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Neno hili linaonyesha muda usio na mwisho na huhifadhi kauli ya mwisho ya Kiebrania bila kuifuta kwa sababu ya kutajwa kwa kizazi cha kumi.
theological_decisions:
- issue: Uhusiano kati ya “kizazi cha kumi” na “milele”
  choice: Misemo yote miwili imehifadhiwa katika matini kuu.
  alternative: Kuchukulia “kizazi cha kumi” kuwa nahau inayomaanisha “kamwe,” au kupunguza uzito wa “milele.”
  rationale: Maandishi ya Kiebrania yana misemo yote miwili. Tafsiri haipaswi kuondoa mvutano huo wala kuamua kimya kimya jinsi inavyopaswa kupatanishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa katazo ni wa moja kwa moja, na istilahi za kidhehebu zimeepukwa.
