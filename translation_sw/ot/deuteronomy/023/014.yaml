base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/014.yaml
  text: And you shall have a peg among your equipment[a], and when you sit down outside[c][b], you shall dig with it and turn back and cover your excrement.
translation:
  language: sw
  text: Nawe uwe na kigingi miongoni mwa vifaa vyako[a], na unapoketi nje[b], uchimbe kwa kigingi hicho, kisha ugeuke na kufunika kinyesi chako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kijiti”; wengine hulielewa kifaa hiki kulingana na kazi yake kuwa chombo cha kuchimbia au jembe dogo. Kiebrania kinasema kihalisi “juu ya sikio lako,” usemi ambao hapa huenda unarejelea vifaa vinavyobebwa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema “unapoketi nje,” usemi wa staha unaomaanisha kwenda nje kujisaidia.
    reason: cultural_note
lexical_decisions:
- source_word: יָתֵד
  choice: kijiti
  rationale: Kwa kawaida nomino hii humaanisha kigingi au kijiti kilichochongwa; hapa ni kifaa kinachobebwa na kutumiwa kuchimbia. “Kijiti” kinahifadhi taswira ya neno la Kiebrania bila kulifasiri moja kwa moja kuwa jembe dogo.
- source_word: עַל אֲזֵנֶךָ
  choice: miongoni mwa vifaa vyako
  rationale: Ingawa אֹזֶן kwa kawaida ni “sikio,” usemi huu katika muktadha wa kambi unaelekea kurejelea vifaa vinavyobebwa. Tafsiri hii inaleta maana ya kimuktadha kwa Kiswahili cha kawaida huku tanbihi ikihifadhi hali halisi ya usemi wa Kiebrania.
- source_word: בְּשִׁבְתְּךָ חוּץ
  choice: unapoketi nje
  rationale: Hii inahifadhi sitiari ya staha ya Kiebrania, ambayo katika muktadha humaanisha kwenda nje kujisaidia, bila kuifafanua kupita kiasi katika matini kuu.
- source_word: וְחָפַרְתָּה בָהּ
  choice: uchimbe kwa kijiti hicho
  rationale: Kiwakilishi cha kike kinarejelea יָתֵד. Kiebrania hakitaji wazi “shimo,” kwa hiyo hakijaongezwa.
- source_word: וְשַׁבְתָּ
  choice: kisha ugeuke
  rationale: Kitenzi kinaonyesha kugeuka au kurudi baada ya kuchimba ili kufunika kinyesi. “Ugeuke” ni cha asili katika mfuatano huu wa vitendo.
- source_word: צֵאָתֶךָ
  choice: kinyesi chako
  rationale: “Kinyesi” ni neno sahihi, la kawaida na lenye staha ya kutosha kwa sheria hii kuhusu usafi.
