  yaml_path: translation/ot/deuteronomy/023/010.yaml
  text: When you go out as an army against your enemies[a], then keep yourself from every evil thing.
translation:
  language: sw
  text: Jeshi lako linapotoka kwenda kupigana dhidi ya adui zako, jilinde na kila jambo ovu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila kitu najisi” au “jambo lolote lisilofaa.” Kirai cha Kiebrania kina maana pana na, katika muktadha huu, kinaweza kujumuisha unajisi wa kiibada bila kuwa na maana hiyo pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Unapo-
  rationale: Katika sheria hii, כִּי inaanzisha hali inayotarajiwa. Muundo wa Kiswahili ‘unapotoka’ ni wa kawaida na unaonyesha maana ya ‘wakati unapofanya hivyo’ bila kuifanya kuwa sharti lisilo na uhakika.
- source_word: תֵצֵא מַחֲנֶה
  choice: unapotoka kwenda vitani
  rationale: Kitenzi יצא humaanisha ‘kutoka,’ na מַחֲנֶה hapa inaelekeza kwenye jeshi au shughuli ya kijeshi. ‘Kutoka kwenda vitani’ ni Kiswahili cha kawaida kinachowasilisha muktadha wa kijeshi bila kulazimisha nomino ‘kambi’ katika sintaksia isiyo ya asili.
- source_word: עַל אֹיְבֶיךָ
  choice: dhidi ya adui zako
  rationale: Katika muktadha wa vita, עַל ina maana ya upinzani, nayo אֹיְבֶיךָ ni ‘adui zako.’
- source_word: וְנִשְׁמַרְתָּ
  choice: jilinde
  rationale: 'Nifali ya שׁמר hapa ina nguvu ya kujirejelea na ya kuamuru: mtu ajihadhari au ajilinde. ‘Jilinde’ ni fupi, ya moja kwa moja, na ya asili katika Kiswahili.'
- source_word: מִכֹּל דָּבָר רָע
  choice: na kila jambo ovu
  rationale: Baada ya ‘jilinde,’ מן huonyesha kile cha kujiepusha nacho. דָּבָר ni pana (‘jambo/kitu’), na רָע ni ‘ovu/baya.’ ‘Kila jambo ovu’ huhifadhi upana wa kirai kuliko kukifupisha kuwa uchafu wa kiibada pekee.
theological_decisions:
- issue: Upeo wa דָּבָר רָע katika sheria za utakatifu wa kambi
  choice: kila jambo ovu
  alternative: kila kitu najisi / jambo lolote lisilofaa
  rationale: Muktadha unaofuata unahusu pia unajisi wa kiibada, lakini kirai cha Kiebrania ni kipana zaidi. Tafsiri kuu haikifungi kwenye unajisi pekee; tanbihi inadumisha uwezekano huo wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Umoja wa nafsi ya pili umehifadhiwa kama katika Kiebrania. Alama ya tanbihi imewekwa baada ya kirai kinachofafanuliwa.
