  yaml_path: translation/ot/deuteronomy/023/023.yaml
  text: But if you refrain from making a vow[a], there will be no sin in you.
translation:
  language: sw
  text: Lakini ukijizuia kuweka nadhiri, hutakuwa na dhambi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hutakuwa na hatia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: Lakini uki-
  rationale: Muunganiko huu unaanzisha sharti linalotofautiana na wajibu wa kutimiza nadhiri katika mstari uliotangulia; “lakini uki-” unaonyesha utofauti na sharti kwa Kiswahili cha kawaida.
- source_word: תֶחְדַּל
  choice: ukijizuia
  rationale: Kitenzi חדל hapa humaanisha kuacha au kujiepusha na tendo; pamoja na kitenzi-jina kinachofuata, “kujizuia” huonyesha kwa kawaida uamuzi wa kutoweka nadhiri.
- source_word: לִ/נְדֹּר
  choice: kuweka nadhiri
  rationale: נדר humaanisha kuapa au kuweka nadhiri. “Kuweka nadhiri” ni usemi wa kawaida na wenye hadhi unaotaja tendo lenyewe bila kulifanya kuwa la dhehebu fulani.
- source_word: לֹא יִהְיֶה
  choice: hutakuwa na
  rationale: 'Muundo hasi wa היה unaeleza matokeo: hali ya dhambi au hatia haitakuwapo kwa mtu huyo. Kiswahili “hutakuwa na” ni cha asili na huhifadhi maana hiyo.'
- source_word: בְ/ךָ
  choice: utakuwa na
  rationale: Ingawa kihalisi ni “ndani yako,” katika usemi huu wa kisheria na kimaadili Kiswahili cha asili husema mtu “ana dhambi” au “ana hatia”; hivyo maana ya uhusiano wa בְּךָ imejumuishwa katika “utakuwa na.”
- source_word: חֵטְא
  choice: dhambi
  rationale: חֵטְא inaweza kumaanisha dhambi au hatia. “Dhambi” linaweka wazi jambo la kimaadili katika muktadha, huku maana mbadala ya hatia ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Hali ya kimaadili ya kutoweka nadhiri
  choice: Kujizuia kuweka nadhiri si dhambi.
  alternative: Mtu anayejizuia kuweka nadhiri hana hatia au deni la kisheria.
  rationale: Muktadha unatofautisha kutoweka nadhiri na kutotimiza nadhiri iliyokwisha kuwekwa. Neno חֵטְא linaweza kueleza dhambi au hatia, kwa hiyo matini kuu inatumia “dhambi” na tanbihi inalinda maana ya hatia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, ya sasa, yenye hadhi, na inayoeleweka kwa wasomaji wa kawaida. Muundo umechaguliwa kwa ulinganifu bora, huku utata halisi kati ya “dhambi” na “hatia” ukihifadhiwa katika tanbihi.
