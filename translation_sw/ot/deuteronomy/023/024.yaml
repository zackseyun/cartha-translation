base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/024.yaml
  text: You shall keep what has gone out from your lips and do it[a], according to what you vowed to Yahweh your God as a freewill offering[b], which you spoke with your mouth.
translation:
  language: sw
  text: Utakilinda na kukitimiza kile kilichotoka midomoni mwako,[a] sawasawa na ulivyoahidi kumtolea Yahweh Mungu wako sadaka ya hiari,[b] ambayo uliitamka kwa kinywa chako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maneno yaliyotoka midomoni mwako,” au “tamko la midomo yako.”
    reason: lexical_alternative
  - marker: b
    text: Au, “toleo la hiari.” Neno la Kiebrania hurejelea sadaka au toleo linalotolewa kwa hiari, si kwa kulazimishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא שְׂפָתֶיךָ
  choice: kile kilichotoka midomoni mwako
  rationale: Huhifadhi taswira halisi ya Kiebrania ya jambo linalotoka midomoni, huku ikieleweka kwa kawaida kuwa ni maneno yaliyotamkwa, hasa nadhiri.
- source_word: תִּשְׁמֹר וְעָשִׂיתָ
  choice: utakishika na kukitimiza
  rationale: ‘Kushika’ huonyesha uaminifu kwa ahadi, na ‘kutimiza’ huweka wazi kwamba nadhiri lazima itekelezwe; jozi hii ni ya asili katika Kiswahili na huhifadhi vitendo viwili vya Kiebrania.
- source_word: כַּאֲשֶׁר נָדַרְתָּ
  choice: sawasawa na ulivyomwekea ... nadhiri
  rationale: Hueleza kwamba utekelezaji unapaswa kulingana kabisa na nadhiri iliyowekwa.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: Yahweh Mungu wako
  rationale: Jina la agano יהוה limetafsiriwa moja kwa moja kuwa ‘Yahweh,’ na muundo wa uhusiano ‘Mungu wako’ umehifadhiwa.
- source_word: נְדָבָה
  choice: nadhiri ya hiari
  rationale: Katika muundo wa sentensi hii, neno hilo linafafanua nadhiri kama iliyotolewa kwa hiari. Tafsiri hii ni ya kawaida na huepuka kuingiza kwa lazima aina maalumu ya sadaka ambayo muktadha huu mfupi hauibainishi kikamilifu.
- source_word: אֲשֶׁר דִּבַּרְתָּ בְּפִיךָ
  choice: ambayo uliitamka kwa kinywa chako
  rationale: Huhifadhi msisitizo wa Kiebrania kuhusu kutamkwa kwa mdomo badala ya kuufupisha kuwa ahadi ya jumla.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania hutumia jina la agano יהוה. ‘Yahweh’ hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Uhusiano wa נְדָבָה na nadhiri
  choice: nadhiri ya hiari
  alternative: sadaka ya hiari
  rationale: Kisarufi, נְדָבָה inaweza kueleweka kama neno linaloeleza hiari ya nadhiri au kama sadaka ya hiari. Matini kuu imechagua Kiswahili kinachounganisha neno hilo na nadhiri, huku tanbihi ikihifadhi uwezekano wa maana ya kisadaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya ‘kutoka midomoni’ na msisitizo wa ‘kwa kinywa chako’ zimehifadhiwa kwa sababu ni za makusudi katika Kiebrania.
