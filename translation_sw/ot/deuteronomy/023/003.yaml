  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לֹא יָבֹ֥א מַמְזֵ֖ר בִּ/קְהַ֣ל יְהוָ֑ה גַּ֚ם דּ֣וֹר עֲשִׂירִ֔י לֹא יָ֥בֹא ל֖/וֹ בִּ/קְהַ֥ל יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/003.yaml
  text: No one of illegitimate birth may enter the assembly of Yahweh; even to the tenth generation[a], none of his descendants may enter the assembly of Yahweh.
translation:
  language: sw
  text: Mtu aliyezaliwa katika hali isiyokubalika[a] asiingie katika kusanyiko la Yahwe; hata kufikia kizazi cha kumi, hakuna yeyote wa uzao wake atakayeingia katika kusanyiko la Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa kawaida neno la Kiebrania מַמְזֵר (mamzer) limeeleweka kuwa mtu aliyezaliwa katika muungano usioruhusiwa. Maana yake mahsusi haijulikani kwa uhakika, na huenda linahusu hali nyingine ya kuzaliwa iliyomweka mtu nje ya jamii.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַמְזֵר
  choice: mtu mwenye hali ya kuzaliwa isiyokubalika
  rationale: Neno hili la Kiebrania linaonyesha hadhi ya kuzaliwa iliyomzuia mtu kukubaliwa katika kusanyiko, lakini maana yake mahsusi inabishaniwa. Tafsiri hii inaepuka neno la kudhalilisha na pia haifungi maana kwenye kuzaliwa nje ya ndoa pekee.
- source_word: יָבֹא
  choice: asiingie / atakayeingia
  rationale: Kitenzi maana yake ni ‘kuja’ au ‘kuingia’; katika sheria hii, muundo hasi unaonyesha marufuku ya kuingia au kushiriki.
- source_word: קְהַל יְהוָה
  choice: kusanyiko la Yahwe
  rationale: קהל ni jamii iliyokusanyika, hasa jamii ya agano; ‘kusanyiko’ ni neno la Kiswahili la sasa na linaloeleweka vizuri.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetafsiriwa kwa umbo la kawaida la Kiswahili ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: hata kufikia kizazi cha kumi
  rationale: Huhifadhi kiwango cha muda au vizazi kinachotajwa na fomula ya sheria ya Kiebrania.
- source_word: לֹא יָבֹא לוֹ
  choice: hakuna yeyote wa uzao wake atakayeingia
  rationale: Katika muktadha unaotaja kizazi cha kumi, kiwakilishi לוֹ kinaeleweka kuwa kinahusu wale walio katika ukoo wake; Kiswahili kinahitaji uhusiano huo kusemwa wazi ili sentensi iwe ya kawaida.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia moja kwa moja jina la agano la Mungu; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kuingia katika קְהַל יְהוָה
  choice: kuingia katika kusanyiko la Yahwe
  alternative: kuwa sehemu ya ibada ya Yahwe
  rationale: Maandishi hayasemi wazi kama kuingia huku kunahusu ibada, uraia kamili wa jamii, au hadhi nyingine maalumu. Tafsiri huhifadhi upana huo badala ya kuamua maana moja ya kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘hali ya kuzaliwa isiyokubalika’ umetumiwa kwa tahadhari ili kuepuka lugha ya matusi au ya unyanyapaa, huku tanbihi ikihifadhi kutokuwa na uhakika kwa neno la Kiebrania.
