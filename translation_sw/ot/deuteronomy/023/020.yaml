    rationale: Tafsiri “fedha” inaeleweka katika muktadha wa kiuchumi. Ikiwa tanbihi ingetolewa, ingepaswa kutaja maana ya msingi “silver,” si kusema tu “fedha” ni maana ya moja kwa moja.
