  text: You shall not charge your brother interest on money[a], interest on food[c][b], or interest on anything that is lent at interest.
translation:
  language: sw
  text: 'Usimtoze ndugu yako riba: riba ya fedha, riba ya chakula, wala riba ya kitu chochote kinachokopeshwa kwa riba.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַשִּׁיךְ
  choice: usimtoze ... riba
  rationale: Hifili ya נשׁך hapa ina maana ya kumwekea au kumdai mkopaji riba. Kauli hii ni ya kawaida katika Kiswahili cha sasa na inaweka wazi kuwa katazo linamwelekea mkopeshaji.
- source_word: לְאָחִיךָ
  choice: ndugu yako
  rationale: Hii ndiyo maana ya moja kwa moja ya Kiebrania, nayo huhifadhi taswira ya uhusiano wa kifamilia ndani ya jumuiya ya agano bila kuibadili kimya kimya kuwa ‘Mwisraeli mwenzako.’
- source_word: נֶשֶׁךְ
  choice: riba
  rationale: Neno hili linamaanisha malipo yanayodaiwa juu ya mkopo kwa ujumla, si lazima riba ya kupindukia pekee. ‘Riba’ ndilo neno la kawaida na pana katika Kiswahili.
- source_word: כֶּסֶף
  choice: fedha
  rationale: Ingawa כֶּסֶף inaweza kumaanisha metali ya fedha, katika muktadha huu wa kiuchumi ina maana ya pesa; ‘fedha’ huhifadhi maana hiyo kwa lugha ya kawaida na yenye hadhi.
- source_word: אֹכֶל
  choice: chakula
  rationale: Neno hili humaanisha kwa upana kitu cha kuliwa au chakula, na ‘chakula’ ni tafsiri wazi na ya kawaida katika orodha hii ya vitu vinavyoweza kukopeshwa.
- source_word: כָּל דָּבָר
  choice: kitu chochote
  rationale: Kirai hiki kinapanua katazo zaidi ya fedha na chakula; ‘kitu chochote’ huonyesha upeo wake kwa Kiswahili cha asili.
- source_word: אֲשֶׁר יִשָּׁךְ
  choice: kinachoweza kutozwa riba
  rationale: Kishazi hiki kinafafanua kitu chochote ambacho katika shughuli ya kukopesha kinaweza kutozwa riba. Muundo huu huhifadhi upana na ukaribu wa kimzizi na kitenzi cha mwanzo bila kulazimisha maana ya kitu ambacho tayari kimekopeshwa.
