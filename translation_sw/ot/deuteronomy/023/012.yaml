  text: And toward evening he shall wash himself with water[b][a], and when the sun sets he may come into the midst of the camp.
translation:
  language: sw
  text: Kuelekea jioni, atajiosha kwa maji, na jua linapotua[a], anaweza kuingia ndani ya kambi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa halisi, “jua linapoingia”; hii ni nahau ya Kiebrania inayomaanisha kutua kwa jua.
    reason: lexical_alternative
  - marker: b
    text: Au, “katikati ya kambi”; Kiebrania husema kwa mahususi sehemu ya ndani ya kambi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Ikielekea
  rationale: Muundo wa וְהָיָה unaendeleza agizo la kisheria; katika Kiswahili sentensi ya wakati ‘Ikielekea jioni’ huwasilisha mfuatano huo kwa kawaida bila tafsiri ngumu ya neno kwa neno.
- source_word: לִפְנוֹת עֶרֶב
  choice: Ikielekea jioni
  rationale: Kitenzi פנה pamoja na עֶרֶב kinaonyesha wakati siku inapogeukia jioni. Kauli hii ni ya kawaida na wazi katika Kiswahili cha Afrika Mashariki.
- source_word: יִרְחַץ בַּמָּיִם
  choice: ataoga kwa maji
  rationale: Katika muktadha huu wa utakaso, רחץ inahusu kuosha mwili. ‘Ataoga kwa maji’ ni ya asili zaidi katika Kiswahili kuliko ‘atajiosha kwa maji’ na inadumisha maana ya tendo linalomhusu mtu mwenyewe.
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: jua linapotua
  rationale: Maneno ya Kiebrania kwa halisi husema jua ‘linapoingia,’ lakini ni nahau inayomaanisha kutua kwa jua. Tafsiri hii inatoa maana ya nahau kwa uwazi.
- source_word: יָבֹא
  choice: anaweza kuingia
  rationale: Katika sheria hii, kuingia kunaruhusiwa baada ya kuoga na kutua kwa jua. ‘Anaweza kuingia’ huonyesha ruhusa hiyo, huku ikiepuka lugha nzito.
- source_word: אֶל תּוֹךְ הַמַּחֲנֶה
  choice: ndani ya kambi
  rationale: תּוֹךְ huonyesha kuingia katika sehemu ya ndani. ‘Ndani ya kambi’ ni Kiswahili cha kawaida na sahihi zaidi kuliko ‘katikati ya kambi,’ ambayo inaweza kudokeza kitovu halisi cha kambi.
