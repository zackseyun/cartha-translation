  yaml_path: translation/ot/deuteronomy/023/013.yaml
  text: And you shall have a place outside the camp[a], and you shall go out there, outside.
translation:
  language: sw
  text: Utakuwa na mahali nje ya kambi[a], nawe utatoka kwenda huko nje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “mkono” (yad); hapa yaelekea ni msemo unaomaanisha mahali palipotengwa. Baadhi ya tafsiri husema “chombo” au “kigingi,” kwa kuzingatia mstari unaofuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָד
  choice: mahali
  rationale: Ingawa maana yake ya kawaida ni ‘mkono,’ hapa neno hilo linaeleweka kimuktadha kama mahali palipotengwa nje ya kambi. Tafsiri ‘mahali’ inaendana na kielezi שָׁמָּה (‘huko’) na agizo la kwenda nje.
- source_word: תִּהְיֶה לְךָ
  choice: utakuwa na
  rationale: Muundo wa Kiebrania היה pamoja na לְ unaonyesha kuwa kitu kimewekwa au kimetolewa kwa ajili ya mtu; ‘utakuwa na’ ni Kiswahili cha kawaida chenye nguvu ya agizo.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: nje ya kambi
  rationale: Maneno haya yanaonyesha wazi eneo lililo nje ya mipaka ya kambi.
- source_word: וְיָצָאתָ
  choice: nawe utatoka kwenda
  rationale: Kitenzi יצא humaanisha ‘kutoka.’ Kuongeza ‘kwenda’ kunafanya uhusiano na שָׁמָּה (‘huko’) uwe wa kawaida katika Kiswahili bila kubadili maana.
- source_word: שָׁמָּה
  choice: huko
  rationale: Kielezi hiki chenye mwelekeo kinarejelea mahali palipotajwa na pia huonyesha mwendo wa kuelekea mahali hapo.
- source_word: חוּץ
  choice: nje
  rationale: Neno la mwisho linarudia na kusisitiza kuwa tendo hilo lifanyike nje; marudio hayo yamehifadhiwa.
