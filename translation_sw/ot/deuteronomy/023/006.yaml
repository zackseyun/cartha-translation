base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/006.yaml
  text: But Yahweh your God was not willing to listen to Balaam, and Yahweh your God turned the curse into a blessing for you, because Yahweh your God loved you.
translation:
  language: sw
  text: Lakini Yahwe Mungu wako hakutaka kumsikiliza Balaamu, na Yahwe Mungu wako aliigeuza laana hiyo kuwa baraka kwako, kwa sababu Yahwe Mungu wako alikupenda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָבָה
  choice: hakutaka
  rationale: Kitenzi hiki huonyesha kutaka au kukubali kwa hiari. “Hakutaka” huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa uhawilishaji wa kawaida wa Kiswahili “Yahwe,” badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Ni umbo lenye kiambishi cha nafsi ya pili umoja; “Mungu wako” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: לִשְׁמֹעַ אֶל
  choice: kumsikiliza
  rationale: Muundo huu unaweza kumaanisha kumsikiliza au kumtii mtu. “Kumsikiliza” huhifadhi upana wa usemi bila kuongeza ufafanuzi usio wazi katika chanzo.
- source_word: בִּלְעָם
  choice: Balaamu
  rationale: Hili ndilo umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: וַיַּהֲפֹךְ
  choice: aligeuza
  rationale: Kitenzi הפך huonyesha kugeuza au kubadilisha hali; “aligeuza” ni cha asili katika usemi “aligeuza laana ... kuwa baraka.”
- source_word: הַקְּלָלָה
  choice: laana hiyo
  rationale: Nomino yenye kibainishi hurejelea laana iliyokusudiwa dhidi ya Israeli. “Hiyo” huwasilisha urejeleaji huo kwa Kiswahili cha kawaida.
- source_word: לִבְרָכָה
  choice: kuwa baraka
  rationale: Herufi ל hapa huonyesha matokeo ya mabadiliko; “kuwa baraka” ni muundo wa kawaida baada ya “aligeuza.”
- source_word: כִּי
  choice: kwa sababu
  rationale: Huanzisha sababu ya tendo la Yahwe; “kwa sababu” huonyesha wazi uhusiano huo wa kisababishi.
- source_word: אֲהֵבְךָ
  choice: alikupenda
  rationale: Kitenzi אָהֵב kina maana ya kupenda. “Alikupenda” huhifadhi urahisi na uzito wa upendo unaotajwa.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya לִשְׁמֹעַ אֶל kuhusu Balaamu
  choice: kumsikiliza Balaamu
  alternative: kumtii Balaamu
  rationale: “Kumsikiliza” huhifadhi uwezekano wa maana ya kusikia kwa kukubali au kuitikia bila kufafanua zaidi ya maandishi kwamba Mungu angekuwa anamtii Balaamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. “Lakini” huhifadhi utofautishaji wa mwanzo, na “badala yake” huonyesha kwa njia ya asili kwamba Yahwe alitenda kinyume cha kusudi la Balaamu bila kubadili hoja ya kifungu.
