    issue: “badala yake” is interpretive expansion
    rationale: The Hebrew has a coordinating waw (‘and’) before ‘Yahweh your God turned’; although contrast is contextually evident, ‘badala yake’ makes that relationship more explicit than the source does.
  revised_text: Lakini Yahwe Mungu wako hakutaka kumsikiliza Balaamu, na Yahwe Mungu wako aliigeuza laana hiyo kuwa baraka kwako, kwa sababu Yahwe Mungu wako alikupenda.
