  to: Lakini Yahwe Mungu wako hakutaka kumsikiliza Balaamu, na Yahwe Mungu wako aliigeuza laana hiyo kuwa baraka kwako, kwa sababu Yahwe Mungu wako alikupenda.
  rationale: Removed the interpretive phrase “badala yake” and retained a direct conjunction corresponding to the Hebrew. Added the object marker in “aliigeuza” for fully natural Swahili reference to “laana hiyo,” without altering meaning.
