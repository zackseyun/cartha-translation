translation:
  language: sw
  text: Mwanamume ambaye korodani zake zimepondwa, au ambaye uume wake umekatwa, asiingie katika kusanyiko la Yahweh.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri ya karibu zaidi: “Mtu ambaye korodani zake zimepondwa, au ambaye uume wake umekatwa, asiingie katika kusanyiko la Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: “Kusanyiko la Yahweh” huenda likamaanisha ushiriki rasmi katika jumuiya ya agano ya Israeli; upeo hasa wa katazo hili unabishaniwa.
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֹא
  choice: asiingie
  rationale: Kitenzi בוא humaanisha kuja au kuingia; pamoja na לֹא katika sheria hii, “asiingie” huwasilisha katazo kwa Kiswahili cha kawaida bila kuongeza maana ya adhabu au wokovu.
- source_word: פְצוּעַ דַּכָּא
  choice: aliyepondwa korodani
  rationale: Kirai hiki kinaelekeza kwenye jeraha la kupondwa kwa viungo vya uzazi vya mwanamume, hasa korodani. Tafsiri hii ni wazi na mahususi kuliko kusema kwa ujumla “aliyejeruhiwa sehemu za siri.”
- source_word: וּכְרוּת שָׁפְכָה
  choice: au aliyekatwa uume
  rationale: Kirai kinaashiria kiungo cha kiume kilichokatwa. “Aliyekatwa uume” ni lugha ya moja kwa moja na ya sasa; “au” inadumisha tofauti kati ya hali hizi mbili.
- source_word: בִּקְהַל
  choice: katika kusanyiko
  rationale: קהל ni jumuiya iliyokusanyika. “Kusanyiko” linafaa katika muktadha wa kisheria na wa agano bila kulifanya moja kwa moja kuwa kanisa au ibada pekee.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahweh” badala ya kubadilishwa na cheo kama “BWANA,” hivyo kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: לֹא
  choice: asiingie
  rationale: Kikanushi לֹא kimeunganishwa na kitenzi katika muundo wa Kiswahili wa katazo la nafsi ya tatu, unaosikika wa kawaida na kuhifadhi nguvu ya sheria.
- source_word: implicit male referent of the participial phrases
  choice: Mwanamume
  rationale: Majeraha yanayotajwa yanahusu viungo vya uzazi vya kiume, kwa hiyo “mwanamume” huweka wazi mrejelewa bila kutumia neno lisilo na jinsia.
theological_decisions:
- issue: Maana na upeo wa kutengwa na “kusanyiko la Yahweh”
  choice: Kirai kimetafsiriwa moja kwa moja bila kufafanua kutengwa huko kuwa kupoteza wokovu, kutoshiriki ibada, kutokuwa raia, au kutoweza kuoa ndani ya Israeli.
  alternative: Kukifafanua kama marufuku ya kushiriki rasmi katika ibada ya Israeli, uanachama wa kiraia au wa agano, au ndoa ndani ya Israeli.
  rationale: Mstari wenyewe unakataza kuingia katika קהל יהוה lakini hauelezi hapa upeo wote wa kisheria au wa kiteolojia. Tafsiri inadumisha utata huo badala ya kuamua mjadala ndani ya matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Lugha ya anatomia imewekwa wazi bila kutumia mafumbo yasiyoeleweka. Muundo wa katazo ni mfupi na wa kisheria; alama zote za tanbihi [a] na [b] zimo katika matini kuu.
