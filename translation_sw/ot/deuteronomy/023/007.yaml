  text: You shall not seek their peace or their prosperity all your days forever[a].
translation:
  language: sw
  text: Usitafute amani yao wala ustawi wao siku zako zote milele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hali yao njema wala mema yao.” Maneno ya Kiebrania yana maana pana kuliko amani ya kisiasa au ustawi wa kiuchumi pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִדְרֹשׁ
  choice: usitafute
  rationale: Kitenzi דרש humaanisha ‘kutafuta’ au ‘kuulizia.’ Katika katazo hili lenye vitu dhahania, ‘usitafute’ ni Kiswahili cha kawaida kinachodumisha maana pana bila kuongeza wazo lisilo wazi la kuwasaidia au kuendeleza.
- source_word: שְׁלֹמָם
  choice: amani yao
  rationale: שָׁלוֹם inaweza kumaanisha amani, hali njema, au ustawi. ‘Amani yao’ inadumisha maana yake kuu na kuitofautisha na nomino inayofuata; tanbihi inaonyesha upana wake.
- source_word: טֹבָתָם
  choice: ustawi wao
  rationale: טוֹבָה hapa huelekea kumaanisha mema, manufaa, au hali ya kufanikiwa. ‘Ustawi wao’ ni ya asili na iliyo wazi katika Kiswahili, huku ikibaki tofauti na ‘amani yao.’
- source_word: כָּל יָמֶיךָ
  choice: siku zako zote
  rationale: Hili ni tafsiri ya karibu na ya kawaida inayodumisha taswira ya Kiebrania na usemi wa nafsi ya pili umoja.
- source_word: לְעוֹלָם
  choice: milele
  rationale: ‘Milele’ inadumisha msisitizo wa muda usio na kikomo unaoongezwa baada ya ‘siku zako zote.’
theological_decisions:
- issue: Kurudiwa kwa maana au mvutano kati ya ‘siku zako zote’ na ‘milele’
  choice: 'Maneno yote mawili yamedumishwa: ‘siku zako zote, milele’'
  alternative: Kuyafupisha kuwa ‘maisha yako yote’ au kuacha tafsiri tofauti ya לְעוֹלָם
  rationale: Kiebrania kinaweka כָּל יָמֶיךָ pamoja na לְעוֹלָם kwa kusisitiza muda wa katazo. Kuyadumisha yote kunaakisi nguvu ya matini badala ya kuisawazisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Usitafute’ inaonyesha katazo kwa mtu mmoja; ‘wao/yao’ inarejelea kundi la watu. Koma kabla ya ‘milele’ husaidia kuonyesha mkusanyiko wa virai viwili vya muda bila kuvifupisha.
