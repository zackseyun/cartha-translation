base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/017.yaml
  text: He shall live with you[a], in your midst, in the place that he chooses within one of your gates, wherever it is good for him[b]; you shall not oppress him.
translation:
  language: sw
  text: Ataishi pamoja nawe[a], katikati yako, katika mojawapo ya miji yako[b] atakayochagua, mahali panapomfaa; usimwonee.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Atakaa pamoja nawe.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “katika mojawapo ya malango yako.” Hii ni nahau inayorejelea mojawapo ya miji au jamii za makazi.
    reason: cultural_note
lexical_decisions:
- source_word: יֵשֵׁב
  choice: Ataishi
  rationale: Kitenzi ישב kinaweza kumaanisha kukaa, kubaki, au kuishi. Katika sheria hii kuhusu makazi ya kudumu, “ataishi” ni Kiswahili cha kawaida kinachoonyesha kupewa ruhusa ya kuendelea kuishi hapo.
- source_word: עִמְּךָ
  choice: pamoja nawe
  rationale: Hili ndilo maana ya moja kwa moja ya עם pamoja na kiambishi cha nafsi ya pili; maneno yanayofuata, “katikati yako,” yanaonyesha pia kuwa anakubaliwa ndani ya jamii.
- source_word: בְּקִרְבְּךָ
  choice: katikati yako
  rationale: Kirai hiki humweka mtu ndani ya jamii yenyewe. Tafsiri inahifadhi taswira ya Kiebrania bila kuwa ngumu katika Kiswahili.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: mahali atakapochagua
  rationale: Mhusika wa kitenzi “atachagua” ni mtumwa aliyekimbia anayetajwa katika mstari uliotangulia. Tafsiri inadumisha haki yake ya kuchagua mahali pa kuishi.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: katika mojawapo ya miji yako
  rationale: Neno שערים ni “malango” kwa maana halisi, lakini hapa ni nahau inayorejelea miji au maeneo ya makazi. “Miji yako” huwasilisha maana hiyo wazi katika Kiswahili cha sasa; maana halisi imeelezwa katika tanbihi.
- source_word: בַּטּוֹב לוֹ
  choice: mahali ambapo ni pazuri kwake
  rationale: Kirai hicho ni, kwa karibu, “katika lililo jema kwake,” na kinaonyesha mahali panapofaa au kuwa bora kwa mtazamo wake. Tafsiri inaacha wazi ikiwa wazo kuu ni mapendezi yake au ustawi wake.
- source_word: לֹא תּוֹנֶנּוּ
  choice: usimwonee
  rationale: Katika muktadha wa sheria, ינה katika kausativi hukataza kumkandamiza, kumdhulumu, au kumtendea vibaya mtu aliye hatarini. “Usimwonee” ni agizo la asili na lenye nguvu katika Kiswahili.
theological_decisions:
- issue: Mhusika anayerejelewa na maumbo ya umoja katika mstari
  choice: Mstari unamrejelea mtumwa aliyekimbia wa mstari uliotangulia kama mtu mmoja; maumbo ya umoja yamedumishwa.
  alternative: Kutumia maumbo yanayorejelea watu kwa ujumla au kugeuza sentensi iwe ya wingi.
  rationale: Kiebrania hutumia maumbo ya umoja wa kiume katika mstari wote. Kiswahili hakitofautishi jinsia katika kiwakilishi hiki, lakini “a-” na “-mw-” yanadumisha wazi umoja bila kuongeza dai kuhusu jinsia lisiloweza kuonyeshwa kimaumbile katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inafuata kwa karibu mpangilio wa Kiebrania lakini inatumia “miji” badala ya “malango” katika maandishi makuu ili maana ya nahau ieleweke mara moja. Agizo “usimwonee” linamhutubia Israeli kwa umoja wa kijumuiya, kama ilivyo katika Kiebrania.
