  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְכַל
  choice: alipomaliza
  rationale: Kitenzi kutoka כלה kinaonyesha kukamilika kwa tendo. Muundo wa Kiswahili “alipomaliza” ni wa kawaida na pia unaunganisha mstari huu na sentensi inayoendelea katika mstari unaofuata.
- source_word: לְדַבֵּר
  choice: kusema
  rationale: Pamoja na כלה, kitenzi hiki kinaunda maana ya “kumaliza kusema.” “Kusema” ni ya asili katika Kiswahili kwa hotuba iliyotangulia.
- source_word: אֶת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: maneno haya yote
  rationale: דברים hapa inarejelea maneno yaliyotamkwa katika hotuba au wimbo uliotangulia. “Maneno” huhifadhi taswira ya matini ya Kiebrania bila kuipanua kuwa “mambo.”
- source_word: אֶל כָּל יִשְׂרָאֵל
  choice: kwa Israeli yote
  rationale: “Israeli yote” huhifadhi jina la pamoja la agano badala ya kulifafanua kuwa “Waisraeli wote.” Kihusishi “kwa” kinaeleza walengwa wa maneno kwa Kiswahili cha kawaida.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” ndiyo namna sanifu ya jina hili katika Kiswahili.
