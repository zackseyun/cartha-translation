base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/001.yaml
  text: Give ear[a], O heavens, and I will speak; and let the earth hear the words of my mouth.
translation:
  language: sw
  text: 'Sikilizeni[a], enyi mbingu, nami nitasema;

    na dunia isikie maneno ya kinywa changu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tegeni masikio, enyi mbingu … na dunia isikie.” Kiebrania kinatumia maumbo ya kishairi yenye uzito wa agizo na ombi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינוּ
  choice: Sikilizeni kwa makini
  rationale: Kitenzi cha Kiebrania ni agizo la kusikiliza kwa uangalifu, si kusikia tu. Kauli hii ni ya kawaida katika Kiswahili cha sasa huku ikihifadhi uzito wa mwito wa kishairi.
- source_word: הַשָּׁמַיִם
  choice: enyi mbingu
  rationale: Wingi “mbingu” unahifadhi umbo la Kiebrania, na “enyi” inaonyesha wazi kuwa mbingu zinaambiwa moja kwa moja katika lugha ya kishairi.
- source_word: וַאֲדַבֵּרָה
  choice: nami nitasema
  rationale: Umbo la cohortative linaonyesha azimio au kusudi la msemaji. “Nami nitasema” ni la asili na linadumisha mwendo wa ushairi.
- source_word: וְתִשְׁמַע
  choice: nayo dunia isikie
  rationale: Ingawa umbo hili linaweza kueleweka kama jussive au imperfect, hapa ni ombi lenye nguvu ya kutaka jambo litendeke, sambamba na agizo kwa mbingu. Kiambishi “-sikie” kinahifadhi maana hiyo bila kuifanya kuwa taarifa ya wakati ujao.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: Katika jozi ya ulimwengu mzima ya “mbingu na dunia,” “dunia” inafaa kuliko “nchi” na inaepusha kuifanya kauli ihusu eneo fulani tu.
- source_word: אִמְרֵי
  choice: maneno
  rationale: “Maneno” ni tafsiri ya kawaida, wazi, na yenye uzito wa kutosha kwa matamshi ya msemaji.
- source_word: פִי
  choice: ya kinywa changu
  rationale: Taswira halisi ya Kiebrania imehifadhiwa badala ya kufupishwa kuwa “ninayosema,” hivyo kudumisha uhalisi na mpigo wa kishairi.
theological_decisions:
- issue: Upeo wa mwito kwa mbingu na dunia
  choice: Mwito wa kishairi kwa ulimwengu mzima kama shahidi
  alternative: Mwito wa balagha tu kwa wasikilizaji wote
  rationale: Jozi ya “mbingu” na “dunia” ina uzito rasmi unaopatikana katika mazingira ya agano na unabii. Tafsiri inahifadhi uzito huo bila kuongeza neno “mashahidi,” ambalo halipo wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Sikilizeni kwa makini” ni wazi kwa msomaji wa kawaida; “enyi,” mpangilio sambamba wa vipashio, na “maneno ya kinywa changu” vinahifadhi uzito na taswira ya ushairi wa Kiebrania.
