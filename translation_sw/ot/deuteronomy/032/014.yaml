source:
  edition: WLC
  text: חֶמְאַ֨ת בָּקָ֜ר וַ/חֲלֵ֣ב צֹ֗אן עִם חֵ֨לֶב כָּרִ֜ים וְ/אֵילִ֤ים בְּנֵֽי בָשָׁן֙ וְ/עַתּוּדִ֔ים עִם חֵ֖לֶב כִּלְי֣וֹת חִטָּ֑ה וְ/דַם עֵנָ֖ב תִּשְׁתֶּה חָֽמֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/014.yaml
  text: curds from the herd[a], and milk from the flock, with the fat of lambs, and rams, the offspring of Bashan, and goats, with the choicest wheat; and you drank foaming wine[b], the blood of grapes.
translation:
  language: sw
  text: maziwa mgando kutoka kwa ng’ombe, na maziwa kutoka katika mifugo wadogo, pamoja na mafuta ya wana-kondoo, ya kondoo dume wa Bashani, na ya mbuzi dume, pamoja na ngano bora kabisa[a]; ukanywa divai yenye povu[b], damu ya zabibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “mafuta ya figo za ngano,” nahau inayomaanisha ngano bora au yenye punje tajiri zaidi.
    reason: lexical_alternative
  - marker: b
    text: Au “divai nyekundu”; neno la Kiebrania linaweza kudokeza divai iliyochacha sana au yenye povu.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאַת בָּקָר
  choice: maziwa mgando ya ng’ombe
  rationale: חֶמְאָה hapa ni bidhaa nzito ya maziwa, huenda maziwa yaliyoganda au yaliyochachuka, si lazima siagi ya kisasa. ‘Maziwa mgando’ ni usemi wa kawaida na unaoeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: חֲלֵב צֹאן
  choice: maziwa ya kondoo na mbuzi
  rationale: צֹאן ni jina la jumla kwa mifugo midogo, hasa kondoo na mbuzi. Kutaja wote wawili kunatoa maana hiyo wazi kwa msomaji wa Kiswahili.
- source_word: חֵלֶב כָּרִים וְאֵילִים ... וְעַתּוּדִים
  choice: mafuta ya wana-kondoo, ya kondoo dume ... na ya mbuzi dume
  rationale: חֵלֶב imedumishwa kwa maana halisi ya ‘mafuta’; marudio ya ‘ya’ yanaonyesha wazi kwamba mafuta yanahusishwa na wanyama wote katika orodha. עַתּוּדִים limetafsiriwa ‘mbuzi dume’ ili kuhifadhi ubainifu wa Kiebrania.
- source_word: אֵילִים בְּנֵי בָשָׁן
  choice: kondoo dume wazao wa Bashani
  rationale: בְּנֵי בָשָׁן ni kihalisi ‘wana/wazao wa Bashani,’ yaani wanyama waliozalishwa katika eneo hilo lenye rutuba. ‘Wazao wa Bashani’ huhifadhi ladha ya kishairi bila kuwa nzito.
- source_word: חֵלֶב כִּלְיֹות חִטָּה
  choice: ngano bora kabisa
  rationale: Usemi huo ni taswira ya Kiebrania, kihalisi ‘mafuta ya figo za ngano,’ unaomaanisha punje nzuri na tajiri zaidi. Tafsiri ya kiidioma huepuka ukungu huku tanbihi ikihifadhi taswira ya asili.
- source_word: דַם עֵנָב
  choice: damu ya zabibu
  rationale: Taswira hii ya kishairi ya kinywaji cha zabibu imehifadhiwa moja kwa moja.
- source_word: תִּשְׁתֶּה
  choice: ukanywa
  rationale: Ingawa umbo ni la wakati usiotimilika, katika wimbo huu linaendeleza simulizi la baraka alizopewa Israeli; wakati uliopita ni wa asili katika Kiswahili.
- source_word: חָמֶר
  choice: divai yenye povu
  rationale: Neno linaweza kudokeza divai iliyochacha sana, yenye povu, au labda divai nyekundu. ‘Divai yenye povu’ huhifadhi picha hai huku tanbihi ikionyesha uwezekano mwingine.
theological_decisions:
- issue: Taswira ya wingi wa mazao na mifugo
  choice: Kuhifadhi vyakula na kinywaji kama picha halisi za wingi wa riziki
  alternative: Kuzibadili kuwa maelezo ya moja kwa moja kuhusu anasa au baraka za agano
  rationale: Mstari wenyewe unaorodhesha riziki kwa taswira thabiti ya kilimo na ufugaji. Tafsiri haiongezi maana ya kiteolojia isiyotamkwa wazi.
- issue: Uhusiano wa ‘damu ya zabibu’ na divai
  choice: Kuidumisha kama tamko la kishairi linalofafanua divai
  alternative: Kutafsiri ‘divai kutoka katika damu ya zabibu’
  rationale: Muundo wa Kiebrania unaweka ‘damu ya zabibu’ karibu na kitenzi na neno la divai kwa namna ya kishairi; koma huhifadhi uhusiano huo bila kulazimisha maana ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Maziwa mgando’ na ‘divai yenye povu’ ni misemo ya sasa; majina ya wanyama yamewekwa wazi ili orodha ya Kiebrania isichanganye msomaji.
