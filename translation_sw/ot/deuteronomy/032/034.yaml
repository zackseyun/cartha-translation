  text: הֲ/לֹא ה֖וּא כָּמֻ֣ס עִמָּ/דִ֑י חָתֻ֖ם בְּ/אוֹצְרֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/034.yaml
  text: Is it not laid up with me[b][a], sealed in my storehouses?
translation:
  language: sw
  text: Je, jambo hili halijawekwa akiba kwangu,[a] likiwa limetiwa muhuri katika ghala zangu?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “halijafichwa kwangu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika hazina zangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, ... halija-?
  rationale: Muundo huu huhifadhi swali la balagha linalotarajia jibu la kukubali, na ni wa kawaida katika Kiswahili sanifu.
- source_word: הוּא
  choice: jambo hili
  rationale: Kiwakilishi cha Kiebrania ni cha umoja wa kiume, lakini hapa kinaonekana kurejelea kwa ujumla jambo lililotangulia, si lazima mtu wa kiume. ‘Jambo hili’ hudumisha kutotajwa wazi kwa kitu husika bila kukifanya kuwa mtu.
- source_word: כָּמֻס
  choice: limewekwa akiba
  rationale: Hali ya kutendwa inaonyesha kitu kilichofichwa au kuhifadhiwa kwa wakati ujao. ‘Kuwekwa akiba’ hulingana vizuri na taswira ya ghala na muhuri.
- source_word: עִמָּדִי
  choice: kwangu
  rationale: Huwasilisha maana ya kuwa pamoja na msemaji, katika milki au ulinzi wake, kwa Kiswahili cha kawaida.
- source_word: חָתֻם
  choice: likitiwa muhuri
  rationale: Huhifadhi picha ya kitu kilichofungwa na kulindwa kwa muhuri. Muundo wa ‘likiwa’ unaonyesha hali inayoambatana na kuwekwa akiba.
- source_word: בְּאוֹצְרֹתָי
  choice: katika ghala zangu
  rationale: אוֹצָר inaweza kumaanisha ghala au hazina. ‘Ghala’ huendeleza picha ya mahali pa kuhifadhia bila kuifanya iwe hasa mali ya thamani au fedha.
theological_decisions:
- issue: Kirejelewa cha kile kilichowekwa akiba na kutiwa muhuri
  choice: ‘jambo hili,’ likirejelea kwa ujumla yaliyotangulia bila kubainisha hasa kama ni kumbukumbu ya hatia au hukumu iliyowekwa tayari
  alternative: ‘yeye’ ikiwa kiwakilishi kinaeleweka kumrejelea adui au taifa lililofanywa kama mtu; au ‘hili’ kama muhtasari wa vitisho vilivyotangulia
  rationale: Kiwakilishi cha Kiebrania ni cha umoja wa kiume, lakini sintaksia inaruhusu kirejelewa kisicho mtu. ‘Jambo hili’ huepuka kubinafsisha bila msingi na huhifadhi utata wa kirejelewa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Swali la balagha limehifadhiwa; taswira za kuhifadhi, muhuri, na ghala zimewasilishwa kwa lugha inayoeleweka kwa msomaji wa kawaida.
