  source_fidelity: Tafsiri inadumisha swali la balagha la הֲלֹא, kirejelewa kisicho mtu cha הוּא, taswira ya kitu kilichowekwa akiba/kuhifadhiwa, na hali ya kutiwa muhuri katika ghala za msemaji. “Kwangu” katika muktadha huu huwasilisha kwa njia ya kawaida wazo la kuwa katika ulinzi au umiliki wa msemaji, bila kulazimisha kirejelewa maalumu.
