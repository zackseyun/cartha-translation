base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/013.yaml
  text: He made him ride on the heights of the land[a], and he ate the produce of the field; he made him suck honey from the rock[c][b], and oil from the flinty rock.
translation:
  language: sw
  text: Alimwendesha juu ya miinuko ya nchi[a], naye akala mazao ya mashambani[b]; akamfanya anyonye asali kutoka mwambani[c], na mafuta kutoka katika mwamba mgumu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “juu ya mahali pa juu pa nchi.” Hapa usemi huo huenda unarejelea miinuko ya nchi, wala si lazima mahali pa ibada palipoinuka.
    reason: lexical_alternative
  - marker: b
    text: Au, “mavuno ya mashamba.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kihalisi, “alimfanya anyonye asali kutoka mwambani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְכִּבֵהוּ
  choice: Alimpandisha
  rationale: Kauli ya kusababisha ya רכב ina maana ya kumsababisha mtu apande au asafiri akiwa juu ya kitu. “Alimpandisha” huhifadhi nguvu hiyo ya kisababishi kwa Kiswahili cha kawaida.
- source_word: עַל בָּמֳתֵי אָרֶץ
  choice: juu ya miinuko ya nchi
  rationale: במות hapa inaelekea kumaanisha sehemu zilizoinuka za nchi, si lazima mahali pa ibada. “Miinuko ya nchi” huhifadhi picha ya kishairi bila kuleta maana ya kiibada isiyohitajika.
- source_word: וַיֹּאכַל
  choice: naye akala
  rationale: Kitenzi אכל kina maana ya kawaida ya kula. “Naye” huonyesha wazi kwamba yule aliyepandishwa ndiye aliyekula, bila kutaja jina ambalo halipo katika mstari huu.
- source_word: תְּנוּבֹת שָׂדָי
  choice: mazao ya mashambani
  rationale: תנובות ni mazao au mavuno. Kiswahili “mazao ya mashambani” ni cha kawaida na huwasilisha wingi wa mazao yanayotoka katika ardhi inayolimwa.
- source_word: וַיֵּנִקֵהוּ
  choice: akamnyonyesha
  rationale: Kauli ya kusababisha ya ינק ni kumnyonyesha au kumsababisha anyonye. “Akamnyonyesha” huhifadhi taswira hai ya kupokea lishe moja kwa moja kutoka mahali pasipotazamiwa.
- source_word: דְבַשׁ
  choice: asali
  rationale: Hii ndiyo maana ya kawaida ya דבש na hapa inaonyesha riziki tele.
- source_word: מִסֶּלַע
  choice: kutoka mwambani
  rationale: סלע ni mwamba au jabali. “Mwambani” ni usemi mfupi na wa kawaida unaofaa sambamba na kishazi kinachofuata.
- source_word: וְשֶׁמֶן
  choice: na mafuta
  rationale: שמן ni mafuta; ingawa huenda mafuta ya zeituni yakakusudiwa, Kiebrania hakitaji zeituni, kwa hiyo tafsiri haiongezi ufafanuzi huo.
- source_word: מֵחַלְמִישׁ צוּר
  choice: kutoka katika mwamba wa gumegume
  rationale: חלמיש ni gumegume au jiwe gumu, na צור ni mwamba. Usemi huu huhifadhi msisitizo kwamba riziki hiyo ilitoka katika jiwe gumu lisilotazamiwa kutoa chakula.
theological_decisions:
- issue: Marejeo ya viwakilishi vya nafsi ya tatu katika mstari
  choice: Kuhifadhi wahusika kwa viwakilishi na maumbo ya vitenzi bila kuongeza majina “BWANA” au “Israeli” katika mstari wenyewe
  alternative: Kumtaja wazi BWANA kuwa mtendaji na Israeli au Yakobo kuwa mpokeaji
  rationale: Muktadha wa karibu huonyesha wahusika, lakini mstari wenyewe unatumia viwakilishi. Kuzihifadhi kunafuata mtiririko wa Kiebrania na kuepuka kuingiza ufafanuzi katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya kunyonyeshwa asali na mafuta imehifadhiwa kwa sababu ni ya makusudi katika Kiebrania. “Gumegume” huhifadhi umaalumu wa jiwe gumu, huku tanbihi zikibainisha mbadala muhimu bila kulemea mstari mkuu.
