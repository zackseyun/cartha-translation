base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/026.yaml
  text: I said[a], ‘I would scatter them[b]; I would make their memory cease from mankind,’
translation:
  language: sw
  text: Nilisema, “Ningewatawanya[a]; ningekomesha kumbukumbu yao miongoni mwa wanadamu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ningewapeperusha” au “ningewatawanya huku na huku.” Kitenzi cha Kiebrania ni adimu na kigumu; wengine hukielewa kuwa kuwafukuza mpaka pembezoni au kuwaondoa wasionekane.
    reason: lexical_alternative
  - marker: b
    text: Au “miongoni mwa binadamu” au “miongoni mwa watu wanaokufa.” Kiebrania kinatumia neno la umoja lenye maana ya kijumla kwa wanadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Nilisema
  rationale: Ni Qal timilifu nafsi ya kwanza umoja ya אמר, ikianzisha kusudi lililotamkwa na Yahwe. “Nilisema” ni tafsiri ya moja kwa moja na inafaa katika usemi huu wa kishairi.
- source_word: אַפְאֵיהֶם
  choice: Ningewatawanya
  rationale: Kitenzi hiki ni adimu na maana yake si hakika kabisa; kwa kawaida hueleweka kuwa kutawanya au kusambaza pande mbalimbali. “Ningewatawanya” ni Kiswahili cha kawaida kinachoonyesha hukumu iliyokusudiwa bila kufungia fumbo hilo katika taswira moja mahsusi.
- source_word: אַשְׁבִּיתָה
  choice: ningekomesha
  rationale: Hifili ya שבת ina maana ya kusababisha kitu kikome. “Ningekomesha” huhifadhi maana hiyo ya kisababishi na inaendana moja kwa moja na “kumbukumbu yao.”
- source_word: מֵאֱנוֹשׁ
  choice: miongoni mwa wanadamu
  rationale: אֱנוֹשׁ ni nomino ya umoja yenye maana ya kijumla kwa binadamu, mara nyingi ikidokeza hali yao ya kufa. “Miongoni mwa wanadamu” huwasilisha kwa Kiswahili fasaha eneo la jamii ya binadamu ambamo kumbukumbu hiyo ingekoma.
- source_word: זִכְרָם
  choice: kumbukumbu yao
  rationale: זֵכֶר humaanisha kumbukumbu au ukumbusho. “Kumbukumbu yao” ni tafsiri fupi, ya asili, inayodumisha wazo la kutokumbukwa tena na watu.
theological_decisions:
- issue: Usemi wa Mungu na hukumu iliyokusudiwa katika shairi
  choice: 'Kutumia hali ya masharti: “Ningewatawanya ... ningekomesha”'
  alternative: 'Kutumia wakati ujao wa moja kwa moja: “Nitawatawanya ... nitakomesha”'
  rationale: Katika muktadha huu wa kishairi, maumbo ya Kiebrania yanaeleza kusudi lililotamkwa. Hali ya masharti huhifadhi uhusiano na mstari unaofuata, ambao unaonyesha sababu iliyozuia utekelezaji kamili wa hukumu hiyo, bila kuondoa mvutano wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Alama [a] imewekwa baada ya kitenzi adimu kinachohusika, na [b] baada ya “wanadamu,” kulingana na maudhui ya tanbihi.
