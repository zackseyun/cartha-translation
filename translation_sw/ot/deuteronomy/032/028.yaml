  language: sw
  text: Kwa maana wao ni taifa lisilo na mashauri, na hakuna ufahamu ndani yao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaunganisha mstari huu na uliotangulia kwa kutoa sababu au maelezo, kwa mtiririko wa kawaida wa Kiswahili.
- source_word: גּוֹי
  choice: taifa
  rationale: Nomino hii ya umoja yenye maana ya mkusanyiko inarejelea kundi la watu kama taifa.
- source_word: אֹבַד עֵצוֹת
  choice: lisilo na shauri
  rationale: Kirai hiki kinaeleza taifa lililokosa shauri jema au mwongozo wa busara; tafsiri hii ni ya asili na inaeleweka katika Kiswahili cha sasa.
- source_word: הֵמָּה
  choice: wao ni
  rationale: Kiwakilishi huru kinasisitiza mhusika na, pamoja na kishazi kisicho na kitenzi, kinawakilishwa kwa muundo wa Kiswahili 'wao ni'.
- source_word: וְאֵין
  choice: wala hamna
  rationale: Huhifadhi ukanushaji wa kuwepo na kuunganisha kishazi cha pili kwa mtiririko wa kawaida wa Kiswahili.
- source_word: בָּהֶם
  choice: ndani yao
  rationale: Hueleza ufahamu kama sifa ambayo haimo katika watu hao, huku ikifuata moja kwa moja taswira ya Kiebrania.
- source_word: תְּבוּנָה
  choice: ufahamu
  rationale: Neno hili huonyesha uwezo wa kuelewa na kupambanua; 'ufahamu' huhifadhi msamiati wa hekima bila kuongeza maana ya kimadhehebu.
