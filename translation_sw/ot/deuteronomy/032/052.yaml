base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/052.yaml
  text: For you shall see the land from a distance[a], but you shall not go there[b], into the land that I am giving to the sons of Israel.
translation:
  language: sw
  text: Kwa maana utaiona nchi hiyo kwa mbali[a], lakini hutaingia humo, katika nchi ninayowapa wana wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutokea upande wa pili”; usemi wa Kiebrania unaonyesha kwamba Musa ataiona nchi bila kuingia ndani yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Katika muktadha huu neno hili linaanzisha sababu au maelezo ya tamko lililotangulia; “Kwa maana” linaonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: מִנֶּגֶד
  choice: kwa mbali
  rationale: Usemi huu unaonyesha kuitazama nchi ukiwa upande wa pili au mbali nayo bila kuingia. “Kwa mbali” ni wa asili na unaeleweka wazi katika Kiswahili.
- source_word: תִּרְאֶה
  choice: utaiona
  rationale: Kitenzi hiki cha nafsi ya pili umoja wa kiume kina maana ya wakati ujao katika muktadha huu; kiambishi -i- kinarejelea nchi iliyotajwa.
- source_word: הָאָרֶץ
  choice: nchi hiyo
  rationale: Hapa אֶרֶץ inarejelea nchi maalumu ambayo Mungu anawapa Israeli; “nchi” ndiyo tafsiri ya kawaida, na “hiyo” huifanya rejea iwe wazi.
- source_word: וְשָׁמָּה לֹא תָבֹא
  choice: lakini hutaingia humo
  rationale: Ingawa וְ mara nyingi ni “na,” hapa inaonyesha tofauti kati ya kuona na kutoruhusiwa kuingia. בוא pamoja na mwelekeo kuelekea nchi inaelezwa kwa kawaida kama “kuingia,” huku “humo” ikihifadhi maana ya שָׁמָּה.
- source_word: אֶל הָאָרֶץ
  choice: katika nchi
  rationale: Baada ya “hutaingia humo,” kirai hiki kinabainisha mahali ambapo Musa hataingia; “katika nchi” ni Kiswahili cha asili na huepuka urudiaji usio wa lazima.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: ninayowapa
  rationale: Kitenzi kishirikishi נֹתֵן kinaonyesha utoaji unaoendelea au ulio karibu kutimizwa. Muundo “ninayowapa” huhifadhi hali hiyo na pia huunganisha mpokeaji kwa kawaida.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hii huhifadhi kwa ukaribu muundo wa Kiebrania “wana wa Israeli,” ambao ni jina la kawaida la taifa zima la agano, bila kuubadili kuwa jina la kikabila lisiloonyesha muundo wa chanzo.
theological_decisions:
- issue: Jina la agano lenye umbo la kiume בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli / watu wa Israeli
  rationale: “Wana wa Israeli” huhifadhi umbo la Kiebrania na jina la jadi la taifa, huku katika matumizi yake likirejelea jumuiya yote ya Israeli, si wanaume pekee.
- issue: Tofauti kati ya kuiona nchi na kuingia ndani yake
  choice: utaiona nchi hiyo kwa mbali, lakini hutaingia humo
  alternative: utaiona nchi hiyo ukiwa upande wa pili, lakini hutakwenda huko
  rationale: Tafsiri iliyochaguliwa huhifadhi hukumu ya Mungu kwamba Musa ataiona nchi bila kuingia, bila kuongeza maelezo ya sababu ambayo hayamo katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini cha kawaida kwa msomaji wa leo. “Hutaingia humo” ni cha asili kuliko tafsiri ya neno kwa neno “hutakwenda huko, katika nchi,” na bado huhifadhi maana ya mwendo kuelekea ndani. Kiashirio cha tanbihi [a] kimewekwa katika matini kuu.
