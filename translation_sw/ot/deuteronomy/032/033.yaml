  text: 'Divai yao ni sumu ya nyoka[b],

    na sumu kali ya nyoka wenye sumu[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sumu ya fira”; neno la Kiebrania hutaja nyoka mwenye sumu ambaye aina yake haijulikani kwa uhakika.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza pia kumaanisha viumbe wakubwa watambaao au viumbe wa majini katika miktadha mingine; hapa usambamba na nyoka wenye sumu unaunga mkono maana inayofanana na nyoka.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: sumu
  rationale: Katika muundo huu pamoja na taswira ya nyoka, neno hili linamaanisha sumu, si ghadhabu wala joto.
- source_word: תַּנִּינִם
  choice: nyoka wakubwa
  rationale: Neno hili linaweza kumaanisha viumbe wakubwa watambaao au majini katika miktadha mingine; hapa usambamba na nyoka wenye sumu unaelekeza kwenye maana ya kiumbe kama nyoka, huku 'wakubwa' ikihifadhi kiasi fulani cha upana wa neno la Kiebrania.
- source_word: יֵינָם
  choice: divai yao
  rationale: Huu ni muundo wa kawaida wa umilikaji, na taswira ya kishairi inaitambulisha divai yao na sumu hatari.
- source_word: וְרֹאשׁ
  choice: sumu
  rationale: Katika muktadha huu neno linamaanisha kitu kichungu au chenye sumu, wala si 'kichwa.' 'Sumu' ni Kiswahili cha kawaida na wazi.
- source_word: פְּתָנִים
  choice: nyoka wenye sumu
  rationale: Aina kamili ya nyoka haijulikani kwa uhakika. Tafsiri hii huepuka kubainisha bila msingi kuwa ni kobra, fira, au nyoka mwingine, huku ikihifadhi jambo kuu la muktadha.
- source_word: אַכְזָר
  choice: kali
  rationale: Kivumishi hiki kinaonyesha sumu yenye ukali na athari isiyo na huruma. 'Kali' ni usemi wa asili katika Kiswahili kuhusu sumu na unaeleweka kwa urahisi.
