translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mistari miwili imehifadhi usambamba wa kishairi. 'Nyoka wakubwa' na 'nyoka wenye sumu' huepuka uhakika wa kupita kiasi kuhusu aina za wanyama, na 'sumu kali' ni muunganiko wa kawaida zaidi katika Kiswahili kuliko uhawilishaji wa moja kwa moja wa 'sumu katili.'
