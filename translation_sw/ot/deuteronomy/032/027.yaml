  text: לוּלֵ֗י כַּ֤עַס אוֹיֵב֙ אָג֔וּר פֶּֽן יְנַכְּר֖וּ צָרֵ֑י/מוֹ פֶּן יֹֽאמְרוּ֙ יָדֵ֣י/נוּ רָ֔מָה וְ/לֹ֥א יְהוָ֖ה פָּעַ֥ל כָּל זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/027.yaml
  text: Were it not that I feared the provocation of the enemy[a], lest their adversaries should misunderstand, lest they should say, ‘Our hand is exalted[c][b], and Yahweh has not done all this.’
translation:
  language: sw
  text: Kama nisingaliogopa uchokozi wa adui[a], wapinzani wao wasije wakaelewa vibaya[b], wasije wakasema, “Mkono wetu umetukuka[c], na Yahwe hakutenda haya yote.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hasira ya adui.” Neno la Kiebrania linaweza pia kumaanisha ghadhabu au jambo linalokera.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania ni kigumu; kinaweza pia kutafsiriwa “wakakosea kuhukumu” au “wakashindwa kutambua” sababu halisi ya kuanguka kwa Israeli.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “Mkono wetu uko juu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּלֵי
  choice: Kama si kwamba
  rationale: Huhifadhi maana ya sharti lenye kuonyesha jambo lililozuia hukumu iliyotajwa katika muktadha, huku ikiwa ya kawaida katika Kiswahili.
- source_word: כַּעַס אוֹיֵב
  choice: uchokozi wa adui
  rationale: Katika muktadha huu כַּעַס inaelekea kumaanisha tendo au mtazamo wa adui unaochokoza, hasa majivuno yake baada ya kuanguka kwa Israeli; uwezekano wa maana ya ‘hasira’ umewekwa katika tanbihi.
- source_word: אָגוּר
  choice: niliogopa
  rationale: Hutafsiri moja kwa moja kitenzi cha nafsi ya kwanza kinachoonyesha kuogopa au kuhofu, bila kuondoa lugha hii inayomhusu Mungu.
- source_word: פֶּן
  choice: wasije
  rationale: Muundo huu wa Kiswahili unaonyesha kusudi la kuzuia jambo lisitokee na unafaa kwa marudio ya פֶּן katika mistari yote miwili.
- source_word: יְנַכְּרוּ
  choice: wakaelewa vibaya
  rationale: Kitenzi hiki ni kigumu katika muktadha huu; tafsiri hii inaonyesha kwamba wapinzani wangefasiri kimakosa sababu halisi ya kuanguka kwa Israeli, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: צָרֵימוֹ
  choice: wapinzani wao
  rationale: Huwakilisha kundi la maadui wa Israeli na kupatana na muktadha wa wingi.
- source_word: יָדֵינוּ רָמָה
  choice: Mkono wetu umetukuka
  rationale: Huhifadhi sitiari ya mkono ulio juu au uliotukuka, inayodokeza ushindi na majivuno, bila kuibadili moja kwa moja kuwa ‘nguvu zetu zimeshinda.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa na cheo.
- source_word: פָּעַל כָּל זֹאת
  choice: aliyetenda haya yote
  rationale: Hutoa maana ya kufanya au kutekeleza matukio yote yanayozungumziwa na kuhifadhi dai la adui kwamba hayakutokana na Yahwe.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Kutumia ‘Yahwe’ huhifadhi jina binafsi lililo katika maandishi ya Kiebrania badala ya kulibadilisha kwa cheo.
- issue: Lugha inayosema Mungu aliogopa
  choice: niliogopa
  alternative: nilihangaikia
  rationale: Kiebrania kinatumia wazi kitenzi cha kuogopa au kuhofu. Tafsiri ya moja kwa moja huhifadhi mvutano wa usemi huo; muktadha unaonyesha kuwa jambo linalohofiwa ni adui kufasiri matukio vibaya, si kwamba Yahwe hana nguvu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Miundo ya ‘wasije’ imetumiwa kuhifadhi marudio na mantiki ya tahadhari katika Kiebrania; sitiari ya ‘mkono’ imehifadhiwa.
