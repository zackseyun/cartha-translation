  text: For their rock is not like our Rock[a], and our enemies are judges.
translation:
  language: sw
  text: Kwa maana mwamba wao si kama Mwamba wetu,[a] na adui zetu ni waamuzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwamba wao si kama mwamba wetu, na adui zetu ni waamuzi.” Neno la Kiebrania פְּלִילִים kihalisi ni “waamuzi” au “wasuluhishi”; hivyo kishazi hiki kina taswira ya kimahakama.
    reason: Tofauti ya tahajia ya ‘Mwamba/mwamba’ na maana ya moja kwa moja ya nomino ya Kiebrania vinafaa kuonyeshwa bila kuondoa utata wa mstari.
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha msingi au maelezo ya dai lililotangulia katika Wimbo wa Musa.
- source_word: כְצוּרֵנוּ צוּרָם
  choice: mwamba wao si kama Mwamba wetu
  rationale: Neno lilelile צוּר limehifadhiwa kama ‘mwamba’ pande zote ili kudumisha sitiari na utofautishaji wa makusudi; herufi kubwa katika ‘Mwamba wetu’ inaonyesha kuwa hapa ni cheo kinachomhusu Mungu wa Israeli.
- source_word: וְאֹיְבֵינוּ
  choice: na adui zetu
  rationale: Kiunganishi na nomino zimewasilishwa moja kwa moja bila kuongeza maana ya ‘hata’ isiyoelezwa wazi.
- source_word: פְּלִילִים
  choice: ndio waamuzi
  rationale: Nomino hii kwa kawaida humaanisha waamuzi au waamuzi wa mgogoro. ‘Ndio’ hufanya Kiswahili kiwe cha asili huku ikihifadhi kauli ya kimahakama badala ya kuibadili kuwa kitenzi ‘wanahukumu’.
theological_decisions:
- issue: Iwapo צוּר itafsiriwe kwa sitiari au ibadilishwe kuwa jina la ufafanuzi
  choice: Kuhifadhi ‘Mwamba’ kama sitiari/cheo kwa Mungu wa Israeli
  alternative: mlinzi, kimbilio, au nguvu
  rationale: Kiebrania kinatumia nomino ileile kuhusu Mungu wa Israeli na kitu ambacho mataifa yanakitegemea. Kuhifadhi sitiari kunadumisha mchezo wa maneno na mvutano wa kiteolojia bila kuufinyanga kwa tafsiri finyu.
- issue: Maana ya פְּלִילִים katika kishazi cha mwisho
  choice: waamuzi
  alternative: wanahukumu au mashahidi
  rationale: Maana ya moja kwa moja ya kimahakama imehifadhiwa, ingawa uhusiano kamili wa kishazi hicho na ulinganisho uliotangulia unabaki wenye utata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ni mfupi ili kuendana na usambamba wa Wimbo wa Musa.
