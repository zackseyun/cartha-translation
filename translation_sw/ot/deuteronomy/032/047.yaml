  text: כִּ֠י לֹֽא דָבָ֨ר רֵ֥ק הוּא֙ מִ/כֶּ֔ם כִּי ה֖וּא חַיֵּי/כֶ֑ם וּ/בַ/דָּבָ֣ר הַ/זֶּ֗ה תַּאֲרִ֤יכוּ יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/047.yaml
  text: For it is not an empty word for you[a], but it is your life[c][b], and by this word you will prolong your days on the land that you are crossing the Jordan to possess.
translation:
  language: sw
  text: Kwa maana hili si neno la bure kwenu[a], bali ni uhai wenu[b]; na kwa neno hili mtaongeza siku zenu katika nchi ile mnayovuka Mto Yordani kwenda huko kuimiliki[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hili si jambo la bure kwenu” au “hili si jambo dogo kwenu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “uhai wenu”; neno hilo lina umbo la wingi lakini linaweza kutumiwa kama nomino dhahania ya umoja. Pia yaweza kutafsiriwa “maisha yenu.”'
    reason: lexical_alternative
  - marker: c
    text: Au “kwenda huko kuirithi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דָבָר רֵק
  choice: neno lisilo na maana
  rationale: דָבָר inarejelea ujumbe au mafundisho yaliyotangulia, huku רֵק ikionyesha kitu kisicho na uzito, thamani, au matokeo. Tafsiri hii inadumisha neno moja katika vifungu vyote viwili na inaeleweka kwa Kiswahili cha sasa.
- source_word: מִכֶּם
  choice: kwenu
  rationale: Katika muundo huu מן ina maana ya uhusiano, yaani kwamba neno hilo si lisilo na maana kwa Israeli, wala si jambo lisilowahusu. “Kwenu” ni tafsiri ya kawaida na ya asili ya maana hiyo.
- source_word: חַיֵּיכֶם
  choice: uhai wenu
  rationale: Ingawa umbo la Kiebrania ni la wingi, חַיִּים mara nyingi ni nomino dhahania yenye maana ya uhai. “Uhai wenu” huhifadhi msisitizo kwamba neno hili ndilo msingi wa kuendelea kwa maisha ya taifa.
- source_word: וּבַדָּבָר הַזֶּה
  choice: na kwa neno hili
  rationale: 'בְּ hapa inaonyesha njia au chombo: kwa neno hili siku zao zitaongezwa. “Neno” pia hudumisha uhusiano wa kimatamshi na דָבָר katika mwanzo wa aya bila kuongeza wazi wazo la utii ambalo halikutajwa katika kishazi chenyewe.'
- source_word: תַּאֲרִיכוּ יָמִים
  choice: mtaongeza siku zenu
  rationale: Hiphil ya ארך pamoja na יָמִים ina maana ya kuzifanya siku ziwe ndefu, yaani kuishi muda mrefu. “Mtaongeza siku zenu” huhifadhi taswira ya Kiebrania na bado inaeleweka katika Kiswahili cha kibiblia cha sasa.
- source_word: עַל הָאֲדָמָה
  choice: katika nchi
  rationale: Katika muktadha huu אֲדָמָה ni nchi ambayo Israeli itaimiliki. Kiswahili cha kawaida hutumia “katika nchi” kwa kuishi au kudumu ndani ya eneo hilo; “juu ya nchi” kingekuwa cha kimitambo na kisicho cha asili.
- source_word: עֹבְרִים אֶת־הַיַּרְדֵּן
  choice: mnauvuka Mto Yordani
  rationale: Kitenzi kishirikishi kinaonyesha tendo lililo karibu kutokea kutoka mtazamo wa Musa. Kutaja “Mto Yordani” kunafanya rejeleo la jina hilo kuwa wazi na la asili kwa msomaji wa Kiswahili.
- source_word: שָׁמָּה לְרִשְׁתָּהּ
  choice: kwenda huko kuimiliki
  rationale: שָׁמָּה inaelekeza “huko,” na ירשׁ hapa ni kuichukua nchi iwe milki yao, huku pia ikiweza kubeba maana ya kuirithi. Tafsiri kuu inahifadhi kiashiria cha mahali na kiwakilishi kinachorejelea nchi.
theological_decisions:
- issue: Nguvu ya agano inayounganisha neno, uhai, na kudumu nchini
  choice: Aya inasema kwamba neno lililotolewa kwa Israeli ni uhai wao na njia ya kuongeza siku zao katika nchi.
  alternative: Aya ni sifa ya balagha tu kuhusu umuhimu wa sheria, bila kudokeza matokeo ya agano.
  rationale: Vishazi vinavyolingana—“ni uhai wenu” na “kwa neno hili mtaongeza siku zenu”—vinaunganisha neno la Mungu na uhai wa Israeli nchini. Tafsiri haiongezi mfumo wa mafundisho wa baadaye wala kuingiza neno “utii” moja kwa moja, ingawa muktadha mpana unahusu kulishika neno hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi huhifadhi marudio ya “neno” na taswira ya “kuongeza siku,” huku “katika nchi” na “mnauvuka Mto Yordani” zikitumia Kiswahili cha asili.
