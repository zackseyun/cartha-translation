  text: Yahwe peke yake alimwongoza[a], wala hakukuwa na mungu mgeni pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alimwelekeza.” Kitenzi cha Kiebrania kinaweza kumaanisha kuongoza au kuelekeza.
