lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa tahajia iliyozoeleka katika Kiswahili, badala ya kubadilishwa kuwa cheo kama “BWANA”.
- source_word: בָּדָד
  choice: peke yake
  rationale: Hueleza kwamba Yahwe alitenda bila msaada au ushirika wa mwingine; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: יַנְחֶנּוּ
  choice: alimwongoza
  rationale: Kitenzi נחה katika Hiphil hapa kina maana ya kuongoza au kuelekeza. Kiambishi cha yambwa cha umoja wa kiume kimehifadhiwa, kikimrejelea Israeli/Yakobo kwa mtazamo wa kijumla.
- source_word: וְאֵין
  choice: wala hakuna
  rationale: Muundo huu unawakilisha ukanushi wa uwepo katika kishazi cha pili na kuunganisha mawazo hayo mawili kwa Kiswahili cha kawaida.
- source_word: עִמּוֹ
  choice: aliyekuwa pamoja naye
  rationale: Kihusishi עם chenye kiambishi cha nafsi ya tatu umoja wa kiume kinaonyesha kuwapo pamoja; kitenzi “aliyekuwa” kimeongezwa ili kishazi kiwe kamili na cha asili katika Kiswahili.
- source_word: אֵל נֵכָר
  choice: mungu mgeni
  rationale: Kirai hiki humaanisha mungu wa kigeni au asiye wa Israeli. “Mungu mgeni” ni usemi mfupi, unaoeleweka, na unaohifadhi nguvu ya onyo dhidi ya ibada ya sanamu.
theological_decisions:
- issue: Kirejelewa cha kiambishi cha umoja katika “alimwongoza” na “pamoja naye”
  choice: Umoja umehifadhiwa, ukimrejelea Israeli/Yakobo kama nafsi moja ya kijumla.
  alternative: Kutumia wingi, “aliwaongoza” na “pamoja nao,” ili kulieleza taifa kama kundi.
  rationale: Maandishi ya Kiebrania yana viambishi vya umoja wa kiume, na muktadha wa karibu unamtaja Israeli/Yakobo kijumla kama nafsi moja. Kuhifadhi umoja hudumisha umbo na taswira ya chanzo bila kuibadili kuwa wingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi huku ukihifadhi jina la Mungu, umoja wa viambishi, na uwezekano wa maana mbili wa kitenzi.
