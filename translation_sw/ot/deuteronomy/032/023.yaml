  text: I will heap disasters upon them[b][a]; I will use up my arrows against them.
translation:
  language: sw
  text: Nitarundika maafa juu yao[a]; nitaitumia mishale yangu yote[b] dhidi yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “majanga”; kihalisi, “mabaya,” kwa maana ya hukumu zenye kuleta madhara, si uovu wa kimaadili.
    reason: lexical_alternative
  - marker: b
    text: Au “nitamaliza mishale yangu juu yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַסְפֶּה
  choice: Nitawalundikia
  rationale: Kitenzi hiki katika muundo wa Hifili kinaonyesha kukusanya au kurundika mambo juu ya watu. “Nitawalundikia” ni Kiswahili cha kawaida kinachohifadhi picha ya maafa yanayoongezwa mengi juu yao.
- source_word: עָלֵימוֹ
  choice: -wa-...-ia
  rationale: Kiambishi cha yambwa pamoja na kauli ya kutendea katika “nitawalundikia” kinawasilisha kwa njia ya asili wazo la kuyaleta maafa juu yao.
- source_word: רָעוֹת
  choice: maafa
  rationale: Katika muktadha huu neno linamaanisha matukio mabaya ya hukumu, si uovu wa kimaadili. “Maafa” linaonyesha madhara makubwa bila kuingiza dhana kwamba Mungu anatenda uovu wa kimaadili.
- source_word: חִצַּי
  choice: mishale yangu
  rationale: Tafsiri ya moja kwa moja inayohifadhi sitiari ya kivita ya Kiebrania.
- source_word: אֲכַלֶּה
  choice: nitaitumia ... yote
  rationale: Kitenzi cha Pieli hapa kina maana ya kutumia kitu hadi kiishe. Kiswahili “nitaitumia ... yote” ni cha asili na kinaonyesha kwamba mishale itatumika kikamilifu.
- source_word: בָּם
  choice: dhidi yao
  rationale: Herufi ב hapa inaonyesha walengwa wa mishale; “dhidi yao” linaeleza uelekeo wa uhasama kwa uwazi.
theological_decisions:
- issue: Maana ya רָעוֹת katika muktadha wa hukumu ya Mungu
  choice: maafa
  alternative: mabaya; majanga
  rationale: Muktadha unaonyesha madhara au misiba ya hukumu. “Maafa” huhifadhi ukali wa hukumu bila kueleweka kana kwamba Mungu anatenda uovu wa kimaadili.
- issue: Nguvu ya אֲכַלֶּה kuhusu mishale
  choice: nitaitumia mishale yangu yote
  alternative: nitamaliza mishale yangu juu yao
  rationale: Chaguo hili linaonyesha kuitumia akiba yote ya mishale bila kudokeza kwamba mishale yenyewe inaangamizwa; picha ya silaha kutumiwa dhidi yao inabaki wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa vishazi na sitiari ya mishale umehifadhiwa; viashiria vya tanbihi vimewekwa mara tu baada ya maneno vinavyofafanua.
