id: DEU.32.4
reference: Deuteronomy 32:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: הַ/צּוּר֙ תָּמִ֣ים פָּעֳל֔/וֹ כִּ֥י כָל דְּרָכָ֖י/ו מִשְׁפָּ֑ט אֵ֤ל אֱמוּנָה֙ וְ/אֵ֣ין עָ֔וֶל צַדִּ֥יק וְ/יָשָׁ֖ר הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/004.yaml
  text: The Rock—his work is perfect[a], for all his ways are justice. He is a God of faithfulness and without injustice[c][b], righteous and upright is he.
translation:
  language: sw
  text: Mwamba—kazi yake ni kamilifu, kwa maana njia zake zote ni za haki.[a] Yeye ni Mungu wa uaminifu,[b] asiye na udhalimu;[c] yeye ni mwenye haki na mnyofu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “njia zake zote ni hukumu ya haki.” Neno la Kiebrania מִשְׁפָּט linaweza kumaanisha “haki,” “hukumu,” au kile kilicho sawa kisheria.
    reason: lexical_alternative
  - marker: b
    text: “Mungu wa uaminifu” pia linaweza kueleweka kuwa “Mungu mwaminifu,” au, ingawa si maana inayowezekana zaidi katika muktadha huu, “Mungu wa kweli.”
    reason: lexical_alternative
  - marker: c
    text: Au, “hakuna uovu ndani yake” / “asiye na uovu.” Neno la Kiebrania עָוֶל linaweza kumaanisha kosa la kimaadili, udhalimu, au uovu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצּוּר
  choice: Mwamba
  rationale: Neno צוּר hapa ni sitiari na jina la cheo la Mungu katika Wimbo wa Musa. “Mwamba” huhifadhi picha ya uthabiti na ulinzi bila kuifafanua kupita maandishi.
- source_word: תָּמִים
  choice: kamilifu
  rationale: Hueleza ukamilifu na uadilifu wa kazi ya Mungu; “kamilifu” ni Kiswahili cha kawaida, chenye hadhi, kinachofaa muktadha huu.
- source_word: פָּעֳלוֹ
  choice: kazi yake
  rationale: Nomino ya umoja inarejelea kwa ujumla matendo au utendaji wa Mungu. “Kazi yake” huhifadhi umbo la nomino na ufupi wa kishairi.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu au msingi wa dai lililotangulia na husikika kwa kawaida katika Kiswahili cha hadhi.
- source_word: כָל־דְּרָכָיו
  choice: njia zake zote
  rationale: Huhifadhi sitiari ya Kiebrania inayomaanisha mwenendo na namna yote ya Mungu kutenda.
- source_word: מִשְׁפָּט
  choice: za haki
  rationale: Katika kishazi hiki neno linaonyesha kwamba njia zote za Mungu zinapatana na haki. “Ni za haki” ni ya kawaida zaidi katika Kiswahili huku tanbihi ikihifadhi maana za hukumu na kile kilicho sawa kisheria.
- source_word: אֵל
  choice: Mungu
  rationale: Humrejelea Mungu wa Israeli; “Mungu” ndilo neno la kawaida na linaloeleweka wazi katika Kiswahili.
- source_word: אֱמוּנָה
  choice: uaminifu
  rationale: Katika muktadha huu nomino inaonyesha kutegemeka na uthabiti wa Mungu, si ukweli wa kauli pekee.
- source_word: וְאֵין עָוֶל
  choice: asiye na udhalimu
  rationale: Hukana kwamba ndani ya Mungu kuna upotovu, uovu, au kutotenda haki. “Asiye na udhalimu” ni fupi na huendeleza msisitizo wa kimaadili na kimahakama.
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Hueleza sifa ya Mungu ya kutenda yaliyo sawa; “mwenye haki” ni ya asili katika Kiswahili na huepuka mkanganyiko wa “haki” kama nomino pekee.
- source_word: וְיָשָׁר
  choice: mnyofu
  rationale: Huwasilisha unyoofu na uadilifu wa kimaadili, na huambatana kwa kawaida na “mwenye haki.”
- source_word: הוּא
  choice: yeye ni
  rationale: Kiwakilishi cha Kiebrania kinaweka mkazo. Kurudia “yeye” katika kishazi cha mwisho huhifadhi kiwango cha msisitizo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Cheo na sitiari ya Mungu katika הַצּוּר
  choice: Kutafsiri “Mwamba” kama cheo cha kisitiari
  alternative: mwamba kama nomino ya kawaida isiyo na nguvu ya cheo
  rationale: Katika Wimbo wa Musa, neno hili linatumika kama jina la kisitiari la Mungu. Tafsiri huhifadhi sitiari bila kuongeza ufafanuzi wa kimadhehebu.
- issue: אֱמוּנָה kama sifa ya Mungu
  choice: uaminifu
  alternative: ukweli; uthabiti
  rationale: Muktadha unasisitiza kutegemeka na uadilifu thabiti wa Mungu. “Uaminifu” huhifadhi uzito huo bila kuufupisha kuwa ukweli wa kauli pekee.
- issue: Uhusiano wa מִשְׁפָּט na njia zote za Mungu
  choice: njia zake zote ni za haki
  alternative: njia zake zote ni hukumu ya haki
  rationale: Kiebrania kinaweza kueleweka kwa maana ya haki, hukumu, au kile kilicho sawa kisheria. Maandishi makuu yanatumia Kiswahili cha kawaida, huku tanbihi ikihifadhi upana wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na urahisi wa kueleweka. Muundo mfupi wa kishairi umehifadhiwa kwa kutumia kishazi cha mwanzo “Mwamba—” na msisitizo wa mwisho “yeye ni mwenye haki na mnyofu.” Alama zote za tanbihi zimewekwa katika maandishi makuu karibu na maneno yanayohusika.
