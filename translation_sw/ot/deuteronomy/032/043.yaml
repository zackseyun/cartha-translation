base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/043.yaml
  text: Rejoice[a], O nations, with his people, for he will avenge the blood of his servants; he will repay vengeance on his adversaries[d][c][b], and he will make atonement for his land and his people.
translation:
  language: sw
  text: Furahini[a], enyi mataifa, pamoja na watu wake, kwa maana atalipiza kisasi kwa ajili ya damu ya watumishi wake[b]; atawarudishia adui zake kisasi, naye atafanya upatanisho[d] kwa ajili ya nchi yake na watu wake.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Imbeni kwa furaha,” au “Shangilieni.” Amri ya Kiebrania inaweza kumaanisha kufurahi kwa kupaza sauti au kwa kuimba.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “damu ya watumishi wake”; neno hilo linaweza pia kutafsiriwa “watumwa” katika miktadha mingine.
    reason: lexical_alternative
  - marker: c
    text: Septuaginta ya Kigiriki na Gombo moja la Bahari ya Chumvi zimehifadhi umbo refu zaidi la aya hii. Lina miito ya ziada kwa mbingu na viumbe vya mbinguni kufurahi, na kwa mataifa kumwabudu. Andiko kuu hapa linafuata Kiebrania cha Kimasora.
    reason: textual_variant
  - marker: d
    text: Au, “ataitakasa nchi yake na kuwatakasa watu wake,” au “ataiondolea unajisi nchi yake na kuwaondolea unajisi watu wake.” Kitenzi cha Kiebrania kinaweza kukazia upatanisho au utakaso.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְנִינוּ
  choice: Furahini
  rationale: Ni amri ya wingi kutoka רנן, yenye maana ya kufurahi kwa shangwe, mara nyingi kwa kupaza sauti au kuimba. “Furahini” ni ya kawaida na wazi; wazo la kuimba au kushangilia limehifadhiwa katika tanbihi.
- source_word: גוֹיִם
  choice: mataifa
  rationale: Huwakilisha makundi ya watu yaliyo nje ya Israeli kwa maana pana ya kimataifa. “Mataifa” ni neno la kawaida na halileti vivuli vya maana vya Agano Jipya vinavyoweza kuambatana na “Wamataifa”.
- source_word: עַמּוֹ
  choice: pamoja na watu wake
  rationale: Mfuatano wa Kiebrania ni mfupi sana na unaweza kueleweka kwa njia zaidi ya moja. “Pamoja na” huonyesha usomaji unaowezekana zaidi, yaani mataifa yanaalikwa kufurahi pamoja na watu wa Mungu.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu ya mwito wa kufurahi na hudumisha mtiririko wenye heshima wa ushairi.
- source_word: דַם עֲבָדָיו
  choice: damu ya watumishi wake
  rationale: עבדים inaweza kumaanisha watumishi au watumwa. Hapa mkazo uko katika kuwa kwao watu wa Mungu na katika damu yao iliyomwagwa; kwa hiyo “watumishi” inafaa zaidi.
- source_word: יִקּוֹם
  choice: atalipiza kisasi kwa ajili ya
  rationale: Katika muunganiko huu kitenzi kinamaanisha kulipiza kisasi kwa damu iliyomwagwa. Kauli hii ya Kiswahili inaonyesha wazi kwamba damu ya watumishi wake ndiyo inayolipiziwa.
- source_word: וְנָקָם יָשִׁיב לְצָרָיו
  choice: atawarudishia adui zake kisasi
  rationale: Kiebrania hutumia kwa dhahiri wazo la “kurudisha” kisasi kwa adui. Tafsiri hii huhifadhi nguvu ya יָשִׁיב na pia maana ya kulipa kwa uovu waliotenda.
- source_word: וְכִפֶּר
  choice: atafanya upatanisho
  rationale: כפר inaweza kuelekeza kwenye kufunika au kuondoa hatia, kufanya upatanisho, au kutakasa. “Kufanya upatanisho” huhifadhi uzito wa kiibada na kiteolojia bila kuamua kimya-kimya kwamba maana yake ni utakaso pekee.
- source_word: אַדְמָתוֹ
  choice: nchi yake
  rationale: Ingawa אדמה pia inaweza kuwa ardhi au udongo, “nchi” inafaa katika mazingira ya kitaifa na ya agano.
- source_word: עַמּוֹ
  choice: watu wake
  rationale: Kirai cha mwisho kinaweka watu wake sambamba na nchi yake; tafsiri ya moja kwa moja ni wazi na ya asili katika Kiswahili.
theological_decisions:
- issue: Uhusiano wa “mataifa” na “watu wake” katika mstari wa kwanza
  choice: Mataifa yanaalikwa kufurahi pamoja na watu wa Mungu.
  alternative: Mataifa yanaalikwa kuwasifu watu wake; au mstari unasomwa kwa umbo refu linaloshuhudiwa na Septuaginta na Gombo la Bahari ya Chumvi.
  rationale: 'Maandishi ya Kimasora ni mafupi: “Furahini, mataifa, watu wake.” Neno “pamoja na” linakamilisha uhusiano unaowezekana zaidi kwa Kiswahili bila kuingiza vifungu vya mapokeo marefu katika andiko kuu.'
- issue: Maana ya כפר katika kifungu cha mwisho
  choice: Mungu atafanya upatanisho kwa ajili ya nchi yake na watu wake.
  alternative: Mungu ataitakasa au kuiondolea unajisi nchi yake na watu wake.
  rationale: Kitenzi kinaweza kuwa na maana ya upatanisho pamoja na utakaso. Andiko kuu linahifadhi maana yake ya upatanisho, huku tanbihi ikitaja wazi uwezekano wa utakaso bila kuamua namna hasa upatanisho huo unavyotimizwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wa sasa na wenye heshima. “Enyi mataifa” hudumisha mwito wa moja kwa moja; “kwa maana” na “naye” huunganisha vipashio vya shairi kwa urahisi. “Atawarudishia adui zake kisasi” ni rasmi lakini inaeleweka, na huhifadhi taswira ya Kiebrania ya kurudisha kisasi badala ya kufupisha vipashio viwili kuwa kitenzi kimoja.
