base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/042.yaml
  text: I will make my arrows drunk with blood[a], and my sword will devour flesh— with the blood of the slain and the captives, from the heads of the enemy leaders.
translation:
  language: sw
  text: 'Nitailewesha mishale yangu kwa damu,

    na upanga wangu utakula nyama—

    kwa damu ya waliouawa na ya mateka,

    kuanzia kwenye kichwa cha adui mwenye nywele ndefu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kwenye kichwa cha wakuu wa adui,” au, kwa tafsiri ya karibu zaidi, “kutoka kwenye vichwa vya adui vyenye nywele zilizoachwa huru.” Kirai cha Kiebrania ni kigumu, hasa neno adimu פַּרְעוֹת.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁכִּיר
  choice: Nitailewesha
  rationale: Hifili ya שׁכר humaanisha ‘kufanya kilewe.’ Taswira hai ya mishale kuleweshwa kwa damu imehifadhiwa badala ya kuibadili kuwa ‘kulowesha’ tu.
- source_word: חִצַּי
  choice: mishale yangu
  rationale: Hii ndiyo maana ya kawaida ya wingi wa חֵץ wenye kiambishi cha nafsi ya kwanza umoja, na ni Kiswahili cha kawaida katika muktadha wa vita.
- source_word: מִדָּם
  choice: kwa damu
  rationale: Ingawa מן kwa kawaida inaweza kumaanisha ‘kutoka,’ baada ya kitenzi ‘kulewesha’ hapa inaonyesha kitu kinachosababisha au kujaza ulevi; ‘kwa damu’ ni ya asili katika Kiswahili.
- source_word: וְחַרְבִּי
  choice: na upanga wangu
  rationale: Muundo wa umilikaji umetafsiriwa moja kwa moja.
- source_word: תֹּאכַל בָּשָׂר
  choice: utakula nyama
  rationale: Tafsiri hii inahifadhi sitiari ya Kiebrania ya upanga ‘kula’ nyama na pia nguvu yake ya kishairi, bila kuongeza ufafanuzi usiokuwamo katika chanzo.
- source_word: מִדַּם חָלָל
  choice: kwa damu ya waliouawa
  rationale: חָלָל hapa inaelekea kumaanisha watu waliouawa vitani. ‘Kwa damu’ huendeleza wazo la upanga kushibishwa au kulishwa damu.
- source_word: וְשִׁבְיָה
  choice: na ya mateka
  rationale: Nomino hii inaweza kumaanisha hali ya kutekwa au kundi la mateka. Katika muktadha huu imetafsiriwa kuwa watu, sambamba na ‘waliouawa’; neno ‘ya’ linaonyesha kuwa damu ya mateka ndiyo inayozungumziwa.
- source_word: מֵרֹאשׁ
  choice: kutoka kwenye vichwa vya
  rationale: רֹאשׁ imechukuliwa kwa maana halisi ya ‘kichwa,’ kwa matumizi ya jumla yanayoweza kuwakilishwa kwa wingi katika Kiswahili. Hii huhifadhi taswira thabiti ya shairi.
- source_word: פַּרְעוֹת
  choice: viongozi
  rationale: Neno hili adimu lina maana inayobishaniwa; linaweza kuhusishwa na nywele zilizoachwa huru au, kwa upanuzi, viongozi au mashujaa. ‘Viongozi’ huleta maana inayoeleweka katika mstari mkuu, huku uwezekano wa maana halisi ukihifadhiwa katika tanbihi.
- source_word: אוֹיֵב
  choice: wa adui
  rationale: Umoja huu una nguvu ya kijumla au ya pamoja. ‘Adui’ kwa umoja huhifadhi muundo huo na ni wa kawaida katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya kirai kigumu מֵרֹאשׁ פַּרְעוֹת אוֹיֵב
  choice: kutoka kwenye vichwa vya viongozi wa adui
  alternative: kutoka kwenye kichwa cha viongozi wa adui; kutoka kwenye vichwa vyenye nywele nyingi vya adui; kutoka kwa mashujaa wa adui wenye nywele ndefu
  rationale: Hili hasa ni tatizo la kimsamiati na kisintaksia, si uamuzi wa kimadhehebu. Tafsiri iliyochaguliwa inasomeka kwa urahisi na kuhifadhi taswira ya hukumu inayowafikia wakuu wa adui, lakini tanbihi inaonyesha wazi kwamba neno פַּרְעוֹת lina maana isiyo na uhakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wenye hadhi lakini unaoeleweka kwa wasomaji wa kawaida. Mistari imegawanywa ili kuhifadhi usambamba wa wimbo. Sitiari kali za mishale kulewa na upanga kula nyama zimehifadhiwa badala ya kulainishwa.
