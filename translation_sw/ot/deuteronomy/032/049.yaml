language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: עֲלֵ֡ה אֶל הַר֩ הָ/עֲבָרִ֨ים הַ/זֶּ֜ה הַר נְב֗וֹ אֲשֶׁר֙ בְּ/אֶ֣רֶץ מוֹאָ֔ב אֲשֶׁ֖ר עַל פְּנֵ֣י יְרֵח֑וֹ וּ/רְאֵה֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֨ר אֲנִ֥י נֹתֵ֛ן לִ/בְנֵ֥י יִשְׂרָאֵ֖ל לַ/אֲחֻזָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/049.yaml
  text: Go up to this mountain of the Abarim[a], Mount Nebo, which is in the land of Moab, opposite Jericho, and see the land of Canaan[c][b], which I am giving to the sons of Israel as a possession.
translation:
  language: sw
  text: Panda katika mlima huu wa Abarimu, Mlima Nebo, ulio katika nchi ya Moabu, mkabala na Yeriko, ukaione nchi ya Kanaani, ninayowapa wana wa Israeli kuwa milki yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuwa mali yao ya kudumu”; neno la Kiebrania humaanisha milki au eneo la ardhi linalomilikiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה
  choice: Panda
  rationale: Kitenzi cha amri katika nafsi ya pili umoja wa kiume kinaamuru kwenda juu; “Panda” ni cha kawaida na huhifadhi mwelekeo wa mwendo.
- source_word: הַר הָעֲבָרִים הַזֶּה
  choice: mlima huu wa Abarimu
  rationale: Jina la kijiografia עֲבָרִים limetoholewa kama Abarimu badala ya kutafsiriwa kietimolojia; kiashiria הַזֶּה kimehifadhiwa kwa “huu.”
- source_word: הַר נְבוֹ
  choice: yaani Mlima Nebo
  rationale: Kirai hiki kinaeleza kwa uambatano mlima uliotajwa kuwa ni Mlima Nebo; “yaani” hufanya uhusiano huo uwe wazi katika Kiswahili cha kawaida.
- source_word: אֲשֶׁר בְּאֶרֶץ מוֹאָב
  choice: ulio katika nchi ya Moabu
  rationale: Kishazi tegemezi kinaonyesha mahali Mlima Nebo ulipo; majina ya mahali yametoholewa kwa maumbo ya kawaida ya Kiswahili.
- source_word: אֲשֶׁר עַל פְּנֵי יְרֵחוֹ
  choice: mkabala na Yeriko
  rationale: Nahau ya kijiografia עַל־פְּנֵי hapa humaanisha kuwa upande unaoelekeana na Yeriko; “mkabala na” ni ya asili na sahihi.
- source_word: וּרְאֵה
  choice: ukaione
  rationale: Amri ya pili imeunganishwa kwa mtiririko wa Kiswahili na kuhifadhi maana ya kutazama au kuona nchi.
- source_word: אֶת אֶרֶץ כְּנַעַן
  choice: nchi ya Kanaani
  rationale: Jina la mahali כְּנַעַן limetoholewa kwa umbo la Kiswahili linalotambulika.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: ambayo ninawapa
  rationale: Kitenzi kishirikishi pamoja na kiwakilishi cha nafsi ya kwanza kinaonyesha tendo la Mungu linaloendelea au lililo karibu kutimizwa; “ninawapa” huhifadhi hali hiyo.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa karibu usemi wa Kiebrania “wana wa Israeli,” ambao ni jina la kijamii na la agano, bila kuufanya kuwa “Waisraeli” kimya kimya.
- source_word: לַאֲחֻזָּה
  choice: iwe milki yao
  rationale: אֲחֻזָּה humaanisha mali inayomilikiwa, hasa eneo la ardhi; “milki yao” ni ya asili katika Kiswahili na haiongezi moja kwa moja dhana ya urithi.
theological_decisions:
- issue: Jinsi ya kutafsiri בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli / watu wa Israeli
  rationale: Usemi wa Kiebrania ni wa kiume katika sarufi na ni jina la kawaida la watu wa agano. Tafsiri imehifadhi umbo hilo kwa Kiswahili kinachoeleweka bila kulifanya lisilo na jinsia.
- issue: Maana ya אֲחֻזָּה
  choice: milki
  alternative: urithi
  rationale: Neno linaonyesha umiliki au shamba lililoshikiliwa. “Milki” huhifadhi maana hiyo bila kuamua kwamba wazo kuu hapa lazima liwe urithi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia “yaani” kufafanua uambatano kati ya mlima wa Abarimu na Mlima Nebo, na majina yametoholewa kwa maumbo yanayotambulika: Abarimu, Nebo, Moabu, Yeriko, Kanaani, Israeli.'
