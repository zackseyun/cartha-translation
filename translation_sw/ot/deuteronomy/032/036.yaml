  text: כִּֽי יָדִ֤ין יְהוָה֙ עַמּ֔/וֹ וְ/עַל עֲבָדָ֖י/ו יִתְנֶחָ֑ם כִּ֤י יִרְאֶה֙ כִּי אָ֣זְלַת יָ֔ד וְ/אֶ֖פֶס עָצ֥וּר וְ/עָזֽוּב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/036.yaml
  text: For Yahweh will vindicate his people and will have compassion on his servants[a], when he sees that their strength is gone, and there is none left[d][c][b], bond or free.
translation:
  language: sw
  text: Kwa maana Yahwe atawatetea watu wake[a], na kuwahurumia watumishi wake[b], atakapoona kwamba nguvu zao zimekwisha[c], wala hapakuwa na mtumwa wala mtu huru aliyebaki[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atawahukumu watu wake.” Hapa maana inaweza kuwa kuwatendea haki au kuwatetea.
    reason: lexical_alternative
  - marker: b
    text: Au, “ataghairi kuhusu watumishi wake.” Kitenzi cha Kiebrania kinaweza kueleza kughairi au kusukumwa na huruma.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “mkono umekwisha”; ni nahau inayomaanisha kwamba nguvu au uwezo umetoweka.'
    reason: lexical_alternative
  - marker: d
    text: 'Kiebrania: “aliyezuiwa/aliyefungiwa na aliyeachwa.” Jozi hii ngumu huenda ni nahau inayomaanisha “mtumwa wala mtu huru,” au kwa ujumla, “hakuna yeyote kabisa aliyebaki.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יָדִין
  choice: atawatetea
  rationale: Kitenzi דין kinaweza kumaanisha kuhukumu au kumpatia mtu haki. Katika muktadha huu wa Yahwe kuwahurumia watu wake wanapokuwa hoi, maana ya hatua ya hukumu inayowatetea inafaa zaidi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la Kiebrania limeandikwa kwa namna ya kawaida na inayoeleweka katika Kiswahili, badala ya kubadilishwa na cheo.
- source_word: וְעַל עֲבָדָיו יִתְנֶחָם
  choice: na kuwahurumia watumishi wake
  rationale: נחם hapa inaweza kueleza kughairi hatua iliyokusudiwa au kusukumwa na huruma. 'Kuwahurumia' huwasilisha kwa lugha ya kawaida tendo la rehema kwa watumishi wake bila kuficha uwezekano mwingine, ambao umewekwa katika tanbihi.
- source_word: כִּי יִרְאֶה
  choice: atakapoona
  rationale: כִּי hapa ina mwingiliano wa wakati na sababu; 'atakapoona' ni ya asili katika Kiswahili na huhifadhi hasa upande wa wakati.
- source_word: אָזְלַת יָד
  choice: nguvu zao zimekwisha
  rationale: Kirai halisi ni 'mkono umetoweka/umekwisha,' lakini 'mkono' ni nahau ya nguvu au uwezo; tafsiri hii huwasilisha maana yake wazi.
- source_word: וְאֶפֶס
  choice: wala hakuna yeyote aliyebaki
  rationale: אפס huonyesha kutokuwapo au kufikia mwisho; hapa inaeleza kwamba hakuna mtu anayesalia.
- source_word: עָצוּר וְעָזוּב
  choice: aliyefungwa au aliyeachiliwa
  rationale: 'Jozi hii ngumu imetafsiriwa kwa ukaribu na maneno yake, huku tanbihi ikionyesha maana ya kinahau inayowezekana: hakuna yeyote kabisa, awe wa hali gani.'
theological_decisions:
- issue: Maana ya tendo la Yahwe kwa watu wake katika יָדִין
  choice: Yahwe atawatetea, yaani atatenda hukumu kwa niaba yao.
  alternative: Yahwe atawahukumu watu wake, jambo linaloweza kueleweka kwa maana pana au hata kama hukumu dhidi yao.
  rationale: Mstari sambamba kuhusu kuwahurumia watumishi wake na sababu ya wao kuishiwa nguvu vinaelekeza kwenye hukumu ya kuwatetea. Tanbihi inadumisha upana wa kimsamiati wa neno la asili.
- issue: Maana ya יִתְנֶחָם kuhusu watumishi wake
  choice: Kuwahurumia watumishi wake.
  alternative: Kughairi au kubadili hatua aliyokusudia kuhusu watumishi wake.
  rationale: Muktadha unaonyesha rehema kwa watu walio hoi, lakini maana ya kughairi haijaondolewa; imetajwa katika tanbihi.
- issue: Utambulisho wa עָצוּר וְעָזוּב
  choice: Aliyefungwa au aliyeachiliwa, ikiwa jozi inayojumuisha watu wote.
  alternative: Mtumwa au mtu huru; au hakuna yeyote kabisa aliyebaki.
  rationale: Kiebrania ni kigumu na huenda ni nahau. Tafsiri kuu inadumisha picha ya maneno ya asili, na tanbihi inaeleza tafsiri za maana zinazowezekana bila kukata shauri kupita ushahidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umehifadhi ushairi na uzito wa mstari, huku nahau isiyoeleweka moja kwa moja ikifafanuliwa kwa tanbihi.
