base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/022.yaml
  text: For a fire has been kindled in my anger[a], and it burns to the depths of Sheol; it devours the earth and its produce, and sets ablaze the foundations of the mountains.
translation:
  language: sw
  text: Kwa maana moto umewashwa katika hasira yangu, nao unawaka hadi vilindi vya Sheoli[a]; unaiteketeza dunia na mazao yake, na kuiteketeza misingi ya milima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadi Sheoli iliyo chini kabisa,” au “hadi vilindi vya kaburi.” Kiebrania kinasema, “hadi Sheoli, chini kabisa/ya kina kirefu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu au maelezo ya hukumu iliyotangulia kwa Kiswahili cha kawaida.
- source_word: אֵשׁ קָדְחָה
  choice: moto umewashwa
  rationale: Inahifadhi wazo la moto kuanzishwa au kuwashwa, badala ya kusema tu kwamba umeungua.
- source_word: בְאַפִּי
  choice: katika hasira yangu
  rationale: אַף ni 'pua' kihalisi, lakini hapa ni nahau ya hasira; tafsiri hii huwasilisha maana bila kulazimisha ukali wa ziada.
- source_word: וַתִּיקַד
  choice: nao unawaka
  rationale: Inaendeleza taswira ya moto na kuonyesha hali inayoendelea.
- source_word: עַד שְׁאוֹל תַּחְתִּית
  choice: hadi vilindi vya Sheoli
  rationale: Inabaki na jina Sheoli na kuonyesha maana ya chini kabisa au kina kirefu inayotolewa na תַּחְתִּית.
- source_word: וַתֹּאכַל
  choice: unaiteketeza
  rationale: Kitenzi cha 'kula' kimetumiwa kwa mfano kuhusu moto; 'teketeza' ni cha asili na hudumisha nguvu ya uharibifu.
- source_word: אֶרֶץ
  choice: dunia
  rationale: Muktadha mpana wa kishairi, unaotaja Sheoli na misingi ya milima, unaunga mkono upeo wa dunia kuliko eneo la nchi pekee.
- source_word: יְבֻלָהּ
  choice: mazao yake
  rationale: Hurejelea kile ambacho dunia hutoa; 'mazao' ni wazi, pana, na ya kawaida.
- source_word: וַתְּלַהֵט
  choice: na kuwasha moto
  rationale: Inahifadhi nguvu ya kisababishi ya kitenzi na taswira dhahiri ya moto.
- source_word: מוֹסְדֵי הָרִים
  choice: misingi ya milima
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya sehemu za chini kabisa zinazodhaniwa kuitegemeza milima.
theological_decisions:
- issue: Tafsiri ya שְׁאוֹל
  choice: Sheoli
  alternative: kaburi; ulimwengu wa wafu; jehanamu
  rationale: Neno la Kiebrania linahusu makao ya wafu na halipaswi kulinganishwa mapema na dhana za baadaye za jehanamu. Kulihifadhi kama 'Sheoli' kunadumisha ulimwengu wa dhana wa Agano la Kale na utata wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha ni wazi kwa wasomaji wa kawaida huku ikihifadhi ushairi, ukubwa wa taswira, na istilahi ya Sheoli.
