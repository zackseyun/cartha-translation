  text: וַ/יָּבֹ֣א מֹשֶׁ֗ה וַ/יְדַבֵּ֛ר אֶת כָּל דִּבְרֵ֥י הַ/שִּׁירָֽה הַ/זֹּ֖את בְּ/אָזְנֵ֣י הָ/עָ֑ם ה֖וּא וְ/הוֹשֵׁ֥עַ בִּן נֽוּן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/044.yaml
  text: Then Moses came and spoke all the words of this song in the hearing of the people[a], he and Hoshea son of Nun.
translation:
  language: sw
  text: Kisha Musa akaja, akasema maneno yote ya wimbo huu masikioni mwa watu, yeye pamoja na Hoshea mwana wa Nuni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Hoshea”; mahali pengine mtu huyu huitwa kwa kawaida Yoshua (tazama Hesabu 13:16).'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akaja
  rationale: Kitenzi בוא hapa kinaeleza kuja au kufika katika mfululizo wa simulizi; “akaja” ni cha kawaida na hakiongezi maelezo ya mwelekeo yasiyokuwapo.
- source_word: וַיְדַבֵּר
  choice: akasema
  rationale: דבר katika piel humaanisha kusema au kunena. “Akasema” ni Kiswahili cha kawaida na chenye heshima kwa tendo la kutamka ujumbe kwa watu.
- source_word: אֶת כָּל דִּבְרֵי
  choice: maneno yote
  rationale: Tafsiri hii inadumisha maana kamili ya ‘maneno yote’ bila kuyageuza kuwa muhtasari wa ujumbe.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: wimbo huu
  rationale: שירה ni ‘wimbo’ katika muktadha huu, yaani Wimbo wa Musa unaotangulia.
- source_word: בְּאָזְנֵי הָעָם
  choice: masikioni mwa watu
  rationale: Hii inadumisha taswira ya Kiebrania ya kutamka hadharani ili watu wasikie, huku ikiwa usemi unaoeleweka katika Kiswahili.
- source_word: הָעָם
  choice: watu
  rationale: עם hapa ni jumuiya ya watu wa agano waliokusanyika; “watu” ni tafsiri pana na ya kawaida katika muktadha.
- source_word: הוּא
  choice: yeye pamoja na
  rationale: Kiwakilishi huru kimehifadhiwa kwa msisitizo wa Kiebrania, lakini “pamoja na” kinafanya uhusiano wa wahusika uwe wa kawaida katika Kiswahili.
- source_word: וְהוֹשֵׁעַ
  choice: Hoshea
  rationale: Maandishi ya Kiebrania hapa yana jina הוֹשֵׁעַ, Hoshea, si umbo linalojulikana zaidi la Yoshua; jina la chanzo limehifadhiwa.
- source_word: בִּן נוּן
  choice: mwana wa Nuni
  rationale: Huu ni usemi wa kawaida wa Kiswahili wa kutaja ukoo wa mtu; “Nuni” linafuata namna ya kawaida ya kuandika jina hili katika Kiswahili.
theological_decisions:
- issue: Kumtaja mwandamani wa Musa kama Hoshea badala ya jina linalojulikana zaidi, Yoshua
  choice: Hoshea
  alternative: Yoshua
  rationale: Kiebrania cha mstari huu kinasema הוֹשֵׁעַ waziwazi. Tafsiri haipatani kimakusudi na jina la baadaye, bali inalinda ushahidi wa chanzo na kueleza jambo hilo katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “masikioni mwa watu” umechaguliwa ili kuhifadhi taswira na hali ya usomaji wa hadharani katika Kiebrania. Alama ya tanbihi imewekwa baada ya jina linaloelezwa.
