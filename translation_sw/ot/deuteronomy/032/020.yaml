  yaml_path: translation/ot/deuteronomy/032/020.yaml
  text: And he said[a], “I will hide my face from them; I will see what their end will be, for they are a perverse generation[b], children in whom there is no faithfulness.”
translation:
  language: sw
  text: Naye akasema, “Nitawaficha uso wangu; nitaona mwisho wao utakuwaje, kwa maana wao ni kizazi kilichopotoka[a], watoto ambao hawana uaminifu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kizazi cha upotovu mwingi.” Kiebrania kihalisi ni “kizazi cha upotovu,” kwa wingi.
    reason: lexical_alternative
  - marker: b
    text: Au “watoto wasioweza kutegemewa” au “wasio waaminifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַסְתִּירָה פָנַי מֵהֶם
  choice: Nitawaficha uso wangu
  rationale: Inahifadhi tamathali ya Kiebrania ya ‘kuuficha uso,’ inayomaanisha kuondoa kibali au uwepo, bila kuifafanua kupita kiasi.
- source_word: אֶרְאֶה מָה אַחֲרִיתָם
  choice: nitaona mwisho wao utakuwaje
  rationale: אַחֲרִיתָם inaweza kumaanisha mwisho au matokeo yao. Muundo huu ni wa kawaida katika Kiswahili na unadumisha uzito wa kauli.
- source_word: דּוֹר תַּהְפֻּכֹת
  choice: kizazi kilichopotoka
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la kizazi chenye upotovu wa kimaadili; tanbihi inahifadhi muundo wa nomino na wingi wenye mkazo katika Kiebrania.
- source_word: בָּנִים
  choice: watoto
  rationale: Neno hili linawarejelea watu kwa ujumla kama watoto, si wana wa kiume peke yao.
- source_word: לֹא אֵמֻן בָּם
  choice: ambao hawana uaminifu
  rationale: אֵמֻן hapa ni uaminifu, utegemekaji, au uthabiti katika uhusiano, si imani ya kiakili tu.
theological_decisions:
- issue: Tamathali ya agano ya Mungu kuuficha ‘uso’ wake
  choice: Nitawaficha uso wangu
  alternative: Nitawaondolea kibali changu
  rationale: Kutaja ‘uso’ kunahifadhi uzito wa tamathali ya Kiebrania kuhusu kuondolewa kwa kibali au uwepo wa Mungu, bila kuibana iwe na maana moja tu.
- issue: Maana ya אֵמֻן
  choice: uaminifu
  alternative: utegemekaji
  rationale: Katika muktadha huu neno linashutumu kukosekana kwa uaminifu wa kimaadili na wa kimahusiano; halizungumzii tu kuwa na imani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kishairi na tamathali ya ‘uso’ zimehifadhiwa; sentensi imefanywa ya kawaida bila kuondoa utata wa ‘mwisho’ na ‘uaminifu.’
