  yaml_path: translation/ot/deuteronomy/032/018.yaml
  text: You neglected the Rock who fathered you[c][b][a], and forgot the God who gave you birth.
translation:
  language: sw
  text: Ulimpuuza[b] Mwamba aliyekuzaa[a] kama baba, ukamsahau Mungu aliyekujifungua[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyekupata.” Kitenzi cha Kiebrania hapa huonyesha Mungu kama baba aliyemzaa au aliyepata mtoto.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi kilichotafsiriwa “ulimpuuza” ni kigumu; kinaweza pia kutafsiriwa “ulimsahau” au “hukumjali.”
    reason: lexical_alternative
  - marker: c
    text: Au, “aliyekuleta duniani.” Kiebrania kinatumia taswira ya kujifungua, yenye kuhusisha uchungu wa kuzaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: צוּר
  choice: Mwamba
  rationale: Neno hili linamaanisha mwamba halisi, lakini hapa limetumiwa kama jina la kimfano la Mungu wa Israeli. Herufi kubwa inalihifadhi kama cheo bila kuondoa picha ya mwamba.
- source_word: יְלָדְךָ
  choice: aliyekuzaa
  rationale: Kitenzi ילד kinaweza kumaanisha kuzaa au kupata mtoto. Kiswahili ‘aliyekuzaa’ kinahifadhi picha ya uzazi na pia kinaacha wazi kwa kiasi fulani ikiwa msisitizo ni wa baba au wa mzazi kwa ujumla.
- source_word: תֶּשִׁי
  choice: Ulimpuuza
  rationale: Kitenzi hiki ni kigumu katika muktadha huu. ‘Ulimpuuza’ kinaonyesha kutomjali Mungu kwa makusudi na kinadumisha ulinganifu na ‘ukamsahau’ bila kufanya mistari yote miwili iseme jambo lilelile kabisa.
- source_word: וַתִּשְׁכַּח
  choice: ukamsahau
  rationale: Hii ni tafsiri ya kawaida na ya asili ya שכח, huku kiunganishi ‘uka-’ kikidumisha mwendelezo wa shtaka la kishairi.
- source_word: אֵל
  choice: Mungu
  rationale: Katika muktadha huu אֵל anamrejelea Mungu wa Israeli. ‘Mungu’ ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: מְחֹלְלֶךָ
  choice: aliyekuzaa
  rationale: Kitenzi hiki kinaweza kuonyesha uchungu wa kuzaa na tendo la kumleta mtoto duniani. ‘Aliyekuzaa’ kinahifadhi picha ya uzazi iliyo katika Kiebrania; tanbihi inaonyesha mbadala unaosisitiza kuletwa duniani.
theological_decisions:
- issue: Taswira ya Mungu kama mzazi
  choice: Kuhifadhi taswira ya uzazi katika sehemu zote mbili kwa kutumia ‘aliyekuzaa,’ huku tanbihi ya kwanza ikionyesha uwezekano wa maana ya baba na ya mwisho ikionyesha taswira ya kujifungua.
  alternative: Kutumia lugha ya jumla kama ‘aliyekuumba’ au ‘aliyekufanya.’
  rationale: Kiebrania kinaunganisha Mwamba anayemzaa Israeli na Mungu anayemleta katika hali ya uzazi. Lugha ya jumla ya uumbaji ingepunguza mvutano na nguvu ya taswira hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Muundo mfupi wa vipashio viwili unadumisha ulinganifu wa Kiebrania. Kurudiwa kwa ‘aliyekuzaa’ ni kwa makusudi ili kuhifadhi taswira ya uzazi, huku tanbihi zikieleza tofauti za maana zinazowezekana.
