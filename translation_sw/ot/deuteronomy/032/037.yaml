  text: And he will say[a], ‘Where are their gods, the rock in which they took refuge?’
translation:
  language: sw
  text: Naye atasema, “Miungu yao iko wapi, ule mwamba[a] ambao waliukimbilia kupata hifadhi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania, kwa uhalisi zaidi: “mwamba ambamo walitafuta hifadhi.” Neno la umoja “mwamba” linaeleza “miungu yao.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: Naye atasema
  rationale: Muundo huu unaendeleza usemi wa kishairi katika muktadha wa aya 36–38 kwa maana ya wakati ujao. “Naye” linahifadhi kiunganishi cha Kiebrania bila kuongeza kwa lazima maana ya mfuatano inayoweza kudokezwa na “ndipo.”
- source_word: אֵי
  choice: iko wapi
  rationale: Ni kiulizi cha mahali, “wapi?” Kiswahili cha sasa hutumia kwa kawaida “iko wapi” pamoja na “miungu yao.”
- source_word: אֱלֹהֵימוֹ
  choice: miungu yao
  rationale: Nomino hii ina maana ya wingi na kiambishi kinachomaanisha “yao”; hapa inarejelea miungu iliyotegemewa badala ya BWANA.
- source_word: צוּר
  choice: ule mwamba
  rationale: “Mwamba” linahifadhi sitiari halisi. “Ule” husaidia kuonyesha kuwa neno hili linaeleza kwa ukaribu “miungu yao,” huku herufi ndogo zikiepuka kulifanya hapa kuwa jina la heshima la BWANA.
- source_word: חָסָיוּ
  choice: waliukimbilia kupata hifadhi
  rationale: Kitenzi kina maana ya kutafuta au kukimbilia hifadhi. Tafsiri hii ni ya asili katika Kiswahili na inadumisha picha ya mwamba kuwa mahali pa usalama.
- source_word: בּוֹ
  choice: ambao waliukimbilia
  rationale: Kiambishi cha nafsi ya tatu umoja kinarejelea “mwamba.” Kiambishi cha yambwa “-u-” katika “waliukimbilia” kinahifadhi urejeleo huo wa umoja kwa namna ya kawaida ya Kiswahili.
theological_decisions:
- issue: Msemaji na wakati wa kitenzi
  choice: 'Mstari umetafsiriwa kuwa usemi wa BWANA unaotarajiwa: “Naye atasema.”'
  alternative: “Naye alisema” au “Ndipo atasema.”
  rationale: Katika Kumbukumbu la Torati 32:36–38, maana ya wakati ujao inaendana vizuri na mwendelezo wa tangazo la BWANA. Hata hivyo, umbo la kishairi la Kiebrania linaweza kutafsiriwa kwa wakati uliopita katika uchanganuzi mwingine.
- issue: Maana ya “mwamba”
  choice: “mwamba” kwa herufi ndogo, likiwa maelezo ya miungu yao
  alternative: “Mwamba” kama jina la cheo
  rationale: Ingawa צוּר hutumiwa mahali pengine katika wimbo huu kama jina la cheo la BWANA, hapa inahusishwa moja kwa moja na “miungu yao.” Herufi ndogo inadumisha kejeli kuhusu ulinzi ambao miungu hiyo ilidhaniwa kutoa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Waliukimbilia kupata hifadhi” ni rahisi kueleweka na bado inadumisha sitiari ya kukimbilia mwamba kwa usalama.
