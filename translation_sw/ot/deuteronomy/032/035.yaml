base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/035.yaml
  text: Vengeance is mine[a], and recompense, at the time when their foot slips; for the day of their disaster is near[d][c][b], and what is prepared for them hastens.
translation:
  language: sw
  text: 'Kisasi ni changu[d], na malipo pia[a],

    wakati mguu wao utakapoteleza[b];

    kwa maana siku ya maafa yao iko karibu,

    na yale yaliyotayarishwa kwa ajili yao yanakuja upesi[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “malipo yanayostahili” au “malipo ya kisasi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mguu wao utajikwaa” au “utayumba.”
    reason: lexical_alternative
  - marker: c
    text: Au, “mambo yaliyokusudiwa kwao yanaharakisha kuja”; Kiebrania kina usemi mfupi uliobanwa.
    reason: lexical_alternative
  - marker: d
    text: Maneno haya yamenukuliwa katika Waroma 12:19 na Waebrania 10:30.
    reason: cross_reference
lexical_decisions:
- source_word: לִי נָקָם וְשִׁלֵּם
  choice: Kisasi ni changu, na malipo pia
  rationale: Muundo huu unahifadhi dai la Mungu la kuwa na haki ya kulipiza kisasi na kutoa malipo yanayostahili. Neno “malipo” linaonyesha kulipa kwa kadiri ya matendo bila kuifanya kauli kuwa kisasi cha chuki binafsi.
- source_word: לְעֵת תָּמוּט רַגְלָם
  choice: wakati mguu wao utakapoteleza
  rationale: “Mguu wao” unahifadhi umoja wa kimajazi wa Kiebrania wenye kiambishi cha wingi, na “utakapoteleza” linaonyesha anguko linalokaribia kwa lugha ya kawaida na yenye picha wazi.
- source_word: כִּי קָרוֹב יוֹם אֵידָם
  choice: kwa maana siku ya maafa yao iko karibu
  rationale: “Kwa maana” linaonyesha uhusiano wa sababu; “maafa” linawakilisha msiba au anguko lenye uharibifu linalodokezwa na אֵיד.
- source_word: וְחָשׁ עֲתִדֹת לָמוֹ
  choice: na yale yaliyotayarishwa kwa ajili yao yanakuja upesi
  rationale: Tafsiri hii inaweka wazi kwa Kiswahili muundo mfupi wa Kiebrania, huku ikihifadhi kutotajwa kwa undani mambo hayo ni nini na ikionyesha kuwa yanakaribia kwa kasi.
theological_decisions:
- issue: Lugha ya kisasi cha Mungu
  choice: Kisasi ni changu
  alternative: Haki ni yangu; Nitalipiza kisasi
  rationale: “Kisasi” kinahifadhi uzito wa נָקָם na haki ya Mungu ya kutoa hukumu, bila kuipunguza kuwa “haki” kwa ujumla wala kuiongeza kuwa hasira ya kibinafsi.
- issue: Maana ya עֲתִדֹת לָמוֹ
  choice: yale yaliyotayarishwa kwa ajili yao
  alternative: maangamizi yao; mambo yaliyokusudiwa kwao
  rationale: Kauli halisi inaacha yaliyotayarishwa bila kuyafafanua. Tafsiri iliyochaguliwa inalinda utata huo badala ya kuamua kwamba ni “maangamizi” pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa mistari na nusu-koloni unadumisha usambamba wa wimbo wa Kiebrania; “pia” hukamilisha kwa kawaida kishazi cha pili kilichofupishwa.
