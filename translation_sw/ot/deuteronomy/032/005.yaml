base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/005.yaml
  text: They have acted corruptly toward him[a]; they are not his children, because of their defect[b]. They are a crooked and twisted generation.
translation:
  language: sw
  text: Wametenda kwa upotovu kwake[a]; wao si watoto wake, kwa sababu ya kasoro yao. Wao ni kizazi kilichopotoka na kilichopindika[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hapa ni kigumu na kimebanwa. Kishazi cha kwanza kinaweza pia kueleweka, “Wamejiharibu,” na kirai kinachofuata kinaweza kutafsiriwa, “kasoro yao” au “kosa lao.”
    reason: alternative_reading
  - marker: b
    text: Au, “kizazi kipotovu na kilichopindika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁחֵת
  choice: wametenda kwa upotovu
  rationale: Kauli ya Piel inaonyesha kutenda kwa namna potovu. Tafsiri hii inadumisha nguvu ya kitenzi bila kulazimisha maana ya kujitendea, ambayo haiko wazi katika maandishi ya konsonanti.
- source_word: לוֹ
  choice: kumwelekea yeye
  rationale: Kihusishi ל chenye kiambishi cha nafsi kina uhusiano usio wazi katika kishazi hiki kifupi. ‘Kumwelekea yeye’ kinahifadhi uhusiano na Mungu bila kuamua kuwa ni ‘kwa ajili yake’ au ‘dhidi yake.’
- source_word: לֹא בָּנָיו
  choice: wao si watoto wake
  rationale: Kirai hiki hakina kitenzi na ni kifupi. Kuongeza ‘wao si’ ni Kiswahili cha kawaida, huku kukiepuka kuingiza wazo la wakati kama ‘si watoto wake tena.’
- source_word: מוּמָם
  choice: kwa sababu ya kasoro yao
  rationale: מוּם kwa kawaida humaanisha kasoro au dosari. ‘Kasoro’ inadumisha sitiari ya hali ya kimaadili; ‘kwa sababu ya’ imeongezwa ili uhusiano wa kisintaksia ueleweke, huku ugumu wa Kiebrania ukielezwa katika tanbihi.
- source_word: דּוֹר
  choice: kizazi
  rationale: ‘Kizazi’ ni tafsiri ya kawaida, ya asili, na sahihi katika muktadha huu wa kishairi na wa agano.
- source_word: עִקֵּשׁ
  choice: kilichopotoka
  rationale: Neno linaonyesha kitu kilichopinda au kupotoka. ‘Kilichopotoka’ ni cha kawaida katika Kiswahili na kinadumisha maana ya kimaadili.
- source_word: וּפְתַלְתֹּל
  choice: kupindika
  rationale: Kivumishi hiki adimu kinaongeza picha ya upotovu. ‘Kupindika’ kinahifadhi taswira halisi na kutofautisha neno hili kwa kiasi na עִקֵּשׁ.
theological_decisions:
- issue: Iwapo לֹא בָּנָיו inamaanisha kupoteza hali ya kuwa watoto wa agano au inakana tu tabia ya watoto
  choice: wao si watoto wake
  alternative: wao si watoto wake tena; si watoto kwake
  rationale: Kiebrania kinatoa ukano mkali bila alama wazi ya wakati. Tafsiri inadumisha uzito huo bila kuingiza dai pana kuhusu kupoteza hadhi ya agano.
- issue: Jinsi ya kuelewa sintaksia iliyobanwa ya sehemu ya kwanza ya mstari
  choice: Wametenda kwa upotovu kumwelekea yeye; wao si watoto wake, kwa sababu ya kasoro yao.
  alternative: Wamejiharibu; wao si watoto wake; kasoro yao ni yao; Ametenda kwa upotovu kwake; kutokuwa watoto wake ndiyo kasoro yao
  rationale: Sintaksia ya Kumbukumbu la Torati 32:5 ni ngumu kikweli. Tafsiri iliyochaguliwa inafuata uwezekano wa kawaida wa maandishi ya Kimasora na kutoa Kiswahili kinachoeleweka bila kurekebisha maandishi; uwezekano mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Lugha imewekwa wazi kwa wasomaji wa kawaida, huku ufupi, taswira, na utata halisi wa Kiebrania ukihifadhiwa kwa tanbihi.
