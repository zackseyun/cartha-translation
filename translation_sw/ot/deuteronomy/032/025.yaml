  yaml_path: translation/ot/deuteronomy/032/025.yaml
  text: Outside[a], the sword will bereave; and in the inner rooms, terror—both young man and virgin[b], nursing child together with gray-haired man.
translation:
  language: sw
  text: Nje, upanga utaleta majonzi ya kufiwa; na ndani ya vyumba[a], hofu kuu—kijana wa kiume na bikira[b], mtoto anayenyonya pamoja na mwanamume mwenye mvi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “na kutoka vyumbani.” Kiebrania kinatofautisha hatari iliyo nje na hofu iliyomo ndani.
    reason: lexical_alternative
  - marker: b
    text: “Bikira” limetafsiri neno la Kiebrania bethulah, linalomaanisha mwanamke kijana ambaye hajaolewa na mara nyingi hudokeza ubikira; “kijana wa kike” pia yawezekana.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִחוּץ
  choice: Nje
  rationale: Neno hili linahifadhi kwa ufupi utofauti wa mahali kati ya nje na vyumba vya ndani bila kuongeza wazo maalumu la barabara.
- source_word: תְּשַׁכֶּל
  choice: utawafanya watu wafiwe
  rationale: Kauli ya Piel ya שׁכל humaanisha kusababisha kufiwa au kunyang’anywa watoto. Kiswahili hiki ni cha kawaida kuliko tafsiri sisisi, huku kikihifadhi upanga kama mtendaji aliyefananishwa na mtu.
- source_word: חֶרֶב
  choice: upanga
  rationale: Upanga unawakilisha mauaji ya vita na unabaki kuwa mtendaji wa kitenzi kama katika Kiebrania.
- source_word: וּמֵחֲדָרִים
  choice: na ndani ya vyumba
  rationale: Ingawa kihalisi ni ‘na kutoka vyumbani,’ hapa kirai hiki kinatofautisha hali ya ndani na hatari iliyo nje. ‘Ndani ya vyumba’ ni Kiswahili cha kawaida kinachohifadhi utofauti huo.
- source_word: אֵימָה
  choice: hofu kuu
  rationale: Huwasilisha woga mzito na wa kutisha unaokusudiwa na אֵימָה kwa lugha ya kawaida na yenye uzito.
- source_word: גַּם בָּחוּר גַּם בְּתוּלָה
  choice: kijana wa kiume na bikira
  rationale: Kirai hiki kinataja kijana wa kiume na mwanamke kijana ambaye hajaoa, huku ‘bikira’ ikihifadhi maana mahususi inayoweza kudokezwa na בְּתוּלָה.
- source_word: יוֹנֵק
  choice: mtoto anayenyonya
  rationale: Huhifadhi umbo la kitenzi na picha ya mtoto ambaye bado ananyonya badala ya kulifanya neno hili kuwa ‘mtoto mchanga’ kwa ujumla.
- source_word: עִם אִישׁ שֵׂיבָה
  choice: pamoja na mtu mwenye mvi
  rationale: Huhifadhi picha halisi ya Kiebrania ya uzee unaotambulika kwa mvi, bila kuibadili tu kuwa ‘mzee.’
