  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa kishairi, mfupi na wenye hadhi. Alama ya mkato mrefu inadumisha orodha kali ya makundi yote yanayokumbwa na maafa. ‘Watu’ limeongezwa ili kitenzi cha kufiwa kiwe cha kawaida katika Kiswahili, bila kubainisha zaidi wale waliofiwa.
