base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/046.yaml
  text: And he said to them[a], “Set your heart on all the words that I am testifying to you today, which you shall command your sons to keep[b], to do all the words of this law.”
translation:
  language: sw
  text: Akawaambia, “Yawekeni moyoni maneno yote ninayowashuhudia leo[a], ili muwaamuru wana wenu kuyashika[b] na kuyatenda, yaani maneno yote ya sheria hii.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ninayowaonya leo,” au “ninayoshuhudia dhidi yenu leo.” Kitenzi cha Kiebrania kinaweza kuwa na maana ya kutoa ushuhuda na pia ya kuonya au kuwa na nguvu ya kisheria dhidi ya mtu katika mazingira ya agano.
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania: “wana wenu”; usemi huu unaweza kukiwakilisha kizazi kijacho kwa upana zaidi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂימוּ לְבַבְכֶם
  choice: Yawekeni moyoni
  rationale: Nahau ya Kiebrania ina picha halisi ya kuweka maneno moyoni, yaani kuyapa uangalifu na kuyafanya azimio la ndani. Kiswahili hiki ni cha kawaida na kinahifadhi picha hiyo.
- source_word: הַדְּבָרִים / דִּבְרֵי
  choice: maneno
  rationale: Katika muktadha huu דָּבָר ni matamko au maagizo ya agano; ‘maneno’ pia huhifadhi urudiaji uliomo katika mstari.
- source_word: מֵעִיד בָּכֶם הַיּוֹם
  choice: ninayowashuhudia leo
  rationale: Hifili ya עוּד pamoja na ב inaweza kueleza kutoa ushuhuda kwao au juu yao, na pia kuonya katika mazingira ya agano. ‘Ninayowashuhudia’ huhifadhi maana ya msingi ya ushuhuda bila kuamua kupita kiasi nguvu yake ya kisheria.
- source_word: אֲשֶׁר תְּצַוֻּם
  choice: ambayo mtawaamuru
  rationale: Kishazi cha uhusiano na kitenzi kisichotimilika kinaendeleza maneno ambayo Israeli itawaagiza kizazi kinachofuata; ‘ambayo mtawaamuru’ hufuata muundo wa Kiebrania huku kikibaki cha asili katika Kiswahili.
- source_word: בְּנֵיכֶם
  choice: wana wenu
  rationale: Nomino ya Kiebrania ni ya kiume katika wingi, ‘wana.’ Kiswahili ‘wana wenu’ kinadumisha umbo hilo, huku tanbihi ikieleza matumizi yanayoweza kuiwakilisha kizazi kijacho kwa upana.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: kuyashika kwa kuyatenda
  rationale: Jozi ya vitenzi inaunganisha kutunza kwa uangalifu na utekelezaji wa kweli. ‘Kuyashika kwa kuyatenda’ huonyesha kuwa kushika maagizo kunathibitishwa katika kuyafanya, bila kupoteza vipengele vyote viwili.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: sheria hii
  rationale: Ingawa תּוֹרָה linaweza kumaanisha ‘mafundisho,’ hapa linarejelea sheria au mafundisho ya agano katika Kumbukumbu la Torati; ‘sheria hii’ ni wazi na iliyozoeleka.
theological_decisions:
- issue: Nguvu ya kiushuhuda na kisheria ya מֵעִיד בָּכֶם
  choice: ninayowashuhudia leo
  alternative: ninayowaonya leo; ninayoyaita kuwa ushahidi dhidi yenu leo
  rationale: Tafsiri kuu inadumisha dhana ya ushuhuda wa agano, na tanbihi huhifadhi uwezekano wa onyo au ushahidi wa kisheria dhidi yao bila kuufanya uwe maana pekee.
- issue: Rejeo la kijinsia katika בְּנֵיכֶם
  choice: wana wenu
  alternative: watoto wenu
  rationale: Maandishi ya Kiebrania yana ‘wana’ kwa wazi. Tanbihi inaonyesha kwamba katika matumizi haya wana wanaweza kuwakilisha kizazi kijacho kwa upana.
- issue: Uhusiano wa לִשְׁמֹר לַעֲשׂוֹת
  choice: kuyashika kwa kuyatenda
  alternative: kuyashika na kuyatenda
  rationale: Kiebrania kina infinitivu mbili zinazosisitiza utunzaji na utekelezaji. Kiswahili kilichochaguliwa kinaonyesha kwa kawaida kwamba utiifu huo huonekana katika matendo, huku mbadala ukiwezekana kisarufi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Yawekeni moyoni’ huhifadhi nahau ya Kiebrania kwa njia ya kawaida; ‘wana wenu’ ni rasmi na sahihi kwa muktadha wa kibiblia. Alama zote za tanbihi zimewekwa katika matini kuu.
