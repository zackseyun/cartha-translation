  text: הֵ֚ם קִנְא֣וּ/נִי בְ/לֹא אֵ֔ל כִּעֲס֖וּ/נִי בְּ/הַבְלֵי/הֶ֑ם וַ/אֲנִי֙ אַקְנִיאֵ֣/ם בְּ/לֹא עָ֔ם בְּ/ג֥וֹי נָבָ֖ל אַכְעִיסֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/021.yaml
  text: They made me jealous with what is not a god[a]; they provoked me to anger with their idols. So I will make them jealous with those who are not a people[c][b]; I will provoke them to anger with a foolish nation.
translation:
  language: sw
  text: Walinifanya niwe na wivu kwa kile ambacho si mungu; walinikasirisha kwa sanamu zao[a]. Lakini mimi nitawafanya wawe na wivu kwa watu wasio taifa[b]; nitawakasirisha kwa taifa la kipumbavu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vitu vyao visivyo na thamani” au “ubatili wao”; neno la Kiebrania linaweza kumaanisha utupu au ubatili, na katika muktadha huu linarejelea sanamu.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa wasio taifa”; Kiebrania kinalinganisha usemi huu kwa makusudi na “kile ambacho si mungu.”
    reason: lexical_alternative
  - marker: c
    text: “Kipumbavu” hapa humaanisha upumbavu wa kimaadili na kiroho, si ukosefu wa akili tu.
    reason: cultural_note
lexical_decisions:
- source_word: קִנְאוּנִי
  choice: waliamsha wivu wangu
  rationale: Kauli hii ya Kiswahili inaonyesha kwamba matendo yao yalichochea wivu wa Mungu, huku ikiruhusu kitenzi hicho kuakisiwa katika nusu ya pili ya mstari.
- source_word: בְּלֹא אֵל
  choice: kwa kile ambacho si mungu
  rationale: Inahifadhi ukanushaji mkali wa Kiebrania kwamba kitu walichokiabudu si mungu, bila kukifanya kiwe jina la Mungu wa kweli.
- source_word: כִּעֲסוּנִי
  choice: walinikasirisha
  rationale: 'Ni Kiswahili cha kawaida chenye nguvu ya kisababishi: matendo yao yalimchochea Mungu kukasirika.'
- source_word: בְּהַבְלֵיהֶם
  choice: kwa sanamu zao
  rationale: Katika muktadha huu neno linalomaanisha pumzi, utupu au ubatili linawarejelea sanamu; tafsiri hii inaweka rejeo wazi, na tanbihi inahifadhi maana halisi zaidi.
- source_word: אַקְנִיאֵם
  choice: nitaamsha wivu wao
  rationale: Inarudia kwa makusudi muundo wa sehemu ya kwanza na kuhifadhi ulinganifu wa adhabu katika mstari.
- source_word: בְּלֹא עָם
  choice: kwa watu ambao si taifa
  rationale: Inahifadhi ulinganifu wa makusudi na ‘kile ambacho si mungu’ na haibainishi taifa fulani ambalo Kiebrania halilitaji.
- source_word: בְּגוֹי נָבָל
  choice: kwa taifa la kipumbavu
  rationale: Inatoa maana ya moja kwa moja ya נָבָל, huku tanbihi ikifafanua kwamba upumbavu unaokusudiwa ni wa kimaadili na kiroho.
- source_word: אַכְעִיסֵם
  choice: nitawakasirisha
  rationale: Inalingana na ‘walinikasirisha’ na kuhifadhi mwitikio wa kulipiza unaounda sehemu mbili za mstari.
theological_decisions:
- issue: Wanaorejelewa na ‘watu ambao si taifa’ na ‘taifa la kipumbavu’
  choice: Kutafsiri kwa ujumla bila kulitaja taifa fulani
  alternative: Taifa fulani la watu wasio Wayahudi, watu wa mataifa kwa ujumla, au taifa lisiloheshimika
  rationale: Kiebrania hakitambulishi taifa hilo. Tafsiri ya ujumla inadumisha nguvu na mvutano wa kitheolojia wa usemi bila kuingiza utambulisho wa baadaye katika maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mistari miwili na ulinganifu wa vitenzi umehifadhiwa. ‘Mungu’ limeandikwa kwa herufi ndogo katika ‘si mungu’ kwa kuwa hapa ni nomino ya kawaida, si jina au cheo cha Mungu wa kweli.
