  text: Kwa maana ninauinua mkono wangu kuelekea mbinguni, nami nasema[a], “Kama niishivyo milele,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “Ninauinua mkono wangu kuelekea mbinguni, nami nasema, ‘Ninaishi milele.’” Tafsiri katika mstari mkuu inaonyesha kwamba maneno haya yana nguvu ya kiapo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha msingi wa tamko zito linalofuata na kuunganisha mstari huu na yaliyotangulia.
- source_word: אֶשָּׂא
  choice: ninauinua
  rationale: Kitenzi נשׂא hapa kinaeleza kuinua mkono kama ishara ya kuapa; wakati wa sasa unafaa kwa tendo la kiapo linalotamkwa.
- source_word: אֶל שָׁמַיִם
  choice: kuelekea mbinguni
  rationale: Kinahifadhi mwelekeo wa ishara kwa lugha ya kawaida ya Kiswahili bila kulazimisha wingi wa kimofolojia wa neno la Kiebrania.
- source_word: יָדִי
  choice: mkono wangu
  rationale: Kinadumisha umoja na umilikaji wa Kiebrania.
- source_word: וְאָמַרְתִּי
  choice: na kusema
  rationale: Kinaendeleza tendo la kuinua mkono na kuanzisha maneno ya kiapo kwa mtiririko wa kawaida wa Kiswahili.
- source_word: חַי אָנֹכִי
  choice: Kama niishivyo
  rationale: Ni kauli ya kiapo, si taarifa ya kawaida tu kwamba msemaji yu hai; usemi huu huwasilisha nguvu hiyo ya kiapo.
- source_word: לְעֹלָם
  choice: milele
  rationale: Kinaonyesha muda usio na mwisho na kinahusishwa moja kwa moja na kuishi kwa msemaji.
theological_decisions:
- issue: Kuwasilisha kiapo cha Mungu kwa nafsi yake bila kukipunguza kuwa taarifa ya kawaida
  choice: Kama niishivyo milele
  alternative: Mimi ni hai milele
  rationale: Kifungu cha Kiebrania kinatumika katika mazingira ya kiapo. Tafsiri iliyochaguliwa inadumisha uzito wa kiapo pamoja na dai la kuishi milele, bila kuongeza istilahi za kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa urahisi. “Kuelekea mbinguni” hudumisha ishara halisi ya mkono, na “Kama niishivyo” ni usemi wa kiapo unaosikika wa asili bila kuingiza maelezo ya ziada.
