  text: 'Yahweh[a] akasema na Mose siku hiyo hasa, akisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa mapokeo hutafsiriwa “BWANA.” Namna nyingine za kulitaja ni “Yahwe” na “Yehova.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema na
  rationale: Kitenzi דבר katika kauli hii kinaendeleza simulizi na kutambulisha maneno yanayofuata; “akasema na” ni ya kawaida na ya asili katika Kiswahili.
- source_word: יְהוָה
  choice: BWANA
  rationale: Jina la Kiebrania YHWH limetafsiriwa kwa namna ya mapokeo ya Kiswahili kama “BWANA,” huku tanbihi ikionyesha wazi jina la asili na namna nyingine za kulitaja.
- source_word: אֶל מֹשֶׁה
  choice: na Mose
  rationale: Baada ya “akasema,” Kiswahili cha kawaida hutumia “na” kumtaja mtu aliyeambiwa; מֹשֶׁה ni “Mose.”
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: siku iyo hiyo
  rationale: Nahau hii inasisitiza kwamba jambo lilitokea siku ileile hasa; “siku iyo hiyo” ni usemi wa asili wa Kiswahili unaohifadhi msisitizo huo.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huhifadhi fomula ya Kiebrania inayotambulisha usemi wa moja kwa moja katika mstari unaofuata.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: BWANA
  alternative: Yahwe
  rationale: “BWANA” linafuata matumizi yaliyozoeleka katika Biblia za Kiswahili, lakini tanbihi inalinda ushahidi wa maandishi kwa kubainisha kwamba Kiebrania kina YHWH na kwamba “Yahwe” au “Yehova” ni namna nyingine za kulitaja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kurudia wa Kiebrania katika “akasema ... akisema” umehifadhiwa kwa kuwa mstari unaishia kwa utangulizi wa maneno yanayofuata.
