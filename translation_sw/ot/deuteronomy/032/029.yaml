  variant: Standard East African Swahili
source:
  edition: WLC
  text: ל֥וּ חָכְמ֖וּ יַשְׂכִּ֣ילוּ זֹ֑את יָבִ֖ינוּ לְ/אַחֲרִיתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/029.yaml
  text: If only they were wise[a], they would understand this; they would discern their end.
translation:
  language: sw
  text: Laiti wangekuwa na hekima, wangeelewa hili; wangetambua mwisho wao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hatima yao” au “wakati wao ujao.” Neno la Kiebrania linaweza kumaanisha matokeo ya mtu au mambo yatakayokuja baadaye.
    reason: lexical_alternative
lexical_decisions:
- source_word: ל֥וּ
  choice: Laiti
  rationale: Chembe hii huonyesha tamanio lenye huzuni au majuto, si sharti la kawaida; “Laiti” huwasilisha nguvu hiyo kwa Kiswahili cha asili.
- source_word: חָכְמ֖וּ
  choice: wangekuwa na hekima
  rationale: Kitenzi kinahusu kuwa na hekima au kuitumia. Muundo huu unaendana kwa kawaida na tamanio linaloanzishwa na “Laiti.”
- source_word: יַשְׂכִּ֣ילוּ
  choice: wangeelewa
  rationale: Hifili ya שׂכל inaweza kumaanisha kupata ufahamu au kutenda kwa busara. Sambamba na kitenzi kinachofuata, hapa mkazo wa utambuzi unafaa zaidi.
- source_word: זֹ֑את
  choice: hili
  rationale: Kiwakilishi kionyeshi cha umoja kimehifadhiwa na kinaelekeza kwenye jambo au fundisho lililotangulia.
- source_word: יָבִ֖ינוּ
  choice: wangetambua
  rationale: Kitenzi בין hueleza kufahamu kwa kutofautisha au kutambua. “Wangetambua” hukitofautisha na “wangeelewa” huku kikihifadhi usambamba wa kishairi.
- source_word: לְאַחֲרִיתָם
  choice: mwisho wao
  rationale: אַחֲרִית inaweza kumaanisha mwisho, hatima, au yatakayokuja baadaye. “Mwisho wao” ni fupi na huhifadhi uzito wa onyo katika muktadha.
theological_decisions:
- issue: Maana ya אַחֲרִיתָם katika muktadha
  choice: mwisho wao
  alternative: hatima yao; wakati wao ujao
  rationale: Kauli inawahimiza watambue matokeo yanayowangoja. “Mwisho wao” huhifadhi maana ya matokeo na uzito wa hukumu bila kuifanya iwe tu taarifa ya wakati ujao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Laiti” huhifadhi sauti ya tamanio lenye majuto; vitenzi “wangeelewa” na “wangetambua” hutiririka kwa kawaida na kudumisha usambamba wa kishairi. Alama ya tanbihi imewekwa baada ya “mwisho wao,” ambako mbadala wa kimsamiati unahusika.
