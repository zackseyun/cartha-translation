  text: And Yahweh saw and rejected them, provoked to anger by his sons and daughters[a].
translation:
  language: sw
  text: Yahwe akaona, akawakataa kwa sababu ya uchokozi wa wanawe wa kiume na wa kike.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawakataa kwa dharau.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Limeandikwa kama jina la agano la Mungu kwa umbo linalotumika kwa urahisi katika Kiswahili, badala ya kulibadilisha kuwa cheo.
- source_word: וַיַּרְא
  choice: akaona
  rationale: Kitenzi ראה katika qal hapa kina maana ya kawaida ya kuona, na kinaanzisha mwitikio wa Yahwe kwa matendo ya watu wake.
- source_word: וַיִּנְאָץ
  choice: akawakataa
  rationale: נאץ hubeba wazo la kukataa au kupuuza kwa dharau. 'Akawakataa' ni ya kawaida na inaonyesha kuvunjika kwa uhusiano bila kuzidisha maana; kiambishi cha yambwa '-wa-' kimetolewa kutokana na muktadha.
- source_word: מִכַּעַס
  choice: kwa sababu ya hasira iliyochochewa na
  rationale: מִן lina nguvu ya kisababishi hapa, na כעס linaweza kueleza hasira au uchokozi unaoamsha hasira. Uundaji huu unaonyesha kuwa mwenendo wa wanawe ndio uliochochea hasira hiyo.
- source_word: בָּנָיו וּבְנֹתָיו
  choice: wanawe wa kiume na wa kike
  rationale: Kiebrania kinataja watoto wa jinsia zote waziwazi. Kiswahili 'wanawe wa kiume na wa kike' kinahifadhi utofautishaji huo kwa lugha inayoeleweka.
theological_decisions:
- issue: Yambwa lisilotajwa wazi la וַיִּנְאָץ
  choice: Yambwa limeelezwa kama watu wake kwa kiambishi '-wa-' katika 'akawakataa'.
  alternative: 'Kuacha yambwa bila kutajwa: ''akaona, akakataa''.'
  rationale: Muktadha unawatambulisha watu waliotangulia kutajwa, na Kiswahili cha kawaida huhitaji yambwa hili ili sentensi iwe wazi, bila kuongeza dai jipya la kiteolojia.
- issue: Namna ya kueleza kutopendezwa kwa Mungu
  choice: Kutumia 'akawakataa' na 'hasira iliyochochewa' bila kupunguza wala kuzidisha ukali.
  alternative: Kutumia 'akawadharau' au 'akawachukia sana'.
  rationale: Aya inaonyesha hukumu halisi ya Mungu kwa kukosa uaminifu wa agano. Uteuzi huu unahifadhi uzito huo huku ukiepuka kuingiza nguvu ya maana isiyolazimishwa na ushahidi wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa kwa ufasaha wa kawaida huku ukihifadhi sababu ya hasira na kutajwa wazi kwa wana wa kiume na wa kike.
