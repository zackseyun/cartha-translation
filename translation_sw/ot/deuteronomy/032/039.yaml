  variant: Standard East African Swahili
source:
  edition: WLC
  text: רְא֣וּ עַתָּ֗ה כִּ֣י אֲנִ֤י אֲנִי֙ ה֔וּא וְ/אֵ֥ין אֱלֹהִ֖ים עִמָּ/דִ֑י אֲנִ֧י אָמִ֣ית וַ/אֲחַיֶּ֗ה מָחַ֨צְתִּי֙ וַ/אֲנִ֣י אֶרְפָּ֔א וְ/אֵ֥ין מִ/יָּדִ֖/י מַצִּֽיל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/039.yaml
  text: See now that I[a], even I, am he, and there is no god beside me. I put to death and I make alive; I have wounded, and I will heal[e][d][c][b]; and there is no one who can deliver from my hand.
translation:
  language: sw
  text: Oneni sasa kwamba mimi, naam, mimi ndiye[a], wala hakuna mungu kando yangu[b]. Mimi ninaua, nami ninahuisha; nimejeruhi[c], nami nitaponya; wala hakuna anayeweza kuokoa kutoka mkononi mwangu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinasisitiza kwa kurudia kiwakilishi: “mimi, mimi ndiye.”'
    reason: previous_rendering
  - marker: b
    text: Au, “wala hakuna Mungu pamoja nami.” Kihusishi cha Kiebrania kwa kawaida humaanisha “pamoja na,” lakini hapa kinaweza kuonyesha kwamba hakuna mungu aliye sambamba naye.
    reason: lexical_alternative
  - marker: c
    text: Au, “nimeponda.” Kitenzi cha Kiebrania kinaweza kueleza pigo kali linaloponda au kuvunja.
    reason: lexical_alternative
  - marker: d
    text: “Kutoka mkononi mwangu” ni nahau inayomaanisha kuponyoka katika nguvu au mamlaka yangu.
    reason: cultural_note
lexical_decisions:
- source_word: רְאוּ עַתָּה
  choice: Oneni sasa
  rationale: Amri ya wingi רְאוּ inawaita wasikilizaji watambue ukweli huo; “oneni” huhifadhi wito wa moja kwa moja, na עַתָּה ni “sasa.”
- source_word: כִּי אֲנִי אֲנִי הוּא
  choice: kwamba mimi, naam, mimi ndiye
  rationale: Kurudiwa kwa אֲנִי kunasisitiza nafsi ya msemaji. “Naam” huonyesha msisitizo huo kwa Kiswahili cha kawaida bila kufanya marudio yasikike kama kosa, huku “mimi ndiye” ikihifadhi הוּא bila kuongeza maelezo ya kimafundisho.
- source_word: וְאֵין אֱלֹהִים עִמָּדִי
  choice: wala hakuna mungu kando yangu
  rationale: Katika dai hili la upekee, עִמָּדִי ina maana ya kuwapo pamoja au sambamba na msemaji. “Kando yangu” huhifadhi picha ya Kiebrania na maana kwamba hakuna mungu anayesimama pamoja naye kama mwingine wa hadhi hiyo.
- source_word: אֲנִי אָמִית וַאֲחַיֶּה
  choice: Mimi ninaua, nami ninahuisha
  rationale: Hiphil ya מות ina maana ya kusababisha kifo, na Piel ya חיה hapa ni kusababisha uhai. “Ninaua” na “ninahuisha” huhifadhi usambamba mkali, uwakala wa Mungu, na lugha ya kishairi.
- source_word: מָחַצְתִּי וַאֲנִי אֶרְפָּא
  choice: nimejeruhi, nami nitaponya
  rationale: מָחַץ inaweza kumaanisha kuponda au kujeruhi; katika usambamba na רפא, “nimejeruhi” huwasilisha upinzani wa jeraha na uponyaji bila kudhoofisha uwezekano wa tendo kali zaidi. Wakati ujao katika “nitaponya” unafaa mfuatano wa perfect na imperfect.
- source_word: וְאֵין מִיָּדִי מַצִּיל
  choice: wala hakuna anayeweza kuokoa kutoka mkononi mwangu
  rationale: Mַצִּיל ni mwokozi au aokoaye. Muundo huu unaeleza wazi kutokuwapo kwa yeyote mwenye uwezo wa kuokoa, huku ukihifadhi nahau ya “mkono” kama mamlaka au nguvu.
theological_decisions:
- issue: Upekee wa Mungu ukilinganishwa na miungu mingine
  choice: “wala hakuna mungu kando yangu” kama dai la kwamba hakuna mungu mwingine anayesimama sambamba na BWANA
  alternative: “wala hakuna Mungu pamoja nami,” kwa maana ya kutokuwa na mshirika wa kiungu
  rationale: Muktadha na kishazi cha Kiebrania vinaunga mkono dai thabiti la upekee. Tafsiri haipunguzi dai hilo kuwa ubora tu dhidi ya miungu mingine, wala haiingizi istilahi za kifalsafa zisizomo katika mstari.
- issue: Uzito wa kitheolojia wa אֲנִי אֲנִי הוּא
  choice: 'Kuhifadhi kauli rahisi lakini yenye msisitizo: “mimi, naam, mimi ndiye”'
  alternative: “mimi peke yangu ndiye” au kulipanua kuwa tamko maalumu la kimafundisho
  rationale: Marudio ya kiwakilishi yana uzito na mwangwi katika Maandiko, lakini “peke yangu” katika kishazi hiki kingekuwa nyongeza ya kifafanuzi. Upekee unaelezwa wazi na kishazi kinachofuata.
- issue: Mamlaka ya Mungu juu ya kifo, uhai, jeraha, na uponyaji
  choice: 'Kuhifadhi jozi zote mbili kama matendo ya msemaji: kuua/kuhuisha na kujeruhi/kuponya'
  alternative: Kufafanua kuhuisha kama ufufuo pekee au kujeruhi kama adhabu maalumu
  rationale: Mstari wenyewe hauamui upeo maalumu wa “kuhuisha” wala aina ya jeraha. Tafsiri inaacha upana na mvutano wa kishairi wa matendo hayo bila kuyawekea mfumo wa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Naam” imetumiwa kuonyesha msisitizo wa marudio ya Kiebrania kwa njia ya asili; “ninahuisha” huhifadhi usambamba wa kishairi na ni neno linaloeleweka katika sajili ya kibiblia. Herufi ndogo katika “mungu” inaonyesha kwamba kifungu kinakanusha kuwapo kwa deity mshindani badala ya kutumia cheo kama jina la Mungu wa Israeli.
