base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/008.yaml
  text: When the Most High gave the nations their inheritance[a], when he separated the sons of man[b], he fixed the boundaries of the peoples according to the number of the sons of Israel.
translation:
  language: sw
  text: Aliye Juu Sana alipoyapa mataifa urithi, alipowatenganisha wana wa binadamu,[b] aliweka mipaka ya mataifa kulingana na idadi ya wana wa Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Magombo ya Bahari ya Chumvi na Septuajinti yanasoma “wana wa Mungu” (au “malaika wa Mungu”) badala ya “wana wa Israeli.”
    reason: textual_variant
  - marker: b
    text: “Wana wa binadamu” ni usemi wa Kiebrania unaomaanisha wanadamu au jamii ya wanadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/הַנְחֵל
  choice: alipoyapa ... urithi wao
  rationale: Muundo wa Hiphil pamoja na kiambishi ב unaanzisha kishazi cha wakati na unaonyesha kuwagawia mataifa urithi; usemi huu ni wa kawaida katika Kiswahili na unadumisha maana ya ugawaji.
- source_word: עֶלְיוֹן
  choice: Aliye Juu Zaidi
  rationale: Hili ni jina la cheo la Mungu; tafsiri hii ni ya heshima, inaeleweka kwa urahisi, na inadumisha nguvu ya cheo hicho.
- source_word: גּוֹיִם
  choice: mataifa
  rationale: Hapa neno hili linarejelea mataifa mbalimbali ya ulimwengu, si hasa watu wasio Wayahudi katika utofautishaji wa baadaye wa kidini.
- source_word: בְּ/הַפְרִיד/וֹ
  choice: alipowatenganisha
  rationale: Hiki pia ni kishazi cha wakati, na kiambishi cha nafsi kinamrejelea Aliye Juu Zaidi; 'kuwatenganisha' kinatoa maana ya kawaida ya פרד.
- source_word: בְּנֵי אָדָם
  choice: wana wa Adamu
  rationale: Tafsiri hii inadumisha picha na umbo la Kiebrania, pamoja na uwezekano wa kusikia 'Adamu' kama jina, huku tanbihi ikifafanua kwamba usemi huo unawahusu wanadamu kwa ujumla.
- source_word: יַצֵּב
  choice: aliweka
  rationale: Hiphil ya יצב ina maana ya kuweka au kuthibitisha kwa uthabiti; 'aliweka' ni ya asili katika Kiswahili kuhusiana na mipaka.
- source_word: גְּבֻלֹת עַמִּים
  choice: mipaka ya makabila
  rationale: '''Mipaka'' inaonyesha utenganishaji wa maeneo, na ''makabila'' hapa hutofautisha עמים na גוים bila kurudia ''mataifa,'' huku ikirejelea jumuiya za watu.'
- source_word: לְ/מִסְפַּר
  choice: kulingana na idadi ya
  rationale: Kirai hiki kinaonyesha ulinganifu au kipimo; hii ndiyo njia ya kawaida na sahihi ya kueleza uhusiano huo kwa Kiswahili.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hili linafuata wazi usomaji wa Maandishi ya Kimasoreti uliotolewa, huku likidumisha muundo wa Kiebrania badala ya kuufasiri moja kwa moja kuwa 'Waisraeli.'
theological_decisions:
- issue: Tofauti ya maandishi katika kishazi cha mwisho
  choice: wana wa Israeli
  alternative: wana wa Mungu; au malaika wa Mungu
  rationale: Maandishi ya WLC yaliyotolewa yanasoma בני ישראל, kwa hiyo maandishi makuu yanafuata 'wana wa Israeli.' Hata hivyo, ushahidi wa Magombo ya Bahari ya Chumvi na Septuajinti una usomaji tofauti unaoathiri kwa kiasi kikubwa tafsiri ya aya; kwa hiyo umewekwa wazi katika tanbihi bila kuamua kimya-kimya mvutano huo.
- issue: Usemi wa kibinadamu בני אדם
  choice: wana wa Adamu
  alternative: wanadamu; binadamu
  rationale: Maandishi makuu yanahifadhi umbo la kishairi na la kiume la Kiebrania, lakini tanbihi inaeleza kwamba hapa usemi huo ni wa jumla kwa jamii ya wanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi, wa heshima, na unaoeleweka kwa msomaji wa kawaida. Muundo wa vishazi viwili vya wakati umehifadhiwa. Alama za tanbihi zimewekwa baada ya virai vinavyohusika.
