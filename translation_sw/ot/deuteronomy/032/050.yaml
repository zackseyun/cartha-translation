review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the command to die, the mountain setting, Aaron’s death on Mount Hor, and retains the Hebrew death idiom rather than reducing it to burial. However, the final coordinated clause needs an explicit finite verb in Swahili, and the location/directional element in the ascent clause is best retained.
  naturalness: “Na kukusanywa kwa watu wake” is not well coordinated with “alivyokufa”; it reads as an infinitival fragment. Also, “kwa watu wako/wake” can be heard as an agentive phrase (‘by your people’). “Pamoja na watu wako/wake” is natural and clearly retains the gathering idiom.
  terminology: “Aroni” and “Mlima Hori” are appropriate Standard East African Swahili biblical forms. “Kusanywa pamoja na watu wake” preserves the source idiom and its interpretive openness; the footnote appropriately supplies ‘mababu’ only as an alternative.
  issues:
  - severity: medium
    issue: The Aaron clause lacks a finite passive verb.
    rationale: The source has וַיֵּאָסֶף, ‘and he was gathered.’ Swahili “na kukusanywa” is infinitival and does not parallel “alivyokufa” properly.
  - severity: medium
    issue: “kwa watu wako/wake” is potentially agentive and weakly expresses the destination/association of the Hebrew idiom.
    rationale: In contemporary Swahili, “kusanywa kwa” commonly indicates the gatherer. “Kusanywa pamoja na watu...” clearly expresses being gathered with/to one’s people without interpreting the idiom as burial.
  - severity: low
    issue: The explicit directional adverb שָׁמָּה is omitted.
    rationale: Adding “huko” retains the source’s directional emphasis and remains intelligible in the command context.
  revised_text: na ufe juu ya mlima unaoupanda huko, na ukusanywe pamoja na watu wako[a], kama vile ndugu yako Aroni alivyokufa juu ya Mlima Hori na alikusanywa pamoja na watu wake.
  revised_footnotes:
  - marker: a
    text: Au “ukusanywe pamoja na mababu zako.” Nahau ya Kiebrania inasema kihalisi “ukusanywe kwa watu wako.”
    reason: lexical_alternative
  revision_rationale: The revision supplies the finite verb required for Aaron’s corresponding death idiom, avoids the potentially agentive reading of “kwa watu,” and restores the explicit directional element ‘there.’ The main text still preserves the Hebrew idiom without deciding whether it refers specifically to ancestors, burial, or the afterlife.
