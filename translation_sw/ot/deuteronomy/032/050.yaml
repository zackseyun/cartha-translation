source:
  edition: WLC
  text: וּ/מֻ֗ת בָּ/הָר֙ אֲשֶׁ֤ר אַתָּה֙ עֹלֶ֣ה שָׁ֔מָּ/ה וְ/הֵאָסֵ֖ף אֶל עַמֶּ֑י/ךָ כַּֽ/אֲשֶׁר מֵ֞ת אַהֲרֹ֤ן אָחִ֨י/ךָ֙ בְּ/הֹ֣ר הָ/הָ֔ר וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/050.yaml
  text: and die on the mountain that you are ascending[a], and be gathered to your people, just as Aaron your brother died on Mount Hor and was gathered to his people.
translation:
  language: sw
  text: na ufe juu ya mlima unaoupanda huko, na ukusanywe pamoja na watu wako[a], kama vile ndugu yako Aroni alivyokufa juu ya Mlima Hori na alikusanywa pamoja na watu wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukusanywe pamoja na mababu zako.” Nahau ya Kiebrania inasema kihalisi “ukusanywe kwa watu wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֻת
  choice: na ufe
  rationale: Kitenzi cha amri kutoka מות kinamwelekea Musa moja kwa moja; “na ufe” kinahifadhi muundo na uzito wa agizo bila kuongeza hali isiyotajwa.
- source_word: בָּהָר
  choice: juu ya mlima
  rationale: הַר humaanisha “mlima,” na kiambishi ב hapa kinaonyesha mahali; Kiswahili cha kawaida hutumia “juu ya mlima” katika muktadha huu.
- source_word: אֲשֶׁר אַתָּה עֹלֶה שָׁמָּה
  choice: unaoupanda
  rationale: עלה inaonyesha kwenda juu au kupanda. “Unaoupanda” ni Kiswahili cha asili kinachohifadhi mwendo wa kuelekea juu; maana ya שָׁמָּה inaeleweka katika uhusiano wa kitenzi na mlima bila kuongeza “huko” kwa namna nzito.
- source_word: וְהֵאָסֵף
  choice: kisha ukusanywe
  rationale: Nifali ya אסף ni nahau ya kifo. “Ukusanywe” huhifadhi taswira ya Kiebrania, huku “kisha” ikiwasilisha mwendelezo wa matukio kwa Kiswahili cha kawaida.
- source_word: אֶל עַמֶּיךָ
  choice: kwa watu wako
  rationale: Tafsiri hii huhifadhi kwa karibu nahau halisi “kwa watu wako” badala ya kuifasiri kwa upeo mwembamba kuwa mababu pekee.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Huonyesha wazi ulinganisho kati ya yatakayompata Musa na yaliyompata Aroni.
- source_word: מֵת
  choice: alivyokufa
  rationale: Qal timilifu inaeleza tukio lililokwisha; muundo “kama vile ... alivyokufa” ni wa asili katika Kiswahili.
- source_word: אַהֲרֹן אָחִיךָ
  choice: ndugu yako Aroni
  rationale: Mpangilio huu ni wa kawaida na wazi katika Kiswahili huku ukihifadhi uhusiano wa kindugu.
- source_word: בְּהֹר הָהָר
  choice: juu ya Mlima Hori
  rationale: הֹר ni jina la mahali linalotolewa kwa kawaida kama “Mlima Hori”; “juu ya” inalingana na mazingira ya mlima na matumizi ya awali.
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: na kukusanywa kwa watu wake
  rationale: Inarudia nahau ileile kwa Aroni ili kudumisha mshikamano wa msamiati na kutohitimisha maana yake ya kitheolojia.
theological_decisions:
- issue: Nahau ya kifo אסף אל־עמיו
  choice: Kuhifadhi katika matini kuu usemi “ukusanywe/kukusanywa kwa watu wako/wake”
  alternative: “uungane na mababu zako” au “ujiunge na jamaa zako katika kifo”
  rationale: Nahau hiyo inahusiana na kifo lakini inaweza kuwa na maana pana kuliko kuzikwa au kuwa pamoja na mababu. Tafsiri ya karibu huhifadhi utata na mvutano wa kitheolojia wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa msomaji wa leo huku ukihifadhi nahau kuu ya Kiebrania; “Mlima Hori” linafuata umbo la kawaida la jina la kibiblia.
