  to: na ufe juu ya mlima unaoupanda huko, na ukusanywe pamoja na watu wako[a], kama vile ndugu yako Aroni alivyokufa juu ya Mlima Hori na alikusanywa pamoja na watu wake.
  rationale: The revision supplies the finite verb required for Aaron’s corresponding death idiom, avoids the potentially agentive reading of “kwa watu,” and restores the explicit directional element ‘there.’ The main text still preserves the Hebrew idiom without deciding whether it refers specifically to ancestors, burial, or the afterlife.
