base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/002.yaml
  text: May my teaching fall like the rain[a]; may my speech drip like the dew, like showers upon the tender grass[b], and like abundant rain upon the green plants.
translation:
  language: sw
  text: Mafundisho yangu yadondoke kama mvua[a]; maneno yangu yatiririke kama umande, kama manyunyu juu ya nyasi changa[b], na kama mvua tele juu ya mimea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “yadondoke kwa matone”: kitenzi cha Kiebrania kinaonyesha mafundisho yakishuka kama mvua.'
    reason: lexical_alternative
  - marker: b
    text: “Manyunyu” hutafsiri neno adimu la Kiebrania ambalo huenda likamaanisha mvua nyepesi au matone ya mvua.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲרֹף
  choice: yadondoke
  rationale: Kitenzi hiki katika ushairi kinaonyesha kitu kinachoshuka kwa matone kama mvua. “Yadondoke” huhifadhi taswira hiyo kwa Kiswahili cha kawaida.
- source_word: לִקְחִי
  choice: mafundisho yangu
  rationale: Neno hili humaanisha mafundisho au maelekezo yanayotolewa na kupokelewa; “mafundisho yangu” linafaa kwa hotuba ya Musa na ni la asili katika Kiswahili.
- source_word: תִּזַּל
  choice: yatiririke
  rationale: Mzizi huu unaweza kueleza kutiririka au kudondoka. “Yatiririke” linaendana na umande na kudumisha ulinganifu wa kishairi bila kudai kuwa umande wenyewe hunyesha.
- source_word: אִמְרָתִי
  choice: maneno yangu
  rationale: Neno hili linaweza kumaanisha usemi, tamko, au neno. Wingi wa Kiswahili “maneno yangu” unatoa maana ya usemi kwa ujumla na kusomeka kwa kawaida.
- source_word: שְׂעִירִם
  choice: manyunyu ya mvua
  rationale: Hili ni neno adimu ambalo katika muktadha huu huenda likamaanisha mvua nyepesi, manyunyu, au matone ya mvua. “Manyunyu ya mvua” ni wazi na huhifadhi taswira ya mvua nyepesi.
- source_word: דֶשֶׁא
  choice: majani machanga
  rationale: Neno hili hurejelea uoto unaochipuka au majani mapya; “majani machanga” huonyesha ukuaji mpya unaopokea manyunyu.
- source_word: רְבִיבִים
  choice: mvua tele
  rationale: Neno hili hurejelea mvua nyingi au manyunyu mengi. “Mvua tele” huhifadhi wingi na pia tofauti kati yake na manyunyu yaliyotangulia.
- source_word: עֵשֶׂב
  choice: mimea ya kijani
  rationale: Neno hili ni pana kuliko nyasi pekee na hurejelea mimea au uoto. “Mimea ya kijani” ni rahisi kueleweka na huitofautisha na majani machanga katika mstari uliotangulia.
