base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/006.yaml
  text: Is this how you repay Yahweh[a], O foolish and unwise people? Is he not your Father, who created you? He made you and established you.
translation:
  language: sw
  text: Je, hivi ndivyo mnavyomlipa Yahweh, enyi watu wapumbavu msio na hekima? Je, yeye si Baba yako, aliyekuumba[a]? Yeye ndiye aliyekufanya na kukuweka imara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliyekujipatia” au “aliyekununua.” Kitenzi cha Kiebrania kinaweza kumaanisha kuumba, kujipatia, kumiliki, au kununua.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְמְלוּ
  choice: mnavyomlipa
  rationale: Kitenzi hiki kina maana ya kumrudishia mtu kulingana na matendo yake. Katika swali hili la kukemea, “mnavyomlipa” kinaonyesha jinsi Israeli anavyomrudishia Yahweh kwa aliyomtendea.
- source_word: עַם נָבָל וְלֹא חָכָם
  choice: enyi watu wapumbavu msio na hekima
  rationale: “Wapumbavu” hapa haimaanishi upungufu wa akili tu, bali upumbavu wa kimaadili; “msio na hekima” huhifadhi pia usemi hasi wa Kiebrania.
- source_word: אָבִיךָ
  choice: Baba yako
  rationale: Huhifadhi lugha ya moja kwa moja ya ubaba wa Mungu kwa Israeli na mpito wa Kiebrania kutoka wingi katika sehemu ya kwanza hadi umoja wa pamoja katika sehemu hii.
- source_word: קָּנֶךָ
  choice: aliyekuumba
  rationale: Katika muktadha huu קנה inaweza kueleweka kuwa tendo la Mungu la kumleta Israeli awepo au kumfanya kuwa wake. “Aliyekuumba” ni ya asili katika Kiswahili na inafaa sambamba na “aliyekufanya” na “kukuweka imara,” huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: עָשְׂךָ
  choice: aliyekufanya
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo la Mungu la kumfanya Israeli.
- source_word: וַיְכֹנְנֶךָ
  choice: kukuweka imara
  rationale: Huonyesha wazo la kuimarisha, kuweka katika hali thabiti, au kuanzisha kwa uthabiti bila kutumia neno lisilo la kawaida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la Kiebrania limeandikwa kwa matamshi badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Maana ya קנה kuhusu uhusiano wa Mungu na Israeli
  choice: aliyekuumba
  alternative: aliyejipatia; aliyekununua
  rationale: Kitenzi kinaweza kumaanisha kuumba, kujipatia, kumiliki, au kununua. Muktadha wa “aliyekufanya na kukuweka imara” unaunga mkono “aliyekuumba,” lakini maana za kujipatia au kununua zinawezekana na hazipaswi kufichwa.
- issue: Ubaba wa Mungu na umoja wa pamoja wa Israeli
  choice: Baba yako
  alternative: Baba yenu
  rationale: Kiebrania hubadili kutoka kitenzi cha wingi kinachowaelekea watu hadi kiambishi cha umoja kinachomwelekea Israeli kama taifa moja. “Yako” huhifadhi mabadiliko hayo na lugha ya agano bila kulipanua kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Enyi” hudumisha mwito wa moja kwa moja; “msio na hekima” ni mpangilio wa asili unaoepuka kurudia kiunganishi kisichohitajika.
