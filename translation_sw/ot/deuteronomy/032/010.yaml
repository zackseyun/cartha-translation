  text: יִמְצָאֵ֨/הוּ֙ בְּ/אֶ֣רֶץ מִדְבָּ֔ר וּ/בְ/תֹ֖הוּ יְלֵ֣ל יְשִׁמֹ֑ן יְסֹֽבְבֶ֨/נְהוּ֙ יְב֣וֹנְנֵ֔/הוּ יִצְּרֶ֖/נְהוּ כְּ/אִישׁ֥וֹן עֵינֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/010.yaml
  text: He found him in a desert land[a], and in the howling waste of the wilderness; he surrounded him, he cared for him[b], he guarded him like the pupil of his eye.
translation:
  language: sw
  text: Alimkuta katika nchi ya jangwa, na katika ukiwa wa nyika yenye vilio; akamzunguka, akamtia maanani[a], akamlinda kama mboni ya jicho lake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamfahamisha” au “akampa ufahamu.” Kitenzi cha Kiebrania kinaweza pia kumaanisha kwamba alimwangalia au alimtilia maanani kwa makini.
    reason: alternative_reading
lexical_decisions:
- source_word: יִמְצָאֵהוּ
  choice: Alimkuta
  rationale: Kitenzi מצא humaanisha ‘kupata/kukuta.’ ‘Alimkuta’ kinadumisha picha ya Mungu kumkuta Yakobo/Israeli katika mahali pasipofaa kwa maisha, bila kuongeza wazo lisilo katika maandishi.
- source_word: בְּאֶרֶץ מִדְבָּר
  choice: katika nchi ya jangwa
  rationale: Tafsiri hii inadumisha vipengele vyote viwili, אֶרֶץ ‘nchi’ na מִדְבָּר ‘jangwa/nyika,’ kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: וּבְתֹהוּ יְלֵל יְשִׁמֹן
  choice: na katika ukiwa wa nyika yenye vilio
  rationale: תֹהוּ huonyesha ukiwa au mahali pasipo na kitu, יְלֵל huleta picha ya vilio, na יְשִׁמֹן ni nyika iliyo tasa. Usemi huu unahifadhi taswira hiyo nzito ya kishairi bila kuigeuza kuwa maelezo ya moja kwa moja kuhusu upepo au wanyama.
- source_word: יְסֹבְבֶנְהוּ
  choice: akamzunguka
  rationale: סבב ni kuzunguka au kutia duara. Tafsiri halisi ‘akamzunguka’ inaacha muktadha uonyeshe kusudi la ulinzi badala ya kulifafanua ndani ya kitenzi.
- source_word: יְבֹונְנֵהוּ
  choice: akamjali kwa makini
  rationale: Kitenzi hiki kinaweza kuhusisha kuelewa, kumpa ufahamu, au kumwangalia kwa umakini. Katika mfululizo wa vitendo vya utunzaji, ‘akamjali kwa makini’ ni Kiswahili cha kawaida kinachowasilisha uangalifu wenye kutambua mahitaji, huku uwezekano wa maana nyingine ukihifadhiwa katika tanbihi.
- source_word: יִצְּרֶנְהוּ
  choice: akamlinda
  rationale: נצר humaanisha kulinda, kutunza, au kuhifadhi. ‘Akamlinda’ inafaa na taswira inayofuata ya mboni ya jicho.
- source_word: כְּאִישׁוֹן עֵינוֹ
  choice: kama mboni ya jicho lake
  rationale: אִישׁוֹן hapa ni mboni ya jicho. ‘Mboni ya jicho’ ni usemi wazi wa Kiswahili unaohifadhi taswira halisi ya Kiebrania na wazo la kitu kinacholindwa kwa uangalifu mkubwa.
theological_decisions:
- issue: Rejeleo la viambishi vya nafsi ya tatu umoja
  choice: Kudumisha umoja katika ‘alimkuta,’ ‘akamzunguka,’ ‘akamjali,’ na ‘akamlinda,’ huku Yakobo/Israeli akiwakilisha taifa kwa umoja wa kishairi.
  alternative: Kutumia wingi kana kwamba viambishi vinawahusu Waisraeli mmoja mmoja.
  rationale: Kiebrania kina viambishi vya kiume umoja, na muktadha wa Wimbo wa Musa unamtaja Yakobo/Israeli kama nafsi moja inayowakilisha taifa. Kiswahili kinaweza kudumisha picha hiyo bila kuamua kama rejeleo ni Yakobo binafsi au Israeli kwa pamoja.
- issue: Maana ya יְבֹונְנֵהוּ
  choice: akamjali kwa makini
  alternative: akampa ufahamu
  rationale: Muktadha unaunganisha kitenzi hiki na kuzunguka na kulinda, hivyo maana ya uangalifu wenye kujali inafaa. Hata hivyo, maana ya kumpa ufahamu ni uwezekano halisi wa kileksika na imeonyeshwa katika tanbihi badala ya kufutwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Nyika yenye vilio’ inadumisha ukali na utata wa taswira ya Kiebrania; haifafanui chanzo cha vilio ambacho maandishi hayakitaji. Viambishi vya umoja vinahifadhi uhusika wa kishairi wa Yakobo/Israeli.
