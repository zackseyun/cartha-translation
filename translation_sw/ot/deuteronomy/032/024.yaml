  text: wasted by famine[a], consumed by plague and bitter destruction; I will send against them the fangs of beasts[c][b], with the venom of things that crawl in the dust.
translation:
  language: sw
  text: 'Wamedhoofishwa na njaa,

    wameteketezwa na tauni[a]

    na maangamizi machungu.

    Nitawapelekea dhidi yao meno ya wanyama[b],

    pamoja na sumu ya viumbe vitambaavyo katika mavumbi.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “homa kali.” Neno la Kiebrania רֶשֶׁף huenda pia likadokeza Resheph, jina la mungu aliyehusishwa na tauni katika Mashariki ya Karibu ya kale.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “jino la wanyama”; umoja wa Kiebrania unaweza kutumiwa kwa maana ya kijumla.
    reason: lexical_alternative
  - marker: c
    text: Kishazi cha Kiebrania ni kipana; kinahusu viumbe wanaotambaa ardhini, wakiwemo huenda nyoka.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזֵי רָעָב
  choice: Wamedhoofishwa kwa njaa
  rationale: מְזֵי huonyesha watu waliokonda au kuishiwa nguvu. “Wamedhoofishwa” ni Kiswahili cha kawaida kinachoeleza athari ya njaa bila kuongeza picha ya kitabibu isiyobainishwa.
- source_word: לְחֻמֵי
  choice: wameteketezwa
  rationale: Umbo hili adimu lina maana ya kuliwa au kumalizwa kabisa. “Wameteketezwa” linaonyesha uharibifu kamili na linafuatana kwa kawaida na tauni.
- source_word: רֶשֶׁף
  choice: tauni
  rationale: Neno linaweza kumaanisha pigo lenye joto au ugonjwa wa kuambukiza, na huenda pia likadokeza jina Resheph. Katika orodha hii ya hukumu, “tauni” linafikisha maana ya kawaida bila kulifanya jina maalumu.
- source_word: קֶטֶב מְרִירִי
  choice: maangamizi machungu
  rationale: קֶטֶב ni nguvu au pigo la kuangamiza, na מְרִירִי humaanisha “chungu.” Tafsiri hii inatofautisha kishazi hiki na רֶשֶׁף na kuhifadhi taswira ya uchungu.
- source_word: שֶׁן בְּהֵמוֹת
  choice: meno ya wanyama
  rationale: שֶׁן ni “jino/meno,” na בְּהֵמוֹת ni wanyama kwa upana. Tafsiri halisi kiasi huhifadhi picha ya mashambulizi ya wanyama bila kubana maana kuwa ni wanyama wa aina fulani tu.
- source_word: אֲשַׁלַּח בָּם
  choice: Nitawaachilia ... dhidi yao
  rationale: Kitenzi kinaeleza kutuma kitu juu ya watu au dhidi yao. “Nitawaachilia ... dhidi yao” ni cha kishairi na kinaonyesha wazi nguvu inayotumwa kuwadhuru.
- source_word: חֲמַת
  choice: sumu
  rationale: Ingawa neno linaweza kumaanisha ghadhabu au joto, linapotumiwa kuhusu viumbe watambaao humaanisha sumu; “sumu” ni neno la kawaida na pana.
- source_word: זֹחֲלֵי עָפָר
  choice: viumbe vitambaavyo mavumbini
  rationale: Kishazi hiki kinahusu viumbe wanaotambaa ardhini, huenda wakiwemo nyoka. Tafsiri hii inahifadhi upana na taswira ya Kiebrania.
theological_decisions:
- issue: Uwezekano wa רֶשֶׁף kuwa na usuli wa jina la mungu wa kale
  choice: Limetafsiriwa kama nomino ya kawaida, “tauni.”
  alternative: Resheph; au “homa kali”
  rationale: Muktadha unaorodhesha mapigo ya hukumu katika lugha ya kishairi. Maana ya kawaida inafaa zaidi hapa, huku tanbihi ikihifadhi uwezekano wa maana nyingine bila kuingiza dai la kimitholojia lisilolazimishwa na mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wenye heshima lakini unaoeleweka kwa wasomaji wa kawaida. Mistari imepangwa ili kuhifadhi ulinganifu wa shairi la Kiebrania. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika.
