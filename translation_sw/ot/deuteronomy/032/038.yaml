base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/038.yaml
  text: who ate the fat of their sacrifices and drank the wine of their drink offerings—let them rise up and help you; let them be your shelter.
translation:
  language: sw
  text: wale waliokula mafuta ya dhabihu zao na kunywa divai ya sadaka zao za kinywaji? Wainuke, wawasaidie; wawe kimbilio lenu!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵלֶב זְבָחֵימוֹ
  choice: mafuta ya dhabihu zao
  rationale: Huhifadhi taswira halisi ya sehemu bora au nono ya dhabihu zilizotolewa kwa miungu hiyo.
- source_word: יֵין נְסִיכָם
  choice: divai ya sadaka zao za kinywaji
  rationale: Neno נֶסֶךְ hapa linamaanisha kinywaji kilichomiminwa kama sadaka; usemi huu ni wazi na wa kawaida katika Kiswahili cha Biblia.
- source_word: יָק֨וּמוּ֙
  choice: waondoke
  rationale: Katika muktadha huu kitenzi kina maana ya kuinuka na kuchukua hatua, si kubadili tu mkao wa mwili.
- source_word: סִתְרָה
  choice: makao
  rationale: Neno hilo huonyesha mahali pa kujisitiri au kujificha; “makao” huhifadhi taswira ya ulinzi bila kulazimisha maana ya ngome.
theological_decisions:
- issue: Wahusika wa vitenzi vya wingi
  choice: Miungu iliyokula dhabihu na kunywa sadaka ndiyo inayoamriwa kuondoka na kusaidia.
  alternative: Kuchukulia vitenzi kuwa vinawarejelea waabudu au watu wengine.
  rationale: Muktadha wa mistari 37–38 ni kejeli dhidi ya miungu ambayo watu waliitegemea; viwakilishi vya wingi vinaendelea kuirejelea.
- issue: Nguvu ya sentensi ya mwisho
  choice: wawe makao yenu!
  alternative: na wawe makao yenu
  rationale: יְהִי ni kauli ya kutaka au kuamuru katika changamoto ya kejeli; alama ya mshangao huwasilisha nguvu hiyo bila kuongeza maelezo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kejeli na changamoto umehifadhiwa; wingi wa “wao” unaonyesha miungu inayotajwa katika muktadha.
