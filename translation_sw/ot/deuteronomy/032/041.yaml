  text: when I sharpen the lightning of my sword, and my hand takes hold of judgment, I will return vengeance on my adversaries, and I will repay those who hate me.
translation:
  language: sw
  text: 'Nitakaponoa upanga wangu unaometameta kama umeme,

    na mkono wangu ukashika hukumu,

    nitawarudishia adui zangu kisasi,

    nami nitawalipa wanaonichukia.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Nitakaponoa
  rationale: Ingawa אִם kwa kawaida huweza kumaanisha ‘ikiwa,’ katika muundo huu wa kishairi unaoendelea kutoka mstari uliotangulia inaeleza wakati hatua itakapofanyika; ‘nitakapo-’ hudumisha uhusiano huo bila kuifanya kuwa sharti lenye mashaka.
- source_word: בְּרַק חַרְבִּי
  choice: upanga wangu unaometameta kama umeme
  rationale: Kirai halisi ni ‘umeme wa upanga wangu.’ Tafsiri hii huhifadhi taswira ya mwanga mkali wa upanga huku ikisikika kwa kawaida katika Kiswahili.
- source_word: וְתֹאחֵז בְּמִשְׁפָּט יָדִי
  choice: na mkono wangu ukashika hukumu
  rationale: Huhifadhi sitiari ya mkono kushika hukumu badala ya kuifafanua tu kuwa kutekeleza haki.
- source_word: אָשִׁיב נָקָם לְצָרָי
  choice: nitawalipiza kisasi adui zangu
  rationale: Huwasilisha tendo la kulipiza kisasi dhidi ya wapinzani kwa Kiswahili cha kawaida; ‘adui zangu’ linafaa kwa צָרַי katika muktadha huu.
- source_word: וְלִמְשַׂנְאַי אֲשַׁלֵּם
  choice: nami nitawalipa wanaonichukia
  rationale: ‘Nitawalipa’ huhifadhi wazo la malipo yanayolingana na matendo yao, bila kuongeza maelezo yasiyomo katika chanzo.
theological_decisions:
- issue: Hukumu na kisasi cha Mungu
  choice: Neno ‘kisasi’ limedumishwa sambamba na ‘hukumu.’
  alternative: Kufasiri kwa upole kama ‘kuwaadhibu’ au ‘kuwatendea haki.’
  rationale: Chanzo hutumia נָקָם waziwazi. Kudumisha ‘kisasi’ kunaacha uzito na mvutano wa kiteolojia wa mstari bila kuupunguza au kuuingiza katika mfumo wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi na chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mistari minne inadumisha usambamba wa shairi la Kiebrania.
