  naturalness: Kiswahili cha rasimu ni cha kawaida na usambamba wa mistari unafanya kazi vizuri. “Kama si kwamba” ni mtiririko wa karibu zaidi wa “unless” kuliko “kama si kwa sababu” katika sentensi hii, na huacha muundo wa chanzo wazi.
  terminology: “Mwamba wao” na “Yahweh” ni sahihi kwa matumizi ya kimajina/sitiari katika muktadha huu. “Kuwafukuza” na “kuwafanya ... wakimbie” hutoa maana ya vita na causative ya נוּס kwa ufasaha.
