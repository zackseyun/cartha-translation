  text: אֵיכָ֞ה יִרְדֹּ֤ף אֶחָד֙ אֶ֔לֶף וּ/שְׁנַ֖יִם יָנִ֣יסוּ רְבָבָ֑ה אִם לֹא֙ כִּי צוּרָ֣/ם מְכָרָ֔/ם וַֽ/יהוָ֖ה הִסְגִּירָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/030.yaml
  text: How could one pursue a thousand[a], and two put ten thousand to flight, unless their Rock had sold them, and Yahweh had given them up?
translation:
  language: sw
  text: 'Mtu mmoja angewezaje kuwafukuza elfu moja,

    na watu wawili kuwafanya elfu kumi wakimbie,

    kama si kwamba Mwamba wao alikuwa amewauza,

    na Yahweh alikuwa amewakabidhi?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa amewasalimisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: angewezaje
  rationale: Huleta nguvu ya swali la mshangao lisilotarajia jibu, kwa Kiswahili cha kawaida.
- source_word: יִרְדֹּף
  choice: kuwafukuza
  rationale: Katika muktadha wa vita, kitenzi hiki kina maana ya kuwafuatilia au kuwafukuza maadui.
- source_word: אֶחָד אֶלֶף
  choice: mtu mmoja ... watu elfu moja
  rationale: Huhifadhi tofauti kubwa ya idadi iliyo katika Kiebrania, huku ‘watu’ ikiweka wazi kwamba hesabu inawahusu wapiganaji.
- source_word: וּשְׁנַיִם
  choice: na watu wawili
  rationale: Huhifadhi ulinganifu wa mstari wa pili na kufanya rejeo la watu lieleweke wazi.
- source_word: יָנִיסוּ
  choice: kuwafanya ... wakimbie
  rationale: Huhifadhi hali ya kusababisha iliyo katika umbo la Hiphil la נוּס.
- source_word: רְבָבָה
  choice: elfu kumi
  rationale: Hii ndiyo thamani ya kawaida ya namba hiyo hapa na inaeleweka kwa urahisi katika Kiswahili.
- source_word: אִם לֹא כִּי
  choice: kama si kwa sababu
  rationale: Hutoa maelezo pekee ya hali hiyo ya kushangaza na kuwasilisha nguvu ya sharti na sababu kwa Kiswahili asilia.
- source_word: צוּרָם
  choice: Mwamba wao
  rationale: ‘Mwamba’ ni sitiari na jina la kumtaja Mungu katika Wimbo wa Musa; herufi kubwa inaonyesha matumizi hayo bila kuondoa sitiari.
- source_word: מְכָרָם
  choice: alikuwa amewauza
  rationale: Huhifadhi moja kwa moja sitiari ya kuuza inayotumiwa kwa hukumu ya agano na kuwakabidhi watu kwa maadui.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Huwakilisha moja kwa moja jina la agano יהוה lililo katika maandishi ya Kiebrania.
- source_word: הִסְגִּירָם
  choice: alikuwa amewaacha mikononi mwa adui
  rationale: Katika muktadha huu kitenzi kinamaanisha kuwaacha au kuwatia katika mamlaka ya mwingine; kutaja ‘mikononi mwa adui’ hufanya maana hiyo iwe ya kawaida na wazi kwa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yanatumia jina la agano moja kwa moja; ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: צוּר kama sitiari ya Mungu
  choice: Mwamba wao
  alternative: mwamba wao
  rationale: Katika Wimbo wa Musa neno hili linamtaja Mungu wa Israeli kisitiari. Herufi kubwa husaidia kuonyesha matumizi ya kijina huku sitiari yenyewe ikibaki.
- issue: Wahusika wa kiwakilishi ‘wao’
  choice: Hawakutajwa upya kwa jina
  alternative: Israeli
  rationale: Kiebrania kinatumia viwakilishi; kutotaja ‘Israeli’ moja kwa moja hapa huhifadhi muundo na kutegemea muktadha kama chanzo kinavyofanya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa mistari umehifadhi usambamba wa kishairi. ‘Watu’ imeongezwa baada ya namba ili sentensi isikike asilia na rejeo la wapiganaji liwe wazi.
