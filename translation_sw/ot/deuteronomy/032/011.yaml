base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/011.yaml
  text: Like an eagle that stirs up its nest[a], that hovers over its young, he spreads out his wings, takes him[c][b], and carries him on his pinions.
translation:
  language: sw
  text: 'Kama tai[a] anavyokichochea kiota chake,

    anavyopepea juu ya makinda yake,[b]

    hutandaza mabawa yake, humchukua,

    na humbeba juu ya manyoya yake makubwa ya kurukia.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tumbusi,” kwa kuwa neno la Kiebrania נֶשֶׁר linaweza kumaanisha ndege mkubwa anayekula mizoga au ndege mkubwa wa kuwinda aliye kama tai.
    reason: lexical_alternative
  - marker: b
    text: Au “anayepepea-pepea juu ya makinda yake” au “anayaatamia kwa kuyakinga.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, manyoya makubwa ya nje ya bawa yanayotumiwa kuruka; kwa maana ya jumla zaidi, “mabawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּנֶשֶׁר
  choice: Kama tai
  rationale: Neno נֶשֶׁר humaanisha ndege mkubwa wa kuwinda au anayekula mizoga. “Tai” ni neno la kawaida na lenye nguvu katika taswira hii; uwezekano wa “tumbusi” umehifadhiwa katika tanbihi.
- source_word: יָעִיר קִנּוֹ
  choice: anayekichochea kiota chake
  rationale: Hiphil ya עור ina wazo la kuamsha au kuchochea. “Kukichochea kiota” huhifadhi kiota kama yambwa wa kitenzi na kueleza tendo la ndege mzazi kuamsha shughuli humo bila kuongeza kusudi lisilotajwa.
- source_word: עַל גּוֹזָלָיו יְרַחֵף
  choice: anayepepea juu ya makinda yake
  rationale: רחף huonyesha mwendo wa kupepea au kuelea angani. “Kupepea juu ya” ni Kiswahili cha kawaida kinachohifadhi mwendo na taswira ya uangalizi; “makinda” ni watoto wa ndege.
- source_word: יִפְרֹשׂ כְּנָפָיו
  choice: yeye hutandaza mabawa yake
  rationale: פרש ni kutandaza au kunyoosha. Kiwakilishi “yeye” kinaendeleza kwa kawaida mpito wa kishairi kutoka kwa mfano wa tai kuelekea kwa mhusika wa kiume anayerejelewa katika muktadha.
- source_word: יִקָּחֵהוּ
  choice: humchukua
  rationale: לקח kwa kawaida ni “kuchukua.” Kiambishi cha yambwa cha umoja wa kiume kimehifadhiwa kwa “-m-,” kikimtaja kinda mmoja au, katika matumizi ya mfano, Israeli.
- source_word: יִשָּׂאֵהוּ
  choice: kumbeba
  rationale: נשא hapa hueleza kubeba kimwili; “kumbeba” ni ya kawaida na huhifadhi yambwa wa umoja.
- source_word: עַל אֶבְרָתוֹ
  choice: juu ya manyoya yake makubwa ya mabawa
  rationale: אֶבְרָה huelekea kumaanisha manyoya makubwa ya kurukia au sehemu yenye nguvu ya bawa. Tafsiri hii inaeleweka kuliko istilahi adimu na inadumisha tofauti na כָּנָף, iliyotafsiriwa “mabawa” katika mstari uliotangulia.
theological_decisions:
- issue: Mpito wa viwakilishi ndani ya mfano
  choice: Kuhifadhi mhusika wa kiume kwa “yeye ... yake ... humchukua ... kumbeba” katika nusu ya pili
  alternative: Kuendeleza taswira ya ndege bila kusisitiza mpito, kwa kutumia tu miundo ya kawaida ya tai
  rationale: Vitenzi vya Kiebrania ni vya umoja wa kiume, na katika muktadha tai anamwakilisha BWANA anayemtunza Israeli. “Yeye” huhifadhi mwendo wa kishairi kuelekea kwa anayelengwa na mfano bila kumtaja moja kwa moja au kuondoa uwezekano wa kuisoma sentensi nzima kama taswira ya ndege.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mistari imepangwa kulingana na vifungu vya ushairi wa Kiebrania. “Makinda” ni neno sahihi na linalotambulika kwa watoto wa ndege; “manyoya makubwa ya mabawa” huepuka istilahi ya kitaalamu isiyo ya kawaida huku ikihifadhi tofauti ya msamiati wa chanzo.
