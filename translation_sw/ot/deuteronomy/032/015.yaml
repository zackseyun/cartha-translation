  text: וַ/יִּשְׁמַ֤ן יְשֻׁרוּן֙ וַ/יִּבְעָ֔ט שָׁמַ֖נְתָּ עָבִ֣יתָ כָּשִׂ֑יתָ וַ/יִּטֹּשׁ֙ אֱל֣וֹהַ עָשָׂ֔/הוּ וַ/יְנַבֵּ֖ל צ֥וּר יְשֻׁעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/015.yaml
  text: But Jeshurun grew fat and kicked; you grew fat[a], thick, and sleek. Then he forsook God who made him and treated with contempt the Rock of his salvation.
translation:
  language: sw
  text: 'Lakini Yeshuruni alinenepa, akapiga teke;

    ulinenepa, ukawa mnene, ukajaa mafuta[a].

    Kisha akamwacha Mungu aliyemuumba,

    na akamdharau Mwamba wa wokovu wake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda, “ukafunikwa na mafuta” au “ukavimba kwa unene.” Neno la Kiebrania ni adimu, na maana yake kamili haina uhakika, ingawa picha ya kulishwa kupita kiasi iko wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשֻׁרוּן
  choice: Yeshuruni
  rationale: Jina au lakabu ya kishairi ya Israeli limenakiliwa kwa sauti badala ya kutafsiriwa kama “Mnyofu,” ili kuhifadhi nguvu yake ya kishairi bila kulifasiri kupita kiasi.
- source_word: וַיִּשְׁמַן
  choice: alinenepa
  rationale: Kitenzi kina maana halisi ya kunenepa; picha ya ustawi uliosababisha kujitosheleza imehifadhiwa badala ya kubadilishwa moja kwa moja kuwa “alifanikiwa.”
- source_word: וַיִּבְעָט
  choice: akapiga teke
  rationale: Tafsiri halisi inadumisha picha dhahiri ya mnyama aliyelishwa vizuri kisha akawa mkaidi, badala ya kuifupisha kuwa “aliasi.”
- source_word: שָׁמַנְתָּ
  choice: ulinenepa
  rationale: Nafsi ya pili umoja imehifadhiwa ili kuonyesha mgeuko wa kishairi kutoka simulizi kwenda shtaka la moja kwa moja.
- source_word: עָבִיתָ
  choice: ukawa mnene
  rationale: Kauli hii inaendeleza picha ya mwili uliolishwa kupita kiasi kwa Kiswahili cha kawaida na kinachoeleweka.
- source_word: כָּשִׂיתָ
  choice: ukanawiri[a]
  rationale: Neno hili adimu linaendeleza picha ya unene na hali ya kulishwa kupita kiasi, lakini maana yake kamili haina uhakika. “Ukanawiri” ni ya asili katika Kiswahili na inaacha maelezo mbadala katika tanbihi.
- source_word: וַיִּטֹּשׁ
  choice: akamwacha
  rationale: Kauli hii ya sasa na ya kawaida inaonyesha kuachana kwa kutokuwa mwaminifu bila kutumia lugha ya kizamani.
- source_word: אֱלוֹהַ עָשָׂהוּ
  choice: Mungu aliyemuumba
  rationale: Inahifadhi muundo wa kishazi tegemezi na kumtambulisha Mungu kuwa Muumba wa Israeli.
- source_word: וַיְנַבֵּל
  choice: akamdharau
  rationale: Kitenzi hiki kinaonyesha kumtendea mtu kama asiye na thamani au wa kudharauliwa; “akamdharau” ni fupi, wazi, na yenye nguvu.
- source_word: צוּר
  choice: Mwamba
  rationale: “Mwamba” imehifadhiwa kama sitiari ya Mungu inayojirudia katika Wimbo wa Musa; herufi kubwa inaonyesha matumizi yake kama lakabu ya Mungu.
- source_word: יְשֻׁעָתוֹ
  choice: wokovu wake
  rationale: “Wokovu” huhifadhi uzito wa maana ya kuokoa au kukomboa unaobebwa na nomino hii katika muktadha.
theological_decisions:
- issue: Mgeuko kutoka nafsi ya tatu kwenda nafsi ya pili na kurudi nafsi ya tatu
  choice: 'Mgeuko umehifadhiwa: “Yeshuruni alinenepa ... ulinenepa ... akamwacha Mungu.”'
  alternative: Kusawazisha mstari wote uwe katika nafsi ya tatu.
  rationale: Mabadiliko ya nafsi katika Kiebrania yanaongeza nguvu ya shtaka la moja kwa moja na hayapaswi kulainishwa.
- issue: Sitiari ya Mungu צוּר
  choice: “Mwamba” kama lakabu na sitiari ya Mungu
  alternative: “mwamba” kama nomino ya kawaida au kuifafanua kuwa “mlinzi.”
  rationale: Katika Kumbukumbu la Torati 32, Mwamba ni jina la kisitiari linalojirudia kwa Mungu wa Israeli; kuhifadhi sitiari huepuka kuondoa mvutano wake wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa mistari unadumisha usambamba wa shairi na mgeuko wa nafsi uliomo katika Kiebrania.
