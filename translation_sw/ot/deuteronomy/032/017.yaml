base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/017.yaml
  text: They sacrificed to demons[a], not God, to gods they had not known, new ones that had recently come[c][b], whom your fathers had not feared.
translation:
  language: sw
  text: Walitoa dhabihu kwa mashetani, si kwa Mungu[a], kwa miungu ambayo hawakuwa wameijua, miungu mipya iliyokuja hivi karibuni[b], ambayo baba zenu hawakuwa wameiogopa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “si kwa mungu.” Kiebrania kinaweza kueleweka kuwa kinakanusha kwamba viumbe hao walikuwa miungu ya kweli, ingawa muktadha unawatofautisha hasa na Mungu wa Israeli.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya neno kwa neno, “mipya, ilikuja kutoka karibu”; maana yake ni miungu iliyowasili au kuanza kuabudiwa majuzi.
    reason: lexical_alternative
  - marker: c
    text: Au, “ambayo baba zenu hawakuwa wametetemeka mbele ya miungu hiyo.” Kitenzi cha Kiebrania kinaweza kuonyesha kutetemeka kwa hofu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְבְּחוּ
  choice: Walitoa dhabihu
  rationale: Kitenzi זבח kinamaanisha kuchinja au kutoa dhabihu katika ibada. Kauli hii ni ya kawaida na inadumisha maana ya kiibada.
- source_word: לַשֵּׁדִים
  choice: kwa mashetani
  rationale: שֵׁדִים humaanisha viumbe vya kishetani; “mashetani” inaeleweka wazi kwa wasomaji wa Kiswahili cha sasa.
- source_word: לֹא אֱלֹהַ
  choice: si kwa Mungu
  rationale: Katika muktadha huu maneno hayo yanatofautisha waliopokea dhabihu na Mungu wa kweli wa Israeli. Kihusishi “kwa” kimerudiwa ili sentensi iwe wazi na ya kawaida katika Kiswahili.
- source_word: אֱלֹהִים
  choice: kwa miungu
  rationale: Wingi אֱלֹהִים hapa unawataja tena wale mashetani kama miungu iliyoabudiwa, bila kuthibitisha kuwa wao ni Mungu wa kweli.
- source_word: לֹא יְדָעוּם
  choice: ambayo hawakuwa wameijua
  rationale: ידע pamoja na kiambishi cha yambwa humaanisha “kujua.” Wakati timilifu wa Kiswahili unaonyesha kuwa hawakuwa wameijua hapo awali.
- source_word: חֲדָשִׁים
  choice: miungu mipya
  rationale: Kivumishi cha Kiebrania kimetumiwa kama nomino. Kurudia “miungu” kwa Kiswahili kunafanya rejeo liwe wazi huku maana ya “mipya” ikihifadhiwa.
- source_word: מִקָּרֹב בָּאוּ
  choice: iliyokuja hivi karibuni
  rationale: Kirai hiki kinaonyesha kuja kwao katika wakati wa karibu, yaani walikuwa wameanza kujulikana au kuabudiwa majuzi.
- source_word: לֹא שְׂעָרוּם
  choice: ambayo baba zenu hawakuwa wameiogopa
  rationale: Mzizi adimu שער/שׂער katika muktadha huu una wazo la kuogopa au kutetemeka kwa hofu. “Kuogopa” ni tafsiri ya kawaida isiyopanua maana kupita kiasi.
- source_word: אֲבֹתֵיכֶם
  choice: baba zenu
  rationale: Neno la Kiebrania ni wingi wa kiume na linawahusu mababa wa kale wa Israeli; “baba zenu” linahifadhi umbo hilo moja kwa moja.
theological_decisions:
- issue: Uhusiano kati ya “mashetani” na “miungu”
  choice: 'Maneno yote mawili yamedumishwa kwa mfuatano: “kwa mashetani ... kwa miungu.”'
  alternative: Kulainisha sentensi kwa kuacha neno “miungu,” au kutafsiri kama “viumbe vya kiroho.”
  rationale: Kiebrania kinatumia שֵׁדִים na אֱלֹהִים kwa makusudi huku kikikanusha kwamba waliopokea dhabihu walikuwa Mungu wa kweli. Kudumisha maneno yote mawili kunahifadhi mvutano na ukali wa hoja.
- issue: Maana ya אֱלֹהַ baada ya ukanushaji
  choice: “si kwa Mungu”
  alternative: “si kwa mungu” au “si kwa mungu yeyote”
  rationale: Muktadha unalinganisha ibada ya miungu mipya na Mungu wa kweli wa Israeli. Hata hivyo, uwezekano wa kisarufi wa “si mungu” umeonyeshwa katika tanbihi badala ya kufutwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Dhabihu,” “mashetani,” na “miungu” ni istilahi zinazotambulika sana. Muundo wa marudio umehifadhiwa kwa sababu unaakisi msisitizo wa Kiebrania.
