lexical_decisions:
- source_word: יַקְנִאֻהוּ
  choice: Walimfanya awe na wivu
  rationale: Hifili ya קנא yenye kiambishi cha yambwa cha nafsi ya tatu umoja ina maana ya kusababisha wivu au ari ndani yake. Usemi huu huhifadhi lugha ya kibinadamu inayotumiwa kueleza uhusiano wa agano.
- source_word: בְּזָרִים
  choice: kwa miungu ya kigeni
  rationale: זָרִים humaanisha kihalisi ‘wageni’ au ‘vitu vya kigeni.’ Hapa muktadha wa ibada na ulinganifu na ‘machukizo’ unaonyesha kuwa wanaorejelewa ni miungu ya kigeni; tanbihi inahifadhi usemi halisi na uwezekano wa kutotaja ‘miungu’ waziwazi.
- source_word: בְּתוֹעֵבֹת
  choice: kwa machukizo
  rationale: תּוֹעֵבָה hurejelea vitu vinavyochukiza sana, hasa katika muktadha wa ibada ya sanamu. ‘Machukizo’ ni neno lenye uzito linalofaa shutuma hii ya agano.
- source_word: יַכְעִיסֻהוּ
  choice: walimkasirisha
  rationale: Hifili ya כעס ina maana ya kusababisha hasira au kuchochea hasira. ‘Walimkasirisha’ ni Kiswahili cha kawaida kinachowasilisha nguvu ya kisababishi bila kuwa kizito isivyo lazima.
theological_decisions:
- issue: Ikiwa kitu kinachodokezwa katika בְּזָרִים kitajwe wazi kuwa miungu
  choice: Kutaja ‘miungu ya kigeni’ katika matini kuu
  alternative: ‘wageni’ au ‘vitu vya kigeni’
  rationale: Ingawa neno ‘miungu’ halipo wazi katika Kiebrania, muktadha wa ibada ya sanamu katika mistari inayozunguka na ‘machukizo’ katika mshororo wa pili huifanya maana hiyo iwe wazi. Kiswahili ‘kwa wageni’ kingeweza kueleweka kuwa watu wa mataifa mengine, hivyo matini kuu inaweka maana ya kimuktadha huku tanbihi ikihifadhi hali halisi na utata wa usemi wa Kiebrania.
