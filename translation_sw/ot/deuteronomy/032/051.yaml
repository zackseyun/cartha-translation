  text: עַל֩ אֲשֶׁ֨ר מְעַלְתֶּ֜ם בִּ֗/י בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/מֵֽי מְרִיבַ֥ת קָדֵ֖שׁ מִדְבַּר צִ֑ן עַ֣ל אֲשֶׁ֤ר לֹֽא קִדַּשְׁתֶּם֙ אוֹתִ֔/י בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/051.yaml
  text: because you acted unfaithfully against me among the sons of Israel at the waters of Meribath-kadesh[a], in the wilderness of Zin[c][b], because you did not treat me as holy among the sons of Israel.
translation:
  language: sw
  text: kwa sababu mlikosa uaminifu dhidi yangu katikati ya wana wa Israeli[a], katika maji ya Meriba-Kadeshi[b], katika nyika ya Sini, kwa sababu hamkuniheshimu kama mtakatifu[c] katikati ya wana wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.”
    reason: lexical_alternative
  - marker: b
    text: “Meriba-Kadeshi” pia inaweza kutafsiriwa “Meriba ya Kadeshi” au, kwa karibu zaidi, “maji ya ugomvi wa Kadeshi.”
    reason: lexical_alternative
  - marker: c
    text: Au, “hamkunitakasa” au “hamkudhihirisha utakatifu wangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַלְתֶּם בִּי
  choice: mlikosa uaminifu kwangu
  rationale: Kitenzi מעל pamoja na ב kinaonyesha kuvunja uaminifu kwa Mungu. Usemi huu ni wa kawaida katika Kiswahili na unadumisha uzito wa kosa la kidini na la kiagano bila kutumia istilahi ngumu.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: katikati ya wana wa Israeli
  rationale: Tafsiri hii inadumisha maana ya בְּתוֹךְ, muundo halisi wa ‘wana wa Israeli,’ na kurudiwa kwa kirai hicho katika Kiebrania.
- source_word: בְּמֵי מְרִיבַת קָדֵשׁ
  choice: kwenye maji ya Meriba ya Kadeshi
  rationale: Kirai kinatambuliwa kama jina la mahali na la tukio. ‘Meriba ya Kadeshi’ ni umbo la kawaida la jina, huku tanbihi ikihifadhi maana ya neno מריבה.
- source_word: מִדְבַּר צִן
  choice: katika nyika ya Sini
  rationale: ‘Nyika’ ni neno la kawaida na lenye hadhi kwa eneo kame lisilokaliwa sana; ‘Sini’ ni unukuzi wa jina צִן unaoeleweka katika mapokeo ya Kiswahili.
- source_word: לֹא קִדַּשְׁתֶּם אֹתִי
  choice: hamkuniheshimu kama mtakatifu
  rationale: 'Hii inaeleza maana ya piel ya קדשׁ hapa: kutomtendea au kutomwonyesha Mungu kuwa mtakatifu mbele ya watu. Pia huepuka kudokeza kwamba Mungu alipungukiwa na utakatifu wa asili.'
theological_decisions:
- issue: Jinsi ya kutafsiri בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Muundo uliochaguliwa unafuata kwa karibu Kiebrania na kudumisha urudiaji wa maneno, huku tanbihi ikitoa jina la kawaida la taifa kwa Kiswahili.
- issue: Maana ya קִדַּשְׁתֶּם אֹתִי
  choice: hamkuniheshimu kama mtakatifu
  alternative: hamkunitakasa; hamkudhihirisha utakatifu wangu
  rationale: Muktadha unahusu kushindwa kwa Musa na Haruni kumheshimu Mungu hadharani kama mtakatifu, si kuongeza au kupunguza utakatifu wake wa asili. Chaguo hili linahifadhi maana ya kimahusiano na ya hadharani bila kuondoa uwezekano wa tafsiri rasmi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye hadhi na unaosomeka kwa urahisi. Muundo wa sababu mbili na marudio ya ‘katikati ya wana wa Israeli’ yamedumishwa kwa sababu yanaakisi msisitizo wa maandishi ya Kiebrania.
