  yaml_path: translation/ot/deuteronomy/032/009.yaml
  text: For Yahweh’s portion is his people[a], Jacob the share of his inheritance.
translation:
  language: sw
  text: Kwa maana sehemu ya Yahweh ni watu wake; Yakobo ni fungu[a] la urithi wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Yakobo ni kamba ya kupimia ya urithi wake,” au “Yakobo ni sehemu iliyogawiwa ya urithi wake.” Neno la Kiebrania חֶבֶל linaweza kumaanisha kamba ya kupimia na, kwa upanuzi, eneo au fungu lililopimwa na kugawiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au ufafanuzi wa kauli iliyotangulia, na “Kwa maana” kinaendeleza uhusiano huo kwa Kiswahili cha kawaida.
- source_word: חֵלֶק
  choice: sehemu
  rationale: Neno hili humaanisha sehemu au fungu analopewa mtu; “sehemu” linafaa katika picha ya kugawanya urithi na linatofautishwa kwa kiasi na חֶבֶל katika mstari wa pili.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu lililo katika Kiebrania limetolewa moja kwa moja kama “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: עַמּוֹ
  choice: watu wake
  rationale: “Watu wake” linaonyesha uhusiano wa Yahweh na jamii yake ya agano kwa lugha ya kawaida na sahihi.
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Jina la ukoo “Yakobo” limehifadhiwa kama lilivyo katika maandishi na katika usambamba wa kishairi, bila kulibadilisha kwa ufafanuzi kuwa “Israeli.”
- source_word: חֶבֶל
  choice: fungu
  rationale: Katika muktadha huu neno linaweza kumaanisha kamba ya kupimia na, kwa upanuzi, eneo au fungu lililopimwa na kugawiwa. “Fungu” ni la asili katika Kiswahili na linafaa katika usambamba na “sehemu” na “urithi,” huku tanbihi ikihifadhi picha halisi.
- source_word: נַחֲלָתוֹ
  choice: urithi wake
  rationale: “Urithi” huhifadhi wazo la milki inayorithiwa au inayomilikiwa, ambalo ni muhimu katika taswira ya mstari huu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu; “Yahweh” hulihifadhi wazi bila kulibadilisha kuwa cheo.
- issue: Kama Yakobo afafanuliwe moja kwa moja kuwa Israeli
  choice: Yakobo
  alternative: Israeli
  rationale: Kuhifadhi “Yakobo” kunafuata maneno ya Kiebrania na usambamba wa kishairi, huku msomaji akiweza kutambua matumizi yake ya kijamii bila tafsiri kulipanua kimya kimya.
- issue: Maana ya חֶבֶל katika uhusiano na urithi
  choice: fungu
  alternative: kamba ya kupimia au sehemu iliyogawiwa
  rationale: Muktadha unaelekeza kwenye fungu lililogawiwa, lakini neno pia lina taswira halisi ya kamba ya kupimia. Tafsiri kuu ni ya asili, na tanbihi inahifadhi upana wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Muundo wa vipashio viwili umehifadhiwa kwa nuktamkato ili kuonyesha usambamba wa wimbo.
