  text: זְכֹר֙ יְמ֣וֹת עוֹלָ֔ם בִּ֖ינוּ שְׁנ֣וֹת דּוֹר וָ/ד֑וֹר שְׁאַ֤ל אָבִ֨י/ךָ֙ וְ/יַגֵּ֔דְ/ךָ זְקֵנֶ֖י/ךָ וְ/יֹ֥אמְרוּ לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/007.yaml
  text: Remember the days of old[a]; consider the years of generation after generation. Ask your father, and he will tell you, your elders[b], and they will say to you.
translation:
  language: sw
  text: Kumbuka siku za kale; tafakarini[a] miaka ya kizazi baada ya kizazi. Muulize baba yako[b], naye atakueleza; waulize wazee wako, nao watakuambia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinabadilika hapa kutoka amri ya umoja, “kumbuka,” hadi amri ya wingi, “tafakarini,” kisha kinarudi katika umoja.
    reason: grammatical_shift
  - marker: b
    text: Au “mhenga wako,” ikiwa neno hili linaeleweka kwa maana pana kuliko baba wa moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Kumbuka
  rationale: Ni amri ya nafsi ya pili umoja kutoka זכר, ikimtaka msikilizaji akumbuke au alete akilini. “Kumbuka” ni Kiswahili cha kawaida, cha moja kwa moja.
- source_word: יְמוֹת עוֹלָם
  choice: siku za kale
  rationale: Kirai hiki kinaelekeza kwenye nyakati za zamani sana. “Siku za kale” kinahifadhi tamathali ya Kiebrania na kinaeleweka kwa urahisi katika Kiswahili sanifu.
- source_word: בִּינוּ
  choice: tafakarini
  rationale: Amri hii ya wingi inaweza kumaanisha kuelewa, kupambanua, au kufikiria kwa makini. Katika ulinganifu na “kumbuka,” “tafakarini” linaonyesha kutazama historia kwa makini bila kudai kwamba uelewa umekwisha kupatikana.
- source_word: שְׁנוֹת דּוֹר וָדֹר
  choice: miaka ya kizazi baada ya kizazi
  rationale: Kiebrania ni, kwa karibu kabisa, “miaka ya kizazi na kizazi,” nahau inayorejelea vizazi vinavyofuatana. “Kizazi baada ya kizazi” huwasilisha maana hiyo kwa Kiswahili cha kawaida huku ikidumisha muundo wa kishairi.
- source_word: שְׁאַל
  choice: Muulize
  rationale: Amri kutoka שאל ni ya kuuliza au kutaka habari kutoka kwa mtu. Kwa kuwa yambwa ni mtu, “muulize” ni muundo wa asili wa Kiswahili.
- source_word: אָבִיךָ
  choice: baba yako
  rationale: Maana ya moja kwa moja ya nomino ya umoja yenye kiambishi cha nafsi ya pili ni “baba yako.” Uwezekano wa maana pana ya babu au mhenga umewekwa katika tanbihi badala ya kubadili matini kuu.
- source_word: וְיַגֵּדְךָ
  choice: naye atakueleza
  rationale: Hiphil ya נגד humaanisha kumjulisha mtu, kumtangazia, au kumweleza. “Atakueleza” ni ya asili na pia inaitofautisha na אמר katika mstari unaofuata.
- source_word: זְקֵנֶיךָ
  choice: wazee wako
  rationale: Neno hili humaanisha wazee wa jamii wenye umri, uzoefu, na mamlaka, si wanaume wazee tu kama maelezo ya kibiolojia. “Wazee wako” linafaa katika muktadha huu.
- source_word: וְיֹאמְרוּ לָךְ
  choice: nao watakuambia
  rationale: אמר ni kitenzi cha kawaida cha kusema. Katika Kiswahili, “watakuambia” ni njia ya asili ya kueleza kusema jambo kwa mtu, na inadumisha tofauti fulani na “atakueleza” ya kishazi kilichotangulia.
