source:
  edition: WLC
  text: כִּ֛י שֵׁ֥ם יְהוָ֖ה אֶקְרָ֑א הָב֥וּ גֹ֖דֶל לֵ/אלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/003.yaml
  text: For I will proclaim the name of Yahweh[a]; ascribe greatness to our God.
translation:
  language: sw
  text: Kwa maana nitatangaza jina la Yahwe[a]; mpeni Mungu wetu ukuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa desturi limetafsiriwa “BWANA.” Matamshi mengine yanayotumiwa ni “Yahweh” na “Yehova.”'
    reason: Inaeleza jina la Kiebrania na mapokeo tofauti ya kulitaja bila kuficha kwamba maandishi yana jina binafsi.
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha msingi au sababu ya wito unaofuata, huku kikidumisha uhusiano wa sentensi na muktadha wa wimbo.
- source_word: שֵׁם
  choice: jina
  rationale: Hili ndilo neno la moja kwa moja. Katika muktadha linahusu pia utambulisho na sifa zilizofunuliwa za Mungu, lakini maana hiyo haijafafanuliwa kwa paraphrase.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa konsonanti YHWH limetolewa kama jina binafsi badala ya kubadilishwa kuwa cheo kama “BWANA.” Umbo “Yahwe” linafuata tahajia ya kawaida ya Kiswahili.
- source_word: אֶקְרָא
  choice: nitatangaza
  rationale: Katika muktadha wa wimbo, kitenzi קרא kina maana ya kutamka au kulitangaza jina hadharani. Wakati ujao unawakilisha umbo la kitenzi cha Kiebrania kwa kawaida katika muktadha huu.
- source_word: הָבוּ
  choice: mpeni
  rationale: Amri ya wingi imehifadhiwa. Hapa “kumpa” Mungu ukuu ni usemi wa kumtambua na kumsifu kwa ukuu wake, si kumfanya awe mkuu.
- source_word: גֹדֶל
  choice: ukuu
  rationale: Nomino hii inataja ukubwa, utukufu, au hali ya kuwa mkuu. “Ukuu” ni kilinganishi cha moja kwa moja na cha kawaida katika lugha ya sifa.
- source_word: לֵאלֹהֵינוּ
  choice: Mungu wetu
  rationale: Kiambishi cha nafsi ya kwanza wingi kimehifadhiwa katika “wetu,” na mwelekeo wa ל unaonekana katika muundo “mpeni Mungu wetu.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi YHWH. Kulitaja kama “Yahwe” kunahifadhi tofauti kati ya jina hilo na cheo “Bwana,” bila kudai uhakika kamili kuhusu matamshi yake ya kale.
- issue: Maana ya kumpa Mungu ukuu
  choice: mpeni Mungu wetu ukuu
  alternative: tambuni ukuu wa Mungu wetu
  rationale: Tafsiri iliyochaguliwa inadumisha taswira na muundo wa amri ya Kiebrania. Inaeleweka kama wito wa kukiri au kutangaza ukuu ambao tayari ni wake, si kwamba wanadamu wanauumba.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kwa maana” hudumisha kiunganishi cha hoja, na “mpeni … ukuu” huhifadhi lugha ya sifa ya chanzo.
