base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/032.yaml
  text: For their vine is from the vine of Sodom, and from the fields of Gomorrah; their grapes are grapes of poison, their clusters are bitter to them.
translation:
  language: sw
  text: 'Kwa maana mzabibu wao umetokana na mzabibu wa Sodoma,

    na mashamba ya Gomora;

    zabibu zao ni zabibu zenye sumu,

    vishada vyao ni vichungu kwao.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִגֶּפֶן סְדֹם
  choice: umetokana na mzabibu wa Sodoma
  rationale: Kihusishi מִן hapa kinaonyesha asili; tafsiri hii inahifadhi taswira ya mzabibu unaotokana na Sodoma.
- source_word: שַּׁדְמֹת
  choice: mashamba
  rationale: Neno hili humaanisha mashamba au ardhi iliyolimwa; “mashamba” ni la kawaida na linafaa katika muktadha wa kilimo.
- source_word: עִנְּבֵי רוֹשׁ
  choice: zabibu zenye sumu
  rationale: רֹאשׁ humaanisha mmea au kitu chenye sumu katika muktadha huu; “zenye sumu” ni Kiswahili cha asili kuliko muundo “zabibu za sumu”.
- source_word: אַשְׁכְּלֹת מְרֹרֹת
  choice: vishada vyao vina uchungu
  rationale: Inahifadhi picha ya vishada vya zabibu na sifa ya kuwa vichungu kwa lugha ya kawaida ya Kiswahili.
- source_word: לָמוֹ
  choice: kwao
  rationale: Kiwakilishi hiki kimeonyeshwa wazi badala ya kuachwa, hivyo kudumisha utata wa Kiebrania kuhusu ikiwa uchungu ni mali yao au una athari kwao.
theological_decisions:
- issue: Rejeo la mzabibu na mazao yake
  choice: Taswira imeachwa kama sitiari bila kufafanua watu wanaowakilishwa.
  alternative: Kuwataja wazi kama Israeli au maadui wao.
  rationale: Mstari wenyewe hautaji rejeo hilo moja kwa moja; kulifafanua kungeondoa mvutano wa kimuktadha unaopaswa kuhifadhiwa.
- issue: Maana ya לָמוֹ mwishoni mwa mstari
  choice: “kwao” imehifadhiwa.
  alternative: Kuiacha bila kutafsiri au kusema tu “vishada vyao ni vichungu.”
  rationale: Neno hilo lipo katika matini ya Kiebrania na linaweza kuashiria uhusiano au athari; tafsiri haipaswi kulifuta kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa kishairi umehifadhiwa kwa mistari minne; hakuna alama za tanbihi kwa kuwa hakuna tanbihi iliyohitajika.
