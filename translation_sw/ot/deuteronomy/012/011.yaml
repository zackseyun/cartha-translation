  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָיָ֣ה הַ/מָּק֗וֹם אֲשֶׁר יִבְחַר֩ יְהוָ֨ה אֱלֹהֵי/כֶ֥ם בּ/וֹ֙ לְ/שַׁכֵּ֤ן שְׁמ/וֹ֙ שָׁ֔ם שָׁ֣מָּ/ה תָבִ֔יאוּ אֵ֛ת כָּל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֣ה אֶתְ/כֶ֑ם עוֹלֹתֵי/כֶ֣ם וְ/זִבְחֵי/כֶ֗ם מַעְשְׂרֹֽתֵי/כֶם֙ וּ/תְרֻמַ֣ת יֶדְ/כֶ֔ם וְ/כֹל֙ מִבְחַ֣ר נִדְרֵי/כֶ֔ם אֲשֶׁ֥ר תִּדְּר֖וּ לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/011.yaml
  text: 'Then the place that Yahweh your God will choose for his name to dwell there—to that place you shall bring all that I am commanding you: your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, and all the choicest of your vows that you vow to Yahweh.'
translation:
  language: sw
  text: 'Kisha, mahali ambapo Yahweh Mungu wenu atapachagua ili kulifanya jina lake likae huko[a]—hapo ndipo mtaleta yote ninayowaamuru: sadaka zenu za kuteketezwa, dhabihu zenu, zaka zenu, matoleo mnayoyatoa kwa mikono yenu, na nadhiri zenu zote zilizo bora zaidi mnazomwekea Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili jina lake likae huko.”
    reason: Hutoa tafsiri mbadala iliyo nyepesi zaidi kwa Kiswahili; maandishi makuu huonyesha kwa uwazi zaidi hali ya kisababishi ya kitenzi cha Kiebrania.
lexical_decisions:
- source_word: וְהָיָה
  choice: Kisha
  rationale: Huonyesha hatua ya baadaye inayotokana na maagizo yaliyotangulia; ni ya kawaida na ya asili katika Kiswahili.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: mahali ambapo ... atapachagua
  rationale: Huhifadhi mahali maalumu pamoja na mwelekeo wa wakati ujao wa kitenzi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina binafsi la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: ili kulikalisha jina lake huko
  rationale: Huhifadhi hali ya kisababishi ya kitenzi cha Kiebrania na taswira ya jina kukaa mahali hapo.
- source_word: שָׁמָּה תָבִיאוּ
  choice: hapo ndipo mtakapoleta
  rationale: Huhifadhi maana ya mwendo kuelekea mahali palipochaguliwa na nguvu ya agizo.
- source_word: כָּל אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: yote ninayowaamuru
  rationale: Ni Kiswahili cha asili kinachowasilisha agizo linaloendelea kutolewa.
- source_word: עוֹלֹתֵיכֶם
  choice: sadaka zenu za kuteketezwa
  rationale: Neno hili hutaja sadaka zilizoteketezwa kabisa; tafsiri hii ni wazi kwa msomaji wa sasa.
- source_word: זִבְחֵיכֶם
  choice: dhabihu zenu
  rationale: Huhifadhi upana wa neno la Kiebrania bila kulibana kwa aina moja ya dhabihu.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: zaka zenu
  rationale: Ni istilahi ya kawaida ya Kiswahili kwa matoleo ya sehemu ya kumi.
- source_word: תְרֻמַת יֶדְכֶם
  choice: matoleo ya mikono yenu
  rationale: Huhifadhi sitiari halisi ya Kiebrania kuhusu matoleo yanayotolewa kwa mkono wa mtu.
- source_word: וְכֹל מִבְחַר נִדְרֵיכֶם
  choice: na vitu vyote bora zaidi mlivyoahidi kwa nadhiri zenu
  rationale: Huwakilisha vitu bora vilivyoahidiwa kwa nadhiri bila kudokeza kwamba nadhiri zenyewe ndizo zinazochaguliwa au kuongeza aina maalumu ya sadaka.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina la agano moja kwa moja; kulihifadhi kama Yahweh hutofautisha jina hilo na cheo.
- issue: Taswira ya Kideuteronomia ya Mungu kulikalisha jina lake mahali
  choice: ili kulikalisha jina lake huko
  alternative: ili jina lake likae huko; ili kuweka jina lake huko
  rationale: Chaguo hili huhifadhi kisababishi katika kitenzi cha Kiebrania na pia mvutano wa kitheolojia wa 'jina' kukaa mahali palipochaguliwa, bila kusema kwamba nafsi yote ya Mungu imefungwa hapo.
- issue: Maana ya מִבְחַר נִדְרֵיכֶם
  choice: vitu vyote bora zaidi mlivyoahidi kwa nadhiri zenu
  alternative: nadhiri zenu zote zilizo bora zaidi
  rationale: Kiswahili cha chaguo kuu kinaonyesha kwamba kinacholetwa ni vitu bora vilivyoahidiwa, huku kikiepuka kuongeza neno la kiufundi lisilo wazi katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “atapachagua” unaafikiana na nomino ya mahali; “hapo ndipo” huweka mkazo wa Kiebrania katika mahali panapoelekezwa. Istilahi za ibada zimewekwa wazi bila kutumia misamiati ya kimadhehebu.
