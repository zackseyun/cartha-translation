  source_fidelity: Maana kuu imehifadhiwa, kutia ndani mahali atakapochagua Yahweh, orodha ya matoleo, na mwelekeo wa kuyapeleka mahali hapo. Hata hivyo, “vitu ... mlivyoahidi kwa nadhiri zenu” hubadili נִדְרֵיכֶם (“nadhiri zenu”) kuwa vitu vilivyoahidiwa; hayo hayasemwi wazi katika Kiebrania.
  naturalness: “Kulikalisha jina lake” si usemi wa kawaida wala wazi katika Kiswahili cha leo; “kulifanya jina lake likae” huwasilisha kisababishi kwa ufasaha zaidi. “Matoleo mnayoyatoa kwa mikono yenu” pia ni wazi zaidi kuliko “matoleo ya mikono yenu.”
  terminology: “Yahweh,” “sadaka za kuteketezwa,” “dhabihu,” na “zaka” zinafaa. “Nadhiri” inapaswa kubaki kama nadhiri, bila kuongeza “vitu” au “sadaka” ambazo hazipo wazi katika maandishi ya chanzo.
  issues:
  - severity: medium
    issue: “vitu vyote bora zaidi mlivyoahidi kwa nadhiri zenu”
    rationale: Hii hufanya nadhiri kuwa njia ya kuahidi vitu, badala ya kutafsiri nomino “nadhiri zenu” yenyewe. Pia huongeza “vitu,” ambavyo chanzo hakivitaji.
  - severity: medium
    issue: “ili kulikalisha jina lake huko”
    rationale: Ingawa inalenga Hiphil ya שׁכן, umbo hili halina uwazi wa kisasa na linaweza kusikika kana kwamba jina linakalishwa kimwili. “Ili kulifanya jina lake likae huko” ni Kiswahili sanifu na huhifadhi kisababishi.
  - severity: low
    issue: “matoleo ya mikono yenu”
    rationale: Muundo huu ni wa kihalisia lakini si wazi sana katika Kiswahili. Kitenzi “mnayoyatoa kwa mikono yenu” huweka wazi idiomu ya mchango wa mkono bila kuongeza aina mahsusi ya sadaka.
