  text: וּ/שְׂמַחְתֶּ֗ם לִ/פְנֵי֮ יְהוָ֣ה אֱלֹֽהֵי/כֶם֒ אַתֶּ֗ם וּ/בְנֵי/כֶם֙ וּ/בְנֹ֣תֵי/כֶ֔ם וְ/עַבְדֵי/כֶ֖ם וְ/אַמְהֹתֵי/כֶ֑ם וְ/הַ/לֵּוִי֙ אֲשֶׁ֣ר בְּ/שַֽׁעֲרֵי/כֶ֔ם כִּ֣י אֵ֥ין ל֛/וֹ חֵ֥לֶק וְ/נַחֲלָ֖ה אִתְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/012.yaml
  text: And you shall rejoice before Yahweh your God—you and your sons and your daughters[a], and your male servants and your female servants, and the Levite who is within your gates, because he has no portion or inheritance with you.
translation:
  language: sw
  text: Nanyi mtafurahi mbele za Yahweh Mungu wenu—ninyi, wana wenu na binti zenu, watumwa wenu wa kiume na wa kike, na Mlawi aliye ndani ya malango yenu[a], kwa sababu hana fungu wala urithi pamoja nanyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliye katika miji yenu”; kihalisi, “aliye ndani ya malango yenu.”
    reason: Neno la Kiebrania “malango” linaweza kutumiwa kwa maana ya miji au makazi yanayohusishwa na malango hayo.
lexical_decisions:
- source_word: וּשְׂמַחְתֶּם
  choice: Nanyi mtafurahi
  rationale: Kitenzi hiki katika muktadha wa maagizo kina maana ya agizo linalotazamia utekelezaji; “mtafurahi” ni Kiswahili cha kawaida na hudumisha wazo la furaha katika ibada.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: mbele za Yahweh Mungu wenu
  rationale: “Mbele za” huwasilisha kwa kawaida maana ya kuwa katika uwepo wa Mungu, huku “Yahweh” ikihifadhi jina la Mungu lililo katika maandishi ya Kiebrania.
- source_word: וּבְנֵיכֶם וּבְנֹתֵיכֶם
  choice: wana wenu na binti zenu
  rationale: Tafsiri hii huhifadhi kutajwa tofauti kwa watoto wa kiume na wa kike badala ya kuwajumlisha wote kwa neno moja.
- source_word: וְעַבְדֵיכֶם וְאַמְהֹתֵיכֶם
  choice: watumwa wenu wa kiume na wa kike
  rationale: Maneno ya Kiebrania yanataja watu wa hali ya utumwa katika kaya na kutofautisha jinsia; muundo huu ni wa kawaida kwa Kiswahili na huhifadhi hali hiyo pamoja na tofauti ya jinsia.
- source_word: וְהַלֵּוִי
  choice: Mlawi
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mtu wa kabila la Lawi.
- source_word: אֲשֶׁר בְּשַׁעֲרֵיכֶם
  choice: aliye ndani ya malango yenu
  rationale: Tafsiri hii huhifadhi taswira na nahau ya Kiebrania, huku tanbihi ikieleza maana yake inayoweza kuwa “katika miji yenu.”
- source_word: כִּי אֵין לוֹ חֵלֶק וְנַחֲלָה אִתְּכֶם
  choice: kwa sababu hana fungu wala urithi pamoja nanyi
  rationale: “Kwa sababu” huonyesha wazi uhusiano wa kisababu; “fungu wala urithi” huhifadhi jozi ya maneno inayohusu mgao na milki ya urithi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano la Mungu; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Hali ya kijamii ya עֶבֶד na אָמָה
  choice: watumwa wenu wa kiume na wa kike
  alternative: watumishi wenu wa kiume na wa kike
  rationale: Katika sheria hii ya agano, maneno hayo yanawahusu walio chini ya mamlaka ya kaya katika hali ya utumwa. “Watumwa” huepuka kuficha hali hiyo, bila kuongeza tathmini ya kimadhehebu.
- issue: Fungu na urithi wa Mlawi
  choice: hana fungu wala urithi pamoja nanyi
  alternative: hana sehemu au urithi kati yenu
  rationale: Tafsiri inadumisha kauli kwamba Mlawi hana mgao wa urithi wa ardhi kama Waisraeli wengine, bila kueleza zaidi ya yanayosemwa na mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. Orodha ya wanakaya imehifadhiwa, na alama ya tanbihi imewekwa baada ya nahau inayofafanuliwa.
