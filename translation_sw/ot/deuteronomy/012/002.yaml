  text: אַבֵּ֣ד תְּ֠אַבְּדוּ/ן אֶֽת כָּל הַ/מְּקֹמ֞וֹת אֲשֶׁ֧ר עָֽבְדוּ שָׁ֣ם הַ/גּוֹיִ֗ם אֲשֶׁ֥ר אַתֶּ֛ם יֹרְשִׁ֥ים אֹתָ֖/ם אֶת אֱלֹהֵי/הֶ֑ם עַל הֶ/הָרִ֤ים הָֽ/רָמִים֙ וְ/עַל הַ/גְּבָע֔וֹת וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/002.yaml
  text: You must surely destroy all the places where the nations whom you are dispossessing served their gods[a], on the high mountains, on the hills, and under every green tree.
translation:
  language: sw
  text: 'Ni lazima myaharibu kabisa maeneo yote ambako mataifa mnayoyanyang’anya nchi yao yalitumikia miungu yao[a]: kwenye milima mirefu, kwenye vilima, na chini ya kila mti wenye majani mabichi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yalipoabudu miungu yao.” Kitenzi cha Kiebrania kinaweza kumaanisha “kutumikia” kwa maana ya kidini ya kuabudu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבֵּד תְּאַבְּדוּן
  choice: Ni lazima mziharibu kabisa
  rationale: Muundo wa kitenzi kisoukomo pamoja na kitenzi kilichonyambuliwa unasisitiza amri. ‘Ni lazima ... kabisa’ huonyesha mkazo huo kwa Kiswahili cha sasa bila kutumia mtindo wa kizamani.
- source_word: הַמְּקֹמוֹת
  choice: mahali pote
  rationale: Neno hili hapa linarejelea maeneo halisi ya ibada. ‘Mahali pote’ ni la kawaida na linaakisi wingi wenye maana ya ujumla.
- source_word: עָבְדוּ שָׁם
  choice: yaliitumikia ... [hapo]
  rationale: Kitenzi עבד kinapotumiwa kuhusu miungu kinaweza kumaanisha kuitumikia katika ibada. ‘Yaliitumikia miungu yao’ huhifadhi wazo la msingi la kutumikia, huku muktadha ukionyesha wazi maana ya kidini. Maana ya ‘hapo’ tayari imo katika ‘mahali pote ambapo,’ hivyo hairudiwi kwa namna isiyo ya kawaida.
- source_word: הַגּוֹיִם
  choice: mataifa
  rationale: Katika muktadha huu neno linarejelea mataifa yasiyo ya Israeli yaliyokuwa katika nchi hiyo. ‘Mataifa’ ni tafsiri ya moja kwa moja na haileti matumizi ya kidini ya nyakati za baadaye.
- source_word: אֲשֶׁר אַתֶּם יֹרְשִׁים אֹתָם
  choice: mnayoyanyang’anya milki yao
  rationale: Katika muktadha wa kuiteka nchi, ירשׁ hujumuisha kutwaa milki kwa kuwaondoa waliokuwa nayo. Usemi huu huhifadhi upande wa kuwanyang’anya na wa kutwaa milki, ingawa ‘milki yao’ imeelezwa wazi ili Kiswahili kiwe cha kawaida.
- source_word: אֱלֹהֵיהֶם
  choice: miungu yao
  rationale: Ni wingi wenye kiwakilishi cha umilikaji, na tafsiri hii ni ya moja kwa moja.
- source_word: עַל הֶהָרִים הָרָמִים
  choice: juu ya milima mirefu
  rationale: Tafsiri hii huhifadhi nomino na kivumishi chake na kuonyesha maeneo ya ibada yaliyoinuka.
- source_word: הַגְּבָעוֹת
  choice: vilima
  rationale: ‘Vilima’ ni maana ya kawaida ya neno hili; kihusishi ‘juu ya’ huonyesha mahali bila kuongeza wazo la vilele pekee.
- source_word: תַּחַת כָּל עֵץ רַעֲנָן
  choice: chini ya kila mti wenye majani mabichi
  rationale: רַעֲנָן huonyesha mti wenye majani mabichi, uliochangamka au uliositawi. Usemi huu ni wa asili kwa Kiswahili na huhifadhi picha ya maeneo yenye miti yenye kivuli na majani mengi.
theological_decisions:
- issue: Kitu kinachoamriwa kuharibiwa katika maeneo ya ibada ya mataifa
  choice: Amri inalenga kuharibiwa kwa mahali pote palipohusishwa na ibada ya miungu ya mataifa yanayonyang’anywa milki.
  alternative: Kutafsiri kwa upana kuwa amri ni ya kukomesha desturi zote za ibada za kipagani.
  rationale: Kitu cha moja kwa moja katika Kiebrania ni ‘mahali pote,’ si desturi zenyewe. Tafsiri kwa hiyo hudumisha lengo halisi la maeneo, bila kukataa matokeo mapana yanayoweza kudokezwa.
- issue: Maana ya עבד kuhusiana na miungu
  choice: Kutumia ‘yaliitumikia miungu yao’ na kueleza maana ya ibada katika tanbihi.
  alternative: Kutafsiri moja kwa moja ‘yaliabudu miungu yao.’
  rationale: ‘Kutumikia’ huhifadhi upana wa kitenzi cha Kiebrania na mvutano wake wa kileksika, huku tanbihi ikionyesha wazi kuwa huduma hiyo ni ibada ya kidini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. ‘Ni lazima ... kabisa’ huwasilisha amri yenye mkazo; ‘mahali pote ambapo’ huepuka kurudia ‘hapo’ kusiko kwa kawaida. Alama ya tanbihi [a] imewekwa mara moja katika matini kuu.
