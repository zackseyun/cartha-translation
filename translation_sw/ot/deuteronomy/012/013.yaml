  text: Be careful lest you offer up your burnt offerings in any place that you see;[a]
translation:
  language: sw
  text: Jihadhari usije ukatoa sadaka zako za kuteketezwa mahali popote utakapoona;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jihadhari usije ukatoa sadaka zako za kuteketezwa katika kila mahali utakapoona.”
    reason: Mbadala wa “kila mahali” unaakisi kwa karibu zaidi umbo la בְּכָל מָקוֹם, ingawa “mahali popote” ni la asili zaidi katika onyo hasi la Kiswahili.
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Jihadhari
  rationale: Kauli hii ya onyo ina maana ya kuwa macho au kujilinda. “Jihadhari” ni ya kawaida, yenye hadhi, na huhifadhi nguvu ya amri.
- source_word: פֶּן
  choice: usije
  rationale: Neno hili linaanzisha onyo hasi lenye kusudi la kuzuia jambo lisitendeke. “Usije” linaonyesha maana hiyo kwa Kiswahili cha asili.
- source_word: תַּעֲלֶה
  choice: ukatoa
  rationale: Hifili ya עלה hutumiwa hapa kwa kitendo cha kutoa sadaka juu ya madhabahu. “Kutoa” ni usemi wa kawaida wa ibada katika Kiswahili na huepuka tafsiri halisi isiyo ya asili ya ‘kupandisha.’
- source_word: עֹלֹתֶיךָ
  choice: sadaka zako za kuteketezwa
  rationale: Hili ni neno maalumu kwa sadaka inayoteketezwa madhabahuni. Tafsiri hii ni wazi na imezoeleka katika lugha ya Biblia ya Kiswahili.
- source_word: בְּכָל מָקוֹם
  choice: mahali popote
  rationale: Katika muktadha wa onyo hasi, “mahali popote” huwasilisha marufuku ya kutoa sadaka katika eneo lolote lililochaguliwa kiholela, huku “kila mahali” likibaki badala ya karibu zaidi na umbo la Kiebrania.
- source_word: אֲשֶׁר תִּרְאֶה
  choice: unapoona
  rationale: Tafsiri hii huhifadhi kitenzi halisi cha kuona bila kuongeza kwa wazi wazo la kuchagua, ambalo linadokezwa na muktadha lakini halijasemwa moja kwa moja.
theological_decisions:
- issue: Lugha ya kuweka ibada mahali pamoja
  choice: Onyo limetafsiriwa kuwa marufuku ya kutoa sadaka za kuteketezwa katika mahali anapojiamulia mtu.
  alternative: Kulipanua liwe marufuku ya jumla ya aina zote za ibada nje ya patakatifu pa kati.
  rationale: Aya yenyewe inataja hasa sadaka za kuteketezwa na mahali pa kiholela. Muktadha mpana unaelekea kwenye kuwekwa kwa ibada mahali pamoja, lakini tafsiri haipaswi kuongeza zaidi ya maneno ya aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Jihadhari usije” ni onyo la kawaida na lenye nguvu; istilahi ya ibada “sadaka za kuteketezwa” imetumiwa kwa uwazi. Alama ya tanbihi [a] imewekwa katika matini kuu.
