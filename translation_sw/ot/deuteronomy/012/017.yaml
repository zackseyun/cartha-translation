reference: Deuteronomy 12:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לֹֽא תוּכַ֞ל לֶ/אֱכֹ֣ל בִּ/שְׁעָרֶ֗י/ךָ מַעְשַׂ֤ר דְּגָֽנְ/ךָ֙ וְ/תִֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֔/ךָ וּ/בְכֹרֹ֥ת בְּקָרְ/ךָ֖ וְ/צֹאנֶ֑/ךָ וְ/כָל נְדָרֶ֨י/ךָ֙ אֲשֶׁ֣ר תִּדֹּ֔ר וְ/נִדְבֹתֶ֖י/ךָ וּ/תְרוּמַ֥ת יָדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/017.yaml
  text: You may not eat within your gates the tithe of your grain[a], your new wine, or your oil, or the firstborn of your herd or your flock, or any of your vows that you vow, or your freewill offerings[c][b], or the contribution of your hand.
translation:
  language: sw
  text: Huruhusiwi kula ndani ya malango yako[a] sehemu ya kumi ya nafaka yako, divai yako mpya, au mafuta yako; wala wazaliwa wa kwanza wa ng’ombe wako na wa kondoo na mbuzi wako; wala nadhiri zako zozote unazoweka[b], sadaka zako za hiari, au toleo la mkono wako.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika miji yako.” Kiebrania ni “ndani ya malango yako,” nahau inayomaanisha makazi au miji ya mtu.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya moja kwa moja zaidi, “nadhiri zako zote unazoweka.” Katika muktadha huu huenda maneno hayo yanarejelea sadaka zilizoahidiwa kwa nadhiri, si ahadi zinazotamkwa tu.
    reason: lexical_alternative
  - marker: c
    text: Au, “toleo la mkono wako”; kwa mapokeo, “sadaka ya kuinuliwa ya mkono wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל לֶאֱכֹל
  choice: Huruhusiwi kula
  rationale: Muundo wa יכל pamoja na kitenzi-jina katika sheria hii una nguvu ya katazo, si kutoweza tu. “Huruhusiwi kula” ni Kiswahili cha kawaida kinachoonyesha nguvu hiyo ya kisheria.
- source_word: בִּשְׁעָרֶיךָ
  choice: ndani ya malango yako
  rationale: Huhifadhi taswira halisi ya Kiebrania, huku tanbihi ikieleza kuwa “malango” ni nahau inayomaanisha makazi au miji ya mtu.
- source_word: מַעְשַׂר דְּגָנְךָ
  choice: sehemu ya kumi ya nafaka yako
  rationale: “Sehemu ya kumi” ni wazi kwa wasomaji wa Kiswahili na huonyesha kwa usahihi sehemu maalumu ya nafaka iliyotengwa.
- source_word: תִּירֹשְׁךָ
  choice: divai yako mpya
  rationale: תירוש kwa kawaida hurejelea divai mpya au ya mavuno mapya, hivyo “divai mpya” huhifadhi tofauti hiyo ya kileksia.
- source_word: יִצְהָרֶךָ
  choice: mafuta yako
  rationale: Neno hili mara nyingi humaanisha mafuta mapya, hasa ya zeituni; “mafuta” ni sahihi bila kuongeza ufafanuzi usiotajwa wazi katika maandishi.
- source_word: בְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: wazaliwa wa kwanza wa ng’ombe wako, kondoo wako, au mbuzi wako
  rationale: בקר ni ng’ombe, na צאן ni kundi la kondoo na mbuzi. Kuyataja makundi hayo wazi ni Kiswahili cha kawaida na hakufichi upana wa צאן.
- source_word: כָל נְדָרֶיךָ אֲשֶׁר תִּדֹּר
  choice: sadaka zako zozote za nadhiri unazoweka
  rationale: Katika orodha hii ya vitu vitakatifu vinavyoliwa, nadhiri zinarejelea sadaka zinazohusiana nazo. Tafsiri hii huweka wazi muktadha wa ibada, na tanbihi huhifadhi uwezekano wa tafsiri ya moja kwa moja zaidi.
- source_word: נִדְבֹתֶיךָ
  choice: sadaka zako za hiari
  rationale: Hili ni neno la kiibada kwa sadaka zinazotolewa kwa hiari badala ya kwa wajibu au nadhiri.
- source_word: תְּרוּמַת יָדֶךָ
  choice: sadaka unayotoa kwa mkono wako
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kitu kinachotengwa na kutolewa kutoka mkononi mwa mtoaji, huku ikihifadhi taswira ya “mkono wako.”
theological_decisions:
- issue: Istilahi za ibada katika sheria ya sadaka
  choice: Kutaja “sadaka za nadhiri” na “sadaka za hiari” kwa uwazi
  alternative: Kutafsiri kwa jumla zaidi kama “nadhiri” na “matoleo ya hiari”
  rationale: Muktadha unaorodhesha aina za vyakula na matoleo matakatifu yasiyopaswa kuliwa katika makazi ya kawaida. Kutaja sadaka hudumisha mazingira ya kiibada bila kuingiza fundisho la dhehebu.
- issue: Maana ya נדריך
  choice: “sadaka zako ... za nadhiri,” huku tafsiri halisi zaidi ikiwekwa katika tanbihi
  alternative: “nadhiri zako zote unazoweka”
  rationale: Neno lenyewe linaweza kumaanisha nadhiri, lakini katika orodha hii linaelekea kumaanisha vitu vilivyoahidiwa kwa nadhiri. Tanbihi inadumisha utata huo badala ya kuufuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko ya sheria. Sentensi imetumia “Huruhusiwi” kuonyesha katazo kwa uwazi, na alama za nusu koloni kutenganisha makundi marefu ya orodha. Taswira za Kiebrania za “malango” na “mkono” zimehifadhiwa na kufafanuliwa katika tanbihi.
