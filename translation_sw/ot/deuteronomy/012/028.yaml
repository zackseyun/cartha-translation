base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/028.yaml
  text: Be careful to listen to all these words that I am commanding you[a], so that it may go well with you and with your children after you forever[b], because you will do what is good and right in the eyes of Yahweh your God.
translation:
  language: sw
  text: Yatunze na uyasikilize maneno haya yote ninayokuamuru,[a] ili wewe na watoto wako baada yako mpate kufanikiwa milele,[b] kwa sababu utafanya yaliyo mema na yaliyo sawa machoni pa Yahweh, Mungu wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yashike na uyasikie maneno haya yote.” Kiebrania kinaunganisha kutunza kwa uangalifu na kusikia kwa makini; muktadha unadokeza pia kutii.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “wana”; hapa maana yake ni watoto au vizazi kwa upana.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֹר וְשָׁמַעְתָּ
  choice: Yatunze na kuyasikiliza
  rationale: Kitenzi cha kwanza kinadumisha maana ya kutunza au kuzingatia kwa uangalifu, na cha pili kinadumisha maana ya kusikia kwa makini; muktadha pia unadokeza kutii.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: maneno haya yote
  rationale: Tafsiri ya moja kwa moja ya 'maneno haya yote' inafaa kwa maagizo yaliyotamkwa na Musa.
- source_word: מְצַוֶּךָּ
  choice: ninayokuamuru
  rationale: Muundo huu ni wa sasa na unaonyesha Musa akitoa amri hizi wakati huo.
- source_word: לְמַעַן יִיטַב לְךָ
  choice: ili ... mpate kufanikiwa
  rationale: Hii ni njia ya kawaida na ya asili ya Kiswahili ya kueleza kwamba mambo yaende vizuri au hali iwe njema kwa mtu.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: na watoto wako baada yako
  rationale: Ingawa neno la Kiebrania linaweza kumaanisha 'wana', katika ahadi hii ya agano linawakilisha watoto au vizazi vya mtu kwa upana.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Neno hili linaeleza muda unaoendelea bila kikomo kinachotajwa.
- source_word: כִּי תַעֲשֶׂה
  choice: kwa sababu utafanya
  rationale: Inahifadhi uhusiano wa kisababu wa כִּי na hali ya wakati ujao ya kitenzi bila kuibadili kuwa sharti.
- source_word: הַטּוֹב וְהַיָּשָׁר
  choice: yaliyo mema na yaliyo sawa
  rationale: Vivumishi hivi vinatumika kama nomino na vinaeleza kile kinachokubalika kimaadili na kilicho sawa.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Inahifadhi sitiari ya Kiebrania kuhusu tathmini ya Mungu kwa usemi unaoeleweka katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano YHWH; 'Yahwe' hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Upeo wa בָנֶיךָ
  choice: watoto
  alternative: wana au wazao
  rationale: Katika muktadha wa agano, wingi wa kiume unaweza kuwakilisha watoto na vizazi vya mtu kwa ujumla; 'watoto' hudumisha uhusiano wa kifamilia bila kuuwekea maana ya wana wa kiume pekee.
- issue: Uhusiano wa כִּי תַעֲשֶׂה na ustawi ulioahidiwa
  choice: kwa sababu utafanya
  alternative: utakapofanya au ukifanya
  rationale: Tafsiri ya kisababu inafuata matumizi yanayowezekana ya כִּי na inadumisha mvutano wa kauli ya Kiebrania bila kuifanya waziwazi kuwa sharti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini cha kawaida na kinachoeleweka. 'Yatunze na kuyasikiliza' kinawakilisha vitenzi vyote viwili vya Kiebrania; 'mpate kufanikiwa' kinakubaliana na kiima cha pamoja 'wewe na watoto wako'.
