  text: וְ/עָשִׂ֤יתָ עֹלֹתֶ֨י/ךָ֙ הַ/בָּשָׂ֣ר וְ/הַ/דָּ֔ם עַל מִזְבַּ֖ח יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/דַם זְבָחֶ֗י/ךָ יִשָּׁפֵךְ֙ עַל מִזְבַּח֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הַ/בָּשָׂ֖ר תֹּאכֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/027.yaml
  text: And you shall offer your burnt offerings[a], the flesh and the blood, on the altar of Yahweh your God; and the blood of your sacrifices shall be poured out on the altar of Yahweh your God, and you shall eat the flesh.
translation:
  language: sw
  text: Nawe utatoa sadaka zako za kuteketezwa, nyama na damu, juu ya madhabahu ya Yahweh Mungu wako. Damu ya dhabihu zako itamwagwa juu ya madhabahu ya Yahweh Mungu wako, nawe utakula nyama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lakini unaweza kula nyama.”
    reason: Kitenzi katika muktadha huu wa sheria kinaweza kueleweka kama ruhusa, na kiunganishi kinaweza kuonyesha tofauti kati ya damu inayomwagwa na nyama inayoweza kuliwa.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: utatoa
  rationale: Ingawa kitenzi hiki kwa msingi humaanisha ‘kufanya,’ katika muktadha wa dhabihu kina maana ya kuitoa sadaka; ‘utatoa’ ni Kiswahili cha kawaida na sahihi katika sheria ya ibada.
- source_word: עֹלֹתֶיךָ
  choice: sadaka zako za kuteketezwa
  rationale: Hili ni neno maalumu kwa sadaka iliyoteketezwa yote; tafsiri hii ni wazi na imezoeleka katika Kiswahili cha Biblia.
- source_word: הַבָּשָׂר וְהַדָּם
  choice: nyama na damu
  rationale: Katika Kiswahili, ‘nyama’ huwasilisha kwa kawaida maana halisi ya בָּשָׂר katika muktadha wa dhabihu bila kuleta ugumu wa usemi.
- source_word: עַל מִזְבַּח יְהוָה אֱלֹהֶיךָ
  choice: juu ya madhabahu ya Yahwe Mungu wako
  rationale: ‘Juu ya madhabahu’ linaonyesha mahali pa tendo la ibada, na muundo huu ni wa asili katika Kiswahili sanifu.
- source_word: וְדַם זְבָחֶיךָ
  choice: damu ya dhabihu zako
  rationale: זֶבַח hapa ni dhabihu ambayo damu yake humwagwa madhabahuni, huku nyama yake ikiliwa; ‘dhabihu’ ni neno pana na linaloeleweka.
- source_word: יִשָּׁפֵךְ
  choice: itamwagwa
  rationale: Kauli ya kutendwa katika Kiebrania inaonyesha tendo la kiibada linalofanywa kwa damu; ‘itamwagwa’ linadumisha hilo kwa ufupi.
- source_word: וְהַבָּשָׂר תֹּאכֵל
  choice: nawe utakula nyama
  rationale: Tafsiri hii inadumisha kiunganishi na umbo la kitenzi cha Kiebrania. Uwezekano wa kukielewa kama ruhusa unawekwa katika tanbihi badala ya kuamuliwa kimya kimya katika matini.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania inatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Nguvu ya kisharti ya וְהַבָּשָׂר תֹּאכֵל
  choice: nawe utakula nyama
  alternative: lakini unaweza kula nyama
  rationale: Umbo la Kiebrania linaweza kusomwa kama agizo la sheria, huku muktadha ukiruhusu pia maana ya ruhusa kwa kulinganisha nyama na damu. Matini kuu inafuata muundo wa karibu zaidi, na tanbihi inahifadhi uwezekano wa ruhusa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya matini ya ibada lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi mbili zimetumiwa ili kupunguza uzito wa muundo bila kupoteza uhusiano wa vipashio vya Kiebrania.
