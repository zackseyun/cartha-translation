base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/014.yaml
  text: but only at the place that Yahweh will choose in one of your tribes—there you shall offer up your burnt offerings[b][a], and there you shall do all that I am commanding you.
translation:
  language: sw
  text: isipokuwa mahali ambapo Yahweh atachagua katika mojawapo ya makabila yako[b]—huko utatoa sadaka zako za kuteketezwa, na huko utafanya yote ninayokuamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Kwa Kiebrania, “katika mojawapo ya makabila yako,” yaani, ndani ya eneo la mojawapo ya makabila ya Israeli.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי אִם
  choice: bali ni mahali tu
  rationale: Katika muktadha unaofuata katazo la mstari uliotangulia, nahau hii inaonyesha tofauti na pia upekee wa mahali panaporuhusiwa. Kiswahili hiki ni cha kawaida na huhifadhi maana ya ‘isipokuwa tu.’
- source_word: בַּמָּקוֹם
  choice: mahali
  rationale: Neno hili linarejelea eneo maalumu la ibada ambalo Mungu atalichagua; ‘mahali’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: ambapo Yahweh atachagua
  rationale: Kitenzi kinaelekeza kwenye uchaguzi wa wakati ujao, na ‘atachagua’ huhifadhi maana hiyo. Jina la agano יְהוָה limetafsiriwa ‘Yahweh.’
- source_word: בְּאַחַד שְׁבָטֶיךָ
  choice: katika mojawapo ya makabila yako
  rationale: Tafsiri hii hudumisha neno la kijamii na kiagano ‘makabila,’ huku tanbihi ikifafanua kwamba eneo la mojawapo ya makabila linakusudiwa.
- source_word: שָׁם
  choice: huko
  rationale: Kurudiwa kwa ‘huko’ mara mbili kumehifadhiwa ili kusisitiza kwamba ibada hizi zifanyike katika mahali palipochaguliwa pekee.
- source_word: תַּעֲלֶה עֹלֹתֶיךָ
  choice: utatoa sadaka zako za kuteketezwa
  rationale: Hifili ya עלה pamoja na עֹלָה ni usemi wa kutoa dhabihu. ‘Utatoa sadaka zako za kuteketezwa’ ni Kiswahili cha kawaida kinachowasilisha maana ya kitambiko bila kulazimisha taswira ya kupandisha.
- source_word: כֹּל אֲשֶׁר אָנֹכִי מְצַוֶּךָּ
  choice: yote ninayokuamuru
  rationale: Muundo huu huonyesha amri inayotolewa sasa na kwa kuendelea; ‘ninayokuamuru’ ni wa asili na huhifadhi nguvu hiyo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יְהוָה. ‘Yahweh’ hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Upekee wa mahali pa kutoa dhabihu
  choice: bali ni mahali tu
  alternative: isipokuwa mahali
  rationale: Muundo huu huhifadhi mkazo wa kifungu kwamba mahali atakapochagua Yahweh ndiko pekee kunakoruhusiwa, bila kuongeza utambulisho wa mahali hapo ambao mstari wenyewe hautoi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya ‘huko’ yamehifadhiwa kwa ajili ya mkazo wa maandishi ya Kiebrania; istilahi ya kitambiko ‘sadaka za kuteketezwa’ imetumiwa kwa uwazi na uthabiti.
