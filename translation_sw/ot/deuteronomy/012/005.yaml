  text: כִּ֠י אִֽם אֶל הַ/מָּק֞וֹם אֲשֶׁר יִבְחַ֨ר יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ מִ/כָּל שִׁבְטֵי/כֶ֔ם לָ/שׂ֥וּם אֶת שְׁמ֖/וֹ שָׁ֑ם לְ/שִׁכְנ֥/וֹ תִדְרְשׁ֖וּ וּ/בָ֥אתָ שָֽׁמָּ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/005.yaml
  text: But to the place that Yahweh your God will choose from all your tribes to put his name there[a], for his dwelling, you shall seek, and there you shall go.
translation:
  language: sw
  text: Bali mtatafuta mahali ambapo Yahwe Mungu wenu atachagua miongoni mwa makabila yenu yote, ili aweke jina lake huko[a], kwa ajili ya makao yake; nanyi mtakwenda huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili aweke jina lake huko ili akae huko.” Kirai hiki cha Kiebrania ni kifupi, na tafsiri hutofautiana kuhusu kama kinakazia Mungu kukaa huko, mahali hapo kuwa makao yake, au yote mawili.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: Bali
  rationale: Katika muktadha huu, usemi huu unatofautisha marufuku iliyotangulia na njia sahihi ya kumwabudu Mungu. “Bali” ni ya kawaida na huhifadhi utofautishaji huo.
- source_word: הַמָּקוֹם
  choice: mahali
  rationale: Ni tafsiri ya kawaida ya neno hili na hudumisha wazo la eneo halisi ambalo bado halijatajwa.
- source_word: יִבְחַר
  choice: atachagua
  rationale: Kitenzi kisichotimilika hapa kinaelekeza kwenye uchaguzi wa mahali pa ibada utakaofanywa baadaye.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Huhifadhi umbo la wingi la nafsi ya pili na uhusiano wa agano unaoonyeshwa na kirai hicho.
- source_word: מִכָּל שִׁבְטֵיכֶם
  choice: miongoni mwa makabila yenu yote
  rationale: Huonyesha kwamba mahali hapo patachaguliwa kutoka ndani ya maeneo ya makabila ya Israeli, kwa Kiswahili cha kawaida.
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: ili aliweke jina lake huko
  rationale: Hukaa karibu na nahau ya Kiebrania bila kuipanua kuwa maelezo ya kiteolojia kuhusu uwepo wa Mungu.
- source_word: לְשִׁכְנוֹ
  choice: kuwa makao yake
  rationale: Huhifadhi kwa ufupi wazo la makao lililo katika Kiebrania, huku tanbihi ikionyesha uwezekano mwingine wa kuunganisha kirai hiki.
- source_word: תִדְרְשׁוּ
  choice: mtatafuta
  rationale: Katika muktadha huu, kitenzi kinaagiza Waisraeli kupata na kuelekea mahali halali pa ibada. “Mtatafuta” ni wazi na ya kawaida.
- source_word: וּבָאתָ שָׁמָּה
  choice: nanyi mtakwenda huko
  rationale: Ingawa בוא mara nyingi ni “kuja,” “kwenda huko” ni ya kawaida zaidi kwa eneo ambalo halijatajwa kutoka kwa mtazamo wa msemaji; “huko” huhifadhi שָׁמָּה.
theological_decisions:
- issue: Jina la Mungu na lugha ya patakatifu pa kati
  choice: Yahwe ... ili aliweke jina lake huko kuwa makao yake
  alternative: Yahwe ... ili aliweke jina lake huko kwa ajili ya makao yake
  rationale: Tafsiri inadumisha pamoja motifu za jina la Mungu na makao yake bila kuingiza maelezo ya baadaye kuhusu hekalu au kuamua kabisa uhusiano wa kisarufi wa kirai kifupi cha Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umebadilishwa kidogo kuwa “mtatafuta mahali” ili sentensi isomeke kwa kawaida, bila kuondoa vipengele vya Kiebrania. Alama ya tanbihi [a] imewekwa baada ya “huko,” mahali ambapo utata wa kirai kinachofuata hujitokeza.
