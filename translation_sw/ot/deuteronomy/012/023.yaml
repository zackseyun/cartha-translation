  text: Only be sure not to eat the blood[a], because the blood is the life, and you shall not eat the life with the flesh.
translation:
  language: sw
  text: Ila hakikisha kabisa kwamba usile damu[a], kwa sababu damu ndiyo uhai; wala usile uhai pamoja na nyama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafsi” badala ya “uhai” katika matumizi yote mawili ya נֶפֶשׁ; hapa neno la Kiebrania linamaanisha uhai unaohuisha kiumbe, ndiyo sababu tafsiri nyingi hutumia “uhai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Lakini
  rationale: Hapa neno hili linaweka sharti kali linalopunguza ruhusa iliyotangulia. “Lakini” linaonyesha kwa Kiswahili cha kawaida tofauti hiyo ya wazi.
- source_word: חֲזַק לְבִלְתִּי אֲכֹל
  choice: hakikisha kabisa kwamba huli
  rationale: Ingawa חֲזַק kimsingi humaanisha kuwa imara, katika muundo huu ni himizo la kusisitiza mtu ajitahidi kwa uthabiti asifanye jambo. Kauli hii ni ya asili kwa Kiswahili na inadumisha uzito wa agizo.
- source_word: הַדָּם
  choice: damu
  rationale: Ni tafsiri ya moja kwa moja, na imedumishwa katika kutokea kwake kote.
- source_word: כִּי
  choice: kwa sababu
  rationale: Inaingiza sababu ya katazo kwa uwazi.
- source_word: הַנָּפֶשׁ
  choice: uhai
  rationale: Katika sheria hii ya chakula, נֶפֶשׁ inamaanisha uhai unaohuisha kiumbe, si lazima nafsi isiyo ya kimwili. “Uhai” linaonyesha hoja inayounganisha damu na uhai.
- source_word: וְלֹא תֹאכַל
  choice: wala usile
  rationale: Muundo huu una nguvu ya katazo la kisheria. “Wala usile” unaendeleza katazo la kwanza kwa Kiswahili fasaha.
- source_word: הַנֶּפֶשׁ עִם הַבָּשָׂר
  choice: uhai pamoja na nyama
  rationale: Inahifadhi picha halisi na urudiaji wa “uhai”; “nyama” ni neno la kawaida katika muktadha wa kula na linawakilisha בשר kwa ufasaha.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika muktadha wa sheria ya chakula
  choice: uhai
  alternative: nafsi
  rationale: “Nafsi” ingeweza kueleweka kuwa sehemu isiyo ya kimwili iliyotenganishwa na mwili, jambo ambalo si lazima lidaiwe na Kiebrania hapa. Aya inaeleza katazo la damu kwa kuitambulisha damu na uhai wa kiumbe; “uhai” huhifadhi mantiki hiyo bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Kauli “hakikisha kabisa” inadumisha msisitizo wa agizo bila kutumia tafsiri ngumu isiyo ya kawaida ya nahau ya Kiebrania.
