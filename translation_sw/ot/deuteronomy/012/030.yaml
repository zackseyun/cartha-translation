  to: Jihadhari usije ukategwa kwa kufuata njia zao, baada ya wao kuangamizwa mbele yako; wala usije ukauliza kuhusu miungu yao, ukisema, “Mataifa haya yaliabuduje miungu yao, ili nami nifanye vivyo hivyo?”
