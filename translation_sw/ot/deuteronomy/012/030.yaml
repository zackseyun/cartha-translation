base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/030.yaml
  text: Be careful for yourself, lest you be ensnared after them, after they have been destroyed from before you, and lest you inquire about their gods, saying, “How did these nations serve their gods, so that I too may do the same?”
translation:
  language: sw
  text: Jihadhari usije ukategwa kwa kufuata njia zao, baada ya wao kuangamizwa mbele yako; wala usije ukauliza kuhusu miungu yao, ukisema, “Mataifa haya yaliabuduje miungu yao, ili nami nifanye vivyo hivyo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Jihadhari
  rationale: Kitenzi cha kujirejelea kinawasilisha onyo la mtu kujilinda mwenyewe kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: פֶּן תִּנָּקֵשׁ אַחֲרֵיהֶם
  choice: usije ukategwa na kufuata njia zao
  rationale: Nahau ya Kiebrania ina picha ya kunaswa au kutegwa kwa kuwafuata; ‘kufuata njia zao’ huweka wazi maana ya אַחֲרֵיהֶם bila kudokeza kufuata watu ambao tayari wameangamizwa.
- source_word: מִפָּנֶיךָ
  choice: mbele yako
  rationale: Huhifadhi taswira ya Kiebrania na inaeleweka katika muktadha wa watu kuondolewa mbele ya Israeli.
- source_word: תִדְרֹשׁ לֵאלֹהֵיהֶם
  choice: uulize habari za miungu yao
  rationale: דרש hapa ni kuchunguza au kuulizia namna miungu hiyo ilivyoabudiwa; tafsiri hii ni ya asili kwa Kiswahili.
- source_word: אֵיכָה יַעַבְדוּ
  choice: Mataifa haya yaliabuduje
  rationale: Wakati uliopita unafaa baada ya kutajwa kuangamizwa kwa mataifa hayo, huku ukihifadhi swali kuhusu desturi zao za ibada.
- source_word: וְאֶעֱשֶׂה כֵּן גַּם אָנִי
  choice: ili nami nifanye vivyo hivyo
  rationale: Huonyesha kusudi lililodokezwa la uchunguzi huo na kuhifadhi msisitizo wa גַּם אָנִי, ‘mimi pia’.
theological_decisions:
- issue: Kitu kinachokatazwa kuchunguzwa
  choice: ‘uulize habari za miungu yao’ katika muktadha wa kutaka kuiga ibada yao
  alternative: Katazo la kila aina ya kujifunza chochote kuhusu dini zao
  rationale: Muundo wa sentensi unaunganisha kuulizia na kusudi lililotamkwa, ‘ili nami nifanye vivyo hivyo’; tafsiri haipanui katazo kuliko ushahidi wa mstari.
- issue: Maana ya kunaswa ‘baada yao’
  choice: ‘ukategwa na kufuata njia zao’
  alternative: ‘ukategwa baada yao’
  rationale: Huhifadhi onyo la kuingia katika desturi zao za ibada bila kuleta utata usio wa lazima kwamba Israeli ingewafuata kimwili watu waliokwisha kuangamizwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili kwa usomaji wa kawaida, huku marudio ya onyo na mfuatano wa hoja ya Kiebrania vikihifadhiwa.
