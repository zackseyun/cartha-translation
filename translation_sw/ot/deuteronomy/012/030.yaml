  source_fidelity: Tafsiri inafuata kwa karibu onyo la Kiebrania, uharibifu wa mataifa «mbele yako», kuulizia miungu yao, na nia ya kuiga desturi zao. Hata hivyo, «Wala usiulize» hubadili onyo la פן (“usije...”) kuwa katazo la moja kwa moja; kurudia «usije» huhifadhi muundo na nguvu ya tahadhari ya chanzo.
  naturalness: Kiswahili ni cha kawaida, sanifu, na chenye hadhi. «Kuhusu miungu yao» ni mtiririko wa asili zaidi kuliko «habari za miungu yao» katika muktadha wa kuulizia namna ya ibada.
  terminology: «Jihadhari», «ukategwa», «miungu yao», na «kuabudu» ni istilahi sahihi na za asili. Ufafanuzi «kufuata njia zao» kwa usalama huwasilisha “kuwafuata” katika muktadha wa desturi za ibada, bila kuleta maana ya kuwafuata watu kimwili.
