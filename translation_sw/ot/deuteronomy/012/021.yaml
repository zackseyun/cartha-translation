language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּֽי יִרְחַ֨ק מִמְּ/ךָ֜ הַ/מָּק֗וֹם אֲשֶׁ֨ר יִבְחַ֜ר יְהוָ֣ה אֱלֹהֶי/ךָ֮ לָ/שׂ֣וּם שְׁמ֣/וֹ שָׁם֒ וְ/זָבַחְתָּ֞ מִ/בְּקָרְ/ךָ֣ וּ/מִ/צֹּֽאנְ/ךָ֗ אֲשֶׁ֨ר נָתַ֤ן יְהוָה֙ לְ/ךָ֔ כַּ/אֲשֶׁ֖ר צִוִּיתִ֑/ךָ וְ/אָֽכַלְתָּ֙ בִּ/שְׁעָרֶ֔י/ךָ בְּ/כֹ֖ל אַוַּ֥ת נַפְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/021.yaml
  text: If the place that Yahweh your God chooses to put his name there is too far from you[a], then you may slaughter from your herd and from your flock that Yahweh has given you, as I have commanded you[b], and you may eat within your gates according to all the desire of your soul.
translation:
  language: sw
  text: Ikiwa mahali pale ambapo Yahwe Mungu wako atachagua kuweka jina lake ni mbali nawe, unaweza kuchinja kutoka katika mifugo yako ya ng’ombe, kondoo na mbuzi, ambayo Yahwe amekupa, kama nilivyokuamuru, na unaweza kula katika miji yako[a] kadiri ya hamu yote ya nafsi yako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “ndani ya malango yako,” yaani katika miji au makazi yako.
    reason: lexical_alternative
  - marker: b
    text: Au “kadiri ya hamu yako yote ya kula” au “chochote unachotamani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ikiwa
  rationale: Katika sheria hii neno hili linaanzisha hali ya masharti, si sababu.
- source_word: יִרְחַק מִמְּךָ
  choice: ni mbali nawe
  rationale: Huhifadhi maana ya msingi ya kuwa mbali bila kuongeza wazi kiwango kisichotajwa katika Kiebrania.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ
  choice: mahali pale ambapo Yahwe Mungu wako atachagua
  rationale: Wakati ujao unasikika kwa kawaida katika Kiswahili kwa uchaguzi wa mahali unaotazamiwa katika hotuba hii ya Musa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: kuweka jina lake
  rationale: Ni tafsiri ya moja kwa moja ya nahau ya Kiebrania, huku mahali panaporejelewa tayari pakiwa wazi katika sentensi.
- source_word: וְזָבַחְתָּ
  choice: unaweza kuchinja
  rationale: Muktadha unaruhusu uchinjaji wa kawaida kwa ajili ya chakula; ‘kuchinja’ huepuka kudokeza dhabihu ya mahali hapo.
- source_word: מִבְּקָרְךָ וּמִצֹּאנְךָ
  choice: baadhi ya ng’ombe, kondoo na mbuzi wako
  rationale: בקר ni kundi la ng’ombe, na צאן ni jina la jumla linaloweza kujumuisha kondoo na mbuzi; ‘baadhi ya’ huwasilisha nguvu ya kihusishi מִן.
- source_word: כַּאֲשֶׁר צִוִּיתִךָ
  choice: kama nilivyokuamuru
  rationale: Huhifadhi nafsi ya kwanza ya Musa na kurejelea maagizo aliyokwisha kutoa.
- source_word: בִּשְׁעָרֶיךָ
  choice: katika miji yako
  rationale: ‘Malango yako’ ni tashbihi ya Kiebrania kwa miji au makazi ya mtu; Kiswahili cha kawaida huwasilisha maana hiyo kama ‘miji yako.’
- source_word: בְּכֹל אַוַּת נַפְשֶׁךָ
  choice: kadiri ya hamu yote ya nafsi yako
  rationale: Huhifadhi picha ya Kiebrania ya hamu ya נֶפֶשׁ, ingawa katika muktadha hamu hiyo pia inaweza kueleweka kuwa hamu ya kula.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina la agano la Mungu moja kwa moja; kulitohowa huhifadhi tofauti kati kati ya jina binafsi na cheo.
- issue: Asili ya uchinjaji unaoruhusiwa
  choice: kuchinja kwa chakula, si kutoa dhabihu ya eneo hilo
  alternative: kutoa dhabihu
  rationale: Muktadha wa Kumbukumbu la Torati 12 unatofautisha dhabihu zinazofikishwa mahali teule na nyama inayoweza kuchinjwa na kuliwa katika miji kwa sababu mahali hapo ni mbali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa karibu na Kiebrania, lakini ‘katika miji yako’ na majina mahsusi ya wanyama yametumiwa kwa uwazi wa kawaida. Alama zote za tanbihi zimewekwa mahali zinapohusika katika matini.
