  text: You shall not eat it[a]; you shall pour it out on the ground like water.
translation:
  language: sw
  text: Usiile[a]; uimwage ardhini kama maji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, damu ya mnyama aliyechinjwa, kama inavyoelezwa katika muktadha unaozunguka mstari huu.
