lexical_decisions:
- source_word: לֹא תֹּאכְלֶנּוּ
  choice: Usiile
  rationale: Muundo wa kukataza katika nafsi ya pili umoja, pamoja na kiambishi cha yambwa -i-, unahifadhi maana ya ‘usiile’ na kurejelea damu iliyotajwa katika muktadha.
- source_word: עַל הָאָרֶץ
  choice: chini
  rationale: Katika agizo hili la kimatendo, הָאָרֶץ humaanisha uso wa ardhi; ‘chini’ ni Kiswahili cha kawaida na cha asili kwa kumwaga kitu ardhini.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: uimwage
  rationale: Kitenzi שׁפך kinaeleza kumimina au kumwaga; ‘uimwage’ huhifadhi agizo na kiwakilishi cha kitu kinachorejelewa.
- source_word: כַּמָּיִם
  choice: kama maji
  rationale: Huhifadhi tashbihi ya Kiebrania kwa namna ya kawaida katika Kiswahili.
theological_decisions:
- issue: Kirejelewa cha viambishi vya yambwa
  choice: Viambishi katika ‘usiile’ na ‘uimwage’ vinarejelea damu iliyotajwa katika muktadha, bila kurudia neno ‘damu’ katika matini kuu.
  alternative: Kusema wazi ‘usiile damu’ na ‘uimwage damu’ kwa ajili ya ufafanuzi.
  rationale: Kiebrania kinatumia viambishi vya kiwakilishi badala ya kurudia nomino. Tafsiri inahifadhi muundo huo huku tanbihi ikifafanua kirejelewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye sauti ya kisheria lakini ya kawaida na inayoeleweka. ‘Usiile’ ni ya moja kwa moja na yenye hadhi; ‘uimwage chini kama maji’ ni usemi wa asili usioongeza maelezo yasiyomo katika chanzo.
