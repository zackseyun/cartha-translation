  terminology: “Yahwe” hudumisha jina la Mungu. “Jambo la kuchukiza ambalo Yahwe hulichukia” hutoa kwa kawaida maana ya תּוֹעֲבַת יְהוָה אֲשֶׁר שָׂנֵא bila kudai kimakosa kwamba chukizo hilo ni mali ya Yahwe; pia huhifadhi uzito wa tathmini ya Yahwe.
