  edition: WLC
  text: לֹא תַעֲשֶׂ֣ה כֵ֔ן לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּי֩ כָּל תּוֹעֲבַ֨ת יְהוָ֜ה אֲשֶׁ֣ר שָׂנֵ֗א עָשׂוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם כִּ֣י גַ֤ם אֶת בְּנֵי/הֶם֙ וְ/אֶת בְּנֹ֣תֵי/הֶ֔ם יִשְׂרְפ֥וּ בָ/אֵ֖שׁ לֵֽ/אלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/031.yaml
  text: You shall not do so to Yahweh your God[a], for they have done for their gods every abomination of Yahweh that he hates, for they even burn their sons and their daughters in the fire for their gods.
translation:
  language: sw
  text: Usifanye hivyo kwa Yahwe, Mungu wako, kwa maana wamefanya kwa ajili ya miungu yao kila jambo la kuchukiza ambalo Yahwe hulichukia; kwa maana hata huwachoma wana wao wa kiume na binti zao motoni kwa ajili ya miungu yao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה כֵן לַיהוָה אֱלֹהֶיךָ
  choice: Usimfanyie hivyo Yahwe Mungu wako
  rationale: Amri hii ya kukataza inadumisha umoja wa nafsi ya pili na rejeo la nyuma kwa desturi za ibada zilizotajwa katika muktadha. ‘Kumfanyia hivyo’ ni Kiswahili cha kawaida kinachohifadhi uhusiano unaoonyeshwa na ל bila kuongeza kitenzi ‘kuabudu’ ambacho hakipo wazi katika Kiebrania.
- source_word: כָּל תּוֹעֲבַת יְהוָה אֲשֶׁר שָׂנֵא
  choice: kila chukizo la Yahwe analolichukia
  rationale: ‘Chukizo’ linahifadhi uzito mkubwa wa תּוֹעֵבָה, na ‘analolichukia’ linaonyesha wazi tathmini binafsi ya Yahwe katika שָׂנֵא. Muundo ‘la Yahwe’ unadumisha kwa ukaribu hali ya uambatano ya Kiebrania, huku tanbihi ikitoa usemi wa kawaida zaidi.
- source_word: עָשׂוּ לֵאלֹהֵיהֶם
  choice: wameifanyia miungu yao
  rationale: Wakati timilifu unaonyesha desturi zilizofanywa na mataifa hayo na zenye umuhimu katika onyo hili. Kiambishi ‘-fanyia’ kinaonyesha matendo yaliyolengwa kwa miungu hiyo katika muktadha wa ibada.
- source_word: כִּי גַם
  choice: kwa maana hata
  rationale: ‘Kwa maana’ linadumisha kazi ya כִּי ya kutoa sababu, na ‘hata’ linabeba msisitizo wa גַם kabla ya mfano wa kutisha unaofuata.
- source_word: אֶת בְּנֵיהֶם וְאֶת בְּנֹתֵיהֶם
  choice: wana wao wa kiume na binti zao
  rationale: Tafsiri inahifadhi kutajwa kwa watoto wa kiume na wa kike badala ya kuwakusanya wote chini ya neno la jumla ‘watoto’.
- source_word: יִשְׂרְפוּ בָאֵשׁ
  choice: huwateketeza motoni
  rationale: ‘Hu-’ linaonyesha tendo la kimazoea, na ‘motoni’ linaonyesha kuchomwa halisi kwa moto. ‘Kutekeza’ hapa linaweka wazi ukali na matokeo ya tendo hilo.
- source_word: לֵאלֹהֵיהֶם
  choice: kwa ajili ya miungu yao
  rationale: Usemi huu unaonyesha mwelekeo wa kiibada au kujitolea kwa miungu hiyo bila kuingiza maelezo ya ziada kuhusu mfumo wa ibada.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Jina la agano lililoandikwa moja kwa moja katika matini linatolewa kama ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
- issue: Uzito wa maadili katika תּוֹעֵבָה na שָׂנֵא
  choice: chukizo ... analolichukia
  alternative: jambo linalomchukiza ... asilolipenda
  rationale: Maneno makali ya Kiebrania yanahifadhiwa bila kupunguzwa kuwa kutopendezwa kwa kiwango kidogo, wala kuongezewa madai ya kimadhehebu.
- issue: Uhusiano katika תּוֹעֲבַת יְהוָה
  choice: chukizo la Yahwe
  alternative: jambo linalomchukiza Yahwe
  rationale: Muundo mkuu unahifadhi uambatano wa Kiebrania na hivyo kutosuluhisha kimya kimya kama ni umilikaji au uhusiano; tanbihi inatoa maana ya kimahusiano iliyo ya kawaida zaidi katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha marudio ya ‘kwa maana’ ya matini ya Kiebrania na lugha kali kuhusu dhabihu ya watoto, huku ikiepuka istilahi za kimadhehebu.
