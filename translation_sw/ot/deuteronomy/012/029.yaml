  text: כִּֽי יַכְרִית֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת הַ/גּוֹיִ֗ם אֲשֶׁ֨ר אַתָּ֥ה בָא שָׁ֛מָּ/ה לָ/רֶ֥שֶׁת אוֹתָ֖/ם מִ/פָּנֶ֑י/ךָ וְ/יָרַשְׁתָּ֣ אֹתָ֔/ם וְ/יָשַׁבְתָּ֖ בְּ/אַרְצָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/029.yaml
  text: When Yahweh your God cuts off the nations before you, which you are going in there to dispossess, and you dispossess them and dwell in their land,
translation:
  language: sw
  text: Yahwe Mungu wako atakapoyakatilia mbali mbele yako mataifa ambayo unaingia huko ili kuyanyang’anya nchi, nawe ukiisha kuyanyang’anya nchi na kukaa katika nchi yao,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: atakapo-
  rationale: Hapa neno hili linaanzisha hali ya wakati ujao inayotangulia onyo la mstari unaofuata; muundo wa Kiswahili wa ‘atakapo-’ unaonyesha maana hiyo ya wakati kwa ufasaha.
- source_word: יַכְרִית
  choice: atakapoyakatilia mbali
  rationale: Hifili ya כרת ina maana ya kuyaondoa au kuyatokomeza mataifa mbele ya Israeli. ‘Kuyakatilia mbali’ inadumisha picha ya msingi bila kudai wazi maangamizi kamili kuliko maandishi yanavyosema.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi ‘Yahwe,’ badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huu ni muundo wa umilikishi wa nafsi ya pili umoja, katika kauli ya agano ‘Yahwe Mungu wako.’
- source_word: הַגּוֹיִם
  choice: mataifa
  rationale: ‘Mataifa’ ni tafsiri ya moja kwa moja na ya kawaida ya גוים katika muktadha huu, ikiwataja watu waliokaa katika nchi.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: ambayo unaingia huko
  rationale: Kishazi hiki kinarejelea mataifa, na ‘unaingia huko’ kinahifadhi kitenzi cha kuja/kuingia pamoja na kielezi ‘huko’ huku kikibaki cha kawaida kwa Kiswahili.
- source_word: לָרֶשֶׁת אֹתָם
  choice: ili kuyanyang’anya nchi
  rationale: ירש hapa ni kuchukua nchi kwa kuwaondoa waliomo. Kwa kuwa Kiswahili hakiwezi kwa urahisi kusema ‘kuyanyang’anya mataifa’ kwa maana hii, ‘kuyanyang’anya nchi’ huwasilisha kwamba mataifa hayo yanaondolewa katika milki yao.
- source_word: מִפָּנֶיךָ
  choice: yaliyo mbele yako
  rationale: Hii inatunza nahau ya Kiebrania ya kuondolewa mbele au katika njia ya Israeli.
- source_word: וְיָרַשְׁתָּ אֹתָם
  choice: nawe ukiisha kuyanyang’anya nchi
  rationale: Kurudia ‘kuyanyang’anya nchi’ kunatunza ulinganifu na kitenzi kilichotangulia; ‘ukiisha’ huonyesha kukamilika kwa tendo kabla ya kukaa nchini.
- source_word: וְיָשַׁבְתָּ בְּאַרְצָם
  choice: na kukaa katika nchi yao
  rationale: ‘Kukaa’ ni neno la kawaida, lenye hadhi, linaloweza kumaanisha kuishi au kufanya makao katika nchi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina binafsi la agano. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza fundisho la dhehebu.
- issue: Kiwango cha uharibifu kinachodokezwa na יַכְרִית
  choice: kuyakatilia mbali
  alternative: kuyaangamiza; kuyafuta kabisa
  rationale: Chaguo hili linaonyesha kuondolewa kwa mataifa mbele ya Israeli lakini halitatui kimyakimya swali la kama kila mtu anaangamizwa kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeachwa ikiishia kwa koma kwa sababu mstari huu ni kishazi cha utangulizi kinachoendelea katika Kumbukumbu la Torati 12:30.
