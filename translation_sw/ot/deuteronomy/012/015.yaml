  to: Lakini kila unapoitamani[a], unaweza kuchinja na kula nyama kwa kadiri ya baraka ambayo Yahwe Mungu wako amekupa, popote katika miji yako[b]. Watu walio najisi na watu walio safi wanaweza kuila, kama wanavyokula nyama ya swala au ya kulungu.
