id: DEU.12.15
reference: Deuteronomy 12:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: רַק֩ בְּ/כָל אַוַּ֨ת נַפְשְׁ/ךָ֜ תִּזְבַּ֣ח וְ/אָכַלְתָּ֣ בָשָׂ֗ר כְּ/בִרְכַּ֨ת יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֲשֶׁ֥ר נָֽתַן לְ/ךָ֖ בְּ/כָל שְׁעָרֶ֑י/ךָ הַ/טָּמֵ֤א וְ/הַ/טָּהוֹר֙ יֹאכְלֶ֔/נּוּ כַּ/צְּבִ֖י וְ/כָ/אַיָּֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/015.yaml
  text: But whenever your soul desires[a], you may slaughter and eat meat, according to the blessing of Yahweh your God that he has given you, within all your gates. The unclean and the clean alike may eat it[b], as they would the gazelle or the deer.
translation:
  language: sw
  text: Lakini kila unapoitamani[a], unaweza kuchinja na kula nyama kwa kadiri ya baraka ambayo Yahwe Mungu wako amekupa, popote katika miji yako[b]. Watu walio najisi na watu walio safi wanaweza kuila, kama wanavyokula nyama ya swala au ya kulungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “katika kila tamaa ya nafsi yako”; yaani, kila unapoitamani.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “katika malango yako yote.” Hii ni nahau inayomaanisha katika miji au makazi yako.
    reason: cultural_note
lexical_decisions:
- source_word: רַק
  choice: Lakini
  rationale: Neno hili linaonyesha kizuizi au ufafanuzi unaotofautisha ruhusa hii na amri iliyotangulia; “Lakini” ni ya kawaida na yenye nguvu hiyo katika Kiswahili.
- source_word: בְּכָל אַוַּת נַפְשְׁךָ
  choice: kila unapoitamani
  rationale: Kirai cha Kiebrania ni halisi zaidi “katika kila tamaa ya nafsi yako.” Tafsiri hii inawasilisha kwa Kiswahili cha kawaida maana ya wakati wowote mtu anapotamani kula nyama, huku tanbihi ikihifadhi tamathali ya asili.
- source_word: תִּזְבַּח
  choice: unaweza kuchinja
  rationale: Katika muktadha huu kitenzi kinatoa ruhusa, wala si utabiri au amri ya lazima; “kuchinja” linafaa kwa kuua mnyama ili kupata chakula.
- source_word: וְאָכַלְתָּ בָשָׂר
  choice: na kula nyama
  rationale: בָשָׂר hapa ni nyama ya mnyama inayoliwa, hivyo “nyama” ni sawasawa na ya kawaida katika Kiswahili.
- source_word: כְּבִרְכַּת יְהוָה אֱלֹהֶיךָ אֲשֶׁר נָתַן לְךָ
  choice: kwa kadiri ya baraka ambayo Yahwe Mungu wako amekupa
  rationale: “Kwa kadiri ya” huhifadhi wazo la kipimo au ulinganifu lililo katika כְּ, na “baraka” huhifadhi nomino ya Kiebrania badala ya kuibadili kuwa kitenzi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni umbo la Kiswahili la jina la agano YHWH, na linahifadhi jina binafsi lililo katika matini.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: popote katika miji yako
  rationale: Halisi ni “katika malango yako yote,” lakini “malango” ni nahau ya Kiebrania inayomaanisha miji au makazi; “popote katika miji yako” hutoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: הַטָּמֵא וְהַטָּהוֹר
  choice: Aliye najisi na aliye safi
  rationale: Maneno haya yanaeleza hali ya kiibada, si tabia ya maadili. Muundo huu unahifadhi makundi yote mawili bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: יֹאכְלֶנּוּ
  choice: wanaweza kuila
  rationale: Muktadha unaonyesha ruhusa; kiambishi “-i-” kinarejelea nyama iliyotajwa.
- source_word: כַּצְּבִי וְכָאַיָּל
  choice: kama wanavyokula nyama ya swala au ya kulungu
  rationale: “Swala” na “kulungu” ni majina yanayoeleweka ya wanyama hawa. Kutaja “nyama ya” kunafanya wazi kwa Kiswahili kwamba ulinganisho unahusu namna ya kula wanyama hao, si kwamba walaji wanafananishwa na wanyama.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania ina jina binafsi la Mungu, YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuingiza tafsiri ya kimadhehebu.
- issue: Maana ya “najisi” na “safi”
  choice: Hali ya kiibada imeachwa katika istilahi za matini
  alternative: Kufafanua kuwa ni “najisi kiibada” na “safi kiibada” ndani ya mstari
  rationale: Muktadha wa sheria za chakula unaonyesha hali ya kiibada, lakini matini yenyewe hutumia tu istilahi “najisi” na “safi.” Kuzihifadhi huepuka kupanua mstari kupita kiasi huku kutotafsiri maneno hayo kama hukumu ya maadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia “popote katika miji yako” badala ya tafsiri halisi isiyo ya kawaida ya “malango,” huku tanbihi ikihifadhi nahau ya Kiebrania. “Aliye najisi na aliye safi” inadumisha msamiati wa kibiblia unaofahamika na tofauti ya hali ya kiibada.
