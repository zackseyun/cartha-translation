    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “katika malango yako yote.” Hii ni nahau inayomaanisha katika miji au makazi yako.
    reason: cultural_note
  revision_rationale: The sole revision removes a possible Swahili ambiguity by identifying the ritually unclean and ritually clean as two separate groups. It preserves the source's collective singular construction and its equal permission for both groups. Footnote anchors and their content remain valid.
