base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/026.yaml
  text: But only your holy things that belong to you[a], and your vow offerings, you shall carry and come to the place that Yahweh will choose.
translation:
  language: sw
  text: Lakini, isipokuwa vitu vyako vitakatifu ulivyo navyo na sadaka zako za nadhiri[a], utavichukua na kwenda mahali atakapochagua Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nadhiri zako”; Kiebrania kinaweza kumaanisha nadhiri zenyewe au, katika muktadha huu wa dhabihu, sadaka zinazoletwa ili kutimiza nadhiri hizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Lakini
  rationale: Katika muktadha huu neno linaweka mpaka kwa ruhusa zilizotangulia; “Lakini” linaonyesha tofauti hiyo kwa Kiswahili cha kawaida, huku wajibu unaofuata ukibeba maana ya upekee.
- source_word: קָדָשֶׁיךָ
  choice: vitu vyako vitakatifu
  rationale: Huhifadhi maana pana ya vitu vilivyotengwa kuwa vitakatifu bila kuvifafanua vyote kuwa aina moja maalumu ya sadaka.
- source_word: אֲשֶׁר יִהְיוּ לְךָ
  choice: ulivyo navyo
  rationale: Ni usemi wa kawaida unaowasilisha umilikaji au wajibu wa mwabudu kwa vitu hivyo.
- source_word: וּנְדָרֶיךָ
  choice: sadaka zako za nadhiri
  rationale: Ingawa kwa umbo ni “nadhiri zako,” katika muktadha wa dhabihu neno linaweza kumaanisha sadaka zinazoletwa kutimiza nadhiri; tanbihi inadumisha uwezekano wa maana halisi.
- source_word: תִּשָּׂא
  choice: utavichukua
  rationale: Huhifadhi tendo halisi la kubeba au kusafirisha vitu vitakatifu kuelekea mahali pa ibada.
- source_word: וּבָאתָ
  choice: na kwenda
  rationale: Kwa Kiswahili, “kwenda mahali” ni mtazamo wa kawaida wa safari kutoka alipo mwabudu; maana ya kufika au kuingia mahali hapo inadumishwa kwa kawaida.
- source_word: הַמָּקוֹם
  choice: mahali
  rationale: Huhifadhi usemi muhimu wa Kumbukumbu la Torati bila kuongeza neno kama “patakatifu” lisilokuwamo moja kwa moja hapa.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: atakapochagua Yahweh
  rationale: Wakati ujao unafaa kwa kauli hii inayotazamia uteuzi wa mahali; jina la agano יְהוָה limetafsiriwa “Yahweh.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya וּנְדָרֶיךָ katika muktadha wa dhabihu
  choice: sadaka zako za nadhiri
  alternative: nadhiri zako
  rationale: Muktadha unahusu vitu vinavyobebwa kwenda mahali pa ibada, hivyo maana halisi ya sadaka zinazotimiza nadhiri inafaa; hata hivyo, tanbihi inahifadhi utata wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida, huku istilahi “vitu vitakatifu,” “sadaka za nadhiri,” na jina “Yahweh” zikihifadhi upana na uzito wa maandishi ya chanzo.
