  text: וַ/אֲכַלְתֶּם שָׁ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וּ/שְׂמַחְתֶּ֗ם בְּ/כֹל֙ מִשְׁלַ֣ח יֶדְ/כֶ֔ם אַתֶּ֖ם וּ/בָתֵּי/כֶ֑ם אֲשֶׁ֥ר בֵּֽרַכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/007.yaml
  text: And there you shall eat before Yahweh your God[a], and you shall rejoice in all the work of your hand, you and your households, with which Yahweh your God has blessed you.
translation:
  language: sw
  text: Nanyi mtakula huko mbele za Yahwe, Mungu wenu, na mtafurahi katika kazi yote ya mikono yenu[a], ninyi pamoja na watu wa nyumba zenu, ambayo Yahwe, Mungu wako, amekubariki nayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shughuli zenu zote” au “kila jambo mnalolitia mkono.” Kwa neno halisi, nahau ya Kiebrania ni “kila utumaji wa mkono wenu,” yaani kila mnachofanya kwa mikono yenu.
    reason: Hutoa njia mbadala za kileksia na kufafanua taswira ya nahau ya Kiebrania kwa usahihi.
lexical_decisions:
- source_word: וַאֲכַלְתֶּם שָׁם
  choice: Nanyi mtakula huko
  rationale: Wakati ujao unafaa kwa kauli ya maagizo katika muktadha huu, na “huko” inadumisha rejeo la mahali atakapochagua Yahwe bila kulipanua.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: mbele za Yahwe Mungu wenu
  rationale: “Mbele za” ni usemi wa kawaida wa Kiswahili unaoonyesha kula katika uwepo wa Mungu; jina la agano יְהוָה limetoholewa kuwa “Yahwe.”
- source_word: וּשְׂמַחְתֶּם
  choice: na mtafurahia
  rationale: Kitenzi hiki kinaendeleza nguvu ya maagizo na wazo la furaha ya agano; “kufurahia” pia huunganika kwa kawaida na kazi iliyobarikiwa.
- source_word: בְּכֹל מִשְׁלַח יֶדְכֶם
  choice: kazi zote za mikono yenu
  rationale: Huu ni usemi wa Kiebrania kuhusu shughuli, juhudi, au mambo mtu anayofanya. Tafsiri hii inadumisha taswira ya mkono huku ikiwa wazi na ya kawaida kwa wasomaji wa Kiswahili.
- source_word: אַתֶּם וּבָתֵּיכֶם
  choice: ninyi pamoja na watu wa nyumba zenu
  rationale: בָּתִּים hapa humaanisha kaya, si majengo. “Watu wa nyumba zenu” huonyesha kwa uwazi familia na wengine wa kaya wanaoshiriki.
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: ambazo Yahwe Mungu wako amekubariki kwazo
  rationale: Kishazi hiki kinahusisha baraka ya Mungu na kazi au shughuli hizo. Umoja wa “Mungu wako” na “amekubariki” unadumisha badiliko la Kiebrania kutoka wingi kwenda umoja wa kimkusanyiko.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandiko ya Kiebrania yanatumia moja kwa moja jina la agano; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Badiliko kutoka wingi kwenda umoja katika kumsemesha Israeli
  choice: Kudumisha wingi katika maagizo na umoja katika kishazi cha mwisho
  alternative: Kusawazisha viwakilishi vyote viwe vya wingi au vyote viwe vya umoja
  rationale: Kiebrania kinasema kwanza na kundi kwa wingi, kisha kinamwelekea Israeli kwa umoja wa kimkusanyiko. Kudumisha badiliko hilo kunahifadhi mtindo na mvutano wa matini.
- issue: Uhusiano wa kishazi cha baraka na kazi za mikono
  choice: Yahwe amewabariki kupitia au katika kazi hizo
  alternative: Kufurahi kwa sababu tu Yahwe amewabariki
  rationale: אֲשֶׁר inaweza kuwa na uhusiano wenye unyumbufu, lakini muundo wa karibu zaidi unakiunganisha kishazi cha baraka na מִשְׁלַח יֶדְכֶם. “Kwazo” hudumisha uhusiano huo bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. “Mbele za” na “watu wa nyumba zenu” ni miundo ya asili na inayoeleweka. Badiliko la wingi kwenda umoja limehifadhiwa kimakusudi.
