  text: כִּ֡י אִם לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ תֹּאכְלֶ֗/נּוּ בַּ/מָּקוֹם֙ אֲשֶׁ֨ר יִבְחַ֜ר יְהוָ֣ה אֱלֹהֶי/ךָ֮ בּ/וֹ֒ אַתָּ֨ה וּ/בִנְ/ךָ֤ וּ/בִתֶּ֨/ךָ֙ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ֔/ךָ וְ/הַ/לֵּוִ֖י אֲשֶׁ֣ר בִּ/שְׁעָרֶ֑י/ךָ וְ/שָׂמַחְתָּ֗ לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל מִשְׁלַ֥ח יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/018.yaml
  text: Instead[b][a], you shall eat it before Yahweh your God in the place that Yahweh your God will choose—you and your son and your daughter and your male servant and your female servant and the Levite who is within your gates—and you shall rejoice before Yahweh your God in all to which you put your hand.
translation:
  language: sw
  text: Bali utakula vitu hivyo mbele za Yahwe, Mungu wako, mahali atakapochagua Yahwe, Mungu wako—wewe, mwanao wa kiume, binti yako, mtumishi wako wa kiume, mtumishi wako wa kike, na Mlawi aliye katika miji yako[a]—nawe utafurahi mbele za Yahwe, Mungu wako, katika kila jambo unalolifanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “aliye ndani ya malango yako,” yaani, aliye katika mji au jumuiya yako.'
    reason: cultural_note
  - marker: b
    text: 'Kiebrania, kwa neno halisi: “katika kila utumaji wa mkono wako”; yaani, katika yote unayofanya au kuyashughulikia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Bali
  rationale: 'Katika muktadha huu, kirai kinaweka tofauti yenye ukomo dhidi ya katazo la mstari uliotangulia: si huko, bali katika mahali atakapochagua Yahwe. “Bali” ni ya kawaida na yenye hadhi katika Kiswahili.'
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: mbele za Yahwe Mungu wenu
  rationale: “Mbele za” huhifadhi maana ya kuwa mbele au katika uwepo wa Mungu. Ingawa Kiebrania kinatumia nafsi ya pili umoja, wingi wa Kiswahili unasomeka kwa kawaida kama agizo kwa jamii bila kubadili walioorodheshwa.
- source_word: תֹּאכְלֶנּוּ
  choice: mtakula vitu hivyo
  rationale: Kiambishi cha kitu cha umoja katika Kiebrania kinarejelea kwa ujumla vitu vya ibada vilivyotajwa katika mstari uliotangulia. “Vitu hivyo” huweka rejeo hilo wazi kwa Kiswahili bila kulifafanua zaidi.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר ... בּוֹ
  choice: mahali atakapochagua
  rationale: Hii ni lugha ya kawaida ya Kumbukumbu la Torati kuhusu mahali pa ibada atakapochagua Mungu. Kirejeshi בּוֹ kinaeleweka ndani ya muundo wa Kiswahili na hakihitaji kutafsiriwa kando.
- source_word: אַתָּה וּבִנְךָ וּבִתֶּךָ
  choice: ninyi, wana wenu wa kiume na wa kike
  rationale: Orodha ya familia imehifadhiwa. “Wana ... wa kiume na wa kike” ni ya sasa na inabainisha jinsia zote kama ilivyo katika Kiebrania.
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: watumishi wenu wa kiume na wa kike
  rationale: Tafsiri hii huhifadhi utofauti wa mtumishi wa kiume na wa kike kwa lugha ya sasa isiyo ya kizamani.
- source_word: וְהַלֵּוִי אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: Mlawi aliye katika miji yenu
  rationale: “Katika malango yako” ni nahau ya Kiebrania inayomaanisha maeneo ya makazi yaliyo chini ya jamii husika. “Katika miji yenu” huwasilisha maana hiyo kwa uwazi; tanbihi huhifadhi picha halisi ya chanzo.
- source_word: וְשָׂמַחְתָּ
  choice: nanyi mtafurahi
  rationale: Kitenzi kinaeleza furaha hai ya sherehe mbele za Mungu. “Mtafurahi” ni ya asili na huhifadhi nguvu ya agizo katika muktadha.
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: katika kila kazi ya mikono yenu
  rationale: Kifungu halisi kinahusu yote ambayo mkono unaelekezwa kuyafanya. “Kila kazi ya mikono yenu” huhifadhi taswira ya Kiebrania huku kikieleweka kwa Kiswahili; tanbihi inaeleza upana wa nahau.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina maalumu la agano, YHWH. “Yahwe” hulitambulisha kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kula “mbele za Yahwe”
  choice: mbele za Yahwe
  alternative: katika uwepo wa Yahwe
  rationale: “Mbele za” huhifadhi tamathali ya chanzo na pia wazo la uwepo wa Mungu bila kuamua zaidi namna ya uwepo huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Wingi umetumiwa katika hotuba kwa sababu unasikika kwa kawaida katika Kiswahili kwa agizo linaloihusu jamii; orodha ya washiriki na tofauti za kijinsia zimehifadhiwa. Alama zote za tanbihi zimo katika matini kuu.
