base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/003.yaml
  text: You shall tear down their altars[a], shatter their sacred pillars, burn their Asherah poles with fire, cut down the carved images of their gods[c][b], and destroy their name from that place.
translation:
  language: sw
  text: Mtabomoa madhabahu zao, mtazivunja nguzo zao za ibada, mtaziteketeza kwa moto nguzo zao za Ashera[a], mtazikata sanamu zilizochongwa za miungu yao[b], na mtaangamiza jina lao kutoka mahali hapo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Maashera yao” au “nguzo zao takatifu.” Neno la Kiebrania linataja vitu vya ibada vilivyohusishwa na Ashera.
    reason: lexical_alternative
  - marker: b
    text: Au “sanamu za ibada za miungu yao.” Kiebrania “sanamu zilizochongwa” kinakazia kwamba vitu hivyo vya kuabudiwa vilikuwa vimetengenezwa kwa kuchongwa.
    reason: lexical_alternative
  - marker: c
    text: “Kuangamiza jina lao” kunamaanisha kuondoa kumbukumbu na uwepo wao wa kiibada kutoka mahali hapo.
    reason: cultural_note
lexical_decisions:
- source_word: נִתַּצְתֶּם
  choice: mtazibomoa
  rationale: Kitenzi hiki humaanisha kubomoa au kuangusha miundo; “kubomoa” ni Kiswahili cha kawaida na kinafaa kwa madhabahu zilizojengwa.
- source_word: מִזְבּחֹתָם
  choice: madhabahu zao
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa madhabahu, huku kiambishi cha umilikaji cha wingi kikihifadhiwa.
- source_word: שִׁבַּרְתֶּם
  choice: mtazivunjavunja
  rationale: Umbo la kitenzi linaonyesha kuvunja kwa nguvu; “vunja-vunja” linafikisha uzito wa kuvunjwa kabisa bila kutumia lugha ya kizamani.
- source_word: מַצֵּבֹתָם
  choice: nguzo zao za ibada
  rationale: מַצֵּבָה ni jiwe au nguzo iliyosimamishwa kwa matumizi ya kidini. “Nguzo za ibada” inaeleza kitu hicho na kazi yake kwa lugha inayoeleweka.
- source_word: אֲשֵׁרֵיהֶם
  choice: nguzo zao za Ashera
  rationale: Neno hilo linataja vitu vya ibada vilivyohusishwa na Ashera. Tafsiri hii huhifadhi jina maalumu na haivilazimishi maana kuwa vichaka kwa ujumla.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: mtaziteketeza kwa moto
  rationale: “Kwa moto” hudumisha kutajwa wazi kwa moto katika Kiebrania; “teketeza” huonyesha kuchomwa kabisa na ni ya kawaida katika muktadha huu.
- source_word: פְסִילֵי אֱלֹהֵיהֶם
  choice: sanamu za kuchonga za miungu yao
  rationale: פֶסֶל hutaja sanamu iliyotengenezwa kwa kuchongwa. Kauli hii huhifadhi hali yake ya kuwa kitu kilichotengenezwa badala ya kutumia tu neno la jumla “sanamu za ibada.”
- source_word: תְּגַדֵּעוּן
  choice: mtazikata
  rationale: גדע humaanisha kukata au kuangusha kwa kukata. “Kukata” kinafaa kwa vitu hivi vya ibada na hakiongezi maelezo yasiyomo katika Kiebrania.
- source_word: וְאִבַּדְתֶּם אֶת שְׁמָם
  choice: kulifuta jina lao
  rationale: Nahau hiyo inaonyesha kuondoa jina, kumbukumbu, na uwepo wao wa kiibada. “Kulifuta jina lao” huhifadhi taswira ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: מִן הַמָּקוֹם הַהוּא
  choice: mahali hapo
  rationale: Kiswahili hutumia “mahali hapo” kwa kawaida kueleza kuondolewa kwa kitu kutoka eneo lililotajwa; maana ya chanzo cha Kiebrania inabaki wazi katika muktadha.
theological_decisions:
- issue: Maana ya אֲשֵׁרֵיהֶם katika ibada ya Wakanaani
  choice: nguzo zao za Ashera
  alternative: Maashera yao; nguzo zao takatifu
  rationale: Tafsiri hii huhifadhi uhusiano maalumu na Ashera huku ikitambua kuwa kinacholengwa hapa ni vitu vya ibada, si lazima mungu wa kike mwenyewe.
- issue: Uwakilishi wa פְסִילֵי אֱלֹהֵיהֶם
  choice: sanamu za kuchonga za miungu yao
  alternative: sanamu zao za ibada
  rationale: Kiebrania kinasisitiza kwamba vitu hivyo vilitengenezwa kwa kuchongwa. Tafsiri iliyochaguliwa huhifadhi uhalisi huo bila kuongeza hukumu ya kitheolojia isiyotajwa moja kwa moja katika neno lenyewe.
- issue: Maana ya kufuta jina lao
  choice: Nahau ya “kulifuta jina lao” imehifadhiwa katika matini
  alternative: kuondoa kumbukumbu na uwepo wao wa kiibada
  rationale: “Jina” linaweza kuwakilisha kumbukumbu, kutambuliwa, na uwepo wa kiibada wa miungu hiyo katika eneo hilo. Matini haifafanui zaidi, kwa hiyo nahau imehifadhiwa na maelezo yametolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Mfuatano wa amri na nguvu ya vitendo vya Kiebrania umehifadhiwa. Maneno maalumu ya mazingira ya ibada yameelezwa kwa ufupi bila kuingiza msimamo wa kimadhehebu.
