base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/001.yaml
  text: These are the statutes and the judgments that you shall be careful to do in the land that Yahweh[a], the God of your fathers, has given you to possess[c][b], all the days that you are living on the earth.
translation:
  language: sw
  text: Hizi ndizo sheria na hukumu mnazopaswa kuzingatia na kutekeleza katika nchi ambayo Yahwe, Mungu wa babu zako, amekupa ili uimiliki, siku zote mtakazoishi duniani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “juu ya ardhi.” Neno la Kiebrania linaweza kumaanisha ardhi au nchi kwa maana finyu zaidi, badala ya dunia kwa upana.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הַחֻקִּים וְהַמִּשְׁפָּטִים
  choice: Haya ndiyo masharti na hukumu
  rationale: “Masharti” linaonyesha matakwa yaliyowekwa, huku “hukumu” likidumisha tofauti ya kileksia na מִשְׁפָּטִים katika muktadha wa kisheria.
- source_word: אֲשֶׁר תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: mnazopaswa kuzingatia na kutekeleza
  rationale: Muundo שׁמר + kitenzi-jina unaunganisha uangalifu katika kuyashika na utiifu wa kuyatenda; “kuzingatia na kutekeleza” ni Kiswahili cha sasa na cha asili kinachobeba pande zote mbili.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: Katika muktadha huu אֶרֶץ ni nchi ambayo Israeli anapewa, si dunia kwa ujumla.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa moja kwa moja kwa tahajia inayotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: Mungu wa babu zako
  rationale: Huhifadhi msemo wa agano na kiambishi cha nafsi ya pili umoja katika Kiebrania.
- source_word: לְרִשְׁתָּהּ
  choice: ili uimiliki
  rationale: Katika muktadha wa nchi, ירשׁ lina maana ya kuingia katika umiliki na kuimiliki; umoja wa “u-” unahifadhi mabadiliko ya idadi yaliyopo katika Kiebrania.
- source_word: כָּל הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים
  choice: siku zote mtakazoishi
  rationale: Hutoa maana ya muda wote wa maisha na huhifadhi nafsi ya pili wingi ya אַתֶּם.
- source_word: עַל הָאֲדָמָה
  choice: duniani
  rationale: Hapa אֲדָמָה linaweza kueleweka kwa upana kama uso wa dunia; tafsiri hii pia huepuka kurudia tu “katika nchi,” huku tanbihi ikihifadhi uwezekano finyu zaidi.
theological_decisions:
- issue: Uwakilishi wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu; kulinakili kama “Yahwe” huhifadhi jina hilo badala ya kuliweka kama cheo.
- issue: Mabadiliko kutoka nafsi ya pili umoja kwenda wingi
  choice: “babu zako … amekupa … uimiliki,” kisha “mtakazoishi”
  alternative: Kusawazisha aya yote iwe umoja au wingi
  rationale: Kiebrania hubadilika kutoka umoja katika אֲבֹתֶיךָ, לְךָ na לְרִשְׁתָּהּ kwenda wingi katika אַתֶּם; tafsiri inadumisha mvutano huo wa kisarufi badala ya kuufuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umedumisha sajili ya kisheria bila kutumia lugha nzito isiyo ya kawaida, na umehifadhi mabadiliko ya Kiebrania kutoka umoja kwenda wingi.
