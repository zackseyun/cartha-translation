base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/020.yaml
  text: When the LORD your God enlarges your territory, as he has promised you, and you say, “I want to eat meat,” because you crave to eat meat, you may eat meat according to all the desire of your soul.
translation:
  language: sw
  text: BWANA Mungu wako atakapopanua mipaka yako, kama alivyokuahidi, nawe ukasema, “Nataka kula nyama,” kwa sababu unatamani kula nyama, unaweza kula nyama kadiri ya tamaa yote ya nafsi yako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: BWANA
  rationale: Uwakilishi wa kawaida na wenye heshima wa jina la agano katika tafsiri za Kiswahili; herufi kubwa zinaonyesha kuwa chanzo ni jina la Mungu.
- source_word: יַרְחִיב ... אֶת־גְּבוּלְךָ
  choice: atakapopanua mipaka yako
  rationale: Hutoa maana ya kupanuliwa kwa eneo la nchi kwa Kiswahili cha kawaida, huku muundo wa wakati ukilingana na muktadha wa hali ya baadaye.
- source_word: וְאָמַרְתָּ אֹכְלָה בָשָׂר
  choice: nawe ukasema, “Nataka kula nyama”
  rationale: Ingawa אֹכְלָה kwa umbo ni kohortativi, hapa inaeleza nia au hamu; “Nataka kula” ni ya asili zaidi kuliko “Nitakula” katika muktadha huu.
- source_word: תְאַוֶּה נַפְשְׁךָ
  choice: unatamani
  rationale: Nahau ya Kiebrania yenye nafsi kama mwenye kutamani imetolewa kwa kitenzi cha kawaida cha Kiswahili bila kupoteza nguvu ya hamu.
- source_word: בְּכָל אַוַּת נַפְשְׁךָ
  choice: kadiri ya tamaa yote ya nafsi yako
  rationale: Inahifadhi marudio ya נֶפֶשׁ na msisitizo wa chanzo, pamoja na ladha ya usemi wa Kiebrania.
- source_word: תֹּאכַל בָּשָׂר
  choice: unaweza kula nyama
  rationale: Kauli ya Kiebrania katika muktadha huu ina nguvu ya ruhusa, si utabiri au amri tu.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: “BWANA” ni desturi iliyoenea na inayoeleweka katika Biblia za Kiswahili; haiongezi msimamo wa kimadhehebu, huku matumizi ya herufi kubwa yakitofautisha jina hili.
- issue: Maana ya ruhusa katika תֹּאכַל
  choice: unaweza kula
  alternative: utakula
  rationale: Muktadha wa sheria unaonyesha ruhusa ya kula nyama baada ya kupanuliwa kwa mipaka; tafsiri hii haigeuzi ruhusa kuwa wajibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha marudio ya “nyama” yaliyomo katika Kiebrania na inahifadhi usemi “nafsi yako” katika kishazi cha mwisho ili kuonyesha msisitizo wa chanzo.
