  text: וַ/עֲבַרְתֶּם֮ אֶת הַ/יַּרְדֵּן֒ וִֽ/ישַׁבְתֶּ֣ם בָּ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם מַנְחִ֣יל אֶתְ/כֶ֑ם וְ/הֵנִ֨יחַ לָ/כֶ֧ם מִ/כָּל אֹיְבֵי/כֶ֛ם מִ/סָּבִ֖יב וִֽ/ישַׁבְתֶּם בֶּֽטַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/010.yaml
  text: But when you cross the Jordan and live in the land that Yahweh your God is giving you to inherit[a], and he gives you rest from all your enemies around you, then you will live in safety.
translation:
  language: sw
  text: Lakini mtakapovuka Yordani na kukaa katika nchi ambayo Yahwe Mungu wenu anayowapa iwe urithi wenu, atawapumzisha kutokana na maadui zenu wote wanaowazunguka, nanyi mtaishi kwa usalama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtakaa salama.”
    reason: Njia nyingine ya kutafsiri וִישַׁבְתֶּם בֶּטַח kwa karibu zaidi na muundo wa Kiebrania.
lexical_decisions:
- source_word: וַעֲבַרְתֶּם
  choice: mtakapovuka
  rationale: 'Katika mfuatano huu unaoelekea wakati ujao, kiunganishi pamoja na kitenzi timilifu kinaeleweka kwa nguvu ya wakati: ‘mtakapovuka.’'
- source_word: הַיַּרְדֵּן
  choice: Yordani
  rationale: Hili ndilo jina la kawaida la mto huu katika Kiswahili; neno ‘Mto’ linaeleweka bila kulazimika kutajwa.
- source_word: וִישַׁבְתֶּם
  choice: kukaa / mtakapoishi
  rationale: Kitenzi ישׁב humaanisha kukaa au kuishi mahali. ‘Kukaa’ linafaa baada ya kuvuka, na ‘kuishi’ linaeleza kwa kawaida hali endelevu ya usalama mwishoni.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: ‘Nchi’ huhifadhi maana ya eneo ambalo Israeli inapokea kuwa urithi.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahwe Mungu wenu
  rationale: Jina la agano יְהוָה limeandikwa kama ‘Yahwe,’ likifuatwa na cheo na uhusiano ‘Mungu wenu.’
- source_word: מַנְחִיל אֶתְכֶם
  choice: anawapa kuwa urithi wenu
  rationale: Muundo wa Hifili wa נחל unaonyesha kwamba Mungu ndiye anayewafanya wapokee nchi kama urithi; tafsiri hii ni ya kawaida na huhifadhi wazo la urithi.
- source_word: וְהֵנִיחַ לָכֶם
  choice: naye atakapowapumzisha
  rationale: Hifili ya נוח hapa ni kuwapa pumziko au nafuu; ‘kuwapumzisha’ huhifadhi wazo kuu la pumziko huku muktadha ukieleza kuwa ni kutoka kwa maadui.
- source_word: מִכָּל אֹיְבֵיכֶם מִסָּבִיב
  choice: kutokana na maadui zenu wote wanaowazunguka
  rationale: Maneno haya yanahifadhi ukamilifu wa ‘wote’ na maana ya mahali ya maadui kuwapo pande zote.
- source_word: וִישַׁבְתֶּם בֶּטַח
  choice: mtakapoishi kwa usalama
  rationale: בֶּטַח huonyesha hali ya kutokuwa hatarini; ‘kuishi kwa usalama’ ni Kiswahili cha sasa na cha kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni; ‘Yahwe’ huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Wazo la pumziko katika nchi
  choice: atawapumzisha kutokana na maadui
  alternative: atawapa nafuu kutoka kwa maadui
  rationale: ‘Kuwapumzisha’ huhifadhi taswira ya kitheolojia ya pumziko iliyo katika נוח bila kuondoa maana ya usalama wa kisiasa na kijeshi katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ‘mtakapovuka … ndipo mtakapoishi’ unaonyesha uhusiano wa wakati na matokeo uliomo katika mfuatano wa Kiebrania. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika nayo.
