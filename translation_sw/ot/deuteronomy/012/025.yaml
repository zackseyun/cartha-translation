    issue: Dokezo la chini linaeleza kimakosa kiambishi katika “Usiile.”
    rationale: Katika Kiswahili, “Usiile” huchanganuliwa u-si-i-le; “i-” ndicho kiambishi cha yambwa kinachooana na “damu” (ngeli ya N/N), si “-ile.” Dokezo linapaswa kurekebishwa ili lisitoe uchanganuzi wa kisarufi usio sahihi.
  - severity: low
    issue: “mambo yakuendee vyema wewe” ni mtiririko wenye ukakasi kidogo.
    rationale: Nahau “upate heri” hutumika kwa kawaida katika Kiswahili Sanifu kwa hali njema iliyoahidiwa na יִיטַב לְךָ, bila kuibana kuwa mafanikio ya mali.
  - severity: low
    issue: Tahajia ya jina la Mungu hailingani na mkondo wa ukaguzi wa Kiingereza.
    rationale: Chanzo cha mradi na njia ya ukaguzi wa Kiingereza hutumia “Yahweh”; kutumia tahajia hiyo pia katika Kiswahili huleta ulinganifu wa istilahi.
