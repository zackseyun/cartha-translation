base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/025.yaml
  text: You shall not eat it[a], so that it may go well with you and with your children after you, because you will do what is right in the eyes of Yahweh.
translation:
  language: sw
  text: Usiile[a], ili upate heri, wewe na watoto wako baada yako, kwa sababu utafanya yaliyo sawa machoni pa Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, damu inayotajwa katika mistari iliyotangulia. Kiambishi cha yambwa “i-” katika “usiile” kinarejelea damu.
    reason: ufafanuzi wa kiwakilishi
lexical_decisions:
- source_word: תֹּאכְלֶנּוּ
  choice: Usiile
  rationale: Kitenzi אָכַל ni ‘kula,’ na kiambishi cha nafsi ya tatu umoja kinarejelea damu katika muktadha wa karibu. ‘Usiile’ ni katazo la moja kwa moja na la kawaida katika Kiswahili.
- source_word: לְמַעַן
  choice: ili
  rationale: Neno hili huonyesha kusudi au matokeo; ‘ili’ linaendeleza uhusiano huo kwa Kiswahili cha kawaida.
- source_word: יִיטַב לְךָ
  choice: mambo yakuendee vyema
  rationale: Hii ni nahau ya agano inayomaanisha hali kuwa njema kwa mtu kwa upana. ‘Mambo yakuendee vyema’ ni ya asili na haipunguzi baraka kuwa ustawi wa mali pekee.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: na watoto wako baada yako
  rationale: בנים inaweza kumaanisha wana wa kiume, watoto kwa ujumla, au wazao kulingana na muktadha. Hapa ‘watoto wako’ huhifadhi lugha ya kifamilia na upeo wa kizazi kinachofuata.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa כִּי inatoa msingi wa hali njema iliyoahidiwa, yaani kutenda yaliyo sawa.
- source_word: תַעֲשֶׂה
  choice: utafanya
  rationale: Kauli isiyotimilika ina mtazamo wa mbele na inaonyesha tendo linalotarajiwa la utii.
- source_word: הַיָּשָׁר
  choice: yaliyo sawa
  rationale: יָשָׁר hueleza kilicho nyofu, sahihi, au sawa. ‘Yaliyo sawa’ ni wazi na linafaa kwa lugha ya kimaadili ya Kumbukumbu la Torati.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Huhifadhi sitiari ya Kiebrania kuhusu tathmini ya Mungu kwa namna inayoeleweka katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha na cheo.
- issue: Upeo wa בָנֶיךָ
  choice: watoto wako
  alternative: wana wako; wazao wako
  rationale: Nomino hiyo ni ya wingi wa kiume kisarufi, lakini katika muktadha huu wa agano inaweza kuwakilisha watoto au uzao kwa upana. ‘Watoto wako’ huhifadhi picha ya familia bila kuzuia ahadi kwa wana wa kiume pekee.
- issue: Uhusiano kati ya utii na hali njema
  choice: kwa sababu utafanya
  alternative: utakapofanya; kwani utafanya
  rationale: 'כִּי inaweza kuwa na matumizi kadhaa, lakini hapa usomaji wa kisababishi unafaa: kutenda yaliyo sawa ndiko msingi unaotajwa wa hali njema. Tafsiri haipanui kauli hii kuwa fundisho la ustawi wa mali.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Nahau ‘mambo yakuendee vyema’ imetumiwa kuhifadhi upana wa יִיטַב לְךָ. Sitiari ‘machoni pa Yahwe’ imehifadhiwa kwa sababu ni ya kueleweka na inaakisi muundo wa Kiebrania.
