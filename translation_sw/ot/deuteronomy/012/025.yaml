  verdict: revise
  source_fidelity: Tafsiri inafuata kwa karibu katazo la kutokula damu, kusudi la hali njema kwa msomaji na watoto wake, na msingi wa kutenda yaliyo sawa machoni pa Yahweh. Hata hivyo, dokezo la chini linaeleza kimakosa umbo la Kiswahili “-ile” kana kwamba ndilo kiambishi cha umoja; kiambishi cha yambwa ni “i-” katika “usi-i-le,” kikirejelea damu. “Mambo yakuendee vyema wewe” pia ni muundo usio laini kidogo kwa nahau hii ya agano.
  naturalness: “Usiile” na “watoto wako baada yako” vinaeleweka. “Ili upate heri, wewe na watoto wako baada yako” ni nahau ya Kiswahili Sanifu yenye mtiririko wa asili zaidi na hudumisha upana wa יִיטַב לְךָ. “Machoni pa Yahweh” ni sahihi na ya kawaida katika rejesta ya kibiblia.
  terminology: “Yahweh” lihifadhiwe kwa ulinganifu na uamuzi wa mradi wa kutafsiri יהוה kwa jina hilo. “Yaliyo sawa” hutoa maana ya הַיָּשָׁר kwa uaminifu, ingawa “yaliyo mema” au “yaliyo haki” yangeweza kusikika pia; hakuna sababu ya kuyabadilisha.
