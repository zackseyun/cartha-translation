  text: Be careful that you do not forsake the Levite all your days on your land[a][b].
translation:
  language: sw
  text: Jihadhari usimwache Mlawi[a] siku zako zote katika nchi yako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Walawi”; Kiebrania kina umoja, “Mlawi,” ambao huenda umetumiwa kumwakilisha kundi lote la Walawi.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “juu ya ardhi yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Jihadhari
  rationale: Amri ya Niphal pamoja na לְךָ ni onyo la mtu kujilinda au kuwa mwangalifu. “Jihadhari” ni Kiswahili cha kawaida chenye nguvu ya onyo.
- source_word: פֶּן
  choice: usi-
  rationale: פֶּן huanzisha onyo hasi; kiambishi cha kukanusha katika “usimwache” kinawasilisha maana hiyo kwa njia ya asili katika Kiswahili.
- source_word: תַּעֲזֹב
  choice: usimwache
  rationale: עזב inaweza kumaanisha kuacha, kutupa, au kupuuza. Katika muktadha huu “kumwacha” huhifadhi uzito wa kutotekeleza wajibu kwa Mlawi bila kulazimisha ufafanuzi mmoja tu.
- source_word: אֶת הַלֵּוִי
  choice: Mlawi
  rationale: Kiebrania kina umoja wenye kibainishi, unaotumiwa kiuwakilishi kwa kundi la Walawi. Umoja umehifadhiwa katika matini.
- source_word: כָּל יָמֶיךָ
  choice: siku zako zote
  rationale: Hii inafuata kwa karibu nahau ya Kiebrania huku ikibaki wazi na yenye hadhi katika Kiswahili.
- source_word: עַל אַדְמָתֶךָ
  choice: katika nchi yako
  rationale: Ingawa עַל kwa msingi ni “juu ya,” pamoja na אַדְמָה hapa humaanisha eneo ambamo mtu anaishi. “Katika nchi yako” ni Kiswahili cha asili; tanbihi huhifadhi umbo la karibu zaidi na Kiebrania.
theological_decisions:
- issue: Umoja wa kiuwakilishi unaomhusu Mlawi
  choice: Mlawi
  alternative: Walawi
  rationale: Kiebrania kinatumia nomino ya umoja yenye kibainishi, yaelekea kumwakilisha kila Mlawi au kundi la Walawi. Kuhifadhi umoja huakisi umbo la chanzo bila kuzuia maana ya kundi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi kama onyo la Kiebrania. “Mlawi” huhifadhi umoja wa kiuwakilishi; “katika nchi yako” huchaguliwa kwa uasili wa Kiswahili huku tanbihi ikionyesha tafsiri ya karibu zaidi ya עַל אַדְמָתֶךָ.
