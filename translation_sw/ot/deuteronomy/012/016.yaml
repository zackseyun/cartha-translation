base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/016.yaml
  text: Only, you shall not eat the blood; you shall pour it out on the ground like water.
translation:
  language: sw
  text: Lakini tu, damu msile; imwageni ardhini kama maji.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Lakini
  rationale: Katika muktadha huu neno hili linaweka kizuizi kwa ruhusa iliyotangulia; “Lakini” linaonyesha kwa kawaida kwamba damu ndiyo isiporuhusiwa kuliwa.
- source_word: הַדָּם
  choice: damu
  rationale: Kiswahili hakihitaji kiwakilishi cha uainisho kinacholingana na artikeli ya Kiebrania; muktadha unaonyesha kuwa ni damu ya mnyama anayechinjwa.
- source_word: לֹא תֹאכֵלוּ
  choice: msile
  rationale: Hii ni njia ya kawaida, ya moja kwa moja na yenye hadhi ya kutoa katazo kwa wingi katika Kiswahili.
- source_word: עַל הָאָרֶץ
  choice: ardhini
  rationale: Katika tendo hili la kimwili, אֶרֶץ linamaanisha ardhi ambapo damu inamwagwa, si nchi au dunia kwa maana pana.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: mwimwage
  rationale: Kitenzi kinaeleza kumwaga, na kiambishi -i- kinarejelea damu bila kulazimika kuirudia.
- source_word: כַּמָּיִם
  choice: kama maji
  rationale: Hili ni linganisho la moja kwa moja na la kawaida katika Kiswahili, linalohifadhi taswira ya Kiebrania.
theological_decisions:
- issue: Matumizi ya damu katika sheria ya chakula
  choice: Kutoa katazo la moja kwa moja dhidi ya kula damu na agizo la kuimwaga ardhini.
  alternative: Kupanua kauli kwa maelezo ya kiishara au ya kiteolojia kuhusu damu.
  rationale: Aya inatoa agizo halisi la kisheria; tafsiri haipaswi kuingiza ufafanuzi wa baadaye usiotamkwa katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa moja kwa moja, unaofaa agizo la kisheria. Hakuna tanbihi zinazohitajika.
