  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֥י לֹא בָּאתֶ֖ם עַד עָ֑תָּה אֶל הַ/מְּנוּחָה֙ וְ/אֶל הַֽ/נַּחֲלָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/009.yaml
  text: For you have not yet come to the resting place and to the inheritance that Yahweh your God is giving you[a].
translation:
  language: sw
  text: Kwa maana mpaka sasa bado hamjafika mahali pa kupumzika[a] wala kwenye urithi ambao Yahwe Mungu wenu anawapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pumziko.” Neno la Kiebrania מְנוּחָה linaweza kumaanisha hali ya kupumzika au mahali pa kupumzika; hapa muktadha wa kuingia katika nchi unapendelea maana ya mahali.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza sababu ya agizo lililotangulia na kuhifadhi nguvu ya kisababishi kwa Kiswahili cha kawaida.
- source_word: בָּאתֶם
  choice: hamjafika
  rationale: Kitenzi בוא kinaweza kumaanisha kuja, kufika, au kuingia; hapa, pamoja na vifungu vya mahali panapolengwa, “kufika” ni cha asili na hakifinyangi maana kuwa “kuingia” pekee.
- source_word: עַד עָתָּה
  choice: mpaka sasa bado
  rationale: Pamoja na ukanushi, kifungu hiki huonyesha kwamba tendo halijatokea hadi wakati wa sasa; “mpaka sasa bado hamjafika” huwasilisha maana hiyo wazi.
- source_word: הַמְּנוּחָה
  choice: mahali pa kupumzika
  rationale: Neno linaweza kumaanisha pumziko kwa hali ya jumla au mahali pa kupumzika. Muktadha wa kufika katika nchi unapendelea maana halisi zaidi ya mahali, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: הַנַּחֲלָה
  choice: urithi
  rationale: Neno נַחֲלָה mara nyingi humaanisha milki iliyotolewa kama sehemu ya urithi, hasa nchi anayoitoa Mungu; “urithi” huhifadhi wazo la zawadi na mgao.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Inawakilisha jina la agano la Mungu moja kwa moja kwa umbo linalotumiwa kwa kawaida katika Kiswahili.
- source_word: נֹתֵן
  choice: anawapa
  rationale: Kitenzi cha hali endelevu kinaonyesha utoaji unaoendelea au ulio karibu kutimia; wakati wa sasa wa Kiswahili huhifadhi mtazamo huo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia Tetragramatoni moja kwa moja; “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya “mahali pa kupumzika” na “urithi”
  choice: Kuyataja kama mambo mawili yaliyounganishwa
  alternative: Kuyachukulia kama maelezo mawili ya kitu kilekile
  rationale: Kiebrania kinarudia אֶל (“kwenda/kuelekea”) na kuunganisha nomino hizo kwa וְ, lakini hakiamui wazi ikiwa ni maeneo tofauti au mitazamo miwili ya nchi hiyo; tafsiri haifafanui zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Mahali pa kupumzika” ni cha kawaida na wazi; “urithi” huhifadhi msamiati wa nchi iliyotolewa na Mungu. Alama ya tanbihi [a] imewekwa mara tu baada ya neno linalohusika.
