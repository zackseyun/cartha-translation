  text: אַ֗ךְ כַּ/אֲשֶׁ֨ר יֵאָכֵ֤ל אֶֽת הַ/צְּבִי֙ וְ/אֶת הָ֣/אַיָּ֔ל כֵּ֖ן תֹּאכְלֶ֑/נּוּ הַ/טָּמֵא֙ וְ/הַ/טָּה֔וֹר יַחְדָּ֖ו יֹאכְלֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/022.yaml
  text: But just as the gazelle and the deer are eaten[a], so you may eat it[b]; the unclean and the clean alike may eat it.
translation:
  language: sw
  text: Lakini, kama vile swala na kulungu[a] wanavyoliwa, ndivyo unaweza kuila. Mtu aliye najisi na mtu aliye safi, wote wawili, wanaweza kuila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “paa na kulungu dume.” Utambulisho mahususi wa wanyama hawa wa porini hauko wazi kabisa.
    reason: lexical_alternative
  - marker: b
    text: Yaani, mtu aliye najisi kwa upande wa ibada na mtu aliye safi kwa upande wa ibada wote wanaweza kula nyama hiyo.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Lakini
  rationale: Neno hili linaonyesha sharti au ufafanuzi unaohusiana na agizo lililotangulia; “Lakini” linaunganisha hoja hiyo kwa Kiswahili cha kawaida bila kuongeza msisitizo usiokuwapo.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: kama vile ... ndivyo
  rationale: Muundo huu wa ulinganisho unaonyesha kuwa nyama inayozungumziwa inaweza kuliwa kwa namna ileile ambayo wanyama wa porini huliwa.
- source_word: הַצְּבִי
  choice: swala
  rationale: Neno la Kiebrania humaanisha mnyama wa porini wa jamii ya swala; “swala” ni jina linaloeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: הָאַיָּל
  choice: kulungu
  rationale: Neno hili humaanisha mnyama wa jamii ya kulungu, na wakati mwingine hasa dume; “kulungu” huepuka kutaja jinsia kwa uhakika kuliko chanzo.
- source_word: תֹּאכְלֶנּוּ
  choice: unaweza kuila
  rationale: Katika sheria hii kauli ya Kiebrania inaonyesha ruhusa, si unabii wa kitendo cha baadaye wala amri ya lazima.
- source_word: הַטָּמֵא ... הַטָּהוֹר
  choice: mtu asiye safi ... mtu aliye safi
  rationale: Maneno haya yanaeleza hali ya mtu kidesturi, si tabia yake ya kimaadili. Kuongeza “mtu” kunafanya marejeo ya watu yawe wazi kwa Kiswahili.
- source_word: יַחְדָּו
  choice: Wote
  rationale: Hapa maana ni kwamba makundi yote mawili yana ruhusa sawa ya kula, si lazima kwamba yatakula kwa wakati mmoja.
- source_word: יֹאכְלֶנּוּ
  choice: wanaweza kuila
  rationale: Kama ilivyo katika kitenzi cha awali, kauli hii inaonyesha ruhusa ya kisheria.
theological_decisions:
- issue: Istilahi ya hali ya usafi wa kidesturi
  choice: mtu asiye safi na mtu aliye safi
  alternative: mtu asiye safi kidesturi na mtu aliye safi kidesturi
  rationale: Chanzo kinadumisha jozi fupi ya “asiye safi” na “aliye safi.” Tafsiri kuu inahifadhi istilahi hiyo bila kuigeuza kuwa hukumu ya kimaadili, huku tanbihi ikifafanua kuwa hali ya kidesturi ndiyo inayokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inatumia umoja “unaweza” kulingana na mwito wa Kiebrania kwa Israeli kama mtu mmoja, kisha wingi “wanaweza” kwa makundi mawili ya watu. Viwakilishi vya ngeli katika “kuila” vinaelekeza kwenye nyama au mnyama aliyetajwa katika muktadha uliotangulia.
