base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/008.yaml
  text: You shall not do as we are doing here today[a], each man whatever is right in his own eyes.
translation:
  language: sw
  text: 'Msifanye kama tunavyofanya hapa leo: kila mtu[a] akifanya yote yaliyo sawa machoni pake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania “kila mwanamume”; usemi huu ni wa mgawanyo, ukimaanisha kila mtu kutenda kwa hukumu yake mwenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲשׂוּן
  choice: Msifanye
  rationale: Kitenzi cha nafsi ya pili wingi chini ya ukanushi kina nguvu ya katazo au agizo; “Msifanye” ni Kiswahili cha kawaida chenye uzito wa kisheria.
- source_word: כְּכֹל אֲשֶׁר
  choice: kama
  rationale: Kirai hiki cha ulinganisho kinaonyesha namna ya kutenda; “kama” huwasilisha kwa ufasaha kutenda kwa namna ileile.
- source_word: עֹשִׂים פֹּה הַיּוֹם
  choice: tunavyofanya hapa leo
  rationale: Kivumishi-tendo pamoja na vielezi vya mahali na wakati huonyesha tendo linaloendelea wakati huo.
- source_word: אִישׁ
  choice: kila mtu
  rationale: Ingawa umbo la Kiebrania ni nomino ya kiume umoja, hapa limetumiwa kwa maana ya mgawanyo, yaani kila mmoja. “Kila mtu” ni ya asili katika Kiswahili na huhifadhi maana hiyo bila kudai kuwa wanaume pekee ndio wanaolengwa.
- source_word: כָּל הַיָּשָׁר
  choice: lolote lililo sawa
  rationale: Kirai kinaeleza chochote kinachohesabiwa kuwa sawa au kinachofaa; “linaloonekana kuwa sawa” kingeeleza wazi zaidi tathmini binafsi lakini kingeongeza ufafanuzi.
- source_word: בְּעֵינָיו
  choice: machoni pake
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kwa hukumu au tathmini yake mwenyewe. Nahau sambamba ya Kiswahili “machoni pake” huhifadhi picha na mvutano wa maana.
theological_decisions:
- issue: Usemi wa mgawanyo wa kiume אִישׁ ... בְּעֵינָיו
  choice: kila mtu ... machoni pake
  alternative: kila mwanamume ... machoni pake
  rationale: Katika muktadha huu אִישׁ lina kazi ya mgawanyo, si lazima ya kutenga jinsia nyingine. Kiswahili “kila mtu” huwasilisha maana ya kila mmoja kwa kawaida huku kiwakilishi cha umoja “pake” kikidumisha muundo wa Kiebrania.
- issue: Je, הַיָּשָׁר ni usahihi halisi au tathmini binafsi?
  choice: lililo sawa machoni pake
  alternative: linaloonekana kuwa sawa kwake
  rationale: Tafsiri kuu huhifadhi kwa pamoja neno “sawa” na nahau “machoni pake,” bila kuamua kimyakimya ikiwa jambo hilo ni sawa kweli au linafikiriwa tu kuwa sawa; muktadha unaonyesha tathmini binafsi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Alama ya mkato mrefu inaunganisha katazo na ufafanuzi wa mwenendo wa kila mtu. Kiashiria [a] kimewekwa baada ya kirai kinachofafanuliwa.
