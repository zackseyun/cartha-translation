base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/006.yaml
  text: And there you shall bring your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, your vow offerings, your freewill offerings[b], and the firstborn of your herd and of your flock.
translation:
  language: sw
  text: Huko mtaleta sadaka zenu za kuteketezwa, dhabihu zenu, zaka zenu, sadaka ya mkono wenu,[a] sadaka zenu za nadhiri,[b] sadaka zenu za hiari, na wazaliwa wa kwanza wa ng’ombe wenu na wa kondoo na mbuzi wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka mnayoitoa kwa mkono wenu.” Kiebrania kinataja kihalisi “mkono,” kikisisitiza kile ambacho watu wenyewe wanakileta.
    reason: lexical_alternative
  - marker: b
    text: Au “nadhiri zenu”; katika muktadha huu huenda maana yake ni sadaka zinazotolewa kwa kutimiza nadhiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲבֵאתֶם
  choice: mtaleta
  rationale: Hifili ya בוא katika agizo hili ina maana ya kupeleka vitu mahali palipotajwa; wakati ujao wa Kiswahili unasomeka kwa kawaida kama agizo katika muktadha huu.
- source_word: שָׁמָּה
  choice: Huko
  rationale: Kielezi hiki kinaelekeza kwenye mahali pa ibada palipotajwa katika mstari uliotangulia.
- source_word: עֹלֹתֵיכֶם
  choice: sadaka zenu za kuteketezwa
  rationale: עוֹלָה ni sadaka iliyoteketezwa yote; usemi huu ni wazi na unaeleweka katika Kiswahili cha Biblia.
- source_word: זִבְחֵיכֶם
  choice: dhabihu zenu
  rationale: זֶבַח ni neno pana la dhabihu zinazochinjwa, tofauti na sadaka za kuteketezwa.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: zaka zenu
  rationale: מַעֲשֵׂר hutaja sehemu ya kumi inayotolewa; “zaka” ni istilahi ya kawaida ya Kiswahili katika muktadha huu.
- source_word: תְּרוּמַת יֶדְכֶם
  choice: sadaka ya mikono yenu
  rationale: Tafsiri hii inadumisha taswira halisi ya “mkono” katika Kiebrania na maana ya kitu ambacho watu wenyewe wanakitoa.
- source_word: נִדְרֵיכֶם
  choice: sadaka zenu za nadhiri
  rationale: Ingawa neno lenyewe linaweza kumaanisha “nadhiri zenu,” katika orodha hii ya vitu vinavyoletwa linaelekea kutaja sadaka zinazohusiana na kutimiza nadhiri.
- source_word: נִדְבֹתֵיכֶם
  choice: sadaka zenu za hiari
  rationale: Neno hili hutaja matoleo yanayotolewa kwa hiari, bila kuwa wajibu wa nadhiri.
- source_word: בְכֹרֹת בְּקַרְכֶם וְצֹאנְכֶם
  choice: wazaliwa wa kwanza wa makundi yenu ya ng’ombe na ya kondoo na mbuzi
  rationale: בקר ni mifugo mikubwa, hasa ng’ombe, na צאן ni mifugo midogo inayojumuisha kondoo na mbuzi; tafsiri hii inaweka tofauti hiyo wazi.
theological_decisions:
- issue: Maana ya נִדְרֵיכֶם katika orodha ya sadaka
  choice: sadaka zenu za nadhiri
  alternative: nadhiri zenu
  rationale: Muktadha wa vitu vinavyoletwa mahali pa ibada unaunga mkono maana ya sadaka zinazotolewa kwa kutimiza nadhiri, lakini tanbihi inadumisha uwezekano wa tafsiri ya moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Istilahi za ibada zimewekwa wazi bila kuingiza ufafanuzi wa kimadhehebu. “Kondoo na mbuzi” limechaguliwa kufafanua upana wa צאן.
