lexical_decisions:
- source_word: לֹא
  choice: msi-
  rationale: Kiambishi cha ukanushi pamoja na hali tegemezi katika “msimtendee” kinatoa katazo la moja kwa moja kwa wingi, sawasawa na לֹא pamoja na kitenzi cha nafsi ya pili wingi.
- source_word: תַעֲשׂוּן
  choice: mtendee
  rationale: Katika muundo huu, עשה pamoja na ל־ humaanisha kumfanyia au kumtendea mtu jambo; “mtendee” ni ya kawaida na hudumisha uhusiano unaoonyeshwa na kihusishi.
- source_word: כֵּן
  choice: hivyo
  rationale: “Hivyo” hurejelea namna iliyotajwa katika muktadha uliotangulia bila kuingiza maelezo hayo yote katika mstari.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kama “Yahwe”; uhusiano wa ל־ umejengwa kiasili ndani ya kitenzi “mtendee.”
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Huhifadhi wazi nomino na kiambishi cha nafsi ya pili wingi, kinachoonyesha uhusiano wa agano.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: “Yahwe” huwasilisha jina la agano lililo katika Kiebrania badala ya kulibadilisha kwa cheo; tanbihi inataja desturi nyingine iliyoenea.
- issue: Upeo wa katazo katika muktadha
  choice: Kudumisha usemi mfupi “msimtendee ... hivyo”
  alternative: Kufafanua ndani ya mstari kwamba Israeli hawapaswi kumwabudu Yahwe kama mataifa yanavyoabudu miungu yao, au kuharibu mahali pake pa ibada
  rationale: Kiebrania ni kifupi na כֵּן hurejelea yaliyotangulia. Tafsiri haifungi kimyakimya maana katika ufafanuzi mmoja; tanbihi inaeleza rejeo la karibu huku ikihifadhi mvutano wa kimuktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Msimtendee ... hivyo” ni katazo la moja kwa moja kwa watu wengi na huhifadhi ufupi pamoja na rejeo la nyuma la maandishi ya Kiebrania.
