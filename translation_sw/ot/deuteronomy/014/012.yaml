  text: 'And these are the ones that you shall not eat from among them: the eagle[a], the bearded vulture, and the black vulture.'
translation:
  language: sw
  text: 'Na hawa ndio ndege ambao hampaswi kuwala: tai[a], tumbusi mwenye ndevu, na tumbusi mweusi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Utambulisho wa ndege wanaoitwa kwa majina haya ya Kiebrania hauna uhakika. “Tai” huenda ikawa tumbusi mkubwa; “tumbusi mwenye ndevu” kwa jadi ameitwa ndege mvunja-mifupa; na “tumbusi mweusi” hutafsiriwa na baadhi kuwa kipungu au tai wa baharini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: Na hawa ndio
  rationale: Ingawa Kiebrania kina umbo la umoja, ‘na huyu/huu,’ kirai hiki kinatanguliza orodha ya ndege kadhaa; umbo la wingi ni la kawaida na wazi katika Kiswahili.
- source_word: אֲשֶׁר לֹא תֹאכְלוּ מֵהֶם
  choice: ambao hampaswi kula miongoni mwao
  rationale: Huhifadhi katazo linalowaelekea watu wengi na maana ya sehemu ya מִן, yaani kuchagua kutoka miongoni mwa jamii ya ndege iliyotajwa katika muktadha.
- source_word: הַנֶּשֶׁר
  choice: tai
  rationale: Hili ndilo jina la jadi na linaloeleweka kwa urahisi, ingawa neno la Kiebrania huenda likamtaja ndege mkubwa wa kuwinda au tumbusi.
- source_word: הַפֶּרֶס
  choice: tumbusi mwenye ndevu
  rationale: Ni jina la kisasa na linaloeleweka la ndege anayejulikana pia kwa kuvunja mifupa; utambulisho wa jina la Kiebrania si hakika kabisa.
- source_word: הָעָזְנִיָּה
  choice: tumbusi mweusi
  rationale: Hufuata utambulisho mmoja wa kisasa unaotumiwa na wataalamu, huku kutokuwa na uhakika na majina mengine yakihifadhiwa katika tanbihi.
