  yaml_path: translation/ot/deuteronomy/014/009.yaml
  text: 'You may eat this from all that are in the waters: everything that has fins and scales you may eat.'
translation:
  language: sw
  text: 'Miongoni mwa vyote vilivyomo majini, mnaweza kula vitu hivi: kila kilicho na mapezi na magamba mnaweza kukila.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶת זֶה תֹּאכְלוּ
  choice: mnaweza kula hivi
  rationale: Muundo huu wa Kiswahili unawasilisha kwa kawaida ruhusa iliyo katika muktadha wa sheria za vyakula, huku ukihifadhi neno la kuonyesha זֶה (‘hivi’).
- source_word: מִכֹּל אֲשֶׁר בַּמָּיִם
  choice: katika viumbe vyote vilivyo majini
  rationale: Neno ‘viumbe’ linaeleza rejeleo lililodokezwa la vitu hai vya majini bila kulibana kwa ‘samaki’ pekee; ‘majini’ ni usemi wa kawaida wa Kiswahili.
- source_word: סְנַפִּיר
  choice: mapezi
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa viungo vya kuogelea vinavyotajwa hapa.
- source_word: קַשְׂקֶשֶׂת
  choice: magamba
  rationale: Katika muktadha wa viumbe wa majini, ‘magamba’ hutoa maana ya magamba ya samaki kwa lugha ya kawaida na inayoeleweka.
- source_word: תֹּאכֵלוּ
  choice: mnaweza kula
  rationale: Katika sheria hii kitenzi kinaonyesha kile kinachoruhusiwa kuliwa, si amri kwamba lazima kiliwe.
theological_decisions:
- issue: Nguvu ya kisheria ya vitenzi תֹּאכְלוּ / תֹּאכֵלוּ
  choice: mnaweza kula
  alternative: mtakula / kuleni
  rationale: Muktadha unatofautisha vyakula vinavyoruhusiwa na vilivyokatazwa; tafsiri ya ruhusa inaonyesha kazi hiyo bila kuifanya kuwa amri ya lazima kula.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umefanywa wa asili kwa Kiswahili huku urudiaji wa ruhusa na vigezo viwili—mapezi na magamba—ukihifadhiwa.
