  language: sw
  text: bundi mdogo[a], bundi mkubwa, na bundi mweupe;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Utambulisho kamili wa majina haya ya ndege hauna uhakika. Tafsiri za zamani na za sasa hutofautiana, na mara nyingi huyatafsiri kuwa aina mbalimbali za bundi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס
  choice: bundi mdogo
  rationale: Katika orodha hii ya ndege wasio safi, neno hilo linaelekea kumaanisha aina fulani ya bundi. Utambulisho kamili wa spishi hauna uhakika; tafsiri hii ya kawaida hutofautisha ndege huyu na wale wawili wanaofuata bila kudai uhakika usiokuwapo.
- source_word: יַנְשׁוּף
  choice: bundi mkubwa
  rationale: Neno hilo linaelekea kumaanisha ndege wa usiku, kwa mapokeo aina ya bundi. 'Bundi mkubwa' linadumisha tofauti kati ya majina matatu katika orodha, ingawa spishi kamili haijulikani.
- source_word: תִּנְשָׁמֶת
  choice: bundi mweupe
  rationale: Katika muktadha huu neno hilo linataja ndege, na huenda ni aina ya bundi. 'Bundi mweupe' ni tafsiri ya kimapokeo inayolitofautisha na majina yaliyotangulia, huku tanbihi ikieleza kutokuwa na uhakika wa utambulisho.
- source_word: אֶת
  choice: '[halijatafsiriwa]'
  rationale: Ni kiashiria cha yambwa tendwa katika Kiebrania na halina neno huru linalolingana nalo katika Kiswahili.
- source_word: וְ
  choice: na
  rationale: Kiunganishi cha kawaida kinachounganisha vitu katika orodha.
- source_word: הַ
  choice: '[imewakilishwa na muundo wa nomino]'
  rationale: Kibainishi cha Kiebrania kinataja kila ndege kama aina katika orodha; Kiswahili hakihitaji kibainishi tofauti cha aina ya 'the' hapa.
