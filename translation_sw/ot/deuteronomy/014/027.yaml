  text: And you shall not neglect the Levite who is within your gates[c][b][a], because he has no portion or inheritance with you.
translation:
  language: sw
  text: Usimpuuze Mlawi aliye katika miji yako,[a][b] kwa sababu hana sehemu wala urithi pamoja nawe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “aliye ndani ya malango yako,” nahau inayomaanisha aliye katika miji au jumuiya za eneo lako.
    reason: cultural_note
  - marker: b
    text: Au “usimwache” au “usimtelekeze.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, Mlawi hana mgao wa kawaida wa ardhi ya kikabila miongoni mwa Israeli.
    reason: cross_reference
lexical_decisions:
- source_word: וְהַלֵּוִי
  choice: Mlawi
  rationale: Nomino ya umoja yenye uamilifu wa kiwakilishi inamtaja mtu wa kabila la Lawi. “Mlawi” ni istilahi ya kawaida ya Biblia ya Kiswahili; haijaongezewa “kuhani,” kwa kuwa si kila Mlawi alikuwa kuhani.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: aliye katika miji yako
  rationale: Kwa Kiebrania, “aliye ndani ya malango yako” ni nahau inayomaanisha mtu anayeishi katika miji au jumuiya za eneo lako. Tafsiri ya maana kuwa “katika miji yako” ni ya asili na wazi katika Kiswahili cha sasa.
- source_word: לֹא תַעַזְבֶנּוּ
  choice: Usimpuuze
  rationale: Kitenzi עזב kinaweza kumaanisha kuacha, kutupa, au kutelekeza. Katika muktadha wa kumtunza Mlawi, “usimpuuze” huonyesha kutokosa kumjali au kumpatia mahitaji, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya amri; “kwa sababu” ni wazi na cha kawaida katika Kiswahili.
- source_word: אֵין לוֹ
  choice: hana
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili ya muundo wa Kiebrania unaoeleza kutokuwa na kitu.
- source_word: חֵלֶק וְנַחֲלָה
  choice: sehemu wala urithi
  rationale: Maneno haya mawili yanahusu fungu au mgao na urithi wa ardhi. Katika sentensi hasi, “wala” ni muundo wa asili wa Kiswahili unaohifadhi msisitizo wa kunyimwa vyote viwili.
- source_word: עִמָּךְ
  choice: pamoja nawe
  rationale: Huhifadhi wazo la kuwa Mlawi hana mgao wa ardhi sambamba na Waisraeli wengine; pia hufuata kwa karibu kihusishi cha Kiebrania.
theological_decisions:
- issue: Aina ya sehemu ambayo Mlawi hana
  choice: Kauli inaelekezwa kwa ukosefu wa mgao wa kawaida wa ardhi ya kikabila miongoni mwa Israeli, ambao ndio msingi wa wajibu wa jumuiya kumtunza Mlawi.
  alternative: Kauli inahusu kwa ujumla tu hali ya kutengwa kijamii bila kurejelea hasa umiliki wa ardhi.
  rationale: Katika muktadha wa Kumbukumbu la Torati, jozi “sehemu na urithi” inahusu hasa mgao wa ardhi wa kikabila. Maelezo haya yamewekwa tanbihini badala ya kuongezwa katika mstari wenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. “Mlawi” huhifadhi istilahi ya kibiblia; “miji yako” hufafanua nahau ya malango bila kufanya matini kuu kuwa ya kigeni. Viambishi vya tanbihi vimewekwa karibu na vifungu vinavyovifafanua.
