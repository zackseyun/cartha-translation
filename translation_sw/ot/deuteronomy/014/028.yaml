base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/028.yaml
  text: At the end of every three years[b][a], you shall bring out all the tithe of your produce in that year and lay it up within your gates.
translation:
  language: sw
  text: Mwishoni mwa kila kipindi cha miaka mitatu[b], utatoa zaka yote ya mazao yako ya mwaka huo na kuiweka ndani ya malango yako[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “ndani ya malango yako” humaanisha katika miji au makazi ya eneo lako.
    reason: cultural_note
  - marker: b
    text: Au, “kila mwaka wa tatu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה שָׁלֹשׁ שָׁנִים
  choice: Mwishoni mwa kila kipindi cha miaka mitatu
  rationale: Huhifadhi wazo la kufikia mwisho wa muda wa miaka mitatu na, kwa kuzingatia muktadha, huonyesha kwamba agizo hilo hurudiwa kila baada ya kipindi hicho.
- source_word: תּוֹצִיא
  choice: utatoa
  rationale: Ni namna ya kawaida na ya moja kwa moja ya kueleza kausativi ya יצא, yaani kukitoa kitu mahali kilipokuwa.
- source_word: כָּל מַעְשַׂר
  choice: fungu lote la kumi
  rationale: “Fungu la kumi” linaeleza wazi maana ya מַעְשֵׂר, huku “lote” likihifadhi msisitizo wa כָּל kwamba kiasi chote kinachotakiwa kitolewe.
- source_word: תְּבוּאָתְךָ
  choice: mazao yako
  rationale: “Mazao” ni neno pana na la kawaida linalohusu mavuno au pato la kilimo bila kulibana kwa nafaka pekee.
- source_word: בַּשָּׁנָה הַהִוא
  choice: ya mwaka huo
  rationale: Uhusiano huu wa kisarufi unaonyesha kwamba fungu la kumi linatokana na mazao ya mwaka unaohusika.
- source_word: וְהִנַּחְתָּ
  choice: na kuliweka
  rationale: Kitenzi hiki kinaeleza kuweka au kuacha kitu mahali fulani; kiwakilishi “-li-” kinarejelea fungu lote la kumi.
- source_word: בִּשְׁעָרֶיךָ
  choice: ndani ya malango yako
  rationale: Huhifadhi taswira halisi ya Kiebrania ya “malango,” ambayo katika matumizi haya inawakilisha miji au makazi yaliyo chini ya mamlaka ya mhusika.
