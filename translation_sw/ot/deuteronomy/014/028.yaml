  verdict: revise
  source_fidelity: The temporal phrase, agricultural produce, total tithe, and local-gates expression are substantially represented. However, “fungu lote la kumi” is not the clearest or most established Swahili equivalent for מַעְשֵׂר and is less precise than “zaka.”
  naturalness: The sentence is generally clear and appropriately formal. “Zaka yote” is more idiomatic and immediately intelligible in this legal-cultic context; its class-9 anaphoric form is consequently “kuiweka.”
  terminology: Use “zaka” for “tithe,” the standard and accurate Swahili term. It neither adds doctrinal interpretation nor obscures the source term. The literal “malango yako” is properly retained with a contextual footnote.
  issues:
  - severity: medium
    issue: “fungu lote la kumi” is a nonstandard and potentially awkward rendering of “tithe.”
    rationale: מַעְשַׂר denotes a tithe, conventionally and naturally rendered “zaka” in Standard East African Swahili. “Fungu lote la kumi” can sound like a particular parcel rather than the required tithe as a category.
  - severity: low
    issue: The pronoun in “kuliweka” follows the former noun phrase rather than the preferred term “zaka.”
    rationale: 'With “zaka” (noun class 9), the appropriate object concord is -i-: “kuiweka.”'
  - severity: low
    issue: Footnote b is needlessly less exact by adding “mwishoni mwa” to an alternative corresponding to “each third year.”
    rationale: The alternative may simply read “kila mwaka wa tatu,” while the main text preserves the Hebrew’s explicit end-of-period wording.
