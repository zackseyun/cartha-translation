  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri inatumia “fungu la kumi” badala ya neno lenye miangwi mingine ya kidini, na inadumisha taswira ya “malango” huku tanbihi ikifafanua maana yake ya kimuktadha.
