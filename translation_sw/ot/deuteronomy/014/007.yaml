  text: אַ֣ךְ אֶת זֶ֞ה לֹ֤א תֹֽאכְלוּ֙ מִ/מַּֽעֲלֵ֣י הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֥י הַ/פַּרְסָ֖ה הַ/שְּׁסוּעָ֑ה אֶֽת הַ֠/גָּמָל וְ/אֶת הָ/אַרְנֶ֨בֶת וְ/אֶת הַ/שָּׁפָ֜ן כִּֽי מַעֲלֵ֧ה גֵרָ֣ה הֵ֗מָּה וּ/פַרְסָה֙ לֹ֣א הִפְרִ֔יסוּ טְמֵאִ֥ים הֵ֖ם לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/007.yaml
  text: 'However[a], these you shall not eat from among those that chew the cud or from among those that have a divided hoof: the camel, the hare, and the rock badger; because they chew the cud but do not divide the hoof[b]. They are unclean for you.'
translation:
  language: sw
  text: 'Lakini msiwale hawa miongoni mwa wanyama wanaocheua na wenye kwato zilizogawanyika: ngamia, sungura[a], na pimbi[b]. Kwa maana wao hucheua, lakini kwato zao hazijagawanyika. Wao ni najisi kwenu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, sungura wa porini. Neno la Kiebrania linaelekea kumaanisha sungura wa porini (hare), ingawa utambulisho wake kamili wa kizoolojia unajadiliwa.
    reason: lexical_alternative
  - marker: b
    text: Au, wibari. Huyu ni hyrax, mnyama mdogo anayeishi hasa kwenye maeneo ya miamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Lakini
  rationale: Inaonyesha kizuizi kwa kanuni ya mstari uliotangulia kwa njia ya kawaida na yenye heshima katika Kiswahili.
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: kati ya wanyama wanaocheua
  rationale: Kitenzi “kucheua” ni istilahi ya kawaida ya Kiswahili kwa tabia inayotajwa na nahau ya Kiebrania.
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה הַשְּׁסוּעָה
  choice: au wenye kwato zilizogawanyika
  rationale: “Kwato zilizogawanyika” hueleza wazi kwato iliyotengana katika sehemu mbili; “au” huonyesha makundi mawili yanayotajwa katika sheria hii.
- source_word: הַגָּמָל
  choice: ngamia
  rationale: Hili ndilo jina la kawaida na la moja kwa moja la mnyama huyu katika Kiswahili.
- source_word: הָאַרְנֶבֶת
  choice: sungura
  rationale: “Sungura” ni neno la kawaida linaloeleweka Afrika Mashariki, ingawa jina la Kiebrania linaelekea kumaanisha hasa sungura wa porini (hare); ufafanuzi umewekwa katika tanbihi.
- source_word: הַשָּׁפָן
  choice: pimbi
  rationale: Mnyama huyu hutambuliwa kwa kawaida kuwa hyrax; “pimbi” ni jina la Kiswahili lisiloingiza uainishaji usio sahihi wa mnyama kama badger.
- source_word: כִּי מַעֲלֵה גֵרָה הֵמָּה
  choice: Kwa maana wao hucheua
  rationale: Inahifadhi uhusiano wa sababu na kurudia istilahi ileile kwa uthabiti.
- source_word: וּפַרְסָה לֹא הִפְרִיסוּ
  choice: lakini kwato zao hazijagawanyika
  rationale: Inatoa utofautishaji ulio wazi na wa kawaida katika Kiswahili, huku ikihifadhi sifa ya jumla ya wanyama hao.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: Wao ni najisi kwenu
  rationale: “Najisi” huhifadhi neno pana la kibiblia kuhusu kutokuwa safi bila kulifafanua kimadhehebu kuwa la kiibada au la kisherehe pekee.
theological_decisions:
- issue: Asili ya unajisi katika sheria ya vyakula
  choice: najisi
  alternative: najisi kiibada
  rationale: Kiebrania kinatumia neno pana la kisheria na kiagano. Tafsiri kuu hailibani kwa kuongeza “kiibada,” jambo ambalo lingefasiri zaidi ya maneno yenyewe.
- issue: Maelezo ya wanyama kuwa wanacheua
  choice: hucheua
  alternative: huonekana kama wanaocheua
  rationale: Matini yenyewe inasema moja kwa moja kwamba wanyama hao hucheua. Tafsiri inahifadhi namna hiyo ya usemi bila kuingiza ufafanuzi wa kisayansi katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa wasomaji wa kawaida, huku marudio ya “kucheua” na “kwato zilizogawanyika” yakihifadhi mantiki ya sheria ya Kiebrania. Alama za tanbihi zimewekwa moja kwa moja baada ya majina ya wanyama yanayohusika.
