  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֶת הַ֠/חֲזִיר כִּֽי מַפְרִ֨יס פַּרְסָ֥ה הוּא֙ וְ/לֹ֣א גֵרָ֔ה טָמֵ֥א ה֖וּא לָ/כֶ֑ם מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וּ/בְ/נִבְלָתָ֖/ם לֹ֥א תִגָּֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/008.yaml
  text: And the pig[a], because it has a split hoof but does not chew the cud, is unclean for you. You shall not eat any of its flesh[b], and you shall not touch its carcass.
translation:
  language: sw
  text: Na nguruwe, kwa kuwa ana kwato zilizogawanyika lakini hacheui, ni najisi kwenu. Msile nyama yao, wala msiguse mizoga yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema “nyama yao” na “mizoga yao,” kikitumia viambishi vya wingi baada ya kumtaja nguruwe kwa umoja wa kijumla.
    reason: textual_grammar
lexical_decisions:
- source_word: הַחֲזִיר
  choice: nguruwe
  rationale: Neno la kawaida na linaloeleweka katika Kiswahili cha kisasa kwa mnyama huyu.
- source_word: כִּי
  choice: kwa kuwa
  rationale: Linaonyesha sababu ya kutajwa kwa sifa zinazofuata; muundo wenye “lakini” unaweka wazi kwamba mnyama ana sifa moja ya kwato lakini hana sifa ya kucheua.
- source_word: מַפְרִיס פַּרְסָה
  choice: ana kwato zilizogawanyika
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoeleza kwato iliyopasuka au kugawanyika.
- source_word: גֵרָה
  choice: hacheui
  rationale: Kitenzi “kucheua” kwa kawaida humaanisha kurudisha chakula tumboni na kukitafuna tena, hivyo kinawasilisha kigezo cha Kiebrania kwa ufupi na kwa usahihi.
- source_word: טָמֵא
  choice: najisi
  rationale: “Najisi” ni istilahi iliyozoeleka katika muktadha wa sheria za vyakula na usafi wa kiibada, bila kudai kwamba mnyama ni mwovu kimaadili.
- source_word: לָכֶם
  choice: kwenu
  rationale: Kinahifadhi matumizi ya sheria kwa jamii inayoambiwa.
- source_word: מִבְּשָׂרָם
  choice: nyama yao
  rationale: “Nyama” ni ya asili katika Kiswahili kwa sehemu ya mnyama inayoliwa; kiambishi cha wingi cha Kiebrania kimehifadhiwa kwa “yao.”
- source_word: נִבְלָתָם
  choice: mizoga yao
  rationale: “Mizoga” hutaja kwa usahihi miili ya wanyama waliokufa, na wingi wa Kiebrania umehifadhiwa.
- source_word: תִגָּעוּ
  choice: msiguse
  rationale: Ni amri ya moja kwa moja inayolingana na maana ya msingi ya kitenzi “kugusa.”
theological_decisions:
- issue: Hali ya unajisi katika sheria za vyakula za Torati
  choice: Kutafsiri טָמֵא kuwa “najisi” bila maelezo ya ziada ya kiteolojia
  alternative: isiyo safi; iliyotiwa unajisi
  rationale: Aya inaeleza hadhi ya kisheria na kiibada katika agano, si hukumu kwamba mnyama ni mwovu kimaadili.
- issue: Nguvu ya katazo la kugusa mizoga
  choice: “msiguse”
  alternative: msiishike; msiikaribie
  rationale: Tafsiri hii inadumisha katazo la moja kwa moja bila kulipanua kuwa marufuku ya kukaribia au kulibana kuwa kushika tu.
- issue: Umoja wa “nguruwe” na viambishi vya wingi katika nusu ya mwisho
  choice: Kuhifadhi “nyama yao” na “mizoga yao”
  alternative: nyama yake na mzoga wake
  rationale: Ingawa הַחֲזִיר ni umoja wa kijumla, maandishi ya Kiebrania yana viambishi vya wingi katika מִבְּשָׂרָם na נִבְלָתָם; tafsiri inahifadhi mvutano huo wa kisarufi na rejeleo la jamii ya wanyama.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Hacheui” ni fupi na ya asili kuliko maelezo marefu ya kurudisha chakula na kukitafuna tena. Kiunganishi “wala” kinaendeleza katazo la pili kwa mtiririko wa kawaida.
