  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/נָתַתָּ֣ה הַ/כֶּ֡סֶף בְּ/כֹל֩ אֲשֶׁר תְּאַוֶּ֨ה נַפְשְׁ/ךָ֜ בַּ/בָּקָ֣ר וּ/בַ/צֹּ֗אן וּ/בַ/יַּ֨יִן֙ וּ/בַ/שֵּׁכָ֔ר וּ/בְ/כֹ֛ל אֲשֶׁ֥ר תִּֽשְׁאָלְ/ךָ֖ נַפְשֶׁ֑/ךָ וְ/אָכַ֣לְתָּ שָּׁ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/שָׂמַחְתָּ֖ אַתָּ֥ה וּ/בֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/026.yaml
  text: 'and spend the silver on whatever your appetite desires: cattle[a], sheep, wine, strong drink, or whatever your appetite asks for. And you shall eat there before Yahweh your God and rejoice[c][b], you and your household.'
translation:
  language: sw
  text: 'Utumie fedha hiyo[a] kwa chochote unachotamani: ng’ombe, kondoo au mbuzi, divai, kileo[b], au chochote unachotaka[c]. Kisha utakula huko mbele za Yahweh Mungu wako na utafurahi, wewe pamoja na watu wa nyumbani mwako.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “fedha hiyo”; hapa neno hilo linamaanisha pesa.'
    reason: lexical_alternative
  - marker: b
    text: “Kileo” ni kinywaji chenye kulevya tofauti na divai; si lazima kiwe pombe kali iliyosafishwa.
    reason: cultural_note
  - marker: c
    text: 'Kwa neno halisi, “chochote ambacho nafsi yako inakuomba.” Pia katika kauli ya kwanza: “chochote ambacho nafsi yako inatamani.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה הַכֶּסֶף
  choice: Utumie fedha hiyo
  rationale: Kitenzi cha Kiebrania kwa msingi ni ‘kutoa,’ lakini pamoja na fedha na orodha ya vitu vya kupata kinamaanisha kutumia fedha. ‘Fedha’ ni neno la kawaida la Kiswahili kwa pesa na pia linaweza kumaanisha metali ya fedha.
- source_word: תְּאַוֶּה נַפְשְׁךָ
  choice: unachotamani
  rationale: Nֶפֶשׁ hapa humaanisha mtu mwenyewe akiwa na hamu au tamaa, hasa katika muktadha wa chakula na kinywaji. Kiswahili cha kawaida hakihitaji kurudia ‘nafsi yako’ ili kutoa maana hiyo.
- source_word: בַּבָּקָר וּבַצֹּאן
  choice: ng’ombe, kondoo au mbuzi
  rationale: בקר ni ng’ombe kwa ujumla; צאן ni wanyama wadogo wa kufugwa katika kundi, yaani kondoo na mbuzi. Kutaja zote mbili huepuka kuifanya צאן kuwa kondoo peke yao.
- source_word: וּבַיַּיִן וּבַשֵּׁכָר
  choice: divai, kileo
  rationale: יין ni divai. שֵׁכָר ni kinywaji chenye kulevya tofauti na divai; ‘kileo’ ni pana na hakidokezi kimakosa pombe kali iliyosafishwa.
- source_word: וּבְכֹל אֲשֶׁר תִּשְׁאָלְךָ נַפְשֶׁךָ
  choice: au chochote unachotaka
  rationale: Kiebrania kinasema kwa picha kwamba nafsi ‘inakuomba.’ Tafsiri hii ya kawaida huhifadhi wazo la hamu ya mtu bila Kiswahili kisicho cha kawaida.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: mbele za Yahweh Mungu wako
  rationale: ‘Mbele za’ huhifadhi lugha ya uwepo wa ibada, na jina la agano יְהוָה limetolewa kama ‘Yahweh.’
- source_word: וְשָׂמַחְתָּ אַתָּה וּבֵיתֶךָ
  choice: na kufurahi, wewe pamoja na watu wa nyumbani mwako
  rationale: ‘Kufurahi’ hutoa hali ya sherehe; ‘watu wa nyumbani mwako’ huonyesha kwamba ‘nyumba’ hapa ni kaya, si jengo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yanatumia jina la agano moja kwa moja; ‘Yahweh’ hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Kutaja vinywaji vyenye kulevya
  choice: divai, kileo
  alternative: divai, kinywaji kisichoainishwa
  rationale: Kiebrania kinataja wazi divai na aina nyingine ya kinywaji chenye kulevya. Tafsiri haifichi wala hailainishi tofauti hiyo.
- issue: Maana ya נֶפֶשׁ katika kauli mbili za tamaa
  choice: unachotamani ... unachotaka
  alternative: nafsi yako inatamani ... nafsi yako inakuomba
  rationale: Katika muktadha huu נֶפֶשׁ ni mtu akiwa na hamu, si fundisho maalumu kuhusu sehemu isiyo ya mwili. Tafsiri ya kawaida ya Kiswahili huhifadhi maana huku tanbihi ikionyesha taswira halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inatumia maneno ya kawaida lakini inadumisha urudiaji wa hamu katika Kiebrania kwa ‘unachotamani ... unachotaka.’ ‘Watu wa nyumbani mwako’ huepuka utata wa kuelewa ‘nyumba’ kama jengo.
