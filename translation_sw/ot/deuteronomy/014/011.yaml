lexical_decisions:
- source_word: כָּל
  choice: yeyote
  rationale: Kihesabu hiki kinahusu kundi lote bila kuweka kizuizi; katika Kiswahili cha kawaida, “yeyote” huonyesha ruhusa ya kula ndege wowote walio katika kundi la walio safi.
- source_word: צִפּוֹר
  choice: ndege
  rationale: Nomino hii kwa kawaida humaanisha ndege, nalo ndilo neno la kawaida na sahihi katika muktadha huu wa sheria za vyakula.
- source_word: טְהֹרָה
  choice: aliye safi
  rationale: Katika sheria za vyakula, neno hili hutaja hadhi ya kiibada ya kuwa safi, si usafi wa kawaida tu; “safi” hudumisha istilahi hiyo ya kisheria na kiagano.
- source_word: תֹּאכֵלוּ
  choice: mnaweza kula
  rationale: Kauli ya nafsi ya pili wingi hapa inaeleza ruhusa ndani ya masharti ya vyakula; “mnaweza kula” ni ya asili na haitafsiri sentensi kuwa amri ya lazima kula.
