  text: Usile kitu chochote kilicho machukizo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitu chochote cha kuchukiza.” Neno la Kiebrania humaanisha jambo la machukizo au lenye kuchukiza; hapa linaanzisha orodha inayofuata ya vyakula vilivyokatazwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: usi-
  rationale: Kiambishi cha ukanushi katika kitenzi kinaonyesha katazo la moja kwa moja katika muktadha huu wa sheria.
- source_word: תֹאכַל
  choice: -le
  rationale: Qal imperfect nafsi ya pili umoja pamoja na לֹא ina nguvu ya katazo; Kiswahili cha kawaida hulieleza kwa umbo la 'usile'.
- source_word: כָּל
  choice: chochote
  rationale: Pamoja na nomino ya umoja chini ya ukanushi, 'chochote' huonyesha kwa kawaida na kwa uwazi kwamba katazo linahusu kila kitu cha aina hiyo.
- source_word: תּוֹעֵבָה
  choice: kitu cha kuchukiza
  rationale: Neno hili humaanisha kitu kinachoonekana kuwa cha karaha au kisichokubalika kabisa; hapa linaanzisha orodha ya vyakula vilivyokatazwa. 'Kitu cha kuchukiza' ni cha sasa na kinadumisha uzito wa neno bila kulifungamanisha tu na hisia za kawaida za kinyaa.
theological_decisions:
- issue: Nguvu ya katazo katika sheria ya agano
  choice: 'Katazo la moja kwa moja: “Usile kitu chochote cha kuchukiza.”'
  alternative: 'Kauli ya kawaida: “Huli kitu chochote cha kuchukiza.”'
  rationale: Katika sheria hii, imperfect ya Kiebrania pamoja na לֹא hutoa amri ya kukataza, si utabiri wala maelezo ya desturi tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kawaida lakini chenye hadhi. Umbo “Usile” linatoa katazo wazi na la moja kwa moja; “kitu chochote cha kuchukiza” linahifadhi upana na uzito wa Kiebrania.
