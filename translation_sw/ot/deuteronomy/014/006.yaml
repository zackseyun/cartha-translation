translation:
  language: sw
  text: Mnaweza kula kila mnyama mwenye kwato zilizogawanyika sehemu mbili na acheuaye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi na muundo wa Kiebrania: “Kila mnyama anayepasua kwato, mwenye ufa unaoigawanya katika sehemu mbili, na acheuaye—mnaweza kumla.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: kila
  rationale: Neno “kila” linaonyesha maana ya kugawa kwa kila mnyama mmoja mmoja na linasikika kwa kawaida katika kauli ya ruhusa.
- source_word: בְּהֵמָה
  choice: mnyama
  rationale: Katika muktadha huu neno hilo linahusu kwa upana wanyama wa nchi kavu wanaozungumziwa katika sheria za vyakula, si mifugo pekee.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: mwenye kwato zilizopasuka
  rationale: Hii ni tafsiri ya kawaida na iliyo wazi ya sifa halisi ya kwato inayotajwa.
- source_word: וְשֹׁסַעַת שֶׁסַע שְׁתֵּי פְרָסוֹת
  choice: kila moja ikiwa imegawanyika sehemu mbili
  rationale: Kiebrania kinakazia kwamba ufa huo unaigawa kwato katika sehemu mbili; kirai hiki kinahifadhi mkazo huo kwa Kiswahili cha kawaida.
- source_word: מַעֲלַת גֵּרָה
  choice: hucheua
  rationale: “Kucheua” ni kitenzi sanifu na kifupi kinachoeleza mnyama kurudisha chakula tumboni na kukitafuna tena.
- source_word: בַּבְּהֵמָה
  choice: mnyama
  rationale: Maana ya kuwa miongoni mwa jamii ya wanyama imewasilishwa kiasili kupitia “kila mnyama,” badala ya kurudia kirai kisicho cha kawaida mwishoni.
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: Mnaweza kula
  rationale: Katika sheria hii kauli inaonyesha ruhusa ya kula, si amri kwamba lazima wale; nafsi ya pili wingi imehifadhiwa kwa “mna-”.
