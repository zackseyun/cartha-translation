language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לֹ֣א תֹאכְל֣וּ כָל נְ֠בֵלָה לַ/גֵּ֨ר אֲשֶׁר בִּ/שְׁעָרֶ֜י/ךָ תִּתְּנֶ֣נָּ/ה וַ/אֲכָלָ֗/הּ א֤וֹ מָכֹר֙ לְ/נָכְרִ֔י כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ לֹֽא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/021.yaml
  text: You shall not eat any carcass[a]. You may give it to the sojourner who is within your gates, and he may eat it; or you may sell it to a foreigner. For you are a holy people to Yahweh your God[e][d][c][b]. You shall not boil a young goat in its mother's milk.
translation:
  language: sw
  text: Msile mzoga wa mnyama yeyote[a]. Mnaweza kumpa mgeni mkazi aliyeishi katika miji yenu[b], naye anaweza kuula; au mnaweza kumuuzia mgeni wa nchi nyingine. Kwa maana ninyi ni watu watakatifu wa Yahwe, Mungu wenu. Msimchemshe mwana-mbuzi katika maziwa ya mama yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mnyama aliyekufa mwenyewe au ambaye hakuchinjwa kwa njia iliyoruhusiwa.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno moja, “aliye ndani ya malango yenu.” Huu ni msemo wa Kiebrania unaomaanisha mtu anayeishi katika miji au jumuiya yenu. “Mgeni mkazi” hapa ni tofauti na “mgeni wa nchi nyingine” katika kishazi kinachofuata.
    reason: cultural_and_lexical_note
lexical_decisions:
- source_word: נְבֵלָה
  choice: nyama ya mnyama yeyote aliyekufa
  rationale: Neno hili humaanisha mzoga wa mnyama ambaye hakuchinjwa kwa njia iliyoruhusiwa, mara nyingi mnyama aliyekufa mwenyewe. Usemi huu wa Kiswahili unaweka wazi kwamba kinachozuiwa ni nyama ya mnyama huyo, si kila aina ya mzoga kwa ujumla.
- source_word: גֵּר
  choice: mgeni mkazi
  rationale: Huyu ni mtu asiye Mwisraeli aliyeishi kwa kudumu katika jamii ya Israeli na kuwa na hadhi inayotambulika; ‘mgeni mkazi’ ni ya sasa na inamtofautisha na נָכְרִי.
- source_word: בִּשְׁעָרֶיךָ
  choice: anayeishi katika miji yenu
  rationale: Ingawa kwa neno moja ni ‘aliye ndani ya malango yako,’ huu ni msemo wa Kiebrania unaomaanisha mtu anayeishi katika miji au jumuiya zilizo chini ya mamlaka yao.
- source_word: תִּתְּנֶנָּה וַאֲכָלָהּ
  choice: Mnaweza kumpa ... naye anaweza kuila
  rationale: Katika sheria hii maumbo hayo yanaeleza jambo linaloruhusiwa baada ya ulaji wa Waisraeli kukatazwa, si lazima yawe amri ya kutoa mzoga huo.
- source_word: נָכְרִי
  choice: mgeni wa nchi nyingine
  rationale: Neno hili humaanisha mtu wa taifa jingine asiye na hadhi ileile ya mgeni mkazi; tafsiri hii inadumisha tofauti kati yake na גֵּר.
- source_word: עַם קָדוֹשׁ
  choice: watu watakatifu
  rationale: Ni lugha ya agano inayoonyesha watu waliotengwa na kuwekwa wakfu kwa Mungu.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi kinaonyesha kuwa watu hao wamewekwa wakfu kwa Yahwe na ni wake; jina la agano linatolewa wazi.
- source_word: גְּדִי
  choice: mwana-mbuzi
  rationale: Ni jina la kawaida na lililo wazi kwa mbuzi mchanga katika Kiswahili cha Afrika Mashariki.
- source_word: תְבַשֵּׁל
  choice: mchemshe
  rationale: Kitenzi kinaweza kumaanisha kupika, hasa kwa kuchemsha; katika muktadha wa maziwa, ‘mchemshe’ huhifadhi picha mahsusi ya maandishi.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: katika maziwa ya mama yake
  rationale: Tafsiri ya moja kwa moja na ya asili inayohifadhi uhusiano wa mwana-mbuzi na mama yake.
theological_decisions:
- issue: Kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano lenyewe; ‘Yahwe’ hulitambulisha kama jina badala ya kulibadili kuwa cheo.
- issue: Nguvu ya vitenzi vya kutoa na kuuza mzoga
  choice: 'ruhusa: ‘mnaweza kumpa ... mnaweza kumuuzia’'
  alternative: 'agizo: ‘mpeni ... muuzieni’'
  rationale: Katika muktadha huu wa kisheria, jambo kuu ni kukataza Israeli kuula huku njia za kuutoa zikiruhusiwa. Tafsiri ya ruhusa huepuka kuongeza wajibu usio wazi katika Kiebrania.
- issue: Utakatifu kama msingi wa katazo
  choice: ‘watu watakatifu kwa Yahwe Mungu wenu’
  alternative: ‘taifa takatifu la Yahwe Mungu wenu’
  rationale: עַם ni ‘watu,’ na לַיהוָה inaonyesha kuwekwa wakfu kwake au kuwa mali yake bila kulazimisha ufafanuzi mmoja wa uhusiano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Wingi umetumiwa kulingana na vitenzi vya Kiebrania vinavyoielekea Israeli kwa pamoja. ‘Mgeni mkazi’ na ‘mgeni wa nchi nyingine’ zinadumisha tofauti ya kijamii na kisheria kati ya גֵּר na נָכְרִי.
