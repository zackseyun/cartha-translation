translation:
  language: sw
  text: kulungu[a], swala, paa, mbuzi wa mwituni, mbuzi wa milimani, swala, na kondoo wa milimani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Majina kadhaa ya wanyama katika mstari huu hayana utambulisho wa hakika. “Paa” huenda pia ni kulungu wa majani au kulungu mwekundu; “mbuzi wa mwituni” huenda ni mbuzi wa milimani; “mbuzi wa milimani” huenda ni adaksi; “swala” huenda ni ng'ombe wa mwituni au auroksi; na “kondoo wa milimani” huenda ni mbuzi wa milimani au chamois.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּל
  choice: kulungu
  rationale: Ni jina la jamii ya kulungu; neno hili ni la kawaida na halibainishi isivyo lazima jinsia au spishi.
- source_word: צְבִי
  choice: swala
  rationale: Kwa kawaida hutambulishwa kuwa swala, neno linaloeleweka vizuri katika Kiswahili cha Afrika Mashariki.
- source_word: יַחְמוּר
  choice: paa
  rationale: Utambulisho kamili wa mnyama huyu hauna uhakika. 'Paa' linawasilisha mnyama wa jamii ya kulungu bila kudai spishi mahususi.
- source_word: אַקּוֹ
  choice: mbuzi-mwitu
  rationale: Huenda ni mnyama wa jamii ya mbuzi wa porini; 'mbuzi-mwitu' ni wazi kwa msomaji wa kawaida, huku uwezekano wa mbuzi wa milimani ukitajwa katika tanbihi.
- source_word: דִישֹׁן
  choice: mbuzi wa milimani
  rationale: Utambulisho wake unabishaniwa; tafsiri hii inatoa picha ya mnyama wa porini wa jamii ya mbuzi bila kutumia jina la kitaalamu lisilozoeleka.
- source_word: תְאוֹ
  choice: swala mkubwa
  rationale: Mnyama huyu hana utambulisho wa hakika. Chaguo hili linafuata uwezekano wa jamii ya swala, huku uwezekano wa ng'ombe-mwitu ukihifadhiwa katika tanbihi.
- source_word: זָמֶר
  choice: kondoo wa milimani
  rationale: Spishi kamili haijulikani; usemi huu ni wa kawaida na unaeleweka kuliko majina ya kigeni ya kizoolojia.
