base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/002.yaml
  text: For you are a holy people to Yahweh your God[a], and Yahweh has chosen you to be a treasured people for himself out of all the peoples who are on the face of the earth.
translation:
  language: sw
  text: Kwa maana wewe ni taifa takatifu la Yahwe Mungu wako, na Yahwe amekuchagua uwe taifa lake la thamani kutoka miongoni mwa mataifa yote yaliyo juu ya uso wa dunia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwe watu wake walio mali ya thamani.” Neno la Kiebrania סְגֻלָּה humaanisha mali inayothaminiwa kwa namna ya pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya katazo lililotangulia na kudumisha nguvu ya maelezo katika muktadha.
- source_word: עַם קָדוֹשׁ
  choice: taifa takatifu
  rationale: Katika muktadha huu עַם ni jumuiya ya agano; ‘taifa takatifu’ ni Kiswahili cha kawaida kinachoonyesha watu waliowekwa wakfu bila kudokeza ubora wa kikabila.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: kwa Yahwe Mungu wako
  rationale: Kihusishi ל kinaonyesha uhusiano au kuwa mali ya Mungu; ‘kwa’ huhifadhi maana hiyo kwa lugha fupi na ya kawaida.
- source_word: וּבְךָ בָּחַר יְהוָה
  choice: na Yahwe amekuchagua
  rationale: ב pamoja na בחר ni nahau ya Kiebrania ya kumchagua mtu; Kiswahili hutumia yambwa moja kwa moja.
- source_word: לִהְיוֹת לוֹ
  choice: uwe ... lake
  rationale: Muundo huu unaonyesha kusudi au matokeo ya uchaguzi, yaani kuwa mali yake.
- source_word: לְעַם סְגֻלָּה
  choice: taifa lake la thamani
  rationale: סְגֻלָּה ni mali inayothaminiwa kwa namna ya pekee. Tafsiri hii pia huhifadhi neno עַם na wazo la kumilikiwa.
- source_word: מִכֹּל הָעַמִּים
  choice: kutoka miongoni mwa mataifa yote
  rationale: מן hapa huonyesha kuchaguliwa kutoka katika kundi pana, bila kuongeza maana ya kuwa bora kuliko wengine.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: yaliyo juu ya uso wa dunia
  rationale: Ni nahau ya Kiebrania inayorejelea mataifa yanayoishi duniani; ‘dunia’ inafaa kuliko ‘ardhi’ katika upeo huu wa jumla.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina binafsi la Mungu lililo katika matini ya Kiebrania.
theological_decisions:
- issue: Maana ya kuchaguliwa kwa Israeli
  choice: Kueleza uchaguzi wa agano unaolifanya taifa hili kuwa mali ya Yahwe yenye thamani, bila kuongeza dai la ubora wa kikabila.
  alternative: Kutafsiri מִכֹּל kama ‘juu ya mataifa yote’ au kufafanua mstari kwa mfumo wa baadaye wa mafundisho kuhusu uchaguzi.
  rationale: Kiebrania kinasema Yahwe alichagua Israeli kutoka miongoni mwa mataifa yote ili iwe taifa lake la thamani. Tafsiri inadumisha uchaguzi wa Mungu na uhusiano wa kumilikiwa, bila kupanua maana kupita matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Umoja wa nafsi ya pili umehifadhiwa katika ‘wewe,’ ‘wako,’ na ‘amekuchagua,’ kwa kuwa Israeli anasemeshwa kama jumuiya moja.
