lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: mbuni
  rationale: Ingawa kwa neno moja moja Kiebrania ni ‘binti wa ya'anah,’ katika orodha za wanyama msemo huu ni jina la aina ya ndege, linaloeleweka vizuri kuwa mbuni.
- source_word: הַתַּחְמָס
  choice: mwewe
  rationale: Utambulisho kamili wa ndege huyu hauna uhakika. ‘Mwewe’ ni tafsiri inayowezekana ya ndege wa kuwinda, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: הַשָּׁחַף
  choice: shakwe
  rationale: Kamusi za kisasa mara nyingi huhusianisha neno hili na shakwe au ndege mwingine wa baharini; utambulisho wake, hata hivyo, si wa hakika.
- source_word: הַנֵּץ
  choice: kozi
  rationale: Neno hili humaanisha ndege wa kuwinda na linaweza kutafsiriwa ‘kozi’ au ‘mwewe.’ ‘Kozi’ limetumiwa hapa ili kulitofautisha na תַּחְמָס katika orodha ileile.
- source_word: לְמִינֵהוּ
  choice: kwa aina zake
  rationale: Huu ni usemi wa Kiebrania wa kuainisha kiumbe pamoja na aina zake zinazohusiana; tafsiri hii ni ya kawaida na inayoeleweka katika Kiswahili.
