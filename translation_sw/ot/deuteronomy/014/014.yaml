- source_word: לְמִינוֹ
  choice: kulingana na aina yake
  rationale: Kauli hii huainisha ndege kwa aina au jamii yake na inadumisha maana rasmi ya Kiebrania kwa Kiswahili cha sasa kinachoeleweka.
