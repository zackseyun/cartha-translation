  yaml_path: translation/ot/deuteronomy/014/010.yaml
  text: But anything that does not have fins and scales, you shall not eat; it is unclean for you.
translation:
  language: sw
  text: Lakini chochote kisicho na mapezi na magamba msile; ni najisi kwenu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כֹל
  choice: Lakini chochote
  rationale: כֹל ina maana ya ujumla, ‘kila kitu/chochote.’ Katika muktadha huu וְ inaonyesha tofauti na ruhusa iliyotangulia, hivyo ‘Lakini chochote’ ni Kiswahili cha kawaida kinachohifadhi nguvu ya ujumla na utofautishaji.
- source_word: אֲשֶׁר אֵין לוֹ
  choice: kisicho na
  rationale: Muundo wa אֵין pamoja na kiwakilishi tamati unaonyesha kutokuwa na kitu; ‘kisicho na’ ni muundo wa asili na wazi katika Kiswahili.
- source_word: סְנַפִּיר
  choice: mapezi
  rationale: Neno hili hutaja pezi la kiumbe wa majini. Wingi ‘mapezi’ unafaa katika kanuni hii ya kuainisha viumbe.
- source_word: וְ/קַשְׂקֶשֶׂת
  choice: na magamba
  rationale: Neno hili hutaja magamba ya samaki. Wingi ‘magamba’ ni wa kawaida katika Kiswahili na unaendana na maelezo ya kundi la viumbe.
- source_word: לֹא תֹאכֵלוּ
  choice: msile
  rationale: Kitenzi ni nafsi ya pili wingi kilichokanushwa katika sheria; ‘msile’ ni katazo la moja kwa moja, la sasa, na lenye hadhi katika Kiswahili.
- source_word: טָמֵא
  choice: najisi
  rationale: Katika muktadha wa sheria za utakaso, ‘najisi’ hutaja hadhi ya kiibada, wala si uchafu wa kawaida tu.
- source_word: הוּא לָכֶם
  choice: ni najisi kwenu
  rationale: ‘Kwenu’ huhifadhi maana ya hadhi ya kitu hicho kuhusiana na Israeli, kwa Kiswahili cha kawaida na wazi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisheria ulio wazi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. ‘Najisi’ imetumiwa kudumisha istilahi ya hadhi ya kiibada.
