  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Majina ya ndege yanatumia istilahi zinazotambulika kadiri inavyowezekana; kutokuwa na uhakika kwa utambulisho wa spishi kumehifadhiwa katika tanbihi. Muundo wa orodha na viunganishi vya Kiebrania umeakisiwa kwa urahisi wa Kiswahili.
