lexical_decisions:
- source_word: הַקָּאָת
  choice: mwari
  rationale: Utambulisho wa ndege huyu hauna uhakika. “Mwari” ni jina la kawaida la Kiswahili la pelican na linafaa kama tafsiri ya kimapokeo, huku tanbihi ikihifadhi uwezekano wa bundi wa jangwani.
- source_word: הָרָחָמָה
  choice: tumbusi
  rationale: Neno hili linaelekea kumaanisha ndege mla mizoga wa jamii ya tai. “Tumbusi” ni neno la Kiswahili linaloeleweka kwa ndege huyo bila kutumia jina la kizamani au lisilo sahihi.
- source_word: הַשָּׁלָךְ
  choice: mnandi
  rationale: Utambulisho kamili wa ndege huyu unabishaniwa, lakini huenda ni ndege wa majini anayevua samaki. “Mnandi” ni jina la Kiswahili la cormorant; uwezekano mwingine umeelezwa katika tanbihi.
- source_word: וְ / וְאֶת
  choice: na / [alama ya yambwa haitafsiriwi]
  rationale: Kiunganishi וְ kimetafsiriwa “na.” Alama ya yambwa אֵת haina neno la moja kwa moja katika Kiswahili, kwa hiyo haijatafsiriwa.
