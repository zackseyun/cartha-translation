  yaml_path: translation/ot/deuteronomy/014/020.yaml
  text: You may eat any clean bird[a].
translation:
  language: sw
  text: Mnaweza kula ndege yeyote aliye safi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Ndege wote walio safi mnaweza kula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: yeyote
  rationale: Katika sentensi ya ruhusa, “yeyote” huonyesha kwamba kila mmoja katika kundi lililotajwa anaruhusiwa kuliwa, kwa Kiswahili cha kawaida na cha asili.
- source_word: עוֹף
  choice: ndege
  rationale: Ingawa neno hili linaweza kuwahusu viumbe warukao kwa upana zaidi, muktadha wa karibu wa sheria za chakula unazungumzia hasa ndege.
- source_word: טָהוֹר
  choice: aliye safi
  rationale: Hapa “safi” ni kundi la kidini katika sheria za chakula, wala si usafi wa kimwili au wema wa kimaadili.
- source_word: תֹּאכֵלוּ
  choice: mnaweza kula
  rationale: Katika muktadha huu wa sheria, kitenzi kinaonyesha ruhusa, kinyume na makatazo yanayozunguka mstari huu; “mnaweza kula” hutoa maana hiyo kwa Kiswahili cha sasa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Umoja katika “ndege yeyote aliye safi” unaendana kisarufi na maana jumuishi ya כָּל, huku nafsi ya pili wingi ikihifadhiwa katika “mnaweza.”
