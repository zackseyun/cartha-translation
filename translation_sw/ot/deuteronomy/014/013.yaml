  text: mwewe mwekundu[a], kipanga, na mwewe kwa aina yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Utambulisho kamili wa ndege hawa hauna uhakika. Tafsiri za kale na za kisasa hutofautiana, zikitumia majina kama mwewe mwekundu, mwewe, kipanga, au ndege mwingine wa jamii hizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָאָה
  choice: tai mwekundu
  rationale: Jina hili la ndege halitambuliki kwa uhakika; “tai mwekundu” linawakilisha utambulisho wa kisasa unaowezekana wa ndege wa jamii ya kite, huku tanbihi ikihifadhi kutokuwa na uhakika.
- source_word: הָאַיָּה
  choice: kipanga
  rationale: Neno hili hutaja ndege wa kuwinda na mara nyingi hueleweka kuwa falcon; “kipanga” ni jina la kawaida la Kiswahili linalolitofautisha na majina yanayolizunguka.
- source_word: הַדַּיָּה
  choice: mwewe
  rationale: Hili pia ni jina la ndege wa kuwinda, mara nyingi likitafsiriwa kite. “Mwewe” ni neno la kawaida na linaloeleweka, ingawa utambulisho kamili wa spishi haujulikani.
- source_word: לְמִינָהּ
  choice: kwa aina zake
  rationale: Kauli hii ya kiuainishaji inajumuisha aina mbalimbali za ndege aliyetajwa; wingi wa Kiswahili unaeleza vizuri maana ya makundi au spishi zake.
- source_word: וְאֶת
  choice: na
  rationale: Kiunganishi kinayaunganisha majina katika orodha; alama ya yambwa ya Kiebrania haihitaji kutafsiriwa peke yake katika Kiswahili.
