  text: then you shall turn it into silver[a], bind the silver in your hand[b], and go to the place that Yahweh your God will choose.
translation:
  language: sw
  text: basi uibadilishe kwa fedha[a], ufunge fedha hiyo mkononi mwako[b], kisha uende mahali ambapo Yahweh Mungu wako atachagua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uibadilishe kuwa fedha” au “uibadilishe kuwa pesa.” Kiebrania kinataja kihalisi “fedha,” ambayo katika muktadha huu hutumika kama pesa.
    reason: lexical_alternative
  - marker: b
    text: Au, “uifunge fedha hiyo katika mkono wako” au “uikunje fedha hiyo mkononi mwako,” yaani, uiweke salama kwa ajili ya safari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה בַּכָּסֶף
  choice: uibadilishe kuwa fedha
  rationale: Katika muktadha, zaka ya mazao inabadilishwa kwa fedha ili iwe rahisi kusafirishwa. ‘Fedha’ huhifadhi maana halisi ya כֶּסֶף, huku kitenzi ‘uibadilishe’ kikieleza shughuli ya kubadilishana bila kufafanua kupita kiasi.
- source_word: וְצַרְתָּ הַכֶּסֶף בְּיָדְךָ
  choice: uifunge fedha hiyo mkononi mwako
  rationale: צָרַר humaanisha kufunga au kukunja kitu ili kihifadhiwe salama. Tafsiri hii inadumisha taswira halisi ya fedha iliyofungwa kwa ajili ya safari.
- source_word: בְּיָדְךָ
  choice: mkononi mwako
  rationale: Hii ndiyo maana halisi ya kirai cha Kiebrania, ingawa pia kinaweza kudokeza kuwa fedha iko chini ya mamlaka au katika milki ya mtu.
- source_word: וְהָלַכְתָּ אֶל הַמָּקוֹם
  choice: na uende mahali
  rationale: הלך ni kitenzi cha kawaida cha kwenda; usemi huu ni wa moja kwa moja na wa asili katika Kiswahili.
- source_word: אֲשֶׁר יִבְחַר
  choice: ambapo ... atachagua
  rationale: Umbo la kitenzi linaeleweka kwa kawaida kuwa la wakati ujao katika agizo hili la kisheria. ‘Ambapo’ linaunganisha kwa asili kitendo cha kuchagua na mahali.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika maandishi ya Kiebrania limehifadhiwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Hili ni jina la kawaida la kiagano linalounganishwa na jina Yahweh.
theological_decisions:
- issue: Uwasilishaji wa יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la Kiebrania YHWH; ‘Yahweh’ hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. ‘Fedha’ imetumiwa badala ya ‘pesa’ katika maandishi makuu ili kuhifadhi taswira ya Kiebrania; tanbihi inaeleza kazi yake kama pesa.
