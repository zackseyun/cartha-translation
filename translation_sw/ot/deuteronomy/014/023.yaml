  text: וְ/אָכַלְתָּ֞ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּק֣וֹם אֲשֶׁר יִבְחַר֮ לְ/שַׁכֵּ֣ן שְׁמ֣/וֹ שָׁם֒ מַעְשַׂ֤ר דְּגָֽנְ/ךָ֙ תִּֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֔/ךָ וּ/בְכֹרֹ֥ת בְּקָרְ/ךָ֖ וְ/צֹאנֶ֑/ךָ לְמַ֣עַן תִּלְמַ֗ד לְ/יִרְאָ֛ה אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל הַ/יָּמִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/023.yaml
  text: And you shall eat before Yahweh your God[a], in the place that he will choose for his name to dwell there, the tithe of your grain, your new wine, and your oil, and the firstborn of your herd and your flock, so that you may learn to fear Yahweh your God all your days.
translation:
  language: sw
  text: Nawe utakula mbele za Yahwe Mungu wako, mahali atakapochagua ili jina lake likae huko[a], sehemu ya kumi ya nafaka yako, divai yako mpya na mafuta yako, pamoja na wazaliwa wa kwanza wa ng’ombe wako, kondoo wako na mbuzi wako, ili ujifunze kumcha Yahwe Mungu wako siku zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili afanye jina lake likae huko,” au “ili aliweke jina lake huko.” Kiebrania kinahifadhi nahau ya Yahwe kulifanya jina lake likae katika mahali patakatifu alipochagua.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: Nawe utakula
  rationale: Muundo huu katika muktadha wa sheria una nguvu ya agizo lenye mwelekeo wa wakati ujao; “utakula” ni wa kawaida na huhifadhi nguvu hiyo.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: mbele za Yahwe Mungu wako
  rationale: “Mbele za” huhifadhi maana ya kuwa mbele au katika uwepo wa Mungu na ni usemi wa kawaida katika muktadha wa ibada.
- source_word: יְהוָה
  choice: Yahwe
  rationale: “Yahwe” ni umbo la kawaida la Kiswahili la jina binafsi la Mungu katika Tetragramatoni.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: mahali atakapochagua
  rationale: Huhifadhi uchaguzi wa Mungu wa mahali pa ibada na mwelekeo wake wa wakati ujao.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: ili jina lake likae huko
  rationale: Huhifadhi taswira ya Kiebrania ya jina la Mungu kukaa mahali palipochaguliwa bila kuifafanua kupita kiasi kama uwepo wa kimwili.
- source_word: מַעְשַׂר
  choice: sehemu ya kumi
  rationale: Hutoa moja kwa moja maana ya fungu la kumi kwa lugha inayoeleweka kwa wasomaji wa kawaida, bila utata unaoweza kuambatana na neno “zaka” katika matumizi ya kisasa.
- source_word: דְּגָנְךָ תִּירֹשְׁךָ וְיִצְהָרֶךָ
  choice: nafaka yako, divai yako mpya na mafuta yako
  rationale: Huhifadhi utatu wa mazao ya kilimo; “divai mpya” hutofautisha תירוש na maneno ya jumla ya divai, huku “mafuta” yakiepuka kuongeza aina ambayo haikutajwa wazi.
- source_word: וּבְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: pamoja na wazaliwa wa kwanza wa ng’ombe wako, kondoo wako na mbuzi wako
  rationale: “Wazaliwa wa kwanza” ni sahihi kwa mifugo; צאן hujumuisha kondoo na mbuzi, jambo linalowekwa wazi kwa Kiswahili cha kawaida.
- source_word: לְמַעַן תִּלְמַד לְיִרְאָה
  choice: Fanya hivyo ili ujifunze kumcha
  rationale: “Ili ujifunze” huonyesha kusudi. Kuanzisha sentensi kwa “Fanya hivyo” huweka wazi uhusiano wa kusudi bila kubadili maana ya agizo.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Jina binafsi limehifadhiwa badala ya kubadilishwa kuwa cheo, kwa kutumia umbo linalofaa Kiswahili.
- issue: Kauli ya mahali patakatifu לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: ili jina lake likae huko
  alternative: ili alikalishe jina lake huko; ili aliweke jina lake huko
  rationale: Uamuzi huu huhifadhi nahau na mvutano kati ya ukuu wa Mungu usiofungwa na mahali pamoja na uwepo wake wa agano katika mahali alipochagua.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Sehemu ya kumi” imetumiwa badala ya “zaka” kwa uwazi wa maana; “kondoo na mbuzi” hufafanua upeo wa צאן. Alama ya tanbihi imewekwa moja kwa moja baada ya kauli inayohusika.
