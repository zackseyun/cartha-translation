  text: And every swarming thing of the birds is unclean for you[a]; they shall not be eaten.
translation:
  language: sw
  text: Na kila kiumbe kitambaacho chenye mabawa ni najisi kwenu[a]; visiliwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila kiumbe kitambaacho kinachoruka” au “kila kiumbe kidogo chenye mabawa.” Maneno ya Kiebrania yanaunganisha שֶׁרֶץ (kiumbe kidogo kitambaacho au kisongamanacho) na עוֹף (kiumbe kirukacho, ndege); yaelekea yanamaanisha hasa wadudu warukao, wala si ndege kwa maana ya kawaida.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: Na kila
  rationale: וְ huunganisha katazo hili na sheria zilizotangulia, huku כֹל ikionyesha ujumla wa kila kiumbe katika kundi hilo.
- source_word: שֶׁרֶץ הָ/עוֹף
  choice: kiumbe kitambaacho chenye mabawa
  rationale: Muungano huu wa maneno unataja viumbe wadogo wa kundi la שֶׁרֶץ ambao huruka au wana mabawa, yaelekea hasa wadudu warukao. Tafsiri hii huepuka kutoa maana ya ndege wa kawaida pekee, huku ikihifadhi taswira ya kiumbe kitambaacho.
- source_word: טָמֵא
  choice: najisi
  rationale: ‘Najisi’ ni istilahi ya kawaida ya kibiblia kwa hali ya kutokuwa safi kidini au kiibada, si uchafu wa kawaida tu.
- source_word: הוּא
  choice: ni
  rationale: Kiwakilishi cha Kiebrania kina kazi ya kurejelea na kusisitiza; Kiswahili cha kawaida huwasilisha kiarifu hiki kwa ‘ni’ bila kukirudia kwa kiwakilishi tofauti.
- source_word: לָ/כֶם
  choice: kwenu
  rationale: Huhifadhi uhusiano wa sheria hii na Waisraeli walioambiwa, kwa Kiswahili cha kawaida na kifupi.
- source_word: לֹא יֵאָכֵלוּ
  choice: visiliwe
  rationale: Huhifadhi kauli tendwa na wingi wa kitenzi cha Kiebrania. Upatanisho wa ngeli ya viumbe huleta ‘vi-’ katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Najisi’ huhifadhi istilahi ya sheria za utakaso; ‘visiliwe’ huhifadhi kauli tendwa na wingi wa Kiebrania. Alama ya tanbihi [a] imewekwa baada ya ‘kwenu’ ili kufafanua kundi la viumbe linalokusudiwa.
