lexical_decisions:
- source_word: הַחֲסִידָה
  choice: korongo
  rationale: Neno la Kiebrania kwa kawaida hutambulishwa kuwa ndege wa jamii ya stork. «Korongo» ni jina linaloeleweka kwa upana katika Kiswahili, ingawa utambulisho kamili wa ndege huyu wa kale hauna uhakika.
- source_word: הָאֲנָפָה
  choice: koikoi
  rationale: Utambulisho wa ndege huyu hauna uhakika; «koikoi» limetumiwa kwa ndege wa majini wa jamii ya heron na linafaa pamoja na kirai kinachofuata kinachopanua rejeo kwa aina yake.
- source_word: לְמִינָהּ
  choice: kwa aina yake
  rationale: Hiki ni kirai cha kawaida katika orodha za viumbe na vyakula, kikimaanisha kundi la ndege huyo pamoja na aina zake zinazohusiana.
- source_word: הַדּוּכִיפַת
  choice: hudihudi
  rationale: Utafiti wa kisasa kwa kawaida hutambua neno hili kuwa hoopoe; «hudihudi» ndilo jina lake la kawaida la Kiswahili.
- source_word: הָעֲטַלֵּף
  choice: popo
  rationale: Neno la Kiebrania linamtaja popo waziwazi. Ingawa kwa uainishaji wa kisasa popo si ndege, hapa ameorodheshwa miongoni mwa viumbe wanaoruka.
