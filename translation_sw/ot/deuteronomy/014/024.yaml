base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/024.yaml
  text: And if the journey is too long for you[a], so that you are not able to carry it, because the place that Yahweh your God will choose to put his name there is too far from you, when Yahweh your God blesses you,
translation:
  language: sw
  text: Na ikiwa njia ni ndefu mno kwako kiasi kwamba huwezi kuibeba zaka hiyo, kwa sababu mahali ambapo Yahwe Mungu wako atakapochagua kuweka jina lake ni mbali sana nawe, wakati Yahwe Mungu wako atakapokubariki,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: Lakini ikiwa
  rationale: Inaendeleza masharti ya maagizo yaliyotangulia huku ikionyesha hali mbadala kwa Kiswahili cha kawaida.
- source_word: יִרְבֶּה מִמְּךָ הַדֶּרֶךְ
  choice: safari ni ndefu mno kwako
  rationale: Nahau ya Kiebrania inaonyesha kuwa umbali wa safari unazidi uwezo wa mtu; tafsiri hii ni ya asili na wazi.
- source_word: לֹא תוּכַל שְׂאֵתוֹ
  choice: usiweze kubeba sehemu hiyo
  rationale: Kitenzi kinahusu kubeba kwa kawaida; 'sehemu hiyo' huonyesha zaka inayozungumziwa katika muktadha bila kuiacha kiwakilishi kikiwa na rejeo lisilo wazi.
- source_word: יִרְחַק מִמְּךָ הַמָּקוֹם
  choice: mahali ... ni mbali sana nawe
  rationale: Inadumisha maana ya umbali wa mahali maalumu pa ibada huku 'sana' ikieleza kikwazo kinachokusudiwa katika sentensi.
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ
  choice: ambapo Yahwe Mungu wako atachagua
  rationale: Wakati ujao unafaa katika sheria hii inayotazamia mahali ambapo Mungu atapateua.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linawakilisha moja kwa moja jina la agano יהוה badala ya kulibadilisha kuwa cheo.
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: kuweka jina lake
  rationale: Inahifadhi usemi muhimu wa Kumbukumbu la Torati kuhusu mahali pa ibada alipopachagua Mungu; neno 'humo' si lazima baada ya 'ambapo'.
- source_word: כִּי יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: wakati Yahwe Mungu wako atakapokubariki
  rationale: Hutoa maana ya wakati au hali inayotarajiwa katika muktadha wa baraka na wingi, huku tanbihi ikihifadhi uwezekano wa maana ya kisababishi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia Tetragramatoni moja kwa moja; 'Yahwe' huhifadhi jina la agano bila kulibadilisha kuwa cheo.
- issue: Maana ya כי katika kifungu cha mwisho
  choice: wakati Yahwe Mungu wako atakapokubariki
  alternative: kwa sababu Yahwe Mungu wako amekubariki
  rationale: Kihusishi kinaweza kuonyesha wakati au sababu. Maana ya wakati inafaa mtiririko wa sheria, lakini tanbihi inahifadhi utata halisi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi inaendeleza muundo wa masharti wa mstari uliotangulia na inaishia kwa koma kwa sababu wazo linaendelea katika mstari unaofuata.
