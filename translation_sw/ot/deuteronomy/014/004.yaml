translation:
  language: sw
  text: 'Hawa ndio wanyama[a] mnaoruhusiwa kula: ng’ombe, kondoo na mbuzi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kwa tafsiri halisi: “Huyu ndiye mnyama ambaye mtamla,” kikitumia maumbo ya umoja kuanzisha kundi la jumla kabla ya kutaja aina zake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַבְּהֵמָה
  choice: Hawa ndio wanyama
  rationale: Kiebrania kimetumia umoja unaowakilisha kundi lote, kisha kikataja aina kadhaa. Wingi ni wa kawaida na wazi zaidi katika Kiswahili, huku tanbihi ikihifadhi muundo halisi wa chanzo.
- source_word: אֲשֶׁר תֹּאכֵלוּ
  choice: mnaoruhusiwa kula
  rationale: Katika muktadha wa sheria za vyakula, kishazi hiki kinaonyesha ruhusa, si amri ya kwamba lazima wanyama hao waliwe. ‘Mnaoruhusiwa kula’ huepuka utata wa ‘mnaweza kula,’ ambao unaweza kueleweka kuwa uwezo tu.
- source_word: שׁוֹר
  choice: ng’ombe
  rationale: Neno hili humaanisha mnyama wa jamii ya ng’ombe. ‘Ng’ombe’ ni neno la kawaida la Kiswahili na halibani maana kwa jinsia fulani kama ‘fahali.’
- source_word: שֵׂה כְשָׂבִים
  choice: kondoo
  rationale: Kirai kinamtaja mnyama wa kundi dogo la mifugo na kumfafanua kuwa wa jamii ya kondoo. ‘Kondoo’ huonyesha aina bila kuongeza maana ya umri ambayo ‘mwana-kondoo’ ingeleta.
- source_word: וְשֵׂה עִזִּים
  choice: na mbuzi
  rationale: Kirai sambamba kinamtaja mnyama wa jamii ya mbuzi. ‘Mbuzi’ ni tafsiri ya kawaida isiyoongeza umri au jinsia.
