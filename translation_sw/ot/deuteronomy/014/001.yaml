base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/001.yaml
  text: You are sons of Yahweh your God[a]. Do not cut yourselves[b], and do not make a bald spot between your eyes for the dead.
translation:
  language: sw
  text: Ninyi ni wana wa Yahwe Mungu wenu.[a] Msijikatekate, wala msijinyoe kipara katikati ya macho yenu kwa ajili ya mtu aliyekufa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watoto wa Yahwe Mungu wenu.” Kiebrania ni wingi wa kiume, kihalisi “wana.”
    reason: lexical_alternative
  - marker: b
    text: Maneno “katikati ya macho yenu” yanamaanisha kwenye paji la uso.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנִים
  choice: wana
  rationale: Nomino ya Kiebrania ni wingi wa kiume, kihalisi ‘wana’. ‘Wana’ huhifadhi umbo la chanzo na kauli ya utambulisho wa agano; maelezo ya chini yanataja uwezekano wa ‘watoto’.
- source_word: לַיהוָה
  choice: wa Yahwe
  rationale: 'Herufi lamed hapa huonyesha uhusiano au umilikaji: wao ni wana wa Yahwe, si mwendo kuelekea kwake.'
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Huhifadhi moja kwa moja muundo wa agano wenye nomino na kiambishi cha nafsi ya pili wingi.
- source_word: תִתְגֹּדְדוּ
  choice: msijikatekate
  rationale: Kitenzi cha kujirejelea kinaonyesha kujitia mikato, hasa katika desturi ya maombolezo. ‘Kujikatekate’ ni wazi na ya kawaida katika Kiswahili cha sasa.
- source_word: תָשִׂימוּ קָרְחָה
  choice: msijinyoe kipara
  rationale: Muungano huu unaeleza kutengeneza sehemu isiyo na nywele kwa kunyoa. Kiswahili cha asili hutumia ‘kunyoa kipara’ kuliko tafsiri ngumu ya ‘kuweka upara’.
- source_word: בֵּין עֵינֵיכֶם
  choice: katikati ya macho yenu
  rationale: Huhifadhi nahau ya Kiebrania kihalisi; maelezo ya chini yanafafanua kuwa inakusudia eneo la paji la uso.
- source_word: לָמֵת
  choice: kwa ajili ya mfu
  rationale: Huonyesha kwamba tendo hilo ni ishara ya maombolezo inayofanywa kutokana na kifo cha mtu. Umoja ‘mfu’ unaafikiana na nomino ya Kiebrania yenye umoja.
theological_decisions:
- issue: Neno la utambulisho wa agano lenye jinsia
  choice: wana
  alternative: watoto
  rationale: Chanzo kina nomino ya wingi wa kiume. ‘Wana’ huhifadhi umbo hilo bila kudai kwamba wanawake hawamo katika jumuiya ya agano; ‘watoto’ limetolewa kama tafsiri mbadala.
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina la agano יהוה moja kwa moja. ‘Yahwe’ hulitambulisha kama jina badala ya kulibadilisha kuwa cheo.
- issue: Mahali pa kipara cha maombolezo
  choice: katikati ya macho yenu
  alternative: kwenye paji la uso
  rationale: Matini kuu huhifadhi picha ya Kiebrania, huku maelezo ya chini yakitoa maana yake ya kianatomia katika Kiswahili cha kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Msijikatekate’ na ‘msijinyoe kipara’ ni miundo ya kawaida inayowasilisha desturi za maombolezo kwa uwazi bila kuongeza maelezo yasiyomo katika mstari.
