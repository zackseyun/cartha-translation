  text: You shall surely tithe all the produce of your seed that comes out of the field[a], year by year.
translation:
  language: sw
  text: Ni lazima utoe zaka ya mazao yote ya ulichopanda yanayotoka shambani[a], mwaka baada ya mwaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kawaida zaidi, “Ni lazima utoe zaka ya mazao yote ambayo shamba lako linazalisha kila mwaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַשֵּׂר תְּעַשֵּׂר
  choice: Ni lazima utoe zaka
  rationale: Muundo wa kitenzi-jina kisoukomo ukifuatwa na kitenzi cha mzizi huohuo unasisitiza amri. “Ni lazima utoe zaka” huwasilisha kwa Kiswahili cha kawaida uzito na msisitizo wa amri bila urudiaji usio wa asili.
- source_word: תְּבוּאַת
  choice: mazao
  rationale: Neno hili linamaanisha mazao au mavuno kwa upana. “Mazao” ni neno la kawaida linalojumuisha kile kinachozalishwa na kilimo bila kukifungamanisha na zao moja.
- source_word: זַרְעֶךָ
  choice: mbegu zako
  rationale: Tafsiri hii inadumisha taswira halisi ya mbegu, huku “mazao yote ya mbegu zako” ikionyesha kuwa kinachokusudiwa ni kile kilichotokana na kupandwa.
- source_word: הַיֹּצֵא הַשָּׂדֶה
  choice: yanayotoka shambani
  rationale: Kifungu hiki kinadumisha taswira ya Kiebrania ya mazao ‘yanayotoka’ shambani na bado kinaeleweka kwa Kiswahili cha sasa. Usemi wenye ulaini zaidi umetolewa katika tanbihi.
- source_word: שָׁנָה שָׁנָה
  choice: mwaka baada ya mwaka
  rationale: Urudiaji wa Kiebrania unaonyesha tendo linalorudiwa kila mwaka. “Mwaka baada ya mwaka” hudumisha nguvu hiyo ya urudiaji kwa Kiswahili cha kawaida.
