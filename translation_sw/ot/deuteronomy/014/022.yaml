translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Zaka” ni istilahi iliyozoeleka kwa sehemu ya kumi inayotolewa, na sentensi inadumisha taswira ya mbegu na mazao ya shambani.
