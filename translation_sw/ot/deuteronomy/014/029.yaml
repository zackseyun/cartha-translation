source:
  edition: WLC
  text: וּ/בָ֣א הַ/לֵּוִ֡י כִּ֣י אֵֽין ל/וֹ֩ חֵ֨לֶק וְ/נַחֲלָ֜ה עִמָּ֗/ךְ וְ֠/הַ/גֵּר וְ/הַ/יָּת֤וֹם וְ/הָֽ/אַלְמָנָה֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ וְ/אָכְל֖וּ וְ/שָׂבֵ֑עוּ לְמַ֤עַן יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל מַעֲשֵׂ֥ה יָדְ/ךָ֖ אֲשֶׁ֥ר תַּעֲשֶֽׂה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/029.yaml
  text: And the Levite shall come[a], because he has no portion or inheritance with you, and the sojourner, the fatherless, and the widow who are within your gates, and they shall eat and be satisfied[b], so that Yahweh your God may bless you in all the work of your hands that you do.
translation:
  language: sw
  text: Na Mlawi atakuja, kwa kuwa hana sehemu wala urithi pamoja nawe, na mgeni mkazi[a], yatima, na mjane walio katika miji yako[b]; nao watakula na kushiba, ili Yahweh, Mungu wako, akubariki katika kila kazi ya mikono yako unayoifanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mtu asiye Mwisraeli anayeishi miongoni mwa Waisraeli.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “walio ndani ya malango yako”; hii ni nahau inayomaanisha walio katika miji yako au jamii yako ya mahali hapo.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָא
  choice: atakuja
  rationale: Kitenzi hiki katika muktadha wa maagizo ya kisheria kina nguvu ya wakati ujao unaotarajiwa; “atakuja” ni ya kawaida na huhifadhi mfuatano wa tendo.
- source_word: הַלֵּוִי
  choice: Mlawi
  rationale: Neno linamtaja mtu wa kabila na kundi la Walawi, si lazima kuhani; hivyo “Mlawi” haliongezi hadhi ya ukuhani isiyotajwa.
- source_word: חֵלֶק וְנַחֲלָה
  choice: sehemu wala urithi
  rationale: Jozi hii inaonyesha fungu alilopewa mtu na urithi wa ardhi. “Sehemu wala urithi” huhifadhi istilahi zote mbili na inafaa baada ya ukanushi “hana.”
- source_word: הַגֵּר
  choice: mgeni mkazi
  rationale: גֵּר ni mtu asiye mzawa anayeishi kwa kudumu miongoni mwa Israeli; “mgeni mkazi” huonyesha kwa pamoja ugeni wake na makazi yake katika jamii.
- source_word: הַיָּתוֹם
  choice: yatima
  rationale: “Yatima” ni istilahi ya kawaida ya Kiswahili kwa kundi hili la watu walio katika mazingira hatarishi, bila kulazimisha ufafanuzi mpana kuliko neno la Kiebrania.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: walio katika miji yako
  rationale: Kwa maana ya kimajazi, “malango” yanawakilisha miji au jamii zilizo chini ya mamlaka ya mahali hapo. “Katika miji yako” huwasilisha maana hiyo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi taswira halisi.
- source_word: וְאָכְלוּ וְשָׂבֵעוּ
  choice: Nao watakula na kushiba
  rationale: 'Vitenzi vinaonyesha matokeo yaliyokusudiwa ya kuwapo kwa zaka: watu hao wapate chakula cha kutosha. “Kushiba” ni tafsiri ya moja kwa moja na ya kawaida.'
- source_word: לְמַעַן יְבָרֶכְךָ
  choice: ili ... akubariki
  rationale: “Ili” huhifadhi uhusiano wa kusudi au matokeo, na hali ya kitenzi “akubariki” haibadili kauli hii kuwa ahadi isiyo na sharti.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Tetragramatoni limeandikwa kwa unukuzi “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: בְּכָל מַעֲשֵׂה יָדְךָ אֲשֶׁר תַּעֲשֶׂה
  choice: katika kila kazi ya mikono yako utakayoifanya
  rationale: Kauli hii ya Kiswahili ni ya kawaida na huhifadhi wazo la baraka katika shughuli zote anazozifanya mhusika.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina יהוה moja kwa moja. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Baraka baada ya kuwapa wahitaji chakula
  choice: “ili ... akubariki,” kama kusudi au matokeo yanayotarajiwa
  alternative: “naye ... atakubariki,” kama ahadi ya moja kwa moja isiyo na sharti
  rationale: לְמַעַן pamoja na kitenzi kisichotimilika huacha mvutano kati ya kusudi na matokeo; hali ya Kiswahili “akubariki” huhifadhi hilo bila kuifanya kuwa dhamana isiyo na sharti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umeweka orodha ya makundi yaliyo hatarini na umetumia sentensi fupi ili kuzuia utata wa kisarufi. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayofafanuliwa.
