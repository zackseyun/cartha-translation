  to: Na Mlawi atakuja, kwa kuwa hana sehemu wala urithi pamoja nawe, na mgeni mkazi[a], yatima, na mjane walio katika miji yako[b]; nao watakula na kushiba, ili Yahweh, Mungu wako, akubariki katika kila kazi ya mikono yako unayoifanya.
