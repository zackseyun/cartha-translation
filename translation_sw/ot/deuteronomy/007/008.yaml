id: DEU.7.8
reference: Deuteronomy 7:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּי֩ מֵֽ/אַהֲבַ֨ת יְהוָ֜ה אֶתְ/כֶ֗ם וּ/מִ/שָּׁמְר֤/וּ אֶת הַ/שְּׁבֻעָה֙ אֲשֶׁ֤ר נִשְׁבַּע֙ לַ/אֲבֹ֣תֵי/כֶ֔ם הוֹצִ֧יא יְהוָ֛ה אֶתְ/כֶ֖ם בְּ/יָ֣ד חֲזָקָ֑ה וַֽ/יִּפְדְּ/ךָ֙ מִ/בֵּ֣ית עֲבָדִ֔ים מִ/יַּ֖ד פַּרְעֹ֥ה מֶֽלֶךְ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/008.yaml
  text: but because Yahweh loves you and because he is keeping the oath that he swore to your fathers[a], Yahweh brought you out with a mighty hand and redeemed you from the house of servants[b], from the hand of Pharaoh king of Egypt.
translation:
  language: sw
  text: Lakini kwa sababu Yahweh anawapenda, na kwa sababu anatimiza kiapo alichowaapia baba zenu, Yahweh aliwatoa kwa mkono wenye nguvu na akawakomboa kutoka katika nyumba ya utumwa[a], kutoka mkononi mwa Farao, mfalme wa Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “nyumba ya watumwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: lakini kwa sababu
  rationale: Katika muktadha, neno hili linaeleza sababu huku likitofautisha na sababu iliyokataliwa katika mstari wa 7; “lakini kwa sababu” huhifadhi kazi zote mbili.
- source_word: מֵאַהֲבַת יְהוָה אֶתְכֶם
  choice: kwa sababu Yahweh anawapenda
  rationale: Muundo unaonyesha sababu. Kiswahili cha kitenzi ni cha kawaida na huhifadhi wazo la upendo wa Yahweh kuwa msingi wa tendo lake.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa moja kwa moja katika Kiebrania, hivyo limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: וּמִשָּׁמְרוֹ אֶת הַשְּׁבֻעָה
  choice: na kwa sababu anatimiza kiapo
  rationale: Kitenzi שׁמר hapa kina maana ya kushika au kutekeleza kwa uaminifu. “Anatimiza kiapo” ni Kiswahili cha asili kinachoonyesha uaminifu wake unaoendelea kwa kiapo hicho.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֵיכֶם
  choice: alichowaapia baba zenu
  rationale: Huhifadhi lugha ya kiapo na rejeo mahususi kwa mababa wa agano; “kuwaapia” ni muundo wa kawaida wa Kiswahili.
- source_word: הוֹצִיא
  choice: aliwatoa
  rationale: Ni lugha ya kawaida ya Kutoka Misri na hueleza kuwatoa kutoka mahali au hali ya utumwa.
- source_word: בְּיָד חֲזָקָה
  choice: kwa mkono wenye nguvu
  rationale: Huhifadhi taswira ya mkono katika Kiebrania na maana ya tendo kuu lenye nguvu.
- source_word: וַיִּפְדְּךָ
  choice: kuwakomboa
  rationale: Huhifadhi maana ya kuwaweka huru kutoka kifungoni kwa tendo la ukombozi, pamoja na uzito wa kihistoria na kitheolojia wa Kutoka.
- source_word: מִבֵּית עֲבָדִים
  choice: kutoka nyumba ya utumwa
  rationale: Kiebrania halisi ni “nyumba ya watumwa,” lakini katika Kiswahili “nyumba ya utumwa” ni nahau iliyo wazi na ya kawaida kwa eneo au hali iliyotawaliwa na utumwa.
- source_word: מִיַּד פַּרְעֹה
  choice: kutoka mkononi mwa Farao
  rationale: Huhifadhi taswira ya Kiebrania ya kuokolewa kutoka katika mamlaka au nguvu ya mtu.
- source_word: מֶלֶךְ מִצְרָיִם
  choice: mfalme wa Misri
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya cheo hicho.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Matini ya Kiebrania inatumia jina la agano lenyewe; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Neno la mababu wa agano אֲבֹתֵיכֶם
  choice: baba zenu
  alternative: mababu zenu
  rationale: “Baba zenu” huhifadhi umbo la kiume na rejeo la kihistoria kwa mababa wa agano bila kulifanya kuwa la jumla zaidi.
- issue: Taswira ya עֲבָדִים katika kifungo cha Misri
  choice: nyumba ya utumwa
  alternative: nyumba ya watumwa
  rationale: Muktadha unahitaji lugha dhahiri ya utumwa. Chaguo kuu ni la asili zaidi katika Kiswahili, huku tanbihi ikihifadhi umbo halisi la Kiebrania.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Umoja na wingi umefuata mwelekeo wa Kiebrania: “ninyi” katika sehemu kubwa ya mstari, ingawa kitenzi cha “kuwakomboa” katika Kiebrania hubadilika kuwa umoja wa pamoja; Kiswahili kimetumia wingi kwa mtiririko wa kawaida na kwa kuwa taifa zima ndilo linalosemewa.'
