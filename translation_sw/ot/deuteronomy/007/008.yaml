  to: Lakini kwa sababu Yahweh anawapenda, na kwa sababu anatimiza kiapo alichowaapia baba zenu, Yahweh aliwatoa kwa mkono wenye nguvu na akawakomboa kutoka katika nyumba ya utumwa[a], kutoka mkononi mwa Farao, mfalme wa Misri.
