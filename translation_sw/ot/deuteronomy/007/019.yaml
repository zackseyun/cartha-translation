  text: הַ/מַּסֹּ֨ת הַ/גְּדֹלֹ֜ת אֲשֶׁר רָא֣וּ עֵינֶ֗י/ךָ וְ/הָ/אֹתֹ֤ת וְ/הַ/מֹּֽפְתִים֙ וְ/הַ/יָּ֤ד הַ/חֲזָקָה֙ וְ/הַ/זְּרֹ֣עַ הַ/נְּטוּיָ֔ה אֲשֶׁ֥ר הוֹצִֽאֲ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ כֵּֽן יַעֲשֶׂ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/כָל הָ֣/עַמִּ֔ים אֲשֶׁר אַתָּ֥ה יָרֵ֖א מִ/פְּנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/019.yaml
  text: the great trials that your eyes saw[a], and the signs, and the wonders, and the mighty hand[b], and the outstretched arm by which Yahweh your God brought you out—so Yahweh your God will do to all the peoples of whom you are afraid.
translation:
  language: sw
  text: majaribu makubwa ambayo macho yako yaliona[a], ishara, maajabu, mkono wenye nguvu, na mkono ulionyoshwa ambao Yahwe Mungu wako alikutoa kwa huo—vivyo hivyo Yahwe Mungu wako atawatendea mataifa yote[b] unayoyaogopa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “majaribio makubwa.” Neno la Kiebrania linaweza kumaanisha majaribio au hali kali za kujaribu.
    reason: lexical_alternative
  - marker: b
    text: Au, “watu wote.” Tafsiri ya moja kwa moja zaidi ya neno la Kiebrania ni “watu,” yaani makundi ya watu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּסֹּת הַגְּדֹלֹת
  choice: majaribu makubwa
  rationale: Neno מַסּוֹת linaweza kumaanisha majaribio au hali kali za kujaribu. “Majaribu makubwa” ni lugha ya kawaida na yenye hadhi, huku tanbihi ikihifadhi maana mbadala.
- source_word: רָאוּ עֵינֶיךָ
  choice: ambayo macho yako yaliona
  rationale: Muundo huu unahifadhi kutajwa wazi kwa macho, ambako kunasisitiza ushuhuda wa moja kwa moja.
- source_word: הָאֹתֹת וְהַמֹּפְתִים
  choice: ishara, maajabu
  rationale: “Ishara” ni tafsiri ya kawaida ya אוֹת, na “maajabu” hudumisha uhusiano wake na מוֹפֵת bila kuifanya istilahi hiyo iwe mahsusi kuliko Kiebrania.
- source_word: הַיָּד הַחֲזָקָה
  choice: mkono wenye nguvu
  rationale: Hii huhifadhi sitiari ya Kiebrania kuhusu utendaji wenye nguvu wa Mungu kwa lugha ya Kiswahili iliyo wazi.
- source_word: הַזְּרֹעַ הַנְּטוּיָה
  choice: mkono ulionyoshwa
  rationale: Kiswahili hutumia “mkono” kwa hand na arm; usemi huu wa kawaida huhifadhi picha ya nguvu ya Mungu inayotenda katika ukombozi na hukumu.
- source_word: אֲשֶׁר הוֹצִאֲךָ
  choice: ambao kwa huo ... alikutoa
  rationale: Kiwakilishi kinaunganishwa na “mkono ulionyoshwa,” huku “alikutoa” kikihifadhi maana ya Hiphil ya יצא katika simulizi la kutoka Misri.
- source_word: יְהוָה
  choice: Yahwe
  rationale: “Yahwe” ni umbo la Kiswahili la jina la Mungu YHWH, badala ya kulibadilisha kuwa cheo.
- source_word: כֵּן יַעֲשֶׂה
  choice: vivyo hivyo ... atawatendea
  rationale: “Vivyo hivyo” linaonyesha wazi ulinganisho kati ya matendo ya Mungu huko Misri na yale atakayowatendea watu wanaoogopwa.
- source_word: לְכָל הָעַמִּים
  choice: watu wote
  rationale: עַמִּים ni wingi wa “watu” kwa maana ya makundi ya watu; “watu wote” ni ya asili katika Kiswahili, na “mataifa yote” limehifadhiwa katika tanbihi.
- source_word: אֲשֶׁר אַתָּה יָרֵא מִפְּנֵיהֶם
  choice: unaowaogopa
  rationale: Hii ni tafsiri ya asili ya nahau ya Kiebrania מִפְּנֵיהֶם katika muktadha huu, bila kuingiza wazo la ziada.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi kwa umbo linalofaa tahajia ya Kiswahili.
- issue: Mhusika anayepitia “majaribu”
  choice: Kudumisha usemi mpana “majaribu makubwa”
  alternative: matendo makubwa ya kuwajaribu Wamisri
  rationale: Kiebrania hakitaji moja kwa moja hapa ni nani aliyejaribiwa; kuongeza “Wamisri” kungeondoa utata uliopo katika chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa nomino na alama ya mkato mrefu umehifadhiwa kwa sababu mstari huu unaendeleza kisarufi amri ya kukumbuka iliyo katika muktadha uliotangulia. Marudio ya viunganishi yamepunguzwa kidogo ili sentensi isikike ya asili bila kupoteza orodha ya matendo ya Mungu.
