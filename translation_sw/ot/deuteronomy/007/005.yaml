base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/005.yaml
  text: 'But this is what you shall do to them: you shall tear down their altars[a], shatter their pillars, cut down their Asherah poles[c][b], and burn their carved images with fire.'
translation:
  language: sw
  text: 'Lakini hivi ndivyo mtakavyowatendea: zibomoeni madhabahu zao, zivunjeni nguzo zao za ibada[a], yakateni maashera yao[b], na zichomeni kwa moto sanamu zao za kuchongwa[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mawe yao matakatifu yaliyosimamishwa.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: Asherim; vitu vya ibada, ambavyo huenda vilikuwa vya mbao, vilivyohusishwa na mungu wa kike Ashera.'
    reason: cultural_note
  - marker: c
    text: Au “sanamu zao”; Kiebrania hurejelea hasa sanamu zilizochongwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם כֹּה תַעֲשׂוּ לָהֶם
  choice: Lakini hivi ndivyo mtakavyowatendea
  rationale: Kirai hiki kinaonyesha tofauti thabiti na agizo lililotangulia, kisha kinaelekeza mbele kwenye hatua zinazofuata. Kauli hii ni ya kawaida na yenye nguvu ya maagizo katika Kiswahili.
- source_word: מִזְבְּחֹתֵיהֶם תִּתֹּצוּ
  choice: zibomoeni madhabahu zao
  rationale: Kitenzi נתץ humaanisha kubomoa au kuangusha jengo; “zibomoeni” kinafaa kwa madhabahu na kinadumisha nguvu ya agizo.
- source_word: מַצֵּבֹתָם תְּשַׁבֵּרוּ
  choice: zivunjeni nguzo zao za ibada
  rationale: מַצֵּבָה ni jiwe au nguzo iliyosimamishwa kwa matumizi ya kidini, na Piel ya שׁבר inadai kitendo cha kuvunja kwa nguvu. “Za ibada” huzuia nguzo hizi zisieleweke kama sehemu za kawaida za jengo.
- source_word: אֲשֵׁירֵיהֶם תְּגַדֵּעוּן
  choice: yakateni maashera yao
  rationale: אֲשֵׁרִים ni vitu vya ibada vilivyohusishwa na mungu wa kike Ashera, ambavyo huenda vilikuwa vya mbao. Uhamishaji “maashera” haubani maana kuwa nguzo pekee, huku “yakateni” kikidumisha kitendo halisi cha גדע.
- source_word: פְסִילֵיהֶם
  choice: sanamu zao za kuchongwa
  rationale: פֶּסֶל hueleza sanamu iliyotengenezwa kwa kuchonga. Tafsiri hii inadumisha maana halisi badala ya kutumia neno la jumla tu kama “miungu.”
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: zichomeni kwa moto
  rationale: Kiebrania kinataja moto waziwazi; “kwa moto” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Iwapo אֲשֵׁרִים itafsiriwe kama kitu maalumu cha ibada au kama sanamu kwa ujumla
  choice: maashera
  alternative: nguzo za Ashera; sanamu za Ashera
  rationale: Orodha inatofautisha aina mbalimbali za vitu vya ibada. “Maashera” hudumisha rejeleo maalumu la kihistoria na pia kutotilia mkazo kupita kiasi umbo halisi la vitu hivyo, ambalo halijulikani kwa uhakika.
- issue: Nguvu ya agizo la kuharibu mahali na vitu vya ibada
  choice: 'Vitenzi vya amri vya moja kwa moja: zibomoeni, zivunjeni, yakateni, zichomeni'
  alternative: Kauli laini kama “viondoeni”
  rationale: Maandishi ya Kiebrania yana maagizo halisi na makali. Tafsiri inadumisha nguvu hiyo bila kuongeza sababu ya kitheolojia isiyotajwa katika aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa amri ni wa moja kwa moja na wenye nguvu. Neno “maashera” limefafanuliwa katika tanbihi ili kuhifadhi umaalumu na kutokuwa na uhakika kwa kitu hicho cha kale.
