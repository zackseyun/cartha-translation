review_pass:
  verdict: revise
  source_fidelity: The rendering accurately conveys Yahweh's bringing Israel into the land, Israel's entry in order to possess it, the removal of the seven named peoples, and the concluding comparative phrase. However, Hebrew רַבִּים in the final summary means ‘many/more numerous’; ‘makubwa’ (‘great/large’) is less precise and should be adjusted.
  naturalness: The sentence is fluent Standard East African Swahili and appropriately remains incomplete with a comma, since the syntax continues into the next verse. The coordinated infinitive ‘na kuyafukuza’ is natural in this conditional-temporal construction.
  terminology: ‘Yahwe Mungu wako,’ ‘nchi,’ ‘kuimiliki,’ and the people-group names are suitable. ‘Mataifa saba yaliyo mengi na yenye nguvu kuliko wewe’ more directly represents the Hebrew wording than ‘mataifa saba makubwa na yenye nguvu kuliko wewe.’
  issues:
  - severity: medium
    issue: The final phrase translates רַבִּים as ‘makubwa.’
    rationale: The source describes the seven nations as more numerous/many as well as stronger than Israel. While ‘makubwa’ can suggest size or greatness, it does not clearly preserve the numerical sense supplied by רַבִּים.
  revised_text: Yahwe Mungu wako atakapokuingiza katika nchi unayoingia ili kuimiliki, na kuyafukuza mataifa mengi mbele yako[a]—Wahiti, Wagirgashi, Waamori, Wakanaani, Waperizi, Wahivi na Wayebusi—mataifa saba yaliyo mengi na yenye nguvu kuliko wewe[b],
  revised_footnotes:
  - marker: a
    text: Au, “na kuyaondolea milki mataifa mengi mbele yako.”
    reason: lexical_alternative
  - marker: b
    text: Au, “yaliyo na watu wengi zaidi na yenye nguvu kuliko wewe.”
    reason: lexical_alternative
  revision_rationale: ‘Makubwa’ has been replaced by ‘yaliyo mengi’ to retain the source’s explicit numerical comparison (רַבִּים), while retaining the established phrasing, names, register, footnote anchors, and continuing comma.
