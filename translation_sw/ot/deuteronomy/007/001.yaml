source:
  edition: WLC
  text: כִּ֤י יְבִֽיאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ וְ/נָשַׁ֣ל גּֽוֹיִם רַבִּ֣ים מִ/פָּנֶ֡י/ךָ הַֽ/חִתִּי֩ וְ/הַ/גִּרְגָּשִׁ֨י וְ/הָ/אֱמֹרִ֜י וְ/הַ/כְּנַעֲנִ֣י וְ/הַ/פְּרִזִּ֗י וְ/הַֽ/חִוִּי֙ וְ/הַ/יְבוּסִ֔י שִׁבְעָ֣ה גוֹיִ֔ם רַבִּ֥ים וַ/עֲצוּמִ֖ים מִמֶּֽ/ךָּ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/001.yaml
  text: When Yahweh your God brings you into the land that you are entering to possess[a], and drives out before you many nations—the Hittites, the Girgashites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—seven nations greater and mightier than you[b],
translation:
  language: sw
  text: Yahwe Mungu wako atakapokuingiza katika nchi unayoingia ili kuimiliki, na kuyafukuza mataifa mengi mbele yako[a]—Wahiti, Wagirgashi, Waamori, Wakanaani, Waperizi, Wahivi na Wayebusi—mataifa saba yaliyo mengi na yenye nguvu kuliko wewe[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kuyaondolea milki mataifa mengi mbele yako.”
    reason: lexical_alternative
  - marker: b
    text: Au, “yaliyo na watu wengi zaidi na yenye nguvu kuliko wewe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: atakapo-
  rationale: Katika muktadha huu neno hilo linaanzisha hali ya wakati inayotangulia maagizo yanayofuata; muundo wa Kiswahili wa “atakapo-” unaonyesha maana ya “wakati” kwa ufasaha.
- source_word: יְבִיאֲךָ
  choice: atakapokuingiza
  rationale: Hifili ya בוא ina maana ya kusababisha mtu aingie au kumleta ndani; “kuingiza” huhifadhi maana hiyo ya kisababishi kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kwa namna ya moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huhifadhi umilikishi wa nafsi ya pili umoja na utambulisho wa Mungu wa agano.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: “Nchi” ni neno la kawaida la Kiswahili kwa eneo la ahadi katika muktadha huu.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: unayoingia
  rationale: Hutoa kwa lugha ya sasa wazo la Israeli kuwa karibu kuingia humo bila kurudia kielezi “huko” kisichohitajika katika Kiswahili.
- source_word: לְרִשְׁתָּהּ
  choice: ili kuimiliki
  rationale: ירשׁ hapa inahusu kuitwaa nchi na kuwa na milki yake; “kuimiliki” huhifadhi upande huo hai wa tendo.
- source_word: וְנָשַׁל
  choice: na kuyafukuza
  rationale: Kitenzi kinaeleza kuyaondoa au kuyanyang’anya mataifa makazi yao; “kuyafukuza” ni Kiswahili cha kawaida huku uwezekano wa “kuyaondolea milki” ukibainishwa katika tanbihi.
- source_word: גּוֹיִם רַבִּים
  choice: mataifa mengi
  rationale: Hapa גּוֹיִם ni makundi tofauti ya watu wanaokaa Kanaani; “mataifa” yanafaa kwa muktadha huo.
- source_word: מִפָּנֶיךָ
  choice: mbele yako
  rationale: Huhifadhi nahau ya Kiebrania inayoonyesha kuondolewa kwao kutoka mbele ya Israeli.
- source_word: הַחִתִּי ... הַיְבוּסִי
  choice: Wahiti, Wagirgashi, Waamori, Wakanaani, Waperizi, Wahivi na Wayebusi
  rationale: Majina yametoholewa kwa maumbo ya Kiswahili ya makundi ya watu; viambishi vya ngeli ya watu vinaonyesha kuwa kila jina linawakilisha taifa zima.
- source_word: שִׁבְעָה גוֹיִם
  choice: mataifa saba
  rationale: Ni muhtasari wa makundi saba yaliyotajwa na hudumisha neno “mataifa” lililotumiwa awali.
- source_word: רַבִּים וַעֲצוּמִים מִמֶּךָּ
  choice: makubwa na yenye nguvu kuliko wewe
  rationale: Huhifadhi ulinganisho wa sifa zote mbili bila kuamua kimya kimya ikiwa רַבִּים inasisitiza ukubwa au wingi wa watu.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina יהוה moja kwa moja; “Yahwe” huhifadhi jina hilo la agano bila kulibadilisha kuwa cheo.
- issue: Maana ya ירשׁ katika kuingia Kanaani
  choice: kuimiliki
  alternative: kuirithi
  rationale: Katika muktadha wa kuingia na kuyaondoa mataifa, kitenzi kinajumuisha kuitwaa nchi na kuwa na milki yake. “Kuirithi” inawezekana, lakini inaweza kupunguza upande hai wa tendo katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wa sasa na unaosomeka kwa urahisi. Sentensi imeachwa ikiishia kwa koma kwa sababu mstari huu ni kishazi kinachoendelea katika mstari unaofuata. Alama za tanbihi [a] na [b] zimewekwa mahali zinapohusu moja kwa moja.
