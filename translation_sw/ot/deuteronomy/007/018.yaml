  text: You shall not fear them[a]; you shall surely remember what Yahweh your God did to Pharaoh and to all Egypt.
translation:
  language: sw
  text: Usiwaogope; kumbuka vizuri[a] mambo ambayo Yahweh Mungu wako aliyowatendea Farao na Misri yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hurudia kitenzi cha “kukumbuka” kwa muundo wa msisitizo, wenye maana ya “hakika kumbuka” au “kumbuka vizuri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִירָא מֵהֶם
  choice: Usiwaogope
  rationale: Kitenzi katika umoja pamoja na לֹא kina nguvu ya katazo katika muktadha huu. Kiswahili cha kawaida hutumia hali ya kukanusha ya amri, “Usiwaogope,” huku kiwakilishi cha wingi kikiwakilisha wale wanaotajwa katika muktadha.
- source_word: זָכֹר תִּזְכֹּר
  choice: kumbuka vizuri
  rationale: Muundo wa kitenzi-jina halisi pamoja na kitenzi kisichotimilika unakazia tendo la kukumbuka. “Kumbuka vizuri” ni Kiswahili cha asili kinachobeba msisitizo huo bila kuongeza wazo lisilokuwamo katika Kiebrania.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: yale ambayo ... alimfanyia
  rationale: Kauli hii inarejelea matendo ya kihistoria yaliyokamilika. “Yale ambayo ... alimfanyia” ni usemi wa kawaida wa Kiswahili na huhifadhi wazo la mambo aliyotenda kwa mhusika aliyetajwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Kiambishi cha Kiebrania ni cha nafsi ya pili, umoja wa kiume; “Mungu wako” huhifadhi usemi wa moja kwa moja kwa Israeli ikiwakilishwa katika umoja.
- source_word: לְפַרְעֹה
  choice: alimfanyia Farao
  rationale: Baada ya עשה, kihusishi לְ humtaja aliyeathiriwa na tendo. Muundo “alimfanyia Farao” ni wa asili katika Kiswahili.
- source_word: וּלְכָל מִצְרָיִם
  choice: na Misri yote
  rationale: Kiebrania kinataja Misri kwa maana ya jumla, si Wamisri pekee. “Misri yote” huhifadhi upana huo wa nchi na taifa kwa pamoja.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia jina la agano יְהוָה moja kwa moja. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Katazo “Usiwaogope” na amri “kumbuka vizuri” hudumisha sauti ya moja kwa moja na nzito ya agano; alama ya tanbihi imewekwa kwenye kauli ya kukumbuka inayofafanuliwa.
