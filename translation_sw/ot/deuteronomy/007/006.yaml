base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/006.yaml
  text: For you are a holy people to Yahweh your God. Yahweh your God has chosen you to be a treasured people for himself[a], from all the peoples who are on the face of the earth.
translation:
  language: sw
  text: Kwa maana wewe ni taifa takatifu kwa Yahwe Mungu wako. Yahwe Mungu wako amekuchagua kutoka miongoni mwa mataifa yote yaliyo juu ya uso wa dunia, ili uwe taifa lake la thamani[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mali yake ya thamani.” Kiebrania kinasema kihalisi “taifa la mali ya thamani,” kikunganisha wazo la taifa na la mali inayothaminiwa kwa namna ya pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha kwamba kauli hii ndiyo msingi wa amri iliyotangulia, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: עַם קָדוֹשׁ
  choice: taifa takatifu
  rationale: Neno עַם humaanisha watu kama jumuiya; ‘taifa’ linaepuka usemi usio wa kawaida ‘wewe ni watu’ na kudumisha wazo la jumuiya iliyotengwa kwa Mungu.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: kwa Yahwe Mungu wako
  rationale: Kihusishi ל kinaonyesha uhusiano na umilikaji; ‘kwa’ kinadumisha muundo huo bila kuufafanua kupita kiasi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetolewa kama jina maalumu badala ya kubadilishwa kuwa cheo.
- source_word: בְּךָ בָּחַר
  choice: amekuchagua
  rationale: Kitenzi בחר kinaonyesha kuchagua; wakati timilifu unaonyesha tendo lililofanyika ambalo matokeo yake yanaendelea.
- source_word: לִהְיוֹת לוֹ לְעַם סְגֻלָּה
  choice: ili uwe taifa lake la thamani
  rationale: ‘Ili uwe’ huonyesha kusudi, ‘lake’ huonyesha kuwa wake, na ‘la thamani’ huwasilisha wazo la סְגֻלָּה kama mali inayothaminiwa sana huku עַם ikibaki dhahiri kupitia ‘taifa.’
- source_word: מִכֹּל הָעַמִּים
  choice: kutoka miongoni mwa mataifa yote
  rationale: Hueleza kuchaguliwa kutoka ndani ya kundi la mataifa yote bila kuongeza wazo la ubora wa asili.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: yaliyo juu ya uso wa dunia
  rationale: Huhifadhi taswira ya nahau ya Kiebrania na inaeleweka katika Kiswahili cha sasa.
theological_decisions:
- issue: Utoaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia moja kwa moja jina la agano; kulitaja kama ‘Yahwe’ hulihifadhi kama jina maalumu.
- issue: Maana ya kuchaguliwa katika מִכֹּל הָעַמִּים
  choice: kutoka miongoni mwa mataifa yote
  alternative: juu kuliko mataifa yote
  rationale: Kiebrania kinaonyesha uchaguzi kutoka miongoni mwa mataifa, si lazima dai kwamba Israeli ina ubora wa asili kuliko mataifa mengine.
- issue: Uhusiano wa taifa na Mungu katika לִהְיוֹת לוֹ
  choice: taifa lake
  alternative: taifa kwa ajili yake mwenyewe
  rationale: ‘Lake’ huonyesha kwa ufupi na wazi umilikaji unaodokezwa na לו, bila kuongeza ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Umoja wa ‘wewe/wako/amekuchagua’ umehifadhiwa kwa sababu Kiebrania linaielekea Israeli kwa umoja kama jumuiya; ‘taifa’ limetumiwa ili sentensi ibaki ya kawaida kisarufi.
