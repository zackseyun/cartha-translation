source:
  edition: WLC
  text: וַ/אֲהֵ֣בְ/ךָ֔ וּ/בֵרַכְ/ךָ֖ וְ/הִרְבֶּ֑/ךָ וּ/בֵרַ֣ךְ פְּרִֽי בִטְנְ/ךָ֣ וּ/פְרִֽי אַ֠דְמָתֶ/ךָ דְּגָ֨נְ/ךָ֜ וְ/תִֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֗/ךָ שְׁגַר אֲלָפֶ֨י/ךָ֙ וְ/עַשְׁתְּרֹ֣ת צֹאנֶ֔/ךָ עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁר נִשְׁבַּ֥ע לַ/אֲבֹתֶ֖י/ךָ לָ֥/תֶת לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/013.yaml
  text: He will love you[a], bless you, and multiply you. He will bless the fruit of your womb and the fruit of your ground—your grain, your new wine, and your oil, the offspring of your herds and the young of your flock—in the land that he swore to your fathers to give you.
translation:
  language: sw
  text: Atakupenda, atakubariki na kukufanya uongezeke. Atabariki uzao wa tumbo lako na mazao ya ardhi yako—nafaka yako, divai yako mpya na mafuta yako, ndama wa makundi yako ya ng’ombe na vitoto vya makundi yako ya kondoo na mbuzi—katika nchi ambayo aliwaapia baba zako[a] kwamba atakupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mababu zako.” Kiebrania ni “baba zako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲהֵבְךָ
  choice: Atakupenda
  rationale: Muktadha unaendeleza ahadi za baraka kwa nguvu ya wakati ujao; kitenzi ‘kupenda’ kinahifadhi wazi upendo wa agano.
- source_word: וּבֵרַכְךָ וְהִרְבֶךָ
  choice: atakubariki na kukufanya uongezeke
  rationale: ‘Kubariki’ ni sawia ya kawaida ya ברך, na ‘kukufanya uongezeke’ huonyesha ongezeko la watu na uzao huku ikibaki Kiswahili cha kawaida.
- source_word: פְּרִי בִטְנְךָ
  choice: uzao wa tumbo lako
  rationale: Inahifadhi taswira halisi ya Kiebrania ya ‘tunda la tumbo’ lakini hutumia ‘uzao’ ili maana ya watoto iwe wazi na ya asili kwa Kiswahili.
- source_word: פְּרִי אַדְמָתֶךָ
  choice: mazao ya ardhi yako
  rationale: ‘Mazao’ hutoa maana ya mavuno yanayotokana na ardhi kwa Kiswahili cha sasa.
- source_word: דְּגָנְךָ וְתִירֹשְׁךָ וְיִצְהָרֶךָ
  choice: nafaka yako, divai yako mpya na mafuta yako
  rationale: Maneno haya yanawakilisha mazao makuu ya nafaka, divai mpya, na mafuta; ‘divai mpya’ huhifadhi utofauti wa תירוש na divai kwa ujumla.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: ndama wa makundi yako ya ng’ombe
  rationale: Nahau hii inamaanisha uzao wa ng’ombe; ‘ndama’ ni neno wazi na halisi, na ‘makundi’ linaonyesha wingi wa Kiebrania.
- source_word: עַשְׁתְּרֹת צֹאנֶךָ
  choice: vitoto vya kondoo na mbuzi wako
  rationale: Katika muungano huu neno adimu linamaanisha uzao wa mifugo midogo; kutaja kondoo na mbuzi hufafanua upeo wa צאן bila kuingiza jina la mungu wa kike Ashtorethi.
- source_word: עַל הָאֲדָמָה
  choice: katika nchi
  rationale: Hapa ardhi ni eneo la ahadi ambamo baraka zitatimizwa, hivyo ‘katika nchi’ ni usemi wa asili.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: ambayo aliwaapia baba zako kwamba atakupa
  rationale: Inahifadhi kiapo, walengwa wake, na ahadi ya kumpa Israeli nchi, kwa mpangilio wa asili wa Kiswahili.
theological_decisions:
- issue: Maana ya לַאֲבֹתֶיךָ
  choice: baba zako
  alternative: mababu zako
  rationale: Kiebrania ni nomino ya kiume ya wingi, ‘baba’; maandishi makuu yanaihifadhi, huku tanbihi ikitoa ‘mababu’ kama Kiswahili kinachoeleza maana pana ya vizazi vilivyotangulia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Taswira za uzazi na mazao zimehifadhiwa pale zinapokuwa wazi; nahau za mifugo zimefafanuliwa kwa majina ya kawaida ya wanyama.
