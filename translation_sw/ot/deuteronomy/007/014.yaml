base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/014.yaml
  text: You will be blessed above all peoples[a]; there will not be among you a barren man or woman[b], or among your livestock.
translation:
  language: sw
  text: Utabarikiwa kuliko mataifa yote[a]; hakutakuwa na mwanamume tasa wala mwanamke tasa kwako, wala katika mifugo yako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zaidi ya mataifa yote.” Kihusishi cha Kiebrania hapa kinaweza kuonyesha ulinganisho.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kinatumia wazi maumbo ya kiume na ya kike: “mwanamume tasa wala mwanamke tasa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ תִּהְיֶה
  choice: Utabarikiwa
  rationale: Muundo huu wa Kiswahili unaonyesha hali ya kupokea baraka na pia nguvu ya ahadi ya wakati ujao katika muktadha wa agano.
- source_word: מִכָּל הָעַמִּים
  choice: kuliko mataifa yote
  rationale: מן hapa ina nguvu ya ulinganisho. Ingawa עַמִּים kimsingi ni ‘jamii za watu,’ ‘mataifa yote’ ni usemi wa kawaida na wenye kueleweka katika Kiswahili kwa vikundi vya watu vinavyolinganishwa na Israeli.
- source_word: לֹא יִהְיֶה בְךָ
  choice: Kwako hatakuwapo
  rationale: Huu ni usemi wa kuwapo unaokanusha uwepo ndani ya jumuiya. ‘Kwako’ inadumisha nafsi ya pili umoja inayomwelekea Israeli kama taifa moja la agano.
- source_word: עָקָר וַעֲקָרָה
  choice: mwanamume tasa wala mwanamke tasa
  rationale: Kiebrania kinataja wazi maumbo ya kiume na ya kike. Kurudia ‘tasa’ kunaweka wazi kwamba neno hilo linawahusu wote wawili na ni Kiswahili cha moja kwa moja kisicho cha kitabibu kupita kiasi.
- source_word: וּבִבְהֶמְתֶּךָ
  choice: wala katika mifugo yako
  rationale: בְּהֵמָה ni nomino ya jumla inayohusu wanyama wanaofugwa; ‘mifugo’ ni neno la kawaida, pana, na la sasa.
theological_decisions:
- issue: Kutajwa kwa jinsia zote katika ahadi ya uzazi
  choice: Kutaja wazi ‘mwanamume tasa wala mwanamke tasa’
  alternative: Kutumia usemi wa jumla kama ‘mtu tasa’
  rationale: Maumbo mawili ya Kiebrania yanatofautisha kiume na kike; kuyahifadhi huepuka kufuta utofauti uliopo katika matini.
- issue: Israeli kuzungumziwa kwa nafsi ya pili umoja
  choice: Kutumia ‘kwako’ na ‘yako’
  alternative: Kutumia wingi ‘miongoni mwenu’ na ‘yenu’
  rationale: Umoja wa kisarufi unadumisha namna Kiebrania kinavyolihutubia taifa la Israeli kwa pamoja kama umoja wa agano.
- issue: Nguvu ya ulinganisho katika מִכָּל הָעַמִּים
  choice: ‘kuliko mataifa yote’
  alternative: ‘zaidi ya mataifa yote’
  rationale: Chaguo zote mbili zinaweza kuonyesha ulinganisho. ‘Kuliko’ ni la kawaida na halielezi kwa undani zaidi namna au kiwango cha baraka kuliko inavyofanya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha umoja wa hotuba kwa Israeli kupitia ‘kwako/yako,’ huku ikitaja jinsia zote kwa uwazi na kutumia ‘mifugo’ kama istilahi pana ya wanyama wanaofugwa.
