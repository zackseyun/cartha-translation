  source_fidelity: 'Msingi wa tafsiri unafuata Kiebrania vizuri: wingi wa amri ya kwanza na umoja wa maonyo yanayofuata umehifadhiwa, na ''chukizo kwa Yahweh Mungu wako'' unadumisha uzito na utata wa rejeo la mwisho. Hata hivyo, ''sanamu za kuchonga'' inaweza kusikika kama sanamu zinazokusudiwa kuchongwa, badala ya sanamu ambazo zimechongwa. Pia ''navyo'' huweka rejeo katika wingi, ilhali בּוֹ ni umoja na huacha rejeo lake pana bila kulibainisha.'
