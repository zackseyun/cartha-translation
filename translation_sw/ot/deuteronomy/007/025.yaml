  terminology: '''Sanamu,'' ''miungu,'' ''kutamani,'' ''chukizo,'' na ''Yahweh'' zinafaa kwa rejista ya kibiblia ya Kiswahili cha Afrika Mashariki. Tahajia ''Yahweh'' inaendana pia na uamuzi wa njia ya ukaguzi wa Kiingereza wa kunakili Tetragramu badala ya kutumia cheo.'
