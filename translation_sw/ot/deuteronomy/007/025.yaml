base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/025.yaml
  text: You shall burn the carved images of their gods with fire[a]. You shall not covet the silver or gold that is on them and take it for yourself, lest you be ensnared by it[b], for it is an abomination to Yahweh your God.
translation:
  language: sw
  text: Sanamu zilizochongwa za miungu yao mtaziteketeza kwa moto. Usitamani fedha wala dhahabu zilizo juu ya sanamu hizo, wala usizichukue kwa ajili yako mwenyewe[a], usije ukategwa nayo[b], kwa maana ni chukizo kwa Yahweh Mungu wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kina kiunganishi ‘na’: ‘fedha na dhahabu.’ Katika katazo la Kiswahili, ‘wala’ huonyesha kwamba chochote kati ya hivyo hakipaswi kutamaniwa au kuchukuliwa.'
    reason: lexical_alternative
  - marker: b
    text: Au ‘usije ukanaswa nayo.’ Kitenzi cha Kiebrania kina taswira ya kukamatwa katika mtego.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּסִילֵי
  choice: sanamu za kuchonga
  rationale: Neno hili humaanisha sanamu iliyotengenezwa kwa kuchonga au kukata. Tafsiri hii inadumisha maana halisi bila kutumia neno la kale wala kuongeza tafsiri ya moja kwa moja ya ‘sanamu za kuabudiwa.’
- source_word: אֱלֹהֵיהֶם
  choice: miungu yao
  rationale: Hii ni tafsiri ya kawaida ya umbo la wingi lenye kiambishi cha nafsi ya tatu wingi.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: mtaziteketeza kwa moto
  rationale: ‘Kwa moto’ huonyesha njia ya kuteketeza na kudumisha msisitizo wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: לֹא תַחְמֹד
  choice: usitamani
  rationale: Kitenzi kina maana ya kutamani kwa tamaa kitu kinachovutia; katika muktadha huu katazo lenyewe linaonyesha kuwa ni tamaa isiyofaa.
- source_word: כֶּסֶף וְזָהָב עֲלֵיהֶם
  choice: fedha wala dhahabu zilizo juu ya sanamu hizo
  rationale: Katika katazo la Kiswahili, ‘wala’ huwasilisha kwa kawaida kwamba fedha na dhahabu, kila kimoja, havipaswi kutamaniwa. ‘Juu ya sanamu hizo’ huweka wazi rejeo la kiambishi cha wingi.
- source_word: וְלָקַחְתָּ לָךְ
  choice: wala usizichukue kwa ajili yako mwenyewe
  rationale: Kauli hii inaonyesha kuchukua madini hayo kwa manufaa ya mtu mwenyewe; ‘mwenyewe’ hudumisha nguvu ya לָךְ.
- source_word: פֶּן תִּוָּקֵשׁ בּוֹ
  choice: usije ukategwa navyo
  rationale: ‘Kutegwa’ hudumisha taswira ya kunaswa katika mtego. Kiambishi kinaelekeza kwa mali iliyokatazwa katika muktadha bila kufafanua zaidi aina ya hatari.
- source_word: כִּי תוֹעֲבַת יְהוָה אֱלֹהֶיךָ הוּא
  choice: kwa maana ni chukizo kwa Yahwe Mungu wako
  rationale: ‘Chukizo’ hudumisha uzito wa תוֹעֵבָה. Muundo usio na kiwakilishi dhahiri kwa Kiswahili unahifadhi kutokuwa wazi kwa rejeo la הוּא.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Rejeo la kiwakilishi cha mwisho הוּא
  choice: Muundo ‘ni chukizo’ bila kutaja nomino maalumu
  alternative: Kukitaja chukizo kuwa sanamu yenyewe, madini yaliyotwaliwa, au tendo la kuyachukua
  rationale: Muktadha unaweza kuhusisha sanamu, mali inayotokana nayo, au tendo zima linalofungamana na ibada ya sanamu. Kutotaja nomino maalumu kunadumisha mvutano huo wa Kiebrania.
- issue: Kubadilika kutoka nafsi ya pili wingi kwenda umoja
  choice: ‘mtaziteketeza’ kisha ‘usitamani’
  alternative: Kusawazisha mstari wote kwa wingi au umoja
  rationale: Kiebrania hubadilika kutoka amri kwa jumuiya katika wingi kwenda kumwambia kila Mwisraeli kwa umoja. Tafsiri inadumisha badiliko hilo lenye maana ya hotuba ya agano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Sanamu za kuchonga’ ni wazi kwa msomaji wa kawaida; ‘chukizo’ hudumisha uzito wa lugha ya kidini. Badiliko la nafsi kutoka wingi kwenda umoja limehifadhiwa kwa sababu limo katika chanzo.
