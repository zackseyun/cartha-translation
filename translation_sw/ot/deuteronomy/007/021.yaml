lexical_decisions:
- source_word: תַעֲרֹץ מִפְּנֵיהֶם
  choice: Usitishwe nao
  rationale: Kitenzi ערץ kinaonyesha hofu kali au kutishwa. Kiswahili hiki ni cha kawaida na kinahifadhi nguvu ya katazo pamoja na maana ya nahau ‘mbele yao/kwa sababu yao.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Inahifadhi wazi umbo la nafsi ya pili umoja na uhusiano wa agano.
- source_word: בְּקִרְבְּךָ
  choice: yuko miongoni mwako
  rationale: Inaeleza kuwapo kwa Mungu katika jumuiya ya Israeli inayosemeshwa kama nafsi moja, bila kudokeza tu hali ya ndani ya mtu binafsi.
- source_word: אֵל גָּדוֹל
  choice: Mungu mkuu
  rationale: Inahifadhi jina la kimungu אֵל na maana ya kawaida ya kivumishi גָּדוֹל.
- source_word: וְנוֹרָא
  choice: na wa kuhofiwa
  rationale: Neno hilo humweleza Mungu kuwa mwenye kuamsha hofu na kicho; ‘wa kuhofiwa’ lina uzito unaofaa bila kumfanya aeleweke tu kuwa wa kutisha kwa maana hasi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu lenye herufi nne; ‘Yahwe’ huhifadhi jina hilo badala ya kuliweka kama cheo.
- issue: Maana ya וְנוֹרָא kuhusu Mungu
  choice: wa kuhofiwa
  alternative: wa kutisha
  rationale: Uchaguzi huu huhifadhi wazo la Mungu kuamsha hofu na kicho, huku ukiepuka kulifunga neno kwenye maana hasi ya ugaidi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nafsi ya pili umoja imehifadhiwa kwa sababu Musa anaiambia Israeli kwa umoja; ‘miongoni mwako’ bado huonyesha kuwa anayelengwa ni jumuiya.
