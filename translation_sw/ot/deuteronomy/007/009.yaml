  text: וְ/יָ֣דַעְתָּ֔ כִּֽי יְהוָ֥ה אֱלֹהֶ֖י/ךָ ה֣וּא הָֽ/אֱלֹהִ֑ים הָ/אֵל֙ הַֽ/נֶּאֱמָ֔ן שֹׁמֵ֧ר הַ/בְּרִ֣ית וְ/הַ/חֶ֗סֶד לְ/אֹהֲבָ֛י/ו וּ/לְ/שֹׁמְרֵ֥י מצות/ו לְ/אֶ֥לֶף דּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/009.yaml
  text: Know[a], therefore, that Yahweh your God, he is God, the faithful God, keeping the covenant and the steadfast love for those who love him and for those who keep his commandments[d][c][b], to a thousand generations.
translation:
  language: sw
  text: Basi ujue[a] kwamba Yahwe Mungu wako ndiye Mungu, Mungu mwaminifu, anayeshika agano na kudumisha upendo thabiti[b] kwa wale wanaompenda na kuzishika amri zake, kwa vizazi elfu[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Na ujue” au “Kwa hiyo ujue”; kiunganishi cha Kiebrania kinaweza kuonyesha mwendelezo rahisi au hitimisho kutokana na yaliyotangulia.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania חֶסֶד; pia huweza kutafsiriwa “upendo wa agano,” “fadhili za kudumu,” “uaminifu,” au “rehema,” kulingana na muktadha.
    reason: lexical_alternative
  - marker: c
    text: Au “mpaka vizazi elfu.” Usemi huu unaonyesha uaminifu wa agano unaodumu kwa kipindi kikubwa mno.
    reason: lexical_alternative
  - marker: d
    text: 'Muundo wa Kiebrania pia unaweza kupangwa: “kwa wale wanaompenda na kuzishika amri zake, kwa vizazi elfu.”'
    reason: previous_rendering
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Basi ujue
  rationale: Kitenzi cha Qal timilifu katika muktadha huu kina nguvu ya himizo au agizo. “Basi” linaonyesha hitimisho kutokana na muktadha uliotangulia bila kuficha kwamba kiunganishi cha Kiebrania kinaweza pia kuwa mwendelezo rahisi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limeandikwa kwa kunukuu matamshi yake badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Muundo huu una kiambishi cha nafsi ya pili, umoja wa kiume, na kwa kawaida hutafsiriwa kwa umilikaji.
- source_word: הוּא הָאֱלֹהִים
  choice: ndiye Mungu
  rationale: “Ndiye” linaakisi msisitizo wa kiwakilishi הוּא na linaeleza kwa Kiswahili cha kawaida utambulisho wa pekee unaosisitizwa hapa.
- source_word: הָאֵל הַנֶּאֱמָן
  choice: Mungu mwaminifu
  rationale: אֵל limerudiwa kwa namna ya ufafanuzi, na נֶאֱמָן humweleza Mungu kuwa imara, wa kutegemewa, na mwaminifu katika agano.
- source_word: שֹׁמֵר הַבְּרִית וְהַחֶסֶד
  choice: anayeshika agano na kudumisha upendo thabiti
  rationale: Kishirikishi kinaonyesha tendo linaloendelea. “Kushika agano” ni usemi wa kawaida, huku “kudumisha” likifanya uhusiano wa kishirikishi hicho na חֶסֶד uwe wazi na wa asili kwa Kiswahili.
- source_word: חֶסֶד
  choice: upendo thabiti
  rationale: Katika muktadha wa agano, neno hili huunganisha upendo, rehema, na uaminifu wa kudumu; “upendo thabiti” huhifadhi upana huo kwa ufupi.
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֹתָו
  choice: kwa wale wanaompenda na kuzishika amri zake
  rationale: 'Kiambishi לְ kinawaonyesha wanaopokea uaminifu huo wa agano. Vishirikishi viwili vinabaki sambamba: kumpenda na kuzishika amri.'
- source_word: לְאֶלֶף דּוֹר
  choice: hata vizazi elfu
  rationale: Huu ni usemi wa muda mrefu sana wa uaminifu wa agano. Kiswahili hutumia wingi “vizazi” baada ya “elfu,” ingawa Kiebrania kina umbo la umoja wa kijumla.
theological_decisions:
- issue: Uaminifu wa agano wa Mungu kwa wanaompenda na kushika amri zake
  choice: Mungu anaelezwa kuwa anashika agano na kudumisha upendo thabiti kwa wale wanaompenda na kuzishika amri zake.
  alternative: Mungu huonyesha rehema kwa wale wanaompenda, bila kusisitiza uhusiano wa agano au utiifu.
  rationale: Andiko lenyewe linaunganisha agano, חֶסֶד, kumpenda Mungu, na kushika amri zake. Tafsiri inadumisha uhusiano huo na mvutano wake wa kitheolojia bila kuuingiza katika mfumo wa dhehebu au kuupunguza.
- issue: Upeo wa maneno “hata vizazi elfu”
  choice: Kirai hiki kinaeleza muda au upeo mkubwa wa kudumu kwa ushikaji wa agano na upendo thabiti wa Mungu.
  alternative: 'Kirai hiki kinaweza kuunganishwa moja kwa moja na kundi la wale wanaompenda na kushika amri zake: “kwa wale ... kwa vizazi elfu.”'
  rationale: Muundo wa Kiebrania unaruhusu uhusiano wa karibu na walengwa waliotajwa, huku maana ya jumla ikiwa ni kudumu kwa uaminifu wa agano katika vizazi vingi. Tanbihi inalinda uwezekano wa kisintaksia bila kubadili maana kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Basi ujue” ni himizo la moja kwa moja lakini la kawaida; “ndiye Mungu” huhifadhi msisitizo wa Kiebrania; “upendo thabiti” huepuka istilahi nzito ya kidhehebu huku ikihifadhi maana ya uaminifu wa agano.
