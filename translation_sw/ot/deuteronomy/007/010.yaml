  yaml_path: translation/ot/deuteronomy/007/010.yaml
  text: and repays those who hate him to their face[a], to destroy them. He does not delay with the one who hates him; he will repay him to his face.
translation:
  language: sw
  text: naye huwalipa wale wanaomchukia ana kwa ana[a], ili kuwaangamiza. Hachelewi kumlipa yule anayemchukia; atamlipa ana kwa ana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “kuelekea uso wake/wao.” Msemo huu unaweza pia kumaanisha “mbele yake/yao” au “katika uwepo wake/wao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְשַׁלֵּם
  choice: naye huwalipa
  rationale: Kitenzi cha Kiebrania kina maana ya kulipa mtu kulingana na matendo yake. ‘Huwalipa’ ni Kiswahili cha sasa na kinadumisha wazo la malipo ya moja kwa moja.
- source_word: לְשֹׂנְאָיו
  choice: wale wanaomchukia
  rationale: Umbo la kitenzi linalotumika kama nomino linataja watu wenye sifa ya kumchukia Mungu. Tafsiri hii ni wazi zaidi kuliko kutumia neno pana ‘maadui.’
- source_word: אֶל־פָּנָיו
  choice: mbele yao / mbele yake
  rationale: Kirai hicho kina maana halisi inayohusiana na uso au kuwapo mbele ya mtu. ‘Mbele yao’ na ‘mbele yake’ vinadumisha picha hiyo pamoja na mabadiliko ya wingi kwenda umoja katika Kiebrania.
- source_word: לְהַאֲבִידוֹ
  choice: ili kuwaangamiza
  rationale: Infinitivu ya Hifili inaonyesha kusudi au matokeo ya kulipa. ‘Ili kuwaangamiza’ inadumisha nguvu ya uharibifu kamili na muundo wa kusudi.
- source_word: לֹא יְאַחֵר
  choice: hakawii
  rationale: Kitenzi kinamaanisha kutochelewesha au kutahirisha. ‘Hakawii’ ni kifupi, cha kawaida, na kinafaa kwa kauli hii ya jumla.
- source_word: לְשֹׂנְאוֹ
  choice: kwa yule anayemchukia
  rationale: Kihusishi ל kinaonyesha mtu ambaye hatua hiyo inamwelekea. Muundo huu pia unahifadhi umoja wa kishazi cha pili.
- source_word: יְשַׁלֶּם לוֹ
  choice: atamlipa
  rationale: Tafsiri hii inarudia mzizi na wazo la kitenzi cha mwanzo, huku ikihifadhi mkazo wa umoja katika kishazi cha mwisho.
theological_decisions:
- issue: Lugha kuhusu hukumu ya Mungu
  choice: Mungu ndiye anayewalipa na kuwaangamiza wale wanaomchukia
  alternative: Kuifanya hukumu ionekane kuwa matokeo ya kawaida yasiyotendwa moja kwa moja na Mungu
  rationale: Kiebrania kinamtaja Mungu kuwa mtendaji wa moja kwa moja. Tafsiri haipunguzi wala kugeuza uwajibikaji huo kuwa matokeo yasiyo na mtendaji.
- issue: Maana ya אֶל־פָּנָיו
  choice: mbele yao / mbele yake
  alternative: waziwazi au ana kwa ana
  rationale: Kirai kinaweza kueleweka kwa namna zaidi ya moja. Tafsiri kuu inahifadhi picha ya Kiebrania, na tanbihi inaonyesha maana mbadala bila kulazimisha ufafanuzi mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mabadiliko ya wingi katika kishazi cha kwanza kwenda umoja katika cha pili yamehifadhiwa. Kirai ‘Kwa yule anayemchukia, hakawii’ kimetumiwa ili kuepuka kuongeza kitu cha kucheleweshwa ambacho hakitajwi wazi katika Kiebrania.
