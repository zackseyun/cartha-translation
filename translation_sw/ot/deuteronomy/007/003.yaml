base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/003.yaml
  text: 'And you shall not intermarry with them: you shall not give your daughter to his son[a], and you shall not take his daughter for your son.'
translation:
  language: sw
  text: Wala usioleane nao:[a] usimtoe binti yako kwa mwanawe, wala usimchukue binti yake kwa mwanao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa mtindo rasmi zaidi, “usifanye mapatano ya ndoa nao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִתְחַתֵּן
  choice: usioane
  rationale: Kitenzi hiki katika hali ya Hitpaeli kinaonyesha kuingia katika mahusiano ya ndoa kati ya makundi hayo. “Kuana” ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya kuoana wao kwa wao.
- source_word: בָּם
  choice: nao
  rationale: Kiambishi hiki kinawarejelea watu waliotajwa katika muktadha uliotangulia; “nao” linafaa kwa muundo wa Kiswahili “kuoana nao.”
- source_word: בִּתְּךָ
  choice: binti yako
  rationale: Hili ni tafsiri ya moja kwa moja ya nomino ya umoja yenye kiambishi cha nafsi ya pili, jinsia ya kiume, umoja.
- source_word: תִתֵּן
  choice: usimpe
  rationale: Kitenzi cha Kiebrania ni “kutoa/kumpa.” Muktadha wa ndoa unafafanua kusudi lake bila kulazimika kuongeza maneno “awe mke.”
- source_word: לִבְנוֹ
  choice: mwanawe
  rationale: Huhifadhi nomino ya umoja na uhusiano wa umilikaji wa nafsi ya tatu kama ulivyo katika Kiebrania.
- source_word: וּבִתּוֹ
  choice: binti yake
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye kiambishi cha nafsi ya tatu, jinsia ya kiume, umoja.
- source_word: תִקַּח
  choice: usimchukue
  rationale: Huhifadhi kitenzi cha kawaida “chukua”; katika muktadha huu kitendo kinahusu kumchukua mwanamke kwa kusudi la ndoa.
- source_word: לִבְנֶךָ
  choice: kwa ajili ya mwanao
  rationale: Usemi huu unaonyesha kuwa binti huyo angechukuliwa ili aolewe na mwana wa mhusika, huku ukihifadhi nomino ya umoja.
theological_decisions:
- issue: Upeo wa katazo
  choice: Katazo linawahusu watu wanaorejelewa na “nao” katika muktadha uliotangulia, bila kuongeza sababu inayotolewa katika mstari unaofuata.
  alternative: Kulifanya kuwa katazo la jumla dhidi ya ndoa zote na watu wa mataifa mengine.
  rationale: Mstari huu wenyewe unaweka katazo kwa kurejelea makundi yaliyotajwa kabla yake. Tafsiri haipanui wala kupunguza upeo huo kwa kuingiza maelezo yasiyosemwa hapa.
- issue: Majina ya kifamilia yenye jinsia
  choice: Kubakiza “binti” na “mwana” katika umoja.
  alternative: Kutumia neno la jumla lisiloonyesha jinsia, kama “watoto.”
  rationale: Kiebrania kinatumia majina mahususi ya jinsia katika umoja kama kauli wakilishi ya kisheria; kuyafanya yasiyoonyesha jinsia kungefuta umbo la matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Usioane nao” ni cha kawaida na wazi; sentensi inayofuata inahifadhi ulinganifu wa binti na mwana uliomo katika Kiebrania. Alama ya tanbihi [a] imewekwa baada ya kishazi inachokifafanua.
