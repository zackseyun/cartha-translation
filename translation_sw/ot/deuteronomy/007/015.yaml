source:
  edition: WLC
  text: וְ/הֵסִ֧יר יְהוָ֛ה מִמְּ/ךָ֖ כָּל חֹ֑לִי וְ/כָל מַדְוֵי֩ מִצְרַ֨יִם הָ/רָעִ֜ים אֲשֶׁ֣ר יָדַ֗עְתָּ לֹ֤א יְשִׂימָ/ם֙ בָּ֔/ךְ וּ/נְתָנָ֖/ם בְּ/כָל שֹׂנְאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/015.yaml
  text: And Yahweh will remove from you all sickness[a], and none of the evil diseases of Egypt that you have known[b] will he put on you; instead, he will put them on all who hate you.
translation:
  language: sw
  text: Yahwe atakuondolea kila ugonjwa, wala hataweka juu yako magonjwa mabaya[a] ya Misri uliyoyajua[b], bali atayaweka juu ya wote wanaokuchukia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “magonjwa yenye kudhuru/makali ya Misri.” Kivumishi cha Kiebrania kinaweza kumaanisha yaliyo mabaya, yenye kudhuru, au makali.
    reason: lexical_alternative
  - marker: b
    text: Au “uliyoyapitia.” Neno la Kiebrania linalotafsiriwa “uliyoyajua” linaweza hapa kumaanisha kujua kutokana na uzoefu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵסִיר
  choice: ataondoa
  rationale: Hifili ya סור ina maana ya kusababisha kitu kiondoke; “ataondoa” inadumisha maana hiyo ya kisababishi kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni jina binafsi la Mungu katika Kiebrania; “Yahwe” ni umbo la kawaida la jina hilo katika Kiswahili badala ya kulibadili kuwa cheo.
- source_word: מִמְּךָ
  choice: kwako
  rationale: Kiambishi מן pamoja na nafsi ya pili umoja kinaonyesha kutenganisha kitu na mhusika; “kuondoa kwako” huwasilisha maana hiyo.
- source_word: כָּל חֹלִי
  choice: kila ugonjwa
  rationale: חֹלִי humaanisha ugonjwa au maradhi; “kila ugonjwa” ni tafsiri ya moja kwa moja ya usemi wa jumla.
- source_word: מַדְוֵי מִצְרַיִם הָרָעִים
  choice: magonjwa yote mabaya ya Misri
  rationale: מַדְוֶה ni ugonjwa, hapa ikiwa katika wingi na kuhusishwa na Misri. הָרָעִים inaweza kumaanisha mabaya, yenye kudhuru, au makali; “mabaya” hudumisha upana wa neno hilo.
- source_word: אֲשֶׁר יָדַעְתָּ
  choice: uliyoyajua
  rationale: יָדַע inaweza kumaanisha kujua kiakili au kujua kwa kupitia jambo; “uliyoyajua” huhifadhi utata huo bila kuamua kimya-kimya kuwa ni uzoefu pekee.
- source_word: לֹא יְשִׂימָם בָּךְ
  choice: hatayaweka juu yako
  rationale: שׂים pamoja na ב inaonyesha kuyaweka magonjwa juu ya mtu; tafsiri hii huhifadhi taswira na kiwakilishi cha magonjwa hayo.
- source_word: וּנְתָנָם בְּכָל שֹׂנְאֶיךָ
  choice: bali atayaweka juu ya wote wanaokuchukia
  rationale: נתן kimsingi ni kutoa au kuweka, na katika muktadha huu hurejelea kuyaweka magonjwa juu ya watu. “Wote wanaokuchukia” ni sahihi zaidi kuliko neno pana “adui.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano la Mungu, si cheo. Kulihifadhi kama jina binafsi huepuka kubadili jina kuwa cheo.
- issue: Asili ya ahadi kuhusu magonjwa ya Misri
  choice: Ahadi halisi ya agano ya kuondolewa kwa magonjwa na kulindwa dhidi ya magonjwa ya Misri
  alternative: Ahadi ya jumla na isiyo na masharti kwamba kila mtu hatakuwa mgonjwa kamwe; au taswira ya mateso yasiyo ya kimwili tu
  rationale: Mstari unasema wazi kuhusu magonjwa katika muktadha wa agano. Tafsiri inahifadhi maana hiyo halisi bila kuipanua kuwa fundisho la kinga ya kila mtu dhidi ya ugonjwa katika kila hali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha umoja wa nafsi ya pili kama katika Kiebrania, inahifadhi urudiaji wa “kuweka juu,” na kuweka alama za tanbihi kwenye maneno yanayohusika moja kwa moja.
