- from: Nawe utawaangamiza watu wote ambao Yahwe Mungu wako anakukabidhi.[a] Jicho lako lisiwaonee huruma,[b] wala usiitumikie miungu yao, kwa maana hilo litakuwa mtego kwako.[c]
  to: Nawe utawaangamiza mataifa yote ambayo Yahwe, Mungu wako, anakupa.[a] Jicho lako lisiwaonee huruma,[b] wala usiitumikie miungu yao, kwa maana hilo litakuwa mtego kwako.[c]
  rationale: Marekebisho yanarekebisha kosa la maana katika tanbihi (a), yanawakilisha עַמִּים kwa ‘mataifa,’ na yanarudisha נֹתֵן לָךְ kwa usemi wa karibu zaidi, ‘anakupa.’ Utata wa kiwakilishi katika sentensi ya mwisho umehifadhiwa katika tanbihi, huku matini kuu ikifuata rejeo lake linalowezekana zaidi kwa tendo la kuitumikia miungu.
