  source_fidelity: 'Msingi wa tafsiri unafuata Kiebrania vizuri: amri ya kuwaangamiza, nahau ya jicho kutowahurumia, katazo la kuitumikia miungu yao, na taswira ya mtego vimehifadhiwa. Hata hivyo, עַמִּים ni ‘peoples/nations’ na ‘mataifa’ huonyesha kwa usahihi zaidi makundi hayo kuliko ‘watu wote.’ ‘Anakupa’ pia ni karibu zaidi na נֹתֵן לָךְ kuliko ‘anakukabidhi.’'
  naturalness: Kiswahili cha matini kuu ni cha kawaida na chenye hadhi inayofaa. ‘Jicho lako lisiwaonee huruma’ hudumisha nahau ya chanzo kwa uelewekevu. Marekebisho ya ‘mataifa yote’ na ‘anakupa’ yanafanya sentensi iwe sahihi na ya moja kwa moja.
  terminology: '‘Yahwe,’ ‘Mungu wako,’ ‘miungu yao,’ na ‘mtego’ zinatumika kwa uthabiti. ‘Kuitumikia miungu yao’ huhifadhi upana wa עבד kuliko kuitafsiri tu ‘kuabudu.’ Tanbihi (a) ina kosa la neno: ‘utawala’ si maana ya אכל katika muktadha huu; inapaswa kuwa ‘utakula.’'
