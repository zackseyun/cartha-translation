  text: וְ/אָכַלְתָּ֣ אֶת כָּל הָֽ/עַמִּ֗ים אֲשֶׁ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ נֹתֵ֣ן לָ֔/ךְ לֹא תָחֹ֥ס עֵֽינְ/ךָ֖ עֲלֵי/הֶ֑ם וְ/לֹ֤א תַעֲבֹד֙ אֶת אֱלֹ֣הֵי/הֶ֔ם כִּֽי מוֹקֵ֥שׁ ה֖וּא לָֽ/ךְ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/016.yaml
  text: And you shall consume all the peoples whom Yahweh your God is giving to you[a]. Your eye shall not spare them, and you shall not serve their gods[c][b], for that would be a snare to you.
translation:
  language: sw
  text: Nawe utawaangamiza mataifa yote ambayo Yahwe, Mungu wako, anakupa.[a] Jicho lako lisiwaonee huruma,[b] wala usiitumikie miungu yao, kwa maana hilo litakuwa mtego kwako.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “utakula” au “utawameza.” Hapa kitenzi cha Kiebrania kinatumika kama nahau ya kuwashinda na kuwaondoa kabisa.
    reason: lexical_alternative
  - marker: b
    text: Au, “usiwahurumie.” Kihalisi, “jicho lako lisiwaonee huruma.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa maana huo ni mtego kwako.” Kiwakilishi cha Kiebrania huenda kinarejelea kuitumikia miungu yao, lakini kinaweza pia kurejelea kwa upana zaidi miungu hiyo au hali nzima ya ibada ya sanamu.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: utawaangamiza
  rationale: Kitenzi אכל humaanisha kihalisi ‘kula,’ lakini hapa kimetumiwa kama nahau ya kuwashinda na kuwaondoa kabisa. ‘Utawaangamiza’ huwasilisha maana hiyo kwa Kiswahili cha kawaida; picha halisi imehifadhiwa katika tanbihi.
- source_word: כָּל הָעַמִּים
  choice: watu wote
  rationale: עַמִּים hurejelea makundi ya watu. ‘Watu wote’ ni ya kawaida katika Kiswahili na inadumisha upeo wa כָּל; ‘mataifa yote’ pia ingewezekana.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: ambao Yahwe Mungu wako anakukabidhi
  rationale: Nomino-tendo נֹתֵן inaonyesha tendo linaloendelea au lililo karibu kutimia. ‘Anakukabidhi’ hufafanua kwa kawaida kwamba watu hao wanawekwa chini ya mamlaka ya Israeli bila kuongeza taswira isiyokuwapo katika Kiebrania.
- source_word: לֹא תָחֹס עֵינְךָ עֲלֵיהֶם
  choice: Jicho lako lisiwaonee huruma
  rationale: Tafsiri hii inadumisha taswira halisi ya ‘jicho’ huku ikitoa maana ya nahau ya kutowahurumia au kutowaacha.
- source_word: וְלֹא תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: wala usiitumikie miungu yao
  rationale: עבד inapohusishwa na miungu humaanisha kuitumikia kwa utii wa kidini. ‘Kuitumikia’ ni pana kuliko ‘kuiabudu’ na iko karibu zaidi na neno la Kiebrania.
- source_word: כִּי מוֹקֵשׁ הוּא לָךְ
  choice: kwa maana hilo litakuwa mtego kwako
  rationale: מוֹקֵשׁ ni mtego au tanzi. ‘Hilo’ kwa kawaida hurejelea tendo la kuitumikia miungu yao, lakini uwezekano wa rejeo pana zaidi umeelezwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa umbo la Kiswahili ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Rejeo la הוּא katika maneno ‘kwa maana huo/hilo ni mtego kwako’
  choice: Katika matini kuu, ‘hilo’ linarejelea hasa tendo la kuitumikia miungu yao.
  alternative: Kiwakilishi kinaweza kurejelea kwa upana zaidi miungu hiyo, watu hao, au hali nzima ya ibada ya sanamu.
  rationale: Kifungu kinachotangulia mara moja ni katazo la kuitumikia miungu yao, hivyo hilo ndilo rejeo linalowezekana zaidi. Hata hivyo, Kiebrania hakifafanui rejeo hilo kabisa, kwa hiyo utata wake umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha ukali wa amri ya chanzo, taswira ya jicho na mtego, na jina ‘Yahwe.’
