  to: Usilete kitu cha chukizo ndani ya nyumba yako, la sivyo utakuwa kitu kilichotengwa kwa ajili ya kuangamizwa kama hicho.[a] Ukione kuwa ni kitu cha chukizo kabisa, na ukichukie kabisa, kwa maana ni kitu kilichotengwa kwa ajili ya kuangamizwa.
