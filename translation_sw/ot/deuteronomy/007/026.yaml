base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/026.yaml
  text: And you shall not bring an abomination into your house[a], or you will become devoted to destruction like it. You shall utterly detest it and utterly abhor it, for it is devoted to destruction.
translation:
  language: sw
  text: Usilete kitu cha chukizo ndani ya nyumba yako, la sivyo utakuwa kitu kilichotengwa kwa ajili ya kuangamizwa kama hicho.[a] Ukione kuwa ni kitu cha chukizo kabisa, na ukichukie kabisa, kwa maana ni kitu kilichotengwa kwa ajili ya kuangamizwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utakuwa chini ya marufuku kama hicho”; kwa mapokeo, “utalaaniwa kama hicho.” Neno la Kiebrania linamaanisha kitu kilichotengwa kwa ajili ya kuangamizwa chini ya hukumu ya Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָבִיא
  choice: usilete
  rationale: Hifili ya בוא ina maana ya kusababisha kitu kiingie; “usilete” ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: תּוֹעֵבָה
  choice: chukizo
  rationale: “Chukizo” huhifadhi uzito wa neno linalomaanisha kitu kinachokataliwa kidini na kimaadili, hapa hasa sanamu au kitu cha ibada ya sanamu.
- source_word: בֵּיתֶךָ
  choice: ndani ya nyumba yako
  rationale: Huhifadhi taswira halisi ya kuingiza kitu katika makao ya mtu, badala ya kupanua maana kuwa familia au kaya.
- source_word: חֵרֶם
  choice: kutengwa kwa ajili ya kuangamizwa
  rationale: Kirai hiki kinaeleza hali ya kitu kilichowekwa kando chini ya hukumu ya Mungu ili kiangamizwe; ni wazi zaidi kuliko “chini ya marufuku” na pana zaidi kuliko “kulaaniwa.”
- source_word: שַׁקֵּץ תְּשַׁקְּצֶנּוּ
  choice: Kichukie kabisa
  rationale: Kielezi “kabisa” kinaonyesha msisitizo wa muundo wa kitenzi-jina pamoja na kitenzi bila kuongeza wazo lisilokuwamo katika chanzo.
- source_word: וְתַעֵב תְּתַעֲבֶנּוּ
  choice: na ukione kuwa chukizo kabisa
  rationale: Huhifadhi kitenzi cha pili tofauti na cha kwanza na kuonyesha kwamba kitu hicho kinapaswa kuchukuliwa kuwa cha kuchukiza kabisa.
theological_decisions:
- issue: Maana ya חֵרֶם katika muktadha wa hukumu ya agano
  choice: kutengwa kwa ajili ya kuangamizwa
  alternative: kuwa chini ya marufuku; kulaaniwa
  rationale: Neno linahusu kitu kilichowekwa chini ya hukumu ya Mungu kwa kuangamizwa. Tafsiri hii haipunguzi maana kuwa laana ya maneno tu wala kuacha dhana hiyo ikiwa fumbo.
- issue: Uhusiano kati ya kuingiza chukizo na hali ya mwenye nyumba
  choice: la sivyo utakuwa kama hicho, umetengwa kwa ajili ya kuangamizwa
  alternative: nawe utakuwa kitu kilichotengwa kwa ajili ya kuangamizwa kama hicho
  rationale: “La sivyo” huwasilisha nguvu ya onyo ya וְ, huku mpangilio wa sentensi ukihifadhi wazo kwamba mtu atakuwa na hali ileile ya kitu hicho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka. Marudio ya “chukizo” yamehifadhiwa kwa sababu chanzo kinatumia maneno yenye uhusiano wa karibu, na “kabisa” huwasilisha msisitizo wa miundo miwili ya Kiebrania.
