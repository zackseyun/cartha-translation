base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/022.yaml
  text: And Yahweh your God will drive out these nations before you little by little[a]. You will not be able to finish them off quickly[b], lest the wild animals become too numerous against you.
translation:
  language: sw
  text: Yahwe Mungu wako atayaondoa mataifa haya mbele yako kidogo kidogo.[a] Hutaweza kuyaangamiza upesi, ili wanyama wa porini[b] wasije wakaongezeka na kukuzidia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “atayafukuza mataifa haya kutoka mbele yako kidogo kidogo.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno moja, “mnyama wa porini”; Kiebrania hutumia umoja wenye maana ya jamii nzima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשַׁל
  choice: atayaondoa
  rationale: Kitenzi hiki hapa kinamaanisha kuyafanya mataifa yaondoke katika nchi. “Atayaondoa” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kulazimisha kama tendo hilo ni kufukuza au kunyang’anya milki.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: הַגּוֹיִם הָאֵל
  choice: mataifa haya
  rationale: “Mataifa” huhifadhi maana ya kijamii na kisiasa ya גּוֹיִם, na “haya” huwakilisha kiashiria cha karibu.
- source_word: מִפָּנֶיךָ
  choice: mbele yako
  rationale: Hii ni tafsiri ya kawaida ya nahau ya mahali inayomaanisha kuyaondoa katika uwepo au njia ya Israeli.
- source_word: מְעַט מְעָט
  choice: kidogo kidogo
  rationale: Urudiaji wa Kiebrania umehifadhiwa kwa usemi wa kawaida wa Kiswahili unaoonyesha mwendo wa taratibu.
- source_word: לֹא תוּכַל כַּלֹּתָם מַהֵר
  choice: Hutaweza kuyaangamiza upesi
  rationale: “Hutaweza” huhifadhi maana ya kutoweza katika muktadha wa wakati ujao, na “kuyaangamiza” huonyesha kuyafikisha mataifa hayo mwisho kabisa.
- source_word: פֶּן
  choice: ili ... wasije
  rationale: Muundo huu wa Kiswahili huwasilisha onyo la kuzuia jambo linaloweza kutokea, sawa na nguvu ya פֶּן.
- source_word: תִּרְבֶּה עָלֶיךָ
  choice: wakaongezeka na kukuzidia
  rationale: Tafsiri hii huonyesha kuongezeka kwa idadi na athari yake hatari juu ya Israeli; ni ya asili zaidi kuliko “wakaongezeka dhidi yako.”
- source_word: חַיַּת הַשָּׂדֶה
  choice: wanyama wa porini
  rationale: Nomino ya umoja yenye maana ya jamii imetafsiriwa kwa wingi wa kawaida katika Kiswahili; “wa porini” huonyesha wanyama wasiofugwa wa maeneo ya wazi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi kwa utohozi unaokubaliana kwa karibu na ushahidi wa matamshi ya jina hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Urudiaji “kidogo kidogo” huhifadhi mtindo wa Kiebrania. Kiunganishi “ili ... wasije” kimetumiwa kuonyesha onyo la פֶּן kwa mtiririko wa asili wa Kiswahili.
