base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/011.yaml
  text: So you shall keep the commandment and the statutes and the judgments that I am commanding you today[b][a], to do them.
translation:
  language: sw
  text: Kwa hiyo[a] utashika amri, na kanuni, na hukumu[b] ninazokuamuru leo, ili uzitekeleze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na utashika” au “Basi utashika”; kiunganishi cha Kiebrania kinaweza kuunganisha tu sentensi au kuonyesha hitimisho kutokana na mistari iliyotangulia.
    reason: lexical_alternative
  - marker: b
    text: “Hukumu” pia inaweza kutafsiriwa “maamuzi ya kisheria” au “kanuni”; neno la Kiebrania linahusu hukumu au maagizo yaliyowekwa kisheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Kwa hiyo, utaitii
  rationale: Kitenzi שׁמר katika muktadha wa agano na sheria humaanisha kutunza au kutii. Kiswahili cha sasa hutumia ‘kutii amri’ kwa kawaida zaidi kuliko ‘kuitunza amri’. ‘Kwa hiyo’ kinaonyesha kwamba kiunganishi וְ kinaweza kutoa hitimisho kutokana na mistari iliyotangulia.
- source_word: הַמִּצְוָה
  choice: amri
  rationale: Umoja wa nomino ya Kiebrania umehifadhiwa katika ‘amri’, tofauti na makundi mawili ya wingi yanayofuata.
- source_word: הַחֻקִּים
  choice: masharti
  rationale: ‘Masharti’ linafaa kwa חֻקִּים kama maagizo yaliyowekwa na pia linadumisha tofauti yake na ‘hukumu’, bila kutumia neno lisilo la kawaida kwa wasomaji wengi.
- source_word: הַמִּשְׁפָּטִים
  choice: hukumu
  rationale: מִשְׁפָּטִים inaweza kumaanisha hukumu, maamuzi ya kisheria, au kanuni. ‘Hukumu’ hudumisha sajili ya kisheria na tofauti ya istilahi katika orodha hii.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ninazokuamuru leo
  rationale: Muundo huu unaonyesha tendo la Mungu la kuamuru katika wakati wa sasa wa hotuba. ‘Leo’ imehifadhiwa kwa sababu ya uzito wake katika mazingira ya agano ya Kumbukumbu la Torati.
- source_word: לַעֲשׂוֹתָם
  choice: na kuzitekeleza
  rationale: Kiswahili ‘kuzitekeleza’ huwasilisha kwa kawaida maana halisi ya kufanya maagizo hayo. ‘Na’ linaunganisha kusudi hili kwa uwazi bila kuacha muundo mgumu wa ‘ili kuzifanya’.
theological_decisions:
- issue: Kutofautisha istilahi tatu za sheria ya agano
  choice: amri, masharti na hukumu
  alternative: amri, sheria na kanuni
  rationale: Kiebrania kinakusanya istilahi zinazofanana lakini zisizo sawa ili kusisitiza wajibu wa agano. Tafsiri imeziweka tofauti badala ya kuzifanya zote kuwa neno moja la jumla.
- issue: Nguvu ya kiunganishi cha mwanzo
  choice: Kwa hiyo
  alternative: Na
  rationale: Muktadha unawezesha kukisoma kama hitimisho kutokana na uaminifu na ukuu wa Mungu ulioelezwa kabla, lakini Kiebrania pia kinaweza kuwa kiunganishi rahisi; utata huo umeandikwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifungu cha sheria lakini kinachoeleweka kwa msomaji wa kawaida. ‘Kutii’ na ‘kutekeleza’ hufanya sentensi iwe ya kawaida bila kufuta tofauti za istilahi za Kiebrania. Alama zote za tanbihi zimewekwa katika matini kuu.
