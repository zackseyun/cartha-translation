  text: וּ/נְתָנָ֞/ם יְהוָ֧ה אֱלֹהֶ֛י/ךָ לְ/פָנֶ֖י/ךָ וְ/הִכִּיתָ֑/ם הַחֲרֵ֤ם תַּחֲרִים֙ אֹתָ֔/ם לֹא תִכְרֹ֥ת לָ/הֶ֛ם בְּרִ֖ית וְ/לֹ֥א תְחָנֵּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/002.yaml
  text: And when Yahweh your God gives them over to you before you[a], and you strike them down, you shall utterly devote them to destruction[b]. You shall make no covenant with them and show them no favor.
translation:
  language: sw
  text: Yahwe Mungu wako atakapowakabidhi kwako, nawe ukawapiga, uwaweke wakfu kabisa kwa maangamizi[a]. Usifanye nao agano wala usiwaonyeshe fadhili[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwaangamize kabisa.” Kiebrania kinatumia kitenzi חרם katika muundo wa kusisitiza, kikimaanisha kuwaweka wakfu kabisa kwa maangamizi.
    reason: lexical_alternative
  - marker: b
    text: Au, “usiwahurumie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם
  choice: atakapowakabidhi kwako
  rationale: Katika muktadha wa vita, נתן humaanisha kuwakabidhi watu katika uwezo wa mwingine. Usemi huu ni wa kawaida katika Kiswahili na unadumisha kwamba Yahwe ndiye anayewakabidhi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa kutamkwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: לְפָנֶיךָ
  choice: kwako
  rationale: Kiambishi hiki, pamoja na kitenzi cha kuwakabidhi, kinaeleza kuwa mataifa yanawekwa mbele ya Israeli na chini ya uwezo wake. Tafsiri ya neno kwa neno ‘mbele yako’ ingeweza kuficha maana hiyo ya kimuktadha.
- source_word: וְהִכִּיתָם
  choice: nawe ukawapiga
  rationale: נכה katika vita inaweza kumaanisha kupiga, kushinda, au kuangusha. ‘Kuwapiga’ inadumisha ukali wa kitendo bila kuamua kimya kimya kati ya kushindwa na kuuawa.
- source_word: הַחֲרֵם תַּחֲרִים אֹתָם
  choice: lazima uwaweke wakfu kabisa kwa maangamizi
  rationale: Muundo wa kusisitiza wa חרם unaonyesha tendo kamili. Usemi huu unahifadhi maana maalumu ya kuwatenga au kuwaweka wakfu kwa maangamizi, badala ya kuifanya kuwa kauli ya kawaida tu ya kuharibu.
- source_word: לֹא תִכְרֹת לָהֶם בְּרִית
  choice: Usifanye nao agano
  rationale: כרת ברית ni nahau ya kufanya agano. ‘Agano’ linadumisha upana wa uhusiano rasmi kuliko ‘mkataba wa amani’ pekee.
- source_word: וְלֹא תְחָנֵּם
  choice: wala usiwaonyeshe fadhili
  rationale: חנן huhusu kuonyesha fadhili au neema. ‘Kuwaonyesha fadhili’ ndiyo maana ya msingi, huku uwezekano wa ‘huruma’ ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya חרם katika muktadha wa vita vitakatifu
  choice: lazima uwaweke wakfu kabisa kwa maangamizi
  alternative: lazima uwaangamize kabisa
  rationale: Tafsiri iliyochaguliwa inadumisha hali ya kidini ya חרם na msisitizo wa ukamilifu, bila kuipunguza kuwa uharibifu wa kijeshi wa kawaida tu.
- issue: Maana ya תְחָנֵּם
  choice: usiwaonyeshe fadhili
  alternative: usiwahurumie
  rationale: ‘Fadhili’ inafuata maana ya msingi ya mzizi חנן; ‘huruma’ ni maana inayowezekana katika muktadha huu na kwa hiyo imetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Yahwe’ limetumiwa kama jina binafsi. Usemi wa חרם umeachwa ukiwa na mvutano wake wa kidini na kijeshi, kisha mbadala mfupi ukawekwa katika tanbihi.
