source:
  edition: WLC
  text: וְ/הָיָ֣ה עֵ֣קֶב תִּשְׁמְע֗וּ/ן אֵ֤ת הַ/מִּשְׁפָּטִים֙ הָ/אֵ֔לֶּה וּ/שְׁמַרְתֶּ֥ם וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/שָׁמַר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ לְ/ךָ֗ אֶֽת הַ/בְּרִית֙ וְ/אֶת הַ/חֶ֔סֶד אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/012.yaml
  text: And because you listen to these judgments[a], and keep and do them[c][b], Yahweh your God will keep for you the covenant and the steadfast love that he swore to your fathers.
translation:
  language: sw
  text: Kwa sababu mtazisikiliza hukumu hizi[a], mkazishika na kuzitenda, Yahwe, Mungu wako, atadumisha kwa ajili yako agano na upendo thabiti[b] aliowaapia baba zako.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maagizo haya ya kisheria” au “kanuni hizi.”
    reason: lexical_alternative
  - marker: b
    text: “Upendo thabiti” hutafsiri neno la Kiebrania hesed, ambalo mara nyingi humaanisha upendo mwaminifu na wa kudumu katika agano; pia linaweza kutafsiriwa “uaminifu wa agano” au “fadhili.”
    reason: lexical_alternative
  - marker: c
    text: Au, “mababu zako”; Kiebrania kinasema hasa “baba zako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה עֵקֶב
  choice: Kwa sababu
  rationale: Kirai hiki kinaanzisha matokeo yanayotegemea tendo linalofuata. “Kwa sababu” kinaweka wazi uhusiano huo wa kisababishi kwa Kiswahili cha kawaida bila kutumia muundo mzito wa neno kwa neno.
- source_word: תִּשְׁמְעוּן
  choice: mtazisikiliza
  rationale: Kitenzi שׁמע kinaweza kumaanisha kusikia kwa mwitikio wa utiifu. “Kusikiliza” kinahifadhi wazo la kusikia kwa makusudi, huku vitenzi vinavyofuata vikieleza wazi kushika na kutenda.
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: hukumu hizi
  rationale: מִשְׁפָּטִים ni maamuzi, hukumu, au maagizo yenye mamlaka ya kisheria. “Hukumu” kinadumisha istilahi hiyo bila kuichanganya na maneno mengine ya sheria katika Kumbukumbu la Torati.
- source_word: וּשְׁמַרְתֶּם וַעֲשִׂיתֶם אֹתָם
  choice: mkazishika na kuzitenda
  rationale: Tafsiri imedumisha vitenzi vyote viwili vya Kiebrania ili kuhifadhi mkazo wa kushika maagizo na kuyafanya kwa vitendo.
- source_word: וְשָׁמַר
  choice: atakutimizia
  rationale: Katika Kiswahili, “kutunza/kushika agano kwa ajili yako” si usemi wa kawaida. “Atakutimizia agano” linaeleza kwa kawaida kwamba Mungu atadumisha na kutekeleza wajibu wa agano kwa manufaa ya mhusika.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Muundo wa umilikaji wa nafsi ya pili umedumishwa na unaonyesha uhusiano wa agano.
- source_word: לְךָ
  choice: ataku- katika “atakutimizia”
  rationale: Kiambishi cha mtendewa “-ku-” kinaonyesha kwamba utunzaji wa agano ni kwa ajili ya mhusika, sambamba na לְךָ.
- source_word: הַבְּרִית
  choice: agano
  rationale: “Agano” ni istilahi ya kawaida na sahihi ya Kiswahili kwa בְּרִית.
- source_word: הַחֶסֶד
  choice: upendo wake thabiti
  rationale: חֶסֶד hapa inaunganisha upendo, uaminifu, na kudumu katika uhusiano wa agano. “Upendo thabiti” huhifadhi upana huo bila kuufanya kuwa hisia tu au wajibu wa kisheria tu.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: aliowaapia
  rationale: Kitenzi kinaonyesha kiapo. Muundo huu wa Kiswahili unaunganisha kwa kawaida agano na upendo ambao Yahwe aliwaapia mababa.
- source_word: לַאֲבֹתֶיךָ
  choice: baba zako
  rationale: Kiebrania kinasema hasa “baba zako,” kikirejelea mababa wa kale; tafsiri haijakifanya kuwa neno lisilo na jinsia.
theological_decisions:
- issue: Maana ya חֶסֶד katika muktadha wa agano
  choice: upendo wake thabiti
  alternative: uaminifu wake wa agano; fadhili zake; rehema zake
  rationale: Chaguo hili linadumisha pamoja neema ya kimahusiano na uaminifu wa kudumu, bila kupunguza neno hilo kuwa hisia pekee au wajibu wa kisheria pekee.
- issue: Rejeo lenye jinsia katika לַאֲבֹתֶיךָ
  choice: baba zako
  alternative: mababu zako; wazee wako wa kale
  rationale: Chanzo kinarejelea wazi mababa wa Israeli. “Baba zako” kinahifadhi upekee huo badala ya kuupanua kimya kimya kuwa mababu wote.
- issue: Uhusiano kati ya utiifu wa Israeli na utunzaji wa agano wa Yahwe
  choice: Muundo wa kisababishi umehifadhiwa bila kueleza kinadharia namna neema na utiifu vinavyohusiana
  alternative: Kuutafsiri mstari kana kwamba utiifu unanunua upendo wa Mungu, au kuondoa kabisa hali ya masharti
  rationale: Mstari wenyewe unaweka matokeo baada ya kusikiliza, kushika, na kutenda, huku ukirejelea agano na upendo ambao tayari uliapwa kwa mababa. Tafsiri inadumisha mvutano huo bila kuutatua kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Mabadiliko ya chanzo kutoka nafsi ya pili wingi katika “mtazisikiliza… mkazishika” kwenda umoja katika “Mungu wako… atakutimizia… baba zako” yamehifadhiwa. Alama zote za tanbihi [a], [b], na [c] zimewekwa katika matini kuu mahali zinapohusika.
