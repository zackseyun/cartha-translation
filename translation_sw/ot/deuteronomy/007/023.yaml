  yaml_path: translation/ot/deuteronomy/007/023.yaml
  text: But Yahweh your God will give them over to you and throw them into great confusion until they are destroyed[a][b].
translation:
  language: sw
  text: Lakini Yahwe, Mungu wako, atawatia mikononi mwako[a] na kuwatia katika taharuki kubwa[b] mpaka waangamizwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “mbele yako.” Hapa usemi huu unamaanisha kwamba Yahwe atawaweka adui hao chini ya mamlaka yako.
    reason: lexical_alternative
  - marker: b
    text: Au “mtafaruku mkubwa” au “fadhaa kubwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם
  choice: atawatia mikononi mwako
  rationale: Kitenzi נתן pamoja na לְפָנֶיךָ katika muktadha wa vita kina maana ya kuwakabidhi adui chini ya mamlaka ya mtu. Usemi wa Kiswahili “kuwatia mikononi mwako” ni wa kawaida na unaonyesha wazi kutiwa chini ya uwezo wa Israeli.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa kulinakili kama “Yahwe,” badala ya kulibadilisha kuwa cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Muundo huu wenye kiambishi cha nafsi ya pili umoja wa kiume unamaanisha moja kwa moja “Mungu wako.”
- source_word: לְפָנֶיךָ
  choice: mikononi mwako
  rationale: Ingawa maana ya moja kwa moja ni “mbele yako,” pamoja na נתן usemi huu unaonyesha kuwa mataifa hayo yatawekwa chini ya mamlaka ya Israeli. Maana halisi zaidi imehifadhiwa katika tanbihi.
- source_word: וְהָמָם
  choice: na kuwatia katika fadhaa
  rationale: Kitenzi המם kinaeleza kusababisha taharuki, mkanganyiko, au kuvurugika vibaya, hasa vitani. “Kuwatia katika fadhaa” ni Kiswahili cha sasa kinachoonyesha athari hiyo ya kusababishwa.
- source_word: מְהוּמָה גְדֹלָה
  choice: fadhaa kubwa
  rationale: Nomino מְהוּמָה inaweza kumaanisha fadhaa, mtafaruku, au taharuki. “Fadhaa kubwa” ni rahisi kueleweka na huhifadhi upana wa hali ya hofu na kuvurugika.
- source_word: עַד הִשָּׁמְדָם
  choice: mpaka waangamizwe
  rationale: Muundo wa עַד pamoja na kitenzi-jina chenye kiambishi unaonyesha kikomo cha tendo. “Mpaka waangamizwe” huhifadhi maana ya matokeo na hali ya kutendwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia moja kwa moja jina יהוה. “Yahwe” linahifadhi jina hilo la agano kwa kulinakili badala ya kutumia cheo kama “BWANA.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi “kuwatia mikononi mwako” unaeleweka kwa urahisi katika muktadha wa ushindi wa kivita; “fadhaa kubwa” huhifadhi uwezekano wa mkanganyiko na taharuki bila kuubana kwa maana moja tu.
