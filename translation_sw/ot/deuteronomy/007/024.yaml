base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/024.yaml
  text: And he will give their kings into your hand[a], and you shall make their name perish from under heaven. No man will stand before you until you have destroyed them.
translation:
  language: sw
  text: Naye atawatia wafalme wao mikononi mwako, nawe utalifuta jina lao kutoka chini ya mbingu. Hakuna mtu atakayesimama mbele yako mpaka utakapowaangamiza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַן
  choice: Naye atawatia
  rationale: Kitenzi hiki katika muktadha wa ahadi kinaelekeza kwa wakati ujao; kiima kinamrejelea BWANA katika muktadha uliotangulia.
- source_word: מַלְכֵיהֶם בְּיָדֶךָ
  choice: wafalme wao mkononi mwako
  rationale: Huhifadhi picha ya Kiebrania ya kutiwa mkononi mwa mtu, yaani kuwekwa chini ya mamlaka yake, na ni usemi wa kawaida katika Kiswahili cha Biblia.
- source_word: וְהַאֲבַדְתָּ אֶת שְׁמָם
  choice: nawe utafuta jina lao
  rationale: Hifili ya אבד ni ya kusababisha, na kitu kinachoondolewa ni ‘jina lao’; ‘utafuta’ huwasilisha kuondolewa kwa kumbukumbu au utambulisho wao bila kubadili kitu cha kitenzi kuwa watu wenyewe.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: chini ya mbingu
  rationale: Huhifadhi nahau ya Kiebrania inayomaanisha kuondolewa kabisa katika ulimwengu wa wanadamu.
- source_word: לֹא יִתְיַצֵּב אִישׁ בְּפָנֶיךָ
  choice: Hakuna mtu atakayesimama mbele yako
  rationale: אִישׁ imetumiwa kwa maana ya jumla; ‘hakuna mtu’ ni Kiswahili cha kawaida na jumuishi kwa asili. ‘Kusimama mbele yako’ huhifadhi picha ya kuchukua msimamo wa kupinga.
- source_word: עַד הִשְׁמִדְךָ אֹתָם
  choice: mpaka utakapowaangamiza
  rationale: Muundo wenye עַד unaonyesha kikomo cha tendo, na שׁמד katika muktadha huu hubeba maana ya maangamizi kamili.
theological_decisions:
- issue: Maana ya jumla ya אִישׁ katika umoja wa kiume
  choice: Hakuna mtu atakayesimama mbele yako
  alternative: Hakuna mwanamume atakayesimama mbele yako
  rationale: Katika sentensi hii אִישׁ ni umoja unaowakilisha mtu yeyote, si dai linalowahusu wanaume pekee. ‘Mtu’ huhifadhi maana hiyo kwa Kiswahili cha kawaida bila kuongeza tofauti ya kijinsia isiyokusudiwa.
- issue: Kitu kinachofutwa katika וְהַאֲבַדְתָּ אֶת שְׁמָם
  choice: utafuta jina lao
  alternative: utawaangamiza
  rationale: Kiebrania kinaweka ‘jina lao’ kuwa kitu cha kitenzi. Tafsiri inalinda taswira ya kufutwa kwa jina au kumbukumbu, huku kishazi cha mwisho kikisema wazi kuhusu kuwaangamiza wao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. ‘Mkononi mwako’ na ‘chini ya mbingu’ zimehifadhiwa kama taswira za asili zinazobaki wazi katika Kiswahili; ‘hakuna mtu’ ni usemi wa kawaida wa maana jumuishi.
