base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/007.yaml
  text: It was not because you were more numerous than all the peoples that Yahweh set his affection on you and chose you[a], for you were the fewest of all the peoples.
translation:
  language: sw
  text: Si kwa kuwa mlizidi mataifa yote kwa wingi ndipo Yahweh aliwapenda[a] na akawachagua, kwa maana ninyi mlikuwa wachache kuliko mataifa yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alishikamana nanyi kwa upendo.” Kitenzi cha Kiebrania huonyesha kushikamana sana na mtu au kumwelekezea mapenzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֻבְּכֶם
  choice: mlikuwa wengi
  rationale: Katika muundo huu, מִן pamoja na wazo la wingi huonyesha ukubwa wa idadi; Kiswahili cha kawaida hueleza hilo kwa ‘mlikuwa wengi,’ huku ‘kuliko’ ikibeba ulinganisho.
- source_word: מִכָּל הָעַמִּים
  choice: kuliko jamii nyingine zote za watu
  rationale: עַמִּים inarejelea makundi ya watu, si lazima mataifa ya kisiasa. ‘Jamii ... za watu’ inalinda maana hiyo, na ‘nyingine’ hufanya ulinganisho uwe wa kawaida katika Kiswahili.
- source_word: חָשַׁק
  choice: aliwapenda
  rationale: Kitenzi hiki huonyesha kushikamana kwa dhati au kuelekeza mapenzi kwa mtu. ‘Aliwapenda’ ni ya asili na wazi kwa wasomaji wa Kiswahili; tanbihi inadokeza maana pana ya kushikamana kwa upendo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa namna ya kulitamka, badala ya kubadilishwa na cheo.
- source_word: וַיִּבְחַר
  choice: na kuwachagua
  rationale: בחר kwa kawaida humaanisha ‘chagua,’ hasa katika muktadha wa agano; tafsiri hii haiongezi mfumo wa kiteolojia usiotajwa katika mstari.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inaleta maelezo yanayounga mkono kauli iliyotangulia; ‘kwa maana’ huonyesha uhusiano huo kwa Kiswahili cha kawaida chenye hadhi.
- source_word: הַמְעַט
  choice: mlikuwa wachache
  rationale: Ingawa umbo la Kiebrania ni la umoja, kirai kinatumika kueleza udogo wa idadi ya Israeli ukilinganishwa na jamii nyingine.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Matini ina jina la agano יְהוָה moja kwa moja; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadilisha na cheo.
- issue: Kuepuka kusoma mafundisho ya baadaye ndani ya uchaguzi wa Mungu
  choice: na kuwachagua
  alternative: na kuwateua
  rationale: Tafsiri inadumisha kauli ya matini kwamba Yahweh aliwachagua Israeli, bila kuongeza maelezo ya kimfumo kuhusu uchaguzi huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘Si kwa sababu ... ndipo ...’ unahifadhi msisitizo wa ukanushaji wa Kiebrania huku ukisomeka kwa kawaida. ‘Jamii za watu’ imetumiwa badala ya ‘mataifa’ ili kutunza maana ya makundi ya watu.
