base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/020.yaml
  text: Moreover[b][a], Yahweh your God will send the hornet among them until even those who remain and those who hide themselves from before you perish.
translation:
  language: sw
  text: Tena[b], Yahwe Mungu wako atatuma nyigu[a] kati yao, mpaka hata wale waliosalia na wale wanaojificha usiwaone watakapoangamia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “hofu” au “taharuki.” Baadhi hulielewa neno “nyigu” kwa njia ya mfano kuwa hofu iliyotumwa na Mungu, si mdudu halisi.
    reason: lexical_alternative
  - marker: b
    text: Au “Na tena.”
    reason: previous_rendering
lexical_decisions:
- source_word: וְגַם
  choice: Tena
  rationale: Neno hili linaonyesha jambo la nyongeza na linaunganisha ahadi hii na yaliyotangulia bila kutumia kirai kizito au chenye uradidi.
- source_word: הַצִּרְעָה
  choice: nyigu
  rationale: Maana ya msingi ni mdudu anayeuma. Katika Kiswahili, “nyigu” linaweza kutumiwa kwa maana ya jamii au kundi, hivyo linafaa kwa nomino ya Kiebrania iliyo katika umoja lakini yenye uwezekano wa maana ya kijumla.
- source_word: יְשַׁלַּח
  choice: atatuma
  rationale: Kitenzi kinaonyesha kwamba Yahwe ndiye atakayemtuma au kuwaachilia wakala huyu dhidi ya adui.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahwe Mungu wako
  rationale: Huhifadhi jina la agano la Mungu na umilikishi wa moja kwa moja wa usemi wa Kiebrania.
- source_word: בָּם
  choice: kati yao
  rationale: Huhifadhi wazo la nyigu kutumwa ndani ya kundi la maadui, kwa Kiswahili cha kawaida.
- source_word: עַד אֲבֹד
  choice: mpaka ... watakapoangamia
  rationale: Muundo huu unaonyesha kikomo au matokeo ya tendo bila kubainisha zaidi namna ya maangamizi.
- source_word: הַנִּשְׁאָרִים
  choice: wale waliosalia
  rationale: Hurejelea watu waliobaki baada ya hukumu au ushindi uliotangulia bila kuingiza maana maalumu ya kiteolojia ya ‘mabaki.’
- source_word: וְהַנִּסְתָּרִים מִפָּנֶיךָ
  choice: wale wanaojificha usiwaone
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya maadui wanaojisitiri kutoka mbele au uweponi mwa Israeli; “usiwaone” huonyesha kusudi la kujificha bila kudai mahali maalumu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la Mungu la herufi nne; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Ikiwa הַצִּרְעָה ni nyigu halisi au hofu iliyotumwa na Mungu
  choice: Maana halisi “nyigu” katika andiko kuu
  alternative: Hofu au taharuki iliyotumwa na Mungu kwa lugha ya mfano
  rationale: Maana ya moja kwa moja ya neno ni mdudu anayeuma. Hata hivyo, uwezekano wa maana ya mfano hauondolewi, bali umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Tena” ni kiunganishi kifupi na cha kawaida; “wale waliosalia” na “wale wanaojificha usiwaone” vinaeleweka kwa urahisi huku vikihifadhi makundi mawili ya maandishi ya Kiebrania.
