reference: Deuteronomy 7:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּֽי יָסִ֤יר אֶת בִּנְ/ךָ֙ מֵֽ/אַחֲרַ֔/י וְ/עָבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וְ/הִשְׁמִידְ/ךָ֖ מַהֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/004.yaml
  text: For he will turn your son away from following me[a], and they will serve other gods; then the anger of Yahweh will burn against you[c][b], and he will quickly destroy you.
translation:
  language: sw
  text: Kwa maana atamkengeusha mwanao aache kunifuata[a], nao wataabudu miungu mingine[b]. Ndipo hasira ya Yahwe[c] itakapowaka dhidi yenu, naye atakuangamiza upesi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno moja moja, Kiebrania kinasema “kutoka nyuma yangu,” nahau yenye maana ya kuacha kunifuata.
    reason: lexical_alternative
  - marker: b
    text: Au, “naye ataabudu miungu mingine.” Kiebrania hubadilika kutoka umoja (“mwanao”) kwenda wingi (“wataabudu”), jambo linaloweza kupanua onyo kutoka kwa mwana mmoja hadi kwa familia au jamii inayotokana na uasi huo.
    reason: alternative_reading
  - marker: c
    text: “Yahwe” linawakilisha jina la Mungu YHWH; kwa desturi nyingine hutafsiriwa “BWANA.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya katazo lililotangulia; “Kwa maana” kinaendeleza uhusiano huo kwa Kiswahili cha kawaida.
- source_word: יָסִיר
  choice: atamkengeusha ... aache
  rationale: Hifili ya סור ina maana ya kusababisha mtu ageuke au aache njia fulani. “Atamkengeusha ... aache kunifuata” ni ya asili katika Kiswahili na inadumisha maana ya kisababishi.
- source_word: בִּנְךָ
  choice: mwanao
  rationale: Nomino ya Kiebrania iko katika umoja wa kiume na inarejelea moja kwa moja mpangilio wa ndoa uliotajwa katika mstari uliotangulia.
- source_word: מֵאַחֲרַי
  choice: aache kunifuata
  rationale: Kifungu hiki kwa neno moja moja ni “kutoka nyuma yangu,” lakini ni nahau ya kuacha kumfuata Yahwe. Tafsiri hii inatoa maana ya nahau bila kuifanya kuwa ngumu.
- source_word: וְעָבְדוּ
  choice: nao wataabudu
  rationale: Kitenzi cha Kiebrania ni wingi, ingawa “mwanao” ni umoja. Wingi umehifadhiwa ili kutoondoa badiliko halisi la idadi katika matini.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida, ikionyesha tofauti kati ya kumfuata Yahwe na kuabudu miungu mingine.
- source_word: וְחָרָה אַף יְהוָה
  choice: Ndipo hasira ya Yahwe itakapowaka
  rationale: Kiebrania kinatumia taswira hai ya hasira inayowaka. “Ndipo” linaonyesha matokeo ya uasi uliotangulia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi kwa namna inayotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: בָּכֶם
  choice: dhidi yenu
  rationale: Kihusishi pamoja na nahau ya hasira kinaonyesha wale wanaoelekezewa hasira. Kiwakilishi cha wingi cha Kiebrania kimehifadhiwa kwa “yenu.”
- source_word: וְהִשְׁמִידְךָ
  choice: naye atakuangamiza
  rationale: Hifili ya שׁמד inaonyesha kuharibu au kuangamiza kabisa. Kiwakilishi cha umoja cha Kiebrania kimehifadhiwa katika “atakuangamiza,” licha ya wingi uliotangulia.
- source_word: מַהֵר
  choice: upesi
  rationale: Kielezi hiki huonyesha hukumu inayokuja kwa haraka; “upesi” ni wazi, cha heshima, na cha kawaida.
theological_decisions:
- issue: Badiliko kutoka “mwanao” wa umoja kwenda kitenzi cha wingi
  choice: Kuhifadhi umoja katika “mwanao” na wingi katika “nao wataabudu”
  alternative: Kusawazisha sentensi kuwa “naye ataabudu” au kutumia “watoto wako”
  rationale: Matini ya Kiebrania hubadilika kwa makusudi au kwa namna yenye uwezekano wa maana zaidi ya moja. Kuhifadhi idadi zote mbili hakufungi ikiwa onyo linamhusu mwana mmoja tu, ukoo unaotokana na ndoa hiyo, au jamii kwa upana.
- issue: Badiliko la idadi katika walengwa wa hukumu
  choice: “dhidi yenu” kwa wingi, kisha “atakuangamiza” kwa umoja
  alternative: Kusawazisha vyote viwe wingi au umoja
  rationale: Kiebrania kina בָּכֶם ya wingi kisha kiambishi cha umoja katika וְהִשְׁמִידְךָ. Tafsiri inadumisha mvutano huu badala ya kuufuta kimya kimya.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Kutumia “Yahwe” huhifadhi jina binafsi lililo katika matini ya Kiebrania; tanbihi inamtajia msomaji desturi nyingine ya kulitafsiri kwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili kwa wasomaji wa kawaida lakini unahifadhi taswira ya hasira inayowaka, umoja wa “mwanao,” wingi wa “wataabudu” na “yenu,” pamoja na kurudi kwa umoja katika “atakuangamiza.”
