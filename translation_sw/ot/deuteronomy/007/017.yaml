  text: If you say in your heart[a], ‘These nations are more numerous than I; how can I dispossess them?’
translation:
  language: sw
  text: Ukisema moyoni mwako, “Mataifa haya yana watu wengi kuliko mimi; nitawezaje kuwanyang’anya nchi yao?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nitawafukuzaje?” Kitenzi cha Kiebrania kina maana ya kuwafanya waipoteze nchi waliyokuwa wanamiliki.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תֹאמַר בִּלְבָבְךָ
  choice: Ukiwaza moyoni mwako
  rationale: Katika muktadha huu כִּי pamoja na kitenzi cha hali isiyotimilika huanzisha hali ya sharti. Ingawa אמר kimsingi ni ‘kusema,’ kirai ‘kusema moyoni’ humaanisha kuwaza au kujisemea; tafsiri hii ni ya kawaida katika Kiswahili huku ikidumisha picha ya moyo.
- source_word: רַבִּים הַגּוֹיִם הָאֵלֶּה מִמֶּנִּי
  choice: Mataifa haya yana watu wengi kuliko mimi
  rationale: רַבִּים pamoja na מִמֶּנִּי huonyesha ulinganisho wa idadi. Kiswahili cha kawaida hueleza kwamba mataifa hayo yana watu wengi kuliko msemaji, badala ya kusema kwa namna isiyo ya kawaida kwamba mataifa yenyewe ni mengi kuliko mtu mmoja.
- source_word: אֵיכָה אוּכַל
  choice: nitawezaje
  rationale: Kirai hiki kinauliza kuhusu uwezo au uwezekano. ‘Nitawezaje’ huwasilisha vizuri hali ya baadaye inayotazamwa katika swali hilo.
- source_word: לְהוֹרִישָׁם
  choice: kuwanyang’anya nchi yao
  rationale: Hifili ya ירש katika muktadha wa nchi humaanisha kuwasababisha watu wapoteze umiliki wao. ‘Kuwanyang’anya nchi yao’ huweka wazi maana ya kuwaondolea milki, huku tanbihi ikihifadhi tafsiri mbadala ya kuwafukuza.
