translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Umoja wa nafsi ya pili katika Kiebrania umeonyeshwa kwa ‘u-’ na ‘-ako’; swali la ndani limewasilishwa kwa lugha ya kawaida bila kuondoa maana ya umiliki wa nchi.
