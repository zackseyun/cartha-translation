base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/017.yaml
  text: also the Arabah[a], with the Jordan as its border, from Kinnereth as far as the Sea of the Arabah, the Salt Sea[b], below the slopes of Pisgah on the east.
translation:
  language: sw
  text: pia Araba, huku Yordani ikiwa mpaka wake, kuanzia Kinerethi[a] hadi Bahari ya Araba, yaani Bahari ya Chumvi[b], chini ya miteremko ya Pisga upande wa mashariki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina hili pia huandikwa Kinereti.
    reason: lexical_alternative
  - marker: b
    text: Yaani, Bahari Mfu.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: Araba
  rationale: Imetumiwa kama jina maalumu la eneo la ufa wa Yordani, si kama nomino ya kawaida yenye maana ya tambarare.
- source_word: הַיַּרְדֵּן
  choice: Yordani
  rationale: Hili ndilo jina la kawaida la kijiografia katika Kiswahili; neno “Mto” linaeleweka kutokana na muktadha na si lazima liongezwe.
- source_word: גְבֻל
  choice: ikiwa mpaka wake
  rationale: Kiebrania kina muundo wa orodha uliofupishwa; usemi huu unaonyesha kwa Kiswahili cha kawaida kwamba Yordani ndiyo mpaka bila kuongeza wazo jipya.
- source_word: מִכִּנֶּרֶת
  choice: kuanzia Kinerethi
  rationale: Jina la mahali limetoholewa badala ya kufafanuliwa kama ziwa au eneo, kwa kuwa Kiebrania chenyewe kinataja jina tu.
- source_word: יָם הָעֲרָבָה
  choice: Bahari ya Araba
  rationale: Tafsiri hii inadumisha jina la Kiebrania na uhusiano wake na eneo la Araba.
- source_word: יָם הַמֶּלַח
  choice: Bahari ya Chumvi
  rationale: Hii ni tafsiri ya moja kwa moja ya jina la Kiebrania; jina la kisasa “Bahari Mfu” limetolewa katika tanbihi.
- source_word: תַּחַת
  choice: chini ya
  rationale: Katika maelezo ya mandhari, usemi huu unaonyesha uhusiano wa mahali bila kuugeuza kimakosa kuwa mwelekeo wa dira.
- source_word: אַשְׁדֹּת
  choice: miteremko ya
  rationale: Katika muktadha huu wa kijiografia, neno linaelekea kumaanisha miteremko au sehemu za chini za mlima.
- source_word: הַפִּסְגָּה
  choice: Pisga
  rationale: Limetoholewa kama jina maalumu la mahali.
- source_word: מִזְרָחָה
  choice: upande wa mashariki
  rationale: Hutoa maana ya mahali au mwelekeo kwa Kiswahili sanifu bila kulazimisha uhusiano ambao maandishi hayajaueleza wazi zaidi.
