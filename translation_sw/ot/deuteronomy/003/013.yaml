base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/013.yaml
  text: And the rest of Gilead[a], and all Bashan, the kingdom of Og, I gave to the half-tribe of Manasseh—all the region of Argob, that is, all Bashan. That is called the land of the Rephaim.
translation:
  language: sw
  text: Sehemu iliyobaki ya Gileadi na Bashani yote, ufalme wa Ogu, niliitoa kwa nusu ya kabila la Manase—eneo lote la Argobu, yaani Bashani yote. Nchi hiyo huitwa nchi ya Warefai[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya jadi, “nchi ya majitu.” “Warefai” ni jina la Kiebrania la watu wa kale waliohusishwa na eneo hili.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הַגִּלְעָד
  choice: sehemu iliyobaki ya Gileadi
  rationale: Inaonyesha sehemu ya Gileadi iliyosalia baada ya mgao uliotajwa awali, kwa Kiswahili cha kawaida na kilicho wazi.
- source_word: כָל הַבָּשָׁן
  choice: Bashani yote
  rationale: Inadumisha maana jumuishi ya כָל na kutumia mpangilio wa kawaida wa Kiswahili.
- source_word: מַמְלֶכֶת עוֹג
  choice: ufalme wa Ogu
  rationale: Ni tafsiri ya moja kwa moja ya muundo wa Kiebrania na inalitaja eneo kwa utawala wake.
- source_word: נָתַתִּי
  choice: niliipa
  rationale: Inahifadhi nafsi ya kwanza na maana ya msingi ya ‘kutoa’; kiambishi cha ngeli kinapatana na ‘nusu ya kabila’ kama mpokeaji.
- source_word: לַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: nusu ya kabila la Manase
  rationale: Ni usemi wa asili na wa kisarufi unaoeleza mgawanyiko wa kabila katika mgao wa eneo.
- source_word: כֹּל חֶבֶל הָאַרְגֹּב
  choice: eneo lote la Argobu
  rationale: חֶבֶל hapa ni eneo au wilaya, si kamba halisi; ‘eneo’ ni wazi kwa wasomaji wa sasa.
- source_word: לְכָל הַבָּשָׁן
  choice: yaani Bashani yote
  rationale: Inawasilisha uhusiano wa ufafanuzi wa kirai hiki katika muktadha bila kuongeza maelezo yasiyo katika matini.
- source_word: יִקָּרֵא
  choice: huitwa
  rationale: Kauli ya kutendwa ya mazoea inaelezwa kwa wakati wa sasa wa kawaida, unaofaa kwa jina linalotambulisha eneo.
- source_word: אֶרֶץ רְפָאִים
  choice: nchi ya Warefai
  rationale: Inatunza jina la watu kama jina maalumu badala ya kulifasiri moja kwa moja kuwa ‘majitu’; uwezekano huo umetajwa katika tanbihi.
theological_decisions:
- issue: Iwapo רְפָאִים litafsiriwe kama jina la watu au kama ‘majitu’
  choice: nchi ya Warefai
  alternative: nchi ya majitu
  rationale: Katika mstari huu neno hilo linafanya kazi kama jina la kundi la kale. Kulitoholewa katika matini kuu kunazuia kuingiza hitimisho la kifasiri, huku tanbihi ikihifadhi tafsiri ya jadi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Majina yametoholewa kwa maumbo yaliyozoeleka katika Kiswahili: Gileadi, Bashani, Ogu, Manase, Argobu, na Warefai. Alama ya tanbihi imewekwa baada ya ‘Warefai,’ ambako suala la kileksika linahusika.'
