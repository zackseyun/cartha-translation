base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/021.yaml
  text: And I commanded Joshua at that time[a], saying, ‘Your eyes have seen all that Yahweh your God did to these two kings; so Yahweh will do to all the kingdoms through which you are passing.’
translation:
  language: sw
  text: Wakati huo nikamwamuru Yoshua, nikisema, “Macho yako yameona yote ambayo Yahwe, Mungu wenu, aliwatendea wafalme hawa wawili. Vivyo hivyo Yahwe atazitendea falme zote unazovuka kwenda huko.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri iliyo karibu zaidi na mpangilio wa Kiebrania: “falme zote ambazo unavuka kwenda huko.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת יְהוֹשׁוּעַ צִוֵּיתִי
  choice: nikamwamuru Yoshua
  rationale: Kitenzi צוה kinaonyesha amri yenye mamlaka; ‘nikamwamuru’ ni cha moja kwa moja na cha kawaida katika Kiswahili.
- source_word: בָּעֵת הַהִוא לֵאמֹר
  choice: Wakati huo ... nikisema
  rationale: Muundo huu unahifadhi usemi wa wakati na fomula ya Kiebrania ya kuanzisha maneno yanayonukuliwa bila kuwa mzito.
- source_word: עֵינֶיךָ הָרֹאֹת
  choice: Macho yako yameona
  rationale: Tafsiri hii inadumisha picha halisi na mkazo wa ushuhuda wa Yoshua mwenyewe kuliko kuirahisisha kuwa ‘umeona.’
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahwe, Mungu wenu
  rationale: Jina la agano יְהוָה limetolewa kama ‘Yahwe.’ Kiambishi cha אֱלֹהֵיכֶם ni cha wingi, kwa hiyo ‘wenu’ kinarejelea Yoshua pamoja na Israeli, ingawa Yoshua ndiye anayeambiwa moja kwa moja.
- source_word: לִשְׁנֵי הַמְּלָכִים הָאֵלֶּה
  choice: aliwatendea wafalme hawa wawili
  rationale: ‘Aliwatendea’ huonyesha kuwa wafalme hao ndio waliopata tendo la Yahwe bila kuongeza wazi ‘dhidi ya,’ jambo ambalo muktadha tayari unaonyesha.
- source_word: כֵּן יַעֲשֶׂה יְהוָה
  choice: Vivyo hivyo Yahwe atazitendea
  rationale: '‘Vivyo hivyo’ linaonyesha kwa wazi ulinganisho: yatakayotokea yatakuwa kwa mfano wa yale yaliyowapata wafalme wawili.'
- source_word: אֲשֶׁר אַתָּה עֹבֵר שָׁמָּה
  choice: unazovukia
  rationale: ‘Unazovukia’ ni usemi mfupi na wa asili unaodumisha wazo la kuvuka na kumwelekea mahali; umoja wa anayesemeshwa unamhusu Yoshua.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia moja kwa moja jina la agano יְהוָה; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Mabadiliko kutoka anayesemeshwa mmoja hadi kiambishi cha wingi katika אֱלֹהֵיכֶם
  choice: Macho yako ... Mungu wenu
  alternative: Macho yako ... Mungu wako
  rationale: Kiebrania kinamwambia Yoshua kwa umoja katika ‘macho yako’ lakini kinasema ‘Mungu wenu’ kwa wingi, kikimhusisha na jamii ya Israeli. Mvutano huo wa kisarufi umehifadhiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Nikamwamuru’ na ‘nikisema’ huhifadhi mtiririko wa simulizi; ‘unazovukia’ huepuka tafsiri ngumu isiyo ya kawaida huku ikidumisha taswira ya kuvuka.
