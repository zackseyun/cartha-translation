base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/028.yaml
  text: But commission Joshua[a], and strengthen him and encourage him, for he will cross over before this people[c][b], and he will cause them to inherit the land that you will see.
translation:
  language: sw
  text: Lakini mwagize Yoshua[a], umtie nguvu na moyo[b], kwa maana yeye atavuka mbele ya watu hawa, naye atawamilikisha[c] nchi utakayoiona.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwamuru Yoshua,” au “mkabidhi Yoshua wajibu.” Kitenzi cha Kiebrania kinaweza kumaanisha kumpa mtu agizo rasmi la wajibu.
    reason: lexical_alternative
  - marker: b
    text: Au, “umtie nguvu na ujasiri.” Vitenzi hivi viwili kwa pamoja vinahimiza uthabiti na moyo mkuu.
    reason: lexical_alternative
  - marker: c
    text: 'Au, “atawapa nchi iwe urithi wao.” Kitenzi cha Kiebrania ni cha kisababishi: Yoshua atakuwa wakala ambaye kupitia kwake watu wataimiliki nchi kuwa urithi wao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצַו
  choice: mpe ... agizo
  rationale: Kauli ya amri ya piel ya צוה hapa inaelekeza kwa kumpa Yoshua wajibu rasmi. ‘Mpe agizo’ ni Kiswahili cha kawaida na chenye hadhi, huku kikihifadhi uwezekano wa maana ya kuamuru au kukabidhi rasmi.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Jina limetolewa kwa umbo lililozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: וְחַזְּקֵהוּ
  choice: umtie nguvu
  rationale: Piel ya חזק ina maana ya kumfanya awe imara au mwenye nguvu; ‘umtie nguvu’ ni usemi wa asili wa Kiswahili na hudumisha nguvu ya amri.
- source_word: וְאַמְּצֵהוּ
  choice: na moyo
  rationale: Katika uambatano huu אמץ humaanisha kumtia ujasiri au kumfanya awe thabiti. ‘Umtie nguvu na moyo’ ni jozi ya asili ya Kiswahili inayowasilisha kuimarishwa na kutiwa ujasiri.
- source_word: כִּי הוּא יַעֲבֹר
  choice: kwa maana yeye atavuka
  rationale: עבר katika muktadha huu inahusu kuvuka, hasa kuvuka Yordani. Kiwakilishi ‘yeye’ kimehifadhiwa kwa sababu Kiebrania kinakisisitiza.
- source_word: לִפְנֵי הָעָם הַזֶּה
  choice: mbele ya watu hawa
  rationale: Tafsiri hii huhifadhi maana ya nafasi ya לִפְנֵי na pia dokezo la Yoshua kuwaongoza watu bila kulifafanua kupita kiasi.
- source_word: וְהוּא יַנְחִיל אֹתָם
  choice: naye atawamilikisha
  rationale: 'Hiphil ya נחל ni ya kisababishi: Yoshua atakuwa wakala ambaye kupitia kwake watu wataipokea nchi kuwa milki yao. ‘Atawamilikisha’ huwasilisha maana hiyo kwa ufupi na kwa Kiswahili cha asili.'
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika Kumbukumbu la Torati neno hili hurejelea nchi iliyoahidiwa; ‘nchi’ ndilo chaguo la kawaida na linalofaa katika Kiswahili.
- source_word: אֲשֶׁר תִּרְאֶה
  choice: utakayoiona
  rationale: Kitenzi cha imperfect kinaeleweka hapa kwa wakati ujao, kikirejelea nchi ambayo Musa ataruhusiwa kuiona lakini si kuingia ndani yake.
