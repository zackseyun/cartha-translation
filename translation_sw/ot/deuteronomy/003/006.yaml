base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/006.yaml
  text: And we devoted them to destruction[a], just as we had done to Sihon king of Heshbon, utterly destroying every city—men, women, and little ones.
translation:
  language: sw
  text: Tukawaweka wakfu kwa maangamizi[a], kama tulivyomfanyia Sihoni, mfalme wa Heshboni, kwa kuwaangamiza kabisa katika kila mji—wanaume, wanawake, na watoto wadogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tukawatenga kwa maangamizi”; Kiebrania hutumia kitenzi חרם, istilahi maalumu ya kuweka kitu au mtu wakfu kwa maangamizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּחֲרֵם
  choice: Tukawaweka wakfu kwa maangamizi
  rationale: Kitenzi חרם katika Hifili ni istilahi maalumu ya kukiweka kitu au mtu wakfu ili aangamizwe. Tafsiri hii inadumisha maana hiyo ya kiufundi na uzito wake badala ya kuifanya kuwa ‘tuliwaangamiza’ tu.
- source_word: כַּאֲשֶׁר עָשִׂינוּ
  choice: kama tulivyomfanyia
  rationale: Kirai hiki kinalinganisha tendo hilo na tendo lililokuwa limefanywa kwa Sihoni; muundo wa Kiswahili ni wa kawaida na unarejelea tendo lililotangulia.
- source_word: לְסִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: Sihoni, mfalme wa Heshboni
  rationale: Kiambishi ל humtaja Sihoni kama aliyepatwa na tendo hilo. Alama za mkato zinaonyesha wazi kuwa ‘mfalme wa Heshboni’ ni cheo chake.
- source_word: הַחֲרֵם
  choice: tuliangamiza kabisa
  rationale: Hii ni hali-jina sisitizi inayofafanua na kuimarisha tendo la חרם; ‘kabisa’ huonyesha ukamilifu wake kwa Kiswahili cha kawaida.
- source_word: כָּל עִיר
  choice: kila mji
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya kirai hiki katika muktadha wa kutekwa kwa miji.
- source_word: מְתִם
  choice: wanaume
  rationale: Nomino hii inawataja watu wa kiume na hapa inatofautishwa na wanawake na watoto wadogo; ‘wanaume’ inadumisha orodha hiyo ya makundi matatu.
- source_word: הַנָּשִׁים
  choice: wanawake
  rationale: Tafsiri ya moja kwa moja ya nomino hiyo.
- source_word: וְהַטָּף
  choice: na watoto wadogo
  rationale: טף humaanisha hasa watoto wadogo au wategemezi; ‘watoto wadogo’ ni wazi na hudumisha umri unaodokezwa.
theological_decisions:
- issue: Jinsi ya kutafsiri חרם katika muktadha wa hukumu ya kivita
  choice: Kuweka ‘wakfu kwa maangamizi’ katika kishazi kikuu, kisha kutumia ‘tuliangamiza kabisa’ kwa hali-jina sisitizi
  alternative: ‘Tuliwaangamiza kabisa’ au ‘tukawaweka chini ya marufuku’
  rationale: Aya inaeleza maangamizi kamili chini ya חרם. Tafsiri haipunguzi ukali wa tendo wala kuficha kwamba neno hilo ni istilahi maalumu; tanbihi inaeleza maana yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘wakfu kwa maangamizi’ umehifadhiwa kwa sababu ya maana ya kiufundi ya חרם, huku ‘tuliangamiza kabisa’ ikitoa ufafanuzi wa kawaida. Orodha ‘wanaume, wanawake na watoto wadogo’ inadumisha makundi matatu yaliyo katika Kiebrania.
