  text: All these were fortified cities with a high wall, double doors, and bars, besides a great many rural towns.
translation:
  language: sw
  text: Miji hii yote ilikuwa miji yenye maboma, yenye ukuta mrefu, milango ya mabawa mawili, na makomeo; mbali na miji mingi sana isiyo na kuta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vijiji vya maeneo ya wazi” au “miji isiyo na kuta.” Kiebrania kinatofautisha makazi haya na miji yenye maboma iliyotajwa hapo awali.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֻרוֹת
  choice: imejengewa ngome
  rationale: Hueleza miji iliyoimarishwa ili kujilinda dhidi ya mashambulizi; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: חוֹמָה גְבֹהָה
  choice: ukuta mrefu
  rationale: Huhifadhi umoja wa neno la Kiebrania na kueleza ukuta wa kinga wenye kimo kikubwa.
- source_word: דְּלָתַיִם
  choice: milango yenye pande mbili
  rationale: Umbo la uwili linaonyesha jozi ya mabawa ya lango; tafsiri hii huhifadhi maana hiyo bila kudai kwamba kulikuwa na malango mawili tofauti.
- source_word: וּבְרִיחַ
  choice: na makomeo
  rationale: Makomeo ni vyuma au miti ya kuzuia milango ya ngome, hivyo yanafaa katika muktadha wa ulinzi wa miji.
- source_word: לְבַד
  choice: mbali na
  rationale: Huonyesha kwamba miji mingine mingi inaongezwa kwa ile miji yenye ngome iliyotajwa.
- source_word: מֵעָרֵי הַפְּרָזִי
  choice: miji ... isiyokuwa na kuta
  rationale: Hutoa wazi tofauti ya msingi kati ya makazi haya ya wazi na miji yenye ngome, huku tanbihi ikihifadhi uwezekano wa 'vijiji vya maeneo ya wazi.'
- source_word: הַרְבֵּה מְאֹד
  choice: mingi sana
  rationale: Ni Kiswahili cha kawaida kinachohifadhi msisitizo wa wingi mkubwa.
- source_word: כָּל אֵלֶּה עָרִים
  choice: Miji hii yote ilikuwa
  rationale: Muundo huu ni wa asili katika Kiswahili na unadumisha msisitizo wa 'hii yote.'
