- from: Miji hii yote ilikuwa imejengewa ngome, ikiwa na ukuta mrefu, milango yenye pande mbili, na makomeo; mbali na miji mingi sana isiyokuwa na kuta.[a]
  to: Miji hii yote ilikuwa miji yenye maboma, yenye ukuta mrefu, milango ya mabawa mawili, na makomeo; mbali na miji mingi sana isiyo na kuta.[a]
  rationale: The revision replaces an expression implying a separately built fortress with “miji yenye maboma,” which directly conveys fortified cities. It renders the dual doors as paired leaves in natural Swahili and aligns the footnote’s terminology with the text while retaining the lexical alternatives for the disputed/open-settlement expression.
