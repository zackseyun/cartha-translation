base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/004.yaml
  text: 'And we captured all his cities at that time; there was not a city that we did not take from them: sixty cities[a], all the region of Argob, the kingdom of Og in Bashan.'
translation:
  language: sw
  text: 'Wakati huo tuliteka miji yake yote; hapakuwa na mji hata mmoja ambao hatukuuchukua kutoka kwao[a]: miji sitini, eneo lote la Argobu, ufalme wa Ogu huko Bashani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema “kutoka kwao,” huenda likiwarejelea watu au majeshi ya Ogu, si Ogu peke yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: tuliteka
  rationale: Kitenzi לכד kinaonyesha kuteka katika vita; “tuliteka” ni cha kawaida na kinahifadhi maana hiyo ya kijeshi.
- source_word: כָּל עָרָיו
  choice: miji yake yote
  rationale: עיר inaweza kumaanisha mji mkubwa au mdogo; “miji” ni tafsiri ya kawaida hapa, na kiambishi cha umilikaji kinamrejelea Ogu.
- source_word: בָּעֵת הַהִוא
  choice: Wakati huo
  rationale: Ni usemi wa kawaida wa wakati na unasikika kwa ufasaha katika Kiswahili cha sasa.
- source_word: לֹא הָיְתָה קִרְיָה אֲשֶׁר לֹא לָקַחְנוּ מֵאִתָּם
  choice: hapakuwa na mji hata mmoja ambao hatukuuchukua kutoka kwao
  rationale: Muundo huu unahifadhi msisitizo wa ukanushaji wa Kiebrania na wingi wa kiwakilishi katika מֵאִתָּם.
- source_word: מֵאִתָּם
  choice: kutoka kwao
  rationale: Kiwakilishi cha Kiebrania ni cha wingi, kwa hiyo hakijasawazishwa kuwa “kutoka kwake”; huenda kinawarejelea watu au majeshi ya Ogu.
- source_word: שִׁשִּׁים עִיר
  choice: miji sitini
  rationale: Ni uwasilishaji wa moja kwa moja wa hesabu na nomino, unaodumisha “miji” kama ilivyotumika mapema katika mstari.
- source_word: כָּל חֶבֶל אַרְגֹּב
  choice: eneo lote la Argobu
  rationale: חבל hapa ni eneo au wilaya; “eneo” ni neno la sasa, wazi, na lisilobeba utawala wa kisasa kama “wilaya” linavyoweza kufanya.
- source_word: מַמְלֶכֶת עוֹג בַּבָּשָׁן
  choice: katika ufalme wa Ogu huko Bashani
  rationale: Maneno haya yanafafanua eneo la Argobu kuwa sehemu ya ufalme wa Ogu uliokuwa Bashani; “huko” hufanya mahali paeleweke kwa kawaida.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili: Argobu, Ogu, na Bashani. Neno “yaani” linaonyesha kwamba miji sitini inaeleza kwa ufafanuzi eneo lote la Argobu bila kubadili uhusiano wa kisarufi wa maandishi.'
