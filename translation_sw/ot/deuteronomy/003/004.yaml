  to: 'Wakati huo tuliteka miji yake yote; hapakuwa na mji hata mmoja ambao hatukuuchukua kutoka kwao[a]: miji sitini, eneo lote la Argobu, ufalme wa Ogu huko Bashani.'
  rationale: The revision preserves the Hebrew’s enumeration and apposition without adding the explanatory connective “yaani” or changing “the kingdom of Og in Bashan” into a merely locative phrase. It retains the plural “kwao” and its qualifying footnote.
