language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֣י רַק ע֞וֹג מֶ֣לֶךְ הַ/בָּשָׁ֗ן נִשְׁאַר֮ מִ/יֶּ֣תֶר הָ/רְפָאִים֒ הִנֵּ֤ה עַרְשׂ/וֹ֙ עֶ֣רֶשׂ בַּרְזֶ֔ל הֲ/לֹ֣ה הִ֔וא בְּ/רַבַּ֖ת בְּנֵ֣י עַמּ֑וֹן תֵּ֧שַׁע אַמּ֣וֹת אָרְכָּ֗/הּ וְ/אַרְבַּ֥ע אַמּ֛וֹת רָחְבָּ֖/הּ בְּ/אַמַּת אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/011.yaml
  text: For only Og king of Bashan was left of the remnant of the Rephaim[a]. Look, his bed was a bed of iron. Is it not in Rabbah of the Ammonites? Its length was nine cubits and its width four cubits[b], by the cubit of a man.
translation:
  language: sw
  text: Kwa maana ni Ogu tu, mfalme wa Bashani, aliyebaki kati ya mabaki ya Warefai[a]. Tazama, kitanda chake kilikuwa kitanda cha chuma. Je, hakiko Raba ya Waamoni? Urefu wake ulikuwa dhiraa tisa, na upana wake dhiraa nne[b], kwa dhiraa ya mtu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “majitu.” Kiebrania: “Warefai,” yaelekea jina la watu wa kale waliohusishwa na umbo kubwa.'
    reason: alternative_reading
  - marker: b
    text: 'Yaani, “kwa dhiraa ya kawaida” au “kulingana na dhiraa ya kawaida.” Kiebrania kihalisi: “kwa dhiraa ya mtu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: ni Ogu tu
  rationale: Kiswahili cha asili kinatumia muundo huu kuonyesha kwamba Ogu peke yake ndiye aliyebaki.
- source_word: נִשְׁאַר מִיֶּתֶר
  choice: aliyebaki kati ya mabaki ya
  rationale: Huwasilisha wazo la kubaki kutoka katika kundi lililosalia bila kufanya sentensi kuwa nzito.
- source_word: הָרְפָאִים
  choice: Warefai
  rationale: Jina la kundi linahifadhiwa badala ya kutafsiriwa moja kwa moja kuwa 'majitu,' ambalo ni fasiri.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili la heshima na linaloeleweka huvuta fikira kwenye kitu kilichotajwa kama ushahidi.
- source_word: עַרְשׂוֹ ... עֶרֶשׂ
  choice: kitanda chake kilikuwa kitanda
  rationale: Marudio ya nomino katika Kiebrania yanahifadhiwa; 'kitanda' ndiyo maana ya kawaida inayofaa muktadha.
- source_word: בַּרְזֶל
  choice: chuma
  rationale: Hili ndilo neno la kawaida na sahihi kwa nyenzo hiyo.
- source_word: הֲלֹא הִוא
  choice: Je, hakiko
  rationale: Huhifadhi swali la balagha linalodokeza kwamba kitu hicho kilijulikana.
- source_word: בְּרַבַּת בְּנֵי עַמּוֹן
  choice: Raba ya Waamoni
  rationale: Hutumia jina la mahali na jina la kawaida la watu hao katika Kiswahili cha Biblia.
- source_word: תֵּשַׁע אַמּוֹת ... וְאַרְבַּע אַמּוֹת
  choice: dhiraa tisa ... dhiraa nne
  rationale: Kipimo cha kale kinahifadhiwa bila kukibadili kuwa kipimo cha kisasa chenye usahihi bandia.
- source_word: בְּאַמַּת אִישׁ
  choice: kwa dhiraa ya mtu
  rationale: Tafsiri iliyo karibu na Kiebrania huhifadhi usemi ambao unaweza kumaanisha dhiraa ya kawaida; uwezekano huo unaelezwa katika tanbihi.
theological_decisions:
- issue: Iwapo הָרְפָאִים itafsiriwe kwa fasiri kuwa 'majitu' au ihifadhiwe kama jina la kundi
  choice: Warefai
  alternative: majitu
  rationale: Kiebrania kinatumia jina la kundi linalojulikana. Muktadha unaweza kuhusisha watu wenye umbo kubwa, lakini tafsiri haipaswi kufanya hitimisho hilo kuwa maana pekee.
- issue: Iwapo עֶרֶשׂ hapa ni kitanda au jeneza la wazi/sanduku la maiti
  choice: kitanda
  alternative: jeneza la wazi au sanduku la maiti
  rationale: Vipimo vya kitu hicho katika muktadha vinaeleweka kwa kawaida kama ushahidi wa kimo kikubwa cha Ogu; hata hivyo, maana ya mazishi haijafanywa kuwa fundisho wala kuingizwa katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Majina Ogu, Bashani, Raba, Waamoni, na Warefai yanafuata maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili. Marudio ya 'kitanda' na swali la balagha yamehifadhiwa kwa uaminifu wa kimtindo.
