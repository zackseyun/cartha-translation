translation:
  language: sw
  text: Lakini mifugo yote na nyara za miji tulijitwalia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nasi tuliteka mifugo yote na nyara za miji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Lakini ... yote
  rationale: Waw inaunganisha sentensi hii na kuangamizwa kwa watu katika mstari uliotangulia huku ikionyesha tofauti na mifugo na mali zilizoachwa; “Lakini” huwasilisha nguvu hiyo ndogo ya upinzani, na “yote” huhifadhi maana ya כָּל.
- source_word: הַ/בְּהֵמָה
  choice: mifugo
  rationale: בְּהֵמָה hapa inarejelea wanyama wa kufugwa; “mifugo” ni neno la kawaida na sahihi katika Kiswahili cha sasa.
- source_word: וּ/שְׁלַל
  choice: na nyara
  rationale: שָׁלָל ni mali inayotwaliwa vitani. “Nyara” hudumisha maana ya kijeshi na ni ya heshima na inayoeleweka kwa urahisi.
- source_word: הֶ/עָרִים
  choice: za miji
  rationale: Muundo wa hali ya kutegemeana unaonyesha nyara zilizokuwa za miji hiyo au zilizotwaliwa humo; “za miji” hufuata muundo wa Kiebrania bila kufafanua kupita kiasi.
- source_word: בַּזּוֹנוּ
  choice: tulijitwalia kuwa nyara
  rationale: Kitenzi בזז humaanisha kupora au kutwaa nyara. Kauli hii inaonyesha wazi tendo la kutwaa mali vitani na inaepuka utata wa kitenzi “kuharibu.”
- source_word: לָֽ/נוּ
  choice: tulijitwalia
  rationale: Kiambishi cha kujirejelea “-ji-” katika muktadha huu huonyesha kwamba waliitwaa kwa ajili yao wenyewe, kwa Kiswahili cha kawaida na kisicho kizito.
