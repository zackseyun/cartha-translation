translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri inahifadhi tofauti kati ya kuangamizwa kwa wakazi katika muktadha uliotangulia na kutwaliwa kwa mifugo na mali; tanbihi huhifadhi uwezekano wa kutafsiri waw kama kiunganishi cha kawaida na בזז kwa kitenzi “kupora.”
