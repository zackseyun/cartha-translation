source:
  edition: WLC
  text: אֲדֹנָ֣/י יְהוִ֗ה אַתָּ֤ה הַֽחִלּ֨וֹתָ֙ לְ/הַרְא֣וֹת אֶֽת עַבְדְּ/ךָ֔ אֶ֨ת גָּדְלְ/ךָ֔ וְ/אֶת יָדְ/ךָ֖ הַ/חֲזָקָ֑ה אֲשֶׁ֤ר מִי אֵל֙ בַּ/שָּׁמַ֣יִם וּ/בָ/אָ֔רֶץ אֲשֶׁר יַעֲשֶׂ֥ה כְ/מַעֲשֶׂ֖י/ךָ וְ/כִ/גְבוּרֹתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/024.yaml
  text: O Lord Yahweh[a], you have begun to show your servant your greatness and your strong hand. For what god is there in heaven or on earth who can do deeds like your deeds and mighty acts like yours?
translation:
  language: sw
  text: “Ee Bwana Yahwe[a], umeanza kumwonyesha mtumishi wako ukuu wako na mkono wako wenye nguvu. Kwa maana ni mungu gani mbinguni au duniani anayeweza kutenda matendo kama yako na matendo ya uweza kama yako?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: Adonai YHWH, yaani, “Bwana Yahwe.”'
    reason: Kufafanua kwamba maandishi ya asili yana cheo ‘Bwana’ pamoja na jina la Mungu יהוה.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Ee Bwana Yahwe
  rationale: Neno אֲדֹנָי ni cheo ‘Bwana,’ nalo יהוה ni jina la Mungu. ‘Ee Bwana Yahwe’ linahifadhi cheo na jina tofauti kwa Kiswahili kinachoeleweka.
- source_word: הַחִלּוֹתָ לְהַרְאוֹת
  choice: umeanza kumwonyesha
  rationale: Muundo huu una maana ya kuanza kuonyesha; wakati timilifu ‘umeanza’ unaonyesha jambo lililoanzishwa na ambalo umuhimu wake unaendelea.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Katika sala ya Musa kwa Mungu, ‘mtumishi’ ni neno la asili na lenye heshima kuliko ‘mtumwa,’ huku likidumisha uhusiano wa aliye chini ya mamlaka.
- source_word: גָּדְלְךָ
  choice: ukuu wako
  rationale: ‘Ukuu’ hutoa moja kwa moja maana ya ukubwa na adhama ya Mungu.
- source_word: יָדְךָ הַחֲזָקָה
  choice: mkono wako wenye nguvu
  rationale: Huhifadhi taswira ya Kiebrania ya mkono kama nguvu inayotenda, kwa lugha ya kawaida ya Kiswahili.
- source_word: מִי אֵל
  choice: ni mungu gani
  rationale: Hili ni swali la balagha kuhusu kama kuna mungu yeyote anayeweza kulinganishwa na Yahwe; herufi ndogo inafaa kwa mungu anayedhaniwa kwa ujumla.
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  choice: mbinguni au duniani
  rationale: Ingawa Kiebrania lina kiunganishi ‘na,’ katika swali hili ‘au’ huwasilisha kwa kawaida upeo wote wa mahali panapoweza kuwapo mshindani.
- source_word: יַעֲשֶׂה
  choice: anayeweza kutenda
  rationale: 'Katika swali la kulinganisha, kitenzi kisichotimilika kina nguvu ya uwezo: ni nani anayeweza kufanya hivyo.'
- source_word: כְמַעֲשֶׂיךָ
  choice: matendo kama yako
  rationale: Huhifadhi ulinganisho wa moja kwa moja wa matendo ya Mungu.
- source_word: וְכִגְבוּרֹתֶיךָ
  choice: na matendo ya uweza kama yako
  rationale: גבורות ni maonyesho au matendo ya nguvu; ‘matendo ya uweza’ huhifadhi tofauti yake na neno la kawaida ‘matendo’ lililotangulia.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu katika אֲדֹנָי יְהוִה
  choice: Ee Bwana Yahwe
  alternative: Ee Bwana MUNGU
  rationale: Maandishi ya Kiebrania yana cheo אֲדֹנָי pamoja na jina la agano יהוה. Kutumia ‘Yahwe’ kunalifanya jina hilo lionekane badala ya kulibadili kuwa cheo kingine, bila kuamua zaidi ya ushahidi wa maandishi.
- issue: Nguvu ya swali kuhusu ‘mungu gani’
  choice: Swali la balagha linalosisitiza kutolinganishwa kwa Yahwe
  alternative: Kauli ya moja kwa moja kwamba miungu mingine haipo
  rationale: Aya inauliza ni mungu gani awezaye kufanya matendo kama ya Yahwe; tafsiri inadumisha umbo hilo bila kuligeuza kuwa tamko linalotatua wazi suala la kuwapo kwa miungu mingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sala na swali la balagha umehifadhiwa; lugha imewekwa wazi kwa msomaji wa kawaida bila kuondoa urudiaji wa kishairi wa ‘matendo.’
