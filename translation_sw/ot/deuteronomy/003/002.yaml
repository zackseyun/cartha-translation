base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/002.yaml
  text: And Yahweh said to me, “Do not fear him, for I have given him, all his people, and his land into your hand; and you shall do to him just as you did to Sihon king of the Amorites, who lived in Heshbon.”
translation:
  language: sw
  text: Yahwe akaniambia, “Usimwogope, kwa maana nimemtia mikononi mwako, yeye, watu wake wote, na nchi yake. Utamtendea kama ulivyomtendea Sihoni, mfalme wa Waamori, aliyeishi Heshboni.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la agano la Mungu lililo katika maandishi ya Kiebrania, kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: אַל תִּירָא אֹתוֹ
  choice: Usimwogope
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya katazo hilo, huku kiwakilishi cha mtendwa kikimhusu Ogu katika muktadha.
- source_word: בְיָדְךָ נָתַתִּי אֹתוֹ
  choice: nimemtia mikononi mwako
  rationale: Nahau ya Kiswahili inaeleza kukabidhi mtu chini ya mamlaka ya mwingine na kuhifadhi taswira ya mkono ya Kiebrania; wingi wa kimazoea ‘mikononi’ unasikika kiasili zaidi katika Kiswahili.
- source_word: וְאֶת כָּל עַמּוֹ וְאֶת אַרְצוֹ
  choice: yeye pamoja na watu wake wote na nchi yake
  rationale: ‘Watu’ halibanwi kuwa jeshi pekee, na ‘nchi’ inawakilisha אֶרֶץ kwa upana wake wa kawaida.
- source_word: וְעָשִׂיתָ לּוֹ כַּאֲשֶׁר עָשִׂיתָ
  choice: Utamtendea kama ulivyomtendea
  rationale: Linahifadhi upana wa kitenzi עשה bila kuongeza kwa wazi tendo ambalo kifungu hiki hakilitaji moja kwa moja.
- source_word: לְסִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: Sihoni, mfalme wa Waamori
  rationale: Muundo wa ufafanuzi umehifadhiwa, na jina la kundi la watu limetolewa kwa wingi wa kawaida wa Kiswahili.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: aliyekuwa akiishi Heshboni
  rationale: Linawakilisha hali endelevu ya kitenzi-shirikishi ישב na pia linaonyesha kwamba makao hayo yalikuwa ya wakati uliotangulia katika simulizi.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la herufi nne la Mungu. ‘Yahwe’ hulihifadhi kama jina mahususi badala ya kulibadili kuwa cheo, bila kuingiza mapokeo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Sentensi zimewekwa wazi kwa msomaji wa kawaida huku taswira kuu ya Kiebrania na upana wa vitenzi vikihifadhiwa.
