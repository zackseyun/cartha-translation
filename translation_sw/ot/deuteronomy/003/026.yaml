  text: וַ/יִּתְעַבֵּ֨ר יְהוָ֥ה בִּ/י֙ לְמַ֣עַנְ/כֶ֔ם וְ/לֹ֥א שָׁמַ֖ע אֵלָ֑/י וַ/יֹּ֨אמֶר יְהוָ֤ה אֵלַ/י֙ רַב לָ֔/ךְ אַל תּ֗וֹסֶף דַּבֵּ֥ר אֵלַ֛/י ע֖וֹד בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/026.yaml
  text: But Yahweh was angry with me because of you and did not listen to me[a], and Yahweh said to me, “Enough from you[b]; do not speak to me again about this matter.”
translation:
  language: sw
  text: Lakini Yahweh alinikasirikia kwa sababu yenu[a], na hakunisikiliza. Yahweh akaniambia, “Imetosha![b] Usiseme nami tena kuhusu jambo hili.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili yenu” au “kwa upande wenu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “Yatosha kwako,” nahau ya kumkatisha mtu kwa ukali.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְעַבֵּר
  choice: alinikasirikia
  rationale: Katika nahau hii, hitpaeli ya עבר ikiwa Yahweh ndiye mtenda inaonyesha kumkasirikia mtu. ‘Alinikasirikia’ ni Kiswahili cha kawaida na kinaeleza wazi mhusika aliyelengwa na hasira.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetoholewa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: לְמַעַנְכֶם
  choice: kwa sababu yenu
  rationale: Katika muktadha huu, kirai kinaonyesha kwamba Musa anawahusisha watu na hasira ya Yahweh kwake. Tanbihi inahifadhi uwezekano wa maana ‘kwa ajili yenu’ au ‘kwa habari yenu.’
- source_word: וְלֹא שָׁמַע אֵלָי
  choice: wala hakunisikiliza
  rationale: שׁמע pamoja na אֶל hapa humaanisha kumsikiliza au kumkubalia mtu ombi; tafsiri hii ni ya kawaida na haidai kwamba Mungu hakusikia sauti ya Musa.
- source_word: רַב לָךְ
  choice: Yatosha kwako
  rationale: Hii inafuata kwa karibu nahau fupi ya Kiebrania, huku muktadha na alama ya mshangao vikionyesha ukali wa kumkatisha Musa.
- source_word: אַל תּוֹסֶף דַּבֵּר ... עוֹד
  choice: Usiseme nami tena
  rationale: Muundo wa יסף pamoja na עוֹד unakataza kurudia au kuendelea kusema kuhusu jambo hilo; ‘tena’ huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: בַּדָּבָר הַזֶּה
  choice: kuhusu jambo hili
  rationale: דבר hapa ni suala linalozungumziwa, yaani ombi la Musa, hivyo ‘jambo hili’ ni sahihi na ya kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano יְהוָה; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Sababu au kusudi katika לְמַעַנְכֶם
  choice: kwa sababu yenu
  alternative: kwa ajili yenu / kwa habari yenu
  rationale: Muktadha unaunga mkono uhusiano wa kisababishi, lakini kirai cha Kiebrania kinaweza pia kusemwa kwa namna isiyoamua kikamilifu kati ya sababu na kuwa kwa habari ya watu; tanbihi huhifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi ni wazi kwa msomaji wa kawaida, huku ‘Yatosha kwako’ ikihifadhi umbo na ukali wa nahau ya Kiebrania. Alama zote za tanbihi [a] na [b] zimo katika matini kuu.
