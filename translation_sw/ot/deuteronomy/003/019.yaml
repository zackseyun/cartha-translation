lexical_decisions:
- source_word: רַק
  choice: Lakini
  rationale: Katika muktadha huu neno linaweka hali ya pekee dhidi ya amri iliyotangulia. “Lakini” linaonyesha tofauti hiyo kwa Kiswahili cha kawaida; orodha inayofuata inaonyesha wazi ni nani pekee watakaobaki.
- source_word: נְשֵׁיכֶם
  choice: wake zenu
  rationale: Katika muktadha wa watu wa nyumbani wanaobaki, maana mahususi ni wake, si wanawake kwa ujumla.
- source_word: טַפְּכֶם
  choice: watoto wenu wadogo
  rationale: Neno la Kiebrania hurejelea watoto wadogo au wategemezi; uchaguzi huu unahifadhi taswira halisi ya kifamilia.
- source_word: מִקְנֵיכֶם / מִקְנֶה רַב
  choice: mifugo yenu / mifugo mingi
  rationale: מִקְנֶה ni wanyama wa kufugwa kwa upana, si ng’ombe pekee. Kurudia “mifugo” kunafuata urudiaji wa Kiebrania.
- source_word: יָדַעְתִּי כִּי
  choice: najua kwamba
  rationale: Kauli hii inatoa sababu ya mifugo kubaki na kuhifadhi madai ya nafsi ya kwanza kwa uwazi.
- source_word: יֵשְׁבוּ
  choice: watabaki
  rationale: Ingawa kitenzi kimsingi kinaweza kumaanisha kukaa au kuishi, hapa kinatofautisha wanaobaki nyuma na wanaovuka kwenda vitani.
- source_word: בְּעָרֵיכֶם
  choice: katika miji yenu
  rationale: עִיר linaweza kumaanisha mji wa ukubwa mbalimbali. “Miji” ni neno la kawaida na lenye heshima, huku tanbihi ikihifadhi uwezekano wa “makazi.”
- source_word: אֲשֶׁר נָתַתִּי לָכֶם
  choice: niliyowapa
  rationale: Muundo huu unaonyesha tendo lililokamilika la kuwapa miji hiyo na ni wa asili katika Kiswahili.
