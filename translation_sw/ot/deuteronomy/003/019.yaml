review_pass:
  verdict: revise
  source_fidelity: The draft conveys the household members and livestock remaining behind, the explanatory first-person clause, and the already-given towns accurately. However, רַק is principally exceptive/restrictive here (“only/except that”), not simply adversative “Lakini.”
  naturalness: The sentence is otherwise fluent Standard East African Swahili. “Isipokuwa” supplies the needed exception naturally in this command context. “Miji” idiomatically covers both towns and cities in Swahili, so a separate size-based alternative is not needed.
  terminology: “Wake zenu,” “watoto wenu wadogo,” “mifugo yenu,” and “watabaki” are appropriate and preserve the Hebrew’s household, livestock, and remain-behind senses. The lexical note on טַפְּכֶם must be anchored to “watoto wenu wadogo,” not “wake zenu.”
  issues:
  - severity: medium
    issue: The translation of רַק as “Lakini” weakens its restrictive/exceptive force.
    rationale: In context it introduces the exception to the preceding requirement that the fighting men cross over; “Isipokuwa” better represents this function without adding interpretation.
  - severity: medium
    issue: Footnote a is attached to “wake zenu” but discusses טַפְּכֶם (“watoto wenu wadogo”).
    rationale: The anchor must identify the term to which the lexical alternative pertains.
  - severity: low
    issue: Footnote b’s proposed alternative “makazi yenu” is less precise than the translated “miji yenu.”
    rationale: עָרִים denotes settlements/towns/cities; Kiswahili “miji” already accommodates that range, while “makazi” can suggest residences or dwelling places rather than towns.
  revised_text: Isipokuwa wake zenu, watoto wenu wadogo[a], na mifugo yenu—najua kwamba mna mifugo mingi—watabaki katika miji yenu niliyowapa.
  revised_footnotes:
  - marker: a
    text: Au “watoto wenu” au “wategemezi wenu.” Neno la Kiebrania hurejelea watoto wadogo au wategemezi.
    reason: lexical_alternative
