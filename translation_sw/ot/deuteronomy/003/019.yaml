  yaml_path: translation/ot/deuteronomy/003/019.yaml
  text: Only your wives[a], your little ones, and your livestock—I know that you have much livestock—shall remain in your towns that I have given you[b],
translation:
  language: sw
  text: Isipokuwa wake zenu, watoto wenu wadogo[a], na mifugo yenu—najua kwamba mna mifugo mingi—watabaki katika miji yenu niliyowapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watoto wenu” au “wategemezi wenu.” Neno la Kiebrania hurejelea watoto wadogo au wategemezi.
