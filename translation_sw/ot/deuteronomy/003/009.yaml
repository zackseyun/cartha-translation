  text: The Sidonians call Hermon Sirion[b][a], and the Amorites call it Senir—
translation:
  language: sw
  text: Wasidoni huuita Hermoni[a] Sirioni, nao Waamori[b] huiita Seniri—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mlima Hermoni”; hapa matini ya Kiebrania inasema tu “Hermoni.”
