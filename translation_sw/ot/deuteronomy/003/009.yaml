lexical_decisions:
- source_word: צִידֹנִים
  choice: Wasidoni
  rationale: Ni jina la watu wa Sidoni katika wingi; umbo la Kiswahili lenye kiambishi Wa- linaonyesha kundi la watu kwa kawaida.
- source_word: יִקְרְאוּ
  choice: huiita
  rationale: Kitenzi קרא pamoja na ל kina maana ya kutaja au kuita kwa jina. 'Huiita' ni Kiswahili cha kawaida na huonyesha desturi ya kulitumia jina hilo.
- source_word: לְחֶרְמוֹן
  choice: Hermoni
  rationale: Ni jina la mahali. Kihusishi ל hapa kinaonyesha kitu kinachopewa jina; neno 'Mlima' halijaandikwa wazi katika Kiebrania, kwa hiyo halijaongezwa katika matini kuu.
- source_word: שִׂרְיֹן
  choice: Sirioni
  rationale: Ni jina ambalo Wasidoni waliutumia kwa Hermoni; limetoholewa kwa tahajia inayosomeka kwa Kiswahili badala ya kutafsiriwa.
- source_word: וְהָאֱמֹרִי
  choice: nao Waamori
  rationale: Ingawa jina la Kiebrania lina umbo la umoja, limetumiwa kwa maana ya jamii nzima na linaambatana na kitenzi cha wingi. 'Nao Waamori' huonyesha ulinganifu na Wasidoni kwa Kiswahili cha asili.
- source_word: יִקְרְאוּ לוֹ
  choice: huiita
  rationale: Kiwakilishi kinarejelea Hermoni. Kiswahili hakihitaji kurudia kiwakilishi cha kitu baada ya 'huiita' kabla ya jina linalofuata.
- source_word: שְׂנִיר
  choice: Seniri
  rationale: Ni jina ambalo Waamori waliutumia kwa Hermoni; limetoholewa kama jina maalumu.
