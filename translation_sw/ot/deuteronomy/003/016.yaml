base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/016.yaml
  text: And to the Reubenites and to the Gadites I gave from Gilead as far as the Arnon Valley[a], the middle of the valley as a border, and as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: sw
  text: Niliwapa Wareubeni na Wagadi nchi kutoka Gileadi hadi Bonde la Arnoni[a], katikati ya bonde hilo ikiwa mpaka, na hadi Bonde la Yaboki, lililo mpaka wa Waamoni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza kumaanisha kijito, korongo la mto wa msimu, au bonde linalohusiana nacho. Hapa limetafsiriwa “bonde” kwa sababu sehemu inayofuata inasema kwamba katikati yake palikuwa mpaka.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi “wana wa Amoni,” usemi wa kindugu unaomaanisha watu wa Amoni, yaani Waamoni.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: Wareubeni na Wagadi
  rationale: Maumbo haya yanataja makundi ya kikabila yaliyopokea eneo, si mababu Reubeni na Gadi kama watu binafsi.
- source_word: נָתַתִּי
  choice: niliwapa
  rationale: Huhifadhi maana ya kawaida ya kitenzi נתן, ‘kutoa,’ huku kiambishi cha yambwa kikirejelea makundi mawili.
- source_word: מִן הַגִּלְעָד
  choice: eneo kutoka Gileadi
  rationale: מִן inaonyesha mwanzo wa eneo linaloelezwa; neno ‘eneo’ limewekwa wazi kutokana na muktadha wa ugawaji wa ardhi.
- source_word: עַד נַחַל אַרְנֹן
  choice: hadi Bonde la Arnoni
  rationale: נחל inaweza kumaanisha kijito, wadi, au bonde lake. ‘Bonde’ linafaa kwa sababu kishazi kinachofuata kinataja katikati yake kuwa mpaka.
- source_word: תּוֹךְ הַנַּחַל וּגְבֻל
  choice: katikati ya bonde hilo pakiwa mpaka
  rationale: Tafsiri hii inaonyesha kuwa mstari wa mpaka ulipitia katikati ya bonde bila kuongeza maelezo yasiyomo katika Kiebrania.
- source_word: עַד יַבֹּק הַנַּחַל
  choice: hadi Bonde la Yaboki
  rationale: ‘Bonde’ limetumiwa kwa uthabiti kwa נחל katika maelezo haya ya kijiografia.
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: mpaka wa Waamoni
  rationale: ‘Waamoni’ ni Kiswahili cha kawaida na cha asili kwa kundi la watu ambalo Kiebrania hulitaja kwa usemi wa kindugu ‘wana wa Amoni.’
