base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/027.yaml
  text: Go up to the top of Pisgah[a], and lift up your eyes westward and northward and southward and eastward, and see with your eyes[b]; for you shall not cross this Jordan.
translation:
  language: sw
  text: Panda juu ya kilele cha Pisga, uyainue macho yako kuelekea magharibi[a], kuelekea kaskazini, kuelekea kusini, na kuelekea mashariki; uone kwa macho yako, kwa maana hutavuka Yordani hii[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “kuelekea baharini,” njia ya kawaida ya kusema “kuelekea magharibi.”
    reason: cultural_note
  - marker: b
    text: Au, “Mto huu wa Yordani.” Kiebrania kinasema tu “Yordani hii.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה
  choice: Panda
  rationale: Ni amri ya kwenda juu. “Panda” ni ya kawaida na huhifadhi mwelekeo wa kwenda juu.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: mpaka kilele cha Pisga
  rationale: רֹאשׁ hapa ni sehemu ya juu au kilele, na הַפִּסְגָּה ni jina la mahali, Pisga. “Kilele cha Pisga” ni Kiswahili cha asili na kinachohifadhi maana ya kijiografia.
- source_word: וְשָׂא עֵינֶיךָ
  choice: uyainue macho yako
  rationale: Huhifadhi taswira ya nahau ya Kiebrania ya kuinua macho, yaani kuelekeza mtazamo, bila kuipunguza kuwa “tazama” tu.
- source_word: יָמָּה
  choice: kuelekea magharibi
  rationale: Neno hilo kihalisi linaelekeza upande wa bahari, lakini katika mfumo wa mielekeo wa Kiebrania humaanisha magharibi. Tafsiri hii huwasilisha mwelekeo unaokusudiwa.
- source_word: וְצָפֹנָה
  choice: kaskazini
  rationale: Ni umbo la kimwelekeo lenye maana ya kuelekea kaskazini; linaendana vizuri na orodha ya pande nne.
- source_word: וְתֵימָנָה
  choice: kusini
  rationale: Katika muktadha huu ni mwelekeo wa kusini, si jina la eneo la Temani.
- source_word: וּמִזְרָחָה
  choice: mashariki
  rationale: Ni umbo la kimwelekeo kutoka neno linalohusiana na kuchomoza kwa jua, hapa likimaanisha mashariki.
- source_word: וּרְאֵה בְעֵינֶיךָ
  choice: uone kwa macho yako mwenyewe
  rationale: Huhifadhi kurudiwa kwa “macho” na msisitizo wa kwamba Musa ataiona nchi yeye mwenyewe, ingawa hataivuka Yordani.
- source_word: כִּי לֹא תַעֲבֹר
  choice: kwa maana hutavuka
  rationale: כִּי inatoa sababu ya amri iliyotangulia, na עבר kuhusiana na Yordani humaanisha kuvuka.
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: Yordani hii
  rationale: Huhifadhi kiashiria הַזֶּה (“hii”) na matumizi mafupi ya Kiebrania yanayotaja Yordani bila kuongeza neno “Mto” katika matini kuu.
