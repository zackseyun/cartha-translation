base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/001.yaml
  text: Then we turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet us, he and all his people, for battle at Edrei.
translation:
  language: sw
  text: Kisha tukageuka, tukapanda kwa njia ya Bashani[a]. Naye Ogu, mfalme wa Bashani, akatoka kutulaki, yeye na watu wake wote, kwa vita huko Edrei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika barabara inayoelekea Bashani.” Nahau ya Kiebrania, kwa maana halisi, ni “njia ya Bashani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: Kisha tukageuka
  rationale: Kitenzi פנה katika mfuatano wa simulizi humaanisha kugeuka; “kisha” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: וַנַּעַל
  choice: tukapanda
  rationale: עלה huhifadhi wazo la kwenda juu au kupanda, ambalo linafaa kubaki badala ya neno la jumla “tukaenda.”
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: kwa njia ya Bashani
  rationale: Tafsiri hii inahifadhi nahau ya Kiebrania bila kuamua kimya kimya kama njia hiyo iliingia Bashani, ilipitia Bashani, au ilielekea Bashani.
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: יצא ni “kutoka”; muktadha wa vita unaeleza kusudi bila kulazimisha nyongeza kama “akapiga mwendo.”
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Ogu, mfalme wa Bashani
  rationale: Jina limetoholewa kwa umbo linalotambulika katika Kiswahili, na mnyororo wa nomino umetafsiriwa kwa maelezo ya cheo.
- source_word: לִקְרָאתֵנוּ
  choice: kutulaki
  rationale: לקראתנו ni kwenda kukutana nasi; “kutulaki” huhifadhi maana hiyo, huku kishazi kinachofuata kikibainisha kuwa mkutano ulikuwa wa vita.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: pamoja na watu wake wote
  rationale: עם ni “watu,” si lazima “jeshi”; tafsiri haibani maana zaidi ya Kiebrania.
- source_word: לַמִּלְחָמָה
  choice: ili kupigana nasi
  rationale: Katika tukio hili maalumu, מלחמה hueleza kusudi la mapambano; Kiswahili hiki ni cha asili na huweka wazi uhusiano wa kisintaksia.
- source_word: אֶדְרֶעִי
  choice: huko Edrei
  rationale: Jina la mahali limetoholewa, na kihusishi cha mahali kimeongezwa kwa Kiswahili ili kuonyesha matumizi yake ya kielezi mwishoni mwa sentensi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi lakini kinachoeleweka kwa msomaji wa kawaida. “Kutulaki” ni neno sanifu na fasaha; “ili kupigana nasi” huepuka usemi mzito wa “kwa vita.”
