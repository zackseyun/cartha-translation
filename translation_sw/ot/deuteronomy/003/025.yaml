base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/025.yaml
  text: Please let me cross over and see the good land that is beyond the Jordan[a], this good hill country and Lebanon.
translation:
  language: sw
  text: Tafadhali, niruhusu nivuke nione nchi nzuri iliyo ng'ambo ya Yordani, eneo hili zuri la milima[a] na Lebanoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlima huu mzuri.” Neno la Kiebrania linaweza kumaanisha mlima fulani au eneo la milima lililo magharibi ya Yordani.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: niruhusu nivuke
  rationale: Kitenzi cha cohortative katika nafsi ya kwanza kinaonyesha ombi au shauku ya Musa, si wakati ujao wa kawaida. ‘Niruhusu nivuke’ ni ombi la kawaida na lenye heshima katika Kiswahili.
- source_word: נָּא
  choice: tafadhali
  rationale: Chembe hii hulainisha ombi na kuonyesha kusihi; ‘tafadhali’ huhifadhi sauti hiyo kwa Kiswahili cha sasa.
- source_word: וְאֶרְאֶה
  choice: na kuiona
  rationale: Cohortative ya pili inaunganishwa na ombi la kwanza na kueleza kusudi la kuvuka. ‘Na kuiona’ ni ya asili katika Kiswahili na inaendeleza kitu ‘nchi nzuri.’
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: nchi nzuri
  rationale: Katika muktadha huu אֶרֶץ ni eneo la nchi; ‘nchi nzuri’ huhifadhi msamiati mkuu wa Kumbukumbu la Torati kuhusu nchi iliyoahidiwa bila kuongeza ufafanuzi wa kiteolojia.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: iliyo ng’ambo ya Yordani
  rationale: Kirai kinaonyesha eneo la upande mwingine wa Mto Yordani kwa mtazamo wa Musa akiwa mashariki. ‘Ng’ambo ya Yordani’ ni fasaha na huhifadhi mtazamo huo.
- source_word: הָהָר הַטּוֹב הַזֶּה
  choice: eneo hili zuri la milima
  rationale: Nomino הָר inaweza kumaanisha mlima mmoja au kwa maana ya pamoja eneo la milima. Muktadha wa maelezo ya nchi unaunga mkono maana ya kieneo, huku tanbihi ikihifadhi uwezekano wa mlima mmoja.
- source_word: וְהַלְּבָנוֹן
  choice: na Lebanoni
  rationale: Jina la mahali limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
theological_decisions:
- issue: 'Maana ya kijiografia ya הָהָר: mlima mmoja au eneo la milima'
  choice: eneo hili zuri la milima
  alternative: mlima huu mzuri
  rationale: Umoja wa Kiebrania unaweza kutumiwa kwa maana ya pamoja kuhusu nchi ya milima. Katika maelezo haya ya nchi pamoja na Lebanoni, maana ya kieneo inaelekea zaidi; hata hivyo, tanbihi inalinda utata halisi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. ‘Tafadhali niruhusu’ huhifadhi sauti ya kusihi; ‘eneo la milima’ huepuka usemi usio wa kawaida na tanbihi huhifadhi maana mbadala ya umoja.
