  text: וְ/אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את יָרַ֖שְׁנוּ בָּ/עֵ֣ת הַ/הִ֑וא מֵ/עֲרֹעֵ֞ר אֲשֶׁר עַל נַ֣חַל אַרְנֹ֗ן וַ/חֲצִ֤י הַֽר הַ/גִּלְעָד֙ וְ/עָרָ֔י/ו נָתַ֕תִּי לָ/רֻֽאוּבֵנִ֖י וְ/לַ/גָּדִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/012.yaml
  text: And we took possession of this land at that time[a], from Aroer, which is on the Valley of the Arnon, and half the hill country of Gilead with its cities[b]; I gave it to the Reubenites and the Gadites.
translation:
  language: sw
  text: Wakati huo tuliitwaa nchi hii, kuanzia Aroeri, ulioko kando ya bonde la Arnoni[a], pamoja na nusu ya nchi ya milima ya Gileadi[b] na miji yake; niliwapa Wareubeni na Wagadi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Korongo la Arnoni.” Neno la Kiebrania נחל linaweza kumaanisha bonde, korongo, au mkondo wa maji ambao huenda ukawa wa msimu.
    reason: lexical_alternative
  - marker: b
    text: Au, “nusu ya Mlima Gileadi.” Hapa “nchi ya milima ya Gileadi” imechaguliwa kwa sababu neno la Kiebrania הַר linaweza kumaanisha eneo la milima katika maelezo ya mipaka ya nchi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַשְׁנוּ
  choice: tuliitwaa
  rationale: Katika muktadha wa ushindi na ugawaji wa ardhi, kitenzi hiki kinaonyesha kuitwaa ardhi na kuimiliki, si kuirithi tu bila hatua ya kuipata.
- source_word: הָאָרֶץ הַזֹּאת
  choice: nchi hii
  rationale: “Nchi” ni neno la kawaida na lenye heshima kwa eneo lililotwaliwa hapa.
- source_word: בָּעֵת הַהִוא
  choice: wakati huo
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya usemi wa wakati.
- source_word: מֵעֲרֹעֵר אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: kuanzia Aroeri, ulioko kando ya Bonde la Arnoni
  rationale: Jina la mahali limetoholewa kuwa “Aroeri”; עַל katika maelezo haya ya kijiografia linaweza kumaanisha kuwa kando ya eneo hilo, na kishazi tegemezi kimehifadhiwa.
- source_word: נַחַל
  choice: Bonde
  rationale: Neno hili linaweza kutaja bonde au korongo lenye mkondo wa maji, mara nyingi wa msimu. “Bonde” linaeleweka kwa urahisi huku ufafanuzi mbadala ukitolewa katika tanbihi.
- source_word: וַחֲצִי הַר הַגִּלְעָד
  choice: pamoja na nusu ya nchi ya milima ya Gileadi
  rationale: הַר linaweza kumaanisha eneo la milima, wala si lazima mlima mmoja. Muktadha wa eneo lenye miji unaunga mkono maana ya nchi ya milima.
- source_word: וְעָרָיו
  choice: na miji yake
  rationale: Kiwakilishi kinarejelea eneo la Gileadi lililotajwa, na muundo huu huhifadhi uratibu wa Kiebrania kwa lugha ya asili ya Kiswahili.
- source_word: נָתַתִּי
  choice: niliwapa
  rationale: Mabadiliko kutoka wingi “tuliitwaa” kwenda umoja “niliwapa” yamehifadhiwa. Kiambishi “-wa-” kinarejelea Wareubeni na Wagadi, huku kitu kinachoeleweka kuwa nchi hiyo kikiachwa bila kurudiwa.
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: Wareubeni na Wagadi
  rationale: Ingawa maumbo ya Kiebrania ni ya kivumishi cha nasaba katika umoja, hapa yanatumika kwa maana ya pamoja kuhusu makundi ya makabila hayo.
theological_decisions: []
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. Majina Aroer, Arnon, Gilead, Reuben na Gad yametoholewa kwa maumbo yaliyozoeleka katika Kiswahili: Aroeri, Arnoni, Gileadi, Wareubeni na Wagadi. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.'
