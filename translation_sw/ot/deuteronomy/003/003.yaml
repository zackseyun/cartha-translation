base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/003.yaml
  text: So Yahweh our God also gave into our hand Og king of Bashan[a], and all his people, and we struck him down until he had no survivor left.
translation:
  language: sw
  text: Basi Yahwe Mungu wetu akamtia mikononi mwetu pia Ogu, mfalme wa Bashani, pamoja na watu wake wote. Tukampiga mpaka asibakiwe na manusura yeyote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “mpaka hakuachwa kwake manusura yeyote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo kama “BWANA”.
- source_word: וַיִּתֵּן ... בְּיָדֵנוּ
  choice: akamtia mikononi mwetu
  rationale: Huhifadhi taswira ya Kiebrania ya kumweka adui katika mkono wa mshindi, huku wingi “mikononi” ukisomeka kwa kawaida katika Kiswahili.
- source_word: גַּם
  choice: pia
  rationale: Huonyesha kwamba ushindi dhidi ya Ogu unaongezwa kwa ushindi uliotangulia dhidi ya Sihoni.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Ogu, mfalme wa Bashani
  rationale: Majina yamewasilishwa kwa maumbo yanayotamkika kwa kawaida katika Kiswahili, na cheo cha kifalme kimehifadhiwa.
- source_word: כָּל עַמּוֹ
  choice: watu wake wote
  rationale: עַם ni neno pana la “watu”; halijafinywa kuwa “jeshi” ingawa muktadha ni wa vita.
- source_word: וַנַּכֵּהוּ
  choice: Tukamwangamiza
  rationale: Katika muktadha wa vita na kutobaki kwa manusura, נכה ina nguvu kuliko “kumpiga” tu. Umoja wa kiwakilishi umehifadhiwa, ukimrejelea Ogu kama mkuu wa watu wake.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: mpaka hakubaki kwake hata mtu mmoja aliyenusurika
  rationale: Huwasilisha uangamizi kamili na pia huhifadhi kwa kiasi kikubwa muundo wenye לוֹ, “kwake,” bila kuufanya mstari usomeke kwa shida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Kutumia jina binafsi kunafuata maandishi ya Kiebrania na huepuka kulibadilisha kimya kuwa cheo.
- issue: Ukamilifu wa lugha ya kushindwa na kuangamizwa
  choice: mpaka hakubaki kwake hata mtu mmoja aliyenusurika
  alternative: mpaka hakumwacha manusura hata mmoja
  rationale: Tafsiri inadumisha ukali wa taarifa ya Kiebrania bila kuongeza maelezo ya kitheolojia au kupunguza maana ya kutobaki kwa manusura.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Basi” huunganisha aya na simulizi iliyotangulia; sentensi mbili zinatunza mwendo wa masimulizi bila kubadili uhusiano wa matukio.
