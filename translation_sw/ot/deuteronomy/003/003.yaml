  naturalness: “Asibakiwe na manusura yeyote” ni Kiswahili Sanifu cha asili na kinaweka wazi kwamba Ogu hakuwa na manusura aliyebaki. Matumizi ya “Basi,” “Yahwe,” “Ogu,” na “Bashani” yanaendana na rejesta ya simulizi la kibiblia katika Kiswahili cha Afrika Mashariki.
  terminology: “Yahwe” huhifadhi jina binafsi la יהוה; “Ogu” na “Bashani” ni maumbo ya Kiswahili yanayotambulika. “Manusura” ni istilahi sahihi kwa שָׂרִיד katika muktadha huu.
