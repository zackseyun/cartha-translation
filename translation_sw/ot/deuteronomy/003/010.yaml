  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Orodha ya maeneo na urudiaji wa “yote” vimehifadhiwa ili kuakisi muundo wa Kiebrania; kiunganishi hakijaongezwa kabla ya “miji ya ufalme” kwa kuwa kifungu hicho kinafafanua Saleka na Edrei kwa mtindo wa apposition.
