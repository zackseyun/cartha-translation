base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/010.yaml
  text: all the cities of the tableland[a], and all Gilead, and all Bashan, as far as Salecah and Edrei[b], the cities of the kingdom of Og in Bashan.
translation:
  language: sw
  text: miji yote ya uwanda wa juu[a], na Gileadi yote, na Bashani yote, mpaka Saleka na Edrei[b], miji ya ufalme wa Ogu katika Bashani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nchi tambarare” au “nyanda za juu.” Neno la Kiebrania hapa linamaanisha eneo tambarare lililoinuka mashariki mwa Yordani.
    reason: lexical_alternative
  - marker: b
    text: Jina Saleka linaweza pia kuandikwa “Salka.”
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּל
  choice: yote
  rationale: Kihesabu hiki kinaonyesha ukamilifu wa miji na maeneo yaliyotajwa; “yote” ni ya kawaida na wazi katika Kiswahili.
- source_word: עָרֵי
  choice: miji
  rationale: Neno עִיר katika orodha ya maeneo ya kifalme linafaa kutafsiriwa “miji” kuliko “vijiji.”
- source_word: הַמִּישֹׁר
  choice: uwanda wa juu
  rationale: Hapa neno hilo linamaanisha eneo tambarare lililoinuka mashariki mwa Yordani; “uwanda wa juu” linaonyesha sura hiyo ya kijiografia vizuri kuliko “tambarare” peke yake.
- source_word: הַגִּלְעָד
  choice: Gileadi
  rationale: Jina la mahali limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: הַבָּשָׁן
  choice: Bashani
  rationale: Jina la eneo limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: עַד
  choice: mpaka
  rationale: Katika muktadha huu linaonyesha mwisho au upeo wa eneo la kijiografia.
- source_word: סַלְכָה
  choice: Saleka
  rationale: Hili ni umbo la jina linalosomeka kwa urahisi na lililozoeleka katika mapokeo ya Biblia ya Kiswahili; umbo la karibu zaidi na uhawilishaji wa moja kwa moja limetajwa katika tanbihi.
- source_word: אֶדְרֶעִי
  choice: Edrei
  rationale: Jina la mahali limehawilishwa kwa umbo linalotambulika katika Kiswahili.
- source_word: עָרֵי מַמְלֶכֶת
  choice: miji ya ufalme
  rationale: Muundo huu unaonyesha miji iliyokuwa sehemu ya ufalme; tafsiri hii ni wazi na inafuata kwa karibu uhusiano wa maneno ya Kiebrania.
- source_word: עוֹג
  choice: Ogu
  rationale: Jina la mtu limetoholewa kwa umbo la Kiswahili linalosomeka kwa kawaida.
- source_word: בַּבָּשָׁן
  choice: katika Bashani
  rationale: Kihusishi ב hapa kinaonyesha mahali ambapo ufalme wa Ogu ulikuwapo.
