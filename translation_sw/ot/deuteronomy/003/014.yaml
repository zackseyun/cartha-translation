base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/014.yaml
  text: Jair son of Manasseh took all the region of Argob[a], as far as the border of the Geshurites and the Maacathites, and he called them, that is, Bashan, Havvoth-jair[b], to this day.
translation:
  language: sw
  text: Yairi mwana wa Manase alitwaa eneo lote la Argobu, hadi kwenye mpaka wa Wageshuri na Wamaaka, naye akayaita kwa jina lake mwenyewe, yaani Bashani, Havvoth-Yairi[a][b], hata leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi na muundo wa maneno: “naye akayaita kwa jina lake mwenyewe, Bashani, Havvoth-Yairi.” Muundo wa Kiebrania umebanwa na unaweza kueleweka kwa njia tofauti kidogo.'
    reason: alternative_reading
  - marker: b
    text: Huenda Havvoth-Yairi likamaanisha “vijiji vya Yairi” au “makazi ya mahema ya Yairi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבֶל
  choice: eneo
  rationale: Katika muktadha huu wa kijiografia, neno hili linaonyesha sehemu maalumu ya nchi. “Eneo” ni Kiswahili cha kawaida na huwasilisha maana hiyo bila kuwa neno la kitaalamu kupita kiasi.
- source_word: אַרְגֹּב
  choice: Argobu
  rationale: Ni jina maalumu la mahali; limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili.
- source_word: עַד גְּבוּל הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: hadi kwenye mpaka wa Wageshuri na Wamaaka
  rationale: גְּבוּל hapa ni mpaka; majina ya watu yametafsiriwa kwa mfumo wa Kiswahili wa majina ya makundi ya watu.
- source_word: וַיִּקְרָא אֹתָם
  choice: naye akayaita
  rationale: Kiambishi cha yambwa katika Kiebrania ni cha wingi, kwa hiyo wingi umehifadhiwa badala ya kulainishwa kuwa umoja.
- source_word: עַל שְׁמוֹ
  choice: kwa jina lake mwenyewe
  rationale: Nahau hii inaonyesha kwamba Yairi aliyapa jina linalotokana na jina lake mwenyewe.
- source_word: אֶת הַבָּשָׁן
  choice: yaani Bashani
  rationale: Muundo wa Kiebrania umebanwa na si wazi kabisa. “Yaani” huonyesha uwezekano wa Bashani kutaja eneo linalozungumziwa bila kudai kwamba huu ndio uchambuzi pekee.
- source_word: חַוֺּת יָאִיר
  choice: Hawoth-Yairi
  rationale: Ni jina la mahali, hivyo limetoholewa katika matini kuu. Maana zinazowezekana za nomino ya kwanza zimewekwa katika tanbihi.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hata leo
  rationale: Hii ni nahau ya kawaida ya Kiswahili inayoonyesha kwamba jina hilo liliendelea kutumiwa mpaka wakati wa msimulizi.
