lexical_decisions:
- source_word: וַנֵּשֶׁב
  choice: Basi tukakaa
  rationale: Kitenzi ישׁב katika mfuatano wa masimulizi kinaeleza tendo la wakati uliopita. “Tukakaa” ni Kiswahili cha kawaida kinachoweza kumaanisha kukaa au kubaki mahali bila kuongeza muda usiotajwa; “Basi” linaonyesha mwendelezo wa simulizi.
- source_word: בַּגָּיְא
  choice: katika bonde
  rationale: גַּיְא huweza kumaanisha bonde, korongo, au njia ya chini kati ya miinuko. “Bonde” ni neno pana na la kawaida lisilobainisha kupita kiasi umbo la ardhi.
- source_word: מוּל
  choice: lililoelekea
  rationale: מוּל huonyesha mahali panapokabiliana au kuelekeana na mahali pengine. “Lililoelekea” ni la asili kwa Kiswahili na linahifadhi maana ya anga bila kulazimisha wazo la kuwa ng’ambo moja kwa moja.
- source_word: בֵּית פְּעוֹר
  choice: Beth-peori
  rationale: Hili ni jina la mahali, kwa hiyo limetoholewa badala ya kutafsiriwa kuwa “nyumba ya Peori.” Umbo “Beth-peori” linafuata matumizi yanayoeleweka katika majina ya Biblia ya Kiswahili.
