  text: So we stayed in the valley opposite Beth-peor[a].
translation:
  language: sw
  text: Basi tukakaa katika bonde lililokuwa mkabala wa Beth-peori.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nasi tukakaa katika bonde lililokabiliana na Beth-peori.”
