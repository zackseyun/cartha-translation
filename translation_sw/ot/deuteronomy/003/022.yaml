  yaml_path: translation/ot/deuteronomy/003/022.yaml
  text: Do not fear them[a], for Yahweh your God is the one who fights for you.
translation:
  language: sw
  text: Msiwaogope[a], kwa maana Yahweh, Mungu wenu, ndiye anayewapigania.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Msiwe na hofu kwa sababu yao.”
    reason: Njia nyingine ya kutafsiri ירא kwa Kiswahili, ikihifadhi maana ya kuogopa.
lexical_decisions:
- source_word: לֹא
  choice: Msi-
  rationale: Kiambishi cha ukanushi pamoja na hali ya kutegemea katika Kiswahili huwasilisha katazo linaloelekezwa kwa watu wengi.
- source_word: תִּירָאוּם
  choice: waogope
  rationale: Kitenzi ירא chenye kiambishi cha nafsi ya tatu wingi humaanisha ‘kuwaogopa’; umbo hili ni la kawaida na la moja kwa moja katika Kiswahili.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inatanguliza sababu ya katazo; ‘kwa maana’ huhifadhi uhusiano huo wa maelezo kwa lugha yenye hadhi na inayoeleweka.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limeandikwa kwa unukuzi ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: אֱלֹהִים hapa humrejelea Mungu wa Israeli katika umoja, na kiambishi kinaonyesha nafsi ya pili wingi.
- source_word: הוּא
  choice: ndiye
  rationale: Kiwakilishi huru הוּא kina mkazo; ‘ndiye’ huonyesha kwa kawaida kwamba Yahweh mwenyewe ndiye mtendaji.
- source_word: הַנִּלְחָם
  choice: anayewapigania
  rationale: Kivumishi-tendo cha לחם huonyesha kitendo cha kupigana; katika Kiswahili, ‘anayewapigania’ pamoja na kiambishi cha yule anayenufaika huwasilisha vizuri maana ya muundo mzima.
- source_word: לָכֶם
  choice: -wa- katika ‘anayewapigania’
  rationale: לָכֶם huonyesha kwamba kitendo kinafanywa kwa manufaa yao; Kiswahili cha kawaida huunganisha maana hii ndani ya kitenzi ‘kuwapigania’.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; ‘Yahweh’ huhifadhi jina hilo bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Msiwaogope’ ni fupi na ya kawaida; ‘ndiye anayewapigania’ huhifadhi mkazo wa הוּא na maana kwamba Yahweh anatenda kwa niaba yao.
