  text: וָ/אֲצַ֣ו אֶתְ/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר יְהוָ֣ה אֱלֹהֵי/כֶ֗ם נָתַ֨ן לָ/כֶ֜ם אֶת הָ/אָ֤רֶץ הַ/זֹּאת֙ לְ/רִשְׁתָּ֔/הּ חֲלוּצִ֣ים תַּֽעַבְר֗וּ לִ/פְנֵ֛י אֲחֵי/כֶ֥ם בְּנֵֽי יִשְׂרָאֵ֖ל כָּל בְּנֵי חָֽיִל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/018.yaml
  text: And I commanded you at that time[a], saying, ‘Yahweh your God has given you this land to possess. You shall cross over armed before your brothers[c][b], the sons of Israel—all the men of valor.’
translation:
  language: sw
  text: 'Nami wakati huo niliwaamuru hivi: “Yahwe, Mungu wenu, amewapa nchi hii ili muimiliki. Mtavuka mbele ya ndugu zenu[a], wana wa Israeli, mkiwa mmejihami[b]—ninyi nyote wanaume wenye uwezo wa kupigana.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli wenzenu.” Kiebrania husema, “ndugu zenu, wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “mkiwa mmeandaliwa kwa vita.”
    reason: lexical_alternative
  - marker: c
    text: “Wanaume wenye uwezo wa kupigana” hapa humaanisha wanaume wanaostahili au walio tayari kwa huduma ya kijeshi, si watu wenye ujasiri wa moyoni tu.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֲצַו אֶתְכֶם
  choice: niliwaamuru
  rationale: Kitenzi צוה kina maana ya kutoa amri; “niliwaamuru” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: בָּעֵת הַהִוא
  choice: wakati huo
  rationale: Ni usemi wa kawaida wa wakati unaohifadhi mazingira ya simulizi.
- source_word: לֵאמֹר
  choice: hivi
  rationale: Katika Kiswahili, “niliwaamuru hivi” hutambulisha maneno yanayofuata kwa ufasaha kuliko kunakili kihalisi “nikisema.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: נָתַן לָכֶם
  choice: amewapa
  rationale: Kauli timilifu inaonyesha tendo lililokamilika ambalo matokeo yake bado yana umuhimu kwa wasikilizaji.
- source_word: הָאָרֶץ הַזֹּאת לְרִשְׁתָּהּ
  choice: nchi hii ili muimiliki
  rationale: ירשׁ hapa ni kuichukua na kuishikilia nchi kuwa milki; muundo huu unahifadhi kusudi la zawadi hiyo bila kudokeza urithi wa kupokelewa bila hatua.
- source_word: חֲלוּצִים
  choice: mkiwa mmejihami
  rationale: Neno hili linaonyesha kuwa wameandaliwa na silaha kwa ajili ya mapigano; “mmejihami” ni la sasa, wazi, na la kijeshi.
- source_word: תַּעַבְרוּ לִפְנֵי
  choice: Mtavuka mbele ya
  rationale: Wakati ujao katika muktadha wa amri una nguvu ya lazima, na לִפְנֵי inaonyesha kwenda mbele ya wengine katika mwendo wa kijeshi.
- source_word: אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: ndugu zenu, wana wa Israeli
  rationale: Tafsiri hii inahifadhi lugha ya kifamilia na maelezo ya Kiebrania badala ya kuyeyusha kuwa “Waisraeli wenzenu.”
- source_word: כָּל בְּנֵי חָיִל
  choice: ninyi nyote mlio mashujaa wa vita
  rationale: Katika muktadha huu msemo unawahusu wanaume wenye uwezo wa kupigana, si watu wenye ujasiri wa moyoni tu. “Wa vita” huweka maana hiyo wazi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. “Yahwe” huhifadhi jina hilo kwa namna inayotambulika katika Kiswahili.
- issue: Lugha ya kijinsia katika אֲחֵיכֶם / בְּנֵי יִשְׂרָאֵל / בְּנֵי חָיִל
  choice: ndugu zenu, wana wa Israeli ... mashujaa wa vita
  alternative: Waisraeli wenzenu ... wapiganaji
  rationale: Muktadha ni wa kikosi cha kijeshi, na Kiebrania kimetumia maneno ya kiume. Tafsiri kuu inahifadhi umbo hilo huku tanbihi ikieleza maana ya kimuktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo “niliwaamuru hivi” na “ili muimiliki” ni wa asili katika Kiswahili. Mpangilio wa tanbihi umesahihishwa ili kila alama ifuate neno linaloelezwa.
