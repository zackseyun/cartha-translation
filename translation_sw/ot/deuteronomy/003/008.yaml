source:
  edition: WLC
  text: וַ/נִּקַּ֞ח בָּ/עֵ֤ת הַ/הִוא֙ אֶת הָ/אָ֔רֶץ מִ/יַּ֗ד שְׁנֵי֙ מַלְכֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן מִ/נַּ֥חַל אַרְנֹ֖ן עַד הַ֥ר חֶרְמֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/008.yaml
  text: And at that time we took the land from the hand of the two kings of the Amorites who were beyond the Jordan[a], from the Wadi Arnon as far as Mount Hermon.
translation:
  language: sw
  text: Wakati huo tukaitwaa nchi kutoka mikononi mwa wale wafalme wawili wa Waamori waliokuwa ng’ambo ya Yordani, kuanzia Bonde la Arnoni[a] hadi Mlima Hermoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Korongo la Arnoni” au “Mto Arnoni.” Neno la Kiebrania נחל linaweza kumaanisha bonde au korongo lenye mkondo wa maji, kitanda cha kijito, au mto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּקַּח
  choice: tukaitwaa
  rationale: Kitenzi לקח hapa kinasimulia kuchukuliwa kwa eneo na Israeli. “Tukaitwaa” ni lugha ya kawaida yenye hadhi na haiongezi kwa lazima wazo la mapigano kama “tukaiteka.”
- source_word: בָּעֵת הַהִוא
  choice: Wakati huo
  rationale: Ni usemi wa kawaida wa wakati unaorejelea kipindi kilichotangulia katika simulizi.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: אֶרֶץ hapa ni eneo maalumu lililotwaliwa kutoka kwa wafalme wa Waamori; “nchi” ni ya asili na wazi katika Kiswahili cha kawaida.
- source_word: מִיַּד
  choice: kutoka mikononi mwa
  rationale: Inahifadhi taswira ya Kiebrania ya kuchukua kutoka chini ya umiliki au mamlaka ya mtu, huku ikiwa nahau inayoeleweka kwa Kiswahili.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: wale wafalme wawili wa Waamori
  rationale: Inafuata muundo wa Kiebrania na kutambulisha wazi wafalme wawili waliotajwa katika muktadha.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: waliokuwa ng’ambo ya Yordani
  rationale: “Ng’ambo ya Yordani” ni usemi mfupi na wa kawaida wa kijiografia unaohifadhi mtazamo wa mahali wa matini.
- source_word: מִנַּחַל אַרְנֹן
  choice: kuanzia Bonde la Arnoni
  rationale: נחל inaweza kumaanisha bonde, korongo lenye kijito, au mkondo wa maji. “Bonde la Arnoni” linaeleweka kwa urahisi bila kulazimisha maana ya mto wenye maji daima; tanbihi inahifadhi uwezekano mwingine.
- source_word: עַד הַר חֶרְמוֹן
  choice: hadi Mlima Hermoni
  rationale: עַד inaonyesha mwisho wa eneo linaloelezwa; “hadi” huwasilisha mpaka huo kwa ufupi na kwa kawaida.
theological_decisions: []
