  text: And to Machir I gave Gilead[a].
translation:
  language: sw
  text: Nami nikampa Makiri Gileadi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina “ile Gileadi,” pamoja na kibainishi; katika Kiswahili jina hili la mahali kwa kawaida hutajwa tu kuwa “Gileadi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מָכִיר
  choice: Nami ... Makiri
  rationale: Kiunganishi וּ kinaendeleza simulizi la ugawaji, na לְ humtambulisha mpokeaji. Muundo wa Kiswahili ‘Nami nikampa Makiri’ ni wa kawaida zaidi kuliko tafsiri ngumu ya neno kwa neno ‘Na kwa Makiri nilitoa.’ Jina מָכִיר limetoholewa kuwa ‘Makiri.’
- source_word: נָתַתִּי
  choice: nikampa
  rationale: Kitenzi cha Qal perfect nafsi ya kwanza umoja cha נתן hapa kinaeleza tendo la zamani la kumpa mtu eneo. ‘Nikampa’ huwasilisha kwa uwazi mtoaji, mpokeaji, na kitu kilichotolewa.
- source_word: אֶת
  choice: '[alama ya yambwa haitafsiriwi moja kwa moja]'
  rationale: Kihisishi hiki huonyesha yambwa mahsusi katika Kiebrania na hakihitaji neno linalolingana nacho katika Kiswahili.
- source_word: הַ/גִּלְעָד
  choice: Gileadi
  rationale: Hili ni jina la mahali linalotoholewa kwa namna iliyozoeleka katika Kiswahili. Ingawa Kiebrania lina kibainishi הַ (‘ile’), Kiswahili kwa kawaida hakitumii kibainishi hicho mbele ya jina hili la mahali.
theological_decisions: []
