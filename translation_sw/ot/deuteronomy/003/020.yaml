source:
  edition: WLC
  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔ם אֶת הָ/אָ֕רֶץ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֵי/כֶ֛ם נֹתֵ֥ן לָ/הֶ֖ם בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן וְ/שַׁבְתֶּ֗ם אִ֚ישׁ לִֽ/ירֻשָּׁת֔/וֹ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/020.yaml
  text: until Yahweh gives rest to your brothers as to you[a], and they also take possession of the land that Yahweh your God is giving them beyond the Jordan[c][b]. Then each of you may return to his possession that I have given you.
translation:
  language: sw
  text: mpaka Yahwe awape ndugu zenu[a] pumziko kama alivyowapa ninyi, nao pia waimiliki nchi ambayo Yahwe Mungu wenu anawapa ng’ambo ya Yordani.[b] Kisha mtarudi, kila mmoja katika urithi wake[c] ambao nimewapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli wenzenu.” Kiebrania kinasema “ndugu zenu,” kwa kutumia neno la udugu wa kiume kwa watu wenzao wa Israeli.
    reason: lexical_alternative
  - marker: b
    text: Au, “upande mwingine wa Yordani.” Usemi huu unategemea mahali alipo msemaji, mashariki mwa mto.
    reason: lexical_alternative
  - marker: c
    text: Au, “sehemu yake ya urithi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָנִיחַ
  choice: awape ... pumziko
  rationale: Hifili ya נוח hapa ina maana ya kusababisha wapumzike au kuwapa utulivu na usalama. Usemi huu pia unahifadhi dhamira ya Kumbukumbu la Torati kuhusu kukaa kwa amani katika nchi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili, badala ya kulibadilisha na cheo.
- source_word: לַאֲחֵיכֶם
  choice: ndugu zenu
  rationale: Neno la Kiebrania ni la udugu wa kiume, lakini katika muktadha linarejelea Waisraeli wenzao. ‘Ndugu zenu’ ni la asili katika Kiswahili na linaweza kubeba maana hiyo pana; tanbihi inaeleza umbo la chanzo.
- source_word: כָכֶם
  choice: kama alivyowapa ninyi
  rationale: Kiebrania kina ulinganisho uliofupishwa, ‘kama ninyi.’ Kitenzi kilichodokezwa kimewekwa wazi kwa Kiswahili cha kawaida bila kubadili maana.
- source_word: וְיָרְשׁוּ
  choice: waimiliki
  rationale: ירשׁ katika muktadha wa nchi inaeleza kuichukua na kuwa nayo. ‘Waimiliki’ ni fasaha na inaonyesha kuingia katika umiliki halisi.
- source_word: נֹתֵן
  choice: anawapa
  rationale: Kauli endelevu ya sasa inadumisha hali ya tendo linaloendelea na pia uhakika wa zawadi ya Mungu.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: ng’ambo ya Yordani
  rationale: Usemi huu ni wa mahali kulingana na upande wa msemaji. Hapa unaelekeza upande mwingine wa mto kutoka walipokuwa mashariki mwa Yordani.
- source_word: וְשַׁבְתֶּם
  choice: Kisha ... atarudi
  rationale: 'Waw inaendeleza mfuatano wa matukio: baada ya ndugu zao kuimiliki nchi, watu waliozungumziwa watarudi. Wazo la ruhusa linatokana na muktadha, hivyo halijaongezwa wazi ndani ya kitenzi.'
- source_word: אִישׁ
  choice: kila mmoja wenu
  rationale: אִישׁ hapa ina nguvu ya kugawa, yaani kila mtu mmoja mmoja kati ya wanaume wanaozungumziwa. Kiswahili hiki ni cha kawaida na sahihi kwa matumizi hayo.
- source_word: לִירֻשָּׁתוֹ
  choice: katika milki yake
  rationale: Neno ירשה linamaanisha mali au sehemu ya nchi aliyopokea mtu. ‘Milki yake’ inadumisha maana ya eneo alilopewa na kulimiliki.
- source_word: נָתַתִּי לָכֶם
  choice: ambayo nimewapa
  rationale: Kauli timilifu ya Kiswahili inaonyesha tendo lililokamilika ambalo matokeo yake bado ni halali kwa wanaoambiwa.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya ‘pumziko’
  choice: awape ... pumziko
  alternative: awape nafuu; awatulize
  rationale: Neno linahusisha kukaa kwa usalama na utulivu katika nchi, si kupumzika kimwili tu. Tafsiri inadumisha neno la dhamira hiyo bila kuamua zaidi namna ya pumziko.
- issue: Lugha ya kijinsia katika אֲחֵיכֶם na אִישׁ
  choice: ndugu zenu; kila mmoja wenu
  alternative: Waisraeli wenzenu; kila mwanamume
  rationale: ‘Ndugu’ ni neno la kawaida lenye upana wa maana katika Kiswahili, huku tanbihi ikihifadhi taarifa kwamba Kiebrania kimetumia neno la udugu wa kiume. אִישׁ ya kugawa imetafsiriwa kwa nahau ‘kila mmoja wenu’ bila kukataa kwamba walioambiwa katika muktadha ni wanaume wa vita.
- issue: Nguvu ya וְשַׁבְתֶּם
  choice: atarudi
  alternative: anaweza kurudi; ataruhusiwa kurudi
  rationale: Kitenzi chenyewe kinaendeleza tukio linalofuata, ilhali wazo la ruhusa linatokana na muktadha mpana. Tafsiri haijaingiza kwa lazima maana ya ruhusa ndani ya kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unafuata kwa karibu mfuatano wa Kiebrania, huku ulinganisho uliofupishwa ukifanywa wazi ili uwe wa kawaida kwa Kiswahili. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
