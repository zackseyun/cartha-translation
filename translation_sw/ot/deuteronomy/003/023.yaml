  text: And I pleaded with Yahweh at that time[a], saying,
translation:
  language: sw
  text: Wakati huo nilimsihi Yahweh[a], nikisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH.” Kwa desturi hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶתְחַנַּן
  choice: nilimsihi
  rationale: Kitenzi hiki katika hitpaeli kinaonyesha ombi la dhati la kutafuta kibali au rehema. “Nilimsihi” ni Kiswahili cha sasa, cha kawaida, na huhifadhi uzito wa ombi hilo.
- source_word: אֶל
  choice: -m- katika “nilimsihi”
  rationale: Kiebrania kinaonyesha kwamba ombi lilielekezwa kwa Yahweh. Katika Kiswahili, uhusiano huo huwasilishwa kwa kawaida kwa kiambishi cha yambwa katika kitenzi “nilimsihi,” badala ya kutafsiri kihusishi hicho kwa neno tofauti.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne YHWH limeandikwa “Yahweh,” badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina binafsi katika matini ya Kiebrania.
- source_word: בָּעֵת הַהִוא
  choice: Wakati huo
  rationale: Hii ni tafsiri ya asili na wazi ya kishazi cha wakati, bila kuainisha zaidi muda ambao Kiebrania hakuuainishi.
- source_word: לֵאמֹר
  choice: nikisema
  rationale: Muundo huu hutanguliza maneno ya moja kwa moja yanayofuata. “Nikisema” huunganisha simulizi na kauli ya mstari unaofuata kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Matini ya Kiebrania ina jina YHWH, si cheo cha kawaida. “Yahweh” huhifadhi jina hilo, huku tanbihi ikitaja desturi ya kulitafsiri “BWANA.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio “Wakati huo” ni wa asili zaidi katika Kiswahili, na “nilimsihi” huhifadhi ukali wa ombi bila kutumia lugha ya kizamani.
