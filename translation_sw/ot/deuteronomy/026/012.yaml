base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/012.yaml
  text: When you have finished tithing all the tithe of your produce in the third year[a], the year of the tithe, then you shall give it to the Levite, the sojourner, the fatherless, and the widow, and they shall eat within your gates and be satisfied.
translation:
  language: sw
  text: Utakapomaliza kutoa zaka yote ya mazao yako katika mwaka wa tatu, mwaka wa zaka, utawapa Mlawi, mgeni, yatima, na mjane; nao watakula ndani ya malango yako[a] na kushiba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, katika miji yako; kihalisi, ndani ya malango yako.
    reason: Usemi wa Kiebrania hutaja 'malango' lakini kwa matumizi ya kimuktadha unaweza kurejelea miji au maeneo ya makazi ya msomaji.
lexical_decisions:
- source_word: כִּי תְכַלֶּה
  choice: Utakapomaliza
  rationale: Muundo huu unaonyesha hali ya wakati na kukamilika kwa tendo kabla ya agizo linalofuata.
- source_word: לַעְשֵׂר אֶת כָּל מַעְשַׂר
  choice: kutenga sehemu yote ya kumi
  rationale: Kitenzi na nomino zinazohusiana zimehifadhiwa kwa lugha ya kawaida; ‘kutenga’ pia hutofautisha hatua hii na kuwapa wanufaika inayofuata.
- source_word: תְּבוּאָתְךָ
  choice: mazao yako
  rationale: ‘Mazao’ yanajumuisha mavuno au pato la kilimo kwa upana unaolingana na neno la Kiebrania.
- source_word: שְׁנַת הַמַּעֲשֵׂר
  choice: mwaka wa kutoa sehemu ya kumi
  rationale: Tafsiri hii inaeleza kwa uwazi mwaka maalumu wa utaratibu wa sehemu ya kumi bila kutumia istilahi isiyoeleweka kwa baadhi ya wasomaji.
- source_word: לַלֵּוִי
  choice: Walawi
  rationale: Umoja wa jumla katika sheria umetafsiriwa kwa wingi wa kundi, ambao ni wa kawaida na wazi katika Kiswahili.
- source_word: לַגֵּר
  choice: wageni wanaoishi kati yenu
  rationale: גֵּר si mpita-njia tu bali mtu asiye mzawa anayeishi katika jamii; kirai hiki kinahifadhi maana hiyo ya kijamii.
- source_word: לַיָּתוֹם וְלָאַלְמָנָה
  choice: yatima na wajane
  rationale: Haya ni makundi mahsusi yaliyo katika mazingira hatarishi yaliyotajwa na sheria.
- source_word: וְשָׂבֵעוּ
  choice: na kushiba
  rationale: ‘Kushiba’ huonyesha kula mpaka kutosheka, kulingana moja kwa moja na kitenzi cha Kiebrania.
theological_decisions:
- issue: Makundi ya wanufaika katika sheria ya agano
  choice: Walawi, wageni wanaoishi kati yenu, yatima na wajane
  alternative: wahudumu wa dini na watu wenye mahitaji
  rationale: Makundi halisi yaliyotajwa yamehifadhiwa ili kutoipanua sheria kwa ufafanuzi wa kijumla au kuingiza makundi ya kisasa yasiyotajwa.
- issue: Maana ya בִּשְׁעָרֶיךָ
  choice: malangoni mwako
  alternative: katika miji yako
  rationale: Usemi halisi wa Kiebrania umehifadhiwa katika matini, huku maana yake ya kimuktadha kama makazi au miji ikitolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imegawanywa mara mbili ili kupunguza uzito wa orodha ndefu bila kuvunja mfuatano wa agizo.
