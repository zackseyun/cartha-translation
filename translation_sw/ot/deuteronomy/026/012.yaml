  naturalness: Kiswahili cha rasimu kinaeleweka, lakini "kutenga sehemu yote ya kumi" na "mwaka wa kutoa sehemu ya kumi" ni vizito na hurudia maelezo. "Kutoa zaka yote" na "mwaka wa zaka" ni vya kawaida, vifupi, na vinaonyesha uhusiano wa kitenzi na nomino za Kiebrania.
