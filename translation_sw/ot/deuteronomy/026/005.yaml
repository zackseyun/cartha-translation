  text: וְ/עָנִ֨יתָ וְ/אָמַרְתָּ֜ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֲרַמִּי֙ אֹבֵ֣ד אָבִ֔/י וַ/יֵּ֣רֶד מִצְרַ֔יְמָ/ה וַ/יָּ֥גָר שָׁ֖ם בִּ/מְתֵ֣י מְעָ֑ט וַֽ/יְהִי שָׁ֕ם לְ/ג֥וֹי גָּד֖וֹל עָצ֥וּם וָ/רָֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/005.yaml
  text: And you shall answer and say before Yahweh your God[a], ‘My father was a perishing Aramean, and he went down to Egypt and sojourned there, few in number; and there he became a great, mighty, and numerous nation.’
translation:
  language: sw
  text: Nawe utajibu na kusema mbele za Yahwe, Mungu wako, ‘Baba yangu alikuwa Mwaramu aliyekuwa akitangatanga[a]. Alishuka kwenda Misri, akaishi huko akiwa mgeni, akiwa na watu wachache; na huko akawa taifa kubwa, lenye nguvu na watu wengi.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Baba yangu alikuwa Mwaramu aliyekuwa akiangamia.” Neno la Kiebrania linaweza kumaanisha “akitangatanga” au “akiangamia.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָנִיתָ וְאָמַרְתָּ
  choice: utajibu na kusema
  rationale: Inahifadhi jozi ya vitenzi vya Kiebrania inayotambulisha tamko rasmi la ibada, ingawa kwa Kiswahili ina urudiaji wa kimakusudi.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: mbele za Yahwe Mungu wako
  rationale: ‘Mbele za’ ni usemi wa kawaida wa Kiswahili unaoonyesha kuwa jambo linafanywa katika uwepo wa Mungu; jina la agano יהוה limetolewa kama ‘Yahwe.’
- source_word: אֲרַמִּי
  choice: Mwaramu
  rationale: Ni jina sahihi la mtu wa Aramu na huepuka neno ‘Msyria,’ ambalo linaweza kuleta maana pana ya kisasa isiyokusudiwa.
- source_word: אֹבֵד
  choice: aliyekuwa akitangatanga
  rationale: Kauli hii inadokeza hali inayoendelea na inafaa simulizi la babu aliyekuwa akisafiri na kuishi ugenini. Maana nyingine halali ya kuwa katika hali ya kuangamia imehifadhiwa katika tanbihi.
- source_word: אָבִי
  choice: Baba yangu
  rationale: Inadumisha umoja na picha ya moja kwa moja ya Kiebrania badala ya kuibadili kwa ufafanuzi kuwa ‘babu yangu’ au ‘mzee wangu wa kale.’
- source_word: וַיֵּרֶד מִצְרַיְמָה
  choice: Alishuka kwenda Misri
  rationale: Inahifadhi kitenzi cha mwelekeo ‘kushuka,’ ambacho ni sehemu ya namna ya Kiebrania ya kueleza safari ya kwenda Misri.
- source_word: וַיָּגָר שָׁם
  choice: akaishi huko kama mgeni
  rationale: גור haimaanishi kukaa tu, bali kuishi mahali kama mgeni au mkazi asiye mwenyeji; tafsiri hii ni wazi kwa msomaji wa sasa.
- source_word: בִּמְתֵי מְעָט
  choice: akiwa na watu wachache
  rationale: Inatoa maana ya kundi dogo lililoandamana naye bila kulazimisha kwamba lilihesabu wanaume wazima peke yao.
- source_word: וַיְהִי שָׁם לְגוֹי
  choice: na huko akawa taifa
  rationale: 'Inahifadhi umoja wa kiwakilishi katika Kiebrania: babu huyo, akiwakilishwa pamoja na wazao wake, akawa taifa.'
- source_word: גָּדוֹל עָצוּם וָרָב
  choice: kubwa, lenye nguvu na watu wengi
  rationale: Inahifadhi msisitizo wa vipengele vitatu—ukubwa, nguvu, na wingi—kwa Kiswahili cha kawaida na chenye hadhi.
theological_decisions:
- issue: Maana ya אֲרַמִּי אֹבֵד אָבִי
  choice: Baba yangu alikuwa Mwaramu aliyekuwa akitangatanga
  alternative: Baba yangu alikuwa Mwaramu aliyekuwa karibu kuangamia
  rationale: Muundo wa Kiebrania ni mfupi na unaweza kueleweka kwa zaidi ya njia moja. Masoretic pointing inaunga mkono kumfanya ‘baba yangu’ kuwa kiima, lakini אֹבֵד inaweza kuonyesha kutangatanga/kupotea au kuwa katika hali ya kuangamia. Tafsiri kuu inafuata muktadha wa uhamaji, na tanbihi inadumisha maana nyingine bila kuondoa mvutano wa kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya tamko la ibada lakini kinachoeleweka kwa urahisi. Urudiaji ‘utajibu na kusema’ umehifadhiwa kwa sababu ni fomula ya makusudi katika Kiebrania. ‘Akaishi huko kama mgeni’ ni ya sasa na wazi kuliko kutumia neno la kale ‘akakaa ugenini.’
