  text: וַ/נִּצְעַ֕ק אֶל יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתֵ֑י/נוּ וַ/יִּשְׁמַ֤ע יְהוָה֙ אֶת קֹלֵ֔/נוּ וַ/יַּ֧רְא אֶת עָנְיֵ֛/נוּ וְ/אֶת עֲמָלֵ֖/נוּ וְ/אֶת לַחֲצֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/007.yaml
  text: Then we cried out to Yahweh[a], the God of our fathers, and Yahweh heard our voice and saw our affliction, our labor[b], and our oppression.
translation:
  language: sw
  text: Kisha tukamlilia Yahwe, Mungu wa baba zetu[a], naye Yahwe akasikia sauti yetu[b], akaona dhiki yetu, taabu yetu, na uonevu tuliotendewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu wa mababu zetu.” Kauli hii inamrejelea Mungu wa agano aliyeabudiwa na mababu wa Israeli.
    reason: lexical_alternative
  - marker: b
    text: “Akasikia sauti yetu” ni tafsiri halisi; maana yake ni kwamba alisikiliza kilio chetu.
    reason: idiom_clarification
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: tukamlilia
  rationale: Kitenzi צעק kinaonyesha kilio cha dharura cha kuomba msaada. ‘Tukamlilia’ ni Kiswahili cha kawaida kinachohifadhi uzito huo na kuelekeza kilio kwa Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  choice: Mungu wa baba zetu
  rationale: Hii inahifadhi muundo wa Kiebrania na kauli ya kihistoria ya agano inayowaelekeza wasomaji kwa mababu wa Israeli.
- source_word: וַיִּשְׁמַע ... אֶת קֹלֵנוּ
  choice: akasikia sauti yetu
  rationale: Tafsiri hii inahifadhi taswira ya Kiebrania ya ‘kusikia sauti yetu’; katika muktadha inamaanisha kwamba Mungu alisikiliza kilio chao.
- source_word: עָנְיֵנוּ
  choice: dhiki yetu
  rationale: עֳנִי huonyesha hali ya kuteseka, kunyenyekezwa, au kuwa katika taabu. ‘Dhiki’ ni neno lenye uzito na la kawaida linalofaa katika simulizi hili la ukombozi.
- source_word: עֲמָלֵנוּ
  choice: taabu yetu
  rationale: עָמָל inaweza kumaanisha kazi ngumu yenye kuchosha, taabu, au shida. ‘Taabu’ huhifadhi upana huo bila kuifanya ihusu kazi pekee.
- source_word: לַחֲצֵנוּ
  choice: uonevu tuliotendewa
  rationale: לַחַץ ni shinikizo au ukandamizaji unaosababishwa na watesi. Kauli hii ni ya asili katika Kiswahili na inatofautisha uonevu wa nje na dhiki na taabu zilizotangulia.
theological_decisions:
- issue: Uwasilishaji wa jina la agano יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni יהוה. ‘Yahwe’ huhifadhi jina binafsi la Mungu bila kulibadilisha na cheo.
- issue: Maana ya ‘Mungu wa baba zetu’
  choice: Mungu wa baba zetu
  alternative: Mungu wa mababu zetu
  rationale: ‘Baba zetu’ hudumisha kauli halisi ya agano na marejeo ya Kiebrania kwa waasisi wa Israeli; tanbihi inaonyesha kwamba kwa maana pana ni mababu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sentensi na mfululizo wa ‘dhiki, taabu, na uonevu’ umehifadhiwa kadiri ya uasilia wa Kiswahili.
