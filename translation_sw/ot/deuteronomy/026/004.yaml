base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/004.yaml
  text: Then the priest shall take the basket from your hand and set it before the altar of Yahweh your God[a].
translation:
  language: sw
  text: Kisha kuhani atachukua kikapu kutoka mkononi mwako na kukiweka mbele ya madhabahu ya Yahwe Mungu wako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa desturi hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַח
  choice: Kisha ... atachukua
  rationale: Katika mfuatano wa maagizo ya ibada, kitenzi hiki kinaonyesha hatua inayofuata; “Kisha” na wakati ujao ni Kiswahili cha asili na cha wazi.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Nomino ya umoja yenye uamilifu maalumu hapa inamtaja kuhani anayehudumu katika ibada.
- source_word: הַטֶּנֶא
  choice: kikapu
  rationale: Neno טֶנֶא humaanisha kikapu, hapa chombo chenye malimbuko.
- source_word: מִיָּדֶךָ
  choice: kutoka mkononi mwako
  rationale: Hudumisha taswira halisi ya kuhani kupokea kikapu kutoka katika mkono wa mtoaji.
- source_word: וְהִנִּיחוֹ
  choice: na kukiweka
  rationale: Hifili ya נוח hapa ina maana ya kuweka kitu mahali; kiambishi “-ki-” kinarejelea kikapu bila kuongeza wazo lisilo la lazima.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Ni tafsiri ya kawaida ya uhusiano wa mahali kuelekea madhabahu.
- source_word: מִזְבַּח
  choice: madhabahu
  rationale: Neno la kawaida la Kiswahili kwa mahali pa kutolea dhabihu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina la Mungu YHWH kwa umbo linalotumika kwa kawaida katika Kiswahili badala ya kulibadili kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Hifadhi ya kiambishi cha nafsi ya pili umoja inadumisha usemi wa moja kwa moja wa agano.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kina jina binafsi YHWH; “Yahwe” hulihifadhi kama jina, huku tanbihi ikitaja desturi ya kulitafsiri kwa cheo “BWANA.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Kisha” huonyesha mfuatano wa utaratibu, na “kuk­iweka” huepuka kuongeza maana ya ‘chini’ isiyo lazima.
