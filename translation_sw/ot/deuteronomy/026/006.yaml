  text: And the Egyptians treated us badly and afflicted us[c][b][a], and laid hard labor on us.
translation:
  language: sw
  text: Wamisri wakatutendea vibaya, wakatutesa, na wakatubebesha kazi ngumu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֵעוּ אֹתָנוּ
  choice: wakatutendea vibaya
  rationale: Kauli ya Hiphil ya רעע inaonyesha kuwatendea watu kwa namna yenye kuwadhuru. Usemi huu ni wa kawaida katika Kiswahili cha sasa na hauongezi aina maalumu ya ukatili ambayo kitenzi hakuitaji.
- source_word: הַמִּצְרִים
  choice: Wamisri
  rationale: Ni jina la taifa lenye uamilifu wa mtenda, likiwataja watu wa Misri kama waliowatesa Waisraeli.
- source_word: וַיְעַנּוּנוּ
  choice: wakatutesa
  rationale: Piel ya ענה inaweza kumaanisha kutesa, kuonea, au kunyenyekeza. ‘Wakatutesa’ huhifadhi wazo pana la kuwasababishia mateso na kuitofautisha na kauli iliyotangulia.
- source_word: וַיִּתְּנוּ עָלֵינוּ
  choice: wakatulazimisha kufanya
  rationale: Nahau נתן על hapa ina maana ya kuweka au kutwika wajibu mzito juu ya mtu. Katika Kiswahili, ‘kulazimisha kufanya’ huwasilisha kwa uwazi na kwa kawaida tendo la kuwabebesha kazi hiyo.
- source_word: עֲבֹדָה קָשָׁה
  choice: kazi ngumu
  rationale: עֲבֹדָה ni kazi au utumishi, na קָשָׁה ni ngumu, kali, au nzito. ‘Kazi ngumu’ ni tafsiri ya kawaida na iliyo wazi katika Kiswahili.
theological_decisions:
- issue: Kutofautisha mfululizo wa kauli zinazoeleza uonevu
  choice: 'Kutumia kauli tatu tofauti: ‘wakatutendea vibaya,’ ‘wakatutesa,’ na ‘wakatulazimisha kufanya kazi ngumu.’'
  alternative: Kufupisha vitenzi viwili vya kwanza kuwa wazo moja la kuonewa, au kutumia istilahi kali ya utumwa katika kila kishazi.
  rationale: Kiebrania kina mfululizo wa vitenzi vinavyohusiana lakini visivyofanana kabisa. Kuzitofautisha huhifadhi maendeleo ya usemi bila kuongeza madai yasiyosemwa moja kwa moja na mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye hadhi. Muundo wa ‘wakatutendea… wakatutesa… wakatulazimisha…’ huhifadhi mtiririko wa simulizi ya Kiebrania kwa namna ya kawaida katika Kiswahili.
