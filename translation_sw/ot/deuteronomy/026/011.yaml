  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/שָׂמַחְתָּ֣ בְ/כָל הַ/טּ֗וֹב אֲשֶׁ֧ר נָֽתַן לְ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/לְ/בֵיתֶ֑/ךָ אַתָּה֙ וְ/הַ/לֵּוִ֔י וְ/הַ/גֵּ֖ר אֲשֶׁ֥ר בְּ/קִרְבֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/011.yaml
  text: And you shall rejoice in all the good that Yahweh your God has given to you and to your household—you[a], and the Levite, and the sojourner who is among you.
translation:
  language: sw
  text: Nawe utafurahia mema yote ambayo Yahwe Mungu wako amekupa wewe na watu wa nyumbani mwako—wewe, Mlawi, na mgeni anayeishi miongoni mwako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mgeni mkazi.” Neno la Kiebrania גֵּר humaanisha mtu asiye Mwisraeli anayeishi miongoni mwa Waisraeli chini ya ulinzi wao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: Nawe utafurahia
  rationale: Katika muktadha huu wa maagizo, kitenzi hicho kina nguvu ya agizo linalotazamia utekelezaji. ‘Utafurahia’ linaonyesha furaha ya moyoni na ya sherehe, huku ‘Nawe’ likiunganisha mstari na yaliyotangulia.
- source_word: בְּכָל הַטּוֹב
  choice: mema yote
  rationale: Hii ni kauli ya kawaida na fasaha ya Kiswahili inayoonyesha jumla ya baraka njema zilizopokewa bila kuzibana kuwa vitu vya kimwili pekee.
- source_word: אֲשֶׁר נָתַן לְךָ
  choice: ambayo ... amekupa
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika ambalo matokeo yake yanaendelea kuwapo katika tukio hili la ibada.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetafsiriwa kwa umbo la kawaida la Kiswahili ‘Yahwe,’ badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huhifadhi usemi wa agano pamoja na kiambishi cha nafsi ya pili umoja.
- source_word: וּלְבֵיתֶךָ
  choice: na watu wa nyumbani mwako
  rationale: בַּיִת hapa inaashiria kaya au jamaa ya nyumbani, si jengo pekee; usemi huu ni wa kawaida na wazi kwa msomaji wa Kiswahili.
- source_word: אַתָּה
  choice: wewe
  rationale: Kiwakilishi kilicho wazi katika Kiebrania kimehifadhiwa ili kuonyesha msisitizo na nafasi yake katika orodha ya wanaoshiriki furaha.
- source_word: הַלֵּוִי
  choice: Mlawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa mtu wa kabila la Lawi.
- source_word: הַגֵּר
  choice: mgeni anayeishi
  rationale: ‘Mgeni’ pekee huenda akafikiriwa kuwa mgeni wa muda mfupi; nyongeza ‘anayeishi’ inaonyesha hadhi ya mtu asiye mzawa anayekaa katika jamii. Chaguo la kisheria zaidi limewekwa katika tanbihi.
- source_word: אֲשֶׁר בְּקִרְבֶּךָ
  choice: anayeishi miongoni mwako
  rationale: Huhifadhi nafsi ya pili umoja ya Kiebrania na kueleza kwa Kiswahili cha kawaida kwamba mgeni huyo ni sehemu ya jamii inayomzunguka mhutubiwa.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu moja kwa moja. ‘Yahwe’ hulihifadhi kama jina badala ya kuliwakilisha kwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha na msisitizo wa ‘wewe’ umehifadhiwa; istilahi ya kijamii גֵּר imefafanuliwa kwa ufupi bila kupoteza upekee wake wa kisheria.
