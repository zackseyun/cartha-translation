source:
  edition: WLC
  text: וּ/בָאתָ֙ אֶל הַ/כֹּהֵ֔ן אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/יָּמִ֣ים הָ/הֵ֑ם וְ/אָמַרְתָּ֣ אֵלָ֗י/ו הִגַּ֤דְתִּי הַ/יּוֹם֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ כִּי בָ֨אתִי֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֵ֖י/נוּ לָ֥/תֶת לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/003.yaml
  text: And you shall go to the priest who is in office in those days and say to him[c][b][a], ‘Today I declare to Yahweh your God that I have come into the land that Yahweh swore to our fathers to give to us.’
translation:
  language: sw
  text: Kisha uende kwa kuhani anayehudumu siku hizo[a], umwambie, “Leo ninamtangazia Yahwe, Mungu wako, kwamba nimeingia katika nchi ambayo Yahwe aliwaapia baba zetu[c] kwamba atatupa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kuhani atakayekuwapo siku hizo,” yaani kuhani anayehudumu wakati huo.
    reason: lexical_alternative
  - marker: c
    text: Au “mababu zetu.” Kiebrania kinasema “baba zetu” na huenda kinawarejelea hasa mababa wa zamani wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: Kisha uende
  rationale: Kitenzi בוא kinaweza kumaanisha kuja, kwenda, au kuingia kulingana na mtazamo. Katika agizo la kumwendea kuhani, “uende” ni Kiswahili cha kawaida, na “kisha” linaendeleza mfululizo wa maagizo.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כֹּהֵן katika muktadha wa ibada na sheria.
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: anayehudumu siku hizo
  rationale: Kihalisi ni “atakayekuwapo siku hizo,” lakini katika muktadha humaanisha kuhani anayetekeleza huduma wakati huo. Tafsiri hii ni wazi na ya kawaida bila kutaja cheo kisichotajwa moja kwa moja.
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: umwambie
  rationale: Inawasilisha kwa ufupi na kwa kawaida nguvu ya agizo la kumwambia kuhani maneno yanayofuata.
- source_word: הִגַּדְתִּי הַיּוֹם
  choice: Leo ninatangaza
  rationale: 'Kauli timilifu ya Kiebrania hapa yaweza kuwa ya kiutendaji: msemaji anatoa tangazo kwa kuyasema maneno haya. Wakati uliopo wa Kiswahili unaonyesha tendo hilo la sasa.'
- source_word: לַיהוָה
  choice: mbele za Yahwe
  rationale: Kihusishi לְ kinaelekeza tangazo kwa Yahwe. “Mbele za Yahwe” ni Kiswahili cha asili kinachoonyesha tangazo linalotolewa kwake bila kudokeza kwamba Mungu anapewa habari asiyoijua.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: 'Kiambishi cha nafsi ya pili umoja kimehifadhiwa: mwabudu anamwambia kuhani “Mungu wako,” si “Mungu wetu.”'
- source_word: כִּי בָאתִי
  choice: kwamba nimeingia
  rationale: כִּי inaanzisha yaliyomo katika tangazo, na “nimeingia” linaonyesha kuwasili katika nchi kukiwa na umuhimu wa sasa.
- source_word: אֶל הָאָרֶץ
  choice: katika nchi
  rationale: Pamoja na “nimeingia,” usemi huu unaonyesha kuingia ndani ya nchi iliyoahidiwa kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: ambayo Yahwe aliwaapia
  rationale: Inahifadhi lugha ya kiapo cha agano na inaunganisha kiapo hicho na wale walioapiwa.
- source_word: לַאֲבֹתֵינוּ
  choice: baba zetu
  rationale: Nomino ya Kiebrania ni ya kiume kwa wingi na katika muktadha huu huenda inawarejelea hasa mababa wa zamani wa agano; “baba zetu” huhifadhi hilo huku tanbihi ikitaja uwezekano mpana.
- source_word: לָתֶת לָנוּ
  choice: kwamba atatupa
  rationale: Inaonyesha wazi maudhui ya kiapo—Yahwe angeipa nchi hiyo jumuiya inayozungumza—kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano יְהוָה; “Yahwe” hulitambulisha kama jina maalumu badala ya kulibadilisha kuwa cheo.
- issue: Mhusika wa אֱלֹהֶיךָ
  choice: Mungu wako
  alternative: Mungu wetu
  rationale: Kiebrania kina nafsi ya pili umoja. Ingawa msemaji pia ni mshiriki wa agano, tafsiri haibadili kwa kimya maneno anayomwambia kuhani.
- issue: Rejeo la לַאֲבֹתֵינוּ
  choice: baba zetu
  alternative: mababu zetu au wahenga wetu
  rationale: Usemi wa Kiebrania ni wa kiume na katika muktadha wa ahadi ya nchi unaweza kuwarejelea mababa wa agano. Tanbihi huhifadhi uwezekano wa maana pana ya mababu bila kuufanya kuwa wa lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Kisha uende” na “umwambie” huhifadhi mtiririko wa maagizo; “mbele za Yahwe” huepuka Kiswahili kisicho cha kawaida cha “kumtangazia Yahwe” huku kikihifadhi mwelekeo wa tangazo.
