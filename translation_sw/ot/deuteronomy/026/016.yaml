base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/016.yaml
  text: This day Yahweh your God commands you to do these statutes and judgments[c][b][a]; and you shall keep and do them with all your heart and with all your soul.
translation:
  language: sw
  text: Leo hii[a] Yahwe Mungu wako anakuamuru kutekeleza kanuni hizi na hukumu hizi[b]; na utazishika na kuzitekeleza kwa moyo wako wote na kwa nafsi yako yote[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Leo Yahwe Mungu wako anakuamuru kutekeleza kanuni hizi na hukumu hizi.”
    reason: lexical_alternative
  - marker: b
    text: “Hukumu” pia inaweza kutafsiriwa “maagizo ya kisheria” au “masharti”; neno la Kiebrania mara nyingi humaanisha maamuzi ya kisheria au hukumu zilizowekwa.
    reason: lexical_alternative
  - marker: c
    text: “Nafsi” hapa limetafsiri neno la Kiebrania nefesh, ambalo pia linaweza kumaanisha “uhai” au “mtu mwenyewe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַזֶּה
  choice: Leo hii
  rationale: Kirai hiki kinadumisha msisitizo wa wakati uliopo na uzito wa agano, huku kikiwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama “BWANA”.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Kinahifadhi uhusiano wa agano na kiambishi cha nafsi ya pili umoja.
- source_word: מְצַוְּךָ
  choice: anakuamuru
  rationale: Kitenzi cha wakati uliopo kinaonyesha kwamba amri inatolewa sasa kwa msisitizo wa moja kwa moja.
- source_word: לַעֲשׂוֹת
  choice: kutekeleza
  rationale: Kwa kanuni na hukumu, “kutekeleza” ni Kiswahili cha asili zaidi kuliko “kufanya,” huku kikihifadhi maana ya kuyatenda yaliyoamriwa.
- source_word: הַחֻקִּים
  choice: kanuni
  rationale: “Kanuni” linaonyesha masharti yaliyowekwa na kulitofautisha na neno linalofuata la maamuzi au masharti ya kisheria.
- source_word: הַמִּשְׁפָּטִים
  choice: hukumu
  rationale: Linahifadhi maana ya kisheria ya maamuzi, masharti, au maagizo yenye mamlaka.
- source_word: וְשָׁמַרְתָּ
  choice: Utazishika
  rationale: Katika muktadha wa agano, “kushika” humaanisha kutunza na kuzingatia kwa uaminifu.
- source_word: וְעָשִׂיתָ אֹתָם
  choice: na kuzitekeleza
  rationale: Linadumisha jozi ya mawazo ya Kiebrania—kushika na kutenda—kwa Kiswahili cha asili.
- source_word: בְּכָל לְבָבְךָ
  choice: kwa moyo wako wote
  rationale: Linawakilisha moyo kama kitovu cha nia, fikira, na mapenzi ya mtu.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: na kwa nafsi yako yote
  rationale: “Nafsi” huhifadhi neno la kawaida la kibiblia, huku dokezo likieleza upana wa maana ya neno la Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la agano יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; kulitaja kama “Yahwe” kunahifadhi jina hilo badala ya kuliweka kwa cheo.
- issue: Nguvu ya nafsi ya pili umoja
  choice: wako / anakuamuru / moyo wako / nafsi yako
  alternative: Kuwataja Waisraeli kwa wingi
  rationale: Viambishi vya umoja vinahifadhi namna Israeli anavyosemeshwa kama mshirika mmoja wa agano bila kuongeza jina lisilomo katika mstari.
- issue: Uhusiano kati ya amri na wajibu unaofuata
  choice: 'Sentensi ya pili inaanza moja kwa moja: “Utazishika...”'
  alternative: “Kwa hiyo utazishika...”
  rationale: Kiunganishi cha Kiebrania hakilazimishi maana ya hitimisho; kutotumia “kwa hiyo” huepuka kuongeza uhusiano wa kimantiki usioelezwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Leo hii” hudumisha msisitizo wa agano; “kanuni” na “hukumu” zinatofautisha istilahi mbili za kisheria. Viambishi vya nafsi ya pili umoja vimehifadhiwa.
