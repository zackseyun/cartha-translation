base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/018.yaml
  text: And Yahweh has declared today that you are to be his treasured people[a], as he promised you[b], and that you are to keep all his commandments.
translation:
  language: sw
  text: Naye Yahwe leo amekutangaza kuwa watu wake wa thamani[a], kama alivyokuambia[b], na kwamba uzishike amri zake zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu ambao ni milki yake ya thamani”; Kiebrania, “watu, milki ya thamani.”
    reason: lexical_alternative
  - marker: b
    text: Au “kama alivyokuahidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Naye Yahwe
  rationale: Jina la Mungu limetolewa wazi kama “Yahwe”; kiunganishi וַ limedokezwa kwa “Naye,” kinachounganisha mstari huu na tamko la mstari uliotangulia.
- source_word: הֶאֱמִירְךָ
  choice: amekutangaza
  rationale: Kitenzi hiki adimu katika muktadha wa agano kina nguvu ya tamko rasmi. “Amekutangaza” ni Kiswahili cha sasa na hakiongezi wazo la kuchagua ambalo halijasemwa moja kwa moja.
- source_word: הַיּוֹם
  choice: leo
  rationale: “Leo” huhifadhi uharaka wa wakati wa tamko la agano kwa lugha ya kawaida.
- source_word: לִהְיוֹת לוֹ לְעַם סְגֻלָּה
  choice: kuwa watu wake wa thamani
  rationale: Kauli hii huhifadhi neno עַם, “watu,” pamoja na wazo la סְגֻלָּה, yaani miliki inayothaminiwa sana. Muundo wa “amekutangaza kuwa” pia huhifadhi umoja wa kimofolojia wa anayeambiwa, ambaye ni Israeli kama jumuiya.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: kama alivyokuambia
  rationale: Hili hufuata maana ya moja kwa moja ya דִּבֶּר, “alisema/alizungumza,” bila kuficha uwezekano wa kwamba katika muktadha maneno hayo ni ahadi.
- source_word: וְלִשְׁמֹר
  choice: na kwamba uzishike
  rationale: “Kushika” ni usemi wa kawaida wa Kibiblia na wa Kiswahili kwa kutii na kuzingatia amri. “Kwamba” hufanya uhusiano wa kisintaksia na tamko kuu uwe wazi.
- source_word: כָּל מִצְוֺתָיו
  choice: amri zake zote
  rationale: Hii ni tafsiri ya moja kwa moja na ya asili ya maneno hayo, huku ikihifadhi sajili ya sheria ya agano.
theological_decisions:
- issue: Nguvu ya kiagano ya kitenzi adimu הֶאֱמִיר
  choice: tamko rasmi la Mungu kuhusu hadhi ya Israeli
  alternative: lugha ya kuchaguliwa, au tamko la pande mbili la agano
  rationale: “Amekutangaza” huhifadhi uzito wa kitendo rasmi katika agano bila kuingiza kwa lazima fundisho pana la kuchaguliwa wala kutumia lugha ya kizamani.
- issue: Maana ya דִּבֶּר katika muktadha wa ahadi
  choice: kama alivyokuambia
  alternative: kama alivyokuahidi
  rationale: Maana ya msingi ya kitenzi imehifadhiwa katika maandiko makuu; tanbihi inaonyesha nguvu yake inayowezekana ya ahadi katika muktadha wa agano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “amekutangaza kuwa watu wake” unamwelekea Israeli kwa umoja kama jumuiya, kama ilivyo katika Kiebrania, bila kuongeza jina “Israeli” katika maandiko.
