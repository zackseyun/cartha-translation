base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/015.yaml
  text: Look down from your holy dwelling[a], from heaven, and bless your people Israel and the land that you have given us, as you swore to our fathers, a land flowing with milk and honey.
translation:
  language: sw
  text: Tazama chini, kutoka makao yako matakatifu, kutoka mbinguni, uwabariki watu wako Israeli na ardhi uliyotupatia, kama ulivyowaapia baba zetu[a]—nchi inayotiririka maziwa na asali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mababu zetu.” Kiebrania kinasema “baba zetu”; neno hilo linawarejelea mababa wa taifa waliopokea ahadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁקִיפָה
  choice: Tazama chini
  rationale: Kitenzi cha amri kinaomba Mungu aelekeze macho yake kutoka juu; “tazama chini” kinaonyesha tendo hilo pamoja na mahali pake mbinguni.
- source_word: מִמְּעוֹן קָדְשְׁךָ
  choice: kutoka makao yako matakatifu
  rationale: מָעוֹן ni mahali pa kukaa; “makao yako matakatifu” ni Kiswahili cha kawaida na chenye heshima kinachohifadhi sifa ya utakatifu.
- source_word: מִן הַשָּׁמַיִם
  choice: kutoka mbinguni
  rationale: Ingawa neno la Kiebrania lina umbo la wingi, “mbinguni” ndilo tamko la kawaida la mahali katika Kiswahili.
- source_word: וּבָרֵךְ
  choice: uwabariki
  rationale: Ni amri iliyounganishwa na ombi la kwanza; umbo la Kiswahili “uwabariki” linasikika kiasili katika sala.
- source_word: עַמְּךָ אֶת יִשְׂרָאֵל
  choice: watu wako Israeli
  rationale: Muundo huu unawatambulisha watu wa Mungu kuwa Israeli bila kuongeza ufafanuzi usiokuwapo katika chanzo.
- source_word: הָאֲדָמָה
  choice: ardhi
  rationale: אֲדָמָה huelekea kuonyesha ardhi au udongo unaolimwa. “Ardhi” huhifadhi tofauti fulani na אֶרֶץ (“nchi”) inayofuata, huku ikifaa katika muktadha wa mazao ya kwanza.
- source_word: אֲשֶׁר נָתַתָּה לָנוּ
  choice: uliyotupatia
  rationale: Wakati uliopita unaonyesha kwamba Mungu tayari aliwapa ardhi hiyo; “kutupatia” ni la sasa, la kawaida na lenye heshima.
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתֵינוּ
  choice: kama ulivyowaapia baba zetu
  rationale: Tafsiri hii huhifadhi kiapo cha Mungu na neno la kiume “baba” katika kauli ya agano, huku tanbihi ikieleza maana pana ya kifamilia na kihistoria.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: nchi inayotiririka maziwa na asali
  rationale: Ni nahau ya Kiebrania ya utele na rutuba; tamko hili la Kiswahili linahifadhi taswira yake kwa njia inayoeleweka.
theological_decisions:
- issue: Maana ya לַאֲבֹתֵינוּ katika kauli ya agano
  choice: baba zetu
  alternative: mababu zetu / wahenga wetu
  rationale: Kiebrania kimetumia neno la kiume “baba,” ambalo katika muktadha huu linawaelekea mababa wa taifa waliopokea ahadi. Matini kuu huhifadhi umbo hilo, na tanbihi hutoa maana pana bila kubadili utambulisho wa kihistoria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Muundo wa sala umewekwa wazi na wa kawaida; “ardhi” na “nchi” zimetumiwa kutofautisha kwa kiasi אֲדָמָה na אֶרֶץ. Alama ya tanbihi imewekwa baada ya “baba zetu,” ambako maelezo yake yanahusika.
