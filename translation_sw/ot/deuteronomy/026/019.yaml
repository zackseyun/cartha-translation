base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/019.yaml
  text: and to set you high above all the nations that he has made[a], for praise and for name and for beauty, and for you to be a holy people to Yahweh your God[c][b], as he has spoken.
translation:
  language: sw
  text: na kukuweka juu kuliko mataifa yote aliyoyafanya, ili upate sifa, umaarufu[a], na fahari[b], na ili uwe taifa takatifu la Yahwe, Mungu wako, kama alivyosema[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “jina”; hapa linaweza kumaanisha sifa njema au kujulikana.
    reason: lexical_alternative
  - marker: b
    text: Au “utukufu” au “uzuri”; neno la Kiebrania linaweza kumaanisha fahari, adhama, uzuri, au utukufu.
    reason: lexical_alternative
  - marker: c
    text: Au “kama alivyoahidi”; kwa neno halisi, “kama alivyosema.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְתִתְּךָ עֶלְיוֹן עַל כָּל הַגּוֹיִם
  choice: na kukuweka juu kuliko mataifa yote
  rationale: Muundo huu unaendeleza kauli iliyotangulia na kuonyesha kuinuliwa kwa Israeli kwa kulinganisha na mataifa yote; ‘juu kuliko’ ni Kiswahili cha kawaida na wazi.
- source_word: אֲשֶׁר עָשָׂה
  choice: aliyoyafanya
  rationale: Kitenzi עשה kwa kawaida ni ‘kufanya’; kishazi hiki kinamhusu Mungu kama mtendaji na kinabaki kuhusishwa moja kwa moja na ‘mataifa yote.’
- source_word: לִתְהִלָּה
  choice: ili upate sifa
  rationale: Lamed inaonyesha kusudi au matokeo. Kuongeza ‘upate’ kunafanya maana ya nomino ya Kiebrania iwe ya asili katika Kiswahili bila kubadili mhusika.
- source_word: וּלְשֵׁם
  choice: umaarufu
  rationale: Ingawa maana ya msingi ni ‘jina,’ katika muktadha huu jina linamaanisha sifa njema au kujulikana; ‘umaarufu’ ni wazi na wa kawaida, huku tanbihi ikihifadhi taswira halisi.
- source_word: וּלְתִפְאָרֶת
  choice: fahari
  rationale: תפארת inaweza kumaanisha uzuri, adhama, utukufu, au fahari. ‘Fahari’ inafaa katika mfululizo huu bila kuifanya sawa kabisa na ‘sifa.’
- source_word: וְלִהְיֹתְךָ עַם קָדוֹשׁ
  choice: na ili uwe taifa takatifu
  rationale: Infinitivu inaendeleza kusudi. ‘Taifa takatifu’ ni usemi wa asili katika muktadha wa agano na huhifadhi maana ya watu waliowekwa wakfu.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: kwa Yahwe Mungu wako
  rationale: Lamed inaonyesha uhusiano au kuwa mali ya Mungu; ‘kwa’ ni fupi na asili. Jina la agano יהוה limetafsiriwa kwa umbo ‘Yahwe’ badala ya kulibadilisha kuwa cheo.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: kama alivyosema
  rationale: דבר ni ‘kusema/kunena.’ Tafsiri hii inabaki karibu na Kiebrania na haifanyi kauli hiyo kuwa ahadi wazi zaidi kuliko ilivyo katika maneno yenyewe.
theological_decisions:
- issue: Iwapo kishazi cha mwisho kifafanuliwe moja kwa moja kuwa ahadi
  choice: kama alivyosema
  alternative: kama alivyoahidi
  rationale: Muktadha wa agano unaweza kudokeza ahadi, lakini kitenzi cha Kiebrania chenyewe ni ‘sema/nena’; tafsiri kuu haiamui zaidi ya matini.
- issue: Uwasilishaji wa יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Kutumia jina ‘Yahwe’ kunawakilisha jina binafsi lililo katika matini ya Kiebrania na kulitofautisha na cheo ‘Bwana,’ bila kuongeza fundisho la dhehebu.
- issue: Uhusiano wa עם קדוש na יהוה
  choice: taifa takatifu kwa Yahwe Mungu wako
  alternative: taifa takatifu lililo mali ya Yahwe Mungu wako
  rationale: ‘Kwa’ huhifadhi ufupi na upana wa lamed ya Kiebrania, ambayo inaweza kuonyesha uhusiano, kuwekwa wakfu, au kuwa mali yake, bila kulazimisha ufafanuzi mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kusudi umerudiwa kwa ‘ili’ ili sentensi ndefu ibaki wazi, huku mfululizo wa sifa, umaarufu, na fahari ukidumishwa.
