source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֤ה הֵבֵ֨אתִי֙ אֶת רֵאשִׁית֙ פְּרִ֣י הָ/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תָּה לִּ֖/י יְהוָ֑ה וְ/הִנַּחְתּ֗/וֹ לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הִֽשְׁתַּחֲוִ֔יתָ לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/010.yaml
  text: And now[a], behold, I have brought the firstfruits of the ground that you, O Yahweh, have given me[b]. Then you shall set it down before Yahweh your God and bow down before Yahweh your God.
translation:
  language: sw
  text: “Na sasa, tazama, nimeleta malimbuko ya mazao ya ardhi[a] uliyonipa, Ee Yahwe.” Kisha utayaweka mbele za Yahwe Mungu wako, nawe utainama kifudifudi[b] mbele za Yahwe Mungu wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu ya kwanza ya mazao ya udongo.”
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania kinamaanisha hasa kujiinamisha au kujilaza chini; “kuabudu” ni tafsiri pana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Inaendeleza uhusiano wa kauli hii na ungamo lililotangulia huku ikiashiria tendo la sasa.
- source_word: הִנֵּה
  choice: tazama
  rationale: Inahifadhi nguvu ya neno la kuelekeza usikivu kwa sadaka iliyoletwa, kwa Kiswahili cha sasa na chenye hadhi.
- source_word: הֵבֵאתִי
  choice: nimeleta
  rationale: Kauli ya wakati timilifu inaonyesha tendo la kuleta ambalo limekamilika wakati wa tamko hili.
- source_word: רֵאשִׁית פְּרִי הָאֲדָמָה
  choice: malimbuko ya mazao ya ardhi
  rationale: ‘Malimbuko’ ni neno la kawaida la kibiblia kwa sehemu ya kwanza ya mavuno, na ‘mazao ya ardhi’ linaonyesha uhusiano wa maneno ya Kiebrania bila kupunguza maana kuwa tunda pekee.
- source_word: הָאֲדָמָה
  choice: ardhi
  rationale: Katika muktadha huu neno linamaanisha udongo au ardhi inayotoa mazao; ‘ardhi’ ni ya kawaida na pia inadumisha mwangwi wa nchi aliyopewa mtoa sadaka.
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: uliyonipa
  rationale: Inahifadhi kishazi rejeshi na kukiri moja kwa moja kwamba ardhi yenye kuzaa ni zawadi kutoka kwa Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Inawakilisha jina la agano יהוה kwa namna ya moja kwa moja badala ya kulibadilisha kuwa cheo.
- source_word: וְהִנַּחְתּוֹ
  choice: Kisha utayaweka
  rationale: Katika utaratibu huu umbo la kitenzi lina nguvu ya agizo linalofuata tamko; kiambishi cha wingi kinakubaliana kiasili na ‘malimbuko’ katika Kiswahili.
- source_word: לִפְנֵי
  choice: mbele za
  rationale: Ni usemi wa kawaida unaohifadhi wazo la kuweka sadaka katika uwepo wa Mungu.
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: nawe utainama kifudifudi
  rationale: Inaonyesha tendo halisi la kujiinamisha au kujilaza chini, bila kulipanua kimya kimya kuwa dhana ya jumla ya ibada.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina maalumu יהוה; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya וְהִשְׁתַּחֲוִיתָ
  choice: utainama kifudifudi
  alternative: utasujudu au utaabudu
  rationale: Uchaguzi huu unahifadhi tendo la mwili linalotajwa wazi; tendo hilo ni la ibada, lakini tafsiri haibadilishi kitendo maalumu kuwa dhana pana zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tamko la mtoa sadaka limetiwa katika alama za kunukuu ili kutofautishwa na maagizo yanayofuata. ‘Ee Yahwe’ limewekwa mwishoni mwa tamko kwa mtiririko wa kawaida wa Kiswahili huku likihifadhi mwito wa moja kwa moja wa Kiebrania.
