  text: וַ/יּוֹצִאֵ֤/נוּ יְהוָה֙ מִ/מִּצְרַ֔יִם בְּ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְרֹ֣עַ נְטוּיָ֔ה וּ/בְ/מֹרָ֖א גָּדֹ֑ל וּ/בְ/אֹת֖וֹת וּ/בְ/מֹפְתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/008.yaml
  text: And Yahweh brought us out of Egypt with a strong hand and an outstretched arm[a], and with great terror, and with signs and wonders.
translation:
  language: sw
  text: Yahwe akatutoa Misri kwa mkono wenye nguvu, kwa mkono ulionyoshwa, kwa utisho mkuu[a], na kwa ishara na maajabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa kicho kikuu” au “kwa matendo makuu yenye kutisha.” Neno la Kiebrania linaweza kumaanisha hofu, utisho, au udhihirisho unaozalisha kicho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִאֵנוּ
  choice: akatutoa
  rationale: Kitenzi cha Kiebrania kiko katika Hiphil na maana yake ni kusababisha watoke, yaani ‘kututoa.’ Umbo ‘akatutoa’ ni la kawaida katika Kiswahili na linaendeleza simulizi la kutoka Misri.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa na cheo. ‘Yahwe’ ni tahajia inayolingana na mfumo wa sauti na uandishi wa Kiswahili.
- source_word: מִמִּצְרַיִם
  choice: Misri
  rationale: Baada ya kitenzi ‘akatutoa,’ jina ‘Misri’ linaonyesha kwa kawaida mahali walikotolewa bila kulazimika kuongeza ‘kutoka,’ ambayo ingerudia maana iliyomo tayari katika kitenzi.
- source_word: בְּיָד חֲזָקָה
  choice: kwa mkono wenye nguvu
  rationale: Hii inahifadhi taswira ya Kiebrania ya mkono kama ishara ya utendaji wenye nguvu, huku ikibaki wazi na ya kawaida katika Kiswahili.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: kwa mkono ulionyoshwa
  rationale: Neno זְרוֹעַ linaweza kumaanisha sehemu ya mkono kuanzia bega, lakini Kiswahili cha kawaida hutumia ‘mkono.’ ‘Mkono ulionyoshwa’ linahifadhi tamathali ya nguvu ya Mungu iliyo katika matendo.
- source_word: וּבְמֹרָא גָּדֹל
  choice: kwa utisho mkuu
  rationale: מוֹרָא linaweza kueleza hofu, utisho, kicho, au jambo linalozalisha hali hiyo. ‘Utisho mkuu’ linahifadhi uzito wa matendo dhidi ya Misri bila kufafanua kupita kiasi kama hali ya ndani pekee au kama matendo pekee.
- source_word: וּבְאֹתוֹת
  choice: na kwa ishara
  rationale: ‘Ishara’ ni tafsiri ya moja kwa moja na ya kawaida; muktadha unaonyesha kuwa ni ishara zisizo za kawaida bila kuongeza kivumishi kisichotajwa.
- source_word: וּבְמֹפְתִים
  choice: na maajabu
  rationale: ‘Maajabu’ linafaa katika muungano wa maneno ‘ishara na maajabu’ na linaonyesha matendo ya ajabu yaliyoonekana, bila kuyafafanua zaidi ya maandishi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia Tetragramatoni kama jina binafsi. ‘Yahwe’ hulihifadhi jina hilo kwa tahajia inayofaa Kiswahili badala ya kuweka cheo mahali pake.
- issue: Maana pana ya מוֹרָא katika simulizi la kutoka Misri
  choice: utisho mkuu
  alternative: kicho kikuu au matendo makuu yenye kutisha
  rationale: Neno linaweza kumaanisha hofu au kicho kinachozalishwa, na pia udhihirisho wenye kuleta hali hiyo. Tafsiri kuu inahifadhi uzito wake, huku tanbihi ikionyesha uwezekano mwingine bila kuondoa utata wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Marudio ya ‘kwa’ yamehifadhiwa ili kuakisi muundo wa Kiebrania na kusisitiza njia mbalimbali za tendo la Mungu. Alama ya tanbihi imewekwa baada ya ‘utisho mkuu,’ ambako utata wa kimsamiati unatokea.
