  text: וְ/הָיָה֙ כִּֽי תָב֣וֹא אֶל הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה וִֽ/ירִשְׁתָּ֖/הּ וְ/יָשַׁ֥בְתָּ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/001.yaml
  text: And when you come into the land that Yahweh your God is giving you as an inheritance[a], and you take possession of it and live in it[b],
translation:
  language: sw
  text: Na itakuwa, utakapoingia katika nchi ambayo Yahweh, Mungu wako, anakupa kuwa urithi[a], nawe utaimiliki na kuishi humo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anakupa kuwa milki.” Neno la Kiebrania linaweza kumaanisha urithi au milki iliyogawiwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “kukaa humo” au “kufanya makao humo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Na itakuwa utakapoingia
  rationale: Muundo huu wa Kiebrania unaanzisha hali ya wakati ujao. Kiswahili ‘Na itakuwa utakapoingia’ huhifadhi uzito wa utangulizi huo na kuunganisha aya hii na yanayofuata.
- source_word: תָבֹוא אֶל הָאָרֶץ
  choice: utakapoingia katika nchi
  rationale: בוא pamoja na אֶל hapa inaeleza kuingia ndani ya nchi, si kuikaribia tu; ‘kuingia katika nchi’ ni Kiswahili cha kawaida na sahihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa umbo la Kiswahili ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huhifadhi kiambishi cha nafsi ya pili umoja katika hotuba inayoielekea Israeli kama umoja.
- source_word: נֹתֵן לְךָ
  choice: anakupa
  rationale: Wakati wa sasa unaoendelea unaakisi umbo la participle ya Kiebrania na uhalisi wa zawadi iliyoahidiwa.
- source_word: נַחֲלָה
  choice: iwe urithi
  rationale: ‘Urithi’ huhifadhi maana ya mali iliyogawiwa kwa agano; ‘iwe’ huonyesha kazi au hadhi ya nchi hiyo kama urithi.
- source_word: וִירִשְׁתָּהּ
  choice: nawe utaimiliki
  rationale: Katika muktadha wa nchi, ירשׁ humaanisha kuitwaa na kuimiliki. ‘Utaimiliki’ ni ya asili kwa Kiswahili na inaepuka kurudia ‘urithi.’
- source_word: וְיָשַׁבְתָּ בָּהּ
  choice: na kukaa humo
  rationale: ישׁב hapa ina maana ya kuishi au kufanya makao katika nchi; ‘kukaa humo’ ni ya kawaida na huhifadhi upana wa kitenzi.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi yanatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya zawadi ya Mungu na umilikaji wa Israeli
  choice: Kutofautisha ‘anakupa iwe urithi’ na ‘utaimiliki’
  alternative: Kuunganisha mawazo hayo kuwa kauli moja ya kuipokea nchi
  rationale: Kiebrania huhifadhi mfuatano wa kuingia, Mungu kutoa, Israeli kumiliki, na kukaa. Tafsiri haifuti wala kutatua mvutano kati ya zawadi ya Mungu na tendo la Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Umoja wa nafsi ya pili umehifadhiwa. Sentensi imeachwa na koma kwa kuwa aya hii ni kishazi cha utangulizi kinachoendelea katika aya zinazofuata.
