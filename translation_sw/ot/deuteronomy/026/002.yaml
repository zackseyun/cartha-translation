  to: Utachukua baadhi ya malimbuko[a] ya mazao yote ya ardhi utakayoleta kutoka katika nchi yako, ambayo Yahwe Mungu wako anakupa. Utayaweka katika kikapu, kisha utaenda mahali ambapo Yahwe Mungu wako atachagua ili alifanye jina lake likae huko.[b]
