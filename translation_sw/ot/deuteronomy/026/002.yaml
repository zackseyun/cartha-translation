base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/002.yaml
  text: you shall take some of the firstfruits of all the fruit of the ground that you bring in from your land[a], which Yahweh your God is giving you, and put it in a basket[b], and go to the place that Yahweh your God will choose to make his name dwell there.
translation:
  language: sw
  text: Utachukua baadhi ya malimbuko[a] ya mazao yote ya ardhi utakayoleta kutoka katika nchi yako, ambayo Yahwe Mungu wako anakupa. Utayaweka katika kikapu, kisha utaenda mahali ambapo Yahwe Mungu wako atachagua ili alifanye jina lake likae huko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya kimapokeo, “malimbuko ya matunda yote ya ardhi.” Neno la Kiebrania linalotafsiriwa “mazao” linaweza kutaja matunda au mazao kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “ili alifanye jina lake likae huko.” Huu ni usemi wa Kumbukumbu la Torati kuhusu mahali ambapo Yahwe huchagua kulifanya jina lake likae na ambapo watu watamwabudu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: utachukua
  rationale: Katika mfululizo huu wa maagizo ya kisheria, kitenzi hiki kina nguvu ya agizo; wakati ujao wa Kiswahili unatoa maana hiyo kwa njia ya kawaida.
- source_word: מֵרֵאשִׁית כָּל פְּרִי הָאֲדָמָה
  choice: baadhi ya malimbuko ya mazao yote ya ardhi
  rationale: Neno מִן linaonyesha kuchukua sehemu kutoka katika mazao ya kwanza, si lazima kila tunda la kwanza. “Malimbuko” huhifadhi dhana ya mazao ya mwanzo, huku “mazao” likionyesha kwamba פְּרִי hapa si matunda ya miti pekee.
- source_word: אֲשֶׁר תָּבִיא מֵאַרְצְךָ
  choice: utakayoleta kutoka katika nchi yako
  rationale: Tafsiri hii huhifadhi maana ya mwendo ya Hiphil ya בוא bila kuibadili moja kwa moja kuwa “utakayovuna.”
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: ambayo Yahwe Mungu wako anakupa
  rationale: Wakati wa sasa katika “anakupa” unaonyesha utoaji unaoendelea na kusisitiza kuwa nchi ni zawadi ya Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limeandikwa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: וְשַׂמְתָּ בַטֶּנֶא
  choice: Utayaweka katika kikapu
  rationale: Kiwakilishi cha ngeli ya mazao hurejelea malimbuko yaliyokusanywa; “kikapu” ni neno la kawaida na sahihi kwa טֶנֶא.
- source_word: וְהָלַכְתָּ אֶל הַמָּקוֹם
  choice: kisha utaenda mahali
  rationale: “Kisha” huonyesha hatua inayofuata katika mfululizo wa maagizo, na “mahali” huhifadhi istilahi ya kawaida ya Kumbukumbu la Torati.
- source_word: אֲשֶׁר יִבְחַר
  choice: ambapo ... atachagua
  rationale: Wakati ujao huhifadhi mtazamo wa hotuba ya Musa kuelekea uchaguzi wa mahali utakaofanywa baadaye.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: ili kulikalisha jina lake huko
  rationale: “Kulikalisha” huhifadhi hali ya usababishaji ya kitenzi na taswira ya jina la Mungu kukaa mahali palipochaguliwa.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; “Yahwe” hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Usemi wa mahali patakatifu לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: ili kulikalisha jina lake huko
  alternative: ili kuweka jina lake huko
  rationale: 'Tafsiri iliyochaguliwa huhifadhi usemi wa Kumbukumbu la Torati na mvutano wake wa kiteolojia: jina la Mungu linakaa mahali hapo, bila kudai kwamba Mungu mwenyewe amefungiwa humo.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Sentensi imegawanywa baada ya tendo la kwanza ili kuepuka msururu mzito bila kupoteza ufuatano wa maagizo.
