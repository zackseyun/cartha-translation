  text: And he brought us to this place and gave us this land[b][a], a land flowing with milk and honey.
translation:
  language: sw
  text: Naye akatuleta mahali hapa na kutupa nchi hii, nchi inayotiririka maziwa na asali.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nchi yenye maziwa na asali tele.” Nahau ya Kiebrania inaonyesha rutuba na wingi wa mazao.
    reason: lexical_alternative
  - marker: b
    text: Katika baadhi ya miktadha, neno la Kiebrania linalotafsiriwa “asali” linaweza pia kumaanisha sharubati, kama sharubati ya tende, si asali ya nyuki pekee.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִאֵנוּ
  choice: Naye akatuleta
  rationale: 'Kitenzi cha Kiebrania ni cha kisababishi na kina kiambishi cha nafsi ya kwanza wingi: ‘alituleta.’ ‘Naye’ huendeleza simulizi bila kutaja wazi jina la mhusika ambalo halipo katika mstari huu.'
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: mahali hapa
  rationale: Huwasilisha kwa Kiswahili cha kawaida mwendo kuelekea mahali panapoonyeshwa, bila kuongeza wazo lisilo la lazima la ‘kuingia ndani.’
- source_word: וַיִּתֶּן לָנוּ
  choice: na kutupa
  rationale: Ni usemi wa kawaida na wa moja kwa moja wa tendo la kutoa kwa wapokeaji. Muundo huu unaunganika kiasili na ‘akatuleta.’
- source_word: אֶת הָאָרֶץ הַזֹּאת
  choice: nchi hii
  rationale: Katika muktadha huu אֶרֶץ ni eneo walilopewa Israeli; ‘nchi’ ni wazi na ya kawaida kuliko ‘ardhi’ kwa maana hiyo.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: nchi inayotiririka maziwa na asali
  rationale: Huhifadhi taswira halisi ya nahau ya Kiebrania huku ikibaki usemi wenye kueleweka kwa wasomaji wa Kiswahili; tanbihi inaeleza maana yake ya wingi na rutuba.
- source_word: דְבָשׁ
  choice: asali
  rationale: ‘Asali’ ndiyo maana ya kawaida na inafaa katika nahau hii, ingawa neno la Kiebrania linaweza katika baadhi ya miktadha kuhusisha sharubati ya matunda.
theological_decisions:
- issue: Mhusika wa kimungu katika ungamo la kihistoria
  choice: Kutotaja wazi ‘BWANA,’ bali kutumia mwendelezo wa kisarufi ‘Naye akatuleta’
  alternative: ‘BWANA akatuleta mahali hapa…’
  rationale: Kiebrania kina vitenzi vya nafsi ya tatu umoja bila jina la mhusika katika mstari huu. Muktadha unaonyesha kuwa ni BWANA, lakini tafsiri haiongezi jina la Mungu mahali ambapo halikutajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. Taswira ya ‘kutiririka maziwa na asali’ imehifadhiwa kwa sababu inaeleweka na hubeba nguvu ya nahau ya asili; maana yake imefafanuliwa katika tanbihi.
