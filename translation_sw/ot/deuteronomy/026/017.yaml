  text: אֶת יְהוָ֥ה הֶאֱמַ֖רְתָּ הַ/יּ֑וֹם לִ/הְיוֹת֩ לְ/ךָ֨ לֵֽ/אלֹהִ֜ים וְ/לָ/לֶ֣כֶת בִּ/דְרָכָ֗י/ו וְ/לִ/שְׁמֹ֨ר חֻקָּ֧י/ו וּ/מִצְוֺתָ֛י/ו וּ/מִשְׁפָּטָ֖י/ו וְ/לִ/שְׁמֹ֥עַ בְּ/קֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/017.yaml
  text: Today you have declared Yahweh to be your God[a], and that you will walk in his ways, keep his statutes, his commandments, and his judgments[c][b], and obey his voice.
translation:
  language: sw
  text: Leo mmemkiri Yahwe kuwa Mungu wenu, na kwamba mtatembea katika njia zake, mtashika masharti yake, amri zake na hukumu zake, na kuitii sauti yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa karibu zaidi: “na kuisikiliza sauti yake”; katika muktadha huu kusikiliza kunamaanisha pia kutii.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: הֶאֱמַרְתָּ
  choice: mmemkiri
  rationale: Kitenzi hiki cha nadra kina maana ya tamko au uthibitisho rasmi katika muktadha wa agano; “mmemkiri” ni Kiswahili cha sasa chenye uzito huo.
- source_word: הַיּוֹם
  choice: Leo
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya msisitizo wa wakati.
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: kuwa Mungu wenu
  rationale: Inaeleza uhusiano wa agano kwa Kiswahili cha kawaida; wingi umetumiwa kwa sababu msemaji anamwelekea Israeli kwa pamoja.
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: na kwamba mtatembea katika njia zake
  rationale: Inahifadhi sitiari ya kibiblia ya kutembea katika njia za Mungu huku ikionyesha wazi kuwa ni sehemu ya ahadi iliyokiriwa.
- source_word: חֻקָּיו
  choice: sheria zake
  rationale: Neno hili linarejelea masharti yaliyowekwa; “sheria” ni wazi na la heshima katika Kiswahili, ingawa linaweza kuingiliana kwa maana na istilahi nyingine za kisheria.
- source_word: מִצְוֺתָיו
  choice: amri zake
  rationale: Linahifadhi maana ya maagizo yenye mamlaka katika agano.
- source_word: מִשְׁפָּטָיו
  choice: hukumu zake
  rationale: Linadumisha tofauti ya kileksia na sheria na amri, pamoja na uhusiano wake na maamuzi au kanuni za haki.
- source_word: וְלִשְׁמֹעַ בְּקֹלוֹ
  choice: na kuitii sauti yake
  rationale: Katika muundo huu, kusikia sauti kunahusisha kuitikia kwa utii; “kuitii sauti yake” ni ya asili katika Kiswahili na bado inadumisha taswira ya sauti.
theological_decisions:
- issue: Tamko la agano na wajibu unaofuata
  choice: Kauli imetafsiriwa kuwa Israeli anamkiri Yahwe rasmi kuwa Mungu wake na kujifunga kutembea katika njia zake, kushika maagizo yake na kuitii sauti yake.
  alternative: Kufuata mfululizo wa vitenzi-jina kwa ukaribu zaidi bila kuweka wazi uhusiano wake na tamko la kwanza.
  rationale: Muundo wa Kiebrania unaunganisha kitenzi cha tamko rasmi na vifungu vya vitenzi-jina vinavyoeleza wajibu wa agano; tafsiri inaweka uhusiano huo wazi bila kuongeza fundisho la nje.
- issue: Maana ya שׁמע בקול
  choice: kuitii sauti yake
  alternative: kuisikiliza sauti yake
  rationale: Kiebrania kina maana halisi ya kusikiliza, lakini katika muktadha wa agano pia hubeba maana ya kutii. Tanbihi inahifadhi uwezekano wa tafsiri ya karibu zaidi na umbo la asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Yahwe” limetumiwa kama jina binafsi. Mstari wa Kiebrania unatumia viambishi vya nafsi ya pili umoja kumwelekea Israeli kama jumuiya; Kiswahili kimetumia wingi wa heshima/jumuiya ili kuepuka kuonekana kana kwamba mtu mmoja pekee ndiye anayelengwa.
