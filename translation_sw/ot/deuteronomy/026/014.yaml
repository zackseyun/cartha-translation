base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/014.yaml
  text: I have not eaten any of it while in mourning[a], and I have not removed any of it while unclean, and I have not given any of it for the dead. I have obeyed the voice of Yahweh my God[c][b]; I have done according to all that you commanded me.
translation:
  language: sw
  text: Sijala sehemu yoyote yake nilipokuwa katika maombolezo[a], wala sijaondoa sehemu yoyote yake nilipokuwa najisi[b], wala sijatoa sehemu yoyote yake kwa ajili ya aliyekufa[c]. Nimeitii sauti ya Yahwe Mungu wangu; nimefanya sawasawa na yote uliyoniamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika maombolezo yangu,” “katika huzuni,” au “katika mateso.”
    reason: lexical_alternative
  - marker: b
    text: Au “sikuchoma sehemu yoyote yake” au “sikuiondoa sehemu yoyote yake.” Kitenzi cha Kiebrania kinaweza kumaanisha kuchoma au kuondoa.
    reason: lexical_alternative
  - marker: c
    text: Au “kwa mtu aliyekufa” au “kuhusiana na wafu”; matumizi hasa yaliyokatazwa hayajaelezwa.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֹנִי
  choice: nilipokuwa katika maombolezo
  rationale: Neno אֹנִי linaweza kumaanisha huzuni, maombolezo, au mateso. Katika muktadha huu wa ibada na hali ya unajisi, “nilipokuwa katika maombolezo” ni Kiswahili cha kawaida kinachodokeza hali ya mwombolezaji bila kufafanua zaidi ya maandiko.
- source_word: בִעַרְתִּי מִמֶּנּוּ
  choice: sikuondoa chochote kati yake
  rationale: Kitenzi בער katika Piel kinaweza kumaanisha kuondoa, kuteketeza, au kuchoma. “Kuondoa” kinahifadhi maana pana bila kudai kwamba tendo lilikuwa kuchoma hasa.
- source_word: בְּטָמֵא
  choice: nikiwa najisi
  rationale: Kirai hiki kinaonyesha hali ya unajisi wa kiibada. Tafsiri hii ni ya asili katika Kiswahili na inahifadhi maana ya hali au wakati.
- source_word: לְמֵת
  choice: kwa ajili ya aliyekufa
  rationale: Kiebrania hakielezi matumizi yaliyokatazwa kwa undani. “Kwa ajili ya aliyekufa” kinahifadhi upana wake bila kulazimisha maana ya sadaka ya mazishi, maiti, au desturi fulani.
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: Nimeitii sauti
  rationale: Nahau hii ya Kiebrania humaanisha kusikia kunakoambatana na kutii. “Nimeitii sauti” inadumisha picha ya sauti huku ikionyesha mwitikio wa utii.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa uhamishaji wa sauti kama “Yahwe” badala ya kubadilishwa na cheo.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתָנִי
  choice: sawasawa na yote uliyoniamuru
  rationale: Kirai hiki kinaonyesha kwamba msemaji alifuata maagizo yote. Maneno haya ni wazi, yenye hadhi, na yanafaa kwa tamko hili rasmi.
theological_decisions:
- issue: Maana ya matumizi yaliyokatazwa katika לְמֵת
  choice: kwa ajili ya aliyekufa
  alternative: kwa ibada za mazishi; kwa mtu aliyekufa; kuhusiana na maiti
  rationale: Maandishi ya Kiebrania hayasemi tendo mahususi lililokusudiwa. Tafsiri pana inaacha utata huo bila kuingiza ufafanuzi wa kimadhehebu au wa desturi fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa urahisi. Muundo wa tamko rasmi umehifadhiwa, na istilahi “najisi” imetumiwa kwa maana yake ya kiibada.
