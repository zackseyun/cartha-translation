source:
  edition: WLC
  text: וְ/אָמַרְתָּ֡ לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בִּעַ֧רְתִּי הַ/קֹּ֣דֶשׁ מִן הַ/בַּ֗יִת וְ/גַ֨ם נְתַתִּ֤י/ו לַ/לֵּוִי֙ וְ/לַ/גֵּר֙ לַ/יָּת֣וֹם וְ/לָ/אַלְמָנָ֔ה כְּ/כָל מִצְוָתְ/ךָ֖ אֲשֶׁ֣ר צִוִּיתָ֑/נִי לֹֽא עָבַ֥רְתִּי מִ/מִּצְוֺתֶ֖י/ךָ וְ/לֹ֥א שָׁכָֽחְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/013.yaml
  text: Then you shall say before Yahweh your God[a], ‘I have removed the holy portion from the house, and I have also given it to the Levite, the sojourner, the fatherless, and the widow, according to all your commandment that you commanded me. I have not transgressed your commandments[c][b], nor have I forgotten them.’
translation:
  language: sw
  text: Kisha utasema mbele za Yahweh, Mungu wako, ‘Nimeondoa sehemu takatifu[a] kutoka nyumbani, nami pia nimeitoa kwa Mlawi, mgeni mkazi[b], yatima[c], na mjane, kulingana na amri yako yote uliyoniamuru. Sikuvunja amri zako wala sikuzisahau.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sehemu iliyowekwa wakfu” au “kitu kitakatifu.” Kiebrania kinarejelea zaka au mazao yaliyotengwa ili yagawiwe.
    reason: lexical_alternative
  - marker: b
    text: Yaani, mtu wa kigeni aliyeishi miongoni mwa Waisraeli.
    reason: lexical_clarification
  - marker: c
    text: Neno la Kiebrania linaweza pia kutafsiriwa “asiye na baba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Kisha utasema
  rationale: Muundo huu unaendeleza hatua zinazofuatana katika ibada; “kisha” unaonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: mbele za Yahweh, Mungu wako
  rationale: “Mbele za” huwasilisha maana ya kuwa katika uwepo wa Mungu, huku Yahweh ikihifadhi jina la agano lililoandikwa katika Kiebrania.
- source_word: בִּעַרְתִּי
  choice: Nimeondoa
  rationale: Katika muktadha huu kitenzi kinamaanisha kuondoa au kusafisha kutoka nyumbani, si kuteketeza kwa moto.
- source_word: הַקֹּדֶשׁ
  choice: sehemu takatifu
  rationale: Neno hilo humaanisha kitu kilichowekwa wakfu; hapa ni sehemu ya mazao au zaka iliyotengwa ili igawiwe.
- source_word: מִן הַבַּיִת
  choice: nyumbani
  rationale: Kiebrania kina “kutoka katika nyumba”; “nyumbani” ni Kiswahili cha asili na huonyesha nyumba ya anayetoa tamko hilo bila kuongeza maelezo yasiyohitajika.
- source_word: וְגַם נְתַתִּיו
  choice: nami pia nimewapa
  rationale: Kauli inaonyesha kwamba sehemu iliyotajwa ilitolewa kwa makundi yanayofuata; Kiswahili hutumia kwa kawaida “nimewapa” huku kitu kinachotolewa kikieleweka kutokana na sentensi iliyotangulia.
- source_word: לַלֵּוִי
  choice: Mlawi
  rationale: Maandishi yanataja Mlawi, wala hayalazimishi maana finyu ya kuhani.
- source_word: לַגֵּר
  choice: mgeni mkazi
  rationale: גֵּר ni mtu wa kigeni anayeishi miongoni mwa jamii, si mgeni anayepita tu.
- source_word: לַיָּתוֹם
  choice: yatima
  rationale: “Yatima” ni istilahi ya kawaida ya Kiswahili kwa kundi hili la watu walio hatarini kijamii; katika mazingira ya kale neno la Kiebrania linaweza kumaanisha hasa asiye na baba.
- source_word: וְלָאַלְמָנָה
  choice: mjane
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kundi hili la kijamii.
- source_word: כְּכָל מִצְוָתְךָ אֲשֶׁר צִוִּיתָנִי
  choice: kulingana na amri yako yote uliyoniamuru
  rationale: Tafsiri hii inadumisha umoja wa “amri” wenye maana ya kijumla na pia marudio ya mzizi wa kuamuru katika chanzo.
- source_word: לֹא עָבַרְתִּי מִמִּצְוֺתֶיךָ
  choice: Sikuvunja amri zako
  rationale: Katika muktadha huu עבר מן humaanisha kuvuka mpaka wa amri, yaani kuivunja au kuikiuka.
- source_word: וְלֹא שָׁכָחְתִּי
  choice: wala sikuzisahau
  rationale: Kiwakilishi cha wingi kinarejelea amri zilizotajwa mara moja kabla yake.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni; “Yahweh” huhifadhi jina la agano badala ya kulibadili kuwa cheo.
- issue: Maana ya הַקֹּדֶשׁ katika tamko la ibada
  choice: sehemu takatifu
  alternative: kitu kitakatifu
  rationale: “Sehemu takatifu” inaonyesha kitu kilichowekwa wakfu kwa Mungu na kutengwa kwa ajili ya ugawaji, bila kukitambulisha kwa namna finyu kuliko muktadha unavyoruhusu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa lakini yenye heshima. Muundo wa tamko la kiibada na marudio ya “amri/uliyoniamuru” yamehifadhiwa, huku sentensi ikibaki wazi kwa msomaji wa kawaida.
