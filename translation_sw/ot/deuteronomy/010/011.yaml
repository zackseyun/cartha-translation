  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י ק֛וּם לֵ֥ךְ לְ/מַסַּ֖ע לִ/פְנֵ֣י הָ/עָ֑ם וְ/יָבֹ֨אוּ֙ וְ/יִֽרְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁר נִשְׁבַּ֥עְתִּי לַ/אֲבֹתָ֖/ם לָ/תֵ֥ת לָ/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/011.yaml
  text: And Yahweh said to me[a], “Arise, go before the people for the journey[c][b], so that they may go in and take possession of the land that I swore to their fathers to give to them.”
translation:
  language: sw
  text: Yahwe akaniambia, “Inuka, uondoke mbele ya watu katika safari[a], ili waingie na kuimiliki nchi niliyowaapia babu zao kwamba nitawapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uondoke ukiwaongoza watu katika safari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: קוּם
  choice: Inuka
  rationale: Amri hii inaonyesha kuanza kutenda mara moja na inadumisha uzito wa usemi bila kutumia lugha ya kizamani.
- source_word: לֵךְ לְמַסַּע לִפְנֵי הָעָם
  choice: uondoke mbele ya watu katika safari
  rationale: Tafsiri hii inahifadhi wazo la kuanza safari na maana ya mahali ya לִפְנֵי, yaani kuwa mbele ya watu, bila kulazimisha maana ya uongozi pekee.
- source_word: וְיָבֹאוּ וְיִרְשׁוּ
  choice: ili waingie na kuimiliki
  rationale: Muundo wa vitenzi baada ya amri unaonyesha kusudi au matokeo; ‘kuimiliki’ linaonyesha kuchukua nchi iwe milki yao.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha huu neno linarejelea nchi ya ahadi; ‘nchi’ ni la kawaida na wazi katika Kiswahili.
- source_word: נִשְׁבַּעְתִּי
  choice: niliyowaapia
  rationale: Kitenzi hiki kinahifadhi lugha ya kiapo cha Mungu, huku kiambishi cha yambwa kikirejelea waliopokea ahadi.
- source_word: לַאֲבֹתָם
  choice: babu zao
  rationale: Ingawa neno la Kiebrania ni ‘baba zao,’ hapa linawarejelea mababu wa Israeli waliopokea ahadi; ‘babu zao’ ni Kiswahili cha asili na kinadumisha rejeo la kihistoria la kiume.
- source_word: לָתֵת לָהֶם
  choice: kwamba nitawapa
  rationale: Katika Kiswahili, muundo huu unaeleza kwa kawaida kwamba kiapo kilihusu kuwapa wao nchi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Unukuzi wa jina binafsi unahifadhi tofauti kati ya jina la Mungu na cheo, kama ilivyo katika matini ya Kiebrania.
- issue: Maana ya לִפְנֵי הָעָם
  choice: mbele ya watu
  alternative: akiwaongoza watu
  rationale: ‘Mbele ya watu’ huhifadhi maana ya moja kwa moja ya mahali na pia inaweza kudokeza uongozi, bila kuufanya udokezo huo kuwa maana pekee.
- issue: Uwasilishaji wa לַאֲבֹתָם
  choice: babu zao
  alternative: baba zao
  rationale: ‘Babu zao’ linaeleweka kwa kawaida kuwa mababu wa kihistoria waliopokea ahadi, huku likiepuka maana ya baba zao wa karibu ambayo ‘baba zao’ inaweza kutoa katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya usimulizi wa Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio umefanywa wa asili kwa Kiswahili huku maana ya safari, kuwa mbele ya watu, kiapo, na kuimiliki nchi ikihifadhiwa.
