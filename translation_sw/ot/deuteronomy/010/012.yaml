source:
  edition: WLC
  text: וְ/עַתָּה֙ יִשְׂרָאֵ֔ל מָ֚ה יְהוָ֣ה אֱלֹהֶ֔י/ךָ שֹׁאֵ֖ל מֵ/עִמָּ֑/ךְ כִּ֣י אִם לְ֠/יִרְאָה אֶת יְהוָ֨ה אֱלֹהֶ֜י/ךָ לָ/לֶ֤כֶת בְּ/כָל דְּרָכָי/ו֙ וּ/לְ/אַהֲבָ֣ה אֹת֔/וֹ וְ/לַֽ/עֲבֹד֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/012.yaml
  text: And now[a], Israel, what does Yahweh your God ask of you, except to fear Yahweh your God, to walk in all his ways, to love him[c][b], and to serve Yahweh your God with all your heart and with all your soul?
translation:
  language: sw
  text: Basi sasa, Israeli, Yahwe Mungu wako anataka nini kutoka kwako[a], ila tu umwogope[b] Yahwe Mungu wako, utembee katika njia zake zote, umpende, na umtumikie Yahwe Mungu wako kwa moyo wako wote na kwa nafsi yako yote[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anadai nini kutoka kwako.” Kitenzi cha Kiebrania kinaweza kumaanisha kutaka jambo ambalo mtu ana wajibu wa kufanya.
    reason: lexical_alternative
  - marker: b
    text: “Kumwogopa” hapa kunajumuisha kuwa na kicho na heshima kuu kwa Yahwe, pamoja na kujitolea kwa Yahwe na kumtii.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa uhai wako wote” au “kwa utu wako wote.” Neno la Kiebrania נֶפֶשׁ (nefesh) linaweza kumaanisha nafsi, uhai, au mtu mwenyewe kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huhifadhi kiunganishi cha hoja na mpito wa wito wa Musa kwa lugha ya kawaida na yenye hadhi.
- source_word: מָה ... שֹׁאֵל מֵעִמָּךְ
  choice: anataka nini kutoka kwako
  rationale: Kitenzi שׁאל katika muundo huu kinaweza kumaanisha kuomba au kutaka jambo lenye wajibu; tafsiri hii hudumisha swali la balagha bila kulifanya kuwa amri ya moja kwa moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni namna ya Kiswahili ya kuandika jina binafsi la Mungu linalowakilishwa na herufi YHWH, badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Kiambishi ni cha nafsi ya pili, umoja wa kiume; Israeli anasemeshwa kwa pamoja kama mtu mmoja.
- source_word: כִּי אִם
  choice: ila tu
  rationale: Hutambulisha na kuweka mpaka kwa yale yanayotakiwa katika swali hili la balagha.
- source_word: לְיִרְאָה
  choice: umwogope
  rationale: Huhifadhi uzito wa ירא, unaojumuisha hofu, kicho, heshima kuu na utiifu wa agano, bila kuupunguza kuwa heshima tu.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: utembee katika njia zake zote
  rationale: Huhifadhi sitiari ya Kiebrania ya ‘kutembea’ kama mwenendo wa maisha, nayo inaeleweka kwa Kiswahili.
- source_word: וּלְאַהֲבָה אֹתוֹ
  choice: umpende
  rationale: Huwasilisha moja kwa moja upendo kwa Yahwe wenye hali ya uhusiano na agano.
- source_word: וְלַעֲבֹד
  choice: umtumikie
  rationale: עבד hapa ni pana kuliko ibada ya kidini pekee; inajumuisha huduma, utiifu na kujitoa kwa Mungu.
- source_word: בְּכָל לְבָבְךָ
  choice: kwa moyo wako wote
  rationale: ‘Moyo’ huwakilisha utu wa ndani, kutia ndani nia, fikra na utashi, na ni usemi wa kawaida wa Kiswahili.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: kwa nafsi yako yote
  rationale: נפש inaweza kumaanisha nafsi, uhai au mtu mwenyewe; ‘nafsi’ huhifadhi taswira ya chanzo huku tanbihi ikionyesha upana wake.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya ירא katika wito wa agano
  choice: umwogope
  alternative: umche Mungu / umstahi
  rationale: ‘Umwogope’ huhifadhi mvutano wa maana unaohusisha hofu, kicho, heshima kuu na utiifu, bila kuupunguza kuwa staha pekee.
- issue: Maana ya נפש katika usemi wa kujitoa kikamilifu
  choice: nafsi yako yote
  alternative: uhai wako wote / utu wako wote
  rationale: ‘Nafsi’ ni tafsiri halali, lakini neno la Kiebrania linaweza pia kuelekeza kwa uhai au mtu mzima; utata huo umehifadhiwa kwa tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Israeli anasemeshwa kwa umoja kama katika Kiebrania. Sitiari ya ‘kutembea katika njia’ imehifadhiwa kwa sababu inaeleweka na hudumisha taswira ya mwenendo wa maisha.
