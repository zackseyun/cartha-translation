base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/003.yaml
  text: So I made an ark of acacia wood and cut two stone tablets like the first ones[a], and I went up the mountain with the two tablets in my hand.
translation:
  language: sw
  text: Kwa hiyo nikatengeneza sanduku kwa mbao za mshita, nikakata vibao viwili vya mawe kama vya kwanza[a], kisha nikapanda mlimani, nikiwa na vibao hivyo viwili mkononi mwangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, nikachonga vibao viwili vya mawe kama vya kwanza.
    reason: Njia nyingine ya kutafsiri פסל; ulinganisho כָּרִאשֹׁנִים unabaki “kama vya kwanza.”
lexical_decisions:
- source_word: אֲרוֹן
  choice: sanduku
  rationale: Neno hili humaanisha sanduku au chombo cha kuhifadhia; katika muktadha huu “sanduku” ni Kiswahili cha kawaida na chenye heshima, bila kuongeza kirai “la agano” ambacho hakipo wazi katika mstari huu.
- source_word: עֲצֵי שִׁטִּים
  choice: mbao za mshita
  rationale: Tafsiri hii inahifadhi aina mahususi ya mti na ni ya kawaida katika Kiswahili cha Biblia.
- source_word: וָאֶפְסֹל
  choice: nikachonga
  rationale: Kitenzi פסל hapa kinaeleza kutengeneza vibao kwa kukata au kuchonga jiwe; “nikachonga” ni cha asili na kinaonyesha tendo la kuvipa umbo.
- source_word: לֻחֹת אֲבָנִים
  choice: vibao viwili vya mawe
  rationale: “Vibao vya mawe” ni usemi wa kawaida unaoonyesha wazi kwamba vibao hivyo vilitengenezwa kwa mawe.
- source_word: כָּרִאשֹׁנִים
  choice: kama vile vya kwanza
  rationale: Inahifadhi ulinganisho wa vibao hivi na vile vya awali bila kueleza zaidi namna vilivyofanana.
- source_word: וָאַעַל הָהָרָה
  choice: nikapanda mlimani
  rationale: Kitenzi na kiishio kinachoonyesha mwelekeo vinaeleza kupanda juu ya mlima, si kwenda tu kuelekea mlimani.
- source_word: בְּיָדִי
  choice: mkononi mwangu
  rationale: Inahifadhi umoja wa Kiebrania na ni usemi wa kawaida wa Kiswahili kwa kitu kinachobebwa.
- source_word: וָאַעַשׂ
  choice: nikatengeneza
  rationale: Kitenzi עשה ni cha jumla, “kufanya/kutengeneza”; hapa “nikatengeneza” linafaa kwa kutengeneza sanduku.
theological_decisions:
- issue: Jina la chombo kitakatifu cha kuhifadhia vibao
  choice: sanduku
  alternative: Sanduku la Agano
  rationale: “Sanduku” linatafsiri אֲרוֹן moja kwa moja. Kuongeza “la Agano” kungefafanua utambulisho wake kutokana na muktadha mpana, lakini maneno hayo hayapo katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi wenye viunganishi “nikatengeneza… nikachonga… nikapanda” unafuata mfululizo wa vitendo vya Kiebrania huku ukisomeka kwa urahisi.
