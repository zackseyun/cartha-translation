id: DEU.10.1
reference: Deuteronomy 10:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בָּ/עֵ֨ת הַ/הִ֜וא אָמַ֧ר יְהוָ֣ה אֵלַ֗/י פְּסָל לְ/ךָ֞ שְׁנֵֽי לֻוחֹ֤ת אֲבָנִים֙ כָּ/רִ֣אשֹׁנִ֔ים וַ/עֲלֵ֥ה אֵלַ֖/י הָ/הָ֑רָ/ה וְ/עָשִׂ֥יתָ לְּ/ךָ֖ אֲר֥וֹן עֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/001.yaml
  text: At that time Yahweh said to me[a], ‘Carve for yourself two stone tablets like the first ones, and come up to me on the mountain[b], and make for yourself a wooden ark.’
translation:
  language: sw
  text: Wakati huo Yahweh aliniambia, “Jichongee vibao viwili vya mawe kama vile vya kwanza, kisha panda uje kwangu mlimani, na ujitengenezee sanduku la mbao.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: Wakati huo
  rationale: Ni usemi wa kawaida wa Kiswahili unaoweka wakati wa simulizi na kuhifadhi maana ya kurejelea wakati uliotajwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Kiebrania limeandikwa kwa namna ya kulitamka badala ya kubadilishwa kuwa cheo.
- source_word: פְּסָל לְךָ
  choice: Jichongee
  rationale: Kitenzi hiki kinaonyesha kuchonga au kutengeneza kwa kukata jiwe, na muundo wa kujirejelea unahifadhi maana ya לְךָ, ‘kwa ajili yako mwenyewe.’
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: mbao mbili za mawe
  rationale: ‘Mbao za mawe’ ni usemi unaotambulika katika muktadha wa vibao vya agano, huku ‘mbili’ ikihifadhi idadi ya asili.
- source_word: כָּרִאשֹׁנִים
  choice: kama zile za kwanza
  rationale: Hurejelea wazi mbao za awali na kuhifadhi ulinganisho wa Kiebrania.
- source_word: וַעֲלֵה אֵלַי הָהָרָה
  choice: kisha panda uje kwangu mlimani
  rationale: ‘Panda’ huonyesha mwendo wa kwenda juu, ‘uje kwangu’ huhifadhi אֵלַי, na ‘mlimani’ huonyesha mahali pa kufikiwa kwa Kiswahili cha kawaida.
- source_word: וְעָשִׂיתָ לְּךָ אֲרוֹן עֵץ
  choice: na ujitengenezee sanduku la mbao
  rationale: ‘Sanduku’ linawakilisha אֲרוֹן bila kuongeza neno ‘agano,’ ambalo halimo katika mstari huu; muundo ‘ujitengenezee’ unahifadhi maana ya kujifanyia.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Utambulisho wa אֲרוֹן
  choice: sanduku
  alternative: sanduku la agano
  rationale: Mstari unasema tu ‘sanduku la mbao.’ Kuongeza ‘la agano’ kungefafanua kwa muktadha, lakini kungeingiza maneno yasiyopo katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa amri umewekwa kwa lugha ya kawaida; ‘kisha’ linaonyesha mfuatano unaodokezwa na viunganishi vya Kiebrania bila kufanya sentensi kuwa nzito.
