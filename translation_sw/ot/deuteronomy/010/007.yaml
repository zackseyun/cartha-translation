base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/007.yaml
  text: From there they set out for Gudgodah[a], and from Gudgodah to Jotbathah, a land of streams of water.
translation:
  language: sw
  text: Kutoka huko waliondoka kuelekea Gudgoda, na kutoka Gudgoda wakaenda Yotbatha, nchi yenye vijito vya maji.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nchi yenye mikondo ya maji” au “nchi yenye njia za maji.” Kirai cha Kiebrania נַחֲלֵי מָיִם kinaweza kumaanisha vijito, mikondo, au njia ambazo maji hutiririka.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: Kutoka huko
  rationale: Kirai hiki kinaonyesha kuondoka mahali palipotajwa awali; ‘Kutoka huko’ ni Kiswahili cha kawaida na huhifadhi mfuatano wa maeneo.
- source_word: נָסְעוּ
  choice: waliondoka kuelekea
  rationale: Katika masimulizi ya safari jangwani, kitenzi נסע mara nyingi humaanisha kuondoka au kuvunja kambi na kuanza safari. ‘Waliondoka kuelekea’ huhifadhi wazo la kuanza safari na pia huunganika vizuri na jina la mahali linalofuata.
- source_word: הַגֻּדְגֹּדָה
  choice: Gudgoda
  rationale: Ni jina la mahali; limenukuliwa kwa tahajia inayofaa Kiswahili badala ya kutafsiriwa.
- source_word: וּמִן
  choice: na kutoka
  rationale: Huendeleza kwa urahisi orodha ya hatua za safari bila kuongeza maana ya kiufafanuzi.
- source_word: יָטְבָתָה
  choice: Yotbatha
  rationale: Ni jina la mahali; tahajia ya Kiswahili hutumia Y kuwakilisha konsonanti ya mwanzo ya Kiebrania.
- source_word: אֶרֶץ
  choice: nchi yenye
  rationale: Neno hili linaeleza sifa ya Yotbatha. Muundo ‘nchi yenye’ ni wa asili katika Kiswahili na huunganisha maelezo yanayofuata.
- source_word: נַחֲלֵי מָיִם
  choice: vijito vya maji
  rationale: Kirai hiki humaanisha vijito, mikondo, au njia za maji. ‘Vijito vya maji’ ni wazi kwa wasomaji wa kawaida huku kikihifadhi picha ya maji yanayotiririka.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa urahisi. Majina ya maeneo yamenukuliwa kwa tahajia ya Kiswahili. Alama ya tanbihi imewekwa baada ya kirai kinachohusika, ‘vijito vya maji.’
