    text: Kwa maana halisi, “mkate.” Hapa “mkate” huwakilisha chakula au riziki kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה מִשְׁפַּט
  choice: huwatendea haki
  rationale: Muungano huu unamaanisha kutekeleza au kusimamia haki kwa niaba ya watu wanaotajwa. “Huwatendea haki” ni Kiswahili cha kawaida kinachohifadhi uzito wa kisheria na kimaadili.
- source_word: יָתוֹם
  choice: yatima
  rationale: “Yatima” ndilo neno la kawaida na linaloeleweka katika Kiswahili kwa mtu aliyefiwa na mzazi; tanbihi inabainisha kwamba hapa Kiebrania kinamlenga hasa aliyekosa baba.
- source_word: אַלְמָנָה
  choice: mjane
  rationale: Hili ni neno la kawaida na sahihi kwa kundi hili la kijamii lililo katika mazingira hatarishi.
- source_word: אֹהֵב
  choice: humpenda
  rationale: Linatafsiri moja kwa moja tendo na mwelekeo hai wa Mungu kwa mgeni bila kulipunguza kuwa hisia tu.
- source_word: גֵּר
  choice: mgeni mkazi
  rationale: Neno hili linamtaja mtu asiye mzawa anayeishi miongoni mwa Israeli, si msafiri anayepita tu. “Mgeni mkazi” huhifadhi maana hiyo ya kijamii na kisheria.
- source_word: לָתֶת לוֹ
  choice: akimpa
  rationale: Muundo huu unaunganisha upendo wa Mungu na namna unavyoonekana kwa vitendo katika kumpatia mahitaji ya msingi.
- source_word: לֶחֶם
  choice: chakula
  rationale: Ingawa maana ya moja kwa moja ni “mkate,” katika jozi hii neno linawakilisha riziki au chakula kwa ujumla; “chakula” ni cha asili katika Kiswahili cha sasa.
- source_word: שִׂמְלָה
  choice: mavazi
  rationale: Ni tafsiri ya kawaida ya nguo au vazi na inafaa katika orodha ya mahitaji ya msingi.
theological_decisions:
- issue: Jinsi Mungu anavyowajali walio katika mazingira hatarishi
  choice: Aya inaonyesha kwamba Mungu hutenda haki na pia hupenda kwa kutoa mahitaji halisi.
  alternative: Kusisitiza utetezi wa kisheria pekee au huruma ya kihisia pekee.
  rationale: Kiebrania kinaweka pamoja tendo la haki, upendo, na utoaji wa chakula na mavazi. Tafsiri inahifadhi vipengele vyote bila kuongeza hitimisho pana la kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. “Mgeni mkazi” limetumiwa kuhifadhi maana maalumu ya kijamii na kisheria ya גֵּר, huku tanbihi ikitoa maelezo ya lazima.
