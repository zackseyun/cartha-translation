  text: He executes justice for the fatherless and the widow[a], and loves the sojourner[c][b], giving him food and clothing.
translation:
  language: sw
  text: Huwatendea haki yatima[a] na mjane, na humpenda mgeni mkazi[b], akimpa chakula[c] na mavazi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliyekosa baba.” Neno la Kiebrania יָתוֹם humaanisha hasa mtu asiye na baba; “yatima” ni neno la kawaida zaidi katika Kiswahili.
    reason: lexical_alternative
  - marker: b
    text: Yaani, mtu asiye mzawa anayeishi miongoni mwa Waisraeli, wala si mgeni anayepita tu. Pia inaweza kutafsiriwa “mgeni.”
    reason: lexical_alternative
