base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/014.yaml
  text: Behold[a], to Yahweh your God belong the heavens, even the highest heavens, the earth, and all that is in it.
translation:
  language: sw
  text: Tazama, mbingu, hata mbingu za juu kabisa,[a] dunia, na vyote vilivyomo ni mali ya Yahweh Mungu wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “mbingu na mbingu za mbingu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Chembe hii huvuta fikira na kutia mkazo. “Tazama” inadumisha uzito wa tangazo la Kiebrania kwa Kiswahili cha kibiblia kinachoeleweka.
- source_word: לַיהוָה
  choice: ni mali ya Yahweh
  rationale: Kiambishi ל kinaonyesha umilikaji hapa. Muundo “ni mali ya Yahweh” unaeleza kwa uwazi na kwa Kiswahili cha kawaida kwamba vitu vyote vilivyotajwa ni vyake.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Kiambishi cha nafsi ya pili, umoja wa kiume, kinadumishwa kwa “wako,” hivyo kuhifadhi usemi wa agano unaomwelekea Israeli.
- source_word: הַשָּׁמַיִם
  choice: mbingu
  rationale: “Mbingu” inafaa upeo wa ulimwengu mzima kuliko “anga,” ambalo lingeweza kueleweka kuwa anga linaloonekana tu.
- source_word: וּשְׁמֵי הַשָּׁמָיִם
  choice: hata mbingu zilizo juu kabisa
  rationale: Muundo halisi “mbingu za mbingu” hutumika kutia kiwango cha juu kabisa. “Hata mbingu zilizo juu kabisa” huwasilisha maana hiyo kwa Kiswahili cha sasa, huku tafsiri ya karibu zaidi ikihifadhiwa katika tanbihi.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: Ulinganifu na mbingu pamoja na kutajwa kwa vyote vilivyomo unaonyesha maana ya ulimwengu mzima, si nchi fulani.
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: na vyote vilivyomo
  rationale: Hii inawakilisha kwa ufupi na kwa kawaida jumla ya kila kilichomo duniani, huku ikidumisha rejeo la ndani la בָּהּ.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina la agano יְהוָה moja kwa moja. “Yahweh” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umetengenezwa kwa mtiririko wa kawaida wa Kiswahili huku umilikaji wa Yahweh, upeo wa ulimwengu mzima, na mkazo wa usemi wa Kiebrania vikihifadhiwa.
