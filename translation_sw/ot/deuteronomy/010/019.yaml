  yaml_path: translation/ot/deuteronomy/010/019.yaml
  text: So love the foreigner[a], because you were foreigners in the land of Egypt.
translation:
  language: sw
  text: Kwa hiyo, mpendeni mgeni[a], kwa maana ninyi wenyewe mlikuwa wageni katika nchi ya Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkaaji mgeni.” Neno la Kiebrania ger humaanisha mtu asiye mzawa anayeishi miongoni mwa Waisraeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲהַבְתֶּם
  choice: Kwa hiyo, mpendeni
  rationale: Kitenzi אהב kina maana ya ‘kupenda.’ Kiunganishi וַ hapa kinaunganisha agizo hili na mstari uliotangulia, unaoeleza kwamba Mungu anampenda mgeni; kwa hiyo, ‘Kwa hiyo, mpendeni’ huwasilisha kwa Kiswahili cha kawaida uhusiano huo wa kimantiki pamoja na nguvu ya agizo kwa wingi.
- source_word: הַ/גֵּר
  choice: mgeni
  rationale: גֵּר humaanisha mtu asiye mzawa anayeishi miongoni mwa Israeli, mara nyingi akiwa katika hali dhaifu kijamii. ‘Mgeni’ ni neno la kawaida na linaloeleweka katika Kiswahili; tanbihi inafafanua kwamba hapa si mgeni wa muda mfupi tu.
- source_word: כִּי
  choice: kwa maana
  rationale: כִּי inatanguliza sababu ya agizo. ‘Kwa maana’ ni usemi wa kawaida, wenye hadhi, unaoonyesha uhusiano wa kisababishi.
- source_word: גֵרִים
  choice: wageni
  rationale: Huu ni wingi wa גֵּר. Kutumia ‘wageni’ kunadumisha mshikamano wa msamiati na ‘mgeni’ katika sehemu ya kwanza ya mstari.
- source_word: הֱיִיתֶם
  choice: mlikuwa
  rationale: 'Kitenzi היה hapa kina maana rahisi ya hali iliyokuwapo zamani: Waisraeli waliishi wakiwa wageni huko Misri.'
- source_word: בְּ/אֶרֶץ מִצְרָיִם
  choice: katika nchi ya Misri
  rationale: Tafsiri hii inadumisha אֶרֶץ, ‘nchi,’ badala ya kufupisha kuwa ‘huko Misri,’ huku ikibaki ya asili katika Kiswahili.
theological_decisions:
- issue: Utambulisho wa kijamii unaoonyeshwa na גֵּר katika sheria ya agano
  choice: mgeni
  alternative: mkaaji mgeni; mtu wa ugenini
  rationale: Mstari unategemeza wajibu wa Israeli wa kumpenda mtu wa nje kwa kukumbusha historia yao wenyewe ya kuishi kama watu wasio wazawa katika hali ya utegemezi. ‘Mgeni’ huwasilisha hali ya kuwa mtu wa nje bila kuingiza kategoria za kisasa za kisheria; tanbihi huhifadhi maana maalumu ya ukaaji miongoni mwa jamii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ninyi wenyewe’ husisitiza uzoefu wa wasikilizaji bila kubadili maana, na ‘katika nchi ya Misri’ huhifadhi muundo wa Kiebrania.
