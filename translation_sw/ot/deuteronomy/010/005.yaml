base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/005.yaml
  text: Then I turned and came down from the mountain[a], and I put the tablets in the ark that I had made; and they are there, just as Yahweh commanded me.
translation:
  language: sw
  text: Kisha nikageuka, nikashuka kutoka mlimani, nikaviweka vile vibao ndani ya sanduku nililotengeneza; nayo yako humo[a], kama Yahwe alivyoniamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “yakawa huko”; maneno haya yanaweza pia kumaanisha kwamba yaliendelea kuwamo humo hadi wakati Musa alipokuwa akisema.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵפֶן
  choice: Kisha nikageuka
  rationale: Kitenzi פנה humaanisha ‘kugeuka.’ ‘Kisha’ kinaonyesha mfuatano wa simulizi unaobebwa na waw-consecutive kwa Kiswahili cha kawaida.
- source_word: וָאֵרֵד מִן הָהָר
  choice: nikashuka kutoka mlimani
  rationale: ירד humaanisha kushuka; muundo huu unaonyesha wazi mwendo wa kutoka kwenye mlima uliotajwa.
- source_word: וָאָשִׂם אֶת הַלֻּחֹת
  choice: nikayaweka yale mabamba
  rationale: שׂים ni ‘kuweka,’ na לֻחוֹת ni mabamba yenye uso tambarare ya kuandikiwa. ‘Yale’ huyarejelea mabamba yanayojulikana tayari katika muktadha bila kuongeza neno ‘mawe,’ ambalo halimo katika kishazi hiki.
- source_word: בָּאָרוֹן
  choice: ndani ya sanduku
  rationale: אָרוֹן ni sanduku au ark; ‘sanduku’ ni neno la kawaida na lenye kueleweka, huku ‘ndani ya’ likionyesha mahali yalipowekwa.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: nililokuwa nimetengeneza
  rationale: Kishazi hiki kinarejelea sanduku na kinaonyesha kuwa kulitengeneza kulitangulia tendo la kuyaweka mabamba.
- source_word: וַיִּהְיוּ שָׁם
  choice: nayo yakawa humo
  rationale: Tafsiri hii inafuata kwa karibu hali inayoelezwa na היה pamoja na שׁם, bila kulazimisha maana ya ‘yalibaki,’ ingawa maana hiyo inaweza kudokezwa.
- source_word: כַּאֲשֶׁר צִוַּנִי
  choice: kama ... alivyoniamuru
  rationale: כַּאֲשֶׁר huonyesha ulinganifu, ‘kama/jinsi,’ na צוה pamoja na kiambishi cha nafsi ya kwanza ni ‘alivyoniamuru.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kwa tahajia ya kawaida ya Kiswahili ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina binafsi kwa tahajia inayofaa Kiswahili.
- issue: Iwapo וַיִּהְיוּ שָׁם isemwe wazi kuwa mabamba yalibaki humo
  choice: nayo yakawa humo
  alternative: nayo yakabaki humo
  rationale: ‘Yakawa humo’ huhifadhi usemi wa Kiebrania usioeleza moja kwa moja muda wa kubaki; uwezekano wa maana endelevu umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi mfuatano wa simulizi na haijaongeza ‘mawe,’ kwa kuwa neno hilo halipo katika mstari huu. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika, yaani ‘yakawa humo.’
