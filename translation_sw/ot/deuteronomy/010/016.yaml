  text: So circumcise the foreskin of your heart[c][b][a], and do not stiffen your neck any longer.
translation:
  language: sw
  text: Basi[a], tahirini govi la moyo wenu[b], wala msiifanye shingo yenu kuwa ngumu tena[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na tahirini govi la moyo wenu.” Kiunganishi cha Kiebrania kinaweza kueleweka kama kiunganishi cha kawaida, ingawa muktadha pia unaunga mkono maana ya hitimisho, “Basi” au “Kwa hiyo.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinadumisha sitiari halisi, “govi la moyo wenu,” picha ya kuondoa upinzani wa ndani dhidi ya Mungu.
    reason: cultural_note
  - marker: c
    text: Au, “msiufanye shingo yenu iwe ngumu tena” au “msiwe tena wenye shingo ngumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְתֶּם
  choice: Basi, tahirini
  rationale: Kitenzi cha Kiebrania ni Qal timilifu, nafsi ya pili wingi, chenye kiunganishi; katika muktadha huu kina nguvu ya agizo linalotokana na hoja iliyotangulia. “Basi” huonyesha uhusiano huo wa kimantiki, na “tahirini” ni neno la kawaida la Kiswahili kwa kufanya tohara.
- source_word: עָרְלַת לְבַבְכֶם
  choice: govi la mioyo yenu
  rationale: Muundo halisi wa Kiebrania ni “govi la moyo wenu.” Tafsiri hii inadumisha kwa uwazi sitiari ya agano badala ya kuibadili kuwa ufafanuzi kama “ondoa ukaidi.” Wingi “mioyo yenu” ni wa kawaida katika Kiswahili kwa kundi linalosemeshwa.
- source_word: לְבַבְכֶם
  choice: mioyo yenu
  rationale: לֵבָב hurejelea utu wa ndani, kutia ndani nia na ufahamu. “Mioyo” inadumisha picha ya chanzo huku ikiwa ya kawaida na inayoeleweka katika Kiswahili.
- source_word: וְעָרְפְּכֶם
  choice: shingo zenu
  rationale: עֹרֶף ni shingo au kisogo. “Shingo zenu” ni usemi wa kawaida wa Kiswahili na unawezesha kudumisha nahau ya Kiebrania kuhusu ukaidi.
- source_word: לֹא תַקְשׁוּ עוֹד
  choice: msishupaze ... tena
  rationale: Hifili ya קשׁה hapa ina maana ya kufanya kuwa ngumu au shupavu. “Msishupaze shingo zenu” ni Kiswahili cha asili kinachohifadhi picha ya Kiebrania, huku “tena” ikiwakilisha עוֹד katika katazo.
theological_decisions:
- issue: Lugha ya kisitiari ya agano kuhusu tohara ya ndani
  choice: 'Kudumisha sitiari waziwazi: “tahirini govi la mioyo yenu”'
  alternative: “Takāseni mioyo yenu” au “ondoeni ukaidi wa mioyo yenu”
  rationale: Mstari unatumia picha ya tohara ya agano kueleza mwitikio wa ndani kwa Mungu. Kudumisha sitiari huepuka kuingiza fasiri finyu ya kimafundisho na huhifadhi mvutano kati ya ishara ya nje na utii wa ndani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Tahirini” na “govi” huhifadhi picha ya tohara, huku “msishupaze shingo zenu” ikiwa nahau inayoeleweka bila kufuta sitiari ya Kiebrania.
