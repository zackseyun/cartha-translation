source:
  edition: WLC
  text: וַ/יִּכְתֹּ֨ב עַֽל הַ/לֻּחֹ֜ת כַּ/מִּכְתָּ֣ב הָ/רִאשׁ֗וֹן אֵ֚ת עֲשֶׂ֣רֶת הַ/דְּבָרִ֔ים אֲשֶׁ֣ר דִּבֶּר֩ יְהוָ֨ה אֲלֵי/כֶ֥ם בָּ/הָ֛ר מִ/תּ֥וֹךְ הָ/אֵ֖שׁ בְּ/י֣וֹם הַ/קָּהָ֑ל וַ/יִּתְּנֵ֥/ם יְהוָ֖ה אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/004.yaml
  text: And he wrote on the tablets[a], like the first writing, the Ten Words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly; and Yahweh gave them to me.
translation:
  language: sw
  text: Naye akaandika juu ya vibao, kama maandishi ya kwanza, yale Maneno Kumi[a] ambayo Yahwe alikuwa amewaambia mlimani kutoka katikati ya moto, katika siku ya kusanyiko; kisha Yahwe akavinipa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kijadi, “Amri Kumi.” Kiebrania: “maneno kumi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: Naye akaandika
  rationale: Kitenzi hiki kinasimulia tendo lililofuata katika wakati uliopita. “Akaandika” ni cha kawaida na kinadumisha uhusiano na “maandishi” katika kishazi kinachofuata.
- source_word: הַלֻּחֹת
  choice: vibao
  rationale: Katika muktadha huu neno hili linamaanisha vibao vya agano. “Vibao” ni Kiswahili cha kawaida; habari kwamba vilikuwa vya mawe haijaongezwa kwa kuwa haijasemwa wazi katika mstari huu.
- source_word: כַּמִּכְתָּב הָרִאשׁוֹן
  choice: kama maandishi ya kwanza
  rationale: “Kama” linahifadhi nguvu ya ulinganisho ya kiambishi cha Kiebrania, na “maandishi” linadumisha uhusiano wa kimatini na tendo la kuandika.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: Maneno Kumi
  rationale: Kiebrania kinasema kihalisi “maneno kumi.” Herufi kubwa zinaonyesha kuwa hili ni jina linalotambulika la masharti ya agano, huku tafsiri ya jadi ikiwekwa katika tanbihi.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֲלֵיכֶם
  choice: ambayo Yahwe alikuwa amewaambia
  rationale: Muundo huu unaonyesha kwamba kusema kulitangulia kuandika na kutoa vibao. “Amewaambia” linafaa kwa kuwa yaliyosemwa yalielekezwa kwa watu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano YHWH limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: בָּהָר
  choice: mlimani
  rationale: Hii ni tafsiri ya asili na fupi ya mahali ambapo ufunuo ulitolewa.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: kutoka katikati ya moto
  rationale: Kauli hii inadumisha picha ya sauti ya Mungu ikitoka ndani ya moto.
- source_word: בְּיוֹם הַקָּהָל
  choice: siku ya kusanyiko
  rationale: “Kusanyiko” linaeleza tukio la Israeli kukusanyika pamoja bila kulifanya kuwa neno la dhehebu.
- source_word: וַיִּתְּנֵם יְהוָה אֵלָי
  choice: kisha Yahwe akavinipa
  rationale: Kiambishi “-vi-” kinarejelea vibao, navyo ndivyo vilivyotolewa kwa Musa. “Kisha” linaonyesha mwendelezo wa simulizi kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la agano יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja. “Yahwe” linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Jinsi ya kutafsiri עֲשֶׂרֶת הַדְּבָרִים
  choice: Maneno Kumi
  alternative: Amri Kumi
  rationale: “Maneno Kumi” yanafuata maana ya moja kwa moja ya Kiebrania na hayapunguzi upeo wa neno “maneno” kuwa “amri” pekee. Tafsiri iliyozoeleka imehifadhiwa katika tanbihi.
- issue: Kirejewa cha kiambishi katika וַיִּתְּנֵם
  choice: akavinipa, kikirejelea vibao
  alternative: akanipa maneno hayo
  rationale: Muktadha wa karibu unaeleza kuandika juu ya vibao na kisha kuvitoa kwa Musa. Kiswahili hulazimisha ngeli ionekane, hivyo “-vi-” limetumiwa bila kuondoa uwezekano kwamba vibao vinawakilisha Maneno yaliyoandikwa juu yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mpangilio na marudio ya maandishi ya Kiebrania yamehifadhiwa kadiri yanavyosikika kiasili kwa Kiswahili. Alama ya tanbihi imewekwa baada ya “Maneno Kumi,” ambalo ndilo fungu linalofafanuliwa na tanbihi.
