base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/006.yaml
  text: The sons of Israel journeyed from Beeroth Bene-jaakan to Moserah[a]. There Aaron died, and there he was buried[b]; and Eleazar his son served as priest in his place.
translation:
  language: sw
  text: Wana wa Israeli walisafiri kutoka Beeroth Bene-yaakani hadi Mosera[a]. Huko Haruni alikufa, na huko akazikwa; na mwanawe Eleazari akahudumu kama kuhani badala yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Beeroth Bene-yaakani linaweza kueleweka kihalisi kuwa “visima vya wana wa Yaakani,” lakini hapa limetoholewa kama jina la mahali.
    reason: lexical_alternative
  - marker: b
    text: Au “baada yake.” Kiebrania husema kihalisi “mahali pake,” ikimaanisha kwamba Eleazari alimrithi Haruni katika ukuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Inahifadhi usemi wa Kiebrania wenye maana ya ukoo na taifa; kiunganishi וּ kinaeleweka katika mtiririko wa simulizi bila kulazimisha neno la ziada mwanzoni.
- source_word: נָסְעוּ
  choice: walisafiri
  rationale: Katika simulizi la jangwani kitenzi hiki humaanisha kuondoka kambini na kuendelea na safari; 'walisafiri' ni Kiswahili cha kawaida na wazi.
- source_word: מִ/בְּאֵרֹת בְּנֵי יַעֲקָן
  choice: kutoka Beeroth Bene-yaakani
  rationale: Kirai kimetumiwa kama jina la mahali katika ratiba ya safari, hivyo limetoholewa badala ya kutafsiriwa; מִ imetafsiriwa 'kutoka'.
- source_word: מוֹסֵרָה
  choice: hadi Mosera
  rationale: Ingawa hakuna kihusishi kilichoandikwa kabla ya jina hili, muundo wa safari unaonyesha mahali walikokwenda; 'hadi' hutoa maana hiyo kwa kawaida.
- source_word: שָׁם
  choice: Huko ... huko
  rationale: Kurudia 'huko' kunahifadhi msisitizo wa mahali unaorudiwa katika Kiebrania.
- source_word: וַ/יִּקָּבֵר
  choice: akazikwa
  rationale: Umbo la Nifali ni la kutendwa; tafsiri hii haiingizi watendaji ambao hawakutajwa.
- source_word: וַ/יְכַהֵן
  choice: akatumikia kama kuhani
  rationale: Kitenzi כהן humaanisha kufanya au kutumikia kazi ya ukuhani, si kupewa cheo tu.
- source_word: אֶלְעָזָר בְּנוֹ תַּחְתָּיו
  choice: mwanawe Eleazari akatumikia kama kuhani mahali pake
  rationale: תַּחְתָּיו kwa msingi ni 'mahali pake' na hapa huonyesha urithi wa huduma baada ya Haruni.
theological_decisions:
- issue: Maana ya תַּחְתָּיו katika urithi wa ukuhani
  choice: mahali pake
  alternative: baada yake
  rationale: '''Mahali pake'' huhifadhi kwa karibu taswira ya Kiebrania huku ikionyesha kwamba Eleazari alimrithi Haruni; tanbihi inataja maana mbadala ya kimuktadha.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina yametoholewa kwa maumbo yanayosomeka kwa Kiswahili; marudio ya 'huko' yamehifadhiwa kwa sababu yana msisitizo wa kimaandishi.
