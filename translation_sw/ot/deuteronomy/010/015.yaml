source:
  edition: WLC
  text: רַ֧ק בַּ/אֲבֹתֶ֛י/ךָ חָשַׁ֥ק יְהוָ֖ה לְ/אַהֲבָ֣ה אוֹתָ֑/ם וַ/יִּבְחַ֞ר בְּ/זַרְעָ֣/ם אַחֲרֵי/הֶ֗ם בָּ/כֶ֛ם מִ/כָּל הָ/עַמִּ֖ים כַּ/יּ֥וֹם הַ/זֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/015.yaml
  text: Yet Yahweh set his affection on your fathers[a], to love them, and he chose their offspring after them—you—from all the peoples, as it is this day.
translation:
  language: sw
  text: Hata hivyo, Yahwe aliwashikamana na baba zenu[a] kwa upendo, akawapenda, akachagua uzao wao baada yao—yaani ninyi—miongoni mwa mataifa yote, kama ilivyo leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Pekee Yahwe aliwashikamana na baba zenu kwa upendo, akawapenda.”'
    reason: רַק inaweza kusisitiza kizuizi, “pekee,” badala ya nguvu ya utofauti iliyotafsiriwa “Hata hivyo”; חָשַׁק inaweza kumaanisha kushikamana au kuelekeza mapenzi kwa upendo.
lexical_decisions:
- source_word: רַק
  choice: Hata hivyo
  rationale: Katika muktadha huu neno linaonyesha utofauti wenye msisitizo kati ya mamlaka ya Yahwe juu ya vyote na uchaguzi wake maalumu wa baba zao. “Hata hivyo” ni Kiswahili cha kawaida kinachobeba nguvu hiyo, huku uwezekano wa maana ya “pekee” ukihifadhiwa katika tanbihi.
- source_word: בַּאֲבֹתֶיךָ חָשַׁק
  choice: aliweka moyo wake kwa baba zenu
  rationale: Kitenzi חָשַׁק pamoja na בְּ kinaonyesha kushikamana kwa hiari na kwa upendo. Nahau “aliweka moyo wake kwa” inahifadhi wazo la kuelekeza mapenzi kwa mtu bila kulifanya kuwa fundisho la kiufafanuzi.
- source_word: לְאַהֲבָה אֹתָם
  choice: ili awapende
  rationale: Inahifadhi kwa uwazi kitenzi cha kupenda na uhusiano wa kusudi au matokeo unaoonyeshwa na hali ya infinitivu.
- source_word: וַיִּבְחַר
  choice: akachagua
  rationale: “Kuchagua” ndiyo maana ya moja kwa moja ya בחר na inaacha uzito wa uchaguzi wa Mungu bila kuupunguza wala kuupanua kitheolojia.
- source_word: בְּזַרְעָם אַחֲרֵיהֶם
  choice: uzao wao baada yao
  rationale: “Uzao” huhifadhi taswira na maana ya pamoja ya זֶרַע, huku “baada yao” ikifuata uhusiano wa vizazi katika chanzo.
- source_word: בָּכֶם
  choice: yaani ninyi
  rationale: Kirai hiki kinawatambulisha wasikilizaji kuwa ndio uzao uliotajwa. “Yaani ninyi” na vistari virefu vinaonyesha vizuri uhusiano huo wa ufafanuzi.
- source_word: מִכָּל הָעַמִּים
  choice: kutoka miongoni mwa watu wote
  rationale: “Watu” huhifadhi maana ya עַמִּים kama makundi ya watu, si lazima mataifa ya kisiasa; “miongoni mwa” huweka wazi maana ya uteuzi kutoka kati yao.
- source_word: כַּיּוֹם הַזֶּה
  choice: kama ilivyo leo
  rationale: Ni Kiswahili cha sasa na cha kawaida kinachoonyesha kwamba hali iliyokuwapo wakati huo ilithibitisha kauli hiyo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Lugha ya uchaguzi wa Mungu
  choice: Kuhifadhi wazi upendo wa Yahwe na tendo lake la kuchagua bila kulainisha au kulipangilia katika mfumo wa baadaye wa kiteolojia.
  alternative: Kutafsiri uchaguzi kama upendeleo wa kawaida tu, au kuupanua ili uthibitishe mfumo fulani wa mafundisho.
  rationale: Kiebrania chenyewe huunganisha kushikamana kwa upendo, kupenda, na kuchagua. Tafsiri inayaacha madai hayo yakiwa na nguvu na mvutano wake wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo unaweka karibu mpangilio wa Kiebrania, huku “yaani ninyi” na “kutoka miongoni mwa” vikifanya uhusiano wa kisarufi uwe wazi.
