  text: לִ/שְׁמֹ֞ר אֶת מִצְוֺ֤ת יְהוָה֙ וְ/אֶת חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לְ/ט֖וֹב לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/013.yaml
  text: to keep the commandments of Yahweh and his statutes that I am commanding you today for your good?[a]
translation:
  language: sw
  text: kuzishika[a] amri za Yahwe na sheria zake ninazokuamuru leo kwa faida yako?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuzitii” au “kuzilinda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹר
  choice: kuzishika
  rationale: Kitenzi hiki kinaendeleza maelezo ya yale Yahwe anayodai katika mstari uliotangulia. “Kuzishika” ni usemi wa kawaida wa agano unaojumuisha kutii na kudumisha amri; tanbihi inaonyesha maana nyingine zinazowezekana.
- source_word: מִצְוֺת
  choice: amri
  rationale: Neno hili linataja mambo ambayo Yahwe ameyaagiza na linadumisha lugha ya kisheria na ya agano iliyo katika Kumbukumbu la Torati.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limewasilishwa kama jina binafsi badala ya kubadilishwa na cheo; umbo “Yahwe” linafuata tahajia ya kawaida ya Kiswahili.
- source_word: חֻקֹּתָיו
  choice: sheria zake
  rationale: Katika muktadha huu neno linamaanisha masharti yaliyowekwa rasmi. “Sheria zake” ni wazi kwa wasomaji wa kawaida na linaendana vizuri na “amri.”
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ninazokuamuru leo
  rationale: Kishazi hiki kwa kawaida kinaweza kueleweka kuwa kinaeleza amri na sheria kwa pamoja. Wakati wa sasa unadumisha msisitizo wa agano unaohusishwa na “leo.”
- source_word: לְטוֹב לָךְ
  choice: kwa faida yako
  rationale: Usemi huu unaonyesha kusudi au matokeo yenye manufaa kwa msikilizaji. “Kwa faida yako” ni Kiswahili cha sasa, wazi na kifupi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. Kulitaja kama “Yahwe” kunadumisha jina hilo la agano badala ya kulibadilisha na cheo.
- issue: Uhusiano wa לְטוֹב לָךְ na agizo lote
  choice: kwa faida yako
  alternative: ili upate mema
  rationale: Tafsiri iliyochaguliwa inadumisha uwezekano wa kusudi au matokeo yenye manufaa bila kuufanya usemi huu kuwa ahadi maalumu zaidi kuliko Kiebrania kinavyosema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo umeachwa kama mwendelezo wa swali lililoanza katika mstari uliotangulia, kwa hiyo alama ya swali imedumishwa.
