  naturalness: Muundo wa vitenzi vya awali (“ili libebe ... lisimame ... ili kumhudumia”) unaeleweka, lakini mfululizo wa vitenzi-jina unaoongozwa na “alilitenga” ni wa kawaida na sambamba zaidi katika Kiswahili Sanifu. “Mbele ya Yahweh” ni matumizi ya kawaida zaidi kuliko “mbele za Yahweh.”
