source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗וא הִבְדִּ֤יל יְהוָה֙ אֶת שֵׁ֣בֶט הַ/לֵּוִ֔י לָ/שֵׂ֖את אֶת אֲר֣וֹן בְּרִית יְהוָ֑ה לַ/עֲמֹד֩ לִ/פְנֵ֨י יְהוָ֤ה לְ/שָֽׁרְת/וֹ֙ וּ/לְ/בָרֵ֣ךְ בִּ/שְׁמ֔/וֹ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/008.yaml
  text: At that time Yahweh set apart the tribe of Levi to carry the ark of the covenant of Yahweh, to stand before Yahweh to minister to him, and to bless in his name, to this day.
translation:
  language: sw
  text: Wakati huo Yahweh alilitenga kabila la Lawi kubeba sanduku la agano la Yahweh, kusimama mbele ya Yahweh ili kumhudumia, na kubariki kwa jina lake, hadi leo hii.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִבְדִּיל
  choice: alilitenga
  rationale: Kitenzi hiki kinaonyesha kutengwa kwa kusudi maalumu; “alilitenga” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kuongeza dhana isiyotajwa wazi ya kuwekwa wakfu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa moja kwa moja badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: שֵׁבֶט הַלֵּוִי
  choice: kabila la Lawi
  rationale: Hili linafuata muundo na maana ya Kiebrania, likihifadhi Lawi kama jina la kabila.
- source_word: לָשֵׂאת
  choice: ili libebe
  rationale: “Kubeba” linaeleza wazi jukumu la kulichukua na kulisafirisha sanduku; umoja wa kitenzi unarejelea kabila kama kundi moja.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: sanduku la agano la Yahweh
  rationale: Tafsiri hii inahifadhi mfululizo kamili wa maneno na kufanya uhusiano wa sanduku, agano, na Yahweh uwe wazi.
- source_word: לַעֲמֹד לִפְנֵי יְהוָה
  choice: lisimame mbele za Yahweh
  rationale: Hii inahifadhi nahau ya ibada ya kusimama mbele za Mungu bila kuifafanua kupita kiasi.
- source_word: לְשָׁרְתוֹ
  choice: ili kumhudumia
  rationale: “Kumhudumia” linaonyesha huduma inayotolewa kwake katika mazingira ya ibada, huku likihifadhi kiwakilishi cha nafsi kilicho katika Kiebrania.
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  choice: na kubariki kwa jina lake
  rationale: Kiebrania hakitaji wazi anayebarikiwa; tafsiri inaacha kirai hicho wazi vilevile na kuonyesha kwamba baraka inatolewa kwa mamlaka ya jina lake.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: kama linavyofanya hadi leo hii
  rationale: Nahau inaonyesha kuendelea kwa jukumu hilo hadi wakati wa msimulizi; nyongeza ya kisarufi “kama linavyofanya” hufanya uhusiano huo uwe wa kawaida katika Kiswahili bila kubadili maana.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano lenyewe, hivyo “Yahweh” huhifadhi jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya huduma katika לַעֲמֹד ... לְשָׁרְתוֹ
  choice: lisimame mbele za Yahweh ili kumhudumia
  alternative: lisimame mbele za Yahweh ili kumtumikia
  rationale: “Kumhudumia” linafaa katika mazingira ya huduma takatifu, lakini halileti miundo ya baadaye ya kimadhehebu ndani ya kifungu.
- issue: Mhusika anayepokea baraka katika וּלְבָרֵךְ בִּשְׁמוֹ
  choice: na kubariki kwa jina lake
  alternative: na kuwabariki watu kwa jina lake
  rationale: Kiebrania hakitaji kitu cha kitenzi “kubariki.” Tafsiri haiongezi “watu,” hivyo inadumisha uwazi na mvutano wa maandishi chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umewekwa wazi kwa msomaji wa kawaida, huku marudio ya “Yahweh” na lugha ya ibada ya maandishi chanzo vikihifadhiwa.
