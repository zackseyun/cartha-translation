  text: בְּ/שִׁבְעִ֣ים נֶ֔פֶשׁ יָרְד֥וּ אֲבֹתֶ֖י/ךָ מִצְרָ֑יְמָ/הּ וְ/עַתָּ֗ה שָֽׂמְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/022.yaml
  text: Your fathers went down to Egypt with seventy persons[c][b][a], and now Yahweh your God has made you as numerous as the stars of the heavens.
translation:
  language: sw
  text: Baba zako walishuka kwenda Misri wakiwa watu sabini,[a][b] na sasa Yahwe Mungu wako amekufanya kuwa wengi kama nyota za mbinguni.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakiwa nafsi sabini.” Hapa neno la Kiebrania linalomaanisha “nafsi” linatumika kuhesabia watu.
    reason: lexical_alternative
  - marker: b
    text: Au, “mababu zako” au “wahenga wako.” Kiebrania kinasema kihalisi “baba zako.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kama nyota za anga.” Maana ya ulinganisho huu ni wingi wa idadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁבְעִים נֶפֶשׁ
  choice: wakiwa watu sabini
  rationale: Katika muktadha huu נֶפֶשׁ ni neno la kuhesabia watu, si rejeo mahsusi kwa sehemu isiyo ya kimwili ya mwanadamu. Kiswahili hiki ni cha asili na kinadumisha idadi.
- source_word: יָרְדוּ
  choice: walishuka kwenda
  rationale: ירד humaanisha kushuka; usemi huu unahifadhi mtazamo wa kawaida wa kibiblia kuhusu safari ya kwenda Misri huku ukisomeka kwa ufasaha.
- source_word: אֲבֹתֶיךָ
  choice: Baba zako
  rationale: Kiebrania kinasema kihalisi ‘baba zako’; tafsiri hii inadumisha umbo la kiume badala ya kulipanua kimya kimya kuwa ‘mababu’ au ‘wahenga.’
- source_word: מִצְרָיְמָה
  choice: kwenda Misri
  rationale: Kiambishi cha mwelekeo kinaonyesha mwendo kuelekea Misri; ‘kwenda Misri’ ni usemi wa kawaida wa Kiswahili.
- source_word: וְעַתָּה
  choice: na sasa
  rationale: Inadumisha kiunganishi na alama ya wakati, pamoja na tofauti inayodokezwa kati ya mwanzo mdogo na wingi wa sasa.
- source_word: שָׂמְךָ
  choice: amekufanya uwe
  rationale: Ingawa שׂים kimsingi ni ‘kuweka,’ hapa inaeleza hali iliyotokezwa; ‘amekufanya uwe’ huwasilisha maana hiyo kwa Kiswahili wazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa moja kwa moja kwa tahajia iliyozoeleka katika Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya muundo wenye kiambishi cha nafsi ya pili umoja.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: uwe wengi kama nyota za mbinguni
  rationale: לָרֹב inaweka wazi kwamba ulinganisho unahusu wingi. ‘Nyota za mbinguni’ inadumisha taswira ya Kiebrania na ni Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina binafsi YHWH, hivyo limedumishwa kama jina badala ya kubadilishwa kuwa cheo. ‘Yahwe’ ni umbo linalofaa katika Kiswahili sanifu.
- issue: Neno la ukoo lenye jinsia אֲבֹתֶיךָ
  choice: Baba zako
  alternative: Mababu zako; wahenga wako
  rationale: Kiebrania kinasema ‘baba zako.’ Matini kuu inadumisha upekee huo, huku tanbihi ikitaja maana pana inayowezekana katika muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Wakiwa watu sabini’ huepuka maana potovu ya kisasa ya ‘nafsi,’ na ‘uwe wengi’ hukubaliana na ‘wewe’ ya umoja inayowakilisha Israeli kama jumuiya.
