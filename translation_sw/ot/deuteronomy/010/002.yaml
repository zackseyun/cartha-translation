base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/002.yaml
  text: And I will write on the tablets the words that were on the first tablets[a], which you broke, and you shall put them in the ark.
translation:
  language: sw
  text: Nami nitaandika juu ya vibao maneno[a] yaliyokuwa juu ya vibao vya kwanza ulivyovivunja; nawe utaviweka ndani ya sanduku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amri”; Kiebrania, “maneno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶכְתֹּב
  choice: Nami nitaandika
  rationale: Kitenzi cha nafsi ya kwanza umoja katika muktadha wa ahadi ya Mungu kinaelezwa kwa wakati ujao; “nami” huendeleza sentensi kwa Kiswahili cha kawaida.
- source_word: הַלֻּחֹת
  choice: vibao hivyo
  rationale: לוח humaanisha kibao au ubao wa kuandikia. “Vibao” ni wazi na ya kawaida; “hivyo” inaakisi kibainishi cha Kiebrania na kurejelea vibao vilivyoagizwa katika mstari uliotangulia bila kuongeza neno “mawe,” ambalo halijarudiwa hapa.
- source_word: הַדְּבָרִים
  choice: maneno
  rationale: דבר ni neno pana; hapa ni maandishi ya agano. “Maneno” hudumisha usemi halisi wa Kiebrania bila kuufasiri moja kwa moja kuwa “amri.”
- source_word: אֲשֶׁר הָיוּ
  choice: yaliyokuwa
  rationale: Hii ni tafsiri ya kawaida na ya asili ya kishazi rejeshi pamoja na היה.
- source_word: הָרִאשֹׁנִים
  choice: vya kwanza
  rationale: Kivumishi kinatofautisha vibao vya awali na vibao vya kuchukua mahali pake; “vya kwanza” ni wazi na cha kawaida.
- source_word: שִׁבַּרְתָּ
  choice: ulivyovivunja
  rationale: Piel timilifu ya nafsi ya pili umoja wa kiume ya שבר huonyesha kuvunja; tafsiri hii ni sahihi bila kuongeza namna ya kuvunjika kama “kuvipondaponda.”
- source_word: וְשַׂמְתָּם
  choice: nawe utaviweka
  rationale: שים ni kuweka. Kiambishi “-vi-” kwa kawaida kinarejelea vibao, vitu vinavyowekwa ndani ya sanduku, kulingana na muktadha wa Kumbukumbu la Torati 10:1–5.
- source_word: בָּאָרוֹן
  choice: ndani ya sanduku
  rationale: ארון hapa ni sanduku takatifu lililotajwa katika muktadha. “Sanduku” ni neno la Kiswahili linaloeleweka na sahihi; “ndani ya” huwasilisha mahali au mwelekeo unaodokezwa na ב.
theological_decisions:
- issue: Kirejelewa cha kiambishi katika וְשַׂמְתָּם (“utaviweka”)
  choice: Kiambishi kinarejelea vibao.
  alternative: Kinaweza kisarufi kurejelea maneno au amri zilizoandikwa juu ya vibao.
  rationale: Nomino zote zilizo karibu ni za wingi wa kiume katika Kiebrania, lakini kitendo cha kuweka kitu ndani ya sanduku kinafaa zaidi kwa vibao halisi, kama muktadha wa Kumbukumbu la Torati 10:1–5 unavyoonyesha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umefuata Kiebrania kwa ukaribu huku sentensi ikibaki ya asili kwa Kiswahili. Alama ya nusu-koloni inatenganisha ahadi ya Mungu na agizo kwa Musa.
