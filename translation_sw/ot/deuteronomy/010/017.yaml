source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֚וּא אֱלֹהֵ֣י הָֽ/אֱלֹהִ֔ים וַ/אֲדֹנֵ֖י הָ/אֲדֹנִ֑ים הָ/אֵ֨ל הַ/גָּדֹ֤ל הַ/גִּבֹּר֙ וְ/הַ/נּוֹרָ֔א אֲשֶׁר֙ לֹא יִשָּׂ֣א פָנִ֔ים וְ/לֹ֥א יִקַּ֖ח שֹֽׁחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/017.yaml
  text: For Yahweh your God is God of gods and Lord of lords[a], the great, mighty, and awesome God, who shows no partiality and takes no bribe.
translation:
  language: sw
  text: Kwa maana Yahwe Mungu wenu ndiye Mungu wa miungu na Bwana wa mabwana, Mungu mkuu, mwenye nguvu, na wa kuogofya[a], ambaye hana upendeleo wala hapokei rushwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “mwenye kutisha” au “mwenye kuamsha hofu kuu.” Kiebrania: “yule wa kuogofya,” yaani anayesababisha hofu na kicho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu ya himizo lililotangulia na kuhifadhi nguvu ya kisababishi ya Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Kiambishi cha nafsi ya pili wingi kinawahusu Waisraeli, na nomino hii ina maana ya umoja katika muktadha huu.
- source_word: אֱלֹהֵי הָאֱלֹהִים
  choice: Mungu wa miungu
  rationale: Muundo huu wa moja kwa moja unahifadhi kauli ya ukuu wa Mungu bila kuamua kimya-kimya asili ya wale wanaoitwa miungu.
- source_word: וַאֲדֹנֵי הָאֲדֹנִים
  choice: na Bwana wa mabwana
  rationale: Huhifadhi ulinganifu na “Mungu wa miungu” pamoja na uzito wa cheo cha enzi.
- source_word: הָאֵל הַגָּדֹל הַגִּבֹּר וְהַנּוֹרָא
  choice: Mungu mkuu, mwenye nguvu na anayestahili kuogopwa
  rationale: Mfuatano huu wa sifa unahifadhi hadhi ya lugha ya Kiebrania; “anayestahili kuogopwa” huonyesha kwamba Mungu huamsha hofu yenye heshima bila kupunguza maana kuwa kuvutia tu wala kuifanya iwe ukatili.
- source_word: אֲשֶׁר לֹא יִשָּׂא פָנִים
  choice: ambaye hana upendeleo
  rationale: Hii inatoa maana ya nahau ya Kiebrania, ambayo kwa neno kwa neno ni “hanyanyui nyuso,” yaani hamwonyeshi mtu upendeleo.
- source_word: וְלֹא יִקַּח שֹׁחַד
  choice: wala hapokei rushwa
  rationale: Tafsiri ya kawaida na wazi inayohifadhi nguvu ya kisheria na kimaadili ya kauli hiyo.
theological_decisions:
- issue: Mfuatano wa vyeo “Mungu wa miungu na Bwana wa mabwana” unaweza kuelewekaje bila kuingiza ufafanuzi wa ziada kuhusu miungu mingine?
  choice: Kuhifadhi “Mungu wa miungu na Bwana wa mabwana” kama kauli ya ukuu usio na kifani.
  alternative: Mungu aliye juu ya wale wanaoitwa miungu na Bwana aliye juu ya mabwana wote.
  rationale: Miundo ya Kiebrania inasisitiza ukuu na enzi. Kuihifadhi huepuka kuingiza katika mstari wenyewe maelezo ya kifalsafa ambayo chanzo hakiyatoi wazi.
- issue: Jinsi ya kutafsiri jina יְהוָה.
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: “Yahwe” huhifadhi jina binafsi la Mungu katika umbo linalotumika kwa kawaida katika Kiswahili, badala ya kulibadilisha kuwa cheo.
- issue: Maana ya וְהַנּוֹרָא.
  choice: anayestahili kuogopwa
  alternative: mwenye kutisha; mwenye kuamsha hofu kuu
  rationale: Neno hilo linamtaja Mungu kuwa mwenye kuamsha hofu na kicho. Chaguo hili huhifadhi hofu yenye heshima bila kuamua kwamba sifa hiyo ni ya kutisha kwa maana hasi pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa sasa na hadhi inayofaa maandiko. “Kwa maana” linaunganisha mstari na himizo lililotangulia; “hana upendeleo wala hapokei rushwa” ni wazi kwa msomaji wa kawaida huku likihifadhi muktadha wa haki.
