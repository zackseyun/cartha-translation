base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/020.yaml
  text: You shall fear Yahweh your God[a]; him you shall serve, to him you shall cling[b], and by his name you shall swear.
translation:
  language: sw
  text: Utamcha Yahweh Mungu wako[a]; yeye utamtumikia, utashikamana naye[b], na utaapa kwa jina lake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utamheshimu Yahweh, Mungu wako, kwa kicho”; katika muktadha wa agano, kitenzi cha Kiebrania huonyesha hofu yenye heshima.
    reason: lexical_alternative
  - marker: b
    text: Au, “utamshikilia imara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano la Mungu limetafsiriwa kwa unukuzi “Yahweh” badala ya kulibadilisha kuwa cheo kama “BWANA”.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: 'Muundo huu una kiambishi cha nafsi ya pili umoja wa kiume na unaonyesha uhusiano wa agano: “Mungu wako.”'
- source_word: תִּירָא
  choice: utamcha
  rationale: Kitenzi “kucha” huhifadhi maana ya hofu yenye heshima na kicho katika muktadha wa agano, bila kuipunguza kuwa heshima pekee.
- source_word: אֹתוֹ תַעֲבֹד
  choice: yeye utamtumikia
  rationale: Kiwakilishi kilichotangulizwa katika Kiebrania kimeonyeshwa kwa “yeye” ili kuhifadhi msisitizo; “kutumikia” huhifadhi maana ya msingi ya עבד huku muktadha ukibeba pia wazo la ibada.
- source_word: וּבוֹ תִדְבָּק
  choice: utashikamana naye
  rationale: Kwa mtu, דבק pamoja na ב huonyesha kujifungamanisha kwa karibu na kwa uaminifu; “kushikamana naye” ni Kiswahili cha asili kinachohifadhi picha hiyo ya uaminifu wa agano.
- source_word: וּבִשְׁמוֹ תִּשָּׁבֵעַ
  choice: utaapa kwa jina lake
  rationale: Hii ni nahau ya kuapa kwa kumtaja mwenye mamlaka; “kuapa kwa jina lake” huhifadhi nguvu yake ya kisheria na ya agano.
theological_decisions:
- issue: Nguvu ya amri katika vitenzi vya Kiebrania vya hali isiyotimilika
  choice: 'Kutumia wakati ujao wenye nguvu ya wajibu: “utamcha… utamtumikia… utashikamana… utaapa.”'
  alternative: 'Kutumia amri za moja kwa moja: “mche… mtumikie… shikamana… apa.”'
  rationale: Katika muktadha huu wa maagizo ya agano, maumbo ya Kiebrania yana nguvu ya amri. Wakati ujao wa Kiswahili huhifadhi mtiririko wa matakwa ya agano kwa lugha ya kawaida na yenye hadhi.
- issue: Maana ya ירא katika uhusiano wa agano
  choice: “utamcha”
  alternative: “utamheshimu kwa kicho”
  rationale: “Kumcha” hudumisha mvutano wa maana kati ya hofu na heshima ya kina, bila kuondoa uzito wa kitheolojia wa neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio “yeye utamtumikia” umehifadhi msisitizo wa kiwakilishi cha Kiebrania, huku sentensi yote ikibaki wazi kwa msomaji wa kawaida.
