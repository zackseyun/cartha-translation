base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/009.yaml
  text: Therefore Levi has no portion or inheritance with his brothers[a]; Yahweh is his inheritance[b], just as Yahweh your God spoke to him.
translation:
  language: sw
  text: Kwa hiyo, Lawi hana sehemu wala urithi pamoja na ndugu zake[a]; Yahwe ndiye urithi wake[b], kama vile Yahwe Mungu wako alivyomwambia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “pamoja na ndugu zake.” Jina la umoja “Lawi” linawakilisha kabila la Lawi, likitofautishwa na makabila mengine ya Israeli.'
    reason: cultural_note
  - marker: b
    text: Au, “Yahwe ndiye sehemu yake.” Kiebrania kinarudia neno la urithi ili kusisitiza kwamba fungu la Lawi si ardhi, bali ni Yahwe mwenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na muktadha uliotangulia na ni usemi wa kawaida katika Kiswahili cha sasa.
- source_word: לְלֵוִי
  choice: Lawi
  rationale: Jina la umoja linahifadhi namna ya Kiebrania, huku likiwakilisha kabila la Lawi katika muktadha.
- source_word: חֵלֶק וְנַחֲלָה
  choice: sehemu wala urithi
  rationale: Maneno mawili tofauti yamehifadhiwa; 'sehemu' ni fungu lake, na 'urithi' unaendeleza wazo la haki ya kumiliki ardhi ya urithi.
- source_word: עִם אֶחָיו
  choice: pamoja na ndugu zake
  rationale: Huhifadhi neno la undugu la Kiebrania kwa Kiswahili cha kawaida; hapa ndugu ni makabila mengine ya Israeli.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania badala ya kulibadili kuwa cheo.
- source_word: הוּא נַחֲלָתוֹ
  choice: ndiye urithi wake
  rationale: Kurudia 'urithi' kunahifadhi kiungo cha kimsamiati na kusisitiza tofauti kati ya urithi wa ardhi na Yahwe mwenyewe kuwa urithi wa Lawi.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: kama vile ... alivyomwambia
  rationale: Kitenzi דִּבֶּר ni 'alisema/alizungumza'; 'alivyomwambia' ni cha asili katika Kiswahili na hakiongezi dhana ya ahadi isiyotajwa wazi.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huhifadhi usemi wa agano na nafsi ya pili umoja.
- source_word: לוֹ
  choice: -mw-
  rationale: Kiambishi cha yambwa katika 'alivyomwambia' kinarejelea Lawi kama mwakilishi wa kabila lake.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandiko ya Kiebrania yana jina la agano la Mungu; 'Yahwe' hulihifadhi kama jina binafsi badala ya kutumia cheo.
- issue: Lawi kama mwakilishi wa kabila
  choice: Lawi hana sehemu wala urithi
  alternative: kabila la Lawi halina sehemu wala urithi
  rationale: Umoja wa chanzo umehifadhiwa, huku tanbihi ikifafanua matumizi yake ya kiwakilishi bila kulipanua kimya kimya katika matini.
- issue: Uhusiano wa urithi wa ardhi na Yahwe
  choice: Yahwe ndiye urithi wake
  alternative: Yahwe ndiye sehemu yake
  rationale: 'Kurudia neno la urithi kunadumisha mvutano wa kitheolojia wa chanzo: Lawi hana urithi wa ardhi pamoja na makabila mengine kwa sababu Yahwe mwenyewe ndiye urithi wake.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo unafuata Kiebrania kwa karibu bila kuwa mgumu; wakati timilifu wa Kiebrania umefasiriwa kama hali ya sasa ('hana') kulingana na muktadha.
