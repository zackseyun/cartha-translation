  text: He is your praise[a], and he is your God[b], who has done for you these great and awe-inspiring things that your eyes have seen.
translation:
  language: sw
  text: Yeye ndiye sifa yako[a], naye ndiye Mungu wako, ambaye amekufanyia mambo haya makuu na ya kutia kicho[b], ambayo macho yako yameyaona.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yeye ndiye yule unayemsifu,” au “Yeye ndiye fahari yako.” Kiebrania husema, “Yeye ndiye sifa yako.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ya kutisha” au “ya kuogofya.” Neno la Kiebrania hueleza mambo yanayoamsha hofu na kicho.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְהִלָּתְךָ
  choice: sifa yako
  rationale: Muundo huu unafuata kwa karibu usemi wa Kiebrania na kuhifadhi maana pana kwamba Mungu ndiye anayesifiwa na pia msingi wa kujisifia kwa Israeli.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huhifadhi lugha ya moja kwa moja ya agano na nafsi ya pili umoja, inayomsemesha Israeli kama mmoja.
- source_word: עָשָׂה אִתְּךָ
  choice: amekutendea
  rationale: Katika muktadha huu, nahau hiyo ina maana ya matendo ambayo Mungu amefanya kwa ajili ya Israeli; 'amekutendea' ni ya asili na inaonyesha mhusika anayenufaika.
- source_word: הַגְּדֹלֹת
  choice: mambo haya makuu
  rationale: Kivumishi kimetumiwa kama nomino; 'mambo makuu' huhifadhi upana wake bila kuibana maana iwe nguvu pekee.
- source_word: הַנּוֹרָאוֹת
  choice: ya kutisha
  rationale: Neno la Kiebrania hueleza mambo yanayoamsha hofu na kicho. 'Ya kutisha' huhifadhi uzito wa hofu, huku tanbihi ikifafanua kwamba kicho pia kinahusika.
- source_word: רָאוּ עֵינֶיךָ
  choice: macho yako yameyaona
  rationale: Huhifadhi taswira na msisitizo wa ushuhuda wa moja kwa moja wa nahau ya Kiebrania.
- source_word: הוּא ... וְהוּא
  choice: Yeye ndiye ... naye ndiye
  rationale: Kurudia huku kunatunza msisitizo wa viwakilishi vya Kiebrania bila kuongeza wazo la upekee ambalo halijasemwa wazi katika aya.
theological_decisions:
- issue: Tafsiri ya kishazi-arifu הוּא תְהִלָּתְךָ
  choice: Yeye ndiye sifa yako
  alternative: Yeye ndiye unayemsifu; Yeye ndiye fahari yako
  rationale: 'Tafsiri iliyochaguliwa inadumisha ufupi na mvutano wa kiteolojia wa Kiebrania: Mungu ni anayesifiwa na pia msingi wa sifa au fahari ya Israeli.'
- issue: Maana ya הַנּוֹרָאוֹת
  choice: mambo ... ya kutisha
  alternative: mambo yanayotia kicho; mambo ya kuogofya
  rationale: Chaguo hili halifuti sehemu ya hofu iliyomo katika neno, lakini tanbihi inaonyesha kwamba hofu hiyo inaweza pia kuwa kicho na mshangao mbele ya matendo ya Mungu.
