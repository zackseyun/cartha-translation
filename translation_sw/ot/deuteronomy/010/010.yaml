base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/010.yaml
  text: As for me[a], I stood on the mountain as at the first time, forty days and forty nights, and Yahweh listened to me that time also; Yahweh was not willing to destroy you.
translation:
  language: sw
  text: Nami nilikaa mlimani kama siku zile za kwanza, siku arobaini na usiku arobaini. Yahwe alinisikiliza[a] wakati huo pia; Yahwe hakutaka kukuangamiza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alinisikia.” Kitenzi cha Kiebrania kinaweza kumaanisha kusikia, na pia kusikiliza kwa mwitikio wa kibali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Nami
  rationale: Muunganiko wa kiunganishi na kiwakilishi huru unampa Musa msisitizo mdogo wa mada; “Nami” ni wa asili na wenye ufupi katika Kiswahili.
- source_word: עָמַדְתִּי
  choice: nilikaa
  rationale: Ingawa maana ya msingi ni “nilisimama,” hapa kitenzi kinaeleza kuendelea kuwapo mlimani kwa muda wa siku arobaini; “nilikaa” huepuka wazo lisilokusudiwa la mkao wa kusimama muda wote.
- source_word: בָהָר
  choice: mlimani
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili kueleza kuwapo juu au katika eneo la mlima katika muktadha huu.
- source_word: כַיָּמִים הָרִאשֹׁנִים
  choice: kama siku zile za kwanza
  rationale: Tafsiri hii inahifadhi umbo la wingi la Kiebrania na kurejelea kipindi cha kwanza cha Musa kukaa mlimani.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: siku arobaini mchana na usiku arobaini
  rationale: “Mchana” huonyesha wazi kuwa יוֹם hapa inalinganishwa na usiku, huku hesabu na mpangilio wa chanzo vikihifadhiwa.
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: Yahwe alinisikiliza
  rationale: Kitenzi שׁמע pamoja na אֶל kinaweza kumaanisha kusikia kwa kuitikia kwa upendeleo; “alinisikiliza” huhifadhi maana hiyo bila kuongeza maelezo yasiyomo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: wakati huo pia
  rationale: Usemi huu unaonyesha kwamba Yahwe alimwitikia Musa katika tukio hilo kama alivyofanya hapo awali.
- source_word: לֹא אָבָה
  choice: hakutaka
  rationale: Kitenzi kinaonyesha kutokuwa tayari au kutokubali; “hakutaka” ni cha kawaida na huhifadhi maana ya hiari.
- source_word: הַשְׁחִיתֶךָ
  choice: kukuangamiza
  rationale: Umbo hili la kisababishi linaeleza kuharibu kabisa katika hukumu; kiambishi cha umoja kinahifadhi Israeli ikisemeshwa kwa umoja.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la agano; “Yahwe” hulihifadhi bila kulibadilisha kuwa cheo.
- issue: Maana ya mwitikio wa Mungu katika וַיִּשְׁמַע יְהוָה אֵלַי
  choice: Yahwe alinisikiliza
  alternative: Yahwe alinisikia
  rationale: “Alinisikiliza” huonyesha kusikia kwa kuitikia ombi la Musa, lakini tanbihi huhifadhi uwezekano wa tafsiri isiyoeleza wazi kiwango cha mwitikio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imehifadhi msemo wa Musa kwa nafsi ya kwanza na Israeli ikisemeshwa kwa umoja. Alama ya tanbihi imewekwa baada ya neno linalohusika, “alinisikiliza,” badala ya baada ya “Nami.”
