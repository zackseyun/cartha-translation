  text: כִּ֣י שְׁאַל נָא֩ לְ/יָמִ֨ים רִֽאשֹׁנִ֜ים אֲשֶׁר הָי֣וּ לְ/פָנֶ֗י/ךָ לְ/מִן הַ/יּוֹם֙ אֲשֶׁר֩ בָּרָ֨א אֱלֹהִ֤ים אָדָם֙ עַל הָ/אָ֔רֶץ וּ/לְ/מִ/קְצֵ֥ה הַ/שָּׁמַ֖יִם וְ/עַד קְצֵ֣ה הַ/שָּׁמָ֑יִם הֲ/נִֽהְיָ֗ה כַּ/דָּבָ֤ר הַ/גָּדוֹל֙ הַ/זֶּ֔ה א֖וֹ הֲ/נִשְׁמַ֥ע כָּמֹֽ/הוּ־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/032.yaml
  text: 'For ask now about the former days that were before you[a], from the day when God created man on the earth, and from one end of the heavens to the other end of the heavens: has anything happened like this great thing, or has anything been heard like it?'
translation:
  language: sw
  text: 'Kwa maana, uliza sasa kuhusu siku za kale zilizokutangulia, tangu siku Mungu alipomuumba mwanadamu[a] duniani, na kutoka mwisho mmoja wa mbingu hadi mwisho mwingine wa mbingu: Je, jambo kubwa kama hili limewahi kutokea, au jambo kama hili limewahi kusikiwa?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanadamu.” Neno la Kiebrania אָדָם (adam) katika muktadha wa uumbaji linaweza kumaanisha wanadamu wote kwa maana ya uwakilishi.
    reason: Njia mbadala ya kileksika kwa אָדָם katika muktadha wa uumbaji.
lexical_decisions:
- source_word: שְׁאַל נָא
  choice: uliza sasa
  rationale: Kauli ya amri pamoja na נָא inaleta mwito wenye msisitizo; “uliza sasa” ni ya kawaida na huhifadhi nguvu ya himizo.
- source_word: לְיָמִים רִאשֹׁנִים
  choice: kuhusu siku za kale
  rationale: Kirai hiki kinarejelea nyakati za zamani sana; “siku za kale” ni Kiswahili cha sasa chenye uzito unaofaa.
- source_word: אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: zilizokuwa kabla yako
  rationale: Huhifadhi maana ya wakati, yaani siku zilizotangulia maisha au kizazi cha msikilizaji.
- source_word: לְמִן הַיּוֹם אֲשֶׁר בָּרָא
  choice: tangu siku ile ... alipomuumba
  rationale: “Tangu” huonyesha mwanzo wa kipindi chote kinachochunguzwa, huku muundo wa kitenzi ukiwa wa asili katika Kiswahili.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa Mungu mmoja Muumba katika muktadha huu.
- source_word: אָדָם
  choice: mwanadamu
  rationale: Katika muktadha wa uumbaji neno hili linaweza kumaanisha binadamu kwa uwakilishi, si lazima jina maalumu Adamu. “Mwanadamu” huhifadhi umoja wa Kiebrania huku likiruhusu maana ya jamii yote ya wanadamu.
- source_word: עַל הָאָרֶץ
  choice: duniani
  rationale: Ni tafsiri ya mahali iliyo wazi na ya kawaida kwa maana ya kuwa juu ya dunia.
- source_word: וּלְמִקְצֵה הַשָּׁמַיִם וְעַד קְצֵה הַשָּׁמָיִם
  choice: na kutoka mwisho mmoja wa mbingu mpaka mwisho mwingine wa mbingu
  rationale: Huhifadhi taswira ya Kiebrania ya upeo mzima; “mbingu” ni umbo la kawaida la Kiswahili ambalo halilazimishi kutofautisha umoja na wingi.
- source_word: הֲנִהְיָה כַּדָּבָר הַגָּדוֹל הַזֶּה
  choice: Je, jambo lolote kubwa kama hili limewahi kutokea
  rationale: היה hapa huuliza kama tukio kama hilo limepata kutokea; “limewahi” hudhihirisha upeo wa swali la balagha.
- source_word: הֲנִשְׁמַע כָּמֹהוּ
  choice: au jambo kama hilo limewahi kusikiwa?
  rationale: Nifali ya שׁמע ina maana ya kusikiwa au kuripotiwa; tafsiri hii huhifadhi hali tendwa na nguvu ya swali.
theological_decisions:
- issue: Maana ya אָדָם katika muktadha wa uumbaji
  choice: mwanadamu
  alternative: Adamu; wanadamu
  rationale: Mstari unachunguza historia tangu uumbaji. “Mwanadamu” huhifadhi nomino ya umoja yenye maana ya uwakilishi na kuepuka kuamua bila lazima kuwa ni jina maalumu la mtu binafsi. Tanbihi inaweka wazi maana ya kijumla inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali la balagha na upeo wa kihistoria kutoka uumbaji hadi miisho ya mbingu umehifadhiwa bila kuondoa utata halisi wa אָדָם.
