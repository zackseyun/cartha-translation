base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/027.yaml
  text: And Yahweh will scatter you among the peoples[a], and you will be left few in number among the nations where Yahweh will drive you.
translation:
  language: sw
  text: Yahwe atawatawanya miongoni mwa watu wa mataifa mbalimbali, nanyi mtabaki wachache kwa idadi miongoni mwa mataifa ambako Yahwe atawapeleka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atawaongoza huko.” Kitenzi cha Kiebrania kinaweza kumaanisha “kuongoza” au “kupeleka”; katika muktadha wa hukumu na uhamisho, “atawapeleka” hufaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵפִיץ
  choice: atawatawanya
  rationale: Hifili ya פוץ inaonyesha kusababisha watu watawanyike; “atawatawanya” ni ya kawaida na inafaa muktadha wa hukumu na uhamisho.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa moja kwa moja katika Kiebrania; “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- source_word: בָּעַמִּים
  choice: miongoni mwa makabila ya watu
  rationale: עַמִּים humaanisha vikundi vya watu; usemi huu pia unatofautisha neno hili na גּוֹיִם, ambalo limetafsiriwa “mataifa” baadaye katika aya.
- source_word: וְנִשְׁאַרְתֶּם
  choice: nanyi mtabaki
  rationale: Nifali ya שׁאר inaeleza mabaki baada ya hukumu; “mtabaki” ni ya asili katika Kiswahili na inadumisha matokeo hayo.
- source_word: מְתֵי מִסְפָּר
  choice: wachache kwa idadi
  rationale: Nahau hii humaanisha watu wachache sana, wanaoweza kuhesabika kwa urahisi; “wachache kwa idadi” ni wazi bila kuwa tafsiri ya neno kwa neno isiyo ya kawaida.
- source_word: בַּגּוֹיִם
  choice: miongoni mwa mataifa
  rationale: גּוֹיִם hapa inarejelea mataifa ya kigeni kwa ujumla, si lazima dhana ya baadaye ya kidini ya “Watu wa Mataifa.”
- source_word: אֲשֶׁר יְנַהֵג ... שָׁמָּה
  choice: ambako ... atawapeleka kwa nguvu
  rationale: נהג inaweza kumaanisha kuongoza au kuendesha/kupeleka kwa kulazimisha. Muktadha wa hukumu na uhamisho unaunga mkono wazo la kupelekwa kwa nguvu, huku “ambako” ikihifadhi maana ya שָׁמָּה.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia Tetragramatoni kama jina binafsi la Mungu; “Yahwe” hulihifadhi badala ya kuweka cheo mahali pake.
- issue: Nguvu ya kitenzi יְנַהֵג katika muktadha wa hukumu
  choice: atawapeleka kwa nguvu
  alternative: atawaongoza
  rationale: Kitenzi kinaweza kubeba maana zote mbili. Muktadha wa kutawanywa na uhamisho unaelekea kwenye kupelekwa kwa kulazimishwa, lakini maana mbadala ya kuongoza imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Makabila ya watu” hutumiwa kutofautisha עַמִּים na “mataifa” kwa גּוֹיִם. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika moja kwa moja.
