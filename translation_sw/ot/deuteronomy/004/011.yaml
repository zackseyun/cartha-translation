base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/011.yaml
  text: And you came near and stood at the foot of the mountain[a], while the mountain was burning with fire up to the heart of the heavens—darkness, cloud[b], and thick gloom.
translation:
  language: sw
  text: Nanyi mkakaribia mkasimama chini ya mlima; mlima nao ulikuwa unawaka moto hadi katikati ya mbingu[a]—giza, wingu na giza nene[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “hadi kwenye moyo wa mbingu”; yaani, hadi katikati au juu sana mbinguni.
    reason: lexical_alternative
  - marker: b
    text: Au “giza zito” au “giza kuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן
  choice: mkakaribia
  rationale: Kitenzi hiki cha nafsi ya pili wingi kinaonyesha watu wakisogea karibu na mlima; “mkakaribia” ni Kiswahili cha kawaida na huhifadhi mwendo huo.
- source_word: וַתַּעַמְדוּן
  choice: na kusimama
  rationale: עמד humaanisha kusimama. Muundo huu unaunganisha kwa kawaida matendo mawili yanayofuatana bila kubadili maana.
- source_word: תַּחַת הָהָר
  choice: chini ya mlima
  rationale: Katika muktadha huu תַּחַת inaonyesha mahali pa chini, yaani kwenye sehemu ya chini au mguu wa mlima. “Chini ya mlima” ni usemi wa asili wa Kiswahili na haudai kwamba watu walikuwa ndani ya pango au mlima ukiwa juu yao.
- source_word: בֹּעֵר בָּאֵשׁ
  choice: ulikuwa unawaka moto
  rationale: Kitenzi-jina בֹּעֵר huonyesha hali au tendo linaloendelea. “Ulikuwa unawaka moto” huhifadhi taswira hai na kutaja moto waziwazi.
- source_word: עַד לֵב הַשָּׁמַיִם
  choice: hadi katikati ya mbingu
  rationale: Neno לֵב ni “moyo” kihalisi lakini hapa limetumiwa kwa maana ya katikati au sehemu ya juu ya mbingu. “Katikati ya mbingu” huwasilisha nahau hiyo kwa Kiswahili kinachoeleweka, huku tanbihi ikihifadhi taswira halisi.
- source_word: חֹשֶׁךְ
  choice: giza
  rationale: Hii ndiyo maana ya kawaida ya חֹשֶׁךְ na ni sehemu ya mfululizo wa taswira za kujidhihirisha kwa Mungu.
- source_word: עָנָן
  choice: wingu
  rationale: Tafsiri ya moja kwa moja ya nomino ya umoja עָנָן; umoja pia unasikika kwa kawaida katika Kiswahili.
- source_word: וַעֲרָפֶל
  choice: giza nene
  rationale: עֲרָפֶל hueleza giza zito au hali nzito inayoficha. “Giza nene” huitofautisha kwa kiasi na “giza” iliyotangulia na kuhifadhi uzito wa taswira.
theological_decisions:
- issue: Taswira ya kujidhihirisha kwa Mungu katika Sinai
  choice: Kuhifadhi maelezo halisi na yenye kuogofya ya moto, giza, wingu na giza nene.
  alternative: Kuyafanya maneno ya mwisho kuwa maelezo ya jumla tu ya hali ya anga.
  rationale: Mstari unaonyesha kujidhihirisha kwa Mungu kwa taswira kadhaa zenye uzito. Tafsiri haiyapunguzi kuwa hali ya hewa ya kawaida wala kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kibiblia lakini kinachoeleweka kwa wasomaji wa kawaida. “Nanyi” hudumisha mwendelezo wa hotuba ya Musa; alama ya mkato mrefu inaonyesha orodha nzito ya hali zilizofunika mlima.
