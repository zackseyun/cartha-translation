source:
  edition: WLC
  text: מִן הַ/שָּׁמַ֛יִם הִשְׁמִֽיעֲ/ךָ֥ אֶת קֹל֖/וֹ לְ/יַסְּרֶ֑/ךָּ וְ/עַל הָ/אָ֗רֶץ הֶרְאֲ/ךָ֙ אֶת אִשּׁ֣/וֹ הַ/גְּדוֹלָ֔ה וּ/דְבָרָ֥י/ו שָׁמַ֖עְתָּ מִ/תּ֥וֹךְ הָ/אֵֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/036.yaml
  text: From heaven he made you hear his voice to discipline you[a], and on earth he showed you his great fire[b], and you heard his words from the midst of the fire.
translation:
  language: sw
  text: Kutoka mbinguni alikufanya usikie sauti yake ili kukuadibisha[a]; na duniani alikuonyesha moto wake mkubwa, nawe ukasikia maneno yake kutoka katikati ya moto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili kukufundisha” au “ili kukurekebisha”; kitenzi cha Kiebrania kinaweza kujumuisha nidhamu inayorekebisha na inayomjenga mtu.
    reason: lexical_alternative
  - marker: b
    text: Au, “kutoka ndani ya moto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשָּׁמַיִם
  choice: Kutoka mbinguni
  rationale: Huhifadhi asili ya sauti na pia utofauti wa mahali kati ya mbinguni na duniani.
- source_word: הִשְׁמִיעֲךָ
  choice: alikufanya uisikie
  rationale: Huhifadhi maana ya kisababishi ya Hifili ya שׁמע kwa Kiswahili cha kawaida.
- source_word: קֹלוֹ
  choice: sauti yake
  rationale: Katika muktadha wa Mungu kusema, קוֹל humaanisha sauti inayosikika.
- source_word: לְיַסְּרֶךָּ
  choice: ili kukuadibisha
  rationale: Kitenzi יסר kinaweza kuhusisha kufundisha, kurekebisha na kutoa nidhamu; 'kukuadibisha' kinahifadhi wigo huo kwa ufupi, huku tanbihi ikibainisha uwezekano mwingine.
- source_word: וְעַל הָאָרֶץ
  choice: na duniani
  rationale: Huhifadhi utofauti wa kimahali na 'kutoka mbinguni' na ni usemi wa kawaida wa Kiswahili.
- source_word: הֶרְאֲךָ
  choice: alikuonyesha
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya umbo la kisababishi la ראה.
- source_word: אֶת אִשּׁוֹ הַגְּדוֹלָה
  choice: moto wake mkubwa
  rationale: Huhifadhi picha halisi, kivumishi na umilikaji wa maandishi ya Kiebrania bila kuongeza maelezo.
- source_word: וּדְבָרָיו
  choice: maneno yake
  rationale: Huhifadhi wingi ulio wazi katika Kiebrania na kuonyesha usemi uliotamkwa.
- source_word: שָׁמַעְתָּ
  choice: ukasikia
  rationale: Huonyesha tendo halisi la kusikia na kuunganisha kwa kawaida tukio hili na tendo lililotangulia.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: kutoka katikati ya moto
  rationale: Huhifadhi maana halisi ya 'kutoka ndani/katikati ya' pamoja na taswira yake yenye uzito.
theological_decisions:
- issue: Kusudi la kimalezi la Mungu katika לְיַסְּרֶךָּ
  choice: ili kukuadibisha
  alternative: ili kukufundisha; ili kukurekebisha
  rationale: Chaguo hili halifanyi tendo kuwa adhabu tu wala mafundisho tu, bali linaacha wazi mvutano wa Kiebrania kati ya nidhamu, marekebisho na mafunzo.
- issue: Kuhifadhi lugha halisi kuhusu kujifunua kwa Mungu
  choice: sauti yake ... moto wake mkubwa ... maneno yake
  alternative: kauli zilizoeleza dhana hizi kwa lugha ya kidhahania
  rationale: Maneno halisi ya Kiebrania yamehifadhiwa bila kuyapunguza kuwa dhana za jumla, ili taswira na teolojia ya kifungu zibaki wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi utofauti wa 'kutoka mbinguni' na 'duniani,' pamoja na mfuatano wa sauti, moto na maneno. Kiunganishi 'nawe' na umbo 'ukasikia' vinaifanya isomeke kwa kawaida bila kufuta uhusiano wa vipashio vya Kiebrania.
