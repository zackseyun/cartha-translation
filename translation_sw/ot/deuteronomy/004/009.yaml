review_pass:
  verdict: revise
  source_fidelity: The draft substantially conveys the warning, eyewitness experience, heart metaphor, lifelong duration, and intergenerational transmission. However, “Lakini” introduces a contrast not expressed by רַק, and “Wajulishe” takes the children as its direct object rather than making the witnessed matters the object to be made known.
  naturalness: The revision uses natural Standard East African Swahili while retaining the solemn, exhortatory register and the twofold warning.
  terminology: “Moyo” appropriately preserves לֵבָב. “Watoto” is suitable for בָנֶיךָ in this intergenerational context, with a footnote retaining the more specifically male lexical alternative. “Uyajulishe” correctly makes “mambo” the item made known.
  issues:
  - severity: medium
    issue: “Lakini” for רַק
    rationale: רַק is an emphatic/restrictive particle (“only”), not a coordinating adversative (“but”). “Jihadhari tu” retains the restrictive emphasis without adding a contrast.
  - severity: high
    issue: Object relation in “Wajulishe watoto wako ...”
    rationale: The Hiphil וְהוֹדַעְתָּם means “make them [the matters] known.” In the draft, “Wajulishe” naturally means “inform your children,” leaving the matters unexpressed as the object. “Uyajulishe watoto wako ...” restores the source’s object relation.
  - severity: low
    issue: Footnote anchor placement
    rationale: The lexical-alternative note concerns “watoto/wana”; placing its anchor immediately after that phrase makes the reference unambiguous.
  revised_text: Jihadhari tu, na ujilinde sana, usije ukayasahau mambo ambayo macho yako yaliyaona, wala yasiondoke moyoni mwako siku zote za maisha yako. Uyajulishe watoto wako na watoto wa watoto wako[a].
  revised_footnotes:
  - marker: a
    text: Au “wana wako na wana wa wana wako.” Maneno ya Kiebrania ni ya kiume kisarufi, lakini katika muktadha yanaweza kumaanisha watoto au wazao kwa ujumla.
    reason: lexical_alternative
  revision_rationale: The revision removes the added adversative nuance, keeps the source’s emphatic self-watchfulness, and corrects the syntactic relation of “make them known” by marking the witnessed matters as the object. It retains the inclusive contextual rendering of בָנִים and places the existing lexical footnote at its relevant expression.
