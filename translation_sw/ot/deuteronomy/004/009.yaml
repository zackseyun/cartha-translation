  rationale: The revision removes the added adversative nuance, keeps the source’s emphatic self-watchfulness, and corrects the syntactic relation of “make them known” by marking the witnessed matters as the object. It retains the inclusive contextual rendering of בָנִים and places the existing lexical footnote at its relevant expression.
