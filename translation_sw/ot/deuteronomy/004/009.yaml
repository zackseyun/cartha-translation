  text: רַ֡ק הִשָּׁ֣מֶר לְ/ךָ֩ וּ/שְׁמֹ֨ר נַפְשְׁ/ךָ֜ מְאֹ֗ד פֶּן תִּשְׁכַּ֨ח אֶת הַ/דְּבָרִ֜ים אֲשֶׁר רָא֣וּ עֵינֶ֗י/ךָ וּ/פֶן יָס֨וּרוּ֙ מִ/לְּבָ֣בְ/ךָ֔ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ וְ/הוֹדַעְתָּ֥/ם לְ/בָנֶ֖י/ךָ וְ/לִ/בְנֵ֥י בָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/009.yaml
  text: Only guard yourself carefully[a], and keep your soul very carefully, lest you forget the things that your eyes saw and lest they depart from your heart all the days of your life. Make them known to your children and to your children's children[b],
translation:
  language: sw
  text: Jihadhari tu, na ujilinde sana, usije ukayasahau mambo ambayo macho yako yaliyaona, wala yasiondoke moyoni mwako siku zote za maisha yako. Uyajulishe watoto wako na watoto wa watoto wako[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wana wako na wana wa wana wako.” Maneno ya Kiebrania ni ya kiume kisarufi, lakini katika muktadha yanaweza kumaanisha watoto au wazao kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק הִשָּׁמֶר לְךָ
  choice: Lakini jihadhari sana
  rationale: רַק hapa inaweka mkazo wa tahadhari unaotofautisha agizo hili na yaliyotangulia; “lakini” pamoja na “sana” hutoa nguvu hiyo kwa Kiswahili cha kawaida. Kitenzi cha kujirejelea “jihadhari” kinawakilisha nahau ya kujilinda kwa uangalifu.
- source_word: וּשְׁמֹר נַפְשְׁךָ מְאֹד
  choice: na ujilinde kwa makini kabisa
  rationale: נֶפֶשׁ katika muktadha huu ni nafsi nzima, yaani mtu mwenyewe, si lazima ‘roho’ kama sehemu isiyo ya mwili. “Ujilinde” huhifadhi maana ya kujirejelea, na “kwa makini kabisa” huonyesha מְאֹד pamoja na kurudiwa kwa mzizi שׁמר.
- source_word: פֶּן תִּשְׁכַּח
  choice: usije ukayasahau
  rationale: Muundo wa “usije” unaonyesha onyo la kusudi au matokeo hasi linalobebwa na פֶּן, kwa Kiswahili cha asili na chenye uzito.
- source_word: הַדְּבָרִים אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: mambo ambayo macho yako yaliyaona
  rationale: דְּבָרִים inaweza kuwa maneno, mambo, au matukio; kwa kuwa yalisikiwa kwa kuona, “mambo” ndiyo chaguo pana na linalofaa. “Macho yako yaliyaona” huhifadhi msisitizo wa ushuhuda wa moja kwa moja.
- source_word: וּפֶן יָסוּרוּ מִלְּבָבְךָ
  choice: wala yasitoke moyoni mwako
  rationale: “Yasitoke” huwasilisha sitiari ya סור, kuondoka au kugeuka kando, bila kuibadili “moyo” kuwa “akili” na hivyo kuficha upana wa dhana ya Kiebrania.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: siku zote za maisha yako
  rationale: Hii ni tafsiri ya wazi na ya asili ya nahau ya Kiebrania, ikihifadhi muundo na maana ya muda wote wa maisha.
- source_word: וְהוֹדַעְתָּם
  choice: Wajulishe
  rationale: Hifili ya ידע ina maana ya kufanya wajue au kuwajulisha. “Wajulishe” ni ya moja kwa moja kuliko “wafundishe,” ambayo ingeongeza dhana isiyotajwa wazi katika kitenzi.
- source_word: לְבָנֶיךָ וְלִבְנֵי בָנֶיךָ
  choice: watoto wako na watoto wa watoto wako
  rationale: בָּנִים ni nomino ya kiume kisarufi lakini inaweza kutaja watoto au wazao kwa upana katika muktadha. “Watoto” linafaa kwa amri hii ya kupitisha kumbukumbu kizazi hadi kizazi; tanbihi huhifadhi uwezekano wa tafsiri mahsusi ya “wana.”
theological_decisions:
- issue: Maana ya kiantropolojia ya נֶפֶשׁ
  choice: imetafsiriwa kwa kitenzi cha kujirejelea “ujilinde,” yaani umlinde mtu wako wote
  alternative: “ilinde nafsi yako” au “ilinde roho yako”
  rationale: Katika onyo hili נֶפֶשׁ humaanisha mtu mwenyewe au uhai wake kwa upana. “Roho” ingeweza kuingiza mgawanyo maalumu wa mwili na roho ambao kifungu hakilazimishi; “nafsi” pia ingeweza kueleweka kwa maana finyu.
- issue: Maana ya לֵבָב
  choice: moyo
  alternative: akili au kumbukumbu
  rationale: Neno la Kiebrania linahusu utu wa ndani, likijumuisha kumbukumbu, ufahamu na nia. Kuhifadhi “moyo” kunadumisha sitiari na upana wake bila kuamua kimya-kimya kuwa ni akili pekee.
- issue: Upeo wa kijinsia wa בָנֶיךָ
  choice: watoto wako
  alternative: wana wako
  rationale: Katika agizo la kupitisha ushuhuda kwa vizazi, neno la kiume linaweza kuwa la uwakilishi kwa watoto au wazao. Tafsiri kuu inaonyesha upeo huo, huku tanbihi ikitaja tafsiri halisi zaidi ya kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Kurudiwa kwa tahadhari kumehifadhiwa kupitia “jihadhari sana” na “ujilinde kwa makini kabisa.” “Moyo” umeachwa katika matini kuu ili kuhifadhi taswira na upana wa Kiebrania. Alama ya tanbihi [a] ipo katika matini kuu na inaeleza upeo wa neno la watoto/wana.
