revisions:
- from: Jihadhari usije ukainua macho yako kuelekea mbinguni, ukaona jua, mwezi na nyota—jeshi lote la mbinguni—kisha ukavutwa ukazisujudia na kuzitumikia. Hivyo ndivyo Yahwe Mungu wako alivyovigawia[a] mataifa yote chini ya mbingu zote.[b]
  to: Jihadhari usije ukainua macho yako kuelekea mbinguni, ukaona jua, mwezi na nyota—jeshi lote la mbinguni—kisha ukapotoshwa, ukazisujudia na kuzitumikia, vitu ambavyo Yahwe, Mungu wako, alivigawia[a] mataifa yote chini ya mbingu zote.[b]
  rationale: The revision restores the Hebrew relative-clause relationship by making “vitu ambavyo ... alivigawia” modify the celestial bodies. It also uses “ukapotoshwa” to express the passive warning that the reader be led astray. The allotment wording remains deliberately noncommittal about whether the nations' worship was approved.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T17:10:43Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the warning, the celestial bodies, the paired acts of prostrating oneself and serving, and the non-approving sense of Yahweh's allotment. However, the final independent sentence, “Hivyo ndivyo ...,” does not represent the Hebrew relative clause אֲשֶׁר (“which/that”), which modifies the celestial bodies and continues the warning's sentence.
  naturalness: The Swahili is generally clear and appropriately formal. Recasting the final clause as a relative clause makes the syntax both more natural and faithful. “Ukapotoshwa” naturally conveys being led astray in this religious context.
  terminology: “Yahwe,” “Mungu wako,” “kusujudia,” and “kuzitumikia” are suitable. “Jeshi lote la mbinguni” preserves the Hebrew image without specifying angels. The footnotes are retained, with the first one made idiomatic and its wording aligned to the clause it annotates.
  issues:
  - severity: high
    issue: The clause “Hivyo ndivyo Yahwe Mungu wako alivyovigawia mataifa yote...” is not syntactically faithful to the Hebrew.
    rationale: 'אֲשֶׁר introduces a relative clause: the sun, moon, stars, and whole heavenly host are the things Yahweh allotted to all peoples. “Hivyo ndivyo” means “That is how,” creating an independent explanatory statement rather than modifying those bodies.'
  - severity: low
    issue: “Ukavutwa” can be understood as literal or neutral attraction.
    rationale: “Ukapotoshwa” more clearly expresses the contextual passive sense of being led astray into idolatry, while retaining the source's non-specific agency.
  revised_text: Jihadhari usije ukainua macho yako kuelekea mbinguni, ukaona jua, mwezi na nyota—jeshi lote la mbinguni—kisha ukapotoshwa, ukazisujudia na kuzitumikia, vitu ambavyo Yahwe, Mungu wako, alivigawia[a] mataifa yote chini ya mbingu zote.[b]
  revised_footnotes:
  - marker: a
    text: Au “alivyovitenga kwa ajili ya” au “alivyovipangia.” Kiebrania kinasema kwamba Yahwe alivigawia mataifa yote vitu hivyo; maneno yenyewe hayasemi kwamba aliidhinisha viabudiwe.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “chini ya mbingu zote”; nahau hii pia inaweza kutafsiriwa “chini ya mbingu yote.”
    reason: lexical_alternative
  revision_rationale: The revision restores the Hebrew relative-clause relationship by making “vitu ambavyo ... alivigawia” modify the celestial bodies. It also uses “ukapotoshwa” to express the passive warning that the reader be led astray. The allotment wording remains deliberately noncommittal about whether the nations' worship was approved.
