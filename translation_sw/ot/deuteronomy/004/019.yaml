  text: וּ/פֶן תִּשָּׂ֨א עֵינֶ֜י/ךָ הַ/שָּׁמַ֗יְמָ/ה וְֽ֠/רָאִיתָ אֶת הַ/שֶּׁ֨מֶשׁ וְ/אֶת הַ/יָּרֵ֜חַ וְ/אֶת הַ/כּֽוֹכָבִ֗ים כֹּ֚ל צְבָ֣א הַ/שָּׁמַ֔יִם וְ/נִדַּחְתָּ֛ וְ/הִשְׁתַּחֲוִ֥יתָ לָ/הֶ֖ם וַ/עֲבַדְתָּ֑/ם אֲשֶׁ֨ר חָלַ֜ק יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֹתָ֔/ם לְ/כֹל֙ הָֽ/עַמִּ֔ים תַּ֖חַת כָּל הַ/שָּׁמָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/019.yaml
  text: And beware lest you lift up your eyes to heaven[a], and when you see the sun and the moon and the stars—all the host of heaven—you be drawn away and bow down to them and serve them[b], which Yahweh your God has allotted to all the peoples under all the heavens.
translation:
  language: sw
  text: Jihadhari usije ukainua macho yako kuelekea mbinguni, ukaona jua, mwezi na nyota—jeshi lote la mbinguni—kisha ukapotoshwa, ukazisujudia na kuzitumikia, vitu ambavyo Yahwe, Mungu wako, alivigawia[a] mataifa yote chini ya mbingu zote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alivyovitenga kwa ajili ya” au “alivyovipangia.” Kiebrania kinasema kwamba Yahwe alivigawia mataifa yote vitu hivyo; maneno yenyewe hayasemi kwamba aliidhinisha viabudiwe.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “chini ya mbingu zote”; nahau hii pia inaweza kutafsiriwa “chini ya mbingu yote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפֶן
  choice: Jihadhari usije
  rationale: Muundo huu unaonyesha wazi onyo dhidi ya jambo linaloweza kutokea, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: תִּשָּׂא עֵינֶיךָ הַשָּׁמַיְמָה
  choice: ukainua macho yako kuelekea mbinguni
  rationale: Unahifadhi nahau ya Kiebrania ya kuinua macho na pia mwelekeo wa kutazama juu.
- source_word: כֹּל צְבָא הַשָּׁמַיִם
  choice: jeshi lote la mbinguni
  rationale: Neno צָבָא humaanisha jeshi au kundi kubwa lililopangwa; hapa linarejelea jumla ya vitu vya angani bila kulifanya limaanishe malaika pekee.
- source_word: וְנִדַּחְתָּ
  choice: ukavutwa
  rationale: Kauli ya kutendwa inadumishwa na kuonyesha kuvutwa au kupotoshwa kuelekea ibada ya sanamu bila kudai kulazimishwa kabisa.
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם וַעֲבַדְתָּם
  choice: ukazisujudia na kuzitumikia
  rationale: Jozi hii inahifadhi tendo la kuinama kwa ibada na wazo la kuzitumikia katika muktadha wa kidini.
- source_word: אֲשֶׁר חָלַק
  choice: alivyovigawia
  rationale: Kitenzi חלק kina wazo la kugawa au kuwekea sehemu. Tafsiri haiongezi dai kwamba Yahwe aliidhinisha kuabudiwa kwa vitu hivyo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu linawakilishwa kwa umbo la Kiswahili linalotambulika badala ya kubadilishwa kuwa cheo.
- source_word: לְכֹל הָעַמִּים
  choice: mataifa yote
  rationale: Katika muktadha huu, ‘mataifa yote’ ni usemi wa asili unaowakilisha makundi yote ya watu yanayotajwa kwa wingi.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: chini ya mbingu zote
  rationale: Tafsiri hii inahifadhi wingi na upana wa nahau ya Kiebrania badala ya kuibana kimya kimya.
theological_decisions:
- issue: Maana ya kauli kwamba Yahwe alivigawia mataifa yote vitu vya angani
  choice: Kauli imetafsiriwa kuwa Yahwe alivigawia mataifa vitu hivyo, bila kusema kwamba aliidhinisha viabudiwe.
  alternative: Yahwe alivitoa kwa matumizi ya mataifa, au aliyaacha mataifa yaviabudu kama hukumu.
  rationale: Kitenzi חלק kinaruhusu maana ya kugawa au kuwekea sehemu, lakini sentensi yenyewe haifafanui namna hiyo wala haisemi kwamba ibada yao iliidhinishwa. Tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka. ‘Kusujudia’ na ‘kutumikia’ zinadumisha jozi ya matendo ya ibada, huku ‘jeshi lote la mbinguni’ likihifadhi taswira ya maandishi ya Kiebrania.
