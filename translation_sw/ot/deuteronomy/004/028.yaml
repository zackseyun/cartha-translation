  text: וַ/עֲבַדְתֶּם שָׁ֣ם אֱלֹהִ֔ים מַעֲשֵׂ֖ה יְדֵ֣י אָדָ֑ם עֵ֣ץ וָ/אֶ֔בֶן אֲשֶׁ֤ר לֹֽא יִרְאוּ/ן֙ וְ/לֹ֣א יִשְׁמְע֔וּ/ן וְ/לֹ֥א יֹֽאכְל֖וּ/ן וְ/לֹ֥א יְרִיחֻֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/028.yaml
  text: And there you will serve gods[a], the work of human hands, wood and stone, which neither see nor hear nor eat nor smell.
translation:
  language: sw
  text: Na huko mtaitumikia miungu, kazi ya mikono ya wanadamu—mbao na mawe—ambayo haioni, haisikii, haili wala hainusi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: mtaitumikia
  rationale: Kitenzi עבד hapa kina maana ya kuitumikia au kuiabudu miungu. Wakati ujao unafaa katika onyo la Musa kuhusu yatakayowapata.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki kinaelekeza kwenye nchi za mataifa ambako watu watatawanywa, kama muktadha uliotangulia unavyoonyesha.
- source_word: אֱלֹהִים
  choice: miungu
  rationale: Hii ndiyo maana ya moja kwa moja ya nomino katika muktadha huu. Tafsiri ya ‘sanamu’ ingeongeza ufafanuzi ambao tayari unatolewa na maneno yanayofuata kuhusu kutengenezwa kwa mikono ya wanadamu.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: kazi ya mikono ya wanadamu
  rationale: Tafsiri hii inadumisha picha ya Kiebrania na inaonyesha kwamba miungu hiyo imetengenezwa na watu.
- source_word: עֵץ וָאֶבֶן
  choice: mbao na mawe
  rationale: Katika muktadha huu עֵץ inamaanisha kitu cha mbao au nyenzo ya mbao, si mti ulio hai; ‘mbao na mawe’ ni Kiswahili cha kawaida kinachoeleza nyenzo za miungu hiyo.
- source_word: אֲשֶׁר לֹא יִרְאוּן וְלֹא יִשְׁמְעוּן וְלֹא יֹאכְלוּן וְלֹא יְרִיחֻן
  choice: ambayo haioni, haisikii, haili wala hainusi
  rationale: Vikanushi vinne vya Kiebrania vimehifadhiwa kama kauli za moja kwa moja kuhusu kutotenda kwa miungu hiyo, bila kubadili waziwazi kauli hiyo kuwa ya kutokuwa na uwezo.
- source_word: יְרִיחֻן
  choice: hainusi
  rationale: Kitenzi kinarejelea tendo la kunusa; ‘hainusi’ ni neno la kawaida na linaendana na orodha ya kuona, kusikia na kula.
theological_decisions:
- issue: Ikiwa אֱלֹהִים itafsiriwe ‘miungu’ au ‘sanamu’
  choice: miungu
  alternative: sanamu
  rationale: ‘Miungu’ huhifadhi istilahi ya Kiebrania na mvutano wa kauli kwamba watu wataitumikia; maelezo yanayofuata yenyewe yanaonyesha kuwa ni vitu vilivyotengenezwa na wanadamu.
- issue: Ikiwa vitenzi hasi vielezwe kuwa kutoweza au kutotenda
  choice: haioni, haisikii, haili wala hainusi
  alternative: haiwezi kuona, kusikia, kula wala kunusa
  rationale: Kiebrania kinasema moja kwa moja kwamba vitu hivyo havioni, havisikii, havili, wala havinusi. Tafsiri iliyochaguliwa inahifadhi muundo huo bila kuondoa dhihaka yake ya kitheolojia.
- issue: Maana ya אָדָם katika msemo huu
  choice: wanadamu
  alternative: mwanadamu
  rationale: Neno hili ni la kijumla hapa na linarejelea utengenezaji unaofanywa na binadamu, si mwanamume fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mtaitumikia’ huhifadhi maana ya msingi ya kutumikia huku muktadha wa miungu ukibeba maana ya ibada. Mistari mirefu imetenganishwa kwa vistari ili apposition ‘mbao na mawe’ isomeke wazi.
