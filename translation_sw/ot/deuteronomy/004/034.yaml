  text: א֣וֹ הֲ/נִסָּ֣ה אֱלֹהִ֗ים לָ֠/בוֹא לָ/קַ֨חַת ל֣/וֹ גוֹי֮ מִ/קֶּ֣רֶב גּוֹי֒ בְּ/מַסֹּת֩ בְּ/אֹתֹ֨ת וּ/בְ/מוֹפְתִ֜ים וּ/בְ/מִלְחָמָ֗ה וּ/בְ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בְ/מוֹרָאִ֖ים גְּדֹלִ֑ים כְּ֠/כֹל אֲשֶׁר עָשָׂ֨ה לָ/כֶ֜ם יְהוָ֧ה אֱלֹהֵי/כֶ֛ם בְּ/מִצְרַ֖יִם לְ/עֵינֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/034.yaml
  text: Or has any god ever attempted to go and take for himself a nation from the midst of another nation[a], by trials, by signs, and by wonders, and by war, and by a mighty hand, and by an outstretched arm, and by great terrors, according to all that Yahweh your God did for you in Egypt before your eyes?
translation:
  language: sw
  text: Au, je, kuna mungu yeyote aliyewahi kujaribu kuja kujichukulia taifa kutoka katikati ya taifa jingine, kwa majaribu, kwa ishara, kwa maajabu, kwa vita, kwa mkono wenye nguvu, kwa mkono ulionyoshwa, na kwa matendo makuu ya kutisha[a], kama yote ambayo Yahwe Mungu wenu aliwafanyia nchini Misri mbele ya macho yako?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo makubwa ya kutisha.” Usemi wa Kiebrania unamaanisha matendo au mambo yanayoleta hofu na mshangao mkubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִסָּה
  choice: aliyewahi kujaribu
  rationale: Kitenzi נסה hapa humaanisha kujaribu kufanya jambo. Muundo huu wa Kiswahili unaendeleza swali la balagha kuhusu tendo lisilopata kutokea bila kulielekeza kwenye maana ya kumjaribu mtu.
- source_word: אֱלֹהִים
  choice: mungu yeyote
  rationale: Nomino hii inatumika kwa maana ya jumla katika ulinganisho wa balagha; ‘mungu yeyote’ huonyesha wazi kuwa swali linahusu mungu wowote, tofauti na Yahwe anayetajwa baadaye.
- source_word: לָבוֹא לָקַחַת
  choice: kuja kujichukulia
  rationale: Vitenzi hivi vinaonyesha mwendo wenye kusudi unaofuatwa na kujitwalia taifa. ‘Kujichukulia’ pia huhifadhi kiwakilishi לּוֹ, ‘kwa ajili yake mwenyewe.’
- source_word: גּוֹי מִקֶּרֶב גּוֹי
  choice: taifa kutoka katikati ya taifa jingine
  rationale: Huhifadhi picha ya taifa moja kutolewa kutoka ndani ya taifa lingine na marudio yenye mkazo ya neno גּוֹי.
- source_word: בְּמַסֹּת
  choice: kwa majaribu
  rationale: Neno hili hurejelea matukio ya kupima au kujaribu katika ukombozi kutoka Misri. ‘Majaribu’ huhifadhi upana wa maana bila kuyaita tu miujiza.
- source_word: בְּאֹתֹת וּבְמוֹפְתִים
  choice: kwa ishara, kwa maajabu
  rationale: Hili ni jozi la kawaida la maneno yanayoeleza matendo yenye maana ya kiishara na matendo ya kushangaza; marudio ya ‘kwa’ yanaakisi בְּ ya Kiebrania.
- source_word: וּבְמִלְחָמָה
  choice: kwa vita
  rationale: Huhifadhi maana ya moja kwa moja ya vita na upande wa mapambano katika ukombozi kutoka Misri.
- source_word: וּבְיָד חֲזָקָה
  choice: kwa mkono wenye nguvu
  rationale: Huhifadhi taswira ya Kiebrania inayotumika mara kwa mara kuhusu nguvu za Mungu katika tukio la kutoka Misri.
- source_word: וּבִזְרוֹעַ נְטוּיָה
  choice: kwa mkono ulionyoshwa
  rationale: Ni usemi wa asili na wenye hadhi katika Kiswahili unaohifadhi taswira ya kiungo kilichonyoshwa kutenda kwa nguvu.
- source_word: וּבְמוֹרָאִים גְּדֹלִים
  choice: kwa mambo makubwa ya kutisha
  rationale: מוֹרָאִים inaweza kumaanisha matendo au mambo yanayosababisha hofu na mshangao. Tafsiri hii huepuka kuifanya imaanishe hisia za hofu pekee.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: kama yote ambayo ... aliwafanyia
  rationale: Huunganisha swali la balagha na matendo yote ya kihistoria ya Yahwe kwa Israeli na kuhifadhi wazo jumuishi la כֹל.
- source_word: לְעֵינֶיךָ
  choice: mbele ya macho yako
  rationale: Huhifadhi nahau ya Kiebrania na umoja wa kisarufi unaomwelekea Israeli kwa jumla, ingawa kishazi kilichotangulia kina kiwakilishi cha wingi.
theological_decisions:
- issue: Rejeo la אֱלֹהִים katika ulinganisho wa balagha
  choice: mungu yeyote
  alternative: Mungu
  rationale: Muktadha unalinganisha matendo ya pekee ya Yahwe na yale ya mungu mwingine yeyote; herufi ndogo na ‘yeyote’ huhifadhi nguvu ya hoja hiyo bila kumtambua mhusika wa kwanza kuwa Mungu wa Israeli.
- issue: Uwakilishi wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Kutumia ‘Yahwe’ huhifadhi jina binafsi la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- issue: Mabadiliko kutoka kiwakilishi cha wingi לָכֶם kwenda umoja לְעֵינֶיךָ
  choice: Mungu wenu ... mbele ya macho yako
  alternative: Mungu wenu ... mbele ya macho yenu
  rationale: Tafsiri inadumisha mabadiliko halisi ya Kiebrania, ambapo watu wanaelekezwa kwanza kwa wingi na kisha Israeli inaelekezwa kama umoja wa pamoja. Kulainisha yote kuwa wingi kungeficha mvutano huo wa kisarufi na kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaosomeka kwa urahisi. Marudio ya ‘kwa’ yamehifadhiwa ili kuonyesha mfululizo wenye mkazo wa njia za ukombozi katika Kiebrania. Alama ya tanbihi imewekwa baada ya kirai kinachohusika, ‘mambo makubwa ya kutisha.’
