base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/012.yaml
  text: Then Yahweh spoke to you from the midst of the fire[a]. You heard the sound of words[c][b], but saw no form—only a voice.
translation:
  language: sw
  text: Ndipo Yahwe aliwanenea kutoka katikati ya moto[a]. Mlisikia sauti ya maneno[b], lakini hamkuona umbo lolote[c]—isipokuwa sauti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka ndani ya moto.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “sauti ya maneno”; pia yaweza kutafsiriwa “sauti ya usemi.”'
    reason: lexical_alternative
  - marker: c
    text: Au, “sura,” “mfano,” au “mwonekano.” Kiebrania kinakazia kwamba hawakuona umbo au mwonekano unaoonekana.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina la agano la Mungu na kutumia tahajia inayofaa matamshi na maandishi ya Kiswahili.
- source_word: וַיְדַבֵּר
  choice: akasema
  rationale: Kitenzi hiki kinaonyesha tendo la kusema katika simulizi; “akasema” ni cha kawaida na chenye hadhi katika Kiswahili.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: kutoka katikati ya moto
  rationale: Linahifadhi picha ya sauti iliyotoka ndani ya moto, si tu karibu na moto.
- source_word: קוֹל דְּבָרִים
  choice: sauti ya maneno
  rationale: Linabaki karibu na muundo wa Kiebrania na kuonyesha kwamba walichosikia kilikuwa usemi wenye maneno.
- source_word: שֹׁמְעִים
  choice: mlisikia
  rationale: Ingawa umbo la Kiebrania ni participio, katika muktadha huu linaeleweka kawaida kama maelezo ya tukio la wakati uliopita.
- source_word: תְמוּנָה
  choice: umbo
  rationale: “Umbo” linaweza kumaanisha sura au mwonekano unaoonekana, bila kulifanya neno hilo kuwa ufafanuzi wa kimadhehebu kuhusu sanamu.
- source_word: אֵינְכֶם רֹאִים
  choice: hamkuona ... lolote
  rationale: Muundo huu wa Kiswahili unaeleza wazi kutokuwapo kwa kitu chochote kilichoonekana na unalingana na wakati wa “mlisikia.”
- source_word: זוּלָתִי קוֹל
  choice: sauti tu
  rationale: Linahifadhi mkazo wa Kiebrania kwamba ufunuo uliopokelewa ulikuwa wa kusikika, huku hakuna umbo lililoonekana.
theological_decisions:
- issue: Lugha kuhusu udhihirisho wa Mungu na kutokuwapo kwa umbo linaloonekana
  choice: Kudumisha tofauti kati ya kusikia maneno na kutoona umbo, bila kuongeza maelezo ya kimafundisho.
  alternative: Mlisikia sauti yake, lakini hamkuona kitu chochote kilichomwakilisha.
  rationale: Kifungu kinasisitiza kwamba Israeli walisikia usemi halisi wa Mungu bila kuona umbo lake. Tafsiri haipanui kauli hiyo kuwa fundisho lisilotajwa moja kwa moja katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi, huku “sauti ya maneno” ikitunza kwa makusudi usemi halisi wa Kiebrania na “sauti tu” ikihifadhi hitimisho lake fupi lenye mkazo.
