source:
  edition: WLC
  text: י֗וֹם אֲשֶׁ֨ר עָמַ֜דְתָּ לִ/פְנֵ֨י יְהוָ֣ה אֱלֹהֶי/ךָ֮ בְּ/חֹרֵב֒ בֶּ/אֱמֹ֨ר יְהוָ֜ה אֵלַ֗/י הַקְהֶל לִ/י֙ אֶת הָ/עָ֔ם וְ/אַשְׁמִעֵ֖/ם אֶת דְּבָרָ֑/י אֲשֶׁ֨ר יִלְמְד֜וּ/ן לְ/יִרְאָ֣ה אֹתִ֗/י כָּל הַ/יָּמִים֙ אֲשֶׁ֨ר הֵ֤ם חַיִּים֙ עַל הָ֣/אֲדָמָ֔ה וְ/אֶת בְּנֵי/הֶ֖ם יְלַמֵּדֽוּ/ן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/010.yaml
  text: the day when you stood before Yahweh your God at Horeb[a], when Yahweh said to me, ‘Assemble the people to me, and I will let them hear my words, so that they may learn to fear me all the days that they live on the earth, and that they may teach their children.’
translation:
  language: sw
  text: ile siku uliposimama mbele za Yahweh Mungu wako huko Horebu, Yahweh aliponiambia, “Nikusanyie watu, nami nitawafanya wasikie maneno yangu, ili wajifunze kunicha siku zote watakazoishi duniani[a], na wawafundishe watoto wao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika nchi.” Neno la Kiebrania אֲדָמָה linaweza kumaanisha dunia au ardhi kwa ujumla, au nchi fulani hususa.
    reason: lexical_alternative
lexical_decisions:
- source_word: י֗וֹם אֲשֶׁר
  choice: ile siku ulipo-
  rationale: Muundo huu unahifadhi nguvu ya wakati ya Kiebrania na unaunganisha kwa kawaida tukio linalokumbukwa na kitenzi kinachofuata.
- source_word: עָמַדְתָּ לִפְנֵי
  choice: uliposimama mbele za
  rationale: Unadumisha taswira halisi ya kusimama mbele za Mungu katika tukio la agano.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetoholewa badala ya kubadilishwa na cheo, hivyo jina binafsi la agano linahifadhiwa.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huu ni uwasilishaji wa moja kwa moja wa muundo wa umilikaji na lugha ya uhusiano wa agano.
- source_word: בְּחֹרֵב
  choice: huko Horebu
  rationale: Ni usemi wa kawaida wa Kiswahili wa kuonyesha mahali, huku jina la mahali likitoholewa kwa namna iliyozoeleka.
- source_word: בֶּאֱמֹר
  choice: aliponiambia
  rationale: Kitenzi hiki kinaonyesha wakati unaoambatana na tukio kuu; muundo huu ni wa asili katika Kiswahili na unajumuisha kiwakilishi cha mtendewa kilicho katika muktadha.
- source_word: הַקְהֶל לִי אֶת הָעָם
  choice: Nikusanyie watu
  rationale: Kauli ya kutendesha ya קהל imewasilishwa kwa ‘kusanya,’ na kiambishi ‘-ie’ kinahifadhi maana ya לִי, yaani kuwakusanya kwa Mungu/kwake.
- source_word: וְאַשְׁמִעֵם
  choice: nami nitawafanya wayasikie
  rationale: 'Muundo wa kutendesha wa שמע umehifadhiwa wazi: Mungu atasababisha watu kuyasikia maneno yake.'
- source_word: דְּבָרָי
  choice: maneno yangu
  rationale: Wingi halisi umehifadhiwa badala ya kuufupisha kuwa ‘ujumbe.’
- source_word: אֲשֶׁר יִלְמְדוּן לְיִרְאָה אֹתִי
  choice: ili wajifunze kunicha
  rationale: ‘Ili’ inaonyesha kusudi, na ‘kunicha’ huhifadhi uzito wa hofu ya agano unaohusisha kicho na utii bila kuupunguza kuwa heshima tu.
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: siku zote watakazoishi
  rationale: Usemi huu wa kawaida wa Kiswahili unadumisha wazo la muda wote wa maisha.
- source_word: עַל הָאֲדָמָה
  choice: duniani
  rationale: אֲדָמָה inaweza kumaanisha ardhi kwa ujumla au nchi maalumu. ‘Duniani’ inafaa kwa kauli ya maisha ya wanadamu bila kuondoa uwezekano mwingine, ambao umewekwa katika tanbihi.
- source_word: וְאֶת בְּנֵיהֶם יְלַמֵּדוּן
  choice: na wawafundishe watoto wao
  rationale: ‘Watoto’ huwasilisha hapa maana pana ya wazao bila kuifanya iwe ya wana wa kiume pekee; kiunganishi kinaendelea kueleza kusudi la kusikia maneno ya Mungu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu moja kwa moja; kulitohowa kama ‘Yahweh’ kunahifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya ירא katika muktadha wa agano
  choice: kunicha
  alternative: kuniheshimu
  rationale: ‘Kunicha’ hudumisha mvutano na uzito wa hofu, kicho na utii uliomo katika kitenzi cha Kiebrania; ‘kuniheshimu’ pekee ingepunguza maana hiyo.
- issue: Uwasilishaji wa בנים
  choice: watoto
  alternative: wana
  rationale: Ingawa umbo la Kiebrania ni la kiume kisarufi, katika muktadha huu linawahusu watoto au wazao kwa ujumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Miundo ‘mbele za,’ ‘Nikusanyie,’ na ‘kunicha’ inadumisha hadhi ya simulizi la agano bila kuwa ya kizamani kupita kiasi.
