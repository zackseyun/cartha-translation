base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/038.yaml
  text: to drive out before you nations greater and mightier than you[a], to bring you in, to give you their land as an inheritance[b], as it is this day.
translation:
  language: sw
  text: ili kuyafukuza[a] kutoka mbele yako mataifa makubwa na yenye nguvu kuliko wewe, ili kukuingiza na kukupa nchi yao iwe urithi wako, kama ilivyo leo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuyanyang’anya nchi yao” au “kuwafanya waipoteze urithi wao.” Kitenzi cha Kiebrania hapa kina wazo la kuwaondoa wakaaji waliotangulia ili nchi yao itolewe kwa mwingine.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “kama siku hii”; ni nahau inayomaanisha “kama ilivyo wazi leo” au “kama hali ilivyo sasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹרִישׁ
  choice: kuyafukuza
  rationale: Katika kausativi, kitenzi hiki humaanisha kuwaondoa waliokuwa wanamiliki nchi ili wengine waipokee. Kwa kuwa yambwa hapa ni mataifa, “kuyafukuza” ni wazi na ya kawaida katika Kiswahili.
- source_word: גּוֹיִם
  choice: mataifa
  rationale: Neno hili lina maana ya mataifa au jamii za kisiasa; “mataifa” linafaa katika muktadha wa nchi na nguvu za kijeshi.
- source_word: גְּדֹלִים וַעֲצֻמִים מִמְּךָ
  choice: makubwa na yenye nguvu kuliko wewe
  rationale: Muundo wa Kiebrania unalinganisha ukubwa na nguvu za mataifa hayo na Israeli; tafsiri hii inaweka wazi ulinganisho huo.
- source_word: מִפָּנֶיךָ
  choice: mbele yako
  rationale: Hii ni nahau ya kuwaondoa kutoka mbele au katika uwepo wa mtu; “mbele yako” huhifadhi taswira ya asili.
- source_word: לַהֲבִיאֲךָ
  choice: kukuingiza
  rationale: Kitenzi hiki katika muktadha kinamaanisha kuwaleta Waisraeli ndani ya nchi, na kishazi kinachofuata kinaonyesha nchi inayokusudiwa.
- source_word: לָתֶת לְךָ אֶת אַרְצָם
  choice: kukupa nchi yao
  rationale: Tafsiri hii ni ya moja kwa moja na hudumisha wazo la nchi kuwa zawadi inayotolewa.
- source_word: נַחֲלָה
  choice: iwe urithi wako
  rationale: Neno hili humaanisha mali ya kudumu inayopokelewa kama urithi, hasa nchi katika muktadha wa agano. Muundo huu ni wa asili katika Kiswahili na unaonyesha kuwa nchi hiyo inapewa Israeli kuwa urithi.
- source_word: כַּיּוֹם הַזֶּה
  choice: kama ilivyo leo
  rationale: Nahau hii ya Kumbukumbu la Torati huelekeza kwenye hali iliyo wazi wakati wa usemi; “kama ilivyo leo” hutoa maana hiyo kwa Kiswahili cha sasa.
theological_decisions:
- issue: Maana ya nchi ya agano katika נַחֲלָה
  choice: iwe urithi wako
  alternative: iwe milki yako
  rationale: “Urithi” huhifadhi wazo la nchi inayotolewa na Mungu na kuwa mali ya kudumu ya agano, bila kupunguza maana hiyo kuwa umiliki wa kawaida tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa sasa na hadhi inayofaa Maandiko. Viunganishi vya “ili” vimedumisha mfululizo wa vitenzi vya kusudi katika Kiebrania. Alama [b] imewekwa baada ya nahau inayofafanuliwa na tanbihi.
