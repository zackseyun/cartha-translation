  yaml_path: translation/ot/deuteronomy/004/033.yaml
  text: Has any people heard the voice of God speaking from the midst of the fire[a], as you have heard, and lived?
translation:
  language: sw
  text: Je, kuna watu wowote waliowahi kuisikia sauti ya Mungu ikisema kutoka katikati ya moto, kama wewe ulivyoisikia na ukaishi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukanusurika.” Kitenzi cha Kiebrania kinamaanisha tu “ukaishi,” lakini muktadha unakazia kwamba uliendelea kuwa hai baada ya kuisikia sauti ya Mungu ikisema kutoka katikati ya moto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/שָׁמַע
  choice: Je, ... wamewahi kuisikia
  rationale: Kiulizi הֲ pamoja na kitenzi timilifu kinaanzisha swali la balagha kuhusu jambo lililowahi kutukia; ‘wamewahi kuisikia’ huwasilisha vizuri maana hiyo ya uzoefu katika Kiswahili.
- source_word: עָם
  choice: watu wowote
  rationale: עָם humaanisha kundi la watu. Katika swali hili la kulinganisha Israeli na watu wengine, ‘watu wowote’ ni usemi wa kawaida na wazi.
- source_word: קוֹל
  choice: sauti
  rationale: Kwa kuwa sauti hiyo inasema, ‘sauti’ inafaa kuliko ‘mlio’ na huonyesha tamko la Mungu linaloeleweka.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la nomino ni la wingi, kitenzi kishirikishi cha umoja מְדַבֵּר na muktadha vinamtaja Mungu kwa umoja.
- source_word: מְדַבֵּר
  choice: ikisema
  rationale: Kishirikishi hiki huonyesha sauti ikiwa katika tendo la kusema; ‘ikisema’ ni ya asili katika Kiswahili na huhifadhi tendo hilo linaloendelea.
- source_word: מִ/תּוֹךְ הָ/אֵשׁ
  choice: kutoka katikati ya moto
  rationale: Huhifadhi taswira mahususi ya sauti kutoka ndani kabisa ya moto, si kutoka karibu nao tu.
- source_word: כַּ/אֲשֶׁר
  choice: kama
  rationale: Huanzisha ulinganisho wa moja kwa moja kati ya uzoefu wa watu wengine wowote na ule wa Israeli.
- source_word: שָׁמַעְתָּ אַתָּה
  choice: wewe ulivyoisikia
  rationale: Kiwakilishi huru אַתָּה kinakazia ‘wewe’; kukiweka wazi huhifadhi mkazo huo. Wakati uliopita unafaa kwa tukio maalumu la Horebu.
- source_word: וַ/יֶּחִי
  choice: wakaendelea kuishi
  rationale: Kitenzi msingi ni ‘kuishi.’ ‘Wakaendelea kuishi’ huhifadhi maana hiyo huku kikionyesha kwa kawaida kwamba hawakufa baada ya kumsikia Mungu.
theological_decisions:
- issue: Jinsi ya kutafsiri אֱלֹהִים katika simulizi la Mungu kujifunua moja kwa moja
  choice: Mungu
  alternative: mungu fulani; miungu
  rationale: Muktadha wa agano na kishirikishi cha umoja vinamtaja Mungu wa Israeli kwa umoja, bila kuhitaji ufafanuzi wa ziada wa kimafundisho.
- issue: Kama maana iliyodokezwa ya kunusurika baada ya kumsikia Mungu ielezwe wazi
  choice: wakaendelea kuishi
  alternative: wakanusurika; wakaishi
  rationale: Kiebrania kinasema kihalisi ‘na akaishi.’ Tafsiri iliyochaguliwa inabaki karibu na maana ya kuishi na kuwasilisha matokeo kwa Kiswahili cha kawaida bila kuongeza kiunganishi kama ‘hata hivyo.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali la balagha umehifadhiwa; ‘wewe’ limetajwa wazi ili kuonyesha mkazo wa Kiebrania.
