  variant: Standard East African Swahili
source:
  edition: WLC
  text: פֶּ֨ן תַּשְׁחִת֔וּ/ן וַ/עֲשִׂיתֶ֥ם לָ/כֶ֛ם פֶּ֖סֶל תְּמוּנַ֣ת כָּל סָ֑מֶל תַּבְנִ֥ית זָכָ֖ר א֥וֹ נְקֵבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/016.yaml
  text: so that you do not act corruptly and make for yourselves a carved image[a], in the form of any figure, the likeness of male or female—
translation:
  language: sw
  text: msije mkafanya uovu na kujitengenezea sanamu ya kuchongwa[a], yenye umbo la kielelezo chochote, mfano wa kiume au wa kike—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msije mkajiharibu na kujitengenezea sanamu ya kuchongwa, umbo la kielelezo chochote, mfano wa kiume au wa kike.”
    reason: Huhifadhi uwezekano wa kutafsiri תַּשְׁחִתוּן kwa maana ya “kujiharibu,” huku ikifuata kwa karibu mfuatano wa istilahi za Kiebrania za umbo na mfano.
lexical_decisions:
- source_word: פֶּן
  choice: msije
  rationale: Huanzisha onyo kuhusu jambo lisilotakiwa; ‘msije’ ni Kiswahili cha kawaida kinachohifadhi maana ya tahadhari ya Kiebrania.
- source_word: תַּשְׁחִתוּן
  choice: mkajitenda kwa upotovu
  rationale: Hifili ya שׁחת hapa ina maana ya kutenda kwa namna potovu na yenye kuharibu katika kutotii agano. Kauli hii huhifadhi upande wa utendaji bila kuifanya iwe tu hali ya kupotoshwa.
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: na kujifanyia
  rationale: ‘Kujifanyia’ huwasilisha maana ya kitendo kinachofanywa na watu kwa ajili yao wenyewe.
- source_word: פֶּסֶל
  choice: sanamu ya kuchongwa
  rationale: Neno hili humaanisha hasa mfano uliotengenezwa kwa kuchongwa; tafsiri hii ni sahihi na inaeleweka kwa urahisi.
- source_word: תְּמוּנַת
  choice: yenye umbo la
  rationale: Nomino hii ya muundo huonyesha sura au umbo; ‘yenye umbo la’ ni ya asili katika Kiswahili na inaunganisha vizuri kirai kinachofuata.
- source_word: כָּל סָמֶל
  choice: kitu chochote
  rationale: סמל humaanisha sura, mfano, au sanamu. Katika mfuatano huu, ‘kitu chochote’ huhifadhi upana wa kirai na kuepuka kuingiza mapema tafsiri finyu ya ‘sanamu ya kuabudiwa’; dokezo linaonyesha mbadala ulio karibu zaidi na neno kwa neno.
- source_word: תַּבְנִית
  choice: mfano wa
  rationale: Huonyesha kielelezo, muundo, au mfanano. ‘Mfano wa’ hutofautisha neno hili na תְּמוּנַת lililotafsiriwa ‘umbo la’.
- source_word: זָכָר אֹו נְקֵבָה
  choice: mwanamume au mwanamke
  rationale: Katika muktadha wa maumbo yanayoonyeshwa, Kiswahili hiki ni cha kawaida na wazi; maneno ya Kiebrania yenyewe yanataja jinsia ya kiume au ya kike.
theological_decisions:
- issue: Istilahi zinazohusu sanamu na ibada ya sanamu
  choice: Kutafsiri פֶּסֶל kuwa ‘sanamu ya kuchongwa’ na kutafsiri סמל kwa upana kama ‘kitu’ ndani ya kirai ‘umbo la kitu chochote’
  alternative: Kutumia ‘sanamu’ au ‘mfano’ kwa סמל pia
  rationale: Kiebrania kinakusanya istilahi kadhaa zinazopishana kuhusu maumbo yaliyotengenezwa. Tafsiri hii huhifadhi hali halisi ya kitu kilichochongwa katika פֶּסֶל, huku isibane סמל kuwa kitu cha ibada pekee; dokezo huhifadhi uwezekano wa tafsiri iliyo karibu zaidi na muundo wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Msije mkajitenda kwa upotovu’ ni onyo la moja kwa moja; ‘sanamu ya kuchongwa’ ni wazi kwa msomaji wa kawaida. Alama ya mwisho ya mstari mrefu imehifadhiwa kwa sababu sentensi inaendelea katika aya zinazofuata.
