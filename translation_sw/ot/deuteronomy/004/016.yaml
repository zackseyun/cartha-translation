  verdict: revise
  source_fidelity: The draft accurately conveys the warning, the making of an image for oneself, and the male/female categories. However, “mkajitenda kwa upotovu” is not idiomatic Swahili for the active moral sense of תַּשְׁחִתוּן, and “kitu chochote” is substantially broader and less concrete than סָמֶל (“figure/image/representation”).
  naturalness: “Msije mkafanya uovu” is clear, current Standard East African Swahili and carries the warning’s moral force. “Kielelezo chochote” naturally renders a depicted figure without prematurely restricting it to an object of worship.
  terminology: “Sanamu ya kuchongwa” appropriately renders פֶּסֶל. “Kielelezo” for סָמֶל and “mfano” for תַּבְנִית preserve the Hebrew’s accumulation of overlapping representation terms. “Kiume au wa kike” retains the source’s sex categories rather than narrowing them to adult persons.
  issues:
  - severity: medium
    issue: “mkajitenda kwa upotovu” is unnatural and unclear.
    rationale: Kiswahili does not normally use “kujiteda” in this construction to mean acting corruptly. It may be understood as treating oneself in a perverse way, rather than committing corrupt conduct.
  - severity: medium
    issue: “kitu chochote” weakens the sense of סָמֶל.
    rationale: The Hebrew denotes a figure, image, or representation. “Anything” removes the representational sense that is essential to the sequence of image terms in this prohibition.
  - severity: low
    issue: The footnote’s “umbo la mfano wowote” does not offer a notably closer alternative for the source sequence.
    rationale: A revised note can state the viable alternative for תַּשְׁחִתוּן while retaining clear, concrete renderings for the image terminology.
