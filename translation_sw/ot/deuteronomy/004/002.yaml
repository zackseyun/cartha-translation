  text: לֹ֣א תֹסִ֗פוּ עַל הַ/דָּבָר֙ אֲשֶׁ֤ר אָנֹכִי֙ מְצַוֶּ֣ה אֶתְ/כֶ֔ם וְ/לֹ֥א תִגְרְע֖וּ מִמֶּ֑/נּוּ לִ/שְׁמֹ֗ר אֶת מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֥ה אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/002.yaml
  text: You shall not add to the word that I am commanding you[a], nor shall you take away from it, so that you may keep the commandments of Yahweh your God that I am commanding you.
translation:
  language: sw
  text: Msiongeze chochote kwenye neno ninalowaamuru, wala msipunguze chochote kutoka katika neno hilo, ili mzishike amri za Yahwe[a], Mungu wenu, ambazo ninawaamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania YHWH, jina linalotafsiriwa kwa desturi “BWANA”; tahajia nyingine ni “Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: תֹסִפוּ עַל
  choice: msiongeze chochote kwenye
  rationale: Muundo wa Kiebrania unakataza kuongeza kitu kwenye yaliyomo katika agizo. Kauli hii ni ya kawaida katika Kiswahili na inadumisha maana ya kuongeza.
- source_word: הַדָּבָר
  choice: neno
  rationale: דבר hapa ni ujumbe au agizo linalotolewa kama kitu kimoja. “Neno” linahifadhi umoja wa Kiebrania bila kulifafanua zaidi ya maandishi.
- source_word: מְצַוֶּה
  choice: ninalowaamuru / ninawaamuru
  rationale: Hali ya kitenzi kishirikishi inaonyesha tendo la kuamuru linaloendelea katika hotuba hii. Wakati wa sasa wa Kiswahili unafaa kwa muktadha.
- source_word: תִגְרְעוּ מִמֶּנּוּ
  choice: msiondoe chochote katika hilo
  rationale: גרע מן humaanisha kupunguza au kuondoa kutoka katika kitu. Tafsiri hii ni ya asili na inalingana kwa wazi na katazo la kuongeza.
- source_word: לִשְׁמֹר
  choice: ili mzishike
  rationale: Kiambishi ל kwenye kitenzi-jina kinaonyesha kusudi au matokeo. “Ili” huonyesha uhusiano huo kwa uwazi, na “kushika” ni istilahi ya kawaida kwa kutii na kuzingatia amri.
- source_word: מִצְוֺת
  choice: amri
  rationale: Katika muktadha wa agano na sheria, “amri” ni tafsiri ya kawaida, yenye uzito unaofaa, na inaweza kueleza wingi bila kiambishi cha wingi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: “Yahwe” ni umbo la Kiswahili la jina la Mungu YHWH na linahifadhi jina binafsi badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Katika kauli ya agano inayomhusu YHWH, neno hili lina maana ya umoja. “Mungu wenu” huonyesha kwa usahihi nafsi inayorejelewa na wingi wa wanaoambiwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina YHWH. “Yahwe” hulihifadhi kama jina la agano, huku tanbihi ikitaja desturi ya kulitafsiri kwa cheo “BWANA” bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unahifadhi umoja wa “neno,” ulinganifu wa kuongeza na kuondoa, na uhusiano wa kusudi unaoonyeshwa na לִשְׁמֹר.
