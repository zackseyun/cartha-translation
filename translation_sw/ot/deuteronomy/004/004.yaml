  yaml_path: translation/ot/deuteronomy/004/004.yaml
  text: But you who hold fast to Yahweh your God are all alive today[a].
translation:
  language: sw
  text: Lakini ninyi mnaoshikamana na Yahweh Mungu wenu, nyote mko hai leo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania pia kinaweza kutafsiriwa “mnaoambatana na” au “mnaong’ang’ania”; usemi huu unaonyesha kushikamana kwa karibu na Yahweh katika uaminifu wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Lakini ninyi
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha utofautishaji na wale walioangamia kwa sababu ya Baal-peori katika mstari uliotangulia.
- source_word: הַ/דְּבֵקִים
  choice: mnaoshikamana
  rationale: Kitenzi דבק kinaeleza kuambatana kwa karibu na kudumu katika uaminifu; umbo la wakati unaoendelea linaakisi kirai cha Kiebrania chenye hali ya kushikamana.
- source_word: בַּ/יהוָה
  choice: na Yahweh
  rationale: Kihusishi kinaonyesha kushikamana na Mungu wa agano, na jina la Mungu יהוה limetoholewa kuwa “Yahweh.”
- source_word: אֱלֹהֵי/כֶם
  choice: Mungu wenu
  rationale: Muundo huu unamtambulisha Yahweh wazi kuwa Mungu wa Waisraeli wanaosemeshwa.
- source_word: חַיִּים
  choice: mko hai
  rationale: Ni kivumishi cha kiarifu kinachoeleza hali yao ya sasa; “mko hai” ni Kiswahili cha kawaida na wazi.
- source_word: כֻּלְּ/כֶם
  choice: nyote
  rationale: Neno hili linasisitiza kwamba wote katika kundi linalosemeshwa walikuwa hai.
- source_word: הַ/יּוֹם
  choice: leo
  rationale: Linahifadhi maana ya wakati wa sasa wa usemi kwa lugha ya kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יהוה; “Yahweh” hulihifadhi kama jina binafsi bila kulibadili kuwa cheo.
- issue: Maana ya kushikamana na Yahweh
  choice: mnaoshikamana na Yahweh
  alternative: mnaoambatana na Yahweh; mnaong’ang’ania Yahweh
  rationale: “Kushikamana” huhifadhi wazo la ukaribu na uaminifu wa agano bila kulifafanua kupita kiasi kuwa tendo la kimwili au fundisho maalumu la kidhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Lakini ninyi” huweka wazi utofautishaji wa muktadha, huku “mnaoshikamana” ikiwa ya kawaida na inayoeleweka bila kupoteza uzito wa lugha ya agano.
