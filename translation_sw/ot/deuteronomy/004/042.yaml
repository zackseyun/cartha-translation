base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/042.yaml
  text: so that a manslayer who kills his neighbor unintentionally[a], without knowledge, and was not hating him previously[b], may flee there to one of these cities and live.
translation:
  language: sw
  text: ili muuaji aliyemuua mwenzake bila kujua[a], naye hakuwa akimchukia hapo awali[b], aweze kukimbilia huko, katika mojawapo ya miji hiyo, na kuishi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “bila kujua”; katika muktadha huu wa kisheria, maana yake ni kwamba alitenda bila kukusudia.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “tangu jana na juzi,” nahau inayomaanisha “hapo awali” au “zamani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָנֻס שָׁמָּה
  choice: aweze kukimbilia huko
  rationale: Kiambishi ל pamoja na kitenzi-jina kinaonyesha kusudi katika muktadha; muundo huu wa Kiswahili unaunganisha kusudi hilo na kutengwa kwa miji katika mstari uliotangulia.
- source_word: רוֹצֵחַ
  choice: muuaji
  rationale: Katika sheria ya miji ya makimbilio, neno hili linamtaja aliyesababisha kifo bila kuamua mapema kama ana hatia ya uuaji wa kukusudia; kwa hiyo “muuaji” ni pana kuliko “mwuaji wa kukusudia.”
- source_word: אֲשֶׁר יִרְצַח אֶת רֵעֵהוּ
  choice: aliyemuua mwenzake
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja; “mwenzake” humaanisha mtu mwingine wa jamii bila kudokeza lazima ukaribu wa makazi.
- source_word: בִּבְלִי דַעַת
  choice: bila kukusudia
  rationale: Kihalisi ni “bila kujua/maarifa”; katika muktadha huu wa kisheria inaeleza mauaji yasiyofanywa kwa ufahamu au nia. Tanbihi inadumisha umbo halisi la usemi.
- source_word: וְהוּא לֹא שֹׂנֵא לוֹ
  choice: naye hakuwa akimchukia
  rationale: Muundo wa kitenzi unaonyesha hali au mwelekeo unaoendelea, ambao “hakuwa akimchukia” huuhifadhi kwa Kiswahili cha kawaida.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: hapo awali
  rationale: Ni nahau inayomaanisha wakati uliotangulia; “hapo awali” ni ya asili na tanbihi inaonyesha picha halisi ya Kiebrania.
- source_word: אֶל אַחַת מִן הֶעָרִים הָאֵל
  choice: katika mojawapo ya miji hiyo
  rationale: “Mojawapo ya miji hiyo” hurejelea wazi miji iliyotajwa na kutengwa katika mstari uliotangulia.
- source_word: וָחָי
  choice: na kuishi
  rationale: Huhifadhi uratibu wa sentensi ya Kiebrania na kueleza matokeo ya kufanikiwa kukimbilia mji wa makimbilio.
theological_decisions:
- issue: Hadhi ya kisheria ya רוֹצֵחַ
  choice: muuaji
  alternative: mwuaji wa kukusudia
  rationale: Mstari wenyewe unafafanua kifo kuwa kisichokusudiwa na kutokuwapo kwa chuki ya awali; neno lenye maana ya mauaji ya kukusudia lingeingiza hukumu ambayo muktadha huu haukubali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inaendeleza kusudi la mstari uliotangulia. “Muuaji” limetumiwa kwa maana pana ya aliyesababisha kifo, huku vifungu vinavyofuata vikiondoa dhana ya nia ya kuua.
