source:
  edition: WLC
  text: הַעִידֹתִי֩ בָ/כֶ֨ם הַ/יּ֜וֹם אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֗רֶץ כִּֽי אָבֹ֣ד תֹּאבֵדוּ/ן֮ מַהֵר֒ מֵ/עַ֣ל הָ/אָ֔רֶץ אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ לֹֽא תַאֲרִיכֻ֤/ן יָמִים֙ עָלֶ֔י/הָ כִּ֥י הִשָּׁמֵ֖ד תִּשָּׁמֵדֽוּ/ן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/026.yaml
  text: I call heaven and earth to witness against you today that you will surely perish quickly from the land that you are crossing the Jordan to possess[a]. You will not prolong your days on it[c][b], for you will surely be destroyed.
translation:
  language: sw
  text: Nazifanya mbingu na dunia kuwa mashahidi dhidi yenu leo kwamba hakika mtaangamia upesi kutoka katika nchi mnayovuka Yordani kuingia katika nchi hiyo ili kuimiliki.[a] Hamtaishi humo kwa muda mrefu,[b] kwa maana hakika mtaangamizwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnayovuka Yordani kwenda kuimiliki.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “Hamtaongeza siku zenu juu yake.”
    reason: literal_rendering
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  choice: Ninaziita ... zishuhudie dhidi yenu
  rationale: Hifili ya עוּד ina maana ya kisheria ya kuwaita au kuwaweka mashahidi, na בָכֶם hapa ina nguvu ya ‘dhidi yenu.’ Muundo huu ni wa kawaida na unaeleweka katika Kiswahili huku ukihifadhi picha ya kesi ya agano.
- source_word: הַשָּׁמַיִם וְהָאָרֶץ
  choice: mbingu na dunia
  rationale: Huu ndio msemo wa kawaida wa Kiswahili kwa jumla ya uumbaji unaoitwa kuwa shahidi; ‘mbingu’ pia huhifadhi umbo la Kiebrania lililo la wingi.
- source_word: אָבֹד תֹּאבֵדוּן
  choice: hakika mtaangamia
  rationale: Kitenzi-jina cha kusisitiza pamoja na kitenzi kilichonyambuliwa huonyesha uhakika wenye mkazo; ‘hakika’ huwasilisha msisitizo huo kwa lugha ya kawaida.
- source_word: מַהֵר מֵעַל הָאָרֶץ
  choice: upesi kutoka katika nchi
  rationale: מַהֵר ni ‘upesi,’ na מֵעַל הָאָרֶץ huonyesha kuondolewa kutoka katika nchi, si kufa tu bila uhusiano na nchi.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן שָׁמָּה לְרִשְׁתָּהּ
  choice: mnayovuka Yordani kwenda kuimiliki
  rationale: Muundo huu unaonyesha nchi kuwa mahali wanapokwenda kwa kuvuka Yordani. ‘Kuimiliki’ huwasilisha ירשׁ katika muktadha wa nchi ya agano bila kuongeza dhana isiyo katika mstari.
- source_word: לֹא תַאֲרִיכֻן יָמִים עָלֶיהָ
  choice: Hamtaishi humo kwa muda mrefu
  rationale: Neno kwa neno ni ‘hamtaongeza siku juu yake,’ lakini nahau ya Kiswahili ‘hamtaishi humo kwa muda mrefu’ huwasilisha maana yake wazi na kwa kawaida.
- source_word: הִשָּׁמֵד תִּשָּׁמֵדוּן
  choice: hakika mtaangamizwa
  rationale: Kitenzi-jina pamoja na kitenzi cha hali ya kutendwa hutoa msisitizo mkali. ‘Hakika mtaangamizwa’ huhifadhi uhakika na hali ya kutendwa bila kuzidisha hadi ‘kutokomezwa kabisa.’
theological_decisions:
- issue: Mbingu na dunia kama mashahidi wa agano
  choice: Kutafsiri kama mwito wa kisheria kwa mbingu na dunia kushuhudia dhidi ya Israeli
  alternative: Kutafsiri kwa upana kama ‘ninawaonya leo kwa mbingu na dunia’
  rationale: Lugha ya chanzo ina mfumo wa ushahidi wa agano. Tafsiri inadumisha nguvu hiyo ya kisheria bila kuongeza fundisho la dhehebu.
- issue: Uhusiano kati ya kuangamia na kuondolewa katika nchi
  choice: Kuhifadhi kauli ya kuangamia ‘kutoka katika nchi’ bila kuifafanua zaidi
  alternative: Kuitafsiri moja kwa moja kama kufukuzwa uhamishoni au kuangamizwa kabisa
  rationale: Mstari unatishia kuangamia kwao kutoka juu ya nchi na baadaye kuangamizwa, lakini hauainishi hapa kwa ukamilifu namna au kiwango cha hukumu; utata huo unapaswa kubaki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Ninaziita ... zishuhudie’ huhifadhi lugha ya kisheria; ‘humo kwa muda mrefu’ ni ya asili zaidi kuliko kufuata nahau ya Kiebrania neno kwa neno. Alama zote za tanbihi zimewekwa baada ya vifungu vinavyohusika.
