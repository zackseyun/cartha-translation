lexical_decisions:
- source_word: וְזֹאת
  choice: Na hii ndiyo
  rationale: Kiunganishi pamoja na kiwakilishi kionyeshi kinaunganisha mstari huu na yaliyotangulia huku kikitambulisha sehemu mpya; “Na hii ndiyo” ni ya kawaida na huhifadhi msisitizo wa utambulisho.
- source_word: הַתּוֹרָה
  choice: sheria
  rationale: Ingawa תּוֹרָה linaweza kumaanisha “mafundisho” au “maagizo,” hapa ni kichwa cha sheria na maagizo ya agano ambayo Musa anawasilisha; “sheria” ni fasiri ya kawaida na inayoeleweka katika muktadha huu.
- source_word: אֲשֶׁר
  choice: ambayo
  rationale: Kiwakilishi hiki cha uhusiano kinaunganisha “sheria” na tendo la Musa kwa Kiswahili cha kawaida.
- source_word: שָׂם ... לִפְנֵי
  choice: aliweka mbele ya
  rationale: Muundo huu huhifadhi maana ya kuweka au kuwasilisha jambo mbele ya hadhira, bila kuongeza ufafanuzi usiomo katika Kiebrania.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: “Wana wa Israeli” linafuata kwa karibu umbo la Kiebrania la jina la taifa na linaeleweka katika Kiswahili, huku footnote ikionyesha fasiri mbadala za kimuktadha.
theological_decisions:
- issue: Jina la kitaifa lenye umbo la kiume בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli; watoto wa Israeli
  rationale: Kirai hiki ni jina la kawaida la taifa la agano. “Wana wa Israeli” huhifadhi kwa karibu umbo la chanzo bila kudai kwamba wanaume pekee ndio wanaokusudiwa; fasiri mbadala za kimuktadha zimetajwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa sasa. Sentensi imehifadhi kazi ya mstari kama utangulizi wa sehemu inayofuata; alama ya nukta mbili inaonyesha kwamba maelezo yanaendelea.
