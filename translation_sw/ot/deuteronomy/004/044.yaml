  text: And this is the law that Moses set before the sons of Israel:[a]
translation:
  language: sw
  text: Na hii ndiyo sheria ambayo Musa aliweka mbele ya wana wa Israeli:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli,” “watu wa Israeli,” au kwa tafsiri ya kimapokeo, “watoto wa Israeli.”
