  text: כִּ֣י אֵ֤ל רַחוּם֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֣א יַשְׁחִיתֶ֑/ךָ וְ/לֹ֤א יִשְׁכַּח֙ אֶת בְּרִ֣ית אֲבֹתֶ֔י/ךָ אֲשֶׁ֥ר נִשְׁבַּ֖ע לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/031.yaml
  text: For Yahweh your God is a compassionate God[c][b][a]; he will not abandon you or destroy you or forget the covenant of your fathers that he swore to them.
translation:
  language: sw
  text: Kwa maana Yahwe, Mungu wako, ni Mungu mwenye huruma[a]. Hatakutelekeza[b] wala kukuangamiza, wala hatalisahau agano la baba zako[c] alilowaapia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu mwenye rehema.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hatakuacha.”
    reason: lexical_alternative
  - marker: c
    text: Au, “agano la mababu zako.” Kiebrania kinasema “baba zako,” likiwarejelea mababu wa agano wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kishazi hiki kinatoa sababu ya himizo lililotangulia; “kwa maana” linaendeleza uhusiano huo wazi na kwa Kiswahili cha kawaida.
- source_word: אֵל רַחוּם
  choice: Mungu mwenye huruma
  rationale: רַחוּם huonyesha huruma au rehema. “Mwenye huruma” ni usemi wa sasa, wa kawaida na wenye heshima unaoonyesha jinsi Mungu anavyowahurumia watu wake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo; “Yahwe” ni umbo linalofaa tahajia ya Kiswahili.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Inahifadhi nafsi ya pili umoja na uhusiano wa agano katika hotuba inayoelekezwa kwa Israeli.
- source_word: לֹא יַרְפְּךָ
  choice: Hatakutelekeza
  rationale: Hiphili ya רפה hapa ina maana ya kuacha, kulegeza mshiko au kutomsaidia mtu. “Hatakutelekeza” huwasilisha kwa uwazi uhakikisho kwamba Mungu hatawaacha watu wake.
- source_word: וְלֹא יַשְׁחִיתֶךָ
  choice: wala kukuangamiza
  rationale: Hiphili ya שׁחת katika muktadha huu ina maana ya kuharibu au kuangamiza; “kuangamiza” linafaa onyo la agano na ni wazi kwa msomaji wa sasa.
- source_word: וְלֹא יִשְׁכַּח אֶת בְּרִית
  choice: wala hatalisahau agano
  rationale: Tafsiri hii inadumisha sitiari muhimu ya chanzo kwamba Mungu halisahau agano lake, bila kuilegeza kuwa ‘kulipuuza.’
- source_word: אֲבֹתֶיךָ
  choice: baba zako
  rationale: Neno la Kiebrania ni la kiume na hapa linawarejelea mababa wa Israeli waliohusishwa na ahadi za agano. “Baba zako” huhifadhi umahususi huo wa kihistoria.
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: alilowaapia
  rationale: Kitenzi נשבע kinahusu kuapa kiapo rasmi. Umbo hili linaonyesha kwamba Mungu aliwaapia baba hao agano hilo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku likifuata tahajia ya Kiswahili.
- issue: Rejeo la agano katika אֲבֹתֶיךָ
  choice: baba zako
  alternative: mababu zako; wazee wako wa kale
  rationale: “Baba zako” huhifadhi jinsia ya neno la chanzo na rejeo lake maalumu kwa mababa wa agano wa Israeli; tanbihi inaeleza maana pana inayowezekana bila kuifuta sifa hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa baada ya maelezo kuhusu tabia ya Mungu ili isomeke kwa urahisi, huku miundo ya urudiaji “wala ... wala ...” ikihifadhi mkazo wa Kiebrania. Nafsi ya pili umoja imedumishwa.
