base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/048.yaml
  text: from Aroer[a], which is on the bank of the Arnon Valley, as far as Mount Sion (that is, Hermon)[b],
translation:
  language: sw
  text: kutoka Aroeri, ulioko ukingoni mwa Bonde la Arnoni[a], mpaka Mlima Sioni (yaani, Hermoni)[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Korongo la Arnoni” au “bonde la mto Arnoni.” Neno la Kiebrania נַחַל mara nyingi humaanisha bonde, korongo, au njia ya maji, si lazima mto wenye maji mwaka mzima.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “Sioni.” Linganisha Kumbukumbu la Torati 3:9, ambapo Wasidoni waliuita mlima huu Sirioni. Hapa maandishi yanautambulisha waziwazi Sioni kuwa Hermoni.
    reason: cross_reference
lexical_decisions:
- source_word: מֵ/עֲרֹעֵר
  choice: kutoka Aroeri
  rationale: Kihusishi מִן kinaonyesha mahali ambapo mpaka unaanzia. Jina la mahali עֲרֹעֵר limetoholewa kama “Aroeri” kwa tahajia ya kawaida ya Kiswahili.
- source_word: אֲשֶׁר
  choice: ulioko
  rationale: Kinaanzisha kishazi rejeshi kinachoeleza Aroeri; “ulioko” ni usemi wa asili wa Kiswahili kwa mahali panapotajwa.
- source_word: עַל שְׂפַת
  choice: ukingoni mwa
  rationale: שָׂפָה kimsingi ni ‘mdomo’ au ‘ukingo’; katika muktadha wa kijiografia, “ukingoni mwa” hutoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: נַחַל אַרְנֹן
  choice: Bonde la Arnoni
  rationale: נַחַל inaweza kumaanisha bonde, korongo, au njia ya maji ambayo si lazima iwe na maji mwaka mzima. “Bonde la Arnoni” ni wazi na halilazimishi maana ya mto wa kudumu.
- source_word: וְ/עַד
  choice: mpaka
  rationale: Neno hili linaonyesha mwisho wa eneo linalofafanuliwa; “mpaka” ni kifupi na cha kawaida katika Kiswahili.
- source_word: הַר
  choice: Mlima
  rationale: Katika muundo huu unaofuatwa na jina maalumu, “Mlima” ndiyo tafsiri ya kawaida na ya moja kwa moja.
- source_word: שִׂיאֹן
  choice: Sioni
  rationale: Jina hili limetoholewa kutokana na umbo la Kiebrania שִׂיאֹן. Tanbihi inaeleza utambulisho wake na Hermoni ili lisichanganywe kwa urahisi na jina jingine linalofanana.
- source_word: הוּא
  choice: yaani
  rationale: Kiwakilishi hiki kinatumika hapa kufafanua kwamba Mlima Sioni unaotajwa ni Hermoni; “yaani” huwasilisha ufafanuzi huo kwa kawaida.
- source_word: חֶרְמוֹן
  choice: Hermoni
  rationale: Jina la mlima limetoholewa kwa umbo linalofaa mfumo wa sauti na tahajia ya Kiswahili.
