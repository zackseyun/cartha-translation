  text: וְ/אֹתִ֞/י צִוָּ֤ה יְהוָה֙ בָּ/עֵ֣ת הַ/הִ֔וא לְ/לַמֵּ֣ד אֶתְ/כֶ֔ם חֻקִּ֖ים וּ/מִשְׁפָּטִ֑ים לַ/עֲשֹׂתְ/כֶ֣ם אֹתָ֔/ם בָּ/אָ֕רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/014.yaml
  text: And at that time Yahweh commanded me to teach you statutes and judgments[b][a], so that you might do them in the land that you are crossing over to possess.
translation:
  language: sw
  text: Na wakati huo Yahweh aliniamuru niwafundishe masharti na hukumu[a], ili mzitende katika nchi mnayovuka kwenda kuimiliki.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “amri na sheria” badala ya “masharti na hukumu.”
    reason: lexical_alternative
  - marker: b
    text: Au “kuirithi” badala ya “kuimiliki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Limetoholewa kama jina binafsi la Mungu lililofunuliwa kwa Israeli, badala ya kubadilishwa na cheo.
- source_word: צִוָּה
  choice: aliamuru
  rationale: Kitenzi hiki kinaonyesha agizo lenye mamlaka, hasa katika muktadha wa agano na sheria.
- source_word: לְלַמֵּד
  choice: niwafundishe
  rationale: Muundo huu unaeleza utume wa Musa wa kuwapa Waisraeli mafundisho; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: חֻקִּים
  choice: masharti
  rationale: Neno hili linafaa kwa maagizo yaliyowekwa na linadumisha tofauti yake na מִשְׁפָּטִים bila kutumia lugha nzito isiyo ya kawaida.
- source_word: מִשְׁפָּטִים
  choice: hukumu
  rationale: Huhifadhi maana ya kisheria ya neno la Kiebrania na tofauti yake na חֻקִּים.
- source_word: לַעֲשֹׂתְכֶם אֹתָם
  choice: ili mzitende
  rationale: Huwakilisha kusudi la kufundishwa na nguvu halisi ya עשה katika muktadha wa sheria.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: “Nchi” ni neno la kawaida la kijiografia na la agano katika muktadha huu.
- source_word: עֹבְרִים שָׁמָּה
  choice: mnayovuka kwenda
  rationale: Hueleza mwendo wa karibu wa kuvuka kuelekea nchi hiyo, huku ikihifadhi dhamira ya kuvuka iliyo muhimu katika Kumbukumbu la Torati.
- source_word: לְרִשְׁתָּהּ
  choice: kuimiliki
  rationale: Kitenzi kinaweza kumaanisha kumiliki au kurithi; “kuimiliki” ni wazi na kinafaa kwa kuingia na kuichukua nchi.
- source_word: וְאֹתִי
  choice: aliniamuru
  rationale: Kiwakilishi cha yambwa kilichotangulizwa kina msisitizo mdogo; Kiswahili cha kawaida kinaweza kuuwasilisha kwa kiambishi “-ni-” bila kufanya sentensi kuwa nzito.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: “Yahweh” huhifadhi jina binafsi la Mungu katika umbo la matamshi linalokubalika kitaaluma, badala ya kulibadilisha kuwa cheo.
- issue: Maana ya לְרִשְׁתָּהּ
  choice: kuimiliki
  alternative: kuirithi
  rationale: Kiebrania kinaruhusu maana zote mbili. Matini kuu inatumia “kuimiliki” kwa sababu ya muktadha wa kuvuka na kuingia nchini, huku “kuirithi” ikihifadhiwa katika tanbihi ili kutofuta maana ya kupokea urithi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa moja kwa moja, na istilahi za kisheria zimehifadhiwa bila kufanya lugha kuwa ya kizamani.
