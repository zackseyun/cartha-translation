reference: Deuteronomy 4:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּֽי תוֹלִ֤יד בָּנִים֙ וּ/בְנֵ֣י בָנִ֔ים וְ/נוֹשַׁנְתֶּ֖ם בָּ/אָ֑רֶץ וְ/הִשְׁחַתֶּ֗ם וַ/עֲשִׂ֤יתֶם פֶּ֨סֶל֙ תְּמ֣וּנַת כֹּ֔ל וַ/עֲשִׂיתֶ֥ם הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֶ֖י/ךָ לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/025.yaml
  text: When you father children and grandchildren[a], and you have grown old in the land, and you act corruptly and make a carved image in the form of anything, and do what is evil in the eyes of Yahweh your God[c][b], provoking him to anger—
translation:
  language: sw
  text: Utakapozaa watoto na wajukuu[a], nanyi mtakapokuwa mmezeeka katika nchi[b], mkafanya upotovu na kujitengenezea sanamu iliyochongwa yenye umbo la kitu chochote[c], na kufanya yaliyo maovu machoni pa Yahweh Mungu wako, na hivyo kumkasirisha—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wana na wana wa wana.” Kiebrania kinatumia majina ya uzao wa kiume, lakini hapa yanaelekea kuwakilisha watoto wa vizazi vinavyofuatana kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Au, “mtakapokuwa mmekaa muda mrefu katika nchi.” Kitenzi cha Kiebrania kinaweza kusisitiza kuzeeka au kukaa mahali kwa muda mrefu.
    reason: lexical_alternative
  - marker: c
    text: Au, “mfano wa kitu chochote” au “umbo lolote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Utakapo-
  rationale: Katika onyo hili neno hilo linaanzisha hali ya wakati inayotarajiwa, ambayo matokeo yake yanafuata katika mstari unaofuata; muundo wa ‘utakapo-’ ni wa kawaida na wa wazi katika Kiswahili.
- source_word: תוֹלִיד
  choice: utakapozaa
  rationale: Kitenzi cha Kiebrania kiko katika umoja na kina maana ya kuzaa au kupata uzao. ‘Kuzaa’ ni lugha ya kawaida ya Kiswahili na haiongezi jinsia ya mzazi isiyosemwa wazi na kitenzi chenyewe.
- source_word: בָּנִים וּבְנֵי בָנִים
  choice: watoto na wajukuu
  rationale: Ingawa Kiebrania kinatumia majina ya kiume, katika onyo hili la vizazi maneno hayo yanawakilisha uzao wa vizazi viwili; ‘watoto na wajukuu’ huwasilisha maana hiyo kwa kawaida.
- source_word: וְנוֹשַׁנְתֶּם בָּאָרֶץ
  choice: mtakapokuwa mmezeeka katika nchi
  rationale: Kitenzi kinaweza kueleza kuzeeka au kukaa muda mrefu. Tafsiri hii inadumisha picha ya kuzeeka huku ikidokeza muda mrefu wa kukaa nchini.
- source_word: וְהִשְׁחַתֶּם
  choice: mkatenda kwa upotovu
  rationale: Katika muktadha huu kitenzi kinaeleza mwenendo wa uharibifu wa agano, hasa ibada ya sanamu. Usemi huu ni wa asili na haudai kwa lazima kuwa tendo ni la kujirejelea.
- source_word: פֶּסֶל
  choice: sanamu ya kuchonga
  rationale: Neno linamaanisha sanamu iliyotengenezwa kwa kuchongwa. Tafsiri hii ni halisi zaidi kuliko neno pana ‘sanamu ya kuabudiwa’ na inaepuka lugha ya kizamani.
- source_word: תְּמוּנַת כֹּל
  choice: yenye umbo la kitu chochote
  rationale: Kirai hiki kinaeleza sanamu inayowakilisha umbo lolote; ‘umbo la kitu chochote’ linahifadhi upana wa katazo.
- source_word: הָרַע בְּעֵינֵי
  choice: yaliyo maovu machoni pa
  rationale: Huu ni usemi wa Kiebrania wa kutathmini jambo. ‘Machoni pa’ huhifadhi sitiari huku ikiwa lugha inayoeleweka katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetafsiriwa kwa namna ya kawaida ya Kiswahili ‘Yahwe’ badala ya kubadilishwa na cheo.
- source_word: לְהַכְעִיסוֹ
  choice: na hivyo kumkasirisha
  rationale: Kitenzi-jina kinaonyesha kusudi au tokeo la tendo ovu. ‘Na hivyo kumkasirisha’ huunganisha kwa kawaida tendo hilo na hasira inayosababishwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu moja kwa moja. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Lugha ya kijinsia katika בָּנִים וּבְנֵי בָנִים
  choice: watoto na wajukuu
  alternative: wana na wana wa wana
  rationale: Katika onyo hili maneno ya kiume yanafanya kazi kwa ujumla kwa uzao wa vizazi vinavyofuata. Tafsiri ya jumla inaleta maana ya muktadha bila kudai kuwa wa kiume pekee ndio wanaokusudiwa.
- issue: Mabadiliko ya nafsi ya kisarufi
  choice: Utakapozaa ... nanyi mtakapokuwa ... Mungu wako
  alternative: Kusawazisha kifungu chote kuwa umoja au wingi
  rationale: Kiebrania hubadilika kutoka umoja kwenda wingi na kurudi kwenye kiwakilishi cha umoja. Tafsiri imehifadhi mvutano huo wa hotuba kwa Israeli kama jumuiya badala ya kuusawazisha kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi umeachwa wazi kwa kuendelea katika mstari unaofuata, kama ilivyo katika chanzo. Mabadiliko ya umoja na wingi yamehifadhiwa kwa makusudi kwa sababu yanapatikana katika Kiebrania.
