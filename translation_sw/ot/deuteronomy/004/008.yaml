  yaml_path: translation/ot/deuteronomy/004/008.yaml
  text: And what great nation is there that has statutes and judgments as righteous as all this law that I am setting before you today?[a]
translation:
  language: sw
  text: Tena, ni taifa gani kubwa lililo na amri na hukumu za haki kama sheria hii yote ninayoweka mbele yenu leo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “mafundisho” badala ya “sheria” (Kiebrania torah), ingawa hapa muktadha unahusu hasa mambo ya kisheria: “amri na hukumu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי
  choice: Tena, ni ... gani
  rationale: Huendeleza hoja ya mstari uliotangulia na kuwasilisha swali la balagha kwa Kiswahili cha kawaida.
- source_word: גּוֹי גָּדוֹל
  choice: taifa gani kubwa
  rationale: “Taifa” linafaa kwa kundi la watu linalolinganishwa na mataifa mengine; “kubwa” linahifadhi sifa ya Kiebrania.
- source_word: חֻקִּים
  choice: masharti
  rationale: Neno hili linaonyesha maagizo yaliyowekwa rasmi katika muktadha wa kisheria, huku likitofautishwa na hukumu.
- source_word: וּמִשְׁפָּטִים
  choice: na hukumu
  rationale: Linahifadhi maana ya maamuzi au kanuni za kisheria na tofauti yake na חֻקִּים.
- source_word: צַדִּיקִם
  choice: za haki
  rationale: Usemi huu wa asili na unaoeleweka unaonyesha kwamba masharti na hukumu hizo zinaafikiana na yaliyo sawa kimaadili na kisheria.
- source_word: כְּכֹל הַתּוֹרָה הַזֹּאת
  choice: kama sheria hii yote
  rationale: Muundo huu unahifadhi ulinganisho na jumla ya sheria inayowasilishwa; “sheria” linafaa zaidi katika muktadha huu wa masharti na hukumu.
- source_word: נֹתֵן לִפְנֵיכֶם
  choice: ninayoweka mbele yenu
  rationale: Ni Kiswahili cha kawaida kinachoakisi nahau ya Kiebrania ya kuwasilisha jambo mbele ya watu.
- source_word: הַיּוֹם
  choice: leo
  rationale: Linahifadhi msisitizo wa wakati kwa lugha ya sasa na ya kawaida.
theological_decisions:
- issue: Tafsiri ya תּוֹרָה
  choice: sheria
  alternative: mafundisho
  rationale: Ingawa תּוֹרָה linaweza kumaanisha “mafundisho,” hapa muktadha unataja wazi masharti na hukumu. “Sheria” ndiyo inayofaa zaidi katika mstari huu, huku maana pana zaidi ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Swali la balagha limehifadhiwa, na msamiati wa kisheria umetofautishwa bila kutumia lugha ya kizamani.
