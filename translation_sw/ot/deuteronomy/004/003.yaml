review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the emphatic eyewitness statement, Yahweh’s judgment, the distributive masculine singular ‘every man,’ and the shift from plural ‘yenu’ to singular ‘wako/mwako.’ However, ‘kwa habari ya Baal-peori’ means ‘concerning/regarding Baal-peor’ and weakens the source’s locative/event-setting preposition בְּ. ‘Huko Baal-peori’ more directly represents the event at Baal-peor without imposing a causal interpretation.
  naturalness: The Swahili is generally clear and suitably formal. ‘Mmeona kwa macho yenu wenyewe’ is natural modern Standard East African Swahili. ‘Huko Baal-peori’ is more idiomatic and precise in this setting than ‘kwa habari ya Baal-peori.’
  terminology: ‘Yahwe,’ ‘Baal-peori,’ ‘Mungu wako,’ and ‘alimwangamiza’ are appropriate. The footnote should explicitly preserve both the alternative broad rendering and the Hebrew’s more literal ‘went after’ idiom.
  issues:
  - severity: medium
    issue: The rendering ‘kwa habari ya Baal-peori’ is imprecise for בְּבַעַל־פְּעוֹר.
    rationale: It normally denotes subject matter (‘regarding Baal-peor’), whereas the Hebrew situates Yahweh’s action at/in the Baal-peor incident. A locative/event-setting expression is preferable.
  - severity: low
    issue: The footnote does not give the stated alternative translation corresponding to the audit trail.
    rationale: The note explains the idiom but should also provide the natural alternative ‘kila mtu aliyemfuata Baal-peori,’ while retaining the literal wording.
  revised_text: Mmeona kwa macho yenu wenyewe yale aliyofanya Yahwe huko Baal-peori, kwa maana kila mwanamume aliyemfuata Baal-peori[a], Yahwe Mungu wako alimwangamiza kutoka miongoni mwako.
