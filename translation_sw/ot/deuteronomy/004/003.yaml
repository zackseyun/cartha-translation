base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/003.yaml
  text: Your own eyes have seen what Yahweh did at Baal-peor[a], for every man who went after Baal-peor, Yahweh your God destroyed from your midst.
translation:
  language: sw
  text: Mmeona kwa macho yenu wenyewe yale aliyofanya Yahwe huko Baal-peori, kwa maana kila mwanamume aliyemfuata Baal-peori[a], Yahwe Mungu wako alimwangamiza kutoka miongoni mwako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “kila mtu aliyemfuata Baal-peori.” Kiebrania kwa neno kwa neno: “kila mwanamume aliyekwenda nyuma ya Baal-peori.”'
    reason: Huhifadhi mbadala wa tafsiri na kueleza nahau ya Kiebrania ya ‘kwenda nyuma ya,’ ambayo katika muktadha huu humaanisha kumfuata kwa uaminifu wa kidini.
lexical_decisions:
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: Mmeona kwa macho yenu wenyewe
  rationale: Hii ni Kiswahili cha kawaida kinachohifadhi msisitizo wa ushuhuda wa moja kwa moja uliomo katika muundo wa Kiebrania, yaani ‘macho yenu ndiyo yaliyoona.’
- source_word: עָשָׂה
  choice: aliyofanya
  rationale: Kitenzi hiki hapa kinarejelea tendo la hukumu la kihistoria, si tendo la kuumba au kutengeneza.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetafsiriwa kwa kunukuu jina lenyewe badala ya kulibadili kuwa cheo.
- source_word: בְּבַעַל פְּעוֹר
  choice: kwa habari ya Baal-peori
  rationale: Kirai hiki cha Kiswahili kinaonyesha tukio au jambo lililohusiana na Baal-peori bila kulazimisha maana kuwa mahali tu au sababu tu.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi kinaanzisha maelezo yanayofafanua kile Yahwe alichofanya.
- source_word: כָּל הָאִישׁ
  choice: kila mwanamume
  rationale: Huhifadhi umoja wa kugawa mmoja mmoja na umbo la kiume lililo wazi katika Kiebrania.
- source_word: הָלַךְ אַחֲרֵי
  choice: aliyemfuata
  rationale: Nahau hii ina maana ya kumfuata kwa utii au uaminifu wa kidini; ‘aliyemfuata’ ni ya asili katika Kiswahili huku maana ya nahau ikihifadhiwa.
- source_word: הִשְׁמִידוֹ
  choice: alimwangamiza
  rationale: Umbo la kitenzi linaonyesha kuharibu kabisa na lina kiambishi cha yambwa cha umoja kinachorejelea kila mwanamume mmoja mmoja.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huhifadhi nafsi ya pili umoja na uhusiano wa agano unaotajwa baada ya jina Yahwe.
- source_word: מִקִּרְבֶּךָ
  choice: kutoka miongoni mwako
  rationale: Hueleza kuondolewa kutoka ndani ya jumuiya na huhifadhi nafsi ya pili umoja ya Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu, kwa hiyo limenukuliwa kama Yahwe badala ya kubadilishwa kuwa cheo.
- issue: Umbo la kiume la כָּל הָאִישׁ
  choice: kila mwanamume
  alternative: kila mtu
  rationale: Neno la Kiebrania ni la kiume katika umoja na limetumiwa kwa maana ya kugawa kila mmoja; tafsiri inahifadhi taarifa hiyo badala ya kuifanya isionyeshe jinsia.
- issue: Mabadiliko kutoka nafsi ya pili wingi kwenda umoja
  choice: macho yenu … Mungu wako … miongoni mwako
  alternative: kusawazisha viwakilishi vyote viwe vya wingi
  rationale: Kiebrania hubadilika kwa makusudi kutoka wingi katika ‘macho yenu’ kwenda umoja katika ‘Mungu wako’ na ‘miongoni mwako’; tafsiri imehifadhi mvutano huo wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Mmeona kwa macho yenu wenyewe’ ni ya kawaida zaidi kuliko kuiga moja kwa moja muundo wa Kiebrania. Tahajia ‘Baal-peori’ inasaidia matamshi ya Kiswahili, na mabadiliko yasiyo ya kawaida kutoka ‘yenu’ kwenda ‘wako/mwako’ yameachwa kwa sababu yapo katika chanzo.
