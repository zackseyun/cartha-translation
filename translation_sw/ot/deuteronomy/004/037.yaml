base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/037.yaml
  text: And because he loved your fathers and chose their offspring after them[a], he brought you out of Egypt by his presence[b], by his great power.
translation:
  language: sw
  text: Na kwa sababu aliwapenda baba zako, akachagua uzao wao baada yao[a], alikutoa kutoka Misri kwa uwepo wake mwenyewe[b], kwa nguvu zake kuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uzao wake baada yake.” Kiebrania kinatumia viambishi vya umoja, yaelekea kikiwachukulia “baba zako” kama kundi moja.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kwa uso wake” au “mbele yake”; hapa kirai hicho kinaeleza uwepo wa Mungu mwenyewe alipokutoa kutoka Misri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַחַת כִּי
  choice: Na kwa sababu
  rationale: Kirai hiki kinatoa sababu ya kauli iliyotangulia. “Na kwa sababu” ni Kiswahili cha kawaida kinachohifadhi uhusiano huo wa kisababu.
- source_word: אָהַב
  choice: aliwapenda
  rationale: Kitenzi hiki humaanisha kupenda moja kwa moja; kiambishi cha ngeli ya watu kinarejelea “baba zako.”
- source_word: אֲבֹתֶיךָ
  choice: baba zako
  rationale: Huhifadhi umbo la kiume la wingi na rejeleo la agano kwa mababu wa Israeli. “Mababu zako” lingewezekana, lakini “baba zako” linafuata chanzo kwa karibu.
- source_word: וַיִּבְחַר
  choice: akachagua
  rationale: “Kuchagua” ni neno la kawaida na wazi, bila kuingiza istilahi maalumu ya kiteolojia.
- source_word: בְּזַרְעוֹ אַחֲרָיו
  choice: uzao wao baada yao
  rationale: Neno זרע lina maana ya pamoja ya uzao. Ingawa viambishi vya Kiebrania ni vya umoja, vinarejelea “baba zako” kama kundi; wingi wa Kiswahili unaeleza maana ya muktadha kwa kawaida huku tanbihi ikihifadhi umbo halisi.
- source_word: וַיּוֹצִאֲךָ
  choice: alikutoa
  rationale: Hifili ya יצא ni kusababisha mtu atoke, kwa hiyo “alikutoa” inafaa kwa lugha ya kutoka Misri.
- source_word: בְּפָנָיו
  choice: kwa kuwapo kwake mwenyewe
  rationale: Kihalisi ni “kwa uso wake” au “mbele yake,” lakini hapa kirai kinaonyesha kuwapo kwa Mungu mwenyewe katika ukombozi. “Mwenyewe” huweka wazi msisitizo huo bila kudokeza wakala mwingine.
- source_word: בְּכֹחוֹ הַגָּדֹל
  choice: kwa nguvu zake kuu
  rationale: כח ni nguvu au uwezo; muundo huu ni wa njia iliyotumika na unaenda sambamba na kirai kilichotangulia.
- source_word: מִמִּצְרַיִם
  choice: Misri
  rationale: Pamoja na kitenzi “alikutoa,” jina “Misri” peke yake huleta kwa kawaida maana ya kutoka Misri; hakuna haja ya kuongeza “kutoka” mara ya pili.
theological_decisions:
- issue: Viambishi vya umoja katika “uzao wake baada yake” vinavyofuata “baba zako”
  choice: uzao wao baada yao
  alternative: uzao wake baada yake
  rationale: Kiebrania kina viambishi vya umoja, lakini “baba zako” linaweza kutazamwa kwa pamoja. Wingi ni wa kawaida katika Kiswahili na huepuka kutoa dhana kwamba baba mmoja tu ndiye anayelengwa; tanbihi inadumisha uwezekano wa tafsiri ya umoja.
- issue: Maana ya בְּפָנָיו
  choice: kwa kuwapo kwake mwenyewe
  alternative: mbele yake; kwa uso wake
  rationale: Tafsiri iliyochaguliwa inaonyesha kwamba Mungu mwenyewe alikuwapo na kutenda katika kuwatoa Israeli. Tanbihi inahifadhi picha halisi na uwezekano wa kisarufi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inafuata mtiririko wa Kiebrania bila kuwa ngumu; “uzao” huhifadhi maana ya pamoja ya זרע, na tanbihi zinaweka wazi tofauti za kimuundo na picha halisi.
