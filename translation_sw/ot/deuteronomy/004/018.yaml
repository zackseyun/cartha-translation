  yaml_path: translation/ot/deuteronomy/004/018.yaml
  text: the form of any creeping thing on the ground[b][a], the form of any fish that is in the waters under the earth.
translation:
  language: sw
  text: umbo[a] la kiumbe chochote kitambaacho ardhini, umbo la samaki yeyote aliye katika maji yaliyo chini ya ardhi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sura” au “mfano” badala ya “umbo” (Kiebrania תַּבְנִית).
    reason: lexical_alternative
  - marker: b
    text: “Chini ya ardhi” ni mwangwi wa usemi wa kawaida wa Biblia kuhusu maji yaliyo chini ya nchi kavu; linganisha maneno ya katazo la kutengeneza sanamu katika Kutoka 20:4.
    reason: cross_reference
lexical_decisions:
- source_word: תַּבְנִית
  choice: umbo
  rationale: Katika muktadha wa onyo dhidi ya kutengeneza sanamu, neno hili linamaanisha umbo linaloonekana au uwakilishi wenye umbo fulani. “Umbo” linahifadhi upana wa maana bila kulibana kuwa sanamu ya aina maalumu.
- source_word: כָּל
  choice: chochote / yeyote
  rationale: 'Neno lina nguvu ya kugawa: linakataza uwakilishi wa kiumbe au samaki wa aina yoyote. Upatanisho wa Kiswahili unahitaji “chochote” kwa kiumbe na “yeyote” kwa samaki.'
- source_word: רֹמֵשׂ
  choice: kiumbe ... kitambaacho
  rationale: Hurejelea kiumbe kinachosogea au kutambaa juu ya ardhi. “Kiumbe kitambaacho” ni wazi na cha kawaida kuliko tafsiri finyu inayoweza kumaanisha wadudu pekee.
- source_word: בָּאֲדָמָה
  choice: ardhini
  rationale: Hapa אֲדָמָה ni ardhi au uso wa nchi ambapo viumbe hutambaa. “Ardhini” ni fupi, ya asili, na sahihi kimuktadha.
- source_word: דָּגָה
  choice: samaki
  rationale: Nomino hii inaweza kutumiwa kwa maana ya jamii nzima ya samaki. Kiswahili “samaki” kinafaa kwa kiumbe mmoja au jamii kwa kutegemea muktadha.
- source_word: אֲשֶׁר בַּמַּיִם
  choice: aliye majini
  rationale: Kishazi rejeshi kimehifadhiwa. “Majini” ni usemi wa asili wa Kiswahili unaowakilisha maji kama mazingira ambamo samaki yumo.
- source_word: מִתַּחַת לָאָרֶץ
  choice: chini ya ardhi
  rationale: Tafsiri hii inahifadhi usemi wa kibiblia kuhusu maji yaliyo chini ya ardhi na mwangwi wake katika katazo la kutengeneza sanamu, bila kuongeza maelezo ya kimtazamo.
theological_decisions:
- issue: Lugha ya uwakilishi katika muktadha wa ibada ya sanamu
  choice: umbo la...
  alternative: mfano wa... / sanamu ya...
  rationale: “Umbo” linawakilisha תַּבְנִית bila kulifanya neno lenyewe limaanishe sanamu ya kuabudiwa. Nguvu ya katazo la ibada ya sanamu inatokana na muktadha, huku tafsiri ikiepuka kuingiza aina maalumu ya kitu kilichotengenezwa.
- issue: Usemi wa maji “chini ya ardhi”
  choice: chini ya ardhi
  alternative: chini ya nchi / yaliyo chini kuliko nchi kavu
  rationale: Usemi halisi umehifadhiwa ili kutunza mwangwi wa lugha ya katazo katika Kutoka 20:4 na kutoufafanua upya kwa mfumo wa kisasa wa kijiografia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa marudio wa Kiebrania (“umbo la ... umbo la ...”) umehifadhiwa; hakuna kiunganishi kilichoongezwa ambacho kingeficha muundo wa orodha.
