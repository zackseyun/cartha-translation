  variant: Standard East African Swahili
source:
  edition: WLC
  text: בַּ/צַּ֣ר לְ/ךָ֔ וּ/מְצָא֕וּ/ךָ כֹּ֖ל הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה בְּ/אַחֲרִית֙ הַ/יָּמִ֔ים וְ/שַׁבְתָּ֙ עַד יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/שָׁמַעְתָּ֖ בְּ/קֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/030.yaml
  text: When you are in distress[a], and all these things come upon you[b], in the latter days you will return to Yahweh your God and listen to his voice.
translation:
  language: sw
  text: Utakapokuwa katika dhiki, na mambo haya yote yatakapokupata, katika siku za mwisho[a], utamrudia Yahweh Mungu wako na kuisikiliza sauti yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika siku zijazo.” Kirai cha Kiebrania “katika siku za mwisho” kinaweza kurejelea kwa upana wakati ujao, na si lazima kihusishwe tu na mpangilio fulani wa matukio ya mwisho.
    reason: alternative_reading
  - marker: b
    text: “Kuisikiliza sauti yake” pia inaweza kutafsiriwa “kuitii sauti yake,” kwa kuwa usemi wa Kiebrania mara nyingi unamaanisha kusikia kwa makini na kutenda kwa utii.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לְךָ
  choice: utakapokuwa katika dhiki
  rationale: Kirai hiki huonyesha hali ya taabu au shida. Muundo wa ‘utakapokuwa’ unaonyesha kwa Kiswahili thamani ya wakati iliyomo katika kishazi cha Kiebrania kisicho na kitenzi.
- source_word: וּמְצָאוּךָ
  choice: yatakapokupata
  rationale: Ingawa מָצָא kimsingi ni ‘kupata’ au ‘kukuta,’ hapa mambo ya hukumu ndiyo yanayomfikia mhusika; ‘yatakapokupata’ ni ya kawaida na inabaki karibu na taswira ya Kiebrania.
- source_word: כֹּל הַדְּבָרִים הָאֵלֶּה
  choice: mambo haya yote
  rationale: דְּבָרִים hapa inarejelea matukio au hukumu zilizotajwa katika muktadha, si maneno pekee.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: katika siku za mwisho
  rationale: Tafsiri hii inadumisha msemo na uzito wa Kiebrania bila kuufunga kwenye mpangilio fulani wa matukio ya mwisho. Tanbihi inaonyesha maana pana inayowezekana ya wakati ujao.
- source_word: וְשַׁבְתָּ עַד
  choice: utamrudia
  rationale: שׁוּב pamoja na עַד inaonyesha kumgeukia au kumrudia mtu. ‘Utamrudia’ inadumisha maana ya uhusiano wa agano bila kuongeza moja kwa moja neno la kitheolojia ‘kutubu.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahweh’ badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Hii ni tafsiri ya moja kwa moja ya muundo wenye kiambishi cha nafsi ya pili umoja, ikidumisha lugha ya uhusiano wa agano.
- source_word: וְשָׁמַעְתָּ בְּקֹלוֹ
  choice: na kuisikiliza sauti yake
  rationale: Tafsiri hii inadumisha taswira ya kusikia sauti; katika msemo wa Kiebrania kusikiliza mara nyingi kunajumuisha kuitii, jambo linaloelezwa katika tanbihi.
theological_decisions:
- issue: Maana ya wakati katika בְּאַחֲרִית הַיָּמִים
  choice: katika siku za mwisho
  alternative: katika siku zijazo
  rationale: Kirai cha Kiebrania kinaweza kumaanisha kipindi cha baadaye kwa upana na si lazima kiwe mpango maalumu wa eskatolojia. Tafsiri kuu inadumisha msemo wa Biblia, huku tanbihi ikihifadhi upana wake.
- issue: Lugha ya kurudi kwa agano katika וְשַׁבְתָּ עַד יְהוָה
  choice: utamrudia Yahweh Mungu wako
  alternative: utatubu na kumgeukia Yahweh Mungu wako
  rationale: ‘Utamrudia’ inadumisha wazo la kurudi katika uhusiano na Mungu bila kuingiza ufafanuzi mpana wa mafundisho ambao kitenzi chenyewe hakisemi wazi.
- issue: Maana ya וְשָׁמַעְתָּ בְּקֹלוֹ
  choice: kuisikiliza sauti yake
  alternative: kuitii sauti yake
  rationale: Tafsiri kuu inadumisha sitiari ya sauti katika Kiebrania, huku tanbihi ikionyesha kwamba usemi huo pia una maana ya kutii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. ‘Dhiki’ ni neno linalotambulika kwa taabu nzito; ‘utamrudia’ ni la kawaida na hudumisha maana ya uhusiano. Alama za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyofafanuliwa.
