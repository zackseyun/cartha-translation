base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/043.yaml
  text: Bezer in the wilderness[a], in the land of the tableland, for the Reubenite; and Ramoth in Gilead for the Gadite; and Golan in Bashan for the Manassite.
translation:
  language: sw
  text: Beseri, jangwani, katika nchi ya uwanda wa juu[a], kwa Wareubeni; Ramothi katika Gileadi, kwa Wagadi; na Golani katika Bashani, kwa Wamanase.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika nchi tambarare.” Neno la Kiebrania humaanisha nchi iliyo sawa au eneo la uwanda; hapa linaweza kurejelea nyanda zilizoinuka mashariki ya Yordani.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּצֶר
  choice: Beseri
  rationale: Jina la mahali limetoholewa kwa tahajia na matamshi yanayoeleweka katika Kiswahili.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: מִדְבָּר humaanisha eneo la nyika au pori kavu lisilolimwa; “jangwani” ni usemi mfupi na wa kawaida wa kijiografia katika muktadha huu.
- source_word: בְּאֶרֶץ הַמִּישֹׁר
  choice: katika nchi ya uwanda wa juu
  rationale: מִישֹׁר ni nchi tambarare au uwanda; hapa inaelekea kurejelea uwanda ulioinuka mashariki ya Yordani, kwa hiyo “uwanda wa juu” huepuka picha potovu ya bonde la chini huku tanbihi ikihifadhi tafsiri mbadala.
- source_word: לָרֻאוּבֵנִי
  choice: kwa ajili ya Wareubeni
  rationale: Nomino ya Kiebrania iko katika umoja wa kijamii lakini hutaja kundi la kabila; wingi wa Kiswahili ni wa kawaida na huwasilisha maana hiyo.
- source_word: רָאמֹת
  choice: Ramothi
  rationale: Jina la mahali limetoholewa kwa muundo unaosomeka kwa kawaida katika Kiswahili.
- source_word: בַּגִּלְעָד
  choice: huko Gileadi
  rationale: “Huko” huonyesha eneo la mji kwa Kiswahili cha kawaida, na jina la eneo limetoholewa.
- source_word: לַגָּדִי
  choice: kwa ajili ya Wagadi
  rationale: Umoja wa kijamii wa Kiebrania unawakilisha watu wa kabila la Gadi; Kiswahili hutumia wingi kwa kawaida.
- source_word: גּוֹלָן
  choice: Golani
  rationale: Jina la mahali limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: בַּבָּשָׁן
  choice: huko Bashani
  rationale: Jina la eneo limetoholewa, na “huko” huonyesha uhusiano wa mahali kwa ufasaha.
- source_word: לַמְנַשִּׁי
  choice: kwa ajili ya Wamanase
  rationale: Neno la Kiebrania la mtu wa Manase limetumika kwa maana ya kikabila; wingi wa Kiswahili unaonyesha kundi linalokusudiwa.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: orodha yenye semikholoni na “na”
  rationale: Kiashiria cha yambwa אֶת hakina neno la moja kwa moja katika Kiswahili; mpangilio wa miji mitatu umeonyeshwa kwa uorodheshaji na kiunganishi cha mwisho.
