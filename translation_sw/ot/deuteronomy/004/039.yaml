base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/039.yaml
  text: So know today[a], and take it to your heart, that Yahweh, he is God in the heavens above and on the earth beneath[b]; there is no other.
translation:
  language: sw
  text: Ujue leo, na uweke moyoni mwako kwamba Yahweh ndiye Mungu mbinguni juu na duniani chini; hakuna mwingine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: ujue leo
  rationale: Kitenzi cha Kiebrania kina nguvu ya himizo katika muktadha. “Ujue leo” huhifadhi himizo hilo na uharaka wa הַיּוֹם kwa Kiswahili cha kawaida.
- source_word: וַהֲשֵׁבֹתָ אֶל־לְבָבֶךָ
  choice: ulitie moyoni mwako
  rationale: Nahau hii inahusu kulikubali na kulizingatia kwa ndani jambo lililo kweli. “Ulitie moyoni mwako” huhifadhi taswira ya moyo bila tafsiri kavu ya neno kwa neno.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kwa cheo.
- source_word: הוּא הָאֱלֹהִים
  choice: ndiye Mungu
  rationale: Muundo wa “ndiye” huonyesha mkazo wa kiwakilishi הוּא na utambulisho wa kipekee unaokusudiwa na Kiebrania.
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל־הָאָרֶץ מִתָּחַת
  choice: mbinguni juu na duniani chini
  rationale: Huhifadhi jozi ya maeneo inayojumuisha ulimwengu wote—mbingu juu na dunia chini—kwa usemi wa asili wa Kiswahili.
- source_word: אֵין עוֹד
  choice: hakuna mwingine
  rationale: Usemi huu mfupi na wa kawaida huhifadhi dai kamili la kutokuwapo kwa Mungu mwingine.
theological_decisions:
- issue: Uwakilishi wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja. “Yahwe” huhifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Mkazo wa הוּא katika utambulisho wa Mungu
  choice: Yahwe ndiye Mungu
  alternative: Yahwe ni Mungu
  rationale: “Ndiye” huhifadhi mkazo wa Kiebrania—Yahwe, yeye ndiye Mungu—kwa Kiswahili cha asili.
- issue: Dai la upekee katika אֵין עוֹד
  choice: hakuna mwingine
  alternative: hakuna mwingine zaidi yake
  rationale: Tafsiri iliyochaguliwa huhifadhi upekee kamili unaotamkwa katika mstari bila kuongeza maneno yasiyosemwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “ulitie moyoni mwako” ni wa kibiblia lakini bado ni wa asili; “ndiye” hubeba mkazo wa Kiebrania bila kufanya sentensi kuwa nzito.
