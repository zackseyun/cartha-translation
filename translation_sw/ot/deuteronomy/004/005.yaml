source:
  edition: WLC
  text: רְאֵ֣ה לִמַּ֣דְתִּי אֶתְ/כֶ֗ם חֻקִּים֙ וּ/מִשְׁפָּטִ֔ים כַּ/אֲשֶׁ֥ר צִוַּ֖/נִי יְהוָ֣ה אֱלֹהָ֑/י לַ/עֲשׂ֣וֹת כֵּ֔ן בְּ/קֶ֣רֶב הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם בָּאִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/005.yaml
  text: See[a], I have taught you statutes and judgments, just as Yahweh my God commanded me[c][b], so that you may do so in the midst of the land that you are entering there to possess it.
translation:
  language: sw
  text: Tazama, nimewafundisha sheria na hukumu[a], kama vile Yahwe Mungu wangu alivyoniamuru, ili mzitende katikati ya nchi[b] mnayoingia humo ili kuimiliki[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maagizo na maamuzi ya kisheria.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “katikati ya nchi”; inaweza pia kutafsiriwa kwa urahisi kuwa “katika nchi.”
    reason: lexical_alternative
  - marker: c
    text: Au “ili kuirithi”; katika muktadha huu kitenzi cha Kiebrania kinaweza kumaanisha kumiliki au kurithi.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Tazama
  rationale: Ni amri ya umoja inayotumiwa kuvuta usikivu wa wasikilizaji. “Tazama” ina nguvu ya moja kwa moja na inafaa katika lugha ya heshima ya kisasa.
- source_word: לִמַּדְתִּי
  choice: nimewafundisha
  rationale: Kauli timilifu ya nafsi ya kwanza inaonyesha tendo lililokamilika lenye umuhimu wa sasa; wakati timilifu wa Kiswahili unaleta maana hiyo kwa kawaida.
- source_word: חֻקִּים וּמִשְׁפָּטִים
  choice: masharti na hukumu
  rationale: “Masharti” yanaonyesha maagizo yaliyowekwa, huku “hukumu” ikihifadhi uhusiano wa neno la pili na maamuzi ya kisheria na haki.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Huonyesha kwamba mafundisho ya Musa yalilingana na alichoamriwa na Mungu.
- source_word: יְהוָה אֱלֹהָי
  choice: Yahwe Mungu wangu
  rationale: Jina la agano יְהוָה limetolewa kwa namna ya “Yahwe,” na אֱלֹהָי kwa “Mungu wangu.”
- source_word: לַעֲשׂוֹת כֵּן
  choice: ili mzitende
  rationale: 'Infinitivu inaeleweka kwa kusudi la mafundisho: watu wazitekeleze sheria hizo. Kiwakilishi “-zi-” kinarejelea masharti na hukumu kwa njia ya kawaida ya Kiswahili.'
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: katikati ya nchi
  rationale: Huhifadhi picha halisi ya בְּקֶרֶב badala ya kuirahisisha kuwa “katika nchi” tu.
- source_word: בָּאִים שָׁמָּה
  choice: mnayoingia humo
  rationale: Muundo huu unaonyesha kuingia kunakokaribia na pia unahifadhi kielezi cha mahali שָׁמָּה kwa “humo.”
- source_word: לְרִשְׁתָּהּ
  choice: ili kuimiliki
  rationale: ירשׁ katika muktadha wa nchi inaweza kumaanisha kumiliki au kurithi; “kuimiliki” ni pana, wazi, na inafaa hapa.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יְהוָה. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Mhusika wa לַעֲשׂוֹת כֵּן
  choice: Waisraeli ndio wanaopaswa kuyatenda masharti na hukumu
  alternative: Musa ndiye aliyeamriwa kuyatenda
  rationale: Ingawa infinitivu inaweza kuonekana kuhusiana na amri aliyopewa Musa, muktadha wa Musa kuwafundisha watu kwa ajili ya maisha yao katika nchi unaunga mkono kusudi kwamba wao wayatekeleze. Tafsiri “ili mzitende” inaonyesha usomaji huu bila kuongeza maelezo ya kiitikadi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi msisitizo wa “katikati ya nchi” na kielezi “humo” bila kufanya sentensi kuwa ngumu kupita kiasi.
