  text: mfano wa mnyama yeyote aliye duniani,[a] mfano wa ndege yeyote mwenye mabawa anayeruka angani,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umbo” au “sura” badala ya “mfano” (תַּבְנִית); hapa neno hilo linarejelea kitu kilichotengenezwa ili kuwakilisha kiumbe kwa ajili ya ibada.
