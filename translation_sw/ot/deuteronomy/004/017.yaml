  - marker: b
    text: Au “mbinguni.” Kiebrania kina umbo la wingi, “mbinguni,” ambalo katika muktadha huu linaweza kumaanisha anga linaloonekana.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית
  choice: mfano
  rationale: Katika muktadha wa sanamu zilizokatazwa, neno hili linamaanisha umbo au sura inayotengenezwa ili kuwakilisha kiumbe; “mfano” ni la kawaida na linafaa kwa marudio ya kishairi ya mstari.
- source_word: כָּל
  choice: yeyote
  rationale: Likitumiwa pamoja na nomino ya umoja katika orodha hii, linaonyesha kiumbe chochote cha kundi husika.
- source_word: בְּהֵמָה
  choice: mnyama
  rationale: Hapa linarejelea kwa upana wanyama wa nchi kavu, si mifugo pekee.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: aliye juu ya nchi
  rationale: Huhifadhi mgawanyo wa viumbe kulingana na maeneo yao na utofauti dhidi ya ndege wa angani na viumbe wa majini katika muktadha.
- source_word: צִפּוֹר כָּנָף
  choice: ndege yeyote mwenye mabawa
  rationale: Tafsiri ya wazi na ya asili ya Kiswahili inayohifadhi maelezo ya kuwa na mabawa.
- source_word: תָּעוּף
  choice: anayeruka
  rationale: Hutoa maana ya tendo la kawaida linalolitambulisha kundi hili la ndege.
- source_word: בַּשָּׁמַיִם
  choice: angani
  rationale: Katika muktadha huu wingi wa Kiebrania unaashiria anga linaloonekana ambako ndege huruka; “angani” ni Kiswahili cha kawaida na sahihi.
