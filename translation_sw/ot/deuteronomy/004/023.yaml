  text: הִשָּׁמְר֣וּ לָ/כֶ֗ם פֶּֽן תִּשְׁכְּחוּ֙ אֶת בְּרִ֤ית יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁ֥ר כָּרַ֖ת עִמָּ/כֶ֑ם וַ/עֲשִׂיתֶ֨ם לָ/כֶ֥ם פֶּ֨סֶל֙ תְּמ֣וּנַת כֹּ֔ל אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/023.yaml
  text: Watch yourselves[a], lest you forget the covenant of Yahweh your God that he made with you, and make for yourselves a carved image, the likeness of anything that Yahweh your God has commanded you not to make.
translation:
  language: sw
  text: Jihadharini, msije mkalisahau agano la Yahweh Mungu wenu alilofanya nanyi, na kujitengenezea sanamu ya kuchonga yenye mfano wa kitu chochote ambacho Yahweh Mungu wako amekuamuru usikitengeneze[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema, “ambacho Yahweh Mungu wako amekuamuru.” Katazo, yaani “usikitengeneze,” linadokezwa na muktadha; linganisha Kumbukumbu la Torati 4:16.
    reason: Kufafanua kikanushi kilichodokezwa katika chanzo na kuwekwa wazi katika tafsiri.
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: Jihadharini
  rationale: Kauli hii ya onyo ina maana ya kujilinda au kuwa macho. “Jihadharini” ni Kiswahili cha kawaida na chenye uzito unaofaa, huku kikidumisha maana ya kujielekezea onyo.
- source_word: פֶּן תִּשְׁכְּחוּ
  choice: msije mkalisahau
  rationale: Muundo “msije...” unaonyesha jambo linaloonya lisitokee, kama פֶּן ikifuatwa na kitenzi cha uwezekano unaohofiwa.
- source_word: בְּרִית
  choice: agano
  rationale: “Agano” ni istilahi ya kawaida ya kibiblia kwa uhusiano wa ahadi wenye wajibu kati ya Mungu na watu wake; “makubaliano” yangepunguza uzito wake.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limewasilishwa kwa unukuzi “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: אֲשֶׁר כָּרַת עִמָּכֶם
  choice: alilofanya nanyi
  rationale: Kiebrania hutumia nahau ya “kukata agano”; katika Kiswahili, “kufanya agano” huwasilisha maana hiyo kwa uwazi na kwa kawaida.
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: na kujitengenezea
  rationale: Kiambishi cha kujitendea kinaonyesha kwamba walitengeneza kitu hicho kwa ajili yao wenyewe, sawa na nguvu ya לָכֶם.
- source_word: פֶּסֶל
  choice: sanamu ya kuchonga
  rationale: Neno hili linahusu hasa sanamu iliyotengenezwa kwa kuchongwa. Tafsiri hii ni mahususi zaidi kuliko “sanamu” peke yake.
- source_word: תְּמוּנַת כֹּל
  choice: yenye mfano wa kitu chochote
  rationale: “Mfano” unaonyesha umbo au sura inayowakilisha kitu, na “kitu chochote” inadumisha upeo mpana wa כֹּל.
- source_word: אֱלֹהֵיכֶם / אֱלֹהֶיךָ
  choice: Mungu wenu / Mungu wako
  rationale: Tafsiri inadumisha badiliko la Kiebrania kutoka wingi mwanzoni mwa mstari kwenda umoja katika kifungu cha mwisho, bila kulificha.
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ
  choice: ambacho Yahweh Mungu wako amekuamuru usikitengeneze
  rationale: Muktadha unaonyesha kwamba amri ni ya kutotengeneza sanamu. Kikanushi kilichodokezwa kimewekwa wazi ili Kiswahili kisitoe maana ya kwamba Mungu aliamuru sanamu itengenezwe.
theological_decisions:
- issue: Kikanushi kilichodokezwa katika kifungu cha mwisho
  choice: Kuweka wazi katazo kwa kusema “amekuamuru usikitengeneze.”
  alternative: Kutafsiri kwa umbo la moja kwa moja, “ambacho Yahweh Mungu wako amekuamuru,” na kuacha katazo lieleweke kutokana na muktadha.
  rationale: Maonyo ya karibu, hasa Kumbukumbu la Torati 4:16, yanakataza kutengeneza sura au sanamu. Bila kikanushi, Kiswahili kingeweza kudokeza kinyume cha hoja ya kifungu. Tanbihi inaonyesha wazi kwamba neno la kukanusha halipo moja kwa moja katika maandishi ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Jihadharini” na “msije” huleta onyo zito bila kuwa lugha ya kizamani. Badiliko la viwakilishi kutoka wingi (“wenu,” “nanyi”) kwenda umoja (“wako,” “amekuamuru”) limehifadhiwa kwa kuwa limo katika maandishi ya Kiebrania.
