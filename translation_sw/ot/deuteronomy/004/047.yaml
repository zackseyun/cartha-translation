base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/047.yaml
  text: and they took possession of his land[a], and the land of Og king of Bashan—the two kings of the Amorites who were beyond the Jordan[b], toward the sunrise.
translation:
  language: sw
  text: Nao wakaitwaa nchi yake na nchi ya Ogu, mfalme wa Bashani—wafalme hao wawili wa Waamori waliokuwa ng’ambo ya Yordani[a], upande wa mawio ya jua.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upande mwingine wa Yordani.” Msemo huu wa Kiebrania ni nahau ya kawaida ya kijiografia; upande unaokusudiwa hutegemea mahali anapotazama msemaji au msimulizi.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “kuelekea mawio ya jua,” yaani, upande wa mashariki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: wakaitwaa
  rationale: Katika muktadha wa ushindi na umiliki wa eneo, ירשׁ humaanisha kutwaa na kuanza kumiliki nchi, mara nyingi baada ya kuwaondoa waliokuwa wanaishikilia. ‘Wakaitwaa’ ni ya kawaida na hudumisha maana ya ushindi kuliko ‘wakarithi.’
- source_word: אַרְצוֹ
  choice: nchi yake
  rationale: Kiambishi cha nafsi ya tatu umoja wa kiume kinamrejelea mfalme aliyetajwa awali, yaani Sihoni. ‘Nchi yake’ ni tafsiri ya moja kwa moja na ya asili.
- source_word: אֶרֶץ עוֹג מֶלֶךְ הַבָּשָׁן
  choice: nchi ya Ogu, mfalme wa Bashani
  rationale: Muundo huu unaonyesha kwamba nchi ni ya Ogu na kwamba Ogu alikuwa mfalme wa Bashani. Koma husaidia sentensi kusomeka wazi bila kubadili uhusiano wa maneno.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: wafalme wawili wa Waamori
  rationale: Hii hudumisha uhusiano wa kimilikishi wa Kiebrania na kuwatambulisha Sihoni na Ogu kwa pamoja kuwa wafalme wa Waamori.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: ng’ambo ya Yordani
  rationale: Huu ni msemo wa kawaida wa kijiografia unaoweza kumaanisha upande mwingine wa Yordani kulingana na mahali anapotazama msemaji au msimulizi. ‘Ng’ambo ya Yordani’ huhifadhi mtazamo huo usioainishwa kabisa.
- source_word: מִזְרַח שָׁמֶשׁ
  choice: upande wa mawio ya jua
  rationale: Tafsiri hii hudumisha taswira halisi ya Kiebrania ya kuchomoza kwa jua huku ikielekeza wazi upande wa mashariki.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Ogu,’ ‘Bashani,’ ‘Waamori,’ na ‘Yordani’ ni maumbo ya majina yanayotambulika katika matumizi ya Biblia ya Kiswahili. Muundo ‘hao ndio’ unafafanua kwamba Sihoni na Ogu ndio wale wafalme wawili bila kuongeza hitimisho la kitheolojia.
