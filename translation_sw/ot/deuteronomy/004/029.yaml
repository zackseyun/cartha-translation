  text: וּ/בִקַּשְׁתֶּ֥ם מִ/שָּׁ֛ם אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/מָצָ֑אתָ כִּ֣י תִדְרְשֶׁ֔/נּוּ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/029.yaml
  text: But from there you will seek Yahweh your God[a], and you will find him[b], if you seek him with all your heart and with all your soul.
translation:
  language: sw
  text: Lakini kutoka huko mtamtafuta Yahweh Mungu wako[a], nawe utampata[b], ikiwa utamtafuta kwa moyo wako wote na kwa nafsi yako yote.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaanza kwa “mtamtafuta” (wingi), kisha kinatumia “wako” na vitenzi vya umoja katika sehemu iliyobaki ya mstari.
    reason: textual_grammar
  - marker: b
    text: Au “nawe utapata”; Kiebrania hakirudii kiwakilishi cha yambwa hapa, lakini anayepatikana anaeleweka kutokana na kishazi kilichotangulia.
    reason: lexical_alternative
  - marker: c
    text: “Nafsi” hapa yaweza pia kutafsiriwa “uhai” au “utu wote”; neno la Kiebrania נֶפֶשׁ mara nyingi humaanisha mtu mzima aliye hai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִקַּשְׁתֶּם
  choice: Lakini ... mtamtafuta
  rationale: Kiunganishi kinaendeleza wazo kwa utofautishaji na onyo lililotangulia, huku kitenzi kikipewa maana ya wakati ujao. Umbo la wingi limehifadhiwa.
- source_word: מִשָּׁם
  choice: kutoka huko
  rationale: 'Huhifadhi maana ya mahali: Israeli watamtafuta Mungu wakiwa huko walikotawanywa.'
- source_word: אֶת יְהוָה אֱלֹהֶיךָ
  choice: Yahweh Mungu wako
  rationale: Jina la agano יְהוָה limetoholewa kuwa “Yahweh.” Kiambishi cha nafsi ya pili umoja katika “Mungu wako” kimehifadhiwa licha ya kitenzi cha wingi kilichotangulia.
- source_word: וּמָצָאתָ
  choice: nawe utampata
  rationale: Kitenzi ni cha nafsi ya pili umoja. Kiambishi cha yambwa “-m-” kimetolewa kutokana na Yahweh aliyetajwa katika kishazi kilichotangulia, ingawa Kiebrania hakirudii kiwakilishi cha yambwa hapa.
- source_word: כִּי
  choice: ikiwa
  rationale: Katika muktadha huu huanzisha sharti la kumpata Mungu bila kuligeuza kuwa dai la wakati usio na sharti.
- source_word: תִדְרְשֶׁנּוּ
  choice: utamtafuta
  rationale: דרש katika muktadha wa agano humaanisha kumtafuta Mungu kwa bidii; kiambishi cha yambwa kimetafsiriwa wazi.
- source_word: בְּכָל לְבָבְךָ
  choice: kwa moyo wako wote
  rationale: Ni usemi wa kawaida na wa asili unaoonyesha kujitoa kwa utu wa ndani wote—nia, fikira na hisia.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: na kwa nafsi yako yote
  rationale: “Nafsi” huhifadhi mwangwi wa usemi wa agano, huku ikieleweka hapa kuwa mtu mzima au uhai wote, si sehemu isiyo ya kimwili pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano, Tetragramatoni. “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya נֶפֶשׁ katika usemi wa kujitoa kwa agano
  choice: nafsi
  alternative: uhai; utu wote
  rationale: “Nafsi” huhifadhi istilahi na mwangwi wa kifasihi wa usemi huu wa Kumbukumbu la Torati, huku tanbihi ikionyesha upana wake wa maana.
- issue: Mabadiliko kutoka nafsi ya pili wingi kwenda umoja
  choice: Kuhifadhi “mtamtafuta” kisha “wako/utampata/utamtafuta”
  alternative: Kusawazisha mstari wote kuwa wingi au umoja
  rationale: Maandishi ya Kiebrania hubadilika kutoka wingi katika וּבִקַּשְׁתֶּם kwenda umoja katika maneno yanayofuata. Tafsiri hailifichi badiliko hilo, ambalo linaweza kuiambia Israeli kwa pamoja na pia kila mshiriki mmoja mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Badiliko lisilo la kawaida la wingi kwenda umoja limehifadhiwa kwa sababu limo katika maandishi ya Kiebrania na limefafanuliwa kwa tanbihi.
