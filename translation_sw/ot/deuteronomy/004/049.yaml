base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/049.yaml
  text: and all the Arabah beyond the Jordan eastward[a], as far as the Sea of the Arabah, below the slopes of Pisgah.
translation:
  language: sw
  text: na Araba yote ng’ambo ya Yordani upande wa mashariki, mpaka Bahari ya Araba[a], chini ya miteremko ya Pisga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, ziwa linalojulikana kwa kawaida kama Bahari ya Chumvi.
    reason: cross_reference
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: Araba
  rationale: Imetumiwa kama jina la kijiografia la eneo la ufa wa Yordani, badala ya tafsiri ya jumla kama “tambarare.”
- source_word: עֵבֶר הַיַּרְדֵּן
  choice: ng’ambo ya Yordani
  rationale: Huhifadhi maana ya eneo lililo upande mwingine wa Mto Yordani kwa mtazamo wa msemaji, kwa Kiswahili cha kawaida na fasaha.
- source_word: מִזְרָחָה
  choice: upande wa mashariki
  rationale: Huonyesha wazi kuwa eneo linalotajwa liko mashariki mwa Yordani.
- source_word: יָם הָעֲרָבָה
  choice: Bahari ya Araba
  rationale: Ni tafsiri ya karibu ya jina la Kiebrania na haibadilishi jina hilo moja kwa moja kuwa jina la baadaye, “Bahari ya Chumvi” au “Bahari ya Chumvi Sana.” Utambulisho wa kawaida umetolewa katika tanbihi.
- source_word: תַּחַת
  choice: chini ya
  rationale: Katika maelezo ya sura ya nchi, huonyesha kwa kawaida mahali palipo chini ya miteremko.
- source_word: אַשְׁדֹּת
  choice: miteremko
  rationale: Katika matumizi ya kijiografia, neno hili hurejelea sehemu za mlima zinazoteremka.
- source_word: הַפִּסְגָּה
  choice: Pisga
  rationale: Jina la mahali limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: וְכָל
  choice: na ... yote
  rationale: Huhifadhi kiunganishi na wazo la eneo lote linalotajwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. Mpangilio wa maneno umefanywa wa kawaida kwa Kiswahili huku majina ya kijiografia na uhusiano wa maeneo yakihifadhiwa. Alama ya tanbihi imewekwa baada ya “Bahari ya Araba,” ambayo ndiyo habari inayofafanuliwa.
