  yaml_path: translation/ot/deuteronomy/004/024.yaml
  text: For Yahweh your God is a consuming fire[a], a jealous God.
translation:
  language: sw
  text: Kwa maana Yahwe Mungu wako ni moto ulao, Mungu mwenye wivu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mungu mwenye bidii.” Kiebrania kinakazia dai la kipekee la Yahwe juu ya watu wake wa agano, hasa katika muktadha wa ibada ya sanamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huanzisha sababu ya onyo lililotangulia na ni kiunganishi cha kawaida cha Kiswahili chenye nguvu ya ufafanuzi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania badala ya kulibadili kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huhifadhi umilikaji na usemi wa agano unaomwelekea msikilizaji kwa umoja.
- source_word: אֵשׁ אֹכְלָה
  choice: moto ulao
  rationale: Huhifadhi taswira hai ya moto unaoteketeza kwa usemi mfupi na wa asili katika Kiswahili.
- source_word: הוּא
  choice: ni
  rationale: Kishazi cha kiarifu cha Kiswahili huwasilisha maana ya kiwakilishi cha msisitizo cha Kiebrania bila kurudia kiwakilishi kwa namna isiyo ya kawaida.
- source_word: אֵל
  choice: Mungu
  rationale: Hapa ni cheo cha kimungu kinachoeleza zaidi utambulisho wa Yahwe.
- source_word: קַנָּא
  choice: mwenye wivu
  rationale: Huhifadhi dai la kipekee la Mungu juu ya watu wa agano na kutovumilia ibada ya miungu mingine, bila kulainisha mvutano wa neno la Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri wivu wa Mungu
  choice: Mungu mwenye wivu
  alternative: Mungu mwenye bidii
  rationale: Katika muktadha wa onyo dhidi ya ibada ya sanamu, “mwenye wivu” hudumisha dai la kipekee la agano na nguvu ya kimahusiano ya קַנָּא; “mwenye bidii” ingeweza kudhoofisha maana hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ni mfupi na wa kishairi, huku “moto ulao” ukihifadhi sitiari ya Kiebrania.
