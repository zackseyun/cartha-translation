base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/022.yaml
  text: For I am dying in this land[a]; I am not crossing the Jordan[b], but you are crossing over and will take possession of this good land.
translation:
  language: sw
  text: Kwa maana mimi nitakufa katika nchi hii[a]; sitavuka Yordani, lakini ninyi mtavuka na kuimiliki[b] nchi hii nzuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “niko karibu kufa katika nchi hii.” Partisipi ya Kiebrania inaweza kueleza tendo la wakati ujao lililo karibu kutokea.
    reason: lexical_alternative
  - marker: b
    text: Au, “kuirithi.” Kitenzi cha Kiebrania kinaweza kumaanisha kuichukua nchi iwe milki ya urithi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Hutanguliza sababu ya onyo na himizo lililotangulia, huku ikidumisha uhusiano wa maelezo kwa Kiswahili cha kawaida.
- source_word: אָנֹכִי
  choice: mimi
  rationale: Kiwakilishi huru cha Kiebrania kina mkazo; kutaja “mimi” wazi hudumisha utofauti kati ya Musa na “ninyi.”
- source_word: מֵת
  choice: nitakufa
  rationale: Kitenzi-jina cha Kiebrania kinaelekea kwenye kifo cha Musa kilicho karibu. Wakati ujao unasikika kwa kawaida katika Kiswahili, huku tanbihi ikihifadhi maana mbadala ya tukio lililo karibu sana.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: katika nchi hii
  rationale: “Nchi” hudumisha istilahi ya kawaida ya Kumbukumbu la Torati katika muktadha wa nchi na urithi; hapa inaelekeza eneo la mashariki ya Yordani ambako Musa atakufa.
- source_word: אֵינֶנִּי עֹבֵר
  choice: sitavuka
  rationale: Muundo hasi pamoja na kitenzi-jina unaonyesha jambo la karibu ambalo halitatokea. Wakati ujao wa Kiswahili huwasilisha maana hiyo kwa uwazi na uasilia.
- source_word: אֶת הַיַּרְדֵּן
  choice: Yordani
  rationale: Jina hili linatambulika kwa kawaida kuwa mto katika muktadha wa Biblia; si lazima kuongeza neno “Mto” ili maana iwe wazi.
- source_word: וְאַתֶּם עֹבְרִים
  choice: lakini ninyi mtavuka
  rationale: Ingawa וְ kimsingi ni “na,” hapa inaonyesha utofauti kati ya Musa ambaye hatavuka na Waisraeli watakaovuka; “lakini” huufanya utofauti huo uwe wazi kwa Kiswahili cha kawaida.
- source_word: וִירִשְׁתֶּם
  choice: na kuimiliki
  rationale: Katika muktadha wa ahadi ya nchi, ירשׁ humaanisha kuichukua na kuwa nayo kama milki au urithi. “Kuimiliki” ni fupi, wazi, na hufuata tendo la kuvuka kwa kawaida.
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: nchi hii nzuri
  rationale: Hudumisha kiwakilishi kionyeshi na tathmini ya Kiebrania bila kufafanua “nzuri” kwa namna finyu kama yenye rutuba pekee.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Utofauti kati ya “mimi” na “ninyi” umewekwa wazi, na istilahi “nchi” imedumishwa kwa upatanifu na muktadha wa agano na urithi katika Kumbukumbu la Torati.
