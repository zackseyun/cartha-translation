base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/040.yaml
  text: So you shall keep his statutes and his commandments that I am commanding you today[a], so that it may go well with you and with your children after you[c][b], and so that you may prolong your days on the land that Yahweh your God is giving you for all your days.
translation:
  language: sw
  text: Kwa hiyo, shika masharti yake na amri zake ninazokuamuru leo, ili mambo yakuendee vyema wewe na watoto wako baada yako,[a] na ili uishi siku nyingi katika nchi[b] ambayo Yahweh, Mungu wako, anakupa kwa siku zako zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Watoto” inaweza pia kutafsiriwa “wana” au, kwa maana pana katika muktadha huu, “wazao.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi “juu ya ardhi”; katika muktadha huu maana ni kuishi katika nchi anayoitoa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Kwa hiyo, shika
  rationale: Kitenzi שׁמר katika muktadha wa agano humaanisha kutii au kushika. Kauli ya kuamuru inafaa katika Kiswahili, na “Kwa hiyo” inaonyesha hitimisho linalotokana na hoja iliyotangulia.
- source_word: חֻקָּיו
  choice: masharti yake
  rationale: חֻקִּים ni matakwa au masharti yaliyowekwa. “Masharti” yanatofautisha neno hili na מִצְוֹת, yaani “amri,” bila kutumia lugha nzito isiyo ya kawaida.
- source_word: מִצְוֺתָיו
  choice: amri zake
  rationale: מִצְוָה humaanisha amri. Tafsiri hii ni ya kawaida, ya heshima, na inadumisha tofauti ya kileksia na “masharti.”
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ninazokuamuru leo
  rationale: Muundo huu unaonyesha tendo la Musa la kutoa amri wakati wa hotuba hii; Kiswahili cha wakati wa sasa kinaeleza hali hiyo kwa ufasaha.
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: ili mambo yakuendee vyema
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kuwa hali itakuwa njema kwa mtu. Tafsiri hii ni ya asili katika Kiswahili na haibani maana kuwa faida ya aina moja tu.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: na watoto wako baada yako
  rationale: בנים inaweza kumaanisha wana, watoto, au vizazi. “Watoto” ni pana kwa jinsia na inafaa katika muktadha wa manufaa ya vizazi vinavyofuata.
- source_word: וּלְמַעַן תַּאֲרִיךְ יָמִים
  choice: na ili uishi siku nyingi
  rationale: Ingawa muundo wa Kiebrania ni kama “kurefusha siku,” ni nahau ya kuishi muda mrefu. Kiswahili hiki ni cha kawaida huku kikihifadhi taswira ya siku nyingi.
- source_word: עַל הָאֲדָמָה
  choice: katika nchi
  rationale: אֲדָמָה hapa ni nchi ambayo Mungu anawapa Israeli, si udongo tu. Kiswahili kwa kawaida husema kuishi “katika nchi,” ingawa עַל ni “juu ya.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa na cheo.
- source_word: נֹתֵן לְךָ
  choice: anakupa
  rationale: Neno shirikishi נֹתֵן linaweza kuonyesha tendo linaloendelea au lililo karibu; “anakupa” linahifadhi hali hiyo ya sasa.
- source_word: כָּל הַיָּמִים
  choice: kwa siku zako zote
  rationale: Kifungu hiki kinaonyesha muda wote wa maisha ya msikilizaji. Tafsiri hii inadumisha picha ya “siku” badala ya kuifupisha kuwa “daima.”
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya utii, hali njema, na maisha marefu
  choice: 'Kuhifadhi vifungu vya kusudi: “ili ... na ili ...”'
  alternative: Kuvigeuza kuwa ahadi zisizo na masharti au kanuni ya mafanikio ya lazima
  rationale: Aya inaunganisha kushika amri na matokeo yaliyokusudiwa katika agano. Tafsiri haiongezi maelezo ya kidhehebu wala kuamua zaidi ya sarufi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Umoja wa nafsi ya pili umehifadhiwa. Maneno “masharti” na “amri” yanadumisha tofauti ya istilahi za Kiebrania, na nahau zimetolewa kwa Kiswahili cha kawaida bila kufuta taswira ya “siku nyingi.”
