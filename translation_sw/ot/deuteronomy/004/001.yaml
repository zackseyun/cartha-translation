language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יִשְׂרָאֵ֗ל שְׁמַ֤ע אֶל הַֽ/חֻקִּים֙ וְ/אֶל הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָֽנֹכִ֛י מְלַמֵּ֥ד אֶתְ/כֶ֖ם לַ/עֲשׂ֑וֹת לְמַ֣עַן תִּֽחְי֗וּ וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁ֧ר יְהוָ֛ה אֱלֹהֵ֥י אֲבֹתֵי/כֶ֖ם נֹתֵ֥ן לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/001.yaml
  text: And now[a], Israel, listen to the statutes and the judgments that I am teaching you to do, so that you may live and go in and take possession of the land that Yahweh, the God of your fathers[c][b], is giving to you.
translation:
  language: sw
  text: Na sasa, enyi Israeli, sikilizeni maagizo na hukumu[a] ninazowafundisha kuzitenda, ili mpate kuishi, kuingia na kuimiliki[b] nchi ambayo Yahwe[c], Mungu wa baba zenu, anawapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kanuni na maamuzi ya kisheria.”
    reason: lexical_alternative
  - marker: b
    text: Au “kuitwaa” au “kuirithi.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “YHWH”; kwa desturi hutafsiriwa “Bwana.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Inadumisha kiunganishi cha hoja na mgeuko wa hotuba unaounganisha himizo hili na simulizi lililotangulia.
- source_word: שְׁמַע
  choice: sikilizeni
  rationale: Katika muktadha huu kitenzi kinadai kusikiliza kwa makini. Tafsiri ya moja kwa moja ya ‘tiini’ ingeondoa mapema upana wa maana; wazo la kutii linaelezwa na ‘mzitende.’ Wingi umetumiwa kwa Kiswahili cha kawaida kwa kuwa Israeli hapa ni jumuiya na viwakilishi vinavyofuata katika Kiebrania ni vya wingi.
- source_word: הַחֻקִּים
  choice: masharti
  rationale: Neno hili linaonyesha maagizo yaliyowekwa na linabaki tofauti na מִשְׁפָּטִים. ‘Masharti’ ni neno la sasa na linaloeleweka katika muktadha wa kisheria.
- source_word: הַמִּשְׁפָּטִים
  choice: hukumu
  rationale: Linahifadhi maana ya kisheria na kimahakama na kutofautisha neno hili na ‘masharti.’
- source_word: מְלַמֵּד
  choice: ninazowafundisha
  rationale: Umbo la kitenzi linaonyesha tendo linaloendelea wakati Musa anapotoa mafundisho haya.
- source_word: לַעֲשׂוֹת
  choice: mzitende
  rationale: Linahifadhi msisitizo wa kutekeleza masharti na hukumu, badala ya kusikia tu.
- source_word: לְמַעַן תִּחְיוּ
  choice: ili mpate kuishi
  rationale: Linaeleza wazi kusudi au matokeo yaliyokusudiwa bila kufafanua kupita kiasi aina ya ‘kuishi.’
- source_word: וּבָאתֶם
  choice: kuingia
  rationale: Katika mfuatano huu linabeba maana ya kuingia katika nchi, kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: וִירִשְׁתֶּם
  choice: kuimiliki
  rationale: Katika muktadha wa nchi iliyoahidiwa, kitenzi kina maana ya kuitwaa na kuwa nayo; ‘kuimiliki’ huhifadhi wazo hilo, huku uwezekano wa ‘kurithi’ ukitajwa katika tanbihi.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: ‘Nchi’ ni ya kawaida katika Kiswahili kwa eneo la ahadi na inafaa zaidi hapa kuliko ‘ardhi,’ ambayo inaweza kumaanisha udongo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetafsiriwa kwa kulitamka kama jina maalumu badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Mungu wa baba zenu
  rationale: Inahifadhi kauli ya kifamilia na ya kiagano ya Kiebrania, ambayo inawarejelea mababu wa Israeli kwa neno la kiume lililotumiwa katika chanzo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia moja kwa moja herufi nne za jina la Mungu. ‘Yahwe’ huhifadhi jina hilo kama jina maalumu bila kuligeuza kuwa cheo; tanbihi inaeleza desturi nyingine ya tafsiri.
- issue: Uhusiano wa kusikiliza na kutii
  choice: sikilizeni … mzitende
  alternative: tiini
  rationale: Kiebrania kinatenganisha wito wa kusikiliza na agizo la kutenda. Tafsiri hii inadumisha hatua zote mbili na haifupishi mvutano huo kuwa ‘tiini’ pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Enyi Israeli, sikilizeni’ ni mwito wa kawaida kwa taifa kama jumuiya; unaweka wazi idadi ya wingi inayotokea katika viwakilishi na vitenzi vinavyofuata. Muundo wa sentensi umehifadhi mfululizo wa kusikiliza, kutenda, kuishi, kuingia na kuimiliki nchi.
