  text: בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן בַּ/גַּ֗יְא מ֚וּל בֵּ֣ית פְּע֔וֹר בְּ/אֶ֗רֶץ סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן אֲשֶׁ֨ר הִכָּ֤ה מֹשֶׁה֙ וּ/בְנֵֽי יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מִ/מִּצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/046.yaml
  text: beyond the Jordan[a], in the valley opposite Beth-peor, in the land of Sihon king of the Amorites, who lived in Heshbon, whom Moses and the sons of Israel struck down when they came out from Egypt.
translation:
  language: sw
  text: ng’ambo ya Yordani, bondeni mkabala na Bethi-Peori, katika nchi ya Sihoni, mfalme wa Waamori, aliyeishi Heshboni, ambaye Musa na wana wa Israeli[a] walimpiga walipotoka Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli.” Kiebrania ni “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: ng’ambo ya Yordani
  rationale: Kirai hiki huonyesha eneo lililo upande wa pili wa mpaka wa Mto Yordani; “ng’ambo ya Yordani” ni Kiswahili cha kawaida na huhifadhi mtazamo wa kijiografia.
- source_word: בַּגַּיְא
  choice: bondeni
  rationale: גַּיְא humaanisha bonde au korongo; “bondeni” linafaa kwa maelezo haya ya kijiografia bila kuifanya sehemu hiyo iwe nyembamba kuliko inavyodokezwa.
- source_word: מוּל
  choice: mkabala na
  rationale: Neno hili huonyesha mahali panapokabiliana na pengine; “mkabala na” ni sahihi na lenye hadhi katika maelezo ya mahali.
- source_word: בֵּית פְּעוֹר
  choice: Beth-peori
  rationale: Ni jina la mahali, hivyo limetoholewa kwa muundo unaosomeka kwa Kiswahili badala ya kutafsiriwa kimaana.
- source_word: בְּאֶרֶץ סִיחֹן
  choice: katika nchi ya Sihoni
  rationale: אֶרֶץ hapa ni nchi au eneo linalotawaliwa na Sihoni; “nchi” ni neno la kawaida na linalotosha katika muktadha huu.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: mfalme wa Waamori
  rationale: Muundo huu unamtambulisha Sihoni rasmi kuwa mfalme wa watu wa Waamori.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: aliyekuwa akiishi Heshboni
  rationale: Kivumishi-tendo יוֹשֵׁב kinaonyesha makao au hali ya kuishi; “aliyekuwa akiishi” huwasilisha hali hiyo kwa Kiswahili cha asili.
- source_word: אֲשֶׁר הִכָּה
  choice: ambaye ... walimshinda
  rationale: Katika muktadha wa vita, נכה inaweza kumaanisha kumpiga au kumshinda. “Walimshinda” linaeleza matokeo ya kijeshi kwa Kiswahili cha kawaida bila kuongeza maelezo yasiyokuwapo.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: na wana wa Israeli
  rationale: Tafsiri hii huhifadhi muundo wa Kiebrania “wana wa Israeli,” ambao pia ni jina la pamoja la watu wa Israeli.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: walipotoka Misri
  rationale: Muundo wa Kiebrania unaonyesha wakati; “walipotoka Misri” ni wa asili na huhifadhi rejeo la kutoka kwao Misri.
theological_decisions:
- issue: Jina la pamoja lenye umbo la kiume katika וּבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: “Wana wa Israeli” huhifadhi kwa karibu umbo la Kiebrania na matumizi yake ya kiagano, huku tanbihi ikitoa tafsiri ya pamoja iliyo ya kawaida zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi muundo wa kijiografia na kihistoria wa Kiebrania, huku majina yakitoholewa kwa namna inayosomeka kwa wasomaji wa Kiswahili.
