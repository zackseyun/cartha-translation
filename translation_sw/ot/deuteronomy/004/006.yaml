base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/006.yaml
  text: So keep them and do them[a], for this is your wisdom and your understanding in the sight of the peoples, who will hear all these statutes and say[b], ‘Surely this great nation is a wise and understanding people.’
translation:
  language: sw
  text: 'Kumbukumbu la Torati 4:6


    Basi, yazingatieni na kuyatenda, kwa maana hiyo ndiyo hekima yenu na ufahamu wenu mbele ya mataifa yatakayosikia kanuni hizi zote[a] na kusema, “Hakika[b], taifa hili kubwa ni watu wenye hekima na ufahamu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kanuni” linatafsiri חֻקִּים, neno la kisheria linaloweza pia kutafsiriwa “masharti,” “sheria,” au “amri.”
    reason: lexical_alternative
  - marker: b
    text: 'Au, “Ni taifa hili kubwa tu ambalo ni watu wenye hekima na ufahamu.” Neno la Kiebrania רַק kwa maana ya moja kwa moja zaidi linaweza kumaanisha “tu,” lakini hapa huenda linatumika kama tamko la mkazo: “Hakika.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: yazingatieni
  rationale: Katika muktadha wa agano na sheria, שׁמר humaanisha kuyashika au kuyatii maagizo. “Yazingatieni” ni Kiswahili cha sasa na chenye heshima, na kinaonyesha uangalifu wa kudumu bila kudokeza kuhifadhi tu.
- source_word: וַעֲשִׂיתֶם
  choice: na kuyatenda
  rationale: עשה hukazia utekelezaji halisi. “Kuyatenda” huhifadhi jozi fupi ya Kiebrania ya kuzingatia na kutenda.
- source_word: כִּי הִוא
  choice: kwa maana hiyo ndiyo
  rationale: Kiwakilishi cha Kiebrania kinarejelea kwa namna ya kijumla yale yaliyotangulia. “Hiyo ndiyo” kinaweza kueleweka kuwa ni kuyazingatia na kuyatenda au mpangilio huo wa maagizo, hivyo hakifungi kwa lazima utata wa rejeleo.
- source_word: חָכְמַתְכֶם
  choice: hekima yenu
  rationale: “Hekima” ni neno la kawaida na la moja kwa moja kwa חכמה, likijumuisha busara ya kimaadili na ya vitendo.
- source_word: וּבִינַתְכֶם
  choice: ufahamu wenu
  rationale: “Ufahamu” hutofautishwa na “hekima” huku ukihifadhi maana ya utambuzi na uelewa iliyomo katika בינה.
- source_word: לְעֵינֵי הָעַמִּים
  choice: mbele ya mataifa
  rationale: Kirai hiki ni cha kawaida katika Kiswahili na kinaonyesha kwamba hekima hiyo itaonekana hadharani na watu wengine. “Mataifa” pia hutumika kwa wingi hapa, huku גוי ya baadaye ikitafsiriwa kwa umoja “taifa.”
- source_word: אֲשֶׁר יִשְׁמְעוּן
  choice: Yatasikia
  rationale: Kitenzi cha wakati ujao kinafuata “mataifa” kwa kawaida katika Kiswahili na kuendeleza mfuatano wa kusikia kisha kusema.
- source_word: כָּל הַחֻקִּים הָאֵלֶּה
  choice: maagizo haya yote
  rationale: חֻקִּים ni neno la kisheria. “Maagizo” linaeleweka kwa urahisi katika Kiswahili cha sasa na hudumisha nguvu ya mambo yaliyoamriwa bila kutumia lugha nzito isiyo ya kawaida.
- source_word: וְאָמְרוּ
  choice: na kusema
  rationale: Muundo huu unaunganisha kwa ufupi matendo mawili ya mataifa—kusikia na kusema—kama ilivyo katika Kiebrania.
- source_word: רַק
  choice: Hakika
  rationale: Ingawa רַק mara nyingi humaanisha “tu,” hapa lina nguvu ya mshangao na mkazo. “Hakika” linafikisha nguvu hiyo kwa Kiswahili cha kawaida; maana halisi zaidi imehifadhiwa katika tanbihi.
- source_word: עַם חָכָם וְנָבוֹן
  choice: jamii yenye hekima na ufahamu
  rationale: “Jamii” huwakilisha עַם kama kundi la watu na kufanya sentensi ya Kiswahili iwe ya asili baada ya “taifa hili kubwa.” “Hekima na ufahamu” hurudia kwa makusudi jozi ya dhana iliyotangulia.
theological_decisions:
- issue: Uhusiano kati ya utii na hekima
  choice: Kuzingatia na kutenda maagizo kunaonyeshwa kuwa hekima na ufahamu wa Israeli mbele ya mataifa.
  alternative: Maagizo yenyewe, mbali na utekelezaji wake, ndiyo tu hekima na ufahamu wa Israeli.
  rationale: Muundo wa sentensi unaunganisha amri ya kuzingatia na kutenda na kauli “hiyo ndiyo hekima yenu.” Tafsiri ya “hiyo” haifafanui kupita kiasi kama rejeleo ni tendo la utii au maagizo yanayotiiwa, hivyo inadumisha mvutano uliopo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. “Yazingatieni na kuyatenda” huhifadhi urudiaji wenye kusudi wa Kiebrania, huku “taifa ... jamii” likiepuka sentensi isiyo ya kawaida ya kusema taifa ni watu bila kupoteza taswira ya kundi la watu.
