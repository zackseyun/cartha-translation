base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/020.yaml
  text: But Yahweh took you and brought you out of the iron furnace[a], out of Egypt, to be for him a people of inheritance, as it is this day.
translation:
  language: sw
  text: Lakini Yahwe aliwachukua ninyi, akawatoa katika tanuru ya kuyeyushia chuma, ambayo ni Misri, ili muwe watu wa urithi wake, kama mlivyo leo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wake mwenyewe,” au “watu walio mali yake.” Kiebrania kinasema kwa maana halisi, “muwe kwake watu wa urithi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la Mungu la agano kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: לָקַח
  choice: aliwachukua
  rationale: Maana ya msingi ni ‘kuchukua’; katika muktadha huu pia inadokeza kuwateua na kuwafanya kuwa wake bila kuongeza ufafanuzi huo moja kwa moja katika matini.
- source_word: וַיּוֹצִא
  choice: akawatoa
  rationale: Kauli ya kusababisha ya kitenzi hiki ina maana ya kuwafanya watoke; ‘akawatoa’ ni ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: מִכּוּר הַבַּרְזֶל
  choice: katika tanuru ya kuyeyushia chuma
  rationale: Inahifadhi taswira ya tanuru huku ikibainisha kwa Kiswahili cha kawaida kuwa ni tanuru inayotumiwa kuyeyushia chuma, si tanuru iliyotengenezwa kwa chuma.
- source_word: מִמִּצְרָיִם
  choice: yaani Misri
  rationale: Misri inatambulisha mahali palipoitwa kwa sitiari ‘tanuru ya kuyeyushia chuma.’ ‘Yaani’ huonyesha uhusiano huo wazi na kwa asili katika Kiswahili.
- source_word: לִהְיוֹת לוֹ לְעַם נַחֲלָה
  choice: ili muwe watu wa urithi wake
  rationale: Inahifadhi lugha ya urithi na wazo la kuwa watu wanaomilikiwa na Yahwe, bila kuibadili moja kwa moja kuwa ‘watu wake mwenyewe.’
- source_word: כַּיּוֹם הַזֶּה
  choice: kama mlivyo leo
  rationale: Nahau hii inaelekeza kwenye hali yao iliyopo na inayoonekana wakati huo; tafsiri hii ni ya asili katika Kiswahili cha sasa.
theological_decisions:
- issue: Lugha ya agano na umiliki katika לְעַם נַחֲלָה
  choice: watu wa urithi wake
  alternative: watu wake mwenyewe; watu walio mali yake
  rationale: Chaguo hili linadumisha taswira mahsusi ya ‘urithi’ na wakati huohuo linaonyesha kuwa Israeli ni watu wa Yahwe, bila kufuta mvutano wa maana kati ya urithi na milki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja lakini unasomeka kwa kawaida; sitiari ya tanuru na lugha ya urithi zimehifadhiwa.
