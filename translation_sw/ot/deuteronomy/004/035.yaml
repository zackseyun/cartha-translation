  text: אַתָּה֙ הָרְאֵ֣תָ לָ/דַ֔עַת כִּ֥י יְהוָ֖ה ה֣וּא הָ/אֱלֹהִ֑ים אֵ֥ין ע֖וֹד מִ/לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/035.yaml
  text: You were shown these things so that you might know that Yahweh[a], he is God[b]; there is no other besides him.
translation:
  language: sw
  text: Wewe ulionyeshwa[a] mambo hayo ili ujue kwamba Yahwe ndiye Mungu[b]; hakuna mwingine ila yeye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umeonyeshwa”; kauli ya Kiebrania ni ya kutendwa na inaonyesha kwamba Israeli alifanywa aone mambo hayo.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kina msisitizo: “Yahwe, yeye ndiye Mungu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְאֵתָ
  choice: ulionyeshwa
  rationale: 'Kauli ya Hophal ina maana ya kutendwa yenye mwelekeo wa kisababishi: mhusika alifanywa aone, yaani alionyeshwa, si kwamba aliona kwa juhudi yake mwenyewe.'
- source_word: לָדַעַת
  choice: ili ujue
  rationale: Infinitivu yenye ל inaonyesha kusudi au matokeo yaliyokusudiwa; “ili ujue” ni Kiswahili cha kawaida kinachohifadhi nguvu hiyo.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי inaanzisha maudhui ya kile kinachopaswa kujulikana, wala si sababu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetafsiriwa kwa namna ya kulitamka kama jina binafsi, badala ya kubadilishwa kuwa cheo.
- source_word: הוּא
  choice: ndiye
  rationale: Kiwakilishi huru cha Kiebrania kinasisitiza utambulisho. “Ndiye” huwasilisha msisitizo huo kwa Kiswahili cha asili bila kuongeza neno “peke yake,” ambalo wazo lake linaelezwa katika kishazi kinachofuata.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Katika nafasi ya kiarifu, “Mungu” ni tafsiri ya kawaida na ya asili; kutafsiri kibainishi kwa neno tofauti kungezalisha Kiswahili kisicho cha kawaida.
- source_word: אֵין עוֹד
  choice: hakuna mwingine
  rationale: Nahau hii inakanusha kuwepo kwa mungu mwingine. Kauli hii ni wazi, ya sasa, na inadumisha madai ya upekee.
- source_word: מִלְבַדּוֹ
  choice: ila yeye
  rationale: Kirai hiki huonyesha kutengwa au kutokuwapo kwa mwingine isipokuwa yeye; “ila yeye” ni kifupi na cha kawaida katika muktadha huu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina binafsi la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya dai la upekee wa Mungu
  choice: hakuna mwingine ila yeye
  alternative: hakuna mwingine zaidi yake
  rationale: Tafsiri inadumisha dai la wazi kwamba hakuna Mungu mwingine, bila kulipanua kuwa maelezo ya kifalsafa ambayo hayajasemwa moja kwa moja katika mstari.
- issue: Msisitizo wa kiwakilishi הוּא
  choice: Yahwe ndiye Mungu
  alternative: Yahwe, yeye ni Mungu
  rationale: “Ndiye” ni muundo wa asili wa Kiswahili unaosisitiza utambulisho kama kiwakilishi huru cha Kiebrania, bila kurudia kiwakilishi kwa namna nzito.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Ulionyeshwa” huhifadhi tukio la wakati uliopita; “ndiye” huleta msisitizo wa Kiebrania kwa mtiririko wa kawaida wa Kiswahili.
