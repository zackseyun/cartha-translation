base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/015.yaml
  text: So watch yourselves very carefully[b][a], since you saw no form on the day Yahweh spoke to you at Horeb from the midst of the fire.
translation:
  language: sw
  text: Basi jihadharini sana[a], kwa kuwa hamkuona umbo lolote[b] siku ile Yahwe alipowaambia huko Horebu kutoka katikati ya moto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “jilindeni sana kwa ajili ya nafsi zenu”; hii ni nahau yenye maana ya kuwa waangalifu mno.
    reason: lexical_alternative
  - marker: b
    text: Au “mfano wowote” au “taswira yoyote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם מְאֹד לְנַפְשֹׁתֵיכֶם
  choice: Basi jihadharini sana
  rationale: Kirai hiki ni nahau ya Kiebrania inayosisitiza kujilinda au kuwa waangalifu sana. “Jihadharini sana” ni Kiswahili cha kawaida chenye nguvu ya onyo, bila kufanya נֶפֶשׁ kuwa kauli maalumu kuhusu nafsi tofauti na mwili.
- source_word: כִּי
  choice: kwa kuwa
  rationale: Hapa kiunganishi hiki kinatoa sababu ya onyo lililotangulia. “Kwa kuwa” huonyesha uhusiano huo wa kisababu kwa uwazi.
- source_word: לֹא רְאִיתֶם כָּל תְּמוּנָה
  choice: hamkuona umbo lolote
  rationale: תְּמוּנָה inaweza kumaanisha umbo, mfano, au taswira inayoonekana. “Umbo” linafaa katika muktadha huu kwa sababu Israeli hawakuona sura ya kuonekana ambayo wangeweza kuiwakilisha kwa sanamu.
- source_word: בְּיוֹם
  choice: siku ile
  rationale: Tafsiri hii inadumisha usemi wa wakati wa Kiebrania na kurejelea kwa kawaida siku ya tukio maalumu huko Horebu.
- source_word: דִּבֶּר יְהוָה אֲלֵיכֶם
  choice: Yahwe aliposema nanyi
  rationale: Hii inawasilisha tendo la Yahwe kuzungumza na watu kwa Kiswahili cha kawaida. “Nanyi” hapa haimaanishi lazima mazungumzo ya pande mbili, bali kwamba maneno yake yaliwaelekea wao.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: בְּחֹרֵב
  choice: huko Horebu
  rationale: “Huko Horebu” ni usemi wa kawaida wa Kiswahili unaoonyesha mahali tukio lilipotokea.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: kutoka katikati ya moto
  rationale: Tafsiri hii inadumisha picha mahsusi ya sauti kutoka ndani, au katikati, ya moto badala ya kurahisisha kuwa “kutoka motoni” pekee.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika לְנַפְשֹׁתֵיכֶם
  choice: 'Nahau ya kujirejelea: “jihadharini sana”'
  alternative: “zilindeni nafsi zenu sana”
  rationale: Katika kirai hiki נֶפֶשׁ ni sehemu ya nahau ya kujilinda kwa uangalifu, si lazima fundisho kuhusu nafsi kama sehemu tofauti na mwili. Tafsiri ya nahau huepuka kuingiza dai la kianthropolojia lisilosisitizwa na aya.
- issue: Maana ya תְּמוּנָה katika tukio la Horebu
  choice: “umbo”
  alternative: “mfano” au “taswira”
  rationale: Aya inasisitiza kwamba watu hawakuona uwakilishi wowote unaoonekana wa Yahwe. “Umbo” huhifadhi maana hiyo bila kulifanya neno lenyewe limaanishe sanamu iliyotengenezwa, jambo linalofafanuliwa zaidi katika mistari inayofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Jihadharini sana” ni onyo la moja kwa moja linaloeleweka kwa urahisi; “umbo” huhifadhi upana wa neno la Kiebrania. Jina “Yahwe” limetumiwa kwa uthabiti kama jina binafsi.
