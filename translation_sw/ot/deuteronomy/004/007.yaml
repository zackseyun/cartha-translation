id: DEU.4.7
reference: Deuteronomy 4:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֚י מִי ג֣וֹי גָּד֔וֹל אֲשֶׁר ל֥/וֹ אֱלֹהִ֖ים קְרֹבִ֣ים אֵלָ֑י/ו כַּ/יהוָ֣ה אֱלֹהֵ֔י/נוּ בְּ/כָּל קָרְאֵ֖/נוּ אֵלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/007.yaml
  text: For what great nation is there that has gods so near to it as Yahweh our God is to us whenever we call on him?[a][b]
translation:
  language: sw
  text: Kwa maana, ni taifa gani kubwa ambalo lina miungu iliyo karibu nalo kama Yahwe Mungu wetu alivyo karibu nasi kila tunapomwita?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “miungu.” Aya hii inalinganisha kwa njia ya balagha miungu ya mataifa mengine na Yahwe, Mungu wa Israeli.'
    reason: lexical_alternative
  - marker: b
    text: Au, “kila tunapomwomba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza hoja ya muktadha kwa kutoa sababu au maelezo, kwa lugha ya kawaida ya Kiswahili.
- source_word: מִי גוֹי גָּדוֹל
  choice: ni taifa gani kubwa
  rationale: Inahifadhi swali la balagha la Kiebrania kwa muundo wa asili wa Kiswahili.
- source_word: אֲשֶׁר לוֹ
  choice: ambalo lina
  rationale: Ni tafsiri ya kawaida ya Kiswahili ya muundo wa Kiebrania unaoonyesha kuwa kitu kinahusishwa na taifa au ni chake.
- source_word: אֱלֹהִים
  choice: miungu
  rationale: Kivumishi cha wingi קְרֹבִים na ulinganisho na Yahwe Mungu wa Israeli vinaunga mkono maana ya wingi inayorejelea miungu ya mataifa.
- source_word: קְרֹבִים אֵלָיו
  choice: iliyo karibu nalo
  rationale: Neno 'miungu' ni la ngeli ya 4 katika Kiswahili, hivyo 'iliyo'; kiwakilishi 'nalo' kinarejelea taifa.
- source_word: כַּיהוָה אֱלֹהֵינוּ
  choice: kama Yahwe Mungu wetu alivyo karibu nasi
  rationale: Muundo huu unaweka wazi kipimo cha ulinganisho kilichodokezwa katika Kiebrania na kutoa Kiswahili cha asili bila kubadili maana.
- source_word: בְּכָל קָרְאֵנוּ אֵלָיו
  choice: kila tunapomwita
  rationale: Inaonyesha tukio linalorudiwa—wakati wowote tunapomwomba au kumwita—kwa usemi mfupi na wa kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yanatumia jina la agano יהוה; 'Yahwe' hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya אֱלֹהִים katika kishazi cha kwanza
  choice: miungu ya mataifa kwa maana ya wingi
  alternative: Mungu / viumbe vya kimungu
  rationale: Kivumishi cha wingi קְרֹבִים na ulinganisho na Yahwe Mungu wa Israeli vinaelekeza kwenye miungu ya mataifa, bila kuthibitisha kwa lazima kwamba miungu hiyo ipo kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Swali la balagha na ulinganisho wa maandishi ya Kiebrania vimehifadhiwa; maneno ya kiunganishi yameongezwa tu pale yanapohitajika kwa mtiririko wa kawaida wa Kiswahili.
