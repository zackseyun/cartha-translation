translation:
  language: sw
  text: Hizi ndizo shuhuda, sheria na hukumu ambazo Mose aliwaambia Waisraeli walipotoka Misri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Haya ndiyo
  rationale: Kiwakilishi cha kuonyesha cha wingi kinaanzisha aina za sheria zinazofuata; ‘ndiyo’ hukamilisha kishazi kisicho na kitenzi kwa Kiswahili cha kawaida.
- source_word: הָעֵדֹת
  choice: masharti ya agano
  rationale: Katika muktadha huu wa kisheria, neno hili linataja masharti yenye ushuhuda ndani ya agano. Tafsiri ya moja kwa moja ‘shuhuda’ si ya kawaida kwa maana hii katika Kiswahili, hivyo ‘masharti ya agano’ huwasilisha dhana kwa uwazi.
- source_word: הַחֻקִּים
  choice: sheria
  rationale: Neno hili linamaanisha maagizo au masharti yaliyowekwa; ‘sheria’ ni neno la kawaida, lenye hadhi na linalofaa katika muktadha wa kisheria.
- source_word: הַמִּשְׁפָּטִים
  choice: hukumu
  rationale: ‘Hukumu’ huhifadhi maana ya maamuzi au kanuni za kisheria na kuitofautisha kadiri iwezekanavyo na חֻקִּים.
- source_word: אֲשֶׁר דִּבֶּר
  choice: ambazo Mose aliwaambia
  rationale: Kitenzi דבר hapa kinaeleza kusema. ‘Aliwaambia’ ni Kiswahili cha asili na huonyesha kwa uwazi kwamba maneno hayo yalielekezwa kwa Waisraeli.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa Kiebrania kinasema kihalisi ‘wana wa Israeli,’ katika matumizi haya jina hilo linamaanisha taifa lote; ‘Waisraeli’ ni la asili na jumuishi katika Kiswahili.
- source_word: בְּצֵאתָם
  choice: walipotoka
  rationale: Muundo wa kihusishi pamoja na kitenzi-jina una maana ya wakati; ‘walipotoka’ huiwasilisha kwa ufupi na kwa kawaida.
- source_word: מִמִּצְרָיִם
  choice: Misri
  rationale: Baada ya ‘walipotoka,’ jina ‘Misri’ kwa kawaida hubeba maana ya kutoka mahali hapo bila kuhitaji kurudia kihusishi.
