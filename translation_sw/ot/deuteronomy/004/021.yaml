  text: וַֽ/יהוָ֥ה הִתְאַנֶּף בִּ֖/י עַל דִּבְרֵי/כֶ֑ם וַ/יִּשָּׁבַ֗ע לְ/בִלְתִּ֤י עָבְרִ/י֙ אֶת הַ/יַּרְדֵּ֔ן וּ/לְ/בִלְתִּי בֹא֙ אֶל הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/021.yaml
  text: And Yahweh was angry with me because of you[a], and he swore that I would not cross the Jordan and that I would not enter the good land that Yahweh your God is giving you as an inheritance.
translation:
  language: sw
  text: Naye Yahwe alinikasirikia kwa sababu ya maneno yenu[a], akaapa kwamba sitavuka Yordani wala sitaingia katika nchi nzuri ambayo Yahwe Mungu wako anakupa kuwa urithi wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu yenu.” Kiebrania kinasema kihalisi, “kwa sababu ya maneno yenu.”
    reason: Inaonyesha tafsiri ya kimuktadha inayowezekana ya עַל דִּבְרֵיכֶם huku tafsiri kuu ikihifadhi maneno ya chanzo.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina binafsi la Mungu lililoandikwa katika maandishi ya Kiebrania, kwa tahajia ya kawaida ya Kiswahili.
- source_word: הִתְאַנֶּף בִּי
  choice: alinikasirikia
  rationale: Kitenzi hiki huonyesha hasira kali; ‘alinikasirikia’ ni Kiswahili cha kawaida na chenye heshima bila kuongeza uzito usio lazima.
- source_word: עַל דִּבְרֵיכֶם
  choice: kwa sababu ya maneno yenu
  rationale: Linahifadhi nomino ya Kiebrania דְּבָרִים, ‘maneno/mambo,’ na kiambishi cha wingi ‘yenu’; tanbihi inaonyesha tafsiri ya kimuktadha inayowezekana.
- source_word: וַיִּשָּׁבַע
  choice: akaapa
  rationale: Ni tafsiri fupi na ya moja kwa moja ya tendo la kula kiapo katika mfululizo wa simulizi.
- source_word: לְבִלְתִּי עָבְרִי אֶת הַיַּרְדֵּן
  choice: kwamba sitavuka Yordani
  rationale: 'Muundo wa Kiswahili unaonyesha wazi yaliyomo katika kiapo: Musa hatavuka mto Yordani.'
- source_word: וּלְבִלְתִּי בֹא
  choice: wala sitaingia
  rationale: ‘Wala’ huunganisha kwa kawaida vipengele viwili hasi vinavyolingana, na ‘kuingia’ linafaa kwa בוא pamoja na nchi.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: nchi nzuri
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi tathmini ya nchi bila kuibana kuwa yenye rutuba au yenye kupendeza tu.
- source_word: נֹתֵן לְךָ
  choice: anakupa
  rationale: Wakati wa sasa wa Kiswahili unafaa kwa participio ya Kiebrania na unaonyesha utoaji wa Mungu unaoendelea au ulio karibu kutimizwa.
- source_word: נַחֲלָה
  choice: kuwa urithi wako
  rationale: ‘Urithi’ huhifadhi wazo la sehemu au milki iliyotolewa kwa agano; muundo huu ni wa asili katika Kiswahili.
theological_decisions:
- issue: Kuhusishwa kwa kutoruhusiwa kwa Musa kuingia nchini na maneno au mwenendo wa Israeli
  choice: kwa sababu ya maneno yenu
  alternative: kwa sababu yenu
  rationale: Maandishi yanataja kihalisi ‘maneno yenu.’ Tafsiri kuu inahifadhi kipengele hicho, huku tanbihi ikionyesha maana pana ya kimuktadha bila kuamua kimya-kimya suala la lawama.
- issue: Jina la Mungu katika tetragramatoni
  choice: Yahwe
  alternative: BWANA
  rationale: Kutumia ‘Yahwe’ hutofautisha jina binafsi lililopo katika chanzo na cheo ‘Bwana,’ bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Naye … akaapa’ hudumisha mtiririko wa simulizi; ‘wala’ huonyesha ulinganifu wa vikanushi viwili. ‘Mungu wako’ na ‘anakupa’ huhifadhi umoja wa kisarufi wa Kiebrania unaoielekeza Israeli kama jumuiya moja.
