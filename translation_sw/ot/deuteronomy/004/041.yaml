lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Kielezi hiki kinaunganisha kitendo kinachofuata na mfululizo wa simulizi kwa Kiswahili cha asili na kwa ufupi.
- source_word: יַבְדִּיל
  choice: akatenga
  rationale: Kauli ya Hiphil ya בדל ina maana ya kuweka kando kwa kusudi maalumu; “akatenga” ni ya kawaida na haiongezi maelezo yasiyosemwa wazi katika aya.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: שָׁלֹשׁ עָרִים
  choice: miji mitatu
  rationale: Tafsiri ya moja kwa moja ya muundo wa namba na nomino, kwa kufuata upatanisho wa ngeli wa Kiswahili.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: upande wa pili wa Yordani
  rationale: Ni nahau ya kijiografia inayomaanisha eneo lililo ng’ambo ya Yordani; uchaguzi huu ni wa asili katika Kiswahili huku ukihifadhi mtazamo wa mahali bila kuubainisha kupita kiasi.
- source_word: מִזְרְחָה שָׁמֶשׁ
  choice: kuelekea mawio ya jua
  rationale: Unahifadhi taswira halisi ya Kiebrania ya kuelekea mahali jua linapochomoza, huku ukiendelea kueleweka kwa wasomaji wa sasa.
