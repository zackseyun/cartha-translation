base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/013.yaml
  text: And he declared to you his covenant[a], which he commanded you to do, the Ten Words; and he wrote them on two tablets of stone.
translation:
  language: sw
  text: Naye akawatangazia agano lake, ambalo aliwaamuru mlitekeleze, yaani, Maneno Kumi[a]; naye akayaandika juu ya vibao viwili vya mawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Maneno Kumi”; kwa mapokeo, “Amri Kumi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: akawatangazia
  rationale: Kitenzi נגד katika Hifili humaanisha kufanya jambo lijulikane au kulitangaza. “Akawatangazia” kinadumisha uzito wa tangazo la agano na ni Kiswahili cha kawaida.
- source_word: בְּרִיתוֹ
  choice: agano lake
  rationale: “Agano” ni istilahi sanifu ya Kiswahili kwa בְּרִית na hudumisha maana ya uhusiano wenye masharti na wajibu.
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם לַעֲשׂוֹת
  choice: ambalo aliwaamuru mlitekeleze
  rationale: “Mlitekeleze” huwasilisha kwa Kiswahili cha asili wajibu wa kufanya yale yaliyoamriwa katika agano. Kiwakilishi cha ngeli ya “agano” huonyesha uhusiano wa kishazi bila kuongeza wazo la kipekee lisilokuwapo katika muktadha.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: Maneno Kumi
  rationale: Hili ndilo jina la moja kwa moja katika Kiebrania, kihalisi “maneno kumi.” Tafsiri ya kimapokeo “Amri Kumi” imewekwa katika tanbihi.
- source_word: וַיִּכְתְּבֵם
  choice: naye akayaandika
  rationale: כתב ni kitenzi cha kawaida cha kuandika. “Akayaandika” ni tafsiri ya moja kwa moja, huku kiambishi “-ya-” kikirejelea Maneno Kumi.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: vibao viwili vya mawe
  rationale: Kirai hiki kinaeleza vibao vilivyotengenezwa kwa mawe. “Vibao viwili vya mawe” ni cha kawaida, wazi, na chenye hadhi katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya עֲשֶׂרֶת הַדְּבָרִים
  choice: Maneno Kumi
  alternative: Amri Kumi
  rationale: Matini ya Kiebrania yenyewe huyaita masharti haya “Maneno Kumi.” Tafsiri hii inapewa nafasi katika matini kuu, huku jina la kimapokeo na linalofahamika zaidi, “Amri Kumi,” likihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa sasa na hadhi ya simulizi la agano. “Yaaani” linaweka wazi kwamba “Maneno Kumi” yanafafanua agano lililotajwa, bila kuondoa uhusiano wa kisarufi wa matini chanzi.
