  yaml_path: translation/ot/deuteronomy/008/013.yaml
  text: and your herds and your flocks multiply[a], and silver and gold increase for you[b], and all that is yours increases—
translation:
  language: sw
  text: na ng’ombe wako, kondoo wako na mbuzi wako watakapoongezeka, na fedha na dhahabu zitakapoongezeka kwako, na kila ulicho nacho kitakapoongezeka—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְקָרְךָ
  choice: na ng’ombe wako
  rationale: בקר ni jina la jumla la mifugo ya jamii ya ng’ombe; “ng’ombe” ni neno la kawaida na sahihi katika Kiswahili.
- source_word: וְצֹאנְךָ
  choice: kondoo wako na mbuzi wako
  rationale: צאן humaanisha kwa pamoja mifugo midogo, hasa kondoo na mbuzi. Kuwataja wote wawili huwasilisha maana yake wazi katika Kiswahili cha kawaida.
- source_word: יִרְבְּיוּן
  choice: watakapoongezeka
  rationale: Kitenzi רבה kinaonyesha kuongezeka kwa idadi. Umbo la wakati wa kutarajiwa linaendeleza mfululizo wa hali katika muktadha wa aya, huku upatanisho wa ngeli ukirejelea mifugo iliyotajwa.
- source_word: וְכֶסֶף וְזָהָב יִרְבֶּה לָּךְ
  choice: na fedha na dhahabu zitakapoongezeka kwako
  rationale: Tafsiri hii inadumisha majina “fedha na dhahabu,” wazo la kuongezeka, na kishazi cha Kiebrania לָךְ (“kwako”) bila kuongeza kimyakimya kiwakilishi cha umilikaji.
- source_word: וְכֹל אֲשֶׁר לְךָ יִרְבֶּה
  choice: na kila ulicho nacho kitakapoongezeka
  rationale: “Kila ulicho nacho” ni Kiswahili cha asili kinachowasilisha jumla ya vitu vilivyo mali ya mhusika.
