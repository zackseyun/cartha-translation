  text: וְ/הָיָ֗ה אִם שָׁכֹ֤חַ תִּשְׁכַּח֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הָֽלַכְתָּ֗ אַחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/עֲבַדְתָּ֖/ם וְ/הִשְׁתַּחֲוִ֣יתָ לָ/הֶ֑ם הַעִדֹ֤תִי בָ/כֶם֙ הַ/יּ֔וֹם כִּ֥י אָבֹ֖ד תֹּאבֵדֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/019.yaml
  text: And if you indeed forget Yahweh your God and go after other gods and serve them and bow down to them[a], I testify against you today that you will surely perish.
translation:
  language: sw
  text: Na itakuwa kwamba ukimsahau kabisa[a] Yahwe, Mungu wako, ukafuata miungu mingine, ukazitumikia na kuzisujudia, ninashuhudia dhidi yenu leo kwamba hakika mtaangamia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa Kiebrania, kihalisi: “kusahau, utasahau”—muundo wa kusisitiza unaomaanisha “ukimsahau kabisa” au “ukimsahau hakika.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Na itakuwa kwamba
  rationale: Huhifadhi utangulizi wa sharti na mtiririko wa onyo, huku ukibaki katika Kiswahili cha kawaida.
- source_word: שָׁכֹחַ תִּשְׁכַּח
  choice: ukimsahau kabisa
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichopinda unasisitiza tendo la kusahau; “kabisa” huonyesha msisitizo huo bila kuongeza sababu au namna ya kusahau.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina la agano lililo katika maandishi ya Kiebrania, kwa umbo linalotamkika kwa kawaida katika Kiswahili.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huhifadhi umilikaji wa nafsi ya pili umoja na uhusiano wa agano katika hotuba kwa Israeli.
- source_word: וְהָלַכְתָּ אַחֲרֵי
  choice: ukaifuata
  rationale: Ni usemi wa asili wa Kiswahili unaoeleza kufuata kwa utii au uaminifu, bila kulazimisha sitiari ya kutembea.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Hutafsiri moja kwa moja maana ya “mingine” bila kuifanya kwa lazima kuwa miungu ya kigeni.
- source_word: וַעֲבַדְתָּם
  choice: ukaitumikia
  rationale: “Kutumikia” huhifadhi maana ya עבד na kuitofautisha na tendo linalofuata la kusujudu.
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: na kuisujudia
  rationale: Huonyesha kujishusha au kuinama kwa heshima ya ibada, huku ikihifadhi tofauti na “kutumikia.”
- source_word: הַעִדֹתִי בָכֶם הַיּוֹם
  choice: ninashuhudia dhidi yenu leo
  rationale: Huhifadhi nguvu ya kisheria ya kutoa ushahidi dhidi ya wasikilizaji; “ninawaonya” pekee ingedhoofisha taswira ya ushahidi.
- source_word: כִּי אָבֹד תֹּאבֵדוּן
  choice: kwamba hakika mtaangamia
  rationale: “Hakika” huwasilisha msisitizo na uhakika wa muundo wa kitenzi-jina pamoja na kitenzi; “kuangamia” huhifadhi maana ya matokeo bila kulazimisha hali ya kutendwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano YHWH. “Yahwe” hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo, na ni umbo linalofaa mfumo wa matamshi ya Kiswahili.
- issue: Mabadiliko kutoka nafsi ya pili umoja kwenda wingi
  choice: “ukimsahau … ukaifuata … ukaitumikia … kuisujudia,” kisha “dhidi yenu … mtaangamia”
  alternative: Kutumia umoja au wingi kwa mstari wote
  rationale: Kiebrania hubadilika kwa makusudi kutoka kumwambia Israeli kama mtu mmoja hadi kulihutubia kundi kwa wingi. Tafsiri inalinda mabadiliko hayo bila kuyasawazisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi uzito wa onyo la agano, tofauti kati ya kutumikia na kusujudu, pamoja na mabadiliko ya Kiebrania kutoka umoja kwenda wingi.
