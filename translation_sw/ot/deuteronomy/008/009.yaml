  yaml_path: translation/ot/deuteronomy/008/009.yaml
  text: a land in which you will not eat bread in poverty[a], in which you will lack nothing; a land whose stones are iron[b], and from whose hills you will quarry copper.
translation:
  language: sw
  text: nchi ambamo hutakula mkate katika umaskini[a], ambamo hutapungukiwa na chochote ndani yake; nchi ambayo mawe yake ni chuma, na kutoka milima yake utachimba shaba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika uhitaji” au “katika hali ya kukosa.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza kumaanisha shaba (copper) au shaba ya bati (bronze); hapa “shaba” inapendelewa kwa sababu kifungu kinazungumzia madini yanayotolewa milimani.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְמִסְכֵּנֻת
  choice: kwa umaskini
  rationale: Nomino hii ina maana ya umaskini, uhitaji au hali ya kukosa. “Kwa umaskini” huhifadhi wazo la kula mkate katika mazingira ya ufukara bila kurudia moja kwa moja kishazi kinachofuata kuhusu kutopungukiwa.
- source_word: לֶחֶם
  choice: mkate
  rationale: Maana ya msingi ni “mkate.” Neno halisi limehifadhiwa, ingawa katika muktadha linaweza kuwakilisha chakula kwa ujumla.
- source_word: תֶחְסַר כֹּל
  choice: hutapungukiwa na kitu chochote
  rationale: Hii ni kauli ya utoshelevu kamili. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha nguvu ya כֹּל, yaani kutokosa chochote.
- source_word: אֲבָנֶיהָ בַרְזֶל
  choice: mawe yake ni chuma
  rationale: 'Kiebrania ni kifupi na cha picha: “mawe yake [ni] chuma.” Muundo huo umehifadhiwa badala ya kufafanua kimya kimya kuwa mawe yana madini ya chuma.'
- source_word: תַּחְצֹב
  choice: utachimba
  rationale: Kitenzi humaanisha kuchonga, kupasua au kuchimba ili kutoa mawe au madini. “Utachimba” ni wazi na ya kawaida katika Kiswahili kwa utoaji wa madini kutoka vilimani.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: Neno la Kiebrania linaweza kumaanisha copper au bronze. Kwa kuwa hapa ni malighafi inayotolewa vilimani, shaba ya asili (copper) ndiyo maana inayofaa zaidi kuliko aloi ya bronze.
