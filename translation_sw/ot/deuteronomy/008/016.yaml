base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/016.yaml
  text: who fed you manna in the wilderness[a], which your fathers had not known, in order to humble you and in order to test you[b], to do you good in the end.
translation:
  language: sw
  text: aliyekulisha mana jangwani, ambayo baba zako hawakuwa wameijua, ili akunyenyekeze na ili akujaribu, akutendee mema mwishoni mwako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hatimaye” au “katika hatima yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּאֲכִלְךָ
  choice: aliyekulisha
  rationale: Kirai cha uhusiano kinaendeleza maelezo ya Mungu kutoka mstari uliotangulia na kwa Kiswahili cha kawaida huwasilisha vizuri kausativi ya ‘kukufanya ule/kukulisha.’
- source_word: מָן
  choice: mana
  rationale: Hili ndilo jina la kibiblia lililozoeleka kwa chakula cha jangwani na linaakisi neno la Kiebrania moja kwa moja.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: ‘Jangwani’ ni tafsiri ya kawaida na ya asili kwa eneo lisilokaliwa la simulizi la safari ya Israeli.
- source_word: אֲשֶׁר לֹא יָדְעוּן אֲבֹתֶיךָ
  choice: ambayo baba zako hawakuwa wameijua
  rationale: Kirai hiki kinarejelea mana na wakati timilifu unaonyesha kwamba kizazi cha awali hakikuwa kimeifahamu.
- source_word: אֲבֹתֶיךָ
  choice: baba zako
  rationale: Huhifadhi umbo la kiume la Kiebrania; katika muktadha linaweza pia kumaanisha mababu.
- source_word: לְמַעַן
  choice: ili
  rationale: Huonyesha kusudi kwa ufupi na kwa Kiswahili cha asili; kurudiwa kwake kunahifadhi madhumuni mawili yanayolingana.
- source_word: עַנֹּתְךָ
  choice: akunyenyekeze
  rationale: Katika muktadha wa Kumbukumbu la Torati 8, maana kuu ni kumfanya mtu awe mnyenyekevu kupitia shida, bila kuondoa uzito wa uzoefu huo.
- source_word: נַסֹּתֶךָ
  choice: akujaribu
  rationale: ‘Kujaribu’ ni kitenzi cha kawaida kinachowasilisha wazo la kupima au kuthibitisha tabia.
- source_word: לְהֵיטִבְךָ
  choice: akufanyie mema
  rationale: Huhifadhi wazo la Mungu kumtendea mhusika mema na nguvu ya kiambishi cha nafsi ya pili.
- source_word: בְּאַחֲרִיתֶךָ
  choice: hatimaye
  rationale: Kwa Kiswahili cha kawaida hueleza matokeo ya baadaye au ya mwisho; maana ya ‘mwishoni mwako’ imehifadhiwa katika tanbihi kwa sababu neno lina kiambishi cha nafsi ya pili.
theological_decisions:
- issue: Kusudi la shida za jangwani
  choice: Kulishwa, kunyenyekezwa, na kujaribiwa vinaelezwa kuwa sehemu ya kusudi ambalo mwisho wake ni Mungu kumtendea Israeli mema.
  alternative: Kunyenyekezwa na kujaribiwa kungeweza kueleweka kuwa adhabu tupu.
  rationale: Vishazi viwili vya kusudi vinaishia katika לְהֵיטִבְךָ בְּאַחֲרִיתֶךָ; kwa hiyo tafsiri inadumisha mvutano kati ya ukali wa kunyenyekezwa na kujaribiwa na lengo la wema.
- issue: Maana ya אַחֲרִיתֶךָ
  choice: hatimaye
  alternative: mwishoni mwako / katika mwisho wako
  rationale: Neno linaweza kuonyesha wakati wa baadaye, matokeo ya mwisho, au mwisho wa mhusika. Maandishi makuu yanatumia Kiswahili cha asili, huku tanbihi ikihifadhi upana wa maana na kiambishi cha nafsi ya pili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa mstari unaendelea kutoka mstari uliotangulia. ‘Baba zako’ limehifadhiwa kwa ukaribu na Kiebrania badala ya kulipanua kimya kimya kuwa ‘mababu zako.’
