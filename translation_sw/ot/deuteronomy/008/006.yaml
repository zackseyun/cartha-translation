  text: וְ/שָׁ֣מַרְתָּ֔ אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ לָ/לֶ֥כֶת בִּ/דְרָכָ֖י/ו וּ/לְ/יִרְאָ֥ה אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/006.yaml
  text: So you shall keep the commandments of Yahweh your God[b][a], by walking in his ways and by fearing him.
translation:
  language: sw
  text: Kwa hiyo[a], utazishika amri za Yahweh Mungu wako kwa kutembea katika njia zake na kwa kumcha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nawe utazishika”; kiunganishi cha Kiebrania kinaweza kuonyesha uratibu wa kawaida, ingawa hapa huenda kinaonyesha hitimisho kutokana na yaliyotangulia.
    reason: lexical_alternative
  - marker: b
    text: “Kumcha” hapa ni kuwa na hofu yenye heshima mbele za Mungu; pia inaweza kutafsiriwa “kumwogopa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Kwa hiyo, utazishika
  rationale: Kitenzi שׁמר katika muktadha wa agano humaanisha kushika au kutii amri. Kiunganishi וְ kimetafsiriwa kwa maana ya hitimisho linalotokana na muktadha uliotangulia, huku uwezekano wa uratibu rahisi ukihifadhiwa katika tanbihi.
- source_word: מִצְוֺת
  choice: amri
  rationale: Nomino hii ya wingi inataja maagizo yenye wajibu wa kiagano. “Amri” ni neno la kawaida, lenye uzito unaofaa wa kisheria na kiagano.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahweh” badala ya kubadilishwa na cheo, ili kuhifadhi jina la binafsi lililo katika maandishi ya Kiebrania.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: 'Muundo huu wenye kiambishi cha nafsi ya pili umoja una maana ya moja kwa moja ya umilikaji: “Mungu wako.”'
- source_word: לָלֶכֶת
  choice: kwa kutembea
  rationale: Kitenzi-jina kinaonyesha namna ambayo kushika amri kunatekelezwa. “Kwa kutembea” huonyesha uhusiano huo wazi na kuhifadhi sitiari ya Kiebrania.
- source_word: בִּדְרָכָיו
  choice: katika njia zake
  rationale: דֶּרֶךְ hapa ni sitiari ya mwenendo au maisha yanayopatana na mapenzi ya Mungu. “Katika njia zake” huhifadhi picha hiyo kwa Kiswahili kinachoeleweka.
- source_word: וּלְיִרְאָה אֹתוֹ
  choice: na kwa kumcha
  rationale: Kumcha Mungu hujumuisha hofu yenye heshima na uaminifu wa kiagano. “Kumcha” ni usemi wa asili wa Kiswahili unaohifadhi uzito wa hofu bila kuupunguza kuwa heshima tu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יהוה. “Yahweh” huhifadhi jina hilo badala ya kuweka cheo mahali pake.
- issue: Maana ya lugha ya kumhofu Mungu
  choice: kumcha
  alternative: kumwogopa
  rationale: “Kumcha” katika Kiswahili hubeba hofu iliyoambatana na heshima, inayofaa katika muktadha huu wa agano. Hivyo haipunguzi ירא kuwa heshima tu, wala hailazimishi maana ya hofu ya adhabu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa nafsi ya pili umoja umehifadhiwa, na sitiari ya kutembea katika njia za Mungu imeachwa wazi bila kufafanuliwa kupita maandishi.
