  text: כָּל הַ/מִּצְוָ֗ה אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם תִּשְׁמְר֣וּ/ן לַ/עֲשׂ֑וֹת לְמַ֨עַן תִּֽחְי֜וּ/ן וּ/רְבִיתֶ֗ם וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁר נִשְׁבַּ֥ע יְהוָ֖ה לַ/אֲבֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/001.yaml
  text: You shall carefully keep every commandment that I am commanding you today[c][b][a], so that you may live and multiply and enter and possess the land that Yahweh swore to your fathers.
translation:
  language: sw
  text: Muwe waangalifu kushika na kutekeleza kila amri ninayokuamuru leo[a], ili mpate kuishi na kuongezeka, na kuingia na kuimiliki[b] nchi ambayo Yahweh aliapa kuwapa baba zenu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amri yote.” Kiebrania hutumia nomino ya umoja yenye maana ya kijumla.
    reason: lexical_alternative
  - marker: b
    text: Au, “kuirithi.” Kitenzi cha Kiebrania kinaweza kumaanisha kurithi au kutwaa na kumiliki, kutegemea muktadha.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania, “baba zenu,” yaani mababu wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַמִּצְוָה
  choice: kila amri
  rationale: Umoja wa Kiebrania una maana ya kijumla; “kila amri” ni Kiswahili cha kawaida kinachoonyesha jumla ya maagizo, huku tanbihi ikihifadhi uwezekano wa “amri yote.”
- source_word: מְצַוְּךָ
  choice: ninayokuamuru
  rationale: Umbo la participle linaonyesha tendo la sasa au linaloendelea. Kiwakilishi cha Kiebrania ni umoja, kikielekezwa kwa Israeli kama jumuiya; Kiswahili pia huhifadhi umoja huo ndani ya kishazi hiki.
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: muwe waangalifu kutekeleza
  rationale: Muungano wa “kutunza” na “kufanya” unaeleza uangalifu unaozaa utiifu wa vitendo. Tafsiri hii ni ya asili na inaepuka muundo mgumu wa neno kwa neno.
- source_word: לְמַעַן
  choice: ili
  rationale: “Ili” huonyesha wazi kusudi au matokeo yaliyokusudiwa.
- source_word: תִּחְיוּן
  choice: mpate kuishi
  rationale: Hutoa maana ya moja kwa moja ya kuishi au kubaki hai katika muktadha wa agano.
- source_word: וּרְבִיתֶם
  choice: na kuongezeka
  rationale: Kitenzi hapa kinamaanisha kuwa wengi au kuongezeka kwa idadi; “kuongezeka” ni wazi na cha kawaida katika Kiswahili.
- source_word: וּבָאתֶם
  choice: na kuingia
  rationale: Katika muktadha wa nchi iliyoahidiwa, “kuingia” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: וִירִשְׁתֶּם
  choice: na kuimiliki
  rationale: Kitenzi kinaweza kumaanisha kurithi au kutwaa/kumiliki. “Kuimiliki” huonyesha matokeo katika muktadha huu bila kufuta maana mbadala, ambayo imewekwa katika tanbihi.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika Kumbukumbu la Torati neno hili mara nyingi hurejelea nchi iliyoahidiwa; “nchi” ni neno la kawaida na lenye hadhi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina la agano lililo katika matini chanzo.
- source_word: נִשְׁבַּע
  choice: aliwaapia
  rationale: Huhifadhi nguvu ya kiapo cha agano na pia huonyesha wazi wale walioelekezewa kiapo.
- source_word: אֲבֹתֵיכֶם
  choice: baba zenu
  rationale: Huhifadhi neno la jinsia ya kiume lililo katika chanzo, likirejelea mababu wa agano wa Israeli.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Matini ina jina la Mungu moja kwa moja. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya אֲבֹתֵיכֶם
  choice: baba zenu
  alternative: mababu zenu
  rationale: “Baba zenu” hufuata kwa karibu neno la Kiebrania la jinsia ya kiume, huku tanbihi ikifafanua kuwa linaelekea kwa mababu wa Israeli.
- issue: Nguvu ya וִירִשְׁתֶּם
  choice: kuimiliki
  alternative: kuirithi
  rationale: Muktadha unahusisha kuingia katika nchi na kuichukua kuwa milki, lakini maana ya urithi ni halali na imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Wingi umetumiwa katika vitenzi vikuu kwa sababu Musa anaihutubia Israeli kwa pamoja, huku “ninayokuamuru” ikihifadhi mabadiliko ya chanzo kwenda umoja wa kijumuiya. Muundo umetengenezwa kuwa wa kawaida kwa msomaji bila kufuta tofauti za kileksika.
