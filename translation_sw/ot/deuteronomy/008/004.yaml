base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/004.yaml
  text: Your clothing did not wear out on you[a], and your foot did not swell[b], these forty years.
translation:
  language: sw
  text: Vazi lako halikuchakaa mwilini mwako[a], wala mguu wako haukuvimba[b], katika miaka hii arobaini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nguo yako haikuchakaa mwilini mwako.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mguu wako haukuwa na uvimbe”; wengine huelewa kitenzi hiki kwa maana mahususi zaidi ya kutopata malengelenge.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְלָתְךָ
  choice: vazi lako
  rationale: Nomino שִׂמְלָה iko katika umoja na humaanisha vazi au nguo, hasa vazi la nje. “Vazi lako” hudumisha umoja wa Kiebrania na ni Kiswahili cha kawaida na chenye heshima.
- source_word: בָלְתָה
  choice: halikuchakaa
  rationale: Kitenzi בלה hapa kinaeleza vazi kuzeeka au kuharibika kwa kutumiwa. “Kuchakaa” ndilo neno la kawaida na sahihi katika muktadha wa vazi.
- source_word: מֵעָלֶיךָ
  choice: mwilini mwako
  rationale: Kirai hiki kihalisi ni “kutoka juu yako,” lakini katika muktadha kinaonyesha kwamba vazi halikuchakaa likiwa limevaliwa. “Mwilini mwako” huwasilisha maana hiyo kwa Kiswahili cha kawaida bila tafsiri ngumu ya neno kwa neno.
- source_word: וְרַגְלְךָ
  choice: wala mguu wako
  rationale: Kiebrania kina umoja, “mguu wako.” Umoja umehifadhiwa; “wala” huunganisha kwa kawaida vishazi viwili hasi.
- source_word: בָצֵקָה
  choice: haukuvimba
  rationale: Kitenzi hiki hueleweka kwa kawaida kuwa kuvimba. Maana mahususi zaidi ya kupata malengelenge inawezekana, lakini si hakika, hivyo imewekwa katika tanbihi.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: katika miaka hii arobaini
  rationale: Kirai kinadumisha kiashiria זֶה katika usemi wa muda. “Katika miaka hii arobaini” ni wazi na kinabaki karibu na muundo na mkazo wa Kiebrania.
