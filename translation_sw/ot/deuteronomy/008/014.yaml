base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/014.yaml
  text: then your heart is lifted up[a], and you forget Yahweh your God, who brought you from the land of Egypt, from the house of servants.
translation:
  language: sw
  text: ndipo moyo wako utakapoinuka, nawe ukamsahau Yahwe Mungu wako, aliyekutoa kutoka katika nchi ya Misri, kutoka katika nyumba ya watumwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka katika nyumba ya utumwa.” Kiebrania kihalisi ni “kutoka katika nyumba ya watumwa.”
    reason: Mbadala wa kileksika unaonyesha usemi wa kawaida zaidi wa Kiswahili huku ukifafanua muundo halisi wa Kiebrania.
lexical_decisions:
- source_word: וְרָם לְבָבֶךָ
  choice: moyo wako utakapoinuka
  rationale: Huhifadhi sitiari ya Kiebrania ya moyo kuinuka kwa kiburi, huku muundo wa “utakapoinuka” ukiendeleza mfuatano wa onyo la masharti katika muktadha.
- source_word: וְשָׁכַחְתָּ
  choice: ukamsahau
  rationale: Kitenzi hiki kinaendeleza matokeo yanayofuata katika muktadha; “ukamsahau” ni ya kawaida katika Kiswahili na haiifanyi sentensi kuwa taarifa ya wakati uliopita.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huwakilisha wazi muundo wa umilikishi wa nafsi ya pili umoja.
- source_word: הַמּוֹצִיאֲךָ
  choice: aliyekutoa
  rationale: Kishiriki chenye kibainishi humtambulisha Yahwe kwa tendo lake la kumtoa Israeli; kishazi rejeshi ni cha asili katika Kiswahili.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Hufuata usemi kamili wa Kiebrania na huleta kwa Kiswahili maana ya kutoka ndani ya nchi hiyo.
- source_word: מִבֵּית עֲבָדִים
  choice: katika nyumba ya watumwa
  rationale: Huhifadhi taswira halisi ya Kiebrania na nomino ya wingi עֲבָדִים, “watumwa,” badala ya kuibadili moja kwa moja kuwa dhana dhahania ya “utumwa.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi la Mungu; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Jinsi ya kutafsiri מִבֵּית עֲבָדִים
  choice: katika nyumba ya watumwa
  alternative: katika nyumba ya utumwa
  rationale: Chaguo kuu huhifadhi wingi halisi “watumwa” na uhalisi wa hali yao ya kijamii; tafsiri dhahania inayotumia “utumwa” imetolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya moyo kuinuka imehifadhiwa, na alama ya tanbihi imewekwa baada ya kirai inachokifafanua.
