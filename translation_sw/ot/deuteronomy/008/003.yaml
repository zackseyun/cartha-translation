source:
  edition: WLC
  text: וַֽ/יְעַנְּ/ךָ֮ וַ/יַּרְעִבֶ/ךָ֒ וַ/יַּֽאֲכִֽלְ/ךָ֤ אֶת הַ/מָּן֙ אֲשֶׁ֣ר לֹא יָדַ֔עְתָּ וְ/לֹ֥א יָדְע֖וּ/ן אֲבֹתֶ֑י/ךָ לְמַ֣עַן הוֹדִֽעֲ/ךָ֗ כִּ֠י לֹ֣א עַל הַ/לֶּ֤חֶם לְ/בַדּ/וֹ֙ יִחְיֶ֣ה הָֽ/אָדָ֔ם כִּ֛י עַל כָּל מוֹצָ֥א פִֽי יְהוָ֖ה יִחְיֶ֥ה הָ/אָדָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/003.yaml
  text: And he humbled you and let you hunger and fed you the manna[a], which you had not known, nor had your fathers known, so that he might make you know that man does not live by bread alone[b], but man lives by every word that comes from the mouth of Yahweh.
translation:
  language: sw
  text: Akakunyenyekeza, akakufanya uwe na njaa, na akakulisha mana, ambayo hukuijua wala baba zako hawakuijua, ili akujulishe kwamba mwanadamu[a] haishi kwa mkate tu, bali mwanadamu huishi kwa kila kitu kitokacho katika kinywa cha Yahwe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mwanadamu” hapa humaanisha binadamu kwa ujumla, si wanaume pekee.
    reason: cultural_note
  - marker: b
    text: Au, “kwa kila neno litokalo katika kinywa cha Yahwe.” Kiebrania kinasema kwa upana zaidi, “kila kitu kitokacho katika kinywa cha Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְעַנְּךָ
  choice: Akakunyenyekeza
  rationale: Kitenzi ענה katika piel kinaweza kumaanisha kutesa au kunyenyekeza. Katika muktadha wa kujaribiwa na kufundishwa jangwani, “kunyenyekeza” huhifadhi kusudi la kumshusha mtu bila kuzidisha wazo la mateso ya kimwili.
- source_word: וַיַּרְעִבֶךָ
  choice: akakufanya uwe na njaa
  rationale: Hiphil ya רעב ina maana ya kusababisha njaa. Kauli hii ni ya kawaida katika Kiswahili na inaonyesha wazi tendo la Mungu.
- source_word: וַיַּאֲכִלְךָ אֶת־הַמָּן
  choice: akakulisha mana
  rationale: “Kulisha” ni usawazisho wa asili wa hiphil ya אכל, na “mana” ni jina lililozoeleka la chakula hicho cha jangwani.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ וְלֹא יָדְעוּן אֲבֹתֶיךָ
  choice: ambayo hukuijua wala baba zako hawakuijua
  rationale: “Kujua” hapa ni kufahamu kwa uzoefu. “Baba zako” huhifadhi namna ya Kiebrania ya kuwaita waliotangulia katika ukoo bila kuifanya iwe mababu wa kiume wa kizazi fulani tu.
- source_word: לְמַעַן הוֹדִעֲךָ
  choice: ili akujulishe
  rationale: Hiphil ya ידע ni ya kusababisha mtu ajue. “Akujulishe” ni fupi, ya asili, na huhifadhi nguvu hiyo ya ufundishaji.
- source_word: הָאָדָם
  choice: mwanadamu
  rationale: Katika kauli hii אָדָם humwakilisha binadamu kwa ujumla. “Mwanadamu” ni ya kawaida, yenye heshima, na haifanyi maana ihusu wanaume pekee.
- source_word: הַלֶּחֶם לְבַדּוֹ
  choice: mkate tu
  rationale: Kauli hii ni ya kawaida katika Kiswahili na huhifadhi utofautishaji kati ya mkate na kile kitokacho katika kinywa cha Yahwe.
- source_word: כָּל־מוֹצָא פִי יְהוָה
  choice: kila kitu kitokacho katika kinywa cha Yahwe
  rationale: מוֹצָא ni kile kinachotoka au kutokea. “Kila kitu kitokacho” huhifadhi upana wa Kiebrania badala ya kuifunga maana kwa “neno” pekee, huku taswira ya kinywa cha Mungu ikibaki wazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: “Yahwe” ni umbo la Kiswahili la jina la agano יהוה na hulitofautisha na cheo “Bwana.”
- source_word: יִחְיֶה הָאָדָם ... יִחְיֶה הָאָדָם
  choice: mwanadamu haishi ... bali mwanadamu huishi
  rationale: Kurudiwa kwa “mwanadamu” kunahifadhi uwiano na msisitizo wa sentensi ya Kiebrania.
theological_decisions:
- issue: Maana wakilishi ya הָאָדָם katika kauli kuhusu uhai wa binadamu
  choice: mwanadamu
  alternative: mtu; binadamu
  rationale: “Mwanadamu” huonyesha kwamba kauli inawahusu wanadamu wote, si wanaume pekee, na bado huhifadhi nomino ya umoja ya Kiebrania.
- issue: Upeo wa כָּל־מוֹצָא פִי יְהוָה
  choice: kila kitu kitokacho katika kinywa cha Yahwe
  alternative: kila neno litokalo katika kinywa cha Yahwe
  rationale: Neno מוֹצָא ni pana kuliko “neno” peke yake. Tafsiri kuu huhifadhi upana huo na tanbihi hutaja usomaji wa kimuktadha unaoelekeza kwenye usemi au neno la Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi mfululizo wa matendo, urudiaji wa “mwanadamu,” na taswira ya “kinywa cha Yahwe,” huku ikiepuka lugha ya dhehebu fulani.
