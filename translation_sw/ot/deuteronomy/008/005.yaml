  yaml_path: translation/ot/deuteronomy/008/005.yaml
  text: So know in your heart that[a], just as a man disciplines his son, Yahweh your God disciplines you.
translation:
  language: sw
  text: Basi, tambua moyoni mwako kwamba kama vile mtu anavyomwadibisha mwanawe, ndivyo Yahwe Mungu wako anavyokuadibisha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “anavyomwadhibu” au “anavyomrekebisha”; kitenzi cha Kiebrania kinaweza kujumuisha adhabu ya kurekebisha na malezi yanayofundisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Basi, tambua
  rationale: Kitenzi cha Qal timilifu nafsi ya pili umoja pamoja na kiunganishi kina nguvu ya hitimisho na himizo katika muktadha. ‘Basi, tambua’ ni Kiswahili cha kawaida kinachohifadhi mtiririko huo.
- source_word: עִם לְבָבֶךָ
  choice: moyoni mwako
  rationale: Nahau hii humaanisha utambuzi au kukiri kwa ndani; ‘moyoni mwako’ ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: כִּי
  choice: kwamba
  rationale: Hutambulisha yaliyomo katika jambo linalopaswa kutambuliwa.
- source_word: כַּאֲשֶׁר
  choice: kama vile ... ndivyo
  rationale: Muundo huu unaonyesha wazi ulinganisho kati ya tendo la mtu kwa mwanawe na tendo la Yahwe kwa Israeli.
- source_word: יְיַסֵּר / מְיַסְּרֶךָּ
  choice: anavyomwadibisha / anavyokuadibisha
  rationale: Mzizi יסר unaweza kujumuisha kurekebisha kwa njia ya adhabu na malezi yanayofundisha. ‘Kuadibisha’ huhifadhi upana huo, na kurudiwa kwa neno hilo kunalingana na marudio ya Kiebrania.
- source_word: אִישׁ
  choice: mtu
  rationale: Kiebrania kinasema ‘mtu’ wala si moja kwa moja ‘baba’; uhusiano wa kiume na mwana unaonyeshwa na ‘mwanawe’.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Nomino hiyo ni ‘mwana,’ si neno la jumla ‘mtoto’; tafsiri hii huhifadhi ulinganisho wa chanzo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kwa unukuzi wa kawaida wa Kiswahili ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Hili ndilo jina la kawaida la kiagano linaloambatana na jina la Mungu.
theological_decisions:
- issue: Asili ya adibisho la Mungu
  choice: anavyokuadibisha
  alternative: anavyokuonya / anavyokurekebisha
  rationale: ‘Kuadibisha’ huhifadhi pamoja vipengele vya marekebisho yenye uchungu na malezi yanayomjenga mtu, bila kulifanya tendo hilo kuwa adhabu tupu wala mafundisho mepesi tu.
- issue: Utoaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la kiagano יהוה; ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘kama vile ... ndivyo’ umechaguliwa ili ulinganisho usikike kwa kawaida, huku marudio ya kitenzi yakihifadhiwa. Alama ya tanbihi [a] imewekwa baada ya kauli nzima inayohusika.
