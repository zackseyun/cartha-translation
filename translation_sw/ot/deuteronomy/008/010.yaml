base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/010.yaml
  text: And you shall eat and be satisfied[a], and you shall bless Yahweh your God for the good land that he has given you.
translation:
  language: sw
  text: Utakula na kushiba, nawe utambariki[a] Yahwe, Mungu wako, kwa ajili ya nchi nzuri aliyokupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utamshukuru” au “utamsifu.” Kiebrania kinasema “utambariki,” nahau ya kibiblia inayomaanisha kusema mema juu ya Mungu kwa shukrani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָכַלְתָּ
  choice: Utakula
  rationale: Kauli timilifu ya nafsi ya pili umoja pamoja na kiunganishi, katika mfuatano huu wa agano na mausia, inaeleza tendo la wakati ujao au matokeo; “utakula” ni ya kawaida na huhifadhi mfuatano huo.
- source_word: וְ/שָׂבָעְתָּ
  choice: na kushiba
  rationale: Kitenzi kina maana ya kula hadi kutosheka. “Kushiba” ni Kiswahili cha kawaida na huonyesha utoshelevu wa chakula bila kuongeza wazo lisilokuwamo katika maandishi.
- source_word: וּ/בֵרַכְתָּ
  choice: nawe utambariki
  rationale: ברך inapomlenga Mungu humaanisha kusema mema juu yake kwa shukrani, kumsifu au kumshukuru. “Utambariki” huhifadhi nahau ya kibiblia na upana wake wa maana.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa moja kwa moja badala ya kubadilishwa na cheo. “Yahwe” ni umbo la kawaida la Kiswahili la jina hilo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: 'Muundo wenye kiambishi cha nafsi ya pili umoja unaonyesha uhusiano wa moja kwa moja: “Mungu wako.”'
- source_word: עַל
  choice: kwa ajili ya
  rationale: Hapa kihusishi kinaonyesha sababu au jambo linalosababisha baraka; “kwa ajili ya” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: הָאָרֶץ הַטֹּבָה
  choice: nchi nzuri
  rationale: Tafsiri ya moja kwa moja huhifadhi wazo la nchi ya agano bila kufafanua kupita kiasi aina ya uzuri wake.
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: aliyokupa
  rationale: Kishazi rejeshi kinamtaja Mungu kama mtoaji na zawadi ya nchi kama tendo lililotimizwa lenye matokeo yanayoendelea.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu. Kulitaja kama “Yahwe” huhifadhi jina la agano badala ya kulibadilisha na cheo; tahajia imewekwa katika umbo la kawaida la Kiswahili.
- issue: Jinsi ya kutafsiri ברך inapomlenga Mungu
  choice: utambariki
  alternative: utamshukuru; utamsifu
  rationale: “Utambariki” huhifadhi nahau ya Kiebrania na mvutano wake wa maana. Katika muktadha huu tendo hilo linajumuisha shukrani na sifa, lakini mojawapo ya maneno hayo peke yake lingepunguza upana wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa wasomaji wa kawaida. Mfuatano wa sentensi umehifadhiwa kwa mtindo wa kawaida wa Kiswahili, na nahau ya “kumbariki Mungu” imehifadhiwa huku maana zake mbadala zikielezwa katika tanbihi.
