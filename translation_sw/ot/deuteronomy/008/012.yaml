  text: lest[a], when you have eaten and are satisfied, and have built good houses and lived in them,
translation:
  language: sw
  text: usije ukala ukashiba, ukajenga nyumba nzuri na ukaishi ndani zake,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּן
  choice: usije
  rationale: Huanzisha onyo linalotegemea mstari uliotangulia; muundo wa Kiswahili ‘usije uka-’ unahifadhi nguvu ya tahadhari kwa lugha ya kawaida.
- source_word: תֹּאכַל
  choice: ukala
  rationale: Ingawa kitenzi ni cha hali isiyotimilika, hapa kinaingia katika mfululizo wa matendo yanayotarajiwa katika onyo; ‘ukala’ huungana kwa kawaida na ‘usije’.
- source_word: וְשָׂבָעְתָּ
  choice: na kushiba
  rationale: Kitenzi שׂבע kinaonyesha kufikia hali ya kutosheka kwa chakula; ‘kushiba’ ni fasaha, wazi, na huhifadhi maana ya kimwili bila kuiongezea tafsiri.
- source_word: וּבָתִּים טוֹבִים
  choice: nyumba nzuri
  rationale: טוֹבִים maana yake ya msingi ni ‘nzuri’; katika muktadha huu inaonyesha nyumba zenye ubora bila kulazimisha wazo la anasa.
- source_word: תִּבְנֶה
  choice: ukajenga
  rationale: Muundo wa ‘uka-’ unaendeleza kwa asili mfululizo wa matendo katika onyo na kuonyesha hatua inayofuata.
- source_word: וְיָשָׁבְתָּ
  choice: na kuishi ndani yake
  rationale: ישׁב hapa ni kukaa au kuishi. ‘Ndani yake’ inarejelea kwa kawaida nomino ya jamii ‘nyumba’ katika Kiswahili na kufanya uhusiano uwe wazi.
