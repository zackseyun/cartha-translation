  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umeachwa kama kishazi kinachoendelea kutoka mstari uliotangulia, kama ilivyo katika Kiebrania; koma ya mwisho inaonyesha kwamba sentensi inaendelea.
