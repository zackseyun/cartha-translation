base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/015.yaml
  text: who led you through the great and fearsome wilderness[a], with fiery serpents and scorpions and thirsty ground where there was no water; who brought out water for you from the flinty rock[b],
translation:
  language: sw
  text: aliyekuongoza katika nyika kubwa na ya kutisha, yenye nyoka wa moto[a], nge, na nchi kame[b] ambako hapakuwa na maji; aliyekutolea maji kutoka katika mwamba wa gumegume,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyoka wenye sumu kali.” Usemi wa Kiebrania unaotafsiriwa kijadi “nyoka wa moto” huenda unamaanisha nyoka ambao kuumwa kwao kulisababisha maumivu kama ya kuungua.
    reason: lexical_alternative
  - marker: b
    text: Au, “ukame” au “kiu.” Neno la Kiebrania linaonyesha ukavu mkali katika mahali pasipo na maji.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹלִיכֲךָ
  choice: aliyekuongoza
  rationale: Kauli ya kusababisha katika umbo la participle inarejelea tendo la YHWH la kumwongoza Israeli; kishazi cha uhusiano ni cha kawaida na cha wazi katika Kiswahili.
- source_word: בַּמִּדְבָּר הַגָּדֹל וְהַנּוֹרָא
  choice: katika nyika kubwa na ya kutisha
  rationale: “Nyika” huonyesha eneo la pori kame bila kulifanya lazima kuwa jangwa la mchanga; vivumishi vyote viwili vimehifadhiwa kwa lugha ya kawaida yenye hadhi.
- source_word: נָחָשׁ שָׂרָף
  choice: nyoka wenye kuunguza
  rationale: Neno שָׂרָף lina wazo la kuwaka au kuunguza. Tafsiri hii inadumisha taswira ya Kiebrania bila kudai kwamba nyoka walikuwa na moto halisi; tanbihi inaonyesha uwezekano wa kuhusisha usemi huo na sumu au maumivu ya kuungua baada ya kuumwa.
- source_word: וְעַקְרָב
  choice: nge
  rationale: Ni kisawe cha moja kwa moja; umbo la Kiswahili linaweza kutumiwa kwa maana ya jamii au wingi katika orodha hii.
- source_word: וְצִמָּאוֹן אֲשֶׁר אֵין מָיִם
  choice: na nchi kame ambako hapakuwa na maji
  rationale: צִמָּאוֹן huashiria kiu au ukavu mkali. “Nchi kame” inatoa maana ya kimazingira, huku kishazi kinachofuata kikihifadhi wazi ukosefu wa maji.
- source_word: הַמּוֹצִיא לְךָ מַיִם
  choice: aliyekutolea maji
  rationale: Kauli ya kusababisha ya יצא inaeleza kusababisha maji yatoke; “alikuyatolea” pia huonyesha kwamba yalitolewa kwa manufaa ya Israeli.
- source_word: מִצּוּר הַחַלָּמִישׁ
  choice: kutoka katika mwamba mgumu sana
  rationale: צּוּר ni mwamba, na חַלָּמִישׁ ni gumegume au jiwe gumu. Usemi huu wa asili unaeleweka kirahisi na unasisitiza ugumu wa mwamba bila kutumia istilahi isiyojulikana sana.
theological_decisions:
- issue: Asili ya hatari zilizoorodheshwa nyikani
  choice: Kuzitafsiri kama hatari halisi za safari ya Israeli nyikani
  alternative: Kuzifanya “nyoka wenye kuunguza” kuwa mfano wa kiroho au kuzifupisha zote kuwa hatari za jumla
  rationale: Muktadha unakumbusha uongozi na utoaji wa Mungu katika historia ya safari ya nyikani. Hakuna msingi wa lazima katika mstari huu wa kuzigeuza hatari hizi kuwa mafumbo.
- issue: Maana ya נָחָשׁ שָׂרָף
  choice: Kuhifadhi wazo la kuunguza katika maandishi na kueleza uwezekano wa sumu katika tanbihi
  alternative: Kutafsiri moja kwa moja “nyoka wenye sumu kali”
  rationale: Kiebrania kinaweza kuelekeza kwenye nyoka wanaoitwa “wa kuungua,” labda kwa sababu ya maumivu ya kuumwa. Uamuzi huu hauamui kimya kimya kama moto ni taswira au maelezo ya athari ya sumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nyika” inafaa kwa mazingira ya safari bila kulazimisha picha ya jangwa la mchanga. Muundo umeachwa kama mwendelezo wa sentensi ya mstari uliotangulia, kwa hiyo unaanza na “aliyekuongoza” na kuishia kwa koma.
