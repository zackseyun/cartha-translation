lexical_decisions:
- source_word: אֶרֶץ
  choice: nchi ya
  rationale: Neno hili linaanzisha maelezo ya mazao ya nchi iliyoahidiwa. Muundo “nchi ya” ni wa kawaida katika Kiswahili na unafaa kwa orodha hii.
- source_word: חִטָּה
  choice: ngano
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa nafaka hii.
- source_word: שְׂעֹרָה
  choice: shayiri
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa nafaka hii, na linaendana vizuri na “ngano.”
- source_word: גֶּפֶן
  choice: mizabibu
  rationale: Nomino ya Kiebrania iko katika umoja wa kijumla lakini inataja mizabibu kama zao; wingi ni wa asili katika orodha ya Kiswahili.
- source_word: תְּאֵנָה
  choice: mitini
  rationale: Neno la Kiebrania kwa kawaida hutaja mtini, si tunda pekee; “mitini” huhifadhi maana hiyo.
- source_word: רִמּוֹן
  choice: makomamanga
  rationale: Neno la Kiebrania linaweza kutaja komamanga au mkomamanga. Katika orodha ya mazao, “makomamanga” ni ya kawaida na haiongezi maelezo yasiyolazimika kuhusu miti.
- source_word: אֶרֶץ
  choice: nchi ya
  rationale: Kurudia “nchi” kunahifadhi msisitizo wa Kiebrania na kuanzisha sehemu ya pili ya orodha.
- source_word: זֵית שֶׁמֶן
  choice: mafuta ya zeituni
  rationale: Kirai hiki kinahusisha zeituni na mafuta. “Mafuta ya zeituni” ni Kiswahili cha kawaida na huwasilisha maana kwa uwazi bila tafsiri ngumu ya neno kwa neno.
- source_word: דְּבָשׁ
  choice: asali
  rationale: “Asali” ndiyo maana ya kawaida na pana ya neno hili. Hata hivyo, katika maelezo ya mazao ya nchi, huenda likarejelea pia sharubati tamu, hasa ya tende; uwezekano huo umewekwa katika tanbihi.
