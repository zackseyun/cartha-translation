base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/020.yaml
  text: Like the nations that Yahweh is destroying before you[a], so you will perish, because you did not listen to the voice of Yahweh your God.
translation:
  language: sw
  text: Kama mataifa ambayo Yahweh anayaangamiza mbele yenu, ndivyo nanyi mtakavyoangamia, kwa sababu hamtaisikiliza sauti ya Yahweh, Mungu wenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu hamtatii Yahweh, Mungu wenu.” Nahau ya Kiebrania, kwa maana halisi, ni “kuisikiliza sauti ya Yahweh, Mungu wenu,” na mara nyingi humaanisha kutii.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּגּוֹיִם
  choice: Kama mataifa
  rationale: כְּ huonyesha ulinganisho, na גּוֹיִם katika muktadha huu ni mataifa ya Kanaani; “mataifa” ni neno la kawaida na linalofaa katika Kumbukumbu la Torati.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano יְהוָה limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: מַאֲבִיד
  choice: anayaangamiza
  rationale: Kauli ya Hifili ya אבד ina maana ya kusababisha maangamizi; umbo la kitenzi-jina linaonyesha tendo linaloendelea au lililo karibu kutimizwa.
- source_word: מִפְּנֵיכֶם
  choice: mbele yenu
  rationale: Hii ni tafsiri ya asili ya nahau inayomaanisha kuyaondoa mataifa hayo wakati Israeli inapoingia katika nchi.
- source_word: כֵּן תֹאבֵדוּן
  choice: ndivyo nanyi mtakavyoangamia
  rationale: “Kama ... ndivyo ...” huhifadhi muundo wa ulinganisho wa Kiebrania, huku “nanyi” ikisisitiza kuwa Israeli pia itapatwa na hukumu hiyo.
- source_word: עֵקֶב
  choice: kwa sababu
  rationale: Katika sentensi hii neno hilo linatoa sababu ya hukumu inayotangazwa.
- source_word: לֹא תִשְׁמְעוּן בְּקוֹל
  choice: hamkuisikiliza sauti
  rationale: Tafsiri hii huhifadhi picha halisi ya kusikiliza sauti, ingawa nahau hiyo pia hubeba maana ya kutii.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Pamoja na Yahweh, neno hili linamtaja kwa umoja Mungu wa agano wa Israeli.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Kutohowa jina la Mungu huhifadhi jina binafsi la agano lililo katika maandishi ya Kiebrania.
- issue: Ikiwa שׁמע בקול itafsiriwe moja kwa moja kuwa “kutii”
  choice: kuisikiliza sauti
  alternative: kumtii
  rationale: Maandishi makuu yanahifadhi nahau na taswira ya Kiebrania bila kuondoa maana yake ya utii; tanbihi inaeleza maana hiyo.
- issue: Wakati wa לֹא תִשְׁמְעוּן
  choice: hamkuisikiliza
  alternative: hamsikilizi / hamtaisikiliza
  rationale: Baada ya עֵקֶב, kauli hii inaeleza kutosikiliza kama msingi wa hukumu inayotangazwa. Kiswahili cha wakati uliopita huwasilisha vizuri kosa linalotazamwa kuwa sababu ya matokeo yajayo, ingawa umbo la Kiebrania linaweza kuwa na upeo mpana zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Kama ... ndivyo ...” huhifadhi ulinganisho wa mstari, na “kuisikiliza sauti” huhifadhi nahau ya agano huku tanbihi ikifafanua maana ya utii.
