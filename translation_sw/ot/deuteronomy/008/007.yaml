source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹהֶ֔י/ךָ מְבִֽיאֲ/ךָ֖ אֶל אֶ֣רֶץ טוֹבָ֑ה אֶ֚רֶץ נַ֣חֲלֵי מָ֔יִם עֲיָנֹת֙ וּ/תְהֹמֹ֔ת יֹצְאִ֥ים בַּ/בִּקְעָ֖ה וּ/בָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/007.yaml
  text: For Yahweh your God is bringing you into a good land[a], a land of streams of water, springs[c][b], and depths flowing out in the valley and in the hill country.
translation:
  language: sw
  text: Kwa maana Yahweh, Mungu wako, anakuingiza katika nchi nzuri, nchi yenye vijito vya maji[a], chemchemi na maji ya vilindini[b], ambayo hutoa maji katika bonde na katika nchi ya milima.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mikondo ya maji”; neno la Kiebrania linaweza kumaanisha vijito, mito ya msimu, au mikondo ya maji.
    reason: lexical_alternative
  - marker: b
    text: Au “vilindi”; huenda neno la Kiebrania linamaanisha maji yaliyo chini ya ardhi au maji ya kina.
    reason: lexical_alternative
  - marker: c
    text: Au “katika tambarare na milimani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au ufafanuzi wa himizo lililotangulia; “Kwa maana” huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huhifadhi kauli ya agano pamoja na kiambishi cha nafsi ya pili umoja.
- source_word: מְבִיאֲךָ
  choice: anakuingiza
  rationale: Hali ya tendo inayoonyeshwa na participio ya Kiebrania imewasilishwa kama tendo linaloendelea au lililo karibu; “kuingiza” pia hufaa kwa mwendo wa kuingia nchini.
- source_word: אֶל־אֶרֶץ טוֹבָה
  choice: katika nchi nzuri
  rationale: Tafsiri ya moja kwa moja na ya kawaida inayohifadhi sifa “nzuri” bila kuipanua.
- source_word: אֶרֶץ נַחֲלֵי מָיִם
  choice: nchi yenye vijito vya maji
  rationale: נַחֲלִים inaweza kutaja vijito, mikondo ya maji au vijito vya msimu; “vijito vya maji” ni wazi na huhifadhi taswira ya maji yanayotiririka.
- source_word: עֲיָנֹת
  choice: chemchemi
  rationale: Neno hili hutaja vyanzo vya asili vya maji; “chemchemi” ni neno la kawaida na sahihi.
- source_word: וּתְהֹמֹת
  choice: maji ya vilindini
  rationale: Huwasilisha maji ya kina au ya chini ya ardhi bila kulazimisha maelezo mahususi ya kijiolojia.
- source_word: יֹצְאִים
  choice: yanayobubujika
  rationale: Katika muktadha wa vyanzo vya maji, “kububujika” huonyesha maji yanayotoka na kutiririka kwa lugha ya asili ya Kiswahili.
- source_word: בַּבִּקְעָה
  choice: mabondeni
  rationale: בִּקְעָה inaweza kuwa bonde pana au tambarare; “mabondeni” hudumisha utofautishaji wa maeneo ya chini na ya milima.
- source_word: וּבָהָר
  choice: na katika maeneo ya milima
  rationale: Ingawa הָר ni umoja kimuundo, hapa inaweza kutumiwa kwa maana ya pamoja kuhusu nchi ya milima; tafsiri hii ni ya kawaida kwa Kiswahili.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina maalumu la Mungu; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya תְהֹמֹת katika taswira ya maji
  choice: maji ya vilindini
  alternative: vilindi
  rationale: Chaguo hili linaonyesha kwamba vilindi vinavyokusudiwa vina maji, lakini halitatui kabisa kama ni maji ya chini ya ardhi au maji mengine ya kina.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Anakuingiza” huhifadhi uhai wa participio, na “yanayobubujika” huunganisha kwa kawaida chemchemi na maji ya vilindini. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika.
