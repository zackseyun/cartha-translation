source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֣ה אֱלֹהֶ֑י/ךָ לְ/בִלְתִּ֨י שְׁמֹ֤ר מִצְוֺתָי/ו֙ וּ/מִשְׁפָּטָ֣י/ו וְ/חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/011.yaml
  text: Be careful lest you forget Yahweh your God by failing to keep his commandments and his judgments and his statutes[b][a], which I am commanding you today.
translation:
  language: sw
  text: Jihadhari usije ukamsahau Yahweh, Mungu wako, kwa kutoshika amri zake, hukumu zake na sheria zake, ambazo ninakuamuru leo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Jihadhari
  rationale: Kauli ya kuonya katika nafsi ya pili umoja; “Jihadhari” ni ya kawaida, yenye uzito, na inabeba wazo la mtu kujilinda dhidi ya hatari.
- source_word: פֶּן תִּשְׁכַּח
  choice: usije ukamsahau
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida jambo hasi linalopaswa kuepukwa, kama פֶּן pamoja na kitenzi chake.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh Mungu wako
  rationale: Jina la agano יְהוָה limetoholewa kuwa “Yahweh,” nalo אֱלֹהֶיךָ limetafsiriwa moja kwa moja kuwa “Mungu wako.”
- source_word: לְבִלְתִּי שְׁמֹר
  choice: kwa kutoshika
  rationale: Inahifadhi uhusiano wa karibu kati ya kumsahau Yahweh na kutotii sheria zake bila kuongeza maelezo yasiyomo katika Kiebrania.
- source_word: מִצְוֺתָיו
  choice: amri zake
  rationale: “Amri” ni neno la kawaida na sahihi kwa מִצְוָה katika muktadha wa sheria ya agano.
- source_word: מִשְׁפָּטָיו
  choice: hukumu zake
  rationale: “Hukumu” inadumisha maana ya kisheria ya מִשְׁפָּט na kutofautisha neno hili na istilahi nyingine katika orodha.
- source_word: חֻקֹּתָיו
  choice: masharti yake
  rationale: “Masharti” linaeleza kanuni zilizowekwa na linaeleweka kwa urahisi katika Kiswahili cha sasa huku likidumisha tofauti ya neno hili na “amri” na “hukumu.”
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ambazo ninakuamuru leo
  rationale: “Ninakuamuru” huhifadhi hali endelevu ya kauli ya Musa na “leo” hudumisha uharaka wa agano.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, si cheo; “Yahweh” hulihifadhi wazi bila kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya kumsahau Yahweh na kutoshika maagizo yake
  choice: kwa kutoshika
  alternative: hata usishike
  rationale: Kiswahili hiki kinaonyesha kutoshika amri kuwa namna au udhihirisho wa kumsahau Yahweh, huku kikiendelea kuwa karibu na muundo wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na uzito unaofaa hotuba ya agano. Nafsi ya pili umoja imedumishwa katika “Jihadhari,” “ukamsahau,” “wako,” na “ninakuamuru.”
