    issue: “nawe ukajiseme moyoni” is grammatically nonstandard.
    rationale: The form “ukajiseme” is not the appropriate conjugated form for ‘you say’ in this context. Moreover, the reflexive form is unnecessary because “moyoni mwako” already expresses inward speech. “Ukisema moyoni mwako” is both natural and faithful to the Hebrew idiom.
