  verdict: revise
  source_fidelity: The draft correctly conveys the inward self-attribution, the paired concepts of personal power and the strength/capacity of one's hand, and חַיִל as material wealth in context. However, “ukajiseme” is not a standard finite Swahili form and weakens the rendering of וְאָמַרְתָּ.
  naturalness: “Ukisema moyoni mwako” is idiomatic, grammatical Standard East African Swahili for this warning-context expression. “Vimenipatia” naturally lets the two preceding abstract nouns function as the compound subject that has acquired/provided the wealth.
  terminology: “Utajiri huu” is contextually sound for הַחַיִל הַזֶּה. “Uwezo wa mkono wangu” retains the hand image while distinguishing the second expression from “nguvu zangu.” The lexical footnote is accurate and properly anchored.
  issues:
