  text: וְ/אָמַרְתָּ֖ בִּ/לְבָבֶ֑/ךָ כֹּחִ/י֙ וְ/עֹ֣צֶם יָדִ֔/י עָ֥שָׂה לִ֖/י אֶת הַ/חַ֥יִל הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/017.yaml
  text: and you say in your heart[a], ‘My power and the strength of my hand have gotten me this wealth,’
translation:
  language: sw
  text: nawe ukisema moyoni mwako, “Nguvu zangu na uwezo wa mkono wangu vimenipatia utajiri huu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ustawi huu.” Neno la Kiebrania חַיִל linaweza kumaanisha utajiri, rasilimali, nguvu, au uwezo kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: nawe ukajiseme
  rationale: Katika muktadha huu wa onyo, kitenzi kinaonyesha jambo linaloweza kufuata baada ya mafanikio. “Ukajiseme” ni Kiswahili cha kawaida kwa usemi wa ndani na kinaendeleza mtiririko wa simulizi.
- source_word: בִּלְבָבֶךָ
  choice: moyoni
  rationale: Hii ni nahau ya Kiebrania inayomaanisha mawazo ya ndani au kujisemea; “moyoni” inadumisha taswira ya chanzo huku ikieleweka kwa urahisi.
- source_word: כֹּחִי
  choice: nguvu zangu
  rationale: כֹּחַ humaanisha nguvu, uwezo, au uweza. Kiswahili hutumia kwa kawaida “nguvu zangu” kumaanisha uwezo wa mtu binafsi.
- source_word: וְעֹצֶם יָדִי
  choice: na uwezo wa mkono wangu
  rationale: Tafsiri hii inadumisha taswira halisi ya “mkono” kama ishara ya uwezo na juhudi binafsi, huku “uwezo” ikitoa maana ya עֹצֶם kwa Kiswahili cha kawaida.
- source_word: עָשָׂה לִי
  choice: nimejipatia
  rationale: Ingawa maana ya msingi ni “imefanya/imetengeneza kwa ajili yangu,” katika muktadha huu msemaji anadai kwamba uwezo wake mwenyewe ndio uliomletea au uliomwezesha kupata mali. “Nimejipatia” huwasilisha wazi dai hilo la kujitosheleza.
- source_word: הַחַיִל הַזֶּה
  choice: utajiri huu
  rationale: Katika Kumbukumbu la Torati 8, muktadha ni wingi wa mali na mafanikio ya kimwili. “Utajiri huu” inafaa zaidi hapa, ingawa חַיִל pia inaweza kumaanisha ustawi, rasilimali, nguvu, au uwezo.
theological_decisions:
- issue: Maana ya חַיִל katika onyo la agano
  choice: utajiri
  alternative: ustawi
  rationale: Muktadha wa karibu unahusu chakula, nyumba, mifugo, fedha, dhahabu, na kuongezeka kwa mali. “Utajiri” huonyesha lengo la onyo bila kuifanya חַיִל kuwa nguvu za kijeshi pekee; uwezekano wa “ustawi” umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “ukajiseme moyoni” unasikika wa kawaida na kudumisha dhana ya mawazo ya ndani; “mkono wangu” huhifadhi sitiari ya Kiebrania. Alama ya tanbihi imewekwa baada ya neno linalohusika, “utajiri huu.”
