base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/018.yaml
  text: But you shall remember Yahweh your God[a], for it is he who gives you power to gain wealth, so that he may establish his covenant that he swore to your fathers[c][b], as it is this day.
translation:
  language: sw
  text: Lakini ukumbuke Yahweh, Mungu wako, kwa maana ndiye anayekupa nguvu za kupata mali[a], ili athibitishe agano lake alilowaapia baba zako[b], kama inavyoonekana leo hii.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nguvu za kuzalisha mali,” “nguvu za kujipatia ustawi,” au kwa maana pana zaidi, “uwezo wa kufanikiwa.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “baba zako”; hapa linarejelea hasa mababu waliopokea ahadi za agano.'
    reason: cultural_note
  - marker: c
    text: 'Kiebrania kwa neno moja moja: “kama siku hii,” yaani, “kama inavyoonekana leo” au “kama hali ilivyo sasa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Lakini mkumbuke
  rationale: Katika muktadha wa maagizo, umbo hili lina nguvu ya amri au himizo. “Lakini” linaonyesha utofauti na onyo la mstari uliotangulia kuhusu kujisifu kwa nguvu za mtu mwenyewe.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Mungu wako
  rationale: Jina la agano יְהוָה limetoholewa kuwa “Yahweh,” huku אֱלֹהֶיךָ ikihifadhi uhusiano wa agano kwa maneno “Mungu wako.”
- source_word: כִּי הוּא הַנֹּתֵן לְךָ
  choice: kwa maana ndiye anayekupa
  rationale: “Ndiye” linahifadhi msisitizo wa kiwakilishi הוּא, na “anayekupa” linaonyesha tendo la kawaida au linaloendelea la Mungu.
- source_word: כֹּחַ לַעֲשׂוֹת חָיִל
  choice: nguvu za kupata mali
  rationale: Katika muktadha wa Kumbukumbu la Torati 8:17–18, חָיִל inahusu hasa mali au ustawi unaopatikana. “Nguvu za kupata” ni Kiswahili cha kawaida kinachoeleza uwezo ambao Mungu hutoa.
- source_word: לְמַעַן הָקִים אֶת בְּרִיתוֹ
  choice: ili alithibitishe agano lake
  rationale: לְמַעַן linaonyesha kusudi. Hifili ya קום hapa ina maana ya kulifanya agano lisimame imara na lionekane kutekelezwa katika historia; “alithibitishe” linabeba maana hiyo bila kudokeza kwamba agano halikuwapo hapo awali.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ
  choice: alilowaapia baba zako
  rationale: Kitenzi cha Kiswahili “kuwaapia” kinaonyesha kwamba Mungu aliwapa baba zao ahadi kwa kiapo. “Baba zako” kinahifadhi rejeo mahsusi kwa mababu wa agano.
- source_word: כַּיּוֹם הַזֶּה
  choice: kama inavyoonekana leo hii
  rationale: Hii ni nahau ya Kiebrania inayorejelea uthibitisho unaoonekana katika hali ya sasa. Tafsiri hii huwasilisha maana yake kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la agano, si cheo tu. “Yahweh” hulihifadhi kwa kulitohowa moja kwa moja.
- issue: Maana ya חָיִל katika muktadha huu
  choice: mali
  alternative: mafanikio; ustawi; uwezo
  rationale: Mstari wa 17 unazungumzia mali ambayo Israeli inaweza kudai kuwa imeipata kwa nguvu zake yenyewe. “Mali” linaendeleza hoja hiyo, huku tanbihi ikihifadhi upana wa maana.
- issue: Maana ya הָקִים kuhusiana na agano
  choice: alithibitishe
  alternative: alisimamishe; alitekeleze; alidumishe
  rationale: Neno linaweza kumaanisha kusimamisha, kuthibitisha, au kutekeleza agano. “Alithibitishe” linaonyesha agano likifanywa imara na kuonekana katika matendo bila kusema lilikuwa halijaanzishwa kabisa.
- issue: Rejeo la אֲבֹתֶיךָ
  choice: baba zako
  alternative: mababu zako
  rationale: Hapa neno linarejelea hasa baba wa agano ambao Mungu aliwaapia. Tafsiri mahsusi inadumisha mwelekeo huo wa kihistoria na kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inatumia umoja kwa sababu hotuba ya Kiebrania inamwelekea kila Mwisraeli kwa nafsi ya pili umoja. “Leo hii” ni ya kawaida na yenye msisitizo wa kutosha kwa nahau ya mwisho.
