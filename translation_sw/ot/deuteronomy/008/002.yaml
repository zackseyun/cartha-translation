  text: וְ/זָכַרְתָּ֣ אֶת כָּל הַ/דֶּ֗רֶךְ אֲשֶׁ֨ר הֹלִֽיכֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ זֶ֛ה אַרְבָּעִ֥ים שָׁנָ֖ה בַּ/מִּדְבָּ֑ר לְמַ֨עַן עַנֹּֽתְ/ךָ֜ לְ/נַסֹּֽתְ/ךָ֗ לָ/דַ֜עַת אֶת אֲשֶׁ֧ר בִּֽ/לְבָבְ/ךָ֛ הֲ/תִשְׁמֹ֥ר מצות/ו אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/002.yaml
  text: And you shall remember all the way that Yahweh your God has led you these forty years in the wilderness[a], in order to humble you, to test you, to know what was in your heart, whether you would keep his commandments or not.
translation:
  language: sw
  text: Nawe kumbuka safari yote ya miaka hii arobaini jangwani ambayo Yahweh, Mungu wako, alikuongoza kuipitia, ili akunyenyekeze, akujaribu, na ajue yaliyokuwa moyoni mwako[a]—kama utazishika amri zake au la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “afunue yaliyokuwa moyoni mwako.” Kiebrania kinasema kihalisi, “ajue yaliyokuwa moyoni mwako,” usemi ambao umedumishwa katika matini kuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Nawe kumbuka
  rationale: Katika hotuba ya maagizo, umbo hili lina nguvu ya himizo. Kauli hii ni ya asili katika Kiswahili na haiifanyi sentensi ionekane kama utabiri tu.
- source_word: כָּל הַדֶּרֶךְ
  choice: njia yote
  rationale: Inadumisha picha ya Kiebrania huku ikirejelea mwendo mzima wa Israeli jangwani, si barabara halisi pekee.
- source_word: הֹלִיכֲךָ
  choice: alikuongoza
  rationale: Hifili ya הלך ina maana ya kusababisha kwenda; “alikuongoza” huwasilisha kwa kawaida mwongozo wa Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina binafsi la Mungu katika herufi nne za Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Linahifadhi umilikaji wa nafsi ya pili na lugha ya uhusiano wa agano.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: katika miaka hii arobaini
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kipindi chote cha miaka arobaini hadi wakati wa hotuba.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: “Jangwani” ni tafsiri ya kawaida na pana ya eneo lisilokaliwa ambalo Israeli alipitia.
- source_word: לְמַעַן
  choice: ili
  rationale: Huonyesha kusudi kwa uwazi na kwa Kiswahili cha kawaida.
- source_word: עַנֹּתְךָ
  choice: akunyenyekeze
  rationale: Katika muktadha huu kitenzi kinamaanisha kumshusha mtu au kumnyenyekeza kupitia taabu; maana hiyo inaendelea pia katika mstari unaofuata.
- source_word: לְנַסֹּתְךָ
  choice: kukujaribu
  rationale: Huonyesha tendo la kumpima mtu ili hali yake au uaminifu wake udhihirike.
- source_word: לָדַעַת
  choice: ajue
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi usemi wa Kiebrania na mvutano wake wa kitheolojia.
- source_word: אֶת אֲשֶׁר בִּלְבָבְךָ
  choice: yaliyokuwa moyoni mwako
  rationale: “Moyo” huwakilisha utu wa ndani, kutia ndani nia na mawazo; umbo la wingi “yaliyokuwa” ni la kawaida zaidi katika Kiswahili.
- source_word: הֲתִשְׁמֹר מִצְוֹתָו אִם־לֹא
  choice: kama utazishika amri zake au la
  rationale: Linahifadhi swali lisilo la moja kwa moja kuhusu utii, na “kushika amri” ni usemi wa kawaida na sahihi.
theological_decisions:
- issue: Lugha inayomwelezea Mungu kwa namna ya kibinadamu katika “ajue yaliyokuwa moyoni mwako”
  choice: Kudumisha usemi wa moja kwa moja “ajue”
  alternative: “afunue yaliyokuwa moyoni mwako” au “yajulikane yaliyokuwa moyoni mwako”
  rationale: Kiebrania kinasema “kujua.” Tafsiri haipaswi kutatua kimya-kimya swali kuhusu Mungu kujua yote, bali idumishe mvutano uliopo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Nawe kumbuka” huhifadhi mfuatano wa hotuba na nguvu ya himizo; viwakilishi vya nafsi ya pili umoja vinamwelekea Israeli kama jumuiya moja.
