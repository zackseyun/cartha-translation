reference: Deuteronomy 6:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/בָ֨תִּ֜ים מְלֵאִ֣ים כָּל טוּב֮ אֲשֶׁ֣ר לֹא מִלֵּאתָ֒ וּ/בֹרֹ֤ת חֲצוּבִים֙ אֲשֶׁ֣ר לֹא חָצַ֔בְתָּ כְּרָמִ֥ים וְ/זֵיתִ֖ים אֲשֶׁ֣ר לֹא נָטָ֑עְתָּ וְ/אָכַלְתָּ֖ וְ/שָׂבָֽעְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/011.yaml
  text: and houses full of every good thing that you did not fill[a], and hewn cisterns that you did not hew[b], vineyards and olive trees that you did not plant—and you eat and are satisfied—
translation:
  language: sw
  text: na nyumba zilizojaa kila kitu kizuri ambazo hukuzijaza, na mashimo ya kuhifadhia maji yaliyochongwa mwambani[a] ambayo hukuyachonga, na mashamba ya mizabibu ambayo hukuyapanda, na miti ya mizeituni ambayo hukuipanda; nawe utakula na kushiba[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “visima.” Neno la Kiebrania hapa linaweza kumaanisha hasa mashimo yaliyochongwa mwambani kwa ajili ya kuhifadhi maji.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinaendeleza mfuatano wa mambo yatakayotokea Israeli itakapoingia nchini; pia kinaweza kutafsiriwa, “nawe utakapokula na kushiba.”
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: בָתִּים
  choice: nyumba
  rationale: Ni tafsiri ya kawaida ya nomino hii ya wingi na inadumisha maana halisi ya majengo katika orodha ya mali.
- source_word: מְלֵאִים כָּל טוּב
  choice: zilizojaa kila kitu kizuri
  rationale: Inawasilisha wingi wa vitu vyema na vya kufaa bila kuifanya טוּב kuwa wema wa kimaadili pekee.
- source_word: אֲשֶׁר לֹא מִלֵּאתָ
  choice: ambazo hukuzijaza
  rationale: Inahifadhi kishazi rejeshi, tendo lililokanushwa, na usemi wa nafsi ya pili umoja.
- source_word: בֹרֹת חֲצוּבִים
  choice: mashimo ya kuhifadhia maji yaliyochongwa mwambani
  rationale: בֹרֹת hapa yanaeleweka kuwa mahali pa kuhifadhi maji, nayo חֲצוּבִים huonyesha kuchongwa, yaelekea katika mwamba; usemi huu ni wazi zaidi kuliko neno la jumla ‘visima’.
- source_word: אֲשֶׁר לֹא חָצַבְתָּ
  choice: ambayo hukuyachonga
  rationale: Inadumisha uhusiano wa kileksia na ‘yaliyochongwa’ na kusisitiza kazi ambayo msemaji hakuifanya.
- source_word: כְּרָמִים
  choice: mashamba ya mizabibu
  rationale: Nomino hii inamaanisha maeneo yaliyolimwa mizabibu, si mizabibu mmoja mmoja.
- source_word: זֵיתִים
  choice: miti ya mizeituni
  rationale: Katika muktadha wa vitu vilivyopandwa, wingi huu unarejelea miti ya mizeituni kwa uwazi.
- source_word: אֲשֶׁר לֹא נָטָעְתָּ
  choice: ambayo hukuipanda
  rationale: Inahifadhi mtindo unaorudiwa wa mali ambayo aliyeambiwa hakuitayarisha mwenyewe.
- source_word: וְאָכַלְתָּ וְשָׂבָעְתָּ
  choice: nawe utakula na kushiba
  rationale: Vitenzi vinaendeleza mfuatano wa matukio yajayo baada ya kuingia nchini; ‘kushiba’ huonyesha kutosheka baada ya kula kwa lugha ya kawaida ya Kiswahili.
theological_decisions:
- issue: Asili ya wingi ulioahidiwa
  choice: Orodha ibaki kuwa ya mali na mahitaji ambayo Israeli itapokea bila kuongeza hukumu ya kimaadili katika aya hii.
  alternative: Kuingiza onyo mapema au kudokeza kwamba mali hiyo imepatikana kwa njia haramu.
  rationale: Aya inataja vitu ambavyo Israeli haikutengeneza wala kupanda; onyo lenyewe linafuata katika aya inayofuata, hivyo halipaswi kuingizwa hapa.
- issue: Nafsi ya pili umoja katika hotuba ya agano
  choice: 'Kutumia maumbo ya umoja: ‘huku-’ na ‘uta-’.'
  alternative: Kubadili kuwa nafsi ya pili wingi.
  rationale: Kiebrania kinaiambia Israeli kwa umoja wa kiuwakilishi; Kiswahili kinaweza kuhifadhi umoja huo kwa uwazi.
- issue: Mfuatano wa vitenzi vya mwisho
  choice: 'Kutafsiri kama wakati ujao: ‘utakula na kushiba’.'
  alternative: 'Kutafsiri kama wakati wa sasa: ‘unakula na kushiba’.'
  rationale: Katika muktadha, vitenzi hivi vinaendeleza yale yatakayotokea Israeli itakapoingia nchini, ingawa umbo la Kiebrania lenyewe ni sehemu ya mfuatano wa masimulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Mashimo ya kuhifadhia maji yaliyochongwa mwambani’ ni maelezo ya wazi ya kitu cha kale kisicho na neno moja la kawaida lenye usahihi huo katika Kiswahili. Alama ya mwisho ya mkato mrefu inadumisha mwendelezo wa kisintaksia kuelekea onyo la aya inayofuata.
