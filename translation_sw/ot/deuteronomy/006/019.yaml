source:
  edition: WLC
  text: לַ/הֲדֹ֥ף אֶת כָּל אֹיְבֶ֖י/ךָ מִ/פָּנֶ֑י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/019.yaml
  text: to drive out all your enemies from before you[b][a], as Yahweh has spoken.
translation:
  language: sw
  text: ili kuwafukuza adui zako wote kutoka mbele yako[a], kama Yahwe alivyosema[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “kutoka mbele yako”; ni nahau inayomaanisha kuwaondoa maadui katika njia au uwepo wako.
    reason: cultural_note
  - marker: b
    text: Au, “alivyonena.” Kitenzi cha Kiebrania kihalisi ni “alisema/alinena,” kikirejelea neno la Mungu lililotolewa awali na ambalo bado lina nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַהֲדֹף
  choice: ili kuwafukuza
  rationale: Kiambishi ל־ pamoja na kitenzi-jina kinaendeleza kusudi au matokeo kutoka mstari uliotangulia. Hifili ya נדף hapa ina maana ya kusababisha maadui waondoke kwa nguvu; “kuwafukuza” ni Kiswahili cha kawaida kinachofaa muktadha wa kivita.
- source_word: אֶת
  choice: '[alama ya yambwa maalumu, haikutafsiriwa]'
  rationale: Alama hii ya Kiebrania haina neno linalolingana nayo moja kwa moja katika Kiswahili.
- source_word: כָּל
  choice: wote
  rationale: Huwasilisha maana ya ujumla ya כָּל kabla ya nomino ya wingi, huku ikipatana kisarufi na “adui zako.”
- source_word: אֹיְבֶיךָ
  choice: adui zako
  rationale: Ni tafsiri ya kawaida ya אויב pamoja na kiambishi cha nafsi ya pili, umoja; inadumisha usemi unaomwelekea Israeli kama nafsi moja.
- source_word: מִפָּנֶיךָ
  choice: kutoka mbele yako
  rationale: Hifadhi nahau ya Kiebrania, kihalisi “kutoka usoni/mbele yako,” ambayo hapa inaashiria kuwaondoa maadui katika njia au uwepo wa Israeli.
- source_word: כַּאֲשֶׁר
  choice: kama
  rationale: Huonyesha ulinganifu na neno la Mungu lililotangulia kwa njia fupi na ya kawaida.
- source_word: דִּבֶּר
  choice: alivyosema
  rationale: Wakati uliopita wa Kiswahili unaonyesha tamko la Mungu lililotolewa kabla; “sema” hudumisha maana ya msingi ya דבר bila kulifafanua moja kwa moja kuwa ahadi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limewasilishwa kama jina binafsi badala ya kubadilishwa na cheo kama “Bwana.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; Bwana
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; “Yahwe” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Nguvu ya דִּבֶּר katika muktadha wa agano
  choice: alivyosema
  alternative: alivyoahidi
  rationale: “Alivyosema” hudumisha maana halisi ya kitenzi huku muktadha ukiruhusu msomaji atambue kwamba neno hilo la awali bado lina nguvu. “Alivyoahidi” ingekuwa ufafanuzi wa kimuktadha unaozidi neno lenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kipande cha sentensi umehifadhiwa kwa sababu mstari huu unaendeleza kusudi kutoka mstari uliotangulia. Nahau “kutoka mbele yako” imebakizwa na kufafanuliwa katika tanbihi ili kuepuka kuifuta picha ya Kiebrania.
