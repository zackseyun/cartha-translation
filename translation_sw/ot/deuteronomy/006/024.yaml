base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/024.yaml
  text: And the LORD commanded us to do all these statutes, to fear the LORD our God, for our good always, to keep us alive as it is this day.
translation:
  language: sw
  text: BWANA alituamuru kuzishika sheria hizi zote na kumcha BWANA, Mungu wetu, kwa mema yetu sikuzote na ili atuhifadhi hai, kama tulivyo leo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַעֲשׂוֹת אֶת־כָּל־הַחֻקִּים הָאֵלֶּה
  choice: kuzishika sheria hizi zote
  rationale: Ingawa kitenzi עשה kimsingi ni ‘kufanya’, katika muktadha wa maagizo ‘kuzishika’ ni Kiswahili cha kawaida na sahihi kinachoonyesha kutekeleza sheria; חֻקִּים imetafsiriwa ‘sheria’ kwa lugha inayoeleweka kwa wasomaji wa kawaida.
- source_word: לְיִרְאָה אֶת־יְהוָה
  choice: kumcha BWANA
  rationale: ‘Kumcha’ huhifadhi maana ya hofu yenye heshima na utiifu bila kuifanya kuwa ‘kumheshimu’ pekee.
- source_word: לְטוֹב לָנוּ כָּל־הַיָּמִים
  choice: ili tupate mema sikuzote
  rationale: Huwasilisha kusudi la amri na maana ya ustawi au manufaa yetu ‘siku zote’ kwa Kiswahili cha asili.
- source_word: לְחַיֹּתֵנוּ
  choice: ili atuhifadhi hai
  rationale: Umbo hili la Kiebrania linaeleza kuendelezwa kwa uhai; muktadha unaelekeza kwa BWANA kama mtendaji, kama inavyoonekana katika hali yao ya sasa.
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi pana ya tafsiri za Kiswahili ya kuwakilisha jina la agano kwa ‘BWANA’ kwa herufi kubwa.
theological_decisions:
- issue: Uhusiano kati ya kushika sheria, kumcha Mungu, kupata mema, na kuhifadhiwa hai
  choice: Kuhifadhi vifungu vyote kama makusudi ya amri ya BWANA
  alternative: Kuvieleza kama wokovu unaopatikana kwa matendo au kama matokeo ya kawaida yasiyohusisha Mungu moja kwa moja
  rationale: Kiebrania hutumia mfululizo wa לְ unaoonyesha kusudi au matokeo. Tafsiri haiongezi mfumo wa kitheolojia usiotajwa, bali huhifadhi dai la kifungu kwamba amri hizo zilitolewa kwa mema yao na kuendelea kwa uhai wao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni rahisi kusomeka hadharani. ‘Kama tulivyo leo’ ni usemi wa kawaida unaowasilisha כְּהַיּוֹם הַזֶּה kwa kurejelea hali ya taifa wakati huo.
