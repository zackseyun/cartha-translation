  edition: WLC
  text: כִּ֣י אֵ֥ל קַנָּ֛א יְהוָ֥ה אֱלֹהֶ֖י/ךָ בְּ/קִרְבֶּ֑/ךָ פֶּן יֶ֠חֱרֶה אַף יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּ֔/ךְ וְ/הִשְׁמִ֣ידְ/ךָ֔ מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/015.yaml
  text: for Yahweh your God in your midst is a jealous God[b][a], lest the anger of Yahweh your God burn against you and he destroy you from the face of the earth.
translation:
  language: sw
  text: Kwa maana Yahwe, Mungu wako, aliye katikati yako, ni Mungu mwenye wivu[a]; asije hasira ya Yahwe, Mungu wako, ikawaka dhidi yako, naye akakuangamiza kutoka katika uso wa nchi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mungu mwenye ari.” Hapa “wivu” unaonyesha dai la kipekee la Yahwe la uaminifu wa watu wake wa agano, wala si husuda ya dhambi.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kutoka juu ya uso wa ardhi.” Hii ni nahau ya kuondolewa kabisa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: kwa maana
  rationale: Inaunganisha onyo hili na katazo la mstari uliotangulia kwa kutoa sababu yake.
- source_word: אֵל קַנָּא
  choice: Mungu mwenye wivu
  rationale: Inadumisha maana ya dai la kipekee la Mungu katika agano na kutovumilia ibada ya miungu mingine; tanbihi inaondoa uwezekano wa kuelewa wivu huu kuwa husuda ya dhambi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni unukuzi wa kawaida wa Kiswahili wa jina la Mungu katika herufi nne za Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Kiambishi cha nafsi ya pili umoja kiume kinamhusu kila Mwisraeli binafsi ndani ya jumuiya ya agano.
- source_word: בְּקִרְבֶּךָ
  choice: aliye katikati yako
  rationale: Inaeleza uwepo wa Mungu kati ya watu wake, si uwepo wa ndani ya mtu mmoja.
- source_word: פֶּן
  choice: La sivyo
  rationale: Inaanzisha matokeo yanayoweza kutokea kwa namna ya onyo la wazi na la asili katika Kiswahili.
- source_word: יֶחֱרֶה אַף
  choice: hasira ... itawaka
  rationale: Inahifadhi sitiari ya Kiebrania ya hasira kuwaka.
- source_word: בָּךְ
  choice: dhidi yako
  rationale: Hutoa maana ya uadui inayobebwa na kihusishi hiki pamoja na kitenzi cha hasira.
- source_word: וְהִשְׁמִידְךָ
  choice: naye atakuangamiza kabisa
  rationale: Kitenzi cha Hifili kina nguvu ya kuharibu au kuondoa; 'kabisa' huwasilisha uzito wa uangamizi unaokusudiwa bila kutumia lugha ya mazungumzo.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: kutoka juu ya uso wa nchi
  rationale: Inahifadhi taswira ya nahau ya Kiebrania huku 'nchi' ikiruhusu maana ya ardhi au nchi inayokaliwa.
theological_decisions:
- issue: Wivu wa Mungu
  choice: Mungu mwenye wivu
  alternative: Mungu mwenye ari
  rationale: Neno la Kiebrania linaonyesha dai la kipekee la Yahwe kwa uaminifu wa watu wa agano. 'Mwenye wivu' huhifadhi mvutano wa kitheolojia; tanbihi hufafanua kuwa si husuda ya dhambi.
- issue: Jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina binafsi la agano; kulinakili kama 'Yahwe' huhifadhi tofauti kati ya jina hilo na cheo cha 'Bwana'.
- issue: Upeo wa אֲדָמָה
  choice: nchi
  alternative: dunia
  rationale: Neno linaweza kumaanisha ardhi, udongo, au nchi. 'Nchi' inafaa muktadha wa agano bila kulazimisha tafsiri ya sayari nzima, huku tanbihi ikihifadhi upana wa nahau.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Umoja wa nafsi ya pili umehifadhiwa kwa “yako/kwako” kulingana na Kiebrania. Muundo wa onyo ni wa moja kwa moja, na sitiari ya hasira kuwaka imehifadhiwa.
