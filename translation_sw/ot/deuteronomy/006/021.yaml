  yaml_path: translation/ot/deuteronomy/006/021.yaml
  text: then you shall say to your son[a], ‘We were servants to Pharaoh in Egypt[b], and Yahweh brought us out from Egypt with a strong hand.’
translation:
  language: sw
  text: Ndipo utamwambia mwanao[a], “Tulikuwa watumwa wa Farao nchini Misri, na Yahweh akatutoa kutoka Misri kwa mkono wenye nguvu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na utamwambia.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa kwa urahisi kuwa “na”; “ndipo” huonyesha mfuatano wa agizo kutoka mstari uliotangulia.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa mkono mkuu.” Nahau ya Kiebrania inaonyesha tendo la Yahweh la ukombozi lililofanywa kwa nguvu kuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: ndipo utamwambia
  rationale: Kiunganishi ו pamoja na kitenzi katika muktadha huu kinaendeleza mpangilio wa maagizo kutoka mstari uliotangulia; ‘ndipo’ huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: לְבִנְךָ
  choice: mwanao
  rationale: Kiebrania kimetaja mwana wa kiume katika umoja; ‘mwanao’ huhifadhi jinsia na nafsi hiyo.
- source_word: עֲבָדִים הָיִינוּ לְפַרְעֹה
  choice: Tulikuwa watumwa wa Farao
  rationale: Katika simulizi la kutoka Misri, עֲבָדִים linaonyesha utumwa halisi chini ya Farao, si huduma ya hiari; Kiswahili ‘watumwa wa Farao’ huonyesha uhusiano huo wa kumilikiwa na kutawaliwa.
- source_word: בְּמִצְרָיִם
  choice: nchini Misri
  rationale: Beth ni ya mahali; ‘nchini Misri’ ni usemi wa asili unaotambulisha eneo ambako walikuwa watumwa.
- source_word: וַיּוֹצִיאֵנוּ
  choice: akatutoa
  rationale: Hifili ya יצא humaanisha kusababisha kutoka, yaani ‘kutoa’; muundo wa mfululizo ‘akatutoa’ unasimulia tendo lililofuata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limeandikwa kama jina binafsi ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
- source_word: מִמִּצְרַיִם
  choice: Misri
  rationale: Katika Kiswahili, ‘akatutoa Misri’ huwasilisha kwa kawaida chanzo kinachoonyeshwa na מן bila kulazimisha ‘kutoka Misri,’ ambako kungeleta urudiaji usio wa lazima baada ya ‘kutoa.’
- source_word: בְּיָד חֲזָקָה
  choice: kwa mkono wenye nguvu
  rationale: Tafsiri hii huhifadhi taswira ya Kiebrania ya ‘mkono’ na maana ya tendo la ukombozi lililofanywa kwa nguvu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la agano; ‘Yahweh’ hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Kiwango cha utumwa katika עֲבָדִים
  choice: watumwa
  alternative: watumishi
  rationale: Muktadha wa Kutoka unahusu kufungwa na kutawaliwa kwa ukandamizaji chini ya Farao; ‘watumwa’ huhifadhi uzito wa kihistoria na kitheolojia wa ukombozi huo.
- issue: Taswira ya בְּיָד חֲזָקָה
  choice: kwa mkono wenye nguvu
  alternative: kwa mkono mkuu
  rationale: Taswira ya mkono imehifadhiwa kama lugha ya nguvu ya Mungu katika kuwakomboa; haibadilishwi kuwa maelezo yasiyo na taswira kama ‘kwa uwezo mkubwa.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia ‘nchini Misri’ kwa mahali pa utumwa na ‘akatutoa Misri’ kwa tendo la ukombozi ili iwe ya asili bila kupoteza tofauti za viambishi vya Kiebrania. ‘Lakini’ imetumika kuonyesha tofauti ya wazi kati ya hali ya utumwa na tendo la ukombozi linalofuata.
