base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/017.yaml
  text: You shall diligently keep the commandments of Yahweh your God[a], and his testimonies and his statutes[b], which he has commanded you.
translation:
  language: sw
  text: Zitunzeni kwa bidii amri za Yahweh, Mungu wenu,[a] pamoja na shuhuda zake na sheria zake,[b] alizokuamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Zishikeni kwa uangalifu” au “Lazima mzishike kwa hakika.” Kiebrania hutumia kitenzi-jina kisicho na kikomo pamoja na kitenzi chenye ukomo ili kutilia mkazo.
    reason: lexical_alternative
  - marker: b
    text: “Shuhuda zake” pia zinaweza kutafsiriwa “maagizo yake ya agano”; “sheria zake” zinaweza kutafsiriwa “kanuni zake zilizowekwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר תִּשְׁמְרוּן
  choice: Zishikeni kwa bidii
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi chenye ukomo unasisitiza tendo la kushika au kutii. “Kwa bidii” huwasilisha mkazo huo kwa Kiswahili cha kawaida.
- source_word: מִצְוֺת
  choice: amri
  rationale: Neno hili humaanisha wajibu ulioamriwa; “amri” ni wazi, rasmi, na linafaa katika muktadha wa agano.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa moja kwa moja kama jina binafsi, badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Muundo huu ni sehemu ya usemi wa kawaida wa agano, “Yahwe Mungu wenu.”
- source_word: עֵדֹתָיו
  choice: masharti yake ya agano
  rationale: Katika Kumbukumbu la Torati, neno hili linaweza kutaja masharti yanayoshuhudia na kufafanua agano. Tafsiri hii inaeleweka zaidi kuliko “shuhuda zake” katika Kiswahili cha sasa, huku tanbihi ikihifadhi maana mbadala.
- source_word: חֻקָּיו
  choice: sheria zake
  rationale: Neno hili hutaja masharti au sheria zilizowekwa rasmi. “Sheria zake” ni ya asili na yenye heshima katika Kiswahili.
- source_word: אֲשֶׁר צִוָּךְ
  choice: alizowaamuru
  rationale: Kishazi hiki kinaeleweka kurejelea kwa pamoja vipengele vya sheria vilivyotangulia. Kiswahili huonyesha upatanisho huo kwa “-zo-” na hudumisha hotuba kwa kundi kwa “-wa-” kulingana na muktadha.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza fundisho la dhehebu.
- issue: Maana ya עֵדֹתָיו
  choice: masharti yake ya agano
  alternative: shuhuda zake / maagizo yake
  rationale: Neno linaweza kuwa na wazo la ushuhuda au masharti ya kisheria ya agano. Tafsiri kuu imechagua usemi unaoeleweka katika muktadha huu, huku tanbihi ikihifadhi upana wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kauli ya moja kwa moja ya agano imehifadhiwa, huku istilahi tatu za kisheria zikitofautishwa kadiri inavyowezekana kwa lugha ya kawaida.
