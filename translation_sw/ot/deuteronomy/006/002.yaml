source:
  edition: WLC
  text: לְמַ֨עַן תִּירָ֜א אֶת יְהוָ֣ה אֱלֹהֶ֗י/ךָ לִ֠/שְׁמֹר אֶת כָּל חֻקֹּתָ֣י/ו וּ/מִצְוֺתָי/ו֮ אֲשֶׁ֣ר אָנֹכִ֣י מְצַוֶּ/ךָ֒ אַתָּה֙ וּ/בִנְ/ךָ֣ וּ/בֶן בִּנְ/ךָ֔ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ וּ/לְמַ֖עַן יַאֲרִכֻ֥/ן יָמֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/002.yaml
  text: so that you may fear Yahweh your God[a], by keeping all his statutes and his commandments that I am commanding you—you and your son and your grandson—all the days of your life[c][b], and so that your days may be prolonged.
translation:
  language: sw
  text: ili umwogope Yahwe, Mungu wako[a], kwa kuzishika sheria zake zote na amri zake zote ninazokuamuru—wewe, mwanao, na mwana wa mwanao[b]—siku zote za maisha yako, na ili siku zako zirefushwe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umstahi Yahwe, Mungu wako.” Kitenzi cha Kiebrania kinaweza kujumuisha hofu, kicho, na heshima.
    reason: lexical_alternative
  - marker: b
    text: Yaani, “mjukuu wako.” Kiebrania kinasema kihalisi, “mwana wa mwanao.”
    reason: lexical_alternative
  - marker: c
    text: Au, “siku zako ziwe ndefu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן תִּירָא
  choice: ili umwogope
  rationale: Muundo huu unaonyesha kusudi au matokeo. Kitenzi ‘kuogopa’ kinahifadhi maana ya hofu, kicho, na heshima mbele za Mungu bila kuipunguza kuwa heshima pekee.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahwe Mungu wako
  rationale: Jina la agano יְהוָה limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili ‘Yahwe,’ na kiambishi cha nafsi katika אֱלֹהֶיךָ kimehifadhiwa katika ‘Mungu wako.’
- source_word: לִשְׁמֹר
  choice: kwa kuzishika
  rationale: Infinitivu hii inaeleza namna ambayo kumwogopa Yahwe kunaonekana. ‘Kwa kuzishika’ ni ya kawaida katika Kiswahili na hudumisha uhusiano huo wa njia.
- source_word: חֻקֹּתָיו וּמִצְוֺתָיו
  choice: sheria zake zote na amri zake
  rationale: ‘Sheria’ na ‘amri’ zinadumisha utofauti wa istilahi mbili za maagizo ya agano, huku kiwakilishi ‘zake’ kikirejelea Yahwe.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּךָ
  choice: ninazokuamuru
  rationale: Hii inaonyesha tendo la sasa la msemaji la kutoa amri bila kuingiza neno ‘leo,’ ambalo halimo katika mstari huu.
- source_word: אַתָּה וּבִנְךָ וּבֶן בִּנְךָ
  choice: wewe, mwanao, na mwana wa mwanao
  rationale: Orodha ya vizazi vitatu imehifadhiwa, na ‘wewe’ imetajwa wazi ili kubeba msisitizo wa Kiebrania.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: siku zote za maisha yako
  rationale: Tafsiri hii ni ya karibu na asili na ni Kiswahili cha kawaida kinachoonyesha muda wote wa maisha.
- source_word: וּלְמַעַן יַאֲרִכֻן יָמֶיךָ
  choice: na ili siku zako zipate kurefushwa
  rationale: ‘Na ili’ hudumisha kusudi au matokeo ya pili pamoja na kiunganishi; ‘siku zako zipate kurefushwa’ hubaki karibu na picha ya Kiebrania bila kuipanua kuwa ahadi ya jumla.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina la Mungu la herufi nne moja kwa moja. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya ירא kuelekezwa kwa Mungu
  choice: umwogope
  alternative: umstahi
  rationale: Katika muktadha huu kuogopa Mungu kunahusishwa na utii wa agano. ‘Umwogope’ huhifadhi mvutano wa hofu, kicho, na heshima badala ya kuufanya kuwa staha tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa wasomaji wa kawaida. Muundo wa vizazi vitatu na picha ya ‘siku’ umehifadhiwa, huku vistari virefu vikionyesha sehemu ya msisitizo.
