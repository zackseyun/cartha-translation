  text: 'Hear[a], Israel: Yahweh our God, Yahweh is one.'
translation:
  language: sw
  text: 'Sikia, Ee Israeli: Yahweh, Mungu wetu—Yahweh ni mmoja.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahweh ni Mungu wetu, Yahweh peke yake”; au, “Yahweh, Mungu wetu, ni Yahweh mmoja.” Maneno ya Kiebrania ni mafupi na yanaweza kuchanganuliwa kisintaksia kwa zaidi ya njia moja.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁמַע
  choice: Sikiliza
  rationale: Ni amri katika umoja inayomwelekea Israeli kama taifa moja. “Sikiliza” ni Kiswahili cha kawaida kinachoweza kuhusisha kusikia kwa makini na kutii mwito wa agano.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la taifa la agano; umbo “Israeli” ni la kawaida katika Kiswahili Sanifu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Linatunza jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania badala ya kulibadili kuwa cheo kama “BWANA.”
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Ingawa אֱלֹהִים ina umbo la wingi kisarufi, hapa hutumiwa kama jina la umoja la Mungu wa Israeli pamoja na kiambishi cha nafsi ya kwanza wingi.
- source_word: אֶחָד
  choice: mmoja
  rationale: Maana ya msingi ni “mmoja.” Katika Kiswahili, upatanisho na “Yahweh” kama nafsi unahitaji “mmoja”; uchaguzi huu haubadili kimya kimya maana kuwa “pekee.”
theological_decisions:
- issue: Sintaksia na maana ya sehemu ya mwisho ya Shema
  choice: Yahweh Mungu wetu, Yahweh ni mmoja
  alternative: Yahweh ni Mungu wetu, Yahweh peke yake; au, Yahweh Mungu wetu ni Yahweh mmoja
  rationale: Kiebrania kina vifungu visivyo na kitenzi kilichoandikwa, hivyo zaidi ya uchanganuzi mmoja wa kisintaksia unawezekana. Tafsiri kuu inadumisha dai la umoja bila kuongeza “peke yake,” huku tafsiri nyingine zinazowezekana zikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Ee Israeli” hutambulisha wazi mwito wa moja kwa moja bila kutumia lugha ya kizamani kupita kiasi; jina “Yahweh” limehifadhiwa.
