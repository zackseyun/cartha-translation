base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/020.yaml
  text: When your son asks you in time to come[a], saying[b], ‘What are the testimonies and the statutes and the judgments that Yahweh our God commanded you?’
translation:
  language: sw
  text: Hapo baadaye[a], mwanao atakapokuuliza akisema[b], “Shuhuda, kanuni na hukumu ambazo Yahweh, Mungu wetu, aliwaamuru ni nini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya neno kwa neno, “kesho”; hapa ni msemo unaorejelea wakati wa baadaye.
    reason: lexical_alternative
  - marker: b
    text: 'Swali hilo linaweza pia kutafsiriwa kwa maana inayodokezwa: “Shuhuda, kanuni na hukumu hizo zina maana gani?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wakati
  rationale: Katika muktadha huu neno hili linaanzisha hali inayotarajiwa kutokea wakati ujao, si sharti lisilo na uhakika.
- source_word: יִשְׁאָלְךָ
  choice: atakapokuuliza
  rationale: Hutoa kwa lugha ya kawaida kitendo cha mwana kumwuliza mzazi, huku umoja wa nafsi ya pili ukihifadhiwa.
- source_word: בִנְךָ
  choice: mwanao
  rationale: Kiebrania kinamtaja mwana wa kiume katika umoja; tafsiri haibadilishi kuwa neno lisiloonyesha jinsia.
- source_word: מָחָר
  choice: siku zijazo
  rationale: Maana ya msingi ni ‘kesho,’ lakini hapa limetumiwa kiidioma kumaanisha wakati wa baadaye kwa ujumla.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hutambulisha moja kwa moja maneno ya swali la mwana.
- source_word: מָה
  choice: ni nini
  rationale: Hufuata kwa karibu swali la moja kwa moja la Kiebrania bila kuongeza waziwazi wazo la ‘maana,’ ingawa muktadha unaashiria ombi la maelezo.
- source_word: הָעֵדֹת
  choice: shuhuda
  rationale: Huhifadhi wazo la masharti ya agano yanayoshuhudia na kulitofautisha na maneno mengine mawili ya kisheria.
- source_word: הַחֻקִּים
  choice: kanuni
  rationale: Ni neno la kawaida na linaloeleweka kwa masharti yaliyowekwa, na linabaki tofauti na ‘shuhuda’ na ‘hukumu.’
- source_word: הַמִּשְׁפָּטִים
  choice: hukumu
  rationale: Huhifadhi uzito wa kisheria wa maamuzi au masharti ya haki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetafsiriwa kama jina binafsi, si kubadilishwa na cheo.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Huhifadhi umilikishi wa wingi na uhusiano wa agano unaoelezwa katika Kiebrania.
- source_word: צִוָּה ... אֶתְכֶם
  choice: aliwaamuru ninyi
  rationale: Kiwakilishi cha Kiebrania ni wingi. ‘Ninyi’ kimewekwa wazi ili kutofautisha wale walioamriwa na mwana mmoja anayezungumza.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ina jina la agano la Mungu moja kwa moja; ‘Yahweh’ huhifadhi jina hilo badala ya kuliwakilisha kwa cheo.
- issue: Jinsia ya neno בִנְךָ
  choice: mwanao
  alternative: mtoto wako
  rationale: Neno la Kiebrania ni la kiume na la umoja, hivyo ‘mwanao’ huhifadhi taarifa hiyo.
- issue: Iwapo מָה lifafanuliwe kuwa swali kuhusu maana
  choice: ni nini
  alternative: zina maana gani
  rationale: Kiebrania kinauliza moja kwa moja ‘ni nini’; tafsiri kuu inahifadhi muundo huo na tanbihi inaeleza maana inayodokezwa na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. ‘Aliwaamuru ninyi’ linaweka wazi kwamba kiambishi cha nafsi ya pili katika Kiebrania ni cha wingi, ingawa mwana anayezungumza ni mmoja.
