- from: Wakati mwanao atakapokuuliza siku zijazo[a] akisema[b], “Shuhuda, kanuni na hukumu ambazo Yahweh Mungu wetu aliwaamuru ninyi ni nini?”
  to: Hapo baadaye[a], mwanao atakapokuuliza akisema[b], “Shuhuda, kanuni na hukumu ambazo Yahweh, Mungu wetu, aliwaamuru ni nini?”
  rationale: The revision makes the future-time idiom natural in Standard East African Swahili, removes an unwarranted emphatic pronoun while retaining the plural object in ‘aliwaamuru,’ and corrects the wording of footnote a. It otherwise preserves the draft’s source-faithful wording and its differentiated legal vocabulary.
