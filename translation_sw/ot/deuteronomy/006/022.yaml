base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/022.yaml
  text: And Yahweh gave great and grievous signs and wonders in Egypt[a], against Pharaoh and against all his house[b], before our eyes.
translation:
  language: sw
  text: Naye Yahweh akatoa ishara na maajabu—makubwa na ya kutisha—huko Misri[a], dhidi ya Farao na nyumba yake yote, mbele ya macho yetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhidi ya Misri.” Kihusishi cha Kiebrania kinaweza kuonyesha mahali, “huko Misri,” au, katika muktadha huu, kwamba Misri ndiyo mlengwa wa hukumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: akatoa
  rationale: Kitenzi נתן kimsingi ni ‘kutoa/kuweka’; ‘akatoa’ huhifadhi taswira ya Kiebrania na ni ya kawaida katika Kiswahili kuliko tafsiri ya kufafanua kama ‘akafanya’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetoholewa kuwa ‘Yahweh’ badala ya kubadilishwa na cheo.
- source_word: אוֹתֹת וּמֹפְתִים
  choice: ishara na maajabu
  rationale: Jozi hii ya kawaida huhifadhi tofauti kati ya ishara zenye maana na matendo yanayostaajabisha.
- source_word: גְּדֹלִים וְרָעִים
  choice: makubwa na ya kutisha
  rationale: גדלים huonyesha ukubwa, na רעים hapa huonyesha athari mbaya na ya kuogofya ya mapigo, si uovu wa kimaadili.
- source_word: בְּמִצְרַיִם
  choice: huko Misri
  rationale: ב inasomwa kwa maana ya mahali, ‘katika/huko Misri’; ukinzani unaelezwa wazi zaidi na vifungu vinavyofuata kuhusu Farao na nyumba yake.
- source_word: בְּפַרְעֹה וּבְכָל־בֵּיתוֹ
  choice: dhidi ya Farao na nyumba yake yote
  rationale: Katika muktadha wa hukumu, ב humtaja Farao na nyumba yake kuwa walengwa; ‘nyumba’ huhifadhi nahau ya Kiebrania inayoweza kumaanisha watu wa nyumbani au jamaa yake kwa upana.
- source_word: לְעֵינֵינוּ
  choice: mbele ya macho yetu
  rationale: Hii ni tafsiri asilia na yenye uhai ya nahau inayomaanisha jambo lililotendeka huku wasemaji wakiliona moja kwa moja.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi la Mungu; kulitohlea huhifadhi tofauti kati ya jina hilo na cheo.
- issue: Maana ya וְרָעִים kuhusu ishara na maajabu ya Mungu
  choice: ya kutisha
  alternative: yenye madhara; mabaya
  rationale: Katika muktadha wa mapigo, neno linaeleza ukali na athari yenye maafa. ‘Mabaya’ lingeweza kueleweka kimakosa kuwa matendo hayo yalikuwa maovu kimaadili.
- issue: Maana ya בְּמִצְרַיִם
  choice: huko Misri
  alternative: dhidi ya Misri
  rationale: Kihusishi ב kinaweza kuonyesha mahali au mlengwa katika muktadha huu. Tafsiri kuu huhifadhi maana ya mahali, huku tanbihi ikitunza uwezekano wa maana ya kuelekezwa dhidi ya Misri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Naye’ huunganisha aya na simulizi iliyotangulia. ‘Nyumba yake yote’ huhifadhi nahau ya Kiebrania bila kuifinya kuwa jengo pekee.
