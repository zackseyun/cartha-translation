base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/007.yaml
  text: You shall teach them diligently to your sons[a], and you shall speak of them when you sit in your house, and when you walk on the road, and when you lie down[b], and when you rise.
translation:
  language: sw
  text: Uyafundishe kwa bidii[a] wana wako[b], nawe uyazungumzie unapoketi nyumbani mwako, unapotembea njiani, unapolala, na unapoamka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uyakaze katika akili zao.” Kitenzi cha Kiebrania kwa maana ya msingi kinahusiana na kunoa; hapa kimetumiwa kisitiari kuhusu kufundisha kwa kurudia na kwa makini.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania “wana wako”; kwa maana pana, agizo hili linawahusu watu wa nyumbani pia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנַּנְתָּם
  choice: Uyafundishe kwa bidii
  rationale: Kitenzi שׁנן kwa maana ya msingi huhusiana na kunoa, lakini hapa kimetumiwa kisitiari kumaanisha kufundisha kwa kurudia, kwa makini na kwa juhudi. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha uzito wa agizo.
- source_word: לְבָנֶיךָ
  choice: wana wako
  rationale: בנים ni wingi wa בן, ‘mwana,’ pamoja na kiambishi cha nafsi ya pili umoja. ‘Wana wako’ inadumisha umbo la chanzo bila kulibadili moja kwa moja kuwa ‘watoto wako.’
- source_word: וְדִבַּרְתָּ בָּם
  choice: nawe uyazungumzie
  rationale: Kitenzi דבר pamoja na ב hapa kwa kawaida humaanisha kusema au kuzungumza kuhusu mambo hayo. ‘Uyazungumzie’ ni fasaha, ya sasa, na hurejelea maneno yaliyo katika muktadha.
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: unapoketi nyumbani mwako
  rationale: Muundo wa ב pamoja na kitenzi-jina unaonyesha wakati au hali inayojirudia. ‘Unapoketi nyumbani mwako’ ni fupi na ya kawaida.
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: unapotembea njiani
  rationale: דרך ni njia au barabara. ‘Kutembea njiani’ huwasilisha kwa kawaida hali ya kuwa safarini bila kuongeza maana isiyokuwapo katika chanzo.
- source_word: וּבְשָׁכְבְּךָ
  choice: unapolala
  rationale: Kirai hiki hutaja wakati wa kulala au kujilaza. ‘Unapolala’ ni tafsiri ya kawaida na iliyo wazi katika Kiswahili.
- source_word: וּבְקוּמֶךָ
  choice: unapoamka
  rationale: Ingawa קום kimsingi ni kuinuka, katika ulinganifu wake na kulala hapa inarejelea kuamka au kuinuka baada ya usingizi. ‘Unapoamka’ huwasilisha maana hiyo kwa kawaida.
theological_decisions:
- issue: Neno la kijinsia kwa wazao wanaopokea mafundisho ya agano
  choice: wana wako
  alternative: watoto wako
  rationale: Chanzo kina בנים, yaani ‘wana’ katika wingi wa kiume. Matini kuu inadumisha umbo hilo, huku tanbihi ikieleza kuwa agizo lina matumizi mapana katika nyumba bila kubadili neno la chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mfuatano wa ‘unapo-’ unadumisha mpangilio wa maisha ya kila siku katika Kiebrania, na viunganishi vimepunguzwa kiasi ili sentensi isikike kwa kawaida bila kupoteza ulinganifu wake.
