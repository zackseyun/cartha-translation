  text: לֹ֣א תְנַסּ֔וּ אֶת יְהוָ֖ה אֱלֹהֵי/כֶ֑ם כַּ/אֲשֶׁ֥ר נִסִּיתֶ֖ם בַּ/מַּסָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/016.yaml
  text: You shall not test Yahweh your God[b][a], as you tested him at Massah.
translation:
  language: sw
  text: Msimjaribu Yahweh Mungu wenu[b], kama mlivyomjaribu huko Masa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Masa ni mahali ambapo Israeli walimjaribu Yahweh nyikani (Kutoka 17:1–7); jina hilo linahusishwa na maana ya “kujaribu.”
    reason: cross_reference
  - marker: b
    text: Au, “Msimtie Yahweh Mungu wenu katika jaribu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: msi-
  rationale: Kikanushi katika katazo kwa nafsi ya pili wingi; huunganishwa na kitenzi katika Kiswahili.
- source_word: תְנַסּוּ
  choice: mjaribu
  rationale: Piel imperfect nafsi ya pili wingi ya נסה katika katazo. ‘Mjaribu’ ni lugha ya kawaida na inadumisha uhusiano wa kileksia na kitenzi hicho hicho katika kishazi kinachofuata.
- source_word: אֶת
  choice: '[kiashiria cha yambwa mahsusi, hakitafsiriwi]'
  rationale: Huashiria yambwa mahsusi katika Kiebrania; Kiswahili hakihitaji neno tofauti hapa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ni uhawilishaji wa jina la Mungu יהוה, badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Umbo la uambatano lenye kiambishi cha nafsi ya pili wingi; ‘Mungu wenu’ ni tafsiri ya moja kwa moja na ya asili.
- source_word: כַּאֲשֶׁר
  choice: kama
  rationale: Huanzisha ulinganisho na tukio la awali kwa lugha ya kawaida ya Kiswahili.
- source_word: נִסִּיתֶם
  choice: mlivyomjaribu
  rationale: Piel perfect nafsi ya pili wingi ya נסה. Kurudia mzizi ‘jaribu’ kunahifadhi mwangwi wa kimakusudi uliomo katika Kiebrania.
- source_word: בַּמַּסָּה
  choice: huko Masa
  rationale: Masa ni jina la mahali. ‘Huko’ huonyesha rejeo la mahali pa tukio bila kutafsiri jina hilo ndani ya matini.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania inatumia moja kwa moja jina la Mungu יהוה; ‘Yahweh’ huhifadhi jina hilo badala ya kuweka cheo mahali pake.
- issue: Iwapo kueleza wazi katika matini kuu uhusiano na Kutoka 17
  choice: Kudumisha jina la mahali ‘Masa’ bila kulipanua
  alternative: huko Masa, mahali pa kujaribu
  rationale: Kiebrania kinatoa jina la mahali pekee. Maelezo ya tukio na maana inayohusishwa na jina yanafaa kuwekwa katika tanbihi ili kuepuka kuongeza maneno katika matini kuu.
- issue: Maana ya נסה katika katazo
  choice: mjaribu
  alternative: msimtie katika jaribu
  rationale: ‘Mjaribu’ ni fupi, ya asili, na hudumisha utata halisi wa kitenzi kati ya kujaribu na kumweka mtu kwenye mtihani, huku njia nyingine ikitolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Katazo la wingi ‘Msimjaribu’ na ‘Mungu wenu’ linaonyesha kuwa Musa anawahutubia Waisraeli kwa pamoja. Jina ‘Masa’ limehifadhiwa kama jina la mahali, na mzizi ‘jaribu’ umerudiwa ili kuakisi urudiaji wa נסה katika Kiebrania.
