source:
  edition: WLC
  text: וְ/זֹ֣את הַ/מִּצְוָ֗ה הַֽ/חֻקִּים֙ וְ/הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵי/כֶ֖ם לְ/לַמֵּ֣ד אֶתְ/כֶ֑ם לַ/עֲשׂ֣וֹת בָּ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/001.yaml
  text: This is the commandment—the statutes and the judgments—that Yahweh your God commanded to teach you[a], so that you may do them in the land into which you are crossing[c][b], to possess it.
translation:
  language: sw
  text: Hii[a] ndiyo amri—kanuni na hukumu—ambayo Yahwe[b] Mungu wenu aliwaamuru kuwafundisha, ili mzitende katika nchi mnayovuka kwenda kuimiliki[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na hii ndiyo amri—kanuni na hukumu.” Kiunganishi cha mwanzo kinaweza kutafsiriwa “na.”
    reason: lexical_alternative
  - marker: b
    text: “Yahwe” ni unukuzi wa jina la Kiebrania YHWH; tafsiri nyingine hutumia “BWANA.”
    reason: alternative_reading
  - marker: c
    text: Au, “kwenda kuitwaa iwe milki yenu” au “kwenda kuirithi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Hii ndiyo
  rationale: Kifungu hiki kinaanzisha sehemu mpya huku kikiunganisha na yaliyotangulia. Kiswahili cha kawaida hakihitaji kuanza na kiunganishi, lakini uwezekano wa ‘Na hii ndiyo’ umeonyeshwa katika tanbihi.
- source_word: הַמִּצְוָה
  choice: amri
  rationale: Umoja umehifadhiwa kwa kuwa neno hili linafanya kazi kama kichwa au muhtasari wa mafundisho ya agano yanayofafanuliwa na maneno yanayofuata.
- source_word: הַחֻקִּים
  choice: kanuni
  rationale: Neno hili linaonyesha masharti au maagizo yaliyowekwa. ‘Kanuni’ ni neno la heshima na linaloeleweka katika Kiswahili cha sasa.
- source_word: וְהַמִּשְׁפָּטִים
  choice: na hukumu
  rationale: ‘Hukumu’ huhifadhi maana ya maamuzi au maagizo ya kisheria na kuitofautisha na ‘kanuni.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetafsiriwa kwa unukuzi wa Kiswahili badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Kiambishi cha nafsi ya pili wingi kimeonyeshwa moja kwa moja kwa ‘wenu.’
- source_word: לְלַמֵּד אֶתְכֶם
  choice: niwafundishe
  rationale: Kiebrania hakitaji wazi mtendaji wa kufundisha, lakini muktadha unamtambulisha Musa kuwa msemaji na mwalimu. Kiswahili huhitaji kutaja mtendaji kwa uwazi ili sentensi iwe ya kawaida; maana ya msingi ya kuwafundisha wasikilizaji imehifadhiwa.
- source_word: לַעֲשׂוֹת
  choice: ili mzitende
  rationale: ‘Ili’ huonyesha kusudi la kufundishwa, na ‘zi-’ hurejelea kanuni na hukumu bila kutumia kitenzi cha kufasiri zaidi kama ‘kuzishika.’
- source_word: בָּאָרֶץ אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: katika nchi mnayovuka kwenda
  rationale: Tafsiri hii huhifadhi mwendo wa kuvuka kuelekea nchini bila kuongeza mahali maalumu pasipotajwa katika mstari.
- source_word: לְרִשְׁתָּהּ
  choice: kuimiliki
  rationale: Kitenzi kinaweza kumaanisha kumiliki, kutwaa kuwa milki, au kurithi. ‘Kuimiliki’ ni kifupi na kinahifadhi lengo la kuingia katika nchi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha na cheo.
- issue: Uhusiano wa ‘amri’ ya umoja na ‘kanuni na hukumu’ za wingi
  choice: Kuhifadhi umoja kama kichwa cha pamoja kinachofafanuliwa na makundi ya wingi
  alternative: 'Kusawazisha yote kuwa wingi: ‘amri, kanuni na hukumu’'
  rationale: Tofauti ya idadi ipo katika Kiebrania na huenda inaonyesha muhtasari unaofuatiwa na ufafanuzi; haipaswi kuondolewa kimyakimya.
- issue: Mtendaji asiyeelezwa wa ‘kuwafundisha’
  choice: 'Kumtaja Musa kwa kiambishi cha nafsi ya kwanza: ‘niwafundishe’'
  alternative: ‘aliamuru mfundishwe’ au kwa karibu zaidi ‘aliamuru kuwafundisha’
  rationale: Muktadha humtambulisha Musa kuwa msemaji, na Kiswahili asilia huhitaji muundo ulio wazi. Chaguo hili halibadili chanzo cha amri wala walengwa wa mafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wazi na wa kisasa. Alama za vistari virefu zinaonyesha kwamba ‘kanuni na hukumu’ zinafafanua ‘amri’ ya umoja. Msamiati wa kisheria umehifadhiwa bila kufanya sentensi kuwa nzito kupita kiasi.
