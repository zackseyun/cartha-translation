  yaml_path: translation/ot/deuteronomy/006/013.yaml
  text: You shall fear Yahweh your God[a], and him you shall serve[b], and by his name you shall swear.
translation:
  language: sw
  text: Utamcha Yahwe, Mungu wako[a], utamtumikia yeye[b], na utaapa kwa jina lake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utamheshimu Yahwe, Mungu wako kwa kicho”; kitenzi cha Kiebrania kinajumuisha hofu yenye staha na kicho, si woga mtupu.
    reason: lexical_alternative
  - marker: b
    text: Au “utamwabudu”; kitenzi cha Kiebrania kwa kawaida humaanisha “kutumikia,” na katika muktadha huu kinajumuisha huduma ya ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa na cheo kama “BWANA,” hivyo kuhifadhi jina binafsi katika maandishi ya Kiebrania.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Muundo huu una kiambishi cha nafsi ya pili, umoja, kiume; “Mungu wako” ni tafsiri ya asili na ya moja kwa moja katika Kiswahili.
- source_word: תִּירָא
  choice: utamcha
  rationale: Kitenzi “kumcha” huhifadhi wazo la hofu yenye staha, kicho na mshangao mbele za Mungu, bila kulipunguza kuwa hofu ya kutishwa tu.
- source_word: וְאֹתוֹ
  choice: utamtumikia yeye
  rationale: Kiwakilishi cha wazi cha Kiebrania kimehifadhiwa kwa “yeye” ili kuonyesha msisitizo. Neno “peke yake” halijaongezwa kwa sababu halipo wazi katika mstari huu.
- source_word: תַעֲבֹד
  choice: utamtumikia
  rationale: “Kutumikia” huhifadhi upana wa maana ya עבד, ikijumuisha utiifu na huduma ya agano pamoja na ibada, bila kuifinya iwe tendo la ibada pekee.
- source_word: וּבִשְׁמוֹ
  choice: na kwa jina lake
  rationale: Katika muktadha wa kiapo, kihusishi ב kinaonyesha jina linaloitwa kama msingi au mamlaka ya kiapo; “kwa jina lake” ni usemi wa kawaida wa Kiswahili.
- source_word: תִּשָּׁבֵעַ
  choice: utaapa
  rationale: Niphal ya שׁבע humaanisha kuapa au kula kiapo. “Utaapa” ni fupi, wazi na ya kawaida katika muundo “kwa jina lake.”
- source_word: אֶת
  choice: '[halijatafsiriwa kando]'
  rationale: Hiki ni kiashiria cha yambwa maalumu kisicho na neno la moja kwa moja katika Kiswahili; kazi yake imewakilishwa na muundo wa sentensi.
theological_decisions:
- issue: Iwapo maana ya תִּירָא ipunguzwe kuwa “kumheshimu” badala ya “kumcha”
  choice: Kudumisha “utamcha” katika matini kuu
  alternative: “utamheshimu kwa kicho” au “utakuwa na kicho kwake”
  rationale: Kitenzi cha Kiebrania kinahusisha hofu yenye staha na kicho, si woga mtupu. “Kumcha” huhifadhi uzito wa agano na mvutano kati ya kicho, utiifu na hofu takatifu.
- issue: Iwapo עבד itafsiriwe “kutumikia” au “kuabudu”
  choice: Kutumia “utamtumikia”
  alternative: “utamwabudu”
  rationale: Amri inahusu uaminifu kwa Mungu unaoonyeshwa kwa huduma. “Kutumikia” huhifadhi upana wa neno la Kiebrania, huku maana ya ibada ikiendelea kuwamo katika muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Yahwe” limetumiwa kama umbo la kawaida la Kiswahili la jina la Mungu. Muundo “utamtumikia yeye” una msisitizo wa makusudi unaolingana na kiwakilishi cha wazi cha Kiebrania.
