base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/010.yaml
  text: And when Yahweh your God brings you into the land that he swore to your fathers—to Abraham[a], to Isaac, and to Jacob—to give you, with great and good cities that you did not build,
translation:
  language: sw
  text: Na Yahweh, Mungu wako, atakapokuingiza katika nchi aliyowaapia baba zako—Abrahamu[a], Isaka, na Yakobo—kwamba atakupa miji mikubwa na mizuri ambayo hukuijenga,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mababu zako.” Kiebrania kinasema “baba zako,” na muktadha unawataja hasa Abrahamu, Isaka, na Yakobo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Na ... atakapokuingiza
  rationale: Muundo huu unaanzisha hali ya wakati ujao inayofuata. Kiswahili cha ‘Na ... atakapo-’ huhifadhi kiunganishi na maana ya ‘wakati’ kwa lugha ya kawaida.
- source_word: יְבִיאֲךָ
  choice: atakapokuingiza
  rationale: Hifili ya בוא ina maana ya kusababisha mtu aingie; ‘kukuingiza’ huhifadhi maana hiyo kwa ufupi na kwa Kiswahili asilia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Muundo wenye kiambishi cha nafsi ya pili umoja unaonyesha umilikaji moja kwa moja.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha wa ahadi ya agano, ‘nchi’ ni tafsiri ya kawaida na ya asili ya הארץ.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: aliyowaapia
  rationale: Kitenzi נשבע humaanisha kuapa; ‘aliyowaapia’ huhifadhi lugha ya kiapo na walengwa wake.
- source_word: לַאֲבֹתֶיךָ
  choice: baba zako
  rationale: Neno la Kiebrania ni la kiume katika wingi na hapa linawataja hasa Abrahamu, Isaka, na Yakobo.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Abrahamu, Isaka, na Yakobo
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili; uhusiano wa ‘kwa’ umejumuishwa tayari katika ‘baba zako’ na kitenzi ‘aliyowaapia’.
- source_word: לָתֶת לָךְ
  choice: kwamba atakupa
  rationale: ‘Kwamba atakupa’ huunganisha kwa uwazi kusudi na maudhui ya kiapo katika Kiswahili cha kawaida.
- source_word: עָרִים גְּדֹלֹת וְטֹבֹת
  choice: miji mikubwa na mizuri
  rationale: ‘Mikubwa’ huhifadhi wazo la ukubwa, na ‘mizuri’ huonyesha ubora au hali ya kutamanika bila kuongeza dhana ya ustawi.
- source_word: אֲשֶׁר לֹא בָנִיתָ
  choice: ambayo hukuijenga
  rationale: Kishazi rejeshi na ukanushi wa tendo lililopita vimetolewa moja kwa moja na kwa njia ya kawaida.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Matini ina jina la agano moja kwa moja; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Neno la undugu לַאֲבֹתֶיךָ
  choice: baba zako
  alternative: mababu zako
  rationale: ‘Baba zako’ hufuata jinsia ya neno la chanzo na inafaa kwa sababu Abrahamu, Isaka, na Yakobo wanatajwa wazi; tanbihi inaonyesha tafsiri pana inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mstari umehifadhiwa kama sentensi inayoendelea hadi mstari unaofuata; koma ya mwisho inaonyesha mwendelezo huo.
