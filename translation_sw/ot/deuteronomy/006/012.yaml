  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֑ה אֲשֶׁ֧ר הוֹצִֽיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/012.yaml
  text: Be careful lest you forget Yahweh[a], who brought you out of the land of Egypt, out of the house of servants.
translation:
  language: sw
  text: Jihadhari usije ukamsahau Yahwe, aliyekutoa katika nchi ya Misri, kutoka katika nyumba ya watumwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa lugha ya kawaida zaidi, “nyumba ya utumwa.” Kiebrania ni kihalisi “nyumba ya watumwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Jihadhari
  rationale: Amri ya Nafali pamoja na לְךָ inaleta onyo la mtu kujilinda mwenyewe. “Jihadhari” ni Kiswahili cha sasa, cha kawaida, na kinadumisha nguvu ya amri.
- source_word: פֶּן תִּשְׁכַּח
  choice: usije ukamsahau
  rationale: פֶּן huanzisha jambo linalopaswa kuepukwa. Muundo “usije uka-” unaeleza onyo hilo kwa Kiswahili cha asili, huku “-m-” ikimtaja Yahwe kama anayelengwa na kitendo cha kusahau.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo kama “BWANA.” Tahajia “Yahwe” inafuata matamshi yanayotumiwa kwa kawaida katika Kiswahili.
- source_word: הוֹצִיאֲךָ
  choice: aliyekutoa
  rationale: Hifili ya יצא katika simulizi la Kutoka humaanisha kusababisha mtu atoke, yaani “kumtoa.” Muundo huu ni mfupi na wa kawaida katika Kiswahili.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Neno אֶרֶץ limedumishwa wazi kwa “nchi,” na kihusishi “katika” baada ya kitenzi “kutoa” huonyesha mahali alikotolewa mtu.
- source_word: מִבֵּית עֲבָדִים
  choice: kutoka katika nyumba ya watumwa
  rationale: 'Tafsiri hii inadumisha picha halisi ya Kiebrania: בֵּית ni “nyumba” na עֲבָדִים ni wingi halisi, “watumwa.” Kurudia “kutoka katika” kunafanya uhusiano na tendo la kutolewa uwe wazi kwa Kiswahili.'
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi jina hilo bila kulibadilisha kuwa “BWANA”; “Yehova” ni umbo jingine la mapokeo.
- issue: Jinsi ya kutafsiri עֲבָדִים katika kauli ya Kutoka
  choice: watumwa
  alternative: utumwa; watumishi
  rationale: Nomino ya Kiebrania ni wingi halisi na katika muktadha huu inahusu hali ya kulazimishwa kuwa watumwa. “Watumwa” hudumisha umbo hilo na uzito wa kihistoria; tanbihi inatoa usemi wa hali dhahania ulio wa kawaida zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima lakini unaoeleweka kwa urahisi. “Jihadhari usije uka-” ni onyo la kawaida na zito. Alama ya tanbihi imewekwa baada ya kirai kinachoelezewa, “nyumba ya watumwa.”
