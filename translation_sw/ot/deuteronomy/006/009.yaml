translation:
  language: sw
  text: Na utayaandika juu ya miimo ya milango ya nyumba yako na kwenye malango yako.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “fremu za milango.” Neno la Kiebrania linarejelea hasa miimo ya pembeni ya mlango.
    reason: lexical_alternative
  - marker: b
    text: Au “na juu ya malango yako” au “na kwenye viingilio vyako.” Neno la Kiebrania linaweza kurejelea lango lenyewe au eneo la kuingilia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: Nawe utayaandika
  rationale: Kitenzi katika mfululizo huu wa maagizo kina nguvu ya amri inayotazama mbele. Kiambishi cha yambwa cha wingi kinarejelea maneno yaliyotajwa katika muktadha uliotangulia, na kimehifadhiwa kwa “-ya-”.
- source_word: עַל
  choice: juu ya
  rationale: Hueleza mahali ambapo maandishi yatawekwa; “juu ya” ni Kiswahili cha kawaida na cha wazi katika muktadha huu.
- source_word: מְזוּזֹת
  choice: miimo ya milango
  rationale: Neno la Kiebrania linamaanisha hasa nguzo za pembeni za nafasi ya mlango. “Miimo ya milango” ni sahihi na inaeleweka katika Kiswahili sanifu.
- source_word: בֵּיתֶךָ
  choice: ya nyumba yako
  rationale: “Nyumba” huhifadhi maana halisi ya jengo na mazingira ya kaya yaliyomo katika neno בַּיִת.
- source_word: וּבִשְׁעָרֶיךָ
  choice: na juu ya malango yako
  rationale: שַׁעַר linaweza kutaja lango au eneo la kuingilia. “Malango yako” huhifadhi wingi na ulinganifu wa kishazi, huku tanbihi ikionyesha uwezekano wa maana pana zaidi.
