  text: וְ/אוֹתָ֖/נוּ הוֹצִ֣יא מִ/שָּׁ֑ם לְמַ֨עַן֙ הָבִ֣יא אֹתָ֔/נוּ לָ֤/תֶת לָ֨/נוּ֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/023.yaml
  text: And he brought us out from there[a], so that he might bring us in, to give us the land that he swore to our fathers.
translation:
  language: sw
  text: Naye alitutoa huko ili atuingize na kutupa nchi ambayo aliwaapia baba zetu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “mababu zetu.” Kiebrania: “baba zetu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוֹתָנוּ הוֹצִיא מִשָּׁם
  choice: Naye alitutoa huko
  rationale: Muundo huu wa Kiswahili ni wa kawaida na unahifadhi mwendelezo wa simulizi pamoja na maana ya Hiphil ya יצא, ‘kutoa/kuleta nje.’
- source_word: לְמַעַן
  choice: ili
  rationale: ‘Ili’ linaonyesha wazi kusudi la tendo, kama kiunganishi cha Kiebrania.
- source_word: הָבִיא אֹתָנוּ
  choice: atuingize
  rationale: Kitenzi hiki kinahifadhi maana ya kusababisha kuingia na pia utofautishaji wa kutoka na kuingia uliomo katika Kiebrania.
- source_word: לָתֶת לָנוּ
  choice: na kutupa
  rationale: Kishazi hiki kinaendeleza kusudi la kutuingiza na kinasikika kwa kawaida katika Kiswahili.
- source_word: אֶת־הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha wa agano wa Kumbukumbu la Torati, neno hili linarejelea nchi iliyoahidiwa; ‘nchi’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: ambayo aliwaapia
  rationale: ‘Aliwaapia’ linadumisha lugha ya kiapo badala ya kuifanya kuwa ahadi ya kawaida tu.
- source_word: לַאֲבֹתֵינוּ
  choice: baba zetu
  rationale: Hili linadumisha umbo la kiume la Kiebrania na uhusiano wa agano na baba wa Israeli; ‘mababu zetu’ ni njia nyingine inayowezekana.
theological_decisions:
- issue: Rejeo la agano lenye jinsia katika לַאֲבֹתֵינוּ
  choice: baba zetu
  alternative: mababu zetu
  rationale: Kiebrania kina nomino ya kiume ya wingi, ambayo katika muktadha inawaelekea baba wa Israeli. Tafsiri kuu inadumisha usemi huo, huku tanbihi ikitoa njia ya kueleza maana pana ya waliotangulia.
- issue: Lugha ya kiapo cha agano katika נִשְׁבַּע
  choice: aliwaapia
  alternative: aliwaahidi
  rationale: Kitenzi cha Kiebrania kinaonyesha kuapa, si kutoa ahadi ya kawaida pekee; kwa hiyo lugha ya kiapo inadumishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni nyepesi kueleweka, huku mlingano wa ‘alitutoa’ na ‘atuingize’ pamoja na lugha ya kiapo ukidumishwa.
