  text: And these words that I am commanding you today shall be on your heart[a].
translation:
  language: sw
  text: Na maneno haya ninayokuamuru leo yatakuwa moyoni mwako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “juu ya moyo wako.” Hii ni nahau ya Kiebrania inayomaanisha kuyashikilia maneno haya daima katika maisha yako ya ndani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: yatakuwa
  rationale: Katika muktadha huu, umbo hili lina nguvu ya maagizo yenye mwelekeo wa wakati ujao; “yatakuwa” huhifadhi kauli hiyo kwa Kiswahili cha kawaida.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: maneno haya
  rationale: “Maneno” ndiyo maana ya moja kwa moja hapa na hurejelea yale ambayo Musa anawaamuru, bila kuyafasiri mapema kuwa “amri.”
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ
  choice: ninayokuamuru
  rationale: Kitenzi cha wakati wa sasa kinaonyesha tendo la kuamuru linalofanyika katika hotuba hii; nafsi ya kwanza imeonyeshwa kiasili ndani ya kitenzi cha Kiswahili.
- source_word: הַיּוֹם
  choice: leo
  rationale: “Leo” huhifadhi ukaribu wa wakati katika hotuba ya Musa na ni Kiswahili cha sasa na cha kawaida.
- source_word: עַל לְבָבֶךָ
  choice: moyoni mwako
  rationale: Kiswahili kwa kawaida huweka jambo “moyoni,” hivyo usemi huu unawasilisha kwa ufasaha maana ya maneno kudumu katika maisha ya ndani, huku tanbihi ikihifadhi taswira halisi ya Kiebrania.
theological_decisions:
- issue: Nahau ya kianthropolojia ya לְבָב
  choice: moyo
  alternative: akili; utu wa ndani
  rationale: “Moyo” huhifadhi taswira ya kibiblia inayojumuisha fikira, nia, na hisia, bila kuibana maana iwe akili peke yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Moyoni mwako” ni nahau asilia zaidi ya Kiswahili kuliko “juu ya moyo wako”; tanbihi inaonyesha kwa uwazi umbo la Kiebrania.
