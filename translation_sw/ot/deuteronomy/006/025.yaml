base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/025.yaml
  text: And it will be righteousness for us if we are careful to do all this commandment before Yahweh our God[b][a], as he has commanded us.
translation:
  language: sw
  text: Na itakuwa haki[a] kwetu ikiwa tutakuwa waangalifu kutenda amri hii yote[b] mbele za Yahwe Mungu wetu, kama alivyotuamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uadilifu.” Neno la Kiebrania צְדָקָה linaweza kumaanisha yaliyo sawa au ya haki; hapa “haki” linafaa katika muktadha wa agano.
    reason: lexical_alternative
  - marker: b
    text: Au “amri hii nzima.” Umoja wa neno “amri” huenda unarejelea mafundisho hayo kama jumla moja iliyoungana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְדָקָה
  choice: haki
  rationale: Neno “haki” linahifadhi maana ya צְדָקָה kuwa hali au jambo lililo sawa na la haki katika uhusiano wa agano, bila kuingiza kwa lazima istilahi ya baadaye ya kuhesabiwa haki.
- source_word: תִּהְיֶה לָּנוּ
  choice: itakuwa ... kwetu
  rationale: Muundo huu unafuata kishazi cha Kiebrania cha kiarifu, “itakuwa haki kwetu,” na huepuka kuongeza wazo la “kuhesabiwa” ambalo halijasemwa wazi.
- source_word: כִּי
  choice: ikiwa
  rationale: Katika muktadha huu כִּי linaanzisha sharti ambalo chini yake jambo lililotangulia litakuwa kweli; “ikiwa” linaonyesha uhusiano huo kwa kawaida katika Kiswahili.
- source_word: נִשְׁמֹר
  choice: tutakuwa waangalifu
  rationale: שׁמר likifuatiwa na kitenzi cha kutenda linaonyesha uangalifu katika kushika na kutekeleza; tafsiri hii inahifadhi uzito huo.
- source_word: לַעֲשׂוֹת
  choice: kutenda
  rationale: “Kutenda” ni tafsiri ya kawaida na yenye hadhi ya עשה hapa, na inaeleza utekelezaji halisi wa amri.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: amri hii yote
  rationale: Umoja wa מִצְוָה umehifadhiwa, huku כָּל likionyesha amri hiyo kama jumla moja kamili ya maagizo.
- source_word: לִפְנֵי
  choice: mbele za
  rationale: “Mbele za” linatoa maana ya kuwa katika uwepo na chini ya uangalizi wa Mungu katika muktadha wa agano.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kama “Yahwe” badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Tafsiri hii inahifadhi uhusiano wa agano unaoonyeshwa na kiambishi cha nafsi ya kwanza wingi.
- source_word: כַּאֲשֶׁר צִוָּנוּ
  choice: kama alivyotuamuru
  rationale: Tafsiri hii inaonyesha kwamba Yahwe ndiye aliyetoa amri hiyo hapo awali na kwamba utiifu unaelekezwa kwa amri aliyokwisha kutoa.
theological_decisions:
- issue: Maana ya “haki” katika muktadha wa utiifu wa agano
  choice: Utiifu huo “utakuwa haki kwetu,” kwa maana ya kuwa sawa mbele za Mungu katika uhusiano wa agano, bila kufafanua utaratibu wa kiteolojia wa baadaye.
  alternative: Kutafsiri kuwa “tutahesabiwa haki,” au kuelewa neno hilo hasa kama “usawa wa kijamii.”
  rationale: Kiebrania kinaunganisha kwa dhati utiifu wa agano na haki, lakini hakisemi wazi kwamba haki hiyo “inahesabiwa” kwa maana maalumu ya kitaalamu. Muundo wa chanzo na mvutano wake wa kiteolojia umehifadhiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “itakuwa haki kwetu” ni rasmi kidogo lakini umechaguliwa ili kuhifadhi kwa uaminifu kauli ya Kiebrania na kuepuka kuongeza wazo la “kuhesabiwa.”
