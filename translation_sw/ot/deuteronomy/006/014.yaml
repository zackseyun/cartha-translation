  yaml_path: translation/ot/deuteronomy/006/014.yaml
  text: You shall not go after other gods[a], the gods of the peoples who are around you.
translation:
  language: sw
  text: Msiifuate miungu mingine[a], miungu ya watu wanaowazunguka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kuhifadhi nahau ya Kiebrania kwa karibu zaidi, “Msiende nyuma ya miungu mingine, miongoni mwa miungu ya watu wanaowazunguka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֵלְכוּן אַחֲרֵי
  choice: Msiifuate
  rationale: Muundo wa kukataza pamoja na nahau ya Kiebrania ‘kwenda nyuma ya’ una maana ya kufuata au kuambatana na; Kiswahili ‘msiifuate’ ni cha asili na huhifadhi wazo la uaminifu wa kidini bila kufafanua kupita kiasi kuwa ‘msiiabudu.’
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Hutaja miungu iliyo tofauti na Mungu wa Israeli; ‘mingine’ ni wazi zaidi kuliko kuongeza dhana isiyotajwa moja kwa moja ya ‘kigeni.’
- source_word: מֵאֱלֹהֵי הָעַמִּים
  choice: yaani miungu ya watu
  rationale: מִן hapa inaeleweka kwa maana ya kugawa au kubainisha kundi ambamo ‘miungu mingine’ inapatikana. ‘Yaani’ huonyesha uhusiano huo kwa Kiswahili cha kawaida bila ‘kutoka kwa,’ ambako kungeweza kudokeza chanzo.
- source_word: אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: wanaowazunguka
  rationale: Kishazi hiki kinawarejelea ‘watu’ na kueleza kuwa ni jamii jirani zinazowazunguka wasikilizaji.
theological_decisions:
- issue: Asili ya katazo
  choice: Katazo la agano dhidi ya kufuata au kujiambatanisha na miungu mingine.
  alternative: Katazo finyu la kwenda kimwili kuelekea mahali pa ibada ya kipagani.
  rationale: Nahau הלך אחרי katika Kumbukumbu la Torati kwa kawaida huhusu uaminifu na mwenendo wa kidini, si mwendo wa kimwili pekee. ‘Fuata’ huhifadhi upana huo bila kuibadili moja kwa moja kuwa ‘abudu.’
- issue: Hadhi ya ‘miungu’ ya mataifa
  choice: Kutumia neno ‘miungu’ kama linavyotokea katika katazo bila kutoa uamuzi wa kiontolojia ndani ya tafsiri.
  alternative: Kuongeza alama kama ‘miungu bandia’ au ‘wanaoitwa miungu.’
  rationale: Chanzo chenyewe kinasema אֱלֹהִים אֲחֵרִים; kuongeza ‘bandia’ kungetatua kimyakimya mvutano ambao mstari huu hauufafanui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Msiifuate’ ni katazo kwa wingi linalofaa kwa taifa linalohutubiwa. ‘Watu’ limetumiwa badala ya ‘mataifa’ ili kukaribia עַמִּים, huku ‘wanaowazunguka’ ikionyesha jamii jirani.
