  text: And you shall bind them as a sign on your hand[a], and they shall be as frontlets between your eyes.
translation:
  language: sw
  text: Utayafunga maneno haya kuwa ishara kwenye mkono wako, nayo yatakuwa vifungo vya paji la uso katikati ya macho yako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “filakteria.” Neno la Kiebrania ni adimu na kwa maana ya karibu huashiria vifungo au mapambo ya paji la uso. “Filakteria” hurejelea viboksi vidogo vyenye vifungu vya Maandiko, vilivyovaliwa katika desturi ya baadaye ya Kiyahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְשַׁרְתָּם
  choice: Nawe utayafunga maneno haya
  rationale: Kitenzi cha Kiebrania kina kiambishi cha wingi 'hayo'; kwa kuwa Kiswahili huhitaji ngeli iliyo wazi, 'maneno haya' kinarejesha kwa kawaida maneno yaliyotajwa katika muktadha uliotangulia. 'Utayafunga' huhifadhi tendo halisi na nguvu ya maagizo.
- source_word: לְאוֹת
  choice: yawe ishara
  rationale: אוֹת humaanisha 'ishara' au 'alama.' 'Yawe ishara' ni Kiswahili cha kawaida na huhifadhi maana ya kiishara bila kuamua jinsi agizo hilo linavyotekelezwa.
- source_word: עַל יָדֶךָ
  choice: kwenye mkono wako
  rationale: יָד kwa kawaida ni 'mkono.' Tafsiri hii inafuata maana ya msingi bila kuipanua kuwa 'mkono wa juu' au 'mkono mzima.'
- source_word: וְהָיוּ
  choice: nayo yatakuwa
  rationale: Muundo huu unaendeleza mfululizo wa maagizo. 'Yatakuwa' huhifadhi kauli ya moja kwa moja na usambamba na kishazi cha kwanza.
- source_word: לְטֹטָפֹת
  choice: mapambo ya paji la uso
  rationale: טֹטָפֹת ni neno adimu linaloelekea kutaja kitu kinachovaliwa sehemu ya mbele ya kichwa. 'Mapambo ya paji la uso' hutoa picha inayoeleweka kwa Kiswahili bila kuingiza moja kwa moja desturi ya baadaye ya filakteria.
- source_word: בֵּין עֵינֶיךָ
  choice: katikati ya macho yako
  rationale: Hii inahifadhi kwa karibu nahau halisi ya Kiebrania, badala ya kuibadili kimafafanuzi kuwa 'kwenye paji la uso.'
theological_decisions:
- issue: Iwapo agizo lielezwe kuwa tendo halisi la mwili, mfano wa kukumbuka daima, au yote mawili
  choice: Kuhifadhi lugha halisi ya mwili bila kuamua suala hilo
  alternative: Kulieleza wazi kuwa mfano wa kukumbuka, au kulitambulisha moja kwa moja na filakteria za desturi ya baadaye ya Kiyahudi
  rationale: Kiebrania hutumia picha halisi ya kufunga kwenye mkono na kuweka katikati ya macho. Tafsiri huhifadhi mvutano huo na haiamui ikiwa utekelezaji ni halisi, wa kiishara, au yote mawili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. 'Mapambo ya paji la uso' ni ya asili zaidi kuliko neno la kigeni katika matini kuu; tanbihi huhifadhi utambulisho wa jadi bila kuufanya kuwa uamuzi wa tafsiri.
