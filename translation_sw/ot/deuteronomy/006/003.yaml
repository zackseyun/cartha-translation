base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/003.yaml
  text: So hear[a], Israel, and be careful to do it, that it may go well with you and that you may multiply greatly, just as Yahweh, the God of your fathers, has spoken to you[b], in a land flowing with milk and honey.
translation:
  language: sw
  text: Basi sikiliza, ee Israeli, na uwe mwangalifu kuyatenda, ili mambo yakuendee mema, nanyi mkaongezeke sana katika nchi inayotiririka maziwa na asali, kama Yahwe, Mungu wa baba zako,[a] alivyokuambia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu wa mababu zako.” Kiebrania kinasema kihalisi “baba zako.”
    reason: lexical_alternative
  - marker: b
    text: 'Maneno ya Kiebrania hapa yamebanwa. Pia yanaweza kueleweka: “kama Yahwe, Mungu wa baba zako, alivyokuahidi nchi inayotiririka maziwa na asali.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: sikiliza
  rationale: Kitenzi שׁמע kinaweza kumaanisha kusikia, kusikiliza, au kutii. “Sikiliza” ni cha kawaida katika Kiswahili na hapa kinahifadhi wito wa kutega sikio, huku wazo la utii likijitokeza katika kauli inayofuata kuhusu kuyatenda maagizo.
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: uwe mwangalifu kuyatenda
  rationale: Muundo wa שׁמר pamoja na kitenzi-jina cha עשה unaonyesha kutunza au kuzingatia kwa makini kwa kusudi la kutenda. “Uwe mwangalifu kuyatenda” ni Kiswahili cha asili kinachobeba pande zote mbili.
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: ili mambo yakuendee mema
  rationale: Hii ni nahau ya kawaida ya Kumbukumbu la Torati inayomaanisha kwamba hali ya mhusika itakuwa njema. Tafsiri hii ni ya kawaida na haibadili maana kuwa wema wa kimaadili.
- source_word: וַאֲשֶׁר תִּרְבּוּן מְאֹד
  choice: nanyi mkaongezeke sana
  rationale: רבה hapa inaonyesha kuongezeka kwa idadi ya watu. Wingi wa “nanyi” pia unaakisi badiliko la maandishi ya Kiebrania kutoka kumsemesha Israeli kwa umoja hadi kuwasemesha watu kwa wingi.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: kama ... alivyokuambia
  rationale: דבר kimsingi ni kusema au kunena. “Alivyokuambia” huhifadhi maana hiyo bila kuifafanua moja kwa moja kuwa “alivyokuahidi,” ingawa muktadha unaashiria ahadi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: Mungu wa baba zako
  rationale: אבות ni neno la kiume la wingi, “baba.” Tafsiri kuu inalihifadhi, huku tanbihi ikitoa “mababu” kama namna ya kawaida zaidi ya kueleza mababu wa kale.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: nchi inayotiririka maziwa na asali
  rationale: Hii ni taswira ya kudumu ya nchi iliyoahidiwa. “Inayotiririka maziwa na asali” ni ya kueleweka, ya heshima, na inahifadhi picha ya Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi jina hilo waziwazi.
- issue: Neno la ukoo אֲבֹתֶיךָ
  choice: baba zako
  alternative: mababu zako
  rationale: “Baba zako” linafuata umbo la kiume la maandishi kwa karibu; “mababu zako” linaeleza maana ya vizazi vya kale kwa Kiswahili cha kawaida na limetajwa katika tanbihi.
- issue: Uhusiano wa kisarufi wa “nchi inayotiririka maziwa na asali”
  choice: kauli hiyo imeachwa baada ya “alivyokuambia,” ikielekea kueleza mahali ambapo Israeli itaongezeka
  alternative: Yahwe alikuahidi nchi inayotiririka maziwa na asali
  rationale: Kiebrania kimebanwa na kinaruhusu kirai cha nchi kuhusishwa ama na kuongezeka kwao humo ama na yale Yahwe aliyosema. Tafsiri kuu haibadili דבר moja kwa moja kuwa “kuahidi,” na tanbihi inahifadhi usomaji mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima, na unaosomeka kwa urahisi. “Ee Israeli” huweka wazi kwamba Israeli anaitwa moja kwa moja; badiliko kwenda “nanyi” linahifadhi kwa kadiri inayowezekana badiliko la idadi katika Kiebrania. Taswira ya “kutiririka maziwa na asali” imehifadhiwa badala ya kufafanuliwa.
