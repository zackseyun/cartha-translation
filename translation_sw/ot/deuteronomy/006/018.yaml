  terminology: Jina Yahweh limehifadhiwa kwa uthabiti. “Machoni pa Yahweh,” “nchi nzuri,” na “baba zako” ni tafsiri sahihi za istilahi na miundo ya msingi. Tanbihi yenye alama [a] imefungwa ipasavyo kwa “kuimiliki” na inaeleza maana mbadala ya kitenzi bila kulazimisha tafsiri moja.
