  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu vipengele vyote vya Kiebrania: agizo la kufanya yaliyo sawa na mema, kipimo cha “machoni pa Yahweh,” kusudi la hali njema, kuingia na kuimiliki nchi nzuri, na kiapo cha Yahweh kwa baba zao. “Kuimiliki” ni chaguo linalofaa kwa וְיָרַשְׁתָּ katika muktadha huu, huku mbadala wa “kuirithi” ukiwekwa katika tanbihi.'
