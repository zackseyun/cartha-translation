id: DEU.6.18
reference: Deuteronomy 6:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עָשִׂ֛יתָ הַ/יָּשָׁ֥ר וְ/הַ/טּ֖וֹב בְּ/עֵינֵ֣י יְהוָ֑ה לְמַ֨עַן֙ יִ֣יטַב לָ֔/ךְ וּ/בָ֗אתָ וְ/יָֽרַשְׁתָּ֙ אֶת הָ/אָ֣רֶץ הַ/טֹּבָ֔ה אֲשֶׁר נִשְׁבַּ֥ע יְהוָ֖ה לַ/אֲבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/018.yaml
  text: And you shall do what is right and good in the eyes of Yahweh[a], so that it may go well for you, and you may go in and take possession of the good land that Yahweh swore to your fathers.
translation:
  language: sw
  text: Ufanye yaliyo sawa na mema machoni pa Yahweh, ili mambo yakuendee vizuri, nawe uingie na kuimiliki[a] nchi nzuri ambayo Yahweh aliwaapia baba zako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuirithi.” Kitenzi cha Kiebrania kinaweza kumaanisha kurithi, kumiliki, au kuchukua milki; hapa kinahusu Israeli kuingia na kuimiliki nchi iliyoahidiwa kwa kiapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Ufanye
  rationale: Katika muktadha huu wa maagizo, kitenzi hiki kina nguvu ya amri inayoelekezwa kwa mtu wa pili umoja; hali ya utegemezi ya Kiswahili huwasilisha agizo hilo kwa kawaida.
- source_word: הַיָּשָׁר וְהַטּוֹב
  choice: yaliyo sawa na mema
  rationale: Huhifadhi sifa zote mbili—uadilifu na wema—bila kuziunganisha kuwa wazo moja.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahweh
  rationale: Huhifadhi sitiari ya Kiebrania ya kipimo au tathmini inayofanywa na Yahweh, huku ikiwa wazi katika Kiswahili.
- source_word: לְמַעַן יִיטַב לָךְ
  choice: ili mambo yakuendee vizuri
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kusudi au matokeo ya hali njema bila kuifinya maana iwe ustawi wa mali pekee.
- source_word: וּבָאתָ
  choice: nawe uingie
  rationale: Huwakilisha mwendo wa kuingia katika nchi na kuendeleza uhusiano wa kusudi unaotangulia.
- source_word: וְיָרַשְׁתָּ
  choice: na kuimiliki
  rationale: Katika muktadha wa Israeli kuingia katika nchi, neno hili linaonyesha kuichukua na kuimiliki; maana mbadala ya kurithi imehifadhiwa katika tanbihi.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: nchi nzuri
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi tathmini ya Kiebrania bila kuongeza dhana kama rutuba.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: ambayo Yahweh aliwaapia
  rationale: Kitenzi cha Kiswahili ‘apa’ huhifadhi dhana ya kiapo, badala ya kukifanya kuwa ahadi ya kawaida tu.
- source_word: לַאֲבֹתֶיךָ
  choice: baba zako
  rationale: Huhifadhi neno la ukoo la kiume lililo katika Kiebrania na rejeo lake la kihistoria kwa mababa wa agano.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina binafsi la agano, Tetragramatoni; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya וְיָרַשְׁתָּ kuhusu nchi
  choice: kuimiliki
  alternative: kuirithi
  rationale: Muktadha unahusu kuingia na kuitwaa nchi iliyoahidiwa, lakini uwezekano wa maana ya ‘kurithi’ haujaondolewa na umetajwa katika tanbihi.
- issue: Neno la ukoo לַאֲבֹתֶיךָ
  choice: baba zako
  alternative: mababu zako; wahenga wako
  rationale: Kiebrania kinatumia nomino ya kiume ya wingi, inayowarejelea kihistoria mababa waliopokea kiapo cha agano.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi “mambo yakuendee vizuri” ni wa kawaida na mpana, nao huepuka kuifanya ahadi ihusu utajiri wa mali pekee.
