  text: And you shall love Yahweh your God with all your heart and with all your soul and with all your might[a][b].
translation:
  language: sw
  text: Mpende Yahweh Mungu wako kwa moyo wako wote, kwa nafsi yako yote[a], na kwa nguvu zako zote[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “nafsi” (nefesh) linaweza pia kumaanisha “uhai” au “mtu mwenyewe.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linalotafsiriwa “nguvu” (me'od) linahusiana kihalisi na wazo la “wingi” na linaweza kumaanisha nguvu, juhudi kubwa, uwezo, au rasilimali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָהַבְתָּ
  choice: Mpende
  rationale: Kitenzi cha Kiebrania katika muktadha huu wa agano kina nguvu ya amri. Kauli ya moja kwa moja “Mpende” ni ya asili katika Kiswahili na haifanyi maneno hayo yaonekane kuwa utabiri tu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Ingawa umbo la אֱלֹהִים linaonekana kama wingi, hapa linamtaja Mungu wa Israeli mmoja na lina kiambishi cha nafsi ya pili umoja.
- source_word: בְּכָל
  choice: kwa ... wote/yote/zote
  rationale: Muundo huu unaonyesha kujitoa kikamilifu. Kurudia “kwa” na viambishi vya jumla vinavyopatana na nomino kunahifadhi msisitizo wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: לְבָבְךָ
  choice: moyo wako
  rationale: “Moyo” huhifadhi taswira ya Kiebrania ya utu wa ndani, ikijumuisha fikra na nia, bila kuifupisha kuwa hisia peke yake.
- source_word: נַפְשְׁךָ
  choice: nafsi yako
  rationale: נֶפֶשׁ inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. “Nafsi” hudumisha istilahi yenye upana na mvutano wake wa maana.
- source_word: מְאֹדֶךָ
  choice: nguvu zako
  rationale: מְאֹד, kwa kawaida “sana/wingi,” limetumiwa hapa kama nomino inayoonyesha uwezo, nguvu, au rasilimali zote za mtu. “Nguvu zako zote” ni Kiswahili cha asili huku tanbihi ikihifadhi upana wa neno hilo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Matini inatumia jina la agano moja kwa moja; kulitohowa kama “Yahweh” kunalihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Istilahi za utu katika amri ya kumpenda Mungu
  choice: moyo ... nafsi ... nguvu
  alternative: moyo ... uhai ... uwezo na mali
  rationale: Maneno ya Kiebrania yanaingiliana na kueleza mtu mzima; hayapaswi kulazimishwa kuwa sehemu tatu tofauti za saikolojia ya kisasa. Tafsiri inahifadhi istilahi hizo huku tanbihi zikionyesha upana wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Amri ya moja kwa moja “Mpende” inaeleweka kwa urahisi. Urudiaji wa “kwa ... wote/yote/zote” unahifadhi muundo na msisitizo wa chanzo bila kufanya sentensi kuwa ngumu.
