base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/001.yaml
  text: If a slain man is found in the land that Yahweh your God is giving you to possess[a], lying in the open field, and it is not known who struck him,
translation:
  language: sw
  text: Ikiwa mtu aliyeuawa atapatikana katika nchi ambayo Yahweh Mungu wako anakupa ili uimiliki[a], akiwa amelala chini uwandani, na haijulikani ni nani aliyempiga,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanamume aliyeuawa.” Kiebrania kina umbo la umoja wa kiume, ingawa kanuni ya sheria hii inahusu kwa jumla mauaji ambayo muuaji wake hajulikani.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ikiwa
  rationale: Hutanguliza sharti katika sheria ya tukio maalumu; “ikiwa” ni ya kawaida na wazi katika Kiswahili cha kisheria.
- source_word: יִמָּצֵא
  choice: atapatikana
  rationale: Kauli ya kutendwa ya מצא inaelezwa moja kwa moja na kwa kawaida kwa “atapatikana.”
- source_word: חָלָל
  choice: mtu aliyeuawa
  rationale: Neno hili humaanisha mtu aliyeuawa kwa nguvu, si maiti tu. Kiswahili hakihitaji kulazimisha jinsia ya kiume hapa, ingawa Kiebrania ni umoja wa kiume; maelezo yamehifadhiwa katika tanbihi.
- source_word: בָּאֲדָמָה
  choice: katika nchi
  rationale: Muktadha wa nchi inayotolewa kuwa milki unaonyesha eneo la nchi, si udongo au ardhi ya chini pekee.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ לְרִשְׁתָּהּ
  choice: ambayo Yahweh Mungu wako anakupa uimiliki
  rationale: Huhifadhi jina la agano Yahweh na maana ya kupewa nchi ili kuimiliki; muundo huu ni wa asili katika Kiswahili cha sasa.
- source_word: נֹפֵל
  choice: akiwa amelala
  rationale: Ingawa maana ya msingi ni “ameanguka,” hapa inaeleza hali ya mwili uliopatikana; “akiwa amelala” huepuka kudokeza tendo la kuanguka wakati huo.
- source_word: בַּשָּׂדֶה
  choice: uwandani
  rationale: “Uwandani” kwa ufupi na kwa kawaida huonyesha eneo la wazi nje ya makazi.
- source_word: לֹא נוֹדַע
  choice: wala haijulikani
  rationale: Muundo usio na mtendaji maalumu unaakisiwa kwa Kiswahili cha kawaida “haijulikani.”
- source_word: מִי הִכָּהוּ
  choice: ni nani aliyempiga
  rationale: “Aliyempiga” huhifadhi maana ya msingi ya נכה na tofauti yake na חָלָל, ambalo tayari linaonyesha kwamba mtu huyo aliuawa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yana jina maalumu la Mungu, Tetragramatoni; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Rejeo la kijinsia katika חָלָל
  choice: mtu aliyeuawa
  alternative: mwanamume aliyeuawa
  rationale: Kiebrania ni umoja wa kiume, lakini nomino hiyo katika sheria hii inaweza kumtaja mtu aliyeuawa bila kulazimisha jinsia ya kibaolojia. “Mtu aliyeuawa” ni Kiswahili cha asili, huku umbo la Kiebrania likielezwa katika tanbihi ili kutohitimisha kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imehifadhiwa ikiwa wazi kwa kuendelea katika mstari unaofuata, kama ilivyo katika chanzo.
