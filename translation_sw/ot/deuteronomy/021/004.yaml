base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/004.yaml
  text: Then the elders of that city shall bring the heifer down to a perennial wadi[a], which is neither worked nor sown, and there in the wadi they shall break the heifer’s neck.
translation:
  language: sw
  text: Kisha wazee wa mji ule watamshusha mtamba huyo hadi kwenye korongo lenye kijito cha kudumu[a], ambalo halilimiwi wala halipandwi mbegu. Huko korongoni watamvunja shingo mtamba huyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye korongo lenye mkondo wa maji unaotiririka daima”; au, “kwenye bonde gumu.” Maana kamili ya kirai cha Kiebrania נַחַל אֵיתָן haijathibitika; huenda kinamaanisha korongo au bonde lenye kijito cha kudumu, ingawa wengine hukielewa kuwa korongo au bonde imara/gumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרִדוּ
  choice: watamshusha
  rationale: Hifadhi maana ya kisababishi ya Hiphil ya ירד, yaani kumfanya ashuke au kumpeleka chini.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: wazee wa mji ule
  rationale: Ni tafsiri ya kawaida na ya asili ya kirai hiki katika muktadha wa kisheria.
- source_word: הָעֶגְלָה
  choice: mtamba huyo
  rationale: Mtamba ni ng’ombe jike mchanga na ni istilahi sahihi, yenye hadhi, kwa muktadha huu wa ibada na sheria.
- source_word: אֶל נַחַל אֵיתָן
  choice: mpaka kwenye korongo lenye maji ya kudumu[a]
  rationale: נחל inaweza kuwa korongo, bonde la kijito, au mkondo wa maji; איתן hapa yaelekea kuonyesha hali ya kudumu. Tafsiri hii inaeleweka kwa msomaji wa kisasa bila kudai kwa uhakika zaidi ya ushahidi wa Kiebrania.
- source_word: אֲשֶׁר לֹא יֵעָבֵד בּוֹ וְלֹא יִזָּרֵעַ
  choice: ambalo halijawahi kulimwa wala kupandwa mbegu
  rationale: Inaonyesha matumizi ya kilimo yaliyokanushwa katika vitenzi viwili vya hali ya kutendwa; ‘halijawahi’ huwasilisha kuwa eneo hilo halikutumiwa kwa kazi hizo.
- source_word: וְעָרְפוּ
  choice: watamvunja ... shingo
  rationale: ערף katika ibada hii humaanisha kuvunja shingo, si neno la jumla la kuchinja; tafsiri hiyo huhifadhi upekee wa tendo.
- source_word: שָׁם ... בַּנָּחַל
  choice: Huko korongoni
  rationale: Huunganisha kwa Kiswahili asilia kielezi cha mahali na kurudiwa kwa נחל, huku ikibaki wazi kuwa tendo linafanyika ndani ya eneo hilo.
theological_decisions: []
