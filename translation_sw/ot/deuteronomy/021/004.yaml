  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa na wenye hadhi. ‘Korongo lenye maji ya kudumu’ huepuka neno la kigeni ‘wadi’ na kuwasilisha vizuri jiografia inayokusudiwa, huku tanbihi ikihifadhi utata halisi wa נַחַל אֵיתָן.
