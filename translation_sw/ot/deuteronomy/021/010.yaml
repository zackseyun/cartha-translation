  yaml_path: translation/ot/deuteronomy/021/010.yaml
  text: When you go out to war against your enemies[a], and Yahweh your God gives them into your hand, and you take them captive[b],
translation:
  language: sw
  text: Utakapotoka kwenda vitani dhidi ya adui zako, na Yahweh, Mungu wako, akawatia mkononi mwako[a], nawe ukawachukua mateka[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni halisi zaidi, “akamtoa/akaitoa katika mkono wako.” Kiambishi cha umoja huenda kinarejelea jeshi la adui kwa ujumla; kwa hiyo limetafsiriwa kwa wingi katika mstari huu.
    reason: lexical_alternative
  - marker: b
    text: Au, “nawe ukateka mateka kutoka kwao.” Kiebrania kinatumia kitenzi na nomino zenye mzizi mmoja kueleza kuwakamata wafungwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Utakapo-
  rationale: Katika sheria hii ya kisa, כִּי inaanzisha hali inayotarajiwa; muundo wa ‘utakapo-’ ni wa kawaida na wa asili kuliko ‘ikiwa’ hapa.
- source_word: תֵצֵא לַמִּלְחָמָה
  choice: utakapotoka kwenda vitani
  rationale: Huhifadhi wazo halisi la ‘kutoka’ katika יָצָא na kueleza kwa Kiswahili cha kawaida kusudi la kwenda vitani.
- source_word: עַל אֹיְבֶיךָ
  choice: dhidi ya adui zako
  rationale: עַל katika muktadha wa uhasama ina maana ya ‘dhidi ya’; אֹיְבֶיךָ ni wingi wenye kiambishi cha nafsi ya pili umoja.
- source_word: וּנְתָנוֹ
  choice: akawatia
  rationale: Ingawa kiambishi cha Kiebrania ni umoja (‘akamtoa/akaitoa’), kinarejelea kwa ujumla jeshi la adui lililotajwa kwa wingi; wingi unasomeka kwa kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahweh’ badala ya kubadilishwa kwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya nomino yenye kiambishi cha nafsi ya pili umoja.
- source_word: בְּיָדֶךָ
  choice: mkononi mwako
  rationale: Huhifadhi taswira ya nahau ya Kiebrania ya kumweka mtu katika mamlaka au uwezo wa mwingine.
- source_word: וְשָׁבִיתָ שִׁבְיוֹ
  choice: nawe ukawachukua mateka
  rationale: Hutoa maana ya kishazi cha kitenzi na nomino zenye mzizi mmoja kwa Kiswahili cha asili, huku dokezo likihifadhi uwezekano wa tafsiri iliyo karibu zaidi na umbo la Kiebrania.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano יהוה; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadilisha kwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Utakapotoka kwenda vitani’ huhifadhi mwendo wa kitenzi cha Kiebrania bila kuwa kizito; ‘mkononi mwako’ huhifadhi nahau ya chanzo, na ‘ukawachukua mateka’ ni usemi unaoeleweka kwa urahisi.
