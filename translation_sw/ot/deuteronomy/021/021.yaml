base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/021.yaml
  text: Then all the men of his city shall stone him with stones[a], and he shall die. So you shall purge the evil from your midst, and all Israel shall hear and fear.
translation:
  language: sw
  text: Ndipo wanaume wote wa mji wake watampiga kwa mawe[a], naye atakufa. Hivyo utaondoa uovu katikati yako, na Waisraeli wote watasikia na kuogopa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wote wa mji wake”; Kiebrania kihalisi, “wanaume wote wa mji wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְגָמֻהוּ
  choice: watampiga kwa mawe
  rationale: Katika muktadha wa kisheria, רגם humaanisha kutekeleza hukumu kwa kumpiga mtu kwa mawe; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: כָּל אַנְשֵׁי עִירוֹ
  choice: wanaume wote wa mji wake
  rationale: אַנְשֵׁי ni neno la kiume linalomaanisha ‘wanaume wa’; tafsiri hii inadumisha jinsia iliyo wazi katika Kiebrania bila kuipanua kimafundisho.
- source_word: בָאֲבָנִים
  choice: kwa mawe
  rationale: Kirai hiki kinataja chombo cha kutekeleza hukumu na kuhifadhi picha halisi ya Kiebrania.
- source_word: וָמֵת
  choice: mpaka afe
  rationale: Katika mfuatano huu, kitenzi kinaeleza matokeo ya kupigwa kwa mawe. ‘Mpaka afe’ ni Kiswahili cha asili kinachoweka wazi matokeo bila kuyafanya kusudi la kiitikadi.
- source_word: וּבִעַרְתָּ
  choice: utaondoa
  rationale: Katika fomula za kisheria za Kumbukumbu la Torati, בער humaanisha kuondoa kabisa uovu katika jumuiya, si kuuchoma kihalisi.
- source_word: הָרָע
  choice: uovu
  rationale: Nomino hii ya dhahania inaashiria uovu kama jamii ya kimaadili na kisheria; ‘uovu’ ni tafsiri ya kawaida na yenye uzito unaofaa.
- source_word: מִקִּרְבֶּךָ
  choice: katikati yako
  rationale: Huhifadhi kwa karibu nahau ya agano inayolenga jamii ya Israeli kwa umoja.
- source_word: יִשְׁמְעוּ
  choice: itasikia
  rationale: Tafsiri ya moja kwa moja ya ‘kusikia’ inadumisha ufupi wa Kiebrania bila kuongeza ‘habari hiyo.’
- source_word: וְיִרָאוּ
  choice: na kuogopa
  rationale: ‘Kuogopa’ huhifadhi maana ya hofu inayotokana na onyo la hukumu na athari yake ya kuzuia uhalifu.
theological_decisions:
- issue: Neno la kiraia lenye jinsia katika muktadha wa kisheria
  choice: wanaume wote wa mji wake
  alternative: watu wote wa mji wake
  rationale: Kiebrania kinasema kihalisi ‘wanaume wa mji wake.’ Jinsia ya kiume inadumishwa bila kufanya dai pana kuhusu majukumu ya kijinsia.
- issue: Fomula ya Kumbukumbu la Torati ya kuondoa uovu
  choice: utaondoa uovu katikati yako
  alternative: utautakasa uovu kutoka katikati yako
  rationale: ‘Utaondoa’ huwasilisha maana ya kimuktadha ya בער kwa Kiswahili cha asili na kuepuka wazo lisilokusudiwa la kuchoma au utakaso wa kiibada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Ndipo’ na ‘Hivyo’ zinaendeleza mfuatano wa hukumu na matokeo yake; umoja katika ‘yako’ unadumisha namna Kiebrania kinavyoihutubia Israeli kama jumuiya moja.
