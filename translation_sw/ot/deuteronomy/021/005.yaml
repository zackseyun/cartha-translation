  text: וְ/נִגְּשׁ֣וּ הַ/כֹּהֲנִים֮ בְּנֵ֣י לֵוִי֒ כִּ֣י בָ֗/ם בָּחַ֞ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/שָׁ֣רְת֔/וֹ וּ/לְ/בָרֵ֖ךְ בְּ/שֵׁ֣ם יְהוָ֑ה וְ/עַל פִּי/הֶ֥ם יִהְיֶ֖ה כָּל רִ֥יב וְ/כָל נָֽגַע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/005.yaml
  text: And the priests[a], the sons of Levi, shall come forward, for Yahweh your God has chosen them to minister to him and to bless in the name of Yahweh, and by their word every dispute and every injury shall be settled.
translation:
  language: sw
  text: Nao makuhani, wana wa Lawi, watasogea mbele, kwa maana Yahwe Mungu wako amewachagua wamhudumie na kubariki kwa jina la Yahwe. Kwa kauli yao kila mgogoro na kila jeraha[a] vitaamuliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “pigo,” “madhara,” au “taabu.” Neno la Kiebrania lina maana pana kuliko “shambulio,” lakini katika muktadha huu wa kisheria huenda linarejelea kesi zinazohusu kuumizwa kwa mwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִגְּשׁוּ
  choice: watasogea mbele
  rationale: Kauli hii inaonyesha makuhani wakijitokeza rasmi ili kushiriki katika utaratibu wa kisheria na kiibada.
- source_word: הַכֹּהֲנִים בְּנֵי לֵוִי
  choice: makuhani, wana wa Lawi
  rationale: Inahifadhi uhusiano wa ufafanuzi katika Kiebrania bila kuufanya usemi kuwa wa kiufundi kupita kiasi.
- source_word: כִּי בָם בָּחַר
  choice: kwa maana ... amewachagua
  rationale: כִּי inatoa sababu ya mamlaka yao, na wakati timilifu unaonyesha uchaguzi wa awali wenye matokeo yanayoendelea.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahwe Mungu wako
  rationale: Jina la agano יְהוָה limetafsiriwa moja kwa moja kuwa Yahwe, huku kauli ya uhusiano wa agano ikihifadhiwa.
- source_word: לְשָׁרְתוֹ
  choice: wamhudumie
  rationale: Neno hili linaonyesha huduma rasmi ya kikuhani kwa Mungu na ni la asili katika Kiswahili cha sasa.
- source_word: וּלְבָרֵךְ בְּשֵׁם יְהוָה
  choice: na kubariki kwa jina la Yahwe
  rationale: Inahifadhi kwa ufupi tendo la kutoa baraka chini ya mamlaka ya jina la Mungu bila kutaja mpokeaji ambaye Kiebrania hakumtaji.
- source_word: וְעַל פִּיהֶם
  choice: kwa kauli yao
  rationale: Nahau ya Kiebrania, kihalisi 'kwa kinywa chao,' hapa inamaanisha tamko lao lenye mamlaka; 'kwa kauli yao' ni wazi na ya asili.
- source_word: יִהְיֶה
  choice: vitaamuliwa
  rationale: Katika muktadha wa kisheria, kitenzi cha jumla 'itakuwa' kinadokeza kwamba mashauri yatapata uamuzi.
- source_word: כָּל רִיב
  choice: kila mgogoro
  rationale: רִיב inaweza kumaanisha mzozo au shauri la kisheria; 'mgogoro' huhifadhi upana huo.
- source_word: וְכָל נָגַע
  choice: kila jeraha
  rationale: נֶגַע ni neno pana linaloweza kumaanisha pigo, jeraha, au madhara; katika muktadha huu wa kisheria 'jeraha' linafaa bila kulibana kuwa shambulio pekee.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina la agano moja kwa moja; 'Yahwe' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Mamlaka ya kauli ya makuhani
  choice: kwa kauli yao ... vitaamuliwa
  alternative: kwa mamlaka yao ... vitaamuliwa
  rationale: Tafsiri iliyochaguliwa inahifadhi taswira ya usemi katika Kiebrania bila kuficha kwamba kauli hiyo ina nguvu ya kuamua katika muktadha huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa Kiebrania umehifadhiwa pale unapobaki wa asili katika Kiswahili, huku nahau ya kisheria 'kwa kinywa chao' ikitolewa kwa uwazi kama 'kwa kauli yao.'
