  text: כִּֽי תִהְיֶ֨יןָ לְ/אִ֜ישׁ שְׁתֵּ֣י נָשִׁ֗ים הָ/אַחַ֤ת אֲהוּבָה֙ וְ/הָ/אַחַ֣ת שְׂנוּאָ֔ה וְ/יָֽלְדוּ ל֣/וֹ בָנִ֔ים הָ/אֲהוּבָ֖ה וְ/הַ/שְּׂנוּאָ֑ה וְ/הָיָ֛ה הַ/בֵּ֥ן הַ/בְּכ֖וֹר לַ/שְּׂנִיאָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/015.yaml
  text: If a man has two wives[a], one loved and the other unloved, and both the loved and the unloved have borne him sons, and the firstborn son belongs to the unloved wife,
translation:
  language: sw
  text: Ikiwa mwanamume ana wake wawili, mmoja anayependwa na mwingine asiyependwa[a], na wake hao wote wawili, yule anayependwa na yule asiyependwa, wamemzalia wana wa kiume, na mwana wa kiume mzaliwa wa kwanza ni wa yule asiyependwa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anachukiwa.” Neno la Kiebrania linaweza kuwa na maana hiyo kali zaidi, lakini hapa huenda linamtaja mke asiyependwa au asiyependelewa, tofauti na yule anayependwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ikiwa
  rationale: Katika sheria ya mfano, neno hili linaanzisha hali ya masharti; “ikiwa” linafaa kwa mtindo wa kisheria wa Kiswahili.
- source_word: תִהְיֶיןָ לְאִישׁ
  choice: mwanamume ana
  rationale: Ingawa Kiebrania kinasema kihalisi kwamba wake ‘wapo kwa mwanamume,’ usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: שְׁתֵּי נָשִׁים
  choice: wake wawili
  rationale: Katika muktadha huu נָשִׁים humaanisha wake, si wanawake kwa ujumla.
- source_word: הָאַחַת אֲהוּבָה
  choice: mmoja anapendwa
  rationale: Huhifadhi maana ya moja kwa moja ya hali ya kupendwa bila kuibadili kuwa kupendelewa tu.
- source_word: וְהָאַחַת שְׂנוּאָה
  choice: mwingine hapendwi
  rationale: Huonyesha tofauti na mke anayependwa bila kulazimisha maana kali ya chuki; maana hiyo kali imehifadhiwa katika tanbihi.
- source_word: וְיָלְדוּ לוֹ בָנִים
  choice: wamemzalia wana
  rationale: Kitenzi cha wakati timilifu kinaendana na tendo lililokwisha kutokea katika hali hii ya kisheria, na בָנִים ni wana wa kiume.
- source_word: הָאֲהוּבָה וְהַשְּׂנוּאָה
  choice: wote wawili, anayependwa na asiyependwa
  rationale: ‘Wote wawili’ huweka wazi kwamba kila mke amemzalia mwanamume wana, huku vivumishi vilivyotumika kama nomino vikihifadhiwa.
- source_word: וְהָיָה הַבֵּן הַבְּכוֹר
  choice: na mwana mzaliwa wa kwanza ni
  rationale: Huendeleza mazingira ya kesi kwa Kiswahili cha kawaida na kuweka wazi kwamba anayezungumziwa ni mwana.
- source_word: לַשְּׂנִיאָה
  choice: wa yule mke asiyependwa
  rationale: Kiambishi ל־ hapa huonyesha uhusiano wa kimama; usemi huu unaeleweka kiasili katika muktadha wa urithi.
theological_decisions:
- issue: Tafsiri ya שְׂנוּאָה katika sheria ya familia
  choice: hapendwi / asiyependwa
  alternative: anachukiwa
  rationale: Neno la Kiebrania linaweza kumaanisha ‘anachukiwa,’ lakini katika utofautishaji wa wake linaweza kumtaja mke asiyependwa au asiyependelewa. Matini kuu haiongezi dai la uhasama mkali, huku tanbihi ikihifadhi uwezekano wa maana hiyo kali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisheria ulio wazi na wenye hadhi. Muundo wa sentensi umeachwa wazi kuendelea katika mstari unaofuata, kama ilivyo katika chanzo.
