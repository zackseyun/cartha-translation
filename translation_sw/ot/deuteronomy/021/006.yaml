  text: And all the elders of that city nearest to the slain man shall wash their hands over the heifer whose neck was broken in the wadi[a][b].
translation:
  language: sw
  text: Na wazee wote wa mji ule ulio karibu zaidi na mtu aliyeuawa wataosha mikono yao juu ya yule ndama jike ambaye shingo yake ilivunjwa katika wadi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika bonde,” “katika korongo,” au “katika mkondo wa maji wa msimu.” Neno la Kiebrania linaweza kumaanisha wadi, bonde, korongo, au njia ya maji inayoweza kuwa na maji kwa misimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: Kisha ... wote
  rationale: Kiunganishi kinaendeleza utaratibu wa kisheria, na כֹל kinajumuisha kundi lote; “Kisha” ni ya kawaida katika simulizi la maagizo ya Kiswahili.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: wazee wote wa mji ule
  rationale: “Wazee” hapa ni viongozi wa jamii, na “mji ule” huhifadhi rejeo mahsusi la demonstrativi.
- source_word: הַקְּרֹבִים אֶל הֶחָלָל
  choice: wa mji ule ulio karibu zaidi na huyo aliyeuawa
  rationale: Muundo huu unaonyesha kuwa mji ndio uliotambuliwa kwa ukaribu katika muktadha, huku “huyo aliyeuawa” ikihifadhi maana ya mtu aliyeuawa, si maiti kwa ujumla.
- source_word: יִרְחֲצוּ אֶת יְדֵיהֶם
  choice: wataosha mikono yao
  rationale: Wakati ujao katika muktadha huu una nguvu ya agizo la kiutaratibu na unasikika kwa kawaida katika sheria ya Kiswahili.
- source_word: עַל
  choice: juu ya
  rationale: Huhifadhi nafasi ya mikono juu ya mnyama wakati wa tendo la kiibada bila kuongeza maelezo yasiyokuwamo.
- source_word: הָעֶגְלָה
  choice: ndama jike
  rationale: Ni tafsiri wazi na ya sasa ya ng’ombe mchanga wa kike, inayoeleweka zaidi kwa wasomaji wengi kuliko istilahi adimu.
- source_word: הָעֲרוּפָה
  choice: aliyevunjwa shingo
  rationale: Kitenzi kinarejelea kuvunjwa shingo katika utaratibu huu, si uchinjaji wa kawaida wala lazima kukatwa kichwa.
- source_word: בַנָּחַל
  choice: katika bonde la mto
  rationale: נחל inaweza kumaanisha bonde au njia ya maji, mara nyingi yenye mkondo wa msimu; “bonde la mto” ni Kiswahili cha kawaida kinachohifadhi uhusiano huo wa kijiografia.
