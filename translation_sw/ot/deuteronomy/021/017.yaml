id: DEU.21.17
reference: Deuteronomy 21:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּי֩ אֶת הַ/בְּכֹ֨ר בֶּן הַ/שְּׂנוּאָ֜ה יַכִּ֗יר לָ֤/תֶת ל/וֹ֙ פִּ֣י שְׁנַ֔יִם בְּ/כֹ֥ל אֲשֶׁר יִמָּצֵ֖א ל֑/וֹ כִּי הוּא֙ רֵאשִׁ֣ית אֹנ֔/וֹ ל֖/וֹ מִשְׁפַּ֥ט הַ/בְּכֹרָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/017.yaml
  text: But he shall acknowledge the firstborn[a], the son of the unloved wife, by giving him a double portion of all that is found to belong to him, for he is the firstfruits of his vigor[c][b]; the right of the firstborn belongs to him.
translation:
  language: sw
  text: Lakini ni lazima amtambue mzaliwa wa kwanza, mwana wa mke asiyependwa[a], kwa kumpa fungu maradufu[b] la mali yake yote, kwa maana huyo ndiye mwanzo wa nguvu zake[c]. Haki ya mzaliwa wa kwanza ni yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwana wa mke anayechukiwa.” Neno la Kiebrania linaweza kutafsiriwa kihalisi kuwa “anayechukiwa,” lakini hapa huenda linamaanisha mke asiyependwa sana au asiyependelewa, tofauti na mke anayependwa.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kinywa cha mbili,” nahau inayomaanisha mafungu mawili, yaani fungu maradufu.
    reason: lexical_alternative
  - marker: c
    text: Au “wa kwanza wa nguvu zake.” Kirai cha Kiebrania kinamtaja mwana wa kwanza kuwa udhihirisho wa kwanza wa nguvu za baba za kuzaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכִּיר
  choice: ni lazima amtambue
  rationale: Hifili ya נכר hapa ina maana ya kukiri au kutambua rasmi hadhi halali ya mzaliwa wa kwanza. Muundo huu unaonyesha wajibu wa kisheria, si kumtambua tu kwa macho.
- source_word: הַבְּכֹר
  choice: mzaliwa wa kwanza
  rationale: Hili ni neno la kawaida la kifamilia na kisheria kwa mwana mwenye hadhi na haki ya uzaliwa wa kwanza.
- source_word: בֶּן הַשְּׂנוּאָה
  choice: mwana wa mke asiyependwa
  rationale: שְׂנוּאָה linaweza kumaanisha kihalisi ‘anayechukiwa,’ lakini katika ulinganisho huu wa wake linaelekea kumaanisha mke asiyependwa au asiyependelewa. Tafsiri hii ni ya kawaida na haiongezi kiwango cha uhasama ambacho muktadha haulazimishi.
- source_word: לָתֶת לוֹ פִּי שְׁנַיִם
  choice: kwa kumpa fungu maradufu
  rationale: Nahau פִּי שְׁנַיִם, kihalisi ‘kinywa cha mbili,’ inaonyesha mafungu mawili ya urithi, yaani fungu maradufu.
- source_word: בְּכֹל אֲשֶׁר יִמָּצֵא לוֹ
  choice: la mali yake yote
  rationale: Kirai hiki kinahusu kila kitu kinachopatikana kuwa mali ya baba, yaani mali yote ya urithi. Kiswahili hiki kinaweka wazi maana ya kisheria kwa lugha ya kawaida.
- source_word: רֵאשִׁית אֹנוֹ
  choice: mwanzo wa nguvu zake
  rationale: Tafsiri hii inadumisha sitiari ya Kiebrania kuhusu mwana wa kwanza kuwa udhihirisho wa kwanza wa nguvu za baba za kuzaa bila kuifafanua kupita kiasi.
- source_word: מִשְׁפַּט הַבְּכֹרָה
  choice: Haki ya mzaliwa wa kwanza
  rationale: Kirai hiki kinaonyesha stahili ya kisheria inayotokana na hadhi ya uzaliwa wa kwanza.
- source_word: כִּי ... כִּי
  choice: Lakini ... kwa maana
  rationale: כִּי ya kwanza ina nguvu ya kupinga upendeleo uliokatazwa katika mstari uliotangulia, na ya pili inatoa sababu ya sheria hiyo.
theological_decisions:
- issue: Maana ya שְׂנוּאָה katika muktadha wa ndoa na sheria ya urithi
  choice: mke asiyependwa
  alternative: mke anayechukiwa; mke anayependwa kidogo
  rationale: Mstari huu unashughulikia urithi, wala hautoi fundisho la pekee kuhusu ndoa. ‘Asiyependwa’ huhifadhi tofauti na mke anayependwa bila kulazimisha maana kali zaidi ya chuki, ingawa uwezekano huo wa kileksia umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya heshima, ya sasa na inayoeleweka kwa wasomaji wa kawaida. ‘Ni lazima’ huonyesha wajibu wa sheria, ‘fungu maradufu’ ni istilahi wazi ya urithi, na tanbihi zinahifadhi maana mbadala za Kiebrania.
