  yaml_path: translation/ot/deuteronomy/021/007.yaml
  text: Then they shall answer and say[a], ‘Our hands did not shed this blood[b], and our eyes did not see it.’
translation:
  language: sw
  text: Nao watajibu na kusema, “Mikono yetu haikumwaga damu hii[a], wala macho yetu hayakuona[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “damu hii.” Huu ni msemo wa kisheria wa kukana kuhusika na mauaji hayo.
    reason: lexical_alternative
  - marker: b
    text: Au, “hayakushuhudia jambo hilo.” Kiebrania hutumia maneno halisi “macho yetu hayakuona” kukana kwamba walijua yaliyotokea kwa kuyaona wenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנוּ וְאָמְרוּ
  choice: Nao watajibu na kusema
  rationale: Muundo huu unahifadhi jozi ya vitenzi vya Kiebrania inayotambulisha jibu rasmi la hadharani. “Nao” pia linaonyesha mwendelezo wa utaratibu unaoelezwa.
- source_word: יָדֵינוּ
  choice: Mikono yetu
  rationale: Lugha halisi ya kiungo cha mwili imehifadhiwa; hapa “mikono” inaashiria kutenda mauaji moja kwa moja na kuwajibika kwayo.
- source_word: לֹא שָׁפְכָה אֶת־הַדָּם הַזֶּה
  choice: haikumwaga damu hii
  rationale: Kitenzi שפך pamoja na דם huunda msemo wa kumwaga damu, yaani kuua. Tafsiri inahifadhi picha halisi na tamko la kukana wajibu.
- source_word: וְעֵינֵינוּ לֹא רָאוּ
  choice: wala macho yetu hayakuona
  rationale: Lugha halisi ya “macho” na “kuona” imehifadhiwa. “Wala” linaunganisha tamko la pili la kukanusha kwa Kiswahili cha asili, bila kulifanya kwa lazima kuwa “kushuhudia.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya tamko rasmi lakini kinachoeleweka kwa urahisi. Lugha halisi ya viungo vya mwili (“mikono,” “macho”) imehifadhiwa ili kudumisha picha na mkazo wa Kiebrania.
