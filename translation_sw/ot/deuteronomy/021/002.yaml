translation:
  language: sw
  text: Ndipo wazee wako na waamuzi wako watatoka na kupima umbali hadi miji inayomzunguka yule aliyeuawa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָצְאוּ
  choice: ndipo ... watatoka
  rationale: Waw pamoja na qatal inaendeleza hatua zinazofuatana katika utaratibu wa kisheria; “ndipo” huonyesha mfuatano huo kwa Kiswahili cha kawaida, huku “watatoka” ikihifadhi kitendo chenyewe.
- source_word: זְקֵנֶיךָ
  choice: wazee wako
  rationale: Huhifadhi kiambishi cha nafsi ya pili umoja kinachomwelekea Israeli kama jumuiya na maana ya viongozi wazee.
- source_word: וְשֹׁפְטֶיךָ
  choice: na waamuzi wako
  rationale: Neno hili humaanisha watu wenye mamlaka ya kuamua mashauri; “waamuzi” linafaa katika muktadha huu wa kisheria.
- source_word: וּמָדְדוּ
  choice: na kupima umbali
  rationale: Kitenzi humaanisha “kupima”; kutaja “umbali” kwa uwazi kunafanya kile kinachopimwa kuelekea miji inayozunguka kieleweke kwa Kiswahili cha kawaida.
- source_word: אֶל הֶעָרִים
  choice: hadi miji
  rationale: Katika muundo huu wa kupima, אֶל inaonyesha miji kuwa miisho ya vipimo; “hadi miji” ni ya kawaida na wazi.
- source_word: אֲשֶׁר סְבִיבֹת
  choice: inayomzunguka
  rationale: Huonyesha miji iliyo kandokando ya mahali alipopatikana aliyeuawa; umoja wa kisarufi wa “miji” katika ngeli ya 4 unahitaji “inayo-”.
- source_word: הֶחָלָל
  choice: huyo aliyeuawa
  rationale: חָלָל humaanisha mtu aliyeuawa. Usemi huu ni wa asili na wenye heshima, na haudai zaidi ya maandiko kwa kutumia neno kama “aliyeuawa kimakusudi”.
