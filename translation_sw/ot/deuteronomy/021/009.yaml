base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/009.yaml
  text: So you shall purge the innocent blood from your midst[a], because you shall do what is right in the eyes of Yahweh.
translation:
  language: sw
  text: Basi utaondoa damu ya asiye na hatia kutoka miongoni mwako[a], utakapofanya yaliyo sawa machoni pa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utaondoa damu isiyo na hatia kutoka miongoni mwako.” Usemi wa Kiebrania “damu isiyo na hatia” unaweza pia kudokeza dhima ya jamii kwa umwagaji damu ambao haujafanyiwa upatanisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Basi
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha hitimisho lenye mkazo. “Basi” huleta nguvu hiyo kwa Kiswahili cha kawaida bila kulazimika kurudia kiwakilishi ambacho tayari kimo katika kitenzi.
- source_word: תְּבַעֵר
  choice: utaondoa
  rationale: Katika sheria za Kumbukumbu la Torati, kitenzi hiki katika Piel humaanisha kuondoa kabisa jambo ovu au dhima ya umwagaji damu kutoka kwa jamii. “Utaondoa” ni wazi na ya asili; kidokezo kinaeleza uzito wake wa kisheria na kijamii.
- source_word: הַ/דָּם הַ/נָּקִי
  choice: damu ya asiye na hatia
  rationale: Kirai hicho kwa karibu ni “damu isiyo na hatia,” lakini Kiswahili hueleweka kwa urahisi zaidi kama damu ya mtu asiye na hatia. Taswira ya damu inadumishwa bila kuibadili kimya kimya kuwa neno la ufafanuzi kama “hatia ya damu.”
- source_word: מִ/קִּרְבֶּךָ
  choice: kutoka katikati yako
  rationale: Huhifadhi usemi wa kijamii na wa kisheria unaoielekeza Israeli kwa umoja, kama katika Kiebrania cha nafsi ya pili umoja.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutoa usomaji wa kisababishi unaofaa muktadha, huku kidokezo kikihifadhi uwezekano wa kuielewa kama “utakapofanya.”
- source_word: תַעֲשֶׂה הַ/יָּשָׁר
  choice: utafanya yaliyo sawa
  rationale: Kitenzi kisichokamilika kinaweza kuwa cha wakati ujao au agizo katika muktadha wa sheria. “Utafanya yaliyo sawa” huhifadhi muundo na maana ya kimaadili kwa Kiswahili cha sasa.
- source_word: בְּ/עֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Huhifadhi sitiari ya Kiebrania kuhusu tathmini ya Mungu na kulitaja jina la agano יְהוָה kwa umbo la Kiswahili “Yahwe.”
theological_decisions:
- issue: Maana ya “damu ya asiye na hatia” katika wajibu wa jamii
  choice: Taswira ya damu yenyewe imedumishwa, na kidokezo kinaeleza kuwa inaweza kujumuisha dhima ya jamii kwa umwagaji damu ambao haujafanyiwa upatanisho.
  alternative: Kutafsiri moja kwa moja kuwa “hatia ya damu isiyo na hatia.”
  rationale: Kiebrania hakitumii neno la wazi la “hatia.” Kuliongeza katika matini kuu kungeamua mapema maana ambayo usemi wa asili unaiacha ndani ya taswira ya damu.
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania ina jina la agano moja kwa moja. “Yahwe” hulitofautisha na cheo “Bwana” na kuakisi kwa ukaribu zaidi jina hilo.
- issue: Uhusiano wa כִּי na kauli iliyotangulia
  choice: kwa maana
  alternative: utakapofanya
  rationale: Usomaji wa kisababishi unawezekana, lakini כִּי inaweza pia kueleweka kwa maana ya wakati au hali katika muktadha huu. Kidokezo kinahifadhi uwezekano huo bila kuuficha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Umoja wa nafsi ya pili wa Kiebrania umehifadhiwa katika vitenzi na katika “yako.”
