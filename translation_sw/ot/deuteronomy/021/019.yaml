translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo unadumisha sauti ya kisheria na ushiriki wa wazazi wote wawili, huku maelezo ya lango yakisaidia kufafanua mazingira ya kitamaduni.
