  yaml_path: translation/ot/deuteronomy/021/019.yaml
  text: then his father and his mother shall seize him and bring him out to the elders of his city and to the gate of his place[a][b].
translation:
  language: sw
  text: basi baba yake na mama yake watamshika na kumtoa nje, wakampeleka kwa wazee wa mji wake na kwenye lango la mahali pake[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, lango la mji, mahali pa hadhara ambapo wazee wa eneo hilo walishughulikia mashauri ya kisheria.
    reason: cultural_note
  - marker: b
    text: 'Au “lango la mji wake.” Kiebrania: “lango la mahali pake.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָפְשׂוּ בוֹ
  choice: watamkamata
  rationale: Kitenzi תפשׂ pamoja na ב kinaonyesha kumshika mtu kwa nguvu au kwa uthabiti. “Watamkamata” ni Kiswahili cha sasa kinachoeleweka na kinadumisha uzito wa hatua hii ya kisheria.
- source_word: אָבִיו וְאִמּוֹ
  choice: baba yake na mama yake
  rationale: Kiebrania kinawataja wazazi wote wawili kando na kwa viambishi vya umilikaji; muundo huu unadumisha msisitizo kwamba wote wanashiriki katika hatua hiyo.
- source_word: וְהוֹצִיאוּ אֹתוֹ
  choice: na kumpeleka
  rationale: Hifili ya יצא humaanisha kumsababisha mtu atoke, yaani kumtoa au kumpeleka nje. Katika muktadha huu, “kumpeleka” huwasilisha kwa kawaida mwendo kutoka nyumbani hadi mahali pa hadhara pa kusikilizia kesi.
- source_word: אֶל זִקְנֵי עִירוֹ
  choice: kwa wazee wa mji wake
  rationale: “Wazee wa mji” ni viongozi wa jamii waliokuwa wakishughulikia mambo ya kisheria; tafsiri hii ni wazi na inafuata muundo wa Kiebrania.
- source_word: וְאֶל שַׁעַר מְקֹמוֹ
  choice: kwenye lango la mahali anapoishi
  rationale: שׁער ni lango la mji, ambalo katika muktadha wa kisheria lilikuwa mahali pa hadhara pa hukumu. מקום ni “mahali”; “mahali anapoishi” ni Kiswahili cha kawaida kinachodumisha maana pana bila kubadili neno hilo moja kwa moja kuwa “mji.”
