base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/023.yaml
  text: His corpse shall not remain all night on the tree[a], but you shall surely bury him that same day, for a hanged man is under God's curse; and you shall not defile your land that Yahweh your God is giving you as an inheritance.
translation:
  language: sw
  text: Maiti yake isibaki usiku kucha juu ya mti, bali ni lazima umzike siku hiyo hiyo, kwa maana mtu aliyetundikwa yuko chini ya laana ya Mungu[a]. Usiinajisi nchi yako ambayo Yahweh Mungu wako anakupa iwe urithi wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana mtu aliyetundikwa amelaaniwa na Mungu”; pia yawezekana, “kwa maana kutundikwa ni dhihaka kwa Mungu.” Kifungu cha Kiebrania ni kifupi na kinaweza kueleweka kwa njia zaidi ya moja.
    reason: alternative_reading
lexical_decisions:
- source_word: תָלִין
  choice: isibaki usiku kucha
  rationale: Kitenzi kinaonyesha kubaki au kukaa usiku; usemi huu ni wa kawaida katika Kiswahili na unahifadhi kikomo cha muda cha katazo.
- source_word: נִבְלָתוֹ
  choice: maiti yake
  rationale: Neno hilo humaanisha mwili uliokufa; “maiti” ni sahihi na ya kawaida kuliko “mwili” peke yake.
- source_word: עַל הָעֵץ
  choice: juu ya mti
  rationale: Tafsiri hii inahifadhi maana ya kawaida ya עֵץ, yaani mti au kitu cha mbao, bila kuamua kwa undani aina ya kifaa kilichotumiwa.
- source_word: קָבוֹר תִּקְבְּרֶנּוּ
  choice: ni lazima umzike
  rationale: Muundo wa Kiebrania unasisitiza amri; “ni lazima” huwasilisha msisitizo huo kwa Kiswahili cha asili.
- source_word: בַּיּוֹם הַהוּא
  choice: siku iyo hiyo
  rationale: Usemi huu unaonyesha kwamba maziko yalipaswa kufanyika kabla siku hiyo haijaisha.
- source_word: קִלְלַת אֱלֹהִים
  choice: laana ya Mungu
  rationale: Muundo mfupi wa Kiebrania unaweza kueleweka kwa njia kadhaa; “laana ya Mungu” huhifadhi uhusiano huo bila kuufafanua kupita kiasi.
- source_word: תָּלוּי
  choice: mtu aliyetundikwa
  rationale: Kivumishi-tendo hiki humaanisha mtu aliyetundikwa au kuning’inizwa; “aliyetundikwa” kinafaa katika muktadha huu wa kuonyesha maiti hadharani.
- source_word: תְטַמֵּא
  choice: usiinajisi
  rationale: Kitenzi טמא kinaweza kuhusisha uchafu wa kiibada na wa kimaadili; “najisi” huhifadhi upana huo.
- source_word: אַדְמָתְךָ
  choice: nchi yako
  rationale: Katika muktadha wa urithi wa agano, “nchi” ni ya kawaida na inafaa zaidi kuliko “udongo”.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: נַחֲלָה
  choice: iwe urithi wako
  rationale: Neno hilo linamaanisha milki inayorithiwa; usemi huu ni wa kawaida na unaonyesha nchi kama zawadi ya kudumu.
theological_decisions:
- issue: Maana ya כִּי קִלְלַת אֱלֹהִים תָּלוּי
  choice: mtu aliyetundikwa yuko chini ya laana ya Mungu
  alternative: mtu aliyetundikwa amelaaniwa na Mungu; au kutundika huko ni jambo la kumvunjia Mungu heshima
  rationale: Kifungu cha Kiebrania ni kifupi na kinaweza kufasiriwa kwa njia zaidi ya moja. Tafsiri kuu inaonyesha kwamba aliyetundikwa ana alama ya laana ya Mungu, lakini tanbihi inahifadhi uwezekano mwingine bila kuondoa mvutano wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia amri zilizo wazi na msamiati unaoeleweka kwa wasomaji wa kawaida, huku ikihifadhi uzito wa lugha ya kisheria na utata halisi wa kifungu kuhusu laana.
