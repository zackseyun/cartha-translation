lexical_decisions:
- source_word: וְ/כִי
  choice: Na ikiwa
  rationale: Huhifadhi kiunganishi pamoja na sharti la kisheria kwa Kiswahili cha kawaida.
- source_word: יִהְיֶה בְ/אִישׁ
  choice: mtu ana
  rationale: Ni uwasilishaji wa kawaida wa Kiswahili wa nahau ya Kiebrania inayosema kwa karibu, ‘kuna ndani ya mtu’; ‘mtu’ hapa inaweza kumrejelea mwanamume kulingana na muktadha na umbo la אִישׁ.
- source_word: חֵטְא
  choice: dhambi
  rationale: Huhifadhi maana pana ya kosa la kimaadili na kisheria bila kulifanya kuwa kosa la kiraia pekee.
- source_word: מִשְׁפַּט מָוֶת
  choice: inayostahili kifo
  rationale: Hutoa maana ya kosa linaloadhibiwa kwa kifo kwa Kiswahili kinachoeleweka, huku tanbihi ikihifadhi uwezekano wa kuelewa hukumu ya kifo.
- source_word: וְ/הוּמָת
  choice: naye akauawa
  rationale: Huhifadhi hali ya kutendwa ya kausativi katika muktadha wa hukumu ya kisheria bila kutumia neno jembamba zaidi lisilolazimishwa na kitenzi.
- source_word: וְ/תָלִיתָ אֹת/וֹ
  choice: ukamtundika
  rationale: Muundo wa mfululizo ‘akauawa, ukamtundika’ unasikika kwa kawaida katika sharti la kisheria na huonyesha kuwa mtu huyo ndiye anayetundikwa.
- source_word: עַל עֵץ
  choice: juu ya mti
  rationale: Hufuata maana ya kawaida na ya wazi ya עֵץ na kuhifadhi mwangwi wake wa baadaye wa kimaandiko; tafsiri ‘nguzo’ inawezekana lakini ni mahususi zaidi.
theological_decisions:
- issue: Mhusika wa kiume katika sheria
  choice: mtu
  alternative: mwanamume
  rationale: אִישׁ inaweza kumaanisha mwanamume au mtu kulingana na muktadha. Kiswahili ‘mtu’ ni cha kawaida katika mtindo wa sheria na hakikanushi kwamba mhusika wa kifungu hiki ametajwa kwa umbo la kiume; kirejeshi cha baadaye katika Kiebrania pia ni cha kiume.
- issue: Maana ya מִשְׁפַּט מָוֶת
  choice: inayostahili kifo
  alternative: iliyo chini ya hukumu ya kifo
  rationale: Muundo wa Kiebrania una mkazo unaoweza kueleweka kama kustahili kifo au kuwa na hukumu ya kifo. Matini kuu inatoa maana ya kisheria kwa kawaida, na tanbihi inadumisha uwezekano mwingine.
- issue: Namna ya עַל עֵץ
  choice: juu ya mti
  alternative: juu ya nguzo
  rationale: Tafsiri ya karibu inadumisha taswira na umuhimu wa kifungu katika marejeo ya baadaye bila kuamua kimbele kifaa maalumu cha kutundikia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini rahisi kueleweka. Muundo wa sharti umeunganishwa kwa ‘Na ikiwa,’ na vitenzi vya mfululizo vimetumiwa ili kuakisi mtindo wa sheria wa Kiebrania bila kufanya sentensi kuwa nzito.
