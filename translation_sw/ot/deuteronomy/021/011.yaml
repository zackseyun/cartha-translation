lexical_decisions:
- source_word: וְ/רָאִיתָ
  choice: ukiona
  rationale: Katika mfuatano huu wa sheria unaotegemea hali iliyotajwa kabla, kitenzi hiki kina maana ya sharti au wakati. “Ukiona” ni Kiswahili cha kawaida kinachounganisha sentensi na muktadha wa “wakati…” uliotangulia.
- source_word: בַּ/שִּׁבְיָה
  choice: miongoni mwa mateka
  rationale: Nomino hii inarejelea kundi la watu waliotekwa vitani. “Miongoni mwa mateka” huhifadhi maana ya mahali bila kuongeza ufafanuzi wa “wafungwa wa vita” ambao hauko wazi katika neno lenyewe.
- source_word: אֵשֶׁת יְפַת תֹּאַר
  choice: mwanamke mwenye umbo zuri
  rationale: Kirai hiki kinaeleza uzuri wa sura au umbo la nje. Tafsiri hii ni ya asili katika Kiswahili na huhifadhi mkazo wa Kiebrania juu ya mwonekano wa kimwili.
- source_word: תֹּאַר
  choice: umbo
  rationale: Neno linaweza kumaanisha umbo au mwonekano. “Umbo” linafuata kwa karibu muundo wa kirai cha Kiebrania, huku “mwonekano” ukibaki kuwa tafsiri mbadala halali katika tanbihi.
- source_word: וְ/חָשַׁקְתָּ בָהּ
  choice: ukamtamani
  rationale: Kitenzi hiki huonyesha tamaa au shauku yenye nguvu. “Ukamtamani” ni cha moja kwa moja na hakipunguzi nguvu yake kuwa kuvutiwa tu.
- source_word: וְ/לָקַחְתָּ לְ/ךָ לְ/אִשָּׁה
  choice: na kutaka kumchukua awe mke wako
  rationale: Kirai cha Kiebrania kwa neno moja moja ni “kumchukua kwa ajili yako kuwa mke.” Katika mfuatano wa masharti unaoendelea hadi aya zinazofuata, “kutaka kumchukua” huonyesha kusudi la kumwoa bila kudokeza kwamba tendo la ndoa limekamilika mara moja, huku “kumchukua awe mke wako” kikihifadhi nahau ya chanzo.
theological_decisions:
- issue: Kutafsiri sheria yenye ugumu wa kimaadili bila kuipunguza makali wala kuingiza hukumu isiyotamkwa katika aya
  choice: Kuhifadhi maelezo ya wazi kuhusu kumtamani mwanamke mateka na kutaka kumchukua awe mke
  alternative: Kulainisha kuwa “ukamchagua awe mke wako,” au kuongeza kwamba aya hiyo inaidhinisha au inalaani kulazimishwa
  rationale: Aya inaeleza hali ya kisheria wakati wa vita kwa lugha ya moja kwa moja. Tafsiri haifichi tamaa ya mwanamume wala haiongezi tathmini ya kimaadili ambayo haijatamkwa hapa. Hivyo mvutano wa kimaadili wa matini unabaki wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “ukiona … ukamtamani” unafaa mfululizo wa sharti wa sheria; “mateka” na “mke wako” ni maneno ya kawaida na yanayoeleweka. Alama zote za tanbihi zimewekwa katika matini kuu.
