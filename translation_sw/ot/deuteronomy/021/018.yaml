base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/018.yaml
  text: If a man has a stubborn and rebellious son who does not listen to the voice of his father or to the voice of his mother[a], and though they discipline him, he does not listen to them[d][c][b],
translation:
  language: sw
  text: Ikiwa mtu ana mwana mkaidi na mwasi, ambaye hasikilizi sauti ya baba yake wala sauti ya mama yake[a], na ingawa wazazi wake wanamwadibisha[c], hasikilizi wazazi wake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtu anapokuwa na mwana...” Muundo huu wa sheria katika Kiebrania unaweza kutafsiriwa kwa “ikiwa” au “wakati.”
    reason: alternative_reading
  - marker: b
    text: “Kusikiliza” hapa kuna maana ya kuyazingatia na kuyatii maelekezo ya wazazi.
    reason: lexical_alternative
  - marker: c
    text: Au, “na wazazi wake wanamwadibisha.” Kiunganishi cha Kiebrania kinaweza kusomwa moja kwa moja, ingawa muktadha pia unaunga mkono maana ya “ingawa.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ikiwa
  rationale: Hutanguliza sharti katika sheria ya tukio maalumu. ‘Ikiwa’ ni ya kawaida na wazi katika Kiswahili, ingawa ‘wakati’ pia linawezekana.
- source_word: יִהְיֶה לְאִישׁ
  choice: mtu ana
  rationale: Muundo wa Kiebrania wa kuwapo pamoja na kihusishi huonyesha umilikaji; ‘mtu ana’ ni Kiswahili cha kawaida.
- source_word: בֵּן
  choice: mwana
  rationale: Neno linamaanisha mwana wa kiume, si mtoto bila kubainisha jinsia.
- source_word: סוֹרֵר וּמוֹרֶה
  choice: mkaidi na mwasi
  rationale: ‘Mkaidi’ huonyesha ukaidi wa kudumu, na ‘mwasi’ huonyesha upinzani wa makusudi; jozi hii huhifadhi mkazo wa maneno mawili ya chanzo.
- source_word: אֵינֶנּוּ שֹׁמֵעַ
  choice: hasikilizi
  rationale: Kitenzi שמע kimsingi ni kusikia au kusikiliza, na katika muktadha huu kinahusisha kutii. ‘Hasikilizi’ huhifadhi urudiaji wa kitenzi hicho.
- source_word: בְּקוֹל אָבִיו וּבְקוֹל אִמּוֹ
  choice: sauti ya baba yake wala sauti ya mama yake
  rationale: ‘Sauti’ huhifadhi nahau ya Kiebrania kuhusu maelekezo yenye mamlaka. ‘Wala’ ni ya asili chini ya ukanushi wa Kiswahili.
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: nao wamemtia nidhamu
  rationale: יסר humaanisha kumrekebisha au kumwadibisha kwa kusudi la malezi. ‘Kumtia nidhamu’ huepuka kudokeza lazima adhabu ya kimwili; kiunganishi ‘nao’ huhifadhi maana ya moja kwa moja ya וְ bila kulazimisha usomaji wa concessive.
- source_word: וְלֹא יִשְׁמַע אֲלֵיהֶם
  choice: lakini hawasikilizi
  rationale: Hurudia שמע kwa mkazo. ‘Lakini’ huonyesha tofauti ya kimuktadha baada ya kutiwa nidhamu, huku ‘hawasikilizi’ ikihifadhi uhusiano wa kileksika.
