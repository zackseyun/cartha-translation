  text: וְ/הֵסִ֩ירָה֩ אֶת שִׂמְלַ֨ת שִׁבְיָ֜/הּ מֵ/עָלֶ֗י/הָ וְ/יָֽשְׁבָה֙ בְּ/בֵיתֶ֔/ךָ וּ/בָֽכְתָ֛ה אֶת אָבִ֥י/הָ וְ/אֶת אִמָּ֖/הּ יֶ֣רַח יָמִ֑ים וְ/אַ֨חַר כֵּ֜ן תָּב֤וֹא אֵלֶ֨י/הָ֙ וּ/בְעַלְתָּ֔/הּ וְ/הָיְתָ֥ה לְ/ךָ֖ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/013.yaml
  text: She shall remove the clothing of her captivity from herself and remain in your house[a], and mourn her father and her mother for a month of days. After that you may go in to her and be her husband, and she shall be your wife.
translation:
  language: sw
  text: Naye atavua vazi la uteka wake[a], atakaa nyumbani mwako, na kuwalilia baba yake na mama yake kwa mwezi mzima. Baada ya hapo utamwingilia na kuwa mume wake, naye atakuwa mke wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mavazi ya hali yake ya kuwa mateka,” au “nguo alizokuwa amevaa alipotekwa.”
    reason: Kishazi cha Kiebrania kinaweza kurejelea vazi linalohusishwa na hali yake ya uteka au nguo aliyokuwa amevaa wakati wa kutekwa.
lexical_decisions:
- source_word: וְהֵסִירָה
  choice: atavua
  rationale: Hifili ya סור inaonyesha kuondoa. Kwa kuwa kinachoondolewa ni mavazi yaliyo mwilini, “atavua” ni Kiswahili cha kawaida na sahihi kuliko tafsiri ngumu ya neno kwa neno.
- source_word: שִׂמְלַת שִׁבְיָהּ
  choice: mavazi ya uteka wake
  rationale: Kauli ya Kiebrania ni halisi, ‘vazi/mavazi ya uteka wake.’ Tafsiri hii inahifadhi uhusiano huo bila kuamua ikiwa ni mavazi aliyotekwa akiwa amevaa au mavazi yanayoonyesha hali yake ya kuwa mateka.
- source_word: מֵעָלֶיהָ
  choice: imewasilishwa ndani ya kitenzi ‘atavua’
  rationale: Maana halisi ni ‘kutoka juu yake.’ Katika Kiswahili, “kuvua” tayari humaanisha kuondoa vazi mwilini, hivyo kuongeza “mwilini mwake” kungekuwa marudio yasiyo ya lazima.
- source_word: וְיָשְׁבָה בְּבֵיתֶךָ
  choice: atakaa nyumbani mwako
  rationale: ישב inaweza kumaanisha kuketi, kukaa, au kuishi. Katika sheria hii, “atakaa” huonyesha kuendelea kuwapo nyumbani humo bila kufanya usemi kuwa mzito.
- source_word: וּבָכְתָה אֶת אָבִיהָ וְאֶת אִמָּהּ
  choice: na kuwalilia baba yake na mama yake
  rationale: בכה kimsingi ni kulia. “Kuwalilia” ni usemi wa kawaida wa Kiswahili unaobeba maana ya kuomboleza watu waliotajwa bila kubadili kitenzi kuwa dhana pana zaidi.
- source_word: יֶרַח יָמִים
  choice: kwa mwezi mzima
  rationale: Nahau hiyo ni halisi ‘mwezi wa siku’ na inaonyesha kipindi kamili cha mwezi. “Mwezi mzima” ni Kiswahili cha asili kinachohifadhi mkazo huo.
- source_word: תָּבֹא אֵלֶיהָ
  choice: utaweza kuingia kwake
  rationale: Usemi ‘kuingia kwake’ unahifadhi nahau ya Kiebrania inayodokeza mahusiano ya kingono. “Utaweza” huonyesha ruhusa ya kisheria katika muktadha huu badala ya amri ya lazima.
- source_word: וּבְעַלְתָּהּ
  choice: na kuwa mume wake
  rationale: Kitenzi בעל katika muktadha huu kinaonyesha kuchukua nafasi ya mume. Tafsiri hii inaepuka lugha ya umiliki na pia haitoi sehemu hii kwa kuifupisha kuwa ‘kumwoa.’
- source_word: וְהָיְתָה לְךָ לְאִשָּׁה
  choice: naye atakuwa mke wako
  rationale: Huu ni muundo wa kawaida wa Kiebrania wa kueleza hadhi ya ndoa; tafsiri hii ni rasmi, wazi, na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Nahau ya kingono na lugha ya ndoa katika sheria ngumu kuhusu mwanamke mateka
  choice: Kuhifadhi ‘kuingia kwake,’ kisha kutaja kuwa mume wake na yeye kuwa mke wako
  alternative: Kutafsiri yote kwa ‘kumwoa,’ au kusema wazi zaidi ‘kufanya naye ngono’
  rationale: Kiebrania kinatofautisha tendo linalodokezwa na ‘kuingia kwake’ na hadhi ya ndoa inayofuata. Kuhifadhi vipengele vyote hakulainishi uzito wa sheria wala kuongeza madai ambayo mstari wenyewe hayasemi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa wakati ujao umetumiwa kuwasilisha masharti ya sheria; nahau yenye utata wa Kiebrania imehifadhiwa pale inapowezekana bila kufanya sentensi isieleweke.
