source:
  edition: WLC
  text: וְ/הָיָ֞ה אִם לֹ֧א חָפַ֣צְתָּ בָּ֗/הּ וְ/שִׁלַּחְתָּ/הּ֙ לְ/נַפְשָׁ֔/הּ וּ/מָכֹ֥ר לֹא תִמְכְּרֶ֖/נָּה בַּ/כָּ֑סֶף לֹא תִתְעַמֵּ֣ר בָּ֔/הּ תַּ֖חַת אֲשֶׁ֥ר עִנִּיתָֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/014.yaml
  text: But if it happens that you do not delight in her[a], then you shall let her go where she wishes; you must certainly not sell her for money. You must not treat her as merchandise[c][b], because you have humiliated her.
translation:
  language: sw
  text: Lakini ikiwa humpendi, mwache aende huru[a]. Kamwe usimuuze kwa fedha. Usimfanye kitu cha biashara[b], kwa sababu umemdhalilisha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maneno halisi, “umtume kwa ajili yake mwenyewe”; yaani, umwachilie awe huru.
    reason: lexical_alternative
  - marker: b
    text: Au, “Usimnyonye kwa faida.” Kitenzi cha Kiebrania ni adimu na huenda kina maana ya kumtumia mtu kama chombo cha faida ya kiuchumi.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa sababu umemtesa,” au “umemkiuka kingono.” Neno la Kiebrania linaweza kumaanisha kutesa, kudhalilisha, au kurejelea ukiukaji wa kingono, kulingana na muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Lakini ikiwa
  rationale: Kifungu hiki kinaendeleza sharti la sheria iliyotangulia huku kikionyesha tofauti; Kiswahili hiki ni cha kawaida na hakiongezi wazo lisilokuwamo.
- source_word: לֹא חָפַצְתָּ בָּהּ
  choice: humpendelei
  rationale: חפץ huonyesha kupendezwa, kutamani, au kufurahia. ‘Humpendelei’ huhifadhi maana ya mtazamo wa kibinafsi bila kuifanya iwe ya kingono kupita ilivyo wazi katika Kiebrania.
- source_word: וְשִׁלַּחְתָּהּ לְנַפְשָׁהּ
  choice: mwache aende huru
  rationale: Kwa neno moja moja ni ‘umtume kwa/ajili ya nafsi yake’; hapa ni nahau ya kumwachilia awe huru na asiwe tena chini ya mamlaka yake.
- source_word: וּמָכֹר לֹא תִמְכְּרֶנָּה בַּכָּסֶף
  choice: Kamwe usimuuze kwa fedha
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichopinda unasisitiza katazo. ‘Kamwe’ huwasilisha mkazo huo, na ‘fedha’ ni sawa ya kawaida ya בַּכָּסֶף katika muktadha wa malipo.
- source_word: לֹא תִתְעַמֵּר בָּהּ
  choice: Usimtumie kama bidhaa
  rationale: Kitenzi hiki adimu huenda kinamaanisha kumtawala au kumtumia mtu kwa faida ya kiuchumi. Sambamba na katazo la kumuuza, tafsiri hii inaonyesha kumfanya kitu cha biashara bila kuficha uhusiano wa unyonyaji.
- source_word: תַּחַת אֲשֶׁר
  choice: kwa sababu
  rationale: Muundo huu unatoa sababu ya katazo; ‘kwa sababu’ ni Kiswahili cha asili na wazi.
- source_word: עִנִּיתָהּ
  choice: umemdhalilisha
  rationale: ענה katika piel inaweza kumaanisha kutesa, kunyenyekeza, kudhalilisha, au kunajisi/kukiuka kingono kulingana na muktadha. ‘Umemdhalilisha’ huhifadhi jeraha na uzito wa tendo bila kulifanya neno hilo liwe mahususi kuliko Kiebrania.
theological_decisions:
- issue: Nguvu ya kimaadili ya sheria kuhusu mwanamke mateka
  choice: 'Kifungu kimetafsiriwa kama kizuizi cha mamlaka ya mwanamume baada ya muungano wa kindoa/kingono: lazima amwachilie, wala hawezi kumuuza au kumfanya bidhaa.'
  alternative: Kutafsiri kana kwamba ni talaka ya hiari kati ya watu waliokubaliana, au kutaja wazi katika matini kuu kwamba tendo lilikuwa ubakaji.
  rationale: Kiebrania chenyewe kinakataza kumfanya mwanamke bidhaa kwa sababu mwanamume ‘amemdhalilisha/amemtesa.’ Tafsiri inapaswa kuhifadhi mazingira ya kulazimishwa na uzito wa kimaadili bila kupunguza ukali wake wala kuamua katika matini kuu maana nyembamba kuliko neno la asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi fupi zinaendeleza nguvu ya makatazo. ‘Humpendelei’ ni ya kawaida kuliko ‘hufurahii ndani yake,’ na ‘mwache aende huru’ huwasilisha kwa uwazi uhuru unaodokezwa na nahau ya Kiebrania. Alama zote za tanbihi [a], [b], na [c] zimo katika matini kuu.
