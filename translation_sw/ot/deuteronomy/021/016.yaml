  text: וְ/הָיָ֗ה בְּ/יוֹם֙ הַנְחִיל֣/וֹ אֶת בָּנָ֔י/ו אֵ֥ת אֲשֶׁר יִהְיֶ֖ה ל֑/וֹ לֹ֣א יוּכַ֗ל לְ/בַכֵּר֙ אֶת בֶּן הָ֣/אֲהוּבָ֔ה עַל פְּנֵ֥י בֶן הַ/שְּׂנוּאָ֖ה הַ/בְּכֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/016.yaml
  text: And on the day he gives his sons as an inheritance what belongs to him[a], he may not treat the son of the loved wife as firstborn over the son of the hated wife, who is the firstborn.
translation:
  language: sw
  text: Na siku atakapowarithisha wanawe mali aliyo nayo, hataruhusiwa kumtambua mwana wa mke anayependwa kuwa mzaliwa wa kwanza badala ya mwana wa mke anayechukiwa[a], ambaye ndiye mzaliwa wa kwanza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mke asiyependwa” au “mke anayependwa kwa kiwango kidogo.” Kiebrania kinatofautisha kihalisi kati ya “anayependwa” na “anayechukiwa,” lakini katika muktadha wa sheria za familia, neno la pili linaweza kumaanisha yule anayependwa kwa kiwango kidogo kuliko mwingine, si lazima anayechukiwa kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: Na siku atakapowarithisha
  rationale: Muundo huu unaendeleza kesi ya kisheria na kuhifadhi picha ya wakati ya ‘siku,’ huku ukiwa wa kawaida katika Kiswahili.
- source_word: הַנְחִילוֹ אֶת בָּנָיו אֵת אֲשֶׁר יִהְיֶה לוֹ
  choice: atakapowarithisha wanawe mali aliyo nayo
  rationale: Kitenzi cha Kiebrania kina maana ya kuwafanya wana warithi au kuwapa urithi; ‘mali aliyo nayo’ huonyesha wazi kitu kinachorithishwa bila kuunganisha vifungu hivi kwa namna isiyo sahihi.
- source_word: לֹא יוּכַל
  choice: hataruhusiwa
  rationale: Katika muktadha huu wa sheria, maneno haya yanaonyesha kutokuwa na ruhusa au haki ya kisheria, si kutokuwa na uwezo wa kimwili.
- source_word: לְבַכֵּר
  choice: kumtambua ... kuwa mzaliwa wa kwanza
  rationale: Kitenzi hapa kinamaanisha kumpa au kumhesabu mtu kuwa na hadhi ya mzaliwa wa kwanza. ‘Kumtambua ... kuwa’ ni Kiswahili cha kawaida kinachohifadhi maana ya kisheria.
- source_word: בֶּן הָאֲהוּבָה
  choice: mwana wa mke anayependwa
  rationale: Neno la Kiebrania linamaanisha ‘anayependwa’; ‘mke’ imewekwa wazi kutokana na muktadha wa sheria kuhusu wake wawili.
- source_word: עַל פְּנֵי
  choice: badala ya
  rationale: Katika ulinganisho huu wa kisheria, kirai kinaonyesha kumpendelea mmoja na kumweka katika nafasi ya mwingine.
- source_word: בֶן הַשְּׂנוּאָה
  choice: mwana wa mke anayechukiwa
  rationale: Tafsiri hii inahifadhi utofautishaji mkali wa Kiebrania kati ya ‘anayependwa’ na ‘anayechukiwa’; uwezekano wa maana linganishi umeelezwa katika tanbihi.
- source_word: הַבְּכֹר
  choice: ambaye ndiye mzaliwa wa kwanza
  rationale: Kirai hiki kinabainisha wazi kwamba mwana wa mke anayechukiwa ndiye mzaliwa wa kwanza halisi.
theological_decisions:
- issue: Uwasilishaji wa utofautishaji wa mahusiano katika sheria ya familia yenye wake wawili
  choice: Kuhifadhi ‘mke anayependwa’ na ‘mke anayechukiwa’ katika matini kuu
  alternative: ‘mke anayependwa’ na ‘mke asiyependwa’ au ‘mke anayependwa kwa kiwango kidogo’
  rationale: Kiebrania kinatumia jozi yenye utofautishaji mkali. Tafsiri kuu haipaswi kuupunguza bila ulazima, lakini tanbihi inahifadhi uwezekano wa kwamba chuki hapa inaonyesha kutopendelewa kwa kulinganisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Lugha ya kisheria imewasilishwa kwa ‘hataruhusiwa,’ na muundo wa urithi umewekwa wazi bila kuongeza maelezo ya kimadhehebu.
