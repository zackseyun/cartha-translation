base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/008.yaml
  text: Make atonement for your people Israel[a], whom you redeemed, O Yahweh, and do not let innocent blood remain among your people Israel. Then the bloodguilt will be atoned for them.
translation:
  language: sw
  text: “Ee Yahwe, fanya upatanisho kwa ajili ya watu wako Israeli, ambao uliwakomboa, wala usiache hatia ya damu ya mtu asiye na hatia ibaki miongoni mwa watu wako Israeli. Na hatia ya damu hiyo itafanyiwa upatanisho kwa ajili yao.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya moja kwa moja zaidi: “na damu hiyo itafanyiwa upatanisho kwa ajili yao.” Neno “damu” limetumiwa hapa kisheria kumaanisha hatia au dhima inayotokana na umwagaji damu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפֵּר
  choice: fanya upatanisho
  rationale: Katika muktadha huu wa ibada na sheria, kitenzi כפר kinaomba kuondolewa kwa hatia kwa njia ya upatanisho; msemo huu unahifadhi maana hiyo bila kutumia tafsiri finyu ya ‘funika.’
- source_word: אֲשֶׁר פָּדִיתָ
  choice: ambao uliwakomboa
  rationale: פדה humaanisha kukomboa au kuokoa kutoka utumwani au chini ya dai fulani; ‘uliwakomboa’ inadumisha lugha ya ukombozi wa agano.
- source_word: יְהוָה
  choice: Ee Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna ya matamshi ya Kiswahili, na ‘Ee’ linaonyesha kwamba ni wito wa moja kwa moja katika sala.
- source_word: וְאַל תִּתֵּן דָּם נָקִי בְּקֶרֶב
  choice: wala usiache hatia ya kumwaga damu isiyo na hatia ibaki miongoni
  rationale: Tafsiri hii ya kimuktadha inaeleza ombi kwamba dhima ya mauaji ya mtu asiye na hatia isibaki juu ya jumuiya. Inawakilisha נתן na בקרב kwa Kiswahili cha kawaida bila kutoa picha potovu ya kuiweka damu halisi katikati yao.
- source_word: וְנִכַּפֵּר לָהֶם הַדָּם
  choice: Ndipo watakapoondolewa hatia ya damu hiyo
  rationale: Nifali ya כפר ina maana ya hali tendwa au matokeo, huku ‘damu’ ikitumika kisheria kwa dhima inayotokana na umwagaji damu. ‘Ndipo’ linaonyesha matokeo ya tendo lililoagizwa.
theological_decisions:
- issue: Maana ya הַדָּם katika kishazi cha mwisho
  choice: hatia ya damu hiyo
  alternative: damu hiyo itafanyiwa upatanisho kwa ajili yao
  rationale: Muktadha unahusu kuondolewa kwa dhima ya jumuiya kutokana na mauaji yasiyotatuliwa, si damu halisi kusamehewa. Tanbihi inahifadhi umbo halisi na uwezekano wa kusoma tamathali ya Kiebrania.
- issue: Jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Kutumia jina binafsi kunawakilisha tetragramatoni moja kwa moja; hakubadilishwi kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sala umetambulishwa kwa “Ee Yahwe”; istilahi “upatanisho” inadumisha uzito wa kiibada na kisheria, na maelezo ya ‘hatia ya damu’ yanafanya nahau ya Kiebrania ieleweke kwa msomaji wa kawaida.
