  text: then you shall bring her into your house[a], and she shall shave her head and trim her nails.
translation:
  language: sw
  text: Kisha utamleta ndani ya nyumba yako, naye atanyoa kichwa chake na kukata kucha zake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na atawaacha kucha zake zikue.” Kihalisi, Kiebrania husema, “na atafanya kucha zake,” usemi wa idiomu ambao maana yake hujadiliwa.
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲבֵאתָהּ
  choice: Kisha utamleta
  rationale: Muundo wa Hifili wenye waw unaendeleza mfuatano wa maagizo ya kisheria. “Kisha” huonyesha hatua inayofuata, na “utamleta” huhifadhi nafsi ya pili ya kiume pamoja na kiambishi cha yambwa cha kike.
- source_word: אֶל תּוֹךְ בֵּיתֶךָ
  choice: ndani ya nyumba yako
  rationale: תּוֹךְ inaelekeza kwenye sehemu ya ndani. Kiswahili “ndani ya nyumba yako” ni cha kawaida na sahihi kuliko tafsiri ngumu ya neno kwa neno kama “katikati ya nyumba yako.”
- source_word: וְגִלְּחָה אֶת רֹאשָׁהּ
  choice: naye atanyoa kichwa chake
  rationale: גלח humaanisha kunyoa, na “kunyoa kichwa” ni usemi wa kawaida wa Kiswahili unaohifadhi tendo halisi bila kuongeza kwamba nywele ziondolewe kabisa.
- source_word: וְעָשְׂתָה אֶת צִפָּרְנֶיהָ
  choice: na kukata kucha zake
  rationale: Kiebrania kinasema kihalisi “atafanya/atashughulikia kucha zake,” usemi wenye maana inayobishaniwa. “Kukata kucha zake” ni tafsiri ya kawaida na inayoeleweka, huku maana nyingine kuu ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Utata wa usemi וְעָשְׂתָה אֶת צִפָּרְנֶיהָ
  choice: Mwanamke atakata kucha zake.
  alternative: Mwanamke ataziacha kucha zake zikue.
  rationale: Kitenzi עשה pamoja na “kucha” hakielezi tendo hilo waziwazi. Maandishi makuu yanatumia maana ya kawaida ya kuzitunza au kuzikata, lakini tanbihi inadumisha tafsiri nyingine inayowezekana bila kuondoa utata halisi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Ndani ya nyumba yako” ni ya asili kuliko uigaji wa “katikati ya nyumba yako.” Alama ya tanbihi imewekwa baada ya maneno yanayohusika moja kwa moja.
