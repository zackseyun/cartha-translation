  yaml_path: translation/ot/deuteronomy/021/020.yaml
  text: Then they shall say to the elders of his city[a], ‘This son of ours is stubborn and rebellious; he does not listen to our voice; he is a glutton and a drunkard.’
translation:
  language: sw
  text: Kisha watawaambia wazee wa mji wake, “Mwana wetu huyu ni mkaidi na mwasi; hasikilizi sauti yetu[a]; ni mlafi na mlevi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hatutii.” Nahau ya Kiebrania kwa maana ya moja kwa moja ni “hasikilizi sauti yetu,” ambapo kusikiliza kunajumuisha maana ya kuzingatia na kutii.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Kisha watawaambia
  rationale: Kiunganishi pamoja na kitenzi kinaendeleza mfuatano wa utaratibu wa kisheria; “kisha” kinaonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: זִקְנֵי עִירוֹ
  choice: wazee wa mji wake
  rationale: “Wazee” hapa ni viongozi wenye mamlaka katika jamii, na “mji” linafaa kwa eneo la kiutawala linalokusudiwa.
- source_word: בְּנֵנוּ זֶה
  choice: Mwana wetu huyu
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unadumisha msisitizo wa kumtambulisha mwana anayeshtakiwa.
- source_word: סוֹרֵר וּמֹרֶה
  choice: mkaidi na mwasi
  rationale: Jozi hii inaonyesha ukaidi wa kudumu na uasi wa wazi, bila kupunguza uzito wa shtaka.
- source_word: אֵינֶנּוּ שֹׁמֵעַ בְּקֹלֵנוּ
  choice: hasikilizi sauti yetu
  rationale: Hii inadumisha taswira ya nahau ya Kiebrania huku ikiruhusu maana ya kutosikia kwa kutii ibaki wazi; tafsiri ya moja kwa moja zaidi ya kimaanawi imewekwa katika tanbihi.
- source_word: זוֹלֵל
  choice: mlafi
  rationale: Katika muktadha huu, hasa kwa kuunganishwa na unywaji, neno linamtaja mtu aliyezoea ulafi.
- source_word: וְסֹבֵא
  choice: na mlevi
  rationale: Neno linaonyesha mtu aliyezoea kunywa kupita kiasi; “mlevi” ni sawia ya kawaida na iliyo wazi.
