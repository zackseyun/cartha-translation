base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/003.yaml
  text: And it shall be that the city nearest to the slain man[c][b][a], the elders of that city shall take a heifer from the herd that has not been worked with and has not pulled in a yoke.
translation:
  language: sw
  text: Itakuwa kwamba wazee wa mji ulio karibu zaidi na yule aliyeuawa[a] watachukua ndama jike kutoka kundini[b], ambaye hajawahi kutumiwa kufanya kazi wala hajawahi kuvuta kwa nira[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maiti” au “yule aliyeuawa.” Neno la Kiebrania humaanisha mtu ambaye ameuawa.
    reason: lexical_alternative
  - marker: b
    text: Au kwa ufupi, “ndama jike.” Usemi wa Kiebrania unamtaja kwa ukamilifu zaidi kuwa ng’ombe jike mchanga kutoka katika kundi la ng’ombe.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “ambaye hakuvuta kwa nira,” yaani, mnyama ambaye hakuwa ametumiwa hapo awali kwa kazi ya kuvuta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Basi
  rationale: Katika muktadha huu wa sheria na hatua inayofuata, neno hili la mpito linaelezwa kwa Kiswahili cha kawaida kama “Basi,” bila kuingiza wazo jipya la wakati.
- source_word: הָעִיר הַקְּרֹבָה אֶל הֶחָלָל
  choice: mji ulio karibu zaidi na yule aliyeuawa
  rationale: “Karibu zaidi” huwasilisha maana ya mji wa karibu kuliko mingine katika muktadha; “yule aliyeuawa” huhifadhi rejeo la חָלָל kwa mtu aliyeuawa.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: wazee wa mji
  rationale: Ni viongozi wazee wanaotambuliwa katika jamii. Kiswahili hakihitaji kurudia “huo” kwa kuwa mji umetajwa katika kishazi kilekile.
- source_word: עֶגְלַת בָּקָר
  choice: ndama jike kutoka kundini
  rationale: “Ndama jike” hutaja mnyama mchanga wa kike, na “kutoka kundini” huwasilisha uhusiano wake na kundi la ng’ombe.
- source_word: אֲשֶׁר לֹא עֻבַּד בָּהּ
  choice: ambaye hajawahi kutumiwa kufanya kazi
  rationale: Kauli hii huonyesha kwamba mnyama huyo hajatumika kama chombo cha kazi; “hajawahi” huwasilisha hali yake ya kutotumiwa hapo kabla.
- source_word: אֲשֶׁר לֹא מָשְׁכָה בְּעֹל
  choice: wala kuvuta akiwa amefungwa nira
  rationale: Kitenzi משך humaanisha kuvuta, na בְּעֹל huonyesha kuvuta chini ya nira; usemi huu ni wa asili na unaeleweka katika Kiswahili.
