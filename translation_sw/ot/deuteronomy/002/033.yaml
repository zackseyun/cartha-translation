base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/033.yaml
  text: And Yahweh our God gave him over to us[a], and we struck him down[b], along with his sons and all his people.
translation:
  language: sw
  text: Yahwe, Mungu wetu, alimtia mikononi mwetu[a], nasi tukampiga yeye, wanawe[b], na watu wake wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “mbele yetu”; katika muktadha huu wa vita maana yake ni kwamba Yahwe alimkabidhi katika uwezo wetu.
    reason: lexical_alternative
  - marker: b
    text: Maandishi ya konsonanti ya Kiebrania yanasoma “mwanawe”; usomaji wa kimapokeo una “wanawe.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ ... לְפָנֵינוּ
  choice: akamtia mikononi mwetu
  rationale: Ingawa לְפָנֵינוּ kihalisi ni ‘mbele yetu,’ pamoja na נתן katika muktadha wa vita inaonyesha kumweka adui chini ya mamlaka ya Israeli. Nahau ya Kiswahili ‘kumtia mikononi mwetu’ inawasilisha maana hiyo kwa kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kama ‘Yahwe,’ badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Muundo wenye kiambishi cha nafsi ya kwanza wingi una maana ya moja kwa moja ya ‘Mungu wetu.’
- source_word: וַנַּךְ
  choice: tukamwangamiza
  rationale: Katika simulizi la vita, נכה hapa huonyesha kumpiga adui kwa ushindi wa mauti, si kumpiga tu. ‘Kumwangamiza’ ni usemi wa kawaida wa Kiswahili unaoonyesha matokeo hayo.
- source_word: בנו
  choice: wanawe
  rationale: Maandishi ya konsonanti yanaweza kusomwa ‘mwanawe,’ lakini usomaji wa kimapokeo na muktadha wa taarifa hii ya vita huunga mkono maana ya wingi, ‘wanawe.’ Tofauti hiyo imehifadhiwa katika tanbihi.
- source_word: כָּל עַמּוֹ
  choice: watu wake wote
  rationale: עַם kwa kawaida humaanisha ‘watu’; tafsiri hii ni ya moja kwa moja na haipunguzi rejeo hilo kuwa jeshi pekee.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi la Mungu, יהוה. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha na cheo, bila kuingiza msimamo wa kimadhehebu.
- issue: Umoja au wingi katika בנו
  choice: wanawe
  alternative: mwanawe
  rationale: Konsonanti zinaweza kuwakilisha umoja, lakini katika muktadha huu neno hilo limeeleweka kwa mapokeo kuwa la wingi au la mkusanyiko. Tanbihi inaonyesha ushahidi wa umoja bila kuuficha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Akamtia mikononi mwetu’ ni nahau ya kawaida ya kukabidhi mtu chini ya mamlaka ya mwingine. ‘Tukamwangamiza’ inaonyesha ushindi wenye mauti katika muktadha huu; tanbihi [b] imewekwa karibu na kishazi husika huku ikieleza tofauti inayohusu ‘wanawe.’
