  text: They too were considered Rephaim[a], like the Anakim; but the Moabites call them Emim.
translation:
  language: sw
  text: Wao pia walihesabiwa kuwa Warefai[a], kama Waanaki; lakini Wamoabu huwaita Waemi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “majitu” kwa “Warefai”; ingawa hapa Kiebrania kwa kawaida zaidi huhifadhi jina la kundi la watu wa kale.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְפָאִים
  choice: Warefai
  rationale: Jina limetoholewa kama jina la kundi la watu wa kale badala ya kufasiriwa moja kwa moja kuwa “majitu”; hii inahifadhi aina ya rejeo katika muktadha wa Kumbukumbu la Torati.
- source_word: יֵחָשְׁבוּ
  choice: walihesabiwa kuwa
  rationale: Huhifadhi maana ya kauli tendwa ya kuonwa au kuainishwa kuwa sehemu ya kundi fulani, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: אַף הֵם
  choice: hao pia
  rationale: Huonyesha msisitizo wa kuwajumuisha watu hawa katika kundi lililotajwa.
- source_word: כָּעֲנָקִים
  choice: kama vile Waanaki
  rationale: Kiambishi כ־ kinaonyesha ulinganisho; “kama vile” huwasilisha ulinganisho huo wazi, huku Waanaki likihifadhiwa kama jina la kundi la watu.
- source_word: וְהַמֹּאָבִים
  choice: lakini Wamoabu
  rationale: Waw hapa inaunganisha sentensi huku ikihamisha wazo kutoka uainishaji wa jumla kwenda jina walilotumia Wamoabu; “lakini” hufanya badiliko hilo lieleweke kiasili.
- source_word: יִקְרְאוּ לָהֶם
  choice: huwaita
  rationale: Muundo קרא ל una maana ya kuita au kuwapa jina; “huwaita” ni usemi wa kawaida na unaonyesha desturi yao ya kuwataja.
- source_word: אֵמִים
  choice: Waemi
  rationale: Jina limetoholewa kama jina la watu, kwa kutumia kiambishi cha Kiswahili Wa- kinachofaa kwa kundi la watu.
