  edition: WLC
  text: וְ/לֹ֣א אָבָ֗ה סִיחֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן הַעֲבִרֵ֖/נוּ בּ֑/וֹ כִּֽי הִקְשָׁה֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת רוּח֗/וֹ וְ/אִמֵּץ֙ אֶת לְבָב֔/וֹ לְמַ֛עַן תִּתּ֥/וֹ בְ/יָדְ/ךָ֖ כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/030.yaml
  text: But Sihon king of Heshbon was not willing to let us pass through his land[a], because Yahweh your God had hardened his spirit and made his heart stubborn, in order to give him into your hand, as it is this day.
translation:
  language: sw
  text: Lakini Sihoni, mfalme wa Heshboni, hakukubali kuturuhusu tupite katika nchi yake, kwa sababu Yahwe Mungu wako alikuwa ameifanya roho yake kuwa ngumu na kuufanya moyo wake kuwa mkaidi,[a] kusudi amtie mikononi mwako, kama ilivyo leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kuutia nguvu moyo wake.” Kitenzi cha Kiebrania kinaweza kumaanisha “kutia nguvu,” lakini katika muktadha huu huenda kinaonyesha kumfanya awe mkaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: hakukubali
  rationale: Kitenzi hiki huonyesha kutokuwa tayari au kutokubali; ‘hakukubali’ ni Kiswahili cha kawaida kinachohifadhi maana ya hiari.
- source_word: הַעֲבִרֵנוּ בּוֹ
  choice: kuturuhusu tupite katika nchi yake
  rationale: Hifili ya עבר hapa ina maana ya kuruhusu kupita, na kiwakilishi katika בּוֹ kinarejelea eneo la Sihoni katika muktadha.
- source_word: הִקְשָׁה ... אֶת רוּחוֹ
  choice: alikuwa ameifanya roho yake kuwa ngumu
  rationale: Tafsiri hii huhifadhi neno ‘roho’ na maana ya kusababisha ugumu bila kulifupisha kuwa tu ukaidi wa mtu.
- source_word: וְאִמֵּץ אֶת לְבָבוֹ
  choice: na kuufanya moyo wake kuwa mkaidi
  rationale: Ingawa אמץ inaweza kumaanisha kuimarisha au kutia nguvu, katika muktadha huu inaonyesha moyo uliofanywa thabiti katika upinzani; ‘mkaidi’ huwasilisha nguvu hiyo kwa uwazi.
- source_word: לְמַעַן
  choice: kusudi
  rationale: Neno hili linaonyesha lengo au kusudi.
- source_word: תִּתּוֹ בְיָדְךָ
  choice: amtie mikononi mwako
  rationale: Nahau ya Kiebrania ina maana ya kumkabidhi mtu chini ya mamlaka ya mwingine; ‘mikononi mwako’ ni nahau ya asili katika Kiswahili.
- source_word: כַּיּוֹם הַזֶּה
  choice: kama ilivyo leo
  rationale: Huhifadhi rejeleo la hali ya sasa inayodhihirisha matokeo yaliyotajwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Mungu kuufanya moyo kuwa mgumu na Sihoni kutokubali
  choice: 'Kauli zote mbili zimehifadhiwa moja kwa moja: Sihoni hakukubali, na Yahwe aliifanya roho yake kuwa ngumu na moyo wake kuwa mkaidi.'
  alternative: Kusema Mungu aliruhusu tu ugumu huo, au kusisitiza kuwa Sihoni pekee ndiye aliyejifanya mgumu.
  rationale: Kiebrania kinataja wazi wajibu wa hiari wa Sihoni pamoja na tendo la Yahwe; tafsiri haipaswi kuondoa mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa msomaji, huku maneno ya Kiebrania ‘roho,’ ‘moyo,’ na nahau ‘mikononi mwako’ yakihifadhiwa. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
