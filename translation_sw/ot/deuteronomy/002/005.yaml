base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/005.yaml
  text: Do not provoke them[a], for I will not give you any of their land, not even enough to set the sole of a foot on[c][b], because I have given Mount Seir to Esau as a possession.
translation:
  language: sw
  text: Msiwachokoze[a], kwa maana sitawapa sehemu yoyote ya nchi yao, hata nafasi ya kukanyaga kwa wayo wa mguu, kwa sababu nimempa Esau Mlima Seiri[c] kuwa milki yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Msianzishe ugomvi nao” au “Msipambane nao.”'
    reason: lexical_alternative
  - marker: b
    text: “Kuwa milki yake” pia inaweza kutafsiriwa “kuwa urithi wake.”
    reason: lexical_alternative
  - marker: c
    text: “Mlima Seiri” inaweza pia kurejelea eneo la milima la Seiri.
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְגָּרוּ בָם
  choice: Msiwachokoze
  rationale: Kitenzi katika muundo huu kinaeleza kuwachochea au kuanzisha uhasama dhidi yao. “Msiwachokoze” ni Kiswahili cha sasa na kifupi kinachohifadhi katazo la kuanzisha ugomvi bila kulifanya kuwa amri inayohusu vita rasmi pekee.
- source_word: לֹא אֶתֵּן לָכֶם מֵאַרְצָם
  choice: sitawapa sehemu yoyote ya nchi yao
  rationale: Kihusishi מִן kina maana ya sehemu ya kitu; usemi huu unaonyesha kwamba hawatapewa hata sehemu moja ya nchi hiyo.
- source_word: עַד מִדְרַךְ כַּף רָגֶל
  choice: hata mahali pa kukanyaga wayo wa mguu
  rationale: Tafsiri hii inadumisha picha halisi ya wayo unaokanyaga huku ikieleza kwa Kiswahili kinachoeleweka kwamba hawatapewa hata sehemu ndogo kabisa ya ardhi.
- source_word: יְרֻשָּׁה
  choice: kuwa milki
  rationale: Neno hili linaweza kumaanisha milki au urithi. Katika muktadha huu linakazia eneo ambalo Mungu alimpa Esau alimiliki; maana mbadala ya “urithi” imehifadhiwa katika tanbihi.
- source_word: לְעֵשָׂו
  choice: nimempa Esau
  rationale: Kiambishi לְ kinaonyesha mpokeaji wa zawadi hiyo; jina la mtu limetoholewa kuwa “Esau” kwa matumizi ya kawaida ya Kiswahili.
- source_word: הַר שֵׂעִיר
  choice: Mlima Seiri
  rationale: Hili ni jina la kawaida la mahali, ingawa muundo wa Kiebrania unaweza pia kurejelea eneo lote la milima la Seiri.
theological_decisions:
- issue: Mungu kumpa Esau eneo la Edomu
  choice: Katazo la kuwachokoza linaelezwa kwa msingi kwamba Mungu mwenyewe alimpa Esau Mlima Seiri.
  alternative: Kulieleza kama katazo la kisiasa tu bila kukazia ugawaji wa nchi unaofanywa na Mungu.
  rationale: Vishazi viwili vinavyoanza na כִּי vinaweka wazi kwamba katazo linategemea uamuzi wa Mungu kuhusu nchi hiyo. Tafsiri inahifadhi sababu hiyo bila kuongeza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Taswira ya wayo wa mguu imehifadhiwa, na sintaksia imerahisishwa bila kuondoa msisitizo wa kutopata hata sehemu ndogo ya nchi.
