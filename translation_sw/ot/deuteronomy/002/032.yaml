  text: Then Sihon came out to meet us[a], he and all his people[b], for battle at Jahaz.
translation:
  language: sw
  text: Ndipo Sihoni akatoka kukutana nasi[a], yeye pamoja na watu wake wote, kwa vita huko Yahasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kutukabili; katika muktadha huu kukutana huko ni kwa uhasama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: Kitenzi hiki kinasimulia tukio lililopita na humwonyesha Sihoni akitoka kwenda kwenye makabiliano; “akatoka” ni cha kawaida na kinafuata mtiririko wa simulizi.
- source_word: סִיחֹן
  choice: Sihoni
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yaliyozoeleka katika Kiswahili.
- source_word: לִקְרָאתֵנוּ
  choice: kukutana nasi
  rationale: Hii ndiyo maana ya msingi ya kirai hicho. Muktadha wa vita unaonyesha kwamba kukutana huko kulikuwa kwa uhasama, bila kulazimisha maana hiyo ndani ya kirai chenyewe.
- source_word: הוּא וְכָל עַמּוֹ
  choice: yeye pamoja na watu wake wote
  rationale: Kiwakilishi huru “yeye” kinadumisha msisitizo wa Kiebrania, na “watu wake wote” huhifadhi maana pana ya עַם bila kuibana kuwa jeshi la kitaalamu pekee.
- source_word: לַמִּלְחָמָה
  choice: ili kupigana nasi
  rationale: Kirai hiki kinaonyesha kusudi la kutoka kwao. Kiswahili hiki ni cha asili zaidi kuliko tafsiri ya neno kwa neno “kwa vita,” huku kikihifadhi kusudi la mapambano.
- source_word: יָהְצָה
  choice: Yahasa
  rationale: Jina la mahali limetoholewa kwa umbo linalofaa Kiswahili na linalotambulika katika mapokeo ya majina ya Biblia ya Kiswahili.
