translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo unahifadhi msisitizo wa “yeye” na maana pana ya “watu wake wote,” huku tanbihi ikihifadhi uwezekano wa kutafsiri kirai cha kukutana kwa namna ya wazi zaidi kama makabiliano.
