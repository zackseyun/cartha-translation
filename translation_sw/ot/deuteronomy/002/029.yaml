  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר עָֽשׂוּ לִ֜/י בְּנֵ֣י עֵשָׂ֗ו הַ/יֹּֽשְׁבִים֙ בְּ/שֵׂעִ֔יר וְ/הַ/מּ֣וֹאָבִ֔ים הַ/יֹּשְׁבִ֖ים בְּ/עָ֑ר עַ֤ד אֲשֶֽׁר אֶֽעֱבֹר֙ אֶת הַ/יַּרְדֵּ֔ן אֶל הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/029.yaml
  text: just as the sons of Esau who live in Seir and the Moabites who live in Ar did for me[a], until I cross the Jordan into the land that Yahweh our God is giving to us.
translation:
  language: sw
  text: kama vile wazao wa Esau wanaoishi Seiri na Wamoabu wanaoishi Ari walivyonifanyia[a], mpaka nitakapovuka Yordani na kuingia katika nchi ambayo Yahwe, Mungu wetu, anatupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walivyonitendea.” Kiebrania kinasema kwa maana halisi, “walinifanyia,” kikirejelea katika muktadha kuruhusu kupita na kutoa mahitaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Inaonyesha ulinganisho kwa Kiswahili cha kawaida na kudumisha nguvu ya kauli ya Kiebrania.
- source_word: עָשׂוּ לִי
  choice: walivyonitendea
  rationale: Ni usemi wa asili unaodumisha maana pana ya ‘walivyonifanyia/kunishughulikia’ bila kutaja kwa uwazi zaidi ya Kiebrania ruhusa ya kupita na mahitaji yaliyotolewa.
- source_word: בְּנֵי עֵשָׂו
  choice: wazao wa Esau
  rationale: Ingawa maana halisi ni ‘wana wa Esau,’ hapa usemi huo unalitaja kundi la watu waliotokana na Esau; ‘wazao’ ni wazi na wa kawaida kwa msomaji wa Kiswahili.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: wanaoishi Seiri
  rationale: Kitenzi kishirikishi kinaonyesha makao ya kudumu; ‘wanaoishi’ ni Kiswahili cha sasa na cha kawaida.
- source_word: וְהַמּוֹאָבִים
  choice: na Wamoabu
  rationale: Jina la taifa limetolewa moja kwa moja kwa umbo la kawaida la Kiswahili.
- source_word: הַיֹּשְׁבִים בְּעָר
  choice: wanaoishi Ari
  rationale: Muundo unaolingana na ule wa Seiri umehifadhiwa; Ari ni jina la mahali.
- source_word: עַד אֲשֶׁר אֶעֱבֹר
  choice: mpaka nitakapovuka
  rationale: ‘Kuvuka’ ndiyo njia ya kawaida ya kueleza kwenda upande mwingine wa mto, huku ‘mpaka’ ikidumisha mpaka wa wakati.
- source_word: אֶת הַיַּרְדֵּן
  choice: Yordani
  rationale: Jina linalotumika kwa kawaida katika Kiswahili; neno ‘Mto’ si lazima kwa kuwa muktadha wa kuvuka unatosha.
- source_word: אֶל הָאָרֶץ
  choice: na kuingia katika nchi
  rationale: Inaeleza kwa kawaida mwendo wa kuvuka Yordani kuelekea ndani ya nchi, badala ya kufika tu kwenye mpaka wake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina binafsi la Mungu katika umbo linalotamkika na kutumika kwa kawaida katika Kiswahili, badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Ni tafsiri ya moja kwa moja ya usemi wa agano na hudumisha nafsi ya wingi.
- source_word: נֹתֵן לָנוּ
  choice: anatupa
  rationale: Wakati wa sasa unaonyesha utoaji unaoendelea au ulio hakika, kama kitenzi kishirikishi cha Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko lina jina binafsi la Mungu, si cheo; ‘Yahwe’ hulihifadhi kwa umbo la kawaida la Kiswahili.
- issue: Uhusiano wa עָשׂוּ לִי na ruhusa ya kupita
  choice: walivyonitendea
  alternative: walivyoniruhusu kupita na kuniuzia mahitaji
  rationale: Tafsiri kuu haiongezi maelezo yasiyotajwa moja kwa moja katika kishazi hiki; tanbihi inaeleza maana inayodokezwa na muktadha.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhiwa kama mwendelezo wa mstari uliotangulia, kwa kuwa chanzo kinaanza na kishazi cha ulinganisho. Majina yametolewa kwa maumbo ya kawaida ya Kiswahili: Seiri, Wamoabu, Ari, Yordani, na Yahwe.'
