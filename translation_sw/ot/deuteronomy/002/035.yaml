- from: Lakini mifugo tu ndiyo tuliyojitwalia kuwa nyara, pamoja na mali zilizotekwa katika miji tuliyoiteka.[a]
  to: Tulijinyakulia tu mifugo na nyara za miji tuliyoiteka.[a]
