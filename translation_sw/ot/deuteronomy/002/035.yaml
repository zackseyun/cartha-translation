  text: רַ֥ק הַ/בְּהֵמָ֖ה בָּזַ֣זְנוּ לָ֑/נוּ וּ/שְׁלַ֥ל הֶ/עָרִ֖ים אֲשֶׁ֥ר לָכָֽדְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/035.yaml
  text: Only the livestock we took as plunder for ourselves[a], along with the spoil of the cities that we captured.
translation:
  language: sw
  text: Tulijinyakulia tu mifugo na nyara za miji tuliyoiteka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mifugo tu tulijinyakulia kama nyara, pamoja na nyara za miji tuliyoiteka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Lakini ... tu
  rationale: 'Katika muktadha huu neno hilo linaweka tofauti na maangamizi yaliyotajwa katika mstari uliotangulia: watu waliangamizwa, lakini mifugo na mali zilibaki kuwa nyara.'
- source_word: הַבְּהֵמָה
  choice: mifugo
  rationale: Linamaanisha wanyama wa kufugwa waliotwaliwa vitani, si wanyama kwa ujumla.
- source_word: בָּזַזְנוּ לָנוּ
  choice: tuliyojitwalia kuwa nyara
  rationale: Kauli hii huhifadhi maana ya kutwaa nyara, huku kiambishi cha kujirejelea katika “tuliyojitwalia” kikionyesha kuwa walijitwalia kwa ajili yao wenyewe.
- source_word: וּשְׁלַל
  choice: pamoja na mali zilizotekwa
  rationale: שָׁלָל ni mali au nyara zinazotwaliwa vitani; “mali zilizotekwa” ni ya kawaida na huepuka kurudia mara moja neno “nyara.”
- source_word: הֶעָרִים
  choice: miji
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa עָרִים katika simulizi la kuteka maeneo.
- source_word: אֲשֶׁר לָכָדְנוּ
  choice: tuliyoiteka
  rationale: לכד katika muktadha wa kijeshi humaanisha kuteka au kukamata; “kuteka miji” ni usemi wa kawaida na sahihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Muundo wa “Lakini ... tu” unaonyesha kizuizi kinachohusiana na mstari uliotangulia, na “mali zilizotekwa” hutoa maana ya nyara za vita bila urudiaji mzito.
