  text: Kisha Yahwe akaniambia hivi:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu: “Na Yahwe akaniambia, akisema.” Neno la mwisho la Kiebrania linatanguliza maneno yanayofuata katika mstari unaofuata; hapa kazi yake imewasilishwa kwa “hivi:”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akaniambia
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi. “Kisha” huonyesha hatua inayofuata kwa Kiswahili cha kawaida, na “akaniambia” huwasilisha kwa kawaida maana ya kusema kwa mtu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe” badala ya kubadilishwa na cheo kama “BWANA,” hivyo kuhifadhi jina la kibinafsi lililo katika maandishi ya Kiebrania.
- source_word: אֵלַי
  choice: -ni- katika “akaniambia”
  rationale: Kiambishi cha yambwa “-ni-” katika “akaniambia” kinawasilisha kwa kawaida maana ya אֵלַי, yaani “kwangu/mimi,” bila kuhitaji kirai tofauti.
- source_word: לֵאמֹר
  choice: 'hivi:'
  rationale: Infinitivu hii hutanguliza maneno ya moja kwa moja yanayofuata. Katika Kiswahili cha asili, “hivi:” baada ya “akaniambia” hutekeleza kazi hiyo bila uradidi usio wa kawaida wa “akisema.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” huhifadhi jina hilo kama jina la kibinafsi bila kulibadilisha kuwa cheo, huku “Yehova” likiwa umbo la baadaye lililotokana na mapokeo ya usomaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “akaniambia hivi:” ni wa kawaida na unaunganisha mstari huu kwa uwazi na hotuba inayoanza katika mstari unaofuata.
