base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/013.yaml
  text: Now rise up and cross over the Wadi Zered[a]. So we crossed over the Wadi Zered.
translation:
  language: sw
  text: Sasa inukeni, mvuke Kijito cha Zeredi[a]. Basi tukavuka Kijito cha Zeredi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Korongo la Zeredi” au “Bonde la Zeredi.” Neno la Kiebrania נחל linaweza kumaanisha kijito, korongo, au bonde lenye mkondo wa maji, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Sasa
  rationale: Ni kiashiria cha wakati kinachoanzisha tendo linaloamriwa, na kinahifadhi uharaka wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: קֻמוּ
  choice: inukeni
  rationale: Ni amri ya wingi ya קום; “inukeni” ni ya heshima, ya sasa, na hudumisha nguvu ya amri.
- source_word: וְעִבְרוּ
  choice: mvuke
  rationale: Katika muktadha wa safari, עבר humaanisha kutoka upande mmoja kwenda mwingine; “mvuke” ni usemi wa asili wa Kiswahili.
- source_word: לָכֶם
  choice: —
  rationale: Dativi hii ya kiidioma inaongeza msisitizo kwa amri lakini haihitaji kutafsiriwa moja kwa moja katika Kiswahili; maana yake imejumuishwa katika amri.
- source_word: נַחַל
  choice: Kijito
  rationale: נחל inaweza kumaanisha mkondo wa maji, bonde lenye mkondo, au korongo linalobeba maji kwa majira. “Kijito” ni neno linaloeleweka kwa urahisi, huku tanbihi ikihifadhi upana wa maana.
- source_word: זָרֶד
  choice: Zeredi
  rationale: Ni jina la mahali; “Zeredi” linafuata umbo lililozoeleka katika mapokeo ya majina ya Biblia kwa Kiswahili.
- source_word: וַנַּעֲבֹר
  choice: Basi tukavuka
  rationale: Wayyiqtol ya nafsi ya kwanza wingi inasimulia utekelezaji unaofuatia amri; “Basi tukavuka” huonyesha mfuatano huo kwa kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa amri na utekelezaji wake umehifadhiwa, pamoja na utata wa kijiografia wa נחל katika tanbihi.
