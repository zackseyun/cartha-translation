source:
  edition: WLC
  text: וַֽ/נַּעֲבֹ֞ר מֵ/אֵ֧ת אַחֵ֣י/נוּ בְנֵי עֵשָׂ֗ו הַ/יֹּֽשְׁבִים֙ בְּ/שֵׂעִ֔יר מִ/דֶּ֨רֶךְ֙ הָֽ/עֲרָבָ֔ה מֵ/אֵילַ֖ת וּ/מֵ/עֶצְיֹ֣ן גָּ֑בֶר וַ/נֵּ֨פֶן֙ וַֽ/נַּעֲבֹ֔ר דֶּ֖רֶךְ מִדְבַּ֥ר מוֹאָֽב־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/008.yaml
  text: So we passed on from our brothers[a], the sons of Esau, who live in Seir, away from the way of the Arabah, from Elath and from Ezion-geber[b]; and we turned and passed by the way of the wilderness of Moab.
translation:
  language: sw
  text: Basi tukapita mbali na ndugu zetu[b], wana wa Esau, waliokaa Seiri, tukitoka katika njia ya Araba[a], kutoka Elathi na Esion-geberi. Kisha tukageuka, tukapita kwa njia ya nyika ya Moabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “barabara ya Araba.” Araba ni eneo la bonde la ufa lililo kusini mwa Bahari ya Chumvi.
    reason: lexical_alternative
  - marker: b
    text: Au “jamaa zetu, wazao wa Esau.” Kiebrania kinasema moja kwa moja “ndugu zetu, wana wa Esau.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַנַּעֲבֹר מֵאֵת
  choice: tukapita kutoka kwa
  rationale: Kitenzi עבר pamoja na מֵאֵת kinaonyesha kuendelea na safari baada ya kupita karibu na watu fulani; tafsiri hii inadumisha wazo la kupita na kuondoka kwao.
- source_word: אַחֵינוּ בְנֵי עֵשָׂו
  choice: ndugu zetu, wana wa Esau
  rationale: Inahifadhi moja kwa moja lugha ya undugu na namna ya Kiebrania ya kuwatambulisha Waedomu kuwa wana wa Esau.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: waliokuwa wakiishi Seiri
  rationale: ישב hapa inaeleza makao ya kudumu; ‘kuishi’ ni Kiswahili cha sasa na cha kawaida.
- source_word: מִדֶּרֶךְ הָעֲרָבָה
  choice: tukaiacha njia ya Araba
  rationale: דֶּרֶךְ ni njia au barabara, na מן inaonyesha kuondoka kwenye njia hiyo. Araba imehifadhiwa kama jina la eneo badala ya kufasiriwa tu kuwa tambarare au jangwa.
- source_word: מֵאֵילַת וּמֵעֶצְיֹן גָּבֶר
  choice: kutoka Elathi na Esion-geberi
  rationale: Inafuata kwa karibu viambishi vya Kiebrania vinavyoonyesha mahali pa kuanzia, huku majina yakitoholewa kwa tahajia ya Kiswahili.
- source_word: וַנֵּפֶן
  choice: tukageuka
  rationale: פנה inaonyesha kubadili mwelekeo; ‘tukageuka’ ni fupi, wazi, na ya asili.
- source_word: וַנַּעֲבֹר דֶּרֶךְ מִדְבַּר מוֹאָב
  choice: tukapita kwa njia ya nyika ya Moabu
  rationale: Inadumisha kurudiwa kwa עבר na neno דֶּרֶךְ. ‘Nyika’ linafaa kwa eneo lisilokaliwa sana bila kudokeza lazima kuwa ni jangwa la mchanga.
theological_decisions:
- issue: Lugha ya undugu kuhusu wana wa Esau
  choice: ndugu zetu, wana wa Esau
  alternative: jamaa zetu, wazao wa Esau
  rationale: Kiebrania kinawaita kwa wazi ‘ndugu zetu’; kudumisha usemi huo kunahifadhi uhusiano wa kindugu kati ya Israeli na Edomu bila kuugeuza kuwa neno la jumla la ukaribu wa kikabila.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ya safari na hadhi ya maandiko. Majina yametoholewa kama Seiri, Elathi, Esion-geberi, na Moabu. Alama za tanbihi zimewekwa baada ya maneno yanayohusika ili kuepuka mkanganyiko uliokuwa katika safu ya mashauriano ya Kiingereza.
