source:
  edition: WLC
  text: מֵֽ/עֲרֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנֹ֜ן וְ/הָ/עִ֨יר אֲשֶׁ֤ר בַּ/נַּ֨חַל֙ וְ/עַד הַ/גִּלְעָ֔ד לֹ֤א הָֽיְתָה֙ קִרְיָ֔ה אֲשֶׁ֥ר שָׂגְבָ֖ה מִמֶּ֑/נּוּ אֶת הַ/כֹּ֕ל נָתַ֛ן יְהוָ֥ה אֱלֹהֵ֖י/נוּ לְ/פָנֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/036.yaml
  text: From Aroer[a], which is on the edge of the Arnon Valley, and the city that is in the valley, as far as Gilead, there was no town too high for us; Yahweh our God gave all of it before us.
translation:
  language: sw
  text: Kuanzia Aroeri, ulioko ukingoni mwa Bonde la Arnoni, na mji ulioko ndani ya bonde hilo, mpaka Gileadi, hapakuwa na mji uliokuwa juu mno kwetu[a]; Yahwe Mungu wetu alitukabidhi yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hapakuwa na mji uliokuwa na nguvu nyingi mno kwetu,” au “hapakuwa na mji usioweza kufikiwa nasi.” Kiebrania kinasema kihalisi kwamba hakuna mji “uliokuwa juu mno kwetu,” kikitumia kimo kama sitiari ya uimara wa ulinzi au kutofikika.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֲרֹעֵר
  choice: Kuanzia Aroeri
  rationale: Kiambishi מ־ kinaonyesha mwanzo wa eneo linalotajwa; “Kuanzia” ni Kiswahili cha kawaida kinachowasilisha maana hiyo.
- source_word: שְׂפַת נַחַל אַרְנֹן
  choice: ukingoni mwa Bonde la Arnoni
  rationale: שָׂפָה ni ‘ukingo’ au ‘kingo,’ na נַחַל hapa inataja bonde au korongo la Arnoni. “Bonde” linaeleweka kwa urahisi bila kupoteza rejeo la kijiografia.
- source_word: וְהָעִיר אֲשֶׁר בַּנַּחַל
  choice: na mji ulioko ndani ya bonde hilo
  rationale: Tafsiri hii inahifadhi kiunganishi rahisi וְ na maelezo ya mahali bila kuongeza ‘kuanzia,’ ambayo haipo wazi katika kishazi hiki.
- source_word: וְעַד הַגִּלְעָד
  choice: mpaka Gileadi
  rationale: עַד huonyesha mwisho wa eneo linaloelezwa; “mpaka” ni usemi wa kawaida na sahihi.
- source_word: קִרְיָה
  choice: mji
  rationale: Neno hili linaweza kumaanisha mji au makazi yenye ngome; “mji” ni pana na la kawaida katika Kiswahili.
- source_word: שָׂגְבָה מִמֶּנּוּ
  choice: ulikuwa juu mno kwetu
  rationale: Tafsiri hii inadumisha sitiari ya Kiebrania ya kuwa ‘juu’ huku tanbihi ikieleza maana zinazowezekana za nguvu za ulinzi au kutofikika.
- source_word: אֶת־הַכֹּל
  choice: yote
  rationale: Hurejelea kwa ujumla eneo na miji yote iliyotajwa, bila kulazimisha rejeo la umoja au wingi katika Kiswahili.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahwe Mungu wetu
  rationale: Jina la agano יהוה limetolewa kama “Yahwe,” likifuatiwa na “Mungu wetu” kulingana na muundo wa chanzo.
- source_word: לְפָנֵינוּ
  choice: mbele yetu
  rationale: Huhifadhi nahau ya Kiebrania inayomaanisha kuwekwa mbele yao, na katika muktadha inaashiria kutiwa chini ya uwezo wao bila kuipanua ndani ya maandishi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni, kwa hiyo jina la agano limedumishwa kama “Yahwe” badala ya kubadilishwa kuwa cheo.
- issue: Kauli kuhusu miji kuwa ‘juu’
  choice: Kudumisha sitiari ya kuwa juu katika maandishi
  alternative: Kutafsiri moja kwa moja kuwa miji ilikuwa yenye nguvu sana au isiyofikika
  rationale: Kiebrania kinaweza kueleweka kwa upande wa kimo, uimara wa ulinzi, au kutofikika. Kudumisha sitiari na kueleza maana nyingine katika tanbihi huepuka kuondoa utata halisi.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina ya mahali yameandikwa kwa maumbo yaliyozoeleka katika Kiswahili: Aroeri, Arnoni, na Gileadi. Muundo unafuata mwendo wa kijiografia wa chanzo na kuhifadhi sitiari yake kuu.'
