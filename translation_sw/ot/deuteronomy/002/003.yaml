translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Wingi wa amri umehifadhiwa katika “geukeni,” na sentensi imeepuka maneno yasiyo ya lazima.
