  text: רַב לָ/כֶ֕ם סֹ֖ב אֶת הָ/הָ֣ר הַ/זֶּ֑ה פְּנ֥וּ לָ/כֶ֖ם צָפֹֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/003.yaml
  text: You have gone around this hill country long enough[a]; turn northward.
translation:
  language: sw
  text: Mmelizunguka eneo hili la milima[a] kwa muda wa kutosha; geukeni kuelekea kaskazini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlima huu.” Neno la Kiebrania הַר linaweza kumaanisha mlima mmoja au eneo la milima; hapa muktadha mpana wa safari unapendelea “eneo la milima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב לָכֶם סֹב
  choice: Mmelizunguka ... kwa muda wa kutosha
  rationale: Nahau hii inaonyesha kwamba tendo la kuzunguka limeendelea kiasi cha kutosha. Muundo huu ni wa kawaida katika Kiswahili na unahifadhi maana ya ukomo uliokusudiwa.
- source_word: הָהָר הַזֶּה
  choice: eneo hili la milima
  rationale: Neno הַר linaweza kumaanisha mlima mmoja au eneo la milima. Katika muktadha huu wa safari, maana pana ya kijiografia inafaa zaidi.
- source_word: פְּנוּ
  choice: geukeni
  rationale: Amri hii inataka wasafiri wabadili mwelekeo; “geukeni” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: צָפֹנָה
  choice: kuelekea kaskazini
  rationale: Kiambishi cha mwelekeo katika Kiebrania kinaonyesha mwendo unaoelekea upande wa kaskazini.
- source_word: לָכֶם
  choice: haikutafsiriwa kando
  rationale: Kiwakilishi hiki baada ya amri hakihitaji kutafsiriwa kando katika Kiswahili; kukiongeza kama “kwa ajili yenu wenyewe” kungefanya sentensi iwe nzito na kunaweza kudokeza mkazo usiokusudiwa.
