id: DEU.2.14
reference: Deuteronomy 2:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הַ/יָּמִ֞ים אֲשֶׁר הָלַ֣כְנוּ מִ/קָּדֵ֣שׁ בַּרְנֵ֗עַ עַ֤ד אֲשֶׁר עָבַ֨רְנוּ֙ אֶת נַ֣חַל זֶ֔רֶד שְׁלֹשִׁ֥ים וּ/שְׁמֹנֶ֖ה שָׁנָ֑ה עַד תֹּ֨ם כָּל הַ/דּ֜וֹר אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ מִ/קֶּ֣רֶב הַֽ/מַּחֲנֶ֔ה כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע יְהוָ֖ה לָ/הֶֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/014.yaml
  text: And the days that we traveled from Kadesh-barnea until we crossed the Wadi Zered were thirty-eight years[a], until the entire generation of the men of war had come to an end from the midst of the camp, just as Yahweh had sworn to them.
translation:
  language: sw
  text: Na muda wa kusafiri kwetu kutoka Kadesh-barnea hata tulipovuka Bonde la Zered[a] ulikuwa miaka thelathini na minane, mpaka kizazi chote cha wanaume wa vita kilipokwisha kutoweka kutoka katikati ya kambi, kama Yahweh alivyowaapia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kijito cha Zered.” Neno la Kiebrania linaweza kumaanisha bonde lenye mkondo wa msimu, kijito, au mkondo wa maji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיָּמִים
  choice: Na muda
  rationale: Ingawa neno kwa neno ni ‘na siku,’ hapa kirai kinaonyesha kipindi chote cha safari; ‘muda’ ni Kiswahili cha kawaida na huhifadhi maana ya muda uliopita.
- source_word: הָלַכְנוּ
  choice: tuliosafiri
  rationale: Katika muktadha wa mwendo wa jangwani, kitenzi kina maana ya kusafiri, si kutembea kwa miguu tu.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: kutoka Kadesh-barnea
  rationale: Jina la mahali limetoholewa bila kulipa maana mpya.
- source_word: עַד אֲשֶׁר עָבַרְנוּ
  choice: mpaka tulipovuka
  rationale: Kitenzi עבר pamoja na mkondo wa maji humaanisha kuvuka; muundo huu ni wa kawaida katika Kiswahili.
- source_word: נַחַל זֶרֶד
  choice: Bonde la Mto Zered
  rationale: נחל inaweza kutaja bonde lenye mkondo wa msimu, kijito, au mkondo wenyewe. ‘Bonde la Mto Zered’ linaeleweka kwa wasomaji wa Kiswahili na linafaa kwa jiografia ya eneo hilo bila kuficha uwezekano mwingine, unaotajwa katika tanbihi.
- source_word: שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: miaka thelathini na minane
  rationale: Huu ndio usemi wa kawaida wa Kiswahili wa namba hiyo.
- source_word: עַד תֹּם
  choice: hadi ... kilipokuwa kimekwisha
  rationale: Muundo huu unaonyesha kukamilika hatua kwa hatua kwa kizazi hicho katika kipindi kilichotajwa.
- source_word: כָּל הַדּוֹר
  choice: kizazi kizima
  rationale: Huhifadhi maana ya jumla ya kundi lote kwa Kiswahili cha kawaida.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: wanaume wa vita
  rationale: Huhifadhi rejeo la wazi la kiume na lugha ya vita ya Kiebrania bila kuibadili kuwa kundi lisilobainishwa kijinsia.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: kutoka katikati ya kambi
  rationale: Huhifadhi nahau ya Kiebrania inayosisitiza kutoweka kwao miongoni mwa waliokuwa kambini.
- source_word: כַּאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: kama vile Yahweh alivyokuwa amewaapia
  rationale: Huhifadhi wazi jina la Mungu na kiapo, huku wakati timilifu ukionyesha kuwa kiapo kilitangulia kutimia kwake.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Lugha ya kijinsia katika אַנְשֵׁי הַמִּלְחָמָה
  choice: wanaume wa vita
  alternative: wapiganaji; mashujaa wa vita
  rationale: Kiebrania kinarejelea wanaume waziwazi katika muktadha wa kizazi cha wanaume wenye umri wa kwenda vitani; tafsiri haipunguzi ubainifu huo.
- issue: Maana ya kutoweka kwa kizazi
  choice: kilipokuwa kimekwisha kutoka katikati ya kambi
  alternative: kilipokuwa kimeangamia kutoka kambini
  rationale: ‘Kimekwisha’ huhifadhi usemi wa chanzo bila kuongeza moja kwa moja namna ya mwisho wao, ingawa muktadha mpana unaonyesha hukumu na vifo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ndefu ya chanzo imehifadhiwa kwa mtiririko unaosomeka; majina ya maeneo na jina Yahweh yamewasilishwa kwa uwazi.
