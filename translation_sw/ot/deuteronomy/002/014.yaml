    issue: “Bonde la Mto Zered”
    rationale: Kirai hiki si cha kawaida kwa Kiswahili na huifanya נחל kuwa “bonde la mto,” ilhali neno la Kiebrania linaweza kurejelea wadi, mkondo wa msimu, au kijito. “Bonde la Zered” ni pana na tanbihi huhifadhi mbadala.
  - severity: medium
    issue: “kizazi ... kilipokuwa kimekwisha kutoka katikati ya kambi”
    rationale: Kwa Kiswahili, “kutoka” hapa inaweza kusikika kama kuondoka kwa hiari. Kitenzi “kutoweka” hutoa maana ya תֹּם—kukomeshwa/kumalizika kutoka miongoni mwa kambi—bila kubainisha namna ya vifo.
  - severity: low
    issue: Muundo wa mwanzo na wa kiapo
    rationale: “Muda wa kusafiri kwetu” ni wa kawaida zaidi, na “kama Yahweh alivyowaapia” hutoa kiapo kwa Kiswahili fasaha bila wakati timilifu wa mzunguko usiohitajika.
  revised_text: Na muda wa kusafiri kwetu kutoka Kadesh-barnea hata tulipovuka Bonde la Zered[a] ulikuwa miaka thelathini na minane, mpaka kizazi chote cha wanaume wa vita kilipokwisha kutoweka kutoka katikati ya kambi, kama Yahweh alivyowaapia.
