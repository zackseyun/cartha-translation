lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: Niruhusu nipite
  rationale: Kitenzi cha cohortative katika muktadha huu wa ujumbe wa kidiplomasia kinaonyesha ombi la heshima; ‘Niruhusu nipite’ ni Kiswahili cha kawaida kinachobeba nguvu hiyo.
- source_word: בְאַרְצֶךָ
  choice: katika nchi yako
  rationale: Baada ya kitenzi ‘kupita,’ kihusishi ב kinaonyesha kupita ndani ya eneo la mwenye nchi; ‘katika nchi yako’ ni cha asili na hakiongezi wazo lisilokuwamo.
- source_word: בַּדֶּרֶךְ בַּדֶּרֶךְ
  choice: kwa kufuata njia tu
  rationale: Kurudiwa kwa ‘njia’ katika Kiebrania kunasisitiza kushikamana kabisa na njia; neno ‘tu’ linahifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: אֵלֵךְ
  choice: nitakwenda
  rationale: הלך katika muktadha wa safari humaanisha kwenda; ‘nitakwenda’ ni tafsiri wazi na ya kawaida.
- source_word: לֹא אָסוּר
  choice: Sitageuka kwenda
  rationale: סור humaanisha kugeuka au kuiacha njia; muundo huu unaendeleza taswira ya safari na unaungana kwa kawaida na maelekezo yanayofuata.
- source_word: יָמִין וּשְׂמֹאול
  choice: kulia wala kushoto
  rationale: Huu ni usemi wa pande mbili unaomaanisha kutokengeuka upande wowote; ‘wala’ hufaa katika sentensi hasi ya Kiswahili.
