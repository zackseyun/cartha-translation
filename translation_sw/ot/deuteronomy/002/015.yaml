  yaml_path: translation/ot/deuteronomy/002/015.yaml
  text: Moreover[a], the hand of Yahweh was against them[b], to throw them into confusion from the midst of the camp until they were finished off.
translation:
  language: sw
  text: Zaidi ya hayo, mkono wa Yahweh ulikuwa dhidi yao, ili kuwavuruga kutoka katikati ya kambi[a] mpaka walipokwisha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ili kuwatia hofu na kuwatimua” au “ili kuwashinda vibaya”; kitenzi cha Kiebrania kinaweza kumaanisha kusababisha hofu, mkanganyiko, au kuvurugika kama tendo la hukumu ya Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au “mpaka walipofikia mwisho wao” au “mpaka walipoangamia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Zaidi ya hayo
  rationale: Inaonyesha mwendelezo wenye mkazo kutoka kauli iliyotangulia kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יַד יְהוָה
  choice: mkono wa Yahweh
  rationale: Inahifadhi nahau ya Kiebrania inayomaanisha nguvu au tendo la Mungu, pamoja na jina la agano Yahweh.
- source_word: בָם
  choice: dhidi yao
  rationale: Katika muundo huu, kihusishi kinaonyesha kuwa tendo la Yahweh lilielekezwa kwao kwa hukumu.
- source_word: לְהֻמָּם
  choice: ukiwavuruga
  rationale: Kitenzi המם kinaweza kumaanisha kusababisha hofu, mkanganyiko, au kuvurugika; tafsiri hii haikichanganyi moja kwa moja na matokeo ya kuangamia.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: na kuwaondoa katikati ya kambi
  rationale: ‘Katikati ya kambi’ huhifadhi taswira halisi ya Kiebrania, huku ‘kuwaondoa’ ikifanya nguvu ya מן (‘kutoka’) ieleweke kwa Kiswahili cha kawaida.
- source_word: עַד תֻּמָּם
  choice: mpaka walipokwisha
  rationale: Inaonyesha kufikia mwisho kabisa kwa kundi bila kuamua kupita kiasi ikiwa mkazo ni kuangamia, kukomeshwa, au kutoweka.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko lina jina la pekee la Mungu, YHWH; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Mkono wa Yahweh dhidi yao
  choice: dhidi yao
  alternative: juu yao
  rationale: Muktadha ni wa hukumu ya Mungu, kwa hiyo ‘dhidi yao’ huonyesha wazi nguvu hasi ya בָם bila kuficha kwamba Yahweh ndiye anayetekeleza tendo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nahau ya Kiebrania ‘mkono wa Yahweh’ imehifadhiwa, huku muundo wa sentensi ukifanywa kuwa wa kawaida kwa msomaji wa Kiswahili. Alama za tanbihi zimewekwa kwenye vipashio vinavyohusika.
