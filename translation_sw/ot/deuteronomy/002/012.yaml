id: DEU.2.12
reference: Deuteronomy 2:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/בְ/שֵׂעִ֞יר יָשְׁב֣וּ הַ/חֹרִים֮ לְ/פָנִים֒ וּ/בְנֵ֧י עֵשָׂ֣ו יִֽירָשׁ֗וּ/ם וַ/יַּשְׁמִידוּ/ם֙ מִ/פְּנֵי/הֶ֔ם וַ/יֵּשְׁב֖וּ תַּחְתָּ֑/ם כַּ/אֲשֶׁ֧ר עָשָׂ֣ה יִשְׂרָאֵ֗ל לְ/אֶ֨רֶץ֙ יְרֻשָּׁת֔/וֹ אֲשֶׁר נָתַ֥ן יְהוָ֖ה לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/012.yaml
  text: And in Seir the Horites formerly lived[a], but the sons of Esau dispossessed them and destroyed them from before them, and settled in their place, just as Israel did to the land of his possession[c][b], which Yahweh gave to them.
translation:
  language: sw
  text: Na katika Seiri Wahori waliishi zamani, lakini wana wa Esau wakawanyang’anya makazi yao, wakawaondoa mbele yao kwa kuwaangamiza, wakakaa mahali pao, kama Israeli alivyofanya kwa nchi yake ya urithi, ambayo Yahweh aliwapa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֹרִים
  choice: Wahori
  rationale: Jina la kabila limetoholewa kwa muundo wa kawaida wa Kiswahili wa majina ya watu, badala ya kulitafsiri kana kwamba ni neno la kawaida.
- source_word: לְפָנִים
  choice: hapo zamani
  rationale: Hapa neno lina maana ya wakati uliopita, si mahali; ‘hapo zamani’ ni Kiswahili cha asili na kinachoeleweka kwa urahisi.
- source_word: יִירָשׁוּם
  choice: wakawanyang’anya nchi yao
  rationale: Kitenzi ירשׁ katika muktadha huu kinaunganisha kuiondoa jamii iliyokuwapo na kuitwaa milki yake. Kauli hii ni ya kawaida kwa Kiswahili na inadumisha pande zote mbili za maana.
- source_word: וַיַּשְׁמִידוּם
  choice: wakawaangamiza
  rationale: שׁמד ni lugha kali ya uharibifu. ‘Waangamiza’ inadumisha uzito huo bila kuongeza maelezo yasiyosemwa wazi.
- source_word: מִפְּנֵיהֶם
  choice: kutoka mbele yao
  rationale: Tafsiri hii inadumisha taswira ya nahau ya Kiebrania; tanbihi inaeleza kwamba maana yake ni kuwaondoa wasiwepo tena mbele yao.
- source_word: תַּחְתָּם
  choice: mahali pao
  rationale: Katika muktadha huu, neno linaonyesha kwamba wana wa Esau walichukua nafasi ya wakazi wa awali.
- source_word: כַּאֲשֶׁר עָשָׂה יִשְׂרָאֵל
  choice: kama Israeli alivyofanya
  rationale: Muundo huu unadumisha ulinganisho wa moja kwa moja na Israeli kama umoja wa kijumla.
- source_word: לְאֶרֶץ יְרֻשָּׁתוֹ
  choice: kwa nchi ya milki yake
  rationale: יְרֻשָּׁה inaweza kumaanisha urithi au milki inayopokelewa na kushikiliwa. ‘Milki yake’ inadumisha wazo la umiliki na kiwakilishi cha umoja kinachorejelea Israeli kwa ujumla.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: לָהֶם
  choice: aliwapa
  rationale: Muundo huu unadumisha mabadiliko ya Kiebrania kutoka Israeli kama umoja wa kijumla (‘yake’) hadi watu wengi wanaounda Israeli (‘aliwapa’).
theological_decisions:
- issue: Mahali pa kihistoria panaporejelewa na kauli ‘kama Israeli alivyofanya’
  choice: Kauli imedumishwa kama ulinganisho wa kihistoria bila kutatua mjadala wa mpangilio wa matukio au uhariri wa maandishi.
  alternative: Kuitafsiri kana kwamba ni nyongeza ya baadaye, au kubadili wakati wa tendo ili kuepuka wazo kwamba Israeli tayari alikuwa ameitwaa nchi.
  rationale: Maandishi ya Kiebrania yanatoa ulinganisho huo moja kwa moja. Tafsiri haipaswi kuingiza suluhisho la kihistoria au la kiuhakiki lisiloelezwa katika mstari.
- issue: Umoja na wingi katika marejeo kwa Israeli
  choice: Kudumisha ‘milki yake’ kisha ‘aliwapa.’
  alternative: Kusawazisha marejeo yote yawe ya wingi, kwa mfano ‘milki yao ... aliwapa.’
  rationale: Kiebrania humtaja Israeli kwanza kama umoja wa kijumla, kisha huwataja watu wake kwa wingi. Mvutano huo wa kisarufi umedumishwa.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: ‘Yahweh’ linadumisha jina binafsi lililo katika maandishi ya chanzo badala ya kuliweka cheo mahali pake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi ulio wa heshima na unaoeleweka. Msururu wa vitenzi vya ‘waka-’ unadumisha mwendo wa simulizi la Kiebrania. Majina ‘Wahori,’ ‘Esau,’ ‘Israeli,’ na ‘Yahweh’ yametolewa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili.
