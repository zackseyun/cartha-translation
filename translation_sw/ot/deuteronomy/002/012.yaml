revisions:
- from: Huko Seiri, Wahori waliishi hapo zamani, lakini wana wa Esau wakawanyang’anya nchi yao[a], wakawaangamiza kutoka mbele yao[b], na kukaa mahali pao, kama Israeli alivyofanya kwa nchi ya milki yake[c], ambayo Yahweh aliwapa.
  to: Na katika Seiri Wahori waliishi zamani, lakini wana wa Esau wakawanyang’anya makazi yao, wakawaondoa mbele yao kwa kuwaangamiza, wakakaa mahali pao, kama Israeli alivyofanya kwa nchi yake ya urithi, ambayo Yahweh aliwapa.
  rationale: The revision retains the Hebrew sequence and ambiguity while restoring the Horites as the direct object of dispossession. It renders the destruction/removal idiom in natural Swahili, makes the settlement action finite and parallel, and uses an idiomatic inheritance expression for the land while preserving the Hebrew singular ‘his’ and plural ‘them’ shift.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T17:10:00Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the Horites, the former-time reference, Esau's sons, the strong destruction verb, the replacement of prior inhabitants, and the singular-to-plural reference to Israel. However, “wakawanyang’anya nchi yao” makes ‘their land’ the direct object where the Hebrew directly says that Esau's sons dispossessed ‘them’; it is a legitimate contextual implication but should not replace the stated object. The phrase “wakawaangamiza kutoka mbele yao” is overly literal and unidiomatic in Swahili.
  naturalness: 'A few small changes yield more natural Standard East African Swahili: use a finite coordinated verb, “wakakaa,” rather than infinitival “na kukaa”; express the Hebrew removal idiom naturally as “wakawaondoa mbele yao kwa kuwaangamiza”; and use “nchi yake ya urithi” for a clearer, idiomatic rendering of the possession/inheritance-land phrase.'
  terminology: “Wahori,” “Esau,” “Israeli,” and “Yahweh” are suitable. “Urithi” is preferable in the main text for יְרֻשָּׁה, while “milki” remains a useful footnote alternative. The historic and severe language of dispossession and destruction is retained without intensifying it beyond the Hebrew.
  issues:
  - severity: medium
    issue: The dispossession clause shifts the Hebrew object from the Horites to their land.
    rationale: 'יִירָשׁוּם has the Horites as its direct object: Esau''s sons dispossessed them. Mentioning the land may be implied, but the translation should first retain the people as the object.'
  - severity: medium
    issue: “Wakawaangamiza kutoka mbele yao” is not idiomatic Swahili.
    rationale: The Hebrew idiom combines destruction with removal from their presence. A natural Swahili expression should communicate both aspects without a wooden use of “kutoka mbele yao.”
  - severity: low
    issue: “na kukaa” lacks the finite narrative coordination of the surrounding verbs.
    rationale: “wakakaa” naturally continues the completed narrative actions and represents the replacement sense of תַּחְתָּם.
  - severity: low
    issue: “nchi ya milki yake” is less natural and can suggest a political realm.
    rationale: “nchi yake ya urithi” clearly expresses the inherited possession denoted by יְרֻשָּׁה while retaining the singular pronoun for collective Israel.
  revised_text: Na katika Seiri Wahori waliishi zamani, lakini wana wa Esau wakawanyang’anya makazi yao, wakawaondoa mbele yao kwa kuwaangamiza, wakakaa mahali pao, kama Israeli alivyofanya kwa nchi yake ya urithi, ambayo Yahweh aliwapa.
  revised_footnotes:
  - marker: a
    text: Au, “wakawafukuza na kuchukua makazi yao.” Kitenzi cha Kiebrania kinaweza kumaanisha kutwaa makazi kwa kuwaondoa waliokuwa wayakikalia.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “mbele yao”; ni nahau inayomaanisha kuwaondoa wasiwepo tena mbele yao.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa nchi ya milki yake.”
    reason: lexical_alternative
  revision_rationale: The revision retains the Hebrew sequence and ambiguity while restoring the Horites as the direct object of dispossession. It renders the destruction/removal idiom in natural Swahili, makes the settlement action finite and parallel, and uses an idiomatic inheritance expression for the land while preserving the Hebrew singular ‘his’ and plural ‘them’ shift.
