base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/010.yaml
  text: The Emim formerly lived there[a], a people great and numerous and tall as the Anakim.
translation:
  language: sw
  text: Waemi waliishi humo zamani[a]. Walikuwa watu wakubwa, wengi, na warefu kama Waanaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hapo awali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵמִים
  choice: Waemi
  rationale: Jina la kabila limetoholewa kwa Kiswahili kwa kutumia kiambishi cha ngeli ya watu Wa-, badala ya kutafsiri maana inayodhaniwa ya jina hilo.
- source_word: לְפָנִים
  choice: zamani
  rationale: Katika msemo huu neno lina maana ya wakati uliopita, yaani hapo awali au nyakati za zamani, si mahali.
- source_word: יָשְׁבוּ בָהּ
  choice: waliishi humo
  rationale: Kitenzi pamoja na kihusishi kinaonyesha kukaa katika eneo lililotajwa; “humo” huhifadhi rejeo la ndani ya nchi au eneo hilo.
- source_word: עַם
  choice: watu
  rationale: Hapa neno linamaanisha jamii au kundi la kikabila kwa ujumla.
- source_word: גָּדוֹל
  choice: wakubwa
  rationale: Huhifadhi maana pana ya ukubwa na kutisha kwa kundi hilo bila kuifanya iwe idadi pekee, kwa kuwa wingi umetajwa tofauti.
- source_word: וְרַב
  choice: wengi
  rationale: Katika mfuatano huu kivumishi kinaeleza idadi kubwa ya watu.
- source_word: וָרָם
  choice: warefu
  rationale: Katika kulinganishwa na Waanaki, maana inayokusudiwa ni kimo cha mwili.
- source_word: כָּעֲנָקִים
  choice: kama Waanaki
  rationale: Kiambishi cha ulinganisho כ־ kimetafsiriwa “kama,” na jina la watu limetoholewa kwa umbo la Kiswahili.
