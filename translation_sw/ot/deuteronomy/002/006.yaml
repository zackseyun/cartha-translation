base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/006.yaml
  text: You shall buy food from them with silver[a], so that you may eat; and you shall also buy water from them with silver, so that you may drink.
translation:
  language: sw
  text: Mtanunua chakula kutoka kwao kwa fedha, ili mle; pia mtanunua maji kutoka kwao kwa fedha, ili mnywe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹכֶל
  choice: chakula
  rationale: Ni neno la jumla linalomaanisha chakula au kitu cha kuliwa; muktadha haulazimishi maana finyu ya nafaka.
- source_word: תִּשְׁבְּרוּ
  choice: mtanunua
  rationale: Kitenzi שׁבר hapa kinamaanisha kununua chakula kwa malipo.
- source_word: מֵאִתָּם
  choice: kutoka kwao
  rationale: 'Kirai hiki kinaonyesha chanzo: Waisraeli wanapaswa kupata mahitaji hayo kutoka kwa watu hao, si kuyachukua bila malipo.'
- source_word: בַּכֶּסֶף
  choice: kwa fedha
  rationale: Huhifadhi picha halisi ya Kiebrania ya fedha inayotumiwa kama malipo, huku ikiwa wazi katika Kiswahili.
- source_word: וַאֲכַלְתֶּם
  choice: ili mle
  rationale: Katika agizo hili, mfuatano wa waw pamoja na perfect unaeleweka kwa kawaida kuwa matokeo au kusudi la kununua chakula.
- source_word: וְגַם
  choice: pia
  rationale: Huongeza agizo la pili linalolingana na la kwanza, kuhusu maji.
- source_word: מַיִם
  choice: maji
  rationale: Hili ndilo neno la kawaida na la moja kwa moja la Kiswahili.
- source_word: תִּכְרוּ
  choice: mtanunua
  rationale: Ingawa כרה inaweza kumaanisha kuchimba mahali pengine, usambamba na ununuzi wa chakula pamoja na kutajwa kwa fedha unaonyesha maana ya kununua hapa.
- source_word: וּשְׁתִיתֶם
  choice: ili mnywe
  rationale: Kama ilivyo kwa kula, hapa tendo la kunywa linaeleza kusudi au matokeo yaliyokusudiwa ya kununua maji.
theological_decisions:
- issue: Nguvu ya kimaadili na kisheria ya agizo kuhusu mali za Edomu
  choice: Israeli inaagizwa kulipia chakula na maji badala ya kuvichukua bila malipo.
  alternative: Tafsiri rasmi zaidi inaweza kusema, “nanyi mle ... nanyi mnywe,” bila kuweka wazi uhusiano wa kusudi au matokeo.
  rationale: Muktadha wa Kiebrania unaagiza kupata mahitaji hayo kwa njia halali ya ununuzi. “Ili mle ... ili mnywe” huwasilisha kwa Kiswahili uhusiano wa kusudi au matokeo bila kuongeza wajibu mpya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kwa fedha” kimetumiwa badala ya “kwa pesa” ili kuhifadhi usemi halisi wa Kiebrania. Muundo wa wingi “mtanunua ... mle ... mnywe” unaendana na vitenzi vya Kiebrania vilivyo katika nafsi ya pili wingi.
