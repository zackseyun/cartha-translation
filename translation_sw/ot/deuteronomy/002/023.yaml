  yaml_path: translation/ot/deuteronomy/002/023.yaml
  text: As for the Avvim[a], who lived in villages as far as Gaza, the Caphtorim, who came out from Caphtor[b], destroyed them and settled in their place.
translation:
  language: sw
  text: Kuhusu Waavi[a] waliokaa katika vijiji[b] hadi Gaza, Wakaftori waliotoka Kaftori waliwaangamiza na wakakaa mahali pa Waavi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina hili la watu linaweza pia kutoholewa kuwa “Waavimu.”
