    reason: lexical_alternative
lexical_decisions:
- source_word: הָעַוִּים
  choice: Waavi
  rationale: Jina la kundi la watu limetoholewa kwa muundo wa kawaida wa Kiswahili wa majina ya jamii; halitafsiriwi kimaana.
- source_word: הַיֹּשְׁבִים
  choice: waliokaa
  rationale: Kitenzi ישב hapa kinaonyesha kuishi au kukaa mahali; ‘waliokaa’ ni cha kawaida na kinahifadhi wazo la makazi.
- source_word: בַּחֲצֵרִים
  choice: katika vijiji
  rationale: חֲצֵרִים linaweza kumaanisha vijiji visivyo na kuta, makazi, au kambi; ‘vijiji’ ni neno la asili na linalofaa katika muktadha, huku tanbihi ikihifadhi upana wa maana.
- source_word: עַד עַזָּה
  choice: hadi Gaza
  rationale: עַד huonyesha kikomo cha kijiografia; ‘hadi Gaza’ ni usemi wa kawaida wa Kiswahili.
- source_word: כַּפְתֹּרִים
  choice: Wakaftori
  rationale: Jina la jamii limetoholewa kwa namna inayosomeka kwa Kiswahili.
- source_word: הַיֹּצְאִים מִכַּפְתּוֹר
  choice: waliotoka Kaftori
  rationale: Huhifadhi maana ya mwendo kutoka mahali fulani bila kufanya sentensi kuwa nzito.
- source_word: הִשְׁמִידֻם
  choice: waliangamizwa na
  rationale: Muundo wa kutendwa ni wa asili katika Kiswahili hapa na unaonyesha wazi kwamba Wakaftori ndio waliowaangamiza Waavi; שׁמד katika Hifili hubeba maana yenye nguvu ya kuangamiza.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: nao wakakaa mahali pao
  rationale: Usemi huu unaonyesha kwamba Wakaftori walichukua nafasi na eneo la waliokuwa wakaaji; ‘wakakaa mahali pao’ huhifadhi ukaaji na uingizwaji.
