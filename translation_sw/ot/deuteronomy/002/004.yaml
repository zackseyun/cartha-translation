base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/004.yaml
  text: And command the people[a], saying, ‘You are about to pass through the territory of your brothers, the sons of Esau, who live in Seir; and they will be afraid of you[c][b]. So be very careful.’
translation:
  language: sw
  text: Na uwaamuru watu, ukisema, ‘Mnakaribia kupita katika eneo la ndugu zenu, wana wa Esau, wanaoishi Seiri. Nao watawaogopa; kwa hiyo jihadharini sana.[a]’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Nao watawaogopa. Jihadharini sana.” Kiunganishi cha Kiebrania kinaweza kueleweka kama mwendelezo wa moja kwa moja au kama hitimisho: “kwa hiyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: uwaamuru
  rationale: Kitenzi hiki ni agizo lenye mamlaka. ‘Uwaamuru’ kinahifadhi nguvu ya amri huku kikisomeka kwa kawaida katika Kiswahili.
- source_word: הָעָם
  choice: watu
  rationale: Neno עַם hapa linawahusu Waisraeli kwa ujumla; ‘watu’ ndilo neno la kawaida na sahihi.
- source_word: אַתֶּם עֹבְרִים
  choice: mnakaribia kupita
  rationale: Kiwakilishi pamoja na umbo la kushiriki la Kiebrania linaonyesha tendo lililo karibu kutokea katika muktadha huu.
- source_word: בִּגְבוּל
  choice: katika eneo
  rationale: גְּבוּל linaweza kumaanisha mpaka au eneo lililo ndani ya mipaka. Muktadha wa safari unaelekea kwenye maana ya eneo, si mstari wa mpaka peke yake.
- source_word: אֲחֵיכֶם בְּנֵי עֵשָׂו
  choice: ndugu zenu, wana wa Esau
  rationale: ‘Ndugu zenu’ kinadumisha lugha halisi ya undugu kati ya Israeli na Edomu, na ‘wana wa Esau’ kinahifadhi usemi wa nasaba.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: wanaoishi Seiri
  rationale: Umbo la יָשַׁב hapa linaonyesha makao ya kudumu; ‘wanaoishi’ ni Kiswahili cha sasa na cha kawaida.
- source_word: וְיִירְאוּ מִכֶּם
  choice: Nao watawaogopa
  rationale: יָרֵא pamoja na מִן hapa inaeleza hofu waliyo nayo kwa sababu ya Israeli; ‘watawaogopa’ ni wazi na ya moja kwa moja.
- source_word: וְנִשְׁמַרְתֶּם מְאֹד
  choice: kwa hiyo jihadharini sana
  rationale: Nifali ya שָׁמַר ina maana ya kujilinda au kuwa mwangalifu. ‘Jihadharini sana’ kinahifadhi nguvu ya msisitizo wa מְאֹד na uhusiano wa kimantiki na hofu ya Waedomu.
theological_decisions:
- issue: Lugha ya undugu kuhusu Edomu
  choice: ndugu zenu, wana wa Esau
  alternative: jamaa zenu, wazao wa Esau
  rationale: Aya inaweka mwenendo wa Israeli kwa Edomu katika uhusiano wa kifamilia. ‘Ndugu’ kinahifadhi wazi mvutano wa kihistoria na unasaba unaokusudiwa na maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi ‘wana wa Esau’ umehifadhiwa kwa sababu ni lugha ya nasaba yenye umuhimu katika aya. Alama [a] imewekwa baada ya kifungu kinachohusika.
