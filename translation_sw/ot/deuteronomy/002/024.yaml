reference: Deuteronomy 2:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: ק֣וּמוּ סְּע֗וּ וְ/עִבְרוּ֮ אֶת נַ֣חַל אַרְנֹן֒ רְאֵ֣ה נָתַ֣תִּי בְ֠/יָדְ/ךָ אֶת סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָֽ/אֱמֹרִ֛י וְ/אֶת אַרְצ֖/וֹ הָחֵ֣ל רָ֑שׁ וְ/הִתְגָּ֥ר בּ֖/וֹ מִלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/024.yaml
  text: Rise up[a], set out, and cross over the Arnon Valley. See, I have given into your hand Sihon king of Heshbon, the Amorite, and his land. Begin to take possession of it[c][b], and engage him in battle.
translation:
  language: sw
  text: Inukeni, ondokeni, na mvuke Bonde la Arnoni.[a] Tazama, nimemtia mkononi mwako Sihoni, mfalme wa Heshboni, Mwamori, pamoja na nchi yake. Anza kuimiliki,[b] na upambane naye vitani.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Bonde la Mto Arnoni,” “korongo la Arnoni,” au “kijito cha Arnoni.” Neno la Kiebrania נחל linaweza kumaanisha bonde, mkondo wa maji wa msimu, au kijito.
    reason: lexical_alternative
  - marker: b
    text: Au “Anza kuitwaa.” Kitenzi hiki kinaweza pia kuwa na maana ya “kuwanyang’anya wengine milki,” lakini hapa kinarejelea nchi ya Sihoni.
    reason: lexical_alternative
  - marker: c
    text: Au “na ushindane naye katika vita” au “na umchokoze kuingia vitani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּמוּ
  choice: Inukeni
  rationale: Amri ya wingi ya קום inaashiria kuinuka ili kuanza kutenda; “Inukeni” huhifadhi nguvu ya agizo kwa Kiswahili cha heshima na cha sasa.
- source_word: סְּע֗וּ
  choice: ondokeni
  rationale: Katika muktadha wa safari, נסע humaanisha kuondoka au kuanza safari. “Ondokeni” ni ya kawaida na inaendana na mlolongo wa maagizo.
- source_word: וְ/עִבְרוּ֮
  choice: mkavuke
  rationale: עבר pamoja na eneo la kijiografia humaanisha kuvuka. Muundo “mkavuke” unaunganisha kwa kawaida agizo hili na lile lililotangulia.
- source_word: נַ֣חַל אַרְנֹן
  choice: Bonde la Arnoni
  rationale: נחל inaweza kumaanisha bonde, kijito, au mkondo wa maji wa msimu. “Bonde la Arnoni” linaeleweka kwa urahisi bila kulazimisha kwamba maji yalitiririka daima.
- source_word: רְאֵ֣ה
  choice: Tazama
  rationale: Hii ni amri ya umoja inayovuta fikira kwenye tangazo la Mungu. “Tazama” huhifadhi uzito huo bila kuwa ya kizamani.
- source_word: נָתַ֣תִּי בְ֠/יָדְ/ךָ
  choice: nimemtia mkononi mwako
  rationale: Nahau ya Kiebrania inaonyesha kumweka mtu chini ya mamlaka au uwezo wa mwingine. “Mkononi mwako” huhifadhi taswira ya Kiebrania na inaeleweka katika Kiswahili.
- source_word: סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָֽ/אֱמֹרִ֛י
  choice: Sihoni, mfalme wa Heshboni, Mwamori
  rationale: Mpangilio huu huhifadhi utambulisho wa Sihoni kwa ufalme na kwa kabila, sambamba na muundo wa Kiebrania.
- source_word: וְ/אֶת אַרְצ֖/וֹ
  choice: pamoja na nchi yake
  rationale: אֶרֶץ hapa ni eneo lililotawaliwa na mfalme. “Nchi yake” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: הָחֵ֣ל
  choice: Anza
  rationale: Amri hii ina maana ya kuanza kutenda jambo. “Anza” ni fupi, wazi, na ya kawaida.
- source_word: רָ֑שׁ
  choice: kuimiliki
  rationale: ירש inaweza kumaanisha kumiliki, kurithi, au kuwanyang’anya wengine milki. Kwa kuwa kitu kilichotajwa mara moja ni nchi ya Sihoni, “kuimiliki” huonyesha uhusiano huo huku tanbihi ikihifadhi maana nyingine inayowezekana.
- source_word: וְ/הִתְגָּ֥ר בּ֖/וֹ מִלְחָמָֽה
  choice: na upambane naye vitani
  rationale: Usemi huu unaonyesha kuingia katika mapambano ya kivita dhidi yake. “Upambane naye vitani” ni wa asili katika Kiswahili na haupunguzi agizo kuwa uchokozi wa maneno tu.
theological_decisions:
- issue: Zawadi ya Mungu na tendo la mwanadamu katika kuitwaa nchi
  choice: Kauli ya Mungu imewasilishwa kama tendo lililokamilika—“nimemtia mkononi mwako”—na wakati huohuo Israeli anaagizwa aanze kuimiliki nchi na kupigana.
  alternative: Kutafsiri kauli ya Mungu kama ahadi ya wakati ujao (“nitamtia”) au kufanya ירש katika matini kuu imaanishe tu kuwanyang’anya wengine milki.
  rationale: Kiebrania kinaweka pamoja mamlaka ya Mungu katika kutoa ushindi na wajibu wa Israeli wa kutenda. Tafsiri inahifadhi mvutano huo bila kuupunguza upande wowote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mabadiliko ya maagizo ya wingi (“Inukeni, ondokeni, mkavuke”) kwenda umoja (“Tazama… mwako… Anza… upambane”) yamehifadhiwa kwa sababu yapo katika Kiebrania. Majina yametoholewa kwa mtindo wa kawaida wa kibiblia wa Kiswahili.
