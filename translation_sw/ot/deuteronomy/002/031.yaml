base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/031.yaml
  text: And Yahweh said to me[a], “See, I have begun to give Sihon and his land over to you[b]. Begin to take possession of his land.”
translation:
  language: sw
  text: Yahwe akaniambia, “Tazama, nimeanza kukukabidhi Sihoni na nchi yake.[a] Anza kuitwaa nchi yake iwe milki yako.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “mbele yako.” Katika muktadha huu, msemo huo una maana ya kumweka Sihoni na nchi yake chini ya uwezo wa Israeli.
    reason: lexical_alternative
  - marker: b
    text: Au, “Anza kuimiliki nchi yake.” Kiebrania kinarudia mzizi uleule wa kitenzi ili kutia mkazo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetafsiriwa kwa namna ya kawaida ya kulitamka kwa Kiswahili, badala ya kulibadilisha kuwa cheo kama ‘BWANA.’
- source_word: רְאֵה
  choice: Tazama
  rationale: Ni amri inayovuta usikivu wa msikilizaji; ‘Tazama’ ina nguvu ya moja kwa moja na hadhi inayofaa katika Kiswahili cha Biblia.
- source_word: הַחִלֹּתִי תֵּת
  choice: nimeanza kumtia
  rationale: Muundo huu unaonyesha tendo ambalo Mungu tayari amelianzisha. ‘Kumtia’ huhifadhi wazo la נתן katika muktadha wa kumweka adui chini ya mamlaka ya Israeli.
- source_word: לְפָנֶיךָ
  choice: mikononi mwako
  rationale: Ingawa maana ya neno kwa neno ni ‘mbele yako,’ hapa ni nahau ya kumweka mtu chini ya uwezo au mamlaka ya mwingine.
- source_word: הָחֵל רָשׁ לָרֶשֶׁת
  choice: Anza kuitwaa nchi yake iwe milki yako
  rationale: Tafsiri hii huhifadhi mwito wa kuanza kutenda na mkazo wa mzizi ירש unaorudiwa, huku ikitumia Kiswahili cha asili kinachoeleweka.
- source_word: אַרְצוֹ
  choice: nchi yake
  rationale: אֶרֶץ hapa ni eneo lililotawaliwa na Sihoni; ‘nchi yake’ ni tafsiri pana na ya kawaida katika muktadha huu.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi jina hilo kwa umbo linalotumika kwa kawaida katika Kiswahili bila kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya tendo la Mungu na tendo la Israeli
  choice: Mungu ameanza kumtia Sihoni mikononi mwa Israeli, kisha Israeli inaamriwa kuanza kuitwaa nchi
  alternative: Kueleza kana kwamba ushindi umekamilika kabisa bila hatua yoyote ya Israeli
  rationale: 'Kauli mbili zinazotumia wazo la ‘kuanza’ zimehifadhiwa ili kuonyesha mvutano wa maandishi: Mungu ndiye anayeanzisha utoaji, lakini Israeli bado inaagizwa kuchukua hatua.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mikononi mwako’ ni nahau ya kawaida inayoeleza kuwekwa chini ya mamlaka; ‘iwe milki yako’ hudumisha mkazo wa urudiaji wa Kiebrania bila kuifanya sentensi kuwa ngumu.
