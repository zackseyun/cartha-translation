base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/009.yaml
  text: And Yahweh said to me[a], “Do not harass Moab or provoke them to war, for I will not give you any of its land as a possession[b], because I have given Ar to the sons of Lot as a possession.”
translation:
  language: sw
  text: Yahweh akaniambia, “Usiisumbue Moabu wala usiwachokoze kwa vita[a], kwa maana sitakupa sehemu yoyote ya nchi yake kuwa milki[b], kwa sababu nimewapa wana wa Loti Ari kuwa milki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usiiudhi Moabu, wala usiingie vitani nao.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kuwa urithi,” katika matukio yote mawili ambapo “kuwa milki” limetumiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Imetafsiriwa kwa kunukuu jina la Mungu moja kwa moja badala ya kulibadilisha kuwa cheo; tahajia ‘Yahwe’ ni ya kawaida na ya asili katika Kiswahili.
- source_word: אֶל תָּצַר אֶת מוֹאָב
  choice: Usiisumbue Moabu
  rationale: Kitenzi צרר hapa kinaonyesha kuisonga au kuisumbua kwa uadui, kabla ya katazo linalohusu vita. Muundo huu unadumisha Moabu kama taifa au eneo linalotajwa katika Kiebrania.
- source_word: וְאַל תִּתְגָּר בָּם מִלְחָמָה
  choice: wala usiwachokoze wapigane nawe vita
  rationale: Kauli hii inaonyesha kuchochea uhasama wa kijeshi. Kiswahili hiki ni cha kawaida na kinadumisha wazo la kuwaanzishia au kuwavuta katika vita.
- source_word: מֵאַרְצוֹ
  choice: sehemu yoyote ya nchi yake
  rationale: 'Herufi מִן ina maana ya sehemu katika muktadha huu: hata sehemu moja ya nchi hiyo haitatolewa. Kiwakilishi cha umoja kinairejelea Moabu kama taifa.'
- source_word: יְרֻשָּׁה
  choice: kuwa milki
  rationale: Neno hili linaashiria ardhi iliyopokewa na kushikiliwa kama milki au urithi. ‘Milki’ ni fupi, wazi, na linafaa katika matukio yote mawili.
- source_word: לִבְנֵי לוֹט
  choice: wana wa Loti
  rationale: Hii inafuata kwa karibu usemi wa ukoo wa Kiebrania, ‘wana wa Loti,’ bila kuufafanua kimyakimya kuwa ‘wazao.’
- source_word: עָר
  choice: Ari
  rationale: Jina la mahali עָר limenukuliwa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Maana ya יְרֻשָּׁה
  choice: kuwa milki
  alternative: kuwa urithi
  rationale: Neno la Kiebrania linaweza kuonyesha milki iliyogawiwa kama urithi. Maandishi yametumia ‘milki,’ huku tanbihi ikihifadhi uwezekano wa ‘urithi.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo unabaki karibu na Kiebrania, lakini viwakilishi na mpangilio wa maneno vimerekebishwa ili sentensi isikike kwa kawaida katika Kiswahili.
