  text: Basi nikatuma wajumbe kutoka nyika ya Kedemothi kwa Sihoni, mfalme wa Heshboni, wenye maneno ya amani[a], nikisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “masharti ya amani.” Kiebrania husoma kihalisi, “maneno ya amani,” msemo wa pendekezo la kidiplomasia la amani.
