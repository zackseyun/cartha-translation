lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: Basi nikatuma
  rationale: Kitenzi cha nafsi ya kwanza pamoja na waw ya usimulizi kinaendeleza mfuatano wa matukio; “Basi nikatuma” ni Kiswahili cha kawaida kinachohifadhi uhusiano huo.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu wa mawasiliano ya kidiplomasia, neno hili linamaanisha watu waliotumwa, si malaika.
- source_word: מִמִּדְבַּר קְדֵמוֹת
  choice: kutoka nyika ya Kedemothi
  rationale: “Nyika” huwasilisha eneo kame lisilokaliwa sana bila kulazimisha maana ya jangwa la mchanga; jina la mahali limetoholewa kwa tahajia inayosomeka kwa Kiswahili.
- source_word: אֶל סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: kwenda kwa Sihoni, mfalme wa Heshboni
  rationale: “Kwenda kwa” humtambulisha mpokeaji wa ujumbe kwa ufasaha; cheo cha kifalme kimehifadhiwa kama ufafanuzi wa Sihoni.
- source_word: דִּבְרֵי שָׁלוֹם
  choice: wakiwa na maneno ya amani
  rationale: Huhifadhi kwa karibu msemo wa Kiebrania “maneno ya amani” na pia hudokeza kwamba wajumbe walileta ujumbe wa kidiplomasia wa amani.
- source_word: לֵאמֹר
  choice: nikisema,
  rationale: Ni fomula ya kuanzisha maneno yanayofuata; nafsi ya kwanza inalingana na msemaji wa sentensi na koma huonyesha kwamba hotuba inaendelea katika mstari unaofuata.
