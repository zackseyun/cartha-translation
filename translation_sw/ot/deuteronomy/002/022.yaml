base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/022.yaml
  text: just as he did for the sons of Esau who live in Seir[a], when he destroyed the Horites from before them[c][b], and they dispossessed them and settled in their place to this day.
translation:
  language: sw
  text: kama alivyowafanyia wazao wa Esau wanaoishi Seiri, alipowaangamiza Wahori mbele yao[a]; nao wakawanyang’anya nchi yao[b] na wakakaa mahali pao mpaka leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, aliwaondoa Wahori katika uwepo wao na eneo lao.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania kina maana ya kuwanyang’anya wakazi waliotangulia na kutwaa nchi yao; yaani, wazao wa Esau waliwaondoa Wahori na kuikalia nchi yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר עָשָׂה לִבְנֵי עֵשָׂו
  choice: kama alivyowafanyia wazao wa Esau
  rationale: Muundo huu unaendeleza ulinganisho wa muktadha uliotangulia. ‘Wazao wa Esau’ huonyesha kwa kawaida kwamba מדובר kuhusu jamii iliyotokana na Esau, si wanawe wa moja kwa moja tu.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: wanaoishi Seiri
  rationale: Ni Kiswahili cha sasa na cha kawaida kinachowasilisha hali ya makazi bila kutumia lugha ya kizamani.
- source_word: אֲשֶׁר הִשְׁמִיד אֶת־הַחֹרִי
  choice: alipowaangamiza Wahori
  rationale: Kitenzi cha Kiebrania ni cha kusababisha uharibifu mkubwa; ‘kuwaangamiza’ kinahifadhi uzito wake. ‘Alipowa-’ huwasilisha kwa ulaini hali ya wakati katika sentensi.
- source_word: מִפְּנֵיהֶם
  choice: mbele yao
  rationale: Huhifadhi taswira ya nahau ya Kiebrania, huku tanbihi ikieleza maana yake ya kuondolewa katika uwepo au eneo lao.
- source_word: וַיִּירָשֻׁם
  choice: nao wakawanyang’anya nchi yao
  rationale: Katika muktadha wa ushindi na umiliki, ירשׁ humaanisha kuwanyang’anya wakazi waliotangulia na kutwaa milki yao. Kutaja ‘nchi yao’ kunafanya maana hiyo iwe wazi kwa msomaji wa kawaida bila kuleta dhana potovu ya kuwamiliki watu.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: na kukaa mahali pao
  rationale: Hueleza kwamba wazao wa Esau walikaa katika eneo lililokuwa limekaliwa na Wahori.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Hii ndiyo nahau ya kawaida na ya asili ya Kiswahili kwa usemi huu wa wakati.
theological_decisions:
- issue: Mtendaji asiye tajwa wazi wa tendo la kuwaangamiza Wahori
  choice: Kiambishi cha nafsi ya tatu katika ‘alivyowafanyia’ na ‘alipowaangamiza’ kinamrejelea Mungu kutokana na muktadha wa karibu.
  alternative: Kuufanya usemi usiwe na mtendaji mahususi, au kumtaja ‘BWANA’ wazi katika mstari huu.
  rationale: Vitenzi vya Kiebrania vina mtendaji wa nafsi ya tatu umoja, na muktadha unamtambulisha kuwa Mungu. Kutotaja jina ‘BWANA’ ndani ya mstari huu kunahifadhi hali ya rejeo la Kiebrania bila kuongeza nomino isiyokuwamo hapa.
- issue: Maana ya וַיִּירָשֻׁם katika muktadha wa kutwaa eneo
  choice: Wazao wa Esau waliwanyang’anya Wahori nchi yao.
  alternative: ‘Wakawamiliki,’ tafsiri ya karibu zaidi na umbo la kirai lakini inayoweza kueleweka vibaya kana kwamba watu wenyewe walifanywa mali.
  rationale: Chaguo hili linaonyesha kutwaliwa kwa milki na kuondolewa kwa wakazi waliotangulia, huku likiepuka wazo lisilokusudiwa la kuwamiliki watu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inaendeleza kisarufi wazo la mstari uliotangulia, kama ilivyo katika Kiebrania. ‘Wazao’ ni wazi zaidi kwa jamii ya Esau, na ‘kukaa’ ni la kawaida kuliko neno la kizamani huku likihifadhi maana ya makazi.
