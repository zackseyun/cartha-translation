lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: Ikawa, ... walipo-
  rationale: Muundo huu unaanzisha hatua mpya ya simulizi na wakati wa tukio linalofuata. ‘Ikawa’ huhifadhi וַיְהִי, huku kiambishi ‘walipo-’ kikitoa maana ya כַאֲשֶׁר kwa Kiswahili cha kawaida.
- source_word: תַּמּוּ לָמוּת
  choice: walipokwisha kufa
  rationale: ‘Kwisha kufa’ huonyesha kwamba mchakato wa kufa ulikuwa umetimia, bila kuifanya sentensi kuwa nzito kama tafsiri ya neno kwa neno.
- source_word: כָּל
  choice: wote
  rationale: Kihesabu hiki kinahifadhiwa wazi.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: wanaume ... wa vita
  rationale: Huhifadhi maana halisi ya ‘wanaume wa vita,’ pamoja na jinsia na dhima yao ya kijeshi; ‘wapiganaji’ ni tafsiri mbadala ya kawaida.
- source_word: מִקֶּרֶב הָעָם
  choice: kutoka miongoni mwa watu
  rationale: Huhifadhi wazo la kuondolewa kutoka katikati ya kundi, yaani watu wa Israeli.
