base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/034.yaml
  text: At that time we captured all his cities[a], and we devoted to destruction every inhabited city, with the women and the little children. We left no survivor.
translation:
  language: sw
  text: Wakati huo tuliteka miji yake yote, tukaweka kila mji wakfu kwa kuangamizwa[a]—wanaume, wanawake, na watoto wadogo. Hatukuacha manusura yeyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tukaangamiza kabisa kila mji.” Kitenzi cha Kiebrania kina wazo la kuweka kitu chini ya ḥerem, yaani, kukitenga kwa ajili ya kuangamizwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: tuliiteka
  rationale: Kitenzi לכד katika muktadha wa vita humaanisha kuuteka mji; ‘tuliiteka’ ni Kiswahili cha kawaida na sahihi.
- source_word: כָּל עָרָיו
  choice: miji yake yote
  rationale: Neno עיר linaweza kumaanisha mji au kijiji kikubwa; hapa muktadha wa ushindi wa kijeshi unaunga mkono ‘miji,’ huku כָּל ikihifadhiwa kwa ‘yote.’
- source_word: בָּעֵת הַהִוא
  choice: Wakati huo
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida na yenye hadhi ya usemi wa wakati.
- source_word: וַנַּחֲרֵם
  choice: tukaiweka wakfu kwa kuangamizwa
  rationale: 'Huhifadhi maana maalumu ya חרם: kutenga au kuweka wakfu kitu ili kiangamizwe, badala ya kuifanya kuwa kisawe tambarare cha ‘kuangamiza kabisa.’'
- source_word: כָּל עִיר מְתִם
  choice: kila mji—wanaume
  rationale: Muundo wa Kiebrania ni mfupi na wa kimfuatano. מְתִם hapa huonyesha wanaume katika orodha inayofuatiwa na wanawake na watoto; kistari huonyesha uhusiano huo bila kuufuta umahususi wa kijinsia.
- source_word: הַנָּשִׁים
  choice: wanawake
  rationale: Tafsiri ya moja kwa moja ya nomino ya wingi ya kike.
- source_word: הַטָּף
  choice: watoto wadogo
  rationale: טף hurejelea watoto wadogo au wategemezi wachanga; ‘watoto wadogo’ huonyesha umri wao kwa uwazi.
- source_word: לֹא הִשְׁאַרְנוּ שָׂרִיד
  choice: Hatukumwacha hata mtu mmoja aliyenusurika
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kwamba hakuna manusura aliyeachwa, huku ikihifadhi msisitizo wa sentensi ya Kiebrania.
theological_decisions:
- issue: Tafsiri ya lugha ya חרם katika simulizi la ushindi
  choice: tukaiweka wakfu kwa kuangamizwa
  alternative: tukaiangamiza kabisa; tukaiweka chini ya marufuku
  rationale: Chaguo hili linahifadhi dhana ya kiibada na kihukumu ya חרם bila kulainisha tendo linalosimuliwa wala kuingiza ufafanuzi wa kiteolojia usiomo katika mstari.
- issue: Umahususi wa kijinsia wa מְתִם katika orodha ya walioangamizwa
  choice: wanaume, wanawake na watoto wadogo
  alternative: watu, pamoja na wanawake na watoto
  rationale: Kiebrania kinatofautisha wanaume, wanawake na watoto; tafsiri inadumisha tofauti hiyo badala ya kuibadilisha kuwa neno la jumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja lakini unasomeka kwa kawaida; kistari kinasaidia kuonyesha orodha iliyobanwa katika Kiebrania. Lugha kali ya mstari haijalainishwa.
