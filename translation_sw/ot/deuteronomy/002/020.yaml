base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/020.yaml
  text: That also is considered a land of the Rephaim[a]; Rephaim lived in it formerly[b], but the Ammonites call them Zamzummim.
translation:
  language: sw
  text: Hiyo pia huhesabiwa kuwa nchi ya Warefai[a]. Zamani Warefai[b] waliishi humo, lakini Waamoni huwaita Wazamzumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ile nchi ya Warefai.”
    reason: lexical_alternative
  - marker: b
    text: Neno “Warefai” huenda likarejelea watu wa kale waliohusishwa kimapokeo na kimo kikubwa; baadhi ya tafsiri hulitafsiri kuwa “majitu” hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ רְפָאִים
  choice: nchi ya Warefai
  rationale: אֶרֶץ ni ‘nchi’ au ‘ardhi,’ na רְפָאִים hapa ni jina la kundi la watu. Kiswahili hakina vibainishi vinavyolingana moja kwa moja na tofauti ya Kiingereza kati ya ‘a’ na ‘the,’ hivyo ‘nchi ya Warefai’ ni tafsiri ya kawaida na iliyo wazi.
- source_word: תֵּחָשֵׁב
  choice: huhesabiwa kuwa
  rationale: Kauli ya kutendwa ya חשׁב ina maana ya kuonwa au kuhesabiwa kuwa kitu fulani. ‘Huhesabiwa kuwa’ huhifadhi kauli hiyo na inafaa kwa maelezo ya jumla.
- source_word: אַף הִוא
  choice: Hiyo pia
  rationale: Kirai hiki huunganisha nchi hiyo na maeneo yaliyotajwa katika muktadha uliotangulia. ‘Hiyo pia’ ni ya kawaida na hudumisha msisitizo wa nyongeza.
- source_word: רְפָאִים
  choice: Warefai
  rationale: Hili limetolewa kama jina la watu badala ya kutafsiriwa ‘majitu,’ kwa sababu katika mstari huu linafanya kazi kama jina la kikabila linalolinganishwa na jina walilotumia Waamoni.
- source_word: יָשְׁבוּ בָהּ
  choice: waliishi humo
  rationale: ישׁב hapa humaanisha kuishi au kukaa katika nchi hiyo. ‘Waliishi humo’ ni Kiswahili cha sasa, wazi na cha kawaida.
- source_word: לְפָנִים
  choice: Zamani
  rationale: Neno hili linaonyesha wakati uliopita. ‘Zamani’ ni fupi, ya kawaida, na hudokeza kuwa hali hiyo ilitangulia matukio yanayosimuliwa.
- source_word: וְהָעַמֹּנִים
  choice: lakini Waamoni
  rationale: Ingawa ו kwa kawaida ni ‘na,’ hapa ‘lakini’ huonyesha kwa kawaida tofauti kati ya jina la msimulizi, Warefai, na jina walilotumia Waamoni.
- source_word: יִקְרְאוּ לָהֶם
  choice: huwaita
  rationale: Kauli isiyotimilika hapa inaeleza desturi ya kuwapa jina. ‘Huwaita’ hudumisha maana hiyo ya kawaida badala ya kuifanya tukio moja tu la wakati uliopita.
- source_word: זַמְזֻמִּים
  choice: Wazamzumi
  rationale: Hili ni jina la kundi la watu; limetoholewa kwa muundo wa kawaida wa majina ya watu katika Kiswahili badala ya kutafsiriwa maana yake kwa kukisia.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Majina ya makundi ya watu yametoholewa kwa viambishi vya Kiswahili: Warefai, Waamoni na Wazamzumi. Tafsiri imehifadhi jina Warefai bila kulifasiri moja kwa moja kuwa ‘majitu,’ ili kutatua kwa lazima utata wa kihistoria na wa kileksika.'
