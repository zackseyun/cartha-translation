base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/007.yaml
  text: For Yahweh your God has blessed you in all the work of your hands[a]. He has known your walking through this great wilderness. These forty years Yahweh your God has been with you; you have lacked nothing.
translation:
  language: sw
  text: Kwa maana Yahwe Mungu wako amekubariki katika kazi yote ya mikono yako. Ameijua safari yako kupitia jangwa hili kubwa.[a] Kwa miaka hii arobaini Yahwe Mungu wako amekuwa pamoja nawe; hujakosa kitu chochote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ameisimamia safari yako kupitia jangwa hili kubwa.” Kitenzi cha Kiebrania kwa maana halisi ni “amejua,” lakini katika muktadha huu kinaweza kudokeza uangalizi na utunzaji wa makini.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatumiwa jina la Mungu lililo katika maandishi ya Kiebrania, badala ya kulibadilisha kwa cheo kama “BWANA”.
- source_word: בֵּרַכְךָ
  choice: amekubariki
  rationale: Kauli timilifu ya Kiswahili inaonyesha tendo lililotendeka ambalo matokeo yake yanaendelea kuwa muhimu katika ukumbusho huu wa Musa.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: katika kazi yote ya mikono yako
  rationale: Hii ni njia ya kawaida na inayoeleweka ya kueleza kazi au shughuli zote za mtu, huku ikidumisha taswira halisi ya mkono katika nahau ya Kiebrania.
- source_word: יָדַע
  choice: ameijua
  rationale: Inadumisha maana ya msingi ya kitenzi, “kujua,” bila kuamua kimya kimya kwamba hapa kinamaanisha tu kulinda au kutunza.
- source_word: לֶכְתְּךָ
  choice: safari yako
  rationale: Nomino “safari” inaeleza kwa Kiswahili cha kawaida mwendo wa Israeli jangwani bila ugumu wa usemi halisi “kutembea kwako.”
- source_word: אֶת הַמִּדְבָּר הַגָּדֹל הַזֶּה
  choice: kupitia jangwa hili kubwa
  rationale: “Kupitia” huonyesha kwa kawaida kwamba safari hiyo ilifanyika ndani na kuvuka eneo la jangwa.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: kwa miaka hii arobaini
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha muda wote uliotajwa.
- source_word: עִמָּךְ
  choice: amekuwa pamoja nawe
  rationale: Kitenzi kilichoongezwa kinahitajika katika Kiswahili na kinaonyesha kuwapo kwa Mungu kulikoendelea katika kipindi hicho.
- source_word: לֹא חָסַרְתָּ דָּבָר
  choice: hujakosa kitu chochote
  rationale: Usemi huu wa kawaida unaonyesha ukamilifu wa mahitaji yaliyotimizwa na unaendana na mtazamo wa wakati uliopita wenye matokeo hadi sasa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano la Mungu; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya יָדַע katika muktadha wa safari ya jangwani
  choice: ameijua safari yako
  alternative: ameiangalia safari yako; ameitunza safari yako
  rationale: Maana ya msingi “kujua” inadumishwa katika matini, huku uwezekano wa uangalizi na utunzaji wa makini ukielezwa katika tanbihi bila kuondoa utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa kawaida kwa wasomaji wengi, huku “ameijua safari yako” ukihifadhi mvutano wa kileksia wa Kiebrania na tanbihi ikifafanua maana inayowezekana katika muktadha.
