id: DEU.2.19
reference: Deuteronomy 2:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/קָרַבְתָּ֗ מ֚וּל בְּנֵ֣י עַמּ֔וֹן אַל תְּצֻרֵ֖/ם וְ/אַל תִּתְגָּ֣ר בָּ֑/ם כִּ֣י לֹֽא אֶ֠תֵּן מֵ/אֶ֨רֶץ בְּנֵי עַמּ֤וֹן לְ/ךָ֙ יְרֻשָּׁ֔ה כִּ֥י לִ/בְנֵי ל֖וֹט נְתַתִּ֥י/הָ יְרֻשָּֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/019.yaml
  text: When you come opposite the sons of Ammon[a], do not harass them or provoke them, for I will not give you any of the land of the sons of Ammon as a possession[c][b], because I have given it as a possession to the sons of Lot.
translation:
  language: sw
  text: Utakapofika mkabala na Waamoni[a], usiwashambulie[b] wala kuwachokoza, kwa maana sitakupa sehemu yoyote ya nchi ya Waamoni kuwa milki[c], kwa sababu nimewapa wazao wa Loti nchi hiyo kuwa milki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “wana wa Amoni”; vivyo hivyo katika sehemu nyingine ya mstari huu.
    reason: lexical_alternative
  - marker: b
    text: Au, “usiwasumbue.” Neno la Kiebrania linaweza kukataza hatua za uhasama kwa ujumla, si kuzingira mji tu.
    reason: lexical_alternative
  - marker: c
    text: Au, “kuwa urithi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרַבְתָּ מוּל
  choice: Utakapofika karibu na
  rationale: Muunganiko huu unaeleza kumkaribia au kufika mbele ya taifa hilo. Kiswahili hiki ni cha kawaida na hakidokezi kwamba tayari wameingia katika nchi yao.
- source_word: בְּנֵי עַמּוֹן
  choice: Waamoni
  rationale: Katika Kiswahili, jina la taifa 'Waamoni' ni la asili na wazi zaidi kuliko tafsiri ya neno kwa neno 'wana wa Amoni'; tanbihi huhifadhi muundo wa Kiebrania.
- source_word: אַל תְּצֻרֵם
  choice: usiwashambulie
  rationale: Katika muktadha huu mzizi צור unaashiria hatua ya uhasama dhidi yao. 'Kuwashambulia' ni pana kuliko 'kuwazingira' na inaeleweka kwa urahisi, huku tanbihi ikitaja uwezekano wa maana pana zaidi.
- source_word: וְאַל תִּתְגָּר בָּם
  choice: wala kuwachokoza
  rationale: Kitenzi cha Kiebrania kinaweza kueleza kuanzisha ugomvi au uhasama. 'Kuwachokoza' huhifadhi wazo hilo bila kuongeza wazi maneno 'kwa vita,' ambayo hayapo katika matini.
- source_word: מֵאֶרֶץ בְּנֵי עַמּוֹן
  choice: sehemu yoyote ya nchi ya Waamoni
  rationale: 'Hutoa kwa Kiswahili nguvu ya mgawanyo ya מִן chini ya ukanushi: hakuna sehemu hata moja ya nchi itakayotolewa.'
- source_word: יְרֻשָּׁה
  choice: kuwa milki
  rationale: Neno linaweza kumaanisha urithi au milki. 'Milki' linafaa kwa ardhi iliyotolewa ili imilikiwe na halilazimishi maana ya urithi wa kifamilia.
- source_word: לִבְנֵי לוֹט
  choice: wazao wa Loti
  rationale: Katika muktadha wa taifa na umiliki wa nchi, 'wazao wa Loti' huwasilisha wazi kwamba kinachokusudiwa ni ukoo wake, si wanawe wa moja kwa moja pekee.
- source_word: נְתַתִּיהָ
  choice: nimewapa ... nchi hiyo
  rationale: Kauli timilifu inaonyesha utoaji uliokamilika wenye matokeo yanayoendelea. Kiwakilishi cha Kiebrania kimefafanuliwa kama 'nchi hiyo' kwa Kiswahili wazi.
theological_decisions:
- issue: Muundo wa kindugu katika majina בְּנֵי עַמּוֹן na לִבְנֵי לוֹט
  choice: Waamoni katika matini, na wazao wa Loti
  alternative: wana wa Amoni / wana wa Loti
  rationale: 'Hii ni lugha ya kawaida ya Kiswahili kwa taifa na ukoo, huku tanbihi ikihifadhi muundo halisi wa ''wana wa Amoni.'' Hakuna haki ya eneo inayopunguzwa: nchi imekwisha kutolewa na Mungu kwa ukoo wa Loti.'
- issue: Maana ya יְרֻשָּׁה
  choice: milki
  alternative: urithi
  rationale: Matini inasisitiza ardhi kuwa fungu linalomilikiwa kwa utoaji wa Mungu. Tanbihi huhifadhi maana nyingine halali ya 'urithi' bila kutatua kimya kimya upana wa neno.
- issue: Upeo wa katazo אַל תְּצֻרֵם
  choice: usiwashambulie
  alternative: usiwasumbue / usiwazingire
  rationale: Muktadha ni wa hatua za uhasama, lakini neno linaweza kuwa pana kuliko kuzingira mji rasmi. Tanbihi inaweka wazi upeo huo wa kileksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Waamoni' na 'wazao wa Loti' ni miundo ya kawaida kwa wasomaji wa kisasa; 'milki' hudumisha muktadha wa umiliki wa ardhi. Alama zote za tanbihi zimewekwa mara moja katika matini kuu.
