base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/021.yaml
  text: a people great[a], numerous, and tall like the Anakim. Yahweh destroyed them from before them, and they dispossessed them and lived in their place.
translation:
  language: sw
  text: Walikuwa taifa kubwa, lenye watu wengi, na warefu kama Waanaki[a]. Yahweh aliwaangamiza kutoka mbele yao; nao wakawapokonya nchi yao, wakakaa mahali pao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “kama wana wa Anaki.”'
    reason: Jina עֲנָקִים linaweza kutolewa kama jina la watu, “Waanaki,” au kama kauli inayowatambulisha kuwa wana wa Anaki.
lexical_decisions:
- source_word: עַם גָּדוֹל
  choice: taifa kubwa
  rationale: Neno עַם ni nomino ya umoja yenye maana ya jamii nzima ya watu; “taifa kubwa” linahifadhi wazo la kundi kubwa la watu bila kuligeuza kuwa wingi.
- source_word: רַב
  choice: lenye watu wengi
  rationale: Kauli hii inaonyesha idadi kubwa ya watu na kuitofautisha na גָּדוֹל, iliyotafsiriwa “kubwa.”
- source_word: רָם
  choice: watu wake walikuwa warefu
  rationale: Katika ulinganisho na Waanaki, neno hili linahusu kimo cha mwili. Kuongeza “watu wake” kunafanya Kiswahili kiwe wazi bila kubadili rejeleo la taifa.
- source_word: כָּעֲנָקִים
  choice: kama Waanaki
  rationale: Kiambishi כְּ־ kinaonyesha ulinganisho, na jina la watu עֲנָקִים limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: וַיַּשְׁמִידֵם
  choice: aliwaangamiza
  rationale: Hifili ya שׁמד ina maana yenye nguvu ya kuharibu au kuwaondoa kabisa katika eneo, lakini “aliwaangamiza” haiongezi maelezo yasiyosemwa moja kwa moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: מִפְּנֵיהֶם
  choice: mbele yao
  rationale: Hii inahifadhi kwa njia ya kawaida ya Kiswahili taswira ya Kiebrania ya kuwaondoa kutoka mbele ya watu wa Esau.
- source_word: וַיִּירָשֻׁם
  choice: wakawafukuza kutoka katika milki yao
  rationale: Katika muktadha huu ירשׁ inaunganisha kuwaondoa wakaaji wa awali na kutwaa milki yao. Tafsiri hii inaepuka maana isiyofaa ya kuwamiliki watu wenyewe.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: na kukaa mahali pao
  rationale: Kauli hii inaonyesha kwamba watu wapya walichukua nafasi ya wakaaji waliotangulia.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa kimadhehebu.
- issue: Wahusika wa viwakilishi vya wingi katika sehemu ya pili
  choice: Kudumisha viwakilishi bila kutaja kwa jina watu wa Esau
  alternative: Kutaja wazi kwamba wazao wa Esau ndio waliowafukuza Waemi
  rationale: Muktadha unaonyesha wahusika, lakini Kiebrania cha mstari huu kinatumia viwakilishi. Tafsiri inadumisha muundo huo na kuepuka kuondoa kabisa utegemezi wa muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kusomeka. Kitenzi “walikuwa” kimeongezwa kwa ulaini wa Kiswahili kwa sababu Kiebrania kina kirai cha nomino bila kitenzi kilichoandikwa wazi. Alama ya tanbihi imewekwa baada ya “Waanaki,” ambako tofauti ya kileksika inahusika.
