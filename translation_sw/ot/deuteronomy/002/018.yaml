lexical_decisions:
- source_word: אַתָּה
  choice: una-
  rationale: Kiambishi cha nafsi ya pili umoja katika “unavuka” kinahifadhi anwani ya umoja kwa Israeli kama jumuiya bila kuongeza ufafanuzi.
- source_word: עֹבֵר
  choice: unavuka
  rationale: Kauli ya Qal katika umbo la participle, pamoja na kiwakilishi huru, inaonyesha tendo la karibu au linaloendelea; wakati wa sasa wa Kiswahili unafaa hapa.
- source_word: הַיּוֹם
  choice: Leo
  rationale: Ni tafsiri ya kawaida na ya asili ya kielezi hiki cha wakati.
- source_word: גְּבוּל
  choice: mpaka
  rationale: Katika muktadha wa eneo la Moabu, neno hili linaashiria mpaka wa nchi; “mpaka” ni wazi na la kawaida katika Kiswahili.
- source_word: מוֹאָב
  choice: Moabu
  rationale: Umbo la jina la mahali linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: עָר
  choice: Ari
  rationale: Jina maalumu la mahali limetoholewa kwa namna inayosomeka kiasili katika Kiswahili.
- source_word: אֶת ... אֶת
  choice: mpaka wa Moabu kwenye Ari
  rationale: Kurudiwa kwa kiashiria cha yambwa kabla ya “Ari” kunaweza kuonyesha uhusiano wa ufafanuzi. “Kwenye Ari” huwasilisha uhusiano wa kijiografia kwa Kiswahili cha kawaida bila kufuta uwezekano wa apposition, ambao umeelezwa katika tanbihi.
theological_decisions:
- issue: Anwani ya umoja kwa Israeli
  choice: Kutumia nafsi ya pili umoja katika “unavuka” bila kuongeza “Israeli”
  alternative: “Ninyi mnavuka leo…” au “Wewe, Israeli, unavuka leo…”
  rationale: Kiebrania kinamwambia Israeli kama jumuiya kwa umoja. Kiswahili kinaweza kuhifadhi umoja huo moja kwa moja kupitia kiambishi “u-” bila kuongeza maelezo ya kiufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, rahisi na chenye heshima. “Kwenye Ari” ni usemi wa kawaida wa mahali; tanbihi inahifadhi utata halisi wa sintaksia ya Kiebrania.
