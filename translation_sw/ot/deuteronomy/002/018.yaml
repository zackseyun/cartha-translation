  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka wa Moabu, yaani, Ari.” Kiebrania hurudia alama ya yambwa kabla ya “Ari”; huenda “Ari” ni ufafanuzi wa “mpaka wa Moabu,” yaani eneo au mji unaoitambulisha.
