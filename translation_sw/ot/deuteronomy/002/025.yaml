translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Sentensi imegawanywa mara mbili ili kuepuka mfuatano mzito wa vishazi na kuweka wazi kuwa mataifa ndiyo yatakayosikia, kutetemeka, na kujikunja.
