base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/025.yaml
  text: Today I will begin to put the dread and fear of you on the face of the peoples under all the heavens[b][a], who will hear the report about you and will tremble and writhe because of you.
translation:
  language: sw
  text: Leo hii nitaanza kuyatia mataifa yote yaliyo chini ya mbingu hofu na woga kwa sababu yako. Mataifa hayo yatasikia habari zako[a], yatatetemeka na kujikunja kwa uchungu[b] kwa sababu yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umaarufu wako” au “taarifa kukuhusu.” Usemi wa Kiebrania unaweza kumaanisha habari inayomfanya mtu ajulikane.
    reason: lexical_alternative
  - marker: b
    text: Au “watakuwa katika uchungu” au “watajikunja kama mwanamke mwenye uchungu wa kuzaa.” Kitenzi cha Kiebrania kinaonyesha mateso makali ya mwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחֵל תֵּת
  choice: nitaanza kuyatia
  rationale: Muundo huu unaonyesha mwanzo wa tendo la kutia au kuweka jambo juu ya wengine; Kiswahili hiki ni cha kawaida na hudumisha hali ya wakati ujao.
- source_word: פַּחְדְּךָ וְיִרְאָתְךָ
  choice: hofu na woga kwa sababu yako
  rationale: Maneno hayo mawili yanaonyesha hofu kali inayosababishwa na Israeli. Kauli hii inahifadhi jozi hiyo na kuepuka maana isiyokusudiwa kwamba ni hofu aliyo nayo Israeli mwenyewe.
- source_word: עַל פְּנֵי הָעַמִּים
  choice: kuyatia mataifa
  rationale: Nahau ya Kiebrania ina maana ya kuweka hali hiyo juu ya mataifa. Muundo wa Kiswahili wenye kiambishi cha yambwa ni wa asili zaidi kuliko tafsiri sisisi ya ‘juu ya nyuso za mataifa.’
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: yaliyo chini ya mbingu zote
  rationale: Huhifadhi wingi wa neno la Kiebrania na nahau yenye upeo mpana bila kuibadili kuwa usemi wa kijiografia uliofafanuliwa zaidi.
- source_word: אֲשֶׁר יִשְׁמְעוּן שִׁמְעֲךָ
  choice: Yatasikia habari zako
  rationale: Neno שֵׁמַע linaweza kumaanisha habari, taarifa, au sifa inayotokana na habari zinazosikika. ‘Habari zako’ ni pana na ya kawaida katika Kiswahili.
- source_word: וְרָגְזוּ
  choice: yatatemeka
  rationale: Kitenzi kinaonyesha kutetemeka au kutikisika kwa hofu; ‘kutetemeka’ ni wazi na cha kawaida.
- source_word: וְחָלוּ
  choice: na kujikunja kwa uchungu
  rationale: Kitenzi kinaonyesha maumivu makali yanayomfanya mtu ajikunje, mara nyingi kwa taswira ya uchungu wa kuzaa. Tafsiri hii huhifadhi athari ya kimwili bila kulazimisha rejeo la kuzaa katika matini kuu.
- source_word: מִפָּנֶיךָ
  choice: kwa sababu yako
  rationale: Ingawa kihalisi ni ‘kutoka mbele ya uso wako/uwepo wako,’ katika muktadha huu inaonyesha chanzo cha hofu na uchungu wao.
