  text: 'Kisha Yahwe akaniambia:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha ... akaniambia
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi, hivyo “Kisha” ni ya kawaida katika Kiswahili. Ingawa דִּבֵּר ni “alisema/alizungumza,” muundo mzima וַיְדַבֵּר ... אֵלַי לֵאמֹר hutanguliza maneno ya moja kwa moja na kwa kawaida huwasilishwa kwa Kiswahili kama “akaniambia,” bila kurudia kwa uzito “akanena nami, akisema.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo “BWANA.”
- source_word: אֵלַי
  choice: -ni- katika “akaniambia”
  rationale: Kiwakilishi cha yambwa “-ni-” kinawasilisha kwa kawaida mwelekeo wa usemi ‘kwangu/mimi’ uliomo katika אֵלַי.
- source_word: לֵאמֹר
  choice: limewasilishwa katika “akaniambia”
  rationale: לֵאמֹר ni fomula ya kutanguliza usemi wa moja kwa moja. Katika Kiswahili cha sasa, maana yake inawasilishwa kwa ufasaha na “akaniambia,” huku maneno yenyewe yakifuata katika aya inayofuata; tafsiri ya kimuundo “akisema” ingewezekana lakini si ya kawaida sana hapa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku tahajia hiyo ikifuata matumizi ya kawaida ya Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi “Kisha Yahwe akaniambia” ni wa kawaida katika simulizi na huepuka tafsiri nzito isiyo ya lazima ya fomula ya Kiebrania.
