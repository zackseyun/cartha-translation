  text: אֹ֣כֶל בַּ/כֶּ֤סֶף תַּשְׁבִּרֵ֨/נִי֙ וְ/אָכַ֔לְתִּי וּ/מַ֛יִם בַּ/כֶּ֥סֶף תִּתֶּן לִ֖/י וְ/שָׁתִ֑יתִי רַ֖ק אֶעְבְּרָ֥ה בְ/רַגְלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/028.yaml
  text: You may sell me food for silver[a], so that I may eat, and give me water for silver, so that I may drink[b]; only let me pass through on my feet—
translation:
  language: sw
  text: Uniuzie chakula kwa fedha[a], ili nile, na unipe maji kwa fedha, ili ninywe; ila uniruhusu nipite kwa miguu yangu[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa pesa.” Kiebrania kinasema kihalisi “kwa fedha.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa miguu.” Kiebrania kinasema kihalisi “kwa miguu yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹכֶל
  choice: chakula
  rationale: Ni neno la jumla linalomaanisha chakula, si lazima mkate, nafaka, au mahitaji ya safari pekee.
- source_word: בַּכֶּסֶף
  choice: kwa fedha
  rationale: Huhifadhi neno halisi la Kiebrania linalotaja fedha huku likionyesha kuwa chakula na maji vitalipiwa.
- source_word: תַּשְׁבִּרֵנִי
  choice: uniuzie
  rationale: Katika muktadha huu, kausativi ya שׁבר ina maana ya kumuuzia mtu chakula; ‘uniuzie’ ni ombi la kawaida na la moja kwa moja katika Kiswahili.
- source_word: וְאָכַלְתִּי
  choice: ili nile
  rationale: Muundo huu unaonyesha kusudi au matokeo yaliyokusudiwa ya ombi, si taarifa ya wakati ujao tu.
- source_word: וּמַיִם
  choice: maji
  rationale: Ni kisawe cha moja kwa moja na cha kawaida.
- source_word: תִּתֶּן לִי
  choice: unipe
  rationale: Hutoa kwa ufupi na kwa kawaida maana ya ‘nipe’ katika ombi hili.
- source_word: וְשָׁתִיתִי
  choice: ili ninywe
  rationale: Kama ‘ili nile,’ maneno haya yanaeleza kusudi au matokeo yaliyokusudiwa.
- source_word: רַק
  choice: ila
  rationale: 'Huweka kikomo cha ombi: wanachoomba hasa ni ruhusa ya kupita tu.'
- source_word: אֶעְבְּרָה
  choice: uniruhusu nipite
  rationale: Huwasilisha vizuri nguvu ya ombi au ruhusa iliyo katika kohortativi ya Kiebrania.
- source_word: בְרַגְלָי
  choice: kwa miguu yangu
  rationale: Huhifadhi taswira halisi ya Kiebrania ‘kwa/juu ya miguu yangu’; Kiswahili cha kawaida kingeweza pia kusema ‘kwa miguu.’
theological_decisions: []
