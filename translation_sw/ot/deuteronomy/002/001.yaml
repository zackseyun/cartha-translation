source:
  edition: WLC
  text: וַ/נֵּ֜פֶן וַ/נִּסַּ֤ע הַ/מִּדְבָּ֨רָ/ה֙ דֶּ֣רֶךְ יַם ס֔וּף כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה אֵלָ֑/י וַ/נָּ֥סָב אֶת הַר שֵׂעִ֖יר יָמִ֥ים רַבִּֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/001.yaml
  text: Then we turned and set out for the wilderness by the way of the Red Sea[a], just as Yahweh had spoken to me, and we went around Mount Seir for many days.
translation:
  language: sw
  text: Kisha tukageuka, tukaondoka kuelekea jangwani kwa njia ya Bahari ya Shamu[a], kama Yahwe alivyosema nami, nasi tukazunguka Mlima Seiri kwa siku nyingi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bahari ya Matete.” Jina la Kiebrania Yam Suf linaweza kutafsiriwa kihalisi zaidi kwa namna hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: Kisha tukageuka
  rationale: Kitenzi פנה hapa kinaonyesha kubadili mwelekeo. “Kisha” kinaendeleza mfuatano wa simulizi bila kuongeza wazo la kurudi ambalo halijasemwa wazi.
- source_word: וַנִּסַּע הַמִּדְבָּרָה
  choice: tukaondoka kuelekea jangwani
  rationale: נסע katika muktadha wa safari humaanisha kuondoka au kung’oa kambi, nayo he ya uelekeo katika הַמִּדְבָּרָה inaonyesha mwendo kuelekea jangwani.
- source_word: דֶּרֶךְ יַם סוּף
  choice: kwa njia ya Bahari ya Shamu
  rationale: דֶּרֶךְ ni njia au barabara na hapa inaonyesha njia ya safari. “Bahari ya Shamu” ni jina la kijiografia lililozoeleka katika Kiswahili; tafsiri ya karibu zaidi ya muundo wa Kiebrania imehifadhiwa katika tanbihi.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֵלָי
  choice: kama vile Yahwe alivyoniambia
  rationale: כַּאֲשֶׁר huonyesha ulinganisho, “kama vile.” Katika Kiswahili, “alivyoniambia” ni njia ya kawaida na sahihi ya kuwasilisha kwamba Yahwe alikuwa amesema jambo hilo kwa msemaji.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa moja kwa moja badala ya kubadilishwa kuwa cheo. “Yahwe” ni umbo linalosomeka kwa kawaida katika tahajia ya Kiswahili.
- source_word: וַנָּסָב אֶת הַר שֵׂעִיר
  choice: nasi tukazunguka Mlima Seiri
  rationale: סבב hapa ina maana ya kwenda kuzunguka. Muktadha wa vitenzi vya nafsi ya kwanza wingi unaunga mkono “tukazunguka,” na הַר שֵׂעִיר imetafsiriwa kama jina la mahali “Mlima Seiri.”
- source_word: יָמִים רַבִּים
  choice: kwa siku nyingi
  rationale: Kirai hiki kinaonyesha muda wa tendo. “Kwa siku nyingi” kinadumisha usemi halisi bila kuubadili kuwa tafsiri pana zaidi kama “kwa muda mrefu.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu, si cheo. Kutumia “Yahwe” kunahifadhi jina hilo huku tahajia ikilingana na matumizi ya kawaida ya Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. Miundo ya vitenzi mfululizo—“tukageuka, tukaondoka… tukazunguka”—inahifadhi mwendo wa simulizi la Kiebrania kwa njia ya asili katika Kiswahili.
