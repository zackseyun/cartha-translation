  - severity: low
    issue: '''Eneo la vilima'' ni pana kidogo na halihifadhi vizuri kirai maalumu ''miji ya nchi ya vilima.'''
    rationale: הָהָר humaanisha nchi ya vilima/nyanda za juu hapa; 'nchi ya vilima' ni ya kawaida na inaendana moja kwa moja na 'miji ya.'
