  text: רַ֛ק אֶל אֶ֥רֶץ בְּנֵי עַמּ֖וֹן לֹ֣א קָרָ֑בְתָּ כָּל יַ֞ד נַ֤חַל יַבֹּק֙ וְ/עָרֵ֣י הָ/הָ֔ר וְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/037.yaml
  text: Only you did not come near the land of the sons of Ammon[a], all along the bank of the Jabbok, and the cities of the hill country[c][b], and all that Yahweh our God had commanded.
translation:
  language: sw
  text: Isipokuwa nchi ya Waamoni[a] hukukaribia, wala sehemu yoyote kando ya Yaboki,[b] wala miji ya nchi ya vilima, wala yote ambayo Yahwe Mungu wetu alikuwa ameagiza.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “nchi ya wana wa Amoni.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “upande wote wa kijito (au bonde) la Yaboki.” Hii ni nahau inayorejelea upande, ukingo, au eneo lililo kando ya mkondo wa maji.
    reason: cultural_note
  - marker: c
    text: Kiebrania kinasema kwa ufupi, “na yote ambayo Yahwe Mungu wetu alikuwa ameagiza,” bila kutaja wazi kitu kilichoagizwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Ila
  rationale: Hutambulisha jambo linalotengwa na muhtasari uliotangulia; “Ila” ni ya kawaida na inaonyesha ukomo huo kwa uwazi.
- source_word: אֶל אֶרֶץ בְּנֵי עַמּוֹן
  choice: nchi ya Waamoni
  rationale: Hili ni neno la kawaida la Kiswahili kwa watu wa Amoni, huku tanbihi ikihifadhi muundo halisi wa Kiebrania, “wana wa Amoni.”
- source_word: לֹא קָרָבְתָּ
  choice: hukukaribia
  rationale: Kitenzi קרב hapa kina maana ya kusogea au kukaribia. Tafsiri hii inadumisha maana ya mahali bila kuifasiri moja kwa moja kuwa shambulio la kijeshi.
- source_word: כָּל יַד נַחַל יַבֹּק
  choice: sehemu yoyote kando ya Mto Yaboki
  rationale: Kirai cha Kiebrania “mkono wa” mkondo wa maji ni nahau inayomaanisha upande, ukingo, au eneo lililo kandokando yake. “Sehemu yoyote kando ya” pia huwasilisha nguvu ya כָּל katika muktadha wa sentensi hasi.
- source_word: וְעָרֵי הָהָר
  choice: wala miji ya eneo la vilima
  rationale: הָהָר hapa inaelekea kutaja nyanda za vilima au eneo la milimani, si mlima mmoja. “Miji” huhifadhi maana ya עָרֵי.
- source_word: וְכֹל אֲשֶׁר צִוָּה
  choice: wala mahali pengine popote ambapo ... alikuwa ametuamuru tusikaribie
  rationale: Kiebrania kina usemi uliodondosha yaliyokuwa yameamuriwa. Muktadha unaonyesha kuwa amri ilihusu maeneo ambayo Israeli haikupaswa kuyakaribia; tafsiri ya mwili inaweka maana hiyo wazi, huku tanbihi ikionyesha udondoshaji wa maneno katika Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya umbo la umilikaji.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina la agano יהוה; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha na cheo.
- issue: Kukamilisha maana ya וְכֹל אֲשֶׁר צִוָּה
  choice: mahali pengine popote ambapo ... alikuwa ametuamuru tusikaribie
  alternative: chochote ambacho Yahwe Mungu wetu alikuwa ameamuru
  rationale: Kiebrania kinaacha kitu cha amri bila kutajwa wazi. Muktadha wa kutokaribia eneo la Waamoni unaunga mkono kukamilisha maana kwa “mahali ... tusikaribie,” lakini tanbihi inahifadhi uwezekano wa tafsiri pana na iliyo halisi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Eneo la vilima” linaepuka picha ya mlima mmoja, na “hukukaribia” hudumisha anwani ya nafsi ya pili umoja inayowakilisha Israeli kwa pamoja.
