  to: Isipokuwa nchi ya Waamoni[a] hukukaribia, wala sehemu yoyote kando ya Yaboki,[b] wala miji ya nchi ya vilima, wala yote ambayo Yahwe Mungu wetu alikuwa ameagiza.[c]
