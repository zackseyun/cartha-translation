  yaml_path: translation/ot/deuteronomy/033/005.yaml
  text: And he was king in Jeshurun[a], when the heads of the people gathered together[c][b], the tribes of Israel as one.
translation:
  language: sw
  text: Naye alikuwa mfalme katika Yeshuruni[a], wakati viongozi wa watu walipokusanyika pamoja[b]—makabila ya Israeli yakiwa kitu kimoja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “BWANA alikuwa mfalme katika Yeshuruni”; wengine huelewa, “Musa alikuwa mfalme katika Yeshuruni.” Kiebrania hakimtaji mhusika wazi. “Yeshuruni” ni jina la kishairi la Israeli.
    reason: alternative_reading_and_cultural_note
  - marker: b
    text: Au, “viongozi wa watu walipokusanyika, makabila ya Israeli kwa pamoja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Naye alikuwa
  rationale: Kitenzi היה hapa kinaweza kueleza hali ya kuwa au kuja kuwa. “Alikuwa” ni Kiswahili cha kawaida katika muktadha huu, huku kiwakilishi kikihifadhi kutotajwa wazi kwa mhusika katika Kiebrania.
- source_word: בִישֻׁרוּן
  choice: katika Yeshuruni
  rationale: Yeshuruni ni jina la kishairi la Israeli; limetoholewa kama jina maalumu, na ב imetafsiriwa kwa maana ya mahali au kuwamo katika jumuiya.
- source_word: מֶלֶךְ
  choice: mfalme
  rationale: Hii ndiyo tafsiri ya kawaida ya nomino hiyo, bila kuamua kama anayerejelewa ni BWANA au Musa.
- source_word: בְּהִתְאַסֵּף
  choice: walipokusanyika
  rationale: 'Kitenzi-jina chenye ב kina maana ya wakati: “wakati ... walipokusanyika.” Muundo wa Kiswahili “walipokusanyika” unatoa maana hiyo kwa ufasaha.'
- source_word: רָאשֵׁי עָם
  choice: viongozi wa watu
  rationale: Ingawa maana halisi ni “vichwa vya watu,” huu ni usemi unaomaanisha viongozi au wakuu. “Viongozi” ni wazi na wa kawaida katika Kiswahili cha sasa.
- source_word: יַחַד
  choice: pamoja … yakiwa kitu kimoja
  rationale: Neno linaonyesha kukusanyika na umoja. “Pamoja” linahusishwa na viongozi, na kishazi kinachofuata kinaonyesha umoja wa makabila bila kulazimisha uchanganuzi mmoja wa sintaksia iliyobanwa.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: makabila ya Israeli
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kirai hicho.
theological_decisions:
- issue: Mhusika wa kitenzi na mwenye cheo cha mfalme
  choice: Kifungu kikuu kinatumia “naye” bila kumtaja mhusika wazi.
  alternative: “BWANA alikuwa mfalme katika Yeshuruni” au “Musa alikuwa mfalme katika Yeshuruni.”
  rationale: Kiebrania hakimtaji mhusika wazi. Kutumia kiwakilishi kunahifadhi utata wa kweli kati ya marejeo yanayowezekana kwa BWANA na kwa Musa.
- issue: Umoja wa Israeli katika kusanyiko
  choice: Makabila yanaelezwa kuwa “yakiwa kitu kimoja.”
  alternative: Kuitaja hali hiyo kuwa sherehe rasmi ya kutawazwa au kusanyiko maalumu la agano.
  rationale: Andiko linaonyesha viongozi na makabila wakiwa wamekusanyika kwa umoja, lakini halielezi wazi aina mahususi ya kisiasa au ya kiliturujia ya kusanyiko hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Yeshuruni” limehifadhiwa kama jina la kishairi, na “viongozi” limetumiwa badala ya tafsiri halisi isiyo ya kawaida “vichwa.”
