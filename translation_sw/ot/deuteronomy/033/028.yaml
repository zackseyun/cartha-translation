  text: וַ/יִּשְׁכֹּן֩ יִשְׂרָאֵ֨ל בֶּ֤טַח בָּדָד֙ עֵ֣ין יַעֲקֹ֔ב אֶל אֶ֖רֶץ דָּגָ֣ן וְ/תִיר֑וֹשׁ אַף שָׁמָ֖י/ו יַֽעַרְפוּ טָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/028.yaml
  text: So Israel lived in safety[a], alone; Jacob's fountain in a land of grain and new wine[b]; even his heavens dripped dew.
translation:
  language: sw
  text: Basi Israeli aliishi salama, peke yake[a]; chemchemi ya Yakobo ilikuwa katika nchi ya nafaka na divai mpya[b]; hata mbingu zake zikadondosha umande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiwa kando.” Neno la Kiebrania linaonyesha kukaa tofauti na wengine bila kulazimisha maana ya upweke wa huzuni.
    reason: lexical_alternative
  - marker: b
    text: Au, “jicho la Yakobo.” Neno la Kiebrania linaweza kumaanisha “jicho” au “chemchemi”; matini kuu inafuata maana inayolingana vizuri zaidi na taswira ya wingi wa mazao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: akakaa
  rationale: Kitenzi שׁכן humaanisha kukaa au kuishi mahali. “Akakaa” ni cha kawaida, chenye heshima, na kinaendana na simulizi la baraka.
- source_word: בֶּטַח
  choice: kwa usalama
  rationale: Neno hili linaeleza hali ya Israeli ya kukaa bila hatari; “kwa usalama” ni Kiswahili cha asili na sahihi.
- source_word: בָּדָד
  choice: akiwa peke yake
  rationale: Huhifadhi wazo la kuwa kando au tofauti bila kulifanya moja kwa moja kuwa upweke wa huzuni.
- source_word: עֵין יַעֲקֹב
  choice: chemchemi ya Yakobo
  rationale: עֵין inaweza kumaanisha “jicho” au “chemchemi.” Maana ya “chemchemi” inafaa zaidi katika taswira inayofuata ya nchi yenye mazao, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: אֶל אֶרֶץ
  choice: katika nchi
  rationale: Ingawa אֶל mara nyingi humaanisha kuelekea au kwenda kwa, katika mstari huu wa kishairi kifungu kinaonyesha uhusiano na mahali penye rutuba; “katika nchi” huwasilisha maana hiyo kwa Kiswahili sanifu.
- source_word: דָּגָן
  choice: nafaka
  rationale: Ni neno la jumla kwa mazao ya nafaka, si aina moja maalumu.
- source_word: תִּירוֹשׁ
  choice: divai mpya
  rationale: תִּירוֹשׁ kwa kawaida hurejelea divai mpya au mazao mapya ya mzabibu; uchaguzi huu huhifadhi taswira ya wingi wa mazao.
- source_word: אַף
  choice: hata
  rationale: 'Huonyesha msisitizo unaofikia kilele: si nchi tu, bali hata mbingu zinachangia baraka.'
- source_word: שָׁמָיו
  choice: mbingu zake
  rationale: Huhifadhi kiambishi cha nafsi ya tatu umoja katika Kiebrania na pia utata wake kuhusu anayerejelewa.
- source_word: יַעַרְפוּ
  choice: zikadondosha
  rationale: Kitenzi kinatoa taswira ya matone yanayoanguka au kutiririka; “zikadondosha” ni wazi na ya kishairi bila kuwa ya kizamani.
- source_word: טָל
  choice: umande
  rationale: Hili ndilo neno la moja kwa moja na la kawaida kwa טָל, likihifadhi taswira ya rutuba na baraka.
theological_decisions:
- issue: Maana ya עֵין יַעֲקֹב
  choice: “chemchemi ya Yakobo” katika matini kuu
  alternative: “jicho la Yakobo”
  rationale: Muktadha wa nafaka, divai mpya, na umande unaunga mkono maana ya “chemchemi,” lakini neno la Kiebrania lina maana zote mbili; tanbihi huhifadhi utata huo bila kuufanya fundisho maalumu.
- issue: Nguvu ya בָּדָד
  choice: “akiwa peke yake” kwa maana ya kukaa kwa usalama akiwa tofauti na wengine
  alternative: “akiwa kando” au “akiwa mwenyewe”
  rationale: Muktadha wa baraka unaonyesha usalama na hali ya kutosumbuliwa, si lazima kuachwa au kuwa na upweke wa huzuni.
- issue: Mrejelewa wa kiambishi katika שָׁמָיו
  choice: kiambishi kimehifadhiwa kama “mbingu zake”
  alternative: “mbingu zilizo juu yake”
  rationale: Kupanua kuwa “zilizo juu yake” kungeeleza maana inayowezekana lakini kungepunguza utata wa muundo wa Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kishairi wenye vipashio vifupi umehifadhiwa, pamoja na kirai kisicho na kitenzi “chemchemi ya Yakobo katika nchi...,” ili kutoongeza kitenzi kisichokuwapo wazi katika Kiebrania.
