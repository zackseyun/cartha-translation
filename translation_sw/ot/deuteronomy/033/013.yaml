  text: וּ/לְ/יוֹסֵ֣ף אָמַ֔ר מְבֹרֶ֥כֶת יְהֹוָ֖ה אַרְצ֑/וֹ מִ/מֶּ֤גֶד שָׁמַ֨יִם֙ מִ/טָּ֔ל וּ/מִ/תְּה֖וֹם רֹבֶ֥צֶת תָּֽחַת׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/013.yaml
  text: And of Joseph he said[a], “Blessed by Yahweh be his land, with the choicest things of heaven, with dew[b], and from the deep lying beneath,”
translation:
  language: sw
  text: 'Kuhusu Yosefu alisema,


    “Nchi yake ibarikiwe na Yahwe,

    kwa vitu bora vya mbinguni[a], kwa umande,

    na kwa kilindi[b] kilicholala chini.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa vitu vya thamani vitokavyo mbinguni.”
    reason: lexical_alternative
  - marker: b
    text: Huenda “kilindi” hapa kinamaanisha maji yaliyo chini ya ardhi ambayo huirutubisha nchi.
    reason: cultural_note
lexical_decisions:
- source_word: וּלְיוֹסֵף
  choice: Kuhusu Yosefu
  rationale: Katika utangulizi wa baraka za makabila, לְ pamoja na jina la mtu huonyesha anayehusu baraka hiyo. ‘Kuhusu Yosefu’ ni ya asili katika Kiswahili na huhifadhi muundo wa kifungu.
- source_word: מְבֹרֶכֶת יְהוָה אַרְצוֹ
  choice: Nchi yake ibarikiwe na Yahwe
  rationale: Muundo wa Kiebrania ni kauli ya baraka. Kiswahili cha kutakia, ‘ibarikiwe,’ huhifadhi maana hiyo bila kuibadili kuwa taarifa tu. Jina la Mungu יהוה limetoholewa kuwa ‘Yahwe.’
- source_word: מִמֶּגֶד שָׁמַיִם
  choice: kwa vitu bora vya mbinguni
  rationale: מֶגֶד huonyesha vitu vya thamani, vilivyo bora, au mazao mema. ‘Vitu bora’ ni pana vya kutosha kutohusisha aina moja tu ya baraka, na ‘kwa’ huwasilisha מן kwa Kiswahili cha kawaida katika orodha hii.
- source_word: מִטָּל
  choice: kwa umande
  rationale: Umande ni baraka muhimu ya kilimo. Kirai hiki kinaendeleza orodha ya yale yanayoibariki nchi.
- source_word: וּמִתְּהוֹם רֹבֶצֶת תָּחַת
  choice: na kwa kilindi kilicholala chini
  rationale: תְּהוֹם ni kilindi au maji ya vilindi, na רֹבֶצֶת hutoa picha ya kitu kilicholala chini. Tafsiri inadumisha picha hiyo badala ya kuifafanua moja kwa moja kuwa maji ya chini ya ardhi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina binafsi la Mungu, יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya kauli מְבֹרֶכֶת
  choice: ibarikiwe
  alternative: imebarikiwa
  rationale: Muktadha ni baraka inayotamkwa juu ya Yosefu. ‘Ibarikiwe’ huhifadhi hali ya kutakia, ingawa umbo la Kiebrania linaweza pia kusikika kama maelezo ya kuwa imebarikiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi inayofaa baraka lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa mistari umehifadhi usambamba wa kishairi wa Kiebrania.
