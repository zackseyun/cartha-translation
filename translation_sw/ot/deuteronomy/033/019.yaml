  terminology: “Dhabihu za haki” huhifadhi utata mpana wa זִבְחֵי צֶדֶק bila kuingiza tafsiri ya dhehebu. “Mataifa,” “mlimani,” “wingi wa bahari,” na “hazina zilizofichwa mchangani” zinafaa katika Kiswahili Sanifu na zinaendana na maamuzi ya kileksia ya maandishi ya ukaguzi wa Kiingereza.
