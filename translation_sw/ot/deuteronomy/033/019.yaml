  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: mataifa yanaitwa kwenda mlimani, dhabihu za haki zinatolewa huko, na taswira ya kunyonya wingi wa bahari pamoja na hazina zilizofichwa mchangani imehifadhiwa. Haibainishi mlima wala aina mahsusi za rasilimali zaidi ya ushahidi wa matini.'
