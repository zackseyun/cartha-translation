id: DEU.33.19
reference: Deuteronomy 33:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: עַמִּים֙ הַר יִקְרָ֔אוּ שָׁ֖ם יִזְבְּח֣וּ זִבְחֵי צֶ֑דֶק כִּ֣י שֶׁ֤פַע יַמִּים֙ יִינָ֔קוּ וּ/שְׂפוּנֵ֖י טְמ֥וּנֵי חֽוֹל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/019.yaml
  text: They will call peoples to the mountain[a]; there they will sacrifice righteous sacrifices[c][b], for they will draw from the abundance of the seas and from the hidden treasures of the sand.
translation:
  language: sw
  text: Wataita mataifa yaje mlimani[a]; huko watatoa dhabihu za haki. Kwa maana watanyonya wingi wa bahari[b] na hazina zilizofichwa mchangani.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wataita mataifa yaje kwenye mlima fulani.” Kiebrania hakitaji mlima huo ni upi.
    reason: alternative_reading
  - marker: b
    text: Kiebrania, “watanyonya wingi wa bahari,” ikiwa ni sitiari ya kupata riziki au mali kutoka baharini.
    reason: lexical_alternative
  - marker: c
    text: Au, “vitu vilivyofichwa vya mchanga” au “utajiri uliozikwa mchangani.” Huenda usemi huu unarejelea rasilimali za ufukweni au maeneo yenye mchanga.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּים
  choice: mataifa
  rationale: Wingi wa עַם unaonyesha makundi mbalimbali ya watu. “Mataifa” ni neno la kawaida la Kiswahili linalohifadhi maana hiyo ya kijamii bila kulifanya kuwa watu mmoja mmoja tu.
- source_word: הַר
  choice: mlimani
  rationale: Kiswahili hakina kibainishi kinacholingana moja kwa moja na “the/a.” “Mlimani” huhifadhi mwelekeo wa kwenda kwenye mlima bila kuutambulisha mlima huo kwa jina.
- source_word: יִקְרָאוּ
  choice: wataita ... yaje
  rationale: קרא inaweza kumaanisha kuita au kukusanya. Muundo huu ni wa kawaida katika Kiswahili na unaonyesha kuwa mataifa yanaitwa kwenda mlimani bila kuamua kama ni mwaliko au amri.
- source_word: שָׁם
  choice: huko
  rationale: “Huko” ni kielezi cha mahali kinachorejelea kwa kawaida mahali palipotajwa, yaani mlimani.
- source_word: יִזְבְּחוּ
  choice: watatoa dhabihu
  rationale: Kiswahili cha kawaida hutumia “kutoa dhabihu” kwa tendo la kuleta na kuchinja sadaka ya ibada; kinahifadhi maana mahsusi ya זבח.
- source_word: זִבְחֵי צֶדֶק
  choice: dhabihu za haki
  rationale: Muundo huu unahifadhi uhusiano mpana wa maneno ya Kiebrania bila kuamua kama ni dhabihu zinazokubalika, zinazotolewa kwa haki, au zenye sifa ya haki.
- source_word: שֶׁפַע יַמִּים
  choice: wingi wa bahari
  rationale: שֶׁפַע huonyesha wingi au tele. Tafsiri hii haibani maana iwe chakula, mali, biashara, au rasilimali nyingine zitokazo baharini.
- source_word: יִינָקוּ
  choice: watanyonya
  rationale: Hii inadumisha taswira halisi ya Kiebrania ya kunyonya na hivyo kupata riziki au utajiri kutoka baharini; tanbihi inaeleza matumizi yake ya sitiari.
- source_word: וּשְׂפוּנֵי טְמוּנֵי חוֹל
  choice: na hazina zilizofichwa mchangani
  rationale: Maneno haya yanasisitiza vitu vilivyofichwa au kuhifadhiwa. “Hazina” huwasilisha thamani inayodokezwa, huku “mchangani” ikihifadhi uhusiano na mchanga bila kutaja rasilimali fulani.
theological_decisions:
- issue: Maana ya “dhabihu za haki”
  choice: Kuacha usemi mpana kuwa “dhabihu za haki”
  alternative: Dhabihu zinazokubalika; dhabihu zinazotolewa kwa haki
  rationale: Kiebrania hakiamui wazi uhusiano kamili kati ya dhabihu na haki. Tafsiri haileti mfumo wa baadaye wa kiteolojia wala kuondoa mvutano wa kimaana.
- issue: Mlima unaorejelewa
  choice: Kutoutaja kwa jina
  alternative: Sayuni; Sinai; mahali patakatifu pa kikabila
  rationale: Andiko la Kiebrania linasema tu “mlima” na halitambui wazi ni mlima gani. Kuutaja kwa jina kungezidisha tafsiri kuliko ushahidi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya “kunyonya” imehifadhiwa kwa sababu ni muhimu katika ushairi wa chanzo, huku tanbihi ikifafanua maana yake ya sitiari. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika.
