base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/016.yaml
  text: and with the choicest things of the earth and its fullness[a], and the favor of the one who dwelt in the bush—may it come on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: sw
  text: 'na kwa vitu bora vya dunia na vyote vilivyomo,[a]

    na kwa kibali cha yule aliyekaa katika kichaka.[b]

    Baraka hiyo na ije juu ya kichwa cha Yosefu,

    na juu ya utosi wa yule aliyetengwa na ndugu zake.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nchi na vyote vilivyomo.” Neno la Kiebrania linaweza kumaanisha dunia kwa ujumla au nchi ya Yosefu.
    reason: lexical_alternative
  - marker: b
    text: Maneno haya yanadokeza kujifunua kwa Mungu kwa Musa katika kichaka kilichokuwa kinawaka moto.
    reason: allusion
  - marker: c
    text: Au “mkuu kati ya ndugu zake,” au “aliyewekwa wakfu miongoni mwa ndugu zake.” Neno la Kiebrania linasisitiza kutengwa, na hapa huenda pia likadokeza cheo cha pekee cha Yosefu.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמֶּגֶד אֶרֶץ
  choice: vitu bora vya dunia
  rationale: מֶגֶד humaanisha vitu au mazao ya thamani katika muktadha huu wa baraka. אֶרֶץ imetafsiriwa kwa maana pana ya “dunia,” inayofaa sambamba na “vyote vilivyoijaza,” huku uwezekano wa “nchi” ukihifadhiwa katika tanbihi.
- source_word: מְלֹאָהּ
  choice: vyote vilivyoijaza
  rationale: Hii ni Kiswahili cha kawaida na wazi kwa maana ya kila kitu kilichomo duniani, bila kutumia usemi mzito “utimilifu wake.”
- source_word: רְצוֹן
  choice: kibali
  rationale: Katika muktadha huu neno linaonyesha wema na upendeleo wa Mungu kwa Yosefu; “kibali” ni fupi, yenye heshima, na ya kawaida katika lugha ya baraka.
- source_word: שֹׁכְנִי סְנֶה
  choice: yule aliyekaa katika kichaka
  rationale: Muundo huu unahifadhi kauli ya Kiebrania na dokezo la kujifunua kwa Mungu kwa Musa katika kichaka, bila kuongeza moja kwa moja neno “kinachowaka” ambalo halimo katika mstari huu.
- source_word: תָּבֹואתָה
  choice: Hayo yote na yaje
  rationale: Kitenzi cha Kiebrania ni cha umoja na kinachukulia baraka iliyotajwa kama jumla moja. Kiswahili cha wingi hapa hurejelea kwa kawaida vitu bora na kibali vilivyotangulia, huku nguvu ya ombi la baraka ikihifadhiwa kwa “na yaje.”
- source_word: לְרֹאשׁ יוֹסֵף
  choice: juu ya kichwa cha Yosefu
  rationale: Huu ni usemi wa moja kwa moja unaohifadhi taswira ya baraka kumjia Yosefu kichwani.
- source_word: קָדְקֹד
  choice: utosi
  rationale: “Utosi” hutaja sehemu ya juu kabisa ya kichwa na kuhifadhi usambamba wa kishairi bila kurudia maelezo marefu.
- source_word: נְזִיר אֶחָיו
  choice: yule aliyetengwa na ndugu zake
  rationale: נְזִיר kimsingi humaanisha mtu aliyetengwa au kuwekwa wakfu. Chaguo hili linahifadhi maana ya msingi na hali ya Yosefu kutofautishwa na ndugu zake bila kuamua kwamba neno lazima limaanishe “mkuu.”
theological_decisions:
- issue: Utambulisho wa “yule aliyekaa katika kichaka”
  choice: Kauli ya heshima inayomtaja Mungu aliyejifunua kwa Musa katika kichaka
  alternative: Rejeo la jumla zaidi kwa udhihirisho wa Mungu huko Sinai/Horebu
  rationale: Maneno haya yanadokeza kwa nguvu simulizi la Kutoka 3. Tafsiri ya maelezo inahifadhi dokezo hilo bila kuingiza ufafanuzi wa baadaye usiotajwa wazi katika mstari.
- issue: Maana ya נְזִיר kuhusu Yosefu
  choice: aliyetengwa na ndugu zake
  alternative: mkuu kati ya ndugu zake; aliyewekwa wakfu miongoni mwa ndugu zake
  rationale: Neno linaweza kuonyesha kutengwa, kuwekwa wakfu, au cheo cha pekee. Tafsiri kuu inahifadhi msingi wa kileksika, na tanbihi inaonyesha uwezekano wa ukuu bila kuufanya kuwa maana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mistari minne inahifadhi usambamba wa baraka. “Vitu bora” na “vyote vilivyoijaza” ni lugha wazi kwa wasomaji wa kawaida; “utosi” huhifadhi usahihi wa taswira ya kishairi.
