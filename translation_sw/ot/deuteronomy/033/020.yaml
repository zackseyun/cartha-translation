  text: 'And of Gad he said: “Blessed is he who enlarges Gad[a]. He dwells like a lioness, and tears off arm[c][b], even scalp.”'
translation:
  language: sw
  text: 'Kuhusu Gadi alisema:


    “Amebarikiwa yeye anayempanulia Gadi nafasi[a].


    Gadi anakaa kama simba[b],


    na hurarua mkono, naam, hata utosi[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Abarikiwe yeye anayempanulia Gadi nafasi.” Huenda anayerejelewa kwa kudokezwa ni Mungu, ingawa Kiebrania hakimwiti wazi.
    reason: alternative_reading
  - marker: b
    text: Neno la Kiebrania linaweza pia kutafsiriwa “simba jike”; linaweza kumaanisha simba mwenye nguvu kwa ujumla.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “mkono, naam, hata kilele cha kichwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְגָד
  choice: Kuhusu Gadi
  rationale: Hutambulisha tamko la baraka linalomhusu kabila la Gadi kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: בָּרוּךְ
  choice: Amebarikiwa
  rationale: Ni kivumishi cha kiarifu kinachotangaza hali ya kubarikiwa; hakigeuzwi kuwa ombi pekee.
- source_word: מַרְחִיב
  choice: yeye anayempanulia ... nafasi
  rationale: Hifili ya רחב ina maana ya kupanua au kumpatia nafasi kubwa. Neno “nafasi” linafanya maana hiyo iwe wazi bila kulazimisha kuwa ni eneo pekee.
- source_word: כְּלָבִיא
  choice: kama simba
  rationale: לָבִיא humaanisha simba mwenye nguvu na wakati mwingine simba jike. “Simba” katika Kiswahili inaweza kutumiwa kwa mnyama huyo kwa ujumla na huhifadhi mkazo wa nguvu za mwindaji.
- source_word: שָׁכֵן
  choice: anakaa
  rationale: Kitenzi kinaweza kumaanisha kukaa, kuishi, au kujilaza mahali. “Anakaa” kinafaa kwa picha ya kabila katika eneo lake na pia kwa tashbihi ya simba.
- source_word: וְטָרַף
  choice: na kurarua
  rationale: טרף huonyesha tendo kali la mnyama anayepasua mawindo. “Kurarua” huhifadhi picha hiyo ya kikatili.
- source_word: זְרוֹעַ
  choice: mkono
  rationale: Maana halisi ya kiungo cha mwili inafaa katika ulinganifu wake na utosi kuliko maana ya kitamathali ya nguvu.
- source_word: אַף
  choice: naam, hata
  rationale: 'Chembe hii huongeza na kusisitiza kiungo cha pili: si mkono tu, bali hata utosi.'
- source_word: קָדְקֹד
  choice: utosi
  rationale: Neno hili hurejelea sehemu ya juu kabisa ya kichwa; “utosi” ni neno fasaha na sahihi la Kiswahili.
theological_decisions:
- issue: Anayerejelewa na ‘yeye anayempanulia Gadi nafasi’
  choice: Mhusika hajaainishwa kwa jina; sentensi inasema tu ‘yeye anayempanulia Gadi nafasi.’
  alternative: Kumtaja Mungu wazi kuwa ndiye anayempanulia Gadi nafasi.
  rationale: Ingawa mshiriki מַרְחִיב huenda akamrejelea Mungu kwa kudokezwa, Kiebrania hakimwiti Mungu wazi. Tafsiri inadumisha uwazi huo badala ya kuamua jambo ambalo matini yenyewe haijaliainisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mistari ya kishairi imehifadhiwa. Jina “Gadi” limetajwa tena katika mstari wa pili ili kuepusha utata wa kiwakilishi bila kubadili mhusika wa Kiebrania.
