  text: Moses commanded a law for us[b][a], an inheritance for the assembly of Jacob.
translation:
  language: sw
  text: Musa aliamuru sheria kwa ajili yetu[a][b]—urithi kwa kusanyiko la Yakobo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Musa aliamuru sheria kwa ajili yetu, urithi wa kusanyiko la Yakobo.” Sintaksia ya Kiebrania imebanwa, na “urithi” inaweza kusomwa kuwa maelezo ya karibu ya “sheria.”
    reason: alternative_reading
  - marker: b
    text: “Sheria” inaweza pia kutafsiriwa “mafundisho”; “urithi” pia inaweza kutafsiriwa “miliki” au “urithi wa jadi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  choice: sheria
  rationale: Katika muktadha huu wa agano na Musa, neno hili linamaanisha sheria yenye mamlaka iliyotolewa kwa Israeli. “Mafundisho” pia linawezekana, lakini ni pana zaidi.
- source_word: צִוָּה
  choice: alituamuru
  rationale: Kitenzi hiki kwa kawaida humaanisha kuamuru. Uchaguzi huu unadumisha uzito wa mamlaka ya tendo hilo badala ya kulilegeza kuwa “alitupa.”
- source_word: לָנוּ
  choice: -tu- katika “alituamuru”
  rationale: Kiwakilishi hiki kinaonyesha kuwa amri ilielekezwa kwetu, yaani kwa Israeli. Muundo wa Kiswahili “alituamuru sheria” ni mfupi na unaakisi ushairi uliobanwa wa Kiebrania.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: מוֹרָשָׁה
  choice: urithi
  rationale: Neno hili hueleza kitu kinachomilikiwa kama haki iliyopokelewa. “Urithi” linadumisha maana ya kitu kilichopokelewa na watu wa agano.
- source_word: קְהִלַּת
  choice: kusanyiko la
  rationale: Neno hili humaanisha jamii iliyokusanyika. “Kusanyiko” linahifadhi dhana hiyo ya watu kama kundi bila kuingiza maana mahususi ya taasisi ya baadaye.
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Maandishi ya Kiebrania yanamtaja Yakobo moja kwa moja; jina hilo linahifadhiwa badala ya kubadilishwa kuwa “Israeli.”
theological_decisions:
- issue: Uhusiano wa kisintaksia kati ya “sheria” na “urithi”
  choice: Alama ya mkato mrefu inaweka “urithi wa kusanyiko la Yakobo” karibu na “sheria” kama maelezo ya sheria hiyo, huku ikidumisha ufupi wa kishairi.
  alternative: “Musa alituamuru sheria; hiyo ni urithi wa kusanyiko la Yakobo.”
  rationale: Sehemu ya pili haina kitenzi katika Kiebrania, na sintaksia yake imebanwa. Tafsiri haiongezi kitenzi waziwazi katika matini kuu, hivyo inadumisha uwezekano wa kusoma “urithi” kama kirai kinachoeleza “sheria” bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi, wa kishairi na wenye hadhi. Muundo “alituamuru sheria” unakusudiwa kudumisha ubanifu wa Kiebrania; tanbihi inaonyesha tafsiri iliyo wazi zaidi ya לָנוּ.
