  text: הָ/אֹמֵ֞ר לְ/אָבִ֤י/ו וּ/לְ/אִמּ/וֹ֙ לֹ֣א רְאִיתִ֔י/ו וְ/אֶת אֶחָי/ו֙ לֹ֣א הִכִּ֔יר וְ/אֶת בנ/ו לֹ֣א יָדָ֑ע כִּ֤י שָֽׁמְרוּ֙ אִמְרָתֶ֔/ךָ וּ/בְרִֽיתְ/ךָ֖ יִנְצֹֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/009.yaml
  text: who said of his father and his mother[a], ‘I have not seen him,’ and did not acknowledge his brothers or know his sons; for they kept your word and guarded your covenant.
translation:
  language: sw
  text: aliyesema kuhusu baba yake na mama yake[a], “Sikumjali,” wala hakuwatambua ndugu zake wa kiume, wala kuwajua watoto wake wa kiume; kwa maana walilitii neno lako na kulilinda agano lako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri halisi zaidi, “Sikumwona.” Hapa maana yaelekea kuwa “Sikumjali” au “Sikumwangalia kwa upendeleo,” kwa kuwa uaminifu kwa agano uliwekwa juu ya uhusiano wa kifamilia.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמֵר
  choice: aliyesema
  rationale: Kirai cha urejeshi kinamrejelea Lawi katika mstari uliotangulia; wakati uliopita unafaa katika muktadha wa matendo yanayosimuliwa.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: kuhusu baba yake na mama yake
  rationale: ל pamoja na אמר inaweza kumtaja anayezungumziwa au anayeambiwa. ‘Kuhusu’ ni ya asili hapa na inaendana na kauli inayofuata.
- source_word: לֹא רְאִיתִיו
  choice: Sikumjali
  rationale: Ingawa ראה kimsingi ni ‘kuona,’ hapa ina nguvu ya kutompa mtu uzito au kutomwangalia kwa upendeleo wa kifamilia. Tanbihi inahifadhi maana halisi ya kitenzi.
- source_word: הִכִּיר
  choice: hakuwatambua
  rationale: Hiphil ya נכר hapa ina maana ya kutambua au kukiri uhusiano. ‘Kutambua’ huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: אֶחָיו
  choice: ndugu zake
  rationale: Neno la Kiebrania ni ‘ndugu zake wa kiume’; katika Kiswahili ‘ndugu’ ndiyo istilahi ya kawaida, huku kiwakilishi cha ngeli ya watu kikionyesha wingi.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Huhifadhi umahususi wa ‘wana’ badala ya kulipanua kuwa ‘watoto.’
- source_word: יָדָע
  choice: kuwajua
  rationale: Huhifadhi maana ya msingi ya ידע, huku muktadha ukionyesha kutokiri uhusiano wao.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu ya kuweka uaminifu kwa agano juu ya madai ya kifamilia.
- source_word: שָׁמְרוּ
  choice: walilitii
  rationale: Katika muktadha wa neno la Mungu, שמר lina maana ya kulishika au kulitii; ‘kulitii’ ni wazi na la asili.
- source_word: אִמְרָתֶךָ
  choice: neno lako
  rationale: Ni tafsiri ya kawaida ya אִמְרָה bila kulibana kuwa amri moja mahususi.
- source_word: בְּרִיתְךָ
  choice: agano lako
  rationale: ‘Agano’ ni istilahi sanifu ya Kiswahili kwa ברית katika muktadha huu.
- source_word: יִנְצֹרוּ
  choice: kulilinda
  rationale: 'Huhifadhi tofauti ndogo ya kileksika kati ya נצר na שמר: kulinda au kuhifadhi kwa uangalifu.'
theological_decisions:
- issue: Mrejelewa wa umoja na wingi katika mstari
  choice: Umoja umehifadhiwa katika maelezo ya Lawi kama mhusika wakilishi, kisha wingi katika sababu inayowahusu Walawi kwa pamoja.
  alternative: Kusawazisha kauli yote iwe katika umoja au yote iwe katika wingi.
  rationale: Kiebrania hubadilika kutoka maumbo ya umoja hadi vitenzi vya wingi. Tafsiri haipaswi kufuta mvutano huo wa Lawi kama mmoja na kabila lake kama jumuiya.
- issue: Maana ya ‘Sikumwona’ katika uaminifu wa agano
  choice: Maana ya kimuktadha ‘Sikumjali’ imetumika katika matini, na maana halisi imewekwa katika tanbihi.
  alternative: Kutafsiri moja kwa moja ‘Sikumwona.’
  rationale: Muktadha unaonyesha kutowapa jamaa upendeleo au utambuzi unaozidi wajibu wa agano, si ukosefu wa kuwaona kwa macho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko. ‘Wanawe’ limetumiwa badala ya ‘watoto wake’ ili kuhifadhi jinsia ya neno la chanzo; badiliko la umoja kwenda wingi limeachwa lionekane.
