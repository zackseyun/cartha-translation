  yaml_path: translation/ot/deuteronomy/033/026.yaml
  text: There is none like God[a], O Jeshurun, who rides on the heavens to help you[c][b], and in his majesty on the skies.
translation:
  language: sw
  text: Hakuna aliye kama Mungu, ee Yeshuruni,[a] anayepanda mbinguni ili kukusaidia,[b] na kwa fahari yake, juu ya mawingu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yeshuruni ni jina la kishairi la Israeli.
    reason: cultural_note
  - marker: b
    text: Au, “kwa msaada wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין כָּאֵל
  choice: Hakuna aliye kama Mungu
  rationale: Kirai hiki ni ukanushaji wa kuwapo unaotangaza kwamba Mungu hana kifani. Tafsiri hii ni ya asili katika Kiswahili na inadumisha nguvu ya kishairi.
- source_word: יְשֻׁרוּן
  choice: Yeshuruni
  rationale: Hili ni jina la kishairi la Israeli; limetoholewa badala ya kutafsiriwa. Neno “ee” linaonyesha kwamba anaitwa moja kwa moja.
- source_word: רֹכֵב
  choice: anayepanda juu ya
  rationale: Kitenzi hiki kinaonyesha Mungu kama mpandaji mkuu. “Anayepanda juu ya” kinahifadhi taswira hiyo na kinaeleweka katika ushairi wa Kiswahili.
- source_word: שָׁמַיִם
  choice: mbingu
  rationale: “Mbingu” ni neno la kawaida na lenye hadhi kwa eneo la juu, na linafaa katika mlingano wa kishairi wa mstari huu.
- source_word: בְעֶזְרֶךָ
  choice: ili kukusaidia
  rationale: Hapa kihusishi בְּ pamoja na עֵזֶר kinaweza kueleza kusudi au manufaa. “Ili kukusaidia” kinatoa maana hiyo wazi bila kuondoa uwezekano wa tafsiri ya karibu zaidi, ambao umewekwa katika tanbihi.
- source_word: וּבְגַאֲוָתוֹ
  choice: katika fahari yake
  rationale: Likisemwa kumhusu Mungu, גַּאֲוָה linaashiria utukufu, ukuu, au fahari, si kiburi chenye lawama. “Fahari” inadumisha lugha fupi ya kishairi.
- source_word: שְׁחָקִים
  choice: mawingu
  rationale: Neno hili la kishairi linaweza kutaja mawingu au anga za juu. “Mawingu” linatoa taswira halisi na kutofautisha neno hili na שָׁמַיִם bila kuharibu ulinganifu.
theological_decisions:
- issue: Maana ya אֵל katika ulinganisho wa kishairi
  choice: Mungu
  alternative: Eli; Mwenye Nguvu
  rationale: Katika muktadha huu אֵל ni cheo cha kawaida cha Mungu, si lazima jina maalumu. “Mungu” linaonyesha wazi kwamba Mungu wa Israeli ndiye anayetangazwa kuwa hana kifani, bila kuingiza wazo la mungu mwingine.
- issue: Uhusiano wa יְשֻׁרוּן na אֵל
  choice: 'Yeshuruni anaambiwa moja kwa moja: “ee Yeshuruni”'
  alternative: “Mungu wa Yeshuruni”
  rationale: Uwekaji wa maneno na mgawanyo wa Kimasora unaunga mkono kuelewa יְשֻׁרוּן kama mwito. Tafsiri inadumisha usomaji huo bila kuficha kwamba jina hili linamtaja Israeli kishairi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wenye hadhi lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa mstari na taswira ya Mungu anayepanda juu ya mbingu na mawingu vimedumishwa.
