source:
  edition: WLC
  text: בָּרֵ֤ךְ יְהוָה֙ חֵיל֔/וֹ וּ/פֹ֥עַל יָדָ֖י/ו תִּרְצֶ֑ה מְחַ֨ץ מָתְנַ֧יִם קָמָ֛י/ו וּ/מְשַׂנְאָ֖י/ו מִן יְקוּמֽוּ/ן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/011.yaml
  text: Bless[a], O Yahweh, his strength, and accept the work of his hands. Crush the loins of those who rise against him, and of those who hate him[b], so that they do not rise again.
translation:
  language: sw
  text: Ee Yahwe, ubariki nguvu zake[a], na ukubali kazi ya mikono yake. Uponde viuno vya wale wanaoinuka dhidi yake, na vya wale wanaomchukia, ili wasiinuke tena.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mali zake” au “jeshi lake.” Neno la Kiebrania linaweza kumaanisha nguvu, uwezo, mali, au jeshi.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “Uponde viuno vya wale wanaoinuka dhidi yake, na vya wale wanaomchukia, wasiinuke tena.” Katika taswira ya Kiebrania, viuno vinaweza kuwakilisha nguvu au uwezo.
    reason: cultural_note
lexical_decisions:
- source_word: בָּרֵךְ
  choice: ubariki
  rationale: Ni amri/ombi linaloelekezwa kwa Yahwe. ‘Ubariki’ ni tafsiri ya moja kwa moja na ya kawaida, bila kuibana maana kuwa kufanikisha tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: חֵילוֹ
  choice: nguvu zake
  rationale: חַיִל inaweza kumaanisha nguvu, uwezo, mali, au jeshi. ‘Nguvu zake’ hudumisha upana wa maana katika muktadha huu bila kuifunga kwa mali au jeshi pekee.
- source_word: וּפֹעַל יָדָיו
  choice: kazi ya mikono yake
  rationale: Huhifadhi picha halisi ya Kiebrania na ni usemi wa Kiswahili unaoeleweka kuhusu kazi au matendo ya mtu.
- source_word: תִּרְצֶה
  choice: ukubali
  rationale: Kitenzi kinaomba kibali cha Mungu juu ya huduma au kazi ya Lawi; ‘ukubali’ ni wazi bila kuongeza ufafanuzi wa kidhehebu.
- source_word: מְחַץ
  choice: uwapige na kuwavunja
  rationale: Kitenzi kina nguvu ya kupiga kwa kuvunja au kuponda. Usemi huu wa Kiswahili unaonyesha ukali wa tendo na unaungana kwa kawaida na ‘viuno’.
- source_word: מָתְנַיִם
  choice: viuno
  rationale: Ni maana halisi ya picha ya Kiebrania, inayoweza kuwakilisha nguvu au uwezo. Picha hiyo imedumishwa katika matini na kufafanuliwa katika tanbihi.
- source_word: קָמָיו
  choice: wale wanaomwinukia
  rationale: Hudumisha picha ya kitenzi קום, yaani kuinuka dhidi ya mtu, badala ya kuibadilisha tu kuwa ‘adui’.
- source_word: וּמְשַׂנְאָיו
  choice: wale wanaomchukia
  rationale: Hutoa moja kwa moja wazo la chuki binafsi lililo katika participio ya Kiebrania.
- source_word: מִן יְקוּמוּן
  choice: ili wasiinuke tena
  rationale: Muundo wa Kiebrania ni mfupi na kidogo duaradufu; Kiswahili hiki huonyesha matokeo yaliyokusudiwa—wapinzani washindwe kiasi cha kutoweza kuinuka tena.
theological_decisions:
- issue: Mhusika anayerejelewa na viwakilishi vya umoja ‘zake/yake/mwinukia/mchukia’
  choice: Viwakilishi vinamrejelea Lawi, kabila linalobarikiwa katika muktadha wa karibu.
  alternative: Vinaweza kueleweka kwa upana kuwa vinamrejelea mtumishi wa kikuhani au huduma inayowakilishwa na Lawi.
  rationale: Kumbukumbu la Torati 33:8–11 ni baraka kwa Lawi. Kudumisha viwakilishi vya umoja kunafuata umbo la Kiebrania bila kulazimisha upanuzi wa kitafsiri katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Ee’ huonyesha mwito wa sala; ‘Yahwe’ huhifadhi jina la Mungu. Muundo umedumisha taswira kali ya kishairi ya Kiebrania huku tanbihi zikieleza upeo wa חַיִל na picha ya viuno.
