  text: And of Zebulun he said[a], “Rejoice, Zebulun, in your going out, and Issachar, in your tents.”
translation:
  language: sw
  text: Kuhusu Zabuloni alisema, “Furahi, Ee Zabuloni, katika kutoka kwako; nawe Isakari, katika mahema yako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/זְבוּלֻן
  choice: Kuhusu Zabuloni
  rationale: Kihusishi ל־ hapa kinatanguliza baraka inayomhusu kabila la Zabuloni; ‘Kuhusu’ ni Kiswahili cha kawaida na cha heshima katika muundo huu.
- source_word: אָמַר
  choice: alisema
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi cha kuanzisha usemi.
- source_word: שְׂמַח
  choice: Furahi
  rationale: Huhifadhi hali ya amri na sauti ya baraka bila kuongeza ufafanuzi.
- source_word: זְבוּלֻן
  choice: Zabuloni
  rationale: Jina la kabila limetolewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: בְּ/צֵאתֶךָ
  choice: katika kutoka kwako
  rationale: Huhifadhi taswira na upeo mpana wa muundo wa Kiebrania, ambao unaweza kumaanisha wakati, mazingira, au nyanja ya shughuli za Zabuloni.
- source_word: וְ/יִשָּׂשכָר
  choice: nawe Isakari
  rationale: ‘Nawe’ huonyesha wazi kwamba amri ‘furahi’ inamhusu pia Isakari, huku ikihifadhi uratibu wa kishairi.
- source_word: בְּ/אֹהָלֶיךָ
  choice: katika mahema yako
  rationale: Huhifadhi wingi, taswira halisi ya mahema, na ulinganifu na ‘katika kutoka kwako.’
