base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/027.yaml
  text: The God of old is a dwelling place[a], and underneath are everlasting arms. He drove out the enemy before you, and said, ‘Destroy!’
translation:
  language: sw
  text: Mungu wa tangu zamani ni makao[a], na chini kuna mikono ya milele. Alimfukuza adui mbele yako, akasema, “Angamiza!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu wa milele ni kimbilio lako.” Kiebrania kinaweza kueleweka kwa maana hiyo ya jadi, ya kifasiri zaidi, ingawa tafsiri ya moja kwa moja zaidi ni “Mungu wa tangu zamani ni makao.”
    reason: alternative_reading
lexical_decisions:
- source_word: מְעֹנָה
  choice: makao
  rationale: Neno hili humaanisha mahali pa kukaa au pa kupata hifadhi. “Makao” inadumisha taswira halisi bila kuifasiri moja kwa moja kuwa “kimbilio,” ingawa maana ya hifadhi ipo katika muktadha.
- source_word: אֱלֹהֵי קֶדֶם
  choice: Mungu wa tangu zamani
  rationale: קֶדֶם hapa inaelekea kurejelea wakati wa kale au zamani. “Wa tangu zamani” ni Kiswahili cha kawaida kinachoonyesha kwamba Mungu amekuwapo tangu nyakati za kale bila kumaanisha kwamba yeye ni mzee.
- source_word: וּמִתַּחַת
  choice: na chini
  rationale: Kirai hiki kinaonyesha mahali. “Na chini” kinadumisha usambamba wa kishairi na sehemu ya kwanza ya mstari bila kuongeza kiwakilishi ambacho hakipo wazi katika Kiebrania.
- source_word: זְרֹעֹת עוֹלָם
  choice: mikono ya milele
  rationale: “Mikono” inadumisha sitiari ya nguvu na utegemezo, na “ya milele” huonyesha kudumu bila mwisho.
- source_word: וַיְגָרֶשׁ
  choice: Alimfukuza
  rationale: Kitenzi גרש humaanisha kufukuza au kuondoa kwa nguvu. “Alimfukuza” ni wazi na kinafaa katika muktadha wa kijeshi.
- source_word: מִפָּנֶיךָ
  choice: mbele yako
  rationale: Ingawa maana ya neno kwa neno ni “kutoka mbele ya uso wako,” katika muktadha kinarejelea kuondolewa kwa adui mbele ya mwendo wa Israeli.
- source_word: אוֹיֵב
  choice: adui
  rationale: Nomino iko katika umoja na inaweza pia kuwa na maana ya kijumla. “Adui” inadumisha umbo hilo.
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Muendelezo huu wa masimulizi unamtaja Mungu kuwa ndiye anayesema, kulingana na kishazi kilichotangulia.
- source_word: הַשְׁמֵד
  choice: Angamiza!
  rationale: Hii ni amri yenye nguvu inayotaka uharibifu kamili. “Angamiza!” ni ya kawaida na yenye uzito unaofaa bila kuongeza maelezo yasiyokuwapo katika Kiebrania.
theological_decisions:
- issue: Iwapo קֶדֶם katika אֱלֹהֵי קֶדֶם itafsiriwe kuwa “tangu zamani” au kwa maana ya kitheolojia kuwa “wa milele”
  choice: Mungu wa tangu zamani
  alternative: Mungu wa milele
  rationale: Neno la Kiebrania kimsingi huelekea kumaanisha wakati wa kale au wa zamani. Tafsiri ya jadi “Mungu wa milele” inawezekana, lakini ni ya kifasiri zaidi; kwa hiyo imehifadhiwa katika tanbihi pamoja na uelewaji wa “kimbilio lako.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo wa kishairi umehifadhiwa kwa sentensi fupi na usambamba wa “makao” na “mikono ya milele.”
