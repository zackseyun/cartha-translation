base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/007.yaml
  text: 'And this he said for Judah: “Hear[a], Yahweh, the voice of Judah, and bring him to his people. Let his hands strive for him, and be a help against his adversaries.”'
translation:
  language: sw
  text: 'Na kuhusu Yuda alisema:


    “Ee Yahweh, sikia sauti ya Yuda,

    na umlete kwa watu wake.

    Mikono yake na impiganie[a],

    nawe uwe msaada dhidi ya adui zake.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mikono yake na imtoshe.” Kifungu hiki cha Kiebrania ni kigumu na kimeeleweka kwa njia zaidi ya moja.
    reason: alternative_reading
lexical_decisions:
- source_word: וְזֹאת לִיהוּדָה
  choice: Na kuhusu Yuda
  rationale: Muundo huu unatambulisha baraka inayomhusu Yuda; ‘kuhusu’ ni Kiswahili cha kawaida na huhifadhi maana ya kiambishi ל cha mada au rejeleo.
- source_word: שְׁמַע יְהוָה
  choice: Ee Yahweh, isikie
  rationale: Ni ombi la moja kwa moja kwa Yahweh. ‘Isikie’ huunganika kawaida na ‘sauti’ na kuhifadhi taswira ya Kiebrania.
- source_word: קוֹל יְהוּדָה
  choice: sauti ya Yuda
  rationale: Tafsiri ya karibu ya קוֹל; haibainishi kupita kiasi ikiwa ni kilio, sala, au sauti kwa maana pana.
- source_word: וְאֶל עַמּוֹ תְּבִיאֶנּוּ
  choice: na umlete kwa watu wake
  rationale: Kitenzi cha Hifili cha בוא kina maana ya kumleta. Tafsiri hii haiongezi dhana ya kurudi, ambayo haijasemwa wazi katika Kiebrania.
- source_word: יָדָיו רָב לוֹ
  choice: Mikono yake na impiganie
  rationale: Hufuata uwezekano wa kuelewa רָב kwa maana ya kushindana au kupigana kwa ajili yake, unaolingana na muktadha wa maadui. Utata wa kifungu umeonyeshwa katika tanbihi.
- source_word: וְעֵזֶר מִצָּרָיו תִּהְיֶה
  choice: nawe uwe msaada dhidi ya adui zake
  rationale: מִן hapa inaeleweka kwa maana ya upinzani au ulinzi dhidi ya maadui; ‘nawe’ humrejelea Yahweh, anayeombwa moja kwa moja.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Jina la agano limetolewa kwa namna ya ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- issue: Maana ya kifungu kigumu יָדָיו רָב לוֹ
  choice: Mikono yake na impiganie
  alternative: Mikono yake na imtoshe
  rationale: Usomaji mkuu unafaa muktadha wa mapambano na ombi la msaada dhidi ya maadui, lakini Kiebrania ni kifupi na kinaweza kueleweka kwa zaidi ya njia moja; kwa hiyo usomaji mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka. Mpangilio wa kishairi umehifadhiwa, na kiashiria cha tanbihi kimewekwa baada ya kifungu kinachohusika.
