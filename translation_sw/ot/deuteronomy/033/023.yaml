base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/023.yaml
  text: 'And of Naphtali he said: “Naphtali[a], satisfied with favor and full of the blessing of Yahweh, possess the sea and the south.”'
translation:
  language: sw
  text: 'Kuhusu Naftali alisema:


    “Ee Naftali, uliyetosheka kwa kibali,

    na uliyejaa baraka ya Yahweh,

    miliki bahari[a] na kusini.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “magharibi na kusini,” kwa kuwa katika Kiebrania neno “bahari” linaweza pia kutumiwa kuonyesha upande wa magharibi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְנַפְתָּלִי
  choice: Kuhusu Naftali
  rationale: Kiambishi ל katika utangulizi wa baraka kinamtambulisha Naftali kuwa mada au mlengwa wa kauli; Kiswahili cha kawaida hutumia “Kuhusu Naftali” kwa uwazi.
- source_word: אָמַר
  choice: alisema
  rationale: Huhifadhi maana ya kawaida ya kitenzi אמר na mtindo sahili wa utangulizi.
- source_word: נַפְתָּלִי
  choice: Ee Naftali
  rationale: Jina limetoholewa kama Naftali; “Ee” linaonyesha kwamba maneno yanayofuata yanamwelekea Naftali moja kwa moja, jambo linaloendana na kauli ya baraka.
- source_word: שְׂבַע רָצוֹן
  choice: uliyestosheka kwa kibali
  rationale: שׂבע huonyesha kushiba au kutosheka, na רָצוֹן hapa ni kibali kinachotolewa; usemi huu ni wa asili na wenye hadhi katika Kiswahili.
- source_word: וּמָלֵא בִּרְכַּת יְהוָה
  choice: na kujaa baraka ya Yahweh
  rationale: Huwakilisha kishazi sambamba kinachoonyesha hali ya kuwa amejaa baraka; umoja “baraka” unaifuata nomino ya Kiebrania בִּרְכַּת.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetolewa kwa unukuzi “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: יָם
  choice: bahari
  rationale: Maana ya msingi ni “bahari”; uwezekano wa maana ya mwelekeo “magharibi” umehifadhiwa katika tanbihi.
- source_word: וְדָרוֹם
  choice: na kusini
  rationale: דָרוֹם humaanisha kusini au eneo la kusini; “kusini” ni wazi na sambamba na “bahari.”
- source_word: יְרָשָׁה
  choice: miliki
  rationale: Umbo hili lina nguvu ya agizo au tamko la baraka kuhusu kutwaa na kumiliki eneo; “miliki” ni fupi na linafaa katika muktadha.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko linatumia Tetragramatoni kama jina binafsi la Mungu; “Yahweh” hulihifadhi kama jina bila kuligeuza kuwa cheo.
- issue: Je, יָם ni bahari au mwelekeo wa magharibi?
  choice: bahari katika matini kuu
  alternative: magharibi
  rationale: Maana ya moja kwa moja ya יָם ni “bahari,” lakini katika Kiebrania neno hilo pia linaweza kutumiwa kumaanisha magharibi. Utata halisi umehifadhiwa kwa tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa heshima lakini kinachoeleweka kwa msomaji wa kawaida. Mistari imepangwa kuonyesha usambamba wa baraka ya Kiebrania.
