lexical_decisions:
- source_word: מֶגֶד
  choice: bora
  rationale: Katika muktadha wa baraka, neno hili linaonyesha ubora na thamani ya mazao. “Bora” ni la kawaida na la asili katika Kiswahili, na linatumika katika vipashio vyote viwili vinavyolingana.
- source_word: תְּבוּאֹת
  choice: mazao
  rationale: Neno hili linahusu kwa upana kile ambacho ardhi hutoa; “mazao” huhifadhi maana ya kilimo bila kuibana kuwa tukio moja la mavuno.
- source_word: שָׁמֶשׁ
  choice: jua
  rationale: Jua linatajwa kama linalohusishwa na kukomaa kwa mazao. “Yanayokomazwa na jua” huwasilisha uhusiano huo kwa Kiswahili cha kawaida bila kudai kwamba jua ndilo chanzo pekee cha mazao.
- source_word: גֶּרֶשׁ
  choice: mavuno yanayotolewa
  rationale: Neno hili adimu linamaanisha kile kinachotokezwa au kuletwa. Kauli hii inadumisha taswira ya mazao yanayoletwa katika mzunguko wa majira na inaeleweka kwa msomaji wa kawaida.
- source_word: יְרָחִים
  choice: mwezi baada ya mwezi
  rationale: Ingawa umbo la Kiebrania ni wingi “miezi” na linahusiana na mwezi angani, hapa linaonyesha mzunguko wa wakati ambao huleta mazao kwa vipindi. Tafsiri hii ni ya asili katika Kiswahili, huku tanbihi ikihifadhi umbo na mwangwi wa Kiebrania.
