  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה מִ/סִּינַ֥י בָּא֙ וְ/זָרַ֤ח מִ/שֵּׂעִיר֙ לָ֔/מוֹ הוֹפִ֨יעַ֙ מֵ/הַ֣ר פָּארָ֔ן וְ/אָתָ֖ה מֵ/רִבְבֹ֣ת קֹ֑דֶשׁ מִֽ/ימִינ֕/וֹ אשדת לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/002.yaml
  text: 'And he said: “Yahweh came from Sinai and dawned from Seir upon them[a]; he shone forth from Mount Paran, and came from myriads of holiness[b]; from his right hand came a fiery law for them.”'
translation:
  language: sw
  text: 'Akasema:

    “Yahwe alikuja kutoka Sinai,

    akawachomozea kutoka Seiri;

    akaangaza kutoka Mlima Parani,

    akaja kutoka makumi ya maelfu ya utakatifu[a].

    Kutoka mkono wake wa kuume

    iliwajia sheria ya moto[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaja kutoka miongoni mwa makumi ya maelfu ya watakatifu.” Neno la Kiebrania linaweza kumaanisha wahudumu watakatifu badala ya utakatifu kwa maana ya hali.
    reason: alternative_reading
  - marker: b
    text: Neno la Kiebrania אשדת ni gumu na maana yake haina uhakika. Kwa mapokeo limetafsiriwa “sheria ya moto,” lakini huenda likamaanisha miale au mimweko ya moto iliyotoka mkono wake wa kuume.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa umbo la Kiswahili linalofuata matamshi ya YHWH, badala ya kulibadilisha kuwa cheo kama “BWANA.”
- source_word: וְזָרַח מִשֵּׂעִיר לָמוֹ
  choice: akawachomozea kutoka Seiri
  rationale: Kitenzi זרח huleta picha ya jua au nuru inayochomoza na kuwaangazia watu; “akawachomozea” ni Kiswahili cha kishairi na cha kawaida kinachohifadhi picha hiyo.
- source_word: הוֹפִיעַ
  choice: akaangaza
  rationale: Hiphil ya יפע inaeleza kungʼaa au kujidhihirisha kwa mngʼao; “akaangaza” ni wazi na hudumisha taswira ya nuru.
- source_word: מֵהַר פָּארָן
  choice: kutoka Mlima Parani
  rationale: הַר ni mlima, na Parani ni jina la mahali; muundo huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: מֵרִבְבֹת קֹדֶשׁ
  choice: kutoka makumi ya maelfu ya utakatifu
  rationale: Tafsiri hii ya karibu inahifadhi hali ya kutokuwa wazi ya קֹדֶשׁ, ambayo inaweza kumaanisha utakatifu au, kwa maana inayodokezwa, viumbe watakatifu. Ufafanuzi wa “watakatifu” umewekwa katika tanbihi.
- source_word: מִימִינוֹ
  choice: kutoka mkono wake wa kuume
  rationale: מִן kwa kawaida humaanisha “kutoka”; tafsiri hii huhifadhi picha ya kitu kinachotoka mkono wa kuume wa Yahwe.
- source_word: אשדת
  choice: sheria ya moto
  rationale: Neno hili la Kiebrania ni gumu na maana yake haina uhakika. “Sheria ya moto” hufuata usomaji wa kimapokeo unaofaa mazingira ya Sinai, huku tanbihi ikionyesha uwezekano mwingine.
- source_word: לָמוֹ
  choice: iliwajia
  rationale: Kiambishi cha wingi wa nafsi ya tatu kimewasilishwa kwa Kiswahili cha kawaida kama kitu kilichowajia au kilichotolewa kwao.
theological_decisions:
- issue: Utambulisho wa mhusika wa kimungu katika udhihirisho wa kishairi
  choice: Jina “Yahwe” limetumika moja kwa moja bila kuingiza ufafanuzi wa baadaye wa Kikristo katika matini.
  alternative: Kutafsiri kifungu hiki kwa lugha inayokitambulisha wazi na Kristo au kwa kutumia cheo “BWANA.”
  rationale: Muktadha ni baraka ya Musa inayoeleza kujidhihirisha kwa YHWH kutoka Sinai, Seiri na Parani; tafsiri inapaswa kuhifadhi muktadha huo bila kuongeza hitimisho la kiteolojia lisilotajwa.
- issue: Maana ya מֵרִבְבֹת קֹדֶשׁ
  choice: Matini kuu imetumia “makumi ya maelfu ya utakatifu,” na tanbihi imetoa “makumi ya maelfu ya watakatifu.”
  alternative: Kutaja moja kwa moja makumi ya maelfu ya watakatifu au viumbe watakatifu.
  rationale: Muundo wa Kiebrania unaweza kueleweka kwa namna zaidi ya moja. Tafsiri ya karibu katika matini na tanbihi ya ufafanuzi huhifadhi utata halisi kuhusu kama wanaorejelewa ni wahudumu watakatifu.
- issue: Maana ya אשדת
  choice: “sheria ya moto” imetumiwa katika matini kuu, huku kutokuwa na uhakika kwa neno hilo kukielezwa katika tanbihi.
  alternative: Miale ya moto, mimweko ya moto, au moto uliotoka mkono wake wa kuume.
  rationale: Umbo hili ni tata sana. Usomaji wa kimapokeo unaendana na mazingira ya Sinai, lakini uwezekano mwingine haupaswi kufichwa.
translation_notes:
  register: Lugha ni ya kishairi, yenye heshima na inayoeleweka katika Kiswahili Sanifu cha Afrika Mashariki. Mistari mifupi inadumisha mfuatano wa udhihirisho wa Yahwe na taswira ya nuru. Kauli isiyo ya kawaida “makumi ya maelfu ya utakatifu” imehifadhiwa kwa makusudi ili kutofuta utata wa Kiebrania, na maana inayowezekana imefafanuliwa katika tanbihi.
