base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/012.yaml
  text: 'And of Benjamin he said: “The beloved of Yahweh dwells in safety by him[a]; he shields him all the day[b], and he dwells between his shoulders.”'
translation:
  language: sw
  text: 'Kuhusu Benyamini alisema:


    “Mpendwa wa Yahwe hukaa salama karibu naye[a];


    humfunika mchana kutwa,


    naye hukaa kati ya mabega yake.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hukaa salama kando yake,” “chini yake,” au “juu yake.” Kihusishi cha Kiebrania ni kifupi na kinaweza kuonyesha ukaribu au uangalizi wa kinga.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “kati ya mabega yake.” Baadhi huona hii kuwa picha ya ukaribu wenye ulinzi; wengine huielewa kwa maana ya kijiografia kuwa vilima vya Benyamini au mahali patakatifu palipokuwa katika eneo la Benyamini. Pia, viwakilishi vya Kiebrania havibainishi kabisa kama anayekaa hapa ni Benyamini au Yahwe.
    reason: alternative_reading
lexical_decisions:
- source_word: לְבִנְיָמִן
  choice: Kuhusu Benyamini
  rationale: Katika mtindo wa baraka kwa makabila, usemi huu wa Kiswahili unatambulisha kwa kawaida kabila linalozungumziwa, huku maana ya msingi ya ‘kwa/kumhusu Benyamini’ ikihifadhiwa.
- source_word: יְדִיד יְהוָה
  choice: Mpendwa wa Yahwe
  rationale: ‘Mpendwa’ huonyesha mtu anayependwa sana, na ‘Yahwe’ huhifadhi jina binafsi la Mungu lililo katika maandishi ya Kiebrania.
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: hukaa salama
  rationale: ‘Hukaa’ linaonyesha hali ya kudumu inayofaa katika baraka ya kishairi, na ‘salama’ linawasilisha wazo la usalama bila kufanya sentensi kuwa nzito.
- source_word: עָלָיו
  choice: karibu naye
  rationale: Kihusishi cha Kiebrania kinaweza kuonyesha ukaribu au uangalizi wa kinga. ‘Karibu naye’ ni Kiswahili cha kawaida kisichofungia maana katika picha moja ya mahali; uwezekano mwingine umewekwa katika tanbihi.
- source_word: חֹפֵף עָלָיו
  choice: humfunika
  rationale: Kitenzi huleta picha ya kufunika kwa ulinzi. ‘Humfunika’ huhifadhi picha hiyo na, kwa kutotaja wazi mtendaji, huacha kiasi cha ubanifu wa viwakilishi vya shairi.
- source_word: כָּל הַיּוֹם
  choice: mchana kutwa
  rationale: Ni usemi wa kawaida na wenye hadhi katika Kiswahili unaomaanisha muda wote wa siku.
- source_word: וּבֵין כְּתֵיפָיו שָׁכֵן
  choice: naye hukaa kati ya mabega yake
  rationale: Tafsiri hii inahifadhi picha halisi ya ‘mabega’ na kurudia wazo la kukaa, bila kuibadili moja kwa moja kuwa maelezo ya vilima au eneo.
theological_decisions:
- issue: Wahusika wanaorejelewa na viwakilishi
  choice: Maandishi yanamwonyesha mpendwa akikaa salama karibu na Yahwe, lakini katika vifungu vinavyofuata yanaacha viwakilishi bila kutaja majina upya.
  alternative: Yahwe ndiye anayekaa juu ya Benyamini na kati ya mabega yake; au Benyamini ndiye anayekaa kati ya mabega ya Yahwe.
  rationale: Ushairi wa Kiebrania ni mfupi na viwakilishi vyake vinaweza kueleweka kwa njia zaidi ya moja. Kiswahili kimehifadhi mvutano huo kadiri inavyowezekana, na tanbihi inaeleza uwezekano muhimu bila kuufanya mmoja kuwa lazima.
- issue: Maana ya ‘kati ya mabega yake’
  choice: Picha ya mwili imehifadhiwa moja kwa moja katika maandishi.
  alternative: Usemi huo unaweza kueleweka kitopografia kuwa vilima vya eneo la Benyamini au mahali patakatifu ndani ya eneo lake.
  rationale: Maandishi yenyewe yanasema ‘mabega’; kutafsiri moja kwa moja kuwa vilima au mahali patakatifu kungeamua taswira ambayo chanzo kinaiacha wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. ‘Mchana kutwa’ ni usemi wa sasa unaoeleweka kwa urahisi; mpangilio wa mistari unahifadhi usambamba wa baraka ya Kiebrania.
