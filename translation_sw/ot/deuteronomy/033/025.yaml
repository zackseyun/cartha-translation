  text: בַּרְזֶ֥ל וּ/נְחֹ֖שֶׁת מִנְעָלֶ֑י/ךָ וּ/כְ/יָמֶ֖י/ךָ דָּבְאֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/025.yaml
  text: Your bars shall be iron and bronze[a], and as your days[b], so shall your strength be.
translation:
  language: sw
  text: Mapingo yako yatakuwa ya chuma na shaba[a], na kadiri ya siku zako, ndivyo nguvu zako zitakavyokuwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Viatu vyako vitakuwa vya chuma na shaba.” Neno la Kiebrania linaweza kutaja kiatu, ingawa wengi hulielewa hapa kuwa mapingo ya lango kwa sababu ya metali zinazotajwa na muktadha wa usalama.
    reason: lexical_alternative
  - marker: b
    text: Au, “na kadiri ya siku zako, ndivyo pumziko lako [au usalama wako] litakavyokuwa.” Neno la mwisho la Kiebrania ni nadra na maana yake haijulikani kwa hakika; “nguvu” ni tafsiri ya kimapokeo inayofaa muktadha wa baraka.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל
  choice: chuma
  rationale: Ni maana ya kawaida ya metali hii, nayo imeunganishwa na נְחֹשֶׁת katika maelezo ya vifaa.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: Neno hili linaweza kumaanisha shaba au bronzi kwa upana; “shaba” ni neno la kawaida na linaloeleweka kwa urahisi katika Kiswahili.
- source_word: מִנְעָלֶיךָ
  choice: mapingo yako
  rationale: Ingawa nomino hii inaweza kumaanisha viatu au makubazi, katika muktadha huu vitu vya chuma na shaba vinaeleweka kwa kawaida kuwa mapingo ya lango yanayoashiria usalama. Maana nyingine imehifadhiwa katika tanbihi.
- source_word: וּכְיָמֶיךָ
  choice: na kadiri ya siku zako
  rationale: Kihusishi כ kinaonyesha uwiano au ulinganisho; usemi huu unaunganisha siku za mhusika na kile kinachotajwa baadaye.
- source_word: דָּבְאֶךָ
  choice: nguvu zako
  rationale: Neno hili ni nadra na maana yake si hakika. “Nguvu” ni tafsiri ya kimapokeo inayofaa muktadha wa baraka, lakini uwezekano wa “pumziko/usalama” umeonyeshwa katika tanbihi.
theological_decisions:
- issue: Taswira na ahadi ya baraka
  choice: Mstari unaahidi usalama wa kudumu na nguvu zinazotosha katika siku zote za mhusika.
  alternative: Huenda mstari unaeleza viatu imara kwa ajili ya eneo gumu na uimara unaoendelea; au kishazi cha mwisho kinaweza kumaanisha pumziko au usalama wa kudumu.
  rationale: Muktadha wa baraka unaunga mkono wazo la ulinzi na nguvu, lakini Kiebrania kina utata wa kweli katika nomino zote mbili muhimu; hivyo maana mbadala hazijafichwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mapingo” limetumiwa kwa fito au bolti za kufungia lango; tanbihi zinahifadhi maana mbadala za Kiebrania. Alama zote za tanbihi zimewekwa katika matini kuu.
