  text: 'And of Dan he said: “Dan is a lion’s cub[a]; he leaps out from Bashan.”'
translation:
  language: sw
  text: 'Na kuhusu Dani alisema:


    “Dani ni mwana wa simba;


    anaruka[a] kutoka Bashani.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anachupa kutoka Bashani.” Kitenzi cha Kiebrania kinaonyesha mwendo wa ghafla wa kuruka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְדָן
  choice: Na kuhusu Dani
  rationale: Kihusishi kinatanguliza baraka inayomhusu Dani; “kuhusu” ni Kiswahili cha kawaida na kinaonyesha wazi kuwa maneno yanayofuata yanamhusu kabila hilo.
- source_word: אָמַר
  choice: alisema
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya kitenzi cha kusema katika utangulizi wa maneno yaliyonukuliwa.
- source_word: דָּן
  choice: Dani
  rationale: Jina la mtu na kabila limetolewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: גּוּר אַרְיֵה
  choice: mwana-simba
  rationale: Kirai hiki humaanisha simba mchanga. “Mwana-simba” ni cha asili, kifupi, na kinadumisha taswira ya kishairi.
- source_word: יְזַנֵּק
  choice: anaruka
  rationale: Kitenzi kinaonyesha mwendo wa ghafla wa kuruka au kuchupa. “Anaruka” ni wazi na hakiongezi wazo mahususi la kushambulia ambalo halisemwi moja kwa moja katika Kiebrania.
- source_word: מִן הַבָּשָׁן
  choice: kutoka Bashani
  rationale: Kihusishi מן kinaonyesha chanzo au mahali pa kuanzia; “kutoka Bashani” ni tafsiri ya moja kwa moja na ya kawaida.
