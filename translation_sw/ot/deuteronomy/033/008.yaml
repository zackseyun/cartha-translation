base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/008.yaml
  text: 'And of Levi he said: “Your Thummim and your Urim belong to your faithful one[a], whom you tested at Massah[b], with whom you contended at the waters of Meribah.”'
translation:
  language: sw
  text: 'Na kuhusu Lawi alisema:


    “Thumimu yako na Urimu yako ni za mtu wako mwaminifu[a],


    ambaye ulimjaribu huko Masa[b];


    ulishindana naye kwenye maji ya Meriba.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu wako mcha Mungu” au “mtu wako mshikamanifu.” Neno la Kiebrania linaweza kumaanisha mtu mwenye uaminifu wa agano.
    reason: lexical_alternative
  - marker: b
    text: Masa maana yake ni “jaribu” au “majaribio,” na Meriba linahusishwa na “ugomvi” au “mashindano” (taz. Kut. 17:1–7; Hes. 20:1–13).
    reason: cross_reference
lexical_decisions:
- source_word: וּלְלֵוִי
  choice: Na kuhusu Lawi
  rationale: Kiambishi לְ pamoja na jina la kabila kinamtambulisha Lawi kama anayezungumziwa katika baraka; “kuhusu” ni Kiswahili cha kawaida kinachofaa muktadha huu.
- source_word: תֻּמֶּיךָ וְאוּרֶיךָ
  choice: Thumimu yako na Urimu yako
  rationale: Haya ni majina maalumu ya vifaa vya kikuhani ambavyo umbo na utendaji wake kamili si hakika; kuyanukuu kwa matamshi huhifadhi upekee wake kuliko kuyatafsiri kama “ukamilifu” na “nuru.”
- source_word: לְאִישׁ חֲסִידֶךָ
  choice: ni kwa mtu wako mwaminifu
  rationale: Kifungu cha Kiebrania hakina kitenzi; “ni kwa” kinaonyesha kwamba Thumimu na Urimu vinamhusu au vimekabidhiwa mtu huyo bila kuamua zaidi maana. “Mwaminifu” huwasilisha wazo la uaminifu au ushikamanifu wa agano, huku “mtu” ikihifadhi umoja wa kiume wa אִישׁ.
- source_word: אֲשֶׁר נִסִּיתוֹ
  choice: ambaye ulimjaribu
  rationale: Kitenzi נסה hapa kina maana ya kumjaribu au kumpima; “ulimjaribu” ni wazi na kinafaa dokezo la tukio la jangwani.
- source_word: בְּמַסָּה
  choice: huko Masa
  rationale: Masa ni jina la mahali linalohifadhiwa badala ya kutafsiriwa kuwa “jaribu”; “huko” huonyesha mahali kwa Kiswahili cha kawaida.
- source_word: תְּרִיבֵהוּ
  choice: ulishindana naye
  rationale: ריב huonyesha kushindana, kubishana, au kuwa katika mgogoro. “Ulishindana naye” huhifadhi mgongano wa moja kwa moja bila kuufanya kuwa shtaka rasmi.
- source_word: עַל מֵי מְרִיבָה
  choice: kwenye maji ya Meriba
  rationale: עַל katika muktadha huu ina kazi ya kimahali; “kwenye” ni ya asili katika Kiswahili, na Meriba linahifadhiwa kama jina la mahali/tukio.
theological_decisions:
- issue: Mhusika wa “mtu wako mwaminifu” katika baraka ya Lawi
  choice: Kudumisha usemi wa umoja bila kumtaja mhusika kuwa Haruni, Lawi, au kabila la Walawi.
  alternative: Kumtambulisha wazi kuwa Haruni, Lawi kama babu, au kabila lote la Walawi.
  rationale: Kiebrania kina usemi wa umoja unaoweza kueleweka kwa njia kadhaa. Tafsiri haipaswi kuondoa utata huo wa kweli kwa kuongeza utambulisho ambao mstari wenyewe hautaji.
- issue: Uhusiano wa Thumimu na Urimu na mtu mwaminifu
  choice: “ni kwa mtu wako mwaminifu”
  alternative: “ni mali ya mtu wako mwaminifu” au “umpe mtu wako mwaminifu”
  rationale: לְ inaweza kuonyesha kwamba vitu hivyo ni vya, vinamhusu, au vimekusudiwa mtu huyo. “Ni kwa” huhifadhi upana huo kuliko kudai umiliki kamili au kuifanya kauli kuwa amri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa mistari unafuata muundo wa baraka. Majina Lawi, Thumimu, Urimu, Masa, na Meriba yametolewa kwa tahajia zilizozoeleka katika Kiswahili cha Biblia.
