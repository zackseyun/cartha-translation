  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַשְׁרֶ֨י/ךָ יִשְׂרָאֵ֜ל מִ֣י כָמ֗וֹ/ךָ עַ֚ם נוֹשַׁ֣ע בַּֽ/יהוָ֔ה מָגֵ֣ן עֶזְרֶ֔/ךָ וַ/אֲשֶׁר חֶ֖רֶב גַּאֲוָתֶ֑/ךָ וְ/יִכָּֽחֲשׁ֤וּ אֹיְבֶ֨י/ךָ֙ לָ֔/ךְ וְ/אַתָּ֖ה עַל בָּמוֹתֵ֥י/מוֹ תִדְרֹֽךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/029.yaml
  text: Blessed are you[a], Israel! Who is like you, a people saved by Yahweh, the shield of your help and the sword of your majesty? Your enemies will come cringing to you[b], and you will tread on their high places.
translation:
  language: sw
  text: Heri yako, Israeli! Ni nani aliye kama wewe, taifa lililookolewa na Yahwe, aliye ngao ya msaada wako na upanga wa fahari yako? Adui zako watanyenyekea mbele yako[a], nawe utakanyaga mahali pao pa juu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Adui zako watajifanya watiifu kwako.” Kitenzi cha Kiebrania kinaweza kudokeza utii wa kulazimishwa au wa hila.
    reason: lexical_alternative
  - marker: b
    text: Au, “utakanyaga sehemu zao za juu/ngome zao.” Wengine huelewa neno hili kuwa “migongo yao,” lakini maana yake ya moja kwa moja ni “mahali pa juu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֶיךָ
  choice: Heri yako
  rationale: Tamko hili linaeleza hali yenye baraka na inayostahili kutamaniwa. “Heri yako” ni Kiswahili cha kawaida, chenye hadhi, na kinatofautisha אַשְׁרֵי na kitenzi cha moja kwa moja cha ‘kubarikisha’.
- source_word: מִי כָמוֹךָ
  choice: Ni nani aliye kama wewe
  rationale: Inahifadhi swali la balagha linalosisitiza kwamba Israeli hailinganishwi na taifa jingine.
- source_word: עַם נוֹשַׁע בַּיהוָה
  choice: taifa lililookolewa na Yahwe
  rationale: Neno נוֹשַׁע lina hali ya kutendwa na humweleza Israeli kama taifa ambalo Yahwe ameliokoa. “Taifa” linafaa kwa עם katika muktadha huu wa Israeli kama jamii ya agano.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: מָגֵן עֶזְרֶךָ
  choice: ngao ya msaada wako
  rationale: Inahifadhi muundo mfupi wa Kiebrania na kumtambulisha Yahwe kuwa ulinzi na chanzo cha msaada wa Israeli.
- source_word: וַאֲשֶׁר חֶרֶב גַּאֲוָתֶךָ
  choice: na upanga wa fahari yako
  rationale: Kirai hiki kinaendelea kumweleza Yahwe kwa taswira ya upanga. “Fahari” linabeba maana chanya ya kuinuliwa au utukufu bila kuingiza maana hasi ya kiburi.
- source_word: וְיִכָּחֲשׁוּ אֹיְבֶיךָ לָךְ
  choice: Adui zako watanyenyekea mbele yako
  rationale: Hii ni tafsiri ya kawaida inayoeleweka ya kutiishwa kwa maadui, huku tanbihi ikihifadhi uwezekano wa utii wa kulazimishwa, wa kujifanya, au wa hila uliomo katika kitenzi כחשׁ.
- source_word: עַל בָּמוֹתֵימוֹ תִדְרֹךְ
  choice: utakanyaga mahali pao pa juu
  rationale: “Mahali pa juu” ndiyo maana ya moja kwa moja ya בָּמוֹת; taswira ya ushindi juu ya maeneo au ngome za adui imehifadhiwa bila kuibadili moja kwa moja kuwa ‘migongo’.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano la Mungu, kwa hiyo limetolewa kama jina binafsi badala ya cheo.
- issue: Maana ya גַּאֲוָתֶךָ
  choice: fahari yako
  alternative: utukufu wako; kuinuliwa kwako; kiburi chako
  rationale: Katika baraka hii neno lina maana chanya ya heshima au kuinuliwa. “Fahari” huhifadhi maana hiyo bila kudokeza dhambi ya kiburi.
- issue: Namna ya utii wa maadui katika כחשׁ
  choice: watanyenyekea mbele yako, pamoja na tanbihi
  alternative: watajifanya watiifu kwako; watasalimu amri kwa hila
  rationale: Kitenzi kinaweza kumaanisha utii wa kulazimishwa au wa kujifanya. Matini kuu haifungi maana kwa udanganyifu pekee, na tanbihi huhifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi wenye hadhi lakini unaoeleweka kwa msomaji wa kawaida. Muundo wa swali la balagha na taswira za ngao, upanga, na kukanyaga maeneo ya juu zimehifadhiwa. Viashiria [a] na [b] vimewekwa kwenye vifungu vinavyohusika moja kwa moja.
