base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/024.yaml
  text: 'And of Asher he said: “Most blessed of sons is Asher[a]; may he be favored by his brothers[c][b], and may he dip his foot in oil.”'
translation:
  language: sw
  text: 'Na kuhusu Asheri akasema:


    “Asheri ndiye aliyebarikiwa zaidi miongoni mwa wana[a];


    akubaliwe na ndugu zake[b],


    na achovye mguu wake katika mafuta.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Asheri amebarikiwa kuliko wana.” Muundo wa Kiebrania unaweza kueleweka kuwa wa kulinganisha au wa kiwango cha juu.
    reason: lexical_alternative
  - marker: b
    text: Huenda “ndugu zake” ni makabila mengine ya Israeli.
    reason: cultural_note
  - marker: c
    text: Picha ya kuchovya mguu katika mafuta huenda inaonyesha wingi au ustawi, lakini maana halisi ya sitiari hiyo haijaelezwa wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאָשֵׁר
  choice: Kuhusu Asheri
  rationale: Kiambishi cha uunganishi pamoja na kihusishi kinaanzisha baraka ya kabila linalofuata. Kiswahili cha “Kuhusu Asheri” ni cha kawaida na kinaonyesha wazi mabadiliko ya mada.
- source_word: אָמַר
  choice: akasema
  rationale: Ni kitenzi cha kawaida cha kutambulisha maneno ya Musa; “akasema” hudumisha mtiririko wa simulizi bila kuongeza uzito usiokuwamo katika Kiebrania.
- source_word: בָּרוּךְ מִבָּנִים
  choice: aliyebarikiwa zaidi miongoni mwa wana
  rationale: Muundo wenye מִן unaweza kuwa wa kulinganisha au wa kiwango cha juu. Tafsiri hii inaeleweka kwa urahisi huku tanbihi ikihifadhi uwezekano wa “kuliko wana wengine.”
- source_word: אָשֵׁר
  choice: Asheri ndiye
  rationale: Kurudia jina la kabila huhifadhi msisitizo wa kishairi wa Kiebrania; “ndiye” huleta mkazo huo kwa Kiswahili cha kawaida.
- source_word: יְהִי רְצוּי
  choice: akubaliwe
  rationale: Katika muktadha wa baraka, יְהִי ina nguvu ya ombi au matakwa. “Akubaliwe” huwasilisha hali ya kupokelewa kwa kibali bila kuifanya kuwa upendo pekee.
- source_word: אֶחָיו
  choice: na ndugu zake
  rationale: Nomino ya Kiebrania ni wingi wa kiume na katika muktadha inaelekea kwa makabila mengine yaliyotokana na Yakobo. Tafsiri halisi “ndugu zake” inalinda picha ya kifamilia.
- source_word: וְטֹבֵל
  choice: na achovye
  rationale: Ingawa umbo ni la kitenzi-endelevu, usambamba wa kishairi na ombi lililotangulia hulipa maana ya matakwa. “Na achovye” hudumisha nguvu hiyo ya baraka.
- source_word: בַּשֶּׁמֶן
  choice: katika mafuta
  rationale: שֶׁמֶן humaanisha mafuta, mara nyingi mafuta ya zeituni, lakini aina haijatajwa wazi. “Mafuta” huhifadhi picha pana ya maandishi.
- source_word: רַגְלוֹ
  choice: mguu wake
  rationale: Kiebrania kimetumia umoja wenye kiambishi cha nafsi ya tatu ya kiume; umoja umehifadhiwa badala ya kubadilishwa kuwa “miguu yake.”
theological_decisions:
- issue: Maana ya baraka “achovye mguu wake katika mafuta”
  choice: Kuacha sitiari halisi katika matini kuu
  alternative: Kuifafanua moja kwa moja kuwa wingi wa mazao, ustawi wa eneo, anasa, au usalama
  rationale: Picha ya Kiebrania ni wazi lakini maana yake kamili haijaelezwa. Kuihifadhi kihalisi huacha uwezekano wake wa kishairi na kitheolojia bila kuingiza ufafanuzi maalumu katika matini.
- issue: Uhusiano wa Asheri na “wana” katika בָּרוּךְ מִבָּנִים
  choice: “aliyebarikiwa zaidi miongoni mwa wana”
  alternative: “aliyebarikiwa kuliko wana wengine”
  rationale: Kihusishi מִן kinaweza kuonyesha kundi ambamo kiwango cha juu kinatolewa au ulinganisho wa moja kwa moja. Matini kuu inatoa Kiswahili asilia, na tanbihi inahifadhi usomaji mwingine halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mistari imepangwa kuonyesha usambamba wa baraka. Majina na picha halisi za Kiebrania zimehifadhiwa bila kuongeza tafsiri ya kimadhehebu.
