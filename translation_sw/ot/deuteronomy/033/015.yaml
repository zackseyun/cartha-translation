  yaml_path: translation/ot/deuteronomy/033/015.yaml
  text: and from the choicest things of the ancient mountains[a], and from the abundance of the everlasting hills[b],
translation:
  language: sw
  text: na kutoka katika vitu vilivyo bora vya milima ya kale[a], na kutoka katika vitu vya thamani vya vilima vya milele[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka vilele vya milima ya kale.” Kifungu cha Kiebrania kinaweza kueleweka kwa maana ya mahali (“kilele cha”) au ya ubora (“vitu bora vya”).
    reason: lexical_alternative
  - marker: b
    text: Au, “kutoka katika wingi wa vilima vya milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֹאשׁ
  choice: kutoka katika vitu bora vya
  rationale: Ingawa רֹאשׁ kwa kawaida ni ‘kichwa’ au ‘kilele,’ katika muktadha huu wa baraka inaweza kumaanisha kilicho bora zaidi. Usambamba na מֶגֶד, inayotaja mazao au vitu vya thamani, unaunga mkono maana hii, huku maana ya mahali ikibaki katika tanbihi.
- source_word: הַרְרֵי
  choice: milima
  rationale: Ni wingi wa הַר katika hali ya muundo; ‘milima’ ni tafsiri ya moja kwa moja na inaitofautisha na גִּבְעוֹת, ‘vilima.’
- source_word: קֶדֶם
  choice: ya kale
  rationale: קֶדֶם inaweza kumaanisha mashariki au zamani za kale. Hapa usambamba wake wa kishairi na עוֹלָם unaelekeza kwenye maana ya wakati.
- source_word: מִמֶּגֶד
  choice: kutoka katika mazao ya thamani ya
  rationale: מֶגֶד hutaja kitu cha thamani, hasa mazao mema au tele. ‘Mazao ya thamani’ ni ya asili katika Kiswahili na inafaa muktadha wa baraka zinazotokana na ardhi.
- source_word: גִּבְעוֹת
  choice: vilima
  rationale: Hii ndiyo maana ya kawaida ya גִּבְעָה na inadumisha tofauti yake na ‘milima’ katika kipande kilichotangulia.
- source_word: עוֹלָם
  choice: vya milele
  rationale: Katika ushairi kuhusu mandhari, עוֹלָם huonyesha kudumu kwa muda usio na mwisho au tangu zamani sana. ‘Vya milele’ huhifadhi uzito wa kishairi bila kukifananisha kabisa na קֶדֶם, ‘ya kale.’
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na hadhi. ‘Vitu bora’ huhifadhi upana wa maana ya baraka za milima, huku ‘mazao ya thamani’ ikiwasilisha kwa lugha ya kawaida wazo la מֶגֶד kama mazao mema na yenye thamani. Alama zote za tanbihi zimewekwa katika matini kuu.
