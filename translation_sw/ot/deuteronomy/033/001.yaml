  yaml_path: translation/ot/deuteronomy/033/001.yaml
  text: 'This is the blessing with which Moses[a], the man of God, blessed the sons of Israel before his death:'
translation:
  language: sw
  text: 'Hii ndiyo baraka ambayo Musa, mtu wa Mungu, aliwabariki nayo wana wa Israeli[a] kabla ya kifo chake:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “wana wa Israeli,” usemi wa kawaida unaowarejelea kwa pamoja watu wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Hii ndiyo
  rationale: Hutambulisha sehemu mpya na kubainisha baraka inayofuata bila kuongeza neno la wakati lisilokuwamo katika Kiebrania.
- source_word: הַבְּרָכָה
  choice: baraka
  rationale: Nomino hii inaashiria baraka au tamko rasmi la baraka; muundo “Hii ndiyo baraka” unawakilisha uainishaji wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר בֵּרַךְ
  choice: ambayo ... aliwabariki nayo
  rationale: Muundo huu wa Kiswahili unaonyesha kwa uwazi kwamba baraka hiyo ndiyo Musa aliyotumia kuwabariki, huku ukihifadhi kitenzi cha Kiebrania cha ‘kubariki.’
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hilo katika Kiswahili.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Ni tafsiri ya moja kwa moja na iliyozoeleka ya cheo hiki cha nabii au mtu aliyepewa utume na Mungu.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi usemi wa kifamilia wa Kiebrania huku ‘wana’ katika muktadha huu ikirejelea kwa pamoja wazao au watu wa Israeli.
- source_word: לִפְנֵי מוֹתוֹ
  choice: kabla ya kifo chake
  rationale: Inafuata muundo wa nomino wa Kiebrania kwa Kiswahili rasmi na cha kawaida.
theological_decisions:
- issue: Maana ya pamoja ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli / watu wa Israeli
  rationale: Usemi wa asili ni wa kifamilia na kwa umbo ni ‘wana wa Israeli.’ Tafsiri inauhifadhi bila kuufanya urejelee wanaume peke yao; tanbihi inaeleza kwamba ni usemi wa pamoja kwa watu wa Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “aliwabariki nayo” ni wa asili katika Kiswahili na huhifadhi uhusiano kati ya ‘baraka’ na kitendo cha kubariki. Alama ya tanbihi imewekwa baada ya kirai kinachoelezwa.
