  yaml_path: translation/ot/deuteronomy/033/003.yaml
  text: Indeed[a], he loves the peoples; all his holy ones are in your hand, and they sit down at your feet[b]; each receives your words.
translation:
  language: sw
  text: Naam, yeye huwapenda mataifa; watakatifu wake wote wamo mkononi mwako, nao wameketi[a] miguuni pako; kila mmoja hupokea maneno yako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maana ya neno la Kiebrania lililotafsiriwa “wameketi” haina uhakika; pia limeeleweka kuwa “wamekusanyika,” “wamejikunyata,” au hata “wameangushwa.”
    reason: alternative_reading
  - marker: b
    text: Au “kila mmoja huchukua baadhi ya maneno yako” au “hubeba semi zako.” Usemi wa Kiebrania ni adimu na mgumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Naam
  rationale: Hapa neno hili linasisitiza na kuthibitisha kauli inayofuata. “Naam” ni la kawaida, lenye heshima, na linaonyesha mkazo huo bila kulifanya kuwa kiunganishi cha nyongeza.
- source_word: חֹבֵב
  choice: huwapenda
  rationale: Umbo la kitenzi linaonyesha hali au mwelekeo unaoendelea. “Huwapenda” linafikisha maana ya upendo wa kudumu kwa Kiswahili cha kawaida.
- source_word: עַמִּים
  choice: watu wa mataifa
  rationale: Wingi huu unaweza kumaanisha makundi ya watu au mataifa. “Watu wa mataifa” huhifadhi wazo la watu wengi bila kulazimisha kwamba neno hilo linamaanisha Mataifa wasio Wayahudi pekee.
- source_word: כָּל קְדֹשָׁיו
  choice: watakatifu wake wote
  rationale: Tafsiri hii huhifadhi maana pana ya wale walio watakatifu au waliowekwa wakfu, bila kuamua kwamba ni malaika au kundi fulani la watu.
- source_word: בְּיָדֶךָ
  choice: wamo mkononi mwako
  rationale: Huhifadhi taswira halisi ya Kiebrania ya kuwa “mkononi” mwa mtu, ambayo pia inaweza kudokeza ulinzi au mamlaka, na hulinda badiliko la nafsi katika shairi.
- source_word: תֻּכּוּ
  choice: wameketi
  rationale: Neno hili ni gumu na maana yake haina uhakika. Kuketi kunafaa muktadha wa kuwa miguuni mwa msemaji na kupokea maneno yake, lakini uwezekano mwingine umeonyeshwa katika tanbihi.
- source_word: לְרַגְלֶךָ
  choice: miguuni pako
  rationale: Hii ndiyo njia ya asili ya Kiswahili ya kueleza mahali pa kuketi karibu na miguu ya mtu, huku ikihifadhi taswira ya unyenyekevu na usikilizaji.
- source_word: יִשָּׂא
  choice: hupokea
  rationale: Ingawa maana ya msingi inaweza kuwa kuinua, kubeba, au kuchukua, katika muktadha wa maneno “hupokea” huwasilisha vizuri tendo la kuyachukua na kuyakubali.
- source_word: מִדַּבְּרֹתֶיךָ
  choice: maneno yako
  rationale: Nomino hii ni adimu na ngumu, lakini inahusiana na usemi. “Maneno yako” ni wazi na ya kawaida; uwezekano wa kutafsiri kihusishi kama “kutoka katika” umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Mabadiliko ya nafsi ya viwakilishi katika shairi
  choice: 'Kuhifadhi mabadiliko ya Kiebrania: “yeye ... wake ... mwako ... pako ... yako.”'
  alternative: Kusawazisha viwakilishi vyote viwe vya nafsi ya pili au vyote viwe vya nafsi ya tatu.
  rationale: Mabadiliko hayo yapo katika matini ya Kiebrania na yanaweza kuwa sifa ya kishairi au kuonyesha badiliko la anayezungumziwa. Kuyasawazisha kungeondoa mvutano uliopo katika chanzo.
- issue: Utambulisho wa “watakatifu”
  choice: Kutumia neno pana “watakatifu” bila kuwataja kuwa malaika au Israeli pekee.
  alternative: Kutafsiri kwa ufafanuzi kuwa “malaika,” “watu watakatifu wa Israeli,” au kundi jingine maalumu.
  rationale: Muktadha haulazimishi utambulisho mmoja. Tafsiri pana huepuka kuingiza uamuzi wa kimafundisho ambao matini yenyewe hauelezi wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kishairi na mabadiliko ya viwakilishi yamehifadhiwa. “Wamo mkononi mwako” na “miguuni pako” ni misemo inayoeleweka kwa urahisi huku ikidumisha taswira ya chanzo.
