language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בְּכ֨וֹר שׁוֹר֜/וֹ הָדָ֣ר ל֗/וֹ וְ/קַרְנֵ֤י רְאֵם֙ קַרְנָ֔י/ו בָּ/הֶ֗ם עַמִּ֛ים יְנַגַּ֥ח יַחְדָּ֖ו אַפְסֵי אָ֑רֶץ וְ/הֵם֙ רִבְב֣וֹת אֶפְרַ֔יִם וְ/הֵ֖ם אַלְפֵ֥י מְנַשֶּֽׁה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/017.yaml
  text: His firstborn bull has majesty[a], and his horns are the horns of a wild ox; with them he will gore peoples together to the ends of the earth. These are the myriads of Ephraim[b], and these are the thousands of Manasseh.
translation:
  language: sw
  text: 'Fahali wake mzaliwa wa kwanza ana adhama;

    pembe zake ni pembe za ng’ombe-mwitu.[a]

    Kwa hizo atayagonga mataifa,

    pamoja, hadi miisho ya dunia.

    Hizo ndizo makumi ya maelfu ya Efraimu,[b]

    na hizo ndizo maelfu ya Manase.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “pembe za fahali-mwitu.” Neno la Kiebrania רְאֵם huenda linamtaja mnyama mkubwa na mwenye nguvu wa jamii ya ng’ombe, ambaye sasa ametoweka. Tafsiri za zamani zilitumia pia “nyati” au “mnyama mwenye pembe moja.”
    reason: lexical_alternative
  - marker: b
    text: Au “makumi elfu ya Efraimu.” Neno la Kiebrania kwa kawaida humaanisha makumi ya maelfu, lakini pia hutumiwa kwa idadi kubwa sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכוֹר שׁוֹרוֹ
  choice: fahali wake mzaliwa wa kwanza
  rationale: בְּכוֹר humaanisha mzaliwa wa kwanza, na שׁוֹר hapa inafaa kutafsiriwa “fahali” kwa sababu taswira ni ya mnyama wa kiume mwenye pembe na nguvu.
- source_word: הָדָר לוֹ
  choice: ni mwenye fahari
  rationale: הָדָר huonyesha fahari, adhama au uzuri wa kuvutia. Usemi huu ni wa asili katika Kiswahili na unadumisha nguvu ya kishairi ya kishazi kisicho na kitenzi katika Kiebrania.
- source_word: קַרְנֵי רְאֵם
  choice: pembe za ng’ombe-mwitu
  rationale: רְאֵם yaelekea ni mnyama mkubwa na mwenye nguvu wa jamii ya ng’ombe, huenda aurochs, wala si mnyama wa kubuniwa mwenye pembe moja. “Ng’ombe-mwitu” huepuka kuitambulisha bila uhakika kuwa nyati wa Afrika.
- source_word: קַרְנָיו
  choice: pembe zake
  rationale: Kirudiwa hiki cha umilikaji kinahifadhi ulinganisho wa moja kwa moja kati ya pembe zake na za ng’ombe-mwitu.
- source_word: יְנַגַּח
  choice: atawapiga watu kwa pembe
  rationale: נָגַח ni kitendo cha mnyama mwenye pembe kupiga au kutoboa kwa pembe. Kauli hii ni wazi na ya kawaida katika Kiswahili huku ikihifadhi taswira halisi.
- source_word: עַמִּים
  choice: watu
  rationale: Wingi huu unarejelea makundi ya watu. “Watu” huhifadhi upana wake bila kulazimisha maana ya kisiasa ya “mataifa.”
- source_word: יַחְדָּו
  choice: wote pamoja
  rationale: Usemi huu unaonyesha kwamba makundi hayo yanakusanywa kuwa shabaha moja au kushindwa kwa pamoja.
- source_word: אַפְסֵי אָרֶץ
  choice: hadi miisho ya dunia
  rationale: Hii ni nahau ya kishairi inayomaanisha maeneo ya mbali kabisa; “dunia” inafaa kuliko “nchi” kwa upeo mpana wa mstari huu.
- source_word: רִבְבוֹת
  choice: makumi ya maelfu
  rationale: רִבְבוֹת ni wingi wa makundi ya elfu kumi na pia huweza kuonyesha idadi kubwa sana. “Makumi ya maelfu” huhifadhi tofauti yake ya kimahesabu na “maelfu” ya Manase.
- source_word: אַלְפֵי
  choice: maelfu
  rationale: Ingawa אֶלֶף wakati mwingine yaweza kumaanisha kundi la ukoo, usambamba wake hapa na רִבְבוֹת unaunga mkono maana ya idadi.
- source_word: אֶפְרַיִם / מְנַשֶּׁה
  choice: Efraimu / Manase
  rationale: Haya ndiyo maumbo ya kawaida ya majina haya katika matumizi ya Biblia ya Kiswahili.
theological_decisions:
- issue: Mhusika anayewakilishwa na taswira ya fahali katika baraka ya Yosefu
  choice: Tafsiri inadumisha kiwakilishi cha nafsi ya tatu na taswira ya fahali bila kuamua wazi kama mnyama huyo anamwakilisha Yosefu kwa ujumla au Efraimu hasa.
  alternative: Kumtaja Efraimu moja kwa moja kuwa ndiye fahali mzaliwa wa kwanza.
  rationale: Baraka inaelekezwa kwa Yosefu, kisha mstari wa mwisho unahusianisha pembe na Efraimu pamoja na Manase. Kiebrania hakifafanui kabisa uhusiano huo, hivyo tafsiri haipaswi kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wenye hadhi lakini unaoeleweka kwa msomaji wa kawaida. Mistari mifupi inadumisha usambamba wa ushairi wa Kiebrania. “Fahari,” “ng’ombe-mwitu,” na “kupiga kwa pembe” huhifadhi taswira thabiti bila lugha ya kale isiyo ya lazima.
