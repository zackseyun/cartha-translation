  to: 'Fahali wake mzaliwa wa kwanza ana adhama;

    pembe zake ni pembe za ng’ombe-mwitu.[a]

    Kwa hizo atayagonga mataifa,

    pamoja, hadi miisho ya dunia.

    Hizo ndizo makumi ya maelfu ya Efraimu,[b]

