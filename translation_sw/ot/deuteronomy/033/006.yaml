  yaml_path: translation/ot/deuteronomy/033/006.yaml
  text: May Reuben live and not die[a], and may his men be few.
translation:
  language: sw
  text: Reubeni na aishi, wala asife; na watu wake wawe wachache.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na watu wake wahesabiwe.” Kiebrania cha kishazi cha mwisho ni kigumu; pia kimeeleweka kuwa ombi kwamba Reubeni asiwe asiye na umuhimu au asiondolewe katika hesabu ya makabila.
    reason: alternative_reading
lexical_decisions:
- source_word: יְחִי
  choice: na aishi
  rationale: Qal jussive ya חיה inaonyesha ombi au baraka. Muundo huu wa Kiswahili unaendeleza nguvu hiyo ya kutakia bila kuifanya kuwa amri ya moja kwa moja.
- source_word: רְאוּבֵן
  choice: Rubeni
  rationale: Jina la mtu na kabila limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: וְאַל יָמֹת
  choice: wala asife
  rationale: אַל pamoja na umbo la jussive huonyesha ombi hasi. “Wala asife” ni la kawaida na linadumisha ulinganifu na “na aishi.”
- source_word: וִיהִי
  choice: na ... wawe
  rationale: Jussive ya pili inaanzisha takwa jingine katika baraka. “Na ... wawe” hudumisha hali ya kutakia.
- source_word: מְתָיו
  choice: watu wake
  rationale: Neno hili ni gumu hapa, lakini katika muktadha linaelekea kumaanisha watu au wanaume wa kabila, si wafu. “Watu wake” ni la asili na pana katika Kiswahili.
- source_word: מִסְפָּר
  choice: wachache
  rationale: Maana ya msingi ni “idadi,” lakini pamoja na היה usemi huu huenda ukamaanisha wenye kuhesabika, yaani wachache. “Wawe wachache” ni tafsiri ya kawaida ya maana inayowezekana zaidi, huku utata ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya kishazi cha mwisho וִיהִי מְתָיו מִסְפָּר
  choice: “na watu wake wawe wachache,” yaani Rubeni aendelee kuwapo ingawa kabila lake ni dogo kwa idadi
  alternative: “na watu wake wahesabiwe,” yaani wasiondolewe katika hesabu ya makabila
  rationale: Matini ya Kimasoreti ni fupi na ngumu. Usomaji wa “wachache” unafuata kwa karibu matumizi yanayowezekana ya מִסְפָּר pamoja na היה bila kurekebisha matini. Usomaji chanya zaidi wa kuingizwa katika hesabu unawekwa katika tanbihi ili kutatua kimya kimya mvutano wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa baraka ni mfupi kama Kiebrania, huku “wala” ikiunganisha kwa kawaida ombi la kuishi na ombi hasi la kutokufa.
