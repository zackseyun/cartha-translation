id: DEU.33.10
reference: Deuteronomy 33:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: יוֹר֤וּ מִשְׁפָּטֶ֨י/ךָ֙ לְ/יַעֲקֹ֔ב וְ/תוֹרָתְ/ךָ֖ לְ/יִשְׂרָאֵ֑ל יָשִׂ֤ימוּ קְטוֹרָה֙ בְּ/אַפֶּ֔/ךָ וְ/כָלִ֖יל עַֽל מִזְבְּחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/010.yaml
  text: They will teach your judgments to Jacob and your law to Israel[b][a]; they will place incense before you and whole burnt offerings on your altar.
translation:
  language: sw
  text: 'Watafundisha Yakobo hukumu zako,

    na Israeli sheria yako[a];

    wataweka uvumba mbele zako[b],

    na sadaka inayoteketezwa kabisa juu ya madhabahu yako.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mafundisho yako.” Neno la Kiebrania תּוֹרָה linaweza kumaanisha sheria au mafundisho.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “penye pua yako” au “kwenye tundu la pua yako”; huu ni usemi unaomwelezea Mungu kwa lugha ya kibinadamu kuhusu uvumba unaotolewa mbele zake.
    reason: cultural_note
lexical_decisions:
- source_word: יוֹרוּ
  choice: Watafundisha
  rationale: Hifili ya ירה hapa humaanisha kufundisha au kuelekeza, hasa katika muktadha wa kikuhani na wa sheria.
- source_word: מִשְׁפָּטֶיךָ
  choice: hukumu zako
  rationale: Neno מִשְׁפָּט lina maana ya hukumu, maamuzi ya kisheria, au masharti. “Hukumu zako” linadumisha uzito wa kisheria na linafaa katika ushairi huu.
- source_word: לְיַעֲקֹב
  choice: Yakobo
  rationale: Kiambishi לְ kinamtambulisha mpokeaji wa mafundisho. Katika Kiswahili, kitenzi “fundisha” kinaweza kufuatwa moja kwa moja na yule anayefundishwa bila kutumia “kwa.”
- source_word: וְתוֹרָתְךָ
  choice: na sheria yako
  rationale: תּוֹרָה linaweza kumaanisha sheria au mafundisho. “Sheria” linaonyesha vizuri muktadha wa agano na ulinganifu wake na “hukumu,” huku maana mbadala ikihifadhiwa katika tanbihi.
- source_word: לְיִשְׂרָאֵל
  choice: na Israeli
  rationale: Muundo huu unadumisha ulinganifu wa kishairi kati ya Yakobo na Israeli; Kiswahili hakihitaji kihusishi kabla ya mtendwa wa kitenzi “fundisha.”
- source_word: יָשִׂימוּ
  choice: wataweka
  rationale: שׂים humaanisha kuweka au kutia. “Wataweka” ni tafsiri ya moja kwa moja na ya kawaida katika muktadha wa ibada.
- source_word: קְטוֹרָה
  choice: uvumba
  rationale: קְטוֹרָה ni uvumba unaotolewa katika ibada. “Uvumba” ni neno la kawaida na linaloeleweka katika Kiswahili.
- source_word: בְּאַפֶּךָ
  choice: mbele zako
  rationale: Kifungu hiki kihalisi kinahusisha pua au tundu la pua, lakini katika muktadha wa uvumba ni usemi wa kibinadamu kuhusu kuutoa mbele za Mungu. “Mbele zako” huwasilisha maana kwa Kiswahili cha kawaida bila kuuficha uhalisi, ambao umeelezwa katika tanbihi.
- source_word: וְכָלִיל
  choice: na sadaka inayoteketezwa kabisa
  rationale: כָּלִיל humaanisha sadaka inayoteketezwa yote madhabahuni. Tafsiri hii inaeleza wazi kuwa sadaka nzima huteketezwa bila kulazimisha idadi ya wingi ambayo haijawekwa wazi katika Kiebrania.
- source_word: עַל מִזְבְּחֶךָ
  choice: juu ya madhabahu yako
  rationale: Hii ni tafsiri ya moja kwa moja na ya asili ya kifungu kinachoonyesha mahali sadaka inapowekwa.
theological_decisions:
- issue: Maana ya תּוֹרָה katika muktadha wa agano
  choice: sheria yako
  alternative: mafundisho yako
  rationale: “Sheria” linahifadhi nguvu ya kisheria na ya kiagano ya kifungu hiki, lakini “mafundisho” pia ni maana halali ya תּוֹרָה na kwa hiyo imeonyeshwa katika tanbihi.
- issue: Usemi wa kibinadamu בְּאַפֶּךָ
  choice: mbele zako
  alternative: penye pua yako / kwenye tundu la pua yako
  rationale: Tafsiri ya neno kwa neno ingekuwa isiyo ya kawaida na ingeweza kupotosha msomaji wa Kiswahili. “Mbele zako” linaonyesha uvumba unaotolewa mbele za Mungu, huku tanbihi ikihifadhi picha halisi ya Kiebrania.
- issue: Idadi na asili ya כָּלִיל
  choice: sadaka inayoteketezwa kabisa
  alternative: sadaka zinazoteketezwa kabisa
  rationale: Nomino ya Kiebrania iko katika umoja na inaweza kutaja aina ya sadaka kwa ujumla. Umoja umehifadhiwa ili kutotatua kimyakimya uwezekano wa matumizi ya kijumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wa kishairi, na unaoeleweka kwa wasomaji wa kawaida. Mistari minne inaonyesha ulinganifu wa ushairi wa Kiebrania. “Madhabahu,” “uvumba,” na “sadaka” ni istilahi za kawaida za ibada; miundo iliyobaki imewekwa katika lugha ya kisasa bila kuondoa picha au mvutano wa matini.
