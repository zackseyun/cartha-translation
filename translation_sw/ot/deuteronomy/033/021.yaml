source:
  edition: WLC
  text: וַ/יַּ֤רְא רֵאשִׁית֙ ל֔/וֹ כִּי שָׁ֛ם חֶלְקַ֥ת מְחֹקֵ֖ק סָפ֑וּן וַ/יֵּתֵא֙ רָ֣אשֵׁי עָ֔ם צִדְקַ֤ת יְהוָה֙ עָשָׂ֔ה וּ/מִשְׁפָּטָ֖י/ו עִם יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/021.yaml
  text: He chose the best land for himself[a], because there the portion of the ruler was reserved. He came with the heads of the people; he carried out the righteousness of Yahweh[b], and his judgments with Israel.
translation:
  language: sw
  text: Alijichagulia nchi bora[a], kwa sababu huko fungu la mtawala lilikuwa limehifadhiwa. Alikuja pamoja na viongozi wa watu; alitenda haki ya Yahwe[b], na hukumu zake pamoja na Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu ya kwanza kwa ajili yake.” Pia, kishazi kinachofuata kinaweza kutafsiriwa, “kwa sababu huko fungu la mtoa sheria lilikuwa limehifadhiwa.” Neno la Kiebrania linaweza kumaanisha “mtawala” au “mtoa sheria”; wengine hulihusisha na Musa.
    reason: alternative_reading
  - marker: b
    text: Au, “hukumu ya haki ya Yahwe,” au “matendo ya haki ya Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: alijichagulia
  rationale: Kitenzi hiki ni ‘akaona’ kihalisi, lakini muundo ‘akaona kwa ajili yake’ hapa una maana ya kuchagua kwa ajili yake mwenyewe.
- source_word: רֵאשִׁית
  choice: nchi bora
  rationale: Katika muktadha wa mgao wa eneo la Gadi, neno hili linaonyesha sehemu iliyo ya kwanza kwa ubora au iliyo bora, si mwanzo wa wakati.
- source_word: חֶלְקַת
  choice: fungu
  rationale: Neno hilo linaonyesha sehemu au mgao uliotengwa, hasa wa ardhi au urithi.
- source_word: מְחֹקֵק
  choice: mtawala
  rationale: Neno linaweza kumaanisha mtawala au mtoa sheria. ‘Mtawala’ linafaa katika muktadha huu wa kishairi unaohusu eneo na uongozi, bila kumtambulisha mtu fulani.
- source_word: סָפוּן
  choice: lilikuwa limehifadhiwa
  rationale: Hali ya kutendwa inaonyesha kwamba fungu hilo lilikuwa limetengwa au kuwekwa akiba.
- source_word: וַיֵּתֵא
  choice: alikuja
  rationale: Kitenzi kinaweza kueleza kuja au kutoka; ‘alikuja’ linaendana kwa kawaida na kishazi kinachofuata kuhusu viongozi wa watu.
- source_word: רָאשֵׁי עָם
  choice: viongozi wa watu
  rationale: Ingawa ni ‘vichwa vya watu’ kihalisi, maana ya kawaida ni viongozi au wakuu wao; ‘viongozi’ ni Kiswahili cha sasa na wazi.
- source_word: צִדְקַת יְהוָה
  choice: haki ya Yahwe
  rationale: Muundo unaweza kumaanisha haki, hukumu ya haki, au matendo ya haki ya Yahwe. Tafsiri fupi ‘haki ya Yahwe’ inadumisha upana huo.
- source_word: וּמִשְׁפָּטָיו
  choice: hukumu zake
  rationale: Wingi wenye kiambishi cha nafsi unaeleza hukumu au maamuzi ya Yahwe; ‘hukumu zake’ ni tafsiri ya moja kwa moja yenye uzito unaofaa.
- source_word: עִם יִשְׂרָאֵל
  choice: pamoja na Israeli
  rationale: Kihusishi עִם kwa kawaida ni ‘pamoja na’; tafsiri hii inadumisha uwezekano kwamba Gadi alitenda kwa ushirika na Israeli.
theological_decisions:
- issue: Utambulisho na maana ya מְחֹקֵק katika חֶלְקַת מְחֹקֵק סָפוּן
  choice: Imetafsiriwa kwa ujumla kuwa ‘mtawala,’ bila kumtaja Musa.
  alternative: ‘mtoa sheria’ (labda akimaanisha Musa), au ‘kiongozi/amiri’
  rationale: Kishazi cha Kiebrania ni kifupi na kina utata. Tafsiri ya ujumla inadumisha heshima ya cheo hicho bila kuingiza utambulisho ambao maandishi yenyewe hayalazimishi.
- issue: Maana ya צִדְקַת יְהוָה
  choice: haki ya Yahwe
  alternative: ‘hukumu ya haki ya Yahwe’ au ‘matendo ya haki ya Yahwe’
  rationale: Nomino inaweza kueleza sifa ya haki au matendo yanayoidhihirisha. Maandishi makuu yanadumisha mvutano huo, huku tanbihi ikionyesha tafsiri nyingine halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Yahwe’ limetumiwa kuwakilisha jina יהוה. Viwakilishi vya umoja vimeachwa kama katika chanzo, bila kumtambulisha mhusika zaidi ya inavyoruhusu muktadha.
