  text: וְ/הָ/אִ֞ישׁ אֲשֶׁר יַעֲשֶׂ֣ה בְ/זָד֗וֹן לְ/בִלְתִּ֨י שְׁמֹ֤עַ אֶל הַ/כֹּהֵן֙ הָ/עֹמֵ֞ד לְ/שָׁ֤רֶת שָׁם֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ א֖וֹ אֶל הַ/שֹּׁפֵ֑ט וּ/מֵת֙ הָ/אִ֣ישׁ הַ/ה֔וּא וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/012.yaml
  text: But the man who acts presumptuously by not listening to the priest who stands there to minister before Yahweh your God[a], or to the judge—that man shall die[c][b]. So you shall purge the evil from Israel.
translation:
  language: sw
  text: Lakini mtu atakayetenda kwa ukaidi[a] kwa kukataa kumsikiliza[b] kuhani anayesimama huko kumhudumu Yahwe, Mungu wako[c], au mwamuzi, mtu huyo lazima afe. Hivyo utaondoa uovu kutoka Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa kiburi,” “kwa jeuri,” au “kwa makusudi.” Kirai cha Kiebrania kinaonyesha kukataa kwa makusudi na kwa ukaidi, si kushindwa kwa bahati mbaya.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa kutomtii.” Katika mazingira ya kisheria, neno la Kiebrania la “kusikiliza” mara nyingi linajumuisha maana ya kutii.
    reason: lexical_alternative
  - marker: c
    text: “Yahwe” ni uhawilishaji wa jina la Kiebrania יהוה; kwa desturi nyingine hutafsiriwa “BWANA.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָאִישׁ
  choice: Lakini mtu
  rationale: Kiunganishi וְ kinaendeleza sheria iliyotangulia huku kikionyesha hali ya mtu anayekaidi uamuzi; “Lakini” huleta utofauti huo kwa Kiswahili cha kawaida. “Mtu” ni tafsiri ya asili na ya kawaida ya אִישׁ katika sheria hii.
- source_word: יַעֲשֶׂה בְזָדוֹן
  choice: atakayefanya kwa ukaidi
  rationale: Kirai hiki kinaeleza tendo la makusudi la kujivuna na kuasi mamlaka, si kosa la bahati mbaya. “Kwa ukaidi” huwasilisha vizuri hali hiyo katika Kiswahili cha sasa.
- source_word: לְבִלְתִּי שְׁמֹעַ
  choice: kwa kutomsikiliza
  rationale: Tafsiri hii huhifadhi picha ya msingi ya שׁמע, ‘kusikia/kusikiliza,’ huku muktadha wa kisheria ukidokeza kutotii.
- source_word: הָעֹמֵד לְשָׁרֶת שָׁם
  choice: anayesimama huko kumtumikia
  rationale: “Anayesimama” huhifadhi hali ya kuhani kusimama katika wadhifa wake rasmi, na “kumtumikia” linafaa kwa huduma ya kikuhani.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni uhawilishaji wa jina la Mungu יהוה kwa tahajia ya Kiswahili, badala ya kulibadili kuwa cheo.
- source_word: אוֹ אֶל הַשֹּׁפֵט
  choice: au kwa kutomsikiliza mwamuzi
  rationale: Kitenzi kimerejelewa ili sentensi iwe wazi na ya kawaida kwa Kiswahili; שֹׁפֵט ni mwenye mamlaka ya kutoa uamuzi wa kisheria.
- source_word: וּמֵת הָאִישׁ הַהוּא
  choice: mtu huyo lazima afe
  rationale: Katika muktadha huu wa kisheria, muundo huo unaweka adhabu ya kifo. “Lazima afe” huhifadhi kauli ya Kiebrania bila kuongeza wazi namna ya utekelezaji.
- source_word: וּבִעַרְתָּ הָרָע מִיִּשְׂרָאֵל
  choice: Hivyo utaondoa uovu kutoka Israeli
  rationale: בער katika fomula hii ya Kumbukumbu la Torati humaanisha kuondoa au kutokomeza uovu kutoka katika jumuiya. “Utaondoa” ni wazi na ya kawaida, na “kutoka Israeli” huhifadhi מן.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Maana ya adhabu katika וּמֵת הָאִישׁ הַהוּא
  choice: mtu huyo lazima afe
  alternative: mtu huyo atauawa
  rationale: Muktadha unaonyesha hukumu ya kifo, lakini Kiebrania chenyewe kinasema kwamba mtu huyo atakufa. Tafsiri iliyochaguliwa huhifadhi mkazo wa kisheria bila kufafanua zaidi ya chanzo namna ya kifo.
- issue: Uovu unaoondolewa
  choice: uovu
  alternative: mtenda maovu
  rationale: Nomino הָרָע inaweza kueleweka kama ‘uovu’ au, katika fomula ya adhabu, yule aliye mwovu. “Uovu” huhifadhi umbo la jumla na mvutano wa maana wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa kisheria, wenye heshima na unaoeleweka kwa msomaji wa kawaida. Muundo wa sentensi umebaki karibu na Kiebrania, lakini kitenzi “kutomsikiliza” kimerudiwa kabla ya “mwamuzi” kwa uwazi wa Kiswahili.
