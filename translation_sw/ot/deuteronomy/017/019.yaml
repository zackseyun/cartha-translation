source:
  edition: WLC
  text: וְ/הָיְתָ֣ה עִמּ֔/וֹ וְ/קָ֥רָא ב֖/וֹ כָּל יְמֵ֣י חַיָּ֑י/ו לְמַ֣עַן יִלְמַ֗ד לְ/יִרְאָה֙ אֶת יְהוָ֣ה אֱלֹהָ֔י/ו לִ֠/שְׁמֹר אֶֽת כָּל דִּבְרֵ֞י הַ/תּוֹרָ֥ה הַ/זֹּ֛את וְ/אֶת הַ/חֻקִּ֥ים הָ/אֵ֖לֶּה לַ/עֲשֹׂתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/019.yaml
  text: And it shall be with him[a], and he shall read in it all the days of his life, so that he may learn to fear Yahweh his God, to keep all the words of this law and these statutes[c][b], to do them.
translation:
  language: sw
  text: Nayo itakuwa pamoja naye, naye ataisoma[a] siku zote za maisha yake, ili ajifunze kumcha[b] Yahweh[c] Mungu wake, kuyashika maneno yote ya sheria hii na kanuni hizi, na kuyatenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “atasoma ndani yake”; pia inaweza kueleweka, “atasoma kutoka humo.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kumstahi kwa kicho.”
    reason: lexical_alternative
  - marker: c
    text: “Yahweh” linawakilisha jina la Mungu YHWH katika Kiebrania.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיְתָה עִמּוֹ
  choice: Nayo itakuwa pamoja naye
  rationale: Kiwakilishi kinarejelea nakala ya sheria iliyotajwa katika mstari uliotangulia. Usemi huu unadumisha wazo la kuwa nayo karibu na kupatikana kwake daima.
- source_word: וְקָרָא בוֹ
  choice: naye ataisoma
  rationale: Kiswahili cha kawaida husema ‘kuisoma’ nakala au kitabu. Kihusishi cha Kiebrania בּוֹ, yaani kwa neno ‘ndani yake,’ kimehifadhiwa katika tanbihi kama maana halisi na mbadala unaowezekana.
- source_word: כָּל יְמֵי חַיָּיו
  choice: siku zote za maisha yake
  rationale: Huhifadhi msisitizo na mwendo wa usemi wa Kiebrania unaomaanisha muda wote wa maisha.
- source_word: לְמַעַן יִלְמַד
  choice: ili ajifunze
  rationale: ‘Ili’ huonyesha kusudi la kusoma, kama inavyofanya לְמַעַן katika Kiebrania.
- source_word: לְיִרְאָה אֶת יְהוָה אֱלֹהָיו
  choice: kumcha Yahwe Mungu wake
  rationale: ‘Kumcha’ huhifadhi maana pana ya ירא, inayojumuisha hofu, kicho na unyenyekevu wa utiifu mbele za Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kama jina binafsi ‘Yahwe’ katika umbo linalofaa tahajia ya Kiswahili.
- source_word: לִשְׁמֹר
  choice: kuyashika
  rationale: Katika muktadha wa agano na sheria, שׁמר humaanisha kuyatunza au kuyatii maagizo; ‘kuyashika’ ni usemi wa kawaida wa kibiblia na unaeleweka.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: maneno yote ya sheria hii
  rationale: ‘Sheria’ inafaa muktadha wa kisheria wa Kumbukumbu la Torati, huku ‘maneno yote’ ikihifadhi muundo na upeo wa Kiebrania.
- source_word: הַחֻקִּים הָאֵלֶּה
  choice: masharti haya
  rationale: ‘Masharti’ ni neno la sasa na linaloeleweka kwa חֻקִּים kama maagizo yaliyowekwa kisheria.
- source_word: לַעֲשֹׂתָם
  choice: na kuyatenda
  rationale: Huhifadhi kitenzi halisi ‘kutenda/kufanya’ na kuonyesha kwamba kuyashika kunahitaji utekelezaji.
theological_decisions:
- issue: Namna ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuingiza fasiri ya kimadhehebu.
- issue: Maana ya ירא katika muktadha wa agano
  choice: kumcha
  alternative: kumstahi
  rationale: ‘Kumcha’ huhifadhi mvutano wa kimaandiko kati ya hofu, kicho, heshima na utiifu; ‘kumstahi’ peke yake inaweza kupunguza uzito huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umewekwa karibu na Kiebrania bila kulazimisha usemi usio wa kawaida; tanbihi zinahifadhi maana halisi au mbadala muhimu.
