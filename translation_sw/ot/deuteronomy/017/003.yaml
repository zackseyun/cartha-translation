  yaml_path: translation/ot/deuteronomy/017/003.yaml
  text: and goes and serves other gods and bows down to them[a], or to the sun or to the moon or to all the host of heaven, which I have not commanded[b],
translation:
  language: sw
  text: naye akaenda, akatumikia miungu mingine na kuzisujudia, au kusujudia jua, au mwezi, au jeshi lote la mbinguni[a]—ambalo sikuliamuru[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa ukaribu zaidi, “jeshi lote la mbinguni.” Usemi huu unaweza kumaanisha mkusanyiko wa miili ya angani, na katika baadhi ya miktadha unaweza pia kudokeza viumbe vya mbinguni.
    reason: lexical_alternative
  - marker: b
    text: Kishazi “ambalo sikuliamuru” kinaweza kurejelea hasa “jeshi lote la mbinguni,” au kwa upana zaidi tendo lote la kutumikia na kusujudia miungu mingine.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: Katika muktadha huu wa sharti la kisheria, umbo hili linaendeleza matendo ya mtu anayetajwa katika mstari uliotangulia; wakati wa usimulizi wa Kiswahili kwa kutumia ‘aka-’ ni wa kawaida na unaunganisha matendo hayo.
- source_word: וַיַּעֲבֹד
  choice: akaitumikia
  rationale: ‘Kuitumikia’ huhifadhi maana ya msingi ya עבד na hapa inaeleweka kuwa huduma ya kidini, huku kitenzi kinachofuata kikionyesha wazi tendo la kusujudu.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Hii ndiyo maana ya moja kwa moja; ‘miungu ya kigeni’ ingeongeza wazo la kikabila ambalo halijaelezwa wazi katika neno אֲחֵרִים.
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: na kuisujudia
  rationale: ‘Kusujudia’ huonyesha tendo la kuinama chini kwa ibada na kulitofautisha na maana pana ya ‘kutumikia.’ Kiambishi ‘i-’ kinarejelea ‘miungu.’
- source_word: וְלַשֶּׁמֶשׁ א֣וֹ לַיָּרֵחַ
  choice: au kulisujudia jua, mwezi
  rationale: Kurudia ‘kusujudia’ hufanya uhusiano wa kisarufi uwe wazi kwa Kiswahili. ‘Au’ huendeleza orodha ya vitu vinavyoabudiwa; matumizi ya koma kabla ya ‘mwezi’ ni ya asili kuliko kurudia kihusishi katika kila sehemu.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: jeshi lote la mbinguni
  rationale: Huhifadhi taswira ya pamoja ya צבא bila kuamua kupita kiasi ikiwa kinachokusudiwa ni miili ya angani, viumbe vya mbinguni, au vyote; muktadha wa jua na mwezi unapendelea miili ya angani.
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: ambalo sikuliamuru
  rationale: Hufuata kwa karibu kauli ya Kiebrania ya kutokuwepo kwa amri, bila kuibadili kuwa kitenzi tofauti cha ‘kukataza.’ Uhusiano wa karibu na ‘jeshi’ unabaki wazi huku tanbihi ikieleza uwezekano wa wigo mpana zaidi.
theological_decisions:
- issue: Wigo wa kishazi אֲשֶׁר לֹא צִוִּיתִי
  choice: Kishazi kimetafsiriwa kwa namna inayoweza kuhusishwa moja kwa moja na ‘jeshi lote la mbinguni,’ bila kuficha kwamba kinaweza pia kukataa tendo lote la ibada ya sanamu.
  alternative: Kukifanya kieleze wazi tendo lote kwa kusema ‘jambo ambalo sikuliamuru.’
  rationale: Katika Kiebrania, kishazi husimama karibu zaidi na ‘jeshi lote la mbinguni,’ lakini muktadha unaweza kukipa wigo wa ibada yote iliyotajwa. Tafsiri na tanbihi zinahifadhi mvutano huo badala ya kuutatua kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. ‘Kusujudia’ ni neno la kawaida la kidini linalohifadhi tendo la kimwili la kuinama kwa ibada. Alama zote za tanbihi zimewekwa katika matini kuu.
