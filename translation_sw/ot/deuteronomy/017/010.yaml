  text: וְ/עָשִׂ֗יתָ עַל פִּ֤י הַ/דָּבָר֙ אֲשֶׁ֣ר יַגִּ֣ידֽוּ לְ/ךָ֔ מִן הַ/מָּק֣וֹם הַ/ה֔וּא אֲשֶׁ֖ר יִבְחַ֣ר יְהוָ֑ה וְ/שָׁמַרְתָּ֣ לַ/עֲשׂ֔וֹת כְּ/כֹ֖ל אֲשֶׁ֥ר יוֹרֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/010.yaml
  text: You shall act according to the word that they declare to you from that place which Yahweh will choose[a], and you shall be careful to do according to all that they instruct you.
translation:
  language: sw
  text: Nawe utatenda kulingana na neno[a] watakalokutangazia kutoka mahali pale atakapopachagua Yahweh; nawe utakuwa mwangalifu kutenda kulingana na yote watakayokuelekeza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na uamuzi watakaokutangazia.” Neno la Kiebrania דָּבָר linaweza kumaanisha “neno,” “jambo,” au “uamuzi” katika muktadha wa kisheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Nawe utatenda
  rationale: Kitenzi עשה ni kipana, kikimaanisha ‘kufanya’ au ‘kutenda.’ Katika muktadha huu wa kisheria, ‘utatenda’ linaonyesha kuchukua hatua kwa mujibu wa uamuzi wenye mamlaka.
- source_word: עַל פִּי הַדָּבָר
  choice: kulingana na neno
  rationale: Nahau עַל־פִּי humaanisha ‘kulingana na’ au ‘kwa mamlaka ya.’ Neno דָּבָר linaweza kumaanisha ‘neno,’ ‘jambo,’ au, katika muktadha wa hukumu, ‘uamuzi’; tafsiri kuu inahifadhi picha ya Kiebrania, huku tanbihi ikionyesha maana mbadala.
- source_word: יַגִּידוּ לְךָ
  choice: watakalokutangazia
  rationale: Hifili ya נגד humaanisha kutangaza au kujulisha. ‘Kutangazia’ linafaa kwa taarifa rasmi yenye mamlaka katika muktadha wa makuhani na mwamuzi.
- source_word: מִן הַמָּקוֹם הַהוּא אֲשֶׁר יִבְחַר יְהוָה
  choice: kutoka mahali pale ambapo Yahweh atapachagua
  rationale: ‘Mahali pale’ linadumisha urejeo wa mahali maalumu, na ‘atapachagua’ linaonyesha vizuri mwelekeo wa wakati ujao wa יבחר katika mazingira ya Kumbukumbu la Torati.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetolewa kwa namna ya ‘Yahweh,’ badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: nawe utakuwa mwangalifu kutenda
  rationale: Muundo שׁמר pamoja na kitenzi-jina unaonyesha uangalifu katika kutekeleza; ‘utakuwa mwangalifu kutenda’ ni Kiswahili wazi chenye nguvu ya wajibu.
- source_word: כְּכֹל אֲשֶׁר
  choice: kulingana na yote
  rationale: Kifungu hiki kinaonyesha utii kamili kwa maagizo yaliyotolewa; ‘kulingana na yote’ ni sahihi na ya kawaida.
- source_word: יוֹרוּךָ
  choice: watakayokuelekeza
  rationale: Hifili ya ירה inaweza kumaanisha kufundisha, kuelekeza, au kutoa maagizo. ‘Kuelekeza’ linatunza maana ya mwongozo wa kisheria bila kuufanya muktadha uwe wa darasani pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Matini ina jina יהוה moja kwa moja. ‘Yahweh’ linahifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya דָּבָר katika uamuzi wa kisheria
  choice: neno
  alternative: uamuzi
  rationale: ‘Neno’ linahifadhi upana na picha ya Kiebrania, lakini muktadha wa kesi unaruhusu pia maana ya ‘uamuzi’; utata huo halisi umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. Sentensi inadumisha sauti ya lazima ya sheria na urudiaji wa ‘kulingana na’ uliopo katika matini ya Kiebrania.
