  text: עַל פִּ֨י הַ/תּוֹרָ֜ה אֲשֶׁ֣ר יוֹר֗וּ/ךָ וְ/עַל הַ/מִּשְׁפָּ֛ט אֲשֶׁר יֹאמְר֥וּ לְ/ךָ֖ תַּעֲשֶׂ֑ה לֹ֣א תָס֗וּר מִן הַ/דָּבָ֛ר אֲשֶׁר יַגִּ֥ידֽוּ לְ/ךָ֖ יָמִ֥ין וּ/שְׂמֹֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/011.yaml
  text: According to the instruction that they give you[a], and according to the judgment that they tell you, you shall do; you shall not turn aside from the word that they declare to you[b], to the right or to the left.
translation:
  language: sw
  text: Utafanya sawasawa na maagizo watakayokupa[a] na hukumu watakayokuambia. Usikengeuke kulia wala kushoto kutoka katika neno watakalokujulisha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “sheria” au “mafundisho” badala ya “maagizo” (Kiebrania: torah).'
    reason: lexical_alternative
  - marker: b
    text: Au “jambo” au “uamuzi” badala ya “neno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: sawasawa na
  rationale: Nahau hii ina maana ya kutenda kwa kufuata au kupatana na jambo lililotajwa, si kutaja kinywa kihalisi.
- source_word: הַתּוֹרָה
  choice: maagizo
  rationale: Katika muktadha huu wa mahakama, neno torah linamaanisha maelekezo yenye mamlaka yanayotolewa kwa kesi husika. “Maagizo” ni ya kawaida na huepuka kulifanya neno hili limaanishe tu sheria iliyoandikwa.
- source_word: אֲשֶׁר יוֹרוּךָ
  choice: watakayokupa
  rationale: Kitenzi hiki hapa humaanisha kuelekeza au kufundisha. Pamoja na “maagizo,” usemi “watakayokupa” ni wa asili katika Kiswahili.
- source_word: הַמִּשְׁפָּט
  choice: hukumu
  rationale: Katika muktadha wa kisheria, mishpat ni hukumu au uamuzi wa mahakama; “hukumu” inadumisha uzito wa kisheria.
- source_word: אֲשֶׁר יֹאמְרוּ לְךָ
  choice: watakayokuambia
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya usemi wa Kiebrania unaomaanisha kusema au kumwambia mtu.
- source_word: תַּעֲשֶׂה
  choice: utafanya
  rationale: Wakati ujao katika muktadha huu una nguvu ya amri; “utafanya” hudumisha mtindo wa sheria bila kuongeza maneno yasiyokuwapo.
- source_word: לֹא תָסוּר
  choice: usigeuke
  rationale: Kitenzi kinamaanisha kugeuka au kukengeuka, na kinaendana na picha inayofuata ya kulia na kushoto.
- source_word: הַדָּבָר
  choice: neno
  rationale: Dabar linaweza kumaanisha neno, jambo, au uamuzi. “Neno” linadumisha usemi wa umoja na uzito wa tamko, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: אֲשֶׁר יַגִּידוּ לְךָ
  choice: watakalokujulisha
  rationale: Kitenzi hiki humaanisha kutangaza, kueleza, au kujulisha. “Kujulisha” kinafaa kwa tamko rasmi na pia kinatofautisha kitenzi hiki na “watakayokuambia” kilichotangulia.
- source_word: יָמִין וּשְׂמֹאל
  choice: kwenda kulia wala kushoto
  rationale: Hii ni nahau ya kutokengeuka upande wowote; Kiswahili hiki kinahifadhi picha ya mwelekeo na kukamilisha kitenzi “usigeuke.”
theological_decisions:
- issue: Upeo wa wajibu wa kutii mamlaka ya kikuhani au ya mahakama
  choice: Mstari unaamuru kufuata maagizo na hukumu yenye mamlaka iliyotolewa katika shauri husika.
  alternative: Kuufanya mstari huu uwe dai la mamlaka kamili na isiyoweza kukosea ya taasisi za baadaye.
  rationale: Muktadha unahusu utaratibu wa mahakama wa Israeli chini ya agano. Tafsiri inadumisha nguvu ya amri bila kuingiza madai ya baadaye ya kitaasisi ambayo hayajasemwa katika Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Maagizo watakayokupa” ni usemi wa kawaida unaofaa muktadha wa kisheria; sentensi mbili fupi zinahifadhi nguvu ya amri na kufanya mstari ueleweke kwa urahisi.
