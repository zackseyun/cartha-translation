  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: עַל פִּ֣י שְׁנַ֣יִם עֵדִ֗ים א֛וֹ שְׁלֹשָׁ֥ה עֵדִ֖ים יוּמַ֣ת הַ/מֵּ֑ת לֹ֣א יוּמַ֔ת עַל פִּ֖י עֵ֥ד אֶחָֽד־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/006.yaml
  text: On the testimony of two witnesses or three witnesses[a], the one to die shall be put to death[b]; he shall not be put to death on the testimony of one witness.
translation:
  language: sw
  text: Kwa ushahidi wa mashahidi wawili au mashahidi watatu[a], yule anayepaswa kufa atauawa[b]. Hatauawa kwa ushahidi wa shahidi mmoja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kwa kinywa cha mashahidi wawili au mashahidi watatu.” Nahau hiyo ya Kiebrania humaanisha ushahidi wa kisheria.
    reason: lexical_alternative
  - marker: b
    text: Au, “yule atakayekufa”; yaani, mtu ambaye adhabu ya kifo inamhusu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי
  choice: kwa ushahidi wa
  rationale: Nahau ya Kiebrania, kihalisi ‘kwa kinywa cha,’ hapa humaanisha ushahidi wa kisheria. ‘Kwa ushahidi wa’ ni Kiswahili cha kawaida na wazi katika muktadha wa hukumu.
- source_word: שְׁנַיִם עֵדִים ... שְׁלֹשָׁה עֵדִים
  choice: mashahidi wawili au mashahidi watatu
  rationale: Kurudia neno ‘mashahidi’ baada ya kila idadi kunadumisha mtindo rasmi wa kisheria wa Kiebrania na kunasikika kwa kawaida katika Kiswahili.
- source_word: יוּמַת
  choice: atauawa
  rationale: Hofali ya מות ina maana ya kusababisha kwa hali tendwa, yaani ‘kuuawa,’ si kufa tu. Katika muktadha huu inaelekeza kwenye kutekelezwa kwa hukumu ya kifo.
- source_word: הַמֵּת
  choice: yule anayestahili kufa
  rationale: Kirai hiki cha kishiriki chenye kibainishi ni kifupi na chenye ugumu fulani. Hapa humrejelea mtu aliye chini ya hukumu inayoweza kumfanya auawe, si mtu ambaye tayari amekufa. ‘Anayestahili kufa’ huwasilisha uwajibikaji wa kisheria bila kutumia neno pana zaidi ‘aliyehukumiwa.’
- source_word: לֹא יוּמַת
  choice: asiuawe
  rationale: Muundo huu unatoa katazo la kisheria kwa kitenzi kilekile. ‘Asiuawe’ ni wa kawaida, wenye uzito, na unadumisha maana ya hali tendwa.
- source_word: עֵד אֶחָד
  choice: shahidi mmoja
  rationale: Tafsiri ya moja kwa moja inayodumisha ulinganifu na ‘mashahidi wawili’ na ‘mashahidi watatu.’
theological_decisions:
- issue: Mrejeleo na nguvu ya הַמֵּת katika sheria kuhusu hukumu ya kifo
  choice: yule anayestahili kufa
  alternative: yule atakayekufa; mtu aliyehukumiwa kifo; mtu aliyekufa
  rationale: Mstari unaweka kiwango cha ushahidi kinachohitajika kabla ya kutekeleza hukumu ya kifo. ‘Mtu aliyekufa’ haipatani na muktadha, ilhali ‘mtu aliyehukumiwa kifo’ huingiza hitimisho la mahakama kwa uwazi zaidi ya Kiebrania. ‘Yule anayestahili kufa’ huhifadhi mwelekeo wa kisheria na ufupi wa usemi wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisheria ulio wazi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Urudiaji wa ‘mashahidi’ umehifadhiwa ili kuakisi mkazo rasmi wa chanzo. ‘Atauawa’ na ‘asiuawe’ zinadumisha hali tendwa ya hukumu bila kutumia istilahi nzito zaidi ya kiufundi.
