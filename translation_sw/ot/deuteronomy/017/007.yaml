  text: יַ֣ד הָ/עֵדִ֞ים תִּֽהְיֶה בּ֤/וֹ בָ/רִאשֹׁנָה֙ לַ/הֲמִית֔/וֹ וְ/יַ֥ד כָּל הָ/עָ֖ם בָּ/אַחֲרֹנָ֑ה וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/007.yaml
  text: The hand of the witnesses shall be first against him to put him to death[a], and afterward the hand of all the people[b]. So you shall purge the evil from your midst.
translation:
  language: sw
  text: Mkono wa mashahidi utakuwa wa kwanza dhidi yake ili kumwua, kisha mkono wa watu wote.[a] Hivyo utaondoa uovu katikati yako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mkono wa mashahidi … na mkono wa watu wote.” Huu ni usemi wa kisheria unaowapa mashahidi wajibu wa kwanza katika kutekeleza hukumu.
    reason: cultural_note
  - marker: b
    text: Au, “miongoni mwako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַד
  choice: mkono
  rationale: Imehifadhi nomino ya Kiebrania katika umoja. Katika sheria hii, “mkono” unaonyesha uwajibikaji na ushiriki katika kutekeleza hukumu, si kiungo cha mwili pekee.
- source_word: הָעֵדִים
  choice: mashahidi
  rationale: Neno hili linamaanisha mashahidi katika kesi ya kisheria, si washtaki tu.
- source_word: בּוֹ
  choice: dhidi yake
  rationale: Pamoja na “mkono” katika muktadha wa adhabu, kauli hii inaonyesha tendo linaloelekezwa kwa mtu aliyehukumiwa.
- source_word: בָרִאשֹׁנָה
  choice: utakaokuwa wa kwanza
  rationale: Inaonyesha kwamba mashahidi wanapaswa kuanza kutekeleza hukumu.
- source_word: לַהֲמִיתוֹ
  choice: ili kumwua
  rationale: Hiphil ya מות humaanisha kusababisha mtu afe; “kumwua” ni wazi na linafaa katika muktadha huu wa hukumu ya kifo.
- source_word: וְיַד כָּל הָעָם
  choice: kisha mkono wa watu wote
  rationale: Muundo wa Kiebrania na taswira ya “mkono” zimehifadhiwa, huku “kisha” ikionyesha kuwa jumuiya inashiriki baada ya mashahidi.
- source_word: בָאַחֲרֹנָה
  choice: kisha
  rationale: Hutoa kwa kawaida mpangilio unaolingana na kitendo cha mashahidi kuwa cha kwanza.
- source_word: וּבִעַרְתָּ
  choice: utaondoa
  rationale: Katika kanuni za kisheria za Kumbukumbu la Torati, kitenzi hiki humaanisha kuondoa kabisa jambo ovu katika jumuiya, wala si kuliteketeza kihalisi.
- source_word: הָרָע
  choice: uovu
  rationale: Imehifadhi kauli pana ya Kiebrania bila kuibana ili imaanishe mkosaji peke yake.
- source_word: מִקִּרְבֶּךָ
  choice: katikati yako
  rationale: Inahifadhi usemi wa agano unaoelekeza kwa jumuiya iliyowakilishwa kwa nafsi ya pili umoja.
theological_decisions:
- issue: Maana ya kauli ya kisheria וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Hivyo utaondoa uovu katikati yako
  alternative: Hivyo utamwondoa mwovu miongoni mwako
  rationale: Kiebrania kinasema “uovu,” si “mwovu.” Tafsiri hii inadumisha upana wa kauli hiyo, inayohusu kuondolewa kwa uovu katika jumuiya kwa njia ya hukumu ya haki, bila kuifasiri kuwa inamtaja mkosaji peke yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa msomaji wa kawaida. Umoja wa “mkono” na kauli “katikati yako” zimehifadhiwa kwa sababu ni sehemu za mtindo wa Kiebrania; maelezo mafupi yanafafanua pale ambapo usemi unaweza kuwa usio wa kawaida kwa Kiswahili.
