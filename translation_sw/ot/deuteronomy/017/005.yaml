base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/005.yaml
  text: then you shall bring out to your gates that man or that woman who did this evil thing[a], that man or that woman, and you shall stone them with stones[b], and they shall die.
translation:
  language: sw
  text: Kisha utamtoa nje hadi kwenye malango yako[a] mwanamume huyo au mwanamke huyo aliyefanya jambo hili ovu[b]—mwanamume huyo au mwanamke huyo—nawe utawapiga kwa mawe, nao watakufa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Malango yako” yanamaanisha malango ya mji, yaliyokuwa mahali pa kawaida pa hukumu ya hadharani na mashauri ya kisheria katika Israeli ya kale.
    reason: cultural_note
  - marker: b
    text: Au “suala hili ovu.” Neno la Kiebrania linaweza kumaanisha “jambo” au “suala,” hasa katika muktadha wa kisheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתָ
  choice: Kisha utamtoa nje
  rationale: Waw ikifuatiwa na kitenzi katika muktadha huu wa sheria inaonyesha hatua inayofuata katika utaratibu. “Kisha” huwasilisha mfuatano huo, na “utamtoa nje” hudumisha maana ya moja kwa moja ya kitenzi.
- source_word: הָאִישׁ ... הָאִשָּׁה
  choice: mwanamume huyo au mwanamke huyo
  rationale: Muundo wa Kiebrania unawataja wazi mwanamume na mwanamke na kuonyesha mtu maalumu kwa kiashiria; tafsiri hii inadumisha jinsia zote mbili na umaalumu huo.
- source_word: אֲשֶׁר עָשׂוּ
  choice: aliyefanya
  rationale: Kiswahili hutumia umoja kwa njia ya kawaida baada ya mbadala wa “mwanamume ... au mwanamke,” ingawa Kiebrania kina umbo la wingi linalowahusisha wote kama kundi la uwezekano.
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: jambo hili ovu
  rationale: “Jambo” linaweza kuwakilisha דָּבָר katika muktadha wa kisheria, na “ovu” linaonyesha רָע bila kuongeza ukali usiotajwa katika chanzo.
- source_word: אֶל שְׁעָרֶיךָ
  choice: hadi kwenye malango yako
  rationale: Wingi “malango” unafuata umbo la Kiebrania. Maana ya kihistoria ya malango kama mahali pa hukumu inaelezwa katika tanbihi badala ya kuingizwa kama ufafanuzi ndani ya mstari.
- source_word: וּסְקַלְתָּם בָּאֲבָנִים
  choice: nawe utawapiga kwa mawe
  rationale: Hii ni njia ya kawaida na iliyo wazi katika Kiswahili ya kueleza kuwaua kwa kuwapiga mawe, huku “kwa mawe” likihifadhi kutajwa wazi kwa nyenzo hiyo katika Kiebrania.
- source_word: וָמֵתוּ
  choice: nao watakufa
  rationale: Tafsiri hii inadumisha matokeo yaliyotajwa moja kwa moja na uzito wa lugha ya kisheria bila kuongeza kusudi au sharti lisilo wazi katika Kiebrania.
theological_decisions:
- issue: Namna ya kisheria inayotaja jinsia
  choice: mwanamume huyo au mwanamke huyo
  alternative: mtu huyo
  rationale: Kiebrania kinawataja wazi wakosaji wa kiume na wa kike; tafsiri haifuti utofauti huo kwa kutumia neno lisiloonyesha jinsia.
- issue: Mahali pa hukumu katika malango
  choice: kwenye malango yako
  alternative: mahali pa hukumu ya umma
  rationale: Maandishi yanataja malango kihalisi. Tafsiri inadumisha taswira hiyo ya chanzo na kutoa maelezo ya kitamaduni katika tanbihi.
- issue: Matokeo ya adhabu
  choice: nao watakufa
  alternative: ili wafe
  rationale: Kiunganishi cha Kiebrania kinaweza kueleweka kama matokeo katika mfuatano. “Nao watakufa” huepuka kuamua kwamba kifungu hicho kinaeleza kusudi badala ya matokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya kisheria lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya “mwanamume huyo au mwanamke huyo” yamedumishwa kwa sababu yanasisitizwa katika Kiebrania; vistari virefu vinayaweka wazi bila kufanya sentensi iwe ngumu kupita kiasi. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayofafanuliwa.
