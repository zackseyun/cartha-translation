revisions:
- from: Na atakapoketi juu ya kiti cha enzi cha ufalme wake, atapaswa kujiandikia kitabuni nakala ya sheria hii, kutokana na ile iliyo mbele ya makuhani Walawi[a][b].
  to: Na atakapoketi juu ya kiti cha enzi cha ufalme wake, atapaswa kujiandikia katika kitabu nakala ya sheria hii kwa kufuata nakala iliyo mbele ya makuhani Walawi[a][b].
  rationale: Marekebisho yanaondoa kiwakilishi kisichoeleweka na kuonyesha uhusiano wa 'kutoka mbele ya makuhani' na nakala ya kielelezo. Ufafanuzi huu unaungwa mkono na muktadha na trail ya Kiingereza, lakini tanbihi bado hutofautisha ufafanuzi wa uangalizi wa makuhani na usemi wa msingi wa Kiebrania. Alama za tanbihi zimehifadhiwa na zimewekwa baada ya 'makuhani Walawi,' ambako kifungu kinachohusika hukamilika.
