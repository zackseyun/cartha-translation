  text: וְ/הָיָ֣ה כְ/שִׁבְתּ֔/וֹ עַ֖ל כִּסֵּ֣א מַמְלַכְתּ֑/וֹ וְ/כָ֨תַב ל֜/וֹ אֶת מִשְׁנֵ֨ה הַ/תּוֹרָ֤ה הַ/זֹּאת֙ עַל סֵ֔פֶר מִ/לִּ/פְנֵ֥י הַ/כֹּהֲנִ֖ים הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/018.yaml
  text: And when he sits on the throne of his kingdom[a], he shall write for himself in a book a copy of this law[b], from before the Levitical priests.
translation:
  language: sw
  text: Na atakapoketi juu ya kiti cha enzi cha ufalme wake, atapaswa kujiandikia katika kitabu nakala ya sheria hii kwa kufuata nakala iliyo mbele ya makuhani Walawi[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana iliyo wazi zaidi, “kwa kufuata nakala iliyohifadhiwa mbele ya makuhani Walawi,” yaani kielelezo rasmi kilichokuwa chini ya uangalizi wao.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “makuhani, Walawi”; kwa kawaida hutafsiriwa “makuhani Walawi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְשִׁבְתּוֹ
  choice: Na atakapoketi
  rationale: Muundo huu unaanzisha hali ya wakati katika agizo la kisheria. “Atakapoketi” ni Kiswahili cha kawaida na huhifadhi maana ya ‘wakati anapoketi’ bila kuifanya kwa lazima kuwa siku ya kutawazwa.
- source_word: עַל כִּסֵּא מַמְלַכְתּוֹ
  choice: juu ya kiti cha enzi cha ufalme wake
  rationale: Huhifadhi taswira halisi ya kiti cha enzi na uhusiano wake na ufalme wa mfalme.
- source_word: וְכָתַב לוֹ
  choice: atapaswa kujiandikia
  rationale: Katika muktadha huu wa sheria, kitenzi kinaendeleza agizo. “Atapaswa” huonyesha wajibu, na “kujiandikia” huonyesha kwamba nakala ni kwa matumizi yake mwenyewe.
- source_word: מִשְׁנֵה
  choice: nakala
  rationale: Katika muktadha huu neno linamaanisha nakala au mfano wa pili wa maandishi, si kurudiwa kwa maneno tu.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: sheria hii
  rationale: “Sheria” linafaa kwa mkusanyo wa maagizo ya agano unaozungumziwa hapa bila kudai kwa lazima upeo mpana zaidi wa kikanoni.
- source_word: עַל סֵפֶר
  choice: kitabuni
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la kuandika katika kitabu au hati; katika mazingira ya kale kitu hicho huenda kilikuwa hati ya kukunjwa.
- source_word: מִלִּפְנֵי
  choice: kutokana na ile iliyo mbele ya
  rationale: Huhifadhi kwa kiasi kikubwa usemi wa Kiebrania ‘kutoka mbele ya’ huku kiwakilishi “ile” kikielekeza kwa nakala iliyotumiwa kuwa kielelezo. Tanbihi inaeleza maana inayowezekana ya kuwa chini ya uangalizi wa makuhani.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: makuhani Walawi
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba makuhani hao ni Walawi, huku mgawanyo halisi wa Kiebrania ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Upeo wa תּוֹרָה katika sheria inayomhusu mfalme
  choice: sheria hii
  alternative: mafundisho haya; Torati hii
  rationale: Muktadha wa karibu ni agizo la kisheria kuhusu nakala ya mkusanyo wa sheria za agano. “Sheria hii” inafaa bila kufafanua kimadhehebu upeo wake wa kikanoni.
- issue: Maana ya kifungu kinachohusisha uangalizi wa makuhani
  choice: kutokana na ile iliyo mbele ya makuhani Walawi
  alternative: kutokana na nakala iliyohifadhiwa na makuhani Walawi; mbele ya makuhani Walawi
  rationale: Kiebrania kinaweza kuonyesha kielelezo kilichokuwa mbele ya makuhani au chini ya uangalizi wao. Tafsiri kuu huhifadhi mvutano huo, na tanbihi hutoa maana iliyo wazi zaidi bila kuiingiza kimya kimya katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kisheria umehifadhiwa kwa “atapaswa,” huku sentensi ikibaki ya asili katika Kiswahili. “Kitabuni” linatumika kwa ufupi; tanbihi haziongezi dai la kimadhehebu.
