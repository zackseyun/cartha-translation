base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/002.yaml
  text: If there is found among you[a], within one of your gates that Yahweh your God is giving you, a man or a woman who does what is evil in the eyes of Yahweh your God by transgressing his covenant[b],
translation:
  language: sw
  text: Kama miongoni mwako, katika mojawapo ya malango yako[a] ambayo Yahwe Mungu wako anakupa, akipatikana mwanamume au mwanamke afanyaye maovu machoni pa Yahwe Mungu wako kwa kulikiuka agano lake[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika mojawapo ya miji yako.” Kwa maana halisi, “katika mojawapo ya malango yako”; hapa “malango” yanaweza kurejelea miji au maeneo ya mamlaka ya mji.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa kulivunja agano lake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִמָּצֵא
  choice: Ikiwa atapatikana
  rationale: Muundo huu unaanzisha sharti la kisheria na kuhifadhi hali ya kutendwa ya kitenzi cha Kiebrania kwa Kiswahili cha kawaida.
- source_word: בְקִרְבְּךָ
  choice: katikati yako
  rationale: Huhifadhi wazo la kuwapo ndani ya jumuiya inayosemeshwa kwa umoja.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: katika mojawapo ya miji yako
  rationale: Ingawa maana halisi ni ‘katika mojawapo ya malango yako,’ katika Kumbukumbu la Torati ‘malango’ hutumiwa kumaanisha miji au maeneo yaliyo chini ya mamlaka ya mji. ‘Miji’ ni wazi na ya kawaida katika Kiswahili, huku maana halisi ikihifadhiwa katika tanbihi.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: ambayo Yahwe Mungu wako anakupa
  rationale: ‘Anakupa’ huonyesha tendo linaloendelea la kishirikishi cha Kiebrania na kuhifadhi kauli ya agano.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: mwanamume au mwanamke
  rationale: Huhifadhi kwa uwazi jozi ya jinsia iliyotajwa katika matini chanzi.
- source_word: אֲשֶׁר יַעֲשֶׂה אֶת־הָרַע
  choice: anayefanya yaliyo maovu
  rationale: Ni Kiswahili cha kawaida kinachohifadhi uzito wa kimaadili wa nahau ya Kiebrania ‘kufanya yaliyo maovu.’
- source_word: בְּעֵינֵי יְהוָה אֱלֹהֶיךָ
  choice: machoni pa Yahwe Mungu wako
  rationale: Huhifadhi sitiari ya Kiebrania ya tathmini ya Mungu kwa njia inayoeleweka katika Kiswahili.
- source_word: לַעֲבֹר בְּרִיתוֹ
  choice: kwa kulikiuka agano lake
  rationale: ‘Kulikiuka’ huwasilisha kuvuka mipaka au masharti ya agano bila kuongeza kosa mahususi ambalo linaelezwa katika mstari unaofuata.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina binafsi la Mungu kama linavyoonekana katika matini ya Kiebrania.
theological_decisions:
- issue: Asili ya lugha ya kukiuka agano
  choice: kwa kulikiuka agano lake
  alternative: kwa kulivunja agano lake
  rationale: Mstari huu unaeleza kosa kwa jumla kama ukiukaji wa agano, bila kutaja bado sharti mahususi lililokiukwa. Tafsiri haileti mapema maelezo ya mstari unaofuata wala mfumo fulani wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sharti na koma ya mwisho vimehifadhiwa kwa sababu sentensi inaendelea katika mistari inayofuata. Viambishi vya nafsi ya pili vya umoja vinahifadhi namna Israeli inavyosemeshwa kama jumuiya moja.
