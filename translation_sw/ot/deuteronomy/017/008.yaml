source:
  edition: WLC
  text: כִּ֣י יִפָּלֵא֩ מִמְּ/ךָ֨ דָבָ֜ר לַ/מִּשְׁפָּ֗ט בֵּֽין דָּ֨ם לְ/דָ֜ם בֵּֽין דִּ֣ין לְ/דִ֗ין וּ/בֵ֥ין נֶ֨גַע֙ לָ/נֶ֔גַע דִּבְרֵ֥י רִיבֹ֖ת בִּ/שְׁעָרֶ֑י/ךָ וְ/קַמְתָּ֣ וְ/עָלִ֔יתָ אֶל הַ/מָּק֔וֹם אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/008.yaml
  text: If a matter for judgment is too difficult for you—between bloodshed and bloodshed[a], between one legal claim and another, and between one injury and another[d][c][b], matters of dispute within your gates—then you shall arise and go up to the place that Yahweh your God will choose.
translation:
  language: sw
  text: Ikiwa shauri la hukumu ni gumu mno kwako—iwe ni kutofautisha kati ya kesi moja ya umwagaji damu na nyingine[a], kati ya dai moja la kisheria na jingine[b], au kati ya jeraha moja na jingine[c]—mambo ya mabishano katika malango yako[d], basi simama, uende juu mpaka mahali ambapo Yahweh Mungu wako atachagua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kati ya damu na damu.” Kauli hii inahusu kutofautisha kesi mbalimbali za umwagaji damu, huenda zikiwemo kesi za mauaji au hatia ya damu.'
    reason: lexical_alternative
  - marker: b
    text: Au “kati ya kesi moja ya kisheria na nyingine.”
    reason: lexical_alternative
  - marker: c
    text: Au “kati ya pigo moja na jingine,” “dhiki moja na nyingine,” au “ugonjwa mmoja na mwingine.”
    reason: lexical_alternative
  - marker: d
    text: “Katika malango yako” humaanisha katika mahakama za miji yako, kwa kuwa malango ya mji yalikuwa mahali pa kawaida pa kutoa hukumu.
    reason: cultural_note
lexical_decisions:
- source_word: יִפָּלֵא
  choice: ni gumu mno kwako
  rationale: Katika muktadha wa hukumu, kitenzi hiki kinaonyesha jambo lililo nje ya uwezo wa mwamuzi kuliamua, si jambo la kushangaza.
- source_word: דָבָר לַמִּשְׁפָּט
  choice: jambo la kuhukumiwa
  rationale: Huhifadhi upana wa דָבָר huku ikionyesha wazi kuwa ni shauri linalohitaji uamuzi wa kisheria.
- source_word: בֵּין דָּם לְדָם
  choice: kati ya kesi moja ya umwagaji damu na nyingine
  rationale: Hufafanua nahau halisi ‘kati ya damu na damu’ kama utofautishaji wa kesi zinazohusu mauaji au hatia ya damu, bila kuifinya iwe aina moja tu ya kosa.
- source_word: בֵּין דִּין לְדִין
  choice: kati ya dai moja la kisheria na jingine
  rationale: דִּין inaweza kumaanisha dai, kesi, au hukumu; ‘dai la kisheria’ linafaa katika orodha hii na linatofautisha kipengele hiki na jambo la jumla la kuhukumiwa.
- source_word: וּבֵין נֶגַע לָנֶגַע
  choice: kati ya jeraha moja na jingine
  rationale: ‘Jeraha’ linafaa kwa muktadha wa mashauri ya mahakamani, huku tanbihi ikihifadhi uwezekano wa maana za pigo, dhiki, au ugonjwa.
- source_word: דִּבְרֵי רִיבֹת
  choice: mambo ya mabishano
  rationale: Ni Kiswahili cha kawaida kinachoonyesha migogoro yenye utata inayohitaji uamuzi.
- source_word: בִּשְׁעָרֶיךָ
  choice: katika malango yako
  rationale: Huhifadhi taswira ya malango ya mji, yaliyokuwa mahali pa kawaida pa kusikilizia mashauri; maana ya kitamaduni imefafanuliwa katika tanbihi.
- source_word: וְקַמְתָּ וְעָלִיתָ
  choice: ondoka uende juu
  rationale: Hutoa mwito wa kuchukua hatua na kuhifadhi wazo la kwenda juu kuelekea mahali pa kati, kwa Kiswahili cha kawaida.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: mahali ambapo ... atachagua
  rationale: Wakati ujao unalingana na mtazamo wa Kumbukumbu la Torati kuelekea mahali ambalo bado litateuliwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova au BWANA
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja; ‘Yahweh’ huhifadhi jina hilo la agano bila kulibadilisha kuwa cheo.
- issue: Upeo wa נֶגַע katika orodha ya kisheria
  choice: jeraha, huku maana nyingine zikihifadhiwa katika tanbihi
  alternative: dhiki, pigo, au ugonjwa
  rationale: Muktadha wa kisheria unaunga mkono ‘jeraha,’ lakini neno la Kiebrania lina upeo mpana usiopaswa kufutwa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha umewekwa wazi kwa ‘iwe ... au,’ huku taswira ya kisheria na ya mahali ya Kiebrania ikihifadhiwa.
