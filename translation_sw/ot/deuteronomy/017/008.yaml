  verdict: revise
  source_fidelity: 'Rasimu inawakilisha kwa uaminifu maana ya msingi ya Kiebrania: shauri lililo gumu kwa mamlaka ya mahali, aina tatu za mabishano, malango kama eneo la mamlaka ya mji, na kwenda juu mahali atakapochagua Yahweh. Hata hivyo, “yaani” hufanya “mambo ya mabishano katika malango yako” ionekane kuwa ufafanuzi wa lazima wa orodha iliyotangulia, ilhali katika Kiebrania ni mwendelezo wa usemi wa kisheria. Marekebisho yanaondoa uongezaji huo na kuboresha mwito wa mwisho.'
