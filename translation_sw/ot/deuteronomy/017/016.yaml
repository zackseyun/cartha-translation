  text: רַק֮ לֹא יַרְבֶּה לּ֣/וֹ סוּסִים֒ וְ/לֹֽא יָשִׁ֤יב אֶת הָ/עָם֙ מִצְרַ֔יְמָ/ה לְמַ֖עַן הַרְבּ֣וֹת ס֑וּס וַֽ/יהוָה֙ אָמַ֣ר לָ/כֶ֔ם לֹ֣א תֹסִפ֗וּ/ן לָ/שׁ֛וּב בַּ/דֶּ֥רֶךְ הַ/זֶּ֖ה עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/016.yaml
  text: Only[a], he must not multiply horses for himself, nor cause the people to return to Egypt in order to multiply horses, since Yahweh has said to you[c][b], ‘You must never return again by this way.’
translation:
  language: sw
  text: Lakini asijiongezee farasi wengi[a], wala asiwarudishe watu Misri[b] ili kuongeza farasi, kwa maana Yahweh aliwaambia, “Msirudi tena kamwe kwa njia hii.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “asijikusanyie farasi wengi.” Kitenzi cha Kiebrania kinamaanisha kufanya wawe wengi au kuongeza.
    reason: lexical_alternative
  - marker: b
    text: 'Au, “asisababishe watu warudi Misri.” Kitenzi cha Kiebrania kiko katika kauli ya kusababisha: mfalme anakatazwa kuwarudisha watu huko.'
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “Msiongeze kurudi kwa njia hii tena,” nahau yenye maana ya “Msirudi tena kamwe kwa njia hii.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Lakini
  rationale: Katika muktadha huu neno hilo linaanzisha sharti linaloweka mpaka kwa mwenendo wa mfalme; “Lakini” ni ya kawaida katika Kiswahili na huhifadhi nguvu ya kizuizi.
- source_word: יַרְבֶּה לּוֹ סוּסִים
  choice: asijiongezee farasi wengi
  rationale: Kauli hii huhifadhi maana ya kuongeza au kufanya wawe wengi, huku “-ji-” ikiwakilisha לּוֹ, yaani kujikusanyia kwa manufaa yake mwenyewe.
- source_word: וְלֹא יָשִׁיב אֶת הָעָם מִצְרַיְמָה
  choice: wala asiwarudishe watu Misri
  rationale: “Asiwarudishe” ni kausativi ya asili katika Kiswahili na inaonyesha kwamba mfalme asisababishe watu warudi Misri.
- source_word: לְמַעַן הַרְבּוֹת סוּס
  choice: ili kuongeza idadi ya farasi
  rationale: “Ili” huonyesha kusudi, na “kuongeza idadi” huwasilisha kwa uwazi wazo la kufanya farasi wawe wengi.
- source_word: וַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja kama “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: לֹא תֹסִפוּן לָשׁוּב ... עוֹד
  choice: Msirudi tena kamwe
  rationale: Muundo wa Kiebrania wa “kutoongeza kurudi” pamoja na עוֹד ni nahau inayokataza kurudia tendo; “tena kamwe” huonyesha uzito huo kwa Kiswahili cha kawaida.
- source_word: בַּדֶּרֶךְ הַזֶּה
  choice: kwa njia hii
  rationale: “Njia” inaweza kumaanisha njia au mkondo wa safari na ni tafsiri ya kawaida ya דֶּרֶךְ katika muktadha huu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina יהוה lenyewe; “Yahwe” hulihifadhi kama jina maalumu la agano bila kulibadilisha kuwa cheo.
- issue: Maana ya kurudi Misri
  choice: asiwarudishe watu Misri
  alternative: asiwapeleke watu tena Misri
  rationale: Kauli ya kausativi katika Kiebrania inakataza mfalme kusababisha watu warudi. Tafsiri haiongezi dai kwamba kila safari ya mtu binafsi kwenda Misri imekatazwa, bali huhifadhi uhusiano wa mfalme, watu, na biashara ya farasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa amri umetolewa kwa hali ya kutegemea “asi-,” inayofaa kwa masharti yanayomhusu mfalme. Marudio ya wazo la kuongeza farasi yamehifadhiwa, ingawa sehemu ya pili imeelezwa kama “kuongeza idadi” ili iwe ya kawaida zaidi.
