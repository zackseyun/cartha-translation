base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/009.yaml
  text: And you shall come to the Levitical priests and to the judge who is in office in those days[a], and you shall inquire, and they shall declare to you the decision in the case.
translation:
  language: sw
  text: Nawe utawaendea makuhani Walawi na mwamuzi atakayekuwapo siku hizo, nawe utauliza, nao watakutangazia uamuzi wa kesi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata umbo la Kiebrania kwa karibu zaidi, “neno la hukumu.” Usemi wa Kiebrania unarejelea uamuzi wenye mamlaka uliotolewa katika kesi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: Nawe utawaendea
  rationale: Katika agizo hili la kisheria, umbo hili lina nguvu ya maagizo ya wakati ujao. “Utawaendea” linaeleza kwa kawaida mwendo wa kwenda kwa mamlaka iliyowekwa.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: makuhani Walawi
  rationale: Kirai hiki kinawatambulisha makuhani kuwa wa kabila la Lawi bila kudokeza kwamba Walawi wote walikuwa makuhani.
- source_word: הַשֹּׁפֵט
  choice: mwamuzi
  rationale: Neno hili humaanisha afisa mwenye jukumu la kutoa hukumu katika muktadha wa kisheria.
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: atakayekuwapo siku hizo
  rationale: Tafsiri hii inamhusu mwenye kushika wadhifa huo wakati husika bila kuongeza waziwazi dhana ya “kuwa madarakani,” ambayo haijasemwa moja kwa moja katika Kiebrania.
- source_word: וְדָרַשְׁתָּ
  choice: nawe utauliza
  rationale: Katika muktadha huu, kitenzi kinaeleza kutafuta maelekezo au uamuzi wenye mamlaka; “utauliza” ni Kiswahili cha kawaida na kinachofaa katika utaratibu huu.
- source_word: וְהִגִּידוּ לְךָ
  choice: nao watakutangazia
  rationale: Hiphil ya נגד inaonyesha kuwasilisha rasmi uamuzi; “watakutangazia” hudumisha uzito wa kisheria kuliko “watakuambia.”
- source_word: דְּבַר הַמִּשְׁפָּט
  choice: uamuzi wa kesi
  rationale: Kihalisi ni “neno/jambo la hukumu.” Katika muktadha huu kinarejelea uamuzi rasmi wa mahakama; tafsiri hii hutoa maana hiyo kwa Kiswahili cha sasa huku tanbihi ikihifadhi umbo rasmi zaidi.
