  text: And all the people shall hear and fear[a], and shall not act presumptuously again.
translation:
  language: sw
  text: Na watu wote watasikia na kuogopa, wala hawatatenda tena kwa kiburi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala hawatatenda tena kwa jeuri” au “wala hawataendelea tena kutenda kwa majivuno.” Kitenzi cha Kiebrania kinaonyesha ukaidi wa makusudi wenye kiburi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָעָם
  choice: Na watu wote
  rationale: Maandishi yanasema moja kwa moja ‘watu wote’ bila kurudia ‘wa Israeli’; ‘Na’ linahifadhi kiunganishi cha Kiebrania.
- source_word: יִשְׁמְעוּ
  choice: watasikia
  rationale: Kitenzi שמע kwa kawaida humaanisha ‘kusikia’; hapa watu watasikia habari ya hukumu iliyotekelezwa.
- source_word: וְיִרָאוּ
  choice: na kuogopa
  rationale: Tafsiri hii inahifadhi maana ya hofu bila kutaja kitu kinachoogopwa, kwa kuwa Kiebrania hakitaji wazi ikiwa ni Mungu, adhabu, au vyote viwili.
- source_word: וְלֹא יְזִידוּן
  choice: wala hawatatenda ... kwa kiburi
  rationale: Hifili ya זיד hueleza tendo la makusudi lenye kiburi, jeuri, au ukaidi; usemi huu wa Kiswahili unaonyesha kwamba si hisia ya ndani tu bali ni mwenendo wa ukaidi.
- source_word: עוֹד
  choice: tena
  rationale: Neno hili linaonyesha kwamba mwenendo huo hautarudiwa; ‘tena’ ni ya kawaida na wazi katika Kiswahili cha sasa.
theological_decisions:
- issue: Asili au kitu cha hofu inayotokana na hukumu
  choice: ‘kuogopa’ bila kutaja wanayemwogopa au wanachokiogopa
  alternative: ‘kumwogopa Bwana’ au ‘kuogopa adhabu’
  rationale: Kiebrania hakina yambwa baada ya kitenzi ‘kuogopa’; tafsiri inadumisha utata huo badala ya kuufafanua zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. ‘Watatenda kwa kiburi’ limetumiwa kuwasilisha mwenendo wa makusudi wa ukaidi bila kuingiza maelezo ya kimadhehebu.
