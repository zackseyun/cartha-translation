base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/001.yaml
  text: You shall not sacrifice to Yahweh your God an ox or a sheep that has in it a blemish[a], any bad thing, for that is an abomination to Yahweh your God.
translation:
  language: sw
  text: Usimtolee Yahwe Mungu wako dhabihu ya ng’ombe wala kondoo[a], mnyama mwenye dosari—jambo lolote baya—kwa maana mnyama huyo ni chukizo kwa Yahwe Mungu wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania שֶׂה lina maana pana zaidi na linaweza kumaanisha kondoo au mbuzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְבַּח
  choice: kumtolea dhabihu
  rationale: Katika muktadha huu wa ibada, kitenzi hiki kinamaanisha kumtoa mnyama kama dhabihu, si kumchinja tu.
- source_word: לַיהוָה
  choice: kwa Yahwe / kumtolea Yahwe
  rationale: Kiambishi ל־ kinaonyesha anayepokea dhabihu; muundo wa Kiswahili ‘kumtolea Yahwe’ ni wa kawaida na unaeleza uhusiano huo wazi.
- source_word: שׁוֹר
  choice: ng’ombe
  rationale: Neno hili linataja mnyama mmoja wa jamii ya ng’ombe bila kulazimisha jinsia ambayo mstari hauitaji hapa.
- source_word: שֶׂה
  choice: kondoo
  rationale: ‘Kondoo’ ni tafsiri fupi na ya kawaida katika lugha ya mifugo na dhabihu; kwa kuwa neno la Kiebrania linaweza pia kumaanisha mbuzi, upana huo umehifadhiwa katika tanbihi.
- source_word: מוּם
  choice: dosari
  rationale: ‘Dosari’ linaonyesha kasoro inayomfanya mnyama asifae kutolewa dhabihu, bila kuibana kuwa aina moja tu ya ulemavu.
- source_word: כֹּל דָּבָר רָע
  choice: jambo lolote baya
  rationale: Tafsiri hii inahifadhi upana na ukali wa maneno ya Kiebrania badala ya kuyafafanua kimya kimya kuwa ‘kasoro kubwa’; kirai hiki kinaeleza zaidi dosari iliyotajwa.
- source_word: תוֹעֲבַת
  choice: chukizo
  rationale: ‘Chukizo’ ni neno la Kiswahili lenye uzito unaofaa kwa kitu kinachokataliwa kabisa mbele za Mungu katika muktadha wa ibada.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; ‘Yahwe’ hulitofautisha na cheo ‘Bwana’ bila kuingiza tafsiri ya kimadhehebu.
- issue: Kiima cha הוּא katika kauli ya mwisho
  choice: huyo ni chukizo
  alternative: hilo ni chukizo
  rationale: Kiwakilishi cha Kiebrania ni cha kiume katika umoja na kinaweza kurejelea mnyama mwenye dosari; ‘huyo’ huhifadhi rejeo hilo, ingawa kimantiki tendo au sadaka hiyo pia inaweza kueleweka kuwa chukizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Muundo wa katazo ni wa moja kwa moja. Kirai ‘jambo lolote baya’ kimeachwa kwa upana wake ili kutatua kimya kimya maana ya Kiebrania, huku tanbihi ikihifadhi upana wa שֶׂה.
