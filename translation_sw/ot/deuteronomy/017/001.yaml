  naturalness: Marekebisho yanatumia “wala” katika katazo na “mnyama huyo” ili kufanya uhusiano wa kisarufi na wa maana uwe wazi, bila kuongeza tafsiri ya kiteolojia. Kirai “jambo lolote baya” kinahifadhiwa kwa sababu kinaakisi upana wa כֹּל דָּבָר רָע, ingawa kimewekwa kwa alama ya mkato ili kieleweke kama ufafanuzi wa dosari.
  terminology: “Yahwe,” “kumtolea dhabihu,” “ng’ombe,” “kondoo,” “dosari,” na “chukizo” zinafaa kwa Kiswahili Sanifu cha Afrika Mashariki na kwa muktadha wa dhabihu. Tanbihi ya שֶׂה inahifadhi kwa usahihi uwezekano wa “mbuzi.”
