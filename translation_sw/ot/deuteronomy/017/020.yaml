source:
  edition: WLC
  text: לְ/בִלְתִּ֤י רוּם לְבָב/וֹ֙ מֵֽ/אֶחָ֔י/ו וּ/לְ/בִלְתִּ֛י ס֥וּר מִן הַ/מִּצְוָ֖ה יָמִ֣ין וּ/שְׂמֹ֑אול לְמַעַן֩ יַאֲרִ֨יךְ יָמִ֧ים עַל מַמְלַכְתּ֛/וֹ ה֥וּא וּ/בָנָ֖י/ו בְּ/קֶ֥רֶב יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/020.yaml
  text: so that his heart may not be lifted up above his brothers[a], and so that he may not turn aside from the commandment to the right or to the left, in order that he may prolong his days in his kingdom, he and his sons, in the midst of Israel.
translation:
  language: sw
  text: ili moyo wake usijiinue juu ya ndugu zake[a], wala asikengeuke kutoka katika amri kwenda kulia au kushoto, kusudi aishi siku nyingi katika ufalme wake, yeye na wanawe, katikati ya Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “juu ya Waisraeli wenzake.” Kiebrania kinasema “juu ya ndugu zake,” kikitumia lugha ya undugu wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבִלְתִּי רוּם לְבָבוֹ
  choice: ili moyo wake usijiinue
  rationale: Muundo huu unaonyesha kusudi la kuzuia jambo; ‘moyo wake usijiinue’ huhifadhi nahau ya Kiebrania ya kiburi kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: מֵאֶחָיו
  choice: juu ya ndugu zake
  rationale: Huhifadhi lugha ya moja kwa moja ya undugu wa agano na wazo la mfalme kujiona mkuu kuliko wenzake.
- source_word: סוּר מִן הַמִּצְוָה
  choice: asikengeuke kutoka katika amri
  rationale: ‘Kukengeuka’ ni usemi wa kawaida unaofaa kwa kuacha njia ya utii; umoja wa ‘amri’ umehifadhiwa.
- source_word: יָמִין וּשְׂמֹאול
  choice: kwenda kulia au kushoto
  rationale: Huhifadhi sitiari ya Kiebrania ya kupotoka upande wowote huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: לְמַעַן
  choice: kusudi
  rationale: Huonyesha matokeo yanayokusudiwa kwa ufupi na kwa uwazi.
- source_word: יַאֲרִיךְ יָמִים
  choice: aishi siku nyingi
  rationale: Hutoa maana ya nahau ya kurefusha siku kwa Kiswahili cha asili bila kupoteza wazo la maisha marefu.
- source_word: עַל מַמְלַכְתּוֹ
  choice: katika ufalme wake
  rationale: Katika muktadha huu inaeleza kudumu katika utawala wake; ‘katika ufalme wake’ huhifadhi uwezekano wa maana ya eneo au kipindi cha kutawala bila kuifanya sentensi kuwa nzito.
- source_word: הוּא וּבָנָיו
  choice: yeye na wanawe
  rationale: Kiebrania kinataja wana wa kiume moja kwa moja katika muktadha wa urithi wa kifalme; tafsiri hailipanui kuwa ‘wazao’.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: katikati ya Israeli
  rationale: Huhifadhi nahau ya mahali na mazingira ya jumuiya ya agano.
theological_decisions:
- issue: Lugha ya undugu yenye jinsia katika sheria ya mfalme
  choice: ndugu zake
  alternative: Waisraeli wenzake
  rationale: Neno la Kiebrania ni ‘ndugu zake’ na hutumia undugu wa agano. Maana pana ya watu wenzake wa Israeli imeelezwa katika tanbihi badala ya kubadili maandishi.
- issue: Maneno ya ahadi kuhusu nasaba ya kifalme
  choice: yeye na wanawe
  alternative: yeye na wazao wake
  rationale: Chanzo kinataja wana moja kwa moja. ‘Wazao’ kingekuwa ufafanuzi mpana kuliko umbo la kileksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Nahau kuu za Kiebrania zimehifadhiwa pale zinapokuwa wazi, huku ‘aishi siku nyingi’ ikitumika badala ya tafsiri ngumu ya neno kwa neno.
