  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הֻֽגַּד לְ/ךָ֖ וְ/שָׁמָ֑עְתָּ וְ/דָרַשְׁתָּ֣ הֵיטֵ֔ב וְ/הִנֵּ֤ה אֱמֶת֙ נָכ֣וֹן הַ/דָּבָ֔ר נֶעֶשְׂתָ֛ה הַ/תּוֹעֵבָ֥ה הַ/זֹּ֖את בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/004.yaml
  text: and it is reported to you[a], and you hear of it, and you investigate thoroughly, and behold, it is true and certain that this abomination has been done in Israel,
translation:
  language: sw
  text: 'na ukiambiwa habari hiyo, nawe ukaisikia, uchunguze kwa makini. Na tazama, ni kweli, jambo hilo limethibitishwa[a]: chukizo hili limefanywa katika Israeli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jambo hilo ni la kweli na hakika.”
    reason: Njia mbadala ya kuakisi kwa karibu muundo wa kauli ya Kiebrania אֱמֶת נָכוֹן הַדָּבָר.
lexical_decisions:
- source_word: וְהֻגַּד לְךָ
  choice: na ukiambiwa habari hiyo
  rationale: Kauli ya kutendwa ya נגד inaonyesha kwamba taarifa inafikishwa kwa mhusika. Muundo wa ‘ukiambiwa’ unafaa muktadha wa sharti la kisheria, huku ‘habari hiyo’ ikibainisha kitu kilichodokezwa na muktadha bila kuongeza wazo jipya.
- source_word: וְשָׁמָעְתָּ
  choice: nawe ukaisikia
  rationale: שמע humaanisha ‘kusikia.’ Kiwakilishi cha kitu katika ‘ukaisikia’ kinarejelea taarifa iliyotangulia na kinafanya Kiswahili kiwe cha kawaida na wazi.
- source_word: וְדָרַשְׁתָּ הֵיטֵב
  choice: uchunguze kwa makini
  rationale: Katika mazingira ya hukumu, דרש ni kufanya uchunguzi, na הֵיטֵב husisitiza ukamilifu au uangalifu wa uchunguzi. ‘Kwa makini’ ni usemi wa sasa na wa kawaida unaohifadhi uzito huo.
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: הִנֵּה huvuta fikira kwenye matokeo ya uchunguzi. ‘Tazama’ huhifadhi msisitizo na hadhi ya usemi wa Kiebrania.
- source_word: אֱמֶת
  choice: ni kweli
  rationale: Neno hili linatumika kiarifu kuhusu jambo lililoripotiwa; ‘ni kweli’ ni Kiswahili cha kawaida kinachothibitisha ukweli wa taarifa.
- source_word: נָכוֹן הַדָּבָר
  choice: jambo hilo limethibitishwa
  rationale: נָכוֹן huonyesha jambo lililo imara au lililothibitishwa. Tafsiri hii inaweka wazi uthibitisho wa kisheria bila kuunganisha maana yake kabisa na אֱמֶת.
- source_word: נֶעֶשְׂתָה
  choice: limefanywa
  rationale: Kauli ya kutendwa ya עשה inasema kwamba tendo hilo kwa kweli limetendwa. ‘Limefanywa’ huhifadhi kauli ya kutendwa na hali ya tendo lililokamilika.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: chukizo hili
  rationale: תּוֹעֵבָה ni neno lenye hukumu kali ya kimaadili na ya agano. ‘Chukizo’ huhifadhi uzito huo katika Kiswahili cha kibiblia kinachoeleweka.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: Kirai hiki kinaweka kosa ndani ya jumuiya ya Israeli; ‘katika Israeli’ ni tafsiri ya moja kwa moja na iliyo wazi.
theological_decisions:
- issue: Namna ya kutafsiri kauli ya uthibitisho wa kisheria אֱמֶת נָכוֹן הַדָּבָר
  choice: ni kweli, jambo hilo limethibitishwa
  alternative: jambo hilo ni la kweli na hakika
  rationale: Tafsiri iliyochaguliwa inadumisha vipengele viwili vya Kiebrania—ukweli na uthabiti uliothibitishwa—na inaonyesha mazingira ya uchunguzi wa kisheria bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Namna ya kutafsiri תּוֹעֵבָה
  choice: chukizo
  alternative: jambo la kuchukiza
  rationale: ‘Chukizo’ linahifadhi hukumu kali ya kimaadili ya neno katika Kumbukumbu la Torati, bila kuipunguza wala kuiongezea maana ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ‘ukiambiwa … ukaisikia, uchunguze’ unaonyesha mfuatano wa sharti la kisheria; alama ya nukta mbili inaunganisha uthibitisho na maelezo ya kosa.
