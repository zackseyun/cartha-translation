reference: Deuteronomy 17:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: שׂ֣וֹם תָּשִׂ֤ים עָלֶ֨י/ךָ֙ מֶ֔לֶךְ אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּ֑/וֹ מִ/קֶּ֣רֶב אַחֶ֗י/ךָ תָּשִׂ֤ים עָלֶ֨י/ךָ֙ מֶ֔לֶךְ לֹ֣א תוּכַ֗ל לָ/תֵ֤ת עָלֶ֨י/ךָ֙ אִ֣ישׁ נָכְרִ֔י אֲשֶׁ֥ר לֹֽא אָחִ֖י/ךָ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/015.yaml
  text: You shall surely set over yourself a king whom Yahweh your God chooses[a]. From among your brothers you shall set a king over yourself; you may not put over yourself a foreigner[b], one who is not your brother.
translation:
  language: sw
  text: Ni lazima umweke juu yako mfalme ambaye Yahweh Mungu wako atamchagua. Utamweka juu yako mfalme kutoka miongoni mwa ndugu zako[a]. Huruhusiwi kumweka juu yako mtu wa kigeni[b], ambaye si ndugu yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu zako” hapa ni lugha ya kindugu inayomaanisha watu wenzako wa Israeli, yaani watu wa taifa lako.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa neno moja moja ni “mtu wa kigeni”; kifungu kinachofuata kinamfafanua kuwa mtu ambaye si ndugu yako.
    reason: alternative_reading
lexical_decisions:
- source_word: שׂוֹם תָּשִׂים
  choice: Ni lazima umweke
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichonyambuliwa unasisitiza amri. “Ni lazima umweke” huwasilisha msisitizo huo kwa Kiswahili cha kawaida na chenye nguvu.
- source_word: עָלֶיךָ
  choice: juu yako
  rationale: Hudumisha picha ya kumweka mtawala juu ya Israeli; kiambishi cha nafsi ya pili umoja kinawakilisha taifa linaloambiwa kwa umoja.
- source_word: מֶלֶךְ
  choice: mfalme
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa cheo hiki.
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: ambaye Yahweh Mungu wako atamchagua
  rationale: Kitenzi kisichotimilika katika sheria hii kinaelekea kwenye uchaguzi utakaofanywa; wakati ujao ni wa kawaida na wazi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano la Mungu limetafsiriwa kwa kulinakili, badala ya kulibadilisha kuwa cheo.
- source_word: מִקֶּרֶב אַחֶיךָ
  choice: kutoka miongoni mwa ndugu zako
  rationale: Hudumisha lugha ya kindugu ya Kiebrania huku ikieleza kwa Kiswahili cha kawaida kwamba mfalme atoke ndani ya watu wa Israeli.
- source_word: לֹא תוּכַל לָתֵת
  choice: Huruhusiwi kumweka
  rationale: Ingawa maana ya neno kwa neno ni “hutaweza kumweka,” katika muktadha huu wa sheria usemi huo una nguvu ya marufuku; “Huruhusiwi” huwasilisha kazi hiyo kwa uwazi.
- source_word: אִישׁ נָכְרִי
  choice: mtu wa kigeni
  rationale: “Mtu wa kigeni” hudumisha nomino אִישׁ na sifa נָכְרִי, na ni wazi zaidi hapa kuliko “mgeni,” ambalo pia linaweza kumaanisha mtu aliyekuja kutembelea.
- source_word: אֲשֶׁר לֹא אָחִיךָ הוּא
  choice: ambaye si ndugu yako
  rationale: Hudumisha maelezo ya Kiebrania kwa kutumia lugha ileile ya udugu wa agano.
theological_decisions:
- issue: Uwasilishaji wa jina la agano יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; “Yahweh” hulihifadhi kwa unukuzi wa kawaida wa kitaaluma.
- issue: Lugha ya kindugu אַחֶיךָ / אָחִיךָ
  choice: ndugu zako / ndugu yako
  alternative: Waisraeli wenzako / mmoja wa watu wako
  rationale: Tafsiri hii hudumisha sitiari halisi ya undugu na mvutano wake wa kiagano; tanbihi inafafanua kwamba inawahusu watu wa Israeli.
- issue: Nguvu ya לֹא תוּכַל katika sheria
  choice: Huruhusiwi
  alternative: Hutaweza
  rationale: Katika muktadha wa maagizo, usemi huo unafanya kazi kama marufuku, si taarifa ya kutokuwa na uwezo wa kimwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wa sasa na unaoeleweka. Mfuatano wa sentensi umehifadhi urudiaji wa “kumweka juu yako” na tofauti kati ya “ndugu” na “mtu wa kigeni.”
