  yaml_path: translation/ot/deuteronomy/017/017.yaml
  text: And he shall not multiply wives for himself[a], lest his heart turn away; and he shall not greatly multiply silver and gold for himself.
translation:
  language: sw
  text: Wala asijiongezee wake wengi; moyo wake usije ukapotoka[a]; wala asijiongezee mno fedha na dhahabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala moyo wake usipotoke.” Kiebrania kinaweza kueleweka kuwa hili ni katazo jingine linalofuatana na la kwanza, badala ya kuwa onyo la wazi kuhusu kusudi au matokeo.
    reason: alternative_reading
lexical_decisions:
- source_word: יַרְבֶּה
  choice: asijiongezee
  rationale: Hifili ya רבה inaonyesha kuongeza au kujikusanyia kwa wingi. “Asijiongezee” ni ya asili katika Kiswahili na inaweza kutumika katika sehemu zote mbili za mstari, hivyo inadumisha urudiaji wa Kiebrania.
- source_word: נָשִׁים
  choice: wake wengi
  rationale: Katika masharti yanayomhusu mfalme, נָשִׁים inamaanisha wake, si wanawake kwa ujumla. Neno “wengi” linaweka wazi wazo la kujiongezea idadi.
- source_word: יָסוּר
  choice: usije ukapotoka
  rationale: סור humaanisha kugeuka kando au kupotoka. “Usije ukapotoka” huhifadhi picha hiyo na kuonyesha onyo la matokeo yanayoweza kutokea bila kuongeza kitu ambacho moyo ungekiacha.
- source_word: לְבָבוֹ
  choice: moyo wake
  rationale: “Moyo” ni istilahi ya kawaida ya Biblia kwa kitovu cha nia, maamuzi na tamaa za ndani, na huhifadhi picha ya Kiebrania.
- source_word: כֶּסֶף וְזָהָב
  choice: fedha na dhahabu
  rationale: Tafsiri hii inahifadhi majina halisi ya madini na jozi ya kawaida ya Kiebrania bila kuyafanya kwa ujumla kuwa “mali” au “utajiri.”
- source_word: מְאֹד
  choice: mno
  rationale: “Mno” ni neno fupi, la kawaida na lenye heshima linalosisitiza kujilimbikizia kupita kiasi.
theological_decisions:
- issue: Uhusiano kati ya kujiongezea wake na kupotoka kwa moyo
  choice: 'Kishazi cha kati kimetafsiriwa kama onyo kuhusu matokeo ya katazo la kwanza: “moyo wake usije ukapotoka.”'
  alternative: “wala moyo wake usipotoke,” kama katazo jingine linaloratibiwa na la kwanza.
  rationale: Muundo wa Kiebrania unaweza kueleweka ama kama onyo la kusudi/matokeo ama kama katazo linalofuatana na la kwanza. Matini kuu inaonyesha uhusiano unaowezekana wa matokeo, huku tanbihi ikihifadhi usomaji wa katazo linaloratibiwa. Hakijaongezwa kitu kama “kumwacha BWANA,” kwa kuwa hakitajwi wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya kisheria yenye heshima lakini inayoeleweka kwa msomaji wa kawaida. Urudiaji wa “asijiongezee” unadumisha mlingano wa Kiebrania, na “usije ukapotoka” huhifadhi sitiari ya moyo bila ufafanuzi wa kimadhehebu.
