  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּֽי תָבֹ֣א אֶל הָ/אָ֗רֶץ אֲשֶׁ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ נֹתֵ֣ן לָ֔/ךְ וִֽ/ירִשְׁתָּ֖/הּ וְ/יָשַׁ֣בְתָּה בָּ֑/הּ וְ/אָמַרְתָּ֗ אָשִׂ֤ימָה עָלַ/י֙ מֶ֔לֶךְ כְּ/כָל הַ/גּוֹיִ֖ם אֲשֶׁ֥ר סְבִיבֹתָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/014.yaml
  text: When you come into the land that Yahweh your God is giving you[a], and you take possession of it and live in it, and you say, “I will set a king over myself, like all the nations that are around me,”
translation:
  language: sw
  text: Utakapoingia katika nchi ambayo Yahweh Mungu wako anakupa, na kuimiliki na kukaa humo, kisha ukasema, “Nitamweka mfalme juu yangu,[a] kama mataifa yote yanayonizunguka,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nitamteua mfalme anitawale.” Kiebrania husema kihalisi, “Nitamweka mfalme juu yangu.”
    reason: Toleo hili linaonyesha tafsiri ya kiutendaji zaidi ya אָשִׂימָה עָלַי מֶלֶךְ huku likieleza muundo halisi wa Kiebrania.
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: Utakapoingia
  rationale: Katika muktadha huu כִּי inaanzisha hali ya wakati inayotarajiwa, na בוא pamoja na אֶל הָאָרֶץ ina maana ya kuingia katika nchi.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika Kumbukumbu la Torati neno hili linarejelea nchi wanayopewa Israeli; “nchi” ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Muundo huu una kiambishi cha nafsi ya pili, umoja, na unaonyesha uhusiano wa agano.
- source_word: נֹתֵן לָךְ
  choice: anakupa
  rationale: Kauli ya wakati wa sasa huhifadhi hali ya kitenzi kishirikishi cha Kiebrania na kusisitiza kwamba Mungu ndiye anayetoa nchi.
- source_word: וִירִשְׁתָּהּ
  choice: na kuimiliki
  rationale: Katika muktadha wa nchi, ירשׁ humaanisha kuitwaa na kuwa nayo; “kuimiliki” ni fupi na ya kawaida.
- source_word: וְיָשַׁבְתָּה בָּהּ
  choice: na kukaa humo
  rationale: ישׁב hapa inaonyesha kuishi au kufanya makao nchini; “kukaa humo” ni Kiswahili cha sasa na chenye hadhi.
- source_word: וְאָמַרְתָּ
  choice: kisha ukasema
  rationale: “Kisha” huonyesha hatua inayofuata katika mfuatano wa hali hiyo bila kuongeza sababu.
- source_word: אָשִׂימָה עָלַי מֶלֶךְ
  choice: Nitaweka mfalme juu yangu
  rationale: Huhifadhi kwa karibu maana ya שׂים, ‘kuweka,’ na usemi עָלַי, ‘juu yangu,’ bila kuamua kimya kimya ikiwa tendo hilo ni kuteua au kujitawaza.
- source_word: כְּכָל הַגּוֹיִם אֲשֶׁר סְבִיבֹתָי
  choice: kama mataifa yote yanayonizunguka
  rationale: “Mataifa” huepuka kuingiza maana ya baadaye ya kidini ya “watu wa mataifa,” na nafsi ya kwanza katika “yanayonizunguka” huhifadhi mtazamo wa maneno yaliyonukuliwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la agano; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Kauli ya kutaka mfalme
  choice: Nitaweka mfalme juu yangu
  alternative: Nitamteua mfalme anitawale
  rationale: Tafsiri kuu inahifadhi usemi halisi wa Kiebrania na mvutano uliomo katika watu kujichagulia mfalme; tafsiri ya kiutendaji zaidi imetolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa nafsi ya pili umoja umehifadhiwa, na sentensi imeachwa wazi kwa koma kwa kuwa wazo linaendelea katika mstari unaofuata.
