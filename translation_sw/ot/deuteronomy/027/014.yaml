lexical_decisions:
- source_word: וְעָנוּ
  choice: watajibu
  rationale: Kitenzi ענה katika muundo huu huanzisha jibu au tangazo rasmi. Wakati ujao unafaa kwa kuwa kifungu hiki kinatoa agizo la jambo litakalofanywa.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Kiebrania kinawataja Walawi moja kwa moja, si makuhani wa Kilawi; hivyo tafsiri hii inadumisha tofauti iliyopo katika muktadha.
- source_word: וְאָמְרוּ
  choice: na kumwambia
  rationale: אמר ni kitenzi cha kawaida cha kusema. Umbo la umoja linaafikiana na kirai ‘kila mwanamume,’ huku likihifadhi mfuatano wa kujibu na kusema.
- source_word: אֶל כָּל אִישׁ יִשְׂרָאֵל
  choice: kila mwanamume wa Israeli
  rationale: אִישׁ ni nomino ya umoja wa kiume yenye maana ya uwakilishi hapa. ‘Kila mwanamume wa Israeli’ huhifadhi umbo hilo wazi kuliko ‘kila Mwisraeli.’
- source_word: קוֹל רָם
  choice: kwa sauti kubwa
  rationale: Hiki ni kirai cha kawaida kinachoonyesha tangazo la hadharani linalosikika wazi; ‘kwa sauti kubwa’ ni Kiswahili cha asili na chenye hadhi.
theological_decisions:
- issue: Lugha ya uwakilishi wa kiume katika אִישׁ
  choice: kila mwanamume wa Israeli
  alternative: kila Mwisraeli
  rationale: Kiebrania kinatumia nomino ya umoja wa kiume kwa nguvu ya uwakilishi. Tafsiri kuu inalihifadhi hilo bila kuamua kimya kimya kuwa umbo hilo halina umuhimu, na tanbihi inatoa tafsiri ya kawaida zaidi inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘kumwambia kila mwanamume’ ni wa kawaida na hudumisha umoja wa kirai cha Kiebrania; ‘kwa sauti kubwa’ huonyesha tangazo rasmi la hadharani.
