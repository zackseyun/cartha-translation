  rationale: Umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: זְבוּלֻן
  choice: Zabuloni
  rationale: Umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: דָּן
  choice: Dani
  rationale: Umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
theological_decisions:
- issue: Jukumu la kiibada la makabila kuhusiana na laana
  choice: kwa ajili ya laana
  alternative: kwa ajili ya kutamka laana; kwa ajili ya kulaani
  rationale: Kiebrania hakirudii wazi kitenzi kama ‘kutamka.’ Muktadha unaonyesha ushiriki katika sherehe ya baraka na laana, lakini tafsiri kuu inahifadhi ufupi na kutobainisha zaidi kwa maandishi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo mfupi wa Kiebrania umehifadhiwa, na tanbihi inaonyesha maana mbadala bila kuondoa utata halisi.
