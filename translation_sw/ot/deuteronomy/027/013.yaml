  yaml_path: translation/ot/deuteronomy/027/013.yaml
  text: 'And these shall stand for the curse on Mount Ebal: Reuben[a], Gad, Asher, Zebulun, Dan, and Naphtali.'
translation:
  language: sw
  text: 'Na hawa watasimama juu ya Mlima Ebali kwa ajili ya laana[a]: Reubeni, Gadi, Asheri, Zabuloni, Dani na Naftali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa ajili ya kutamka laana” au “kwa ajili ya kulaani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Na hawa
  rationale: Inaunganisha kundi hili na lile la mstari uliotangulia huku ikionyesha utofautishaji wao.
- source_word: יַעַמְדוּ
  choice: watasimama
  rationale: Kauli isiyokamilika hapa inaeleza agizo la wakati ujao; Kiswahili hiki ni cha kawaida na wazi.
- source_word: עַל הַקְּלָלָה
  choice: kwa ajili ya laana
  rationale: Inaonyesha kuhusishwa au kupewa jukumu linalohusu laana bila kuongeza kitenzi ambacho hakipo wazi katika Kiebrania.
- source_word: בְּהַר עֵיבָל
  choice: juu ya Mlima Ebali
  rationale: Huwasilisha mahali waliposimama mlimani kwa lugha ya kawaida ya Kiswahili.
- source_word: רְאוּבֵן
  choice: Reubeni
  rationale: Umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: גָּד
  choice: Gadi
  rationale: Umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: אָשֵׁר
