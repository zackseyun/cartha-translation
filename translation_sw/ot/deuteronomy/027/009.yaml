base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/009.yaml
  text: 'Then Moses and the Levitical priests spoke to all Israel[a], saying, “Be silent and listen[b], Israel: today you have become a people for Yahweh your God.”'
translation:
  language: sw
  text: 'Kisha Musa na makuhani Walawi wakawaambia Israeli wote, “Nyamazeni na msikilize,[a] enyi Israeli: leo mmekuwa watu wa Yahweh, Mungu wenu.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Tegeni sikio msikilize.” Amri ya Kiebrania inaweza kusisitiza kunyamaza au kuelekeza fikira kwa makini.
    reason: lexical_alternative
  - marker: b
    text: Au “mmekuwa watu walio wa Yahweh, Mungu wenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha ... wakasema
  rationale: Waw ya kisimulizi inaendeleza tukio; “kisha” huleta mtiririko wa kawaida wa Kiswahili, huku “wakasema” ikihifadhi tendo la kusema.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: makuhani Walawi
  rationale: Kirai hiki kinawatambulisha makuhani kuwa Walawi; usemi huu ni wa kawaida na wenye heshima katika Kiswahili.
- source_word: כָּל יִשְׂרָאֵל
  choice: Israeli wote
  rationale: Huhifadhi maana ya taifa lote likizungumziwa kwa pamoja.
- source_word: הַסְכֵּת
  choice: Nyamazeni
  rationale: Amri hii huenda ikataka ukimya wa makini kabla ya kusikiliza. Tafsiri hii huhifadhi maana halisi, huku tanbihi ikionyesha uwezekano wa “Tegeni sikio.”
- source_word: וּשְׁמַע
  choice: msikilize
  rationale: Kitenzi cha amri “sikiliza” hueleza upokeaji wa makini kwa Kiswahili cha sasa.
- source_word: הַיּוֹם הַזֶּה
  choice: leo
  rationale: Ni tafsiri ya kawaida na kamili ya usemi wa Kiebrania “siku hii.”
- source_word: נִהְיֵיתָ לְעָם
  choice: mmekuwa watu
  rationale: Huhifadhi utambulisho wa agano unaoelezwa na “watu,” bila kuugeuza kuwa dhana ya kisiasa ya “taifa.” Kiswahili hutumia umbo la wingi kwa Israeli wanaoambiwa moja kwa moja.
- source_word: לַיהוָה
  choice: wa Yahweh
  rationale: Katika muundo היה + ל, lamedhu huonyesha uhusiano au umiliki wa agano. “Watu wa Yahweh” ni ya asili kwa Kiswahili; tanbihi huhifadhi tafsiri iliyo wazi zaidi ya umiliki.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wenu
  rationale: Ni tafsiri ya moja kwa moja inayolingana kwa kawaida na Israeli wote wanaoambiwa kwa Kiswahili.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko lina jina la agano יהוה moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Israeli kuambiwa kwa umoja wa kijumuiya
  choice: mmekuwa watu
  alternative: umekuwa watu
  rationale: Kiebrania humwambia Israeli kwa nafsi ya pili umoja kama jumuiya moja. Kiswahili sanifu hakitofautishi “you” ya umoja na wingi kwa njia hiyo bila kuzua ukakasi; wingi “mmekuwa” huwaelekea Israeli wote kiasili huku nomino “watu” ikihifadhi utambulisho wa pamoja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Alama za tanbihi [a] na [b] zimewekwa baada ya vifungu vinavyohusika.
