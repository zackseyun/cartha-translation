base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/004.yaml
  text: And when you cross the Jordan[a], you shall set up these stones, which I am commanding you today, on Mount Ebal, and you shall plaster them with lime.
translation:
  language: sw
  text: Mtakapovuka Yordani, mtayasimamisha mawe haya ninayowaamuru leo juu ya Mlima Ebali[a], na mtayapaka chokaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya mapokeo ya maandishi, hasa Pentateuki ya Wasamaria, yanasoma “Mlima Gerizimu” badala ya “Mlima Ebali.”
    reason: textual_variant
lexical_decisions:
- source_word: וְהָיָה בְּעָבְרְכֶם
  choice: Nanyi mtakapovuka
  rationale: Muundo huu unaanzisha hali ya wakati ujao, ‘mtakapovuka.’ ‘Nanyi’ linaendeleza simulizi na kuonyesha kwamba agizo linawahusu watu wengi.
- source_word: הַיַּרְדֵּן
  choice: Yordani
  rationale: Jina hili kwa kawaida humaanisha Mto Yordani; kwa Kiswahili jina pekee linaeleweka hapa bila kuongeza ‘Mto.’
- source_word: תָּקִימוּ
  choice: mtayasimamisha
  rationale: Hifili ya קום hapa humaanisha kuyainua au kuyas erect mawe. ‘Kuyasimamisha’ ni Kiswahili cha kawaida na kinafaa kwa tendo hilo.
- source_word: הָאֲבָנִים הָאֵלֶּה
  choice: mawe haya
  rationale: Tafsiri ya moja kwa moja ambayo haiongezi dhana ya ‘makaburi’ au ‘mnara’ isiyosemwa wazi katika maandishi.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: ninayowaamuru leo
  rationale: Kivumishi-tendo מְצַוֶּה kina nguvu ya tendo la sasa; ‘ninayowaamuru leo’ huihifadhi kwa Kiswahili cha asili.
- source_word: בְּהַר עֵיבָל
  choice: kwenye Mlima Ebali
  rationale: ‘Kwenye Mlima Ebali’ ni usemi wa kawaida wa Kiswahili unaoonyesha mahali bila kulazimisha kwa undani ikiwa ni kileleni au eneo la mlima.
- source_word: וְשַׂדְתָּ אֹתָם בַּשִּׂיד
  choice: kisha mtayapaka chokaa
  rationale: שׂוד pamoja na שׂיד hueleza kuyafunika mawe kwa chokaa. ‘Kuyapaka chokaa’ ni usemi wazi na wa kawaida; ‘kisha’ linaunganisha hatua inayofuata kwa ufasaha.
theological_decisions:
- issue: Jina la mahali katika mapokeo ya maandishi ya Kumbukumbu la Torati 27:4
  choice: Mlima Ebali
  alternative: Mlima Gerizimu
  rationale: Maandishi ya Kimasora yaliyotolewa (WLC) yanasoma ‘Ebali.’ Mapokeo mengine muhimu, hasa Pentateuki ya Wasamaria, yanasoma ‘Gerizimu’; kwa hiyo toleo kuu linafuata chanzo huku tofauti hiyo ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Uwingi wa wahusika umeonyeshwa katika vitenzi; nomino ‘mawe’ imefuatwa na upatanisho wake wa ngeli. Tanbihi [a] imewekwa baada ya ‘Yordani’ ili kufuata mpangilio wa safu ya mashauriano ya Kiingereza, ingawa tofauti yenyewe inahusu jina la mlima baadaye katika mstari.
