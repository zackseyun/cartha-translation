  yaml_path: translation/ot/deuteronomy/027/008.yaml
  text: And you shall write on the stones all the words of this law very clearly[a].
translation:
  language: sw
  text: Nawe utaandika juu ya mawe hayo maneno yote ya sheria hii kwa wazi kabisa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa namna ya kuyaweka wazi” au “ili yaeleweke vizuri.” Kiebrania kinaunganisha kitenzi chenye maana ya “kuweka wazi/kufafanua” na neno la kukazia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ
  choice: Nawe utaandika
  rationale: Kitenzi cha nafsi ya pili umoja, pamoja na kiunganishi, kinaendeleza mfululizo wa maagizo. “Nawe utaandika” kinahifadhi mhusika mmoja anayesemeshwa na nguvu ya agizo katika muktadha.
- source_word: עַל הָאֲבָנִים
  choice: juu ya mawe hayo
  rationale: Kihusishi עַל humaanisha “juu ya,” na kibainishi katika “mawe” kinarejelea mawe maalumu yaliyotajwa katika muktadha; “hayo” huonyesha rejeo hilo kwa Kiswahili cha kawaida.
- source_word: אֵת כָּל דִּבְרֵי
  choice: maneno yote
  rationale: Tafsiri hii inafuata kwa karibu כָּל דִּבְרֵי na kuhifadhi taswira ya maneno yanayoandikwa badala ya kuipanua kuwa “mambo” au “masharti.”
- source_word: הַתּוֹרָה הַזֹּאת
  choice: ya sheria hii
  rationale: Ingawa תּוֹרָה inaweza kumaanisha “mafundisho” au “maagizo,” katika muktadha huu wa agano na masharti yake “sheria hii” ni tafsiri iliyo wazi na ya kawaida.
- source_word: בַּאֵר הֵיטֵב
  choice: kwa wazi kabisa
  rationale: בַּאֵר huleta wazo la kuweka wazi au kufafanua, huku הֵיטֵב ikilitilia nguvu. “Kwa wazi kabisa” ni ya asili katika Kiswahili na haifungi maana kwa uhalali wa kusomeka pekee au kueleweka pekee.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Nawe utaandika” hudumisha mfuatano wa maagizo, na “mawe hayo” huunganisha aya hii na mawe yaliyotajwa kabla.
