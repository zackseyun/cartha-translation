  text: אָר֕וּר שֹׁכֵ֖ב עִם כָּל בְּהֵמָ֑ה וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/021.yaml
  text: Cursed is he who lies with any animal. And all the people shall say[a], ‘Amen.’
translation:
  language: sw
  text: “Amelaaniwa mwanamume[a] anayelala na mnyama yeyote.” Na watu wote watasema, “Amina.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yeyote anayelala na mnyama yeyote.” Kiebrania kinatumia umbo la umoja wa kiume.
    reason: alternative_reading
lexical_decisions:
- source_word: אָרוּר
  choice: Amelaaniwa
  rationale: Ni fomula ya tamko la laana ya agano; ‘amelaaniwa’ ni ya kawaida, nzito, na ya moja kwa moja katika Kiswahili.
- source_word: שֹׁכֵב
  choice: anayelala na
  rationale: Katika muktadha huu wa kisheria kitenzi hiki ni tasfida ya tendo la ngono. ‘Kulala na’ hudumisha tasfida hiyo kwa Kiswahili cha kawaida bila kuifanya iwe wazi zaidi kuliko Kiebrania.
- source_word: כָּל בְּהֵמָה
  choice: mnyama yeyote
  rationale: ‘Yeyote’ huwasilisha maana ya mgawanyo ya כָּל, huku ‘mnyama’ ikihifadhi upana wa בְּהֵמָה kuliko ‘mifugo’.
- source_word: שֹׁכֵב
  choice: mwanamume anayelala
  rationale: Kivumishi-tendo cha Kiebrania ni umoja wa kiume na kimetumiwa kama nomino. ‘Mwanamume’ huhifadhi rejeo hilo la kiume kwa uwazi na kwa lugha ya kawaida.
- source_word: וְאָמַר
  choice: Na ... watasema
  rationale: Huendeleza mlolongo wa kiliturujia na wa kisheria, huku wakati ujao ukitoa nguvu ya agizo la sherehe.
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: Ni tafsiri ya moja kwa moja isiyoongeza ‘wa Israeli,’ ambalo halipo katika maneno ya mstari huu.
- source_word: אָמֵן
  choice: Amina
  rationale: ‘Amina’ ni tamko la kiliturujia linaloeleweka sana katika Kiswahili na huhifadhi mwitikio wa kuthibitisha agano.
theological_decisions:
- issue: Kivumishi-tendo cha umoja wa kiume katika fomula ya laana ya kisheria
  choice: mwanamume anayelala
  alternative: yeyote anayelala
  rationale: Kiebrania kina umbo la umoja wa kiume, ambalo katika sheria hii huenda linamkusudia mhusika wa kiume. Tafsiri kuu inalihifadhi badala ya kulifanya lisilo na jinsia; tanbihi inaonyesha uwezekano wa kulielewa kwa maana pana ya kisheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya tamko la agano lakini kinachoeleweka kwa wasomaji wa kawaida. Tasfida ‘kulala na’ imehifadhiwa kwa kuwa chanzo pia kinatumia tasfida.
