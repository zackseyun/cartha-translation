base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/007.yaml
  text: And you shall sacrifice peace offerings[a], and you shall eat there, and you shall rejoice before Yahweh your God.
translation:
  language: sw
  text: Na utatoa dhabihu za amani[a], na utakula huko, na utafurahi mbele za Yahwe, Mungu wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhabihu za ushirika” au “dhabihu za ustawi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זָבַחְתָּ
  choice: utatoa dhabihu
  rationale: Katika muktadha wa ibada, זבח humaanisha kufanya au kutoa dhabihu. Kiswahili ‘kutoa dhabihu’ ni cha kawaida na huhifadhi maana ya kitendo cha kidini bila kusisitiza tu uchinjaji.
- source_word: שְׁלָמִים
  choice: dhabihu za amani
  rationale: שְׁלָמִים ni aina ya dhabihu iliyohusishwa na hali njema, amani, na mlo wa pamoja wa ibada. ‘Dhabihu za amani’ ni tafsiri fupi na inayotambulika; uwezekano mwingine umehifadhiwa katika tanbihi.
- source_word: וְ/אָכַלְתָּ שָּׁם
  choice: nawe utakula huko
  rationale: Tafsiri hii huhifadhi kitendo cha kula, mahali panapoonyeshwa na שָׁם (‘huko’), na mfululizo wa maagizo ya Kiebrania.
- source_word: וְ/שָׂמַחְתָּ
  choice: na kufurahi
  rationale: שׂמח hapa hueleza furaha ya sherehe mbele za Mungu. ‘Kufurahi’ ni Kiswahili cha sasa, cha kawaida, na chenye uzito unaofaa kwa muktadha wa ibada.
- source_word: לִ/פְנֵי
  choice: mbele za
  rationale: Katika muktadha wa ibada, לִפְנֵי humaanisha kuwa mbele au katika uwepo wa mtu. ‘Mbele za’ ni usemi wa Kiswahili unaofaa katika lugha yenye heshima ya kidini.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kwa umbo la Kiswahili ‘Yahwe,’ badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Kiambishi cha nafsi ya pili umoja katika Kiebrania kimehifadhiwa kwa ‘wako,’ hivyo kudumisha namna ya agano ya kumsemesha Israeli kama umoja.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Matini ina jina la Mungu moja kwa moja. ‘Yahwe’ hulihifadhi kama jina binafsi na ni umbo linalofaa katika tahajia ya Kiswahili; halibadilishwi kuwa cheo kama ‘BWANA.’
- issue: Uwasilishaji wa שְׁלָמִים
  choice: dhabihu za amani
  alternative: dhabihu za ushirika; dhabihu za ustawi
  rationale: Neno hili ni jina la aina ya dhabihu, si dai kwamba dhabihu yenyewe huzalisha hisia fulani ya amani. Tafsiri kuu inatumia istilahi inayotambulika, huku tanbihi ikihifadhi upana wa maana unaohusisha ushirika na hali njema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘nawe … nawe … na …’ huhifadhi mfululizo wa vitenzi vya Kiebrania bila kuifanya sentensi kuwa ngumu. ‘Huko’ hurejelea mahali palipotajwa katika muktadha uliotangulia.
