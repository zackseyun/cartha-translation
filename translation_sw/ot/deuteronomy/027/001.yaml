base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/001.yaml
  text: Then Moses and the elders of Israel commanded the people[a], saying, “Keep all the commandment that I am commanding you today.”
translation:
  language: sw
  text: Musa na wazee wa Israeli waliwaamuru watu, wakisema, “Shikeni amri yote ninayowaamuru leo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “agizo lote”; neno la Kiebrania liko katika umoja na limetumiwa kwa maana ya kijumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: wakawaamuru
  rationale: Kitenzi צוה kinaonyesha kutoa amri kwa mamlaka; ‘wakaamuru’ ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: וְזִקְנֵי יִשְׂרָאֵל
  choice: na wazee wa Israeli
  rationale: Kiunganishi cha Kiebrania kinawaweka Musa na wazee wa Israeli pamoja kama wahusika wa tendo, hivyo ‘na’ huhifadhi muundo huo.
- source_word: הָעָם
  choice: watu
  rationale: עָם hapa ni jumuiya ya Israeli; ‘watu’ ni neno la kawaida na linaloeleweka katika muktadha wa agano.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Huhifadhi utangulizi wa maneno yanayonukuliwa bila kuongeza ufafanuzi usiomo katika chanzo.
- source_word: שָׁמֹר
  choice: Lishike
  rationale: Katika muktadha wa amri, שׁמר hujumuisha kutunza na kutii. ‘Lishike’ ni usemi wa kawaida wa kibiblia na unaolingana na nomino ya umoja inayofuata.
- source_word: כָּל הַמִּצְוָה
  choice: agizo lote
  rationale: Kiebrania kina nomino ya umoja yenye כָּל. ‘Agizo lote’ huhifadhi umoja na maana ya jambo zima bila kutumia wingi.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: ninalowaamuru
  rationale: Umbo la kushiriki מְצַוֶּה linafaa kutafsiriwa kwa wakati wa sasa unaoendelea; muundo huu ni wa asili katika Kiswahili.
- source_word: הַיּוֹם
  choice: leo
  rationale: ‘Leo’ ni tafsiri ya moja kwa moja, ya sasa, na ya kawaida ya הַיּוֹם.
theological_decisions:
- issue: Umoja wa מִצְוָה katika maagizo ya agano
  choice: agizo lote
  alternative: maagizo yote
  rationale: Nomino ya Kiebrania iko katika umoja na huenda imetumiwa kwa maana ya mkusanyiko. Kuhifadhi umoja hakulazimishi tafsiri kuwa orodha ya amri nyingi wala kuondoa uwezekano wa maana ya pamoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Agizo’ limetumiwa ili sentensi ya umoja iwe ya asili; tanbihi inaonyesha ‘amri’ kama mbadala na inadumisha hali ya umoja wa Kiebrania.
