  text: אֲבָנִ֤ים שְׁלֵמוֹת֙ תִּבְנֶ֔ה אֶת מִזְבַּ֖ח יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/הַעֲלִ֤יתָ עָלָי/ו֙ עוֹלֹ֔ת לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/006.yaml
  text: You shall build the altar of Yahweh your God with whole stones[a], and you shall offer burnt offerings on it to Yahweh your God.
translation:
  language: sw
  text: Utajenga madhabahu ya Yahwe Mungu wako kwa mawe mazima[a], kisha utatoa juu yake sadaka za kuteketezwa kwa Yahwe Mungu wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mawe yasiyochongwa.” Kiebrania kinasema “mawe mazima/kamili”; “yasiyochongwa” hutokana na agizo linalozunguka kifungu hiki kwamba chombo cha chuma kisitumike juu ya mawe hayo (mst. 5).
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים שְׁלֵמוֹת
  choice: mawe mazima
  rationale: Kivumishi שְׁלֵמוֹת humaanisha kwa msingi ‘mazima/kamili.’ ‘Mawe mazima’ huhifadhi maana ya moja kwa moja; wazo la kutokuwa yamechongwa linatokana na agizo la mstari wa 5 na limewekwa katika tanbihi.
- source_word: תִּבְנֶה
  choice: utajenga
  rationale: Katika muktadha huu wa maagizo, kitenzi cha wakati usiotimilika kina nguvu ya amri. ‘Utajenga’ ni lugha ya kawaida na yenye hadhi kwa agizo la agano.
- source_word: מִזְבַּח
  choice: madhabahu
  rationale: Hili ndilo neno sanifu la Kiswahili kwa jengo au mahali pa kutolea dhabihu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kama ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: 'Muundo wenye kiambishi cha nafsi ya pili umoja unaonyesha wazi uhusiano wa umiliki/agano: ‘Mungu wako.’'
- source_word: וְהַעֲלִיתָ עָלָיו
  choice: nawe utatoa juu yake
  rationale: Katika muktadha wa dhabihu, Hiphil ya עלה humaanisha kutoa dhabihu. ‘Utatoa juu yake’ ni Kiswahili cha kawaida kinachohifadhi mahali pa tendo hilo.
- source_word: עוֹלֹת
  choice: sadaka za kuteketezwa
  rationale: עוֹלָה ni istilahi ya dhabihu iliyoteketezwa yote; ‘sadaka za kuteketezwa’ ni tafsiri sahihi na inayoeleweka katika Kiswahili.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi ל hapa kinaonyesha anayelengwa au kuwekewa wakfu sadaka; ‘kwa Yahwe’ ni cha asili katika Kiswahili cha ibada.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Iwapo שְׁלֵמוֹת itafsiriwe kwa maana ya kimuktadha kuwa ‘yasiyochongwa’
  choice: mawe mazima
  alternative: mawe yasiyochongwa
  rationale: Kivumishi chenyewe kina maana ya ‘mazima/kamili.’ Muktadha wa mstari wa 5 unaunga mkono ‘yasiyochongwa,’ lakini maana hiyo ya kimuktadha imehifadhiwa katika tanbihi bila kuchukua nafasi ya maana ya moja kwa moja katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri ‘utajenga ... utatoa’ huhifadhi uzito wa maagizo ya agano bila kuwa mgumu. Alama ya tanbihi [a] imewekwa baada ya kirai husika.
