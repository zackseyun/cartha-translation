  text: אָר֕וּר מַשְׁגֶּ֥ה עִוֵּ֖ר בַּ/דָּ֑רֶךְ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/018.yaml
  text: Cursed is the one who misleads a blind man on the road. And all the people shall say[a], ‘Amen.’
translation:
  language: sw
  text: Amelaaniwa mtu anayempotosha kipofu njiani. Na watu wote watasema, “Amina.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Amelaaniwa
  rationale: Ni fomula ya tangazo la laana ya agano. Kauli hii ya hali huhifadhi nguvu ya tamko la Kiebrania bila kuifanya kuwa ombi.
- source_word: מַשְׁגֶּה
  choice: mtu anayempotosha
  rationale: Kivumishi-tendaji cha Hiphil kina maana ya kumsababisha mwingine apotee au kwenda njia isiyofaa. ‘Anayempotosha’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya kusababisha.
- source_word: עִוֵּר
  choice: kipofu
  rationale: Neno hilo ni kivumishi kilichotumiwa kama nomino kwa mtu mmoja. Katika Kiswahili, ‘kipofu’ ni jina la kawaida la mtu asiyeona na halihitaji kuongeza ‘mtu’ au kuonyesha jinsia ya kisarufi ya Kiebrania.
- source_word: בַּדָּרֶךְ
  choice: njiani
  rationale: Muktadha unaonyesha mahali halisi pa kusafiria. ‘Njiani’ ni fupi, ya asili, na ya wazi katika Kiswahili.
- source_word: וְאָמַר
  choice: Na ... watasema
  rationale: Katika mfuatano huu wa maagizo ya kiliturujia, waw pamoja na qatal ina maana ya tendo lililoagizwa au la wakati ujao. ‘Watasema’ huonyesha jibu la pamoja lililowekwa.
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: Huhifadhi sawasawa upeo wa maneno ya Kiebrania bila kuongeza ‘wa Israeli,’ ambalo halipo wazi katika mstari huu.
- source_word: אָמֵן
  choice: Amina
  rationale: ‘Amina’ ni umbo lililozoeleka katika Kiswahili kwa itikio la kiliturujia na la agano, na hudumisha uhusiano wake na neno la Kiebrania.
theological_decisions:
- issue: Jinsia katika neno עִוֵּר lililotumiwa kama nomino
  choice: kipofu
  alternative: mwanamume kipofu
  rationale: Ingawa umbo la Kiebrania ni umoja wa kiume, Kiswahili hakionyeshi jinsia kwa njia hiyo katika nomino ‘kipofu.’ Kuongeza ‘mwanamume’ kungefanya jinsia iwe wazi zaidi kuliko inavyohitajika kwa sarufi ya kawaida ya Kiswahili.
- issue: Asili ya fomula ya laana
  choice: Amelaaniwa mtu anaye...
  alternative: Na alaaniwe mtu anaye...
  rationale: Kiebrania kinatoa tangazo la laana ya agano, si ombi au tamanio. ‘Amelaaniwa’ huhifadhi tabia yake ya tamko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo ni wa moja kwa moja na wa kiliturujia; hakuna tanbihi iliyohitajika kwa sababu mbadala wa Kiingereza ‘leads astray ... on the way’ unawakilishwa vya kutosha na ‘anayempotosha ... njiani.’
