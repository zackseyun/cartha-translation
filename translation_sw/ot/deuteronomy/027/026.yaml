base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/026.yaml
  text: Cursed is the one who does not uphold the words of this law by doing them. And all the people shall say[a], “Amen.”
translation:
  language: sw
  text: “Amelaaniwa mtu asiyeyathibitisha[a] maneno ya sheria hii kwa kuyatenda.” Na watu wote waseme, “Amina.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “asiyeyaimarisha” au “asiyeyadumisha.” Kitenzi cha Kiebrania kinaweza kumaanisha kuthibitisha, kuimarisha, au kudumisha nguvu ya sheria; hapa kimeunganishwa na kuitii: “kwa kuyatenda.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Amelaaniwa
  rationale: Ni kauli ya laana ya agano. “Amelaaniwa” ni ya kawaida, yenye heshima, na inaonyesha hali ya mtu aliye chini ya laana bila kuigeuza kuwa amri.
- source_word: אֲשֶׁר
  choice: mtu asiye-
  rationale: Muundo huu unatoa maana ya jumla ya ‘yeyote ambaye’ kwa Kiswahili cha kawaida bila kuibana kwa jinsia.
- source_word: לֹא יָקִים
  choice: asiyeyathibitisha
  rationale: Hifili ya קום hapa inaweza kumaanisha kuthibitisha, kuimarisha, au kudumisha nguvu ya sheria. “Asiyeyathibitisha” huhifadhi tofauti kati ya kukiri mamlaka ya sheria na maneno yanayofuata kuhusu kuitenda.
- source_word: דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: maneno ya sheria hii
  rationale: דִּבְרֵי ni ‘maneno/mambo,’ na katika muktadha huu wa agano תּוֹרָה linafaa kutafsiriwa “sheria.”
- source_word: לַעֲשׂוֹת אֹתָם
  choice: kwa kuyatenda
  rationale: Kirai hiki kinaonyesha jinsi sheria inavyothibitishwa kwa vitendo. “Kwa kuyatenda” huhifadhi uhusiano wa moja kwa moja kati ya kuithibitisha sheria na kuitii.
- source_word: וְאָמַר כָּל הָעָם
  choice: Na watu wote waseme
  rationale: 'Katika mpangilio huu wa ibada na sheria, kitenzi kina nguvu ya maagizo: hili ndilo jibu ambalo kusanyiko lote linapaswa kutoa.'
- source_word: אָמֵן
  choice: Amina
  rationale: “Amina” ni tamko la ibada lililozoeleka katika Kiswahili na huhifadhi maana ya uthibitisho wa pamoja.
theological_decisions:
- issue: Maana ya wajibu wa agano katika יָקִים ... לַעֲשׂוֹת אֹתָם
  choice: Laana inamhusu mtu asiyethibitisha mamlaka ya sheria kwa kuitii kwa vitendo.
  alternative: Laana inamhusu tu mtu asiyekiri au kuidhinisha sheria hadharani; au kwa ujumla mtu asiyeishika sheria.
  rationale: Kiebrania kinaunganisha wazo la kuthibitisha au kudumisha sheria na kirai “kwa kuyatenda.” Tafsiri imehifadhi vipengele vyote viwili bila kuyafanya maneno yawe tamko la mdomo tu wala kuyapunguza yawe ‘kutii’ pekee.
- issue: Urejeo wa jumla wa אֲשֶׁר
  choice: mtu asiye-
  alternative: yeyote asiye-; mwanamume asiye-
  rationale: Ingawa muundo wa Kiebrania ni umoja wa kisarufi, maana yake ni ya jumla. “Mtu” ni ya asili katika Kiswahili na haiongezi ubainishaji wa jinsia usio wa lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya ibada lakini kinachoeleweka kwa urahisi. Muundo wa laana umewekwa kama kauli, na jibu la watu wote limehifadhiwa kama agizo la pamoja.
