  text: אָרוּר֙ לֹקֵ֣חַ שֹׁ֔חַד לְ/הַכּ֥וֹת נֶ֖פֶשׁ דָּ֣ם נָקִ֑י וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/025.yaml
  text: Cursed is the one who takes a bribe to strike down an innocent person[a], and all the people shall say, ‘Amen.’
translation:
  language: sw
  text: Amelaaniwa mtu anayepokea rushwa ili kumuua mtu asiye na hatia.[a] Na watu wote waseme, “Amina.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kumpiga mtu, damu isiyo na hatia.” Hii ni nahau ya Kiebrania inayomaanisha kumuua mtu asiye na hatia.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Amelaaniwa
  rationale: Ni fomula ya laana ya agano katika hali ya kivumishi; “amelaaniwa” ni ya kawaida, yenye heshima, na inaeleweka wazi katika Kiswahili cha sasa.
- source_word: לֹקֵחַ
  choice: mtu anayepokea
  rationale: Partisipio ya Qal imetumiwa kama nomino kumaanisha mtu yeyote anayefanya tendo hilo; “mtu anayepokea” huhifadhi maana hiyo ya jumla kwa Kiswahili cha kawaida.
- source_word: שֹׁחַד
  choice: rushwa
  rationale: Hili ndilo neno la kawaida la kisheria kwa malipo haramu yanayotolewa ili kupotosha haki.
- source_word: לְהַכּוֹת
  choice: ili kumuua
  rationale: Katika muundo huu wenye “damu isiyo na hatia,” kitenzi נכה kinaonyesha shambulio lenye kusababisha kifo; “kumuua” huwasilisha matokeo yanayokusudiwa kwa uwazi.
- source_word: נֶפֶשׁ
  choice: mtu
  rationale: Katika muktadha huu wa kisheria, נֶפֶשׁ humaanisha mtu au uhai wa mtu, si nafsi isiyo ya kimwili.
- source_word: דָּם נָקִי
  choice: asiye na hatia
  rationale: Kiebrania kinasema kihalisi “damu isiyo na hatia,” nahau inayomhusu mtu ambaye hana hatia inayostahili kuuawa; maana ya nahau imetolewa katika matini, na taswira ya asili imehifadhiwa katika tanbihi.
- source_word: וְאָמַר כָּל הָעָם
  choice: Na watu wote waseme
  rationale: Katika agizo hili la kiliturujia na kisheria, umbo la kitenzi linaonyesha jibu linalotakiwa kutolewa; hali ya utegemezi “waseme” ni ya kawaida na rasmi kwa Kiswahili.
- source_word: אָמֵן
  choice: Amina
  rationale: “Amina” ni tamko lililozoeleka la kukubali na kuthibitisha, na huhifadhi fomula ya mwitikio wa agano.
theological_decisions:
- issue: Uwasilishaji wa fomula ya laana katika muktadha wa agano
  choice: Amelaaniwa mtu anayepokea rushwa ili kumuua mtu asiye na hatia
  alternative: Na alaaniwe mtu anayepokea rushwa ili kuipiga damu isiyo na hatia
  rationale: Tafsiri iliyochaguliwa huhifadhi uzito wa kisheria na wa kiagano huku ikitumia Kiswahili cha sasa kinachoeleweka. Hailazimishi fundisho la dhehebu, na tanbihi huhifadhi nahau ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayofaa tamko la hadharani la agano. “Rushwa,” “asiye na hatia,” na “Amina” ni maneno ya kawaida na yaliyo wazi kwa wasomaji wengi.
