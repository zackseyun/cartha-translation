  text: אָר֣וּר הָ/אִ֡ישׁ אֲשֶׁ֣ר יַעֲשֶׂה֩ פֶ֨סֶל וּ/מַסֵּכָ֜ה תּוֹעֲבַ֣ת יְהוָ֗ה מַעֲשֵׂ֛ה יְדֵ֥י חָרָ֖שׁ וְ/שָׂ֣ם בַּ/סָּ֑תֶר וְ/עָנ֧וּ כָל הָ/עָ֛ם וְ/אָמְר֖וּ אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/015.yaml
  text: Cursed is the man who makes a carved image or a cast image—an abomination to Yahweh[a], the work of the hands of a craftsman—and sets it up in secret. And all the people shall answer and say[b], “Amen.”
translation:
  language: sw
  text: Amelaaniwa mwanamume[b] atakayefanya sanamu ya kuchonga au sanamu ya kusubu[a]—chukizo kwa Yahwe, kazi ya mikono ya fundi—na kuiweka kwa siri. Na watu wote wataitikia na kusema, “Amina.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sanamu ya kumiminwa.” Neno la Kiebrania linamaanisha sanamu iliyoundwa kwa kusubu kitu kilichoyeyushwa, mara nyingi metali.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “mwanamume”; umoja wa kiume hapa unatumiwa kama kanuni ya kisheria yenye kumwakilisha yeyote anayefanya kitendo hicho.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Amelaaniwa
  rationale: Linadumisha tamko la laana ya agano kwa Kiswahili cha kawaida na chenye uzito.
- source_word: הָאִישׁ
  choice: mwanamume
  rationale: Linahifadhi umoja wa kiume wa Kiebrania katika kanuni hii ya kisheria; tanbihi inaeleza matumizi yake ya uwakilishi.
- source_word: יַעֲשֶׂה
  choice: atakayefanya
  rationale: Ni usemi wa kawaida unaoonyesha kitendo cha kutengeneza sanamu.
- source_word: פֶסֶל
  choice: sanamu ya kuchonga
  rationale: Linahifadhi maana mahsusi ya sanamu inayoundwa kwa kuchongwa, badala ya neno pana zaidi la ‘sanamu’ pekee.
- source_word: מַסֵּכָה
  choice: sanamu ya kumiminwa
  rationale: Linaonyesha sanamu inayoundwa kwa kumimina kitu kilichoyeyushwa bila kuongeza wazi neno ‘metali,’ ambalo halimo katika mstari wa Kiebrania.
- source_word: תּוֹעֲבַת יְהוָה
  choice: chukizo kwa Yahwe
  rationale: Linahifadhi nguvu ya kishikamano ya neno תּוֹעֵבָה na uhusiano wake wa moja kwa moja na Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: מַעֲשֵׂה יְדֵי חָרָשׁ
  choice: kazi ya mikono ya fundi
  rationale: Linadumisha msisitizo wa kwamba sanamu hiyo ni kitu kilichotengenezwa na mwanadamu.
- source_word: וְשָׂם בַּסָּתֶר
  choice: na kuiweka kwa siri
  rationale: Ni Kiswahili cha asili kinachohifadhi wazo la kuiweka sanamu mahali pasipoonekana na wengine.
- source_word: וְעָנוּ כָל הָעָם וְאָמְרוּ אָמֵן
  choice: Na watu wote wataitikia na kusema, “Amina.”
  rationale: ‘Wataitikia’ linafaa kwa mwitikio wa pamoja wa kiliturujia na ‘Amina’ linahifadhi tamko la agano linalotambulika.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Kiebrania kinatumia Tetragramatoni kama jina binafsi; kulitaja Yahwe huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Umoja wa kiume katika kanuni ya laana ya agano
  choice: mwanamume
  alternative: mtu yeyote
  rationale: Kiebrania kinasema הָאִישׁ kwa umoja wa kiume, lakini katika kanuni hii kinatumika kiuwakilishi. Tafsiri kuu inahifadhi umbo hilo huku tanbihi ikifafanua upeo wake.
- issue: Nguvu ya neno תּוֹעֵבָה
  choice: chukizo kwa Yahwe
  alternative: kitu kinachomchukiza Yahwe
  rationale: ‘Chukizo’ linahifadhi nguvu ya nomino ya Kiebrania bila kuifanya kuwa maelezo hafifu zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya tamko la agano lakini kinachoeleweka kwa msomaji wa kawaida. Mistari mirefu imetenganishwa kwa vistari ili kuhifadhi muundo wa Kiebrania na kuonyesha kwamba ‘chukizo kwa Yahwe’ na ‘kazi ya mikono ya fundi’ zinaielezea sanamu.
