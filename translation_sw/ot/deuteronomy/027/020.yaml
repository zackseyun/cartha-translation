  variant: Standard East African Swahili
source:
  edition: WLC
  text: אָר֗וּר שֹׁכֵב֙ עִם אֵ֣שֶׁת אָבִ֔י/ו כִּ֥י גִלָּ֖ה כְּנַ֣ף אָבִ֑י/ו וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/020.yaml
  text: Cursed is the one who lies with his father's wife[a], because he has uncovered his father's skirt. And all the people shall say[b], ‘Amen.’
translation:
  language: sw
  text: “Amelaaniwa mtu anayelala na mke wa baba yake,[a] kwa sababu amefunua upindo wa vazi la baba yake.”[b] Na watu wote watasema, “Amina.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda “mke wa baba yake” akawa mama yake wa kambo, lakini Kiebrania hakusemi hivyo moja kwa moja.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi “amefunua upindo wa vazi la baba yake.” Hii ni lugha ya staha kuhusu tendo la kingono na inahusiana na lugha ya Walawi 18:8 na 20:11; maana yake pia inaweza kuelezwa kuwa amefunua uchi wa baba yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Amelaaniwa
  rationale: Ni kauli ya laana ya agano; “amelaaniwa” ni ya kawaida, wazi, na yenye uzito unaofaa katika Kiswahili.
- source_word: שֹׁכֵב עִם
  choice: anayelala na
  rationale: Inahifadhi nahau ya Kiebrania ya kujamiiana bila kutumia lugha ya kitabibu au ya mtaani.
- source_word: אֵשֶׁת אָבִיו
  choice: mke wa baba yake
  rationale: Inafuata maneno ya Kiebrania bila kuamua kwamba lazima awe mama wa kambo.
- source_word: כִּי
  choice: kwa sababu
  rationale: Inaonyesha wazi sababu ya laana.
- source_word: גִלָּה כְּנַף אָבִיו
  choice: amefunua upindo wa vazi la baba yake
  rationale: Inahifadhi taswira ya Kiebrania, ambamo כָּנָף inaweza kumaanisha upindo au pembe ya vazi, huku muktadha ukiipa maana ya staha kuhusu uhusiano wa kingono na haki ya ndoa ya baba.
- source_word: וְאָמַר כָּל הָעָם
  choice: Na watu wote watasema
  rationale: Inawasilisha mwitikio wa pamoja wa kiagano kwa lugha ya sasa na yenye hadhi.
- source_word: אָמֵן
  choice: Amina
  rationale: Huu ndio mwitikio wa kiliturujia uliozoeleka katika Kiswahili na unatokana na neno la Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri nahau ya kingono גִלָּה כְּנַף אָבִיו
  choice: Kuhifadhi sitiari kwa “amefunua upindo wa vazi la baba yake.”
  alternative: “amefunua uchi wa baba yake” au “amevunja haki ya kitanda cha ndoa cha baba yake”
  rationale: Kiebrania kinatumia lugha ya staha yenye taswira ya upindo wa vazi. Tafsiri kuu haiifanyi iwe wazi zaidi kuliko chanzo wala kuamua kabisa ikiwa mkazo ni uchi, haki ya ndoa, au heshima ya baba; ufafanuzi unawekwa katika tanbihi.
- issue: Utambulisho wa אֵשֶׁת אָבִיו
  choice: “mke wa baba yake”
  alternative: “mama yake wa kambo”
  rationale: Ingawa huenda muktadha ukamhusu mama wa kambo, Kiebrania hakitumii neno linaloamua uhusiano huo moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa kisheria na wa kiagano wenye hadhi lakini unaoeleweka. Nahau ya chanzo imehifadhiwa katika maandishi, huku tanbihi zikifafanua maana yake bila kuondoa utata wake.
