source:
  edition: WLC
  text: אָר֕וּר שֹׁכֵ֖ב עִם חֹֽתַנְתּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/023.yaml
  text: Cursed is he who lies with his mother-in-law. And all the people shall say[a], “Amen.”
translation:
  language: sw
  text: “Amelaaniwa mtu anayelala[a] na mama mkwe wake.” Na watu wote waseme, “Amina.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uwazi zaidi, “anayefanya ngono na mama mkwe wake.” Kiebrania kinatumia nahau “analala na.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Amelaaniwa
  rationale: Ni kivumishi cha kiarifu kinachoanzisha tamko la laana ya agano. ‘Amelaaniwa’ ni Kiswahili cha kawaida, chenye hadhi, na kinafaa katika muktadha wa kisheria na kiliturujia.
- source_word: שֹׁכֵב
  choice: anayelala
  rationale: Katika muktadha huu kitenzi שׁכב ni nahau ya staha inayomaanisha kufanya ngono. ‘Anayelala na’ huhifadhi nahau hiyo na bado maana yake inaeleweka katika Kiswahili cha sasa.
- source_word: עִם
  choice: na
  rationale: Ni kihusishi cha kawaida ambacho, pamoja na ‘anayelala,’ kinaunda nahau ya Kiswahili ‘kulala na.’
- source_word: חֹתַנְתּוֹ
  choice: mama mkwe wake
  rationale: Nomino חֹתֶנֶת humaanisha mama mkwe, na kiambishi tamati kinaonyesha umilikaji wa nafsi ya tatu umoja wa kiume. ‘Mama mkwe wake’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: וְאָמַר
  choice: Na ... waseme
  rationale: Kiunganishi pamoja na kitenzi kinaendeleza mwitikio wa kiliturujia baada ya kila laana. Hali ya kutaka ‘waseme’ huwasilisha agizo la mwitikio kwa kawaida zaidi kuliko taarifa rahisi ya wakati ujao.
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: Kiebrania kinasema wazi ‘watu wote.’ Hakiongezi ‘wa Israeli,’ kwa hiyo maneno hayo hayajaongezwa katika tafsiri.
- source_word: אָמֵן
  choice: Amina
  rationale: Mwitikio huu wa kiliturujia umehifadhiwa katika umbo lake la Kiswahili linalotambulika na kutumiwa sana.
theological_decisions:
- issue: Nahau ya staha kuhusu tendo la ngono katika tamko la kisheria
  choice: Kutumia ‘anayelala na’ katika maandishi makuu.
  alternative: ‘anayefanya ngono na’
  rationale: Uamuzi huu huhifadhi namna ya staha ya Kiebrania bila kuficha kosa linalotajwa. Maana iliyo wazi zaidi imetolewa katika tanbihi.
- issue: Mtendaji wa kiume katika fomula ya kisheria
  choice: Kutumia ‘mtu anayelala ... na mama mkwe wake.’
  alternative: ‘mwanamume anayelala ... na mama mkwe wake’
  rationale: Kishiriki cha Kiebrania ni cha kiume umoja, lakini Kiswahili hakionyeshi jinsia katika ‘anayelala.’ Uhusiano wa ‘mama mkwe wake’ na muktadha wenyewe huakisi hali inayotajwa bila kuongeza nomino ‘mwanamume,’ ambayo haipo wazi kama nomino katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayofaa kwa tamko la hadharani la agano. Muundo ‘Na watu wote waseme’ umechaguliwa kwa mwitikio wa kiliturujia.
