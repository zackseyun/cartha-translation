base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/010.yaml
  text: So you shall listen to the voice of Yahweh your God and do his commandments and his statutes that I am commanding you today[a].
translation:
  language: sw
  text: Basi, utaisikiliza sauti ya Yahweh, Mungu wako, na kuzitenda amri zake na sheria zake, ambazo ninakuamuru leo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utamtii Yahweh Mungu wako.” Nahau ya Kiebrania “kusikiliza sauti” mara nyingi hujumuisha maana ya kutii.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ בְּקוֹל
  choice: utaisikiliza sauti
  rationale: Nahau hii ya Kiebrania ina maana ya kusikiliza kwa makini na mara nyingi hudokeza kutii. Tafsiri hii inahifadhi picha ya ‘sauti’ bila kuifupisha moja kwa moja kuwa ‘kutii,’ kwa kuwa kishazi kinachofuata tayari kinataja kutenda amri.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi, si kubadilishwa na cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huu ni muundo wa kawaida wa umilikaji unaomtambulisha Mungu wa agano wa Israeli.
- source_word: וְעָשִׂיתָ
  choice: na kuzitenda
  rationale: Kitenzi עשה hapa humaanisha kufanya au kutekeleza. Kiambishi ‘-zi-’ kinarejelea amri na sheria zinazofuata.
- source_word: מִצְוֺתָיו
  choice: amri zake
  rationale: ‘Amri’ ni neno la kawaida na sahihi kwa maagizo yenye mamlaka katika muktadha wa agano.
- source_word: חֻקָּיו
  choice: sheria zake
  rationale: ‘Sheria’ linahifadhi maana ya masharti yaliyowekwa kisheria na kulitofautisha kwa kiwango kinachowezekana na ‘amri.’
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ
  choice: ninazokuamuru
  rationale: Muundo huu unaonyesha Musa akitoa amri katika wakati wa hotuba na unahifadhi usemi wa moja kwa moja kwa msikilizaji mmoja anayewakilisha Israeli.
- source_word: הַיּוֹם
  choice: leo
  rationale: ‘Leo’ ni tafsiri ya kawaida na ya sasa, huku ikihifadhi msisitizo wa Kumbukumbu la Torati juu ya wakati wa sasa wa agano.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu. ‘Yahweh’ hulihifadhi badala ya kulibadilisha na cheo.
- issue: Maana ya שׁמע בקול
  choice: utaisikiliza sauti
  alternative: utamtii
  rationale: ‘Kusikiliza sauti’ huhifadhi nahau ya Kiebrania na mvutano wake kati ya kusikia kwa makini na kutii; maana ya utiifu imeelezwa katika tanbihi badala ya kuamuliwa kimya kimya katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo ‘utaisikiliza sauti’ unahifadhi nahau ya Kiebrania; ‘amri’ na ‘sheria’ ni istilahi za kawaida za kisheria na kiagano.
