base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/022.yaml
  text: Cursed is the one who lies with his sister[a], the daughter of his father or the daughter of his mother. And all the people shall say, “Amen.”
translation:
  language: sw
  text: Amelaaniwa mtu anayelala na dada yake, binti wa baba yake au binti wa mama yake. Na watu wote watasema, “Amina.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Amelaaniwa
  rationale: Huhifadhi fomula ya laana ya agano kwa Kiswahili cha kawaida na chenye uzito.
- source_word: שֹׁכֵב עִם
  choice: anayelala na
  rationale: Nahau hii inaashiria kujamiiana; “kulala na” ni ya kawaida, yenye staha, na inabaki karibu na taswira ya Kiebrania.
- source_word: אֲחֹתוֹ
  choice: dada yake
  rationale: Ni tafsiri ya moja kwa moja ya jina la uhusiano lenye kiambishi cha nafsi ya tatu, umoja wa kiume.
- source_word: בַּת אָבִיו
  choice: binti ya baba yake
  rationale: Huhifadhi ufafanuzi wa kisheria na muundo wa Kiebrania unaobainisha undugu kupitia upande wa baba.
- source_word: אוֹ
  choice: au
  rationale: Huonyesha kwa uwazi chaguo jingine la uhusiano wa upande wa mama.
- source_word: בַת אִמּוֹ
  choice: binti ya mama yake
  rationale: Huhifadhi ulinganifu wa kifungu cha upande wa baba na ubainifu wa kisheria wa maandishi.
- source_word: וְאָמַר
  choice: Na ... watasema
  rationale: Wakati ujao wa Kiswahili unafaa kuwasilisha mwitikio wa pamoja uliowekwa katika mfuatano huu wa kiliturujia.
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: Ni tafsiri ya moja kwa moja isiyoongeza “Israeli” au “kusanyiko,” maneno ambayo hayapo wazi katika kifungu hiki.
- source_word: אָמֵן
  choice: Amina
  rationale: Hili ndilo umbo la kiliturujia lililozoeleka katika Kiswahili na huhifadhi maana ya uthibitisho wa agano.
theological_decisions:
- issue: Upeo na umbo la katazo la kujamiiana na ndugu wa karibu
  choice: Kutafsiri moja kwa moja kama laana juu ya mtu anayelala na dada yake, ambaye anabainishwa kuwa binti ya baba yake au binti ya mama yake.
  alternative: Kulihusisha katazo hili na dada wa kambo pekee, au kulipanua kwa kufafanua kama uhusiano wowote wa karibu wa kidada.
  rationale: Maandishi yenyewe yanafafanua “dada” kwa ukoo wa baba au wa mama. Tafsiri huhifadhi ubainifu huo bila kuupunguza wala kuupanua.
- issue: Mhusika wa kiume anayetumiwa kwa maana ya kisheria
  choice: mtu anayelala na dada yake
  alternative: mwanamume anayelala na dada yake
  rationale: Ingawa Kiebrania kina umbo la kiume umoja, “mtu” husikika kwa kawaida katika fomula ya jumla ya kisheria, huku “dada yake” ikihifadhi uhusiano wa jinsia uliotajwa na chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na uwazi. Muundo unahifadhi marudio ya kisheria ya “binti ya baba yake ... binti ya mama yake” na mwitikio wa pamoja wa kiliturujia. Hakuna tanbihi inayohitajika kwa sababu maana halisi imewekwa wazi katika matini kuu.
