  text: אָר֕וּר מַקְלֶ֥ה אָבִ֖י/ו וְ/אִמּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/016.yaml
  text: Cursed is the one who dishonors his father or his mother. And all the people shall say[a], “Amen.”
translation:
  language: sw
  text: “Amelaaniwa yeyote anayemvunjia heshima[a] baba yake au mama yake.” Na watu wote waseme, “Amina.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “anayemdharau,” “anayemwona kuwa si wa maana,” au “anayemtendea kwa dharau.” Kitenzi cha Kiebrania kina maana ya kumtendea mtu kana kwamba hana uzito, umuhimu, au heshima.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Amelaaniwa
  rationale: Ni umbo la kushiriki lenye maana ya hali ya mtu aliye chini ya laana, nalo linaanzisha tamko rasmi la laana ya agano.
- source_word: מַקְלֶה
  choice: anayemvunjia heshima
  rationale: Kitenzi hiki kinamaanisha kumfanya au kumhesabu mtu kuwa mwepesi, asiye na maana, au wa kudharauliwa. ‘Kumvunjia heshima’ linaeleza kwa Kiswahili cha kawaida uzito wa kosa la kijamii na kimaadili bila kulifunga katika hisia ya ndani peke yake.
- source_word: אָבִיו
  choice: baba yake
  rationale: Hili ni tafsiri ya moja kwa moja na ya kawaida ya nomino yenye kiambishi cha nafsi ya tatu umoja wa kiume.
- source_word: וְאִמּוֹ
  choice: au mama yake
  rationale: Ingawa kiunganishi cha Kiebrania kwa kawaida ni ‘na,’ katika tamko hili la kisheria wazazi wanatajwa kwa maana inayomhusu kila mmoja wao; ‘au’ linaonyesha kwamba kumvunjia heshima mzazi yeyote kunahusika.
- source_word: וְאָמַר
  choice: Na ... waseme
  rationale: Kiunganishi kinaendeleza mwitikio wa kiliturujia, na ‘waseme’ linafaa kwa agizo rasmi linalotolewa kwa watu wote.
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: Hufuata maandishi ya Kiebrania bila kuongeza ‘wa Israeli,’ jambo ambalo linaeleweka katika muktadha lakini halijaandikwa hapa.
- source_word: אָמֵן
  choice: Amina
  rationale: Hili ndilo umbo la kawaida la Kiswahili la mwitikio huu wa kiliturujia na linadumisha uzito wake wa kuthibitisha tamko la agano.
theological_decisions:
- issue: Asili ya kosa dhidi ya wazazi
  choice: Kosa limetafsiriwa kuwa kumvunjia mzazi heshima, likijumuisha kumtendea kama asiye na uzito au thamani.
  alternative: Kumdharau baba yake au mama yake; kumwona baba yake au mama yake kuwa si wa maana.
  rationale: Kitenzi cha Kiebrania kina wazo la kumfanya mtu kuwa ‘mwepesi’ au wa kudharauliwa. Tafsiri hii inaonyesha uzito wa kijamii na kimaadili unaohusiana na kuwaheshimu wazazi, bila kulifanya kosa liwe chuki ya moyoni tu au maneno ya laana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa tamko la laana na mwitikio wa watu umehifadhiwa kwa mtindo rasmi lakini wa kawaida.
