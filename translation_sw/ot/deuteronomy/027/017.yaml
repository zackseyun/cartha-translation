  yaml_path: translation/ot/deuteronomy/027/017.yaml
  text: Cursed is the one who moves his neighbor’s boundary marker. And all the people shall say[a], “Amen.”
translation:
  language: sw
  text: Amelaaniwa mtu anayehamisha alama ya mpaka wa jirani yake.[a] Na watu wote watasema, “Amina.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaweza kumaanisha mpaka wa mali au alama inayouonyesha.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Amelaaniwa
  rationale: Ni kivumishi cha kiarifu kinachoanzisha tamko rasmi la laana ya agano; ‘amelaaniwa’ ni wazi, ya heshima, na inadumisha uzito wa kisheria.
- source_word: מַסִּיג
  choice: mtu anayehamisha
  rationale: Kirai hiki kinawasilisha hali ya kishirikishi ya mtu anayefanya tendo hilo. ‘Anayehamisha’ linafaa kwa kusogeza alama ili kubadili mpaka, bila kulifinya kuwa kuiondoa kabisa.
- source_word: גְּבוּל
  choice: alama ya mpaka
  rationale: Katika muktadha wa ardhi na sheria, neno hili linahusu mpaka wa mali, ambao mara nyingi ulionyeshwa kwa alama halisi. ‘Alama ya mpaka’ linaeleza kosa kwa uwazi katika Kiswahili cha sasa.
- source_word: רֵעֵהוּ
  choice: wa jirani yake
  rationale: Neno hili humaanisha mwanajamii mwenzake katika miktadha ya kijamii na kisheria; ‘jirani yake’ ni la kawaida na linahifadhi kiambishi cha umilikaji cha umoja.
- source_word: וְאָמַר
  choice: Na ... watasema
  rationale: Kitenzi kinaendeleza utaratibu rasmi wa mwitikio wa watu katika kuthibitisha masharti ya agano; wakati ujao unasomeka kwa kawaida katika Kiswahili.
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: Hili linatafsiri maneno ya Kiebrania moja kwa moja bila kuongeza ‘wa Israeli,’ ingawa hilo linaeleweka kutokana na muktadha.
- source_word: אָמֵן
  choice: Amina
  rationale: ‘Amina’ ni mwitikio wa kiliturujia uliozoeleka katika Kiswahili na unahifadhi maana ya uthibitisho wa pamoja.
theological_decisions:
- issue: Tamko la laana katika muktadha wa sheria ya agano
  choice: Amelaaniwa mtu anayehamisha alama ya mpaka wa jirani yake
  alternative: Laana impate mtu anayesogeza mpaka wa jirani yake
  rationale: Tafsiri iliyochaguliwa inadumisha mfumo rasmi wa laana na uzito wa kosa la kujipatia ardhi ya mwingine kwa udanganyifu, huku ikitumia Kiswahili kinachoeleweka.
- issue: Jinsia ya kishirikishi na kiambishi cha umilikaji
  choice: mtu anayehamisha ... wa jirani yake
  alternative: yule anayehamisha ... wa jirani yake
  rationale: Kishirikishi cha Kiebrania ni cha kiume umoja lakini kinawakilisha mtu yeyote anayefanya kosa hilo. ‘Mtu anayehamisha’ kinahifadhi kesi ya kisheria ya umoja bila kudai kuwa hukumu inawahusu wanaume pekee; ‘yake’ kinadumisha umilikaji wa umoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa tamko rasmi la laana na mwitikio wa pamoja umehifadhiwa; alama ya tanbihi imewekwa mara tu baada ya kirai kinachofafanuliwa.
