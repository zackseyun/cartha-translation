  text: And there you shall build an altar to Yahweh your God[a], an altar of stones[b]; you shall not wield iron upon them.
translation:
  language: sw
  text: Na huko utamjengea Yahweh, Mungu wako, madhabahu ya mawe; usitumie chombo cha chuma juu ya mawe hayo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָנִיתָ שָּׁם
  choice: Na huko utamjengea
  rationale: Kitenzi katika muktadha wa maagizo kina nguvu ya amri ya wakati ujao. Kiambishi cha mtendewa katika “utamjengea” kinaonyesha kwa Kiswahili cha kawaida kwamba madhabahu inawekwa wakfu kwa Yahweh.
- source_word: מִזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida na lenye heshima kwa mahali pa kutolea dhabihu.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: Yahweh Mungu wako
  rationale: Jina la agano יהוה limetoholewa kuwa “Yahweh,” huku אֱלֹהֶיךָ ikitafsiriwa moja kwa moja “Mungu wako.”
- source_word: מִזְבַּח אֲבָנִים
  choice: madhabahu ya mawe
  rationale: Muundo huu huhifadhi bayana kwamba mawe ndiyo nyenzo ya madhabahu.
- source_word: לֹא תָנִיף עֲלֵיהֶם בַּרְזֶל
  choice: usitumie chombo cha chuma juu ya mawe hayo
  rationale: Ingawa בַּרְזֶל ni “chuma” kihalisi, katika muktadha huu chuma ni kifaa kinachotumiwa kuyafanyia mawe. Kutaja “chombo cha chuma” huwasilisha maana hiyo kwa Kiswahili cha asili bila kudai aina maalumu ya chombo.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni. “Yahweh” huhifadhi jina hilo la agano bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa moja kwa moja. Umoja umetumiwa kwa sababu maagizo ya Kiebrania yanamwelekea Israeli kwa nafsi ya pili umoja. “Juu ya mawe hayo” huhifadhi uhusiano wa עֲלֵיהֶם na mawe, huku “chombo cha chuma” kikifanya maana ya kifaa iwe wazi.
