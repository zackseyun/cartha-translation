  text: וְ/הָיָ֗ה בַּ/יּוֹם֮ אֲשֶׁ֣ר תַּעַבְר֣וּ אֶת הַ/יַּרְדֵּן֒ אֶל הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ וַ/הֲקֵמֹתָ֤ לְ/ךָ֙ אֲבָנִ֣ים גְּדֹל֔וֹת וְ/שַׂדְתָּ֥ אֹתָ֖/ם בַּ/שִּֽׂיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/002.yaml
  text: And on the day when you cross over the Jordan into the land that Yahweh your God is giving you[a], you shall set up for yourself large stones and plaster them with lime.
translation:
  language: sw
  text: Na siku mtakapovuka Yordani na kuingia katika nchi ambayo Yahwe Mungu wako anakupa, ujisimamishie mawe makubwa na kuyapaka chokaa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuyapaka plasta”; neno la Kiebrania linaweza kumaanisha chokaa au plasta inayotumiwa kama tabaka la kufunika.
    reason: Neno שִׂיד linaweza kutaja chokaa yenyewe au plasta inayotengenezwa kwa chokaa na kutumiwa kufunika sehemu.
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם אֲשֶׁר
  choice: Na siku
  rationale: Nahau hii ya Kiebrania inaanzisha hali ya wakati ujao. “Na siku” ni Kiswahili cha kawaida kinachohifadhi kiunganishi na maana ya wakati bila kutumia muundo mzito wa neno kwa neno.
- source_word: תַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: mtakapovuka Yordani
  rationale: Kitenzi עבר hapa kinaeleza kuvuka kutoka upande mmoja wa mto kwenda mwingine. Umbo la wingi “mtakapovuka” linafuata nafsi ya pili wingi katika Kiebrania.
- source_word: אֶל הָאָרֶץ
  choice: na kuingia katika nchi
  rationale: Kihusishi אֶל kinaeleza mwendo kuelekea na kuingia katika nchi. Neno “nchi” linafaa kwa eneo la ahadi katika muktadha wa Kumbukumbu la Torati.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama “BWANA,” hivyo kuhifadhi jina la agano lililo katika chanzo.
- source_word: נֹתֵן לָךְ
  choice: anakupa
  rationale: Hali ya kitenzi kishirikishi cha Kiebrania inaonyesha utoaji kama jambo linaloendelea au lililo hakika; wakati wa sasa wa Kiswahili unahifadhi maana hiyo.
- source_word: וַהֲקֵמֹתָ לְךָ
  choice: ujisimamishie
  rationale: Kitenzi cha Hifili kina maana ya kusimamisha au kuweka wima, na לְךָ huonyesha tendo linalofanywa kwa ajili ya mhusika. Umbo la umoja linahifadhi badiliko la Kiebrania kutoka wingi wa jumuiya kwenda umoja wa kuiwakilisha Israeli kwa pamoja.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: mawe makubwa
  rationale: Huu ni usemi wa kawaida na wazi wa Kiswahili kwa mawe yenye ukubwa mkubwa.
- source_word: וְשַׂדְתָּ אֹתָם בַּשִּׂיד
  choice: na kuyapaka chokaa
  rationale: Kitenzi kinaeleza kufunika mawe kwa kupaka, na שִׂיד ni chokaa au lipu iliyotumiwa kama tabaka la kufunika. “Kupaka chokaa” ni usemi wa asili na huepuka urudiaji mzito.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina maalumu la Mungu, si cheo. “Yahwe” hulihifadhi kama jina binafsi bila kuingiza desturi ya kulibadilisha na cheo.
- issue: Mabadiliko ya idadi ya wahusika katika hotuba
  choice: “mtakapovuka” (wingi), kisha “Mungu wako… ujisimamishie” (umoja)
  alternative: Kusawazisha vifungu vyote viwe vya wingi
  rationale: Kiebrania hubadilika kutoka nafsi ya pili wingi kwenda umoja, likisema na Israeli kama watu wengi na pia kama jumuiya moja. Tafsiri imehifadhi mvutano huo badala ya kuusawazisha kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Yordani” limetumiwa kama jina linalotambulika la mto, na “chokaa” ni neno la kawaida kuliko istilahi ya kiufundi. Mabadiliko ya wingi kwenda umoja yamehifadhiwa kwa sababu yako wazi katika chanzo cha Kiebrania.
