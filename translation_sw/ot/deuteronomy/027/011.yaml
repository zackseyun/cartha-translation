lexical_decisions:
- source_word: וַיְצַו
  choice: akawaamuru
  rationale: Kitenzi צוה kinaonyesha kutoa amri yenye mamlaka. “Akawaamuru” huhifadhi nguvu hiyo na pia huendeleza mtiririko wa simulizi.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” ndilo umbo la kawaida la jina hili katika Biblia na matumizi ya Kiswahili.
- source_word: אֶת הָעָם
  choice: watu
  rationale: עָם hapa inarejelea watu wa Israeli kwa ujumla. “Watu” ni tafsiri ya moja kwa moja na ya kawaida katika muktadha huu.
- source_word: בַּיּוֹם הַהוּא
  choice: Siku hiyo
  rationale: Kirai hiki ni kiashiria cha wakati. Kiswahili cha kawaida huweza kusema “Siku hiyo” bila kihusishi huku maana ya “katika siku hiyo” ikibaki wazi.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hiki kinatanguliza maneno ya amri yanayofuata. “Akisema” huhifadhi kiunganishi cha kisimulizi cha Kiebrania kwa lugha ya asili ya Kiswahili.
