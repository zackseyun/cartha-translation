base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/019.yaml
  text: Cursed is the one who perverts the justice due to the sojourner[a], the fatherless, and the widow. And all the people shall say[c][b], “Amen.”
translation:
  language: sw
  text: Amelaaniwa mtu anayepotosha haki inayowahusu mgeni[a], yatima[b], na mjane. Na watu wote waseme, “Amina.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mtu asiye mwenyeji anayeishi miongoni mwa Waisraeli.
    reason: cultural_note
  - marker: b
    text: Kwa maana halisi, “asiye na baba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Amelaaniwa
  rationale: Ni kauli ya laana ya agano; “amelaaniwa” ni ya kawaida, yenye uzito, na inaeleweka katika Kiswahili cha sasa.
- source_word: מַטֶּה
  choice: anayepotosha
  rationale: Kauli hii ya kisheria humaanisha kugeuza au kupinda haki; “anayepotosha” huonyesha kuvurugwa kwa haki bila kulazimisha njia maalumu ya uovu huo.
- source_word: מִשְׁפַּט
  choice: haki
  rationale: Katika muktadha huu neno linahusu haki au madai halali katika uamuzi wa kisheria. Kiswahili “haki” ni cha asili na kinaweza kubeba maana zote mbili.
- source_word: גֵּר
  choice: mgeni
  rationale: Neno la Kiebrania humaanisha mtu asiye mwenyeji anayeishi miongoni mwa Israeli. “Mgeni” ni tafsiri ya kawaida; tanbihi inaeleza maana yake mahsusi ya kijamii na kisheria.
- source_word: יָתוֹם
  choice: yatima
  rationale: “Yatima” ni neno la kawaida la Kiswahili kwa mtu aliyefiwa na mzazi au wazazi na linafaa katika kundi hili la watu walio katika mazingira hatarishi.
- source_word: אַלְמָנָה
  choice: mjane
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kundi hili la kijamii.
- source_word: וְאָמַר כָּל הָעָם
  choice: Na watu wote waseme
  rationale: Muundo huu katika ibada ya agano una nguvu ya agizo kuhusu jibu la pamoja; “waseme” ni ya asili na hudumisha maana hiyo.
- source_word: אָמֵן
  choice: Amina
  rationale: Hili ndilo neno la kiliturujia lililozoeleka katika Kiswahili na huhifadhi uzito wa kukubali laana ya agano.
theological_decisions:
- issue: Kutafsiri makundi matatu ya kijamii na kisheria bila kuyaingiza katika kategoria za kisiasa za kisasa
  choice: mgeni, yatima, na mjane
  alternative: mkaaji asiye mwenyeji, asiye na baba, na mjane
  rationale: Chaguo hili ni la kawaida na lenye kueleweka katika Kiswahili, huku tanbihi ikihifadhi maana ya kihistoria ya גֵּר. Halibadili makundi ya agano kuwa istilahi za sera za kisasa.
- issue: Nguvu ya kauli ya watu wote
  choice: waseme
  alternative: watasema
  rationale: Muktadha ni maagizo ya sherehe ya agano. Hivyo hali ya kuamuru “waseme” inafaa kuliko taarifa tu ya wakati ujao, ingawa muundo wa Kiebrania unaweza kueleweka ndani ya mfuatano wa sherehe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kusomeka. Muundo mfupi wa laana ya agano na jibu la pamoja umehifadhiwa. Alama zote za tanbihi zimo katika matini kuu.
