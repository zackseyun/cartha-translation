source:
  edition: WLC
  text: וְ/כָתַבְתָּ֣ עֲלֵי/הֶ֗ן אֶֽת כָּל דִּבְרֵ֛י הַ/תּוֹרָ֥ה הַ/זֹּ֖את בְּ/עָבְרֶ֑/ךָ לְמַ֡עַן אֲשֶׁר֩ תָּבֹ֨א אֶל הָ/אָ֜רֶץ אֲֽשֶׁר יְהוָ֥ה אֱלֹהֶ֣י/ךָ נֹתֵ֣ן לְ/ךָ֗ אֶ֣רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֶ֖י/ךָ לָֽ/ךְ־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/003.yaml
  text: And you shall write on them all the words of this law when you cross over[a], so that you may enter the land that Yahweh your God is giving you, a land flowing with milk and honey, just as Yahweh, the God of your fathers[b], spoke to you.
translation:
  language: sw
  text: Nawe utaandika juu ya mawe hayo maneno yote ya sheria[a] hii utakapovuka, ili uingie katika nchi ambayo Yahwe Mungu wako anakupa—nchi inayotiririka kwa maziwa na asali—kama Yahwe, Mungu wa baba zako[b], alivyosema nawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maneno yote ya maagizo haya.” Neno la Kiebrania torah linaweza kumaanisha “maagizo” au “mafundisho,” pamoja na “sheria”; hapa “sheria” inafaa katika muktadha wa agano.
    reason: lexical_alternative
  - marker: b
    text: Au, “Mungu wa mababu zako.” Kiebrania kinasema kihalisi “baba zako,” kauli ya agano inayotumiwa mara kwa mara katika Kumbukumbu la Torati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ
  choice: Nawe utaandika
  rationale: Kitenzi timilifu cha Kiebrania chenye kiunganishi katika muktadha huu wa maagizo kina nguvu ya amri. Wakati ujao wa Kiswahili unahifadhi mtindo wa agizo la agano bila kuwa mgumu.
- source_word: עֲלֵיהֶן
  choice: juu yake
  rationale: Kiwakilishi kinarejelea mawe yaliyotajwa katika mstari uliotangulia. Kiswahili hutumia muundo wa mahali ‘juu yake’ kwa njia ya kawaida katika rejeleo hili.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: maneno yote ya sheria hii
  rationale: ‘Maneno yote’ huhifadhi דִּבְרֵי kwa karibu. Katika muktadha wa agano wa Kumbukumbu la Torati, ‘sheria’ inafaa kwa תּוֹרָה, huku maana mbadala ya ‘maagizo’ ikibainishwa katika tanbihi.
- source_word: בְּעָבְרֶךָ
  choice: utakapovuka
  rationale: Kihusishi pamoja na kitenzi-jina huonyesha wakati. ‘Utakapovuka’ ni Kiswahili cha kawaida na hudokeza kuvuka Yordani bila kuongeza jina lisilokuwamo katika mstari.
- source_word: לְמַעַן אֲשֶׁר תָּבֹא
  choice: ili uingie
  rationale: Muundo huu unaonyesha kusudi au matokeo; ‘ili uingie’ huhifadhi uhusiano huo bila kuamua zaidi kati ya vivuli hivyo viwili.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahwe Mungu wako
  rationale: Jina la agano יְהוָה limetafsiriwa kwa namna ya jina ‘Yahwe,’ na אֱלֹהֶיךָ kwa ‘Mungu wako.’
- source_word: נֹתֵן לְךָ
  choice: anakupa
  rationale: Kauli ya wakati unaoendelea ya Kiebrania inaonyesha zawadi hiyo kuwa ya sasa na hakika; ‘anakupa’ huhifadhi hali hiyo.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: nchi inayotiririka maziwa na asali
  rationale: Huhifadhi taswira ya Kiebrania ya wingi na ustawi kwa usemi unaoeleweka katika Kiswahili.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: kama ... alivyokuambia
  rationale: דִּבֶּר maana yake ni ‘alisema/alinena,’ si ‘aliahidi’ moja kwa moja. ‘Alivyokuambia’ ni ya kawaida na huepuka kuingiza neno ‘aliahidi,’ ingawa ahadi inadokezwa na muktadha.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: Mungu wa baba zako
  rationale: ‘Baba zako’ huhifadhi wingi wa kiume wa chanzo na mtindo wa agano unaotumiwa mara kwa mara katika Kumbukumbu la Torati.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la agano YHWH. ‘Yahwe’ hulitambulisha kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya תּוֹרָה katika muktadha wa agano
  choice: sheria
  alternative: maagizo au mafundisho
  rationale: ‘Sheria’ inafaa katika muktadha huu wa maagizo ya agano, lakini upana halisi wa neno תּוֹרָה umehifadhiwa katika tanbihi.
- issue: Uwasilishaji wa אֲבֹתֶיךָ
  choice: baba zako
  alternative: mababu zako au wazee wako wa kale
  rationale: Chanzo kinasema kihalisi ‘baba zako’ katika kauli ya agano; tafsiri hiyo huhifadhi lugha ya ukoo bila kuzuia kwamba inawahusu wahenga.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa amri, taswira ya ‘maziwa na asali,’ jina Yahwe, na mvutano wa kusudi/matokeo katika ‘ili’ vimehifadhiwa.
