revisions:
- from: Nawe utaandika juu yake maneno yote ya sheria[a] hii utakapovuka, ili uingie katika nchi ambayo Yahwe Mungu wako anakupa—nchi inayotiririka maziwa na asali—kama Yahwe, Mungu wa baba zako[b], alivyokuambia.
  to: Nawe utaandika juu ya mawe hayo maneno yote ya sheria[a] hii utakapovuka, ili uingie katika nchi ambayo Yahwe Mungu wako anakupa—nchi inayotiririka kwa maziwa na asali—kama Yahwe, Mungu wa baba zako[b], alivyosema nawe.
  rationale: The revision corrects the Swahili abundance idiom, brings the final clause closer to the Hebrew ‘spoke to you,’ clarifies the plural antecedent of ‘on them’ without altering the contextual reference to the preceding stones, and makes footnote a correspond fully to the Hebrew wording.
