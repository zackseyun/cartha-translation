source:
  edition: WLC
  text: אֵ֠לֶּה יַֽעַמְד֞וּ לְ/בָרֵ֤ךְ אֶת הָ/עָם֙ עַל הַ֣ר גְּרִזִ֔ים בְּ/עָבְרְ/כֶ֖ם אֶת הַ/יַּרְדֵּ֑ן שִׁמְעוֹן֙ וְ/לֵוִ֣י וִֽ/יהוּדָ֔ה וְ/יִשָּׂשכָ֖ר וְ/יוֹסֵ֥ף וּ/בִנְיָמִֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/012.yaml
  text: 'These shall stand on Mount Gerizim to bless the people when you cross the Jordan: Simeon[a], Levi, Judah, Issachar, Joseph, and Benjamin.'
translation:
  language: sw
  text: 'Hawa watasimama juu ya Mlima Gerizimu ili kuwabariki watu mtakapovuka Yordani: Simeoni, Lawi, Yuda, Isakari, Yosefu[a] na Benyamini.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika orodha hii ya makabila, Yosefu anawakilisha makabila yaliyotokana naye, yaani Efraimu na Manase.
    reason: cross_reference
lexical_decisions:
- source_word: אֵלֶּה
  choice: Hawa
  rationale: Kiwakilishi cha kuonyesha cha wingi kinawatambulisha moja kwa moja wale waliotajwa katika orodha inayofuata.
- source_word: יַעַמְדוּ
  choice: watasimama
  rationale: Kauli ya wakati ujao katika muktadha huu wa maagizo inaeleza kitendo walichopaswa kufanya katika ibada hiyo bila kulazimisha neno lisilo la kawaida.
- source_word: לְבָרֵךְ
  choice: ili kuwabariki
  rationale: Muundo wa ל pamoja na kitenzi-jina unaonyesha kusudi la kusimama kwao.
- source_word: הָעָם
  choice: watu
  rationale: Neno hili linarejelea jumuiya ya Israeli kwa pamoja; “watu” ni tafsiri ya kawaida na ya asili.
- source_word: עַל הַר גְּרִזִים
  choice: juu ya Mlima Gerizimu
  rationale: Hueleza mahali ambapo makabila hayo yangesimama; jina la mahali limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: בְּעָבְרְכֶם
  choice: mtakapovuka
  rationale: 'Kiambishi ב pamoja na kitenzi-jina na kiambishi cha nafsi ya pili wingi kina maana ya wakati: “wakati mtakapovuka.”'
- source_word: אֶת הַיַּרְדֵּן
  choice: Yordani
  rationale: Jina lenyewe linatosha katika matumizi ya kibiblia; kuongeza “Mto” si lazima kwa uwazi.
- source_word: שִׁמְעוֹן וְלֵוִי וִיהוּדָה וְיִשָּׂשכָר וְיוֹסֵף וּבִנְיָמִן
  choice: Simeoni, Lawi, Yuda, Isakari, Yosefu na Benyamini
  rationale: Majina yametolewa kwa maumbo ya Kiswahili yanayotambulika na kwa mpangilio wa maandishi ya Kiebrania.
theological_decisions:
- issue: Nguvu ya agizo kuhusu mahali na jukumu la makabila
  choice: “watasimama ... ili kuwabariki watu”
  alternative: “wasimame ... ili kuwabariki watu”
  rationale: Wakati ujao wa Kiebrania umo ndani ya maagizo ya Musa kuhusu ibada itakayofanyika baadaye. “Watasimama” huhifadhi umbo hilo huku muktadha ukitoa nguvu ya agizo.
- issue: Maana ya Yosefu katika orodha ya makabila
  choice: Jina “Yosefu” limehifadhiwa katika maandishi makuu
  alternative: “makabila ya Yosefu” au “Efraimu na Manase”
  rationale: Maandishi ya Kiebrania yanamtaja Yosefu moja kwa moja. Ufafanuzi kuwa jina hilo linawakilisha makabila yanayotokana naye umewekwa katika tanbihi badala ya kuongezwa katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Muundo umefuata maandishi ya Kiebrania kwa karibu bila kuwa mgumu; alama ya tanbihi imewekwa baada ya “Yosefu,” neno linalofafanuliwa.
