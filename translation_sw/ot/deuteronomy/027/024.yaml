  yaml_path: translation/ot/deuteronomy/027/024.yaml
  text: Cursed is the one who strikes down his neighbor in secret. And all the people shall say[a], “Amen.”
translation:
  language: sw
  text: “Amelaaniwa mtu anayempiga mwenzake kwa siri.[a]” Na watu wote waseme, “Amina.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayemuua”; kitenzi cha Kiebrania kinaweza kumaanisha kupiga kwa nguvu yenye kudhuru au kuua.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Amelaaniwa
  rationale: Ni kauli ya hali inayotangaza laana ya agano; “amelaaniwa” ni ya kawaida, wazi, na inafaa mfuatano wa kiliturujia.
- source_word: מַכֵּה
  choice: anayempiga na kumwangusha
  rationale: Kitenzi נכה kinaweza kumaanisha kupiga kwa nguvu yenye kudhuru au hata kuua. Kauli hii inaonyesha uzito wa shambulio bila kulifanya kwa lazima kuwa mauaji.
- source_word: רֵעֵהוּ
  choice: mwenzake
  rationale: רֵעַ humaanisha mtu mwingine wa jamii, jirani, au mshirika. “Mwenzake” ni pana na ya asili katika Kiswahili bila kudokeza tu ukaribu wa makazi.
- source_word: בַּסָּתֶר
  choice: kwa siri
  rationale: Inaonyesha tendo lililofichwa lisifanyike hadharani; “kwa siri” ni kauli ya kawaida na ya moja kwa moja.
- source_word: וְאָמַר
  choice: Na ... waseme
  rationale: Katika utaratibu huu wa sherehe, umbo hilo linaelekeza jibu la watu. “Waseme” linatoa agizo la pamoja kwa mtindo wa heshima na wa kiliturujia.
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: Hutafsiri maneno ya Kiebrania moja kwa moja bila kuongeza “wa Israeli,” ingawa hilo linaeleweka kutokana na muktadha.
- source_word: אָמֵן
  choice: Amina
  rationale: “Amina” ndilo tamko la kiliturujia lililozoeleka katika Kiswahili na linahifadhi nguvu ya kukubaliana na tamko la agano.
theological_decisions:
- issue: Kiwango cha ukatili katika מַכֵּה
  choice: anayempiga na kumwangusha
  alternative: anayempiga; anayemuua
  rationale: Kitenzi cha Kiebrania kina wigo unaoanzia kupiga hadi kutumia nguvu inayoua. Tafsiri iliyochaguliwa inadumisha uzito wa tendo katika orodha hii ya laana, lakini haifungi maana kwenye mauaji pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Mpangilio wa tamko na jibu la watu umehifadhiwa; alama ya tanbihi imewekwa mara tu baada ya kishazi kinachohusika.
