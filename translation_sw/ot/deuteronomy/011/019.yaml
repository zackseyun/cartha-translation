base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/019.yaml
  text: You shall teach them to your children[a], speaking of them when you sit in your house, and when you walk on the road, and when you lie down, and when you rise up.
translation:
  language: sw
  text: Wafundisheni watoto wenu[a] mambo hayo, kwa kuyazungumzia unapoketi nyumbani mwako, unapotembea njiani, unapojilaza, na unapoamka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wana wenu.” Kiebrania kinatumia umbo la wingi wa kiume ambalo linaweza kuwawakilisha watoto wote wa mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִמַּדְתֶּם
  choice: Wafundisheni
  rationale: Piel ya למד humaanisha ‘fundisha.’ Umbo la amri kwa wingi linaendeleza nguvu ya maagizo katika muktadha, huku kiunganishi ו kikibebwa kwa mtiririko wa Kiswahili bila kulazimisha ‘na’ mwanzoni.
- source_word: אֹתָם
  choice: hayo
  rationale: Kiwakilishi cha Kiebrania cha wingi kinarejelea maneno au maagizo yaliyotangulia. ‘Hayo’ huhifadhi urejeleaji huo bila kutaja tena nomino katika matini kuu.
- source_word: אֶת־בְּנֵיכֶם
  choice: watoto wenu
  rationale: בנים inaweza kumaanisha ‘wana’ kwa maana finyu au ‘watoto’ kwa maana pana. Katika muktadha huu wa kuwafundisha wazao wa Israeli, ‘watoto wenu’ huwasilisha maana wakilishi kwa Kiswahili cha kawaida.
- source_word: לְדַבֵּר בָּם
  choice: mkizungumza kuyahusu
  rationale: Kitenzi-jina chenye ל kinaonyesha namna inayoandamana na kufundisha. ‘Mkizungumza kuyahusu’ ni ya asili kwa Kiswahili na inaunganisha kiwakilishi na maneno au maagizo yaliyotangulia.
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: mnapoketi nyumbani mwenu
  rationale: 'ב pamoja na kitenzi-jina huonyesha wakati: ‘mnapoketi.’ ‘Nyumbani mwenu’ ni usemi wa asili unaowasilisha mahali panapokusudiwa na בְּבֵיתֶךָ.'
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: mnapotembea njiani
  rationale: הלך ni ‘kwenda/kutembea,’ na בַדֶּרֶךְ ni ‘njiani.’ Tafsiri hii ni wazi, fupi, na ya kisasa.
- source_word: וּבְשָׁכְבְּךָ
  choice: mnapolala
  rationale: שכב hapa huonyesha kulala au kujilaza. ‘Mnapolala’ ni ya kawaida kwa Kiswahili na hudumisha mazingira ya wakati bila ufafanuzi usio wa lazima.
- source_word: וּבְקוּמֶךָ
  choice: mnapoamka
  rationale: קום katika jozi hii na kulala hurejelea kuinuka baada ya usingizi au pumziko. ‘Mnapoamka’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Lugha ya kijinsia katika בְּנֵיכֶם
  choice: watoto wenu
  alternative: wana wenu
  rationale: Wingi wa kiume unaweza kutumiwa kwa namna wakilishi kuhusu wazao kwa ujumla. ‘Watoto wenu’ huonyesha upeo wa mafundisho ya agano bila kuwadokeza binti kuwa wametengwa; tanbihi huhifadhi uwezekano wa tafsiri halisi ‘wana wenu.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Msururu wa ‘mnapo-’ huhifadhi urari na mwendo wa vifungu vya Kiebrania. Kiwakilishi cha mhusika kimewekwa katika wingi kulingana na maandishi ya Kiebrania.
