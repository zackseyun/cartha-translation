base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/003.yaml
  text: and his signs and his deeds that he did in the midst of Egypt[c][b][a], to Pharaoh king of Egypt and to all his land—
translation:
  language: sw
  text: na ishara zake[a] na matendo yake aliyoyafanya katikati ya Misri[b], kwa Farao mfalme wa Misri na kwa nchi yake yote[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maajabu yake” badala ya “ishara zake.”
    reason: lexical_alternative
  - marker: b
    text: Au “ndani ya Misri”; Kiebrania kihalisi zaidi, “katikati ya Misri.”
    reason: lexical_alternative
  - marker: c
    text: Au “dhidi ya Farao ... na dhidi ya nchi yake yote.” Kihusishi cha Kiebrania kihalisi ni “kwa,” lakini muktadha unahusu matendo ya hukumu yaliyoelekezwa kwao.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹתֹתָיו
  choice: ishara zake
  rationale: אוֹת kwa kawaida humaanisha ishara, alama, au tukio lenye maana maalumu. “Ishara zake” ni tafsiri ya moja kwa moja na haiongezi waziwazi neno “miujiza,” ingawa muktadha unaonyesha matendo ya ajabu ya Mungu.
- source_word: מַעֲשָׂיו
  choice: matendo yake
  rationale: מַעֲשֶׂה hurejelea jambo lililofanywa, tendo, au kazi. “Matendo yake” ni Kiswahili cha kawaida na chenye heshima kinachohifadhi maana halisi.
- source_word: אֲשֶׁר עָשָׂה
  choice: aliyoyafanya
  rationale: Kishazi hiki kinarejelea “ishara” na “matendo.” Muundo wa ngeli nyingi “aliyoyafanya” unaviunganisha kwa Kiswahili cha asili bila kuongeza tafsiri.
- source_word: בְּתוֹךְ מִצְרַיִם
  choice: katikati ya Misri
  rationale: בְּתוֹךְ humaanisha kihalisi “katikati ya” au “ndani ya.” Tafsiri hii inadumisha msisitizo wa Kiebrania kwamba matendo hayo yalitendeka ndani ya Misri.
- source_word: לְפַרְעֹה
  choice: kwa Farao
  rationale: Kihusishi לְ kinaonyesha mlengwa au aliyeathiriwa na matendo. “Kwa Farao” kinadumisha upana wa muundo wa Kiebrania; maana ya “dhidi ya Farao” inawezekana kutokana na muktadha na imeelezwa katika tanbihi.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: mfalme wa Misri
  rationale: Huu ni muundo wa kawaida wa kumtambulisha Farao, na hauna utata maalumu.
- source_word: וּלְכָל אַרְצוֹ
  choice: na kwa nchi yake yote
  rationale: אֶרֶץ inaweza kumaanisha nchi au ardhi. “Nchi yake yote” ni ya kawaida katika Kiswahili na inafaa kwa eneo lote lililotawaliwa na Farao.
- source_word: וְאֶת ... וְאֶת
  choice: na ... na
  rationale: אֵת ni kiashiria cha yambwa na hakitafsiriwi moja kwa moja, lakini viunganishi vinavyorudiwa vinahifadhiwa ili kuendeleza orodha kutoka mstari uliotangulia.
theological_decisions:
- issue: Maana ya לְ kabla ya Farao na nchi yake
  choice: kwa Farao ... na kwa nchi yake yote
  alternative: dhidi ya Farao ... na dhidi ya nchi yake yote
  rationale: Kihusishi cha Kiebrania ni kipana kuliko “dhidi ya.” Tafsiri kuu inahifadhi umbo hilo, huku tanbihi ikionyesha maana ya hukumu inayoelekezwa kwao katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mstari umeachwa kama mwendelezo wa sentensi kutoka aya iliyotangulia, na kistari mwishoni kinadumisha mwendelezo kwenda aya inayofuata.
