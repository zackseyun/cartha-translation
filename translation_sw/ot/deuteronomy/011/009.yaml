base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/009.yaml
  text: so that you may live long on the land that Yahweh swore to your fathers to give to them and to their offspring[b][a], a land flowing with milk and honey.
translation:
  language: sw
  text: ili mpate kuishi siku nyingi katika nchi ambayo Yahwe aliowaapia baba zenu kuwapa wao na uzao wao[b]—nchi itiririkayo maziwa na asali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Au, “mbegu yao” au “wazao wao.” Neno la Kiebrania linaweza kumaanisha uzao kwa pamoja au wazao kwa maana pana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמַעַן
  choice: ili
  rationale: Huonyesha kusudi au matokeo kwa Kiswahili cha kawaida na kwa ufupi.
- source_word: תַּאֲרִיכוּ יָמִים
  choice: mpate kuishi siku nyingi
  rationale: Ni uwasilishaji wa asili wa nahau ya Kiebrania yenye maana ya kuishi muda mrefu, huku ikidumisha taswira ya ‘siku nyingi.’
- source_word: עַל הָאֲדָמָה
  choice: katika nchi
  rationale: Katika muktadha wa Kumbukumbu la Torati, הָאֲדָמָה ni nchi waliyoahidiwa, si udongo tu; ‘katika nchi’ ni Kiswahili cha kawaida.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: ambayo Yahwe aliwaapia
  rationale: Hudumisha kishazi rejeshi na uzito wa kiapo; kiambishi ‘-wa-’ kinaonyesha kwamba kiapo kilielekezwa kwa baba zao.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha moja kwa moja jina la agano יהוה kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: לַאֲבֹתֵיכֶם
  choice: baba zenu
  rationale: Hufuata neno la Kiebrania kwa ukaribu; tanbihi inaonyesha maana pana inayowezekana ya mababu.
- source_word: לָתֵת לָהֶם וּלְזַרְעָם
  choice: kwamba angewapa wao na uzao wao
  rationale: ‘Uzao’ huhifadhi hali ya pamoja ya זֶרַע bila kuilazimisha iwe ‘wazao’; ‘wao’ imedumishwa kwa sababu iko wazi katika chanzo.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: nchi inayotiririka maziwa na asali
  rationale: Hudumisha taswira ya Kiebrania ya wingi na rutuba kwa usemi unaoeleweka na uliozoeleka katika Kiswahili cha Biblia.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja; ‘Yahwe’ huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Walengwa wa ahadi ya nchi
  choice: angewapa wao na uzao wao
  alternative: angewapa wazao wao
  rationale: Kiebrania kinawataja baba wenyewe pamoja na uzao wao. Tafsiri haifuti mvutano huo kwa kuifanya ahadi ihusu wazao pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi hudumisha kiapo, wapokeaji wake, na taswira ya nchi yenye wingi bila kuwa mgumu kupita kiasi.
