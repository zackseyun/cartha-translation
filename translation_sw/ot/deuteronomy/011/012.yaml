base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/012.yaml
  text: a land that Yahweh your God cares for; the eyes of Yahweh your God are continually on it[a], from the beginning of the year to the end of the year.
translation:
  language: sw
  text: nchi ambayo Yahweh Mungu wako huitunza[a]; macho ya Yahweh Mungu wako yako juu yake daima, tangu mwanzo wa mwaka hadi mwisho wa mwaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huiitafuta” au “huiangalia kwa uangalifu.” Kitenzi cha Kiebrania kinaweza kumaanisha kutafuta, kuulizia, au kutunza; hapa kinaonyesha uangalizi hai wa Yahweh kwa nchi hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: nchi
  rationale: Katika muktadha huu neno hilo linamaanisha nchi au eneo la ahadi, si dunia yote.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano la Mungu limehifadhiwa kwa uandishi wa karibu na jina la Kiebrania.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Kiambishi cha nafsi ya pili umoja wa kiume kinaelekezwa kwa Israeli kwa usemi wa umoja.
- source_word: דֹּרֵשׁ אֹתָהּ
  choice: huitunza
  rationale: Kitenzi דרש kinaweza kumaanisha kutafuta au kuulizia, lakini hapa, nchi ikiwa ndiyo kitu kinacholengwa, kinaonyesha kujishughulisha nayo na kuiangalia kwa uangalifu.
- source_word: תָּמִיד
  choice: daima
  rationale: Neno hili linaonyesha hali inayoendelea katika kipindi chote kinachotajwa; ‘daima’ ni la kawaida, lenye hadhi, na linaendana na mwanzo hadi mwisho wa mwaka.
- source_word: עֵינֵי יְהוָה אֱלֹהֶיךָ בָּהּ
  choice: macho ya Yahweh Mungu wako yako juu yake
  rationale: Taswira ya Kiebrania ya macho ya Mungu imehifadhiwa, huku ‘juu yake’ ikitoa kwa Kiswahili maana ya uangalizi wa karibu.
- source_word: מֵרֵשִׁית הַשָּׁנָה וְעַד אַחֲרִית שָׁנָה
  choice: tangu mwanzo wa mwaka hadi mwisho wa mwaka
  rationale: Usemi huu unaonyesha kipindi kizima cha mwaka kwa Kiswahili cha kawaida na sahihi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi יהוה; ‘Yahweh’ hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Taswira ya macho ya Mungu
  choice: macho ya Yahweh Mungu wako yako juu yake
  alternative: Yahweh Mungu wako huiangalia daima
  rationale: Uamuzi huu unahifadhi lugha ya kimfano ya maandishi bila kuifafanua na kuiondoa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mstari na taswira ya Kiebrania zimehifadhiwa, lakini sentensi imetolewa kwa mtiririko wa kawaida wa Kiswahili.
