  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ֤י יְבִֽיאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ וְ/נָתַתָּ֤ה אֶת הַ/בְּרָכָה֙ עַל הַ֣ר גְּרִזִ֔ים וְ/אֶת הַ/קְּלָלָ֖ה עַל הַ֥ר עֵיבָֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/029.yaml
  text: And when Yahweh your God brings you into the land that you are entering to possess[a], you shall set the blessing on Mount Gerizim and the curse on Mount Ebal.
translation:
  language: sw
  text: Yahwe Mungu wako atakapokuingiza katika nchi unayoingia kuimiliki, utaweka[a] baraka juu ya Mlima Gerizimu na laana juu ya Mlima Ebali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utatamka baraka juu ya Mlima Gerizimu na laana juu ya Mlima Ebali.” Kiebrania kinasema kihalisi “toa/weka,” na utaratibu kamili wa sherehe unaelezwa katika muktadha unaozunguka mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: atakapo-
  rationale: Muundo huu wa Kiebrania unaanzisha hali ya wakati ujao. Kiambishi cha wakati “atakapo-” kinatoa maana ya “wakati ambapo” kwa Kiswahili cha kawaida bila kunakili muundo wa Kiebrania neno kwa neno.
- source_word: יְבִיאֲךָ
  choice: atakapokuingiza
  rationale: Hifili ya בוא ina maana ya kisababishi, yaani “kuingiza” au “kuleta ndani.” “Atakapokuingiza” huhifadhi maana hiyo na inafaa katika sentensi ya wakati ujao.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huu ni muundo wenye kiambishi cha nafsi ya pili umoja, unaoonyesha uhusiano wa agano.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika Kumbukumbu la Torati neno hili humaanisha nchi iliyoahidiwa; “nchi” ni la kawaida na sahihi katika Kiswahili.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: unayoingia
  rationale: Kitenzi shirikishi pamoja na kiashirio cha kuelekea huko kinaonyesha kuingia kunakotarajiwa; “unayoingia” ni wazi na asilia.
- source_word: לְרִשְׁתָּהּ
  choice: kuimiliki
  rationale: ירשׁ hapa ina maana ya kuitwaa nchi iwe mali yao. “Kuimiliki” ni fupi na huhifadhi wazo la kupata umiliki.
- source_word: וְנָתַתָּה
  choice: utaweka
  rationale: נתן kwa msingi ni “kutoa/kuweka.” “Utaweka” huhifadhi taswira halisi bila kuamua kimyakimya kwamba tendo lenyewe lilikuwa kutamka tu.
- source_word: הַבְּרָכָה
  choice: baraka
  rationale: Nomino maalumu katika muktadha inarejelea baraka ya agano iliyotajwa.
- source_word: עַל הַר גְּרִזִים
  choice: juu ya Mlima Gerizimu
  rationale: “Juu ya” huhifadhi uhusiano wa mahali wa עַל, na Gerizimu ni umbo la kawaida la jina hilo katika Kiswahili.
- source_word: הַקְּלָלָה
  choice: laana
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa kinyume cha baraka katika muktadha wa agano.
- source_word: עַל הַר עֵיבָל
  choice: juu ya Mlima Ebali
  rationale: Huu ni muundo sambamba na ule wa Mlima Gerizimu na huhifadhi uhusiano wa mahali.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Tendo la agano linalohusisha baraka na laana
  choice: utaweka baraka ... na laana ...
  alternative: utatamka baraka ... na laana ...
  rationale: Kiebrania kinatumia נתן, “kutoa/kuweka,” na kuhusisha baraka na laana na milima hiyo miwili. Tafsiri kuu huhifadhi usemi huo wa wazi huku tanbihi ikionyesha uwezekano wa tendo la kutamka katika sherehe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa wakati umetolewa kwa kiambishi asilia “atakapo-,” huku maneno halisi ya tendo la agano yakihifadhiwa bila kufafanuliwa kupita kiasi.
