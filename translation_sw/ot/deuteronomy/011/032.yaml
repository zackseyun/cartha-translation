  yaml_path: translation/ot/deuteronomy/011/032.yaml
  text: And you shall be careful to do all the statutes and the judgments that I am setting before you today[a].
translation:
  language: sw
  text: Nanyi mtakuwa waangalifu kuzifanya sheria zote na hukumu ambazo ninaweka mbele yenu leo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno zaidi, “ambazo ninatoa mbele yenu leo”; nahau ya Kiebrania ina maana ya “ambazo ninaweka mbele yenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם
  choice: mtakuwa waangalifu
  rationale: Katika muundo unaofuatwa na לַעֲשׂוֹת, kitenzi שׁמר kina maana ya kuwa mwangalifu au kuhakikisha kwamba jambo linafanywa, huku wakati ujao ukihifadhi nguvu ya agizo la agano.
- source_word: לַ/עֲשׂוֹת
  choice: kuzifanya
  rationale: עשה ni kitenzi cha kawaida cha kutekeleza maagizo; 'kuzifanya' ni cha moja kwa moja na kinaendana na vitu vya wingi vinavyofuata.
- source_word: כָּל
  choice: zote
  rationale: Huhifadhi msisitizo wa ujumla na ukamilifu wa matakwa.
- source_word: הַֽ/חֻקִּים
  choice: sheria
  rationale: חֻקִּים humaanisha masharti au sheria zilizowekwa; 'sheria' ni neno la kawaida, lenye heshima na linaloeleweka katika Kiswahili cha sasa.
- source_word: וְ/אֶת הַ/מִּשְׁפָּטִים
  choice: na hukumu
  rationale: '''Hukumu'' hudumisha tofauti ya kileksia na חֻקִּים na kuonyesha maamuzi au masharti ya kisheria, ingawa neno linaweza pia kumaanisha uamuzi wa mahakama.'
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לִ/פְנֵי/כֶם
  choice: ambazo ninaweka mbele yenu
  rationale: Ingawa נתן ni 'kutoa' kwa maana ya msingi, pamoja na לִפְנֵי huunda nahau ya kuwasilisha au kuweka jambo mbele ya watu; tafsiri hii pia huhifadhi hali ya tendo linaloendelea.
- source_word: הַ/יּוֹם
  choice: leo
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja inayohifadhi uharaka wa wakati wa hotuba ya agano.
theological_decisions: []
