id: DEU.11.13
reference: Deuteronomy 11:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם שָׁמֹ֤עַ תִּשְׁמְעוּ֙ אֶל מִצְוֺתַ֔/י אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּ֑וֹם לְ/אַהֲבָ֞ה אֶת יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ וּ/לְ/עָבְד֔/וֹ בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/013.yaml
  text: And if you indeed listen to my commandments that I am commanding you today[a], to love Yahweh your God and to serve him with all your heart and with all your soul[c][b],
translation:
  language: sw
  text: Basi, ikiwa mtazisikiliza kwa makini amri zangu ninazowaamuru leo[a]—kumpenda Yahwe[b] Mungu wenu na kumtumikia kwa moyo wenu wote na kwa nafsi yenu yote[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina usemi wenye mkazo, kihalisi “ikiwa mtasikiliza kwa kusikiliza”; katika muktadha huu unaweza pia kumaanisha “ikiwa mtatii kwa makini.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania YHWH, jina la Mungu; kwa mapokeo mara nyingi limetafsiriwa “BWANA.”
    reason: lexical_alternative
  - marker: c
    text: Au “kwa uhai wenu wote” au “kwa utu wenu wote.” Neno la Kiebrania linalotafsiriwa “nafsi” linaweza kumaanisha uhai au mtu mzima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Basi, ikiwa
  rationale: Kirai hiki kinaanzisha sharti ambalo jibu lake linaendelea katika mstari unaofuata. “Basi, ikiwa” ni Kiswahili cha kawaida kinachohifadhi kazi hiyo ya kiunganishi bila tafsiri ngumu ya neno kwa neno.
- source_word: שָׁמֹעַ תִּשְׁמְעוּ
  choice: mtazisikiliza kwa makini
  rationale: Muundo wa kitenzi na jina-kitenzi la mzizi huongeza mkazo. “Kusikiliza kwa makini” huhifadhi picha ya kusikia huku muktadha ukidokeza kuitikia kwa utii.
- source_word: אֶל מִצְוֺתַי
  choice: amri zangu
  rationale: “Amri” ni neno la kawaida na lenye heshima kwa masharti yaliyoamriwa katika agano.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: ninazowaamuru leo
  rationale: Wakati wa sasa unaonyesha tendo la Musa la kuwaagiza wasikilizaji wakati wa hotuba hii; “leo” limehifadhiwa kama alama muhimu ya wakati wa agano.
- source_word: לְאַהֲבָה
  choice: kumpenda
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kusudi au maudhui ya kuitikia amri.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa umbo linalofaa matamshi na tahajia ya Kiswahili badala ya kubadilishwa na cheo “BWANA.”
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Hii huhifadhi namna ya agano ya kumtaja Yahwe kuwa Mungu wa wasikilizaji.
- source_word: וּלְעָבְדוֹ
  choice: na kumtumikia
  rationale: Kitenzi hiki kinajumuisha huduma ya kujitoa, utii, na ibada; “kumtumikia” huhifadhi upana wake kuliko kukifupisha kuwa ibada pekee.
- source_word: בְּכָל לְבַבְכֶם
  choice: kwa moyo wenu wote
  rationale: “Moyo” ni kisawe cha kawaida kinachoweza kujumuisha nia, fikra, utashi, na hisia za mtu wa ndani.
- source_word: וּבְכָל נַפְשְׁכֶם
  choice: na kwa nafsi yenu yote
  rationale: “Nafsi” huhifadhi usemi wa jadi na utofauti wake na “moyo,” huku tanbihi ikieleza kwamba neno la Kiebrania linaweza pia kumaanisha uhai au utu mzima.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi kwa umbo la Kiswahili bila kulibadilisha kuwa “BWANA” au kuchagua umbo jingine la kimapokeo.
- issue: Nguvu ya kisemantiki ya שָׁמֹעַ תִּשְׁמְעוּ
  choice: mtazisikiliza kwa makini
  alternative: mtazitii kwa bidii
  rationale: Kiebrania kinaunganisha kusikia kwa makini na kuitikia kwa utii. Matini kuu huhifadhi taswira ya kusikiliza, na tanbihi inaonyesha maana ya utii bila kuondoa mvutano huo.
- issue: Maana ya נֶפֶשׁ katika usemi wa agano
  choice: nafsi
  alternative: uhai; utu mzima
  rationale: Neno lina wigo mpana kuliko dhana finyu ya sehemu isiyo ya mwili. “Nafsi” huhifadhi usemi unaotambulika, huku tanbihi ikitaja uwezekano mpana wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeachwa ikiendelea kwa alama ya vistari kwa sababu mstari huu ni sehemu ya sharti ambalo matokeo yake yanafuata katika mstari wa 14. Umoja wa kisarufi katika “moyo wenu wote” na “nafsi yenu yote” umefuata nomino za Kiswahili huku maana ikiwahusu wasikilizaji wote.
