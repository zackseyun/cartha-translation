  text: וּ/שְׁמַרְתֶּם֙ אֶת כָּל הַ/מִּצְוָ֔ה אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לְמַ֣עַן תֶּחֶזְק֗וּ וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/008.yaml
  text: So keep every commandment that I am commanding you today[c][b][a], so that you may be strong and go in and possess the land that you are crossing over to possess.
translation:
  language: sw
  text: Basi shikeni amri yote ninayowaamuru leo[a], ili muwe na nguvu[b], muingie na muimiliki[c] nchi mnayovuka kwenda kuimiliki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “amri yote,” katika umoja wenye maana ya jumla ya amri zote. Katika “ninayowaamuru,” Kiebrania humsemesha Israeli kwa umoja kama jumuiya.
    reason: lexical_alternative
  - marker: b
    text: Au “mtiwe nguvu.” Kitenzi cha Kiebrania kinaweza kumaanisha kuwa na nguvu au kutiwa nguvu katika muktadha huu.
    reason: lexical_alternative
  - marker: c
    text: Au “kuirithi” au “kuitwaa”; neno lilelile la Kiebrania limetafsiriwa kwa kitenzi “kumiliki” katika maumbo yote mawili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Basi, ishikeni
  rationale: Katika muktadha wa agano na sheria, שׁמר humaanisha kushika au kutii amri. “Basi” linaonyesha mwendelezo wenye matokeo kutoka mistari iliyotangulia.
- source_word: כָּל הַמִּצְוָה
  choice: amri yote
  rationale: Kiebrania kina nomino ya umoja inayotumiwa kwa maana ya jumla. Tafsiri hii inadumisha umoja huo huku ikimaanisha jumla nzima ya maagizo.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ninayowaamuru leo
  rationale: Kauli ya wakati uliopo inaonyesha tendo la kuamuru linalofanyika sasa. Kiambishi cha wingi cha Kiswahili kinamwelekezea Israeli kama jumuiya na kuepuka kutoa dhana kwamba mtu mmoja pekee ndiye anayesemeshwa.
- source_word: לְמַעַן
  choice: ili
  rationale: Kihusishi hiki kinaonyesha kusudi au matokeo; “ili” ni cha kawaida na wazi katika Kiswahili.
- source_word: תֶּחֶזְקוּ
  choice: muwe na nguvu
  rationale: Qal ya חזק hapa ina maana ya kuwa au kupata nguvu kwa kazi iliyo mbele yao, bila kuibana maana iwe ujasiri wa kijeshi pekee.
- source_word: וּבָאתֶם
  choice: mwingie
  rationale: בוא katika muktadha wa kuingia katika nchi humaanisha kuingia; Kiswahili hakihitaji kudumisha tofauti ya kidokezo kati ya ‘kuja’ na ‘kwenda’ hapa.
- source_word: וִירִשְׁתֶּם ... לְרִשְׁתָּהּ
  choice: kuimiliki ... kuimiliki
  rationale: ירשׁ inaweza kumaanisha kurithi, kutwaa, au kumiliki. Kurudia “kuimiliki” kunadumisha uhusiano wa kileksia na msisitizo wa Kiebrania.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika Kumbukumbu la Torati, neno hili humaanisha nchi waliyoahidiwa Israeli; “nchi” ni neno la kawaida na linalofaa katika muktadha huu.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: mnayovuka kwenda
  rationale: Kirai hiki kinaeleza kuvuka kuelekea kule, yaani katika muktadha mpana kuvuka Yordani. “Kwenda” huwasilisha mwelekeo wa שָׁמָּה kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kubadilika kwa umoja na wingi katika kumsemesha Israeli
  choice: Kutumia wingi wa kawaida wa Kiswahili kwa Israeli kama jumuiya
  alternative: Kutafsiri kiambishi cha umoja kihalisi kuwa “ninayokuamuru” katikati ya vitenzi vya wingi
  rationale: Kiebrania kina kiambishi cha umoja katika “ninayokuamuru,” lakini vitenzi vingine ni vya wingi. Hii humsemesha Israeli kwa pamoja. Kwa kuwa Kiswahili huonyesha lazima tofauti hiyo katika viambishi, wingi unaepusha dhana potovu ya kubadilika kwa mhusika bila kufuta maana ya ushirika.
- issue: Nguvu kama hali au kama jambo linalotolewa
  choice: muwe na nguvu
  alternative: mtiwe nguvu
  rationale: Kitenzi cha Kiebrania kinaweza kueleweka kama kuwa/kupata nguvu au kutiwa nguvu. Matini kuu inadumisha maana ya hali bila kutaja wazi chanzo, na uwezekano mwingine umeonyeshwa katika tanbihi.
- issue: Maana ya ירשׁ kuhusu nchi
  choice: kuimiliki
  alternative: kuirithi au kuitwaa
  rationale: Neno lina upana wa maana unaohusisha urithi na kutwaa milki. “Kuimiliki” linafaa kwa kuingia katika nchi bila kuamua kimadhehebu namna ya kuhusianisha urithi na ushindi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Basi” na “ishikeni” vinafaa kwa hotuba ya maagano bila kuwa vya kizamani kupita kiasi. Muundo unabaki karibu na mpangilio wa Kiebrania huku ukiwa wazi kwa msomaji wa kawaida.
