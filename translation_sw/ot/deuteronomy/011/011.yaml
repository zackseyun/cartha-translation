base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/011.yaml
  text: But the land that you are crossing over to possess is a land of mountains and valleys[b][a]; it drinks water from the rain of heaven.
translation:
  language: sw
  text: Lakini nchi mnayovuka kwenda kuimiliki[a] ni nchi ya milima na mabonde; hunywa maji kutokana na mvua ya mbinguni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuirithi.” Kitenzi cha Kiebrania kinaweza kuwa na maana ya kumiliki na pia kurithi, hasa katika muktadha wa agano.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “mbingu.” Huu ni usemi wa kawaida wa Biblia unaorejelea anga au ulimwengu wa mbinguni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: Lakini nchi
  rationale: Kiunganishi וְ hapa kinaonyesha tofauti na maelezo ya Misri katika mstari uliotangulia; “Lakini” huwasilisha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: עֹבְרִים שָׁמָּה
  choice: mnayovuka kwenda
  rationale: Kauli ya wakati unaoendelea pamoja na kielezi cha mwelekeo inaonyesha kuvuka kuelekea katika nchi hiyo; “kwenda” huweka wazi mwelekeo bila kutumia “huko” isiyo ya lazima.
- source_word: לְרִשְׁתָּהּ
  choice: kuimiliki
  rationale: Kitenzi ירשׁ kinaweza kumaanisha kutwaa milki au kurithi, hasa katika muktadha wa agano. “Kuimiliki” kinaonyesha tendo la kuingia na kuitwaa nchi, huku maana mbadala ya urithi ikihifadhiwa katika tanbihi.
- source_word: אֶרֶץ הָרִים וּבְקָעֹת
  choice: nchi ya milima na mabonde
  rationale: Hii inaeleza sura ya nchi kwa maneno ya kawaida na sahihi; בְקָעוֹת ni mabonde, mabonde mapana, au maeneo ya chini kati ya miinuko.
- source_word: לִמְטַר הַשָּׁמַיִם
  choice: kutokana na mvua ya mbinguni
  rationale: Kirai kinaonyesha chanzo au njia ambayo nchi hupata maji. “Mvua ya mbinguni” ni usemi wa asili wa Kiswahili unaohifadhi taswira ya Kiebrania.
- source_word: תִּשְׁתֶּה מָּיִם
  choice: hunywa maji
  rationale: Tafsiri hii inadumisha tashihisi hai ya Kiebrania, ambayo huiwasilisha nchi kana kwamba inakunywa maji, badala ya kuibadili kuwa kauli tambarare kama “humwagiliwa.”
theological_decisions:
- issue: Maana ya ירשׁ katika muktadha wa nchi ya agano
  choice: kuimiliki
  alternative: kuirithi
  rationale: Maandishi yanahusisha kuingia kwa vitendo na kupokea nchi iliyoahidiwa. Tafsiri kuu haitatui kimya kimya mvutano kati ya kutwaa milki na kurithi; maana ya urithi imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo “hunywa maji” umehifadhiwa kwa makusudi ili kudumisha taswira ya kishairi ya chanzo.
