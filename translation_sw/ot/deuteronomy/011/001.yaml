source:
  edition: WLC
  text: וְ/אָ֣הַבְתָּ֔ אֵ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/שָׁמַרְתָּ֣ מִשְׁמַרְתּ֗/וֹ וְ/חֻקֹּתָ֧י/ו וּ/מִשְׁפָּטָ֛י/ו וּ/מִצְוֺתָ֖י/ו כָּל הַ/יָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/001.yaml
  text: Therefore you shall love Yahweh your God and keep his charge[a], his statutes, his judgments[b], and his commandments all your days.
translation:
  language: sw
  text: Kwa hiyo, umpende Yahwe, Mungu wako, na ushike siku zote maagizo yake[a], sheria zake, hukumu zake[b], na amri zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na umpende Yahwe, Mungu wako.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa kwa urahisi kuwa “na”; hapa kimetafsiriwa kwa maana ya hitimisho kutokana na muktadha uliotangulia.
    reason: alternative_reading
  - marker: b
    text: Au, “maagizo yake ya kisheria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָהַבְתָּ
  choice: Kwa hiyo, mpende
  rationale: Kitenzi אָהַב ni ‘kupenda.’ Kiunganishi וְ kinaweza kuwa ‘na,’ lakini hapa kinaweza kueleweka kuwa na nguvu ya hitimisho kutokana na muktadha uliotangulia; ‘kwa hiyo’ huonyesha uhusiano huo kwa Kiswahili cha kawaida huku uwezekano wa ‘na’ ukihifadhiwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina binafsi lililo katika Kiebrania.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: 'Ni umbo lenye kiambishi cha nafsi ya pili umoja: ‘Mungu wako,’ likihifadhi uhusiano wa agano unaosemwa moja kwa moja kwa msikilizaji.'
- source_word: וְ/שָׁמַרְתָּ
  choice: na kushika
  rationale: שׁמר humaanisha kushika, kulinda, au kutii. ‘Kushika’ ni usemi wa kawaida wa Kiswahili kwa kutii masharti na amri.
- source_word: מִשְׁמַרְתּוֹ
  choice: wajibu aliokupa
  rationale: מִשְׁמֶרֶת huashiria jukumu, wajibu, au jambo lililokabidhiwa mtu alishike. ‘Wajibu aliokupa’ ni wazi na wa asili zaidi kuliko ‘lindo lake,’ bila kuufanya kuwa sawa na amri zinazofuata.
- source_word: חֻקֹּתָיו
  choice: sheria zake
  rationale: חֻקּוֹת ni masharti au sheria zilizowekwa. ‘Sheria zake’ ni ya kueleweka na bado inadumisha tofauti na hukumu na amri.
- source_word: וּמִשְׁפָּטָיו
  choice: hukumu zake
  rationale: מִשְׁפָּט inaweza kumaanisha hukumu, maamuzi ya kisheria, au masharti ya haki. ‘Hukumu zake’ hufuata maana ya msingi na kuhifadhi tofauti ya msamiati wa kisheria; ‘maagizo yake ya kisheria’ imetolewa kama uwezekano katika tanbihi.
- source_word: וּמִצְוֺתָיו
  choice: amri zake
  rationale: מִצְוָה ni neno la kawaida la amri; ‘amri zake’ ni la asili na sahihi katika Kiswahili.
- source_word: כָּל הַיָּמִים
  choice: siku zote
  rationale: Kiebrania ni ‘siku zote.’ Kiswahili ‘siku zote’ huwasilisha maana ya kudumu, yaani daima, bila kuongeza kimatini kiwakilishi kisichotajwa wazi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina la agano יהוה, si cheo אֲדֹנָי. ‘Yahwe’ huhifadhi jina binafsi na kulipambanua na cheo ‘Bwana.’
- issue: Nguvu ya kiunganishi וְ mwanzoni mwa aya
  choice: Kwa hiyo
  alternative: Na
  rationale: Muktadha unaweza kukipa kiunganishi nguvu ya kuhitimisha au kutumia yaliyotangulia. Kwa kuwa וְ yenyewe pia inaweza kuwa ‘na,’ uwezekano huo haujafichwa bali umewekwa katika tanbihi.
- issue: Maana ya מִשְׁפָּטָיו katika orodha ya masharti ya agano
  choice: hukumu zake
  alternative: maagizo yake ya kisheria
  rationale: ‘Hukumu’ huhifadhi upekee wa neno hili kando ya sheria na amri, ingawa katika muktadha wa sheria linaweza pia kumaanisha maamuzi au maagizo ya kisheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Umoja wa nafsi ya pili umehifadhiwa katika ‘mpende,’ ‘Mungu wako,’ na muktadha wa ‘kushika.’ Orodha ya istilahi za kisheria imeachwa na tofauti zake kadiri Kiswahili kinavyoruhusu.
