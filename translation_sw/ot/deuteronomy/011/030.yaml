  text: הֲ/לֹא הֵ֜מָּה בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֗ן אַֽחֲרֵי֙ דֶּ֚רֶךְ מְב֣וֹא הַ/שֶּׁ֔מֶשׁ בְּ/אֶ֨רֶץ֙ הַֽ/כְּנַעֲנִ֔י הַ/יֹּשֵׁ֖ב בָּ/עֲרָבָ֑ה מ֚וּל הַ/גִּלְגָּ֔ל אֵ֖צֶל אֵלוֹנֵ֥י מֹרֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/030.yaml
  text: Are they not beyond the Jordan[a], behind the way of the setting sun, in the land of the Canaanites who dwell in the Arabah, opposite Gilgal[c][b], beside the oaks of Moreh?
translation:
  language: sw
  text: Je, milima hiyo haiko ng’ambo ya Yordani[a], upande wa magharibi wa njia iendayo machweoni[b], katika nchi ya Wakanaani wanaokaa katika Araba, mkabala na Gilgali, karibu na mialoni ya More[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upande wa pili wa Yordani.” Usemi wa Kiebrania ni nahau ya kijiografia ambayo maana yake hutegemea mahali anaposimama msemaji.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “nyuma ya njia ya kuingia kwa jua”; yaani, kuelekea magharibi.
    reason: lexical_alternative
  - marker: c
    text: Au, “miterebinthi ya More.” Neno la Kiebrania linaweza kumaanisha mojawapo ya aina hizi za miti mikubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא הֵמָּה
  choice: Je, milima hiyo haiko
  rationale: Swali la balagha linatarajia jibu la kukubali. Nomino “milima” imewekwa wazi kutokana na milima miwili iliyotajwa katika mstari uliotangulia; “hiyo” na “haiko” zinaonyesha wingi kwa upatanisho wa Kiswahili.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: ng’ambo ya Yordani
  rationale: Hii ni nahau ya kijiografia inayoonyesha upande wa pili bila kulazimisha mtazamo maalumu; uwezekano wa “upande wa pili wa Yordani” umeelezwa katika tanbihi.
- source_word: אַחֲרֵי דֶּרֶךְ מְבוֹא הַשֶּׁמֶשׁ
  choice: upande wa magharibi wa njia iendayo machweoni
  rationale: Tafsiri hii inahifadhi “njia” na taswira ya jua kuchwa, huku ikitoa maana ya mwelekeo kwa Kiswahili cha kawaida. Muundo halisi wa Kiebrania, ambao unaweza kueleweka kwa namna tofauti kidogo, umeonyeshwa katika tanbihi.
- source_word: בְּאֶרֶץ הַכְּנַעֲנִי
  choice: katika nchi ya Wakanaani
  rationale: Nomino ya umoja ya Kiebrania imetumiwa kwa maana ya jamii nzima; Kiswahili hutumia kwa kawaida jina la watu katika wingi hapa.
- source_word: הַיֹּשֵׁב בָּעֲרָבָה
  choice: wanaokaa katika Araba
  rationale: Kitenzi cha umoja wa kijumla katika Kiebrania kimetafsiriwa kwa wingi kulingana na “Wakanaani.” “Araba” limehifadhiwa kama jina la eneo la kijiografia.
- source_word: מוּל הַגִּלְגָּל
  choice: mkabala na Gilgali
  rationale: “Mkabala na” hutoa kwa uwazi uhusiano wa mahali unaoonyeshwa na מוּל; jina la mahali limetoholewa kwa Kiswahili kama “Gilgali.”
- source_word: אֵצֶל אֵלוֹנֵי מֹרֶה
  choice: karibu na mialoni ya More
  rationale: “Karibu na” huonyesha ukaribu wa mahali kwa lugha ya kawaida. אֵלוֹן limetafsiriwa “mwaloni,” huku uwezekano wa mti wa terebinthi ukihifadhiwa katika tanbihi.
