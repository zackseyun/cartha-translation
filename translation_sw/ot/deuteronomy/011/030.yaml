  terminology: Yordani, Wakanaani, Araba, Gilgali, na More zimetolewa kwa uthabiti. “Mialoni” ni chaguo salama kwa אֵלוֹנֵי, na tanbihi ya “miterebinthi” huhifadhi utata wa kibotania bila kuutatuzi kupita kiasi. Alama za tanbihi zimefungwa kwa maneno yanayohusika.
