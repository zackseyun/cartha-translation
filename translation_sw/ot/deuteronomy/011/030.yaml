translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko. Majina Yordani, Gilgali, Araba, na More yametoholewa au kuhifadhiwa kwa namna inayotambulika. Swali la balagha na taswira ya machweo zimehifadhiwa bila kuongeza tafsiri ya kidhehebu.
