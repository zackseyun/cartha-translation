base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/018.yaml
  text: So you shall place these words of mine on your heart and on your soul[a], and you shall bind them as a sign on your hand, and they shall be as frontlets between your eyes.
translation:
  language: sw
  text: Kwa hiyo, yawekeni maneno yangu haya mioyoni mwenu na nafsini mwenu; yafungeni kuwa ishara juu ya mikono yenu, nayo yawe kama vifungo kati ya macho yenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tefilini,” yaani viboksi vidogo vyenye maandiko ambavyo baadaye vilivaliwa katika desturi ya Kiyahudi. Neno la Kiebrania ni adimu, na maana yake kamili haijulikani kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתֶּם
  choice: yawekeni
  rationale: Kitenzi שׂים humaanisha kuweka au kutia. Kauli ya kuamuru inafaa katika mfululizo huu wa maagizo, na kiunganishi kimetolewa kwa ‘Kwa hiyo’ ili kuonyesha mwendelezo kutoka muktadha uliotangulia.
- source_word: דְּבָרַי אֵלֶּה
  choice: maneno yangu haya
  rationale: Muundo huu unahifadhi kiambishi cha nafsi ya kwanza na mkazo wa maneno kuwa ya msemaji mwenyewe, huku ukiwa wa kawaida katika Kiswahili.
- source_word: עַל לְבַבְכֶם וְעַל נַפְשְׁכֶם
  choice: mioyoni mwenu na nafsini mwenu
  rationale: ‘Mioyoni’ na ‘nafsini’ huhifadhi taswira ya Kiebrania na uzito wa נֶפֶשׁ bila kuibana kuwa ‘uhai’ au kuifafanua zaidi kama ‘utu wa ndani.’
- source_word: וּקְשַׁרְתֶּם אֹתָם
  choice: yafungeni
  rationale: קשׁר ni kufunga au kuunganisha. ‘Yafungeni’ huhifadhi uwezekano wa tendo halisi na wa ishara bila kuamua kati yao.
- source_word: לְאוֹת עַל יֶדְכֶם
  choice: kuwa ishara mikononi mwenu
  rationale: אוֹת ni ishara au alama. ‘Ishara’ inaacha maana ya mfano wazi, na wingi wa ‘mikononi mwenu’ ni wa kawaida kwa kundi linalosemewa.
- source_word: לְטוֹטָפֹת
  choice: kama vifungo vya paji la uso
  rationale: טוֹטָפֹת ni neno adimu linaloelekea kutaja kitu kinachovaliwa sehemu ya mbele ya kichwa. Tafsiri hii huhifadhi kitu halisi kinachodokezwa bila kukitambulisha moja kwa moja na desturi ya baadaye; tanbihi inaonyesha kutokuwa na uhakika.
- source_word: בֵּין עֵינֵיכֶם
  choice: kati ya macho yenu
  rationale: Hii ndiyo maana ya moja kwa moja ya Kiebrania. Haijabadilishwa kuwa ‘kwenye paji la uso,’ ingawa kifungu kilichotangulia husaidia msomaji kuelewa mahali panapokusudiwa.
theological_decisions:
- issue: Iwapo kufunga maneno mkononi na kati ya macho ni agizo halisi, la mfano, au yote mawili
  choice: Kuhifadhi taswira halisi ya kufunga na kuvaa bila kuamua namna moja pekee ya kuitimiza
  alternative: Kulieleza kama wito wa mfano tu wa kuyakumbuka na kuyatenda maagizo, au kulitafsiri moja kwa moja kwa desturi ya tefilini
  rationale: Kiebrania kina lugha ya vitu na matendo halisi, lakini mstari wenyewe hauondoi uwezekano wa maana ya mfano wala haulazimishi utambulisho kamili na desturi ya baadaye. Tafsiri inaacha mvutano huo wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. ‘Mioyoni mwenu’ na ‘nafsini mwenu’ huhifadhi mtindo wa agano; ‘vifungo vya paji la uso’ huepuka neno la kitaalamu katika matini kuu huku tanbihi ikitoa mbadala wa kihistoria.
