source:
  edition: WLC
  text: וַ/אֲשֶׁ֨ר עָשָׂ֜ה לְ/דָתָ֣ן וְ/לַ/אֲבִירָ֗ם בְּנֵ֣י אֱלִיאָב֮ בֶּן רְאוּבֵן֒ אֲשֶׁ֨ר פָּצְתָ֤ה הָ/אָ֨רֶץ֙ אֶת פִּ֔י/הָ וַ/תִּבְלָעֵ֥/ם וְ/אֶת בָּתֵּי/הֶ֖ם וְ/אֶת אָהֳלֵי/הֶ֑ם וְ/אֵ֤ת כָּל הַ/יְקוּם֙ אֲשֶׁ֣ר בְּ/רַגְלֵי/הֶ֔ם בְּ/קֶ֖רֶב כָּל יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/006.yaml
  text: and what he did to Dathan and Abiram[a], sons of Eliab son of Reuben—how the earth opened its mouth and swallowed them, their households, their tents, and every living thing at their feet[b], in the midst of all Israel.
translation:
  language: sw
  text: na yale aliyowatendea Dathani na Abiramu, wana wa Eliabu mwana wa Reubeni—jinsi ardhi ilivyofungua kinywa chake na kuwameza wao, nyumba zao[a], mahema yao, na kila kilichokuwapo miguuni pao[b], katikati ya Israeli yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linamaanisha moja kwa moja “nyumba zao,” lakini hapa linaweza kumaanisha majengo yao au, kwa upana zaidi, watu wa kaya zao.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya karibu, “kila kitu kilichokuwa miguuni pao.” Usemi huu wa Kiebrania huenda ukarejelea watu na vitu vyote vilivyokuwa vyao au vilivyoandamana nao.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשָׂה
  choice: aliyowatendea
  rationale: Katika muktadha huu wa jambo alilowafanyia watu fulani, “aliyowatendea” ni Kiswahili cha kawaida na huonyesha kwa uwazi kuwa tendo lilielekezwa kwa Dathani na Abiramu.
- source_word: בְּנֵי אֱלִיאָב בֶּן רְאוּבֵן
  choice: wana wa Eliabu mwana wa Reubeni
  rationale: Inahifadhi muundo wa nasaba wa Kiebrania bila kuubadili kuwa tu maelezo ya kikabila.
- source_word: פָּצְתָה הָאָרֶץ אֶת־פִּיהָ
  choice: ardhi ilivyofungua kinywa chake
  rationale: Inadumisha taswira hai ya ardhi kama yenye kufungua kinywa, badala ya kuifafanua tu kuwa ilipasuka.
- source_word: וַתִּבְלָעֵם
  choice: na kuwameza wao
  rationale: “Kumeza” ndiyo maana halisi na yenye taswira ya kitenzi בלע; “wao” inasisitiza kiwakilishi kilicho katika Kiebrania na kutenganisha watu hao na vitu vinavyofuata katika orodha.
- source_word: בָּתֵּיהֶם
  choice: nyumba zao
  rationale: Ni tafsiri ya karibu ya neno la Kiebrania na huepuka kuamua kimya kimya kama maana ni majengo au watu wa kaya; tanbihi inaeleza uwezekano huo.
- source_word: אָהֳלֵיהֶם
  choice: mahema yao
  rationale: Ni tafsiri ya moja kwa moja, wazi, na inayofaa mazingira ya jangwani.
- source_word: כָּל־הַיְקוּם אֲשֶׁר בְּרַגְלֵיהֶם
  choice: kila kilichokuwapo miguuni pao
  rationale: Neno היקום na usemi “miguuni pao” si rahisi kubainishwa kwa neno moja; tafsiri hii inahifadhi upana na taswira ya asili, huku tanbihi ikieleza kuwa huenda ikahusu watu, viumbe, au mali iliyokuwa yao au iliyoandamana nao.
- source_word: בְּקֶרֶב כָּל־יִשְׂרָאֵל
  choice: katikati ya Israeli yote
  rationale: Inahifadhi maana ya tukio kutokea ndani na mbele ya jumuiya nzima ya Israeli.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mstari unaendeleza sentensi kutoka aya zilizotangulia, kama ilivyo katika Kiebrania. Taswira ya “ardhi kufungua kinywa chake” na usemi wenye utata wa “miguuni pao” zimehifadhiwa.
