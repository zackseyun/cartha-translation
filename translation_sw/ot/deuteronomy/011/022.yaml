base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/022.yaml
  text: For if you carefully keep all this commandment that I am commanding you to do—to love Yahweh your God[a], to walk in all his ways[c][b], and to cling to him—
translation:
  language: sw
  text: Kwa maana, ikiwa mtatunza kwa uangalifu[a] agizo hili lote[b], ambalo ninawaamuru mlitekeleze—kumpenda Yahwe Mungu wenu, kutembea katika njia zake zote, na kushikamana naye[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasisitiza tendo la kutunza kwa kurudia mzizi wa kitenzi; pia yaweza kutafsiriwa, “mtatunza kwa bidii.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “agizo hili lote,” katika umoja; huenda ni usemi wa jumla unaorejelea wajibu mzima wa agano.
    reason: lexical_alternative
  - marker: c
    text: Au, “kuambatana naye kwa uthabiti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Kwa maana, ikiwa
  rationale: Kirai hiki kinaanzisha sharti lenye msisitizo huku kikihifadhi uhusiano wake na mstari uliotangulia.
- source_word: שָׁמֹר תִּשְׁמְרוּן
  choice: mtalitunza kwa uangalifu
  rationale: Muundo wa kitenzi pamoja na kitenzi-jina halisi unasisitiza tendo la kutunza; ‘kwa uangalifu’ huwasilisha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: agizo hili lote
  rationale: Kiebrania kimetumia umoja. Tafsiri hii inadumisha wazo la agizo zima kama wajibu mmoja wa agano.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם לַעֲשֹׂתָהּ
  choice: ninalowaamuru kulitekeleza
  rationale: Wakati wa sasa wa ‘ninalowaamuru’ unaakisi hotuba inayoendelea, na ‘kulitekeleza’ huonyesha kwa Kiswahili cha kawaida maana ya kulifanya agizo.
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֵיכֶם
  choice: kumpenda Yahwe Mungu wenu
  rationale: Huhifadhi kitenzi cha upendo, jina binafsi la Mungu, na uhusiano wa agano unaoonyeshwa na ‘Mungu wenu.’
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: kutembea katika njia zake zote
  rationale: Huhifadhi sitiari ya Kiebrania ya kutembea, ambayo hapa inahusu mwenendo bila kuifafanua kupita kiasi.
- source_word: וּלְדָבְקָה בוֹ
  choice: na kushikamana naye
  rationale: Kitenzi דבק kinaeleza kuambatana kwa karibu na kwa uthabiti; ‘kushikamana naye’ ni cha asili na hudumisha nguvu ya kimahusiano ya usemi.
theological_decisions:
- issue: Tafsiri ya jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yametumia jina binafsi la Mungu; ‘Yahwe’ hulitafsiri kwa unukuzi badala ya kulibadili kuwa cheo.
- issue: Sitiari za agano za ‘kutembea’ na ‘kushikamana’
  choice: Kuhifadhi sitiari katika matini kuu
  alternative: Kuishi kulingana na njia zake na kuendelea kuwa mwaminifu kwake
  rationale: Sitiari hizi zina uzito wa kimahusiano na kimaadili. Kuzihifadhi huepuka kufungia maana yake katika ufafanuzi mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umehifadhi kishazi cha sharti na mstari mrefu unaoendelea katika muktadha, huku msamiati ukiwa wazi kwa wasomaji wa kawaida.
