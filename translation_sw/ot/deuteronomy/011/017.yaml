base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/017.yaml
  text: Then Yahweh’s anger will burn against you[a], and he will shut up the heavens so that there will be no rain, and the ground will not yield its produce; and you will perish quickly from the good land that Yahweh is giving you.
translation:
  language: sw
  text: Ndipo hasira ya Yahwe itawaka dhidi yenu[a], naye atafunga mbingu, hivyo mvua haitanyesha, na ardhi haitatoa mazao yake; nanyi mtaangamia upesi kutoka katika nchi nzuri ambayo Yahwe anawapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “hasira ya Yahwe itawaka dhidi yenu”; kihalisi, “pua/hasira ya Yahwe itawaka dhidi yenu,” nahau ya Kiebrania inayoonyesha hasira kali.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַף יְהוָה בָכֶם
  choice: Ndipo hasira ya Yahwe itawaka dhidi yenu
  rationale: Muundo חָרָה אַף ni nahau ya Kiebrania inayosema hasira kuwaka. Tafsiri hii inadumisha taswira hiyo huku ikiwa ya kawaida na yenye kueleweka katika Kiswahili. “Ndipo” linaonyesha matokeo ya onyo lililotangulia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: וְעָצַר אֶת הַשָּׁמַיִם וְלֹא יִהְיֶה מָטָר
  choice: naye atafunga mbingu, mvua isinyeshe
  rationale: “Atafunga mbingu” inadumisha taswira ya Kiebrania ya kuzuia mvua; “mvua isinyeshe” huonyesha matokeo yake kwa Kiswahili cha kawaida.
- source_word: וְהָאֲדָמָה לֹא תִתֵּן אֶת יְבוּלָהּ
  choice: na ardhi haitatoa mazao yake
  rationale: “Ardhi” inafaa kwa אֲדָמָה kama udongo wa kilimo, huku “nchi” ikihifadhiwa kwa הָאָרֶץ baadaye. “Mazao” huwasilisha יְבוּל kwa lugha ya kawaida.
- source_word: וַאֲבַדְתֶּם מְהֵרָה
  choice: nanyi mtaangamia upesi
  rationale: אבד hapa inaeleza maangamizi makali chini ya hukumu ya agano bila kubainisha zaidi namna yake; “upesi” huonyesha kasi ya מְהֵרָה.
- source_word: מֵעַל הָאָרֶץ הַטֹּבָה
  choice: kutoka katika nchi nzuri
  rationale: Kiswahili cha kawaida hutumia “kutoka katika nchi” kueleza kuondolewa huko; “nchi” pia hutofautisha הָאָרֶץ na אֲדָמָה iliyotafsiriwa “ardhi.”
- source_word: אֲשֶׁר יְהוָה נֹתֵן לָכֶם
  choice: ambayo Yahwe anawapa
  rationale: Kauli ya wakati wa sasa inadumisha thamani ya participio נֹתֵן na hali ya nchi kuwa zawadi inayotolewa kwa Israeli.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania ina jina binafsi la agano, hivyo linadumishwa kwa utohozi badala ya kubadilishwa kuwa cheo.
- issue: Nahau ya hasira yenye taswira ya kuwaka
  choice: hasira ya Yahwe itawaka dhidi yenu
  alternative: Yahwe atawakasirikia
  rationale: Chaguo hili linahifadhi sitiari ya Kiebrania bila kuongeza dai kwamba hasira hiyo haidhibitiki.
- issue: Maana ya אבד katika hukumu ya agano
  choice: mtaangamia
  alternative: mtaondolewa; mtaangamizwa
  rationale: “Mtaangamia” huhifadhi uzito na upana wa kitenzi bila kuamua kimyakimya ikiwa kinamaanisha kifo, uharibifu, au kuondolewa katika nchi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa usawa bora: taswira kuu za Kiebrania zimehifadhiwa, lakini sentensi imeundwa kwa mtiririko wa kawaida wa Kiswahili. “Ardhi” na “nchi” zimetofautishwa ili kuakisi אֲדָמָה na הָאָרֶץ.'
