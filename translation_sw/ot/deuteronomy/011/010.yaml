source:
  edition: WLC
  text: כִּ֣י הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתָּ֤ה בָא שָׁ֨מָּ/ה֙ לְ/רִשְׁתָּ֔/הּ לֹ֣א כְ/אֶ֤רֶץ מִצְרַ֨יִם֙ הִ֔וא אֲשֶׁ֥ר יְצָאתֶ֖ם מִ/שָּׁ֑ם אֲשֶׁ֤ר תִּזְרַע֙ אֶֽת זַרְעֲ/ךָ֔ וְ/הִשְׁקִ֥יתָ בְ/רַגְלְ/ךָ֖ כְּ/גַ֥ן הַ/יָּרָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/010.yaml
  text: For the land that you are entering to possess is not like the land of Egypt[a], from which you came out, where you sowed your seed and watered it with your foot[b], like a vegetable garden.
translation:
  language: sw
  text: Kwa maana nchi unayoingia kuimiliki si kama nchi ya Misri, ambako mlitoka, ambako ulipanda mbegu yako na kuimwagilia[a] kwa mguu wako[b], kama bustani ya mboga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambako ulikuwa ukipanda mbegu yako na kuimwagilia,” ikiwa usemi huu unaeleza desturi ya kawaida ya umwagiliaji nchini Misri.
    reason: lexical_alternative
  - marker: b
    text: Huenda “kwa mguu wako” inamaanisha kumwagilia kwa kutumia mguu, au kuongoza maji katika mifereji kwa kutumia mguu.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huanzisha maelezo yanayounga mstari huu na himizo lililotangulia.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Ni neno la kawaida na lenye hadhi kwa eneo la kijiografia linalozungumziwa katika Kumbukumbu la Torati.
- source_word: בָא שָׁמָּה
  choice: unayoingia
  rationale: Huwasilisha tendo la kuingia lililo karibu bila kuongeza neno lisilohitajika la mahali.
- source_word: לְרִשְׁתָּהּ
  choice: kuimiliki
  rationale: Huhifadhi maana ya kupata na kushika nchi kuwa milki, bila kulazimisha dhana ya urithi wa kifamilia.
- source_word: אֲשֶׁר יְצָאתֶם מִשָּׁם
  choice: ambako mlitoka
  rationale: Huhifadhi wazo la kutoka Misri na pia mabadiliko ya Kiebrania kutoka umoja kwenda wingi katika kumsemesha Israeli.
- source_word: אֲשֶׁר תִּזְרַע אֶת זַרְעֲךָ
  choice: ambako ulipanda mbegu yako
  rationale: Hutafsiri זֶרַע kwa maana halisi ya mbegu na kuhifadhi umoja wa nafsi ya pili katika Kiebrania.
- source_word: וְהִשְׁקִיתָ
  choice: na kuimwagilia
  rationale: ‘Kumwagilia’ ni Kiswahili cha kawaida kwa kupeleka maji kwenye kilichopandwa; kiwakilishi cha kitu kinatokana na muktadha wa kilimo.
- source_word: בְרַגְלְךָ
  choice: kwa mguu wako
  rationale: Huhifadhi taswira halisi na yenye utata ya Kiebrania badala ya kuchagua kimya-kimya aina moja ya umwagiliaji.
- source_word: כְּגַן הַיָּרָק
  choice: kama bustani ya mboga
  rationale: Ni usemi wa sasa na unaoeleweka kwa shamba dogo la mboga linalomwagiliwa kwa makini.
theological_decisions:
- issue: Usemi wa kutoka Misri katika muktadha wa agano
  choice: ambako mlitoka
  alternative: ambako mliondoka
  rationale: ‘Mlitoka’ hudumisha mwangwi wa tukio la Kutoka bila kuongeza ufafanuzi wa kiteolojia usiotajwa moja kwa moja.
- issue: Mabadiliko ya umoja na wingi katika kumsemesha Israeli
  choice: unayoingia / mlitoka / ulipanda
  alternative: kusawazisha viwakilishi vyote kuwa wingi
  rationale: Mabadiliko hayo yapo katika maandishi ya Kiebrania na yanaonyesha Israeli akisemeshwa kama taifa moja na pia kama watu wengi; hayajasawazishwa kimya-kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi tofauti ya Misri na nchi inayoingiwa, pamoja na taswira ya kilimo na mabadiliko ya nafsi ya pili kati ya umoja na wingi.
