  text: כָּל הַ/מָּק֗וֹם אֲשֶׁ֨ר תִּדְרֹ֧ךְ כַּֽף רַגְלְ/כֶ֛ם בּ֖/וֹ לָ/כֶ֣ם יִהְיֶ֑ה מִן הַ/מִּדְבָּ֨ר וְ/הַ/לְּבָנ֜וֹן מִן הַ/נָּהָ֣ר נְהַר פְּרָ֗ת וְ/עַד֙ הַ/יָּ֣ם הָֽ/אַחֲר֔וֹן יִהְיֶ֖ה גְּבֻלְ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/024.yaml
  text: Every place where the sole of your foot treads will be yours; from the wilderness and Lebanon[a], from the River, the Euphrates River, as far as the western sea, will be your border.
translation:
  language: sw
  text: Kila mahali ambapo nyayo za miguu yenu zitakanyaga patakuwa penu; mpaka wenu utakuwa kuanzia nyika na Lebanoni, kuanzia ule Mto, yaani Mto Frati, hadi bahari ya magharibi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “bahari ya nyuma” au “bahari ya mwisho”; kwa kawaida inaeleweka kuwa Bahari ya Mediterania.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַמָּקוֹם
  choice: Kila mahali
  rationale: Usemi huu una maana ya kila eneo ambalo watakanyaga, si eneo moja tu kwa ujumla.
- source_word: אֲשֶׁר תִּדְרֹךְ כַּף רַגְלְכֶם בּוֹ
  choice: ambapo nyayo za miguu yenu zitakanyaga
  rationale: Huhifadhi taswira halisi ya כַּף רֶגֶל, ‘unyayo wa mguu,’ huku wingi ukipatana kwa kawaida na ‘yenu’ katika Kiswahili.
- source_word: לָכֶם יִהְיֶה
  choice: patakuwa penu
  rationale: Hutoa kwa ufupi maana ya umiliki iliyo katika ahadi na kupatana kisarufi na ‘mahali.’
- source_word: מִן הַמִּדְבָּר
  choice: kuanzia nyika
  rationale: ‘Nyika’ huwasilisha eneo lisilolimwa au la porini bila kulazimisha maana finyu ya jangwa kavu.
- source_word: וְהַלְּבָנוֹן
  choice: na Lebanoni
  rationale: Huhifadhi kiunganishi cha Kiebrania na mpangilio wa alama za kijiografia bila kukifanya kimyakimya kiwe ‘hadi Lebanoni.’
- source_word: מִן הַנָּהָר נְהַר פְּרָת
  choice: kuanzia ule Mto, yaani Mto Frati
  rationale: Huhifadhi jina la kiutambulisho ‘ule Mto’ kisha ufafanuzi wa apposition kwamba ni Frati.
- source_word: וְעַד הַיָּם הָאַחֲרוֹן
  choice: hadi bahari ya magharibi
  rationale: Katika mwelekeo wa kijiografia wa Kiebrania, ‘bahari ya nyuma/ya mwisho’ humaanisha bahari iliyo upande wa magharibi; tanbihi huhifadhi maana ya neno kwa karibu zaidi.
- source_word: יִהְיֶה גְּבֻלְכֶם
  choice: mpaka wenu utakuwa
  rationale: ‘Mpaka’ ni neno la kawaida na sahihi kwa mpaka wa eneo katika muktadha huu.
theological_decisions:
- issue: Lugha ya ahadi kuhusu eneo
  choice: Kutafsiri mstari kama ahadi ya eneo lenye mipaka iliyotajwa
  alternative: Kuueleza kama mipaka ya kinadharia au kama umiliki wa kudumu usio na masharti
  rationale: Mstari wenyewe unaeleza upana wa eneo lililoahidiwa; tafsiri haipaswi kuamua mijadala ya baadaye kuhusu utimilifu, masharti, au ufananisho wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umeboreshwa kidogo kwa kuweka ‘mpaka wenu’ mapema katika kishazi cha pili ili mlolongo mrefu wa mipaka usomeke kwa urahisi, bila kubadili maana ya chanzo.
