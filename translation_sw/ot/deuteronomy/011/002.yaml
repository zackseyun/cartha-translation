  text: וִֽ/ידַעְתֶּם֮ הַ/יּוֹם֒ כִּ֣י לֹ֣א אֶת בְּנֵי/כֶ֗ם אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ וַ/אֲשֶׁ֣ר לֹא רָא֔וּ אֶת מוּסַ֖ר יְהוָ֣ה אֱלֹהֵי/כֶ֑ם אֶת גָּדְל֕/וֹ אֶת יָד/וֹ֙ הַ/חֲזָקָ֔ה וּ/זְרֹע֖/וֹ הַ/נְּטוּיָֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/002.yaml
  text: And know today that that I am not speaking to your children, who have not known and who have not seen the discipline of Yahweh your God[a], his greatness, his strong hand[b], and his outstretched arm—
translation:
  language: sw
  text: Nanyi leo jueni kwamba siwahutubii watoto wenu, ambao hawakujua wala hawakuona nidhamu ya Yahwe Mungu wenu[a], ukuu wake, mkono wake wenye nguvu[b], na mkono wake ulionyoshwa—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kina usemi uliodondosha maneno: kihalisi, “kwamba si watoto wenu, ambao hawakujua wala kuona...” Maana ni kwamba Musa anawahutubia wale walioyaona wenyewe matendo ya Yahwe, si kizazi kilichofuata.'
    reason: alternative_reading
  - marker: b
    text: Au, “mkono wake wenye uweza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Nanyi ... jueni
  rationale: Kauli hii inavuta fikira za wasikilizaji na kuwahimiza watambue jambo linalofuata; “jueni” inadumisha usemi wa moja kwa moja na mtiririko wa kifungu.
- source_word: הַיּוֹם
  choice: leo
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kielezi hiki cha wakati.
- source_word: כִּי לֹא אֶת־בְּנֵיכֶם
  choice: kwamba sisemi na watoto wenu
  rationale: Kiebrania kina usemi uliodondosha kitenzi, yaani kihalisi “kwamba si watoto wenu.” Kitenzi “sisemi na” kinawekwa wazi kutokana na muktadha ili Kiswahili kiwe kamili na cha kawaida bila kuondoa utofautishaji kati ya wasikilizaji na watoto wao.
- source_word: אֲשֶׁר לֹא יָדְעוּ וַאֲשֶׁר לֹא רָאוּ
  choice: ambao hawakujua wala kuona
  rationale: Muundo huu unadumisha vifungu viwili sambamba na unaonyesha kwamba watoto hao hawakuwa na ujuzi uliotokana na kushuhudia matendo hayo.
- source_word: מוּסַר
  choice: nidhamu
  rationale: Neno hili linaweza kuhusisha kufundisha, kusahihisha, na kuadibu. “Nidhamu” hudumisha upana huo kuliko kulifanya limaanishe adhabu peke yake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa namna inayotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa na cheo.
- source_word: גָּדְלוֹ
  choice: ukuu wake
  rationale: Ni tafsiri ya moja kwa moja inayoonyesha ukuu wa Yahwe ulioonekana katika matendo yake.
- source_word: יָדוֹ הַחֲזָקָה
  choice: mkono wake wenye nguvu
  rationale: Inatafsiri wazi taswira ya Kiebrania ya mkono wenye nguvu, inayowakilisha uwezo wa Mungu katika matendo yake.
- source_word: וּזְרֹעוֹ הַנְּטוּיָה
  choice: mkono wake ulionyoshwa
  rationale: Kiswahili hutumia “mkono” kwa maana zinazoweza kujumuisha hand na arm; usemi huu unadumisha taswira ya kiungo kilichonyoshwa kutenda kwa nguvu.
theological_decisions:
- issue: Usemi uliodondosha kitenzi katika “si watoto wenu”
  choice: Kuweka wazi maana kwa “sisemi na watoto wenu”
  alternative: “kwa maana si watoto wenu ambao hawakujua wala kuona...”
  rationale: Kiebrania hakitaji kitenzi kinachotawala sehemu hii. Muktadha unaonyesha kwamba Musa anatofautisha watu anaowahutubia na watoto wao. Tafsiri iliyochaguliwa hufanya uhusiano huo uwe wa kawaida katika Kiswahili bila kudai kwamba maneno yaliyoongezwa yamo wazi katika Kiebrania; tanbihi inadumisha uwazi kuhusu hali hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Muundo “Nanyi leo jueni” unadumisha mwendelezo wa hotuba, na alama ya mkato mwishoni inaonyesha kwamba sentensi inaendelea katika mstari unaofuata.
