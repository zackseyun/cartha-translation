revisions:
- from: Nanyi leo jueni kwamba sisemi na watoto wenu, ambao hawakujua wala kuona nidhamu ya Yahwe Mungu wenu[a], ukuu wake, mkono wake wenye nguvu[b], na mkono wake ulionyoshwa—
  to: Nanyi leo jueni kwamba siwahutubii watoto wenu, ambao hawakujua wala hawakuona nidhamu ya Yahwe Mungu wenu[a], ukuu wake, mkono wake wenye nguvu[b], na mkono wake ulionyoshwa—
  rationale: Marekebisho pekee ni kubadili “sisemi na watoto wenu” kuwa “siwahutubii watoto wenu.” Hii huhifadhi ufafanuzi uliokusudiwa wa udondoshaji wa Kiebrania, huku ikitumia Kiswahili cha kawaida zaidi. Tanbihi ya a imehifadhiwa ili msomaji ajue kwamba kitenzi cha kuwahutubia ni ufafanuzi wa muktadha, si neno lililotajwa wazi katika chanzo.
