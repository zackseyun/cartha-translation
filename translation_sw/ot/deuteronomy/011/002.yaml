  terminology: “Yahwe,” “nidhamu,” “ukuu wake,” “mkono wake wenye nguvu,” na “mkono wake ulionyoshwa” ni istilahi zinazofaa. Kurudiwa kwa “mkono” kunakubalika katika matumizi ya kawaida ya Kiswahili kwa taswira za “hand” na “arm” za Kiebrania; haipaswi kulazimishwa tofauti ya kiungo ambayo ingeleta usemi usio wa kawaida.
