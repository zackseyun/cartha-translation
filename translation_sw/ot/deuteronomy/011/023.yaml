base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/023.yaml
  text: then Yahweh will drive out all these nations before you, and you will dispossess nations greater and mightier than you.
translation:
  language: sw
  text: Ndipo Yahweh atayafukuza mataifa haya yote mbele yenu, nanyi mtayanyang’anya mataifa makubwa na yenye nguvu kuliko ninyi milki yao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹרִישׁ
  choice: atayafukuza
  rationale: Hifili ya ירשׁ ina maana ya kusababisha wengine waondoke katika milki yao; ‘atayafukuza’ ni Kiswahili cha kawaida na kinachofaa katika muktadha huu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa tetragramatoni linatunzwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: כָּל הַגּוֹיִם הָאֵלֶּה
  choice: mataifa haya yote
  rationale: גּוֹיִם hapa hurejelea makundi ya watu yaliyo katika nchi hiyo; ‘mataifa’ huhifadhi maana yake ya kijamii na kisiasa.
- source_word: מִלִּפְנֵיכֶם
  choice: mbele yenu
  rationale: Huu ni usemi wa kawaida wa Kiebrania unaomaanisha kuondolewa katika njia au uwepo wao; ‘mbele yenu’ huhifadhi taswira ya asili kwa Kiswahili kinachoeleweka.
- source_word: וִירִשְׁתֶּם
  choice: mtayanyang’anya milki
  rationale: Kwa kuwa shamirisho ni mataifa, si nchi, maana hapa ni kuyaondolea mataifa hayo umiliki wao. ‘Kuyanyang’anya milki’ huonyesha tofauti na kitendo cha Yahweh cha kuyafukuza.
- source_word: גְּדֹלִים
  choice: makubwa
  rationale: Kivumishi kina maana linganishi kutokana na מִכֶּם; katika Kiswahili ‘makubwa ... kuliko ninyi’ huwasilisha ulinganisho huo kwa kawaida.
- source_word: וַעֲצֻמִים
  choice: yenye nguvu
  rationale: עָצוּם huonyesha nguvu au uwezo mkubwa; ‘yenye nguvu’ ni ya sasa, yenye hadhi, na inaeleweka kwa urahisi.
- source_word: מִכֶּם
  choice: kuliko ninyi
  rationale: Hii ni matumizi ya מִן kuonyesha ulinganisho na nafsi ya pili wingi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יְהוָה. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya וִירִשְׁתֶּם wakati shamirisho ni mataifa
  choice: mtayanyang’anya milki
  alternative: mtayamiliki au mtairithi nchi ya mataifa
  rationale: Maandishi yanaweka ‘mataifa’ yenyewe kuwa shamirisho. Tafsiri iliyochaguliwa huhifadhi ukali na mvutano wa usemi bila kuongeza ‘nchi,’ ambalo halipo katika aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi huhifadhi mfuatano wa matendo ya Kiebrania na tofauti kati ya Yahweh kuyafukuza mataifa na Israeli kuyanyang’anya milki.
