  text: And you shall write them on the doorposts of your house and on your gates[a][b].
translation:
  language: sw
  text: Nawe uyaandike kwenye miimo ya milango ya nyumba yako na kwenye malango yako.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fremu za milango.” Neno la Kiebrania linarejelea nguzo za pembeni za nafasi ya mlango.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika maeneo ya malango yako.” Kiebrania kinaweza kumaanisha malango yenyewe au maeneo ya malango.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: Nawe uyaandike
  rationale: Kitenzi cha Kiebrania chenye kiunganishi kinaendeleza mfululizo wa maagizo ya agano. Kiswahili cha utegemezi, “uyaandike,” kinaonyesha nguvu ya agizo, huku kiwakilishi “-ya-” kikirejelea maneno yaliyotajwa awali.
- source_word: עַל
  choice: juu ya
  rationale: Kihusishi kinaonyesha mahali ambapo maandishi yanawekwa; “juu ya” ni Kiswahili cha kawaida na cha moja kwa moja katika muktadha huu.
- source_word: מְזוּזוֹת
  choice: miimo ya milango
  rationale: Nomino hiyo inarejelea nguzo za pembeni za nafasi ya mlango. “Miimo ya milango” ni tafsiri ya kawaida na inayoeleweka, bila kuingiza maana ya desturi ya baadaye inayohusishwa na neno lililotoholewa mezuzah.
- source_word: בֵּיתֶךָ
  choice: ya nyumba yako
  rationale: בַּיִת hapa ni nyumba halisi katika mazingira ya familia; “nyumba” huhifadhi maana hiyo ya moja kwa moja.
- source_word: וּבִשְׁעָרֶיךָ
  choice: na juu ya malango yako
  rationale: שַׁעַר kwa kawaida ni lango, na inaweza pia kumaanisha eneo la lango. Wingi “malango” hufuata umbo la Kiebrania, huku kihusishi kikirejelewa wazi kwa mtiririko wa kawaida.
