  text: רְאֵ֗ה אָנֹכִ֛י נֹתֵ֥ן לִ/פְנֵי/כֶ֖ם הַ/יּ֑וֹם בְּרָכָ֖ה וּ/קְלָלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/026.yaml
  text: See[a], today I am setting before you a blessing and a curse.
translation:
  language: sw
  text: Tazama, leo ninaweka[a] mbele yenu baraka na laana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ninatoa.” Kitenzi cha Kiebrania kinaweza kumaanisha “kutoa,” lakini katika muundo huu “ninaweka mbele yenu” ni usemi wa kawaida zaidi katika Kiswahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Tazama
  rationale: Ni amri ya umoja inayovuta usikivu wa Israeli kama jumuiya. “Tazama” ni ya heshima na ya kawaida katika matini ya Biblia bila kuwa ya kizamani kupita kiasi.
- source_word: אָנֹכִי
  choice: nina-
  rationale: Kiambishi cha nafsi ya kwanza katika “ninaweka” huonyesha wazi msemaji. Kuongeza “mimi mwenyewe” kungetia mkazo mkubwa kuliko ulio lazima hapa.
- source_word: נֹתֵן
  choice: ninaweka
  rationale: Kitenzi נתן kinaweza kumaanisha kutoa, kuweka, au kukabidhi. Pamoja na “mbele yenu,” “ninaweka” linaeleza kwa Kiswahili cha kawaida tendo la kuwasilisha mambo mawili ili wachague.
- source_word: לִפְנֵיכֶם
  choice: mbele yenu
  rationale: Huhifadhi nahau ya Kiebrania na wingi wa wanaoambiwa, huku ikiwa ya asili katika Kiswahili.
- source_word: הַיּוֹם
  choice: leo
  rationale: Ni kielezi cha wakati kilicho wazi na cha kawaida katika Kiswahili cha sasa.
- source_word: בְּרָכָה
  choice: baraka
  rationale: Huwakilisha nomino ya umoja kama upande mmoja wa mambo mawili yanayowekwa mbele ya Israeli. Kiswahili hakihitaji kibainishi kisicho dhahiri kama “a” ya Kiingereza.
- source_word: וּקְלָלָה
  choice: na laana
  rationale: Huhifadhi ulinganifu wa kinyume kati ya baraka na laana bila kuongeza maelezo ya kitafsiri.
theological_decisions:
- issue: Asili ya kauli ya baraka na laana
  choice: Kuzitafsiri kama mambo mawili ya agano yanayowekwa mbele ya Israeli bila kuyafafanua zaidi.
  alternative: Kuitafsiri kama kanuni ya jumla ya maadili kuhusu thawabu na adhabu.
  rationale: Mstari huu unatambulisha baraka na laana katika muktadha wa agano wa Kumbukumbu la Torati. Tafsiri inadumisha uwasilishaji huo bila kuingiza hitimisho la kimafundisho ambalo mstari wenyewe halisemi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Umoja wa “Tazama” na wingi wa “yenu” umehifadhiwa ili kuakisi Israeli kuitwa kama jumuiya moja huku washiriki wake wakisemeshwa kwa wingi.
