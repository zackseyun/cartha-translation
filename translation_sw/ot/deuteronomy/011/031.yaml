  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֤י אַתֶּם֙ עֹבְרִ֣ים אֶת הַ/יַּרְדֵּ֔ן לָ/בֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם נֹתֵ֣ן לָ/כֶ֑ם וִֽ/ירִשְׁתֶּ֥ם אֹתָ֖/הּ וִֽ/ישַׁבְתֶּם בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/031.yaml
  text: For you are crossing the Jordan to go in to take possession of the land that Yahweh your God is giving you[a], and you will take possession of it and live in it.
translation:
  language: sw
  text: Kwa maana mnavuka Yordani ili kuingia na kuimiliki nchi ambayo Yahweh, Mungu wenu, anawapa[a]; nanyi mtaimiliki nchi hiyo na kuishi humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa desturi hutafsiriwa “BWANA.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya agizo lililotangulia; “Kwa maana” kinahifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: עֹבְרִים אֶת הַיַּרְדֵּן
  choice: mnavuka Yordani
  rationale: Kitenzi cha hali endelevu kinaonyesha tendo lililo karibu kutokea au linalotazamwa kana kwamba linaendelea. Jina la mto limetolewa kwa namna iliyozoeleka bila kuongeza neno lisilokuwapo wazi katika Kiebrania.
- source_word: לָבֹא
  choice: ili kuingia
  rationale: Kiswahili hutumia “ili” kwa kawaida kueleza kusudi la kuvuka; “kuingia” kinahifadhi hatua ya kuingia katika nchi.
- source_word: לָרֶשֶׁת / וִירִשְׁתֶּם אֹתָהּ
  choice: kuimiliki / mtaimiliki
  rationale: ירשׁ hapa humaanisha kuipata na kuishikilia nchi kama milki. Kurudia mzizi kwa “miliki” kunahifadhi urudiaji wa Kiebrania kwa lugha fupi na ya asili.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha huu אֶרֶץ ni eneo ambalo Israeli itaingia na kulimiliki; “nchi” ni la kawaida na linafaa kuliko “ardhi” hapa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano YHWH limetafsiriwa kwa umbo la Kiswahili linalotumiwa moja kwa moja kama jina binafsi, badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Kiambishi cha nafsi ya pili wingi kimehifadhiwa kwa “wenu,” kikirejelea watu wote wanaosemewa.
- source_word: נֹתֵן לָכֶם
  choice: anawapa
  rationale: Umbo la participle linaonyesha utoaji unaotazamwa kuwa wa sasa au ulio karibu na wa hakika; wakati wa sasa wa Kiswahili unafaa.
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: na kukaa ndani yake
  rationale: ישׁב inaweza kumaanisha kukaa au kuishi mahali. “Kukaa ndani yake” ni ya kawaida, yenye hadhi, na haiweki mkazo wa ziada wa kuanzisha makazi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku tanbihi ikitaja desturi nyingine.
- issue: Uhusiano wa nchi kuwa zawadi na tendo la kuimiliki
  choice: nchi ambayo Yahwe Mungu wenu anawapa; nanyi mtaimiliki
  alternative: nchi ambayo mtajipatia
  rationale: Tafsiri inadumisha mvutano wa maandishi kati ya Mungu kutoa nchi na watu kuimiliki, bila kufanya mojawapo liondoe jingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mtiririko wa sababu, kusudi, zawadi ya Mungu, umiliki, na makazi. Alama [a] imewekwa mara tu baada ya kirai kinacholitaja jina Yahwe, kwa kufuata safu ya mashauriano iliyotolewa.
