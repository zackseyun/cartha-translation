  yaml_path: translation/ot/deuteronomy/011/007.yaml
  text: For your own eyes have seen all the great work of Yahweh that he did[a].
translation:
  language: sw
  text: Kwa maana macho yenu yenyewe yameona kazi yote kuu ambayo Yahweh alifanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “macho yenu, yale yanayoona”—muundo wa kusisitiza kwamba walikuwa mashahidi wa kuona.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Hutanguliza msingi au maelezo ya himizo lililotangulia; “Kwa maana” huhifadhi nguvu ya kisababu katika Kiswahili cha kawaida.
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: macho yenu wenyewe yameona
  rationale: Muundo wa Kiebrania unasisitiza kwamba wasikilizaji walikuwa mashahidi wa kuona. “Wenyewe” huleta msisitizo huo kwa Kiswahili cha asili, huku wakati timilifu ukifaa kwa matendo yaliyokwisha kushuhudiwa.
- source_word: אֶת כָּל מַעֲשֵׂה
  choice: kazi yote
  rationale: Nomino ya umoja pamoja na “yote” inaonyesha ujumla wa yote aliyoyatenda Yahweh; “kazi yote” huhifadhi hali hiyo ya kijumla.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu katika maandishi ya Kiebrania limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: הַגָּדֹל
  choice: kuu
  rationale: Kivumishi hiki kinaeleza ukubwa wa kazi; “kuu” ni cha moja kwa moja na cha heshima.
- source_word: אֲשֶׁר עָשָׂה
  choice: ambayo ... alifanya
  rationale: Huhifadhi kishazi rejeshi na maana ya kawaida ya kitenzi cha Kiebrania bila kuongeza ufafanuzi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina maalumu la Mungu. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umefanywa wa kawaida kwa Kiswahili, huku msisitizo wa ushuhuda wa moja kwa moja ukihifadhiwa kwa “macho yenu wenyewe.”
