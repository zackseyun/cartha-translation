  text: לֹא יִתְיַצֵּ֥ב אִ֖ישׁ בִּ/פְנֵי/כֶ֑ם פַּחְדְּ/כֶ֨ם וּ/מֽוֹרַאֲ/כֶ֜ם יִתֵּ֣ן יְהוָ֣ה אֱלֹֽהֵי/כֶ֗ם עַל פְּנֵ֤י כָל הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר תִּדְרְכוּ בָ֔/הּ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/025.yaml
  text: No man will stand before you[a]. Yahweh your God will put the fear and dread of you on the face of all the land on which you tread[b], just as he spoke to you.
translation:
  language: sw
  text: Hakuna mtu atakayesimama mbele yenu[a]. Yahwe, Mungu wenu, ataweka hofu yenu na woga wenu juu ya nchi yote mtakayoikanyaga[b], kama alivyowaambia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hakuna mtu atakayeweza kusimama mbele yenu.” Nahau ya Kiebrania “kusimama mbele” inaweza kumaanisha kustahimili au kupinga kwa mafanikio.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “juu ya uso wa nchi yote.” Wengine hutafsiri “dunia yote,” lakini “nchi” inafaa zaidi katika muktadha wa eneo watakalolikanyaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצֵּב אִישׁ בִּפְנֵיכֶם
  choice: Hakuna mtu atakayesimama mbele yenu
  rationale: Inahifadhi taswira ya Kiebrania ya ‘kusimama mbele’ huku muktadha ukidokeza uwezo wa kustahimili au kupinga. ‘Mtu’ ni ya kawaida na jumuishi katika Kiswahili bila kupoteza maana ya אִישׁ hapa.
- source_word: פַּחְדְּכֶם וּמוֹרַאֲכֶם
  choice: hofu na woga unaosababishwa nanyi
  rationale: Nomino mbili zinahifadhiwa ili kuonyesha msisitizo wa jozi hiyo. Kirai ‘unaosababishwa nanyi’ kinaweka wazi kwamba mataifa ndiyo yatakayowaogopa Israeli, badala ya kudokeza kuwa Israeli wenyewe watakuwa na hofu.
- source_word: יִתֵּן
  choice: ataeneza
  rationale: Ingawa נתן kimsingi ni ‘kutoa/kuweka,’ katika muundo huu wa kuweka hofu katika eneo lote, ‘ataeneza’ ni Kiswahili cha kawaida kinachowasilisha athari katika nchi nzima.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahwe Mungu wenu
  rationale: Jina la agano יְהוָה linawakilishwa moja kwa moja kama ‘Yahwe,’ na ‘Mungu wenu’ linahifadhi uhusiano unaotajwa na maandishi.
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: katika nchi yote
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili ya nahau halisi ‘juu ya uso wa nchi yote.’ Muktadha unaweka mipaka kwenye eneo ambalo Israeli watakanyaga, hivyo ‘nchi’ inafaa zaidi kuliko ‘dunia.’
- source_word: אֲשֶׁר תִּדְרְכוּ בָהּ
  choice: mtakayoikanyaga
  rationale: ‘Kukanyaga’ huhifadhi picha halisi ya דרך na inafungamana moja kwa moja na ‘nchi.’
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: kama alivyowaambia
  rationale: דבר ni kusema au kunena. ‘Alivyowaambia’ ni ya asili katika Kiswahili na haibadili kitenzi kuwa ‘aliahidi,’ ingawa muktadha una nguvu ya ahadi.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano moja kwa moja. ‘Yahwe’ hulitofautisha na cheo ‘Bwana’ na kulihifadhi kama jina maalumu.
- issue: Maana ya אִישׁ katika usemi wa jumla
  choice: mtu
  alternative: mwanamume; yeyote
  rationale: Katika muktadha huu אִישׁ ni umoja wakilishi. ‘Mtu’ ni Kiswahili cha kawaida kinachowasilisha maana ya kwamba hakuna yeyote atakayeweza kuwapinga, bila kuingiza dai kwamba wanawake wametajwa tofauti.
- issue: Nguvu ya kauli ‘kusimama mbele yenu’
  choice: taswira ya kusimama imehifadhiwa katika maandishi, na maana ya kupinga imeelezwa katika tanbihi
  alternative: Hakuna atakayeweza kuwashinda au kuwapinga
  rationale: Njia hii hailazimishi maana moja pekee ya nahau, bali inahifadhi picha ya chanzo pamoja na maana yake ya kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi taswira kuu za Kiebrania bila kuwa ngumu kupita kiasi; tanbihi zinaonyesha nahau na uwezekano wa ‘nchi/dunia.’
