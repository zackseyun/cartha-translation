  text: the blessing[a], if you listen to the commandments of Yahweh your God[b], which I am commanding you today.
translation:
  language: sw
  text: Baraka[a], ikiwa mtayasikiliza[b] maagizo ya Yahwe Mungu wenu, ninayowaagiza leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baraka inayokuja mtakapoyatii maagizo ya Yahwe Mungu wenu.” Katika Kiebrania, neno la uhusiano limetumiwa hapa kwa maana ya sharti.
    reason: lexical_alternative
  - marker: b
    text: “Kusikiliza” hapa kunaweza pia kutafsiriwa “kutii,” kwa kuwa kitenzi hiki cha Kiebrania mara nyingi humaanisha kusikia na kuitikia kwa utii.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת הַבְּרָכָה
  choice: baraka
  rationale: Kirai hiki ni shamirisho kinachoendeleza muundo usiokamilika wa mstari uliotangulia. Kiswahili kinaweza kuendeleza kwa ufupi kwa kusema “baraka” bila kuongeza maneno yasiyokuwamo wazi katika Kiebrania.
- source_word: אֲשֶׁר
  choice: ikiwa
  rationale: Ingawa kwa umbo ni kiwakilishi cha uhusiano, hapa kina maana ya sharti linalohusisha baraka na kuitikia maagizo; “ikiwa” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: תִּשְׁמְעוּ אֶל
  choice: mtayasikiliza
  rationale: Kitenzi שׁמע pamoja na אֶל humaanisha kusikiliza kwa makini, huku mwitikio wa utii ukidokezwa. “Mtayasikiliza” huhifadhi taswira ya kusikia kuliko kutafsiri moja kwa moja “mtatii.”
- source_word: מִצְוֺת
  choice: maagizo
  rationale: “Maagizo” ni neno la kawaida na lenye hadhi linalofaa kwa amri za agano; pia linaepuka kufanya kifungu hiki kisikike kana kwamba kinarejelea tu Amri Kumi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: 'Kiambishi cha nafsi ya pili wingi kinaonyesha umilikaji moja kwa moja: “Mungu wenu.”'
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: ambayo ninawaamuru leo
  rationale: “Ambayo” hurejelea maagizo, na “ninawaamuru” huonyesha tendo la Musa la kutoa amri katika hotuba hii ya sasa; “leo” huhifadhi uharaka wa agano.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandiko ya Kiebrania yana jina binafsi יְהוָה; “Yahwe” hulihifadhi kama jina la agano bila kulibadilisha kuwa cheo au kuingiza mapokeo ya dhehebu.
- issue: Uhusiano kati ya kusikiliza na kutii
  choice: mtayasikiliza, huku utii ukidokezwa
  alternative: mtayatii
  rationale: Kiebrania hutumia kitenzi cha kusikia/kusikiliza ambacho katika muktadha wa agano mara nyingi huhusisha utii. Tafsiri kuu huhifadhi maana ya msingi, na tanbihi inaeleza maana pana bila kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi unaoanza na “baraka” umehifadhiwa kwa sababu mstari huu unaendeleza sentensi ya mstari uliotangulia. Kiambishi “-ya-” katika “mtayasikiliza” kinarejelea “maagizo” na kufanya sentensi isomeke kwa kawaida.
