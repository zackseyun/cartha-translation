source:
  edition: WLC
  text: לְמַ֨עַן יִרְבּ֤וּ יְמֵי/כֶם֙ וִ/ימֵ֣י בְנֵי/כֶ֔ם עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֵי/כֶ֖ם לָ/תֵ֣ת לָ/הֶ֑ם כִּ/ימֵ֥י הַ/שָּׁמַ֖יִם עַל הָ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/021.yaml
  text: so that your days and the days of your sons may be multiplied on the land that Yahweh swore to your fathers to give them[b][a], as the days of the heavens above the earth.
translation:
  language: sw
  text: ili siku zenu na siku za wana wenu wa kiume[a] ziwe nyingi katika nchi ambayo Yahweh aliwaapia baba zenu kwamba angewapa, kama zilivyo siku za mbingu juu ya dunia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watoto wenu.” Kiebrania kinasema kihalisi “wana wenu wa kiume.”
    reason: lexical_alternative
  - marker: b
    text: Au, “maadamu mbingu ziko juu ya dunia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: ili
  rationale: Huonyesha kusudi au matokeo ya maagizo yaliyotangulia kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: יִרְבּוּ יְמֵיכֶם
  choice: siku zenu ... ziwe nyingi
  rationale: Inahifadhi nahau ya Kiebrania inayosema siku kuwa nyingi, badala ya kuifafanua moja kwa moja kuwa kuishi muda mrefu.
- source_word: וִימֵי בְנֵיכֶם
  choice: na siku za wana wenu
  rationale: בנים hapa ni wingi wa kiume, kwa hiyo 'wana' huhifadhi umbo la chanzo; uwezekano wa maana pana zaidi umeonyeshwa katika tanbihi.
- source_word: עַל הָאֲדָמָה
  choice: katika nchi
  rationale: Katika muktadha wa Kumbukumbu la Torati, neno hili linahusu nchi waliyoahidiwa; 'katika nchi' ni Kiswahili cha asili zaidi kuliko 'juu ya nchi'.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֵיכֶם
  choice: ambayo Yahwe aliwaapia baba zenu
  rationale: Inahifadhi lugha ya kiapo cha agano na uhusiano wa kifamilia wa 'baba zenu'.
- source_word: לָתֵת לָהֶם
  choice: kwamba angewapa
  rationale: Kitenzi cha Kiswahili kinaonyesha kwa kawaida kwamba nchi ndiyo kitu walichoahidiwa kupewa, huku kiwakilishi cha 'wa-' kikirejelea baba zao.
- source_word: כִּימֵי הַשָּׁמַיִם עַל הָאָרֶץ
  choice: kama zilivyo siku za mbingu juu ya dunia
  rationale: Inahifadhi taswira na ulinganisho wa Kiebrania bila kuubadili kimya kuwa kauli ya muda usio na mwisho; maana ya kimazoea imewekwa tanbihini.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina la agano יהוה; 'Yahwe' hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya kijinsia ya בְנֵיכֶם
  choice: wana wenu
  alternative: watoto wenu
  rationale: Neno la Kiebrania ni la kiume kwa umbo, lakini linaweza kutumiwa kwa maana pana ya wazao; tafsiri kuu huhifadhi umbo hilo na tanbihi huonyesha uwezekano mpana.
- issue: Ulinganisho כִּימֵי הַשָּׁמַיִם עַל הָאָרֶץ
  choice: kama zilivyo siku za mbingu juu ya dunia
  alternative: maadamu mbingu ziko juu ya dunia
  rationale: Tafsiri kuu huhifadhi taswira yenye mvutano ya maandishi; tanbihi huonyesha maana inayowezekana ya kudumu kwa muda mrefu sana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa 'siku ... ziwe nyingi' na taswira ya 'siku za mbingu' umehifadhiwa kwa makusudi ili kutopoteza nahau na fumbo la chanzo.
