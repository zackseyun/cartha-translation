base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/014.yaml
  text: then I will give the rain for your land in its season[a], the early rain and the late rain, and you will gather in your grain, your new wine[c][b], and your oil.
translation:
  language: sw
  text: ndipo nitainyeshea nchi yenu mvua kwa wakati wake[a]—mvua ya mapema na mvua ya mwisho—nawe utakusanya[d] nafaka yako, divai yako mpya[b], na mafuta yako[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa majira yake.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, divai iliyotengenezwa karibuni; au, “divai” tu.
    reason: lexical_alternative
  - marker: c
    text: Yaani, mafuta ya zeituni.
    reason: cultural_note
  - marker: d
    text: Neno “wewe” la umoja hapa linamlenga Israeli kwa ujumla.
    reason: grammar_note
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: ndipo nitakapoiletea
  rationale: Kitenzi cha nafsi ya kwanza umoja katika mfululizo huu wa masharti kinaonyesha matokeo au ahadi ya wakati ujao. “Ndipo” huunganisha ahadi hii kwa kawaida na sharti la mstari uliotangulia, huku kikihifadhi kwamba Mungu ndiye anayetoa mvua.
- source_word: מְטַר אַרְצְכֶם
  choice: nchi yenu mvua
  rationale: מְטַר ni mvua kama baraka inayohitajika kwa kilimo, na אֶרֶץ hapa ni nchi/ardhi ya Israeli. Muundo “kuiletea nchi yenu mvua” ni Kiswahili cha kawaida kuliko tafsiri ya neno kwa neno “kutoa mvua ya nchi yenu.”
- source_word: בְּעִתּוֹ
  choice: kwa wakati wake
  rationale: Kirai hiki kinaonyesha wakati unaofaa au uliowekwa wa mvua. “Kwa wakati wake” ni wazi na pia huhifadhi kiwakilishi cha umoja kilichomo katika Kiebrania.
- source_word: יוֹרֶה וּמַלְקוֹשׁ
  choice: mvua ya mapema na mvua ya mwisho
  rationale: Maneno haya yanataja mvua za mwanzo wa msimu na za baadaye katika mzunguko wa kilimo wa nchi hiyo. Tafsiri hii huhifadhi utofautishaji wa wakati bila kutumia majina ya misimu ya Afrika Mashariki, ambayo yangehamisha mazingira ya kijiografia.
- source_word: וְאָסַפְתָּ
  choice: nawe utakusanya
  rationale: Kitenzi maana yake ni kukusanya au kuingiza mazao. “Utakusanya” hakiongezi wazo maalumu zaidi la kuvuna ambalo halijaelezwa moja kwa moja. Umoja wa “nawe” huhifadhi mabadiliko ya Kiebrania kutoka “yenu” ya wingi kwenda kwa msemajiwa wa umoja wa pamoja.
- source_word: דְגָנֶךָ
  choice: nafaka yako
  rationale: דָּגָן ni neno pana kwa mazao ya nafaka; “nafaka” ni sawa la kawaida na linaloeleweka katika Kiswahili sanifu.
- source_word: וְתִירֹשְׁךָ
  choice: divai yako mpya
  rationale: תִּירוֹשׁ kwa kawaida ni divai iliyotengenezwa karibuni au mazao mapya ya divai. “Divai mpya” huhifadhi upekee huo katika orodha ya mazao.
- source_word: וְיִצְהָרֶךָ
  choice: mafuta yako
  rationale: יִצְהָר katika orodha hii ya kawaida ya kilimo humaanisha mafuta ya zeituni. Neno fupi “mafuta” huhifadhi namna ya Kiebrania, huku tanbihi ikifafanua zao linalokusudiwa.
theological_decisions:
- issue: Lugha ya baraka za kilimo katika muktadha wa agano
  choice: Mstari umetafsiriwa kama ahadi halisi ya mvua kwa wakati wake na ya mazao kwa Israeli katika nchi hiyo.
  alternative: Kuchukulia mvua hasa kama mfano wa baraka za kiroho, wa kieskatolojia, au kama ahadi ya ustawi wa mali kwa kila msomaji.
  rationale: Kiebrania kinazungumzia moja kwa moja mvua na mazao katika mazingira ya agano na kilimo. Tafsiri haipaswi kuingiza maana za baadaye au za kimadhehebu katika maandishi yenyewe.
- issue: Mabadiliko kutoka nafsi ya pili wingi kwenda nafsi ya pili umoja
  choice: Kuhifadhi “nchi yenu” kisha “nawe… yako,” na kufafanua katika tanbihi kwamba umoja unamlenga Israeli kwa pamoja.
  alternative: 'Kusawazisha vifungu vyote viwe vya wingi: “nanyi mtakusanya… yenu.”'
  rationale: Maandishi ya Kiebrania yana viambishi vya wingi katika אַרְצְכֶם lakini kitenzi na viambishi vya mazao ni vya umoja wa kiume. Kuhifadhi badiliko hilo kunafuata ushahidi wa chanzo bila kulificha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mvua ya mapema” na “mvua ya mwisho” zimechaguliwa badala ya majina ya misimu ya Afrika Mashariki ili kuepuka kuhamisha mazingira ya Israeli. Mstari huhifadhi mabadiliko ya idadi ya kisarufi yaliyopo katika Kiebrania.
