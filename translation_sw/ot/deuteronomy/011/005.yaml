  text: na yale aliyowatendea jangwani mpaka mlipofika mahali hapa—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: na yale
  rationale: Inaendeleza orodha ya matendo ambayo Waisraeli walikuwa wameyaona, huku ikihifadhi maana ya kiwakilishi cha uhusiano.
- source_word: עָשָׂה לָכֶם
  choice: aliyowatendea
  rationale: Kitenzi hiki kinaeleza matendo yake kwao bila kuyafanya yaonekane kuwa ya manufaa tu; pia ni Kiswahili cha asili katika muktadha huu.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: Ni neno la kawaida na linaloeleweka kwa eneo la nyika ambako Israeli walizunguka.
- source_word: עַד בֹּאֲכֶם
  choice: mpaka mlipofika
  rationale: Kitenzi cha Kiebrania kilicho katika muundo wa jina la kitendo kimetafsiriwa kwa kishazi cha kawaida cha Kiswahili kinachoonyesha kikomo cha wakati.
- source_word: עַד הַמָּקוֹם הַזֶּה
  choice: mahali hapa
  rationale: Katika Kiswahili, mwelekeo wa kufika unaeleweka tayari kutokana na 'mlipofika'; hivyo tafsiri hii inawasilisha kikomo cha mahali kwa ufasaha bila kurudia 'mpaka'.
theological_decisions:
- issue: Mtendaji asiyeandikwa wazi pamoja na עָשָׂה
  choice: aliyowatendea
  alternative: BWANA aliyowatendea
  rationale: Muktadha unaonyesha kwamba mtendaji ni BWANA, lakini jina lake halipo katika mstari huu. Kiambishi cha nafsi katika 'aliyo-' kinadumisha rejeleo hilo bila kuongeza jina lisilomo hapa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mstari umeachwa kama sehemu inayoendeleza sentensi ya mistari inayozunguka, na kistari kirefu mwishoni kinahifadhi mwendelezo huo.
