base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/016.yaml
  text: Be careful lest your heart be deceived and you turn aside and serve other gods and bow down to them[a].
translation:
  language: sw
  text: Jihadharini, mioyo yenu isije ikadanganywa, mkageuka na mkaitumikia miungu mingine na mkaiinamia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mioyo yenu isije ikashawishiwa.” Kitenzi cha Kiebrania kinaweza kuwa na maana ya kushawishiwa, kuvutiwa, au kudanganywa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: Jihadharini
  rationale: Kauli hii ya onyo yenye maana ya kujilinda inawasilishwa kwa amri ya wingi iliyo ya kawaida na yenye nguvu katika Kiswahili; maana ya kujirejelea iliyomo katika לָכֶם inadokezwa na umbo la kitenzi 'jihadharini'.
- source_word: פֶּן
  choice: isije
  rationale: פֶּן huanzisha jambo hasi linalotakiwa kuzuiwa. Muundo wa 'isije' ni wa kawaida katika onyo la Kiswahili na unaendeleza sentensi kwa ufasaha.
- source_word: יִפְתֶּה
  choice: ikadanganywa
  rationale: Kitenzi פתה kinaweza kumaanisha kushawishi, kuvutia, au kudanganya. 'Ikadanganywa' huhifadhi moyo kama kiima cha umoja na kuonyesha hatari ya kupotoshwa bila kufuta maana mbadala ya kushawishi, ambayo imewekwa katika tanbihi.
- source_word: לְבַבְכֶם
  choice: mioyo yenu
  rationale: לֵבָב humaanisha utu wa ndani, kutia ndani nia na ufahamu. 'Mioyo yenu' ni tafsiri ya kawaida yenye uzito wa kimuktadha; wingi unapatana kiasili na kundi linaloonywa, ingawa Kiebrania hutumia nomino ya umoja pamoja na kiambishi cha wingi.
- source_word: וְסַרְתֶּם
  choice: mkageuka
  rationale: סור hapa ni kuacha njia au uaminifu ufaao. 'Mkageuka' huhifadhi picha ya kugeuka na maendeleo ya onyo kuelekea uasi.
- source_word: וַעֲבַדְתֶּם
  choice: na kuitumikia
  rationale: עבד inapotumiwa kuhusu miungu humaanisha kuitumikia kwa kujitoa kidini. 'Kuitumikia' ni tofauti na tendo halisi la kuinama linalofuata.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Hii ndiyo maana ya moja kwa moja ya kirai, bila kuongeza wazo la kwamba ni miungu ya kigeni.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: na kuiinamia
  rationale: השתחוה hueleza kuinama au kujisujudu, mara nyingi katika ibada. 'Kuiinamia' huhifadhi tendo halisi huku muktadha ukionyesha maana yake ya kidini.
theological_decisions:
- issue: Asili ya onyo dhidi ya kuasi agano
  choice: Mstari unaonya kuhusu kudanganywa kwa utu wa ndani kunakoongoza kwenye kugeuka, kuitumikia miungu mingine, na kuiinamia.
  alternative: Kutafsiri kwa ufafanuzi zaidi kama kushawishiwa kuingia katika ibada ya sanamu.
  rationale: Mpangilio wa Kiebrania unatoka katika hali ya moyo hadi kugeuka na matendo ya kumtumikia na kuiinamia miungu mingine. Tafsiri inadumisha hatua hizo bila kuziunganisha zote katika istilahi moja ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo 'mioyo yenu isije' unalingana kiasili na hadhira ya wingi huku ukihifadhi wazo la ndani la לֵבָב.
