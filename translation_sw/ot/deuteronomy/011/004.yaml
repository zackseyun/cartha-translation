  text: וַ/אֲשֶׁ֣ר עָשָׂה֩ לְ/חֵ֨יל מִצְרַ֜יִם לְ/סוּסָ֣י/ו וּ/לְ/רִכְבּ֗/וֹ אֲשֶׁ֨ר הֵצִ֜יף אֶת מֵ֤י יַם סוּף֙ עַל פְּנֵי/הֶ֔ם בְּ/רָדְפָ֖/ם אַחֲרֵי/כֶ֑ם וַ/יְאַבְּדֵ֣/ם יְהוָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/004.yaml
  text: and what he did to the army of Egypt[a], to its horses and its chariots, when he made the waters of the Red Sea overflow over them as they pursued you, and Yahweh destroyed them to this day,
translation:
  language: sw
  text: na yale aliyolitendea jeshi la Misri, farasi wake na magari yake ya vita, alipofanya maji ya Bahari ya Matete[a] yawafurikie walipokuwa wakiwafuatilia, na Yahwe akawaangamiza mpaka leo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Bahari ya Matete.” Kwa kawaida huitwa “Bahari Nyekundu” au “Bahari ya Shamu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל
  choice: jeshi
  rationale: Katika muktadha wa kijeshi unaotaja farasi na magari ya vita, neno hili linamaanisha jeshi au nguvu ya kijeshi ya Misri.
- source_word: לְסוּסָיו וּלְרִכְבּוֹ
  choice: farasi wake na magari yake ya vita
  rationale: Viambishi vinarejelea Misri kama taifa; ‘magari ya vita’ ni usemi wa kawaida na ulio wazi kwa magari ya kukokotwa yaliyotumiwa vitani.
- source_word: הֵצִיף
  choice: alipofanya ... yawafurikie
  rationale: 'Muundo wa kisababishi umehifadhiwa: Mungu ndiye aliyesababisha maji yawafurikie.'
- source_word: מֵי יַם סוּף
  choice: maji ya Bahari ya Matete
  rationale: Tafsiri hii inaonyesha maana ya msingi ya סוּף, mimea ya majini kama matete, badala ya kutegemea tu jina la kimapokeo.
- source_word: עַל־פְּנֵיהֶם
  choice: yawafurikie
  rationale: Katika muktadha huu msemo unaonyesha maji kuwajia juu na kuwafunika; tafsiri hii ni ya asili katika Kiswahili.
- source_word: בְּרָדְפָם אַחֲרֵיכֶם
  choice: walipokuwa wakiwafuatilia
  rationale: Inaonyesha kwamba kufuatilia kulikuwa kukiendelea wakati maji yalipowafurikia; ‘wa-’ ya pili inarejelea Waisraeli waliozungumziwa kwa wingi.
- source_word: וַיְאַבְּדֵם
  choice: akawaangamiza
  rationale: Kitenzi hiki katika muktadha wa kisababishi kinaeleza kuwasababishia maangamizi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Ni msemo wa kawaida wa Kiebrania unaoonyesha matokeo yanayodumu hadi wakati wa msemaji.
theological_decisions:
- issue: Uandishi wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia moja kwa moja jina la Mungu, kwa hiyo limedumishwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- issue: Tafsiri ya יַם סוּף
  choice: Bahari ya Matete
  alternative: Bahari Nyekundu / Bahari ya Shamu
  rationale: ‘Bahari ya Matete’ inaweka wazi ushahidi wa kileksika wa סוּף; jina la kimapokeo limehifadhiwa katika tanbihi bila kulazimisha utambulisho wa kijiografia usioelezwa moja kwa moja na neno la Kiebrania.
- issue: Maana ya עַד הַיּוֹם הַזֶּה baada ya kuangamizwa
  choice: mpaka leo
  alternative: na athari zake zimedumu mpaka leo
  rationale: Tafsiri fupi inadumisha mvutano na upeo wa msemo wa Kiebrania bila kuongeza maelezo kuhusu namna maangamizi hayo yanavyohusiana na ‘leo.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi imeachwa kama sehemu inayoendelea kutoka aya iliyotangulia, na koma ya mwisho inadumisha muundo huo.
