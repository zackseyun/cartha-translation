  text: וְ/הַ/קְּלָלָ֗ה אִם לֹ֤א תִשְׁמְעוּ֙ אֶל מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּ֑וֹם לָ/לֶ֗כֶת אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹֽא יְדַעְתֶּֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/028.yaml
  text: and the curse[a], if you do not listen to the commandments of Yahweh your God, and turn aside from the way that I am commanding you today, to go after other gods that you have not known.
translation:
  language: sw
  text: na laana, ikiwa hamtazisikiliza[a] amri za Yahweh Mungu wenu, na mkaigeuka njia ninayowaamuru leo, ili kufuata miungu mingine ambayo hamjaijua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msipozitii amri za Yahweh Mungu wenu.” Katika miktadha ya agano, kitenzi cha Kiebrania kinachomaanisha “kusikiliza” mara nyingi huhusisha kusikiliza kwa kutii.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקְּלָלָה
  choice: na laana
  rationale: Nomino yenye uhusiano wa wazi na ‘baraka’ katika mstari uliotangulia; ‘laana’ ndiyo kinyume cha kawaida katika muktadha wa agano.
- source_word: אִם לֹא תִשְׁמְעוּ אֶל
  choice: ikiwa hamtazisikiliza
  rationale: Muundo wa sharti umehifadhiwa kwa ‘ikiwa’; ‘kusikiliza’ hudumisha picha ya Kiebrania huku muktadha wa agano ukidokeza pia kutii.
- source_word: מִצְוֺת
  choice: amri
  rationale: ‘Amri’ ni neno la kawaida, lenye heshima, kwa maagizo yenye mamlaka ya Mungu.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh Mungu wenu
  rationale: Jina la agano יְהוָה limetafsiriwa kwa namna ya kulitamka, ‘Yahweh,’ na אֱלֹהֵיכֶם kwa ‘Mungu wenu.’
- source_word: וְסַרְתֶּם מִן הַדֶּרֶךְ
  choice: bali mtageuka kutoka katika njia
  rationale: ‘Kugeuka kutoka katika njia’ huhifadhi sitiari ya kuiacha njia iliyoamriwa; ‘bali’ huonyesha tofauti ya kimantiki kwa Kiswahili bila kuondoa uhusiano wa kisharti.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: ninayowaamuru leo
  rationale: Huhifadhi usemi wa moja kwa moja wa Musa, hali ya sasa ya kitenzi kishirikishi, na msisitizo wa ‘leo.’
- source_word: לָלֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: na kuifuata miungu mingine
  rationale: ‘Kuifuata’ ni Kiswahili cha asili kwa kwenda nyuma ya mtu au kitu kwa maana halisi na ya uaminifu; umoja wa kiambishi cha kitenzi unaendana na ngeli ya ‘miungu.’
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: ambayo hamkuijua
  rationale: Huhifadhi wakati timilifu wa Kiebrania na maana ya kwamba miungu hiyo haikuwa imejulikana kwao hapo awali.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Ikiwa שׁמע ielezwe wazi kuwa ‘kutii’
  choice: kusikiliza
  alternative: kutii
  rationale: Kitenzi cha Kiebrania kimsingi ni ‘kusikia/kusikiliza’ lakini katika agano kinahusisha kutii. Tafsiri ya ‘kusikiliza’ huhifadhi upana huo, na tanbihi inaeleza maana inayodokezwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa sharti na sitiari ya njia umehifadhiwa bila kufanya maana ya ‘kusikiliza’ iwe ‘kutii’ pekee katika maandishi makuu.
