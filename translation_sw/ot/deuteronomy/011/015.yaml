  text: And I will give grass in your field for your livestock[b][a], and you will eat and be satisfied.
translation:
  language: sw
  text: Nami nitatoa majani[a] katika shamba lako kwa ajili ya mifugo yako, nawe utakula na kushiba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uoto” au “mimea”; neno la Kiebrania linaweza kumaanisha mimea kwa upana, lakini hapa huenda linamaanisha malisho ya mifugo.
    reason: lexical_alternative
  - marker: b
    text: Au “utatosheka”; kitenzi cha Kiebrania humaanisha kujazwa au kutosheka baada ya kula.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Nami nitatoa
  rationale: Kitenzi cha nafsi ya kwanza umoja chenye kiunganishi kinaeleza ahadi ya wakati ujao katika mfululizo wa baraka. “Nami nitatoa” huhifadhi uhusiano na maneno yaliyotangulia na ni Kiswahili cha kawaida.
- source_word: עֵשֶׂב
  choice: majani
  rationale: Katika muktadha wa mifugo, neno hili linaelekea kumaanisha uoto unaofaa kuwa malisho. “Majani” ni neno la kawaida na la asili katika muktadha huu, huku tanbihi ikihifadhi upana wa maana ya Kiebrania.
- source_word: בְּשָׂדְךָ
  choice: katika shamba lako
  rationale: Tafsiri hii huhifadhi umoja, umilikaji wa nafsi ya pili umoja, na mazingira halisi ya kilimo ya שָׂדֶה.
- source_word: לִבְהֶמְתֶּךָ
  choice: kwa ajili ya mifugo yako
  rationale: בְּהֵמָה limetumiwa kwa maana ya mkusanyiko wa wanyama wanaofugwa. “Mifugo” ni wazi na ya kawaida kuliko “wanyama” kwa muktadha huu wa kilimo.
- source_word: וְאָכַלְתָּ
  choice: nawe utakula
  rationale: Huhifadhi nafsi ya pili umoja inayolitaja taifa la Israeli kwa umoja wa uwakilishi, na wakati ujao unaofaa mfululizo wa ahadi.
- source_word: וְשָׂבָעְתָּ
  choice: na kushiba
  rationale: Kitenzi kinaonyesha kujazwa au kutosheka baada ya kula. “Kushiba” ni usemi wa kawaida wa Kiswahili unaowasilisha maana hiyo moja kwa moja.
theological_decisions:
- issue: Israeli kuzungumziwa kwa nafsi ya pili umoja ya uwakilishi
  choice: 'Kuhifadhi umoja: “shamba lako,” “mifugo yako,” “utakula”'
  alternative: 'Kutumia wingi: “mashamba yenu ... mifugo yenu ... mtakula”'
  rationale: Kiebrania hutumia nafsi ya pili ya kiume umoja katika hotuba ya agano kwa Israeli. Umoja umehifadhiwa ili kudumisha muundo na nguvu ya usemi wa chanzo.
- issue: Asili ya baraka iliyoahidiwa
  choice: Kuieleza kama riziki ya kawaida ya kilimo katika agano bila kupanua maana
  alternative: Kuifafanua wazi zaidi kuwa ahadi ya ustawi au utajiri mwingi
  rationale: Aya inaahidi malisho kwa mifugo na chakula kinacholeta shibe. Tafsiri haiongezi madai mapana ya ustawi ambayo hayajasemwa wazi katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nami” na “nawe” huendeleza mfululizo wa ahadi kwa mtiririko wa asili. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
