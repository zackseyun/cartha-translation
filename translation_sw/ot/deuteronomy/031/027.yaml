base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/027.yaml
  text: For I know your rebellion and your stiff neck[a]. Look, while I am still alive with you today, you have been rebellious against Yahweh[b]; and how much more after my death!
translation:
  language: sw
  text: Maana ninajua uasi wako na shingo yako ngumu[a]. Tazama, ningali hai pamoja nanyi leo, mmekuwa mkimwasi Yahweh[b]; sembuse baada ya kifo changu!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “shingo yako ngumu,” nahau inayomaanisha ukaidi au kutotaka kutii.'
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa neno kwa neno kinaweza kutafsiriwa “pamoja na Yahweh”; katika muktadha huu maana yake ni kuwa katika upinzani dhidi ya Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶרְיְךָ
  choice: uasi wako
  rationale: Nomino מֶרִי humaanisha uasi au ukaidi, hasa upinzani kwa mamlaka ya agano. “Uasi wako” ni ya asili katika Kiswahili na inadumisha muundo wa nomino.
- source_word: עָרְפְּךָ הַקָּשֶׁה
  choice: shingo yako ngumu
  rationale: Tafsiri hii inadumisha sitiari ya Kiebrania badala ya kuibadili moja kwa moja kuwa “ukaidi wako”; tanbihi inaeleza maana ya nahau hiyo.
- source_word: הֵן
  choice: Tazama
  rationale: Neno hili linavuta usikivu na kutilia mkazo jambo linalofuata. “Tazama” lina hadhi inayofaa bila kuwa gumu kueleweka.
- source_word: בְּעוֹדֶנִּי חַי
  choice: ningali hai
  rationale: Huwasilisha maana ya kuendelea kuwa hai wakati huo, kwa Kiswahili kifupi na cha asili.
- source_word: מַמְרִים הֱיִתֶם
  choice: mmekuwa mkimwasi
  rationale: Muundo wa kitenzi kishirikishi pamoja na participle unaonyesha hali au mwenendo unaoendelea; “mmekuwa mkimwasi” unadumisha hali hiyo kuliko wakati uliopita sahili.
- source_word: עִם יְהוָה
  choice: mkimwasi Yahwe
  rationale: Ingawa עִם kwa kawaida ni “pamoja na,” kitenzi cha uasi katika muktadha huu kinaonyesha upinzani. Kiswahili cha asili humweka anayewaasiwa kama yambwa wa moja kwa moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika herufi nne za Kiebrania limetolewa kama jina binafsi “Yahwe,” si kwa kubadilishwa na cheo.
- source_word: וְאַף כִּי
  choice: sembuse
  rationale: '“Sembuse” linaonyesha hoja ya kutoka hali iliyo ndogo kwenda iliyo kubwa zaidi: ikiwa waliasi Musa alipokuwa hai, hali hiyo ingetazamiwa kuwa mbaya zaidi baada ya kifo chake.'
- source_word: אַחֲרֵי מוֹתִי
  choice: baada ya kifo changu
  rationale: Tafsiri ya moja kwa moja na ya asili inayodumisha muundo wa nomino wa Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina binafsi la Mungu, יהוה. “Yahwe” linadumisha jina hilo badala ya kulibadilisha na cheo.
- issue: Maana ya עִם pamoja na lugha ya uasi
  choice: mkimwasi Yahwe
  alternative: waasi pamoja na Yahwe
  rationale: Maana ya msingi ya עִם ni “pamoja na,” lakini hapa haiashirii ushirika na Yahwe; katika muktadha wa uasi inaonyesha kwamba Yahwe ndiye anayepingwa. Tafsiri iliyochaguliwa inaweka wazi maana hii bila kuongeza wazo jingine la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. Sitiari ya “shingo ngumu” imehifadhiwa kwa uwazi wa kimatini, huku tanbihi ikifafanua nahau. Mabadiliko kutoka umoja “wako” kwenda wingi “nanyi/mmekuwa” yamehifadhiwa kama yalivyo katika Kiebrania.
