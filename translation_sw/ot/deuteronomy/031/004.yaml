  text: וְ/עָשָׂ֤ה יְהוָה֙ לָ/הֶ֔ם כַּ/אֲשֶׁ֣ר עָשָׂ֗ה לְ/סִיח֥וֹן וּ/לְ/ע֛וֹג מַלְכֵ֥י הָ/אֱמֹרִ֖י וּ/לְ/אַרְצָ֑/ם אֲשֶׁ֥ר הִשְׁמִ֖יד אֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/004.yaml
  text: And the LORD will do to them just as he did to Sihon and Og, the kings of the Amorites, and to their land, when he destroyed them.
translation:
  language: sw
  text: BWANA atawatendea kama alivyowatendea Sihoni na Ogu, wafalme wa Waamori, pamoja na nchi yao, alipowaangamiza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: BWANA
  rationale: Utamaduni wa kawaida wa tafsiri za Biblia za Kiswahili huwakilisha jina la agano YHWH kwa “BWANA” kwa herufi kubwa.
- source_word: וְעָשָׂה ... לָהֶם
  choice: atawatendea
  rationale: Huwasilisha kwa kawaida kitenzi cha wakati ujao pamoja na yambwa “wao” katika Kiswahili.
- source_word: מַלְכֵי הָאֱמֹרִי
  choice: wafalme wa Waamori
  rationale: Huhifadhi wingi wa “wafalme” na jina la kundi la watu kwa Kiswahili sanifu.
- source_word: הִשְׁמִיד אֹתָם
  choice: alipowaangamiza
  rationale: Kitenzi hiki ni kikali na humaanisha kuwaangamiza au kuwaondoa kabisa; “alipowaangamiza” huhifadhi nguvu yake na uhusiano wa wakati katika sentensi.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: “BWANA” ni uwakilishi unaotambulika sana katika Biblia za Kiswahili, huku herufi kubwa zikionyesha kuwa chanzo kina jina la pekee la Mungu.
- issue: Uhusiano wa kishazi אֲשֶׁר הִשְׁמִיד אֹתָם
  choice: alipowaangamiza
  alternative: ambao aliwaangamiza / ambayo aliiharibu
  rationale: Kiwakilishi cha Kiebrania kinaweza kuhusishwa kwa namna isiyo wazi kabisa, lakini yambwa wa wingi אֹתָם unaelekea kwa Sihoni na Ogu au wafalme. Tafsiri ya wakati “alipowaangamiza” hudumisha mtiririko wa hoja bila kukifunga kishazi moja kwa moja kwa “nchi”.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Majina yametolewa kwa maumbo yaliyozoeleka: Sihoni, Ogu, na Waamori.'
