  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הֵ֣ן קָרְב֣וּ יָמֶי/ךָ֮ לָ/מוּת֒ קְרָ֣א אֶת יְהוֹשֻׁ֗עַ וְ/הִֽתְיַצְּב֛וּ בְּ/אֹ֥הֶל מוֹעֵ֖ד וַ/אֲצַוֶּ֑/נּוּ וַ/יֵּ֤לֶךְ מֹשֶׁה֙ וִֽ/יהוֹשֻׁ֔עַ וַ/יִּֽתְיַצְּב֖וּ בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/014.yaml
  text: And Yahweh said to Moses[a], “Behold, your days are drawing near for you to die. Call Joshua, and present yourselves in the tent of meeting, that I may command him.” So Moses and Joshua went and presented themselves in the tent of meeting.
translation:
  language: sw
  text: Yahwe akamwambia Musa, “Tazama, siku za kufa kwako zimekaribia. Mwite Yoshua, nanyi mjitokeze katika hema ya kukutania, nami nitamwagiza[a].” Basi Musa na Yoshua wakaenda na kujitokeza katika hema ya kukutania.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nami nitampa agizo rasmi” au “ili nimwagize.” Kitenzi cha Kiebrania kinaweza kumaanisha kuamuru, kumpa agizo, au kumkabidhi wajibu; hapa kinahusu Yahwe kumpa Yoshua jukumu lake rasmi.
    reason: Mbadala wa kileksia na kisintaksia unaohifadhi upana wa maana ya צוה katika muktadha wa Yoshua kuchukua nafasi ya Musa.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina binafsi la Mungu lililoandikwa katika Kiebrania, kwa tahajia ya Kiswahili inayosomeka kwa kawaida.
- source_word: הֵן
  choice: Tazama
  rationale: Ni neno la heshima na la sasa la kuvuta fikira, linalolingana na nguvu ya chembe ya Kiebrania.
- source_word: קָרְבוּ יָמֶיךָ לָמוּת
  choice: siku zako za kufa zimekaribia
  rationale: Linadumisha taswira ya Kiebrania ya siku kumkaribia Musa, bila kulifanya kuwa maelezo huru tu ya kwamba wakati wake umefika.
- source_word: קְרָא אֶת יְהוֹשֻׁעַ
  choice: Mwite Yoshua
  rationale: Amri rahisi na ya moja kwa moja; “mwite” ni ya kawaida na inafaa muktadha.
- source_word: וְהִתְיַצְּבוּ
  choice: nanyi mjitokeze
  rationale: Kitenzi hiki katika hitpael kinaonyesha kufika na kuchukua nafasi mbele ya mwingine; “mjitokeze” ni cha asili kuliko tafsiri sisisi ya kusimama.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: katika hema la kukutania
  rationale: Linahifadhi jina la mahali patakatifu na maana ya אוהל מועד kama hema la mkutano kati ya Yahwe na watu wake.
- source_word: וַאֲצַוֶּנּוּ
  choice: nami nitamwagiza
  rationale: Linawakilisha moja kwa moja kitenzi צוה, ambacho kinaweza kumaanisha kuamuru au kumpa mtu agizo rasmi, bila kufunga maana kwa wazo la kiufundi la kumweka rasmi.
- source_word: וַיֵּלֶךְ מֹשֶׁה וִיהוֹשֻׁעַ
  choice: Basi Musa na Yoshua wakaenda
  rationale: “Basi” na mfuatano wa vitenzi vya “waka-” huwasilisha kwa ufasaha mwendelezo wa simulizi na kuitikia amri.
- source_word: וַיִּתְיַצְּבוּ
  choice: wakajitokeza
  rationale: Linatumia kitenzi kilekile cha msingi kama amri iliyotangulia ili kudumisha ulinganifu wa matendo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni yenyewe; “Yahwe” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya צוה katika uteuzi wa Yoshua
  choice: nitamwagiza
  alternative: nitampa agizo rasmi au nitamweka rasmi
  rationale: “Nitamwagiza” hudumisha maana pana ya kitenzi—kuamuru au kumpa agizo—huku tanbihi ikionyesha kwamba katika muktadha huu agizo hilo linahusiana na kukabidhiwa jukumu rasmi.
- issue: Uhusiano wa kisintaksia wa וַאֲצַוֶּנּוּ
  choice: nami nitamwagiza
  alternative: ili nimwagize
  rationale: Kiunganishi cha Kiebrania kinaweza kusomwa kama mwendelezo wa amri na ahadi ya tendo la Mungu; tafsiri hii huhifadhi uratibu huo badala ya kuufanya kwa lazima kuwa kishazi cha kusudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi wa “aka-/waka-” umetumiwa kwa mtiririko wa asili; “hema la kukutania” limetumiwa kama istilahi ya kibiblia iliyo wazi.
