  text: וְ/אָנֹכִ֗י הַסְתֵּ֨ר אַסְתִּ֤יר פָּנַ/י֙ בַּ/יּ֣וֹם הַ/ה֔וּא עַ֥ל כָּל הָ/רָעָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה כִּ֣י פָנָ֔ה אֶל אֱלֹהִ֖ים אֲחֵרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/018.yaml
  text: And I myself will surely hide my face on that day because of all the evil that he has done[a], because he has turned to other gods.
translation:
  language: sw
  text: Nami mwenyewe hakika nitauficha uso wangu[a] siku hiyo kwa sababu ya uovu wote alioutenda, kwa kuwa amegeukia miungu mingine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwepo wangu”; Kiebrania kinasema kihalisi “uso wangu,” usemi unaoweza kumaanisha kuondolewa kwa kibali au uwepo wa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָנֹכִי
  choice: Nami mwenyewe
  rationale: Kiambishi וְ kinaendeleza kauli, nayo kiwakilishi אָנֹכִי kina mkazo; “mwenyewe” kinahifadhi mkazo huo kwa Kiswahili cha kawaida.
- source_word: הַסְתֵּר אַסְתִּיר
  choice: hakika nitauficha
  rationale: Muundo wa kitenzi-jina kamili pamoja na kitenzi kilichonyambuliwa unasisitiza uhakika wa tendo; “hakika” kinawasilisha msisitizo huo kwa njia ya asili.
- source_word: פָּנַי
  choice: uso wangu
  rationale: Hili ndilo maana halisi ya maneno ya Kiebrania. Taswira ya Mungu kuuficha uso wake imehifadhiwa badala ya kufafanuliwa moja kwa moja kuwa kuondoa uwepo au kibali chake.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Ni usemi wa kawaida wa wakati unaohifadhi nguvu ya kiashiria “hiyo.”
- source_word: עַל כָּל הָרָעָה
  choice: kwa sababu ya uovu wote
  rationale: עַל hapa inaonyesha sababu, na הָרָעָה inarejelea uovu wa kimaadili katika muktadha huu.
- source_word: אֲשֶׁר עָשָׂה
  choice: alioutenda
  rationale: Kitenzi cha Kiebrania ni umoja wa nafsi ya tatu. Kiswahili kinahifadhi umoja unaoiwakilisha Israeli kama taifa moja.
- source_word: כִּי
  choice: kwa kuwa
  rationale: Kiunganishi hiki kinatoa sababu ya uovu na ya hatua ya Mungu; “kwa kuwa” ni wazi na chenye hadhi katika muktadha huu.
- source_word: פָנָה אֶל
  choice: amegeukia
  rationale: Usemi huu unaonyesha kugeuka kuelekea kitu au mtu katika utii na ibada bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Hili ni tafsiri ya moja kwa moja ya miungu iliyo tofauti na BWANA.
theological_decisions:
- issue: Taswira ya kibinadamu kuhusu Mungu kuondoa uso wake
  choice: Kudumisha “nitauficha uso wangu” katika andiko kuu
  alternative: “nitaondoa uwepo wangu” au “nitamgeukia mbali”
  rationale: Kiebrania kinatumia taswira halisi ya “uso wangu.” Kuihifadhi kunaacha wazi mvutano wa maana kuhusu uwepo, kibali, au ulinzi wa Mungu bila kuamua tafsiri hiyo kimyakimya.
- issue: Israeli kutajwa kwa umoja
  choice: Kutumia umoja katika “alioutenda” na “amegeukia”
  alternative: 'Kutumia wingi: “walioutenda” na “wamegeukia”'
  rationale: Vitenzi vya Kiebrania ni vya umoja na vinaitazama Israeli kwa pamoja kama taifa moja; umoja umehifadhiwa bila kuusawazisha kuwa wingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa wasomaji wa kawaida huku ukihifadhi msisitizo wa Kiebrania, taswira ya “uso wangu,” na umoja unaoiwakilisha Israeli kama taifa moja.
