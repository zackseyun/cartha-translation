  text: Kisha Musa akaenda, akawaambia Israeli wote maneno haya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na Musa akaenda, akawaambia Israeli wote maneno haya.” Kiunganishi cha mwanzo kinaweza kutafsiriwa kwa kufuata umbo lake kwa karibu zaidi kuwa “Na.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: Kitenzi הלך katika muundo huu wa kisimulizi kwa kawaida humaanisha ‘kwenda.’ ‘Akaenda’ huhifadhi maana ya kawaida bila kukifanya kiwe ‘akaendelea,’ ingawa mahali alikokwenda hapajatajwa.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia ya Kiswahili na matumizi mapana ya Kiswahili.
- source_word: וַיְדַבֵּר
  choice: akawaambia
  rationale: דבר humaanisha ‘kusema/kuzungumza.’ Kwa kuwa אֶל hutaja hadhira, ‘akawaambia’ ni Kiswahili cha asili kinachowasilisha wazi kwamba maneno yalielekezwa kwa Israeli wote.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: maneno haya
  rationale: Tafsiri hii huhifadhi maana ya moja kwa moja ya kifungu, ‘maneno haya,’ na kuelekeza kwenye hotuba inayofuata.
- source_word: אֶל
  choice: -waambia
  rationale: Maana ya ‘kwa/kuelekea’ hadhira imejumuishwa kiasili katika kitenzi ‘akawaambia,’ badala ya kutumia muundo usio wa kawaida wa ‘alizungumza maneno haya kwa.’
- source_word: כָּל יִשְׂרָאֵל
  choice: Israeli wote
  rationale: Huhifadhi Israeli kama jina la taifa lenye maana ya kijumla, bila kulibadili kuwa orodha ya watu mmoja mmoja.
- source_word: וַ
  choice: Kisha
  rationale: Kiunganishi cha mwanzo kinaendeleza simulizi. ‘Kisha’ ni cha asili katika Kiswahili na hudokeza mfuatano; ‘Na’ ni mbadala wa karibu zaidi na umbo la Kiebrania.
