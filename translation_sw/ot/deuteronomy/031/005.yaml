  text: And the LORD will give them over to you, and you shall do to them according to all the commandment that I have commanded you.
translation:
  language: sw
  text: BWANA atawatia mikononi mwenu, nanyi mtawatendea kulingana na amri yote niliyowaamuru.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְתָנָם יְהוָה לִפְנֵיכֶם
  choice: BWANA atawatia mikononi mwenu
  rationale: Kirai cha Kiebrania kwa karibu ni ‘BWANA atawatoa mbele yenu,’ lakini katika muktadha wa vita kina maana ya kuwakabidhi chini ya mamlaka ya Israeli; ‘kuwatia mikononi mwenu’ ni nahau ya Kiswahili iliyo wazi na ya asili.
- source_word: כְּכָל הַמִּצְוָה
  choice: kulingana na amri yote
  rationale: Umoja ‘amri’ umehifadhiwa, ukirejelea maagizo yote yanayohusika kama agizo moja kamili.
- source_word: אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: niliyowaamuru
  rationale: Kitenzi kinadumisha nafsi ya kwanza ya Musa na wingi wa wale aliozungumza nao.
theological_decisions:
- issue: Jina la agano יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ ni uwasilishaji wa kawaida, wenye heshima, na unaotambulika sana katika Biblia za Kiswahili; herufi kubwa hutofautisha jina hili na cheo cha kawaida.
- issue: Maana ya לִפְנֵיכֶם katika muktadha wa ushindi
  choice: atawatia mikononi mwenu
  alternative: atawatoa mbele yenu
  rationale: Chaguo hili linaeleza kwa Kiswahili asilia wazo la Mungu kuwakabidhi maadui kwa Israeli bila kuongeza madai ya kiteolojia yasiyomo katika maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. Muundo ni mfupi na unahifadhi mpangilio wa ahadi ya BWANA kisha wajibu wa watu.
