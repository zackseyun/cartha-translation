  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/חָרָ֣ה אַפִּ֣/י ב֣/וֹ בַ/יּוֹם הַ֠/הוּא וַ/עֲזַבְתִּ֞י/ם וְ/הִסְתַּרְתִּ֨י פָנַ֤/י מֵ/הֶם֙ וְ/הָיָ֣ה לֶֽ/אֱכֹ֔ל וּ/מְצָאֻ֛/הוּ רָע֥וֹת רַבּ֖וֹת וְ/צָר֑וֹת וְ/אָמַר֙ בַּ/יּ֣וֹם הַ/ה֔וּא הֲ/לֹ֗א עַ֣ל כִּֽי אֵ֤ין אֱלֹהַ/י֙ בְּ/קִרְבִּ֔/י מְצָא֖וּ/נִי הָ/רָע֥וֹת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/017.yaml
  text: Then my anger will burn against them on that day[a], and I will forsake them and hide my face from them, and they will be devoured, and many evils and troubles will find them. And he will say on that day[b], ‘Is it not because my God is not among me that these evils have found me?’
translation:
  language: sw
  text: Ndipo siku hiyo hasira yangu itawaka dhidi yao. Nitawaacha na nitawaficha uso wangu; wataliwa[a], na maafa mengi na taabu zitawapata. Naye atasema siku hiyo[b], “Je, si kwa sababu Mungu wangu hayuko katikati yangu ndipo maafa haya yamenipata?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “atakuwa/kitakuwa cha kuliwa.” Kiebrania kimesongamana na kinaonyesha Israeli ikiachwa wazi ili kuangamizwa.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kinatumia umoja: Israeli inawakilishwa kama mtu mmoja anayesema, “Mungu wangu hayuko katikati yangu.”'
    reason: collective_singular
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: hasira yangu itawaka
  rationale: Nahau ya Kiebrania ina picha ya hasira inayowaka; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha sitiari hiyo.
- source_word: בּוֹ
  choice: dhidi yao
  rationale: Ingawa umbo la Kiebrania ni la umoja wa mkusanyo, kinachorejelewa ni Israeli kama watu; wingi ni wa kawaida zaidi katika simulizi la Kiswahili.
- source_word: וַעֲזַבְתִּים
  choice: nitawaacha
  rationale: Neno hili linaonyesha Mungu kuwaacha watu wake chini ya hukumu bila kuongeza maelezo yasiyokuwamo katika chanzo.
- source_word: וְהִסְתַּרְתִּי פָנַי מֵהֶם
  choice: kuuficha uso wangu mbali nao
  rationale: Inadumisha picha muhimu ya Kiebrania ya Mungu kuficha uso wake, huku ‘mbali nao’ ikifanya uhusiano wa kisarufi uwe wazi kwa Kiswahili.
- source_word: וְהָיָה לֶאֱכֹל
  choice: wataliwa
  rationale: Kiebrania kimesongamana, kihalisi ‘atakuwa/kitakuwa cha kuliwa.’ ‘Wataliwa’ kinaonyesha kuachwa wazi kwa kuangamizwa bila kumtaja mtendaji ambaye chanzo hakimtaji.
- source_word: וּמְצָאֻהוּ
  choice: zitawapata
  rationale: Kitenzi ‘kupata’ kinadumisha maana ya msingi ya ‘find/reach’ na kinafaa kwa maafa na taabu katika Kiswahili.
- source_word: רָעוֹת רַבּוֹת וְצָרוֹת
  choice: maafa mengi na taabu
  rationale: Katika muktadha wa hukumu, רָעוֹת humaanisha mabaya au maafa, na צָרוֹת ni taabu au dhiki; maneno haya ni ya asili na yanatofautisha dhana hizo.
- source_word: וְאָמַר
  choice: naye atasema
  rationale: Umoja wa Kiebrania umehifadhiwa ili kuonyesha Israeli ikisemeshwa kama mtu mmoja.
- source_word: הֲלֹא עַל כִּי
  choice: Je, ... kwa sababu
  rationale: Muundo huu unatoa swali la balagha linalotaja sababu kwa Kiswahili cha kawaida.
- source_word: אֵין אֱלֹהַי בְּקִרְבִּי
  choice: Mungu wangu hayuko katikati yangu
  rationale: Umoja wa nafsi ya kwanza na picha ya ‘katikati yangu’ vimehifadhiwa, kwa kuwa Israeli inawakilishwa kama msemaji mmoja.
- source_word: מְצָאוּנִי
  choice: hayajanipata
  rationale: Inadumisha umoja wa msemaji na uhusiano wa kileksika na ‘zitawapata’ katika kishazi kilichotangulia.
theological_decisions:
- issue: 'Israeli kama mkusanyo: umoja na wingi'
  choice: Kutumia wingi katika matendo yanayoelekezwa kwa watu, lakini kuhifadhi umoja katika kauli ya Israeli iliyowakilishwa kama mtu mmoja.
  alternative: Kutumia wingi kila mahali, au umoja kila mahali.
  rationale: Kiebrania hubadilisha maumbo ya wingi na umoja wa mkusanyo. Kiswahili cha kawaida huhitaji wingi katika simulizi, lakini umoja katika ungamo unadumisha mbinu ya balagha ya chanzo.
- issue: Maana ya Mungu kuficha uso wake
  choice: Kuhifadhi nahau ‘kuuficha uso wangu’ bila kuifafanua kuwa kuondoa uwepo au kibali.
  alternative: Kutafsiri ‘kuwageukia mbali’ au ‘kuondoa uwepo wangu.’
  rationale: Picha ya chanzo hubeba uzito wa agano na hukumu, na haipaswi kufinyangwa kuwa ufafanuzi mmoja wa kiteolojia.
- issue: Kauli kwamba Mungu hayuko katikati ya Israeli
  choice: Kuhifadhi kauli kama swali la Israeli lenyewe bila kueleza kama ni toba kamili au hitimisho la sehemu tu.
  alternative: Kuifafanua kama ungamo la toba au kama kutambua tu hukumu.
  rationale: Mstari wenyewe hauamui ubora wa kiroho wa kauli hiyo; tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi fupi zimetumiwa kwa uwazi; nahau kuu za Kiebrania zimehifadhiwa bila lugha ya kale isiyo ya lazima.
