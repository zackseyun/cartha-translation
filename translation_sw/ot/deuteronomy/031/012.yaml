  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: הַקְהֵ֣ל אֶת הָ/עָ֗ם הָֽ/אֲנָשִׁ֤ים וְ/הַ/נָּשִׁים֙ וְ/הַ/טַּ֔ף וְ/גֵרְ/ךָ֖ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֑י/ךָ לְמַ֨עַן יִשְׁמְע֜וּ וּ/לְמַ֣עַן יִלְמְד֗וּ וְ/יָֽרְאוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/שָֽׁמְר֣וּ לַ/עֲשׂ֔וֹת אֶת כָּל דִּבְרֵ֖י הַ/תּוֹרָ֥ה הַ/זֹּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/012.yaml
  text: Assemble the people—the men[a], the women, the little children, and the sojourner within your gates—so that they may hear, and so that they may learn and fear Yahweh your God[d][c][b], and be careful to do all the words of this law.
translation:
  language: sw
  text: Kusanya watu—wanaume, wanawake, watoto wadogo, na mgeni anayeishi katika miji yako[a][b]—ili wasikie, wajifunze, wamche Yahwe Mungu wenu[c], na wawe waangalifu kutenda maneno yote ya sheria hii[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkaaji mgeni.” Neno la Kiebrania linamaanisha mtu asiye mwenyeji anayekaa miongoni mwa Israeli.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “aliye ndani ya malango yako,” nahau inayorejelea mtu anayeishi katika miji au jamii yako.
    reason: cultural_note
  - marker: c
    text: Au “wamheshimu kwa kumcha Yahwe Mungu wenu.” Kitenzi cha Kiebrania kinajumuisha hofu yenye heshima na utiifu.
    reason: lexical_alternative
  - marker: d
    text: Au “mafundisho haya.” Neno la Kiebrania torah linaweza kumaanisha “mafundisho” au “sheria”; hapa “sheria” inafaa mazingira ya agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְהֵל אֶת הָעָם
  choice: Wakusanye watu
  rationale: Kitenzi hiki ni amri ya kusababisha watu wakusanyike kama kusanyiko. “Wakusanye watu” ni Kiswahili cha kawaida kinachohifadhi wito huo rasmi.
- source_word: הָאֲנָשִׁים וְהַנָּשִׁים וְהַטַּף
  choice: wanaume, wanawake, watoto wadogo
  rationale: Matini inataja makundi haya waziwazi. טַף mara nyingi humaanisha watoto wadogo au wategemezi, kwa hiyo “watoto wadogo” inahifadhi maana yake mahususi.
- source_word: וְגֵרְךָ אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: na mgeni anayeishi katika miji yako
  rationale: גֵר ni mgeni asiye mwenyeji lakini anayekaa katika jamii ya Israeli. “Katika malango yako” ni nahau ya Kiebrania inayorejelea miji au makazi yaliyo chini ya mamlaka ya jamii; tafsiri ya maana ni ya kawaida zaidi katika Kiswahili.
- source_word: לְמַעַן יִשְׁמְעוּ וּלְמַעַן יִלְמְדוּ
  choice: ili wasikie, wajifunze
  rationale: Tafsiri inadumisha madhumuni mawili ya kusikia na kujifunza, huku ikitumia mtiririko wa kawaida wa Kiswahili.
- source_word: וְיָרְאוּ אֶת יְהוָה אֱלֹהֵיכֶם
  choice: wamche Yahwe Mungu wenu
  rationale: “Kumcha” hubeba maana ya hofu yenye heshima na utiifu katika muktadha wa agano. Jina יהוה limetoholewa kuwa “Yahwe” badala ya kubadilishwa na cheo.
- source_word: וְשָׁמְרוּ לַעֲשׂוֹת
  choice: na wawe waangalifu kutenda
  rationale: Muundo huu unaonyesha kuzingatia kwa makini kunakoongoza kwenye utekelezaji; “wawe waangalifu kutenda” ni wa asili na huhifadhi vipengele vyote viwili.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: maneno yote ya sheria hii
  rationale: “Maneno yote” huhifadhi דִּבְרֵי, na “sheria” inafaa muktadha wa hati ya agano, ingawa תּוֹרָה pia inaweza kumaanisha mafundisho.
theological_decisions:
- issue: Kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ina jina binafsi la agano יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha na cheo.
- issue: Maana ya ירא katika uhusiano na Mungu
  choice: wamche
  alternative: wamwogope au wamstahi
  rationale: “Kumcha” huhifadhi mvutano wa maana kati ya hofu na heshima yenye utiifu bila kuifanya iwe hofu ya kawaida tu wala heshima isiyo na uzito.
- issue: Orodha ya makundi katika kusanyiko
  choice: wanaume, wanawake, watoto wadogo
  alternative: watu wote, pamoja na watoto
  rationale: Kiebrania kinayataja makundi hayo waziwazi; tafsiri haifupishi orodha wala kufuta utofauti wake.
- issue: Maana ya תּוֹרָה
  choice: sheria
  alternative: mafundisho
  rationale: “Sheria” inalingana na mazingira ya agano katika Kumbukumbu la Torati, lakini tanbihi inadumisha uwezekano halisi wa maana pana ya “mafundisho.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia “miji yako” badala ya tafsiri neno kwa neno “malango yako” ili nahau ieleweke mara moja, huku tanbihi ikihifadhi picha ya Kiebrania. Umoja katika “yako” unadumisha namna Israeli anavyozungumziwa kama jamii moja, ilhali “Mungu wenu” hufuata wingi wa Kiebrania katika kishazi hicho.
