  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֣י יָדַ֗עְתִּי אַחֲרֵ֤י מוֹתִ/י֙ כִּֽי הַשְׁחֵ֣ת תַּשְׁחִת֔וּ/ן וְ/סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֥ר צִוִּ֖יתִי אֶתְ/כֶ֑ם וְ/קָרָ֨את אֶתְ/כֶ֤ם הָֽ/רָעָה֙ בְּ/אַחֲרִ֣ית הַ/יָּמִ֔ים כִּֽי תַעֲשׂ֤וּ אֶת הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה לְ/הַכְעִיס֖/וֹ בְּ/מַעֲשֵׂ֥ה יְדֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/029.yaml
  text: For I know that after my death you will surely act corruptly and turn aside from the way that I commanded you[a], and evil will befall you in the latter days, because you will do what is evil in the eyes of Yahweh[c][b], provoking him to anger by the work of your hands.
translation:
  language: sw
  text: Kwa maana najua kwamba baada ya kifo changu hakika mtajiharibu kabisa[a] na kuiacha njia niliyowaamuru mfuate. Maafa[b] yatawapata katika siku za mwisho[c], kwa sababu mtatenda mabaya machoni pa Yahweh na kumkasirisha kwa kazi ya mikono yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakika mtaharibika” au “hakika mtajipotosha.” Kiebrania kinasisitiza kitenzi “haribu/fisidi,” ambacho hapa kinaweza kueleweka kwa maana ya kujitendea au kuingia katika hali ya upotovu.
    reason: lexical_alternative
  - marker: b
    text: Au, “mabaya” au “msiba.” Neno la Kiebrania רָעָה linaweza kumaanisha uovu au jambo baya lenye kuleta madhara.
    reason: lexical_alternative
  - marker: c
    text: “Katika siku za mwisho” pia inaweza kutafsiriwa “katika siku zijazo” au “mwishoni mwa siku.” Usemi huu unaelekeza kwenye wakati ujao na, kutegemea muktadha, unaweza kuwa na uzito wa nyakati za mwisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יָדַעְתִּי
  choice: Kwa maana najua
  rationale: כִּי linaeleza sababu ya agizo lililotangulia, na wakati uliopo wa Kiswahili unaonyesha uhakika wa Musa kuhusu yatakayotokea.
- source_word: אַחֲרֵי מוֹתִי
  choice: baada ya kifo changu
  rationale: Huhifadhi muundo wa nomino wa Kiebrania kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: הַשְׁחֵת תַּשְׁחִתוּן
  choice: hakika mtatenda kwa upotovu kabisa
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichonyambuliwa unasisitiza tendo. Tafsiri hii inaonyesha upotovu wa kimaadili bila kulazimisha maana ya kujiharibu au kuharibiwa.
- source_word: וְסַרְתֶּם מִן־הַדֶּרֶךְ
  choice: na kuiacha njia
  rationale: Ni usemi wa agano unaomaanisha kuacha mwenendo ulioamriwa; ‘kuiacha njia’ ni wa kawaida na wazi katika Kiswahili.
- source_word: אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: niliyowaamuru mfuate
  rationale: Kitenzi ‘mfuate’ kinaweka wazi kile kinachodokezwa na usemi wa Kiebrania—kwamba watu waliamriwa waifuate njia—na kufanya sentensi iwe ya kawaida katika Kiswahili.
- source_word: וְקָרָאת אֶתְכֶם הָרָעָה
  choice: Maafa yatawapata
  rationale: Katika muundo huu, קרא pamoja na רָעָה humaanisha madhara au mabaya yanayomjia mtu. ‘Maafa yatawapata’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: katika siku za baadaye
  rationale: Huhifadhi mwelekeo wa wakati ujao bila kulazimisha tafsiri maalumu ya nyakati za mwisho; uzito unaowezekana wa kieskatolojia umeonyeshwa katika tanbihi.
- source_word: כִּי תַעֲשׂוּ אֶת־הָרַע
  choice: kwa sababu mtatenda yaliyo maovu
  rationale: Huwasilisha tathmini ya kimaadili ya Kiebrania kwa Kiswahili cha asili.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahweh
  rationale: Huhifadhi nahau ya kibiblia inayomaanisha kulingana na tathmini ya Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano la Mungu linatoholewa badala ya kubadilishwa na cheo.
- source_word: לְהַכְעִיסוֹ
  choice: na kumkasirisha
  rationale: 'Huwasilisha maana sababishi ya kitenzi: matendo yao yanachochea hasira yake.'
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  choice: kwa kazi ya mikono yenu
  rationale: Huhifadhi taswira halisi na uwezekano wa kurejelea sanamu au matendo mengine ya watu bila kuufinya usemi kwa maana moja.
theological_decisions:
- issue: Tafsiri ya jina יהוה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Andiko lina jina maalumu la Mungu, si cheo; ‘Yahweh’ huhifadhi jina hilo la agano.
- issue: Uzito wa בְּאַחֲרִית הַיָּמִים
  choice: katika siku za baadaye
  alternative: mwishoni mwa siku / katika siku za mwisho
  rationale: Muktadha unaelekea wakati ujao na unaweza kuwa na uzito wa kieskatolojia, lakini hauhitaji kulazimisha mfumo maalumu wa nyakati za mwisho.
- issue: Maana ya מַעֲשֵׂה יְדֵיכֶם
  choice: kazi ya mikono yenu
  alternative: sanamu mlizotengeneza
  rationale: Ingawa usemi unaweza kudokeza sanamu, Kiebrania hakutaji sanamu waziwazi; tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili iwe rahisi kusomeka bila kuvunja uhusiano wa hoja. Nahau za kibiblia ‘machoni pa’ na ‘kazi ya mikono yenu’ zimehifadhiwa kwa sababu zinaeleweka na zinabeba maana ya chanzo.
