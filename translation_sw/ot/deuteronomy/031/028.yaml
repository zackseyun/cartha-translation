base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/028.yaml
  text: Gather to me all the elders of your tribes and your officers[a], that I may speak these words in their hearing and call heaven and earth to witness against them.
translation:
  language: sw
  text: Wakusanyeni kwangu wazee wote wa makabila yenu na maafisa wenu, ili niseme maneno haya masikioni mwao na niite mbingu na dunia[a] kuwa mashahidi dhidi yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “mbingu na nchi.” Usemi huu ni kauli ya kawaida ya kuwaita mashahidi wa agano katika Kumbukumbu la Torati.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְהִילוּ אֵלַי
  choice: Wakusanyeni kwangu
  rationale: Kitenzi cha Hifili katika hali ya amri kina maana ya kusababisha watu wakusanyike; “wakusanyeni kwangu” huhifadhi amri ya wingi na mwelekeo wa אֵלַי, “kwangu.”
- source_word: זִקְנֵי שִׁבְטֵיכֶם
  choice: wazee wote wa makabila yenu
  rationale: Hii ni tungo ya umilikaji inayowataja viongozi wazee wa makabila; “wazee wa makabila yenu” ni wazi na ya asili katika Kiswahili.
- source_word: שֹׁטְרֵיכֶם
  choice: maafisa wenu
  rationale: Katika muktadha wa kiutawala wa Kumbukumbu la Torati, neno hili linawahusu viongozi au watendaji wenye madaraka. “Maafisa” ni pana kuliko “waandishi” na halilazimishi jukumu mahususi lisilotajwa.
- source_word: וַאֲדַבְּרָה
  choice: ili niseme
  rationale: Kohotativi inaonyesha kusudi la Musa baada ya viongozi kukusanywa; “ili niseme” huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: בְּאָזְנֵיהֶם
  choice: masikioni mwao
  rationale: Tafsiri hii huhifadhi taswira ya nahau ya Kiebrania, yaani kusema kwa sauti ili wao wenyewe wasikie, huku ikibaki ya kueleweka katika Kiswahili.
- source_word: אֵת הַדְּבָרִים הָאֵלֶּה
  choice: maneno haya
  rationale: Katika muktadha huu דְּבָרִים ni maneno yatakayotamkwa, si mambo yasiyoainishwa.
- source_word: וְאָעִידָה בָּם
  choice: na kuita ... kuwa mashahidi dhidi yao
  rationale: Hifili ya עוּד katika mazingira haya ya agano ina nguvu ya kisheria ya kuwaita mashahidi dhidi ya wahusika.
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: mbingu na dunia
  rationale: Huu ni usemi wa kawaida wa mashahidi wa agano katika Kumbukumbu la Torati. “Mbingu na dunia” ni wa asili katika Kiswahili na huhifadhi upeo wa ulimwengu mzima.
theological_decisions:
- issue: Kauli ya mashahidi wa agano
  choice: kuita mbingu na dunia kuwa mashahidi dhidi yao
  alternative: kushuhudia dhidi yao kwa mbingu na dunia
  rationale: Chaguo hili linaonyesha wazi kwamba mbingu na dunia zinaitwa kama mashahidi katika mazingira ya kisheria ya agano, bila kuondoa uzito au taswira ya maandishi ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Masikioni mwao” limehifadhiwa kama nahau yenye uzito wa asili; “maafisa” limetumiwa kwa maana pana ya kiutawala.
