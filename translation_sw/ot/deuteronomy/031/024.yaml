  text: Ikawa Musa alipomaliza kuandika maneno ya sheria hii katika kitabu[a], hadi yakakamilika,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika gombo”; neno la Kiebrania סֵפֶר linaweza kumaanisha hati iliyoandikwa au gombo, si lazima kitabu kilichofungwa kama vitabu vya kisasa.
