lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Kitenzi hiki pamoja na kiunganishi chake kinaendeleza simulizi. “Ikawa” ni namna ya kawaida na yenye hadhi ya kuonyesha mpito huo katika simulizi la Kiswahili.
- source_word: כְּכַלּוֹת
  choice: alipomaliza
  rationale: Muundo huu unaanzisha kishazi cha wakati na kusisitiza kukamilika kwa tendo; “alipomaliza” ni wa asili katika Kiswahili.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Biblia za Kiswahili.
- source_word: לִכְתֹּב
  choice: kuandika
  rationale: Kitenzi-jina hiki kinakamilisha maana ya “alipomaliza”; Kiswahili husema kwa kawaida “alipomaliza kuandika.”
- source_word: דִּבְרֵי
  choice: maneno ya
  rationale: Katika muktadha huu neno hili linarejelea yaliyomo yaliyoandikwa; “maneno ya” ni tafsiri ya moja kwa moja na ya asili.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: sheria hii
  rationale: Katika muktadha wa agano na masharti ya Kumbukumbu la Torati, “sheria hii” inaeleweka wazi huku ikihifadhi nguvu ya kiashiria.
- source_word: עַל סֵפֶר
  choice: katika kitabu
  rationale: Neno la Kiebrania linaweza kumaanisha hati au kitabu cha kukunjwa. “Katika kitabu” ni Kiswahili cha kawaida, huku tanbihi ikihifadhi uwezekano wa umbo la hati ya kukunjwa.
- source_word: עַד תֻּמָּם
  choice: mpaka yakakamilika
  rationale: Kirai kinaonyesha kuendelea kwa uandishi hadi maneno hayo yote yakawa yamekamilika. Kiwakilishi cha ngeli katika “yakakamilika” kinarejelea “maneno.”
