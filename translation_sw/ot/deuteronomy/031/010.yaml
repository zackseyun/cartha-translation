base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/010.yaml
  text: And Moses commanded them[a], saying, “At the end of every seven years, at the appointed time of the year of release[c][b], at the Feast of Booths,”
translation:
  language: sw
  text: Musa akawaamuru, akisema, “Mwishoni mwa kila kipindi cha miaka saba[a], wakati uliowekwa wa mwaka wa maachilio[b], katika Sikukuu ya Vibanda[c],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwishoni mwa miaka saba.” Kiebrania kinaweza kutafsiriwa hivyo kwa namna ya moja kwa moja zaidi, lakini muktadha unaonyesha mzunguko unaorudiwa kila baada ya miaka saba.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania hurejelea mwaka wa saba wa maachilio, unaohusisha pia maachilio ya madeni. Kwa mapokeo huitwa pia “mwaka wa sabato.”
    reason: lexical_alternative
  - marker: c
    text: Kwa mapokeo huitwa pia “Sikukuu ya Maskani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: akawaamuru
  rationale: Kitenzi צוה kina nguvu ya kutoa amri; “akawaamuru” kinadumisha nguvu hiyo na kuonyesha mwendelezo wa simulizi.
- source_word: אוֹתָם
  choice: -wa-
  rationale: Kiwakilishi cha yambwa cha wingi wa watu kimeunganishwa kwa kawaida katika kitenzi cha Kiswahili; wanaorejelewa wanajulikana kutokana na muktadha.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hutambulisha maneno yaliyonukuliwa moja kwa moja na kuakisi muundo wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: מִקֵּץ שֶׁבַע שָׁנִים
  choice: Mwishoni mwa kila miaka saba
  rationale: מִקֵּץ humaanisha “mwishoni mwa”; neno “kila” linaonyesha mzunguko unaorudiwa wa miaka saba unaokusudiwa katika sheria hii, huku tanbihi ikihifadhi uwezekano wa tafsiri rasmi zaidi.
- source_word: בְּמוֹעֵד
  choice: wakati uliowekwa
  rationale: מוֹעֵד ni wakati au majira yaliyowekwa; chaguo hili ni wazi, la kawaida, na linadumisha wazo la uteuzi rasmi.
- source_word: שְׁנַת הַשְּׁמִטָּה
  choice: mwaka wa kuachilia madeni
  rationale: שְׁמִטָּה hurejelea maachilio ya mwaka wa saba, hasa kufutiwa au kuachiliwa kwa madeni katika muktadha wa Kumbukumbu la Torati 15; usemi huu unaeleweka kwa wasomaji wa sasa bila kutegemea istilahi ya kimapokeo pekee.
- source_word: בְּחַג הַסֻּכּוֹת
  choice: katika Sikukuu ya Vibanda
  rationale: חַג ni sikukuu na סֻכּוֹת ni vibanda; tafsiri hii huhifadhi picha halisi ya Kiebrania kwa lugha ya kawaida.
