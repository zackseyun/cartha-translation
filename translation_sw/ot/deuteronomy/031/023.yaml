  text: וַ/יְצַ֞ו אֶת יְהוֹשֻׁ֣עַ בִּן נ֗וּן וַ/יֹּאמֶר֮ חֲזַ֣ק וֶֽ/אֱמָץ֒ כִּ֣י אַתָּ֗ה תָּבִיא֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל הָ/אָ֖רֶץ אֲשֶׁר נִשְׁבַּ֣עְתִּי לָ/הֶ֑ם וְ/אָנֹכִ֖י אֶֽהְיֶ֥ה עִמָּֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/023.yaml
  text: And he commanded Joshua son of Nun and said[a], “Be strong and courageous, for you will bring the sons of Israel into the land that I swore to them, and I will be with you.”
translation:
  language: sw
  text: Akamwamuru Yoshua mwana wa Nuni, akasema, “Uwe imara na jasiri, kwa maana wewe utawaingiza wana wa Israeli[a] katika nchi niliyowaapia, nami nitakuwa pamoja nawe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” au “watu wa Israeli.” Kiebrania kinasema “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: akamwamuru
  rationale: Kitenzi cha Kiebrania katika kauli ya piel humaanisha kuamuru au kumpa mtu agizo rasmi. “Akamwamuru” kinadumisha uzito wa tukio la kumweka Yoshua katika wajibu.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Yoshua mwana wa Nuni
  rationale: Majina yametolewa kwa maumbo yanayotambulika katika Kiswahili cha Biblia, huku uhusiano wa kifamilia wa patronimu ukihifadhiwa.
- source_word: חֲזַק וֶאֱמָץ
  choice: Uwe imara na jasiri
  rationale: Jozi hii ya mausia inahusu uthabiti na ujasiri. Tafsiri hii ni ya kawaida, wazi, na haifanyi nguvu ya mwili kuwa wazo kuu.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa kiunganishi kinatoa sababu ya agizo la kuwa imara na jasiri.
- source_word: תָּבִיא
  choice: utawaingiza
  rationale: Hifili ya בוא ina maana ya kusababisha waingie, yaani kuwaingiza. Chaguo hili linahifadhi wazi umbo la kisababishi kuliko “utawaongoza.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Tafsiri hii inadumisha taswira ya kifamilia ya Kiebrania na bado inaeleweka kwa kawaida kama jina la pamoja la Waisraeli.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha wa ahadi ya agano, “nchi” ndilo neno la kawaida na linalodumisha mada ya nchi iliyoahidiwa.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי לָהֶם
  choice: niliyowaapia
  rationale: Kiebrania kinasema moja kwa moja kwamba Mungu aliwaapia, bila kurudia kitenzi “kuwapa.” “Niliyowaapia” kinahifadhi ufupi na lugha ya kiapo.
- source_word: וְאָנֹכִי אֶהְיֶה עִמָּךְ
  choice: nami nitakuwa pamoja nawe
  rationale: “Nami” linaonyesha mkazo wa kiwakilishi huru אָנֹכִי, na kauli “nitakuwa pamoja nawe” inadumisha ahadi muhimu ya uwepo wa Mungu.
theological_decisions:
- issue: Jinsi ya kutafsiri בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Usemi wa kifamilia wa chanzo umehifadhiwa bila kuufanya urejelee wanaume pekee katika maana yake ya jumla; chaguo laini zaidi limewekwa katika tanbihi.
- issue: Mtenda asiye tajwa wazi katika וַיְצַו / וַיֹּאמֶר
  choice: Akamwamuru ... akasema
  alternative: BWANA akamwamuru ... akasema
  rationale: Kiebrania kina mtenda wa nafsi ya tatu katika kitenzi bila kulitaja tena jina lake ndani ya mstari huu. Tafsiri haijaongeza “BWANA,” ingawa muktadha wa karibu humtambulisha msemaji.
- issue: Maana ya kiapo katika אֲשֶׁר נִשְׁבַּעְתִּי לָהֶם
  choice: nchi niliyowaapia
  alternative: nchi niliyowaahidi kwa kiapo kuwapa
  rationale: Tafsiri kuu inahifadhi maneno yaliyotamkwa bila kuongeza “kuwapa,” huku wazo la nchi kuwa zawadi ya ahadi likieleweka kutokana na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa msomaji wa kawaida. “Uwe imara na jasiri” ni cha sasa na wazi; “niliyowaapia” kimedumisha kwa makusudi mtindo mfupi wa kiapo wa Kiebrania.
