base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/009.yaml
  text: So Moses wrote this law and gave it to the priests[a], the sons of Levi, who carry the ark of the covenant of Yahweh[c][b], and to all the elders of Israel.
translation:
  language: sw
  text: Basi Musa akaandika sheria hii[a], akawapa makuhani, wana wa Lawi[b], waliobeba sanduku la agano la Yahwe[c], pamoja na wazee wote wa Israeli sheria hii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mafundisho haya” au “Torati hii.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “wana wa Lawi”; yaweza pia kutafsiriwa kwa ufupi, “Walawi.”'
    reason: lexical_alternative
  - marker: c
    text: Kiebrania YHWH; kwa mapokeo hutafsiriwa “BWANA.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: akaandika
  rationale: Kitenzi כתב humaanisha moja kwa moja ‘kuandika’; umbo la masimulizi linaendelezwa kwa ‘aka-’.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: sheria hii
  rationale: תּוֹרָה yaweza kumaanisha sheria au mafundisho; hapa inarejelea maandishi ya agano ambayo Musa aliyaandika, hivyo ‘sheria hii’ ni ya kawaida na sahihi katika muktadha.
- source_word: וַיִּתְּנָהּ
  choice: kuwapa
  rationale: Kiambishi cha kitu kinarejelea תּוֹרָה; Kiswahili kwa kawaida hutumia ‘kuwapa’ bila kulazimika kuongeza kiwakilishi tofauti cha kitu kisicho hai.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כהנים.
- source_word: בְּנֵי לֵוִי
  choice: wana wa Lawi
  rationale: Huhifadhi kwa uwazi muundo halisi wa Kiebrania badala ya kuufupisha kuwa ‘Walawi’.
- source_word: הַנֹּשְׂאִים
  choice: waliolibeba
  rationale: Kirai husifu makuhani hao kuwa wale waliobeba sanduku; wakati uliopita unaendana kwa kawaida na simulizi la Kiswahili, huku kishirikishi cha Kiebrania kikieleza jukumu lao.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: sanduku la agano la Yahwe
  rationale: Huhifadhi mlolongo wa umilikaji wa Kiebrania na istilahi ya kawaida ‘sanduku la agano’.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano YHWH limetafsiriwa kwa umbo la kawaida la Kiswahili ‘Yahwe’ badala ya kulibadilisha kuwa cheo.
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: wazee wote wa Israeli
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida kwa viongozi wazee wa Israeli.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko lina jina binafsi YHWH; ‘Yahwe’ hulihifadhi kama jina, huku ‘BWANA’ ikiwa badala ya kimapokeo inayotumia cheo.
- issue: Maana ya תּוֹרָה katika muktadha huu
  choice: sheria
  alternative: mafundisho; Torati
  rationale: Hapa neno linarejelea maandishi ya agano aliyoyaandika Musa. ‘Sheria’ inafaa muktadha bila kuficha kwamba neno la Kiebrania pia linaweza kumaanisha mafundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi na wa kawaida; ‘wana wa Lawi’ huhifadhi apposition ya chanzo, na maelezo ya chini huhifadhi uwezekano wa ‘Walawi’ pamoja na upana wa maana ya תּוֹרָה.
