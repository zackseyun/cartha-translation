base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/015.yaml
  text: And Yahweh appeared in the tent in a pillar of cloud[b][a], and the pillar of cloud stood at the entrance of the tent.
translation:
  language: sw
  text: Yahwe akatokea ndani ya hema[a] katika nguzo ya wingu, nayo nguzo ya wingu ikasimama kwenye mlango[b] wa hema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndani ya Hema”; Kiebrania kinasema tu “hema,” ambalo katika muktadha huenda ni hema la kukutania.
    reason: lexical_alternative
  - marker: b
    text: Au, “juu ya mlango wa hema”; kihusishi cha Kiebrania kinaweza pia kumaanisha “juu ya,” ingawa hapa kinaweza kueleza mahali penye mlango.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: akatokea
  rationale: Nifali ya ראה hapa inaeleza kujidhihirisha kwa namna inayoonekana. “Akatokea” ni Kiswahili cha kawaida kinachohifadhi wazo la kuonekana bila kufafanua kupita kiasi jinsi tukio hilo lilivyotokea.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limeandikwa kwa namna ya kawaida ya Kiswahili, badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: בָּאֹהֶל
  choice: ndani ya hema
  rationale: אֹהֶל humaanisha “hema.” Ingawa muktadha unaonyesha hema la kukutania, mstari wenyewe unasema tu “hema”; “ndani ya” huonyesha wazi maana ya kiambishi בְּ.
- source_word: בְּעַמּוּד עָנָן
  choice: katika nguzo ya wingu
  rationale: Kirai hiki kinaeleza namna au chombo cha kutokea kwa Yahwe. “Katika” kinahifadhi kiambishi cha Kiebrania bila kuamua kwamba Yahwe alikuwa wingu lenyewe.
- source_word: וַיַּעֲמֹד
  choice: ikasimama
  rationale: עמד hapa lina maana ya kawaida ya kusimama. Umbo hili linahifadhi taswira halisi na mtiririko wa simulizi.
- source_word: עַמּוּד הֶעָנָן
  choice: nguzo ya wingu
  rationale: Hiki ni kirai wazi na cha kawaida cha Kiswahili kinachorejelea tena udhihirisho uleule ulioonekana.
- source_word: עַל פֶּתַח הָאֹהֶל
  choice: kwenye mwingilio wa hema
  rationale: Katika mazingira haya עַל pamoja na פתח huweza kueleza mahali kwenye au karibu na mwingilio. “Kwenye mwingilio” ni ya asili katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa “juu ya.”
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Jina binafsi la Mungu wa agano limehifadhiwa badala ya kubadilishwa kuwa cheo, kwa namna iliyo wazi na inayotambulika katika Kiswahili.
- issue: Maelezo ya kujidhihirisha kwa Mungu
  choice: akatokea ndani ya hema katika nguzo ya wingu
  alternative: akaonekana ndani ya hema kama nguzo ya wingu
  rationale: Tafsiri inadumisha picha halisi ya kujidhihirisha kwa Mungu na uhusiano usiofafanuliwa kikamilifu kati ya kutokea kwake na nguzo ya wingu; haisemi kwamba Yahwe alikuwa nguzo hiyo yenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka, lakini inadumisha taswira ya nguzo ya wingu na fumbo la kujidhihirisha kwa Mungu. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
