base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/006.yaml
  text: Be strong and courageous[a]. Do not fear or be terrified because of them, for Yahweh your God is the one who goes with you[b]; he will not fail you or forsake you.
translation:
  language: sw
  text: Iweni hodari na jasiri. Msiwaogope wala msiogopeshwe nao, kwa maana Yahwe Mungu wenu ndiye anayeenda pamoja nanyi; hatawaacha bila msaada wala kuwatelekeza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha kwanza katika kauli “hatawaacha bila msaada” kinaweza kutafsiriwa, “hatawaachilia” au “hatawaacha waanguke”; maana yake ni kwamba hataacha kuwategemeza.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ וְאִמְצוּ
  choice: Iweni hodari na jasiri
  rationale: Amri zote mbili ni za wingi na huunda jozi ya kawaida ya kuhimiza nguvu na ujasiri. Kiswahili hiki ni cha asili, wazi, na chenye hadhi.
- source_word: אַל תִּירְאוּ וְאַל תַּעַרְצוּ מִפְּנֵיהֶם
  choice: Msiwaogope wala msiwatishwe nao
  rationale: Kauli ya kwanza inaeleza kuogopa, na ya pili inaongeza wazo la kutishwa au kujawa na hofu kuu. Muundo huu unatofautisha vitenzi huku ukibaki wa kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja badala ya kubadilishwa na cheo; tahajia 'Yahwe' ni ya kawaida na inayosomeka kwa Kiswahili.
- source_word: הוּא הַהֹלֵךְ עִמָּךְ
  choice: ndiye anayeenda pamoja nanyi
  rationale: 'Kiwakilishi הוּא pamoja na umbo la kitenzi lenye maana endelevu kina msisitizo: yeye ndiye anayeenda pamoja nao. ''Ndiye'' huhifadhi msisitizo huo.'
- source_word: לֹא יַרְפְּךָ
  choice: hatawaacha bila msaada
  rationale: Kitenzi רפה katika Hifili kinaweza kumaanisha kulegeza mshiko, kumwacha mtu aanguke, au kutomtegemeza. Tafsiri hii huwasilisha kutokosa kuwategemeza na kuitofautisha na kitenzi kinachofuata.
- source_word: וְלֹא יַעַזְבֶךָ
  choice: wala kuwatelekeza
  rationale: עזב humaanisha kuacha au kutupa. 'Kuwatelekeza' huhifadhi uzito wa uhakikisho wa agano na tofauti na kutowaacha bila msaada.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu. Kulitoholea kama 'Yahwe' hulihifadhi badala ya kulibadilisha na cheo.
- issue: Kutofautisha יַרְפְּךָ na יַעַזְבֶךָ
  choice: hatawaacha bila msaada wala kuwatelekeza
  alternative: hatawaacha wala kuwapungukia
  rationale: 'Uhakikisho una vitenzi viwili vinavyohusiana lakini si sawa kabisa: cha kwanza kinadokeza kutolegeza mshiko au kutokosa kutegemeza; cha pili ni kuacha au kutupa. Tafsiri iliyochaguliwa huhifadhi tofauti hiyo bila kuongeza dai lisilomo katika Kiebrania.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Viwakilishi vya wingi vimetumiwa kwa sababu Musa anazungumza na Israeli kwa jumla. Alama ya tanbihi [a] imewekwa baada ya jozi ya mwisho, ambayo ndiyo inaelezwa.
