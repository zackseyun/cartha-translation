  text: So Moses wrote this song on that day and taught it to the sons of Israel[a].
translation:
  language: sw
  text: Basi siku hiyo Musa akaandika wimbo huu, akawafundisha wana wa Israeli wimbo huu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” au “watoto wa Israeli.” Kiebrania kinasema “wana wa Israeli,” usemi wa kawaida wa kiagano unaorejelea watu wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: akaandika
  rationale: Qal wayyiqtol ya כתב ni kitenzi cha kawaida cha masimulizi kinachomaanisha kuandika; “akaandika” pia huhifadhi mfuatano wa matukio.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: wimbo huu
  rationale: שִׁירָה humaanisha kwa kawaida wimbo, hasa katika muktadha huu wa kishairi na wa agano; “wimbo huu” ni usemi wa asili na sahihi kwa Kiswahili.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Huu ni usemi wa wakati unaoeleweka kwa kawaida kama “siku hiyo,” bila kuongeza dhana ya “siku iyo hiyo” ambayo si lazima idaiwe na maandishi.
- source_word: וַיְלַמְּדָהּ
  choice: kuwafundisha
  rationale: Piel ya למד pamoja na kiambishi cha nafsi ya tatu, kike, umoja hurejelea “wimbo”; katika Kiswahili, kitu kinachofundishwa kinaweza kuachwa wazi kwa kuwa “wimbo huu” umetajwa mara moja kabla yake, huku “wa-” ikiwakilisha watu waliofundishwa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: “Wana wa Israeli” huhifadhi muundo wa Kiebrania wenye wingi wa kiume na pia ni usemi wa heshima unaotambulika katika Kiswahili cha Biblia; hapa unalitaja taifa kwa ujumla.
theological_decisions:
- issue: Usemi wa kijumuiya wenye jinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli; watoto wa Israeli
  rationale: Kiebrania kinatumia usemi wa kawaida wa agano wenye maana halisi ya “wana wa Israeli.” Tafsiri hiyo inahifadhi umbo la chanzo na mvutano wake wa kijumuiya bila kuufanya usemi kuwa usio na jinsia, huku tanbihi ikieleza kwamba unarejelea Waisraeli kwa ujumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. “Basi” huonyesha mwendelezo wa masimulizi; miundo ya “aka-” huwasilisha mfuatano wa vitenzi vya Kiebrania kwa njia ya asili ya Kiswahili.
