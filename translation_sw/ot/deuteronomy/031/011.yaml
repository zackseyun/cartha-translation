  text: בְּ/ב֣וֹא כָל יִשְׂרָאֵ֗ל לֵ/רָאוֹת֙ אֶת פְּנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בַּ/מָּק֖וֹם אֲשֶׁ֣ר יִבְחָ֑ר תִּקְרָ֞א אֶת הַ/תּוֹרָ֥ה הַ/זֹּ֛את נֶ֥גֶד כָּל יִשְׂרָאֵ֖ל בְּ/אָזְנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/011.yaml
  text: when all Israel comes to appear before Yahweh your God at the place that he will choose[a], you shall read this law before all Israel in their hearing.
translation:
  language: sw
  text: Wakati Israeli yote itakapokuja kujionyesha mbele ya Yahweh Mungu wako[a] mahali atakapochagua, utaisoma sheria hii mbele ya Israeli yote, masikioni mwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kuuona uso wa Yahweh Mungu wako”; hii ni nahau yenye maana ya kujitokeza katika uwepo wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/ב֣וֹא כָל יִשְׂרָאֵל
  choice: Wakati Israeli yote itakapokuja
  rationale: ב pamoja na kitenzi-jina cha בוא huanzisha kishazi cha wakati. “Israeli yote” linadumisha maana ya taifa la agano kwa ujumla, huku upatanisho wa ngeli katika Kiswahili ukiwa wa kawaida na wenye kueleweka.
- source_word: לֵ/רָאוֹת֙ אֶת פְּנֵי֙
  choice: kuonekana mbele za
  rationale: Katika muktadha wa hija na ibada, nahau hii humaanisha kufika au kujitokeza katika uwepo wa Mungu. “Kuonekana mbele za” ni ya asili katika Kiswahili na huepuka kudokeza kwamba watu wanauona uso wa Mungu kwa macho; maana halisi ya maneno imehifadhiwa katika tanbihi.
- source_word: יְהוָ֣ה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahweh” badala ya kubadilishwa na cheo, hivyo kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: אֱלֹהֶ֔י/ךָ
  choice: Mungu wako
  rationale: Huhifadhi kiambishi cha nafsi ya pili umoja, ambacho katika muktadha huu kinaihusu Israeli kwa umoja wa kiagano.
- source_word: בַּ/מָּק֖וֹם אֲשֶׁ֣ר יִבְחָ֑ר
  choice: mahali atakapopachagua
  rationale: Huhifadhi wazo kuu la Kumbukumbu la Torati kwamba Mungu ndiye anayechagua mahali pa ibada. Muundo wa “atakapopachagua” unatoa kwa kawaida thamani ya wakati ujao ya kitenzi cha Kiebrania.
- source_word: תִּקְרָ֞א אֶת הַ/תּוֹרָ֥ה הַ/זֹּ֛את
  choice: utaisoma sheria hii
  rationale: קרא pamoja na התורה kama shamirisho hapa humaanisha kusoma kwa sauti mbele ya kusanyiko. “Sheria hii” ni tafsiri wazi ya התורה הזאת katika muktadha wa maandishi ya agano.
- source_word: נֶ֥גֶד כָּל יִשְׂרָאֵ֖ל
  choice: mbele ya Israeli yote
  rationale: נגד inaonyesha usomaji wa hadharani katika uwepo wa taifa lote. “Mbele ya Israeli yote” ni fupi, ya asili, na karibu na muundo wa chanzo.
- source_word: בְּ/אָזְנֵי/הֶֽם
  choice: ili wote waisikie
  rationale: Nahau ya Kiebrania “masikioni mwao” inaeleza usomaji unaosikika. Kiswahili cha kusudi “ili wote waisikie” kinawasilisha maana hiyo kwa uwazi bila kutumia nahau ngumu isiyo ya kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania inatumia moja kwa moja Tetragramatoni יהוה. “Yahweh” huhifadhi jina la agano badala ya kulibadilisha na cheo, bila kuingiza msimamo wa dhehebu.
- issue: Maana ya לֵרָאוֹת אֶת־פְּנֵי יהוה
  choice: kuonekana mbele za Yahweh
  alternative: kuuona uso wa Yahweh
  rationale: Katika muktadha huu wa kuja mahali pa ibada, usemi huo ni nahau ya kufika katika uwepo wa Mungu. Tafsiri teule haidai kwamba watu wanauona uso wa Mungu kwa macho, lakini tanbihi huhifadhi umbo halisi na mvutano wake wa kimaana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wa sasa, na unaofaa kusomwa hadharani. “Israeli yote” limetumiwa kama jina la pamoja la taifa, na “ili wote waisikie” linaweka wazi kusudi la usomaji wa hadharani.
