source:
  edition: WLC
  text: וַ/יִּקְרָ֨א מֹשֶׁ֜ה לִֽ/יהוֹשֻׁ֗עַ וַ/יֹּ֨אמֶר אֵלָ֜י/ו לְ/עֵינֵ֣י כָל יִשְׂרָאֵ֘ל חֲזַ֣ק וֶ/אֱמָץ֒ כִּ֣י אַתָּ֗ה תָּבוֹא֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֕רֶץ אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתָ֖/ם לָ/תֵ֣ת לָ/הֶ֑ם וְ/אַתָּ֖ה תַּנְחִילֶ֥/נָּה אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/007.yaml
  text: Then Moses called Joshua and said to him in the sight of all Israel[a], “Be strong and courageous, because you will go with this people into the land that Yahweh swore to their fathers to give them[b], and you will give it to them as an inheritance.”
translation:
  language: sw
  text: Kisha Musa akamwita Yoshua, akamwambia mbele ya Israeli yote, “Uwe hodari na jasiri, kwa maana utaingia pamoja na watu hawa[b] katika nchi ambayo Yahwe aliwaapia baba zao[a] kwamba atawapa watu hawa, nawe utawapa nchi hiyo kuwa urithi wao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “baba zao”; katika muktadha huu inaweza kumaanisha pia “mababu zao.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “utawaingiza watu hawa katika nchi.” Kiebrania kinaweza kueleweka kuwa Yoshua ataingia pamoja na watu au kwamba atawaongoza kuingia.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akamwita
  rationale: Katika simulizi hili, קרא humaanisha kumwita mtu; muundo huu ni wa kawaida na wa heshima katika Kiswahili.
- source_word: לִיהוֹשֻׁעַ
  choice: Yoshua
  rationale: Jina limetoholewa kwa namna inayotambulika katika matumizi ya Biblia ya Kiswahili na inayokaribia umbo la Kiebrania.
- source_word: לְעֵינֵי כָל יִשְׂרָאֵל
  choice: mbele ya Israeli yote
  rationale: Huwasilisha hali ya hadharani inayomaanishwa na usemi wa Kiebrania ‘machoni pa Israeli yote’ kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: חֲזַק וֶאֱמָץ
  choice: Uwe hodari na jasiri
  rationale: Ni himizo la kawaida kuhusu nguvu na ujasiri unaohitajika kwa uongozi; maneno haya mawili yanatiririka vizuri katika Kiswahili.
- source_word: כִּי
  choice: kwa maana
  rationale: Huonyesha sababu ya himizo lililotangulia bila kufanya sentensi kuwa nzito.
- source_word: תָּבוֹא אֶת הָעָם הַזֶּה
  choice: utaingia pamoja na watu hawa
  rationale: Muundo wa בוא pamoja na אֶת unaweza kueleweka kuwa Yoshua ataingia akiwa pamoja na watu, badala ya kuwaleta moja kwa moja; utata huo umeelezwa katika tanbihi.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: ‘Nchi’ ni neno la kawaida la Kiswahili kwa eneo aliloahidi Mungu na linaendeleza mada ya nchi ya ahadi.
- source_word: נִשְׁבַּע יְהוָה
  choice: Yahwe aliwaapia
  rationale: Kitenzi שׁבע kinaonyesha kiapo, na ‘aliwaapia’ kinawasilisha kwa ufupi kwamba Yahwe aliwaahidi kwa kiapo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: לַאֲבֹתָם
  choice: baba zao
  rationale: Huhifadhi neno la ukoo la kiume lililo wazi katika Kiebrania; maana pana inayowezekana imeonyeshwa katika tanbihi.
- source_word: לָתֵת לָהֶם
  choice: kwamba atawapa
  rationale: Huwasilisha kwa Kiswahili cha asili maudhui ya kiapo cha Yahwe.
- source_word: תַּנְחִילֶנָּה אֹתָם
  choice: utawapa nchi hiyo iwe urithi wao
  rationale: Huhifadhi wazo la kusababisha watu waipokee nchi kama urithi, bila kutumia usemi mgumu au wa kitaalamu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Ikiwa תָּבוֹא אֶת הָעָם humaanisha Yoshua kuingia pamoja na watu au kuwaingiza
  choice: utaingia pamoja na watu hawa
  alternative: utawaingiza watu hawa
  rationale: Sarufi inaweza kuonyesha Yoshua akiingia pamoja nao, huku kishazi kinachofuata kikieleza wajibu wake wa kuwapa nchi kama urithi. Tanbihi huhifadhi uwezekano mwingine badala ya kuufuta.
- issue: Maana ya אֲבֹתָם
  choice: baba zao
  alternative: mababu zao; wazee wao wa kale
  rationale: Neno la Kiebrania ni la kiume na kihalisi humaanisha ‘baba zao,’ ingawa katika muktadha linaweza kuwarejelea wahenga wa Israeli kwa upana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaosomeka kwa urahisi. ‘Israeli yote’ hutaja jumuiya nzima, na ‘urithi wao’ huhifadhi lugha ya agano bila kuingiza istilahi za dhehebu.
