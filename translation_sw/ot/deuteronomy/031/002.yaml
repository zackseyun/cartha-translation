  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם בֶּן מֵאָה֩ וְ/עֶשְׂרִ֨ים שָׁנָ֤ה אָנֹכִי֙ הַ/יּ֔וֹם לֹא אוּכַ֥ל ע֖וֹד לָ/צֵ֣את וְ/לָ/ב֑וֹא וַֽ/יהוָה֙ אָמַ֣ר אֵלַ֔/י לֹ֥א תַעֲבֹ֖ר אֶת הַ/יַּרְדֵּ֥ן הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/002.yaml
  text: And he said to them[a], “I am one hundred twenty years old today. I can no longer go out and come in, and Yahweh has said to me, ‘You shall not cross this Jordan.’”
translation:
  language: sw
  text: Akawaambia, “Leo nina umri wa miaka mia moja na ishirini. Siwezi tena kutoka na kuingia[a], naye Yahwe ameniambia, ‘Hutavuka Yordani hii.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kutoka na kuingia”; nahau hii inaweza kurejelea shughuli za kawaida au kuwaongoza watu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Akawaambia
  rationale: Muundo wa masimulizi wa Kiebrania umetafsiriwa kwa kiunganishi cha masimulizi cha Kiswahili; kitenzi hiki pia kinajumuisha maana ya ‘aliwaambia.’
- source_word: בֶּן מֵאָה וְעֶשְׂרִים שָׁנָה אָנֹכִי הַיּוֹם
  choice: Leo nina umri wa miaka mia moja na ishirini
  rationale: Nahau ya Kiebrania ya kusema umri, kihalisi ‘mwana wa miaka...,’ imetolewa kwa Kiswahili cha kawaida, huku ‘leo’ ikidumisha msisitizo wa wakati uliopo.
- source_word: לֹא אוּכַל עוֹד
  choice: Siwezi tena
  rationale: Inadumisha moja kwa moja wazo la kutokuwa na uwezo tena bila kuligeuza kuwa katazo au nia.
- source_word: לָצֵאת וְלָבוֹא
  choice: kutoka na kuingia
  rationale: Tafsiri ya karibu inadumisha nahau ya Kiebrania, ambayo inaweza kumaanisha shughuli za kawaida au uongozi wa watu, bila kuamua maana moja kimya kimya.
- source_word: וַיהוָה
  choice: naye Yahwe
  rationale: Jina la agano יְהוָה limetoholewa kuwa ‘Yahwe’; ‘naye’ linaunganisha kauli hii na iliyotangulia kwa Kiswahili cha kawaida.
- source_word: אָמַר אֵלַי
  choice: ameniambia
  rationale: Wakati timilifu wa Kiswahili unaonyesha kauli iliyotolewa awali ambayo bado ina umuhimu kwa hali ya sasa.
- source_word: לֹא תַעֲבֹר
  choice: Hutavuka
  rationale: Kauli hii inaweza kubeba nguvu ya tangazo au katazo la Mungu; umbo la wakati ujao la kukanusha linadumisha mvutano huo kwa Kiswahili.
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: Yordani hii
  rationale: Inadumisha jina la mahali pamoja na kiashiria ‘hii’ bila kuongeza neno ‘Mto,’ ambalo halipo wazi katika maandishi ya Kiebrania.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la Mungu la herufi nne moja kwa moja. ‘Yahwe’ linadumisha jina hilo kama jina maalumu badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya לֹא תַעֲבֹר
  choice: Hutavuka
  alternative: Usivuke
  rationale: Kiebrania kinaweza kueleweka kama tangazo lenye mamlaka au katazo. ‘Hutavuka’ linafaa katika muktadha wa Mungu kutangaza jambo ambalo halitatokea bila kulifanya kuwa amri ya kawaida pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Nahau yenye utata imedumishwa katika maandishi na kufafanuliwa kwa tanbihi.
