  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu vipengele vya msingi vya Kiebrania: kauli kwa watu, umri wa Musa siku hiyo, kutoweza tena “kutoka na kuingia,” na tamko la Yahwe kwamba hatavuka Yordani hii. “Hutavuka” huhifadhi vizuri nguvu ya tamko la kimungu bila kuligeuza kuwa amri ya moja kwa moja.'
  naturalness: Kiswahili ni sanifu, wazi, na chenye mtiririko wa masimulizi unaofaa. “Siwezi tena kutoka na kuingia” ni usemi wa karibu na chanzo; ingawa ni nahau isiyo ya kawaida kidogo katika Kiswahili cha leo, tanbihi inaeleza upeo wake wa maana na hivyo ni uchaguzi unaofaa.
  terminology: “Yahwe” ni uhamishaji unaofaa wa jina יְהוָה katika Kiswahili. “Yordani hii” huhifadhi jina maalumu pamoja na kiashiria cha Kiebrania. Istilahi ya umri na ya kuvuka imewasilishwa kwa usahihi.
