  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַֽ/יהוָ֞ה ה֣וּא הַ/הֹלֵ֣ךְ לְ/פָנֶ֗י/ךָ ה֚וּא יִהְיֶ֣ה עִמָּ֔/ךְ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֣א יַֽעַזְבֶ֑/ךָּ לֹ֥א תִירָ֖א וְ/לֹ֥א תֵחָֽת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/008.yaml
  text: And Yahweh himself is the one going before you[a]. He himself will be with you; he will not fail you or forsake you. Do not fear or be dismayed.
translation:
  language: sw
  text: Na Yahwe mwenyewe ndiye anayekwenda mbele yako. Yeye mwenyewe atakuwa pamoja nawe; hatakuachilia[a] wala hatakuacha. Usiogope wala usivunjike moyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hatakuacha uanguke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Yahwe
  rationale: Jina la agano יְהוָה limetafsiriwa kwa umbo linalotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: הוּא הַהֹלֵךְ לְפָנֶיךָ
  choice: mwenyewe ndiye anayekwenda mbele yako
  rationale: Viwakilishi huru na muundo wa kirai-shirikishi vinaweka mkazo kwa Yahwe mwenyewe na tendo lake la kuendelea kutangulia.
- source_word: הוּא יִהְיֶה עִמָּךְ
  choice: Yeye mwenyewe atakuwa pamoja nawe
  rationale: Huhifadhi mkazo wa הוּא na lugha ya uwepo wa Mungu bila kuongeza maana isiyokuwamo katika Kiebrania.
- source_word: לֹא יַרְפְּךָ
  choice: hatakupungukia
  rationale: Kitenzi רפה katika Hiphil hapa kina wazo la kutomwacha mtu ashindwe au kukosa msaada; ‘hatakupungukia’ ni kifupi, cha heshima, na kinakibakiza tofauti na kitenzi kinachofuata cha kuacha.
- source_word: וְלֹא יַעַזְבֶךָּ
  choice: wala hatakuacha
  rationale: עזב humaanisha kuacha au kutelekeza; ‘hatakuacha’ ni ya kawaida na wazi katika Kiswahili.
- source_word: לֹא תִירָא
  choice: Usiogope
  rationale: Kauli hii inafanya kazi kama katazo au himizo la moja kwa moja.
- source_word: וְלֹא תֵחָת
  choice: wala usivunjike moyo
  rationale: Niphal ya חתת inaweza kumaanisha kufadhaika, kuvunjika au kutishwa; nahau hii ya Kiswahili huwasilisha hali ya kukata tamaa au kulemewa bila kurudia tu wazo la kuogopa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina la pekee la Mungu; kulinakili kama ‘Yahwe’ huhifadhi jina hilo badala ya kuliwakilisha kwa cheo.
- issue: Tofauti kati ya יַרְפְּךָ na יַעַזְבֶךָּ
  choice: hatakupungukia wala hatakuacha
  alternative: hatakuachilia wala hatakutelekeza
  rationale: 'Chaguo hili halivifanyi vitenzi vyote viwili kuwa visawe kamili: cha kwanza kinasisitiza kutokosa msaada wake, na cha pili kutokuachwa.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya ‘mwenyewe’ yamehifadhiwa kwa sababu yanawakilisha mkazo wa הוּא katika vifungu vyote viwili. ‘Usivunjike moyo’ ni nahau ya kawaida inayobeba uzito wa himizo la Kiebrania.
