lexical_decisions:
- source_word: וַיְצַו
  choice: akawaamuru
  rationale: Kitenzi צוה kinaonyesha kutoa amri; muundo wenye “aka-” unaendeleza mfuatano wa simulizi wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa watu wa kabila au ukoo wa Lawi.
- source_word: נֹשְׂאֵי
  choice: waliobeba
  rationale: Kivumishi-tendo cha Kiebrania kinawatambulisha Walawi kuwa wale waliolibeba sanduku; tafsiri hii ni wazi na ya asili katika Kiswahili.
- source_word: אֲרוֹן
  choice: sanduku
  rationale: Katika muktadha wa ibada na agano, neno hili linarejelea sanduku takatifu; “sanduku la agano” ni istilahi iliyozoeleka na inayoeleweka.
- source_word: בְּרִית
  choice: la agano
  rationale: Muundo wa Kiebrania unaonyesha uhusiano wa umilikaji/ufafanuzi katika kishazi “sanduku la agano.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania linawakilishwa kama jina binafsi, badala ya kubadilishwa kuwa cheo.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huu ni mtindo wa kawaida wa kuanzisha maneno ya moja kwa moja yanayofuata katika mstari unaofuata.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Kazi ya נֹשְׂאֵי kama tendo au maelezo yenye hadhi ya cheo
  choice: waliobeba
  alternative: wabebaji wa
  rationale: Kivumishi-tendo kinaweza kueleza shughuli yao katika tukio au kuwatambulisha kwa jukumu lao. Matini kuu imetumia kishazi-tendo cha kawaida huku tanbihi ikihifadhi uwezekano wa maelezo yanayofanana na cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. “Akawaamuru” na “akisema” vinaendeleza mtiririko wa simulizi; koma ya mwisho inaonyesha kwamba maneno ya Musa yanafuata katika mstari unaofuata.
