source:
  edition: WLC
  text: וְ֠/הָיָה כִּֽי תִמְצֶ֨אןָ אֹת֜/וֹ רָע֣וֹת רַבּוֹת֮ וְ/צָרוֹת֒ וְ֠/עָנְתָה הַ/שִּׁירָ֨ה הַ/זֹּ֤את לְ/פָנָי/ו֙ לְ/עֵ֔ד כִּ֛י לֹ֥א תִשָּׁכַ֖ח מִ/פִּ֣י זַרְע֑/וֹ כִּ֧י יָדַ֣עְתִּי אֶת יִצְר֗/וֹ אֲשֶׁ֨ר ה֤וּא עֹשֶׂה֙ הַ/יּ֔וֹם בְּ/טֶ֣רֶם אֲבִיאֶ֔/נּוּ אֶל הָ/אָ֖רֶץ אֲשֶׁ֥ר נִשְׁבָּֽעְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/021.yaml
  text: And when many evils and troubles come upon him[a], this song will answer before him as a witness, for it will not be forgotten from the mouth of his offspring; for I know his inclination, what he is doing today[d][c][b], before I bring him into the land that I swore to give.
translation:
  language: sw
  text: Na mabaya mengi na taabu zitakapompata[a], wimbo huu utajibu mbele yake[b] kama shahidi, kwa maana hautasahaulika kutoka vinywani mwa wazao wake. Kwa maana ninajua mwelekeo wake[c]—yale anayofanya leo—kabla sijamwingiza katika nchi niliyoapa kumpa[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “zitakapomkuta” au “zitakapomfikia.”
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha huu, “mbele yake” pia inaweza kueleweka kwa nguvu zaidi kuwa “dhidi yake,” kwa kuwa wimbo unatenda kama shahidi.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania pia kinaweza kumaanisha “nia yake,” “fikira zake,” au “msukumo wake,” yaani hali yake ya ndani.
    reason: lexical_alternative
  - marker: d
    text: Kiebrania kinasema tu “niliyoapa”; neno “kumpa” linaeleweka kutokana na muktadha wa ahadi ya agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Na ... zitakapompata
  rationale: Muundo wa wakati ujao umewekwa kwa Kiswahili cha kawaida bila kuiga kwa ukakasi msemo wa Kiebrania ‘na itakuwa kwamba.’
- source_word: תִמְצֶאןָ אֹתוֹ
  choice: zitakapompata
  rationale: Katika muktadha huu kitenzi kinaonyesha mabaya na taabu zikimfikia au kumkumba mtu; ‘zitakapompata’ ni ya kawaida na bado huhifadhi taswira hiyo.
- source_word: רָעוֹת רַבּוֹת וְצָרוֹת
  choice: mabaya mengi na taabu
  rationale: ‘Mabaya’ hapa yanaweza kumaanisha matukio mabaya au maafa, si lazima uovu wa kimaadili; ‘taabu’ huwasilisha dhiki zinazofuatana nayo.
- source_word: וְעָנְתָה
  choice: utajibu
  rationale: Huhifadhi maana ya msingi ya ‘kujibu/kuitikia’ na taswira ya wimbo wenye kutoa jibu; jukumu lake la ushahidi linaelezwa wazi na maneno yanayofuata.
- source_word: לְפָנָיו לְעֵד
  choice: mbele yake kama shahidi
  rationale: ‘Mbele yake’ huhifadhi lugha ya mahali ya Kiebrania, huku ‘kama shahidi’ ikieleza kazi ya wimbo bila kulazimisha maana ya ‘dhidi yake’ katika matini kuu.
- source_word: לֹא תִשָּׁכַח מִפִּי זַרְעוֹ
  choice: hautasahaulika kutoka vinywani mwa wazao wake
  rationale: Huhifadhi hali ya kutendwa na wazo la wimbo kuendelea kutamkwa kwa mdomo miongoni mwa vizazi.
- source_word: יִצְרוֹ
  choice: mwelekeo wake
  rationale: Neno hilo linaonyesha mwelekeo, nia, au msukumo wa ndani; ‘mwelekeo’ ni wazi bila kuingiza mfumo wa kiteolojia usiotajwa.
- source_word: אֲשֶׁר הוּא עֹשֶׂה הַיּוֹם
  choice: yale anayofanya leo
  rationale: Kirai hiki kinaonyesha mwenendo wa sasa wa Israeli na kimeunganishwa kwa vistari ili uhusiano wake na ‘mwelekeo wake’ ubaki wazi lakini usitatuliwe kupita kiasi.
- source_word: הָאָרֶץ אֲשֶׁר נִשְׁבָּעְתִּי
  choice: nchi niliyoapa kumpa
  rationale: Kitenzi ‘kumpa’ hakitajwi moja kwa moja katika Kiebrania kilichopo, lakini kinakamilisha kwa Kiswahili kiapo cha agano kinachoeleweka katika muktadha; jambo hilo limebainishwa katika tanbihi.
theological_decisions:
- issue: Maana ya יִצְרוֹ katika ujuzi wa Mungu kuhusu hali ya ndani ya Israeli
  choice: mwelekeo wake
  alternative: nia yake; fikira zake; msukumo wake
  rationale: ‘Mwelekeo’ huhifadhi uzito wa kimaadili na wa hiari wa hali ya ndani ya Israeli bila kuufanya mstari huu uthibitishe peke yake fundisho maalumu kuhusu asili ya mwanadamu.
- issue: Wimbo kuwa shahidi לְפָנָיו
  choice: mbele yake kama shahidi
  alternative: dhidi yake kama shahidi
  rationale: Muktadha unaruhusu nguvu ya kisheria ya ushahidi dhidi ya Israeli, lakini maana ya moja kwa moja ‘mbele yake’ imehifadhiwa katika matini na uwezekano mwingine umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Umoja wa kisarufi wa Israeli umehifadhiwa kwa viwakilishi vya umoja, huku ‘wazao’ ikionyesha vizazi vyake. Taswira ya wimbo ‘kujibu’ imehifadhiwa badala ya kubadilishwa moja kwa moja kuwa ‘kushuhudia.’
