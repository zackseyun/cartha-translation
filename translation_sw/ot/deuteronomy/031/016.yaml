  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הִנְּ/ךָ֥ שֹׁכֵ֖ב עִם אֲבֹתֶ֑י/ךָ וְ/קָם֩ הָ/עָ֨ם הַ/זֶּ֜ה וְ/זָנָ֣ה אַחֲרֵ֣י אֱלֹהֵ֣י נֵֽכַר הָ/אָ֗רֶץ אֲשֶׁ֨ר ה֤וּא בָא שָׁ֨מָּ/ה֙ בְּ/קִרְבּ֔/וֹ וַ/עֲזָבַ֕/נִי וְ/הֵפֵר֙ אֶת בְּרִיתִ֔/י אֲשֶׁ֥ר כָּרַ֖תִּי אִתּֽ/וֹ־־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/016.yaml
  text: And Yahweh said to Moses[a], “Behold, you are about to lie down with your fathers. Then this people will rise up and prostitute themselves after the foreign gods of the land into whose midst they are entering[b]. They will forsake me and break my covenant that I made with them.”
translation:
  language: sw
  text: Yahwe akamwambia Musa, “Tazama, unakaribia kulala pamoja na mababu zako. Ndipo watu hawa watakapoinuka na kutenda ukahaba[a] kwa kuifuata miungu ya kigeni ya nchi wanayoingia katikati yake. Wataniacha na kulivunja agano langu nililofanya nao[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania husema kihalisi, “kutenda ukahaba kwa kuifuata miungu ya kigeni.” Sitiari ya kingono hutumiwa kueleza kutokuwa waaminifu kwa agano kwa kuabudu miungu mingine.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hutumia maumbo ya umoja katika “anaingia,” “katikati yake,” na “naye.” Maumbo hayo yanaweza kumrejelea Israeli/watu hawa kama kundi moja; Kiswahili hutumia wingi pale inapohitajika ili rejeleo liwe wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: הִנְּךָ שֹׁכֵב עִם אֲבֹתֶיךָ
  choice: Tazama, unakaribia kulala pamoja na mababu zako
  rationale: Inahifadhi tamathali ya Kiebrania kuhusu kufa na kujiunga na waliotangulia, huku ‘unakaribia’ ikionyesha tukio lililo karibu.
- source_word: וְקָם
  choice: Ndipo watu hawa watakapoinuka
  rationale: ‘Watakapoinuka’ huhifadhi kitenzi cha chanzo bila kuamua kimbele kwamba maana yake yenyewe ni kuasi; matendo yanayofuata yanaeleza uasi huo.
- source_word: וְזָנָה אַחֲרֵי
  choice: na kufanya ukahaba kwa kuifuata
  rationale: Maneno haya yanadumisha kwa uwazi sitiari kali ya uasherati inayotumiwa kueleza kutokuwa waaminifu kwa agano kupitia ibada ya sanamu.
- source_word: אֱלֹהֵי נֵכַר הָאָרֶץ
  choice: miungu ya kigeni ya nchi
  rationale: Tafsiri hii inahifadhi uhusiano wa miungu hiyo na nchi ambayo watu wanaingia na wazo la ugeni lililo katika נֵכַר.
- source_word: אֲשֶׁר הוּא בָא שָׁמָּה בְּקִרְבּוֹ
  choice: wanayoingia katikati yake
  rationale: Umoja wa Kiebrania unaeleweka kwa maana ya pamoja ukirejelea Israeli; wingi wa Kiswahili huonyesha rejeleo hilo kwa kawaida na kwa uwazi.
- source_word: וַעֲזָבַנִי
  choice: Wataniacha
  rationale: Ni usemi wa kawaida na mzito wa kuvunja uaminifu wa uhusiano bila kuongeza maelezo yasiyokuwapo katika chanzo.
- source_word: וְהֵפֵר אֶת בְּרִיתִי
  choice: na kulivunja agano langu
  rationale: ‘Kulivunja agano’ ni Kiswahili cha asili kinachoonyesha maana ya kuvunja au kukiuka agano.
- source_word: אֲשֶׁר כָּרַתִּי אִתּוֹ
  choice: nililofanya nao
  rationale: Nahau ya Kiebrania ya ‘kukata agano’ imetafsiriwa kwa nahau ya kawaida ya Kiswahili ‘kufanya agano’; wingi ‘nao’ unaweka wazi kuwa umoja wa chanzo unawahusu watu kwa pamoja.
theological_decisions:
- issue: Ibada ya sanamu inaelezwa kwa sitiari ya kingono
  choice: Kudumisha sitiari kwa maneno ‘kufanya ukahaba kwa kuifuata miungu ya kigeni’
  alternative: ‘kutokuwa waaminifu kwa kuifuata miungu ya kigeni’
  rationale: Kitenzi זנה kimetumiwa kwa makusudi kutoa picha kali ya kutokuwa mwaminifu kwa agano; kukifanya kuwa usemi wa jumla kungepunguza nguvu ya maandishi.
- issue: Viwakilishi vya umoja vinavyowakilisha Israeli kwa pamoja
  choice: 'Kutumia wingi wa Kiswahili: ‘wanaoingia’ na ‘nao’'
  alternative: 'Kuhifadhi umoja: ‘anayeingia’ na ‘naye’'
  rationale: Umoja wa Kiebrania ni umoja wa pamoja unaowakilisha watu wote. Wingi ni wa kawaida zaidi katika Kiswahili na haubadili rejeleo wala maana ya kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Mababu zako’ huepuka utata wa Kiswahili wa ‘kulala na baba zako’ huku kikihifadhi tamathali ya kifo. Alama za tanbihi zimewekwa baada ya vifungu vinavyozieleza.
