  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּֽי אֲבִיאֶ֜/נּוּ אֶֽל הָ/אֲדָמָ֣ה אֲשֶׁר נִשְׁבַּ֣עְתִּי לַ/אֲבֹתָ֗י/ו זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ וְ/אָכַ֥ל וְ/שָׂבַ֖ע וְ/דָשֵׁ֑ן וּ/פָנָ֞ה אֶל אֱלֹהִ֤ים אֲחֵרִים֙ וַ/עֲבָד֔וּ/ם וְ/נִ֣אֲצ֔וּ/נִי וְ/הֵפֵ֖ר אֶת בְּרִיתִֽ/י־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/020.yaml
  text: For when I bring him into the land that I swore to his fathers[a], a land flowing with milk and honey, and he eats and is satisfied and grows fat, then he will turn to other gods and serve them[b], and spurn me and break my covenant.
translation:
  language: sw
  text: Kwa maana nitakapomwingiza katika nchi niliyowaapia baba zake, nchi inayotiririka maziwa na asali, atakula na kushiba na kunenepa. Kisha ataigeukia miungu mingine; wataitumikia na kunidharau,[a] naye atalivunja agano langu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hubadilika kutoka umoja (“-mwingiza… atakula… ataigeukia”) kwenda wingi (“wataitumikia… kunidharau”), kisha hurudi katika umoja (“atalivunja”). Hivyo Israeli anaonyeshwa kama taifa moja na pia kama watu wengi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana nitakapo-
  rationale: “Kwa maana” linaonyesha kuwa kauli hii inatoa sababu au ufafanuzi wa onyo lililotangulia, huku kiambishi cha wakati “nitakapo-” kikihifadhi maana ya wakati iliyo katika mfuatano.
- source_word: אֲבִיאֶנּוּ
  choice: nitakapomwingiza
  rationale: Kitenzi kina nafsi ya kwanza umoja kama mtendaji na yambwa wa tatu umoja wa kiume. Umoja unamhusu Israeli kwa pamoja kama taifa moja.
- source_word: הָאֲדָמָה
  choice: nchi
  rationale: Katika muktadha wa ahadi ya agano, neno hili linaelekeza kwenye nchi iliyoahidiwa, si udongo tu.
- source_word: נִשְׁבַּעְתִּי לַאֲבֹתָיו
  choice: niliyowaapia baba zake
  rationale: Huhifadhi kiapo kwa mababa wa Israeli na kiambishi cha umoja kinachomrejelea Israeli kama taifa moja.
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: nchi inayotiririka maziwa na asali
  rationale: Huhifadhi taswira halisi ya Kiebrania ya nchi yenye wingi na ustawi.
- source_word: וְאָכַל וְשָׂבַע וְדָשֵׁן
  choice: atakula na kushiba na kunenepa
  rationale: Huhifadhi mfuatano wa kula, kutosheka, na kunenepa; “kunenepa” linaendeleza taswira halisi ya ustawi unaoleta hali ya kujitosheleza.
- source_word: וּפָנָה אֶל
  choice: ataigeukia
  rationale: Huonyesha kubadili mwelekeo wa uaminifu na kuelekea miungu mingine bila kuongeza istilahi ya kitheolojia isiyosemwa moja kwa moja.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi “mingine” badala ya kuifasiri kuwa “ya kigeni.”
- source_word: וַעֲבָדוּם
  choice: wataitumikia
  rationale: Kitenzi cha Kiebrania kina mtendaji wa wingi, tofauti na vitenzi vya umoja vilivyotangulia. “Kutumikia” huhifadhi maana ya utii na ibada kwa miungu hiyo.
- source_word: וְנִאֲצוּנִי
  choice: kunidharau
  rationale: Neno lina maana ya kumtendea Mungu kwa dharau au kumkataa kwa dharau; “kunidharau” ni la kawaida na lenye uzito unaofaa.
- source_word: וְהֵפֵר אֶת־בְּרִיתִי
  choice: naye atalivunja agano langu
  rationale: Kitenzi kinarudi katika umoja na kinaeleza kuvunja au kubatilisha agano.
theological_decisions:
- issue: Kubadilika kwa umoja na wingi katika kumrejelea Israeli
  choice: Kuhifadhi umoja katika “-mwingiza… zake… atakula… ataigeukia,” kubadili kuwa wingi katika “wataitumikia na kunidharau,” kisha kurudi katika umoja katika “naye atalivunja.”
  alternative: Kusawazisha marejeo yote yawe ya wingi au yote yawe ya umoja.
  rationale: Kiebrania humchukulia Israeli kwa zamu kama taifa moja na kama watu wengi. Kuhifadhi mabadiliko hayo kunatunza mvutano na muundo wa chanzo badala ya kuufuta.
- issue: Lugha ya kutokuwa mwaminifu kwa agano
  choice: “ataigeukia miungu mingine; wataitumikia”
  alternative: “ataasi kwa kuabudu sanamu” au “ataukana imani”
  rationale: Tafsiri inaeleza matendo yaliyotajwa katika chanzo bila kuongeza majina ya kimafundisho ambayo hayako wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umefanywa uwe wa kawaida kwa msomaji, lakini mabadiliko yasiyo ya kawaida ya umoja na wingi yamehifadhiwa kwa sababu yako wazi katika Kiebrania.
