  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/בְנֵי/הֶ֞ם אֲשֶׁ֣ר לֹֽא יָדְע֗וּ יִשְׁמְעוּ֙ וְ/לָ֣מְד֔וּ לְ/יִרְאָ֖ה אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם כָּל הַ/יָּמִ֗ים אֲשֶׁ֨ר אַתֶּ֤ם חַיִּים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/013.yaml
  text: And their children[a], who have not known[c][b], shall hear and learn to fear Yahweh your God all the days that you live on the land that you are crossing the Jordan to possess.
translation:
  language: sw
  text: Na watoto wao[a], ambao hawajajua, watasikia na kujifunza kumcha Yahwe[b], Mungu wenu, siku zote mtakazoishi katika nchi mnayovuka Yordani kwenda kuimiliki[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wana wao.” Neno la Kiebrania linaweza kumaanisha wana wa kiume hasa au watoto na wazao kwa upana.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: YHWH; kwa desturi limetafsiriwa “BWANA.”'
    reason: alternative_reading
  - marker: c
    text: Au “kwenda kuitwaa iwe milki yao” au “kwenda kuirithi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: Na watoto wao
  rationale: בנים inaweza kumaanisha wana wa kiume hasa au watoto na wazao kwa upana. Katika muktadha wa kufundishwa kwa kizazi kinachofuata, “watoto” linaonyesha vizuri maana pana bila kuiwekea mipaka ya jinsia.
- source_word: אֲשֶר לֹא יָדְעוּ
  choice: ambao hawajapata kujua
  rationale: Kauli hii inaonyesha kutokuwa na maarifa au uzoefu wa awali. “Hawajapata kujua” ni Kiswahili cha kawaida kinachohifadhi wazo hilo bila kufafanua kimabavu kitu ambacho hawajakijua.
- source_word: יִשְׁמְעוּ וְלָמְדוּ
  choice: watasikia na kujifunza
  rationale: 'Vitenzi vinafuatana kama matokeo au kusudi la kusomewa kwa sheria: kusikia kisha kujifunza. “Watasikia” linafaa hasa kwa usomaji wa hadharani unaotajwa katika muktadha.'
- source_word: לְיִרְאָה
  choice: kumcha
  rationale: ירא hapa ni hofu yenye uzito wa agano, inayohusisha pia heshima na utiifu. “Kumcha” ni neno la kawaida la kibiblia la Kiswahili na halipunguzi uzito huo kuwa heshima tu.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahwe, Mungu wenu
  rationale: Jina la agano יְהוָה limetoholewa kuwa “Yahwe,” na אֱלֹהֵיכֶם imetafsiriwa moja kwa moja “Mungu wenu,” ikidumisha hotuba kwa Israeli kwa wingi.
- source_word: כָּל הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים
  choice: siku zote mtakazoishi
  rationale: Hii inahifadhi wazo la siku zote za maisha yao huku ikitumia muundo wa Kiswahili ulio wa kawaida na wenye hadhi.
- source_word: עַל הָאֲדָמָה
  choice: katika nchi
  rationale: Ingawa עַל kwa umbo ni “juu ya,” katika Kiswahili “katika nchi” ni usemi wa asili kwa kuishi ndani ya eneo hilo. אֲדָמָה hapa ni nchi wanayopewa, si udongo tu.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן שָׁמָּה לְרִשְׁתָּהּ
  choice: mnayovuka Yordani kwenda kuimiliki
  rationale: Muundo huu unaonyesha kuvuka Yordani kuelekea huko kwa kusudi la kuichukua nchi iwe milki yao. Kiambishi “-i-” katika “kuimiliki” kinarejelea nchi waziwazi.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi la agano, YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Upeo wa בנים katika mafundisho ya agano
  choice: watoto
  alternative: wana
  rationale: Muktadha unahusu kizazi kinachofuata kwa ujumla. “Watoto” linaacha wazi upeo huo, ilhali “wana” lingeweza kueleweka kuwa wavulana pekee.
- issue: Maana ya kumcha Mungu
  choice: kumcha
  alternative: kumheshimu sana
  rationale: “Kumcha” huhifadhi mvutano wa ירא kati ya hofu, staha na utiifu wa agano; “kumheshimu sana” lingelainisha maana kwa kuamua kwamba ni staha tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imedumisha mtiririko wa Kiebrania—kusikia, kujifunza, na kumcha Mungu—lakini imetumia “katika nchi” na “kwenda kuimiliki” ili iwe ya asili kwa msomaji wa kawaida. Alama zote za tanbihi zimewekwa mahali zinapohusika moja kwa moja.
