translation:
  language: sw
  text: Kisha Musa akasema maneno ya wimbo huu, kusanyiko lote la Israeli likisikia, mpaka maneno hayo yalipokamilika[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka Musa alipomaliza kuyasema”—yaani, mpaka Musa alipomaliza kusema maneno ya wimbo huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha Musa akasema
  rationale: Kiunganishi cha masimulizi kinaendeleza mfuatano wa matukio; “Kisha” ni cha asili katika Kiswahili, na “akasema” linatoa maana ya kawaida ya kitenzi katika muktadha huu.
- source_word: בְּאָזְנֵי
  choice: kusanyiko lote la Israeli likisikia
  rationale: Kiebrania halisi ni “masikioni mwa,” nahau inayomaanisha kusema watu wakisikia. Muundo huu wa Kiswahili unahifadhi maana ya kusikiwa bila kutumia tafsiri halisi isiyo ya kawaida.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: kusanyiko lote la Israeli
  rationale: קהל ni jumuiya iliyokusanyika. “Kusanyiko” ni neno la kawaida na lisiloegemea istilahi maalumu ya kidhehebu; “lote” linaonyesha כָּל.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: maneno ya wimbo huu
  rationale: Tafsiri hii inahifadhi kutajwa wazi kwa “maneno,” badala ya kufupisha kuwa “wimbo huu” tu, na inawakilisha הַזֹּאת kwa “huu.”
- source_word: עַד תֻּמָּם
  choice: mpaka yalipokwisha
  rationale: Kiwakilishi cha wingi kinaelekea kurejelea “maneno,” na usemi huu unaonyesha kukamilika kwa kutamkwa kwao. Maandishi yanaweza pia kueleweka kwa maana tendaji kwamba Musa alimaliza kuyasema; uwezekano huo umewekwa katika tanbihi.
