source:
  edition: WLC
  text: יְהוָ֨ה אֱלֹהֶ֜י/ךָ ה֣וּא עֹבֵ֣ר לְ/פָנֶ֗י/ךָ הֽוּא יַשְׁמִ֞יד אֶת הַ/גּוֹיִ֥ם הָ/אֵ֛לֶּה מִ/לְּ/פָנֶ֖י/ךָ וִֽ/ירִשְׁתָּ֑/ם יְהוֹשֻׁ֗עַ ה֚וּא עֹבֵ֣ר לְ/פָנֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/003.yaml
  text: Yahweh your God himself is crossing over before you[a]. He himself will destroy these nations from before you, and you will dispossess them. Joshua himself is crossing over before you[b], just as Yahweh has spoken.
translation:
  language: sw
  text: Yahwe, Mungu wako, ndiye anayevuka mbele yako.[a] Yeye mwenyewe atayaangamiza mataifa haya kutoka mbele yako, nawe utawamiliki.[b] Yoshua ndiye anayevuka mbele yako, kama Yahwe alivyosema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “anatangulia mbele yako” au “atavuka mbele yako.” Kitenzi kishirikishi cha Kiebrania kinaweza kuonyesha tendo linaloendelea, lililo karibu kutokea, au la wakati ujao lililo hakika.
    reason: lexical_alternative
  - marker: b
    text: Au “utawanyang’anya milki yao” au “utaitwaa nchi yao.” Kitenzi cha Kiebrania mara nyingi humaanisha kutwaa milki kwa kuwaondoa waliokuwa nayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama “BWANA.” Tahajia “Yahwe” ni ya kawaida na inasomeka kwa urahisi katika Kiswahili.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Muundo huu una kiambishi cha nafsi ya pili umoja na unaonyesha uhusiano wa agano na msikilizaji mmoja anayewakilisha Israeli.
- source_word: הוּא
  choice: ndiye / yeye mwenyewe
  rationale: Kiwakilishi huru kina mkazo. “Ndiye” kinatoa mkazo wa kawaida baada ya “Yahwe Mungu wako” na “Yoshua,” huku “yeye mwenyewe” kikisisitiza kwamba Yahwe ndiye mwenye kutenda uharibifu huo.
- source_word: עֹבֵר לְפָנֶיךָ
  choice: anayevuka mbele yako
  rationale: Kitenzi kishirikishi kinaweza kuonyesha tendo linaloendelea, lililo karibu, au la wakati ujao lililo hakika. “Anayevuka” pia kinahifadhi picha ya kuvuka kuelekea nchi.
- source_word: יַשְׁמִיד
  choice: atayaangamiza
  rationale: Hifili ya שׁמד ina maana ya kusababisha uharibifu. “Kuangamiza” ni neno lenye nguvu linalofaa muktadha bila kuongeza dai la ufafanuzi kuhusu kiwango cha uharibifu.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: mataifa haya
  rationale: Katika muktadha wa Kumbukumbu la Torati, גּוֹיִם hutaja makundi ya kikabila na kisiasa ya Kanaani; “mataifa” ndiyo tafsiri ya kawaida na ya asili.
- source_word: מִלְּפָנֶיךָ
  choice: mbele yako
  rationale: Kiswahili cha asili hakihitaji kufuata kihalisi muundo “kutoka mbele yako”; katika muktadha huu “mbele yako” linaonyesha kuondolewa kwao katika njia ya Israeli.
- source_word: וִירִשְׁתָּם
  choice: utawafukuza na kuitwaa nchi yao
  rationale: Katika muktadha wa ushindi, ירשׁ huunganisha kuwanyang’anya wakazi wa awali milki na kuitwaa. Upanuzi huu mfupi unaeleza maana hiyo kwa Kiswahili cha kawaida, ingawa kiambishi cha Kiebrania kihalisi kinawarejelea “wao.”
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: kama Yahwe alivyosema
  rationale: דִּבֶּר humaanisha kusema au kunena. “Alivyosema” ni ya asili na haiongezi maana ya “kuahidi,” ambayo si ya lazima katika kitenzi chenyewe.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova au BWANA
  rationale: Matini ya Kiebrania inatumia jina binafsi la Mungu. Kulihifadhi kama “Yahwe” kunatofautisha jina hilo na cheo bila kuingiza mapokeo ya dhehebu.
- issue: Mkazo wa utendaji wa Yahwe na Yoshua
  choice: Kuhifadhi mkazo kwa “ndiye” na “yeye mwenyewe”
  alternative: Kutumia “yeye” bila mkazo
  rationale: Aya inasisitiza kwamba Yahwe mwenyewe anatangulia na kuangamiza, huku Yoshua pia akitangulia kwa agizo la Mungu. Tafsiri inahifadhi pamoja utendaji wa Mungu na wa kiongozi wa kibinadamu bila kuufanya mmoja uondoe mwingine.
- issue: Maana ya ירשׁ katika ushindi
  choice: Kufukuza wenyeji na kuitwaa nchi yao
  alternative: Kuwamiliki au kurithi
  rationale: Kitenzi kinaweza kuonyesha kutwaa milki kwa kuwanyang’anya waliokuwa nayo. “Kurithi” pekee kungeficha hali ya ushindi, na “kuwamiliki” kingeweza kueleweka kana kwamba watu wenyewe wanakuwa mali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na wazi kwa usomaji wa hadhara. “Kuangamiza” huhifadhi uzito wa matini, huku “utawafukuza na kuitwaa nchi yao” ikieleza kwa lugha ya kawaida wigo wa kitenzi ירשׁ. Alama zote za tanbihi zimewekwa mahali panapohusika katika matini kuu.
