  text: וְ/עַתָּ֗ה כִּתְב֤וּ לָ/כֶם֙ אֶת הַ/שִּׁירָ֣ה הַ/זֹּ֔את וְ/לַמְּדָ֥/הּ אֶת בְּנֵי יִשְׂרָאֵ֖ל שִׂימָ֣/הּ בְּ/פִי/הֶ֑ם לְמַ֨עַן תִּהְיֶה לִּ֜/י הַ/שִּׁירָ֥ה הַ/זֹּ֛את לְ/עֵ֖ד בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/019.yaml
  text: And now[a], write this song for yourselves, and teach it to the sons of Israel; put it in their mouths[b], so that this song may be a witness for me against the sons of Israel.
translation:
  language: sw
  text: Basi sasa, jiandikieni wimbo huu, nawe uwafundishe wimbo huu wana wa Israeli[a]. Uutie vinywani mwao, ili wimbo huu uwe shahidi kwa ajili yangu dhidi ya wana wa Israeli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Waisraeli. Kiebrania kinasema kihalisi “wana wa Israeli”; msemo huo unawahusu watu wa Israeli kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Au “miongoni mwa wana wa Israeli.” Katika muktadha huu, wimbo unaelekea kuwa shahidi dhidi yao, ingawa kihusishi cha Kiebrania kinaweza pia kutafsiriwa kwa maana ya “miongoni mwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Neno hili linaendeleza hotuba huku likionyesha mpito wa haraka; “Basi sasa” ni la kawaida na linahifadhi kiunganishi pamoja na maana ya wakati.
- source_word: כִּתְבוּ לָכֶם
  choice: jiandikieni
  rationale: Kitenzi ni amri ya wingi, na לָכֶם ina maana ya kujifanyia. “Jiandikieni” linawasilisha yote mawili kwa Kiswahili cha kawaida bila kuongeza neno lisilokuwapo katika Kiebrania.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: wimbo huu
  rationale: שִׁירָה humaanisha kwa kawaida “wimbo”; hapa pia linataja utungo wa kishairi unaofuata.
- source_word: וְלַמְּדָהּ אֶת־בְּנֵי יִשְׂרָאֵל
  choice: nawe uwafundishe wana wa Israeli
  rationale: Amri hii ni ya umoja, tofauti na amri ya wingi iliyotangulia. “Nawe” linasaidia kuonyesha badiliko hilo kwa kawaida. Kiambishi cha kike katika Kiebrania kinarejelea “wimbo,” lakini Kiswahili huonyesha walengwa wa kufundishwa kwa “uwafundishe.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hili linahifadhi kwa karibu muundo wa Kiebrania, “wana wa Israeli,” huku tanbihi ikifafanua kwamba msemo huo unaitaja jamii ya Waisraeli.
- source_word: שִׂימָהּ בְּפִיהֶם
  choice: Uutie kinywani mwao
  rationale: Tafsiri hii inahifadhi taswira halisi ya Kiebrania ya kuweka wimbo “katika kinywa chao,” yaani waweze kuukariri, bila kufafanua maana hiyo kupita kiasi.
- source_word: לְמַעַן תִּהְיֶה לִּי
  choice: ili ... uwe ... kwa ajili yangu
  rationale: “Ili” linaonyesha kusudi, na “kwa ajili yangu” linahifadhi maana ya לִי bila kuifanya lazima kuwa kauli ya umiliki.
- source_word: לְעֵד
  choice: shahidi
  rationale: עֵד ni “shahidi”; taswira ya wimbo kama shahidi imehifadhiwa badala ya kubadilishwa kuwa dhana pana ya “ushahidi.”
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: dhidi ya wana wa Israeli
  rationale: Katika muktadha wa agano na hukumu, ב inaweza kuonyesha upande unaoshuhudiwa dhidi yake. Maana ya karibu zaidi ya mahali, “miongoni mwa,” imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Mabadiliko kutoka amri ya wingi kwenda amri ya umoja
  choice: jiandikieni ... nawe uwafundishe ... Uutie
  alternative: jiandikie ... uwafundishe ... uutie
  rationale: Kiebrania kina amri ya wingi katika כִּתְבוּ, kisha amri za umoja katika וְלַמְּדָהּ na שִׂימָהּ. Tafsiri inahifadhi badiliko hilo badala ya kulisawazisha kimyakimya.
- issue: Maana ya ב katika בִּבְנֵי יִשְׂרָאֵל
  choice: dhidi ya wana wa Israeli
  alternative: miongoni mwa wana wa Israeli
  rationale: Muktadha unaonyesha wimbo ukifanya kazi ya shahidi wa mashtaka wakati Israeli wanapovunja agano. Hata hivyo, kwa kuwa kihusishi kinaweza kueleweka kimahali, usomaji huo mbadala umetajwa katika tanbihi.
- issue: Utambulisho wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Muundo wa chanzo umehifadhiwa, lakini tanbihi inaweka wazi kwamba msemo huu ni jina la watu wa Israeli kwa ujumla na si lazima wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima lakini unaoeleweka kwa urahisi. Taswira ya “kuutia kinywani mwao” imehifadhiwa kwa sababu ni muhimu kwa wazo la kukariri na kutamka wimbo. Badiliko la idadi katika amri za Kiebrania limeonyeshwa wazi kwa “jiandikieni” kisha “nawe uwafundishe” na “Uutie.”
