  terminology: Istilahi kuu zimechaguliwa vizuri. “Kitabu hiki cha sheria” hutafsiri סֵפֶר הַתּוֹרָה kwa uwazi, huku tanbihi ikihifadhi maana mbadala ya “gombo.” “Shahidi” huhifadhi taswira ya kisheria ya עֵד; tanbihi inaeleza kwa kiasi kinachofaa nguvu ya ushahidi dhidi ya watu katika muktadha wa agano.
