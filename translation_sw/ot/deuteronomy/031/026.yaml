  text: לָקֹ֗חַ אֵ֣ת סֵ֤פֶר הַ/תּוֹרָה֙ הַ/זֶּ֔ה וְ/שַׂמְתֶּ֣ם אֹת֔/וֹ מִ/צַּ֛ד אֲר֥וֹן בְּרִית יְהוָ֖ה אֱלֹהֵי/כֶ֑ם וְ/הָֽיָה שָׁ֥ם בְּ/ךָ֖ לְ/עֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/026.yaml
  text: Take this Book of the Law and place it beside the ark of the covenant of Yahweh your God[b][a], and let it remain there as a witness against you.
translation:
  language: sw
  text: “Chukueni kitabu hiki cha sheria[a], mkiweke kando ya sanduku la agano la Yahweh, Mungu wenu. Kiwe hapo kama shahidi dhidi yenu.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “gombo hili la sheria.” Neno la Kiebrania linaweza kumaanisha gombo au hati iliyoandikwa.
    reason: lexical_alternative
  - marker: b
    text: Yaani, liwe ushahidi dhidi yenu ikiwa mtalivunja agano.
    reason: cultural_note
lexical_decisions:
- source_word: לָקֹחַ
  choice: Chukueni
  rationale: Kitenzi-jina cha Qal kimetumiwa kwa nguvu ya amri; wingi unafaa kwa muktadha wa maagizo kwa Walawi katika mstari uliotangulia.
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  choice: kitabu hiki cha sheria
  rationale: סֵפֶר ni hati iliyoandikwa, mara nyingi ikiwa gombo; תּוֹרָה hapa ni sheria au mafundisho ya agano. Tafsiri hii ni ya kawaida na inaeleweka, huku tanbihi ikihifadhi uwezekano wa ‘gombo.’
- source_word: וְשַׂמְתֶּם אֹתוֹ
  choice: mkiweke
  rationale: שׂוּם humaanisha kuweka kitu mahali fulani; muundo huu unaunganisha kwa kawaida amri ya kukichukua na kukiweka.
- source_word: מִצַּד
  choice: kando ya
  rationale: Kirai hiki huonyesha mahali pembeni mwa sanduku, si ndani yake.
- source_word: אֲרוֹן בְּרִית
  choice: sanduku la agano
  rationale: Huhifadhi uhusiano wa nomino katika Kiebrania na ni istilahi ya kawaida ya kibiblia katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Huhifadhi nafsi ya pili wingi katika fomula ya agano.
- source_word: וְהָיָה שָׁם
  choice: Kiwe hapo
  rationale: Hutoa kwa Kiswahili cha kawaida hali inayokusudiwa baada ya kukiweka, bila kuongeza wazo lisilokuwamo.
- source_word: לְעֵד בְּךָ
  choice: kama shahidi dhidi yenu
  rationale: Katika muktadha wa agano, עֵד ni shahidi na בְּךָ ina nguvu ya ushahidi unaowakabili au kuwashtaki watu. Kiswahili kinatumia wingi ili kupatana na wale wanaoagizwa na Israeli inayozungumziwa kwa pamoja.
theological_decisions:
- issue: Kazi ya ushahidi wa kitabu
  choice: Kitabu kinakuwa shahidi dhidi ya Israeli katika maana ya agano na hukumu.
  alternative: Kitabu ni ukumbusho tu au shahidi asiyeegemea upande wowote.
  rationale: Kirai לְעֵד בְּךָ pamoja na muktadha wa kuvunjwa kwa agano kinaonyesha ushahidi unaowakabili watu; tanbihi inaeleza maana hiyo bila kuingiza fundisho la dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kando ya’ huepuka wazo kwamba kitabu kiliwekwa ndani ya sanduku. Viwakilishi vya wingi vinafuata hadhira ya amri katika muktadha.
