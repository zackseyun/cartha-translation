  verdict: approve
  source_fidelity: 'Tafsiri inafuata maana ya Kiebrania kwa uaminifu: amri ya kuchukua kitabu, kukiweka pembeni ya sanduku la agano la Yahweh, na kusudi lake kuwa shahidi dhidi ya walengwa. “Kando ya” kwa מִצַּד huzuia kimakosa dhana ya kukiweka ndani ya sanduku. Wingi wa “Chukueni ... mkiweke” unaendana na amri kwa Walawi katika muktadha wa karibu, ingawa kiambishi cha Kiebrania katika mwisho wa mstari kinamwelekea Israeli kwa umoja wa kijamii; “dhidi yenu” ni uwakilishi unaokubalika wa hadhira hiyo.'
