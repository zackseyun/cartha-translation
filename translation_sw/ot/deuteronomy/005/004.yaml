  text: Yahweh spoke with you face to face on the mountain[a], from the midst of the fire.
translation:
  language: sw
  text: Yahwe alisema nanyi uso kwa uso mlimani[a], kutoka katikati ya moto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “uso kwa uso,” ni nahau ya kusema moja kwa moja; linganisha Kumbukumbu la Torati 4:12, ambapo Waisraeli walisikia sauti lakini hawakuona umbo lolote.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנִים בְּפָנִים
  choice: uso kwa uso
  rationale: Nahau ya Kiebrania imehifadhiwa kwa Kiswahili cha kawaida ili kuonyesha mawasiliano ya moja kwa moja na yenye uzito, bila kudai kwamba Waisraeli waliuona umbo wa Mungu.
- source_word: דִּבֶּר
  choice: alisema
  rationale: Kitenzi hiki humaanisha kusema au kunena; pamoja na עִמָּכֶם, kauli ya Kiswahili 'alisema nanyi' huakisi tendo la kusema na uhusiano wa moja kwa moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa umbo la Kiswahili 'Yahwe' badala ya kubadilishwa kuwa cheo kama 'BWANA'.
- source_word: עִמָּכֶם
  choice: nanyi
  rationale: Huhifadhi maana ya msingi ya 'pamoja nanyi/na ninyi' katika muundo wa asili wa Kiswahili, 'alisema nanyi.'
- source_word: בָּהָר
  choice: mlimani
  rationale: Kiambishi ב ni cha mahali hapa; 'mlimani' ni tafsiri ya asili na fupi inayofaa mazingira ya Sinai.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: kutoka katikati ya moto
  rationale: Huhifadhi umahususi wa מִתּוֹךְ, yaani kutoka ndani au katikati ya moto, pamoja na uzito wa tukio hilo.
theological_decisions:
- issue: Usemi wa kibinadamu 'uso kwa uso' sambamba na maelezo ya kujidhihirisha kwa Mungu huko Sinai
  choice: Kuhifadhi nahau 'uso kwa uso' kama maelezo ya Mungu kusema nao moja kwa moja.
  alternative: Kutafsiri kwa ufafanuzi zaidi kuwa 'moja kwa moja' au 'binafsi.'
  rationale: Muktadha wa Kumbukumbu la Torati 4:12, 15 unasema kwamba Israeli ilisikia sauti lakini haikuona umbo. Tafsiri inahifadhi nahau na mvutano wa maandishi bila kuifanya kuwa dai kwamba walimwona Mungu kwa macho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo 'alisema nanyi' ni wa kifasihi kwa kiasi lakini unaeleweka na unadumisha maana ya עִם; 'mlimani' hutoa usemi wa asili kuliko 'juu ya mlima.'
