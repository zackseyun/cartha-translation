  text: Yahweh our God made a covenant with us at Horeb[a].
translation:
  language: sw
  text: Yahwe Mungu wetu alifanya agano nasi huko Horebu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno, “alikata agano nasi huko Horebu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa na cheo kama “BWANA,” hivyo kuhifadhi jina la binafsi lililo katika maandishi ya Kiebrania.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Nomino pamoja na kiambishi cha nafsi ya kwanza wingi ina maana ya moja kwa moja ya “Mungu wetu” na inaonyesha uhusiano wa agano.
- source_word: כָּרַת
  choice: alifanya
  rationale: Ingawa kitenzi hiki kwa maana ya msingi ni “alikata,” katika kirai כָּרַת בְּרִית ni nahau ya kuanzisha au kufanya agano. “Alifanya” ni Kiswahili cha sasa na cha kawaida; taswira halisi imehifadhiwa katika tanbihi.
- source_word: בְּרִית
  choice: agano
  rationale: “Agano” ni istilahi ya kawaida ya Kiswahili inayohifadhi uzito wa uhusiano rasmi na wa kiagano, tofauti na neno jepesi zaidi kama “makubaliano.”
- source_word: עִמָּנוּ
  choice: nasi
  rationale: Huwakilisha kwa ufupi na kwa ufasaha maana ya “pamoja na sisi,” huku ikidumisha upande wa uhusiano katika kirai hicho.
- source_word: בְּחֹרֵב
  choice: huko Horebu
  rationale: “Huko” huonyesha mahali pa tukio kwa Kiswahili cha asili, na “Horebu” ni umbo lililozoeleka la jina חֹרֵב katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha na cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi imetumia nahau ya kawaida “alifanya agano,” huku maana halisi ya kitenzi cha Kiebrania ikihifadhiwa katika tanbihi.
