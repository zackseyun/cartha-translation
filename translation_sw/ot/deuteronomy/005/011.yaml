base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/011.yaml
  text: You shall not take the name of Yahweh your God in vain[b][a], for Yahweh will not leave unpunished the one who takes his name in vain.
translation:
  language: sw
  text: Usilitumie jina la Yahweh, Mungu wako, kwa ubatili[a], kwa maana Yahweh hatamwacha bila adhabu[b] mtu anayelitumia jina lake kwa ubatili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa uongo,” “isivyofaa,” au “bila maana.” Neno la Kiebrania linaweza kujumuisha matumizi ya jina la Yahweh kwa uongo au bila maana, si aina moja tu ya matumizi mabaya.
    reason: lexical_alternative
  - marker: b
    text: Au “hatamhesabu kuwa hana hatia” au “hatamwachilia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: litumie / anayelitumia
  rationale: Kitenzi hiki kina maana pana ya kuinua, kubeba, au kuchukua. Katika muundo huu unaohusu jina, “kutumia” ni Kiswahili cha kawaida kinachoeleza tendo linalokatazwa bila kulifungia kwenye kiapo cha uongo pekee.
- source_word: שֵׁם / שְׁמוֹ
  choice: jina / jina lake
  rationale: Huhifadhi neno la msingi la Kiebrania na rejeo lake kwa utambulisho na mamlaka ya Mungu bila kulifafanua kupita kiasi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huhifadhi usemi wa moja kwa moja wa agano kwa nafsi ya pili umoja.
- source_word: לַשָּׁוְא
  choice: kwa ubatili
  rationale: שָׁוְא inaweza kumaanisha ubatili, utupu, uongo, au jambo lisilo na thamani. “Kwa ubatili” huhifadhi upana huo kuliko tafsiri inayolenga kiapo cha uongo pekee.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu ya amri kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יְנַקֶּה (נקה)
  choice: hatamwacha bila adhabu
  rationale: Katika muktadha huu wa hukumu, kitenzi kinamaanisha kutomwondolea mtu hatia au matokeo yake. Usemi huu unaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: אֲשֶׁר
  choice: mtu anaye-
  rationale: Huwakilisha mhusika yeyote kwa ujumla bila kutumia muundo mzito au wa kizamani.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu YHWH
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko la Kiebrania linatumia jina יהוה moja kwa moja. “Yahweh” huhifadhi jina hilo la agano badala ya kulibadilisha kuwa cheo.
- issue: Upeo wa katazo
  choice: kutumia jina ... kwa ubatili
  alternative: kutumia jina ... kwa uongo; kulitaja jina ... isivyofaa
  rationale: Maneno ya Kiebrania yanaweza kujumuisha kiapo cha uongo, kulitaja jina bila maana, na matumizi mengine yasiyofaa. Tafsiri kuu na tanbihi huhifadhi upana huo bila kuchagua maana moja pekee.
- issue: Maana ya kutomwacha mkosaji bila hatia
  choice: hatamwacha bila adhabu
  alternative: hatamhesabu kuwa hana hatia; hatamwachilia
  rationale: Tafsiri iliyochaguliwa huonyesha uzito wa hukumu kwa lugha inayoeleweka, huku tanbihi ikihifadhi picha ya kisheria ya kutotangazwa kuwa bila hatia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaofaa kwa amri ya kisheria. “Kwa ubatili” limehifadhiwa ili kutobana maana ya Kiebrania; tanbihi inalifafanua kwa maneno yanayotumiwa zaidi katika mazungumzo ya sasa.
