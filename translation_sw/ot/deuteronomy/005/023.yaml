base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/023.yaml
  text: And when you heard the voice from the midst of the darkness[a], while the mountain was burning with fire, you came near to me—all the heads of your tribes and your elders—
translation:
  language: sw
  text: Ikawa mliposikia sauti kutoka katikati ya giza[a], huku mlima ukiwaka moto, mkanikaribia—wakuu wote wa makabila yenu na wazee wenu—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlio”; neno la Kiebrania linaweza kumaanisha sauti ya msemaji au mlio, lakini hapa “sauti” inafaa zaidi kwa sababu Mungu alikuwa akisema kutoka gizani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעֲכֶם
  choice: Ikawa mliposikia
  rationale: Muundo huu unaendeleza simulizi na kuonyesha wakati wa tukio kwa Kiswahili cha kibiblia kinachoeleweka, bila kuongeza maana mpya.
- source_word: הַקּוֹל
  choice: sauti
  rationale: Neno la Kiebrania qol linaweza kumaanisha sauti inayosikika au sauti ya msemaji; katika muktadha huu ni sauti ya Mungu akisema, huku neno la Kiswahili ‘sauti’ likihifadhi upana huo.
- source_word: מִתּוֹךְ הַחֹשֶׁךְ
  choice: kutoka katikati ya giza
  rationale: Huhifadhi taswira ya Kiebrania ya sauti kutoka ndani au katikati ya giza.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: huku mlima ukiwaka moto
  rationale: ‘Huku’ huonyesha hali iliyoendelea wakati watu waliposikia sauti; ‘ukiwaka moto’ ni usemi wa kawaida unaohifadhi picha ya moto.
- source_word: וַתִּקְרְבוּן אֵלַי
  choice: mkanikaribia
  rationale: Kitenzi hiki huonyesha mwendo wa kuwajia karibu na Musa na ni cha asili katika Kiswahili.
- source_word: כָּל רָאשֵׁי שִׁבְטֵיכֶם
  choice: wakuu wote wa makabila yenu
  rationale: ‘Wakuu’ huwasilisha maana ya viongozi au wawakilishi wakuu wa makabila bila kulazimisha sitiari ya ‘vichwa’ isiyo ya kawaida hapa katika Kiswahili.
- source_word: וְזִקְנֵיכֶם
  choice: na wazee wenu
  rationale: ‘Wazee’ ni istilahi ya kawaida kwa viongozi wa jamii wanaotambuliwa, si watu wenye umri mkubwa tu.
