base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/005.yaml
  text: I was standing between Yahweh and you at that time[a], to declare to you the word of Yahweh, because you were afraid because of the fire and did not go up the mountain, saying,
translation:
  language: sw
  text: 'Mimi nilikuwa nimesimama kati ya Yahweh nanyi wakati huo, ili kuwatangazia neno la Yahweh, kwa sababu mliogopa kwa sababu ya moto[a] na hamkupanda mlimani, kusema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kutoka mbele ya moto” au “kutoka uwepo wa moto,” nahau yenye maana ya “kwa sababu ya moto.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָ֠נֹכִי עֹמֵד
  choice: Mimi nilikuwa nimesimama
  rationale: Kiwakilishi huru kimehifadhiwa kwa mkazo, huku umbo la hali ya kuendelea likionyesha nafasi ya Musa kama mpatanishi wakati huo wa zamani.
- source_word: בֵּין יְהוָה וּבֵינֵיכֶם
  choice: kati ya Yahweh nanyi
  rationale: Huhifadhi muundo unaoonyesha Musa akiwa katikati ya pande mbili na kulitaja jina la agano יְהוָה moja kwa moja kama Yahweh.
- source_word: לְהַגִּיד לָכֶם
  choice: ili kuwatangazia
  rationale: Kitenzi cha Hiphil kina wazo la kufikisha au kutangaza ujumbe; ‘kuwatangazia’ ni cha asili na chenye hadhi katika muktadha huu.
- source_word: אֶת דְּבַר יְהוָה
  choice: neno la Yahweh
  rationale: ‘Neno’ huhifadhi usemi wa msingi wa Kiebrania na maana ya ujumbe au usemi wa Mungu katika muktadha.
- source_word: מִפְּנֵי הָאֵשׁ
  choice: kwa sababu ya moto
  rationale: Nahau hiyo inaonyesha moto kuwa sababu ya hofu; tafsiri hii ni wazi katika Kiswahili huku maana halisi ikielezwa katika tanbihi.
- source_word: וְלֹא עֲלִיתֶם בָּהָר
  choice: na hamkupanda mlimani
  rationale: Hutoa kwa kawaida tendo la kwenda juu kwenye mlima bila kuongeza maelezo yasiyokuwapo katika chanzo.
- source_word: לֵאמֹר
  choice: 'kusema:'
  rationale: Huhifadhi kiashiria cha Kiebrania kinachoingiza maneno yanayofuata bila kumtaja wazi msemaji na hivyo bila kuondoa utata wa kisarufi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina maalumu la Mungu. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Nafasi ya Musa kati ya Yahweh na watu
  choice: kati ya Yahweh nanyi
  alternative: mpatanishi kati ya Yahweh nanyi
  rationale: Tafsiri haiongezi nomino ya kitheolojia ‘mpatanishi,’ bali huhifadhi picha ya chanzo ya Musa kusimama kati ya pande hizo.
- issue: Mhusika wa לֵאמֹר
  choice: 'kusema:'
  alternative: 'Yahweh akasema:; nami nikasema:'
  rationale: Kiebrania hakimtaji mhusika wazi katika neno hili; umbo lisilomtaja mhusika linahifadhi mvutano huo na kuunganisha mstari na hotuba inayofuata.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi kwa wasomaji wa kawaida, huku jina Yahweh, picha ya Musa kusimama katikati, na utata wa kiashiria cha mwisho cha hotuba vikihifadhiwa.
