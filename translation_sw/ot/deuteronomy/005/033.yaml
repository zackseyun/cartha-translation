    issue: ‘mpate kufanikiwa’ kwa וְטוֹב לָכֶם
    rationale: ‘Kufanikiwa’ inaweza kuelekeza hasa kwenye mafanikio, ilhali Kiebrania husema kwa mapana kwamba mambo yatakuwa mema/heri kwao. ‘Iwe heri kwenu’ huhifadhi maana bila kuibana.
