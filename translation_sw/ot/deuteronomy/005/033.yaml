  text: בְּ/כָל הַ/דֶּ֗רֶךְ אֲשֶׁ֨ר צִוָּ֜ה יְהוָ֧ה אֱלֹהֵי/כֶ֛ם אֶתְ/כֶ֖ם תֵּלֵ֑כוּ לְמַ֤עַן תִּֽחְיוּ/ן֙ וְ/ט֣וֹב לָ/כֶ֔ם וְ/הַאֲרַכְתֶּ֣ם יָמִ֔ים בָּ/אָ֖רֶץ אֲשֶׁ֥ר תִּֽירָשֽׁוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/033.yaml
  text: You shall walk in all the way that Yahweh your God has commanded you[a], so that you may live, and that it may go well with you, and that you may prolong your days in the land that you will possess.
translation:
  language: sw
  text: Tembeeni katika njia yote ambayo Yahwe Mungu wenu amewaamuru, ili mpate kuishi, iwe heri kwenu, na mpate kuishi siku nyingi katika nchi mtakayoimiliki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtakayoirithi.” Kitenzi cha Kiebrania kinaweza kumaanisha kumiliki au kurithi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל הַדֶּרֶךְ
  choice: katika njia yote
  rationale: Inahifadhi umoja wa ‘njia’ na sitiari ya mwenendo wa maisha uliowekwa na Mungu, bila kuibadili kuwa ‘njia zote.’
- source_word: צִוָּה
  choice: amewaamuru
  rationale: Wakati timilifu wa Kiswahili unaonyesha amri iliyotolewa ambayo bado ina nguvu kwa wasikilizaji.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linawakilisha moja kwa moja jina la agano יהוה badala ya kulibadili kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Ni tafsiri ya kawaida na ya asili ya usemi wa agano unaomhusianisha Yahwe na Israeli.
- source_word: תֵּלֵכוּ
  choice: Tembeeni
  rationale: Inahifadhi sitiari ya Kiebrania ya kutembea kwa maana ya mwenendo na utiifu, huku ikitoa nguvu ya agizo kwa Kiswahili cha kawaida.
- source_word: לְמַעַן תִּחְיוּן
  choice: ili mpate kuishi
  rationale: Inaeleza kusudi au matokeo kwa uwazi na kuhifadhi maana ya msingi ya kuishi.
- source_word: וְטוֹב לָכֶם
  choice: mpate kufanikiwa
  rationale: Ni usemi wa asili unaowasilisha hali ya kuwa vyema; hapa kufanikiwa hakufungwi kwa utajiri pekee bali ustawi kwa maana pana.
- source_word: וְהַאֲרַכְתֶּם יָמִים
  choice: na kuishi siku nyingi
  rationale: Ni Kiswahili cha asili kwa nahau ya Kiebrania ya ‘kurefusha siku,’ na kinaeleza maisha marefu bila lugha ngumu.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: Ni usemi wa kawaida wa Kiswahili kwa lugha ya nchi ya agano.
- source_word: תִּירָשׁוּן
  choice: mtakayoimiliki
  rationale: Kitenzi ירשׁ hapa kinaashiria kupokea na kuikalia nchi; ‘kuimiliki’ huhifadhi maana hiyo halisi huku tanbihi ikitaja maana mbadala ya urithi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina la agano moja kwa moja; ‘Yahwe’ hulihifadhi kama jina bila kulibadili kuwa cheo.
- issue: Lugha ya kuipokea nchi
  choice: nchi mtakayoimiliki
  alternative: nchi mtakayoirithi
  rationale: ‘Kuimiliki’ inafaa kwa muktadha wa kuipokea na kuikalia nchi, lakini tanbihi inadumisha uwezekano halisi wa maana ya ‘kurithi.’
- issue: Uhusiano kati ya utiifu na baraka
  choice: ili mpate kuishi, mpate kufanikiwa, na kuishi siku nyingi
  alternative: ili muishi, iwe heri kwenu, na mrefushe siku
  rationale: Tafsiri inadumisha uhusiano wa kusudi au matokeo uliowekwa na לְמַעַן bila kuufafanua zaidi kitheolojia kuliko maandishi yenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Tembeeni katika njia’ inadumisha sitiari ya kimaadili ya Kiebrania; ‘kuishi siku nyingi’ ni nahau ya asili zaidi kuliko tafsiri sisisi ‘kurefusha siku.’ Alama ya tanbihi imewekwa baada ya neno linalohusika, ‘mtakayoimiliki.’
