  source_fidelity: 'Maana kuu imehifadhiwa: agizo la kufuata njia yote, Yahwe kama Mungu wa wasikilizaji, na matokeo ya uzima, heri, na siku nyingi katika nchi watakayoimiliki. Hata hivyo, וְטוֹב לָכֶם inahusu ‘iwe heri/vyema kwenu’ kwa upana, si hasa kufanikiwa; marekebisho yanarejesha upeo huo.'
  naturalness: ‘Tembeeni katika njia yote’ ni Kiswahili sanifu na huhifadhi sitiari ya Kiebrania. ‘Iwe heri kwenu’ ni ya asili, yenye heshima, na inalingana kwa karibu na usemi wa Kiebrania. Kurudia ‘mpate’ katika kiungo cha mwisho kunafanya ulinganifu wa matokeo uwe wazi na wa kawaida.
  terminology: ‘Yahwe Mungu wenu’ hudumisha jina la Mungu lililochaguliwa katika mradi. ‘Nchi mtakayoimiliki’ ni sahihi kwa ירשׁ katika muktadha huu; tanbihi yenye ‘mtakayoirithi’ ni mbadala halali na alama yake imefungwa kwa neno husika.
  issues:
