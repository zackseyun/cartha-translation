source:
  edition: WLC
  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַ/יֹּצִ֨אֲ/ךָ֜ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מִ/שָּׁ֔ם בְּ/יָ֥ד חֲזָקָ֖ה וּ/בִ/זְרֹ֣עַ נְטוּיָ֑ה עַל כֵּ֗ן צִוְּ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לַ/עֲשׂ֖וֹת אֶת י֥וֹם הַ/שַׁבָּֽת־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/015.yaml
  text: And remember that you were a servant in the land of Egypt[a], and Yahweh your God brought you out from there with a strong hand and an outstretched arm[b]; therefore Yahweh your God commanded you to observe the Sabbath day.
translation:
  language: sw
  text: Na kumbuka kwamba ulikuwa mtumwa katika nchi ya Misri, na Yahwe Mungu wako alikutoa huko kwa mkono wenye nguvu na kwa mkono ulionyoshwa[a]. Kwa hiyo, Yahwe Mungu wako alikuamuru kuitunza siku ya Sabato[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hutumia misemo “kwa mkono wenye nguvu” na “kwa mkono ulionyoshwa” kusisitiza nguvu ya Yahwe katika tendo lake la kukutoa.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kuifanya siku ya Sabato”; hapa usemi huo unamaanisha kuitunza au kuiadhimisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Nawe kumbuka
  rationale: Muundo huu unadumisha kiunganishi cha wazo lililotangulia pamoja na nguvu ya agizo la kukumbuka.
- source_word: עֶבֶד
  choice: mtumwa
  rationale: Katika muktadha wa utumwa wa Israeli nchini Misri, neno hili linaonyesha hali ya kufungwa na kunyimwa uhuru, si utumishi wa kawaida.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Tafsiri hii inahifadhi usemi halisi wa Kiebrania na ni Kiswahili cha kawaida.
- source_word: וַיֹּצִאֲךָ
  choice: alikutoa
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya kausativi ya יצא katika muktadha wa kutoka Misri.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano lililoandikwa kwa tetragramatoni linawakilishwa kama jina binafsi, kwa tahajia inayotumika katika Kiswahili.
- source_word: בְּיָד חֲזָקָה
  choice: kwa mkono wenye nguvu
  rationale: Inahifadhi sitiari ya Kiebrania ya mkono na kusisitiza nguvu ya tendo la Mungu la ukombozi.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: na kwa mkono ulionyoshwa
  rationale: Kiswahili hutumia 'mkono' kwa eneo pana linaloweza kujumuisha hand na arm; usemi huu unahifadhi taswira ya nguvu ya Mungu iliyodhihirishwa.
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Inaonyesha wazi hitimisho linalounganisha ukombozi kutoka utumwani na agizo la Sabato.
- source_word: לַעֲשׂוֹת אֶת יוֹם הַשַׁבָּת
  choice: kuitunza siku ya Sabato
  rationale: Ingawa Kiebrania kinasema kihalisi 'kuifanya siku ya Sabato,' maana ya usemi katika muktadha ni kuitii na kuiadhimisha ipasavyo; 'kuitunza' ni ya kawaida na yenye heshima.
theological_decisions:
- issue: Uwakilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu moja kwa moja; kulitafsiri 'Yahwe' kunahifadhi rejeo hilo la agano bila kulibadilisha kuwa cheo.
- issue: Hadhi iliyoelezwa na עֶבֶד nchini Misri
  choice: mtumwa
  alternative: mtumishi
  rationale: Hoja ya kifungu inategemea kukumbuka hali ya kufungwa na ukombozi kutoka Misri; 'mtumwa' inaonyesha uzito huo kuliko 'mtumishi.'
- issue: Maana ya לַעֲשׂוֹת kuhusu siku ya Sabato
  choice: kuitunza siku ya Sabato
  alternative: kuifanya siku ya Sabato
  rationale: Tafsiri ya neno kwa neno ingeweza kupotosha kwa Kiswahili. 'Kuitunza' huwasilisha wajibu wa kuishika au kuiadhimisha bila kuongeza masharti ya kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Umoja wa nafsi ya pili umehifadhiwa kama katika Kiebrania, ukimwelekea Israeli kwa pamoja. Taswira za mkono wenye nguvu na mkono ulionyoshwa zimehifadhiwa badala ya kufafanuliwa ndani ya matini.
