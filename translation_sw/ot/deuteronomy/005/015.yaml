review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Israel's former enslaved status in Egypt, Yahweh's deliverance, the paired imagery of a strong hand and an outstretched arm, and the resulting Sabbath command. However, the emphatic particle in “Nawe kumbuka” can mean “you too,” which is not expressed in the Hebrew; the simple linked imperative is preferable.
  naturalness: “Na kumbuka” is more natural and source-proportionate in this command context. The remaining wording is clear, dignified Standard East African Swahili.
  terminology: “Mtumwa,” “Yahwe,” “mkono wenye nguvu,” “mkono ulionyoshwa,” and “siku ya Sabato” are appropriate. “Kuitunza siku ya Sabato” suitably renders the idiomatic Hebrew infinitive without imposing a denominational interpretation.
  issues:
  - severity: low
    issue: “Nawe kumbuka” adds an unnecessary emphatic sense.
    rationale: Nawe commonly carries the sense “and you/you too.” The Hebrew conjunction simply links the command, so “Na kumbuka” better preserves its force without added emphasis.
  - severity: low
    issue: Footnote a says “nguvu kuu” and “kuwakomboa.”
    rationale: “Nguvu kuu” slightly intensifies the imagery, and the plural object shifts from the verse's singular addressee. A more direct explanation can retain the Hebrew imagery and singular address.
  revised_text: Na kumbuka kwamba ulikuwa mtumwa katika nchi ya Misri, na Yahwe Mungu wako alikutoa huko kwa mkono wenye nguvu na kwa mkono ulionyoshwa[a]. Kwa hiyo, Yahwe Mungu wako alikuamuru kuitunza siku ya Sabato[b].
  revised_footnotes:
  - marker: a
    text: Kiebrania hutumia misemo “kwa mkono wenye nguvu” na “kwa mkono ulionyoshwa” kusisitiza nguvu ya Yahwe katika tendo lake la kukutoa.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kuifanya siku ya Sabato”; hapa usemi huo unamaanisha kuitunza au kuiadhimisha.
    reason: lexical_alternative
  revision_rationale: The revision removes an added emphatic nuance in the opening command and makes footnote a more closely correspond to the verse's imagery and singular address. No other substantive change is needed.
