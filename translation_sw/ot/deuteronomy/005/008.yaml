source:
  edition: WLC
  text: לֹֽ֣א תַעֲשֶׂ֥ה לְ/ךָ֥ פֶ֨סֶל֙ כָּל תְּמוּנָ֔ה אֲשֶׁ֤ר בַּ/שָּׁמַ֨יִם֙ מִ/מַּ֔עַל וַ/אֲשֶׁ֥ר בָּ/אָ֖רֶץ מִ/תָּ֑חַת וַ/אֲשֶׁ֥ר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/008.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[b], or in the waters under the earth.
translation:
  language: sw
  text: Usijitengenezee sanamu ya kuchonga[a], wala mfano wa kitu chochote[b] kilicho juu mbinguni, au kilicho chini duniani, au kilicho majini chini ya dunia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sanamu”; neno la Kiebrania mara nyingi humaanisha sanamu inayotumiwa katika ibada ya sanamu, lakini hapa maana halisi ya kitu kilichochongwa imehifadhiwa.
    reason: lexical_alternative
  - marker: b
    text: Au “umbo lolote” au “sura yoyote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶסֶל
  choice: sanamu ya kuchongwa
  rationale: Neno hili linamaanisha sanamu iliyotengenezwa kwa kuchonga au kuhewa, mara nyingi katika muktadha wa ibada ya sanamu. Tafsiri hii inahifadhi maana halisi bila kuongeza moja kwa moja hitimisho la kwamba ni sanamu ya kuabudiwa.
- source_word: תְּמוּנָה
  choice: mfano
  rationale: Neno hili huonyesha umbo, sura, au kitu kinachofanana na kingine. “Mfano” ni neno la kawaida na pana linalofaa hapa.
- source_word: לֹא תַעֲשֶׂה לְךָ
  choice: Usijitengenezee
  rationale: Muundo huu unatoa katazo na pia unahifadhi wazo la לְךָ, yaani kujifanyia au kujitengenezea kitu kwa matumizi yako mwenyewe.
- source_word: כָּל תְּמוּנָה
  choice: mfano wowote
  rationale: Katika katazo, כָּל inaonyesha upeo unaojumuisha kila aina; Kiswahili cha kawaida hulieleza hilo kwa “wowote.”
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: wa kitu kilicho mbinguni juu
  rationale: Hii inahifadhi kishazi cha uhusiano na utofautishaji wa mahali pa juu, huku “mbinguni” ikiwa matumizi ya kawaida ya Kiswahili kwa שָׁמַיִם.
- source_word: בָּאָרֶץ מִתָּחַת
  choice: duniani chini
  rationale: “Duniani” ni usemi wa kawaida kwa vitu vilivyo katika eneo la dunia, na “chini” huhifadhi utofautishaji na “juu.”
- source_word: בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: majini chini ya dunia
  rationale: Tafsiri hii ni ya moja kwa moja na inahifadhi taswira ya maji yaliyo chini ya dunia bila kuifafanua upya kwa mtazamo wa kisasa.
theological_decisions:
- issue: Upeo wa katazo kuhusu sanamu na mifano
  choice: Kulifasiri kama katazo la kutengeneza sanamu ya kuchongwa au mfano, bila kuongeza hapa maneno kuhusu kuabudu.
  alternative: Kulieleza moja kwa moja kama katazo la kutengeneza sanamu kwa kusudi la kuziabudu.
  rationale: Mstari huu unakataza kutengeneza sanamu au mfano; katazo la kuisujudia na kuitumikia linaelezwa wazi katika mstari unaofuata. Kutoliongeza hapa kunahifadhi mwendelezo na mvutano wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “Usijitengenezee” ni wa asili na unahifadhi maana ya kujifanyia. “Sanamu ya kuchongwa” huepuka neno la kizamani na pia haiongezi mapema kusudi la ibada.
