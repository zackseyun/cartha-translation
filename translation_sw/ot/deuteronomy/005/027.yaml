  source_fidelity: 'Rasimu inafuata kwa ujumla muundo wa Kiebrania: msisitizo kwa Musa, kukaribia, kusikiliza, kuripoti kwa watu, kisha watu kusikia na kutenda. Hata hivyo, katika sehemu ya pili יְדַבֵּר ... אֵלֶיךָ ina maana ya “atasema nawe/kwako,” si “atakuambia,” ambayo kwa kawaida humaanisha kwamba BWANA anamwambia Musa jambo moja kwa moja. Marekebisho yanahifadhi hasa tendo la kusema kwa Mungu kuelekea Musa.'
