  yaml_path: translation/ot/deuteronomy/005/027.yaml
  text: You go near and hear all that the LORD our God says, and you shall tell us all that the LORD our God speaks to you; and we will hear and do it.
translation:
  language: sw
  text: Wewe karibia, usikilize yote atakayosema BWANA, Mungu wetu; kisha utuambie yote atakayosema nawe BWANA, Mungu wetu; nasi tutasikiliza na kuyatenda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְרַב אַתָּה
  choice: Wewe nenda karibu
  rationale: Amri hiyo inamwelekeza Musa mwenyewe asogee karibu na Mungu; kiwakilishi ‘Wewe’ kinahifadhi msisitizo wa Kiebrania.
- source_word: וּשֲׁמָע
  choice: ukasikilize
  rationale: Katika muktadha huu, שׁמע inamaanisha kusikia kwa makini ujumbe wa Mungu, hivyo ‘sikiliza’ ni ya kawaida na wazi.
- source_word: יְהוָה
  choice: BWANA
  rationale: Inafuata desturi iliyoenea katika Biblia za Kiswahili ya kuwakilisha jina la agano YHWH kwa ‘BWANA’ kwa herufi kubwa.
- source_word: תְּדַבֵּר אֵלֵינוּ
  choice: utuambie
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kumfikishia mtu ujumbe, bila kupoteza wazo la Musa kusema nao.
- source_word: וְשָׁמַעְנוּ וְעָשִׂינוּ
  choice: nasi tutasikiliza na kuyatenda
  rationale: ‘Kuyatenda’ linarejelea yote watakayoambiwa na kuhifadhi jozi ya kusikiliza na kutenda.
theological_decisions:
- issue: Musa kama mpatanishi wa ujumbe
  choice: Musa anaagizwa asogee karibu, asikilize, kisha awaambie watu
  alternative: Kufafanua kwamba Musa ni mpatanishi rasmi au wa kudumu
  rationale: Tafsiri inahifadhi kazi inayoonekana katika mstari huu bila kuingiza hitimisho pana la kimafundisho.
- issue: Maana ya kusikia na kutii
  choice: ‘tutasikiliza na kuyatenda’
  alternative: ‘tutatii’
  rationale: Kiebrania kinatumia vitenzi viwili tofauti, kusikia na kufanya; kuvihifadhi kunaendeleza msisitizo na mvutano wa usemi wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; hakuna tanbihi inayohitajika katika mstari huu.
