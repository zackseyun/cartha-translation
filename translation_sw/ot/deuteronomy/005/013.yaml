lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Kwa siku sita
  rationale: Muundo huu unaonyesha kwa Kiswahili muda wa siku sita kwa njia ya kawaida na wazi.
- source_word: תַּעֲבֹד
  choice: utafanya kazi
  rationale: Kitenzi עבד hapa kinamaanisha kufanya kazi ya kawaida; wakati ujao wa Kiswahili unaweza kuwa na nguvu ya maagizo katika muktadha huu wa sheria.
- source_word: וְעָשִׂיתָ
  choice: na kufanya
  rationale: Tafsiri hii inadumisha uratibu wa Kiebrania na maana pana ya kutekeleza mambo yanayopaswa kufanywa.
- source_word: כָּל
  choice: zote
  rationale: Neno hili linaonyesha ujumla wa shughuli zinazohusika.
- source_word: מְלַאכְתֶּךָ
  choice: shughuli zako
  rationale: מְלָאכָה hurejelea kazi, jukumu, au shughuli; ‘shughuli zako’ hutofautisha nomino hii na kitenzi kilichotafsiriwa ‘kufanya kazi’ bila kupoteza maana.
theological_decisions:
- issue: Nguvu ya maagizo ya vitenzi katika sheria ya Sabato
  choice: Kwa siku sita utafanya kazi na kufanya shughuli zako zote
  alternative: Kwa siku sita unaweza kufanya kazi na kufanya shughuli zako zote
  rationale: Vitenzi vya Kiebrania vinaweza kueleweka kama maagizo au ruhusa katika muktadha huu wa kisheria. Maandishi makuu yanadumisha nguvu ya maagizo, huku tanbihi ikihifadhi uwezekano wa maana ya ruhusa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kisheria umehifadhiwa bila kufanya sentensi iwe nzito.
