  text: שָׁמ֛וֹר אֶת י֥וֹם הַ/שַׁבָּ֖ת לְ/קַדְּשׁ֑/וֹ כַּ/אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/012.yaml
  text: Observe the Sabbath day[a], to keep it holy, as Yahweh your God commanded you.
translation:
  language: sw
  text: Izingatie siku ya Sabato[a] ili uitakase, kama Yahwe Mungu wako alivyokuamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ishike siku ya Sabato” au “Itunze siku ya Sabato.” Kitenzi cha Kiebrania kinakazia kuizingatia kwa uangalifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר
  choice: Shika
  rationale: Kitenzi hiki ni agizo la kuitunza au kuizingatia Sabato kwa uangalifu. “Shika” ni lugha ya kawaida na yenye hadhi kwa kutii amri, huku tanbihi ikihifadhi maana mbadala za kutunza na kuangalia kwa makini.
- source_word: יוֹם הַשַׁבָּת
  choice: siku ya Sabato
  rationale: Hili ni tamko la kawaida na wazi la Kiswahili kwa siku maalumu ya pumziko inayotajwa hapa.
- source_word: לְקַדְּשׁוֹ
  choice: ili kuitakasa
  rationale: Kiambishi לְ kinaonyesha kusudi, na kitenzi kinaeleza kuitenga siku hiyo kuwa takatifu. “Kuitakasa” kinahifadhi maana hiyo kwa ufupi bila kudai kwamba siku hiyo haikuwa na utakatifu wowote kabla ya tendo hili.
- source_word: כַּאֲשֶׁר
  choice: kama
  rationale: “Kama” linaonyesha kwa kawaida kwamba agizo hili linapaswa kutekelezwa kulingana na amri ya Mungu iliyotangulia.
- source_word: צִוְּךָ
  choice: alivyokuamuru
  rationale: Kitenzi צוה kinaonyesha amri yenye mamlaka; muundo huu wa Kiswahili unaungana kwa kawaida na “kama” na kuhifadhi nafsi ya pili umoja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Hili linahifadhi jina la cheo la Mungu pamoja na kiambishi cha nafsi ya pili umoja.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova au BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja. “Yahwe” huhifadhi jina hilo kwa umbo linalofaa matamshi na tahajia ya Kiswahili, bila kulibadilisha kuwa cheo.
- issue: Maana ya kuitakasa Sabato
  choice: ili kuitakasa
  alternative: ili kuifanya kuwa takatifu
  rationale: “Kuitakasa” huonyesha kuitenga na kuitendea siku hiyo kama takatifu, bila kuamua kimyakimya kwamba wanadamu ndio wanaoipa utakatifu wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye hadhi. Muundo wa agizo ni mfupi na wa moja kwa moja; “Sabato” ni istilahi iliyozoeleka katika tafsiri za Biblia za Kiswahili.
