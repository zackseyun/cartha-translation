base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/003.yaml
  text: It was not with our fathers that Yahweh made this covenant[a], but with us—with us[c][b] who are all here alive today.
translation:
  language: sw
  text: Yahwe hakufanya agano hili[b] na baba zetu[a], bali na sisi—sisi hawa[c] tulio hapa leo, sote tukiwa hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mababu zetu.” Kiebrania kinasema kihalisi “baba zetu.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “alikata agano hili.”
    reason: lexical_alternative
  - marker: c
    text: 'Wengine wanauelewa utofautishaji huu kwa njia ya balagha: si pamoja na baba zetu tu, bali hasa pamoja nasi tulio hapa leo tukiwa hai.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּרַת ... אֶת הַבְּרִית
  choice: alifanya agano hili
  rationale: Nahau ya Kiebrania ina maana halisi ya ‘alikata agano,’ lakini Kiswahili cha kawaida husema ‘kufanya agano.’ Neno ‘hili’ linahifadhi kiashiria הַזֹּאת.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama ‘BWANA.’
- source_word: אֲבֹתֵינוּ
  choice: baba zetu
  rationale: Hili linafuata neno la Kiebrania kwa karibu; katika muktadha linaweza pia kumaanisha mababu au wahenga.
- source_word: כִּי
  choice: bali
  rationale: Baada ya ukanushi, כִּי linaanzisha utofautishaji; ‘bali’ ni kauli ya asili na yenye hadhi katika Kiswahili.
- source_word: אִתָּנוּ
  choice: na sisi
  rationale: Kirai hiki kinataja wale ambao Yahwe alifanya agano pamoja nao.
- source_word: אֲנַחְנוּ אֵלֶּה
  choice: sisi wenyewe
  rationale: Muundo wa Kiebrania una mkazo wa kiambatisho, ‘na sisi, sisi hawa.’ ‘Sisi wenyewe’ huhifadhi mkazo huo kwa Kiswahili cha kawaida bila kuufanya mstari kuwa mgumu.
- source_word: פֹה הַיּוֹם
  choice: tulio hapa leo
  rationale: Maneno ‘hapa’ na ‘leo’ yote yamehifadhiwa wazi.
- source_word: כֻּלָּנוּ חַיִּים
  choice: sote tukiwa hai
  rationale: Tafsiri hii huhifadhi jumla ya kundi lote na hali yao ya kuwa hai, huku ikisomeka kwa urahisi katika Kiswahili.
theological_decisions:
- issue: Je, mstari unakana kabisa kwamba agano lilihusiana na baba zao, au unasisitiza hasa matumizi yake kwa kizazi kilichokuwapo?
  choice: 'Matini kuu inahifadhi utofautishaji wa moja kwa moja: si na baba zetu, bali na sisi tulio hapa leo.'
  alternative: Wengine huelewa maana kuwa ‘si na baba zetu tu,’ yaani kuwa ni msisitizo wa ushiriki wa kizazi cha sasa wala si kuwatenga baba zao kabisa.
  rationale: Kiebrania hakina neno ‘tu.’ Kwa hiyo, kuongeza neno hilo katika matini kuu kungesuluhisha mvutano wa kitheolojia ambao matini yenyewe imeuacha wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa sentensi umefanywa wa asili kwa Kiswahili, huku mkazo wa אֲנַחְנוּ אֵלֶּה ukihifadhiwa kwa ‘sisi wenyewe’ na mvutano wa utofautishaji ukiachwa bila kuongezewa ‘tu.’
