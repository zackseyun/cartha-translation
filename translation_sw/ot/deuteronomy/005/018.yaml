lexical_decisions:
- source_word: וְ/לֹא
  choice: Wala ... -si-
  rationale: Kiunganishi וְ pamoja na kikanushi לֹא kinaunganisha amri hii na amri zinazozunguka. “Wala” linaonyesha mwendelezo huo kwa Kiswahili cha kawaida, huku kiambishi hasi “-si-” katika “usizini” kikitoa katazo la moja kwa moja.
- source_word: תִּנְאָף
  choice: usizini
  rationale: Kitenzi נאף katika Qal, nafsi ya pili umoja wa kiume, hapa ni katazo. “Kuzini” ndilo neno la kawaida na sahihi kwa tendo la kuvunja uaminifu wa ndoa kwa ngono; umbo “usizini” linahifadhi usemi wa moja kwa moja kwa mtu mmoja.
theological_decisions:
- issue: Kuwasilisha katazo la nafsi ya pili umoja katika sheria ya agano
  choice: Wala usizini.
  alternative: Usizini.
  rationale: “Usizini” linahifadhi katazo la moja kwa moja kwa nafsi ya pili umoja. “Wala” limehifadhiwa kwa sababu Kiebrania kina kiunganishi kinachoiweka amri hii katika mfululizo wa amri, bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha fupi, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. “Wala usizini” linaakisi mtindo wa mfululizo wa makatazo huku likibaki la asili katika Kiswahili.
