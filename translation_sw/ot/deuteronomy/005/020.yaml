translation:
  language: sw
  text: Usitoe ushahidi wa uongo dhidi ya jirani yako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usiwe shahidi wa uongo dhidi ya jirani yako.”
