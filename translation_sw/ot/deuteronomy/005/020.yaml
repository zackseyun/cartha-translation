lexical_decisions:
- source_word: לֹא
  choice: Usi-
  rationale: Kikanushi cha katazo kimeunganishwa na kitenzi katika hali ya kukataza, kama ilivyo kawaida katika Kiswahili.
- source_word: תַעֲנֶה
  choice: -shuhudie
  rationale: Ingawa ענה kwa kawaida inaweza kumaanisha ‘jibu,’ katika muktadha wa kisheria pamoja na עֵד humaanisha kutoa ushahidi; ‘shuhudie’ ni usemi wa asili na wazi wa Kiswahili.
- source_word: בְרֵעֲךָ
  choice: jirani yako
  rationale: רֵעַ inaweza kumaanisha jirani, mwenzako, au rafiki. ‘Jirani yako’ ni ya kawaida na huhifadhi mtazamo mpana wa mtu mwingine katika jamii; uhusiano wa בְ na kitenzi umeonyeshwa kwa muundo wa Kiswahili ‘kumshuhudia mtu.’
- source_word: עֵד
  choice: ushahidi (umeelezwa ndani ya kitenzi ‘shuhudie’)
  rationale: Katika muundo wa Kiebrania עֵד huunda usemi wa kisheria pamoja na ענה. Kiswahili cha kawaida huwasilisha dhana hiyo kwa kitenzi ‘shuhudia,’ bila kulazimisha nomino tofauti.
- source_word: שָׁוְא
  choice: uongo
  rationale: Neno hilo linaweza kumaanisha uongo, ubatili, au udanganyifu; katika muktadha wa ushahidi wa kisheria, ‘uongo’ ndilo chaguo sahihi na la kawaida.
