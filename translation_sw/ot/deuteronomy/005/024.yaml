base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/024.yaml
  text: And you said, ‘Look, the LORD our God has shown us his glory and his greatness, and we have heard his voice from the midst of the fire. This day we have seen that God may speak with man, and he still lives.’
translation:
  language: sw
  text: Nanyi mkasema, “Tazama, BWANA[a] Mungu wetu ametuonyesha utukufu wake na ukuu wake, nasi tumeisikia sauti yake kutoka katikati ya moto. Leo hii tumeona kwamba Mungu anaweza kusema na mwanadamu, naye mwanadamu akaendelea kuwa hai.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH, jina la Mungu.'
    reason: Kubainisha jina la agano lililo nyuma ya tafsiri ya kawaida “BWANA”.
  - marker: b
    text: 'Kiebrania kwa karibu: “Mungu asema na mwanadamu, naye akaishi.” Kitenzi “asema” kinaweza pia kueleweka kimuktadha kuwa “anaweza kusema.”'
    reason: Kuonyesha muundo mfupi wa Kiebrania na uwezekano wa kuelewa umbo la kitenzi, bila kudai kwamba maana ya mazoea ndiyo pekee.
lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Huonyesha mshangao na kuvuta fikira kwa namna ya asili na yenye hadhi katika Kiswahili.
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea ya tafsiri za Biblia za Kiswahili ya kuwakilisha jina la Mungu YHWH kwa BWANA, huku tanbihi ikibainisha jina la Kiebrania.
- source_word: כְּבֹדוֹ וְאֶת־גָּדְלוֹ
  choice: utukufu wake na ukuu wake
  rationale: Huhifadhi istilahi mbili tofauti za Kiebrania na mpangilio wake.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: kutoka katikati ya moto
  rationale: Ni uwasilishaji wa moja kwa moja na wa kawaida wa mahali sauti ilikotoka.
- source_word: יְדַבֵּר אֱלֹהִים אֶת־הָאָדָם
  choice: Mungu anaweza kusema na mwanadamu
  rationale: Katika muktadha huu kauli inaeleza uwezekano uliothibitishwa na tukio, si tu tendo la kawaida; “mwanadamu” huhifadhi maana ya jumla ya הָאָדָם.
- source_word: וָחָי
  choice: naye mwanadamu akaendelea kuwa hai
  rationale: 'Hutoa wazi maana inayokusudiwa katika muktadha: mtu aliyesikia sauti ya Mungu hakufa, bali alibaki hai.'
theological_decisions:
- issue: Je, יְדַבֵּר inapaswa kutafsiriwa kama tendo la kawaida au uwezekano?
  choice: Mungu anaweza kusema
  alternative: Mungu husema / Mungu amesema
  rationale: Muktadha unasisitiza ugunduzi kwamba Mungu anaweza kusema na mwanadamu bila mwanadamu kufa; tafsiri hii haidai kwamba tendo hilo ni la kawaida.
- issue: Kiima kisichotajwa wazi cha וָחָי
  choice: mwanadamu akaendelea kuwa hai
  alternative: naye akaendelea kuwa hai
  rationale: Ingawa Kiebrania hakirudii nomino, muktadha unaonyesha kuwa anayebaki hai ni mwanadamu, si Mungu. Ufafanuzi huu huepusha utata usio wa maana katika Kiswahili, huku tanbihi ikionyesha muundo halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Nanyi mkasema” kinaendeleza hotuba ya Musa kwa watu wengi; “tumeisikia” na “leo hii” ni miundo ya kawaida ya simulizi la kibiblia bila kuwa ya kizamani kupita kiasi.
