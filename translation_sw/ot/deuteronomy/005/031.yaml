  text: וְ/אַתָּ֗ה פֹּה֮ עֲמֹ֣ד עִמָּדִ/י֒ וַ/אֲדַבְּרָ֣ה אֵלֶ֗י/ךָ אֵ֧ת כָּל הַ/מִּצְוָ֛ה וְ/הַ/חֻקִּ֥ים וְ/הַ/מִּשְׁפָּטִ֖ים אֲשֶׁ֣ר תְּלַמְּדֵ֑/ם וְ/עָשׂ֣וּ בָ/אָ֔רֶץ אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לָ/הֶ֖ם לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/031.yaml
  text: But you[a], stand here with me, and I will speak to you all the commandment and the statutes and the judgments that you shall teach them[b], so that they may do them in the land that I am giving them to possess.
translation:
  language: sw
  text: Lakini wewe, simama hapa pamoja nami, nami nitasema nawe amri yote[a], kanuni na hukumu ambazo utawafundisha, ili wazitekeleze katika nchi ninayowapa kuimiliki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amri nzima.” Kiebrania kinatumia nomino ya umoja hapa, ikifuatiwa na maneno ya wingi “kanuni” na “hukumu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wairithi” au “waitwae kuwa milki yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֹּה עֲמֹד עִמָּדִי
  choice: simama hapa pamoja nami
  rationale: Neno עָמַד kimsingi linamaanisha ‘kusimama.’ Tafsiri hii inadumisha picha halisi na uzito wa agizo kwa Musa, huku ‘pamoja nami’ ikionyesha wazi עִמָּדִי.
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: nami nitakuambia
  rationale: Muundo wa cohortative baada ya agizo una maana ya kitendo kinachofuata kwa kusudi. Katika Kiswahili, ‘nitakuambia’ huunganika kwa kawaida na yaliyomo katika usemi unaofuata.
- source_word: אֵת כָּל הַמִּצְוָה
  choice: amri yote
  rationale: מִצְוָה ni umoja na כָּל inaonyesha ukamilifu. ‘Amri yote’ huhifadhi umoja huo wenye maana ya kijumla bila kuugeuza kuwa wingi.
- source_word: הַחֻקִּים
  choice: masharti
  rationale: ‘Masharti’ ni neno la kawaida na lenye heshima kwa maagizo yaliyowekwa katika muktadha wa agano, na linatofautishwa na ‘hukumu.’
- source_word: הַמִּשְׁפָּטִים
  choice: hukumu
  rationale: מִשְׁפָּטִים huhusu maamuzi au kanuni za kisheria. ‘Hukumu’ hudumisha uhusiano wake na haki na uamuzi wa kisheria.
- source_word: אֲשֶׁר תְּלַמְּדֵם
  choice: ambazo utawafundisha
  rationale: Kitenzi hiki kinampa Musa wajibu wa kuwafundisha watu hayo maagizo; wakati ujao wa Kiswahili unaonyesha agizo na kitendo kinachotarajiwa.
- source_word: וְעָשׂוּ
  choice: ili wazitekeleze
  rationale: ‘Ili’ huonyesha uhusiano wa kusudi kati ya kufundishwa na kutenda, na ‘kutekeleza’ ni Kiswahili cha kawaida kwa kuzishika amri kwa vitendo.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: ninayowapa
  rationale: Kitenzi cha Kiebrania ni participle kinachoonyesha utoaji unaoendelea au ulio karibu; ‘ninayowapa’ hudumisha hali hiyo ya sasa.
- source_word: לְרִשְׁתָּהּ
  choice: waimiliki
  rationale: יָרַשׁ katika muktadha wa nchi inaweza kumaanisha kurithi, kumiliki, au kutwaa milki. ‘Waimiliki’ ni fupi na ya kawaida, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
theological_decisions:
- issue: Utatu wa istilahi za kisheria מִצְוָה / חֻקִּים / מִשְׁפָּטִים
  choice: 'Kudumisha istilahi tofauti: ‘amri,’ ‘masharti,’ na ‘hukumu.’'
  alternative: Kuzijumlisha kuwa ‘sheria na kanuni.’
  rationale: Kutenganisha istilahi hizi kunahifadhi muundo na utofauti wa mafundisho ya agano bila kuzifanya zote kuwa dhana moja ya jumla.
- issue: Umoja wa מִצְוָה
  choice: Kutumia umoja ‘amri yote.’
  alternative: Kutumia wingi ‘amri zote’ au neno la jumla ‘sheria yote.’
  rationale: Chanzo kina nomino ya umoja, ambayo huenda imetumiwa kijumla. Kudumisha umoja kunahifadhi mvutano huo wa kimaana bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo ni wa karibu na chanzo lakini umetiririshwa kwa matumizi ya kawaida ya Kiswahili. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
