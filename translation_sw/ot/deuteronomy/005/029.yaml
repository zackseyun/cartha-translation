base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/029.yaml
  text: Oh[a], that they had such a heart as this always—to fear me and to keep all my commandments all their days—so that it might go well with them and with their children forever!
translation:
  language: sw
  text: Laiti[a] wangekuwa na moyo wa namna hii daima—wa kuniogopa na kushika amri zangu zote siku zao zote—ili mambo yawaendee mema wao na watoto wao milele!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Laiti wangekuwa daima na moyo kama huu.” Kiebrania huanza kwa nahau ya tamanio, ambayo kwa neno halisi ni, “Ni nani atakayetoa...?”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Laiti
  rationale: Nahau hii ya Kiebrania, kwa neno halisi ‘Ni nani atakayetoa?’, inaonyesha tamanio kubwa; ‘Laiti’ ni Kiswahili cha kawaida kinachohifadhi nguvu hiyo bila kuifanya kuwa swali halisi.
- source_word: וְהָיָה ... לְבָבָם זֶה לָהֶם
  choice: wangekuwa na moyo wa namna hii
  rationale: Muundo wa tamanio umeelezwa kwa Kiswahili cha kawaida, huku ‘moyo’ ukihifadhi maana ya ndani ya nia, fikira, na mwelekeo wa maadili.
- source_word: לְיִרְאָה אֹתִי
  choice: wa kuniogopa
  rationale: ‘Kuniogopa’ huhifadhi istilahi ya agano inayojumuisha hofu yenye uchaji na utiifu, bila kuipunguza kuwa heshima pekee.
- source_word: וְלִשְׁמֹר אֶת כָּל מִצְוֺתַי
  choice: na kushika amri zangu zote
  rationale: ‘Kushika amri’ ni usemi wa kawaida wa kibiblia unaomaanisha kuzitii na kuzifuata.
- source_word: כָּל הַיָּמִים
  choice: siku zao zote
  rationale: Tafsiri hii ni ya karibu na chanzo na inaonyesha muda wote wa maisha yao.
- source_word: לְמַעַן יִיטַב לָהֶם
  choice: ili ... wapate kufanikiwa
  rationale: ‘Ili’ huonyesha kusudi au matokeo; ‘wapate kufanikiwa’ hapa humaanisha hali kuwa njema kwao chini ya baraka za Mungu, si lazima utajiri wa mali pekee.
- source_word: וְלִבְנֵיהֶם
  choice: wao na watoto wao
  rationale: Katika muktadha huu בנים inawahusu watoto au wazao kwa ujumla, wala si wana wa kiume pekee.
- source_word: לְעֹלָם
  choice: milele
  rationale: Neno hili linahifadhi upeo wa kudumu wa ustawi unaotajwa kwa watu na watoto wao.
theological_decisions:
- issue: Lugha ya kiantropolojia ya לְבָבָם
  choice: moyo
  alternative: akili; utu wao wa ndani
  rationale: ‘Moyo’ huhifadhi taswira ya kibiblia ya kitovu cha nia, mawazo, na mwelekeo wa kiroho na kimaadili, badala ya kuifanya kuwa utambuzi wa akili tu.
- issue: Maana ya לְיִרְאָה אֹתִי
  choice: kuniogopa
  alternative: kunicha; kuniheshimu kwa uchaji
  rationale: ‘Kuogopa’ huhifadhi mvutano wa istilahi ya chanzo, ambayo ina hofu, uchaji, na utiifu wa agano; mbadala unaweza kudhoofisha sehemu ya maana hiyo.
- issue: Upeo wa וְלִבְנֵיהֶם
  choice: watoto wao
  alternative: wana wao; wazao wao
  rationale: Ingawa umbo la Kiebrania ni la kiume kisarufi, hapa linarejelea watoto au vizazi vinavyofuata kwa ujumla.
- issue: Maana ya ustawi katika יִיטַב לָהֶם
  choice: wapate kufanikiwa
  alternative: mambo yawaendee mema; wapate kuwa na hali njema
  rationale: Usemi unaeleza ustawi mpana unaotokana na baraka za agano, bila kuufanya kuwa ahadi ya mali pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mistari mirefu imegawanywa kwa vistari ili kuonyesha kwamba kumwogopa Mungu na kushika amri zake ndilo jambo linaloutambulisha moyo unaotamaniwa. Alama ya tanbihi imewekwa mwisho wa aya ili isikatize mshangao wa mwanzo.
