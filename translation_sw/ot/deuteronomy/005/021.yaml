  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לֹ֥א תַחְמֹ֖ד אֵ֣שֶׁת רֵעֶ֑/ךָ וְ/לֹ֨א תִתְאַוֶּ֜ה בֵּ֣ית רֵעֶ֗/ךָ שָׂדֵ֜/הוּ וְ/עַבְדּ֤/וֹ וַ/אֲמָת/וֹ֙ שׁוֹר֣/וֹ וַ/חֲמֹר֔/וֹ וְ/כֹ֖ל אֲשֶׁ֥ר לְ/רֵעֶֽ/ךָס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/021.yaml
  text: And you shall not covet your neighbor’s wife[a], and you shall not desire your neighbor’s house, his field, his male servant, his female servant, his ox, his donkey[b], or anything that belongs to your neighbor.
translation:
  language: sw
  text: Usimtamani mke wa jirani yako[a], wala usiwe na tamaa ya nyumba ya jirani yako[b], shamba lake, mtumwa wake wa kiume, mtumwa wake wa kike, ng’ombe wake, punda wake, au kitu chochote kilicho cha jirani yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinatumia hapa kitenzi חמד, kinachoonyesha kutamani isivyofaa kitu kilicho cha mwingine.
    reason: lexical_clarification
  - marker: b
    text: Neno “nyumba” linaweza pia kumaanisha kaya au mali ya familia; hata hivyo, orodha ya mali inayofuata inaunga mkono maana ya nyumba kama mali hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחְמֹד
  choice: usimtamani
  rationale: Kitenzi “kutamani” ni cha kawaida na chenye uzito wa kimaadili katika Kiswahili; hapa kinaonyesha tamaa isiyofaa kwa kitu kilicho cha mwingine.
- source_word: אֵשֶׁת רֵעֶךָ
  choice: mke wa jirani yako
  rationale: Hili ni tamko la kawaida na wazi la uhusiano wa umiliki unaoonyeshwa na muundo wa Kiebrania.
- source_word: תִתְאַוֶּה
  choice: usiwe na tamaa ya
  rationale: Muundo huu unatofautisha kitenzi hiki na חמד bila kudai kwamba maana zake hazigusani; pia unadumisha nguvu hasi ya amri katika Kiswahili.
- source_word: בֵּית רֵעֶךָ
  choice: nyumba ya jirani yako
  rationale: בַּיִת inaweza kumaanisha nyumba, kaya, au mali ya familia; orodha inayofuata inaelekeza zaidi kwenye nyumba kama mali.
- source_word: שָׂדֵהוּ
  choice: shamba lake
  rationale: “Shamba” ni tafsiri ya kawaida ya שָׂדֶה na inawakilisha wazi kipengele hiki cha orodha.
- source_word: עַבְדּוֹ
  choice: mtumwa wake wa kiume
  rationale: Muktadha wa mali ya kaya unaonyesha hadhi ya utumwa, na “wa kiume” inadumisha utofauti wa kijinsia na neno linalofuata.
- source_word: אֲמָתוֹ
  choice: mtumwa wake wa kike
  rationale: Neno אָמָה humaanisha mtumwa wa kike; tafsiri hii inaweka wazi hadhi na jinsia bila kutumia lugha ya kizamani.
- source_word: שׁוֹרוֹ
  choice: ng’ombe wake
  rationale: שׁוֹר humaanisha mnyama wa jamii ya ng’ombe, mara nyingi ng’ombe wa kazi; “ng’ombe” ni neno la asili na linaloeleweka kwa upana katika Kiswahili cha Afrika Mashariki.
- source_word: חֲמֹרוֹ
  choice: punda wake
  rationale: “Punda” ndiyo tafsiri ya kawaida na ya sasa ya חֲמוֹר.
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: au kitu chochote kilicho cha jirani yako
  rationale: Hii inatoa hitimisho jumuishi la katazo na kueleza kwa Kiswahili cha kawaida nguvu ya umilikaji ya לְ.
- source_word: רֵעֶךָ
  choice: jirani yako
  rationale: “Jirani” ni neno lililozoeleka katika lugha ya maadili ya kibiblia kwa רֵעַ na linabaki wazi kwa msomaji wa sasa.
theological_decisions:
- issue: Kutofautisha vitenzi viwili vya katazo
  choice: Kutafsiri חמד kwa “kutamani” na אוה kwa “kuwa na tamaa ya”
  alternative: Kutumia “kutamani” kwa vitenzi vyote viwili
  rationale: Kiebrania kimetumia vitenzi viwili vinavyokaribiana lakini si sawa kabisa. Miundo miwili ya Kiswahili inadumisha tofauti hiyo bila kuifanya kuwa tofauti kubwa kuliko ilivyo.
- issue: Kutafsiri istilahi za utumwa
  choice: Kutumia “mtumwa wa kiume” na “mtumwa wa kike”
  alternative: Kutumia “mtumishi wa kiume” na “mtumishi wa kike”
  rationale: Katika orodha hii ya mali za kaya, hadhi ya watu hao kuwa watumwa ni muhimu. Tafsiri ya “mtumwa” haiufichi uhalisi huo wa kijamii na kisheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa moja kwa moja, wenye heshima, na unaofaa amri ya kisheria. Miundo miwili tofauti ya kutamani imetumiwa ili kuhifadhi utofauti wa vitenzi vya Kiebrania, huku maneno ya utumwa yakitafsiriwa wazi badala ya kufichwa kwa “watumishi”.
