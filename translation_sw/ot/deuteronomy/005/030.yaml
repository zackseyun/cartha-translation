  language: sw
  text: Nenda ukawaambie, ‘Rudini kwenye mahema yenu.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ
  choice: Nenda
  rationale: Amri ya moja kwa moja ya kuondoka ili kufikisha ujumbe; “Nenda” ni tafsiri ya kawaida na ya asili.
- source_word: אֱמֹר לָהֶם
  choice: ukawaambie
  rationale: Muundo huu wa Kiswahili unaunganisha kwa kawaida amri ya kwenda na kusudi la kuwaambia watu ujumbe, bila kuongeza maana nyingine.
- source_word: שׁוּבוּ
  choice: Rudini
  rationale: Amri ya wingi inayoelekeza watu warudi mahali walipokuwa; “Rudini” huhifadhi maana ya mwelekeo kwa ufupi.
- source_word: לָכֶם
  choice: kwenye ... yenu
  rationale: Kihusishi chenye kiambishi cha nafsi ya pili wingi kinaonyesha kurudi mahali pao wenyewe; Kiswahili hueleza hilo kwa umilikaji “yenu.”
- source_word: לְאָהֳלֵיכֶם
  choice: mahema yenu
  rationale: Tafsiri halisi ya mahali pao pa kukaa, ikihifadhi mazingira halisi ya kihistoria badala ya kutumia neno pana kama “nyumbani.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Hakuna tanbihi iliyohitajika kwa kuwa tofauti ya Kiingereza kati ya “Go” na “Go back” haitokani na utata muhimu katika maandishi ya Kiebrania hapa; שׁוּבוּ ndiyo yenye maana ya kurudi.
