source:
  edition: WLC
  text: וְ/י֨וֹם֙ הַ/שְּׁבִיעִ֔י שַׁבָּ֖ת לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹ֣א תַעֲשֶׂ֣ה כָל מְלָאכָ֡ה אַתָּ֣ה וּ/בִנְ/ךָֽ וּ/בִתֶּ֣/ךָ וְ/עַבְדְּ/ךָֽ וַ֠/אֲמָתֶ/ךָ וְ/שׁוֹרְ/ךָ֨ וַ/חֲמֹֽרְ/ךָ֜ וְ/כָל בְּהֶמְתֶּ֗/ךָ וְ/גֵֽרְ/ךָ֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ לְמַ֗עַן יָנ֛וּחַ עַבְדְּ/ךָ֥ וַ/אֲמָתְ/ךָ֖ כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/014.yaml
  text: But the seventh day is a Sabbath to Yahweh your God[a]. You shall not do any work—you, or your son, or your daughter, or your male servant, or your female servant, or your ox, or your donkey, or any of your livestock[b], or the sojourner who is within your gates—so that your male servant and your female servant may rest as you do.
translation:
  language: sw
  text: Lakini siku ya saba ni Sabato kwa Yahwe Mungu wako. Usifanye kazi yoyote—si wewe, wala mwana wako, wala binti yako, wala mtumwa wako wa kiume, wala mtumwa wako wa kike, wala ng’ombe wako, wala punda wako, wala mifugo yako yote, wala mgeni mkazi[a] aliye ndani ya malango yako[b]—ili mtumwa wako wa kiume na mtumwa wako wa kike wapumzike kama wewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mgeni anayeishi kwenu.” Kiebrania גֵּר humaanisha mtu asiye mzawa anayeishi miongoni mwa jamii.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “ndani ya malango yako”; hii ni nahau inayomaanisha ndani ya mji au jamii yako.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבָּת
  choice: Sabato
  rationale: Ni istilahi iliyozoeleka katika Kiswahili kwa siku takatifu ya mapumziko ya agano, wala si mapumziko kwa maana ya jumla tu.
- source_word: לַיהוָה / יְהוָה
  choice: kwa Yahwe
  rationale: Kihusishi ל kinaonyesha kuwa siku hiyo imetengwa au kuwekwa wakfu kwa Mungu; jina la agano יהוה limetafsiriwa moja kwa moja kuwa “Yahwe.”
- source_word: מְלָאכָה
  choice: kazi yoyote
  rationale: “Kazi” ni neno pana na la kawaida linalofaa sheria ya Sabato bila kubainisha kupita kiasi aina ya shughuli iliyokatazwa.
- source_word: עַבְדְּךָ / אֲמָתֶךָ
  choice: mtumwa wako wa kiume / mtumwa wako wa kike
  rationale: Maneno haya yanataja washiriki wa nyumbani waliokuwa katika hali ya utumwa na yanatofautisha jinsia zao; “mtumwa” linaonyesha hali yao ya kijamii kwa uwazi kuliko “mtumishi.”
- source_word: שׁוֹר
  choice: ng’ombe wako
  rationale: Katika muktadha huu ni ng’ombe wa kufugwa, mara nyingi wa kazi; “ng’ombe” ni neno la kawaida na halilazimishi maelezo yasiyo wazi kuhusu kuhasiwa.
- source_word: חֲמוֹר
  choice: punda wako
  rationale: Ni tafsiri ya moja kwa moja, ya kisasa na inayoeleweka kwa urahisi.
- source_word: כָל בְּהֶמְתֶּךָ
  choice: mifugo yako mingine yote
  rationale: Muktadha unahusu wanyama wa nyumbani; “mingine” inaonyesha kwa kawaida kwamba ng’ombe na punda waliotajwa tayari ni sehemu ya mifugo hiyo.
- source_word: גֵּר
  choice: mgeni mkazi
  rationale: Neno hili humaanisha mtu asiye mzawa anayeishi katika jamii, si msafiri anayepita tu.
- source_word: בִּשְׁעָרֶיךָ
  choice: ndani ya malango yako
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania, ambayo ni nahau ya mji au jamii iliyo chini ya mamlaka ya mhusika.
- source_word: לְמַעַן יָנוּחַ
  choice: ili ... wapumzike
  rationale: Muundo huu unaonyesha kusudi la amri kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yanatumia jina la agano יהוה moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Hali ya עבד na אמה katika sheria ya Sabato
  choice: mtumwa wa kiume / mtumwa wa kike
  alternative: mtumishi wa kiume / mtumishi wa kike
  rationale: Sheria inawapa mapumziko watu waliofungwa katika utumwa wa kaya. Kutumia “mtumwa” kunaonyesha hali hiyo ya kijamii bila kuipunguza, huku tofauti ya jinsia katika Kiebrania ikidumishwa.
- issue: Nguvu ya כָמוֹךָ mwishoni mwa aya
  choice: kama wewe
  alternative: sawa na wewe
  rationale: '“Kama wewe” hudumisha ulinganisho ulio wazi: watumwa pia wanapaswa kupata mapumziko kama anayeelekezwa na amri, bila kuongeza dai jingine kuhusu usawa.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Mfululizo wa “wala” unaendeleza nguvu ya katazo la Kiebrania kwa njia ya kawaida katika Kiswahili. Alama za tanbihi zimewekwa kwenye maneno yanayohusika, kwa kuwa alama katika safu ya Kiingereza zilionekana kutolingana na maudhui ya tanbihi.
