base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/032.yaml
  text: So be careful to do just as Yahweh your God has commanded you[a]; do not turn aside to the right or to the left.
translation:
  language: sw
  text: Kwa hiyo, jihadharini kutenda sawasawa na Yahweh Mungu wenu alivyowaamuru; msigeuke kwenda kulia wala kushoto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “msigeuke kulia wala kushoto,” nahau inayomaanisha kutokengeuka kwa upande wowote kutoka katika yale ambayo Mungu ameamuru.'
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם
  choice: jihadharini
  rationale: Katika muundo huu, שׁמר ina maana ya kuwa makini ili kutii, si kulinda tu. “Jihadharini” ni Kiswahili cha kawaida chenye nguvu ya onyo kwa kundi.
- source_word: לַ/עֲשׂוֹת
  choice: kutenda
  rationale: עשה hapa inahusu kutekeleza yaliyoamriwa. “Kutenda” ni ya asili katika muktadha wa maadili na maagizo.
- source_word: כַּ/אֲשֶׁר
  choice: sawasawa na ... alivyowaamuru
  rationale: Kifungu hiki huonyesha ulinganifu kamili na amri iliyotolewa; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: צִוָּה
  choice: alivyowaamuru
  rationale: Kitenzi cha wakati uliopita kinaonyesha tendo lililokamilika la kutoa amri, huku wajibu wake ukiendelea.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi “Yahweh,” badala ya kulibadilisha kwa cheo.
- source_word: אֱלֹהֵי/כֶם
  choice: Mungu wenu
  rationale: Huhifadhi umilikaji wa nafsi ya pili wingi na uhusiano wa agano unaoonyeshwa na Kiebrania.
- source_word: לֹא תָסֻרוּ
  choice: msigeuke
  rationale: סור inaonyesha kuacha njia iliyoagizwa. “Msigeuke” huhifadhi taswira ya njia na ni amri ya kawaida kwa kundi.
- source_word: יָמִין וּ/שְׂמֹאל
  choice: kwenda kulia wala kushoto
  rationale: Huhifadhi taswira ya mwelekeo katika nahau ya Kiebrania, huku “wala” ikiunganisha pande zote mbili chini ya katazo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yanatumia jina la agano moja kwa moja; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Nahau ya kutogeuka kulia au kushoto
  choice: Kuhifadhi taswira katika maandishi na kueleza maana yake katika tanbihi
  alternative: Kutafsiri moja kwa moja kuwa “msikengeuke hata kidogo”
  rationale: Kuhifadhi nahau kunadumisha taswira ya njia iliyomo katika Kiebrania, huku tanbihi ikihakikisha maana yake inaeleweka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Wingi wa nafsi ya pili umehifadhiwa katika “jihadharini,” “wenu,” “alivyowaamuru,” na “msigeuke.”
