source:
  edition: WLC
  text: לֹא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָב֧וֹת עַל בָּנִ֛ים וְ/עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/009.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, and on the third and on the fourth generations of those who hate me[c][b],
translation:
  language: sw
  text: Usivisujudie wala kuvitumikia[a], kwa maana mimi, Yahweh Mungu wako, ni Mungu mwenye wivu, ninaowapatiliza watoto uovu wa baba zao, hadi kizazi cha tatu na cha nne[c] cha wale wanaonichukia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “usijilaze kifudifudi mbele yao.” Kitenzi cha Kiebrania hurejelea tendo la kuinama au kujilaza kifudifudi kwa heshima.
    reason: lexical_alternative
  - marker: b
    text: Au “ninayewawajibisha” au “ninayewaadhibu” kwa uovu wa baba zao. Kiebrania husema kwa maana ya “kutembelea,” neno la kimahakama linaloweza kujumuisha kuwawajibisha na kuadhibu.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “juu ya wa tatu na juu ya wa nne”; neno “kizazi” limeongezwa ili kuweka wazi nahau hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: usivisujudie
  rationale: Kitenzi hiki kinaonyesha tendo halisi la kuinama au kujilaza kwa heshima mbele ya kitu kinachoabudiwa. “Kusujudia” ni la kawaida na lenye hadhi katika Kiswahili, na linadumisha tofauti na kitenzi kinachofuata cha kutumikia.
- source_word: תָעָבְדֵם
  choice: kuvitumikia
  rationale: Katika muktadha huu עבד ni kutoa utumishi wa kidini kwa sanamu au miungu. “Kuvitumikia” huhifadhi tofauti ya kileksia na “kuvisujudia.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi namna maandishi ya Kiebrania yanavyomtaja.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Hili ni tamko la moja kwa moja la uhusiano wa agano, lenye kiambishi cha nafsi ya pili umoja.
- source_word: אֵל קַנָּא
  choice: Mungu mwenye wivu
  rationale: Katika muktadha wa agano, קַנָּא huonyesha dai la Mungu la ibada ya pekee na kutokubali washindani. “Mwenye wivu” huhifadhi nguvu hiyo ya uhusiano na upekee.
- source_word: פֹּקֵד
  choice: ninayeupatiliza
  rationale: Kitenzi hiki kina maana ya hatua ya Mungu ya kimahakama ya kufuatilia kosa na kuliletea hesabu au adhabu. “Kupatiliza” ni neno la Kiswahili linalofaa katika muktadha huu, huku tanbihi ikihifadhi upana wa maana ya Kiebrania.
- source_word: עֲוֺן
  choice: uovu
  rationale: עָוֹן inaweza kumaanisha kosa, hatia, au matokeo yake. “Uovu” huhifadhi uzito wa kimaadili bila kuamua kabisa kama mkazo ni tendo, hatia, au matokeo.
- source_word: אָבוֹת
  choice: baba
  rationale: Kiebrania kina nomino ya kiume wingi; “baba” huihifadhi bila kuibadili kuwa “wazazi” au “mababu.”
- source_word: עַל בָּנִים
  choice: kwa watoto
  rationale: Ingawa בנים kwa umbo ni “wana,” katika muktadha wa vizazi inaweza kuwajumuisha watoto wote. “Watoto” ni Kiswahili cha kawaida na cha wazi hapa.
- source_word: שִׁלֵּשִׁים ... רִבֵּעִים
  choice: kizazi cha tatu na cha nne
  rationale: Kiebrania kinasema kwa kifupi “wa tatu na wa nne.” Neno “kizazi” limeongezwa ili kuwasilisha nahau hiyo kwa Kiswahili cha kawaida.
- source_word: לְשֹׂנְאָי
  choice: cha wale wanaonichukia
  rationale: Kirai hiki kinaweka hukumu katika mfululizo wa wale wanaoendelea kumchukia Mungu, huku kikiendelea kuruhusu uzito na mvutano wa kauli ya Kiebrania kuhusu matokeo ya uovu katika vizazi.
theological_decisions:
- issue: Jinsi ya kutafsiri wivu wa Mungu
  choice: Mungu mwenye wivu
  alternative: Mungu mwenye juhudi kali
  rationale: Muktadha unahusu ibada ya pekee katika agano. “Mwenye wivu” huhifadhi dai la Mungu la uaminifu usiogawanyika bila kulainisha kauli.
- issue: Iwapo kifungu kinafundisha adhabu ya vizazi moja kwa moja bila kujali msimamo wa wazao
  choice: Kirai “cha wale wanaonichukia” kimeunganishwa na vizazi vinavyotajwa, bila kufuta mvutano wa kauli kwamba uovu wa baba unapatilizwa kwa watoto.
  alternative: Kusema kwamba watoto huadhibiwa kwa kosa la baba bila kujali kama wao pia wanamchukia Mungu
  rationale: לְשֹׂנְאָי iko mwishoni mwa kifungu na kwa kawaida huweka mipaka ya wale wanaohusika katika hukumu. Tafsiri haiongezi maelezo ya kimafundisho ambayo hayajasemwa wazi, wala haifuti dhana ya matokeo yanayovuka vizazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. “Kusujudia” na “kupatiliza” ni maneno yenye hadhi yanayoendana na muktadha wa ibada na hukumu. Viambishi vya ngeli katika “kuvisujudia/kuvitumikia” vinaelekeza kwenye sanamu au vitu vilivyotajwa katika muktadha uliotangulia.
