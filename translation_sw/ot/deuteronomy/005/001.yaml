source:
  edition: WLC
  text: וַ/יִּקְרָ֣א מֹשֶׁה֮ אֶל כָּל יִשְׂרָאֵל֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם שְׁמַ֤ע יִשְׂרָאֵל֙ אֶת הַ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָנֹכִ֛י דֹּבֵ֥ר בְּ/אָזְנֵי/כֶ֖ם הַ/יּ֑וֹם וּ/לְמַדְתֶּ֣ם אֹתָ֔/ם וּ/שְׁמַרְתֶּ֖ם לַ/עֲשֹׂתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/001.yaml
  text: And Moses called all Israel and said to them[a], “Hear, Israel, the statutes and the judgments that I am speaking in your hearing today; learn them and keep them[b], to do them.”
translation:
  language: sw
  text: Musa akawaita Israeli wote, akawaambia, “Sikiliza[a], Israeli, kanuni na hukumu ninazosema masikioni mwenu leo. Jifunzeni haya, mzishike ili kuzitenda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sikia, Israeli.” Amri ya Kiebrania inaweza kumaanisha kusikiliza kwa makini kunakoongoza kwenye utii, si kupokea sauti tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akawaita
  rationale: Katika simulizi hili קרא ina maana ya kuwaita watu wakusanyike au wamsikilize Musa. ‘Akawaita’ ni ya kawaida na haiweki wazi kupita kiasi kwamba ulikuwa mwito rasmi.
- source_word: כָּל יִשְׂרָאֵל
  choice: Israeli wote
  rationale: Inahifadhi jina la pamoja la taifa lote linaloambiwa maneno ya agano.
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: Sikiliza, Israeli
  rationale: ‘Sikiliza’ linaonyesha kusikia kwa makini, huku dokezo likihifadhi uwezekano wa ‘Sikia’ na maana pana ya kuitikia kwa utii.
- source_word: הַחֻקִּים
  choice: kanuni
  rationale: חקים ni masharti yaliyowekwa yenye nguvu ya kisheria. ‘Kanuni’ ni neno la sasa, linaloeleweka, na linatofautishwa na משפטים.
- source_word: הַמִּשְׁפָּטִים
  choice: hukumu
  rationale: משפטים inaweza kumaanisha maamuzi ya kisheria, maagizo, au taratibu zilizoamriwa. ‘Hukumu’ inadumisha ladha yake ya kimahakama bila kuiunganisha na חקים.
- source_word: דֹּבֵר
  choice: ninazosema
  rationale: Kauli endelevu ya Kiebrania inaonyesha Musa anasema maneno hayo wakati huo.
- source_word: בְּאָזְנֵיכֶם
  choice: masikioni mwenu
  rationale: Tafsiri hii inahifadhi tamathali ya Kiebrania ya maneno kusemwa moja kwa moja mbele ya wasikilizaji, na inaeleweka kwa Kiswahili.
- source_word: הַיּוֹם
  choice: leo
  rationale: Ni tafsiri ya kawaida inayodumisha uharaka wa hotuba ya agano.
- source_word: וּלְמַדְתֶּם אֹתָם
  choice: Jifunzeni
  rationale: למד hapa ni kujifunza na kuyaelewa maagizo; kiwakilishi cha yambwa kinaachwa kwa kawaida katika Kiswahili kwa sababu kanuni na hukumu zimetajwa mara moja kabla.
- source_word: וּשְׁמַרְתֶּם
  choice: mzishike
  rationale: שמר katika muktadha wa agano ni kuyatunza au kuyazingatia maagizo. ‘Mzishike’ inadumisha wazo la uangalifu na utii.
- source_word: לַעֲשֹׂתָם
  choice: ili kuzitenda
  rationale: Infinitivu inaonyesha kusudi la kuyashika maagizo kwa kuyatekeleza kwa vitendo; ‘ili kuzitenda’ inadumisha uhusiano huo wazi.
theological_decisions:
- issue: Kutofautisha jozi ya maneno ya sheria חקים na משפטים
  choice: kanuni na hukumu
  alternative: masharti na maagizo; sheria na hukumu
  rationale: Maneno mawili yanahusiana lakini si sawa kabisa. Kuyatafsiri tofauti kunadumisha msamiati wa kisheria wa Kiebrania bila kuingiza makundi ya baadaye ya kimadhehebu.
- issue: Nguvu ya שׁמע katika wito wa agano
  choice: Sikiliza, Israeli
  alternative: Sikia, Israeli
  rationale: Amri hii haimaanishi kupokea sauti tu, bali kusikiliza kwa makini kwa nia ya kuitikia. ‘Sikiliza’ huwasilisha nguvu hiyo kwa Kiswahili cha sasa, huku dokezo likitaja tafsiri ya karibu zaidi ya kimofimu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa hotuba umewekwa wazi na wa moja kwa moja; ‘masikioni mwenu’ inadumisha taswira ya chanzo, na ‘mzishike ili kuzitenda’ inadumisha mkazo wa kujifunza unaoishia katika utekelezaji.
