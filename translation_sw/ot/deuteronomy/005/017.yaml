  rationale: Kitenzi רָצַח hapa humaanisha hasa kuua mtu kinyume cha sheria au kwa uhalifu. Katika Kiswahili, ‘usiue’ ndiyo kauli ya moja kwa moja na ya kawaida; maelezo ya chini yanafafanua upeo wake ili isieleweke kuwa inakataza kila namna ya kuua bila ubaguzi.
theological_decisions:
- issue: Upeo wa katazo katika amri ya sita
  choice: Usiue, huku tanbihi ikifafanua kuwa kitenzi cha Kiebrania kinahusu hasa mauaji ya mtu kinyume cha sheria.
  alternative: Usifanye mauaji.
  rationale: ‘Usiue’ ni Kiswahili cha kawaida, cha moja kwa moja, na kinachotambulika katika mtindo wa amri. Hata hivyo, kwa kuwa kinaweza kueleweka kwa maana pana kuliko רָצַח, tanbihi huhifadhi usahihi wa Kiebrania bila kuingiza dai kwamba Torati inakataza kila aina ya kuua.
translation_notes:
