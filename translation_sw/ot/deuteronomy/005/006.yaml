  yaml_path: translation/ot/deuteronomy/005/006.yaml
  text: I am Yahweh your God[a], who brought you from the land of Egypt, from the house of servants.
translation:
  language: sw
  text: Mimi ni Yahwe, Mungu wako, niliyekutoa katika nchi ya Misri, katika nyumba ya watumwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka katika nyumba ya utumwa.” Kiebrania ni, kihalisi, “kutoka katika nyumba ya watumwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: Mimi ni
  rationale: Kiwakilishi huru cha nafsi ya kwanza kinasisitiza utambulisho; Kiswahili cha kawaida huhitaji kiunganishi “ni” katika sentensi hii.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama “BWANA”.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Neno hili hapa linamtaja Mungu wa kweli katika uhusiano wa agano, na kiambishi cha nafsi ya pili umoja kimetafsiriwa kwa “wako”.
- source_word: אֲשֶׁר הוֹצֵאתִיךָ
  choice: niliyekutoa
  rationale: Muundo huu wa Kiswahili unaunganisha kwa kawaida kishazi husishi na maana ya Hifili ya יצא, yaani kusababisha mtu atoke au kumtoa.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: '“Katika” baada ya kitenzi “kutoa” huonyesha chanzo kwa Kiswahili cha kawaida: kumtoa mtu katika mahali fulani.'
- source_word: מִבֵּית עֲבָדִים
  choice: katika nyumba ya watumwa
  rationale: Tafsiri hii inahifadhi picha halisi ya Kiebrania ya “nyumba” na nomino ya wingi “watumwa,” badala ya kuibadili kimya kuwa dhana ya “utumwa”.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina la agano moja kwa moja; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya עֲבָדִים katika kauli ya kutoka Misri
  choice: watumwa
  alternative: utumwa au watumishi
  rationale: Katika muktadha wa ukombozi kutoka Misri, neno hilo linaonyesha hali ya watu waliotiishwa kuwa watumwa. Wingi halisi umehifadhiwa bila kupunguza uzito wa hali hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa urahisi. “Mimi ni” huhifadhi msisitizo wa utambulisho wa mwanzo; “niliyekutoa” ni muundo wa kawaida na ulio wazi. Alama ya tanbihi imewekwa baada ya kirai kinachohusika.
