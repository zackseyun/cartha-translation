base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/022.yaml
  text: These words Yahweh spoke to all your assembly on the mountain[a], out of the midst of the fire, the cloud, and the thick darkness, with a loud voice, and he added no more. And he wrote them on two tablets of stone and gave them to me.
translation:
  language: sw
  text: Yahweh alisema maneno haya kwa kusanyiko lenu lote mlimani, kutoka katikati ya moto, wingu, na giza nene, kwa sauti kubwa; wala hakuongeza neno lingine.[a] Akayaandika kwenye vibao viwili vya mawe, kisha akanipa vibao hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala hakuendelea kusema.” Kishazi cha Kiebrania kinaweza kumaanisha kwamba hakuongeza maneno mengine au kwamba hakuendelea kusema.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa na cheo, hivyo kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: maneno haya
  rationale: דְּבָרִים hapa hurejelea yale yaliyosemwa; “maneno” huhifadhi mkazo wa usemi bila kuyafasiri moja kwa moja kuwa “amri.”
- source_word: כָּל קְהַלְכֶם
  choice: kusanyiko lenu lote
  rationale: קָהָל ni jumuiya iliyokusanyika. “Kusanyiko lenu lote” ni Kiswahili cha sasa kinachohifadhi maana ya kundi zima.
- source_word: מִתּוֹךְ הָאֵשׁ הֶעָנָן וְהָעֲרָפֶל
  choice: kutoka katikati ya moto, wingu na giza nene
  rationale: “Kutoka katikati” huhifadhi nguvu ya מִתּוֹךְ, na “giza nene” hutoa maana ya עֲרָפֶל kama giza zito au ukungu wenye giza.
- source_word: קוֹל גָּדוֹל
  choice: kwa sauti kubwa
  rationale: Hii ni njia ya kawaida na ya wazi ya Kiswahili ya kueleza sauti yenye nguvu au inayosikika sana.
- source_word: וְלֹא יָסָף
  choice: wala hakuongeza zaidi
  rationale: Tafsiri hii huhifadhi maana ya kwamba Yahweh hakuongeza maneno mengine, huku uwezekano wa maana ya kutokuendelea kusema ukiwekwa katika tanbihi.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: vibao viwili vya mawe
  rationale: “Vibao” ni neno la kawaida la Kiswahili kwa mabamba ya kuandikia na linafaa kwa לֻחֹת katika muktadha huu.
- source_word: וַיִּתְּנֵם אֵלָי
  choice: kisha akanipa vibao hivyo
  rationale: Kirejeshi cha Kiebrania kinaeleweka kwa muktadha kuwa kinarejelea vibao; kurudia nomino huondoa utata wa upatanisho wa ngeli katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: “Yahweh” huhifadhi jina binafsi lililo katika maandishi ya Kiebrania bila kulibadilisha kuwa cheo, wala kuingiza upendeleo wa kimadhehebu.
- issue: Maana ya וְלֹא יָסָף
  choice: wala hakuongeza zaidi
  alternative: wala hakuendelea kusema
  rationale: Kishazi kinaweza kueleweka kuwa hakukuwa na maneno mengine yaliyoongezwa au kwamba hakukuwa na kuendelea kusema. Maana ya kwanza inafaa muktadha wa maneno yaliyoandikwa vib於ni, lakini maana nyingine halisi imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Kusanyiko,” “giza nene,” na “vibao viwili vya mawe” huhifadhi uzito wa simulizi bila kutumia lugha ya kizamani.
