  source_fidelity: 'Maana kuu imehifadhiwa: swali la balagha linamhusu mwanadamu aliyesikia sauti ya Mungu aliye hai kutoka ndani ya moto na akaishi. Hata hivyo, “amewahi” huongeza dhana ya ‘ever/at any time’ ambayo haijaelezwa moja kwa moja katika Kiebrania, na “akaendelea kuwa hai” hufafanua zaidi ya kitenzi cha msingi ‘akaishi.’'
