base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/026.yaml
  text: For who of all flesh has heard the voice of the living God speaking from the midst of the fire[a], as we have, and lived?
translation:
  language: sw
  text: Kwa maana, ni nani kati ya wanadamu wote ambaye amesikia sauti ya Mungu aliye hai akisema kutoka katikati ya moto, kama sisi tulivyosikia, akaishi?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza sababu ya hofu na ombi la watu katika muktadha unaotangulia.
- source_word: מִי כָל בָּשָׂר
  choice: ni nani kati ya wanadamu wote
  rationale: Swali la balagha; tafsiri hii huwasilisha kwa Kiswahili cha kawaida maana ya nahau ya Kiebrania ‘nyama yote,’ yaani wanadamu wenye kufa.
- source_word: שָׁמַע קוֹל
  choice: amewahi kuisikia sauti
  rationale: ‘Sauti’ inafaa kwa kuwa Mungu ananena; ‘amewahi’ huonyesha tukio lililotokea lenye uzito kwa hali ya sasa.
- source_word: אֱלֹהִים חַיִּים
  choice: Mungu aliye hai
  rationale: Ingawa maumbo ya Kiebrania ni ya wingi, kifungu hiki ni jina la kumtaja Mungu mmoja wa Israeli.
- source_word: מְדַבֵּר
  choice: ikisema
  rationale: Kirai endelevu kinaeleza sauti ya Mungu ilivyokuwa ikinena; muundo huu ni wa asili katika Kiswahili.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: kutoka katikati ya moto
  rationale: Huhifadhi picha ya sauti kutoka ndani ya moto, si karibu nao tu.
- source_word: כָּמֹנוּ
  choice: kama sisi tulivyoisikia
  rationale: Hufanya ulinganisho na tukio la Israeli kuwa wazi kwa Kiswahili bila kubadili maana.
- source_word: וַיֶּחִי
  choice: akaendelea kuwa hai
  rationale: Huhifadhi maana ya ‘akaishi/akawa hai’ huku ikionyesha kwamba mtu hakufa baada ya kumsikia Mungu.
theological_decisions:
- issue: Nahau ya kianthropolojia כָל בָּשָׂר
  choice: wanadamu wote
  alternative: wote wenye mwili
  rationale: ‘Wanadamu wote’ ni Kiswahili cha kawaida na huwasilisha rejeo kwa binadamu wenye kufa; tafsiri halisi ‘wote wenye mwili’ inaweza kueleweka kuwa inajumuisha wanyama katika muktadha huu.
- issue: Idadi na maana ya אֱלֹהִים חַיִּים
  choice: Mungu aliye hai
  alternative: miungu iliyo hai
  rationale: Katika muktadha huu maumbo ya wingi yanafanya kazi kama jina la umoja linalomhusu Mungu wa Israeli; tafsiri ya wingi ingepotosha maana.
- issue: Maana ya kuishi katika וַיֶּחִי
  choice: akaendelea kuwa hai
  alternative: akanusurika
  rationale: Chaguo hili huhifadhi msamiati wa uhai bila kuifanya ‘kunusurika’ kuwa ufafanuzi pekee, ingawa wazo la kutokufa baada ya kukutana na Mungu limo katika swali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali la balagha umehifadhiwa; nahau isiyo ya kawaida ya ‘nyama yote’ imetolewa kwa maana yake ya kawaida.
