base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/028.yaml
  text: And Yahweh heard the sound of your words when you spoke to me[a], and Yahweh said to me, “I have heard the sound of the words of this people, which they have spoken to you[b]; they have spoken well in all that they have said.”
translation:
  language: sw
  text: Yahwe aliisikia sauti ya maneno yenu mliposema nami,[a] naye Yahwe akaniambia, “Nimeisikia sauti ya maneno ya watu hawa waliyokuambia. Wamesema vyema[b] katika yote waliyosema.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alisikia maneno yenu mlipokuwa mkizungumza nami.” Kiebrania kina nahau ya kusikia iliyo, kwa neno kwa neno, “sauti ya maneno yenu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Wamefanya vyema katika yote waliyosema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la Mungu lililoandikwa katika maandishi ya Kiebrania badala ya kulibadili kuwa cheo.
- source_word: וַיִּשְׁמַע / שָׁמַעְתִּי
  choice: aliisikia / Nimeisikia
  rationale: Kitenzi שׁמע hapa kinamaanisha kusikia yaliyosemwa; nyakati hizi za Kiswahili zinaonyesha tendo la kwanza katika simulizi na tendo lililotimizwa lenye umuhimu wa sasa katika usemi wa moja kwa moja.
- source_word: קוֹל דִּבְרֵיכֶם / קוֹל דִּבְרֵי
  choice: sauti ya maneno yenu / sauti ya maneno
  rationale: Tafsiri hii inadumisha mkazo wa nahau ya Kiebrania juu ya kile kilichosikika, ingawa Kiswahili cha kawaida pia kingeweza kusema tu “maneno yenu.”
- source_word: בְּדַבֶּרְכֶם אֵלָי
  choice: mliposema nami
  rationale: Muundo wenye בְּ na kitenzi-jina unaonyesha tendo lililotokea wakati mmoja na kusikia; “mliposema nami” ni Kiswahili cha kawaida na sahihi.
- source_word: הָעָם הַזֶּה
  choice: watu hawa
  rationale: Ingawa עָם ni umoja wa kijamii, Kiswahili cha kawaida hutumia “watu hawa” kwa kundi linaloonyeshwa hapa.
- source_word: אֲשֶׁר דִּבְּרוּ אֵלֶיךָ
  choice: ambayo wamekuambia
  rationale: Kiwakilishi “ambayo” kinarejelea maneno, na umbo la umoja “-ku-” linaonyesha kwamba Mungu anamwambia Musa.
- source_word: הֵיטִיבוּ
  choice: Wamesema vyema
  rationale: Katika muktadha huu tathmini ya kufanya vyema inalenga maneno ya watu; tafsiri hii inaweka wazi maana hiyo bila kuondoa uwezekano wa tafsiri ya jumla zaidi, unaotajwa katika tanbihi.
- source_word: כָּל אֲשֶׁר דִּבֵּרוּ
  choice: katika yote waliyosema
  rationale: Inahifadhi nguvu ya ujumla ya כָּל אֲשֶׁר na uhusiano wake na tathmini inayotangulia.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia moja kwa moja jina la agano יהוה; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya הֵיטִיבוּ katika tathmini ya maneno ya watu
  choice: Wamesema vyema
  alternative: Wamefanya vyema
  rationale: Muktadha wa karibu unahusu yale waliyosema, lakini kitenzi chenyewe kinaweza kumaanisha “kufanya vyema”; tanbihi inadumisha upana huo bila kuamua zaidi ya ushahidi wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “sauti ya maneno” umeachwa kwa makusudi ili kuhifadhi nahau ya kusikia ya Kiebrania, huku tanbihi ikitoa usemi wa kawaida zaidi.
