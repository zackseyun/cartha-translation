  text: You shall have no other gods before me[a].
translation:
  language: sw
  text: Usiwe na miungu mingine mbele zangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbali nami.” Kiebrania kinasema kihalisi, “mbele ya uso wangu,” usemi unaoweza kumaanisha “mbele yangu” au “katika uwepo wangu,” na pia kutokuwa na miungu mingine mbali nami.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא
  choice: usiwe na
  rationale: Kikanushi hiki kinaanzisha katazo. Katika Kiswahili cha kawaida, muundo wa kumiliki ‘usiwe na’ huwasilisha kwa ufasaha maana ya Kiebrania ya kutokuwapo kwa kitu kwa mtu.
- source_word: יִהְיֶה לְךָ
  choice: usiwe na
  rationale: Kitenzi ‘kuwa’ pamoja na לְךָ (‘kwako’) kinaonyesha kuwapo au kuwa na kitu. Kiswahili cha kawaida hutumia ‘kuwa na’; nafsi ya pili umoja imehifadhiwa katika ‘usiwe.’
- source_word: אֱלֹהִים
  choice: miungu
  rationale: Nomino ya wingi, ikifafanuliwa na ‘mingine,’ inarejelea miungu inayoshindana na BWANA. ‘Miungu’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אֲחֵרִים
  choice: mingine
  rationale: Kivumishi hiki kinaonyesha miungu iliyo tofauti na BWANA. ‘Mingine’ hakiongezi dhana ya ‘kigeni,’ ambayo haijaelezwa wazi na neno lenyewe.
- source_word: עַל פָּנָי
  choice: mbele zangu
  rationale: Kihalisi, ‘mbele ya uso wangu.’ ‘Mbele zangu’ huhifadhi maana ya uwepo na uhusiano bila kuifupisha kimakusudi kuwa ‘isipokuwa mimi’ pekee.
theological_decisions:
- issue: Maana ya kifungu cha mwisho עַל פָּנָי
  choice: mbele zangu
  alternative: isipokuwa mimi; katika uwepo wangu
  rationale: Kifungu cha Kiebrania kinaweza kueleza kuwa mbele au katika uwepo wa Mungu na, katika katazo hili, upekee wake. Matini kuu inahifadhi usemi ulio karibu zaidi na Kiebrania, huku tanbihi ikionyesha maana halali ya upekee bila kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. ‘Usiwe na’ ni amri hasi ya kawaida na huhifadhi usemi wa nafsi ya pili umoja wa Kiebrania.
