  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כַּבֵּ֤ד אֶת אָבִ֨י/ךָ֙ וְ/אֶת אִמֶּ֔/ךָ כַּ/אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ לְמַ֣עַן יַאֲרִיכֻ֣/ן יָמֶ֗י/ךָ וּ/לְמַ֨עַן֙ יִ֣יטַב לָ֔/ךְ עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/016.yaml
  text: Honor your father and your mother[a], as Yahweh your God commanded you[b], so that your days may be long and so that it may go well for you on the land that Yahweh your God is giving you.
translation:
  language: sw
  text: Mheshimu baba yako na mama yako, kama Yahwe Mungu wako alivyokuamuru, ili siku zako ziwe nyingi na ili mambo yakuendee mema katika nchi[a] ambayo Yahwe Mungu wako anakupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “juu ya nchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּבֵּד
  choice: Mheshimu
  rationale: Kitenzi hiki katika muktadha wa uhusiano kinamaanisha kumpa mtu heshima na kumchukulia kuwa wa thamani. “Mheshimu” ni Kiswahili cha kawaida, chenye nguvu ya amri, bila kulazimisha sitiari ya Kiebrania ya uzito.
- source_word: אָבִיךָ ... אִמֶּךָ
  choice: baba yako na mama yako
  rationale: Kurudiwa kwa kiashiria cha yambwa katika Kiebrania kunawapa wazazi wote wawili uzito ulio sawa; kutaja “baba yako” na “mama yako” kikamilifu kunahifadhi ulinganifu huo.
- source_word: כַּאֲשֶׁר צִוְּךָ
  choice: kama ... alivyokuamuru
  rationale: Muundo huu unaonyesha kwamba amri hiyo inalingana na amri ya Mungu iliyotolewa tayari. “Kama ... alivyokuamuru” ni ya asili na huhifadhi rejeo hilo la nyuma.
- source_word: יְהוָה
  choice: Yahwe
  rationale: “Yahwe” ni umbo la kawaida la Kiswahili la jina binafsi la Mungu linalowakilishwa na herufi YHWH, badala ya kulibadili kuwa cheo kama “BWANA.”
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: 'Kiambishi cha nafsi ya pili umoja kinaonyesha uhusiano wa kumiliki au wa agano: “Mungu wako.”'
- source_word: לְמַעַן
  choice: ili
  rationale: Neno hili linaonyesha kusudi au matokeo. “Ili” ni fupi, ya kawaida, na inafaa katika vifungu vyote viwili vinavyofuata.
- source_word: יַאֲרִיכֻן יָמֶיךָ
  choice: siku zako ziwe nyingi
  rationale: Kiebrania kinaweka “siku zako” kuwa kiima na kueleza kurefushwa kwake. “Siku zako ziwe nyingi” huhifadhi picha hiyo huku kikieleweka kama kuishi muda mrefu.
- source_word: וּלְמַעַן יִיטַב לָךְ
  choice: na ili mambo yakuendee mema
  rationale: Hii ni nahau ya ustawi au hali njema. “Mambo yakuendee mema” ni Kiswahili cha sasa kinachohifadhi maana pana bila kuibana kuwa utajiri wa mali.
- source_word: עַל הָאֲדָמָה
  choice: katika nchi
  rationale: Katika muktadha huu אֲדָמָה ni nchi ambayo Mungu anawapa Israeli, si udongo tu. Kiswahili cha kawaida hutumia “katika nchi”; tanbihi inahifadhi uwezekano wa tafsiri iliyo karibu zaidi na kihusishi cha Kiebrania.
- source_word: נֹתֵן לָךְ
  choice: anakupa
  rationale: Hali ya kitenzi kishirikishi huonyesha tendo linaloendelea au lililo karibu na la hakika. “Anakupa” huhifadhi mtazamo huo wa sasa.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Andiko lina jina la agano la Mungu, si cheo tu. “Yahwe” hulihifadhi kama jina binafsi kwa umbo linalotumika kwa kawaida katika Kiswahili.
- issue: Asili ya ahadi inayohusishwa na kuwaheshimu wazazi
  choice: Kudumisha ahadi ya maisha marefu na hali njema katika nchi bila kuifafanua kuwa dhamana kamili kwa kila mtu au kuwa ahadi ya taifa pekee
  alternative: Dhamana ya lazima ya maisha marefu kwa kila mtu; au ahadi ya taifa isiyo na maana yoyote kwa mtu binafsi
  rationale: Kiebrania kinatoa ahadi halisi ndani ya muktadha wa agano, lakini mstari wenyewe hauamui kati ya maelezo hayo mawili yaliyobana. Tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida, huku urudiaji wa “baba yako na mama yako,” jina “Yahwe,” na vifungu viwili vya kusudi vikihifadhi msisitizo wa Kiebrania.
