  text: וְ/עַתָּה֙ לָ֣/מָּה נָמ֔וּת כִּ֣י תֹֽאכְלֵ֔/נוּ הָ/אֵ֥שׁ הַ/גְּדֹלָ֖ה הַ/זֹּ֑את אִם יֹסְפִ֣ים אֲנַ֗חְנוּ לִ֠/שְׁמֹעַ אֶת ק֨וֹל יְהוָ֧ה אֱלֹהֵ֛י/נוּ ע֖וֹד וָ/מָֽתְנוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/025.yaml
  text: And now[a], why should we die? For this great fire will consume us. If we continue to hear the voice of Yahweh our God any longer, we will die.
translation:
  language: sw
  text: Na sasa, kwa nini tufe? Kwa maana moto huu mkubwa utatuteketeza. Tukiendelea kuisikia sauti ya Yahweh Mungu wetu, tutakufa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Inahifadhi kiunganishi וְ pamoja na maana ya wakati ya עַתָּה, ikitambulisha hitimisho la watu kutokana na tukio lililotangulia.
- source_word: לָמָּה נָמוּת
  choice: kwa nini tufe?
  rationale: Swali la balagha linaonyesha hofu ya matokeo yanayoweza kutokea; hali ya utegemezi katika “tufe” ni ya kawaida na ya asili katika Kiswahili.
- source_word: כִּי
  choice: Kwa maana
  rationale: Inatambulisha sababu ya swali lililotangulia kwa mtindo wa heshima na ulio wazi.
- source_word: תֹאכְלֵנוּ
  choice: utatuteketeza
  rationale: Kitenzi אכל kwa moto kama mtendaji humaanisha kuangamiza kwa kuunguza; “teketeza” ni usemi wa asili wa Kiswahili na huhifadhi nguvu ya picha hiyo.
- source_word: הָאֵשׁ הַגְּדֹלָה הַזֹּאת
  choice: moto huu mkubwa
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unahifadhi nomino, kivumishi, na kiashiria cha Kiebrania.
- source_word: אִם יֹסְפִים אֲנַחְנוּ לִשְׁמֹעַ
  choice: Tukiendelea kuisikia
  rationale: יסף pamoja na kitenzi-jina humaanisha kuendelea kufanya jambo; muundo wa “tukiendelea” unaonyesha sharti kwa ufasaha.
- source_word: קוֹל
  choice: sauti
  rationale: Katika muktadha wa usemi wa Mungu, “sauti” ndiyo tafsiri ya moja kwa moja na ya kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo; “Yahwe” ni umbo linalofaa kifonolojia katika Kiswahili.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Inahifadhi wazi umilikaji na lugha ya uhusiano wa agano.
- source_word: עוֹד וָמָתְנוּ
  choice: tutakufa
  rationale: Maana ya kuendelea zaidi tayari imebeba katika “tukiendelea”; hitimisho la sharti linatolewa kwa wakati ujao wa kawaida wa Kiswahili bila urudiaji usio wa lazima.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. Kulihifadhi kama “Yahwe” huepuka kulibadilisha kuwa cheo na hudumisha lugha ya agano ya kifungu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa msomaji wa kawaida. Muundo ni wa ulinganifu bora: unaofuata kwa karibu hoja na picha za Kiebrania huku ukitumia sintaksia ya asili ya Kiswahili.'
