  text: lakini huwaonyesha maelfu upendo wa kudumu—wale wanaonipenda na kuzishika amri zake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati na tafsiri zinasoma “amri zangu,” jambo linalopatana na usemi wa nafsi ya kwanza katika muktadha; maandishi ya Kiebrania yaliyotolewa hapa yanasoma “amri zake.”
    reason: textual_variant
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: lakini huwapa
  rationale: Kitenzi kishirikishi kinaendeleza tendo la Mungu na, kwa kuzingatia tofauti na mstari uliotangulia, kiunganishi וְ kimetafsiriwa kwa maana ya upinzani kuwa “lakini.” “Huwapa” ni Kiswahili cha kawaida kinachoonyesha tendo linaloendelea la kuwafanyia watu wema huu.
- source_word: חֶסֶד
  choice: upendo wa kudumu
  rationale: חֶסֶד huunganisha upendo, uaminifu, na ushikamanifu wa agano. “Upendo wa kudumu” ni usemi wa asili na unaoeleweka unaobeba wazo la upendo thabiti bila kuufanya kuwa hisia tu.
- source_word: לַאֲלָפִים
  choice: maelfu
  rationale: Kiebrania kinasema “maelfu” bila kutaja wazi “vizazi”; tafsiri haiongezi nomino isiyokuwapo katika maandishi haya.
- source_word: לְאֹהֲבַי
  choice: wale wanaonipenda
  rationale: Kishirikishi chenye kiambishi cha nafsi ya kwanza kimetolewa kwa kishazi cha uhusiano cha kawaida katika Kiswahili, huku maana ya uhusiano unaoendelea ikihifadhiwa.
- source_word: וּלְשֹׁמְרֵי
  choice: na kuzishika
  rationale: Kwa habari ya amri, שמר humaanisha kuzitunza au kuzitii. “Kuzishika” ni usemi wa kawaida wa kibiblia na wa sasa unaohifadhi maana ya kuzingatia kwa uaminifu.
- source_word: מצות/ו
  choice: amri zake
  rationale: Umbo la maandishi yaliyotolewa lina kiambishi cha nafsi ya tatu umoja wa kiume, yaani “zake.” Tafsiri inafuata umbo hilo badala ya kulisawazisha kimya kimya na nafsi ya kwanza ya muktadha.
theological_decisions:
- issue: Kiwakilishi katika kirai cha “amri”
  choice: amri zake
  alternative: amri zangu
  rationale: Maandishi ya Kiebrania yaliyotolewa yana kiambishi cha nafsi ya tatu umoja wa kiume. Ingawa muktadha wa usemi wa nafsi ya kwanza na baadhi ya mashahidi huunga mkono “amri zangu,” tofauti hiyo imehifadhiwa katika tanbihi badala ya kutatuliwa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa msomaji wa kawaida. Mstari umehifadhi “maelfu” bila kuongeza “vizazi,” na alama ya mstari mrefu inaonyesha kwamba “wale wanaonipenda…” ndio hao maelfu wanaopokea upendo huo.
