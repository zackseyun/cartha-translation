base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/010.yaml
  text: You shall surely give to him[a], and your heart shall not be troubled when you give to him[c][b], because on account of this thing Yahweh your God will bless you in all your work and in every undertaking of your hand.
translation:
  language: sw
  text: Ni lazima umpe, wala moyo wako usiwe na kinyongo unapompa, kwa maana kwa ajili ya jambo hili Yahwe Mungu wako atakubariki katika kazi zako zote na katika kila jambo unalofanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “na katika kila upelekaji wa mkono wako”; yaani, katika kila jambo unalotia mkono kulifanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתוֹן תִּתֵּן
  choice: Ni lazima umpe kwa ukarimu
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi cha wakati usiotimilika unasisitiza amri. Kiswahili hiki kinaonyesha wajibu wenye msisitizo; ‘kwa ukarimu’ linafaa katika muktadha wa kumpa mhitaji bila moyo wa kusita.
- source_word: וְלֹא יֵרַע לְבָבְךָ
  choice: wala moyo wako usiwe na kinyongo
  rationale: Kirai kinaeleza hali mbaya ya ndani wakati wa kutoa. ‘Kusiwe na kinyongo’ huwasilisha kutotoa kwa uchungu au kwa kulalamika, huku kikihifadhi taswira ya moyo.
- source_word: בְּתִתְּךָ לוֹ
  choice: unapompa
  rationale: ב pamoja na kitenzi-jina hapa ina maana ya wakati au mazingira; ‘unapompa’ ni Kiswahili cha kawaida na sahihi.
- source_word: כִּי בִּגְלַל הַדָּבָר הַזֶּה
  choice: kwa maana kwa ajili ya jambo hili
  rationale: בגלל inaonyesha sababu, na הדבר הזה inarejelea tendo hili la kumpa mhitaji. ‘Jambo hili’ huhifadhi nomino ya Kiebrania bila kuwa nzito.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahwe Mungu wako
  rationale: Jina la agano יהוה limetafsiriwa kwa unukuzi wa Kiswahili ‘Yahwe,’ likifuatiwa na ‘Mungu wako’ kama katika chanzo.
- source_word: בְּכָל מַעֲשֶׂךָ
  choice: katika kazi zako zote
  rationale: מעשה ni neno pana kwa kazi au matendo ya mtu; ‘kazi zako zote’ ni la kawaida katika muktadha huu wa kiuchumi.
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: na katika kila jambo unalofanya
  rationale: Hii ni nahau yenye maana halisi ya ‘kila kupeleka mkono wako.’ Tafsiri hii huwasilisha maana ya kila shughuli au jitihada kwa Kiswahili cha kawaida; maana halisi imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia moja kwa moja Jina la Mungu, YHWH. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Mpokeaji katika kiambishi cha nafsi ya kiume umoja לוֹ
  choice: umpe / unapompa
  alternative: uwape / unapowapa
  rationale: Kiebrania kina kiambishi cha nafsi ya tatu ya kiume umoja kinachomrejelea ndugu mhitaji katika muktadha; umoja umehifadhiwa.
- issue: Uhusiano kati ya kutoa na baraka
  choice: kwa ajili ya jambo hili ... atakubariki
  alternative: ndiyo sababu ... atakubariki
  rationale: Tafsiri inadumisha kauli ya sababu iliyo katika בגלל bila kuifafanua kama mfumo mpana wa kustahili wokovu au fundisho jingine lisilotajwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi ni wa kawaida kwa wasomaji wengi, huku taswira ya ‘moyo’ na jina ‘Yahwe’ vikihifadhiwa. Tanbihi inaeleza nahau ya Kiebrania bila kuifanya matini kuu kuwa nzito.
