  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַֽ/יִּפְדְּ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ עַל כֵּ֞ן אָנֹכִ֧י מְצַוְּ/ךָ֛ אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/015.yaml
  text: And you shall remember that you were a servant in the land of Egypt[a], and Yahweh your God redeemed you[c][b]; therefore I am commanding you this today.
translation:
  language: sw
  text: Nawe utakumbuka kwamba ulikuwa mtumwa katika nchi ya Misri, na Yahweh, Mungu wako, alikukomboa[a]; kwa hiyo ninakuamuru jambo hili leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikukomboa kwa fidia.” Kitenzi cha Kiebrania kinaweza kumaanisha kumkomboa mtu au kumtoa katika utumwa kwa fidia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Nawe utakumbuka
  rationale: Muundo huu unaonyesha agizo lenye nguvu katika muktadha wa sheria, huku ukiunganisha mstari huu na yaliyotangulia.
- source_word: עֶבֶד
  choice: mtumwa
  rationale: Katika muktadha wa utumwa wa Misri, neno hili linaonyesha hali ya kufungwa na kutawaliwa, si huduma ya hiari.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Huhifadhi usemi kamili wa Kiebrania na kumbukumbu yake ya kihistoria.
- source_word: וַיִּפְדְּךָ
  choice: akakukomboa
  rationale: Kitenzi hiki humaanisha kumtoa mtu katika utumwa kwa ukombozi au fidia; 'akakukomboa' ni cha kawaida na huhifadhi uzito wa kitheolojia.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh Mungu wako
  rationale: Huhifadhi jina la agano la Mungu na kutafsiri moja kwa moja kiambishi cha nafsi ya pili umoja.
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Huonyesha wazi hitimisho linalotokana na ukombozi wa Israeli.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: ninakuamuru
  rationale: Ni Kiswahili cha sasa na cha asili kinachoonyesha kitendo cha Mungu cha kutoa agizo moja kwa moja.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: jambo hili
  rationale: Neno דָּבָר ni pana kuliko 'amri'; 'jambo hili' huhifadhi upana huo huku likirejelea maagizo ya muktadha.
- source_word: הַיּוֹם
  choice: leo
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya alama hii ya wakati.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina la agano moja kwa moja; 'Yahweh' hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Hali ya kijamii inayotajwa na עֶבֶד
  choice: mtumwa
  alternative: mtumishi
  rationale: Kifungo cha Misri ndicho msingi wa agizo hili; 'mtumwa' huonyesha kwa usahihi zaidi hali ya kulazimishwa na kukandamizwa.
- issue: Maana ya ukombozi katika פדה
  choice: akakukomboa
  alternative: akakufidia
  rationale: '''Akakukomboa'' huhifadhi maana ya kutolewa katika utumwa bila kulazimisha picha maalumu ya malipo, ingawa dhana ya fidia ipo katika kitenzi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Sentensi mbili zimetumiwa ili hitimisho la 'Kwa hiyo' lisomeke kwa uwazi bila kubadili uhusiano wa kimantiki wa Kiebrania.
