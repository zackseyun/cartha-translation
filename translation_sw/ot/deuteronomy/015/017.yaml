  text: then you shall take the awl and put it through his ear and into the door[a], and he shall be your servant permanently. And you shall do the same for your female servant.
translation:
  language: sw
  text: Kisha utachukua uma wa kutobolea na kuupitisha katika sikio lake na ndani ya mlango. Naye atakuwa mtumwa wako daima.[a] Kwa mtumwa wako wa kike nawe utafanya vivyo hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “milele”; katika muktadha huu wa kisheria inaweza kumaanisha “kwa maisha yake yote.”
    reason: Njia mbadala za kutafsiri עוֹלָם bila kulazimisha maana ya muda usio na mwisho.
lexical_decisions:
- source_word: הַמַּרְצֵעַ
  choice: uma wa kutobolea
  rationale: Neno hili linamaanisha chombo chenye ncha kinachotumiwa kutoboa. ‘Uma wa kutobolea’ ni wazi kwa msomaji wa Kiswahili kuliko kutumia jina la chombo lisilozoeleka peke yake.
- source_word: וְנָתַתָּה בְאָזְנוֹ וּבַדֶּלֶת
  choice: kuupitisha katika sikio lake hadi mlangoni
  rationale: Kauli ya Kiebrania inataja kuweka chombo sikioni na mlangoni. Tafsiri hii inaonyesha tendo la kutoboa sikio likiwa dhidi ya mlango bila kuongeza maelezo ya kiibada yasiyotajwa wazi.
- source_word: עֶבֶד
  choice: mtumwa
  rationale: Katika sheria hii neno linaonyesha hadhi rasmi ya mtu aliyefungwa katika utumishi, hivyo ‘mtumwa’ huhifadhi uzito wa kijamii na kisheria kuliko ‘mtumishi’.
- source_word: עוֹלָם
  choice: daima
  rationale: ‘Daima’ huhifadhi wazo la hali inayoendelea bila kuweka wazi kupita kiasi kama ni milele kwa maana isiyo na mwisho au kwa maisha yote katika muktadha huu wa kisheria; tanbihi inaonyesha uwezekano huo.
- source_word: אֲמָתְךָ
  choice: mtumwa wako wa kike
  rationale: Neno linamaanisha mwanamke mwenye hadhi ya utumwa au utumishi wa kufungwa. Tafsiri hii pia inalingana na ‘mtumwa’ katika sentensi iliyotangulia.
- source_word: וְאַף ... תַּעֲשֶׂה כֵּן
  choice: Utamfanyia vivyo hivyo
  rationale: Hii ni kauli ya kawaida ya Kiswahili inayoonyesha kwamba sharti lilelile linamhusu pia mtumwa wa kike.
theological_decisions:
- issue: Jinsi ya kutafsiri istilahi za utumwa katika sheria ya Israeli
  choice: Kutumia ‘mtumwa’ na ‘mtumwa wa kike’
  alternative: ‘mtumishi’ na ‘mjakazi’
  rationale: Muktadha unahusu hadhi ya kisheria ya utumishi wa kufungwa inayothibitishwa kwa tendo rasmi. ‘Mtumwa’ hudumisha uzito huo bila kuingiza dai la kimadhehebu.
- issue: Muda unaoonyeshwa na עוֹלָם
  choice: Kutumia ‘daima’ na kutoa tanbihi
  alternative: ‘milele’ au ‘kwa maisha yake yote’
  rationale: Neno la Kiebrania linaweza kueleza kudumu bila kikomo kilichotajwa, lakini katika sheria hii linaweza kueleweka kuwa kwa maisha yote. Tafsiri kuu na tanbihi kwa pamoja zinahifadhi mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi zimewekwa fupi na za moja kwa moja; istilahi ya utumwa imehifadhiwa kwa sababu ya uzito wa kisheria wa kifungu.
