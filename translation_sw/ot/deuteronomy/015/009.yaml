  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֡ פֶּן יִהְיֶ֣ה דָבָר֩ עִם לְבָבְ/ךָ֨ בְלִיַּ֜עַל לֵ/אמֹ֗ר קָֽרְבָ֣ה שְׁנַֽת הַ/שֶּׁבַע֮ שְׁנַ֣ת הַ/שְּׁמִטָּה֒ וְ/רָעָ֣ה עֵֽינְ/ךָ֗ בְּ/אָחִ֨י/ךָ֙ הָֽ/אֶבְי֔וֹן וְ/לֹ֥א תִתֵּ֖ן ל֑/וֹ וְ/קָרָ֤א עָלֶ֨י/ךָ֙ אֶל יְהוָ֔ה וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/009.yaml
  text: Be careful lest there be in your heart a wicked thought[a], saying, ‘The seventh year, the year of release, is near,’ and your eye be evil toward your poor brother and you give him nothing; then he may cry out against you to Yahweh[c][b], and it will be sin in you.
translation:
  language: sw
  text: Jihadhari usije ukawa na wazo ovu moyoni mwako, ukisema, “Mwaka wa saba, mwaka wa kuachilia madeni[a], umekaribia,” ukamtazama ndugu yako maskini kwa jicho baya[b], usimpe chochote. Anaweza kumlilia Yahwe dhidi yako, nawe ukawa na dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mwaka wa kuachilia madeni” unaweza pia kutafsiriwa “mwaka wa maachilio,” “mwaka wa msamaha,” au “mwaka wa kufuta madeni.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “kumtazama kwa jicho baya” ni tamathali inayomaanisha kumtendea mtu mwenye uhitaji kwa roho ya uchoyo au kinyongo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Jihadhari
  rationale: Kauli ya onyo inayomtaka mtu ajilinde mwenyewe; “Jihadhari” ni ya kawaida, wazi, na ina nguvu inayofaa katika Kiswahili.
- source_word: דָבָר עִם לְבָבְךָ בְלִיַּעַל
  choice: likawa moyoni mwako wazo ovu
  rationale: Katika muktadha huu דָבָר ni jambo la ndani linalofafanuliwa kwa kusema kunakofuata, hivyo “wazo” linaeleza maana hiyo; בְלִיַּעַל inaonyesha ubaya wa kimaadili, si jina maalumu.
- source_word: שְׁנַת הַשְּׁמִטָּה
  choice: mwaka wa maachilio
  rationale: “Maachilio” huhifadhi wazo pana la kuachilia au kufuta wajibu katika mwaka wa saba bila kulifanya neno la Kiebrania kuwa jembamba kuliko lilivyo.
- source_word: וְרָעָה עֵינְךָ
  choice: jicho lako likawa baya
  rationale: Huhifadhi tamathali ya Kiebrania ya “jicho baya,” inayomaanisha kuwa mchoyo au kutomtakia mema mhitaji; tanbihi inaifafanua.
- source_word: בְּאָחִיךָ הָאֶבְיוֹן
  choice: kumwelekea ndugu yako maskini
  rationale: “Ndugu” huhifadhi lugha ya kifamilia ya agano, huku “maskini” ikiwasilisha hali ya uhitaji kwa lugha ya kawaida.
- source_word: וְלֹא תִתֵּן לוֹ
  choice: nawe usimpe chochote
  rationale: Hueleza wazi matokeo ya kukataa kutoa, bila kuongeza aina maalumu ya msaada ambayo haikutajwa katika kishazi hiki.
- source_word: וְקָרָא עָלֶיךָ אֶל יְהוָה
  choice: Naye akimlilia Yahwe dhidi yako
  rationale: “Kumlilia ... dhidi yako” huhifadhi dhana ya mhitaji kumpelekea Mungu malalamiko au ombi la hukumu juu ya aliyemnyima.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: utakuwa na dhambi
  rationale: Hufuata kwa karibu usemi wa Kiebrania na kuacha wazi ikiwa mkazo ni kuwapo kwa hatia au dhambi kuhesabiwa kwa mtu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la agano יהוה; “Yahwe” hulitambulisha kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Kuhifadhi au kufafanua tamathali ya “jicho baya”
  choice: Kuhifadhi “jicho lako likawa baya” katika matini na kuifafanua katika tanbihi
  alternative: ukawa mchoyo kumwelekea
  rationale: Kuhifadhi tamathali kunadumisha umbo na uzito wa usemi wa Kiebrania, huku tanbihi ikifanya maana yake ieleweke kwa msomaji wa sasa.
- issue: Maana ya אָחִיךָ
  choice: ndugu yako
  alternative: Mwenzako Mwisraeli au mtu wa jamii yako
  rationale: “Ndugu” huhifadhi lugha ya kifamilia ya jumuiya ya agano bila kudai kwamba anayezungumziwa lazima awe ndugu wa tumbo moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa onyo umefanywa kuwa wa asili kwa Kiswahili, huku tamathali kuu ya Kiebrania na utata wa “maachilio” vikihifadhiwa na kufafanuliwa kwa tanbihi.
