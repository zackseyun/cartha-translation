  text: At the end of every seven years you shall make a release[a].
translation:
  language: sw
  text: Mwishoni mwa kila kipindi cha miaka saba, utafanya maondoleo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “msamaha” au “kuachiliwa”; neno la Kiebrania שְׁמִטָּה linamaanisha maondoleo yanayotekelezwa katika sheria ya mwaka wa saba kuhusu madeni.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ
  choice: baada ya
  rationale: Katika muundo מִקֵּץ שֶׁבַע שָׁנִים, maana ya wakati inaweza kutolewa kwa Kiswahili cha kawaida kama “baada ya miaka saba.” Hii inahifadhi wazo la kufikia mwisho wa kipindi bila kulazimisha wakati sahihi zaidi ya unaosemwa na Kiebrania.
- source_word: שֶׁבַע שָׁנִים
  choice: kila ... miaka saba
  rationale: Kiebrania kinasema kihalisi “miaka saba,” lakini sheria hii ni ya mzunguko unaorudiwa; “kila baada ya miaka saba” huwasilisha hali hiyo kwa Kiswahili cha kawaida.
- source_word: תַּעֲשֶׂה
  choice: utafanya
  rationale: Kitenzi עשה kina maana pana ya kufanya au kutekeleza. “Utafanya” huhifadhi muundo na nguvu ya agizo la kisheria bila kuongeza ufafanuzi usio katika mstari huu.
- source_word: שְׁמִטָּה
  choice: maondoleo
  rationale: Neno hili humaanisha kuachilia au kuondoa dai, na katika muktadha huu linahusu mpango wa mwaka wa saba wa kuachilia madeni. “Maondoleo” ni neno fupi na lenye hadhi linaloruhusu mistari inayofuata kufafanua kinachoondolewa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “kila baada ya miaka saba” ni wa kawaida na unaonyesha mzunguko wa sheria. “Maondoleo” linahifadhi upana wa istilahi ya Kiebrania, huku tanbihi ikitoa mbadala na kutaja muktadha wa madeni.
