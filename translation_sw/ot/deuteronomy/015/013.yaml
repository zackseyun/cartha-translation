  text: And when you send him away free from you[a], you shall not send him away empty-handed.
translation:
  language: sw
  text: Na utakapomwacha aende huru kutoka kwako[a], usimwache aende mikono mitupu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na ikiwa utamwacha aende huru kutoka kwako.” Kiunganishi cha Kiebrania kinaweza kueleweka kama cha sharti (“ikiwa”) au cha wakati (“utakapomwacha”).
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כִֽי
  choice: Na utakapomwacha
  rationale: Muungano huu unaweza kuwa wa wakati (‘utakapokuwa’) au wa sharti (‘ikiwa’). Katika sheria hii, tukio la kuachiliwa linatazamiwa, hivyo ‘utakapomwacha’ ni la kawaida na huhifadhi uhusiano na agizo lililotangulia.
- source_word: תְשַׁלְּחֶנּוּ
  choice: umwache aende
  rationale: Kitenzi שלח katika Piel chenye kiambishi cha nafsi ya tatu ya kiume umoja kina maana ya kumruhusu au kumtuma aende. ‘Umwache aende’ ni Kiswahili cha kawaida katika muktadha wa kumweka mtumishi huru na kinaweza kurudiwa katika sehemu zote mbili.
- source_word: חָפְשִׁי
  choice: huru
  rationale: Kivumishi hiki humaanisha mtu aliye huru, hasa kinyume cha utumwa au utumishi wa lazima. ‘Huru’ ni tafsiri fupi na ya moja kwa moja.
- source_word: מֵעִמָּךְ
  choice: kutoka kwako
  rationale: Maana halisi ni ‘kutoka pamoja nawe.’ ‘Kutoka kwako’ huhifadhi usemi wa Kiebrania bila kuongeza ufafanuzi kama ‘kutoka katika utumishi wako.’
- source_word: לֹא
  choice: usi-
  rationale: Kikanushi pamoja na kitenzi kisichotimilika kina nguvu ya katazo katika sheria ya agano. Muundo wa Kiswahili ‘usimwache’ unatoa katazo hilo kwa kawaida.
- source_word: רֵיקָם
  choice: mikono mitupu
  rationale: Kielezi hiki humaanisha ‘bila kitu’ au ‘mikono mitupu.’ Katika muktadha wa kumpa mahitaji mtu anapoondoka, nahau ‘mikono mitupu’ ni wazi na ya kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Marudio ya ‘umwache aende’ yanahifadhi marudio ya kitenzi cha Kiebrania, huku ‘mikono mitupu’ ikitoa nahau ya asili ya Kiswahili.
