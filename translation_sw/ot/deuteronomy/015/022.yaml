base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/022.yaml
  text: You may eat it within your gates[a]; the unclean and the clean alike may eat it[b], as the gazelle and the deer.
translation:
  language: sw
  text: Unaweza kumla ndani ya miji yako[a]. Mtu aliye najisi na mtu aliye safi wanaweza kumla wote wawili[b], kama vile swala na kulungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ndani ya malango yako,” usemi unaomaanisha katika miji yako au jumuiya za eneo lako.'
    reason: cultural_note
  - marker: b
    text: Yaani, mtu aliye katika hali ya unajisi wa kiibada na mtu aliye safi kiibada wote wawili wanaruhusiwa kumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁעָרֶיךָ
  choice: ndani ya miji yako
  rationale: Ingawa maana ya moja kwa moja ni ‘ndani ya malango yako,’ huu ni usemi unaomaanisha miji au jumuiya za mahali. Tafsiri hii inatoa maana hiyo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi taswira ya Kiebrania.
- source_word: תֹּאכֲלֶנּוּ
  choice: Unaweza kumla
  rationale: Kitenzi cha nafsi ya pili umoja pamoja na kiambishi cha yambwa cha kiume kinarejelea mnyama aliyetajwa katika muktadha uliotangulia. ‘Unaweza’ linaonyesha ruhusa katika muktadha huu.
- source_word: הַטָּמֵא
  choice: mtu aliye najisi
  rationale: Neno linahusu hali ya kinajisi kidini, si uovu wa kimaadili. Kumtaja ‘mtu’ kwa wazi kunafanya sentensi iwe ya kawaida na isiyo na utata kwa Kiswahili.
- source_word: וְהַטָּהוֹר
  choice: aliye safi
  rationale: Linaonyesha hali ya usafi wa kidini na linadumisha ulinganifu na ‘aliye najisi.’
- source_word: יַחְדָּו
  choice: vivyo hivyo
  rationale: Katika muktadha huu neno linaonyesha kuwa watu wa hali zote mbili wanaruhusiwa kula bila tofauti, si lazima wale kwa wakati mmoja.
- source_word: כַּצְּבִי
  choice: kama swala
  rationale: צְבִי humaanisha swala, mnyama wa porini anayejulikana katika Afrika Mashariki.
- source_word: וְכָאַיָּל
  choice: na kulungu
  rationale: אַיָּל humaanisha mnyama wa jamii ya kulungu, mara nyingi dume; ‘kulungu’ ni neno pana na linaloeleweka katika Kiswahili cha sasa.
theological_decisions:
- issue: Maana ya ‘najisi’ na ‘safi’
  choice: Kutafsiri kama hali ya watu ya kidini, si tabia ya kimaadili
  alternative: Kutumia ‘waovu’ na ‘wema’ au kuacha nomino bila kufafanua kuwa ni watu
  rationale: Jozi ya maneno הַטָּמֵא / הַטָּהוֹר katika sheria hii inahusu hali ya utakaso wa kidini. Tafsiri na tanbihi huepuka kuigeuza kuwa hukumu ya maadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Ndani ya miji yako’ ni ya asili zaidi kuliko tafsiri sisisi ya ‘ndani ya malango yako’; taswira ya asili imehifadhiwa katika tanbihi. Viwakilishi vya ngeli ya M-WA vinaonyesha wazi kuwa ‘najisi’ na ‘safi’ ni watu.
