base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/018.yaml
  text: It shall not seem hard to you when you send him away free from you[a], because for six years he has served you for double the wages of a hired worker; and Yahweh your God will bless you in all that you do.
translation:
  language: sw
  text: Usione kuwa ni jambo gumu unapomwacha aende huru kutoka kwako, kwa maana amekutumikia kwa miaka sita kwa thamani ya mara mbili ya ujira wa mfanyakazi aliyeajiriwa.[a] Naye Yahwe Mungu wako atakubariki katika yote utakayofanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maradufu ya ujira wa mfanyakazi aliyeajiriwa.” Usemi wa Kiebrania unalinganisha thamani ya miaka yake sita ya utumishi na thamani ya kazi ya mfanyakazi aliyeajiriwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְשֶׁה בְעֵינֶיךָ
  choice: Usione kuwa ni jambo gumu
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kwamba jambo lionekane zito, lenye kuudhi, au la kusikitisha kwa mtu. Tafsiri hii huhifadhi mtazamo wa mhusika huku ikiwa Kiswahili cha kawaida.
- source_word: בְּשַׁלֵּחֲךָ אֹתוֹ חָפְשִׁי מֵעִמָּךְ
  choice: unapomwacha aende huru kutoka kwako
  rationale: Muundo wa kitenzi unaonyesha wakati au hali, yaani “unapomwacha”; חָפְשִׁי humaanisha hali halisi ya kuwa huru. “Kutoka kwako” huhifadhi uhusiano wa moja kwa moja bila kuongeza “utumishi” au “nyumba” ambayo haikutajwa wazi.
- source_word: מִשְׁנֶה שְׂכַר שָׂכִיר
  choice: kwa thamani ya mara mbili ya ujira wa mfanyakazi wa kuajiriwa
  rationale: מִשְׁנֶה huonyesha kiasi maradufu, na שְׂכַר שָׂכִיר ni ujira wa mfanyakazi aliyeajiriwa. Kuongeza “kwa thamani ya” huonyesha kwamba kinacholinganishwa ni thamani ya utumishi wake, wala si kwamba mtumishi huyo alilipwa ujira maradufu.
- source_word: עֲבָדְךָ שֵׁשׁ שָׁנִים
  choice: amekutumikia kwa miaka sita
  rationale: Umbo hili linafanya kazi kama kitenzi, “amekutumikia,” na miaka sita ni muda wa utumishi. Hali yake ya utumwa wa deni inaeleweka kutokana na sheria inayozunguka mstari huu.
- source_word: וּבֵרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: Naye Yahwe Mungu wako atakubariki
  rationale: Kifungu hiki ni ahadi ya baraka ya wakati ujao. Jina la agano יהוה limetolewa kama “Yahwe,” umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: בְּכֹל אֲשֶׁר תַּעֲשֶׂה
  choice: katika yote utakayofanya
  rationale: Hii huhifadhi upana wa usemi wa Kiebrania unaohusu kazi na shughuli zote za mhusika.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la agano moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, na ni tahajia inayofaa Kiswahili.
- issue: Kama kutaja wazi hali ya utumwa katika עֲבָדְךָ
  choice: amekutumikia
  alternative: mtumwa wako amekutumikia; mtumishi wako amekutumikia
  rationale: Katika mstari huu umbo la Kiebrania linasisitiza kitendo cha kutumikia. Muktadha wa sheria tayari unaonyesha hali ya mtu huyo, hivyo tafsiri ya kitenzi huepuka kuongeza jina lenye maana finyu kuliko ilivyo lazima.
- issue: Maana ya thamani maradufu ya utumishi
  choice: kwa thamani ya mara mbili ya ujira wa mfanyakazi wa kuajiriwa
  alternative: kwa ujira mara mbili wa mfanyakazi wa kuajiriwa
  rationale: Kifungu kinaweza kusomwa kwa kubana zaidi kama kiasi maradufu cha ujira, lakini mantiki yake inalinganisha thamani ya miaka sita ya utumishi na kazi ya mtu wa kuajiriwa. Tanbihi huhifadhi uwezekano wa tafsiri ya karibu zaidi na muundo wa maneno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo “Usione kuwa ni jambo gumu” unatoa nahau ya Kiebrania kwa njia ya asili, huku “aende huru” ikihifadhi maana ya kisheria ya kuachiliwa.
