  text: כָּֽל הַ/בְּכ֡וֹר אֲשֶׁר֩ יִוָּלֵ֨ד בִּ/בְקָרְ/ךָ֤ וּ/בְ/צֹֽאנְ/ךָ֙ הַ/זָּכָ֔ר תַּקְדִּ֖ישׁ לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹ֤א תַעֲבֹד֙ בִּ/בְכֹ֣ר שׁוֹרֶ֔/ךָ וְ/לֹ֥א תָגֹ֖ז בְּכ֥וֹר צֹאנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/019.yaml
  text: Every firstborn male that is born among your herd and among your flock you shall consecrate to Yahweh your God[a]. You shall not work with the firstborn of your ox[b], nor shear the firstborn of your flock.
translation:
  language: sw
  text: Kila mzaliwa wa kwanza wa kiume atakayezaliwa katika kundi lako la ng’ombe na katika kundi lako la kondoo na mbuzi, utamweka wakfu kwa Yahweh Mungu wako. Usimtumie mzaliwa wa kwanza wa ng’ombe wako kufanya kazi, wala usimnyoe mzaliwa wa kwanza wa kundi lako la kondoo na mbuzi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַבְּכוֹר
  choice: Kila mzaliwa wa kwanza
  rationale: כָּל pamoja na nomino ya umoja ina maana ya kugawa kwa kila mmoja; “kila” ni ya asili na sahihi kuliko muundo wa kijumla “wazaliwa wote wa kwanza.”
- source_word: אֲשֶׁר יִוָּלֵד
  choice: atakayezaliwa
  rationale: Niphal ya ילד inaeleza mnyama anayezaliwa; muundo huu wa Kiswahili huhifadhi maana ya kutendwa na unaendana na rejeo la baadaye katika sheria.
- source_word: בִּבְקָרְךָ וּבְצֹאנְךָ
  choice: katika kundi lako la ng’ombe na katika kundi lako la kondoo na mbuzi
  rationale: בקר ni mifugo mikubwa, hasa ng’ombe, ilhali צאן ni mifugo midogo inayojumuisha kondoo na mbuzi. Kutaja makundi yote mawili kunahifadhi tofauti ya Kiebrania bila kuifanya צאן kuwa kondoo pekee.
- source_word: הַזָּכָר
  choice: wa kiume
  rationale: Kivumishi hiki kinaweka wazi kuwa agizo linahusu wazaliwa wa kwanza wa jinsia ya kiume.
- source_word: תַּקְדִּישׁ
  choice: utamweka wakfu
  rationale: Hiphil ya קדש humaanisha kutenga kuwa mtakatifu au kuweka wakfu. “Kumweka wakfu” ni lugha ya sasa, yenye heshima, na huhifadhi maana ya ibada.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: kwa Yahwe Mungu wako
  rationale: Jina la agano יהוה limetafsiriwa moja kwa moja kuwa “Yahwe”; kihusishi ל kinaonyesha kwamba mnyama anawekwa wakfu kwa Mungu.
- source_word: לֹא תַעֲבֹד בִּבְכֹר שׁוֹרֶךָ
  choice: Usimtumie mzaliwa wa kwanza wa ng’ombe wako kufanya kazi
  rationale: עבד pamoja na ב hapa hukataza kumtumia mnyama kwa kazi. Muundo huu ni wa kawaida zaidi katika Kiswahili kuliko “usifanye kazi naye” na huepuka utata kuhusu mtendaji wa kazi.
- source_word: שׁוֹר
  choice: ng’ombe
  rationale: שׁוֹר humaanisha mnyama wa jamii ya ng’ombe, mara nyingi anayetumiwa kwa kazi. “Ng’ombe” ni pana na ya kawaida; “maksai” ingeongeza wazo la kuhasiwa ambalo halimo katika neno lenyewe.
- source_word: וְלֹא תָגֹז בְּכוֹר צֹאנֶךָ
  choice: wala usimnyoe mzaliwa wa kwanza wa kundi lako la kondoo na mbuzi
  rationale: גזז ni kunyoa manyoya. “Wala” huunganisha marufuku ya pili, na “kondoo na mbuzi” huhifadhi upana wa צאן hata ingawa unyoaji unahusishwa hasa na kondoo.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina la agano יהוה. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo, bila kutumia umbo “Yehova” lenye historia tofauti ya matamshi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Nimetumia “kundi la kondoo na mbuzi” kwa צאן ili msomaji wa kawaida aelewe kuwa neno hilo linahusu mifugo midogo kwa upana. Hakuna tanbihi iliyohitajika; tanbihi za Kiingereza zilizotolewa zinaonekana kutolingana na viashirio vya matini, hivyo hazijahamishwa.
