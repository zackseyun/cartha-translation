base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/020.yaml
  text: You and your household shall eat it before Yahweh your God year by year in the place that Yahweh will choose[a].
translation:
  language: sw
  text: Wewe na watu wa nyumbani mwako mtakula mbele za Yahwe Mungu wako[a], mwaka baada ya mwaka, mahali atakapochagua Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika uwepo wa Yahwe Mungu wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: mbele za
  rationale: Nahau hii humaanisha kuwa mbele ya mtu au katika uwepo wake. “Mbele za” ni ya asili katika Kiswahili na inadumisha maana ya kula katika uwepo wa Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Muundo huu wenye kiambishi cha nafsi ya pili umoja unamaanisha moja kwa moja “Mungu wako” na kudumisha usemi wa agano.
- source_word: תֹאכֲלֶנּוּ
  choice: mtamla
  rationale: Kitenzi kinarejelea mnyama mzaliwa wa kwanza aliyetajwa katika muktadha. Upatanisho wa wingi umetumiwa kwa Kiswahili cha kawaida kwa sababu kiima kamili ni “wewe pamoja na watu wa nyumbani mwako,” huku kiambishi -m- kikirejelea mnyama mmoja.
- source_word: שָׁנָה בְּשָׁנָה
  choice: mwaka baada ya mwaka
  rationale: Usemi huu unaonyesha tendo linalorudiwa kila mwaka na pia unahifadhi mpigo wa usemi wa Kiebrania.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: mahali atakapopachagua Yahwe
  rationale: Tafsiri hii inadumisha usemi wa Kumbukumbu la Torati kuhusu mahali pa ibada atakapochagua Yahwe na pia nguvu ya wakati ujao ya kitenzi.
- source_word: אַתָּה וּבֵיתֶךָ
  choice: Wewe pamoja na watu wa nyumbani mwako
  rationale: “Watu wa nyumbani mwako” huonyesha jamaa na wengine wa kaya, si jengo tu, bila kuifanya בית iwe na maana finyu ya familia ya damu pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko lina jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi kama jina la agano bila kulibadilisha kuwa “BWANA.”
- issue: Maana ya kula לִפְנֵי Yahwe
  choice: mbele za Yahwe
  alternative: katika uwepo wa Yahwe
  rationale: “Mbele za” inadumisha nahau ya Kiebrania na maana yake ya ibada bila kufafanua zaidi namna ya uwepo huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Muundo wa sheria umehifadhiwa bila kuwa mzito; “mwaka baada ya mwaka” inadumisha msisitizo wa kurudiwa kila mwaka.
