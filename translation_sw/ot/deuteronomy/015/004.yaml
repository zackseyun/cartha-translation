  text: אֶ֕פֶס כִּ֛י לֹ֥א יִֽהְיֶה בְּ/ךָ֖ אֶבְי֑וֹן כִּֽי בָרֵ֤ךְ יְבָֽרֶכְ/ךָ֙ יְהוָ֔ה בָּ/אָ֕רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹֽתֵן לְ/ךָ֥ נַחֲלָ֖ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/004.yaml
  text: However[a], there should be no poor among you, because Yahweh will surely bless you in the land that Yahweh your God is giving you as an inheritance to possess,
translation:
  language: sw
  text: Hata hivyo[a], hatakuwapo maskini miongoni mwenu, kwa sababu Yahweh hakika atawabariki katika nchi ambayo Yahweh, Mungu wenu, anawapa kuwa urithi ili kuimiliki,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lakini” au “Isipokuwa kwamba.” Neno la Kiebrania linaweka kikomo au sifa kwa agizo lililotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס
  choice: Hata hivyo
  rationale: Katika muktadha huu neno hili linaweka kikomo au sifa kwa agizo lililotangulia kuhusu kufuta madeni. “Hata hivyo” linaonyesha mgeuko huo kwa Kiswahili cha kawaida bila kuongeza ukinzani mkali mno.
- source_word: אֶבְיוֹן
  choice: maskini
  rationale: Neno hili humaanisha mtu maskini au mwenye uhitaji wa kiuchumi. “Maskini” ni neno la kawaida na pana linalofaa hapa.
- source_word: כִּי
  choice: kwa sababu
  rationale: 'כִּי ya pili inaanzisha sababu ya kutokuwapo maskini: baraka ya Yahwe.'
- source_word: בָרֵךְ יְבָרֶכְךָ
  choice: hakika atawabariki
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi chenye ukomo unasisitiza tendo. “Hakika atawabariki” huhifadhi msisitizo huo bila kuongeza wazo la utajiri au wingi lisilotajwa wazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetafsiriwa kwa kulitamka kama jina binafsi, badala ya kulibadilisha kuwa cheo.
- source_word: נֹתֵן
  choice: anawapa
  rationale: Hali ya kitenzi-shirikishi inaonyesha tendo linaloendelea au lililo karibu kutimizwa; “anawapa” ni ya asili katika muktadha wa nchi iliyoahidiwa.
- source_word: נַחֲלָה
  choice: urithi
  rationale: Ni neno la kawaida la agano kwa sehemu ya nchi iliyogawiwa kama urithi, likiwa na maana ya kisheria na kitheolojia.
- source_word: לְרִשְׁתָּהּ
  choice: ili muimiliki
  rationale: Kitenzi ירשׁ hapa kina maana ya kuichukua nchi na kuimiliki. Tafsiri hii inaeleza kusudi kwa Kiswahili cha kawaida na kuhifadhi rejeo la nchi.
theological_decisions:
- issue: Namna ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Aya inatumia jina binafsi la Mungu moja kwa moja. “Yahwe” huhifadhi jina hilo la agano badala ya kulibadilisha kuwa cheo.
- issue: Kauli kuhusu kutokuwapo kwa maskini
  choice: hatakuwapo maskini
  alternative: asiwepo maskini
  rationale: Kiebrania kina kauli ya moja kwa moja ya wakati usiotimilika, inayounganishwa na ahadi ya baraka. Tafsiri hii huiwasilisha kama matokeo yanayotarajiwa bila kuibadilisha waziwazi kuwa amri, huku muktadha unaofuata ukieleza masharti ya baraka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Wingi umetumiwa kwa “miongoni mwenu” na “atawabariki” ili kuwasilisha kwa kawaida umoja wa Kiebrania unaoliwakilisha taifa kwa jumla. Alama ya koma mwishoni imehifadhiwa kwa kuwa sentensi inaendelea katika aya inayofuata.
