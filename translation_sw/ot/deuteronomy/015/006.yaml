source:
  edition: WLC
  text: כִּֽי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בֵּֽרַכְ/ךָ֔ כַּ/אֲשֶׁ֖ר דִּבֶּר לָ֑/ךְ וְ/הַֽעֲבַטְתָּ֞ גּוֹיִ֣ם רַבִּ֗ים וְ/אַתָּה֙ לֹ֣א תַעֲבֹ֔ט וּ/מָֽשַׁלְתָּ֙ בְּ/גוֹיִ֣ם רַבִּ֔ים וּ/בְ/ךָ֖ לֹ֥א יִמְשֹֽׁלוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/006.yaml
  text: For Yahweh your God has blessed you just as he promised you[a], and you will lend to many nations, but you will not borrow; and you will rule over many nations, but they will not rule over you.
translation:
  language: sw
  text: Kwa maana Yahwe Mungu wako amekubariki kama alivyokuahidi[a]. Utayakopesha mataifa mengi, lakini wewe hutakopa; utayatawala mataifa mengi, lakini hayo hayatakutawala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama alivyokuambia.” Kiebrania hutumia kitenzi chenye maana ya “alisema” au “alinena”; lakini katika muktadha huu wa agano maneno hayo yana maana ya ahadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: בֵּרַכְךָ
  choice: amekubariki
  rationale: Kauli timilifu ya Kiebrania imehifadhiwa; baraka iliyotolewa ndiyo msingi wa matokeo yanayofuata.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: kama alivyokuahidi
  rationale: Ingawa דִּבֶּר kimsingi ni “alisema/alinena,” katika muktadha huu wa agano usemi huo una nguvu ya ahadi; tanbihi inahifadhi maana halisi ya neno.
- source_word: וְהַעֲבַטְתָּ
  choice: utayakopesha
  rationale: Hifili ya עבט ina maana ya kutoa mkopo. “Utayakopesha” ni ya kawaida na inatofautiana wazi na “hutakopa.”
- source_word: גּוֹיִם רַבִּים
  choice: mataifa mengi
  rationale: Katika muktadha wa kiuchumi na kisiasa, גּוֹיִם inarejelea mataifa, si lazima watu wasio Wayahudi kwa maana ya kidini.
- source_word: לֹא תַעֲבֹט
  choice: hutakopa
  rationale: Kauli ya kawaida ya עבט hapa ina maana ya kuchukua mkopo na inaunda ulinganifu wa moja kwa moja na kukopesha.
- source_word: וּמָשַׁלְתָּ
  choice: utayatawala
  rationale: מָשַׁל humaanisha kutawala au kuwa na mamlaka juu ya mwingine; “kutawala” ni wazi na yenye hadhi katika Kiswahili.
- source_word: וּבְךָ לֹא יִמְשֹׁלוּ
  choice: lakini hayo hayatakutawala
  rationale: “Hayo” yanarejelea wazi mataifa mengi yaliyotangulia na kuhifadhi ulinganifu wa sentensi ya Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. “Yahwe” huhifadhi jina hilo kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- issue: Maana ya דִּבֶּר katika muktadha wa agano
  choice: alivyokuahidi
  alternative: alivyokuambia
  rationale: “Kuahidi” huwasilisha nguvu ya usemi wa Mungu katika muktadha huu bila kuondoa maana halisi; mbadala wa karibu zaidi na umbo la Kiebrania umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nafsi ya pili umoja imehifadhiwa kwa sababu Israeli inasemeshwa kama jumuiya moja. Ulinganifu kati ya kukopesha/kukopa na kutawala/kutotawaliwa umewekwa wazi.
