  yaml_path: translation/ot/deuteronomy/015/016.yaml
  text: And if he says to you[a], ‘I will not go out from you,’ because he loves you and your household, because it is good for him with you[b],
translation:
  language: sw
  text: Na ikiwa atakuambia, “Sitaondoka kwako[a],” kwa sababu anakupenda wewe na watu wa nyumbani mwako[b], kwa sababu ana hali nzuri akiwa nawe,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa hali ya karibu zaidi na Kiebrania: “Sitatoka kwako,” yaani, “Sitaacha kuwa nawe.” Katika muktadha huu inaweza pia kutafsiriwa, “Sitakuacha” au “Sitaondoka huru.”'
    reason: lexical_alternative
  - marker: b
    text: “Watu wa nyumbani” hutafsiri “nyumba” hapa kwa maana ya watu na maisha ya nyumbani kama kitengo kimoja, si jengo peke yake.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Na ikitokea kwamba
  rationale: Hii ni fomula ya kuanzisha hali inayoweza kutokea katika sheria. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha mtiririko wa sharti bila kufuata kwa ugumu muundo wa Kiebrania.
- source_word: יֹאמַר אֵלֶיךָ
  choice: atakuambia
  rationale: Kauli ya wakati ujao inafaa kwa hali ya kisheria inayotazamiwa na inawasilisha moja kwa moja maneno yatakayosemwa.
- source_word: לֹא אֵצֵא מֵעִמָּךְ
  choice: Sitaondoka kwako
  rationale: Kitenzi יָצָא kimsingi ni ‘kutoka,’ lakini hapa kinamaanisha kuondoka kwa mtumwa anapoachiliwa. ‘Sitaondoka kwako’ ni Kiswahili cha kawaida na bado kinadumisha wazo la kujitenga na bwana wake.
- source_word: כִּי אֲהֵבְךָ
  choice: kwa sababu anakupenda wewe
  rationale: כִּי inaonyesha sababu. Kiwakilishi ‘wewe’ kinaweka wazi na kusisitiza yule anayependwa, sawasawa na kiambishi cha Kiebrania.
- source_word: וְאֶת בֵּיתֶךָ
  choice: na nyumba yako
  rationale: בַּיִת inaweza kumaanisha jengo au jumuiya ya nyumbani. ‘Nyumba yako’ ni usemi wa kawaida wa Kiswahili unaoweza kubeba maana pana ya watu wa nyumbani bila kuibana kuwa familia ya damu pekee.
- source_word: כִּי טוֹב לוֹ עִמָּךְ
  choice: na kwa sababu ana hali nzuri akiwa pamoja nawe
  rationale: Tafsiri hii inaeleza kwa Kiswahili cha kawaida kwamba mambo yanamwendea vizuri akiwa na bwana wake, huku ikidumisha wazo la Kiebrania la kuwa pamoja naye.
