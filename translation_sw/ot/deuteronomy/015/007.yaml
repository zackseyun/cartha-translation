source:
  edition: WLC
  text: כִּֽי יִהְיֶה֩ בְ/ךָ֨ אֶבְי֜וֹן מֵ/אַחַ֤ד אַחֶ֨י/ךָ֙ בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ בְּ/אַ֨רְצְ/ךָ֔ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ לֹ֧א תְאַמֵּ֣ץ אֶת לְבָבְ/ךָ֗ וְ/לֹ֤א תִקְפֹּץ֙ אֶת יָ֣דְ/ךָ֔ מֵ/אָחִ֖י/ךָ הָ/אֶבְיֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/007.yaml
  text: If there is a poor man among you[a], one of your brothers, within one of your gates in your land that Yahweh your God is giving you[b], you shall not harden your heart or shut your hand against your poor brother.
translation:
  language: sw
  text: Ikiwa miongoni mwenu kuna mtu maskini, mmoja wa ndugu zako, katika mojawapo ya malango yako[a], katika nchi ambayo Yahwe Mungu wako anakupa, usifanye moyo wako kuwa mgumu wala usiufunge mkono wako ili umnyime ndugu yako maskini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika mojawapo ya miji yako”; kwa neno halisi, “katika mojawapo ya malango yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: Ikiwa ... kuna
  rationale: Muundo huu unaonyesha hali ya masharti katika sheria. “Ikiwa” huhifadhi uwezekano wa maana ya ‘if,’ bila kuibadili kimya kimya kuwa kauli ya wakati kama ‘wakati.’
- source_word: אֶבְיוֹן
  choice: mtu maskini
  rationale: Neno hili humaanisha mtu aliye maskini au mwenye uhitaji. “Mtu maskini” ni Kiswahili cha kawaida na wazi, huku umoja wa mhusika ukihifadhiwa.
- source_word: מֵאַחַד אַחֶיךָ
  choice: mmoja wa ndugu zako
  rationale: Tafsiri hii huhifadhi lugha ya kifamilia inayotumiwa kwa mshiriki wa jumuiya ya agano, badala ya kuifafanua moja kwa moja kuwa ‘Mwisraeli mwenzako.’
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: katika mojawapo ya malango yako
  rationale: Huhifadhi taswira halisi ya Kiebrania ya ‘malango,’ ambayo pia inaweza kumaanisha mji au makao yanayohusishwa na lango hilo; maana hiyo imeelezwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa namna ya Kiswahili inayokaribia matamshi ya Tetragramatoni, badala ya kubadilishwa kuwa cheo.
- source_word: נֹתֵן לָךְ
  choice: anakupa
  rationale: Wakati wa sasa unaendelea huhifadhi umbo la Kiebrania linaloonyesha nchi kama zawadi ambayo Mungu anampa Israeli.
- source_word: לֹא תְאַמֵּץ אֶת לְבָבְךָ
  choice: usifanye moyo wako kuwa mgumu
  rationale: Huhifadhi sitiari ya moyo mgumu na kutoa kwa uwazi nguvu ya katazo la Kiebrania.
- source_word: וְלֹא תִקְפֹּץ אֶת יָדְךָ
  choice: wala usimfumbie mkono wako
  rationale: Kitenzi kinaonyesha kufunga mkono ili kutotoa msaada. “Kumfumbia mkono” ni usemi wa Kiswahili unaohifadhi taswira hiyo na maana ya kumnyima.
- source_word: מֵאָחִיךָ הָאֶבְיוֹן
  choice: ndugu yako maskini
  rationale: Huhifadhi umoja, lugha ya undugu, na hali ya umaskini ya anayehitaji msaada.
theological_decisions:
- issue: Lugha ya undugu wa agano אַחֶיךָ / אָחִיךָ
  choice: ndugu zako / ndugu yako
  alternative: jamaa zako / Mwisraeli mwenzako
  rationale: Kiebrania hutumia lugha ya kifamilia kusisitiza wajibu kwa watu wa jumuiya ya agano. Tafsiri haipanui wala kupunguza kundi hilo kimya kimya; tanbihi inaeleza matumizi yake ya kijamii.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: “Yahwe” huhifadhi jina binafsi lililo katika matini ya Kiebrania na kulitofautisha na cheo cha kawaida cha ‘Bwana.’
- issue: Taswira ya moyo na mkono
  choice: moyo kuwa mgumu; kumfumbia mkono
  alternative: kutokuwa na huruma; kukataa kusaidia
  rationale: Taswira za ndani na nje—moyo usio na huruma na mkono usiotoa—zimehifadhiwa kwa sababu zina uzito wa kimaadili na kifasihi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imebaki katika mtindo wa sheria ya masharti, huku taswira za Kiebrania za lango, moyo, na mkono zikihifadhiwa pale zinapoeleweka kwa msomaji wa kawaida.
