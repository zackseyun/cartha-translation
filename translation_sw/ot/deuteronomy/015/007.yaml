- from: Ikiwa miongoni mwenu kuna mtu maskini, mmoja wa ndugu zako, katika mojawapo ya malango yako[a], katika nchi ambayo Yahwe Mungu wako anakupa, usifanye moyo wako kuwa mgumu wala usimfumbie mkono wako ndugu yako maskini[b].
  to: Ikiwa miongoni mwenu kuna mtu maskini, mmoja wa ndugu zako, katika mojawapo ya malango yako[a], katika nchi ambayo Yahwe Mungu wako anakupa, usifanye moyo wako kuwa mgumu wala usiufunge mkono wako ili umnyime ndugu yako maskini.
  rationale: 'The revision only clarifies the final Hebrew idiom: “usiufunge mkono wako” preserves its concrete image, while “ili umnyime” conveys the implied withholding from the poor covenant brother. Footnote b is retained as supplied, though it is not required to resolve a lexical ambiguity in the final clause.'
