review_pass:
  verdict: revise
  source_fidelity: Draft faithfully represents the conditional legal construction, covenant-kinship wording, gates/towns metonymy, the ongoing gift of the land, and the paired heart/hand imagery. The final hand clause needs adjustment because its current Swahili idiom can suggest making a fist at someone rather than withholding generosity.
  naturalness: The verse is otherwise clear and suitably formal in Standard East African Swahili. “Usimfumbie mkono wako ndugu yako” is syntactically and idiomatically less precise in this context. An explicit retained image of a closed hand followed by its practical sense is more natural and unambiguous.
  terminology: “Yahwe,” “Mungu wako,” “ndugu,” “moyo,” and “maskini” are appropriate. The footnotes correctly preserve the town sense of “gates” and explain the covenant-community force of the kinship language.
  issues:
  - severity: medium
    issue: The phrase “wala usimfumbie mkono wako ndugu yako maskini” is potentially misleading.
    rationale: In Swahili, kumfumbia mtu mkono may evoke a clenched fist or a gesture directed at someone, whereas the Hebrew idiom concerns closing one’s hand so as to withhold help. The recipient relation is also awkwardly expressed. Revising it should retain the hand image while making refusal of aid explicit.
  revised_text: Ikiwa miongoni mwenu kuna mtu maskini, mmoja wa ndugu zako, katika mojawapo ya malango yako[a], katika nchi ambayo Yahwe Mungu wako anakupa, usifanye moyo wako kuwa mgumu wala usiufunge mkono wako ili umnyime ndugu yako maskini.
  revised_footnotes:
  - marker: a
    text: Au “katika mojawapo ya miji yako”; kwa neno halisi, “katika mojawapo ya malango yako.”
    reason: lexical_alternative
  - marker: b
    text: Maneno “ndugu zako” na “ndugu yako” hapa ni lugha ya kifamilia inayowataja washiriki wenzao wa jumuiya ya agano.
    reason: cultural_note
  revision_rationale: 'The revision only clarifies the final Hebrew idiom: “usiufunge mkono wako” preserves its concrete image, while “ili umnyime” conveys the implied withholding from the poor covenant brother. Footnote b is retained as supplied, though it is not required to resolve a lexical ambiguity in the final clause.'
