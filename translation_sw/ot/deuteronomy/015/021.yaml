  yaml_path: translation/ot/deuteronomy/015/021.yaml
  text: But if it has a defect—being lame or blind[a], any bad defect—you shall not sacrifice it to Yahweh your God.
translation:
  language: sw
  text: Lakini ikiwa ina kasoro—iwe ni kiwete au kipofu, au kasoro yoyote mbaya[a]—usimtoe dhabihu kwa Yahweh Mungu wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kasoro yoyote mbaya.” Hapa “mbaya” hueleza kasoro inayomfanya mnyama asikubalike kwa dhabihu, si uovu wa kimaadili.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Lakini ikiwa
  rationale: Huanzisha sharti linalotofautiana na agizo lililotangulia kuhusu kumweka wakfu mzaliwa wa kwanza.
- source_word: יִהְיֶה בּוֹ מוּם
  choice: ana kasoro
  rationale: Kiebrania husema kihalisi ‘kuna ndani yake kasoro’; Kiswahili cha kawaida huonyesha hali hiyo kwa ‘ana kasoro.’
- source_word: פִּסֵּחַ
  choice: kilema
  rationale: Hueleza mnyama ambaye uwezo wake wa kutembea umeharibika, bila kuongeza aina maalumu ya ulemavu isiyotajwa katika chanzo.
- source_word: עִוֵּר
  choice: kipofu
  rationale: Ni neno la kawaida na la moja kwa moja kwa ukosefu wa uwezo wa kuona.
- source_word: כֹּל מוּם רָע
  choice: kasoro yoyote mbaya
  rationale: Inadumisha usemi mkali wa Kiebrania na upana wake; tanbihi inaeleza kwamba ‘mbaya’ hapa huhusu kasoro nzito au isiyokubalika kwa dhabihu, si uovu wa kimaadili.
- source_word: לֹא תִזְבָּחֶנּוּ
  choice: usimtoe dhabihu
  rationale: Ni katazo la moja kwa moja katika muktadha wa ibada, na kiambishi ‘-m-’ kinadumisha rejeleo kwa mnyama huyo.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: kwa Yahweh Mungu wako
  rationale: ‘Kwa’ huonyesha kwamba dhabihu ingetolewa kwa Mungu; jina la agano Yahweh na usemi wa moja kwa moja ‘Mungu wako’ vimedumishwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Chanzo kina jina maalumu la Mungu, YHWH; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya רָע katika ‘kasoro mbaya’
  choice: Kasoro nzito au isiyokubalika kwa dhabihu
  alternative: Kasoro yenye uovu wa kimaadili
  rationale: Katika sheria hii ya dhabihu, kivumishi kinaeleza ubaya au kutokubalika kwa hali ya kimwili ya mnyama, si hatia ya kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; ‘kilema’ na ‘kipofu’ hapa humrejelea mnyama anayezungumziwa katika muktadha.
