  yaml_path: translation/ot/deuteronomy/015/005.yaml
  text: if only you carefully listen to the voice of the LORD your God, being careful to do all this commandment that I am commanding you today.
translation:
  language: sw
  text: ikiwa tu utaisikiliza kwa makini sauti ya BWANA, Mungu wako, kwa kuzingatia kutenda amri hii yote ninayokuamuru leo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: utaisikiliza kwa makini
  rationale: Muundo wa kitenzi kisicho na kikomo pamoja na kitenzi kilichopinda unasisitiza kusikiliza kwa dhati; Kiswahili cha kawaida huonyesha msisitizo huo kwa ‘kwa makini’.
- source_word: בְּקוֹל
  choice: sauti
  rationale: Tafsiri ya moja kwa moja ya ‘sauti’; pamoja na ‘kusikiliza’ inadokeza pia kutii bila kuondoa taswira ya Kiebrania.
- source_word: יהוה
  choice: BWANA
  rationale: Jina la agano יהוה linawakilishwa kwa desturi ya Kiswahili ya herufi kubwa ‘BWANA’, bila kuongeza matamshi yasiyoandikwa katika maandishi ya konsonanti.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: ukitunza kutenda
  rationale: Huhifadhi maana mbili za kuwa mwangalifu/kutunza na kutekeleza kwa vitendo, badala ya kuziunganisha kuwa dhana moja tu.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: amri hii yote
  rationale: Umoja wa הַמִּצְוָה umehifadhiwa, huku כָּל ikitafsiriwa ‘yote’ kwa maana ya amri hii kwa ukamilifu wake.
- source_word: מְצַוְּךָ
  choice: ninayokuamuru
  rationale: Huhifadhi nafsi ya kwanza ya msemaji, tendo la sasa, na mtendewa wa umoja wa kiume bila kulazimisha jinsia katika Kiswahili.
theological_decisions:
- issue: Uhusiano wa baraka na utiifu katika kishazi cha masharti
  choice: ikiwa tu
  alternative: mradi
  rationale: רַק אִם inaweka sharti lenye msisitizo ndani ya muktadha; ‘ikiwa tu’ huhifadhi uzito huo bila kueleza zaidi mfumo wake wa kitheolojia.
- issue: Kusikiliza sauti ya Mungu kama kusikia au kutii
  choice: utaisikiliza kwa makini sauti
  alternative: utaitii kwa makini sauti
  rationale: Chaguo hili linahifadhi taswira na upana wa שׁמע—kusikiliza kunakolenga utiifu—bila kuifupisha kuwa ‘kutii’ pekee.
- issue: Umoja wa ‘amri’
  choice: amri hii yote
  alternative: amri hizi zote
  rationale: Maandishi ya Kiebrania yana umoja; umehifadhiwa ili kutoamua kama kifungu kinarejelea agizo hili kama jumla au mkusanyiko wa maagizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. Mpangilio umefanywa wa asili kwa Kiswahili huku msisitizo, umoja wa ‘amri’, na mvutano kati ya kusikiliza na kutii vikihifadhiwa.
