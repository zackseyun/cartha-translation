  text: וְ/זֶה֮ דְּבַ֣ר הַ/שְּׁמִטָּה֒ שָׁמ֗וֹט כָּל בַּ֨עַל֙ מַשֵּׁ֣ה יָד֔/וֹ אֲשֶׁ֥ר יַשֶּׁ֖ה בְּ/רֵעֵ֑/הוּ לֹֽא יִגֹּ֤שׂ אֶת רֵעֵ֨/הוּ֙ וְ/אֶת אָחִ֔י/ו כִּֽי קָרָ֥א שְׁמִטָּ֖ה לַֽ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/002.yaml
  text: 'And this is the matter of the release: every creditor shall release what his hand has lent to his neighbor[a]. He shall not press his neighbor or his brother[b], because a release to Yahweh has been proclaimed.'
translation:
  language: sw
  text: 'Na utaratibu wa maachilio ni huu: kila mkopeshaji aachilie dai lake la mkopo alilonalo kwa mwenzake[a]. Asimdai mwenzake wala ndugu yake[b], kwa sababu maachilio kwa Yahwe yametangazwa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “maachilio” (Kiebrania shemittah) hapa linamaanisha kuacha au kufuta madai ya deni katika mwaka wa saba.
    reason: lexical_alternative
  - marker: b
    text: “Ndugu” hapa humaanisha mwanajumuiya mwenzake wa agano; pia inaweza kutafsiriwa “Mwisraeli mwenzake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר הַשְּׁמִטָּה
  choice: utaratibu wa maachilio
  rationale: Katika muktadha huu דְּבַר hutaja sharti au utaratibu unaofafanuliwa, na שְׁמִטָּה ni kuachiliwa kwa madai ya deni katika mwaka wa saba.
- source_word: שָׁמוֹט
  choice: aachilie
  rationale: Kitenzi kinaagiza mkopeshaji aache dai lake; umbo hili la Kiswahili linatoa amri ya kisheria kwa kawaida bila kuiga kwa ugumu msisitizo wa Kiebrania.
- source_word: כָּל בַּעַל מַשֵּׁה יָדוֹ
  choice: kila mkopeshaji
  rationale: Nahau hii humaanisha kila mwenye haki ya kudai kutokana na mkopo. 'Mkopeshaji' ni neno la kawaida na sahihi la Kiswahili kwa jukumu hilo.
- source_word: אֲשֶׁר יַשֶּׁה בְּרֵעֵהוּ
  choice: deni alilomkopesha mwenzake
  rationale: Kisababishi יַשֶּׁה hapa kinahusu kutoa mkopo na hivyo kumfanya mwingine kuwa mdaiwa; tafsiri hii inaeleza maana hiyo kwa Kiswahili cha kawaida.
- source_word: לֹא יִגֹּשׂ
  choice: Asimdai
  rationale: Kitenzi kinamaanisha kumbana mdaiwa au kumtaka alipe. 'Asimdai' huhifadhi wazo kuu la kudai malipo bila kuongeza mbinu fulani ya shinikizo.
- source_word: רֵעֵהוּ
  choice: mwenzake
  rationale: רֵעַ humaanisha jirani, mwenzake, au mshirika wa kijamii; 'mwenzake' ni ya kawaida hapa na haidokezi tu mtu anayeishi karibu.
- source_word: אָחִיו
  choice: ndugu yake
  rationale: Hili ndilo neno la moja kwa moja la Kiebrania na katika sheria hii linamtaja mwanajumuiya mwenzao wa agano.
- source_word: כִּי קָרָא שְׁמִטָּה לַיהוָה
  choice: kwa sababu maachilio kwa Yahwe yametangazwa
  rationale: Kauli isiyo na mtendaji aliyetajwa inatolewa kwa hali ya kutendwa, na לַיהוָה inaachwa ikiwa na uhusiano mpana wa 'kwa Yahwe' badala ya kuufasiri kupita kiasi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko lina jina la agano יהוה; 'Yahwe' hulitaja kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya אָחִיו katika sheria ya kijamii
  choice: ndugu yake
  alternative: Mwisraeli mwenzake
  rationale: Tafsiri ya moja kwa moja huhifadhi picha ya udugu na umbo la kiume la chanzo, huku tanbihi ikifafanua matumizi yake mapana katika jumuiya ya agano.
- issue: Uhusiano unaoonyeshwa na לַיהוָה
  choice: kwa Yahwe
  alternative: kwa ajili ya Yahwe
  rationale: Kihusishi ל kinaweza kuonyesha kuelekezwa, manufaa, au uhusiano. 'Kwa Yahwe' huhifadhi upana huo bila kuamua ikiwa maachilio yametolewa kwake, ni kwa heshima yake, au ni yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. 'Utaratibu' huonyesha kwamba aya inaweka sharti la kisheria; 'maachilio' huhifadhi dhana ya kuacha madai badala ya kudokeza tu hisia ya kusamehe. Muundo wa pili wa 'mwenzake ... ndugu yake' umehifadhiwa ili kuonyesha msisitizo na upeo wa kijamii wa chanzo.
