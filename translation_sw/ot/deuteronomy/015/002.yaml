  to: 'Na utaratibu wa maachilio ni huu: kila mkopeshaji aachilie dai lake la mkopo alilonalo kwa mwenzake[a]. Asimdai mwenzake wala ndugu yake[b], kwa sababu maachilio kwa Yahwe yametangazwa.'
  rationale: 'The revision preserves the source’s formal debt-release terminology and legal force while correcting the Swahili collocation: the creditor releases a loan claim he has against his fellow, rather than a ‘debt he lent.’ The revised footnote clarifies the covenant-community sense of ‘ndugu’ without making that interpretive expansion in the main text.'
