    text: Neno “maachilio” (Kiebrania shemittah) hapa linamaanisha kuacha au kufuta madai ya deni katika mwaka wa saba.
    reason: lexical_alternative
  - marker: b
    text: “Ndugu” hapa humaanisha mwanajumuiya mwenzake wa agano; pia inaweza kutafsiriwa “Mwisraeli mwenzake.”
    reason: lexical_alternative
  revision_rationale: 'The revision preserves the source’s formal debt-release terminology and legal force while correcting the Swahili collocation: the creditor releases a loan claim he has against his fellow, rather than a ‘debt he lent.’ The revised footnote clarifies the covenant-community sense of ‘ndugu’ without making that interpretive expansion in the main text.'
