source:
  edition: WLC
  text: כִּ֛י לֹא יֶחְדַּ֥ל אֶבְי֖וֹן מִ/קֶּ֣רֶב הָ/אָ֑רֶץ עַל כֵּ֞ן אָנֹכִ֤י מְצַוְּ/ךָ֙ לֵ/אמֹ֔ר פָּ֠תֹחַ תִּפְתַּ֨ח אֶת יָדְ/ךָ֜ לְ/אָחִ֧י/ךָ לַ/עֲנִיֶּ֛/ךָ וּ/לְ/אֶבְיֹנְ/ךָ֖ בְּ/אַרְצֶֽ/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/011.yaml
  text: For the poor will never cease from the midst of the land[a]; therefore I am commanding you, saying, ‘You must surely open your hand to your brother, to your afflicted one[b], and to your poor one in your land.’
translation:
  language: sw
  text: 'Kwa maana maskini hawatakosekana kamwe katika nchi; kwa hiyo ninakuamuru hivi: “Ni lazima umfungulie kabisa ndugu yako[a] mkono wako, mnyonge wako[b], na mhitaji wako katika nchi yako.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mwisraeli mwenzako.” Kiebrania kinasema “ndugu yako,” kikitumia lugha ya undugu wa agano kwa maana ya kiwakilishi.
    reason: lexical_alternative
  - marker: b
    text: Neno lililotafsiriwa “mnyonge” linaweza kumaanisha mtu maskini, mnyonge, au anayeteseka; “maskini wako” au “mhitaji wako” pia yawezekana.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha kuwa kauli hii ndiyo sababu ya amri iliyotangulia, kwa mtiririko wa kawaida wa Kiswahili.
- source_word: לֹא יֶחְדַּל אֶבְיוֹן
  choice: maskini hawatakosekana kamwe
  rationale: Umoja wa Kiebrania umetumiwa kwa maana ya kundi kwa ujumla. Wingi wa Kiswahili unasikika kwa kawaida, huku “kamwe” ikisisitiza hali inayoendelea.
- source_word: מִקֶּרֶב הָאָרֶץ
  choice: nchini
  rationale: Muktadha wa Kumbukumbu la Torati unaelekeza kwenye nchi ya agano, wala si dunia yote. “Nchini” ni tafsiri ya kawaida ya wazo la kuwapo ndani ya nchi.
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Inahifadhi hitimisho linalotokana na kauli iliyotangulia.
- source_word: אָנֹכִי מְצַוְּךָ לֵאמֹר
  choice: ninakuamuru hivi
  rationale: Inaonyesha amri ya moja kwa moja na kutambulisha yaliyomo katika amri kwa Kiswahili cha kawaida, bila kuiga kwa ugumu neno la Kiebrania la kusema.
- source_word: פָּתֹחַ תִּפְתַּח
  choice: Ni lazima umfungulie kabisa
  rationale: Muundo wa kitenzi kilichorudiwa kwa msisitizo unaipa amri nguvu. “Ni lazima” na “kabisa” zinahifadhi ulazima na msisitizo huo.
- source_word: אֶת יָדְךָ
  choice: mkono wako
  rationale: Inahifadhi taswira ya Kiebrania ya kufungua mkono, yaani kuwa mkarimu.
- source_word: לְאָחִיךָ
  choice: ndugu yako
  rationale: Inahifadhi lugha ya undugu wa agano na umoja wa kiume wa matini, huku tanbihi ikifafanua matumizi yake ya kiwakilishi.
- source_word: לַעֲנִיֶּךָ
  choice: mwenye taabu wako
  rationale: עָנִי inaweza kumaanisha maskini, mnyonge, au mtu anayesumbuliwa. “Mwenye taabu” huhifadhi upana huo na kuitofautisha na אֶבְיוֹן.
- source_word: וּלְאֶבְיֹנְךָ
  choice: na mhitaji wako
  rationale: “Mhitaji” inaonyesha mtu mwenye uhitaji mkubwa na kudumisha tofauti ya msamiati kati ya אֶבְיוֹן na עָנִי katika kifungu hiki.
theological_decisions:
- issue: Lugha ya undugu yenye maana ya kiwakilishi
  choice: ndugu yako
  alternative: Mwisraeli mwenzako
  rationale: “Ndugu” inahifadhi picha ya uhusiano wa kifamilia na wa agano katika Kiebrania. Tanbihi inaeleza kuwa katika muktadha huu neno hilo linaweza kumwakilisha mwanajumuiya mwenzake.
- issue: Upeo wa הָאָרֶץ na אַרְצֶךָ
  choice: nchi / nchi yako
  alternative: dunia
  rationale: Muktadha wa karibu unahusu nchi ya agano. Tafsiri hii haibadili kauli hiyo iwe dai la moja kwa moja kuhusu dunia nzima.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Taswira ya “kufungua mkono” imehifadhiwa, na tofauti kati ya עָנִי na אֶבְיוֹן imeonyeshwa kwa “mwenye taabu” na “mhitaji.” Alama zote za tanbihi zimewekwa mahali zinapohusika katika matini.
