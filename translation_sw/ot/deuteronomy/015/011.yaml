review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the explanatory connection, the continuing presence of needy people within the land, the direct divine command, covenantal kinship term, and the paired designations for vulnerable persons. However, the placement and construction of the idiom for opening one''s hand are unclear in Swahili: “umfungulie kabisa mkono wako ndugu yako” can momentarily suggest that the brother is the direct object of the action rather than the beneficiary to whom the hand is opened.'
  naturalness: “Mwenye taabu wako” is understandable but is less idiomatic in this socioeconomic context and can suggest someone merely experiencing difficulties. “Mnyonge wako” is a more natural, suitably broad rendering of עָנִי alongside “mhitaji wako” for אֶבְיוֹן. Reordering the clause makes the retained hand-opening metaphor clear and natural.
  terminology: “Ndugu yako” appropriately retains the source's covenant-kinship wording, with a useful note on its representative sense. “Nchi” correctly reflects the covenant-land setting. “Mnyonge” and “mhitaji” preserve a modest distinction between the paired Hebrew terms without overstating it.
  issues:
  - severity: medium
    issue: Ambiguous and awkward word order in the generosity command
    rationale: The source commands opening one's hand to the brother, afflicted person, and needy person. In the draft, “umfungulie kabisa mkono wako ndugu yako” places the beneficiary after “mkono wako,” producing an unnatural and potentially unclear construction. Put “ndugu yako” immediately after the beneficiary-marking verb and retain “mkono wako” as its object.
  - severity: low
    issue: “Mwenye taabu” is less precise and less idiomatic for עָנִי here
    rationale: In this parallelism about material provision, “mwenye taabu” can refer broadly to a person in trouble. “Mnyonge” naturally covers the poor, lowly, or afflicted sense while remaining distinct from “mhitaji.”
  revised_text: 'Kwa maana maskini hawatakosekana kamwe katika nchi; kwa hiyo ninakuamuru hivi: “Ni lazima umfungulie kabisa ndugu yako[a] mkono wako, mnyonge wako[b], na mhitaji wako katika nchi yako.”'
