lexical_decisions:
- source_word: כִּי
  choice: Badala yake
  rationale: Katika muktadha huu, neno linaonyesha utofauti na katazo la kufanya moyo kuwa mgumu na kukataa katika mstari uliotangulia; “Badala yake” huonyesha uhusiano huo wazi na kwa Kiswahili cha kawaida.
- source_word: פָתֹחַ תִּפְתַּח
  choice: lazima umfumbulie
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi kilichokamilika husisitiza amri. “Lazima” huwasilisha wajibu huo, huku “kumfumbulia mkono” kikihifadhi taswira halisi ya Kiebrania kuhusu ukarimu.
- source_word: יָדְךָ
  choice: mkono wako
  rationale: “Mkono” huhifadhi sitiari thabiti ya Kiebrania ya kuwa mkarimu na inaeleweka kwa urahisi katika Kiswahili.
- source_word: לוֹ
  choice: umfumbulie
  rationale: Kiwakilishi cha mtendewa “-m-” kinamtaja maskini aliye mpokeaji wa tendo la kufumbuliwa mkono.
- source_word: וְהַעֲבֵט תַּעֲבִיטֶנּוּ
  choice: na hakika umkopeshe
  rationale: Muundo wa pili wa kitenzi-jina pamoja na kitenzi husisitiza uhakika na wajibu wa kukopesha. “Hakika” huhifadhi msisitizo huo bila kuufasiri kuwa namna ya kutoa.
- source_word: דֵּי
  choice: kiasi cha kutosha
  rationale: Neno lina maana ya utoshelevu; kirai hiki ni cha kawaida na kinaonyesha kwamba mkopo unapaswa kutosheleza hitaji.
- source_word: מַחְסֹרוֹ
  choice: kwa mahitaji yake
  rationale: Nomino hiyo humaanisha upungufu au hitaji. “Mahitaji yake” ni tafsiri ya kawaida inayobaki karibu na maana ya chanzo.
- source_word: אֲשֶׁר יֶחְסַר לוֹ
  choice: chochote anachokosa
  rationale: Kishazi hiki kinaeleza upeo wa hitaji kwa namna isiyofungwa; “chochote anachokosa” huhifadhi maana hiyo bila kurudia kwa njia isiyo ya kawaida.
