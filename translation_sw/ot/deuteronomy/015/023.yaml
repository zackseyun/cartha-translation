  yaml_path: translation/ot/deuteronomy/015/023.yaml
  text: Only[a], you shall not eat its blood; you shall pour it out on the ground like water.
translation:
  language: sw
  text: Ila, usile damu yake; imwage ardhini kama maji.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Lakini
  rationale: Katika muktadha huu neno linaweka kizuizi dhidi ya ruhusa iliyotangulia; “Lakini” linaunganisha kwa kawaida huku likihifadhi nguvu ya ukinzani na kizuizi.
- source_word: אֶת דָּמוֹ
  choice: damu yake
  rationale: Kiambishi cha umilikaji kinarejelea damu ya mnyama; “damu yake” ni tafsiri ya moja kwa moja na ya kawaida bila kuongeza wazo la “uhai” lisilotajwa wazi hapa.
- source_word: לֹא תֹאכֵל
  choice: usile
  rationale: Hii ni amri hasi katika sheria; “usile” ni ya kawaida, wazi, na yenye nguvu ya amri katika Kiswahili.
- source_word: עַל הָאָרֶץ
  choice: ardhini
  rationale: Katika muktadha halisi wa kumwaga damu, “ardhini” linaonyesha uso wa nchi au udongo kwa lugha ya kawaida na yenye heshima.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: uimwage
  rationale: Kitenzi kinamaanisha kumwaga; kiambishi “-i-” kinarejelea damu na kuhifadhi uhusiano wa kisarufi wa kifungu.
- source_word: כַּמָּיִם
  choice: kama maji
  rationale: Hii huhifadhi tashbihi ya Kiebrania moja kwa moja na ni usemi wa kawaida wa Kiswahili.
theological_decisions:
- issue: Matumizi ya damu katika sheria ya chakula
  choice: Katazo limetafsiriwa moja kwa moja kuwa amri ya kutokula damu na ya kuimwaga ardhini.
  alternative: Kutumia “damu yenye uhai” au kuongeza maelezo kuhusu uhusiano wa damu na uhai.
  rationale: Aya yenyewe haitoi sababu ya kiteolojia ya katazo hili. Kuongeza wazo la uhai katika matini kuu kungevuka yale yanayosemwa wazi na aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi, na chenye hadhi. Muundo wa umoja umetumiwa kwa sababu vitenzi vya Kiebrania viko katika nafsi ya pili umoja. Hakuna tanbihi iliyoongezwa kwa kuwa “damu yake” ni ya moja kwa moja na haina hitaji la mbadala wa lazima katika Kiswahili.
