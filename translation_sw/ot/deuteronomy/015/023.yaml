review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the animal's blood, the prohibition on consuming it, its disposal on the ground, and the comparison with water. However, רַק is primarily restrictive ('only/except') rather than adversative; 'Ila' conveys this restriction more precisely than 'Lakini' in this context.
  naturalness: The wording is generally clear and appropriately formal. 'Uimwage' is not the natural independent imperative form here; with damu (N-class), the direct imperative is 'imwage.'
  terminology: '''Damu yake,'' ''ardhini,'' and ''kama maji'' are accurate, idiomatic Standard East African Swahili choices. No theological expansion is introduced.'
  issues:
  - severity: medium
    issue: Restrictive particle rendered as 'Lakini'
    rationale: Although 'Lakini' can sometimes introduce an exception, 'Ila' more directly represents the restrictive force of רַק ('only/except') following the preceding permission.
  - severity: high
    issue: Verb form 'uimwage'
    rationale: The imperative governing the N-class object damu should be 'imwage' ('pour it out'). 'Uimwage' is not the appropriate independent imperative form in this sentence.
  revised_text: Ila, usile damu yake; imwage ardhini kama maji.
