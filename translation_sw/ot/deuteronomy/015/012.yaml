base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/012.yaml
  text: If your brother[a], a Hebrew man or a Hebrew woman, is sold to you and serves you six years, then in the seventh year you shall send him out free from you.
translation:
  language: sw
  text: Ikiwa ndugu yako, mwanamume Mwebrania au mwanamke Mwebrania, atauzwa kwako na kukutumikia kwa miaka sita, basi katika mwaka wa saba utamwacha[a] aondoke kwako akiwa huru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “utamwacha aondoke.” Baada ya kutaja mwanamume Mwebrania au mwanamke Mwebrania, Kiebrania kinaendelea kwa kutumia umbo la kiume la umoja kumrejelea mtu anayeachiliwa. Sheria hii inamhusu mwanamume au mwanamke.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּכֵר
  choice: atauzwa
  rationale: Huwakilisha kauli ya kutendwa ya Kiebrania bila kuamua ikiwa mtu huyo alijiuza mwenyewe au aliuzwa na mwingine.
- source_word: אָחִיךָ
  choice: ndugu yako
  rationale: Hudumisha lugha ya kifamilia na ya kiagano ya neno la Kiebrania badala ya kuibadili kuwa tu ‘mwananchi mwenzako’ au ‘jamaa yako.’
- source_word: הָעִבְרִי ... הָעִבְרִיָּה
  choice: mwanamume Mwebrania au mwanamke Mwebrania
  rationale: Maneno haya yanamtambulisha mtu kwa asili na jinsia, wala yenyewe si maneno ya kawaida ya ‘mtumwa’; muktadha wa kuuzwa na kutumikia unaonyesha hali ya utumishi.
- source_word: וַעֲבָדְךָ
  choice: na kukutumikia
  rationale: Kitenzi עבד hapa kinaeleza huduma au kazi anayomfanyia anayeambiwa sheria; ‘kukutumikia’ ni cha kawaida na hakiongezi maelezo yasiyomo.
- source_word: שֵׁשׁ שָׁנִים
  choice: kwa miaka sita
  rationale: Ni uhamisho wa moja kwa moja na wa kawaida wa muda uliotajwa.
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: basi katika mwaka wa saba
  rationale: ‘Basi’ huonyesha kwa kawaida mfuatano wa kisheria kutoka miaka sita ya huduma hadi kuachiliwa mwaka wa saba.
- source_word: תְּשַׁלְּחֶנּוּ
  choice: utamwacha aondoke
  rationale: Huhifadhi wazo la msingi la שלח, yaani kumwacha au kumtuma aondoke, katika Kiswahili cha kawaida kinachofaa muktadha wa kuachiliwa.
- source_word: חָפְשִׁי
  choice: akiwa huru
  rationale: Huonyesha wazi hadhi ya uhuru inayokusudiwa katika muktadha wa kuachiliwa kutoka utumishi.
- source_word: מֵעִמָּךְ
  choice: kwako
  rationale: Katika muundo ‘aondoke kwako,’ neno hili linawasilisha maana ya kuondoka kutoka kwa bwana na katika utumishi wake bila kuongeza ufafanuzi usiotajwa moja kwa moja.
theological_decisions:
- issue: Kiambishi cha kiume cha umoja baada ya kutajwa mwanamume na mwanamke Mwebrania
  choice: Kutumia ‘utamwacha,’ ambacho katika Kiswahili humrejelea mtu mmoja bila kubainisha jinsia, na kueleza umbo la Kiebrania katika tanbihi.
  alternative: Kutumia ‘utamwacha mwanamume huyo au mwanamke huyo’ ili kufanya jinsia zote ziwe wazi katika sentensi kuu.
  rationale: Kiebrania kinataja wazi mwanamume au mwanamke, kisha kinatumia kiambishi cha kiume cha umoja kwa mtu anayeachiliwa. Kiswahili hakina tofauti ya jinsia katika kiambishi ‘m-’ cha yambwa kwa mtu mmoja, hivyo tafsiri ya kawaida haiwezi kuiga tofauti hiyo bila kuongeza maneno. Tanbihi huhifadhi habari ya kisarufi na kuthibitisha kwamba sheria inamhusu yeyote kati yao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa urahisi. Muundo wa kisheria umehifadhiwa bila kutumia istilahi za kimadhehebu. ‘Mwebrania’ limetumiwa kwa mtu mmoja, na ‘akiwa huru’ linaeleza hali yake wakati wa kuondoka.
