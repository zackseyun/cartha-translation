base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/014.yaml
  text: You shall surely furnish him from your flock[a], from your threshing floor, and from your winepress; from what Yahweh your God has blessed you with, you shall give to him.
translation:
  language: sw
  text: Hakika umpe kwa wingi[a] kutoka katika kundi lako, kutoka katika uwanja wako wa kupuria, na kutoka katika kikamulio chako cha divai; katika vile ambavyo Yahweh, Mungu wako, amekubariki navyo, umpe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umwandalie kwa ukarimu.” Kiebrania kinatumia muundo wa kitenzi wenye msisitizo unaomaanisha kumpa kwa wingi, katika kuachiliwa kwake.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעֲנֵיק תַּעֲנִיק
  choice: Utakapompa mahitaji yake, hakikisha unampa
  rationale: Muundo wa kitenzi pamoja na kitenzi-jina cha kusisitiza unaweka amri nzito ya kumwandalia mtumwa anapoachiliwa. Kiswahili hiki kinaonyesha zaidi ya zawadi ya kawaida bila kuongeza kwa lazima neno ‘kwa ukarimu’ katika matini.
- source_word: מִצֹּאנְךָ
  choice: kutoka katika kundi lako
  rationale: צאן ni jina la jumla la mifugo midogo, hasa kondoo na mbuzi; ‘kundi’ linahifadhi taswira ya kilimo na ufugaji.
- source_word: וּמִגָּרְנְךָ
  choice: kutoka katika uwanja wako wa kupuria nafaka
  rationale: גֹּרֶן ni uwanja wa kupuria, unaowakilisha pia mazao ya nafaka. Tafsiri halisi kiasi inahifadhi taswira ya Kiebrania.
- source_word: וּמִיִּקְבֶךָ
  choice: kutoka katika shinikizo lako la divai
  rationale: יֶקֶב humaanisha shinikizo au chombo cha kukamulia zabibu; ‘shinikizo la divai’ linaeleweka na kuhifadhi mlolongo wa vyanzo vya kilimo.
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: kutoka katika vitu ambavyo Yahweh Mungu wako amekubariki navyo
  rationale: Kishazi hiki kinaonyesha kuwa zawadi itokane na baraka ambazo Mungu amempa mwenye mali, huku Kiswahili kikibaki cha kawaida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina binafsi lililo katika chanzo.
- source_word: תִּתֶּן לוֹ
  choice: Umpatie
  rationale: Amri hii ya mwisho inarudia kwa uwazi wajibu wa kumpa aliyeachiliwa sehemu ya baraka hizo.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kina Tetragramatoni yenyewe; ‘Yahweh’ huhifadhi jina binafsi bila kulibadilisha kuwa cheo.
- issue: Kiasi cha vitu vya kumpa aliyeachiliwa
  choice: Kusisitiza wajibu wa kumwandalia bila kuweka kipimo maalumu
  alternative: kumruzuku kwa ukarimu
  rationale: Muundo הַעֲנֵיק תַּעֲנִיק unasisitiza amri na huenda ukadokeza utoaji wa kutosha au mwingi, lakini mstari hautaji kipimo kamili. Tanbihi huhifadhi uwezekano huo bila kuufanya tafsiri pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Taswira za ufugaji, uwanja wa kupuria, na shinikizo la divai zimehifadhiwa; sentensi imegawanywa ili isomeke kwa urahisi.
