  yaml_path: translation/ot/deuteronomy/015/003.yaml
  text: You may press a foreigner for payment[c][b][a], but whatever of yours is with your brother your hand shall release.
translation:
  language: sw
  text: Unaweza kumdai mgeni alipe,[a] lakini dai lolote ulilo nalo kwa ndugu yako[b] utaliachilia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Unaweza kudai malipo kutoka kwa mgeni.” Kitenzi cha Kiebrania hapa kinamaanisha kudai ulipaji wa deni kwa msisitizo.
    reason: lexical_alternative
  - marker: b
    text: “Ndugu yako” katika muktadha huu wa sheria humaanisha mwanajumuiya mwenzako wa Israeli.
    reason: cultural_note
  - marker: c
    text: Kiebrania, kwa maana halisi, “mkono wako utaachilia.” Usemi huo humaanisha kuacha dai lako au kulisamehe katika mwaka wa kuachilia.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּכְרִי
  choice: mgeni
  rationale: Katika sheria hii, נָכְרִי ni mtu wa kigeni aliye nje ya jumuiya ya agano la Israeli. “Mgeni” ni neno la kawaida na lenye heshima katika Kiswahili, huku tofauti ya kijamii na kisheria ikihifadhiwa na muktadha.
- source_word: תִּגֹּשׂ
  choice: unaweza kumdai ... alipe
  rationale: Katika muktadha wa deni, נגשׂ humaanisha kumsukuma mdaiwa au kumtaka alipe. Muundo huu unaeleza tendo la kudai malipo kwa Kiswahili cha kawaida bila kuongeza wazo la kutumia nguvu.
- source_word: וַאֲשֶׁר יִהְיֶה לְךָ
  choice: chochote chako kilicho
  rationale: Muundo huu unahifadhi upana wa maneno ya Kiebrania, yanayorejelea chochote kilicho cha mdai—hasa dai lake—bila kukifafanua kupita kiasi katika matini kuu.
- source_word: אָחִיךָ
  choice: ndugu yako
  rationale: Hili ndilo fumbo halisi la kifamilia katika Kiebrania. Katika sheria ya Kumbukumbu la Torati humaanisha mwanajumuiya mwenzake wa Israeli, lakini “ndugu yako” huhifadhi lugha ya agano badala ya kuitafsiri moja kwa moja kuwa “Mwisraeli mwenzako.”
- source_word: תַּשְׁמֵט יָדֶךָ
  choice: mkono wako utakiachilia
  rationale: Tafsiri hii huhifadhi taswira halisi ya שׁמט pamoja na “mkono wako.” Katika muktadha wa mwaka wa kuachilia, usemi huo humaanisha kuachana na dai la deni au kulisamehe; tanbihi inaeleza maana hiyo.
theological_decisions:
- issue: Upeo wa maana ya “ndugu yako” katika sheria ya Kumbukumbu la Torati
  choice: Kuhifadhi “ndugu yako” katika matini kuu
  alternative: Mwisraeli mwenzako; mtu wa taifa lako
  rationale: Aya inatofautisha mgeni na “ndugu” aliye ndani ya jumuiya ya agano. Tafsiri halisi huhifadhi sitiari na mvutano wa kijamii wa matini, huku tanbihi ikifafanua upeo wake wa kisheria.
- issue: Maana ya kuachilia katika mwaka wa saba
  choice: Kuhifadhi taswira ya “mkono wako utakiachilia” na kufafanua katika tanbihi
  alternative: utasamehe deni lako; utaacha kudai malipo
  rationale: Kiebrania kina usemi halisi unaohusisha mkono na kuachilia. Kuuhifadhi huepuka kufuta taswira ya matini, lakini tanbihi inaonyesha wazi kwamba jambo linalohusika ni kuachana na dai la deni.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mpangilio wa kishazi cha pili na taswira ya “mkono” zimehifadhiwa ili kubakiza mkazo wa Kiebrania, huku tanbihi zikifafanua maana ya kisheria.
