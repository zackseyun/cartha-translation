base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/018.yaml
  text: And remember that you were a servant in Egypt, and Yahweh your God redeemed you from there; therefore I am commanding you to do this.
translation:
  language: sw
  text: Na kumbuka kwamba ulikuwa mtumwa huko Misri, na Yahwe Mungu wako alikukomboa kutoka huko. Kwa hiyo, mimi ninakuamuru kufanya jambo hili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Na kumbuka
  rationale: Kitenzi cha Kiebrania katika muktadha huu kina nguvu ya agizo. “Na” huhifadhi kiunganishi bila kukipa maana ya ziada.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa kinaanzisha jambo ambalo Israeli anapaswa kulikumbuka, si hasa sababu ya agizo.
- source_word: עֶבֶד
  choice: mtumwa
  rationale: Neno hili linaonyesha hali ya utumwa wa Israeli nchini Misri; “mtumishi” lingepunguza uzito wa hali hiyo.
- source_word: בְּמִצְרַיִם
  choice: Misri
  rationale: Kiebrania kinataja Misri moja kwa moja; Kiswahili hakihitaji kuongeza “nchini” ili maana iwe wazi.
- source_word: וַיִּפְדְּךָ
  choice: alikukomboa
  rationale: “Kukomboa” huwasilisha kuachiliwa kutoka utumwani pamoja na uzito wa maana ya kifidiajı na ya agano uliomo katika פדה.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni umbo la kawaida la Kiswahili la jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya muundo wenye kiambishi cha nafsi ya pili umoja.
- source_word: מִשָּׁם
  choice: kutoka huko
  rationale: Hurejelea Misri kwa njia ya kawaida na iliyo wazi katika Kiswahili.
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Huonyesha wazi kwamba agizo linalofuata linatokana na ukombozi ambao Israeli aliupokea.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: mimi ninakuamuru
  rationale: Kiwakilishi cha wazi אָנֹכִי kina uzito wa mkazo; “mimi” huhifadhi mkazo huo, na wakati wa sasa huonyesha agizo linalotolewa sasa.
- source_word: לַעֲשׂוֹת
  choice: kufanya
  rationale: Ni kitenzi kipana kinachofaa kwa kutekeleza maelekezo yaliyotangulia.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: jambo hili
  rationale: Hurejelea agizo la kisheria lililotangulia bila kuongeza neno “amri,” ambalo lingekuwa tafsiri ya kufafanua zaidi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu. “Yahwe” hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Hali ya עֶבֶד huko Misri
  choice: mtumwa
  alternative: mtumishi
  rationale: Muktadha unakumbusha utumwa wa Israeli kama msingi wa wajibu wa kimaadili; “mtumwa” huhifadhi hali hiyo kwa uwazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi mkazo wa “mimi” na uhusiano wa sababu unaoonyeshwa na “Kwa hiyo,” bila kuongeza maelezo yasiyokuwamo katika chanzo.
