base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/008.yaml
  text: Be careful in the case of an outbreak of skin disease[a], to observe very carefully and to do according to all that the Levitical priests instruct you; as I have commanded them, so you shall be careful to do.
translation:
  language: sw
  text: Jihadharini katika suala la ugonjwa wa ngozi[a], mkizingatia kwa makini sana na kutenda kulingana na yote ambayo makuhani Walawi watawaagiza. Kama nilivyowaamuru, ndivyo mnavyopaswa kuwa waangalifu kutenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kijadi, “ukoma.” Neno la Kiebrania linarejelea kwa upana zaidi hali mbalimbali za ngozi katika Torati, wala si ugonjwa wa Hansen pekee unaoitwa ukoma leo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר
  choice: Jihadharini
  rationale: Amri ya Nifali ya שׁמר ni onyo au himizo. “Jihadharini” ni Kiswahili cha sasa na cha kawaida kinachohifadhi nguvu ya amri.
- source_word: בְּנֶגַע הַצָּרַעַת
  choice: kuhusu tukio la ugonjwa wa ngozi
  rationale: נֶגַע huashiria pigo, alama, au tukio la hali fulani, huku צָרַעַת katika Torati ikihusu hali mbalimbali za ngozi, si ugonjwa wa Hansen pekee.
- source_word: לִשְׁמֹר מְאֹד וְלַעֲשׂוֹת
  choice: sana ... mkifuata na kutenda
  rationale: “Sana” huhifadhi msisitizo wa מְאֹד, na vitenzi viwili “kufuata” na “kutenda” vinaonyesha uangalifu kwa maagizo pamoja na utekelezaji wake.
- source_word: כְּכֹל אֲשֶׁר יוֹרוּ אֶתְכֶם
  choice: yote ambayo ... watawaagiza
  rationale: ירה katika Hifili humaanisha kufundisha, kuelekeza, au kuagiza. “Watawaagiza” inafaa muktadha wa mwongozo wa kisheria wa makuhani.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: makuhani Walawi
  rationale: Hili ni jina la Kumbukumbu la Torati kwa makuhani walio wa Walawi; halichukuliwi kuwa makundi mawili tofauti.
- source_word: כַּאֲשֶׁר צִוִּיתִם
  choice: Kama nilivyowaamuru wao
  rationale: Kitenzi cha nafsi ya kwanza chenye kiambishi cha wingi wa nafsi ya tatu kinarejelea amri ambayo Musa aliwapa makuhani.
- source_word: תִּשְׁמְרוּ לַעֲשׂוֹת
  choice: ndivyo mtakavyokuwa waangalifu kutenda
  rationale: Usemi huu unarudia muundo wa שׁמר pamoja na לעשות na kuhifadhi msisitizo wa kuwa makini katika utekelezaji.
theological_decisions:
- issue: Tafsiri ya צָרַעַת
  choice: ugonjwa wa ngozi
  alternative: ukoma
  rationale: Katika Torati neno hili linahusu hali nyingi zaidi kuliko ugonjwa wa Hansen unaoitwa ukoma leo. Tafsiri pana huepuka kuingiza utambuzi wa kitabibu wa kisasa.
- issue: Utambulisho wa הַכֹּהֲנִים הַלְוִיִּם
  choice: makuhani Walawi
  alternative: makuhani, yaani Walawi
  rationale: Usemi huu unaeleweka kama jina la makuhani walio wa Walawi, bila kuufanya uwe orodha ya makundi mawili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Wingi umetumiwa kwa sababu agizo linaelekezwa kwa Israeli kwa pamoja. Muundo umerahisishwa kiasi ili uwe wa asili kwa Kiswahili huku ukihifadhi marudio, msisitizo, na uhusiano kati ya amri ya Musa kwa makuhani na wajibu wa watu.
