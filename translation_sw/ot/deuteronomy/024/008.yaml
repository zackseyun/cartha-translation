  naturalness: “Jihadharini sana kuhusu tukio ...” inaunganisha “sana” na onyo la kwanza badala ya tendo la kufuata, na “tukio” husikika si ya kawaida katika muktadha huu. Muundo uliorekebishwa ni wa Kiswahili Sanifu, wenye mtiririko wa kisheria/kiandiko bila kuwa wa kizamani kupita kiasi.
  terminology: “Ugonjwa wa ngozi” ni istilahi pana inayofaa kwa צָרַעַת katika Torati, kwa maelezo ya chini ya ukurasa. “Makuhani Walawi” huhifadhi cheo cha Kumbukumbu la Torati. “Maagizo” na “muwe waangalifu kutenda” huwasilisha vyema mafundisho/maelekezo ya makuhani na wajibu wa kuyatekeleza.
