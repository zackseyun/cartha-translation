    rationale: מְאֹד hutilia mkazo kushika/kuzingatia na kutenda, si lazima imperativi ya kwanza pekee; “mkifuata” pia ni dhaifu kuliko לִשְׁמֹר. Marekebisho yanaweka “kwa makini sana” pamoja na “kuzingatia na kutenda.”
