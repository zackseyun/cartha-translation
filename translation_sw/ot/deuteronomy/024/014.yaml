  text: לֹא תַעֲשֹׁ֥ק שָׂכִ֖יר עָנִ֣י וְ/אֶבְי֑וֹן מֵ/אַחֶ֕י/ךָ א֧וֹ מִ/גֵּרְ/ךָ֛ אֲשֶׁ֥ר בְּ/אַרְצְ/ךָ֖ בִּ/שְׁעָרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/014.yaml
  text: You shall not oppress a hired worker who is poor and needy[a], whether one of your brothers or one of your sojourners who is in your land[b], within your gates.
translation:
  language: sw
  text: Usimdhulumu[a] mfanyakazi wa ujira aliye maskini na mhitaji, awe ni mmoja wa ndugu zako au mgeni mkazi aliye katika nchi yako, katika miji yako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “usimnyonye” au “usimnyang’anye haki”; kitenzi cha Kiebrania kinajumuisha dhuluma ya kiuchumi.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, “katika malango yako”; huu ni usemi wa Kiebrania unaomaanisha ndani ya miji yako au eneo lililo chini ya mamlaka ya jamii yako.
    reason: cultural_note
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: usimdhulumu
  rationale: Kitenzi עָשַׁק kinaonyesha kumkandamiza au kumnyonya mtu, hasa kiuchumi. “Kudhulumu” kinahifadhi uzito wa katazo na kinaweza kujumuisha kutomlipa ujira unaomstahili.
- source_word: שָׂכִיר
  choice: mfanyakazi wa ujira
  rationale: Nomino hii humaanisha mtu aliyeajiriwa kufanya kazi kwa malipo. Usemi huu ni wazi katika Kiswahili cha sasa bila kuifanya kazi hiyo iwe lazima ya muda mfupi.
- source_word: עָנִי וְאֶבְיוֹן
  choice: maskini na mhitaji
  rationale: Maneno haya mawili yanaonyesha kwa pamoja hali ya mtu aliye dhaifu kiuchumi; tafsiri inahifadhi maelezo yote mawili.
- source_word: מֵאַחֶיךָ
  choice: mmoja wa ndugu zako
  rationale: Tafsiri hii inahifadhi lugha ya udugu ya maandishi na umoja wa mfanyakazi anayezungumziwa; katika sheria hii inarejelea mwanajumuiya wa Israeli.
- source_word: מִגֵּרְךָ
  choice: mgeni mkazi
  rationale: גֵּר ni mtu asiye mwenyeji ambaye amekaa katika jamii ya Israeli. “Mgeni mkazi” huonyesha hali hiyo bila kuingiza makundi ya kisasa ya kisheria kuhusu uhamiaji.
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: aliye katika nchi yako
  rationale: Kishazi hiki kwa kawaida kinamhusu mgeni mkazi na kinadumisha umoja wa kisarufi wa maandishi ya Kiebrania.
- source_word: בִּשְׁעָרֶיךָ
  choice: katika miji yako
  rationale: Ingawa kwa neno moja moja ni “katika malango yako,” huu ni usemi wa Kiebrania unaorejelea miji au eneo lililo chini ya mamlaka ya jamii. Tafsiri ya maana ni ya kawaida na inaeleweka katika Kiswahili.
theological_decisions:
- issue: Lugha ya udugu katika אַחֶיךָ
  choice: mmoja wa ndugu zako
  alternative: mmoja wa Waisraeli wenzako
  rationale: Chaguo hili linahifadhi taswira ya kifamilia na ya agano iliyomo katika Kiebrania bila kuficha kwamba sheria inamhusu Mwisraeli mwenzao.
- issue: Maana ya kundi la kijamii גֵּר
  choice: mgeni mkazi
  alternative: mgeni anayeishi kati yenu
  rationale: “Mgeni mkazi” linahifadhi hali ya mtu wa nje aliyekuwa anaishi kwa kudumu ndani ya jamii na aliyelindwa na sheria, bila kulisawazisha na hadhi yoyote ya kisasa ya uhamiaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wa moja kwa moja, na unaoeleweka kwa wasomaji wa kawaida. “Mfanyakazi wa ujira” huepuka maana finyu inayoweza kuambatana na “kibarua,” huku “mgeni mkazi” ikibainisha hali ya kijamii ya גֵּר.
