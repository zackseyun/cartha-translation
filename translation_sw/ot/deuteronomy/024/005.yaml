base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/005.yaml
  text: When a man takes a new wife[a], he shall not go out with the army, nor shall any duty be imposed on him. He shall be free for his household for one year[d][c][b], and he shall make his wife whom he has taken rejoice.
translation:
  language: sw
  text: Mwanamume anapomwoa mke mpya, asiende pamoja na jeshi,[a] wala asipewe jukumu lolote.[b] Atakuwa huru kwa ajili ya watu wa nyumbani mwake kwa mwaka mmoja,[c] naye atamfurahisha mke aliyemwoa.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “asiende vitani.” Kiebrania husema kihalisi “asiende pamoja na jeshi,” jambo linaloweza kujumuisha huduma ya kijeshi kwa upana zaidi, si mapigano ya moja kwa moja tu.
    reason: lexical_alternative
  - marker: b
    text: Au, “wala asikabidhiwe kazi yoyote” au “wala asiwekewe wajibu wowote.” Kiebrania kina maana pana kuliko wajibu wa kijeshi pekee.
    reason: alternative_reading
  - marker: c
    text: Au, “Atasamehewa majukumu na kukaa nyumbani kwa mwaka mmoja.” Usemi wa Kiebrania unaweza kusisitiza ama kuwa kwake huru kwa manufaa ya watu wa nyumbani mwake ama kubaki kwake nyumbani.
    reason: lexical_alternative
  - marker: d
    text: Au, “naye atamletea furaha mke aliyemwoa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: anapomwoa
  rationale: Katika sheria ya kisa, כִּי huanzisha hali inayotarajiwa; muundo wa “anapo-” ni wa asili katika Kiswahili na unaonyesha “wakati/ikiwa” bila kuifanya hali kuwa dhahania tu.
- source_word: יִקַּח אִישׁ אִשָּׁה חֲדָשָׁה
  choice: Mwanamume anapomwoa mke mpya
  rationale: לָקַח pamoja na אִשָּׁה ni nahau ya kumwoa mwanamke. “Mke mpya” inadumisha חֲדָשָׁה na hapa humaanisha mke aliyeolewa hivi karibuni.
- source_word: לֹא יֵצֵא בַּצָּבָא
  choice: asiende pamoja na jeshi
  rationale: Tafsiri hii inadumisha picha ya kutoka pamoja na jeshi na haibani maana kuwa mapigano ya moja kwa moja pekee.
- source_word: וְלֹא יַעֲבֹר עָלָיו לְכָל דָּבָר
  choice: wala asipewe jukumu lolote
  rationale: Nahau hii inaonyesha kwamba jukumu au wajibu usiwekwe juu yake. Kiswahili hiki ni wazi huku kikidumisha upana wa דָּבָר.
- source_word: נָקִי יִהְיֶה לְבֵיתוֹ
  choice: Atakuwa huru kwa ajili ya nyumba yake
  rationale: נָקִי hapa ni kuwa huru au kusamehewa majukumu; בַּיִת inaweza kumaanisha nyumba au watu wa nyumbani. Muundo huu unadumisha mwelekeo wa manufaa ya nyumbani bila kuamua kwamba maana ni kukaa mahali hapo tu.
- source_word: שָׁנָה אֶחָת
  choice: kwa mwaka mmoja
  rationale: Huonyesha kwa wazi muda uliowekwa na sheria.
- source_word: וְשִׂמַּח אֶת אִשְׁתּוֹ אֲשֶׁר לָקָח
  choice: naye atamfurahisha mke aliyemwoa
  rationale: Umbo la פיעל la שׂמח ni la kisababishi, hivyo “atamfurahisha” huhifadhi maana ya kumletea furaha. “Aliyemwoa” ni nahau asilia ya Kiswahili kwa אֲשֶׁר לָקָח.
theological_decisions:
- issue: Upeo wa msamaha wa majukumu
  choice: wala asipewe jukumu lolote
  alternative: wala asipewe jukumu lolote la kijeshi
  rationale: Kiebrania kina usemi mpana לְכָל דָּבָר, kwa hiyo tafsiri haifungi wajibu huo ndani ya huduma ya kijeshi pekee.
- issue: Kusudi la mwaka wa kwanza
  choice: kwa ajili ya nyumba yake ... atamfurahisha mke
  alternative: akae nyumbani ... afurahi pamoja na mkewe
  rationale: Maandishi yanamwelekeza kuwa huru kwa ajili ya ביתו na kutumia kitenzi cha kisababishi kwa furaha ya mke; hayana usemi wa moja kwa moja unaosema wawili hao wafurahi kwa pamoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa urahisi. “Mwanamume” na “mke” ni maneno ya kawaida na yenye staha; “asiende pamoja na jeshi” huhifadhi taswira ya Kiebrania, huku tanbihi zikitoa mbadala wa kawaida zaidi.
