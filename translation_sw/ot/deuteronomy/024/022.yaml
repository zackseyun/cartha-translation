  language: sw
  text: Na ukumbuke kwamba ulikuwa mtumwa katika nchi ya Misri; kwa hiyo ninakuamuru ufanye jambo hili[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “agizo hili.” Neno la Kiebrania linalotafsiriwa “jambo hili” linarejelea agizo lililotangulia kuhusu kuwaachia wenye uhitaji sehemu ya mazao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Nawe ukumbuke
  rationale: Muundo huu unaendeleza uhusiano na agizo lililotangulia na kuwasilisha nguvu ya himizo au amri kwa Kiswahili cha kawaida.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa neno hili linatanguliza jambo linalopaswa kukumbukwa, si sababu iliyo katika kishazi tofauti.
- source_word: עֶבֶד
  choice: mtumwa
  rationale: Katika muktadha wa Misri, neno hili linaeleza hali ya utumwa, si huduma ya kawaida ya mtumishi.
- source_word: הָיִיתָ
  choice: ulikuwa
  rationale: Ni usemi wa moja kwa moja wa hali ya wakati uliopita.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: katika nchi ya Misri
  rationale: Inahifadhi usemi halisi wa Kiebrania na mdundo wake bila kuufupisha kuwa ‘Misri’ pekee.
- source_word: עַל כֵּן
  choice: kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na historia ya Israeli ya kuwa watumwa.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: ninakuamuru
  rationale: Kitenzi cha wakati unaoendelea kinaonyesha amri ya sasa yenye mamlaka; kiwakilishi huru cha Kiebrania hakihitaji kusisitizwa kupita kiasi katika Kiswahili.
- source_word: לַעֲשׂוֹת
  choice: ulifanye
  rationale: Kitenzi pana ‘kufanya’ kimetafsiriwa kwa muundo wa Kiswahili unaopatana na ‘jambo hili’ na kuonyesha utekelezaji wa agizo.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: jambo hili
  rationale: ‘Jambo’ huhifadhi upana wa דָּבָר bila kulifinyanga kuwa ‘amri,’ huku rejeo lake kwa maagizo yaliyotangulia likibaki wazi katika muktadha.
