base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/019.yaml
  text: When you reap your harvest in your field and forget a sheaf in the field[a], you shall not go back to take it. It shall be for the sojourner, the fatherless, and the widow[b], so that Yahweh your God may bless you in all the work of your hands.
translation:
  language: sw
  text: Utakapovuna mavuno yako katika shamba lako, na kusahau mganda shambani, usirudi kuuchukua. Mganda huo utakuwa kwa ajili ya mgeni mkazi[a], yatima[b], na mjane, ili Yahweh, Mungu wako, akubariki katika kazi yote ya mikono yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mgeni,” “mkaaji wa kigeni,” au “mtu wa kigeni.” Neno la Kiebrania humaanisha mtu asiye mzawa wa Israeli anayeishi miongoni mwa Waisraeli.
    reason: lexical_alternative
  - marker: b
    text: Au “mtoto asiye na baba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תִקְצֹר
  choice: Utakapovuna
  rationale: כִּי inaanzisha hali ya sheria, na muundo wa Kiswahili “utakapovuna” unaonyesha wakati wenye maana ya sharti bila kuwa mzito.
- source_word: קְצִירְךָ
  choice: mavuno yako
  rationale: Hurejelea mazao yanayovunwa; “mavuno” ni neno la kawaida na sahihi katika muktadha huu wa kilimo.
- source_word: עֹמֶר
  choice: mganda
  rationale: Katika muktadha huu ni fungu la nafaka iliyokatwa, si kipimo cha ujazo kinachoitwa omeri.
- source_word: לֹא תָשׁוּב לְקַחְתּוֹ
  choice: usirudi kuuchukua
  rationale: Huhifadhi katazo pamoja na wazo la kurudi ili kuchukua mganda uliosahaulika.
- source_word: גֵּר
  choice: mgeni mkazi
  rationale: Neno hili humaanisha mtu asiye mwenyeji wa asili lakini anayeishi katika jamii; “mgeni mkazi” huonyesha hali hiyo ya kijamii na kisheria vizuri kuliko “mgeni” peke yake.
- source_word: יָתוֹם
  choice: yatima
  rationale: “Yatima” ni neno la kawaida la Kiswahili kwa mtu aliyepoteza mzazi au wazazi na linafaa katika orodha hii ya watu walio katika mazingira magumu.
- source_word: יִהְיֶה
  choice: Utakuwa kwa ajili ya
  rationale: Hueleza kwamba mganda uliosahaulika umetengwa kuwa riziki ya watu waliotajwa, bila kusisitiza isivyofaa lugha ya umiliki wa kisheria.
- source_word: לְמַעַן
  choice: ili
  rationale: Huonyesha kusudi au matokeo yanayokusudiwa kwa Kiswahili cha kawaida na fasaha.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Jamii ya kijamii na kisheria גֵּר
  choice: mgeni mkazi
  alternative: mgeni; mhamiaji; mtu wa kigeni
  rationale: Uchaguzi huu huhifadhi maana ya mtu asiye mwenyeji wa asili anayeishi miongoni mwa Israeli, bila kumfanya kuwa msafiri wa muda mfupi tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sheria ulio wazi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
