  yaml_path: translation/ot/deuteronomy/024/017.yaml
  text: You shall not pervert the justice due to a sojourner or an orphan[a], nor take a widow’s garment as a pledge.
translation:
  language: sw
  text: Usipotoshe haki ya mgeni mkazi[a] wala ya yatima, wala usichukue vazi la mjane kama dhamana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mgeni” au “mkaaji wa kigeni.” Neno la Kiebrania linamaanisha mtu asiye mzawa anayeishi miongoni mwa Waisraeli na aliye chini ya ulinzi wa jamii na sheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַטֶּה
  choice: usipotoshe
  rationale: Katika muktadha wa kisheria, Hiphil ya נטה humaanisha kugeuza au kupinda hukumu; “kupotosha haki” ni Kiswahili cha sasa na cha kawaida kinachoonyesha kunyima haki kwa njia isiyo halali.
- source_word: מִשְׁפַּט
  choice: haki ya
  rationale: Hapa מִשְׁפַּט inahusu haki au madai halali yanayompasa mtu, si hukumu ya mahakama pekee. “Haki ya” huwasilisha maana hiyo kwa ufupi na kwa kawaida.
- source_word: גֵּר
  choice: mgeni mkazi
  rationale: גֵּר ni mtu asiye mzawa anayeishi miongoni mwa Israeli na aliye chini ya ulinzi wa jamii na sheria; “mgeni mkazi” ni sahihi zaidi kuliko “mgeni” pekee, ambalo linaweza kumaanisha pia mtu anayepita kwa muda mfupi.
- source_word: יָתוֹם
  choice: yatima
  rationale: יָתוֹם humaanisha mtoto aliyekosa ulinzi wa baba au mzazi. “Yatima” ni neno la kawaida na linaloeleweka katika Kiswahili cha sasa.
- source_word: תַחֲבֹל
  choice: usichukue ... kuwa dhamana
  rationale: Katika sheria ya madeni, חבל humaanisha kuchukua kitu kama rehani au hakikisho la deni. “Kuchukua ... kuwa dhamana” ni usemi wa kawaida na unaoeleweka.
- source_word: בֶּגֶד
  choice: vazi
  rationale: בֶּגֶד ni neno la jumla kwa nguo au vazi; “vazi” halibainishi isivyohitajika kwamba ni joho au vazi la nje.
- source_word: אַלְמָנָה
  choice: la mjane
  rationale: Muundo huu wa umilikaji ni wa asili katika Kiswahili na unahifadhi wazi kwamba vazi ni mali ya mjane.
theological_decisions:
- issue: Jinsi ya kutafsiri kundi la kijamii גֵּר
  choice: mgeni mkazi
  alternative: mgeni; mtu wa kigeni
  rationale: Aya inalinda haki ya mtu asiye mzawa lakini anayeishi ndani ya jamii ya Israeli. “Mgeni mkazi” huhifadhi hadhi hiyo ya kijamii na kisheria bila kumfanya kuwa msafiri wa muda au mtu yeyote wa nchi nyingine.
- issue: Uhusiano wa גֵּר na יָתוֹם bila kiunganishi katika Kiebrania
  choice: mgeni mkazi au yatima
  alternative: mgeni mkazi aliye yatima
  rationale: Muktadha na mpangilio wa makundi dhaifu katika Kumbukumbu la Torati vinaunga mkono zaidi kuyasoma kama makundi mawili yanayoratibiwa, ingawa Kiebrania hakina kiunganishi kati ya nomino hizo. “Au” hutoa katazo linalotumika kwa kila kundi bila kuficha uwezekano wa kisarufi wa usomaji mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa moja kwa moja, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Istilahi za kisheria zimewekwa wazi bila kuwa nzito; “mgeni mkazi” huhifadhi tofauti muhimu ya גֵּר.
