source:
  edition: WLC
  text: לֹא יוּכַ֣ל בַּעְלָ֣/הּ הָ/רִאשׁ֣וֹן אֲשֶֽׁר שִׁ֠לְּחָ/הּ לָ/שׁ֨וּב לְ/קַחְתָּ֜/הּ לִ/הְי֧וֹת ל֣/וֹ לְ/אִשָּׁ֗ה אַחֲרֵי֙ אֲשֶׁ֣ר הֻטַּמָּ֔אָה כִּֽי תוֹעֵבָ֥ה הִ֖וא לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹ֤א תַחֲטִיא֙ אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/004.yaml
  text: her first husband[a], who sent her away, may not take her again to be his wife after she has been defiled, for that is an abomination before Yahweh; and you shall not bring sin upon the land that Yahweh your God is giving you as an inheritance.
translation:
  language: sw
  text: Mume wake wa kwanza, aliyemwacha, haruhusiwi kumchukua tena kuwa mke wake baada ya kutiwa unajisi[a], kwa maana hilo ni chukizo mbele ya Yahweh. Wala usilete dhambi juu ya nchi ambayo Yahweh Mungu wako anakupa kuwa urithi wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “baada ya kuwa najisi” au “baada ya kufanywa najisi.” Kiebrania kinasema “baada ya kutiwa unajisi,” bila kubainisha hasa aina ya unajisi huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעְלָהּ הָרִאשׁוֹן
  choice: mume wake wa kwanza
  rationale: Katika muktadha wa ndoa, בַּעַל humaanisha ‘mume’; הָרִאשׁוֹן ni ‘wa kwanza,’ ikitofautisha mume huyu na mume wa baadaye.
- source_word: שִׁלְּחָהּ
  choice: aliyemfukuza
  rationale: Kitenzi שׁלח kimsingi ni ‘kumwondoa/kumpeleka mbali’; hapa kinamaanisha kumwacha kwa talaka. ‘Kumfukuza’ huhifadhi picha ya kuondolewa bila kurudia neno ‘talaka’ lililo wazi katika muktadha wa sheria hii.
- source_word: לָשׁוּב לְקַחְתָּהּ
  choice: kumchukua tena
  rationale: Mfuatano huu wa vitenzi unaonyesha kurudia kitendo; Kiswahili hiki ni cha kawaida na katika muktadha kinamaanisha kumwoa tena.
- source_word: לִהְיוֹת לוֹ לְאִשָּׁה
  choice: awe mke wake
  rationale: Hii ni nahau ya kawaida ya Kiebrania kuhusu ndoa, iliyotafsiriwa kwa Kiswahili cha asili na chenye hadhi.
- source_word: אַחֲרֵי אֲשֶׁר הֻטַּמָּאָה
  choice: baada ya yeye kutiwa unajisi
  rationale: Kauli tendwa ya טמא inaonyesha kutiwa unajisi au kuwa najisi. Tafsiri hii huhifadhi kauli tendwa na kutobainishwa kwa aina hasa ya unajisi.
- source_word: תוֹעֵבָה
  choice: chukizo
  rationale: ‘Chukizo’ ni neno zito la kimaadili na kiagano linalowasilisha nguvu ya תוֹעֵבָה kwa Kiswahili cha kibiblia kinachoeleweka.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: לִפְנֵי ni ‘mbele ya/katika uwepo wa,’ na jina la agano יְהוָה limetolewa kama ‘Yahweh.’
- source_word: וְלֹא תַחֲטִיא אֶת הָאָרֶץ
  choice: Usilete dhambi juu ya nchi
  rationale: Hifili ya חטא hapa inaweza kumaanisha kusababisha dhambi au kuleta hatia. Usemi huu unaeleweka kwa Kiswahili na huhifadhi uhusiano wa dhambi na nchi bila kufafanua zaidi ya chanzo.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: anakupa iwe urithi wako
  rationale: נַחֲלָה ni urithi au milki ya kurithi; muundo huu huhifadhi wazo la nchi kama zawadi ya agano inayorithiwa.
theological_decisions:
- issue: Maana ya ‘baada ya yeye kutiwa unajisi’ katika katazo la kuoa tena
  choice: Kuhifadhi usemi mpana ‘kutiwa unajisi’ bila kubainisha aina yake.
  alternative: baada ya kuwa najisi; baada ya kufanywa asiye safi; baada ya kunajisiwa kingono
  rationale: Kiebrania kinatumia kauli tendwa ya טמא lakini hakielezi hapa kama unajisi huo ni wa kiibada, wa kingono, wa kisheria, au wa kimahusiano. Tafsiri haipaswi kuondoa mvutano huo.
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יְהוָה moja kwa moja; ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kisheria umehifadhiwa, huku sentensi ikigawanywa ili isomeke kwa urahisi. Alama ya tanbihi [a] imewekwa mara baada ya usemi unaohusika.
