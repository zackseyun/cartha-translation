base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/007.yaml
  text: If a man is found kidnapping one of his brothers from the sons of Israel[a], and he enslaves him and sells him, then that kidnapper shall die[c][b]. So you shall purge the evil from your midst.
translation:
  language: sw
  text: Ikiwa mwanamume atapatikana amemteka nyara mmoja wa ndugu zake miongoni mwa Waisraeli,[a] akamfanya mtumwa[b] na kumuuza, mtekaji nyara huyo atauawa. Hivyo utaondoa uovu katikati yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu zake” hapa ni Waisraeli wenzake, si ndugu wa kuzaliwa tu. Kirai cha Kiebrania pia kinaweza kusemwa kwa karibu zaidi, “ameiba mtu miongoni mwa ndugu zake, wana wa Israeli.”
    reason: cultural_note
  - marker: b
    text: Au, “akamtumia kama mtumwa” au “akamtawala kama mali.” Neno la Kiebrania linaeleza kumshughulikia mateka kama mtumwa au mali kabla ya kumuuza.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּצֵא
  choice: atapatikana
  rationale: Nifali ya מצא ina maana ya hali ya kutendwa, ‘kupatikana’; muundo huu pia unafaa lugha ya masharti ya kisheria.
- source_word: אִישׁ
  choice: mwanamume
  rationale: Nomino ya Kiebrania ni umoja wa kiume; ‘mwanamume’ huhifadhi umbo hilo waziwazi.
- source_word: גֹּנֵב נֶפֶשׁ
  choice: amemteka nyara
  rationale: Kirai hiki, ambacho kihalisi ni ‘ameiba mtu,’ humaanisha kumwondoa mtu kwa nguvu au hila; ‘kuteka nyara’ ni Kiswahili cha sasa na cha wazi katika muktadha huu.
- source_word: מֵאֶחָיו מִבְּנֵי יִשְׂרָאֵל
  choice: mmoja wa ndugu zake, yaani mmoja wa Waisraeli
  rationale: ‘Ndugu zake’ huhifadhi lugha ya undugu wa jumuiya, huku ‘yaani mmoja wa Waisraeli’ ikifafanua kuwa si lazima awe ndugu wa kuzaliwa.
- source_word: וְהִתְעַמֶּר בּוֹ
  choice: akamtendea kama mtumwa
  rationale: Kitenzi kinaonyesha kumtumia au kumtendea aliyetekwa kama mali au mtumwa. Tafsiri hii huhifadhi hali ya utumwa bila kudai kwa lazima kwamba kitenzi chenyewe humaanisha tu ‘kumfanya mtumwa.’
- source_word: וּמְכָרוֹ
  choice: na kumuuza
  rationale: Hii inawakilisha moja kwa moja kitenzi מכר pamoja na kiambishi chake cha yambwa.
- source_word: וּמֵת הַגַּנָּב הַהוּא
  choice: mtekaji nyara huyo lazima auawe
  rationale: Muktadha unamtambulisha ‘mwizi huyo’ kuwa mwibaji wa mtu. ‘Lazima auawe’ huwasilisha hukumu ya kifo kwa Kiswahili cha kisheria kilicho wazi.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Hivyo utaondoa uovu katikati yako
  rationale: Hii ni fomula ya hukumu inayojirudia katika Kumbukumbu la Torati; ‘utaondoa uovu’ ni ya asili na hudumisha nguvu ya amri katika muktadha.
theological_decisions:
- issue: Lugha ya undugu wa agano katika sheria
  choice: Kuhifadhi ‘ndugu zake’ na kuifafanua kwa ‘yaani mmoja wa Waisraeli.’
  alternative: mmoja wa Waisraeli wenzake
  rationale: Chaguo hili hudumisha taswira ya kifamilia ya maandishi ya Kiebrania na wakati huohuo huepusha dhana kwamba anazungumziwa ndugu wa kuzaliwa tu.
- issue: Maana ya וְהִתְעַמֶּר בּוֹ
  choice: akamtendea kama mtumwa
  alternative: akamfanya mtumwa; akamnyonya kwa faida
  rationale: Maana ya kitenzi katika muktadha huu inahusisha kumtawala na kumtumia mtu kama mali kabla ya kumuuza. Chaguo hili huhifadhi ukali huo na pia kutotatua kimya kimya tofauti ya kimsamiati.
- issue: Hukumu ya וּמֵת
  choice: lazima auawe
  alternative: atakufa
  rationale: Katika sheria hii kirai kinaweka adhabu ya kifo, si kutabiri tu kifo cha kawaida; tafsiri ya wajibu wa kisheria huiweka wazi bila kuongeza msingi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, katika mtindo wa sheria ulio wa heshima lakini unaoeleweka kwa msomaji wa kawaida. ‘Kuteka nyara’ na ‘mtekaji nyara’ hutumiwa kwa uwazi wa kisasa; ‘ndugu zake’ huhifadhi lugha ya kifamilia ya chanzo. Alama zote za tanbihi zimewekwa katika matini kuu kwa mpangilio wa kuonekana.
