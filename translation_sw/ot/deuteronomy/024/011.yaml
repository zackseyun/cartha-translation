  yaml_path: translation/ot/deuteronomy/024/011.yaml
  text: You shall stand outside[a], and the man to whom you are making the loan shall bring the pledge out to you.
translation:
  language: sw
  text: Utasimama nje, na yule mwanamume ambaye unamkopesha[a] atakuletea nje kitu kilichowekwa rehani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye ana deni kwako.” Usemi wa Kiebrania unaweza kukazia ama tendo la mkopeshaji la kutoa mkopo ama hali ya mdaiwa kuwa na deni.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּץ
  choice: nje
  rationale: Neno hili pamoja na kihusishi linamaanisha kuwa nje ya nyumba; “nje” ni Kiswahili cha kawaida na kinafaa katika sheria inayomzuia mkopeshaji kuingia nyumbani mwa mdaiwa.
- source_word: תַּעֲמֹד
  choice: utasimama
  rationale: Kitenzi עמד kimsingi humaanisha “kusimama.” Hapa kinadumisha amri halisi ya kusimama nje, huku katika muktadha kikidokeza pia kusubiri huko.
- source_word: וְהָאִישׁ
  choice: na yule mwanamume
  rationale: איש hapa ni “mwanamume” katika sheria hii; “yule” humtambulisha kwa kawaida kama mhusika anayeelezwa na kishazi kinachofuata.
- source_word: אֲשֶׁר אַתָּה נֹשֶׁה בוֹ
  choice: ambaye unamkopesha
  rationale: Katika muktadha wa dhamana ya mkopo, נשה inaweza kuonyesha tendo la mkopeshaji kutoa mkopo au hali ya mtu kuwa na deni kwake. Matini inatumia maana ya kukopesha, na tanbihi inadumisha uwezekano mwingine.
- source_word: יוֹצִיא
  choice: atakuletea nje
  rationale: Hiphil ya יצא ni kusababisha kitu kitoke, yaani kukitoa au kukileta nje. Muundo “atakuletea nje” unaunganisha tendo hilo na mwelekeo wa אֵלֶיךָ.
- source_word: אֵלֶיךָ
  choice: atakuletea
  rationale: Kihusishi kinaonyesha mwelekeo kuelekea kwa mkopeshaji; kiambishi “-ku-” katika “atakuletea” kinawasilisha maana ya “kwako.”
- source_word: הָעֲבוֹט
  choice: kitu kilichowekwa rehani
  rationale: עבוט ni kitu kinachotolewa kuwa dhamana ya mkopo. Usemi huu ni wazi kwa msomaji wa kawaida na unahifadhi wazo la mali maalumu iliyowekwa kama rehani.
- source_word: הַחוּצָה
  choice: nje
  rationale: Umbo hili linaonyesha mwendo kuelekea nje. “Nje” baada ya “atakuletea” linaonyesha kwamba kitu kinatolewa ndani ya nyumba na kuletwa kwa mkopeshaji aliyeko nje.
