  text: לֹא יַחֲבֹ֥ל רֵחַ֖יִם וָ/רָ֑כֶב כִּי נֶ֖פֶשׁ ה֥וּא חֹבֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/006.yaml
  text: No one shall take a pair of millstones[a], or even the upper millstone, as a pledge, for he would be taking a life as a pledge.
translation:
  language: sw
  text: Mtu asichukue jozi ya mawe ya kusagia, wala hata jiwe la juu, kama dhamana; kwa maana anachukua uhai wa mtu[a] kama dhamana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “riziki ya mtu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲבֹל / חֹבֵל
  choice: kuchukua ... kuwa dhamana
  rationale: Katika muktadha huu wa sheria, חבל humaanisha kuchukua kitu kama dhamana ya deni. Muundo huu ni wa kawaida na unaeleweka katika Kiswahili, nao unahifadhi urudiaji wa kitenzi katika aya.
- source_word: רֵחַיִם
  choice: mawe yote mawili ya kusagia
  rationale: Nomino hii yenye umbo la uwili inarejelea mawe mawili yanayotumiwa pamoja katika kinu cha mkono. Neno “yote” linaonyesha kuwa marufuku inahusu jozi nzima kabla ya kutaja hata jiwe moja muhimu.
- source_word: וָרָכֶב
  choice: wala hata jiwe la juu
  rationale: 'רָכֶב hapa ni jiwe la juu linalozungushwa juu ya jiwe la chini. “Wala hata” huwasilisha nguvu ya kisheria: mtu haruhusiwi kuchukua mawe yote mawili, wala hata sehemu hii moja muhimu.'
- source_word: כִּי
  choice: kwa maana
  rationale: Inaingiza sababu ya marufuku kwa lugha ya Kiswahili iliyo wazi na yenye hadhi.
- source_word: נֶפֶשׁ
  choice: uhai wa mtu
  rationale: Hapa נֶפֶשׁ haimaanishi nafsi isiyo ya mwili, bali maisha halisi yanayotegemea uwezo wa kuandaa chakula. Tafsiri hii inadumisha uzito wa kauli, huku tanbihi ikihifadhi uwezekano wa maana ya riziki.
- source_word: הוּא
  choice: kufanya hivyo ni
  rationale: Kiwakilishi kinarejelea tendo la mkopeshaji. Muundo huu wa Kiswahili unaweka wazi kwamba kuchukua mawe hayo kuwa dhamana ni sawa na kuchukua uhai au riziki ya mtu kuwa dhamana.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika muktadha wa sheria na maisha ya jamii
  choice: uhai wa mtu, kwa tanbihi inayotaja riziki
  alternative: nafsi; mtu; riziki ya mtu
  rationale: Mawe ya kusagia yalikuwa muhimu kwa kuandaa chakula cha kila siku, hivyo kuyachukua kungehatarisha maisha ya mdaiwa. “Uhai” huhifadhi uzito wa neno la Kiebrania, na tanbihi ya “riziki” huhifadhi maana yake ya kimuktadha bila kutoa dai la kimadhehebu kuhusu asili ya mwanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mawe yote mawili ya kusagia” kinaeleweka kwa wasomaji wa kawaida na kinaonyesha umbo la uwili la Kiebrania; “kuwa dhamana” kinafaa kwa muktadha wa deni bila kutumia istilahi nzito mno za kisheria.
