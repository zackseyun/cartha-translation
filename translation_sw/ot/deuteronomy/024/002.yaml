  text: Naye akishaondoka katika nyumba yake, akaenda na kuwa mke wa mwanamume mwingine,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kwa mwanamume mwingine.” Katika muktadha huu, nahau ya Kiebrania inamaanisha kwamba anaolewa na mwanamume mwingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצְאָה
  choice: akiondoka
  rationale: Kitenzi יצא katika mfuatano huu wa sheria kinaonyesha kuondoka kwake; ‘akiondoka’ huunganisha kwa kawaida sharti la mstari uliotangulia na hatua zinazofuata.
- source_word: מִבֵּיתוֹ
  choice: nyumbani mwa huyo mwanamume
  rationale: Maana ya moja kwa moja ni ‘kutoka katika nyumba yake.’ Kiswahili ‘nyumbani mwa huyo mwanamume’ ni cha kawaida na huweka wazi kwamba kiwakilishi kinamhusu mume wa kwanza katika kifungu hiki kirefu.
- source_word: וְהָלְכָה
  choice: akaenda
  rationale: הלך inaendeleza hatua inayofuata baada ya kuondoka; ‘akaenda’ ni ya asili na haiongezi wazo la namna au umbali wa safari.
- source_word: וְהָיְתָה
  choice: na kuwa
  rationale: היה pamoja na ל inaonyesha kuingia katika hali au uhusiano mpya; ‘kuwa’ huhifadhi mpito huo kwa lugha nyepesi.
- source_word: לְאִישׁ אַחֵר
  choice: mke wa mwanamume mwingine
  rationale: Kwa neno moja moja ni ‘kwa mwanamume mwingine,’ lakini katika muktadha wa talaka na ndoa nyingine, nahau hii humaanisha kuingia katika ndoa na mwanamume mwingine. Neno ‘mke’ linaweka wazi maana ya kimuktadha bila kuongeza dhana mpya.
theological_decisions:
- issue: Je, לְאִישׁ אַחֵר itafsiriwe kihalisi au maana yake ya ndoa iwekwe wazi?
  choice: mke wa mwanamume mwingine
  alternative: kwa mwanamume mwingine
  rationale: Muktadha wa karibu unaonyesha uhusiano wa ndoa. Tafsiri kuu inaweka maana hiyo wazi, huku tanbihi ikihifadhi muundo halisi wa Kiebrania na hivyo kutozima kabisa upekee wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘akiondoka … akaenda’ unasomeka kama mwendelezo wa shauri la kisheria lililoanza katika mstari wa 1; ‘huyo mwanamume’ huepusha utata wa ‘yake’ katika dondoo hii inayosimama peke yake.
