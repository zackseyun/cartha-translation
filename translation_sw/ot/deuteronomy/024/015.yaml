  text: בְּ/יוֹמ/וֹ֩ תִתֵּ֨ן שְׂכָר֜/וֹ וְֽ/לֹא תָב֧וֹא עָלָ֣י/ו הַ/שֶּׁ֗מֶשׁ כִּ֤י עָנִי֙ ה֔וּא וְ/אֵלָ֕י/ו ה֥וּא נֹשֵׂ֖א אֶת נַפְשׁ֑/וֹ וְ/לֹֽא יִקְרָ֤א עָלֶ֨י/ךָ֙ אֶל יְהוָ֔ה וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/015.yaml
  text: You shall give him his wages on his day[a], and the sun shall not go down on it, because he is poor and sets his life on it, so that he does not cry out against you to Yahweh, and it becomes sin in you.
translation:
  language: sw
  text: Mpe ujira wake siku hiyo hiyo, kabla jua halijazama, kwa sababu yeye ni maskini na anautegemea ujira huo kwa maisha yake.[a] Asije akamlilia Yahwe dhidi yako, na jambo hilo likawa dhambi kwako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “kwenye ujira huo anainua/hubeba nafsi yake,” nahau inayoonyesha kwamba anautegemea sana ujira huo ili aishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹמוֹ
  choice: siku hiyo hiyo
  rationale: Ingawa kihalisi ni ‘katika/siku yake,’ katika sheria hii maana yake ni kumlipa mfanyakazi siku ileile aliyofanya kazi. Kiswahili hiki ni cha kawaida na kinaonyesha uharaka huo.
- source_word: תִתֵּן שְׂכָרוֹ
  choice: Mpe ujira wake
  rationale: Muundo wa amri unafaa sheria hii, na ‘ujira’ ni malipo aliyoyapata mfanyakazi kwa kazi yake.
- source_word: וְלֹא תָבוֹא עָלָיו הַשֶּׁמֶשׁ
  choice: kabla jua halijazama
  rationale: Kirai cha Kiebrania kinaweka machweo kuwa mpaka wa mwisho wa kulipa. Tafsiri hii ni ya asili katika Kiswahili bila kubadili maana.
- source_word: כִּי עָנִי הוּא
  choice: kwa sababu yeye ni maskini
  rationale: עָנִי hapa inaonyesha hali ya uhitaji na udhaifu wa kiuchumi; ‘maskini’ ni neno la moja kwa moja na linaloeleweka.
- source_word: וְאֵלָיו הוּא נֹשֵׂא אֶת נַפְשׁוֹ
  choice: anautegemea ujira huo kwa maisha yake
  rationale: Nahau hiyo inaonyesha kuwa maisha yake yanategemea sana kupokea ujira. Tafsiri hii huwasilisha maana kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi taswira halisi.
- source_word: וְלֹא יִקְרָא עָלֶיךָ אֶל יְהוָה
  choice: Usije akamlilia Yahwe dhidi yako
  rationale: ‘Usije’ huonyesha matokeo yanayoonya, na ‘akamlilia ... dhidi yako’ huhifadhi wazo la mtu aliyeonewa kumwomba Mungu huku akimshtaki mkosaji.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: na jambo hilo likawa dhambi kwako
  rationale: Tafsiri hii huhifadhi kauli kwamba kutolipa kunakuwa dhambi inayomhusu mkosaji, bila kuifanya kuwa istilahi finyu zaidi ya kisheria.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko lina jina binafsi la Mungu, si cheo; ‘Yahwe’ hulihifadhi kwa namna inayotambulika katika Kiswahili.
- issue: Maana ya וְהָיָה בְךָ חֵטְא
  choice: jambo hilo likawa dhambi kwako
  alternative: ukapata hatia
  rationale: ‘Dhambi kwako’ huhifadhi lugha pana ya kimaadili ya Kiebrania badala ya kuibana kuwa tamko la hatia ya kisheria pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Siku hiyo hiyo’ na ‘kabla jua halijazama’ zimetumiwa kwa uwazi wa kawaida; tanbihi imehifadhi taswira ya nahau ya Kiebrania.
