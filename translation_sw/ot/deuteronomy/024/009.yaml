  yaml_path: translation/ot/deuteronomy/024/009.yaml
  text: Remember what Yahweh your God did to Miriam on the way when you were coming out of Egypt[a][b].
translation:
  language: sw
  text: Kumbuka kile ambacho Yahwe Mungu wako alimfanyia Miriamu njiani mlipokuwa mkitoka Misri.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kile ambacho Yahwe Mungu wako alikuwa amemfanyia Miriamu.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, wakati wa safari ya Israeli baada ya kutoka Misri; tazama Hesabu 12:1–15.
    reason: cross_reference
lexical_decisions:
- source_word: זָכוֹר
  choice: Kumbuka
  rationale: Ni amri ya moja kwa moja katika umoja; “Kumbuka” ni ya kawaida, wazi, na inadumisha uzito wa agano wa tendo la kukumbuka.
- source_word: אֵת אֲשֶׁר
  choice: kile ambacho
  rationale: Maneno haya yanaanzisha yaliyopaswa kukumbukwa. “Kile ambacho” ni Kiswahili cha kawaida na kinawakilisha vizuri kishazi husika.
- source_word: עָשָׂה
  choice: alimfanyia
  rationale: Kitenzi עשה pamoja na kiambishi kinachomtaja Miriamu kinaeleza jambo ambalo Mungu alimfanyia. Tafsiri hii haibainishi zaidi ya chanzo ikiwa tendo hilo lilikuwa adhabu au namna nyingine ya kushughulika naye.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa moja kwa moja badala ya kubadilishwa na cheo kama “BWANA.” Umbo “Yahwe” linafaa katika tahajia ya Kiswahili.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Ni umbo lenye kiambishi cha nafsi ya pili umoja na linatafsiriwa moja kwa moja kama “Mungu wako.”
- source_word: לְמִרְיָם
  choice: Miriamu
  rationale: Katika muundo “alimfanyia Miriamu,” kiambishi -m- na jina Miriamu vinaonyesha mtu aliyeathiriwa na tendo bila kuongeza tafsiri ya “dhidi ya.”
- source_word: בַּדֶּרֶךְ
  choice: njiani
  rationale: “Njiani” ni tafsiri fupi na ya kawaida ya “katika/njiani,” na katika muktadha inahusu safari baada ya kutoka Misri.
- source_word: בְּצֵאתְכֶם
  choice: mlipokuwa mkitoka
  rationale: Kiambishi cha chanzo ni cha nafsi ya pili wingi, na muundo huu wa Kiswahili unaonyesha wakati pamoja na mwendelezo wa kutoka.
- source_word: מִמִּצְרַיִם
  choice: Misri
  rationale: Pamoja na kitenzi “mkitoka,” jina hili huleta kwa kawaida maana kamili ya “mkitoka Misri” bila kuhitaji kihusishi kingine.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia Tetragramatoni kama jina binafsi. “Yahwe” hulihifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Mabadiliko kutoka nafsi ya pili umoja kwenda wingi
  choice: “Mungu wako” kisha “mlipokuwa mkitoka”
  alternative: Kusawazisha yote kuwa umoja au yote kuwa wingi
  rationale: Kiebrania kina amri na kiambishi cha umoja mwanzoni, lakini kinatumia kiambishi cha wingi katika “mlipotoka.” Tafsiri inadumisha badiliko hilo la kweli badala ya kulifuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka huku ikidumisha tofauti ya umoja katika “wako” na wingi katika “mlipokuwa,” kama ilivyo katika chanzo.
