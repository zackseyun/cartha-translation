  yaml_path: translation/ot/deuteronomy/024/020.yaml
  text: When you beat your olive tree[a], you shall not go over it again; it shall be for the sojourner, for the fatherless[c][b], and for the widow.
translation:
  language: sw
  text: Unapopiga mzeituni wako, usirudie kuupitia; zeituni zitakazobaki zitakuwa za mgeni anayeishi kati yenu,[a] yatima,[b] na mjane.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mtu asiye mzawa anayeishi miongoni mwa Waisraeli; pia inaweza kutafsiriwa “mgeni mkazi.”
    reason: cultural_note
  - marker: b
    text: Hapa neno la Kiebrania linaweza kumaanisha hasa mtu aliyefiwa na baba.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Unapopiga
  rationale: 'Katika sheria hii כִּי inaanzisha hali ya wakati: tendo linalotarajiwa linapotokea, si sharti la kubahatisha tu.'
- source_word: תַחְבֹּט
  choice: unapopiga matawi ... ili kuvuna
  rationale: חבט hapa ni kupiga matawi ili zeituni zidondoke. Ufafanuzi mfupi ‘matawi ... ili kuvuna’ unaifanya desturi ya kilimo ieleweke kwa msomaji wa sasa bila kubadili tendo.
- source_word: זֵיתְךָ
  choice: mzeituni wako
  rationale: זַיִת inaweza kumaanisha zeituni au mti wa zeituni; tendo la kupiga linaonyesha kuwa mti ndio unaokusudiwa. Umoja na kiambishi cha umilikaji vimehifadhiwa.
- source_word: לֹא תְפָאֵר אַחֲרֶיךָ
  choice: usirudie tena kuyapitia
  rationale: Katika sheria ya mavuno, piel ya פאר pamoja na אַחֲרֶיךָ inakataza kurudi kufanya pitio la pili ili kuchukua matunda yaliyosalia. Kiswahili hiki ni cha kawaida na huhifadhi maana ya marufuku.
- source_word: לַגֵּר
  choice: ya mgeni anayeishi kati yenu
  rationale: גֵּר ni mtu asiye mzawa anayekaa miongoni mwa jamii ya Israeli. Tafsiri hii ni wazi kuliko ‘mgeni’ peke yake na haimaanishi msafiri wa muda mfupi.
- source_word: לַיָּתוֹם
  choice: yatima
  rationale: יָתוֹם humaanisha yatima, na katika mazingira haya hasa mtoto aliyefiwa na baba. ‘Yatima’ ndiyo istilahi ya kawaida ya Kiswahili, huku tanbihi ikihifadhi umahususi huo.
- source_word: וְלָאַלְמָנָה
  choice: na mjane
  rationale: ‘Mjane’ ni tafsiri ya kawaida na sahihi ya אַלְמָנָה katika sheria za kuwatunza walio katika mazingira magumu.
- source_word: יִהְיֶה
  choice: yaliyobaki yatakuwa
  rationale: Kitenzi ‘kuwa’ hapa kinaonyesha mgao wa kisheria wa matunda yaliyosalia. Kiima ‘yaliyobaki’ kinawekwa wazi kutokana na muktadha wa kuvuna.
