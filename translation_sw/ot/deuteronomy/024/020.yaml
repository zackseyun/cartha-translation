revisions:
- from: Unapopiga matawi ya mzeituni wako ili kuvuna, usirudie tena kuyapitia; yaliyobaki yatakuwa ya mgeni anayeishi kati yenu,[a] yatima,[b] na mjane.
  to: Unapopiga mzeituni wako, usirudie kuupitia; zeituni zitakazobaki zitakuwa za mgeni anayeishi kati yenu,[a] yatima,[b] na mjane.
  rationale: Marekebisho yanaondoa nyongeza isiyohitajika ya “matawi ... ili kuvuna,” yanaweka kirejeo sahihi kwa mzeituni, na yanafafanua kwa uaminifu kwamba ni zeituni zilizosalia zinazotengwa kwa makundi hayo. Tanbihi zimeboreshwa kwa matumizi ya kawaida ya Kiswahili na kwa usahihi wa kileksika.
