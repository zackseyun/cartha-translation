    issue: Kirejeo kisicho sahihi/cha utata katika “usirudie tena kuyapitia.”
    rationale: “-ya-” hurejelea “matawi,” ambayo yameongezwa katika tafsiri; Kiebrania hukataza kurudia kuupitia mzeituni baada ya kupiga. Pia “rudia tena” ni marudio.
  - severity: low
    issue: Tanbihi ya yatima inatia kikomo cha “mtoto.”
    rationale: יָתוֹם huonyesha hasa mtu aliyefiwa na baba katika matumizi ya kisheria; si lazima neno lenyewe limweke kikomo mhusika kuwa mtoto.
  - severity: low
    issue: “Mkaaji mgeni” katika tanbihi si mpangilio wa kawaida zaidi wa Kiswahili.
    rationale: “Mgeni mkazi” ni istilahi iliyozoeleka zaidi kwa mkazi asiye mzawa.
