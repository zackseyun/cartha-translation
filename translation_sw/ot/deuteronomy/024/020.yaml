  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa urahisi. ‘Mzeituni’ na maelezo ya kupiga matawi yanawasilisha mazingira ya uvunaji; sentensi ya pili inaweka wazi kuwa kinachoachwa ni matunda yaliyobaki.
