  verdict: revise
  source_fidelity: 'Maana kuu imehifadhiwa vizuri: kupiga mzeituni, kutofanya pitio la pili, na kuacha mavuno kwa ajili ya mgeni mkazi, yatima, na mjane. Hata hivyo, kiwakilishi katika “kuyapitia” hurejelea matawi yaliyotajwa kwa nyongeza, badala ya mzeituni/mavuno katika msemo wa Kiebrania. “Zeituni zitakazobaki” huweka wazi kitu kinachoachwa bila kubadili maana.'
  naturalness: Kiswahili ni sanifu kwa jumla, lakini “usirudie tena” ni marudio yasiyohitajika, na “kuyapitia” husikika kuwa ni kupitia matawi. “Usirudie kuupitia” ni sahihi zaidi kimarejeleo na ni ya kawaida.
  terminology: “Mzeituni,” “mgeni anayeishi kati yenu,” “yatima,” na “mjane” zinafaa. Tanbihi ya mgeni itumie istilahi ya kawaida zaidi “mgeni mkazi.” Tanbihi ya yatima isiseme “mtoto” kwa ukomo, kwa kuwa neno la Kiebrania linamaanisha hasa aliyefiwa na baba lakini si lazima liweke kikomo hicho cha umri.
  issues:
