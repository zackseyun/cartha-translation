  yaml_path: translation/ot/deuteronomy/024/010.yaml
  text: When you lend your neighbor anything[a], you shall not go into his house to take his pledge.
translation:
  language: sw
  text: Ukimkopesha mwenzako kitu chochote[a], usiingie nyumbani kwake kuchukua kitu alichoweka kuwa dhamana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ikiwa unamkopesha mwenzako kitu chochote.”
    reason: Neno la Kiebrania linaweza kuanzisha hali hii kwa maana ya “wakati” au “ikiwa”; muundo wa Kiswahili ‘uki-’ unaweza kubeba maana zote mbili.
lexical_decisions:
- source_word: כִּי
  choice: Uki-
  rationale: Katika sheria ya hali maalumu, כִּי huanzisha tukio linaloweza kutokea. Kiambishi ‘uki-’ ni cha kawaida na cha asili katika Kiswahili, huku kikihifadhi maana inayoweza kueleweka kama ‘wakati’ au ‘ikiwa.’
- source_word: תַשֶּׁה
  choice: umkopesha
  rationale: Hifili ya נשה hapa inamaanisha kumpa mtu mkopo au kumkopesha. ‘Kumkopesha’ ni usemi wa moja kwa moja na wa kawaida katika Kiswahili.
- source_word: בְרֵעֲךָ
  choice: mwenzako
  rationale: רֵעַ hapa humaanisha mtu mwingine wa jamii au jumuiya. ‘Mwenzako’ ni pana kuliko ‘jirani yako,’ ambayo kwa Kiswahili mara nyingi humaanisha hasa mtu anayeishi karibu.
- source_word: מַשַּׁאת מְאוּמָה
  choice: kitu chochote
  rationale: Muktadha wa kitenzi cha kukopesha tayari unaonyesha kwamba מדובר ni mkopo; ‘kitu chochote’ huwasilisha upana wa מְאוּמָה bila kurudia neno ‘mkopo’ kwa namna isiyo ya asili.
- source_word: לֹא תָבֹא אֶל בֵּיתוֹ
  choice: usiingie nyumbani kwake
  rationale: Katika sheria hii, לֹא pamoja na kitenzi kisichotimilika ni katazo. ‘Usiingie’ ni katazo la kawaida, wazi, na lenye hadhi katika Kiswahili.
- source_word: לַעֲבֹט עֲבֹטוֹ
  choice: kuchukua kitu alichoweka kuwa dhamana
  rationale: Mzizi עבט na nomino inayohusiana hutaja kuchukua kitu kilichowekwa kama hakikisho la mkopo. Usemi huu unaeleweka kwa wasomaji wa sasa kuliko kutumia ‘rehani,’ ambayo inaweza kudokeza hasa mali isiyohamishika.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia katazo la moja kwa moja ‘usiingie’ na maelezo wazi ya dhamana ili kuepuka istilahi ya kisheria isiyoeleweka kwa urahisi.
