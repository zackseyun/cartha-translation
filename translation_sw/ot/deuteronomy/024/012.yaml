lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Inaendeleza sharti la mstari uliotangulia; “lakini ikiwa” ni ya kawaida katika Kiswahili na inaonyesha hali tofauti inayohitaji uangalifu maalumu.
- source_word: אִישׁ עָנִי הוּא
  choice: huyo ni mtu maskini
  rationale: “Mtu maskini” huonyesha umaskini wa kiuchumi katika muktadha huu wa sheria. “Huyo” hudumisha urejeo wa umoja na msisitizo wa kiwakilishi הוּא bila kufanya sentensi kuwa nzito.
- source_word: לֹא תִשְׁכַּב
  choice: usilale
  rationale: Kitenzi שׁכב humaanisha kulala au kujilaza. Hapa kinakataza kulala usiku huku dhamana ya maskini ikiwa bado mikononi mwa mkopeshaji.
- source_word: בַּעֲבֹטוֹ
  choice: ukiwa na dhamana yake
  rationale: 'עֲבוֹט ni kitu kilichotolewa kuwa hakikisho la mkopo. Muundo “ukiwa na dhamana yake” unaeleza kwa Kiswahili cha kawaida maana ya ב katika muktadha huu: kukihifadhi kitu hicho wakati wa usiku.'
