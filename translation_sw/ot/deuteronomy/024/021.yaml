base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/021.yaml
  text: When you harvest the grapes of your vineyard[a], you shall not go over it again after yourself; it shall be for the sojourner, the fatherless[c][b], and the widow.
translation:
  language: sw
  text: Utakapovuna zabibu katika shamba lako la mizabibu, usirudi kuokota zilizobaki[a]; zitakuwa za mgeni[b], yatima[c], na mjane.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “usiokote tena baada ya kuvuna.” Kitenzi cha Kiebrania kinamaanisha kupitia tena ili kukusanya zabibu zilizobaki.
    reason: lexical_alternative
  - marker: b
    text: “Mgeni” hapa ni mkazi asiye mzawa anayeishi miongoni mwa Waisraeli; pia inaweza kutafsiriwa “mgeni mkazi.”
    reason: cultural_note
  - marker: c
    text: Neno la Kiebrania linaweza kutafsiriwa pia “mtoto aliyefiwa na baba”; katika miktadha mingi humaanisha yatima.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Utakapovuna
  rationale: Katika sheria hii כִּי inatanguliza hali inayotarajiwa; muundo wa Kiswahili wa “utakapo-” unaonyesha kwa kawaida maana ya “wakati.”
- source_word: תִבְצֹר
  choice: utakapovuna zabibu
  rationale: Kitenzi בצר kinahusu hasa kuvuna zabibu. Kutaja “zabibu” wazi kunatoa maana hiyo maalumu kwa Kiswahili cha kawaida.
- source_word: כַּרְמְךָ
  choice: katika shamba lako la mizabibu
  rationale: Hii ni tafsiri ya kawaida na iliyo wazi ya כֶּרֶם katika Kiswahili.
- source_word: לֹא תְעוֹלֵל אַחֲרֶיךָ
  choice: usirudi kuokota zilizobaki
  rationale: Katika muktadha huu עולל pamoja na אַחֲרֶיךָ inakataza mwenye shamba kupitia tena na kukusanya zabibu zilizobaki baada ya mavuno ya kwanza. Muundo huu ni wa asili na haumpi mwenye shamba jukumu la kawaida la maskini la kuokota masazo.
- source_word: לַגֵּר
  choice: za mgeni anayeishi kati yenu
  rationale: גֵּר ni mtu asiye mzawa anayeishi kwa kudumu au kwa muda miongoni mwa Israeli; ufafanuzi huu unaonyesha hadhi yake ya kijamii na kisheria kuliko neno “mgeni” peke yake.
- source_word: לַיָּתוֹם
  choice: yatima
  rationale: יָתוֹם humaanisha mtu aliyefiwa na baba au yatima. “Yatima” ni neno la kawaida na lenye heshima katika Kiswahili.
- source_word: וְלָאַלְמָנָה
  choice: na mjane
  rationale: אַלְמָנָה humaanisha moja kwa moja “mjane.”
- source_word: יִהְיֶה
  choice: zitakuwa za
  rationale: Umbo hili linaonyesha kwamba zabibu zilizoachwa zinapaswa kuwa mali au sehemu ya makundi hayo yenye uhitaji; wingi unapatana kwa kawaida na “zabibu” katika Kiswahili.
