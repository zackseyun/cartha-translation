  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia muundo wa moja kwa moja wa sheria, huku “usirudi kuokota zilizobaki” ikieleza wazi marufuku ya kufanya mzunguko wa pili wa mavuno.
