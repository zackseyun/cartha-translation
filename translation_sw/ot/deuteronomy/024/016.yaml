base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/016.yaml
  text: Fathers shall not be put to death for sons[a], and sons shall not be put to death for fathers[b]; each man shall be put to death for his own sin.
translation:
  language: sw
  text: Baba hawatauawa kwa sababu ya wana wao wa kiume, wala wana wa kiume hawatauawa kwa sababu ya baba zao; kila mtu atauawa kwa sababu ya dhambi yake mwenyewe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוּמְתוּ / יוּמָתוּ
  choice: hawatauawa / atauawa
  rationale: Hofali ya מות ina maana ya kusababishwa kufa, yaani kuuawa katika muktadha huu wa kisheria. Kiswahili “kuuawa” huhifadhi hali ya kutendwa bila kuongeza istilahi mahususi zaidi ya “kunyongwa” au “kuhukumiwa kifo.”
- source_word: אָבוֹת
  choice: baba
  rationale: Neno la Kiebrania humaanisha hasa “baba,” si “wazazi,” na linadumisha ulinganifu wa kifamilia wa mstari.
- source_word: בָּנִים
  choice: wana
  rationale: “Wana” ni neno la Kiswahili lenye hadhi linalolingana na maana halisi ya “sons,” huku likiwa la kawaida katika muktadha wa kifamilia na kisheria.
- source_word: עַל
  choice: kwa sababu ya
  rationale: Katika muktadha huu wa sheria, עַל huonyesha msingi wa adhabu au uwajibikaji; “kwa sababu ya” ni wazi na ya asili katika Kiswahili.
- source_word: אִישׁ
  choice: kila mtu
  rationale: אִישׁ hapa ina nguvu ya ugawaji kwa kila mmoja. “Kila mtu” huwasilisha kanuni ya uwajibikaji wa mtu binafsi kwa Kiswahili cha kawaida bila kupotosha maana.
- source_word: בְּחֶטְאוֹ
  choice: kwa sababu ya dhambi yake mwenyewe
  rationale: Kiambishi בְּ kinaonyesha sababu ya hukumu, na kiambishi cha umilikaji kinawakilishwa na “yake”; “mwenyewe” huweka wazi tofauti kati ya kosa la mtu na la jamaa yake.
theological_decisions:
- issue: Uwajibikaji wa mtu binafsi katika adhabu ya kifo
  choice: Mstari unakataza mtu kuuawa kwa dhambi ya baba yake au ya mwana wake; kila mmoja anawajibika kwa dhambi yake mwenyewe.
  alternative: Kauli pana kuhusu matokeo yote ya dhambi katika vizazi mbalimbali.
  rationale: Kurudiwa kwa Hofali ya מות kunaelekeza hasa kwenye kuuawa katika hukumu, si kila aina ya matokeo ya dhambi. Tafsiri inadumisha upeo huo wa kisheria bila kupanua kauli kimya-kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sambamba wa Kiebrania umehifadhiwa. Hakuna tanbihi iliyohitajika kwa kuwa “wana” na “kuuawa” zinawakilisha maandishi ya chanzo kwa uwazi.
