    issue: “Wana” is gender-inclusive or ambiguous in normal Swahili usage.
    rationale: The source text explicitly uses “sons” in both clauses, not a generic term for children. “Wana wa kiume” preserves this lexical specification while retaining the legal sense of the verse.
