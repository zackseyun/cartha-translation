  source_fidelity: The repeated passive/Hophil sense of judicial killing is well conveyed by “hawatauawa / atauawa,” and the distributive final clause accurately retains individual liability. However, bare “wana” ordinarily means “children” in contemporary Standard East African Swahili and does not reliably preserve the Hebrew’s specifically male term בָּנִים (“sons”).
  naturalness: The draft is clear, dignified, and idiomatic. Adding “wa kiume” after “wana” is natural enough in this legal parallelism and removes the lexical ambiguity without making the sentence cumbersome.
  terminology: “Baba,” “kuuawa,” “dhambi,” and “kila mtu” are appropriate standard terms. “Kwa sababu ya” adequately expresses punishment on account of another person’s offense in this context.
