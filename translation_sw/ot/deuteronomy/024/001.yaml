source:
  edition: WLC
  text: כִּֽי יִקַּ֥ח אִ֛ישׁ אִשָּׁ֖ה וּ/בְעָלָ֑/הּ וְ/הָיָ֞ה אִם לֹ֧א תִמְצָא חֵ֣ן בְּ/עֵינָ֗י/ו כִּי מָ֤צָא בָ/הּ֙ עֶרְוַ֣ת דָּבָ֔ר וְ/כָ֨תַב לָ֜/הּ סֵ֤פֶר כְּרִיתֻת֙ וְ/נָתַ֣ן בְּ/יָדָ֔/הּ וְ/שִׁלְּחָ֖/הּ מִ/בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/001.yaml
  text: If a man takes a wife and marries her[a], and it happens that she does not find favor in his eyes because he has found in her some indecency, and he writes her a certificate of divorce, puts it into her hand, and sends her out of his house,
translation:
  language: sw
  text: Ikiwa mwanamume atamchukua mwanamke na kumwoa, ikawa kwamba mwanamke huyo hapati kibali machoni pake kwa sababu amekuta ndani yake jambo fulani la aibu[a], naye akamwandikia hati ya talaka, akaiweka mkononi mwake, na kumtuma aondoke kutoka nyumbani mwake,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jambo lisilofaa” au “jambo la uchi.” Usemi wa Kiebrania una utata wa makusudi na umefasiriwa kwa njia zaidi ya moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ikiwa
  rationale: Neno hili linaanzisha hali ya kisheria yenye masharti, si sababu wala amri. “Ikiwa” linaonyesha wazi mwanzo wa sharti linaloendelea katika mistari inayofuata.
- source_word: יִקַּח אִישׁ אִשָּׁה וּבְעָלָהּ
  choice: mwanamume anamchukua mwanamke kuwa mke wake na kumwoa
  rationale: Tafsiri hii inahifadhi vipengele viwili vya Kiebrania—kumchukua awe mke na kuingia naye katika uhusiano wa ndoa—bila kutumia lugha inayoweza kudokeza kwamba mwanamke ni mali.
- source_word: וְהָיָה
  choice: kisha ikawa
  rationale: Kauli hii inaendeleza mfululizo wa hali katika sheria ya masharti kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: לֹא תִמְצָא חֵן בְּעֵינָיו
  choice: hapati kibali machoni pake
  rationale: Inahifadhi sitiari ya Kiebrania ya kupata kibali machoni mwa mtu huku maana ikibaki wazi kwa msomaji wa Kiswahili.
- source_word: כִּי מָצָא בָהּ
  choice: kwa sababu amegundua kwake
  rationale: “Kwa sababu” linaonyesha nguvu ya maelezo ya כִּי, na “amegundua kwake” linafuata mtazamo wa kifungu bila kuongeza hukumu kuhusu ukweli wa madai hayo.
- source_word: עֶרְוַת דָּבָר
  choice: jambo fulani la aibu
  rationale: Kauli ya Kiebrania haiko wazi kwa makusudi. Tafsiri hii ni ya kawaida na yenye staha, lakini haiibani maana kuwa kosa moja mahususi.
- source_word: סֵפֶר כְּרִיתֻת
  choice: hati ya talaka
  rationale: Hili ni jina wazi la Kiswahili kwa hati rasmi inayovunja ndoa, na linaeleza kazi ya usemi wa Kiebrania badala ya kuutafsiri neno kwa neno.
- source_word: וְנָתַן בְּיָדָהּ
  choice: akaiweka mkononi mwake
  rationale: Inahifadhi tendo halisi na la kisheria la kumpa mwanamke hati hiyo mkononi.
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: na kumwondoa nyumbani mwake
  rationale: Inabeba maana ya kumruhusu au kumtuma aondoke, pamoja na sehemu anayotoka, bila kuongeza maelezo yasiyomo katika chanzo.
theological_decisions:
- issue: Je, mstari huu ni amri inayoruhusu talaka au ni mwanzo wa hali ya sheria yenye masharti?
  choice: Umetafsiriwa kama hali ya kisheria yenye masharti, si kama amri ya kutoa talaka.
  alternative: Unaweza kutafsiriwa kwa namna inayosikika kama ruhusa au agizo la kutoa talaka chini ya hali fulani.
  rationale: Muundo wa Kumbukumbu la Torati 24:1–4 unaanza sharti katika mstari wa 1 na kulipeleka mbele hadi katazo kuu litakapotolewa baadaye. “Ikiwa” na koma ya mwisho vinazuia mstari huu kusikika kama amri inayojitegemea.
- issue: Maana mahususi ya עֶרְוַת דָּבָר
  choice: jambo fulani la aibu
  alternative: jambo lisilofaa; jambo la uchi
  rationale: Usemi huo wa Kiebrania una utata wa kweli na umeeleweka kwa njia zaidi ya moja. Tafsiri kuu na tanbihi zinaacha utata huo bila kuugeuza kuwa kosa maalumu la kingono au sababu nyingine mahsusi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umeachwa wazi kama sharti linaloendelea, na koma ya mwisho inaonyesha kwamba kauli ya sheria haijakamilika katika mstari huu. Alama ya tanbihi [a] imewekwa baada ya usemi tata unaoelezwa.
