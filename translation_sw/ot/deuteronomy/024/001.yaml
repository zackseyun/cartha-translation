review_pass:
  verdict: revise
  source_fidelity: Draft correctly presents the verse as the opening conditional scenario and retains the ambiguity of עֶרְוַת דָּבָר. However, its final verb, “kumwondoa,” can imply forcibly removing her rather than sending her away/out from his house.
  naturalness: “Amegundua kwake” is not idiomatic Standard East African Swahili in this context. The opening also redundantly says both “kuwa mke wake” and “kumwoa.”
  terminology: “Hati ya talaka” is an appropriate modern legal rendering of סֵפֶר כְּרִיתֻת. “Jambo fulani la aibu” suitably preserves the indefinite, disputed expression, with a footnote that states the ambiguity.
  issues:
  - severity: medium
    issue: “kumwondoa nyumbani mwake” overstates וְשִׁלְּחָהּ מִבֵּיתוֹ
    rationale: The Hebrew means send her away/out of his house. “Kumwondoa” may suggest physically removing or expelling her; “kumtuma aondoke kutoka nyumbani mwake” preserves the procedural and spatial sense without adding coercion.
  - severity: medium
    issue: “amegundua kwake” is unnatural and unclear
    rationale: This wording does not naturally convey “he has found in her.” “Amekuta ndani yake” is idiomatic while retaining the narrator’s presentation of the man’s finding rather than asserting a specified offence.
  - severity: low
    issue: Redundancy in “anamchukua mwanamke kuwa mke wake na kumwoa”
    rationale: The phrase repeats the marital sense more heavily than the Hebrew requires in Swahili. “Atamchukua mwanamke na kumwoa” retains both source elements in natural legal phrasing.
  revised_text: Ikiwa mwanamume atamchukua mwanamke na kumwoa, ikawa kwamba mwanamke huyo hapati kibali machoni pake kwa sababu amekuta ndani yake jambo fulani la aibu[a], naye akamwandikia hati ya talaka, akaiweka mkononi mwake, na kumtuma aondoke kutoka nyumbani mwake,
  revised_footnotes:
  - marker: a
    text: Au “jambo lisilofaa” au “jambo la uchi.” Usemi wa Kiebrania una utata wa makusudi na umefasiriwa kwa njia zaidi ya moja.
    reason: lexical_alternative
  revision_rationale: Revisions improve idiomatic Swahili and more precisely represent the actions of finding, formally giving the document, and sending the woman out of the house. The conditional, unfinished syntax and final comma are retained because this verse begins a legal case whose resolution occurs later. The disputed Hebrew expression remains deliberately nonspecific.
