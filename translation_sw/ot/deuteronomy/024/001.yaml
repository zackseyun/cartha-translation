- from: Ikiwa mwanamume anamchukua mwanamke kuwa mke wake na kumwoa, kisha ikawa mwanamke huyo hapati kibali machoni pake kwa sababu amegundua kwake jambo fulani la aibu[a], naye akamwandikia hati ya talaka, akaiweka mkononi mwake na kumwondoa nyumbani mwake,
