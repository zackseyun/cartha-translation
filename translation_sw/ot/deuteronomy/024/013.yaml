review_pass:
  verdict: revise
  source_fidelity: Draft accurately conveys the emphatic requirement to return the pledged item by sunset, the debtor's ability to sleep covered by his garment, his blessing of the creditor, and the resulting righteousness before Yahweh. The purpose/result relation is appropriately expressed with “ili.”
  naturalness: “Alale akiwa amejifunika vazi lake” is understandable, but “alale akijifunika kwa vazi lake” is more idiomatic Standard East African Swahili for sleeping covered with a garment. A comma in “Yahwe, Mungu wako” makes the apposition clear and reads more naturally.
  terminology: “Kitu kilichowekwa rehani” suitably represents the pledged collateral. “Haki” preserves the concise semantic breadth of צְדָקָה without importing an accounting or doctrinal interpretation; the footnote supplies legitimate alternatives. “Yahwe” consistently renders the divine name.
  issues:
  - severity: low
    issue: Idiomatic expression for sleeping in/under the cloak
    rationale: The draft’s wording can suggest that the person is already wrapped before lying down. “Alale akijifunika kwa vazi lake” directly and naturally expresses the Hebrew sense that he can use his cloak as a nighttime covering.
  - severity: low
    issue: Apposition in the divine title
    rationale: Adding a comma in “Yahwe, Mungu wako” clarifies that “Mungu wako” stands in apposition to the divine name, matching the Hebrew construction.
  revised_text: Ni lazima umrudishie kitu kilichowekwa rehani[a] wakati jua linapotua, ili alale akijifunika kwa vazi lake na akubariki; na hilo litakuwa haki kwako[b] mbele za Yahwe, Mungu wako.
