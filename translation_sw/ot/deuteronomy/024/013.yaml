  text: הָשֵׁב֩ תָּשִׁ֨יב ל֤/וֹ אֶֽת הַ/עֲבוֹט֙ כְּ/בֹ֣א הַ/שֶּׁ֔מֶשׁ וְ/שָׁכַ֥ב בְּ/שַׂלְמָת֖/וֹ וּ/בֵֽרֲכֶ֑/ךָּ וּ/לְ/ךָ֙ תִּהְיֶ֣ה צְדָקָ֔ה לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/013.yaml
  text: You must surely return the pledge to him at sunset[a], so that he may lie down in his cloak and bless you[b]; and it will be righteousness for you before Yahweh your God.
translation:
  language: sw
  text: Ni lazima umrudishie kitu kilichowekwa rehani[a] wakati jua linapotua, ili alale akijifunika kwa vazi lake na akubariki; na hilo litakuwa haki kwako[b] mbele za Yahwe, Mungu wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhamana ya mkopo” au “kitu kilichochukuliwa kuwa rehani.”
    reason: lexical_alternative
  - marker: b
    text: Au “hilo litahesabiwa kuwa haki kwako” au “hilo litakuwa tendo la haki kwako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב תָּשִׁיב
  choice: Ni lazima umrudishie
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi cha mzizi שוב unasisitiza amri. “Ni lazima” huonyesha mkazo huo kwa Kiswahili cha kawaida.
- source_word: הַעֲבוֹט
  choice: kitu kilichowekwa rehani
  rationale: Neno hili linamaanisha kitu kilichotolewa kuwa dhamana ya mkopo. Usemi huu unaeleweka kwa urahisi kuliko kutumia “rehani” peke yake, ambayo pia huweza kumaanisha mpango wenyewe wa deni.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: wakati jua linapotua
  rationale: Hii ni nahau ya Kiebrania inayorejelea kutua kwa jua; tafsiri hii ni ya asili na wazi katika Kiswahili.
- source_word: וְשָׁכַב בְּשַׂלְמָתוֹ
  choice: ili alale akiwa amejifunika vazi lake
  rationale: Katika muktadha, kurudishwa kwa vazi kunamwezesha mwenye deni kulitumia kujifunika usiku. “Ili” huwasilisha matokeo au kusudi linalodokezwa bila kubadili maana ya msingi.
- source_word: וּבֵרֲכֶךָּ
  choice: na akubariki
  rationale: Kiambishi cha nafsi ya pili umoja kinaonyesha kwamba mwenye deni ndiye anayembariki anayemrudishia vazi.
- source_word: וּלְךָ תִּהְיֶה צְדָקָה
  choice: na hilo litakuwa haki kwako
  rationale: Tafsiri hii inabaki karibu na Kiebrania na kuhifadhi uwezekano wa maana ya tendo lililo sawa au jambo linalohesabiwa kuwa haki, bila kulazimisha ufafanuzi mmoja.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: mbele za Yahwe Mungu wako
  rationale: “Mbele za” huonyesha kuwa jambo hilo liko katika uwepo au hukumu ya Mungu, na jina la agano יהוה limetolewa kama “Yahwe.”
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya צְדָקָה katika kauli hii
  choice: hilo litakuwa haki kwako
  alternative: hilo litahesabiwa kuwa haki kwako; hilo litakuwa tendo la haki kwako
  rationale: Kauli ya karibu na muundo wa Kiebrania huhifadhi mvutano kati ya sifa ya haki, tendo lililo sawa, na jambo linalotambuliwa kuwa haki mbele za Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Lugha ya kisheria imewekwa wazi bila kuwa ya kitaalamu kupita kiasi; mkazo wa amri na utata halisi wa צְדָקָה vimehifadhiwa.
