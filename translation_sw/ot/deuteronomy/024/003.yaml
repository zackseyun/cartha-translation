base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/003.yaml
  text: and the latter man hates her[a], and writes her a certificate of divorce, and puts it into her hand, and sends her out of his house, or if the latter man dies[c][b], who took her as his wife—
translation:
  language: sw
  text: na mwanamume huyo wa pili akamchukia[a], akamwandikia hati ya talaka[b], akampa hati hiyo mkononi, akamwondoa katika nyumba yake; au ikiwa mwanamume huyo wa pili, aliyemchukua kuwa mke wake[c], atakufa—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaanza kumchukia.” Muundo wa Kiebrania unaweza kutafsiriwa kama tendo katika mlolongo wa kisheria, lakini pia unaonyesha kwamba mwanamume huyo anakuwa na uadui kwake na kisha anampa talaka.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “hati ya kukatilia mbali,” yaani hati rasmi inayovunja ndoa.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania, “aliyemchukua kwake kuwa mke,” yaani aliyemwoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂנֵאָהּ
  choice: akamchukia
  rationale: Kitenzi שׂנא kina maana ya moja kwa moja ya ‘kuchukia.’ Muundo wenye ‘aka-’ unaendeleza mlolongo wa kisa cha kisheria kwa Kiswahili bila kupunguza uzito wa neno.
- source_word: הָאִישׁ הָאַחֲרוֹן
  choice: mwanamume huyo wa pili
  rationale: Ingawa אַחֲרוֹן kimsingi ni ‘wa mwisho/wa baadaye,’ katika utofautishaji huu wa wanaume wawili ‘wa pili’ ni Kiswahili cha kawaida na sahihi kwa mhusika wa pili, bila kubadili nomino ‘mwanamume’ kuwa ‘mume.’
- source_word: וְכָתַב לָהּ סֵפֶר כְּרִיתֻת
  choice: akamwandikia hati ya talaka
  rationale: סֵפֶר ni hati iliyoandikwa, na כְּרִיתֻת ni kuvunjwa rasmi kwa kifungo cha ndoa. ‘Hati ya talaka’ ni istilahi wazi, ya sasa, na yenye hadhi ya kisheria.
- source_word: וְנָתַן בְּיָדָהּ
  choice: akampa hati hiyo mkononi
  rationale: Tafsiri hii inahifadhi tendo halisi la kumpa hati mkononi kama hatua ya utaratibu wa kisheria; ‘hati hiyo’ huweka wazi rejeo la kiwakilishi.
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: na kumtoa katika nyumba yake
  rationale: Inahifadhi maana ya kumwondoa/kumpeleka aondoke pamoja na sehemu iliyoelezwa wazi, yaani kutoka katika nyumba yake, bila kuongeza lugha kali isiyolazimishwa na muktadha.
- source_word: אוֹ כִי יָמוּת
  choice: au ikiwa ... atakufa
  rationale: Huu ni uwezekano mwingine katika kisa cha sheria, kwa hiyo ‘au ikiwa’ huonyesha sharti hilo kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר לְקָחָהּ לוֹ לְאִשָּׁה
  choice: aliyemchukua awe mke wake
  rationale: Huu unahifadhi kwa kiasi kikubwa nahau ya Kiebrania ya ‘kumchukua kuwa mke’ huku ukieleweka kiasili kama kumwoa.
