  text: הֶ֤רֶף מִמֶּ֨/נִּי֙ וְ/אַשְׁמִידֵ֔/ם וְ/אֶמְחֶ֣ה אֶת שְׁמָ֔/ם מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם וְ/אֶֽעֱשֶׂה֙ אֽוֹתְ/ךָ֔ לְ/גוֹי עָצ֥וּם וָ/רָ֖ב מִמֶּֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/014.yaml
  text: Leave me alone[a], so that I may destroy them and blot out their name from under the heavens[b]; and I will make you into a nation mightier and more numerous than they are.
translation:
  language: sw
  text: Niache[a], ili niwaangamize na kulifuta jina lao kutoka chini ya mbingu[b]; nami nitakufanya wewe kuwa taifa lenye nguvu zaidi na lenye watu wengi zaidi kuliko wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Usinizuie, nami nitawaangamiza na kulifuta jina lao kutoka chini ya mbingu.”'
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “kutoka chini ya mbingu”; msemo huu unamaanisha kuondolewa duniani, yaani kutokuwapo tena wala kukumbukwa miongoni mwa wanadamu.
    reason: cultural_note
lexical_decisions:
- source_word: הֶרֶף מִמֶּנִּי
  choice: Niache
  rationale: Amri ya רפה pamoja na מן ina maana ya kuacha au kutomzuia msemaji. “Niache” ni Kiswahili cha kawaida na chenye nguvu kinachofaa katika usemi wa moja kwa moja.
- source_word: וְאַשְׁמִידֵם
  choice: ili niwaangamize
  rationale: שׁמד humaanisha kuharibu au kuangamiza kabisa. Muundo unaofuata amri unaweza kueleweka kama kusudi au matokeo; “ili” huonyesha mtiririko huo bila kudhoofisha hukumu.
- source_word: וְאֶמְחֶה אֶת־שְׁמָם
  choice: na kulifuta jina lao
  rationale: מחה katika nahau hii ni kufuta jina, yaani kuondoa kuwapo na ukumbusho wa watu. “Kulifuta jina lao” huhifadhi taswira ya chanzo kwa Kiswahili cha asili.
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: kutoka chini ya mbingu
  rationale: Tafsiri hii huhifadhi wingi wa Kiebrania, “mbingu,” na nahau ya kuondolewa duniani.
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: nami nitakufanya wewe kuwa taifa
  rationale: עשה pamoja na kihusishi ל huonyesha kumfanya mtu awe kitu fulani. “Wewe” imewekwa wazi kwa msisitizo wa Musa kama chanzo cha taifa jipya.
- source_word: עָצוּם
  choice: lenye nguvu zaidi
  rationale: Neno linaonyesha nguvu au uwezo, na מִמֶּנּוּ hulifanya kuwa linganishi; “lenye nguvu zaidi” ni la kawaida na wazi.
- source_word: וָרָב
  choice: watu wengi zaidi
  rationale: רב hapa huhusu wingi wa idadi. Kwa taifa, “watu wengi zaidi” ni ya asili kuliko “lenye idadi kubwa zaidi,” huku ikihifadhi ulinganisho.
- source_word: מִמֶּנּוּ
  choice: kuliko wao
  rationale: Kiambishi cha Kiebrania ni umoja na hurejelea Israeli kama taifa la pamoja; Kiswahili hutumia “wao” kwa kawaida inapolenga watu wanaounda taifa hilo.
theological_decisions:
- issue: Tamko la Mungu la hukumu na ahadi ya kumfanya Musa kuwa taifa kubwa zaidi
  choice: Usemi umetafsiriwa moja kwa moja kama tamko halisi ndani ya simulizi, bila kupunguza tishio wala kueleza kwamba lilikuwa jaribu kwa Musa.
  alternative: Kuashiria katika tafsiri kwamba usemi huo ulikuwa wa balagha tu au jaribu kwa Musa.
  rationale: Kiebrania kinawasilisha maneno ya moja kwa moja ya hukumu na ahadi. Tafsiri inapaswa kuhifadhi mvutano wa kitheolojia bila kuamua mjadala wa ufasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi ukali wa hukumu, ulinganisho wa taifa jipya na Israeli, pamoja na wingi wa neno “mbingu.”
