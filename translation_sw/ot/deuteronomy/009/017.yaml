revisions:
- from: Basi nikazishika zile mbao mbili, nikazitupa kutoka katika mikono yangu miwili, na kuzivunja mbele ya macho yenu.
  to: Basi nikavishika vibao vile viwili, nikavitupa kutoka katika mikono yangu yote miwili, nikavivunja mbele ya macho yenu.
  rationale: The revision uses “vibao” for לֻחֹת, avoiding the unintended wooden sense of “mbao” while not adding the material “stone.” It also restores the parallel narrative action sequence and preserves the Hebrew emphasis that the tablets were thrown from both hands.
