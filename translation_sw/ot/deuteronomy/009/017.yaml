  text: So I took hold of the two tablets and threw them from my two hands and shattered them before your eyes[a].
translation:
  language: sw
  text: Basi nikavishika vibao vile viwili, nikavitupa kutoka katika mikono yangu yote miwili, nikavivunja mbele ya macho yenu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתְפֹּשׂ
  choice: nikazishika
  rationale: Kitenzi תפשׂ hapa kinaeleza kushika kwa mkono. “Nikazishika” ni cha kawaida na hakiongezi wazo la nguvu lililo katika “nikazinyakua.”
- source_word: בִּשְׁנֵי הַלֻּחֹת
  choice: zile mbao mbili
  rationale: לֻחֹת ni mbao au vibao vya kuandikia; katika muktadha ni mbao za agano ambazo tayari zinajulikana. “Zile mbao mbili” ni usemi unaoeleweka na hauongezi neno “mawe,” ambalo halipo wazi katika mstari huu.
- source_word: וָאַשְׁלִכֵם
  choice: nikazitupa
  rationale: שלך humaanisha kutupa. “Nikazitupa” ni Kiswahili cha sasa na cha moja kwa moja, bila kuongeza ukali wa “nikazibwaga.”
- source_word: מֵעַל שְׁתֵּי יָדָי
  choice: kutoka katika mikono yangu miwili
  rationale: Tafsiri hii inadumisha wazo la kutoka mikononi na pia msisitizo wa Kiebrania juu ya mikono miwili.
- source_word: וָאֲשַׁבְּרֵם
  choice: kuzivunja
  rationale: שׁבר humaanisha kuvunja. “Kuzivunja” ni sahihi na haiongezi dai kwamba zilisambaratika kabisa vipande vipande.
- source_word: לְעֵינֵיכֶם
  choice: mbele ya macho yenu
  rationale: Huu ni msemo unaomaanisha hadharani mbele yao. Tafsiri hii inahifadhi picha ya Kiebrania na inaeleweka kwa urahisi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa vitenzi wenye kiambishi “-ka-” umehifadhi mwendo wa simulizi. Neno “mbao” limetumiwa kwa maana ya mbao za kuandikia zinazojulikana katika muktadha, si kama dai kuhusu nyenzo yake.
