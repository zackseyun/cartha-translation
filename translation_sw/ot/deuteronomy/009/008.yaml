base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/008.yaml
  text: Even at Horeb you provoked Yahweh to wrath[b][a], and Yahweh was angry with you enough to destroy you.
translation:
  language: sw
  text: Hata huko Horebu[a] mlimkasirisha Yahweh, naye Yahweh akawakasirikia ili awaangamize.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Na huko Horebu” au “Huko Horebu”; kiunganishi cha Kiebrania kinaweza kuendeleza tu simulizi, ingawa hapa huenda kinaongeza msisitizo.
    reason: lexical_alternative
  - marker: b
    text: Au “Yahweh akawakasirikia hata kuwaangamiza.” Kiebrania kinaunganisha moja kwa moja hasira ya Yahweh dhidi yenu na kuwaangamiza; infinitivu inaweza kueleweka kwa maana ya kusudi au matokeo yaliyotishiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְחֹרֵב
  choice: Hata huko Horebu
  rationale: Kiunganishi kinaendeleza orodha ya matendo ya uasi na huenda pia kina msisitizo; “Hata huko Horebu” huonyesha msisitizo huo kwa Kiswahili cha kawaida huku jina la mahali likihifadhiwa.
- source_word: הִקְצַפְתֶּם
  choice: mlimkasirisha
  rationale: Muundo wa Hiphil una maana ya kusababisha hasira; “mlimkasirisha” huhifadhi maana hiyo ya kisababishi kwa lugha ya asili na wazi.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: Jina la agano יְהוָה limetoholewa kama “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: וַיִּתְאַנַּף ... בָּכֶם
  choice: akawakasirikia
  rationale: Kitenzi אנף pamoja na בָּכֶם kinaonyesha hasira kali iliyoelekezwa kwa watu; “akawakasirikia” ni usemi wa kawaida na wenye uzito katika Kiswahili.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: kiasi cha kutaka kuwaangamiza
  rationale: Infinitivu yenye לְ inaunganisha hasira na maangamizi yaliyokusudiwa au kutishiwa. Tafsiri hii huonyesha uhusiano huo bila kudai kwamba maangamizi yalitekelezwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la agano; “Yahweh” hulihifadhi moja kwa moja bila kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya hasira ya Yahweh na maangamizi
  choice: akawakasirikia kiasi cha kutaka kuwaangamiza
  alternative: akawakasirikia ili kuwaangamiza
  rationale: לְהַשְׁמִיד inaweza kueleza kusudi au matokeo yaliyotishiwa. “Kiasi cha kutaka” huhifadhi uhusiano wa karibu na hasira na huepuka kudokeza kwamba maangamizi yalitimizwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Horebu” linafuata umbo lililozoeleka katika Kiswahili cha Biblia; muundo wa sentensi huhifadhi msisitizo na mvutano wa Kiebrania bila kuwa wa kizamani.
