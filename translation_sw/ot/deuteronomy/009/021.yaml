  text: וְֽ/אֶת חַטַּאתְ/כֶ֞ם אֲשֶׁר עֲשִׂיתֶ֣ם אֶת הָ/עֵ֗גֶל לָקַחְתִּי֮ וָ/אֶשְׂרֹ֣ף אֹת֣/וֹ בָּ/אֵשׁ֒ וָ/אֶכֹּ֨ת אֹת֤/וֹ טָחוֹן֙ הֵיטֵ֔ב עַ֥ד אֲשֶׁר דַּ֖ק לְ/עָפָ֑ר וָֽ/אַשְׁלִךְ֙ אֶת עֲפָר֔/וֹ אֶל הַ/נַּ֖חַל הַ/יֹּרֵ֥ד מִן הָ/הָֽר־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/021.yaml
  text: And I took your sin[a], the calf that you had made, and burned it with fire; then I crushed it, grinding it thoroughly until it was as fine as dust, and I threw its dust into the stream that comes down from the mountain.
translation:
  language: sw
  text: Nami niliichukua dhambi yenu—ndama mliyokuwa mmetengeneza—nikaiteketeza kwa moto. Kisha nikaiponda na kuisaga kabisa mpaka ikawa laini kama vumbi, halafu nikatupa vumbi lake katika kijito[a] kinachoteremka kutoka mlimani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkondo wa maji” au “bonde la mto wa msimu.” Neno la Kiebrania נחל linaweza kumaanisha kijito chenye maji, mkondo wa mafuriko, au bonde linalopitisha maji.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאתְכֶם
  choice: dhambi yenu
  rationale: Katika muktadha huu neno hilo linamtambulisha sanamu yenyewe kuwa dhambi ya Israeli, si dhabihu ya dhambi. Tafsiri hii inadumisha ukali wa usemi wa Kiebrania.
- source_word: הָעֵגֶל
  choice: ndama
  rationale: Hii ndiyo maana ya kawaida ya neno, na muktadha unaonyesha wazi kuwa ni ndama wa sanamu.
- source_word: וָאֶשְׂרֹף אֹתוֹ בָּאֵשׁ
  choice: nikaiteketeza kwa moto
  rationale: Usemi huu unahifadhi kutajwa wazi kwa moto na unaeleza uharibifu mkali wa sanamu kwa Kiswahili cha kawaida.
- source_word: וָאֶכֹּת אֹתוֹ
  choice: nikaiponda
  rationale: Kitenzi kinaweza kumaanisha kupiga, lakini hapa hatua inayofuata ya kusaga inaonyesha kuwa kusudi lilikuwa kuivunja na kuiponda.
- source_word: טָחוֹן הֵיטֵב
  choice: kuisaga kabisa
  rationale: Neno la namna linafafanua kupondwa, na kielezi kinaonyesha ukamilifu wa tendo.
- source_word: עַד אֲשֶׁר דַּק לְעָפָר
  choice: mpaka ikawa laini kama vumbi
  rationale: Tafsiri hii inaonyesha kiwango cha kusagwa na kuhifadhi ulinganisho na vumbi bila kuufanya mabaki kuwa majivu tu.
- source_word: עֲפָרוֹ
  choice: vumbi lake
  rationale: Hurejelea mabaki yaliyosagwa ya ndama na kuunganisha kwa kawaida na usemi uliotangulia.
- source_word: הַנַּחַל
  choice: kijito
  rationale: נחל linaweza kutaja kijito, mkondo wa maji, au bonde lenye maji ya msimu. ‘Kijito’ ni neno rahisi na la kawaida katika muktadha huu, huku tanbihi ikihifadhi upana wa maana.
- source_word: הַיֹּרֵד מִן הָהָר
  choice: kinachoteremka kutoka mlimani
  rationale: Huhifadhi nguvu ya hali endelevu ya kishirikishi cha Kiebrania na kueleza mwendo wa kijito kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kumtambulisha ndama moja kwa moja kuwa ‘dhambi yenu’
  choice: dhambi yenu—ndama mliyokuwa mmetengeneza
  alternative: kitu chenu cha dhambi—ndama mliyokuwa mmetengeneza
  rationale: Muundo wa Kiebrania unaweka ‘dhambi yenu’ na ‘ndama’ katika uhusiano wa ufafanuzi wa moja kwa moja. Tafsiri haipunguzi uzito huo kwa kuiita ndama kitu cha dhambi tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mistari ya vitendo imewekwa katika mfuatano wazi; dashibodi zinadumisha msisitizo wa Kiebrania unaomtambulisha ndama kuwa dhambi yenyewe. Upatanisho wa ngeli ya I-ZI umetumiwa kwa ndama kama kitu kilichotengenezwa na kusagwa.
