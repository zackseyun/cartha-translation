id: DEU.9.10
reference: Deuteronomy 9:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן יְהוָ֜ה אֵלַ֗/י אֶת שְׁנֵי֙ לוּחֹ֣ת הָֽ/אֲבָנִ֔ים כְּתֻבִ֖ים בְּ/אֶצְבַּ֣ע אֱלֹהִ֑ים וַ/עֲלֵי/הֶ֗ם כְּֽ/כָל הַ/דְּבָרִ֡ים אֲשֶׁ֣ר דִּבֶּר֩ יְהוָ֨ה עִמָּ/כֶ֥ם בָּ/הָ֛ר מִ/תּ֥וֹךְ הָ/אֵ֖שׁ בְּ/י֥וֹם הַ/קָּהָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/010.yaml
  text: And Yahweh gave me the two stone tablets[a], written with the finger of God[b], and on them were all the words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly.
translation:
  language: sw
  text: Yahwe akanipa vibao viwili vya mawe, vilivyoandikwa kwa kidole cha Mungu[a], na juu ya vibao hivyo kulikuwa na maneno yote ambayo Yahwe alikuwa amewaambia[b] mlimani, kutoka katikati ya moto, siku ya kusanyiko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vilivyoandikwa kwa kutumia kidole cha Mungu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kwa tafsiri ya karibu: “Yahwe alikuwa amesema nanyi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina la agano lililo katika maandishi ya Kiebrania badala ya kulibadili kuwa cheo.
- source_word: וַיִּתֵּן
  choice: akanipa
  rationale: Kitenzi נתן humaanisha kutoa au kumpa mtu kitu; kiambishi -ni kinawakilisha אֵלַי, ‘kwangu.’
- source_word: שְׁנֵי לוּחֹת הָאֲבָנִים
  choice: vibao viwili vya mawe
  rationale: Hii ni tafsiri ya kawaida na inayoeleweka ya vibao viwili vilivyotengenezwa kwa mawe.
- source_word: כְּתֻבִים
  choice: vilivyoandikwa
  rationale: Inatunza hali ya kutendwa ya kishirikishi cha Kiebrania bila kuongeza maelezo yasiyokuwamo.
- source_word: בְּאֶצְבַּע אֱלֹהִים
  choice: kwa kidole cha Mungu
  rationale: ‘Kwa’ linaonyesha chombo au njia ya tendo, na taswira halisi ya kidole cha Mungu imehifadhiwa.
- source_word: וַעֲלֵיהֶם
  choice: kwenye vibao hivyo kulikuwa na
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida kwamba yaliyofuata yalikuwa juu ya vibao, huku ukikamilisha sentensi ya Kiebrania isiyo na kitenzi wazi.
- source_word: כְּכָל הַדְּבָרִים
  choice: maneno yote
  rationale: Katika muktadha wa ujumbe uliosemwa na kuandikwa, דְּבָרִים inafaa kutafsiriwa ‘maneno,’ na כְּכָל inaonyesha ukamilifu wa yaliyomo.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה עִמָּכֶם
  choice: ambayo Yahwe alikuwa amewaambia
  rationale: ‘Alikuwa amewaambia’ ni Kiswahili cha kawaida kinachoonyesha kwamba kusema kulitangulia kupewa kwa vibao; tanbihi inahifadhi maana ya moja kwa moja zaidi ya עִם, ‘pamoja nanyi/nanyi.’
- source_word: בָּהָר
  choice: mlimani
  rationale: Ni usemi wa kawaida wa Kiswahili kwa mahali pa ufunuo huo.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: kutoka katikati ya moto
  rationale: Inahifadhi mkazo wa מִתּוֹךְ, si tu ‘kutoka motoni.’
- source_word: בְּיוֹם הַקָּהָל
  choice: siku ya kusanyiko
  rationale: קָהָל hapa ni mkusanyiko wa watu wa Israeli; ‘kusanyiko’ ni neno la sasa, lenye hadhi, na lisiloegemea dhehebu.
theological_decisions:
- issue: Taswira ya Mungu kutenda kwa kidole chake
  choice: kwa kidole cha Mungu
  alternative: kwa uwezo wa Mungu
  rationale: Maandishi yanatumia taswira dhahiri ya kibinadamu; tafsiri haiibadili kimya kimya kuwa maelezo ya kiroho au ya kimafumbo.
- issue: Uwakilishi wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Jina binafsi la agano limetajwa moja kwa moja katika chanzo, kwa hiyo limetoholewa kuwa ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- issue: Maana ya דִּבֶּר ... עִמָּכֶם
  choice: alikuwa amewaambia
  alternative: alikuwa amesema nanyi
  rationale: Chaguo kuu ni la kawaida zaidi katika Kiswahili kwa hotuba iliyoelekezwa kwa watu; tanbihi inahifadhi muundo wa Kiebrania wenye עִם, unaoweza kutafsiriwa kwa ukaribu zaidi ‘nanyi.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Sentensi imegawanywa mara mbili ili kuepuka mfuatano mzito bila kupoteza uhusiano wa mawazo. Alama za tanbihi [a] na [b] zimewekwa moja kwa moja baada ya maneno yanayohusika.
