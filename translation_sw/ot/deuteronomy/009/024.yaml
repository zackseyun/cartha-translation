lexical_decisions:
- source_word: מַמְרִים הֱיִיתֶם
  choice: Mmekuwa mkimwasi
  rationale: Muundo huu unaonyesha mwenendo wa uasi ulioendelea. Kiswahili cha kitenzi ‘mkimwasi’ ni cha kawaida na kinaeleza wazi kumpinga mamlaka ya Mungu.
- source_word: עִם
  choice: mkimwasi
  rationale: Ingawa kihalisia עִם humaanisha ‘pamoja na,’ ikiandamana na מרה hapa inaonyesha kuwa katika upinzani dhidi ya mtu; maana hiyo imejumuishwa kwa kawaida katika kitenzi ‘kumwasi.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: מִיּוֹם
  choice: tangu siku
  rationale: Hueleza mwanzo wa kipindi kinachotajwa, huku ikidumisha picha halisi ya ‘siku.’
- source_word: דַּעְתִּי אֶתְכֶם
  choice: nilipowajua
  rationale: Ni tafsiri ya moja kwa moja inayorejelea Musa kuanza kuwafahamu watu hao, bila kuamua kwa undani zaidi aina ya ujuzi unaokusudiwa.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Maana ya עִם pamoja na מרה
  choice: kumwasi Yahwe
  alternative: kuwa waasi pamoja na Yahwe
  rationale: Katika muktadha huu kirai kinaonyesha upinzani kwa Yahwe. Tafsiri ya neno kwa neno ‘pamoja na’ ingeweza kupotosha, lakini tanbihi huhifadhi umbo la Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa kitenzi umetumiwa badala ya ‘mmekuwa waasi dhidi ya’ ili sentensi iwe ya kawaida zaidi bila kupoteza shtaka la uasi unaoendelea.
