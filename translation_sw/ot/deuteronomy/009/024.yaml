  text: You have been rebellious against Yahweh from the day I knew you[a].
translation:
  language: sw
  text: Tangu siku nilipowajua, mmekuwa waasi dhidi ya Yahwe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “pamoja na Yahwe”; hapa kirai hicho kina maana ya kuwa katika upinzani dhidi yake.'
