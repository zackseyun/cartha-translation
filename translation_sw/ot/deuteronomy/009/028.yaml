id: DEU.9.28
reference: Deuteronomy 9:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: פֶּן יֹאמְר֗וּ הָ/אָרֶץ֮ אֲשֶׁ֣ר הוֹצֵאתָ֣/נוּ מִ/שָּׁם֒ מִ/בְּלִי֙ יְכֹ֣לֶת יְהוָ֔ה לַ/הֲבִיאָ֕/ם אֶל הָ/אָ֖רֶץ אֲשֶׁר דִּבֶּ֣ר לָ/הֶ֑ם וּ/מִ/שִּׂנְאָת֣/וֹ אוֹתָ֔/ם הוֹצִיאָ֖/ם לַ/הֲמִתָ֥/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/028.yaml
  text: Otherwise the land from which you brought us out will say[a], ‘Because Yahweh was not able to bring them into the land that he promised them, and because he hated them[b], he brought them out to put them to death in the wilderness.’
translation:
  language: sw
  text: La sivyo, nchi uliyotutoa humo itasema[a], “Kwa sababu Yahwe hakuweza kuwaingiza katika nchi aliyowaahidi[b], na kwa sababu aliwachukia, aliwatoa ili awaue jangwani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania ni “nchi uliyotutoa humo”; hapa “nchi” inawakilisha wakazi wake.
    reason: cultural_note
  - marker: b
    text: 'Kwa maana ya karibu zaidi na Kiebrania: “nchi aliyosema nao kuihusu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: La sivyo
  rationale: Kifungu hiki kinaanzisha matokeo yanayohofiwa; “La sivyo” ni Kiswahili cha kawaida kinachohifadhi nguvu ya onyo.
- source_word: הָאָרֶץ אֲשֶׁר הוֹצֵאתָנוּ מִשָּׁם
  choice: nchi uliyotutoa humo
  rationale: Inahifadhi neno halisi “nchi” na pia matumizi yake ya kiishara kumaanisha wakazi wake; “humo” huonyesha wazi maana ya מִשָּׁם, “kutoka huko.”
- source_word: מִבְּלִי יְכֹלֶת יְהוָה
  choice: Kwa sababu Yahwe hakuweza
  rationale: Muundo huu unaeleza madai ya kutokuwa na uwezo. Tafsiri inaonyesha kwamba hayo ndiyo maneno ambayo wakazi wa nchi wangesema, si uthibitisho wa udhaifu wa Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetafsiriwa moja kwa moja kwa umbo linalotumiwa kwa kawaida katika Kiswahili.
- source_word: לַהֲבִיאָם
  choice: kuwaingiza
  rationale: Kitenzi hiki kinaonyesha kuwapeleka ndani ya nchi iliyotajwa, hivyo “kuwaingiza” ni wazi na asilia katika Kiswahili.
- source_word: אֶל הָאָרֶץ אֲשֶׁר דִּבֶּר לָהֶם
  choice: katika nchi aliyowaahidi
  rationale: Ingawa דִּבֶּר humaanisha kihalisi “alisema,” katika muktadha huu maneno hayo yanahusu ahadi ya kuwapa nchi. Tanbihi inahifadhi maana ya karibu zaidi na muundo wa Kiebrania.
- source_word: וּמִשִּׂנְאָתוֹ אוֹתָם
  choice: na kwa sababu aliwachukia
  rationale: Kihusishi kinaonyesha sababu inayodaiwa, na tafsiri hii ni ya moja kwa moja bila kupunguza ukali wa shtaka hilo.
- source_word: הוֹצִיאָם
  choice: aliwatoa
  rationale: Inadumisha uhusiano wa kimsamiati na tendo la kuwatoa Misri lililotajwa mapema katika mstari.
- source_word: לַהֲמִתָם
  choice: ili awaue
  rationale: Hiphil ya מות ina maana ya kusababisha wafe; “ili awaue” ni wazi, nzito, na ya kawaida katika Kiswahili.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: Ni tafsiri ya kawaida na inayofaa kwa mazingira ya safari ya Israeli nyikani.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la Mungu la herufi nne; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Iwapo דִּבֶּר לָהֶם itafsiriwe kihalisi au kimuktadha
  choice: aliyowaahidi
  alternative: aliyowaambia juu yake
  rationale: Katika muktadha wa agano, maneno ya Mungu kuhusu nchi yana nguvu ya ahadi. Tafsiri kuu huwasilisha maana hiyo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi usemi wa karibu zaidi na Kiebrania.
- issue: Madai kwamba Yahwe hakuweza na aliwachukia
  choice: Yamehifadhiwa kama maneno yanayotarajiwa kutoka kwa wakazi wa nchi
  alternative: Kuyalainisha ili yasikike kama maelezo ya msimulizi
  rationale: Kiebrania kinahifadhi shtaka hilo kali ndani ya usemi unaonukuliwa. Tafsiri hailibadili wala kulithibitisha kama tathmini ya msimulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni ya moja kwa moja na inaeleweka kwa wasomaji wa kawaida, huku taswira ya Kiebrania ya “nchi” kusema na ukali wa maneno yaliyonukuliwa vikihifadhiwa.
