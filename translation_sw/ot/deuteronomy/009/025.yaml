  text: וָֽ/אֶתְנַפַּ֞ל לִ/פְנֵ֣י יְהוָ֗ה אֵ֣ת אַרְבָּעִ֥ים הַ/יּ֛וֹם וְ/אֶת אַרְבָּעִ֥ים הַ/לַּ֖יְלָה אֲשֶׁ֣ר הִתְנַפָּ֑לְתִּי כִּֽי אָמַ֥ר יְהוָ֖ה לְ/הַשְׁמִ֥יד אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/025.yaml
  text: So I fell down before Yahweh for forty days and forty nights[a], because Yahweh had said he would destroy you.
translation:
  language: sw
  text: Basi nikajitupa chini mbele za Yahweh kwa siku arobaini na usiku arobaini[a], kwa sababu Yahweh alikuwa amesema kwamba atawaangamiza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nikalala kifudifudi mbele za Yahweh kwa siku arobaini na usiku arobaini.” Kitenzi cha Kiebrania kinaweza kusisitiza kusujudu katika maombezi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְנַפַּל
  choice: Basi nikajitupa chini
  rationale: Kauli ya kujirejelea ya נפל hapa inaonyesha Musa akijitupa chini kwa unyenyekevu na maombezi. “Basi” linaonyesha mwendelezo wenye matokeo katika simulizi.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: לִפְנֵי humaanisha kuwa mbele au katika uwepo wa mtu; “mbele za” ni usemi wa kawaida na wenye heshima katika Kiswahili. Jina la agano יְהוָה limetoholewa kuwa “Yahweh.”
- source_word: אֵת אַרְבָּעִים הַיּוֹם וְאֶת אַרְבָּעִים הַלַּיְלָה אֲשֶׁר הִתְנַפָּלְתִּי
  choice: kwa siku arobaini mchana na usiku
  rationale: Muundo huu unaonyesha muda wa tendo. Kiswahili cha asili hutumia “kwa siku arobaini mchana na usiku”; kishazi cha Kiebrania kinachorejelea kujitupa chini kinaeleweka ndani ya sentensi bila kurudia kwa namna nzito.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa כִּי linatoa sababu ya Musa kujitupa chini.
- source_word: אָמַר יְהוָה
  choice: Yahweh alikuwa amesema
  rationale: Kauli ya Yahweh ilitangulia kujitupa chini kwa Musa, hivyo wakati uliotangulia unaweka mpangilio wa simulizi wazi.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: kwamba atawaangamiza
  rationale: השמיד katika muktadha huu ni kuharibu au kuangamiza kabisa kama taifa; “kuwaangamiza” ni ya asili na haiongezi maana isiyokuwapo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja. “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Hali ya Musa kujitupa chini
  choice: nikajitupa chini
  alternative: nikalala kifudifudi
  rationale: Kitenzi kinaweza kueleza tendo la kujitupa chini na pia kusisitiza kusujudu katika maombezi. Maandishi makuu yanatumia usemi mpana, huku tanbihi ikihifadhi maana mahsusi inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Usemi “mchana na usiku” unawasilisha kwa asili jozi ya Kiebrania “siku na usiku” katika maelezo ya muda.
