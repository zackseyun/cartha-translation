base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/029.yaml
  text: But they are your people and your inheritance[b][a], whom you brought out by your great power and by your outstretched arm.
translation:
  language: sw
  text: Lakini[a] wao ni watu wako na urithi wako, ambao uliwatoa kwa nguvu zako kuu na kwa mkono wako ulionyoshwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nao ni watu wako na urithi wako.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa tu kuwa “na”; “lakini” huonyesha tofauti inayowezekana katika ombi la Musa.
    reason: lexical_alternative
  - marker: b
    text: “Mkono ulionyoshwa” ni usemi unaotumiwa mara kwa mara katika habari ya Kutoka kumaanisha nguvu za BWANA katika kuwaokoa watu wake.
    reason: cross_reference
lexical_decisions:
- source_word: וְהֵם
  choice: Lakini wao ni
  rationale: Kiunganishi וְ kinaweza kumaanisha “na,” lakini hapa kinaonyesha tofauti katika ombi la Musa baada ya kumwomba Mungu asiwaangamize Israeli. “Lakini” huleta maana hiyo kwa Kiswahili cha kawaida bila kuondoa uwezekano wa maana ya msingi.
- source_word: עַמְּךָ
  choice: watu wako
  rationale: עַם hapa ni jamii ya watu walio katika uhusiano na Mungu; “watu wako” ni tafsiri ya kawaida, wazi, na inayofaa muktadha.
- source_word: וְנַחֲלָתֶךָ
  choice: na urithi wako
  rationale: נַחֲלָה huonyesha urithi au fungu la kumilikiwa. “Urithi wako” huhifadhi lugha ya agano na wazo la Israeli kuwa mali ya pekee ya Mungu.
- source_word: אֲשֶׁר הוֹצֵאתָ
  choice: ambao uliwatoa
  rationale: Kiwakilishi kinawarejelea watu, na Hifili ya יצא ni usemi wa kawaida wa Kutoka unaomaanisha kuwasababisha watoke; “uliwatoa” ni sahihi na ya asili katika Kiswahili.
- source_word: בְּכֹחֲךָ הַגָּדֹל
  choice: kwa nguvu zako kuu
  rationale: בְּ ni ya njia au chombo, כֹּחַ ni nguvu, na הַגָּדֹל ni kuu. Usemi huu ni wa kawaida katika Kiswahili na huhifadhi mkazo wa Kiebrania.
- source_word: וּבִזְרֹעֲךָ הַנְּטוּיָה
  choice: na kwa mkono wako ulionyoshwa
  rationale: זְרוֹעַ ni mkono au sehemu ya mkono, na נְטוּיָה ni ulionyoshwa. “Mkono ulionyoshwa” huhifadhi picha ya kimwili iliyozoeleka katika simulizi la Kutoka na kueleweka kwa wasomaji wa Kiswahili.
theological_decisions:
- issue: Lugha ya kumwelezea Mungu kwa mfano wa mwili
  choice: Kuhifadhi usemi “mkono wako ulionyoshwa.”
  alternative: Kutafsiri kwa ufafanuzi kama “matendo yako makuu yenye nguvu.”
  rationale: Kiebrania kimetumia kwa makusudi picha ya mkono ulionyoshwa kueleza uwezo wa Mungu wa kuokoa. Kuihifadhi huendeleza nguvu ya kifasihi na ya kiteolojia ya usemi wa Kutoka bila kuifanya kuwa wazo la jumla tu.
- issue: Israeli kuitwa נַחֲלָה ya Mungu
  choice: Kutumia “urithi wako.”
  alternative: Kutumia “mali yako” au “fungu lako.”
  rationale: “Urithi” huhifadhi mvutano wa lugha ya agano na umilikaji uliomo katika neno la Kiebrania bila kuongeza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo umebaki karibu na Kiebrania, huku “ambao uliwatoa” ukitumiwa kwa mtiririko wa kawaida. Taswira ya “mkono ulionyoshwa” na neno “urithi” zimehifadhiwa.
