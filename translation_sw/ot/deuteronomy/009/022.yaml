base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/022.yaml
  text: And at Taberah[a], and at Massah, and at Kibroth-hattaavah, you kept provoking Yahweh to anger.
translation:
  language: sw
  text: Na huko Tabera, huko Masa, na huko Kibroth-hataava[a], mliendelea kumkasirisha Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Kibroth-hataava linamaanisha kihalisi “makaburi ya tamaa” au “makaburi ya hamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/תַבְעֵרָה
  choice: Tena huko Tabera
  rationale: Kiunganishi na kihusishi vinaanzisha orodha ya mahali; “huko” ni ya kawaida kwa kurejelea eneo lililotajwa katika simulizi, na jina la mahali limetoholewa.
- source_word: וּ/בְ/מַסָּה
  choice: huko Masa
  rationale: Kihusishi kinaonyesha mahali. Jina limetoholewa badala ya kutafsiriwa.
- source_word: וּ/בְ/קִבְרֹת הַתַּאֲוָה
  choice: huko Kibroth-hataava[a]
  rationale: Hili ni jina maalumu la mahali, kwa hiyo limetoholewa. Maana yake halisi imewekwa katika tanbihi bila kuficha kwamba ni jina la eneo.
- source_word: מַקְצִפִים הֱיִיתֶם
  choice: mliendelea kumkasirisha
  rationale: Muundo wa הָיָה pamoja na kitenzi endelevu unaonyesha tendo lililoendelea au kurudiwa zamani; “mliendelea” huhifadhi dhana hiyo, na “kumkasirisha” huhifadhi nguvu ya kisababishi ya Hiphil.
- source_word: אֶת יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja kama “Yahwe”; alama ya yambwa אֶת haitafsiriwi tofauti katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania inatumia jina maalumu יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Kurudiwa kwa “huko” kunadumisha msisitizo wa orodha ya maeneo bila kufanya sentensi kuwa nzito. Alama ya tanbihi imewekwa baada ya Kibroth-hataava, jina linalofafanuliwa na tanbihi.
