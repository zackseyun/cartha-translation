  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלַ֣/י לֵ/אמֹ֑ר רָאִ֨יתִי֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/הִנֵּ֥ה עַם קְשֵׁה עֹ֖רֶף הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/013.yaml
  text: Then Yahweh said to me[a], saying, ‘I have seen this people, and behold, it is a stiff-necked people.’
translation:
  language: sw
  text: 'Kisha Yahweh akaniambia hivi: “Nimewaona watu hawa, na tazama, ni watu wenye shingo ngumu.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Wenye shingo ngumu” maana yake ni wakaidi, wasiokubali kuongozwa.
    reason: Ufafanuzi wa nahau ya Kiebrania iliyohifadhiwa katika tafsiri.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akaniambia
  rationale: Muundo huu unaendeleza mfululizo wa simulizi; “kisha” ni wa asili katika Kiswahili na kiambishi “-ni-” kinawakilisha אֵלַי, “kwangu.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: לֵאמֹר
  choice: 'hivi:'
  rationale: Katika Kiswahili, “akaniambia hivi” hutambulisha maneno yanayofuata kwa kawaida bila kurudia “akisema,” huku ikihifadhi kazi ya fomula ya Kiebrania.
- source_word: רָאִיתִי
  choice: Nimewaona
  rationale: 'Kauli timilifu ya Kiswahili huonyesha tendo lililotokea lenye matokeo ya sasa: tathmini thabiti ya Yahwe kutokana na aliyoyaona.'
- source_word: הָעָם הַזֶּה
  choice: watu hawa
  rationale: “Watu hawa” ni namna ya kawaida ya Kiswahili ya kutaja kundi hili; upatanisho wa ngeli ya watu unahitaji wingi.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: “Tazama” huhifadhi nguvu ya kishazi cha kuvuta fikira na uzito wa usemi wa Kiebrania.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: watu wenye shingo ngumu
  rationale: Tafsiri hii huhifadhi taswira ya Kiebrania ya shingo isiyokubali kuinama, inayomaanisha ukaidi au uasi.
- source_word: הוּא
  choice: ni
  rationale: Kiswahili hutumia kiunganishi kisichobadilika “ni”; upatanisho wa wingi unaonekana katika “watu wenye,” bila kulazimisha kiwakilishi kisicho cha lazima.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la agano; “Yahwe” hulihifadhi badala ya kuweka cheo mahali pake.
- issue: Taswira ya קְשֵׁה עֹרֶף
  choice: wenye shingo ngumu
  alternative: wakaidi
  rationale: Taswira halisi imehifadhiwa kwa sababu ni sehemu ya nguvu ya shutuma, huku tanbihi ikifafanua maana yake kwa msomaji wa leo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya lugha ya Maandiko. “Akaniambia hivi” ni ya kisasa na ya asili; “na tazama” huhifadhi uzito wa kifungu cha asili. Taswira ya “shingo ngumu” imehifadhiwa na kufafanuliwa kwa tanbihi.
