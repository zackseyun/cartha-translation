source:
  edition: WLC
  text: זְכֹר֙ אַל תִּשְׁכַּ֔ח אֵ֧ת אֲשֶׁר הִקְצַ֛פְתָּ אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ בַּ/מִּדְבָּ֑ר לְ/מִן הַ/יּ֞וֹם אֲשֶׁר יָצָ֣אתָ מֵ/אֶ֣רֶץ מִצְרַ֗יִם עַד בֹּֽאֲ/כֶם֙ עַד הַ/מָּק֣וֹם הַ/זֶּ֔ה מַמְרִ֥ים הֱיִיתֶ֖ם עִם יְהוָֽה־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/007.yaml
  text: Remember—do not forget—how you provoked Yahweh your God to wrath in the wilderness[a]. From the day you came out of the land of Egypt until you came to this place[b], you have been rebellious against Yahweh.
translation:
  language: sw
  text: Kumbuka—usisahau—jinsi ulivyomkasirisha Yahwe Mungu wako jangwani[a]. Tangu siku ulipotoka katika nchi ya Misri mpaka mlipofika mahali hapa, mmekuwa waasi dhidi ya Yahwe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jinsi ulivyomghadhibisha Yahwe Mungu wako jangwani.”
    reason: Mbadala huu unaonyesha kwa nguvu zaidi hasira iliyosababishwa na kitendo cha Israeli.
  - marker: b
    text: 'Kihalisi, “pamoja na Yahwe”; hapa maana yake ni ya kupingana: “dhidi ya Yahwe.”'
    reason: Huhifadhi maana ya kawaida ya kihusishi cha Kiebrania huku ikieleza matumizi yake katika muktadha huu.
lexical_decisions:
- source_word: זְכֹר אַל תִּשְׁכַּח
  choice: Kumbuka—usisahau
  rationale: Huhifadhi amri chanya na katazo linaloitilia mkazo, bila kuziunganisha kuwa wazo moja tu.
- source_word: אֲשֶׁר הִקְצַפְתָּ
  choice: jinsi ulivyomkasirisha
  rationale: 'Muundo huu wa Kiswahili unaeleza jambo la kukumbukwa na kuhifadhi maana ya kisababishi ya kitenzi cha Kiebrania: walimsababisha Mungu akasirike.'
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uhawilishaji wa kawaida wa Kiswahili wa jina binafsi la Mungu katika herufi nne za Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huhifadhi nafsi ya pili umoja katika usemi wa agano.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: Ni neno la kawaida na linalofaa katika simulizi la kutoka Misri; halimaanishi lazima eneo la mchanga pekee.
- source_word: לְמִן הַיּוֹם אֲשֶׁר יָצָאתָ
  choice: Tangu siku ulipotoka
  rationale: Hutaja mwanzo wa kipindi na kuhifadhi nafsi ya pili umoja ya Kiebrania.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Ni Kiswahili cha kawaida kinachohifadhi usemi wa kutoka katika nchi ya Misri.
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: mpaka mlipofika mahali hapa
  rationale: Huhifadhi kwa uwazi badiliko la Kiebrania kutoka nafsi ya pili umoja kwenda wingi, huku ikiwa ya asili katika Kiswahili.
- source_word: מַמְרִים הֱיִיתֶם
  choice: mmekuwa waasi
  rationale: Hueleza mwenendo wa uasi uliodumu katika kipindi kilichotajwa, na huhifadhi nafsi ya pili wingi.
- source_word: עִם יְהוָה
  choice: dhidi ya Yahwe
  rationale: Ingawa עִם kwa kawaida ni ‘pamoja na,’ baada ya kitenzi cha kuasi ina maana ya uhusiano wa uadui; ‘dhidi ya’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ina jina binafsi la Mungu, si cheo; ‘Yahwe’ hulihifadhi kwa tahajia ya kawaida ya Kiswahili.
- issue: Muda na mwendelezo wa uasi wa Israeli
  choice: mmekuwa waasi
  alternative: mlikuwa waasi
  rationale: Kauli inaangalia mwenendo ulioanza wakati wa kutoka Misri na kuendelea mpaka mahali walipokuwa; ‘mmekuwa’ huonyesha kipindi hicho bila kuongeza dai zaidi ya matini.
- issue: Maana ya עִם baada ya ‘kuasi’
  choice: dhidi ya Yahwe
  alternative: pamoja na Yahwe
  rationale: Maana ya msingi ya kihusishi imehifadhiwa katika tanbihi, lakini muktadha wa uasi unahitaji maana ya kupingana katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Badiliko la nafsi kutoka umoja (‘ulipotoka’) kwenda wingi (‘mlipofika,’ ‘mmekuwa’) limehifadhiwa kama lilivyo katika Kiebrania.
