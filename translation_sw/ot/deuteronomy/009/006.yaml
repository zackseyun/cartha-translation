source:
  edition: WLC
  text: וְ/יָדַעְתָּ֗ כִּ֠י לֹ֤א בְ/צִדְקָֽתְ/ךָ֙ יְהוָ֣ה אֱ֠לֹהֶי/ךָ נֹתֵ֨ן לְ/ךָ֜ אֶת הָ/אָ֧רֶץ הַ/טּוֹבָ֛ה הַ/זֹּ֖את לְ/רִשְׁתָּ֑/הּ כִּ֥י עַם קְשֵׁה עֹ֖רֶף אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/006.yaml
  text: So know that it is not because of your righteousness that Yahweh your God is giving you this good land to possess[a], for you are a stiff-necked people.
translation:
  language: sw
  text: 'Basi ujue: si kwa sababu ya haki yako Yahwe, Mungu wako, anakupa nchi hii nzuri ili uimiliki[a], kwa maana wewe ni taifa lenye shingo ngumu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili uirithi.” Kitenzi cha Kiebrania kinaweza kumaanisha kupokea urithi, lakini katika Kumbukumbu la Torati mara nyingi pia humaanisha kuichukua nchi na kuimiliki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Basi ujue
  rationale: Kitenzi cha Qal timilifu nafsi ya pili umoja wa kiume kinatumika kwa maana ya himizo katika muktadha; “Basi” linaendeleza hoja na kuonyesha hitimisho kutoka mistari iliyotangulia.
- source_word: לֹא בְצִדְקָתְךָ
  choice: si kwa sababu ya haki yako
  rationale: Herufi ב hapa inaonyesha msingi au sababu, si chombo; “kwa sababu ya” huweka wazi kuwa haki ya Israeli si msingi wa kupewa nchi.
- source_word: צִדְקָה
  choice: haki
  rationale: Katika muktadha huu wa kimaadili na wa agano, neno linahusu unyoofu au hali ya kuwa sawa; “haki” ni neno la kawaida na lenye uzito wa kibiblia katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linawakilisha moja kwa moja jina la Mungu la Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Ni muundo wenye kiambishi cha nafsi ya pili umoja, ukimdokeza Israeli kama jamii moja.
- source_word: נֹתֵן לְךָ
  choice: anakupa
  rationale: Kivumishi-tendo cha Kiebrania kinaonyesha tendo linaloendelea au lililo karibu kutimia; wakati wa sasa wa Kiswahili unafaa katika muktadha wa Israeli kuwa karibu kuingia nchini.
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: nchi hii nzuri
  rationale: “Nchi” ni ya kawaida katika Kiswahili kwa ardhi ya ahadi, huku “hii nzuri” ikihifadhi kivumishi na kiashiria vya Kiebrania.
- source_word: לְרִשְׁתָּהּ
  choice: ili uimiliki
  rationale: Kitenzi ירשׁ katika Kumbukumbu la Torati mara nyingi kinajumuisha kuichukua na kuishikilia nchi; “uimiliki” ni kifupi na cha asili, huku maana mbadala ya kurithi ikiwekwa katika tanbihi.
- source_word: כִּי
  choice: kwa maana
  rationale: Tukio la pili la כִּי linatoa sababu inayoeleza kauli iliyotangulia; “kwa maana” huhifadhi uhusiano huo.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: taifa lenye shingo ngumu
  rationale: “Taifa” humrejelea Israeli kwa pamoja, na “lenye shingo ngumu” huhifadhi sitiari ya Kiebrania ya ukaidi badala ya kuifafanua tu kuwa “kaidi.”
theological_decisions:
- issue: Sababu ya Israeli kupewa nchi
  choice: Mstari unakana kwamba haki ya Israeli ndiyo msingi wa Yahwe kuwapa nchi.
  alternative: Kuifanya kauli hii kuwa fundisho la jumla tu kuhusu unyenyekevu bila kusisitiza kutostahili kwa Israeli katika agano.
  rationale: Kiebrania kinatofautisha wazi haki ambayo Israeli haina kama msingi wa kustahili na tendo la Mungu la kutoa nchi, kisha kinataja ukaidi wa Israeli.
- issue: Israeli kusemeshwa kama umoja wa kijamii
  choice: Kutumia viambishi vya nafsi ya pili umoja na nomino ya pamoja “taifa.”
  alternative: Kutumia miundo ya wingi kama “ninyi” ili kusisitiza watu mmoja mmoja.
  rationale: Kiebrania kinamsemesha Israeli kwa umoja kama jamii moja; Kiswahili kinaweza kuhifadhi hali hiyo kwa “yako,” “anakupa,” “uimiliki,” na “wewe.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili lakini unahifadhi hoja ya sababu, jina Yahwe, umoja wa kijamii wa Israeli, na sitiari ya “shingo ngumu.”
