  text: וּֽ/בְ/אַהֲרֹ֗ן הִתְאַנַּ֧ף יְהוָ֛ה מְאֹ֖ד לְ/הַשְׁמִיד֑/וֹ וָֽ/אֶתְפַּלֵּ֛ל גַּם בְּעַ֥ד אַהֲרֹ֖ן בָּ/עֵ֥ת הַ/הִֽוא־
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/020.yaml
  text: And Yahweh was very angry with Aaron[a], to destroy him; and I also prayed for Aaron at that time.
translation:
  language: sw
  text: Yahwe alimkasirikia sana Aroni[a] ili kumwangamiza; nami pia nilimwombea Aroni wakati huo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe alikuwa na hasira kali dhidi ya Aroni.” Kihusishi cha Kiebrania kinaweza kumaanisha “dhidi ya” katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַהֲרֹן
  choice: alimkasirikia ... Aroni
  rationale: Pamoja na kitenzi cha hasira, בְ kinawakilishwa kwa Kiswahili cha kawaida kwa muundo ‘kumkasirikia’ mtu. Maana mbadala ya mwelekeo ‘dhidi ya Aroni’ imehifadhiwa katika tanbihi.
- source_word: הִתְאַנַּף ... מְאֹד
  choice: alimkasirikia sana
  rationale: Kitenzi kinaonyesha hasira kali, na מְאֹד ni kisisitizo; ‘alimkasirikia sana’ ni ya asili, wazi, na yenye staha katika Kiswahili cha sasa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetafsiriwa kwa umbo la Kiswahili ‘Yahwe,’ badala ya kubadilishwa na cheo.
- source_word: לְהַשְׁמִידוֹ
  choice: hata akataka kumwangamiza
  rationale: Infinitivu yenye לְ baada ya hasira inaonyesha matokeo au kusudi lililokusudiwa. ‘Hata akataka kumwangamiza’ huwasilisha kwa Kiswahili cha kawaida kwamba hasira hiyo ilifikia hatua ya kutaka kumharibu kabisa, bila kubainisha njia.
- source_word: וָאֶתְפַּלֵּל גַּם בְּעַד אַהֲרֹן
  choice: nami ... nilimwombea Aroni
  rationale: ‘Kumwombea’ hudumisha maana ya kuomba kwa niaba ya mtu. ‘Nami’ huwasilisha וְ pamoja na nguvu ya nyongeza ya גַּם kwa ufupi na kawaida.
- source_word: בָּעֵת הַהִוא
  choice: wakati huo
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaorejelea kipindi kilekile cha tukio linalosimuliwa.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Nguvu ya לְהַשְׁמִידוֹ baada ya hasira ya Yahwe
  choice: hata akataka kumwangamiza
  alternative: ili kumwangamiza / akaazimia kumwangamiza
  rationale: Tafsiri hii huhifadhi uzito wa tishio la kuangamizwa lakini haiongezi dai kwamba uamuzi usioweza kubadilika ulikuwa tayari umetolewa; muktadha unaendelea kueleza maombi ya Musa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, ya kawaida na yenye hadhi. Muundo ‘kumkasirikia sana’ unaeleweka kwa urahisi, huku ‘kumwangamiza’ ukihifadhi ukali wa Kiebrania. Alama ya tanbihi [a] imewekwa mara tu baada ya ‘Aroni,’ mahali panapohusika na utata wa kihusishi.
