  text: So I turned and came down from the mountain[a], and the mountain was burning with fire[b], and the two tablets of the covenant were in my two hands.
translation:
  language: sw
  text: Basi nikageuka, nikashuka kutoka mlimani, na mlima ulikuwa ukiwaka moto,[a] na vibao viwili vya agano vilikuwa katika mikono yangu miwili.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kuonyesha hali iliyoambatana na kushuka, “huku mlima ukiwaka moto.” Kiunganishi cha Kiebrania kinaweza kusomwa kama uratibu wa kawaida au kama kishazi cha hali.
    reason: alternative_reading
  - marker: b
    text: Kwa tafsiri ya neno kwa neno, “juu ya mikono yangu miwili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵפֶן
  choice: Basi nikageuka
  rationale: Kitenzi פנה katika mfuatano wa masimulizi kina maana ya kugeuka. “Basi” kinaendeleza mtiririko wa tukio kwa Kiswahili cha kawaida.
- source_word: וָאֵרֵד מִן הָהָר
  choice: nikashuka kutoka mlimani
  rationale: ירד ni kushuka, na מִן הָהָר inaonyesha mahali alikotoka. “Kutoka mlimani” ni usemi wa asili na wazi katika Kiswahili.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: huku mlima ukiwaka moto
  rationale: Kirai hiki kinaweza kueleza hali iliyokuwa ikiendelea wakati Musa akishuka. “Ukiwaka moto” huhifadhi msisitizo wa בֹּעֵר בָּאֵשׁ bila kuwa mzito katika Kiswahili; tanbihi inahifadhi uwezekano wa kuisoma וְ kama kiunganishi rahisi cha “na”.
- source_word: וּשְׁנֵי לֻחֹת הַבְּרִית
  choice: na vile vibao viwili vya agano
  rationale: לֻחֹת ni vibao vya kuandikia, ambavyo katika muktadha huu ni vya mawe. “Vibao viwili vya agano” ni wazi, cha sasa, na huhifadhi idadi pamoja na uhusiano wake na agano.
- source_word: עַל שְׁתֵּי יָדָי
  choice: vilikuwa katika mikono yangu miwili
  rationale: Ingawa עַל kwa msingi ni “juu ya,” hapa inaeleza Musa akiwa amevibeba kwa mikono yake. “Katika mikono yangu miwili” hutoa maana hiyo kwa Kiswahili kinachoeleweka huku ikihifadhi “miwili” ya Kiebrania.
