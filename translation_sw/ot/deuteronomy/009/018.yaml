language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וָֽ/אֶתְנַפַּל֩ לִ/פְנֵ֨י יְהוָ֜ה כָּ/רִאשֹׁנָ֗ה אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֣א שָׁתִ֑יתִי עַ֤ל כָּל חַטַּאתְ/כֶם֙ אֲשֶׁ֣ר חֲטָאתֶ֔ם לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/018.yaml
  text: Then I fell down before Yahweh[a], as at the first, forty days and forty nights; I ate no bread and drank no water, because of all your sin that you had committed by doing what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: sw
  text: Kisha nikajitupa chini mbele ya Yahwe kama hapo kwanza[a], siku arobaini na usiku arobaini. Sikula mkate wala kunywa maji, kwa sababu ya dhambi yenu yote mliyotenda kwa kufanya yaliyo mabaya machoni pa Yahwe na hivyo kumkasirisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kama hapo awali.” Msemo wa Kiebrania unarejelea kipindi cha kwanza cha siku arobaini ambacho Musa alikuwa mbele ya Yahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְנַפַּל
  choice: Kisha nikajitupa chini
  rationale: Kauli ya kujirejelea inaonyesha Musa akijiangusha au kujilaza chini mbele za Mungu katika maombezi; “nikajitupa chini” ni ya asili na inadumisha mkao wa kimwili.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: לִפְנֵי huonyesha kuwa mbele ya au katika uwepo wa mtu; “mbele za Yahwe” ni msemo wa kawaida wa Kiswahili na huhifadhi jina la agano.
- source_word: כָּרִאשֹׁנָה
  choice: kama hapo kwanza
  rationale: Msemo huu unarejelea kipindi cha awali cha siku arobaini; tafsiri hii inadumisha ulinganisho na rejeo la nyuma.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: kwa siku arobaini mchana na usiku
  rationale: Huwasilisha muda wa siku arobaini na usiku arobaini kwa Kiswahili cha kawaida bila kupoteza maana.
- source_word: לֶחֶם לֹא אָכַלְתִּי
  choice: Sikula mkate
  rationale: Kiebrania kinataja mkate moja kwa moja, hivyo neno hilo linahifadhiwa badala ya kulipanua kuwa chakula kwa ujumla.
- source_word: וּמַיִם לֹא שָׁתִיתִי
  choice: wala kunywa maji
  rationale: Tafsiri ya moja kwa moja inayounganishwa kiasili na kishazi kilichotangulia kwa “wala.”
- source_word: עַל כָּל חַטַּאתְכֶם
  choice: kwa sababu ya dhambi yenu yote
  rationale: עַל hapa hutoa sababu ya kujitupa chini na kufunga kwa Musa; umoja wa mkusanyo wa חַטָּאת umehifadhiwa kwa “dhambi yenu yote.”
- source_word: אֲשֶׁר חֲטָאתֶם
  choice: mliyotenda
  rationale: Katika muktadha wa “dhambi,” “mliyotenda” ni Kiswahili fasaha na huonyesha tendo lililokuwa limetokea tayari.
- source_word: לַעֲשׂוֹת הָרַע
  choice: kwa kufanya yaliyo mabaya
  rationale: Huonyesha namna au maudhui ya dhambi yao kwa lugha ya sasa na iliyo wazi.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Huhifadhi sitiari ya Kiebrania kuhusu tathmini ya Mungu, nayo inaeleweka vizuri katika Kiswahili.
- source_word: לְהַכְעִיסוֹ
  choice: na hivyo kumkasirisha
  rationale: Huwakilisha maana ya kisababishi ya kumchochea Mungu akasirike, huku “na hivyo” ikiacha nafasi kwa kivuli cha matokeo bila kulazimisha kusudi pekee.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana Tetragramatoni moja kwa moja; “Yahwe” huhifadhi jina la agano bila kulibadilisha kuwa cheo.
- issue: Uhusiano wa לְהַכְעִיסוֹ na tendo lililotangulia
  choice: na hivyo kumkasirisha
  alternative: ili kumkasirisha
  rationale: Infinitivu inaweza kuwa na kivuli cha kusudi au matokeo. “Na hivyo” huepuka kudai kwamba kusudi lao la moja kwa moja lilikuwa kumkasirisha Mungu, huku ikidumisha matokeo ya kitendo chao.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa usawa bora: unadumisha picha za Kiebrania kama “mkate” na “machoni,” lakini hutumia miunganisho ya kawaida ya Kiswahili. Alama ya tanbihi [a] ipo katika matini kuu.'
