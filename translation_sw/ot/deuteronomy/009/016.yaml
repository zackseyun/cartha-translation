  text: וָ/אֵ֗רֶא וְ/הִנֵּ֤ה חֲטָאתֶם֙ לַ/יהוָ֣ה אֱלֹֽהֵי/כֶ֔ם עֲשִׂיתֶ֣ם לָ/כֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה סַרְתֶּ֣ם מַהֵ֔ר מִן הַ/דֶּ֕רֶךְ אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/016.yaml
  text: 'And I looked[a], and behold, you had sinned against Yahweh your God: you had made for yourselves a cast-metal calf. You had turned aside quickly from the way that Yahweh had commanded you.'
translation:
  language: sw
  text: 'Nikaona, na tazama, mmetenda dhambi dhidi ya Yahweh, Mungu wenu: mmejitengenezea ndama wa metali iliyosubuliwa[a]. Mmegeuka haraka kutoka katika njia ambayo Yahweh aliwaamuru mfuate.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndama wa kusubu.” Neno la Kiebrania linamaanisha ndama aliyetengenezwa kwa metali iliyoyeyushwa na kumiminwa katika kalibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Nikaona
  rationale: Kitenzi ראה kwa kawaida humaanisha ‘kuona.’ ‘Nikaona’ ni simulizi la kawaida na la moja kwa moja katika Kiswahili, huku kikihifadhi tendo la Musa la kutambua yaliyokuwa yametokea.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: הִנֵּה huvuta fikira za msomaji kwenye jambo linalofuata. ‘Na tazama’ huhifadhi msisitizo huo na sauti yenye hadhi ya simulizi.
- source_word: חֲטָאתֶם לַיהוָה אֱלֹהֵיכֶם
  choice: mlikuwa mmetenda dhambi dhidi ya Yahweh, Mungu wenu
  rationale: Muundo ‘mlikuwa mmetenda’ unaonyesha kwamba Musa alikuwa akisimulia tendo lililokuwa limekwisha kutokea. ‘Dhidi ya’ huwasilisha kwa uwazi maana ya ל katika muktadha huu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina la agano lililo katika matini ya Kiebrania.
- source_word: עֲשִׂיתֶם לָכֶם
  choice: mlikuwa mmejitengenezea
  rationale: Kiambishi ‘-ji-’ pamoja na ‘-tengenezea’ huonyesha kwamba walikitengeneza kwa ajili yao wenyewe, kama inavyodokezwa na עשה + ל.
- source_word: עֵגֶל מַסֵּכָה
  choice: ndama wa chuma kilichomiminwa
  rationale: מַסֵּכָה hueleza kitu cha chuma kilichotengenezwa kwa kuyeyusha na kumimina chuma katika kalibu. Usemi huu ni wazi kwa wasomaji wa sasa na huhifadhi wazo la nyenzo na namna ya utengenezaji.
- source_word: סַרְתֶּם מַהֵר מִן הַדֶּרֶךְ
  choice: mlikuwa mmegeuka haraka kutoka katika njia
  rationale: ‘Mmegeuka ... kutoka katika njia’ huhifadhi sitiari ya kuiacha njia iliyoamriwa, na ‘haraka’ huwasilisha מַהֵר kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶתְכֶם
  choice: ambayo Yahweh alikuwa amewaamuru
  rationale: Kishazi hiki kinaeleza ‘njia.’ Muundo wa wakati uliopita ‘alikuwa amewaamuru’ unafaa katika masimulizi ya Musa kuhusu amri iliyotolewa kabla ya kosa hilo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Matini ina jina binafsi la Mungu יהוה. ‘Yahweh’ huhifadhi jina hilo bila kulibadilisha kuwa cheo, huku ikifuata matamshi yanayokubalika sana kitaaluma.
- issue: Maana ya ‘njia’ katika muktadha wa agano
  choice: kuhifadhi sitiari ya ‘njia’
  alternative: kufafanua kuwa ‘mwenendo’ au ‘amri’
  rationale: דרך ni ‘njia’ lakini hapa ina maana pana ya mwenendo ambao Mungu aliwaamuru. Kuhifadhi ‘njia’ kunatunza sitiari ya Kiebrania na uhusiano wake na matumizi mengine katika Kumbukumbu la Torati bila kuifafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki chenye sauti ya simulizi iliyo rasmi na yenye hadhi, lakini inayoeleweka kwa msomaji wa kawaida. ‘Na tazama’ imetumiwa kwa makusudi kuhifadhi kishindo cha הִנֵּה; ‘kusubu’ limewekwa katika tanbihi kwa sababu ni sahihi lakini si neno linalofahamika kwa wasomaji wote.
