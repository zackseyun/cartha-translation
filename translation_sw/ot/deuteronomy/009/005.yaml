source:
  edition: WLC
  text: לֹ֣א בְ/צִדְקָתְ/ךָ֗ וּ/בְ/יֹ֨שֶׁר֙ לְבָ֣בְ/ךָ֔ אַתָּ֥ה בָ֖א לָ/רֶ֣שֶׁת אֶת אַרְצָ֑/ם כִּ֞י בְּ/רִשְׁעַ֣ת הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מוֹרִישָׁ֣/ם מִ/פָּנֶ֔י/ךָ וּ/לְמַ֜עַן הָקִ֣ים אֶת הַ/דָּבָ֗ר אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לַ/אֲבֹתֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/005.yaml
  text: It is not because of your righteousness or the uprightness of your heart that you are going in to possess their land[a], but because of the wickedness of these nations Yahweh your God is driving them out before you, and in order to confirm the word that Yahweh swore to your fathers, to Abraham, to Isaac[c][b], and to Jacob.
translation:
  language: sw
  text: Si kwa sababu ya haki yako wala kwa sababu ya unyoofu wa moyo wako ndipo unaingia kuimiliki nchi yao, bali kwa sababu ya uovu wa mataifa haya Yahweh Mungu wako anawanyang’anya milki yao mbele yako[a], na ili kulithibitisha neno[b] ambalo Yahweh aliwaapia baba zako[c]—Abrahamu, Isaka na Yakobo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anawafukuza mbele yako.” Kitenzi cha Kiebrania kinaweza kusisitiza kuwafanya waipoteze milki ya nchi, si kuwatoa humo tu.
    reason: lexical_alternative
  - marker: b
    text: Au, “ahadi.” Neno la Kiebrania linalotafsiriwa “neno” hapa linaweza kumaanisha ahadi iliyotolewa kwa kiapo.
    reason: lexical_alternative
  - marker: c
    text: '“Baba zako” hapa ni wale mababu waliotajwa wazi: Abrahamu, Isaka na Yakobo.'
    reason: cultural_note
lexical_decisions:
- source_word: בְצִדְקָתְךָ
  choice: kwa sababu ya haki yako
  rationale: Kiambishi בְּ kina maana ya sababu katika kishazi hiki kilichokanushwa; haki ya Israeli si msingi wa kuimiliki nchi.
- source_word: וּבְיֹשֶׁר לְבָבְךָ
  choice: wala unyoofu wa moyo wako
  rationale: יֹשֶׁר ni unyoofu au uadilifu, na לֵבָב hapa inaeleza hali ya ndani ya kimaadili. Muundo huu unahifadhi tamathali ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: בָא לָרֶשֶׁת אֶת אַרְצָם
  choice: unaingia kuimiliki nchi yao
  rationale: בוא pamoja na kitenzi-jina huonyesha kuingia na kusudi lake; לרשׁת ni kuchukua na kuwa na milki ya nchi.
- source_word: בְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה
  choice: kwa sababu ya uovu wa mataifa haya
  rationale: רִשְׁעָה humaanisha uovu au hatia; בְּ hapa ni ya sababu na inalingana na kishazi cha kwanza.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetafsiriwa kwa namna ya kulitamka kama jina binafsi, si kwa cheo.
- source_word: מוֹרִישָׁם מִפָּנֶיךָ
  choice: anawanyang’anya milki yao mbele yako
  rationale: Hifili ya ירשׁ inaweza kumaanisha kuwafanya waipoteze milki au kuwafukuza. Chaguo hili linatanguliza wazo la kupokonywa umiliki huku dokezo likihifadhi mbadala wa kufukuzwa.
- source_word: וּלְמַעַן הָקִים
  choice: na ili kulithibitisha
  rationale: לְמַעַן huonyesha kusudi; הקים kwa neno la kiapo ni kulithibitisha au kulitekeleza.
- source_word: הַדָּבָר אֲשֶׁר נִשְׁבַּע
  choice: neno ambalo ... aliwaapia
  rationale: דָּבָר ni 'neno' lakini katika muktadha wa kiapo lina maana ya neno lililoahidiwa; tafsiri ya msingi inahifadhi neno la Kiebrania na tanbihi inaeleza maana hiyo.
- source_word: לַאֲבֹתֶיךָ
  choice: baba zako
  rationale: Nomino ya Kiebrania ni ya kiume na hapa inafafanuliwa moja kwa moja kuwa Abrahamu, Isaka na Yakobo.
theological_decisions:
- issue: Sababu ya Israeli kuimiliki nchi
  choice: Si haki ya Israeli, bali uovu wa mataifa hayo na kusudi la Yahweh kuthibitisha neno lake la kiapo kwa mababu.
  alternative: Kutilia mkazo uovu wa mataifa pekee, au ahadi ya agano pekee.
  rationale: Kiebrania kinataja wazi sababu zote mbili kwa כִּי na וּלְמַעַן; zote zimehifadhiwa bila moja kufuta nyingine.
- issue: Jinsi ya kutafsiri יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano יְהוָה; 'Yahweh' hulihifadhi kama jina binafsi.
- issue: Maana ya מוֹרִישָׁם
  choice: anawanyang’anya milki yao
  alternative: anawafukuza
  rationale: Kitenzi kinaweza kusisitiza kupotezwa kwa milki au kufukuzwa. Maandishi yanatumia maana ya kisheria ya milki, na tanbihi inahifadhi maana nyingine halali.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inahifadhi ulinganifu wa hoja za Kiebrania na sababu zake mbili. 'Kuimiliki nchi' na 'kunyang’anya milki' hutofautisha tendo la Israeli la kupata milki na tendo la Yahweh la kuwaondolea mataifa milki.
