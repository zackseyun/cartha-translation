base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/026.yaml
  text: So I prayed to Yahweh and said[a], “Lord GOD, do not destroy your people and your inheritance, whom you redeemed by your greatness[b], whom you brought out of Egypt with a strong hand.”
translation:
  language: sw
  text: Kisha nikamwomba Yahwe, nikasema, “Ee Bwana Yahwe, usiwaangamize watu wako na urithi wako, uliowakomboa kwa ukuu wako na uliowatoa Misri kwa mkono wenye nguvu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל
  choice: Kisha nikamwomba
  rationale: Neno la kuunganisha simulizi linaendeleza mfuatano wa matukio; “kisha” ni la kawaida katika Kiswahili, na “kumwomba” linaonyesha sala iliyoelekezwa kwa Yahwe.
- source_word: אֶל יְהוָה
  choice: Yahwe
  rationale: Jina la agano יְהוָה limetoholewa kuwa “Yahwe”; kiambishi cha yambwa katika “nikamwomba” kinawakilisha uelekeo wa אֶל kwa Kiswahili cha kawaida.
- source_word: אֲדֹנָי יְהוִה
  choice: Ee Bwana Yahwe
  rationale: “Bwana” linatafsiri אֲדֹנָי na “Yahwe” linahifadhi jina la Mungu; “Ee” linaonyesha kwamba maneno haya ni mwito wa moja kwa moja katika sala.
- source_word: אַל תַּשְׁחֵת
  choice: usiwaangamize
  rationale: Hili linahifadhi uzito wa katazo na maana ya kuharibu au kuondoa kabisa katika muktadha huu.
- source_word: עַמְּךָ וְנַחֲלָתְךָ
  choice: watu wako na urithi wako
  rationale: Tafsiri hii inadumisha vipengele vyote viwili na taswira ya agano kwamba watu ni urithi wa Yahwe.
- source_word: אֲשֶׁר פָּדִיתָ
  choice: uliowakomboa
  rationale: “Kukomboa” linafaa kwa tendo la Mungu la kuwaokoa watu wake kutoka utumwani bila kulazimisha taswira ya malipo ya kibiashara.
- source_word: בְּגָדְלֶךָ
  choice: kwa ukuu wako
  rationale: Hii ni tafsiri ya karibu ya nomino גֹּדֶל, “ukuu,” bila kuibadili kimafafanuzi kuwa “nguvu kuu.”
- source_word: אֲשֶׁר הוֹצֵאתָ מִמִּצְרַיִם
  choice: uliowatoa Misri
  rationale: Hii inahifadhi usemi wa kawaida wa simulizi la Kutoka na ni Kiswahili cha asili.
- source_word: בְּיָד חֲזָקָה
  choice: kwa mkono wenye nguvu
  rationale: Tafsiri hii inahifadhi taswira halisi ya Kiebrania ya mkono wenye nguvu, ishara ya uwezo wa Mungu wa kuokoa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Kutoholewa kwa “Yahwe” kunahifadhi jina maalumu la agano lililo katika matini badala ya kulibadilisha kuwa cheo.
- issue: Jinsi ya kutafsiri cheo kilichounganishwa אֲדֹנָי יְהוִה
  choice: Ee Bwana Yahwe
  alternative: Ee Bwana MUNGU
  rationale: Chaguo hili linahifadhi kwa uwazi cheo אֲדֹנָי na jina יְהוָה, bila marudio yasiyo ya kawaida wala kuficha jina la agano.
- issue: Maana ya נַחֲלָה kwa Israeli
  choice: urithi wako
  alternative: mali yako
  rationale: “Urithi” huhifadhi lugha ya agano na wazo la watu kuwa fungu la Yahwe, bila kuwapunguza kuwa mali tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya sala lakini kinachoeleweka kwa urahisi. Muundo wa sentensi umehifadhi urudiaji wa vishazi vya Kiebrania huku viambishi vya ngeli vikielekezwa kwa watu wanaotajwa.
