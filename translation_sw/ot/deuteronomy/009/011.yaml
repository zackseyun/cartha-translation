  naturalness: «Ikawa, mwishoni mwa siku arobaini na usiku arobaini» ni Kiswahili sanifu kinachoeleweka. «Vile vibao viwili» si chaguo la kawaida zaidi katika muktadha huu; «vibao viwili vya mawe» husikika asilia na hubeba uainifu wa muktadha bila msisitizo wa ziada.
  terminology: «Yahweh», «vibao vya mawe», na «vibao vya agano» ni istilahi zilizo sahihi na zenye heshima. Kurudiwa kwa «vibao» kunafuata kwa vizuri urudiaji wa Kiebrania.
