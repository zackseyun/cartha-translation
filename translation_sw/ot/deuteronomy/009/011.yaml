base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/011.yaml
  text: And at the end of forty days and forty nights[a], Yahweh gave me the two stone tablets, the tablets of the covenant.
translation:
  language: sw
  text: Ikawa, mwishoni mwa siku arobaini na usiku arobaini, Yahweh alinipa vibao viwili vya mawe, vibao vya agano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hutumika kama mpito wa kisimulizi; “Ikawa” ni kifupi, cha heshima, na huhifadhi muundo wa Kiebrania bila kuwa kizito mno.
- source_word: מִקֵּץ
  choice: mwishoni mwa
  rationale: Huonyesha kufikiwa kwa mwisho wa kipindi, kwa hiyo ni sahihi zaidi kuliko usemi mpana “baada ya.”
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: siku arobaini na usiku arobaini
  rationale: Huhifadhi moja kwa moja usemi wa Kiebrania na urudiaji wake wa kimakusudi.
- source_word: נָתַן
  choice: alinipa
  rationale: Kitenzi cha kawaida “kupa” kinafikisha maana ya msingi bila kuongeza wazo la kukabidhi rasmi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa moja kwa moja katika chanzo; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- source_word: שְׁנֵי לֻחֹת הָאֲבָנִים
  choice: vile vibao viwili vya mawe
  rationale: “Vile” huonyesha jozi maalumu inayojulikana katika muktadha; “vibao vya mawe” ni Kiswahili cha kawaida kwa vibao vilivyotengenezwa kwa mawe.
- source_word: לֻחוֹת הַבְּרִית
  choice: vibao vya agano
  rationale: Nomino “vibao” imerudiwa kama katika Kiebrania, hivyo kudumisha ufafanuzi wa pili unaosisitiza uhusiano wake na agano.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Chanzo kinatumia Tetragramatoni kama jina binafsi. “Yahweh” huhifadhi jina hilo bila kulibadili kuwa cheo, wala kuingiza mapokeo ya dhehebu fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ikawa” hudumisha mpito wa kisimulizi wa Kiebrania; “vile vibao viwili” huonyesha kuwa ni vile vibao maalumu vinavyojulikana katika muktadha.
