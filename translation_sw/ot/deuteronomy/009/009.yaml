base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/009.yaml
  text: When I went up the mountain to receive the stone tablets[a], the tablets of the covenant that Yahweh made with you, I remained on the mountain forty days and forty nights[c][b]; I ate no bread and drank no water.
translation:
  language: sw
  text: Nilipopanda mlimani ili kuvipokea vibao vya mawe[a], yaani, vibao vya agano ambalo Yahwe alifanya nanyi, nikakaa mlimani siku arobaini na usiku arobaini.[b] Sikula mkate wala sikunywa maji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kuchukua.” Hapa “kuvipokea” huonyesha kwamba Musa alipanda ili apewe vibao hivyo.'
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “agano ambalo Yahwe alikata nanyi”; “kukata agano” ni nahau ya Kiebrania yenye maana ya kufanya agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֹתִי הָהָרָה
  choice: Nilipopanda mlimani
  rationale: Muundo wa ב pamoja na kitenzi-jina na kiambishi cha nafsi una maana ya wakati, ‘nilipopanda’; הָהָרָה huonyesha mwendo kuelekea mlima huo.
- source_word: לָקַחַת
  choice: kuvipokea
  rationale: Ingawa maana ya msingi ni ‘kuchukua,’ katika muktadha huu Musa anapanda ili apewe vibao; ‘kuvipokea’ huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kuficha tafsiri halisi, ambayo imewekwa katika tanbihi.
- source_word: לוּחֹת הָאֲבָנִים
  choice: vibao vya mawe
  rationale: Hutunza umbo na nyenzo ya vitu vinavyotajwa, na ni usemi wa kawaida na unaoeleweka katika Kiswahili.
- source_word: לוּחֹת הַבְּרִית
  choice: vibao vya agano
  rationale: Marudio ya maelezo hayo yamehifadhiwa ili kuonyesha kwamba vibao vya mawe ndivyo vibao vinavyohusiana na agano.
- source_word: כָּרַת יְהוָה עִמָּכֶם
  choice: Yahwe alifanya nanyi
  rationale: כרת ni sehemu ya nahau ya Kiebrania ya ‘kufanya agano’; Kiswahili cha kawaida husema ‘kufanya agano,’ huku picha halisi ya ‘kukata’ ikielezwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetolewa kwa umbo la Kiswahili ‘Yahwe’ badala ya kubadilishwa na cheo kama ‘BWANA.’
- source_word: וָאֵשֵׁב
  choice: nilikaa
  rationale: Katika muktadha huu ישב inaonyesha kukaa au kubaki mahali kwa muda; ‘nilikaa’ ni ya asili na haiingizi wazo lisilo lazima la kuketi tu.
- source_word: לֶחֶם לֹא אָכַלְתִּי וּמַיִם לֹא שָׁתִיתִי
  choice: Sikula mkate wala sikunywa maji
  rationale: ‘Mkate’ huhifadhi neno halisi לֶחֶם, na muundo sambamba wa kula na kunywa umehifadhiwa kwa Kiswahili fasaha.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. ‘Yahwe’ hulihifadhi kwa umbo linalofaa tahajia na matamshi ya Kiswahili.
- issue: Uhusiano wa agano na vibao katika kifungu אֲשֶׁר כָּרַת יְהוָה עִמָּכֶם
  choice: agano ambalo Yahwe alifanya nanyi
  alternative: vibao ambavyo Yahwe alifanya nanyi
  rationale: Kisemantiki, kitu kinachofanywa ‘na’ watu katika nahau hii ni agano; tafsiri hii huonyesha maana ya nahau bila kudai kwamba Yahwe alifanya vibao pamoja na watu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Marudio ya ‘vibao’ na ya ‘siku arobaini na usiku arobaini’ yamehifadhiwa kwa sababu ni sehemu ya msisitizo na muundo wa Kiebrania.
