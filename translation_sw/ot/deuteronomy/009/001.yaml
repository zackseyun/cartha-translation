source:
  edition: WLC
  text: שְׁמַ֣ע יִשְׂרָאֵ֗ל אַתָּ֨ה עֹבֵ֤ר הַ/יּוֹם֙ אֶת הַ/יַּרְדֵּ֔ן לָ/בֹא֙ לָ/רֶ֣שֶׁת גּוֹיִ֔ם גְּדֹלִ֥ים וַ/עֲצֻמִ֖ים מִמֶּ֑/ךָּ עָרִ֛ים גְּדֹלֹ֥ת וּ/בְצֻרֹ֖ת בַּ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/001.yaml
  text: 'Hear[a], Israel: today you are crossing the Jordan to go in to dispossess nations greater and mightier than you[b], with cities great and fortified up to the heavens.'
translation:
  language: sw
  text: 'Sikiliza, Israeli: leo unavuka Yordani ili kuingia na kuyamiliki[a] mataifa makubwa na yenye nguvu kuliko wewe, yenye miji mikubwa, yenye maboma yanayofika mbinguni[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuyatwaa.” Kitenzi cha Kiebrania kinaweza kumaanisha kumiliki au kutwaa; katika muktadha huu wa ushindi huweza pia kudokeza kuwanyang’anya wakazi waliotangulia milki yao.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mbinguni”; huu ni usemi wa kutia chumvi unaoonyesha kwamba maboma ya miji hiyo yalikuwa marefu sana.'
    reason: cultural_note
lexical_decisions:
- source_word: שְׁמַע
  choice: Sikiliza
  rationale: Ni amri katika umoja inayolielekea taifa la Israeli kama kundi moja. “Sikiliza” ni mwito wa kawaida na wa moja kwa moja katika Kiswahili cha sasa.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina maalumu limetolewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: עֹבֵר הַיּוֹם
  choice: leo unavuka
  rationale: Huhifadhi msisitizo wa wakati na maana ya tendo lililo karibu kutokea au linaloendelea.
- source_word: אֶת־הַיַּרְדֵּן
  choice: Yordani
  rationale: Hili ndilo umbo la kawaida la jina la kijiografia katika Kiswahili; neno “Mto” halipo wazi katika Kiebrania.
- source_word: לָבֹא
  choice: ili kuingia
  rationale: Inaonyesha kusudi la kuvuka Yordani, yaani kuingia katika nchi.
- source_word: לָרֶשֶׁת
  choice: kuyafukuza
  rationale: Katika muktadha wa ushindi, kitenzi ירשׁ kinaweza kumaanisha kuwanyang’anya wakazi waliotangulia milki yao. “Kuyafukuza” kinaendana na mataifa kama yambwa, huku mbadala wa “kuyamiliki” ukihifadhiwa katika tanbihi.
- source_word: גּוֹיִם
  choice: mataifa
  rationale: Huwasilisha makundi tofauti ya kitaifa yanayotajwa katika Kumbukumbu la Torati.
- source_word: גְּדֹלִים וַעֲצֻמִים מִמֶּךָּ
  choice: yaliyo makubwa na yenye nguvu kuliko wewe
  rationale: Huhifadhi sifa zote mbili pamoja na ulinganisho wa moja kwa moja na Israeli.
- source_word: עָרִים גְּדֹלֹת וּבְצֻרֹת
  choice: miji mikubwa na ngome
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kuwa mataifa hayo yana miji mikubwa iliyolindwa kwa ngome.
- source_word: בַּשָּׁמָיִם
  choice: zinazofika mbinguni
  rationale: Huhifadhi taswira ya Kiebrania ya urefu mkubwa kupita kiasi bila kuibadili kuwa maelezo tambarare.
theological_decisions:
- issue: Maana ya ירשׁ katika muktadha wa ushindi
  choice: kuyafukuza
  alternative: kuyamiliki
  rationale: Yambwa ni mataifa, na muktadha unahusu kuondolewa kwa wakazi waliotangulia. Tanbihi inahifadhi maana pana ya kumiliki au kutwaa bila kulazimisha tafsiri moja pekee.
- issue: Maelezo ya kutia chumvi kuhusu ngome za miji
  choice: ngome zinazofika mbinguni
  alternative: ngome zilizo juu sana
  rationale: Tafsiri inahifadhi taswira na nguvu ya usemi wa Kiebrania, huku tanbihi ikieleza kuwa huu ni usemi wa kutia chumvi kuhusu urefu na uimara.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Umoja wa kisarufi katika “unavuka” umehifadhiwa kwa sababu Israeli inaelekezewa kama taifa moja.
