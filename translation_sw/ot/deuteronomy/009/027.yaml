  text: זְכֹר֙ לַ/עֲבָדֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב אַל תֵּ֗פֶן אֶל קְשִׁי֙ הָ/עָ֣ם הַ/זֶּ֔ה וְ/אֶל רִשְׁע֖/וֹ וְ/אֶל חַטָּאתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/027.yaml
  text: Remember your servants[a], Abraham, Isaac, and Jacob. Do not turn your attention to the stubbornness of this people, or to their wickedness[b], or to their sin.
translation:
  language: sw
  text: Wakumbuke watumishi wako, Abrahamu, Isaka na Yakobo. Usizingatie[a] ukaidi[b] wa watu hawa, wala uovu wao, wala dhambi yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Usiangalie,” “Usiweke maanani,” au kwa maana halisi zaidi, “Usigeukie.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “ugumu” au “ukaidi”; hapa halitumiki neno lile jingine la Kiebrania linalotafsiriwa mahali pengine kuwa “shingo ngumu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Wakumbuke
  rationale: Ni amri katika maombezi ya Musa kwa Mungu. Kitenzi hiki kwa kawaida na kwa heshima huonyesha kuwakumbuka watu wanaotajwa, hasa katika muktadha wa agano.
- source_word: לַעֲבָדֶיךָ
  choice: watumishi wako
  rationale: עבד inaweza kumaanisha mtumishi au mtumwa. Hapa ni jina la heshima kwa mababu katika uhusiano wao na Mungu; hali ya utumwa haisisitizwi.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Abrahamu, Isaka na Yakobo
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
- source_word: אַל תֵּפֶן אֶל
  choice: Usizingatie
  rationale: Kifungu hiki kihalisi kina wazo la kugeukia kitu, na katika sala hii kinamaanisha kukipa uzito au kukitazama kwa makini. “Usizingatie” ni Kiswahili cha kawaida kinachowasilisha maana hiyo.
- source_word: קְשִׁי
  choice: ukaidi
  rationale: Nomino hii ina maana ya ugumu au ukaidi. “Ukaidi” huwasilisha wazi hali ya watu kukataa kutii bila kuingiza nahau tofauti ya Kiebrania ya kuwa na shingo ngumu.
- source_word: הָעָם הַזֶּה
  choice: watu hawa
  rationale: עם hapa ni jumuiya ya watu; “watu hawa” ni usemi wa asili wa Kiswahili unaohifadhi nguvu ya kiashiria.
- source_word: רִשְׁעוֹ
  choice: uovu wao
  rationale: Kiambishi cha Kiebrania ni cha umoja kwa sababu kinarejelea watu kama kundi moja. Kiswahili hutumia kwa kawaida “wao” kurejelea watu wengi, huku “uovu” ikihifadhi maana ya ubaya wa kimaadili.
- source_word: חַטָּאתוֹ
  choice: dhambi yao
  rationale: “Dhambi” huhifadhi nomino ya umoja ya Kiebrania, na “yao” huirejelea kwa Kiswahili cha kawaida jumuiya iliyotajwa kama watu wengi.
theological_decisions:
- issue: Maana ya עבד inapowataja mababu
  choice: watumishi wako
  alternative: watumwa wako
  rationale: Katika sala hii neno hilo ni jina la heshima linaloonyesha uhusiano wa Abrahamu, Isaka na Yakobo na Mungu, wala halikusudii kusisitiza hali yao kama watu waliomilikiwa au waliofungwa katika utumwa.
- issue: Viambishi vya umoja vinavyorejelea kundi la watu
  choice: uovu wao ... dhambi yao
  alternative: uovu wake ... dhambi yake
  rationale: Kiebrania kinaweza kutumia umoja kuafikiana na nomino ya mkusanyiko “watu.” Kiswahili cha kawaida huwarejelea watu hao kwa “wao/yao”; hata hivyo, “dhambi” imeachwa katika umoja ili kuhifadhi muundo na uwezekano wa maana ya kosa lao la pamoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sala umehifadhiwa kwa sentensi fupi na wazi; “wala ... wala” hudumisha mfululizo wa mambo matatu ambayo Musa anamwomba Mungu asiyazingatie.
