source:
  edition: WLC
  text: כִּ֣י יָגֹ֗רְתִּי מִ/פְּנֵ֤י הָ/אַף֙ וְ/הַ֣/חֵמָ֔ה אֲשֶׁ֨ר קָצַ֧ף יְהוָ֛ה עֲלֵי/כֶ֖ם לְ/הַשְׁמִ֣יד אֶתְ/כֶ֑ם וַ/יִּשְׁמַ֤ע יְהוָה֙ אֵלַ֔/י גַּ֖ם בַּ/פַּ֥עַם הַ/הִֽוא׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/019.yaml
  text: For I was afraid because of the anger and the wrath with which Yahweh was angry against you[a], to destroy you[b]. But Yahweh listened to me also at that time.
translation:
  language: sw
  text: Kwa maana niliogopa kwa sababu ya hasira na ghadhabu ambazo Yahwe aliwakasirikia, ili awaangamize. Lakini Yahwe alinisikiliza pia wakati huo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָגֹרְתִּי
  choice: niliogopa
  rationale: Kitenzi hiki kinaonyesha hofu kuu ya Musa; “niliogopa” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: מִפְּנֵי
  choice: kwa sababu ya
  rationale: Katika nahau hii kihusishi kinaonyesha sababu ya hofu, si mahali halisi mbele ya kitu.
- source_word: הָאַף וְהַחֵמָה
  choice: hasira na ghadhabu
  rationale: Maneno haya mawili yanakusanya taswira ya hasira kali. Kuyatofautisha kwa “hasira” na “ghadhabu” kunahifadhi uzito na urudiaji wa Kiebrania.
- source_word: אֲשֶׁר קָצַף יְהוָה עֲלֵיכֶם
  choice: ya Yahwe alipowakasirikia
  rationale: Muundo huu wa Kiswahili unaonyesha kwamba hasira na ghadhabu zilielekezwa kwa Israeli, huku ukiepuka urudiaji usio wa kawaida kama “hasira ambayo aliikasirika.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi יהוה limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: akitaka kuwaangamiza
  rationale: Infinitivu ya Kiebrania inaonyesha lengo au mwelekeo wa hasira hiyo. “Kuwaangamiza” huhifadhi nguvu ya שׁמד bila kuongeza wazo la kuwaua mmoja mmoja.
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: Lakini Yahwe alinisikiliza
  rationale: שׁמע pamoja na אֶל hapa ni zaidi ya kusikia sauti tu; katika muktadha wa maombezi, inaonyesha kumsikiliza Musa. “Lakini” huonyesha mgeuko kutoka tishio la kuangamizwa.
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: hata wakati huo
  rationale: Kifungu hiki kinaonyesha kwamba hiyo ilikuwa mojawapo ya nyakati ambazo Yahwe alimsikiliza Musa; “hata wakati huo” ni cha asili na huhifadhi mkazo wa גַּם.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandiko ya Kiebrania yana jina binafsi יהוה; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Ukali wa lugha kuhusu hasira ya Mungu
  choice: hasira na ghadhabu ya Yahwe alipowakasirikia
  alternative: kutopendezwa kwa Yahwe nanyi
  rationale: Kiebrania kinatumia maneno matatu yanayohusiana na hasira (אַף, חֵמָה, קצף). Tafsiri haipunguzi ukali huo, lakini inaunda sentensi ya kawaida ya Kiswahili.
- issue: Maana ya Yahwe kumsikiliza Musa
  choice: alinisikiliza
  alternative: alinisikia
  rationale: Muktadha wa maombezi unaashiria kusikiliza kwa kuitikia kwa neema, lakini maandishi hayasemi wazi kwa kitenzi tofauti kwamba ombi lilikubaliwa. “Alinisikiliza” huhifadhi maana hiyo bila kuifafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Urudiaji wa maneno ya hasira umehifadhiwa kwa kiasi kinachowezekana, huku muundo mgumu wa Kiebrania ukifanywa wa kawaida katika Kiswahili.
