  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַל תֹּאמַ֣ר בִּ/לְבָבְ/ךָ֗ בַּ/הֲדֹ֣ף יְהוָה֩ אֱלֹהֶ֨י/ךָ אֹתָ֥/ם מִ/לְּ/פָנֶי/ךָ֮ לֵ/אמֹר֒ בְּ/צִדְקָתִ/י֙ הֱבִיאַ֣/נִי יְהוָ֔ה לָ/רֶ֖שֶׁת אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את וּ/בְ/רִשְׁעַת֙ הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה יְהוָ֖ה מוֹרִישָׁ֥/ם מִ/פָּנֶֽי/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/004.yaml
  text: Do not say in your heart[a], when Yahweh your God drives them out from before you, saying, ‘Because of my righteousness Yahweh has brought me in to possess this land,’ while because of the wickedness of these nations Yahweh is dispossessing them before you.
translation:
  language: sw
  text: Usiseme moyoni mwako[a], wakati Yahweh Mungu wako atakapowafukuza mbele yako, ‘Ni kwa sababu ya haki yangu Yahweh amenileta ili niimiliki nchi hii.’ Lakini ni kwa sababu ya uovu wa mataifa haya Yahweh anawanyang’anya nchi yao mbele yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usijiambie.” Kiebrania kinasema kihalisi “Usiseme moyoni mwako,” yaani, usifikiri au kujisemea ndani yako.
    reason: Ufafanuzi wa nahau ya Kiebrania
lexical_decisions:
- source_word: אַל תֹּאמַר בִּלְבָבְךָ
  choice: Usiseme moyoni mwako
  rationale: אַל pamoja na kitenzi kisichotimilika hutoa katazo. ‘Moyoni mwako’ huhifadhi sitiari ya Kiebrania ya mawazo au maneno ya ndani na inaeleweka kwa Kiswahili cha sasa.
- source_word: בַּהֲדֹף
  choice: wakati ... atakapowafukuza
  rationale: ב iliyoambatanishwa na jina-kitenzi inaonyesha hali ya wakati; נדף hapa ni kuwafukuza au kuwasukuma waondoke.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh Mungu wako
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahweh,’ nalo אֱלֹהֶיךָ limetafsiriwa kwa muundo wa kawaida wa agano, ‘Mungu wako.’
- source_word: מִלְּפָנֶיךָ / מִפָּנֶיךָ
  choice: mbele yako
  rationale: Nahau hii ya mahali ina maana ya kuwaondoa mataifa yaliyosimama dhidi ya Israeli; ‘mbele yako’ ni ya kawaida na huhifadhi taswira ya chanzo.
- source_word: בְּצִדְקָתִי
  choice: Ni kwa sababu ya haki yangu
  rationale: צְדָקָה hapa ni haki au uadilifu ambao Israeli wangedai kuwa sababu ya kupewa nchi. ‘Haki yangu’ huhifadhi uzito wa kimaadili na kitheolojia wa neno.
- source_word: הֱבִיאַנִי
  choice: amenileta
  rationale: Hifili ya בוא pamoja na kiambishi cha nafsi ya kwanza ina maana ya ‘amenileta/ameniingiza.’ Muktadha wa kuingia nchini unaifanya ‘amenileta’ ieleweke bila kulazimisha uradidi.
- source_word: לָרֶשֶׁת אֶת הָאָרֶץ הַזֹּאת
  choice: niimiliki nchi hii
  rationale: ירשׁ katika muktadha huu ni kuipata na kuimiliki nchi. Muundo ‘niimiliki’ unaeleza kusudi la kuletwa humo kwa Kiswahili cha kawaida.
- source_word: וּבְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה
  choice: Badala yake, ni kwa sababu ya uovu wa mataifa haya
  rationale: ו ina nguvu ya kutofautisha dai la Israeli na sababu halisi inayotajwa. ‘Badala yake’ huonyesha utofauti huo wazi, huku ‘uovu’ ikiwakilisha רִשְׁעָה.
- source_word: מוֹרִישָׁם
  choice: anawafukuza
  rationale: Hifili ya ירשׁ hapa ina maana ya kuyaondoa au kuyanyang’anya mataifa makazi yao. ‘Anawafukuza’ ni wazi na pia hudumisha ulinganifu wa kitendo cha kuwatoa mbele ya Israeli.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la agano יהוה. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Dai kwamba Israeli walistahili nchi kwa haki yao
  choice: Ni kwa sababu ya haki yangu
  alternative: Ni kwa sababu mimi ni mwadilifu; kwa ustahili wangu
  rationale: '‘Haki yangu’ huhifadhi neno la chanzo na mvutano wa kitheolojia: Musa anataja dai hilo la kujihesabia haki ili kulikataa, bila kulilegeza au kulifafanua kupita kiasi.'
- issue: Uhusiano kati ya haki ya Israeli na uovu wa mataifa
  choice: Badala yake, ni kwa sababu ya uovu wa mataifa haya
  alternative: na kwa sababu ya uovu wa mataifa haya; huku ikiwa ni kwa sababu ya uovu wa mataifa haya
  rationale: Muktadha unaonyesha utofauti mkali kati ya sababu ambayo Israeli wasingepaswa kudai na uovu wa mataifa unaotajwa. Tafsiri haidai kwamba kifungu hiki pekee kinatoa maelezo yote ya kitheolojia kuhusu kupewa nchi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa chanzo umehifadhiwa kadiri unavyobaki wa asili kwa Kiswahili; ‘Badala yake’ huondoa utata wa mfuatano bila kufuta tofauti ya kimantiki ya aya.
