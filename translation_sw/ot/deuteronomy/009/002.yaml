base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/002.yaml
  text: 'a great and tall people[a], the sons of Anak, whom you know, and of whom you have heard: ‘Who can stand before the sons of Anak?’'
translation:
  language: sw
  text: 'watu wakubwa na warefu[a], wana wa Anaki, ambao unawajua na ambao umesikia habari zao: ‘Ni nani anayeweza kusimama mbele ya wana wa Anaki?’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waanaki.” Kiebrania ni, kihalisi, “wana wa Anaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם
  choice: watu
  rationale: Hapa עַם humaanisha kundi la watu. Kiswahili cha kawaida hutumia ‘watu’ kwa njia ya asili zaidi kuliko ‘taifa’ katika maelezo haya.
- source_word: גָּדוֹל
  choice: wengi
  rationale: Kwa kundi la watu, גָּדוֹל inaweza kueleza ukubwa wa idadi. ‘Wengi’ ni ya asili katika Kiswahili na inaendana na jozi ‘wengi na warefu’ katika Kumbukumbu la Torati 1:28 na 2:10, 21.
- source_word: וָרָם
  choice: warefu
  rationale: Katika muktadha huu neno linaeleza kimo cha watu, si cheo; ‘warefu’ huwasilisha maana hiyo wazi.
- source_word: בְּנֵי עֲנָקִים / בְּנֵי עֲנָק
  choice: wana wa Anaki
  rationale: Huhifadhi usemi wa kifamilia wa Kiebrania, yaani ‘wana wa Anaki,’ na jina la babu au kundi bila kuufanya moja kwa moja kuwa jina la kabila.
- source_word: אֲשֶׁר אַתָּה יָדַעְתָּ
  choice: ambao unawajua
  rationale: Huhifadhi kauli ya moja kwa moja kwamba Israeli tayari inawajua watu hao.
- source_word: וְאַתָּה שָׁמַעְתָּ
  choice: na ambao umesikia habari zao
  rationale: ‘Kusikia habari zao’ ni Kiswahili cha asili kinachounganisha kifungu hiki na usemi unaonukuliwa unaofuata.
- source_word: מִי יִתְיַצֵּב לִפְנֵי
  choice: Ni nani anayeweza kusimama mbele ya
  rationale: Huhifadhi taswira ya Kiebrania ya kusimama mbele ya mpinzani huku ikitoa maana ya kuweza kuhimili nguvu zake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja, lakini ‘watu wengi’ umetumiwa badala ya ‘watu wakubwa’ ili kuepuka utata wa ukubwa wa mwili na kuendana na matumizi ya muktadha wa Kumbukumbu la Torati.
