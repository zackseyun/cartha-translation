  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/בִ/שְׁלֹ֨חַ יְהוָ֜ה אֶתְ/כֶ֗ם מִ/קָּדֵ֤שׁ בַּרְנֵ֨עַ֙ לֵ/אמֹ֔ר עֲלוּ֙ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶ֑ם וַ/תַּמְר֗וּ אֶת פִּ֤י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם וְ/לֹ֤א הֶֽאֱמַנְתֶּם֙ ל֔/וֹ וְ/לֹ֥א שְׁמַעְתֶּ֖ם בְּ/קֹלֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/023.yaml
  text: And when Yahweh sent you from Kadesh-barnea[a], saying, 'Go up and take possession of the land that I have given you,' you rebelled against the command of Yahweh your God[c][b], and you did not believe him or listen to his voice.
translation:
  language: sw
  text: Yahweh alipowatuma kutoka Kadesh-barnea, akisema, “Pandeni mkaimiliki nchi niliyowapa,” mliasi amri ya Yahweh Mungu wenu[a]; hamkumwamini[b] wala hamkuisikiliza sauti yake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “mliasi dhidi ya kinywa cha Yahweh Mungu wenu”; yaani, mliasi amri au neno lake.
    reason: lexical_alternative
  - marker: b
    text: Au, “hamkumtumaini.”
    reason: lexical_alternative
  - marker: c
    text: Au, “hamkuitii sauti yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁלֹחַ
  choice: alipowatuma
  rationale: Muundo wa kiunganishi, kihusishi na kitenzi-jina unaonyesha wakati; “alipowatuma” ni Kiswahili cha kawaida kinachohifadhi uhusiano huo wa wakati.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lenye herufi nne limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: kutoka Kadesh-barnea
  rationale: Jina la mahali limetoholewa, huku kistari kifupi kikihifadhi umoja wa jina hilo.
- source_word: עֲלוּ וּרְשׁוּ
  choice: Pandeni mkaimiliki
  rationale: “Pandeni” huhifadhi wazo la kwenda juu, na “mkaimiliki” huonyesha kuingia na kuitwaa nchi kuwa milki bila kulipanua zaidi ya muktadha.
- source_word: הָאָרֶץ אֲשֶׁר נָתַתִּי לָכֶם
  choice: nchi niliyowapa
  rationale: Wakati timilifu wa Kiebrania unaonyesha nchi kuwa tayari imetolewa kwao kwa uhakika.
- source_word: וַתַּמְרוּ אֶת־פִּי
  choice: mliasi amri
  rationale: Neno kwa neno ni “mliasi kinywa,” lakini huu ni msemo wa Kiebrania unaomaanisha kuasi agizo au neno lenye mamlaka.
- source_word: וְלֹא הֶאֱמַנְתֶּם לוֹ
  choice: hamkumwamini
  rationale: Kitenzi kinaweza kumaanisha kuamini au kumtumaini; “hamkumwamini” kinafaa kwa kukataa ahadi na agizo lake huku maana nyingine ikibaki katika tanbihi.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלוֹ
  choice: wala hamkuisikiliza sauti yake
  rationale: Tafsiri hii huhifadhi taswira ya kusikiliza sauti, huku katika muktadha ikiwa na maana ya kutii.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la Mungu, hivyo limetoholewa bila kulibadilisha kuwa cheo.
- issue: Nguvu ya נָתַתִּי katika ahadi ya nchi
  choice: niliyowapa
  alternative: ninayowapa
  rationale: Wakati timilifu unaonyesha utoaji huo kuwa jambo lililofanywa na lililo hakika, bila kuingiza mfumo wa kitheolojia usiotajwa katika mstari.
- issue: Maana ya שׁמע בקול
  choice: hamkuisikiliza sauti yake
  alternative: hamkuitii sauti yake
  rationale: Usemi huo unaweza kumaanisha kusikiliza na kutii. Maandishi makuu yanahifadhi taswira ya Kiebrania, na tanbihi inaweka wazi maana ya utii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa moja kwa moja, jina Yahweh limehifadhiwa, na misemo ya Kiebrania imewasilishwa kwa lugha ya kawaida huku tofauti muhimu za maana zikielezwa katika tanbihi.
