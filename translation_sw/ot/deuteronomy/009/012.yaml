review_pass:
  verdict: revise
  source_fidelity: The draft preserves the divine name, the rhetorical distancing in “watu wako, uliowatoa Misri,” both occurrences of urgency, and the specified cast-metal character of מַסֵּכָה. However, “wameiacha ... njia” is stronger and less precise than the Hebrew idiom “turned aside from the way.”
  naturalness: The proposed revision uses idiomatic Standard East African Swahili. “Shuka” is the direct coordinated imperative after “Inuka,” and “wamekengeuka ... kutoka katika njia” naturally conveys departure from a prescribed course.
  terminology: “Sanamu ya metali iliyosubuliwa” clearly identifies an image made by casting metal. It is more transparent than “sanamu ya kusubu,” whose construction is less natural and can sound incomplete.
  issues:
  - severity: medium
    issue: “ushuke” after “Inuka”
    rationale: The Hebrew has two coordinated imperatives. In independent direct speech, “Inuka, shuka” more directly preserves them than the subjunctive-style “ushuke.”
  - severity: medium
    issue: “Wameiacha haraka njia” for סָרוּ מַהֵר מִן־הַדֶּרֶךְ
    rationale: The source says they quickly turned aside/deviated from the way, not necessarily that they abandoned it. “Wamekengeuka haraka kutoka katika njia” preserves the path metaphor and directional nuance.
  - severity: low
    issue: “sanamu ya kusubu”
    rationale: Though intended to reflect casting, the phrase is less idiomatic and does not as clearly identify the material process. “Sanamu ya metali iliyosubuliwa” is clearer while retaining the lexical specificity.
  revised_text: Yahwe akaniambia, “Inuka, shuka haraka kutoka hapa, kwa maana watu wako, uliowatoa Misri, wamejiharibu. Wamekengeuka haraka kutoka katika njia niliyowaamuru waifuate; wamejitengenezea sanamu ya metali iliyosubuliwa[a].”
  revised_footnotes:
