  to: Yahwe akaniambia, “Inuka, shuka haraka kutoka hapa, kwa maana watu wako, uliowatoa Misri, wamejiharibu. Wamekengeuka haraka kutoka katika njia niliyowaamuru waifuate; wamejitengenezea sanamu ya metali iliyosubuliwa[a].”
