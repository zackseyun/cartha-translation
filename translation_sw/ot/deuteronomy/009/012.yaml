base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/012.yaml
  text: And Yahweh said to me[a], 'Arise, go down quickly from here, because your people, whom you brought out from Egypt, have corrupted themselves. They have quickly turned aside from the way that I commanded them; they have made for themselves a cast image.'
translation:
  language: sw
  text: Yahwe akaniambia, “Inuka, shuka haraka kutoka hapa, kwa maana watu wako, uliowatoa Misri, wamejiharibu. Wamekengeuka haraka kutoka katika njia niliyowaamuru waifuate; wamejitengenezea sanamu ya metali iliyosubuliwa[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, sanamu iliyotengenezwa kwa kusubu metali iliyoyeyushwa katika kalibu.
    reason: Hufafanua kwamba neno la Kiebrania linarejelea sanamu iliyoundwa kwa kumimina metali iliyoyeyushwa katika kalibu.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la agano la Mungu kwa umbo linalotumika na kueleweka katika Kiswahili.
- source_word: קוּם רֵד מַהֵר מִזֶּה
  choice: Inuka, ushuke haraka kutoka hapa
  rationale: Linahifadhi amri mbili, mwelekeo wa kushuka, mahali pa kuanzia, na uzito wa haraka uliomo katika Kiebrania.
- source_word: שִׁחֵת
  choice: wamejiharibu
  rationale: Katika muktadha huu kitenzi kinaonyesha kwamba watu wamejitia katika upotovu wa kiadili na kidini; umbo la kujirejelea linaeleza athari hiyo kwa Kiswahili cha kawaida.
- source_word: עַמְּךָ
  choice: watu wako
  rationale: Linahifadhi usemi wa moja kwa moja na hali ya Mungu kujitenga nao kwa namna ya karipio anaposema na Musa.
- source_word: אֲשֶׁר הוֹצֵאתָ מִמִּצְרָיִם
  choice: uliowatoa Misri
  rationale: Linawasilisha kwa ufupi na kwa kawaida maana ya kisababishi, yaani Musa kuwatoa watu kutoka Misri.
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  choice: Wameiacha haraka njia
  rationale: Linadumisha sitiari ya kuondoka katika njia iliyoamriwa na pia marudio ya dhana ya haraka katika mstari.
- source_word: אֲשֶׁר צִוִּיתִם
  choice: niliyowaamuru waifuate
  rationale: Kiebrania kinawaweka watu kama walengwa wa amri; nyongeza ya ‘waifuate’ inaweka uhusiano huo wazi kwa Kiswahili bila kubadili maana.
- source_word: מַסֵּכָה
  choice: sanamu ya kusubu
  rationale: Hutaja sanamu iliyotengenezwa kwa kumimina metali iliyoyeyushwa katika kalibu, badala ya kutumia neno la jumla tu kama ‘sanamu’ au ‘kib sanamu’.
theological_decisions:
- issue: Umbali wa kimatamshi katika ‘watu wako, uliowatoa Misri’
  choice: Wording hii imehifadhiwa kama karipio la Mungu kwa Musa.
  alternative: Kulainisha kuwa ‘watu wangu’ au ‘watu niliowatoa Misri’.
  rationale: Kiebrania kinahusisha watu na Musa katika usemi huu na hivyo kuleta mvutano wa kimakusudi ambao haupaswi kuondolewa.
- issue: Maana mahususi ya מַסֵּכָה
  choice: sanamu ya kusubu
  alternative: sanamu; sanamu ya kuabudiwa
  rationale: Neno la Kiebrania linabainisha namna sanamu ilivyotengenezwa; tafsiri inahifadhi uhalisi huo bila kuongeza hukumu isiyosemwa moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya ‘haraka’ yamehifadhiwa kwa sababu yapo katika chanzo. Alama ya tanbihi imewekwa baada ya istilahi inayofafanuliwa.
