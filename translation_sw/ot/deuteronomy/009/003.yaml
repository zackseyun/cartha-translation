source:
  edition: WLC
  text: וְ/יָדַעְתָּ֣ הַ/יּ֗וֹם כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ הֽוּא הָ/עֹבֵ֤ר לְ/פָנֶ֨י/ךָ֙ אֵ֣שׁ אֹֽכְלָ֔ה ה֧וּא יַשְׁמִידֵ֛/ם וְ/ה֥וּא יַכְנִיעֵ֖/ם לְ/פָנֶ֑י/ךָ וְ/הֽוֹרַשְׁתָּ֤/ם וְ/הַֽאַבַדְתָּ/ם֙ מַהֵ֔ר כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/003.yaml
  text: So know today that Yahweh your God is the one crossing over before you[a], a consuming fire. He will destroy them, and he will subdue them before you; and you will dispossess them and make them perish quickly[d][c][b], just as Yahweh has spoken to you.
translation:
  language: sw
  text: Basi ujue leo kwamba Yahweh, Mungu wako, ndiye anayevuka mbele yako[a], moto ulao[b]. Yeye atawateketeza na kuwatiisha mbele yako; nawe utawapokonya nchi yao[c] na kuwaangamiza upesi, kama Yahweh alivyokuambia[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayetangulia mbele yako.” Kitenzi cha Kiebrania kinasema kihalisi kwamba Yahweh ndiye anayevuka mbele ya Israeli.
    reason: lexical_alternative
  - marker: b
    text: Au, “moto uteketezao.”
    reason: lexical_alternative
  - marker: c
    text: Au, “utawafukuza.” Kitenzi kinaweza kumaanisha kuwaondoa wakaaji ili kuitwaa nchi yao.
    reason: lexical_alternative
  - marker: d
    text: Au, “kama Yahweh alivyonena nawe.” Maana ni kwamba jambo hili litatokea kulingana na neno ambalo Yahweh alikwisha kukuambia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: Basi ujue leo
  rationale: “Basi” linaonyesha uhusiano na onyo lililotangulia, huku “ujue leo” likidumisha nguvu ya kauli ya moja kwa moja kwa nafsi ya pili umoja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo, kwa kuwa maandishi ya Kiebrania yanatumia tetragramatoni.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya usemi wa agano unaomwelekea msikilizaji mmoja.
- source_word: הוּא הָעֹבֵר לְפָנֶיךָ
  choice: ndiye anayevuka mbele yako
  rationale: Kauli endelevu “anayevuka” inadumisha picha hai ya Yahwe akivuka mbele ya Israeli kuingia katika nchi, badala ya kuifanya kuwa kauli ya jumla ya kwenda mbele.
- source_word: אֵשׁ אֹכְלָה
  choice: moto ulao
  rationale: Usemi huu mfupi na wenye nguvu unahifadhi sitiari halisi ya moto unaokula na uzito wake wa hukumu ya Mungu.
- source_word: יַשְׁמִידֵם
  choice: atawateketeza
  rationale: Kitenzi hiki kinaonyesha kuharibu kabisa; “atawateketeza” pia kinakubaliana kiasili na picha iliyotangulia ya moto ulao.
- source_word: יַכְנִיעֵם
  choice: kuwatiisha
  rationale: Katika muktadha wa vita, neno hili linaeleza kuwashusha na kuwaweka chini ya nguvu ya Israeli, si unyenyekevu wa ndani.
- source_word: לְפָנֶיךָ
  choice: mbele yako
  rationale: Tafsiri hii inadumisha maana ya mahali na ya kijeshi iliyomo katika usemi wa Kiebrania.
- source_word: וְהוֹרַשְׁתָּם
  choice: utawafukuza
  rationale: Katika muktadha wa kuitwaa nchi, Hiphil ya ירשׁ inaweza kumaanisha kuwaondoa wakaaji katika milki yao; “utawafukuza” ni ya kawaida na wazi kwa wasomaji wa Kiswahili.
- source_word: וְהַאֲבַדְתָּם
  choice: kuwaangamiza
  rationale: Hiphil ya אבד ina nguvu ya kusababisha waangamie. Uchaguzi huu unahifadhi nguvu hiyo na kutofautisha kwa kiasi na “atawateketeza” iliyotumika kwa שׁמד.
- source_word: מַהֵר
  choice: upesi
  rationale: Neno hili linaonyesha kasi ya kitendo au matokeo, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה לָךְ
  choice: kama Yahwe alivyokuambia
  rationale: Tafsiri hii inaonyesha neno la Mungu lililotolewa hapo awali bila kulifafanua zaidi kuwa ahadi, ingawa muktadha unaweza kuwa na maana hiyo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la agano, hivyo limedumishwa kama “Yahwe” badala ya kubadilishwa na cheo au umbo jingine la matamshi.
- issue: Taswira ya Mungu katika אֵשׁ אֹכְלָה
  choice: moto ulao
  alternative: moto uteketezao
  rationale: “Moto ulao” unahifadhi sitiari ya Kiebrania kwa ukaribu na haupunguzi ukali wa uwepo na hukumu ya Mungu.
- issue: Uhusiano kati ya tendo la Mungu na tendo la Israeli
  choice: Mungu atawateketeza na kuwatiisha; Israeli itawafukuza na kuwaangamiza
  alternative: Kuyafanya matendo yote kuwa kazi ya Mungu peke yake au ya Israeli peke yake
  rationale: Muundo wa Kiebrania unadumisha kwa pamoja uongozi na tendo la Mungu pamoja na jukumu la Israeli; tafsiri haiondoi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mtiririko wa moja kwa moja wa Kiebrania, marudio ya “mbele yako,” jina “Yahwe,” na taswira nzito ya vita na hukumu bila kuilegeza au kuiongezea maelezo ya kimadhehebu.
