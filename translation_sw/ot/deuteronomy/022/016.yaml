  text: And the young woman’s father shall say to the elders[a], ‘I gave my daughter to this man as a wife, and he hates her.’
translation:
  language: sw
  text: Baba wa binti huyo atawaambia wazee, “Nilimpa mwanamume huyu binti yangu kuwa mke wake, naye anamchukia.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye amemchukia.” Kitenzi cha Kiebrania humaanisha “chukia”; Kiswahili kinaweza kueleza hali ya sasa kwa “anamchukia” au hali iliyotokea kwa “amemchukia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: Kisha ... atawaambia
  rationale: Katika muktadha huu wa sheria ya kesi, umbo hili linaendeleza hatua inayofuata ya utaratibu; wakati ujao wa Kiswahili unafaa kwa agizo la kisheria.
- source_word: אֲבִי הַנַּעַר
  choice: baba yake yule mwanamke kijana
  rationale: Neno hilo humaanisha kijana wa kike mwenye umri wa kuolewa; ‘mwanamke kijana’ ni la kisasa na linafaa katika muktadha wa ndoa.
- source_word: הַזְּקֵנִים
  choice: wazee
  rationale: Katika mazingira ya kisheria, hawa ni viongozi wa jamii wenye jukumu la kuhukumu, si watu wenye umri mkubwa tu.
- source_word: אֶת בִּתִּי
  choice: binti yangu
  rationale: Kiambishi cha nafsi kimetafsiriwa moja kwa moja, huku alama ya yambwa אֶת ikiwa haina tafsiri ya pekee.
- source_word: נָתַתִּי
  choice: Nilimpa
  rationale: Katika mpango wa ndoa, kitenzi hiki humaanisha kumpa mtu binti katika ndoa; wakati uliopita ni wa kawaida katika usemi huu.
- source_word: לָאִישׁ הַזֶּה
  choice: mtu huyu
  rationale: אִישׁ hapa ni ‘mtu/mwanamume’; ‘mtu huyu’ humtambulisha mume anayeshtakiwa bila kuongeza maana isiyokuwapo.
- source_word: לְאִשָּׁה
  choice: awe mke wake
  rationale: Huu ni usemi wa kawaida wa ndoa; tafsiri hii ni ya asili katika Kiswahili na huhifadhi uhusiano unaokusudiwa.
- source_word: וַיִּשְׂנָאֶהָ
  choice: lakini amemchukia
  rationale: שׂנא maana yake ya msingi ni ‘chukia.’ ‘Amemchukia’ huonyesha hali iliyotokea katika mfululizo wa kesi, bila kuondoa uwezekano wa kutafsiri hali hiyo kuwa ya sasa.
