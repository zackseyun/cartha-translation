lexical_decisions:
- source_word: כִּי
  choice: Ikiwa
  rationale: Katika sheria hii ya kifani, neno hili linaanzisha hali ya masharti; “ikiwa” huonyesha hilo wazi na kwa kawaida katika Kiswahili.
- source_word: יִקַּח אִישׁ אִשָּׁה
  choice: mwanamume atamwoa mwanamke
  rationale: Ingawa kitenzi לקח humaanisha kihalisi “chukua,” katika muktadha huu ni nahau ya kumchukua mwanamke kuwa mke. “Atamwoa mwanamke” ni Kiswahili cha sasa, cha kawaida, na kinawasilisha maana ya ndoa bila utata usio wa lazima.
- source_word: וּבָא אֵלֶיהָ
  choice: na kumwingilia[a]
  rationale: Hii ni nahau ya Kiebrania inayorejelea kujamiana ndani ya ndoa. “Kumwingilia” inadumisha lugha ya staha na mpangilio wa tukio huku tanbihi ikitoa maana iliyo wazi zaidi.
- source_word: וּשְׂנֵאָהּ
  choice: kisha akamchukia
  rationale: Kitenzi שׂנא kina maana ya “chukia.” “Kisha” linaonyesha mfuatano wa matendo unaodokezwa na muundo wa Kiebrania bila kubadili uzito wa neno hilo.
