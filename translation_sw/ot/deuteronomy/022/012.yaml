translation:
  language: sw
  text: Jitengenezee vishada[a] kwenye pembe nne za vazi lako[b] unalojifunika nalo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kamba zilizosokotwa” au “pindo” badala ya “vishada.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “kifuniko chako”; yaweza pia kutafsiriwa “joho lako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדִלִים
  choice: vishada
  rationale: Neno hili linaonyesha vitu vya nyuzi vinavyoning’inia kwenye vazi. “Vishada” ni Kiswahili cha kawaida na kinachofaa katika muktadha huu; maana ya “kamba zilizosokotwa” na “matamvua” imehifadhiwa katika tanbihi.
- source_word: תַּעֲשֶׂה לָּךְ
  choice: jitengenezee
  rationale: Kauli hii ya amri ya kisheria pamoja na לָּךְ inaelezwa kwa kawaida na kwa ufupi kwa “jitengenezee,” ikihifadhi wazo la kufanya kitu kwa ajili yako mwenyewe.
- source_word: עַל
  choice: kwenye
  rationale: Katika muktadha wa kuweka vishada katika sehemu za vazi, “kwenye” ni usemi wa kawaida wa Kiswahili unaoonyesha mahali.
- source_word: אַרְבַּע כַּנְפוֹת
  choice: pembe nne
  rationale: Ingawa כָּנָף yaweza kumaanisha “bawa” au “ukingo,” hapa inaonyesha ncha au pembe nne za kitambaa; “pembe nne” ni wazi na ya kawaida.
- source_word: כְּסוּתְךָ
  choice: vazi lako
  rationale: Nomino hii ni kitu cha kujifunika, mara nyingi vazi au joho. “Vazi lako” ni ya asili katika Kiswahili na haibainishi kupita kiasi aina ya nguo.
- source_word: אֲשֶׁר תְּכַסֶּה בָּהּ
  choice: unalojifunika
  rationale: Kauli hii inaeleza matumizi ya vazi. “Unalojifunika” inahifadhi wazo la kujisitiri au kujifunika bila kulazimisha aina maalumu ya vazi.
