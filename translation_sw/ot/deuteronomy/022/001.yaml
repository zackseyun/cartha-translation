review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the prohibition against deliberately disregarding a fellow Israelite's lost livestock and the emphatic obligation to return it. However, the Hebrew uses plural forms in נִדָּחִים ('driven/strayed away') and תְּשִׁיבֵם ('return them'), whereas the Swahili uses singular agreement ('akiwa amepotea'; 'umrudishe').
  naturalness: The revised wording is idiomatic Standard East African Swahili and avoids the awkward singular object marker in a context referring to livestock in plural/generic terms.
  terminology: “Ndugu yako” appropriately retains the source term's covenant-community/kinship breadth. “Kondoo” is an acceptable contextual rendering of שֶׂה. “Waliopotea” represents the animals' being away/lost without asserting an unspecified agent drove them away.
  issues:
  - severity: medium
    issue: Singular agreement for animals
    rationale: The draft's 'akiwa amepotea' and 'umrudishe' are singular, but the Hebrew has plural 'niddachim' and the plural object suffix in 'hashev teshivem.' Swahili should use plural agreement and object reference here.
  - severity: low
    issue: “Usimwone” unnecessarily marks a singular animate object
    rationale: The object prefix m- reinforces the draft's singular reading. 'Usione' naturally introduces the coordinated livestock phrase and accommodates the source's plural/generic reference.
  revised_text: Usione ng’ombe wa ndugu yako au kondoo wake waliopotea, ukajifanya huoni; lazima uwarudishe kwa ndugu yako.
