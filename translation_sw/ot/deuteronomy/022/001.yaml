  text: לֹֽא תִרְאֶה֩ אֶת שׁ֨וֹר אָחִ֜י/ךָ א֤וֹ אֶת שֵׂי/וֹ֙ נִדָּחִ֔ים וְ/הִתְעַלַּמְתָּ֖ מֵ/הֶ֑ם הָשֵׁ֥ב תְּשִׁיבֵ֖/ם לְ/אָחִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/001.yaml
  text: You shall not see your brother’s ox or his sheep driven away and ignore them; you must certainly return them to your brother.
translation:
  language: sw
  text: Usione ng’ombe wa ndugu yako au kondoo wake waliopotea, ukajifanya huoni; lazima uwarudishe kwa ndugu yako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָחִיךָ
  choice: ndugu yako
  rationale: Neno hili linaweza kumaanisha ndugu wa damu au mtu wa jumuiya ya agano; “ndugu yako” huhifadhi upana huo.
- source_word: שֵׂיוֹ
  choice: kondoo wake
  rationale: Ingawa שֶׂה inaweza kutaja kondoo au mbuzi mmoja, muktadha wa jozi ya mifugo na matumizi ya kawaida ya Kiswahili yanafanya “kondoo” kuwa tafsiri wazi bila kuongeza ufafanuzi usiokuwamo.
- source_word: נִדָּחִים
  choice: akiwa amepotea
  rationale: Kitenzi kina wazo la kusukumwa au kutangatanga mbali. Katika sheria ya kumrudisha mnyama aliyepotea, “amepotea” ni ya kawaida na huhifadhi hali bila kudai kwamba mtu fulani alimfukuza.
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  choice: kisha ukajifanya humwoni
  rationale: Hitpael ya עלם hapa huonyesha kujificha au kujiondoa kwa makusudi, yaani kupuuza jambo lililoonekana; msemo huu wa Kiswahili unaonyesha hali hiyo ya kujifanya bila kujali.
- source_word: הָשֵׁב תְּשִׁיבֵם
  choice: hakika ni lazima umrudishe
  rationale: Muundo wa infinitivu kamili pamoja na kitenzi kilichopigwa huimarisha wajibu wa kurudisha; “hakika ni lazima” huwasilisha msisitizo huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Upeo wa neno “ndugu”
  choice: Kudumisha “ndugu yako” bila kulipanua kuwa “jirani” au “Mwisraeli mwenzako.”
  alternative: mwananchi mwenzako / jirani yako
  rationale: Maandishi yenyewe hutumia אָחִיךָ; tafsiri halisi inadumisha lugha ya undugu na kuacha upeo wake uelezwe na muktadha mpana wa sheria.
- issue: Chanzo cha kupotea kwa mnyama
  choice: akiwa amepotea
  alternative: akiwa amefukuzwa / amesukumwa mbali
  rationale: נִדָּחִים inaweza kubeba wazo la kusukumwa mbali, lakini haitaji wazi mtendaji. Tafsiri iliyochaguliwa haiongezi madai kwamba mtu au nguvu fulani alimfukuza mnyama.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Umoja umetumiwa kwa kila mnyama kwa sababu Kiswahili hutaja “ng’ombe” na “kondoo” kwa maumbo yanayoweza kutegemea upatanisho wa kisarufi; “akiwa” na “umrudishe” zinafuata wazo la kila mnyama anayeonekana. Sentensi inaweka katazo na wajibu chanya kwa mtiririko wa kawaida.
