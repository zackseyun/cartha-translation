  text: Then the elders of that city shall take the man and discipline him,[a]
translation:
  language: sw
  text: Kisha wazee wa mji huo watamchukua mwanamume huyo na kumwadhibu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wamrekebishe kwa adhabu,” au labda “wampige.” Kitenzi cha Kiebrania kina maana pana ya kuadibu au kurekebisha; namna hasa ya adhabu inaeleweka kutokana na muktadha wa sheria, si kutokana na kitenzi hiki pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: watamchukua
  rationale: Kitenzi לקח kwa kawaida humaanisha ‘kuchukua.’ Katika muktadha huu wa kisheria, ‘watamchukua’ ni cha kawaida na hakiongezi wazo la kutumia nguvu ambalo halijaelezwa wazi.
- source_word: זִקְנֵי
  choice: wazee
  rationale: Katika mazingira ya kiraia na kisheria, זקנים ni viongozi wanaotambuliwa wa jumuiya, si wanaume wenye umri mkubwa tu. ‘Wazee’ ni istilahi ya kawaida ya Kiswahili kwa viongozi hao.
- source_word: הָעִיר הַהִוא
  choice: wa mji huo
  rationale: Tafsiri hii inadumisha mahali hususa pa mamlaka na kiashiria ‘huo’ kilichomo katika Kiebrania.
- source_word: הָאִישׁ
  choice: mtu huyo
  rationale: Ingawa איש ni ‘mwanamume’ na kwa muktadha anaweza kuwa mume, ‘mtu huyo’ humrejelea wazi mshtakiwa aliyetajwa bila kuingiza mapema maana ya ‘mume.’
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: na kumwadhibu
  rationale: יסר ina wigo wa kuonya kwa adhabu, kurekebisha, au kuadhibu. ‘Kumwadhibu’ ni lugha ya kawaida na yenye hadhi katika muktadha wa kisheria, huku tanbihi ikihifadhi kutokujulikana kwa namna kamili ya adhabu.
