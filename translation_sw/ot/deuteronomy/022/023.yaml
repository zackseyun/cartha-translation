base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/023.yaml
  text: If there is a young woman[a], a virgin, pledged to a man, and another man finds her in the city and lies with her,
translation:
  language: sw
  text: Ikiwa kuna msichana bikira aliyechumbiwa[a] na mwanamume, kisha mwanamume mwingine akamkuta mjini, akalala naye,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyeposwa na mwanamume.” Neno la Kiebrania humaanisha uchumba rasmi wenye nguvu ya kisheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: Ikiwa kuna
  rationale: Muundo huu unaanzisha kisa cha masharti katika sheria; “ikiwa” huonyesha hali ya kudhaniwa kwa Kiswahili cha kawaida na cha kisheria.
- source_word: נַעֲרָ
  choice: msichana
  rationale: Neno hili humaanisha mwanamke kijana wa umri wa kuolewa. “Msichana” ni la sasa na la kawaida, bila kutumia neno la kizamani.
- source_word: בְתוּלָה
  choice: bikira
  rationale: Hutaja wazi hali ya kutokuwa amefanya ngono, jambo lenye umuhimu katika muktadha huu wa kisheria.
- source_word: מְאֹרָשָׂה לְאִישׁ
  choice: aliyechumbiwa na mwanamume
  rationale: Hueleza uchumba rasmi wenye nguvu ya kisheria. “Aliyechumbiwa” linaeleweka kwa urahisi; tanbihi inafafanua uzito wa hali hiyo na kutoa “aliyeposwa” kama njia nyingine ya kutafsiri.
- source_word: וּמְצָאָהּ אִישׁ
  choice: kisha mwanamume mwingine akamkuta
  rationale: Kiebrania husema tu “mwanamume,” lakini “mwingine” humtofautisha kwa kawaida na mwanamume aliyemchumbia bila kubadili maana ya muktadha.
- source_word: בָּעִיר
  choice: mjini
  rationale: Ni tafsiri ya kawaida na ya asili ya mahali palipotajwa, ambalo lina umuhimu kwa hukumu inayoendelea katika mstari unaofuata.
- source_word: וְשָׁכַב עִמָּהּ
  choice: na kulala naye
  rationale: Ni usemi wa staha unaoeleweka kuwa tendo la ngono na huhifadhi namna ya Kiebrania ya kusema bila kuongeza maelezo yasiyotajwa.
theological_decisions:
- issue: Ikiwa tendo la ngono litajwe wazi kuwa la kulazimishwa katika mstari huu
  choice: “na kulala naye,” bila kuongeza kuwa alimbaka au alimlazimisha
  alternative: “na kumbaka” au “na kumlazimisha kulala naye”
  rationale: Maneno ya mstari huu pekee hayasemi wazi kuwa nguvu ilitumika. Tafsiri inadumisha kutokubainishwa huko na haileti mapema hitimisho kutoka mistari inayozunguka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo wa sharti la kisheria umehifadhiwa, huku usemi wa staha wa tendo la ngono ukibaki bila kufafanuliwa kuwa wa hiari au wa kulazimishwa.
