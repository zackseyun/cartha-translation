  terminology: “Punda,” “vazi,” na “ndugu yako” ni chaguo sahihi. “Vazi” huhifadhi upana wa שִׂמְלָה bila kulazimisha “joho,” na “ndugu yako” huhifadhi istilahi ya undugu ya chanzo. Tanbihi imefungwa kwa usahihi kwenye “kukipuuza” na inaonyesha taswira mbadala ya Kiebrania.
