base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/003.yaml
  text: And so you shall do with his donkey[a], and so you shall do with his cloak, and so you shall do with any lost thing of your brother that is lost from him and you find it; you may not ignore it.
translation:
  language: sw
  text: Vivyo hivyo utafanya kwa punda wake, na vivyo hivyo utafanya kwa vazi lake. Vivyo hivyo utafanya kwa kitu chochote cha ndugu yako kilichopotea, nawe ukakipata; hupaswi kukipuuza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri halisi zaidi, “huwezi kujificha,” yaani, “huwezi kujifanya hukioni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: Vivyo hivyo
  rationale: Inaendeleza agizo la mstari uliotangulia na kuhifadhi urudiaji wa kimakusudi katika mtindo wa kisheria.
- source_word: תַּעֲשֶׂה
  choice: utafanya
  rationale: Wakati ujao katika muktadha huu wa sheria una nguvu ya agizo; “utafanya” ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: לַחֲמֹרוֹ
  choice: kwa punda wake
  rationale: Kihusishi “kwa” kinaeleza namna ya kushughulikia punda aliyepotea na kinafuata muundo wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: לְשִׂמְלָתוֹ
  choice: kwa vazi lake
  rationale: שִׂמְלָה ni vazi, mara nyingi vazi la nje; “vazi” ni sahihi bila kulazimisha aina mahususi isiyohitajika.
- source_word: לְכָל אֲבֵדַת
  choice: kwa kitu chochote ... kilichopotea
  rationale: Usemi huu unapanua sheria kutoka kwa vitu vilivyotajwa hadi kitu chochote kilichopotea, bila kuongeza dhana finyu ya mali.
- source_word: אָחִיךָ
  choice: ndugu yako
  rationale: Inahifadhi neno la undugu la umoja katika maandishi na maana yake ya uhusiano ndani ya jamii ya agano.
- source_word: אֲשֶׁר תֹּאבַד מִמֶּנּוּ
  choice: cha ndugu yako kilichopotea
  rationale: Inahifadhi hali ya kitu kuwa kimepotea bila kusema moja kwa moja kwamba ndugu ndiye aliyekipoteza; mpangilio huu ni wa asili zaidi kuliko tafsiri halisi ya “kilichopotea kutoka kwake.”
- source_word: וּמְצָאתָהּ
  choice: nawe ukakipata
  rationale: Inaonyesha kwa uwazi tendo linalofuata la kukikuta kitu hicho.
- source_word: לֹא תוּכַל
  choice: hupaswi
  rationale: Katika sheria, usemi huu una nguvu ya katazo, si taarifa tu ya kutoweza kimwili.
- source_word: לְהִתְעַלֵּם
  choice: kukipuuza
  rationale: Inatoa maana ya kiutendaji ya kujiondoa au kutotaka kukishughulikia kitu kilichoonekana; taswira halisi zaidi imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya אָחִיךָ katika sheria ya jamii ya agano
  choice: ndugu yako
  alternative: Mwisraeli mwenzako; mtu wa jamaa yako
  rationale: Neno la Kiebrania ni la undugu, umoja na jinsia ya kiume. “Ndugu yako” huhifadhi namna maandishi yanavyoueleza wajibu wa kijamii bila kuupanua au kuufinya kimafundisho.
- issue: Nguvu ya לֹא תוּכַל לְהִתְעַלֵּם
  choice: hupaswi kukipuuza
  alternative: huwezi kujificha; usijifanye hukioni
  rationale: Katika muktadha wa sheria, maneno hayo yanakataza mtu kujiondoa katika wajibu. Tafsiri kuu ni ya kawaida na wazi, huku tanbihi ikihifadhi taswira ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Urudiaji wa “vivyo hivyo utafanya” umehifadhiwa kwa sababu ni sehemu ya mtindo na msisitizo wa sheria. Sentensi imegawanywa baada ya “vazi lake” ili iwe rahisi kusomeka bila kupoteza urudiaji wa chanzo.
