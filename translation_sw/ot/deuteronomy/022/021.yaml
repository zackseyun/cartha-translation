base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/021.yaml
  text: Then they shall bring out the young woman to the entrance of her father's house[a], and the men of her city shall stone her with stones, and she shall die, because she has committed an outrageous act in Israel by prostituting herself in her father's house[c][b]. So you shall purge the evil from your midst.
translation:
  language: sw
  text: Ndipo watakapomtoa huyo msichana[a] hadi mlangoni mwa nyumba ya baba yake, na wanaume wa mji wake watampiga kwa mawe, naye atakufa. Kwa maana ametenda tendo la aibu[b] katika Israeli kwa kujiuza[c] katika nyumba ya baba yake. Ndivyo utakavyoondoa uovu kutoka katikati yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwanamke kijana.” Neno la Kiebrania נַעַר hapa linamtaja kijana wa kike, na muktadha ndio unaobainisha maana hiyo.
    reason: lexical_alternative
  - marker: b
    text: Au “jambo la fedheha” au “tendo ovu sana.” Neno la Kiebrania נְבָלָה linamaanisha tendo linaloshtua na kufedhehesha kimaadili.
    reason: lexical_alternative
  - marker: c
    text: Au “kwa kufanya uasherati.” Kitenzi cha Kiebrania זנה huleta picha ya ukahaba, lakini pia hutumiwa kwa upana kuhusu mwenendo haramu wa kingono.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: huyo msichana
  rationale: Katika muktadha huu neno hilo linamtaja kijana wa kike. “Msichana” ni Kiswahili cha kawaida na chenye heshima; tanbihi inahifadhi uwezekano wa “mwanamke kijana.”
- source_word: פֶּתַח בֵּית אָבִיהָ
  choice: mlangoni pa nyumba ya baba yake
  rationale: פֶּתַח ni nafasi ya kuingilia au mlango. “Mlangoni pa” ni usemi wa asili wa Kiswahili unaohifadhi mahali halisi panapotajwa.
- source_word: וּסְקָלוּהָ ... בָּאֲבָנִים
  choice: watampiga kwa mawe
  rationale: Hii inawasilisha wazi njia ya adhabu iliyotajwa na Kiebrania bila urudiaji usio wa kawaida katika Kiswahili.
- source_word: אַנְשֵׁי עִירָהּ
  choice: wanaume wa mji wake
  rationale: “Wanaume” inafuata usemi wa Kiebrania אַנְשֵׁי badala ya kuugeuza kuwa “watu,” na “mji” linaweza kutaja mji mkubwa au mdogo kulingana na mazingira.
- source_word: נְבָלָה
  choice: jambo la kuchukiza mno
  rationale: Neno hili linaashiria tendo la aibu na la kutisha kimaadili, si upumbavu wa kiakili tu.
- source_word: לִזְנוֹת
  choice: kwa kufanya ukahaba
  rationale: Uteuzi huu unahifadhi picha kali ya זנה; tanbihi inaonyesha kuwa katika matumizi haya inaweza kutaja kwa upana zaidi mwenendo haramu wa kingono.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Ndivyo utakavyoondoa uovu kutoka katikati yako
  rationale: Ni tafsiri ya kawaida na wazi ya fomula ya kisheria ya Kumbukumbu la Torati, huku ikihifadhi nafsi ya pili umoja inayolielekea taifa kama kitu kimoja.
theological_decisions:
- issue: Uzito wa lugha ya kisheria na kingono
  choice: Kudumisha maneno yenye uzito, “jambo la kuchukiza mno” na “kufanya ukahaba,” bila kuongeza jamii za mafundisho ya baadaye
  alternative: Kutumia tu “uasherati” au usemi laini kama “kutenda vibaya”
  rationale: Kiebrania kinatoa hukumu kali ya kimaadili na kijamii; tafsiri haipaswi kuipunguza wala kuipanua zaidi ya ushahidi wa matini.
- issue: Lugha yenye kubainisha jinsia ya watekelezaji wa hukumu
  choice: wanaume wa mji wake
  alternative: watu wa mji wake
  rationale: Usemi wa chanzo ni wa kiume kwa wingi, hivyo tafsiri inaudumisha badala ya kuufanya usionyeshe jinsia.
- issue: Maana ya הָרָע katika fomula ya mwisho
  choice: uovu
  alternative: mtu mwovu au jambo ovu
  rationale: Kiebrania kinaweza kueleweka kwa namna pana kama uovu unaoondolewa katika jumuiya. “Uovu” huhifadhi upana huo bila kuamua kimya kimya kwamba nomino hiyo inamtaja mtu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kisheria wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Sentensi ni za asili katika Kiswahili, lakini uzito, kurudiwa kwa “nyumba ya baba yake,” na nafsi ya pili umoja katika hitimisho vimehifadhiwa.
