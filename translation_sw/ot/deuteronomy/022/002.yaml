  to: Lakini ikiwa ndugu yako hayuko karibu nawe[a], nawe humjui[b], utakichukua na kukiweka ndani ya nyumba yako, nacho kitabaki kwako mpaka ndugu yako atakapokitafuta; ndipo utakirudishia.[c]
  rationale: Marekebisho yanaondoa ubainishaji wa “mnyama” usio katika aya yenyewe, kwa kutumia “kitu hicho” inayoweza kujumuisha mnyama au mali nyingine iliyopotea. Viambishi vimepatana na rejeo hilo pana, na tanbihi c imeandikwa upya ili itoe mbadala halali wa “utakirudishia.”
