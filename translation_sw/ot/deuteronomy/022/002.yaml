  - severity: medium
    issue: Tanbihi c si mbadala sahihi wa kisemantiki wa amri ya mwisho.
    rationale: “Utamrudisha kwake” kwa kawaida hueleweka kama kumrudisha mhusika mahali pake. Kiebrania וַהֲשֵׁבֹתוֹ לוֹ humtaka mpataji arejeshe mali kwa mwenye mali.
