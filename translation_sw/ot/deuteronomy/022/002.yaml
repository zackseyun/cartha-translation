base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/002.yaml
  text: But if your brother is not near you[a], and you do not know him, then you shall bring it into your house, and it shall remain with you until your brother seeks it[c][b]; then you shall restore it to him.
translation:
  language: sw
  text: Lakini ikiwa ndugu yako hayuko karibu nawe[a], nawe humjui[b], utakichukua na kukiweka ndani ya nyumba yako, nacho kitabaki kwako mpaka ndugu yako atakapokitafuta; ndipo utakirudishia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania “ndugu yako” hapa huenda linamaanisha kwa upana Mwisraeli mwenzako, si ndugu wa tumbo moja tu.
    reason: cultural_note
  - marker: b
    text: Au, “nawe hujui ni wa nani”; kwa neno moja moja, “nawe humjui.”
    reason: lexical_alternative
  - marker: c
    text: Au, “utakirejesha kwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיךָ
  choice: ndugu yako
  rationale: Huhifadhi lugha ya undugu ya Kiebrania. Katika sheria za Kumbukumbu la Torati, usemi huu mara nyingi humaanisha mshiriki mwenzao wa jamii ya agano, si lazima ndugu wa tumbo moja.
- source_word: קָרוֹב אֵלֶיךָ
  choice: hayuko karibu nawe
  rationale: Hueleza ukaribu wa mahali kwa Kiswahili cha kawaida na kwa uaminifu kwa chanzo.
- source_word: וְלֹא יְדַעְתּוֹ
  choice: nawe humjui
  rationale: Huhifadhi kiambishi cha nafsi ya kiume kinachomrejelea mwenye mali, yaani ndugu aliyetajwa, huku tanbihi ikifafanua maana ya kimuktadha.
- source_word: וַאֲסַפְתּוֹ אֶל תּוֹךְ בֵּיתֶךָ
  choice: utamleta mnyama huyo ndani ya nyumba yako
  rationale: Kitenzi kina maana ya kumkusanya au kumwingiza ndani. Neno “mnyama huyo” linaweka wazi rejeo la kiambishi cha kiume kwa mnyama aliyepotea katika mstari uliotangulia.
- source_word: וְהָיָה עִמְּךָ
  choice: Atakaa kwako
  rationale: Hutoa maana ya kudumu kwa muda akiwa chini ya uangalizi wa aliyemwona, kwa Kiswahili cha asili.
- source_word: עַד דְּרֹשׁ אָחִיךָ אֹתוֹ
  choice: mpaka ndugu yako atakapokuja kumtafuta
  rationale: דרש hapa ni kutafuta au kufuatilia mali iliyopotea; “atakapokuja kumtafuta” huwasilisha kitendo cha mwenye mali kuja kuidai bila kuifanya tafsiri kuwa ya kiufundi kupita kiasi.
- source_word: וַהֲשֵׁבֹתוֹ לוֹ
  choice: ndipo utamrudishia
  rationale: Hifili ya שוב ina maana ya kusababisha arudi, yaani kumrudisha mnyama kwa mwenyewe. Muundo huu ni mfupi na wa kawaida katika Kiswahili.
