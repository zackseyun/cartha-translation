  text: כִּ֤י תִבְנֶה֙ בַּ֣יִת חָדָ֔שׁ וְ/עָשִׂ֥יתָ מַעֲקֶ֖ה לְ/גַגֶּ֑/ךָ וְ/לֹֽא תָשִׂ֤ים דָּמִים֙ בְּ/בֵיתֶ֔/ךָ כִּֽי יִפֹּ֥ל הַ/נֹּפֵ֖ל מִמֶּֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/008.yaml
  text: When you build a new house[a], you shall make a parapet for your roof, so that you do not bring bloodguilt on your house if someone falls from it.
translation:
  language: sw
  text: Utakapojenga nyumba mpya, ni lazima ujenge ukuta wa kinga[a] kandokando ya paa lako, ili usiiletee nyumba yako hatia ya damu ikiwa mtu ataanguka kutoka juu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukingo wa kinga” au “kizuizi cha kinga.” Neno la Kiebrania linamaanisha kizuizi kilichojengwa kandokando ya paa tambarare.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Utakapojenga
  rationale: Katika sheria hii, כִּי inaanzisha hali inayoweza kutokea, si sababu. Muundo wa ‘utakapo-’ unaeleza kwa kawaida hali hiyo katika Kiswahili.
- source_word: תִבְנֶה בַּיִת חָדָשׁ
  choice: utakapojenga nyumba mpya
  rationale: Hii inawasilisha kwa uwazi kitendo, kitu kinachojengwa, na sifa yake.
- source_word: וְעָשִׂיתָ
  choice: ni lazima ujenge
  rationale: Katika muktadha wa kisheria, umbo hili lina nguvu ya agizo. ‘Ni lazima’ linaonyesha wajibu huo kwa Kiswahili cha sasa.
- source_word: מַעֲקֶה
  choice: ukuta wa kinga
  rationale: Neno hili linamaanisha kizuizi cha kujikinga kandokando ya paa tambarare. ‘Ukuta wa kinga’ linaeleweka kwa urahisi na linabaki karibu na aina ya muundo unaokusudiwa.
- source_word: לְגַגֶּךָ
  choice: kandokando ya paa lako
  rationale: Kizuizi hicho hujengwa kwenye kingo za paa; ‘kandokando ya’ hufanya mahali na kazi yake kuwa wazi katika Kiswahili.
- source_word: וְלֹא תָשִׂים דָּמִים בְּבֵיתֶךָ
  choice: ili usiiletee nyumba yako hatia ya damu
  rationale: Nahau ya Kiebrania ‘kuweka damu’ inaonyesha kuwajibika kisheria na kimaadili kwa kifo kinachoweza kuzuilika. ‘Hatia ya damu’ inahifadhi picha na uzito wake.
- source_word: כִּי יִפֹּל הַנֹּפֵל
  choice: ikiwa mtu ataanguka
  rationale: Usemi wa Kiebrania unamtaja kwa jumla mtu anayeweza kuanguka. Tafsiri hii inaepuka marudio yasiyo ya kawaida huku ikihifadhi hali ya uwezekano.
- source_word: מִמֶּנּוּ
  choice: kutoka juu yake
  rationale: Kiwakilishi kinaelekea kurejelea paa au jengo lililotajwa. ‘Kutoka juu yake’ kinaonyesha kuanguka kutoka kwenye paa bila kuongeza habari isiyokuwamo.
theological_decisions:
- issue: Maana ya דָּמִים katika sheria hii
  choice: hatia ya damu
  alternative: hatia ya kumwaga damu; kuwajibika kwa kifo
  rationale: Aya inahusu wajibu wa kisheria na kimaadili kwa kifo ambacho kingeweza kuzuilika, si damu ya kimwili tu. ‘Hatia ya damu’ huhifadhi uzito wa nahau bila kuingiza fundisho la dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa kisheria umewekwa wazi kwa ‘ni lazima,’ huku nahau ‘hatia ya damu’ ikihifadhi uzito wa kimaadili na kisheria wa maandishi ya Kiebrania.
