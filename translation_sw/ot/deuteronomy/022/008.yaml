  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo wa sheria wa Kiebrania: hali ya wakati ujao (‘Utakapojenga’), wajibu wa kujenga kizuizi cha paa, kusudi la kuepuka hatia ya damu, na tukio la mtu kuanguka kutoka juu yake. ‘Kutoka juu yake’ kwa uhalali huweka wazi marejeo ya paa/jengo bila kulazimisha utambulisho wa kiwakilishi cha Kiebrania zaidi ya inavyohitajika.'
