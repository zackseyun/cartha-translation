source:
  edition: WLC
  text: לֹא יִהְיֶ֤ה כְלִי גֶ֨בֶר֙ עַל אִשָּׁ֔ה וְ/לֹא יִלְבַּ֥שׁ גֶּ֖בֶר שִׂמְלַ֣ת אִשָּׁ֑ה כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל עֹ֥שֵׂה אֵֽלֶּה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/005.yaml
  text: A woman shall not wear a man's article[a], and a man shall not put on a woman's garment, for everyone who does these things is an abomination to Yahweh your God.
translation:
  language: sw
  text: Mwanamke asivae kitu cha mwanamume[a], wala mwanamume asivae vazi la mwanamke, kwa maana kila mtu anayefanya mambo haya ni chukizo kwa Yahwe, Mungu wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vazi la mwanamume.” Neno la Kiebrania katika sehemu ya kwanza ni pana zaidi kuliko neno mahususi la “vazi” lililotumiwa katika sehemu ya pili.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי גֶבֶר
  choice: kifaa cha mwanamume
  rationale: כְלִי ni neno pana linaloweza kumaanisha kitu, kifaa, chombo, au vifaa vya matumizi. “Kifaa” kinahifadhi upana huo na hakifuti tofauti kati yake na שִׂמְלָה, ambalo linamaanisha vazi kwa wazi zaidi.
- source_word: עַל אִשָּׁה
  choice: mwanamke asivae
  rationale: Kauli ya Kiebrania ya kitu kuwa “juu ya” mtu, katika muktadha huu, inaeleweka kwa kawaida kuwa kitu kilichovaliwa au kuwekwa mwilini. “Asivae” ni usemi wa kawaida wa Kiswahili unaowasilisha maana hiyo.
- source_word: יִלְבַּשׁ
  choice: asivae
  rationale: Kitenzi hiki humaanisha kuvaa au kujivika. “Asivae” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: שִׂמְלַת אִשָּׁה
  choice: vazi la mwanamke
  rationale: שִׂמְלָה humaanisha vazi au nguo, mara nyingi vazi la nje. “Vazi” ni neno la heshima na mahususi bila kulibana kuwa aina fulani ya nguo.
- source_word: גֶּבֶר
  choice: mwanamume
  rationale: Neno hili humaanisha mwanamume na hapa linalinganishwa moja kwa moja na mwanamke; tafsiri inadumisha utofautishaji huo.
- source_word: אִשָּׁה
  choice: mwanamke
  rationale: Katika muktadha huu neno linamtaja mwanamke kwa kumtofautisha na mwanamume; “mwanamke” ndilo neno la kawaida na sahihi.
- source_word: תוֹעֲבַת יְהוָה
  choice: ni chukizo kwa Yahwe
  rationale: תוֹעֵבָה ni neno lenye uzito linaloonyesha jambo linalochukiza sana mbele za Mungu. “Chukizo” huhifadhi uzito huo, na jina la agano יְהוָה limetolewa kama “Yahwe.”
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: kila mtu anayefanya mambo haya
  rationale: Muundo wa kishirikishi pamoja na כָּל una maana ya jumla inayomhusu yeyote atendaye hayo. Usemi huu ni wazi na wa kawaida katika Kiswahili cha sasa.
theological_decisions:
- issue: Upeo wa katazo la kwanza (כְלִי גֶבֶר)
  choice: Kutafsiri kwa upana kuwa “kifaa cha mwanamume,” badala ya kukibana kuwa “vazi la mwanamume.”
  alternative: Mwanamke asivae vazi la mwanamume; au mwanamke asiwe na silaha/vifaa vya mwanamume mwilini.
  rationale: Kifungu cha kwanza kinatumia nomino pana כְלִי, huku cha pili kikitumia neno mahususi la vazi, שִׂמְלָה. Tafsiri inadumisha tofauti hiyo na kuacha wazi kama katazo la kwanza linahusu mavazi pekee au pia vifaa vingine vinavyohusishwa na mwanamume.
- issue: Lugha inayobainisha jinsia
  choice: Kutumia “mwanamke” na “mwanamume.”
  alternative: Mtu; yeyote.
  rationale: Kiebrania kinatofautisha wazi mwanamke na mwanamume. Tafsiri hailainishi wala kuondoa utofautishaji huo.
- issue: Nguvu ya kauli תוֹעֲבַת יְהוָה
  choice: “ni chukizo kwa Yahwe”
  alternative: Ni jambo linalomchukiza Yahwe; ni karaha kwa Yahwe.
  rationale: “Chukizo” linahifadhi uzito wa hukumu ya kimaadili na kiagano bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. “Kifaa” kinahifadhi tofauti ya kileksika ya Kiebrania ingawa ni mpana kuliko “vazi”; tanbihi inaonyesha tafsiri mbadala ya kimuktadha.
