base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/007.yaml
  text: You must surely let the mother go[a], but you may take the young for yourself[c][b], so that it may go well for you and you may prolong your days.
translation:
  language: sw
  text: Lazima umwache mama aende[a], lakini unaweza kuwachukua watoto kwa ajili yako[b], ili mambo yakuendee mema na uishi siku nyingi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri ya karibu zaidi, “hakika umwache mama aende.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “wana”; katika muktadha wa kiota cha ndege, maana yake ni watoto wake.'
    reason: lexical_alternative
  - marker: c
    text: Au kwa tafsiri ya karibu zaidi, “na urefushe siku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁלֵּחַ תְּשַׁלַּח
  choice: Ni lazima umwache ... aende
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi kilichokamilishwa unasisitiza amri. Kiswahili hiki kinatoa msisitizo huo kwa lugha ya kawaida na yenye hadhi.
- source_word: הָאֵם
  choice: mama
  rationale: Muktadha wa mstari uliotangulia unaonyesha kwamba ni ndege; kwa hiyo “mama” hufuata Kiebrania kwa karibu bila kuongeza neno lisilohitajika katika matini kuu.
- source_word: הַבָּנִים
  choice: makinda
  rationale: Neno hilo kwa kawaida humaanisha “wana,” lakini katika muktadha wa kiota linamaanisha watoto wa ndege. “Makinda” ni Kiswahili cha kawaida katika muktadha huu, huku tanbihi ikihifadhi maana halisi ya neno la Kiebrania.
- source_word: תִּקַּח לָךְ
  choice: unaweza kujichukulia
  rationale: Baada ya amri ya kumwachilia mama, kitenzi hiki kinaeleweka kama ruhusa. “Kujichukulia” pia huhifadhi wazo la לָךְ, “kwa ajili yako mwenyewe.”
- source_word: לְמַעַן יִיטַב לָךְ
  choice: ili mambo yakuendee mema
  rationale: Hii ni kauli ya kusudi au matokeo inayohusishwa na baraka ya agano. Usemi huu ni wa asili katika Kiswahili na huhifadhi maana bila kuifanya ahadi ya kimakanika.
- source_word: וְהַאֲרַכְתָּ יָמִים
  choice: na uishi siku nyingi
  rationale: Kihalisi ni “na urefushe siku.” Kiswahili “uishi siku nyingi” huwasilisha kwa kawaida maana ya nahau hiyo huku kikidumisha uhusiano wa kusudi au matokeo.
theological_decisions:
- issue: Asili ya matokeo yaliyoahidiwa
  choice: 'Kutafsiri kama baraka au matokeo yanayohusishwa na utii: “ili mambo yakuendee mema na uishi siku nyingi.”'
  alternative: Kuifanya iwe ahadi isiyo na masharti kwamba kila mtu mtiifu ataishi muda mrefu.
  rationale: Muundo wa Kiebrania unaeleza kusudi au matokeo ya baraka, lakini hautakiwi kupanuliwa katika tafsiri kuwa hakikisho la kimakanika kwa kila mtu katika kila hali.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Tafsiri imetumia ulinganifu bora: inahifadhi msisitizo wa amri, ruhusa ya kuchukua makinda, na usemi wa baraka kwa lugha ya asili. Alama zote za tanbihi zilizotolewa zinaonekana katika matini kuu.'
