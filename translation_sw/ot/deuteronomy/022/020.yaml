  text: But if this matter is true[a], and evidence of virginity was not found for the young woman,
translation:
  language: sw
  text: Lakini ikiwa jambo hili ni kweli, na ushahidi wa ubikira haukupatikana kwa msichana huyo,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dalili za ubikira hazikupatikana kwa msichana huyo.” Neno la Kiebrania בְּתוּלִים linaweza kumaanisha “ubikira” au dalili/ushahidi wa ubikira, katika muktadha wa desturi ya kale ya kisheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Muunganiko huu unaanzisha hali inayotofautiana na kesi iliyotangulia; “Lakini ikiwa” ni ya kawaida na hudumisha mtiririko huo.
- source_word: אֱמֶת הָיָה
  choice: ni kweli
  rationale: Ingawa kitenzi cha Kiebrania kiko katika umbo la wakati uliopita, katika sharti la kisheria Kiswahili cha sasa ni cha kawaida na hakibadili maana ya msingi.
- source_word: הַדָּבָר הַזֶּה
  choice: jambo hili
  rationale: “Jambo” hudumisha upana wa דָּבָר huku likifaa muktadha wa shauri bila kulifanya moja kwa moja kuwa “shtaka.”
- source_word: לֹא נִמְצְאוּ בְתוּלִים
  choice: ushahidi wa ubikira ... haukupatikana
  rationale: בְּתוּלִים ni umbo la wingi lakini hapa humaanisha ubikira au dalili zake katika desturi ya kisheria; “ushahidi wa ubikira” ni wazi kwa msomaji wa sasa.
- source_word: לַנַּעֲרָ
  choice: wa yule mwanamke kijana
  rationale: נַעֲרָה humaanisha mwanamke wa umri mdogo, katika muktadha huu mwenye umri wa kuolewa. Muundo wa “wa” unaunganisha ushahidi na mhusika kwa Kiswahili cha kawaida.
