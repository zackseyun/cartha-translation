source:
  edition: WLC
  text: וְ/עָנְשׁ֨וּ אֹת֜/וֹ מֵ֣אָה כֶ֗סֶף וְ/נָתְנוּ֙ לַ/אֲבִ֣י הַֽ/נַּעֲרָ֔ה כִּ֤י הוֹצִיא֙ שֵׁ֣ם רָ֔ע עַ֖ל בְּתוּלַ֣ת יִשְׂרָאֵ֑ל וְ/לֽ/וֹ תִהְיֶ֣ה לְ/אִשָּׁ֔ה לֹא יוּכַ֥ל לְ/שַּׁלְּחָ֖/הּ כָּל יָמָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/019.yaml
  text: Then they shall fine him one hundred shekels of silver and give them to the father of the young woman[a], because he has brought a bad name upon a virgin of Israel. And she shall be his wife; he may not send her away all his days.
translation:
  language: sw
  text: Nao watamtoza faini ya shekeli mia moja za fedha, nao watampa baba wa huyo msichana fedha hizo, kwa sababu amemletea bikira wa Israeli jina baya. Naye atakuwa mke wake; hataruhusiwa kamwe kumwacha maishani mwake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumtaliki.” Kiebrania kinasema kihalisi, “kumtuma aende,” usemi unaoweza kumaanisha talaka katika muktadha wa sheria za ndoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנְשׁוּ
  choice: watamtoza faini
  rationale: Katika muktadha huu wa kisheria, kitenzi hiki kinamaanisha kumwekea adhabu ya fedha, si kumwadhibu kwa maana ya jumla.
- source_word: מֵאָה כֶסֶף
  choice: shekeli mia moja za fedha
  rationale: Kiebrania kinasema kihalisi ‘mia moja za fedha’; ‘shekeli’ linawekwa wazi kama kipimo cha uzito na thamani kinachokusudiwa katika sheria hii.
- source_word: לַאֲבִי הַנַּעֲרָה
  choice: baba wa huyo msichana
  rationale: נַעֲרָה humaanisha msichana au mwanamke kijana wa umri wa kuolewa; ‘msichana’ ni lugha ya kawaida na yenye kueleweka katika Kiswahili cha sasa.
- source_word: כִּי הוֹצִיא שֵׁם רָע
  choice: kwa sababu amemchafua jina
  rationale: Hii inadumisha picha ya Kiebrania ya kuleta jina baya, huku ikitumia nahau ya kawaida ya Kiswahili kuhusu kuharibu sifa ya mtu.
- source_word: עַל בְּתוּלַת יִשְׂרָאֵל
  choice: bikira wa Israeli
  rationale: ‘Bikira’ inafaa katika muktadha wa shtaka linalohusu ubikira, na ‘wa Israeli’ inadumisha uhusiano wake na jumuiya ya agano.
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: Naye atakuwa mke wake
  rationale: Tafsiri hii inaeleza moja kwa moja hali ya ndoa inayowekwa na sheria bila kuongeza kwamba lazima ndoa ianze upya au kwamba kifungu hiki pekee ndicho kinachoeleza kuendelea kwake.
- source_word: לֹא יוּכַל
  choice: hataruhusiwa
  rationale: Katika sheria, maneno haya yanaonyesha kukosa ruhusa au haki ya kisheria, si kushindwa kimwili.
- source_word: לְשַׁלְּחָהּ
  choice: kumwacha
  rationale: Kitenzi cha Kiebrania kinamaanisha kihalisi ‘kumwondosha/kumtuma aende’ na katika muktadha wa ndoa kinaweza kumaanisha talaka. ‘Kumwacha’ ni nahau ya asili ya Kiswahili inayodumisha kiasi fulani cha upana huo.
- source_word: כָּל יָמָיו
  choice: maisha yake yote
  rationale: Hii ni tafsiri ya asili ya nahau ya Kiebrania ‘siku zake zote’ na inaonyesha wazi muda wa maisha yake uliobaki.
theological_decisions:
- issue: Nahau ya kisheria kuhusu kuvunjwa kwa ndoa
  choice: kumwacha
  alternative: kumtaliki
  rationale: Maandishi makuu yanadumisha usemi mpana wa chanzo kwa Kiswahili cha kawaida, huku tanbihi ikitaja maana mahsusi ya kisheria inayowezekana katika muktadha huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisheria ulio wazi na wenye heshima. ‘Faini’ ni neno la kawaida la kisheria; ‘fedha hizo’ linaweka wazi kwamba kiasi kilichotozwa ndicho kinachopelekwa kwa baba.
