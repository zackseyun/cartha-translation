base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/029.yaml
  text: Then the man who lay with her shall give fifty shekels of silver to the young woman's father[a], and she shall become his wife because he has violated her[b]. He may not send her away all his days.
translation:
  language: sw
  text: Ndipo mwanamume aliyelala na msichana huyo atampa baba wa msichana huyo shekeli hamsini za fedha. Msichana huyo atakuwa mke wa mwanamume huyo, kwa sababu amemdhalilisha[a]. Hataweza kumwacha[b] maisha yake yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amemnyenyekeza.” Kitenzi cha Kiebrania kinaweza kutafsiriwa kwa namna hiyo kihalisi zaidi; katika muktadha huu kinahusu udhalilishaji unaohusiana na tendo la ngono.
    reason: lexical_alternative
  - marker: b
    text: “Kumwacha” hapa kunamaanisha kumfukuza au kumtaliki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: Ndipo ... atampa
  rationale: Katika sheria hii, waw pamoja na kitenzi huendeleza hatua inayofuata ya agizo. “Ndipo” huonyesha mfuatano huo kwa Kiswahili cha kawaida, na “atampa” hubeba nguvu ya sharti katika muktadha.
- source_word: הָאִישׁ הַשֹּׁכֵב עִמָּהּ
  choice: mwanamume aliyelala naye
  rationale: Hili ni fungu linalomtambulisha mwanamume kwa tendo la ngono. “Kulala naye” ni usemi wenye staha unaoeleweka katika muktadha bila kutumia lugha ya mtaani.
- source_word: לַאֲבִי הַנַּעֲרָ
  choice: baba wa huyo mwanamke kijana
  rationale: נַעֲרָה humaanisha msichana au mwanamke kijana wa umri wa kuolewa. “Mwanamke kijana” huepuka kumwonyesha kana kwamba ni mtoto huku ikihifadhi taarifa ya umri na hadhi.
- source_word: חֲמִשִּׁים כָּסֶף
  choice: shekeli hamsini za fedha
  rationale: Kiebrania husema kihalisi “fedha hamsini,” lakini katika muktadha huu kiasi hicho ni vipimo vya uzito vinavyoitwa shekeli.
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: Naye atakuwa mke wake
  rationale: Fungu hili linaeleza hadhi ya ndoa itakayotokea, bila kuongeza wazo la umiliki lisilohitajika.
- source_word: תַּחַת אֲשֶׁר
  choice: kwa sababu
  rationale: Katika kanuni hii ya kisheria, fungu hilo linataja msingi wa hukumu. “Kwa sababu” ni sawa ya kawaida na iliyo wazi.
- source_word: עִנָּהּ
  choice: amemdhulumu
  rationale: Katika muktadha wa tendo la ngono, kitenzi hiki huonyesha kumtendea mwanamke kwa namna ya kumdhalilisha au kumdhuru. “Amemdhulumu” huonyesha uzito wa kosa bila kulifanya neno hili liwe na umahususi zaidi kuliko Kiebrania chenyewe.
- source_word: לֹא יוּכַל שַׁלְּחָהּ
  choice: hataruhusiwa kumwacha
  rationale: Kihalisi ni kutoweza “kumwondoa” au “kumpeleka zake”; katika muktadha wa ndoa, maana yake ni kutokuwa na ruhusa ya kumtaliki au kumfukuza. “Kumwacha” ni lugha ya kawaida, huku tanbihi ikifafanua maana ya kisheria.
- source_word: כָּל יָמָיו
  choice: maisha yake yote
  rationale: Huu ni usemi wa Kiebrania unaomaanisha muda wote wa maisha. Kiswahili “maisha yake yote” hutoa maana hiyo kwa kawaida.
theological_decisions:
- issue: Kutafsiri עִנָּהּ bila kupunguza uzito wa dhuluma wala kuingiza umahususi usiotajwa na kitenzi hiki chenyewe
  choice: amemdhulumu
  alternative: amemdhalilisha; amemnyenyekeza; amembaka
  rationale: Mstari huu unatumia ענה, kitenzi kinachoweza kumaanisha kudhalilisha, kunyenyekeza au kutesa, katika muktadha wa ngono. “Amemdhulumu” huhifadhi uzito wa kosa na upana fulani wa neno. “Amembaka” linaweza kutetewa kwa kuzingatia kifungu kinachozunguka mstari huu, lakini linaamua wazi zaidi ya kitenzi cha mstari huu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sheria ulio wazi, wa sasa na wenye staha. Usemi “aliyelala naye” huhifadhi lugha yenye kiasi ya chanzo, huku “amemdhulumu” ikiepuka kufifisha uzito wa kosa au kuamua bila lazima mjadala kuhusu umahususi wa tendo.
