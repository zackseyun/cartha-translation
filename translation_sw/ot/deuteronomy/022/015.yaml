translation:
  language: sw
  text: Ndipo baba yake msichana huyo na mama yake watachukua na kuwasilisha ushahidi wa ubikira wake mbele ya wazee wa mji langoni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno, “ubikira wa msichana huyo,” katika umbo la wingi; hii ni nahau inayomaanisha alama au uthibitisho unaowasilishwa kama ushahidi wa ubikira.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: watachukua
  rationale: Katika mfuatano huu wa sheria, kitenzi kina nguvu ya agizo au hatua inayotakiwa kufanywa; wakati ujao wa Kiswahili unaonyesha utaratibu huo kwa kawaida.
- source_word: אֲבִי הַנַּעַר וְאִמָּהּ
  choice: baba na mama ya yule mwanamke kijana
  rationale: נַעֲרָה humaanisha mwanamke kijana wa umri wa kuolewa. Usemi huu huepuka kumweleza kama mtoto na unabaki wa kawaida katika Kiswahili cha sasa.
- source_word: וְהוֹצִיאוּ
  choice: kuuleta
  rationale: Hifili ya יצא hapa inamaanisha kutoa au kuwasilisha kitu mbele ya wenye mamlaka; “kuuleta” ni ya kawaida na inaonyesha kuufikisha ushahidi kwa wazee.
- source_word: אֶת בְּתוּלֵי הַנַּעַר
  choice: ushahidi wa ubikira wake
  rationale: Kwa neno ni “ubikira wa mwanamke kijana” katika wingi, lakini katika kesi hii ni nahau inayotaja alama au uthibitisho unaowasilishwa kama ushahidi wa ubikira.
- source_word: אֶל זִקְנֵי הָעִיר
  choice: kwa wazee wa mji
  rationale: אֶל inaonyesha kuelekea kwa baraza la wazee; “kwa wazee wa mji” ni usemi wa kawaida unaohifadhi mwelekeo huo.
- source_word: הַשַּׁעְרָה
  choice: langoni
  rationale: Lango la mji lilikuwa mahali pa wazee kusikiliza mashauri. “Langoni” huonyesha kwa ufupi mahali ambapo ushahidi unawasilishwa.
