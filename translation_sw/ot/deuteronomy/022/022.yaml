base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/022.yaml
  text: If a man is found lying with a woman married to a husband[a], then both of them shall die—the man who lay with the woman, and the woman[b]. So you shall purge the evil from Israel.
translation:
  language: sw
  text: Ikiwa mwanamume akikutwa amelala na mwanamke aliyeolewa[a], wote wawili watakufa—mwanamume aliyelala na mwanamke huyo, na mwanamke huyo[b]. Hivyo utauondoa uovu kutoka Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata maneno ya Kiebrania kwa karibu zaidi, “mwanamke mwenye mume.”
    reason: lexical_alternative
  - marker: b
    text: Neno “watakufa” hapa linaweka adhabu ya kifo iliyoamriwa na sheria; tafsiri nyingine husema wazi, “watauawa.”
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא
  choice: atakutwa
  rationale: Nifali ya מצא inaonyesha kugunduliwa; “atakutwa” ni ya kawaida katika masharti ya kisheria na haiwalazimishi wasomaji kuelewa kwamba lazima walikamatwa wakati wa tendo lenyewe.
- source_word: שֹׁכֵב עִם
  choice: amelala na
  rationale: Hii ni nahau ya kujamiiana. “Amelala na” inadumisha taswira ya Kiebrania na pia inaeleweka kwa kawaida katika Kiswahili bila maelezo marefu.
- source_word: בְעֻלַת בַּעַל
  choice: mwanamke aliyeolewa
  rationale: Hii inatoa hali yake ya ndoa kwa Kiswahili sanifu na cha kawaida. Tanbihi inadumisha umbo la karibu zaidi na Kiebrania, linalotaja kuwa ana mume.
- source_word: וּמֵתוּ גַּם שְׁנֵיהֶם
  choice: wote wawili watakufa
  rationale: Katika muktadha huu wa sheria, maneno haya yanaweka adhabu ya kifo. “Watakufa” yanabaki karibu na kitenzi cha Kiebrania bila kuongeza moja kwa moja kauli tendwa ya kuuawa.
- source_word: הָאִישׁ הַשֹּׁכֵב עִם הָאִשָּׁה
  choice: mwanamume aliyelala na huyo mwanamke
  rationale: Kishazi cha uhusiano ni cha asili katika Kiswahili na kinabaki wazi kuhusu mwanamume anayehusika.
- source_word: וְהָאִשָּׁה
  choice: na huyo mwanamke pia
  rationale: Marudio ya Kiebrania yanahifadhiwa kwa uwazi wa kisheria; “pia” linaonyesha kwa kawaida kwamba hukumu hiyo inawahusu wote wawili.
- source_word: וּבִעַרְתָּ
  choice: Hivyo utauondoa
  rationale: Katika fomula za sheria za Kumbukumbu la Torati, בער humaanisha kuondoa kabisa uovu katika jumuiya. “Utauondoa” ni Kiswahili cha kawaida, chenye nguvu inayofaa bila kutumia tamathali isiyo wazi ya kuchoma.
- source_word: הָרָע
  choice: uovu
  rationale: Nomino hii ya dhahania ina maana ya kile kilicho kiovu; “uovu” inadumisha uzito wake wa kimaadili na kisheria.
- source_word: מִיִּשְׂרָאֵל
  choice: kutoka Israeli
  rationale: Kihusishi מִן kinaonyesha kuondolewa kutoka kwa jumuiya ya Israeli; tafsiri hii inahifadhi mwelekeo huo wazi.
theological_decisions:
- issue: Jinsi ya kutafsiri hali ya ndoa katika בְעֻלַת בַּעַל
  choice: mwanamke aliyeolewa
  alternative: mwanamke mwenye mume
  rationale: Tafsiri kuu ni ya kawaida na yenye heshima katika Kiswahili, huku tanbihi ikionyesha umbo la karibu zaidi na Kiebrania bila kuingiza dhana ya umiliki wa mwanamke.
- issue: Iwapo adhabu ya kimahakama ielezwe wazi kuwa kuuawa
  choice: watakufa
  alternative: watauawa
  rationale: Muktadha wa sheria unaonyesha adhabu ya kifo, lakini Kiebrania chenyewe kinasema “watakufa.” Tafsiri kuu inadumisha umbo hilo, na tanbihi inaeleza nguvu yake ya kisheria.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kisheria ulio wazi, wa sasa na wenye heshima. Nahau “amelala na” inadumisha taswira ya chanzo huku ikieleweka kama kujamiiana. Marudio ya wahusika yamehifadhiwa kwa sababu ya uwazi na msisitizo wa sheria.
