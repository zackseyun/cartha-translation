base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/024.yaml
  text: 'then you shall bring both of them out to the gate of that city[a], and you shall stone them with stones, and they shall die: the young woman because she did not cry out in the city, and the man because he violated his neighbor’s wife[c][b]. So you shall purge the evil from your midst.'
translation:
  language: sw
  text: 'ndipo mtawatoa wote wawili mpaka lango la mji ule[a], na mtawapiga kwa mawe, nao watakufa: mwanamke huyo mchanga[b], kwa sababu hakupiga kelele mjini; na yule mwanamume, kwa sababu alimfanyia jeuri[c] mke wa jirani yake. Hivyo utaondoa uovu katikati yako.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lango la mji lilikuwa mahali pa kawaida pa shughuli za hadhara za kisheria na utoaji wa hukumu.
    reason: cultural_note
  - marker: b
    text: Au, “msichana huyo.” Neno la Kiebrania hapa limeandikwa bila herufi ya mwisho inayofanya umbo la kike liwe wazi zaidi, lakini kitenzi kinachofuata, “hakupiga kelele,” kiko katika umbo la kike.
    reason: lexical_alternative
  - marker: c
    text: Au, “alimdhalilisha” au “alimtesa.” Katika muktadha huu kitenzi cha Kiebrania kinaweza kueleza dhuluma ya kingono inayoambatana na fedheha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתֶם אֶת שְׁנֵיהֶם
  choice: mtawatoa wote wawili
  rationale: Hifili ya יצא ina maana ya kuwatoa au kuwapeleka nje, na שְׁנֵיהֶם inawataja wahusika wote wawili kwa uwazi.
- source_word: שַׁעַר הָעִיר הַהִוא
  choice: lango la mji ule
  rationale: Huhifadhi muundo wa Kiebrania na mahali pa hukumu ya hadhara bila kuongeza ufafanuzi katika matini kuu.
- source_word: וּסְקַלְתֶּם אֹתָם בָּאֲבָנִים
  choice: mtawapiga kwa mawe
  rationale: Ni Kiswahili cha kawaida na chenye heshima kinachohifadhi kutajwa wazi kwa mawe katika chanzo.
- source_word: וָמֵתוּ
  choice: nao watakufa
  rationale: Hufuata mfuatano wa Kiebrania na kuonyesha matokeo ya kupigwa kwa mawe bila kuyageuza waziwazi kuwa kusudi.
- source_word: הנער
  choice: yule mwanamke kijana
  rationale: Ingawa umbo la konsonanti halina he ya mwisho ya tahajia kamili ya kike, kitenzi צָעֲקָה ni cha kike. ‘Mwanamke kijana’ ni wazi na hakifungi umri wake kwa neno ‘msichana.’
- source_word: עַל דְּבַר אֲשֶׁר לֹא צָעֲקָה בָעִיר
  choice: kwa sababu hakupiga kelele mjini
  rationale: ‘Kwa sababu’ huwasilisha msingi wa hukumu uliotajwa na עַל דְּבַר, huku ‘hakupiga kelele’ ikihifadhi tendo la צעק.
- source_word: עִנָּה
  choice: alimdhulumu
  rationale: Katika muktadha huu wa sheria ya ngono, kitenzi kinaeleza kumtendea mtu vibaya kwa namna inayomdhalilisha. ‘Alimdhulumu’ huhifadhi uzito wake bila kulazimisha istilahi moja ya kisasa ya kisheria.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: mke wa jirani yake
  rationale: Tafsiri ya kawaida na sahihi ya mnyororo wa uhusiano wa Kiebrania.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Hivyo utaondoa uovu katikati yako
  rationale: Huwasilisha fomula ya kisheria inayojirudia katika Kumbukumbu la Torati kwa Kiswahili cha sasa, huku ikihifadhi ‘uovu’ na ‘katikati yako.’
theological_decisions:
- issue: Sababu iliyotajwa katika matini kwa hukumu ya mwanamke
  choice: kwa sababu hakupiga kelele mjini
  alternative: kwa sababu hakuomba msaada mjini
  rationale: Tafsiri huhifadhi sababu ambayo aya yenyewe inaitaja bila kuongeza hitimisho pana kuhusu ridhaa au hali nyingine ambazo aya hii haizielezi.
- issue: Maana ya עִנָּה katika sheria inayohusu ngono
  choice: alimdhulumu
  alternative: alimdhalilisha; alimfanyia ukatili wa kingono
  rationale: ‘Alimdhulumu’ huhifadhi wazo la kutendewa vibaya na kudhalilishwa katika muktadha wa kingono. Mbadala ulio wazi zaidi unaweza kupunguza upana wa kitenzi, ilhali ‘alimdhalilisha’ pekee huenda ukapunguza uzito wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Wingi katika amri za kwanza na umoja katika fomula ya mwisho umehifadhiwa kwa kufuata mabadiliko ya nafsi katika Kiebrania. Alama za tanbihi zimewekwa karibu na maneno wanayofafanua.
