lexical_decisions:
- source_word: לֹא תִלְבַּשׁ
  choice: Usivae
  rationale: Kikanushi pamoja na kitenzi cha nafsi ya pili ya kiume umoja katika sheria huwasilisha katazo la moja kwa moja; Kiswahili hutumia umbo la kukanusha la amri kwa njia ya kawaida na wazi.
- source_word: שַׁעַטְנֵז
  choice: nguo iliyotengenezwa kwa sufu na kitani pamoja
  rationale: Neno hili adimu hutaja mchanganyiko uliokatazwa, ambao kirai kinachofuata kinafafanua kuwa ni sufu na kitani pamoja. Kutafsiri maana yake ni wazi zaidi kuliko kunukuu sauti ya neno la Kiebrania.
- source_word: צֶמֶר
  choice: sufu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa nyuzi au kitambaa cha manyoya katika muktadha wa mavazi.
- source_word: וּפִשְׁתִּים
  choice: na kitani
  rationale: Ingawa nomino ya Kiebrania inaweza kutaja mmea wa lin, katika muktadha wa nguo inarejelea kitani kinachotokana nao.
- source_word: יַחְדָּו
  choice: pamoja
  rationale: Kielezi hiki kinaonyesha kuwa sufu na kitani zimeunganishwa katika nguo moja.
