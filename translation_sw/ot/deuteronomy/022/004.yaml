  text: You shall not see your brother’s donkey or his ox fallen on the road and ignore them[a]; you must surely lift them up with him.
translation:
  language: sw
  text: Usiwaone punda wa ndugu yako au ng’ombe wake wameanguka njiani, wala usiwapuuze; ni lazima uwainue pamoja naye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno “pamoja naye” yanasisitiza kwamba mtu anapaswa kushirikiana na mwenye mnyama kuwainua, wala si kumwacha bila msaada.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיךָ
  choice: ndugu yako
  rationale: Huhifadhi maana halisi ya ‘ndugu yako’ na pia nguvu yake ya kifamilia na kijamii katika sheria ya agano, bila kuibana kuwa undugu wa damu pekee.
- source_word: חֲמוֹר
  choice: punda
  rationale: Hili ndilo neno la kawaida na la sasa la Kiswahili kwa mnyama huyu.
- source_word: שׁוֹרוֹ
  choice: ng’ombe wake
  rationale: שׁוֹר humaanisha mnyama wa jamii ya ng’ombe, mara nyingi wa kazi. ‘Ng’ombe’ ni tafsiri ya kawaida na inayoeleweka kwa urahisi katika Kiswahili.
- source_word: נֹפְלִים
  choice: wakiwa wameanguka
  rationale: Hueleza hali ya wanyama baada ya kuanguka, labda kwa sababu ya mzigo au uchovu, bila kuongeza sababu ambayo haikutajwa.
- source_word: בַּדֶּרֶךְ
  choice: njiani
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha mahali tukio linapotokea.
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  choice: halafu ukawapuuza
  rationale: Kitenzi hiki katika muktadha huu kinamaanisha kupuuza kwa makusudi au kujifanya hujaona. Kiwakilishi cha wingi kinarejelea wanyama waliotajwa.
- source_word: הָקֵם תָּקִים
  choice: ni lazima uwainue
  rationale: Muundo wa Kiebrania wa kitenzi-jina pamoja na kitenzi kilichonyambuliwa unasisitiza wajibu wa amri. ‘Ni lazima’ huwasilisha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: עִמּוֹ
  choice: pamoja naye
  rationale: Huhifadhi wazi wazo la Kiebrania kwamba msaada huo unatolewa kwa kushirikiana na mwenye mnyama.
