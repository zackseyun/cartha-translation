base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/006.yaml
  text: If a bird’s nest happens to be before you on the way[a], in any tree or on the ground, with young ones or eggs, and the mother is sitting on the young ones or on the eggs[b], you shall not take the mother along with the young.
translation:
  language: sw
  text: Ikiwa utakutana njiani na kiota cha ndege[a], katika mti wowote au ardhini, chenye makinda au mayai, na mama amekalia makinda au mayai, usimchukue mama pamoja na makinda au mayai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ikiwa kiota cha ndege kitajitokeza mbele yako njiani.” Kitenzi cha Kiebrania hudokeza kukipata kwa bahati badala ya kukitafuta kwa makusudi.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mama juu ya watoto.” Katika muktadha huu usemi huo unamaanisha kumchukua mama pamoja na watoto wake, yaani makinda au mayai.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִקָּרֵא
  choice: Ikiwa utakutana
  rationale: Hutambulisha sharti la kisheria na kudokeza kukutana na kiota kwa bahati, si kukitafuta kwa makusudi.
- source_word: קַן צִפּוֹר
  choice: kiota cha ndege
  rationale: Ni Kiswahili cha kawaida na cha moja kwa moja kwa muundo huu wa Kiebrania.
- source_word: לְפָנֶיךָ בַּדֶּרֶךְ
  choice: njiani
  rationale: Katika muktadha huu, maana ya kitu kujitokeza mbele ya msafiri inaelezwa kwa kawaida kwa kusema kwamba anakutana nacho njiani.
- source_word: בְּכָל עֵץ אוֹ עַל הָאָרֶץ
  choice: katika mti wowote au chini
  rationale: Hutaja kwa uwazi sehemu mbili zinazowezekana za kiota; הָאָרֶץ hapa ni ardhi iliyo chini, si nchi.
- source_word: אֶפְרֹחִים
  choice: makinda
  rationale: Neno la kawaida la Kiswahili kwa watoto wa ndege walio kiotani, bila kutaja aina maalumu ya ndege.
- source_word: בֵיצִים
  choice: mayai
  rationale: Tafsiri ya moja kwa moja na wazi.
- source_word: וְהָאֵם
  choice: mama
  rationale: Huhifadhi usemi mfupi wa Kiebrania; muktadha unaonyesha wazi kuwa ni ndege jike aliye mama.
- source_word: רֹבֶצֶת
  choice: amekalia
  rationale: Hueleza kwa Kiswahili cha kawaida nafasi ya ndege mama juu ya makinda au mayai, bila kuongeza kwa lazima dhana maalumu ya kuatamia.
- source_word: לֹא תִקַּח
  choice: usimchukue
  rationale: Hutoa katazo la moja kwa moja na la kawaida katika Kiswahili.
- source_word: הָאֵם עַל הַבָּנִים
  choice: mama pamoja na makinda
  rationale: Katika usemi huu עַל huonyesha kumchukua mama pamoja na uzao wake, badala ya kueleza nafasi tu.
