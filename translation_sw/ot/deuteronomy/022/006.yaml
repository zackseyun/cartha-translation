review_pass:
  verdict: revise
  source_fidelity: Draft accurately conveys the conditional, incidental discovery of a bird's nest, its location, and the prohibition. However, the final 'makinda' narrows הַבָּנִים ('offspring/young') in a context that has explicitly included either chicks or eggs; the prohibition applies when the mother is with either. 'Chini' is also insufficiently specific for עַל־הָאָרֶץ, which means on the ground.
  naturalness: The Swahili is generally clear and idiomatic. 'Ardhini' is more precise and natural than the bare 'chini' for a nest located on the ground. The revised final phrase explicitly maintains the verse's chicks-or-eggs alternative.
  terminology: '''Kiota cha ndege,'' ''makinda,'' ''mayai,'' and ''mama'' are suitable Standard East African Swahili terms. ''Watoto'' in the literal footnote appropriately reflects Hebrew בָּנִים, while the main text should retain the contextual scope of makinda or mayai.'
  issues:
  - severity: medium
    issue: The wording 'usimchukue mama pamoja na makinda' excludes eggs from the stated prohibition.
    rationale: The Hebrew's final הַבָּנִים refers back contextually to the offspring associated with the nest, after the verse has specified 'young ones or eggs.' Rendering only 'makinda' can imply that taking the mother with eggs is not prohibited.
  - severity: low
    issue: '''Chini'' does not explicitly express ''on the ground.'''
    rationale: עַל הָאָרֶץ contrasts with a nest in a tree. 'Ardhini' clearly conveys this location, whereas 'chini' can mean merely below something.
  revised_text: Ikiwa utakutana njiani na kiota cha ndege[a], katika mti wowote au ardhini, chenye makinda au mayai, na mama amekalia makinda au mayai, usimchukue mama pamoja na makinda au mayai[b].
