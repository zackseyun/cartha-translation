translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya kawaida lakini yenye hadhi. “Makinda” limetumiwa kwa watoto wa ndege; “chini” linaeleza mahali ardhini kwa ufasaha. Alama zote za tanbihi zimewekwa katika matini.
