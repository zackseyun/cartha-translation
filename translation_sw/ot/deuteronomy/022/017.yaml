  text: וְ/הִנֵּה ה֡וּא שָׂם֩ עֲלִילֹ֨ת דְּבָרִ֜ים לֵ/אמֹ֗ר לֹֽא מָצָ֤אתִי לְ/בִתְּ/ךָ֙ בְּתוּלִ֔ים וְ/אֵ֖לֶּה בְּתוּלֵ֣י בִתִּ֑/י וּ/פָֽרְשׂוּ֙ הַ/שִּׂמְלָ֔ה לִ/פְנֵ֖י זִקְנֵ֥י הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/017.yaml
  text: and look[a], he has charged her with slanderous words, saying, “I did not find your daughter a virgin.” But these are the proofs of my daughter’s virginity[c][b]. And they shall spread out the garment before the elders of the city.
translation:
  language: sw
  text: na tazama, amemsingizia kwa kusema, “Sikumpata binti yako akiwa bikira.” Lakini hizi ndizo dalili za ubikira wa binti yangu.[a] Nao watatandaza vazi mbele ya wazee wa mji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ushahidi wa ubikira wa binti yangu.” Vazi linalotajwa baadaye ndilo linalowasilishwa kama ushahidi katika shauri hili.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Kiashiria hiki cha mazungumzo kinavuta fikira kwenye shtaka linalofuata; “na tazama” kinahifadhi nguvu yake bila kutumia lugha ya kizamani sana.
- source_word: שָׂם עֲלִילֹת דְּבָרִים
  choice: amemsingizia kwa kusema
  rationale: Nahau hii inaonyesha kumwekea mtu msingi wa shtaka lenye kumharibia jina. “Amemsingizia” huwasilisha kwa lugha ya kawaida na ya kisheria kwa upana wazo la madai ya uongo yanayomhusu binti.
- source_word: לֹא מָצָאתִי לְבִתְּךָ בְּתוּלִים
  choice: Sikumpata binti yako akiwa bikira
  rationale: Kiebrania kinasema kihalisi kutokupata “ubikira” kwa binti, lakini ni nahau ya kudai kwamba hakuwa bikira; Kiswahili hiki ni wazi na cha asili.
- source_word: וְאֵלֶּה בְּתוּלֵי בִתִּי
  choice: Lakini hizi ndizo dalili za ubikira wa binti yangu
  rationale: Wingi בְּתוּלִים hapa unarejelea ishara au ushahidi unaowasilishwa katika shauri. “Dalili” huhifadhi uwezekano wa ushahidi bila kuufanya uamuzi wa mwisho wenyewe; “lakini” huonyesha tofauti ya kimuktadha na shtaka.
- source_word: וּפָרְשׂוּ הַשִּׂמְלָה
  choice: Kisha watalitandaza vazi
  rationale: Kitenzi kinaeleza hatua inayofuata ya utaratibu wa kisheria. שִׂמְלָה ni vazi au kitambaa; “vazi” ni neno pana lisilobainisha kitu zaidi ya chanzo.
- source_word: לִפְנֵי זִקְנֵי הָעִיר
  choice: mbele ya wazee wa mji
  rationale: Hii ni kauli ya kawaida ya kuwasilisha jambo mbele ya viongozi wa kiraia na waamuzi wa mji.
theological_decisions:
- issue: Maana ya ushahidi wa ubikira
  choice: Kutafsiri בְּתוּלִים kama “dalili za ubikira” katika kauli ya baba
  alternative: “uthibitisho wa ubikira” au tafsiri ya moja kwa moja “ubikira”
  rationale: Muktadha ni wa kisheria na unaunganisha dalili hizo na vazi linalotandazwa, lakini mstari wenyewe hauelezi kwa undani asili au uwezo kamili wa ushahidi huo. “Dalili” huhifadhi mvutano huo bila kuingiza ufafanuzi wa ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Lugha ya shtaka na ushahidi imehifadhiwa bila kubainisha zaidi ya Kiebrania kuhusu aina ya vazi au asili ya dalili.
