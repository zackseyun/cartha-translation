base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/026.yaml
  text: But to the young woman you shall do nothing[a]; the young woman has committed no sin deserving death[b]. For this case is like when a man rises against his neighbor and murders him.
translation:
  language: sw
  text: Lakini msichana huyo usimfanyie lolote[a]; msichana huyo hana dhambi inayostahili adhabu ya kifo. Kwa maana, kama mtu anavyomwinukia mwenzake na kumuua, ndivyo ilivyo katika jambo hili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usimwadhibu kwa njia yoyote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַנַּעַר
  choice: Lakini msichana huyo
  rationale: Kiunganishi וְ kinaonyesha utofauti na adhabu ya mwanamume katika mstari uliotangulia. Katika sheria hii, נַעַר humrejelea msichana kijana aliyetajwa katika muktadha; 'msichana huyo' ni ya kawaida na wazi kwa Kiswahili.
- source_word: לֹא תַעֲשֶׂה דָבָר
  choice: msimfanyie lolote
  rationale: Huwasilisha katazo kamili la kuchukua hatua yoyote ya adhabu dhidi yake. Wingi wa heshima/maelekezo 'msimfanyie' ni wa kawaida katika Kiswahili cha sheria kuliko umoja wa moja kwa moja.
- source_word: אֵין לַנַּעַר חֵטְא מָוֶת
  choice: msichana huyo hana dhambi inayostahili adhabu ya kifo
  rationale: Nahau ya Kiebrania, kihalisi 'hana dhambi ya kifo,' ina maana ya kutokuwa na hatia inayostahili hukumu ya kifo. Tafsiri inadumisha neno 'dhambi' na pia kuweka wazi nguvu yake ya kisheria.
- source_word: כִּי
  choice: Kwa maana
  rationale: Hutanguliza sababu inayounga mkono uamuzi wa kisheria.
- source_word: כַּאֲשֶׁר יָקוּם אִישׁ עַל רֵעֵהוּ
  choice: kama mtu anapomshambulia mwenzake
  rationale: ביטוי 'kuinuka dhidi ya' ni nahau ya kushambulia. 'Kumshambulia mwenzake' ni Kiswahili cha asili kinachobeba maana hiyo bila kudhoofisha ulinganisho.
- source_word: וּרְצָחוֹ נֶפֶשׁ
  choice: na kumuua
  rationale: רצח humaanisha kumuua mtu kwa uhalifu. Katika muktadha huu wa shambulio la mtu dhidi ya mwenzake, 'kumuua' ni ya asili; uharamu wa tendo uko wazi kutokana na ulinganisho wa kisheria.
- source_word: כֵּן הַדָּבָר הַזֶּה
  choice: jambo hili ni kama
  rationale: Huhitimisha ulinganisho wa kisheria. 'Jambo hili' linaakisi דָּבָר huku 'ni kama' likitoa muundo wa ulinganisho kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Aina ya kutokuwa na hatia kwa msichana katika ulinganisho wa kisheria
  choice: Mstari unasema msichana hana hatia inayostahili adhabu ya kifo katika kesi hii.
  alternative: Mstari unasema hana hatia yoyote ya kimaadili kwa maana pana, bila kuzingatia hasa uwajibikaji wa kisheria.
  rationale: Nahau חֵטְא מָוֶת ina nguvu ya kisheria katika mfululizo huu wa sheria. Tafsiri inadumisha msisitizo huo bila kuingiza dai pana kuliko maandiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa urahisi. Sentensi fupi na maneno ya kawaida yametumiwa. Alama [a] imewekwa baada ya katazo linalohusika; hakuna tanbihi iliyoongezwa mahali pasipo na alama.
