review_pass:
  verdict: revise
  source_fidelity: The main rendering correctly preserves the prohibition against sowing kilayim in a vineyard and retains the deliberately difficult consecration language of תִּקְדַּשׁ. The consequence encompasses both the sown seed/crop and the vineyard’s produce. However, the footnote’s alternative “yatapotezwa” (“will be destroyed”) states a consequence that is not explicit in the Hebrew and should not be offered as an equivalent lexical alternative.
  naturalness: The Swahili is clear, modern, and suitably formal. “Shamba lako la mizabibu,” “mbegu za aina mbili,” and “la sivyo” are natural Standard East African Swahili. “Yatawekwa wakfu” appropriately communicates the consecration/set-apart sense in an understandable form.
  terminology: “Kuwekwa wakfu” preserves the core קדש terminology without asserting a specific institutional mechanism. The note should explain exclusion from ordinary use as a contextual implication, rather than equate the term with destruction. Agricultural terms are consistent and clear.
  issues:
  - severity: medium
    issue: The footnote gives “yatapotezwa” as an alternative contextual meaning.
    rationale: The Hebrew verb קדש means become holy/consecrated or set apart. In this legal context it entails loss of ordinary use, but it does not explicitly say that the produce is destroyed. This alternative overstates the source and narrows a legally/textually debated consequence.
  revised_text: Usipande mbegu za aina mbili katika shamba lako la mizabibu, la sivyo mavuno yote yatawekwa wakfu[a]—mbegu utakayopanda pamoja na mazao ya shamba hilo la mizabibu.
  revised_footnotes:
