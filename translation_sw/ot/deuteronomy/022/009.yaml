base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/009.yaml
  text: You shall not sow your vineyard with two kinds of seed[a], lest the whole yield be forfeited—the seed that you sow and the produce of the vineyard.
translation:
  language: sw
  text: Usipande mbegu za aina mbili katika shamba lako la mizabibu, la sivyo mavuno yote yatawekwa wakfu[a]—mbegu utakayopanda pamoja na mazao ya shamba hilo la mizabibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana ya kimuktadha, “hayataruhusiwa kutumiwa kwa matumizi ya kawaida.” Neno la Kiebrania kwa kawaida humaanisha “kuwa takatifu” au “kuwekwa wakfu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְרַע
  choice: usipande mbegu
  rationale: Kitenzi זרע humaanisha hasa kutawanya au kupanda mbegu. Katika Kiswahili cha kawaida, “kupanda mbegu” ni wazi na cha asili kuliko kutumia “kupanda” peke yake katika sheria hii ya kilimo.
- source_word: כַּרְמְךָ
  choice: shamba lako la mizabibu
  rationale: כרם ni eneo lililopandwa mizabibu. “Shamba la mizabibu” ni usemi wa kawaida na unaoeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: כִּלְאָיִם
  choice: mbegu za aina mbili
  rationale: כלאים hueleza mchanganyiko uliokatazwa wa aina tofauti. “Mbegu za aina mbili” huwasilisha maana ya muktadha huu kwa uwazi bila kudokeza kwamba mbegu zenyewe tayari zimechanganywa.
- source_word: פֶּן
  choice: la sivyo
  rationale: פן huanzisha matokeo mabaya yanayopaswa kuepukwa. “La sivyo” ni ya asili katika Kiswahili cha sasa na inafaa kwa mtindo wa sheria.
- source_word: תִּקְדַּשׁ
  choice: yatawekwa wakfu
  rationale: Kitenzi קדש kwa msingi humaanisha kuwa takatifu au kuwekwa wakfu. Tafsiri hii inadumisha neno la chanzo na taharuki yake ya kiteolojia, huku tanbihi ikifafanua kwamba hapa matokeo yake ni kutotumika kwa matumizi ya kawaida.
- source_word: הַמְלֵאָה
  choice: mavuno yote
  rationale: המלאה hurejelea ujazo au mazao yote yanayotokana na kilichopandwa. “Mavuno yote” ni fupi, ya kawaida, na huonyesha upeo kamili wa matokeo.
- source_word: הַזֶּרַע אֲשֶׁר תִּזְרָע
  choice: mbegu utakayopanda
  rationale: Kirai hiki kinataja sehemu ya kwanza ya mavuno yaliyoathiriwa na kinahifadhi kishazi rejeshi cha Kiebrania kwa Kiswahili cha asili.
- source_word: וּתְבוּאַת הַכָּרֶם
  choice: pamoja na mazao ya shamba hilo la mizabibu
  rationale: תבואה ni mazao au mavuno. “Mazao” hutofautisha sehemu hii na mbegu iliyopandwa, na “hilo” hurejelea wazi shamba lililotajwa.
theological_decisions:
- issue: Maana ya תִּקְדַּשׁ katika sheria kuhusu mchanganyiko wa mazao
  choice: yatawekwa wakfu
  alternative: yatapotezwa / yatanyang’anywa yasiwe ya matumizi ya mwenye shamba
  rationale: Maana ya msingi ya קדש ni kuwekwa wakfu au kuwa takatifu. Katika muktadha huu ni onyo, hivyo uwekaji wakfu unamaanisha kwamba mazao hayapatikani tena kwa matumizi ya kawaida. Kutafsiri moja kwa moja kuwa “yatapotezwa” kungeonyesha matokeo ya kisheria lakini kungeficha lugha halisi na mvutano wa kifungu; kwa hiyo maana ya msingi imewekwa katika matini na athari yake imefafanuliwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa sheria ya kibiblia lakini kinachoeleweka kwa msomaji wa kawaida. “La sivyo” limetumiwa badala ya muundo wa kale zaidi, na “shamba la mizabibu” limetumiwa kwa uwazi wa kilimo.
