    text: Au, kwa maana ya kimuktadha, “hayataruhusiwa kutumiwa kwa matumizi ya kawaida.” Neno la Kiebrania kwa kawaida humaanisha “kuwa takatifu” au “kuwekwa wakfu.”
    reason: lexical_alternative
  revision_rationale: Matini kuu imehifadhiwa kwa kuwa ni sahihi na ya asili. Tanbihi imerekebishwa ili kuonyesha athari ya kimuktadha ya kuwekwa wakfu—kutotumiwa kwa matumizi ya kawaida—bila kuongeza dai kwamba mazao yataangamizwa.
