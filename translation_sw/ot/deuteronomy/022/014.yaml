base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/014.yaml
  text: and he charges her with false accusations and brings a bad name upon her[a], saying, ‘I took this woman, and when I came near to her[d][c][b], I did not find evidence of virginity in her.’
translation:
  language: sw
  text: naye akamtolea shutuma za fedheha na kumchafulia jina[a], akisema, “Nilimwoa mwanamke huyu, lakini nilipomkaribia[b], sikupata kwake dalili za ubikira[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kumharibia sifa.” Kiebrania kinasema kihalisi, “na kumletea jina baya.”
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha huu, “kumkaribia” ni usemi wa staha unaomaanisha kufanya naye ngono.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinasema kihalisi, “sikupata kwake ubikira.” Hapa maana yake ni dalili au ushahidi wa ubikira, kama inavyoelezwa katika mistari inayofuata.
    reason: cross_reference
lexical_decisions:
- source_word: וְשָׂם לָהּ עֲלִילֹת דְּבָרִים
  choice: akamtolea shutuma za mwenendo wa aibu
  rationale: Kirai hiki cha Kiebrania ni cha kimuktadha na kinamaanisha kuweka madai au shutuma dhidi ya mtu. Tafsiri hii inaonyesha uzito wa madai bila kuweka neno ‘za uongo’ katika matini kuu, kwa kuwa uongo wake unatokana zaidi na muktadha wa kesi kuliko maneno yenyewe.
- source_word: וְהוֹצִיא עָלֶיהָ שֵׁם רָע
  choice: na kumchafulia jina
  rationale: Hii ni nahau ya kuharibu sifa ya mtu. ‘Kumchafulia jina’ ni Kiswahili cha kawaida kinachohifadhi taswira ya ‘jina’ iliyomo katika Kiebrania.
- source_word: הָאִשָּׁה הַזֹּאת לָקַחְתִּי
  choice: Nilimwoa mwanamke huyu
  rationale: Katika muktadha wa ndoa, לָקַחְתִּי humaanisha kumchukua mwanamke kuwa mke. ‘Nilimwoa’ huwasilisha maana hiyo kwa Kiswahili cha sasa, huku ‘mwanamke huyu’ ikihifadhi namna ya kumtaja iliyo katika chanzo.
- source_word: וָאֶקְרַב אֵלֶיהָ
  choice: nilipomkaribia
  rationale: Kiebrania kinatumia lugha ya staha inayodokeza kujamiiana. ‘Nilipomkaribia’ huhifadhi usemi huo wa staha; tanbihi inaeleza maana yake katika muktadha.
- source_word: וְלֹא מָצָאתִי לָהּ בְּתוּלִים
  choice: sikupata kwake dalili za ubikira
  rationale: Nomino ya wingi בְּתוּלִים katika kesi hii inaelekea kwa dalili au ushahidi wa ubikira, kama mistari inayofuata inavyoonyesha. ‘Dalili za ubikira’ ni ya asili na inafaa kwa muktadha wa kisheria.
theological_decisions:
- issue: Je, shutuma ziitwe wazi ‘za uongo’ katika matini kuu?
  choice: Matini kuu haisemi moja kwa moja ‘za uongo’; inasema ‘shutuma za mwenendo wa aibu.’
  alternative: ‘mashtaka ya uongo’ au ‘akamzushia mashtaka’
  rationale: Muktadha mpana unaonyesha kuwa shutuma hizo zinaweza kuthibitishwa kuwa za uongo, lakini עֲלִילֹת דְּבָרִים yenyewe haisemi kwa uwazi neno ‘uongo.’ Uamuzi huu unahifadhi nafasi ya kisheria na mvutano wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Lugha ya staha ya chanzo imehifadhiwa katika ‘nilipomkaribia,’ huku tanbihi ikifafanua maana yake. ‘Kumchafulia jina’ ni nahau hai ya Kiswahili inayohifadhi taswira ya Kiebrania.
