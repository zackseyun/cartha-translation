  yaml_path: translation/ot/deuteronomy/022/027.yaml
  text: For he found her in the field[a]; the betrothed young woman cried out[b], but there was no one to rescue her.
translation:
  language: sw
  text: Kwa maana alimkuta shambani[a]; msichana aliyeposwa alipiga kelele, lakini hakukuwa na mtu wa kumwokoa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika nchi ya wazi.” Usemi wa Kiebrania unarejelea mazingira ya mashambani, yaliyo wazi na ya upweke.
    reason: lexical_alternative
  - marker: b
    text: Au, “wa kumkomboa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza sababu inayoeleza hukumu ya kisheria iliyotangulia, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: בַשָּׂדֶה
  choice: shambani
  rationale: Inadumisha picha ya eneo la mashambani lililo wazi na huenda la upweke, ambalo ni muhimu kwa hoja ya kisheria kwamba msaada haukupatikana.
- source_word: מְצָאָהּ
  choice: alimkuta
  rationale: Kitenzi מצא hapa kinaeleza mwanaume kukutana naye au kumkuta katika eneo hilo; ‘alimkuta’ ni cha asili na karibu na maana ya chanzo.
- source_word: צָעֲקָה
  choice: alipiga kelele
  rationale: Huonyesha kilio cha dhiki au cha kuomba msaada bila kuongeza maneno yasiyokuwamo moja kwa moja katika Kiebrania.
- source_word: הנער
  choice: mwanamke kijana
  rationale: Muktadha na upatanisho wa kisarufi vinaonyesha mhusika ni wa kike; usemi huu ni sahihi kijinsia na unaeleweka katika Kiswahili cha sasa.
- source_word: הַמְאֹרָשָׂה
  choice: aliyekuwa ameposwa
  rationale: ‘Kuposa’ huwasilisha hali rasmi ya kuahidiwa katika ndoa, iliyo nzito zaidi kisheria kuliko dhana ya kisasa ya uchumba wa kawaida.
- source_word: וְאֵין מוֹשִׁיעַ לָהּ
  choice: lakini hakukuwa na mtu wa kumwokoa
  rationale: Kihusishi ‘lakini’ kinaonyesha tofauti ya kimantiki kati ya kilio chake na kutokuwapo kwa msaada; ‘kumwokoa’ linafaa katika hali ya hatari ya moja kwa moja.
theological_decisions:
- issue: Hali ya kisheria na kijamii ya הַמְאֹרָשָׂה
  choice: aliyekuwa ameposwa
  alternative: aliyekuwa amechumbiwa
  rationale: ‘Ameposwa’ huhifadhi uzito rasmi wa ahadi ya ndoa katika sheria ya Israeli bila kuingiza fundisho la dhehebu.
- issue: Jinsia ya הַנַּעַר katika muktadha
  choice: mwanamke kijana
  alternative: msichana
  rationale: Muktadha humtambulisha wazi kuwa wa kike; ‘mwanamke kijana’ huepuka uwezekano wa ‘msichana’ kueleweka kuwa mtoto.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unadumisha sababu ya kisheria, kilio cha mwanamke, na kutokuwapo kwa mwokozi bila kufafanua zaidi ya chanzo.
