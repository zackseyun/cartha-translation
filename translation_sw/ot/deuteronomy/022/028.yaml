base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/028.yaml
  text: If a man finds a young woman[a], a virgin who is not engaged, and seizes her and lies with her, and they are discovered[b],
translation:
  language: sw
  text: Ikiwa mwanamume atamkuta msichana bikira ambaye hajaposewa[a], akamkamata[b] na akalala naye, nao wakagunduliwa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye hajachumbiwa.”
    reason: Mbadala huu hutumia usemi wa sasa unaoeleweka kwa urahisi; “hajaposewa” huonyesha kwa karibu zaidi hali rasmi ya kuahidiwa kwa ndoa.
  - marker: b
    text: Kitenzi cha Kiebrania kinaweza kumaanisha “kukamata,” “kushika,” au “kutwaa.” Wengine wanaelewa kishazi hiki kuwa kinaashiria ubakaji; wengine husema maana yake ya kisheria inapaswa kutambuliwa kutokana na muktadha mpana, wala si kutokana na kitenzi hiki peke yake.
    reason: Huhifadhi upana wa maana ya kitenzi na mjadala muhimu wa kimuktadha bila kuufanya uamuzi wa tafsiri kuu.
lexical_decisions:
- source_word: כִּי
  choice: Ikiwa
  rationale: Hutanguliza sharti katika sheria ya kisa; “ikiwa” ni ya kawaida na wazi katika Kiswahili cha kisheria.
- source_word: יִמְצָא
  choice: atamkuta
  rationale: Hutoa maana ya msingi ya “kupata/kukuta”; “atamkuta” ni ya asili zaidi hapa inapomhusu mtu.
- source_word: אִישׁ
  choice: mwanamume
  rationale: Nomino hii ni ya umoja na inabainisha jinsia; “mwanamume” huiwasilisha kwa usahihi.
- source_word: נער בְתוּלָה
  choice: msichana bikira
  rationale: Huhifadhi kwa ufupi dhana zote mbili za ujana na ubikira bila kutumia lugha ya kizamani.
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: ambaye hajachumbiwa
  rationale: Hurejelea kutokuwa amefungamanishwa rasmi kwa ahadi ya ndoa. “Hajachumbiwa” ni Kiswahili cha sasa na kinachoeleweka kwa urahisi.
- source_word: וּתְפָשָׂהּ
  choice: akamkamata
  rationale: Kitenzi תפשׂ kinaweza kumaanisha kushika, kukamata, au kutwaa. “Akamkamata” huhifadhi tendo la kumshika bila kulifanya moja kwa moja kuwa istilahi mahususi ya kisheria.
- source_word: וְשָׁכַב עִמָּהּ
  choice: na kulala naye
  rationale: Huhifadhi nahau ya Kiebrania inayomaanisha kujamiiana; katika muktadha huu nahau hiyo inaeleweka katika Kiswahili.
- source_word: וְנִמְצָאוּ
  choice: nao wakagunduliwa
  rationale: 'Huhifadhi kitenzi cha kauli ya kutendwa katika wingi: wawili hao au tendo lao linajulikana.'
theological_decisions:
- issue: Iwapo tendo litafsiriwe moja kwa moja kwa neno mahususi kama “kubaka”
  choice: Kuhifadhi maneno ya kileksia “akamkamata na kulala naye”
  alternative: “akambaka” au “akamshika na kulala naye”
  rationale: תפשׂ huonyesha kushika au kukamata, lakini yenyewe haitoi istilahi kamili ya kisheria. Tafsiri kuu kwa hiyo haifichi uzito wa tendo wala kuamua kimya-kimya mjadala unaotegemea pia muktadha mpana wa sheria zinazozunguka aya hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sheria umehifadhiwa kwa “Ikiwa,” na maneno yamechaguliwa yawe wazi kwa wasomaji wa kawaida bila kulainisha au kufafanua kupita kiasi tendo linaloelezwa.
