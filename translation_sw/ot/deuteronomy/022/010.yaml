  source_fidelity: “Usilime” accurately conveys the negative legal injunction לֹא תַחֲרֹשׁ. “Kwa ng’ombe na punda pamoja” faithfully renders the instrumental pairing of an ox and a donkey in the same plowing activity; “pamoja” corresponds directly to יַחְדָּו. The singular animal terms are naturally expressed by unmarked noun forms in Swahili.
