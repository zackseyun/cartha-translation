  text: לֹֽא תַחֲרֹ֥שׁ בְּ/שׁוֹר וּ/בַ/חֲמֹ֖ר יַחְדָּֽו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/010.yaml
  text: You shall not plow with an ox and a donkey together[a].
translation:
  language: sw
  text: Usilime kwa ng’ombe na punda pamoja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usilime ukitumia ng’ombe na punda pamoja.”
    reason: Ufafanuzi mbadala unaoweka wazi kwamba kihusishi cha Kiebrania kinaonyesha wanyama wanaotumiwa katika kulima.
lexical_decisions:
- source_word: לֹא תַחֲרֹשׁ
  choice: Usilime
  rationale: Kikanushi לֹא pamoja na kitenzi cha nafsi ya pili katika sheria hutoa katazo la moja kwa moja. “Usilime” ni Kiswahili cha sasa, cha kawaida, na chenye nguvu inayofaa ya kisheria.
- source_word: בְּשׁוֹר
  choice: kwa ng’ombe
  rationale: שׁוֹר humaanisha mnyama wa jamii ya ng’ombe, hapa akiwa mnyama wa kuvuta jembe. “Ng’ombe” ni neno la kawaida na pana katika Kiswahili; kihusishi בְּ kinaonyesha mnyama anayetumiwa kulimia.
- source_word: וּבַחֲמֹר
  choice: na punda
  rationale: חֲמוֹר ni neno la kawaida kwa punda; kiunganishi וּ huunganisha mnyama huyu na ng’ombe katika tendo moja.
- source_word: יַחְדָּו
  choice: pamoja
  rationale: Kielezi hiki kinaonyesha kwamba wanyama hao wawili wamefungwa au kutumiwa katika kazi ileile ya kulima.
theological_decisions:
- issue: Nguvu ya katazo katika sheria ya agano
  choice: 'Kutumia katazo la moja kwa moja: “Usilime…”'
  alternative: “Hutalima…”
  rationale: “Usilime” hudumisha maana ya amri ya Kiebrania huku ikiwa ya asili na wazi katika Kiswahili cha kisasa. Aya yenyewe haina suala la kimafundisho linalobishaniwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo mfupi, wenye heshima na wa moja kwa moja unaofaa sheria. “Ng’ombe” limetumiwa badala ya neno lenye uainishaji mwembamba zaidi ili kuhifadhi upana wa שׁוֹר na kueleweka kwa wasomaji wa kawaida.
