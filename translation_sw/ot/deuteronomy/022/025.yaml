  text: וְֽ/אִם בַּ/שָּׂדֶ֞ה יִמְצָ֣א הָ/אִ֗ישׁ אֶת ה/נער הַ/מְאֹ֣רָשָׂ֔ה וְ/הֶחֱזִֽיק בָּ֥/הּ הָ/אִ֖ישׁ וְ/שָׁכַ֣ב עִמָּ֑/הּ וּ/מֵ֗ת הָ/אִ֛ישׁ אֲשֶׁר שָׁכַ֥ב עִמָּ֖/הּ לְ/בַדּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/025.yaml
  text: But if in the open field the man finds the young woman who is betrothed[a], and the man seizes her and lies with her, then only the man who lay with her shall die.
translation:
  language: sw
  text: Lakini ikiwa mwanamume atamkuta shambani msichana aliyeposwa, na mwanamume huyo akamshika kwa nguvu[a] na kulala naye, basi mwanamume aliyelala naye pekee ndiye atakayeuawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akamzidi nguvu” au “akambaka.” Kiebrania kinasema “akamshika”; muktadha wa sheria zinazozunguka mstari huu unaonyesha kwamba tendo hilo halikuwa la hiari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Inaonyesha sharti linalotofautiana na kisa kilichotangulia, hivyo inadumisha nguvu ya kimuktadha ya kiunganishi hicho.
- source_word: בַּשָּׂדֶה
  choice: shambani
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya שָׂדֶה katika Kiswahili; muktadha unaonyesha kuwa ni mahali nje ya makazi ambako msaada haukuwa karibu.
- source_word: יִמְצָא
  choice: atamkuta
  rationale: Kitenzi מצא kwa kawaida humaanisha kumkuta au kumpata mtu; “atamkuta” ni cha asili katika simulizi la kisheria la Kiswahili.
- source_word: הַנַּעַר הַמְאֹרָשָׂה
  choice: mwanamke kijana aliyeposwa
  rationale: “Mwanamke kijana” huepuka kudokeza utoto bila ushahidi wa kutosha, na “aliyeposwa” huonyesha ahadi rasmi ya ndoa yenye uzito wa kisheria.
- source_word: וְהֶחֱזִיק בָּהּ
  choice: akamshika kwa nguvu
  rationale: Hifili ya חזק pamoja na ב inaonyesha kumkamata au kumshika mtu kwa nguvu. Tafsiri hii inaonyesha kulazimisha bila kuifanya kitenzi chenyewe kiseme moja kwa moja “kubaka.”
- source_word: וְשָׁכַב עִמָּהּ
  choice: na kulala naye
  rationale: Hii ndiyo nahau ya Kiebrania inayomaanisha kufanya ngono; “kulala naye” ni ya kawaida, yenye staha, na inafaa katika sheria hii.
- source_word: וּמֵת
  choice: atakayekufa
  rationale: Katika muktadha wa sheria, umbo hili linaeleza hukumu ya kifo. “Atakayekufa” hudumisha usemi wa chanzo bila kuongeza moja kwa moja kitenzi cha kuuawa.
- source_word: לְבַדּוֹ
  choice: ndiye peke yake
  rationale: Inaonyesha wazi kuwa adhabu ya kifo inamhusu mwanamume tu, si mwanamke.
theological_decisions:
- issue: Kama ukatili wa kingono usemwe moja kwa moja kwa neno “kubaka” katika matini kuu
  choice: Kutumia “akamshika kwa nguvu” katika matini kuu
  alternative: “akambaka” au “akamzidi nguvu”
  rationale: Muktadha wa sheria unaonyesha wazi kwamba tendo hilo halikuwa la hiari, lakini kitenzi חזק kimsingi humaanisha kushika, kukamata, au kumzidi mtu nguvu, wala si kitenzi maalumu cha “kubaka.” Tanbihi inahifadhi ufafanuzi huo bila kuficha maana ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha na uzito wa kisheria. Muundo “ndiye peke yake” unasisitiza upekee wa hukumu, na alama ya tanbihi imewekwa baada ya kishazi kinachohusika moja kwa moja.
