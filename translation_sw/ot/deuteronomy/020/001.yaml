  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּֽי תֵצֵ֨א לַ/מִּלְחָמָ֜ה עַל אֹיְבֶ֗י/ךָ וְֽ/רָאִ֜יתָ ס֤וּס וָ/רֶ֨כֶב֙ עַ֚ם רַ֣ב מִמְּ/ךָ֔ לֹ֥א תִירָ֖א מֵ/הֶ֑ם כִּֽי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ הַ/מַּֽעַלְ/ךָ֖ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/001.yaml
  text: When you go out to battle against your enemies and see horses and chariots[a], a people more numerous than you, do not fear them, for Yahweh your God is with you[c][b], who brought you up from the land of Egypt.
translation:
  language: sw
  text: Utakapotoka kwenda vitani dhidi ya adui zako na kuona farasi na magari ya vita[a], na watu walio wengi kuliko wewe[b], usiwaogope, kwa maana Yahwe Mungu wako yu pamoja nawe; ndiye aliyekupandisha kutoka nchi ya Misri.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “farasi na gari la vita”; maneno ya umoja katika Kiebrania huenda yametumiwa kwa maana ya jumla kuhusu vikosi vya kijeshi.
    reason: lexical_alternative
  - marker: b
    text: Au, “watu walio wakubwa kuliko wewe.” Katika muktadha huu inaelekea kwamba kishazi hiki kinasisitiza kuwa adui ni wengi zaidi kwa idadi.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kwa halisi, “aliyekupandisha kutoka nchi ya Misri”; maneno haya yanakumbusha tukio la kutoka Misri kuwa msingi wa ujasiri wa Israeli.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי תֵצֵא לַמִּלְחָמָה
  choice: Utakapotoka kwenda vitani
  rationale: כִּי pamoja na kitenzi cha hali hii huanzisha mazingira ya wakati; “utakapotoka” ni Kiswahili cha kawaida kinachoendeleza maana hiyo. “Kwenda vitani” huwasilisha nahau ya יצא למלחמה bila kuifanya vita yenyewe kuwa mahali.
- source_word: עַל אֹיְבֶיךָ
  choice: dhidi ya adui zako
  rationale: עַל katika tendo la uhasama ina maana ya “dhidi ya,” na wingi wa אֹיְבֶיךָ umehifadhiwa.
- source_word: סוּס וָרֶכֶב
  choice: farasi na magari ya vita
  rationale: Nomino hizi za umoja katika Kiebrania zinaweza kutumiwa kwa maana ya mkusanyiko wa vikosi. Wingi wa Kiswahili unaonyesha kwa kawaida farasi na magari ya kijeshi ya adui.
- source_word: עַם רַב מִמְּךָ
  choice: watu walio wengi kuliko wewe
  rationale: רַב pamoja na מִן ya kulinganisha hapa inaonyesha wingi wa idadi. Tafsiri haibadili “watu” kuwa “jeshi” wala kuamua kwamba maana ni nguvu badala ya idadi.
- source_word: לֹא תִירָא מֵהֶם
  choice: usiwaogope
  rationale: Hali ya kitenzi katika maagizo haya ni katazo; “usiwaogope” ni ya moja kwa moja na ya kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna inayotamkika kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: אֱלֹהֶיךָ עִמָּךְ
  choice: Mungu wako yu pamoja nawe
  rationale: Hii huhifadhi moja kwa moja ahadi ya uwepo wa Mungu. “Yu pamoja nawe” ni lugha yenye hadhi na inayoeleweka.
- source_word: הַמַּעַלְךָ
  choice: ndiye aliyekupandisha
  rationale: Kivumishi-tendo chenye kibainishi humtambulisha Yahwe kuwa yule aliyewapandisha Israeli. “Kukupandisha” huhifadhi taswira ya Kiebrania badala ya kuibadili kimya kuwa “kukutoa.”
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: kutoka nchi ya Misri
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kishazi cha mahali.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova; Yahweh
  rationale: Andiko lina jina binafsi la Mungu, si cheo. “Yahwe” huhifadhi jina hilo kwa tahajia ya kawaida ya Kiswahili bila kuingiza desturi ya kulibadilisha kuwa cheo.
- issue: Msingi wa Israeli kutokuwa na hofu
  choice: Uwepo wa Yahwe na tendo lake la kuwatoa Misri vimeachwa vikiwa vimeunganishwa
  alternative: Kufanya kishazi cha kutoka Misri kuwa maelezo huru yasiyomhusu moja kwa moja Yahwe
  rationale: Muundo wa Kiebrania unamtambulisha Mungu aliye pamoja nao kuwa ndiye aliyewapandisha kutoka Misri; tafsiri huhifadhi uhusiano huo bila kuongeza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaosomeka kwa urahisi. “Vitani,” “usiwaogope,” na “yu pamoja nawe” ni maneno ya kawaida bila kuwa ya mazungumzo mno. Umoja wa nafsi ya pili umehifadhiwa kwa sababu Kiebrania humsemesha Israeli kwa pamoja kama umoja.
