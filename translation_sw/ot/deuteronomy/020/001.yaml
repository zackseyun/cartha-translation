  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: hali ya wakati, kwenda vitani dhidi ya adui, farasi na magari ya vita kama istilahi za kijeshi za jumla, watu walio wengi, katazo la kuogopa, uwepo wa Yahwe, na kumbukumbu ya kutoka Misri zote zimehifadhiwa. “Aliyekupandisha” hudumisha taswira ya maandishi ya chanzo bila kuibadilisha kuwa tafsiri finyu zaidi.'
