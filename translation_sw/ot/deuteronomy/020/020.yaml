  text: רַ֞ק עֵ֣ץ אֲשֶׁר תֵּדַ֗ע כִּֽי לֹא עֵ֤ץ מַאֲכָל֙ ה֔וּא אֹת֥/וֹ תַשְׁחִ֖ית וְ/כָרָ֑תָּ וּ/בָנִ֣יתָ מָצ֗וֹר עַל הָ/עִיר֙ אֲשֶׁר הִ֨וא עֹשָׂ֧ה עִמְּ/ךָ֛ מִלְחָמָ֖ה עַ֥ד רִדְתָּֽ/הּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/020.yaml
  text: Only the trees that you know are not trees for food[a], those you may destroy and cut down, and build siegeworks against the city that is making war with you[b], until you bring it down.
translation:
  language: sw
  text: Ila miti ile ambayo unajua kwamba si miti ya chakula, unaweza kuiharibu na kuikata, na ujenge maboma ya kuzingiria dhidi ya mji[a] unaopigana nawe, mpaka uuangushe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ujenge tuta la kuzingiria” au “ujenge miundo ya kuzingiria.” Neno la Kiebrania מָצוֹר linaweza kumaanisha kwa upana maboma au miundo ya kuzingiria, badala ya muundo mmoja maalumu.
    reason: lexical_alternative
  - marker: b
    text: Au “mpaka uanguke.” Kiebrania husema kihalisi “mpaka uushushe,” kikitumia kitenzi cha kushuka kueleza kushindwa kwa mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Lakini
  rationale: Katika muktadha, neno hili linaweka tofauti yenye ukomo dhidi ya katazo la mstari uliotangulia; “Lakini” ni ya kawaida kwa Kiswahili na hukuza uhusiano huo.
- source_word: עֵץ ... עֵץ מַאֲכָל
  choice: miti ... miti ya chakula
  rationale: Muktadha unahusu miti hai, na kirai “miti ya chakula” kinahifadhi kwa upana wazo la miti inayotoa chakula bila kulifunga kwa aina moja tu ya matunda.
- source_word: אֲשֶׁר תֵּדַע כִּי לֹא ... הוּא
  choice: ambayo unajua kwamba si
  rationale: Tafsiri hii inahifadhi kipengele cha maarifa au utambuzi wa mhusika, pamoja na ukanushi wa Kiebrania.
- source_word: אֹתוֹ תַשְׁחִית
  choice: hiyo unaweza kuiharibu
  rationale: Kiwakilishi cha umoja kinatumika kwa kila mti katika kundi husika. “Unaweza” huonyesha ruhusa katika agizo hili la kisheria kuliko amri ya lazima.
- source_word: וְכָרָתָּ
  choice: na kuikata
  rationale: Katika muktadha wa miti, maana ni kuikata na kuiangusha; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: וּבָנִיתָ מָצוֹר
  choice: ukajenga ngome za kuuzingira
  rationale: מָצוֹר inaweza kumaanisha kwa upana majengo au ngome za kuzingira, si lazima tuta moja maalumu; tafsiri hii inaweka maana pana ya kijeshi.
- source_word: עַל הָעִיר
  choice: mji
  rationale: Muundo wa Kiswahili “ngome za kuuzingira mji” unawasilisha kwa kawaida hatua ya uadui inayoelekezwa dhidi ya mji.
- source_word: אֲשֶׁר הִוא עֹשָׂה עִמְּךָ מִלְחָמָה
  choice: unaopigana nawe
  rationale: Hii ni tafsiri ya kawaida ya nahau ya Kiebrania “kufanya vita pamoja nawe,” na inahifadhi hali ya tendo linaloendelea.
- source_word: עַד רִדְתָּהּ
  choice: mpaka uuteke
  rationale: Katika muktadha wa kuzingira mji, kitenzi cha kushuka kinaeleza kuanguka au kutiishwa kwa mji. “Uuteke” ni Kiswahili asilia chenye maana ya ushindi wa kijeshi, huku tanbihi ikihifadhi taswira halisi ya kushushwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Umoja wa “hiyo ... kui-” umehifadhi matumizi ya Kiebrania yanayomhusu kila mti katika kundi. Alama zote za tanbihi zimewekwa katika matini.
