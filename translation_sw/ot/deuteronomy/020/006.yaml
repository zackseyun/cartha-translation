  text: וּ/מִֽי הָ/אִ֞ישׁ אֲשֶׁר נָטַ֥ע כֶּ֨רֶם֙ וְ/לֹ֣א חִלְּל֔/וֹ יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ פֶּן יָמוּת֙ בַּ/מִּלְחָמָ֔ה וְ/אִ֥ישׁ אַחֵ֖ר יְחַלְּלֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/006.yaml
  text: And who is the man who has planted a vineyard and has not yet enjoyed its fruit? Let him go and return to his house[a], lest he die in the battle and another man enjoy its fruit.
translation:
  language: sw
  text: Na ni nani aliyepanda shamba la mizabibu lakini bado hajafurahia mazao yake? Aende akarudi nyumbani kwake,[a] asije akafa vitani, na mtu mwingine akafurahia mazao yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa mtindo rasmi zaidi, “bado hajaliweka wakfu” au “bado hajaanza kulitumia.” Kitenzi cha Kiebrania hapa kinamaanisha kuanza kutumia shamba la mizabibu kwa matumizi ya kawaida, huenda kwa kufurahia mazao yake baada ya miaka ya kwanza ambayo matunda yake hayakuruhusiwa kuliwa (linganisha Mambo ya Walawi 19:23–25).
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: Tena, ni nani
  rationale: Huhifadhi mfumo wa swali unaoanzisha hali nyingine ya msamaha katika maagizo ya kijeshi; muktadha unaonyesha kwamba anayezungumziwa ni mwanamume anayestahili kwenda vitani.
- source_word: נָטַע כֶּרֶם
  choice: amepanda shamba la mizabibu
  rationale: Hii ni tafsiri ya kawaida na iliyo wazi ya tendo lililokamilika lenye umuhimu wa sasa.
- source_word: וְלֹא חִלְּלוֹ
  choice: lakini bado hajaanza kufurahia mazao yake
  rationale: Katika muktadha huu, חלל inaelekea kumaanisha kuanza kulitumia shamba la mizabibu kwa matumizi ya kawaida baada ya kipindi cha awali cha vizuizi, hasa kufurahia mazao yake; 'bado' huonyesha kwamba matumizi hayo hayajaanza.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Na aende akarudi nyumbani kwake
  rationale: Mfuatano wa vitenzi una nguvu ya agizo au ruhusa; Kiswahili hiki ni cha asili na huhifadhi vitendo viwili vya kwenda na kurudi.
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: asije akafa vitani
  rationale: '''Asije'' huwasilisha onyo au jambo linalokusudiwa kuzuiwa lililo katika פן; ''vitani'' ni usemi wa kawaida wa Kiswahili.'
- source_word: וְאִישׁ אַחֵר יְחַלְּלֶנּוּ
  choice: kisha mtu mwingine akafurahia mazao yake
  rationale: Hutumia maana ileile ya kimuktadha ya חלל kwa uthabiti; 'mtu mwingine' huwakilisha אישׁ אַחֵר kwa Kiswahili cha kawaida.
