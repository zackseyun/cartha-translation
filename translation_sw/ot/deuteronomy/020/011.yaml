base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/011.yaml
  text: And if it answers you with peace and opens to you[b][a], then all the people found in it shall become forced labor for you and shall serve you.
translation:
  language: sw
  text: Ikiwa litakujibu kwa amani[a] na kukufungulia, basi watu wote watakaopatikana ndani yake watatozwa kazi ya kulazimishwa kwa ajili yako[b], nao watakutumikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “litakujibu kwa masharti ya amani.”
    reason: lexical_alternative
  - marker: b
    text: Au, “watatozwa ushuru kwa ajili yako.” Neno la Kiebrania מַס linaweza kumaanisha ushuru, tozo, au kazi ya lazima; hapa muktadha unaelekea kwenye utumishi wa kazi ya kulazimishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: amani
  rationale: Neno hili humaanisha amani au hali njema. Katika muktadha huu wa vita, linaonyesha kwamba mji unakubali mwito wa kufanya amani; tafsiri ya moja kwa moja “amani” inadumisha neno la Kiebrania na utata wake halali.
- source_word: תַּעַנְךָ
  choice: litakujibu
  rationale: Kitenzi ענה hapa ni ‘jibu/itikia.’ Kiima ni mji, ambao katika Kiswahili unaweza kurejelewa kwa ngeli ya ji-/ma-, hivyo “litakujibu” inadumisha namna mji unavyowakilishwa kama mtendaji.
- source_word: וּפָתְחָה לָךְ
  choice: na kukufungulia
  rationale: Kiebrania kinasema tu ‘na lifungue kwako/likufungulie’ bila kutaja milango. “Kukufungulia” ni ya kawaida katika Kiswahili na haiongezi ‘milango yake,’ ingawa hilo linaeleweka kutokana na muktadha.
- source_word: הָעָם הַנִּמְצָא בָהּ
  choice: watu wote watakaopatikana ndani yake
  rationale: Hii inadumisha maana ya moja kwa moja ya נמצא, ‘kupatikana,’ na pia inaeleza wazi kwamba watu hao wako ndani ya mji.
- source_word: לָמַס
  choice: watakuwa chini yako kwa kazi ya kulazimishwa
  rationale: מַס linaweza kumaanisha ushuru, mzigo uliowekwa, au kazi ya lazima. Katika muktadha huu, pamoja na kishazi kinachofuata ‘watakutumikia,’ maneno haya yanaonyesha kutiishwa kwa ajili ya kazi bila kuufanya mstari useme wazi kuwa watu hao ni watumwa.
- source_word: וַעֲבָדוּךָ
  choice: nao watakutumikia
  rationale: עבד humaanisha kufanya kazi au kutumikia. “Watakutumikia” ni tafsiri ya moja kwa moja inayodumisha uhusiano wa kutiishwa bila kuingiza taasisi mahususi isiyotajwa na maandishi.
theological_decisions:
- issue: Lugha ya kutiishwa katika sheria ya vita
  choice: Kudumisha wazi kwamba watu wa mji watawekwa chini ya kazi ya kulazimishwa na kumtumikia mshindi.
  alternative: Watakulipa ushuru na kukutumikia.
  rationale: Mstari unaeleza matokeo kwa mji unaokubali amani katika muktadha wa vita vya kale. Tafsiri haipaswi kupunguza nguvu ya kulazimisha iliyo katika מַס, wala kuifanya iwe mahususi zaidi kuliko Kiebrania; tanbihi inadumisha uwezekano wa maana ya ushuru.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo “litakujibu” unaurejelea mji uliotajwa katika muktadha uliotangulia. “Kukufungulia” kwa makusudi hakutaji milango, kwa kuwa kitu hicho hakijasemwa wazi katika Kiebrania. Lugha ya kulazimishwa haijalainishwa, lakini pia haijapanuliwa kuwa utumwa kamili.
