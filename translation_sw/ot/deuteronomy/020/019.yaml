  naturalness: Kiswahili kwa ujumla ni sanifu na cha kisasa. "Mti wa shambani" ni usemi wa kawaida zaidi kuliko "mti wa kondeni" kwa עֵץ הַשָּׂדֶה katika muktadha huu, na "katika mzingiro" huondoa utata wa kiambatisho katika sentensi ya mwisho.
  terminology: '"Mwanadamu" hufaa kwa הָאָדָם katika utofautisho wa mtu na mti. "Mzingiro" na "kuuteka" hudumisha rejista ya kijeshi bila kuongeza tafsiri ya kiitikadi. Tanbihi inadumisha kwa haki usomaji mbadala wa kifungu tata.'
