  text: כִּֽי תָצ֣וּר אֶל עִיר֩ יָמִ֨ים רַבִּ֜ים לְֽ/הִלָּחֵ֧ם עָלֶ֣י/הָ לְ/תָפְשָׂ֗/הּ לֹֽא תַשְׁחִ֤ית אֶת עֵצָ/הּ֙ לִ/נְדֹּ֤חַ עָלָי/ו֙ גַּרְזֶ֔ן כִּ֚י מִמֶּ֣/נּוּ תֹאכֵ֔ל וְ/אֹת֖/וֹ לֹ֣א תִכְרֹ֑ת כִּ֤י הָֽ/אָדָם֙ עֵ֣ץ הַ/שָּׂדֶ֔ה לָ/בֹ֥א מִ/פָּנֶ֖י/ךָ בַּ/מָּצֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/019.yaml
  text: When you besiege a city for many days[a], fighting against it to capture it, you shall not destroy its trees by swinging an axe against them, for you may eat from them, and you shall not cut them down. For is the tree of the field a man, that it should come before you in the siege?
translation:
  language: sw
  text: Unapouzingira mji kwa siku nyingi, ukipigana dhidi yake ili kuuteka, usiharibu miti yake kwa kuipiga kwa shoka, kwa maana unaweza kula matunda yake; usiikate. Je, mti wa shambani ni mwanadamu hata ukabiliane nawe katika mzingiro?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana mwanadamu ni mti wa shambani,” au, “kwa maana mti wa shambani ni chakula cha mwanadamu.” Kiebrania cha sehemu hii ya mwisho ni kigumu. Maandishi makuu yanaichukulia kama swali la balagha linalotofautisha mti na adui wa kibinadamu.
    reason: alternative_reading
lexical_decisions:
- source_word: תָצוּר
  choice: unapouzingira
  rationale: Kitenzi צור katika muktadha huu humaanisha kuuzingira mji kijeshi; “kuuzingira” ni Kiswahili cha kawaida na sahihi.
- source_word: יָמִים רַבִּים
  choice: kwa siku nyingi
  rationale: Huhifadhi moja kwa moja usemi wa wakati wa Kiebrania huku ikiwa ya kawaida kwa Kiswahili.
- source_word: לְהִלָּחֵם עָלֶיהָ לְתָפְשָׂהּ
  choice: ukipigana nao ili kuuteka
  rationale: “Nao” hurejelea mji kwa upatanisho wa ngeli, na “ili kuuteka” huonyesha kusudi la mapigano.
- source_word: לֹא תַשְׁחִית אֶת עֵצָהּ
  choice: usiharibu miti yake
  rationale: שׁחת katika Hiphil hapa ni kuharibu; wingi “miti” unafuata maana ya jumla ya nomino ya Kiebrania.
- source_word: לִנְדֹּחַ עָלָיו גַּרְזֶן
  choice: kwa kuipiga kwa shoka
  rationale: Huwasilisha kwa njia ya kawaida kitendo cha kutumia shoka dhidi ya miti bila kuongeza wazo lisilokuwamo katika chanzo.
- source_word: כִּי מִמֶּנּוּ תֹאכֵל
  choice: kwa maana unaweza kula matunda yake
  rationale: Muktadha unaonyesha miti inayotoa chakula; “matunda” huweka wazi kile kinacholiwa bila kudai kuwa mti wenyewe huliwa.
- source_word: וְאֹתוֹ לֹא תִכְרֹת
  choice: usiikate
  rationale: כרת ndiyo kitenzi cha kawaida cha kukata mti; umoja wa Kiswahili huhifadhi kiwakilishi cha umoja cha Kiebrania.
- source_word: הָאָדָם
  choice: mwanadamu
  rationale: Katika swali hili neno humaanisha binadamu kama mpiganaji, si lazima mwanamume kwa jinsia; “mwanadamu” huhifadhi utofauti kati ya mtu na mti.
- source_word: עֵץ הַשָּׂדֶה
  choice: mti wa kondeni
  rationale: Huhifadhi muundo wa “mti wa shambani/kondeni” na sauti ya kishairi ya kifungu.
- source_word: לָבֹא מִפָּנֶיךָ בַּמָּצוֹר
  choice: hata ukabiliane nawe wakati wa kuuzingira mji
  rationale: 'Hutafsiri usemi mgumu kama swali la balagha: mti si adui wa kibinadamu anayeweza kukabiliana na mzingiraji.'
theological_decisions:
- issue: Maana ya kifungu kigumu כִּי הָאָדָם עֵץ הַשָּׂדֶה לָבֹא מִפָּנֶיךָ בַּמָּצוֹר
  choice: Swali la balagha linalotofautisha mti na adui wa kibinadamu
  alternative: Kauli “kwa maana mwanadamu ni mti wa kondeni,” au kauli inayohusisha mti wa kondeni na chakula cha mwanadamu
  rationale: Sintaksia ya Kiebrania inaweza kueleweka kwa njia zaidi ya moja. Swali la balagha linafaa katika muktadha wa kuzuia uharibifu wa miti wakati wa kuzingira mji, lakini utata halisi umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi umefanywa kuwa wa kawaida kwa wasomaji wa leo, huku swali tata la mwisho na mbadala zake vikihifadhiwa.
