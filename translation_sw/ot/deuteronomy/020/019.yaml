revisions:
- from: Unapouzingira mji kwa siku nyingi, ukipigana nao ili kuuteka, usiharibu miti yake kwa kuipiga kwa shoka, kwa maana unaweza kula matunda yake; usiikate. Je, mti wa kondeni ni mwanadamu hata ukabiliane nawe wakati wa kuuzingira mji?[a]
  to: Unapouzingira mji kwa siku nyingi, ukipigana dhidi yake ili kuuteka, usiharibu miti yake kwa kuipiga kwa shoka, kwa maana unaweza kula matunda yake; usiikate. Je, mti wa shambani ni mwanadamu hata ukabiliane nawe katika mzingiro?[a]
  rationale: Marekebisho yanaondoa utata wa kisarufi katika kirai cha mwisho kwa kutumia "katika mzingiro," na kubadilisha "kondeni" kuwa "shambani" kwa matumizi ya Kiswahili ya kawaida zaidi. "Dhidi yake" pia hurejelea mji kwa uwazi. Usomaji wa swali la balagha na tanbihi ya utata wa Kiebrania vimehifadhiwa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T17:52:37Z'
