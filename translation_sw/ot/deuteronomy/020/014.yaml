source:
  edition: WLC
  text: רַ֣ק הַ֠/נָּשִׁים וְ/הַ/טַּ֨ף וְ/הַ/בְּהֵמָ֜ה וְ/כֹל֩ אֲשֶׁ֨ר יִהְיֶ֥ה בָ/עִ֛יר כָּל שְׁלָלָ֖/הּ תָּבֹ֣ז לָ֑/ךְ וְ/אָֽכַלְתָּ֙ אֶת שְׁלַ֣ל אֹיְבֶ֔י/ךָ אֲשֶׁ֥ר נָתַ֛ן יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/014.yaml
  text: Only the women[a], the little children, the livestock, and everything that is in the city—all its spoil—you may take as plunder for yourself; and you may eat the spoil of your enemies, which Yahweh your God has given you.
translation:
  language: sw
  text: Isipokuwa wanawake, watoto wadogo, mifugo, na kila kitu kilichomo katika mji—yaani, nyara zake zote—unaweza kujitwalia; nawe unaweza kula[a] nyara za adui zako ambazo Yahwe Mungu wako amekupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “utakula nyara za adui zako.” Hapa kitenzi “kula” kinaweza pia kumaanisha kutumia au kunufaika na vitu vilivyotwaliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Lakini
  rationale: Katika muktadha huu neno hilo linaonyesha tofauti na amri iliyotangulia. “Lakini” ni ya kawaida na huonyesha kuwa makundi yanayofuata hayatendewi kama wanaume waliotajwa katika mstari uliotangulia.
- source_word: הַנָּשִׁים
  choice: wanawake
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya wingi inayowataja wanawake hasa.
- source_word: הַטַּף
  choice: watoto wadogo
  rationale: Neno hili kwa kawaida huonyesha watoto wadogo au wategemezi; “watoto wadogo” linaweka wazi umri mdogo bila kupanua maana kupita kiasi.
- source_word: הַבְּהֵמָה
  choice: mifugo
  rationale: Katika muktadha wa nyara za vita, neno hili linarejelea wanyama wanaofugwa; “mifugo” ni sahihi kuliko “ng’ombe” na mahsusi zaidi kuliko “wanyama.”
- source_word: וְכֹל אֲשֶׁר יִהְיֶה בָעִיר
  choice: na kila kitu kilichomo mjini
  rationale: Huhifadhi upana wa kishazi cha Kiebrania na ni Kiswahili cha sasa na cha kawaida.
- source_word: כָּל שְׁלָלָהּ
  choice: nyara zake zote
  rationale: שָׁלָל ni mali inayotwaliwa vitani. “Nyara” linafaa katika muktadha huu na kiambishi “zake” hurejelea mji.
- source_word: תָּבֹז לָךְ
  choice: unaweza kujitwalia
  rationale: Kitenzi kinamaanisha kutwaa nyara. Muundo wa kujirejelea unaonyesha לָךְ, yaani kujitwalia mwenyewe, huku “unaweza” ikiwasilisha ruhusa katika sheria hii.
- source_word: וְאָכַלְתָּ אֶת שְׁלַל אֹיְבֶיךָ
  choice: nawe unaweza kula nyara za adui zako
  rationale: “Kula” huhifadhi picha halisi ya kitenzi אָכַל, ambayo katika muktadha huu inaweza kupanuka na kumaanisha kutumia au kunufaika na nyara. Tanbihi inaeleza upana huo bila kuuondoa katika matini.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina la agano la Mungu linalowakilishwa na Tetragramatoni.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya usemi wa agano wenye kiambishi cha nafsi ya pili umoja.
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֶיךָ לָךְ
  choice: ambazo Yahwe Mungu wako amekupa
  rationale: Wakati timilifu “amekupa” unaonyesha kwamba nyara hizo zimekwisha kutolewa kwa mhusika kama msingi wa ruhusa inayotajwa.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina la Mungu moja kwa moja; “Yahwe” hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya vitenzi vya nafsi ya pili katika maagizo ya kisheria
  choice: unaweza
  alternative: utajitwalia / utakula au unapaswa kujitwalia / kula
  rationale: Katika muktadha huu vitenzi vinaidhinisha kitendo kuhusu nyara. “Unaweza” huepuka kuvifanya kuwa utabiri mtupu au amri inayolazimisha, ingawa umbo la Kiebrania linaweza kutafsiriwa kwa “utafanya.”
- issue: Picha ya ‘kula’ nyara
  choice: kula, pamoja na tanbihi ya ufafanuzi
  alternative: kutumia au kunufaika na
  rationale: Kudumisha “kula” kunahifadhi sitiari ya chanzo na mvutano wake wa kimaana; tanbihi inaonyesha matumizi mapana yanayowezekana bila kuyafanya kuwa maana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi mfululizo wa makundi na marudio ya wazo la nyara, huku alama ya tanbihi ikiwekwa baada ya neno linaloelezwa.
