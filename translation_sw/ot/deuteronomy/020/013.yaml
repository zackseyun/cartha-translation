base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/013.yaml
  text: And Yahweh your God will give it into your hand[a], and you shall strike down all its males with the edge of the sword.
translation:
  language: sw
  text: Yahwe, Mungu wako, atautia mkononi mwako, nawe utawaua watu wake wote wa kiume kwa makali ya upanga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinataja hasa “wote wa kiume,” badala ya kutumia neno la jumla kama “watu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָהּ
  choice: atautia
  rationale: Kitenzi נתן chenye kiambishi cha yambwa cha kike umoja kinarejelea mji. Wakati ujao unaendeleza mfuatano wa matendo katika muktadha.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Muundo wenye kiambishi cha nafsi ya pili umoja wa kiume umetafsiriwa kwa usemi wa kawaida wa agano.
- source_word: בְּיָדֶךָ
  choice: mkononi mwako
  rationale: Hifadhi taswira ya Kiebrania ya kukabidhi mji chini ya mamlaka ya mtu; ni usemi unaoeleweka kwa Kiswahili.
- source_word: וְהִכִּיתָ
  choice: nawe utawaua
  rationale: Katika muktadha huu wa vita, Hifili ya נכה pamoja na upanga ina maana ya kupiga na kuua. Tafsiri hii inaonyesha wazi matokeo ya kitendo bila kukipunguza kuwa kushinda tu.
- source_word: כָּל זְכוּרָהּ
  choice: watu wake wote wa kiume
  rationale: זְכוּר hutaja jinsia ya kiume, si hadhi ya kijamii ya ‘wanaume’ pekee; kiambishi chake kinarejelea mji.
- source_word: לְפִי חָרֶב
  choice: kwa makali ya upanga
  rationale: Ni sawia ya kawaida na ya asili ya nahau ya Kiebrania, ambayo kihalisi ni ‘kwa kinywa cha upanga.’
theological_decisions:
- issue: Kutoa moja kwa moja amri ya vita inayohusishwa na tendo la Mungu bila kuilainisha au kuipanua
  choice: Kutaja kwamba Yahwe anautia mji mkononi mwao na kwamba watu wake wote wa kiume watauawa kwa makali ya upanga
  alternative: Kutumia ‘kuwashinda’ au kuongeza maelezo ya hukumu takatifu
  rationale: Kiebrania kinahusisha kukabidhiwa kwa mji na Yahwe na kinaagiza tendo lenye kuua dhidi ya wote wa kiume. Tafsiri inadumisha uzito huo bila ufafanuzi wa kiteolojia usiomo katika aya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mkononi mwako’ na ‘makali ya upanga’ zinahifadhi taswira za Kiebrania huku zikibaki wazi kwa msomaji wa kawaida.
