lexical_decisions:
- source_word: וְהָיָה כְּקָרָבְכֶם
  choice: Mtakapokaribia
  rationale: Muundo huu unaanzisha hali ya wakati ujao. Kiswahili cha wakati wenye masharti, “mtakapokaribia,” kinawasilisha kwa kawaida maana ya ‘wakati mtakapokaribia’ bila tafsiri ngumu ya neno kwa neno.
- source_word: אֶל הַמִּלְחָמָה
  choice: pigano
  rationale: מִלְחָמָה inaweza kumaanisha vita kwa ujumla au pigano maalumu. Muktadha wa kukaribia mapambano ya karibu unaunga mkono “pigano,” huku uwezekano wa “vita” ukihifadhiwa katika tanbihi.
- source_word: וְנִגַּשׁ
  choice: atajitokeza
  rationale: Kitenzi kina maana ya kukaribia au kuja mbele. Katika mazingira ya kuhani kusimama ili kulihutubia jeshi, “atajitokeza” ni ya kawaida na bado inadokeza kuja mbele.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Nomino ni ya umoja na maalumu; “kuhani” huiwasilisha kwa usahihi bila kuongeza cheo au maelezo yasiyokuwamo.
- source_word: וְדִבֶּר אֶל
  choice: na kusema na
  rationale: דבר katika muundo huu humaanisha kusema au kunena na mtu. “Kusema na” ni ya moja kwa moja na inaepuka kuongeza dhana ya hotuba rasmi ambayo si lazima.
- source_word: הָעָם
  choice: watu
  rationale: Kiebrania kinatumia neno pana “watu,” ingawa hapa linarejelea Waisraeli waliokusanyika kwa vita. Tafsiri inadumisha upana huo badala ya kulibadili kuwa “askari” au “jeshi.”
