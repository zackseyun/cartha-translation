base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/015.yaml
  text: Thus you shall do to all the cities that are very far from you[b][a], which are not among the cities of these nations.
translation:
  language: sw
  text: Utafanya vivyo hivyo kwa miji yote iliyo mbali sana nawe, ambayo si ya mataifa haya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ambayo si kutoka miongoni mwa miji ya mataifa haya”; maana ni kwamba miji hiyo si mali ya mataifa yaliyotajwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: vivyo hivyo
  rationale: Kielezi hiki kinaelekeza kwenye namna ya kutenda iliyoelezwa katika muktadha uliotangulia; “vivyo hivyo” ni Kiswahili cha kawaida na chenye nguvu ya maagizo.
- source_word: תַּעֲשֶׂה
  choice: utafanya
  rationale: Kauli ya wakati ujao katika sheria ina nguvu ya agizo; “utafanya” inadumisha muundo na sauti hiyo bila kuongeza ufafanuzi.
- source_word: לְכָל הֶעָרִים
  choice: kwa miji yote
  rationale: Kihusishi לְ kinaonyesha miji inayoathiriwa na kitendo; “kwa miji yote” ni ya asili katika Kiswahili.
- source_word: הָרְחֹקֹת מִמְּךָ מְאֹד
  choice: iliyo mbali sana nawe
  rationale: Huhifadhi maana ya umbali pamoja na msisitizo wa מְאֹד; upatanisho wa kisarufi unafuata nomino “miji.”
- source_word: אֲשֶׁר לֹא מֵעָרֵי
  choice: ambayo si miongoni mwa miji ya
  rationale: Matumizi ya partitive ya מִן yanaeleza kwamba miji hiyo haimo katika kundi linalotajwa; “si miongoni mwa” huwasilisha maana hiyo wazi.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: mataifa haya
  rationale: “Mataifa” linafaa kwa muktadha wa kisiasa na kijeshi na halileti maana maalumu ya baadaye ya “Wamataifa.”
- source_word: הֵנָּה
  choice: imewakilishwa katika “mataifa haya”
  rationale: Kiwakilishi hiki cha kike wingi kinaimarisha rejeo la karibu; katika Kiswahili nguvu yake inawasilishwa kikamilifu na “haya,” bila neno jingine.
theological_decisions:
- issue: Tofauti ya upeo kati ya miji ya mbali na miji ya mataifa yaliyotajwa katika muktadha
  choice: Kuitafsiri kama mpaka wa kisheria unaotofautisha miji ya mbali na miji ya mataifa haya.
  alternative: Kupanua mstari ili kueleza masharti ya kuzingira yaliyotangulia, au kuufanya useme kwa ujumla kuhusu miji ya kigeni.
  rationale: Mstari unaweka mpaka wa matumizi ya maagizo yaliyotangulia. Tafsiri inadumisha tofauti hiyo na uzito wake wa kijeshi na kisheria bila kuipunguza wala kuingiza maelezo kutoka mistari jirani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na wa kisheria; “vivyo hivyo” huunganisha agizo na muktadha uliotangulia. Alama ya tanbihi [a] imo katika matini kuu.
