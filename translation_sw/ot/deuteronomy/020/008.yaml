  text: וְ/יָסְפ֣וּ הַ/שֹּׁטְרִים֮ לְ/דַבֵּ֣ר אֶל הָ/עָם֒ וְ/אָמְר֗וּ מִי הָ/אִ֤ישׁ הַ/יָּרֵא֙ וְ/רַ֣ךְ הַ/לֵּבָ֔ב יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ וְ/לֹ֥א יִמַּ֛ס אֶת לְבַ֥ב אֶחָ֖י/ו כִּ/לְבָבֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/008.yaml
  text: Then the officers shall continue to speak to the people and say[a], ‘Who is the man who is fearful and fainthearted? Let him go and return to his house[b], lest he melt the heart of his brothers like his own heart.’
translation:
  language: sw
  text: 'Kisha maofisa wataendelea kuwaambia watu hivi: “Ni mwanamume gani aliye na hofu na moyo dhaifu?[a] Aondoke arudi nyumbani kwake, asije akafanya mioyo ya ndugu zake iyeyuke kama moyo wake mwenyewe.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi husema, “mwenye hofu na mwenye moyo laini.” Hapa “moyo dhaifu” humaanisha kukosa ujasiri.
    reason: lexical_alternative
  - marker: b
    text: “Ndugu zake” hapa ni Waisraeli wenzake, hasa wanajeshi wenzake.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָסְפוּ
  choice: wataendelea
  rationale: Kitenzi יסף kinapofuatwa na kitenzi-jina humaanisha kuendelea au kufanya jambo zaidi; ‘wataendelea’ ni Kiswahili cha kawaida kinachohifadhi mfuatano wa maagizo.
- source_word: הַשֹּׁטְרִים
  choice: maofisa
  rationale: Katika muktadha huu neno hili linamaanisha maofisa waliowekwa kusimamia mambo ya raia au jeshi, si polisi kwa maana ya kisasa.
- source_word: לְדַבֵּר אֶל־הָעָם וְאָמְרוּ
  choice: kuwaambia watu hivi
  rationale: Muundo huu wa Kiswahili unawasilisha kwa ufasaha maana ya kusema na watu na kuanzisha maneno yanayofuata bila marudio yasiyo ya kawaida.
- source_word: מִי הָאִישׁ
  choice: Ni nani
  rationale: Swali linamlenga mwanajeshi mmoja miongoni mwa wanaume waliokusanyika; ‘Ni nani’ ni ya kawaida na haihitaji kurudia neno ‘mtu’.
- source_word: הַיָּרֵא וְרַךְ הַלֵּבָב
  choice: aliye na hofu na moyo dhaifu
  rationale: Tafsiri hii inahifadhi sifa mbili za Kiebrania—kuwa na hofu na kuwa na moyo laini au dhaifu—bila kuzifanya kuwa sifa moja tu.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Aondoke arudi nyumbani kwake
  rationale: Vitenzi vina nguvu ya agizo linaloruhusu mtu huyo kuondoka na kurudi nyumbani; Kiswahili hiki ni cha asili na wazi.
- source_word: וְלֹא יִמַּס
  choice: asije akayeyusha
  rationale: Kitenzi cha ‘kuyeyuka’ hapa ni sitiari ya kupoteza ujasiri. Muundo ‘asije’ unatoa maana ya tahadhari au kusudi hasi, na ‘akayeyusha’ unaonyesha athari yake kwa wengine.
- source_word: לְבַב אֶחָיו
  choice: moyo wa ndugu zake
  rationale: Umoja wa ‘moyo’ umehifadhiwa kama katika Kiebrania, ambako neno hilo linaweza kueleza kwa ujumla ujasiri wa wenzake.
- source_word: כִּלְבָבוֹ
  choice: kama moyo wake mwenyewe
  rationale: Tafsiri inahifadhi ulinganisho na urudiaji wa neno ‘moyo’ uliopo katika chanzo.
theological_decisions:
- issue: Lugha ya kijinsia katika mazingira ya kijeshi
  choice: Kudumisha ‘ndugu zake’ katika matini
  alternative: wenzake au wanajeshi wenzake
  rationale: Kiebrania kinatumia neno la undugu la kiume katika mkusanyiko wa kijeshi. ‘Ndugu zake’ huhifadhi taswira ya kijamii ya chanzo, huku tanbihi ikifafanua matumizi yake.
- issue: Sitiari ya moyo kuyeyuka
  choice: 'Kuhifadhi sitiari: ‘akayeyusha moyo’'
  alternative: kuwavunja moyo au kuwafanya wapoteze ujasiri
  rationale: Sitiari ya Kiebrania ni wazi na ina nguvu katika Kiswahili; kuihifadhi hakufichi kwamba kinachozungumziwa ni kupotea kwa ujasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umerahisishwa kwa ufasaha bila kuondoa mfuatano wa hotuba, lugha ya kijeshi, wala sitiari ya moyo kuyeyuka.
