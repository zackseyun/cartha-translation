  text: But if it does not make peace with you[a], but makes war against you[b], then you shall besiege it.
translation:
  language: sw
  text: Lakini ikiwa mji huo hautafanya amani nawe, bali utapigana nawe, basi utauzingira.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם לֹא
  choice: Lakini ikiwa ... hauta-
  rationale: “Lakini ikiwa” huonyesha tofauti na matokeo ya amani katika mstari uliotangulia, huku ukanushaji ukiwasilishwa kwa kiambishi “-ta-” pamoja na “ha-” katika kitenzi.
- source_word: תַשְׁלִים עִמָּךְ
  choice: hautafanya amani nawe
  rationale: Hifili ya שׁלם hapa ina maana ya kuingia katika uhusiano wa amani au kufanya mapatano ya amani. “Kufanya amani nawe” ni ya kawaida, wazi, na inabaki karibu na muundo wa Kiebrania.
- source_word: וְעָשְׂתָה עִמְּךָ מִלְחָמָה
  choice: bali utapigana nawe
  rationale: Nahau ya Kiebrania ina maana ya kufanya au kupigana vita. “Utapigana nawe” ni Kiswahili cha kawaida na huhifadhi עִם, “nawe,” bila kulazimisha maana mahsusi zaidi ya “dhidi yako.”
- source_word: וְצַרְתָּ עָלֶיהָ
  choice: basi utauzingira
  rationale: Kitenzi צור pamoja na עַל hapa kinamaanisha kuuzingira mji kijeshi. “Utauzingira” huwasilisha agizo hilo kwa ufupi na kwa kawaida; kiambishi “-u-” kinarejelea mji.
- source_word: עָלֶיהָ
  choice: mji huo ... utauzingira
  rationale: Kiebrania kinatumia umbo la kike kwa kurejelea mji. Kiswahili huhitaji upatanisho wa ngeli ya “mji,” kwa hiyo “mji huo” na “utauzingira” hutambulisha rejeo kwa uwazi bila kubadili maana.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Mji huo” imewekwa wazi kwa sababu Kiswahili hakiwezi kutumia kiwakilishi kisicho na rejeo la ngeli kwa namna ileile ya Kiebrania; rejeo linatokana na mji unaotajwa katika muktadha uliotangulia. Muundo wa masharti na tofauti kati ya amani na vita umehifadhiwa.
