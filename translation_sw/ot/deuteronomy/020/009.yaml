translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeweka mfuatano wa wakati na muktadha wa kijeshi wazi bila kumgeuza עָם kuwa ‘wanajeshi.’ Alama ya tanbihi imewekwa baada ya kishazi kinachohusu kuteuliwa kwa makamanda kwa kuwa tanbihi inaeleza hasa kitenzi וּפָקְדוּ.
