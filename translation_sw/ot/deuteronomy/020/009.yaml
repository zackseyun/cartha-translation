  terminology: ‘Maafisa,’ ‘makamanda wa majeshi,’ na ‘watu’ zinafaa. ‘Watateua’ ni istilahi iliyo wazi kwa kitendo cha kuwaweka makamanda katika nafasi ya uongozi bila kudai maana finyu ya kukusanya kwa ukaguzi.
