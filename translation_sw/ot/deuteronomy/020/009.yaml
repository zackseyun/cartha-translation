  text: And when the officers have finished speaking to the people[a], they shall appoint commanders of armies at the head of the people.
translation:
  language: sw
  text: Maafisa watakapomaliza kusema na watu, watateua[a] makamanda wa majeshi kuwaongoza watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watawakusanya makamanda wa majeshi na kuwaweka juu ya watu.” Kitenzi cha Kiebrania kinaweza kumaanisha kuteua, kukusanya kwa ukaguzi, au kuweka katika mamlaka, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּכַלֹּת
  choice: watakapomaliza
  rationale: Muundo wa וְהָיָה pamoja na כְּ na kitenzi-jina unaanzisha kishazi cha wakati kinachoonyesha tendo kukamilika kabla ya tendo linalofuata; Kiswahili hiki ni cha kawaida na sahihi.
- source_word: הַשֹּׁטְרִים
  choice: maafisa
  rationale: Katika muktadha wa Kumbukumbu la Torati, neno hili linawahusu maafisa wenye wajibu wa kiutawala na wa kupanga watu; ‘maafisa’ halilibani kuwa waandishi tu.
- source_word: לְדַבֵּר אֶל־הָעָם
  choice: kusema na watu
  rationale: Huhifadhi maana ya moja kwa moja ya kusema kwa watu bila kuwataja kwa tafsiri finyu zaidi kuwa wanajeshi.
- source_word: וּפָקְדוּ
  choice: watawaweka
  rationale: פקד linaweza kumaanisha kuweka, kuteua, kukusanya kwa ukaguzi, au kuweka madarakani. Hapa, makamanda wakiwa kitu cha kitenzi na nafasi yao ya uongozi ikitajwa, ‘kuweka’ hufaa huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: שָׂרֵי צְבָאוֹת
  choice: makamanda wa majeshi
  rationale: ‘Makamanda’ huonyesha viongozi wa kijeshi, na ‘majeshi’ huhifadhi wingi wa צְבָאוֹת katika lugha ya sasa.
- source_word: בְּרֹאשׁ הָעָם
  choice: kuwaongoza watu
  rationale: Kirai hiki ni halisi ‘kichwani/mbele ya watu’ lakini katika muktadha kinaonyesha nafasi ya uongozi; ‘kuwaongoza watu’ ni Kiswahili cha asili kinachowasilisha kazi hiyo.
