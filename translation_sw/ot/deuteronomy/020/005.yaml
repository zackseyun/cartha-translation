base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/005.yaml
  text: Then the officers shall speak to the people[a], saying, ‘Who is the man who has built a new house and has not dedicated it? Let him go and return to his house, lest he die in the battle and another man dedicate it.’
translation:
  language: sw
  text: Kisha maafisa watawaambia watu, “Ni mwanamume gani ambaye amejenga nyumba mpya lakini hajaiweka wakfu[a]? Aende arudi nyumbani kwake, asije akafa vitani na mwanamume mwingine akaiweka wakfu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hajaizindua.” Kitenzi cha Kiebrania kinamaanisha kuanza rasmi kuitumia nyumba mpya, mara nyingi kwa kuhusisha kuiweka wakfu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁטְרִים
  choice: maafisa
  rationale: Katika muktadha huu wa kijeshi na kiutawala, neno hili linamaanisha watendaji waliowekwa rasmi, si waandishi kwa ujumla.
- source_word: הָעָם
  choice: watu
  rationale: Hili ndilo neno la moja kwa moja la Kiebrania; katika muktadha linawahusu watu waliokusanyika kwa ajili ya vita bila kuwataja kwa tafsiri pana zaidi kuwa wanajeshi.
- source_word: מִי הָאִישׁ
  choice: Ni mwanamume gani
  rationale: Huhifadhi umoja na jinsia ya usemi wa Kiebrania, ambao hapa unamhusu mwanamume anayestahili kwenda vitani.
- source_word: בָּנָה בַיִת חָדָשׁ
  choice: amejenga nyumba mpya
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo na nomino ya Kiebrania.
- source_word: וְלֹא חֲנָכוֹ
  choice: lakini hajaiweka wakfu
  rationale: Kitenzi חנך hapa kina maana ya kuweka nyumba wakfu au kuizindua kwa kuanza kuitumia rasmi. ‘Kuweka wakfu’ huhifadhi maana ya uwekaji rasmi huku tanbihi ikionyesha maana nyingine inayowezekana.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Aende arudi nyumbani kwake
  rationale: Miundo ya vitenzi vya Kiebrania ina nguvu ya agizo katika muktadha huu; Kiswahili cha hali ya kutaka kinaifikisha kwa ufupi na kwa kawaida.
- source_word: פֶּן
  choice: asije
  rationale: Muundo huu wa Kiswahili unaonyesha tahadhari dhidi ya jambo linaloweza kutokea, sawasawa na nguvu ya פֶּן.
- source_word: יָמוּת בַּמִּלְחָמָה
  choice: akafa vitani
  rationale: Ni usemi wa asili wa Kiswahili unaoeleza kufa katika mapigano ya vita yanayozungumziwa.
- source_word: וְאִישׁ אַחֵר
  choice: mwanamume mwingine
  rationale: Huhifadhi wazi umoja na jinsia ya Kiebrania badala ya kuugeuza kuwa ‘mtu mwingine.’
- source_word: יַחְנְכֶנּוּ
  choice: akaiweka wakfu
  rationale: Kurudia ‘kuweka wakfu’ kunahifadhi urudiaji wa mzizi חנך katika mstari huu.
