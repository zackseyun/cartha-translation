  text: לְמַ֗עַן אֲשֶׁ֨ר לֹֽא יְלַמְּד֤וּ אֶתְ/כֶם֙ לַ/עֲשׂ֔וֹת כְּ/כֹל֙ תּֽוֹעֲבֹתָ֔/ם אֲשֶׁ֥ר עָשׂ֖וּ לֵֽ/אלֹהֵי/הֶ֑ם וַ/חֲטָאתֶ֖ם לַ/יהוָ֥ה אֱלֹהֵי/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/018.yaml
  text: so that they may not teach you to do according to all their abominations that they have done for their gods[a], and you would sin against Yahweh your God.
translation:
  language: sw
  text: ili wasiwafundishe kutenda kulingana na machukizo yao yote waliyoyafanya kwa ajili ya miungu yao,[a] nanyi mkamkosea Yahwe, Mungu wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa miungu yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: ili
  rationale: Huanzisha kusudi la agizo lililotangulia; “ili” ni ya kawaida na huhifadhi nguvu ya kusudi.
- source_word: לֹא יְלַמְּדוּ אֶתְכֶם
  choice: wasiwafundishe
  rationale: Piel ya למד pamoja na ukanushi katika kishazi cha kusudi inaeleza kuzuia mataifa hayo yasiwafundishe Waisraeli.
- source_word: לַעֲשׂוֹת כְּכֹל
  choice: kufanya sawasawa na ... yote
  rationale: Huhifadhi wazo la kutenda kwa kufuata au kuiga jumla ya matendo yanayotajwa.
- source_word: תּוֹעֲבֹתָם
  choice: machukizo yao
  rationale: “Machukizo” huhifadhi uzito wa kimaadili na kidini wa תּוֹעֵבָה na inafaa katika mtindo wa Biblia wa Kiswahili.
- source_word: אֲשֶׁר עָשׂוּ
  choice: waliyoyafanya
  rationale: Kishazi hiki kinayafafanua machukizo kuwa matendo ambayo mataifa hayo yalifanya.
- source_word: לֵאלֹהֵיהֶם
  choice: kwa ajili ya miungu yao
  rationale: Katika muktadha wa ibada, ל inaweza kueleza matendo yaliyofanywa kwa ajili ya miungu; “kwa miungu yao” pia yawezekana na imehifadhiwa katika tanbihi.
- source_word: וַחֲטָאתֶם לַיהוָה
  choice: nanyi mkamtendee dhambi Yahwe
  rationale: Muundo huu unaendeleza matokeo yanayokusudiwa kuzuiwa; ל pamoja na חטא humtaja aliyekosewa, hivyo “kumtendea dhambi” ni Kiswahili cha asili zaidi kuliko tafsiri ya neno kwa neno yenye “dhidi ya.”
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Ni jina la agano linalomfafanua Yahwe na linahifadhi nafsi ya pili wingi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Uhusiano wa חטא pamoja na ל
  choice: mkamtendee dhambi Yahwe
  alternative: mkafanya dhambi dhidi ya Yahwe
  rationale: Tafsiri iliyochaguliwa humtaja Yahwe kuwa aliyekosewa bila kuongeza maelezo ya kiteolojia yasiyokuwamo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. “Machukizo” huhifadhi uzito wa istilahi ya Kiebrania, huku sentensi ikifuata mtiririko wa kawaida wa Kiswahili.
