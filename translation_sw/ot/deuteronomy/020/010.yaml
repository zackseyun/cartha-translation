translation:
  language: sw
  text: Utakapoukaribia mji ili kupigana dhidi yake, utaitangazia amani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utauita kwa ajili ya amani”; yaani, utoe mwito au pendekezo la amani kwa mji huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Utakapo-
  rationale: Hapa neno hili linaanzisha hali ya wakati katika maagizo ya kisheria; muundo wa “utakapo-” ni wa kawaida na wa asili katika Kiswahili.
- source_word: תִקְרַב
  choice: ukaribia
  rationale: Kitenzi קרב kinamaanisha kukaribia; “ukaribia” kinahifadhi wazo la kuelekea karibu na mji.
- source_word: עִיר
  choice: mji
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya umoja עִיר.
- source_word: לְהִלָּחֵם עָלֶיהָ
  choice: ili kupigana nao
  rationale: Muundo huu unaeleza kusudi la kuukaribia mji, yaani kupigana dhidi yake. “Nao” ni marejeo ya kawaida ya Kiswahili kwa mji bila kuuhusisha na jinsia ya kisarufi ya Kiebrania.
- source_word: וְקָרָאתָ אֵלֶיהָ
  choice: utauita
  rationale: קרא inaweza kumaanisha kuita au kutangaza. “Utauita” kinahifadhi tendo la kuita bila kulifanya kuwa tangazo rasmi kupita kiasi.
- source_word: לְשָׁלוֹם
  choice: uwe na amani
  rationale: Kirai hiki kwa uhalisi kinaelekea kwenye amani, huku katika muktadha kikimaanisha mwito au pendekezo la kufanya amani; tafsiri hii inahifadhi taswira ya msingi na tanbihi inaeleza maana ya kimuktadha.
