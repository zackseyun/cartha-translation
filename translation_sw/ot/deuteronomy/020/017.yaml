base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/017.yaml
  text: Instead[a], you must utterly destroy them—the Hittites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—as Yahweh your God has commanded you.
translation:
  language: sw
  text: Badala yake, lazima uwaangamize kabisa[a]—Wahiti, Waamori, Wakanaani, Waperizi, Wahivi na Wayebusi—kama Yahwe Mungu wako alivyokuamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “hakika utawaweka chini ya marufuku ya maangamizi”; kitenzi hiki humaanisha kuwaweka wakfu kabisa kwa maangamizi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Badala yake
  rationale: Katika muktadha, kiunganishi hiki kinaonyesha tofauti na agizo la mstari uliotangulia kuhusu miji ya mbali; “Badala yake” huonyesha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: הַחֲרֵם תַּחֲרִימֵם
  choice: lazima uwaangamize kabisa
  rationale: Muundo wa kitenzi pamoja na jina-kitenzi la mzizi huongeza mkazo wa agizo. “Uwaangamize kabisa” ni Kiswahili cha asili na wazi, huku tanbihi ikihifadhi maana maalumu ya kuwaweka chini ya heremu, yaani kuwatenga kikamilifu kwa maangamizi.
- source_word: הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי וְהַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: Wahiti, Waamori, Wakanaani, Waperizi, Wahivi na Wayebusi
  rationale: Majina haya ya makabila yametolewa kwa maumbo ya kawaida ya Kiswahili na kwa wingi, kwa kuwa majina ya Kiebrania yanawakilisha vikundi vya watu kwa ujumla.
- source_word: כַּאֲשֶׁר צִוְּךָ
  choice: kama ... alivyokuamuru
  rationale: Huu ni muundo wa kawaida wa Kiswahili unaoonyesha kwamba agizo hili linatekelezwa kulingana na amri ya awali.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Hili ni toleo la moja kwa moja na la kawaida la usemi wa agano wa Kiebrania.
theological_decisions:
- issue: Maana ya חרם katika agizo la vita
  choice: uwaangamize kabisa, pamoja na tanbihi kuhusu kuwaweka chini ya heremu
  alternative: uwaweke wakfu kabisa kwa maangamizi
  rationale: Kitenzi hiki hakimaanishi kuua tu, bali kuwaweka watu chini ya marufuku au wakfu wa maangamizi kwa amri ya Mungu. Matini kuu inatumia Kiswahili kilicho wazi na cha asili, na tanbihi inalinda maana hiyo ya kisheria na kidini.
- issue: Utoaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: “Yahwe” huhifadhi jina binafsi la Mungu lililo katika matini ya Kiebrania badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Lazima” huwasilisha nguvu ya agizo; majina ya makabila yametolewa kwa maumbo yanayotambulika kwa urahisi. Alama [a] imewekwa mara baada ya kirai kinachofafanuliwa.
