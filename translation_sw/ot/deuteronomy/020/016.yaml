base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/016.yaml
  text: But from the cities of these peoples that Yahweh your God is giving you as an inheritance[a], you shall not let any living thing remain alive.
translation:
  language: sw
  text: Lakini, kutoka katika miji ya watu hawa ambayo Yahweh Mungu wako anakupa kuwa urithi, usimwache kiumbe chochote[a] hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “chochote chenye pumzi.” Kiebrania: “kila chenye pumzi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Lakini
  rationale: Hapa neno hili linaonyesha tofauti na maagizo yaliyotangulia kuhusu miji iliyo mbali; “Lakini” huwasilisha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: מֵעָרֵי הָעַמִּים הָאֵלֶּה
  choice: katika miji ya watu hawa
  rationale: Muundo huu wa Kiswahili unaonyesha miji inayohusishwa na watu hawa na inayotengwa na kanuni iliyotangulia; “watu” huepuka maana ya kisasa ya mataifa kama dola.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika maandishi ya Kiebrania limeandikwa kwa namna ya kulitamka badala ya kubadilishwa kuwa cheo.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ נַחֲלָה
  choice: ambayo Yahweh Mungu wako anakupa kuwa urithi
  rationale: “Anakupa” huonyesha tendo linaloendelea la נֹתֵן, na “urithi” huhifadhi maana ya נַחֲלָה inayohusiana na nchi waliyopewa.
- source_word: לֹא תְחַיֶּה
  choice: usiache ... kiendelee kuwa hai
  rationale: 'Kauli hii hudumisha nguvu ya kisababishi ya kitenzi: kutokiruhusu kilicho hai kubaki hai.'
- source_word: כָּל נְשָׁמָה
  choice: kiumbe chochote
  rationale: Katika muktadha huu usemi unarejelea kila kiumbe chenye pumzi; tafsiri kuu ni ya kawaida kwa Kiswahili, huku taswira halisi ya Kiebrania ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano la Mungu, kwa hiyo limedumishwa kama jina badala ya kubadilishwa kuwa cheo.
- issue: Istilahi ya nchi ya agano katika נַחֲלָה
  choice: urithi
  alternative: milki
  rationale: “Urithi” huhifadhi uzito wa wazo la nchi waliyopewa katika agano bila kulipunguza kuwa umiliki wa kawaida.
- issue: Upeo wa כָּל נְשָׁמָה katika muktadha wa vita
  choice: kiumbe chochote
  alternative: chochote chenye pumzi
  rationale: Tafsiri haibadili usemi kuwa “mtu yeyote” tu, kwa kuwa Kiebrania kina usemi mpana wa “kila chenye pumzi”; tanbihi inaonyesha wazi maana hiyo halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa wazi na ya moja kwa moja, bila kupunguza ukali wa amri wala kuongeza ufafanuzi wa kimadhehebu.
