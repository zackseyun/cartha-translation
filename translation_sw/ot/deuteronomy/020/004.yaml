base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/004.yaml
  text: For Yahweh your God is the one who goes with you to fight for you against your enemies[a], to save you.
translation:
  language: sw
  text: Kwa maana Yahweh Mungu wenu ndiye anayekwenda pamoja nanyi, ili kuwapigania dhidi ya adui zenu na kuwaokoa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuwakomboa” au “kuwapa ushindi.” Kitenzi cha Kiebrania kinaweza kumaanisha kuokoa au kukomboa; hapa kimetumiwa katika muktadha wa vita.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya himizo lililotangulia, kwa Kiswahili cha kawaida na chenye mtiririko mzuri.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Linahifadhi jina binafsi la Mungu lililoandikwa katika Kiebrania badala ya kulibadili kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Ni umbo lenye kiambishi cha nafsi ya pili wingi, likiwaelekezea Waisraeli kwa pamoja.
- source_word: הַהֹלֵךְ
  choice: ndiye anayekwenda
  rationale: Kivumishi-tendo cha Kiebrania kina maana ya tendo la kawaida au linaloendelea; muundo huu unaihifadhi kwa Kiswahili cha asili.
- source_word: עִמָּכֶם
  choice: pamoja nanyi
  rationale: Inaeleza wazi kuwapo na kwenda kwa Mungu akiwa pamoja na watu wake.
- source_word: לְהִלָּחֵם לָכֶם
  choice: ili kuwapigania
  rationale: Inaunganisha kusudi la kupigana na maana ya kutenda kwa niaba yao kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: עִם אֹיְבֵיכֶם
  choice: dhidi ya adui zenu
  rationale: Katika muktadha wa vita, עִם inaonyesha upinzani; “dhidi ya” huwasilisha maana hiyo wazi.
- source_word: לְהוֹשִׁיעַ אֶתְכֶם
  choice: na kuwaokoa
  rationale: Kitenzi ישׁע katika Hifili kina maana ya kuokoa au kukomboa; hapa kinahusu wokovu kutoka kwa adui katika vita, bila kuondoa upana wake wa kibiblia.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Upeo wa maana ya לְהוֹשִׁיעַ katika mazingira ya vita
  choice: kuwaokoa
  alternative: kuwakomboa au kuwapa ushindi
  rationale: “Kuwaokoa” huhifadhi maana pana ya tendo la Mungu la kuokoa, huku muktadha ukionyesha kuwa wokovu huo unahusisha ukombozi na ushindi vitani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Kuwapigania” ni muundo wa asili unaowasilisha kupigana kwa niaba yao; tanbihi inadumisha upana wa maana ya kitenzi cha kuokoa.
