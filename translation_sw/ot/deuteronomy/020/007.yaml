  text: וּ/מִֽי הָ/אִ֞ישׁ אֲשֶׁר אֵרַ֤שׂ אִשָּׁה֙ וְ/לֹ֣א לְקָחָ֔/הּ יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ פֶּן יָמוּת֙ בַּ/מִּלְחָמָ֔ה וְ/אִ֥ישׁ אַחֵ֖ר יִקָּחֶֽ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/007.yaml
  text: And who is the man who has become engaged to a woman and has not taken her? Let him go and return to his house[c][b][a], lest he die in the battle and another man take her.
translation:
  language: sw
  text: Ni mwanamume gani ambaye amemposa[a] mwanamke lakini bado hajamwoa[b]? Aondoke, arudi nyumbani kwake, asije akafa vitani na mwanamume mwingine akamwoa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ameingia katika makubaliano rasmi ya kumwoa mwanamke.”
    reason: lexical_alternative
  - marker: b
    text: Maana yake ni kwamba bado hajakamilisha ndoa kwa kumchukua mwanamke huyo kuwa mke wake.
    reason: cultural_note
  - marker: c
    text: Kwa tafsiri ya karibu zaidi na nahau ya Kiebrania, “akamchukua kuwa mke wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: Ni mwanamume gani
  rationale: Inahifadhi muundo wa swali la kutangaza kundi jingine la wanaume wanaoruhusiwa kurudi nyumbani, pamoja na jinsia ya kiume iliyo wazi katika Kiebrania na muktadha wa kijeshi.
- source_word: אֵרַשׂ אִשָּׁה
  choice: amemposa mwanamke
  rationale: Kitenzi “posa” kinaonyesha uchumba rasmi unaoelekea kwenye ndoa, huku “mwanamke” kikihifadhi tofauti kati ya kuposa na kukamilisha ndoa.
- source_word: וְלֹא לְקָחָהּ
  choice: lakini bado hajamwoa
  rationale: Katika muktadha huu, לקח ina maana ya kumchukua mwanamke katika ndoa. “Hajamwoa” ni Kiswahili cha kawaida na kisicholeta dhana potovu ya kumchukua kimwili; “bado” huonyesha kuwa ndoa haijakamilishwa.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Aondoke, arudi nyumbani kwake
  rationale: Inawasilisha nguvu ya agizo na vitendo viwili vya Kiebrania kwa Kiswahili cha kawaida.
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: asije akafa vitani
  rationale: “Asije” huwasilisha onyo la matokeo yanayoweza kutokea; “vitani” ni usemi wa kawaida unaolingana na mapambano yanayozungumziwa.
- source_word: וְאִישׁ אַחֵר יִקָּחֶנָּה
  choice: na mwanamume mwingine akamwoa
  rationale: Inahifadhi mhusika wa kiume aliye wazi na maana ya ndoa ya לקח, huku ikisomeka kwa kawaida katika Kiswahili.
theological_decisions: []
