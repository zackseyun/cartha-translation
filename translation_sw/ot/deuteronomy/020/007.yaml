  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Amemposa” ni neno linaloeleweka kwa uchumba rasmi; “hajamwoa/akamwoa” linafafanua kwa kawaida maana ya nahau ya Kiebrania bila kuondoa tofauti kati ya kuposa na kukamilisha ndoa.
