  text: וְ/אָמַ֤ר אֲלֵ/הֶם֙ שְׁמַ֣ע יִשְׂרָאֵ֔ל אַתֶּ֨ם קְרֵבִ֥ים הַ/יּ֛וֹם לַ/מִּלְחָמָ֖ה עַל אֹיְבֵי/כֶ֑ם אַל יֵרַ֣ךְ לְבַבְ/כֶ֗ם אַל תִּֽירְא֧וּ וְ/אַֽל תַּחְפְּז֛וּ וְ/אַל תַּֽעַרְצ֖וּ מִ/פְּנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/003.yaml
  text: 'and say to them[a], ‘Hear, Israel: today you are drawing near to battle against your enemies. Do not let your heart grow faint. Do not fear, or panic[b], or be terrified because of them.’'
translation:
  language: sw
  text: na kuwaambia, “Sikiliza, Israeli! Leo mnakaribia kwenda vitani dhidi ya adui zenu. Mioyo yenu isilegee[a]. Msiogope, wala msitaharuki[b], wala msiingiwe na hofu kwa sababu yao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Msikate tamaa.” Nahau ya Kiebrania ni, kwa ukaribu zaidi, “Mioyo yenu isilegee/isiwe laini,” ikimaanisha kuporomoka kwa ujasiri.
    reason: lexical_alternative
  - marker: b
    text: Au, “Msiogope, wala msifadhaike, wala msipigwe na hofu mbele yao.” Makatazo matatu yanaongeza mkazo juu ya amri ya kutokubali hofu vitani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר אֲלֵהֶם
  choice: na kuwaambia
  rationale: Katika mfululizo wa maagizo ya kisheria, umbo hili linaendeleza hatua iliyotangulia; ‘na kuwaambia’ ni la kawaida na linaacha mhusika aeleweke kutokana na muktadha.
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: Sikiliza, Israeli!
  rationale: ‘Sikiliza’ huhifadhi mwito wa agano unaodai kusikia kwa makini na kuitikia, huku ‘Israeli’ ikihifadhi namna taifa linavyoitwa moja kwa moja.
- source_word: קְרֵבִים הַיּוֹם לַמִּלְחָמָה
  choice: Leo mnakaribia kwenda vitani
  rationale: Kitenzi-shirikishi kinaonyesha kuwa tukio liko karibu kutokea. ‘Kwenda vitani’ ni Kiswahili cha kawaida kwa kusogea kuelekea mapambano.
- source_word: עַל אֹיְבֵיכֶם
  choice: dhidi ya adui zenu
  rationale: Katika muktadha wa vita, עַל huonyesha upinzani; ‘dhidi ya’ huwasilisha maana hiyo wazi.
- source_word: אַל יֵרַךְ לְבַבְכֶם
  choice: Mioyo yenu isilegee
  rationale: Usemi huu unahusu kudhoofika kwa ujasiri. ‘Isilegee’ huhifadhi picha ya ndani inayodhoofika bila kuibadili moja kwa moja kuwa ufafanuzi wa ‘msikate tamaa.’
- source_word: אַל תִּירְאוּ
  choice: Msiogope
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida, na wazi ya katazo la kuogopa.
- source_word: וְאַל תַּחְפְּזוּ
  choice: wala msifadhaike
  rationale: Katika mazingira ya vita, kitenzi kinaonyesha kuchanganyikiwa au kuvurugika kwa hofu, si kufanya haraka tu; ‘msifadhaike’ ni la asili na linafikisha taharuki hiyo.
- source_word: וְאַל תַּעַרְצוּ
  choice: wala msiingiwe na hofu
  rationale: Kitenzi kinaonyesha kupigwa na hofu kuu mbele ya adui. Usemi huu unaendeleza na kuimarisha mfululizo wa makatazo bila kuunganisha maneno yote ya hofu kuwa katazo moja.
- source_word: מִפְּנֵיהֶם
  choice: kwa sababu yao
  rationale: Ingawa kihalisi ni ‘mbele yao,’ hapa kirai kinaonyesha adui kuwa chanzo cha hofu; ‘kwa sababu yao’ ni Kiswahili cha kawaida kinachohifadhi uhusiano huo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Umoja wa picha ya Kiebrania ‘moyo wenu’ umetolewa kwa wingi wa kawaida wa Kiswahili, ‘mioyo yenu,’ kwa kuwa hotuba inaelekezwa kwa watu wengi. Mfululizo wa makatazo umehifadhiwa ili kuonyesha ongezeko la mkazo.
