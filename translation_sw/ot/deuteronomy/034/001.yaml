id: DEU.34.1
reference: Deuteronomy 34:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּ֨עַל מֹשֶׁ֜ה מֵֽ/עַרְבֹ֤ת מוֹאָב֙ אֶל הַ֣ר נְב֔וֹ רֹ֚אשׁ הַ/פִּסְגָּ֔ה אֲשֶׁ֖ר עַל פְּנֵ֣י יְרֵח֑וֹ וַ/יַּרְאֵ֨/הוּ יְהוָ֧ה אֶת כָּל הָ/אָ֛רֶץ אֶת הַ/גִּלְעָ֖ד עַד דָּֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/001.yaml
  text: 'Then Moses went up from the plains of Moab to Mount Nebo[a], to the top of Pisgah, which is opposite Jericho. And Yahweh showed him all the land: Gilead as far as Dan.'
translation:
  language: sw
  text: 'Kisha Musa akapanda kutoka nyanda za Moabu mpaka Mlima Nebo, kwenye kilele cha Pisga, kinachotazamana na Yeriko. Yahwe akamwonyesha nchi yote: Gileadi mpaka Dani.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda
  rationale: Kitenzi עלה kinaonyesha mwendo wa kwenda juu; “akapanda” ni cha kawaida na kinahifadhi mwelekeo huo.
- source_word: מֵעַרְבֹת מוֹאָב
  choice: kutoka nyanda za Moabu
  rationale: עַרְבוֹת hapa ni eneo tambarare la Moabu; “nyanda” ni tafsiri ya asili na inayoeleweka katika Kiswahili.
- source_word: הַר נְבוֹ
  choice: Mlima Nebo
  rationale: Muundo הַר pamoja na jina la mahali hutafsiriwa kwa kawaida kuwa “Mlima Nebo.”
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: kwenye kilele cha Pisga
  rationale: רֹאשׁ katika muktadha huu humaanisha sehemu ya juu au kilele; tafsiri hii ni wazi bila kulazimisha kama Pisga ni jina la kilele au eneo la mlima.
- source_word: אֲשֶׁר עַל־פְּנֵי יְרֵחוֹ
  choice: kinachotazamana na Yeriko
  rationale: עַל־פְּנֵי katika maelezo ya kijiografia huonyesha mahali panapoelekeana au kutazamana na pengine.
- source_word: וַיַּרְאֵהוּ יְהוָה
  choice: Yahwe akamwonyesha
  rationale: Hifili ya ראה ina maana ya kusababisha kuona, na “akamwonyesha” ndiyo namna ya kawaida ya kusema hivyo kwa Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne linawakilishwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: כָּל־הָאָרֶץ
  choice: nchi yote
  rationale: הָאָרֶץ hapa ni nchi inayoonekana katika muktadha, si dunia nzima.
- source_word: אֶת־הַגִּלְעָד עַד־דָּן
  choice: Gileadi mpaka Dani
  rationale: Kirai hiki kinaanza kufafanua eneo lote aliloonyeshwa Musa; “mpaka” kinahifadhi mpaka wa kijiografia unaoonyeshwa na עַד.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la agano; kulitaja kama “Yahwe” kunatofautisha jina hilo na cheo “Bwana” bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Maana ya וַיַּרְאֵהוּ
  choice: akamwonyesha
  alternative: akamsababisha aione
  rationale: Umbo la kisababishi linaweza kusemwa wazi kuwa “akamsababisha aione,” lakini “akamwonyesha” linatoa maana hiyo kwa Kiswahili cha kawaida bila kuondoa tendo la Mungu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi na hadhi inayofaa maandiko. Majina ya mahali yametolewa kwa maumbo yaliyozoeleka: Moabu, Nebo, Pisga, Yeriko, Gileadi na Dani. Hakuna tanbihi iliyowekwa kwa sababu chaguo la “akamwonyesha” linawakilisha ipasavyo umbo la kisababishi na halihitaji mbadala ili kuhifadhi maana.'
