  text: וַ/יִּקְבֹּ֨ר אֹת֤/וֹ בַ/גַּיְ֙ בְּ/אֶ֣רֶץ מוֹאָ֔ב מ֖וּל בֵּ֣ית פְּע֑וֹר וְ/לֹֽא יָדַ֥ע אִישׁ֙ אֶת קְבֻ֣רָת֔/וֹ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/006.yaml
  text: And he buried him in the valley in the land of Moab[a], opposite Beth-peor[b], and no one knows his burial place to this day.
translation:
  language: sw
  text: Akamzika bondeni katika nchi ya Moabu[a], mkabala na Beth-peori, na mpaka leo hakuna mtu anayejua mahali alipozikwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiima cha “akamzika” hakikutajwa katika aya hii; muktadha uliotangulia unaelekeza kwa Bwana.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּר אֹתוֹ
  choice: Akamzika
  rationale: Kitenzi cha Kiebrania ni cha kutenda, nafsi ya tatu umoja wa kiume, na kiima hakikutajwa wazi katika aya hii. Kiswahili ‘akamzika’ huhifadhi tendo na kiima kisichotajwa; muktadha wa aya iliyotangulia humwelekeza msomaji kwa Bwana.
- source_word: בַגַּיְ
  choice: bondeni
  rationale: גַּיְ humaanisha bonde au korongo. ‘Bondeni’ ni neno la kawaida na linalofaa kwa mazingira haya.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: katika nchi ya Moabu
  rationale: Tafsiri hii huhifadhi usemi halisi wa Kiebrania ‘nchi ya Moabu’ bila kuufupisha kuwa ‘Moabu’ pekee.
- source_word: מוּל
  choice: mkabala na
  rationale: Neno hili huonyesha mahali panapokabiliana na pengine. ‘Mkabala na’ ni Kiswahili cha sasa, chenye heshima na sahihi kijiografia.
- source_word: בֵּית פְּעוֹר
  choice: Beth-peori
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa. Umbo ‘Beth-peori’ linafuata matumizi yanayoeleweka katika majina ya Biblia ya Kiswahili.
- source_word: וְלֹא יָדַע אִישׁ
  choice: lakini mpaka leo hakuna mtu anayejua
  rationale: Ingawa kiunganishi ni ‘na’, katika muktadha huu Kiswahili ‘lakini’ huonyesha kwa kawaida zaidi utofauti kati ya maziko na kutokujulikana kwa mahali pake. אִישׁ ina nguvu ya jumla hapa, kwa hiyo ‘hakuna mtu’ ni ya asili na huwasilisha maana bila kudokeza wanaume pekee.
- source_word: קְבֻרָתוֹ
  choice: mahali alipozikwa
  rationale: Katika muktadha nomino hii inaelekeza kwenye mahali pa maziko. ‘Mahali alipozikwa’ ni wazi na ya kawaida kuliko usemi mzito ‘mahali pa maziko yake’.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi nguvu ya wakati inayoendelea kutoka mtazamo wa msimulizi.
theological_decisions:
- issue: Utambulisho wa kiima katika ‘akamzika’
  choice: Kuacha kiima bila kutajwa wazi katika matini kuu
  alternative: Kutaja wazi ‘Bwana akamzika’ au kutumia kauli ya kutendwa ‘akazikwa’
  rationale: Muktadha wa aya ya 5 unaonyesha kwa nguvu kuwa Bwana ndiye kiima, lakini aya ya 6 yenyewe haitaji kiima kwa jina. Kiswahili ‘akamzika’ huhifadhi hali hiyo bila kubadili kauli ya kutenda kuwa ya kutendwa.
- issue: Maana ya jumla ya אִישׁ
  choice: hakuna mtu
  alternative: hakuna mwanamume
  rationale: אִישׁ ni umoja wa kiume kwa umbo, lakini hapa hutumiwa kwa maana ya jumla. ‘Hakuna mtu’ ni Kiswahili cha kawaida kinachowasilisha dai kuwa hakuna yeyote anayejua, bila kuingiza kizuizi cha kijinsia kisichokusudiwa.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa optimal equivalence: kauli ya kutenda na kutotajwa kwa kiima vimehifadhiwa, huku ‘hakuna mtu’ na ‘mahali alipozikwa’ zikitumiwa kwa ufasaha wa kawaida. Alama ya tanbihi [a] imewekwa mara moja katika matini na inaeleza utata halisi wa kiima.'
