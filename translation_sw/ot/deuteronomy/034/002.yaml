  yaml_path: translation/ot/deuteronomy/034/002.yaml
  text: and all Naphtali[a], and the land of Ephraim and Manasseh, and all the land of Judah as far as the western sea,
translation:
  language: sw
  text: na Naftali yote, na nchi ya Efraimu na Manase, na nchi yote ya Yuda mpaka bahari ya magharibi,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “bahari ya mwisho” au “bahari ya nyuma.” Hii ni njia ya Kiebrania ya kuitaja bahari iliyoko magharibi, yaani Bahari ya Mediterania.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל נַפְתָּלִי
  choice: Naftali yote
  rationale: כָּל pamoja na jina la kabila hapa inaonyesha eneo lote la Naftali. “Naftali yote” ni fupi na ya kawaida katika orodha ya maeneo bila kuongeza neno lisilosemwa wazi kama “eneo.”
- source_word: אֶרֶץ אֶפְרַיִם וּמְנַשֶּׁה
  choice: nchi ya Efraimu na Manase
  rationale: אֶרֶץ hapa ni nchi au eneo. Muundo huu unaonyesha kwamba majina ya makabila hayo yanatumika kijiografia na unasikika kwa kawaida katika Kiswahili.
- source_word: כָּל אֶרֶץ יְהוּדָה
  choice: nchi yote ya Yuda
  rationale: Tafsiri hii inawakilisha wazi אֶרֶץ na kuhifadhi mkazo wa kifungu juu ya eneo lote la Yuda.
- source_word: עַד
  choice: mpaka
  rationale: Katika maelezo ya upeo wa eneo linaloonekana, עַד huonyesha mahali ambapo upeo huo unafikia; “mpaka” ni tafsiri ya kawaida na wazi.
- source_word: הַיָּם הָאַחֲרוֹן
  choice: bahari ya magharibi
  rationale: Kirai hiki kwa neno halisi ni “bahari ya mwisho/ya nyuma,” nahau ya Kiebrania inayorejelea bahari iliyoko magharibi. “Bahari ya magharibi” huwasilisha maana hiyo bila kuingiza jina maalumu “Bahari ya Mediterania” katika matini.
