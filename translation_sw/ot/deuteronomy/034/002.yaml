translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa matini ya Biblia. Kiunganishi “na” kimerudiwa ili kuhifadhi muundo wa orodha ya Kiebrania. Alama ya tanbihi imewekwa baada ya “bahari ya magharibi,” ambako maelezo yake yanahusika.
