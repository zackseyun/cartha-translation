base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/009.yaml
  text: And Joshua son of Nun was full of the spirit of wisdom[a], because Moses had laid his hands on him[b]. So the sons of Israel listened to him and did as Yahweh had commanded Moses.
translation:
  language: sw
  text: Yoshua mwana wa Nuni alikuwa amejaa roho ya hekima[a], kwa sababu Musa alikuwa amemwekea mikono. Basi wana wa Israeli[b] wakamsikiliza, wakafanya kama Yahwe alivyomwamuru Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa amejazwa na Roho ya hekima.” Kiebrania kinaweza kueleweka kwa ujumla kuwa alikuwa na roho ya hekima, au kwa namna mahsusi zaidi kuwa Mungu alikuwa amemwezesha.
    reason: alternative_reading
  - marker: b
    text: Au, “Waisraeli” au “watoto wa Israeli.” Kihalisi, “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָלֵא רוּחַ חָכְמָה
  choice: alikuwa amejaa roho ya hekima
  rationale: Muundo huu unaonyesha hali ya Yoshua kuwa mwenye ujazo wa hekima, huku ukihifadhi kirai cha Kiebrania “roho ya hekima” bila kuamua kimbele kama kinamaanisha tabia ya hekima au uwezeshaji maalumu wa Mungu.
- source_word: רוּחַ
  choice: roho
  rationale: Katika muktadha huu neno linahusu roho inayohusishwa na hekima. Herufi ndogo inalinda uwezekano wa uwezeshaji wa Mungu bila kulifanya moja kwa moja kuwa jina mahsusi la Roho Mtakatifu.
- source_word: סָמַךְ ... אֶת יָדָיו עָלָיו
  choice: alikuwa ameweka mikono yake juu yake
  rationale: Hii ni njia ya kawaida na inayoeleweka ya kueleza tendo rasmi la kuwekea mtu mikono. Wakati timilifu “alikuwa ameweka” unaonyesha kuwa tendo hilo lilitangulia hali iliyotajwa.
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: wakamsikiliza
  rationale: Kitenzi kinaweza kumaanisha kusikiliza kwa makini na pia kudokeza kutii. “Wakamsikiliza” huhifadhi maana ya msingi, na kishazi kinachofuata kinaonyesha utiifu wao kwa vitendo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Tafsiri hii inahifadhi lugha ya kifamilia ya Kiebrania na maana yake ya kihistoria ya watu waliotokana na Israeli, badala ya kuigeuza moja kwa moja kuwa jina la kitaifa.
- source_word: וַיַּעֲשׂוּ כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: na kufanya kama Yahwe alivyomwamuru Musa
  rationale: Hii ni Kiswahili cha kawaida kinachoonyesha kwamba matendo yao yalilingana na amri ambayo Yahwe alikuwa amempa Musa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetolewa kama jina binafsi badala ya kubadilishwa kuwa cheo kama “BWANA,” kwa kufuata ushahidi wa matini ya Kiebrania.
theological_decisions:
- issue: Ikiwa רוּחַ katika “roho ya hekima” ni rejeo la moja kwa moja kwa Roho Mtakatifu
  choice: roho ya hekima
  alternative: Roho ya hekima
  rationale: Matini inaonyesha kuwa Yoshua alipewa hekima kwa uwezeshaji unaohusiana na tendo la Musa la kumwekea mikono, lakini kirai cha Kiebrania hakilazimishi utambulisho wa moja kwa moja na Roho Mtakatifu. Herufi ndogo huhifadhi mvutano huo wa kiteolojia.
- issue: Jinsi ya kutafsiri בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: “Wana wa Israeli” huhifadhi taswira ya kifamilia na ya agano iliyomo katika Kiebrania, huku “Waisraeli” ikiwa namna ya kawaida zaidi ya kutaja kundi hilo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wakamsikiliza” kimechaguliwa badala ya “wakamtii” ili kishazi kinachofuata ndicho kionyeshe wazi utiifu. Alama ya tanbihi [b] imewekwa baada ya “wana wa Israeli,” mahali inapohusika, badala ya baada ya tendo la kuwekea mikono.
