base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/012.yaml
  text: and for all the mighty hand and for all the great awe that Moses did before the eyes of all Israel[a][b][c][d].
translation:
  language: sw
  text: na kwa matendo yote ya nguvu, na kwa matendo yote makuu ya kutisha ambayo Musa alifanya mbele ya macho ya Israeli yote.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “mkono wenye nguvu”; “wote” hutia mkazo juu ya jumla ya matendo hayo. Katika usemi wa Kiebrania, “mkono” hapa huashiria uwezo au utendaji wenye nguvu.
    reason: lexical_alternative
  - marker: b
    text: Au, “kitisho kikuu” au “mambo yenye kuamsha hofu kuu.” “Mbele ya macho ya Israeli yote” humaanisha kwamba yalifanywa wazi, taifa lote likiyaona.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְכֹל
  choice: na kwa ... wote / yote
  rationale: Muundo huu unaendeleza muhtasari wa sifa katika mstari uliotangulia; כֹל ina nguvu ya ujumla, huku upatanisho wa Kiswahili ukibadilika kulingana na nomino.
- source_word: הַיָּד הַחֲזָקָה
  choice: mkono wote wenye nguvu
  rationale: Inahifadhi taswira halisi ya Kiebrania ya ‘mkono wenye nguvu,’ ambapo mkono huwakilisha uwezo au utendaji. ‘Wote’ huonyesha nguvu ya כֹל katika kishazi.
- source_word: הַמּוֹרָא הַגָּדוֹל
  choice: matendo yote makuu ya kutisha
  rationale: מוֹרָא inaweza kumaanisha kitisho, hofu, au jambo lenye kuamsha hofu kuu. Katika muktadha wa mambo ambayo Musa ‘alifanya,’ tafsiri ya ‘matendo ... ya kutisha’ ni ya kawaida zaidi kwa Kiswahili, huku tanbihi ikihifadhi uwezekano wa maana ‘kitisho kikuu.’
- source_word: אֲשֶׁר עָשָׂה
  choice: ambayo Musa alifanya
  rationale: ‘Alifanya’ hufuata maana pana ya עָשָׂה bila kuongeza wazo la kuonyesha ambalo halijaelezwa moja kwa moja.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: לְעֵינֵי
  choice: mbele ya macho ya
  rationale: Inahifadhi taswira halisi ya nahau ya Kiebrania na kueleza kwamba mambo hayo yalitendwa hadharani, taifa likiyaona.
- source_word: כָּל יִשְׂרָאֵל
  choice: Israeli yote
  rationale: Inahifadhi maana ya taifa zima kwa usemi mfupi na unaoeleweka katika Kiswahili.
theological_decisions:
- issue: Asili ya matendo ya Musa katika sifa ya mwisho
  choice: Kuyawasilisha kama matendo yenye nguvu na ya kutisha yaliyofanywa wazi mbele ya taifa lote
  alternative: Kutafsiri kwa dhahania zaidi kuwa ‘nguvu zote kuu’ na ‘hofu kuu’
  rationale: Tafsiri inahifadhi ukuu na mvutano wa maneno ya Kiebrania bila kuamua kama nguvu hizo zinapaswa kufafanuliwa zaidi kitheolojia au kuhusishwa na fundisho la baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kurudia ‘na kwa’ umehifadhiwa ili kuonyesha kuwa mstari huu unaendeleza sentensi ya mstari uliotangulia.
