base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/004.yaml
  text: And Yahweh said to him[a], “This is the land that I swore to Abraham, to Isaac, and to Jacob, saying, ‘I will give it to your offspring.’ I have let you see it with your own eyes, but you will not cross over there.”
translation:
  language: sw
  text: Yahweh akamwambia, “Hii ndiyo nchi niliyowaapia Abrahamu, Isaka, na Yakobo, nikisema, ‘Nitaupa uzao wako[a].’ Nimekufanya uione kwa macho yako mwenyewe, lakini hutavuka kwenda huko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbegu yako.” Neno la Kiebrania lina umbo la umoja lakini hapa lina maana ya jamii ya watu wanaotokana na mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Linatunza jina la agano lililo katika maandishi ya Kiebrania badala ya kulibadili kuwa cheo.
- source_word: זֹאת הָאָרֶץ
  choice: Hii ndiyo nchi
  rationale: “Nchi” linafaa kwa nchi ya ahadi, na muundo huu wa Kiswahili unaonyesha utambulisho wenye mkazo wa זֹאת.
- source_word: נִשְׁבַּעְתִּי לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: niliyowaapia Abrahamu, Isaka na Yakobo
  rationale: “Kuapia” linaendeleza maana ya kiapo rasmi huku likisomeka kwa kawaida katika Kiswahili.
- source_word: לְזַרְעֲךָ
  choice: uzao wako
  rationale: “Uzao” huhifadhi umbo la umoja lenye maana ya jamii bila kulazimisha wingi wa “wazao.”
- source_word: אֶתְּנֶנָּה
  choice: Nitaupa uzao wako nchi hii
  rationale: Mpangilio huu wa Kiswahili unaonyesha wazi mpokeaji na kitu kinachotolewa, huku ukitunza ahadi ya wakati ujao.
- source_word: הֶרְאִיתִיךָ בְעֵינֶיךָ
  choice: Nimekuwezesha kuiona kwa macho yako mwenyewe
  rationale: “Nimekuwezesha kuiona” huonyesha hali ya kusababisha ya kitenzi, na “kwa macho yako mwenyewe” hudumisha mkazo wa ushuhuda wa moja kwa moja.
- source_word: וְשָׁמָּה לֹא תַעֲבֹר
  choice: lakini hutavuka kwenda huko
  rationale: “Lakini” huleta utofauti wa kimuktadha, na “hutavuka kwenda huko” hudumisha taswira ya kuvuka kuingia nchini.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yana jina la pekee la Mungu; “Yahweh” hulihifadhi moja kwa moja bila kulibadili kuwa cheo.
- issue: Maana ya זֶרַע katika ahadi kwa mababu
  choice: uzao wako
  alternative: wazao wako
  rationale: Neno la Kiebrania lina umbo la umoja lakini linaweza kutaja jamii nzima; “uzao” huhifadhi hali hiyo bila kufafanua zaidi ya maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “uzao wako” umetunza umoja wa Kiebrania na mvutano wake baada ya kutajwa kwa Abrahamu, Isaka na Yakobo, badala ya kuugeuza kimya kuwa wingi.
