base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/007.yaml
  text: Moses was one hundred twenty years old when he died[a]; his eye had not grown dim[b], and his vigor had not fled.
translation:
  language: sw
  text: Musa alikuwa na umri wa miaka mia moja na ishirini alipokufa; macho yake hayakuwa yamefifia[a], wala nguvu zake za mwili hazikuwa zimepungua[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uwezo wake wa kuona haukuwa umedhoofika.” Kiebrania kinasema kihalisi, “jicho lake halikuwa limefifia.”
    reason: lexical_alternative
  - marker: b
    text: Au “uchangamfu wake wa mwili haukuwa umepungua” au “nguvu zake za asili hazikuwa zimepungua.” Kiebrania hutumia nahau inayomaanisha kwamba ubichi au nguvu za mwili wake zilibaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֹשֶׁה
  choice: Musa
  rationale: Kiunganishi וּ kinaendeleza simulizi; katika Kiswahili mstari huu unasomeka kwa kawaida bila kuongeza neno la wazi kama “basi” au “na,” ambalo lingeweza kusisitiza zaidi kuliko chanzo.
- source_word: בֶּן מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: alikuwa na umri wa miaka 120
  rationale: Nahau ya Kiebrania ‘mwana wa miaka 120’ inaeleza umri. Uundaji huu ni wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: בְּמֹתוֹ
  choice: alipokufa
  rationale: Kihusishi pamoja na nomino ‘kifo’ na kiambishi cha nafsi kina maana ya wakati; “alipokufa” huiwasilisha kwa Kiswahili cha kawaida.
- source_word: לֹא כָהֲתָה עֵינוֹ
  choice: Macho yake hayakuwa yamefifia
  rationale: כָּהָה huonyesha kufifia au kudhoofika kwa uwezo wa kuona. Ingawa Kiebrania kina umoja ‘jicho lake,’ wingi “macho yake” ni nahau ya kawaida ya Kiswahili kwa uwezo wa kuona; umbo halisi limehifadhiwa katika tanbihi.
- source_word: וְלֹא נָס לֵחֹה
  choice: wala nguvu zake za mwili hazikuwa zimepungua
  rationale: לֵחַ hapa huelekea kumaanisha ubichi, uhai, au nguvu za mwili, na נוּס kihalisi ni ‘kukimbia/kuondoka.’ Tafsiri hii inawasilisha maana ya uimara wa mwili uliobaki bila kutumia usemi wa Kiswahili usio wa kawaida; taswira halisi na uwezekano wa ‘uhai’ zimeelezwa katika tanbihi.
