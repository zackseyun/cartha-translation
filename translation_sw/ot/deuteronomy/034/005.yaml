base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/005.yaml
  text: So Moses the servant of Yahweh died there in the land of Moab[a], according to the word of Yahweh.
translation:
  language: sw
  text: Basi Musa, mtumishi wa Yahwe, akafa huko katika nchi ya Moabu kwa amri ya Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “juu ya kinywa cha Yahwe”; nahau hii inaweza pia kutafsiriwa “kulingana na neno la Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: akafa
  rationale: 'Umbo la wayyiqtol linaendeleza mfululizo wa simulizi. Kiswahili hutumia kwa kawaida kiunganishi cha ngeli ya nafsi pamoja na wakati uliopita: “akafa.”'
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki hurejelea mahali palipotajwa katika muktadha uliotangulia; “huko” kinahifadhi rejeo hilo kwa lugha ya kawaida.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: עֶבֶד יְהוָה
  choice: mtumishi wa Yahwe
  rationale: Ingawa עֶבֶד inaweza kumaanisha mtumwa au mtumishi, hapa ni cheo cha heshima kinachoeleza uhusiano na utume wa Musa mbele za Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa kulinakili kwa umbo la Kiswahili badala ya kulibadilisha kuwa cheo kama “BWANA.”
- source_word: בְּאֶרֶץ מוֹאָב
  choice: katika nchi ya Moabu
  rationale: Tafsiri hii inahifadhi neno “nchi” na msisitizo wa kijiografia wa kirai cha Kiebrania.
- source_word: עַל פִּי יְהוָה
  choice: kulingana na neno la Yahwe
  rationale: Kirai hiki kwa maana halisi ni “juu ya kinywa cha Yahwe,” lakini ni nahau inayoweza kueleza jambo linalotendeka kulingana na neno au amri yake. Tafsiri kuu inahifadhi dhana ya “neno” bila kufanya Kiswahili kiwe kigumu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Andiko linatumia jina la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi badala ya kuweka cheo mahali pake.
- issue: Maana ya עֶבֶד katika cheo cha Musa
  choice: mtumishi
  alternative: mtumwa
  rationale: Katika muktadha huu neno hilo ni cheo cha heshima kwa Musa kama mtu aliyepewa utume na Yahwe; “mtumwa” lingesisitiza isivyofaa hali ya utumwa.
- issue: Maana ya עַל פִּי יְהוָה
  choice: kulingana na neno la Yahwe
  alternative: kwa amri ya Yahwe; kwa kinywa cha Yahwe
  rationale: Nahau inaweza kueleweka kuwa Musa alikufa kwa mujibu wa neno au amri ya Yahwe. Tafsiri kuu haiongezi ufafanuzi wa kimadhehebu, na tanbihi inahifadhi taswira halisi pamoja na njia nyingine ya kuitafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Basi” linaonyesha mwendelezo wa simulizi, na mpangilio “Musa mtumishi wa Yahwe” unasikika kwa kawaida bila kulifanya jina la cheo kuwa maelezo ya pembeni.
