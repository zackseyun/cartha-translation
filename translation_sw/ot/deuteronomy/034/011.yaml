  text: for all the signs and the wonders that Yahweh sent him to do in the land of Egypt[a], to Pharaoh and to all his servants and to all his land,
translation:
  language: sw
  text: kwa ishara zote na maajabu yote ambayo Yahweh alimtuma Musa afanye katika nchi ya Misri, kwa Farao, kwa watumishi wake wote, na kwa nchi yake yote[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “na dhidi ya nchi yake yote” au “na kotekote katika nchi yake.” Kihusishi cha Kiebrania hapa kinaweza kueleweka kwa maana tofauti za uhusiano.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָל הָאֹתוֹת וְהַמּוֹפְתִים
  choice: kwa ishara zote na maajabu yote
  rationale: Kihusishi לְ kinaendeleza utegemezi wa kisintaksia kutoka mstari uliotangulia; “kwa” kinadumisha uhusiano huo. “Ishara” na “maajabu” ni jozi ya kawaida na pana inayowakilisha אוֹת na מוֹפֵת bila kuongeza tafsiri ya kimadhehebu.
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה לַעֲשׂוֹת
  choice: ambayo Yahweh alimtuma kuyafanya
  rationale: Muundo huu unadumisha maana ya moja kwa moja ya שׁלח, yaani Yahweh kumtuma Musa, pamoja na kusudi lililoonyeshwa na לַעֲשׂוֹת.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: katika nchi ya Misri
  rationale: Tafsiri hii inafuata kikamilifu zaidi maneno ya Kiebrania kuliko “nchini Misri” na inafaa sajili yenye heshima ya simulizi.
- source_word: לְפַרְעֹה וּלְכָל עֲבָדָיו
  choice: kwa Farao, kwa watumishi wake wote
  rationale: “Kwa” kinahifadhi maana pana ya uhusiano au mwelekeo ya לְ. “Watumishi” ni tafsiri ya moja kwa moja ya עֲבָדִים, ingawa katika muktadha wa kifalme inaweza kuwahusisha maofisa.
- source_word: וּלְכָל אַרְצוֹ
  choice: na kwa nchi yake yote
  rationale: Tafsiri hii inabaki karibu na sintaksia ya Kiebrania na haichagui kimya kimya kati ya maana ya kuelekezwa dhidi ya nchi na maana ya kutendeka kotekote nchini.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yana jina binafsi la agano יהוה. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa kimadhehebu.
