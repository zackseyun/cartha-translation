base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/010.yaml
  text: And no prophet has arisen again in Israel like Moses[a], whom Yahweh knew face to face.
translation:
  language: sw
  text: Wala katika Israeli hajainuka tena nabii kama Musa[a], ambaye Yahweh alimjua uso kwa uso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bado”; kielezi cha Kiebrania kinaweza kumaanisha kwamba hadi wakati huo hakuna nabii kama Musa aliyekuwa ameinuka katika Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Wala
  rationale: “Wala” huendeleza hitimisho la simulizi huku ikibeba ukanushi bila kuongeza wazo la upinzani lisilomo wazi katika Kiebrania.
- source_word: קָם
  choice: hajainuka
  rationale: Kitenzi קום hapa kinaeleza kutokea au kuinuliwa kwa nabii. Kauli “hajainuka” inafaa kwa muhtasari unaotazama kipindi hadi wakati wa msimulizi.
- source_word: נָבִיא
  choice: nabii
  rationale: Hili ndilo neno la kawaida na la moja kwa moja la Kiswahili kwa נָבִיא.
- source_word: עוֹד
  choice: tena
  rationale: Katika muktadha huu, עוֹד huonyesha kwamba baada ya Musa hakutokea nabii mwingine kama yeye. “Tena” ni ya asili katika Kiswahili, huku uwezekano wa maana “bado” ukihifadhiwa katika tanbihi.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: Kihusishi ב hapa kinaonyesha eneo au jamii ambamo hakuna nabii wa kulinganishwa na Musa aliyeinuka.
- source_word: כְּמֹשֶׁה
  choice: kama Musa
  rationale: Huhifadhi ulinganisho wa moja kwa moja unaoletwa na כ.
- source_word: אֲשֶׁר יְדָעוֹ
  choice: ambaye Yahweh alimjua
  rationale: Musa ndiye mtendewa wa kitenzi “kujua”; muundo huu wa Kiswahili unaonyesha uhusiano huo kwa uwazi na kwa kawaida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa unukuzi “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: פָּנִים אֶל פָּנִים
  choice: uso kwa uso
  rationale: Huu ni msemo wa Kiswahili unaohifadhi taswira halisi ya Kiebrania na wazo la kukutana au kuwasiliana moja kwa moja.
theological_decisions:
- issue: Lugha yenye taswira ya kibinadamu kuhusu uhusiano wa Yahweh na Musa
  choice: Kuhifadhi msemo “uso kwa uso” bila kuufafanua zaidi
  alternative: “Yahweh alimjua moja kwa moja” au “Yahweh alimjua kibinafsi”
  rationale: Kiebrania kinatumia taswira halisi kueleza ukaribu wa pekee kati ya Yahweh na Musa. Tafsiri haiamui kimadhehebu ikiwa usemi huo unahusu umbo la kimwili, bali inadumisha mvutano na mwangwi wa maandiko mengine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa msomaji wa kawaida. Mpangilio “katika Israeli hajainuka tena” umechaguliwa ili sentensi isomeke kwa kawaida huku mkazo wa eneo la Israeli ukihifadhiwa.
