  text: na Negebu[a], na uwanda wa bonde la Yeriko[b], mji wa mitende, mpaka Soari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kusini.” Neno la Kiebrania linaweza kuwa jina la eneo la Negebu au maelezo ya upande wa kusini.
    reason: lexical_alternative
  - marker: b
    text: Au “uwanda wa Yeriko” badala ya “bonde la Yeriko.” Neno la Kiebrania humaanisha bonde pana au uwanda.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּגֶב
  choice: Negebu
  rationale: Katika orodha hii ya maeneo, neno hili linafanya kazi kama jina la eneo la kusini; umbo lililohamishwa kwa Kiswahili linahifadhi maana hiyo ya jina mahususi.
- source_word: הַכִּכָּר
  choice: Uwanda
  rationale: Katika matumizi ya kijiografia, neno hili hutaja eneo tambarare la bonde la Yordani. 'Uwanda' ni la asili kwa Kiswahili na linaweza kutumika kama jina la eneo hili.
- source_word: בִּקְעַת יְרֵחוֹ
  choice: bonde la Yeriko
  rationale: בִּקְעָה ni bonde pana au uwanda; 'bonde la Yeriko' linahifadhi sura ya kijiografia na kutofautisha kifungu hiki na הַכִּכָּר.
- source_word: עִיר הַתְּמָרִים
  choice: mji wa mitende
  rationale: Tafsiri hii inahifadhi moja kwa moja lakabu ya Yeriko na taswira ya miti ya mitende.
- source_word: עַד צֹעַר
  choice: mpaka Soari
  rationale: עַד huonyesha mpaka au ukomo wa eneo linaloonekana; 'mpaka Soari' ni usemi mfupi na wa kawaida wa Kiswahili.
- source_word: וְאֶת ... וְאֶת
  choice: na ... na
  rationale: Kurudia 'na' kunahifadhi mtindo limbikizi wa orodha ya maeneo bila kuiga kihalisi kiashiria cha yambwa cha Kiebrania.
