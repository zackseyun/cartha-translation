  yaml_path: translation/ot/deuteronomy/034/008.yaml
  text: And the sons of Israel wept for Moses in the plains of Moab thirty days; then the days of weeping[a] for the mourning of Moses were completed.
translation:
  language: sw
  text: Wanaisraeli wakamlilia Musa katika nchi tambarare za Moabu kwa siku thelathini; kisha siku za kilio katika maombolezo kwa ajili ya Musa zikaisha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa karibu zaidi na muundo wa Kiebrania: “siku za kilio cha maombolezo ya Musa zilikamilika.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְכּוּ
  choice: wakamlilia
  rationale: Kitenzi בכה humaanisha kulia; pamoja na mtu anayeliliwa, Kiswahili cha kawaida hutumia ‘kamlilia,’ kikionyesha kulia kwa sababu ya kifo cha Musa.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Wanaisraeli
  rationale: Ingawa muundo wa Kiebrania ni ‘wana wa Israeli,’ hapa ni jina la pamoja la watu wa Israeli. ‘Wanaisraeli’ ni la asili, wazi, na halidokezi kwamba wanaume pekee ndio waliomboleza.
- source_word: אֶת מֹשֶׁה
  choice: Musa
  rationale: Kihusishi cha yambwa אֶת pamoja na בכה humtaja mtu anayeliliwa; katika Kiswahili maana hiyo imo ndani ya ‘kumlilia Musa.’
- source_word: בְּעַרְבֹת מוֹאָב
  choice: katika nchi tambarare za Moabu
  rationale: עֲרָבוֹת hurejelea maeneo tambarare au nyika tambarare. ‘Nchi tambarare za Moabu’ inaeleza jiografia kwa Kiswahili kinachoeleweka.
- source_word: שְׁלֹשִׁים יוֹם
  choice: kwa siku thelathini
  rationale: Huu ni usemi wa moja kwa moja wa muda; ‘kwa’ huifanya sentensi iwe ya kawaida katika Kiswahili.
- source_word: וַיִּתְּמוּ
  choice: zikafika mwisho
  rationale: Kitenzi תם hapa huonyesha kwamba kipindi kilikamilika au kilikwisha. ‘Zikafika mwisho’ ni cha asili na hudumisha wazo la ukamilifu wa kipindi.
- source_word: יְמֵי בְכִי
  choice: siku za kumlilia
  rationale: Muundo huu ni kipindi kilichotawaliwa na kilio. ‘Kumlilia’ huunganisha kwa kawaida kitendo cha kulia na Musa, anayelengwa katika muktadha.
- source_word: אֵבֶל מֹשֶׁה
  choice: kumwombolezea Musa
  rationale: Muundo wa nomino unaonyesha maombolezo yanayohusiana na Musa, yaani maombolezo kwa ajili yake. Kitenzi ‘kumwombolezea’ ni cha kawaida na hutofautisha maombolezo mapana na kitendo cha kulia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi inayofaa Maandiko. Tafsiri imetumia ‘Wanaisraeli’ kwa jina la pamoja, na imewasilisha kwa lugha ya kawaida uhusiano uliofinyangwa katika maneno ya Kiebrania יְמֵי בְכִי אֵבֶל מֹשֶׁה; tanbihi huhifadhi muundo wake wa karibu zaidi.
