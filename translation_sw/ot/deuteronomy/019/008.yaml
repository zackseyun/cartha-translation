  text: וְ/אִם יַרְחִ֞יב יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת גְּבֻ֣לְ/ךָ֔ כַּ/אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶ֑י/ךָ וְ/נָ֤תַן לְ/ךָ֙ אֶת כָּל הָ/אָ֔רֶץ אֲשֶׁ֥ר דִּבֶּ֖ר לָ/תֵ֥ת לַ/אֲבֹתֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/008.yaml
  text: And if Yahweh your God enlarges your territory[a], as he swore to your fathers, and gives you all the land that he promised to give to your fathers,
translation:
  language: sw
  text: Na ikiwa Yahwe Mungu wako atapanua mipaka yako, kama alivyowaapia baba zako[a], na kukupa nchi yote ambayo aliahidi kuwapa baba zako,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mababu zako,” hapa na katika sehemu ya pili ya mstari. Kiebrania kinasema kihalisi “baba zako,” yaani mababa wa taifa la Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Na ikiwa
  rationale: Inaendeleza maagizo ya kisheria kutoka mstari uliotangulia na kuanzisha sharti.
- source_word: יַרְחִיב ... אֶת גְּבֻלְךָ
  choice: atapanua mipaka yako
  rationale: Kitenzi katika Hifili kina maana ya kupanua; hapa גְּבוּל inahusu mipaka au eneo la taifa. Usemi huu ni wa kawaida na unaendeleza picha ya mipaka inayosogezwa.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahwe Mungu wako
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe,” na kiambishi cha nafsi ya pili umoja katika אֱלֹהֶיךָ kimehifadhiwa kwa “Mungu wako.”
- source_word: כַּאֲשֶׁר נִשְׁבַּע
  choice: kama alivyowaapia
  rationale: Inarejelea kiapo ambacho Mungu aliwaapia mababa wa Israeli; muundo huu ni wa asili katika Kiswahili.
- source_word: לַאֲבֹתֶיךָ
  choice: baba zako
  rationale: Huhifadhi neno la Kiebrania lenye maana halisi ya “baba zako” na muktadha wake wa mababa wa taifa; “mababu zako” limetolewa kama maana mbadala katika tanbihi.
- source_word: וְנָתַן לְךָ
  choice: na kukupa
  rationale: Kitenzi hiki kinaendelea ndani ya sharti linaloelekezwa wakati ujao. Muundo wa “na kukupa” unategemea “ikiwa ... atapanua” kwa Kiswahili cha kawaida.
- source_word: כָּל הָאָרֶץ
  choice: nchi yote
  rationale: Hapa אֶרֶץ ni nchi iliyoahidiwa kwa Israeli, si dunia nzima.
- source_word: אֲשֶׁר דִּבֶּר לָתֵת
  choice: ambayo aliahidi kuwapa
  rationale: Ingawa דִּבֶּר kimsingi ni “alisema,” katika muktadha wa agano maneno hayo yana nguvu ya ahadi; “aliahidi” huwasilisha maana hiyo kwa uwazi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; “Yahwe” hulihifadhi kwa kutoholewa.
- issue: Tafsiri ya אבות
  choice: baba zako
  alternative: mababu zako
  rationale: Maandishi ya Kiebrania yanasema kihalisi “baba zako” na yanawarejelea mababa wa taifa la Israeli. Chaguo la “mababu zako” linaeleza maana ya kimuktadha bila jinsia maalumu ya neno la chanzo, kwa hiyo limehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mstari umeachwa kama kishazi cha sharti kisichokamilika kwa sababu sentensi inaendelea katika muktadha unaofuata.
