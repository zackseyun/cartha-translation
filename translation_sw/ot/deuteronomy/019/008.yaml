  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo wa sharti wa Kiebrania: Yahwe ndiye mtenda wa kupanua mpaka/eneo, kuapa kwa baba, na kutoa nchi yote. “Na kukupa” kwa kawaida hutegemea “ikiwa ... atapanua” na huhifadhi muendelezo wa protasi. Kishazi kimeachwa kikining’inia ipasavyo, kwa kuwa hukumu inaendelea katika mstari unaofuata.'
