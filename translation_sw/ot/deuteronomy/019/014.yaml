- from: Usisogeze alama ya mpaka wa jirani yako[a], ambayo watu wa zamani waliiweka katika urithi wako utakaourithi, katika nchi ambayo Yahwe Mungu wako anakupa uimiliki.
  to: Usisogeze alama ya mpaka wa jirani yako[a], ambayo waliotangulia waliiweka, katika urithi wako utakaourithi katika nchi ambayo Yahweh, Mungu wako, anakupa ili uimiliki.
  rationale: The revision clarifies that the established marker is located within the inherited allotment in the land God gives, without making the former people’s action syntactically govern the whole location phrase. It uses a more exact rendering for the earlier persons, retains the Hebrew inheritance wordplay naturally, and aligns the divine-name spelling with the project convention.
