base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/014.yaml
  text: You shall not move your neighbor’s boundary marker[a], which the former generations set, in your inheritance that you will inherit in the land that Yahweh your God is giving you to possess.
translation:
  language: sw
  text: Usisogeze alama ya mpaka wa jirani yako[a], ambayo waliotangulia waliiweka, katika urithi wako utakaourithi katika nchi ambayo Yahweh, Mungu wako, anakupa ili uimiliki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka.” Neno la Kiebrania linahusu mpaka wa ardhi uliowekwa kwa alama.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַסִּיג
  choice: usisogeze
  rationale: Hifili ya נסג hapa inakataza kuhamisha mpaka kwa lengo la kuingilia sehemu ya jirani. “Usisogeze” ni ya kawaida na haibainishi kupita kiasi mwelekeo wa uhamishaji.
- source_word: גְּבוּל
  choice: alama ya mpaka
  rationale: Katika sheria hii neno linahusu mpaka wa mali unaotambulishwa kwa alama inayoweza kuhamishwa. “Alama ya mpaka” huonyesha kwa wazi kitu kinachosogezwa.
- source_word: רֵעֲךָ
  choice: wa jirani yako
  rationale: Katika muktadha wa kisheria רֵעַ humaanisha mtu mwingine wa jamii, na “jirani yako” linafaa hasa katika suala la mipaka ya ardhi.
- source_word: גָּבְלוּ
  choice: waliiweka
  rationale: Kitenzi kinaonyesha kuweka au kuainisha mpaka. “Waliiweka” kinaendana kwa kawaida na “alama ya mpaka.”
- source_word: רִאשֹׁנִים
  choice: watu wa zamani
  rationale: Kivumishi cha wingi kinawarejelea waliotangulia ambao waliweka mipaka ya awali. “Watu wa zamani” ni wazi na hakiongezi dhana ya ukoo ambayo haijasemwa moja kwa moja.
- source_word: בְּנַחֲלָתְךָ
  choice: katika urithi wako
  rationale: “Urithi” huhifadhi maana ya kisheria na ya agano ya sehemu ya ardhi iliyogawiwa.
- source_word: תִּנְחַל
  choice: utakaourithi
  rationale: Tafsiri hii huhifadhi mwelekeo wa wakati ujao na urudiaji wa mzizi נחל uliopo pia katika “urithi wako.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: נֹתֵן לְךָ
  choice: anakupa
  rationale: Wakati wa sasa unaonyesha tendo la Mungu la kutoa nchi kama jambo linaloendelea na linalotambulisha muktadha huu.
- source_word: לְרִשְׁתָּהּ
  choice: uimiliki
  rationale: Kitenzi hiki kinaeleza kuichukua na kuishikilia nchi kuwa milki; “uimiliki” ni kifupi na cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יְהוָה. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sheria ulio wazi na wenye heshima. Urudiaji wa “urithi ... utakaourithi” umehifadhiwa kwa sababu unaakisi kwa makusudi mzizi mmoja wa Kiebrania, ingawa umetungwa kwa namna inayoeleweka katika Kiswahili.
