base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/021.yaml
  text: 'Your eye shall not pity: life for life[a], eye for eye, tooth for tooth, hand for hand[b], foot for foot.'
translation:
  language: sw
  text: 'Jicho lako lisihurumie: uhai kwa uhai[a], jicho kwa jicho, jino kwa jino, mkono kwa mkono, mguu kwa mguu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maisha kwa maisha.” Neno la Kiebrania hapa humaanisha uhai, si hasa “nafsi” au “roho” kwa maana ya baadaye ya kiteolojia.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָחוֹס
  choice: lisihurumie
  rationale: Kitenzi חוס kinaweza kumaanisha kuhurumia au kusaza. Katika muktadha huu wa sheria, “lisihurumie” ni Kiswahili cha kawaida kinachohifadhi ukali wa amri na tamathali ya jicho.
- source_word: עֵינֶךָ
  choice: Jicho lako
  rationale: Tafsiri hii inahifadhi nahau halisi ya Kiebrania, ambamo jicho ndilo kiima cha tendo la kuhurumia.
- source_word: נֶפֶשׁ
  choice: uhai
  rationale: Katika kauli נֶפֶשׁ בְּנֶפֶשׁ, neno hili linamaanisha uhai unaolinganishwa kisheria, wala si hasa “roho” kwa maana ya baadaye ya kiteolojia.
- source_word: בְּ
  choice: kwa
  rationale: Katika kila jozi, בְּ huonyesha ulinganifu au malipo yanayolingana. “Kwa” huunda kauli fupi na ya kawaida ya kisheria katika Kiswahili.
- source_word: עַיִן
  choice: jicho
  rationale: Ni kiungo cha mwili kinachotajwa moja kwa moja katika kauli hii ya kisheria.
- source_word: שֵׁן
  choice: jino
  rationale: Ni tafsiri sahihi na ya kawaida ya kiungo hiki cha mwili.
- source_word: יָד
  choice: mkono
  rationale: Hulingana moja kwa moja na neno la Kiebrania katika orodha ya majeraha ya mwili.
- source_word: רֶגֶל
  choice: mguu
  rationale: “Mguu” ndiyo maana ya kawaida na inayofaa katika mfuatano huu wa viungo vya mwili.
theological_decisions:
- issue: Iwapo kauli halisi ya malipo yanayolingana ihifadhiwe au ilainishwe kuwa kanuni ya jumla ya haki yenye uwiano
  choice: 'Kuhifadhi kauli halisi: “uhai kwa uhai, jicho kwa jicho, jino kwa jino, mkono kwa mkono, mguu kwa mguu.”'
  alternative: Adhabu ilingane na kosa.
  rationale: Kiebrania kinatoa kauli maalumu na thabiti ya kisheria. Kuibadili kuwa kanuni ya jumla kungeficha taswira yake halisi, mvutano wake wa kiteolojia, na uhusiano wake na vifungu vingine vya Torati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa urahisi. Nahau halisi “Jicho lako lisihurumie” imehifadhiwa kwa sababu picha yake inaeleweka na ni muhimu kwa mtindo wa chanzo. Kiambishi cha tanbihi [a] kimewekwa mara moja katika matini kuu.
