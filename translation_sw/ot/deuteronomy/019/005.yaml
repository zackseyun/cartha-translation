revisions:
- from: Lakini mtu akienda na mwenzake msituni kukata kuni, naye akainua mkono wake kwa shoka ili kuukata mti, halafu chuma cha shoka kikachomoka kutoka kwenye mpini[a] na kumpiga mwenzake, naye akafa, mtu huyo anaweza kukimbilia katika mojawapo ya miji hii na kuishi.
  to: Lakini mtu akiingia msituni pamoja na mwenzake kukata kuni, mkono wake ukilisukuma shoka ili kukata mti, halafu kichwa cha shoka kikachomoka kwenye mpini[a] na kumpiga mwenzake, naye akafa, mtu huyo atakimbilia katika mojawapo ya miji hii na kuishi.
  rationale: Marekebisho yanarejesha maana ya mwendo wa mkono wenye shoka, yanaweka wazi kichwa cha shoka kinachochomoka, na yanaepuka maana finyu ya uwezo katika “anaweza.” Tanbihi huhifadhi usemi wa Kiebrania wa “chuma” na “mbao” bila kuifanya matini kuu iwe ya kutatanisha.
