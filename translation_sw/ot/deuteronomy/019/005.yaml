base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/005.yaml
  text: But if a man goes with his neighbor into the forest to cut wood[a], and his hand swings the axe to cut down the tree, and the iron head slips from the handle and strikes his neighbor so that he dies, he may flee to one of these cities and live.
translation:
  language: sw
  text: Lakini mtu akiingia msituni pamoja na mwenzake kukata kuni, mkono wake ukilisukuma shoka ili kukata mti, halafu kichwa cha shoka kikachomoka kwenye mpini[a] na kumpiga mwenzake, naye akafa, mtu huyo atakimbilia katika mojawapo ya miji hii na kuishi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “chuma kikachomoka kutoka kwenye mbao.” Hapa “chuma” humaanisha kichwa cha shoka, na “mbao” humaanisha mpini wa shoka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: Lakini mtu aki-
  rationale: Katika muktadha wa sheria, kifungu hiki kinaanzisha mfano wa tukio linaloweza kutokea; muundo wa masharti wa Kiswahili ni wa asili na huhifadhi uhusiano wake na mstari uliotangulia.
- source_word: רֵעֵהוּ
  choice: mwenzake
  rationale: Katika sheria neno hili humaanisha mtu anayeshirikiana naye au mtu mwingine wa jamii, si lazima rafiki wa karibu; “mwenzake” ni wazi na la kawaida.
- source_word: בַיַּעַר
  choice: msituni
  rationale: Huwakilisha kwa kawaida eneo lenye miti au msitu.
- source_word: לַחְטֹב עֵצִים
  choice: kukata kuni
  rationale: Kirai kinaeleza shughuli ya ukataji wa mbao/kuni kwa ujumla. “Kukata kuni” ni Kiswahili cha kawaida katika muktadha huu.
- source_word: וְנִדְּחָה יָדוֹ בַגַּרְזֶן
  choice: akainua mkono wake kwa shoka
  rationale: Hueleza mwendo wa mkono unaotumia shoka. Tafsiri hii ni ya asili huku ikidumisha kutajwa kwa mkono na chombo.
- source_word: לִכְרֹת הָעֵץ
  choice: ili kuukata mti
  rationale: כרת hapa ni kukata mti, katika muktadha unaodokeza kuuangusha; “kuukata mti” ni wazi bila kuongeza maelezo yasiyotajwa moja kwa moja.
- source_word: וְנָשַׁל הַבַּרְזֶל מִן הָעֵץ
  choice: chuma cha shoka kikachomoka kutoka kwenye mpini
  rationale: Kihalisi ni ‘chuma kikachomoka kutoka kwenye mti/kuni’; katika muktadha, chuma ni kichwa cha shoka na sehemu ya mbao ni mpini. Tafsiri kuu hufafanua rejea huku tanbihi ikihifadhi usemi halisi.
- source_word: וּמָצָא אֶת רֵעֵהוּ
  choice: na kumpiga mwenzake
  rationale: מצא katika muktadha wa kitu kinachofikia shabaha humaanisha kumfikia na kumpiga mtu.
- source_word: וָמֵת
  choice: naye akafa
  rationale: Huhifadhi matokeo ya tukio na kubainisha kwa mtiririko wa Kiswahili kwamba mwenzake ndiye anayekufa.
- source_word: הוּא יָנוּס
  choice: mtu huyo anaweza kukimbilia
  rationale: Katika sheria hii kauli hiyo humpa muuaji asiye na kukusudia nafasi ya ulinzi; “anaweza” huonyesha ruhusa au uwezekano huo bila kuifanya amri ya lazima.
- source_word: וָחָי
  choice: na kuishi
  rationale: Huhifadhi maana ya kuendelea kuwa hai kwa kupata hifadhi katika mji.
