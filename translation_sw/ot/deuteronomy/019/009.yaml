language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּֽי תִשְׁמֹר֩ אֶת כָּל הַ/מִּצְוָ֨ה הַ/זֹּ֜את לַ/עֲשֹׂתָ֗/הּ אֲשֶׁ֨ר אָנֹכִ֣י מְצַוְּ/ךָ֮ הַ/יּוֹם֒ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ וְ/לָ/לֶ֥כֶת בִּ/דְרָכָ֖י/ו כָּל הַ/יָּמִ֑ים וְ/יָסַפְתָּ֨ לְ/ךָ֥ עוֹד֙ שָׁלֹ֣שׁ עָרִ֔ים עַ֖ל הַ/שָּׁלֹ֥שׁ הָ/אֵֽלֶּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/009.yaml
  text: if you keep all this commandment by doing it[a], which I am commanding you today—to love Yahweh your God and to walk in his ways all your days—then you shall add for yourself three more cities besides these three,
translation:
  language: sw
  text: Ikiwa utalishika agizo hili lote kwa kulitekeleza[a], ambalo ninakuagiza leo—umpende Yahwe Mungu wako na utembee katika njia zake siku zako zote—ndipo utaongeza miji mingine mitatu zaidi ya miji hii mitatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kimetumia “agizo hili lote” katika umoja.
    reason: Kudumisha umbo la umoja la maandishi ya chanzo, ambalo lingeweza kutafsiriwa kwa wingi kwa urahisi katika muktadha huu.
lexical_decisions:
- source_word: כִּי
  choice: Ikiwa
  rationale: Hapa neno hili linaanzisha sharti linalohusu kuongezwa kwa miji ya makimbilio; “ikiwa” linaonyesha uhusiano huo wazi.
- source_word: תִשְׁמֹר
  choice: utalishika
  rationale: Katika muktadha wa agano, kitenzi שׁמר humaanisha kushika au kutii amri. “Kulishika” ni usemi wa heshima unaoeleweka katika Kiswahili cha Biblia bila kuongeza kielezi kisichopo katika Kiebrania.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: agizo hili lote
  rationale: Muundo huu unadumisha umoja wa מִצְוָה na nguvu ya ujumla ya כָּל kwa Kiswahili cha kawaida.
- source_word: לַעֲשֹׂתָהּ
  choice: kwa kulitekeleza
  rationale: Infinitivu inaonyesha kwamba kulishika agizo kunathibitishwa kwa kulitenda. “Kulitekeleza” ni ya asili na hudumisha kiwakilishi cha umoja.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ambalo ninakuagiza leo
  rationale: Kauli hii inadumisha tendo la Musa la kutoa agizo wakati huo na kurejelea “agizo” la umoja.
- source_word: לְאַהֲבָה
  choice: umpende
  rationale: Muundo huu unaonyesha maudhui ya agizo na unalingana kiasili na mhusika wa nafsi ya pili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: na kutembea katika njia zake
  rationale: Tafsiri hii inadumisha sitiari ya agano ya kutembea katika njia za Mungu badala ya kuifafanua tu kuwa mwenendo.
- source_word: כָּל הַיָּמִים
  choice: siku zako zote
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida inayosisitiza uaminifu wa maisha yote.
- source_word: וְיָסַפְתָּ לְךָ עוֹד שָׁלֹשׁ עָרִים
  choice: ndipo utakapojiongezea miji mingine mitatu
  rationale: “Utajiongezea” linaakisi לְךָ, huku “miji mingine mitatu” likieleza wazi kwamba miji hiyo inaongezwa kwa ile iliyokwisha tajwa.
- source_word: עַל הַשָּׁלֹשׁ הָאֵלֶּה
  choice: zaidi ya hii mitatu
  rationale: Kihusishi עַל kina maana ya nyongeza hapa; usemi huu ni wa kawaida na unaonyesha kwamba miji mipya itaongezwa kwa ile mitatu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi יְהוָה. “Yahwe” hulihifadhi kama jina badala ya kuliweka kwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Umoja wa “agizo” katika כָּל הַמִּצְוָה הַזֹּאת
  choice: agizo hili lote
  alternative: maagizo haya yote
  rationale: Kiebrania kimetumia nomino ya umoja. Tafsiri inadumisha umoja huo na kutatua ugumu wa kawaida wa Kiswahili kwa mpangilio “agizo hili lote,” bila kuamua kimafundisho upeo halisi wa agizo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaosomeka kwa urahisi. Sitiari ya “kutembea katika njia zake” na jina “Yahwe” vimedumishwa. Mistari mirefu imetenganishwa kwa vistari virefu ili kuonyesha maelezo ya yaliyomo katika agizo bila kuvunja sentensi ya sharti.
