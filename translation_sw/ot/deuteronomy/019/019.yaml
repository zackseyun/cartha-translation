  yaml_path: translation/ot/deuteronomy/019/019.yaml
  text: Then you shall do to him just as he intended to do to his brother[a]. So you shall purge the evil from your midst.
translation:
  language: sw
  text: Ndipo mtamtendea kama vile alivyokusudia kumtendea ndugu yake.[a] Hivyo utaondoa uovu kutoka katikati yako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwenza wake”; kwa Kiebrania, “ndugu yake,” neno linaloweza kumaanisha mshiriki mwenzao wa jumuiya ya agano katika muktadha huu wa kisheria.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hapa kinabadilika kutoka “ninyi” kwenda “wewe,” kikiiambia Israeli kama jumuiya moja.
    reason: source_number_shift
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: Ndipo mtamtendea
  rationale: Kitenzi ni cha nafsi ya pili wingi na kina nguvu ya agizo la kisheria. “Ndipo” linaonyesha mwendelezo wa hatua unaodokezwa na waw.
- source_word: לוֹ
  choice: -m- katika “mtamtendea”
  rationale: Kiwakilishi hiki kinamrejelea shahidi wa uongo; Kiswahili hukitia kwa kawaida ndani ya kitenzi.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Kinaonyesha ulinganifu wa moja kwa moja kati ya adhabu na kile kilichokusudiwa.
- source_word: זָמַם
  choice: alivyokusudia
  rationale: Neno hili lina maana ya kupanga au kukusudia, mara nyingi kwa nia mbaya. “Kukusudia” linafaa katika muktadha wa kisheria bila kuongeza maana isiyolazimu.
- source_word: לַעֲשׂוֹת
  choice: kumtendea
  rationale: Hii ni infinitivu inayokamilisha maana ya זָמַם; muundo wa Kiswahili “kumtendea” unaonyesha kwa kawaida tendo lililolengwa kwa mtu.
- source_word: לְאָחִיו
  choice: ndugu yake
  rationale: “Ndugu” linadumisha maana ya msingi ya אָח na pia linaweza kumaanisha mshiriki mwenzao wa jumuiya katika muktadha huu wa agano na sheria.
- source_word: וּבִעַרְתָּ
  choice: Hivyo utaondoa
  rationale: Katika kauli hii ya kisheria ya Kumbukumbu la Torati, בער humaanisha kuondoa uovu katika jumuiya, si kuuchoma kihalisi. Umoja wa nafsi ya pili umehifadhiwa.
- source_word: הָרָע
  choice: uovu
  rationale: Linahifadhi uzito wa kimaadili na mtindo wa kauli hii ya kawaida ya kisheria bila kuibana maana kuwa kosa maalumu pekee.
- source_word: מִקִּרְבֶּךָ
  choice: kutoka katikati yako
  rationale: Ni usemi wa jumuiya ya agano unaoonyesha kwamba uovu unaondolewa ndani ya Israeli; umoja wa kiwakilishi umehifadhiwa.
theological_decisions:
- issue: Maana ya kijumuiya ya אָחִיו katika sheria ya agano
  choice: ndugu yake
  alternative: mwenza wake / Mwisraeli mwenzake
  rationale: Kiebrania kina nomino ya kiume umoja, lakini katika sheria hii neno hilo linaweza kumaanisha mshiriki mwingine wa jumuiya ya agano. Matini kuu inadumisha taswira ya “ndugu,” huku tanbihi ikieleza upana wake.
- issue: Mabadiliko kutoka nafsi ya pili wingi kwenda umoja
  choice: mtamtendea ... utaondoa ... yako
  alternative: mtamtendea ... mtaondoa ... yenu
  rationale: Matini ya Kiebrania inaanza kwa wingi katika וַעֲשִׂיתֶם kisha inahamia umoja katika וּבִעַרְתָּ na מִקִּרְבֶּךָ. Tafsiri inadumisha mabadiliko hayo na kueleza kuwa umoja unaielekea Israeli kama jumuiya moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya matini ya kisheria. Muundo “mtamtendea” ni wa kawaida na unaeleweka, huku “utaondoa uovu kutoka katikati yako” ukihifadhi kwa makusudi umoja wa kijumuiya wa Kiebrania.
