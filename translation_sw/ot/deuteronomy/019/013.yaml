  yaml_path: translation/ot/deuteronomy/019/013.yaml
  text: Your eye shall not pity him[a], but you shall purge the innocent blood from Israel[b], and it shall go well with you.
translation:
  language: sw
  text: Jicho lako lisimhurumie[a], bali utaiondolea Israeli hatia ya damu ya asiye na hatia[b], na itakuwa vema kwako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jicho lako lisimwonee huruma.” Nahau ya Kiebrania hutaja jicho kuwa mahali pa huruma au kusamehe adhabu.
    reason: lexical_alternative
  - marker: b
    text: Yaani, ondoa kutoka kwa jumuiya ya Israeli hatia iliyotokana na kumwaga damu ya mtu asiye na hatia.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָחוֹס עֵינְךָ עָלָיו
  choice: Jicho lako lisimhurumie
  rationale: Inahifadhi taswira ya nahau ya Kiebrania inayolitaja jicho kuwa kitovu cha huruma. Kitenzi ‘kumhurumia’ ni cha kawaida na chenye hadhi katika Kiswahili; wazo la kutomwacha bila adhabu linaweza pia kueleweka katika muktadha huu wa hukumu.
- source_word: וּבִעַרְתָּ
  choice: bali utaondoa
  rationale: Katika sheria za Kumbukumbu la Torati, kitenzi hiki humaanisha kuondoa au kutokomeza kutoka katika jumuiya, si kuchoma kihalisi. ‘Kuondoa’ ni wazi na cha asili kwa Kiswahili.
- source_word: דַם הַנָּקִי
  choice: hatia ya damu isiyo na hatia
  rationale: Kiebrania kinasema kihalisi ‘damu isiyo na hatia,’ lakini katika kishazi cha kuiondoa kutoka Israeli maana yake ni hatia ya kijumuiya iliyotokana na kumwaga damu hiyo. Neno ‘hatia’ linawekwa wazi huku nahau ya damu ikihifadhiwa.
- source_word: מִיִּשְׂרָאֵל
  choice: kutoka Israeli
  rationale: Kihusishi מן kinaonyesha kuondolewa kutoka katika jumuiya ya agano; tafsiri hii ni ya moja kwa moja na ya kawaida.
- source_word: וְטוֹב לָךְ
  choice: nawe utafanikiwa
  rationale: Hii ni fomula ya Kumbukumbu la Torati inayoeleza matokeo mema ya utii. ‘Utafanikiwa’ ni fupi na ya asili, bila kuifanya iwe ahadi mahsusi ya utajiri.
- source_word: וְ
  choice: bali
  rationale: Ingawa kiunganishi cha Kiebrania kwa kawaida ni ‘na,’ hapa kinaunganisha amri ya kutokuwa na huruma isiyofaa na wajibu wa kutekeleza haki; ‘bali’ huonyesha uhusiano huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Asili ya amri kuhusu muuaji
  choice: Amri inaelekeza utekelezaji wa haki kwa mujibu wa sheria na kuondoa hatia ya damu kutoka kwa jumuiya, si kisasi cha mtu binafsi.
  alternative: Mstari unaweza kueleweka kimakosa kana kwamba unaruhusu kulipiza kisasi binafsi.
  rationale: Muktadha wa Kumbukumbu la Torati 19:11–12 unahusu muuaji wa kukusudia anayekabidhiwa kwa wenye mamlaka. Tafsiri haiongezi maelezo hayo katika matini, lakini inahifadhi muktadha wa kisheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Taswira ya ‘jicho’ imehifadhiwa kwa sababu inaeleweka na inaleta uzito wa kisheria; tanbihi zinafafanua nahau na maana ya hatia ya damu.
