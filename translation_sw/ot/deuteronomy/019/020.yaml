base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/020.yaml
  text: And those who remain shall hear and fear[c][b][a], and shall never again do such an evil thing in your midst.
translation:
  language: sw
  text: Nao waliosalia[a] watasikia na kuogopa, wala hawatafanya tena kamwe jambo baya kama hili[b] katikati yako.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wengine waliobaki.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kama jambo hili baya,” yaani tendo baya la aina hii.'
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania kinatumia umoja hapa, kikisema na Israeli kwa ujumla kama jamii moja: “katikati yako.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָרִים
  choice: waliosalia
  rationale: Neno hili ni kitenzi-jina cha Nifali kutoka שׁאר, likimaanisha watu wengine wanaobaki baada ya adhabu ya hukumu. “Waliosalia” ni Kiswahili cha kawaida na hudumisha maana hiyo.
- source_word: יִשְׁמְעוּ
  choice: watasikia
  rationale: שׁמע kimsingi humaanisha “kusikia.” Katika muktadha huu wa kisheria, kusikia kunahusisha kupata habari ya tukio; tafsiri haiongezi maneno yasiyokuwamo wazi katika Kiebrania.
- source_word: וְיִרָאוּ
  choice: na kuogopa
  rationale: ירא hapa inaeleza hofu inayotokana na adhabu na inayowazuia wengine kutenda uovu. “Kuogopa” ni ya asili na huhifadhi uzito wa onyo.
- source_word: וְלֹא יֹסִפוּ לַעֲשׂוֹת עוֹד
  choice: wala hawatafanya tena kamwe
  rationale: Muundo יסף pamoja na kitenzi-jina na עוֹד humaanisha kutorudia au kutoendelea kufanya jambo. “Hawatafanya tena kamwe” huwasilisha kwa Kiswahili athari ya katazo hilo la wakati ujao bila kufuata nahau ya Kiebrania kwa ugumu.
- source_word: כַּדָּבָר הָרָע הַזֶּה
  choice: jambo baya kama hili
  rationale: דבר hapa ni jambo au tendo, na kiambishi כְּ kina maana ya “kama.” Tafsiri hii huhifadhi wazo la tendo ovu la aina iliyotajwa.
- source_word: בְּקִרְבֶּךָ
  choice: katikati yako
  rationale: Hii ni nahau ya kijumuiya inayomaanisha ndani ya jamii ya Israeli. “Katikati yako” pia huhifadhi kiambishi cha nafsi ya pili umoja kilichoko katika Kiebrania.
theological_decisions:
- issue: Umoja wa anayesemeshwa katika בְּקִרְבֶּךָ
  choice: katikati yako
  alternative: miongoni mwenu
  rationale: Kiambishi cha Kiebrania ni cha nafsi ya pili, jinsia ya kiume, umoja, kikilitaja taifa la Israeli kwa ujumla kama kundi moja. Kutumia “yako” hudumisha umoja huo bila kuufasiri zaidi kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa heshima, ulio wazi na wenye uzito wa kisheria. Muundo wa sentensi ni wa kawaida kwa msomaji wa leo, huku “wala” na “katikati yako” vikidumisha sauti rasmi ya agano na hukumu.
