review_pass:
  verdict: revise
  source_fidelity: 'Kishazi cha kwanza kinatafsiriwa kwa uaminifu: ׳damu isiyo na hatia isimwagike׳ huakisi וְלֹא יִשָּׁפֵךְ דָּם נָקִי, na ׳katikati ya nchi yako׳ huwakilisha בְּקֶרֶב אַרְצְךָ. Jina Yahweh na dhana ya nchi kuwa urithi vimehifadhiwa. Hata hivyo, kishazi cha mwisho cha rasimu, ׳nawe usiwe na hatia ya damu,ʼ hubadilisha taswira ya Kiebrania ya hatia ya damu kuwa ‘juu yako’ kuwa usemi wa kuwa na hatia. Marekebisho yanahifadhi taswira hiyo na uhusiano wa kusudi/kinga.'
  naturalness: Kiswahili cha rasimu kinaeleweka na kina hadhi inayofaa kwa maandishi ya kisheria. ‘Wala hatia ya damu isiwe juu yako’ ni Kiswahili sanifu, cha asili katika rejista ya kibiblia-kisheria, na kinafuata kwa karibu zaidi muundo wa chanzo kuliko ‘usiwe na hatia ya damu.’ ‘Iwe urithi wako’ huweka wazi kwamba nchi ndiyo inayotolewa kama urithi.
  terminology: ‘Yahweh’ ni thabiti na sahihi kwa יְהוָה. ‘Hatia ya damu’ ni istilahi inayoeleweka kwa דָּמִים katika muktadha huu; tanbihi ihifadhi usemi wa karibu zaidi, ‘damu iwe juu yako,’ na ieleze kuwa ni wajibu/hatia kwa umwagaji wa damu isiyo na hatia.
  issues:
  - severity: medium
    issue: Kishazi cha mwisho hakihifadhi kikamilifu usemi wa ‘hatia ya damu kuwa juu yako.’
    rationale: וְהָיָה עָלֶיךָ דָּמִים hueleza hatia/wajibu wa damu ukiwa juu ya mhusika. ‘Nawe usiwe na hatia ya damu’ hufikisha matokeo kwa maana pana, lakini hupoteza taswira ya עַל (‘juu ya’) na huweka ukanushi moja kwa moja kwa mhusika. ‘Wala hatia ya damu isiwe juu yako’ hudumisha maana na muundo kwa Kiswahili cha kawaida.
  - severity: low
    issue: ‘Kuwa urithi’ inaweza kusomeka kwa uwazi zaidi kama ‘iwe urithi wako.’
    rationale: Nַחֲלָה inahusu nchi inayotolewa kama urithi. Kuongeza ‘wako’ na kutumia ‘iwe’ kunabainisha kiarifu kinachorejelea nchi bila kuongeza maana.
