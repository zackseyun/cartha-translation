  text: so that innocent blood may not be shed in the midst of your land that Yahweh your God is giving you as an inheritance[a], and bloodguilt would be upon you.
translation:
  language: sw
  text: ili damu isiyo na hatia isimwagike katikati ya nchi yako ambayo Yahweh, Mungu wako, anakupa iwe urithi wako, wala hatia ya damu isiwe juu yako[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa maana ya moja kwa moja: “na damu iwe juu yako.” Msemo huu wa Kiebrania humaanisha kuwajibika kwa kumwaga damu isiyo na hatia, yaani, kuwa na hatia ya damu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׁפֵךְ
  choice: isimwagike
  rationale: Kauli ya kutendwa ya kitenzi שׁפך ina maana ya damu ‘kumwagwa’; ‘isimwagike’ ni Kiswahili cha kawaida na chenye uzito wa kisheria katika muktadha wa mauaji.
- source_word: דָּם נָקִי
  choice: damu isiyo na hatia
  rationale: Huu ni msemo wa kisheria na kimaadili unaomaanisha damu ya mtu ambaye hastahili kuuawa; tafsiri hii inadumisha ufupi na nguvu ya msemo wa Kiebrania.
- source_word: בְּקֶרֶב אַרְצְךָ
  choice: katikati ya nchi yako
  rationale: קֶרֶב huonyesha sehemu ya ndani au katikati; ‘katikati ya nchi yako’ inadumisha maana ya mahali na mtindo wa heshima.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: anakupa kuwa urithi
  rationale: Kitenzi kishirikishi נֹתֵן kinaonyesha tendo linaloendelea, na נַחֲלָה ni milki inayorithiwa; usemi huu ni wa asili katika Kiswahili na unadumisha lugha ya nchi ya agano.
- source_word: וְהָיָה עָלֶיךָ דָּמִים
  choice: nawe usiwe na hatia ya damu
  rationale: Katika sheria, דָּמִים humaanisha wajibu wa kimaadili na kisheria unaotokana na kumwaga damu. Kiswahili hiki kinaonyesha kusudi la sheria kwa uwazi, huku tanbihi ikihifadhi taswira halisi ya ‘damu kuwa juu yako.’
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu; ‘Yahweh’ linadumisha jina hilo badala ya kuweka cheo mahali pake.
- issue: Upeo wa ukanushi katika kishazi cha mwisho
  choice: nawe usiwe na hatia ya damu
  alternative: na damu iwe juu yako
  rationale: Ingawa ukanushi haujarudiwa waziwazi kabla ya kishazi cha mwisho katika Kiebrania, mfuatano wa kusudi unaonyesha kwamba sheria inalenga kuzuia kumwagwa kwa damu isiyo na hatia na hatia inayotokana nayo. Tanbihi inadumisha muundo halisi wenye uwezekano wa kusomwa kwa namna nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kisheria lakini unaeleweka kwa msomaji wa kawaida; ‘hatia ya damu’ inadumisha istilahi muhimu ya kimaadili bila kuwa nzito kupita kiasi.
