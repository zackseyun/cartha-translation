  source_fidelity: Rasimu inawakilisha vizuri muundo wa wakati ujao unaotazamiwa, jina Yahwe, mataifa, nchi yao, na makao katika miji na nyumba zao. Hata hivyo, “ukawafukuza” huelekea kutafsiri גָּרַשׁ (‘kufukuza’) badala ya וִירִשְׁתָּם, ambayo hapa ina maana ya kuyamiliki mataifa hayo kwa kuyanyang’anya milki yao/kuyatwaa. Pia, kishazi cha nchi yao kinahitaji kurekebishwa ili Yahwe Mungu wako awe tena mtenda kama ilivyo katika Kiebrania.
  naturalness: “Mataifa ambayo anakupa nchi yao” linaweza kueleweka, lakini mpangilio “ambayo nchi yao Yahwe Mungu wako anakupa” ni wazi zaidi na unaepuka utata wa mtenda wa ‘anakupa.’ Muundo uliorekebishwa unabaki wa Kiswahili sanifu na huacha sentensi iendelee kwa aya inayofuata.
  terminology: “Yahwe Mungu wako,” “mataifa,” “nchi yao,” “miji yao,” na “nyumba zao” zinafaa. “Kuyamiliki” hufuata kwa karibu matumizi ya ירש yenye yambwa ya watu katika muktadha huu; haibadilishi tukio kuwa tendo la kufukuza pekee. Tanbihi ya ‘kukata’ ihamishwe ili iambatane na “atakapoyakatilia mbali,” neno linaloelezewa.
