base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/001.yaml
  text: When Yahweh your God cuts off the nations whose land Yahweh your God is giving you[a], and you dispossess them and dwell in their cities and houses,
translation:
  language: sw
  text: Yahwe Mungu wako atakapoyakatilia mbali[a] mataifa ambayo nchi yao Yahwe Mungu wako anakupa, nawe ukayamiliki na kukaa katika miji yao na nyumba zao,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “atakapoyaangamiza” au “atakapoyaondoa”; Kiebrania, “atakapoyakata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: atakapo-
  rationale: Katika muktadha huu wa sheria, neno hili linaanzisha hali ya wakati ujao inayotazamiwa kutokea, si uwezekano wa kudhaniwa tu.
- source_word: יַכְרִית
  choice: atakapoyakatilia mbali
  rationale: Usemi huu unahifadhi picha ya kitenzi cha Kiebrania כרת, ‘kata,’ huku ukieleza kuondolewa kwa mataifa kwa Kiswahili kinachoeleweka.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya umbo lenye kiambishi cha nafsi ya pili umoja.
- source_word: הַגּוֹיִם
  choice: mataifa
  rationale: Neno hili linafaa kwa makundi ya watu ambao Israeli wangewaondoa katika nchi, bila kuingiza maana za baadaye za kidini.
- source_word: נֹתֵן לְךָ אֶת אַרְצָם
  choice: anakupa nchi yao
  rationale: Wakati wa sasa wa ‘anakupa’ unaakisi umbo la kitenzi endelevu na uhakika wa zawadi hiyo ya Mungu; ‘nchi yao’ huhifadhi wazi kiwakilishi cha Kiebrania.
- source_word: וִירִשְׁתָּם
  choice: nawe ukawafukuza
  rationale: Kwa kuwa kitenzi ירש kina watu kama yambwa hapa, maana yake ni kuwaondoa kutoka katika milki yao, si kuwarithi.
- source_word: וְיָשַׁבְתָּ
  choice: na kukaa
  rationale: ‘Kukaa’ ni lugha ya kawaida na yenye hadhi inayoweza kumaanisha kuishi au kuweka makao mahali.
- source_word: בְעָרֵיהֶם וּבְבָתֵּיהֶם
  choice: katika miji yao na nyumba zao
  rationale: Tafsiri hii huhifadhi mahali pote pawili pamoja na viwakilishi vinavyoonyesha kwamba miji na nyumba zilikuwa za mataifa hayo.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kuondolewa kwa mataifa
  choice: atakapoyakatilia mbali
  alternative: atakapoyaangamiza
  rationale: Uchaguzi huu unahifadhi sitiari ya Kiebrania na kutomlazimisha msomaji kuelewa kuwa kila mtu aliuawa; maana pana inaweza kuwa kuyaondoa au kuyaangamiza.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unabaki wazi kuendelea katika mstari unaofuata, kama ilivyo katika maandishi ya Kiebrania.
