  text: וְ/כִֽי יִהְיֶ֥ה אִישׁ֙ שֹׂנֵ֣א לְ/רֵעֵ֔/הוּ וְ/אָ֤רַב ל/וֹ֙ וְ/קָ֣ם עָלָ֔י/ו וְ/הִכָּ֥ה/וּ נֶ֖פֶשׁ וָ/מֵ֑ת וְ/נָ֕ס אֶל אַחַ֖ת הֶ/עָרִ֥ים הָ/אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/011.yaml
  text: But if there is a man who hates his neighbor[a], and lies in wait for him, and rises up against him, and strikes him so that he dies, and he flees to one of these cities,
translation:
  language: sw
  text: Lakini ikiwa mtu anamchukia mwenzake, akamvizia, akamshambulia, akampiga hata akafa[a], kisha akakimbilia katika mojawapo ya miji hii,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akampiga pigo la mauti, naye akafa.” Kiebrania kinasema kihalisi “akampiga [katika] uhai/nafsi,” nahau inayomaanisha kumpiga pigo linaloua.
    reason: Msemo wa Kiebrania וְהִכָּהוּ נֶפֶשׁ ni nahau yenye maana ya kutoa pigo la kuua, na unaweza kutafsiriwa kwa njia kadhaa za asili katika Kiswahili.
lexical_decisions:
- source_word: וְכִי
  choice: Lakini ikiwa
  rationale: Huanzisha hali ya masharti inayotofautiana na kisa kilichotangulia cha kuua bila kukusudia.
- source_word: יִהְיֶה אִישׁ שֹׂנֵא לְרֵעֵהוּ
  choice: mtu anamchukia mwenzake
  rationale: ‘Mtu’ linafaa kwa kisa wakilishi cha kisheria, na ‘mwenzake’ linaonyesha mtu mwingine katika jamii bila kudokeza lazima urafiki au ukaribu wa makazi.
- source_word: וְאָרַב לוֹ
  choice: akamvizia
  rationale: Kitenzi hiki kinaonyesha kujificha na kumngojea mtu ili kumshambulia, hivyo kikionyesha kupanga tendo mapema.
- source_word: וְקָם עָלָיו
  choice: akamshambulia
  rationale: Nahau ya Kiebrania ni ‘akainuka dhidi yake’; ‘akamshambulia’ hutoa maana yake ya kitendo cha uhasama kwa Kiswahili cha kawaida.
- source_word: וְהִכָּהוּ נֶפֶשׁ וָמֵת
  choice: akampiga hata akafa
  rationale: Tafsiri hii inaeleza matokeo ya pigo na kuhifadhi kutajwa wazi kwa kifo, bila kubadilisha mlolongo wote kuwa kitenzi kimoja kama ‘akamuua’.
- source_word: וְנָס אֶל אַחַת הֶעָרִים הָאֵל
  choice: kisha akakimbilia katika mojawapo ya miji hii
  rationale: ‘Akakimbilia’ linaonyesha kukimbia kuelekea mahali pa hifadhi, na ‘miji hii’ hurejelea miji iliyotajwa katika muktadha wa karibu.
theological_decisions:
- issue: Tofauti ya kisheria kati ya mauaji ya kukusudia na kuua bila kukusudia
  choice: Kuhifadhi mlolongo wa chuki, kuvizia, kushambulia, kupiga, na kifo
  alternative: Kufupisha kwa kusema ‘akamuua kwa kukusudia’
  rationale: Muktadha unaonyesha wazi kupanga mauaji, lakini Kiebrania kinaeleza jambo hilo kwa mlolongo wa matendo. Kuhifadhi mlolongo huo huepuka kuingiza muhtasari wa kifasiri mahali pa maelezo ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa kisheria wenye heshima lakini unaoeleweka kwa wasomaji wa kawaida. Mlolongo wa vitenzi vya ‘aka-’ unaendeleza hatua zinazofuatana kwa njia ya asili katika Kiswahili.
