  text: פֶּן יִרְדֹּף֩ גֹּאֵ֨ל הַ/דָּ֜ם אַחֲרֵ֣י הָ/רֹצֵ֗חַ כִּי יֵחַם֮ לְבָב/וֹ֒ וְ/הִשִּׂיג֛/וֹ כִּֽי יִרְבֶּ֥ה הַ/דֶּ֖רֶךְ וְ/הִכָּ֣ה/וּ נָ֑פֶשׁ וְ/ל/וֹ֙ אֵ֣ין מִשְׁפַּט מָ֔וֶת כִּ֠י לֹ֣א שֹׂנֵ֥א ה֛וּא ל֖/וֹ מִ/תְּמ֥וֹל שִׁלְשֽׁוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/006.yaml
  text: otherwise the avenger of blood may pursue the manslayer[a], because his heart is hot, and overtake him because the way is long, and strike him dead, though he did not deserve the death penalty[b], since he had not hated him previously.
translation:
  language: sw
  text: La sivyo, mlipiza kisasi cha damu anaweza kumfuatia yule aliyeua bila kukusudia, kwa sababu moyo wake unakuwa moto kwa hasira,[a] akamfikia kwa kuwa njia ni ndefu, na akampiga na kumuua, ingawa huyo mtu hastahili hukumu ya kifo, kwa sababu hakuwa amemchukia hapo awali.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “moyo wake unakuwa moto”; nahau hii ya Kiebrania inaonyesha hasira kali.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, “tangu jana au juzi”; hii ni nahau ya Kiebrania yenye maana ya “hapo awali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: La sivyo
  rationale: Inaonyesha matokeo yanayokusudiwa kuzuiwa na mpango wa miji ya makimbilio, kwa Kiswahili cha kawaida na cha asili.
- source_word: גֹּאֵל הַדָּם
  choice: mlipiza-kisasi cha damu
  rationale: Inahifadhi dhana ya jukumu la jamaa aliyekuwa na wajibu wa kulipiza damu katika muktadha huu wa kisheria.
- source_word: הָרֹצֵחַ
  choice: yule aliyeua bila kukusudia
  rationale: Katika muktadha huu muuaji hakuwa na chuki ya awali na hana hukumu ya kifo; hivyo tafsiri hii inaepuka kumwita muuaji wa kukusudia.
- source_word: כִּי יֵחַם לְבָבוֹ
  choice: kwa sababu moyo wake umewaka kwa hasira
  rationale: Inahifadhi picha ya Kiebrania ya moyo kuwa moto huku ikieleza kwa kawaida kwamba joto hilo ni hasira kali.
- source_word: וְהִשִּׂיגוֹ
  choice: na kumfikia
  rationale: Ni usemi wa kawaida wa kumkamata mtu baada ya kumfuatia.
- source_word: כִּי יִרְבֶּה הַדֶּרֶךְ
  choice: kwa kuwa njia ni ndefu
  rationale: Inadumisha picha halisi ya umbali mrefu wa safari.
- source_word: וְהִכָּהוּ נָפֶשׁ
  choice: kisha akampiga na kumuua
  rationale: Inaonyesha kwa uwazi maana ya pigo linaloondoa uhai bila kuufanya usemi kuwa wa kizamani.
- source_word: וְלוֹ אֵין מִשְׁפַּט מָוֶת
  choice: ingawa huyo mtu hastahili hukumu ya kifo
  rationale: Inawasilisha maana ya kisheria kwamba aliyekimbia hakuwa chini ya hukumu halali ya kifo.
- source_word: כִּי לֹא שֹׂנֵא הוּא לוֹ
  choice: kwa sababu hakuwa amemchukia
  rationale: Inahifadhi msingi wa kisheria wa kutokuwapo kwa nia ovu iliyotokana na chuki ya awali.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: hapo awali
  rationale: Ni Kiswahili cha asili kinachowasilisha nahau ya Kiebrania yenye maana ya wakati uliotangulia.
theological_decisions:
- issue: Uwajibikaji wa mtu aliyeua bila kukusudia
  choice: hastahili hukumu ya kifo
  alternative: hana hukumu ya kifo
  rationale: Chaguo hili linaeleza kwa Kiswahili cha kawaida kwamba hukumu ya kifo haimpasi kisheria, bila kudai kwamba kitendo hicho hakina lawama yoyote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha mtiririko wa onyo la kisheria, huku maelezo ya nahau za Kiebrania yakiwekwa katika tanbihi.
