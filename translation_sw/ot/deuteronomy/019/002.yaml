translation:
  language: sw
  text: Utenge miji mitatu kwa ajili yako ndani ya nchi yako ambayo Yahweh, Mungu wako, anakupa ili uimiliki[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uirithi.” Kitenzi cha Kiebrania kinaweza kumaanisha “kumiliki” au “kurithi” katika miktadha ya kupewa nchi.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ עָרִים
  choice: miji mitatu
  rationale: עִיר inaweza kumaanisha mji mkubwa au mdogo; “miji” ni neno la kawaida na lenye heshima katika muktadha huu wa kisheria.
- source_word: תַּבְדִּיל לָךְ
  choice: ujitengee
  rationale: Muundo huu unaunganisha maana ya kutenga na wazo la kufanya hivyo kwa ajili yako mwenyewe, kwa Kiswahili cha asili na kifupi.
- source_word: בְּתוֹךְ אַרְצְךָ
  choice: ndani ya nchi yako
  rationale: “Ndani ya” huhifadhi maana ya eneo lililo katika mipaka ya nchi bila kutumia usemi mzito usio wa lazima.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahwe Mungu wako
  rationale: Jina la agano יְהוָה limetafsiriwa kwa namna ya kulitamka, “Yahwe,” huku אֱלֹהֶיךָ ikitafsiriwa moja kwa moja “Mungu wako.”
- source_word: נֹתֵן לְךָ
  choice: anakupa
  rationale: Kauli ya wakati unaoendelea ya Kiebrania inafaa kutolewa kwa wakati wa sasa, ikiwasilisha tendo la Mungu la kutoa nchi.
- source_word: לְרִשְׁתָּהּ
  choice: uimiliki
  rationale: Kitenzi ירשׁ katika muktadha wa kupewa nchi kinaweza kumaanisha kuimiliki au kuirithi; “uimiliki” ni wazi na cha kawaida, huku mbadala ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; “Yahwe” hulihifadhi kama jina bila kulibadili kuwa “Bwana.”
- issue: Maana ya ירשׁ katika ahadi ya nchi
  choice: uimiliki
  alternative: uirithi
  rationale: Muktadha unahusu nchi ambayo Mungu anawapa watu ili waichukue kuwa mali yao. Kwa kuwa kitenzi kinaweza pia kumaanisha “kurithi,” uwezekano huo umewekwa katika tanbihi badala ya kuondoa utata wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi “ujitengee” ni wa asili na unaendana na agizo la kisheria; sentensi imebaki wazi na rahisi kueleweka kwa msomaji wa kawaida.
