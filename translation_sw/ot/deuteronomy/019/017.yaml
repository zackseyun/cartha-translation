base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/017.yaml
  text: then the two men who have the dispute shall stand before Yahweh[b][a], before the priests and the judges who are in office in those days.
translation:
  language: sw
  text: 'Ndipo wale wanaume wawili walio na mgogoro[a] watasimama mbele za Yahwe, mbele ya makuhani na waamuzi watakaokuwapo siku hizo.[b]


    [a] Kiebrania kinaweza pia kutafsiriwa, “ambao kesi hiyo ni yao” au “ambao mgogoro uko kati yao.”

    [b] Au, “watakaokuwa wakihudumu siku hizo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaweza pia kutafsiriwa, “ambao kesi hiyo ni yao” au “ambao mgogoro uko kati yao.”
    reason: Neno רִיב na muundo אֲשֶׁר לָהֶם הָרִיב huruhusu maana ya mgogoro wenyewe au kesi ya kisheria iliyo kati ya wahusika.
  - marker: b
    text: Au, “watakaokuwa wakihudumu siku hizo.”
    reason: Kifungu “watakaokuwapo siku hizo” kinaweza kueleweka kimuktadha kuwa kinawataja makuhani na waamuzi waliokuwa wakihudumu rasmi wakati huo.
lexical_decisions:
- source_word: וְעָמְדוּ
  choice: Ndipo ... watasimama
  rationale: Kiunganishi וְ pamoja na kitenzi katika muktadha huu kinaendeleza hatua za utaratibu wa kisheria; “Ndipo” huonyesha mfuatano huo kwa Kiswahili cha kawaida, na “watasimama” huhifadhi maana ya kisheria ya kufika na kusimama mbele ya mamlaka.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: wale wanaume wawili
  rationale: Kiebrania kinataja wazi wanaume wawili. “Wale” huwaunganisha kwa kawaida na wahusika waliotajwa katika muktadha wa kesi.
- source_word: אֲשֶׁר לָהֶם הָרִיב
  choice: walio na mgogoro
  rationale: רִיב inaweza kumaanisha mgogoro, mabishano, au kesi ya kisheria. “Walio na mgogoro” ni ya asili na inaacha upana wa neno hilo; tanbihi inahifadhi miundo mingine inayowezekana.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: “Mbele za” ni usemi wa kawaida wa Kiswahili unaoonyesha kufika katika uwepo na mamlaka ya hukumu; jina la agano יהוה limetolewa kama “Yahwe.”
- source_word: לִפְנֵי הַכֹּהֲנִים וְהַשֹּׁפְטִים
  choice: mbele ya makuhani na waamuzi
  rationale: Tafsiri hii inahifadhi makundi yote mawili ya mamlaka—makuhani na waamuzi—bila kuyachanganya au kuongeza maelezo yasiyokuwamo katika matini.
- source_word: אֲשֶׁר יִהְיוּ בַּיָּמִים הָהֵם
  choice: watakaokuwapo siku hizo
  rationale: Hii inafuata kwa karibu maana ya kifungu cha Kiebrania, yaani wenye mamlaka watakaokuwapo wakati huo. Tanbihi inatoa tafsiri ya kimuktadha inayosisitiza huduma yao rasmi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini inatumia moja kwa moja jina la agano יהוה. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa dhehebu fulani.
- issue: Maana ya kusimama mbele za Yahwe katika utaratibu wa hukumu
  choice: mbele za Yahwe
  alternative: mbele ya Yahwe
  rationale: Usemi huu umehifadhiwa bila kueleza kwa ziada jinsi uwepo wa Yahwe unavyohusiana na makuhani na waamuzi; hivyo mvutano wa kimatini kati ya hukumu ya Mungu na utendaji wa viongozi wa kibinadamu haujatatuliwa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa msomaji wa kawaida. “Mgogoro” ni neno la sasa na pana kuliko “kesi” pekee; “waamuzi” ni wazi zaidi kwa muktadha huu kuliko istilahi nzito za kiutawala. Muundo umehifadhi urudiaji wa “mbele” ili kudumisha msisitizo wa matini ya Kiebrania.
