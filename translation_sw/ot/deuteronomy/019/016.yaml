base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/016.yaml
  text: If a malicious witness rises up against a man to testify against him of rebellion[b][a],
translation:
  language: sw
  text: Ikiwa shahidi mwenye nia mbaya[a] atasimama dhidi ya mtu ili kumshitaki kwa uasi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shahidi wa uongo.” Kirai cha Kiebrania kwa neno kwa neno ni “shahidi wa ukatili/uovu,” yaani shahidi anayetoa shtaka la kudhuru au lisilo la haki mahakamani.
    reason: lexical_alternative
  - marker: b
    text: Au, “kosa” au “upotovu.” Neno la Kiebrania linaweza kumaanisha kugeuka kutoka njia iliyo sawa, uasi, au hata kuasi imani; hapa halielezi wazi aina ya uasi unaodaiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ikiwa
  rationale: Katika sheria hii neno linaanzisha hali ya masharti, hivyo “Ikiwa” linafaa kuliko maana ya kisababishi kama “kwa sababu.”
- source_word: יָקוּם
  choice: atasimama
  rationale: Kitenzi קום kina picha ya shahidi kusimama au kujitokeza kutoa ushahidi; “atasimama” huihifadhi kwa Kiswahili cha kawaida.
- source_word: עֵד חָמָס
  choice: shahidi mwenye nia mbaya
  rationale: Kirai hiki kwa neno kwa neno ni “shahidi wa ukatili/uovu.” Katika mazingira ya mahakama kinamaanisha shahidi anayelenga kumdhuru mtu kwa shtaka lisilo la haki; tafsiri hii haiamui mapema kwamba ushahidi wenyewe ni wa uongo.
- source_word: בְּאִישׁ
  choice: dhidi ya mtu
  rationale: Kihusishi בְּ hapa humtambulisha mtu anayelengwa na ushahidi. “Mtu” ni ya kawaida na sahihi kwa אִישׁ katika kanuni ya jumla ya kisheria.
- source_word: לַעֲנוֹת
  choice: ili kumshitaki
  rationale: Ingawa ענה kimsingi inaweza kumaanisha kujibu, katika mazingira ya mahakama inahusu kutoa ushahidi. Kwa kuwa ushahidi huu unamlenga mtu kwa kosa, “kumshitaki” ni usemi wa kawaida na wazi.
- source_word: בּוֹ
  choice: kumshitaki
  rationale: Kiwakilishi kinachorejelea mlengwa kimejumuishwa katika kiambishi “-m-” cha “kumshitaki,” badala ya kurudiwa kwa namna isiyo ya kawaida.
- source_word: סָרָה
  choice: uasi
  rationale: סָרָה humaanisha kugeuka kutoka njia iliyo sawa na linaweza kudokeza uasi, upotovu, au kosa zito. “Uasi” huhifadhi uzito wake, huku tanbihi ikionyesha upana wa maana.
theological_decisions:
- issue: Upana wa maana ya סָרָה
  choice: uasi
  alternative: kosa; upotovu; kuasi imani
  rationale: Neno linaweza kumaanisha uasi au kugeuka vibaya, lakini mstari hautaji wazi kwamba ni uasi wa kidini. Kwa hiyo “uasi” umetumiwa bila kuongeza wazo la kuasi imani, na uwezekano mwingine umewekwa katika tanbihi.
- issue: Jinsia katika אִישׁ ya kanuni ya kisheria
  choice: mtu
  alternative: mwanamume
  rationale: Katika hali hii אִישׁ hutaja mhusika mmoja katika kanuni ya jumla ya kisheria, si lazima kusisitiza jinsia yake. “Mtu” ni sahihi na ya kawaida bila kupanua au kupunguza matumizi ya sheria.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kisheria ulio wazi na wenye hadhi. “Atasimama dhidi ya mtu” huhifadhi picha ya maandishi ya Kiebrania, huku “kumshitaki” ikifanya kazi ya ushahidi wa mahakamani ieleweke kwa urahisi.
