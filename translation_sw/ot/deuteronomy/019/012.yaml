  yaml_path: translation/ot/deuteronomy/019/012.yaml
  text: then the elders of his city shall send and take him from there and hand him over to the avenger of blood[a], and he shall die.
translation:
  language: sw
  text: Ndipo wazee wa mji wake watatuma watu wakamchukue kutoka huko na kumkabidhi mikononi mwa mlipiza kisasi cha damu[a], naye atakufa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlipiza damu.” Maneno ya Kiebrania גֹּאֵל הַדָּם ni istilahi ya kisheria kwa mtu mwenye wajibu wa kulipiza kisasi kwa ajili ya damu iliyomwagwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלְחוּ
  choice: watume watu
  rationale: Katika sheria hii, kitenzi kina nguvu ya agizo. Kuongeza ‘watu’ kunafanya Kiswahili kiwe cha kawaida kwa maana ya kutuma ili mtu aletwe, bila kubainisha wajumbe ambao Kiebrania hakiwataji.
- source_word: זִקְנֵי עִירוֹ
  choice: wazee wa mji wake
  rationale: ‘Wazee’ ni viongozi wa kiraia wanaotambuliwa, na ‘mji’ linaweza kumaanisha city au town katika muktadha huu.
- source_word: וְלָקְחוּ אֹתוֹ מִשָּׁם
  choice: wamchukue kutoka huko
  rationale: Huhifadhi maana ya kawaida ya לקח na kuondolewa kwake huko bila kuongeza wazo la kukamatwa kwa nguvu.
- source_word: וְנָתְנוּ אֹתוֹ בְּיַד
  choice: kumtia mikononi mwa
  rationale: Ni Kiswahili cha kawaida kinachoendeleza taswira ya nahau ya Kiebrania na kueleza kukabidhiwa chini ya mamlaka ya mwingine.
- source_word: גֹּאֵל הַדָּם
  choice: mlipiza kisasi cha damu
  rationale: Hili ni tamko la kisheria kuhusu mtu mwenye wajibu wa kulipiza kisasi kwa damu iliyomwagwa; tafsiri hii ni wazi na haiongezi moja kwa moja neno ‘jamaa,’ ambalo halitajwi katika kishazi hiki.
- source_word: וָמֵת
  choice: naye atauawa
  rationale: Katika muktadha wa kukabidhiwa kwa mlipiza kisasi, kauli hii inaeleza matokeo ya kifo. ‘Atauawa’ ni ya asili zaidi kuliko ‘atakufa’ na inaonyesha kuwa kifo kinasababishwa, bila kueleza namna yake.
theological_decisions:
- issue: Je, גֹּאֵל הַדָּם itafsiriwe kwa kumtaja wazi kuwa jamaa?
  choice: mlipiza kisasi cha damu
  alternative: jamaa anayelipiza kisasi cha damu
  rationale: Ingawa jukumu hilo kwa kawaida lilihusishwa na jamaa, kishazi chenyewe hapa hakitumii neno la wazi la ‘jamaa.’ Tafsiri kuu inahifadhi istilahi ya kisheria bila kuongeza ufafanuzi huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ni mfupi na mkali kama Kiebrania; ‘ndipo’ unaunganisha hukumu hii na masharti ya mistari iliyotangulia.
