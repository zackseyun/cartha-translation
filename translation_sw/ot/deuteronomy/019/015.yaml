id: DEU.19.15
reference: Deuteronomy 19:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לֹֽא יָקוּם֩ עֵ֨ד אֶחָ֜ד בְּ/אִ֗ישׁ לְ/כָל עָוֺן֙ וּ/לְ/כָל חַטָּ֔את בְּ/כָל חֵ֖טְא אֲשֶׁ֣ר יֶֽחֱטָ֑א עַל פִּ֣י שְׁנֵ֣י עֵדִ֗ים א֛וֹ עַל פִּ֥י שְׁלֹשָֽׁה עֵדִ֖ים יָק֥וּם דָּבָֽר־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/015.yaml
  text: A single witness shall not stand against a man for any iniquity or for any sin[a], in connection with any sin that he commits[c][b]; on the testimony of two witnesses or on the testimony of three witnesses a matter shall stand.
translation:
  language: sw
  text: Shahidi mmoja hatakubalika dhidi ya mtu[a] kwa kosa lolote au kwa dhambi yoyote, kuhusu dhambi yoyote atakayotenda. Jambo litathibitishwa[b] kwa ushahidi wa mashahidi wawili au wa mashahidi watatu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhidi ya yeyote.” Kiebrania kina neno la umoja lenye umbo la kiume, lililotumiwa hapa kwa maana ya uwakilishi katika sheria.
    reason: lexical_alternative
  - marker: b
    text: Au, “jambo litasimama.” Kiebrania kinatumia hapa kitenzi kilekile kilichotumiwa mwanzoni kuhusu shahidi, na hivyo kuunda ulinganifu wa kisheria.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “kwa kinywa cha mashahidi wawili au kwa kinywa cha mashahidi watatu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקוּם ... יָקוּם
  choice: hatakubalika ... litathibitishwa
  rationale: 'Katika muktadha wa sheria, קום humaanisha kusimama kama halali au kuthibitishwa. Kiswahili kinahitaji maneno tofauti kidogo kulingana na kiima: shahidi ‘atakubalika,’ na jambo ‘litathibitishwa.’ Tanbihi inahifadhi ulinganifu wa kitenzi kimoja katika Kiebrania.'
- source_word: עֵד אֶחָד
  choice: shahidi mmoja
  rationale: Hili ni neno la kawaida na wazi kwa shahidi mmoja ambaye ushahidi wake peke yake hautoshi kisheria.
- source_word: בְּאִישׁ
  choice: dhidi ya mtu
  rationale: Katika muktadha huu wa kisheria, kihusishi kinaonyesha ushahidi unaotolewa dhidi ya mtu. ‘Mtu’ ni Kiswahili cha kawaida na hakilazimishi jinsia ambayo sarufi ya Kiswahili haihitaji hapa.
- source_word: לְכָל עָוֺן
  choice: kwa kosa lolote
  rationale: עָוֺן lina uzito wa kimaadili na kisheria na laweza kumaanisha uovu, hatia, au kosa. ‘Kosa’ linafaa katika sheria na linabaki tofauti na ‘dhambi’ inayofuata.
- source_word: וּלְכָל חַטָּאת
  choice: au kwa dhambi yoyote
  rationale: ‘Dhambi’ huhifadhi maana pana ya חַטָּאת na mlundikano wa istilahi tofauti katika Kiebrania.
- source_word: בְּכָל חֵטְא אֲשֶׁר יֶחֱטָא
  choice: kuhusu dhambi yoyote atakayotenda
  rationale: Tafsiri hii ni ya kawaida katika Kiswahili huku ikihifadhi upana wa sheria na urudiaji wa mzizi wa neno ‘dhambi’ katika chanzo.
- source_word: עַל פִּי
  choice: kwa ushahidi wa
  rationale: Nahau hiyo, ambayo kihalisi ni ‘kwa kinywa cha,’ humaanisha kwamba jambo linaamuliwa kwa msingi wa ushahidi wa mashahidi.
- source_word: שְׁנֵי עֵדִים ... שְׁלֹשָׁה עֵדִים
  choice: mashahidi wawili ... mashahidi watatu
  rationale: Idadi na ulinganifu wa hitaji la kisheria vimehifadhiwa moja kwa moja.
- source_word: דָּבָר
  choice: jambo
  rationale: דָּבָר katika muktadha huu ni jambo au shauri linalochunguzwa. ‘Jambo’ huhifadhi upana wa neno bila kulifanya kuwa shtaka pekee.
theological_decisions:
- issue: Lugha ya uwakilishi katika אִישׁ
  choice: mtu
  alternative: mwanamume
  rationale: אִישׁ ni umbo la kiume la umoja katika Kiebrania, lakini hapa linatumika katika sheria kwa mtu anayeshtakiwa. Kiswahili ‘mtu’ ni ulinganifu wa kawaida wa kisheria na hakiondoi matumizi ya jumla ya amri.
- issue: Uhalali wa ushahidi wa shahidi mmoja
  choice: hatakubalika dhidi ya mtu
  alternative: hawezi peke yake kuthibitisha shtaka
  rationale: Tafsiri kuu haiongezi neno ‘shtaka’ wala maelezo ya ‘peke yake’ ambayo hayajasemwa moja kwa moja, ingawa ndiyo athari ya sheria. Hivyo mvutano na upeo wa kauli ya chanzo vinahifadhiwa.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi mbili zimetumiwa ili kuonyesha wazi kanuni mbili zinazolinganishwa: kutokubalika kwa shahidi mmoja na kuthibitishwa kwa jambo kwa mashahidi wawili au watatu.'
