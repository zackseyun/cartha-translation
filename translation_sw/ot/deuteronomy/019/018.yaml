  text: And the judges shall investigate thoroughly, and if the witness is a false witness and has testified falsely against his brother,
translation:
  language: sw
  text: Nao waamuzi watachunguza kwa makini, na ikibainika kwamba shahidi huyo ni shahidi wa uongo, ametoa ushahidi wa uongo dhidi ya ndugu yake,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדָרְשׁוּ
  choice: watachunguza
  rationale: Kitenzi דרשׁ katika muktadha wa kisheria humaanisha kuchunguza au kupeleleza jambo ili kuthibitisha ukweli.
- source_word: הֵיטֵב
  choice: kwa makini
  rationale: Kielezi hiki kinaonyesha uchunguzi kamili na wa uangalifu; Kiswahili cha kawaida 'kwa makini' kinawasilisha maana hiyo kwa ufasaha.
- source_word: עֵד שֶׁקֶר
  choice: shahidi wa uongo
  rationale: Hii ni istilahi ya moja kwa moja na ya kawaida ya kisheria kwa shahidi anayetoa ushahidi usio wa kweli.
- source_word: שֶׁקֶר עָנָה
  choice: ametoa ushahidi wa uongo
  rationale: Katika muktadha huu ענה humaanisha kutoa ushahidi, si kujibu tu; tafsiri hii huhifadhi matumizi ya kisheria.
- source_word: בְאָחִיו
  choice: dhidi ya ndugu yake
  rationale: Kihusishi ב hapa kinaeleza mtu anayelengwa na ushahidi, na אָחִיו humaanisha ndugu yake, kwa maana inayoweza pia kumhusu mwanajamii mwenzake.
theological_decisions:
- issue: Nguvu ya וְהִנֵּה katika hitimisho la uchunguzi
  choice: Ikiwa
  alternative: na tazama
  rationale: Katika muundo huu wa kisheria, וְהִנֵּה huanzisha hali iliyobainishwa na uchunguzi. 'Ikiwa' ni Kiswahili asilia kinachohifadhi maana ya kimuktadha bila kuingiza msisitizo usio wa lazima.
- issue: Maana ya 'ndugu' katika sheria ya agano
  choice: ndugu yake
  alternative: mwananchi mwenzake
  rationale: Tafsiri halisi 'ndugu yake' huhifadhi istilahi na upeo wake wa kimahusiano bila kuamua kimya-kimya ikiwa inamaanisha ndugu wa damu au mwanajamii mwenzake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa wasomaji wa kawaida. Mgawanyo wa sentensi unaboresha usomaji, huku koma ya mwisho ikidumisha uhusiano na hukumu inayoendelea katika mstari unaofuata.
