base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/004.yaml
  text: 'This is the provision for the manslayer who may flee there and live: when he strikes his neighbor without intent[a], and he did not hate him in times past.'
translation:
  language: sw
  text: 'Hili ndilo sharti kuhusu mtu aliyeua, ambaye anaweza kukimbilia huko na kuishi: ni yule aliyempiga mwenzake bila kukusudia, naye hakuwa akimchukia hapo awali.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni, “tangu jana na juzi,” yaani, hapo awali.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר
  choice: sharti
  rationale: Katika muktadha huu wa kisheria, neno hili linaonyesha kanuni au sharti linalotawala kesi, si ‘neno’ tu.
- source_word: הָרֹצֵחַ
  choice: mtu aliyeua
  rationale: Hapa neno linamtaja mtu aliyesababisha kifo bila kuamua mapema kuwa ana hatia ya mauaji ya kukusudia; ‘mtu aliyeua’ ni wazi na halimhukumu mapema.
- source_word: יָנוּס שָׁמָּה
  choice: anaweza kukimbilia huko
  rationale: Kauli hii inafafanua mtu anayestahili kukimbilia mji wa makimbilio; ‘anaweza’ huonyesha ruhusa au ustahiki bila kuifanya kuwa amri.
- source_word: וָחָי
  choice: na kubaki hai
  rationale: Hutoa matokeo ya kukimbilia huko na kueleweka kwa kawaida katika Kiswahili.
- source_word: יַכֶּה
  choice: amempiga
  rationale: Kitenzi cha Kiebrania humaanisha kupiga; muktadha mpana unaonyesha kuwa pigo hilo lilisababisha kifo, bila kulazimisha maana ya ‘kuua’ ndani ya kitenzi hiki.
- source_word: בִּבְלִי דַעַת
  choice: bila kukusudia
  rationale: Ingawa maana ya msingi ni ‘bila kujua,’ katika sheria hii kirai kinaonyesha kwamba tendo halikufanywa kwa makusudi; usemi huu ni wa kawaida na wazi kwa msomaji wa Kiswahili.
- source_word: לֹא שֹׂנֵא לוֹ
  choice: hakuwa akimchukia
  rationale: Umbo la Kiebrania linaeleza hali ya chuki iliyokuwa ikiendelea kabla ya tukio; kauli hii huhifadhi wazo hilo.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: hapo awali
  rationale: Huu ni msemo wa Kiebrania unaomaanisha wakati uliotangulia; tafsiri hii ni ya asili katika Kiswahili, huku muundo halisi ukihifadhiwa katika tanbihi.
