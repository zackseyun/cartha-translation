    issue: Ujenzi “awe amempiga”
    rationale: Kishazi hiki cha utegemezi hakina mtiririko wa kawaida wa Kiswahili na kinaweza kusikika kama ombi au sharti la matamanio. Kiebrania kinafafanua aina ya mtu kwa kishazi elezi; “ni yule aliyempiga” huhifadhi kazi hiyo.
  - severity: low
    issue: “kubaki hai” kwa וָחָי
    rationale: Ingawa inaeleweka katika muktadha, “kubaki” huongeza wazo la ‘remain.’ “Kuishi” hutafsiri kitenzi cha chanzo moja kwa moja zaidi.
  - severity: low
    issue: Nanga ya tanbihi
    rationale: Tanbihi inaeleza idiomu ya “hapo awali,” si “bila kukusudia”; kwa hiyo nanga inapaswa kuwekwa baada ya usemi unaoelezwa.
