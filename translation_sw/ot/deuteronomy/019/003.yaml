base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/003.yaml
  text: You shall prepare the road for yourself[a], and you shall divide into three parts the territory of your land that Yahweh your God is giving you as an inheritance[b], so that every manslayer may flee there.
translation:
  language: sw
  text: Ujitayarishie barabara, nawe ugawanye katika sehemu tatu eneo la nchi yako ambayo Yahweh Mungu wako anakupa kama urithi, ili kila mtu aliyeua[a] aweze kukimbilia huko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila mwenye kusababisha kifo.” Neno la Kiebrania hapa ni pana kuliko “muuaji” ikiwa neno hilo linaeleweka kumaanisha mtu aliyeua kwa kukusudia.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “nayo itakuwa kwa ajili ya kukimbilia huko.”
    reason: literal_rendering
lexical_decisions:
- source_word: תָּכִין לְךָ הַדֶּרֶךְ
  choice: Ujiandalie barabara
  rationale: Hifili ya כון ina maana ya kutayarisha au kuweka tayari. Kiambishi cha kujirejelea katika “ujiandalie” kinawakilisha לְךָ kwa Kiswahili cha kawaida, huku “barabara” ikionyesha njia halisi ya kufikia miji ya makimbilio.
- source_word: וְשִׁלַּשְׁתָּ
  choice: uligawanye sehemu tatu
  rationale: Kitenzi hiki katika pieli kinaeleza kugawa kitu katika sehemu tatu; tafsiri hii ni wazi na ya kawaida kwa Kiswahili.
- source_word: גְּבוּל אַרְצְךָ
  choice: eneo la nchi yako
  rationale: Ingawa גְּבוּל inaweza kumaanisha mpaka, hapa inaonyesha eneo lote la nchi linalopangwa kwa sehemu tatu, si mstari wa mpaka pekee.
- source_word: יַנְחִילְךָ
  choice: anakupa kuwa urithi wako
  rationale: Hifili ya נחל huonyesha kumpa mtu kitu kama urithi. Usemi huu unahifadhi dhana zote mbili za zawadi na urithi.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh Mungu wako
  rationale: Jina la agano יְהוָה limetoholewa kuwa “Yahweh,” na muundo wa Kiebrania umehifadhiwa kwa usemi wa kawaida “Mungu wako.”
- source_word: וְהָיָה לָנוּס שָׁמָּה
  choice: ili ... aweze kukimbilia huko
  rationale: Muundo halisi wa Kiebrania umebanwa, yaani, “nayo itakuwa kwa ajili ya kukimbilia huko.” Kiswahili hiki kinaonyesha kusudi lake kwa uwazi bila kuongeza wazo jipya.
- source_word: כָּל רֹצֵחַ
  choice: kila mtu aliyeua
  rationale: Katika sheria ya miji ya makimbilio, רֹצֵחַ inamhusu mtu aliyesababisha kifo, bila kuamua katika mstari huu kama aliua kwa kukusudia. “Mtu aliyeua” ni pana kuliko “muuaji” kwa maana ya mtu mwenye hatia ya mauaji ya kukusudia.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina la agano moja kwa moja. “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Kama רֹצֵחַ inapaswa kumaanisha muuaji wa kukusudia pekee
  choice: kila mtu aliyeua
  alternative: kila muuaji
  rationale: Muktadha unaofuata unajumuisha mtu aliyeua bila kukusudia. Tafsiri iliyochaguliwa haimhukumu mapema mtu huyo kuwa ametenda mauaji ya kukusudia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili huku ikihifadhi amri ya kuandaa barabara, mgawanyo wa nchi katika sehemu tatu, nchi kama urithi kutoka kwa Yahweh, na kusudi la makimbilio.
