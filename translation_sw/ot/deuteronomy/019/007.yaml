  text: Therefore I am commanding you[a], saying, ‘You shall set apart three cities for yourself.’
translation:
  language: sw
  text: 'Kwa hiyo ninakuamuru hivi: “Utenge miji mitatu kwa ajili yako.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uweke kando miji mitatu kwa ajili yako.” Kitenzi cha Kiebrania kinaweza kumaanisha “kutenganisha,” “kuweka kando,” au katika muktadha huu “kuteua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Kirai hiki kinaonyesha hitimisho linalotokana na maelezo yaliyotangulia; “Kwa hiyo” ni Kiswahili cha kawaida na huhifadhi nguvu hiyo ya kimantiki.
- source_word: אָנֹכִי
  choice: ni- katika “ninakuamuru”
  rationale: Kiwakilishi huru cha Kiebrania kina msisitizo fulani, lakini katika Kiswahili mhusika huonyeshwa kiasili kwa kiambishi cha nafsi katika kitenzi; kuongeza “mimi” kungeweza kutia msisitizo mkubwa kuliko unaohitajika hapa.
- source_word: מְצַוְּךָ
  choice: ninakuamuru
  rationale: Huhifadhi amri ya moja kwa moja na hali ya usemi wa sasa ya umbo la Kiebrania, huku ikibaki ya asili katika Kiswahili.
- source_word: לֵאמֹר
  choice: 'hivi:'
  rationale: Hiki ni kiashiria cha kunukuu maudhui ya amri. “Hivi:” ni cha asili zaidi katika Kiswahili kuliko tafsiri ya kimuundo “akisema,” na kinaonyesha wazi kwamba amri inayofuata ndiyo maudhui yake.
- source_word: שָׁלֹשׁ עָרִים
  choice: miji mitatu
  rationale: Hii ni tafsiri ya moja kwa moja ya nomino pamoja na idadi, kwa mpangilio wa kawaida wa Kiswahili.
- source_word: תַּבְדִּיל
  choice: ujitengee
  rationale: Katika muktadha huu, Hifili ya בדל inamaanisha kutenga au kuweka kando miji kwa kusudi maalumu. “Ujitengee” huonyesha kutengwa rasmi na pia manufaa yanayoonyeshwa na לָךְ.
- source_word: לָךְ
  choice: -ji- katika “ujitengee”
  rationale: Kiambishi cha kujirejelea kinaunganisha kwa Kiswahili cha asili wazo la ‘kwa ajili yako mwenyewe’ na tendo la kutenga, bila kuongeza maneno mazito.
theological_decisions:
- issue: Nafsi ya pili umoja katika sheria ya agano
  choice: Kutumia umoja “u-” katika “ujitengee,” kwa kuwa Israeli inaelekezwa kwa umoja wa kijumla.
  alternative: Kutumia wingi “mjitengee” ili kufanya hadhira ya taifa ionekane wazi.
  rationale: Kiebrania humwelekeza Israeli kwa nafsi ya pili umoja. Kuhifadhi umoja hudumisha mtindo wa usemi wa agano bila kuufanya amri kuwa wa mtu binafsi pekee.
- issue: Maana ya לָךְ pamoja na תַּבְדִּיל
  choice: Kuunganisha maana yake katika “ujitengee.”
  alternative: “utenge kwa ajili yako” au “ujiwekee kando.”
  rationale: “Ujitengee” ni usemi wa asili unaohifadhi wazo kwamba miji inatengwa kwa matumizi au manufaa ya yule anayeamriwa, bila kuamua zaidi ya maandishi kama tendo hilo ni la kiutawala tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko ya kisheria lakini kinachoeleweka kwa urahisi. “Hivi:” kimetumiwa kuanzisha maudhui ya amri kwa mtindo wa sasa na wa asili; “ujitengee” huhifadhi umoja wa anwani na maana ya manufaa ya לָךְ.
