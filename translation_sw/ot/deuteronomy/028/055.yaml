  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Taswira kali ya kula nyama ya wanawe imehifadhiwa, na nahau ya ‘malango’ imeachwa katika matini huku maana yake ya kimajazi ikifafanuliwa katika tanbihi.
