  variant: Standard East African Swahili
source:
  edition: WLC
  text: מִ/תֵּ֣ת לְ/אַחַ֣ד מֵ/הֶ֗ם מִ/בְּשַׂ֤ר בָּנָי/ו֙ אֲשֶׁ֣ר יֹאכֵ֔ל מִ/בְּלִ֥י הִשְׁאִֽיר ל֖/וֹ כֹּ֑ל בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁ֨ר יָצִ֥יק לְ/ךָ֛ אֹיִבְ/ךָ֖ בְּ/כָל שְׁעָרֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/055.yaml
  text: so that he will not give to any of them any of the flesh of his sons that he is eating[a], because he has nothing left[b], in the siege and in the distress with which your enemy will oppress you within all your gates.
translation:
  language: sw
  text: hivyo hatampa yeyote kati yao hata sehemu ya nyama ya wanawe wa kiume[a] ambayo anakula, kwa kuwa hatakuwa na chochote kilichobaki, wakati wa kuzingirwa na wa dhiki ambayo adui yako atakusababishia ndani ya malango yako yote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema hasa “wanawe wa kiume,” wala si neno la jumla “watoto.”
    reason: lexical_alternative
  - marker: b
    text: Au “katika miji yako yote.” Katika Kiebrania, “malango” yanaweza kutumiwa kumaanisha miji ambako watu wanaishi.
    reason: cultural_note
lexical_decisions:
- source_word: מִתֵּת לְאַחַד מֵהֶם
  choice: hivyo hatampa yeyote kati yao
  rationale: Kirai hiki kinaendeleza maelezo ya mstari uliotangulia na kuonyesha kukataa kutoa. Kiswahili hiki kinawasilisha kwa kawaida maana ya kutompa hata mmoja wao.
- source_word: מִבְּשַׂר בָּנָיו
  choice: hata sehemu ya nyama ya wanawe wa kiume
  rationale: בָּשָׂר ni nyama halisi, na ukali wa tukio unapaswa kubaki wazi. בָּנָיו ni ‘wanawe wa kiume,’ si neno la jumla kwa watoto.
- source_word: אֲשֶׁר יֹאכֵל
  choice: ambayo anakula
  rationale: Kauli ya wakati uliopo huleta uhai wa tukio la wakati wa kuzingirwa bila kulazimisha iwapo kitenzi cha Kiebrania kinapaswa kueleweka kama cha sasa au cha baadaye katika simulizi hilo.
- source_word: מִבְּלִי הִשְׁאִיר לוֹ כֹּל
  choice: kwa kuwa hatakuwa na chochote kilichobaki
  rationale: 'Kirai kinaeleza sababu ya kutoshiriki: hakuna kitu chochote kitakachokuwa kimebaki kwake. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha maana ya upungufu kamili.'
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: wakati wa kuzingirwa na wa dhiki
  rationale: מָצוֹר ni hali ya kuzingirwa, na מָצוֹק ni dhiki kali. Muundo huu unahifadhi istilahi zote mbili kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ
  choice: ambayo adui yako atakusababishia
  rationale: Hiphil ya צוּק inaonyesha adui akisababisha shinikizo au dhiki. ‘Atakusababishia’ inaunganisha tendo hilo na hali ya kuzingirwa na dhiki bila kuongeza maelezo yasiyokuwamo.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: ndani ya malango yako yote
  rationale: Hii inahifadhi taswira halisi ya Kiebrania ya ‘malango,’ huku tanbihi ikieleza matumizi yake kama rejeo kwa miji.
theological_decisions: []
