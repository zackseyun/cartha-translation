  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ֠/אָכַל פְּרִ֨י בְהֶמְתְּ/ךָ֥ וּ/פְרִֽי אַדְמָתְ/ךָ֮ עַ֣ד הִשָּֽׁמְדָ/ךְ֒ אֲשֶׁ֨ר לֹֽא יַשְׁאִ֜יר לְ/ךָ֗ דָּגָן֙ תִּיר֣וֹשׁ וְ/יִצְהָ֔ר שְׁגַ֥ר אֲלָפֶ֖י/ךָ וְ/עַשְׁתְּרֹ֣ת צֹאנֶ֑/ךָ עַ֥ד הַאֲבִיד֖/וֹ אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/051.yaml
  text: It will consume the offspring of your livestock and the produce of your land until you are destroyed; it will leave you no grain[a], new wine, or oil, no calves of your herd or lambs of your flock, until it has destroyed you.
translation:
  language: sw
  text: Nalo litakula uzao wa mifugo yako na mazao ya ardhi yako mpaka uangamizwe. Halitakuachia nafaka, divai mpya wala mafuta, ndama wa ng’ombe wako wala uzao wa kundi lako[a], mpaka litakapokuangamiza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ongezeko la kundi lako.” Usemi wa Kiebrania עַשְׁתְּרֹת צֹאנֶךָ unarejelea uzao au ongezeko linalotokana na kundi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַל
  choice: Nalo litakula
  rationale: Kitenzi אכל kwa msingi ni ‘kula.’ Katika laana hii ya uvamizi, ‘litakula’ ni Kiswahili cha kawaida na chenye nguvu kinachoonyesha taifa vamizi likimaliza rasilimali; ‘nalo’ linaendeleza mhusika wa umoja kutoka muktadha uliotangulia.
- source_word: פְּרִי בְהֶמְתְּךָ
  choice: uzao wa mifugo yako
  rationale: פְּרִי linapotumiwa kuhusu wanyama humaanisha uzao, na בְהֵמָה hapa ni mifugo kwa ujumla.
- source_word: וּפְרִי אַדְמָתְךָ
  choice: mazao ya ardhi yako
  rationale: Usemi huu unamaanisha mavuno yanayotokana na ardhi; ‘mazao ya ardhi yako’ ni wa asili na unaeleweka kwa urahisi.
- source_word: עַד הִשָּׁמְדָךְ
  choice: mpaka uangamizwe
  rationale: Muundo huu unaonyesha mwisho wa tendo la kula au kumaliza rasilimali. Kauli ya kutendwa inahifadhi maana na uzito wa laana.
- source_word: אֲשֶׁר לֹא יַשְׁאִיר לְךָ
  choice: Halitakuachia
  rationale: Hii inaendeleza tendo la taifa vamizi na kueleza kunyimwa kabisa vitu vinavyofuata.
- source_word: דָּגָן
  choice: nafaka
  rationale: דָּגָן ni jina la jumla la mazao ya nafaka, si aina moja maalumu.
- source_word: תִּירוֹשׁ
  choice: divai mpya
  rationale: תִּירוֹשׁ kwa kawaida hurejelea divai mpya au zao jipya la mzabibu; ‘divai mpya’ huhifadhi utofauti huo.
- source_word: יִצְהָר
  choice: mafuta
  rationale: Katika mfululizo wa nafaka, divai mpya na mafuta, neno hili humaanisha mafuta, hasa ya zeituni; muktadha unatosha bila kuongeza ‘ya zeituni.’
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: ndama wa ng’ombe wako
  rationale: שְׁגַר hurejelea uzao wa ng’ombe; ‘ndama’ ni tafsiri ya kawaida na mahususi katika muktadha huu.
- source_word: וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: wana wa kundi lako[a]
  rationale: Usemi huu una utata fulani lakini katika jozi hii unaelekea kumaanisha uzao au ongezeko la kundi la kondoo na mbuzi. ‘Wana wa kundi lako’ huepuka kuufanya uzao huo kuwa wanakondoo pekee.
- source_word: עַד הַאֲבִידוֹ אֹתָךְ
  choice: mpaka litakapokuangamiza
  rationale: Hiphil ya אבד ina maana ya kusababisha mtu aangamie. Tafsiri hii pia inadumisha marudio makali ya ‘kuangamiza’ yaliyomo katika Kiebrania.
theological_decisions:
- issue: Mhusika anayetekeleza laana
  choice: Umoja wa ngeli ya LI katika ‘nalo/litakula/halitakuachia/litakapokuangamiza’
  alternative: Kutaja wazi ‘taifa hilo’ katika kila sehemu
  rationale: Kiebrania kinaendeleza mhusika wa umoja kutoka aya iliyotangulia, yaani taifa vamizi. Viambishi vya umoja vinahifadhi uhusiano huo bila kuongeza maelezo yasiyomo katika aya.
- issue: Kurudiwa kwa kuangamizwa
  choice: Kuhifadhi ‘mpaka uangamizwe’ na ‘mpaka litakapokuangamiza’
  alternative: Kuunganisha vifungu ili kuepuka marudio
  rationale: Marudio yako katika Kiebrania na yanaongeza uzito wa laana; kuyaondoa kungepunguza mkazo wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Msamiati wa kilimo na mifugo umewekwa wazi kwa msomaji wa kawaida. Alama ya tanbihi imewekwa kwenye usemi wenye utata wa kileksika, si kwenye ‘nafaka.’
