  text: וּ/בַ/גּוֹיִ֤ם הָ/הֵם֙ לֹ֣א תַרְגִּ֔יעַ וְ/לֹא יִהְיֶ֥ה מָנ֖וֹחַ לְ/כַף רַגְלֶ֑/ךָ וְ/נָתַן֩ יְהוָ֨ה לְ/ךָ֥ שָׁם֙ לֵ֣ב רַגָּ֔ז וְ/כִלְי֥וֹן עֵינַ֖יִם וְ/דַֽאֲב֥וֹן נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/065.yaml
  text: And among those nations you will find no rest[a], and there will be no resting place for the sole of your foot; and there Yahweh will give you a trembling heart, failing eyes[c][b], and anguish of soul.
translation:
  language: sw
  text: Na kati ya mataifa hayo hutapata pumziko[a], wala wayo wa mguu wako hautapata mahali pa kupumzika. Huko Yahwe atakupa moyo unaotetemeka, macho yanayodhoofika[b], na uchungu wa nafsi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hutakuwa na utulivu.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kuisha kwa macho.”
    reason: lexical_alternative
  - marker: c
    text: Au, “huzuni ya nafsi” au “maumivu ya nafsi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַרְגִּיעַ
  choice: hutapata pumziko
  rationale: Hifili ya רגע hapa ina maana ya kutulia au kupata raha. Kauli hii ni ya kawaida katika Kiswahili na inadumisha wazo la kukosa utulivu uhamishoni.
- source_word: מָנוֹחַ
  choice: mahali pa kutua
  rationale: Nomino hii inaweza kumaanisha pumziko au mahali pa kupumzikia. Pamoja na 'wayo wa mguu,' maana halisi ya mahali pa kuuweka mguu kwa utulivu inafaa zaidi.
- source_word: לְכַף רַגְלֶךָ
  choice: wayo wa mguu wako
  rationale: כַּף pamoja na רֶגֶל humaanisha sehemu ya chini ya mguu. 'Wayo wa mguu wako' ni sahihi na inaeleweka katika Kiswahili sanifu.
- source_word: וְנָתַן יְהוָה לְךָ שָׁם
  choice: Huko Yahwe atakupa
  rationale: Inahifadhi mkazo wa kimaeneo wa שָׁם ('huko') na kumtaja wazi Yahwe kama mtendaji.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano YHWH limetoholewa moja kwa moja kwa umbo linalotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: לֵב רַגָּז
  choice: moyo unaotetemeka
  rationale: רַגָּז huonyesha kutetemeka, kufadhaika, au msukosuko wa ndani. Tafsiri hii inadumisha taswira ya kimwili na kihisia.
- source_word: כִּלְיוֹן עֵינַיִם
  choice: macho yanayodhoofika
  rationale: כִּלְיוֹן huonyesha kudhoofika, kunyauka, au kuisha. 'Macho yanayodhoofika' ni ya asili kwa Kiswahili huku ikidumisha taswira ya kupoteza nguvu kwa huzuni na kutazamia bure.
- source_word: דַּאֲבוֹן נָפֶשׁ
  choice: uchungu wa nafsi
  rationale: דַּאֲבוֹן huweza kuwa uchungu, huzuni, au maumivu; נֶפֶשׁ hapa inadumishwa kama 'nafsi' ili kuonyesha mateso ya utu wa ndani bila kuyapunguza kuwa hisia moja tu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la kibinafsi la Mungu, YHWH. 'Yahwe' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza fundisho la dhehebu.
- issue: Maana ya דַּאֲבוֹן נָפֶשׁ
  choice: uchungu wa nafsi
  alternative: huzuni ya nafsi; maumivu ya nafsi
  rationale: Kirai kinaweza kueleza uchungu, huzuni, au maumivu ya ndani. Maandishi makuu yanatumia 'uchungu' kwa uzito wake, huku tanbihi ikihifadhi uwezekano mwingine wa kileksia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unafuata mtiririko wa Kiebrania bila kuwa mgumu; taswira za 'wayo wa mguu,' 'moyo unaotetemeka,' na 'nafsi' zimehifadhiwa.
