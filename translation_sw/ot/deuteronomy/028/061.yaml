  text: גַּ֤ם כָּל חֳלִי֙ וְ/כָל מַכָּ֔ה אֲשֶׁר֙ לֹ֣א כָת֔וּב בְּ/סֵ֖פֶר הַ/תּוֹרָ֣ה הַ/זֹּ֑את יַעְלֵ֤/ם יְהוָה֙ עָלֶ֔י/ךָ עַ֖ד הִשָּׁמְדָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/061.yaml
  text: Also every sickness and every affliction that is not written in the book of this law[a], Yahweh will bring upon you until you are destroyed.
translation:
  language: sw
  text: Vilevile, Yahweh atakuletea magonjwa yote na mapigo yote[a] ambayo hayajaandikwa katika kitabu cha sheria hii, mpaka uangamizwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tauni” badala ya “mapigo”; neno la Kiebrania linaweza kumaanisha pigo, jeraha, tauni, au msiba unaopiga.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Vilevile
  rationale: Inaendeleza orodha ya laana kwa kuongeza jambo jingine; “Vilevile” ni ya kawaida na huhifadhi nguvu ya nyongeza.
- source_word: כָּל חֳלִי
  choice: magonjwa yote
  rationale: חֳלִי humaanisha ugonjwa au hali ya kuugua. Wingi pamoja na “yote” ni Kiswahili cha asili kinachowasilisha maana ya jumla ya כָּל.
- source_word: וְכָל מַכָּה
  choice: na mapigo yote
  rationale: מַכָּה linaweza kumaanisha pigo, jeraha, tauni, au msiba unaompata mtu. “Mapigo” huhifadhi upana huo na muktadha wa hukumu.
- source_word: אֲשֶׁר לֹא כָתוּב
  choice: ambayo hayajaandikwa
  rationale: Kishazi hiki kinahusishwa kwa uwazi na magonjwa na mapigo yote yaliyotangulia, bila kupunguza maana kwa kundi moja tu.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֹּאת
  choice: katika kitabu cha sheria hii
  rationale: Huhifadhi maana ya hati ya agano; סֵפֶר inaweza kuwa kitabu au hati-kunjo, lakini “kitabu” ni wazi na sanifu hapa.
- source_word: יַעְלֵם ... עָלֶיךָ
  choice: atakuletea
  rationale: Hifili ya עלה pamoja na עָלֶיךָ ina maana ya kusababisha mambo haya yampate mtu. “Atakuletea” ni Kiswahili cha asili na hudumisha wazo la hukumu inayoletwa juu yake.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi יהוה limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: עַד הִשָּׁמְדָךְ
  choice: mpaka uangamizwe
  rationale: Inaonyesha kikomo au matokeo ya hukumu hiyo kwa lugha ya kawaida huku ikihifadhi ukali wa kitenzi cha Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko lina jina la agano יהוה moja kwa moja; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa wingi “magonjwa yote na mapigo yote” umetumiwa ili kishazi “ambayo hayajaandikwa” kihusiane kwa kawaida na makundi yote mawili. Alama ya tanbihi imewekwa mara baada ya neno linalofafanuliwa.
