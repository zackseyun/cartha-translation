  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/נְתָֽנְ/ךָ֨ יְהוָ֤ה לְ/רֹאשׁ֙ וְ/לֹ֣א לְ/זָנָ֔ב וְ/הָיִ֨יתָ֙ רַ֣ק לְ/מַ֔עְלָ/ה וְ/לֹ֥א תִהְיֶ֖ה לְ/מָ֑טָּה כִּֽי תִשְׁמַ֞ע אֶל מִצְוֺ֣ת יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם לִ/שְׁמֹ֥ר וְ/לַ/עֲשֽׂוֹת־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/013.yaml
  text: And Yahweh will make you the head and not the tail[a], and you will be only above, and you will not be beneath, if you listen to the commandments of Yahweh your God that I am commanding you today, to keep and to do them.
translation:
  language: sw
  text: Yahwe atakufanya uwe kichwa, wala si mkia; utakuwa juu tu, wala hutakuwa chini, ikiwa utasikiliza[a] amri za Yahwe Mungu wako ninazokuamuru leo, uzishike na kuzitekeleza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikiwa utazitii amri za Yahwe Mungu wako.” Kiebrania kinasema “utasikiliza,” lakini katika muktadha huu wa agano maana yake inahusisha kusikia kwa utiifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנְךָ יְהוָה
  choice: Yahwe atakufanya uwe
  rationale: Kitenzi נתן kwa kawaida ni ‘kutoa/kuweka,’ lakini pamoja na kiarifu ‘kichwa’ kina maana ya kumsababisha mtu awe katika hadhi hiyo. Kiswahili ‘atakufanya uwe’ ni cha asili na kinahifadhi nguvu hiyo.
- source_word: לְרֹאשׁ וְלֹא לְזָנָב
  choice: kichwa, wala si mkia
  rationale: Taswira halisi ya kichwa na mkia imehifadhiwa kwa sababu inaonyesha kuwa mbele au mashuhuri dhidi ya kuwa nyuma au duni.
- source_word: וְהָיִיתָ רַק לְמַעְלָה וְלֹא תִהְיֶה לְמָטָּה
  choice: utakuwa juu tu, wala hutakuwa chini
  rationale: ‘Juu’ na ‘chini’ zinahifadhi sitiari ya nafasi na hadhi; ‘tu’ inawakilisha msisitizo wa רַק.
- source_word: כִּי תִשְׁמַע אֶל
  choice: ikiwa utasikiliza
  rationale: כִּי inaingiza sharti katika muktadha huu, na שמע אל kihalisi ni ‘kusikiliza’; hapa kusikiliza kunahusisha kuitikia kwa utiifu.
- source_word: מִצְוֺת
  choice: amri
  rationale: ‘Amri’ ni tafsiri ya kawaida na yenye uzito inayofaa masharti ya agano.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa uhawilishaji badala ya kubadilishwa kuwa cheo.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ninazokuamuru leo
  rationale: Muundo huu unaonyesha Musa akitoa amri wakati wa hotuba yake; ‘leo’ imehifadhiwa.
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  choice: uzishike na kuzitekeleza
  rationale: 'Vitenzi vyote viwili vimehifadhiwa: kushika kwa uangalifu na kutenda kwa vitendo.'
theological_decisions:
- issue: Maana ya sharti linaloingizwa na כִּי
  choice: ikiwa utasikiliza
  alternative: kwa sababu unasikiliza
  rationale: Katika mfululizo wa baraka za agano, kifungu hiki kinaeleza sharti la ahadi. ‘Ikiwa’ kinaonyesha mantiki hiyo bila kuongeza madai kuhusu kustahili baraka.
- issue: Maana ya שמע katika muktadha wa agano
  choice: utasikiliza, huku matendo yakifafanuliwa na ‘uzishike na kuzitekeleza’
  alternative: utatii
  rationale: Tafsiri inahifadhi picha ya msingi ya kusikia/kusikiliza na wakati huohuo muktadha unaonyesha wazi kuwa usikilizaji huo unadai utiifu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sitiari za ‘kichwa/mkia’ na ‘juu/chini’ zimehifadhiwa. Alama ya tanbihi [a] imewekwa baada ya sentensi nzima kwa kuwa tanbihi inaeleza kifungu cha sharti.
