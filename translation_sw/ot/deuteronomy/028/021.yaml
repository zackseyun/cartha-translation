base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/021.yaml
  text: Yahweh will make the plague cling to you until he has wiped you out from the land that you are entering to possess[a][b].
translation:
  language: sw
  text: Yahwe ataifanya tauni ikung’ang’anie mpaka atakapokuangamiza kabisa kutoka katika nchi unayoingia kuimiliki[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maradhi ya mlipuko.” Neno la Kiebrania linaweza kumaanisha ugonjwa hatari unaoenea na kuleta mauti kama hukumu.
    reason: lexical_alternative
  - marker: b
    text: Au, “mpaka itakapokumaliza kabisa,” ikiwa tauni inaeleweka kuwa kiima cha kishazi hiki.
    reason: alternative_reading
lexical_decisions:
- source_word: יַדְבֵּק
  choice: ataifanya ... ikung’ang’anie
  rationale: Kauli ya kusababisha ya kitenzi דבק ina maana ya kufanya kitu kishikamane au king’ang’anie. Muundo huu wa Kiswahili unahifadhi nguvu hiyo ya kusababisha na picha ya janga lisilomwacha mtu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: הַדָּבֶר
  choice: tauni
  rationale: Katika muktadha wa laana ya agano, neno hili humaanisha ugonjwa hatari unaoenea. ‘Tauni’ ni neno fupi, zito, na linaloeleweka katika Kiswahili, ingawa maana pana zaidi imeonyeshwa katika tanbihi.
- source_word: עַד כַּלֹּתוֹ אֹתְךָ
  choice: mpaka atakapokuangamiza kabisa
  rationale: Kitenzi כלה hapa kina wazo la kufikisha mwisho au kuondoa kabisa. ‘Kuangamiza kabisa’ linaonyesha ukamilifu wa hukumu bila kutumia usemi wa mazungumzo mno.
- source_word: מֵעַל הָאֲדָמָה
  choice: kutoka katika nchi
  rationale: Ingawa אֲדָמָה linaweza kumaanisha ardhi au udongo, hapa muktadha wa kuingia na kumiliki unaonyesha eneo la nchi.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: unayoingia kuimiliki
  rationale: Tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi kusudi la kuingia katika nchi ili kuitwaa na kuwa nayo.
theological_decisions:
- issue: Maana ya דבר katika laana ya agano
  choice: tauni
  alternative: maradhi ya mlipuko
  rationale: ‘Tauni’ inawasilisha ugonjwa wa kuenea wenye kuleta mauti na uzito wa hukumu, huku tanbihi ikihifadhi upana wa maana ya Kiebrania.
- issue: Kiima cha כַּלֹּתוֹ
  choice: 'Yahwe ndiye kiima kinachoeleweka: ‘atakapokuangamiza kabisa’'
  alternative: 'Tauni ndiyo kiima: ‘mpaka itakapokumaliza kabisa’'
  rationale: Kiima cha kishazi kikuu, Yahwe, kinaweza kuendelea kueleweka katika kishazi hiki. Hata hivyo, sarufi pia inaweza kueleweka kuwa tauni ndiyo inayomaliza; uwezekano huo umehifadhiwa katika tanbihi bila kuondoa mvutano wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Ikung’ang’anie’ inadumisha picha hai ya Kiebrania, na ‘kuangamiza kabisa’ inaonyesha mwisho kamili bila kuwa usemi wa mitaani.
