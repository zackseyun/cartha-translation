base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/014.yaml
  text: And do not turn aside from any of the words that I am commanding you today[a], to the right or to the left[b], to go after other gods to serve them.
translation:
  language: sw
  text: Wala msigeuke kutoka katika lolote la maneno ninayowaamuru leo, wala kulia wala kushoto, kwa kufuata miungu mingine na kuitumikia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָסוּר
  choice: msigeuke
  rationale: Kitenzi סור humaanisha kugeuka, kuondoka, au kukengeuka. ‘Msigeuke’ ni Kiswahili cha kawaida kinachohifadhi picha ya kuacha njia iliyoamriwa.
- source_word: מִכָּל הַדְּבָרִים
  choice: kutoka katika neno lolote
  rationale: Katika tungo hasi, מִכָּל huleta maana ya kutokengeuka hata kutoka sehemu moja ya maagizo. ‘Neno lolote’ hudumisha neno דברים bila kulibadili moja kwa moja kuwa ‘amri.’
- source_word: מְצַוֶּה
  choice: ninalowaamuru
  rationale: Kauli ya wakati uliopo huonyesha Musa akiwaamuru wasikilizaji wakati huo; umbo hili pia linaafikiana na ‘neno lolote.’
- source_word: הַיּוֹם
  choice: leo
  rationale: ‘Leo’ ni tafsiri ya kawaida na ya moja kwa moja inayohifadhi uharaka wa hotuba ya agano.
- source_word: יָמִין וּשְׂמֹאול
  choice: kwenda kulia au kushoto
  rationale: Hii ni sitiari ya kupotoka upande wowote. Kuongeza ‘kwenda’ hufanya kirai kiwe cha asili katika Kiswahili huku picha ya mahali ikibaki wazi.
- source_word: לָלֶכֶת אַחֲרֵי
  choice: kwa kufuata
  rationale: Nahau ya Kiebrania ni kihalisi ‘kwenda nyuma ya.’ ‘Kufuata’ huwasilisha kwa kawaida maana ya kumwandama au kumpa mwingine utii bila kutoa Kiswahili kisicho cha asili.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Hii ndiyo maana ya moja kwa moja ya kirai, bila kuongeza wazo la ‘miungu ya kigeni’ ambalo halijaelezwa wazi hapa.
- source_word: לְעָבְדָם
  choice: kuitumikia
  rationale: עבד ikihusishwa na miungu inaweza kumaanisha kutumikia au kuabudu. ‘Kuitumikia’ huhifadhi maana pana ya huduma, utii, na ibada ya kidini.
theological_decisions:
- issue: Kutajwa kwa miungu mingine katika onyo la agano
  choice: miungu mingine
  alternative: miungu ya kigeni
  rationale: Tafsiri inadumisha usemi wa Kumbukumbu la Torati bila kuamua ndani ya aya hii suala la hali halisi ya miungu hiyo au kuongeza maelezo ya kiteolojia ambayo matini yenyewe haitoi.
- issue: Maana ya עבד kuhusiana na miungu
  choice: kuitumikia
  alternative: kuiabudu
  rationale: ‘Kuitumikia’ ni sawia ya moja kwa moja na huhifadhi upana wa utii na huduma ya kidini; nguvu ya kiibada ipo katika muktadha bila kulazimisha maana nyembamba zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetungwa kwa uwazi kwa wasomaji wa kawaida, huku ikihifadhi sitiari ya kugeuka kulia au kushoto na mvutano wa kifungu kuhusu ‘miungu mingine.’ Hakuna alama za tanbihi kwa sababu mbadala za kileksika zinaweza kurekodiwa katika maamuzi bila kuhitaji tanbihi ya uchapishaji.
