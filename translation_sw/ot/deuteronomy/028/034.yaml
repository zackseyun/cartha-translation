translation:
  language: sw
  text: Utaingiwa na wazimu kwa sababu ya mambo utakayoyaona kwa macho yako[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na muundo wa Kiebrania, “Utakuwa mwendawazimu kwa sababu ya mwonekano wa macho yako utakaoona.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתָ
  choice: Utaingiwa
  rationale: Katika mfululizo huu wa laana, kitenzi kina maana ya wakati ujao au matokeo yatakayotokea. Muundo huu unaungana kiasili na kirai “na wazimu” katika Kiswahili.
- source_word: מְשֻׁגָּע
  choice: na wazimu
  rationale: Umbo la Kiebrania linaonyesha hali ya kufanywa au kufikia wazimu. “Utaingiwa na wazimu” ni Kiswahili cha kawaida kinachowasilisha vizuri maana hiyo ya kimatokeo kuliko kusema tu “utakuwa mwendawazimu.”
- source_word: מִמַּרְאֵה
  choice: kwa sababu ya yale
  rationale: Kihusishi מִן hapa kinaonyesha sababu. Tafsiri hii inaeleza kwa lugha ya kawaida kwamba mambo yanayoonekana ndiyo yatakayosababisha wazimu.
- source_word: עֵינֶיךָ
  choice: macho yako
  rationale: Tafsiri halisi inadumisha msisitizo thabiti wa Kiebrania juu ya kuona kwa macho.
- source_word: אֲשֶׁר תִּרְאֶה
  choice: ambayo macho yako yataona
  rationale: Kirai hiki kinafafanua kile kitakachoonekana. Kiswahili hiki kinadumisha urudiaji wa wazo la kuona na pia ni wazi na cha kawaida.
