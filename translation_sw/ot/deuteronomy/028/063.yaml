source:
  edition: WLC
  text: וְ֠/הָיָה כַּ/אֲשֶׁר שָׂ֨שׂ יְהוָ֜ה עֲלֵי/כֶ֗ם לְ/הֵיטִ֣יב אֶתְ/כֶם֮ וּ/לְ/הַרְבּ֣וֹת אֶתְ/כֶם֒ כֵּ֣ן יָשִׂ֤ישׂ יְהוָה֙ עֲלֵי/כֶ֔ם לְ/הַאֲבִ֥יד אֶתְ/כֶ֖ם וּ/לְ/הַשְׁמִ֣יד אֶתְ/כֶ֑ם וְ/נִסַּחְתֶּם֙ מֵ/עַ֣ל הָֽ/אֲדָמָ֔ה אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/063.yaml
  text: And it shall be that[a], just as Yahweh rejoiced over you to do you good and to multiply you, so Yahweh will rejoice over you to destroy you and to wipe you out[b]; and you will be torn away from upon the land that you are entering there to possess it.
translation:
  language: sw
  text: Na itakuwa kwamba, kama vile Yahweh alivyowafurahia kwa kuwatendea mema na kuwafanya muwe wengi, ndivyo Yahweh atakavyowafurahia kwa kuwaangamiza na kuwafutilia mbali. Nanyi mtang’olewa[a] kutoka katika nchi unayoingia humo ili kuimiliki.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtaondolewa kutoka katika nchi.”
    reason: lexical_alternative
  - marker: b
    text: Katika Kiebrania, “unayoingia” na “kuimiliki” vinamwelekezea Israeli kwa umoja, yaani, kama taifa moja.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: Na itakuwa kwamba
  rationale: Huhifadhi utangulizi wa matokeo yajayo bila kutumia mtindo wa kale usio wa kawaida.
- source_word: שָׂשׂ / יָשִׂישׂ
  choice: alivyofurahi / atakavyofurahi
  rationale: Mzizi uleule wa Kiswahili umetumiwa katika sehemu zote mbili ili kuhifadhi ulinganifu wa makusudi kati ya baraka na hukumu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ni uwasilishaji wa jina la agano kulingana na desturi ya mradi.
- source_word: לְהֵיטִיב אֶתְכֶם
  choice: kuwatendea mema
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi maana pana ya kuwaletea mema, bila kuibana iwe ustawi wa mali pekee.
- source_word: וּלְהַרְבּוֹת אֶתְכֶם
  choice: kuwafanya muwe wengi
  rationale: Hutoa wazi maana ya kisababishi ya kuwazidisha watu na kudumisha lugha ya baraka ya agano.
- source_word: לְהַאֲבִיד אֶתְכֶם / וּלְהַשְׁמִיד אֶתְכֶם
  choice: kuwaangamiza na kuwafutilia mbali
  rationale: Vitenzi viwili tofauti vinadumishwa; cha pili kinaongeza wazo la kuondolewa kabisa bila kurudia neno lilelile.
- source_word: וְנִסַּחְתֶּם
  choice: mtang’olewa
  rationale: Huwasilisha kuondolewa kwa nguvu kwa picha hai na ya kawaida ya Kiswahili.
- source_word: מֵעַל הָאֲדָמָה
  choice: katika nchi
  rationale: Katika muktadha wa kuingia na kumiliki, 'nchi' ni ya asili zaidi kwa Kiswahili, huku kitenzi 'mtang’olewa' kikibeba nguvu ya kuondolewa kutoka juu yake.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: ambayo unaingia humo ili kuimiliki
  rationale: Huhifadhi kielezi cha mahali 'humo,' kiambishi cha yambwa katika 'kuimiliki,' na umoja wa neno 'unaingia' unaoielekezea Israeli kama taifa moja.
theological_decisions:
- issue: Yahweh kufurahia katika hukumu
  choice: Yahweh atakavyofurahi juu yenu kwa kuwaangamiza
  alternative: Yahweh atakavyopendezwa kuwaangamiza
  rationale: Maandishi ya Kiebrania yanarudia kwa makusudi kitenzi kilekile kilichotumiwa kuhusu baraka. Tafsiri inadumisha mvutano huo wa kiteolojia badala ya kuupunguza.
- issue: Jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Jina binafsi la agano limewasilishwa kama Yahweh, kulingana na desturi ya mradi, badala ya kubadilishwa kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Ulinganifu wa baraka na hukumu umehifadhiwa, na mabadiliko kutoka wingi kwenda umoja wa pamoja yameonyeshwa katika kifungu cha mwisho na kufafanuliwa kwa tanbihi.
