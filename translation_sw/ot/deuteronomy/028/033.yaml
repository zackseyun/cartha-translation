  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: פְּרִ֤י אַדְמָֽתְ/ךָ֙ וְ/כָל יְגִ֣יעֲ/ךָ֔ יֹאכַ֥ל עַ֖ם אֲשֶׁ֣ר לֹא יָדָ֑עְתָּ וְ/הָיִ֗יתָ רַ֛ק עָשׁ֥וּק וְ/רָצ֖וּץ כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/033.yaml
  text: A people whom you have not known will eat the fruit of your land and all your labor[b][a], and you will be only oppressed and crushed all your days.
translation:
  language: sw
  text: Taifa usilolijua litakula mazao ya ardhi yako[a] na yote uliyoyataabikia[b], nawe utadhulumiwa na kupondwa tu siku zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “matunda ya ardhi yako.”
    reason: lexical_alternative
  - marker: b
    text: Au, “taabu yako yote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרִי אַדְמָתְךָ
  choice: mazao ya ardhi yako
  rationale: Neno פְּרִי linaweza kumaanisha tunda au mazao kwa ujumla. Katika muktadha wa kilimo, “mazao ya ardhi yako” ni Kiswahili cha kawaida kinachowasilisha mavuno yanayotokana na ardhi bila kuyawekea kikomo kuwa matunda pekee.
- source_word: יְגִיעֲךָ
  choice: yote uliyoyataabikia
  rationale: Neno hili linaweza kumaanisha taabu, kazi ngumu, au kile kinachopatikana kwa kazi hiyo. Kwa kuwa kitu hicho ‘kitaliwa,’ usemi huu wa Kiswahili unaonyesha kwa kawaida kile kilichopatikana kwa juhudi huku ukihifadhi wazo la taabu.
- source_word: יֹאכַל
  choice: litakula
  rationale: Kitenzi cha kawaida “kula” kinadumisha picha halisi ya chanzo bila kuongeza ukali usiotajwa wazi.
- source_word: עַם
  choice: taifa
  rationale: Nomino hii ni ya umoja na ya kijumla, ikimaanisha kundi la watu wa kigeni. “Taifa” huruhusu upatanisho wa umoja na ni wazi katika muktadha huu.
- source_word: אֲשֶׁר לֹא יָדָעְתָּ
  choice: usilolijua
  rationale: Hii inaeleza taifa lisilojulikana kwa anayesemeshwa. Kiswahili hiki ni cha kawaida na hakiongezi maana ya kwamba hawajawahi kabisa kulijua.
- source_word: רַק
  choice: tu
  rationale: '“Tu” linaonyesha hali isiyo na nafuu: matokeo yatakuwa kudhulumiwa na kupondwa pekee.'
- source_word: עָשׁוּק
  choice: kudhulumiwa
  rationale: Huwasilisha hali ya kutendewa isivyo haki, kunyonywa, au kuonewa na wenye nguvu.
- source_word: רָצוּץ
  choice: kupondwa
  rationale: “Kupondwa” linahifadhi nguvu ya picha ya kuvunjwa au kusagwa bila kuamua ikiwa ni madhara ya mwili au kuvunjwa moyo na hali.
- source_word: כָּל הַיָּמִים
  choice: siku zote
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha hali ya kudumu au kuendelea bila kukoma.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi inadumisha usemi wa moja kwa moja kwa nafsi ya pili na picha ya taifa la kigeni kula mazao. “Yote uliyoyataabikia” ni ya asili zaidi kuliko kusema taifa ‘litakula kazi yako,’ huku tanbihi ikihifadhi uwezekano wa maana ya “taabu.”
