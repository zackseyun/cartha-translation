base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/030.yaml
  text: You will become engaged to a wife[a], but another man will lie with her; you will build a house, but you will not live in it; you will plant a vineyard[c][b], but you will not begin to use its fruit.
translation:
  language: sw
  text: Utamposa mwanamke[a], lakini mwanamume mwingine atafanya naye ngono[b]; utajenga nyumba, lakini hutaishi humo; utapanda shamba la mizabibu, lakini hutaanza kutumia matunda yake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Utamchumbia mwanamke.”
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania ni neno kali la tendo la ngono. Baadhi ya tafsiri hulitafsiri kwa maneno yanayodokeza kunajisi kwa nguvu, lakini umbo hili la kitenzi halisemi wazi kwamba nguvu ilitumiwa.
    reason: lexical_alternative
  - marker: c
    text: Kwa neno halisi, “hutalifanya kuwa la matumizi ya kawaida.” Hii ni nahau ya kuanza kutumia matunda ya shamba la mizabibu kwa matumizi ya kawaida.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְאָרֵשׂ אִשָּׁה
  choice: utamposa mwanamke
  rationale: Kitenzi ‘posa’ ni cha kawaida na chenye heshima katika Kiswahili cha Afrika Mashariki kwa kuingia katika uchumba wenye lengo la ndoa; ‘mwanamke’ hapa ni yule anayekusudiwa kuwa mke.
- source_word: אִישׁ אַחֵר
  choice: mwanamume mwingine
  rationale: Tafsiri ya moja kwa moja inayohifadhi utofautishaji kati ya mhusika anayesemeshwa na mwanamume mwingine.
- source_word: ישגלנה
  choice: atalala naye
  rationale: Ni usemi unaoeleweka wazi kuwa wa ngono katika Kiswahili bila kuingiza kwa lazima wazo la kutumia nguvu, ambalo umbo hili la kitenzi halitamki wazi.
- source_word: תֵשֵׁב בּוֹ
  choice: hutakaa ndani yake
  rationale: Katika muktadha wa nyumba, ‘kukaa ndani yake’ humaanisha kuishi humo na ni Kiswahili cha kawaida.
- source_word: כֶּרֶם
  choice: shamba la mizabibu
  rationale: Hili ni neno la kawaida na linaloeleweka kwa eneo lililopandwa mizabibu.
- source_word: תְחַלְּלֶנּוּ
  choice: hutaanza kutumia matunda yake
  rationale: Katika muktadha huu piel ya חלל ni nahau ya kuanza matumizi ya kawaida ya mazao ya shamba la mizabibu, si ‘kulitia unajisi’ kwa maana ya kawaida.
