source:
  edition: WLC
  text: וּ/בָ֨אוּ עָלֶ֜י/ךָ כָּל הַ/קְּלָל֣וֹת הָ/אֵ֗לֶּה וּ/רְדָפ֨וּ/ךָ֙ וְ/הִשִּׂיג֔וּ/ךָ עַ֖ד הִשָּֽׁמְדָ֑/ךְ כִּי לֹ֣א שָׁמַ֗עְתָּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֛ר מִצְוֺתָ֥י/ו וְ/חֻקֹּתָ֖י/ו אֲשֶׁ֥ר צִוָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/045.yaml
  text: And all these curses will come upon you and pursue you and overtake you[a], until you are destroyed, because you did not listen to the voice of Yahweh your God, to keep his commandments and his statutes that he commanded you.
translation:
  language: sw
  text: Laana hizi zote zitakujia, zitakufuatilia na zitakupata, mpaka uangamizwe, kwa sababu hukuisikiliza sauti ya Yahweh Mungu wako[a], ili uzishike amri zake na sheria zake alizokuamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hukumtii Yahweh Mungu wako kwa kuzishika amri zake na sheria zake.” Kiebrania kinasema moja kwa moja, “hukuisikiliza sauti ya.”
    reason: Toleo mbadala linaonyesha maana ya kutii iliyomo katika nahau ya Kiebrania huku maandishi makuu yakihifadhi taswira yake halisi.
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ
  choice: zitakujia
  rationale: Katika onyo hili la agano, kitenzi kinaeleza matokeo yajayo; “zitakujia” ni Kiswahili cha kawaida kinachohifadhi wazo la laana kumjia mtu.
- source_word: כָּל הַקְּלָלוֹת הָאֵלֶּה
  choice: laana hizi zote
  rationale: Tafsiri ya moja kwa moja na ya kawaida katika muktadha wa baraka na laana.
- source_word: וּרְדָפוּךָ
  choice: zitakufuatilia
  rationale: Huhifadhi taswira ya laana zinazomwandama mhusika bila kuongeza wazo mahususi la mateso ya kidini.
- source_word: וְהִשִּׂיגוּךָ
  choice: na kukupata
  rationale: Katika mfuatano wa kufuatilia na kufikia, “kukupata” hueleza kwa kawaida kuwa laana zitamfikia na kumkamata mlengwa.
- source_word: עַד הִשָּׁמְדָךְ
  choice: mpaka uangamizwe
  rationale: Huhifadhi kikomo cha tukio na hali ya kutotaja wazi mtendaji wa maangamizi.
- source_word: כִּי לֹא שָׁמַעְתָּ בְּקוֹל
  choice: kwa sababu hukuisikiliza sauti
  rationale: Huhifadhi taswira halisi ya Kiebrania ya kuisikiliza sauti, huku muktadha ukionyesha kuwa maana yake inahusisha kutii.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh Mungu wako
  rationale: Jina la agano יְהוָה limetoholewa kuwa “Yahweh,” na אֱלֹהֶיךָ limetafsiriwa kwa kawaida kuwa “Mungu wako.”
- source_word: לִשְׁמֹר
  choice: ili uzishike
  rationale: Muundo huu unaonyesha kusudi au maudhui ya kuisikiliza sauti bila kuufanya uhusiano wa kisarufi kuwa maelezo ya namna pekee.
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו
  choice: amri zake na sheria zake
  rationale: “Amri” na “sheria” ni maneno ya Kiswahili yanayoeleweka na yanadumisha utofauti wa istilahi mbili za kisheria.
- source_word: אֲשֶׁר צִוָּךְ
  choice: alizokuamuru
  rationale: Huhifadhi wazi kwamba Yahweh ndiye aliyempa msikilizaji amri na sheria hizo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; “Yahweh” huhifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Iwapo שָׁמַע בְּקוֹל itafsiriwe kwa maana pana ya kutii au kwa taswira ya kusikiliza sauti
  choice: hukuisikiliza sauti
  alternative: hukumtii
  rationale: Tafsiri kuu huhifadhi taswira ya kusikia iliyo katika Kiebrania, na tanbihi inaonyesha maana yake ya kiutendaji ya kutii bila kufuta mvutano huo wa kileksia.
- issue: Uhusiano wa לִשְׁמֹר na kuisikiliza sauti
  choice: ili uzishike
  alternative: kwa kuzishika
  rationale: “Ili uzishike” hufuata umbo la kitenzi-jina lenye kiambishi לְ na huhifadhi uwezekano wa kusudi au maudhui, badala ya kulazimisha maana ya namna pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mfuatano “zitakujia, zitakufuatilia na kukupata” huhifadhi mwendo unaoongezeka wa vitenzi vya Kiebrania.
