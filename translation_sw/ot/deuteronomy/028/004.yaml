base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/004.yaml
  text: Blessed shall be the fruit of your womb[a], and the fruit of your ground, and the fruit of your livestock—the offspring of your herds and the young of your flocks.
translation:
  language: sw
  text: Utabarikiwa uzao wa tumbo lako, mazao ya ardhi yako, na uzao wa mifugo yako—ndama wa ng’ombe wako na ongezeko la makundi yako ya kondoo na mbuzi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watoto wa makundi yako.” Semi za Kiebrania שְׁגַר אֲלָפֶיךָ na עַשְׁתְּרֹת צֹאנֶךָ ni istilahi za jadi za mifugo zinazorejelea uzazi au ongezeko la ng’ombe na makundi ya kondoo na mbuzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Utabarikiwa
  rationale: Kivumishi cha kiarifu katika mfumo wa baraka; wakati ujao unaendeleza muktadha wa baraka za agano kwa Kiswahili cha kawaida.
- source_word: פְּרִי
  choice: uzao / mazao
  rationale: 'Neno lilelile limetumiwa katika maeneo matatu. Kiswahili huhitaji kubadili kwa kiasi kulingana na muktadha: ‘uzao’ kwa tumbo na mifugo, ‘mazao’ kwa ardhi, huku ulinganifu wa maana ukihifadhiwa.'
- source_word: בִטְנְךָ
  choice: tumbo lako
  rationale: Huhifadhi taswira halisi ya Kiebrania na katika muktadha humaanisha tumbo la uzazi, yaani chanzo cha watoto.
- source_word: אַדְמָתְךָ
  choice: ardhi yako
  rationale: Hurejelea udongo unaotoa mazao, bila kupanua maana kuwa nchi au eneo lote.
- source_word: בְהֶמְתֶּךָ
  choice: mifugo yako
  rationale: Ni neno pana kwa wanyama wanaofugwa, na vifungu vinavyofuata vinaeleza ng’ombe na makundi ya kondoo na mbuzi.
- source_word: שְׁגַר
  choice: ndama
  rationale: Katika muungano huu na ng’ombe, hurejelea watoto wanaozaliwa; ‘ndama’ ni tafsiri ya asili na mahususi kwa Kiswahili.
- source_word: אֲלָפֶיךָ
  choice: makundi yako ya ng’ombe
  rationale: Neno la pamoja linalohusu ng’ombe; ‘makundi ya ng’ombe’ linaeleweka kwa urahisi na linalingana na makundi ya kondoo na mbuzi.
- source_word: עַשְׁתְּרֹת
  choice: wanakondoo na wanambuzi
  rationale: Katika usemi huu wa jadi wa mifugo, humaanisha ongezeko au watoto wa kundi; tafsiri hii inaweka wazi aina za watoto bila kuingiza maana ya ziada.
- source_word: צֹאנֶךָ
  choice: makundi yako
  rationale: Ni jina la pamoja kwa mifugo midogo, hasa kondoo na mbuzi; aina hizo tayari zimetajwa katika ‘wanakondoo na wanambuzi.’
