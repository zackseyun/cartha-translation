  yaml_path: translation/ot/deuteronomy/028/040.yaml
  text: You will have olive trees throughout all your territory[a], but you will not anoint yourself with oil, because your olives will fall off.
translation:
  language: sw
  text: Utakuwa na mizeituni katika eneo lako lote, lakini hutajipaka mafuta, kwa sababu zeituni zako zitapukutika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “zao lako la zeituni litapukutika,” au “mzeituni wako utadondosha matunda yake.” Kiebrania kinatumia “zeituni wako” kwa maana ya jumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֵיתִים
  choice: mizeituni
  rationale: Katika muktadha huu neno linaelekea kumaanisha miti ya zeituni iliyotapakaa katika nchi, si matunda yaliyokwisha vunwa.
- source_word: יִהְיוּ לְךָ
  choice: utakuwa na
  rationale: Hii ni njia ya asili ya Kiswahili kueleza umilikaji unaowakilishwa na muundo wa Kiebrania wa 'kuwa kwa ajili yako.'
- source_word: בְּכָל גְּבוּלֶךָ
  choice: katika eneo lako lote
  rationale: גְּבוּל hapa inaashiria eneo lote lililo ndani ya mipaka, na 'eneo lako lote' ni wazi na ya kawaida kwa msomaji wa sasa.
- source_word: וְשֶׁמֶן
  choice: mafuta
  rationale: Chanzo kinasema tu 'mafuta'; muktadha wa mizeituni unaonyesha kuwa ni mafuta ya zeituni bila kulazimika kuliongeza katika matini.
- source_word: לֹא תָסוּךְ
  choice: hutajipaka mafuta
  rationale: סוך humaanisha kupaka mwili mafuta. Usemi huu wa kawaida unaepuka kufanya tendo hilo lionekane hasa la sherehe za kidini.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya kutoweza kujipaka mafuta.
- source_word: יִשַּׁל
  choice: zitapukutika
  rationale: Kitenzi kinaeleza matunda kujitenga na mti na kuanguka; 'kupukutika' ni neno la asili la Kiswahili kwa matunda au majani yanayoanguka kutoka mtini.
- source_word: זֵיתֶךָ
  choice: zeituni zako
  rationale: Umoja wa Kiebrania umetumiwa kijumla na unaweza kurejelea matunda, zao, au mti unaodondosha matunda. 'Zeituni zako' huwasilisha uwezekano wa matunda huku tanbihi ikihifadhi utata.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Mizeituni' hutambulisha miti, na 'zeituni zako' hutambulisha matunda kwa kawaida; tanbihi huhifadhi maana mbadala ya umoja wa kijumla katika Kiebrania.
