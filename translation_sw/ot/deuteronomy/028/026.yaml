base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/026.yaml
  text: Your carcass will become food for every bird of the sky and for the beasts of the earth[c][b][a], and there will be no one to frighten them away.
translation:
  language: sw
  text: Mzoga wako utakuwa chakula cha ndege wote wa angani na cha wanyama wa nchi[a], wala hakutakuwa na mtu wa kuwafukuza.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “ndege wa anga na wanyama wa nchi”; huu ni ulinganifu wa anga na nchi unaosisitiza kwamba mzoga utaachwa wazi kabisa na kudhalilishwa.
    reason: cultural_note
  - marker: b
    text: Yaani, hakutakuwa na mtu wa kuwafukuza ndege na wanyama wanaokula mzoga huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: itakuwa
  rationale: Katika mfululizo wa laana, kitenzi hiki kinaonyesha matokeo ya wakati ujao; ‘itakuwa’ ni Kiswahili cha kawaida na kinacholingana na muundo unaofuata.
- source_word: נִבְלָתְךָ
  choice: maiti yako
  rationale: ‘Maiti’ humaanisha mwili wa mtu aliyekufa na hapa inadumisha ukali na fedheha ya hukumu bila kutumia usemi usio wa kawaida kwa Kiswahili sanifu.
- source_word: לְמַאֲכָל
  choice: chakula
  rationale: Nomino hii humaanisha chakula au kitu kinacholiwa; ‘itakuwa chakula’ huwasilisha kwa ufasaha matokeo yanayoonyeshwa na לְ.
- source_word: לְכָל עוֹף הַשָּׁמַיִם
  choice: cha kila ndege wa angani
  rationale: עוֹף ni jina la kijumla la viumbe warukao, lakini ‘kila ndege wa angani’ ni wazi, asili, na huhifadhi taswira ya Kiebrania.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: na cha wanyama wa nchi
  rationale: בְּהֵמָה hapa ni jina la kijumla la wanyama wa nchi kavu. ‘Wanyama wa nchi’ ni Kiswahili cha kawaida na huhifadhi ulinganifu wa anga na nchi.
- source_word: וְאֵין מַחֲרִיד
  choice: wala hakutakuwa na mtu wa kuwafukuza
  rationale: Hiphil ya חרד ina wazo la kusababisha hofu; katika muktadha huu maana ya kitendo ni kuwafanya ndege na wanyama waondoke. ‘Kuwafukuza’ huwasilisha maana hiyo kwa Kiswahili cha kawaida, huku kiwakilishi kikiwaweka wazi walengwa waliodokezwa.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Maiti’ huhifadhi ukali wa hukumu; ‘wanyama wa nchi’ ni ya kawaida kuliko ‘wanyama-mwitu’ na haiongezi sifa ambayo haijasemwa wazi katika chanzo.
