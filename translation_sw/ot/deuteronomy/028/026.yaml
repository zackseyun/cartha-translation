    text: Kihalisi, “ndege wa anga na wanyama wa nchi”; huu ni ulinganifu wa anga na nchi unaosisitiza kwamba mzoga utaachwa wazi kabisa na kudhalilishwa.
    reason: cultural_note
  - marker: b
    text: Yaani, hakutakuwa na mtu wa kuwafukuza ndege na wanyama wanaokula mzoga huo.
    reason: lexical_alternative
  revision_rationale: Revised “maiti yako” to “mzoga wako” to preserve the source text’s harsh, dishonouring judgment register. Recast the bird phrase as a natural collective plural. The footnotes have been adjusted to match the revised wording and retain their anchors.
