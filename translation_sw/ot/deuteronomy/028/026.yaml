review_pass:
  verdict: revise
  source_fidelity: The draft conveys the future curse, the scavenging birds and land animals, and the absence of anyone to drive them away. However, “maiti” is comparatively neutral and does not adequately represent the harsh, dishonouring force of נִבְלָתְךָ in this judgment context. “Mzoga wako” is a suitably stark and idiomatic equivalent here.
  naturalness: “Chakula cha kila ndege wa angani” is understandable but somewhat less natural in this collective context. “Chakula cha ndege wote wa angani” reads more fluently while preserving the comprehensive sense.
  terminology: “Mzoga” appropriately retains the degrading register of the Hebrew without adding an interpretive theological claim. “Wanyama wa nchi” is acceptable for בֶהֱמַת הָאָרֶץ, and “kuwafukuza” accurately communicates the contextual sense of the Hiphil participle.
  issues:
  - severity: medium
    issue: “Maiti yako” is too neutral for נִבְלָתְךָ.
    rationale: The Hebrew term denotes a dead body/carcass and carries a deliberately dishonouring nuance in this curse. “Mzoga wako” better preserves that register in natural Standard East African Swahili.
  - severity: low
    issue: The phrase “cha kila ndege wa angani” is less idiomatic than a collective plural expression.
    rationale: The Hebrew uses a collective expression with “all/every.” “Ndege wote wa angani” is natural Swahili and retains the intended totality.
  revised_text: Mzoga wako utakuwa chakula cha ndege wote wa angani na cha wanyama wa nchi[a], wala hakutakuwa na mtu wa kuwafukuza.[b]
  revised_footnotes:
