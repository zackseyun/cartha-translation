  text: Naye atakuletea tena magonjwa yote ya Misri uliyoyaogopa, nayo yatakushikilia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵשִׁיב
  choice: atawaletea tena
  rationale: Hifili ya שוב ina maana ya kusababisha kitu kirudi au kukileta tena. Katika muktadha wa laana za agano, usemi huu unaonyesha kwamba Mungu atawaletea tena yale magonjwa.
- source_word: בְּךָ
  choice: -wa- katika atawaletea
  rationale: Kihusishi ב kinaonyesha wale watakaopatwa na magonjwa; katika Kiswahili maana hiyo inaelezwa kwa yambwa katika kitenzi.
- source_word: כָּל מַדְוֵה מִצְרַיִם
  choice: magonjwa yote ya Misri
  rationale: מַדְוֶה humaanisha ugonjwa au maradhi. 'Magonjwa yote ya Misri' ni tafsiri ya moja kwa moja na ya kawaida bila kubainisha aina zisizotajwa.
- source_word: אֲשֶׁר יָגֹרְתָּ מִפְּנֵיהֶם
  choice: mliyoyaogopa
  rationale: יגר huonyesha kuogopa au kuwa na hofu. Kiwakilishi cha wingi katika מִפְּנֵיהֶם kinarejelea magonjwa; 'mliyoyaogopa' ni usemi wa kawaida unaohifadhi maana hiyo.
- source_word: וְדָבְקוּ בָּךְ
  choice: nayo yatawashikilia
  rationale: דבק humaanisha kushikamana, kung'ang'ania, au kuambatana kwa kudumu. 'Yatawashikilia' huhifadhi picha ya magonjwa yasiyoachilia kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Mtendaji wa tendo la kuyaleta tena magonjwa
  choice: Naye atawaletea tena
  alternative: Magonjwa yote ya Misri yatawarudia
  rationale: Kitenzi cha Kiebrania ni cha kusababisha na kina kiima cha nafsi ya tatu kinachorejelea Bwana katika muktadha; tafsiri haipaswi kuficha uwakala huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Wingi umetumiwa kwa walengwa kwa sababu muktadha unalihutubia taifa, ingawa Kiebrania kina viambishi vya umoja wa jumla. Hakuna tanbihi iliyohitajika kwa kuwa tofauti za kileksika zinaweza kuwakilishwa wazi katika matini.
