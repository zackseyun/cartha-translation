base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/054.yaml
  text: The man who is tender among you and very delicate—his eye will be hostile toward his brother[a], toward the wife of his bosom[b], and toward the rest of his children whom he has left.
translation:
  language: sw
  text: Mwanamume aliye mwororo na aliyezoea anasa sana miongoni mwenu atawaonea kijicho[a] ndugu yake, mke wake wa kifuani, na watoto wake wengine waliobaki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi ni “jicho lake litakuwa baya kwa.” Nahau hii inaweza kuonyesha uhasama, uchoyo, au kukataa kushiriki na wengine.
    reason: lexical_alternative
  - marker: b
    text: Au “watoto wake wengine atakaowaacha.”
    reason: alternative_reading
lexical_decisions:
- source_word: הָאִישׁ
  choice: Mwanamume
  rationale: Nomino hii ni ya umoja wa kiume, na katika muktadha inaelekezwa kwa mwanamume hasa, ikilingana na mstari unaofuata unaomtaja mwanamke.
- source_word: הָרַךְ
  choice: aliye mwororo
  rationale: Neno lina maana ya kuwa laini au mwororo; hapa linaonyesha mtu asiyezoea hali ngumu.
- source_word: וְהֶעָנֹג מְאֹד
  choice: na aliyezoea anasa sana
  rationale: Kirai kinaonyesha mtu aliyeishi kwa starehe na malezi ya anasa. Tafsiri hii ni ya kawaida katika Kiswahili na haibani maana kuwa udhaifu wa mwili pekee.
- source_word: תֵּרַע עֵינוֹ
  choice: atawatazama kwa jicho baya
  rationale: Hii inadumisha picha ya nahau ya Kiebrania huku ikieleweka kwa Kiswahili. Nahau inaweza kuonyesha uhasama, uchoyo, au kutotaka kuwapa wengine.
- source_word: בְאָחִיו
  choice: ndugu yake
  rationale: Maana ya kawaida ni ndugu yake; ingawa katika matumizi fulani inaweza kumaanisha jamaa wa karibu, hakuna sababu ya kuipanua hapa.
- source_word: אֵשֶׁת חֵיקוֹ
  choice: mke anayemkumbatia kifuani
  rationale: Tafsiri inadumisha picha halisi ya kifua kama ishara ya ukaribu wa kindoa bila kutumia kirai kisicho cha kawaida ‘mke wa kifua chake.’
- source_word: יֶתֶר בָּנָיו
  choice: watoto wake wengine
  rationale: בנים inaweza kumaanisha wana au watoto kwa ujumla. Katika muktadha huu ‘watoto’ ni ya kawaida na inaakisi maana pana inayowezekana.
- source_word: אֲשֶׁר יוֹתִיר
  choice: watakaokuwa wamebaki
  rationale: Kitenzi kinamaanisha kuacha wasalie au kuwa na waliosalia. Muundo huu unaonyesha watoto watakaokuwa bado wamebaki wakati wa hali inayoelezwa.
