base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/037.yaml
  text: And you shall become an object of horror[a], a proverb[c][b], and a taunt among all the peoples where Yahweh will drive you.
translation:
  language: sw
  text: Nawe utakuwa kitu cha kutia hofu[a], methali[b], na neno la dhihaka[c] miongoni mwa watu wote ambako Yahweh atakufukuza[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitu cha kushangaza.” Neno la Kiebrania linaweza kumaanisha kitu au hali ya kutisha sana, inayosababisha hofu au mshangao.
    reason: lexical_alternative
  - marker: b
    text: Au, “msemo.” Hapa “methali” ni usemi ambao watu wangetumia kumrejelea mtu aliyepatwa na maafa.
    reason: lexical_alternative
  - marker: c
    text: Au, “msemo wa kejeli.” Kiebrania kinatumia maneno mawili yanayohusiana lakini tofauti kwa “methali” na “neno la dhihaka.”
    reason: lexical_alternative
  - marker: d
    text: Au, “ambako Yahweh atakuongoza.” Kitenzi cha Kiebrania kinaweza kumaanisha kuongoza au kuendesha; “atakufukuza” huonyesha kulazimishwa kwa uhamisho katika muktadha huu wa laana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתָ
  choice: Nawe utakuwa
  rationale: Kitenzi hiki kina nguvu ya wakati ujao katika mfululizo wa laana; ‘utakuwa’ ni ya kawaida na huonyesha hali itakayotokea.
- source_word: לְשַׁמָּה
  choice: kitu cha kutisha
  rationale: Neno שַׁמָּה katika muktadha wa hukumu humaanisha kitu kinachosababisha hofu au mshangao kwa sababu ya maangamizi yake.
- source_word: לְמָשָׁל
  choice: mithali
  rationale: מָשָׁל humaanisha mithali au msemo unaotumiwa kumrejelea mtu; ‘mithali’ ni kisawe cha moja kwa moja, huku muktadha wa laana ukionyesha maana yake mbaya.
- source_word: וְלִשְׁנִינָה
  choice: neno la dhihaka
  rationale: שְׁנִינָה ni usemi mkali wa kumdhihaki mtu. Tafsiri hii huhifadhi kipengele cha maneno ya kejeli na kulitofautisha na מָשָׁל.
- source_word: בְּכֹל הָעַמִּים
  choice: miongoni mwa watu wote
  rationale: עַמִּים ni wingi wa ‘watu’; usemi huu ni wa asili katika Kiswahili na unafuata maana ya Kiebrania.
- source_word: אֲשֶׁר יְנַהֶגְךָ
  choice: ambako Yahweh atakufukuza
  rationale: נהג inaweza kumaanisha kuongoza au kusukuma/kuendesha. Katika muktadha wa laana na uhamisho wa lazima, ‘atakufukuza’ huwasilisha vizuri nguvu ya kulazimishwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetafsiriwa kwa kunukuliwa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: שָׁמָּה
  choice: ambako
  rationale: Kielezi ‘huko’ kimejumuishwa kiasili katika kishazi cha mahali ‘ambako ... atakufukuza,’ bila marudio yasiyo ya lazima.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi la agano יהוה; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya kitenzi נהג katika muktadha wa laana
  choice: atakufukuza
  alternative: atakakuongoza
  rationale: Kitenzi chenyewe kinaweza kumaanisha kuongoza au kuendesha, lakini katika muktadha huu wa uhamisho na kutawanywa kama hukumu, maana ya kulazimishwa ina uzito zaidi bila kuondoa uwezekano wa kileksika unaotajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Neno la dhihaka’ limetumiwa badala ya nomino nzito au ya kizamani ili kudumisha tofauti kati ya מָשָׁל na שְׁנִינָה. Alama zote za tanbihi zimewekwa mara moja katika sehemu husika ya maandishi.
