  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu גּוֹי עַז פָּנִים kama “taifa lenye sura kali,” na inadumisha ulinganifu wa matamko mawili ya Kiebrania: kutompa mzee heshima/angalio na kutomwonyesha kijana fadhili. “Kijana” ni chaguo salama kwa נַעַר katika jozi yake na “mzee.”'
