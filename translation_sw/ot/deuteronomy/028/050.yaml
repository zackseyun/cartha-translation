lexical_decisions:
- source_word: גּוֹי
  choice: taifa
  rationale: Neno hili kwa kawaida humaanisha taifa au kundi la watu; hapa linafaa kwa nguvu ya kigeni inayovamia katika muktadha wa laana ya agano.
- source_word: עַז פָּנִים
  choice: lenye sura kali
  rationale: Kirai hiki kihalisi huhusisha uso wenye ukali au nguvu. ‘Lenye sura kali’ huhifadhi taswira ya uso kwa Kiswahili cha kawaida bila kukifanya kirai kuwa maelezo marefu.
- source_word: אֲשֶׁר
  choice: lisilo-
  rationale: Kiwakilishi hiki kinaanzisha maelezo kuhusu taifa; muundo wa Kiswahili ‘lisilo-’ unaunganisha sentensi kwa njia ya asili.
- source_word: לֹא יִשָּׂא פָנִים לְזָקֵן
  choice: lisilomheshimu mzee
  rationale: Nahau ya Kiebrania ni ‘kutoinua uso wa mzee’ na inaweza kumaanisha kutomjali, kutompendelea, au kutomheshimu. Katika ulinganisho wa mzee na kijana, ‘kutomheshimu mzee’ ni wazi na ya asili.
- source_word: זָקֵן
  choice: mzee
  rationale: Umoja umetumiwa kwa maana ya jumla. ‘Mzee’ huhifadhi umoja huo na humaanisha mtu mwenye umri mkubwa.
- source_word: וְנַעַר
  choice: wala ... kijana
  rationale: נַעַר inaweza kumaanisha mtoto, kijana, au mwanamume kijana. Kwa kuwa imelinganishwa na ‘mzee,’ ‘kijana’ hudumisha jozi ya makundi ya umri bila kuifinya maana kupita kiasi.
- source_word: לֹא יָחֹן
  choice: wala kumwonyesha ... fadhili
  rationale: Kitenzi חנן humaanisha kumwonyesha mtu fadhili au neema. Tafsiri hii huhifadhi maana hiyo, huku tanbihi ikitaja uwezekano wa ‘huruma.’
