base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/010.yaml
  text: Then all the peoples of the earth will see that the name of Yahweh is called upon you[a], and they will fear you.
translation:
  language: sw
  text: Ndipo mataifa yote ya dunia yatakapoona kwamba jina la Yahweh limeitwa juu yako[a], nao watakuogopa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unaitwa kwa jina la Yahweh.” Kihalisi, usemi wa Kiebrania unasema jina la Yahweh “limeitwa juu yako”; unaonyesha kwamba umetambulishwa kuwa wa Yahweh katika agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאוּ
  choice: Ndipo ... yatakapoona
  rationale: Kitenzi hiki katika mfululizo wa baraka kinaeleza matokeo ya ahadi zilizotangulia. “Ndipo” linaonyesha mtiririko huo, ingawa “na ... yataona” pia linawezekana.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: mataifa yote ya dunia
  rationale: עַמִּים humaanisha makundi mbalimbali ya watu au mataifa; katika muktadha huu wa kutambuliwa na ulimwengu wa nje, “mataifa yote ya dunia” ni wazi na ya kawaida kuliko “watu wote wa nchi.”
- source_word: כִּי
  choice: kwamba
  rationale: Hapa neno hili linaanzisha jambo ambalo mataifa yataona, hivyo “kwamba” linafaa kuliko maana ya kisababishi kama “kwa sababu.”
- source_word: שֵׁם יְהוָה
  choice: jina la Yahwe
  rationale: Muundo huu unahifadhi usemi wa Kiebrania na kulitaja jina la agano יְהוָה kama “Yahwe.”
- source_word: נִקְרָא עָלֶיךָ
  choice: limetajwa juu yako
  rationale: Usemi huu una maana halisi ya jina kuitwa au kutangazwa juu ya mtu, na unaonyesha utambulisho wa agano na kuwa mali ya Yahwe. “Limetajwa juu yako” huhifadhi taswira hiyo kwa Kiswahili kinachoeleweka, huku tanbihi ikionyesha tafsiri mbadala.
- source_word: וְיָרְאוּ מִמֶּךָּ
  choice: nao watakuogopa
  rationale: Katika muktadha huu ירא huonyesha hofu inayotokana na kuona kibali na mamlaka ya Yahwe juu ya Israeli. “Watakuogopa” halazimishi maana kuwa hofu kuu pekee wala kicho cha ibada.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia moja kwa moja Tetragramatoni יְהוָה. “Yahwe” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya usemi נִקְרָא עָלֶיךָ
  choice: jina la Yahwe limetajwa juu yako
  alternative: umeitwa kwa jina la Yahwe
  rationale: Usemi huu unaonyesha kwamba Israeli imetambulishwa hadharani kuwa ya Yahwe. Tafsiri iliyochaguliwa huhifadhi taswira ya jina kutajwa juu ya mtu bila kuufanya usemi huo kuwa ufafanuzi wa moja kwa moja tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Mataifa” limetumiwa kwa wingi wa עַמִּים, na “nao” linaendeleza mhusika bila uzito usio wa lazima.
