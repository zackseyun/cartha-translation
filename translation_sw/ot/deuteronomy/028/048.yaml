base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/048.yaml
  text: And you shall serve your enemies[a], whom Yahweh will send against you, in hunger and in thirst and in nakedness and in lack of everything[b]; and he will put an iron yoke on your neck until he has destroyed you.
translation:
  language: sw
  text: Utawatumikia adui zako ambao Yahweh atawatuma dhidi yako, ukiwa na njaa na kiu, ukiwa uchi, na ukikosa kila kitu. Naye ataweka nira ya chuma[a] shingoni mwako mpaka atakapokuangamiza.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nira iliyotengenezwa kwa chuma.”
    reason: Mbadala huu unaweka wazi kwamba עֹל בַּרְזֶל ni nira ya chuma, ingawa “nira ya chuma” ni ya kawaida zaidi kwa Kiswahili.
  - marker: b
    text: Kiebrania kinaweza pia kueleweka kuwa adui ndiye atakayeweka nira na kukuangamiza; tafsiri kuu inamchukulia Yahweh kuwa kiima kinachoendelea kutoka kishazi kilichotangulia.
    reason: Muundo wa Kiebrania unaruhusu utata kuhusu kiima cha vitenzi viwili vya mwisho; tanbihi huhifadhi usomaji huo mbadala.
lexical_decisions:
- source_word: וְעָבַדְתָּ אֶת אֹיְבֶיךָ
  choice: Utawatumikia adui zako
  rationale: Kitenzi עבד hapa kinaonyesha utumishi wa kulazimishwa chini ya maadui, si ibada. Wakati ujao unafaa muktadha wa laana ya agano.
- source_word: אֲשֶׁר יְשַׁלְּחֶנּוּ יְהוָה בָּךְ
  choice: ambao Yahweh atawatuma dhidi yako
  rationale: Kirai kinaonyesha Yahweh akiwatuma maadui kwa hatua ya uhasama; ‘dhidi yako’ ni Kiswahili cha kawaida kinachoeleza maana ya ב katika muktadha huu.
- source_word: בְּרָעָב וּבְצָמָא וּבְעֵירֹם
  choice: ukiwa na njaa, kiu, uchi
  rationale: Muundo huu unaonyesha hali za kunyimwa mahitaji wakati wa utumishi. Orodha fupi inadumisha mkusanyiko wenye nguvu wa Kiebrania.
- source_word: וּבְחֹסֶר כֹּל
  choice: na ukosefu wa kila kitu
  rationale: חֹסֶר ni ukosefu au uhitaji, huku כֹּל ikionyesha kwamba hakuna kinachobaki; tafsiri hii inadumisha ujumla huo.
- source_word: וְנָתַן עֹל בַּרְזֶל עַל צַוָּארֶךָ
  choice: Naye ataweka nira ya chuma shingoni mwako
  rationale: ‘Nira ya chuma’ inadumisha picha halisi ya utumwa mkali na kutawaliwa, kwa lugha ya kawaida na yenye hadhi.
- source_word: עַד הִשְׁמִידוֹ אֹתָךְ
  choice: mpaka atakapokuangamiza
  rationale: Hiphil ya שׁמד ina maana ya kuharibu au kuangamiza kabisa. ‘Kuangamiza’ inadumisha ukali wa hukumu bila kuongeza maelezo yasiyokuwapo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יְהוָה; ‘Yahweh’ linawakilisha jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Kiima cha וְנָתַן ... עַד הִשְׁמִידוֹ
  choice: 'Yahweh anaendelea kuwa kiima: ‘Naye ataweka ... mpaka atakapokuangamiza.’'
  alternative: 'Adui ndiye kiima: ‘Naye adui ataweka ... mpaka atakapokuangamiza.’'
  rationale: Kiima cha wazi kilicho karibu ni Yahweh, na mfuatano wa vitenzi vya umoja unaweza kuendelea kumhusu. Hata hivyo, Kiebrania pia kinaruhusu adui kueleweka kuwa kiima, hivyo uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. ‘Utawatumikia’ huepuka maana ya ibada na kuonyesha utumishi chini ya maadui. Mgawanyo katika sentensi mbili unaweka wazi hatua ya hukumu bila kuvunja mtiririko wa wazo.
