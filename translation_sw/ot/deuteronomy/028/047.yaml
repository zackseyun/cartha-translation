base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/047.yaml
  text: because you did not serve Yahweh your God with joy and with gladness of heart[a], because of the abundance of all things[b],
translation:
  language: sw
  text: kwa sababu hukumtumikia Yahweh Mungu wako kwa furaha na kwa moyo mkunjufu[a], kwa sababu ya wingi wa kila kitu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kwa wema wa moyo.” Kiebrania husema kihalisi kuhusu “uzuri” au “wema wa moyo,” ambao hapa unaweza kuhusisha uchangamfu wa ndani.
    reason: lexical_alternative
  - marker: b
    text: Au, “kutokana na wingi wa kila kitu,” au “ulipokuwa na wingi wa kila kitu.” Kirai hiki kinaweza kueleza kwamba hukumtumikia Yahweh licha ya kuwa na vitu vyote kwa wingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: kwa sababu
  rationale: Katika muktadha huu, nahau hiyo inaonyesha sababu ya laana ya agano; “kwa sababu” ni ya asili na wazi kwa Kiswahili.
- source_word: עָבַדְתָּ
  choice: hukumtumikia
  rationale: Kitenzi עבד kinapotumiwa kumhusu Mungu hujumuisha huduma, utiifu, na ibada ya agano. “Kumtumikia” huhifadhi upana huo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa moja kwa moja katika Kiebrania; “Yahweh” huhifadhi jina hilo badala ya kulibadili kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Kiambishi ni cha nafsi ya pili umoja wa kiume, katika hotuba inayolielekea taifa la Israeli kama mtu mmoja.
- source_word: בְּשִׂמְחָה
  choice: kwa furaha
  rationale: Kirai hiki kinaeleza namna ambayo huduma ilipaswa kutolewa; “kwa furaha” ni tafsiri ya kawaida na yenye heshima.
- source_word: וּבְטוּב לֵבָב
  choice: na kwa moyo mkunjufu
  rationale: Kirai cha Kiebrania husema kihalisi kuhusu ‘uzuri/wema wa moyo,’ lakini katika muktadha huu kinaweza kueleza hali ya ndani ya uchangamfu. “Moyo mkunjufu” ni Kiswahili cha asili bila kuufanya msemo urudie tu neno ‘furaha.’
- source_word: מֵרֹב כֹּל
  choice: ulipokuwa na wingi wa kila kitu
  rationale: 'Kirai kinaonyesha mazingira ya kushindwa kwa Israeli: hawakumtumikia Mungu ipasavyo licha ya kupewa vitu kwa wingi. Muundo huu huepuka kudokeza kwamba wingi wenyewe ndio uliosababisha kutotii.'
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano la Mungu, si cheo tu; kulihifadhi kama “Yahweh” kunafuata ushahidi wa chanzo bila kuingiza mapokeo ya dhehebu.
- issue: Upana wa huduma ya agano katika עבד
  choice: kumtumikia
  alternative: kumwabudu
  rationale: “Kumtumikia” huhifadhi maana pana ya utiifu na kujitoa kwa Mungu, huku ibada ikiwa sehemu yake; “kumwabudu” pekee ingeifanya maana kuwa finyu.
- issue: Uhusiano wa מֵרֹב כֹּל na kutotumikia
  choice: ulipokuwa na wingi wa kila kitu
  alternative: kwa sababu ya wingi wa kila kitu
  rationale: Kiebrania kinaweza kutafsiriwa kwa ukaribu kama “kutokana na wingi wa kila kitu,” lakini maana inayowezekana ni kwamba kosa lilitokea katika hali ya neema tele, si lazima kwamba wingi ndio uliolisababisha. Tanbihi huhifadhi uwezekano wa muundo wa karibu zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa sasa na hadhi ya maandiko. “Moyo mkunjufu” ni nahau ya kawaida inayobeba hali ya ndani ya furaha bila kurudia moja kwa moja “kwa furaha.” Sentensi inaendelea, kwa hiyo koma ya mwisho imehifadhiwa.
