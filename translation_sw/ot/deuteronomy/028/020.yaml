  text: יְשַׁלַּ֣ח יְהוָ֣ה בְּ֠/ךָ אֶת הַ/מְּאֵרָ֤ה אֶת הַ/מְּהוּמָה֙ וְ/אֶת הַ/מִּגְעֶ֔רֶת בְּ/כָל מִשְׁלַ֥ח יָדְ/ךָ֖ אֲשֶׁ֣ר תַּעֲשֶׂ֑ה עַ֣ד הִשָּֽׁמֶדְ/ךָ֤ וְ/עַד אֲבָדְ/ךָ֙ מַהֵ֔ר מִ/פְּנֵ֛י רֹ֥עַ מַֽעֲלָלֶ֖י/ךָ אֲשֶׁ֥ר עֲזַבְתָּֽ/נִי׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/020.yaml
  text: Yahweh will send on you the curse[a], the confusion, and the rebuke in every undertaking of your hand that you do, until you are destroyed and until you perish quickly, because of the evil of your deeds by which you have forsaken me.
translation:
  language: sw
  text: Yahwe atakuletea laana, msukosuko, na kemeo katika kila unachotia mkono kufanya,[a] mpaka uangamizwe na uangamie upesi, kwa sababu ya uovu wa matendo yako, kwa kuwa umeniacha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “katika kila utumaji wa mkono wako,” yaani, katika kila unachotia mkono kufanya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלַּח יְהוָה בְּךָ
  choice: Yahwe atakuletea
  rationale: Kitenzi kinamtaja Yahwe moja kwa moja kuwa mtendaji anayeleta hukumu za agano juu ya mhusika. ‘Atakuletea’ ni Kiswahili cha kawaida na huonyesha wazi walengwa wa hukumu hiyo.
- source_word: הַמְּאֵרָה
  choice: laana
  rationale: Nomino hii inarejelea laana ya agano kama adhabu halisi; ‘laana’ ni sawa ya kawaida na yenye uzito unaofaa.
- source_word: הַמְּהוּמָה
  choice: fadhaa
  rationale: Neno linaweza kumaanisha machafuko, hofu au mkanganyiko. ‘Fadhaa’ huhifadhi upana wa hali ya kuvurugika bila kuibana kwenye kutokuelewa kiakili pekee.
- source_word: הַמִּגְעֶרֶת
  choice: kemeo
  rationale: Linatokana na mzizi unaoashiria kukemea kwa nguvu, mara nyingi kwa tendo la Mungu. ‘Kemeo’ huhifadhi maana ya shutuma au hukumu yenye mamlaka.
- source_word: בְּכָל מִשְׁלַח יָדְךָ אֲשֶׁר תַּעֲשֶׂה
  choice: katika kila jambo unalofanya kwa mikono yako
  rationale: Hii ni nahau inayomaanisha kila shughuli mtu anayojitolea kuifanya. Tafsiri hii ni ya asili katika Kiswahili huku ikihifadhi taswira ya mikono.
- source_word: עַד הִשָּׁמֶדְךָ וְעַד אֲבָדְךָ מַהֵר
  choice: mpaka uangamizwe na kuharibika upesi
  rationale: Maneno mawili yanayofuatana yanaonyesha kuangamizwa na kufikia hali ya kupotea au kuharibika. Vitenzi tofauti huhifadhi ulinganifu wa Kiebrania bila kuondoa mwingiliano wa maana.
- source_word: מִפְּנֵי רֹעַ מַעֲלָלֶיךָ
  choice: kwa sababu ya uovu wa matendo yako
  rationale: מִפְּנֵי lina matumizi ya kisababishi hapa, na רֹעַ מַעֲלָלֶיךָ hutaja wazi tabia mbaya ya matendo kama sababu ya hukumu.
- source_word: אֲשֶׁר עֲזַבְתָּנִי
  choice: ambayo kwayo umeniacha
  rationale: Kishazi hiki kinaunganisha kumwacha Yahwe na matendo maovu yaliyotangulia. Muundo huu huhifadhi uhusiano huo badala ya kuufanya kuwa sentensi huru.
theological_decisions:
- issue: Kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la agano יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Utendaji katika hukumu ya agano
  choice: Yahwe atakuletea laana, fadhaa na kemeo
  alternative: Laana, fadhaa na kemeo vitakujia
  rationale: Yahwe ndiye kiima wazi cha kitenzi katika Kiebrania. Tafsiri haifanyi hukumu hiyo ionekane kama tukio lisilo na mtendaji.
- issue: Uhusiano kati ya matendo maovu na kumwacha Yahwe
  choice: matendo yako ambayo kwayo umeniacha
  alternative: matendo yako, kwa kuwa umeniacha
  rationale: Kiebrania kinaweza kuhusianisha kishazi cha mwisho na matendo yaliyotajwa. Tafsiri iliyochaguliwa huhifadhi uhusiano wa karibu bila kufafanua zaidi namna matendo hayo yalivyokuwa kumwacha Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Fadhaa’ na ‘kemeo’ huhifadhi uzito wa mfululizo wa hukumu; tanbihi inaeleza nahau ya Kiebrania. Alama [a] imewekwa baada ya kishazi kinachohusika.
