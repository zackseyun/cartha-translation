base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/053.yaml
  text: And you will eat the fruit of your womb[a], the flesh of your sons and daughters whom Yahweh your God has given you[b], in the siege and in the distress with which your enemy will oppress you.
translation:
  language: sw
  text: Nawe utakula tunda la tumbo lako[a]—nyama ya wana wako na binti zako ambao Yahwe Mungu wako amekupa—wakati wa kuzingirwa na dhiki atakayokuletea adui yako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uzao wa mwili wako.” Kiebrania ni “tunda la tumbo lako.”
    reason: lexical_alternative
  - marker: b
    text: Au, “taabu” au “uchungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: Nawe utakula
  rationale: Kitenzi cha Kiebrania katika muktadha wa laana kinaeleza jambo la wakati ujao; “utakula” linatoa uzito wa onyo hilo kwa Kiswahili cha sasa.
- source_word: פְרִי בִטְנְךָ
  choice: tunda la tumbo lako
  rationale: Usemi huu unahifadhi taswira kali ya Kiebrania, huku kirai kinachofuata kikifafanua kwamba unamaanisha wana na binti.
- source_word: בְּשַׂר
  choice: nyama ya
  rationale: Katika muktadha huu neno linamaanisha nyama ya mwili wa binadamu; “nyama” ni neno la kawaida na la moja kwa moja katika Kiswahili bila kupunguza ukali wa mstari.
- source_word: בָּנֶיךָ וּבְנֹתֶיךָ
  choice: wana wako na binti zako
  rationale: Tafsiri inataja makundi yote mawili kama yalivyo katika Kiebrania, badala ya kuyajumlisha tu kuwa “watoto wako.”
- source_word: אֲשֶׁר נָתַן לְךָ יְהוָה אֱלֹהֶיךָ
  choice: ambao Yahwe Mungu wako amekupa
  rationale: Kirai cha uhusiano na wazo la watoto kuwa zawadi kutoka kwa Mungu yamehifadhiwa, jambo linaloongeza uzito wa laana.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetoholewa kwa tahajia ya kawaida na inayotamkika kiasili katika Kiswahili.
- source_word: בְּמָצוֹר
  choice: wakati wa kuzingirwa
  rationale: Neno linamaanisha hali ya mji au watu kuzingirwa; muundo huu ni wa asili zaidi katika Kiswahili kuliko tafsiri ya neno kwa neno “katika mazingiro.”
- source_word: וּבְמָצוֹק
  choice: na katika dhiki
  rationale: “Dhiki” linaonyesha hali kali ya shida na kubanwa bila kuamua kimya kimya ikiwa mkazo ni wa kimwili au wa kihisia.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיְבֶךָ
  choice: ambayo adui yako atakubana nayo
  rationale: “Atakubana” linaonyesha shinikizo na hali ya kukosa njia ya kutokea inayosababishwa na adui wakati wa kuzingirwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina la agano moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mistari mirefu imetenganishwa kwa vistari virefu ili apposition ya “nyama ya wana wako na binti zako” ibaki wazi. Lugha inahifadhi ukali wa laana bila kuuficha wala kuuongezea maelezo yasiyomo katika chanzo.
