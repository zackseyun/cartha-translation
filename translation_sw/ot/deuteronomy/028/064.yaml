source:
  edition: WLC
  text: וֶ/הֱפִֽיצְ/ךָ֤ יְהוָה֙ בְּ/כָל הָ֣/עַמִּ֔ים מִ/קְצֵ֥ה הָ/אָ֖רֶץ וְ/עַד קְצֵ֣ה הָ/אָ֑רֶץ וְ/עָבַ֨דְתָּ שָּׁ֜ם אֱלֹהִ֣ים אֲחֵרִ֗ים אֲשֶׁ֧ר לֹא יָדַ֛עְתָּ אַתָּ֥ה וַ/אֲבֹתֶ֖י/ךָ עֵ֥ץ וָ/אָֽבֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/064.yaml
  text: And Yahweh will scatter you among all the peoples[a], from one end of the earth to the other end of the earth[b], and there you will serve other gods that neither you nor your fathers have known—wood and stone.
translation:
  language: sw
  text: Yahweh atakutawanya kati ya mataifa yote, kutoka mwisho mmoja wa dunia hadi mwisho mwingine wa dunia[a]. Huko utaitumikia miungu mingine ambayo wewe wala mababu zako hamkuijua—mbao na mawe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka mwisho mmoja wa nchi hadi mwisho mwingine wa nchi.” Neno la Kiebrania אֶרֶץ linaweza kumaanisha “nchi” au “dunia”; hapa “dunia” imechaguliwa kwa sababu muktadha unasema kutawanywa kati ya mataifa yote.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “mbao na mawe,” yaani sanamu zilizotengenezwa kwa vitu hivyo.
    reason: cultural_note
lexical_decisions:
- source_word: וֶהֱפִיצְךָ
  choice: atakutawanya
  rationale: Hifili ya פוץ ina maana ya kusababisha mtu atawanyike; “atakutawanya” ni ya kawaida na inaendana na muktadha wa laana ya agano.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa moja kwa moja kama tetragramatoni; linatoholewa badala ya kubadilishwa na cheo.
- source_word: בְּכָל הָעַמִּים
  choice: kati ya mataifa yote
  rationale: Ingawa עַמִּים kihalisi ni “watu/jamaa za watu,” katika Kiswahili “mataifa yote” ni usemi wa kawaida unaoeleza makundi ya watu ambako Israeli atatawanywa, bila kulazimisha maana ya kisiasa.
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: kutoka mwisho mmoja wa dunia hadi mwisho mwingine wa dunia
  rationale: Huhifadhi marudio ya Kiebrania na maana ya eneo lote; “dunia” inafaa katika muktadha wa kutawanywa kati ya mataifa yote, huku uwezekano wa “nchi” ukihifadhiwa katika tanbihi.
- source_word: וְעָבַדְתָּ
  choice: utaitumikia
  rationale: Kitenzi עבד kina maana ya kutumikia na, kinapotumiwa kuhusu miungu, kinadokeza ibada na utii; “utaitumikia” huhifadhi upana huo.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Ni tafsiri ya moja kwa moja ya msemo wa agano unaomaanisha miungu iliyo tofauti na Yahweh.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: ambayo wewe wala mababu zako hamkuijua
  rationale: Muundo wa “wewe wala mababu zako” unaonyesha wazi ukanushaji unaowahusu wote, na “hamkuijua” huhifadhi kitenzi ידע bila kukifasiri kupita kiasi.
- source_word: עֵץ וָאָבֶן
  choice: miungu ya mbao na mawe
  rationale: Jozi hii inaeleza kwa kiambatisho vitu ambavyo miungu hiyo imetengenezwa navyo; kuongeza “miungu ya” hufanya uhusiano huo uwe wazi na wa kawaida katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania ina jina binafsi la agano; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Upeo wa הָאָרֶץ katika msemo wa kutawanywa
  choice: dunia
  alternative: nchi
  rationale: אֶרֶץ inaweza kumaanisha “nchi” au “dunia.” Kutajwa kwa kutawanywa kati ya mataifa yote kunaunga mkono “dunia,” lakini utata halisi wa kileksika umewekwa katika tanbihi.
- issue: Maana ya kutumikia miungu mingine
  choice: utaitumikia
  alternative: utaiabudu
  rationale: “Kutumikia” huhifadhi maana ya msingi ya עבד pamoja na dokezo lake la ibada katika muktadha huu, bila kuibana kuwa tendo la ibada pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Umoja wa nafsi ya pili umehifadhiwa. Sentensi mbili zimetumiwa kwa urahisi wa usomaji bila kubadili uhusiano wa mawazo; marudio ya “dunia” yamehifadhiwa ili kuakisi msisitizo wa Kiebrania.
