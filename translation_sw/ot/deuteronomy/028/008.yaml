base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/008.yaml
  text: Yahweh will command the blessing on you in your storehouses and in all the work of your hand[c][b][a], and he will bless you in the land that Yahweh your God is giving you.
translation:
  language: sw
  text: Yahwe ataamuru baraka iwe pamoja nawe katika ghala zako[a] na katika kazi zote za mikono yako,[b] naye atakubariki katika nchi ambayo Yahwe Mungu wako anakupa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika maghala yako ya nafaka.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “katika kila kazi ya mkono wako,” yaani, katika kazi au shughuli zako zote.
    reason: lexical_alternative
  - marker: c
    text: Au “akupaye” au “atakayekupa.” Kitenzi shirikishi cha Kiebrania hapa kinaweza kutafsiriwa kwa zaidi ya namna moja.
    reason: alternative_reading
lexical_decisions:
- source_word: יְצַו
  choice: ataamuru
  rationale: Kitenzi cha Kiebrania katika Piel kwa kawaida humaanisha ‘kuamuru.’ Tafsiri hii inadumisha picha hai ya Yahwe kuamuru baraka imfikie mtu, badala ya kuirahisisha kuwa ‘atatuma’ au ‘atatoa.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יְהוָה limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili, ‘Yahwe,’ badala ya kulibadilisha kwa cheo kama ‘BWANA.’
- source_word: אִתְּךָ אֶת הַבְּרָכָה
  choice: baraka iwe juu yako
  rationale: Katika muundo huu, baraka ndiyo kitu kinachoamuriwa, na inaelekezwa kwa msikilizaji. ‘Iwe juu yako’ huwasilisha maana hiyo kwa Kiswahili cha kawaida huku ikihifadhi taswira ya Kiebrania.
- source_word: בַּאֲסָמֶיךָ
  choice: katika ghala zako
  rationale: Neno אָסָם hurejelea mahali pa kuhifadhia mazao au vitu. ‘Ghala’ ni neno la kawaida na lenye upana unaofaa katika Kiswahili.
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: na katika kazi zote za mikono yako
  rationale: Nahau hii kwa maana halisi huhusu kila kunyooshwa au kutumwa kwa mkono. ‘Kazi zote za mikono yako’ inadumisha taswira halisi na kueleza kwa uwazi kazi au shughuli zote za mtu.
- source_word: וּבֵרַכְךָ
  choice: naye atakubariki
  rationale: Kitenzi hiki kinaendeleza mwelekeo wa wakati ujao wa kishazi kilichotangulia. ‘Naye’ huweka wazi kwamba Yahwe bado ndiye mtendaji.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: ‘Nchi’ inadumisha maana ya msingi na mwangwi wa kiagano wa ardhi/nchi anayopewa Israeli katika Kumbukumbu la Torati.
- source_word: נֹתֵן לָךְ
  choice: anakupa
  rationale: Kitenzi shirikishi cha Kiebrania kinaweza kuonyesha tendo linaloendelea au lililo karibu. ‘Anakupa’ kinadumisha hali hiyo ya sasa inayoendelea kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: ‘Yahwe’ huhifadhi jina binafsi la Mungu wa agano bila kulibadilisha kuwa cheo. ‘Yehova’ ni unukuzi mwingine wa kihistoria, na ‘BWANA’ ni mbadala wa kimapokeo, lakini si uwasilishaji wa moja kwa moja wa jina.
- issue: Maana ya kiagano ya בָּאָרֶץ
  choice: katika nchi
  alternative: katika ardhi
  rationale: Katika Kumbukumbu la Torati, neno hili mara nyingi hurejelea nchi anayopewa Israeli. ‘Nchi’ huhifadhi mwangwi huo bila kuongeza maneno kama ‘Nchi ya Ahadi,’ ambayo hayapo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo ‘ataamuru baraka iwe juu yako’ unahifadhi usemi hai wa Kiebrania; ‘kazi zote za mikono yako’ inadumisha taswira ya asili bila kuwa ngumu. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika.
