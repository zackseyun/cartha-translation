source:
  edition: WLC
  text: וְ/הִפְלָ֤א יְהוָה֙ אֶת מַכֹּ֣תְ/ךָ֔ וְ/אֵ֖ת מַכּ֣וֹת זַרְעֶ֑/ךָ מַכּ֤וֹת גְּדֹלוֹת֙ וְ/נֶ֣אֱמָנ֔וֹת וָ/חֳלָיִ֥ם רָעִ֖ים וְ/נֶאֱמָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/059.yaml
  text: then Yahweh will make your plagues and the plagues of your offspring extraordinary—great and lasting plagues[b][a], and severe and lasting sicknesses.
translation:
  language: sw
  text: ndipo Yahwe atakapoyafanya mapigo yako na mapigo ya uzao wako kuwa yasiyo ya kawaida[a]—mapigo makubwa na ya kudumu[b], na magonjwa makali na ya kudumu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwa ya kushangaza.” Kitenzi cha Kiebrania kinaweza kumaanisha kufanya jambo liwe la ajabu au la kipekee; hapa kinaeleza hali isiyo ya kawaida ya hukumu hiyo.
    reason: lexical_alternative
  - marker: b
    text: “Ya kudumu” hapa hutafsiri neno la Kiebrania linaloweza kumaanisha thabiti, yenye kuendelea, au isiyokoma upesi. Neno hilohilo limetumiwa kuhusu mapigo na magonjwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְלָא
  choice: atakapoyafanya ... kuwa yasiyo ya kawaida
  rationale: Kitenzi cha Kiebrania katika Hifili kinaonyesha kuyafanya mapigo yawe ya ajabu, ya kushangaza, au ya kipekee. “Yasiyo ya kawaida” huhifadhi wazo la hali ya kipekee bila kudokeza jambo zuri katika muktadha huu wa hukumu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetafsiriwa kwa namna ya kulitamka moja kwa moja, kwa tahajia inayofaa Kiswahili, badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: מַכֹּתְךָ / מַכּוֹת
  choice: mapigo yako / mapigo
  rationale: מכה linaweza kumaanisha pigo, dhoruba ya maafa, au tauni. “Mapigo” linafaa katika muktadha wa laana za agano na linadumisha tofauti na “magonjwa” yanayotajwa baadaye.
- source_word: זַרְעֶךָ
  choice: uzao wako
  rationale: “Uzao” ni Kiswahili cha kawaida kinachohifadhi maana ya pamoja ya זרע, yaani watoto na vizazi vinavyotokana na mtu.
- source_word: גְּדֹלוֹת
  choice: makubwa
  rationale: Neno hili kwa msingi humaanisha “makubwa”; hapa linaonyesha ukubwa au ukali wa mapigo bila kufafanua zaidi ya maandishi.
- source_word: נֶאֱמָנוֹת / נֶאֱמָנִים
  choice: ya kudumu
  rationale: Katika muktadha huu mzizi אמן una maana ya kuwa thabiti, kuendelea, au kutokoma upesi. “Ya kudumu” limetumiwa katika sehemu zote mbili ili kuhifadhi urudiaji wa Kiebrania.
- source_word: חֳלָיִם
  choice: magonjwa
  rationale: Neno hilo humaanisha magonjwa au hali za kuugua; “magonjwa” ni la kawaida na linafaa kwa wingi uliopo katika Kiebrania.
- source_word: רָעִים
  choice: makali
  rationale: Ingawa maana ya msingi ni “mabaya,” likielezea magonjwa neno hili linaonyesha madhara au uzito wake. “Makali” ni usemi wa asili katika Kiswahili cha sasa.
theological_decisions:
- issue: Uwasilishaji wa jina la agano יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: “Yahwe” huhifadhi jina binafsi katika maandishi ya Kiebrania na hulileta katika tahajia ya kawaida ya Kiswahili, badala ya kulibadilisha kuwa cheo.
- issue: Maana ya פלא katika muktadha wa hukumu
  choice: kuwa yasiyo ya kawaida
  alternative: kuwa ya kushangaza; kuwa ya ajabu; kuwa makali sana
  rationale: Kitenzi kinaweza kueleza jambo la ajabu au la kipekee. Tafsiri iliyochaguliwa huhifadhi maana hiyo huku muktadha wenyewe ukionyesha kuwa hali hiyo ni ya hukumu; haiongezi moja kwa moja hisia au kiwango ambacho hakijasemwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi ulinganifu wa mapigo na magonjwa pamoja na urudiaji wa “ya kudumu.”
