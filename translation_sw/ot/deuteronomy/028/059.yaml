  terminology: “Yahwe,” “mapigo,” “uzao,” “magonjwa,” na “ya kudumu” ni chaguo zinazofaa katika Kiswahili Sanifu na zinalingana na maamuzi ya istilahi na maana ya chanzo. “Makali” hutoa vizuri nguvu ya רָעִים katika muktadha wa magonjwa bila kuingiza tafsiri ya kidhehebu.
