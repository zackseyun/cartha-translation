  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: Yahwe ndiye mtendaji; mapigo ya msikilizaji na ya uzao wake yanafanywa ya kipekee/isiyo ya kawaida; mapigo yanaelezwa kuwa makubwa na ya kudumu, na magonjwa kuwa makali na ya kudumu. Urudiaji wa נֶאֱמָנוֹת / נֶאֱמָנִים umehifadhiwa kwa usawa.'
