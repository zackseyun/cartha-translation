translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa moja kwa moja. 'Mazao ya ardhi' ni wa kawaida zaidi kuliko 'matunda ya udongo,' na 'atamiliki' huhifadhi taswira ya kitenzi cha Kiebrania ya kutwaa milki. Alama ya tanbihi [a] imewekwa baada ya sentensi.
