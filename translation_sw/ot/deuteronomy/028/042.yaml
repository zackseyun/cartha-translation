translation:
  language: sw
  text: Kriketi itamiliki miti yako yote na mazao ya ardhi yako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “panzi,” “nzige,” au kwa ujumla zaidi “mdudu mwenye sauti ya kuvuma”; haijulikani kwa hakika neno la Kiebrania צְלָצַל linamaanisha mdudu gani.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: yote
  rationale: Kibainishi hiki kinaonyesha ujumla wa miti inayotajwa, huku athari yake kwa mazao pia ikieleweka katika muundo mzima wa sentensi.
- source_word: עֵצְךָ
  choice: miti yako
  rationale: Katika muktadha wa kilimo, עֵץ humaanisha mti; hapa ina maana ya kijumla ya miti mingi ya mhusika.
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: na mazao ya ardhi yako
  rationale: פְּרִי inaweza kuwa tunda au mazao kwa ujumla, na אַדָמָה ni ardhi au udongo. 'Mazao ya ardhi yako' ni Kiswahili cha kawaida kinachobeba maana pana ya mazao yanayotokana na ardhi.
- source_word: יְיָרֵשׁ
  choice: atamiliki
  rationale: Kitenzi ירשׁ kimsingi humaanisha kutwaa au kumiliki. 'Atamiliki' huhifadhi taswira yenye nguvu ya mdudu kutwaa miti na mazao badala ya kuifafanua tu kuwa atayala.
- source_word: הַצְּלָצַל
  choice: nzige-kelele
  rationale: Utambulisho kamili wa mdudu huyu haujulikani. 'Nzige-kelele' hudumisha rejeo la mdudu maalumu mwenye sauti bila kudai kwa uhakika kuwa ni kriketi, panzi, au nzige wa aina fulani; tanbihi inaweka wazi kutokuwa na uhakika.
