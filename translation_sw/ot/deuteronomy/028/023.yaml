  text: And the heavens above your head shall be bronze[a], and the earth beneath you iron.
translation:
  language: sw
  text: Na anga lililo juu ya kichwa chako litakuwa shaba[a], na ardhi iliyo chini yako itakuwa chuma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shaba ya bati.” Neno la Kiebrania נְחֹשֶׁת linaweza kumaanisha shaba au shaba ya bati, kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: litakuwa
  rationale: Kitenzi cha Kiebrania katika muktadha huu wa laana kina maana ya wakati ujao; umoja unapatana kiasili na nomino ya Kiswahili “anga”.
- source_word: שָׁמֶיךָ אֲשֶׁר עַל רֹאשְׁךָ
  choice: anga lililo juu ya kichwa chako
  rationale: שָׁמַיִם hapa huelekea kumaanisha anga la hali ya hewa; muundo huu unahifadhi mahali pa wima na picha ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: Neno linaweza kutaja shaba au aloi yake; “shaba” ni neno la kawaida la Kiswahili na linaacha upana huo wa kileksika, huku tanbihi ikionyesha uwezekano wa “shaba nyeusi”.
- source_word: וְהָאָרֶץ אֲשֶׁר תַּחְתֶּיךָ
  choice: na ardhi iliyo chini yako
  rationale: “Ardhi” hudumisha ulinganifu na anga na pia picha ya udongo unaokuwa mgumu; “iliyo chini yako” ni usemi wa asili unaohifadhi mpangilio wa wima.
- source_word: בַּרְזֶל
  choice: chuma
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa metali inayotajwa, na linakamilisha picha ya ardhi ngumu isiyotoa mazao.
theological_decisions:
- issue: Nguvu ya sitiari ya laana
  choice: Kudumisha picha halisi ya metali, “shaba” na “chuma,” bila kufafanua ukame au ugumu katika matini kuu.
  alternative: Kutafsiri kwa ufafanuzi kuwa anga halitatoa mvua na ardhi itakuwa ngumu.
  rationale: Kiebrania kinatoa picha kali ya laana ya agano; kuitunza huepuka kuongeza ufafanuzi ambao matini yenyewe haisemi moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi wa anga juu na ardhi chini umehifadhiwa; lugha haijaongezewa maelezo ya kimadhehebu.
