base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/052.yaml
  text: And he will besiege you in all your gates until your high and fortified walls, in which you trust, come down throughout all your land; and he will besiege you in all your gates throughout all your land that Yahweh your God has given you.
translation:
  language: sw
  text: Atakuzingira katika malango yako yote, mpaka kuta zako zilizo juu na zilizoimarishwa, unazozitegemea, zianguke katika nchi yako yote; atakuzingira katika malango yako yote, katika nchi yako yote ambayo Yahwe Mungu wako amekupa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵצַר
  choice: atakuzingira
  rationale: Mzizi צור katika Hiphil, ukiwa katika muktadha wa kijeshi wa malango na kuta, unaonyesha kuzingira mji; tafsiri hii imerudiwa kwa ulinganifu katika sehemu zote mbili.
- source_word: שְׁעָרֶיךָ
  choice: malango yako
  rationale: Neno hilo kihalisi ni ‘malango yako’. Ingawa linaweza kuwakilisha miji, kubaki na ‘malango’ kunahifadhi taswira halisi ya kuzingirwa.
- source_word: עַד רֶדֶת
  choice: mpaka ... zianguke
  rationale: ירד kihalisi ni kushuka, lakini inapohusu kuta zinazozingirwa, Kiswahili cha kawaida hutumia ‘kuanguka’; maana ya kuporomoka kwa kuta inawasilishwa wazi.
- source_word: חֹמֹתֶיךָ
  choice: kuta zako
  rationale: Ni tafsiri ya moja kwa moja; ‘za miji’ haijaongezwa kwa kuwa haimo wazi katika Kiebrania.
- source_word: הַגְּבֹהוֹת וְהַבְּצֻרוֹת
  choice: ndefu na zenye ngome
  rationale: ‘Ndefu’ ni usemi wa kawaida kwa kuta zenye kwenda juu, na ‘zenye ngome’ huonyesha kuwa kuta hizo zimeimarishwa kwa ulinzi.
- source_word: אֲשֶׁר אַתָּה בֹּטֵחַ בָּהֵן
  choice: unazozitegemea
  rationale: בטח + ב ina maana ya kuweka tumaini au kutegemea; ‘unazozitegemea’ ni ya asili kwa ulinzi wa kijeshi na huhifadhi wazo la kutumainia kuta.
- source_word: בְּכָל אַרְצֶךָ
  choice: katika nchi yako yote
  rationale: Huonyesha upeo wa jumla katika nchi nzima kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֶיךָ לָךְ
  choice: ambayo Yahwe Mungu wako amekupa
  rationale: Wakati timilifu wa Kiebrania umeonyeshwa kwa ‘amekupa’, tendo lililokamilika lenye matokeo ya sasa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kwa namna inayosomeka kwa urahisi katika Kiswahili, badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi יהוה. ‘Yahwe’ huhifadhi jina hilo kwa tahajia inayolingana na matamshi na mazoea ya Kiswahili, bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa marudio ya Kiebrania umehifadhiwa, pamoja na taswira ya malango, kuta, na kuzingirwa.
