  text: וֶֽ/הֱשִֽׁיבְ/ךָ֨ יְהוָ֥ה מִצְרַיִם֮ בָּ/אֳנִיּוֹת֒ בַּ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר אָמַ֣רְתִּֽי לְ/ךָ֔ לֹא תֹסִ֥יף ע֖וֹד לִ/רְאֹתָ֑/הּ וְ/הִתְמַכַּרְתֶּ֨ם שָׁ֧ם לְ/אֹיְבֶ֛י/ךָ לַ/עֲבָדִ֥ים וְ/לִ/שְׁפָח֖וֹת וְ/אֵ֥ין קֹנֶֽה׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/068.yaml
  text: And Yahweh will bring you back to Egypt in ships[a], by the way of which I said to you, ‘You shall never see it again.’ And there you will offer yourselves for sale to your enemies as male servants and female servants, but there will be no buyer.
translation:
  language: sw
  text: Yahwe atawarudisha Misri kwa meli, kwa njia ambayo nilikuambia, “Hamtaiona tena.” Nanyi huko mtajitoa kuuzwa kwa adui zenu kuwa watumwa wa kiume na wa kike,[a] lakini hakutakuwa na mnunuzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtauzwa huko kwa adui zenu kuwa watumwa wa kiume na wa kike.” Kitenzi cha Kiebrania kinaweza kueleweka kuwa cha kujirejelea (“mtajitoa kuuzwa”) au kwa maana pana ya kuuzwa na kuingia utumwani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱשִׁיבְךָ
  choice: atawarudisha
  rationale: Hifili ya שוב ina maana ya kusababisha kurudi; “atawarudisha” ni Kiswahili cha kawaida kinachohifadhi maana hiyo. Kiwakilishi cha umoja katika Kiebrania kinarejelea Israeli kwa pamoja, lakini wingi ni wa kawaida na wazi zaidi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kama “Yahwe,” badala ya kubadilishwa na cheo.
- source_word: מִצְרַיִם
  choice: Misri
  rationale: Hili ndilo jina la mahali linalotumika kwa kawaida katika Kiswahili.
- source_word: בָּאֳנִיּוֹת
  choice: kwa meli
  rationale: Muundo huu unaonyesha chombo cha usafiri; “kwa meli” ni usemi wa asili katika Kiswahili.
- source_word: בַּדֶּרֶךְ
  choice: kupitia njia
  rationale: דרך hapa inahusu njia au mkondo wa safari; “kupitia njia” huunganisha kwa kawaida maelezo yanayofuata.
- source_word: לֹא תֹסִיף עוֹד לִרְאֹתָהּ
  choice: Hamtaiona tena
  rationale: Muundo wa יסף pamoja na עוד unakanusha kurudiwa kwa tendo; tafsiri hii ni ya kawaida na inahifadhi kitenzi “kuona.”
- source_word: וְהִתְמַכַּרְתֶּם
  choice: mtajitoa kuuzwa
  rationale: Hitpaeli inaweza kueleweka kwa maana ya kujirejelea au ya kati. “Mtajitoa kuuzwa” huonyesha kujitolea sokoni bila kudai kuwa mauzo yatakamilika, jambo linalopatana na kutokuwapo kwa mnunuzi.
- source_word: לְאֹיְבֶיךָ
  choice: kwa adui zenu
  rationale: Lamed inaonyesha wale ambao wangekuwa wanunuzi au mabwana; “kwa adui zenu” ni wazi katika muktadha wa kuuzwa.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: kuwa watumwa wa kiume na wa kike
  rationale: Tafsiri hii huhifadhi jozi ya Kiebrania inayotofautisha watumwa wanaume na wanawake, bila kutumia maneno yanayopunguza ukali wa utumwa.
- source_word: וְאֵין קֹנֶה
  choice: lakini hakutakuwa na mnunuzi
  rationale: Kifungu halisi ni “na hakuna mnunuzi”; “lakini” huonyesha wazi tofauti ya kimuktadha bila kuondoa taswira ya biashara.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko lina jina maalumu la Mungu, si cheo; kulitohowa kama “Yahwe” huhifadhi jina la agano lililo katika chanzo.
- issue: Maana ya וְהִתְמַכַּרְתֶּם
  choice: mtajitoa kuuzwa
  alternative: mtauzwa
  rationale: Umbo la Hitpaeli linaweza kuwa la kujirejelea au la kati. Matini kuu inaonyesha kujitoa kuuzwa, huku tanbihi ikihifadhi uwezekano wa kuelewa kwa maana pana ya kuingia utumwani au kuuzwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Wingi umetumiwa kwa taifa linalosemshwa kwa pamoja ili sentensi iwe ya kawaida kwa wasomaji wa Kiswahili. Alama ya tanbihi imewekwa baada ya kifungu kinachohusika moja kwa moja.
