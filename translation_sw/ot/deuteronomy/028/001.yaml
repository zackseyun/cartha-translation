base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/001.yaml
  text: And it shall be[a], if you diligently obey the voice of Yahweh your God, being careful to do all his commandments that I am commanding you today, then Yahweh your God will set you high above all the nations of the earth.
translation:
  language: sw
  text: 'Itakuwa hivi: ikiwa utatii kwa makini[a] sauti ya Yahwe, Mungu wako, kwa kuzingatia kutekeleza amri zake zote ninazokuamuru leo, basi Yahwe, Mungu wako, atakuweka juu kuliko mataifa yote ya dunia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania, kwa halisi: “ikiwa kwa kusikiliza utasikiliza sauti ya Yahwe, Mungu wako”; huu ni usemi unaosisitiza kusikiliza kwa makini na kwa utii.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Itakuwa hivi
  rationale: Huhifadhi utangulizi wa Kiebrania unaoelekeza kwenye matokeo yajayo, huku ukisomeka kwa kawaida katika Kiswahili.
- source_word: אִם שָׁמוֹעַ תִּשְׁמַע
  choice: ikiwa utaitii kwa makini
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kamili unasisitiza kusikiliza; katika muktadha wa agano, kusikiliza huko kunamaanisha kutii kwa makini.
- source_word: בְּקוֹל
  choice: sauti ya
  rationale: Huhifadhi taswira halisi ya Kiebrania ya kuitii sauti ya Mungu badala ya kuibadili kuwa tu ‘maneno ya.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uwasilishaji wa moja kwa moja na unaotambulika wa jina la agano YHWH katika Kiswahili.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huhifadhi umilikishi wa moja kwa moja na lugha ya uhusiano wa agano.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: ukitunza kutekeleza
  rationale: ‘Kutunza’ huwakilisha wazo la kushika kwa uangalifu, na ‘kutekeleza’ huonyesha kuyaweka maagizo katika matendo.
- source_word: כָּל מִצְוֺתָיו
  choice: amri zake zote
  rationale: ‘Amri’ ina uzito unaofaa wa kisheria na wa agano; ‘zote’ huhifadhi ukamilifu wa dai.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ninazokuamuru leo
  rationale: Huwasilisha kwa kawaida tendo la Musa la sasa la kuamuru na msisitizo wa ‘leo.’
- source_word: וּנְתָנְךָ
  choice: basi ... atakuweka
  rationale: Katika muundo huu נתן humaanisha kuweka katika cheo au hali fulani; ‘basi’ huonyesha wazi matokeo ya sharti.
- source_word: עֶלְיוֹן עַל
  choice: juu kuliko
  rationale: Hutoa maana ya kulinganisha ya kuinuliwa bila kuitumia עֶלְיוֹן kama cheo cha Mungu.
- source_word: כָּל גּוֹיֵי הָאָרֶץ
  choice: mataifa yote ya dunia
  rationale: Muktadha unalinganisha Israeli na mataifa yote kwa upana, hivyo ‘dunia’ inafaa kuliko ‘nchi.’
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la agano; kulitaja kama ‘Yahwe’ hulihifadhi badala ya kulibadili kuwa cheo.
- issue: Nahau ya agano שָׁמוֹעַ תִּשְׁמַע בְּקוֹל
  choice: utaitii kwa makini sauti ya Yahwe
  alternative: utaisikiliza kwa makini sauti ya Yahwe
  rationale: Katika muktadha huu kusikia kunajumuisha kuitikia kwa utii. Tafsiri iliyochaguliwa inaonyesha nguvu hiyo huku ikihifadhi neno ‘sauti.’
- issue: Hadhi inayoonyeshwa na עֶלְיוֹן
  choice: atakuweka juu kuliko mataifa yote
  alternative: atakufanya mkuu juu ya mataifa yote
  rationale: ‘Juu kuliko’ huhifadhi taswira ya kuinuliwa na ulinganisho bila kufafanua zaidi aina ya ukuu au mamlaka inayokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sharti na matokeo umewekwa wazi kwa ‘ikiwa ... basi,’ huku nahau na taswira muhimu za Kiebrania zikihifadhiwa.
