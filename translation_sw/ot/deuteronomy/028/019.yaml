  text: אָר֥וּר אַתָּ֖ה בְּ/בֹאֶ֑/ךָ וְ/אָר֥וּר אַתָּ֖ה בְּ/צֵאתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/019.yaml
  text: Cursed shall you be when you come in[a], and cursed shall you be when you go out.
translation:
  language: sw
  text: Utalaaniwa unapoingia[a], na utalaaniwa unapotoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “katika kuingia kwako ... katika kutoka kwako”; ni nahau ya Kiebrania inayohusu mwenendo wote wa maisha ya kila siku.
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  choice: utalaaniwa
  rationale: Ni umbo lenye maana ya kuwa chini ya laana. Kiswahili cha wakati ujao katika kauli ya kutendwa kinaeleza kwa kawaida na kwa uzito tamko la laana ya agano.
- source_word: אַתָּה
  choice: u-
  rationale: Kiwakilishi cha nafsi ya pili umoja wa kiume kimewakilishwa na kiambishi cha kisarufi u-, kwa kuwa Kiebrania kinamwelekeza Israeli kwa umoja katika mfumo wa agano.
- source_word: בְּבֹאֶךָ
  choice: unapoingia
  rationale: Muundo huu ni kihusishi pamoja na jina-kitenzi na kiambishi cha nafsi ya pili umoja, kihalisi ‘katika kuingia kwako.’ ‘Unapoingia’ ni Kiswahili cha kawaida na huhifadhi ulinganifu na ‘unapotoka.’
- source_word: וְ
  choice: na
  rationale: Kiunganishi rahisi kinachounganisha vifungu viwili vinavyolingana.
- source_word: בְּצֵאתֶךָ
  choice: unapotoka
  rationale: Muundo huu ni kihusishi pamoja na jina-kitenzi na kiambishi cha nafsi ya pili umoja, kihalisi ‘katika kutoka kwako.’ ‘Unapotoka’ ni usemi wa kawaida unaolingana na ‘unapoingia.’
theological_decisions:
- issue: Kuhifadhi uzito na msisitizo wa tamko la laana ya agano
  choice: Utalaaniwa unapoingia, na utalaaniwa unapotoka.
  alternative: Utakuwa umelaaniwa unapoingia, na utakuwa umelaaniwa unapotoka.
  rationale: Kurudia ‘utalaaniwa’ katika kila kifungu huhifadhi usambamba na uzito wa אָרוּר bila kutumia muundo mzito au usio wa kawaida katika Kiswahili. Wakati ujao unafaa katika mfululizo wa matokeo ya agano katika sura hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Usambamba wa kishairi na urudiaji wa tamko la laana vimehifadhiwa.
