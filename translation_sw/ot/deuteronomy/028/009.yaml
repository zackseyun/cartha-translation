revisions:
- from: Yahwe atakuimarisha uwe watu watakatifu kwa ajili yake,[a] kama alivyokuapia, ikiwa utazishika amri za Yahwe Mungu wako na kutembea katika njia zake.
  to: Yahwe atakufanya kuwa watu watakatifu wake, kama alivyokuapia, ikiwa[a] utazishika amri za Yahwe Mungu wako na kutembea katika njia zake.
  rationale: The revision repairs the opening Swahili syntax while retaining the Hebrew sense that Yahweh establishes the addressed covenant community as his holy people. It also relocates the alternative-reading note to the word whose interpretation it explains. No doctrinal expansion has been introduced.
