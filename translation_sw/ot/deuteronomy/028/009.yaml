  variant: Standard East African Swahili
source:
  edition: WLC
  text: יְקִֽימְ/ךָ֨ יְהוָ֥ה ל/וֹ֙ לְ/עַ֣ם קָד֔וֹשׁ כַּ/אֲשֶׁ֖ר נִֽשְׁבַּֽע לָ֑/ךְ כִּ֣י תִשְׁמֹ֗ר אֶת מִצְוֺת֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הָלַכְתָּ֖ בִּ/דְרָכָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/009.yaml
  text: Yahweh will establish you for himself as a holy people[a], just as he swore to you, if you keep the commandments of Yahweh your God and walk in his ways.
translation:
  language: sw
  text: Yahwe atakufanya kuwa watu watakatifu wake, kama alivyokuapia, ikiwa[a] utazishika amri za Yahwe Mungu wako na kutembea katika njia zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu unazishika amri za Yahwe Mungu wako.” Kiunganishi cha Kiebrania kinaweza kueleweka kwa maana ya kisababishi, ingawa muktadha hapa unaunga mkono “ikiwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְקִימְךָ
  choice: atakuimarisha uwe
  rationale: Hifili ya קום hapa ina maana ya kumweka au kumthibitisha Israeli katika hadhi ya agano, si kumwinua kimwili. Muundo huu unaeleza kwa Kiswahili hali inayotokana na tendo hilo.
- source_word: לּוֹ
  choice: kwa ajili yake
  rationale: Kiambishi hiki kinaonyesha uhusiano wa kuwa mali yake au kutengwa kwake; tafsiri hii inadumisha wazo la watu kumilikiwa na Yahwe bila kulipanua kupita kiasi.
- source_word: לְעַם קָדוֹשׁ
  choice: uwe watu watakatifu
  rationale: Kirai hiki kinaonyesha hadhi inayotokana na kuimarishwa. Kiswahili hutumia 'watu' kwa umoja wa kijamii, huku kivumishi 'watakatifu' kikikubaliana kiasili nacho.
- source_word: כַּאֲשֶׁר נִשְׁבַּע לָךְ
  choice: kama alivyokuapia
  rationale: Hueleza ulinganifu na ahadi iliyothibitishwa kwa kiapo; 'kama alivyokuapia' ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: כִּי
  choice: ikiwa
  rationale: Katika muktadha wa baraka na laana za Kumbukumbu la Torati, kiunganishi hiki kinaeleweka vizuri kama sharti, ingawa maana ya kisababishi pia inawezekana na imehifadhiwa katika tanbihi.
- source_word: תִשְׁמֹר
  choice: utazishika
  rationale: שורש שׁמר pamoja na amri humaanisha kuzitii au kuzitunza kwa uangalifu; 'kushika amri' ni usemi wa kawaida wa kibiblia na unaoeleweka katika Kiswahili.
- source_word: מִצְוֺת
  choice: amri
  rationale: '''Amri'' inadumisha sajili ya kisheria na ya agano ya neno la Kiebrania.'
- source_word: וְהָלַכְתָּ בִּדְרָכָיו
  choice: na kutembea katika njia zake
  rationale: Tafsiri hii inadumisha sitiari ya Kiebrania kuhusu mwenendo wa maisha huku ikibaki wazi kwa msomaji wa kisasa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa na cheo, kwa kufuata ushahidi wa maandishi ya chanzo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Hifadhi fomula ya uhusiano wa agano kati ya Yahwe na Israeli kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Nguvu ya sharti katika kifungu cha baraka
  choice: ikiwa utazishika amri za Yahwe Mungu wako
  alternative: kwa sababu unazishika amri za Yahwe Mungu wako
  rationale: Sintaksia na mfumo mpana wa baraka na laana katika Kumbukumbu la Torati vinaunga mkono usomaji wa sharti, lakini uwezekano wa maana ya kisababishi umehifadhiwa katika tanbihi bila kuondoa mvutano wa kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa watu wa kawaida. Sitiari ya 'kutembea katika njia zake' na lugha ya agano zimehifadhiwa.
