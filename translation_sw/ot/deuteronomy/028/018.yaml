    reason: lexical_alternative
  - marker: b
    text: 'Misemo ya Kiebrania hapa inarejelea hasa watoto au ongezeko la mifugo: ng’ombe, kondoo na mbuzi.'
    reason: cultural_note
  revision_rationale: The revision replaces terms that limit or awkwardly personify animal offspring with “vizao,” preserving the Hebrew’s broader sense of livestock increase while retaining the solemn, clear Swahili register and the existing footnote anchors.
