base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/018.yaml
  text: Cursed shall be the fruit of your womb[a], and the fruit of your ground[b], the offspring of your herds and the young of your flocks.
translation:
  language: sw
  text: Ulaaniwe uzao wa tumbo lako[a], na mazao ya ardhi yako, vizao vya ng’ombe wako, na vizao vya makundi yako ya kondoo na mbuzi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kihalisi: “tunda la tumbo lako,” yaani watoto au wazao wako.'
    reason: lexical_alternative
  - marker: b
    text: 'Misemo ya Kiebrania hapa inarejelea hasa watoto au ongezeko la mifugo: ng’ombe, kondoo na mbuzi.'
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  choice: Ulaaniwe
  rationale: Ni kivumishi cha kiarifu kinachotumika kama tamko la laana. “Ulaaniwe” kinadumisha uzito na mkondo wa tamko la laana ya agano kwa Kiswahili cha kawaida.
- source_word: פְּרִי בִטְנְךָ
  choice: uzao wa tumbo lako
  rationale: Kirai hiki ni nahau ya Kiebrania inayomaanisha watoto au wazao. “Uzao wa tumbo lako” kinaeleweka kwa urahisi huku kikihifadhi picha ya chanzo cha uzazi.
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: na mazao ya ardhi yako
  rationale: אַדָמָה ni ardhi au udongo unaolimwa, na פְּרִי hapa ni kile ardhi inachozalisha. “Mazao ya ardhi yako” ni tafsiri ya asili na wazi kwa Kiswahili.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: ndama wa ng’ombe wako
  rationale: שְׁגַר humaanisha watoto au ongezeko la ng’ombe, na אֲלָפֶיךָ hapa ni ng’ombe. “Ndama wa ng’ombe wako” hutaja wazi watoto wa mifugo hiyo.
- source_word: וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: na wana wa makundi yako ya kondoo na mbuzi
  rationale: Kirai hiki kinarejelea watoto au ongezeko la mifugo midogo; צֹאן inaweza kujumuisha kondoo na mbuzi. Tafsiri hii huepuka kulichanganya neno עַשְׁתְּרֹת na jina la mungu wa kike.
