review_pass:
  verdict: revise
  source_fidelity: The rendering correctly conveys the curse formula, human progeny, agricultural produce, and the two livestock categories. However, “ndama” restricts שְׁגַר to calves, whereas the Hebrew denotes the offspring/increase of cattle more generally; “wana wa makundi” is also less natural for animal offspring.
  naturalness: “Ulaaniwe” is an acceptable elevated curse-formula in Standard East African Swahili. “Vizao vya ng’ombe” and “vizao vya makundi ...” are more idiomatic and accurately general than the draft’s livestock wording.
  terminology: “Uzao wa tumbo lako” appropriately retains the Hebrew womb/progeny image, while “mazao ya ardhi yako” naturally renders the produce of the ground. “Ng’ombe” and “makundi ... ya kondoo na mbuzi” suitably represent cattle and small livestock respectively.
  issues:
  - severity: medium
    issue: “Ndama wa ng’ombe wako” is overly specific for שְׁגַר אֲלָפֶיךָ.
    rationale: Ndama are calves only. The Hebrew expression refers broadly to the offspring or increase of cattle.
  - severity: medium
    issue: “Wana wa makundi yako ya kondoo na mbuzi” is less idiomatic and introduces a human-oriented noun.
    rationale: The source refers to the young/increase of small livestock. “Vizao” is natural Swahili and maintains the generality of the Hebrew.
  revised_text: Ulaaniwe uzao wa tumbo lako[a], na mazao ya ardhi yako, vizao vya ng’ombe wako, na vizao vya makundi yako ya kondoo na mbuzi[b].
