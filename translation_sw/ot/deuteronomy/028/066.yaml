  yaml_path: translation/ot/deuteronomy/028/066.yaml
  text: Your life will hang in doubt before you[a]; you will fear night and day[b], and you will have no assurance of your life.
translation:
  language: sw
  text: Maisha yako yatakuwa yakining’inia mbele yako[a]; utaogopa usiku na mchana, wala hutakuwa na hakika kama utaendelea kuishi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno, “Maisha yako yatakuwa yakining’inia mbele yako.” Picha ya Kiebrania ni ya maisha yaliyoning’inia kwa hatari, ikionyesha kutokuwa na uhakika wa daima wa kuendelea kuishi.
    reason: lexical_alternative
  - marker: b
    text: Au, “hutakuwa na uhakika wa uhai wako.” Usemi wa Kiebrania unaweza pia kumaanisha kutokuwa na tumaini au imani ya kuendelea kuishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֶּיךָ
  choice: maisha yako
  rationale: Ingawa nomino hiyo ina umbo la wingi katika Kiebrania, hapa ni nahau inayorejelea uhai au kuendelea kuishi kwa mtu; “maisha yako” ni usemi wa kawaida wa Kiswahili.
- source_word: תְּלֻאִים
  choice: yatakuwa yakining’inia
  rationale: Neno linatokana na kitenzi chenye maana ya “kutundika/kuning’iniza.” Tafsiri hii inadumisha picha ya maisha yaliyosimamishwa kwa hali hatarishi badala ya kuibadili moja kwa moja kuwa maelezo ya kutokuwa na uhakika.
- source_word: לְךָ מִנֶּגֶד
  choice: mbele yako
  rationale: Kirai hicho kina maana ya kitu kilicho mbele ya mtu au kinachomkabili; “mbele yako” huhifadhi sitiari ya mahali bila kuongeza ufafanuzi usio katika matini.
- source_word: וּפָחַדְתָּ
  choice: utaogopa
  rationale: Kitenzi kinamaanisha kuogopa au kuwa na hofu. “Utaogopa” ni cha moja kwa moja, huku kirai kinachofuata kikionyesha kuwa hofu hiyo ni ya kudumu.
- source_word: לַיְלָה וְיוֹמָם
  choice: usiku na mchana
  rationale: Mpangilio wa Kiebrania, “usiku na mchana,” umehifadhiwa na unaeleza hofu isiyokoma.
- source_word: לֹא תַאֲמִין בְּחַיֶּיךָ
  choice: hutakuwa na hakika kama utaendelea kuishi
  rationale: Katika muktadha huu, אמן pamoja na “maisha yako” haizungumzii imani ya kidini, bali kutokuwa na uhakika au tumaini la kuendelea kuwa hai. Tafsiri hii huwasilisha maana hiyo kwa Kiswahili cha kawaida.
