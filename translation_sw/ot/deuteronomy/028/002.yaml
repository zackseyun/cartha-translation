base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/002.yaml
  text: And all these blessings will come upon you and overtake you[a], if you obey the voice of Yahweh your God.
translation:
  language: sw
  text: Baraka hizi zote zitakujia na kukufikia[a], ikiwa utatii sauti ya Yahwe Mungu wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikiwa utasikiliza sauti ya Yahwe Mungu wako.” Nahau ya Kiebrania “kusikiliza sauti” mara nyingi humaanisha kusikiliza na kutii.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ
  choice: zitakujia
  rationale: Kitenzi pamoja na kihusishi kinaonyesha baraka kuja juu/kwa mhusika kama matokeo ya sharti; ‘zitakujia’ ni Kiswahili cha kawaida na chenye maana hiyo.
- source_word: כָּל הַבְּרָכוֹת הָאֵלֶּה
  choice: baraka hizi zote
  rationale: Hutoa kwa uwazi wingi, kiashiria, na ujumla wa kirai cha Kiebrania.
- source_word: וְהִשִּׂיגֻךָ
  choice: na kukufikia
  rationale: Hifil ya נשׂג ina picha ya kitu kinachomwandama mtu hadi kinamfikia. ‘Kukufikia’ huhifadhi kiini cha picha hiyo kwa Kiswahili cha asili bila kudokeza kwamba baraka zinampita.
- source_word: כִּי
  choice: ikiwa
  rationale: Katika muktadha huu wa baraka za agano, chembe hii inaingiza sharti; ‘ikiwa’ hulieleza wazi.
- source_word: תִשְׁמַע בְּקוֹל
  choice: utaitii sauti ya
  rationale: Nahau hiyo humaanisha kusikiliza kwa mwitikio wa utii. ‘Utaitii sauti ya’ huhifadhi ‘sauti’ na pia nguvu ya kiutendaji ya kitenzi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni umbo la kawaida la Kiswahili la jina la agano יהוה, badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huhifadhi moja kwa moja kiambishi cha nafsi ya pili umoja na uhusiano wa agano.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandiko ya Kiebrania yanatumia jina binafsi la Mungu hapa; ‘Yahwe’ hulihifadhi kama jina katika Kiswahili.
- issue: Nguvu ya nahau שׁמע בְּקוֹל
  choice: ikiwa utaitii sauti ya Yahwe Mungu wako
  alternative: ikiwa utaisikiliza sauti ya Yahwe Mungu wako
  rationale: Katika muktadha wa agano, kusikia sauti kunajumuisha kuitikia kwa utii. Tafsiri kuu inaweka maana hiyo wazi, huku tanbihi ikihifadhi uwezekano wa tafsiri iliyo karibu zaidi na muundo halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inamwelekea Israeli kwa nafsi ya pili umoja kama ilivyo katika Kiebrania. ‘Kukufikia’ ni ya asili kuliko tafsiri halisi isiyozoeleka kama ‘kukupita kwa mbele,’ huku ikiendeleza picha ya baraka zinazokuja hadi kwa mhusika.
