  yaml_path: translation/ot/deuteronomy/028/016.yaml
  text: Cursed are you in the city[a], and cursed are you in the field.
translation:
  language: sw
  text: Umelaaniwa[a] katika mji, na umelaaniwa shambani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uko chini ya laana.”
    reason: Mbadala huu unaonyesha kwamba neno la Kiebrania linaweza kueleza hali ya kuwa chini ya laana; “umelaaniwa” ni tafsiri ya kawaida na ya moja kwa moja ya tamko hilo.
lexical_decisions:
- source_word: אָרוּר
  choice: umelaaniwa
  rationale: Neno hili linawasilisha hali iliyotangazwa ya kuwa chini ya laana katika masharti ya agano. “Umelaaniwa” ni fupi, ya moja kwa moja, na yenye nguvu kuliko maelezo marefu.
- source_word: אַתָּה
  choice: u- katika “umelaaniwa”
  rationale: Kiwakilishi cha nafsi ya pili, umoja wa kiume, kimewakilishwa kiasili na kiambishi cha nafsi “u-” katika kitenzi cha Kiswahili; hakihitaji kurudiwa kwa neno “wewe” isipokuwa kwa mkazo wa ziada.
- source_word: בָּעִיר
  choice: mjini
  rationale: Hili ni tamko la mahali na linataja eneo la maisha ya mjini, kinyume na shambani.
- source_word: וְ
  choice: na
  rationale: Kiunganishi rahisi kinachohifadhi usambamba na nguvu ya nyongeza ya vifungu viwili.
- source_word: בַּשָּׂדֶה
  choice: shambani
  rationale: Huhifadhi picha halisi ya eneo la kilimo na ukinzani wake na mji; kwa pamoja maeneo hayo yanaashiria nyanja zote za maisha ya kawaida.
theological_decisions:
- issue: Mfumo wa laana ya agano na upeo wake
  choice: Kuhifadhi tamko la moja kwa moja, “Umelaaniwa ...,” katika vifungu vyote viwili.
  alternative: “Utalaaniwa mjini na shambani” au “Na ulaaniwe mjini na shambani.”
  rationale: Kiebrania kina muundo wa kihusishi wa hali bila kitenzi dhahiri, unaorudia nomino-kivumishi tendwa pamoja na kiwakilishi. Si utabiri wa wakati ujao wala ombi la laana; tamko la moja kwa moja linahifadhi vizuri nguvu ya hukumu ya masharti ya agano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Usambamba wa kishairi umehifadhiwa kwa kurudia “umelaaniwa,” na “mjini ... shambani” ni jozi ya kawaida inayoeleweka kwa urahisi.
