  text: וְ/הָיִ֜יתָ מְמַשֵּׁ֣שׁ בַּֽ/צָּהֳרַ֗יִם כַּ/אֲשֶׁ֨ר יְמַשֵּׁ֤שׁ הָ/עִוֵּר֙ בָּ/אֲפֵלָ֔ה וְ/לֹ֥א תַצְלִ֖יחַ אֶת דְּרָכֶ֑י/ךָ וְ/הָיִ֜יתָ אַ֣ךְ עָשׁ֧וּק וְ/גָז֛וּל כָּל הַ/יָּמִ֖ים וְ/אֵ֥ין מוֹשִֽׁיעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/029.yaml
  text: And you will grope at noon as the blind gropes in the darkness[a], and you will not prosper in your ways; and you will be only oppressed and robbed all the days[c][b], with no one to save you.
translation:
  language: sw
  text: Utapapasa adhuhuri kama kipofu apapasavyo gizani,[a] wala hutafanikiwa katika njia zako; utaonewa na kuporwa tu siku zote,[b] wala hakutakuwa na mtu wa kukuokoa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutafuta njia kwa kugusa”; kitenzi cha Kiebrania humaanisha kutafuta kwa mikono kwa sababu mtu hawezi kuona.
    reason: lexical_alternative
  - marker: b
    text: Au “utaonewa na kunyang’anywa siku zote.”
    reason: lexical_alternative
  - marker: c
    text: Au “mtu wa kukukomboa” au “mwokozi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְמַשֵּׁשׁ / יְמַשֵּׁשׁ
  choice: kupapasa
  rationale: Kitenzi hiki humaanisha kutafuta njia kwa kugusa kwa sababu ya kutoweza kuona; “kupapasa” ni neno la kawaida na linahifadhi nguvu ya tashbihi.
- source_word: בַּצָּהֳרַיִם
  choice: mchana kweupe
  rationale: Kirai hiki hurejelea adhuhuri, wakati wenye mwanga mwingi. “Mchana kweupe” ni Kiswahili cha asili kinachosisitiza kinaya cha kushindwa kuona hata wakati wa mwanga kamili.
- source_word: הָעִוֵּר
  choice: kipofu
  rationale: Kivumishi cha Kiebrania kimetumiwa kama nomino ya umoja. “Kipofu” hudumisha umoja bila kuongeza jinsia ambayo si lazima itajwe katika Kiswahili.
- source_word: בָּאֲפֵלָה
  choice: gizani
  rationale: Neno hilo lina maana ya giza au utusitusi; “gizani” linatofautiana wazi na “mchana kweupe.”
- source_word: תַצְלִיחַ
  choice: hutafanikiwa
  rationale: Katika Hiphil kitenzi humaanisha kufanikiwa au kustawi. “Hutafanikiwa” ni pana na kinafaa kwa juhudi na mwenendo wa maisha.
- source_word: אֶת דְּרָכֶיךָ
  choice: katika njia zako
  rationale: Huhifadhi taswira halisi ya “njia zako,” huku ikieleweka kuwa mwenendo na shughuli za maisha.
- source_word: אַךְ
  choice: tu
  rationale: Chembe hii inaweka mpaka au msisitizo; “tu” linaonyesha kwamba hali yao itakuwa kuonewa na kunyang’anywa bila nafuu.
- source_word: עָשׁוּק
  choice: utaonewa
  rationale: Hali ya kutendwa inaonyesha kufanyiwa dhuluma au kunyonywa. “Kuonewa” ni neno pana, la kawaida, na linaloeleweka.
- source_word: גָזוּל
  choice: kunyang’anywa
  rationale: Hali ya kutendwa inaonyesha kupokonywa mali kwa nguvu au kwa udhalimu. “Kunyang’anywa” huwasilisha maana hiyo kwa uwazi.
- source_word: כָּל הַיָּמִים
  choice: daima
  rationale: Kwa maana halisi ni “siku zote”; katika Kiswahili “daima” huonyesha kwa kawaida hali inayoendelea bila kukoma.
- source_word: וְאֵין מוֹשִׁיעַ
  choice: wala hakutakuwa na mtu wa kukuokoa
  rationale: Kirai kinaeleza kutokuwapo kwa mwokozi au mkombozi. Tafsiri hii ni ya kawaida na inaweka maana ya wokovu hapa kuwa kuokolewa katika hali ya dhuluma.
theological_decisions:
- issue: Maana ya מוֹשִׁיעַ katika muktadha wa laana ya agano usio wa moja kwa moja wa Kimasihi
  choice: mtu wa kukuokoa
  alternative: mwokozi; mtu wa kukukomboa
  rationale: Mzizi יָשַׁע unaweza kumaanisha kuokoa, kukomboa, au kunusuru kwa upana. Hapa unaeleza kutokuwapo kwa yeyote wa kumtoa mtu katika dhuluma, bila kuingiza dai la cheo maalumu cha Kimasihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mchana kweupe” limetumiwa badala ya tafsiri kavu ya “adhuhuri” ili kudumisha utofauti mkali kati ya mwanga kamili na giza. Mpangilio wa sentensi umegawanywa kwa alama ya kituo ili usomeke kwa urahisi bila kupoteza mfuatano wa hukumu.
