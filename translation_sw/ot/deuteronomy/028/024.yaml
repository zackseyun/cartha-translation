base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/024.yaml
  text: Yahweh will make the rain of your land dust and powder[a]; from the heavens it will come down on you until you are destroyed.
translation:
  language: sw
  text: Yahwe ataifanya mvua ya nchi yako kuwa vumbi na udongo mkavu[a]; kutoka mbinguni, mvua hiyo itakushukia mpaka uangamizwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vumbi na mavumbi ya udongo.” Kiebrania kinaunganisha maneno mawili yanayokaribiana kwa maana, yote yakitaja chembechembe kavu, ili kusisitiza picha ya mvua iliyogeuka kuwa ukame na uharibifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la agano la Mungu kwa namna ya uandishi inayotumika na kueleweka katika Kiswahili, badala ya kulibadilisha kuwa cheo kama “BWANA.”
- source_word: יִתֵּן
  choice: ataifanya ... iwe
  rationale: Kitenzi maana yake ya msingi ni “atatoa,” lakini katika muktadha huu muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba mvua inayotarajiwa itakuwa vumbi na udongo mkavu.
- source_word: מְטַר אַרְצְךָ
  choice: mvua ya nchi yako
  rationale: Linahifadhi uhusiano wa maneno ya Kiebrania huku likiwa la kawaida na wazi katika Kiswahili.
- source_word: אָבָק וְעָפָר
  choice: vumbi na udongo mkavu
  rationale: Maneno haya mawili yanahusu chembechembe kavu zinazokaribiana kimaana. “Vumbi na udongo mkavu” linadumisha picha hiyo maradufu bila kutumia Kiswahili kisicho cha kawaida.
- source_word: מִן הַשָּׁמַיִם
  choice: kutoka mbinguni
  rationale: “Mbinguni” ni usemi wa kawaida wa Kiswahili kwa chanzo cha juu kinachoelezwa na neno la Kiebrania lenye umbo la wingi.
- source_word: יֵרֵד עָלֶיךָ
  choice: vitakushukia
  rationale: Linawasilisha kwa lugha ya kawaida picha ya vumbi na udongo mkavu vikishuka juu ya mhusika, ingawa Kiebrania kina kitenzi cha umoja kinachorejelea hali hii kama kitu kimoja.
- source_word: עַד הִשָּׁמְדָךְ
  choice: mpaka uangamizwe
  rationale: Linatoa wazi kikomo cha laana bila kuingiza mtendaji ambaye kifungu cha Kiebrania hakimtaji moja kwa moja.
theological_decisions:
- issue: Uwasilishaji wa jina la agano יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: “Yahwe” linahifadhi jina binafsi lililo katika matini ya chanzo bila kulibadilisha kuwa cheo wala kuingiza msimamo wa kimadhehebu.
- issue: Mtendaji katika עַד הִשָּׁמְדָךְ
  choice: mpaka uangamizwe
  alternative: mpaka akuangamize
  rationale: Muundo wa kutendwa unahifadhi ukimya wa Kiebrania kuhusu mtendaji wa moja kwa moja katika kishazi hiki, bila kuondoa uhusiano wa laana na Yahwe katika sentensi nzima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unadumisha picha kali ya laana huku ukiepuka tafsiri ya neno kwa neno isiyo ya kawaida katika Kiswahili.
