base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/038.yaml
  text: You will carry much seed out to the field[a], but you will gather in little, because the locust will consume it.
translation:
  language: sw
  text: Utapeleka mbegu nyingi shambani[a], lakini utakusanya mavuno machache, kwa sababu nzige watayateketeza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Utapanda mbegu nyingi shambani, lakini utavuna kidogo.” Kiebrania kwa tafsiri ya karibu zaidi kinasema “utapeleka mbegu nyingi shambani” na “utakusanya kidogo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע רַב
  choice: mbegu nyingi
  rationale: זֶרַע ni mbegu, hasa mbegu ya kupandwa katika muktadha huu, na רַב huonyesha wingi. “Mbegu nyingi” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: תּוֹצִיא
  choice: utapeleka
  rationale: Hiphil ya יצא humaanisha kutoa au kupeleka nje. Katika muktadha huu mtu anapeleka mbegu shambani ili kuzipanda; “utapeleka” huhifadhi picha hiyo bila kutafsiri moja kwa moja kuwa “utapanda.”
- source_word: הַשָּׂדֶה
  choice: shambani
  rationale: שׂדה humaanisha shamba au ardhi inayolimwa. Katika Kiswahili, “shambani” ni usemi wa kawaida kwa mwendo kuelekea shamba.
- source_word: וּמְעַט תֶּאֱסֹף
  choice: lakini utakusanya mavuno machache
  rationale: אסף humaanisha kukusanya, na katika muktadha wa kilimo hukusudiwa kukusanya mavuno. Kutaja “mavuno” kunafanya maana iwe wazi na ya asili katika Kiswahili huku “machache” ikihifadhi tofauti na mbegu nyingi.
- source_word: כִּי
  choice: kwa sababu
  rationale: כִּי hapa inatanguliza sababu ya mavuno kuwa machache.
- source_word: יַחְסְלֶנּוּ
  choice: watayateketeza
  rationale: חסל huonyesha kula au kuangamiza kabisa. “Watayateketeza” huwasilisha nguvu ya kitenzi hicho, na kiambishi “-ya-” kinarejelea mavuno yaliyotajwa katika sentensi.
- source_word: הָאַרְבֶּה
  choice: nzige
  rationale: אַרְבֶּה ni neno la kawaida kwa nzige. Ingawa Kiebrania kimetumia umbo la umoja lenye maana ya kijumla, Kiswahili kwa kawaida hutumia wingi “nzige” katika muktadha huu.
