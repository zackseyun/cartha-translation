base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/046.yaml
  text: And they will be on you and on your offspring as a sign and a wonder forever[a][b].
translation:
  language: sw
  text: Nazo zitakuwa juu yako na juu ya wazao wako kama ishara na ajabu milele[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na juu ya vizazi vyako.” Neno la Kiebrania linalomaanisha “mbegu” linaweza kutumiwa kwa pamoja kuhusu uzao au vizazi vya mtu.
    reason: lexical_alternative
  - marker: b
    text: Kiwakilishi “Nazo” kinarejelea laana zilizoelezwa katika muktadha unaozunguka mstari huu.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיוּ
  choice: Nazo zitakuwa
  rationale: Kitenzi cha wingi kinaendeleza matokeo ya wakati ujao kutoka katika muktadha uliotangulia. Kiambishi “-zo” kinahifadhi rejeo lisilotajwa wazi bila kuingiza moja kwa moja neno “laana” katika matini.
- source_word: בְךָ
  choice: juu yako
  rationale: Huhifadhi maana ya mambo hayo kumwangukia au kudumu kwa mhusika, na pia ulinganifu na kirai kinachofuata.
- source_word: לְאוֹת
  choice: kuwa ishara
  rationale: אוֹת humaanisha ishara au alama; “kuwa ishara” ni Kiswahili cha kawaida na huhifadhi kazi yake ya kuonyesha.
- source_word: וּלְמוֹפֵת
  choice: na ajabu
  rationale: מוֹפֵת inaweza kumaanisha jambo la ajabu au ishara ya kustaajabisha. “Ajabu” hudumisha jozi ya kibiblia “ishara na ajabu” bila kuifanya iwe “balaa” au “dalili mbaya” pekee.
- source_word: וּבְזַרְעֲךָ
  choice: na juu ya wazao wako
  rationale: זֶרַע hapa ni uzao kwa maana ya pamoja, yaani watoto na vizazi vya baadaye. Kurudia “juu ya” huhifadhi muundo wa Kiebrania na kuonyesha kwamba matokeo yanawahusu pia wazao.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Ni kisawe cha kawaida cha muda unaoendelea bila kikomo kilichotajwa. Hakiongezi dai la kifalsafa kuhusu kutokuwa na mwisho zaidi ya usemi wenyewe.
theological_decisions:
- issue: Rejeo la kiwakilishi cha wingi katika וְהָיוּ
  choice: Matini inasema “Nazo,” huku maelezo yakitaja kwamba kinarejelea laana zilizo katika muktadha.
  alternative: Kutafsiri wazi “Laana hizo zitakuwa.”
  rationale: Kiebrania hakitaji nomino katika mstari huu. Kuhifadhi kiwakilishi kunatunza muundo na kiasi cha uwazi cha chanzo, bila kuzuia rejeo la kimuktadha.
- issue: Nguvu ya עַד עוֹלָם
  choice: milele
  alternative: daima; kwa vizazi vyote
  rationale: “Milele” ni tafsiri ya kawaida ya usemi huo na huhifadhi uzito wake wa kudumu, bila kufafanua zaidi ikiwa hapa unakusudia kutokuwa na mwisho kimetafizikia au muda mrefu wa agano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Wazao” ni la kawaida na sahihi kuliko “mbegu” katika muktadha huu; “ishara na ajabu” huhifadhi mwangwi wa jozi ya Kiebrania.
