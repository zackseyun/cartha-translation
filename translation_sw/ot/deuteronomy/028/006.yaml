  yaml_path: translation/ot/deuteronomy/028/006.yaml
  text: Blessed shall you be when you come in[b][a], and blessed shall you be when you go out.
translation:
  language: sw
  text: Utabarikiwa unapoingia[a][b], na utabarikiwa unapotoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina “wewe” katika umoja; Israeli linahutubiwa kama taifa moja.
    reason: cultural_note
  - marker: b
    text: Au “katika kuingia kwako ... katika kutoka kwako”; huenda msemo huu unamaanisha mwenendo mzima wa maisha na shughuli zote.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Utabarikiwa
  rationale: Kivumishi-tendo cha hali ya kutendwa kutoka ברך kimetumiwa kiarifu katika muktadha wa baraka za agano. Wakati ujao wa Kiswahili unaonyesha vizuri matokeo yanayotangazwa katika sehemu hii.
- source_word: אַתָּה
  choice: u- (katika “utabarikiwa,” “unapoingia,” na “unapotoka”)
  rationale: Kiwakilishi cha nafsi ya pili, umoja wa kiume, kinacholielekeza taifa la Israeli kwa namna ya umoja. Kiswahili huonyesha nafsi na idadi katika kiambishi cha kitenzi.
- source_word: בְּבֹאֶךָ
  choice: unapoingia
  rationale: Muundo wa ב pamoja na kitenzi-jina cha בוא na kiambishi cha nafsi ya pili umoja unaonyesha hali au wakati wa kuingia. “Unapoingia” ni Kiswahili cha kawaida kinachohifadhi maana halisi.
- source_word: וּבָרוּךְ
  choice: na utabarikiwa
  rationale: Kurudia kishazi kamili cha baraka kunahifadhi usambamba na mkazo wa Kiebrania.
- source_word: בְּצֵאתֶךָ
  choice: unapotoka
  rationale: Muundo wa ב pamoja na kitenzi-jina cha יצא na kiambishi cha nafsi ya pili umoja unaonyesha hali au wakati wa kutoka. Chaguo hili linahifadhi mwendo halisi na pia uwezekano wa maana pana ya shughuli zote za maisha.
theological_decisions:
- issue: Israeli kuzungumziwa kwa nafsi ya pili umoja kama taifa moja
  choice: Kuhifadhi umoja kwa viambishi vya nafsi ya pili umoja bila kuugeuza kuwa wingi
  alternative: “Mtabarikiwa mnapoingia, na mtabarikiwa mnapotoka” au kutaja Israeli waziwazi
  rationale: Kiebrania kinatumia nafsi ya pili umoja wa kiume, njia ya kawaida ya agano ya kulihutubia taifa la Israeli kwa umoja. Kiswahili kinahifadhi jambo hilo wazi katika viambishi vya vitenzi bila kuongeza ufafanuzi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo mfupi wenye usambamba unafaa mtindo wa baraka za agano; “unapoingia ... unapotoka” ni wa asili na unaeleweka kwa urahisi.
