  text: Blessed shall you be in the city[a], and blessed shall you be in the field.
translation:
  language: sw
  text: Utabarikiwa mjini[a], nawe utabarikiwa shambani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Umebarikiwa mjini, nawe umebarikiwa shambani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: utabarikiwa
  rationale: Katika muktadha wa baraka za agano, umbo hili linaonyesha hali ya kubarikiwa. Kiswahili cha wakati ujao kinawasilisha nguvu ya ahadi katika mfululizo huu bila kuigeuza kuwa bahati tu.
- source_word: אַתָּה
  choice: kiambishi cha nafsi ya pili umoja u-
  rationale: Kiebrania kinamwelekea Israeli kwa nafsi ya pili ya kiume umoja kama mhusika mmoja wa agano. Kiswahili huonyesha nafsi hiyo kwa kawaida ndani ya kitenzi.
- source_word: בָּעִיר
  choice: mjini
  rationale: Hii ni tafsiri ya kawaida na ya asili ya mahali, nayo inadumisha upande wa maisha ya mjini unaolinganishwa na shambani.
- source_word: וּבָרוּךְ
  choice: nawe utabarikiwa
  rationale: Kurudia kitenzi cha baraka kunahifadhi usambamba wenye msisitizo wa Kiebrania; “nawe” huunganisha vipashio kwa Kiswahili cha kawaida.
- source_word: בַּשָּׂדֶה
  choice: shambani
  rationale: Neno hili hudokeza shamba au eneo la kilimo. “Shambani” ni la kawaida, halisi, na linadumisha tofauti na “mjini.”
theological_decisions:
- issue: Namna ya kutafsiri kauli ya baraka isiyo na kitenzi
  choice: Utabarikiwa ... nawe utabarikiwa ...
  alternative: Umebarikiwa ... nawe umebarikiwa ...
  rationale: Ingawa Kiebrania hakina kitenzi kilichoandikwa, wakati ujao katika Kiswahili unaonyesha vizuri nguvu ya ahadi ya baraka katika muktadha wa Kumbukumbu la Torati 28. Tanbihi inadumisha uwezekano wa kuisoma kama kauli ya hali ya sasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya kawaida lakini yenye heshima. Usambamba na marudio ya maandishi ya Kiebrania yamedumishwa.
