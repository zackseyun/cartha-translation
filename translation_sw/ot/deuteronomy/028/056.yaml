base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/056.yaml
  text: The tender and delicate woman among you[a], who has not ventured to set the sole of her foot on the ground because of delicacy and tenderness, her eye will be evil toward the husband of her embrace[b], and toward her son and her daughter—
translation:
  language: sw
  text: Mwanamke mwororo na aliyedekezwa miongoni mwenu, ambaye hajawahi hata kujaribu kuweka wayo wa mguu wake juu ya ardhi kwa sababu ya starehe na umwororo wake, atawatazama kwa jicho baya[a] mume wa kifua chake[b], mwanawe, na binti yake—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nahau ya Kiebrania ni “jicho lake litakuwa baya kwa,” yaani, atawatazama kwa uhasama au kwa ubinafsi wa kuwanyima.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mwanamume wa kifua chake”; huu ni usemi wa ukaribu unaomaanisha mume wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרַכָּה
  choice: mwororo
  rationale: Neno hili linaeleza ulaini au umwororo. “Mwororo” ni la kawaida na lenye heshima, na hapa linafaa kwa mwanamke aliyeishi maisha yasiyo na shida.
- source_word: וְהָעֲנֻגָּה
  choice: aliyedekezwa
  rationale: Umbo hili lina wazo la mtu aliyezoezwa maisha ya starehe na kutunzwa kwa uangalifu. “Aliyedekezwa” linahifadhi hali hiyo bila kuifanya iwe anasa tu.
- source_word: אֲשֶׁר לֹא נִסְּתָה כַף רַגְלָהּ הַצֵּג עַל הָאָרֶץ
  choice: ambaye ... hajathubutu hata kuweka wayo wa mguu wake ardhini
  rationale: Kauli inaonyesha umwororo uliopindukia. “Hajathubutu hata” huwasilisha kutokujaribu au kutokuwa tayari kufanya hivyo, huku “wayo wa mguu” ikihifadhi picha halisi ya Kiebrania.
- source_word: מֵהִתְעַנֵּג וּמֵרֹךְ
  choice: kwa sababu ya kudekezwa na kuwa mwororo
  rationale: Viambishi vinaeleza sababu ya kutokanyaga ardhi. Tafsiri hii inaunganisha sababu hiyo na sifa mbili zilizotajwa mwanzoni mwa mstari.
- source_word: תֵּרַע עֵינָהּ
  choice: atamtazama kwa jicho baya
  rationale: Hii huhifadhi taswira ya nahau ya Kiebrania huku ikiwa inaeleweka kwa Kiswahili; tanbihi inaeleza kwamba inamaanisha uhasama au ubinafsi wa kunyima.
- source_word: בְּאִישׁ חֵיקָהּ
  choice: mume wa kumbatio lake
  rationale: Kauli hii huhifadhi usemi wa karibu wa Kiebrania, “mwanamume wa kifua chake,” na inaonyesha uhusiano wa kindoa bila kuufanya usemi huo kuwa “mume wake” tu.
- source_word: וּבִבְנָהּ וּבְבִתָּהּ
  choice: mwanawe na binti yake
  rationale: Kiebrania kinawataja mwana na binti mmoja mmoja; tafsiri haijumlishi kuwa “watoto wake.”
