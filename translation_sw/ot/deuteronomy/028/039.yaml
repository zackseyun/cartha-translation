  yaml_path: translation/ot/deuteronomy/028/039.yaml
  text: You will plant vineyards and cultivate them[a], but you will not drink the wine or gather it, because the worm will eat it.
translation:
  language: sw
  text: Utapanda mashamba ya mizabibu na kuyalima, lakini hutakunywa divai wala kuikusanya[a], kwa sababu mnyoo ataila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuiweka akiba.” Kitenzi cha Kiebrania kinaweza kumaanisha kukusanya au kuweka akiba.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרָמִים
  choice: mashamba ya mizabibu
  rationale: Nomino ya wingi inamaanisha mashamba yaliyopandwa mizabibu; huu ni usemi wa kawaida na wazi katika Kiswahili cha Afrika Mashariki.
- source_word: תִּטַּע
  choice: utapanda
  rationale: Ni kitenzi cha nafsi ya pili umoja kinachoeleza jambo la wakati ujao katika mfululizo wa laana za agano.
- source_word: וְעָבָדְתָּ
  choice: na kuyalima
  rationale: Katika muktadha wa kilimo, עבד humaanisha kufanya kazi shambani au kulima; kiambishi -ya- kinaonyesha kuwa mashamba ya mizabibu ndiyo yanayolimwa.
- source_word: יַיִן
  choice: divai
  rationale: Neno hilo linataja zao linalotokana na mizabibu; “divai” ni neno la kawaida na lenye hadhi katika Kiswahili.
- source_word: לֹא תִשְׁתֶּה
  choice: hutakunywa
  rationale: Huwasilisha kwa kawaida ukanushi wa wakati ujao katika Kiswahili.
- source_word: וְלֹא תֶאֱגֹר
  choice: wala kuikusanya
  rationale: אגר inaweza kumaanisha kukusanya au kuweka akiba. “Kuikusanya” huhifadhi maana pana ya msingi, huku maana ya kuweka akiba ikitajwa katika tanbihi.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinaanzisha sababu ya wao kutopata mazao ya mizabibu.
- source_word: תֹאכְלֶנּוּ
  choice: ataila
  rationale: Huhifadhi maana ya moja kwa moja ya ‘kuila’ na kiwakilishi cha kitu cha umoja kilichotajwa.
- source_word: הַתֹּלָעַת
  choice: funza
  rationale: Neno la Kiebrania hutaja kiumbe kama mnyoo au lava anayeharibu mazao. “Funza” ni neno la kawaida la Kiswahili linalofaa katika muktadha huu bila kutaja spishi maalumu.
