  text: וְ/נִשְׁאַרְתֶּם֙ בִּ/מְתֵ֣י מְעָ֔ט תַּ֚חַת אֲשֶׁ֣ר הֱיִיתֶ֔ם כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹ֑ב כִּי לֹ֣א שָׁמַ֔עְתָּ בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/062.yaml
  text: And you will be left few in number[a], though you had become as numerous as the stars of the heavens[c][b], because you did not listen to the voice of Yahweh your God.
translation:
  language: sw
  text: Nanyi mtabaki wachache kwa idadi[a], ingawa mlikuwa wengi kama nyota za mbinguni[b], kwa sababu hukuisikiliza sauti ya Yahwe Mungu wako.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kihalisi: “watu wa uchache,” nahau inayomaanisha watu wachache sana.'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “ilhali mlikuwa wengi kama nyota za mbinguni.”'
    reason: alternative_reading
  - marker: c
    text: Kiebrania hubadilika hapa kutoka “nanyi/mtabaki/mlikuwa” ya wingi kwenda “hukuisikiliza/Mungu wako” ya umoja, likilihutubia taifa la Israeli kwa pamoja. “Kuisikiliza sauti” pia hudokeza kutii.
    reason: source_form_and_lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁאַרְתֶּם
  choice: Nanyi mtabaki
  rationale: Nifali ya שׁאר inaonyesha kubaki baada ya hasara au hukumu; “mtabaki” ni Kiswahili cha kawaida kinachohifadhi matokeo hayo.
- source_word: בִּמְתֵי מְעָט
  choice: wachache kwa idadi
  rationale: Nahau hii humaanisha kuwa watu ni wachache kwa idadi, si wanaume wachache pekee.
- source_word: תַּחַת אֲשֶׁר
  choice: ingawa
  rationale: Katika muktadha huu kifungu kinaonyesha tofauti kati ya wingi wa awali na uchache utakaotokea; “ingawa” huwasilisha nguvu hiyo ya concessive kwa ufasaha.
- source_word: הֱיִיתֶם
  choice: mlikuwa
  rationale: Kitenzi היה hapa kinaeleza hali ya awali ya Israeli; “mlikuwa” ni cha asili na hakilazimishi tafsiri kwamba mchakato wa kuongezeka ndio unaosisitizwa.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: wengi kama nyota za mbinguni
  rationale: Huhifadhi ulinganisho wa agano na kutoa maana ya wingi mkubwa kwa Kiswahili cha kawaida.
- source_word: כִּי לֹא שָׁמַעְתָּ
  choice: kwa sababu hukuisikiliza
  rationale: שׁמע pamoja na בְּקוֹל inaweza kumaanisha kutii, lakini “kuisikiliza” huhifadhi taswira ya kusikia na mvutano wake wa kimaana. Umoja wa kitenzi umehifadhiwa kama hotuba ya pamoja kwa Israeli.
- source_word: בְּקוֹל
  choice: sauti ya
  rationale: Huhifadhi usemi wa agano “kuisikiliza sauti ya” badala ya kuufupisha moja kwa moja kuwa “kutii.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi wa Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Ni tafsiri ya kawaida na ya asili ya usemi wa agano, huku umoja wa nafsi ya pili ukihifadhiwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina binafsi la Mungu; “Yahwe” hulihifadhi kwa umbo linalotumika katika Kiswahili.
- issue: Mabadiliko kutoka wingi kwenda umoja katika כִּי לֹא שָׁמַעְתָּ
  choice: hukuisikiliza ... Mungu wako
  alternative: hamkuisikiliza ... Mungu wenu
  rationale: Kiebrania hubadilika kutoka kwa wingi kwenda kwa umoja wa pamoja, kikilihutubia taifa la Israeli kama kitu kimoja. Tafsiri imehifadhi badiliko hilo badala ya kulisawazisha.
- issue: Maana ya covenant ya שׁמע בְּקוֹל
  choice: hukuisikiliza sauti ya
  alternative: hukumtii
  rationale: Usemi unaweza kudokeza kutii, lakini tafsiri ya “kuisikiliza sauti” huhifadhi picha halisi na mvutano kati ya kusikiliza na kutii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida. “Nyota za mbinguni” huhifadhi mwangwi wa lugha ya agano; “Yahwe” hutumiwa kama umbo la Kiswahili la jina la Mungu.
