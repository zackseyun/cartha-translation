  text: יִפְתַּ֣ח יְהוָ֣ה לְ֠/ךָ אֶת אוֹצָר֨/וֹ הַ/טּ֜וֹב אֶת הַ/שָּׁמַ֗יִם לָ/תֵ֤ת מְטַֽר אַרְצְ/ךָ֙ בְּ/עִתּ֔/וֹ וּ/לְ/בָרֵ֕ךְ אֵ֖ת כָּל מַעֲשֵׂ֣ה יָדֶ֑/ךָ וְ/הִלְוִ֨יתָ֙ גּוֹיִ֣ם רַבִּ֔ים וְ/אַתָּ֖ה לֹ֥א תִלְוֶֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/012.yaml
  text: Yahweh will open to you his good storehouse[a], the heavens, to give the rain of your land in its season and to bless all the work of your hand. You will lend to many nations, but you will not borrow.
translation:
  language: sw
  text: Yahwe atakufungulia hazina yake nzuri[a], yaani mbingu, ili kuipa nchi yako mvua kwa majira yake na kuibariki kazi yote ya mkono wako. Utawakopesha mataifa mengi, lakini wewe hutakopa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ghala lake zuri.” Neno la Kiebrania linaweza kumaanisha hazina au ghala; “ghala” linaendana hasa na muktadha wa mvua na mavuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְתַּח
  choice: atakufungulia
  rationale: Kitenzi cha wakati ujao pamoja na kiambishi cha mtendewa kinaonyesha kwamba Yahwe atafungua hazina hiyo kwa manufaa ya Israeli.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la agano lililoandikwa wazi katika maandishi ya Kiebrania kwa umbo linalofaa tahajia ya Kiswahili.
- source_word: אוֹצָרוֹ הַטּוֹב
  choice: hazina yake nzuri
  rationale: אוֹצָר inaweza kuwa ghala au hazina; “hazina” ni ya asili katika Kiswahili na inadumisha sitiari, huku “nzuri” ikihifadhi kivumishi cha Kiebrania.
- source_word: הַשָּׁמַיִם
  choice: yaani mbingu
  rationale: Kirai hiki kinafafanua hazina nzuri kuwa mbingu; “yaani” huweka wazi uhusiano huo wa ufafanuzi bila kubadili maana.
- source_word: לָתֵת מְטַר אַרְצְךָ בְּעִתּוֹ
  choice: ili kuipa nchi yako mvua kwa majira yake
  rationale: Muundo huu ni wa kawaida katika Kiswahili, unahifadhi kusudi la kutoa mvua, na unahusisha “majira yake” na mvua iliyotajwa.
- source_word: כָּל מַעֲשֵׂה יָדֶךָ
  choice: kazi yote ya mkono wako
  rationale: Unahifadhi nahau halisi na umoja wa “mkono” katika Kiebrania huku ukibaki unaeleweka.
- source_word: וְהִלְוִיתָ גּוֹיִם רַבִּים
  choice: Utawakopesha mataifa mengi
  rationale: Hiphil ya לוה hapa ina maana ya kutoa mkopo; “mataifa” inafaa muktadha wa kitaifa wa agano.
- source_word: וְאַתָּה לֹא תִלְוֶה
  choice: lakini wewe hutakopa
  rationale: Qal ya לוה ina maana ya kukopa; “lakini” huonyesha utofauti wa vifungu, na “wewe” huhifadhi msisitizo wa kiwakilishi cha Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia Tetragramatoni moja kwa moja. “Yahwe” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo, bila kuongeza fasiri ya kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha sitiari ya hazina ya mbinguni, lakini hutumia miundo ya kawaida kama “kuipa nchi yako mvua.”
