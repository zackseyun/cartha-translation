base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/027.yaml
  text: Yahweh will strike you with the boils of Egypt[a], and with tumors, and with scabs, and with itch, from which you cannot be healed.
translation:
  language: sw
  text: Yahweh atakupiga kwa majipu ya Misri, kwa uvimbe[a], kwa upele wenye magamba, na kwa muwasho, ambavyo hutaweza kuponywa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bawasiri”; maana ya neno la Kiebrania si hakika, na huenda likataja hasa uvimbe katika eneo la mkundu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: atakupiga
  rationale: Hifili ya נכה ina maana ya kupiga au kuleta pigo. “Atakupiga” ni ya moja kwa moja, ya sasa, na inadumisha wazo la Yahweh kuleta adhabu hiyo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo, hivyo kudumisha rejeleo la jina la agano.
- source_word: בִּשְׁחִין מִצְרַיִם
  choice: kwa majipu ya Misri
  rationale: שְׁחִין ni ugonjwa wa ngozi wenye majipu au vidonda vilivyovimba. Wingi “majipu” ni wa kawaida katika Kiswahili kwa aina hii ya maradhi, huku “ya Misri” ikidumisha uhusiano wa Kiebrania.
- source_word: וּבְעפלים
  choice: kwa uvimbe
  rationale: Neno hili la Kiebrania halina maana iliyo hakika. “Uvimbe” ni pana na salama kuliko “bawasiri”; uwezekano wa maana maalumu zaidi umewekwa katika tanbihi.
- source_word: וּבַגָּרָב
  choice: kwa upele wenye magamba
  rationale: גָּרָב huelekea kutaja ugonjwa wa ngozi unaotokeza magamba. Usemi huu ni wazi kwa msomaji wa kawaida bila kudai utambuzi wa kitabibu usio na hakika.
- source_word: וּבֶחָרֶס
  choice: kwa muwasho
  rationale: חֶרֶס hapa hutaja hali ya ngozi inayowasha. “Muwasho” ni ya kawaida na haibainishi kupita kiasi aina ya ugonjwa.
- source_word: אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: magonjwa ambayo hutaweza kuponywa
  rationale: Tafsiri hii inadumisha hali tendwa ya לְהֵרָפֵא na kueleza wazi kwamba orodha ya maradhi ndiyo isiyoponyeka, huku ikiepuka utata wa kirejeleo katika Kiswahili.
theological_decisions:
- issue: Kutafsiri jina la Mungu YHWH
  choice: Yahweh
  alternative: BWANA
  rationale: “Yahweh” inadumisha jina binafsi lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Orodha imetolewa kwa majina ya kawaida ya hali za ngozi, bila kutumia istilahi mahususi za kitabibu ambazo maandishi ya Kiebrania hayathibitishi. Alama ya tanbihi imewekwa baada ya “uvimbe,” neno linalohusika.
