base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/069.yaml
  text: These are the words of the covenant that Yahweh commanded Moses to make with the sons of Israel in the land of Moab[a], besides the covenant that he made with them at Horeb.
translation:
  language: sw
  text: Haya ndiyo maneno ya agano ambalo Yahwe alimwamuru Musa kulifanya[a] na wana wa Israeli katika nchi ya Moabu, kando na agano alilofanya nao huko Horebu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kihalisi, “kukata agano” ... “agano alilokata nao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה דִבְרֵי הַבְּרִית
  choice: Haya ndiyo maneno ya agano
  rationale: Muundo huu unahifadhi usemi wa Kiebrania ‘haya ni maneno ya agano’ kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: צִוָּה
  choice: alimwamuru
  rationale: Kitenzi kina nguvu ya amri, si pendekezo au ombi.
- source_word: לִכְרֹת ... הַבְּרִית
  choice: afanye ... agano
  rationale: Kiebrania hutumia nahau yenye maana halisi ya ‘kukata agano’; ‘kufanya agano’ ndiyo nahau ya kawaida na inayoeleweka katika Kiswahili, huku maana halisi ikiwekwa katika tanbihi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi umbo la chanzo, ambalo kihalisi ni ‘wana wa Israeli,’ na hapa linarejelea jamii ya Israeli kwa pamoja.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: katika nchi ya Moabu
  rationale: Inahifadhi usemi kamili wa kijiografia wa chanzo.
- source_word: מִלְּבַד
  choice: mbali na
  rationale: Inaonyesha kwamba agano hili linatajwa kwa kulinganishwa na agano la awali, bila kulazimisha zaidi ikiwa maana ni ‘kando na’ au ‘zaidi ya.’
- source_word: בְּחֹרֵב
  choice: huko Horebu
  rationale: Jina Horebu limehifadhiwa bila kulioanisha na Sinai; ‘huko’ linaonyesha mahali pa tukio kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina la agano la Mungu moja kwa moja; kulitaja kama Yahwe huhifadhi hadhi yake kama jina binafsi.
- issue: Usemi wa jamii בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Uchaguzi huu unahifadhi umbo la Kiebrania huku muktadha ukionyesha kuwa ni jina la jamii kwa pamoja, si lazima wanaume pekee.
- issue: Uhusiano wa agano la Moabu na agano la Horebu
  choice: mbali na agano
  alternative: zaidi ya agano; tofauti na agano
  rationale: ‘Mbali na’ huhifadhi mvutano wa מִלְּבַד, ambao unaweza kuonyesha nyongeza au utenganisho, bila kuamua kimadhehebu kama haya ni maagano mawili yaliyo tofauti kabisa au hatua zinazohusiana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeweka muundo wa kichwa cha Kiebrania lakini imetumia nahau ya kawaida ya Kiswahili ‘kufanya agano.’
