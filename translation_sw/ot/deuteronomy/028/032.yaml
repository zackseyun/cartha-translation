base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/032.yaml
  text: Your sons and your daughters will be given to another people[a], while your eyes look on and fail with longing for them all day long, but your hand will be powerless.
translation:
  language: sw
  text: Wana wako wa kiume na wa kike watapewa watu wengine, na macho yako yatazama na kudhoofika kwa kuwatamani siku nzima, lakini mkono wako hautakuwa na nguvu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala hutakuwa na uwezo.” Nahau ya Kiebrania husema kihalisi kwamba hakuna nguvu mkononi mwako.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנֶיךָ וּבְנֹתֶיךָ
  choice: Wana wako wa kiume na wa kike
  rationale: Kiebrania kinataja wazi wana wa kiume na wa kike; tafsiri hii inadumisha utofautishaji huo na uzito wa laana.
- source_word: נְתֻנִים
  choice: watatolewa
  rationale: Hali ya kutendwa katika muktadha wa laana inaeleweka kiasili kama jambo la wakati ujao. “Watatolewa” iko karibu na maana ya msingi bila kuongeza kwa lazima wazo la kukabidhiwa kwa adui.
- source_word: לְעַם אַחֵר
  choice: kwa watu wengine
  rationale: עַם humaanisha jamii ya watu; “watu wengine” inadumisha אַחֵר bila kuingiza kwa lazima dhana mahsusi ya taifa au ugeni.
- source_word: וְעֵינֶיךָ רֹאוֹת
  choice: huku macho yako yakitazama
  rationale: Usemi huu unaonyesha mzazi akishuhudia tukio bila uwezo wa kulizuia; muundo huu ni wa kawaida na wenye picha wazi katika Kiswahili.
- source_word: וְכָלוֹת אֲלֵיהֶם
  choice: na kudhoofika kwa kuwatamani
  rationale: כלה hapa hubeba wazo la kuishiwa nguvu au kudhoofika, katika muktadha huu kwa hamu ya kuwaona wana waliochukuliwa. Tafsiri inadumisha picha ya kudhoofika pamoja na sababu ya kihisia.
- source_word: כָּל הַיּוֹם
  choice: siku nzima
  rationale: Ni Kiswahili cha sasa na cha kawaida kinachodumisha maana ya muda wote wa siku.
- source_word: וְאֵין לְאֵל יָדֶךָ
  choice: lakini mkono wako hautakuwa na uwezo
  rationale: Huu ni usemi wa Kiebrania unaoeleza kutokuwa na nguvu au uwezo wa kutenda. Tafsiri inadumisha picha ya “mkono” huku ikitoa maana inayoeleweka.
theological_decisions:
- issue: Tafsiri ya usemi וְאֵין לְאֵל יָדֶךָ
  choice: lakini mkono wako hautakuwa na uwezo
  alternative: na haitakuwa katika uwezo wako
  rationale: Neno אֵל katika usemi huu halikusudii kutoa kauli kuhusu Mungu au mungu, bali ni sehemu ya nahau ya kutokuwa na nguvu au uwezo. Tafsiri hii huepuka maana potovu huku ikihifadhi picha halisi ya mkono.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha ni wazi kwa msomaji wa kawaida, huku picha za Kiebrania za macho kudhoofika na mkono kutokuwa na uwezo zikidumishwa.
