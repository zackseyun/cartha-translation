base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/044.yaml
  text: He will lend to you[a], but you will not lend to him; he will be the head[b], and you will be the tail.
translation:
  language: sw
  text: Yeye[a] atakukopesha, lakini wewe hutamkopesha[b]; yeye atakuwa kichwa, nawe utakuwa mkia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mgeni anayeishi kati yenu aliyetajwa katika mstari uliotangulia.
    reason: cross_reference
  - marker: b
    text: Au, hutampa mkopo. Kitenzi cha Kiebrania katika vishazi vyote viwili kinahusu kukopesha, kikikazia utegemezi wa kiuchumi na kubadilika kwa hadhi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַלְוְךָ / תַלְוֶנּוּ (לוה, Hiphil)
  choice: atakukopesha / hutamkopesha
  rationale: 'Katika muktadha huu, Hiphil ya לוה humaanisha ‘kukopesha’ au ‘kumpa mtu mkopo.’ Ulinganifu wa vishazi unaonyesha kubadilika kwa hali ya kiuchumi: yeye ndiye atakayekuwa mkopeshaji, na Israeli hatakuwa mkopeshaji wake.'
- source_word: הוּא
  choice: yeye
  rationale: Kiwakilishi hiki ni cha umoja na kinamrejelea mgeni aliyetajwa katika mstari uliotangulia. ‘Yeye’ huhifadhi umoja bila kurudia nomino ambayo Kiebrania hakurudii.
- source_word: לְרֹאשׁ
  choice: kichwa
  rationale: Hii ni sitiari ya Kiebrania inayoonyesha kuwa juu, kutawala, au kuwa na hadhi kubwa. ‘Kichwa’ huhifadhi picha hiyo na mwangwi wake ndani ya sura hii.
- source_word: לְזָנָב
  choice: mkia
  rationale: Ni upande wa pili wa sitiari ya ‘kichwa,’ unaoonyesha kuwa chini au kutawaliwa. ‘Mkia’ huhifadhi utofautishaji wa wazi wa maandishi ya chanzo.
- source_word: יִהְיֶה / תִּהְיֶה
  choice: atakuwa / utakuwa
  rationale: Vitenzi hivi vinaeleza hali itakayotokea kama sehemu ya laana ya agano. Wakati ujao wa Kiswahili unaonyesha matokeo hayo kwa njia ya kawaida na iliyo wazi.
- source_word: וְאַתָּה
  choice: lakini wewe / nawe
  rationale: Kiwakilishi kilichorudiwa kinakazia utofauti. ‘Lakini wewe’ huonyesha upinzani katika kishazi cha kwanza, na ‘nawe’ huhifadhi ulinganifu mfupi na wa asili katika kishazi cha pili.
theological_decisions:
- issue: Rejeo la umoja lenye jinsia ya kiume katika Kiebrania
  choice: Kuhifadhi umoja kwa ‘yeye’ na ‘wewe’
  alternative: Kutumia wingi, kama ‘wao watakukopesha,’ au kurudia wazi ‘mgeni’ katika matini kuu
  rationale: Kiebrania kimetumia umoja wa kiume unaomrejelea kwa namna ya uwakilishi mgeni wa mstari uliotangulia. Kiswahili ‘yeye’ huhifadhi umoja huo, ingawa kiwakilishi chenyewe hakionyeshi jinsia, bila kugeuza rejeo kuwa la wingi au kuongeza nomino katika matini kuu.
- issue: Sitiari ya cheo na utegemezi
  choice: Kuhifadhi ‘kichwa’ na ‘mkia’
  alternative: Kufafanua moja kwa moja kuwa ‘atatawala’ na ‘utakuwa chini yake’
  rationale: Chanzo kinatumia sitiari yenye nguvu badala ya maelezo ya moja kwa moja. Kuihifadhi huepuka kufunga maana katika ufafanuzi mmoja tu na hudumisha uhusiano wake na lugha nyingine ya baraka na laana katika sura hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa kishairi na ulinganifu wa Kiebrania umehifadhiwa, pamoja na sitiari za ‘kichwa’ na ‘mkia.’
