base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/036.yaml
  text: Yahweh will bring you and the king whom you set over yourself to a nation that neither you nor your fathers have known[a], and there you will serve other gods[b], wood and stone.
translation:
  language: sw
  text: Yahwe atakupeleka wewe pamoja na mfalme utakayemweka juu yako kwa taifa ambalo wewe wala baba zako hamkulijua; na huko utazitumikia miungu mingine—mbao na mawe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹלֵךְ
  choice: atakupeleka
  rationale: Hifili ya הלך ina maana ya kusababisha mtu aende; “atakupeleka” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kuongeza wazi wazo la uhamisho ambalo halijatajwa moja kwa moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetafsiriwa kwa unukuzi wa Kiswahili “Yahwe,” badala ya kulibadilisha kuwa cheo kama “BWANA.”
- source_word: מַלְכְּךָ אֲשֶׁר תָּקִים עָלֶיךָ
  choice: mfalme utakayemweka juu yako
  rationale: Hifili ya קום hapa inaeleza kumweka au kumsimika mtawala; “kumweka juu yako” huhifadhi muundo na wazo la mamlaka katika Kiebrania.
- source_word: גּוֹי
  choice: taifa
  rationale: גוי hapa ni taifa au jamii ya watu wa kigeni; “taifa” linafaa katika muktadha huu.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: ambalo wewe wala baba zako hamkulijua
  rationale: Muundo wa “wewe wala baba zako” unaonyesha kwamba taifa hilo halikujulikana na pande zote mbili, huku “baba zako” ikihifadhi neno la ukoo lenye jinsia ya kiume katika chanzo.
- source_word: וְעָבַדְתָּ שָׁם
  choice: na huko utaitumikia
  rationale: עבד ikitumiwa kuhusu miungu humaanisha kuitumikia kwa namna ya ibada. “Utaitumikia” huhifadhi maana ya msingi ya kitenzi na muktadha wake wa kidini.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Huu ni ulinganifu wa moja kwa moja wa usemi wa kawaida wa agano, bila kuufasiri kuwa “miungu ya kigeni.”
- source_word: עֵץ וָאָבֶן
  choice: mbao na mawe
  rationale: Kirai hiki kinaeleza kwa dharau vitu ambavyo hiyo miungu imetengenezwa navyo. “Mbao na mawe” huhifadhi uambatanisho mfupi wa Kiebrania na ni cha asili katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu; unukuzi “Yahwe” hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya עבד kuhusiana na miungu
  choice: utaitumikia
  alternative: utaiabudu
  rationale: “Kutumikia” huhifadhi maana ya msingi ya kitenzi, huku kitu kinachotumikiwa—miungu mingine—kikiweka wazi maana ya kidini bila kuondoa uwezekano mpana wa utumishi wa kiibada.
- issue: Neno la ukoo וַאֲבֹתֶיךָ
  choice: baba zako
  alternative: mababu zako
  rationale: “Baba zako” linafuata kwa karibu neno la kiume la chanzo na usemi wa kihistoria wa agano; “mababu zako” lingeweka wazi zaidi maana pana ya wahenga lakini si lazima hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi anwani ya umoja ya Kiebrania. Hakuna tanbihi iliyohitajika; tofauti muhimu ya “kutumikia/kuabudu” imerekodiwa katika maamuzi ya kileksika na kiteolojia.
