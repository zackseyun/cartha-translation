  terminology: “Yahwe,” “mfalme utakayemweka juu yako,” “baba zako,” na “miungu mingine” vinafaa kwa Kiswahili Sanifu na vinahifadhi istilahi za chanzo. “Mbao na mawe” yahifadhi uambatanisho wa dharau wa Kiebrania bila kufafanua kupita kiasi.
