base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/035.yaml
  text: Yahweh will strike you with severe boils on the knees and on the legs[a], from which you cannot be healed, from the sole of your foot to the crown of your head.
translation:
  language: sw
  text: Yahwe atakupiga kwa majipu makali magotini na kwenye miundi, ambayo hutaweza kupona kutokana nayo, tangu wayo wa mguu wako hadi utosi wa kichwa chako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַכְּכָה
  choice: atakupiga
  rationale: Hifili ya נכה ina maana ya kupiga au kuleta pigo juu ya mtu. “Atakupiga” ni ya kawaida, yenye nguvu, na inadumisha kwamba Yahwe ndiye anayeleta adhabu hiyo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: בִּשְׁחִין רָע
  choice: kwa majipu makali
  rationale: שְׁחִין ni jipu au upele mkali wa ngozi, nalo umoja wake hapa una maana ya mkusanyiko. “Majipu makali” ni Kiswahili cha kawaida kinachoonyesha uzito wa hali hiyo.
- source_word: עַל הַבִּרְכַּיִם
  choice: magotini
  rationale: Hii ni tafsiri ya kawaida na fupi ya mahali pa mwili panapotajwa.
- source_word: וְעַל הַשֹּׁקַיִם
  choice: na kwenye miundi
  rationale: שׁוֹק hurejelea sehemu ya chini ya mguu, hasa muundi. “Miundi” ni sahihi zaidi kuliko neno pana “miguu,” kwa hiyo hakuna tanbihi ya mbadala inayohitajika.
- source_word: אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: ambayo hutaweza kuponywa kutokana nayo
  rationale: Muundo huu unadumisha hali ya kutendwa ya kitenzi cha Kiebrania na kuonyesha kwamba ugonjwa huo hautaponyeka, bila kuhamisha maana kuwa mgonjwa ndiye anayejitibu.
- source_word: מִכַּף רַגְלְךָ
  choice: tangu wayo wa mguu wako
  rationale: כַּף inapohusishwa na mguu humaanisha wayo. Umoja wa Kiebrania umedumishwa.
- source_word: וְעַד קָדְקֳדֶךָ
  choice: hadi utosi wa kichwa chako
  rationale: קָדְקֹד ni sehemu ya juu kabisa ya kichwa; “utosi wa kichwa” inadumisha taswira ya mwili mzima kutoka chini hadi juu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: “Yahwe” linadumisha jina binafsi katika maandishi ya Kiebrania badala ya kulibadilisha na cheo, bila kuongeza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha ukali wa laana, tendo la moja kwa moja la Yahwe, na taswira ya maambukizi ya mwili mzima.
