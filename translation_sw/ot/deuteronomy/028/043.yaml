base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/043.yaml
  text: The foreigner who is among you will rise higher and higher above you[a], and you will go down lower and lower.
translation:
  language: sw
  text: Mgeni aliye miongoni mwako atapanda juu yako zaidi na zaidi, nawe utashuka chini zaidi na zaidi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַגֵּר
  choice: Mgeni anayeishi
  rationale: גֵּר humaanisha mtu asiye mzawa anayekaa ndani ya jamii ya Israeli. “Mgeni anayeishi” ni lugha ya kawaida na inaonyesha kuwa si mgeni wa kupita tu.
- source_word: אֲשֶׁר בְּקִרְבְּךָ
  choice: miongoni mwako
  rationale: Kirai hiki kinamweka huyo mgeni ndani ya jamii. “Miongoni mwako” ni Kiswahili cha asili na huhifadhi umoja wa nafsi ya pili katika Kiebrania.
- source_word: יַעֲלֶה עָלֶיךָ
  choice: atazidi kuinuka juu yako
  rationale: עלה pamoja na על hapa inaonyesha kupanda kwa hadhi kwa kulinganishwa na Israeli; tafsiri hii huhifadhi taswira pana bila kuifunga kwenye uchumi au siasa pekee.
- source_word: מַעְלָה מָּעְלָה
  choice: atazidi kuinuka
  rationale: Urudiaji wa kielezi unasisitiza mwendo unaoendelea kwenda juu. Kitenzi “atazidi” huwasilisha kwa Kiswahili cha kawaida maana ya “juu zaidi na zaidi.”
- source_word: וְאַתָּה
  choice: nawe
  rationale: Huhifadhi kiunganishi cha Kiebrania na wakati huohuo huonyesha ulinganisho mkali kati ya mgeni na Israeli.
- source_word: תֵרֵד
  choice: utazidi kushuka
  rationale: ירד ni kinyume cha עלה. “Kushuka” huhifadhi taswira ya kupungua kwa hadhi bila kuibana katika eneo moja maalumu.
- source_word: מַטָּה מָּטָּה
  choice: utazidi kushuka chini
  rationale: Urudiaji unamaanisha kushuka kunakoendelea, yaani chini zaidi na zaidi. “Utazidi kushuka chini” ni ya kawaida na inalingana na “atazidi kuinuka juu.”
theological_decisions:
- issue: Kubadilishwa kwa hadhi katika muktadha wa laana ya agano
  choice: Kuhifadhi taswira pana ya mgeni mkazi kuinuka juu ya Israeli huku Israeli ikishuka.
  alternative: Kuitafsiri kwa maana finyu ya kuporomoka kiuchumi pekee au kutawaliwa kisiasa pekee.
  rationale: Kiebrania hakitaji eneo maalumu la maisha. Taswira ya kupanda na kushuka inaweza kuhusisha hadhi ya kijamii, kiuchumi au kisiasa, hivyo tafsiri haipaswi kuifinya kuwa mojawapo tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa umoja “mwako/yako” umehifadhiwa kwa sababu Kiebrania humwelekea Israeli kama jumuiya moja. Urudiaji wa Kiebrania umeelezwa kwa “atazidi/utazidi,” jambo linalotoa maana ya mwendo unaoendelea bila kufanya sentensi kuwa nzito.
