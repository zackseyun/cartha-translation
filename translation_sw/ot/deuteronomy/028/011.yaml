id: DEU.28.11
reference: Deuteronomy 28:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הוֹתִֽרְ/ךָ֤ יְהוָה֙ לְ/טוֹבָ֔ה בִּ/פְרִ֧י בִטְנְ/ךָ֛ וּ/בִ/פְרִ֥י בְהַמְתְּ/ךָ֖ וּ/בִ/פְרִ֣י אַדְמָתֶ֑/ךָ עַ֚ל הָ/אֲדָמָ֔ה אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֶ֖י/ךָ לָ֥/תֶת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/011.yaml
  text: And Yahweh will make you abound in prosperity[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground[c][b], on the land that Yahweh swore to your fathers to give you.
translation:
  language: sw
  text: Yahwe atakufanya uwe na wingi wa mema[a]—katika uzao wa tumbo lako[b], uzao wa mifugo yako, na mazao ya ardhi yako[c]—katika nchi ambayo Yahwe aliwaapia mababu zako kwamba atakupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mema” au “kwa ustawi.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “tunda la tumbo lako,” yaani watoto au wazao wako.
    reason: lexical_alternative
  - marker: c
    text: Au, “mavuno ya udongo wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתִרְךָ
  choice: atakufanya uwe na wingi
  rationale: Kauli ya kusababisha katika Hiphil inaonyesha kwamba Yahwe ndiye anayemfanya mhusika awe na ziada au wingi. Usemi huu ni wa asili katika Kiswahili na unahifadhi wazo la wingi bila kulipanua kupita maandishi.
- source_word: לְטוֹבָה
  choice: wa mema
  rationale: Kihalisi ni ‘kwa mema’; katika muktadha wa baraka inaeleza wingi wenye manufaa na ustawi. ‘Wingi wa mema’ huunganika kwa kawaida na kitenzi kilichotangulia huku ikiweka wazi maana ya jumla ya wema.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: בִּפְרִי בִטְנְךָ
  choice: katika uzao wa tumbo lako
  rationale: Hii ni nahau ya Kiebrania inayomaanisha watoto au wazao. ‘Uzao wa tumbo lako’ inaeleweka katika Kiswahili, huhifadhi taswira ya uzazi, na inaendana kimtindo na ‘uzao wa mifugo’ na ‘mazao ya ardhi.’
- source_word: וּבִפְרִי בְהַמְתְּךָ
  choice: uzao wa mifugo yako
  rationale: ‘Mifugo’ ni neno la kawaida la jumla kwa wanyama wanaofugwa, na ‘uzao’ huwasilisha ongezeko lao kwa njia ya asili.
- source_word: וּבִפְרִי אַדְמָתֶךָ
  choice: mazao ya ardhi yako
  rationale: אדמה hapa ni udongo au ardhi inayolimwa. ‘Mazao ya ardhi yako’ ni usemi wa asili unaohifadhi picha ya mavuno na mwangwi wa kirai kilichotangulia.
- source_word: עַל הָאֲדָמָה
  choice: katika nchi
  rationale: Ingawa עַל kwa kawaida ni ‘juu ya,’ hapa inaonyesha mahali ambapo baraka zitatokea, yaani nchi ya ahadi. ‘Katika nchi’ ni Kiswahili cha kawaida na hutofautisha eneo hilo na ‘ardhi’ inayotoa mazao.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: ambayo Yahwe aliwaapia mababu zako kwamba atakupa
  rationale: Kirai hiki kinaifanya nchi kuwa kile ambacho Yahwe aliapa kwa mababu kwamba angempa anayesemeshwa. Muundo huu ni wazi na wa asili bila kubadili mpokeaji wa nchi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la agano יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia moja kwa moja jina יהוה. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Kama nahau ‘tunda la tumbo’ itafsiriwe kihalisi au kwa maana yake
  choice: uzao wa tumbo lako
  alternative: tunda la tumbo lako; watoto wako
  rationale: ‘Uzao wa tumbo lako’ ni wa asili zaidi katika Kiswahili kuliko ‘tunda la tumbo,’ lakini bado huhifadhi taswira ya uzazi na uhusiano wa kimtindo na uzao wa mifugo na mazao ya ardhi.
- issue: Mpokeaji wa nchi katika kiapo kwa mababu
  choice: mababu ndio walioapiwa, lakini nchi itapewa mtu anayesemeshwa
  alternative: Yahwe aliapa kuwapa mababu wenyewe na kizazi chao
  rationale: Sintaksia ya Kiebrania ina לַאֲבֹתֶיךָ baada ya ‘aliapa’ na לָתֶת לָךְ, ‘kukupa,’ mwishoni. Tafsiri inahifadhi mvutano huo bila kuhamisha ‘wewe’ kuwa ‘wao.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi unaweka orodha ya nyanja tatu za baraka kati ya vistari virefu ili ‘wingi wa mema’ usomwe kwa uwazi. ‘Uzao/mazao’ huhifadhi kwa kadiri inayowezekana urudiaji wa Kiebrania bila kutumia usemi usio wa kawaida wa ‘tunda’ katika kila kirai.
