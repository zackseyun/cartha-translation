language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: שׁוֹרְ/ךָ֞ טָב֣וּחַ לְ/עֵינֶ֗י/ךָ וְ/לֹ֣א תֹאכַל֮ מִמֶּ/נּוּ֒ חֲמֹֽרְ/ךָ֙ גָּז֣וּל מִ/לְּ/פָנֶ֔י/ךָ וְ/לֹ֥א יָשׁ֖וּב לָ֑/ךְ צֹֽאנְ/ךָ֙ נְתֻנ֣וֹת לְ/אֹיְבֶ֔י/ךָ וְ/אֵ֥ין לְ/ךָ֖ מוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/031.yaml
  text: Your ox will be slaughtered before your eyes[a], but you will not eat any of it; your donkey will be seized from before you and will not be returned to you; your flock will be given to your enemies[b], and there will be no one to save you.
translation:
  language: sw
  text: Ng’ombe wako atachinjwa mbele ya macho yako, lakini hutakula hata kidogo nyama yake. Punda wako atanyakuliwa mbele yako[a], wala hatarudi kwako. Kundi lako la kondoo na mbuzi litakabidhiwa kwa adui zako, wala hakutakuwa na mtu wa kukuokoa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ataibiwa” au “atanyang’anywa”; neno la Kiebrania linaonyesha kuchukuliwa kwa nguvu au kwa unyang’anyi.
    reason: lexical_alternative
  - marker: b
    text: Au “hutakuwa na mwokozi” au “hakutakuwa na mkombozi wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹרְךָ
  choice: Ng’ombe wako
  rationale: שׁוֹר ni mnyama mmoja wa jamii ya ng’ombe, mara nyingi wa kazi. “Ng’ombe” ni neno la kawaida na la asili katika Kiswahili; “fahali” lingeongeza kwa lazima maana ya dume lisilohasiwa.
- source_word: טָבוּחַ
  choice: atachinjwa
  rationale: Kitenzi טבח hapa humaanisha kuchinja mnyama, si kuua kwa ujumla. Wakati ujao unafaa mfululizo huu wa laana.
- source_word: לְעֵינֶיךָ
  choice: mbele ya macho yako
  rationale: Nahau hii inasisitiza kwamba jambo hilo litatokea waziwazi mtu akiliona, hivyo kuongeza fedheha na kutoweza kwake kulizuia.
- source_word: וְלֹא תֹאכַל מִמֶּנּוּ
  choice: lakini hutakula hata kidogo nyama yake
  rationale: Kwa mnyama aliyechinjwa, Kiswahili cha kawaida hutaja nyama yake. “Hata kidogo” hudumisha maana kwamba mwenye ng’ombe hatafaidika na sehemu yoyote yake.
- source_word: חֲמֹרְךָ
  choice: Punda wako
  rationale: “Punda” ndilo neno la kawaida la Kiswahili kwa חֲמוֹר.
- source_word: גָּזוּל
  choice: atanyakuliwa
  rationale: Mzizi גזל huonyesha kunyang’anya au kuchukua kwa nguvu. “Atanyakuliwa” hudumisha ukali huo kuliko neno linaloweza kumaanisha wizi wa siri tu.
- source_word: מִלְּפָנֶיךָ
  choice: mbele yako
  rationale: Kauli hiyo inaonyesha punda akiondolewa mtu akiwa hapo na akiona, si kuchukuliwa tu kutoka katika milki yake.
- source_word: יָשׁוּב לָךְ
  choice: hatarudi kwako
  rationale: Hii hudumisha muundo tendaji wa Kiebrania na ni Kiswahili cha kawaida kwa mnyama ambaye hatarudishwa kwa mwenyewe.
- source_word: צֹאנְךָ
  choice: Kundi lako la kondoo na mbuzi
  rationale: צֹאן ni jina la jumla linaloweza kujumuisha kondoo na mbuzi. Ufafanuzi huu huepuka kulifanya “kundi” lionekane kuwa kundi la watu au kulipunguza kuwa kondoo pekee.
- source_word: נְתֻנוֹת לְאֹיְבֶיךָ
  choice: litakabidhiwa kwa adui zako
  rationale: “Litakabidhiwa” huonyesha kwamba mifugo itawekwa mikononi mwa adui, huku kauli tendwa ya chanzo ikidumishwa.
- source_word: וְאֵין לְךָ מוֹשִׁיעַ
  choice: wala hakutakuwa na mtu wa kukuokoa
  rationale: מוֹשִׁיעַ ni mtu anayeokoa au kukomboa kutoka hatarini. Kauli hii ni ya asili katika Kiswahili na hapa inaelekea kwenye ukombozi wa wakati huo, bila kuondoa lugha ya kuokoa.
theological_decisions:
- issue: Lugha ya wokovu katika kishazi cha mwisho
  choice: hakutakuwa na mtu wa kukuokoa
  alternative: hutakuwa na mwokozi; hakutakuwa na mkombozi wako
  rationale: Mzizi ישׁע unaweza kutumiwa kwa kuokoa au kukomboa. Katika muktadha huu wa laana ya agano, unahusu kutopatikana kwa msaada dhidi ya adui na upokonyaji, bila kulazimisha maana ya wokovu wa milele wala kudhoofisha maana ya moja kwa moja ya kuokoa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimegawanywa ili mfululizo wa hasara usomeke wazi. “Kundi lako la kondoo na mbuzi” linaweka wazi upana wa צֹאן kwa wasomaji wa kawaida.
