source:
  edition: WLC
  text: יִתֵּ֨ן יְהוָ֤ה אֶת אֹיְבֶ֨י/ךָ֙ הַ/קָּמִ֣ים עָלֶ֔י/ךָ נִגָּפִ֖ים לְ/פָנֶ֑י/ךָ בְּ/דֶ֤רֶךְ אֶחָד֙ יֵצְא֣וּ אֵלֶ֔י/ךָ וּ/בְ/שִׁבְעָ֥ה דְרָכִ֖ים יָנ֥וּסוּ לְ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/007.yaml
  text: Yahweh will give your enemies who rise up against you defeated before you[a]. By one way they will come out against you[b], and by seven ways they will flee before you.
translation:
  language: sw
  text: Yahwe atawafanya adui zako wanaoinuka dhidi yako washindwe mbele yako.[a] Watakujia kwa njia moja,[b] lakini watakimbia mbele yako kwa njia saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe atawakabidhi adui zako wanaoinuka dhidi yako, wakiwa wameshindwa mbele yako.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “kwa njia moja ... kwa njia saba,” taswira ya adui wanaokuja wakiwa kundi moja lakini wanakimbia wakiwa wametawanyika pande mbalimbali.
    reason: cultural_note
lexical_decisions:
- source_word: יִתֵּן
  choice: atawafanya ... washindwe
  rationale: Kitenzi נתן kwa kawaida ni ‘kutoa,’ lakini katika muktadha huu wa vita kina maana ya kuwatia au kuwaacha adui katika hali ya kushindwa. Muundo huu ni Kiswahili cha kawaida na unahifadhi matokeo yanayoonyeshwa na נִגָּפִים.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa namna ya kawaida ya Kiswahili, ‘Yahwe,’ badala ya kulibadilisha kuwa cheo.
- source_word: אֹיְבֶיךָ
  choice: adui zako
  rationale: Ni wingi wenye kiambishi cha nafsi ya pili umoja; ‘adui zako’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: הַקָּמִים עָלֶיךָ
  choice: wanaoinuka dhidi yako
  rationale: קום pamoja na על katika muktadha wa uhasama humaanisha kuinuka dhidi ya mtu. Tafsiri hii inahifadhi taswira na uadui bila kuibana kuwa tendo fulani la kijeshi.
- source_word: נִגָּפִים
  choice: washindwe
  rationale: Niphal participle hii huonyesha kupigwa au kushindwa. ‘Washindwe’ huwasilisha vizuri matokeo ya kijeshi kwa Kiswahili cha sasa.
- source_word: לְפָנֶיךָ
  choice: mbele yako
  rationale: Ni nahau ya kawaida yenye maana ya mbele yako, machoni pako, au kwa kukabiliwa nawe; ‘mbele yako’ inahifadhi muundo wa Kiebrania.
- source_word: בְּדֶרֶךְ אֶחָד
  choice: kwa njia moja
  rationale: דרך ni ‘njia’ au ‘barabara.’ Usemi huu umehifadhiwa ili kuendeleza ulinganifu na ‘kwa njia saba.’
- source_word: יֵצְאוּ אֵלֶיךָ
  choice: watakujia
  rationale: יצא pamoja na אל katika mazingira ya vita hueleza kutoka ili kumkabili mtu. ‘Watakujia’ ni ya asili katika Kiswahili, huku muktadha wa adui ukionyesha wazi kuwa wanakuja kushambulia.
- source_word: וּבְשִׁבְעָה דְרָכִים
  choice: lakini ... kwa njia saba
  rationale: Kiunganishi kimetolewa kwa ‘lakini’ ili kudhihirisha utofauti wa kishairi kati ya kuja kwa umoja na kukimbia kwa kutawanyika; ‘njia saba’ inahifadhi namba na taswira ya Kiebrania.
- source_word: יָנוּסוּ
  choice: watakukimbia
  rationale: נוס ni kukimbia kwa hofu au baada ya kushindwa. ‘Watakukimbia’ huonyesha kuwa wanakimbia mbele ya mhusika anayezungumziwa, si kukimbia tu bila mwelekeo.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko lina jina binafsi יהוה, si cheo אֲדֹנָי. ‘Yahwe’ hulihifadhi kama jina la agano na ndiyo tahajia iliyozoeleka katika Kiswahili.
- issue: Namna Mungu anavyowatia adui katika kushindwa
  choice: atawafanya ... washindwe
  alternative: atawakabidhi adui zako wakiwa wameshindwa
  rationale: Kiebrania נתן pamoja na kishirikishi נִגָּפִים kinaweza kuwasilishwa kama ‘kutoa/kuwakabidhi wakiwa wameshindwa.’ Tafsiri kuu inaeleza kwa Kiswahili cha kawaida kwamba Yahwe ndiye anayesababisha kushindwa kwao, huku tanbihi ikihifadhi nahau ya karibu zaidi na Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kishairi wa ‘njia moja ... njia saba’ umehifadhiwa, huku tanbihi ikifafanua taswira yake.
