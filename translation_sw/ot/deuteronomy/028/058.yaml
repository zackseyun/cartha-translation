base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/058.yaml
  text: If you are not careful to do all the words of this law that are written in this book[c][b][a], to fear this glorious and awesome name—Yahweh your God—
translation:
  language: sw
  text: Usipokuwa mwangalifu kuyatekeleza maneno yote ya sheria hii yaliyoandikwa katika kitabu hiki[a], ili kulihofu[b] jina hili tukufu na la kuogofya—Yahweh[c], Mungu wako—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hati-kunjo” badala ya “kitabu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kuliheshimu kwa kicho jina hili tukufu na la kuogofya.” Kitenzi cha Kiebrania kwa kawaida kinajumuisha kicho na hofu.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “YHWH”; kwa desturi limetafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁמֹר לַעֲשׂוֹת
  choice: usipokuwa mwangalifu kuyatekeleza
  rationale: Muundo wa שׁמר pamoja na kitenzi-jina cha עשׂה unaonyesha uangalifu unaozaa utiifu wa vitendo. Kiswahili hiki kinahifadhi uangalifu na utekelezaji bila kuwa kigumu.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: maneno yote ya sheria hii
  rationale: ‘Maneno yote’ linafuata דִּבְרֵי kwa karibu, huku ‘sheria’ likifaa muktadha wa agano wa תּוֹרָה katika Kumbukumbu la Torati.
- source_word: הַכְּתוּבִים בַּסֵּפֶר הַזֶּה
  choice: yaliyoandikwa katika kitabu hiki
  rationale: Linahifadhi hali ya maandishi ya masharti ya agano; ‘kitabu’ ni Kiswahili cha kawaida, ingawa ‘hati-kunjo’ pia yawezekana kihistoria.
- source_word: לְיִרְאָה
  choice: ili kulihofu
  rationale: ‘Ili’ linaonyesha kusudi au matokeo, na ‘kulihofu’ linahifadhi wigo wa ירא unaohusisha kicho pamoja na hofu.
- source_word: הַשֵּׁם
  choice: jina
  rationale: Linadumisha namna ya heshima ya kurejelea utambulisho na sifa ya Mungu badala ya kuifafanua kwa maneno mengine.
- source_word: הַנִּכְבָּד וְהַנּוֹרָא
  choice: tukufu na la kuogofya
  rationale: ‘Tukufu’ linaonyesha heshima na uzito wa נכבד; ‘la kuogofya’ linatunza nguvu ya hofu na kicho katika נורא.
- source_word: יְהוָה
  choice: Yahwe
  rationale: ‘Yahwe’ ni umbo la Kiswahili la jina la agano YHWH, badala ya kulibadilisha kuwa cheo ‘BWANA’.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Linawakilisha moja kwa moja kiambishi cha nafsi ya pili umoja na uhusiano wa agano.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja. Kulitaja kama ‘Yahwe’ kunahifadhi jina la agano, huku tanbihi ikieleza desturi nyingine ya tafsiri.
- issue: Iwapo ירא lipunguzwe kuwa heshima pekee
  choice: kulihofu
  alternative: kulicha; kuliheshimu kwa kicho
  rationale: ‘Kulihofu’ haliondoi mvutano wa kitheolojia kati ya kicho cha ibada na hofu unaopatikana katika kitenzi cha Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sharti umeachwa wazi kwa sababu sentensi inaendelea katika mstari unaofuata; vistari virefu vya mwisho vinaonyesha mwendelezo huo.
