    rationale: Ingawa ‘Yahwe’ hutokea katika matumizi fulani ya Kiswahili, rekodi ya POB ya Kiingereza na uamuzi wake wa istilahi hutumia ‘Yahweh.’ Umbo hilo hudumisha uthabiti wa jina katika mradi.
  - severity: medium
    issue: 'Tanbihi b ina mbadala usio sahihi: ‘kulicha jina hili.’'
