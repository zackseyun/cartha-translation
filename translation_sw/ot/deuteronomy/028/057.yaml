  text: וּֽ/בְ/שִׁלְיָתָ֞/הּ הַ/יּוֹצֵ֣ת מִ/בֵּ֣ין רַגְלֶ֗י/הָ וּ/בְ/בָנֶ֨י/הָ֙ אֲשֶׁ֣ר תֵּלֵ֔ד כִּֽי תֹאכְלֵ֥/ם בְּ/חֹֽסֶר כֹּ֖ל בַּ/סָּ֑תֶר בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁ֨ר יָצִ֥יק לְ/ךָ֛ אֹיִבְ/ךָ֖ בִּ/שְׁעָרֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/057.yaml
  text: and toward her afterbirth that comes out from between her legs[a], and toward her children whom she bears, because she will eat them secretly, in the lack of everything[c][b], during the siege and distress with which your enemy will oppress you within your gates.
translation:
  language: sw
  text: na hata kondo lake litokalo katikati ya miguu yake[a], na watoto wake atakaowazaa, kwa maana atawala kwa siri kondo hilo na watoto hao kwa kukosa kila kitu[b], wakati wa kuzingirwa na dhiki atakayokuletea adui yako ndani ya malango yako[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “placenta yake.” Neno la Kiebrania hutaja hasa kondo linalotoka wakati wa kujifungua.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa upungufu wa kila kitu.” Kirai hiki huonyesha kunyimwa vitu vyote wakati wa kuzingirwa.
    reason: lexical_alternative
  - marker: c
    text: “Ndani ya malango yako” ni usemi unaomaanisha ndani ya miji au makazi yako yaliyokuwa yamezingirwa, wala si kwenye majengo ya malango peke yake.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְיָתָהּ
  choice: kondo lake la nyuma
  rationale: Neno hili hutaja kondo au mabaki yanayotoka baada ya mtoto kuzaliwa. “Kondo la nyuma” ni usemi wa kawaida na unaoeleweka katika Kiswahili, bila kupunguza ukali wa picha hiyo.
- source_word: הַיֹּצֵת מִבֵּין רַגְלֶיהָ
  choice: litokalo katikati ya miguu yake
  rationale: Tafsiri hii inadumisha maelezo ya moja kwa moja ya kujifungua; “miguu” ndiyo usemi wa kawaida katika muktadha huu.
- source_word: וּבְבָנֶיהָ אֲשֶׁר תֵּלֵד
  choice: na watoto wake atakaowazaa
  rationale: בָּנִים yaweza kumaanisha wana wa kiume au watoto kwa jumla. Muktadha unahusu watoto aliowazaa, hivyo “watoto” ni pana na ya asili.
- source_word: כִּי תֹאכְלֵם
  choice: kwa maana atakula vyote
  rationale: כִּי inatoa sababu, na אכל ni kitenzi cha kawaida cha kula. “Vyote” kinarejelea kondo na watoto bila kulazimisha upatanisho wa ngeli moja kwa vitu hivyo viwili.
- source_word: בְּחֹסֶר כֹּל
  choice: kwa kukosa kila kitu
  rationale: Kirai hiki kinaonyesha upungufu kamili wa mahitaji. Usemi huu ni wa kawaida katika Kiswahili na unahifadhi maana ya kunyimwa kila kitu.
- source_word: בַּסָּתֶר
  choice: kwa siri
  rationale: Hiki ni kielezi kinachoonyesha kwamba tendo hilo litafanywa kwa kujificha.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: wakati wa kuzingirwa na katika dhiki
  rationale: מָצוֹר ni hali ya mji kuzingirwa, na מָצוֹק ni dhiki au shinikizo kali. Maneno yote mawili yamehifadhiwa.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ
  choice: ambayo adui yako atakubana nayo
  rationale: Hifili ya צוּק ina wazo la kumtia mtu katika shinikizo au hali ya kubanwa. “Atakubana nayo” linafaa hasa kwa mazingira ya kuzingirwa.
- source_word: בִּשְׁעָרֶיךָ
  choice: ndani ya malango yako
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya “malango,” huku tanbihi ikifafanua kuwa usemi huo unamaanisha miji yenyewe.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha lakini ya moja kwa moja kwa sababu chanzo chenyewe kinaeleza kwa ukali maafa ya kuzingirwa. Muundo wa mwanzo “na hata” unaonyesha kwamba mstari huu unaendeleza sentensi ya mstari uliotangulia.
