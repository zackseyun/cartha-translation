base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/015.yaml
  text: But if you do not listen to the voice of Yahweh your God[a], to keep and to do all his commandments and his statutes that I am commanding you today[b], then all these curses will come upon you and overtake you.
translation:
  language: sw
  text: Lakini usipoisikiliza sauti ya Yahweh Mungu wako[a] ili ushike na kutenda amri zake zote na sheria zake ninazokuamuru leo[b], laana hizi zote zitakujia na kukupata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “isikiliza sauti ya.” Nahau hii inahusisha kusikia kunakoambatana na utii; au, “usipomtii Yahweh Mungu wako.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa kushika na kutenda amri zake zote na sheria zake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם לֹא
  choice: Lakini usipo- ...
  rationale: Katika muktadha huu muundo huo unaanzisha sharti linalotofautiana na baraka zilizotangulia. “Lakini usipo-” ni Kiswahili cha kawaida kinachohifadhi utofautishaji na sharti.
- source_word: תִשְׁמַע בְּקוֹל
  choice: isikiliza sauti ya
  rationale: Huhifadhi picha halisi ya kusikiliza sauti, huku katika muktadha wa agano ikidokeza kusikia kunakoleta utii; maana hiyo haijafupishwa kuwa “tii” pekee.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Ni tafsiri ya kawaida ya usemi wa agano wenye kiambishi cha nafsi ya pili umoja.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: kwa kushika na kutenda
  rationale: Huhifadhi vitenzi viwili vya Kiebrania na wazo la kuzingatia maagizo pamoja na kuyatekeleza, bila kuongeza kielezi kisichotajwa wazi kama “kwa uangalifu.”
- source_word: כָּל מִצְוֺתָיו וְחֻקֹּתָיו
  choice: amri zake zote na sheria zake
  rationale: “Amri” na “sheria” ni istilahi za kawaida na zenye hadhi katika Kiswahili; zinadumisha kwa kadiri inayowezekana tofauti kati ya מִצְוֹת na חֻקּוֹת.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ninazokuamuru leo
  rationale: Huonyesha tendo la Musa la sasa la kuamuru na uhusiano wa kishazi kwa Kiswahili cha kawaida.
- source_word: וּבָאוּ עָלֶיךָ
  choice: zitakujia
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha laana kumjia mtu.
- source_word: כָּל הַקְּלָלוֹת הָאֵלֶּה
  choice: laana hizi zote
  rationale: Hutoa maana ya moja kwa moja ya laana za agano na kufuata mpangilio wa kawaida wa Kiswahili.
- source_word: וְהִשִּׂיגוּךָ
  choice: na kukupata
  rationale: Huhifadhi picha ya laana zinazomfuatia mtu hadi zinamfikia, kwa usemi wa asili wa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la agano יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Kiwango cha uwazi katika nahau ya kusikia na kutii
  choice: isikiliza sauti ya Yahweh Mungu wako
  alternative: mtii Yahweh Mungu wako
  rationale: Chaguo hili huhifadhi taswira ya Kiebrania ya kusikiliza sauti na mvutano wake wa kiagano, huku muktadha wa kushika na kutenda ukionyesha kwamba kusikiliza kunahusisha utii.
- issue: Uhusiano wa לִשְׁמֹר לַעֲשׂוֹת na sharti kuu
  choice: kwa kushika na kutenda
  alternative: ili kushika na kutenda
  rationale: “Kwa” huonyesha namna kusikiliza kunavyodhihirishwa bila kufuta uwezekano wa kusudi uliomo katika viambishi vya Kiebrania; tanbihi inataja mbadala huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida huku ukihifadhi nahau ya Kiebrania ya “kusikiliza sauti,” jozi ya “kushika na kutenda,” na taswira ya laana zinazomjia mtu na kumpata.
