base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/067.yaml
  text: In the morning you will say[a], “If only it were evening!” and in the evening you will say, “If only it were morning!” because of the dread of your heart that you will dread[b], and because of the sight your eyes will see.
translation:
  language: sw
  text: Asubuhi utasema[a], “Laiti ingekuwa jioni!” na jioni utasema, “Laiti ingekuwa asubuhi!” kwa sababu ya hofu ya moyo wako utakayoihofu[b], na kwa sababu ya mambo ambayo macho yako yataona.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Ni nani atakayetoa jioni/asubuhi?” Hii ni nahau inayoonyesha tamanio, hivyo maana yake ni “Laiti ingekuwa jioni/asubuhi!”'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “kwa sababu ya hofu iliyo moyoni mwako ... na kwa sababu ya mambo ambayo macho yako yataona.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: Asubuhi
  rationale: Kirai cha wakati chenye kibainishi; “Asubuhi” ni Kiswahili cha kawaida na cha asili.
- source_word: תֹּאמַר
  choice: utasema
  rationale: Kauli ya Qal imperfect nafsi ya pili umoja inaeleza jambo litakalotokea katika muktadha wa laana, si amri.
- source_word: מִי יִתֵּן
  choice: Laiti ingekuwa
  rationale: Hii ni nahau ya Kiebrania inayoonyesha tamanio kubwa, si swali halisi la kutaka kujua ni nani atakayetoa kitu.
- source_word: עֶרֶב
  choice: jioni
  rationale: Neno la kawaida la wakati, likiwa sambamba kwa ukinzani na “asubuhi.”
- source_word: מִפַּחַד
  choice: kwa sababu ya hofu
  rationale: Kihusishi מִן kina maana ya sababu hapa; “hofu” linaonyesha woga wenye nguvu na linafaa katika muktadha huu.
- source_word: לְבָבְךָ
  choice: moyo wako
  rationale: Hudumisha taswira ya Kiebrania ya moyo kama utu wa ndani huku likibaki wazi katika Kiswahili.
- source_word: אֲשֶׁר תִּפְחָד
  choice: utakayoihofu
  rationale: Hudumisha kishazi rejeshi na mwangwi wa mzizi wa maneno פַּחַד/פחד, ingawa urudiaji huo ni mzito kidogo kwa Kiswahili.
- source_word: וּמִמַּרְאֵה עֵינֶיךָ אֲשֶׁר תִּרְאֶה
  choice: na kwa sababu ya yale ambayo macho yako yataona
  rationale: Kiswahili cha asili kinachoendeleza picha hai ya macho kuona bila kuingiza waziwazi sifa ya “kutisha” ambayo haijasemwa moja kwa moja katika nomino מַרְאֶה.
