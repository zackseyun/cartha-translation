translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa “hofu ... utakayoihofu” umehifadhiwa kwa makusudi ili kuakisi mwangwi wa Kiebrania; nahau ya tamanio imetafsiriwa kwa “Laiti” badala ya swali halisi lisilo la kawaida katika Kiswahili.
