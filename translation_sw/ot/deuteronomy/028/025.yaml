source:
  edition: WLC
  text: יִתֶּנְ/ךָ֨ יְהוָ֥ה נִגָּף֮ לִ/פְנֵ֣י אֹיְבֶי/ךָ֒ בְּ/דֶ֤רֶךְ אֶחָד֙ תֵּצֵ֣א אֵלָ֔י/ו וּ/בְ/שִׁבְעָ֥ה דְרָכִ֖ים תָּנ֣וּס לְ/פָנָ֑י/ו וְ/הָיִ֣יתָ לְ/זַעֲוָ֔ה לְ/כֹ֖ל מַמְלְכ֥וֹת הָ/אָֽרֶץ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/025.yaml
  text: Yahweh will give you over as defeated before your enemies. You will go out against them by one way[a], and by seven ways you will flee before them, and you will become a horror to all the kingdoms of the earth.
translation:
  language: sw
  text: Yahweh atakutia mikononi mwa adui zako, ukiwa umeshindwa. Utatoka kwenda kupigana nao kwa njia moja, lakini utawakimbia kwa njia saba; nawe utakuwa kitu cha kutisha[a] kwa falme zote za dunia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitu cha kuogofya.” Neno la Kiebrania linaweza kumaanisha kitu kinachosababisha hofu au woga mkubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּנְךָ נִגָּף
  choice: atakutia mikononi mwa adui zako, nao watakushinda
  rationale: Muundo wa Kiebrania una maana ya Yahweh kumtoa mtu ashindwe vitani. Kiswahili hiki cha kawaida huhifadhi wazo la kukabidhiwa kwa adui pamoja na matokeo ya kushindwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: לִפְנֵי אֹיְבֶיךָ
  choice: mbele ya adui zako / mikononi mwa adui zako
  rationale: Katika muktadha wa vita, kifungu hiki huonyesha kushindwa na kukimbia mbele ya adui; tafsiri ya kwanza imeelezwa kwa Kiswahili cha kawaida, huku picha ya 'mbele yao' ikihifadhiwa katika kishazi kinachofuata.
- source_word: בְּדֶרֶךְ אֶחָד
  choice: kwa njia moja
  rationale: Huhifadhi picha na ulinganifu wa njia moja ya kwenda kupigana dhidi ya njia saba za kutawanyika.
- source_word: תֵּצֵא אֵלָיו
  choice: utatoka kwenda kupigana nao
  rationale: Kitenzi pamoja na kihusishi chake katika muktadha wa kijeshi humaanisha kutoka kwenda kupigana na adui. Wingi wa Kiswahili unalingana kwa kawaida na 'adui zako,' ingawa kiwakilishi cha Kiebrania ni cha umoja wa kijumla.
- source_word: וּבְשִׁבְעָה דְרָכִים
  choice: kwa njia saba
  rationale: Huhifadhi taswira halisi ya Kiebrania ya jeshi lililoungana likitawanyika kabisa.
- source_word: תָּנוּס לְפָנָיו
  choice: utakimbia mbele yao
  rationale: Hutoa wazi maana ya kukimbia kutoka vitani mbele ya adui; kiwakilishi cha wingi ni cha asili katika Kiswahili kwa kurejelea 'adui zako.'
- source_word: וְהָיִיתָ לְזַעֲוָה
  choice: utakuwa kitu cha kutisha
  rationale: זַעֲוָה inaweza kumaanisha hofu au kitu kinachosababisha hofu. 'Kitu cha kutisha' huwasilisha kwamba Israeli itakuwa jambo la kuogofya kwa falme nyingine bila kuamua kupita kiasi ikiwa ni chanzo au kitu cha hofu.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: kwa falme zote za dunia
  rationale: Muktadha wa laana ya agano una upeo wa kimataifa, hivyo 'dunia' inafaa kuliko kuifunga maana kwa nchi moja.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kina jina la agano moja kwa moja; unukuzi 'Yahweh' hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Maana ya לְזַעֲוָה katika laana
  choice: kitu cha kutisha
  alternative: hofu; kitu cha kuogofya
  rationale: Chaguo hili huhifadhi mvutano wa kile kinachosababisha hofu na kile kinachotazamwa kwa hofu, bila kuingiza maelezo ya kiteolojia yasiyomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha ya vita imewekwa wazi kwa msomaji wa kawaida, huku ulinganifu wa 'njia moja' na 'njia saba' pamoja na uzito wa laana ukihifadhiwa.
