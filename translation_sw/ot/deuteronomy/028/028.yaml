translation:
  language: sw
  text: Yahweh atakupiga kwa wazimu, upofu, na kuchanganyikiwa moyoni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bumbuwazi moyoni” au “kufadhaika moyoni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: atakupiga
  rationale: Hifili ya נכה ina maana ya kupiga au kuleta pigo. “Atakupiga” ni ya kawaida, yenye nguvu, na inadumisha lugha ya laana ya agano.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: בְּשִׁגָּעוֹן
  choice: kwa wazimu
  rationale: שִׁגָּעוֹן humaanisha wazimu au kuvurugika kwa akili. “Wazimu” ni tafsiri ya moja kwa moja na inayoeleweka katika Kiswahili cha sasa.
- source_word: וּבְעִוָּרוֹן
  choice: upofu
  rationale: עִוָּרוֹן humaanisha upofu. Tafsiri haiongezi “wa akili,” kwa sababu matini yenyewe haibainishi hivyo.
- source_word: וּבְתִמְהוֹן לֵבָב
  choice: na kuchanganyikiwa moyoni
  rationale: תִמְהוֹן huonyesha kuchanganyikiwa, kufadhaika, au kupigwa na bumbuwazi; לֵבָב ni moyo kwa maana ya ndani inayoweza kujumuisha fikira na nia. Usemi huu ni wa kawaida na bado unahifadhi picha ya Kiebrania.
- source_word: לֵבָב
  choice: moyoni
  rationale: “Moyoni” huhifadhi taswira ya Kiebrania ya moyo kama kitovu cha fikira, nia, na hali ya ndani bila kuifasiri kwa finyu kuwa akili pekee.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Matini inatumia moja kwa moja Tetragramatoni יהוה. “Yahweh” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
