base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/049.yaml
  text: Yahweh will raise up against you a nation from far away[a], from the end of the earth[b], as the eagle swoops down—a nation whose language you will not understand.
translation:
  language: sw
  text: Yahwe atakuletea taifa dhidi yako kutoka mbali, kutoka mwisho wa dunia, kama tai arukavyo kwa kasi[a]—taifa ambalo hutafahamu lugha yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama tai arukavyo” au “kama tai ajitupavyo kwa kasi.” Kitenzi cha Kiebrania kinakazia mwendo wa haraka.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya neno kwa neno, “ambalo hutasikia ulimi wake”; maana yake ni kwamba hutafahamu lugha yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא ... עָלֶיךָ
  choice: atakuinulia
  rationale: Kitenzi נשׂא pamoja na עַל hapa kinaonyesha Yahwe akisababisha taifa lije dhidi ya Israeli. “Atakuinulia” huhifadhi picha ya kuinua/kusimamisha adui na utendaji wa Mungu, huku muktadha ukionyesha wazi kuwa ni dhidi yako.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama “BWANA.” Umbo “Yahwe” linafuata tahajia ya kawaida ya Kiswahili.
- source_word: גּוֹי
  choice: taifa
  rationale: גוי hapa ni taifa la kigeni linalokuja kuvamia, si kundi la kikabila tu.
- source_word: מֵרָחוֹק
  choice: kutoka mbali
  rationale: Hutoa kwa lugha ya kawaida wazo la umbali mkubwa.
- source_word: מִקְצֵה הָאָרֶץ
  choice: kutoka mwisho wa dunia
  rationale: Kauli hii inasisitiza sehemu iliyo mbali sana; “dunia” inafaa kuliko “nchi” kwa kuwa wazo kuu ni umbali kutoka pembezoni mwa ulimwengu unaojulikana.
- source_word: כַּאֲשֶׁר יִדְאֶה הַנָּשֶׁר
  choice: kama tai arukavyo kwa kasi
  rationale: ידאה huonyesha mwendo wa haraka wa kuruka au kujitupa angani. Tafsiri hii huhifadhi kasi bila kulazimisha wazo la kushuka ambalo halijasemwa wazi; נשר imetafsiriwa kwa neno la kawaida “tai,” ingawa linaweza pia kumaanisha ndege mkubwa aina ya tumbusi.
- source_word: לֹא תִשְׁמַע לְשֹׁנוֹ
  choice: lugha yake hutaielewa
  rationale: Ingawa kwa neno moja moja ni “hutasikia ulimi wake,” שמע pamoja na “ulimi/lugha” hapa humaanisha kutoweza kuelewa usemi.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina binafsi la agano, si cheo. “Yahwe” hulihifadhi kwa namna ya kawaida katika Kiswahili bila kulibadilisha kuwa “BWANA.”
- issue: Utendaji wa Yahwe katika kuja kwa taifa
  choice: atakuinulia taifa
  alternative: ataleta taifa dhidi yako
  rationale: Tafsiri hii hudumisha kauli ya moja kwa moja kwamba Yahwe ndiye anayelisababisha taifa kuinuka katika muktadha wa laana ya agano, bila kupunguza mvutano wa kiteolojia wa hukumu hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi urudiaji wa “kutoka” na muundo wa tishio la kinabii, huku nahau ya Kiebrania kuhusu kusikia ulimi ikitolewa kwa Kiswahili kinachoeleweka.
