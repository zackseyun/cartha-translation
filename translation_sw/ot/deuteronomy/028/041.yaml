  yaml_path: translation/ot/deuteronomy/028/041.yaml
  text: You will father sons and daughters[a], but they will not remain yours[b], because they will go into captivity.
translation:
  language: sw
  text: Utazaa wana na mabinti, lakini hawatakuwa wako[a], kwa sababu watakwenda utumwani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawatabaki kuwa wako.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wakiwa mateka.” Kiebrania kinazungumzia hasa hali ya kuwa mateka.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנִים וּבָנוֹת
  choice: wana na mabinti
  rationale: Kiebrania kinataja wazi watoto wa kiume na wa kike; “wana na mabinti” huhifadhi jozi hiyo na uzito wake wa kimatamshi.
- source_word: תּוֹלִיד
  choice: utazaa
  rationale: Kitenzi hiki kinaelekezwa kwa nafsi ya pili umoja ya kiume na kinahusu kuzaa au kupata watoto. Katika Kiswahili cha kawaida, “utazaa” ni cha asili na hakihitaji usemi mzito kama “utazalisha,” ambao ungeweza kupotosha.
- source_word: וְלֹא יִהְיוּ לָךְ
  choice: lakini hawatakuwa wako
  rationale: Hii huhifadhi kwa karibu usemi wa Kiebrania, kihalisi “hawatakuwa kwako/wako,” bila kuongeza wazi dhana ya kubaki ambayo imedokezwa na muktadha.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki hapa kinaonyesha sababu ya wao kutokuwa wake.
- source_word: יֵלְכוּ
  choice: watakwenda
  rationale: Kitenzi ni tendaji, “kwenda”; tafsiri hii haibadili kauli kuwa “watachukuliwa,” ingawa muktadha unaonyesha kupelekwa kwa nguvu.
- source_word: בַּשֶּׁבִי
  choice: utumwani
  rationale: Neno hili humaanisha hali ya kuwa mateka, hasa katika vita au uhamisho wa kulazimishwa. “Utumwani” ni usemi mfupi na wa kawaida wa Kiswahili unaofaa baada ya “watakwenda.”
