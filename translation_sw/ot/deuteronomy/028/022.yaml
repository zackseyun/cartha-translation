base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/022.yaml
  text: Yahweh will strike you with wasting disease[a], with fever, with inflammation, with burning heat, with the sword, with blight, and with mildew[b]; and they will pursue you until you perish.
translation:
  language: sw
  text: Yahwe atakupiga kwa ugonjwa wa kudhoofisha[a], kwa homa, kwa uvimbe, kwa joto kali, kwa upanga, kwa ukaukaji wa mazao, na kwa kugeuka manjano kwa mimea; maafa hayo yatakufuatilia mpaka uangamie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ugonjwa wa kukondesha.” Neno la Kiebrania linaonyesha ugonjwa mkali unaodhoofisha mwili.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania ni cha wingi; yaani, mapigo na maafa yaliyotajwa yatakufuatilia.
    reason: grammatical_clarification
lexical_decisions:
- source_word: יַכְּכָה
  choice: atakupiga
  rationale: Hifili ya נכה ina maana ya kumpiga mtu; usemi huu huhifadhi nguvu ya adhabu na nafsi ya pili umoja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa umbo la Kiswahili linalotumiwa kwa YHWH badala ya kulibadili kuwa cheo.
- source_word: שַׁחֶפֶת
  choice: ugonjwa wa kudhoofisha
  rationale: Neno hilo linaashiria ugonjwa unaomdhoofisha na kumkondesha mtu, bila kulihusisha kwa uhakika usiostahili na kifua kikuu.
- source_word: קַּדַּחַת
  choice: homa
  rationale: Ni neno la wazi na la kawaida kwa ugonjwa wenye joto la mwili.
- source_word: דַּלֶּקֶת
  choice: uvimbe
  rationale: Neno la Kiebrania linahusishwa na kuwaka au hali ya mwili kuvimba; 'uvimbe' ni la kawaida na linatofautisha hali hii na homa.
- source_word: חַרְחֻר
  choice: joto kali
  rationale: Neno hili adimu huenda likamaanisha joto linalochoma au homa kali; tafsiri hii huhifadhi maana ya msingi bila usahihi wa kitabibu usiothibitishwa.
- source_word: חֶרֶב
  choice: upanga
  rationale: Maana ya kawaida ni upanga, ambao hapa pia unaweza kuwakilisha vita au kifo cha jeuri.
- source_word: שִׁדָּפוֹן
  choice: ukaukaji wa mazao
  rationale: Neno linaeleza madhara ya mimea au mazao yanayosababishwa na hali ya kukausha au kuunguza; kirai hiki kinaeleweka kwa msomaji wa kawaida.
- source_word: יֵרָקוֹן
  choice: kugeuka manjano kwa mimea
  rationale: Katika muktadha wa kilimo neno linaweza kumaanisha hali ya mimea kuwa ya manjano au ugonjwa unaofanana na koga; tafsiri hii haifungi maana kwa aina moja hususa ya ugonjwa.
- source_word: וּרְדָפוּךָ
  choice: nayo yatakufuatilia
  rationale: Kitenzi ni cha wingi na kinarejelea mapigo na maafa yaliyotajwa; kiwakilishi 'yayo' hudumisha wingi huo katika Kiswahili.
- source_word: עַד אָבְדֶךָ
  choice: mpaka uangamie
  rationale: אבד huonyesha kuangamia au kufikia maangamizi; tafsiri hii ni fupi na inadumisha usemi wa moja kwa moja.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko lina jina la agano YHWH, si cheo; 'Yahwe' hulihifadhi kama jina la pekee kwa umbo la kawaida la Kiswahili.
- issue: Kiima cha kitenzi cha wingi וּרְדָפוּךָ
  choice: Mapigo na maafa yaliyotangulia yatawafuatilia
  alternative: Yahwe atakufuatilia
  rationale: Kitenzi cha Kiebrania ni cha wingi, kwa hiyo kinarejelea kwa kawaida orodha ya mateso na maafa, si Yahwe akiwa kiima cha umoja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Orodha imetolewa kwa maneno yanayoeleweka bila kuweka utambuzi wa kitabibu au wa kilimo ulio mahususi kupita ushahidi wa Kiebrania.
