  yaml_path: translation/ot/deuteronomy/030/003.yaml
  text: then Yahweh your God will restore your fortunes and have compassion on you[c][b][a], and he will gather you again from all the peoples where Yahweh your God has scattered you.
translation:
  language: sw
  text: ndipo Yahwe Mungu wako atarejesha hali yako[a] na kukuhurumia, naye atakukusanya tena[b] kutoka kwa mataifa yote[c] ambako Yahwe Mungu wako amekutawanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata maneno ya Kiebrania kwa karibu zaidi, “atarudisha utekwa wako.” Msemo huu wa Kiebrania humaanisha kumrejesha mtu kutoka katika hali ya shida au uhamisho.
    reason: lexical_alternative
  - marker: b
    text: Au “naye atarudi na kukukusanya.”
    reason: alternative_reading
  - marker: c
    text: Au “kutoka kwa makundi yote ya watu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la agano la Mungu kwa umbo linalotumika na kueleweka katika Kiswahili.
- source_word: שָׁב אֶת־שְׁבוּתְךָ
  choice: atakurejeshea hali yako njema
  rationale: Huu ni msemo wa Kiebrania unaoonyesha kugeuzwa kwa hali ya shida au uhamisho na kurudishwa katika hali nzuri; tafsiri ya neno kwa neno ingekuwa yenye utata katika Kiswahili.
- source_word: וְרִחֲמֶךָ
  choice: na kukuhurumia
  rationale: Kitenzi hiki huonyesha huruma yenye rehema; ‘kukuhurumia’ ni cha kawaida, cha heshima, na kina nguvu ya kihisia ya Kiebrania.
- source_word: וְשָׁב וְקִבֶּצְךָ
  choice: naye atakukusanya tena
  rationale: שָׁב ya pili inaweza kueleweka kuwa ‘tena’ pamoja na kitenzi kinachofuata; muundo huu ni wa asili katika Kiswahili huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: מִכָּל הָעַמִּים
  choice: kutoka kwa mataifa yote
  rationale: עַמִּים inaweza kumaanisha makundi ya watu au mataifa. Katika muktadha wa kutawanywa na kukusanywa, ‘mataifa’ ni usemi wa kawaida na unaoeleweka vizuri katika Kiswahili.
- source_word: הֱפִיצְךָ
  choice: alikuwa amekutawanya
  rationale: ‘Kutawanya’ huwasilisha kwa uwazi tendo la kuwafanya watu waenee katika maeneo mbalimbali, hasa katika muktadha wa uhamisho.
- source_word: שָׁמָּה
  choice: ambako
  rationale: Ingawa maana ya msingi ni ‘huko,’ kiunganishi ‘ambako’ huwasilisha mahali kwa njia ya asili ndani ya kishazi husishi cha Kiswahili.
theological_decisions:
- issue: Maana ya msemo שׁוּב אֶת־שְׁבוּת
  choice: atakurejeshea hali yako njema
  alternative: atarudisha utekwa wako; atawarudisha mateka wako
  rationale: Msemo huu kwa kawaida unaonyesha kubadilishwa kwa hali mbaya na kurejeshwa. ‘Atawarudisha mateka wako’ ingebadili yule anayelengwa na kishazi, ilhali sehemu inayofuata tayari inataja kukusanywa kwa waliotawanywa.
- issue: Nguvu ya וְשָׁב ya pili
  choice: atakukusanya tena
  alternative: atarudi na kukukusanya
  rationale: Kiebrania kinaruhusu ama kitenzi tofauti, ‘atarudi,’ ama maana ya kurejea kwa tendo, ‘tena.’ Tafsiri iliyochaguliwa ni ya asili na haitatui kimya kimya uwezekano mwingine, ambao umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umelenga usomaji wa kawaida wa hadhara bila kupoteza marudio na mvutano wa Kiebrania. Alama za tanbihi zimewekwa baada ya sentensi kwa mpangilio wa marejeo yanayohusika.
