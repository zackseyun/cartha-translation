  text: אֲשֶׁ֨ר אָנֹכִ֣י מְצַוְּ/ךָ֮ הַ/יּוֹם֒ לְ/אַהֲבָ֞ה אֶת יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לָ/לֶ֣כֶת בִּ/דְרָכָ֔י/ו וְ/לִ/שְׁמֹ֛ר מִצְוֺתָ֥י/ו וְ/חֻקֹּתָ֖י/ו וּ/מִשְׁפָּטָ֑י/ו וְ/חָיִ֣יתָ וְ/רָבִ֔יתָ וּ/בֵֽרַכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בָּ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/016.yaml
  text: 'which I am commanding you today: to love Yahweh your God[a], to walk in his ways, and to keep his commandments, his statutes, and his judgments, so that you may live and multiply[d][c][b], and Yahweh your God may bless you in the land that you are entering there to possess it.'
translation:
  language: sw
  text: 'Haya ndiyo ninayokuamuru leo: umpende Yahweh Mungu wako, uende katika njia zake, na uzishike amri zake, sheria zake, na hukumu zake[a]. Ndipo utaishi na kuongezeka[b], naye Yahweh Mungu wako atakubariki katika nchi unayoingia huko[c] ili kuimiliki[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maagizo yake” badala ya “hukumu zake.” Neno מִשְׁפָּטָיו linaweza kumaanisha hukumu, maamuzi ya kisheria, au maagizo.
    reason: lexical_alternative
  - marker: b
    text: Au “ili uishi na kuwa wengi, na Yahweh Mungu wako akubariki.” Mfuatano wa vitenzi vya Kiebrania unaweza kueleweka kama matokeo au ahadi.
    reason: alternative_reading
  - marker: c
    text: Neno la Kiebrania linataja kihalisi “huko.” Kwa Kiswahili laini zaidi inaweza kuwa “katika nchi unayoingia ili kuimiliki.”
    reason: source_transparency
  - marker: d
    text: Au “ili kuirithi.” Kitenzi לְרִשְׁתָּהּ kinaweza kumaanisha kuimiliki au kuirithi, hasa katika muktadha wa ahadi ya nchi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: kwa kuwa leo ninakuamuru
  rationale: אֲשֶׁר hapa inaunganisha mstari huu na kauli iliyotangulia na inaweza kueleza msingi au maudhui yake. “Kwa kuwa” huleta kiungo hicho kwa Kiswahili cha kawaida bila kuacha kishazi tegemezi kisicho na rejea wazi.
- source_word: לְאַהֲבָה אֶת־יְהוָה אֱלֹהֶיךָ
  choice: umpende Yahweh Mungu wako
  rationale: Muundo wa Kiswahili wenye kiima tegemezi baada ya “ninakuamuru” ni wa asili kuliko kutumia mfululizo wa vitenzi-jina. Jina la agano יְהוָה limetoholewa kuwa “Yahweh,” si kubadilishwa na cheo.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: uende katika njia zake
  rationale: Inahifadhi taswira ya Kiebrania ya mwenendo wa maisha kama kwenda katika njia za Mungu, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: מִצְוֹתָיו וְחֻקֹּתָיו וּמִשְׁפָּטָיו
  choice: amri zake, sheria zake na hukumu zake
  rationale: 'Maneno matatu yanatofautishwa kadiri inavyowezekana katika Kiswahili: מִצְוֹת ni amri, חֻקּוֹת ni sheria zilizowekwa, na מִשְׁפָּטִים ni hukumu au maamuzi ya kisheria.'
- source_word: וְחָיִיתָ וְרָבִיתָ
  choice: Ndipo utakapoishi na kuongezeka
  rationale: Mfuatano unaonyesha matokeo au ahadi inayofuata utii. “Kuongezeka” hapa ni kuwa wengi, si lazima kuongezeka kwa mali.
- source_word: בָּאָרֶץ אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: katika nchi unayoingia huko ili kuimiliki
  rationale: Tafsiri inahifadhi kielezi cha mwelekeo שָׁמָּה (“huko”) na kiambishi cha kitu katika לְרִשְׁתָּהּ (“kuimiliki”), ingawa Kiswahili laini zaidi kinaweza kuacha “huko.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la agano, si cheo; kulitoholea kama “Yahweh” huhifadhi tofauti hiyo.
- issue: Uhusiano kati ya utii na kuishi, kuongezeka na kubarikiwa
  choice: 'matokeo au ahadi: “Ndipo utakapoishi ... atakubariki”'
  alternative: 'kusudi au uwezekano: “ili uishi ... na ... akubariki”'
  rationale: Vitenzi vya Kiebrania vinaweza kueleweka kama matokeo/ahadi au katika uhusiano wa kusudi na amri. Maandishi makuu yanatumia matokeo ya ahadi, na tanbihi inadumisha uwezekano mwingine bila kuamua mvutano huo kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Mfuatano wa amri umeunganishwa kwa maumbo “umpende, uende, na kushika”; “huko” limehifadhiwa kwa uwazi wa chanzo licha ya uzito mdogo wa kimtindo.
