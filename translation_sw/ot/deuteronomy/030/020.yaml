base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/020.yaml
  text: by loving Yahweh your God[a], by listening to his voice, and by holding fast to him; for he is your life and the length of your days, that you may dwell on the land that Yahweh swore to your fathers, to Abraham, to Isaac, and to Jacob[c][b], to give to them.
translation:
  language: sw
  text: kwa kumpenda Yahwe Mungu wako, kwa kuisikiliza sauti yake[a], na kwa kushikamana naye[b]; kwa maana yeye ndiye uhai wako na urefu wa siku zako, ili ukae katika nchi ambayo Yahwe aliwaapia baba zako[c]—Abrahamu, Isaka, na Yakobo—kwamba atawapa nchi hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa kuitii sauti yake”; nahau ya Kiebrania “kuisikiliza sauti yake” mara nyingi inajumuisha maana ya kutii.
    reason: lexical_alternative
  - marker: b
    text: Au “na kwa kuambatana naye kwa karibu.”
    reason: lexical_alternative
  - marker: c
    text: Au “mababu zako”; neno la Kiebrania ni “baba zako,” nalo limehifadhiwa kwa sababu Abrahamu, Isaka, na Yakobo wanatajwa mara moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַהֲבָה
  choice: kwa kumpenda
  rationale: Kitenzi-jina chenye לְ kinaendeleza maelezo ya njia ya kuchagua uzima katika mstari uliotangulia; “kwa kumpenda” kinaonyesha njia hiyo kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limehifadhiwa kama jina maalumu badala ya kubadilishwa kuwa cheo.
- source_word: לִשְׁמֹעַ בְּקֹלוֹ
  choice: kwa kuisikiliza sauti yake
  rationale: Nahau halisi ya Kiebrania imehifadhiwa; katika muktadha huu kusikiliza kunajumuisha kutii, jambo linaloelezwa katika tanbihi.
- source_word: וּלְדָבְקָה בוֹ
  choice: na kwa kushikamana naye
  rationale: דבק pamoja na בְּ huonyesha kuambatana kwa karibu na kudumu katika uaminifu; “kushikamana naye” ni ya sasa na yenye kueleweka.
- source_word: כִּי הוּא חַיֶּיךָ
  choice: kwa maana yeye ndiye uhai wako
  rationale: Kiwakilishi הוּא kinaelekezwa kwa Yahwe, mtangulizi wa karibu na mwenye uzito zaidi, huku tamko la moja kwa moja la Kiebrania likihifadhiwa.
- source_word: וְאֹרֶךְ יָמֶיךָ
  choice: na urefu wa siku zako
  rationale: Usemi wa Kiebrania umehifadhiwa kwa ukaribu bila kuufafanua kupita kiasi kuwa chanzo cha maisha marefu au baraka fulani.
- source_word: לָשֶׁבֶת עַל הָאֲדָמָה
  choice: ili ukae katika nchi
  rationale: Kitenzi-jina kinaonyesha kusudi au matokeo; “nchi” linafaa kwa eneo la ahadi kuliko “ardhi,” na “ukae” linaendeleza wazo la makao ya kudumu.
- source_word: לַאֲבֹתֶיךָ
  choice: baba zako
  rationale: Neno la kiume katika chanzo limehifadhiwa, hasa kwa kuwa linafuatwa mara moja na majina ya Abrahamu, Isaka, na Yakobo.
- source_word: לָתֵת לָהֶם
  choice: kwamba atawapa
  rationale: 'Muundo huu unaweka wazi kwa Kiswahili cha kawaida yaliyomo katika kiapo: Yahwe angeipa nchi hiyo kwa wale waliotajwa.'
theological_decisions:
- issue: Mrejelewa wa “yeye” katika “yeye ndiye uhai wako”
  choice: Kiwakilishi kinamrejelea Yahwe mwenyewe.
  alternative: Kiwakilishi kinaweza kueleweka kwa upana kuwa kinarejelea njia iliyotangulia ya utii wa agano.
  rationale: Yahwe ndiye mtangulizi wa karibu na dhahiri zaidi wa kiwakilishi, na sarufi inapendelea mrejelewa huyo; tafsiri haiongezi maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo ni wa heshima, wa sasa, na unaosomeka kwa urahisi. Muundo wa kishairi “uhai wako na urefu wa siku zako” umehifadhiwa ili kutofifisha mvutano wa tamko la Kiebrania.
