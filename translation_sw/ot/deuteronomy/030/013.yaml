base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/013.yaml
  text: And it is not beyond the sea[a], that you should say, ‘Who will cross over to the other side of the sea for us and get it for us and make us hear it[c][b], so that we may do it?’
translation:
  language: sw
  text: Wala amri hiyo haiko ng’ambo ya bahari[a], hata ukasema, “Ni nani atakayevuka kwa ajili yetu kwenda upande wa pili wa bahari, akailete amri hiyo kwetu[b] na kutufanya tuisikie[c], ili tuitende?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upande wa pili wa bahari.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa msingi ni “aichukue kwa ajili yetu”; katika muktadha maana yake ni kuipata na kuileta kwetu.
    reason: lexical_alternative
  - marker: c
    text: Kwa neno halisi, “atufanye tuisikie”; huu ni muundo wa kisababishi unaoweza kumaanisha kututangazia au kutueleza.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֵבֶר לַיָּם
  choice: ng’ambo ya bahari
  rationale: Kirai hiki kinaonyesha mahali upande wa pili wa bahari. “Ng’ambo ya bahari” ni usemi wa kawaida wa Kiswahili unaodumisha picha ya mahali.
- source_word: הִוא
  choice: haiko
  rationale: Kiwakilishi cha kike katika Kiebrania kinarejelea amri iliyotajwa katika muktadha. Kiswahili hutumia upatanisho unaolingana na nomino inayodokezwa; “haiko” hudumisha rejeo hilo bila kurudia nomino.
- source_word: לֵאמֹר
  choice: hata useme
  rationale: Hapa neno hili linaanzisha pingamizi la kudhaniwa. “Hata useme” ni muundo wa kawaida unaoendeleza maana ya jambo kutokuwa mbali kiasi cha kuhitaji swali hilo.
- source_word: יַעֲבָר לָנוּ
  choice: atakayevuka kwa ajili yetu
  rationale: Muundo huu unadumisha tendo la kuvuka na pia wazo kwamba mtu huyo angefanya hivyo kwa niaba ya watu.
- source_word: אֶל עֵבֶר הַיָּם
  choice: kwenda upande wa pili wa bahari
  rationale: Tafsiri hii inaonyesha wazi mahali panapolengwa na tendo la kuvuka, kama ilivyo katika Kiebrania.
- source_word: וְיִקָּחֶהָ לָּנוּ
  choice: akatuletee
  rationale: Kitenzi cha Kiebrania kwa msingi ni “chukua,” lakini katika muktadha kinamaanisha kukipata kile kilicho mbali na kukileta kwa watu. “Akatuletee” huwasilisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  choice: na kutusikizisha
  rationale: Huu ni muundo wa kisababishi wa kitenzi “kusikia.” “Kutusikizisha” hudumisha wazo la kusababisha watu wasikie, bila kulifasiri moja kwa moja kuwa kutangaza au kueleza.
- source_word: וְנַעֲשֶׂנָּה
  choice: ili tuitende
  rationale: '“Ili” huonyesha wazi kusudi linalofuata kusikia: watu waisikie ndipo waitende.'
