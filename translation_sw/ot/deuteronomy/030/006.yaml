source:
  edition: WLC
  text: וּ/מָ֨ל יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֶת לְבָבְ/ךָ֖ וְ/אֶת לְבַ֣ב זַרְעֶ֑/ךָ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ בְּ/כָל לְבָבְ/ךָ֥ וּ/בְ/כָל נַפְשְׁ/ךָ֖ לְמַ֥עַן חַיֶּֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/006.yaml
  text: And Yahweh your God will circumcise your heart and the heart of your offspring[a], so that you may love Yahweh your God with all your heart and with all your soul[c][b], so that you may live.
translation:
  language: sw
  text: Yahwe, Mungu wako, atautahiri moyo wako[b] na moyo wa uzao wako[a], ili umpende Yahwe, Mungu wako, kwa moyo wako wote na kwa nafsi yako yote[c], ili upate kuishi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “moyo wa wazao wako.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “atautahiri moyo wako”—sitiari ya mabadiliko ya ndani na uaminifu wa agano.
    reason: cultural_note
  - marker: c
    text: Au, “kwa uhai wako wote” au “kwa utu wako wote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָל
  choice: atautahiri
  rationale: Kitenzi מול humaanisha kutahiri. Ingawa hapa moyo ndio unaotahiriwa na hivyo ni sitiari, taswira ya agano imehifadhiwa badala ya kufafanuliwa kwa maneno kama ‘atabadilisha.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa ‘Yahwe’ badala ya kubadilishwa na cheo kama ‘BWANA.’
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huu ni muundo wa kawaida wenye kiambishi cha nafsi ya pili umoja, katika muktadha wa agano.
- source_word: לְבָבְךָ
  choice: moyo wako
  rationale: לֵבָב humaanisha utu wa ndani, hasa nia na mapenzi. ‘Moyo’ ni sawia ya kawaida na pana katika Kiswahili.
- source_word: לְבַב זַרְעֶךָ
  choice: moyo wa uzao wako
  rationale: זֶרַע inaweza kumaanisha mbegu, uzao, au wazao. ‘Uzao wako’ huhifadhi umoja wa mkusanyiko na ni Kiswahili cha kawaida.
- source_word: לְאַהֲבָה
  choice: ili umpende
  rationale: Kihusishi ל pamoja na kitenzi-jina kinaonyesha kusudi au matokeo hapa; ‘ili umpende’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: בְּכָל לְבָבְךָ
  choice: kwa moyo wako wote
  rationale: Usemi huu unaonyesha kujitoa kikamilifu kwa Mungu na unatafsirika kwa kawaida katika Kiswahili.
- source_word: וּבְכָל נַפְשְׁךָ
  choice: na kwa nafsi yako yote
  rationale: נֶפֶשׁ inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. ‘Nafsi’ huhifadhi usemi wa agano bila kulazimisha maana finyu; maana mbadala imeonyeshwa katika tanbihi.
- source_word: לְמַעַן חַיֶּיךָ
  choice: upate kuishi
  rationale: לְמַעַן huonyesha kusudi au matokeo. ‘Upate kuishi’ ni usemi wa asili wa Kiswahili unaohifadhi nguvu hiyo.
theological_decisions:
- issue: Sitiari ya agano ya kutahiriwa kwa moyo
  choice: Sitiari ‘atautahiri moyo wako’ imehifadhiwa katika matini kuu.
  alternative: atabadilisha moyo wako; atautakasa moyo wako
  rationale: Matini hutumia ishara ya agano kueleza tendo la Mungu ndani ya mtu. Kuhifadhi sitiari hudumisha uhusiano huo bila kuingiza ufafanuzi wa kimadhehebu au mfumo wa baadaye wa mafundisho.
- issue: Maana ya נֶפֶשׁ katika agizo la kumpenda Mungu
  choice: נֶפֶשׁ imetafsiriwa ‘nafsi’ katika matini kuu.
  alternative: uhai; utu wote
  rationale: Neno hili linaweza kumaanisha mtu mzima aliye hai. ‘Nafsi’ huhifadhi kauli iliyozoeleka ya moyo na nafsi, huku tanbihi ikionyesha upana wa maana bila kufafanua isivyofaa mtazamo fulani kuhusu asili ya mwanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa Kiebrania umefuatwa kwa kiasi kinachowezekana bila kufanya sentensi kuwa ngumu; jina ‘Yahwe’ na sitiari ya kutahiri moyo zimehifadhiwa.
