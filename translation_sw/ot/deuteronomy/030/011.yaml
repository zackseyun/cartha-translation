base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/011.yaml
  text: For this commandment that I am commanding you today is not too difficult for you[a], nor is it far away.
translation:
  language: sw
  text: Kwa maana amri hii ninayokuamuru leo si ngumu mno kwako[a], wala haiko mbali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “haiko nje ya uwezo wako,” au “haijafichwa kwako.” Kitenzi cha Kiebrania kinaweza kumaanisha jambo la ajabu, lisilofikika, au lililo nje ya ufahamu au uwezo wa mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza msingi wa himizo lililotangulia na kinaendeleza mtiririko wa hoja kwa Kiswahili cha kawaida.
- source_word: הַמִּצְוָה הַזֹּאת
  choice: amri hii
  rationale: מִצְוָה ni amri yenye uzito wa agano na sheria; “amri hii” ni ya asili na yenye hadhi katika Kiswahili.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ninayokuamuru leo
  rationale: Muundo huu unadumisha hali ya Musa kutoa amri moja kwa moja siku hiyo bila kufanya sentensi kuwa nzito.
- source_word: לֹא נִפְלֵאת הִוא מִמְּךָ
  choice: si ngumu mno kwako
  rationale: Katika muktadha wa mistari 12–14, kitenzi פלא kinaonyesha jambo lisilofikika au lililo nje ya uwezo wa mtu kulielewa na kulitekeleza. “Si ngumu mno kwako” huwasilisha ufikikaji huo huku tanbihi ikihifadhi maana nyingine halali.
- source_word: וְלֹא רְחֹקָה הִוא
  choice: wala haiko mbali
  rationale: רָחוֹק huonyesha umbali wa mahali au wa kimfano; usemi huu unahifadhi taswira ya kitu kinachoweza kufikiwa, ambayo inaendelezwa katika mistari inayofuata.
theological_decisions:
- issue: Maana ya נִפְלֵאת kuhusu uwezo wa mwanadamu na utii wa agano
  choice: si ngumu mno kwako
  alternative: haiko nje ya uwezo wako; haijafichika kwako
  rationale: Tafsiri inasisitiza kwamba amri haipatikani kwa shida wala haiko mbali katika muktadha wa agano. Haisemi kwa upana kwamba wanadamu wana uwezo wa kimaadili bila msaada wa Mungu, wala haiingizi fundisho la kutokuwa na uwezo; mvutano wa kiteolojia wa andiko unabaki wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. “Amri” huhifadhi uzito wa kisheria na wa agano; “wala haiko mbali” huhifadhi sitiari ya umbali.
