  text: וֶ/הֱבִֽיאֲ/ךָ֞ יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֶל הָ/אָ֛רֶץ אֲשֶׁר יָרְשׁ֥וּ אֲבֹתֶ֖י/ךָ וִֽ/ירִשְׁתָּ֑/הּ וְ/הֵיטִֽבְ/ךָ֥ וְ/הִרְבְּ/ךָ֖ מֵ/אֲבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/005.yaml
  text: And Yahweh your God will bring you into the land that your fathers possessed[a], and you will possess it[b]; and he will prosper you and multiply you more than your fathers.
translation:
  language: sw
  text: Yahwe Mungu wako atakuleta katika nchi ambayo baba zako waliimiliki[a], nawe utaimiliki; atakutendea mema[b] na kukuzidisha kuliko baba zako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambayo baba zako waliirithi” au “ambayo baba zako waliyoitwaa kuwa milki yao.” Kitenzi cha Kiebrania kinaweza kuhusisha kurithi na pia kutwaa au kumiliki.
    reason: lexical_alternative
  - marker: b
    text: 'Au, “atakufanikisha.” Kwa neno halisi zaidi: “atakutendea yaliyo mema.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱבִיאֲךָ
  choice: atakuleta
  rationale: Hifili ya בוא pamoja na kiambishi cha nafsi ya pili umoja ina maana ya ‘atakufanya uingie/atakuleta.’ Neno ‘tena’ halijaongezwa kwa kuwa halimo wazi katika kitenzi hiki, ingawa kurejea kunaeleweka katika muktadha.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu, YHWH, limetoholewa kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Muundo huu wenye kiambishi cha nafsi ya pili umoja unamaanisha moja kwa moja ‘Mungu wako.’
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha wa Kumbukumbu la Torati, neno hili linarejelea nchi ya ahadi; ‘nchi’ ni ya kawaida na huhifadhi maana ya eneo.
- source_word: אֲשֶׁר יָרְשׁוּ אֲבֹתֶיךָ
  choice: ambayo baba zako waliimiliki
  rationale: ירשׁ inaweza kumaanisha kurithi, kumiliki, au kutwaa milki. Hapa inaeleza nchi iliyokuwa milki ya baba zao; ‘waliimiliki’ ni wazi na huhifadhi uhusiano wa kitenzi na kishazi kinachofuata.
- source_word: וִירִשְׁתָּהּ
  choice: nawe utaimiliki
  rationale: ירשׁ ikiwa na nchi kama yambwa hapa ina maana ya kuimiliki au kuitwaa iwe milki. ‘Utaimiliki’ ni fupi, ya asili, na hurudia mzizi wa maana wa kishazi kilichotangulia.
- source_word: וְהֵיטִבְךָ
  choice: atakutendea mema
  rationale: Hifili ya יטב pamoja na kiambishi cha yambwa ina maana ya kumtendea mtu mema. Tafsiri hii ni ya moja kwa moja bila kuibana maana iwe mafanikio ya mali pekee.
- source_word: וְהִרְבְּךָ
  choice: na kukuzidisha
  rationale: Hifili ya רבה ina maana ya kufanya kuwa wengi au kuongeza. ‘Kukuzidisha’ huhifadhi usemi wa baraka ya kuongezeka bila kuongeza nomino isiyomo katika chanzo.
- source_word: מֵאֲבֹתֶיךָ
  choice: kuliko baba zako
  rationale: מן hapa ni ya ulinganisho na inaonyesha kuzidi kwa idadi. ‘Kuliko baba zako’ pia huhifadhi nomino ya ukoo yenye jinsia ya kiume iliyo katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia moja kwa moja Tetragramatoni, jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Neno la ukoo אֲבֹתֶיךָ
  choice: baba zako
  alternative: mababu zako
  rationale: Kiebrania kinasema kwa wazi ‘baba zako.’ Chaguo hili huhifadhi umbo la kiume na pia mwangwi wa vizazi vya kwanza vya Israeli; ‘mababu zako’ ni tafsiri ya kimuktadha inayowezekana.
- issue: Maana ya baraka katika וְהֵיטִבְךָ
  choice: atakutendea mema
  alternative: atakufanikisha
  rationale: Kitenzi kina maana pana ya kumtendea mtu mema. Chaguo hili huepuka kuifasiri baraka kuwa mafanikio ya kiuchumi pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Nafsi ya pili umoja ‘wewe’ imehifadhiwa kwa sababu Kiebrania humwambia Israeli kama jumuiya moja. Alama zote za tanbihi zimewekwa mahali zinapohusu katika matini.
