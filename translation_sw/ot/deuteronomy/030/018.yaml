base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/018.yaml
  text: I declare to you today that you will surely perish[c][b][a]; you will not prolong your days on the land that you are crossing the Jordan to enter there and possess it.
translation:
  language: sw
  text: Ninawatangazia leo kwamba hakika mtaangamia[a]; hamtaishi kwa muda mrefu[b] katika nchi ambayo unavuka Yordani ili kuingia humo na kuimiliki.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa Kiebrania, usemi huu hurudia mzizi wa “kuangamia” ili kusisitiza: “hakika mtaangamia.”'
    reason: lexical_alternative
  - marker: b
    text: Kwa maneno halisi, “hamtazifanya siku ziwe ndefu”; yaani, hamtaishi kwa muda mrefu katika nchi hiyo.
    reason: lexical_alternative
  - marker: c
    text: Katika sehemu ya kwanza ya mstari, Kiebrania kinawaambia Waisraeli kwa wingi; hapa kinatumia “wewe” wa umoja na kulisema taifa kama watu mmoja.
    reason: cultural_note
lexical_decisions:
- source_word: הִגַּדְתִּי לָכֶם הַיּוֹם
  choice: Ninawatangazia leo
  rationale: Kitenzi cha Kiebrania katika Hiphil kina maana ya kujulisha au kutangaza. “Ninawatangazia” kinadumisha uzito rasmi wa onyo, huku kiambishi -wa- kikionyesha kwamba Musa anawaambia watu wengi.
- source_word: אָבֹד תֹּאבֵדוּן
  choice: hakika mtaangamia
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichonyambuliwa unasisitiza uhakika wa maangamizi. “Hakika” huwasilisha msisitizo huo kwa Kiswahili cha kawaida bila kurudia kitenzi kwa namna isiyo ya asili.
- source_word: לֹא תַאֲרִיכֻן יָמִים
  choice: hamtaishi kwa muda mrefu
  rationale: Nahau ya Kiebrania ina maana halisi ya kutofanya siku ziwe ndefu. Tafsiri hii inatoa maana yake kwa Kiswahili cha sasa na kinachoeleweka; tanbihi inadumisha picha ya maneno ya asili.
- source_word: עַל הָאֲדָמָה
  choice: katika nchi
  rationale: Katika muktadha huu אֲדָמָה ni eneo la nchi ya ahadi, si udongo tu. Kiswahili hutumia “katika nchi” kwa ukaaji ndani ya eneo hilo.
- source_word: אֲשֶׁר אַתָּה עֹבֵר אֶת הַיַּרְדֵּן
  choice: ambayo unavuka Yordani
  rationale: Neno “unavuka” linadumisha umoja wa nafsi ya pili ambao Kiebrania hutumia kumsemesha Israeli kama taifa moja, baada ya maumbo ya wingi katika sehemu ya kwanza ya mstari.
- source_word: לָבֹא שָׁמָּה לְרִשְׁתָּהּ
  choice: ili kuingia humo na kuimiliki
  rationale: “Humo” linawakilisha wazi שָׁמָּה, na “kuimiliki” linawakilisha kitenzi ירש pamoja na kiambishi chake cha kitu cha kike, yaani nchi.
theological_decisions:
- issue: Israeli kusemeshwa kwa wingi kisha kwa umoja
  choice: Kudumisha wingi katika “mtaangamia/hamtaishi” na umoja katika “unavuka”
  alternative: 'Kutumia wingi katika mstari wote: “mnavuka”'
  rationale: Kiebrania hubadili kutoka maumbo ya wingi kwenda umoja, kikilitazama taifa la Israeli kama watu wengi na pia kama jumuiya moja ya agano. Kudumisha badiliko hilo kunahifadhi usemi wa chanzo bila kulifafanua kupita kiasi.
- issue: Maana ya הָאֲדָמָה katika onyo la agano
  choice: nchi
  alternative: ardhi au udongo
  rationale: Muktadha unataja eneo lililo ng’ambo ya Yordani ambalo Israeli itaingia na kulimiliki; kwa hiyo “nchi” huonyesha rejeo la eneo hilo la ahadi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Ninawatangazia” huleta uzito wa onyo la agano; “hakika mtaangamia” na “hamtaishi kwa muda mrefu” ni miundo ya sasa na ya asili. Badiliko la wingi kwenda umoja limehifadhiwa kwa makusudi na kufafanuliwa katika tanbihi.
