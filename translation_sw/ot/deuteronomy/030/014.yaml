  text: כִּֽי קָר֥וֹב אֵלֶ֛י/ךָ הַ/דָּבָ֖ר מְאֹ֑ד בְּ/פִ֥י/ךָ וּ/בִֽ/לְבָבְ/ךָ֖ לַ/עֲשֹׂתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/014.yaml
  text: For the word is very near you[a], in your mouth and in your heart, so that you may do it.
translation:
  language: sw
  text: Kwa maana neno[a] liko karibu nawe sana, kinywani mwako na moyoni mwako, ili ulitende.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jambo” au “amri.” Neno la Kiebrania דָּבָר linaweza kumaanisha neno, jambo, au amri kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza msingi wa kauli iliyotangulia; “kwa maana” kinaonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: קָרוֹב אֵלֶיךָ
  choice: liko karibu nawe
  rationale: Kauli hii inadumisha maana ya ukaribu, huku upatanisho wa “liko” ukifuata nomino “neno” kwa Kiswahili asilia.
- source_word: הַדָּבָר
  choice: neno
  rationale: דָּבָר inaweza kumaanisha neno, jambo, au amri. “Neno” linahifadhi upana wa neno la Kiebrania bila kulifasiri kwa maana finyu kuliko inavyohitajika.
- source_word: מְאֹד
  choice: sana
  rationale: “Sana” linaonyesha kiwango kikubwa cha ukaribu kwa lugha ya kawaida na iliyo wazi.
- source_word: בְּפִיךָ
  choice: kinywani mwako
  rationale: Tafsiri hii inahifadhi taswira halisi ya kinywa na uhusiano wake na kusema au kutamka.
- source_word: וּבִלְבָבְךָ
  choice: na moyoni mwako
  rationale: “Moyo” huhifadhi taswira ya Kiebrania ya utu wa ndani, unaohusisha fikra na nia, pamoja na ulinganifu wa kinywa na moyo.
- source_word: לַעֲשֹׂתוֹ
  choice: ili ulitende
  rationale: 'Muundo huu unaonyesha kusudi au matokeo: ukaribu wa neno unamwezesha msikilizaji kulitekeleza. Kiwakilishi “li” kinarejelea “neno” kwa upatanisho wa Kiswahili.'
theological_decisions:
- issue: Kirejeleo cha “neno”
  choice: Neno pana “neno” limetumiwa bila kulifanya moja kwa moja kuwa “amri.”
  alternative: “amri” au “jambo”
  rationale: Muktadha unahusu amri ya Mungu, lakini דָּבָר lenyewe lina maana pana. Tafsiri inadumisha upana huo na haitatui kimya kimya uwezekano wa maana tofauti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira za “kinywa” na “moyo” zimehifadhiwa, na sentensi imeundwa kwa mtiririko wa kawaida wa Kiswahili.
