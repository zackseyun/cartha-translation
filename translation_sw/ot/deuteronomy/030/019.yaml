  text: הַעִידֹ֨תִי בָ/כֶ֣ם הַ/יּוֹם֮ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָרֶץ֒ הַ/חַיִּ֤ים וְ/הַ/מָּ֨וֶת֙ נָתַ֣תִּי לְ/פָנֶ֔י/ךָ הַ/בְּרָכָ֖ה וְ/הַ/קְּלָלָ֑ה וּ/בָֽחַרְתָּ֙ בַּֽ/חַיִּ֔ים לְמַ֥עַן תִּחְיֶ֖ה אַתָּ֥ה וְ/זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/019.yaml
  text: 'I call heaven and earth to witness against you today: I have set before you life and death[a], blessing and curse. Choose life, so that you and your offspring may live[c][b],'
translation:
  language: sw
  text: 'Ninaziita mbingu na dunia kuwa mashahidi dhidi yako leo: nimeweka mbele yako uzima na mauti, baraka na laana. Na uchague uzima, ili wewe na wazao wako muishi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  choice: ninaziita ... kuwa mashahidi dhidi yako
  rationale: 'Hifili ya עוּד pamoja na בָכֶם ina maana ya kisheria na ya agano: kuwaita mashahidi dhidi ya mhusika. Kauli hii inadumisha uzito wa kimahakama kuliko tafsiri ya jumla kama ‘ninakuonya.’'
- source_word: הַיּוֹם
  choice: Leo
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya Kiswahili, huku ikihifadhi msisitizo wa wakati.
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: mbingu na dunia
  rationale: Ni jozi ya kawaida inayowakilisha uumbaji wote na pia fomula ya mashahidi wa agano. ‘Mbingu na dunia’ ni Kiswahili sanifu na cha asili.
- source_word: הַחַיִּים וְהַמָּוֶת
  choice: uzima na mauti
  rationale: Jozi hii inahifadhi tofauti ya matokeo ya agano. ‘Uzima’ na ‘mauti’ zina hadhi inayofaa kwa lugha ya kibiblia bila kuwa ngumu kueleweka.
- source_word: נָתַתִּי לְפָנֶיךָ
  choice: Nimeweka mbele yako
  rationale: Katika muktadha huu נָתַן + לִפְנֵי humaanisha kuweka au kuwasilisha chaguo mbele ya mtu; kauli ya Kiswahili ni sahihi na ya kawaida.
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: baraka na laana
  rationale: Tafsiri ya moja kwa moja inayohifadhi umoja na tofauti ya kiagano kati ya baraka na laana.
- source_word: וּבָחַרְתָּ בַּחַיִּים
  choice: Basi chagua uzima
  rationale: Kiunganishi ו kinaunganisha amri na chaguo zilizowekwa kabla yake. ‘Basi’ huonyesha mwendelezo wa kimantiki kwa Kiswahili bila kuongeza ‘kwa hiyo’ yenye nguvu zaidi kuliko chanzo.
- source_word: לְמַעַן תִּחְיֶה
  choice: ili ... mpate kuishi
  rationale: ‘Ili’ huhifadhi maana ya kusudi au matokeo. Kitenzi kimewekwa katika wingi kwa sababu kiima chake kilicho wazi ni ‘wewe na wazao wako.’
- source_word: אַתָּה וְזַרְעֶךָ
  choice: wewe na wazao wako
  rationale: זֶרַע hapa humaanisha uzao au vizazi. ‘Wazao wako’ ni ya kawaida, wazi, na huhifadhi mwendelezo wa kifamilia na wa agano.
theological_decisions:
- issue: Muktadha wa mashahidi wa agano na lugha ya kisheria
  choice: Kuita mbingu na dunia kuwa mashahidi dhidi ya mhusika
  alternative: Kushuhudia kwa mbingu na dunia au kutoa onyo la jumla
  rationale: Kiebrania kinaweka mbingu na dunia katika nafasi ya mashahidi ndani ya mazingira ya agano. Tafsiri hii inadumisha uzito huo bila kuingiza mafundisho ya baadaye.
- issue: Nafsi ya pili umoja inayowakilisha Israeli
  choice: dhidi yako / mbele yako, kisha ‘wewe na wazao wako’
  alternative: dhidi yenu / mbele yenu au kutaja Israeli moja kwa moja
  rationale: Chanzo kinatumia nafsi ya pili umoja wa kiume kumwelekea mshirika wa agano kwa namna ya uwakilishi. Kiswahili kinaweza kuhifadhi umoja huo; wingi katika ‘mpate kuishi’ unatokana kisarufi na kiima ambatano ‘wewe na wazao wako.’
- issue: Uhusiano kati ya uchaguzi na kuishi
  choice: ili wewe na wazao wako mpate kuishi
  alternative: na ndipo wewe na wazao wako mtaishi
  rationale: לְמַעַן inaweza kuonyesha kusudi au matokeo. ‘Ili ... mpate’ huhifadhi nafasi hiyo bila kuamua kupita kiasi kuhusu uhusiano wa kitheolojia kati ya amri na matokeo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kifungu cha agano lakini kinachoeleweka kwa msomaji wa kawaida. ‘Mauti’ imetumiwa sambamba na ‘uzima’ ili kudumisha uzito na uwiano wa jozi hiyo; ‘Basi’ ni kiunganishi cha asili kisichoongeza hitimisho kali kupita ו ya Kiebrania.
