base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/008.yaml
  text: And you shall return and obey the voice of Yahweh[b][a], and you shall do all his commandments that I am commanding you today.
translation:
  language: sw
  text: Nawe utarudi[a] na kusikiliza sauti ya Yahwe[b], na utazifanya amri zake zote ninazokuamuru leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utageuka”; katika muktadha huu neno hilo linaweza pia kumaanisha kurudi katika uhusiano wa agano kwa toba na uaminifu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “kusikiliza sauti ya Yahwe”; nahau hii mara nyingi humaanisha kumtii.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָשׁוּב
  choice: utarudi
  rationale: Kitenzi שׁוּב humaanisha kurudi au kugeuka. “Utarudi” kinahifadhi uwezekano wa kurejea kimwili na pia wa kumrudia Mungu katika agano bila kulazimisha maana moja tu.
- source_word: וְשָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: kuisikiliza sauti ya Yahwe
  rationale: Hii inafuata kwa uwazi nahau ya Kiebrania “kusikiliza sauti ya.” Katika muktadha nahau hiyo inahusisha kutii, lakini kifungu kinachofuata tayari kinaeleza kutenda amri.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: וְעָשִׂיתָ
  choice: utazifanya
  rationale: עָשָׂה ni “kufanya”; umbo hili la Kiswahili ni la kawaida linapotaja kutekeleza amri na linabaki karibu na neno la chanzo.
- source_word: כָּל מִצְוֺתָיו
  choice: amri zake zote
  rationale: “Amri” ni neno la kawaida na lenye hadhi linalofaa muktadha wa sheria na agano; kiambishi cha nafsi ya tatu kimetafsiriwa “zake.”
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ninazokuamuru leo
  rationale: Muundo huu unaonyesha tendo la Musa la kuamuru linalofanyika sasa na unahifadhi msisitizo wa Kumbukumbu la Torati juu ya “leo.”
- source_word: וְאַתָּה
  choice: Nawe
  rationale: “Nawe” kinahifadhi kiunganishi pamoja na msisitizo wa kiwakilishi cha nafsi ya pili kilichotamkwa wazi.
theological_decisions:
- issue: Iwapo שׁוּב itafsiriwe moja kwa moja kuwa kutubu
  choice: utarudi
  alternative: utatubu; utageuka na kurudi
  rationale: Muktadha unaruhusu maana ya kurudi kwa agano na hivyo toba, lakini neno la Kiebrania halilazimishi maana ya toba peke yake. “Utarudi” linahifadhi mvutano huo wa kimaana.
- issue: Iwapo שׁמע בְּקוֹל itafsiriwe “kumtii” au kwa uwazi zaidi kama ilivyo katika Kiebrania
  choice: kuisikiliza sauti ya Yahwe
  alternative: kumtii Yahwe
  rationale: Nahau hii mara nyingi hudokeza utii, lakini sehemu inayofuata inaongeza wazi kutenda amri. Tafsiri iliyochaguliwa inahifadhi taswira ya Kiebrania bila kuondoa maana ya utii, ambayo imeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye hadhi. Marudio ya “nawe” yanadumisha msisitizo na mpangilio wa vifungu vya Kiebrania; “kuisikiliza sauti” limehifadhiwa licha ya kwamba “kumtii” lingekuwa fupi zaidi, kwa kuwa linatunza taswira na tofauti ya vifungu vya chanzo.
