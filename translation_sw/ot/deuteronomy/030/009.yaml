    rationale: לְטוֹבָה na לְטוֹב husema “kwa mema/ kwa ajili ya mema” bila kiwakilishi cha “yako.” Kuongeza “yako” hupunguza uwazi wa tafsiri na huongeza kipengele kisicho wazi katika matini ya chanzo.
  - severity: medium
    issue: “Uzao wa mifugo yako”
    rationale: בִּפְרִי בְהֶמְתֶּךָ hurejelea mazao au ongezeko la mifugo. “Uzao wa mifugo” unasikika si wa kawaida katika Kiswahili; “ongezeko la mifugo yako” hutoa maana hiyo kwa kawaida.
  - severity: low
    issue: Uandishi wa jina la Mungu hautangamani na mkondo wa POB
    rationale: Audit trail ya POB huchagua “Yahweh.” Kutumia tahajia hiyo katika Kiswahili hudumisha uthabiti wa jina lililonakiliwa.
  - severity: low
    issue: “Babu zako” inaweza kuwa pana au isiyo bayana
    rationale: “Mababu zako” huelekeza kwa wazi zaidi kwa mababa wa kale/forefathers wanaokusudiwa na אֲבֹתֶיךָ; tanbihi ihifadhi neno halisi la Kiebrania.
