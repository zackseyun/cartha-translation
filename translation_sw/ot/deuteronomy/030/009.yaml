  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הוֹתִֽירְ/ךָ֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בְּ/כֹ֣ל מַעֲשֵׂ֣ה יָדֶ֗/ךָ בִּ/פְרִ֨י בִטְנְ/ךָ֜ וּ/בִ/פְרִ֧י בְהֶמְתְּ/ךָ֛ וּ/בִ/פְרִ֥י אַדְמָתְ/ךָ֖ לְ/טוֹבָ֑ה כִּ֣י יָשׁ֣וּב יְהוָ֗ה לָ/שׂ֤וּשׂ עָלֶ֨י/ךָ֙ לְ/ט֔וֹב כַּ/אֲשֶׁר שָׂ֖שׂ עַל אֲבֹתֶֽי/ךָ׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/009.yaml
  text: And Yahweh your God will make you abound in all the work of your hand[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground, for good; for Yahweh will again rejoice over you for good[b], just as he rejoiced over your fathers.
translation:
  language: sw
  text: Yahweh Mungu wako atakufanya ufanikiwe sana katika kila kazi ya mikono yako[a], katika uzao wa tumbo lako, katika ongezeko la mifugo yako, na katika mazao ya ardhi yako, kwa mema. Kwa maana Yahweh atafurahi tena juu yako kwa mema, kama alivyofurahi juu ya mababu zako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakupa wingi” au “atakustawisha”; kitenzi cha Kiebrania kina maana ya kusababisha wingi au ziada.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “baba zako”; hapa inarejelea mababu au watu wa vizazi vilivyotangulia vya Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתִירְךָ
  choice: atakufanikisha sana
  rationale: Hifili ya יתר inaonyesha kusababisha mtu awe na wingi au ziada. Kauli hii ni ya kawaida katika Kiswahili na inadumisha wazo la ufanisi mwingi linalofafanuliwa na orodha inayofuata.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa kulinakili kama jina binafsi, badala ya kulibadilisha kuwa cheo.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: katika kila kazi ya mikono yako
  rationale: Hii inadumisha taswira halisi ya Kiebrania huku ikitoa maana ya kazi zote au shughuli zote za mtu kwa Kiswahili cha kawaida.
- source_word: בִּפְרִי בִטְנְךָ
  choice: katika uzao wa tumbo lako
  rationale: Kirai hiki cha Kiebrania kinamaanisha watoto au wazao. 'Uzao wa tumbo lako' ni cha kueleweka na bado kinahifadhi taswira ya kimwili ya chanzo.
- source_word: בְהֶמְתְּךָ
  choice: mifugo yako
  rationale: Neno hili linahusu kwa upana wanyama wanaofugwa, si ng'ombe peke yao.
- source_word: אַדְמָתְךָ
  choice: ardhi yako
  rationale: Katika muktadha huu ni udongo au ardhi inayotoa mazao; 'ardhi' ni neno la kawaida na linalofaa katika mazingira ya kilimo.
- source_word: לְטוֹבָה / לְטוֹב
  choice: kwa mema yako
  rationale: Virai hivi vinaonyesha matokeo yenye manufaa. Kiwakilishi 'yako' kinafanya maana iliyo katika muktadha iwe wazi kwa Kiswahili bila kuibadili.
- source_word: יָשׁוּב ... לָשׂוּשׂ
  choice: atafurahi tena
  rationale: Kitenzi 'kurudi' pamoja na kitenzi-jina hapa kinaonyesha tendo linaloanza kufanywa tena; 'atafurahi tena' ni tafsiri ya kawaida ya muundo huo.
- source_word: לָשׂוּשׂ עָלֶיךָ
  choice: atafurahi ... juu yako
  rationale: Hifadhi muundo na taswira ya Kiebrania ya Mungu kumfurahia mtu, bila kuigeuza kimya kimya kuwa tendo tofauti.
- source_word: אֲבֹתֶיךָ
  choice: babu zako
  rationale: Neno hili la kiume linarejelea mababa wa kale au vizazi vilivyotangulia vya Israeli. 'Babu zako' ni la kawaida na lenye uzito katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina binafsi la agano. 'Yahwe' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya אֲבֹתֶיךָ
  choice: babu zako
  alternative: mababu zako au wazee wako wa kale
  rationale: Kiebrania ni cha kiume na kinaweza kuwakumbusha wasomaji mababa wa ukoo pamoja na vizazi vya kale; matini kuu inadumisha marejeo hayo, na tanbihi inaeleza upana wake.
- issue: Kirai cha kusudi לְטוֹבָה / לְטוֹב
  choice: kwa mema yako
  alternative: kwa ajili ya ustawi au kuwa baraka
  rationale: Tafsiri hii inadumisha wazo pana la matokeo yenye manufaa bila kulifungia katika mafanikio ya mali pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa baraka za kilimo na urudiaji wa 'kwa mema yako' umehifadhiwa kwa sababu unatokana na urudiaji halisi wa chanzo. Alama zote za tanbihi zimewekwa mahali panapohusika katika matini kuu.
