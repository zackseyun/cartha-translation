base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/004.yaml
  text: If your outcasts are at the end of the heavens[a], from there Yahweh your God will gather you[c][b], and from there he will take you.
translation:
  language: sw
  text: Ikiwa watu wako waliofukuzwa[a] wako katika mwisho wa mbingu[b], kutoka huko Yahwe, Mungu wako, atakukusanya, na kutoka huko atakuchukua[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waliotawanywa” au “walioondolewa.” Kiebrania kinamaanisha watu waliofukuzwa, walioondolewa, au waliotawanywa.
    reason: lexical_alternative
  - marker: b
    text: “Mwisho wa mbingu” ni nahau ya Kiebrania inayomaanisha mahali pa mbali kabisa.
    reason: cultural_note
  - marker: c
    text: Au “atakuleta.” Kitenzi cha Kiebrania, kwa maana ya moja kwa moja zaidi, ni “atakuchukua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Ikiwa
  rationale: Hutanguliza sharti moja kwa moja. Ingawa “hata kama” inawezekana kimuktadha, msisitizo huo haujaelezwa wazi katika Kiebrania.
- source_word: יִהְיֶה נִדַּחֲךָ
  choice: watu wako waliofukuzwa wako
  rationale: Neno linalotokana na נדח humaanisha walioondolewa mahali pao, kufukuzwa, au kutawanywa. Usemi wa Kiswahili unaonyesha maana ya pamoja iliyo katika mtajo wa Israeli kama nafsi moja.
- source_word: בִּקְצֵה הַשָּׁמָיִם
  choice: kwenye mwisho wa mbingu
  rationale: Tafsiri hii huhifadhi taswira ya Kiebrania; ni nahau inayomaanisha mahali pa mbali kabisa.
- source_word: מִשָּׁם
  choice: kutoka huko
  rationale: Kirai hiki kimetafsiriwa vivyo hivyo mara zote mbili ili kuhifadhi urudiaji na msisitizo wa Kiebrania.
- source_word: יְקַבֶּצְךָ
  choice: atakukusanya
  rationale: Kitenzi קבץ humaanisha kukusanya. Tafsiri haiongezi wazo la “kurudisha,” ambalo linaeleweka katika muktadha lakini halimo wazi katika kitenzi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa kwa mwandiko wa kawaida wa Kiswahili badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huhifadhi usemi wa agano unaoliunganisha jina Yahwe na cheo “Mungu wako.”
- source_word: וּמִשָּׁם יִקָּחֶךָ
  choice: na kutoka huko atakuchukua
  rationale: לקח kimsingi ni “chukua.” Tafsiri hii haiongezi mwelekeo wa “kuleta,” ambao unawekwa wazi zaidi katika mstari unaofuata.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina na hutumia umbo linalosomeka kwa kawaida katika Kiswahili.
- issue: Israeli kutajwa kwa nafsi ya pili umoja ikiwa jamii
  choice: Viwakilishi vya umoja katika “wako,” “atakukusanya,” na “atakuchukua” vimehifadhiwa
  alternative: Kutumia viwakilishi vya wingi au kutaja wazi taifa lote
  rationale: Kiebrania humwambia Israeli kama nafsi moja huku kikimaanisha watu wake waliotawanywa. Kiswahili kinaweza kuhifadhi mvutano huo wa umoja wenye maana ya kijamii.
- issue: Maana ya לקח katika ahadi ya kurejeshwa
  choice: atakuchukua
  alternative: atakuleta
  rationale: “Atakuchukua” huhifadhi upana wa kitenzi cha Kiebrania bila kutangulia kueleza kwa uwazi mwelekeo unaotajwa katika mstari unaofuata.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima lakini unaoeleweka kwa urahisi. Taswira ya “mwisho wa mbingu,” urudiaji wa “kutoka huko,” jina Yahwe, na namna Israeli inavyozungumziwa kama jamii moja vimehifadhiwa.
