base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/012.yaml
  text: It is not in heaven[a], that you should say, ‘Who will go up to heaven for us and get it for us and make us hear it, so that we may do it?’
translation:
  language: sw
  text: Haliko mbinguni, hata useme, “Ni nani atakayepanda mbinguni kwa ajili yetu na kulichukua kwa ajili yetu, na kutufanya tulisikie, ili tulitende?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַשָּׁמַיִם
  choice: mbinguni
  rationale: Neno hili linaonyesha mahali pa juu pasipofikika kwa urahisi, likitofautishwa na neno lililo karibu katika muktadha. “Mbinguni” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: הִוא
  choice: haliko
  rationale: Kiwakilishi cha kike cha umoja kinarejelea agizo lililotajwa katika muktadha. Kiswahili hutumia upatanisho wa ngeli ya neno “agizo,” hivyo “haliko” ni ya asili.
- source_word: לֵאמֹר
  choice: hata useme
  rationale: Infinitivu hii inaanzisha jambo ambalo mtu angeweza kusema kwa kudhani agizo halipatikani. “Hata useme” huunganika kwa kawaida na kauli hasi iliyotangulia.
- source_word: מִי יַעֲלֶה לָּנוּ
  choice: Ni nani atakayepanda ... kwa ajili yetu
  rationale: “Atakayepanda” huhifadhi mwendo wa kwenda juu, na “kwa ajili yetu” huonyesha maana ya kufanyiwa jambo iliyomo katika לָנוּ.
- source_word: הַשָּׁמַיְמָה
  choice: mbinguni
  rationale: Kiishio cha mwelekeo kinaonyesha kwenda kuelekea mbinguni; katika Kiswahili, “kupanda mbinguni” huwasilisha mwelekeo huo bila kuhitaji kihusishi kingine.
- source_word: וְיִקָּחֶהָ לָּנוּ
  choice: akatuletee
  rationale: Ingawa לקח kimsingi ni “chukua,” hapa tendo ni kulipata agizo kutoka mbinguni na kulileta kwa watu. “Akatuletee” huonyesha kusudi hilo kwa Kiswahili cha asili bila kupanua maana kupita kiasi.
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  choice: na kutufanya tulisikie
  rationale: Hifadhi ya Hifili ya שמע ina maana ya kusababisha kusikia. Tafsiri hii inadumisha nguvu hiyo ya kisababishi badala ya kuifasiri moja kwa moja kuwa “kututangazia.”
- source_word: וְנַעֲשֶׂנָּה
  choice: ili tulitende
  rationale: “Kulitenda” hurejelea kutekeleza agizo, huku “ili” ikiwakilisha kusudi au matokeo ya kulisikia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali la kinadharia na mlolongo wa vitenzi vya Kiebrania umehifadhiwa kwa namna ya asili katika Kiswahili.
