base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/015.yaml
  text: See[a], I have set before you today life and good[b], and death and evil.
translation:
  language: sw
  text: Tazama,[a] leo nimeweka mbele yako uzima na mema, na mauti na mabaya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Ona.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linalotafsiriwa “mabaya” linaweza pia kumaanisha “uovu,” “madhara,” au “maafa” kulingana na muktadha; hapa limewekwa kinyume cha “mema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Tazama
  rationale: Amri hii hutumika kuvuta fikira za msikilizaji. “Tazama” ni ya moja kwa moja, yenye heshima, na ya kawaida katika lugha ya kibiblia ya Kiswahili bila kuwa nzito mno.
- source_word: נָתַתִּי
  choice: nimeweka
  rationale: Ingawa kitenzi kinaweza kumaanisha “nimetoa,” katika muundo wa kuweka kitu mbele ya mtu, “nimeweka” huwasilisha kwa kawaida tendo la kuweka machaguo mbele yake.
- source_word: לְפָנֶיךָ
  choice: mbele yako
  rationale: Huhifadhi nahau ya Kiebrania ya kuwasilisha mambo kwa mtu ili ayakabili na kuchagua.
- source_word: הַיּוֹם
  choice: leo
  rationale: Ni tafsiri ya kawaida na wazi ya kielezi hiki cha wakati.
- source_word: הַחַיִּים
  choice: uzima
  rationale: Ingawa umbo la Kiebrania ni la wingi, neno hilo hutumika kama dhana ya jumla ya uhai. “Uzima” linafaa katika muktadha huu wa agano na linatofautishwa moja kwa moja na “mauti.”
- source_word: הַטּוֹב
  choice: mema
  rationale: Huhifadhi maana pana ya wema na ulinganifu wake na “mabaya,” bila kuibana kuwa ustawi pekee.
- source_word: הַמָּוֶת
  choice: mauti
  rationale: Ni neno la heshima na linaloeleweka, linalotumika kama kinyume cha “uzima.”
- source_word: הָרָע
  choice: mabaya
  rationale: Neno la Kiebrania linaweza kuhusisha uovu, madhara, au maafa. “Mabaya” huhifadhi upana huo na ulinganifu wa moja kwa moja na “mema” bila kuamua kimya-kimya kuwa yanahusu uovu wa kimaadili pekee.
theological_decisions:
- issue: Maana ya הָרָע katika ulinganifu wa agano
  choice: mabaya
  alternative: uovu; madhara; maafa
  rationale: “Mabaya” huhifadhi mvutano wa neno la Kiebrania, ambalo linaweza kutaja uovu au matokeo yenye madhara. Pia hudumisha ulinganifu mpana wa uzima/mema dhidi ya mauti/mabaya bila kupunguza maana kuwa maafa yasiyo ya kimaadili wala kuifunga kwa uovu wa kimaadili pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Ulinganifu wa kishairi na wa kiagano umehifadhiwa kwa “uzima na mema” dhidi ya “mauti na mabaya.”
