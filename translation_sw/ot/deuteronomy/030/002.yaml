base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/002.yaml
  text: and you return to Yahweh your God and obey his voice[a], according to all that I am commanding you today, you and your children, with all your heart and with all your soul[c][b],
translation:
  language: sw
  text: nawe utamrudia Yahwe, Mungu wako, na utaitii sauti yake[a], kulingana na yote ninayokuamuru leo, wewe na watoto wako[b], kwa moyo wako wote na kwa nafsi yako yote[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kuisikiliza sauti yake.” Katika Kiebrania, usemi huu mara nyingi una maana yenye nguvu zaidi ya kutii.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “wana wako”; hapa limetafsiriwa “watoto wako” kwa sababu neno hilo linaweza kutumiwa kwa jumla kuhusu wazao katika muktadha huu wa agano.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa uhai wako wote” au “kwa utu wako wote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתָּ עַד
  choice: nawe utamrudia
  rationale: Kitenzi שׁוּב pamoja na עַד kinaonyesha kurudi kwa mtu. ‘Utamrudia’ huhifadhi picha ya kurudi kwa Mungu bila kuitafsiri moja kwa moja kwa istilahi finyu zaidi ya kitheolojia kama ‘kutubu.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kuwa ‘Yahwe’ badala ya kubadilishwa na cheo kama ‘BWANA.’
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: 'Muundo huu una kiambishi cha nafsi ya pili umoja na una maana ya moja kwa moja ya umilikaji: ‘Mungu wako.’'
- source_word: וְשָׁמַעְתָּ בְקֹלוֹ
  choice: na kuitii sauti yake
  rationale: שׁמע בְּקוֹל mara nyingi humaanisha kusikiliza kwa kutenda, yaani kutii. ‘Kuitii sauti yake’ huhifadhi nguvu ya maana na taswira ya Kiebrania.
- source_word: כְּכֹל אֲשֶׁר
  choice: kulingana na yote
  rationale: Kirai hiki huonyesha kupatana na upeo mzima wa yaliyoamriwa.
- source_word: אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ninayokuamuru leo
  rationale: Kauli ya wakati wa sasa ni ya asili katika Kiswahili na ‘leo’ huhifadhi dhana ya wakati.
- source_word: אַתָּה וּבָנֶיךָ
  choice: wewe na watoto wako
  rationale: Ingawa בָּנִים inaweza kumaanisha ‘wana,’ katika muktadha huu wa agano inaweza kutumiwa kwa jumla kuhusu wazao; ‘watoto’ huepuka kuzuia maana kwa wana wa kiume pekee.
- source_word: בְּכָל לְבָבְךָ
  choice: kwa moyo wako wote
  rationale: Hii ni tafsiri ya kawaida na ya asili inayohifadhi moyo kama kitovu cha nia na utu wa ndani.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: na kwa nafsi yako yote
  rationale: נֶפֶשׁ inaweza kumaanisha nafsi, uhai, au mtu mzima. ‘Nafsi’ huhifadhi ulinganifu wa kawaida na ‘moyo’ huku tanbihi ikionyesha maana nyingine zinazowezekana.
theological_decisions:
- issue: Uwasilishaji wa jina la agano יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia moja kwa moja Tetragramatoni יהוה. ‘Yahwe’ huhifadhi jina binafsi la agano badala ya kulibadilisha na cheo.
- issue: Upeo wa בָנֶיךָ
  choice: watoto wako
  alternative: wana wako
  rationale: Wingi wa kiume wa Kiebrania unaweza kutaja wazao kwa jumla katika muktadha wa kifamilia na wa agano; ‘watoto’ huhifadhi upeo huo bila kudai kuwa wanaume pekee ndio wanaokusudiwa.
- issue: Maana ya נַפְשֶׁךָ
  choice: nafsi yako yote
  alternative: uhai wako wote; utu wako wote
  rationale: Neno lina upeo mpana wa maana. ‘Nafsi’ huhifadhi usemi wa agano unaooanisha moyo na nafsi, huku tanbihi ikihifadhi uwezekano wa kuelewa uhai au utu mzima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Muundo wa mstari umehifadhi mfululizo wa Kiebrania kadiri unavyoruhusu uasili wa Kiswahili; jina ‘Yahwe’ limetumiwa kwa Tetragramatoni.
