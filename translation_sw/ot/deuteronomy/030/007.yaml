base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/007.yaml
  text: And Yahweh your God will put all these curses on your enemies and on those who hate you[a], who pursued you.
translation:
  language: sw
  text: Naye Yahweh, Mungu wako, ataziweka laana hizi zote[a] juu ya adui zako na juu ya wale wanaokuchukia, waliokukimbiza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “viapo hivi vyote”; katika Kumbukumbu la Torati neno hili kwa kawaida hurejelea laana au adhabu za agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: atayaweka
  rationale: Kitenzi נתן kinaweza kumaanisha ‘kutoa,’ ‘kuweka,’ au ‘kutia.’ Pamoja na laana kuwa kitu kinachowekwa juu ya watu, ‘atayaweka’ ni Kiswahili cha kawaida na huhifadhi picha ya Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kuwa ‘Yahweh’ badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika matini.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Muundo huu una kiambishi cha nafsi ya pili umoja wa kiume na una maana ya moja kwa moja ya ‘Mungu wako.’
- source_word: כָּל הָאָלוֹת הָאֵלֶּה
  choice: laana hizi zote
  rationale: Katika muktadha wa agano wa Kumbukumbu la Torati, אָלוֹת hurejelea hasa laana au adhabu za agano. Mpangilio ‘laana hizi zote’ ni wa kawaida katika Kiswahili.
- source_word: עַל
  choice: juu ya
  rationale: Kihusishi hiki kinaonyesha walengwa ambao laana zitaangukia; ‘juu ya’ huhifadhi picha ya matini bila kuwa kigumu.
- source_word: אֹיְבֶיךָ
  choice: adui zako
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya nomino ya wingi yenye kiambishi ‘-ako.’
- source_word: וְעַל שֹׂנְאֶיךָ
  choice: na juu ya wale wanaokuchukia
  rationale: Kirai cha urejeshi ‘wale wanaokuchukia’ huwasilisha kwa kawaida katika Kiswahili nguvu ya umbo la Kiebrania linalowataja wenye chuki.
- source_word: אֲשֶׁר רְדָפוּךָ
  choice: waliokufuatilia
  rationale: רדף inaweza kumaanisha kufuata, kufukuza, au kuudhi. ‘Waliokufuatilia’ huhifadhi maana pana ya kuwafuata kwa uhasama bila kuingiza maelezo yasiyotajwa wazi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Matini ina jina maalumu la Mungu, יהוה. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya אָלוֹת katika muktadha wa agano
  choice: laana
  alternative: viapo
  rationale: Katika Kumbukumbu la Torati 30, neno hili linarejelea adhabu za agano zilizotangazwa awali. ‘Laana’ huonyesha maana hiyo ya kimuktadha, huku uwezekano mpana wa ‘viapo’ ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo unadumisha urudiaji wa ‘juu ya’ na mvutano wa kimaana wa neno אָלוֹת.
