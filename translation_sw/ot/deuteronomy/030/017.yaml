base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/017.yaml
  text: But if your heart turns away[a], and you do not listen, and you are drawn away and bow down to other gods and serve them[b],
translation:
  language: sw
  text: Lakini ikiwa moyo wako utageuka, nawe usiposikiliza[a], ukapotoshwa[b], ukainamia miungu mingine na kuzitumikia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kusikiliza” hapa kunaweza pia kutafsiriwa “kutii,” kwa kuwa katika muktadha wa agano neno la Kiebrania mara nyingi linamaanisha kusikia na kuzingatia kile kilichoamriwa.
    reason: lexical_alternative
  - marker: b
    text: Au “ukavutwa mbali” au “ukafukuzwa mbali.” Kitenzi cha Kiebrania kinaweza kumaanisha kuondolewa katika njia au uaminifu unaofaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Kishazi hiki kinaanzisha hali ya masharti iliyo kinyume na wito chanya uliotangulia; “Lakini ikiwa” huonyesha ulinganuzi huo kwa Kiswahili cha kawaida.
- source_word: יִפְנֶה לְבָבְךָ
  choice: moyo wako utageuka
  rationale: Huhifadhi picha ya moyo kugeuka, huku muktadha ukionyesha kuwa ni kuacha uaminifu kwa BWANA bila kuongeza maelezo hayo ndani ya mstari.
- source_word: וְלֹא תִשְׁמָע
  choice: nawe usiposikiliza
  rationale: “Kusikiliza” huhifadhi sitiari ya kusikia na pia huweza kumaanisha kuzingatia au kutii katika muktadha wa agano.
- source_word: וְנִדַּחְתָּ
  choice: ukapotoshwa
  rationale: Kauli ya kutendwa huhifadhi wazo la mtu kuondolewa katika njia au uaminifu unaofaa, bila kumtaja anayesababisha kupotoka huko.
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: ukainamia
  rationale: Huhifadhi tendo halisi la kuinama mbele ya miungu, ambalo katika muktadha huu ni tendo la ibada.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya usemi huu wa Kiebrania kuhusu miungu pinzani.
- source_word: וַעֲבַדְתָּם
  choice: na kuitumikia
  rationale: “Kutumikia” huhifadhi maana ya msingi ya עבד na, kwa sababu ya muktadha, inaeleweka kuwa huduma ya kidini kwa miungu hiyo.
theological_decisions:
- issue: Mfululizo wa uasi dhidi ya agano
  choice: 'Mstari unaonyesha hatua zinazofuatana: moyo kugeuka, kutosikiliza, kupotoshwa, kuinamia miungu mingine, na kuitumikia.'
  alternative: Kutafsiri hatua ya kupotoshwa kwa kauli yenye utendaji zaidi, kama “ukakubali kuvutwa mbali,” au kutafsiri שׁמע moja kwa moja kuwa “kutii.”
  rationale: Kiebrania kinaonyesha mfululizo wa kuacha uaminifu bila kueleza kwa uhakika mhusika anayepotosha au kutatua mvutano kati ya kusikiliza na kutii. Tafsiri inahifadhi hali hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masharti umeachwa wazi kwa sababu hukamilishwa na mstari unaofuata. Alama [a] na [b] zimewekwa mara tu baada ya maneno yanayohusika.
