source:
  edition: WLC
  text: וְ/הָיָה֩ כִֽי יָבֹ֨אוּ עָלֶ֜י/ךָ כָּל הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הַ/בְּרָכָה֙ וְ/הַ/קְּלָלָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לְ/פָנֶ֑י/ךָ וַ/הֲשֵׁבֹתָ֙ אֶל לְבָבֶ֔/ךָ בְּ/כָל הַ/גּוֹיִ֔ם אֲשֶׁ֧ר הִדִּיחֲ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/001.yaml
  text: And when all these things come upon you—the blessing and the curse that I have set before you—and you take them to heart among all the nations where Yahweh your God has driven you,[a]
translation:
  language: sw
  text: Na mambo haya yote yatakapokupata—baraka na laana nilizoweka mbele yako—nawe uyatie moyoni[a] ukiwa miongoni mwa mataifa yote ambako Yahwe, Mungu wako, amekufukuza,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uyakumbuke”; kwa neno na neno, “uyarudishe moyoni mwako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי יָבֹאוּ עָלֶיךָ
  choice: Na mambo haya yote yatakapokupata
  rationale: Muundo huu unaanzisha hali ya wakati ujao. Kiswahili cha ‘yatakapokupata’ kinahifadhi maana ya matukio hayo kumjia mtu huku kikisomeka kwa kawaida.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: mambo haya yote
  rationale: דברים hapa inarejelea matokeo yote ya agano yaliyotangulia, si maneno tu; ‘mambo’ ndiyo maana inayofaa katika muktadha.
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: baraka na laana
  rationale: Maneno haya yanataja wazi matokeo mawili ya agano na yanahifadhi ulinganifu wa Kiebrania.
- source_word: אֲשֶׁר נָתַתִּי לְפָנֶיךָ
  choice: nilizoweka mbele yako
  rationale: Ingawa נתן mara nyingi ni ‘kutoa,’ pamoja na ‘mbele yako’ maana ya kawaida ni kuweka jambo mbele ya mtu ili achague au alizingatie.
- source_word: וַהֲשֵׁבֹתָ אֶל לְבָבֶךָ
  choice: nawe uyatie moyoni
  rationale: Usemi wa Kiebrania una maana halisi ya kuyarudisha moyoni na huonyesha kuyakumbuka na kuyazingatia kwa ndani. ‘Uyatie moyoni’ ni Kiswahili cha kawaida kinachohifadhi picha ya moyo bila kulazimisha maana moja tu.
- source_word: בְּכָל הַגּוֹיִם
  choice: ukiwa miongoni mwa mataifa yote
  rationale: ‘Miongoni mwa’ huonyesha kwa kawaida hali ya kutawanywa na kuishi kati ya watu wa mataifa mengine.
- source_word: הִדִּיחֲךָ
  choice: amekufukuza
  rationale: Kitenzi kinaonyesha kusukumwa au kuondolewa kwa nguvu kwenda uhamishoni; ‘amekufukuza’ kinadumisha uzito huo.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahwe, Mungu wako
  rationale: Jina la agano יְהוָה limetolewa kama ‘Yahwe,’ na apposition imetenganishwa kwa koma kwa uwazi wa Kiswahili.
- source_word: שָׁמָּה
  choice: ambako
  rationale: Kiambishi cha mahali katika ‘ambako’ kinawasilisha kwa kawaida maana ya ‘huko/mahali ambapo’ baada ya kutajwa kwa mataifa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: ‘Yahwe’ linawakilisha jina binafsi la agano lililo katika maandishi ya Kiebrania badala ya kulibadili kuwa cheo.
- issue: Maana ya וַהֲשֵׁבֹתָ אֶל לְבָבֶךָ
  choice: uyatie moyoni
  alternative: uyakumbuke; uyarudishe moyoni mwako
  rationale: Chaguo hili linadumisha moyo kama kitovu cha kumbukumbu na tafakari bila kuamua kwamba usemi huo unamaanisha hisia tu au kumbukumbu ya kiakili tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi inaachwa na koma kwa sababu mstari huu unaendelea kisintaksia katika mstari unaofuata. Umoja wa nafsi ya pili umehifadhiwa kama katika Kiebrania.
