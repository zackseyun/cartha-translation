base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/010.yaml
  text: if you obey the voice of Yahweh your God[a], keeping his commandments and his statutes that are written in this book of the law[b], if you return to Yahweh your God with all your heart and with all your soul.
translation:
  language: sw
  text: ikiwa utaitii sauti ya Yahwe Mungu wako[a], kwa kuzishika amri zake na kanuni zake zilizoandikwa katika kitabu hiki cha Torati, ikiwa utamrudia Yahwe Mungu wako[b] kwa moyo wako wote na kwa nafsi yako yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kutii sauti ya Yahwe”; usemi huu unamaanisha kusikiliza na kutenda anachosema.
    reason: lexical_alternative
  - marker: b
    text: Au “utamgeukia tena” au “utatubu na kumrudia” Yahwe Mungu wako.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ikiwa
  rationale: Katika muktadha huu neno hili linaanzisha sharti linalohusiana na ahadi iliyotangulia; “ikiwa” linaonyesha uhusiano huo kwa kawaida katika Kiswahili.
- source_word: תִשְׁמַע בְּקוֹל
  choice: utaitii sauti
  rationale: Nahau ya Kiebrania haimaanishi kusikia tu, bali kusikiliza kwa kutenda. Tafsiri hii inadumisha taswira ya “sauti” na pia maana ya utii.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetolewa kwa umbo la Kiswahili linalotumiwa kwa kawaida badala ya kubadilishwa kuwa cheo kama “BWANA”.
- source_word: לִשְׁמֹר
  choice: kwa kuzishika
  rationale: Kitenzi-jina hiki kinaonyesha jinsi utii unavyotekelezwa; “kwa kuzishika” kinaweka uhusiano huo wazi na kwa Kiswahili cha kawaida.
- source_word: מִצְוֺתָיו
  choice: amri zake
  rationale: Hili ni neno la kawaida na lenye uzito unaofaa kwa maagizo ya agano.
- source_word: חֻקֹּתָיו
  choice: kanuni zake
  rationale: “Kanuni” linatofautisha חֻקִּים na “amri,” huku likidumisha maana ya masharti yaliyowekwa.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  choice: katika kitabu hiki cha Torati
  rationale: “Torati” linabainisha hati ya agano inayozungumziwa na huepuka kurudia “sheria” kwa maana kadhaa ndani ya sentensi moja.
- source_word: כִּי תָשׁוּב
  choice: na ikiwa utamrudia
  rationale: כִּי ya pili inaendeleza sharti, na שׁוּב inadumishwa kwa taswira yake ya kurudi kwa Mungu bila kuifafanua moja kwa moja kuwa “kutubu.”
- source_word: בְּכָל לְבָבְךָ וּבְכָל נַפְשֶׁךָ
  choice: kwa moyo wako wote na kwa nafsi yako yote
  rationale: Hii inadumisha jozi ya Kiebrania inayohusu utu wa ndani na maisha yote ya mtu.
theological_decisions:
- issue: Maana ya kiagano ya שׁוּב katika muktadha wa toba
  choice: utamrudia
  alternative: utatubu na kumgeukia
  rationale: “Kumrudia” inadumisha maana ya msingi na taswira ya Kiebrania, pamoja na vidokezo vyake vya toba na kurejeshwa kwa agano, bila kufunga maana katika istilahi moja ya kitheolojia.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Kutumia jina binafsi kunadumisha tofauti ya maandishi kati ya jina la Mungu na cheo, bila kuingiza badala ya kimapokeo isiyopo katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Torati” limetumiwa kwa hati ya sheria, na “kanuni” kwa חֻקִּים ili kuepuka kuchanganya istilahi hizo. Muundo wa masharti mawili wa Kiebrania umehifadhiwa.
