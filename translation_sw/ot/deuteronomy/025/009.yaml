base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/009.yaml
  text: then his brother’s widow shall come near to him in the sight of the elders[a], remove his sandal from on his foot, spit in his face, and answer and say[b], ‘This is what shall be done to the man who will not build up his brother’s house.’
translation:
  language: sw
  text: Ndipo mjane wa ndugu yake atamkaribia mbele ya wazee, atamvua kiatu chake kutoka mguuni mwake, atamtemea usoni[a], naye atajibu na kusema, “Hivi ndivyo atakavyotendewa mwanamume ambaye hataijenga nyumba ya ndugu yake.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atamtemea mate mbele yake.” Baadhi huelewa Kiebrania kuwa mwanamke anatema mate mbele ya mwanamume huyo, si moja kwa moja usoni mwake.
    reason: lexical_alternative
  - marker: b
    text: “Kuijenga nyumba ya ndugu yake” maana yake ni kuendeleza ukoo na familia ya ndugu yake kwa njia ya ndoa ambayo ndugu wa marehemu humwoa mjane wake.
    reason: cultural_note
lexical_decisions:
- source_word: יְבִמְתּוֹ
  choice: mjane wa ndugu yake
  rationale: Katika muktadha wa ndoa ya ndugu wa marehemu, neno hili linamtaja hasa mjane wa ndugu yake, si shemeji wa aina yoyote.
- source_word: לְעֵינֵי הַזְּקֵנִים
  choice: mbele ya wazee
  rationale: Huwasilisha tendo linalofanywa hadharani, wazee wakiliona na kulishuhudia, kwa Kiswahili cha kawaida na cha heshima.
- source_word: וְחָלְצָה נַעֲלוֹ מֵעַל רַגְלוֹ
  choice: atamvua kiatu chake mguuni
  rationale: Kitenzi kina maana ya kuondoa kiatu; umoja wa neno la Kiebrania umehifadhiwa.
- source_word: וְיָרְקָה בְּפָנָיו
  choice: atamtemea usoni
  rationale: Huu ndio uelewa wa moja kwa moja wa Kiebrania na unaendeleza fedheha ya hadharani katika utaratibu huu wa kisheria.
- source_word: וְעָנְתָה וְאָמְרָה
  choice: kisha atajibu na kusema
  rationale: Huhifadhi vitenzi vyote viwili vya mtindo rasmi wa masimulizi na sheria wa Kiebrania.
- source_word: כָּכָה יֵעָשֶׂה
  choice: Hivi ndivyo atakavyotendewa
  rationale: Ni kauli ya Kiswahili iliyo ya asili na yenye nguvu rasmi ya tamko la Kiebrania.
- source_word: לָאִישׁ
  choice: mtu
  rationale: Katika sentensi hii, 'mtu' humrejelea wazi mwanamume anayekataa wajibu huo na ni Kiswahili cha kawaida bila kufuta muktadha wa kijinsia.
- source_word: לֹא יִבְנֶה אֶת בֵּית אָחִיו
  choice: ambaye hataki kuijenga nyumba ya ndugu yake
  rationale: Huhifadhi sitiari ya Kiebrania ya 'kuijenga nyumba' huku 'hataki' ikionyesha kukataa kufanya wajibu, si kutoweza.
theological_decisions:
- issue: Iwapo kauli בְּפָנָיו ipunguzwe ukali
  choice: atamtemea usoni
  alternative: atamtemea mate mbele yake
  rationale: Maana ya moja kwa moja inaelekea kwenye kumtemea usoni. Maana mbadala inayowezekana imehifadhiwa katika tanbihi badala ya kusuluhishwa kimya kimya.
- issue: Maana ya 'kuijenga nyumba ya ndugu yake'
  choice: Sitiari imehifadhiwa katika maandishi na kufafanuliwa katika tanbihi
  alternative: kuendeleza ukoo wa ndugu yake
  rationale: Kuhifadhi sitiari kunadumisha lugha ya chanzo, huku tanbihi ikieleza maana yake ya kifamilia katika ndoa ya ndugu wa marehemu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifungu cha sheria lakini kinachoeleweka kwa wasomaji wa kawaida. 'Kiatu' limetumiwa kwa footwear ya kale kwa kuwa ni neno la kawaida; 'mjane wa ndugu yake' huweka uhusiano wa kisheria wazi.
