  naturalness: Kiswahili ni cha asili na cha hadhi inayofaa kwa matini ya sheria. “Wanaume wawili wakipigana wao kwa wao” husomeka vizuri.
  terminology: “Ndugu,” “mumewe,” na “sehemu za siri” zinafaa. Ufafanuzi mdogo wa mrejeo wa “zake” unahitajika ili kuondoa utata usiopo katika muktadha wa chanzo.
