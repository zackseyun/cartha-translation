translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa -ki- umetumiwa kuhifadhi uwezekano wa kusoma כִּי kama ‘ikiwa’ au ‘wakati.’ Sentensi imeachwa na koma kwa sababu aya ya 11 inaendelea moja kwa moja hadi hukumu katika aya ya 12.
