base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/011.yaml
  text: If men are fighting together[a], a man and his brother, and the wife of one comes near to rescue her husband from the hand of the one striking him, and she reaches out her hand and seizes his genitals[d][c][b],
translation:
  language: sw
  text: Wanaume wawili wakipigana wao kwa wao, mtu na ndugu yake[a], na mke wa mmoja wao akakaribia ili kumwokoa mumewe kutoka mkononi mwa yule anayempiga[b], kisha akanyoosha mkono wake na kushika sehemu za siri za yule anayempiga[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “ndugu” hapa linaweza kumaanisha ndugu wa damu, au mwananchi mwenzake, si lazima ndugu wa kuzaliwa.
    reason: cultural_note
  - marker: b
    text: Au “kutoka kwa mshambuliaji wake.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinatumia usemi wa staha unaomaanisha sehemu za siri za mwanamume.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִנָּצוּ
  choice: wakipigana
  rationale: Katika sheria ya kisa, כִּי huanzisha hali inayodhaniwa, na Niphal יִנָּצוּ inaonyesha mapambano ya kimwili. Muundo wa Kiswahili wenye -ki- huwasilisha kwa kawaida maana ya ‘ikiwa/wakati wanapopigana’ bila kulazimisha uchaguzi usio wa lazima kati ya ‘ikiwa’ na ‘wakati.’
- source_word: אֲנָשִׁים יַחְדָּו
  choice: wanaume wawili ... wao kwa wao
  rationale: אֲנָשִׁים hapa ni wanaume, na muktadha unaonyesha wawili. ‘Wao kwa wao’ huonyesha kwamba wanapigana baina yao, si kwamba wako upande mmoja.
- source_word: אִישׁ וְאָחִיו
  choice: mtu na ndugu yake
  rationale: Huhifadhi kwa karibu usemi wa Kiebrania. ‘Ndugu’ inaweza kumaanisha ndugu wa damu au mwanajamii/mwenza; tanbihi inaeleza upana huo.
- source_word: וְקָרְבָה אֵשֶׁת הָאֶחָד
  choice: na mke wa mmoja wao akakaribia
  rationale: ‘Mmoja wao’ hufafanua rejeo la הָאֶחָד kwa Kiswahili cha kawaida bila kuongeza taarifa mpya.
- source_word: לְהַצִּיל אֶת אִישָׁהּ
  choice: ili kumwokoa mumewe
  rationale: Katika muktadha huu אִישָׁהּ ni mume wake, na ‘kumwokoa’ huonyesha kumtoa katika hatari ya mara moja.
- source_word: מִיַּד מַכֵּהוּ
  choice: kutoka mkononi mwa yule anayempiga
  rationale: Huhifadhi taswira halisi ya ‘mkono’ na kitendo kinachoendelea cha kumpiga.
- source_word: וְשָׁלְחָה יָדָהּ
  choice: kisha akanyoosha mkono wake
  rationale: Ni Kiswahili cha asili kwa nahau ya Kiebrania ya kupeleka au kunyoosha mkono; ‘kisha’ huonyesha hatua inayofuata katika tukio.
- source_word: וְהֶחֱזִיקָה בִּמְבֻשָׁיו
  choice: na kushika sehemu zake za siri
  rationale: מְבֻשִׁים ni usemi wa staha kwa sehemu za siri za mwanamume. ‘Kushika’ huonyesha tendo la kukamata bila kuongeza kwa lazima kiwango cha nguvu ambacho Kiswahili ‘kunyakua’ kingeweza kudokeza.
