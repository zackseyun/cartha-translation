lexical_decisions:
- source_word: וְנִקְרָא
  choice: litaitwa
  rationale: Nifali ya קרא inaonyesha kutajwa kwa jina hadharani. “Litaitwa” inadumisha muundo wa kisheria wa Kiebrania na inaeleweka katika Kiswahili sanifu.
- source_word: שְׁמוֹ
  choice: jina lake
  rationale: Kirai hiki kinarejelea jina au sifa ya hadharani ya mtu huyo; kimetafsiriwa wazi bila kufuta lugha ya kumtaja rasmi.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: Kihusishi ב hapa kinaonyesha jamii ambamo jina hilo litatumiwa. “Katika Israeli” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: בֵּית
  choice: Nyumba ya
  rationale: בֵּית hapa ni jina la aibu linalohusishwa na nyumba au ukoo, si jengo tu. “Nyumba ya” inadumisha taswira na muundo rasmi wa jina hilo.
- source_word: חֲלוּץ
  choice: yule aliyevuliwa
  rationale: Kivumishi-tendo hiki cha hali ya kutendwa kinarejelea mtu aliyevuliwa kiatu katika ibada iliyotangulia. “Yule aliyevuliwa” huweka maana hiyo wazi bila kuongeza maelezo yasiyomo.
- source_word: הַנָּעַל
  choice: kiatu
  rationale: Neno hili linamaanisha kiatu, hasa aina ya kiatu cha wazi cha nyakati za kale. “Kiatu” ni neno la kawaida na linaloeleweka kote katika Kiswahili sanifu.
