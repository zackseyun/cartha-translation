  text: Na jina lake litaitwa katika Israeli[a], “Nyumba ya yule ambaye kiatu chake kilivuliwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa ukaribu zaidi na Kiebrania, “Nyumba ya kiatu kilichovuliwa.” Kiebrania hufupisha jina hili la aibu lililotokana na desturi hiyo.
