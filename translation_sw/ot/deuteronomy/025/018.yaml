base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/018.yaml
  text: how he met you on the way and attacked all the stragglers behind you, when you were weary and worn out; and he did not fear God.
translation:
  language: sw
  text: jinsi alivyokukuta njiani na kuwashambulia kutoka nyuma wote waliokuwa wamebaki nyuma yako, ulipokuwa umechoka na kuishiwa nguvu; naye hakumwogopa Mungu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרְךָ
  choice: alivyokukuta
  rationale: Katika muktadha huu kitenzi kinaeleza Amaleki kukutana na Israeli njiani; tafsiri hii ni ya kawaida na inaacha wazi namna hasa ya kukutana huko.
- source_word: וַיְזַנֵּב בְּךָ
  choice: kuwashambulia kutoka nyuma
  rationale: Kitenzi kinahusiana na kushambulia sehemu ya nyuma ya msafara; uchaguzi huu unaonyesha shambulio bila kudai kwamba wote waliuawa.
- source_word: הַנֶּחֱשָׁלִים
  choice: waliokuwa wamebaki nyuma
  rationale: Neno humaanisha waliokuwa nyuma au waliochelewa katika msafara, si lazima kundi lenye utambulisho mwingine maalumu.
- source_word: עָיֵף וְיָגֵעַ
  choice: umechoka na kuishiwa nguvu
  rationale: Jozi hii inaonyesha uchovu mkubwa na kudhoofika; Kiswahili hiki ni cha asili na kinahifadhi msisitizo wa maneno mawili.
- source_word: וְלֹא יָרֵא אֱלֹהִים
  choice: naye hakumwogopa Mungu
  rationale: Inahifadhi kauli ya moja kwa moja kuhusu kutokuwa na hofu ya Mungu na kiwakilishi cha umoja kinachomrejelea Amaleki.
theological_decisions:
- issue: Mhusika wa kauli ‘hakumwogopa Mungu’
  choice: Amaleki ndiye anayeonyeshwa kwa ‘naye’
  alternative: Kauli inaweza kusomwa kana kwamba inawahusu Israeli kwa sababu ya ukaribu wa maelezo ya uchovu wao
  rationale: Muendelezo wa mtendaji wa umoja katika sentensi na muktadha wa kukumbuka tendo la Amaleki unaunga mkono rejeo kwa Amaleki, bila kuongeza maelezo ya kimadhehebu.
