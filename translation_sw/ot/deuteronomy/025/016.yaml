  yaml_path: translation/ot/deuteronomy/025/016.yaml
  text: For everyone who does these things[a], everyone who does injustice, is an abomination to Yahweh your God.
translation:
  language: sw
  text: Kwa maana kila atendaye mambo haya, kila atendaye udhalimu[a], ni chukizo kwa Yahwe Mungu wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila atendaye uovu” au “kila afanyaye yasiyo ya haki.” Neno la Kiebrania עָוֶל linaweza kumaanisha uovu, udhalimu, au kutokuwa na haki; hapa linahusu hasa udanganyifu katika biashara.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya katazo lililotangulia kwa njia ya kawaida na iliyo wazi katika Kiswahili.
- source_word: תוֹעֲבַת
  choice: ni chukizo kwa
  rationale: Inadumisha uzito wa neno la Kiebrania linalomaanisha jambo linalomchukiza sana Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni namna ya Kiswahili ya kuandika jina binafsi la Mungu lililowakilishwa na herufi YHWH, badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Inawakilisha moja kwa moja kiambishi cha nafsi ya pili umoja na kudumisha usemi wa agano.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: kila atendaye mambo haya
  rationale: Muundo wa kishiriki unaeleza kundi la jumla; “kila atendaye” huhifadhi maana ya kila mtu na urudiaji wa kitenzi.
- source_word: כֹּל עֹשֵׂה עָוֶל
  choice: kila atendaye udhalimu
  rationale: Huhifadhi urudiaji wa עֹשֵׂה na kuonyesha tendo lisilo la haki, hasa udanganyifu katika vipimo na mizani unaozungumziwa katika muktadha.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania inatumia jina binafsi la Mungu, si cheo; “Yahwe” hulihifadhi katika umbo linalotumika kwa kawaida katika Kiswahili.
- issue: Upeo wa עָוֶל
  choice: udhalimu
  alternative: uovu
  rationale: “Udhalimu” huonyesha kutokuwa na haki katika biashara kwa mujibu wa muktadha, bila kuondoa uwezekano mpana wa kosa au uovu, ambao umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Urudiaji wa “kila atendaye” umehifadhiwa ili kuonyesha msisitizo na ulinganifu wa matini ya Kiebrania.
