  text: Then the elders of his city shall call him and speak to him[a], and if he stands and says, “I do not desire to take her,”
translation:
  language: sw
  text: Ndipo wazee wa mji wake watamwita na kusema naye. Akisimama na kusema, “Sitaki kumchukua[a],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kuonyesha maana ya muktadha wazi zaidi, “kumwoa.” Kiebrania kinasema kihalisi “kumchukua,” nahau ya kawaida ya kumchukua mwanamke katika ndoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרְאוּ
  choice: watamwita
  rationale: Katika muktadha huu wa sheria, kitenzi kinaonyesha hatua inayofuata katika utaratibu; wakati ujao wa Kiswahili huwasilisha wajibu huo kwa kawaida.
- source_word: זִקְנֵי עִירוֹ
  choice: wazee wa mji wake
  rationale: Neno linawahusu viongozi wa jamii, na tafsiri hii ni ya moja kwa moja na ya kawaida katika Kiswahili cha Biblia.
- source_word: וְדִבְּרוּ אֵלָיו
  choice: na kusema naye
  rationale: Muundo wa Kiebrania unaonyesha wazee wakimwelekezea maneno; “kusema naye” ni wa kawaida na unaweza kudokeza mazungumzo au mawaidha bila kuongeza yaliyomo.
- source_word: וְעָמַד
  choice: Akisimama
  rationale: Huhifadhi picha halisi ya ‘kusimama’ pamoja na nguvu ya kimasharti katika utaratibu wa sheria, bila kuitafsiri moja kwa moja kuwa ‘akisisitiza.’
- source_word: לֹא חָפַצְתִּי
  choice: Sitaki
  rationale: Katika Kiswahili cha sasa, “sitaki” huwasilisha kwa uwazi kutokuwa na hamu au nia, na inafaa katika kauli ya moja kwa moja.
- source_word: לְקַחְתָּהּ
  choice: kumchukua
  rationale: Huhifadhi nahau ya Kiebrania ya ‘kumchukua’ mwanamke, huku maana ya ndoa ikifafanuliwa katika tanbihi.
