base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/006.yaml
  text: And it shall be that the firstborn whom she bears shall rise up in the name of his dead brother[a], so that his name may not be blotted out from Israel.
translation:
  language: sw
  text: Na itakuwa kwamba mwana wa kwanza ambaye mjane huyo atamzaa ataendeleza jina la ndugu yake aliyekufa[a], ili jina lake lisifutwe kutoka Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya neno kwa neno zaidi, “atasimama juu ya jina la ndugu yake aliyekufa”—yaani, ataendeleza ukoo na hadhi ya ndugu huyo katika Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּכוֹר
  choice: mzaliwa wa kwanza
  rationale: Huhifadhi maana ya mtoto wa kiume wa kwanza na uzito wake wa kifamilia na kisheria katika muktadha huu.
- source_word: תֵּלֵד
  choice: ambaye huyo mwanamke atamzaa
  rationale: Kitenzi cha Kiebrania ni cha umoja wa kike na kinamrejelea mjane; kuongeza ‘huyo mwanamke’ hufanya mhusika aeleweke wazi katika Kiswahili.
- source_word: יָקוּם עַל שֵׁם
  choice: ataendeleza jina la
  rationale: Nahau hii inahusu kuendelezwa kwa ukoo, nafasi, na kumbukumbu ya marehemu, si lazima mtoto kupewa jina lake binafsi. Tafsiri hii ni ya asili katika Kiswahili huku tanbihi ikihifadhi umbo halisi zaidi.
- source_word: אָחִיו הַמֵּת
  choice: ndugu yake aliyekufa
  rationale: Ni tafsiri ya moja kwa moja na yenye heshima; katika muktadha ndugu anayerejelewa ni kaka au ndugu wa kiume wa baba ya mtoto.
- source_word: יִמָּחֶה
  choice: lisifutwe
  rationale: Kitenzi hiki katika hali ya Niphal kina maana ya kufutwa au kuondolewa; ‘lisifutwe’ linafaa kwa jina na huhifadhi uzito wa kisheria na wa kumbukumbu.
- source_word: מִיִּשְׂרָאֵל
  choice: katika Israeli
  rationale: Ingawa kihalisi ni ‘kutoka Israeli,’ Kiswahili cha ‘jina lisifutwe katika Israeli’ huwasilisha kwa kawaida wazo la jina kutoondolewa miongoni mwa jumuiya ya Israeli.
theological_decisions:
- issue: Maana ya kauli ya ndoa ya kurithi mjane יָקוּם עַל שֵׁם אָחִיו הַמֵּת
  choice: Mtoto ataendeleza jina, ukoo, na nafasi ya ndugu aliyekufa.
  alternative: Mtoto atapewa jina binafsi la ndugu aliyekufa.
  rationale: Katika mazingira haya ya kisheria, nahau hiyo inalenga kuhifadhi uzao, urithi, na kumbukumbu ya marehemu ndani ya Israeli. Haidai kwa uwazi kwamba mtoto apewe jina lilelile binafsi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Na itakuwa kwamba’ huhifadhi muundo wa utangulizi wa Kiebrania; ‘ataendeleza jina’ huwasilisha nahau ya kisheria bila kuifanya kuwa suala la kumpa mtoto jina binafsi.
