  text: וְ/הָיָ֡ה בְּ/הָנִ֣יחַ יְהוָ֣ה אֱלֹהֶ֣י/ךָ לְ֠/ךָ מִ/כָּל אֹ֨יְבֶ֜י/ךָ מִ/סָּבִ֗יב בָּ/אָ֨רֶץ֙ אֲשֶׁ֣ר יְהוָֽה אֱ֠לֹהֶי/ךָ נֹתֵ֨ן לְ/ךָ֤ נַחֲלָה֙ לְ/רִשְׁתָּ֔/הּ תִּמְחֶה֙ אֶת זֵ֣כֶר עֲמָלֵ֔ק מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם לֹ֖א תִּשְׁכָּֽח׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/019.yaml
  text: And when Yahweh your God gives you rest from all your enemies around you[a], in the land that Yahweh your God is giving you as an inheritance to possess, you shall blot out the remembrance of Amalek from under heaven. Do not forget.
translation:
  language: sw
  text: Yahwe Mungu wako atakapokupa pumziko kutokana na maadui zako wote wanaokuzunguka, katika nchi ambayo Yahwe Mungu wako anakupa kuwa urithi ili uimiliki, utaifuta kumbukumbu[a] ya Amaleki kutoka chini ya mbingu. Usisahau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukumbusho.”
    reason: Neno זֵכֶר linaweza kurejelea kumbukumbu au ukumbusho; maana hizi zinazokaribiana haziwezi kutenganishwa kwa uhakika hapa.
lexical_decisions:
- source_word: וְהָיָה בְּהָנִיחַ
  choice: atakapokupa pumziko
  rationale: Muundo huu unaonyesha hali ya wakati ujao inayoongoza kwenye amri; Kiswahili hiki ni cha asili na kinahifadhi maana ya Yahwe kusababisha pumziko.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: מִכָּל אֹיְבֶיךָ מִסָּבִיב
  choice: kutokana na maadui zako wote wanaokuzunguka
  rationale: Tafsiri hii inahifadhi wazo la maadui wote na hali yao ya kumzunguka mhusika.
- source_word: נַחֲלָה
  choice: urithi wako
  rationale: ‘Urithi’ linahifadhi istilahi muhimu ya nchi ya agano; ‘wako’ linaweka wazi yule anayepewa bila kubadili maana.
- source_word: לְרִשְׁתָּהּ
  choice: ili uimiliki
  rationale: Kitenzi kinamaanisha kuichukua na kuishikilia nchi kama milki.
- source_word: תִּמְחֶה
  choice: utaifuta
  rationale: Kitenzi מחה kina maana ya kufuta au kuondoa kabisa; ‘utaifuta’ kinahifadhi taswira hiyo na nguvu ya amri.
- source_word: זֵכֶר
  choice: kumbukumbu
  rationale: Neno linaweza kumaanisha kumbukumbu au ukumbusho; ‘kumbukumbu’ ni wazi na la kawaida, huku mbadala ukiwekwa katika tanbihi.
- source_word: עֲמָלֵק
  choice: Amaleki
  rationale: Jina hili limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: kutoka chini ya mbingu
  rationale: Usemi huu unahifadhi taswira na upeo wa nahau ya Kiebrania badala ya kuirahisisha kuwa ‘duniani.’
- source_word: לֹא תִּשְׁכָּח
  choice: Usisahau
  rationale: Ni katazo fupi la moja kwa moja linalolingana na nguvu ya Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יהוה; ‘Yahwe’ linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Kufutwa kwa זֵכֶר ya Amaleki
  choice: kumbukumbu ya Amaleki
  alternative: ukumbusho wa Amaleki
  rationale: Tafsiri kuu haifafanui zaidi ya maandishi ikiwa kinacholengwa ni kumbukumbu, ukumbusho, jina, au masalia ya watu; hivyo inadumisha mvutano wa usemi wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha urudiaji wa ‘Yahwe Mungu wako,’ taswira ya ‘chini ya mbingu,’ na amri fupi ya mwisho. Alama ya tanbihi imewekwa baada ya neno ‘kumbukumbu,’ ambalo ndilo lenye tofauti ya kileksika.
