lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: Usiwe na
  rationale: Muundo huu wa Kiebrania ni halisi ‘kisiwe kwako,’ lakini katika katazo la Kiswahili ‘usiwe na’ ni wa kawaida na huhifadhi nguvu ya sheria.
- source_word: בְּכִיסְךָ
  choice: katika mfuko wako
  rationale: כִּיס ni mfuko au kijifuko cha kubebea fedha au mawe ya kupimia; ‘mfuko’ ni neno la kawaida na linaloeleweka katika muktadha wa biashara.
- source_word: אֶבֶן וָאָבֶן
  choice: mawe ya kupimia yenye vipimo tofauti
  rationale: Kwa neno ni ‘jiwe na jiwe,’ nahau inayorejelea mawe yaliyotumiwa kama vipimo vya uzito katika biashara. Tafsiri hii hufafanua kazi yake bila kuficha taswira ya mawe.
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: jiwe kubwa na jiwe dogo
  rationale: Vivumishi vya kike vinarejelea mawe hayo mawili; kurudia ‘jiwe’ kunafanya Kiswahili kiwe wazi na kuhifadhi ulinganisho wa Kiebrania.
