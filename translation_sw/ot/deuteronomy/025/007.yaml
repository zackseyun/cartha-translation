base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/007.yaml
  text: But if the man does not want to take his brother’s widow[a], then his brother’s widow shall go up to the gate, to the elders, and say, ‘My brother-in-law refuses to raise up a name for his brother in Israel[b]; he is not willing to perform the duty of a brother-in-law to me.’
translation:
  language: sw
  text: Lakini ikiwa mwanamume huyo hataki kumchukua mjane wa ndugu yake, mjane huyo atapanda kwenda langoni kwa wazee na kusema, “Ndugu wa mume wangu anakataa kumwinulia ndugu yake jina katika Israeli[a]; hataki kutekeleza wajibu wake wa kunioa kama ndugu wa mume wangu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “kumwinulia ndugu yake jina katika Israeli.” Nahau hii inamaanisha kuendeleza ukoo na kudumisha jina na nafasi ya ndugu aliyekufa miongoni mwa Israeli.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinatumia kitenzi maalumu kwa kutekeleza wajibu wa ndugu wa mume aliyekufa kwa kumuoa mjane wake.
    reason: cultural_note
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: hataki
  rationale: Katika muktadha huu wa kisheria, kitenzi kinaonyesha kutotaka au kutokuwa tayari; “hataki” ni cha kawaida na huhifadhi maana ya hiari.
- source_word: לָקַחַת אֶת יְבִמְתּוֹ
  choice: kumchukua mjane wa ndugu yake
  rationale: “Kumchukua” hufuata kitenzi cha Kiebrania, huku “mjane wa ndugu yake” ikifafanua uhusiano maalumu wa ndoa ya kumrithi mjane.
- source_word: וְעָלְתָה ... הַשַּׁעְרָה
  choice: atapanda kwenda langoni
  rationale: Huhifadhi wazo la kupanda na kuelekea langoni, mahali rasmi pa hukumu ya jamii.
- source_word: הַזְּקֵנִים
  choice: wazee
  rationale: Ni viongozi wenye mamlaka katika jamii; “wazee” ni neno la kawaida na lenye hadhi katika Kiswahili cha Biblia.
- source_word: מֵאֵין
  choice: anakataa
  rationale: Neno hili linaonyesha kukataa au kutokuwa tayari, hasa katika malalamiko rasmi.
- source_word: לְהָקִים ... שֵׁם
  choice: kumwinulia ... jina
  rationale: Huhifadhi sitiari ya Kiebrania ya kuinua au kusimamisha jina, yaani kuendeleza ukoo na nafasi ya marehemu katika Israeli.
- source_word: לֹא אָבָה
  choice: hataki
  rationale: Hueleza kutokuwa tayari au kukataa, kwa lugha ya sasa na ya kawaida.
- source_word: יַבְּמִי
  choice: kunitimizia wajibu wa shemeji
  rationale: Kitenzi hiki ni istilahi maalumu ya kutekeleza wajibu wa kumuoa mjane wa ndugu aliyekufa; tafsiri hii inaeleweka bila kutumia istilahi ya kitaalamu isiyofahamika kwa wengi.
theological_decisions:
- issue: Istilahi ya wajibu wa kumuoa mjane wa ndugu aliyekufa
  choice: 'Kutumia maneno yanayoeleza uhusiano na wajibu: “mjane wa ndugu yake” na “wajibu wa shemeji.”'
  alternative: Kutumia istilahi ya kitaalamu ya “ndoa ya kulithi mjane” au kusema moja kwa moja “kuniowa.”
  rationale: Maandishi ya Kiebrania yanatumia istilahi ya kisheria yenye maana pana kuliko tendo la ndoa pekee. Tafsiri hii inaweka wazi wajibu huo bila kuingiza istilahi ngeni au kuufupisha kupita kiasi.
- issue: Nahau ya kumwinulia ndugu jina katika Israeli
  choice: Kuhifadhi nahau katika matini na kuieleza katika tanbihi.
  alternative: Kutafsiri moja kwa moja kuwa “kuendeleza ukoo wa ndugu yake katika Israeli.”
  rationale: Nahau ni sehemu muhimu ya lugha na fikra ya kifungu; tanbihi hutoa ufafanuzi bila kuondoa taswira ya asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Lugha ya kisheria imehifadhiwa bila kuwa nzito; “langoni” linaonyesha mahali pa jadi pa kusikilizia mashauri.
