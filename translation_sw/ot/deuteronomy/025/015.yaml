source:
  edition: WLC
  text: אֶ֣בֶן שְׁלֵמָ֤ה וָ/צֶ֨דֶק֙ יִֽהְיֶה לָּ֔/ךְ אֵיפָ֧ה שְׁלֵמָ֛ה וָ/צֶ֖דֶק יִֽהְיֶה לָּ֑/ךְ לְמַ֨עַן֙ יַאֲרִ֣יכוּ יָמֶ֔י/ךָ עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/015.yaml
  text: You shall have a full and just weight; you shall have a full and just ephah[a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: sw
  text: Uwe na jiwe la kupimia lililo kamili na la haki[a]; uwe na efa iliyo kamili na ya haki[b], ili siku zako zidumu kwa muda mrefu katika nchi ambayo Yahweh Mungu wako anakupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “jiwe”; yaani, jiwe lililotumiwa kama kipimo cha uzani katika biashara.'
    reason: Ufafanuzi wa maana ya neno katika muktadha wa biashara.
  - marker: b
    text: Efa ilikuwa kipimo cha kale cha vitu vikavu.
    reason: Ufafanuzi wa kipimo cha kale kisichotumiwa kwa kawaida leo.
lexical_decisions:
- source_word: אֶבֶן
  choice: jiwe la kupimia
  rationale: Neno hili kihalisi ni ‘jiwe’; katika muktadha wa biashara linamaanisha jiwe lililotumiwa kama kipimo cha uzani. Tafsiri hii inadumisha picha halisi na kufafanua matumizi yake.
- source_word: שְׁלֵמָה
  choice: lililo/iliyo kamili
  rationale: Kivumishi kinaonyesha ukamilifu, yaani kipimo kisichopunguzwa au kudanganywa.
- source_word: וָצֶדֶק
  choice: na la/ya haki
  rationale: Katika biashara, neno hili linahusu kipimo kinacholingana na yaliyo sawa na ya uadilifu; ‘haki’ inadumisha uzito wake wa kimaadili.
- source_word: יִהְיֶה לָּךְ
  choice: uwe na
  rationale: Muundo wa Kiebrania ni ‘iwe kwako,’ lakini hapa una nguvu ya sharti la kisheria. ‘Uwe na’ ni ya kawaida na wazi katika Kiswahili.
- source_word: אֵיפָה
  choice: efa
  rationale: Efa ni kipimo maalumu cha kale cha vitu vikavu; kulinakili jina lake kunadumisha umahususi wa kipimo hicho.
- source_word: לְמַעַן
  choice: ili
  rationale: Kiunganishi hiki kinaonyesha kusudi au matokeo yanayotarajiwa.
- source_word: יַאֲרִיכוּ יָמֶיךָ
  choice: siku zako zipate kuwa nyingi
  rationale: Hii ni nahau ya Kiebrania kuhusu kurefushwa kwa siku za maisha. Usemi huu ni wa heshima na unaeleweka katika Kiswahili huku ukidumisha picha ya ‘siku zako.’
- source_word: עַל הָאֲדָמָה
  choice: katika nchi
  rationale: Katika Kumbukumbu la Torati, neno hili katika muktadha huu hurejelea nchi ya agano. ‘Katika nchi’ ni Kiswahili cha kawaida kuliko tafsiri ya kimuundo ‘juu ya nchi.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano la Mungu limetolewa moja kwa moja kwa namna ya ‘Yahweh.’
- source_word: נֹתֵן לָךְ
  choice: anakupa
  rationale: Kauli endelevu inadumisha wazo la utoaji unaowasilishwa kuwa wa sasa au unaokaribia kutimia.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; ‘Yahweh’ hulidumisha kama jina badala ya kulibadili kuwa cheo.
- issue: Uhusiano kati ya uadilifu wa kibiashara na wingi wa siku katika nchi
  choice: Muundo wa kusudi/matokeo umedumishwa kwa ‘ili’
  alternative: Kutafsiri kama ahadi ya moja kwa moja isiyo na mvutano
  rationale: לְמַעַן inaweza kuonyesha kusudi au matokeo. Tafsiri haibainishi zaidi ya maandishi namna sharti na baraka ya agano zinavyohusiana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Marudio ya ‘kamili na ya haki’ yamedumishwa ili kuhifadhi usambamba wa Kiebrania; ‘katika nchi’ limetumiwa kwa ufasaha wa Kiswahili.
