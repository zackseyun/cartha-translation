base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/001.yaml
  text: If there is a dispute between men[a], and they come to court, and the judges decide between them, then they shall acquit the righteous and condemn the wicked[c][b],
translation:
  language: sw
  text: 'Ikiwa kuna mgogoro kati ya wanaume[a], nao wakaenda mahakamani[b], waamuzi watawahukumu: watamtangaza mwenye haki kuwa hana hatia, na watamtia mwovu hatiani.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wakati mgogoro unapotokea kati ya wanaume.”
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania: “wakakaribia hukumu”; yaani, wakaingia katika mchakato wa mahakama.'
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania kihalisi, “watamtangaza mwenye haki kuwa mwenye haki, na mwovu kuwa mwovu.” Hizi ni istilahi za mahakama: kumtangaza mwenye haki kuwa hana hatia na kumtia mwovu hatiani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: Ikiwa kuna
  rationale: Katika sheria ya masharti, kifungu hiki kinaanzisha hali inayoweza kutokea. “Ikiwa kuna” ni Kiswahili cha kawaida na huhifadhi maana ya sharti; “wakati kuna” pia inawezekana.
- source_word: רִיב
  choice: mgogoro
  rationale: Katika muktadha wa kisheria, neno hili ni mgogoro au shauri linalohitaji uamuzi. “Mgogoro” ni wazi bila kudokeza ugomvi wa maneno tu.
- source_word: בֵּין אֲנָשִׁים
  choice: kati ya wanaume
  rationale: Nomino ya Kiebrania iko katika wingi wa kiume na hapa inaelekeza kwa wadaawa wanaume; tafsiri hii inahifadhi umahususi huo.
- source_word: וְנִגְּשׁוּ אֶל הַמִּשְׁפָּט
  choice: nao wakaenda mahakamani
  rationale: Kihalisi ni kukaribia au kwenda kwenye hukumu. “Kwenda mahakamani” huwasilisha kwa kawaida kuingia katika mchakato wa utoaji haki.
- source_word: וּשְׁפָטוּם
  choice: waamuzi watahukumu kesi yao
  rationale: Kitenzi ni cha wingi chenye kiambishi cha yambwa, ‘watawahukumu.’ Muktadha unawafanya waamuzi kuwa kiima kisichotajwa wazi; “kesi yao” huzuia wazo la kuwahukumu watu kimaadili badala ya kuamua mgogoro wao.
- source_word: וְהִצְדִּיקוּ אֶת הַצַּדִּיק
  choice: watamtangaza asiye na hatia kuwa hana hatia
  rationale: Katika mazingira ya mahakama, hiphili ya צדק humaanisha kutoa uamuzi kwamba mtu yuko upande wa haki, si kumbadilisha awe mwadilifu. Kauli hii ya kimahakama ni wazi katika Kiswahili.
- source_word: וְהִרְשִׁיעוּ אֶת הָרָשָׁע
  choice: watamtangaza mwenye hatia kuwa ana hatia
  rationale: Katika matumizi ya kimahakama, hiphili ya רשע ni kumtia mtu hatiani au kumtangaza kuwa na hatia. Muundo sambamba huhifadhi ulinganifu wa maneno ya Kiebrania.
theological_decisions:
- issue: Maana ya kimahakama dhidi ya maana ya kimaadili ya צדק na רשע
  choice: 'Uamuzi wa kimahakama: kumtangaza asiye na hatia kuwa hana hatia na mwenye hatia kuwa ana hatia'
  alternative: Kuwaita mmoja mwenye haki na mwingine mwovu kwa maana pana ya tabia zao
  rationale: Muktadha ni wa shauri linaloletwa mbele ya waamuzi. Kwa hiyo, maneno haya yanaeleza hali ya wahusika katika kesi na uamuzi unaotolewa, si kupewa au kubadilishwa kwa hali yao ya maadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. “Mahakamani,” “waamuzi,” na “hatia” huweka wazi mazingira ya kisheria. Sentensi imegawanywa kwa alama ya nukta mbili ili mtiririko wa sharti, usikilizaji wa kesi, na uamuzi uwe wa kawaida katika Kiswahili.
