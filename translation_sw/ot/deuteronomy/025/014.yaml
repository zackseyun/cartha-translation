  text: You shall not have in your house an ephah and an ephah[a], a large and a small.
translation:
  language: sw
  text: Usiwe na vipimo viwili vya efa[a] nyumbani mwako, kimoja kikubwa na kingine kidogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Efa ilikuwa kipimo cha kale cha Waebrania kilichotumiwa kupimia vitu vikavu.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: Usiwe na
  rationale: Muundo wa Kiebrania una maana halisi ya ‘kisiwepo kwako,’ lakini katika sheria hii ni katazo la kumiliki; ‘Usiwe na’ ni Kiswahili cha kawaida kinachohifadhi nguvu ya katazo.
- source_word: בְּבֵיתְךָ
  choice: nyumbani mwako
  rationale: בַּיִת ni ‘nyumba’; katika Kiswahili, ‘nyumbani mwako’ hueleza kwa kawaida mahali mtu anapoweka vifaa hivi bila kuigeuza kuwa dhana pana ya watu wa nyumbani.
- source_word: אֵיפָה וְאֵיפָה
  choice: vipimo viwili vya efa
  rationale: Kurudiwa kwa אֵיפָה kunaonyesha vipimo viwili vya kiwango kinachodaiwa kuwa kilekile. Kiswahili hiki kinaweka wazi maana ya kurudiwa huku huku kikihifadhi jina la kipimo cha kale ‘efa.’
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: kimoja kikubwa na kingine kidogo
  rationale: Hueleza kwa uwazi utofauti wa vipimo viwili na kuhifadhi ulinganifu mfupi wa Kiebrania.
