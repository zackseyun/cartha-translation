translation:
  language: sw
  text: Basi, umkate mkono wake;[a] jicho lako lisimhurumie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiganja chake.” Neno la Kiebrania linaweza kumaanisha kiganja hasa, ingawa “mkono” ni usemi wa kawaida zaidi hapa.
    reason: lexical_alternative
  - marker: b
    text: Au, “jicho lako lisimsamehe.” Hii ni nahau ya Kiebrania inayomaanisha kutomwonea huruma au kutomwachilia adhabu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַצֹּתָה
  choice: basi umkate
  rationale: Kitenzi קצץ kinaamuru kukata na kuondoa kabisa. Katika Kiswahili, “umkate mkono” ni usemi wa kawaida na wa moja kwa moja unaohifadhi ukali wa adhabu.
- source_word: אֶת
  choice: '[kiashiria cha yambwa, hakitafsiriwi]'
  rationale: Kiashiria hiki cha yambwa mahususi katika Kiebrania hakina neno linalolingana nacho moja kwa moja katika Kiswahili.
- source_word: כַּפָּהּ
  choice: mkono wake
  rationale: כַּף inaweza kumaanisha kiganja hasa au mkono kwa upana. “Mkono wake” ni ya kawaida zaidi katika muktadha wa kitu kinachokatwa, huku maana ya “kiganja” ikihifadhiwa katika tanbihi.
- source_word: לֹא
  choice: lisi-
  rationale: Kiambishi cha ukanushi katika “lisimhurumie” kinawasilisha katazo la Kiebrania.
- source_word: תָחוֹס
  choice: lisimhurumie
  rationale: חוס inaweza kumaanisha kuhurumia, kusikitikia, au kuacha kwa huruma. “Kumhurumia” inafaa katika nahau inayolitaja jicho na haipunguzi ukali wa amri.
- source_word: עֵינֶךָ
  choice: jicho lako
  rationale: Tafsiri hii inadumisha picha halisi ya nahau ya Kiebrania badala ya kuibadili kuwa kiwakilishi tu.
theological_decisions:
- issue: Uhalisi wa kauli ya adhabu
  choice: Kudumisha amri halisi “umkate mkono wake” na nahau “jicho lako lisimhurumie.”
  alternative: “Baada ya kumkata mkono, usimwonee huruma.”
  rationale: Kifungu ni amri ya moja kwa moja katika sheria ya Israeli. Tafsiri yenye kufafanua zaidi ingefifisha muundo mkali wa Kiebrania na kugeuza nahau yake. Maana mbadala ya כַּף na חוס inaonyeshwa kwa tanbihi bila kuamua zaidi ya ushahidi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya kisheria iliyo wazi, ya heshima, na ya moja kwa moja. “Basi” huunganisha amri hii na hali iliyoelezwa katika mstari uliotangulia. Nahau ya “jicho lako” imehifadhiwa kwa sababu inaeleweka na inadumisha picha ya matini asilia.
