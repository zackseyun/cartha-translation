- source_word: לֹא תַחְסֹם
  choice: Usimfunge kinywa
  rationale: Kiswahili cha kawaida huonyesha katazo hili kwa umbo la ‘usi-’. Kitenzi חסם hapa kinamaanisha kufunga au kuzuia kinywa cha mnyama; ‘kumfunga kinywa’ ni wazi na cha asili kuliko kutumia istilahi isiyo ya kawaida.
- source_word: שׁוֹר
  choice: ng’ombe
  rationale: Neno שׁוֹר humaanisha mnyama wa jamii ya ng’ombe, hasa ng’ombe wa kazi katika muktadha huu. ‘Ng’ombe’ ni neno la kawaida na linaloeleweka katika Kiswahili sanifu.
- source_word: בְּדִישׁוֹ
  choice: anapopura nafaka
  rationale: Muundo wa Kiebrania kwa maana halisi ni ‘katika kupura kwake’. ‘Anapopura nafaka’ huwasilisha kwa Kiswahili cha asili hali ya wakati ambapo ng’ombe anafanya kazi hiyo, huku ‘nafaka’ ikifafanua kitu kinachopurwa kulingana na muktadha wa kilimo.
