base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/005.yaml
  text: If brothers dwell together[a], and one of them dies and has no son, the wife of the dead man shall not be married outside the family to a stranger[d][c][b]. Her husband's brother shall go in to her and take her as his wife and perform the duty of a brother-in-law to her.
translation:
  language: sw
  text: Kama ndugu wakikaa pamoja, na mmoja wao akifa bila kuwa na mwana[a], mke wa aliyekufa asiolewe na mwanamume asiye wa jamaa[b]. Ndugu wa mumewe aliyekufa amwingilie[c], amchukue awe mke wake, na amtendee wajibu wa ndugu wa mume[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “hana mwana.” Tafsiri nyingine hueleza maana kuwa “hana mtoto,” lakini Kiebrania kinataja mwana hasa.'
    reason: lexical_alternative
  - marker: b
    text: 'Kwa karibu zaidi: “asiwe wa nje kwa mwanamume asiye wa jamaa”; maana yake ni kwamba asiolewe nje ya wajibu wa jamaa ya mume aliyekufa.'
    reason: lexical_alternative
  - marker: c
    text: “Amwingilie” ni msemo wa Kiebrania unaomaanisha kuwa na uhusiano wa kimwili wa ndoa naye.
    reason: lexical_alternative
  - marker: d
    text: Huu ni wajibu wa ndugu wa mume aliyekufa kumwoa mjane wake, desturi inayojulikana kama ndoa ya ndugu wa marehemu.
    reason: cultural_note
lexical_decisions:
- source_word: אַחִים יַחְדָּו
  choice: ndugu wanaishi pamoja
  rationale: אַחִים ni ndugu wa kiume katika sheria hii, na יַחְדָּו huonyesha kuishi pamoja bila kufafanua kupita kiasi mpangilio wa makazi.
- source_word: וּבֵן אֵין לוֹ
  choice: bila kuwa na mwana
  rationale: Kiebrania kinataja mwana hasa, si neno la jumla la mtoto; tafsiri inadumisha upeo huo na kuweka ufafanuzi katika tanbihi.
- source_word: אֵשֶׁת הַמֵּת
  choice: mke wa huyo aliyekufa
  rationale: Hufuata muundo wa Kiebrania kwa karibu kuliko kutumia tu 'mjane,' ingawa hali ya ujane inaeleweka.
- source_word: הַחוּצָה לְאִישׁ זָר
  choice: asiolewe na mwanamume mwingine nje ya jamaa
  rationale: Maana ya kisheria ni mwanamume aliye nje ya wajibu wa ukoo, si lazima mgeni wa kikabila. 'Nje ya jamaa' huweka utofauti huo wazi kwa Kiswahili cha kawaida.
- source_word: יְבָמָהּ
  choice: ndugu ya mumewe aliye marehemu
  rationale: Nomino humaanisha hasa ndugu wa kiume wa mume aliyekufa; usemi kamili huepuka utata wa neno la jumla 'shemeji.'
- source_word: יָבֹא עָלֶיהָ
  choice: amwingilie
  rationale: Huu ni msemo wa staha wa Kiebrania unaorejelea kujamiana ndani ya ndoa. 'Amwingilie' hudumisha sitiari na uzito wa kisheria.
- source_word: וּלְקָחָהּ לוֹ לְאִשָּׁה
  choice: amchukue awe mke wake
  rationale: Ni Kiswahili cha asili kinachowasilisha kwa karibu maana ya kumchukua kwake kuwa mke.
- source_word: וְיִבְּמָהּ
  choice: kumtimizia wajibu wa ndugu ya mume
  rationale: Kitenzi hiki ni istilahi maalumu ya kutekeleza wajibu wa ndoa ya ndugu wa marehemu; lugha ya kawaida inafaa zaidi katika matini kuu kuliko istilahi ya kitaalamu.
theological_decisions:
- issue: Upeo wa sharti וּבֵן אֵין לוֹ
  choice: Matini kuu inasema 'bila kuwa na mwana.'
  alternative: Kutafsiri kwa ujumla zaidi, 'bila kuwa na mtoto.'
  rationale: Kiebrania kinasema 'mwana' waziwazi. Kudumisha neno hilo hakutatui kimya kimya swali la iwapo sheria hiyo inahusu kukosekana kwa mtoto yeyote.
- issue: Uwasilishaji wa wajibu wa ndoa ya ndugu wa marehemu
  choice: Kutumia lugha ya uhusiano na wajibu iliyo wazi katika matini kuu.
  alternative: Kutumia istilahi ya kitaalamu kama 'ndoa ya kilawi.'
  rationale: Lugha ya kawaida hudumisha nguvu ya kisheria na kueleweka kwa wasomaji wa sasa bila kuingiza istilahi inayoweza kuwa ngeni au kuchanganywa na Walawi.
- issue: Maana ya זָר katika muktadha huu
  choice: Kumweleza kama mwanamume mwingine aliye nje ya jamaa.
  alternative: Kumwita 'mgeni' au 'mwanamume wa kigeni.'
  rationale: Hapa utofauti mkuu ni kuwa nje ya wajibu wa kifamilia, si utaifa au kabila; tafsiri huepuka kuingiza maana ya mgeni wa taifa jingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sheria umehifadhiwa, lakini sentensi imetolewa kwa mtiririko wa kawaida. 'Jamaa' hapa ni ukoo au familia pana yenye wajibu huu, na 'ndugu ya mumewe aliye marehemu' imechaguliwa badala ya 'shemeji' ili kuzuia utata.
