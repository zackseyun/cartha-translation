base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/017.yaml
  text: Remember what Amalek did to you on the way when you came out from Egypt:[a]
translation:
  language: sw
  text: Kumbuka yale Amaleki aliyokutendea njiani mlipotoka Misri:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlipotoka kutoka Misri.”
    reason: Mbadala huu huweka wazi kihusishi cha chanzo katika Kiebrania (מן), ilhali maandishi makuu hutumia Kiswahili kifupi na cha kawaida.
lexical_decisions:
- source_word: זָכוֹר
  choice: Kumbuka
  rationale: Ni amri ya moja kwa moja katika umoja; “Kumbuka” ni Kiswahili cha kawaida na hudumisha nguvu ya agano ya agizo hilo.
- source_word: אֵת אֲשֶׁר
  choice: yale
  rationale: Kirai hiki kinaanzisha jambo linalopaswa kukumbukwa. “Yale” ni cha asili katika muundo “yale ... aliyokutendea” bila kutumia tafsiri nzito ya neno kwa neno.
- source_word: עָשָׂה לְךָ
  choice: aliyokutendea
  rationale: Katika muktadha huu tendo linaelekezwa kwa Israeli kwa uadui. “Aliyokutendea” ni wazi na hudumisha kiambishi cha nafsi ya pili katika umoja kilicho katika Kiebrania.
- source_word: עֲמָלֵק
  choice: Amaleki
  rationale: Jina hili limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia; linabaki kuwa jina la mhusika wa pamoja bila kulifafanua zaidi.
- source_word: בַּדֶּרֶךְ
  choice: njiani
  rationale: “Njiani” huonyesha kwa ufupi na kwa kawaida mazingira ya safari.
- source_word: בְּצֵאתְכֶם
  choice: mlipotoka
  rationale: Muundo huu hutoa maana ya wakati ya kitenzi-jina cha Kiebrania na huhifadhi nafsi ya pili wingi, tofauti na “aliyokutendea” iliyo umoja.
- source_word: מִמִּצְרַיִם
  choice: Misri
  rationale: Baada ya kitenzi “mlipotoka,” jina “Misri” kwa kawaida linaeleweka kuwa mahali walikotoka; maana ya kihusishi מן ya chanzo inawasilishwa bila uradidi usio wa lazima.
theological_decisions:
- issue: Amaleki kama jina la mtu au jina la kundi la watu
  choice: Amaleki aliyokutendea
  alternative: Waamaleki walivyowatendea
  rationale: Kiebrania kinatumia jina la umoja עֲמָלֵק pamoja na kitenzi cha umoja. Tafsiri imehifadhi umbo hilo la pamoja badala ya kulibadili waziwazi kuwa wingi, hivyo haifungi uwezekano wa jina hilo kurejelea taifa kwa ujumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mabadiliko ya Kiebrania kutoka nafsi ya pili umoja katika “aliyokutendea” hadi wingi katika “mlipotoka” yamehifadhiwa. Alama ya nukta mbili imeachwa kwa kuwa sentensi inaendelea katika mstari unaofuata.
