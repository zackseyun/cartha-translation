base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/003.yaml
  text: He may strike him forty times[a], but no more[b], lest he go on to strike him with many more blows than these and your brother be degraded before your eyes.
translation:
  language: sw
  text: Anaweza kumpiga mara arobaini[a], lakini asizidishe, asije akaendelea kumpiga mapigo mengi zaidi ya hayo, na ndugu yako[b] akadharauliwa mbele ya macho yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mapigo arobaini.” Kiebrania kinataja idadi ya arobaini, lakini hapa hakitaji kifaa kilichotumiwa wala namna kamili ya kila pigo.
    reason: lexical_alternative
  - marker: b
    text: “Ndugu yako” hapa ni mshiriki mwenzako wa jumuiya ya agano. Sheria inaweka mpaka wa adhabu ili asitendewe kama mtu wa kudharauliwa.
    reason: cultural_note
lexical_decisions:
- source_word: אַרְבָּעִים יַכֶּנּוּ
  choice: Anaweza kumpiga mara arobaini
  rationale: Namba arobaini inaweka kiwango cha juu cha adhabu ya kupigwa. “Mara” huhifadhi kuhesabiwa kwa mapigo bila kutaja kifaa au namna ya kupiga ambayo Kiebrania hakuitaji wazi.
- source_word: לֹא יֹסִיף
  choice: lakini asizidishe
  rationale: Kitenzi יסף kina wazo la kuongeza; katika sheria hii “asizidishe” kinaeleza kwa kawaida marufuku ya kuvuka kiwango kilichowekwa.
- source_word: פֶּן יֹסִיף לְהַכֹּתוֹ
  choice: asije akaendelea kumpiga
  rationale: פן huanzisha onyo la matokeo yanayopaswa kuzuiwa, na יסף pamoja na kitenzi-jina huonyesha kuendelea au kuongeza tendo.
- source_word: עַל אֵלֶּה מַכָּה רַבָּה
  choice: mapigo mengi zaidi ya hayo
  rationale: Ingawa מַכָּה רַבָּה ni umbo la umoja, hapa lina maana ya pamoja ya kipigo kikubwa au mapigo yaliyozidi; tafsiri hii huonyesha wazi hatari ya kuongeza idadi ya mapigo.
- source_word: וְנִקְלָה
  choice: akadharauliwa
  rationale: Niphal ya קלה hueleza kufanywa duni, mwenye fedheha, au wa kudharauliwa. “Akadharauliwa” huhifadhi suala la hadhi ya mtu bila kulifanya kuwa hisia ya ndani pekee.
- source_word: אָחִיךָ
  choice: ndugu yako
  rationale: Hii ndiyo maana ya moja kwa moja ya neno la Kiebrania na huhifadhi msisitizo kwamba mwenye kosa bado ni mshiriki mwenzao wa jumuiya ya agano.
- source_word: לְעֵינֶיךָ
  choice: mbele ya macho yako
  rationale: Tafsiri hii ni ya moja kwa moja na inaeleweka, huku ikihifadhi nguvu ya kimaadili ya fedheha kutokea wazi machoni pa jamii.
theological_decisions:
- issue: Neno la undugu wa agano katika muktadha wa sheria
  choice: ndugu yako
  alternative: Mwisraeli mwenzako
  rationale: 'Kuhifadhi “ndugu” kunadumisha msingi wa sheria hii: hata anapoadhibiwa, mkosaji habadilishwi kuwa mtu wa kudharauliwa bali anaendelea kuwa ndugu ndani ya jumuiya ya agano.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kisheria umewekwa wazi bila kuongeza aina ya kifaa cha kupigia. Alama zote za tanbihi zimewekwa katika matini kuu.
