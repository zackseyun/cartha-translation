lexical_decisions:
- source_word: בִּן הַכּוֹת
  choice: anastahili kupigwa
  rationale: Nahau ya Kiebrania, kihalisi ‘mwana wa kupigwa,’ inaonyesha mtu anayestahili au anayepaswa kupewa adhabu ya kupigwa; Kiswahili hiki ni cha kawaida na huhifadhi maana ya kisheria.
- source_word: הָרָשָׁע
  choice: mtu mwovu
  rationale: Kivumishi hiki kimetumiwa kama nomino kwa mtu wa kiume aliyepatikana na hatia, huku kikihifadhi pia maana ya kimaadili ya uovu.
- source_word: וְהִפִּילוֹ
  choice: atamlaza chini
  rationale: Hifili ya נפל hapa ina maana ya kumsababisha mtu alale au awekwe chini kwa ajili ya adhabu.
- source_word: הַשֹּׁפֵט
  choice: mwamuzi
  rationale: Hili ni neno la kawaida la Kiswahili kwa ofisa anayetoa uamuzi katika shauri.
- source_word: וְהִכָּהוּ
  choice: na kumpiga
  rationale: Kitenzi kwa umbo lake la moja kwa moja humtaja mwamuzi kama mtendaji; tafsiri hii haiingizi bila lazima wazo la kumwagiza mtu mwingine ampige.
- source_word: לְפָנָיו
  choice: mbele yake
  rationale: Hufuata kwa karibu usemi wa Kiebrania na kuonyesha kwamba adhabu inatekelezwa mbele ya mwamuzi, chini ya usimamizi wake.
- source_word: כְּדֵי רִשְׁעָתוֹ
  choice: kwa kadiri ya uovu wake
  rationale: Usemi huu unaonyesha uwiano kati ya kosa au uovu na adhabu, huku ukihifadhi neno la kimaadili na kisheria la chanzo.
- source_word: בְּמִסְפָּר
  choice: kwa hesabu
  rationale: Usemi mfupi wa Kiebrania unadai mapigo yahesabiwe; tafsiri ya karibu imehifadhiwa, na maelezo yanafafanua uhusiano wake na uwiano wa kosa.
