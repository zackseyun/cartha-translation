translation:
  language: sw
  text: basi, ikiwa mtu mwovu anastahili kupigwa, mwamuzi atamlaza chini na kumpiga mbele yake, kwa kadiri ya uovu wake, kwa idadi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa hesabu,” yaani, kwa idadi iliyohesabiwa ya mapigo inayolingana na kosa.
