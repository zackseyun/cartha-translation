  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: יָצְא֞וּ אֲנָשִׁ֤ים בְּנֵֽי בְלִיַּ֨עַל֙ מִ/קִּרְבֶּ֔/ךָ וַ/יַּדִּ֛יחוּ אֶת יֹשְׁבֵ֥י עִירָ֖/ם לֵ/אמֹ֑ר נֵלְכָ֗ה וְ/נַעַבְדָ֛ה אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹא יְדַעְתֶּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/014.yaml
  text: Certain worthless men have gone out from among you and have led the inhabitants of their city astray[a], saying, ‘Let us go and serve other gods,’ which you have not known.
translation:
  language: sw
  text: Watu fulani waovu[a] wametoka miongoni mwenu na kuwapotosha wakazi wa mji wao, wakisema, “Twende tukaitumikie miungu mingine ambayo hamkuijua.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa ubatili”; kimapokeo, “wana wa Beliali.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצְאוּ
  choice: wametoka
  rationale: Kitenzi hiki kinaonyesha kwamba watu hao walitokea kutoka ndani ya jumuiya yenyewe; wakati timilifu unafaa katika taarifa hii.
- source_word: אֲנָשִׁים בְּנֵי בְלִיַּעַל
  choice: watu fulani wasiofaa
  rationale: Kirai hiki ni nahau ya Kiebrania inayowataja watu wapotovu au wasio na maadili, si lazima jina maalumu la Beliali. ‘Watu’ ni ya kawaida na yenye heshima katika Kiswahili; dokezo linaonyesha umbo halisi la nahau.
- source_word: מִקִּרְבְּךָ
  choice: miongoni mwenu
  rationale: Huhifadhi maana ya kwamba walitoka ndani ya jumuiya ya agano.
- source_word: וַיַּדִּיחוּ
  choice: kuwapotosha
  rationale: Hiphil ya נדח hapa ni kusababisha wengine waache njia na kuifuata ibada ya miungu mingine; ‘kuwapotosha’ ni ya kawaida na huhifadhi uzito wa ukengeufu huo.
- source_word: יֹשְׁבֵי עִירָם
  choice: wakazi wa mji wao
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya wale wanaokaa katika mji wao.
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: Twende tukaitumikie
  rationale: Maumbo ya kuhimiza yanaalika hatua ya pamoja. ‘Kuitumikia’ huhifadhi maana pana ya עבד ya huduma ya kidini, si tendo la ibada pekee.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Hii ni tafsiri ya moja kwa moja ya kirai cha kawaida katika Kumbukumbu la Torati bila kukifinyanga kuwa ‘miungu ya kigeni.’
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: ambayo hamkuijua
  rationale: ‘Kujua’ huhifadhi uwezekano wa maana ya ufahamu pamoja na uhusiano, badala ya kuipunguza kuwa kusikia habari zake tu.
theological_decisions:
- issue: Maana ya בְּנֵי בְלִיַּעַל
  choice: watu fulani wasiofaa
  alternative: wana wa Beliali; watu waovu
  rationale: Katika muktadha huu kirai ni nahau ya watu wapotovu, wala mstari haulazimishi ‘Beliali’ ieleweke kuwa jina la kiumbe wa kiroho. Tafsiri hii huepuka kuingiza dhana ya baadaye huku dokezo likihifadhi umbo halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Twende tukaitumikie’ ni mwaliko wa kawaida unaobeba maana ya kwenda kwa kusudi la kutoa huduma ya kidini. Alama ya dokezo imewekwa moja kwa moja baada ya kirai inachokifafanua.
