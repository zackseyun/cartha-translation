base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/019.yaml
  text: if you listen to the voice of Yahweh your God, to keep all his commandments that I am commanding you today, to do what is right in the eyes of Yahweh your God.
translation:
  language: sw
  text: ikiwa utaisikiliza sauti ya Yahweh Mungu wako, kwa kuzishika amri zake zote ninazokuamuru leo, na kufanya yaliyo sawa machoni pa Yahweh Mungu wako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ikiwa
  rationale: Katika muktadha huu neno hili linaanzisha sharti linalohusiana na ahadi iliyotangulia; “ikiwa” linaonyesha wazi maana hiyo.
- source_word: תִשְׁמַע בְּקוֹל
  choice: utaisikiliza sauti
  rationale: Kauli hii ya Kiebrania hudokeza kusikiliza kwa makini kunakoleta utii. Tafsiri hii inadumisha taswira ya kusikiliza sauti bila kuifupisha kuwa “utatii” pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetafsiriwa kwa namna inayokaribia matamshi yake, badala ya kubadilishwa kuwa cheo.
- source_word: לִשְׁמֹר אֶת כָּל מִצְוֺתָיו
  choice: kwa kuzishika amri zake zote
  rationale: “Kuzishika” linaonyesha kutunza na kutekeleza kwa uangalifu masharti ya agano; “zote” na umilikaji wake vimedumishwa.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ninazokuamuru leo
  rationale: Muundo huu unaonyesha tendo la Musa la kutoa amri wakati wa hotuba hii na unadumisha msisitizo wa “leo.”
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: na kufanya yaliyo sawa
  rationale: Neno יָשָׁר hapa linahusu mambo yaliyo sawa au manyofu kimaadili. “Yaliyo sawa” ni Kiswahili cha kawaida na chenye heshima.
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: Hii inadumisha nahau ya Kiebrania inayohusu tathmini au hukumu ya Mungu na inaeleweka vizuri katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina binafsi la Mungu moja kwa moja; “Yahwe” hulihifadhi badala ya kuliwakilisha kwa cheo.
- issue: Maana ya kusikiliza sauti ya Mungu
  choice: utaisikiliza sauti
  alternative: utaitii sauti
  rationale: Muktadha unahusisha utii, lakini tafsiri iliyochaguliwa inadumisha taswira halisi ya kusikiliza na kuacha maana pana ya utii itokane na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa msomaji wa kawaida. Muundo wa masharti na misemo ya agano umehifadhiwa bila kufanya sentensi kuwa nzito kupita kiasi.
