  text: Ikiwa nabii au mwotaji wa ndoto atatokea miongoni mwenu na kuwapa ishara au ajabu,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ishara au tukio la ajabu.”
