lexical_decisions:
- source_word: כִּי
  choice: Ikiwa
  rationale: Katika sheria hii neno hilo linaanzisha hali ya masharti inayoendelea katika mstari unaofuata; “ikiwa” ni ya kawaida na wazi.
- source_word: יָקוּם
  choice: atatokea
  rationale: Kitenzi kinaeleza kujitokeza kwa mtu huyo ndani ya jumuiya; “atatokea” ni Kiswahili cha sasa na cha asili kuliko tafsiri ya moja kwa moja “atasimama.”
- source_word: בְּקִרְבְּךָ
  choice: miongoni mwenu
  rationale: Huhifadhi mazingira ya kijumuiya ya kirai cha Kiebrania, huku kiambishi cha umoja katika chanzo kikielekezwa kwa Israeli kwa pamoja.
- source_word: נָבִיא
  choice: nabii
  rationale: Hili ndilo neno sanifu la Kiswahili kwa mtu anayedai au kupewa ujumbe wa kinabii.
- source_word: חֹלֵם חֲלוֹם
  choice: mwotaji wa ndoto
  rationale: Huhifadhi muundo wa Kiebrania wa kitenzi-jina na kumtofautisha mhusika huyu na nabii bila kufafanua kupita kiasi.
- source_word: וְנָתַן אֵלֶיךָ
  choice: na kuwapa
  rationale: Katika mfuatano huu wa masharti umbo hilo lina maana ya jambo litakalotokea; “kuwapa” ni wazi na huonyesha kwamba ishara au ajabu inaelekezwa kwa wasikilizaji.
- source_word: אוֹת
  choice: ishara
  rationale: Ni tafsiri sanifu na pana inayoweza kumaanisha uthibitisho au alama bila kuamua asili yake.
- source_word: מוֹפֵת
  choice: ajabu
  rationale: Huhifadhi wazo la tukio la kushangaza bila kuongeza dai la kwamba lazima liwe muujiza wa kweli.
theological_decisions:
- issue: Asili ya ishara au ajabu inayotolewa na nabii au mwotaji
  choice: ishara au ajabu
  alternative: ishara au tukio la kutisha; ishara ya kimiujiza au ajabu
  rationale: Mstari unasema tu kwamba mtu huyo anatoa ishara au ajabu; hauamui hapa ikiwa jambo hilo ni muujiza halisi, udanganyifu, au dai tu. Tafsiri hii inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mwotaji wa ndoto” huhifadhi ladha ya nahau ya Kiebrania; “atatokea miongoni mwenu” ni ya kawaida kwa wasomaji wa leo. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika.
