review_pass:
  verdict: revise
  source_fidelity: The three cumulative legal inquiry verbs and the confirmation formula are substantially represented. However, “ndipo” adds a consequential transition not expressed here, and “na kuuliza” breaks the imperative/second-person verbal sequence. The supplied conditional sense is interpretive but is supported by the English audit trail; the alternative direct-result reading should remain footnoted.
  naturalness: “Uchunguze, upeleleze, na kuuliza” is ungrammatical as a coordinated instruction because the last element is an infinitive. A semicolon better marks the shift from the commands to the evidentiary conclusion. “Na tazama” is a natural formal rendering of וְהִנֵּה in this legal register.
  terminology: “Chukizo hili” suitably conveys הַתּוֹעֵבָה הַזֹּאת, and “katikati yako” is appropriate for בְּקִרְבֶּךָ. “Jambo hilo limethibitika” preserves the explicit Hebrew reference to the matter being established.
  issues:
  - severity: medium
    issue: The coordinated verbal sequence is grammatically inconsistent.
    rationale: The draft has finite subjunctive forms “uchunguze, upeleleze” followed by infinitive “na kuuliza.” The source gives three coordinated second-person verbal forms; Kiswahili should read “na uulize.”
  - severity: low
    issue: “Ndipo” adds an unneeded discourse relation.
    rationale: The Hebrew begins with a simple conjunction joining this instruction to the preceding context. “Na” preserves this without introducing the stronger consequential nuance of “ndipo.”
  - severity: low
    issue: The direct-result alternative needs a clearer, source-shaped footnote.
    rationale: The Hebrew confirmation formula can be read without an explicit conditional particle. The footnote should preserve that alternative while retaining the main text's audit-trail-supported conditional rendering.
