  yaml_path: translation/ot/deuteronomy/013/015.yaml
  text: and you shall investigate[a], and search out, and inquire thoroughly; and behold, if it is true and certain that this abomination has been done in your midst,
translation:
  language: sw
  text: Na uchunguze, upeleleze, na uulize kwa makini; na tazama, ikiwa ni kweli na jambo hilo limethibitika[a] kwamba chukizo hili limefanyika katikati yako,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “na tazama, ni kweli, jambo hilo limethibitika: chukizo hili limefanyika katikati yako.”'
    reason: Muundo wa Kiebrania unaweza kusomwa kama kauli ya moja kwa moja ya matokeo ya uchunguzi, bila neno la wazi la masharti linalomaanisha “ikiwa.”
lexical_decisions:
- source_word: וְדָרַשְׁתָּ
  choice: uchunguze
  rationale: Katika muktadha huu wa kisheria, kitenzi hiki kinamaanisha kufanya uchunguzi; “uchunguze” ni Kiswahili cha kawaida kinachobeba uzito wa hatua rasmi.
- source_word: וְחָקַרְתָּ
  choice: upeleleze
  rationale: Neno hili linaendeleza na kuimarisha uchunguzi kwa wazo la kuchunguza undani wa jambo; “upeleleze” linaitofautisha hatua hii na uchunguzi wa kwanza.
- source_word: וְשָׁאַלְתָּ הֵיטֵב
  choice: uulize kwa makini
  rationale: שׁאל ni kuuliza au kuhoji, na הֵיטֵב linaongeza maana ya kufanya hivyo vizuri au kwa uangalifu. Kauli hii ni ya asili na wazi kwa msomaji wa leo.
- source_word: וְהִנֵּה
  choice: ikiwa itaonekana
  rationale: Katika mfuatano huu, הנה linaashiria matokeo yaliyodhihirika baada ya uchunguzi. Muundo huu unaunganisha kwa kawaida uchunguzi na uthibitisho bila kupoteza nguvu yake ya kuonyesha jambo lililogunduliwa.
- source_word: אֱמֶת
  choice: ni kweli
  rationale: Hapa neno hili linathibitisha ukweli wa taarifa au shtaka lililochunguzwa.
- source_word: נָכוֹן הַדָּבָר
  choice: jambo hilo limethibitishwa
  rationale: נכון katika kauli ya kisheria humaanisha jambo kuwekwa imara au kuthibitishwa; kutaja “jambo hilo” pia kunahifadhi הַדָּבָר badala ya kulificha katika kiwakilishi.
- source_word: נֶעֶשְׂתָה
  choice: limefanyika
  rationale: Muundo huu unaonyesha kuwa tendo hilo limetendeka; wakati timilifu wa Kiswahili unafaa kwa hitimisho linalofikiwa baada ya uchunguzi.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: chukizo hili
  rationale: “Chukizo” linadumisha uzito wa neno la Kiebrania kuhusu jambo linalochukiza sana katika muktadha wa agano.
- source_word: בְּקִרְבֶּךָ
  choice: katikati yako
  rationale: Kauli hii inadumisha taswira ya jambo kutendeka ndani ya jumuiya inayozungumziwa, huku ikihifadhi umoja wa nafsi ya pili katika Kiebrania.
theological_decisions:
- issue: Kauli ya uthibitisho wa kisheria
  choice: Ikiwa itaonekana kuwa ni kweli, na jambo hilo limethibitishwa kwamba...
  alternative: 'na tazama, ni kweli, jambo hilo limethibitika: chukizo hili limefanyika...'
  rationale: Kiebrania kinakusanya vitenzi vya uchunguzi kisha kinatoa kauli ya uthibitisho. Tafsiri iliyochaguliwa inaonyesha mchakato huo wa kisheria kwa Kiswahili cha kawaida, bila kugeuza shtaka kuwa ukweli kabla ya kuchunguzwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandishi ya kisheria lakini kinachoeleweka kwa urahisi. Mfuatano wa “uchunguze, upeleleze, na kuuliza kwa makini” umehifadhi mkusanyiko wa vitenzi vya Kiebrania. Aya inaishia kwa koma kwa sababu sentensi inaendelea katika aya inayofuata.
