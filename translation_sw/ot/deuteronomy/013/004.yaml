  text: לֹ֣א תִשְׁמַ֗ע אֶל דִּבְרֵי֙ הַ/נָּבִ֣יא הַ/ה֔וּא א֛וֹ אֶל חוֹלֵ֥ם הַ/חֲל֖וֹם הַ/ה֑וּא כִּ֣י מְנַסֶּ֞ה יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ אֶתְ/כֶ֔ם לָ/דַ֗עַת הֲ/יִשְׁ/כֶ֤ם אֹֽהֲבִים֙ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֔ם בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/004.yaml
  text: You shall not listen to the words of that prophet or to that dreamer of dreams[a], for Yahweh your God is testing you[b], to know whether you love Yahweh your God with all your heart and with all your soul.
translation:
  language: sw
  text: Usisikilize maneno ya nabii huyo wala ya mwotaji huyo wa ndoto, kwa maana Yahweh Mungu wenu anawajaribu ili kujua kama mnampenda Yahweh Mungu wenu kwa moyo wenu wote na kwa nafsi yenu yote[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nafsi” hapa pia inaweza kumaanisha “uhai,” “mtu mwenyewe,” au “utu mzima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִשְׁמַע אֶל
  choice: Usisikilize
  rationale: Kitenzi שׁמע pamoja na אֶל hapa kina maana ya kusikiliza au kutii. “Usisikilize” ni katazo la moja kwa moja na huhifadhi pia uwezekano wa maana ya kutii.
- source_word: דִּבְרֵי הַנָּבִיא הַהוּא
  choice: maneno ya nabii huyo
  rationale: “Maneno” huwakilisha wingi wa דָּבָר, na “huyo” huonyesha mtu aliyetajwa katika muktadha uliotangulia.
- source_word: חוֹלֵם הַחֲלוֹם הַהוּא
  choice: mwotaji huyo wa ndoto
  rationale: Usemi huu huhifadhi taswira ya Kiebrania ya mtu anayeota ndoto, huku ukiwa wa kawaida na unaoeleweka kwa Kiswahili.
- source_word: כִּי מְנַסֶּה
  choice: kwa maana ... anawajaribu
  rationale: כִּי hutoa sababu ya katazo, na נסה katika piel humaanisha kujaribu au kupima. “Anawajaribu” ni lugha ya sasa iliyo wazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetafsiriwa kwa uhamishaji wa sauti badala ya kubadilishwa kuwa cheo.
- source_word: לָדַעַת
  choice: ili kujua
  rationale: Huhifadhi kwa ukaribu usemi wa kusudi wa Kiebrania na mvutano wake wa kiteolojia bila kuufasiri kuwa “kufunua” au “kuonyesha.”
- source_word: הֲיִשְׁכֶם אֹהֲבִים
  choice: kama mnampenda
  rationale: Muundo wa swali pamoja na participle unaonyesha hali inayoendelea. Wakati wa sasa wa Kiswahili, “mnampenda,” huwasilisha hali hiyo kwa njia ya kawaida.
- source_word: בְּכָל לְבַבְכֶם
  choice: kwa moyo wenu wote
  rationale: “Moyo” huhifadhi lugha ya agano inayohusu utu wa ndani, nia na mapenzi.
- source_word: וּבְכָל נַפְשְׁכֶם
  choice: na kwa nafsi yenu yote
  rationale: נֶפֶשׁ inaweza kuwa nafsi, uhai, au utu mzima. “Nafsi” huhifadhi mwendelezo wa istilahi ya jadi katika fomula hii ya agano.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Usemi kwamba Mungu anajaribu “ili kujua”
  choice: Kuhifadhi “ili kujua”
  alternative: ili kufunua kama; ili kuonyesha kama
  rationale: Kiebrania kinasema moja kwa moja “ili kujua.” Tafsiri haiondoi usemi huu unaoweza kuleta mvutano wa kiteolojia kwa kuingiza ufafanuzi usiotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka. Katazo limetolewa katika umoja kwa sababu Kiebrania kinamhutubia Israeli kwa umoja, huku viambishi vya wingi katika “Mungu wenu,” “anawajaribu,” na “mnampenda” vikifuatwa kama vilivyo katika maandishi ya Kiebrania.
