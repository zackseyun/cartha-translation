  text: And all Israel shall hear and fear[a], and they shall not again do this evil thing in your midst.
translation:
  language: sw
  text: Na Israeli wote watasikia na kuogopa, nao hawatafanya tena jambo hili ovu katikati yako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwenu.” Kiebrania kinatumia umoja kumwelekea Israeli kama taifa zima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: Na Israeli wote
  rationale: Kirai hiki kinamaanisha taifa lote la Israeli kwa pamoja; mpangilio huu ni wa kawaida na wazi katika Kiswahili.
- source_word: יִשְׁמְעוּ וְיִרָאוּן
  choice: watasikia na kuogopa
  rationale: 'Vitenzi vya wakati usiotimilika vinaonyesha matokeo yanayotarajiwa katika muktadha wa sheria: watu watasikia hukumu hiyo na kuingiwa na hofu inayowazuia kutenda vivyo hivyo.'
- source_word: וְלֹא יוֹסִפוּ לַעֲשׂוֹת
  choice: nao hawatafanya tena
  rationale: Muundo wa Kiebrania wenye יסף pamoja na kitenzi-jina ni nahau yenye maana ya kutorudia tendo; tafsiri hii ni ya asili katika Kiswahili.
- source_word: כַּדָּבָר הָרָע הַזֶּה
  choice: jambo hili ovu
  rationale: דָּבָר hapa hurejelea tendo au jambo lililotajwa, na הָרָע hulitaja wazi kuwa ovu.
- source_word: בְּקִרְבֶּךָ
  choice: katikati yako
  rationale: Tafsiri hii huhifadhi taswira ya Kiebrania na kiambishi cha nafsi ya pili umoja kinacholitaja taifa kwa ujumla.
theological_decisions:
- issue: Umoja wa nafsi katika mwito wa agano kwa Israeli
  choice: katikati yako
  alternative: miongoni mwenu
  rationale: Kiebrania kinatumia kiambishi cha umoja wa kiume kwa Israeli kama taifa moja. Kiswahili kinaweza kuhifadhi umoja huo bila kuufanya usemi usieleweke; tanbihi inaeleza matumizi hayo ya kijumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha na wazi, huku ikihifadhi uzito wa kisheria na mwito wa Israeli katika umoja.
