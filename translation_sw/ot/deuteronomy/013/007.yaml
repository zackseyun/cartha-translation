  text: כִּ֣י יְסִֽיתְ/ךָ֡ אָחִ֣י/ךָ בֶן אִ֠מֶּ/ךָ אֽוֹ בִנְ/ךָ֨ אֽוֹ בִתְּ/ךָ֜ א֣וֹ אֵ֣שֶׁת חֵיקֶ֗/ךָ א֧וֹ רֵֽעֲ/ךָ֛ אֲשֶׁ֥ר כְּ/נַפְשְׁ/ךָ֖ בַּ/סֵּ֣תֶר לֵ/אמֹ֑ר נֵֽלְכָ֗ה וְ/נַֽעַבְדָה֙ אֱלֹהִ֣ים אֲחֵרִ֔ים אֲשֶׁר֙ לֹ֣א יָדַ֔עְתָּ אַתָּ֖ה וַ/אֲבֹתֶֽי/ךָ־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/007.yaml
  text: If your brother[a], the son of your mother, or your son or your daughter, or the wife of your embrace, or your friend who is like your own soul, secretly entices you, saying[b], ‘Let us go and serve other gods’—gods that neither you nor your fathers have known—
translation:
  language: sw
  text: Ikiwa ndugu yako, mwana wa mama yako, au mwanao wa kiume au binti yako, au mke unayemkumbatia[a], au rafiki yako aliye kama nafsi yako mwenyewe[b], atakushawishi kwa siri, akisema, “Twende tukaitumikie miungu mingine”—miungu ambayo wewe wala baba zako hamkuijua—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mke wa kifua chako”—nahau ya kumaanisha mke aliye katika ukaribu wa ndani kabisa.'
    reason: lexical_alternative
  - marker: b
    text: Au “rafiki yako aliye kama uhai wako mwenyewe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְסִיתְךָ
  choice: atakushawishi
  rationale: Kitenzi hiki katika Hiphil humaanisha kumshawishi au kumvuta mtu afuate jambo fulani. “Atakushawishi” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kudokeza kwa lazima matumizi ya nguvu.
- source_word: אָחִיךָ בֶן אִמֶּךָ
  choice: ndugu yako, mwana wa mama yako
  rationale: Muundo wa ufafanuzi wa Kiebrania umehifadhiwa ili kusisitiza ukaribu wa kindugu badala ya kuufupisha kuwa “ndugu yako wa tumbo.”
- source_word: אֵשֶׁת חֵיקֶךָ
  choice: mke unayemkumbatia
  rationale: חֵיק hurejelea kifua, paja, au kumbatio na hapa ni nahau ya ukaribu wa ndani wa kindoa. Tafsiri hii inaleta picha ya kumbatio kwa Kiswahili cha sasa bila kutumia usemi usio wa kawaida.
- source_word: רֵעֲךָ אֲשֶׁר כְּנַפְשְׁךָ
  choice: rafiki yako aliye kama nafsi yako mwenyewe
  rationale: נֶפֶשׁ hapa huonyesha ukaribu mkubwa wa kibinafsi. “Nafsi yako mwenyewe” huhifadhi uzito na picha ya Kiebrania badala ya kuibadili moja kwa moja kuwa “rafiki yako wa karibu sana.”
- source_word: בַּסֵּתֶר
  choice: kwa siri
  rationale: Kirai hiki kina maana ya tendo kufanywa kwa siri au faraghani; “kwa siri” ni cha asili na sahihi katika muktadha.
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: Twende tukaitumikie
  rationale: Miundo ya cohortative hutoa mwaliko au himizo la pamoja. “Twende tukaitumikie” huhifadhi mwendo pamoja na huduma ya kidini.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: אֲחֵרִים humaanisha “mingine”; hakuna sababu ya kuipanua kuwa “miungu ya kigeni.”
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: miungu ambayo wewe wala babu zako hamkuijua
  rationale: Kauli hii inahifadhi kutokujulikana kwa miungu hiyo kwa mhusika na mababu zake. Muundo wa “wewe wala ...” ni wa kawaida katika Kiswahili na unaonyesha kuwa makundi yote mawili hayakuijua.
theological_decisions:
- issue: Kuhifadhi uzito wa nahau za mahusiano ya karibu
  choice: Kutumia “mwana wa mama yako,” “mke unayemkumbatia,” na “rafiki yako aliye kama nafsi yako mwenyewe.”
  alternative: Kutumia vifupisho kama “ndugu yako wa karibu,” “mke wako mpendwa,” na “rafiki yako wa karibu sana.”
  rationale: Orodha ya Kiebrania huongeza uzito wa onyo kwa kutaja watu walio karibu kabisa na msikilizaji. Tafsiri iliyochaguliwa huhifadhi picha na nguvu hiyo bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Maana ya עבד inapohusu miungu mingine
  choice: Kutafsiri kwa “kutumikia.”
  alternative: Kuabudu.
  rationale: עבד inaweza kujumuisha ibada lakini ina wigo mpana wa kutoa huduma kwa mungu. “Kutumikia” huhifadhi wigo huo na mvutano wa kimaana wa chanzo.
- issue: Maana ya נֶפֶשׁ katika usemi wa urafiki
  choice: Kuhifadhi “nafsi” katika maandishi na kueleza uwezekano wa “uhai” katika tanbihi.
  alternative: Kutafsiri moja kwa moja kuwa “rafiki aliye kama uhai wako.”
  rationale: נֶפֶשׁ inaweza kuonyesha nafsi, maisha, au mtu mwenyewe. Muktadha unasisitiza ukaribu, lakini hautulazimishi kufuta upana huo wa kimaana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Miundo ya kindugu na picha za ukaribu zimehifadhiwa kwa kiwango kinachoeleweka kwa msomaji wa kawaida; tanbihi zinafafanua nahau na ambiguiti halisi za Kiebrania.
