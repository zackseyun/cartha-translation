source:
  edition: WLC
  text: וּ/סְקַלְתּ֥/וֹ בָ/אֲבָנִ֖ים וָ/מֵ֑ת כִּ֣י בִקֵּ֗שׁ לְ/הַדִּֽיחֲ/ךָ֙ מֵ/עַל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/מּוֹצִיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/011.yaml
  text: You shall stone him with stones[a], and he shall die, because he sought to drive you away from Yahweh your God, who brought you out from the land of Egypt[b], out of the house of slavery.
translation:
  language: sw
  text: Utampiga kwa mawe, naye atakufa, kwa sababu alitafuta kukukengeusha mbali na Yahwe Mungu wako,[a] aliyekutoa kutoka nchi ya Misri, kutoka katika nyumba ya utumwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kukupotosha mbali na Yahwe Mungu wako,” au “kukushawishi umwache Yahwe Mungu wako.”
    reason: lexical_alternative
  - marker: b
    text: “Nyumba ya utumwa” ni kauli ya agano inayokumbusha jinsi Israeli ilivyokombolewa kutoka utumwani Misri.
    reason: cultural_note
lexical_decisions:
- source_word: וּסְקַלְתּוֹ בָאֲבָנִים
  choice: Utampiga kwa mawe
  rationale: Kauli hii ya kisheria ina nguvu ya agizo. “Kumpiga kwa mawe” ni usemi wa kawaida wa Kiswahili unaobainisha njia ya hukumu bila kuongeza matokeo, kwa kuwa kifo kinatajwa katika kishazi kinachofuata.
- source_word: וָמֵת
  choice: naye atakufa
  rationale: Inahifadhi matokeo ya kupigwa kwa mawe kama kishazi tofauti, sawasawa na mfuatano na uzito wa kisheria wa Kiebrania.
- source_word: כִּי בִקֵּשׁ
  choice: kwa sababu alijaribu
  rationale: כִּי inatoa sababu ya hukumu, na בִּקֵּשׁ hapa inaonyesha nia au jaribio la makusudi. “Alijaribu” ni ya asili zaidi katika Kiswahili kuliko tafsiri neno kwa neno “alitafuta.”
- source_word: לְהַדִּיחֲךָ מֵעַל
  choice: kukupotosha umwache
  rationale: Kauli hii huonyesha kumsababisha mtu aondoke au apotoke kutoka katika uaminifu wa agano. Tafsiri hii ni wazi kwa msomaji wa sasa huku ikihifadhi wazo la kumwondoa mtu kwa Mungu wake.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahwe Mungu wako
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe,” na kiambishi cha nafsi ya pili umoja katika אֱלֹהֶיךָ kimehifadhiwa kwa “Mungu wako.”
- source_word: הַמּוֹצִיאֲךָ
  choice: aliyekutoa
  rationale: Kivumishi-tenda cha Kiebrania kinamtambulisha Yahwe kwa tendo lake la kihistoria la ukombozi; wakati uliopita ni wa kawaida na wazi katika Kiswahili.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Pamoja na kitenzi “aliyekutoa,” “katika nchi ya Misri” ni muundo wa kawaida wa Kiswahili unaoonyesha mahali walikotolewa.
- source_word: מִבֵּית עֲבָדִים
  choice: kutoka katika nyumba ya utumwa
  rationale: “Nyumba ya utumwa” inahifadhi taswira na kauli ya agano ya Kiebrania huku ikieleweka kuwa Misri ilikuwa mahali pa utumwa.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo tu. “Yahwe” hulihifadhi kwa kutoholewa bila kulibadilisha kuwa cheo.
- issue: Lugha ya uasi wa agano katika לְהַדִּיחֲךָ מֵעַל יְהוָה
  choice: kukupotosha umwache Yahwe
  alternative: kukushawishi uondoke kwa Yahwe; kukuongoza upotee mbali na Yahwe
  rationale: Uchaguzi huu unaonyesha jaribio la kumtoa mtu katika uaminifu kwa Yahwe bila kuingiza istilahi za kiteolojia zisizotajwa moja kwa moja katika mstari.
- issue: Kauli ya ukombozi מִבֵּית עֲבָדִים
  choice: kutoka katika nyumba ya utumwa
  alternative: kutoka katika nyumba ya watumwa
  rationale: “Nyumba ya utumwa” huhifadhi sitiari ya Kiebrania na kukazia hali ya utumwa, huku ikidumisha mwangwi wa kauli ya agano kuhusu ukombozi kutoka Misri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa wasomaji wa kawaida. Nafsi ya pili umoja ya Kiebrania imehifadhiwa. Alama za tanbihi [a] na [b] zimewekwa moja kwa moja baada ya vifungu vinavyofafanuliwa.
