language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הַ/נָּבִ֣יא הַ/ה֡וּא א֣וֹ חֹלֵם֩ הַ/חֲל֨וֹם הַ/ה֜וּא יוּמָ֗ת כִּ֣י דִבֶּר סָ֠רָה עַל יְהוָ֨ה אֱלֹֽהֵי/כֶ֜ם הַ/מּוֹצִ֥יא אֶתְ/כֶ֣ם מֵ/אֶ֣רֶץ מִצְרַ֗יִם וְ/הַ/פֹּֽדְ/ךָ֙ מִ/בֵּ֣ית עֲבָדִ֔ים לְ/הַדִּֽיחֲ/ךָ֙ מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֧ר צִוְּ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָ/לֶ֣כֶת בָּ֑/הּ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/006.yaml
  text: But that prophet[a], or that dreamer of dreams, shall be put to death, because he has spoken rebellion against Yahweh your God, who brought you out from the land of Egypt and redeemed you from the house of slavery, to drive you from the way in which Yahweh your God commanded you to walk[b]. So you shall purge the evil from your midst.
translation:
  language: sw
  text: Lakini nabii huyo, au mwotaji wa ndoto huyo, anapaswa kuuawa, kwa sababu amesema maneno ya uasi[a] dhidi ya Yahwe, Mungu wenu, aliyewatoa katika nchi ya Misri na aliyekukomboa kutoka katika nyumba ya utumwa[b], kwa kusudi la kukupotosha kutoka katika njia ambayo Yahwe, Mungu wako, alikuamuru uifuate. Hivyo utaondoa uovu kutoka katikati yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza pia kutafsiriwa “uasi wa kuacha uaminifu wa agano.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kihalisi: “nyumba ya watumwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנָּבִיא הַהוּא אוֹ חֹלֵם הַחֲלוֹם הַהוּא
  choice: Lakini nabii huyo au mwotaji huyo wa ndoto
  rationale: ‘Lakini’ linaunganisha hukumu hii kwa hali iliyotangulia kwa mkazo wa kinyume. ‘Mwotaji huyo wa ndoto’ linadumisha nahau na mkazo wa kiashiria cha Kiebrania kwa Kiswahili kinachoeleweka.
- source_word: יוּמָת
  choice: atauawa
  rationale: Umbo la Hophal ni la kutendwa na linaonyesha hukumu ya kuuawa, si kufa kwa kawaida.
- source_word: כִּי דִבֶּר סָרָה
  choice: kwa sababu amesema maneno ya uasi
  rationale: סָרָה hapa ni uasi au kuasi uaminifu wa agano. ‘Amesema maneno ya uasi’ ni ya asili zaidi kwa Kiswahili kuliko ‘amesema uasi’ huku ikihifadhi tendo la kusema.
- source_word: עַל יְהוָה אֱלֹהֵיכֶם
  choice: dhidi ya Yahwe Mungu wenu
  rationale: Katika muktadha huu עַל ina maana ya upinzani. Jina la agano יְהוָה limetafsiriwa ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: הַמּוֹצִיא אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: aliyewatoa katika nchi ya Misri
  rationale: Hii inadumisha lugha ya kawaida ya kutoka Misri na wingi wa kiwakilishi katika Kiebrania.
- source_word: וְהַפֹּדְךָ מִבֵּית עֲבָדִים
  choice: na aliyekukomboa kutoka nyumba ya utumwa
  rationale: פּדה ni kukomboa au kulipia ukombozi. ‘Nyumba ya utumwa’ ni nahau ya Kiswahili inayoeleweka na bado inadumisha picha ya ‘nyumba’ iliyo katika Kiebrania.
- source_word: לְהַדִּיחֲךָ מִן הַדֶּרֶךְ
  choice: ili akupotoshe kutoka katika njia
  rationale: Hiphil ya נדח ina wazo la kumsababisha mtu aondoke au apotoke. ‘Akupotoshe kutoka katika njia’ hudumisha nguvu ya kisababishi na mfano wa njia.
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ לָלֶכֶת בָּהּ
  choice: ambayo Yahwe Mungu wako alikuamuru uifuate
  rationale: Kiebrania kinasema kihalisi ‘kutembea ndani yake’; ‘kuifuata njia’ ni Kiswahili cha sasa na cha kawaida kinachohifadhi mfano wa mwenendo wa maisha bila kuwa na muundo usio wa asili.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Hivyo utaondoa uovu kutoka katikati yako
  rationale: Katika kanuni hii ya kisheria ya Kumbukumbu la Torati, בער humaanisha kuondoa kabisa. ‘Utaondoa uovu’ ni wazi na cha heshima bila kuingiza wazo lisilokusudiwa la kuchoma.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina la agano moja kwa moja; ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya סָרָה katika usemi דִבֶּר סָרָה
  choice: maneno ya uasi
  alternative: maneno ya kuasi imani
  rationale: ‘Uasi’ hudumisha maana ya kupinga na kuacha uaminifu wa agano bila kuufunga usemi kwa istilahi ya dhehebu.
- issue: Mabadiliko kutoka wingi kwenda umoja katika kumwambia msikilizaji
  choice: wenu/aliyewatoa, kisha kukukomboa/Mungu wako/utaondoa
  alternative: Kusawazisha viwakilishi vyote viwe vya wingi
  rationale: Kiebrania hubadilika kwa makusudi kutoka wingi kwenda umoja wa mgawanyo. Rasimu inadumisha mvutano huo wa kisarufi badala ya kuufuta kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kisheria umehifadhiwa bila kuwa mzito kupita kiasi. Mabadiliko ya Kiebrania kutoka ‘wenu/aliwatoa’ kwenda umoja ‘kuku-/wako/yako’ yamehifadhiwa, ingawa yanaonekana wazi katika Kiswahili.
