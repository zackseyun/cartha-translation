base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/005.yaml
  text: You shall walk after Yahweh your God and fear him[a], and keep his commandments and listen to his voice, and serve him[c][b], and cling to him.
translation:
  language: sw
  text: Mtembee mkimfuata Yahweh Mungu wenu[a], mwogope, mzishike amri zake, msikilize sauti yake[b], mtumikie, na mshikamane naye[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtembee baada ya Yahweh Mungu wenu.” Kiebrania husema kihalisi, “tembeeni baada ya Yahweh Mungu wenu.”
    reason: lexical_alternative
  - marker: b
    text: “Kusikiliza sauti yake” kunaweza pia kuwa na maana ya “kuitii sauti yake” au “kumtii.”
    reason: lexical_alternative
  - marker: c
    text: Au, “mng’ang’anie” au “mshike sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי ... תֵּלֵכוּ
  choice: Tembeeni kwa kumfuata
  rationale: Muundo huu unahifadhi picha ya Kiebrania ya ‘kutembea baada ya’ huku ukitoa Kiswahili cha kawaida kinachoeleza ufuasi na uaminifu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Huhifadhi nafsi ya pili wingi na uhusiano wa agano katika usemi wa Kiebrania.
- source_word: תִירָאוּ
  choice: mwogope
  rationale: Neno hili linahifadhi uzito wa hofu, kicho, na heshima kwa Mungu bila kupunguza maana kuwa heshima pekee.
- source_word: מִצְוֺתָיו ... תִּשְׁמֹרוּ
  choice: mzishike amri zake
  rationale: ‘Kushika amri’ ni Kiswahili cha kawaida cha kibiblia kinachowasilisha maana ya kuzitunza na kuzitii.
- source_word: וּבְקֹלוֹ תִּשְׁמָעוּ
  choice: msikilize sauti yake
  rationale: Huhifadhi maneno halisi ya Kiebrania; katika muktadha kusikiliza huku pia kunadokeza kutii.
- source_word: תַעֲבֹדוּ
  choice: mtumikie
  rationale: ‘Kutumikia’ ni pana kuliko ‘kuabudu’ pekee na huhifadhi vipengele vya huduma, ibada, na uaminifu wa agano.
- source_word: תִדְבָּקוּן
  choice: mshikamane naye
  rationale: Hutoa kwa Kiswahili cha asili wazo la kushikamana kwa karibu na kwa uaminifu, bila kulifanya kuwa muungano wa aina maalumu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandiko ya Kiebrania yana jina binafsi la Mungu; kulitohowa kama ‘Yahweh’ huhifadhi jina hilo badala ya kuweka cheo mahali pake.
- issue: Iwapo שׁמע בְּקוֹל itafsiriwe moja kwa moja kuwa kutii
  choice: msikilize sauti yake
  alternative: mtii / itii sauti yake
  rationale: Kifungu hicho kinahusisha utii, lakini maneno yake ya moja kwa moja yanataja kuisikiliza sauti; tafsiri kuu inahifadhi picha hiyo na tanbihi inaeleza maana inayodokezwa.
- issue: Upeo wa עבד inapomhusu Mungu
  choice: mtumikie
  alternative: mwabudu
  rationale: Kitenzi kinaweza kuhusisha ibada, lakini pia huduma na uaminifu kwa Mungu; ‘mtumikie’ huepuka kuifinya maana kuwa ibada ya kidini pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Mfululizo wa vitenzi vya amri kwa wingi unahifadhi wito wa moja kwa moja kwa Israeli. Alama za tanbihi zimewekwa mara tu baada ya vifungu vinavyohusika.
