base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/009.yaml
  text: You shall not yield to him or listen to him[a], and your eye shall not pity him, and you shall not spare[c][b], and you shall not conceal him.
translation:
  language: sw
  text: Usimkubalie wala usimsikilize,[a] na jicho lako lisimwonee huruma;[b] wala usimhurumie, usimfiche.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usikubaliane naye.” Kitenzi cha Kiebrania kinaweza kumaanisha kuwa tayari, kukubali, au kuridhia.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “jicho lako lisimwonee huruma.” Hii ni nahau ya Kiebrania inayokataza kumtazama kwa huruma yenye kusababisha kumwachilia.
    reason: cultural_note
  - marker: c
    text: Au, “usimfunike”—yaani, usimfiche wala kufunika kosa lake.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאבֶה לּוֹ
  choice: usimkubalie
  rationale: Kitenzi אָבָה kinaweza kumaanisha kuwa tayari, kukubali, au kuridhia. Katika muktadha wa kushawishiwa kuiacha imani, “usimkubalie” linaeleza kukataa kuridhia ushawishi wake bila kuongeza wazo la kumtii kabisa.
- source_word: תִשְׁמַע אֵלָיו
  choice: usimsikilize
  rationale: שׁמע pamoja na אֶל humaanisha kusikiliza au kutega sikio kwa makusudi. “Usimsikilize” ni Kiswahili cha kawaida na huhifadhi maana hiyo bila kuitafsiri kwa nguvu zaidi kuwa “usimtii.”
- source_word: תָחוֹס עֵינְךָ עָלָיו
  choice: jicho lako lisimhurumie
  rationale: חוּס hueleza kumwonea huruma au kumwacha mtu, na maandishi yanataja jicho waziwazi. Tafsiri hii inadumisha taswira ya Kiebrania badala ya kuifupisha kuwa amri ya jumla tu.
- source_word: תַחְמֹל
  choice: usimwache
  rationale: חמל inaweza kumaanisha kuhurumia au kuacha bila kumdhuru. “Usimwache” huitofautisha na חוּס iliyotangulia huku ikihifadhi mkusanyiko wa makatazo.
- source_word: תְכַסֶּה עָלָיו
  choice: usimfiche
  rationale: כסה katika Piel hapa ni kufunika au kuficha, yaelekea kwa maana ya kumficha mkosaji au kufunika kosa lake. “Usimfiche” ni fupi na hudumisha nguvu ya kisheria ya kifungu.
theological_decisions:
- issue: Lugha kali ya hukumu ya agano kuhusu mtu anayeshawishi uasi
  choice: Kudumisha makatazo ya moja kwa moja na mfuatano wake bila kuyapunguza makali.
  alternative: Kuyafafanua kama kukataa tu kihisia, au kuyafupisha kuwa “usimlinde.”
  rationale: Katika muktadha huu wa kisheria, msikilizaji anaagizwa asikubali ushawishi, asimsikilize, asimhurumie, asimwache, wala asimfiche mkosaji. Tafsiri hailainishi uzito wa maandishi wala kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfuatano wa makatazo umehifadhiwa; taswira ya “jicho” imeachwa katika maandishi na kufafanuliwa katika tanbihi.
