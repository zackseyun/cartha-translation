review_pass:
  verdict: revise
  source_fidelity: The draft preserves the referents, repeated sword idiom, comprehensive scope (city, contents, and livestock), and the severe force of the command. However, “uutoe mji huo kwa ajili ya kuangamizwa kabisa” is not idiomatic Swahili and weakens the technical-sacral force of החרם by sounding like a mere transfer or surrender.
  naturalness: “Ni lazima kabisa uwapige” is understandable but less direct and natural for an emphatic biblical command than “Hakika utawapiga.” The proposed revision uses clear Standard East African Swahili while retaining the source's repetition and gravity.
  terminology: “Kuweka wakfu kwa maangamizi” conveys the irrevocable devotion implicit in החרם more accurately than “kutoa ... kwa ajili ya kuangamizwa.” The explanatory note gives the alternative technical expression without imposing it in the main text. The sword idiom is rendered consistently as “kwa makali ya upanga.”
  issues:
  - severity: medium
    issue: The rendering of החרם is semantically and idiomatically weak.
    rationale: “Uutoe mji huo kwa ajili ya kuangamizwa kabisa” can suggest handing the city over, whereas the Hebrew Hiphil of חרם denotes placing it under irrevocable devotion to destruction. “Uuweke wakfu kwa maangamizi” better retains this element.
  - severity: low
    issue: The first command is unnecessarily periphrastic.
    rationale: “Ni lazima kabisa” expresses obligation, but “Hakika utawapiga” more naturally represents the emphatic infinitive absolute plus imperfect in a direct command context.
  - severity: low
    issue: The first footnote begins with an unnatural phrase.
    rationale: “Kwa neno” does not introduce a literal rendering naturally here. “Yaani” clearly introduces the literal Hebrew idiom.
