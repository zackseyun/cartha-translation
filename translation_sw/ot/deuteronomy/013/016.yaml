- from: Ni lazima kabisa uwapige wakazi wa mji huo kwa makali ya upanga[a]; uutoe mji huo kwa ajili ya kuangamizwa kabisa[b], pamoja na kila kitu kilicho ndani yake na mifugo yake, kwa makali ya upanga.
