  rationale: The revision improves idiomatic Swahili and more faithfully represents החרם as an irrevocable devotion to destruction. It retains the emphatic opening, the repeated sword phrase, the full scope of destruction, and the original's grave register. Footnote anchors remain correctly attached to the sword idiom and חרם respectively.
