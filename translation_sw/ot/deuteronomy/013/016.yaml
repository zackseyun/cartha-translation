  text: הַכֵּ֣ה תַכֶּ֗ה אֶת יֹֽשְׁבֵ֛י הָ/עִ֥יר ה/הוא לְ/פִי חָ֑רֶב הַחֲרֵ֨ם אֹתָ֧/הּ וְ/אֶת כָּל אֲשֶׁר בָּ֛/הּ וְ/אֶת בְּהֶמְתָּ֖/הּ לְ/פִי חָֽרֶב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/016.yaml
  text: You shall surely strike the inhabitants of that city with the edge of the sword[a], devoting it to destruction, along with all that is in it and its livestock[b], with the edge of the sword.
translation:
  language: sw
  text: Hakika utawapiga wakazi wa mji huo kwa makali ya upanga[a]. Uuweke mji huo wakfu kwa maangamizi[b], pamoja na kila kitu kilicho ndani yake na mifugo yake, kwa makali ya upanga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, “kwa kinywa cha upanga,” nahau ya Kiebrania inayomaanisha kwa makali ya upanga.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania humaanisha kuweka kitu wakfu bila kubatilika kwa maangamizi; pia kinaweza kutafsiriwa “ukiweke chini ya ḥerem.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה תַכֶּה
  choice: Ni lazima kabisa uwapige
  rationale: Muundo wa kitenzi-jina kisicho na ukomo pamoja na kitenzi unaimarisha amri. “Ni lazima kabisa” huonyesha msisitizo huo kwa Kiswahili cha kawaida bila kupunguza nguvu ya agizo.
- source_word: יֹשְׁבֵי הָעִיר הַהוּא
  choice: wakazi wa mji huo
  rationale: “Wakazi” hutoa kwa uwazi maana ya wale wanaokaa katika mji, kwa lugha ya sasa na ya kawaida.
- source_word: לְפִי חָרֶב
  choice: kwa makali ya upanga
  rationale: Nahau hiyo ina maana ya kuua kwa upanga. “Kwa makali ya upanga” huhifadhi taswira halisi kuliko tafsiri tambarare ya “kwa upanga”; pia imerudiwa kama ilivyo katika Kiebrania.
- source_word: הַחֲרֵם
  choice: uutoe mji huo kwa ajili ya kuangamizwa kabisa
  rationale: Kitenzi hiki katika Hiphil humaanisha kuweka kitu chini ya ḥerem, yaani kukitoa bila kubatilika ili kiangamizwe. Kauli hii huhifadhi wazo la kukitoa pamoja na matokeo ya maangamizi kamili, bila kutumia istilahi isiyoeleweka.
- source_word: אֹתָהּ
  choice: mji huo
  rationale: Kiwakilishi cha kike cha umoja kinarejelea mji. Kurudia “mji huo” huondoa utata wa kisarufi katika Kiswahili.
- source_word: וְאֶת כָּל אֲשֶׁר בָּהּ
  choice: pamoja na kila kitu kilicho ndani yake
  rationale: Kauli hii huonyesha kwamba agizo linahusu vyote vilivyomo mjini, si wakazi peke yao.
- source_word: בְּהֶמְתָּהּ
  choice: mifugo yake
  rationale: בְּהֵמָה hapa ni jina la jumla kwa wanyama wa kufugwa; “mifugo” ni pana na ya asili kuliko “ng’ombe” pekee.
theological_decisions:
- issue: Maana ya חרם katika muktadha wa vita na hukumu
  choice: uutoe mji huo kwa ajili ya kuangamizwa kabisa
  alternative: uuharibu kabisa; uuweke chini ya marufuku
  rationale: Tafsiri iliyochaguliwa huhifadhi wazo la kiibada la kukitoa kitu bila kubatilika pamoja na maangamizi yake, badala ya kukifanya kitendo cha kawaida cha kijeshi tu. Pia huepuka neno “marufuku,” ambalo halielezi maana vizuri kwa msomaji wa sasa.
- issue: Kuhifadhi ukali wa lugha ya hukumu
  choice: Kutoa amri kwa nguvu kamili bila kuipunguza
  alternative: Kutumia lugha laini kama “uwashinde”
  rationale: Kiebrania kinaagiza mashambulizi ya kuua na maangamizi kamili. Tafsiri laini ingeondoa uzito na mvutano wa kimaadili na kiteolojia uliomo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Msisitizo wa amri, urudiaji wa “kwa makali ya upanga,” na ukali wa hukumu vimehifadhiwa. Istilahi ya kiufundi ḥerem imeelezwa katika tanbihi badala ya kuingizwa kama neno geni katika matini kuu.
