base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/010.yaml
  text: For you must surely put him to death; your hand shall be first against him to put him to death[a], and afterward the hand of all the people.
translation:
  language: sw
  text: Kwa maana lazima umuue[a]; mkono wako uwe wa kwanza kumwua, na baadaye mikono ya watu wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakika utamuua.” Kiebrania hutumia infinitivu kamili pamoja na kitenzi chenye kikomo ili kutia mkazo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu au ufafanuzi wa amri iliyotangulia na kuhifadhi uhusiano wa kimantiki kwa Kiswahili cha kawaida.
- source_word: הָרֹג תַּהַרְגֶנּוּ
  choice: ni lazima umuue
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi chenye kikomo unasisitiza wajibu au uhakika wa tendo; ‘ni lazima’ huonyesha msisitizo huo kwa lugha ya asili.
- source_word: יָדְךָ
  choice: mkono wako
  rationale: Inahifadhi taswira halisi ya kisheria ya Kiebrania badala ya kuibadili kuwa kiwakilishi tu.
- source_word: תִּהְיֶה בּוֹ בָרִאשׁוֹנָה
  choice: utakuwa wa kwanza dhidi yake
  rationale: Inaonyesha kwamba mtu anayehusika ndiye anayepaswa kuanza kutekeleza hukumu, huku ikihifadhi lugha ya ‘mkono’ na maana ya kuelekezwa dhidi yake.
- source_word: לַהֲמִיתוֹ
  choice: ili kumuua
  rationale: Hifili ya מות humaanisha kusababisha kifo; hapa ni utekelezaji wa hukumu, na ‘ili kumuua’ ni wazi na ya kawaida bila kuficha ukali wa maandishi.
- source_word: וְיַד כָּל הָעָם
  choice: kisha mkono wa watu wote
  rationale: Inahifadhi usambamba kati ya ‘mkono wako’ na ‘mkono wa watu wote’ pamoja na ushiriki wa jumuiya.
- source_word: בָּאַחֲרֹנָה
  choice: kisha
  rationale: Katika utofautishaji na ‘wa kwanza,’ neno hili linaonyesha hatua inayofuata kwa Kiswahili cha asili.
theological_decisions:
- issue: Kutafsiri lugha ya utekelezaji wa hukumu ya kifo bila kuipunguza wala kuitia chumvi
  choice: umuue / kumuua
  alternative: umwondoe uhai / kumwua kwa hukumu
  rationale: Kiebrania kinasema wazi kuhusu kusababisha kifo katika muktadha wa kisheria. ‘Kuua’ ni neno la moja kwa moja na la kawaida katika Kiswahili, bila kuongeza ufafanuzi wa kimadhehebu au kuficha maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Taswira ya ‘mkono’ imehifadhiwa kwa sababu ni muhimu katika mpangilio wa kisheria na usambamba wa mstari.
