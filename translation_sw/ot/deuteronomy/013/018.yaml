revisions:
- from: Wala chochote katika vile vilivyowekwa wakfu kwa kuangamizwa kisishikamane na mkono wako[a], ili Yahwe ageuke kutoka katika ukali wa hasira yake[b], akupe rehema, akuhurumie na akuzidishe, kama alivyowaapia baba zako.
  to: Wala chochote kilichowekwa wakfu kwa kuangamizwa kisishikamane na mkono wako[a], ili Yahweh ageuke kutoka katika ukali wa hasira yake[b], akupe rehema, akuhurumie, na akuzidishe, kama alivyowaapia baba zako.
  rationale: The revision repairs the opening partitive construction while preserving the Hebrew image that no devoted object may cling to the hearer's hand. It also makes the explanatory footnote for the Hebrew anger idiom more exact. No interpretive or doctrinal expansion has been introduced.
