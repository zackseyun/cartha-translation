id: DEU.13.18
reference: Deuteronomy 13:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לֹֽא יִדְבַּ֧ק בְּ/יָדְ/ךָ֛ מְא֖וּמָה מִן הַ/חֵ֑רֶם לְמַעַן֩ יָשׁ֨וּב יְהוָ֜ה מֵ/חֲר֣וֹן אַפּ֗/וֹ וְ/נָֽתַן לְ/ךָ֤ רַחֲמִים֙ וְ/רִֽחַמְ/ךָ֣ וְ/הִרְבֶּ֔/ךָ כַּ/אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/018.yaml
  text: And nothing from what is devoted to destruction shall cling to your hand[a], so that Yahweh may turn from the fierceness of his anger and show you mercy, and have compassion on you, and multiply you[b], just as he swore to your fathers.
translation:
  language: sw
  text: Wala chochote kilichowekwa wakfu kwa kuangamizwa kisishikamane na mkono wako[a], ili Yahweh ageuke kutoka katika ukali wa hasira yake[b], akupe rehema, akuhurumie, na akuzidishe, kama alivyowaapia baba zako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa namna ya kimapokeo zaidi, “chochote kilicho chini ya marufuku.” Neno la Kiebrania חֵרֶם humaanisha kitu kilichowekwa wakfu kwa Mungu bila kubatilishwa, mara nyingi ili kiangamizwe.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “moto wa pua yake”; hii ni nahau ya Kiebrania inayomaanisha hasira kali.
    reason: cultural_note
lexical_decisions:
- source_word: יִדְבַּק בְּיָדְךָ
  choice: kisishikamane na mkono wako
  rationale: Kitenzi דבק kina picha halisi ya kushikamana; pamoja na ‘mkono’ hapa kinamaanisha kutwaa au kubakiza kitu katika milki. Tafsiri hii inadumisha picha hiyo kwa Kiswahili cha kawaida.
- source_word: מְאוּמָה
  choice: chochote
  rationale: 'Pamoja na ukanushaji, neno hili linaonyesha katazo kamili: hata kitu kimoja hakipaswi kubaki.'
- source_word: הַחֵרֶם
  choice: vile vilivyowekwa wakfu kwa kuangamizwa
  rationale: חֵרֶם hurejelea vitu vilivyotengwa kwa Mungu bila kubatilishwa, katika muktadha huu ili viangamizwe. Kauli hii inaeleza maana hiyo bila kutumia istilahi isiyoeleweka kwa urahisi.
- source_word: לְמַעַן
  choice: ili
  rationale: ‘Ili’ linaonyesha kusudi au matokeo yanayokusudiwa kwa njia ya asili katika Kiswahili.
- source_word: יָשׁוּב יְהוָה מֵחֲרוֹן אַפּוֹ
  choice: Yahwe ageuke kutoka katika ukali wa hasira yake
  rationale: שׁוב מן ina maana ya kugeuka au kuacha hali fulani, na חֲרוֹן אַף ni nahau ya hasira kali. Tafsiri inadumisha uzito wa usemi bila kutafsiri kiungo cha mwili neno kwa neno.
- source_word: וְנָתַן לְךָ רַחֲמִים
  choice: akupe rehema
  rationale: Muundo wa Kiebrania unasema kihalisi ‘akupe rehema’; Kiswahili hiki ni wazi na pia kinadumisha muundo wa chanzo.
- source_word: וְרִחַמְךָ
  choice: akuhurumie
  rationale: Kitenzi hiki kinaendeleza na kusisitiza wazo la rehema lililotangulia bila kuyafanya maneno hayo mawili kuwa usemi mmoja tu.
- source_word: וְהִרְבֶּךָ
  choice: akuzidishe
  rationale: Hifili ya רבה humaanisha kufanya kuwa wengi au kuongeza. ‘Akuzidishe’ ni fupi, ya asili, na inadumisha mwangwi wa ahadi ya agano.
- source_word: כַּאֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ
  choice: kama alivyowaapia baba zako
  rationale: ‘Baba zako’ inadumisha rejeo maalumu kwa mababu wa agano, na umbo la ‘kuwaapia’ linawasilisha kiapo kilichoelekezwa kwao.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina la agano YHWH moja kwa moja; ‘Yahwe’ hulitambulisha kama jina maalumu badala ya cheo.
- issue: Maana ya חֵרֶם
  choice: vile vilivyowekwa wakfu kwa kuangamizwa
  alternative: vitu vilivyo chini ya marufuku; vilivyowekwa wakfu
  rationale: Katika muktadha huu vitu vimetengwa bila kubatilishwa na vinapaswa kuangamizwa. Tafsiri inaweka wazi vipengele vyote viwili bila kuongeza msimamo wa kimadhehebu.
- issue: Lugha ya hasira ya Mungu
  choice: ageuke kutoka katika ukali wa hasira yake
  alternative: aache hasira yake kali; ageuke kutoka katika hasira yake iwakayo
  rationale: Kauli hii inadumisha lugha ya kibinafsi na uzito wa hukumu ya Mungu, huku ikitoa nahau ya Kiebrania kwa Kiswahili kinachoeleweka.
- issue: אֲבֹתֶיךָ katika ahadi ya agano
  choice: baba zako
  alternative: mababu zako
  rationale: Neno la chanzo ni ‘baba,’ na hapa linarejelea waliopokea ahadi ya agano. Chaguo hili linadumisha umaalumu huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa umoja ‘wako/aku-’ unadumisha hotuba ya Kiebrania kwa Israeli kama jumuiya moja. Alama zote za tanbihi zimewekwa mahali zinapohusu moja kwa moja.
