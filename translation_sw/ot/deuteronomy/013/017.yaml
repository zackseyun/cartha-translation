base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/017.yaml
  text: You shall gather all its spoil into the middle of its open square[a], and you shall burn the city and all its spoil with fire as a whole offering to Yahweh your God. It shall remain a perpetual ruin mound[b]; it shall not be rebuilt again.
translation:
  language: sw
  text: Utakusanya nyara zake zote katikati ya uwanja wa wazi wa mji huo, kisha utateketeza kwa moto mji huo pamoja na nyara zake zote kama sadaka iliyoteketezwa kabisa kwa BWANA Mungu wako.[a] Mji huo utakuwa kilima cha magofu milele;[b] hautajengwa tena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utatekeleza hilo kabisa kwa ajili ya BWANA Mungu wako.” Neno la Kiebrania כָּלִיל linaweza kumaanisha “kabisa” au kitu kilichoteketezwa chote kama sadaka kwa Mungu.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “kilima milele” au “lundo la kudumu,” yaani, magofu yatakayobaki daima.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלָלָהּ
  choice: nyara zake
  rationale: Neno שָׁלָל humaanisha mali iliyotekwa katika vita. “Nyara” ni neno la kawaida na linalofaa katika muktadha huu wa sheria ya vita.
- source_word: תִּקְבֹּץ
  choice: utakusanya
  rationale: Kitenzi hiki ni Qal imperfect nafsi ya pili umoja wa kiume; katika agizo la kisheria, “utakusanya” huwasilisha amri kwa mtindo wa karibu na Kiebrania.
- source_word: אֶל תּוֹךְ רְחֹבָהּ
  choice: katikati ya uwanja wake
  rationale: רְחוֹב hapa inaelekea kumaanisha eneo pana la wazi la umma mjini, si barabara nyembamba. “Uwanja” ni tafsiri ya asili katika Kiswahili cha Afrika Mashariki.
- source_word: וְשָׂרַפְתָּ בָאֵשׁ
  choice: utateketeza kwa moto
  rationale: Usemi huu unaonyesha kuangamiza kwa moto. “Kutekeza kwa moto” huhifadhi nguvu ya tendo na husikika kwa kawaida katika Kiswahili.
- source_word: כָּלִיל
  choice: kama sadaka iliyoteketezwa kabisa
  rationale: כָּלִיל inaweza kueleweka kama kielezi, “kabisa,” au kuwa na mwangwi wa dhabihu iliyoteketezwa yote kwa Mungu. Tafsiri hii huhifadhi dhana ya kuwekwa wakfu kwa kuteketezwa kabisa bila kuuita mji moja kwa moja sadaka ya kuteketezwa ya kiibada.
- source_word: לַיהוָה
  choice: kwa BWANA
  rationale: Kiambishi ל־ hapa kinaonyesha kuelekezwa au kuwekwa wakfu kwa Mungu. Jina la agano יהוה limetafsiriwa kwa mtindo wa kawaida wa Kiswahili wa “BWANA.”
- source_word: תֵּל עוֹלָם
  choice: kilima cha magofu milele
  rationale: תֵּל ni kilima au lundo, mara nyingi la mabaki ya mji uliobomolewa; עוֹלָם hapa huonyesha hali ya kudumu. Tafsiri hii huhifadhi picha halisi na wazo la uharibifu wa kudumu.
- source_word: לֹא תִבָּנֶה עוֹד
  choice: hautajengwa tena
  rationale: Nifal huonyesha kwamba mji hautajengwa upya, na עוֹד humaanisha “tena.” Kiswahili hiki ni cha moja kwa moja na cha kawaida.
theological_decisions:
- issue: Nguvu ya kidhabihu ya כָּלִיל katika amri ya kuuteketeza mji
  choice: “kama sadaka iliyoteketezwa kabisa kwa BWANA Mungu wako”
  alternative: “kabisa kwa ajili ya BWANA Mungu wako”
  rationale: Muktadha wa kuelekeza uteketezaji huo kwa BWANA unaruhusu mwangwi wa sadaka iliyotolewa yote, lakini neno pia linaweza kuwa kielezi kinachosisitiza ukamilifu wa uharibifu. Tafsiri kuu huhifadhi mwangwi wa kidini, na tanbihi huhifadhi usomaji wa kielezi bila kuamua kimya kimya kati ya maana hizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “BWANA” kwa herufi kubwa limetumiwa kwa יהוה. Muundo wa agizo kwa wakati ujao umehifadhi mtindo wa sheria wa Kiebrania; maneno ya kiufundi kupita kiasi yameepukwa.
