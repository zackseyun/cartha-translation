    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: ikatimia
  rationale: Ingawa kitenzi hiki kimsingi ni ‘ikaja,’ katika muktadha wa ishara iliyotabiriwa kinamaanisha kwamba jambo hilo limetokea kama lilivyosemwa. ‘Ikatimia’ ni Kiswahili cha kawaida na wazi.
- source_word: הָאוֹת וְהַמּוֹפֵת
  choice: ishara au ajabu
  rationale: Jozi hii ya Kiebrania hutaja uthibitisho wa kiishara au tukio la kustaajabisha. ‘Au’ huonyesha maana ya kimuktadha kwamba mojawapo ya aina hizi inaweza kutimia; maana halisi ya ‘na’ imehifadhiwa katika tanbihi.
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: ambayo alikuambia habari yake
  rationale: Huwasilisha kishazi rejeshi na wazo la jambo ambalo msemaji alikuwa amemweleza msikilizaji, kwa Kiswahili cha asili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Ni utangulizi wa kawaida wa maneno yaliyonukuliwa.
- source_word: נֵלְכָה אַחֲרֵי
  choice: Twende tufuate
  rationale: Huhifadhi mwito wa pamoja wa kohotativi pamoja na maana ya kumfuata mtu au kitu kwa uaminifu wa kidini, bila kutumia tungo nzito isiyo ya kawaida.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya usemi wa agano unaotokea mara nyingi katika Kumbukumbu la Torati.
- source_word: אֲשֶׁר לֹא יְדַעְתָּם
  choice: ambayo hamkuijua
  rationale: ‘Kujua’ huhifadhi maana pana ya kufahamu au kutambua miungu hiyo bila kuongeza ufafanuzi wa kidhehebu. Upatanisho wa ngeli katika Kiswahili huleta ‘ambayo’ na ‘-ijua’ kwa ‘miungu.’
- source_word: וְנָעָבְדֵם
  choice: na tuitumikie
  rationale: ‘Kutumikia’ hudumisha maana pana ya עבד ya huduma na utiifu wa kidini; ‘kuiabudu’ ni maana halali ya kimuktadha na imewekwa katika tanbihi.
theological_decisions:
- issue: Namna ya kutaja miungu ya uongo katika kishazi ‘ambayo hamkuijua’
  choice: miungu mingine ambayo hamkuijua
  alternative: miungu mingine ambao hamkuwajua
  rationale: Upatanisho wa ngeli wa kawaida wa Kiswahili (‘ambayo ... hamkuijua’) hauipi miungu hiyo hadhi ya kibinadamu, huku ukihifadhi dai la Kiebrania kwamba wasikilizaji hawakuwa wameijua. Hata hivyo, tofauti ya ‘ambayo/ambao’ haiwezi kubeba kikamilifu mvutano uleule wa Kiingereza wa ‘which/whom,’ hivyo hakuna dai la ziada la kiteolojia linalowekwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Twende tufuate’ ni cha kawaida kuliko ‘twende nyuma ya’ na bado huhifadhi wazo la kufuata kwa uaminifu. Alama zote za tanbihi zimewekwa baada ya maneno yanayohusika.
