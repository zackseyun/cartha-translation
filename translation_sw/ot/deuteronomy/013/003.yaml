  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na hiyo ishara na ajabu ikatimia.” Kiebrania kina “na,” lakini jozi hii mara nyingi hutumiwa kwa maana ya “ishara au ajabu.”
