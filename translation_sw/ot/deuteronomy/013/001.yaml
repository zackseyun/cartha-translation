base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/001.yaml
  text: Every word that I am commanding you[a], you shall be careful to do. You shall not add to it[b], and you shall not take away from it.
translation:
  language: sw
  text: Neno lote ninalowaamuru[a], mtakuwa waangalifu kulitenda. Msiliongezee[b], wala msipunguze chochote kutoka katika hilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kila neno ninalowaamuru.” Kiebrania kina umoja wenye maana ya kijumla, kihalisi “neno lote.”
    reason: lexical_alternative
  - marker: b
    text: Katika baadhi ya mapokeo ya upangaji wa mistari, mstari huu umehesabiwa kuwa Kumbukumbu la Torati 12:32.
    reason: textual_variant
lexical_decisions:
- source_word: כָּל הַדָּבָר
  choice: Neno lote
  rationale: Huhifadhi umoja wa kijumla wa Kiebrania badala ya kuugeuza kuwa wingi; katika Kiswahili, ‘neno lote’ ni la asili zaidi kuliko ‘kila neno’ kwa muundo huu.
- source_word: מְצַוֶּה אֶתְכֶם
  choice: ninalowaamuru
  rationale: Muundo wa wakati wa sasa unaonyesha tendo la kuamuru linaloendelea au la wakati huu, na kiambishi ‘-wa-’ kinawakilisha wazi walengwa wa wingi.
- source_word: תִשְׁמְרוּ לַעֲשׂוֹת
  choice: mtakuwa waangalifu kulitenda
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya nahau ya kutunza kwa makini ili kutenda, huku ikidumisha nguvu ya wajibu.
- source_word: לֹא תֹסֵף עָלָיו
  choice: Msiliongezee
  rationale: Kitenzi ‘-ongezea’ chenye kiwakilishi cha yambwa ‘-li-’ kinaonyesha kwa usahihi kuongeza kitu juu ya neno hilo.
- source_word: וְלֹא תִגְרַע מִמֶּנּוּ
  choice: wala msilipunguzie
  rationale: ‘Kupunguzia’ huonyesha kuondoa au kupunguza sehemu ya kitu, na ‘wala’ huendeleza katazo la pili kwa kawaida.
- source_word: אָנֹכִי
  choice: ni- katika ‘ninalowaamuru’
  rationale: Kiswahili huonyesha nafsi ya kwanza kwa kiambishi cha kitenzi; hakuna haja ya kuongeza ‘mimi’ isipokuwa msisitizo mkubwa ungetakiwa.
theological_decisions:
- issue: Umoja wa kijumla wa ‘neno’
  choice: Neno lote
  alternative: Kila neno; yote ninayowaamuru
  rationale: Chaguo hili huhifadhi umbo la umoja katika Kiebrania na halipanui kimafundisho ‘neno’ kuwa orodha maalumu ya amri.
- issue: Nafasi ya mstari katika mgawanyo wa sura
  choice: Kutafsiri agizo hili kama sentensi kamili bila kuingiza habari ya mstari unaofuata
  alternative: Kulihusisha wazi zaidi na sehemu iliyotangulia kama Kumbukumbu la Torati 12:32
  rationale: Maandishi ya Kiebrania yana agizo kamili; tofauti ya upangaji wa mistari inaelezwa katika tanbihi badala ya kubadili matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘Neno lote’ umechaguliwa ili kuhifadhi umoja wa kijumla wa chanzo; ‘mtakuwa waangalifu kulitenda’ hutoa nahau ya Kiebrania kwa uwazi bila kuwa ya mazungumzo kupita kiasi.
