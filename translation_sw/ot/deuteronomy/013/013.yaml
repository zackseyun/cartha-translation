  yaml_path: translation/ot/deuteronomy/013/013.yaml
  text: If you hear it said in one of your cities that Yahweh your God is giving you to dwell there[a], saying[b],
translation:
  language: sw
  text: 'Ukisikia[a] ikisemwa katika mojawapo ya miji yako ambayo Yahwe, Mungu wako, anakupa ili ukae humo,[b] kwamba:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Unaposikia”—neno la Kiebrania linaweza kuanzisha kishazi cha sharti au cha wakati katika sheria.
    reason: lexical_alternative
  - marker: b
    text: Au, “uishi humo” au “ufanye makao humo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Uki-
  rationale: Katika sheria hii, kiunganishi hiki kinaanzisha hali inayowezekana. Muundo wa masharti wa Kiswahili “uki-” ni wa kawaida na pia unaruhusu kwa kiasi maana ya wakati.
- source_word: תִשְׁמַע
  choice: sikia
  rationale: Kitenzi hapa kinamaanisha kupokea habari, si kutii. “Sikia” kinaendelezwa kwa kawaida na “ikisemwa” ili kuonyesha kuwa kinachosikiwa ni taarifa.
- source_word: בְּאַחַת עָרֶיךָ
  choice: katika mojawapo ya miji yako
  rationale: עִיר linaweza kumaanisha mji mkubwa au mdogo; “miji” ni neno pana na la kawaida katika muktadha huu wa makazi ya Israeli.
- source_word: אֲשֶׁר
  choice: ambayo
  rationale: Kiwakilishi hiki kinaanzisha kishazi kinachoieleza “miji yako.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Huhifadhi usemi wa agano na mazungumzo ya moja kwa moja kwa nafsi ya pili umoja.
- source_word: נֹתֵן לְךָ
  choice: anakupa
  rationale: Wakati wa sasa wa Kiswahili unaonyesha tendo linaloendelea au lililo tabia, kulingana na participle ya Kiebrania.
- source_word: לָשֶׁבֶת שָׁם
  choice: ukae humo
  rationale: Muundo huu unaonyesha kusudi la kupewa miji hiyo. “Kukaa humo” ni wa asili, wenye heshima, na hauzuii maana ya kuishi au kufanya makazi.
- source_word: לֵאמֹר
  choice: 'kwamba:'
  rationale: Neno hili linatanguliza yaliyomo katika taarifa itakayofuata. “Kwamba:” ni mpito wa kawaida wa Kiswahili, huku “ikisemwa” ikikamilisha kisintaksia tendo la kusikia.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni kama jina binafsi. “Yahwe” hulihifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Ikiwa כִּי ina maana ya sharti au wakati
  choice: Ukisikia
  alternative: Unaposikia
  rationale: Muktadha wa sheria ya hali unaunga mkono sharti, lakini maana ya wakati bado inawezekana; kwa hiyo imehifadhiwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inaeleweka kwa wasomaji wa kawaida. Muundo “ikisemwa ... kwamba” umetumiwa ili taarifa inayosikiwa iwe wazi bila kuondoa uhusiano wa sentensi na mstari unaofuata.
