  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu vipengele vya Kiebrania: “kutoka kwa miungu ya,” mataifa/watu wanaowazunguka wasikilizaji, ulinganifu wa walio karibu na walio mbali, na msemo wa upeo wa kijiografia “kutoka mwisho mmoja ... hadi mwisho mwingine.” Mabadiliko ya kiambishi kutoka wingi katika “yanayowazunguka” hadi umoja katika “nawe” yanaendana na maandishi ya chanzo, ambayo yana “wenu” kisha “wewe.”'
