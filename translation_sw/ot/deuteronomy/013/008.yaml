  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: מֵ/אֱלֹהֵ֣י הָֽ/עַמִּ֗ים אֲשֶׁר֙ סְבִיבֹ֣תֵי/כֶ֔ם הַ/קְּרֹבִ֣ים אֵלֶ֔י/ךָ א֖וֹ הָ/רְחֹקִ֣ים מִמֶּ֑/ךָּ מִ/קְצֵ֥ה הָ/אָ֖רֶץ וְ/עַד קְצֵ֥ה הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/008.yaml
  text: from the gods of the peoples that are around you[a], whether near to you or far from you, from one end of the earth to the other end of the earth—
translation:
  language: sw
  text: kutoka kwa miungu ya mataifa yanayowazunguka, yaliyo karibu nawe au yaliyo mbali nawe, kutoka mwisho mmoja wa dunia[a] hadi mwisho mwingine wa dunia—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nchi.” Neno la Kiebrania אֶרֶץ linaweza kumaanisha “dunia” au “nchi”; hivyo msemo mzima unaweza kutafsiriwa, “kutoka mwisho mmoja wa nchi hadi mwisho mwingine wa nchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֱלֹהֵי
  choice: kutoka kwa miungu ya
  rationale: Kiambishi מִן kinaonyesha chanzo au mahali ambako ushawishi unatoka; tafsiri hii ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: הָעַמִּים
  choice: mataifa
  rationale: Katika muktadha huu עַמִּים humaanisha makundi ya watu yenye utambulisho wa pamoja. “Mataifa” ni neno la kawaida na linaloeleweka vizuri katika Kiswahili cha Biblia.
- source_word: אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: yanayowazunguka
  rationale: Huhifadhi maana ya mahali ya סְבִיבוֹת pamoja na wingi wa watu wanaozungumziwa katika kiambishi כֶם.
- source_word: הַקְּרֹבִים אֵלֶיךָ
  choice: yaliyo karibu nawe
  rationale: קָרוֹב huonyesha ukaribu wa mahali; “karibu nawe” ni usemi wa asili na unaolingana na “mbali nawe.”
- source_word: אוֹ הָרְחֹקִים מִמֶּךָּ
  choice: au yaliyo mbali nawe
  rationale: רָחוֹק huonyesha umbali; tafsiri hii inadumisha ulinganifu wa karibu na mbali.
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: kutoka mwisho mmoja wa dunia hadi mwisho mwingine wa dunia
  rationale: Msemo huu unaonyesha upeo mpana kabisa wa kijiografia. Kurudia “dunia” kunaakisi muundo wa Kiebrania na kuhifadhi nguvu yake ya balagha.
theological_decisions:
- issue: Upeo wa הָאָרֶץ katika msemo wa mwisho
  choice: dunia
  alternative: nchi
  rationale: אֶרֶץ inaweza kumaanisha “dunia” au “nchi.” Katika msemo huu wa kutoka mwisho mmoja hadi mwingine, “dunia” huwasilisha kwa kawaida zaidi upeo mpana unaokusudiwa, huku uwezekano wa “nchi” ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. Alama ya mwisho inaonyesha kuwa sentensi inaendelea kutoka au kuelekea muktadha unaoizunguka.
