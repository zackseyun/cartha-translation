  text: כִּי֩ אֶת אֲשֶׁ֨ר יֶשְׁנ֜/וֹ פֹּ֗ה עִמָּ֨/נוּ֙ עֹמֵ֣ד הַ/יּ֔וֹם לִ/פְנֵ֖י יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/אֵ֨ת אֲשֶׁ֥ר אֵינֶ֛/נּוּ פֹּ֖ה עִמָּ֥/נוּ הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/014.yaml
  text: but with whoever is standing here with us today before Yahweh our God[a], and with whoever is not here with us today.
translation:
  language: sw
  text: bali na yeyote anayesimama hapa pamoja nasi leo mbele za Yahweh Mungu wetu, na yeyote ambaye hayupo hapa pamoja nasi leo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno “yeyote ambaye hayupo hapa pamoja nasi leo” yanaweza kumaanisha Waisraeli ambao hawakuwapo katika kusanyiko, vizazi vijavyo, au makundi yote mawili.
    reason: Kuhifadhi kutobainishwa kwa wale wanaorejelewa katika Kiebrania.
lexical_decisions:
- source_word: כִּי
  choice: bali
  rationale: Katika muktadha, neno hili linaendeleza tofauti na kauli ya mstari uliotangulia kwamba agano halifanywi na waliopo peke yao; hivyo “bali” linafaa kuliko kiunganishi cha sababu.
- source_word: אֶת אֲשֶׁר
  choice: na yeyote
  rationale: Kiashiria cha yambwa pamoja na kishazi rejeshi kinataja watu wanaohusishwa katika agano na kiapo. “Na” linachukua muundo wa agano kutoka mstari uliotangulia, huku “yeyote” likihifadhi maana ya kumtaja kila mmoja.
- source_word: יֶשְׁנוֹ פֹּה עִמָּנוּ
  choice: hapa pamoja nasi
  rationale: Muundo huu unaonyesha kuwapo kimwili katika kusanyiko. Kiswahili hakihitaji kitenzi tofauti cha “kuwapo” kwa sababu “anayesimama hapa pamoja nasi” tayari kinatoa maana hiyo kwa kawaida.
- source_word: עֹמֵד
  choice: anayesimama
  rationale: Huhifadhi picha halisi ya kusimama katika kusanyiko mbele za Mungu badala ya kuifasiri kwa jumla kuwa “aliyepo.”
- source_word: הַיּוֹם
  choice: leo
  rationale: Ni tafsiri ya kawaida na ya sasa ya alama hii ya wakati, iliyorudiwa katika vishazi vyote viwili kwa kusisitiza.
- source_word: לִפְנֵי
  choice: mbele za
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha hali ya kuwa mbele au katika uwepo wa mtu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Linawakilisha moja kwa moja jina binafsi la Mungu katika maandishi ya Kiebrania.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye kiambishi cha nafsi ya kwanza wingi.
- source_word: וְאֵת אֲשֶׁר אֵינֶנּוּ פֹּה עִמָּנוּ
  choice: na yeyote ambaye hayupo hapa pamoja nasi
  rationale: Hulinganisha kishazi cha kwanza na kuhifadhi ukanushaji wa kuwapo bila kuamua ikiwa wanaorejelewa ni Waisraeli waliokosekana, vizazi vijavyo, au wote wawili.
theological_decisions:
- issue: Wigo wa washiriki wa agano ambao “hawapo hapa pamoja nasi leo”
  choice: Kuacha rejeo hilo wazi, bila kutaja kundi maalumu
  alternative: Kulieleza kuwa vizazi vijavyo, Waisraeli wa wakati huo waliokosekana katika kusanyiko, au makundi yote mawili
  rationale: Kiebrania hakibainishi kundi linalokusudiwa. Tafsiri inapaswa kuhifadhi upana huo wa maana badala ya kutatua swali la kifafanuzi ambalo maandishi yenyewe hayatatui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mwanzo “bali na” kwa makusudi unaendeleza sentensi na muundo wa agano kutoka mstari uliotangulia; “anayesimama” huhifadhi taswira halisi ya maandishi.
